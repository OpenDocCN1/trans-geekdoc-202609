    The updates, as described in the fact sheet, have not been adopted yet. The Commission’s
    proposals, once the details have been agreed to, will be passed on to the European
    Parliament and EU Member States, meeting in the Council of Ministers, for discussion.
    It is expected that these changes to the `Directive` will be adopted by the end
    of 2015 or early 2016. The updated directive will take effect 2 years after it
    is adopted.


    What does this mean for cloud storage security and privacy? As we discussed in
    [Chapter 2](#chp002.xhtml#chp002), the terms of service and privacy policies of
    “free” services require that users give up private information in exchange for
    free services, such as those provided by Google, Yahoo!, Twitter, and others.
    While these services do require that the user provide “explicit” consent when
    when agreeing to the use of their private data, and they do inform the users as
    to what they will do with their data, the concept of the “right to be forgotten”
    is not addressed.


    The right to be forgotten has implications to both citizens and to companies doing
    business in the EU. Even before the updated directive is issued, lawsuits have
    been brought against data companies based on the existing directive from 1995
    and subsequent modifications. Google was sued in EU court by a Spanish citizen
    who wanted the Google search engine to delete personal information about him that
    stems from an auction notice of his repossessed house in 1998. The case worked
    its way to the top European court where Google was ordered to delete “inadequate,
    irrelevant or no longer relevant” data from its results when a member of the public
    requests it. Strangely, the site that hosts the information can continue to make
    the information available.


    A Google spokesperson said: “The ruling has significant implications for how we
    handle takedown requests. This is logistically complicated not least because of
    the many languages involved and the need for careful review. As soon as we have
    thought through exactly how this will work, which may take several weeks, we will
    let our users know.”


    As of May 2014, more than 247,000 requests “to be forgotten” were received by
    Google based on the European ruling.


    While this ruling focused on links to outdated data, the proposed changes to the
    EU `Directive` could have far reaching consequences for data collectors, social
    media services, free services, cloud providers, data aggregators, etc. As pointed
    out in [Chapter 2](#chp002.xhtml#chp002), many companies make their money by collecting
    and selling personal data for targeted advertising. This data is collected, aggregated,
    combined with public information, and sold many times over. Imagine what it would
    take to accomplish this request from a single individual: “I am exercising my
    right to be forgotten, please remove any and all data that pertains to me.”


    ## 4.4.2 United Kingdom’s Data Protection Act 1998


    While the EU `Data Protection Directive` aims at providing a unified standard
    for data protection and regulation across Europe, many European countries have
    their own laws and regulations in place.


    The United Kingdom’s `Data Protection Act 1998` and subsequent amendments is how
    the United Kingdom implements the European `Directive`. The purpose of the `Act`
    is to protect the rights and privacy of individuals and to ensure that data about
    them is processed only with their knowledge and consent. The `Act` gives individuals
    certain rights regarding personal information held about them and places certain
    obligations on those who process the personal information. Like the EU `Directive`,
    the `Act` defines two distinct groups: data controllers – those that process the
    personal information and data subjects – those whose data are subject to.


    ### 4.4.2.1 Data Protection Principles


    These obligations are defined in a set of eight Protection Principles:

    - Used fairly and lawfully.

    - Used for specifically stated purposes.

    - Used adequately and not excessively.

    - Accurate.

    - Kept no longer than absolutely necessary.

    - Handled according to.

    - Kept safe and secure.

    - Not transferred outside the UK without adequate protection.


    There is stronger legal protection for sensitive information:

    - Ethnic background

    - Political opinions

    - Religious beliefs

    - Health

    - Sexual orientation

    - Criminal records


    ### 4.4.2.2 Regulation and Enforcement


    The regulation and enforcement of the `Act` is the responsibility of the `Information
    Commissioners Office` (`ICO`). If a data subject feels that a data controller
    has not complied with the `Act` they have:

    - The right to ask the `ICO` to investigate.

    - The right to sue.


    The `Act` also treats it as a criminal offence if:

    - A data controller having received a subject access request destroys the data.

    - A data controller discloses personal data without authority.

    - A data subject does not comply with an enforcement notice.

    - A data subject knowingly or recklessly obtains, discloses or procures the disclosure
    of personal information without the data controller.


    ## 4.4.3 India – Information Technology Act 2000 (IT Act)


    The basic regulations governing information technology in India are defined in
    the `Information Technology Act of 2000`, and subsequent amendments and clarifications
    of the law. It is commonly referred to as the `IT Act`.


    There are two sections of India’s `IT Act` that address personal privacy. Section
    `43A` of the `IT Act` provides for the protection of sensitive personal data.
    In the United States this type of data would be called personally identifiable
    information (`PII`). Companies and organization that process and/or store `PII`
    must implement and maintain “reasonable security practices and procedures.” If
    data handlers do not implement these security best practices and procedures and
    as a result causes “wrongful loss or wrongful gain to any person,” it may be required
    to pay damages.


    The `IT Rules`, outlined under section `43A` of the `IT Act`, define “reasonable
    security practices and procedures” that must be implemented, and what constitutes
    “sensitive data and information.” The `IT Act` and the `IT Rules` regulate the
    collection and use of sensitive personal information.


    The Indian government has also proposed specific legislation on privacy beyond
    the current `IT Rules`, called the `Privacy Bill`, which enhances an individual’s
    right to privacy. In the bill, individual privacy rights cannot be infringed except
    for:

    - Protection of India’s sovereignty or integrity.

    - National security.

    - Prevention of commission of crime.

    - Public order.


    Unauthorized collection, processing, storage, and disclosure of personal information
    are treated as infringement of privacy under the `Privacy Bill`.


    ### 4.4.3.1 Sensitive Personal Data


    Under the `IT Act` sensitive personal data means any personal information that
    the government considers as such, and does not have a specific definition. Currently,
    the `IT Rules` consider sensitive personal information as relating to:

    - Medical records and history.

