    ## 3.3 法律问题


    我们在 第 2 章 中涵盖了云存储的许多方式。在这里我们关注其他法律问题。


    ### 3.3.1 旅游


    你对认为认为是公共和私人数据的看法可能会影响你的旅行能力。美国拒绝了两名英国游客的入境，他们推文了被美国官员认为的笑话


    执法人员可以要求访问你的云数据的条件在不同国家之间可能存在差异。例如，以色列安全人员经常要求访问在以色列和巴勒斯坦领土之间往来人员的电子邮件。拒绝的人会被驱逐


    ### 3.3.2 地点、位置、位置


    地理法律管辖具有影响。你的云数据实际存储的位置可能会影响你的隐私。最近，美国的一一个法院命令 `Microsoft` 为药物调查提供客户的电子邮件。然而，这些电子邮件存储在爱尔兰都林的
    `Microsoft` 服务器上。`Microsoft` 以隐私和搜查令的法律管辖为由拒绝了。然而，美国的一个法院裁定在线数据的搜查令实际上代表传票，并认定
    `Microsoft` 必须提供来自服务器的电子邮件


    ### 3.3.3 雇主与保险公司


    雇主对员工的云数据感兴趣。这些数据可以帮助雇主了解员工所做或所想的，可能会影响公司声誉、员工工作表现或公司的健康保险成本。例如，许多公司希望就更高的健康保险成本向员工收取额外费用


    保险公司收集人口统计和生活方式数据以建立个人风险模型，并据此设定保费。保险公司可以挖掘公共云数据以获取支持不赔赔或增加保费的信息。从保险公司的角度来看可以理解，但云数据所有者的数据仍被用于对其不利的，且并非他们提供这些数据的目的。


