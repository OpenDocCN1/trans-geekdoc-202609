    if you cannot find a cloud storage provider that meets your data privacy needs.
    We mention specific products and companies to give examples of the kinds of privacy
    tools available. These mentions do not reflect endorsements of these products
    or companies. Only you can make such judgments about your data privacy requirements.
    Use the information here as a starting point for your own privacy tool investigations
    and evaluations.


    ## 5.1 Two-factor Authentication


    Two-factor authentication makes your mobile device a tool to protect the privacy
    of your cloud data. Two-factor authentication requires you to initiate a login
    to your cloud storage account with a user name and password. Next, a one-time
    passphrase is sent to your mobile device to complete the login process.


    This second step of the two-factor authentication supports data privacy in two
    ways. First, attempts by attackers to access your cloud data online will fail
    because the attackers do not have the final passphrase unless they have also obtained
    your mobile device. Second, you will receive notification of any attempts to access
    your cloud data storage account. In the worst case, attackers might guess the
    one-time phrase and gain access to your data, but it is highly unlikely. However,
    two-factor authentication will at least alert you to the attack.


    Two-factor authentication does have a drawback in that it requires having your
    mobile device with you when you access your data. This can be a problem if you
    forget or lose your device, someone steals it, or the battery has no charge. Data
    could be stored in multiple locations, but storing or caching your private data
    in multiple places means you have multiple issues to consider for keeping it secure.


    Small companies and organizations that share data via commercial providers like
    Google Drive and Dropbox can require two-factor authentication for their employees
    and customers to access data. This solution requires coordination (and trust!)
    of all parties involved to ensure they do in fact have two-factor authentication
    on their accounts that they use to access shared data.


    Alternatively, companies and organizations may want to use a private cloud and
    host the data themselves. Again, they might use two-factor authentication or provide
    some other secure interface to the cloud data. For these options, they will need
    to (1) configure their web server to generate one-time passwords and (2) provide
    a mechanism for users to also generate the same password. There are commercial
    products available to facilitate this option. This solution requires some upfront
    costs for setup and maintenance by the IT department.


    One simple solution for two-factor authentication has the server pre-generate
    a list of passwords and this printed on a piece of paper and given to the user.
    Each time the user logs in, s/he uses the next password. While simple, this implementation
    has problems with running out of passwords before the user gets a new set, losing
    the paper with the passwords, and having the passwords unknowingly copied and
    used by an unauthorized user.


    The Google Authenticator solves these problems by providing a client application
    that generates the same time-based one-time password (TOTP) as the server. Google
    has an Apache server module to provide this capability through the PAM authentication
    framework (


    ## 5.2 Encrypt Yourself


    You can protect the privacy of your cloud data by encrypting data yourself before
    storing it to the cloud. This approach protects data in transit and at rest. Your
    cloud provider only stores the data that you encrypt and that you control. You
    do not upload unencrypted data and have your cloud storage provider encrypted
    it when it arrives. It also means you control the encryption password and/or encryption
    keys.


    Cloud storage providers that offer “client-side” encryption might still have access
    to your password and encryption keys, or may provide actual zero-knowledge encryption.
    Unfortunately some of the encryption password generation schemes used by cloud
    providers have predictable patterns that attackers can discover and exploit. Disadvantages
    of encrypting data yourself means (1) you have to do it, probably in a separate
    step from uploading or downloading, (2) you must manage and protect passwords
    and keys, which can become complicated if you choose to share data.


    Encrypting data yourself before storing it to the cloud allows you (1) to use
    unencrypted cloud storage, (2) to avoid sending the cloud storage provider unencrypted
    data for them to encrypt and possibly data mine, and (3) to avoid trusting zero-knowledge
    encryption.


    Zero-knowledge encryption may have flaws in the implementation that make it possible
    for the provider or others to predict the password or encryption keys. Zero-knowledge
    encryption may not apply when you share your data. In such cases, your unencrypted
    data may exist at least temporarily with the cloud storage provider.


    CipherApps ([http://www.cipherapps.com/](http://www.cipherapps.com/)) provides
    real-time secure collaboration of Google documents and sheets. CipherApps uses
    zero-knowledge encryption to encrypt files saved to your Google Drive through
    their web interface.


    EncFS ([https://vgough.github.io/encfs/](https://vgough.github.io/encfs/)) makes
    it possible to create encrypted user-space file system rooted at an arbitrary
    directory. A separately named mount point allows users an unencrypted view of
    the files. To use EncFS to secure your cloud data, create a directory for EncFS
    in your local cloud storage directory (e.g., Dropbox or Google Drive), then use
    a mount point outside the cloud storage directory.


    Boxcryptor ([https://www.boxcryptor.com/](https://www.boxcryptor.com/)) implements
    EncFS for Windows. Boxcryptor uses a random AES key to encrypt the file and the
    public RSA keys of those with permission to view the file to encrypt this file
    encryption key. Boxcryptor then uploads both the encrypted file and encrypted
    file key(s) together in cloud storage.


    You can roll your own encrypted file system with an encrypted archive file. On
    your local machine you have the directory tree you want encrypted. Use an archive
    tool like 7-Zip ([http://www.7-zip.org/](http://www.7-zip.org/)) to create an
    encrypted archive of this file and upload this encrypted archive to your cloud
    storage.


    ## 5.3 Secure Email for Cloud Storage


    People often use their email accounts to store data and files that they can retrieve
    later or from another device. People might also use the same email account to
    share information and collaborate, either by sending email only to themselves
    or by saving messages as drafts. Private data can exist in the email message body
    or in attached files. While this method has an email interface, it has the same
    fundamental issues associated with explicit cloud data storage. You must protect
    the data in transit to and from the email account, as well as at rest on the email
    server.'
