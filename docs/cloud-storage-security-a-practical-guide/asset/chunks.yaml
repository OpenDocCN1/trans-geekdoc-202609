  trans: '

    量子计算在云安全领域应用中，另一个引人入胜的特性是量子纠缠概念。纠缠允许一组 `qubits` 即使在空间分离的情况下也能表现出高度的相关性。这一属性的意义在于，如果一组纠缠的
    `qubits` 位于不同的位置，其中一个位置的 `qubit` 值的变化也将反映在另一个位置的 `qubit` 取值上——而不需要任何物理连接。（实际上，如果一个位置的
    `qubit` 取值或自旋被解释为 1，那么其纠缠的 `qubit` 的值将为 0，反之亦然，这在解释时很容易被考虑到）。在一篇名为《远距离固态量子比特之间的无条件量子隐态》的研究论文中。


    在未来，量子通信和量子网络可能为云结构中数据的安全传输和存储提供一种新的操作模式，而无需传输加密。仍有许多研究障碍等待克服。正如通常一样，这项新技术将不可避免地带来新的机会和一系列安全挑战。


    ## 7.2.4 存储技术的未来 – DNA


    我们现在来看看存储技术领域的前沿研究，并考虑存储技术的更远未来能“提供”什么。具体来说，我们关注一种可能的未来，它结合了生物学和计算机科学，提供海量的存储能力，可以将数据存储数十万甚至百万年。这种新方法具有当前技术无法提供的某些内置安全功能，但与大多数新技术一样，它也带来了其自身的一系列新安全担忧。


    地球上的每个生物都有一个共同点：它们含有被称为脱氧核糖核酸或 `DNA` 的生命分子指令。`DNA` 中编码了构建、维护和复制生物的指令。`DNA` 中的信息以由四种化学碱基组成的代码存储：腺嘌呤
    (A)、鸟嘌呤 (G)、胞嘧啶 (C) 和胸嘧啶 (T)。人类的 `DNA` 由约 30 亿个碱基组成。碱基的顺序或序列决定了构建生物所需信息，就像字母表的字母按特定顺序形成单词、句子、段落和章节一样。


    `DNA` 碱基两两配对：A 与 T 配对，C 与 G 配对，形成称为碱基对的单位。一个碱基、糖和磷酸在一起称为核苷酸。`Nucleotides` 组成成两条长链，形成一个称为双螺旋的螺旋，如下。


    ![](img/F000071u07-01-9780128029305.jpg)


    双螺旋结构（感谢美国人类基因组研究所的在线术语表 [http://www.genome.gov/glossary/]）


    双螺旋的结构有点像梯子，碱基对形成梯子的横梁，糖和磷酸分子形成梯子的垂直侧边。


    从生物学上我们知道，单链上碱基的顺序决定了遗传密码。碱基以三个一组形成指令或代码（在生物学中称为 `codons`），决定了使用何种氨基酸（构建块）。通过读取
    `DNA` 链上的 `nucleotides`，将称为 `gene` 的氨基酸序列连接在一起形成蛋白质。某些三字母的核苷酸 `codons` 指定了 `DNA`
    链中的起始和结束位置，就像计算机编程语言中的结构 `BEGIN/END`、通信协议中的位序列或文件结束标记一样。


    ## 7.2.5 生物学到计算机科学


    在最简单的情况下，我们可以使用 A-T 碱基对代表二进制 0，用 G-C 代表二进制 1。使用这种编码并遵循生物学结构，每次读取三个 `nucleotides`
    序列，我们每次读取可以表示 `2³` 个二进制值（十进制 0–7）；读取 32 组 3 个 `nucleotides` 将产生 96 位比特，即 12 字节的数据。例如，如果我们看
    `DNA` 图表，会发现前三个碱基对（从顶部开始）是 C-G、T-A 和 G-C，使用我们的编码方案，它们将代表 010。


    该领域的目前研究使用了不同的编码和表示方案。Church、Gao 和 Kosuri 在他们的论文《DNA 中的下一代数字信息存储》中计算出，单链 `DNA`
    每立方毫米可以存储 5.49 petabit（拍比特）。1 个 petabit 等于 1000 terabit，或 `10¹⁵` 位。Church 的实验表明，总的写入、放大和读取过程在
    5.27 megabit 中产生了 10 位错误。


    尽管如此，仍有许多问题需要解决才能将这项技术投入通用。读取和写入 `DNA` 数据都存在问题。凭借现有的生物过程和技术，读取和写入 `DNA` 数据都受到限制。还有时间问题表明，使用当前工艺的
    `DNA` 非常适合长期存储但很少读取的长期数据，例如来自哈勃望远镜项目的存档卫星数据、强子对撞机实验产生的数据，或位于国家档案馆的政府记录和其他信息。


    `DNA` 可以保持稳定并可用数千年，这来自 6 万年前猛犸象的 `DNA` 和 70 万年前马的 `DNA` 证明了这一点。


    `DNA` 作为一种存储机制的另一个有趣特性是，在生物环境中，它会复制自身的副本（大部分情况下）。存在基因变异。复制的能力可以用于数据备份和版本控制。


    ## 7.2.6 DNA 存储与安全


    `DNA` 可以提供一种新形式的加密。A、T、G、C 碱基可以使用算法打乱赋值，与 1 和 0 配对；或者一条 `DNA` 链可能作为另一条链的索引，提供重组原始数据所需的地址加密。存在许多可能性，例如阈值加密，需要来自不同“生物体”的几条
    `DNA` 才能重建原始数据。


    使用这种加密过程将受到法律限制，例如《国际武器贸易条例》(ITAR) 和《出口管理条例》(EAR)，这些是由美国政府管理的出口管制条例。想象一下，当苹果或大米等产品从一个国家运到另一个国家，或者人们在各地旅行时，执行这些条例会有多困难。


    DNA 存储的研究使用了合成 `DNA`，它依赖生物过程来创建人工 `DNA`。这种过程不需要使用预先存在的 `DNA` 序列。使用合成 `DNA` 被认为实验更安全，因此可以避免
    `DNA` 实验的指南和法规。美国国立卫生研究院指南规定，“如果合成 DNA 段不在体内表达为生物活性的多聚核苷酸或多肽产物，则不受 NIH 指南的限制。”Church
    等人表示，长 `DNA` 片段不太可能自我复制或编码任何生物活性物质。细胞倾向于排出不是自己的 `DNA`。然而，如果置于野外，它们可能会被整合到生物体中，在那里没有自然天敌，也没有什么能阻止它们的扩散。


