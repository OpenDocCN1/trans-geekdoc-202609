    Carbonite 在其《数据安全实践》白皮书中描述了为确保数据在在其设施中存储期间的安全性而所采取的步骤，包括：


    - 气候控制数据中心

    - 冗余电源分配

    - 电池备份

    - 不间断电源

    - 带有保障燃料合同的现场发电机

    - 数据中心 24 小时有人守

    - 人员进入数据中心的访问通过生物识别扫描仪和电子钥匙卡控制

    - 安保人员监控所有出口以防止物理盗窃

    - 所有活动均通过闭路电视 (CCTV) 监控

    - 固化的基础设施保护客户免受停电、天气事件或未经授权访问的影响

    - 使用 `RAID 6` 技术增加数据冗余。


    Carbonite 运营着两个数据中心，均位于波士顿。为了避免单点故障问题，数据位于多个地理区域是非常关重要的。虽然波士顿发生的事件可能同时影响两个数据中心的几虽然微乎其微，但这种概率大于零。Carbonite
    的观点是，他们提供的是备份服务，用户计算机与 Carbonite 数据中心之间已经存在地理冗余。


    从法律和司法管辖权的角度来看，Carbonite 受马萨诸塞州法律和美国法律的约束。法律问题的深入探讨见 第 4 章 。


    ## 2.2.2.8 Mozy


    在本节中，我们查看了另一种名为 Mozy 的在线备份服务。从安全角度来看，Mozy 与 Carbonite 有一些相似之处，也有一些独特的功能。


    ## 2.2.2.9 传输数据与静态数据


    与 Carbonite 类似，Mozy 在文件从用户计算机发送到 Mozy 数据中心之前对其进行加密。数据在数据中心存储时也保持加密状态，以提供静态数据安全。


    ## 2.2.2.10 加密


    Mozy 使用 `256-bit AES` 密钥进行加密，这些密钥由 Mozy 软件根据用户输入的密码语创建。密码语仅用户已知，不会与 Mozy 分享。用户须在下载或恢复加密文件时输入此密码语进行访问和解密。记住密码语是用户的责任。Mozy
    对密码语一无所知，因此如果丢失或忘记密码语，它无法解密用户文件。


    这是 Mozy 的默认加密/解密过程——与 Carbonite 默认维护和管理加密密钥不同。从安全角度来看，Mozy 的默认方法更安全，因为只有用户能够解密备份数据：Mozy
    不会也无法解密数据，因此无法访问数据内容。需要强调的是，由于要求用户维护密码语，如果密码丢失将存在数据丢失的风险。


    Mozy 还提供了企业加密密钥选项，使用与之前描述相同的过程，但允许组使用共享密钥（加密/解密 `256-bit AES` 密钥）下载并解密文件。这一概念允许在多个用户之间共享备份，同时保持
    `AES` 密钥的安全性。


    Mozy 的数据中心位于美国、欧盟和全球。根据其网站，主数据中心位于犹他州，并在犹他州普莱森特格罗夫、英国伦敦、爱尔兰科克和中国上海设有办事处。没有列出具体的数据中心位置，这可能是一种安全预防措施。Mozy
    归 EMC 所有，这是一个领先的存储硬件提供商，正如预期的那样，它使用了 EMC 的产品和技术。


    物理安全：数据中心 24 小时有人守，人员访问通过生物识别扫描仪和电子钥匙卡控制。


    ## 2.2.2.11 隐私


    ## 2.2.2.12 结论


    数据在数据中心内冗余存储以防止自然灾害和人为灾害是非常关重要的。当数据位于多个州和外国时，会产生司法管辖权问题。传输数据和静态数据的处理方式不同。在使用云服务时必须考虑许多安全问题。


    ## 2.3 社交媒体


    ### 2.3.1 社交媒体作为云存储


    在本节中，我们关注社交媒体、云存储和隐私。社交媒体的目标与他人分享信息。他人可以定义为一群朋友、家人、工作同事、有相似兴趣的人等。社交媒体也可以用于与任何地方的每个人分享信息和想法。虽然信息隐私和分享似乎处于光谱的两端，但我们将讨论这两种性质在社交媒体上的交汇及其影响。


    据报道，Twitter 和 Facebook 在全球范围的社会政治运动中发挥了关键作用。例如，2010 年 12 月 17 日，一名担任蔬菜贩的、就业不足的年轻突尼尼大学毕业生在警察偷走了他摊位上的蔬菜后自焚。这一事件引发了突尼革命并蔓延到整个阿拉伯世界，因为年轻的突尼人开始在
    Twitter 和 Facebook 上组织活动，抗议齐内·阿比迪·本阿里总统执政 23 年的政权。2011 年 1 月 14 日，本阿里总统逃离了突尼，这此引发了从北非到伊朗的地区类似运动。


    另一个例子：2015 年感恩节期间，曼哈顿的几千人试图中断年度梅西百感恩节游行，作为对密苏里州费尔格森大陪审团裁决抗议的一部分。示威者在 Twitter 上使用标签
    `#Stoptheparade` 来号召支持者加入他们的事业。


    有趣的是，这最早由英国《每日邮件报》在线版报道，并带有以下页脚：


    ```

    Follow us: @MailOnline on Twitter | DailyMail on Facebook

    ```


    ### 2.3.2 案例研究：社交媒体安全性比较（Facebook 和 Twitter）


    隐私是你控制个人信息以及你愿意与他人分享内容的权利。在本节中，我们分析了 Facebook 和 Twitter 的隐私政策，因为全球用户正在分享他们的个人信息、想法和观察。


    #### 2.3.2.1 问题


    - 收集了哪些信息？

    - 与谁分享？

    - 他们对这些数据做了什么？

    - 数据存储在哪里？

    - 提供了哪些保护措施可供？


    #### 2.3.2.2 安全概念

