    ### 2.1.3.14 来自 Yahoo! 隐私政策


    ……广告将基于我们对您的通信内容和含义的理解。例如，我们会扫描并分析电子邮件信息，以识别含义的关键元素，然后对这些信息进行分类，以供当前和未来使用。


    `Yahoo!` 还会对电子邮件内容进行扫描和分析。我们假设这也适用于附件，尽管该政策并未专门说明这一问题。


    ### 2.1.3.15 为增加安全和隐私可以采取的措施


    为了提高电子邮件的安全性和隐私，最佳解决方案是加密。这需要加密密钥管理，涉及密钥创建、安全存储和密钥分发。虽然目前存在电子邮件加密解决方案（如 `PGP`），但它们需要一定程度的技术水平，可能超出了许多用户的范围。只有当发送者和接收者都使用相同的加密和密钥管理时，加密邮件才能生效。


    ### 2.1.3.16 结论


    三大邮件服务提供商 `Gmail`、`Yahoo! Mail` 和 [Outlook.com](http://Outlook.com) 使用 `HTTPS`
    提供安全传输数据。它们都通过添加加密功能更新了处理数据中心之间移动数据的方式。静态数据则以未加密的形式存储。鉴于从用户处收集并与外部数据汇总的信息，存在数据隐私担忧。`Google`
    和 `Yahoo!` 会扫描并分析进出其邮件服务的邮件内容，以及存储时的邮件。这适用于从任何邮件账户发送到其邮件系统的邮件，这引发了隐私担忧。[Outlook.com](http://Outlook.com)
    似乎只对内容进行病毒扫描。


    在美国，电子邮件和元数据受民事和刑事诉讼的管辖。访问邮件和附件内容需要法院传票。来自联邦机构的国家安全信件允许联邦政府访问邮件元数据；而联邦政府要访问邮件内容则需要法院命令。国家安全信件可能禁止邮件服务提供商就该行动进行通知、确认、否认或讨论任何内容。


    ## 2.2 云备份服务


    ### 2.2.1 背景


    从计算开始初，确保数据的备份和安全一直是至关重要的需求——尽管这种需求往往被推迟到以后。由 [backblaze.com](http://backblaze.com)
    进行的一项调查显示……


    这种行为为公司将计算机用户连接到云服务提供了商业机会。随着高速互联网和廉价云存储的出现，许多公司现在提供廉价且自动的文件备份。其中最大且最成功的是 `Carbonite`
    和 `Mozy`。截至 2015 年，至少有 50 种云备份服务可用，每天都有新的启动。`Google`、`Microsoft` 和 `Amazon` 等大型互联网公司开始提供类似的服务。


    这让我们回到本书的核心：使用服务提供商将数据备份到云端有哪些安全和隐私影响？


    ### 2.2.2 案例研究：云备份安全性比较


    在本节中，我们将检查云数据备份的安全问题。我们将使用案例研究方法，来说说明在将数据信任给第三方时会遇到的各种安全问题。


    #### 2.2.2.1 问题


    传输中的数据和静态数据安全吗？备份提供者的隐私政策是什么？备份提供商可以访问存储的数据内容吗？如果数据在存储时被加密，谁持有加密密钥？备份数据是否冗余存储？数据是否存储在多个位置？存储设施是否有物理安全保障？数据存储在哪些国家？谁拥有管辖权？法律问题有哪些？


    #### 2.2.2.2 安全概念


    之前讨论的传输数据和静态数据的安全概念也适用于备份数据。也就是说，数据在源地和目的地之间传输时是脆弱的。在这种情况下，是指包含待备份数据的设备与存储（或备份到的）数据的服务器之间。


    对于传输数据，可以使用 `SSL/TLS`。`HTTPS`（使用 `SSL/TLS` 的高层协议）并未被主要使用。相反，备份服务提供商使用专有软件管理备份过程，并将
    `SSL/TLS` 作为其安全传输功能的一部分。


    对于备份数据存储，通常使用加密来确保静态数据的安全。由于数据被存储在外部位置（可能是多个位置），必须将设施的物理安全作为静态数据的一个组成部分进行考虑。例如：


    - 设施基础设施如何？

    - 物理结构能防范入侵者和自然灾害吗？

    - 是否有 24 小时安保？

    - 谁可以访问设施？

    - 访问控制措施是什么？

    - 员工是否经过背景审查？

    - 设施内的数据是否有冗余备份？

    - 数据中心是否在地理上分散？

    - 针对网络攻击采取了哪些预防措施？


    #### 2.2.2.3 方法与结果


    为了确定数据备份提供商提供的安全水平，我们检查了服务提供商的服务条款（TOS）、隐私政策和其他公开信息。


    在本节中，我们评估了 `Carbonite` 和 `Mozy`。这些在线备份服务通过供应商提供的软件或专门的移动设备应用程序访问。该服务是云端 `SAAS`，文件和目录结构存储在云端。


    #### 2.2.2.4 Carbonite


    我们首先从安全角度分析 `Carbonite` 备份服务的安全性，将它们的解决方案与我们的安全问题进行对比。


    #### 2.2.2.5 传输中的数据


    `Carbonite` 通过两种方式处理传输中的数据。首先，在待备份文件的主机计算机上使用 `128-bit Blowfish` 加密；其次通过使用 `SSL`
    连接的专有应用程序传输到其数据中心之一。


    #### 2.2.2.6 静态数据


    `Carbonite` 支持两种加密和密钥控制。默认情况下，它们使用高级加密标准（AES）`128-bit` 加密创建、管理并安全存储加密密钥。让 `Carbonite`
    管理密钥有几个优点：首先，它让用户无需承担加密和解密文件的任务；其次，用户无需确保密钥的备份和安全。通过将加密解密过程交给 `Carbonite`，简化了跨设备的数据共享。如果需要恢复数据，用户可以使用账户用户名和密码访问备份数据。注意：这意味着你的数据安全性取决于你的密码。


    使用默认方法的缺点是 `Carbonite` 可以在你不知情的情况下解密你的数据，尽管它们的政策声称仅在特定情况下这样做，例如在响应法院命令的传票时。


    `Carbonite` 还提供了由用户自行创建、控制和管理加密密钥的选项。在这种情况下，备份文件在移动到 `Carbonite` 数据中心之前已使用 `AES`
    `256-bit` 加密。这种方法的缺点是用户必须自己管理、存储和保护密钥。恢复备份数据也需要用户提供的私钥。


    用户控制和管理的加密密钥的优点是 `Carbonite` 的任何人都无法读取你的数据。在响应法院命令的传票时，`Carbonite` 只能提供加密数据。然而在法院命令下，你可能被要求提供加密密钥。


    #### 2.2.2.7 设施安全


