- fmt: '

    Your contact list may leak information about the social networks of other people.
    People in your contact list may not know one another, but it represents a link.
    If someone participates in extremist blog postings and has you on their contact
    list, then you become linked to that activity too. If people connect you to crazy/dangerous,
    then they will put you in that category too, and you may never fully convince
    them otherwise.


    Emailing large numbers of people using `CC` instead of `BCC` exposes everyone’s
    email address to everyone else. Spammers and hackers put high value on valid email
    addresses. If anyone who received one of these emails has their email account
    hacked, then everyone on the list becomes vulnerable to spammers and hackers.
    In addition, it reveals social network linkages. Inviting people to join groups
    by providing an email address, or emailing news story links to people gives others
    information about those people without their permission.


    Sharing files with others via `Dropbox` or `Google Drive` can also jeopardize
    the security of your data and that of others. Default sharing options on these
    sites often allow those you share files with, to share those files with others.
    Etiquette says that invited guests should not themselves invite guests. The same
    should hold for sharing cloud data. Take care that default security settings on
    cloud data you choose to share does not allow others to share that data too. Also,
    realize this only prevents unintentional, one-click sharing and not intentional
    sharing.


    You have a responsibility when accessing cloud data that belongs to you and to
    others. Retrieving data from the cloud on an unsecured or unapproved device can
    create problems for you and others. For example, many people read personal email
    or file attachments at work, for example photos. This constitutes a breach of
    privacy and security because these data get cached and decrypted on the company
    computer. If your company has an `IT department`, then you must be aware that
    they will routinely search computers for abuses of company resources. They will
    find the data you downloaded, which could lead to embarrassment or harm to you
    and others. Similar issues exist when employees by accident or malice download
    data from cloud storage to unauthorized devices.


    You might put research data (academic or marketing) in the cloud to share with
    others for collaboration. While this data might not contain personally identifiable
    information about the people used in your research, the data records could contain
    enough unique values that someone could re-identify, with high probability, the
    people in the study by linking these records with similar records from other data
    sources. The US Census uses a number of strategies to prevent unauthorized disclosure
    of personally identifiable information.


    ## 1.2.2 Getting Your Data In and Out of the Cloud


    People migrate their data to the cloud so they can access it anytime and anywhere.
    However, if you can get your data in and out of the cloud anytime and anywhere,
    then so can others.


    Security issues arise at the endpoints and network connection. The device you
    use to access the cloud has security vulnerabilities. The cloud storage provider
    has vulnerabilities, both external and internal. Data in motion through the network
    also experiences security vulnerabilities.


    Your device (phone, tablet, `PC`, `XBox`, etc.) and the software on it used to
    access cloud data creates privacy and security risks. The device itself may auto-connect
    to a common wireless network service set identifier (`SSID`). A hacker can set
    up a fake Wi-Fi hotspot with that same `SSID` and your device will happily connect
    to it. This makes it possible for man-in-the-middle attacks that give attackers
    full access to your security credentials and data. Old versions of the operating
    system or software with security holes may give attackers a base to target your
    data. Software, including web browsers, used to access your data may remember
    passwords or keep you logged in to those accounts. The devices may store a local
    copy of your data. Thieves can easily steal small devices like smart phones and
    tablets. Others may borrow your phone too. Both situations leave your data vulnerable
    to theft or discovery.


    Wi-Fi hotspots, including your home Wi-Fi, may expose your data to others. Hackers
    can set up evil-twin Wi-Fi access points to mimic legitimate Wi-Fi networks. Connecting
    to an evil-twin allows hackers to sniff your unencrypted traffic or redirect you
    to fake sites to get your login credentials.


    Using `HTTPS/SSL/TLS` to connect to the Internet and to your cloud storage provider
    does not guarantee privacy or the security of your data. Companies or hackers
    can set up proxy appliances to intercept network traffic, thereby inserting themselves
    as the man-in-the-middle of your secure network connections. With a proxy appliance
    present on the network, your browser or application securely connects to the proxy,
    which can decrypt, inspect, and modify your data, before sending it on its own
    secure connection to your cloud provider. Note that some antivirus software also
    does `HTTPS/SSL/TLS` inspection.


    You can usually detect a proxy appliance when the website that you connect to
    uses an Extended Validation (`EV`) certificate. `HTTPS`-capable web servers provide
    a certificate signed by a Certificate Authority (`CA`) to prove its identity as
    part of the connection setup. Servers using Extended Validation (`EV`) certificates
    enable browsers like `Firefox` and `Chrome` to verify a direct secure connection
    via their own list of trusted `CA`. [Figures 1.1](#chp001.xhtml#f0010) and [1.2](#chp001.xhtml#f0015)
    below show how a secure connection to `Dropbox` should appear in `Chrome` and
    `Firefox`.


    ![Figure 1.1 Extended Validation (EV) certificate in Chrome.](images/F000010f01-01-9780128029305.jpg)


    Figure 1.1 Extended Validation (EV) certificate in Chrome.


    ![Figure 1.2 Extended Validation (EV) certificate in Firefox.](images/F000010f01-02-9780128029305.jpg)


    Figure 1.2 Extended Validation (EV) certificate in Firefox.


    If you do not see the green padlock then you do not have a secure connection and
    may have a proxy appliance between you and the Internet. Forewarned means forearmed.


    Finally, your cloud storage provider completes the chain of data privacy and security
    vulnerabilities, which can exist in network hardware, computer servers, the physical
    facility, staff, and policy. Cloud providers use virtualization or multi-tenancy
    to efficiently manage their resources. Hackers can exploit software bugs or use
    forensic tools to access this data. Vulnerabilities exist to the physical security
    of the data centers from outside security threats such as man-made and natural
    disasters. Company policies regarding who has access to customer data and under
    what circumstances also has an affect on data security, as well as the thoroughness
    of the employee vetting process.


    ## 1.2.3 Legal Versus Criminal Threats


    In this section we highlight the scope of legal and criminal threats to data placed
    in cloud storage.


    ### 1.2.3.1 Legal Threats


    Legal threats to your cloud storage data will typically come from the following:


    - Cloud provider terms of use

    - Copyright and file-sharing

    - Civil litigation

    - Legal search warrants

    - Local laws given your location

    - Local laws given your cloud storage data center


    Cloud data storage providers may have terms of use which may permit them broad
    access to your metadata and to your data content. Terms of use may have ambiguous
    language that makes confidentiality ambiguous. Legal ambiguity could mean going
    to court to defend your privacy and data security, a long and costly process with
    no guarantee of success. Remember, you agreed to the terms and conditions, ambiguities
    included, in exchange for free cloud data storage. Fee-based accounts should give
    you more privacy and security, but do not assume this.

