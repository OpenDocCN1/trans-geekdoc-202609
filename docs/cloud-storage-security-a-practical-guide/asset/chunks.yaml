    ## 2. 邮件客户端 – 邮件客户端可能存在可以被利用的安全性漏洞，或者设备上运行的其他应用程序可能存在漏洞，这些漏洞可用于访问邮件账户信息。某些开发的应用程序（包括移动设备应用）包含后门、数据采集和外泄功能，而用户会自愿地将其作为免费应用安装到设备上。阅读服务条款（`TOS`）和隐私政策中的细则至关重要。


    ## 3. 传输中通信 – 在发送邮件的客户端与邮件服务器接收邮件的途中，邮件数据可能会被截获。在此之前，大多数邮件以明文形式发送，可以而易举地截获并读取。目前，大多数基于浏览器的邮件使用超文本传输协议安全版（`HTTPS`）提供的加密技术，它将
    `HTTP` 封装在 `SSL/TLS` 安全协议之上，为客户端和服务器之间提供安全传输。


    ## 4. 终端用户行为 – 攻击者可以使用多种机制针对终端用户发起攻击，例如钓鱼攻击，在这种攻击中，用户通过点击来自熟人士的邮件附件或网页链接发挥主动作用。这种技术可以用于破坏用户的安全、网络上其他人的安全以及存储在本地服务器和云端的数据。最近公布的一个案例显示，向美国国务院的一名用户发送了一封邮件，导致该部门的网络遭到泄露。此次泄露随后被用于渗透白宫的非机密网络，那里存储着包括美国总统每日日程在内的数据。这种类型的漏洞已经存在多年，并且仍然有效，因为它利用了一个众为人知的动态漏洞：人类行为。解决方案是用户培训和提高用户意识。


    本节的重点是识别使用云端邮件时涉及的安全问题，并调查目前这些云端实现方案是如何解决这些问题的。鉴于上述的四个领域，我们的重点是第四点，即涉及邮件和附件的存储。


    ### 2.1.3 案例研究：云端邮件安全性比较（Gmail,[Outlook.com](http://Outlook.com) (Hotmail),Yahoo!
    Mail）


    ### 2.1.3.1 问题


    云端邮件有多安全？邮件和附件可以被发送者和接收者以外的任何人读取吗？隐私是否面临风险？可以做什么让邮件更安全？


    ### 2.1.3.2 安全概念


    如前所述，从安全角度来看，发送和接收邮件存在两个关注领域：邮件的传输和邮件的存储。它们分别称为“运动中数据”（data in motion）和“静态数据”（data
    at rest）。当数据（在此例中为邮件）从一个用户发送到另一个用户时，它会经过许多路由器和服务器，最后投递到目的地进行存储。基于浏览器的邮件可以使用 `HTTPS`
    来加密源和目的地之间的邮件流量。如果仅使用 `HTTP`，邮件通常是明文或 `base-64` 编码，这意味着它是以一种易于读取的格式从源传输到目的地的，因此是不安全的。`HTTP`
    可用于传输加密的邮件内容，由于其在传输过程中经过了加密，因此被认为是安全的。


    邮件到达目的地后，可以在存储之前对文本和附件进行加密。加密是一种使用密钥和算法将数据（在此例中为邮件消息正文）转换为编码形式的方法，这种方法使得数据在不知道密钥的情况下无法被读取。当数据被加密时，除了拥有密钥的接收方外，其他人能够解密数据并将其转换回可读格式的概率很低。（*注*：“低概率”并不意味着零。如果有人有足够的动力，可以使用某些技术破解加密文本。）


    ### 2.1.3.3 个人可识别信息 (PII)


    `OMB 备忘录 M-07-1616` 中定义的 `PII` 是可以用于区分或追踪个人身份的信息，无论是单独使用还是与特定个人关联或可关联的其他个人或识别信息相结合。`PII`
    的定义并不限于任何单一类别的信息或技术。相反，它需要对个人被识别的特定风险进行逐一评估。在进行此类评估时，机构必须认识到，只要公开（通过任何媒介和任何来源）任何额外信息，非
    `PII` 就可能变成 `PII`——因为这些信息与其他可用信息结合后，可以用于识别个人。


    ### 2.1.3.4 方法与结果


    为了确定云端邮件提供商提供的安全水平，我们检查了服务提供商的 `TOS` 协议、隐私政策和其他公开信息。


    在本节中，我们评估了 `Gmail`、`Yahoo! Mail` 以及原 Hotmail 的 `[Outlook.com](http://Outlook.com)`。这些邮件服务（通常）通过网络浏览器或专门的移动设备应用访问。这些邮件服务是邮件内容存储在云端的
    `SAAS`。


    ### 2.1.3.5 传输中数据


    所有三个邮件提供商在客户端与服务器之间的邮件传输都使用了 `HTTPS`。这为运动中数据提供了安全连接。以下是登录 `[gmail.com](http://gmail.com)`
    的 示例：


    https://accounts.google.com/ServiceLogin?service=mail&continue=https://mail.google.com/mail/


    `HTTPS` 协议用于登录服务，提供了身份验证期间密码的安全传输。`HTTPS` 也用于邮件会话。对于 `Yahoo! Mail` 和 `[Outlook.com](http://Outlook.com)`
    也是如此。


    最近发现包括 `Gmail` 在内的 Google 数据以未加密的形式在 Google 数据中心之间传输。Google 在数据中心之间移动数据是为了提供负载均衡、数据备份、快速访问等。


    ### 2.1.3.6 静态数据


    `HTTPS` 为用户和服务提供商服务器之间提供了数据安全和隐私。但在邮件投递到服务器后发生了什么？存储时安全吗？当存储在云端时是否任何人可以访问邮件内容？


    简短的回答是，没有任何提供商对存储在云端的邮件进行加密。他们加密并保护了登录信息，但没有保护邮件实际内容。


    ### 2.1.3.7 物理安全


    邮件提供商保护存储数据的设施并控制对存储邮件服务器的物理访问也同样重要。


    根据 Yahoo! 网站，“Yahoo! 维护合理的物理、电子和程序安全措施，符合联邦法规，以保护您的个人信息 (PII)。”从这一声明中，我们可以假设 Yahoo!
    对其云数据维护了安全的物理结构和人员访问控制，并拥有符合联邦法规的程序和政策来保护 `PII`。联邦法规在第四章中进行了详细描述。遗憾的是，联邦法规并不要求静态数据必须加密。从安全角度来看，这意味着如果有人能够突破物理或程序安全措施，他们就可以访问你的数据。


    ### 2.1.3.8 邮件服务提供商收集的信息


    '
- fmt: "\nEmail systems contain a wealth of personal information. Most of these services\
    \ provide online calendars, contact lists, schedules, chat sessions, as well as\
    \ email communications. When signing up for these `free` services, users are required\
    \ to provide certain information in exchange for the free service. While this\
    \ information is volunteered by the user of the service, other information is\
    \ combined and aggregated to provide a behavioral profile of the user. As an example\
    \ of what information is gathered, aggregated, and used, can be found in the privacy\
    \ policy and TOS agreements that users agree to when signing up for the service.\
    \ You do read these carefully before you agree, right? As an example of what the\
    \ email service provider “may” collect:\n\n- Personal information that you `freely`\
    \ provide when you register\n- Your name, email address, telephone number, birth\
    \ date, gender, postal code, occupation, industry, and personal interests\n- For\
    \ some financial products and services they might also ask for:\n    - Your address,\
    \ Social Security number, credit card number, and information about your assets\n\
    - Personal information the email service provider collects when you use their\
    \ products or services, This includes:\n    - Which services you use\n    - Which\
    \ pages you visit\n    - How you use the services\n    - How you interact with\
    \ ads – which ads you click on\n    - Information about you obtained from other\
    \ companies\n    - Information about your transactions\n    - Information about\
    \ your use of financial products and services\n    - Device and browser information\n\
    \    - IP address\n    - Device identifiers – MAC address\n    - Cookie information\n\
    \    - Software and hardware attributes\n    - Operating system and browser versions\n\
    \    - Information stored by the provider on their server logs\n    - Search queries\n\
    \    - Location information\n    - Access dates and times\n    - Local storage\
    \ – service providers may also store information they collect on your device\n\
    \nAs a side note, collecting software and hardware attributes can be used to profile\
    \ and uniquely identify a specific computer or device. This can be used to identify\
