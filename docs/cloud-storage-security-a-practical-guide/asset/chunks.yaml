  raw: '• Sharing mechanism


    Member trust represents the greatest security consideration for cloud-based data
    sharing. Here you must trust all those with access to act responsibly. Once you
    give people access to your data, you make yourself vulnerable to their mistakes
    or malice. You have to trust those you share data with to (1) not share data with
    non-group members, (2) not download data to unsecured devices or on unsecured
    networks, and (3) not upload inappropriate or illegal content.


    Access control means the mechanism for you to allow and revoke access to your
    shared cloud data. Revoking permission of a member might mean changing the password
    for everyone, then communicating that change to them through some alternate secure
    channel. Revoking access to some files could mean having to re-encrypt those files
    with a new password and exchanging that new password with remaining group members.
    More sophisticated access control using public key infrastructure (PKI) allows
    for adding and removing member public keys for authentication and authorization.


    The file sharing mechanisms implemented by cloud storage providers have their
    own security issues to consider. Secret URLs enable the sharing of cloud data
    with people who do not have accounts with the cloud storage provider. These secret
    URLs contain the credentials needed to retrieve your data. Security issues arise
    because browsers will save these URLs in their histories, people can send them
    to non-authorized people, the email containing the URL might get compromised,
    and the habit of URL shortening sends this secret URL to a shortening service
    that maps it to a shorter URL. Shorter URLs make it easier for brute-force attacks
    to find secret shared data links.


    Zero-knowledge encryption may not apply to shared cloud data. Cloud storage providers
    may need to obtain your encryption key to decrypt your shared file on their server
    before sending it to others.


    ## 1.5 Summary


    The software, platforms, and infrastructures that we call the “Cloud” have existed
    in some sense since the late 1960s. Cloud data storage privacy and security issues
    affect the data itself, metadata about you and your data, and the movement of
    the data between your device and the cloud storage hardware. You may put data
    owned by others in to cloud storage for work or research. Even if you consider
    the data your own, it could contain sensitive information about others. A variety
    of legal threats to your data privacy and security exist, including cloud provider
    terms of use, legal warrants, and different laws across geographic jurisdictions.
    Criminals may want your data for many other reasons than just identity theft.
    Sharing data in the cloud brings additional privacy and security concerns, including
    trust among participants and managing access control.


    ## References


