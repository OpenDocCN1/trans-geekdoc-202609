    - GSA, 2015. Privacy. [Online] [https://www.gsa.gov/content/10256](https://www.gsa.gov/content/10256)

    - IT Target, 2015. Security. [Online] [http://www.ittarget.com/security/](http://www.ittarget.com/security/)

    - Microsoft, 2015. Security and Compliance. [Online] [https://support.microsoft.com/fwlink/40124](https://support.microsoft.com/fwlink/40124)

    - Sci-Tech Today, 2015. Facebook Data Requests Rise 24%. [Online] [https://www.sci-tech.com/news/Facebook--t-Data-Requests-Up-24-/story.xhtml?story_id=01100CEOP59](https://www.sci-tech.com/news/Facebook--t-Data-Requests-Up-24-/story.xhtml?story_id=01100CEOP59)

