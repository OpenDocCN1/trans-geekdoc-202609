    零知识加密将与默认加密在云数据安全保护方面展开竞争。近期新闻中关于政府、公司和罪犯的事件不断侵蚀人们对云存储提供商管理数据加密的信任。云数据存储提供商将把零知识加密推广为保护个人或企业数据的唯一真实途径。企业将特别寄于零知识加密来保护其数据。


    ### 7.1.4 匿名网络


    对于那些寻求保护云元数据的人，诸如 `Freenet` ([`freenetproject.org`](https://freenetproject.org))、`I2P`
    ([`geti2p.net/`](https://geti2p.net/)) 和 `Tor` ([`www.torproject.org/`](https://www.torproject.org/))
    等匿名网络将变得越来越流行。这些匿名网络允许匿名访问云存储。你仍然必须对存储的数据进行加密，但匿名网络可以防止你的服务提供商追踪你的 IP 地址或物理位置。`Tails`
    ([`tails.boum.org/`](https://tails.boum.org/)) 提供了一个带有 `Tor` 以及其他匿名互联网活动工具的实时操作系统。Tails
    可以安装并运行在 USB 闪盘上，一旦 Tails 关闭并拔掉优存盘，主机计算机上就不会留下任何痕迹。Tails 的创建者目标是让每个人在任何地方都能轻松地获得在线匿名。


    从另一方面来说，使用这些匿名网络在云端进出即使是加密的数据也可能导致恶意节点复制数据并尝试对其进行暴力破解或加密攻击。此外，匿名网络确实存在可能暴露用户身份的漏洞。从积极方面，随着这些网络规模的扩大，其匿名性的假设性增加将使用户更加安全，并让那些想要监控你在线活动的人难以实施。


    ### 7.1.5 安全与隐私的变现


    我们预计看到提供云数据隐私的利基服务将会增长。数据安全是有价格的，免费的云数据存储需要有人买单。云存储提供商通常使用免费账户来建立客户群以吸引投资者、展示广告并销售额外服务。这些活动要运行良好，就需要用户数据，因此需要从用户元数据和内容中收集信息。良好的公司不会恶意使用这些数据。然而，这些数据的存在对罪犯和威权政府具有吸引力。


    云存储提供商可能会寻求通过提供加密和安全合规的付费账户来增加销售，例如 `Safe Harbor` 或 `HIPAA`。提供商可能会提供带有大量未加密存储空间的免费账户，然后鼓励用户付费通过加密来确保安全。对独立安全标准的合规保证也将吸引更多企业使用云数据存储和业务。


    预计将看到社交网络网站通过付费提供不收集用户数据的服务。高级账户将提供更多的隐私和安全选项。其他社交网络网站将尝试不同的商业模式，在云数据安全和隐私市场寻找利基市场。社交网络网站
    `Ello` ([`ello.co/`](https://ello.co/)) 作为一家公益公司成立，承诺不收集用户数据以进行追踪、不出售用户数据或不从广告中获利。这种营利性商业模式在云数据存储和信息共享市场中会有多成功，还有待观察。


    ### 7.1.6 家庭云


    网络附属存储 (NAS) 设备让个人尤其是小型企业能够拥有自己的私有云数据存储。安全忧虑。


    ### 7.1.7 安全与安全保障


    政府将继续推动一种议程，即网络攻击是文明世界面临的最大威胁，这证明了无限制监控的合理，而反对者代表了威胁。在许多方面，这种忧虑似乎是合理的。我们有更多的关键基础设施连接到互联网，有更多的数据存储在云端中。

