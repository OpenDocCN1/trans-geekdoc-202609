  trans: '

    保持云端存储数据的私密性意味着要在云端、在与云存储之间及往的传输过程中，以及在你用于访问数据的设备上进行保护。为了完全确保数据机密性，你还应该删除隐私数据文件的本地副本，以及与云存储提供商会话相关的临时文件。`BleachBit`
    和 `CCleaner` 都提供了安全删除设备上数据的工具。


    要从你的设备上安全地擦除隐私数据，请先删除隐私数据，然后使用 `CCleaner` ([`www.piriform.com/ccleaner`](http://www.piriform.com/ccleaner))
    删除临时文件并清空回收站。最后，使用 `CCleaner` 安全地擦除驱动器上的空空间。确保使用最安全的选项，以对空空间进行尽可能多次的覆盖。


    `BleachBit` ([`bleachbit.sourceforge.net/`](http://bleachbit.sourceforge.net/))的工作原理与
    `CCleaner` ，都能查找并删除不必要的文件以及擦除空空间。然而，它更关注隐私，因此找到并删除存储在许多应用程序文件中的隐私信息，而不会影响这些程序的性能。


    ## 5.7 个人或分布式云存储


    如果你不信任商业云存储提供商的安全和隐私策略，你可以选择提供自己的云存储解决方案。选项包括虚拟专用网络 (VPN)、用于虚拟网络计算 (VNC) 的远程访问软件、网络附属存储
    (NAS)、私有点对点 (P2P) 网络以及匿名 P2P 网络。尽管你对数据隐私的担忧可能促使你使用这些选项之一，但要意识到，安全的负担将由你来承担。你现在负有责任更改默认设置、应用最新的安全补丁、更新软件到最新版本，并检查日志文件以发现可疑活动。尽管如此，如果你能将这些事情成为你日常生活的一部分，其中一种云存储解决方案就可以提供你所需的数据隐私保护。


    虚拟专用网络 (`VPN`) 或虚拟网络计算 (`VNC`) 软件在计算机之间建立安全的网络连接。通过 `VPN` 或 `VNC`，你和他人可以在任何地方访问并共享隐私数据（图
    5.1）。


    ![图 5.1 基础 VPN/VNC 云存储架构。](img/F000058f05-01-9780128029305.jpg)


    图 5.1 基础 VPN/VNC 云存储架构。


    `VPN` 或 `VNC` 只能保护计算机之间传输中的数据。数据在设备上静态存储时仍然容易受到攻击。此外，任何拥有设备的人只要有活动或自动登录的 `VPN`
    连接，就可以访问隐私数据。最后，提供私有 `VPN` 服务的公司有记录你数据的能力，因此请阅读他们关于此类活动的策略。商业 `VPN` 提供商可能会为了营销目的记录并分析你的数据。假设免费
    `VPN` 服务几乎肯定会这样做。记住，如果你没有为产品付费，那么你就是产品。在将数据传输到连接 `VPN` 的目录之前，考虑对你的数据进行强加密。


    你也可以运行自己的 `VPN/VNC` 服务器。然而，如果你在防火墙之后或在没有静态 IP 地址的情况下运行它，你将需要做一些额外工作。你需要配置防火墙开放一个端口，并将该端口上的所有流量转发到你的
    `VPN/VNC` 服务器。除非你购买了域名并将该 IP 地址指向你的 `VPN` 服务器，否则你可能会有一个动态 IP 地址。像 `NoIP` ([`www.noip.com/`](http://www.noip.com/))
    这样的动态 DNS 服务可以为你提供一个公共域名，并保持其与你的动态 IP 地址同步。最后，你可以通过 `WhatIsMyIP` ([`www.whatismyip.com/`](http://www.whatismyip.com/))
    等网站手动跟踪 `VPN` 服务器 IP 地址的变化，然后将你的 `VPN` 客户端指向此地址。


    Microsoft Windows 自带对 `VPN` 的支持。著名的 `VPN` 和 `VNC` 软件包括 `Hamachi` ([`secure.logmein.com/`](https://secure.logmein.com/)),`OpenVPN`
    ([`openvpn.net/`](https://openvpn.net/)),`RealVNC` ([`www.realvnc.com/`](http://www.realvnc.com/)),`TightVNC`
    ([`tightvnc.com/`](http://tightvnc.com/)) 以及 `UltraVNC` ([`www.uvnc.com/`](http://www.uvnc.com/))。还有许多用于设置
    `VPN` 以从互联网访问隐私数据的选项，例如 `SSH`。这些解决方案虽然设置成本低廉，但需要一些 IT 技能，并且可能不像其他商业软件包中提供的选项。


    网络附属存储 (`NAS`) 设备充当专用的互联网可访问文件服务器。某些路由器带有 USB 端口，你可以在上面连接存储设备并从互联网访问它。在最简单的形式下，你将
    `NAS` 设备在在家里或办公室连接到你的网络，并从任何有互联网连接的地方访问它（图 5.2）。


    ![图 5.2 基础 NAS 云存储架构。](img/F000058f05-02-9780128029305.jpg)


    图 5.2 基础 NAS 云存储架构。


    你可以购买自定义的 `NAS` 设备，也可以在你自己的电脑上安装 `NAS` 软件。`FreeNAS` ([`www.freenas.org/`](http://www.freenas.org/))
    支持加密的文件系统，使得只有持有密钥的人才能访问文件系统数据。`Turnkey Linux` ([`www.turnkeylinux.org/`](http://www.turnkeylinux.org/))
    等公司为家庭和企业提供 `NAS`。配置不当的 `NAS` 设备构成了日益增长的数据威胁。`Shodan` ([`www.shodan.io/`](https://www.shodan.io/))
    等搜索引擎专门寻找此类设备。确保更改你的 `NAS` 默认设置并使用强密码和加密。


    人们可以通过在电脑上存储（图 5.3）或使用匿名网络（图 5.4）来创建自己的云以存储和共享隐私数据。分布式云存储可能意味着文件在所有连接的设备之间复制并同步，也可能意味着每个设备代表一个目录。


    ![图 5.3 私有 P2P 云存储架构。](img/F000058f05-03-9780128029305.jpg)


    图 5.3 私有 P2P 云存储架构。


    ![图 5.4 匿名 P2P 云存储架构。](img/F000058f05-04-9780128029305.jpg)


    图 5.4 匿名 P2P 云存储架构。

