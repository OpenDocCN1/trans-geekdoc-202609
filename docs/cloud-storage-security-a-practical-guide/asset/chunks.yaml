    \ Dodd-Frank\n\nThe purpose of the Dodd-Frank Wall Street Reform and Consumer\
    \ Protection Act is to “promote the financial stability of the United States by\
    \ improving accountability and transparency in the financial system to protect\
    \ the American taxpayer by ending bailouts, to protect consumers from abusive\
    \ financial services practices, and for other purposes.” To achieve these goals,\
    \ organizations that are subject to this Act must collect, store, maintain, and\
    \ provide search capabilities for all communication records relating to transactions.\
    \ This includes electronic mail, instant messages, and recordings of telephone\
    \ calls, both fixed line and mobile phones.\n\nIt requires that records of all\
    \ communications that relate to each transaction, regardless of the medium, must\
    \ be stored. They must be able to be retrieved in a way that allows the reconstruction\
    \ of the communication, both pre- and post-trade, and keep all records together\
    \ with all pertinent data and memoranda.\n\nRecord retention varies based on record\
    \ type. Since transactional records provide trade-related information, retention\
    \ requirement is set to the life of a swap, plus 5 years. For voice communication,\
    \ the retention period is 1 year. For non-transactional records, retention is\
    \ set to 5 years from the moment record was created. Since financial instruments\
    \ can last for many years, as in the case of long-term bonds, the aggregate retention\
    \ period could conceivably extend up to 30 years ([ndm.net](http://ndm.net), 2013).\n\
    \nOriginally, the Commodity Futures Trading Commission (CFTC) was very specific\
    \ in the type of medium that could be used for storing records. They leveraged\
    \ a previous rule, which was in existence before Dodd-Frank. This rule mandates\
    \ use of Write Once Read Many (WORM) compliant medium for storing records. This\
    \ type of storage includes devices where information can only be written once\
    \ and cannot be modified, such as optical disk technology like DVD-ROM and CD-ROM.\
    \ This requirement was problematic for financial institutions and current cloud\
    \ technology vendors. While optical disk storage is a well-known technology, it\
    \ is also an old technology that does not scale well, poses physical storage and\
    \ management problems, and does not easily allow for current state-of-the-art\
    \ large-scale searching solutions.\n\nAppeals were made to the CFTC by interested\
    \ parties and the language was later amended in 2013 to remove WORM-related language\
    \ so as not to specify a solution or media type. This type of specificity of technology\
    \ is usually not found in major laws. The new language specifies the intent of\
    \ the law, that is, data is to be protected from modification or deletion for\
    \ a specified period of time.\n\nFrom the new ruling: “A broker-dealer would not\
    \ violate the requirement in paragraph (f)(2)(ii)(A) of the rule if it used an\
    \ electronic storage system that prevents the overwriting, erasing or otherwise\
    \ altering of a record during its required retention period through the use of\
    \ integrated hardware and software control codes. Rule 17a-4 requires broker-dealers\
    \ to retain records for specified lengths of time. Therefore, it follows that\
    \ the non-erasable and non-rewriteable aspect of their storage need not continue\
    \ beyond that period.”\n\nAs the law was originally written, cloud storage using\
    \ magnetic media hard drives would not meet the intent of the law, but with the\
    \ modification to rule 17a-4, organizations that fall under Dodd-Frank can store\
    \ records in the cloud if the proper safeguards are in place. Given these special\
    \ requirements, cloud vendors are coming up with various methods to ensure that\
    \ their solution prevents the overwriting, erasing, or otherwise alteration of\
    \ a record during its retention period.\n\nFrom a security standpoint, the Dodd-Frank\
    \ law is mostly concerned with data integrity, retention, and availability. If\
    \ a cloud solution is used, it must ensure that data integrity is maintained and\
    \ that data cannot be altered, erased, or overwritten. Availability can be achieved\
    \ using standard cloud storage techniques, such as backup, striping, and load\
    \ balancing.\n\nIn addition, the rules specify that all records must be maintained\
    \ in a manner that is easily searchable, which implies that record data is not\
    \ encrypted, at least at some point, to facilitate searching. Although there are\
    \ techniques that can be used to search encrypted data, Dodd-Frank does not appear\
    \ to require that level of confidentiality.\n\nThe single most important capability\
    \ that is required by Dodd-Frank is the ability for trade reconstruction. Cloud\
    \ solutions can provide this capability by implementing comprehensive trade reconstruction,\
    \ which addresses the recordkeeping requirements.\n\nThe challenges for a Dodd-Frank\
    \ cloud solution are (1) ensuring data integrity, (2) providing search capabilities\
    \ of all records, (3) identifying and collecting the required data, (4) efficiently\
    \ organizing data storage, and (5) implementing comprehensive trade reconstruction.\n\
    \n### 4.2.3 Gramm–Leach–Bliley Act"
