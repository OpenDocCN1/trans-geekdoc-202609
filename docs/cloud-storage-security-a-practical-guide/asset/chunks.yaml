    \n? ? \n\n我们对比的云存储提供商都提供一定程度的免费（非试用）存储，我们对比了这些方案的安全性。请注意，在某些情况下，付费计划会有额外的安全选项。\n\
    \n我们根据双因子认证、扩展验证（EV）证书、加密强度、零知识加密、监管合规性以及数据中心位置等标准进行安全性对比。我们没有深入研究各个提供商如何在其数据中心维护安全性的细节。\n\
    \n两步验证或双因子认证要求用户输入两项信息进行登录：密码以及通过短信、电子邮件发送给用户或由用户通过应用程序 获取的一次性口码。作为这种方法的一种变体，Google\
    \ 身份验证器让用户在设备上存储来自网站的共享密钥。要登录该网站，用户必须提供其用户名、密码和由应用程序生成的一次性密码。\n\n除了上述双因子认证策略外，\
    \ Google 还会选择性地记住你的电脑并将其作为口令。Google Chrome 还支持使用 USB 安全密钥进行两步验证。一旦你用 Google 账户注册了此密钥，在提供提供用户名和密码后，它就能像开启房屋的钥匙一样解锁你的账户。\n\
    \n扩展验证（EV）证书提供了额外的安全级别，验证您在与云存储之间传输数据时没有人在拦截您的数据。请注意，Google 可能确实使用了 EV 证书，但其基础设施阻止了浏览器向用户提供其与\
    \ Google 建立了安全连接的确认。这使得从用户视角以及独立证书机构（CA）确认的角度来看，Google EV 在隐私和安全性方面是无效。\n\n加密强度描述了用于加密您数据的算法。NIST\
    \ 推荐 `AES-256`。服务器端加密可能会使用收敛加密（convergent encryption）。这种方法使用未加密文件的加密哈希值作为加密密钥。哈希值本身用用户密码加密。这导致相同的文件始终具有相同的加密形式。云存储提供商利用这种技术进行数据去重，因为相同的文件只存储一次。然而，这意味着第三方可以通过在自己的文件上执行相同的程序来检查您是否拥有某个文件。如果他们的加密文件与您的匹配，那么你就知道你有该文件。\n\
    \n零知识加密意味着云存储提供商没有解密您数据的能力。数据加密发生在客户端，然后通过安全连接发送给提供商。这保护了您在传输过程中以及在提供商数据中心的数据。由于只有您拥有解密密钥，否则您的数据在您不知情的情况下无法解密（除非有人猜到或偷走了您的解密密钥！）。零知识加密也保护了云存储提供商，因为他们无法知道存储的内容，这使得他们不太受到法律问题的影响。\n\
    \n然而，零知识加密并不总是适用于共享数据。某些宣称零知识加密的云存储提供商在文件共享时打破了这一承诺。为了共享您的文件，这些提供商可能会获取您的解密密钥并在服务器上解密您的文件，并以明文分发给您共享的对象。最后，提供商可能仅在客户端应用程序中提供零知识加密。\n"
- fmt: "\n# Sharing mechanism \n\nMember trust represents the greatest security consideration\
    \ for cloud-based data sharing. Here you must trust all those with access to act\
    \ responsibly. Once you give people access to your data, you make yourself vulnerable\
    \ to their mistakes or malice. You have to trust those you share data with to\
    \ (1) not share data with non-group members, (2) not download data to unsecured\
    \ devices or on unsecured networks, and (3) not upload inappropriate or illegal\
    \ content.\n\nAccess control means the mechanism for you to allow and revoke access\
    \ to your shared cloud data. Revoking permission of a member might mean changing\
    \ the password for everyone, then communicating that change to them through some\
    \ alternate secure channel. Revoking access to some files could mean having to\
    \ re-encrypt those files with a new password and exchanging that new password\
    \ with remaining group members. More sophisticated access control using public\
    \ key infrastructure (`PKI`) allows for adding and removing member public keys\
    \ for authentication and authorization.\n\nThe file sharing mechanisms implemented\
    \ by cloud storage providers have their own security issues to consider. Secret\
    \ URLs enable the sharing of cloud data with people who do not have accounts with\
    \ the cloud storage provider. These secret URLs contain the credentials needed\
    \ to retrieve your data. Security issues arise because browsers will save these\
    \ URLs in their histories, people can send them to non-authorized people, the\
    \ email containing the URL might get compromised, and the habit of URL shortening\
    \ sends this secret URL to a shortening service that maps it to a shorter URL.\
    \ Shorter URLs make it easier for brute-force attacks to find secret shared data\
    \ links.\n\nZero-knowledge encryption may not apply to shared cloud data. Cloud\
    \ storage providers may need to obtain your encryption key to decrypt your shared\
    \ file on their server before sending it to others.\n\n## 1.5 Summary\n\nThe software,\
    \ platforms, and infrastructures that we call the “Cloud” have existed in some\
    \ sense since the late 1960s. Cloud data storage privacy and security issues affect\
    \ the data itself, metadata about you and your data, and the movement of the data\
    \ between your device and the cloud storage hardware. You may put data owned by\
    \ others in cloud storage for work or research. Even if you consider the data\
    \ your own, it could contain sensitive information about others. A variety of\
    \ legal threats to your data privacy and security exist, including cloud provider\
    \ terms of use, legal warrants, and different laws across geographic jurisdictions.\
    \ Criminals may want your data for many other reasons than just identity theft.\
    \ Sharing data in the cloud brings additional privacy and security concerns, including\
    \ trust among participants and managing access control.\n\n## References\n\n1.\
