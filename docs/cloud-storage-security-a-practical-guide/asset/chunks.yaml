    formed as a Public Benefit Corporation with the pledge of not collecting user
    data for tracking, selling user data, or profiting from advertising. It remains
    to be seen how successful this for-profit business model will become in the cloud
    data storage and information sharing markets.


    ### 7.1.6 Home Clouds


    Network Attached Storage (NAS) devices allow individuals and small businesses
    especially to have their own private cloud data storage. Security concerns will
    motivate many to provide their own cloud data storage solutions, both private
    and commercial. Physical control of both endpoints, devices and storage, does
    satisfy some security concerns, related to legal issues and insider access. However,
    it does place the burden of security on the owner of home/private cloud. In addition
    it does not address data backup and storage location redundancy.


    Search engines like Shodan ([http://www.shodan.io/](http://www.shodan.io/)) crawl
    the Internet specifically looking for devices connected to it, including NAS devices.
    Banners returned by these devices upon connection often reveal or hint at vulnerabilities.
    A security firm recently developed a proof-of-concept worm that infects and propagates
    via NAS devices. Cyber criminals have already compromised NAS devices to mine
    Bitcoins, steal data, and encrypt data to hold for ransom (


    ### 7.1.7 Security Versus Safety


    Governments concerned about terrorism or mass action will seek greater control
    over all aspects of cloud data security, from data encryption to metadata anonymity.
    The increasing use of encryption, both key-managed and zero-knowledge, and anonymity
    networks may motivate governments to mandate the use of backdoors to bypass cryptographic
    safeguards, or perhaps even outlaw online anonymity.


    Expect governments to continue vilifying the “Dark Net,” characterizing it as
    something used only by criminals and terrorists. The Government Communications
    Headquarters (GCHQ), part of the British intelligence service, takes the view
    that technology companies represent terrorist command-and-control infrastructure.
    Many in GCHG believe this justifies any and all surveillance measures to everyone
    using these technologies (


    Many have characterized the Dark Web as something used by criminals only. In reality,
    the Dark Web means “By invitation only and no one invited you.” This may offend
    people who don’t like to be excluded. Yes, crime happens over encrypted and anonymous
    Internet traffic. However, crime also happens in the clear, behind closed doors
    and in secret locations too. In the United States, the government does not have
    unlimited powers of search and seizure. But many want the legal authority to allow
    24/7 tracking and access of all individuals on the Internet. Just because technology
    makes something easy at scale does not mean we should do it.


    Governments will continue to push the agenda that cyber-attacks represent the
    greatest threat faced by the civilized world, that this justifies unlimited surveillance,
    and detractors represent threats. In many ways, this concern seems justified.
    We have more critical infrastructure connected to the Internet with more of its
    data in cloud storage. Protectors of these systems arguably need whatever advantage
    they can get to discover and stop cyber-attacks before they do harm. It always
    comes back to the balance between security versus privacy.


    However, asymmetric access to and control of information by governments has not
    proven a good thing in human history. Knowledge brings power. Concentrating great
    knowledge and great physical power in an organization with a legal mandate to
    use it will inevitably result in malicious people working their way into positions
    of authority within the system and exploiting its power from within.


    As a result, oversight will remain a problem with the introduction of any new
    cloud data storage technology. Intelligence and law enforcement agencies will
    want to bypass security with laws and backdoors so they can perform their necessary
    functions. However, people must clearly define what security and anonymity features
    to bypass, by whom, and by under what circumstances. Otherwise, significant opportunities
    exist for abuse.


    With due process and pro-active oversight, we can balance personal privacy and
    public safety. Unfortunately, the government of no country has yet mastered this
    art such that individuals can legally challenge a government related cloud data
    security issue easily and cost-effectively.


