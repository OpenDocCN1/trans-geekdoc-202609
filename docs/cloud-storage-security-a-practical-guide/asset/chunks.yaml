    ### 7.2.2 Future Data Storage


    In this book we have discussed the various aspects of cloud storage as it relates
    to data security and data privacy. We have not focused on the mechanisms that
    provide the ability to store data and information. Currently most cloud storage
    providers use magnetic media, mostly in the form of hard drives that use disks
    coated with a metallic oxide to provide the actual storage mechanism. Some cloud
    providers are offering solid-state drives, which provide significantly faster
    access times than magnetic hard drive solutions, as a premium service at an additional
    cost.


    Hard drives were first invented by IBM in the 1950s and were commercially available
    in 1956. While the basic technology using magnetic media has been improved and
    miniaturized, the basic technological concept has remained the same: a spinning
    disk (or cylinder) coated with a ferromagnetic material that is magnetized in
    one of two directions, which is used to represent a binary “1” or “0.” The 1’s
    and 0’s are written and read at specific addressable locations on the disk to
    provide the ability to store data.


    Solid state drives on the other hand, use semiconductor chips instead of magnetic
    media to store data. There are no moving mechanical parts. Binary 1’s and 0’s
    are represented using transistors that are switched either on or off. The advantage
    is that solid state drives have faster access times. Their disadvantage is that
    they tend to decay over time because of the underlying physics of the transistor
    and connections tend to build up electrical resistance with repeated erase/write
    cycles. Currently available solid state devices can deliver up to 50,000 erase/write
    cycles before this occurs.


    As previously pointed out, solid state drives are becoming an option for users
    of cloud storage, albeit at an additional cost. In the near future solid state
    drives will likely become more prevalent as the cost of this storage device technology
    becomes more competitive in price. However, the same security and privacy issues
    remain despite the underlying technology.


    ### 7.2.3 Quantum Memory


    One area of research that may impact the future of cloud storage is quantum computing.
    At universities worldwide, physicists are pushing the envelope using the concepts
    of quantum physics to store data using the nucleus of atoms. Specifically, at
    Canada’s Simon Fraser University (SFU) researchers have encoded information in
    the form of quantum bits, called qubits, into the nuclei of phosphorus atoms held
    in a purified substrate of silicon. They used magnetic field pulses to tilt the
    spin of the nuclei to “write” qubit memory. Since qubits rely on the spin of nuclei,
    it is important that these materials are kept near absolute zero, which minimizes
    noise at the atomic level and increases the stability of qubits. What makes the
    SFU research interesting is that they were able to maintain qubit stability at
    room temperature for 39 minutes and were able to manipulate qubits as the temperature
    climbed and fell back toward absolute zero (


    Qubits have a number of interesting properties that researchers are investigating.
    In a quantum system, a qubit is stored in a superposition state where it can represent
    both 1 and 0 at the same time. This property, as researchers note, enables qubits
    to perform multiple calculations simultaneously.'
