    一些私有的 P2P 文件共享工具允许仅在受信任的主机之间进行共享。RetroShare ([`retroshare.sourceforge.net/`](http://retroshare.sourceforge.net/))
    自称为一个“安全的去中心化通信平台”。你可以使用 RetroShare 提供你自己的私有云存储解决方案。RetroShare 使用 `SSL` 对传输中的数据进行加密，但你仍然需要考虑端点的数据隐私和安全。为了使用
    RetroShare，用户可能需要配置自己的防火墙以开放端口，并将请求转发到运行 RetroShare 的计算机上。类似的 P2P 文件共享选项包括 GigaTribe
    ([`www.gigatribe.com/`](http://www.gigatribe.com/)) 和 Infinit ([`infinit.io/`](https://infinit.io/))。


    LogMeIn 提供的 Cubby ([`www.cubby.com/`](https://www.cubby.com/)) 提供了一种安全的云存储解决方案，通过付费服务，允许用户避免将数据存储在云端。相反，文件在节点之间直接分发。Cubby
    让动态 DNS 和防火墙问题对用户透明。Cubby 此外还具有安全功能，用于撤销权限和删除设备上的文件。


    ## 5.8 安全即服务


    安全即服务 (`SECaaS` 或 `SaaS`）通过云服务提供云数据安全。`SECaaS` 市场持续增长，特别是随着越来越多的中小企业寻求利用云来降低成本并提高效率。SECaaS
    允许较小的公司和组织外包云安全，并利用专用云安全专家的基础设施和专业知识。


    SECaaS 在应用程序和云数据之间创建了一个层。这一层提供了身份和访问管理 (`IAM`)，并允许对所有云账户进行单点登录 (`SSO`)。尝试访问云数据的应用程序会被重定向到
    SECaaS，由其验证用户身份并为用户提供跨所有云存储提供商的所有托管云数据的单点登录 (`SSO`)。策略驱动的密钥管理允许组织协调数据加密和访问。该服务向授权的用户和设备管理并分配密钥，然后使用策略控制对加密数据的访问。密钥管理可能包括加密密钥轮换，以协调新密钥的分发并解密使用旧密钥加密的数据。全功能
    SECaaS 包含多种安全服务，包括电子邮件病毒扫描、加密、加密密钥管理和漏洞扫描。


    许多云和计算机安全领域的知名公司都有针对 SECaaS 和 `IAM` 的产品和服务。这些包括 Oracle ([`www.oracle.com/`](http://www.oracle.com/))、趋势科技
    ([`www.trendmicro.com/`](http://www.trendmicro.com/))、McAfee ([`www.mcafee.com/`](http://www.mcafee.com/))
    以及赛门 ([`www.symantec.com/`](http://www.symantec.com/))。


    ## 5.9 总结


    在本章中我们讨论了个人以及大小公司和组织保护其云数据的工具。这些工具让你更容易地自己管理云数据安全，或者增强他人为你提供的云数据安全。


    无论你使用什么工具和服务来保护你的云数据，你自己的大脑代表了数据隐私最有效的工具之一。培养并实践这些态度和习惯，以最大限地发挥你数据隐私工具的效力。


    * 在没有先加密的情况下，不要将任何私有数据放入云存储中。

    * 使用不会泄露文件内容、创建者或来源元数据的命名命名规范。

    * 在上传私有数据之前，仔细检查云存储提供商的安全策略。寻求客观且受信任的专家对其安全性进行评审。仔细查看共享文件的细节以及任何附加的元数据。了解如果云存储提供商发生数据泄露或丢失你的数据时你的权利，以及哪些隐私法律适用于你的数据。

    * 保护你用于访问云存储的设备。应用最新的操作系统补丁。更新软件。使用病毒扫描器、防火墙和入侵检测系统 (`IDS`)。

    * 仅从受信任的网络上受信任的设备访问你的云数据。

    * 如果你必须使用不可信的设备，请将应用程序和数据留在自己的 USB 盘上。这不能保护你免受键盘记录器的攻击，或私有数据可能被缓存在不可信的硬盘上的风险，但它可能帮助防止你的数据被发现。

    * 限制访问你私有数据的人数。当他们不再需要访问时，撤销他们的访问权限，更改密码并/或重新加密数据。

    * 告访问你私有数据的人员你希望他们遵循的安全规范。

    * 在访问你的设备和云存储账户时，注意可能观察你输入密码的窥视者和监控摄像头。

    * 不要让其他人使用你访问或缓存你私有数据的设备。该人员可能会看到你的私有数据，将其复制到外部设备、作为电子邮件附件发送，或下载恶意软件。

    * 在保留云数据的本地副本时要小心。你可能希望拥有数据的本地副本，以便无论云存储提供商或网络可用如何都能访问它，但要意识到每个副本都会变成一个漏洞。

    * 访问你云数据的应用程序永远不要保持登录状态或记住你的用户名和密码。不使用时始终注销云存储账户。关闭自动同步，这样即使成功登录了你的设备的人也必须单独登录才能获取你的私有数据。这将保护你的私有数据，但需要你在每次访问存储在云的文件时重新登录。

    * 遵循管理密码的最佳实践，包括频繁更改密码和使用强随机密码。


    ## References


    1. Bletchley Park. 破译恩尼玛。[在线] [`www.bletchleypark.org.uk/content/hist/worldwartwo/enigma.rhtm`](http://www.bletchleypark.org.uk/content/hist/worldwartwo/enigma.rhtm)
    (最后访问于 2015 年 5 月)

    2. Duckett, C., 2012. Apache 与 Google 身份配对。Tech Republic。[在线] 9 月 3 日 [`www.techpublic.com/blog/australian-technology/pairing-apache-and-google-authenticator/`](http://www.techpublic.com/blog/australian-technology/pairing-apache-and-google-authenticator/)
    (最后访问于 2015 年 5 月)

