    in part because people break contracts and these third parties might fall victim
    to a data breach.


    Mega ([https://mega.co.nz/](https://mega.co.nz/)), SpiderOak ([https://spideroak.com/](https://spideroak.com/)),
    Tresorit ([https://tresorit.com/](https://tresorit.com/)), and Wuala ([https://www.wuala.com/](https://www.wuala.com/))
    offer cloud storage with zero-knowledge encryption. Check the fine print though,
    because sharing data with others might mean having your private data decrypted
    temporarily on the cloud provider server.


    ## 5.6 Delete Private Data'
