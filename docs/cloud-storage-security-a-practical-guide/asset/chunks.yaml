    # 第二章


    # 云端应用数据


    本章介绍了允许用户在云端存储和共享数据的应用程序。每个章节都包含了特定类别应用程序的案例研究以及相关的安全考虑。类别包括云邮箱、备份服务、社交媒体和办公套件。文中通过案例研究讨论了传输中数据、静态存储数据以及信息隐私。


    ## 关键词


    云邮箱；备份服务；社交媒体；办公套件；健康与健身应用；传输中数据；静态存储数据；信息隐私


    计算的未来无疑与云存储紧密相连。目前的应用程序供应商不仅将他们的应用程序（办公套件、备份服务、电子邮件）作为服务迁移到云端，还依赖云端来“安全地”存储用户创建的内容。这些应用程序可能是利用云端存储和处理信息的最明显的例子，其中某些信息可能被认为是敏感的，或者至少对用户是私密的。


    目前也存在将所谓的社交媒体迁移到云端的趋势。事实上，云端是所有社交媒体的核心组件。它提供了一个公共的空间来存储可以与朋友、群体和世界共享的信息。社交媒体云端服务要么通过网络浏览器交付，要么作为从云端下载并安装在设备（如智能手机或平板电脑）上的应用程序（App）交付。大部分内容都存储在云端。


    从安全的角度来看，有很多作恶的机会。首先，如果应用程序是从 Apple App Store 或 Google 市场等应用站点下载的，用户必须信任下载的内容与广告描述的一致：不多不少，也不少。用户还必须信任该程序没有被修改以执行违背的操作，不包含后门，且代码在编写时没有任何可以被利用并导致安全泄露的缺陷。假设前两个警告已通过应用商店/市场进行了筛选，那么第三个警告——“导致安全泄露的编码缺陷”就是潜伏在每段代码中的“未知未知的未知”（unknown-unknown）。


    这听起来可能是一个荒谬或偏执的陈述，但访问美国计算机应急响应小组（USCERT），你会发现（你那里找到的是一个列表……


    云存储的安全是寻求未经授权访问以窃取、操纵或破坏数据的攻击者的主要关注点。虽然云服务商实施了稳健的安全措施，但责任共担模型意味着用户必须在保护自己的数据方面发挥作用。本章探讨了与云应用相关的各种漏洞和缓解策略。


    ## 2.1 应用


    ### 2.1.1 电子邮件


    电子邮件（或电子邮件）是一种允许用户使用电子设备在人之间交换消息的方法。它是最广泛使用的通信形式之一，但仍然是网络攻击频繁的目标。


    ### 2.1.2 背景


    电子邮件自 20 世纪 60 年代以来一直存在，早期的实现仅限于大学和研究实验室。高级研究计划署（ARPA）随着互联网的出现将电子邮件推向了新高度。ARPAnet
    是一种连接大学和政府设施的数字通信系统，目的是交换信息。这为现在被称为互联网的网络提供了测试平台。


    电子邮件基于客户端-服务器架构，电子邮件从许多客户端（用户）发送到服务器，服务器将其路由到目的地并存储在目标服务器上。发送电子邮件涉及两种服务器：简单邮件传输协议（SMTP）服务器，它接收用户客户端的电子邮件并将其路由到目的地；邮局访问协议（POP）或互联网消息访问协议（IMAP），它们允许接收者从服务器检索电子邮件。在最简单的情况下，邮件服务器可以是运行
    SMTP 和邮件服务器服务的单台计算机，并连接到互联网。随着企业和电子邮件提供者实施和维护各自的电子邮件系统，全球范围内通过这种配置实例提供了电子邮件。随着电子邮件的使用增加和互联网接入的常态，这种模式已被支持数百万用户的大型云端邮件系统取代。Gmail、Yahoo!
    Mail 和 [Outlook.com](http://Outlook.com)（原 Hotmail）等电子邮件系统通过常用的浏览器技术为消费者提供免费的云邮箱。对于通过
    GoDaddy 和 1and1 等服务供应商购买并注册域名的企业和个人，提供了类似的 Web 端电子邮件服务。

