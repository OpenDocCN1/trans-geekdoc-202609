    \ question(s).\n\nIn the following sections, using this case study outline, we\
    \ will investigate the security of cloud-based email, cloud backup services, social\
    \ media, and cloud-based password managers.\n\n## 2.1 Applications\n\n### 2.1.1\
    \ Email\n\nEmail, or electronic mail, is a system that allows the exchange of\
    \ information between one or more users. Email can be used to send text, images,\
    \ documents, and files of all types to one or more recipients.\n\n### 2.1.2 Background\n\
    \nEmail, one of the original forms of social media, is even older than the web\
    \ and contains a detailed description of our personal and professional history.\
