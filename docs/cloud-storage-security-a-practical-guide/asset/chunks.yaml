- fmt: '

    Keeping data stored in the cloud private means protecting it in the cloud, in
    transit to and from cloud storage, and on devices that you use to access the data.
    In order to completely ensure data confidentiality, you should also remove local
    copies of private data files and temporary files related to session activity with
    the cloud storage provider. `BleachBit` and `CCleaner` both offer tools to securely
    delete data on your device.


    To securely erase private data from your device, first delete the private data,
    then use `CCleaner` ([http://www.piriform.com/ccleaner](http://www.piriform.com/ccleaner))
    to delete temporary files and empty the recycle bin. Finally, use `CCleaner` to
    securely erase the free space from your drive. Make sure to use the most secure
    option to make the maximum number of passes over the free space.


    `BleachBit` ([http://bleachbit.sourceforge.net/](http://bleachbit.sourceforge.net/))
    works similarly to `CCleaner` to find and remove unnecessary files and erase free
    space. However, it has a greater focus on privacy and so can find and delete private
    information stored within many application files without affecting the performance
    of those applications.


    ## 5.7 Personal or Distributed Cloud Storage


    If you do not trust the security and privacy policies of commercial cloud storage
    providers, you can elect to provide your own cloud storage solution. Options include
    virtual private networks (VPN) and remote access software for virtual network
    computing (VNC), network attached storage (NAS), private peer-to-peer (P2P) networks,
    and anonymous P2P networks. Although your concerns about data privacy might motivate
    you to use one of these options, realize that the burden of security becomes yours.
    You now have sole responsibility to change default settings, apply the latest
    security patches, update to the latest versions of software, and review log files
    for suspicious activity. That said, if you can make these things part of your
    routine, one of these cloud storage solutions could provide the data privacy you
    need.


    A virtual private network (`VPN`) or virtual network computing (`VNC`) software
    creates a secure network connection between computers. With a `VPN` or `VNC`,
    you and others can access and share private data from anywhere ([Figure 5.1](#chp005.xhtml#f0010)).


    ![Figure 5.1 Basic VPN/VNC cloud storage architecture.](images/F000058f05-01-9780128029305.jpg)


    Figure 5.1 Basic VPN/VNC cloud storage architecture.


    A `VPN` or `VNC` only secures data in transit between computers. Data remains
    vulnerable at rest on the devices. Furthermore, anyone with the device could have
    access to private data with an active or auto-login `VPN` connection. Lastly,
    companies that offer private `VPN` services have the ability to log your data,
    so read their policies regarding this activity. Commercial `VPN` providers could
    log and analyze your data for marketing purposes. Assume free `VPN` services will
    almost certainly do this. Remember that if you don’t pay for the product then
    you become the product. Consider strong encryption of your data before transferring
    it to a `VPN`-connected directory.


    You can run your own `VPN/VNC` server too. However, if you run it from behind
    a firewall or without a static IP address, you will have some extra work to do.
    You will need to configure the firewall to open a port and forward all traffic
    on this port to your `VPN/VNC` server. You will likely have a dynamic IP address
    unless you have purchased a domain name and direct that IP address to your `VPN`
    server. Dynamic DNS services like `NoIP` ([http://www.noip.com/](http://www.noip.com/))
    give you a public domain name and keep it synchronized with your dynamic IP address.
    Finally, you can manually track changes to your `VPN` server IP address with sites
    like `WhatIsMyIP` ([http://www.whatismyip.com/](http://www.whatismyip.com/)),
    then direct your `VPN` client to this address.


    Microsoft Windows comes with support for `VPN`. Notable `VPN` and `VNC` software
    include `Hamachi` ([https://secure.logmein.com/](https://secure.logmein.com/)),
    `OpenVPN` ([https://openvpn.net/](https://openvpn.net/)), `RealVNC` ([http://www.realvnc.com/](http://www.realvnc.com/)),
    `TightVNC` ([http://tightvnc.com/](http://tightvnc.com/)), and `UltraVNC` ([http://www.uvnc.com/](http://www.uvnc.com/)).
    Many more options exist for setting up a `VPN` to access private data from the
    Internet, such as `SSH`. These solutions, while inexpensive to set up, require
    some IT skills and may not offer the options available in other commercial packages.


    Network attached storage (`NAS`) devices work as a dedicated Internet accessible
    file server. Some routers have a USB port where you can attach a storage device
    and access it from the Internet. In the simplest form, you keep the `NAS` device
    in your home or office connected to your network and access it from anywhere with
    an Internet connection ([Figure 5.2](#chp005.xhtml#f0015)).


    ![Figure 5.2 Basic NAS cloud storage architecture.](images/F000058f05-02-9780128029305.jpg)


    Figure 5.2 Basic NAS cloud storage architecture.


    You can purchase custom `NAS` devices or you can install `NAS` software on your
    own computer. `FreeNAS` ([http://www.freenas.org/](http://www.freenas.org/)) supports
    encrypted file systems so that only those with the master key can access the file
    system and the data. Companies like `Turnkey Linux` ([http://www.turnkeylinux.org/](http://www.turnkeylinux.org/))
    provide `NAS` appliances for home and business. Poorly configured `NAS` appliances
    represent a growing data security threat. Search engines like `Shodan` ([https://www.shodan.io/](https://www.shodan.io/))
    specifically look for such devices on the Internet. Make sure to change default
    settings of your `NAS` and use strong passwords and encryption.


    People can create their own cloud to store and share private data by each storage
    on own computer ([Figure 5.3](#chp005.xhtml#f0020)) or by using a network of anonymous
    individuals ([Figure 5.4](#chp005.xhtml#f0025)). Distributed cloud storage could
    mean all files get replicated and synchronized across all connected devices, or
    it could mean storage on each device represents a directory.


    ![Figure 5.3 Private P2P cloud storage architecture.](images/F000058f05-03-9780128029305.jpg)


    Figure 5.3 Private P2P cloud storage architecture.


    ![Figure 5.4 Anonymous P2P cloud storage architecture.](images/F000058f05-04-9780128029305.jpg)


    Figure 5.4 Anonymous P2P cloud storage architecture.


    Anonymous peer-to-peer (`P2P`) file sharing networks store your files in cloud
    space provided by anonymous people or organizations. Of course, this might seem
    like a step backwards in terms of your data privacy, but it does represent an
    option if you have confidence in your file encryption. Anonymous `P2P` file sharing
    networks do have the advantage of hiding your metadata, such as source and destination
    IP addresses. You might consider this metadata at least as confidential as the
    files you want to store, because the IP address can be used to determine your
    location and the location of the places you visit.


    Note that secure `P2P` networks offering anonymity do so by maintaining a network
    of thousands of nodes. Such an arrangement might not afford you the right kind
    of data privacy. Your private data, even encrypted, will exist on and move through
    nodes of unknown ownership and legal jurisdiction. Unencrypted or easily decrypted
    private data will exist on many unknown computers within the `P2P` network. In
    short, DO NOT equate anonymous with data privacy. If you want data privacy AND
    anonymity, then you will need to encrypt your data and accept that copies of it
    might live forever on unknown hosts, accessible to unknown people and organizations.

