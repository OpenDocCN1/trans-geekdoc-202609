    # Chapter 1: Data in the Cloud


    The software, platforms, and infrastructures that we call the “Cloud” have existed
    in some sense since the late 1960s. Cloud data privacy and security issues affect
    the data itself, metadata about you, and the movement of the data between your
    device and the cloud hardware. You may put data owned by others in cloud storage
    for work or research. Even if you consider the data your own, it could contain
    sensitive information about others. Sharing data in the cloud brings additional
    privacy and security concerns, including trust among participants and managing
    access control.


    ### Keywords

    Cloud definition; cloud history; privacy and security concepts; privacy and security
    threats; data sharing


    This chapter introduces cloud storage concepts, puts cloud data privacy and security
    in an historical context, and identifies privacy and security issues. Subsequent
    chapters will delve more fully into the details of privacy and security for cloud.


    ## 1.1 Definitions and History


    ### 1.1.1 Definitions


    Before we discuss data in the cloud, we must first define what we mean both by
    the cloud and by data. The National Institute of Standards and Technology (NIST)
    Special Publication 800-145 (NIST SP 800-145) defines the cloud as the hardware
    and software infrastructure required to provide “on-demand self-service, broad
    network access, resource pooling, rapid elasticity, and measured service.” These
    characteristics allow for three service models: software, platform, and infrastructure:


    Software as a Service (SaaS) gives consumers use of software from providers that
    runs on cloud infrastructure. Examples of SaaS include social media like Facebook,
    Twitter, YouTube, and Pinterest. SaaS also includes email, website hosting, and
    data storage. Platform as a Service (PaaS) enables consumers to deploy and run
    their own software on the provider’s cloud infrastructure. Infrastructure as a
    Service (IaaS) means cloud providers host customer operating systems, so customers
    use their own software and control some network components.


