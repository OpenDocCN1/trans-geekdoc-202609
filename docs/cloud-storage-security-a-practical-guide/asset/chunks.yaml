    数据隐私挑战之所以存在，是因为你的数据对许多人都有价值，这包括文件内容、与文件相关的元数据，以及访问文件的人的身份。随着越来越多的人将敏感数据迁移到云存储，专家预计数据泄露事件将更加频繁。使用云存储让你的数据可以随时随地访问，可能会涉及旅行、外国和国内法律、就业以及保险方面的法律影响。我们都担心犯罪分子窃取数据。然而，我们应该同样担心自己、家人和朋友暴露我们的私有数据。在极端情况下，有些人必须担心来自威权政府的隐私权侵犯。


    ### 关键词


    `隐私`；`数据管理`；`数据泄露`；`法律威胁`


    如果一棵树在森林里倒下而没有人听见，它会发出声音吗？如果有人收集了你的个人信息但没有对你造成伤害，这重要吗？许多人认为云数据安全和隐私担忧是不必要的，因为他们相信
    (1) 他们的数据只对他们自己有价值，(2) 他们具有群体免疫，因此风险较低，或 (3) 他们拥有某些安全保护，因此攻击者会关注更脆弱的目标。然而，觊你数据的人可能比你想的要多，而更复杂的工具和计算资源意味着更多的个人和小型组织变成了“触手可得的果实”。


    我们利用这一章来说说明可能影响你对私有云数据安全需求的隐私问题范围。我们将刻意描绘幅云安全和隐私挑战的严峻前景。我们希望这能帮助你在将数据迁移到云存储之前，对数据的敏感性做出明智决策。


    你本人是你隐私最大的挑战之一，因为你决定将数据放在云存储中。然而，那些拥有你信息的人也可以把数据放在云存储中，而你对这种情况的控制力较少。信任成为了你隐私的一个重大挑战。


    个人和组织都使用私有共享云存储与信任的小群体进行共享和协作，或控制大量人员的访问。即使是未参与商业活动的个人，在处理存储在云端的他人的信息时，也应该履行某种程度的数据管理。你对他人的了解代表了你与他们之间的共享信息（`图
    3.1`）。


    ![图 3.1 数据隐私考量。](img/F000034f03-01-9780128029305.jpg)


    图 3.1 数据隐私考量。


    你作为个人将数据存放在云端以进行存储或共享。你也将关于他人的信息放在云端。你可能因为某些协作努力而在对方知情的情况下这样做，也可能在没有意识的情况下作为你自己数据的一部分而这样做。了解你的人也可以对你的私有数据做同样的事（`图
    3.2`）。


    ![图 3.2 私有数据进入云端的路径。](img/F000034f03-02-9780128029305.jpg)


    图 3.2 私有数据进入云端的路径。


    ## 3.1 谁想要你的数据？


    数据隐私挑战之所以存在，是因为数据有价值。`图 3.3` 显示了你存储在云端并提供的数据中所包含的部分价值。你存储在云端的数据可能直接或间接地包含许多他人认为有价值的信息。价值可能来自文件内容本身，也可能来自与文件相关的元数据，包括与文件访问的数据。`图
    3.4` 展示了可能对你存储在云端的数据感兴趣的一些个人群体。


    ![图 3.3 你云数据中的价值。](img/F000034f03-03-9780128029305.jpg)


    图 3.3 你云数据中的价值。


    ![图 3.4 重视你云端数据的个人和群体。](img/F000034f03-04-9780128029305.jpg)


    图 3.4 重视你云端数据的个人和群体。


    你的隐私和安全考虑应该包括他人如何解读你的公共云数据。人们经常将社交媒体作为生活的日记或编年史。公司也可能利用社交媒体进行内部交流以及与客户、合作伙伴的沟通与协作。个人和公司应该仔细考虑此类做法，并思考他们的个人或企业品牌。


    个人或组织存储在云端的个人信息对许多人都有价值。朋友和家人会辩称他们对某些信息拥有合法利益。雇主也可能想要关于员工的敏感数据，理由是这影响工作表现。营销人员显然在寻找信息以帮助他们细分市场并预测购买决策。保险公司想要有关个人健康和生活习惯的线索。犯罪分子利用个人数据进行身份盗窃、网络跟踪、网络欺凌和勒索。身份盗窃者可能利用你的身份建立信贷，或以假名进行非法活动。个人敌人可能想要信息让某人难堪或损害其声誉。威权政府想要云数据来识别对现状的威胁。


    云存储中的组织数据对于企业间谍具有价值。竞争对手可以从知识产权、客户联系方式、正在进行的谈判信息以及公司财务状况中获益。活动人士想要组织数据来使公司难堪或损害其声誉。威权政府可能会针对外国组织的云存储，作为对政治挑战的回报（例如，朝鲜和索尼），或为了支持本国的经济利益。


    你的数据对许多个人和群体都有价值。现在你将这些数据放在云存储中，部分是为了让它们在多个设备上“随时可用”。但如果你可以从任何地方获取，那么其他人也有更多机会获取它们。


    `图 3.5` 显示了你和其他如何可能将私有云数据暴露给非预期的人和组织。你和你选择的云提供商可能会你的数据隐私。提供商的条款和条件、员工行为（失误或恶意）、数据中心所在地的隐私法律以及针对提供商的网络攻击，可能导致敏感数据的丢失或泄露。你的云存储提供商采用的数据生命周期管理实践影响着数据隐私。删除后的数据保留政策以及多租户系统中未完全擦除磁盘上的数据，意味着你的私有云数据在你认为已删除很久之后仍然存在。这意味着你删除的数据是有脆弱性的。


    ![图 3.5 获取你云数据的方式。](img/F000034f03-05-9780128029305.jpg)


    图 3.5 获取你云数据的方式。


    你和他人使用的设备既持有数据副本，又允许与云存储建立连接。失去对设备的控制可能意味着失去对私有数据的控制。你必须信任自己和他人不会在安全配置和内容上犯错。同样，你必须信任与你分享私有数据的人在任何情况下都会保护它。


