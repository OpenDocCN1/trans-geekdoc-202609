    of the security of PHI data while operating in emergency mode. Emergency mode
    operating must be periodically tested and revisions to contingency plans updated
    as necessary, this includes both supporting applications and PHI data.


    #### 4.2.1.3 Technical Safeguards


    Technical safeguards are defined in HIPAA that address access controls, data in
    motion, and data at rest requirements. A covered entity must implement technical
    policies and procedures for computing systems that maintain PHI data to restrict
    access to only those persons that have been granted access rights. Each user is
    required to have a unique user identification (ID). This ID is used for identifying
    and tracking the activities of the user while accessing PHI. Audit controls must
    be implemented to record and provide the ability to examine PHI access and processing
    activity. To protect the user account from being left unattended, automatic logoff
    must be implemented to terminate a user’s session after a predetermined time of
    inactivity.


    HIPAA requires that a mechanism to encrypt and decrypt PHI must be implemented.
    It does not directly specify when data is to be encrypted/decrypted, except when
    it is “reasonable and appropriate” to do so. Given this flexibility, PHI should
    be encrypted while in motion and at rest. Encryption directly addresses the data
    *confidentiality* requirement of PHI as is transmitted, received, maintained,
    and stored. The selection of an encryption algorithm, implementation details,
    and use are left to the covered entity.


    To ensure PHI data *integrity*, the covered entity must implement policies and
    procedures to protect PHI from improper alteration or destruction. It must also
    establish emergency access procedures for obtaining and accessing PHI during an
    emergency ('
