    ## 1.2.3 法律与刑事威胁


    在本节中，我们将突出放在云存储中的数据的法律和刑事威胁的范围。


    ### 1.2.3.1 法律威胁


    对云存储数据的法律威胁通常来自以下方面：


    - 云提供商的使用条款

    - 版权与文件共享

    - 民事诉讼

    - 法律搜查令

    - 根据你所在地的法律

    - 根据云存储数据中心所在地的法律


    云数据存储提供商可能有其使用条款，允许他们广泛地访问你的元数据和数据内容。使用条款可能包含模糊的语言，导致机密性变得模糊。法律模糊可能意味着需要通过法庭来维护你的隐私和数据安全，这是一个漫长且昂贵的过程且无法保证成功。记住，为了获得免费的云数据存储，你同意了这些条款，包括其中的模糊之处。

