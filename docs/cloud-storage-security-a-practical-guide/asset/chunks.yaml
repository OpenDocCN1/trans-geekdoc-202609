    \ or Nonpublic personal information (NPI), the security requirements are similar.\
    \ Their goals are to ensure the security, integrity, confidentiality, and availability\
    \ of information. Industry best practices provides a starting point for achieving\
    \ these goals that include administrative, physical, and technical safeguards.\n\
    \n### Keywords\n\nCompliance; cloud storage; security; Dodd-Frank; HIPAA; SOX;\
    \ GLBA\n\nFor businesses, the cloud offers significant advantages in terms of\
    \ flexible and inexpensive storage. By offloading the everyday operation, maintenance,\
    \ backup, and disaster recovery takes to cloud service providers, companies can\
    \ realize substantial cost savings not only in terms of hardware and software\
    \ licenses, but also in reduced labor costs and facility expenses. In addition,\
    \ cloud solutions also offer the ability to dynamically scale capacity to meet\
    \ business cycle and future growth requirements at a predictable cost.\n\nBut,\
    \ and there is always a but, if an entity, business or individual, is subject\
    \ to laws and regulation regarding data storage and transmittal, those regulations\
    \ also apply to the cloud service provider. It is up to the business that outsources\
    \ their storage to a cloud provider to ensure that the provider meets regulations\
    \ that are prescribed by the governing law. When data is entrusted to a cloud\
    \ storage provider, due diligence must be taken to ensure legal and regulatory\
    \ compliance.\n\n## 4.1 Legal Responsibility When Handling Other People’s Data\n\
    \nThere are a number of state and federal laws and regulations that must be considered\
    \ when moving data to the cloud. What laws apply depends on the type of business\
    \ and the type of data that the business collects, stores, and maintains. The\
    \ majority of these laws focus on the protection of personally identifiable information\
    \ (PII).\n\nThe National Institute of Science and Technology (NIST) defines PII\
    \ as, “any information about an individual maintained by an agency, including\
    \ (1) any information that can be used to distinguish or trace an individual‘s\
    \ identity, such as name, social security number, date and place of birth, mother‘s\
    \ maiden name, or biometric records; and (2) any other information that is linked\
    \ or linkable to an individual, such as medical, educational, financial, and employment\
    \ information” (\n\nNote that this definition uses the word “agency” and is intended\
    \ primarily for US federal government agencies, but other organizations may find\
    \ the definition useful.\n\nExamples of PII include, but are not limited to:\n\
    \n• Name, such as full name, maiden name, mother‘s maiden name, or alias\n\n• Personal\
    \ identification number, such as social security number (SSN), passport number,\
    \ driver‘s license number, taxpayer identification number, or financial account\
    \ or credit card number\n\n• Address information, such as street address or email\
    \ address\n\n• Personal characteristics, including a photographic image (especially\
    \ of the face or other identifying characteristics), fingerprints, handwriting,\
    \ or biometric data (e.g., retina scan, voice signature, facial geometry)\n\n\
    • Information about an individual that is linked or linkable to one of the above\
    \ (e.g., date of birth, place of birth, race, religion, weight, activities, geographical\
    \ indicators, employment information, medical information, education information,\
    \ financial information).\n\nThe US federal government has enacted a number of\
    \ laws that regulate the collection, transmittal, storage, and maintenance of\
    \ PII. Many states have also enacted state laws that impact storage and use of\
    \ PII. While these laws focus mainly on specific business sectors, such as the\
    \ healthcare and financial industries, services provided by cloud storage providers\
    \ must adhere to the same laws and regulations as the businesses that use them\
    \ for storage of PII.\n\nThis section will focus on four US federal laws that\
    \ govern or impact data storage in the cloud. These include:\n\n**HIPAA** – The\
    \ Health Insurance Portability and Accountability Act of 1996 establishes federal\
    \ standards for protecting patients’ health information. Entities that have access\
    \ to medical data are required to protect the privacy of patient information by\
    \ adhering to prescribed guidelines.\n\n**Dodd-Frank** – The purpose of the Dodd-Frank\
    \ Wall Street Reform and Consumer Protection Act is to “promote the financial\
    \ stability of the United States by improving accountability and transparency\
    \ in the financial system, to end ‘too big to fail’, to protect the American taxpayer\
    \ by ending bailouts, to protect consumers from abusive financial services practices,\
    \ and for other purposes” (Dodd-Frank, 2010). To achieve these goals, organizations\
    \ must collect, store, maintain, and provide search capabilities for all communication\
    \ records relating to transactions.\n\n**GLBA** – The Gramm–Leach–Bliley Act,\
    \ also known as the Financial Services Modernization Act of 1999, requires financial\
    \ institutions to establish standards for protecting the security and confidentiality\
    \ of customer non-public personal information.\n\n**SOX** – The Sarbanes-Oxley\
    \ Act of 2002, also known as the Public Company Accounting Reform and Investor\
    \ Protection Act, was established to regulate the financial practices of US public\
    \ companies to protect against fraud. Part of the SOX Act directly affects data\
    \ storage that includes the preservation and accuracy of electronic records, the\
    \ recommended retention period for record storage, and the types of business records\
    \ that SOX rules apply to, which includes all communications.\n\n## 4.2 US Federal\
    \ Laws and Regulations Affecting Cloud Storage\n\nEach of the four acts are discussed\
    \ in this section as they apply to cloud storage. None of the four actually prescribe\
    \ specific solutions to address the requirements, nor do they endorse or recommend\
    \ any vendor’s approach. Instead, they provide “guidelines,” leaving the actual\
    \ implementation to the regulated entities to allow them to take advantage of\
    \ current and future technology.\n\n### 4.2.1 HIPAA\n\nAs previously stated, the\
    \ Health Insurance Portability and Accountability Act of 1996 establishes federal\
    \ standards for protecting patients’ health information. Entities that have access\
    \ to medical history, such as doctors, dentists, hospitals, and health insurance\
    \ companies, are required to protect the privacy of patient information by adhering\
    \ to prescribed guidelines (\n\nThe law requires that any entity possessing Protected\
    \ Health Information (PHI) must “protect against reasonably anticipated threats\
    \ to the security or integrity of the information,” according to the US Department\
    \ of Health and Human Services. Note that PHI and PII are similar in that they\
    \ refer to an individual’s private data. PHI extends that concept to include medially\
    \ related information, such as lab results, diagnosis, treatments, medications,\
    \ and prescriptions. There is no official HIPPA certification for business entities,\
    \ including cloud storage providers. The current best practice is to provide authorization\
    \ and access controls, and to encrypt data in motion and at rest. It is “felt”\
    \ that adopting these best practices helps address the obligation to protect storage\
    \ of PHI.\n\nThere are four areas of HIPAA that directly impact the storage of\
    \ PHI in the cloud:"
