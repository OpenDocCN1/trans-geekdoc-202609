    \ research, and provide anonymous reporting for internal and external clients.\n\
    \nThey also provide the information to trusted partners under confidentiality\
    \ agreements. These companies may use your personal information to communicate\
    \ with you about offers from marketing partners. However, these companies do not\
    \ have any independent right to share this information, according to the provider’s\
    \ privacy policy.\n\nPersonal information that is collected by these services\
    \ is also subject to applicable state and federal laws. They are also subject\
    \ to civil litigation. They must respond to subpoenas, court orders, legal process,\
    \ and national security letters. A national security letter is effectively an\
    \ administrative subpoena, issued by a federal agency, requiring the production\
    \ of certain limited types of information held by third-party custodians (DOJ,\
    \ 2015). What this means is that an administrative agency, such as the Federal\
    \ Bureau of Investigation (FBI), can compel the disclosure of customer records\
    \ from internet service providers, which includes email transactions, without\
    \ a court order. A court order would be required if content is requested. In addition,\
    \ the service provider can be prohibited from informing you that your data and\
