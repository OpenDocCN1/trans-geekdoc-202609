- fmt: 'Previously we discussed data-in-motion and data-at-rest. Since the goal of
    social media is to share information, motion and rest security are less critical
    than it is for data backup and cloud-based email. That said, both Twitter and
    Facebook use `HTTPS` and `SSL` to transport data between users and data servers.
    Data stored in the cloud is not encrypted.


    The business models of these and other social media companies rely on collecting
    and aggregating user data to sell advertisements that are targeted to specific
    user’s interests. This allows them to provide a valuable free service, while providing
    an opportunity to generate revenue.


    ## 2.3.2.3 Methods and Results


    To address the research questions and privacy versus sharing, we examine Facebook
    and Twitter’s privacy policies, along with other publically available information.


    ## 2.3.2.4 Twitter


    To help build a more personal Twitter experience for you, we are collecting and
    occasionally updating the list of apps installed on your mobile device so we can
    deliver tailored content that you might be interested in.


    To begin to monetize their product, Twitter is adopting the strategy that has
    proved effective for Google, Facebook, and others. This requires an update to
    their privacy policy, which they will provide through an in-app notification on
    the Twitter app. The update requires the user to take some sort of action within
    the free Twitter app to opt-out of the new privacy terms of use. The default is
    opt-in, meaning that by default if you use the app, you agree to Twitter’s `TOS`
    and privacy policy.


    From Twitter’s `TOS`:


    What you say on Twitter may be viewed all around the world instantly. You are
    what you Tweet!


    They also state:


    The Services that Twitter provides are always evolving and the form and nature
    of the Services that Twitter provides may change from time to time without prior
    notice to you. (2015)


    While it is being reported that Twitter will provide you with notification of
    any change in their `TOS`, if it is read carefully, the `TOS` clearly states their
    service may change without any notification.


    The `TOS`, as is the case of most social media providers, has a reference to the
    Privacy Policy and states that, “use of the Services you consent to the collection
    and use (as set forth in the Privacy Policy) of this information, including the
    transfer of this information to the United States and/or other countries for storage,
    processing and use by Twitter.”


    So, by using the service you consent to the collection and use of information
    generated by you that flows through their system, and that it will be stored in
    countries all over the world – unencrypted.


    In addition, Twitter has the right to provide the information that they collect
    on you to other companies for syndication, broadcast, distribution, or publication.
    This is done, because they own data that flows through their system, without any
    compensation paid to you. If you do not have the right to use the content it may
    subject you to liability. Of course Twitter will not be held liable, as stated
    in their privacy policy. This could happen, for example, if a video clip from
    a cable news program is tweeted, or a picture that is copyrighted by someone else.


    They also “reserve the right to access, read, preserve, and disclose any information
    as we reasonably believe is necessary to (i) satisfy any applicable law, regulation,
    legal process or governmental request”.


    ## 2.3.2.5 Twitter Privacy Policy


    Twitter collects personal information during registration that includes name,
    username, password, and email address. They may also collect location information.


    As a common practice among social media services, you may choose to add information
    about where they work, where they went to school, and a photo. After sign up,
    people use Facebook to share information about their lives, things they like,
    photos, videos, links to websites, etc. All of this information can be aggregated
    and analyzed to form a profile of the user, which can be used to target advertisement.


    In their privacy policy, Twitter also states that they broadly disseminate this
    information. They say this with the caveat: “you should think carefully about
    what you are making public.”


    You may also voluntarily publish location information, which Twitter collects
    and stores. This includes location information transmitted by cell towers and
    wireless networks. The privacy implications of collecting and storing location
    information is that it can be used to establish behavioral patterns.


    When you interact with Twitter, device and operational information is collected
    that includes your IP address, browser type, operating system, the referring page,
    pages visited, location, your mobile carrier, device and application identifiers,
    search terms, and cookie information. Twitter also collects information when you
    use your Twitter account for authorization to other services. Few users know that
    this is a tracking device and that they are being tracked.


    ## 2.3.2.6 Facebook


    In this section we look at the security and privacy of Facebook, based on analysis
    of their current `TOS` and privacy policy. Once again it must be stated that the
    purpose of Facebook and other social media services is to share information and
    once again this information is voluntarily provided by users of the service.


    Personal information that users provide when they sign up for Facebook include
    the user’s name, email, gender, and birth date. Facebook provides tools to import
    email contact lists to help you invite your contacts to join Facebook and add
    you as a friend. To assist you in this effort, their policy states that, “If you
    give us your password to retrieve those contacts, we will not store your password
    after you have uploaded your contacts.”'
