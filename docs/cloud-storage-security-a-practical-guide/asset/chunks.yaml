    电子邮件提供商可能会为用户提供某种加密服务。然而，在许多情况下，邮件提供商控制着加密密钥。就像安全云存储一样，这意味着必须信任提供商的能力和意图，认为他们会像你一样重视你的数据隐私。ProtonMail
    ([`protonmail.ch/`](https://protonmail.ch/)) 提供零知识电子邮件加密服务。此外，他们在瑞士拥有数据中心，因此你的电子邮件数据受《瑞士联邦数据保护法》（DPA）和《瑞士联邦数据保护条例》（DPO）的保护。


    具有公钥加密能力的电子邮件客户端提供了发送私密邮件的另一种方法。Scribe 电子邮件客户端支持 Linux 和 Windows 系统，并配有 GnuPG
    插件 ([`www.memecode.com/scribe/gnupg.php`](http://www.memecode.com/scribe/gnupg.php))。Thunderbird
    和 SeaMonkey 的 Enigmail ([`www.enigmail.net/`](https://www.enigmail.net/)) 扩展提供了邮件消息的公钥加密。


    ## 5.4 密码与加密密钥


    密码和公钥加密通过加密你的数据并控制对云存储账户的访问，为数据隐私奠定了基础。攻击者可以对云数据账户进行暴力破解攻击，然后将相同的技术应用于加密数据文件本身。如果他们获取了密钥库的访问权限，就可以离线破解密钥库的加密。他们还可以尝试获取解密任何已获取的加密文件所需的私钥。因此，密码和私钥库成为大多数安全关注的私有数据。


    存在多种密码生成工具，可以降低你的云数据账户以及加密数据文件本身遭受暴力破解攻击的风险。人们倾向于选择容易记住的密码，也许认为这样由于不需要写下来而会更安全。


    然而，“容易记住”往往意味着“容易被猜”。存在多种策略通过组合单词、数字并应用模式替换来创建既复杂又易记的密码。遗憾的是，如果你能应用某种规则来创建密码，密码破解器也能这样做。你所想到的任何规则可能已经成为密码破解工具的一部分了。


    以下建议将帮助你生成和管理密码：


    - 使用长长且随机的密码。

    - 为每个网站使用唯一的密码。

    - 频繁且不可预测地更改密码。盟军情报部门破解了恩尼玛密码机的加密，是因为纳粹没有足够频繁地更改密码。


    考虑使用密码管理器来为你创建和管理密码。你只需要记住一个非常安全的密码来访问密码管理器。密码管理器会为你生成长且随机的密码，并通常会自动处理账户登录。


    LastPass ([`lastpass.com/`](https://lastpass.com/)) 作为浏览器插件工作，并提供付费的有限文件共享。LastPass
    在你的所有设备上同步密钥库，以便你可以在任何地方访问你的账户。LastPass 还提供企业级单点登录（SSO）产品和服务。KeePass ([`keepass.info/`](http://keepass.info/))
    从 USB 闪盘运行，并具有防止键盘记录器和缓存攻击的功能。KeePass 会定期从剪贴板中删除密码，但在使用不可信计算机时，这仍然是一个漏洞。1Password
    ([`agilebits.com/onepassword`](https://agilebits.com/onepassword)) 提供了另一种流行的密码管理解决方案。最后，安全专家布鲁斯·施尼尔（Bruce
    Schneier）设计了密码管理器 Password Safe ([`pwsafe.org/`](http://pwsafe.org/))。


    作为密码管理器的主密码，你可以考虑生成并记住一个 14 个字符长度的随机密码，包含 26 个英文字母（包括大小写）和数字 0–9。对于此类密码，目前最快的超级计算机大约需要
    4500 年才能破解。即使超级计算技术飞速发展，在加密被破解时，你的私有数据可能仍然是私密的，或者对你或其他人已经不再具有价值。


    你可以使用上述密码管理器生成随机密码。或者，你可以使用在线随机密码生成器，例如 LastPass ([`lastpass.com/generatepassword.php`](https://lastpass.com/generatepassword.php))。为了实现真正的随机性，将默认的“最小数字计数”从
    1 改为 0。通过将生成的密码分成 3-4 个字符一组来记忆它。或者，通过选择以密码中字符开头的单词，从你的密码创建一个易记的短语（注意：不是从短语反向创建密码！）。例如，密码
    `xPgpbSGIdj5zac` 可以变成“Xander, Please get peanut butter Sandwich Glue. I did join
    5 zoos and churches.”（Xander，请去买花生酱三明治胶水。我确实参加了 5 个动物园和教堂）。


    通过在文档中输入密码来练习记忆。这有助于建立肌肉记忆并动用大脑更多部分来辅助学习。如果你想在实际账户上使用密码之前测试你的记忆，可以使用此密码保存文档，并在两天后尝试打开它。在大多数办公软件中，通过“文件-另存为”并勾选“加密保存”来保存带密码的文档。如果你以后回来查看时忘记了密码，只需删除文档重新开始。当你确信已经记住了密码时，将其作为你喜爱的密码器的主密码，或用于你的云存储账户。


    ## 5.5 为安全付费


    许多云数据存储提供商为付费账户提供加密和其他隐私增强功能。为云数据安全付费会让你的私有数据不太可能成为提供商的产品。如果你是受 HIPAA 等联邦法规约束的企业，正如第
    4 章 所，你很可能需要支付额外的安全费用。


    然而，数据隐私问题仍然存在。你仍然必须依赖云存储提供商管理自身的安全。此外，如果由提供商管理加密密钥，那么你数据所在地的当地法律可能会允许在没有你预期的法律管辖权程序的情况下访问你的未加密数据。此外，当地法律可能对使用的加密类型进行限制。这种情况可能会出现在至少默许支持间谍活动或反对政治活动的国家。


    如果你确实为额外安全付费，请坚持要求零知识加密。零知识加密意味着你的数据在上传到云存储提供商之前就已经被加密。提供商不知道你的加密密钥，如果你忘记或丢失密钥，他们无法帮助你解密数据。如果没有零知识加密，第三方拥有你私有数据的密钥。根据合同，他们同意不使用这些密钥查看你的数据。然而，法律体系之所以存在是因为人们会违反合同，这些第三方可能会成为数据泄露的受害者。


    Mega ([`mega.co.nz/`](https://mega.co.nz/))、SpiderOak ([`spideroak.com/`](https://spideroak.com/))、Tresorit
    ([`tresolit.com/`](https://tresolit.com/)) 和 Wuala ([`www.wuala.com/`](https://www.wuala.com/))
    提供带有零知识加密的云存储。但要仔细检查条款，因为与他人共享数据可能意味着你的私有数据会在云提供商服务器上被临时解密。


    ## 5.6 删除私有数据


