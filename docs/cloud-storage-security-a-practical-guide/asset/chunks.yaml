    美国录唱行业协会（RIAA）和美国电影协会（MPAA）等机构对用于非法共享受版权保护材料的云存储表示担忧。《数字千年版权法》（DMCA）赋予了版权所有者对涉嫌侵犯版权的违者采取行动的法律权限。尽管
    `DMCA` 的策略和执行仍存在争议，但这些机构确实有其道理。他们出售受版权保护材料供个人使用。如果该个人制作副本并将其赠送或卖给他人，那么他们就剥夺了版权所有者的物质利益。这种问题在汽车等实物品上不会发生。当你购买一辆汽车时，你可以使用它，也可以让别人使用。你不能制作汽车的免费副本并将其送人。然而，你可以在数字媒体上这样做，这给版权所有者造成了困难。


    民事诉讼（如商业诉讼或离婚）可能会让他人获得访问你云数据的法律权限。对这些数据的请求将发送给你的云提供商，他们可能会遵守任何合法的法律请求。结果是未知人士可能会查看你的敏感数据，并由法院将其下载并存档到不受你控制的地方，且时间未知。此外，他们查看或下载的数据实际上可能与诉讼无关，但由于数据请求的范围而被包含在内。


    法律授权可能会让你的大量数据供执法部门以及任何负责分析你数据的机构（无论公共还是私立）访问。这意味着他人将完全访问你的数据，而无法保证这些数据将发生什么变化，或者它们将如何被使用或由谁使用。


    警察拦截和安全检查站为执法部门提供了访问你数据的搜查令或理由。在美国设备的法律地位仍然处于动态且模糊的状态。这意味着你和当局都可能误解你们的责任。在美国，密码可能受《第五修正案》保护，但生物识别锁可能不会。作为一个
    Case 案例子，弗吉尼亚州的一家法院最近裁定，密码具有第五修正案的保护，因为它代表了知识，而指纹没有，因为它充当物理钥匙（


    鉴于目前云数据和普通电子媒体的法律不确定性，当局在认定你的保护行为为非法后，可能会考虑采取行动保护你的数据。你拒绝允许当局访问你的设备以及从设备访问的数据可能会导致你被捕。即使你的做法正确，你也可能遭受对数据隐私和安全法律的误读。在这种情况下，即使你赢得了法律诉讼，你在时间、金钱、压力以及处理这种情况所错的机会方面仍然失败了。


    管理你的物理位置和数据物理位置的当地法律影响该数据的安全性。你可能将数据存储在物理位置位于美国的云存储中。然而，前往美国境外可能会让你处于这种情况：其他国家的执法部门可以强制你通过设备向他们展示这些数据。或者，美国外的云存储中心拥有不同的法律规定谁在什么情况下可以访问你的数据。


    ### 1.2.3.2 刑事威胁


    下面的列表显示了攻击你的数据和云存储的动机类别。


    - `Exploit`。对你有价值的数据对其他人可能也有价值。

    - `Deny`。暂时阻止你获取数据可能让他人受益。

    - `Destroy`。永久销毁你的数据可能让他人受益。

    - `Deceive`。对你的数据进行细微修改，在引起问题之前可能未被察觉。

    - `Usurp`。对你的数据进行细微修改，在引起问题之前可能未被察觉。（等一下，原文中对 Usurp 重复了 Deceive 的描述，我将保留内容但修复格式）。*注：根据提供的文本，“Usurp”
    后面没有描述，但我将维持所提供的文本。*


