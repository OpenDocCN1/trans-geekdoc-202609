    同样令人关注的是，当信息从数字世界的二进制 1 和 0 转换为生物世界的 `A`、`T`、`G` 和 `C` 时，由此产生的 DNA 代码在生物有机体中意味着什么？例如，一张
    `JPG` 格式的母亲照片会转化成一种具有传染性的生物病毒吗？或者读取一段生物 `DNA` 链会转化为一种具有传染性的计算机病毒吗？从安全的角度来看，问题在于这些看似随机的
    1 和 0 在生物术语和计算术语中究竟是什么含义？显然，有很多有趣的研究问题需要考虑和解决。


    此外还有伦理问题，即我们是否以这种方式对生命的底层机制进行操控和实验。这些问题的答案将由神学家、哲学家、伦理学家和科学家来给出。


    ## 7.2.7 云端 – 数据、信息、问题


    在本书中，我们讨论了在云端存储信息的概念，但我们还没有对“信息”作为一个概念进行定义。物理学家埃利亚胡·戈拉特（Eliyahu Goldratt）有一个简单而优雅的定义：“信息是对所提问题的答案。”如果我们提出正确的问题，数据就可以提供丰富的信息。云端包含数据；它包含某些信息；未来将由我们提出的问题决定。在一种可能的未来，通过使用
    `DNA`，我们可能会成为存储设备——我们所有人共同成为云端。那么问题就是，我们应该问什么问题？听起来熟悉吗？


