  trans: '

    在设定财务目标时，明确你的目标更为重要，因为这会增强你对未来做出卓越投资决策能力的信心。要时刻关注新的投资机会，并在可能的情况下，避免一次性赚取大量资金。


    投资组合类似于从零开始盖房子，一砖一瓦、一分一钱地，从地基开始逐步向上构建。为了避免错误，把事情做对比做得快更重要。


    # 第八章


    ## 音乐与元宇宙


    他们一致认为，在互联网扩张的早期，音乐行业经历了彻底的颠覆，并变得面目模糊。


    随着 COVID-19 病毒的爆发，音乐行业尤其是现场音乐家，为了保持竞争力，被迫进行创新并探索与观众互动的新技术。


    结果，由于这种情况的影响，他们开始在互联网上表演。坦诚地说，网络流媒体的概念已经存在了相当长的时间。1995 年，滚石滚乐队等乐队就开始尝试这种形式，结果前景广阔。像
    `Spotify` 这样的组织将其整个业务模式建立在通过互联网传输音乐的基础上。与典型的“原味”直播或甚至是订阅制流媒体不同，元宇宙中的音乐消费在许多至关重要的方面与传统的“原味”直播或订阅流媒体有显著区别。这些差异将在下一节中详细讨论。


    建立虚拟场馆和/或其中表演的能力被称为虚拟场馆能力。


    这项功能实现了与观众的实时通信与互动。


    艺术家的化身或其他视觉形象通常与艺术家的精确视频图像相结合，以为观众提供更真实的体验。一系列新的制作能力正变得触可用，包括修改虚拟环境的能力以及将数字视觉制作与艺术家的音乐作品融合的能力等。


    据特拉维·斯科特（Travis Scott）称，他在 `Fortnite` 中出现的表演是近年来这种新型音乐艺术形式中视觉吸引力和商业上最成功的案例。由于这次活动，这一事件引起了大量的关注和兴趣。除了虚拟活动和非传统娱乐形式（`NFTs`），元宇宙对音乐行业的另一个进一步发展是虚拟“艺术家”的引入。


    许多真正的音乐鉴赏家可能会对合成艺术家的概念感到反感，这是可以理解的。由人工智能创造的人没有独立的个性；相反，他或她是人工智能的产物。


    事实上，这类音乐家在随着互联网作为资源长大的年轻人中获得了大量的人气。当谈到被誉为“一位以华丽风格和潮人审美闻名的机器人说唱歌手”的 `FN Meka` 时，人们很难不受他的影响。


    这是一种轻浮的、带有模糊未来感的娱乐形式，尽管其外表如此，但它是建立在具有巨大经济可能性的基础上的。然而，尽管这位虚拟歌手在视频分享应用 `TikTok`
    上有超过 900 万粉丝，但他现在仍是这本书的作者。


    在制作这本书之前，通常被称为“新一代超级巨星歌手之一”的机缘说唱者（Chance the Rapper）只有略多于 200 万的 `TikTok` 粉丝，与其他热门歌手相比，这是一个很小的数字。


    考虑到这两个事件，关于元宇宙究竟是音乐业务的机会来源还是风险来源的问题随之产生。


    例如，如上面提供的两个实例所示，元宇宙可能同时为音乐行业提供机会和问题。在当今尖端生产、消费方法以及日益普及的消费者体验中，依赖已不再适用于这个世界的过时程序，对于创意行业的人士来说是危险的。考虑这样一种场景：你是某项材料版权的所有者，并通过订阅制流媒体渠道将其变现。结果是，你通过这些策略获得的收入不足以支付你在这些策略中的初始投资成本，你将亏损。短短几年后它们就会变成可以自动化的商品。


    那些愿意突破边界并充分利用所有可用技术进行交流和创作的企业将发现，他们未来的发展前景几乎是无限的。相比之下，即使是最广泛的体育场巡演，也无法与艺术家为在线元宇宙现场表演可能聚集的瞬时、一次性的全球观众竞争。在亲身经历了
    COVID-19 疫情（这导致全世界的人转向互联网寻求娱乐）后，音乐行业得出结论：付费、制作精良且迷人的直播在可预见的未来将继续以某种形式存在。在未来，现实世界中发生的最重要的演唱会节日可能会包含一个在线部分，这个部分比物理活动本身更专注、流畅且更具交易性。因此，在可预见的未来，元宇宙将在音乐领域持续存在。


    ## 虚拟现实中的法律后果


    在虚拟现实世界中，在那里播放音乐会有什么样的法律后果？


    当音乐在互联网上生成、播放、流传输和利用时，音乐权利清理是最需要考虑的，就像在包括录音行业在内的音乐行业的所有其他方面一样。对于“在线利用的绝大多数标准法律和许可限制适用于元宇宙”这一通用规则只有少数例外。为音乐表演和利用增加额外的互联网设置（无论是限制性的还是开放的），可能会为音乐许可过程中本已复杂的权利链增加另一层复杂性，而这个过程已经足够令人困惑。


    举例来说，数字音乐服务提供商（例如该公司）可能会在全球视频游戏机平台上推广并组织一场直播演唱会，就像 `Spotify`（例如 `Sony PlayStation`）的情况。


    虽然这种演唱会可能会在锦赛休息期间举行，并由大型游戏发行商（例如 `Electronic Arts`）进行市场推广，但演唱会也可能在此期间内与知名品牌（例如
    `Adidas`）合作举办。

