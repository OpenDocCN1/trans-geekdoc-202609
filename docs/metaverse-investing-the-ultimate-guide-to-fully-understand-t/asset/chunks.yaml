    另一个争议点是，元宇宙需要达到何种程度的互操作性才能被视为“元宇宙”，而不仅仅是现有互联网的演变。许多人还问，在一个真正的元宇宙中是否可以只有一个运营者，而不是一个虚拟元宇宙（正如《头号玩家》中的情况那样的）。根据某些人的观点，元宇宙的定义（以及成功）需要一个强去中心化的平台，该平台主要构建在社区驱动的标准和协议（类似于开放网络）之上，以及一个“开源”的元宇宙操作系统或平台（尽管这并不排除元宇宙中存在主导地位的封闭平台）。


    另一个值得考虑的想法是元宇宙的基础通信架构。虽然现在的互联网是基于单个服务器之间根据需要进行“对话”来构建的，但其他人认为，元宇宙应该建立在持续的多对多连接上进行“布线”和“管理”，而不是基于单个服务器的“对话”。关于这种模式将如何运作，以及去中心化的程度如何，目前尚未达成共识。


    思考一下元宇宙通常被比作什么也是好的，即使这种类比是不准确的。虽然这些相似之处很可能是元宇宙的一部分，但它们本身并不是元宇宙。相反，元宇宙并不是……


    ### 虚拟世界


    “虚拟世界”是一个只存在于用户脑海中的宇宙。虚拟世界、带有 AI 驱动角色的游戏以及那些充斥着“真实”个体的世界首次出现已经几十年了。人们正在探索一个合成且虚构的世界，而不是一个具有单一目标的“元”（希腊语，意为“超越”）宇宙（一个游戏）。


    虚拟世界，如 `Second Life`（第二人生），经常被称为“原型元宇宙”，因为它们 (A) 没有游戏那样的目标或技能系统；(B) 是持久的虚拟聚会场所；(C)
    提供近同步的内容更新；以及 (D) 具有由数字化身代表虚拟世界中的真人。但正如后文将讨论的，这些属性对于元宇宙来说是不充分的。


    ### 虚拟现实 (VR)


    虚拟现实（`VR`）体验是一种让自己沉浸在虚拟环境或区域的方法，而无需真正身处其中。要符合元宇宙的标准，必须有一种身处数字环境的存在感。本质上，这等同于仅仅因为你可以看到并在其中漫步，就声称住在一个富裕的城市里。


    ### 数字经济


    另一种经济类型——“数字和虚拟经济”——已经存在。单个游戏，如 `World of Warcraft`（魔兽世界），长期以来一直运行着经济体系，其中真人在长时间内用虚拟商品交换真实货币，或通过虚拟劳动获取货币。此外，诸如
    `Amazon''s Mechanical Turk`（亚马逊众包）等平台以及 `Bitcoin`（比特币）等技术基于利用人员、公司和计算能力进行虚拟和数字劳动，这就是它们存在的原因。目前，我们正在通过完全数字化的市场，对纯数字商品和服务以及纯数字活动进行大规模交易。


    `Fortnite`（堡垒之夜）是一个“游戏”，但它包含各种元宇宙组件。例如，它 (A) 融合了 IP（知识产权）；(B) 拥有跨越多个封闭平台的一致身份；(C)
    是通往各种体验的门户，其中一些是完全社交的；以及 (D) 为内容提供者付费。虽然它自《头号玩家》发布以来有所改进，但就它可以完成的内容、能走多远以及可以完成哪些“工作”（至少目前如此）而言，仍然不足。然而，尽管元宇宙可能具有某些类游戏的目标，可能包含游戏，并可能利用游戏化，但它本身并不是一个游戏，它也不专注于实现特定目标。


    ### 主题公园与建筑


    “虚拟迪士尼乐园或主题公园”是一种虚拟主题公园。“景点”的数量将是无边际的，而且它们不会像迪士尼乐园那样被“规划”或“编程”，它们也不会像迪士尼乐园那样的完全关于趣味或娱乐。此外，参与度的分布将具有非常长的长尾效应，参与度的分布也也是如此。


    没有人需要一种访问应用程序的新方式，而且（例如）“在 `VR` 中”这样做并不会解锁/开启继代互联网所承诺的类型价值。然而，将会有一个“新的应用商店”。元宇宙的架构、范式和目标与今天的互联网/移动架构、范式和目标大不相同。


    换句话说，元宇宙并不是另一个类似于 `YouTube` 或 `Facebook` 的平台，在那里许多个人可以在其中创建、分享和变现材料，而最受欢迎的内容仅占总消费的一小部分。元宇宙是一个“新的用户生成内容平台”。这将是一个真正帝国建立的地方，这些资金充足的企业将能够在元宇宙中完全拥有一个消费者，管理
    `APIs` 和数据，并治理单元经济学等。此外，正如网络的情况一样，可能有一个平台将占据用户时间、体验、材料以及生活其他方面的很大比例。


    考虑到这一点，想象一下置于《圣诞夜惊噩梦》中，你可以漫步进入任何活动或项目，并可能满足你的几乎任何欲望，而这一切都源自一个你所认识的所有人的家园起点或星球。这就是为什么超文本是如此重要的原因。然而，重要的是记住，元宇宙并不是传统意义上的游戏、一项技术或一种在线体验。它等同于声称
    `World of Warcraft`、`iPhone` 或 `Google` 都是互联网的表象。


    # 第二章：为什么元宇宙很重要？


    尽管元宇宙可能无法达到科幻小说家的宏伟预言，但它作为一个新的计算平台或内容媒介，预计将产生数十亿美元的价值。

    '
- fmt: '

    As a whole, the Metaverse has the potential to alter the way in which we distribute
    and market our current natural resources. For millennia, the developed economies
    have altered as labor, and real estate scarcity, have risen and fallen in demand.
    The Metaverse will provide opportunities for would-be workers living outside of
    cities to participate in the "high value" economy via virtual labor. As more consumer
    expenditures are directed toward virtual products, services, and experiences,
    we will witness more changes in where we live, the infrastructure that is built,
    and who performs certain responsibilities in the future. Take, for example, the
    notion of "Gold Farming." Many "players," many of whom were employed by a bigger
    firm and many of whom were from lower-income countries, would spend their workdays
    accumulating digital resources for sale outside or within the game not long after
    in-game trade economies were established. These sales were typical of higher-income
    players in the Western hemisphere. The diversity and worth of this "work" will
    increase in parallel with the Metaverse, despite the fact that most "labor" is
    menial, repetitive, and confined to a few applications.


    ## Creating the Metaverse


    Creating the Metaverse is a huge undertaking.


    When it comes to operating properly, the Metaverse will need an abundance of new
    technologies, protocols and businesses as well as technological advances and scientific
    discoveries. In addition, it won''t arise out of nowhere; there won''t be an obvious
    line between "Before Metaverse" and "After Metaverse." As numerous items, services,
    and capacities link and meld with one another, the Internet of Things will eventually
    develop. In any case, it''s important to think about three critical variables
    that must be in place.


    To think about these three categories procedurally, I think about them in terms
    of the Book of Genesis - first, one must establish the underlying universe ("concurrency
    infrastructure"), then describe its laws of physics and regulations ("standards
    and protocols"), and finally, one must fill it with valuable content ("Content")
    that evolves and iterates in response to selection pressures. This means God does
    not create and construct the world as if it were a miniature model, but rather
    enables one to grow over a mostly empty tableau, and so on.


    ## Infrastructure for Concurrency


    To put it simply, at its most basic level, the technology does not currently exist
    to support hundreds, much alone millions, of people all participating in the same
    synchronized experience. Take, for example, the Marshmello concert in `Fortnite`,
    which took place in 2019. In all, 11 million people tuned in to see the action
    in real time. They did not, however, do so in a coordinated fashion. It is estimated
    that almost 100,000 occurrences of the Marshmello concert took place, each of
    which was slightly out of sync and restricted to 100 participants. `Epic` can
    probably handle more now, but not in the hundreds of thousands or even millions,
    as it did in the early days.


    Not only does the Metaverse demand infrastructure that does not already exist,
    but the Internet was never intended to be used for anything even somewhat close
    to what is now being offered in the Metaverse. After all, it was established for
    the purpose of transferring data from one computer to another. As a result, the
    majority of the Internet''s underlying systems are built around a single server
    that communicates with another server or an end-user device over the Internet.
    It is still in use today, despite its age. Despite the fact that there are billions
    of people on `Facebook` today, each user has their own connection to the `Facebook`
    server and does not share this connection with anybody else. The effect is that
    whenever you access material from another user, you are only receiving the most
    recent information available from `Facebook`. Despite the fact that text dialogues
    were the first pseudo-synchronous apps, you are still giving largely static data
    to a server and retrieving the most up-to-date data from it as, when, where, and
    how you need it. When it comes to persistent (as opposed to continuous) communication,
    the Internet was never meant to be used for it, much alone persistent communication
    that was synced in real time with many other individuals.


    To work properly, the Metaverse necessitates the use of technology more comparable
    to video gaming and video conferencing. These meetings are made possible by permanent
    connections that allow the participants to keep each other up to date in real
    time and with a degree of accuracy that is not required by other programs. However,
    they are seldom used by a big number of people at the same time: most video chat
    systems have a capacity of just a few people, and once you reach 50 people, you''ll
    have to "live stream" a broadcast to your viewers rather than sharing a two-way
    connection. These interactions are not need to be genuine, and they are not in
    fact genuine.


    Towards this aim, one of the reasons why the battle royale genre has only recently
    gained popularity in video games is because it is only now feasible to play live
    with a large number of other players. The most popular games, such as `Second
    Life` and `World of Warcraft`, have been available for almost two decades, but
    they have largely mimicked the experience by "sharding" and splitting players
    into separate "worlds" and servers. For example, `Eve Online` may have more than
    100,000 players "in the same game" at the same time, despite the fact that they
    are distributed over numerous realities (i.e., server nodes). Consequently, a
    player is only ever exposed to a small number of other players and has very limited
    interaction with them at any one moment. Furthermore, switching to a different
    galaxy demands the termination of one server and the loading of another (which
    the game manages to "conceal" narratively by forcing players to travel at light
    speed to span the immensity of space). The system came to a grinding stop if/when
    `Eve Online` reached combat with hundreds of people, as it did many times. Because
    the game''s overall gameplay dynamic was predicated mostly on large-scale, well
    designed ship-based fighting, it was a success.


    Especially if it had been a "fast-twitch" game like `Rocket League` or `Call of
    Duty`, it would have made the game completely unplayable.


    Several firms, like the aptly named `Improbable`, are putting up significant effort
    to solve this obstacle. This tremendous computing problem, on the other hand,
    runs counter to the Internet''s original architecture and goal.

    '
