  trans: '


    总而言之，元宇宙具有改变我们分配和营销当前自然资源方式的潜力。千年来，随着劳动力和稀缺性需求的起伏，发达经济体也随之变化。元宇宙将为住在城市以外的潜在劳动者提供通过虚拟劳动参与“高价值”经济的机会。随着越来越多的消费者支出转向虚拟产品、服务和体验，我们将见证在居住地、基础设施建设以及未来由谁来承担某些职责方面的更多变化。以“金币农场”概念为例：在游戏内贸易经济建立后不久，许多“玩家”（其中许多人受雇于大公司，许多人来自低收入国家）会花费工作时间积攒数字资源，以便在游戏内或游戏外进行出售。这些销售行为是西半球高收入玩家行为的典型特征。尽管大多数“劳动”是琐碎、重复且局限于少数应用程序的，但这种“工作”的多样性和价值将随着元宇宙的发展而并行增加。


    ## 创建元宇宙


    创建元宇宙是一项艰巨工程。


    在正常运行方面，元宇宙需要大量的新技术、协议和业务，以及技术的进步和科学发现。此外，它并不会凭空出现；“元宇宙之前”和“元宇宙之后”之间并没有明显的界限。随着无数物品、服务和能力的相互链接与融合，物联网最终会发展起来。无论如何，考虑必须就绪的三个关键变量至关重要。


    为了程序化地思考这三个类别，我从《创世记》的角度来思考：首先，必须建立底层宇宙（“并发基础设施”），然后描述其物理定律和规则（“标准和协议”），最后，必须用有价值的内容填充它（内容），这些内容会根据选择压力进行进化和迭代。这意味着上帝并不是像构建微缩模型一样创建和构造世界，而是让在一个大部分空旷画布上生长，以此类推。


    ## 并发基础设施


    简单来说，在最基础的层，目前的技术尚无法支持成百上万、甚至是百万人同时参与同一个同步体验。例如 2019 年在 `Fortnite` 中举行的 Marshmello
    演唱会。总共有 1100 万人在线观看这一活动。然而，他们并不是以协调的方式参与的。据估计大约发生过 100,000 次 Marshmello 演唱会，每场都略有不同步，并限制在
    100 名参与者。`Epic` 现在可能可以处理更多，但无法像早期那样处理数十万甚至百万级的并发。


    元宇宙不仅需要目前不存在的基础设施，而且互联网之初也从未打算用于任何与目前元宇宙所提供的内容相似的东西。毕竟，它的建立目的是将数据从一台计算机传输到另一台计算机。因此，互联网大部分底层系统都是围绕单个服务器构建的，该服务器通过互联网与另一个服务器或终端设备通信。尽管由于年代久远，但它在今天仍在使用。尽管今天
    `Facebook` 上有数十亿用户，每个用户都有自己到 `Facebook` 服务器的独立连接，且不与任何其他人共享此连接。结果是，每当你访问另一个用户的材料时，你只能接收到来自
    `Facebook` 的最新信息。尽管文本对话是首批伪同步应用，但你很大程度上仍然是向服务器提供大量静态数据，并根据你需要的时间、地点和方式从那里检索最新的数据。当涉及到持久性（相对于连续性）的通信时，互联网从未被设计用于它，更不用说与许多其他人实时同步的持久性通信了。


    为了正常工作，元宇宙需要使用类似于视频游戏和视频会议的技术。这些会议通过持久连接成为可能，允许参与者实时保持同步，并达到其他程序并不所需的精度。然而，它们很少被很多人同时使用：大多数视频聊天系统的容量仅为几个人，一旦达到
    50 人，你就必须向观众进行“直播”，而不是共享双向连接。这些互动并不是真实的，事实上也并非如此。


    为了实现这一目标，元宇宙需要使用更接近视频游戏的技术。这也是为什么大逃杀竞技类型之所以最近在视频游戏中流行起来的原因之一，因为现在才可行与大量玩家一起游戏。最受欢迎的游戏，如《第二人生》和《魔兽世界》，已经存在了近二十年，但它们很大程度上通过“分片”并将玩家分成不同的“世界”和服务器来模拟这种体验。例如，《星空帝国》可能有超过
    100,000 名玩家同时处于“同一个游戏”中，尽管他们分布在多个现实（即服务器节点）中。因此，玩家在任何时刻只能接触到少数玩家，与他们的互动非常有限。此外，切换到不同的星系需要关闭一个服务器并加载另一个服务器（游戏通过叙事上让玩家以光速旅行来掩盖这一点）。当《星空帝国》达到数百人的战斗时，系统就会陷入停滞，这种情况发生过多次。由于游戏的整体游戏动态在很大程度上取决于大规模、设计良好的舰船战斗，因此它是成功的。


    '
