    可以有一个更通用的表述：堡垒之夜（Fortnite）开发出了一种新的子经济，其中“玩家”可以制作（并出售）自己的内容。皮肤（数字服装）和舞蹈（表情）就是这类内容的例子。尽管它最初只是一小部分游戏，但它已迅速扩展，涵盖了任何使用堡垒之夜引擎、资产或美学的新游戏和体验。每种玩家都能找到自己喜欢的的内容，从简单的寻宝游戏，到格林兄弟童话与跑酷文化的复杂融合，再到一部跨越多个宇宙和时间跨度的
    10 小时幻史诗。此外，堡垒之夜的创作模式已经开始看起来像元宇宙的前传。一旦进入其中，玩家可以在数千扇“门”（即时空裂缝）中进行选择，这些门将把他们带往数千个独立世界之一，在那里他们可以同时与其他
    99 名玩家一起游戏。


    正如创意总监唐纳德·马斯德（Donald Mustard）所日益明确的那样，游戏的长期野心是问题的核心。


    ## Epic Games


    堡垒之夜潜力最有说服力的指标之一，是它能够说服大量表面上的竞争对手进行合作（或展示早期的相互“互操作性”）。堡垒之夜目前已在每个主要的娱乐平台上可用——包括
    iOS 和 Android 等移动设备，以及 PlayStation、Nintendo、PC 和 Xbox 等主机——它允许跨越多个身份/账户系统、支付方式、社交图谱以及通常封闭的生态系统进行无缝跨平台游戏。长期以来，主流游戏平台一直反对这种体验，认为允许实现这种体验会削弱它们的网络效应，并减少购买其专利设备的需求。这导致了在
    PlayStation 上玩《使命召唤》的伙伴无法与在 Xbox 上玩《使命召唤》的朋友一起玩，尽管索尼和微软都知道他们想这样做。


    事实上，知识产权（IP）所有者并不愿意让他们角色和故事被整合到其他 IP 中。这种情况偶尔会发生（例如，几次漫威与 DC 的漫画联名和视频游戏）。然而，在一个他们不具备编辑控制权的体验中看到这种情况是极其罕见的，更不用说是一个以不可预测性为核心的体验了（连堡垒之夜的创作团队也不知道
    2021 年会发生什么），而且拥有如此广泛的知识产权光谱。


    如何强调有机演化的意义都不为过。如果你“宣布”了你要构建元宇宙的意图，这些方永远不会接受互操作性，也不会将他们的知识产权交给你。然而，就像宝洁（P&G）不能宣布“哦，Facebook
    不适合我们”一样，大多数交易对手除了加入对话别无选择。他们几乎肯定渴望成为“游戏”的一部分。因为堡垒之夜已经变得如此流行和独特，以至于大多数对手别无参与竞争。堡垒之夜是一个非常有价值的平台。


    堡垒之夜是这款游戏的名字。不过，请在了一两年后再次询问这个问题。


    ## 元宇宙构建努力


    Epic 在其构建元宇宙的努力中提供的不仅仅是一个通往世界的具有视觉吸引力的入口。此外，Epic Games 是虚幻引擎（Unreal Engine）2 的所有者（这是第二大的独立游戏引擎），并负责堡垒之夜的运营，据称这曾是该公司的一个侧项目。为了简单起见，目前有成千上万的游戏正在使用它的“技术栈栈”。


    ## 在线服务


    虽然 Epic 在线服务（Epic Online Services）目前处于私用测试阶段，但公司声称它将于 2020 年第二季度向公众开放，并在可用后支持“成百或上千”个游戏。此外，值得注意的是，所有这一切都减少了
    Epic 在长期元宇宙构建计划方面对堡垒之夜的依赖。

    '
- fmt: '

    Epic also operates one of the biggest (albeit still very small) digital gaming
    shops in the world, enabling customers to access a wide range of digital content
    and experiences. Customers were not interested in greater digital content fragmentation,
    and the vast majority were satisfied with the market leader `Steam`. Tim Sweeney,
    the founder and CEO of `Epic Games`, has been vocal about how today''s standard
    30 percent fees for digital content purchases (for example, on `iOS`, `Amazon`
    or `Google Play`) are not only usurious, but also prevent the development of a
    genuinely global digital market. If credit card fees were 60-20 times greater
    than they are currently, huge sectors of the physical economy would be impossible
    to operate (such as a coffee shop or grocery store). This service is just 12 percent
    of the total cost of `Epic` (including the 5 percent `Unreal` licensing fee, too,
    making it only 7 percent for many customers). Particularly noteworthy, reports
    continue to circulate that Sweeney sought even lower fees before agreeing with
    his board to a rate of 12 percent - which Sweeney acknowledges is insufficient
    to pay operational expenses in all cases. Not that there isn''t a wider commercial
    opportunity here; operating a shop will surely help to the expansion of the Metaverse
    - but Sweeney''s efforts look to be far broader in scope than that. `Epic''s`
    prices are being avidly sought after by `Google` and `Apple`, despite the fact
    that they generate thousands of times the income of `Epic''s` fledgling shop.


    If the 88/12 percent retail conflicts were decided by a coin flip, the outcome
    would be as follows: Because the other retailers aren''t reacting, `Epic Games
    Store` succeeds, and so all creators triumph as a result of this. Because of `Tails`,
    our rivals have caught up with us and have lost our revenue-sharing edge. Other
    retailers may benefit as a result, but all developers benefit.


    # Chapter Three


    Who else is capable of constructing the Metaverse?


    Despite the fact that the Metaverse has the capacity to completely replace the
    Internet as a computing platform, it is unlikely to follow in the footsteps of
    its forerunner. In the United States, public research institutions and government
    initiatives were responsible for the development of the Internet. This was partially
    due to the fact that few in the private sector saw the economic potential of the
    World Wide Web, but it was also due to the fact that these organizations were
    virtually the only ones with the computing power, resources, and ambitions necessary
    to build it. If we look at it from a Metaverse perspective none of this is true.


    Private industry is not only fully aware of the Metaverse''s potential, but it
    also has the most confident belief in its future, as well as the most money (at
    least when it comes from a willingness to support Metaverse research and development),
    the best engineering skill, and the most conquest ambition of any other sector.
    Companies want to be in charge of and define the Metaverse, rather than just being
    at the forefront of its development. In spite of the fact that there are just
    a few potential leaders in the early Metaverse, open-source efforts with a non-corporate
    perspective will continue to play an essential role in the Metaverse and will
    attract some of the most exciting creative talents. And you will be able to distinguish
    between each of them.


    `Microsoft` is a good example of how to do this. With `Office 365` and `LinkedIn`,
    the company has hundreds of millions of federated user identities, is the world''s
    second-largest cloud vendor, has an extensive suite of work-related software and
    services that span all `platforms/infrastructure/systems`, has demonstrable technical
    expertise in massive shared online content/operations, and has a set of potential
    gateway experiences with `Minecraft`, `Xbox + Xbox Live`, and `HoloLens`, among
    other things. Accordingly, the Metaverse presents a chance for `Microsoft` to
    reclaim the `OS/hardware` leadership it had lost during the transition from `Windows
    95` to `Windows NT`.


    From the computer to the mobile device. But, perhaps more importantly, `Microsoft`
    CEO `Satya Nadella` realizes that the company must be present wherever work is
    done. With `Microsoft''s` successful transition from enterprise to consumer, `PC`
    to mobile, and offline to online, it''s difficult to imagine the company not playing
    a significant role in the virtualized future of labor and information processing.
    `Microsoft` has successfully transitioned from enterprise to consumer, `PC` to
    mobile, and offline to online, all while maintaining a prominent role in the "work"
    economy.


    It is clear that `Facebook` CEO `Mark Zuckerberg` is preoccupied with the Metaverse,
    despite the fact that he has not declared explicitly that he wants to develop
    and run a Metaverse empire. This is also a great strategy. As a result of the
    Metaverse''s creation of an even bigger and more powerful social graph, as well
    as a new computer and interaction platform, `Facebook` stands to lose the most
    money of any other firm. Meanwhile, the Metaverse allows `Facebook` to broaden
    its influence across the whole stack of social media. Although there have been
    other efforts to design a smartphone operating system and deploy consumer hardware,
    `Facebook` is the first `FAAMG` enterprise that is completely focused on the application
    and service layer. Because of the Metaverse, `Facebook` might become the next
    `Android` or `iOS/iPhone` (thus `Oculus`), as well as a virtual goods equivalent
    of `Amazon`.


    The advantages of `Facebook` in the Metaverse are immeasurable. Every other platform
    on the earth pales in comparison to its number of daily users, daily use, and
    user-generated content. It also has the second highest proportion of digital ad
    expenditure, billions in money, thousands of world-class engineers, and an owner
    who has majority voting rights. Furthermore, its `Metaverse` assets are expanding
    at a rapid pace, with patents for semiconductors and brain-to-machine computing
    interfaces now among its most valuable assets. The company''s track record, however,
    as a platform enabling third-party developers and organizations to construct long-term
    enterprises, as a ringleader in a consortium (e.g., `Libra`), and as a manager
    of user information and trust is dismal.


    `Amazon` is exciting for a variety of reasons. In order to be the primary site
    where we make purchases, it will constantly try to be that. It doesn''t matter
    if the item is bought using a gaming engine, a virtual environment, or a web browser;
    the purchase is still valid. In addition, the company already has hundreds of
    millions of credit cards and the world''s largest share of e-commerce (excluding
    China). It also operates a variety of consumer media experiences (music, ebooks,
    video, video game broadcasting, audiobooks, etc.) and third-party commerce platforms
    (e.g., `Fulfilled by Amazon`, `Amazon Channels`), and it is developing what they
    hope will be the first major gaming/rendering engine purpose-built for the cloud
    (`Amazon Cloud Gaming`).

    '
