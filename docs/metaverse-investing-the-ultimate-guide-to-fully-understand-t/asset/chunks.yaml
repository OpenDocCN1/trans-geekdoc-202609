    # 亚马逊与元宇宙


    公司的创始人兼首席执行官杰夫·贝佐斯（Jeff Bezos）对基础设施支出非常有热情；这一点尤为重要。例如，`AWS`（亚马逊云）负责互联网运营。公司销售、包装并交付其他公司提供的物品，而不是直接购买和销售库存。亚马逊配送（Fulfilled
    by Amazon）占了亚马逊收入的 80%，公司 80% 的收入来自这项服务（与大多数零售商一样）。贝佐斯曾表示，他对`Blue Origin`（蓝色起源）的目标是“在太空建立巨大的芯片工厂，并只需发送小碎片”，这类似于早期的网络协议和他的亚马逊云服务（`AWS`）。虽然埃隆·马斯克的私人航天公司
    `SpaceX` 渴望殖化火星，但贝佐斯表示，他对`蓝色起源`的目标是“在太空建立巨大的芯片工厂，并只需发送小碎片”。这意味着亚马逊比任何其他 FAAMG
    企业都可能支持一个完全开放的元宇宙——因为它不需要控制用户体验或身份，因为它从后端基础设施使用和数字交易的巨大增长中获益。


    # 谷歌与元宇宙


    就像互联网是一个数据矿一样，元宇宙将包含比现有网络更多的数据和可能更大的回报。在全球范围内，谷歌是唯一一家在这些数据变现方面做得比自己更好的公司。得益于其在索引数字和物理世界方面的领先地位（有近
    10,000 名员工参与制图工作），该公司也是中国之外最成功的数字软件和服务公司。此外，它还拥有世界上最流行的操作系统（`Android`）和最开放的主流消费级平台（`Windows`）。谷歌是第一家通过
    `Google Glass` 积极追求可穿戴计算潜力的公司，尽管 `Google Glass` 失败了，但公司现在正通过 `Google Assistant`、其
    `Nest` 设备系列和 `FitBit` 大力推动家居数字化。因此，元宇宙最可能是将谷歌迄为止的所有分散投资整合在一起的唯一努力，这些投资包括 `Stadia`
    边缘计算、`Project Fi`、`Google Street View`、大量的暗纤购买、可穿戴设备以及虚拟助手等其他技术。


    # 苹果与元宇宙


    底层元宇宙极可能不会受到底层元宇宙的影响或管理。事实上，它运营着世界上第二大计算机平台（也是目前为止最有价值的），还是全球最大的游戏商之一（这意味着它支付给开发者的费用比地球上任何人都都要多）。公司还在积极投资增强现实设备和“结缔组织”以帮助元宇宙的发展。[来源：维基百科]（例如
    `Apple Watch`、`Apple AirPods`、信标）。另一方面，苹果的思维方式和商业模式与创新开放平台的发展是不兼容的，在这样的平台上，任何人都可以访问完整的用户数据和设备
    `APIs`。因此，与其作为运营商/驱动者，苹果更有可能是西方世界与元宇宙交流的主要方式，而不是反过来。这与互联网一样，几乎肯定会对所有参与方有利。


    # Unity 引擎策略


    如果元宇宙涉及资产、体验和通用 `APIs` 的广泛交互，`Unity` 将成为促进这种相互作用的关键。该引擎被超过一半的手机游戏使用，在现实世界的渲染和模拟应用（如建筑、设计和工程）中的使用范围甚至比
    `Unreal Engine` 更广泛。迪士尼的《曼达洛人》（The Mandalorian）在导演乔恩·法弗罗（Jon Favreau）创作和拍摄写实版《狮子王》的同时，正在
    `Unity` 中进行创作和拍摄。该公司还拥有并运营着世界上最大的数字广告网络之一（这是每天支持 100 亿分钟移动娱乐的一个良好副作用）。然而，尚不确定
    `Unity` 在未来几个月几年内推动元宇宙发展将扮演什么作用。目前没有实体商店，没有用户账户系统，也没有真实的直接面向消费者体验。它的大部分辅助服务（那些与搜索引擎或广告无关的服务）并不经常被使用。此外，如前所述，绝大多数（尽管不是所有）`Unity`
    驱动的游戏都是基础手机游戏，而不是元宇宙网关。然而，考虑到它对标准、游戏时间和内容生产等其他方面不可避免的影响，无法想象它不会被购买并整合到具有更大资产和福利的大型技术业务中。


    此前，很难证明购买 `Unity` 的合理性。潜在的购买方必须确保 `Unity` 保持完全的平台中立，以保持市场主地位、开发者支持和影响力（例如，`Google`
    无法让 `Unity` 在 `Android/Chrome` 上独占或成为最佳，否则会疏远大量开发者）。但是，这并不排除未来将 `Unity` 变为专有引擎作为一种明智战略决策的可能性。这种选择将导致价值的流，加上收购
    `Unity` 所需的溢价，无疑会让这种举动在财务上不可持续的。另一方面，购买 `Unity` 可能是由于在新互联网中占据关键位置的愿望，在这种情况下，收购者将有强动力保持引擎跨平台开放/可用，价格将迅速变得不再重要。


    # Epic 与 Valve


    如果 `Epic Games` 有一条通往元宇宙的现实道路，那么 `Valve` 也必须有。在用户、资金和游戏时间方面，`Epic Games Store`
    与 `Valve` 的 `Steam` 比自见绬。它是市场上许多最流行、运行最长的多人游戏（`Counter-Strike`、`Team Fortress`、`DotA`）的创造者和所有者。此外，在内容创作和盈利创新方面也有悠久的历史（它是首次尝试
    `AAA` 免费游戏和玩家对玩家市场）。例如，`Valve` 花了多年开发和发布虚拟现实技术，该公司现在每年产生数十亿美元收入。`Valve` 由一组对开源技术充满热情并反感封闭设置的程序员私有。另一方面，`Valve`
    的 `Source` 引擎受关注较少，与 `Epic` 不同，它似乎对将自己的能力和资产整合起来创建元宇宙感兴趣。


    ## 结论


    全息图在元宇宙中的作用是什么？


    互联网的引入带来了一系列技术进步，包括跨距离连接计算机以及将互联网上的一个网页链接到另一个网页的能力。这些技术特性为我们现在与互联网相关的抽象结构（如网站、应用程序、社交网络以及建立在其之上的一切）奠定了基础。这还没有考虑到非互联网接口技术的融合，如显示器、键盘、鼠标和触摸屏，这些对于互联网的正常运行仍然是。


    元宇宙的引入了一些新的构建模块。例如，一个服务器实例可以托管数百人（未来的元宇宙版本应该能够处理成千上万），并且运动追踪工具可以识别人的手的位置。这些新技术在未来可能是非常令人兴奋且具有未来感的。


