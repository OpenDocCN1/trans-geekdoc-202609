  trans: '

    增强现实是一项将现实世界的场景与数字增强相结合的技术。例如，如果你使用增强现实，你虽然身处现实世界，但可能会看到一条巨龙停在你邻居的汽车上。


    它已经用于许多游戏和导航系统。`Pokémon Go` 是最受欢迎的 AR 应用之一，允许玩家使用手机摄像头对在现实世界中“出现”的宝可梦进行寻找、战斗和捕捉。


    除了游戏应用外，AR 还被应用于导航系统。`Google` 的 AR 和 VR 技术允许用户更多地探索现实世界。


    这种现实世界软件旨在为用户提供更具沉浸感的体验，让他们充分利用智能设备的价值。例如，当你使用 `Google Maps'' Live View` 时，你可以更轻松地穿过某个区域，因为路线指示叠加在你的
    `Google Street View` 照片之上。


    另一个应用是在 `Google Search` 中利用增强现实的能力。这允许你在所在区域内设置 3D 物体，并更好地理解它们的尺寸比例。


    AR 的其他现实世界应用还包括：

    1. 在足球比赛中演示战术

    2. 让你了解一件家具在房间里的可能样子

    3. 通过在遗迹上叠加古代文明的照片，让历史遗迹活起来


    AR 技术正在进入教室。`The Metaverse Studio` 是一个增强现实平台，允许老师和学生在教室里开发增强现实。它可以被用于构建应用、游戏和活动，以补充项目制学习。


    ## 增强现实的演变


    2016 年，`Pokemon Go` 的狂热潮将增强现实（AR）推向了主流。尽管全世界在“捕捉它们”时，它似乎是一项尖端技术，但 AR 发明于 1968
    年。


    你知道增强现实的首次出现是在 1968 年吗？


    从 20 世纪 60 和 70 年代最早计算机生成的视觉效果和投影，到最新的 AR 游戏和 `Microsoft HoloLens Developer Kit`，增强现实的使用和潜力不断演变。2016
    年，增强现实和虚拟现实的总投资达到了 9.25 亿欧元，且没有放缓的迹象。


    ### 过去与现在的增强现实


    Ivan Sutherland 在 1968 年建造了第一个头戴式显示系统，这是 AR 的开始。空军使用 AR 创建虚拟夹具，美国航空航天局（NASA）利用它改进视觉导航测试。波音研究员
    Tom Caudell 在 1990 年创造了“增强现实”这一术语。AR 和互联网在 21 世纪初汇合，但得益于智能手机革命，对该技术的兴趣直到 2009
    年才爆发。由于智能可穿戴技术的增长，增强现实最近经历了第二次文艺复兴。


    ## 业务中的增强现实


    除了 AR 技术在游戏中的“传统”利用外，在物流、制造、零售等许多其他领域也出现了许多新的可能性和优势。AR 可用于任何可以从增加视觉叠加中获益的流程或商业活动，例如制造业。


    企业开始看到增强现实的可能性。`Boeing` 进行的一项实验让一组工厂学习员使用增强现实 (AR) 指令组装机翼。结果结果显示，处理时间缩短了 30%，但输出的不准确率增加了
    90%。类似地，`DHL` 现在正在其一个仓库中测试增强现实智能眼镜，目标是提高 25% 的效率，并考虑更广泛的部署。


    另一个利用增强现实技术来提升消费者体验的行业是零售。`Ikea` 推出了虚拟家具，允许客户在购买之前将 `Ikea` 商品虚拟地放置在他们的厨房和客厅中。`Lego`
    正在开发一种 `Digital Box`，让幼儿能够握住玩具的虚拟版本，并用手旋转和塑造它的形状，以从各个方面进行探索。


    ## 元宇宙中的房地产


    在谈论元宇宙时，我们无法回避房地产应用。人们像在现实世界一样，在数字市场上买卖房产。然而，他们参与的是加密货币市场。


    据预测，元宇宙中一个功能完备的经济的发展将在某一天发生，即使元宇宙房地产目前被认为是“高度投机性的”。随着虚拟房地产受欢迎程度兴起，数字资产已在市场上以数百万美元出售。在
    `Decentraland` 中，一块虚拟财产以 618,000 mana（价值 240 万美元加密货币）售出，而在 `The Sandbox` 中，一块虚拟土地以
    430 万美元售出。


    由于元宇宙的日益受欢迎，越来越多的公司选择开发自己的数字世界，并随之产生了数字资产。例如，`The Metaverse Group` 运营着 `Decentraland`，这是一个虚拟环境，其用户对周围拥有完全控制权。通过作为
    `Decentraland` 虚拟货币的 `mana`，用户可以探索他人拥有的区域、创建艺术品和挑战、参加活动获得奖励并交易数字商品，就像他们在其他虚拟世界中所做的一样。


    除了 `SuperWorld`（一个你可以购买、出售和收集虚拟房地产碎片的虚拟世界）外，元宇宙中还有许多其他著名的房地产案例。除了光光山 `Mount Rushmore`（0.1
    ETH）、泰姬陵 `Taj Mahal`（50 EHT）和埃菲尔铁塔 `Eiffel Tower` 外，截至目前，它已经积累了 648 亿块不同的虚拟财产（以
    100 ETH 售出）。购买虚拟房地产的用户成为了这些独特数字资产的所有者，平台利益相关者参与由用户活动创造的利润。

