    It is more important to be explicit about your objectives when setting financial
    objectives since this will increase your confidence in your capacity to make outstanding
    investing decisions in the future. Keep an eye out for fresh investment opportunities
    at all times, and avoid earning large amounts of money all at once, if possible.


    A portfolio is akin to constructing a house from the ground up, brick by brick
    and money by dollar, starting with the foundation and working your way up. It
    is better to have things done right rather than fast in order to avoid mistakes.


    # Chapter Eight


    ## Music and The Metaverse


    They are unanimous in their belief that the music industry was completely disrupted
    and altered beyond recognition during the early phases of the internet''s expansion.


    Following the breakout of the COVID-19 virus, the music industry, and especially
    performing musicians, have been pushed to innovate and explore new techniques
    of interacting with their audiences in order to remain competitive.


    As a result, they began to perform on the internet as a result of the situation.
    To be honest, the concept of internet streaming has been around for quite some
    time. In 1995, bands such as the Rolling Stones began experimenting with it, and
    the results were promising. Organizations such as `Spotify` have built their whole
    business model on the delivery of music through the internet. Unlike typical "vanilla"
    live streaming or even subscription streaming, music consumption in the metaverse
    differs significantly from traditional "vanilla" live streaming or subscription
    streaming in a number of critically important aspects. The discrepancies are discussed
    in further detail in the next section.


    Ability to establish a virtual venue and/or play in one is referred to as virtual
    venue capability.


    Avatars or other visual representations of the artist are often paired with an
    exact video image of the artist to provide a more realistic experience for the
    viewer. A wide range of new production capabilities are becoming accessible, including
    the capacity to modify the virtual environment and the ability to merge digital
    visual production with the artist''s musical composition, among other things.


    Communication and interaction with the audience in real time is enabled by this
    feature.


    The performance by Travis Scott, who appeared in `Fortnite`, was the most visually
    appealing and commercially successful example of this new musical art form in
    recent years, according to Travis Scott. As a consequence of this tragedy, there
    has been a tremendous amount of interest and attention focused on this particular
    event. An further development in the metaverse that has had an impact on the music
    industry, in addition to virtual events and non-traditional forms of entertainment
    (`NFTs`), has been the introduction of virtual "artists."


    Many genuine music connoisseurs may find the concept of listening to a synthetic
    artist distasteful, and this is understandable. A person made by artificial intelligence
    does not have a separate personality; instead, he or she is a creation of artificial
    intelligence.


    It is true that such musicians are acquiring a significant amount of popularity
    among young people who have grown up with the Internet as a resource. When it
    comes to rapper `FN Meka`, who has been dubbed "a robot rapper famed for his flamboyant
    flair and Hypebeast aesthetics," it''s difficult not to be influenced by him.


    This is a frivolous, vaguely futuristic piece of entertainment, yet it is built
    on a foundation with significant economic possibilities, despite its appearance.
    However, despite the fact that the virtual rapper has over 9 million followers
    on the video-sharing app `TikTok`, he is now the author of this book.


    Before producing this book, Chance the Rapper, who is commonly referred to as
    "one of the new generation of superstar rappers," only had a little more than
    2 million `TikTok` followers, which is a small number in contrast to other popular
    rappers.


    In light of these two incidents, the question of whether the Metaverse is a source
    of opportunity or a source of risk for the music business has been raised.


    For example, as seen by the two instances provided above, it is feasible that
    the metaverse may offer both opportunities and problems to the music industry.
    Dependence on out-of-date procedures that are no longer appropriate in today''s
    world of cutting-edge production and consumption methods and consumer experiences,
    which are becoming more commonplace, is perilous for those in the creative professions.
    Consider the scenario in which you are the only owner of the rights to a piece
    of material and you monetize it via subscription streaming channels. As a result,
    your revenues from these tactics will be inadequate to pay the cost of your initial
    investment in these strategies, and you will lose money. After just a few years,
    they''ll become commodity goods that can be automated.


    Businesses who are willing to push the boundaries and make full use of all available
    technology in order to communicate and create will find that their development
    prospects are almost limitless in the future. By comparison, even the most extensive
    stadium tours are unable to compete with the instantaneous, one-time international
    crowds that an artist may garner for a live online metaverse performance. Having
    experienced first-hand how the COVID-19 pandemic, which caused people all over
    the world to turn to the Internet for entertainment, the music industry has come
    to the conclusion that ticketed, well-produced, and captivating live streaming
    will continue to exist in some form for the foreseeable future. In the future,
    it''s possible that the most significant concerts and festivals that take place
    in the actual world may have an online component that is more dedicated, sleek,
    and transactional than the physical event itself in the first place. Therefore,
    the metaverse will continue to exist in music for at least the foreseeable future.


    ## Legal Ramifications in Virtual Reality


    In the Virtual Reality World, what are the legal ramifications of having music
    played while you''re there?


    Music rights clearances are the most important thing to consider when music is
    generated, played, streamed, and exploited on the internet, as they are in all
    other aspects of the music business, including the recording industry. There are
    just a few exceptions to the general rule that the great majority of the standard
    legal and licensing constraints for online exploitation apply in the metaverse.
    The addition of additional internet settings for music performance and exploitation,
    whether restricted or open, might potentially add still another layer of complication
    to an already complex chain of rights in the music licensing process, which is
    already confusing enough.


    By way of illustration, a digital music service provider (such as the corporation)
    may promote and organize a live-streamed concert on a worldwide video game console
    platform, as in the case of `Spotify` (such as the `Sony PlayStation`).


    While it''s feasible that this concert will take place during the tournament''s
    intermission, and that it will be marketed by a major game publisher (such as
    `Electronic Arts`), it''s also possible that the concert may take place in conjunction
    with a well-known brand during this time period (e.g., `Adidas`).

