  raw: 'During the "China Development Forum Young Entrepreneurs Summit" on December
    6th, Shen Yang, Director of the New Media Research Center at the Tsinghua University
    School of Journalism, presented the team''s "Metaverse Development Research Report
    2020-2021" at the "China Development Forum Young Entrepreneurs Summit." Shenyang
    claims that the Metaverse is the most sophisticated kind of mobile Internet presently
    accessible. Although yet in its infancy, the Metaverse sector demonstrates the
    immaturity and volatility that are characteristic of growing businesses, and there
    is a wide range of challenges that might arise. The Metaverse business as a whole
    is now in a "sub-healthy" condition, as shown by the presence of at least 10 significant
    risks. As quickly as possible, the industry and the market must return to normalcy
    and rationality. Aspects of the ten key dangers include capital manipulation,
    public opinion bubbles, ethical restraints, monopolistic conflicts, industry evolution,
    computing power demand, economic risks, addiction risks, privacy problems, and
    intellectual property protection difficulties.


    Zhou Hongyi, the company''s creator, talked about Metaverse. He said that this
    notion is really well-liked. Many individuals have finally discovered a new approach
    to generate money as a result of the high stock market price. The Metaverse, in
    my view, is a fictional virtual environment created by writers of fiction. It
    has developed a totally online reality that is distinct from the offline world
    in which it exists. It''s going to take some time. Second, I notice Facebook''s
    ideas and dreams about the future, and I follow them. I am of the opinion This
    does not represent the future of mankind. I consider it to be a sign of the end
    of mankind. It implies that if we do away with reality and do not put in the same
    amount of effort to achieve a goal in reality, everyone would live in an imaginary
    realm. I''ve had a few conversations with coworkers in the United States. There
    are others who feel that the merging of brain-computer interfacing will ultimately
    be the Metaverse''s grandest destiny. Close your eyes and lay down in bed with
    a tube for nutritious solution injected into your head to activate your brain
    waves, and you can produce an infinite amount of numbers by doing so. Will illusion
    and image ultimately be able to take the place of the human battery in the film
    "The Matrix"? As a consequence of the Metaverse, human civilization will not advance
    in any way. Humanity must confront the issue of nuclear fusion if it is to address
    the global energy dilemma.


    Only once humanity has solved the enigma of cosmic navigation will he be able
    to depart the world and return to his home planet. The Metaverse is being promoted
    by a number of companies, but they are actually promoting a number of Internet
    products, many of which are merely mobile products and not the "Metaverse," according
    to Professor Shen Yang from the New Media Research Center at Tsinghua University''s
    School of Journalism and Communication. "With the metaverse currently on fire,
    I''d want to add to the fire by adding more." I hope that the people of this generation
    will be able to utilize and be satisfied with ever advancing technology, from
    processing power to communication technology, algorithms, and finished goods.
    As of late, the term "metaverse" has become the newest buzzword in the information
    technology sector, particularly after Facebook changed its name to Meta last month
    to better represent its business transition. To be clear, no one has ever heard
    of the term Metaverse before.


    Everyone is unsure of what the final product will look like since the idea is
    still in its early stages. Its progress, on the other hand, must be driven by
    demand. In order to research the implementation of diverse technologies in various
    circumstances, IT giants such as Meta, Microsoft, and Nvidia have turned to Metaverse
    for assistance. However, regardless of the circumstances, the ideas on which these
    goods are based must, in the end, meet the needs of the general public. Products
    that do not meet the demands of their consumers will very probably be phased out
    of the market in the near future. On November 15, Russian President Vladimir Putin
    stated that he would attend the 2021 World Cup "According to press reports, the
    "AI Journey" International Conference (AI Journey 2021) will feature the following
    speakers: "I''d like to point out that the term metaverse was coined 30 years
    ago by a well-known figure. People have fled to the metaverse, according to the
    author''s conception, from the flawed reality of the actual world they were born
    into. Such a thought is just too depressing for us right now. I don''t believe
    there is any justification for taking this course."


    Putin In addition, he said that "we need to exploit the function of the metaverse
    so that people may communicate, collaborate, learn, and undertake collaborative
    research and commercial ventures together regardless of how far away they are."
    President Putin feels that this is vital for technological businesses, the creative
    industries, virtual reality and mixed reality equipment makers, and even law experts,
    who are tasked with establishing the economic and social standards of the "new
    world.""This is a challenging situation," he said. According to Putin, this involves
    ensuring the protection of individuals in cyberspace as well as the safety of
    their virtual avatars in the "Metaverse." According to technological developers,
    people would be able to travel across space without ever leaving the comfort of
    their own homes if they use virtual worlds. According to Putin, "this enables
    people to converse with those who are located on distant continents."


    Do you know how long it''s been on the ground?


    According to news released on December 5th, Hon Hai Chairman Guo Taiming recently
    attended the press conference of the iCareDx medical technology expo, a startup
    business formed with personal investment, and shared his ideas on the concept
    of "Metaverse" at the event. According to Terry Gou, the implementation of the
    Metaverse idea will take between 5 and 10 years, and the accompanying applications
    will be years in the future. Despite the fact that there are several R&D possibilities
    throughout the development process, the focus is disproportionately concentrated
    on the application side. Because there is still a lot of room for improvement
    in the "user experience," talking about an explosion of applications isn''t viable
    at this time.


    In a meeting held on November 16th in Boston, CEOs Bob Chapek of Disney and Robert
    Kraft of Kraft discussed business. The two sides spoke about the Metaverse, with
    Chapek hinting that the Metaverse would be the future of Disney. He said that
    Disneyland and the Disney+ internet platform provided the firm with unrivaled
    Metaverse-building possibilities that were previously unavailable. He asserts
    that this three-dimensional canvas will fluidly and unrestrictedly integrate the
    physical and digital worlds together, allowing for more creative thinking. He
    believes that the Metaverse represents the growth route for the future generation.
    As well as making predictions about the future, he projected in the Metaverse
    that fans will have lunch with Disney princesses.'
