- fmt: '

    Excited about the prospect of restoring the planet and, someday, earning a livelihood
    doing it. Upland''s development team hopes to broaden the game''s scope in the
    next months and years by including 3D property building tools and enabling players
    to operate companies inside the game world itself. They''re also working on a
    feature that will enable players to integrate NFT artwork into their virtual properties,
    so increasing the value of their virtual properties in the same way that tangible
    art increases the value of genuine real estate does.


    In a statement, Lueth said, "I am overjoyed to be able to bring more real-world
    companies into Upland, as well as finally launch some location-based services
    and capabilities to begin blurring the line between the real world and the Upland
    metaverse."


    ## What is the motivation behind established brands getting involved?


    Only the most forward-thinking technologists are aware of the existence of the
    metaverse, which is still mostly unknown. How much longer will things continue
    to be this way? With Lueth''s opinion, more conventional game publishers are experimenting
    in the blockchain technology. It will be incredibly difficult for them to avoid
    having their business model disrupted in this manner.


    The usage of `NFTs` for everything is expected to increase as firms realize the
    marketing and direct money opportunities (plenty of consumer goods will get NFTied
    and appear in metaverses). In addition, when additional sectors join the market,
    some may choose to experiment with new sorts of goods and business models by leveraging
    their existing brands.


    Lueth''s excitement for the future of the metaverse is apparent, but he is cautious
    when predicting how long it will take for the metaverse to become widely accepted.
    In both instances, he is very likely accurate. The ceiling is quite high, and
    the timeline is extremely long.


    But a few of well-known personalities have started to dip their feet into the
    metaverse''s pool of waters. Take, for example, `Sotheby''s`, which just sold
    a painting by the New Yorker''s Norman Foster for an unbelievable sum.


    Then there''s the brand `Atari`, which is connected with the beginnings of video
    gaming. In a move that few could have imagined, the company has lately leapfrogged
    the whole current generation of gaming by developing its own cryptocurrency, the
    `Atari Token`, in an unprecedented move.


    The objective of `Atari Token` is to establish itself as the cryptocurrency token
    of choice in the video gaming and entertainment industries. It will assist developers
    and gamers in effectively monetizing their digital assets by offering a market
    for token transfers that are both quick and easy, and which is supported by the
    promises of smart contract technology, among other things.


    A recent collaboration between `Atari` and `Enjin`, which is considered to be
    the biggest cryptocurrency business in the blockchain gaming market, is an example
    of how this works. In collaboration with `Atari`, the two companies have created
    an NFT fashion line in which users can use their `bitcoin` to acquire `Atari`-branded
    clothing.


    `Atari` aims to grow its presence in additional areas in the future, such as Africa,
    where the development of mobile games is expanding, according to the company.
    They''re also in the midst of creating immersive and powerful virtual and augmented
    reality games for the PC and mobile devices. This excites Chesnais a great deal!
    "It is the urge to create as many different digital worlds as possible in addition
    to the actual world (as many as possible). People are more aware than they have
    ever been of the true benefit that virtual worlds may give to their lives. Almost
    from the beginning of the video game industry with `PONG`, people have been drawn
    to digitally interactive experiences "declared the president and CEO of Atari.
    "This, together with `NFTs`, which enable users to own their in-game assets while
    also really empowering artists, is generating increased interest in the industry.
    And this increasing trend will continue indefinitely. We''re still in the early
    phases of the process."


    ## Visual Business Models Aren''t the Only Thing You Should Consider.


    Jason Fox, CEO of `EarBuds`, was another CEO with whom we talked about the emerging
    metaverse business models that are flourishing in the real world. Fox, a former
    NFL player, came up with the concept for the business while on the field and wondered
    what `Cam Newton` was listening to in his headphones. When this occurred to him,
    the idea of developing a social music app sprung into his head. Despite the fact
    that his organization is not involved in the visual side of the metaverse, audio
    and voice are becoming more and more important.


    ## The Metaverse''s long-term viability.


    The CEO of `IMVU` predicts the arrival of the metaverse. When we talked with the
    pioneers about their perspectives on metaverse economics, the team behind `IMVU`
    shared some of the most profound comments we heard. `IMVU` is regarded to be one
    of the world''s biggest 3D avatar social networks, with over seven million monthly
    active users, according to the company. A marketplace with over 50 million products,
    a native cryptocurrency (`VCOIN`) that has already earned millions of dollars
    in revenue, and recent investment of $35 million are all part of the company''s
    arsenal of assets. All of this places it in the top tier of metaverse firms, whether
    or not it is involved in gaming.


    When we spoke with Daren Tsui, their CEO, he immediately pointed out the greater
    context and atmosphere that enabled `IMVU` to flourish. The phrase "metaverse"
    was originally used in Neal Stephenson''s 1992 novel `Snow Crash`, although the
    notion of a virtual simulation in which individuals may interact with one another
    has been around for a long time before that (for example, `Tron` in 1982). According
    to `Tsui`, as related technology progresses over time, the realism and capabilities
    of virtual experiences have greatly increased, resulting in an increase in the
    number of people connecting in the virtual world.


    According to `Tsui`, there is no question that the epidemic has inspired many
    more individuals all over the globe to hunt for a safer and more effective way
    to interact online as a result of the outbreak. A fresh and fascinating approach
    to interact with and converse with new friends in the real world has been found
    by them.


    The `COVID-19`-induced social isolation makes sense as a motivator of interest
    in virtual social networks, but it is not the only explanation. `Tsui`, on the
    other hand, is more concerned with the long term picture. According to him, the
    pandemic is pushing more people to "search out" something like the metaverse,
    but the "dramatically" improved "realism and capacity of virtual experiences"
    is the reason they''re staying—and coming back and spending money on virtual experiences.
    Even when the epidemic is over, this will remain a problem.


    With the help of `Upland`, `Atari`, `EarBuds`, and `IMVU`, we can see exactly
    what he is talking about. In only a few years, if all of the things they''re experimenting
    with are incorporated, `Upland` will have created an unequaled investing platform/gaming
    experience that will be practically unrecognizable in just a few years. An innovative,
    cutting-edge method to in-game item trading is being developed with the help of
    `Atari`''s historical gaming expertise. `IMVU` has built a virtual world in which
    people want to be a part of and participate. Despite the fact that they are drawn
    to the epidemic, they are also participating in virtual activities and buying
    avatar stuff since it is engaging and immersive.


    `Tsui` expressed himself concisely. On the question of whether or not our physical
    world and the metaverse would merge to produce something even more grandiose,
    greater, and more unforgettable than what exists now, he said simply: "It is a
    matter of when, not if."


    There is a difference between the Metaverse and the Real World.

    '
