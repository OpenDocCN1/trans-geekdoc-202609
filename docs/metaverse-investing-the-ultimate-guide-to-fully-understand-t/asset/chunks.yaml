    A more general statement may be made that Fortnite has developed a new sub-economy
    in which "players" can produce (and sell) their own content. Skins (digital clothes)
    and dances (emotes) are examples of this kind of content. Although it began as
    a small group of games, it has swiftly expanded to embrace any and all new games
    and experiences that make use of the Fortnite engine, assets, or aesthetics. Every
    kind of gamer will find something to their liking, from simple treasure hunts
    to complex mash-ups of the Brothers Grimm with parkour culture to a 10-hour sci-fi
    epic that spans numerous universes and timeframes. For one thing, Fortnite''s
    Creative Mode is already starting to seem like a prequel to the Metaverse. Once
    inside, players may choose among thousands of "doors" (i.e., space-time rifts)
    that will take them to one of the thousands of separate worlds, where they can
    play with up to 99 other players at the same time.


    As creative director Donald Mustard has made more obvious, the game''s long-term
    ambitions are at the heart of the matter.


    ## Epic Games


    One of the most telling indicators of Fortnite''s potential is its ability to
    persuade a large number of seeming rivals to collaborate (or to demonstrate early
    "interoperability" with one another). Currently available on every major entertainment
    platform – including mobile devices such as iOS and Android as well as consoles
    such as PlayStation, Nintendo, PC, and Xbox – Fortnite allows for seamless cross-platform
    play across multiple identity/account systems, payment methods, social graphs,
    and generally locked ecosystems. Long have the main gaming platforms battled against
    such an experience, arguing that enabling such an experience would undermine their
    network effects and reduce the need to purchase their proprietary equipment. This
    resulted in the inability of a buddy with Call of Duty on PlayStation to play
    with a friend who had Call of Duty on Xbox, despite the fact that both Sony and
    Microsoft knew they wanted to.


    As a matter of fact, IP owners are reluctant to allow their characters and tales
    to be incorporated into other IPs. This occurs from time to time (e.g., several
    Marvel v DC comic book crossovers and video games). However, it is particularly
    rare to see it in an experience that they do not editorially control, much alone
    one that is centered on unpredictability (not even the Fortnite creative team
    knows what will happen in 2021), and with such a vast spectrum of intellectual
    property.


    No amount of emphasis can be placed on the significance of organic evolution.
    If you "announced" your intention to construct a Metaverse, these parties would
    never accept interoperability or commit their intellectual property to you. However,
    just as P&G cannot declare, "Oh, Facebook isn''t for us," the vast majority of
    counterparties have no option except to join in conversation. They''re almost
    certainly eager to become a part of the "game" Because Fortnite has grown so popular
    and unique that most opponents have no option but to take part in the competition.
    Fortnite is a platform that is highly valuable.


    Fortnite is the name of the game. Please, however, re-ask the question in a year
    or two.


    ## Metaverse-building efforts


    Epic is bringing much more to its Metaverse-building efforts than simply a visually
    appealing on-ramp to the world. Additionally, Epic Games is the owner of Unreal
    Engine 2, the second-largest independent gaming engine, and is responsible for
    the operation of Fortnite, which was allegedly a side project for the company.
    Thousands of games (to keep things simple) presently make use of its "stack" of
    "stack".


    ## Online Services


    While Epic Online Services is currently in private beta testing, the company has
    claimed that it will be offered to the general public in Q2 2020 and will support
    "hundreds or thousands" of games when it becomes available. In addition, it''s
    important to note that all of this reduces Epic''s dependence on Fortnite in terms
    of long-term Metaverse-building initiatives.

