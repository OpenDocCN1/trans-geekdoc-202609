    考虑到你可能对参与这些游戏内金融经济感兴趣。因此，Binance NFT 的 IGO 推出了一系列来自游戏项目的游戏内资产，用户可以收集并将其整合到各种游戏设置中。对这类游戏内
    NFT 的需求是巨大的，IGO 发布的成功证明了这一点，所有 NFT 在第一天就售罄了。Axie Infinite (AXS)、My Neighbor Alice
    (Alice) 以及许多其他游戏都是成功的玩边赚（P2E）游戏。


    你对元宇宙的财务计划是什么？在过去的一年里，这个词无处可见。Facebook 改名为 Meta，这引起了怀疑，在某些情况下甚至受到了直接的蔑视。NFT（非同质化代币的缩写）被选为柯林斯词典的年度词汇，此类代币是新兴虚拟世界的关键组成部分。在这个版本的未来到来之前，从游戏玩家到开发者到外交官，每个人似乎都准备好探索元宇宙并体验它的奇迹了。


    如果你相信元宇宙是未来，你应该为元宇宙制定什么样的财务策略？在当今，建议你在几块数字物业上投资 150 万美元的主流建议已经很难得了。此外，目前尚不确定元宇宙将如何体现、甚至是否会出现。


    然而，随着我们进入这个元宇宙狂热之年的年底，至少了解一下这些新的工作、游戏和投资方式可能如何影响你的财务状况，是一个好主意。或者，当你的家人在假期期间问起“元宇宙到底是什么？”时，你已经准备好回答。


    ## 投资数字资产是一个好主意


    由于虚拟世界的存在，虚拟投资的可能性不断发展。数字土地的价值正以惊人的速度增长。Republic Real Estate 今年些时候建立了一个专门虚拟土地投资者的基金，该公司已筹集资金收购现实世界中的抵押公寓。除了其他外，该公司还计划从不同的在线“元宇宙”购买软件包，并将其转化为虚拟酒店、商店和其他用途，以增加它们在比特币粉丝中的价值。


    NFT 艺术已迅速升为今年最受欢迎的数字资产之一。Bain & Co 的合伙人 Thomas Olsen 认为所有资产将在 20 到 30 年内实现代币化，他已经宣布相信这将会发生。作者说：“所有的股票和债券将在该加密实验正在开发的数字资产平台上进行交易。”


    ## 仅限在线的购物和体验


    如果企业按照它们的意愿，在线购买将变得复杂得多。他们已经通过销售仅在元宇宙提供的服装和配饰赚了数百万美元。这现在看起来可能很愚蠢，但如果你花费大量时间在网上工作和游戏，你的外表可能会变得重要得多。因此，跟踪不同种族和性别的虚拟形象在互联网上如何以及为何被估值至关重要，以防止对他们的歧视。差异已经开始显现，可能会产生毁灭性的后果。


    ## 极端的居家办公


    在 1990 年建议某人他们需要为互联网对其所在行业的潜在破坏做好准备，听起来可能是暗淡甚至荒谬的，但现在不会了。也许元宇宙的情况和地球上是一样的。


    由于元宇宙的运作模式（modus operandi），远程办公具有变得更加永久和沉浸的潜力。正如微软一样，Facebook 正试图将其办公室形象带入虚拟世界，这与微软对物理世界的愿景相似。目前，微软正在开发其
    Teams 聊天和会议平台的版本，其中将包含数字化身，预计将在 2022 年上半年准备好。办公文件和功能（如 PowerPoint 演示文稿）也将在虚拟世界的客户之间进行交换。


    ## 现实世界实际情况的变化


    这些都不意味着现实世界将在不久的任何时候被完全消除。随着比特币、游戏、工作和日常生活在物理世界变得更加紧密，公司将继续适应对虚拟世界更包容的现实世界权威，例如加利福尼亚州。波多黎各似乎也是这样，那里的低税吸引了大量加密货币粉丝来到该岛。如果元宇宙的银行家想在圣胡安聚会，对我来说也可以。与其通过电话面试，我会安排他们在海滩与我见面。——
    Charlie Wells 等。


    ## 谁将拥有元宇宙的最终权力？


    既然 Facebook 已将重心转向 Meta，谁将掌管被誉为下一代互联网的东西？八位数字营销专家正在争论去中心化是否会成功，还是大型科技公司将继续在自己的墙内运营。


    早期投资者认为去中心化和互操作性是“真实”元宇宙两个最重要的特征：去中心化和互操作性。


    当权力和决策分布在网络上，而不是由单一实体操纵时，就发生了去中心化。当涉及到开放、无许可的环境时，消费者处于主导地位，能够塑造和控制他们的体验过程，并成为自己身份和创新的唯一所有者。这主要归功于区块链技术，它允许用户在虚拟账上跟踪数字资产的来源和所有权，并有一天可能支持主权身份，这使得去中心化得以实施。通过将数据留在手中而不是不同的平台中，可以实现互操作性。用户可以使用同一个“数字孪生”从一种体验切换到另一种体验。

