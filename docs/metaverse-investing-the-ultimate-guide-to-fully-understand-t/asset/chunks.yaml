    It is a world made up of data, according to Zheng Weimin, who is an academician
    of the Chinese Academy of Engineering and a professor at Tsinghua University''s
    Department of Computer Science and Technology. According to Zheng, distributed
    data storage has emerged as the primary method of ensuring the Metaverse''s long-term
    operation. At the same time, there is a foggy confluence of rights between data
    producers, managers, integrators, users, and other roles involved in the process
    of using data, making it hard to validate the ownership rights of data pieces
    and resulting in widespread data misuse. This collection of concerns may be resolved
    using blockchain technology and architecture, which is the underlying technology
    and architecture. According to Academician Zheng Weimin, processing power and
    data are the building blocks for the expansion of the Metaverse and the development
    of the digital economy. Digital governance, financial technology, smart medical
    care, and smart manufacturing are examples of Internet innovation businesses that
    need the use of large amounts of computing power to function properly. The development
    of my country''s digital economy has resulted in the accumulation of large amounts
    of data across several sectors, laying a strong platform for data lemmatization
    and marketization.


    According to Jensen Huang, the CEO of Nvidia, we intend to rebuild industries
    and plants in the Metaverse, as well as the electrical infrastructure in the real
    world, in the future. We can reduce waste in this manner, which is one of the
    reasons why the Metaverse would be beneficial to enterprises in terms of economics.
    Their willingness to pay billions of dollars to obtain artificial intelligence
    capabilities will be unquestionably high.


    ## What''s the likelihood of it happening?


    TSMC Chairman Liu Deyin recently said that the growth of the semiconductor industry
    has expanded in step with the globalization of information technology. In the
    next 10 years, it is possible that augmented reality may displace smartphones,
    while virtual reality will supersede PCs. People will increasingly come into contact
    with both the physical and virtual worlds. The hardware requirements for the Metaverse
    will continue to grow as it grows in size.


    Cathie Wood, the founder and CEO of Ark Invest, thinks that the Metaverse has
    the potential to be worth a trillion dollars and will have far-reaching repercussions
    for the economy. This is a brilliant concept that, like technology, has the potential
    to permeate every industry in ways that we can''t even fathom at this point in
    time.


    According to Haim Israel, research managing director and global strategist at
    Bank of America, the metaverse represents a huge possibility for blockchain technology
    in the future. The Metaverse will also aid in the mainstreaming of cryptocurrencies.
    According to the Metaverse, "it is here that we will begin to accept cryptocurrencies
    as a form of payment." It is possible that current currencies would suffer excessive
    volatility as a consequence of this development.


    It is projected that certain kinds of stablecoins would take over the market.
    In the event that cryptocurrencies are extensively utilized in Metaverse, traditional
    payment firms will be increasingly interested in cryptocurrencies, and it is envisaged
    that there will be a great deal of contact between them.


    In accordance with sources, the 27th meeting of the Standing Committee of the
    13th National People''s Congress of Jiangsu Province, which took place on December
    6, examined a special issue pertaining to the digital economy. As Gao Qing, deputy
    director of the Jiangsu Growth and Reform Commission, points out, the Metaverse
    might offer a new avenue for future Internet establishment or the development
    of a digital economy. The next stage of development. Several cutting-edge digital
    technologies, such as network and computing power technology, display technology,
    Internet of things technology, artificial intelligence technology, blockchain
    technology, and many other cutting-edge digital technologies, must be integrated
    to support the Metaverse''s characteristics of being open, accessible at any time
    from any location, immersive, and so on. Gao Qing also remarked that in order
    to build the digital economy, we must be willing to take risks and seize new opportunities.
    To bring the Metaverse from concept to reality, we must actively promote it, accelerate
    the integration of digital technology to empower the real economy, and accelerate
    the digital transformation of our province''s economy and society by expanding
    the Metaverse industry. Continually expanding support for metaverse development
    at several levels, including technology, standards, application development and
    legislation, is critical in laying a solid basis for the future of the virtual
    world.


    Morgan Stanley thinks that, despite the fact that Metaverse may take a long time
    to debut, the subsequent expansion of NFTs and the proliferation of social games
    would give huge income opportunities for the boutique sector. According to Morgan
    Stanley, around one-fifth of gamers on Roblox, a gaming platform that is now regarded
    as a Metaverse pioneer, change their game avatars on a daily basis, a figure that
    is increasing. Social games are expected to produce $20 billion in sales for the
    digital luxury goods sector by 2030, according to estimates. Various digital luxury
    products and collectibles might amass a market capitalization of more than US$25
    billion in the US$300 billion NFT sector, according to industry estimates. For
    Morgan Stanley, multiple incursions into the world of NFT and social gaming have
    resulted in the development of new customer groups as well as a greater knowledge
    of this rapidly growing business, according to the firm. The brand is now in the
    concept validation stage for its NFT and Metaverse games. Evidence suggests that
    the current tests are all effective; the next step is to determine how to put
    this into action in the real world.


    On November 19th, Microsoft CEO Satya Nadella indicated his interest in Metaverse,
    stating that he would continue to use full-stack thinking in order to embrace
    new development possibilities such as Metaverse in the future. As described by
    Nadella, the Metaverse bridges the gap between the physical and digital worlds
    by linking people, things, and fields together across the commercial and consumer
    Internet. Because integration is feasible, it should not be seen as a discrete
    consumer market phenomena or as a phenomenon occurring at the level of an organization.
    It is very necessary. In some respects, the epidemic''s popularity of video conferencing
    has provided us with some hands-on experience with a 2D Metaverse, which is useful
    for future research. The 3D Metaverse, which exists outside of time and space,
    is undoubtedly an important development direction. What dangers should you be
    on the lookout for?

