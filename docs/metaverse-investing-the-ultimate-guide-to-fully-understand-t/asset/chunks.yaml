- fmt: "\nApproximately 10-20 years from realizing the basic scenario of the Metaverse,\
    \ according to Zuo Pengfei, deputy director of the Informatization and Network\
    \ Economics Research Office of the Chinese Academy of Social Sciences and secretary-general\
    \ of the Chinese Academy of Social Sciences' Informatization Research Center,\
    \ we are approximately 10-20 years away from realizing the basic scenario of the\
    \ Metaverse. In five areas of our lives and social and economic development, the\
    \ Metaverse will have a significant impact: improving social production efficiency\
    \ through technological innovation and collaboration methods; birthing a slew\
    \ of new technologies, formats, and models, as well as promoting traditions; promoting\
    \ cross-border derivation of the cultural and creative industries, which has a\
    \ significant impact on information consumption; reconstructing working life styles,\
    \ given that much of work and life will take place in the virtual world; and promoting\
    \ smart cities and innovative social governance models, which have a significant\
    \ impact on information consumption.\n\n# Chapter Four: An Overview of the Current\
    \ State of the Metaverse\n\nBecause describing the metaverse demands a description\
    \ of the present, it is impossible to define the future without first defining\
    \ the present. MMOs, which are essentially virtual worlds, as well as digital\
    \ concerts, online avatars, video conversations with people all over the globe,\
    \ and commerce platforms, are all already accessible to the public in various\
    \ ways. Because of this, there must be something original about them in order\
    \ to advertise them as a fresh way of looking at the world. If you speak about\
    \ the metaverse for a long enough time, someone will almost certainly mention\
    \ fictional works such as `Snow Crash`, which is credited with coining the phrase\
    \ \"metaverse,\" or `Ready Player One`, which depicts a virtual reality environment\
    \ where everyone works, shops, and plays. When combined with the broader pop-culture\
    \ concept of holograms and heads-up displays (basically everything Iron Man has\
    \ used in his previous ten movies), these stories serve as a creative reference\
    \ point for the metaverse — a metaverse in which tech corporations may be able\
    \ to offer us something new and interesting.\n\nIt is just as much a part of the\
    \ metaverse as any other form of panic to experience. But it should come as no\
    \ surprise that proponents of `NFTs` (non-fungible tokens)— cryptographic tokens\
    \ that, in a sense, serve as certificates of ownership for digital items—are enthused\
    \ by the concept of a metaverse. Yes, `NFTs` are harmful to the environment, but\
    \ if these tokens can be regarded the digital key to your `Roblox` virtual house,\
    \ then they are well worth it. You've just converted your meme-collecting hobby\
    \ into a critical component of the internet's backbone. Congratulations! (and\
    \ maybe increased the value of all that cryptocurrency you own.) While it's tempting\
    \ to draw parallels between today's proto-metaverse notions and the early internet\
    \ and believe that everything will evolve and extend in a linear sense, this is\
    \ not necessarily the case. Not everyone will want to sit at a virtual desk without\
    \ their legs or play poker with Dreamworks CEO Mark Zuckerberg, much alone believe\
    \ that `AR` and `VR` technologies will become as commonplace as smartphones and\
    \ PCs in the future.\n\nIf there is any actual \"metaverse,\" it is conceivable\
    \ that it will consist mostly of engaging virtual reality games and digital avatars\
    \ in `Zoom` conversations, rather than predominantly of what we now regard to\
    \ as the internet.\n\n## Making Money in the Metaverse is a simple concept.\n\n\
    Excessive amounts of money are being traded for new technology, which is spiraling\
    \ out of control as a result. A new generation of artists and small companies\
    \ are being heralded as forerunners of the modern age.\n\nYou'd be excused if\
    \ you didn't know everything about a certain subject. There is a parallel world\
    \ in which the phenomena I'm describing may be seen.\n\n## The Nature of the Metaverse\n\
    \nThe \"metaverse\" is a melding of our physical and digital lives that has been\
    \ facilitated by advancements in internet connection, augmented reality/virtual\
    \ reality, and blockchain technologies. It's the culmination of all of our science\
    \ fiction fantasies—what movies like `Tron` and `Ready Player One` envisioned,\
    \ but which is actually taking place today. If that sounds appealing to you, it\
    \ should come as no surprise that individuals are making big investments in the\
    \ space to pursue their dreams. The non-fungible token, which has been designated\
    \ as the currency of the metaverse, has secured about $400 million in investment\
    \ (or `NFT`). 40 million dollars change hands every month and the most expensive\
    \ `NFT` transactions in history have all taken place in the recent few months,\
    \ according to the aforementioned statistics and information. Christie's auctioned\
    \ off a piece of `Beeple`'s digital art for more than $69 million last week, using\
    \ the `NFT` platform.\n\nMany individuals do not comprehend `Upland` by any conventional\
    \ meter, which is understandable. The fact that it is more than a virtual game\
    \ and that it is a community experience begs the question: why are tens of thousands\
    \ of individuals willing to part with their hard-earned money to participate?\
    \ One possible explanation is because it is so uncommon.\n\n## Case Study: Upland\n\
    \nA virtual real estate marketplace that uses real-world maps, `Upland` is a decentralized\
    \ application (`dApp`) that enables users to buy, sell, and exchange virtual real\
    \ estate. To find out who owns the Empire State Building or the New York Stock\
    \ Exchange, for example, you might head to `Upland` in New York City's `Upland`\
    \ neighborhood. If you have enough in-game money, you may even bid for them yourself\
    \ if you have enough in-game currency. \n\nEven on its own, this notion is interesting.\
    \ However, it is the way `Upland`'s in-game economy functions that distinguishes\
    \ it as more than a simple toy. In order to begin investing in `UPX`, the native\
    \ cryptocurrency, players must first acquire their first homes using fiat money.\
    \ As `Upland` becomes more famous, the market value of these homes will inevitably\
    \ climb as a result of the increased demand. Virtual landlords have the choice\
    \ of keeping on to their money or cashing it out in fiat currency.\n\nDespite\
    \ the fact that `Upland` houses are virtual, they are highly real financial investments.\
    \ Take, for example, the New York Stock Exchange. The Stock Exchange would seem\
    \ to have a reasonable amount of `UPX` potential when compared to the other `Upland`\
    \ assets, wouldn't you? Is it, however, a purchase that is worth the whole $23,000?\
    \ That was the price it sold for in December of the previous year. It has become\
    \ even more useful in recent years.\n\nEven yet, the financial side of `Upland`'s\
    \ attraction does not fully express the extent of its appeal. Dirk Lueth, a co-founder\
    \ of the platform, provided us with a more complete picture of what is going on\
    \ in this narrative. We inquired as to how much money gamers may earn on his site\
    \ and what aspects of it they find appealing. In the end, he came up with five\
    \ criteria:\n\n1. Excited about the prospect of restoring the planet and, someday,\
    \ earning a livelihood doing it.\n2. The search for properties with a specific\
    \ value, significance, or emotional connection may be very enjoyable.\n3. Identifying\
    \ like-minded individuals.\n4. Taking pleasure in the community and creating new\
    \ acquaintances.\n5. It's a thrill to flip houses.\n"
