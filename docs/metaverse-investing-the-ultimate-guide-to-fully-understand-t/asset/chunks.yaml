  trans: '

    对于恢复地球的前景以及终有一天以此为生他们感到兴奋。Upland 的开发团队希望在未来的几个月和几年里，通过引入 3D 财产建筑工具以及允许玩家在游戏世界内部运营公司来扩大游戏范围。他们还在致力于开发一项功能，允许玩家将
    NFT 艺术整合到他们的虚拟财产中，就像实物艺术品增加真实房地产价值一样，来增加其虚拟财产的价值。


    Lueth 在一份声明中表示：“我能够将更多现实世界的公司引入 Upland，我感到非常荣幸，并终于启动了一些基于位置的服务和功能，开始模糊现实世界与 Upland
    元宇宙之间的界限。”


    ## 既有品牌参与背后的动力是什么？


    只有最具前瞻性的技术人员才意识到元宇宙的存在，而元宇宙目前在很大程度上仍然不为人所知。这种情况还会持续多久？根据 Lueth 的观点，更多传统的游戏发行商正在对区块链技术进行实验。对于他们来说，要避免业务模式被这种方式打破将极其困难。


    随着企业意识到营销和直接赚钱的机会（许多消费品将变为 NFT 化并出现在元宇宙中），万物皆可用 `NFTs` 的趋势将会增加。此外，当更多行业加入市场时，一些公司可能会利用其现有品牌来尝试新种商品和业务模式。


    Lueth 对元宇宙未来的兴奋是显而易见的，但在预测元宇宙被广泛接受需要多久时，他非常谨慎。在这两种情况下，他很可能是准确的。天花板很高，而且时间线非常长。


    但一些名人已经开始涉足元宇宙的水域。以 `Sotheby''s` 为例，他们刚刚以难以置信的价格售出了一幅由《纽约人》记者诺曼·福斯特创作的作品。


    然后是品牌 `Atari`，它与视频游戏的开端紧相连。在一个极少数人能想象到的行动中，该公司最近通过开发自己的加密货币 `Atari Token`，以一种以前所未有的举措跨越了整个当前的游戏代际。


    `Atari Token` 的目标是使其成为视频游戏和娱乐行业的首选加密货币代币。它将通过提供一个快速、方便的代币传输市场（并受到智能合约等承诺的支持），帮助开发者和玩家有效地实现数字资产的变现。


    `Atari` 与 `Enjin`（被认为是区块链游戏市场最大的加密货币业务）最近的合作就是这种运作方式的例子。通过与 `Atari` 合作，这两家公司创建了一个
    NFT 时尚系列，用户可以使用他们的 `bitcoin` 来购买 `Atari` 品牌的服装。


    根据该说法，`Atari` 未来希望在其他领域增加影响力，例如移动游戏开发正在扩张的非洲。他们还致力于为 PC 和移动设备创建沉浸式且强大的虚拟和增强现实游戏。这让
    Chesnais 感到兴奋！“除了现实世界之外，人们渴望创造尽可能多的不同的数字世界（尽可能多）。人们比以往任何时候都更意识到虚拟世界给他们的生活可能带来的真正益处。几乎从
    `PONG` 视频游戏行业之初，人们就被数字交互体验所吸引，”Atari 总裁兼首席执行官说道。“这加上 `NFTs`（允许使用户拥有自己的游戏内资产，同时也真正赋能艺术家），正在引发业界日益增长的兴趣。这种增长的趋势将无限持续下去。我们仍然处于这一过程的早期。”


    ## 视觉化业务模型不是你应该考虑的全部。


    `EarBuds` 的首席执行官 Jason Fox 是另一位与我们谈论在现实世界中蓬勃发展的新兴元宇宙业务模式的首席执行官。Fox 曾是一名 NFL 球员，他在球场上构思了该业务的概念，并好奇
    `Cam Newton` 在耳机里听的是什么。当这个念头闪过时，开发社交音乐应用的想法就跳入了他的脑海。尽管他的组织没有参与元宇宙的视觉方面，但音频和语音变得越来越重要。


    ## 元宇宙的长期可行性。


    `IMVU` 的首席执行官预测元宇宙的到来。当我们与先驱们谈论他们对元宇宙经济的看法时，`IMVU` 团队分享了一些我们听过的最深刻的评论。据公司介绍，`IMVU`
    被认为是全球最大的 3D 形象社交网络之一，拥有超过 700 万月活跃用户。一个拥有超过 5000 万产品的市场、一种已经获得数百万收入的原生加密货币（`VCOIN`）以及最近
    3500 万美元的投资都是该公司资产库的一部分。所有这些使得无论它是否参与游戏，都处于元宇宙宇宙公司的顶尖水平。


    当我们与他们的首席执行官 Daren Tsui 话时，他立即指出了让 `IMVU` 蓬勃发展的更大背景和氛围。“元宇宙”一词最初出现在尼尔·斯蒂芬森 1992
    年的小说《崩溃》中，尽管个人可以相互交互的虚拟模拟概念在此之前已经存在很久（例如 1982 年的 `Tron`）。根据 `Tsui` 的说法，随着相关技术的不断进步，虚拟体验的真实性和能力大大提高，导致在虚拟世界中连接的人数增加。


    根据 `Tsui` 的说法，毫无疑问，疫情激发了全球更多的人寻找一种更安全、更有效的在线互动方式。他们发现了一种在现实世界中与新朋友互动和交流的新颖且迷人的方法。


    `COVID-19` 引起的社交孤立作为虚拟社交网络兴趣的动力是合理的，但它并不是唯一的解释。另一方面，`Tsui` 更关注长期前景。据他所，疫情正在推动更多人“寻找”像元宇宙这样的东西，但“戏剧性”提高的“虚拟体验的真实感和能力”是他们留下来——以及回来并在虚拟体验上花钱的原因。即使疫情结束，这仍然是一个问题。


    在 `Upland`、`Atari`、`EarBuds` 和 `IMVU` 的帮助下，我们可以清楚地看到他在说什么。只需要几年时间，如果他们正在实验的所有内容都被整合，`Upland`
    将创造出一个无与伦比的投资平台/游戏体验，在短短几年后将变得无法识别。在 `Atari` 历史游戏知识的帮助下，一种创新的、尖端的游戏物品交易方法正在开发中。`IMVU`
    构建了一个人们想要参与并在其中的虚拟世界。尽管他们被疫情所吸引，他们也参与虚拟活动并购买虚拟道具，因为它是引入注目且沉浸式的。


    `Tsui` 的表达非常简洁。在关于我们的物理世界和元宇宙是否会合并并产生比现在的东西更宏大、更伟大、更令人难忘的问题上，他简单地说：“这是一个何时的问题，而不是是否的问题。”

