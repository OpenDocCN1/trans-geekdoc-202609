    # 序言


    元宇宙概念在 Facebook 改名为 Meta 之前就已经存在并快速发展，首席执行官马克克·扎克伯格也详细讨论过“元宇宙”。不可否的是：元宇宙已经在这里，而且很可能将长期存在。


    那么，元宇宙究竟是什么？它像某些公司声称的那样重要，还是仅仅是一个几个月后就会消失的转瞬即逝潮流？你需要了解关于元宇宙的所有知识吗？你是否应该在它进一步爆发之前投入？本书将深入探讨元宇宙概念，讨论它的过去、现在，以及最重要的未来。


    # 第一章


    ## 元宇宙的真正含义


    为了说明“元宇宙”这个概念可能有多么困惑和混乱，请考虑以下实验：在一个句子中，将“元宇宙”替换为“网络空间”。在百分之十的情况下，意思保持不变。该术语并不是指某项技术，而是由于技术进步，我们与之互动的方式发生了广泛变化。即使它最初指定的技术变得随处可用，该短语也可能过时，这是一种完全可能。


    它由两种技术组成：虚拟现实，其定义为永久的虚拟环境，即使在你没有玩时它依然存在；以及增强现实，它将物理世界和数字世界的元素融合，创造出更真实的体验。然而，并不要求某些场所只能通过虚拟现实或增强现实访问。一个可以通过电脑、游戏机甚至手机访问的虚拟世界（如
    `Fortite`），在可访问性上可以被认为是具有元宇宙属性的。


    也被称为“数字经济”，是一个允许用户创建、购买和销售物品的平台。互操作性允许你在更理想化的元宇宙环境中，将衣服或汽车等虚拟对象从一个平台移动到另一个平台。在现实生活中，你可能在商场买了一衬衫，然后晚上穿上它去看电影。大多数平台已经将用户的虚拟身份、化身和库存限制在单一平台；然而，元宇宙可能允许你创建一个可以随身携带到任何地方的人格，就像将你的个人资料从一个社交网站转移到另一个社交网站一样简单。


    当你听到类似上面的描述时，可能很难理解这一切意味着什么，因为当你听到这些话时，可能会想：“等等，那不已经存在了吗？”例如，`World of Warcraft`的`World
    of Warcraft`是一个永久的虚拟环境，用户可以在其中购买和出售物品。瑞克·桑切斯可能通过音乐会和`Fortnite`展览等虚拟接触来了解马丁·路德·金。。你可能通过戴上`Oculus
    Rift`虚拟现实头设备进入你的虚拟世界。“元宇宙”这个术语的定义是什么？它只是涌现出的几种新形式视频游戏吗？


    简而言之，答案是肯定的否。将 `Fortnite` 称为“元宇宙”就像将 Google 称为“互联网”。即使你在 `Fortnite` 中花费大量时间进行聊天、购买、学习和玩游戏，这也不能保证你理解了关于元宇宙的所有知识。


    元宇宙源于科幻小说，关于它的大多数普遍观点都源于此。正如《头号玩家》和《黑客帝国》等电影所示，元宇宙通常被描绘成一种数字化的“接入”互联网——一种对真实现实的描述，但基于一个模拟的（有时像主题公园那样的）环境，与《头号玩家》和《黑客帝国》中看到的场景媲比。虽然可以想象这种体验会在元宇宙中存在，但它们将受到限制，就像《创战纪》等电影将互联网呈现为由比特组成的真实数字“信息超级高速公路”一样。


    提到元宇宙时，我们无言以对，就像在 1982 年很难想象 2020 年的互联网——而且更难向从未“登录”过它的人解释它。另一方面，核心特征是可以被识别的。


    - **持久性 (Persistence)**：被定义为它从不“重置”、“暂停”或“终止”，而是不间断地持续。

    - 除了预先计划和自包含的事件外，元宇宙将是一个对所有人实时存在的现场体验，就像它在“现实生活”中一样。

    - 允许无限数量并发用户，同时保持每个用户的“临场感”——每个人都可以成为元宇宙的成员，并在同一时间参与不同的元宇宙、地点或活动，只要元宇宙支持。

    - 经济体系将完全运作——人们和公司可以开发、拥有和投资被他人看重的各种“劳动”，并且可以为这种劳动获得报酬。

    - 是数字世界和物理世界、私人网络和公共网络、开放平台和封闭系统的融合。

    - 由于这种整合，你可以在这些体验之间共享无与的数据、数字物品、内容等——例如，你的 `Counter-Strike` 皮肤可以在 `Fortnite` 中使用，或通过
    `Facebook` 送给朋友。就像为 `Rocket League` 车辆（甚至是 `Porsche` 网站）可以转移到 `Roblox` 中运行一样，为
    `Roblox`制作的车辆也是如此。今天数字世界的运作方式类似于商场，每家商店都有独特的身份卡、货币、商品（如鞋子或热量）的专用单位以及特定的着装规则，以此与其他区分来。

    - 由多元化的贡献者生成和运行“内容”和“体验”，其中一些是自雇人士，另一些可能是非正式小组或商业为导向的公司。


    还有一些概念可能对元宇宙至关重要，尽管它们并不为人所知。这些担忧之一是，个人是否可以在与所有人的接触中使用单一数字身份（或“化身”）。然而，尽管这可能很有益，但在短期内是怀疑的，因为每个“元宇宙时代”领导者都需要他们自己的识别系统。


    '
- fmt: '

    Another point of contention is the degree to which interoperability is required
    for the Metaverse to be considered "the Metaverse," rather than just a development
    of the Internet as it now exists. Many people also ask whether there can be just
    one operator in a genuine Metaverse, as opposed to a virtual one (as is the case
    in `Ready Player One`). The definition (and success) of a Metaverse, according
    to some, requires a strongly decentralized platform built primarily on community-driven
    standards and protocols (similar to the open web) and a "open source" Metaverse
    operating system or platform (though this does not rule out the presence of dominant
    closed platforms in the Metaverse).


    Another idea to consider is the fundamental communications architecture of the
    Metaverse. While the Internet is now built on individual servers "talking" to
    one another as required, others argue that the Metaverse should be "wired" and
    "managed" on constant many-to-many connections, rather than on individual servers
    "talking." A agreement has yet to be reached on how this would function or the
    degree to which decentralization would be necessary.


    It''s also good to think about what the Metaverse is commonly likened to, even
    if the comparison is incorrect. While these parallels are most likely a component
    of the Metaverse, they are not the Metaverse in and of their own right. The Metaverse,
    on the other hand, isn''t...


    ### Virtual Worlds


    A "virtual world" is an universe that exists only in the mind of the user. It
    has been decades since virtual worlds and games featuring AI-driven characters,
    as well as those filled with "genuine" individuals in real time, first appeared
    on the scene. A synthetic and fictitious world, rather than a "meta" (Greek for
    "beyond") cosmos with a single objective, is being explored (a game).


    Virtual worlds, such as `Second Life`, are frequently referred to as "proto-Metaverses"
    because they (A) do not have game-like goals or skill systems; (B) are persistent
    virtual hangouts; (C) provide near-synchronous content updates; and (D) feature
    real people who are represented by digital avatars in the virtual world. But they
    are inadequate properties for the Metaverse, as will be discussed later.


    ### Virtual Reality (VR)


    A virtual reality (`VR`) experience is a means of immersing oneself in a virtual
    environment or region without really being there. To qualify as a Metaverse, one
    must have a sensation of being present in a digital environment. Essentially,
    it''s the equivalent of claiming to live in an affluent city just because you
    can see and stroll about it.


    ### Digital Economies


    Another kind of economy - the "digital and virtual economy" - is already in existence.
    Individual games, like as `World of Warcraft`, have had functioning economies
    for a long time, in which real people exchange virtual goods for real money or
    do virtual labor for real money for a lengthy period of time. Furthermore, platforms
    such as `Amazon''s Mechanical Turk` and technologies such as `Bitcoin` are based
    on the use of people, corporations, and computer power to do virtual and digital
    labor, which is why they exist. As of right now, we are doing large-scale transactions
    via entirely digital markets for purely digital goods and services for purely
    digital activities.


    `Fortnite` is a "game," yet it features various Metaverse components. For example,
    it (A) mashes together IP; (B) has a consistent identity that spans numerous closed
    platforms; (C) is a doorway to a varied variety of experiences, some of which
    are fully social; and (D) pays content providers. While it has improved since
    the release of `Ready Player One`, it still falls short in terms of what it can
    accomplish, how far it can go, and what "work" can be done (at least for now).
    However, although the Metaverse may have certain game-like objectives, may include
    games, and may make use of gamification, it is not a game in and of itself, nor
    is it focused on achieving particular goals.


    ### Theme Parks and Architecture


    A "virtual Disneyland or theme park" is a kind of virtual theme park. The number
    of "attractions" will be limitless, and they will not be "planned" or "programmed"
    in the same way that Disneyland is, nor will they all be about fun or entertainment
    in the same way that Disneyland is. Furthermore, the distribution of engagement
    will have a very long tail, as would the distribution of engagement.


    Nobody requires a new way to access applications, and doing so "in `VR`" (for
    example) would not unlock/enable the types of value promised by a successor Internet.
    However, there will be a "new app store." The Metaverse'' architecture, paradigms,
    and aims are vastly different from those of today''s Internet/mobile architecture,
    paradigms, and objectives.


    In other words, the Metaverse isn''t simply another `YouTube` or `Facebook`-like
    platform where numerous individuals may create, share, and monetise material,
    with the most popular content accounting for just a tiny part of overall consumption.
    The Metaverse is a "new user-generated content platform." This will be a place
    where genuine empires will be built, and where these well-capitalized businesses
    will be able to totally possess a consumer, manage `APIs` and data, and govern
    unit economics, among other things, in the Metaverse. Furthermore, as is the case
    with the web, a dozen or so platforms are likely to dominate a significant percentage
    of user time, experiences, material, and other aspects of their lives.


    With this in mind, imagine being in `The Nightmare Before Christmas`, where you
    may stroll into any event or activity and possibly satisfy nearly any of your
    desires, all from a single starting point or planet that is home to everyone you
    know. It is for this reason why hypertext is so vital. However, it''s important
    to remember that the Metaverse is not a game, a piece of technology, or an online
    experience in the traditional sense. It''s the equivalent of stating that `World
    of Warcraft`, the `iPhone`, or `Google` are all representations of the Internet.
    Digital environments, gadgets, services, and websites, among other things, are
    included in this category. The Internet is comprised of a diverse range of protocols,
    technologies, tubes, and languages, as well as access devices, information, and
    communication experiences of varying kinds. And the Metaverse will be included.


    # Chapter Two: Why the Metaverse is Important?


    While it is expected to fall short of the grandiose predictions of science fiction
    writers, the Metaverse as a new computer platform or content medium is expected
    to generate billions of dollars in value. As it is currently envisioned, the Metaverse
    will serve as a doorway to the majority of digital experiences, as well as a critical
    component of all physical experiences and the next major labor platform.


    Although there is no "owner" of the Internet, the benefit of being a big participant
    in such a system is self-evident – although there is no "owner," practically all
    of the largest Internet corporations are among the world''s ten most valuable
    public companies. There will undoubtedly be substantially bigger economic advantages
    if the Metaverse serves as a functioning "successor" to the web, with far wider
    reach, time spent, and commercial activity than the web now provides.

