    Epic is bringing much more to its Metaverse-building efforts than simply a visually
    appealing on-ramp to the world. Additionally, Epic Games is the owner of Unreal
    Engine 2, the second-largest independent gaming engine, and is responsible for
    the operation of Fortnite, which was allegedly a side project for the company.
    Thousands of games (to keep things simple) presently make use of its "stack" of
    tools and software, which makes it simple to interchange assets, integrate experiences,
    and share user profiles with other games and developers. Epic''s game engine has
    evolved over time to the point where it now supports a variety of conventional
    media experiences in addition to video games. Using Unreal for the filming and
    rendering of Disney''s The Mandalorian, director Jon Favreau was able to virtually
    visit the digital sets to frame shots and arrange actors. If Disney so desires,
    audiences will be able to freely tour most of these sets since the majority of
    the locations and materials are already in place. Increasingly, Unreal is being
    utilized for live events outside of the realms of film and television, such as
    Fox Sports'' NASCAR coverage.


    Even While this may be true, the Metaverse requires that everyone, not only well-staffed
    corporations and technologically competent people, be able to create and exchange
    "content" and "experiential" material and experiences. Epic purchased Twinmotion
    in April of last year for the express aim of achieving this goal. However, rather
    than VFX engineers or game designers, the company was/is focused on providing
    straightforward, icon-based software that allows "architecture, construction,
    urban planning, and landscaping professionals" to create realistic, immersive
    digital landscapes based on Unreal "in seconds," rather than complex procedural
    animation software. The CEO and co-founder of Epic Games, Tim Sweeney, has stated
    that this means there are now three ways to create in Unreal: the traditional
    "coding" engine itself, the more simple and "visual" Twinmotion, and the Fortnite
    Creative Mode, which is intended for users who have no prior experience in programming
    or design. Over time, it is probable that each option will grow more competent,
    user-friendly, and well-integrated. It is becoming more important for Epic to
    have a "Online Services" suite, which enables developers to offer cross-platform
    play across platforms such as Sony, Microsoft, Nintendo, PC, iOS, and Android
    while using Epic''s account systems and social network (which has 1.6B player
    connections). While this is exceptional, Microsoft paid $400 million for PlayFab
    and spent millions more to maintain Xbox Live, while Amazon paid $1.5 billion
    for both GameSparks and GameLift, which are both service providers for game producers
    that need a significant number of servers and tools to operate their online games.
    Valve does not supply server infrastructure, but its Steamworks solution does
    so by offering free matchmaking and account services to developers — but only
    for Valve''s primary business, the Steam Store. Valve does not provide server
    infrastructure. Essentially, this is how Epic''s approach to Online Services is
    exposed. Epic does not demand a subscription fee, in contrast to today''s industry
    leaders. Additionally, it is completely free to use with any engine, platform,
    or game. As a bonus, since it can expand up to the same size as Fortnite''s player
    network, it allows any game to take use of the world''s biggest player graph to
    help restart their user populations. Epic believes that, despite the apparent
    benefit of such a service, it is "more valuable if provided for free" because
    it expands the company''s already massive social graph, makes it much easier for
    additional games to "speak" to one another, and allows players to transition more
    smoothly from one experience to another. As a result of all of this, Epic''s reliance
    on Fortnite to develop the Metaverse comes into doubt. While Epic Online Services
    is currently in private beta testing, the company has claimed that it will be
    offered to the general public in Q2 2020 and will support "hundreds or thousands"
    of games when it becomes available. In addition, it''s important to note that
    all of this reduces Epic''s dependence on Fortnite in terms of long-term Metaverse-building
    initiatives.'
