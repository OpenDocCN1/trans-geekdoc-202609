    # Standards, Protocols, and the Adoption of These Norms


    The Internet as we know it today is made possible by standards and protocols for
    visual display, communication, graphics, file loading, data, and many more functions.
    The range of products covered covers anything from well-known to obscure companies.
    In addition, the `WebSocket` protocol, which supports practically every kind of
    real-time communication between a browser and other servers on the internet, has
    been assigned to the `GIF` filetype.


    In the Metaverse, S&Ps will need to be more wider, more complicated, and more
    robust than they already are. Because interoperability and live synchronous experiences
    are important, we''ll have to prune some existing standards and "standardize"
    around a smaller set of standards per function—for example, today''s image file
    formats include `.GIF`, `.JPEG` (and variations), `.PNG` (and variations), `.BMP`
    (and variations), `TIFF` (and variations), and `WEBP` (and variations). Despite
    the fact that today''s web is built on open standards, most of it is closed and
    proprietary in nature. A comparable set of technologies is used by Amazon, Facebook,
    and Google; but, they are not meant to function together in the same way that
    Ford''s wheels are not designed to fit into a General Motors vehicle frame. Moreover,
    many organizations are adamant about avoiding linking their systems or exchanging
    their data with one another. However, although such activities may improve the
    total worth of the "digital economy," they also undermine the hyper-valuable network
    effects that are associated with it, making it simpler for people to shift their
    digital lives elsewhere.


    This will be a very tough and time-consuming task to do. The greater the value
    and interoperability of the Metaverse, the more difficult it will be to obtain
    an industry-wide consensus on concerns such as data security, data permanence,
    forward-compatible code evolution, and transactional functionality. As a result,
    new regulations for censorship, communication control, regulatory enforcement,
    tax reporting, and the prevention of online radicalization will be required, in
    addition to existing rules for a plethora of other challenges with which we are
    now wrestling today.


    The Metaverse''s standards will not be created in advance, in contrast to the
    traditional method of standard-setting, which involves face-to-face discussions,
    negotiations, and arguments. Unlike the standard process, which is considerably
    messier and more organic, meetings and views alter on an ad hoc basis in the standard
    process.


    ## The SimCity Model


    Consider `SimCity` to be a Metaverse equivalent in terms of gameplay. To get the
    best results, the "Mayor" (i.e., the player) would first design their mega-metropolis
    before building it from the ground up. You cannot, however, just "build" a city
    with 10MM inhabitants in the game, just as you cannot in real life. You begin
    by concentrating on a small town and optimizing it for maximum efficiency (e.g.,
    where the roads are, schools are, utility capacity, etc.). Construction occurs
    everywhere over the town as it expands, with some "old" parts being demolished
    and new ones being built in their place on occasion but only when a problem (such
    as a power outage) or tragedy happens (a fire). However, in contrast to `SimCity`,
    there will be numerous mayors rather than just one, and their desires and motivations
    will regularly collide with one another.


    We don''t know precisely what the Metaverse will demand, much alone how, when,
    or via which applications and organizations current standards will be transmitted
    to the new environment. Consequently, it is critical to analyze how the Metaverse
    grows rather than just the technical standard that it adheres to in order to be
    effective.


    ## The ''On-Ramp'' Experiential Learning


    In the same way that Metaverse standards cannot be "announced," consumers and
    companies will not accept a would-be proto-Metaverse merely because it is provided.


    Take a look at the facts of life. It is not necessary to build a mall big enough
    to accommodate a hundred thousand people or a hundred businesses in order to attract
    a single client or a single company. When existing infrastructure and activities
    are not sufficient to fulfill current civilian or business needs, "town squares"
    organically grow around them. Last but not least, any meeting area — whether it''s
    a bar, basement, park, museum, or amusement park — is frequented mostly due to
    the people or things that are already there, rather than because it''s a goal
    in and of itself.


    In the case of digital interactions, the same may be stated. `Facebook`, the world''s
    biggest social network, did not become so successful because it announced itself
    to be a "social network," but rather because it started as a collegiate hot-or-not
    site, grew into a digital yearbook, and eventually became a photo-sharing messaging
    service with messaging. The Metaverse, similar to `Facebook`, must be "populated,"
    not merely "populated," and this population must then fill in the spaces in this
    digital environment with activities to do and things to consume, rather than simply
    "populate."


    The fact that `Fortnite` is a video game or an interactive experience is much
    too limiting and hurried when considering it in these terms. `Fortnite` started
    off as a video game, but it quickly evolved into a social media platform with
    millions of followers. Teenagers would come home from school and talk on the phone
    for three hours every day from the 1970s to the 2010s. They are now talking about
    `Fortnite` with their friends, but not about `Fortnite` themselves. Instead, they
    talk about other things such as school, movies, sports, the news, guys and girls,
    and so on. Indeed, `Fortnite` does not have a narrative or an IP; rather, the
    storyline focuses on what occurs on the island and who is there to experience
    it.


    In addition, `Fortnite` is quickly becoming a platform for other businesses, intellectual
    property, and stories to express themselves through gameplay and storytelling.
    This contains, most notably, Marshmello''s live performance from last year. However,
    the number of similar examples has exploded in the intervening period. During
    a larger in-game audience-interactive event in December 2019, which included a
    live mocap interview with director J.J. Abrams, `Star Wars: The Rise of Skywalker`
    released a clip from the highly anticipated film that could only be accessed through
    the game''s `Fortnite` mode. Furthermore, this occurrence was explicitly mentioned
    in the film''s opening sequences. Weezer has set up a unique island where fans
    can receive a first listen to their next album before anybody else (while dancing
    with other "players"). In addition, `Fortnite` has developed a number of themed
    "limited-time modes" based on popular brands such as Nike''s `Air Jordan` and
    Lionsgate''s John Wick movie series. Sometimes, these "LTMs" transform a section
    of the `Fortnite` map into a mini-virtual world that, when accessed, alters the
    visuals, items, and playstyle of the game to mimic the appearance and gameplay
    of another game. Some of these settings have included the `Borderlands` world,
    `Gotham`, `Batman''s` home city, as well as the old west.


    Thus, `Fortnite` is one of the only places where the IPs of Marvel and DC may
    be found in the same game. In `Gotham City`, you may literally dress up as a Marvel
    character and chat with others who are wearing NFL jerseys that have been legally
    sanctioned by the league. This is the first time that anything like this has occurred
    in history. It will, however, be critical to the Metaverse''s development.

    '
