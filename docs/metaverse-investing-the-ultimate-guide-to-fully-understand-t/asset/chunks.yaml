    # 元宇宙的发展与展望


    ## 概述与挑战

    12 月 6 日，清华大学新闻学院新媒体研究中心主任沈阳在“中国发展论坛青年企业家峰会”上发布了团队的《2020-2021 元宇宙发展研究报告》。沈阳称，元宇宙是目前所能接触的最复杂的移动互联网。尽管元宇宙尚处于起步阶段，但元宇宙领域展现出成长型企业特有的不成熟和波动性，并且可能出现各种挑战。整个元宇宙业务目前处于“亚健康”状态，表现为至少存在
    10 项重大风险。行业和市场必须尽快恢复正常和理性。十个关键危险方面包括：资本操纵、舆论泡沫、伦理约束、垄断冲突、行业演进、算力需求、经济风险、成瘾风险、隐私问题以及知识产权保护困难。


    公司创始人周鸿祎谈到了元宇宙。他说，这个概念非常受欢迎。由于股市高涨，许多人最终发现了一种赚钱的新途径。在我看来，元宇宙是由小说家创造出的一个虚构虚拟环境。它发展出了一种与其所处物理离线世界截然不同的完全在线的现实。这需要一些时间。其次，我注意到
    Facebook 对未来的想法和梦想，并追随了它们。我认为这并不代表人类的未来。我将其视为人类终结的标志。它意味着如果我们放弃现实，并且不在现实中投入同等努力来实现目标，那么每个人都将生活在一个幻想的世界里。我和我在美国的同事进行过几次对话。还有人认为，脑机接口的融合最终将是元宇宙最伟大的宿命。闭上眼睛躺在床上，头部插入一根注入营养液的管子来激活脑波，这样就可以产生无限的数字。幻觉和图像最终能够取代《黑客帝国》中的人类电池吗？由于元宇宙的存在，人类文明将不会有任何方面的进展。人类若要解决全球能源困境，必须面对核聚变问题。


    ## 行业现状与演进

    清华大学新闻学院新媒体研究中心的沈阳教授指出，只有当人类解决了宇宙导航的谜团，才能离开这个世界回到自己的母星球。许多公司正在推广元宇宙，但他们实际上是在推广许多互联网产品，其中许多仅仅是移动产品，而非“元宇宙”。“目前元宇宙如火如荼，我想通过增加更多产品来火上加油。”我希望这一代人能够利用并满足于不断进步的技术，从处理能力到通信技术、算法和成品。直到晚些时候，“元宇宙”一词已成为信息技术领域最热门的流行语（buzzword），特别是在
    Facebook 上月将其更名为 `Meta` 以更好地代表其业务转型之后。明确的是，以前没有人听过“元宇宙”这个词。


    每个人都不确定最终产品会长什么样，因为这个想法仍处于早期阶段。另一方面，它的进展必须由需求驱动。为了研究各种技术在各种情况下的实施，`Meta`、`Microsoft`
    和 `Nvidia` 等 IT 巨头已转向元宇宙寻求帮助。然而，无论情况如何，这些产品基础的基础最终必须满足大众的需求。不符合消费者需求的产品很可能在未来被市场淘汰。


    ## 弗拉基米·普京的观点

    11 月 15 日，俄罗斯总统弗拉基米尔·普京表示他将参加 2021 年世界杯。根据媒体报道，“AI 之旅”国际会议（`AI Journey 2021`）将有以下演讲者：“我想指出，元宇宙这个词是由一位知名人物在
    30 年前创造的。根据作者的设想，人们从他们出生的真实世界的缺陷现实中逃亡到了元宇宙。这种想法对现在的我们来说实在太令人沮丧了。我不认为采取这种路线有理由。”


    普京此外还说，“我们需要利用元宇宙的功能，让人们无论距离多远，都能共同进行交流、协作、学习并开展合作研究和商业活动。”普京总统认为，这对于技术企业、创意产业、虚拟现实和混合现实设备制造商，甚至是法律专家来说至关重要，他们被赋予了建立“新世界”经济和社会标准的任务。“这是一个具有挑战性的局面，”他说。据普京介绍，这涉及确保网络空间中个人的受保护，以及他们在“元宇宙”中虚拟化身的安全。根据技术开发人员的说法，如果使用虚拟世界，人们可以在离开舒适家的情况下跨越空间。普京认为，“这使人们能够与位于遥远大陆的人交流。”


    ## 企业观点与未来展望

    根据 12 月 5 日发布的新闻，海丰董事长郭台铭近期参加了 `iCareDx` 医学技术展的新发布会，这是一家通过个人投资形成的初创企业，并在活动中分享了他对“元宇宙”概念的看法。根据郭台铭（`Terry
    Gou`）的，元宇宙理念的实施将需要 5 到 10 年，而随之的应用将在几年后。尽管在开发过程中有多种研发可能性，但重点不成比例地集中在应用端。由于“用户体验”仍有很大的改进空间，目前讨论应用的爆炸式增长是不可行的。


    在 11 月 16 日在波士顿举行的一场会议上，迪士尼的首席执行官鲍勃·查佩克（Bob Chapek）和新英格兰队的罗伯特·克拉夫（Robert Kraft）讨论了业务。双方畅述了元宇宙，查佩克暗示元宇宙将是迪士尼的未来。他说，迪士尼乐园和
    `Disney+` 互联网平台为公司提供了前所未有的元宇宙构建可能性。他断言，这个三维画布将无缝无限制地整合物理世界和数字世界，允许更多的创造性思维。他认为元宇宙代表了未来一代的成长路线。


