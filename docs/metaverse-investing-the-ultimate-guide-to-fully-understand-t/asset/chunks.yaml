  trans: '


    谈到解释元宇宙（通常被称为 `Web3`），这可能会很困难。这在某种程度上是因为它目前并不存在。另一方面，人们对元宇宙提出了自己的见解，我们将将其作为指南。可以将元宇宙视为一种沉浸式的、3D
    的且具有社区属性的虚拟现实体验。佩戴虚拟现实头设备将使用户带入虚拟世界，就像玩虚拟现实游戏将他们带入虚拟现实环境一样。


    ## 可访问性


    既然我们已经对元宇宙的本质有了明确理解，现在人们将如何访问它呢？虚拟现实头设备目前是进入虚拟世界最常用的方法。在未来，访问元宇宙可能不再需要虚拟现实头设备，但目前，它们是最有前景的进入方式。这解释了为什么像
    `Facebook` 这样的公司在虚拟现实头设备整个虚拟现实技术上投入了这么多。如果你想了解更多关于虚拟现实技术的现状、未来方向以及当前的 VR 趋势，请听听我们与特邀嘉宾、`XRApplied`
    的 `Sales` 的 `Luke Levene` 的音频节目。


    ## 元宇宙是可以探索的


    你可能会问，既然我们已经有了虚拟现实，那么元宇宙与虚拟现实的区别是什么呢？虚拟现实和元宇宙之间存在着巨大的差异。首先，将虚拟现实想象成一艘船，而将元宇宙视为目的地。此外，用户在元宇宙中能做的比玩游戏多得多，而游戏目前是虚拟现实最流行的用途。用户将在元宇宙中与来自全球的人士互动、购物、做生意以及进行各种其他事情。


    此外，`bitcoin` 在未来将发挥重要作用。远见者们表示希望元宇宙能够接受自己的货币，并具有接受其他加密货币作为支付的能力……不出意料的是，非线性光纤（`NFTs`）将在元宇宙中发挥重要性作用。


    ## NFTs 的重要性


    元宇宙最基本的特征之一是 `NFTs` 的整合。无论是图片、音乐、表情包、虚拟服装、杂志文章还是任何其他类型的数字艺术，大多数人通常将 `NFTs` 视为此类。但对于元宇宙来说，`NFTs`
    有完全不同的用途。`NFTs` 可用于代表元宇宙中的土地。


    每个元宇宙都应该有有限数量的土地供开发。因此，出现了资源短缺。根据供需法则，稀缺性增加了商品的价值。元宇宙中的用户将以 `NFT` 的形式购买土地，正就像他们在现实世界中一样。这让他们能够无限期持有
    `NFT`，并在准备好后将其（以及土地）卖出。


    事实上，土地已经在虚拟世界中作为 `NFT` 销售。`Decentraland` 中的一个 `NFT` 被数字房地产投资机构 `Republic Realm`
    以 `$913,000` 的价格收购。`Republic Realm` 是一家专门从事数字房产的投资公司。`Decentraland` 是一个基于 `Ethereum`
    区块链技术的虚拟现实平台。`Minecraft` 用户很快就能使用 `Minecraft` 币在游戏中购买土地。收购的土地也是以 `NFT` 的形式购买的。


    # 第五章


    ## 在元宇宙中通过 NFTs 赚钱


    ### 访问元宇宙时非终性交易的重要性：


    1. 由于区块链的存在，元宇宙可以创建一个公平开放的经济环境。

    2. 通过使用 `NFTs`，“边玩边赚”的游戏经济将赋予基于区块链的游戏玩家权力。

    3. `NFTs` 是往元宇宙的门户，允许在元宇宙中探索身份和社交互动。


    第一步是让玩家收集游戏内代币。


    `NFTs` 凭借其快速增长的应用案例正在开启数字世界的新时代——元宇宙。`Facebook` 推出 `Meta`，标志着向元宇宙时代的迈进，基于 `NFT`
    的增强体验预计将作为下一代社交网络的基础，这最好地证明了元宇宙在全球范围内的出现。


    `NFTs` 和元宇宙已经交织在一起，特别是在区块链游戏和其他可互操作游戏中，它们在那里作为大规模数字社交媒体的价值载体。尽管这是一个相对新的想法，但 `Binance
    NFT` 的初始游戏发行 (`IGO`) 证明了 `NFT` 游戏已获得普及。这个新的游戏部门受到了玩家和加密货币购买者的热烈反响，在短短两周内，交易额就达到了
    `$16 million`，所有的 `IGO` `NFT` 集合都已售罄。


    利用区块链技术，元宇宙可以被定义为一个数字生态系统。虚拟现实和增强现实（`VR` 和 `AR`）等技术提供了视觉组件，而去中心化媒体允许了无尽的社交参与和商业机会。这些环境具有扩展性、互操作性和适应性，它们在个人和组织层面将成员之间的创新技术和互动模式相结合，从而产生更高效、更吸引投入的工作环境。


    元宇宙是数字 3D 宇宙，其中通信、货币、游戏世界、个人资料、`NFTs` 以及其他过程和元素全部存在。元宇宙也被称为数字 3D 宇宙。元宇宙的承诺归功于它所提供的自由；元宇宙中的任何人都可以创建、购买和查看
    `NFTs` 以获取虚拟土地、加入社交网络、建立虚拟身份以及玩游戏等。由于可能的用例非常广泛，有很多机会对现实世界和数字资产进行变利，企业和个人都能整合到元宇宙框架中。


    未来的元宇宙将把不同的在线领域连接起来，`NFTs` 实现跨世界的跨链交互。为了更深入地理解元宇宙


    ## NFTs 对元宇宙将产生什么影响？


    在元宇宙中，`NFTs` 有潜力颠覆用户互动、社交和交易活动的传统社交网络模型。了解 `NFTs` 如何在数字世界中创造变化。


    ### 一个开放公平的经济体。


    现实世界的商品和服务现在可以在元宇宙（这是一个去中心化的虚拟环境）中的用户和公司之间传输。使用具有互操作性的区块链游戏的新游戏模型是带来更多现实资产进入元宇宙的一种策略。


    另一种替代方案是“边玩边赚”的游戏理念，它参与并赋予了区块链游戏参与者权力`NFTs` 允许玩家参与元宇宙的游戏内经济，并根据他们提供的价值获得奖励，这依赖于
    `NFTs`（这是边玩边赚钱的俚语）。在元宇宙的边玩边赚游戏中，玩家对其资产拥有完全控制权，而大多数传统游戏相反，它们仅赋予玩家单个游戏单元的所有权。


