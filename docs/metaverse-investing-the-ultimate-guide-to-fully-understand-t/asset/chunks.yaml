  trans: '

    Epic 还运营着全球最大（尽管仍然很小）的数字游戏商店之一，让客户能够访问广泛的数字内容和体验。客户对数字内容的进一步碎片化并不感兴趣，绝大多数人对市场领导者
    `Steam` 表示满意。`Epic Games` 的创始人兼首席执行官 Tim Sweeney 一直直言，目前数字内容购买的标准 30% 百成费用（例如在
    `iOS`、`Amazon` 或 `Google Play` 上）不仅是高利贷的，而且阻碍了真正的全球数字市场的发展。如果信用卡手续费是目前的 20 到 60
    倍，实体经济中的许多巨大部门将无法运营（例如咖啡馆或杂货店）。这项服务的费用仅占 `Epic` 总成本的 12%（还包括 5% 的 `Unreal` 许可费，使得许多客户的成本仅为
    7%）。特别值得注意的是，有报告不断传出，Sweeney 在与董事会同意 12% 的费率之前，曾寻求过更低的费用——Sweeney 承认，这一费率在所有情况下都不足以支付运营费用。并不是说这里没有更广泛的商业机会；运营一家商店无疑将有助于元宇宙的扩张——但
    Sweeney 的努力范围似乎比这广泛得多。尽管 `Google` 和 `Apple` 正在积极追逐 `Epic` 的价格，但它们产生的收入是 `Epic`
    的初创商店的数千倍。


    如果 88/12 百成的零售冲突通过掷硬币来决定，结果将如下：由于其他零售商没有做出反应，`Epic Games Store` 成功了，所有创作者也因此获得了胜利。由于
    `Tails`（反面），我们的竞争对手追上了我们，并失去了我们在收入分成方面的竞争优势。其他零售商可能会因此获益，但所有开发者都将受益。


    # 第三章


    还有谁能够构建元宇宙？


    尽管元宇宙有完全取代互联网作为计算平台的潜力，但它不太可能追随其先驱的后辙。在美国，公共研究机构和政府倡议负责了互联网的发展。这部分归是因为私营部门很少有人看到世界维网的经济潜力，但也是因为这些组织几乎是唯一拥有构建它所需的计算能力、资源和雄心的机构。如果我们从元宇宙的角度来看，这一切就都不成立。


    私营行业不仅完全意识到元宇宙的潜力，而且对它的未来最有信心，并且拥有比任何其他行业都多的资金（至少在愿意支持元宇宙研发的意愿方面）、最出色的工程技能以及最强的征服野心。公司想要主并定义元宇宙，而不仅仅是处于其开发的前沿。尽管在元宇宙早期只有少数潜在的领导者，但具有非企业视角的开源努力将继续在元宇宙中发挥至关重要的作用，并会吸引一些最令人兴奋的创意人才。你将能够将它们每一个区分开来。


    `Microsoft` 是如何做到这一点的一个很好的例子。通过 `Office 365` 和 `LinkedIn`，该公司拥有数亿联邦用户身份，是全球第二大云服务供应商，拥有一套跨越所有
    `platforms/infrastructure/systems`（平台/基础设施/系统）的广泛工作相关软件和服务，在海量共享在线内容/运营方面拥有可证明的技术专长，并拥有一套包括
    `Minecraft`（我的世界）、`Xbox + Xbox Live` 以及 `HoloLens` 等在内的的一系列潜在网关体验。因此，元宇宙为 `Microsoft`
    提供了一个机会，使其夺回在从 `Windows 95` 迁移到 `Windows NT` 期间失去的 `OS/硬件`领先地位。


    从电脑到移动设备。但也许重要的是，`Microsoft` 的首席执行官 `Satya Nadella` 意识到公司必须出现在任何进行工作的地方。随着 `Microsoft`
    从企业到消费者、从 PC 到移动、从离线到在线的成功转型，很难想象这家公司不在劳动和信息处理的虚拟化未来中发挥重要作用。`Microsoft` 成功地完成了从企业到消费者、从
    PC 到移动、从离线到在线的转型，同时在“工作”经济中保持着重要地位。


    显然，`Facebook` 的首席执行官 `Mark Zuckerberg` 正专注于元宇宙，尽管他尚未明确声明他想要开发和运营一个元宇宙帝国。这也是一个大策略。由于元宇宙创造了更大、更强大的社交图谱，以及一个新的计算机和交互平台，`Facebook`
    面比任何其他公司损失最多的资金。同时，元宇宙允许 `Facebook` 将影响力扩大到整个社交媒体栈。尽管已有其他尝试设计手机操作系统和部署消费硬件，但 `Facebook`
    是 `FAAMG` 企业中第一个完全专注于应用和服务层的企业。由于元宇宙，`Facebook` 可能成为下一个 `Android` 或 `iOS/iPhone`（因此
    `Oculus`），以及 `Amazon` 的虚拟商品等物。


    `Facebook` 在元宇宙中的优势是无法衡量的。地球上每一个其他平台在日用户数、日使用时间和用户生成内容方面都显得黯然失色。它拥有仅次于数字广告支出比例、数十亿美元、数千名世界级工程师以及一个拥有多数投票权的所有者。此外，它的
    `Metaverse` 资产正在快速扩张，半导体和脑机接口的专利现在已成为其最有价值的资产之一。然而，公司作为一个允许第三方开发者和组织构建长期企业的平台、作为一个财团（例如
    `Libra`）的领导者以及作为用户信息和信任的管理者，其记录非常糟糕。


    `Amazon` 因各种原因而令人振奋。为了成为我们购物的首选网站，它将不断尝试这样做。无论使用游戏引擎、虚拟环境还是网络浏览器购买物品，该交易都是有效的。此外，该公司已经拥有数亿张信用卡和全球（除中国外）最大的电子商务份额。它还运营着各种消费媒体体验（音乐、电子书、视频、游戏直播、有声书等）和第三方商业平台（例如
    `Fulfilled by Amazon`、`Amazon Channels`），并且正在开发他们希望是首个专门为云构建的大游戏/渲染引擎（`Amazon
    Cloud Gaming`）。


