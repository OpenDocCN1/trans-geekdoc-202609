  trans: '

    另一方面，某些局限性可能是不可行的。需要注意的是，当 `Microsoft` 和 `FaMeta` 等公司发布未来构想的虚假视频时，他们并没有考虑人们是如何与元宇宙交互的。尽管虚拟现实技术仍处于起步阶段，但大多数人在长时间使用虚拟现实头戴设备后会感到晕症或身体不适。除了如何在公共场合使用增强现实眼镜而不让自己看起来像个大白痴这一项不容忽视的挑战外，增强现实眼镜也面临着类似的系列挑战。


    那么，信息技术（IT）企业如何在不展示笨重设备和奇特眼镜的情况下，展示其技术的理念呢？目前看来，他们最可行的替代方案似乎是从零开始构建技术。她是今天早些时候
    `Meta` 演讲中出现的那个全息女子吗？我很抱歉要带来坏消息，但即使使用当前技术最先进的版本，要实现你所要求的也是不可行的。


    如果不使用精确控制的条件，在空中出现三维图像是不可能的；相比之下，运动追踪的数字分身虽然目前看起来还有有些生硬，但明天可能会变得更好，无论 `Iron Man`
    怎么想。也许它们被设计为通过眼镜投影的图片——毕竟演示视频中的两个女性都戴着眼镜——但这对微型眼镜的物理能力提出了很多假设，而 `Snap` 恰恰证明了这从一开始就是一个难以解决的挑战。


    作为一种展示元宇宙可能如何运作的方式，这种对现实的欺骗在电影演示中很常见。使用虚拟现实设备或仅仅坐在桌子前，这个人是在做什么？这个人看起来要么是连接着沉浸式飞行设备，要么只是坐在桌子前。`Meta`
    的另一场演示展示了在空间中漂浮的人；此人是连接着沉浸式飞行设备，还是仅仅坐在桌子前？图中描写的人戴着全息图吗？如果是，是如何扫描他们的脸来创建全息图的？在某些情况下，一个人可以拿虚拟物品，而在另一些时候似乎又在他们真实手中拿着它们。


    这次演示产生的问题比它提供的答案要多得多。


    在某种程度上，这种行为是可以接受的。`Microsoft`、`Meta` 以及其他创建此类疯狂演示的公司都在试图描绘出未来可能样子的艺术感，而不是解决过程中可能出现的每一个技术问题。当时，这看起来似乎是不可能的，但
    `AT&T` 一场语音控制折叠手机的演示——它可以神奇地从图像中删除个人并生成 3D 模型——开启了一项长期的传统。


    然而，无法预测由于这种“作为技术的愿望式演示”导致的结果，各种元宇宙概念中的哪些特征有一天会变成现实。只要虚拟现实和增强现实头戴设备足够舒适且物美廉，，让人们每天佩戴——这是一个巨大的“假设”——那么与在空间中漂浮的机器人或全息投影作为对手玩虚拟扑克的想法就可能实现。如果那不是一个选择，你始终可以通过
    `Discord` 视频会议参与 `Tabletop Simulator`。


    虚拟现实和增强现实的华丽也掩盖了元宇宙更平庸的元素，而这些元素更有可能表现出来。对于软件公司来说，建立一个开放的数字分身标准是轻而易举的，这将是一种包含你在角色创建器中输入的属性的文件——例如眼睛颜色、发型和服装选项——并允许你随随地携带它。为了这一目的，没有必要去创建更舒适的虚拟现实头戴设备。


    ### 元宇宙的机会、风险与未来


    “元宇宙”一词在过去几年中在全球范围内引发了大量的讨论。来自各种背景的广泛人群对元宇宙的推广努力做出了积极反应。“下一步是什么？”是几天前出现在英国《经济学人》（The
    Economist）网站上的一个问题。根据《2022 年值得关注的 22 项新兴技术》一文，元宇宙、量子计算和虚拟网红是 2022 年值得关注的 22 项新兴技术之一。正如《商报》（Commercial
    Press）报道的，国家语言资源监测与研究中心在 12 月 6 日发布的一份报告中将元宇宙列为“2021 年十大网络词汇之一”，报告中还列出了其他热门网络词。


    正如《商报》的文章解释道，“元宇宙”一词源于《雪崩》（Avalanche）中引入的科幻概念，目前用于指由 `XR`、数字孪生、区块链技术和人工智能等技术进步创造的虚拟世界。在此时，元宇宙仍然是一个不断成长和发展的概念。全球范围内围绕元宇宙这一巨大且不断发展的理念着着讨论。


    ### 处理元宇宙的最佳方法是什么？


    沈向阳（美国国家工程院外院士、英国皇家工程院外院士）最近从元宇宙的四个层次解释了元宇宙的新含义。他的声明强调，元宇宙应该是一个以开放性为特征的世界，随后的产品将建立在这个基础之上。


    根据阿里巴巴达摩院 `XR` 实验室主任谭平的话，元宇宙是下一代互联网，即运行在 `AR/VR` 眼镜上的整个互联网。下一代移动计算平台（如增强现实 AR
    眼镜）正走向普及，而元宇宙是互联网行业对这一新平台的展示。每形式的互联网应用都将在元宇宙中有一个呈现，就像现在一样。元宇宙的技术底层被分为四层：全息构建、全息仿真、虚实融合和虚实联动。在前两个层通过虚拟现实（VR）创建一个虚拟环境，而第三、第四层则利用增强现实（AR）在第三和第四层创建虚拟与现实世界的混合。

