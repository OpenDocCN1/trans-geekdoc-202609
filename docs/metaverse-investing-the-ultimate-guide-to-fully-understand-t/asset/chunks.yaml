- fmt: '

    # Amazon and the Metaverse


    The company''s founder and CEO Jeff Bezos is very enthusiastic about infrastructure
    expenditures; this is particularly significant. `AWS`, for example, is responsible
    for the operation of the internet (Amazon Web Services). The company sells, packages,
    and delivers items offered by other companies, rather than purchasing and selling
    inventory directly. Fulfilled by Amazon accounts for 80 percent of Amazon''s income,
    with the company earning 80 percent of its revenue from this service (like most
    retailers). Bezos has stated that his goal with `Blue Origin` is to "build gigantic
    chip factories in space and simply send little bits down," similar to early web
    protocols and his Amazon Web Services (`AWS`). While Elon Musk''s private aerospace
    company, `SpaceX`, aspires to colonize Mars, Bezos has stated that his goal with
    `Blue Origin` is to "build gigantic chip factories in space and simply send little
    bits down." This means Amazon is more likely than any other FAAMG enterprise to
    support a totally open Metaverse — it does not need to control the user experience
    or identification since it benefits from tremendous increase in back-end infrastructure
    usage and digital transactions.


    # Google and the Metaverse


    In the same way that the Internet is a data mine, the Metaverse will include both
    more data and possible greater returns than the existing web. On a global basis,
    Google is the only company that performs a better job monetizing this data than
    it does. As a result of its leadership in indexing both the digital and physical
    worlds (almost 10,000 workers are involved in mapping operations), the firm is
    also the most successful digital software and services company outside of China.
    Moreover, it is home to the world''s most popular operating system (`Android`)
    and the most open major consumer computer platform (`Windows`). Google was the
    first company to actively pursue the wearable computing potential with `Google
    Glass`, and the company is now making a major push into digitizing the house with
    `Google Assistant`, its `Nest` suite of devices, and `FitBit`, despite the failure
    of `Google Glass`. Consequently, the Metaverse will most likely be the only effort
    to bring together all of Google''s disparate investments to date, which include
    `Stadia` edge computing, `Project Fi`, `Google Street View`, massive dark fiber
    purchases, wearables, and other technologies such as virtual assistants, among
    other things.


    # Apple and the Metaverse


    It is quite unlikely that the underlying Metaverse will be influenced or managed
    by the underlying Metaverse. In fact, it operates the world''s second-largest
    computer platform (and by far the most valuable), in addition to being one of
    the largest game merchants in the world (which also means it pays more to developers
    than anyone else on earth). The company is also actively investing in augmented
    reality devices and "connective tissue" to aid the Metaverse''s development. [source:
    Wikipedia] (e.g., `Apple Watch`, `Apple AirPods`, beacons). Apple''s way of thinking
    and business model, on the other hand, are incompatible with the development of
    an open platform for innovation, where anybody may access the complete spectrum
    of user data and device `APIs`. Thus, rather than the operator/driver, Apple is
    more likely to be the primary way by which the Western world communicates with
    the Metaverse than vice versa. This, like the Internet, will almost certainly
    be beneficial to all parties involved.


    # Unity Engine Strategy


    If the Metaverse involves a wide interaction of assets, experiences, and common
    `APIs`, `Unity` will be key in facilitating this interplay. This engine is utilized
    by more than half of mobile games, and it is even more widely used in real-world
    rendering and simulation applications (such as architecture, design, and engineering)
    than the `Unreal Engine`. Disney''s `The Mandalorian` was being created and photographed
    in `Unity` at the same time as director Jon Favreau was creating and filming the
    photo-realistic `Lion King`. The company also owns and operates one of the world''s
    biggest digital advertising networks (a nice side effect of powering 10B daily
    minutes of mobile entertainment). However, it is uncertain what role `Unity` will
    play in moving the Metaverse forward in the next months and years. There is no
    physical shop, no user account system, and no real direct-to-consumer experience
    available at this time. The majority of its ancillary services (those that are
    not related to the search engine or advertising) are not often utilized. Furthermore,
    the vast majority (though not all) of `Unity`-powered games are basic mobile games
    rather than Metaverse gateways, as previously stated. It''s impossible to see
    it not being purchased and incorporated into a bigger technological business with
    greater assets and perks, though, given its inescapable impact on standards, playtime,
    and content production, among other things.


    Previously, it was difficult to justify the purchase of `Unity`. A prospective
    purchase must ensure that `Unity` remains completely platform neutral in order
    to preserve market dominance, developer support, and impact (for example, `Google`
    could not make `Unity` exclusive to or the best on `Android/Chrome` without alienating
    a huge number of developers). However, this does not rule out the possibility
    of turning `Unity` into a proprietary engine in the future as a wise strategic
    decision. The value that would be lost as a consequence of such a choice, along
    with the premium that would be necessary to acquire `Unity`, would very definitely
    render such a move financially unsustainable. The purchase of `Unity`, on the
    other hand, may be motivated by the desire to hold a key position on the new Internet,
    in which case the acquirer will have a strong incentive to keep the engine open/available
    across platforms, and the price will rapidly become unimportant.


    # Epic and Valve


    If `Epic Games` has a realistic road to the Metaverse, then `Valve` must as well.
    The `Epic Games Store` pales in comparison to `Valve`''s `Steam` in terms of users,
    money, and playtime. It is the creator and owner of a number of the most popular
    and long-running multiplayer games on the market today (`Counter-Strike`, `Team
    Fortress`, `DotA`). Apart from that, the company has a lengthy history of content
    creation as well as monetization innovation (it was the first to experiment at
    scale with `AAA` free-to-play games and with player-to-player marketplaces). As
    an example, `Valve` has spent years developing and releasing virtual reality technology,
    and the company now generates billions in yearly revenue. `Valve` is privately
    held by a group of programmers who are enthusiastic about open-source technologies
    and despise closed settings. `Valve`''s `Source` engine, on the other hand, has
    received little attention, and, unlike `Epic`, it does not seem to be interested
    in putting its capabilities and assets together to create the Metaverse.


    ## Conclusion


    What is the purpose of holograms in the Metaverse?


    Upon the introduction of the internet, a succession of technical advancements
    were made, including the ability to connect computers across long distances and
    the ability to link one web page to another on the internet. These technical qualities
    laid the groundwork for the abstract structures that we now associate with the
    internet, such as websites, apps, social networks, and everything else that is
    built on top of their basis. That doesn''t even take into consideration the convergence
    of non-internet interface technologies like as displays, keyboards, mice, and
    touchscreens, which are still required for the internet to operate properly.


    Several new building blocks have been put in place with the introduction of the
    metaverse. For example, a server instance can host hundreds of people (future
    versions of a metaverse should be able to handle thousands, or even millions)
    and motion-tracking tools can distinguish where a person''s hands are located.
    It is possible that these new technologies will be incredibly exciting and futuristic
    in the future.

    '
