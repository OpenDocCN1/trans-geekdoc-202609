    数字营销人员必须紧跟最新的技术发展。理解元宇宙及其全部潜力是这一过程中的重要组成。营销人员必须意识到，元宇宙并非转瞬即逝的趋势；它看起来将长期存在，并正朝着成为营销领域的下一个大趋势发展。


    ## 营销人员可以使用哪些技术来跟上元宇宙的快速扩张？


    首先，营销人员不应低估千禧一代和 Z 世代作为目标群体的重要性。许多类型的元宇宙，如 `Roblox` 等视频游戏和 `VR` 等虚拟现实技术，在这一代人中流行。让我们先考虑这一点，看看如何在元宇宙中开展营销。


    ### 平行元宇宙营销与传统的现实世界营销并行进行。


    创建与现实生活活动相关或与公司目前在现实世界中所做的活动相当的营销体验，以吸引客户参与。`AB InBev` 所有的啤酒品牌 `Stella Artois`（花信）与
    `Zed Run` 公司合作，在六月开发了一种受`Tamagotchi`游戏系统启发的肯塔基德马体验。结果，他们选择了 `AB InBev` 所有的 `Stella
    Artois`，该品牌以赞助体育活动（尤其是赛马）而闻名。对于他们来说，建立一个可以交易、比赛和育种非同质化代币（`NFT`）的在线平台似乎是逻辑上的下一步。


    ### 沉浸的重要性无论如何强调都不为过。


    你可以通过在元宇宙中销售虚拟广告来赚钱。视频游戏广告技术初创公司 `Bidstack` 已完成从传统的户外广告向虚拟广告牌营销的转型。


    另一方面，虚拟广告牌并非唯一选择。利用元宇宙本质上迷人且具有沉浸性的特点，并通过提供类似的沉浸式广告和营销体验来实现这一点，是理想的。与其仅仅是展示广告，不如为消费者提供他们可以参与的品牌装置和活动。


    消费者一直很享受由早期采用者提供的沉浸式体验，例如 `Roblox` 中的 `Lil Nas X` 演唱会、`Gucci Garden` 体验活动，以及华纳兄弟对《高地狂热》（In
    the Heights）的推广，其中包括对华盛顿高地地区的虚拟重建。`Roblox` 元宇宙和其他虚拟世界最近通过与这些平台的合作，为营销人员展示了新的收入来源。


    ### 收藏品应该变得易于获取。


    拥有收藏品是一项流行的爱好，而元宇宙为之提供了另一个平台。提供只有在元宇宙中才能获取的资产或限量版产品，允许用户在现实世界中重现这种体验。


    其中一个功能是 `Collector''s Room`（收藏室），它可以在 `Gucci Garden` 的 `Roblox` 体验中找到。它使用户能够在元宇宙中积累大量的限量版
    `Gucci` 商品。结果，`Gucci` 通过该游戏首次销售收藏商品赚取了 `286,000,000 Robux`。


    ### 与已存在的社区互动。


    广告被普通大众广泛厌恶。尝试进入元宇宙的企业必须小心，不要得罪已经在那里的人们。你还需要来自这些用户的积极反馈，因为你在不久的将来将向他们进行营销。


    记住，你不能在不考虑新格式的情况下直接加入一个新平台。例如，与 `Roblox` 开发者社区成员互动以构建物品和体验的企业主，从远来看将获得更大的关注。同样，当
    `O2` 举办《堡垒之夜》（Fortnite）演唱会时，他们与已经非常熟悉该游戏机制的工程师进行了合作。


    将此视为影响营销的实际案例。因为用户生成的内容至关重要，你社区中的人成为你实施计划措中不可或缺的一部分。


    ### 定期进行实验。


    营销人员正处于一个令人兴奋的变革时期。然而，尽管有某些指导原则可以帮助营销人员确定使用哪些方案和方法，但元宇宙仍然是一个新平台，留有很大的实验空间。目前正在努力建立最佳实践，而且范式仍在整体处于创建中。这为营销人员提供了极大的自由，让他们对新想法进行实验，并在策略上发挥创造力。


    ## 元宇宙中的其他特殊案例。


    `Dimension Studio` 为时尚品牌进行的元宇宙测试带来了 `650 万美元` 的销售额。用户可以进入一个拥有 106 台摄像头的虚拟制作场景，在被传输到虚拟世界之前对他们进行扫描，在那里他们可以试穿服装和其他产品。他们因参与
    `Balenciaga`（巴黎世家）2021 秋冬 `Afterworld` 游戏系列的作品而闻名。


    《侠盗猎手 V》（Grand Theft Auto V）这款开放世界沙盒游戏增加了几种服装选择，其中包括类似于香港抗议者所穿着的替代方案。许多艺术家一直在利用虚拟世界表达自己的政治观点，香港的抗议者如果愿意，可以将斗争从现实世界带入元宇宙。


    用户可以在专注于家居设计和装饰的网站 `Houzz` 上建立他们家具和其他家居用品的数字图片集。每当有人利用 `Houzz` 的服务进行购买时，他们就能为自己赚钱。得益于公司在
    2017 年创建的 `3D viewer`，用户可以通过摄像头直接查看 3D 物品，并在视觉上将其整合到他们的实际环境中。


    `Google Maps` 在演示中展示了其步行指令的增强现实功能。该功能为用户提供精确的视觉指令和箭头，帮助他们在移动设备上导航至预定目的地。只需将用户的摄像头指向他们需要帮助的方向，增强现实功能就会引导他们沿着正确的路线行驶。

