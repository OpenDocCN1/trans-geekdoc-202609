  trans: '


    自从 Facebook 宣布更名为 Meta 以来，“元宇宙”（metaverse）一词已流行起来。Meta 是一家社交技术公司，其目标是“让元宇宙变为现实”。他们总部位于旧金山。这个想法引起了许多元宇宙爱好者的兴趣。


    从其本身来看，这个名字和概念并不新奇。虽然元宇宙的概念已经存在了几十年，但直到最近才出现具体的实例。在尼尔·斯蒂芬森（Neal Stephenson）1992
    年的著作《崩雪奇员》（`Snow Crash`）中，主角们使用计算机化身来探索数字世界或相互联系，以逃避他们反乌托邦式的现实；元宇宙”一词的创造正是为了描述这种数字环境以及他们彼此之间的互动。


    数字孪生（digital twin），或现实世界中任何事物的虚拟复制，最初是由大卫·格莱纳特（David Gelernter）在他 1991 年于英国出版的著作《镜像世界》（`Mirror
    Worlds`）中提出的。根据他自己的承认，迈克尔·格里夫斯（Michael Grieves）博士被广泛认为是数字孪生软件概念的开发者，他于 0002 年首次将数字孪生概念应用于制造业。美国国家航空航天局（NASA）在
    2010 年使用数字孪生技术复制了太空舱，并取得了巨大的成功。元宇宙似乎正在来临，但它究竟是什么，以及对我们的日常生活可能产生什么影响，仍有待讨论。以下是一些示例，可以帮助你更好地理解元宇宙、它的运作方式以及它未来可能向何处发展。


    ## 帮助你理解元宇宙的现实示例


    目前，不可能对元宇宙给出一个具体的描述。


    元宇宙是一个定义松散的虚拟世界，在其中用户可以访问数字化身，使他们能够在自己创建的虚拟现实中“生活”。在元宇宙中，人们可以相互交谈、买卖数字资产、前往虚拟地点（这些地点可能是完全构想的，也可能有现实生活的对应物），并参与各种其他活动。


    就像在《头号玩家》（`Ready Player One`）中，元宇宙提供了一个无限可能的世界，只有用户的想象力是限制。它与电影中的 `OASIS` 可以比拟。


    一个更准确的定义应该是存在于我们的物理宇宙之外或作为我们物理宇宙延续的虚拟宇宙。它的核心是虚拟现实（VR）和增强现实（AR）等互操作性技术。它由由数字货币或加密货币驱动的可行数字经济支持（正如你可能听过的，它们与加密货币并不是一回事）。


    此外，并没有一个唯一的元宇宙可言。在元宇宙中，有许多变体供探索。例如，如果你正在玩《堡垒之夜》（`Fortnite`），你可以选择进入虚拟现实。`Facebook
    Horizon`的用户也可以访问另一个完全不同的元宇宙。另一方面，元宇宙旨在具有互操作性，这意味着只要平台兼容，你最终可以在一个平台上获得的资产并在另一个平台上使用它们。


    ## 有助于解释元宇宙的元宇宙示例


    元宇宙的概念以及它开启的可能性绝对奇奇的。以下是元宇宙的一些现实示例，以及它可能被用于更好地刻画这种另一种现实的地方。


    ### 流行文化描绘的元宇宙


    ### 1. 《头号玩家》是一款视频游戏。


    在谈到元宇宙时，《头号玩家》几乎总是被作为一个例子。尽管如此，这背后有其合理的理由。《元宇宙》是恩斯特·克莱恩（Ernest Cline）于 2011 年写的科幻小说，描绘了元宇宙可能的样子以及它的运作方式的清晰蓝图。


    为了逃离一个被战争、贫困和气候变化破坏的世界，小说设定在 2045 年的人们转向了 `OASIS`。这是一个大型多人在线模拟游戏（MMOSG），它有自己的虚拟世界（和货币），人们可以在那里与其他玩家互动、访问不同的地点、玩游戏甚至购物，以从现实世界的恐怖中寻找避难所。在。在
    `OASIS` 中，每个人和每件事都是可能的；只有人类的想象力限制限制了所谓的“现实”，每个人都可以成为他们想成为的任何人。如果你觉得这一切太复杂了，也可以观看
    2018 年史蒂芬·斯皮尔伯格执导的电影版。它为小说中的元宇宙提供了一个很好的视角。


    Facebook 正在全力建立 `Facebook Horizon` 的途中，这是 `OASIS` 的现实世界对应物，将在不久后可用。要访问这个虚拟环境，你需要
    `Oculus Rift` 或 `Oculus Quest 2` 头设备。在这个巨大的数字世界中，用户可以以多种方式探索、游戏、创造并与其他玩家互动。


    ### 2. 《堡垒之夜》中的演唱会。


    起初一个简单的游戏很快发展变成了复杂得多的东西，并能够提供更广泛的情感和感受。《堡垒之夜》中的玩家有能力构建自己的世界并进行冒险。他们将能够与其他 `堡垒之夜`
    玩家竞争。由于游戏具有跨平台功能，用户可以在 `Xbox 360`、`PC`、`PlayStation` 和手机上访问并玩游戏。


    近年来，《堡垒之夜》已发展不仅仅是一个游戏，人们可以在其中社交并参加演唱会。特拉维斯·斯科（Travis Scott）、亚莉娜·格兰德（Ariana Grande）和马士麦（Marshello）是曾在表演的艺术家。通过引入来自全球艺术家的
    `Soundwave`，由 `Epic Games` 开发的游戏增加了筹码。`Series` 为玩家提供了游戏内的互动活动。


    ## 在元宇宙中，有游戏和社交网络。


    ### 1. 第二人生 - 一个人们可以在其中互动的虚拟世界。


    被称为 `Second Life`，它是一个用户可以在其中创建数字化身并探索的在线环境。他们还可以与其他交流并使用林德币（Linden Dollars）出售物品和服务。


    `Second Life` 最初于 2003 年推出，它是元宇宙的前身，用户可以在其中与他人以及数字世界互动。这项服务自 2000 年代后期一直可用，使用户能够发现并探索元宇宙的可能性。


    ### 2. Sandbox。


    Sandbox 是一个虚拟元宇宙，在其中个人可以在类似于现实生活的环境中构建和游戏。它还允许用户控制并从他们的游戏体验中获利。Sandbox 元宇宙中的土地和资产可以使用非同质化代币（通常被称为
    `NFT`）进行购买和交易。


    `NFT` 是区块链上创建的虚拟代币，可以兑换为货币。因此，它们是独特的、不可分割且不可转换的，使你能够在纯数字层面拥有你的游戏资产。


    这表明数字货币在元宇宙中越来越接受。数字未来将使我们能够以今天无法想象的方式感知、利用定义货币。


    ### 3. Illuvium。


    `Illuvium` 是一款将于 2022 年发布的开放世界角色扮演游戏，据称构建在以太坊区块链上。Illuvials` 是神一般的实体，可以保存在 `Shards`
    中，玩家可以在这个游戏的区域内猎捕并捕捉它们。在 `Illuvium` 中，玩家主要关注收集 `NFTs`，它们代表每个 `Illuvial`。此外，你还可以在第三方
    `NFT` 市场上转售游戏内物品。


    增强现实。


