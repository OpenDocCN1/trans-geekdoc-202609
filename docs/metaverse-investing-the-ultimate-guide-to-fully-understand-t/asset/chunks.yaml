    # 标准、协议以及这些规范的采用


    我们今天所知的互联网是通过用于视觉显示、通信、图形、文件加载、数据以及许多功能的标准和协议实现的。其涵盖的产品范围跨越了从知名到冷门的公司的任何实体。此外，`WebSocket`
    协议几乎支持浏览器与互联网上其他服务器之间的各种实时通信，被分配给了 `GIF` 文件类型。


    在元宇宙中，S&Ps（标准与协议）将需要比现在更广泛、更复杂且更健壮。由于互操作性和实时同步体验至关重要，我们必须修剪一些现有的标准，并针对每个功能围绕较小的标准集进行“标准化”——例如，今天的图像文件格式包括
    `.GIF`、`.JPEG`（及其变体）、`.PNG`（及其变体）、`.BMP`（及其变体）、`TIFF`（及其变体）以及 `WEBP`（及其变体）。尽管今天的网页构建在开放标准之上，但其本质上大部分是封闭且专有的。Amazon、Facebook
    和 Google 使用了类似的技术 set；但它们的设计初衷并非以相同的方式共同工作，就像福特的轮子设计并不是为了适配通用汽车的车架一样。此外，许多组织坚决避免将其系统与其他链接或与其交换数据。然而，尽管此类活动可能会增加“数字经济”的总价值，但它们也会损害与之相关的极高网络效应，使人们更容易将他们的数字生活转移到他处。


    这将项非常艰巨且耗时的任务。元宇宙的价值和互操作性越高，要在数据安全、数据持久性、前向兼容的代码演进以及交易功能等问题上获得行业内的共识就越困难。因此，除了我们现在正在应对的许多其他挑战的现有规则外，还需要针对审查、通信控制、监管执法、税收报告以及防止在线激进化的新规定。


    元宇宙的标准不会预先创建，这与涉及面对面讨论、谈判和争论的传统标准制定方法不同。与相当混乱且更具有机性的标准过程不同，标准过程中的会议和观点是根据情况改变的。


    ## 模拟城市（SimCity）模型


    将 `SimCity` 视为游戏性方面的元宇宙等效物。为了获得最佳效果，“市长”（即玩家）会在从零开始构建之前，先设计好他们的特大都市。然而，你不能像在现实生活中一样，在游戏中直接“建造”一个拥有
    1000 万人口的城市。你从专注于一个小镇开始，并对其进行优化以实现最大效率（例如道路的位置、学校、公用事业容量等）。随着城镇扩张，建设会在城镇到处进行，有些“旧”部分会被拆除，并在偶尔建造新部分，但只有在发生问题（如停电）或悲剧（火灾）时才会这样做。然而，与
    `SimCity` 不同，会有许多市长而不是只有一个，他们的欲望和动机会经常相互碰撞。


    我们并不确切元宇宙将需要什么，更不用说当前的标准将如何、何时或通过何种应用程序和组织传输到新环境中。因此，分析元宇宙如何增长，而非仅仅分析它所遵循的技术标准，对于使其生效至关重要。


    ## “入场”体验式学习


    正如元宇宙标准无法被“宣布”一样，消费者和公司不会仅仅因为某个原型元宇宙被提供就接受它。


    看看生活的现实吧。为了吸引一个客户或一家公司，没有必要建造一个足够容纳十万个人或百家企业的商场。当现有的基础设施和活动不足以满足当前的民用或商业需求时，“城镇广场”就会围绕它们有机增长。最后但同样重要的是，任何活动区域——无论是酒吧、地下室、公园、博物馆还是游乐园——人们频繁光顾主要是因为那里已有的人或物，而不是因为其本身就是一个目标。


    在数字交互方面，情况也是如此。`Facebook` 作为全球最大的社交网络，之所以如此成功，并不是因为它宣布自己是一个“社交网络”，而是因为它最初只是一个校园外貌打分网站，成长为一个数字毕业纪念，并最终变成带有消息功能的照片分享信息服务。元宇宙与
    `Facebook` 类似，必须被“填充”，而不仅仅是“人口”，而且这些人口必须用可以做的活动和要消费的物品填充这个数字环境中的空间，而不是简单的“入住”。


    从这些角度考虑时，认为 `Fortnite` 是一个视频游戏或互动体验的想法是过于局限且仓促的。`Fortnite` 起是一个视频游戏，但它迅速演变成一个拥有数百万粉丝的社交媒体平台。从
    1970 年到 2010 年，青少年们放学回家后每天都会打三个小时电话。他们现在正在和朋友谈论 `Fortnite`，而不是谈论 `Fortnite` 本身。相反，他们谈论的是其他事情，如学校、电影、体育、新闻、男女等等。事实上，`Fortnite`
    并没有叙事或 IP；相反，故事情专注于岛屿上发生的事情以及在那里体验这一切的人。


    此外，`Fortnite` 正迅速成为其他企业、知识产权和故事通过游戏和叙事来表达自己的平台。其中最著名的是去年 Marshmello 的现场表演。然而，在期间，类似的案例呈爆炸式增长。在
    2019 年 12 月一次较大的游戏内互动活动中（其中包括对导演 J.J. Abrams 的现场动采访），《星球大战：天崛起》发布了备受期待的电影片段，该片段只能通过游戏的
    `Fortnite` 模式访问。此外，这一发生在电影的片头序列中被明确提到。Weezer 建立了一个独特的岛屿，粉丝可以在其他人之前先试听他们的新专辑（同时与其他“玩家”跳舞）。此外，`Fortnite`
    还根据热门品牌开发了许多主题“限时模式”，如耐克的 `Air Jordan` 和 Lionsgate 的《约翰·维克》电影系列。有时，这些“LTMs”会将
    `Fortnite` 地图的一个区域变成一个微虚拟世界，访问时会改变游戏的视觉效果、物品和游戏风格，以模仿另一个游戏的外观和游戏玩法。这些设置中的一些包括《无主之地》的世界、哥谭市（Gotham）、蝙蝠侠的家乡，以及旧西部。


    因此，`Fortnite` 是少数几个可以让漫威和 DC 的 IP 出现在同一个游戏中的地方。在哥谭市，你完全可以装扮成漫威角色，并与那些穿着联盟合法授权的
    NFL 球衣的人聊天。这在历史上是第一次出现此类情况。然而，这对元宇宙的发展将至关重要。


    '
