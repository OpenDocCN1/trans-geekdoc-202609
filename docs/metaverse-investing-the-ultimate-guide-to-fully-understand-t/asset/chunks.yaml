    根据中国社会科学院信息化与网络经济研究办公室副主任、中国社会科学院信息化研究中心秘书长左鹏飞的说法，我们距离元宇宙基础场景的实现大约还有 10 到 20 年。在我们的生活以及社会经济发展的五个领域，元宇宙将产生重大影响：通过技术创新和协作模式提高社会生产效率；催生大量新技术、格式和模型，并推动传承；促进文化创意产业的跨界演变，这对信息消费具有重大影响；由于大部分工作和生活将在虚拟世界中进行，重构工作生活方式；以及推动智慧城市和创新的社会治理模式，这些对信息消费具有重大影响。


    # 第四章：元宇宙现状概述


    由于描述元宇宙需要对现状进行描述，因此在没有定义现状的情况下定义未来是不可能的。本质上是虚拟世界的大在线游戏（MMOs）、以及数字演唱会、在线化身、与全球各地的人视频通话以及商业平台，都已以各种方式向公众开放。因此，它们必须具有某种原创性，才能作为一种观察世界的新方式进行宣传。如果你谈论元宇宙的时间足够长，几乎肯定会提到一些虚构作品，例如被认为创造了“元宇宙”一词的《雪崩》，或者描绘了一个每个人都在其中工作、购物和娱乐的虚拟现实环境的《头号玩家》。当结合更广泛的流行文化概念——全息和抬头显示（基本上是钢铁侠在前十部电影中使用过的所有设备）时，这些故事为元宇宙提供了一个创意参考点——一个科技公司可能为我们提供新颖有趣事物的元宇宙。


    它和其他任何形式的恐惧体验一样，都是元宇宙的一部分。但 `NFTs`（非同质化代币）的支持者——在某种上充当数字物品所有权证明的加密令牌——对元宇宙的概念感到兴奋，也不为奇。是的，`NFTs`
    对环境有害的，但如果这些令牌可以被视为你 `Roblox` 虚拟房屋的数字钥匙，那么它们就是非常值得。你刚刚将收集表情包的爱好变成了互联网骨干的关键组成部分。恭喜你！（可能还增加了你拥的所有加密货币的价值。）虽然将今天的原始元宇宙概念与早期互联网进行类比，并认为一切都将以线性方式演变和扩展是非常诱人的，但事实未必如此。并不是每个人都想坐在没有腿的虚拟办公桌前，或者与梦工厂执行官马克·扎克伯格玩扑克，更不用说相信
    `AR` 和 `VR` 技术在未来将像智能手机和电脑一样普及。


    如果存在真正的“元宇宙”，可以想象它将主要由迷人的虚拟现实游戏和 `Zoom` 会话中的数字化身组成，而不是主要由我们现在认为的互联网组成。


    ## 在元宇宙中赚钱是一个简单的概念。


    大量的资金正被投入新技术，导致其正逐渐失控。新一代艺术家和小型公司正被誉为现代的先驱。


    如果你不了解某个主题的所有知识，是可以被原谅的。存在一个平行世界，可以在那里看到我所描述的现象。


    ## 元宇宙的本质


    “元宇宙”是我们物理生活和数字生活的融合，这种融合是由网络连接、增强现实/虚拟现实以及区块链技术的进步所推动的。它是我们所有科幻幻想的结晶——《幻城》和《头号玩家》等电影所构想的，但实际上今天正在发生。如果这听起来很有吸引力，那么个人在该领域进行巨额投资以追求梦想也不为奇。非同质化代币已被指定为元宇宙的货币，已获得约
    4 亿美元的投资（或 `NFT`）。根据上述统计数据和信息，每月有 4000 万美元易手，历史上最贵的 `NFT` 交易都发生在最近几个月内。上周，佳士得使用
    `NFT` 平台拍卖了一件 `Beeple` 的数字艺术品，价格超过 6900 万美元。


    许多人无法用任何传统衡量 `Upland`，这是可以理解的。它不仅仅是一个虚拟游戏，而且是一种社区体验，这引发了一个问题：为什么成千上万的人愿意拿出辛苦赚来的钱参与其中？一种解释是因为它太稀有了。


    ## 案例研究：Upland


    `Upland` 是一个使用真实地图的虚拟房地产市场，是一个去中心化应用 (`dApp`)，允许用户购买、出售和交易虚拟房地产。例如，为了找出谁拥有帝国大大厦或纽约证券交易所，你可能去纽约市的
    `Upland` 社区。如果你有足够的游戏币，如果你有足够的游戏货币，你甚至可以自己竞标。


    光是这个概念本身就是有趣的。然而，正是 `Upland` 游戏内经济的运作方式使其区别于简单的玩具。为了开始投资原生加密货币 `UPX`，玩家必须先使用法币获得他们的第一套房屋。随着
    `Upland` 变得越来越，由于需求的增加，这些房屋的市场价值将不可避免地上升。虚拟房东有选择保留资金，也可以将其兑换为法币。


    尽管 `Upland` 的房屋是虚拟的，但它们是非常真实的投资。以纽约证券交易所为例。与其他 `Upland` 资产相比，该交易所似乎具有合理的 `UPX`
    潜力，不是吗？但是，它值 2.3 万美元的购买吗？那是它去年 12 月成交的价格。它在过去几年里变得越来越有用。

