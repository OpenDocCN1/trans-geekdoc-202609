  \n## 第四部分\n\n## 云安全\n\n![Images](img/chap1.jpg)\n\n章节\n\n10 安全与云安全\n\n11 云风险管理\n\
  \n## 第 10 章\n\n## 安全与云安全\n\n![Images](img/chap1.jpg)\n\n认证目标\n\n10.01 机密性\n10.02\
  \ 完整性与消息认证\n10.03 可用性\n10.04 身份与访问管理\n\n![Images](img/tick.jpg) 两分钟演练\n\n**问答**\
  \ 自测\n\n* * *\n\n构建所有 IT 安全解决方案的三大支柱是机密性、完整性和可用性，统称为 CIA 三要素。组织角色如首席信息官（`CIO`）和首席信息安全官（`CISO`）对如何确保任何云解决方案的\
  \ CIA 非常感兴趣，因此你需要准备应对他们的关注。\n\n每个 IT 安全解决方案旨在增强一个或多个 CIA 支柱。这是通过安全控制实现的。安全控制应对安全弱点，例如通过加密保护静态数据。本章首先关注加密等方法如何确保云资产的机密性。接下来你将看到哈希和数字签名如何提供数据完整性保障。\n\
  \n然后，你将学习 IT 系统和数据的可用性是云的重要方面。最后，本章将检查如何使用云身份进行身份验证并授权。\n\n##### 认证目标 10.01\n\n\
  ### 机密性\n\n保护本地和云 IT 系统及数据的一种常见方法是向用户、设备和软件组件发布公钥基础设施（`PKI`）证书。这些证书包含公密钥对，可以存储在文件中或智能卡中。公钥可以公开公开，但私钥必须安全存储并仅供所有者使用。图\
  \ 10-1 显示了在 Azure 密钥库中创建 PKI 证书的过程。PKI 证书使用的常用用例包括：\n\n**图 10-1** 在 Azure 密钥库中创建\
  \ PKI 证书\n\n![Images](img/f0193-01.jpg)\n\n![Images](img/square-1.jpg) 文件和磁盘卷加密\n\
  \n![Images](img/square-1.jpg) 网络传输加密\n\n![Images](img/square-1.jpg) 客户端 VPN 身份验证\n\
  \n#### 加密\n\n\n加密数年来一直被用于保护敏感数据。在数字时代，原始数据（或 `plain text`（明文）连同加密密钥一起输入加密算法。生成的数据是经过加密的，被称为\
  \ `ciphertext`（密文）。可以将加密算法想象成复杂的数学公式，而密钥就是通解决方案的数学捷径。只有拥有相应解密密钥的人才能解密数据——换句话说，将密文还原为原始的\
  \ `plain text`。\n\n密钥的大小以二进制位（0 和 1）为单位。在适当实现的情况下，密钥的位数越多，破解就越困难。图 10-2 显示了在 Microsoft\
  \ Azure 中创建 2048 位的 RSA 密钥。此密钥可用于其他可能性来加密 VM。取决于实现方式，可以使用对称、非对称或这两种密钥。\n\n**图 10-2**\
  \ 在 Microsoft Azure 中创建加密密钥\n\n![Images](img/f194-01.jpg)\n![Images](img/exam.jpg)\n\
  \n存储在云端的数据并不一定需要 PKI 证书。可以使用云提供商或客户提供的单一加密密钥。大多数公云提供商默认启用了加密。\n\n## 对称加密\n\n对称加密使用单一密钥（也称为\
  \ `secret key`（密钥））进行加密和解密。这种方法的问题（特别是在具有大量用户的 Internet 上）是**安全地传输密钥。使用预共享密钥（PSK）来保护\
  \ Wi-Fi 网络是密钥使用的一个示例。可以使用对称密钥加密存储在云端的数据或移动设备存储。RC4、Blowfish 和高级加密标准（AES）都是对称加密的示例。\n\
  \n## 非对称加密\n\n非对称加密使用两个数学相关的密钥——公钥和私钥。这些公/私钥对发放给设备、用户或软件组件，用于文件、磁盘卷或网络传输的安全。\n\n\
  加密网络传输需要接收者的公钥。接收者随后使用私钥解密传输，从而暴露唯一的会话密钥。如图 10-3\n\n1. Web 浏览器发送支持的加密列表。\n2. Web\
  \ 服务器发送将使用的加密算法以及其 PKI 证书公钥。\n3. Web 浏览器生成唯一的（对称）密钥，使用服务器公钥加密并发送到服务器。\n   服务器使用其私钥解密消息，从而暴露会话密钥。\n\
  4. 客户端和服务器使用唯一的会话密钥加密和解密消息。\n\n### 传输层安全\n\n保护 Web 应用访问通常通过配置超文本传输协议（HTTPS）来实现。例如，可以配置\
  \ Web 服务器使用加密和解密密钥的 PKI 证书。然后配置客户端和服务器使用传输层安全（TLS）等网络安全协议，它取代了过时的套字层（SSL）。由于 SSL\
  \ 的许多安全漏洞，不应使用 SSL HTTPS。\n\n使用 TLS 代替 SSL 是加固 Web 应用的一种方法。通过配置 Web 浏览器设置和 Web 服务器设置（如图\
  \ 10-4\n\nCLO-002 考试中经常会有询问“最佳”解决方案的问题。使用 TLS 始终比使用 SSL 安全网络通信更好。\n\n**图 10-4**\
  \ Microsoft Azure Web 应用的 TLS 设置\n\n![Images](img/f196-01.jpg)\n![Images](img/onjob.jpg)\n\
  \n**美国政府机构对云计算的安全使用受联邦风险授权管理计划（FedRAMP）的约束。要求之一是使用 1.1 或更高版本的 TLS，但尽可能使用最新版本的 TLS（1.3\
  \ 版本）是最安全的。**\n\n## 认证目标 10.02\n\n### 数据完整性和消息认证\n\n加密算法和密钥可确保数据的完整性——即数据未被篡改——这在考虑法律证据的认可性时至关重要。认证也可用于确保网络传输来自其声称的来源，以防止身份攻击。接下来的章节将演示哈希如何与数据完整性相关以及消息认证如何工作。\n\
  \n### 哈希\n\n哈希将文件系统对象或网络传输等数据输入单向加密算法，产生称为 `hash`（哈希）或 `message digest`（消息摘要）的唯一值。如果数据没有发生任何方式的修改，将来生成的哈希将产生完全相同的哈希值，因此确保了数据的有效性。如果数据发生了变化（即使是通过数据损坏），新生成的哈希将与原始哈希不。\n\
  \n常见的哈希算法包括 MD5 和较新的 SHA-256。图 10-5\n\n哈希可用于跟踪文件修改，并广泛用于数字取证证据收集，以确保数字证据未被篡改。\n\n\
  ### 数字签名\n\n当需要证明数据未被修改且其来自其声称的来源（或对象）时，数字签名被广泛使用。基本上，数字签名关乎信任。\n\n正如本章前面提到的，公钥和私钥都可以存储在\
  \ PKI 证书中。除了用于解密，私钥还用于创建数字签名。只有数学相关的公钥可验证签名。数字签名通常用于电子邮件或文档管理等云 SaaS 应用。\n\n## 认证目标\
  \ 10.03\n\n#### 可用性\n\n你可能好奇可用性与安全有什么关系。考虑一种拒绝服务（DoS）攻击，它使 IT 系统对合法用户不可，例如通过向网络注入无效流量。如果恶意攻击者利用多个主机来执行攻击，则被称为分布式拒绝服务（DDoS）攻击。网络上可能重要的\
  \ IT 服务将无法访问。因此，业务关键 IT 系统和数据必须经过配置和保护以实现高可用，这可能包括使用入侵防御系统（IPS）来检测并拦截可疑流量。云服务的服务水平协议（SLA）提供了有关预期运行时间和可用性的详情（如第\
  \ 2 章 硬件冗余（电源、网络、磁盘）\n\n![Images](img/square-1.jpg) 网络连接冗余（到云端的多个 Internet 连接）\n\
  \n![Images](img/square-1.jpg) 应用可达性（负载均衡和集群）\n\n\n\n\n![Images](img/square-1.jpg)\
  \ 虚拟机可用性（复制到次级地理区域，也称为*地冗余*）\n\n![Images](img/square-1.jpg) 频繁的数据备份（以确保足够的数据恢复能力）\n\
  \n## 认证目标 10.04\n\n### 身份与访问管理\n\n用户、设备和软件均被视为*安全主体*，这意味着可以根据它们的身份为它们分配访问资源的权限，这被称为*身份与访问管理*\
  \ (*IAM*）。示例包括：\n\n![Images](img/square-1.jpg) 被授予访问云应用程序权限的云用户账户\n\n![Images](img/square-1.jpg)\
  \ 被授予访问后端数据库权限的云托管 Web 应用程序\n\n![Images](img/square-1.jpg) 被授予连接网络权限的注册设备\n\n图 10-6\
  \ 显示了 Microsoft Azure Active Directory 中云用户账户的示例。\n\n**图 10-6** Microsoft Azure\
  \ Active Directory 用户帐户列表\n\n![Images](img/f0199-01.jpg)\n\n身份提供者存储安全主体的凭据。后续章节描述了单登录和多因素认证如何与安全主体相关。\n\
  \n### 身份提供者\n\n安全主体由身份提供者（IP）创建和管理。IP 的示例包括本地 Microsoft Active Directory Domain\
  \ Services 安装，以及基于云的 Microsoft Azure Active Directory、Google Cloud Directory 和 Amazon\
  \ Web Services Directory Service。\n\n本地和云端 IP 可以进行同步，以便用户可以使用现有的本地凭据访问本地和云应用程序。云应用程序也可以配置为使用基于\
  \ Internet 的 IP；使用集中的 IP 被称为*身份联合*。这种做法的好处是，当跨越许多不同提供者（包括组织之间）访问应用程序时，不需要用户身份的多副本。\n\
  \n### 单登录\n\n顾名名，*单登录 (SSO)* 是一项 IAM 功能，启用后用户在每次访问应用程序时无需输入凭据。SSO 在两个级别进行配置：身份提供者和应用程序。应用程序配置为信任\
  \ IP。许多 SSO 实现的另一个很棒的是，IP 会发放一个用其私钥签名的数字安全令牌，该令牌代表通过验证的用户。这意味着实际的用户凭据不会发送到每个应用程序。相反，应用程序可以使用\
  \ IP 的公钥验证数字签名令牌。\n\n#### 多因素认证\n\nIAM 系统通常要求用户通过提供以下一类或多类因素因素证明来验证身份：\n\n![Images](img/square-1.jpg)\
  \ **你所知的** 验证用户常用的方法是要求他们输入用户名和密码。\n\n![Images](img/square-1.jpg) **你的特征** 这与生物识别认证同义，形式包括指纹扫描、视网膜扫描、语音识别和其他测量独特物理特征的方法。\n\
  \n![Images](img/square-1.jpg) **你所做的** 基于手势的认证使用独特的动作来验证用户。\n\n![Images](img/square-1.jpg)\
  \ **你拥有的** 这一类需要持有认证物品，例如智能卡或显示用于认证的唯一数字代码硬件令牌设备。\n\n仅依赖这些类别中某一类的 IAM 系统使用*单因素认证*。例如，虽然用户名和密码是用户通过验证时必须提供的两个独立项目，但这两个项目都属于“你所知的”类别，因此构成单一因素。结合多种认证因素类别的系统提供多因素认证\
  \ (MFA)。例如，要求云用户通过用户名和密码进行身份验证，并结合发送到手机设备的 PIN 码即构成了 MFA。图 10-7 显示了如何为选定的用户启用 MFA。\n\
  \n**图 10-7** Microsoft Azure Active Directory 用户 MFA 配置\n\n![Images](img/f0200-01.jpg)\n\
  \n成功验证并不意味着用户对云资源具有无限访问权限。通过的用户只能访问其授权访问的云资源。云技术人员可以为云资源添加标签（tags），将项目（例如）分类为公共、私有或敏感。标签可以手动应用，也可以通过自动添加默认标签的云策略应用。策略可以适用于所有云资源或资源的子集。然后根据资源标记应用权限；例如，只有特定组可能对任何标记为机密的资源具有读写权限，而每个人都可以对标记为公共的资源具有读取权限。\n\
  \n### 练习 10-1\n\n#### 检查虚拟机磁盘加密符合性\n\n在此练习中，你将使用 Microsoft Azure 策略识别使用未加密虚拟磁盘的虚拟机。此练习取决于已完成练习\
