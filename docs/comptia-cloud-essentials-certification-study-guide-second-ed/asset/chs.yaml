  \n### 考试内部\n#### 虚拟机监控与虚拟化\n\n虽然没有列在官方考试目标中，但 CompTIA Cloud Essentials+ CLO-002\
  \ 考试要求你熟悉与云计算相关的虚拟机监控和虚拟化。\n\n`hypervisor`（虚拟机监控）是一种可以托管多个运行中的虚拟机的计算机（这是虚拟化的类型），也被称为\
  \ `guests`（虚拟机）。它通过运行虚拟化软件来实现。`hypervisor` 的目的是管理运行的虚拟机之间的物理硬件资源访问。\n\n云计算依赖于虚拟化，但虚拟化并不依赖于云计算。仅仅因为你正在使用虚拟化，并不意味着你拥有一个“云”。记住，只有当在本章开头讨论的六个特性（弹性、可扩展性等）到位时，云计算才存在。\n\
  \n虽然 `hypervisor` 本身可以在 `VM` 中运行，但这仅用于测试目的，不适用于生产环境。常见的虚拟机监控有两类：\n\n![Images](img/square-1.jpg)\
  \ **第 1 型虚拟机监控** 也称为 `bare metal`（裸金属）虚拟机监控，这种软件设计为直接在物理服务器硬件上运行。`hypervisor` 是操作系统，因此不需要操作系统。\n\
  \n![Images](img/square-1.jpg) **第 2 型虚拟机监控** 这种软件运行在现有的操作系统之上。\n\n### 两分钟训练\n####\
  \ 识别云计算\n- **弹性**：允许云资源的快速配置和取消配置。\n- **可扩展性**：云服务的设计能够增加或减少虚拟机 CPU 和内存（垂直扩展），或添加或删除虚拟机（水平扩展）。\n\
  - **自服务**：云用户可以使用 GUI、命令行工具或通过 API 调用程序化地配置和取消配置云资源。\n- **广域访问**：允许多种设备通过网络访问云服务。\n\
  - **按需付费**：消费者仅为他们使用的云资源付费。\n- **可用性**：确保基于云的系统和数据始终可用。云 `SLA` 提供可用性保证。\n\n####\
  \ 识别服务模型\n- **软件即服务 (SaaS)**：通过网络访问和使用的云解决方案租赁。\n- **基础设施即服务 (IaaS)**：支持云软件解决方案的底层存储、网络和虚拟机。\n\
  - **平台即服务 (PaaS)**：托管数据库和开发者云服务，不需要云用户配置底层支持基础设施。\n\n#### 识别云部署模型\n- **公有云**：由 `CSP`\
  \ 所有和管理。任何接入互联网的人都可以使用云服务。\n- **私有云**：由单一组织所有、管理和使用。\n- **混合云**：由本地网络连接云虚拟网络组成。\n\
  - **社区云**：针对具有相同计算需求的组织，通常位于同一行业内。\n\n#### 认证总结\n本章作为云计算的介绍。你已经接触了弹性、可扩展性、自服务、广域访问、按需付费和可用性等特性。此外，你还学习了服务模型，如软件即服务\
  \ (SaaS)、基础设施即服务 (IaaS) 和平台即服务 (PaaS)，以及部署模型如公有云、私有云和混合云。你还学习了第 1 型和第 2 型虚拟机监控，以及管理云资源的责任有时由\
  \ `CSP` 承担，有时由云租户承担。\n\n\n\n\n\n![Images](img/box1.jpg) 使用 `SaaS` 时，设置和数据的管理由云客户负责。`CSP`\
  \ 负责管理支持软件解决方案的底层基础设施。\n\n![Images](img/box1.jpg) 使用 `IaaS` 时，云客户负责存储、网络配置和虚拟机的所有管理工作。`CSP`\
  \ 负责底层硬件，包括路由器、交换机、存储阵列和物理服务器。\n\n![Images](img/box1.jpg) 使用 `PaaS` 时，云客户负责 `PaaS`\
  \ 解决方案的细节，例如数据库设置和数据。`CSP` 负责底层基础设施，如支持 `PaaS` 解决方案的存储和虚拟机。\n\n### ![Images](img/qs.jpg)\
