  \ 也称为大规模计算和并行处理。\n![Images](img/box1.jpg) `HPC` 使用一组协同工作的虚拟机节点来处理复杂作业。\n![Images](img/box1.jpg)\
  \ `HPC` 集群头节点接收指令并在工作节点之间进行协调。\n\n### 自测\n![Images](img/qs.jpg) 以下问题将帮助你衡量对本章内容的理解程度。如所示，某些问题可能有多个正确答案，请务必仔细阅读所有选项。\n\
  \n#### 云中的虚拟化\n**1** 哪个术语描述运行客户机的宿主机？\nA. `Virtualizor`\nB. `Scale set`\nC. `Cluster`\n\
  D. `Hypervisor`\n\n**2** 哪种虚拟化解决方案从中央虚拟主机提供用户桌面？\nA. `SDN`\nB. `CDN`\nC. `VDI`\n\
  D. `VLAN`\n\n**3** 哪种类型的虚拟机程序也称为裸金属虚拟机程序？\nA. `Type 1`\nB. `Type 2`\nC. `Type 3`\n\
