  \ 考试考点：大数据\n\nCompTIA Cloud Essentials+ CLO-002 考试可能会向你提出与为各种数据源集成集成数据以进行大数据分析集群相关的问题。如果数据源存在于本地，可能需要网络服务质量（QoS）来确保数据及时传输到云端。例如，来自特定本地主机的\
  \ HTTPS 流量可以优先于标准的由 Web 浏览器生成的 HTTP 流量发送到云组件。如果本地数据源不断更新（例如通过 IoT 设备统计数据），这一点尤为真实。\n\
  \n### 认证总结\n\n本章让您接触了面向服务的架构（SOA）的概念，在那种架构中服务是一个小型计算机程序。接下来，重点转向了微服务，它为云端提供了模块化的软件开发方法；每个微服务都有特定功能，并且可以独立于其他微服务进行更新、测试和扩展。模块化的软件方法适用于松耦合，即一个微服务可以通过消息队列向第二个微服务传递消息。这意味着相互通信的微服务不需要同时运行。\n\
  \n您还学习了内容管理系统（CMS）允许人们在无需了解网站操作技术细节或编写代码的情况下创建和管理网站内容。CMS 还可以自动化，以检索源数据更改并更新网站内容。\n\
  \n接下来，您看到了区块链如何提供一个受信任的、去中心化的公共交易账本，存储在数百万台计算机上。区块链每十分钟更新一次新交易，区块链节点（矿工）已对新交易的有效性达成共识。区块链*区块*包含日期时间戳信息、交易财务细节、当前区块的唯一哈希值以及链中上一个区块的唯一哈希值。*加密货币*是指区块链技术的数字资产，例如比特币。云客户可以在云中部署自定义的区块链技术供私有企业使用。\n\
  \n\n\n\n\n随后你学习到应用容器是镜像的运行时实例，为应用程序文件和设置提供了逻辑边界。每个微服务都可以部署在它自己的容器中。容器启动非常快，因为它们依赖于底层的主机操作系统，而且与虚拟机不同，它们不需要启动整个操作系统——操作系统已经在运行了！\n\
  \n最后，你学习到机器学习（ML）是人工智能（AI）的一种实现，它能够处理海量数据（大数据）并做出智能预测或决策，例如某人是否存在信用风险，或者某特定股票在下季度是否表现良好。\n\
