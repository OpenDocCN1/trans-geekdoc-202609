  \n![Images](img/square-1.jpg) “最可能是……”\n\n### 考试备考\n\n准备考试的最佳方法是制定一个学习计划并坚持下去。虽然老师们可能可能再再地告诉你不要临时阵击，但某些信息就是无法留在记忆中。你希望在参加考试之前进行复习。\n\
  \n### 注册考试\n\n注册 CompTIA Cloud Essentials+ CLO-002 考试需要你提供两种形式的身份证明，其中一种必须带有你的照片。\n\
  \n### 参加考试\n\n在准备和参加考试时，以下是需要记住的一些事项：\n\n\n\n\n\n\n\n1. 云计算的原理\n2. 云计算的业务面\n\n##\
  \ 第一章：云计算的原理\n\n\n### 认证目标\n1.01 识别云计算特征\n1.02 识别云服务模型\n1.03 识别云部署模型\n1.04 理解云共享责任制\n\
  \nCompTIA Cloud Essentials+ 考试旨在测试候选人是否了解云计算解决方案如何解决业务问题的知识。本章将向你介绍云计算概念。它定义了云计算的特征，并识别了云服务模型和云部署模型。本章还将帮助你识别在部署不同类型的云服务时责任归谁。在本章的最后，你将通过学习监控程序（hypervisors）和虚拟化在云计算中的重要作用来结束本章。\n\
  \n### 认证目标 1.01\n#### 识别云计算特征\n\n从简单的角度来看，云计算允许你在他人的设备上运行 IT 解决方案。已经存在很长时间的技术只是在网络上以不同的方式使用。但它真的那么简单吗？当然不是！如果是那样，你就不需要努力学习来获得\
  \ CompTIA Cloud Essentials+ 认证了。正如俗话所，“细节决定成败。”\n\n在互联网上，云服务提供商（CSP）也是应用服务提供商（ASP），它们提供\
  \ IT 基础设施和服务，允许在网络上使用 IT 节点。虽然 ASP 专注于应用程序，但 CSP 提供应用程序的供应以及底层基础设施的供应。云客户也被称为`云租户`（`cloud\
  \ tenants`）。云被描述为`多租户`（`multitenant`）环境，就像公寓楼容纳了多个使用相同基础设施的租户一样。CSP 将每个云租户的数据和配置设置与其他云租户隔离开。但“云”到底是什么？为了定义这个概念，我们将检查云计算实现所共有的共同特征。\n\
  \n\n你可能会看到某些考试题简单地提到（例如）CSP 而不是云服务提供商。确保你熟悉书中以及在官方官方考试目标随后的 CompTIA Cloud Essentials+\
  \ 缩写列表中的所有缩写；在考试中术语并不总是会完整写出来。\n\n#### 弹性与可扩展性\n\n为了将弹性概念化为一种云特征，想象一根有弹性的橡皮筋。当你拉它时，橡皮筋会伸伸以适应变化，当你释放压力时，它会收缩回正常大小。在云中，`elasticity`（弹性）是根据需求对资源进行动态供应和回收。示例包括：\n\
