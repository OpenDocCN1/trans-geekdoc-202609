  \n# 引言\n\n本节讨论了在准备和参加实际 CompTIA Cloud Essentials+ CLO-002 认证考试时，你可能会遇到的性质和具体细节。它为你提供了一些备考的提示，包括如何学习和注册、预期的考试格式，以及在考试当天需要做什么。本节还包含了对本书的描述，说明它是什么，以及如何使用它来确保你在自己在参加\
  \ CLO-002 考试的当天已做好就绪。\n\n### CompTIA Cloud Essentials+ 的关联\n\n那么，为什么要花宝的时间准备参加 CLO-002\
  \ 考试呢？因为大多数组织正在考虑使用云计算组件，要么正在将现有 IT 系统迁移到云端，或者正在管理现有的云计算环境。即使是不精通技术的小企业主也能从 Cloud\
  \ Essentials+ 认证中受益。\n\n获得 CompTIA Cloud Essentials+ 认证证明了你对云计算如何在遵守法律法规的同时，以成本效益的方式服务业务需求的知识。无论你已经在\
  \ IT 行业工作并寻求晋升，还是在寻找云计算顾问的工作，这都对你有帮助。\n\n### 考试结构\n\nCompTIA Cloud Essentials+ CLO-002\
  \ 是一项多选题，最多包含 75 道题，从下表列出的四个考试领域中选取。你有 60 分钟的时间完成考试。没有公布及格分数。\n\n\n记住，考试将侧重于实施的云解决方案对业务的影响。你可以预期会有许多使用如下措辞的问题：\n\
