  \ 广域网络访问涉及通过网络使用不同类型的设备访问云 IT 服务。\n\n![Images](img/times.jpg) B、C、D 是错误的。可扩展性是指长期设计的约束。弹性是对资源需求的动态响应。可用性确保云\
  \ IT 系统和数据在需要时可用，通常通过备份和 IT 系统数据冗余来解决。\n\n#### 识别云服务模型\n\n**5.** ![Images](img/tick.jpg)\
  \ 虚拟机被认为是基础设施即服务 (`IaaS`)。\n\n![Images](img/times.jpg) A、B、C 是错误的。A 和 B 错误是因为它们被认为是软件即服务\
  \ (`SaaS`)。C 错误是因为托管数据库被认为是平台即服务 (`PaaS`)。\n\n**6.** ![Images](img/tick.jpg) C。如果虚拟机手动配置了\
  \ Microsoft SQL Server 等软件，这被认为是基础设施即服务 (`IaaS`)。\n\n\n\n\n\n![Images](img/times.jpg)\
  \ **A、B、** 和 **D** 是错误的。通信即服务 (CaaS) 与即时消息等云端服务相关。平台即服务 (PaaS) 提供了如开发人员工具和数据库等服务，而无需手动配置底层基础设施。软件即服务\
  \ (SaaS) 指通过网络提供的软件解决方案，例如由云服务提供商通过互联网提供的网页电子邮件。\n\n**7.** ![Images](img/tick2.jpg)\
  \ **B.** 在云中，存储被视为基础设施即服务 (IaaS)。\n\n![Images](img/times.jpg) **A、C、** 和 **D** 是错误的。这些云服务模型中没有一个被视为\
  \ IaaS。\n\n### 识别云部署模型\n\n**8.** ![Images](img/tick2.jpg) **B** 和 **D.** 私有云由单一组织负责并使用，但仍然遵循自服务和弹性伸缩等云计算特性。\n\
  \n![Images](img/times.jpg) **A** 和 **C** 是错误的。服务可用性和静态数据安全性适用于私有云和公有云的项目。\n\n**9.**\
  \ ![Images](img/tick2.jpg) **A.** 混合云解决方案结合了本地和云端解决方案，例如通过 VPN 隧道将本地网络连接到云网络。\n\n\
  ![Images](img/times.jpg) **B、C、** 和 **D** 是错误的。私有云由单一组织负责并使用，而公有云潜在上任何人都可以通过互联网访问。“扩展型”不是一种有效的云部署模型。\n\
  \n**10.** ![Images](img/tick2.jpg) **A.** 私有云由单一组织负责并使用，而公有云潜在上任何人都可以通过互联网访问。\n\n\
  ![Images](img/times.jpg) **B、C、** 和 **D** 是错误的。私有云由单一组织拥有和使用。公有云供所有互联网用户使用。\n\n\
  ### 理解云共同责任模型\n\n**11.** ![Images](img/tick2.jpg) **B.** 在云中，*托管服务*提供解决方案（例如部署数据库），而无需处理底层虚拟机、网络和存储的配置细节。\n\
  \n![Images](img/times.jpg) **A、C、** 和 **D** 是错误的。水平扩展通过添加或删除虚拟机来支持应用程序。垂直扩展通过虚拟\
  \ CPU 数量和内存大小等项目增加或减少虚拟机的性能。基础设施即服务 (IaaS) 要求对虚拟机、存储和网络等资源进行详细的配置。\n\n**12.** ![Images](img/tick2.jpg)\
  \ **B.** 云租户是云客户，因此他们负责对手动部署的虚拟机应用更新。\n\n![Images](img/times.jpg) **A、C、** 和 **D**\
  \ 是错误的。这些实体不负责对手动部署的虚拟机应用更新。\n\n**13.** ![Images](img/tick2.jpg) **B.** 2 型虚拟机监控程序需要现有的操作系统，因为它们作为应用程序运行在操作系统中。\n\
  \n![Images](img/times.jpg) **A、C、** 和 **D** 是错误的。1 型虚拟机监控程序直接安装在硬件上；它*就是*操作系统。3\
  \ 型和 4 型是无效的虚拟机监控程序分类。\n\n**14.** ![Images](img/tick2.jpg) **C** 和 **D.** 以虚拟机形式实现的虚拟化是可能的。\n\
  \n![Images](img/times.jpg) **A** 和 **B** 是错误的。虚拟化使得云计算成为可能。云托管的虚拟机在云中运行以满足某些需求。\n\
  \n**15.** ![Images](img/tick2.jpg) **A.** 1 型虚拟机监控程序直接运行在硬件上，不需要操作系统。它们通常被称为*裸金属*监控程序。\n\
  \n![Images](img/times.jpg) **B、C、** 和 **D** 是错误的。2 型虚拟机监控程序作为应用程序运行并需要操作系统。3 型和\
  \ 4 型虚拟机监控程序不存在。\n\n## 第 2 章\n\n## 云的业务端\n\n![Images](img/chap1.jpg)\n\n认证目标\n\n\
  - 2.01 云计算的业务案例\n- 2.02 服务水平协议\n- 2.03 云成本管理\n\n![Images](img/tick.jpg)\n\n### 分钟训练\n\
  \n**问答**\n\n尽管云计算有许多优势，但并非适用于所有人，在某些情况下，数据隐私和法规限制了云计算的使用。本章将为您介绍在采用或管理云时需要考虑的因素。我们将从识别云与本地部署相同资源相比的优势开始。接下来，我们将探讨特定的服务水平协议（SLA）及其与系统可用性的关系。最后，我们将讨论云成本。\n\
  \n### 认证目标 2.01\n\n#### 云计算的业务案例\n\n云计算已变得非常流行。个人和组织受益于使用他人设备运行的服务，只需支付较小的费用——与在自己的设施中运行相比。但成本实际上不仅仅是费用。例如，服务的部署是否更高效？客户服务是否得到了改进？回答这些问题被称为*价值证明\
  \ (PoV)*。\n\n云采用始于将可用云服务映射到需求，并进行概念验证（PoC）试点以确保所选服务符合预期。这包括软件开发人员在云中使用自动化测试进行质量保证（QA），或使用云端共享文件夹来解决访问需求。与其手动配置虚拟机和数据库等资源，云用户还可以使用模板（本质上是蓝图）来快速创建甚至管理资源。\n\
  \n#### 持续运营支出 (OPEX)\n\n正如第 1 章所示，随用随付费的云计算特性代表了大多数云计算定价模型仅根据客户使用的资源收费。这种持续的每月变量支出被称为*运营支出\
  \ (OPEX)*。\n\n![Images](img/onjob.jpg)\n\n**当涉及到仅为使用的资源付费时，你可能会听到其他 IT 技术人员使用*计量计费*一词。在云计算特性的背景下，这与*随用随付费*同义。**\n\
  \n一个使用自己的硬件、软件和许可证在本地部署 IT 服务的组织将产生更大的预付固定成本，这被称为*资本支出 (CAPEX)*。这并不意味着云计算成本总是比本地计算成本便宜；许多因素都会影响投资回报率（ROI）分析，例如上市时间的缩短，这可以在其他领域节省资金并为组织提供竞争优势。为了说明这一点，请考虑以下示例：\n\
  \n\n\n\n\n您的公司需要一个后端数据库服务器来处理面向公众网站的客户交易。以下是本地部署服务器步骤与通过云端部署服务器步骤的对比：\n\n![Images](img/f0027-01.jpg)\n\
  \n显然，云端部署方案所需的工作更少，并允许技术人员专注于业务问题，而不是底层技术。在向管理层汇报时使用此类对比，可以为云计算提供非常有力的业务理由，并且随着时间的推移，可以降低\
  \ IT 解决方案的总体成本（`TCO`）。\n\n![Images](img/exam.jpg)\n\n**你可能会遇到关于 OPEX（运营支出）和 CAPEX（资本支出）的测试。请记住，OPEX\
  \ 并不并不意味着 IT 成本低于 CAPEX；这取决于具体的 IT 解决方案以及该解决方案的使用时长。**\n\n## 信息技术基础设施库 (ITIL) 与云端\n\
  \nITIL 原本是 Information Technology Infrastructure Library（信息技术基础设施库）的缩写——在《Cloud\
  \ Essentials+ 缩写列表中仍然如此标识——但其所有者 `AXELOS` 在五多年前已将框架的正式名称更改为 `ITIL`。\n\n简而言之，`ITIL`\
  \ 是一个 IT 服务框架，其目标是尽可能高效且具有成本效益地提供 IT 服务。该框架与云计算的特性（如自服务置备）相关，并通过为管理云服务的技术人员（人力资本）提供适当培训来促进其职业发展。从云端技术人员到云端终端用户，该框架完全关乎于\
  \ IT 服务管理的持续改进。\n\n假设您的组织希望在云端运行重要的 IT 服务，例如：\n\n![Images](img/square-1.jpg) 客户关系管理\
  \ (`CRM`）\n\n![Images](img/square-1.jpg) 企业资源规划 (`ERP`）\n\n![Images](img/square-1.jpg)\
  \ 数字营销活动，包括电子邮件活动\n\n![Images](img/square-1.jpg) 社交媒体动态分析\n\n`ITIL` 的一部分涉及供应商管理。在这种情况下，云服务提供商（`CSP`）是供应商，您的组织必须妥善确保这些列出的项目在时间的推移中能够以合理的成本从\
  \ `CSP` 处获得。使用这些云服务为客户带来了快速、简便部署的益处。例如，在云端执行电子邮件营销活动甚至不需要安装或许可使用 `SMTP` 电子邮件服务器，而在本地环境中这可能是必须的。\n\
  \n在已定义成功标准的情况下，细致的规划和持续监控是高效有效利用云计算服务的关键。这可能包括在云端为了测试目的而缩短较小的网站部署时间。云计算允许比以前更快的速度和更大规模的数据生成与消耗，组织而言必须对其进行仔细管理，以便以最低的成本获取尽可能大的业务价值。\n\
  \n### 认证目标 2.02\n\n## 服务水平协议 (Service Level Agreements)\n\n`服务水平协议 (SLA)` 是 `CSP`\
  \ 与云客户之间的合同。`SLA` 针对特定的云服务。例如，图 2-1 显示了云存储解决方案的 `SLA` 摘录。这些术语将与虚拟机、网站等服务的 `SLA`\
  \ 术有所不同。\n\n**图 2-1** Amazon Web Services (`AWS`) `S3` 云存储 SLA 摘录\n\n![Images](img/F02-01.jpg)\n\
  \n`SLAs` 关注于云服务的性能、可用性和技术支持。工作说明书 (`SOW`) 提供了合同产生的交付物细节，例如 `SLA`。如果 `SLA` 未提及这些项目，你可以向\
  \ `CSP` 提交信息请求 (`RFI`) 以获取更多详细信息。\n\n要确定可接受的性能和可用性值，你必须首先为 IT 服务的使用建立正常接受性能和可用性的基准。假设\
  \ `SLA` 规定每月云存储可用时间为 99.9%，这代表了云存储可用性的行业标准基准。考虑到该值，可能的停机时间？可能情况下，云存储每月可能会不可用 43\
  \ 分 12 秒，如图 2-2 所示（使用 [www.slatools.com/sla-uptime-calculator](http://www.slatools.com/sla-uptime-calculator)\
  \ 上的 `SLA` 时间计算器）。如果 `CSP` 未能履行 `SLA` 义务，则云服务额度将应用于客户的云计算费用中。\n\n**图 2-2** 根据 `SLA`\
  \ 每月可用性百分比确定云服务可用时间\n\n![Images](img/F02-02.jpg)\n\n![Images](img/onjob.jpg)\n\n\
  **在某些情况下，`SLA` 中的细节可以被修改或协商。这对于大型组织或政府机构尤为如此。**\n\n### 费用分摊 (Chargeback)\n\n`SLAs`\
  \ 不仅定义了云服务的可用性，还定义了定价结构。在某些组织中，这甚至适用于私有云。IT 部门提供私有云服务，组织内的每个部门根据其使用私有云资源的情况收费（部门费用分摊）。\n\
  \n根据部门或项目等细节跟踪云资源可以通过`资源标记` (`resource tagging`) 轻松实现，这意味着向该资源添加元数据以进一步定义该资源。例如，在云端部署存储、虚拟机和网站意味着部署了许多云资源，每个资源都可能被标记上值为\
  \ `Project ABC` 的 `Project` 标签，如图 2-3 所示。通过这种方式，与 `Project ABC` 相关的所有云资源可以列在一起以便管理和计费。\n\
  \n**图 2-3** Azure 虚拟机的标签名称和值\n\n![Images](img/F02-03.jpg)\n\n### 认证目标 2.03\n\n##\
  \ 云成本管理\n\n尽管云计算成本是按月循环的费用，但并不意味着规划和跟踪云计算变得不重要了。例如，在只需要使用一天的情况下让云数据库或虚拟机部署运行几个月，可能会导致本可以轻松避免的高额账单。基于云的策略和权限可以限制哪些云用户部署云服务。可以使用操作来实现操作，例如虚拟机自动关机，如图\
  \ 2-4 所示。\n\n**图 2-4** Azure 虚拟机自动关机选项\n\n![Images](img/F02-04.jpg)\n\n#### 预留实例与现货实例\n\
  \n大多数 `CSP` 允许你提前长时间（如长））保留计算能力（虚拟机使用）。这被称为`预留实例` (`reserved instance`)。如果你知道在此期间需要云端计算能力，通过这样做可以降低云成本，因为\
  \ `CSP` 为预留实例配置提供了折扣。\n\n另一种节约措施是使用`现货实例` (`spot instances`)。这指的是当前空闲的虚拟机计算能力，可以以极低的成本使用，但不保证始终对你可用。如果你想以最低成本使用云端虚拟机进行测试或非关键\
  \ IT 负载，使用现货实例符合这一需求。\n\n![Images](img/exam.jpg)\n\n**常见的成本降低设置（如调度虚拟机自动关机）尽管并非所有公共\
  \ CSP 都支持所有此类设置，但仍出现在考试中。**\n\n#### 云订阅类型\n\n云订阅定义了计费和管理边界。你可以拥有具有多个订阅的单一公共 `CSP`\
  \ 账户。\n\n\n\n\n\n订阅是指定支付信息（如信用卡详情）以及账单电子邮件和物理地址的地方。你可以通过增加成本，通过添加额外的云功能、增强的技术支持等来强化订阅。某些云服务提供商（CSP）如\
  \ `Microsoft Azure` 提供不同类型的订阅；例如：\n\n![Images](img/square-1.jpg)  免费试用（30 天或使用 260\
  \ 美元额度）\n\n![Images](img/square-1.jpg)  按需付费\n\n![Images](img/square-1.jpg)  按需付费开发人员/测试版（针对开发者）\n\
  \n#### 许可\n\n大多数开源软件不需要用户支付许可费用。`Open source` 意味着源代码对互联网上的任何人都是免费的，并且对源代码的任何修改都必须向互联网上的所有用户免费。流行的开源软件示例包括\
  \ `Ubuntu Linux` 操作系统和 `LibreOffice` 办公套件。\n\n开源软件的对面是`专有`软件。例如 `Microsoft Windows`；微软拥有\
  \ `Windows` 操作系统的源代码，并且不免费提供其进行修改。此外，大多数专有软件在许可时需要支付费用。\n\n大多数 CSP 在部署虚拟机或数据库等资源时提供`自自带许可\
  \ (BYOL)` 选项，如图图 2-5 所示。如果你的组织已经支付了许可费用，你可以继续在云中使用它们以降低成本。在配置操作系统并提供许可信息时，你通常需要在继续之前接受最终用户许可协议\
  \ (`EULA`）。\n\n**图 2-5**      Microsoft Azure 虚拟机 BYOL 选项\n\n![Images](img/F02-05.jpg)\n\
  \n## 练习 2-1\n\n### Microsoft Azure 定价计算器\n\n在此练习中，你将使用 `Microsoft Azure 定价计算器`确定在\
  \ `Microsoft Azure` 公有云中部署 IT 服务的大约每月成本。以下指令取决于已完成第 1 章中的练习 1-1。\n\n1. 使用浏览器访问 `https://azure.microsoft.com/en-ca/pricing/calculator`。\n\
  2. 点击“虚拟机 (Virtual Machines)”磁贴，然后向下滚动到网页的虚拟机部分。\n3. 从“实例 (Instance)”下拉列表中选择 `D4`\
  \ 实例类型。\n4. 向下滚动并在“小时 (Hours)”字段中输入 `40`。\n5. 回到网页最顶端，并点击“存储账户 (Storage Accounts)”磁贴。向下滚动到存储账户部分并查看默认设置，但不要更改任何存储账户设置。\n\
  6. 回到网页最顶端，并点击“Azure SQL 数据库 (Azure SQL Database)”磁贴。\n8. 从“备份存储层级 (Backup Storage\
  \ Tier)”下拉列表中选择 `RA-GRS`。\n9. 滚动到网页最底部，查看所有所选云产品的预估每月成本。\n\n## 练习 2-2\n\n### Microsoft\
  \ Azure 预算与警报\n\n在此练习中，你将配置 Azure 预算和警报。以下指令取决于已完成第 1 章中的练习 1-1。\n\n1. 登录 `https://portal.azure.com`。\n\
  2. 从 Azure 门户顶部中心的搜索框中，输入 `订阅 (Subscriptions)` 并点击同名的搜索结果。\n   a. 点击你的订阅名称。\n  \
  \ b. 在左侧导航器中，点击`预算 (Budgets)`。\n3. 点击“添加 (Add)”按钮：\n   a. 将预算命名为 `Budget1`。\n  \
  \ b. 在“金额 (Amount)”字段中输入 `300`。\n   c. 启用“警报收件者（电子邮件）(Alert Recipients (Email))”部分的复选框，然后输入一个虚构的组邮箱地址，例如\
  \ `admins@fakeco.com`。\n\n\n\n\n\nB. 预期运行时间\n\nC. 订阅限制\n\nD. 服务积分\n\n6.** 你正在评估云服务的\
  \ SLA。需要什么才能确定 SLA 性能保证措施是否适用于特定的 IT 工作负载？\n\nA. 模板\nB. 基准\nC. 价格计算器\nD. 迁移工具包\n\
  \n7.** 你的组织运行着一个私有云。云的使用情况按部门跟踪，以便进行月度计费。哪个术语最能描述这种模型？\n\nA. 服务水平协议 (SLA)\nB. 费用分摊\
  \ (Chargeback)\nC. IaaS\nD. SaaS\n\n### 管理云成本\n\n8.** 当你在基于云的 Windows 虚拟机中定期测试新的操作系统（OS）更新时，需要尽可能降低成本。你应该怎么做？\n\
  \nA. 使用抢占实例 (Spot instances)\nB. 使用预留实例 (Reserved instances)\nC. 查看虚拟机 SLA\nD. 使用模板部署虚拟机\n\
  \n9.** 你的本地关键任务 Windows 服务器已获得许可。你计划将该服务器迁移到基于云的虚拟机。为了降低成本，你应该怎么做？\n\nA. 在创建云虚拟机时使用\
  \ BYOL \nB. 将服务器部署为抢占实例\nC. 增加虚拟机的计算能力\nD. 切换到开源操作系统\n\n10.** 哪个术语与同意许可条款相关？\n\n\
  A. BYOL\nB. EULA\nC. SLA\nD. TCO\n\n11.** 你公司的开发者经常在需求结束后很后仍让基于云的虚拟机运行。你应该配置什么来降低成本？\n\
  \nA. 自动关机\nB. 抢占实例\nC. 预留实例\nD. 虚拟机模板\n\n12.** 你希望在达到特定金额时收到云计算费用通知。你应该配置什么？\n\n\
  A. 预留实例\nB. 云价格计算器\nC. 云模板\nD. 账单警\n\n13.** 你应该配置什么来控制哪些类型的虚拟机可以部署在云中？\n\nA. 云策略\n\
  B. 云模板\nC. 云 SLA\nD. 云订阅\n\n14.** 你的公司有一份为期三年的军事合同，需要许多一直运行的虚拟机。你需要尽可能减少云计算成本。你应该考虑哪种云虚拟机选项？\n\
  \nA. 抢占实例\nB. 预留实例\nC. 自动关机\nD. 模板部署\n\n15.** 哪种软件通常不向用户收取许可费？\n\nA. 资本支出 (CAPEX)\n\
  B. 开源\nC. 专利\nD. BYOL\n\n#### 自测答案\n\n#### 云计算的业务案例\n\n1.** **C.** 在云计算背景下，价值证明\
  \ (PoV) 识别云计算的业务价值。\n\n**A、B、** 和 **D** 是错误的。概念证明 (PoC) 提供了计划将正常运行的保证。投资回报率 (ROI)\
  \ 用于确定支出价值随时间推移而增加或减少。总成本 (TCO) 识别与使用产品或服务相关的成本，包括随时间推移的持续管理和维护成本。\n\n2.** **B.**\
  \ 计量计用等同于按需付费；云使用情况会进行跟踪并据此计费。\n\n**A、C、** 和 **D** 是错误的。弹性是指根据需求快速配置配置或撤销资源的能力。资本支出\
  \ (CAPEX) 指大额投资。\n\n3.** **A.** ITIL 框架致力于提供高效的服务。\n\n**B** 和 **D** 是错误的。服务水平协议\
  \ (SLAs) 是提供者与客户之间的合同。\n\n4.** **C.** 云服务提供商 (CSP) 是供应商。\n\n**A、B、** 和 **D** 是错误的。监管人员不是云角色。\n\
  \n5.** **B.** 服务水平协议 (SLAs) 包含有关云运行时间的细节，以及如果未履行 SLA 指标，为云客户提供的的服务积分。\n\n**A** 和\
  \ **C** 是错误的。云订阅限制。\n\n6.** **B.** 基准为正常情况下的性能设定了标准。\n\n**A、C、** 和 **D** 是错误的。价格计算器和迁移工具。\n\
  \n7.** **B.** 费用分摊 (Chargeback) 指跟踪某个组的使用情况，然后据此计费。\n\n**A、C、** 和 **D** 是错误的。基础设施即服务\
  \ (IaaS) 和软件即服务 (SaaS) 是云模型。\n\n#### 管理云成本\n\n8.** **A.** 抢占实例是需要时可以“租赁”的额外计算能力，但不保证运行时间，因此对于测试操作系统更新来说，这是可以接受的。\n\
  \n**B、C、** 和 **D** 是错误的。预留实例需要对计算进行长期承诺以获得折扣。\n\n9.** **A.** 自带许可 (BYOL) 允许云客户在虚拟机等云部署中使用其现有的软件许可。\n\
  \n**B、C、** 和 **D** 是错误的。关键任务服务器不应部署为抢占实例，因为不保证运行时间。\n\n\n\n\n# 11. ![Images](img/tick2.jpg)\
  \ **A.** 启用自动关机允许你调度虚拟机自动关闭的时间。\n\n![Images](img/times.jpg) **B, C,** 和 **D** 是错误的。按需实例（Spot\
  \ instances）是可以在需要时“租用”的额外计算能力，但不能保证运行时间。预留实例（Reserved instances）需要对计算服务进行长期承诺，以获得折扣价格。虚拟机模板包含用于部署虚拟机的指令，并可以接受如虚拟机名称或操作系统镜像等唯一值的参数。\n\
  \n# 12. ![Images](img/tick2.jpg) **D.** 账单告警配置用于在每月云费用达到指定金额时通知管理员。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **C** 是错误的。预留实例需要对计算服务进行长期承诺，以获得折扣价格。云端定价计算器允许用户添加特定云服务的预期用量，以了解云服务的可能成本。云模板用于便于云资源的部署和管理。\n\
  \n# 13. ![Images](img/tick2.jpg) **A.** 云策略不仅控制哪些管理员可以部署和管理虚拟机，还控制粒度资源细节，例如可以部署哪些类型的虚拟机。\n\
  \n![Images](img/times.jpg) **B, C,** 和 **D** 是错误的。云模板用于便于云资源的部署和管理。服务水平协议（SLAs）包含有关云服务运行时间的细节，以及在未履行\
  \ SLA 指标时为云客户提供的服务积分。云订阅作为云计算的计费边界和功能边界。单个云账户可以包含多个订阅。\n\n# 14. ![Images](img/tick2.jpg)\
  \ **B.** 预留实例需要对计算服务进行长期承诺，以获得折扣价格。\n\n![Images](img/times.jpg) **A, C,** 和 **D**\
  \ 是错误的。按需实例是可以在需要时“租用”的额外计算能力，但不能保证运行时间。启用自动关机允许你调度虚拟机自动关闭的时间。云模板用于便于云资源的部署和管理。\n\
  \n# 15. ![Images](img/tick2.jpg) **B.** 开源软件意味着源代码可以在互联网上供所有人免费获取，通常不需要支付使用软件的许可费。\n\
  \n![Images](img/times.jpg) **A, C,** 和 **D** 是错误的。资本支出（CAPEX）指的是对设备的大额投资。专有软件并不在互联网上免费提供源代码，通常需要支付许可费才能使用软件。自自带许可（BYOL）允许云客户在如虚拟机等云部署中使用其现有的软件许可。\n\
  \n## 第二部分\n\n## 云设计需求\n\n![Images](img/chap1.jpg)\n\n## 章节\n\n- 3 章 云规划\n- 4 章 合规性与云\n\
  \n## 第 3 章\n\n## 云规划\n\n![Images](img/chap1.jpg)\n\n### 认证目标\n\n3.01 云可行性\n3.02\
  \ 使用云解决业务问题\n3.03 云迁移策略\n\n![Images](img/tick.jpg) 两分钟演练\n\n[Q&A] 自测\n\n***\n\n\
  本章强调了规划使用云计算服务的重要性。新公司可以相对容易地采用云计算，而已经在使用本地解决方案的组织则有更多需要考虑的因素。\n\n在本章中，我们将探索如何确定云服务是否能满足业务需求、如何选择正确的云服务，以及如何规划云迁移策略。\n\
  \n##### 认证目标 3.01\n\n#### 云可行性\n\n与所有业务活动一样，采用云计算需要细致的分析、规划和测试。制定一个稳健的业务计划以及识别技术如何满足业务需求，对于成功的云采纳策略起着至关重要的作用。在评估将\
  \ IT 服务扩展到现有本地解决方案之外的可行性时，组织需要识别云计算提供的潜在收益。这些收益中的一些可能包括：\n\n- ![Images](img/square-1.jpg)\
  \ 较少的预期资本成本\n- ![Images](img/square-1.jpg) 更快的 IT 服务部署\n- ![Images](img/square-1.jpg)\
  \ 有更多时间关注如何使用 IT 解决业务问题，而不是侧重于配置技术\n- ![Images](img/square-1.jpg) 产品和服务的更短上市时间\n\
  \n必须考虑组织的当前和未来需求，例如向电子邮件系统添加用户的能力、部署更多虚拟机的能力、增加云存储的容量——这种可扩展性与容量规划非常契合。缺口分析（gap\
  \ analysis）用于识别 IT 解决方案是否恰当地满足了业务需求，例如确定云存储的数据必须位于国边界内。如果不是，分析结果可以识别出需要更改的内容，例如将云存储移至国边界内。\n\
  \n可行性研究考虑了技术限制、法规合规性和成本等因素，以确定所提的解决方案是否有现实成功的机会。\n\n文档有助于判断所提的云计算解决方案在解决业务需求方面的现实性和实用性（可行性）。正如第\
  \ 1 章 变更管理\n- ![Images](img/square-1.jpg) 资源管理\n- ![Images](img/square-1.jpg) 配置管理\n\
  - ![Images](img/square-1.jpg) 标准操作程序\n\n例如，云端存储资源的自动化管理现在可能使用 `Microsoft PowerShell`\
  \ 等命令行工具通过脚本或模板来实现，而以前这项任务是由本地专有解决方案工具处理的。在云采用进展过程中向利益相关者汇报时，需要建立一个联系人。受影响的利益相关者包括云服务的终端、支持云服务的\
  \ IT 团队以及管理层。\n\n例如，假设目前的本地文件服务器数据将迁移到云端文件共享系统。必须通知受影响的用户此更改以确保他们持续访问，并建立一种报告状态的方法。CSP\
  \ 为云资源管理的所有方面提供审计和日志功能，包括数据迁移到云。\n\n#### 云试点项目\n\n云可行性研究解决的是通用性问题，例如“我们的组织是否可以使用云计算更有效地利用技术来服务业务需求”，而试点项目则是在小范围内实际实施云服务，以评估该服务。\n\
  \n\n\n\n将试点计划（pilot programs）理解为更具体地关注`如何`衡量可行性。例如，一个试点计划可能由来自某个部门的五个用户（控制组）组成，他们在一段时间内使用云服务进行工作，而其他人员则继续使用本地\
  \ IT 服务。开展试点计划的结果将将报告给相关利益相关者，以确定在更大范围内实施云服务的可行性。\n\n![Images](img/exam.jpg)\n\n\
  **务确保你了解可行性研究与试点计划之间的区别。**\n\n![Images](img/onjob.jpg)\n\n**试点计划可以作为“概念验证”工具，用于测试本地\
  \ IT 系统和数据迁移到云端，以及随后在云端使用这些系统和数据。**\n\n#### 认证目标 3.02\n\n#### 使用云解决业务问题\n\n组织使用技术并不是因为这些设备很酷。他们使用技术是为了解决业务问题并节省成本。通过`规模对齐`（right-sizing）可以节省资金，这种方法力求高效地使用\
  \ IT 基础设施，例如在请求变慢时减少支持应用程序的虚拟机数量，这也被称为`缩容`（scaling in）（请参见第 1 章）。\n\n#### 将计算需求映射到云服务\n\
  \n规划云计算的使用意味着考虑组织当前和未来预期的 IT 需求，然后在云中找到满足这些需求的服务。例如，如果你的组织需要快速测试自定义软件应用程序的更改，在云中部署应用程序容器可能比部署虚拟机更快、更廉价。这是因为应用程序容器与虚拟机不同，它不包含整个操作系统；相反，它只是简单地使用正在运行的底层操作系统。\n\
  \n表 3-1 显示了常见 IT 需求及相应的云解决方案示例。\n\n**表 3-1**常见计算需求与云解决方案\n\n![Images](img/f0049-01.jpg)\n\
  \n使用云服务是一回事，但记录和监控使用情况对于随时间进行持续改进至关重要。你可以配置警报，例如，如果虚拟机在特定时间内的平均 CPU 利用率超过给定的百分比值，你就会收到通知，如图图\
  \ 3-1\n\n#### 数据主权与隐私\n\n云服务运行在位于数据中心某处的物理硬件上。该数据中心的位置对于决定是否应该使用特定的 CSP（云服务供应商）或云服务起着关重要的作用。\n\
  \n在创建时，云服务通常允许创建者指定部署云资源的位置（或区域），如图图 3-2\n\n由于互联网的全球性，数据隐私已成为全球性问题。个人身份信息（PII）是指可以唯一识别个人的任何信息或信息组合。PII\
  \ 的示例包括：\n\n![Images](img/square-1.jpg)  社会安全号\n![Images](img/square-1.jpg)  电子邮件地址\n\
  ![Images](img/square-1.jpg)  IP 地址\n![Images](img/square-1.jpg)  街道地址\n![Images](img/square-1.jpg)\
  \  母姓\n\n受保护的健康信息（PHI）是指任何医疗相关信息。PHI 的示例包括：\n\n![Images](img/square-1.jpg)  血型\n\
  ![Images](img/square-1.jpg)  处方药\n![Images](img/square-1.jpg)  既往史\n![Images](img/square-1.jpg)\
  \  健康保险范围\n![Images](img/square-1.jpg)  医疗记录\n\nPII 和 PHI 以及支付卡信息，在本地和云端都必须受到保护。以下讨论提供了可能影响特定\
  \ CSP 的规则。\n\n#### 通用数据保护条例（GDPR）\n\n由于数据隐私是一个如此常见的话题，世界各地的立法者都在努力制定框架以保护数据的收集、保留和共享。GDPR\
  \ 是欧盟（EU）的一项法案，旨在将控制权交给所有者。\n\nGDPR 规定个人有权就如何收集和使用其数据获得透明沟通和同意。个人还权权访问其收集的数据并确保其准确性。\n\
  \nGDPR 适用于欧盟境内收集处理个人数据的组织，也适用于在欧盟境外处理个人数据的实体。\n\n#### 健康保险流动性与责任法（HIPAA）\n\n在美国，HIPAA\
  \ 旨在保护个人健康信息免受未经授权的访问和使用。医疗服务提供和健康计划必须通过以下方法符合监管要求：\n\n![Images](img/square-1.jpg)\
  \  强用户和设备认证\n![Images](img/square-1.jpg)  数据加密\n![Images](img/square-1.jpg)  数据完整性检查以检测篡改\n\
  ![Images](img/square-1.jpg)  持续监控以检测潜在安全漏洞\n\n与所有规则一样，它也有例外。考虑参与医学研究的人同意在其身上连接活动监测设备。如果对多个用户的收集数据进行分析和总结，则\
  \ HIPAA 可能不再适用。任何 trace 溯到公民的医疗相关信息都可能受 HIPAA 约束。\n\n处理借卡和信用卡等支付卡的商户必须遵守 PCI DSS\
  \ 框架。与 GDPR 和 HIPAA 等其他隐私标准不同，PCI DSS 不限于某个国家或国家群；它是国际性的。\n\n保护持卡人数据可能需要对这些信息进行传输和存储的安全保护（如果存储了的话）。PCI\
  \ DSS 大部分由建议组成；由 IT 安全专家决定最佳的安全控制来降低风险。另一个需要考虑的是，合规细节随卡类型而异（Visa、MasterCard、美国运）。表\
  \ 3-2 提供了 PCI DSS 安全要求的解决方案子集。\n\n**表 3-2** PCI DSS 需求与建议的安全控制\n\n![Images](img/f0052-01.jpg)\n\
  \n从安全分析师的角度来看，对 IT 环境进行 PCI DSS 审计可以包括\n\n![Images](img/square-1.jpg)  识别持卡数据\n\
  ![Images](img/square-1.jpg)  评估现有的安全控制\n![Images](img/square-1.jpg)  通过重新配置或使用新的安全控制进行修复\n\
  ![Images](img/square-1.jpg)  针对 PCI DSS 审计的合规报告 (RoC)\n\n\n\n当组织完成可行性研究，并随后通过试点项目测试特定云解决方案的可行性，且确定了是的，将\
  \ IT 服务从本地迁移到云端`确实`是有意义的后，它就可以专注于云迁移策略。在选择迁移策略时，一个重要的考虑因素是，它还可以通过将数据复制到各个区域的云端，帮助满足灾难恢复和业务连续性计划，这样灾难就不会破坏所有数据副本。\n\
  \n请记住，在云计算中，取决于你部署的服务，你（云客户）与云服务提供商（CSP）之间存在着共责任分担。例如，如果你在云端部署了虚拟机，那么管理它们就由你负责，包括为操作系统打补丁，但运行虚拟机的底层物理虚拟化程序硬件、存储和网络基础设施是\
  \ CSP 的责任，在这种语境下，CSP 也可以被称为托管服务提供商 (MSP)。\n\n大多数云迁移都采用`分阶段`的方法。简单来说，它可能包含以下阶段：\n\
  \n1. 评估适用于迁移到云端的本地候选对象。\n2. 将 IT 系统和数据存入云端。\n3. 在本地和云端之间同步数据。\n4. 在云端成功采用一段时间后，注销本地\
  \ IT 系统和数据。\n\n当然，你可能永远不会注销本地组件，这将导致运行一种`混合`云解决方案。\n\n### 抬抱并迁移 (Lift and Shift)\n\
  \n虽然某些定制的 IT 解决方案可能需要重新设计以便在云端运行，但其他解决方案可以在很少或不修改的情况下从本地 IT 配置移动到云端。现成通用软件 (COTS)\
  \ 通常适用于从本地到云端的“抬抱并迁移”迁移策略，而定制的、资源密集型的解决方案通常不适用。抬抱并迁移迁移通常被称为`重新托管` (rehosting) 迁移。重构\
  \ IT 系统以在云端运行被称为`重构` (refactoring)，这是下一节将讨论的“拆除并替换”（rip and replace）迁移策略的核心。\n\n\
  ![Images](img/exam.jpg)\n\n**准备好回答考试题，这些题目将测试你对抬抱并迁移迁移与重构之间差异的知识掌握。**\n\n### 大数据集\n\
  \n如果你有大型本地数据集，你的云迁移策略可能包括使用 CSP 的大容量数据传输服务，例如 `AWS Snowball`。通过 `AWS Snowball`，一个安全的存储设备会被发送到你的所在地，你的数据被复制到设备中（带有\
  \ 256 位加密），然后设备被寄回 `AWS`，随后数据会被复制到 `AWS 云`中。通过互联网传输海量数据（例如拍字节级）有时是不可行的，即使使用最快的互联网连接，因为耗时太长。它也可能太贵，或者不够安全。\n\
  \n### 物理转虚拟 (P2V)\n\n本地物理服务器可以作为虚拟机迁移到云端。这一过程被称为物理转虚拟 (P2V) 迁移，通常通过安装在物理服务器上的代理程序进行，该程序与管理控制台通信。代理分析硬件和操作系统配置，以便相应地配置虚拟化环境。相反的操作，即将虚拟机迁移到物理主机，被称为虚拟转物理\
  \ (V2P)。\n\n如果你想通过虚拟化现有的物理服务器在自己的设备上运行私有云，你可能还会考虑 P2V 迁移。可以使用免费的 `VMware Converter`\
  \ 工具对物理 Windows 和 Linux 主机执行 P2V 迁移。\n\n### 虚拟转虚拟 (V2V)\n\n很有趣；大多数人认为 V2V 意味着将本地虚拟机迁移到云端，这是正确的。这可能比在云端部署一个全新的虚拟机并配置其以满足你的需求要快得多。\n\
  \n但 V2V 也意味着在需要时将云端虚拟机迁移回本地。例如，`Microsoft Azure VMs` 使用虚拟硬硬盘 (`VHDs`)。你可以从 `Azure`\
  \ 下载 `VHDs`，如图 3-3 所示。\n\n### 拆除并替换 (Rip and Replace)\n\n上一节讨论了重构 IT 系统以在云端运行，这是拆除并替换迁移策略的核心。\n\
  \n图 3-3 拆除并替换\n\n虽然某些定制的 IT 解决方案可能需要重新设计以便在云端运行……（注：此处原文未提供拆除并替换的具体后续内容，根据上下文逻辑保持衔接）\n\
  \n\n\n\n大多数云服务提供商（CSP）还支持多种 NoSQL 数据库类型。与 SQL 不同，NoSQL 不使用严格的数据库架构（蓝图）来规定可以存储什么类型的数据。\n\
  \n## 认证总结\n\n本章讨论了计划采用云计算服务时需要考虑的因素。\n\n你已经接触到了确保 CSP 服务产品满足业务需求的重要性。业务缺口分析用于评估业务流程的当前状态和目标状态。技术缺口分析通过识别当前解决方案的技术配置与支持所需的配置之间的差距，以高效地支持业务流程。如果可行性研究确定提议的云解决方案能够现实地满足业务需求，则通过试点项目进行小规模的进一步详细的测试，这些项目将精确测试提议云解决方案的可行性。\n\
  \n你学习了规划使用云服务如何包括确定如何监控已部署的云解决方案，以确保尽可能的性能和安全性。可以配置警报，将检测到异常的通知发送给云管理员。\n\n你还学习了云端中的敏感个人数据和数据隐私，以及相关法律法规如何影响云服务的使用和配置。你了解到，个人身份信息（`PII`）是指任何可以唯一识别个体的个人或细节组合，例如街道地址或社会保障号码。受保护健康信息（`PHI`）与\
  \ `PII` 类似，但区别在于这些细节与医疗相关。\n\n你接触了数据隐私标准，例如欧盟的通用数据保护条例（`GDPR`）、美国的健康保险流通与责任法案（`HIPAA`）以及国际支付卡行业数据安全标准（`PCI\
  \ DSS`）。\n\n最后，你学习了云迁移策略，包括“抬移迁移”（lift and shift）与“重替换”（rip and replace）。你还学习了将虚拟机迁移到物理节点（`V2P`）以及将物理节点迁移到虚拟机（`P2V`）。\n\
