  \ DDoS\n\n**10.** 恶意攻击者使用一个受侵害的主机网络攻击 Web 服务器虚拟机，导致其崩溃。这是哪种类型的攻击？\n\nA. 勒索软件\nB.\
  \ 目录遍历\nC. DoS\nD. DDoS\n\n### 身份与访问管理\n\n**11.** Web 应用程序使用什么来建立对身份提供者的信任？\n\n\
  A. 加密的身份提供者令牌\nB. 加密的 Web 应用程序令牌\nC. 数字签名的 Web 应用程序令牌\nD. 数字签名的身份提供者令牌\n\n**12.**\
  \ 下列哪种项描述了身份联邦？\n\nA. 从一个目录服务导出用户账户到其他服务\nB. 从一个目录复制用户账户到其他目录\nC. 配置应用程序以信任中央身份提供者\n\
  D. 减轻用户无需为每个应用都输入凭据的负担\n\n**13.** 下列哪种项描述了 SSO（单点登录）？\n\nA. 从一个目录服务导出用户账户到其他服务\n\
  B. 从一个目录复制用户账户到其他目录\nC. 配置应用程序以信任中央身份提供者\nD. 减轻用户无需为每个应用都输入凭据的负担\n\n**14.** 下列哪些项是多因素身份认证的示例？（选择两个。）\n\
  \nA. 用户名和密码\nB. 用户名、密码和身份验证地址\nC. 用户名、密码和发送到手机的 PIN\nD. 用户名、密码和智能卡\n\n**15.** 你的组织要求位于美国东部的云资源必须标记默认的项目\
  \ ID（Project ID）和项目经理。该解决方案必须以最少的行政工作量来实现。你应该配置什么？\n\nA. 模板\nB. 自定义 API\nC. 基于角色的访问控制\n\
  D. 资源标记策略\n\n### 自行答案\n\n### 机密性\n\n**1.** **C.** 加密是一种机密性形式。\n\nA、B 和 D 是错误的。哈希确保数据未被篡改或损坏。数字签名用于证明消息发送者的真实性。\n\
  \n**2.** **D.** 身份提供者公钥用于验证由身份提供者私钥签名的令牌。\n\nA、B 和 C 是错误的。身份提供者私钥用于创建数字签名。Web 应用程序密钥未参与其中。\n\
  \n**3.** **B.** 对称加密使用两个密钥用于加密和解密。\n\nA、C 和 D 是错误的。公钥基础设施（PKI）是数字证书的体系，而不是加密类型。传输层安全协议（TLS）使用公钥和私钥。\n\
  \n### 数据完整性与消息身份验证\n\n**4.** **A.** 哈希用于检测对数据的修改。\n\nB、C 和 D 是错误的。可用性确保数据可以持续访问。机密性保护敏感数据免受未经授权的用户访问。身份验证是证明人的身份。\n\
  \n**5.** **D.** 文件哈希是唯一值。如果文件发生任何修改，再次生成的哈希将产生不同的值。\n\nA、B 和 C 是错误的。哈希不创建数字签名。哈希不加密文件。\n\
  \n**6.** **D.** 身份提供者公钥用于验证由身份提供者私钥签名的令牌。\n\nA、B 和 C 是错误的。PKI 是数字证书体系；SSL、TLS 或\
  \ IPSec 都是网络安全协议。\n\n**7.** **C.** 数字签名使用发送者的公钥来验证消息，该消息是使用发送者的私钥名的。\n\nA、B 和 D\
  \ 是错误的。哈希和数字签名不是同一件事。哈希用于检测数据修改，而数字签名用于验证消息。哈希和数字签名都不加密数据。\n\n#### 可用性\n\n**8.**\
  \ **B.** 数据备份与可用性相关。\n\nA、C 和 D 是错误的。加密是一种机密性形式，保护敏感数据免受未经授权的用户访问。数字签名用于确保消息的真实性。身份验证是证明人的身份。\n\
  \n**9.** **C.** 拒绝服务（DoS）攻击涉及攻击者使用（通常是）单一攻击系统，使受害者系统对合法用户不可。\n\nA、B 和 D 是错误的。勒索软件是加密文件并索要赎金以解密密钥的恶意软件。目录遍历是一种遍历\
  \ Web 服务器文件层次结构的 Web 服务器攻击。分布式拒绝服务（DDoS）攻击涉及攻击者使用多个受侵害的主机攻击网络或主机，例如向网络发送无用流量。\n\n\
  **10.** **D.** 分布式拒绝服务（DDoS）攻击涉及攻击者使用多个受侵害的主机攻击网络或主机，例如向网络发送无用流量。\n\n\n\n\n\n![Images](img/times.jpg)\
  \ `A`、`B` 和 `C` 是错误的。勒索软件是一种加密文件并索要赎金以获取解密密钥的恶意软件。目录遍历是一种 Web 服务器攻击，通过遍历 Web 服务器的文件系统层次来实现。拒绝服务（DoS）攻击涉及攻击者使用（通常是）单个攻击系统使受害者系统对合法用户不可用。\n\
  \n### 身份与访问管理\n\n**11.** ![Images](img/tick2.jpg) `D.` 身份提供者在用户身份验证成功后对令牌进行数字签名。应用程序被配置为信任身份提供者的签名。\n\
  \n![Images](img/times.jpg) `A`、`B` 和 `C` 是错误的。加密不用于建立来自身份提供者的信任。Web 应用程序不生成安全令牌；由身份提供者生成。\n\
