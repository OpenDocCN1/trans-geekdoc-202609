  A. `PKI` 证书\nB. `SSL` 证书\nC. `TLS` 证书\nD. `IPSec` 证书\n\n[3] 你决定使用自己的密钥对存储在云端的数据进行加密和解密。这是哪种加密？\n\
  A. `PKI`\nB. 对称\nC. 非对称\nD. `TLS`\n\n### 数据完整性和消息认证\n[4] 哈希是提供数据数据的示例：\nA. 完整性\n\
