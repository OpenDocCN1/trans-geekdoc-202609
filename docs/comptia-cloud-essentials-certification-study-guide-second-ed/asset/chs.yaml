  \n# 第 4 章：合规性与云\n\n![Images](img/chap1.jpg)\n\n### 认证目标\n- 4.01 法律、法规与安全标准\n- 4.02\
  \ 云服务提供商合规性\n- 4.03 业务需求与云解决方案\n\n![Images](img/tick.jpg) 两分钟演练\n**问答** 自测\n\n***\n\
  \n本章重点讨论组织为何需要评估潜在云服务提供商（CSP）对法律、法规和安全标准的合规情况如何。这一因素对 CSP 的选择以及特定云服务的使用具有巨大影响。\n\
  \n我们首先讨论法律和法规的相似与不同之处，以及为什么 CSP 和云客户对法律、法规和安全标准的合规非常重要。接下来，我们将关注适用于特定行业和政府机构的常用安全标准的含义。最后，我们将探讨如何确定提供的\
  \ CSP 解决方案是否符合与云客户相关的法律法规。\n\n## 认证目标 4.01：法律、法规与安全标准\n\n云计算的采用是外包的一种形式；你作为云客户，依赖于运行在某个未公开地点数据中心内云服务提供商设备上的\
  \ IT 服务。但作为一个组织，你如何能确信 CSP 在保护云端敏感 IT 系统和数据方面已经尽了尽职调查呢？\n\n这需要 CSP 遵守法律法规（如 `HIPAA`，美国对敏感患者健康信息的保护）的证明。IT\
  \ 系统和数据的物理位置可能至关重要——在国外收集、存储和使用的数据通常受该国法律管辖（数据主权），这在某些情况下可能会引发问题。某些基于行业的安全标准，例如支付卡行业数据安全标准\
  \ (`PCI DSS`)，无论当地法律如何，都适用于持卡人数据。\n\n### 法律与法规合规\n\n法律和法规并非同一种东西。法律由政府机构制定，而法规侧重于执行法律的实施细节。几个因素决定了组织是否受适用于云计算的特定法律法规：\n\
  \n- ![Images](img/square-1.jpg) 行业类型\n- ![Images](img/square-1.jpg) 组织的物理位置\n- ![Images](img/square-1.jpg)\
  \ 客户的国籍\n- ![Images](img/square-1.jpg) 物理计算设备的位置\n- ![Images](img/square-1.jpg)\
  \ 传输和存储数据的位置\n\n违反法律和缺乏法规合规性在某些情况下都可能导致罚款或监禁，或两者兼有。在使用云计算时，必须考虑所有列出的项目以确保法律和法规合规。做到一种方法是参考\
  \ CSP 网站上列出的任何合规细节，例如图 4-1 所示的 `AWS Compliance Programs` 网页。\n\n**图 4-1** 亚马逊云 (AWS)\
  \ 合规计划网页\n\n![Images](img/F04-01.jpg)\n\nCSP 不公开其数据中心的具体地址，尽管已提供了地址的地图（例如通过 `WikiLeaks`）。CSP\
  \ 员工和承包商需要知道去上班，但仅此而已。知道 IT 系统和数据物理存放位置的人越少，这些项目就越安全。\n\n正如所述，虽然 CSP 对安全标准的合规很重要，但请记住，坏人总是利用好东西做坏事。例如，以极低的成本在云端提供海量计算力，是恶意用户攻击曾被认为几乎不可破解的加密安全措施的一种方式。云服务提供商可以监控高功率计算资源的频繁部署和使用，试图检测对云环境的犯罪利用，即使法律或法规没有要求这么做。\n\
  \n## 认证目标 4.02：云服务提供商合规性\n\n对于许多组织而言，选择 CSP 取决两点：\n\n- ![Images](img/square-1.jpg)\
  \ CSP 的云服务满足业务计算需求。\n- ![Images](img/square-1.jpg) CSP 符合与组织相关的安全和审计标准。\n\n接下来的讨论仅涵盖在选择\
  \ CSP 期间可能应用的少数安全标准和法规。\n\n#### NIST SP 800-53\n\n在美国，美国标准与技术研究院 (`NIST`) 出版了一系列广泛的特别出版物\
  \ (`SPs`)，涵盖了计算机安全，其中之一是 `SP 800-53`，“联邦信息系统和组织的安全与隐私控制”。该文档的第 2.5 节（外部服务提供商）讨论了使用云服务的组织如何与\
  \ CSP 分担安全责任。CSP 必须能够通过独立审计和安全认证来证明其对安全标准的合规性。当 CSP 本身依赖于 IT 顾问以及硬件软件供应商等外部实体时，信任链会变得更加复杂。\n\
  \n云计算始终存在风险。组织的风险偏好决定了是否以及如何使用云服务。安全控制措施缓解针对资产的威胁。这的一个例子是云客户使用自己的加密密钥和公钥基础设施 (`PKI`)\
  \ 证书来保护传输中的数据和静态数据，而不是使用 CSP 生成的加密密钥和 PKI 证书。这两种都是有效的技术解决方案，但法律或法规可能要求密钥和证书由数据所有者控制。图\
  \ 4-2 显示了云存储中使用客户管理加密密钥的示例。\n\n**图 4-2** Azure 存储账户客户托管密钥配置\n\n![Images](img/F04-02.jpg)\n\
  \n### ISO/IEC 27017:2015\n\n国际标准组织 (`ISO`) 和国际电工委员会 (`IEC`) 标准 `27017:2015` 名为“信息技术—安全技术—基于\
  \ ISO/IEC 27002 云服务信息安全控制实践规范”。这个标题很长，但它为什么有什么关系呢？\n\n\n\n\n\n`ISO/IEC 27017:2015`\
  \ 具有相关性，因为它关注如何使用有效的安全控制措施来降低云计算风险。你选择的 CSP（云服务供应商）应通过 ISO 认证机构的认证，以正确使用 CSP 安全控制措施。但还记得责任共担的概念吗？作为云客户，你对安全也承担部分责任。仅仅因为你的组织使用了\
  \ `ISO 认证的 CSP`，并不意味着你的组织本身通过了 ISO 认证。图 4-3 显示了 AWS 的 ISO 合规性详情。\n\n**图 4-3** AWS\
  \ ISO 合规性网页\n\n![Images](img/F04-03.jpg)\n\n#### FedRAMP\n\n联邦风险与授权管理计划（`FedRAMP`）主要适用于使用或将要使用云计算服务的美国联邦政府机构。\n\
  \n将 IT 服务外包给云服务提供意味着某种程度的信任并引入了风险。`FedRAMP` 的设计旨在确保 CSP 遵循 `NIST SP 800-53` 安全标准。在研究\
  \ CSP 时，政府机构可以参考图 4-4 所示的 `FedRAMP 市场`来寻找 `FedRAMP 批准的 CSP`。\n\n**图 4-4** FedRAMP\
  \ 市场网页\n\n![Images](img/F04-04.jpg)\n\n![Images](img/onjob.jpg)\n\n**`FedRAMP 市场`\
  \ 不仅适用于美国联邦政府机构。任何组织都可以访问此参考列表以寻找符合 FedRAMP 标准的 CSP。这为 CSP 的安全态势及其服务提供了保障。**\n\n\
  ## 萨班斯-奥克斯利法案 (Sarbanes-Oxley Act)\n\n与 `WorldCom` 和 `Enron` 等公司相关的财务丑闻在 2000 年代初受到了媒体的广泛报道。这类可疑会计行为和财务文件造假导致了\
  \ 2002 年《萨班斯-奥克斯利法案》（`SOX`）的诞生。\n\n`SOX` 要求公共组织遵循严格的会计和财务文件报告规则。这与云有什么关系呢？受 `SOX`\
  \ 影响并使用云服务的组织必须使用符合第 16 号《鉴证业务标准声明（SSAE）》的 CSP。`SSAE No. 16` 是一项审计标准，涉及对 CSP 及其数据中心在内的服务机构内部安全控制的报告。\n\
  \n![Images](img/exam.jpg)\n\n**合规性允许使用多种技术解决方案。你可能会看到某些考试题要求给出合规的*最佳*解决方案，而在这种情况下，并没有完美的解决方案。请仔细阅读题干文字！**\n\
  \n### 认证目标 4.03\n\n## 业务需求与云解决方案\n\n除了考虑 CSP 对法律法规的合规性外，其他因素（如云服务与 IT 功能性要求的匹配程度）也会影响云服务的使用方式。如果从网上无法获取有关\
  \ CSP 的特定细节（例如客户数据如何被永久删除），你应该联系 CSP 获取这些信息。\n\n### 数据构件\n\n被删除的数据，即使是从本地磁盘删除的，通常可以使用免费工具进行找回，特别是当数据是使用标准操作系统函数删除的时。出于合规性考虑，你的组织可能需要确保敏感数据被永久移除。\n\
  \n*介质清理*（Media sanitization）是一个处理数据的过程，使其在合理的精力和时间内无法被检索。跳出字面的存储设备进行思考是很重要的；那么手机上的数据或应用配置设置是否允许访问包含敏感数据的\
  \ IT 系统？介质清理也适用于连接到云的设备存储。\n\n### 软件数据删除\n\n仅使用操作系统删除文件、格式化磁盘甚至重新划分磁盘，不足以确保数据无法被恢复。有很多工具可以相对容易地恢复已删除的分区，例如\
  \ `EaseUS Partition Master` 和 `Acronis Disk Director`。清理数据意味着覆盖数据，使数据无法恢复。清理介质意味着用随机数据覆盖。如图\
  \ 4-5 所示的覆盖类型。\n\n**图 4-5** 覆盖工具\n\n![Images](img/F04-05.jpg)\n\n### 介质销毁\n\n确保数据无法恢复的方法之一是物理销毁介质或数据介质。根据你的组织，介质销毁的方法需要符合特定的规定。有几种方法可以实现：\n\
  \n![Images](img/square.jpg) 破坏硬盘盘片\n![Images](img/square.jpg) 物理粉碎介质\n![Images](img/square.jpg)\
  \ 钻孔介质\n![Images](img/square.jpg) 磁场消磁\n![Images](img/square.jpg) 不适用于固态硬盘 (SSDs)\
  \ 或光学介质\n![Images](img/square.jpg) 在强磁场附近\n![Images](img/square.jpg) 消磁数据\n\n美国国家安全局（NSA）已发布了一份批准的消磁列表，如图\
  \ 4-6 所示。\n\n**图 4-6** NSA 批准的消磁设备\n\n![Images](img/F04-06.jpg)\n\n## 云服务提供商实施\n\
  \n评估哪个 CSP 最适合组织或政府机构，可以通过创建问卷来促进，在某些情况下也可以与 CSP 进行谈判。\n\n对于亚马逊服务（AWS），`AWS Artifact`\
  \ 工具提供了 AWS 合规信息，包括访问安全报告。这些报告可以帮助创建合规文档，如表 4-1 所示。\n\n表 4-1** CSP 合规文档示例\n\n![Images](img/f007-01.jpg)\n\
  \n![Images](img/exam.jpg)\n\n### 练习 4-1\n\n**查看亚马逊服务的合规性**\n\n在练习中，你将使用 `AWS Compliance\
  \ Center` 获取有关金融机构使用云服务的详情。\n\n1. 使用网络浏览器访问 [`https://www.atlas.aws`](https://www.atlas.aws)。\n\
  2. 点击 `Get Started` 按钮。\n3. 从下拉列表中选择你的国家或地区或在地图上进行选择。\n4. 点击 `Download PDF` 按钮并将文件保存到你的设备。\n\
  5. 打开下载的 PDF，阅读你地区金融机构的 AWS 合规情况，如图 4-7 所示。\n\n**图 4-7** 金融机构云使用的加拿大国家概况\n\n![Images](img/F04-07.jpg)\n\
  \n### 考试内部\n\n**安全标准**\n\nCompTIA 并不要求你在 `CLO-002` 考试成为法律专家或监管分析师，但你应该了解一些常见的标准，例如\
  \ `PCI DSS`、`HIPAA`、`GDPR`、`SOX`、`FedRAMP` 和 `ISO/IEC 27017:2015`。你不需要记住这些标准的每一个细节，但你应该能力判断特定的\
  \ CSP 认证是否满足组织的法律和法规合规要求。\n\n\n\n\n本章重点关注如何确保您的组织在云云服务时符合相关的法律法规。在依赖云服务提供商（CSP）时，组织应当进行尽职调查，以确保该\
  \ CSP 符合相关的法律、法规和安全标准。\n\n讨论从回顾诸如 `HIPAA` 和 `PCI DSS` 等法律法规如何适用于 CSP 和云客户开始。例如敏感数据收集、存储和使用方面的应用。接下来，我们讨论了法律如何定义通用规则，而法规则侧重于细节，包括法律的实施和执行。\n\
  \n随后，在云计算的背景下，讨论了如 `NIST SP 800-53` 和 `FedRAMP` 等安全标准框架，涵盖了 CSP 和云客户的双重视角。\n\n最后，您学习了如何使用问卷来确定\
  \ CSP 是否充分满足业务需求，包括法律和法规合规性。\n\n### ![Images](img/tick1.jpg) 两分钟训练\n\n#### 法律、法规与安全标准\n\
  \n![Images](img/box1.jpg) 法律是控制行为的通用准则。\n\n![Images](img/box1.jpg) 在商业世界中，法规为法律提供了实施和执行的细节。\n\
  \n![Images](img/box1.jpg) 服务器和数据的物理位置可以决定哪些法律具有适用。\n\n![Images](img/box1.jpg) `HIPAA`\
  \ 是一部保护敏感患者医疗信息的美国法律。\n\n![Images](img/box1.jpg) `PCI DSS` 不是法律，而是一种旨在保护持卡人数据的行业安全标准。\n\
  \n#### 云服务提供商合规\n\n![Images](img/box1.jpg) `NIST SP 800-53` 详细说明了 CSP 如何通过独立评估证明其对安全标准的合规。\n\
  \n![Images](img/box1.jpg) `ISO/IEC 27017:2015` 关注于安全控制如何减少与云计算相关的风险。\n\n![Images](img/box1.jpg)\
  \ `FedRAMP` 为美国政府机构使用云计算提供了安全指南。\n\n![Images](img/box1.jpg) 《萨班斯-奥克斯利法》（Sarbanes-Oxley\
  \ Act）对美国上市公司实施了会计和财务报告要求，其目的是减少财务报告造假以保护公众（包括投资者）。\n\n#### 业务需求与云解决方案\n\n![Images](img/box1.jpg)\
  \ 媒体清理技术旨在防止从存储介质中检索敏感数据。\n\n![Images](img/box1.jpg) 存储介质的物理破坏技术包括钻孔、粉碎和消磁。\n\n\
  ![Images](img/box1.jpg) 问卷对于确定 CSP 是否符合特定的安全和监管标准非常有用，这些标准可以作为 CSP 选择的因素。\n\n###\
  \ ![Images](img/qs.jpg) 自测\n\n以下问题将帮助您衡量对本章所介绍内容的理解程度。如所示，某些问题可能有多个正确答案，请务必仔细阅读所有选项。\n\
  \n#### 法律、法规与安全标准\n\n**1.** 关于法律和法规的以下陈述哪项是正确的？\n\nA. 法规提供了实施和执行细节。\nB. 法律提供了实施和执行细节。\n\
  C. 违反法律会导致罚款；而缺乏法规合规则并非如此。\nD. 缺乏法规合规可能导致罚款，但不会监禁。\n\n**2.** 哪个术语根据数据收集、存储和使用的位置指向适用法律？\n\
  \nA. 特别出版 (Special Publication)\nB. 安全控制 (Security control)\nC. 数据主权 (Data sovereignty)\n\
  D. PKI\n\n**3.** 您正在评估 CSP，因为您的组织决定采用云计算来满足其部分 IT 服务需求。确定 CSP 符合哪些安全标准的最快方法是？\n\n\
  A. 向 CSP 发送电子邮件查询合规情况。\nB. 给 CSP 打 get 电话。\nC. 查看账单。\n\n**4.** 哪个因素对适用哪些法规的影响最大？\n\
  \nA. 操作系统\nB. 类型\nC. 云强度\nD. 清理类型\n\n**5.** 您想知道 CSP 的具体地址。您应该怎么做？\n\nA. 对域名运行 DNS\
  \ 查询。\nB. 发送信息。\nC. 审查服务协议。\nD. CSP 不予披露。\n\n#### 云服务提供商\n\n**6.** 哪个美国政府安全标准与云最相关？\n\
  \nA. `HIPAA`\nB. `ISO/IEC 27017:2015`\nC. `FedRAMP`\n\n**7.** 哪项美国法规旨在减少财务造假？\n\n\
  A. `HIPAA`\nB. `ISO/IEC 27017:2015`\nC. `FedRAMP`\nD. 《萨班斯-奥克斯利法》\n\n**8.** 为什么\
  \ CSP 的安全合规性很重要？（选择两个）\n\nA. 它提供了一个缓解风险的保证。\nB. 云客户也是合规的。\nC. 它不会被黑客攻击。\nD. 通过第三方。\n\
  \n**9.** 在采用云计算时哪种风险最常见？\n\nA. 使用过时的算法\nB. 云租户存储\nC. 缺乏租户隔离\nD. 对外包的信任\n\n**10.**\
  \ SSAE. 16 是什么样的标准？\n\nA. 审计\nB. 加密\nC. 风险管理\nD. 身份验证\n\n#### 业务需求与云解决方案\n\n**11.**\
  \ 关于 CSP 法律和法规合规性的陈述哪些正确的？（选择两个）\n\nA. 所有责任都落在 CSP 身上。\nB. CSP 的服务协议列出了独立的第三方审计师。\n\
  C. CSP 提供有关其安全标准的文档。\nD. 云客户在保障云计算安全方面也承担责任。\n\n**12.** 您正在审查 CSP 的介质破坏程序。您的组织要求通过磁力移除硬盘数据。哪种技术可以实现这一点？\n\
  \nA. 钻孔\nB. 粉碎\nC. 锤击\nD. 消磁\n\n**13.** 与漏洞评估相比，哪个词与渗透测试最相关？\n\nA. 文档\nB. 身份验证\n\
  C. 主动 (Active)\nD. 被动 (Passive)\n\n**14.** 为了防止未来检索云复制的敏感数据，您对一台笔记本电脑的硬盘进行了重新分区。在重新分区时，该电脑运行的是\
  \ Windows 客户端操作系统。关于此场景的陈陈述是正确的？\n\nA. 应该使用 Windows 服务器操作系统。\nB. 删除的分区可以很容易恢复。\n\
  C. 应该使用 Linux 服务器操作系统。\nD. 移除磁盘分区时操作系统不能运行。\n\n**15.** 哪种类型的安全测试识别弱点但不尝试利用它们？\n\n\
  A. 渗透测试\nB. 回归测试\nC. 负载测试\nD. 漏洞测试\n\n### ![Images](img/aself.jpg) 自测答案\n\n#####\
  \ 法律、法规与安全标准\n\n\n\n\n\n### 1. ![Images](img/tick2.jpg) **A.** 规章是法律的实施和执行侧。\n\n\
  ![Images](img/times.jpg) **B, C,** 和 D** 是错误的。法律是不应被违反的陈述或规则，但它们不提供具体的执行或实施细节。由于规章是法律的实施和执行，违反法律或未能遵守规章可能会导致罚款或监禁。\n\
