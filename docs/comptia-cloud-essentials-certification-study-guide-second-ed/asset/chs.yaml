  302. 274\n\n# 关于作者\n\n`Daniel Lachance` 拥有 CompTIA Cloud Essentials+, CompTIA Cloud+,\
  \ CompTIA Server+, CompTIA A+, CompTIA Network+, CompTIA Security+, MCT, MCSA, MCITP,\
  \ MCTS 等证书，是位于新斯科舍亚省哈利法克斯的 `Lachance IT Consulting, Inc.` 的所有者。Dan 为各种产品提供了超过 20\
  \ 年的技术性 IT 培训。他录制了与安全及各种平台相关的 IT 支持视频。Dan 开发过自定义应用程序，并规划、实施、排查故障并记录了各种网络配置，还进行过网络安全审计。Dan\
  \ 曾担任多本认证类书籍的技术编辑，并编写了包括 `CompTIA Server+ Certification All-in-One Exam Guide (Exam\
  \ SK0-004)` 和 `CompTIA Security+ Certification Practice Exams, Third Edition (Exam\
  \ SY0-501)` 在内的著作。\n\nDan 是一位热衷的非虚构类读者，热爱家庭聚会，并喜欢摆弄吉他。\n\n# 关于编辑\n\n`Eric Vanderburg`\
  \ 是 `TCDI` 的网络安全副总裁，也是一位知名的博主、演讲者和思想领袖。他因在网络安全、隐私、云和存储方面的见解而闻名。Eric 还是持执照的私人侦探，拥有\
  \ MBA 学位和多个本科学学位。他是一个持续学习者，已从 `Microsoft`、`Cisco`、`CompTIA`、`(ISC)²`、`Rapid7`、`EMC`、`CWNP`\
  \ 和 `Hitachi Data Systems` 获得了 40 多项技术认证。Eric 热衷分享网络安全和技术新闻、见解以及最佳实践。他经常就安全主题进行演讲并发表富有见解的文章。你可以在他的社交媒体渠道发现他发布的有价值且丰富的内容：\n\
  \n**Twitter:** `@evanderburg`\n\n**LinkedIn:** `https://www.linkedin.com/in/evanderburg`\n\
  \n**Facebook:** `https://www.facebook.com/VanderburgE`\n\n\n\n\n\n\n\n\n\n\n\n\n\
