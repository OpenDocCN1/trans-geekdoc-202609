  \n## 术表\n\n![Images](img/chap1.jpg)\n\n**访问控制列表 (ACL)** 对防火墙或共享文件夹等资源的权限列表。\n\n\
  **一切即服务 (XaaS)** 通过网络交付的云 IT 服务的通用术语。\n\n**应用程序容器** 用于运行应用程序的隔离边界，其中包含应用程序文件和设置，但不包含操作系统文件。\n\
  \n**应用程序编程接口 (API)** 一组可以程序化调用的相关函数。\n\n**应用程序服务提供商 (ASP)** 在网络上提供软件应用程序的组织。\n\n\
  **人工智能 (AI)** 努力模拟人类智能行为的技术。\n\n**自动伸缩** 自动调整底层资源以适应需求的增加和减少。\n\n**可用性** 确保 IT 系统和数据可访问，通常通过磁盘、服务器、网络连接或数据副本的冗余配置来实现。\n\
  \n**可用性区** 物理设备（如电源和网络交换机）的集合，用于将 IT 服务分发到物理设备机架上以提高可用性。\n\n**大数据** 大规模数据集，通常被输入到大数据分析解决方案中，以识别趋势、模式和可能的未来结果。\n\
  \n**二进制大对象 (blob)** 二进制数据，例如存储在云端的文件。\n\n**区块链** 一种不可修改的去中心化公共账本。\n\n**自带许可 (BYOL)**\
  \ 允许云客户在云端重用现有许可以降低成本的许可模型。\n\n**宽带网络访问** 从任何设备、任何时间、通过任何网络访问 IT 服务。\n\n**业务流程即服务\
  \ (BPaaS)** 服务于工资和电子商务等常见业务需求的云软件解决方案。\n\n**按需容量** 自动增加或减少云存储、数据分析处理或应用程序性能的能力。\n\
  \n**资本支出 (CAPEX)** 一项巨额前期投资，例如本地 IT 硬件投入。\n\n**中央处理器 (CPU)** 处理指令的计算设备的“大脑”。\n\n\
  **首席财务官 (CFO)** 负责组织财务的角色。\n\n**首席信息官 (CIO)** 负责 IT 环境中信息管理所有方面的角色。\n\n**首席信息安全官\
  \ (CISO)** 负责确保保护数字资产的安全措施有效性。\n\n**首席技术官 (CTO)** 负责确保安全、有效且成本效益地使用技术以支持业务需求的角色。\n\
  \n**密文** 将明文输入加密算法并结合密钥后产生的加密数据。需要正确的解密才能将密文还原为明文。\n\n**编排** 将多个相关的云自动化任务组织成连贯的工作流。\n\
  \n**云服务提供商 (CSP)** 根据按付费和自助服务等云计算特征，通过网络向云客户提供 IT 基础设施、开发和软件服务的组织。\n\n**云租户** 多租户环境中的云客户。多租户是指多个云客户使用同一个云服务提供商，每个租户的配置和数据与其他租户的配置和数据保持隔离。\n\
  \n**通信即服务 (CaaS)** 云通信解决方案，如 IP 语音 (VoIP)。\n\n**社区云** 为具有相似需求的客户（如医疗或金融机构）提供解决方案的云类型。\n\
  \n\n\n\n\n`content delivery network (CDN)`-全球云服务提供商内容缓存服务器集合。客户端对内容的请求可以由最近的缓存服务器满足，从而减少网络延迟。\n\
  \n`content management system (CMS)`-一种手动或自动的网站内容更新方法，不需要内容更新者理解用于格式化该内容的底层技术细节。\n\
  \n`continuous integration and continuous delivery (CI/CD)`-软件开发与 IT 管理的结合，确保软件解决方案通过网络自动且及时地交付给客户。\n\
  \n`customer relationship management (CRM)`-一种用于跟踪与现有及未来潜在客户互动的软件，旨在改进客户关系。\n\n`data\
  \ sovereignty`-数据主权：通过控制数据的物理位置，来控制与敏感数据相关的司法管辖法律。\n\n`Database as a Service (DBaaS)`-在云计算环境中提供的数据库解决方案，通常作为托管服务提供，这意味着客户无需自行配置虚拟机和数据库软件。\n\
  \n`denial of service (DoS)`-一种恶意攻击类型，通过向服务器大量无用网络流量，导致合法用户无法使用服务。\n\n`departmental\
  \ chargeback`-部门费用结算：衡量资源消耗（如云计算服务的使用），以便按部门进行计费。\n\n`DevOps`-软件开发实践与 IT 操作实践的结合。其结果是以安全的方式高效部署软件更新。\n\
  \n`digital signature`-数字签名：一种使用加密私钥对消息哈希值进行加密产生的唯一数学结果。通过相关的加密公钥对签名进行验证，意味着该消息是真实的。\n\
  \n`disaster recovery plan (DRP)`-灾难恢复计划：适用于特定业务流程或系统的文档，用于在故障时以尽可能短且最安全的时间恢复服务。\n\
  \n`Domain Name Service (DNS)`-域名系统：一组服务器，最常用于将友好名称（如 [www.mheducation.com](http://www.mheducation.com)）解析为相应的\
  \ IP 地址。\n\n`elasticity`-弹性：根据需求对资源进行动态配置和撤销。\n\n`encryption`-加密：将密钥和数学算法应用于明文以生成密文或加密数据。对称加密使用单一密钥进行加密和解密，而非对称加密使用公钥加密，并使用数学相关的私钥进行解密。\n\
  \n`End User Licensing Agreement (EULA)`-最终用户许可协议：一种具有法律约束力的合同，规定了购买者如何使用软件。\n\n\
  `enterprise resource planning (ERP)`-企业资源规划：使用软件解决方案管理业务流程，如工资、库存等。\n\n`Extensible\
  \ Markup Language (XML)`-扩展标记语言：一种使用标签表示数据的方法。XML 文件是文本文件。\n\n`feasibility study`-可行性研究：一种确定云计算能否满足业务需求的研究。\n\
  \n`Federal Risk and Authorization Management Program (FedRAMP)`-联邦风险与授权管理计划：一套关于美国联邦政府机构安全使用云计算的标准，尽管任何组织都可以查看并应用这些标准供自己使用。\n\
  \n`File Transfer Protocol (FTP)`-文件传输协议：一种使用端口 20 和 21 在网络主机之间上传和下载文件的方法。FTP 不对任何网络传输进行加密。\n\
  \n`functional testing`-功能测试：一种确保解决方案满足初始设计要求的测试类型。\n\n`fuzz testing`-模糊测试：一种向应用程序输入意外数据进行处理的测试类型。观察应用程序对模糊测试的行为有助于提高应用程序的安全性和稳定性。\n\
  \n`gap analysis`-差距分析：对现有 IT 解决方案及其如何满足（或不满足）业务需求的研究，以及需要做什么来满足业务需求。\n\n`General\
  \ Data Protection Regulation (GDPR)`-欧盟（EU）的一项立法，旨在控制对欧盟公民隐私数据的收集、存储、处理和共享。\n\n\
  `hard disk drive (HDD)`-硬盘：一种旧的磁盘存储技术，使用机械马达驱动硬性盘片旋转进行数据读写。\n\n`hardening`-加固：通过应用更新、更改默认配置、删除不需要的组件和用户账户、启用存储和网络加密等，减少应用程序、主机或网络的攻击面。\n\
  \n`hashing`-哈希：将数据输入单向数学算法产生唯一值（哈希，也称为消息摘要）。与加密不同，哈希不需要加密密钥。\n\n`Health Insurance\
  \ Portability and Accountability Act (HIPAA)`-健康保险流通与责任法案：美国的一项立法，旨在保护敏感的患者医疗信息，特别是与医疗保健的信息。\n\
  \n`high-performance computing (HPC)`-高性能计算：使用物理或虚拟机集群来分析大型数据集；也称为大数据和并行计算。\n\n`horizontal\
  \ scaling`-水平扩展：根据应用程序需求的变化，手动、计划或自动地增加或删除虚拟机。\n\n`hybrid cloud`-混合云：不同类型云（如私有云和公有云）的结合，或本地\
  \ IT 解决方案与云解决方案的结合。\n\n`Hypertext Transfer Protocol (HTTP)`-超文本传输协议：一种网络传输标准，用于在客户端（如网络浏览器）和服务器（如\
  \ Web 服务器）之间交换网页消息。与 HTTP 主机的连接通过 TCP 端口 80 进行。\n\n`hypervisor`-虚拟机管理器：运行在物理服务器上的软件，设计用于并发运行多个虚拟机。第\
  \ 1 型（裸机）虚拟机管理器作为操作系统运行，而第 2 型则作为现有标准操作系统内的应用程序运行。\n\n`identity and access management\
  \ (IAM)`-身份与访问管理：用户、软件和设备身份的创建、修改、配置和持续维护。还包括身份验证和授权设置维护。\n\n`identity federation`-身份联邦：使用受信身份身份提供者，减少为每个应用程序创建用户凭据的需求。例如使用\
  \ Facebook 凭据登录多个不同的网站。\n\n`immutable`-不可变：描述无法修改的数据，例如被标记为不可变的数字数据。\n\n`Information\
  \ Technology as a Service (ITaaS)`-IT 服务：通过网络提供 IT 相关的硬件、软件和支持服务。跟踪使用情况并据此计费。\n\n\
  `Information Technology Infrastructure Library (ITIL)`-IT 基础库：一种 IT 服务框架，通过服务策略、服务设计、服务过渡、服务运营和持续持续改进等阶段，尽可能高效、高效益地提供\
  \ IT 服务。\n\n`Infrastructure as a Service (IaaS)`-通过网络提供的底层 IT 服务，如存储、网络和虚拟机，具有自服务能力并按用量计费。\n\
  \n`input/output operations per second (IOPS)`-每秒输入输出次数：一种用于描述磁盘存储解决方案吞吐量的单位；IOPS\
  \ 越高性能越好，云端成本也越高。\n\n`Internet of Things (IoT) device`-物联网设备：任何在网络上可唯一标识的计算设备。IoT\
  \ 设备具有通过互联网通信的能力。包括视频监控系统、家庭环境控制和用于跟踪患者医疗数据的设备。\n\n`Internet service provider (ISP)`-互联网服务提供商：提供商品化互联网连接的实体。\n\
  \n\n\n\n\n`ISO/IEC 27017:2015` 一种规定云服务安全方法的国际标准。\n\n`JavaScript Object Notation\
  \ (JSON)` 一种基于 JavaScript 语言语法的文本数据交换格式。\n\n`jump box` 一种服务器形式的中央连接点（通常是虚拟机），用作远程管理的启动器。管理员首先连接到\
  \ `jump box`，然后由其提供对受限网络的访问，其中存在可管理的主机。\n\n`Kernel Virtual Machine (KVM)` 一种基于 Linux\
  \ 的虚拟化解决方案，用于同时托管多个虚拟机客户。\n\n`lift and shift` 一种云迁移策略，其本地 IT 解决方案可以在极小或不修改的情况下迁移到云端。\n\
  \n`Lightweight Directory Access Protocol (LDAP)` 一种通过 TCP 端口 `389` 访问网络配置数据库的方法，数据库可以包含应用程序配置设置、用户帐户、计算机帐户等。\n\
  \n`load balancing` 一种接收客户端应用程序请求并将这些请求路由到最不繁忙的响应后端服务器的配置；提高了应用程序的可用性和性能。\n\n`load\
  \ testing` 对应用程序应用预期的负载，以衡量应用程序的安全、稳定性和性能。\n\n`loose coupling` 一种软件和系统开发方法，其组件之间不相互依赖。例如，两个软件组件不需要同时在网络上可用以交换消息，可以使用中间存储队列；接收的软件组件可以在任何时间从队列中读取消息。\n\
  \n`machine learning (ML)` 人工智能的一种实现，可以模拟智能人类行为，例如从过去的经验中学习、从海量数据中得出意义以预测未来趋势，或识别语音模式。\n\
  \n`managed disk` 一种云服务提供商解决方案，免除了云用户手动配置虚拟机使用的虚拟磁盘的工作。\n\n`managed service` 一种云服务提供商解决方案，保护云客户免受解决方案底层配置复杂性的影响，例如大数据分析集群。\n\
  \n`managed service provider (MSP)` 参见 managed service。\n\n`mean time to repair (MTTR)`\
  \ 代表修复故障组件或服务所需的平均时间。\n\n`media sanitization` 从存储介质中彻底删除数据，以确保不存在可以用于重建已删除数据的数据残留。\n\
  \n`Metal as a Service (MaaS)` 云客户对云服务提供商物理服务器的专用使用。\n\n`metered usage` 一种基于资源消耗对云服务进行收费的方法，例如云存储的使用量、进入云托管网站的网络流量量或虚拟机在一个月内运行的时间。\n\
  \n`microservice` 一种具有特定功能的模块化软件组件。例如，一个应用程序可能由许多微服务组成，一个专注于验证用户输入，另一个专注于打印。每个微服务也可以独立于其他服务进行更新或扩展。\n\
  \n`Monitoring as a Service (MaaS)` 一种云端服务，提供在云端中心地监控各种设备和软件解决方案的能力。\n\n`multifactor\
  \ authentication (MFA)` 使用多个身份验证因子增强登录安全性。例如，要求用户名和密码组合（你所知的）、智能卡（你拥有的）以及智能卡的 `PIN`（也是你所知的）构成了\
  \ MFA。\n\n`network intrusion detection system (NIDS)` 一种旨在检测疑网络活动并记录、报告或通知该活动的硬件或软件解决方案。`NIDS`\
  \ 必须针对其用于监控的特定环境进行调整。\n\n`network security group (NSG)` 一种 Microsoft Azure 资源，作为防火墙允许或拒绝入站和出站流量。`NSGs`\
  \ 可以云子网或虚拟机网络接口关联。\n\n`NIST SP 800-53, Rev. 4` *联邦信息系统和组织的安全与隐私控制*，由美国国家标准与技术研究院（NIST）发布的特别出版（SP），涉及美国联邦政府信息系统和用于保护信息的安全控制。\n\
  \n`NoSQL` 一种不使用 `SQL` 那种严格存储模式的数据库；它可以在大规模范围内存储许多不同类型的非结构化数据；通常用于大数据存储。\n\n`open\
  \ source` 一种软件模型，源代码对所有人免费。源代码修改是免费的，且必须在互联网上共享。\n\n`operating expense (OPEX)` 一种持续性费用，例如每月云订阅费用。\n\
  \n`original equipment manufacturer (OEM)` 硬件或软件解决方案的原始制造商。\n\n`pay-as-you-go` 一种计费模型，云费用基于每月使用情况。\n\
  \n`Payment Card Industry Data Security Standard (PCI DSS)` 一种与 Visa、MasterCard 和\
  \ American Express 等信用卡持卡人数据安全相关的行业安全标准。\n\n`penetration testing` 一种尝试发现并利用漏洞的安全性测试。另见\
  \ vulnerability assessment（漏洞评估）。\n\n`personally identifiable information (PII)`\
  \ 任何可以追溯到个人的信息组合，例如街道地址、母亲的姓和信用卡号。\n\n`physical to virtual (P2V)` 使用软件代理捕获物理服务器的软件配置，以便重新具有相同配置虚拟机。\n\
  \n`pilot program` 解决方案的小规模实施，随后对其结果进行分析以确定大规模部署是否会成功。\n\n`Platform as a Service\
  \ (PaaS)` 一种云服务模型，其中虚拟机和数据库软件等底层基础设施已配置。`PaaS` 通常被软件开发人员用于为特定的数据分析引擎快速部署数据库、应用程序容器和虚拟机集群。\n\
  \n`private cloud` 由单一组织拥有、控制和使用的云环境。\n\n`proof of value (PoV)` 在云计算背景下，识别云计算的业务价值。\n\
  \n`protected health information (PHI)` 任何可以追溯到个人的医疗信息组合。示例包括血型、处方、健康计划支付详情等。（注：此处原文为\
  \ traced，已修正为 traced）`protected health information (PHI)` 任何可以追溯到个人的医疗信息组合。例如血型、处方、健康计划支付详情等。\n\
  \n`public cloud` 一种通过互联网向所有人提供的自助和计费的 IT 解决方案。IT 解决方案运行在云服务提供商的设备上。参见 Software as\
  \ a Service (SaaS), Infrastructure as a Service (IaaS), 和 Platform as a Service\
  \ (PaaS)。\n\n`Public Key Infrastructure (PKI)` 一种数字安全证书体系，用于保护存储系统和网络通信。\n\n`quality\
  \ of service (QoS)` 在云网络背景下，优先处理网络流量的能力以确保高优先级或时间敏感的流量在低优先级流量之前传输。\n\n`recovery\
  \ point objective (RPO)` 灾难恢复术语，表示最大可接受的数据丢失，通常以分钟、小时、天、周或月为单位。\n\n`recovery time\
  \ objective (RTO)` 灾难恢复术语，表示最大可接受的服务中断时间。\n\n`redundant array of independent disks\
  \ (RAID)` 将多个物理磁盘分组，以增强数据冗余和/或磁盘性能。\n\n\n\n\n\n**重构 (refactoring)** 通常被称为`rip and\
  \ replace`，通过重新设计或获取新的 IT 解决方案，使其在云端中正常运行，因为现有的本地解决方案在云端无法正常工作。\n\n**回归测试 (regression\
  \ testing)** 一种测试方法，对解决方案中与近期代码或配置更改无关的区域进行测试，以确保更改没有意外的负面影响。\n\n**重新托管 (rehosting)**\
  \ 也称为`平移迁移 (lift and shift)`，是一种云迁移策略，允许在几乎或完全不修改的情况下将本地 IT 解决方案迁移到云端。\n\n**远程桌面协议\
  \ (RDP)** 用于通过端口 `3389` 远程管理 Windows 主机。\n\n**表述状态转换 (REST)** 一种连接到基于 HTTP 的资源并检查返回代码和值的程序化方法。\n\
  \n**信息请求 (RFI)** 向组织发出的获取信息的正式查询，例如要求云服务提供商提供特定的服务水平协议详情。\n\n**需求建议 (RFP)** 一种邀请对既定业务需求做出响应的征询，例如要求云服务提供商概述其云服务如何满足业务需求。\n\
  \n**预留实例 (reserved instance)** 一种预先承诺至少一年内使用云计算服务（虚拟机）。与在相同时间内使用按需计费模式相比，预留实例可提供显著的成本节省。\n\
  \n**资源打标记 (resource tagging)** 为云资源添加元数据或额外数据标签，例如将特定的虚拟机标记为属于项目 A。\n\n**投资回报率 (ROI)**\
  \ 一种用于确定支出（如每月云计算成本）价值随时间推移是增加还是减少的计算方法。\n\n**规格优化 (right-sizing)** 云服务与需求的最优匹配，例如由于给定工作负载的内存需求较小而减少虚拟机的\
  \ `RAM` 数量。\n\n**推倒重 (rip and replace)** *参见* 重构。\n\n**风险注册表 (risk register)** 组织资产及其相关威胁和安全控制的集中列表。每个威胁还可以有一个优先级或概率评级值。\n\
  \n**风险处理（接受、转移、规避、缓解）** 处理风险的多种方法，例如风险接受（风险较小，因此不采取任何缓解措施）、风险转移给第三方（`CSP` 或保险提供商）、风险规避（完全不参与该活动）和风险缓解（应用安全控制以减少威胁影响）。\n\
  \n**沙箱 (sandboxing)** 出安全或测试目的而隔离 IT 环境，例如创建一个带有用于测试软件配置的虚拟机的隔离云虚拟网络。\n\n**《萨萨班斯-奥克斯利法案》(SOX)**\
  \ 美国法律，侧重于报告的公司财务文件的真实性以及对举报人的保护。\n\n**缩容 (scaling down)** 减少云解决方案（如虚拟机）的底层计算能力（`CPUs`\
  \ 数量、`RAM` 数量）；也称为`虚拟缩放`。\n\n**扩容 (scaling up)** 增加云解决方案（如虚拟机）的底层计算能力（`CPUs` 数量、`RAM`\
  \ 数量）；也称为`垂直扩展`。\n\n**安全外壳 (SSH)** 一种加密的基于命令行的方法，用于远程管理网络设备和 Linux 主机。\n\n**安全套字层\
  \ (SSL)** 一种网络安全协议，使用 `PKI` 证书中的密钥保护如 `HTTP` 或 `SMTP` 等的流量。已被传输层安全协议 (`TLS`) 取代。\n\
  \n**安全信息和事件管理 (SIEM)** 一种集中系统，可以摄大量的日志和网络流量数据，用于跨时间关联相关事件。\n\n**自助服务 (self-service)**\
  \ 在云计算领域，指客户根据需求配置或取消配置资源的能力。\n\n**服务水平协议 (SLA)** 服务提供商与客户之间的合同文件，规定了运行时间（uptime）水平。\n\
  \n**面向服务的架构 (SOA)** 一种旨在将软件组件组织成可以相互作用的服务的框架。\n\n**简单邮件传输协议 (SMTP)** 用于通过端口 `25`\
  \ 在服务器之间传输电子邮件。\n\n**简单网络管理协议 (SNMP)** 用于远程配置和监控。\n\n**简单对象访问协议 (SOAP)** 软件组件用于交换消息的协议。\n\
  \n**单点登录 (SSO)** 一种允许访问应用程序而无需为每个应用提供凭据的身份验证解决方案。\n\n**软件即服务 (SaaS)** 通过网络访问的云托管应用程序。\n\
  \n**软件定义网络 (SDN)** 介于用户界面和底层设备之间的软件层。\n\n**固态硬盘 (SSD)** 不包含移动部件的存储介质。通常性能优于 HDD。\n\
  \n**竞价实例 (spot instance)** 一种虚拟机部署类型，使用折扣价格的可用计算能力，因此不适用于关键任务工作负载。\n\n**存储区域网络 (SAN)**\
  \ 一种专门传输存储相关流量的网络。服务器看到的存储设备就像本地设备一样。\n\n**结构化查询语言 (SQL)** 一种用于构建查询的编程语言。\n\n**总拥有成本\
  \ (TCO)** 一种识别使用产品或服务相关成本的方法，包括随时间进行的持续管理。\n\n**传输层安全 (TLS)** 一种网络安全协议，使用 `PKI`\
  \ 证书中的密钥保护如 `HTTP` 或 `SMTP` 等的流量。TLS 取替 SSL。\n\n**单元测试 (unit testing)** 一种应用于代码子集的测试技术。\n\
  \n**供应商锁定 (vendor lock-in)** 对特定供应商的系统和数据格式的依赖，使得切换到其他供应商变得困难。\n\n**垂直扩展 (vertical\
  \ scaling)** *参见* 扩容 *以及* 缩容。\n\n**虚拟桌面基础设施 (VDI)** 用户从中央服务器远程访问其计算桌面和应用程序。\n\n\
  **虚拟硬盘 (VHD)** 虚拟机使用的一种虚拟磁盘文件。\n\n**虚拟专用网络 (VPN)** 在越如互联网等不可信的网络上，两个端点之间的加密网络隧道。\n\
  \n**虚拟转物理 (V2P)** 将虚拟机的配置转换为以便在物理服务器上运行。\n\n**虚拟转虚拟 (V2V)** 将一种类型的虚拟机转换为另一种类型，例如从\
  \ Hyper-V 转换为 VMware。\n\n**漏洞评估 (vulnerability assessment)** 一种识别缺陷但不尝试利用它们的安全测试。*参见*\
  \ 渗透测试。\n\n## 索引\n\n*请注意，索引链接指向打印版的页码。在电子阅读器中位置是大致的，点击链接后可能需要向下翻页几次才能到达内容*。\n\n\
