  \ **C.** 数据库服务 (`DBaaS`) 是一种托管数据库服务，这意味着 CSP 负责托管数据库的底层基础设施。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **D** 是错误的。非托管数据库需要云客户安装和配置支持数据库的底层基础设施。`NoSQL` 和 `SQL` 数据库都以托管和非托管的形式提供。\n\
  \n\n\n\n\n# 12. ![Images](img/tick2.jpg) **A.** 存时间（TTL）值决定了 CDN 缓存检查源数据发生变化之前有多长时间。\n\
  \n![Images](img/times.jpg) **B, C,** 和 **D** 是错误的。复制、路径和安全套接层（SSL）的 CDN 配置设置并不决定缓存源数据何时发生变化。\n\
  \n# 13. ![Images](img/tick2.jpg) **D.** DNS CNAME 记录是指向其他 DNS 记录的别名记录。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **C** 是错误的。MX 记录是用于电子邮件传输的交换记录；A 记录使用名称指向 IPv4 地址；PTR 记录是反向查找记录，根据\
  \ IP 地址返回 DNS 名称。\n\n# 14. ![Images](img/tick2.jpg) **B.** CDN 的配置是将数据放置在请求该数据的用户附近，通过减少网络延迟来提高性能。\n\
  \n![Images](img/times.jpg) **A, C,** 和 **D** 是错误的。CDN 不增强安全性、降低成本或帮助符合合规性。\n\n#\
