  #### 自测答案\n\n### 存储媒介\n\n**1.** ![Images](img/tick2.jpg) **C.** 固态硬盘 (SSD) 提供的性能比传统硬盘\
  \ (HDD) 好。自然地，CSP 会为性能提升收取更多费用，因此选择 SSD 而不是 HDD 也会增加云成本。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **D** 是错误的。存储容量、存储介质品牌以及通过 `FTP` 访问云存储对性能的影响均不如使用 SSD 那么显著。\n\n**2.**\
  \ ![Images](img/tick2.jpg) **C.** 去重删除了重复的磁盘块，并将重复项替换为指针，以减少磁盘消耗。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **D** 是错误的。`IOPS` 是磁盘 I/O 吞吐量测量。复制创建数据副本以增强对位置故障的容错性。独立磁盘阵列 (`RAID`)\
  \ 以各种方式将多个磁盘存储设备组织在一起，提高性能并提供容错能力。\n\n**3.** ![Images](img/tick2.jpg) **A.** `RAID\
  \ 0`（磁盘条带）将多个物理磁盘作为一个整体使用以提高性能，但单个磁盘的故障会导致整个磁盘阵列不可用。\n\n![Images](img/times.jpg)\
  \ **B, C,** 和 **D** 是错误的。`RAID 1`（磁盘镜像）和 `RAID 5`（带分布式校验的磁盘条带）都提供容错能力。去重不是与 `RAID`\
  \ 相关的功能；去重是一种减少磁盘消耗的方法。\n\n**4.** ![Images](img/tick2.jpg) **D.** 静态数据加密可以保护存储的数据。读取加密信息需要正确的解密密钥。\n\
  \n![Images](img/times.jpg) **A, B,** 和 **C** 是错误的。去重是减少磁盘消耗的方法。`RAID 1`（磁盘镜像）和 `RAID\
  \ 5`（带分布式校验的磁盘条带）都提供容错能力。\n\n### 云存储配置\n\n**5.** ![Images](img/tick2.jpg) **B.**\
  \ 冷或冷云存储最适合访问频率较低的数据。\n\n![Images](img/times.jpg) **A, C,** 和 **D** 是错误的。增加 `IOPS`\
  \ 和启用存储复制会增加费用。热访问层适合频繁访问的数据，但价格比冷层贵。\n\n**6.** ![Images](img/tick2.jpg) **D.**\
  \ 通过 `REST API` 程序化访问通过 `HTTPS`。\n\n![Images](img/times.jpg) **A, B,** 和 **C** 是错误的。这些网络协议不如\
  \ `HTTPS` 常用于云存储。\n\n**7.** ![Images](img/tick2.jpg) **B.** 地理冗余存储在不同区域保留副本，可以应对区域灾难。\n\
  \n![Images](img/times.jpg) **A, C,** 和 **D** 是错误的。`RAID 0`（磁盘条带）将多个物理磁盘作为一个整体使用以提高磁盘\
  \ I/O 性能。去重是一种减少磁盘消耗的方法。`RAID 1`（镜像）在写入主磁盘时复制到辅助磁盘。\n\n### 云端数据库\n\n**8.** ![Images](img/tick2.jpg)\
  \ **B.** `SQL` 数据库使用结构化的固定模式来定义存储的数据类型。\n\n![Images](img/times.jpg) **A, C,** 和\
  \ **D** 是错误的。`NoSQL` 数据库不使用结构化模式；可以存储许多类型的数据。托管 `SQL` 和 `NoSQL` 数据库为云客户隐藏了与托管相关的底层复杂性。数据库复制并不由结构化模式决定。\n\
