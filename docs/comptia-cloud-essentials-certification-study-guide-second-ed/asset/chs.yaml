  \n## 考试要点\n\n### 安全控制\nCompTIA Cloud Essentials+ CLO-002 考试很可能会出现许多基于场景的问题，要求你选择“最佳”或“最合适”的安全控制措施。所有列出的答案选项在技术上可能都是正确的，因此务必为每个场景选择最佳解决方案。例如，对于需要为信用卡用户数据提供数据机密性的场景，加密可能是最佳安全控制措施。\n\
  \n### 认证总结\n在本章中，你学习了`CIA` 安全三要素（机密性、完整性和可用性）。你学习了实施安全控制是为了解决安全漏洞，并且云安全控制与本地 IT\
  \ 安全控制非常相似。加密等常用解决方案可以应用于云端，以为数字资产提供机密性。可以使用对称加密密钥对存储在云端的数据进行加密，可以使用如`TLS`等安全协议对网络通信进行加密，`TLS`使用了对称和非对称加密。\n\
  \n你还学习了如何通过`hashing`（哈希）和数字签名进行完整性检查以确保数据的有效性并对谁发送了网络传输提供保证。可用性的讨论是在确保云端 IT 系统和数据持续访问背景下进行的，例如将云托管的虚拟机复制到次级地理区域。\n\
  \n本章还涵盖了身份提供者如何实现中心化并被第三方信任（即身份联邦）。你学习了多因素身份验证如何增强登录安全性，最后，你学习了单点登录如何消除用户在（初始身份验证后）对想要访问的每个额外应用程序进行重新身份验证的需求。\n\
  \n#### 两分钟演练\n\n#### 机密性\n- 机密性保护敏感数据。\n- `PKI` 证书可以用于实现机密性，并可以颁发给用户、设备和软件。\n- `PKI`\
  \ 证书包含公私钥对。\n- 数据机密性安全控制可以适用于数据存储和网络通信。\n- 数据加密通过加密密钥将数据输入加密算法。\n- 加密密钥的位数越高，加密强度越强。\n\
  - 未加密的数据称为明文，加密的数据称为密文。\n- 对称加密使用相同的密钥进行加密和解密。\n- 非对称加密使用公钥进行加密，并使用数学上相关的私钥进行解密。\n\
  - `RC4`、`Blowfish` 和`AES` 是对称加密的示例。\n- `RSA`、`ECC` 和`Elal`是非对称加密的示例。\n- 传输层安全（`TLS`）是取代`SSL`的网络安全协议。\n\
  - `TLS` 需要服务器端`PKI`证书来支持端口 `443` 上的`HTTPS`。\n\n#### 数据完整性和消息认证\n- 完整性安全控制用于确保数据未被未经授权的用户修改。\n\
  - `Hashing`（哈希）对数据应用算法，生成一个称为`hash`或消息摘要的唯一值。哈希的生成决定了数据的有效性；如果文件的当前哈希与该文件的过去哈希匹配，则说明文件未被修改。\n\
  - `MD5` 和`SHA-256` 是哈希算法的示例。\n- 数字签名用于确保消息来自其声称来源的用户或设备。\n- 私钥用于创建数字签名；公钥用于验证数字签名。\n\
  \n#### 可用性\n- 可用性安全控制确保 IT 服务和数据可以持续访问。\n- 云服务水平协议（`SLAs`）包含有关服务可用性的细节。\n- 网络攻击如`DoS`和`DDoS`试图使系统无法供合法使用。\n\
  - IT 系统和数据的可用性可以通过数据备份、复制和冗余来实现。\n\n#### 身份与管理\n- 身份访问管理始于安全原则（用户、设备、软件）。\n- 安全原则存储在身份提供者中。\n\
  - 被第三方信任的中心化身份提供者定义了身份联邦。\n- 身份提供者可以使用私钥对身份令牌进行数字签名，应用程序使用相关的公钥进行验证。\n- 单点登录（`SSO`）消除了用户在初始身份验证后对每个应用程序重复身份验证的需求。\n\
  - 多因素身份验证（`MFA`）结合了“你知道的”和“你拥有的”等类别。\n- 数据标记可进一步控制（授权）对敏感数据的访问。\n\n## 自测\n以下问题将帮助你衡量对本章内容的理解程度。如所示，某些问题可能有多个正确答案，请务必仔细阅读所有选项。\n\
