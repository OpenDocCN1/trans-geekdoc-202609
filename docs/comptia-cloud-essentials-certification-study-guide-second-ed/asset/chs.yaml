  \ 上。\n\n\n\n\n[content]\n\n## 11\n![Images](img/tick2.jpg) **B** 和 **D.** 负载均衡将客户端应用请求分到后端服务器池，以提高应用程序性能和应对服务器故障的恢复能力。\n\
  \n![Images](img/times.jpg) **A** 和 **C** 是错误的。安全和存档与负载均衡没有密切关系。\n\n## 12\n![Images](img/tick2.jpg)\
  \ **C.** 自动伸缩（也称为水平扩展）可以配置为在应用程序利用率高于或低于配置阈值时添加或删除虚拟机。\n\n![Images](img/times.jpg)\
  \ **A, B,** 和 **D** 是错误的。负载均衡将客户端应用请求分到后端服务器池，以提高应用程序性能和应对服务器故障的恢复能力。弹性是云计算的一个特性，定义了云资源的快速供应和撤销。监控是一种被动活动，与为繁忙应用程序添加或删除虚拟机没有关系。\n\
  \n## 13\n![Images](img/tick2.jpg) **B.** 水平扩展意味着根据应用程序的忙程度添加虚拟机。\n\n![Images](img/times.jpg)\
  \ **A, C,** 和 **D** 是错误的。收缩（Scaling in）意味着删除虚拟机，而不是添加虚拟机。垂直扩展与单个虚拟机资源（如 vCPU 和 RAM）有关。向上扩展是垂直的，而不是水平的。\n\
  \n## 14\n![Images](img/tick2.jpg) **B.** 用于 Web 应用连接的 DNS 名称最可能指向一个已经失效的服务器 IP 地址。该名称必须解析到负载均衡器的\
  \ IP 地址。\n\n![Images](img/times.jpg) **A, C,** 和 **D** 是错误的。DNS 名称最终必须解析到 IP 地址才能被正确解析。端口\
  \ `3389` 用于 RDP，端口 `389` 用于 LDAP；这两者没有一个用于访问 Web 应用程序。\n\n## 15\n![Images](img/tick2.jpg)\
  \ **C.** 无响应的后端服务器将不再通过负载均衡接收客户端请求。\n\n![Images](img/times.jpg) **A, B,** 和 **D**\
  \ 是错误的。无响应的后端服务器不会被负载均衡器重建。添加服务器是水平扩展，而不是垂直扩展。仅仅一个后端服务器无响应，并不意味着其他服务器无法满足客户端应用的请求。\n\
  \n## 第 7 章：云计算基础设施\n\n![Images](img/chap1.jpg)\n\n### 认证目标\n- 7.01 云中的虚拟化\n- 7.02\
  \ 云虚拟机组件\n- 7.03 高性能计算\n\n![Images](img/tick.jpg) 两分钟演练\n\n**问答自测**\n\n虚拟机是云计算的骨干力力。在本章中，你将学习基于云的计算资源，例如虚拟机。集群（虚拟机节点的集合）也属于云计算服务的范畴。\n\
  \n我们将从讨论如何通过云服务提供商数据中心的虚拟机管理程序（hypervisors）来实现云虚拟化开始，然后简要概述如何规划虚拟机尺寸以适应虚拟机工作负载。\n\
  \n接下来，我们将识别特定的虚拟机组件，例如操作系统镜像、虚拟网络接口、自动伸缩和自定义路由。我们还将涵盖在 IP 划分和跳板机（jump boxes）背景下，对\
  \ Linux 和 Windows 云虚拟机进行远程管理。\n\n最后，我们将讨论何时以及如何使用并行处理节点集群。\n\n##### 认证目标 7.01\n\
  #### 云中的虚拟化\n\n正如你从第 1 章回记得，虚拟机管理程序是托管客机的物理服务器。云服务提供商数据中心包含大量的第一型虚拟机管理程序，如 `VMware\
  \ ESXi`、`Microsoft Hyper-V` 或基于 Linux 的 `Kernel Virtual Machine (KVM)`。第一型虚拟机管理程序称为称为裸金属*（bare\
  \ metal）管理程序，因为它们直接运行在物理硬件上，不依赖于现有操作系统。第二型虚拟机管理程序作为现有操作系统中的应用程序运行。\n\n云计算资源——例如虚拟机——运行在这些管理程序上。云虚拟机的部署和使用取决于运行在虚拟机中的工作负载。\n\
  \n![Images](img/onjob.jpg)\n\n**在本地和云计算环境中，你将读到文献并听到技术人员使用*hypervisor*（虚拟机管理程序）一词来指物理服务器。从技术上讲，虚拟机管理程序是操作系统软件；物理服务器可以用于非虚拟机管理程序的用途。**\n\
  \n某些云服务提供商提供其他类型的虚拟化，例如虚拟桌面基础（VDI）解决方案，它从集中的虚拟化服务器提供用户桌面。\n\n#### 虚拟机尺寸\n\n运行一个用户数量较少的小网站并不像运行复杂数据集那样需要大量的动力。虚拟机尺寸（有时称为\
  \ `instance type`，实例类型）决定了虚拟机的性能。常见的虚拟机尺寸组成部分包括：\n\n![Images](img/tick.jpg)\n- vCPU\
  \ 数量\n- RAM 数量\n- 支持的数据磁盘数量\n- 磁盘 IOPS 吞吐量测量\n- 支持的网络接口数量\n- 网络性能\n\n你可能会选择满足特定需求（例如图形密集型应用程序）的虚拟机尺寸。请记住，更多的计算能力和速度意味着更高的成本。另一个考虑是，取决于地理区域，某些虚拟机尺寸可能仅在某些地区可用。\n\
  \n虚拟机尺寸不仅要在规划和部署期间考虑，还应随着时间进行监控，以确保最佳匹配（一种尺寸并不适用于所有人！）。正如图 7-1 所示，你可以在虚拟机存在后更改其尺寸，尽管虚拟机可能需要重启以应用新设置。\n\
  \n**图 7-1 选择 Amazon Web Services 实例类型**\n![Images](img/F07-01.jpg)\n\n![Images](img/exam.jpg)\n\
  \n**虽然考试可能会提到*虚拟机*尺寸，但你也可能看到提到*实例*尺寸。在考试和现实世界的云计算中，*虚拟机*和*实例*是同义词。**\n\n![Images](img/onjob.jpg)\n\
  \n**你应该配置告警，以便在虚拟机过度繁忙或空闲时通知你，以优化尺寸以及相关的成本。**\n\n##### 认证目标 7.02\n#### 云虚拟机组件\n\n\
  正如物理计算机由许多组件协同工作一样，云中的虚拟机也由许多虚拟组件组成。你计划在虚拟机中运行的工作负载决定了你应该使用哪些虚拟组件以及应该如何配置它们，正如本节所述。\n\
  \n#### 操作系统选择\n\n云虚拟机使用*操作系统镜像*。除了包含操作系统（OS）外，镜像可能包含特定的操作系统设置以及额外的软件，例如 MySQL 数据库服务器和对\
  \ Python 语言的支持。\n\n随着你云使用的增加，你很可能会发现自己在为未来的云虚拟机部署创建自定义镜像。图 7-2 展示了如何在 Microsoft\
  \ Azure 部署期间选择 OS 镜像。\n\n**图 7-2 选择 Microsoft Azure 虚拟机镜像**\n![Images](img/F07-02.jpg)\n\
  \n\n\n\n出于管理目的，连接云端 Windows 虚拟机的方式与连接云端 Linux 虚拟机不同。Windows 和 Linux 的身份验证选项也不同，但某些云端\
  \ Windows 和 Linux 配置（例如虚拟机自动伸缩）并不特定于所选操作系统。\n\n## 远程管理\n\n无论你部署的是 Windows 虚拟机还是\
  \ Linux 虚拟机，在某时刻你都可能需要远程管理操作系统。如果你计划使用本地设备远程管理云虚拟机，你将需要一种方法来连接这些虚拟机，可以直接通过分配给每台虚拟机的公网\
  \ IP 地址（出于安全考虑，不建议这样做），或者通过一个配置了公网 IP 地址的单一虚拟机（`jump box`），如图图 7-3\n\n使用远程桌面协议 (`RDP`)\
  \ 的 Windows 远程管理通过 TCP 端口 `3389` 进行。使用安全外壳 (`SSH`) 的 Linux 远程管理通过 TCP 端口 `22` 进行。你的本地防火墙需要允许此类出站流量，云端防火墙也需要允许此类流量流向将被远程管理的虚拟机。\n\
  \n## Linux 虚拟机身份验证\n\n云端 Windows 虚拟机的身份验证通常配置为使用用户名和密码，而 Linux 虚拟机可以使用两种身份验证方法之一：\n\
  \n![Images](img/square-1.jpg) 用户名和密码\n\n![Images](img/square-1.jpg) SSH 公钥认证\n\n\
  通过用户名和密码对 Linux 进行验证是单因素认证（你所知道的），认为不如 SSH 公钥认证安全。公钥认证使用公钥和私钥对。这两个密钥在数学上是相关的。公钥存储在云端的\
  \ Linux 主机上，而只有授权的用户（或设备）才能访问相关的私钥，该私钥应被备份在安全位置。根据配置的不同，身份验证可能只需要拥有私钥，也可能还需要密码和用户名。图\
  \ 7-4 显示了在 Azure 中部署 Linux 虚拟机时的 SSH 公钥认证设置。\n\n**图 7-4** Microsoft Azure 中的 Linux\
  \ SSH 公钥配置\n\n![Images](img/F07-04.jpg)\n\n## 虚拟机自动伸缩\n\n你可以一起部署一组虚拟机进行水平扩展。水平扩展有两种形式：\n\
  \n![Images](img/square-1.jpg) **向外扩展 (Scaling out)** 添加虚拟机节点\n\n![Images](img/square-1.jpg)\
  \ **向内收缩 (Scaling in)** 移除虚拟机节点\n\n当应用需求量很高时，可以添加虚拟机来处理负载。当业务空闲时，可以移除虚拟机，因为它们不再被需要——这同时也减少了不必要的云成本。图\
  \ 7-5 显示了一个自动伸缩配置示例。\n\n**图 7-5** 为 Microsoft Azure 虚拟机范围集启用自动伸缩\n\n![Images](img/F07-05.jpg)\n\
  \n### 虚拟网络适配器\n\n要在云虚拟网络上通信，虚拟机必须与网络接口关联，网络接口是一种云资源，如图图 7-6\n\n每个网络接口都有设置，如图图 7-7\
  \ 所示。\n\n**图 7-7** 网络设置\n\n![Images](img/square-1.jpg)\n\n### 路由表项\n\n如果你需要控制流量流，可以指定自定义表项。这通常是配置，如图图\
  \ 7-8 所示。\n\n**图 7-8** 自定义路由\n\n![Images](img/F07-08.jpg)\n\n## 认证目标 7.03\n\n###\
  \ 高性能计算\n\n在单个虚拟机没有运行复杂任务的力量或能力场景下（例如医学研究或财务建模），可以考虑将高性能虚拟机组合在一起。高性能计算 (HPC) 的目的是通过节点集群加速复杂数据分析。HPC\
  \ 集群需要一种方法来在工作节点之间协调任务。你可以在图 7-9 中了解 HPC 的布局。\n\n**图 7-9** 高性能计算\n\n![Images](img/F07-09.jpg)\n\
  \nHPC 集群可以在本地或云端配置。在云端，HPC 是一种托管服务。这意味着安装和配置操作系统以及集群软件以协同工作的复杂性对云客户是隐藏的。监控云端 HPC\
  \ 的性能可以确保以最低成本高效地处理复杂任务。AWS 环境中监控的一个示例是通过 CloudWatch 服务配置警报通知。图 7-10 显示了如何通过选择合适的操作系统映像在\
  \ Azure 中部署 HPC 节点节点。\n\n**图 7-10** 部署 Microsoft Azure 节点节点\n\n![Images](img/F07-10.jpg)\n\
  \n### 练习 7-1\n\n#### 在云中部署基于 Windows 的虚拟机\n\n在本次练习中，你将在 Microsoft Azure 云中创建一个 Windows\
  \ 虚拟机。此练习依赖于已完成练习 1-1。\n\n1. 使用你的网页浏览器登录 `https://portal.azure.com` 的 Microsoft\
  \ Azure 门户。\n2. 在左侧导航窗的顶部，点击“创建资源 (Create a Resource)\n3. 点击“计算 (Compute)”类别并选择“虚拟机\
  \ (Virtual Machine)这将启动创建虚拟机向导并让你进入“基准 (Basics)”屏幕。\n4. 选择一个现有的资源组或创建一个。\n5. 使用以下值部署\
  \ Windows 虚拟机：\n   - 名称：`WinSrv1`\n\n\n\n\n\n![Images](img/square-1.jpg) ：`Windows\
  \ Server 2019 Datacenter`\n\n![Images](img/square-1.jpg) 用户名：`admineast1`\n\n![Images](img/square-1.jpg)\
  \ 密码：`输入符合网页上要求的密码` 注意：你在练习 7-2 中将需要此密码。\n\n![Images](img/square-1.jpg) 公共入站端口：允许所选端口，`RDP\
  \ (3389)`\n\n![Images](img/onjob.jpg)\n\n**直接将 RDP 端口开放到 Internet 会对重要的虚拟机带来安全风险，但在本练习中这只是为了演示之目的。在工作中，请使用加固的跳板机（jump\
  \ box）来远程访问仅配置私有 IP 地址的云虚拟机。**\n\n6. 重复点击屏幕底部的 `Next` 按钮，直到到达向导的管理界面。确保 `Boot Diagnostics`（启动诊断）选项设置为\
  \ `Off`。\n7. 点击 `Review + Create`，然后点击 `Create`。\n\n## 练习 7-2\n### 远程管理云 Windows\
  \ 虚拟机\n在本练习中，你将连接到 Microsoft Azure 中现有的 Windows 虚拟机。此练习取决于完成练习 7-1。\n\n1. 如果你不在\
  \ Microsoft Azure 门户，请使用浏览器登录 `https://portal.azure.com`。\n2. 在左侧导航栏中点击 `Virtual\
  \ Machines`。\n3. 从列表中点击 `WinSrv1`。\n4. 在 `Overview`（概述）页面，查看右侧并复制 `Public IP Address`（公共\
  \ IP 地址）字段中的虚拟机 IP 地址，如图 7-11 所示。\n\n**图 7-11** Microsoft Azure 虚拟机公共 IP 地址\n\n\
  ![Images](img/)\n\n5. 在你的本地 Windows 计算机上，打开开始菜单并启动 `Remote Desktop`（远程桌面）应用。\n6.\
  \ 将之前复制的 IP 地址粘贴到 `Computer` 字段。\n7. 点击左下角的 `Show Options`，在 `User Name` 字段输入 `admineast1`，然后点击\
  \ `Connect`。\n8. 提示时，输入为 `admineast1` 配置的密码。（此密码在练习 7-1 中设置。）\n9. 提示时，选择信任连接。\n\
  10. 你现在已远程连接到运行在 Microsoft Azure 云中的虚拟机。\n11. 移动到屏幕右上角并点击 `X` 关闭远程桌面。\n12. 在 Azure\
  \ 门户中，选择 `WinSrv1`。点击 `Stop` 按钮以防止产生费用。\n\n## 考试考点\n### 模板与自动化\nCompTIA Cloud Essentials\
  \ CLO-002 考试可能会提出有关自动化任务的问题。例如，在 Microsoft Azure 中手动部署虚拟机时，最后页提供了将设置保存为模板的选项。模板也可以手动创建或通过各种网站\
  \ `https://github.com`。\n\n### 认证总结\n本章讨论了云环境中的计算基础设施。你学习了虚拟机如何实现操作系统虚拟化，以及如何根据虚拟机负载选择合适的虚拟机尺寸。你接触了如何部署\
  \ Windows 和 Linux 镜像，以及如何分别通过 `RDP` 和 `SSH`、公共 IP 地址或跳板机管理它们。你还学习了 `autoscaling`（自动伸缩）如何通过在繁忙时\
  \ `scaling out`（扩展）以及在需求减少时 `scaling in`（缩小）来解决性能问题。最后，你学习了高性能计算（`HPC`）如何用于在并行工作的虚拟机节点集群上执行大规模计算。\n\
  \n#### 两分钟演练\n#### 云中的虚拟化\n![Images](img/tick1.jpg) 虚拟机程序运行虚拟机。\n![Images](img/box1.jpg)\
