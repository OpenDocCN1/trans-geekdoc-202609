  \n## 第 8 章\n\n## 云端应用与大数据\n\n### 认证目标\n\n* 8.01 服务面向的架构\n* 8.02 区块链\n* 8.03 应用容器\n\
  * 8.04 大数据分析\n\n![Images](img/tick.jpg) 两分钟快速演练\n\n**Q&A** 自测\n\n本章探讨了软件如何在云计算环境中运行。通过创建新的云应用程序或将现有应用程序迁移到云端，允许组织利用巨大的云计算、存储和网络资源来支持应用程序和数据分析。\n\
  \n我们首先讨论在云端中使用服务面向的架构来创建模块化软件组件。微服务是这种架构的关键部分。\n\n接下来，我们关注区块链技术以及组织如何利用云进行私有区块链使用。我们还将探索使用应用容器与在虚拟机中运行程序相比的优点。\n\
  \n最后，我们指明什么是大数据，以及云服务如何使这些海量数据集在数据库中高效存储，并通过集群进行分析。\n\n### 认证目标 8.01\n\n#### 服务面向的架构\n\
  \n在云计算世界中，服务是托管在云端作为独立云函数或应用程序编程接口 (`API`) 的计算机程序，它是一系列函数的集合。\n\n云服务可以用于云虚拟机内部、应用容器内部，甚至可以被本地软件组件调用。可以利用现有的云提供商服务，也可以创建自定义的云服务。服务提供特定的功能，例如在当源数据发生变化时自动更新网站内容（这被称为内容管理系统，或\
  \ `CMS`），或使用云分析服务检查最新的股票报价并分析交易趋势。\n\n服务面向的架构 (`SOA`) 是一种框架，旨在将分布式软件组件组织成服务，这些服务可以在网络上相互交互，无论每个服务是属于同一个应用程序还是不同的应用程序。服务可以同时存在于本地和云端。\n\
  \n现代云软件开发实践包括微服务，微服务可以用任何编程语言编写，包括 `Java`、`C++`、`C#` 和 `F#`。\n\n#### 微服务\n\n年前，软件开发者会将整个应用程序作为一个单元构建，这也称为单体架构（monolithic）。今天，软件开发者将此过程去中心化。`microservice`\
  \ 是服务面向架构的一个示例；它是一个具有与其他软件组件发送或接收消息的小程序。考虑“分而治之”，将大型应用分解为较小的功能组件。每个微服务执行特定的功能。例如，一个微服务可能负责验证网络表单上的用户输入，而另一个微服务可能负责打印网络表单。微服务可以向现有的云提供商\
  \ API 进行调用，例如调用云存储 API。仅使用云 API 用的应用程序被称为云原生应用。\n\n`Loose coupling`（松耦合）是一种微服务的计算机编程方法，其中一个微服务可以通过消息队列向另一个微服务传递消息。在云端，软件开发者可以将消息队列作为一种云存储。好处处是，当发送服务传递消息时，接收的微服务不需要运行，因为可以随时从消息队列中读取消息。\n\
  \n测试软件是至关重要的质量保证 (`QA`) 活动。每个微服务都可以独立于其他微服务进行测试。这意味着测试目标可以非常集中于每个特定微服务的功能。这可以在其他应用微服务继续运行的同时加速测试。\n\
  \n##### 微服务伸缩\n\n每个微服务也可以单独伸缩以满足需求。传统的应用扩展使用负载均衡器来接收应用程序的客户端请求。然后，负载均衡器将这些请求路由到最不忙、响应最快的后端服务器。这意味着每个后端服务器（虚拟机）都有整个应用程序的完整副本。\n\
  \n使用微服务，满足需求的扩展是根据需要按微服务设置的。例如，一个购物网站可以把“搜索”或“购物车结账”与“打印发票”微服务分开伸缩。这更有效地利用了底层计算资源，将计算能力引导到最需要的地方。\n\
  \n##### 微服务间的通信\n\n那么，微服务是如何相互传递消息的呢？如前所述，微服务消息可以丢入并从消息队列中读取。但这在网络上使用什么类型的传输方式呢？\n\
  \n\n\n\n\n超文本传输协议（HTTP）是一种常用的网络通信协议，用于在微服务之间交换消息（通常通过消息队列）。例如，微服务可以通过 HTTP 进行云 API\
  \ 调用，比如处理队列中的消息。理想情况下，应使用安全的超文本传输协议（HTTPS）来加密流量。HTTPS 要求服务配置 PKI 证书（公钥基础设施证书）。PKI\
  \ 证书中的密钥用于网络传输的加密和解密。如果说 HTTP/S 是传输机制，那么表述状态转移（REST）就是一种连接到资源统一资源标识符（URI）并检查返回代码和值的方法。\n\
  \n![Images](img/onjob.jpg)\n\nURI 标识一个资源，但它并不像统一资源定位符（URL）那样指明如何通过网络访问该资源。URL 规定了特定的协议或访问方法，例如\
  \ `http://`、`https://`、`ftp://` 等。URL 是 URI 的一种类型，规定了如何获取资源。\n\n与 RESTful 通信一样，简单对象访问协议（SOAP）也用于微服务之间交换消息，但它略有不同，因为它是一种标准化协议。SOAP\
  \ 并不像 REST 那样绝都在 HTTP 上实现；SOAP 通常使用其他网络协议，如简单邮件传输协议（SMTP）或文件传输协议（FTP）来实现。SOAP 消息交换格式通常是可扩展标记语言（XML），而\
  \ REST 的标准格式是 JavaScript 对象表示法（JSON）。\n\n![Images](img/onjob.jpg)\n\n从技术上讲，REST\
  \ 并不一定使用 HTTP，但它通常会使用，因为使用传输控制协议（TCP）等其他协议最终仍需要进行 HTTP 调用。软件开发者知道 REST 通常使用 HTTP，而\
  \ SOAP 在通常使用的底层网络协议方面分布得更广。\n\n## 内容管理系统\n\n使用面向服务架构的 Web 应用工作（无论是本地还是云端），意味着管理由这些\
  \ Web 应用提供的内容，这些应用也可以是网站。网站由在客户端 浏览器应用程序中显示的网页组成。Web 应用并不一定使用浏览器；例如，考虑 Dropbox 手机应用，它用于通过\
  \ Web 连接到云数据。内容管理涵盖数据的创建、保护、修改和删除。\n\n内容管理系统（CMS）通过向内容管理员隐藏底层创建和管理的复杂性，便于 Web 应用内容的管理。例如，想象一个没有\
  \ IT 知识的小型企业主想要创建一个业务网站。使用 CMS 允许这个非技术用户在无需编写单行代码的情况下创建一个功能性网站。在企业级，CMS 解决方案还可以处理文档管理功能，如版本控制以及文档的签入和签出。WordPress\
  \ 和 Drupal 是常见的 CMS 解决方案示例。\n\n![Images](img/exam.jpg)\n\nCMS 工具允许没有详细技术知识的用户创建网站内容。这包括允许用户上传和管理文档的接口，例如文档工作流解决方案。\n\
  \n## 认证目标 8.02\n\n## 区块链\n\n在 2008 年金融危机之后，许多人有了不信任政府以及全球银行金融系统的理由。这场金融崩溃导致了由神秘身份“中本聪”（Satoshi\
  \ Nakamoto）创建的比特币诞生，这是区块链技术的首次成功实现。区块链技术利用密码学和数百万台计算机之间的协作，建立了一个受信的、去中心化的公共交易账本，能够高效永久地记录双方之间的交易，且这种方式既是可验证的又是匿的（不依赖银行、政府或任何类型的合约管理器）。由于区块链不依赖外部实体，因此它被称为自主环境。组织可以在云端部署私有区块链，供企业（而非公共）使用。区块链中可以包含许多类型的数字资产，例如这个小样本：\n\
  \n![Images](img/square-1.jpg) 音乐\n\n![Images](img/square-1.jpg) 文学\n\n![Images](img/square-1.jpg)\
  \ 金融交易\n\n\n\n\n\n比特币等加密货币的有趣之处在于，与美元（`USD`）或瑞士法郎（`CHf`）等物理货币不同（后者可以根据货币政策按需要大量量打印），比特币的上限为\
  \ 2100 万个。这意味着可用的比特币永远不会超过 2100 万个，尽管比特币可以被分成更小的单位，就像美元可以拆分成更小面值的硬币一样。\n\n加密货币缺乏政府控制这一点同样有趣，因为它可以减少腐败和可疑行为，因为加密货币交易依赖区块链技术，而区块链交易是透明的；它们存在于数字公共交易账本中。然而，在大多数国家，加密货币的收益是纳税的。在美国，美国国税务局（`IRS`）一直在打击不报告通过加密货币获得收入的逃税者；在加拿大，加拿大税务局（`CRA`）现在也在同样的事情（参见图\
  \ 8-3），世界上其他许多政府也是如此。\n\n**图 8-3** 加拿大税务局加密货币网页\n\n![Images](img/F08-03.jpg)\n\n\
  你可能在想，这与云有什么关系？企业可以在企业内部实施自己的区块链技术变体。云服务提供商的区块链解决方案可以使用区块链技术使企业能够将业务数字化，例如处理智能合约。将区块链与加密货币并不是云服务提供商的解决方案；区块链必须是去中心化的，不能由单一组织拥有或管理。软件开发人员还可以利用云计算来创建和测试区块链及加密货币解决方案。\n\
  \n### 认证目标 8.03\n\n## 应用容器\n\n`application container`（应用容器）为应用程序文件及其依赖与运行容器的主机系统提供逻辑隔离。容器基于镜像。使用应用容器化是直接在操作系统内安装和运行应用程序的替代方案。软件开发人员喜爱应用容器，因为他们可以专注于应用（而不是操作系统），应用容器可以轻松移动到不同的容器主机，而且应用容器的启动速度比虚拟机得多，因为它们使用已经在运行的底层宿主机操作系统。\n\
  \n`Docker` 是允许管理和执行应用容器常用的软件，尽管存在其他解决方案，例如基于 Linux 的 `LXD` 容器管理器解决方案。在云中托管容器属于平台即服务（`PaaS`）云服务模型。`Docker`\
  \ 可以在 `Unix`、`Linux` 或 `Windows` 操作系统中运行，包括在云虚拟机内部，并有自己的命令行环境。正如你在图 8-4 中所示，你可以部署已安装\
  \ `Docker` 即可就绪的云虚拟机。\n\n**图 8-4** 在 Microsoft Azure 中部署 Docker 虚拟机\n\n![Images](img/F08-04.jpg)\n\
  \n### 容器镜像\n\n`container image`（容器镜像）由运行应用程序或微服务所需的文件组成。与虚拟机不同，容器镜像不包含操作系统（`OS`）文件。相反，镜像依赖于底层主机操作系统。\n\
  \n因此，Linux 容器镜像将在 Linux 上运行。许多实现规避此限制的方法是使用单个轻量级虚拟机。例如，Windows 版 `Docker` 可以单个轻量级虚拟机。\n\
  \n### 容器\n\n`container`（容器）是 `container image` 的运行时实例。这是一个轻量、隔离的包，包含了运行软件所需的所有内容：代码、运行时、系统工具、应用程序库、设置和数据库。\n\
  \n`Docker` 是允许管理和执行应用容器常用的软件，尽管存在其他解决方案，例如基于 Linux 的 `LXD` 容器管理器解决方案。在云中托管容器属于平台即服务（`PaaS`）云服务模型。`Docker`\
  \ 可以在 `Unix`、`Linux` 或 `Windows` 操作系统中运行，包括在云虚拟机内部，并有自己的命令行环境。\n\n`container` 是\
  \ `container image` 的运行时实例。这是一个轻量、隔离的包，包含了运行软件所需的所有内容：代码、运行时、系统工具、应用程序库、设置和数据库。\n\
  \n## 大数据分析\n\n大数据分析是检查大型数据集以发现隐藏的模式、相关性、市场趋势和其他有助于做出更佳决策的用用信息的过程。\n\n### 认证目标 8.04\n\
  \n#### 物联网\n\n物联网（`IoT`）是指嵌入了传感器、软件和其他技术的物理对象（“事物”）构成的网络，其目的是通过互联网与其他设备和系统进行连接并交换数据。\n\
  \n\n\n\n\n云服务提供商以集中式 IoT 数据存储库的形式提供 IoT 解决方案。您可以将 IoT 设备注册到云存储库，这样通过互联网从设备传输的数据就可以在一个位置可用。流式数据可能包括视频流、音频、医疗患者生命体征统计等。这些收集到的\
  \ IoT 数据随后可以输入云数据分析解决方案中，以发现模式并进行建模。\n\n安全方面的考虑是，许多 IoT 设备出厂时带有默认设置，这些设置会带来安全问题，例如无法更改凭据的嵌入式\
  \ Web 界面。在某些情况下，即使发现了安全漏洞，供应商也不会提供任何 IoT 设备更新！在考虑收集可能被篡改的云端 IoT 数据时，请记住这一点。一种解决方案是仅使用符合严格安全标准的\
  \ IoT 设备，或者让开发者编写代码来分析传入的 IoT 数据。\n\n#### 机器学习\n\n人工智能（AI）是一个宽泛的概念。AI 解决方案通过利用技术模拟人类的智能行为。机器学习（ML）在此基础上更进一步，使技术人员能够“教导”软件根据大数据做出决策和预测。机器学习的示例包括从过去的经验中学习、从海量数据中提取意义以识别未来趋势，以及理解语音模式。\n\
  \nML 工具允许您创建训练模型来“教导”软件如何做出符合人类要求的决策。Microsoft Azure Machine Learning Studio 是一个\
  \ GUI 工具，允许您将数据源和数据分析组件拖放到设计画布上，以识别诸此类项目：\n\n![Images](img/square-1.jpg) 与移民、婚姻状况、种族和行业最可能的收入水平\n\
  \n![Images](img/square-1.jpg) 财务信用风险\n\n![Images](img/square-1.jpg) 心脏病高风险医疗患者\n\
  \n![Images](img/square-1.jpg) 异常天气事件概率\n\n#### 练习 8-1：创建 Microsoft Azure 队列\n\n\
