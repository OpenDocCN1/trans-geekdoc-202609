  \ tests`）因为尝试利用发现的漏洞，因此被认为是主动的。\n\n\n\n\n\n# 认证目标\n\n- 5.01 存储媒体\n- 5.02 云存储配置\n\
  - 5.03 云端数据库\n- 5.04 内容交付网络\n\n![Images](img/tick.jpg) 两分钟快速演练\n\n**问答** 自测\n\n\
  ***\n\n数据存储仍然是云计算的重要组成部分。云服务提供支持 `software-defined storage`（软件定义存储），这意味着云客户在配置云存储时，无需处理底层存储基础设施的复杂性。本章将向您介绍各种影响云存储性能和成本的存储介质。\n\
  \n我们将首先讨论云存储配置，例如为了满足业务需求而可以启用的复制和磁盘性能设置。接下来，我们将识别 SQL 数据库和 NoSQL 数据库之间的区别。最后，我们将研究如何将数据复制到地理区域，以便将内容靠近需要它的用户。\n\
  \n## 认证目标 5.01\n\n### 存储媒体\n\n存储在电子随机访问存储器（`RAM`）中的数据被称为`易失性`（volatile）；换句话说，它的保留取决于向计算机提供的持续电流，当计算机关闭时数据会被擦除。存储介质被称为`非易失性`（nonvolatile）；它不需要持续电流来保留数据。在云中，`RAM`\
  \ 和存储介质都是可配置的。图 5-1 显示了如何确定分配给虚拟机器的 `RAM` 数量以及所使用的存储类型的一个示例。\n\n**图 5-1** Microsoft\
  \ Azure 虚拟机尺寸选项\n\n![Images](img/F05-01.jpg)\n\n云服务提供商负责物理存储基础设施，基于此向客户提供云存储服务。物理存储有多种不同的驱动器类型，具有不同的配置设置。\n\
  \n### 驱动器类型\n\n硬盘（`HDD`）存储使用旋转磁盘盘片并通过磁性存储数据。这种存储介质具有移动部件。固态硬盘（`SSDs`）使用闪存代替旋转磁盘盘片，被认为比\
  \ `HDD` 更安静、更快。正如您预期的，在云中选择 `SSD` 的成本比选择 `HDDs` 高。\n\n#### IOPS\n\n磁盘吞吐量通过每秒输入/输出次数（`IOPS`）衡量。图\
  \ 5-2 显示了虚拟机操作系统磁盘选项，其中 `Premium SSD` 提供的吞吐量比 `Standard HDD` 高。更高的 `IOPS` 意味着更好的磁盘性能，您应该根据\
  \ VM 工作负载需求考虑是否增加 `IOPS`。\n\n**图 5-2** Microsoft Azure 虚拟机磁盘选项\n\n![Images](img/F05-02.jpg)\n\
  \n云服务提供商通常将其巨大的存储阵列组织成专用存储区域网络（`SANs`），并采用独立磁盘冗余阵（`RAID`）配置以提高性能和对磁盘故障的恢复能力。存在多个级别的\
  \ `RAID` 配置。以下列表包含了三种常见的 RAID 级别：\n\n![Images](img/square-1.jpg) **RAID 0** `striping`（条纹）：使用多个磁盘提高性能，但单个磁盘的故障会导致整个阵列失效。\n\
  \n![Images](img/square-1.jpg) **RAID 1** `mirroring`（镜像）：将数据复制到辅助磁盘，提供针对磁盘故障的恢复能力。\n\
  \n![Images](img/square-1.jpg) **RAID 5** `distributed parity`（分布式奇偶校验）：提高性能并容忍磁盘故障。\n\
  \n![Images](img/square-1.jpg) **RAID 10** `striping and mirroring`（条纹与镜像）：结合了条纹和镜像以顾性能和恢复能力。\n\
  \n## 认证目标 5.02\n\n### 云存储配置\n\n云存储的一个伟大特性是它提供了弹性，以及快速配置，这被称为 `capacity on demand`（按需容量）。云客户可以通过点击鼠标或发布命令获取额外的存储。某些\
  \ CSP 支持 `managed disks`（托管磁盘），这意味着 CSP 会自动管理底层存储的配置和扩展。当您在大规模集群上进行工作时，这可以让您的工作变得更容易。\n\
  \n根据您的存储需求，可以为频繁访问和不频繁访问的数据配置云存储设置。这些存储类型将在后续章节中详细介绍。\n\n#### 文件存储与对象存储\n\n文件存储使用文件系统来组织项目。文件系统组织成层级结构，根目录包含子文件夹，文件夹内最终包含文件。\n\
  \n在云中，您可以使用 Azure Files 等服务配置文件存储。Azure Files 本质上是云中的服务器消息块（`SMB`）共享文件夹实现。客户端设备可以像连接本地文件夹一样连接到\
  \ Azure Files 共享文件夹，使用标准的驱动器映射命令（Windows）或挂载点（Linux），尽管本地防火墙可能需要调整以允许 `SMB` 流量（通常使用\
  \ TCP 端口 445）。图 5-3 显示 Windows 使用 `net use` 命令将驱动器号 `P:` 映射到现有的 Azure 文件共享。创建 Azure\
  \ 文件共享可以使用 Azure 门户 GUI 或命令行工具完成。\n\n**图 5-3** 将驱动器号映射到 Microsoft Azure 文件共享\n\n\
  ![Images](img/F05-03.jpg)\n\n对象存储不需要像传统文件系统那样遵循文件层级——换句话说，对象存储使用分布在各种平台的扁平存储结构。每个对象都分配一个唯一标识符，用于快速定位项目，而文件存储使用目录路径来定位存储的项目。访问对象存储通常通过\
  \ HTTP 使用表述状态传输（`REST`）API，而不是使用旧的网络文件访问方法，如文件传输协议（`FTP`）和安全 Shell FTP（`SFTP`）。\n\
  \n\n\n\n云存储设置完全取决于需求。如果您的组织需要频繁访问云存储的数据，则应该启用热存储，它提供更高的性能以实现更快速的数据访问。云服务提供商（CSPs）对此类存储使用不同的术语，例如\
  \ 图 5-4 所示的亚马逊 Web 服务（AWS）变体：热存储使用 `Provisioned IOPS SSD` 或 `Throughput Optimized\
  \ HD`，与之对应的是 `Cold HDD`。\n\n**图 5-4** AWS 热、冷磁盘卷类型\n\n![Images](img/F05-04.jpg)\n\
  \n使用冷存储比使用热存储便宜，因此对于访问频率较低的数据应启用冷存储。冷存储的数据检索速度较慢，这就是为什么冷存储成本较低。对于长期的归档，可以考虑 `AWS\
  \ Glacier` 等选项，它的费用比标准冷存储还要便宜。`AWS Glacier` 的检索时间从几分钟到几小时不等。\n\n## 复制与加密\n\n为了应对故障提供额外的恢复能力，您可以启用云存储复制。这在概念上类似于为了安全将本地备份磁带存储在另一个位置，或将数据复制到不同的公司数据中心。在灾难恢复术语中，存储复制与\
  \ `恢复点目标 (RPO)` 相关，它规定了组织可以承受的最大数据丢失量。图 5-5 显示了云存储复制设置，包括地理冗余存储 (GRS)。`GRS` 将云数据复制到另一个地理区域。\n\
  \n**图 5-5** Microsoft Azure 存储账户复制选项\n\n![Images](img/F05-05.jpg)\n\n![Images](img/exam.jpg)\n\
  \n**虽然备份与 `RPO` 相关，但也与 `恢复时间目标 (RTO)` 相关，后者规定了服务或数据可以承受的最大停机时间。考试可能会强调从备份恢复数据的速度（`RTO`），也可能侧重于备份发生的频率（`RPO`）。**\n\
  \n法律和监管合规性有时要求在使用安全超文本文本传输协议 (`HTTPS`) 保护传输中数据的同时，静态存储数据也必须通过加密进行保护。大多数 CSP 都支持高级加密标准\
  \ (`AES`) 256 位加密，这是美国联邦政府保护敏感信息的要求。\n\nCSPs 可以提供加密密钥，但您的组织可能需要对自定义加密密钥拥有完全控制权。图\
  \ 5-6 显示云客户如何在 `Azure` 中选择使用自己的加密密钥。\n\n**图 5-6** Microsoft Azure 存储账户客户加密密钥\n\n\
  ![Images](img/F05-06.jpg)\n\n### 认证目标 5.03\n\n## 云端数据库\n\n有几种方法可以建立云端数据库：\n\n![Images](img/square-1.jpg)\
  \ 从本地迁移\n\n![Images](img/square-1.jpg) 在云虚拟机中手动安装和配置\n\n![Images](img/square-1.jpg)\
  \ 作为托管云服务部署\n\n数据库迁移用于复制本地数据库对象和数据。对于长期的归档，可以考虑 `AWS Glacier` 等选项，它的费用比标准冷存储还要便宜。`AWS\
  \ Glacier` 的检索时间从几分钟到几小时不等。（注：原文中此处存在大量重复段落，已根据要求进行精简处理）\n\n数据库迁移用于复制本地数据库对象和数据。对于长期的归档，可以考虑\
  \ `AWS Glacier` 等选项，它的费用比标准冷存储还要便宜。`AWS Glacier` 的检索时间从几分钟到几小时不等。\n\n## 内容交付网络\n\
  \n由于 CSP 在全球部署了服务器，将内容地理位置放在用户群附近可以减少用户访问内容的延迟。这就是内容交付网络 (CDN) 的用处。CDN 允许数据被复制（缓存）到各个区域。你可以配置通配符来缓存特定类型的媒体，例如为了只缓存\
  \ .AVI 文件，你可以指定 *.AVI。\n\n但这种复制是一次性的吗？如果内容发生了变化呢？CDN 的配置项之一是生存时间 (TTL)。它通常以秒为单位，决定了在检查更改之前多久检查一次缓存项。用户对内容的请求将由\
  \ CDN 缓存数据满足，如果没有缓存，则将从源服务器获取内容。\n\n\n\n\n1. 使用 Web 浏览器登录 [`portal.azure.com`](https://portal.azure.com)\
  \  Azure 门户。\n\n2. 在左侧导航窗的顶部，点击 `Create a Resource`（创建资源）按钮，如图图 5-9\n\n3. 在 `Search`（搜索）字段中输入\
  \ `storage account`，从搜索结果列表中选择 `Storage Account`（存储账户），然后点击 `Create`（创建）。\n\n4.\
  \ 使用以下配置存储账户（所有其他设置接受默认值）：\n\n![Images](img/square-1.jpg) 资源组：创建一个名为 `ResGroup1`\
  \ 的新组\n\n![Images](img/square-1.jpg) 存储账户名称：`storacct1289`\n\n5. 点击 `Review + Create`（查看并创建），然后点击\
  \ `Create`（创建）。\n\n6. 部署完成后，点击 `Go to Resource`（转到资源）按钮查看存储账户。\n\n## 练习 5-2\n###\
  \ 向 Microsoft Azure 存储账户上传内容\n\n在此练习中，你将使用 Azure 门户向 Azure 存储账户上传示例文件。此练习取决于你已成功完成练习\
  \ 5-1。\n\n1. 使用 Web 浏览器登录 [`portal.azure.com`](https://portal.azure.com) Azure 门户。\n\
  \n2. 在左侧导航器中，点击 `Storage Accounts`（存储账户）。\n\n3. 在右侧，点击 `storacct1289` 打开存储账户属性。\n\
  \n4. 滚动到属性导航栏并点击 `Blobs`（块存储）。\n\n5. 在右侧，点击 `+Container`（容器）按钮。\n\n6. 将容器命名为 `samplefiles`\
  \ 并点击 `OK`（确定）。\n\n7. 点击 `samplefiles` 容器，然后点击 `Upload`（上传）按钮，如图 5-10\n\n8. 点击文件夹图标并指定要上传的一些本地示例文件，然后点击\
  \ `Upload`（上传）按钮。\n\n9. 上传完成后，点击已上传的文件名，验证服务器端加密已设置为 `true`。Microsoft Azure 默认对所有存储账户的\
  \ blob 进行加密，如图 5-11\n\n## 考试内部\n### 云存储与实操\n\n为了准备回答 CompTIA Cloud Essentials+ CLO-002\
  \ 考试中与云存储相关的问题，进行实验会有帮助。创建云存储账户、上传示例数据并配置加密和复制等设置。\n\n#### 认证总结\n\n本章重点关注了与业务需求一致的云存储设置。在配置云存储详情时，如何使用存储是决定高性能是否重要的主要因素，如果是这样，应该启用\
  \ SSD 热点访问存储。然而，正如你学到的，SSD 选项比 HDD 贵，因为 SSD 的速度比 HDD 快。\n\n在选择云存储选项时，磁盘 IOPS 代表整体磁盘\
  \ I/O 性能；选择更多的 IOPS 会获得更好的性能，反之意味着云存储服务的成本增加。\n\n接下来，我们将分层文件存储（如 `Microsoft Azure\
  \ Files`）与扁平对象存储进行了比较。`Microsoft Azure Files` 提供基于云的共享文件夹。基于云的虚拟机磁盘被称为块存储。\n\n我们随后讨论了如何将云存储复制到多个区域以在区域性故障时增加数据可用性。接下来，我们谈到了如何使用\
  \ CSP 密钥或客户密钥对云数据进行加密。\n\n接着，我们比较了 SQL 数据库（最适合存储在单独数据表中的关联数据）和 NoSQL 数据库（使用不那么严格的模式，并可以存储海量的非结构化数据）。你还学习了托管数据库解决方案使云客户免于部署和管理底层数据库结构的复杂性。\n\
  \n最后，你学习了内容分发网络（CDN）以及它们如何将内容放置在请求内容的用户附近，从而通过减少网络延迟来提高用户体验。\n\n### ![Images](img/tick1.jpg)\
  \ 两分钟训练\n\n#### 存储媒体\n\n![Images](img/box1.jpg) 基于 HDD 的云存储比基于 SSD 的云存储慢，但价格更便宜。\n\
