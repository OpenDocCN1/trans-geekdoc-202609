  \ **A, B,** 和 **D** 是错误的。修改 TTL 值或为云数据使用自定义加密密钥，其对效率的提升远远不如通过正确配置通配符路径来仅复制所需文件。\n\
  \n## 第 6 章：云网络基础设施\n\n![Images](img/chap1.jpg)\n\n### 认证目标\n- 6.01 云网络组件\n- 6.02\
  \ 网络协议\n- 6.03 云负载均衡\n\n![Images](img/tick.jpg) 两分钟演练\n\n**问答** 自测\n\n网络为支持云服务提供了基础。细致的规划和测试可以构建稳健的云网络基础设施。本章将开始介绍多种可以连接您的本地网络和云网络的方法。\n\
  \n接下来，我们将讨论虚拟子网及其相关 IP 地址分配等云网络组件。然后，我们将涵盖本地网络和云网络中常用的网络协议。最后，我们将研究在规划和配置站点到站点 VPN\
  \ 或客户端站点 VPN 时需要考虑的因素。\n\n### 认证目标 6.01\n#### 云网络组件\n\n规划云网络环境与规划本地网络环境有许多相似之处。让我们来看一些您应该考虑的因素：\n\
  \n- ![Images](img/square-1.jpg) 需要多少个子网？\n- ![Images](img/square-1.jpg) 将使用哪些 IPv4\
  \ 或 IPv6 地址范围？\n- ![Images](img/square-1.jpg) 是否应该将某些 IT 负载与其他负载隔离？\n- ![Images](img/square-1.jpg)\
  \ 是否某些 IT 负载应该从互联网公开访问？\n- ![Images](img/square-1.jpg) 远程用户是否需要通过安全的 VPN 访问公司网络？\n\
  - ![Images](img/square-1.jpg) 是否需要自定义路由将网络流量发送到安全设备？\n\n幸运对于云客户来说，云服务供应商利用了软件定义网络（SDN），这意味着云客户不必担心配置和管理各种网络硬件和软件的详细复杂性。相反，云客户使用直观的图形用户界面（GUI）或命令行工具，然后配置底层网络组件。\n\
  \nSDN 对云服务供应商非常有效，因为它允许其许多云客户在路由器和交换机等许多底层网络基础设施设备上配置网络设置。如果没有 SDN，云客户可能需要向云数据中心技术人员提交其网络配置请求以实施。数据中心技术人员必须精通配置许多网络设备，这些设备可能来自不同的供应商，其详细的配置步骤各不相同。将\
  \ SDN 视为一个位于网络基础设施硬件之上的集中化、易于使用的软件层。\n\n#### 连接到云环境\n\n无论您是个人云客户还是使用云服务的企业成员，您都需要以这种方式或那种方式连接到云服务供应商。正如您在第\
  \ 1 章中所记得，云计算的一个重要特性是通过网络广泛地访问 IT 服务。\n\n##### 互联网连接\n\n互联网是直接连接到公共云服务供应商（CSP）以创建和管理云资源的最常用方式，也是用户访问这些服务的常用方式。当云计算服务对组织的生存至关重要时，组织必须仔细检查其互联网连接的韧性。如果组织只有一个互联网连接且该连接故障，那么将如何访问公共云服务？对于将所有分支机构的互联网流量汇到一个单一互联网枢纽位置的组织来说，这个问题变得更加严重。如果中心枢纽位置发生某种故障故障，所有分支机构都可能无法联系公共\
  \ CSP。\n\n如何解决这个单点故障？答案显而易见——确保每个本地位置都有两个互联网连接，如果可能，最好通过不同的互联网服务提供商（ISP）。如果一个 ISP\
  \ 发生网络故障，理想情况下另一个 ISP 不会同时发生。当然，解决单点故障并不总是那么简单，但组织的风险承受能力将决定赋予该场景多大的重要。\n\n#####\
  \ 专用网络线路\n\n除了互联网之外，另一种选择是从您的本地网络到公共 CSP 的专用私网络链路，本质上是广域网（WAN）链路。Microsoft Azure\
  \ 称为 `ExpressRoute`，而 Amazon Web Services (AWS) 称为 `Direct Connect`；名称不同，结果相同。某些\
  \ IT 负载（如 IP 电话/VoIP 数据包）对网络中断敏感，可能需要保证的服务质量（QoS）以确保数据包丢失降至最低。图 6-1 显示了配置 AWS Direct\
  \ Connect 链路的示例。\n\n**图 6-1** 创建 AWS Direct 链路\n![Images](img/F06-01.jpg)\n\n您需要检查\
  \ CSP 的文档以确定它是否有本地接入点，您的组织可以在那里建立专用网络链路。\n\n使用专用网络线路到公共云有几个潜在优点：\n\n- ![Images](img/square-1.jpg)\
  \ 网络流量不经过互联网。\n- ![Images](img/square-1.jpg) 网络带宽是可预测的。\n- ![Images](img/square-1.jpg)\
  \ 网络吞吐量高于互联网。\n- ![Images](img/square-1.jpg) 它可能比快速互联网连接便宜。\n\n##### 云 VPN\n\n虚拟专用网络（VPN）已经存在很长时间了。这种解决方案在不可信的网络（如互联网）上创建端到端的加密隧道。通过\
  \ VPN 隧道发送的网络流量在 VPN 连接的另一端解密之前受到保护。这是连接以下内容的良好方法：\n\n- ![Images](img/square-1.jpg)\
  \ 跨越互联网的分支机构\n- ![Images](img/square-1.jpg) 跨越互联网的远程用户到专用网络\n- ![Images](img/square-1.jpg)\
  \ 本网络到云虚拟网络\n\n在规划连接 Microsoft Azure 等公共 CSP 的 VPN 时，您需要考虑 VPN 类型。\n\n#### 站点到站点\
  \ VPN\n\n\n\n\n站点到站点（Site-to-site）VPN 配置用于将您的本地网络扩展到云端。VPN 配置至少需要两个端点，在这种情况下，端点是一个本地\
  \ VPN 设备和一个云端 VPN 设备。您的本地 VPN 设备可以是硬件或软件类的，并且必须具有公网 IP 地址，以便与云服务提供商的 VPN 设备建立隧道。\n\
  \n站点到站点 VPN 允许连接两端的网络设备通过 VPN 隧道发送流量进行通信。换句话说，您不需要在每个设备上安装和配置 VPN 客户端。图 6-2 显示了\
  \ Microsoft Azure 站点到站点 VPN 的配置。在共享密钥（`PSK`）字段中指定的预共享密钥用于在端点之间建立 VPN 隧道。\n\n**图\
  \ 6-2** Microsoft Azure 站点到站点 IPsec VPN 配置\n\n![Images](img/F06-02.jpg)\n\n可以使用\
  \ VPN 将多个分支机构位置相互连接。如果其中一个分支机构也与云有 VPN 连接，则可以配置已连接的分支机构通过该 VPN 连接到云端。\n\n### 客户端到站点（Client-to-Site）VPN\n\
  \n如今的员工中有些人是远程工作的——无论是在家中、在不同的办公地点还是出差。客户端到站点（`C2S`）VPN，也称为点对站点（`P2S`）VPN，将单个设备连接到\
  \ VPN 端点以建立加密隧道。这允许远程用户在不受信的网络上安全地访问 IT 服务。例如，您可以允许在家里工作的用户通过 VPN 连接安全地访问到部署在云端的数据库。图\
  \ 6-3 显示了 Microsoft Azure 云中的 C2S VPN 配置，它要求客户端设备具有安全证书以通过 VPN 进行身份验证；这就是为什么要指定公证书数据的原因。另外请注意\
  \ `Download VPN Client`（下载 VPN 客户端）按钮；这将为作为 VPN 客户端的 Windows 计算机下载 `configuration.zip`\
  \ 文件。\n\n**图 6-3** Microsoft Azure 点对站点 VPN 配置\n\n![Images](img/F06-03.jpg)\n\n\
  ![Images](img/exam.jpg)\n\n**某些考试可能会测试您对结合云网络解决方案的了解。例如，为了获得最高的安全性和可预测带宽，场景可能要求在专用网络电路上配置站点到站点\
  \ VPN。**\n\n### 云虚拟网络\n\n由于 `SDN` 的存在，只要你计划周密并在选择之前研究各种云服务提供商提供的选项，创建云虚拟网络就是非常简单的。云服务提供商对云虚拟网络有它们自己的命名法。例如，Microsoft\
  \ Azure 将其称为 `VNets`，而 AWS 将其称为 `Virtual Private Clouds (VPCs)`。\n\n`VNets` 和 `VPCs`\
  \ 都包含一个或多个子网，类似于本地物理网络交换机可以被划分为多个虚拟局域网（`VLANs`）。VLAN 为安全安全和/或减少网络拥塞提供网络隔离。您还可以控制来自一个子网的流量是否到达其他子网。测试环境和生产环境之间通常保持网络隔离。这在本地也是如此。\n\
  \n#### IP 划分\n\n部署云虚拟网络需要无类域间路由（`CIDR`）格式。`CIDR` 格式指定 IP 地址，后跟一个斜杠和掩码的位数，例如 `10.0.0.0/16`\
  \ 或 `192.168.1.0/24`。IP 地址识别地址的网络部分和主机部分。掩码决定了有多少位代表网络前缀。\n\n以下示例显示了 `10.0.0.0/16`\
  \ 如何使用前 16 位作为网络，这意味着从 `10.0.0.0` 到 `10.0.255.255` 的任何地址都在该网络内。\n\n![Images](img/square.jpg)\n\
  \n#### 网络协议\n\n在云计算中，`DNS` 与设置集成在一起。当你部署一个新的 `VNet` 时，默认情况下，Azure 提供的 `DNS` 允许同一子网内的虚拟机解析名称以及\
  \ Internet 域名。如果您需要，可以配置自定义的 DNS 服务器 IP 地址。您可以在图 6-5 中看到这一点。\n\n**图 6-5** Microsoft\
  \ Azure VNet DNS\n\n![Images](img/F06-05.jpg)\n\n#### 云负载均衡\n\n当应用程序处理大量的客户端请求时，它需要更多的动力来适应工作负载。可以使用负载均衡来解决这个问题。您可以为员工使用的内部业务应用程序配置内部负载均衡器，也可以为面向公众的应用程序配置外部负载均衡器。无论哪种方式，对于\
  \ `www.app1.com` 等应用程序的客户端请求通过 `DNS` 解析到负载均衡器的 IP 地址。负载均衡器配置了多个实际运行应用程序的后端虚拟机，如图\
  \ 6-6 所示。\n\n**图 6-6** 负载均衡\n\n![Images](img/F06-06.jpg)\n\n\n\n\n1. 使用 Web 浏览器登录\
  \ `https://portal.azure.com`。\n2. 在左侧导航窗格顶部，点击`Create a Resource`（创建资源）。\n3. 在`Search`字段中输入`virtual\
  \ network`，从结果中选择`Virtual Network`，并点击`Create`（创建）。\n4. 按照以下配置虚拟网络（其他设置接受默认值），如图\
  \ 6-7\n![Images/square-1.jpg] 名称：`VNet90`\n![Images/square-1.jpg] 地址空间：`10.3.0.0/16`\n\
  ![Images/square-1.jpg] 资源组：`(New) ResGroup90`\n![Images/square-1.jpg] 子网名称：`Subnet1`\n\
  ![Images/square-1.jpg] 地址范围：`10.3.1.0/24`\n5. 点击`Create`（创建）。\n\n## 练习 6-2：配置 Microsoft\
  \ ExpressRoute 电路\n\n在此练习中，你将通过`ExpressRoute` 配置本地网络到 Azure 的专用链路。此练习依赖于已完成练习 1-1。\n\
  \n1. 在 Azure 门户中，点击左上角的`Create a Resource`（创建资源）。\n2. 在搜索栏中输入`expressroute`，从列表中选择`ExpressRoute`，并点击`Create`（创建）。\n\
  3. 按照与下方类似的适用于我位置的设置配置`ExpressRoute` 电路，如图 6-8\n![Images/square-1.jpg] 名称：`HQ_Circuit1`\n\
  ![Images/square-1.jpg] 供应商：`Bell Canada`\n![Images/square-1.jpg] 对等连接位置：`Toronto`\n\
  ![Images/square-1.jpg] 带宽：`100Mbps`\n![Images/square-1.jpg] 资源组：`(New) ResGroup91`\n\
  4. 在生产环境中完成此过程，你需要联系服务提供商来配置电路，并通过虚拟网络网关将其连接到虚拟网络。\n\n## 考试要点\n\n### 云网络\n\n了解何时使用特定的云网络配置，是正确回答\
  \ CompTIA Cloud Essentials+ CL-002 考试中问题的关键。请记住，某些组织需求可以通过结合多种云网络解决方案来满足，例如使用`VPN`允许安全地连接到云端，以运行基于云的负载均衡应用程序。\n\
  \n## 认证总结\n\n本章讨论了如何通过互联网或使用专用网络电路将本地网络连接到公共云服务提供商。你还学习了如何通过`VPNs`为公共云服务提供商（CSP）提供安全连接。根据公司的需求，你可以配置站点到站点的`VPN`将你的本地网络连接到云端，或者允许单个远程用户通过客户端到站点的`VPN`连接连接到云端。\n\
  \n你还学习了云虚拟网络，例如`Azure Virtual Networks`和`Amazon Web Services Virtual Private Clouds`，以及云中的子网如何使用网络范围内的\
  \ IP 地址范围。\n\n本章还描述了许多本地使用的传统网络协议（如`SSH`、`RDP`和`DNS`）在云计算环境中也用于相同的目的。\n\n本章最后解释了如何实现负载均衡器，以为云托管应用程序提供快速高效的访问。应用程序的客户端请求被定向到负载均衡器，然后由将请求路由到最不忙且响应良好的后端服务器。负载均衡解决方案还可以进行自动扩展，以调整为应用程序服务的后端虚拟机数量。\n\
  \n### 两分钟演练 ![Images/tick1.jpg\n\n#### 云网络组件\n\n- ![Images/box1.jpg] 云客户可以通过互联网或专用专用网络电路连接到公共\
  \ CSP。\n- ![Images/box1.jpg] 应使用冗余的互联网云连接，以防其中一个连接失败。\n- ![Images/box1.jpg] 专用网络电路在私有网络链路上提供可预测的带宽。\n\
  - ![Images/box1.jpg] Microsoft Azure 专用网络链路被称为`ExpressRoute` 电路。\n- ![Images/box1.jpg]\
  \ Amazon Web Services 专用网络链路被称为`Direct Connect` 连接。\n- ![Images/box1.jpg] `VPNs`\
  \ 在不可信的网络上在两个端点之间创建加密隧道。\n- ![Images/box1.jpg] 分支机构可以通过具有特定 IP 空间的站点到站点`VPN`安全地连接到云端。\n\
  - ![Images/box1.jpg] 站点到站点`VPNs`需要本地设备。\n- ![Images/box1.jpg] 客户端到站点`VPN`允许单个用户访问。\n\
  - ![Images/box1.jpg] 软件定义网络 (SDN) 使云客户无需进行详细的网络配置。\n- ![Images/box1.jpg] 云虚拟网络包含`subnets`。\n\
  - ![Images/box1.jpg] Microsoft Azure 云虚拟网络被称为`VNets`。\n- ![Images/box1.jpg] Amazon\
  \ Web Services 云虚拟网络被称为`VPCs`。\n\n#### 网络协议\n\n- 传统的本地协议也用于云端。\n- `SSH` 使用端口 `22`\
  \ 用于 Unix 和 Linux 远程管理。\n- `RDP` 使用端口 `3389` 用于 Windows 远程管理。\n- 云服务主要通过`HTTP`（端口\
  \ 80）和`HTTPS`（端口 443）访问。\n- `LDAP` 在连接到网络数据库时使用端口 `389`。\n- `SNMP` 使用端口 `161` 用于监控网络设备。\n\
  - `DNS` 使用端口 `53` 用于客户端请求。\n- `DNS` 使用端口 `53` 用于服务器与服务器之间的通信。\n\n#### 负载均衡\n\n-\
  \ 客户端到应用程序连接通过负载均衡器。\n- 负载均衡应用程序性能更好且对服务器故障具有韧性。\n- 负载均衡器可以用于内部或面向的应用程序。\n- 负载均衡使用由虚拟机组成的后端池。\n\
  - 请求被路由到最不忙的后端服务器。\n- 请求不会路由到无响应的后端服务器。\n\n### 自测 ![Images/qs.jpg)\n\n以下问题将帮助你衡量对本章内容的理解程度。如所示，某些问题可能有多个正确答案，因此请务必仔细阅读所有选项。\n\
