  B. `转移`\nC. 规避\nD. 缓解\n\n**4 贵公司将本地文件备份到云端以确保数据可用性。这种场景与哪种风险处理最相关？**\nA. `接受`\n\
  B. 转移\nC. 规避\nD. `缓解`\n\n#### 资产与威胁\n\n**5 哪种类型的文档为正常的云管理活动提供指导？**\nA. `SLA`\nB.\
  \ `DRP`\nC. `SOP`\nD. `IRP`\n\n\n\n\n## 6. 在识别威胁之前，必须进行哪项风险管理活动？\n\nA. 漏洞评估\nB.\
  \ 渗透测试\nC. 创建风险登记\nD. 资产清单\n\n## 7. 哪种云活动为云资源添加元数据，这有助于组织云资产？\n\nA. 日志记录\nB. 标签标记（Tagging）\n\
  C. 审计\nD. 漏洞扫描\n\n### 威胁缓解\n\n## 8. 你需要处理与组织存储敏感数据方式有关的安全考量。当前的数据保护措施被认为是不够的。你应该咨询什么来列出当前的数据保护控制措施？\n\
  \nA. 风险登记\nB. SIEM\nC. SLA\nD. 审计文件\n\n## 9. 用哪个术语来描述与资产安全相关的通用安全需求？\n\nA. 安全控制\n\
  B. 控制目标\nC. 风险登记\nD. SIEM\n\n## 10. 哪个灾难恢复术语是指恢复故障组件或服务所需的平均时间？\n\nA. SLA\nB. DRP\n\
