  \ DevOps\n\n![Images](img/chap1.jpg)\n\n### 认证目标\n\n9.01 云端软件开发\n9.02 软件测试\n9.03\
  \ 持续集成与交付\n9.04 云端资源部署\n\n![Images](img/tick.jpg) 两分钟快速演练 (Two-Minute Drill)\n\n\
  **问答** 自测测试\n\n***\n\n本章重点关注云软件开发与相关 IT 操作任务之间的结合，以便高效地部署初始软件以及更新。\n\n首先，我们将讨论 `APIs`\
  \ 和数据交换格式在云端 DevOps 中的作用。接下来，我们将关注软件测试，包括使用沙箱（sandboxing）来安全地进行测试，以及使用各种软件测试类型来确保软件的高质量。\n\
  \n接下来，我们将关注软件解决方案的自动化持续持续集成和交付，这依赖于代码库以及自动化触发器（例如由代码提交引起的代码构建和测试）。最后，我们将研究云编排的相关性，以及它如何不同于云自动化但同时又依赖于云自动化。\n\
  \n#### 认证目标 9.01\n\n### 云端软件开发\n\n`DevOps` 是一个 IT 术语，结合了开发（development）和运维（operations）两个词，用于描述开发软件解决方案与持续高效、安全地部署相关更新之间的交汇。你甚至会遇到\
  \ `DevSecOps` 术语，以强调在开发、部署和持续管理的所有阶段中安全的重要性。\n\n软件开发人员使用云服务，如数据库、集中式代码库以及自动化代码构建、测试和部署的代码流水线。这些类型的云服务属于平台即服务\
  \ (`PaaS`) 云服务模型，有时被称为 `serverless`（无服务器），因为它们始终由底层的虚拟机服务器支持；它们也被认为是 `managed services`（托管服务），因为开发人员无需担心部署和管理支持服务的虚拟机。\n\
  \n使用云端来开发和托管软件服务涉及调用或创建应用程序接口 (`APIs`)，并确定数据在软件组件之间如何交换，正如接下来所讨论的。\n\n#### 应用程序接口\n\
  \n将 `API` 想象成一组相关的函数，其他软件组件可以调用或挂钩（hook into）它们。如果你在 20 世纪 90 年编写代码，你可能会调用 `Win32\
  \ APIs` 在 Windows 操作系统执行各种任务。如今，你可以在云端构建自己的 `APIs`，或者使用现有的云 `APIs` 通过程序化访问云资源。你还可以在自己的自定义软件解决方案内部调用现有的\
  \ `API`；这被称为 `API` 集成。常见的 API 消息交换机制包括 `SOAP` 和 `REST`，如第 8 章 所示。\n\n##### 使用现有的云\
  \ API\n\n`APIs` 可用于设备、操作系统、应用程序以及（通常用于）每种类型的云服务提供。例如，弹性云计算 (`EC2`) `API` 支持程序化访问\
  \ Amazon Web Services (`AWS`) 云中的虚拟机实例。如果你热于开发健康和健身应用，甚至有一个 `Fitbit` 健身活动监测设备的 `API`。\n\
  \n大多数云服务提供商都为开发人员提供软件工具包 (`SDKs`)。`SDKs` 由用于各种编程语言开发软件的工具组成，例如用于 `C++` 编程语言的 `AWS\
  \ SDK`，链接见图 9-1。\n\n**图 9-1** Amazon Web Services 编程选项\n\n![Images](img/f0171-01.jpg)\n\
  \n要访问现有的 `API`，只需要 `API` 文档。`API` 文档将让你了解以下内容：\n\n![Images](img/square-1.jpg) 如何身份验证\
  \ `API`\n![Images](img/square-1.jpg) `API` 函数的名称\n![Images](img/square-1.jpg) 需要传递给函数的参数，包括它们的数据类型\n\
  ![Images](img/square-1.jpg) `API` 返回值，包括它们的数据类型\n\n##### 创建自定义 API\n\n你可以使用云端来创建和托管自己的自定义\
  \ `APIs`。这些 `APIs` 将做什么？什么都可以！天空才是极限。你可能会创建一个酒店和航空公司预订 `API`，当组织中的员工计划出差时触发它。或者你可能会创建一个\
  \ `API`，摄取由无人机收集的数据进行分析，然后使用云推送服务将结果作为短信 消息发送到智能手机上。你甚至可以在自己的 `APIs` 中集成现有的 `API`\
  \ 函数调用。\n\n`APIs` 可以通过 `API 网关`（API gateway）托管在云端，它是调用 `API` 的客户端与实际 `API` 之间的中间节点。另一个选项是在应用程序容器内托管\
  \ `APIs`，这非常适合模块开发，因为每个应用程序容器托管一个或多个相关的 `APIs`，并且它们可以独立进行测试。\n\n#### 数据交换格式\n\n\
  开发云端解决方案通常涉及摄取、处理和输出数据。软件组件之间以及与存储介质之间以多种方式传输这些数据，通常通过 `HTTP/S` 协议使用 `XML` 或 `JSON`\
  \ 格式。\n\n##### 可扩展标记语言\n\n`XML` 是一种使用标签描述数据的标准信息交换格式。使用 `XML` 标签描述数据如下：\n\n![Images](img/f0172-01.jpg)\n\
  \n##### JavaScript 对象表示\n\n被称为 `JSON` 的这数据的另一种表达方式，例如当软件组件通过网络通信时。你可以在图 9-2 中看到\
  \ Azure CLI `az vm list` 命令的 `JSON` 输出示例，它列出了虚拟机详情。`JSON` 语法使用键值对，如例所示：\n\n**图 9-2**\
  \ 使用 Azure CLI 列出虚拟机\n\n![Images](img/f0173-01.jpg)\n\n![Images](img/f0172-02.jpg)\n\
  \n![Images](img/exam.jpg)\n\n`XML` 和 `JSON` 并不替代使用消息队列存储消息的选择。回想第 8 章](#ch8.xhtml)，使用消息队列允许软件组件之间实现*松耦合*。\n\
  \n#### 认证目标 9.02\n\n### 软件测试\n\n`DevOps` 的一个重要方面是确保部署的 IT 服务具有最高水平的质量，通常称为*质量保证*。在初始以及进行任何更改后对软件进行适当测试对于确保其成功至关重要。在测试时，你可以采用多种技术。\n\
  \n#### 沙箱\n\n孩子们喜欢在沙箱里玩。IT 技术人员也喜欢受控的测试环境（沙箱）。在云端，可以通过多种方式实现这一点，正如本节所示。\n\n\n\n\n\
  [content]\n关键在于保持测试环境与生产环境隔离，同时尽可能地模拟生产环境。这不仅包括模拟基础设施，还包括 IT 系统将消耗的数据类型。根据你的组织情况，在沙箱测试中使用生产数据的副本可能是可以的，但绝不接受使用实时生产数据。\n\
  \n## 虚拟网络隔离\n\n当你在云中定义虚拟网络时，你可以对其进行配置，使得限制或不允许网络流量进入或离开该虚拟网络。你可以通过配置入站和出站防火墙规则以及修改路由表项来防止流量进入或离开给定网络。图\
  \ 9-3 显示了如何配置 Microsoft Azure 存储账户以限制来自其他 Azure 网络的访问。\n\n**图 9-3** Microsoft Azure\
  \ 存储账户网络访问设置\n\n![Images](img/f0174-01.jpg)\n\n## 虚拟机\n\n虚拟机也可以作为沙箱解决方案。测试软件和各种配置通常可以在单个虚拟机中进行，但有时测试可能需要跨多个虚拟机进行，例如测试一个多层\
  \ Web 应用程序，该应用使用部署在公共访问网络上的 Web 前端和部署在私有网络上的后端数据库。\n\n要警惕具有多个网卡 (NIC) 的虚拟机。要避免出现一种情况：一个网卡正确连接到私有测试网络，而另一个连接到生产网络。\n\
  \n## 应用容器\n\n容器比虚拟机更细粒度，它们可以执行应用代码。正如在第 8 章中讨论的，应用程序可以由多个容器组成。虽然每个容器都可以提供沙箱解决方案（应用组件隔离），但运行多个容器该如何处理？\n\
  \n如果容器运行在单个主机上，那么虚拟机和网络隔离设置可以防止与生产网络连接。如果容器分布在同一网络的多个虚拟机上，网络隔离可以解决问题。如果容器分布在不同网络的虚拟机上，请考虑将虚拟机移动到单个网络，或使用\
  \ VPN 连接或防火墙规则控制虚拟机之间的流量。\n\n## 测试类型\n\n建立沙箱测试环境后，你需要根据特定需求确定合适的测试类型。软件的性质（商业或自定义）、主机分散情况以及网络只是影响进行何种类型测试决策的少数因素。表\
  \ 9-1 总结了常见的测试类型。\n\n**表 9-1** 常见测试类型\n\n![Images](img/f0175-01.jpg)\n\n## 认证目标\
  \ 9.03\n\n### 持续集成与交付\n\n通常称为 `CI/CD`，DevOps 的这一关键方面涉及确保通过互联网实现软件解决方案的自动化和及时交付。云服务提供提供了许多托管服务，有助于促进代码创建、沙箱测试和更新软件的自动化交付。专注于特定关键问题的更新称为\
  \ `patches`（补丁）。应用更新和补丁属于配置管理的范畴，其目标是确保软件的安全性、稳定性和最佳性能。\n\n### 代码库\n\n顾如其名，`code\
  \ repository`（代码库）是编程代码的中央存储位置。你可以在本地实现代码库，也可以快速方便地在云中置备一个，如图 9-4 所示。还有许多公共代码库可用，例如\
  \ `GitHub`、`Bitbucket` 和 `SourceForge`。\n\n**图 9-4** Amazon Web Services 代码库\n\n\
  ![Images](img/f0176-01.jpg)\n\n开发者被授予创建新代码或修改现有代码并将其检入代码库的权限。当需要更改代码时，开发者检出代码，这防止了其他开发者修改它。软件开发的微服务方法（在第\
  \ 8 章中引入）允许具有特定功能的代码模块与其他代码模块分离。在开发者为包含许多微服务的大型应用检入和检出代码的场景下，这提供了许多效率。使用微服务允许对不同的微服务进行同步代码更改，最终加快了代码更改、测试和部署。在云中，开发者不再需要手动安装和配置服务器来支持代码库。\n\
  \n### CI/CD 如何工作\n\n云计算提供了规模经济（许多客户、每个客户的成本更低等）和快速的资源置备。再加上自动化，云 DevOps 团队能够轻松实现\
  \ `CI/CD`。以下是其通常的操作流程：\n\n1. 开发者置备一个基于云的代码库。这甚至可以与如 `GitHub` 等公共代码库链接。\n2. 开发者创建代码或修改现有代码并将其检入仓库。修改现有代码意味着检出，这防止了其他软件开发者的修改。\n\
  3. 检入代码会触发新的代码构建。\n4. 新的代码构建会触发各种自动化测试。\n5. 测试成功后，更改的解决方案将被打包并部署。部署可以通过推送通知发生，或者简单地在网站上发布更新供消费者下载和应用。\n\
  \n`AWS CodeCommit`、`CodeBuild`、`CodePipeline` 和 `CodeDeploy` 是提供 `CI/CD` 的一些云解决方案示例。首先，这些都是托管云解决方案，因此它们的初始置备快速且简单。其次，每个方案都允许具有自动化构建、测试和包部署的云端代码库。\n\
  \n## 认证目标 9.04\n\n### 云资源部署\n\n虚拟机、数据库、存储账户和 Web 应用程序等云资源可以手动部署。在某些情况下，这是最佳解决方案，但在其他情况下，通过自动化云资源的部署可以节省时间，这在反复部署沙箱环境时特别有用。\n\
  \n#### 云自动化\n\n云自动化可以减少人为错误并加速云资源的创建、修改和删除。考虑实现云自动化的方法：\n\n- 使用支持循环的命令行工具\n- 创建使用命令行工具的脚本\n\
  \ 使用 使用云资源模板部署云资源，这些模板通常为 XML 或 JSON 文件格式，也称为基础设施即代码 (`IaC`)\n- 按计划或通过特定的触发事件（例如接收到特定的\
  \ HTTP 请求或消息队列中出现新消息）执行云批处理作业\n\n以下 Microsoft CLI 示例使用 JSON 模板文件向 `ResGroup1` 资源组部署测试虚拟机。模板文件包含所有细节，例如虚拟机名称、虚拟磁盘数量等。\n\
  \n![Images](img/f0177-01.jpg)\n\n![Images](img/onjob.jpg)\n\nMicrosoft Azure 资源组将相关的云资源组织在一起以便作为一个单元进行管理。例如，你可以在单个资源组中组织\
  \ Web 应用程序组件，如 Web 服务器、存储账户、负载均衡器和后端数据库。\n\n\n\n`Cloud automation` 和 `cloud orchestration`\
  \ 有时会被混用，但它们并不是一回事。前节讨论了云自动化；而云编排则在更大的规模上运行。可以将云自动化比作交响乐中的单名音乐家，而云编排则类比于指挥，他让所有音乐家同时协作，以实现单凭一个音乐家无法实现的结果。\n\
  \n虽然云自动化可以用于在无人干预的情况下部署 `VM`，但云编排可以用于部署整个 Web 应用，包括 `VMs`、云存储、负载均衡器、后端数据库、云用户账户和电子邮箱、防火墙规则等——你可以想象出画面。将单个自动化任务组织起来并与其他自动化任务协同工作就是编排，它还可以要求某些任务在其他任务完成之前执行。\n\
  \n云运行操作手册（Cloud runbooks）是云编排解决方案的一部分。`runbook` 将多个自动化任务组织在一个工作流中。运行操作手册通常可以在完全没有人工干预的情况下运行，但某些可能在运行时需要某些值。运行操作手册还可以由特定的云事件触发，例如\
  \ `VM` 的 CPU 使用率长时间超过 90%。\n\n![Images](img/onjob.jpg)\n\n**编排并非云端所有。本地工具（如 Microsoft\
  \ System Center Orchestrator）使用了运行操作手册的概念，将多个自动化任务组织成单一的工作流。**\n\n### 练习 9-1\n\n\
