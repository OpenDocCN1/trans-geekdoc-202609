  ### 在线\n### 技术支持\n### 术表\n### 索引\n\n# 前言\n本学习指南的目的是帮助你为 CompTIA Cloud Essentials\
  \ 考试做好准备，使你熟悉云解决方案与业务需求的对齐情况，而这正是考试的基础。由于本书的主要重点是帮助你通过考试，因此并不总是涵盖技术的每一个方面。书中对某些方面仅在有助于你理解通过考试所需知识的必要范围内进行介绍，但我希望这本书在你的考试后仍能成为你的一份宝贵资源。\n\
  \n### 本书\n本书的结构安排旨在为初级和资深云计算专业人士提供 CompTIA Cloud Essentials 考试的深度复习。即使是计划聘请顾问管理云端使用的小企业主，也能从书中获益。每个章节都涵盖了考试的一个主要方面，并重点关注处理和支持云解决方案的“为什么”以及“如何做”。\n\
  \n每个章节都包含一组组件，旨在引起你对重要事项的注意，强化要点并提供实用的考试提示：\n\n- **认证目标 (Certification Objectives)**：每个章节都以认证目标开始——即为了通过考试中涉及该章节主题的部分，你需要掌握的知识。认证目标标题标识了章节内的目标，因此你一看到它时就能认出这是一个目标！\n\
  - **考试关注 (Exam Watch)**：注释提醒你注意考试中的信息和潜在陷阱。这些实用的提示由作者编写，作者已经参加过考试并获得了认证——还有谁比他更能告诉你该担心什么呢？\n\
  - **循序渐式的练习 (Step-by-Step Exercises)**：穿插在各个章节中。这些通常被设计为实操练习，让你能够感受通过考试所需的实战体验。它们能帮助你掌握可能成为考试重点的技能。不要仅仅阅读这些练习；它们是你应该去完成的实操练习。通过做中学学是提高你对产品熟练程度的有效方法。\n\
  - **职场实践 (On the Job)**：注释描述了现实环境中中最常出现的问题。它们为与认证和产品相关的课题提供了宝贵的视角。它们指出了常见的错误，并回答了工作中讨论和经验产生的问题。\n\
  - **深入考试内部 (Inside the Exam)**：侧边栏强调了学生在参加正式考试时遇到的一些最常见且困惑的问题。这些内容的设计旨在预测考试的重点，了解“考试内部”有助于确保你掌握了通过考试所需的全部知识。通过额外关注这些侧边栏，你可以在回答那些难以理解的问题时抢占先机。\n\
  - **认证总结 (Certification Summary)**：是对章节的简明复习，并对考试要点进行了重申。\n- **两分钟演练 (Two-Minute\
  \ Drill)**：每个章节末尾都有该章节要点的清单。可用于考前冲刺。\n\n### 问答 (Q & A)\n**自测 (Self Test)**：提供与考试类似的题目。这些问题的答案以及解析可以在每个章节末尾找到。通过完成每个章节后进行自测，你可以强化在该章节中学到的知识，同时熟悉试题的结构。\n\
  \n### 在线内容 (Online Content)\n有关书中提供的练习题和其他在线内容的更多信息，请参书末的“关于在线内容”附录。\n\n### 考试准备清单\
  \ (Exam Readiness Checklist)\n在引言结束处你会找到一份考试准备清单。该表格列出了 CLO-002 考试的 CompTIA 领域和目标，每个目标都有对应书中涵盖的章节。\n\
  \n### 建议 (Some Pointers)\n当你读完这本书后，请留出时间进行彻底的复习。你可能需要多次返回这本书，并利用它提供的所有复习方法：\n\n\
  1. 重读所有的“两分钟演练”，或让别人考你。你也可以将演练作为考前的快速复习。你可能想用 3 × 5 英寸的索引卡将“两分钟演练”的内容制作成闪卡。\n\n\n\
  \n\n\n### 3. 重新进行自测\n在读完章节后立即进行测试是一个好主意，因为这些问题有助于巩固刚刚学习的内容。然而，更好的主意是稍后回来，一次性回答书中的所有问题。假装你正在参加实战考试。当你第一次过一遍这些题目时，应该在另一张纸上记录你的答案。这样，你就可以根据需要多次练习这些题目，直到你对这些内容得心有余。\n\
  \n### 4. 完成练习题\n你在读完每个章节时做练习题了吗？如果没有，请去做了！这些练习题旨在涵盖考试考点，没有比练习更好的方法能让你熟悉这些材料了。请务必理解你为什么要执行每个练习题中的每一步操作。如果有某些内容你不清楚，请重新阅读该章节中的相关部分。\n\
