  \n#### 广网络访问\n\n在业务世界中，智能手机、平板电脑、笔记本电脑和桌面计算机都可以访问云资源，这使得广网络访问成为云计算的一项特征。此外，制造业、医学和其他领域的设备以及物联网（IoT）设备，如智能汽车和婴儿监视器发送数据，这些设备都可以配置为访问云服务。\n\
  \n使用任何类型的设备通过网络访问 IT 解决方案就是网络访问的含义。根据云服务的不同，可能需要网络浏览器或特定的应用程序。例如，用户可以使用浏览器或应用程序访问\
  \ Dropbox 云存储。通过使用如 Microsoft VPN 客户端在客户端设备和云端虚拟网络之间建立加密隧道来确保安全。\n\n以前如果你需要部署一个新的虚拟机，可能需要向\
  \ IT 部门申请。云计算将部署和有限控制权交给了用户。云用户可以通过图形界面（GUI）按需部署和管理，也可以使用命令行界面（CLI）工具进行管理。主要的公共\
  \ CSP（如 AWS 和 Microsoft Azure）提供使用 PowerShell 进行云管理，以及可以在 Linux 和 macOS 上运行的 CLI。开发者还可以通过应用程序接口（API）调用以编程的方式访问云资源。\n\
  \n#### 定价\n\n某些云订阅在收取小额月费外，还会根据当月使用的云资源收费。其他订阅可能仅按使用收费。对于组织而言，使用云计算意味着以前用于本地设备、软件、许可和支持的固定资本支出（CAPEX）现在变成了每月的运营支出（OPEX）。\n\
  \n想象你支付水费或电费的方式——它是基于你的消耗量的——你只为你使用的部分付费——这就是`pay-as-you-go`（按需付费）的意义。你可能还会听到将其被称为\
  \ `metered usage`（计量计费）。\n\n\n\n\n你可以快速轻松地在云端启动几十台虚拟机。一旦你关闭了 `VMs`，就不会再产生费用，尽管存储\
  \ `VM` 硬盘或你可能分配给 VM 网络接口的公网 IP 地址可能仍会产生小额费用。这与为了完成相同任务而必须获取并支付硬件和软件相比——云计算，至少在短期内，通常比自己在自己的网络上提供相同的服务要廉得多。\n\
  \n#### 可用性\n\n云服务提供商（CSPs）为每种云服务产品（如云存储、虚拟机和数据库）发布服务水平协议（SLAs）。标准 `SLA` 内的一项规定是指定的保证运行时间级别（例如\
  \ 99.9%），这涉及到服务和数据的可用性。通常，`SLA` 会对遭遇了故障且该故障属于 `SLA` 范围的客户提供分配的云计算积分额的详细信息。\n\n可用性的另一个方面则由云客户负责。如果你依赖于公共云计算服务，且你的互联网链路中断了，你就会面临问题。组织应该考虑通过不同的互联网服务提供商（`ISPs`）实施冗余互联网链路，以最大限度地提高云服务和数据的可用性。\n\
  \n个人和组织也可以将数据同步或备份到云端——这是智能手机用户的常用做法。如果用户更换了智能手机，她只需要在新手机上登录云账户即可访问照片、音乐、联系人列表等。可能需要安装一个智能手机\
  \ App 以允许用户首先登录云账户。图 1-4 显示了 Android 手机上同步的 Google 账户项目。\n\n**图 1-4** Google 账户同步设置\n\
  \n![Images](img/f0009-01.jpg)\n\n### 认证目标 1.02\n\n## 识别云服务模型\n\n人类喜欢分类，几乎如此。云服务也不例外。某些云服务模型吸引终端用户，某些吸引开发者，某些吸引服务器管理员、安全专家等。作为\
  \ CompTIA Cloud Essentials+ 考试候选人，你需要理解这些云模型。云服务的名称通常以服务类型开头，后跟“即服务（as a service）”，正如你将在下文中看到的。\n\
  \n#### 软件即服务 (SaaS)\n\n年前，在你运行如电子邮件之类的应用程序之前，你首先需要在计算机上安装并配置软件。如果你没有可以连接的邮件服务器，你还必须获取运行服务器的硬件，然后安装并配置电子邮件服务器软件——如果你在当时是从软盘上安装，那是一项特别漫的任务。\n\
  \n通过云计算，通过网络访问托管的软件被称为 `软件即服务 (SaaS)`。用户通常通过网络浏览器或已安装的 App 访问 `SaaS` 解决方案。通过 `SaaS`，用户本质上是通过网络租用软件，尽管某些服务是免费的。`SaaS`\
  \ 示例包括：\n\n![Images](img/square-1.jpg) Gmail\n![Images](img/square-1.jpg) Dropbox\n\
  ![Images](img/square-1.jpg) Netflix\n![Images](img/square-1.jpg) Uber\n![Images](img/square-1.jpg)\
  \ Microsoft 365\n\n#### 基础设施即服务 (IaaS)\n\n你不会把甜甜圈店称为基础设施。但甜甜圈店的存在是因为水、电、道路、桥梁和轨道。通过云计算，`基础设施即服务\
  \ (IaaS)` 指允许软件运行的底层组件。`IaaS` 的示例包括：\n\n![Images](img/square-1.jpg) 专用物理服务器\n![Images](img/square-1.jpg)\
  \ 虚拟机\n![Images](img/square-1.jpg) 虚拟网络\n![Images](img/square-1.jpg) 虚拟防火墙设备\n![Images](img/square-1.jpg)\
  \ 虚拟 VPN 配置\n![Images](img/square-1.jpg) 虚拟访问列表 (ACLs)\n![Images](img/square-1.jpg)\
  \ 云存储\n\n#### 平台即服务 (PaaS)\n\n*平台* 是一个 IT 技术人员可以其来解决业务问题的概念性工作台。通过`平台即服务 (PaaS)`，底层基础设施已为你配置好；你只需要指定相关细节。这有时被称为`无服务器（serverless）`计算。`PaaS`\
  \ 的示例包括：\n\n![Images](img/square-1.jpg) Azure SQL Database\n![Images](img/square-1.jpg)\
  \ Amazon Web Services Relational Database Service (RDS)\n![Images](img/square-1.jpg)\
  \ Azure Functions\n![Images](img/square-1.jpg) Google App Engine\n\n#### 其他云服务模型\n\
  \n任何封装成可管理包的云云服务类型都称为`万物即服务 (XaaS)`。表 1-1 总结了其他云服务模型。\n\n**表 1-1** 其他云服务模型\n\n![Images](img/f0011-01.jpg)\n\
  \n### 认证目标 1.03\n\n## 识别云部署模型\n\n云服务模型根据每个模型提供的服务进行分类，而*云部署模型*则是根据云计算基础设施的物理位置、谁拥有并控制它以及谁在使用进行分类的。以下是常见的云部署模型：\n\
  \n![Images](img/square-1.jpg) **公有云**：任何人通过互联网都可以使用的云服务，由 `CSP`（任何类型的提供云计算服务的实体）拥有和管理，例如\
  \ Amazon Web Services、Microsoft Azure、Google Cloud、IBM Cloud，甚至是提供在线公民服务（如驾照换证）的政府机构。\n\
  ![Images](img/square-1.jpg) **私有云**：由单一组织拥有、管理和使用的云计算基础设施，即使它是由第三方在机本地或异地部署的。\n\
  ![Images](img/square-1.jpg) **混合云**：本地网络向云端的扩展，无论是在迁移到云端期间还是长期存在。混合云还可以结合私有云（仅供一个组织使用的敏感\
  \ IT 系统）和公有云资源。\n![Images](img/square-1.jpg) **社区云**：针对具有相同计算需求群的云服务，通常由行业法规驱动。例如，为政府部门提供所需的云云软件和安全机制的政府机构云。\n\
  \n### 认证目标 1.04\n\n## 理解云共责任模型\n\n云计算意味着使用运行在他人管理的基础设施上的 IT 服务。即使对于私有云也是也是如此，因为私有云通常由组织内部的中央\
  \ IT 部门控制。部门对私有云服务的使用会被跟踪并分摊给各个组织部门（部门计费）。但这些 IT 服务的责任界限应该划在哪里呢？答案是，这取决于具体的云服务，即使如此，有时它是一项共同责任。\n\
  \n\n\n\n\n对于像基于网络的电子邮件之类的 SaaS 解决方案，其底层网络、存储和服务器（IaaS）由云服务提供商（CSP）控制，因此管理这些项目的责任由\
  \ CSP 承担。管理意味着：\n\n![Images](img/square-1.jpg) 硬件获取与配置\n![Images](img/square-1.jpg)\
  \ 固件更新\n![Images](img/square-1.jpg) 软件安装、配置和更新\n![Images](img/square-1.jpg) 根据 SLA\
  \ 维护服务和数据的可用性\n\n但电子邮件本身又呢？联系人信息？日历条目？谁负责电子邮件设置和归档？加密？这归结底就是一点：云客户负责管理他们创建的任何数据。一如既往，也存在例外，例如云提供商会根据适用的\
  \ SLA 对静态数据进行加密。\n\n部署 IaaS 虚拟机意味着该虚拟机受云客户的控制，因此，虚拟机的管理责任由云客户承担。\n\n部署托管数据库会向云客户隐藏基础设施细节。底层基础设施由\
  \ CSP 负责，但该解决方案的配置以及数据库中存储数据的管理是云客户的责任。\n\n### 练习 1-1\n#### 注册免费 Microsoft Azure\
