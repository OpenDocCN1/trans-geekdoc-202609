  \n## 第 11 章 管理云风险\n\n![Images](img/times.jpg)\n\n### 认证目标\n\n- 11.01 风险管理\n- 11.02\
  \ 资产与威胁\n- 11.03 缓解\n- 11.04 安全与审计\n\n![Images](img/tick.jpg)\n\n### 问答\n\n在本章中，你将接触：\n\
  \n![Images](img/times.jpg) 什么是风险？\n\n![Images](img/times.jpg) 组织可以做什么？\n\n我们将从这里开始：\n\
  ![Images](img/times.jpg)\n\n我们将通过以下方式结束本：\n![Images](img/times.jpg)\n\n### 风险管理\n\
  \n风险定义为损失的可能性。任何采用云计算的组织都面临风险，例如云提供商访问数据。虽然云服务与本地系统共享风险，但它引入了需要解决的新风险。\n\n#### 风险评估\n\
  \n风险评估涉及确定资产、对资产进行价值排序，然后确定威胁。风险评估包括以下活动：\n\n1. 识别资产（后文讨论）。\n2. 分配资产所有者。\n3. 资产敏感性分类。\n\
  4. 按价值排序资产。\n5. 识别资产威胁及其发生的可能性，并将其编制在风险表中。\n6. 对威胁划分优先级。\n7. 检查安全措施的有效性。\n8. 实施安全措施。\n\
  9. 定期重新评估安全措施的有效性。\n\n识别资产和威胁不是一次性活动；这是一个持续的过程。由于 IT 威胁不断变化，风险管理的一个关键部分是定期审查资产的使用情况以及威胁和安全措施。\n\
  \n#### 风险处理\n\n在识别资产和相关威胁后，组织可以实施措施来应对风险担忧。表 11-1\n\n##### 认证目标 11.02：资产与威胁\n\n\
  与云计算相关的风险管理从识别资产和相关威胁开始。然后对威胁进行优先级排序，以便关注最常见的安全问题。\n\n#### 资产清单\n\n每个组织都有对组织有价值的资产。在采取安全保护之前，必须在*资产清单*中发现并组织资产。资产清单在评估哪些现有\
  \ IT 系统是云安全的候选者时也非常有用。\n\n\n\n\n大多数云服务提供商都提供自动化方法，用于发现和分类云端（甚至是本地部署）的数据。![图 11-1\
  \ 显示了按信息类型组织的云数据资产发现。`Classification`意味着识别如信用卡号、街道地址或社会保险号等数据为敏感数据。**图 11-1** Microsoft\
  \ Azure 数据发现标签和信息类型![Images](img/f0218-01.jpg)\n\n资产清单还包括智能手机和笔记本电脑等计算设备。大多数企业都有一套配置和变更管理解决方案，提供计算资源的清单。\n\
  \n某些资产（例如客户数据）的价值高于其他资产（例如托管客户数据的数据库服务器）。必须根据价值对资产进行组织，以确定应该将时间和资金投入到哪些资产保护中。还必须确定资产所有者，以明确保护该资产的责任（并可能承担保护该资产的费用）。例如，如果研发部门（R\
  \ & D）开始在云端开发一种新的自定义业务应用程序，则为此目的而安全地使用云服务是研发部门的责任。\n\n![Images](img/exam.jpg)\n\n\
  **使用元数据对云资源进行标记是识别组织有价值云资源的另一种方法。这在根据相关性对云资产进行排序时非常有用****\n\n## 威胁优先级\n\n组织在识别并分类其资产后，必须识别相关的威胁。例如，如果你确定通过云托管电子商务网站进行购买的客户详情是宝贵资产，那么你需要识别相关的威胁，例如如果数据未加密会导致数据盗窃。\n\
  \n威胁优先级需要编制并维护一份 `risk register`（风险注册表）——一个集中组织的资产和威胁概率列表。威胁概率也可以基于过去发生的事件。组织对资产和威胁的定期评估还包括更新风险注册表。![表\
  \ 11-2 显示了风险注册表的简化示例。**表 11-2** 风险注册表示例![Images](img/f0219-01.jpg)\n\n### 认证目标 11.03\n\
  \n### 威胁缓解\n\n组织在编制资产清单和相应的相关风险注册表后，就可以选择并部署安全控制措施来缓解这些威胁。请记住，应尽可能持续监控安全控制措施以确保其有效性。关于安全控制措施如何解决安全漏洞的指导在不同组织之间可能不同。每个组织都有自己的安全策略来解决这个问题。虽然安全控制措施可以减少威胁影响，但仍然需要灾难恢复计划来已发生的威胁。\n\
  \n组织还必须确保技术人员遵循标准操作程序 (SOPs)，以确保对用户、`VMs` 或存储账户等云资源的持续管理。SOP 甚至可以针对特定部门。例如，云技术人员可能需要确保财务部门在云端复制的数据位于国界之内。这在云端也可以通过能够限制管理能力的策略来实现自动化。\n\
  \n#### 安全策略\n\n组织的安全策略通常受到法律法规的影响，例如欧盟的《通用数据保护条例》（`GDPR`），以及行业安全标准，如《支付卡行业数据安全标准》（`PCI\
  \ DSS`）。\n\n访问和控制策略定义了特定用户拥有的权限。（此处由于原文存在大量重复内容，翻译时已按要求处理）\n\n\n\n\n安全信息和事件管理（SIEM）工具提供了一种集中化的方法，用于收集、分析、关联和报告怀疑的安全事件。SIEM\
  \ 解决方案可以摄取许多不同类型的数据，包括来自数据库、云管理活动日志、身份提供程序、运行任何类型工作负载的虚拟机（VM）等。这种集中化便于告警的配置；它提供了对云环境中所有安全方面的可见性。SIEM\
  \ 需要针对其运行的特定环境进行配置；一个组织认为“可疑”的内容对另一个组织来说可能是正常的。云计算面临的一项监控挑战是许多云服务的易弃性。例如，启动一个虚拟机来支持应用程序工作负载可能只需要几秒钟，特别是当该过程是自动化的。由于此新虚拟机产生的任何安全事件在之后可能很难追踪，因为该虚拟机可以像启动时一样迅速被关闭和删除。考虑图\
  \ 11-3 所示的告警通知；通常利用率很低的虚拟机出现 CPU 利用率过高，可能表明存在拒绝服务（DoS）攻击，甚至是使用虚拟机进行比特币挖矿的恶意软件感染。\n\
  \n**图 11-3** Microsoft Azure 告警配置\n\n![Images](img/f0223-01.jpg)\n\n### 认证目标 11.04\n\
  \n## 安全测试与审计\n\n使用云服务通常涉及云客户与云服务提供商（CSP）之间的共享安全责任。例如，部署 IaaS 虚拟机意味着 CSP 负责支持虚拟机的底层基础设施，而云客户负责管理和加固虚拟机操作系统（OS）。同样，安全测试和审计适用于云客户和\
  \ CSP。云客户可以对各种云服务启用使用审计，包括数据库使用、虚拟机管理和云存储。\n\n仅仅因为 CSP 成功通过了安全审计，并不意味着云客户使用 CSP\
  \ 平台就是自动安全的。这种关系类比汽车公司与其客户之间的关系。仅仅因为汽车公司制造了符合安全标准的车辆，并不意味着鲁莽的驾驶员不会让这些车辆对他们和他人变得危险。\n\
  \n确保 CSP 符合 PCI DSS 等行业安全标准或 GDPR 等数据隐私法规至关重要，但通过各种方法进行安全评估以评估使用云服务的组织的安全态势同样重要。云客户可以使用内部或第三方审计员，审计员反过来通过准备好的审计文档报告他们的审计发现结果。\n\
  \n#### 漏洞扫描\n\n`vulnerability`（漏洞）是一个弱点。`Hardening`（加固）是减少 IT 解决方案攻击面以尽可能减少潜在弱点数量的过程。漏洞扫描功能可以是\
  \ CSP 内置的服务，也可以作为设备部署在云中，例如漏洞扫描虚拟机。图 11-4 显示了 Microsoft Azure 云环境中的自动 Security Center\
  \ 建议。\n\n![Images](img/f0225-01.jpg)\n\n**图 11-4** Microsoft Azure Security Center\
  \ 建议\n\n云存储设置、云网络配置和云虚拟机等基础设施可以进行被动评估以确定其安全性；换句话说，即识别弱点。\n\n可以使用例如 ZED Attack Proxy\
  \ 等模糊测试工具对 Web 应用程序进行漏洞扫描。模糊测试向应用程序发送随机的意外数据（`fuzz`），以观察应用程序的行为并增强应用程序的稳定性和安全性。\n\
  \n还可以评估访问控制机制，以确定是否向资源授予了过多的权限，这违反了`最小权限原则 (PoLP)`，该原则规定仅应授予执行任务所需的权限。\n\n#### 渗透测试\n\
  \n虽然漏洞扫描仅识别弱点，而渗透测试（pen testing）会主动尝试利用已发现的弱点。这可能导致敏感数据泄露或 IT 系统的中断。在执行渗透测试之前，必须获得\
  \ CSP 和云租户的书面批准。\n\n![Images](img/onjob.jpg)\n\n**大多数公共 CSP 允许对某些云服务进行有限的渗透测试。在执行之前，务必确保你被允许进行渗透测试。**\n\
  \n### 练习 11-1\n\n#### 数据安全\n\n在此练习中，你将创建一个 Azure 密钥库和加密密钥，可以使用它可以加密存储在云中的数据。此练习取决于已完成练习\
  \ 1-1 和练习 5-1。\n\n1. 使用网页浏览器登录 `https://portal.azure.com` 的 Microsoft Azure 门户。\n\
  2. 在左侧的导航面板中，点击 `Storage Accounts`（存储账户）。\n3. 在右侧的存储帐户视图中，点击你在练习 5-1 中创建的 `storacct1289`\
  \ 存储账户。\n4. 在存储帐户导航面板中，确保选中了 `Overview`（概述）。在右侧面板中，注意 `Location`（位置）。你创建的密钥库也将部署到此位置。\n\
  5. 在左侧导航面板的顶部，点击 `Create a Resource`（创建资源）。\n6. 在中心面板的搜索字段中，输入 `key vault`。从列表中选择\
  \ `Key Vault`，然后点击 `Create`（创建）按钮。\n7. 在 Create Key Vault Basics 页面上，创建一个名为 `ResGroup5`\
  \ 的新资源组。\n8. 将密钥库命名为 `KVMHE2020`。点击 `Review + Create`（审核并创建）按钮。\n9. 在屏幕上方收到 Validation\
  \ Passed（验证通过）消息后，点击 `Create`（创建）按钮。\n10. 在 Deployment Is Complete（部署完成）页面上，点击 `Go\
  \ to Resource`（转到资源）按钮。\n11. 在 Key Vault 导航面板中，点击 `Keys`（密钥）。\n12. 点击 `+Generate/import`（生成/导入）按钮。\n\
  13. 将密钥命名为 `Key2020`，如图 11-5 所示。\n\n**图 11-5** 创建 Azure 密钥库密钥\n\n![Images](img/f0227-01.jpg)\n\
  \n14. 接受所有其他默认设置并点击 `Create`（创建）按钮。\n15. 在左侧导航面板中，点击 `Storage Accounts`（存储账户）。\n\
  16. 在右侧的存储帐户视图中，点击练习 5-1 中创建的 `storacct1289` 存储账户。\n17. 在存储帐户导航面板中，点击 `Encryption`（加密）。\n\
