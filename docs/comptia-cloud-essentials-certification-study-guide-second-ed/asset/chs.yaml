  #### 自测答案\n\n#### 风险管理\n\n## 1. **C.** 在识别威胁或运行漏洞扫描之前，必须先识别资产。\n\n**A、B、和 D** 是错误的。威胁与资产相关；必须先识别资产。在识别资产和威胁之后，应定期进行漏洞扫描。\n\
  \n## 2. **A.** 风险接受承认与活动相关的风险，但未采取任何缓解风险的措施，通常是因为风险影响很小。\n\n**B、C、和 D** 是错误的。风险转移是指将某些风险转移给外部第三方（如保险提供商或云服务提供商）。风险规避意味着由于相关风险水平不可接受而不参与某项活动。风险缓解涉及应用安全控制来消除或减少已发生威胁的影响。\n\
  \n## 3. **B.** 风险转移将某些风险转移给外部第三方（如保险提供商或云服务提供商）。\n\n**A、C、和 D** 是错误的。风险接受承认与活动相关的风险，但未采取任何缓解风险的措施，通常是因为风险影响很小。风险规避意味着由于相关风险水平不可接受而不参与某项活动。风险缓解涉及应用安全控制来消除或减少已发生威胁的影响。\n\
  \n## 4. **D.** 风险缓解涉及应用安全控制来消除或减少已发生威胁的影响。\n\n**A、B、和 C** 是错误的。风险接受承认与活动相关的风险，但未采取任何缓解风险的措施，通常是因为风险影响很小。风险转移是指将某些风险转移给外部第三方（如保险提供商或云服务提供商）。\n\
  \n#### 资产与威胁\n\n## 5. **C.** 标准操作程序（SOPs）提供了在正常情况下如何进行某活动的指导。\n\n**A、B、和 D** 是错误的。服务水平协议（SLAs）是云提供商与客户之间的合同，定义了云服务的细节（如预期可用时间）。灾难恢复计划（DRPs）规定了如何快速恢复业务。。响应计划（IRPs）规定了在发生事件时应采取的立即行动。\n\
  \n## 6. **D.** 威胁与资产相关。必须先编制资产清单。\n\n**A、B、和 C** 是错误的。漏洞评估识别弱点，渗透测试利用弱点；这些是识别威胁的方法，而不是识别威胁的前身。风险登记是资产、威胁和控制措施的集中列表，因此在资产清单之后创建。\n\
  \n## 7. **B.** 标签标记为云资源添加元数据。这可以用于为了保护资产而组织资源。\n\n**A、C、和 D** 是错误的。日志记录、审计和漏洞扫描不会为云资源添加元数据。\n\
  \n### 威胁缓解\n\n## 8. **A.** 风险登记是资产、威胁和控制措施的集中列表。\n\n**B、C、和 D** 是错误的。安全信息和事件管理（SIEM）工具提供了一种集中方式来收集、分析、关联和报告疑似的安全事件。服务水平协议（SLA）是云提供商与客户之间的合同，定义了预期可用时间等服务细节。审计文件可能与安全控制有关，但它们没有列出数据保护控制措施。\n\
  \n## 9. **B.** 控制目标提供了安全控制为了保护资产必须满足的需求。\n\n**A、C、和 D** 是错误的。安全控制用于保护资产，例如对云存储数据的加密。风险登记是资产、威胁和控制措施的集中列表。安全信息和事件管理（SIEM）工具提供了一种集中方式来收集、分析、关联和报告疑似的安全事件。\n\
  \n## 10. **D.** 平均修复时间（MTTR）是一个重要的可用性指标，规定了故障后恢复服务或组件所需的平均时间。\n\n\n\n\n\n![Images](img/times.jpg)\n\
  A、B 和 C 都是错误的。服务水平协议（SLAs）是云客户与云服务提供商之间的合同，概述了保证的云服务运行时间以及未达到运行时间要求时产生的后果。灾难恢复计划（DRPs）提供了有关如何快速恢复故障的业务流程、IT\
  \ 系统或数据的细节，并尽可能减少中断。事件响应计划（IRPs）规定了发生负面事件时应采取的即时行动，例如隔离安全漏洞并与组织的信息技术安全官通信该事件。\n\n\
  ### 安全测试与审计\n\n11. ![Images](img/tick2.jpg) D. 最小权限原则规定，应仅授予执行任务所需的权限。\n\n![Images](img/times.jpg)\
  \ A、B 和 C 都是错误的。安全信息和事件管理（SIEM）工具提供了一种集中方法，用于收集、分析、关联和报告怀疑的安全事件。控制目标提供了安全控制为了保护资产而必须满足的要求。漏洞评估识别弱点，但不会像渗透测试那样尝试利用这些弱点。\n\
