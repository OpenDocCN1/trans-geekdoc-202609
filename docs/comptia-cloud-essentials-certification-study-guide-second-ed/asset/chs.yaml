  ## 考试内部\n\n#### 活动顺序\n\nCompTIA Cloud Essentials+ CLO-002 考试可能会向你提出许多关于活动执行顺序的问题。例如，在资产清单中识别出组织资产之前，你无法创建风险注册表。同样，在确定应该在哪里分配大部分的时间和资源来保护资产之前，必须创建风险注册表。\n\
  \n\n\n\n在本章中，你学习了如何在云计算环境中管理风险。成功的风险管理实施始于对将暴露在云端的资产进行识别、所有权归属、分类和优先级排序，随后是识别相应的威胁及其发生的概率，并将其汇总到中央风险登记表中，然后使用该登记表对威胁进行优先级排序。接下来是评估现有的安全控制对于云安全是否有效，或者需要用新的控制措施进行补充。最后，定期的资产和安全控制审查对于确保资产得到持续有效的保护至关重要。\n\
  \n本章还向你介绍了常见的风险处理方法，如风险接受、转移、规避和缓解。采用云计算是风险转移的一个示例，其中云服务可用性的部分责任由云服务提供商承担。\n\n你学习了控制目标是保护资产的明文要求，而安全控制措施则是为了为了解决这些安全疑虑而实施的。控制目标的一个示例可能是确保云数据在发生区域性灾难时仍然可用，因此将数据复制到备区域就是安全控制措施。由于负面事件随着时间的推移不可避免的，因此灾难恢复计划非常重要，以便在中断发生时尽可能地减少影响。在云中，灾难恢复可以包括将本地数据备份到云端。\n\
  \n接下来，你学习了 `SIEM` 解决方案摄取多种数据源（如日志），以识别潜在的安全事件并发布告警。最后，你学习了渗透测试在哪些方面超越了漏洞扫描，因为它不仅识别漏洞，还会尝试利用这些发现的漏洞。\n\
  \n### ![Images](img/tick1.jpg)两分钟演练\n\n#### 风险管理\n\n![Images](img/box1.jpg) 计划采用云计算的组织可以聘请\
  \ IT 咨询公司的专业服务，创建一个建议书（RFP），使云服务与业务需求对齐。\n\n![Images](img/box1.jpg) 使用云服务引入了对 `CSP`\
  \ 和 `ISP` 的业务依赖。\n\n![Images](img/box1.jpg) 风险评估从识别资产开始，随后是分配资产所有者、资产标记并按价值排序、威胁识别和优先级排序、安全控制有效性审查以及安全控制的修改或实施。\n\
  \n![Images](img/box1.jpg) 安全控制需要定期审查，以确保它们对不断演变的威胁持续有效。\n\n![Images](img/box1.jpg)\
  \ 风险登记表是组织资产和相关威胁的中央列表，带有威胁可能性评级值。\n\n![Images](img/box1.jpg) 风险接受意味着参与某活动并承认相关风险，但不缓解这些风险。\n\
  \n![Images](img/box1.jpg) 风险转移将部分或全部风险转移给第三方（例如保险提供商）。\n\n![Images](img/box1.jpg)\
  \ 风险规避意味着由于相关风险水平高到不可接受而不参与某项活动。\n\n![Images](img/box1.jpg) 风险缓解涉及实施安全控制以减少已发生威胁的影响。\n\
  \n#### 资产与威胁\n\n![Images](img/box1.jpg) 标准操作程序 (`SOPs`）为正常情况下云资源的部署和管理提供指导。\n\n\
  ![Images](img/box1.jpg) 云策略可以限制云技术人员的管理权限。\n\n![Images](img/box1.jpg) 数字资产发现可以自动或也可以手动进行，包括云资源标记。\n\
