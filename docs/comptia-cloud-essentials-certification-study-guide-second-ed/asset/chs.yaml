  \n#### 威胁缓解\n\n![Images](img/box1.jpg) 安全控制被用于缓解威胁。\n\n![Images](img/box1.jpg) 标准操作程序\
  \ (`SOPs`) 确保云资源的一致管理。\n\n![Images](img/box1.jpg) 安全策略定义了组织如何安全地使用 IT 解决方案。\n\n\
  ![Images](img/box1.jpg) 访问和控制策略定义了特定用户、设备或软件拥有哪些权限。云策略定义了组织如何安全地使用 IT 解决方案，并以安全的方式访问资源。\n\
  \n![Images](img/box1.jpg) 部门特定的策略定义了如何安全地使用技术。\n\n![Images](img/box1.jpg) 控制目标是保护资产的要求。\n\
  \n![Images](img/box1.jpg) 安全控制减少了已发生威胁的可能性，例如通过加密网络连接。\n\n![Images](img/box1.jpg)\
  \ 网络安全组 (`NSGs`) 定义了允许或拒绝流量。\n\n![Images](img/box1.jpg) 应急响应计划 (`IRP`) 规定了发生事件时应采取的立即行动。\n\
  \n![Images](img/box1.jpg) 灾难恢复计划 (`DRP`) 比 `IRP` 更详细，规定了在灾难时如何恢复服务或组件。\n\n![Images](img/box1.jpg)\
  \ 恢复时间目标 (`RTO`) 指定允许的最大停机时间；恢复点目标 (`RPO`) 指定允许的最大数据丢失。\n\n![Images](img/box1.jpg)\
  \ 平均修复时间 (`MTTR`) 指定了故障服务的平均时间。\n\n![Images](img/box1.jpg) 安全信息和事件管理 (`SIEM`) 工具提供了收集、分析、关联和报告疑似事件的方法。\n\
  \n![Images](img/box1.jpg) `SIEM` 需要在其运行的环境中配置。\n\n#### 安全测试与审计\n\n![Images](img/box1.jpg)\
  \ 漏洞扫描识别漏洞。\n\n![Images](img/box1.jpg) 渗透测试在获得许可后尝试利用漏洞。\n\n![Images](img/box1.jpg)\
  \ 模糊测试向应用程序提交意外数据以观察应用程序的行为并增强安全性。\n\n### ![Images](img/qs.jpg)自测\n\n以下问题将帮助你衡量对本章介绍材料的理解。如所示，某些问题可能有多个答案，请务必仔细阅读每个答案。\n\
  \n#### 风险管理\n\n**1 评估的第一步是什么？**\nA. 威胁识别\nB. 威胁优先级排序\nC. 资产识别\nD. 漏洞扫描\n\n**2 哪种风险处理方法承认活动相关的风险但不采取纠正措施？**\n\
