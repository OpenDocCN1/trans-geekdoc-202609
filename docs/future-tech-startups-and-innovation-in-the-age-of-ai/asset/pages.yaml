  img_proc: true
- pgno: 157
  md: '# AI Models and Prompt Engineering ■ 137


    The process of fact-checking typically involves the following steps:


    +   - Sourcing: Identifying the original source of the information and assessing
    its credibility and reputation. It is crucial to consider the expertise, authority,
    and reliability of the source.


    +   - Cross-referencing: Comparing the information with multiple reliable sources
    to determine its consistency and veracity. Checking if the information is corroborated
    by other credible sources helps establish its accuracy.


    +   - Evidence gathering: Conducting further research to gather evidence, data,
    or expert opinions that support or refute the claim being fact-checked. This may
    involve consulting subject matter experts, official records, scientific studies,
    or statistical data.


    +   - Verification: Scrutinizing the evidence gathered and evaluating its reliability
    and relevance to the claim being fact-checked. This includes assessing the methodology,
    sample size, and objectivity of studies or surveys.


    +   - Analysis: Drawing conclusions based on the evidence and making a judgment
    about the accuracy of the claim. Fact-checkers categorize claims as true, false,
    misleading, partially true, or lacking sufficient evidence.


    Fact-checking plays a crucial role in promoting informed decision-making, holding
    public figures and institutions accountable, and combating the spread of misinformation.
    It helps individuals and society at large scale make well-informed judgments based
    on accurate information, fostering a more reliable and trustworthy information
    ecosystem.


    The incident during the live demonstration of Google''s AI chatbot, Bard, presents
    an interesting case of the challenges faced by AI systems in generating reliable
    and accurate responses based on real-world information.


    In this particular event, when asked about the Webb Space Telescope''s new findings,
    Bard provided inaccurate information, as shown in Figure 8.3, by claiming that
    the telescope had the first images of a planet outside our solar system. This
    misinformation could have caused confusion or misunderstanding among the audience,
    particularly those who are not versed in astronomical exploration.


    This situation highlights a critical aspect of AI systems – the importance of
    reliable data feeding along with its ability to understand and interpret the context
    correctly. Displaying erroneous facts, especially in public demonstration, can
    undermine the technology’s credibility and trustworthiness, and the magnitude
    of losses incurred during this event reverberates across the financial landscape,
    as depicted in Figure 8.4, prompting a closer examination of the underlying factors
    that contributed to this confluence.


    Evidently, there is a clear need for efficient mechanisms to verify the accuracy
    of information generated by AI systems. Strategies such as fact-checking supplements,
    training models with updated and verified sources, or implementing review processes
    to double-check information can be beneficial in preventing similar incidents
    in the future.'
