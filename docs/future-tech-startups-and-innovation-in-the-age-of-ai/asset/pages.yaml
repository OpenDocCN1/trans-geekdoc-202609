- pgno: 195
  md: '# Innovation Management in the Era of AI 175


    generate new ideas. “The use of purposive inflows and outflows of knowledge to
    accelerate internal innovation and expand the market for external use of innovation,
    respectively; is how Henry Chesbrough, the man who initially invented the term,
    defines open innovation [7]. By using a variety of concepts, innovative business
    methods, and industry information from outside sources, this strategy enables
    firms to provide original goods and services.


    According to the direction of knowledge flow, there are three distinct models
    referred to as “open innovation theory”: coupled open innovation, which combines
    knowledge inflows and outsides; inside-out open innovation, which is an outgoing
    knowledge flow; and out-in open innovation, which is an inbound knowledge flow
    [8, 9]. Open innovation has several advantages, such as the capacity to produce
    many ideas from various viewpoints, develop solid connections with outside expert
    partners, and access a larger pool of ideas and talent, all of which contributing
    to creating more inventive and successful products.


    # 10.2.1.3 Disruptive Innovation


    The term “disruptive innovation” describes the launch of a new good or service
    that, by forming a new network, dramatically transforms an already-existing market
    and eventually displaces well-established market-leading companies, goods, and
    partnerships. Professor Clayton Christensen of Harvard Business School originally
    presented this in 1995 [10]. Low-end disruption and new-market disruption are
    the two categories into which disruptive innovation can be divided. While new-market
    disruption establishes a new sector in an existing market with a low-cost product
    version, low-end disruption happens when a company enters at the bottom of an
    existing market, targeting less profitable clients with a low-cost business model.


    Startups and smaller enterprises are frequently linked to disruptive innovation
    because they threaten more established, larger companies by offering goods or
    services that the latter did not foresee, generating new value and upending the
    market. Blockchain, 5G technology, sophisticated virtual reality, AI, and ML are
    disruptive technologies. Disruptive innovation has the potential to significantly
    alter consumer behavior and habits while also having a dramatic effect on businesses,
    people, and society at large


    # 10.2.2 Integration of AI into Innovation Models


    The traditional innovation process is being revolutionized by AI, which has a
    huge impact on innovation. Organizations improve various areas of innovation with
    the help of AI’s processing capacity and predictive analytics capabilities (Figure
    10.1). It can develop new ideas by analyzing massive datasets, rank ideas according
    to their feasibility and potential impact, speed prototyping by automating processes
    like making 3D models and simulations. Furthermore, AI is acting as an all-purpose
    “method of innovation” that has the power to change how research and development
    (R&D) are conducted. The various applications of AI, especially in research and
    innovation, where it speeds up scientific discovery and stimulates economic growth,
    further demonstrate the impact of AI on innovation. In conclusion, AI is changing
    the innovation landscape by producing new ideas, assisting in the assessment and
    selection of concepts, and accelerating the prototype process.'
