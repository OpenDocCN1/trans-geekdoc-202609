    and Chair of the Research and Scholars Activities Committee at University Canada
    West. He has over 20 years of experience in both industry and academic sectors.
    He has worked at international companies from Cyprus, the United Kingdom, Malta,
    Iran, Malaysia, and Canada and has been highly involved in the development of
    projects in different industries, healthcare, transportation, residential, oil,
    gas, and information technology (IT). Apart from his experience in industry, he
    also has some achievements in academia. He has been a university lecturer in three
    different parts of the world, Southeast Asia, the Middle East, and North America.
    His academic experience started from 2009, as a lecturer in AU and PNU and is
    currently an Adjunct Professor at Westcliff University, Irvine, USA. In addition
    to his leadership positions, he was Team Leader and Research and Development (R&D)
    Manager of the Research Club and Hamta Academy, Mentor at the Vancouver Island
    University CETP, and serves on the Advisory Board of Cambridge Scholars Publishing,
    and the Scientific Board of NASS, Singapore. He is also Senior Technical Consultant
    at Innotek Consulting Ltd, Quark Minded Technology Inc, CI Solutions Ltd, and
    the Mentor at Futurpreneur Canada. He has continued his path in teaching, concentrating
    research and development for 13 years, teaching undergraduate students, postgraduates
    and executive staff in different countries. He has developed many R&D teams in
    different businesses, inspiring project team members from various educational
    backgrounds to play effective roles in R&D teams. He has developed his customized
    approaches in teaching research methodology and shared his viewpoints in research
    methods area in more than 30 open-access publications over the years. He has organized
    and chaired numerous workshops, conferences, and conference sessions respectively,
    and has delivered as chief guest and keynote speaker. Moreover, he is an editor,
    reviewer, and advisory board member of some authentic peer-reviewed journals publishing
    with Taylor & Francis, Springer, Emerald, Elsevier, MDPI, EAI, IGI Publishing,
    and Inderscience. He has been an active multidisciplinary researcher and R&D specialist
