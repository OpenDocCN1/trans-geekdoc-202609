    # 4.2 RELATED WORKS


    # 4.2.1 AI


    Building intelligent machines to carry out jobs devoid of human intelligence is
    the focus of the broad field of AI, which is a subfield of computer science. Despite
    the fact that there are many different approaches to AI as an interdisciplinary
    discipline, breakthroughs in machine learning (ML) and deep learning (DL) in particular
    are a paradigm shift in almost every area of the technology industry [7].


    ML and AI are merely parts of the same technology. For creating and refining ML
    algorithms, specialized hardware and software are needed. For the most part, AI
    functions by consuming enormous quantities of training data, searching the data
    for correlations and patterns, and using these patterns to forecast future states
    [8].


    Although the terms AI and ML are sometimes used synonymously, ML is actually a
    subset of the larger domain of AI.


    As AI can be attained through ML, this branch of AI learning to make everbetter
    judgments by using algorithms to automatically discover patterns and acquire insights
    from data. Leaders can understand and act on data-insights more quickly and effectively
    by integrating AI and ML into their systems and strategic plans.


    By incorporating data analytics and machine learning into IoT applications, AI
    may assist manufacturing leaders in automating their business operations [9].


    One of the most fascinating developments in AI is machine learning. It is referred
    to the area of research that offers computers to learn without being programmed.
    Even if AI programs accomplish more intriguing things, ML was created as a new
    computing capability, and it now permeates many fields of business and fundamental
    research [10].


    # 4.2.2 Internet of Things


    IoT refers to the trillions of physical devices connected to the internet and
    the worldwide storage and exchange of data. By connecting and attaching sensors
    to all these different things, AI can be applied to otherwise dumb devices so
    that they can share data in time without the need for a human being [11]. IoT
    merges the digital and physical worlds, offering smart devices to automate farming
    and reduce labor costs [12].'
