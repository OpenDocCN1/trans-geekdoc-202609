    # 8.7 RESULTS AND DISCUSSIONS


    The findings presented in this chapter underscore the pivotal role of prompt engineering
    in yielding substantial enhancements in the overall performance of LMs across
    a diverse spectrum of tasks. Through meticulous and strategic formulation of prompts,
    researchers and practitioners can harness the latent capabilities of these models
    to achieve unprecedented levels of proficiency and accuracy. We found that using
    sentiment analysis to inform prompt engineering can lead to further improvements
    in performance.


    In terms of fact-checking, we see that both Google Bard and Bing AI have an advantage
    over ChatGPT as they have access to real-time information from the internet. However,
    it is important to note that each chatbot has its own strengths and weaknesses
    and may perform better in certain contexts than others. Yes, there was an incident
    where Google made a factual error during a demonstration. Astrophysists on Twitter
    and New Scientist pointed out this error, leading to Google''s parent company
    Alphabet losing $100 billion in market value, as depicted in Figure 8.4. This
    incident highlights the importance of rigorous testing and fact-checking for AI
    tools.


    It is possible that all LLMs, ChatGPT, Google Bard, and Bing AI, may have made
    errors when arranging questions in chronological order or when recalling events.
    LLMs are trained on vast amounts of text data and can generate human-like responses
    to a wide range of questions. However, they are not perfect and may occasionally
    produce incorrect or inconsistent answers. This is known as hallucination, where
    the model generates text that is not grounded in reality or fact. It is important
    to keep in mind that LLMs are still under development, and are not yet perfect.
    They can be a valuable tool for research and for generating creative text formats,
    but they should not be relied on for information.


    When comparing the efficacy of prompt engineering with outputs, ChatGPT produced
    the correct answer, as shown in Figure 8.5, while Google Bard and Bing AI produced
    the same but incorrect answers, as depicted in 8.7 and 8.9. This is likely because
    ChatGPT is better at understanding the nuances of language and at being able to
    distinguish fact from fiction. LLMs like ChatGPT, Google Bard, and Bing AI are
    trained on a huge amount of text data and can generate human-like responses to
    a wide range of inquiries. The reason why Bard and Bing returned the wrong answer
    is because they are not able to understand the nuances of language. They both
    interpreted the prompt "print(factorial(10))" as a request to print the value
    of the factorial function when the input is 10. However, the correct interpretation
    of the prompt is to print the value of the factorial function when the input is
    10, and then to print the result. ChatGPT, on the other hand, is able to understand
    the nuances of language. It can interpret the prompt correctly and generate the
    correct output [22].


    ChatGPT and Bing AI are not as good at arithmetic reasoning as Google Bard, as
    evidently shown in Figures 8.10–12. This is likely because Google Bard is trained
    on a massive dataset of text and code, including a large amount of mathematical
    information. ChatGPT and Bing AI, on the other hand, have been trained on smaller
    datasets of text and code. As a result, they may not have as much exposure to
    arithmetic reasoning problems.'
