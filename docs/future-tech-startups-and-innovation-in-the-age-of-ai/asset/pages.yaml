  md: '# AI in the Gaming Industry


    Amal Saif, Qasem Abu-Haija


    # 7.1 INTRODUCTION


    Players in worldwide produce massive amounts of data. An increasing number of
    developers and gamers are interested in integrating the virtual and real worlds.
    The coupling between artificial intelligence (AI) or machine learning (ML) with
    the game industry is called game AI [1]. The study and application of AI methods
    to create computational representations of players'' experiences are known as
    player experience modeling (PEM). PEM offers an AI framework for the interdisciplinary
    nexus of affective computing, experimental psychology, player modeling, and human–computer
    interaction (HCI). Recently, an increasing number of seminars have focused on
    player experience, happiness, and their modeling [2], as in IEEE Transactions
    on Games Journal. Board games, especially chess games, are the most famous examples
    of game AI; they are rules that decide to make the right movements based on learned
    strategies [3], as shown in Figure 7.1.


    Serious games teaching or improving some skills, raising awareness, and education:
    they have interests and purposes beyond entertainment [4].


    An example of serious games is health games. Health games are designed for many
    purposes: they can help with mental disorders, rehabilitation, handling acute
    pain, diagnosing illnesses, and many other contexts. The foundation of serious
    games is the idea of gamification, which is the “use of game design elements within
    non-game contexts” through game structure, design, and technique. Empirical data
    suggests that gamification generally depends on three components: game dynamics,
    encompassing player behaviors, interactions, and experience; the game’s pedagogical
    or instructional design; and the game’s mechanics, rules, and procedures. Gamification
    usually uses leaderboards, points,


