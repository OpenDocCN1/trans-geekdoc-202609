    # 1.11 CHALLENGES IN IMPLEMENTATION OF AI FOR STARTUP GROWTH


    Innovative machine learning algorithms have been growing in the era of AI with
    the potential to revolutionize various industries such as healthcare, education,
    manufacturing, and retail. Issues related to data quality, privacy, and lack of
    qualified employees are among the obstacles preventing AI from being widely used
    [71]. Having easy access to digital building is crucial to the success of innovative
    construction tech solutions. However, converting information to digital format
    is not enough; it needs to be comprehensible by diverse systems and available
    on a range of building information modeling (BIM) platforms. Lack of direct access
    to shared information hinders the efficient use of AI in the construction industry
    [72].


    Many businesses have taken advancement in AI into account. Ninety percent of respondents
    to a study believe AI could benefit them, but 40% reported that with large investments,
    there were no real assistive gains from these expenditures. The challenges hindering
    successful AI implementations are technological problems, related issues, cultural
    factors within organization, or political or governance difficulties [73]. Table
