  md: '# 8.6.2 Prompt Leaking


    Prompt leaking is a type of prompt injection attack where users attempt to extract
    information from the model by coaxing it into revealing a hidden preprompt. Preperms
    are typically used to provide context or instructions to the model, but they are
    not intended to be visible to users. In a typical LM, such as GPT-3, the model
    is provided with a prompt which consists of an initial input that sets the context
    for generating the desired output. Preprompts are additional instructions or cues
    given to the model that are not displayed to the user. These use can guide the
    model''s behavior or help it generate more specific responses. However, in prompt
    leaking attacks, users try to manipulate the model by asking questions specifically
    designed to elicit a response that indirectly reveals the hidden preprompt. By
    exploiting the model''s tendency to contextualize relevant responses, users extract
    information that they should not have access to. To mitigate prompt leaking, developers
    and researchers can take several precautions to minimize the risk of leaking sensitive
    information. It is also essential to stay updated with the latest security recommendations
    and best practices of the model creators. OpenAI, for instance, provides guidelines
    and documentation on responsible use of their models to prevent potential misuse.


    # 8.6.3 Token Smuggling


    Token smuggling is a type of jailbreaking attack that exploits vulnerabilities
    in computer systems to gain unauthorized access. In this attack, the malicious
    actor disguises their intentions by embedding their prompt or code within a seemingly
    harmless or legitimate code writing task. The objective of token smuggling is
    to bypass security measures and gain control over the system by tricking it into
    executing unauthorized commands. This can be achieved by exploiting vulnerabilities
    in the handling of authentication tokens or session management. Authentication
    tokens are commonly used in web applications to manage user sessions and keep
    users logged in. These tokens are usually generated after successful authentication
    and are included in subsequent requests to identify the user and maintain their
    session. However, if token generation or validation process is flawed, attackers
    can exploit these weaknesses to gain unauthorized access. In a token smuggling
    attack, an attacker may manipulate the token in a way that it appears valid and
    legitimate. By doing so, they can trick the system into granting them access or
    executing arbitrary commands on their behalf. The smuggling of tokens often involves
    the injection of malicious code into a seemingly harmless piece of code, such
    as a code-writing task. When the code is executed, the malicious code is also
    executed alongside it, allowing the attacker to exploit vulnerabilities and gain
    unauthorized control over the system. To prevent token-smuggling attacks, it is
    important to ensure secure token generation and validation practices. This includes
    ensuring that tokens are properly randomized, securely stored, and regularly rotated.
    Additionally, implementing strict input validation and output encoding techniques
    can help mitigate the risk of code injection attacks.'
