  md: '# Editor Biographies


    **Dr. Inam Ullah Khan** is the founder of AIEYS. He was visiting researcher at
    King''s College London, UK. Also, he was faculty member at different universities
    in Pakistan, which include the Center for Emerging Sciences Engineering and Technology
    (CESET), Islamabad; Abdul Wali Khan University; Garden Campus; Timgara Campus;
    University of Swat; and the Shaheed Zulfikar Al Bhutto Institute of Science and
    Technology (SZABIST), Islamabad Campus. Isra University, Islamabad Campus, School
    of Engineering and Applied Sciences (SEAS). Also, he earned his M.S. degree in
    electronic engineering at the Department of Electronic Engineering, Isra University,
    Islamabad Campus. He earned undergraduate bachelor''s degree in computer science
    from Abdul Wali Khan University Mardan, Pakistan. Apart from that, his master''s
    thesis is published as a book on the topic Route Optimization with Ant Colony
    Optimization (ACO) in Germany, which is available on Amazon. Most interestingly,
    he used to teach subjects such as computer security, AI, evolutionary computing,
    professional practice, software engineering, data communication and networks,
    databases, cybersecurity, visual programming, computer organization and Assembly
    language, and introduction to programming. He has authored and coauthored more
    than 30 research articles in published journals, conference papers, and book chapters.
    He recently introduced a novel routing protocol E-ANTHOCNET in the area of flying
    ad networks. His research interest includes network security, intrusion detection,
    intrusion prevention, cryptography, optimization techniques, wireless sensor networks
    (WSNs), IoT, mobile ad networks (MANETs), flying hoc networks, and ML. He served
    as a technical program committee member for international conferences, including
    the EAI International Conference on Future Technologies, Islamabad, Pakistan;
    and the 2nd International Conference on Networks and Distributed Systems, Amman,
    Jordan, June 26–27, 2018; International Workshop on Computational Intelligence
    and Cybersecurity in Emergent Networks (CICEN21) held in conjunction with the
    12th International Conference on Ambient Systems, Networks, and Technologies (EUSPN2021),
    which was co-organized in November 1–4, 2021, Leuven, Belgium. Also, he was the
    technical program committee member at an international workshop on intelligent
    systems for sustainable cities, New Delhi, India, February 19–20, 2022. In addition,
    he served as editor for about 12 books on various topics. In 2022, he served as
    special session chair at the International Conference on Advances in Communication
    Technology'
