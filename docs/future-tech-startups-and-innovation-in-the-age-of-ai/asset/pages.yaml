    # 5.2 LITERATURE REVIEW


    AI is used in a variety of businesses, from manufacturing to automobiles; one
    of the fascinating businesses that AI is breaking into agribusiness; agriculture
    is a significant industry and an enormous piece of the foundation of our economy;
    as climate changes and populations grow, AI is evolving into a technological innovation
    that is improving and ensuring crop yield. Crop management, weed and pest detection,
    and soil management are among well-known applications of AI in agriculture (Ryan,
    2022). Machine learning (ML) models are used to track and predict regular impacts
    on crop yield, such as climate change (Mohr & Kühl, 2021).


    Drone Deploy, a San Francisco-based startup, has developed software that allows
    anyone to operate a small drone and analyze the captured mapping images using
    a computer or smartphone. Agriculture, construction, inspection, and insurance
    are some of the industries that the company focuses on. Users can launch any commercially
    available drone on an automated path with a single click to obtain same-day aerial
    maps and 3D field models. The technology may assist them in seeing when their
    crops need attention, estimate yields, and store accurate data for comparison
    over time. A drone is intended to eliminate mistakes made by humans in crop scouting.
    Fixed-wing aerial vehicles (UAV) allow farmers to inspect more areas in less time
    while collecting near-infrared band data for vegetation evaluations. Furthermore,
    it is almost entirely autonomous. To it into the air, and it will fly, gather
    images, and land on its own. After flying, it can quickly generate crop maps,
    identify problem areas, customize agricultural application maps, and create drone-to-tractor
    workflows for crop treatments on the same day (Pathan et al., 2020).


    Irrigation and water conservation: Real-time technologies for monitoring soil
    moisture and availability, and thus managing costs, are essential. Precision farming
    can reduce waste while producing valuable crops, high productivity, and a competitive
    advantage (Cavazza et al., 2023).


    Maintaining livestock records: Farmers can track their herds using phones or home
    computers thanks to collars placed on grazing animals and cameras in the fields.
    Tags attached to livestock can transmit information ranging from the animals''
    health to their mating patterns (Paymode & Malode, 2022).


    Crop sensors and farm machinery: Sensors can be linked to various agricultural
    machinery such as combine harvesters, tractors, and other devices, allowing farmers
    to gather new information about their crops and soil. Precision agriculture is
    made more creative and by sensing technology (Sishodia et al., 2020). This is
    only one method for increasing the quantity and quality of agricultural production.'
