  md: '# AI in the Gaming industry 115


    Multiplayer online battle arena (MOBA) games are complex; a proposed idea was
    to integrate reinforcement learning to play a full game because MOBA games are
    multi-agent Markov games. To highlight the complexity of these models and achieve
    the above, they needed to integrate reinforcement learning with long short-term
    memory (LSTM), needed several types of features, and needed to develop a hierarchy
    prediction system [22].


    There are two types of reinforcement learning: on-policy and off-policy. The behavior
    policy used to choose actions from the learning strategy when off-policy reinforcement
    learning techniques are employed. Conversely, behavior and learning policies are
    identical in on-policy RL algorithms. Additionally, there are categories into
    reinforcement learning can be divided: value-based and policy-based. Value-based
    RL employs an use of the value function to identify an appropriate policy, in
    contrast to policy-based RL, in which agents learn the policy directly [23].


    # 7.4 GAMING AI CHALLENGES


    The union of games with AI poses new challenges: the following points highlight
    some:


    +   * **Long-term engagements:** Massively multiplayer online games (MMOGs) connect
    gamers from different countries for a long time, allowing them to join and continue
    playing anytime. Therefore, analyzing the players'' data and providing long-term
    engagements using AI is necessary.


    +   * **Real-time communication** between players is required. Leveraging the
    data from players is a concern because each affects the other players'' experiences.


    +   * Dota 2 games, for instance, run at 30 frames per second for roughly 45 minutes.
    If a decision is made every four frames, this equates to 20,000 steps in a game.
    On the other hand, card game participants typically make fewer choices [24].


    +   * **Game design:** The automation of many game roles and the fact that AI
    should generate augmented reality games increase the development complexity. The
    diversity of techniques, platforms, environments, constraints, and technologies
    requires complex algorithms to adapt.


    +   * **Ethical consideration:** Users'' privacy, well-being, and safety should
    be the priority while using AI in games. Producing games that agree with communities
    and their reservations is a crucial thing to consider, in addition to the importance
    of paying attention to the content and its suitability to the age that these games
    target. Paying attention to diversity and making the game inclusive are also important.
    Although there is a conflict between the financial return and restricting the
    enjoyment of the game to keep the person away from addiction to games, it is important
    to control the duration of play to protect the health of the players. Many ethical
    standards must be met, not only between players and the game but also between
    game producers,'
