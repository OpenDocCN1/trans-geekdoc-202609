    # 8.3 STRUCTURED INPUT VERSUS LNI (PROMPT VERSUS QUERY)


    A Google search is called as a query, as shown in Figure 8.1, and a Google Bard
    search is called a prompt, as shown in Figure 8.2. A query is a question or phrase
    that you type into the Google search bar. A prompt is a more specific type of
    query that is used to elicit a specific type of output from Google Bard. Examples
    of queries:


