  md: '# 8.5.2 Prompt versus Context Prompts


    # 8.5.2.1 Prompt


    In prompt engineering, a prompt refers to an input or query such as a text that
    serves as the directive for an AI system. It is carefully crafted to provide context
    and restrictions, guiding the system''s understanding and generation process.
    By optimizing the prompt through techniques like prefix tuning, and by improving
    the fine-tuning process of the AI system, we can significantly enhance its ability
    to understand and generate accurate and relevant responses. This plays a crucial
    role in boosting the overall performance of the AI system and ensuring the delivery
    of high-quality results. For example, a code that prints, "Hello, world!"


    # 8.5.2.2 Context Prompts


    Context prompts can be a word, phrase, or sentence that provides a specific context
    for the writing. For example, a context prompt for a creative writing assignment
    could be, "Write a story about a lost object." This prompt provides a specific
    context for the writing and inspires the writer to explore different ideas and
    possibilities within that.


    # 8.5.3 Boolean Questions


    Binary yes-or-no questions in prompt engineering are questions that can be answered
    with either yes or no and are used to elicit a specific response from LLM such
    as GPT-3. For example, a binary yes-or-no question could be:


    +   - Do you want to delete this file? (yes/no)

    - Is this a list of startup ideas? (yes/no)

    - Are you a human? (yes/no)


    Binary yes-or-no questions can be useful for prompt engineering because they can
    help to:


    +   - Validate the input or output of the LLM.

    - Control the flow of the logic or the task.

    - Provide feedback or guidance to the LLM.

    - Test the capabilities or limitations of the LLM.


    However, binary yes-or-no questions also have some drawbacks, such as:


    +   - They can be ambiguous or unclear in some contexts.

    - They can limit the expressiveness or creativity of the LLM.

    - They can be easily manipulated or tricked by the LLM.'
