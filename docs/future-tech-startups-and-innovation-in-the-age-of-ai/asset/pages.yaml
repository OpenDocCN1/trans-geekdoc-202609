    In this section, some of the AI techniques are discussed.


    # 7.3.4.1 Rule-Based Systems


    Rule-based systems (RBS) in AI are the basic and most straightforward AI algorithms
    used in games. They are a set of functions and rules; it RBS parameters can be
    optimized using the genetic algorithm (GA); an example improving the game platform
    using RBS with GA [17]. Also, there is a possibility of using other AI techniques,
    such as reinforcement learning, to adjust the rules.


    # 7.3.4.2 ANNs in Supervised Learning


    This algorithm tries to mimic the human behavior. It consists of neurons representing
    the input, hidden, and output layers. Neurons hold an activation function to decide
    whether to learn or not what to learn. The output layer decides what to do, such
    as accelerating or decelerating an object in a game based on pretrained data [18].


    # 7.3.4.3 Natural Language Processing


    Conversational AI and speech recognition technologies are becoming essential components
    of games due to AI''s progress in natural language processing (NLP). Voice instructions
    or deep conversations can facilitate in-game interactions between players and
    NPCs. This creates new opportunities for immersion and storytelling.


    The iStart game was developed to enhance the student''s reading comprehension
    skills; the users will be asked to explain the text. NLP analyzes the explanations
    and gives points based on evaluating the explanations. The user competes with
    NPC by providing better-quality explanations than the others. The user''s explanations
    will be ranked 0 to 3 [19].


    # 7.3.4.4 Reinforcement Learning


    Getting knowledge from trial and error is the basic idea of the learning algorithm
    in reinforcement learning: the reward balances the planning process between the
    long term and short term [20]. The agent interacts with the environment and tries
    to get as high an accumulative reward as possible [21]. Reinforcement learning
    can adjust its behavior based on real-time parameters and generate a realistic
    NPC because of its ability to interact with the environment. It can be used to
    generate content and optimize decisions. Reinforcement learning provides wide
    applications in game AI; however, the training time and explainability pose a
    challenge to this type of learning.'
