    of significance. The research instrument design involved the development of a
    questionnaire that validated measures to assess AI-based technologies, sports
    performance indicators, physical health outcomes, psychological well-being, and
    quality of life. The constructs and measurement scales used were selected based
    on established literature and previous research in the field. The reliability
    and validity of the measurement scales were assessed using appropriate statistical
    techniques. Ethical considerations were fully addressed throughout the research
    process. Informed consent was obtained from all participants, and confidentiality
    and privacy of the collected data were maintained. The study adhered to ethical
    guidelines and regulations regarding involving human subjects. The response rate
    was monitored to maximize the response rate by providing clear instructions, emphasizing
    the importance of participation, and addressing any concerns or queries from the
    participants. In the analysis phase, SEM was employed to examine the relationships
    between AI-based technologies, sports performance, physical health outcomes, psychological
    well-being, and quality of life. The hypothesized relationships and potential
    mediating and moderating factors were tested using appropriate SEM techniques.
    Mediation and moderation analyses were conducted to explore the indirect and conditional
    effects, respectively.


