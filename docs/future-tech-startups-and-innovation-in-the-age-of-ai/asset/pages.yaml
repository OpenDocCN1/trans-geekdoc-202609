  md: '# Role of AI in Agriculture Industry


    Najia Ait Hammou, Hajar Mousannif, Brahim Lakssir


    # 4.1 INTRODUCTION


    Recently, numerous large-scale internet of things (IoT) platforms have handled
    numerous sensor data streams. These IoT frameworks are employed to gather, process,
    and analyze data streams in real time, making it easier to create smart solutions
    to help decision-making [1].


    Given the soil and environmental issues that the food and agricultural sectors
    deal with, the IoT technologies can completely transform the food sector from
    farm to fork, improving food safety, cutting down on food waste, and cutting down
    on agricultural inputs such as weeding [2].


    Weed control is required since it is the most significant issue that affects all
    farmers. Insufficient weed control will significantly reduce yield as weeds compete
    crop plants for nutrients, and sunlight. Row crops typically use a mix of preemergence
    herbicide application, emergence tillage, mechanical harrowing, and postemergence
    herbicide application to control weeds [3].


    Chemical weeding has a negative effect on the environment and is harmful to the
    health of crops. Even if mechanical weeding is just as time consuming as manual
    weeding, we must switch to it in the right way. As previously, agriculture faces
    several difficulties. The use of artificial intelligence (AI) techniques in agriculture
    can therefore be advantageous, given that they have become a fundamental tool
    for solving many issues relating to agriculture thanks to their learning capabilities.
    If we can automate this operation, sophisticated robotic systems can be created
    to help agricultural professionals throughout the world identify better answers
    [4].


    On the one hand, robotics has produced mechanical weeding robots that can perform
    this operation as well as manual weeding in order to reduce the farmer''s load.
    On the other hand, weeding robots are a crucial component of contemporary and
    sustainable agriculture because of their clear benefits in reducing the need for
    human and chemicals [5].


    IoT solutions today may assist with the conception, development, deployment, and
    operation of intelligent apps that offer real-time insights into activity and
    the environment'
