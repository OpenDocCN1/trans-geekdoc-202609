    # 5.2.1 Challenges of Practical Application of AI-Based Techniques in Agriculture


    According to projections of robot shifts from 2011 to 2013, an average 9% increase
    each year in the United States, a 12% increase in Asia-Australia countries, and
    an 8% increase in Europe are anticipated. According to this trend, the penetration
    rate of robots is expected to be 15% by 2030 and 75% by 2045. However, the distribution
    of mechanization may be uneven, with some areas lacking access to resources and
    experiencing situations that cannot be changed by scientific discoveries and technological
    development. For instance, most AI systems are internet based, their use may be
    limited in rural or remote areas due to a lack of web service and familiarity
    with handling AI operations. As a result, a slower and uneven distributed adoption
    of AI in agriculture should be expected, and whether the adoption will increase
    food production beyond remains uncertain (Martos et al., 2021).


