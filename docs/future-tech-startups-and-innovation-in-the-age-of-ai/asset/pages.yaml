    # 10.2.1 Overview of Schumpeter Innovation


    10.2.1.1 Schumpeter Innovation

    The idea of Schumpeterian innovation, which highlights the role of entrepreneurs
    in promoting economic progress through the introduction of inventions, was first
    proposed by renowned economist Joseph Schumpeter. Schumpeter’s theory of technological
    change in a free market carries innovation, invention, and diffusion. He explained
    that innovators who start, develop, and implement new ideas typically make money,
    and he is frequently acknowledged for originating the current growth theory, which
    is predicted on the unavoidable outcome of innovation and development [4]. According
    to Schumpeter, innovation in the business world is the main cause of rising rents
    and company volatility [5]. Innovation includes developing new products, altering
    industrial structures, expanding into untapped markets, and changing production
    and transportation techniques [6].


    Based on Schumpeter’s theory, an entrepreneur’s primary contribution to the economy
    is the introduction of innovations, resulting in the generation of profits. It
    states that the only path to financial stability inside an organization is through
    successful creativity and entrepreneur entrepreneur plays a critical role in fiscal
    development.


    # 10.2.1.2 Open Innovation


    The idea of “open innovation” encourages a collaborative approach to invention,
    emphasizing the value of drawing on outside sources of information and experience.
    It is similar to the conventional closed innovation approach, which uses internal
    resources to'
