    # 5.2.3 Security and Privacy


    Many physical devices, such as the internet of things (IoT), are initially vulnerable
    to hardware attacks because they can be left unattended for long periods. Data
    encryption, tag frequency modification, data destruction policy, use of blocker
    tags, and other security countermeasures are common. Location-based services are
    also vulnerable to device attacks, which mean that once the device is captured,
    the attacker can extract cryptographic implementations and then have unrestricted
    access to data stored on the device (Dengel, 2013). Data can also be compromised
    while being transferred from the device to the gateway, where they are uploaded
    to other infrastructures such as the cloud (Lee et al., 2020). Cloud servers are
    vulnerable to data tampering, which can disrupt the farm''s automated operations.
    Session hijacking, login abuse, and denial of service (DoS) can also disrupt cloud
    infrastructures. Cryptographic algorithms, data control policies, identity authentication
    mechanisms, and so on are examples of corresponding security policies. As a result,
    security issues are causing serious problems and should be addressed at various
    levels (Javaid et al., 2022).


