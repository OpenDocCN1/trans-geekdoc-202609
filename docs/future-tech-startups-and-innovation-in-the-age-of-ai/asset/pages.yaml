    # 6.9 RESEARCH METHODOLOGY


    The research methodology employed in this study followed a quantitative research
    design and approach. Both secondary and primary data sources were utilized to
    gather information. Primary data was collected through questionnaires and assessments
    administered to a diverse sample of individuals with disabilities participating
    in sports activities. The target population consisted of individuals with disabilities
    who engage in sports, and a suitable sampling frame was developed based on sports
    clubs, disability organizations, and relevant communities. The sampling technique
    employed purposive sampling, ensuring representation across different age groups,
    genders, and types of disabilities. Sample size determination was based on achieving
    an adequate representation of the target population and ensuring statistical power
    for the analysis. The sample size 210 was determined through a power analysis
    considering the anticipated effect size and desired level'
