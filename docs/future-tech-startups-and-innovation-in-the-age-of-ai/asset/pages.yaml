    # 7.3 GAME AI


    # 7.3.1 The Motivation


    This exciting field, as complex as it is, requires high skills. Many games are
    NP-hard problems.


    In the past, AI research has used games like Checkers and Chess as Game AI benchmarks.
    As AI has improved, more complex games like Super Mario Bros., StarCraft, and
    Lemmings gained popularity as new benchmarks. The game Go has also served as an
    important benchmark, particularly in line of AlphaGo’s victory over professional
    players. StarCraft’s real-time strategy and ample space state make it one of the
    most challenging games for AI, with vastly more conceivable strategies than those
    in the world [9].


    Games are popular and enhance HCIs. The AI adds commercial benefits to the production
    of games. In addition to providing an adaptive play based on the players’ history
    and strategies, AI provides better content and tactics for the players. Billions
    of dollars have been invested in the game AI market [11].


    # 7.3.2 AI Applications in the Gaming Industry


    # 7.3.2.1 Play a Game


    AI does not always play to win; it can imitate attractive, predictable, or human-like
    play strategies. It is important to keep in mind winning first may conflict with
    these other approaches because, as some cases have shown, many of the best AI
    bots tend use inhuman, dull, or unpredictable tactics. Evolutionary algorithms
    are applied to the AI algorithms to optimize the game.


    AI can play board games, cards, Classic Arcade, and many other games. In the third-person
    Turing test, the approach showed more than 0.6 human similarity, indicating great
    promise. The evaluation was conducted using the 2D fighting game Street Fighter
    IV.


    # 7.3.2.2 Generate Content


    Procedural content generation (PCG) uses algorithms to generate game content with
    human intervention.


    Generating the game content is to create the games’ items, maps, characters, stories,
    levels, visuals, music, rules, etc. This makes this process faster and more diverse.


    PCG methods can be divided into two categories: multilevel and multicont PCG,
    which needs a set of rules and a game engine to generate specific content for
    a game. PCG-based game design generates a noncore part of the game. And generating
    PCG for developing'
