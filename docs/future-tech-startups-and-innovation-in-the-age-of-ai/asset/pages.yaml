    and the AI techniques. Section 4 provides the challenges and limitations of Game
    AI, while Section 5 presents a case study. The last section completes the chapter.


    # 7.2 BACKGROUND OF GAME AI


    AI is the algorithms that makes mimic human interactions, making decisions, acting,
    and thinking.


    In 1950, the concept of AI was first introduced, exploring ways to incorporate
    computers into gaming, this idea was proposed by Shannon, who presented how computers
    can decide the next move in the chess game. His idea was based on minimax algorithms.
    The XO game, often known as tic toe, was developed in 1952 by British computer
    science professor Alexander Douglas as his doctoral work on HCI at the University
    of Cambridge. In the single-player game XO, a player competes with the computer.
    The widely accepted belief is that the game “Spacewar”, created in 1962 at MIT,
    was the first computer with higher complexity [7]. For many, the first AI gaming
    was in 1979 with the Pac-Man game. The adversaries in this game looked like plotting
    against you, making the game harder. In 1987, the Golden Age game was produced
    with a slight enhancement to the Pac-Man game. Then, in the mid-1990s, more games
    were created and developed, like sports and driving games [8]. As AI enriches
    the knowledge of the designers, less and more focused work will be'
