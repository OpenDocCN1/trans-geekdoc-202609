    utilizing computer vision, robotics, and ML, farmers can gather data to manage
    weeds. The AI allows farmers to spray chemicals only where weeds are present.
    This significantly decreased the need to spray chemicals throughout a whole field.
    AI uses fewer herbicides in the field than would otherwise be sprayed with weedicides
    and pesticides [24]. AI aids in assessing the field-specific requirements for
    health problems and pest infestations are identified using AI software. It also
    improves fertility management and lowers excessive pesticide and herbicide usage,
    depending on the specific field. One of the worst enemies farmers face is pests.
    They have the power to completely wipe out a field of crops. AI, however, aids
    in assessing the field-specific requirements for weedicides and pesticides. Plant
    health problems and pest infestations are identified by AI software. It also improves
    fertility management and lowers excessive pesticide and herbicide depending on
    the specific field. Farmers are using AI-powered drones to battle and pests. The
    robot is propelled by computer vision, which is widely used in this kind of monitoring
    camera. The AI engine is able to recognize each possible hazard and tag it appropriately
    [23, 25, 26].


    # 4.3.8 AI in Yield Prediction


    Cognitive solutions give farmers advice on the best hybrid crops and seeds based
    on numerous factors, such as soil condition, weather forecast, seed, and infestation
    in a specific area. The proposal can be further altered in accordance with the
    needs of the business. For farmers to make judgments, you can also take into account
    outside elements like market developments, prices, or consumer demand. Real-time
    estimates can be created during cultivation phase by creating an area map and
    identifying the areas where plants need water, fertilizer, or pesticides using
    high-definition images from airborne systems (drones or copters) [4]. To forecast
    crop yields, AI models can examine past data, weather trends, and other pertinent
    variables. Farmers are better to plan their planting, harvesting, and market needs
    thanks to this information, which increases productivity and profitability [25].


