    # 2.7 EMERGING TECHNOLOGIES SHAPING THE FUTURE OF INDUSTRIAL ROBOTS


    For more than 30 years, industrial robots have been a well-established fixture
    in the manufacturing industry, serving a variety of purposes including welding,
    component ordering, casting, painting, and stacking. The fundamental benefit of
    an industrial robot, as demonstrated by the following case, is its ability to
    execute tasks reliably and consistently in settings and on scales that are challenging
    for humans. Commercially available robot systems have acceptable levels of dexterity,
    speed, accuracy and repeatability; more emphasis has been placed on interaction
    between humans and robots, streamlining and lessening collisions that may injure
    humans. Pick and place [44] are two examples of completely new applications possible
    advances by ML, and computer vision in particular. Crucially, these methods are
    being used to facilitate a higher level of adaptive automation. There are additional
    input modalities, in addition to the previously covered screen-based teleoperation
    interfaces, may easier or more natural interaction with nearby or far-off robots.
    Although speech has been studied for service robots [46], its efficacy is still
    up for debate [47]. The unique benefits of each composite modality can be leveraged
    through the use of multimodal interfaces [48, 49].


    # 2.7.1 Cloud Robotics and Telobotics


    Robotics is a crucial field that helps automate repetitive daily tasks. As a result,
    industries have seen a sharp increase in the development of robots, which has
    led to the creation of real-time robots that are more capable and perform at higher
    levels of precision and resilience. The group of robots that use the robot-framed
    network where each robot is located is known as a node or data point, and these
    groups of robots are connected by wired or wireless communication. However, to
    lessen the severity in the processing and storing of the data, the robots'' memory
    is very low and insufficient for processing and storing. Robots and other devices
    can access on-demand services to the integration of robotics and cloud computing
    [50, 51]. Cloud robotics is made possible by the abundance of resources available
    by cloud networking, other technologies, and wireless communication protocols.
    Applications such as SLAM, “are utilized in the bottleneck caused by the limited
    onboard computing and storage equipment,” and navigation are the main uses for
    cloud-based robotics. Today, telobotics [52] based cloud computing is used in
    a variety of applications, including home automation, healthcare, and military
    use. The artificial integration with cloud-based robotics [53] would improve the
    automation in terms of processing speed [54], access control, and delay. This
    would further improve the system''s performance. A branch of robotics known as
    telobotics deals with manipulating and controlling robots from a distance. In
    contrast to traditional robotics,'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'which uses preprogrammed robots for specific tasks or autonomous operation,
    telerobotics enables human intervention and control over a robot’s actions in
    real time. This is made possible by the application of communication technologies,
    which provide a telepresence experience by allowing a human operator to give commands
    to the robot and receive feedback. Important elements of teleotics consist of
    teleoperation. In order to control the movements of the remote robot, human operators
    employ a variety of input devices, including joysticks, haptic interfaces, and
    other control mechanisms. The robot receives real-time instructions from the operator.
    Telerobotics depends on communication systems, which frequently use technologies
    like satellite links and the internet [55].


    # 2.8 CHALLENGES AND OPPORTUNITIES FOR AI STARTUPS IN ROBOTICS


    The most recent stage of the ongoing “digital revolution” is defined by innovations
    in computer science, robotics, and AI that reinforce each other. These fields’
    technological advancements have given to complicated problems that need to be
    dealt by lawmakers and regulators. Similar to how, in earlier decades, the availability
    of vast amounts of data and low-cost computing led to ethical and legal issues,
    we are currently facing an additional upheaval in waves. In this situation, the
    interactions and synergies between the domains of computer science, robotics,
    and AI are especially beneficial in order to highlight the significance of the
    ethical, legal, and business challenges that are presently appearing [56]. Robots
    are reprogramming machines that can operate autonomously or semi-autonomously
    to carry out manufacturing tasks. Based on the work of George Devol and Joseph
    Engelberger, the first industrial robot was built in the automotive industry in
    1961. The UNIMATE robot was created to perform spot welding and die-casting extraction
    in a General Motors facility in New Jersey [57]. Since the inception of AI, there
    has been a focus on developing and configuring devices that mimic, among other
    things, mental processes recognized as indicative of intelligence by humans. Traditionally,
    learning, planning, and problem solving can be traced back to the Dartmouth workshop
    in 1956, where Allen Newell, Herbert Simon, and J. C. Shaw’s initial AI program,
    the Logic Theorist, was demonstrated. The standards set by this type of leader
    as the field’s founding fathers were elevated. The goal was to build machines
    that perform every task that individuals can complete and identify a solution
    for the issue of obtaining appropriate AI, either in the “current generation”
    or in “25 years” [58, 59].


    # 2.9 CONCLUSION


    The combination of robotics and AI has enormous potential to change numerous industries
    and enhance people’s lives. AI-enabled robots can carry out hazardous, repetitive,
    or precision-based jobs in a variety of industries, including manufacturing and
    healthcare. This makes it possible to shift human workers to more imaginative
    and fulfilling tasks. AI robots may replace some workers, but they will also probably
    create new opportunities in the areas of technology development, upkeep, and supervision.
    Robots will not be able to fully replace human skills like empathy, creativity,
    and sophisticated problem-solving in'
