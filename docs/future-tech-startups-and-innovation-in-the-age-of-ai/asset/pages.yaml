    # 6.1 INTRODUCTION


    Artificial intelligence (AI) has emerged as a transformative technology with potential
    applications across various domains, including sports and health sciences (Smith
    et al., 2021c). In recent years, researchers have begun exploring exploring the
    role of AI in enhancing sports performance and improving health outcomes, particularly
