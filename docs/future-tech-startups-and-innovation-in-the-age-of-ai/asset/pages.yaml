    tasks that NLP does is tokenization. The main purpose of this task is to convert
    the user-input text to tokens, where each word act as an individual token. These
    tokens then play a role in analyses or tasks such as parsing. The next step after
    tokenization is lemmatization and stemming, which helps to simplify the text processing.
    Stemming is a method that focuses on eliminating prefixes or suffixes in token
    and reduces words to their most basic form [39].


    # 1.4.2 AI in Neuralink Chip


    In 2016, Elon Musk founded a startup with the name of Neuralink, and it remained
    unknown until 2017. As the name implies, the startup is developing technology
    that connects neurons in our brain to computers or smartphones. This allows a
    direct connection between our brains and external devices. This technology helps
    in treating neurological conditions and potentially improving cognitive capacities
    in humans. The main purpose of this company is to understand and train brain disorders
    while preserving and enhancing human brains [40]. Neuralink''s method of innovation
    technology utilizes ultrafine polymers that are used for its invasive neural interface.
    These neural probes were developed using biocompatible very-thin film materials.
    These films form an array of 96 threads, and each independent thread has 32 electrodes,
    3,072 electrodes are in contact altogether. To improve the functionality of the
    probes, surface modification is used. Through these, the capacity of charge carrying
    is increased and decreases the impedance for electrophysiology [41]. Two common
    techniques are discussed in the brain-machine interface (BMI). The first one is
    called noninvasive, which millions of neurons'' activities are recorded via the
    skull. However, the signals obtained through this method are distorted and are
    not specific. The second method is invasive, which is the more widely used approach
    in BMI. This technique produces an extremely accurate reading of neural representation
    by capturing the activity of single potential neurons from distributed, functionally
    linked groups. When positioned on the cortex''s surface, invasive electrodes can
    record important signals that can be seen in Figure 1.1. However, this method
    has several drawbacks. Though it is precise, it entails thousands of neurons''
    activity and is able to record signals from deep within the brain. Therefore,
    there is a trade-off between the depth at which signals can be recorded and precision
    [42]. Figure 1.1 shows how Neuralink brain chip allows connection of our brain
    neurons to external devices and several other devices.


