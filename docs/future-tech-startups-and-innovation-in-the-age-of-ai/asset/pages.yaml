    proper treatment to each plant based on historical data [23]. AI produces more
    efficient and quicker-moving robots that do most tasks in agricultural fields,
    such as controlling weeds and harvesting plants. Using computer vision enables
    the monitoring and spraying of weeds. Additionally, these robots are effective
    in overcoming difficult conditions by using techniques to safeguard their crops
    [4,24]. AI and robotics are closely related. Many applications are making their
    way into agriculture, such as picking up produce faster than people and handling
    a larger volume. The cameras give the AI the ability to spot any potential weeds,
    spray them with herbicides, or feed some plants fertilizer. Due to their ability
    to manage or perform various jobs without human vision, self-driving tractors
    will go to the optimal pace, avoid obstructions, and autonomously locate their
    plowing spot [25].


