    # 6.11 DISCUSSION


    H1: The utilization of AI-based technologies in sports training has a significant
    positive impact on sports performance in individuals with disabilities. The path
    coefficient of 0.50 indicates a moderate effect, and the t-value of 2.20 is significant
    (p < 0.05), providing support for this hypothesis. The results of this study are
    consistent with previous research in the field. Several studies have demonstrated
    the positive impact of AI-based technologies on sports performance in individuals
    with disabilities (H1). For example, Smith et al. (2018) found that the use of
    AI-driven motion tracking systems improved athletic abilities and outcomes in
    adaptive sports.


    H2a: Sports performance does not mediate the relationship between AI-based technologies
    and physical health outcomes in individuals with disabilities. The path coefficient
    of 0.32 is relatively small, and the t-value of 1.60 is not significant (p > 0.05),
    showing that sports performance does not play a mediating role in this relationship.
    H2b: Sports performance mediates the relationship between AI-based technologies
    and psychological well-being in individuals with disabilities. The path coefficient
    of 0.45 indicates a moderate effect, and the t-value of 2.10 is significant (p
    < 0.05), supporting this hypothesis. Regarding the mediating role of sports performance,
    our findings align with previous research indicating that sports performance mediates
    the relationship between AI-based technologies and psychological well-being (H2b).
    This supports the findings of Johnson et al. (2019a),'
