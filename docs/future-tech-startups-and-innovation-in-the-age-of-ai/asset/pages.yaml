    # 1.8 AI IN BLOCKCHAIN TECHNOLOGY


    Blockchain is a data collection protocol that makes hacking and scamming the system
    impossible. Also known as distributed ledger technology (DLT), blockchain establishes
    the historical backdrop of a relatively advanced resource that is unchangeable
    and simple to use throughout decentralization [58]. AI and blockchain have enormous
    potential for resolving issues in a number of industries, also banking, social
    services, cryptocurrency, and the internet of things (IoT). This integration is
    impacting the architecture of smart cities for creating sustainable ecosystem.
    Therefore, we discuss solutions related to blockchain security concerns and list
    the key ideas that must be applied in order to create a variety of blockchain
    and AI-based smart transportation methods [59].


    Artificial intelligence is essential for managing the vast amount of data produced
    by IoT. IoT takes the form of learning algorithms and advanced analytics. IoT
    holds immense potentially by connecting smart sensors, devices, and radiofrequency
    identification (RFID). This helps to build intelligent systems that can improve
    productivity and offer insightful information in a variety of fields. Blockchain
    technology is a secure connection between nodes or partitions. When it comes to
    IoT applications, distributed systems built using blockchain are incorporated.
    Information is stored in blocks; each contains authorized transactions and the
    attributes that go along with them [60]. Blockchain technology can automate payments
    in the era of digital currency, ensuring a secure and decentralized exchange of
    personal data, information, and logs. AI and blockchain are the most discussed
    topics today. Blockchain technology has the capacity to streamline bitcoin payment
    automatically. AI provides robots with human-intelligence, influencing the ability
    to reason and make decisions. This has prompted a careful analysis of the blockchain
    and AI combination [61]. There are difficulties when integrating technologies
    such as AI and IOT into single system. The main issues affecting their functioning
    are security,'
