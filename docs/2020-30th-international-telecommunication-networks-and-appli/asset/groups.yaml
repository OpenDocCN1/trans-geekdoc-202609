  mdcn: "\n\n# 2020 第 30 届国际电信网络与应用会议 (ITNAC)\n\n基于韧性的方法，GI 涉及网络规模和拓扑，以及感染过程参数。另一方面，基于区块链的\
    \ FRI 解决方案依赖于连通性的存在。\n\n通信复杂度-GI，每个节点都有固定数量的邻居，因此其复杂度为 O(N)，其中 N 是节点集。在区块链中，每个节点都必须与其他节点通信，因此通信复杂度为\
    \ O(N²)。\n\n可扩展性（总内容的即时处理能力）——区块链让每个节点顺序处理每项内容，因此系统速度等同于单节点网络。然而，增加节点会提高总处理能力，因此为\
    \ O(1)。\n\n容错性-GI 的形式本身甚至不具备容错性，更不用拜占庭区块链了。其容错能力最高支持拜占庭节点。\n\n因此，区块链在韧性、确定性和容错性方面优于\
    \ GI，在通信复杂度和可扩展性方面持平。此外，它还需要从 SDN（软件定义网络）和关键基础设施（PKI）中部署区块链网络。\n\n所提出的解决方案使用了\
    \ Stellar 以及拜占庭协议共识协议特性，在结果、韧性和容错性属性方面与 GI 协议相比良好，但在通信复杂性和可扩展性方面仍显逊色。因此，我们验证了基于区块链的证明（Proof-of）身份验证方案，区块链可以保护网络规模，使其成为虚假数据\
    \ CPA 的可行解决方案。\n\n# 表 I GI 与基于区块链的解决方案对比\n\n| 属性 | GI | 区块链 |\n|---|---|---|\n\
    | 结果 | 非确定 | 确定性 |\n| 韧性 | 取决于 {Nt} 连通性、感染过程参数 | 需要外部交互 |\n| 通信复杂度 | O(N) | O(N²)\
    \ |\n| 可扩展性 | O(N) | O(1) |\n| 容错性 | 高至拜占庭节点 | |\n| 所需基础设施 | NDK。 | NDK 和区块链网络\
    \ |\n\n# VI 结论\n\n假设一个类似于 [7] 的基础威胁模型，我们开发了 NDK（命名数据网络）中虚假数据 CPA 问题的替代方案；即引入对被盗取内容访问权限有限的未授权发布者。我们基于区块链的方法源于一种认识：内容认证在\
    \ NDK 中可以被视为存在合适算法和基础设施的共共识。发布者面临的时间限制引起了注意\n\n- [1] G. Xylomakis, C. N. Veridis,\
