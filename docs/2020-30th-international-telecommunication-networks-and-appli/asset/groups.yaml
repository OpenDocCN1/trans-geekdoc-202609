    # NDN区块链中伪造数据内容投毒攻击的缓解


    Stanisław Baranski

    电子、电信与信息学学院

    格但斯理工大学

    波兰，格但斯

    stanislaw.baranski@pg.edu.pl


    Jerzy Konorski

    电子、电信与信息学学院

    格但斯理工大学

    波兰，格但斯

    jekoni@eti.pg.edu


    摘要—信息内容网络面临内容投毒攻击（CPA）的困扰，当入侵者上传带有签名凭据的内容时，其更强的形式被称为“伪造数据 CPA”。遵循一种利用内容实施时受限时间的现有感染方法，我们设计了一种基于区块链的“时间证明”（Proof-of-Time）机制来区分入侵者和合法发布者，并认为区块链解决方案能更好地实现该机制。所提出的方案利用区块链提供了足够的安全性和细节，可以作为感染方法的有价值替代方案，且在顺序确定、韧性和容错性方面优于后者。


    **关键词—** 数据网络、内容投毒、区块链。


    # I. 引言


    信息内容网络 [1] 标志着从以内容为导向的范式转变。由于许多理想特性，如内容缓存、移动性支持和安全性，这些特性由 ICN 传输层或用于缓存主机导向应用程序的更有效网络来保证。一种名为命名数据网络（NDN）的
    ICN 实现将作为本文后续部分的概念框架。NDN 允许通过交换数据和数据包向订阅者路由和转发内容，并管理对感兴趣的订阅者的访问。内容（Web 对象、文档、图像文件或数据流）通过其位置名称命名数据对象（NDO）被请求。每个内容都应由创建它的发布者进行验证。


    当考虑到安全问题时，内容缓存的优势变成了一双刃剑。获取了发布者密钥的入侵者可以创建带有有效签名的投毒内容。此类内容在 ICN 节点中很容易被检测。NDN 以及其他
    ICN 方法中的内容投毒攻击（CPA）可以是损坏数据或伪造数据 [3]。在这两类中，内容被非法修改。在损坏数据 CPA [4], [6] 中，攻击者（入侵者发布者）不拥有合法发布者的签名密钥；因此内容无法通过签名验证。然而，验证是可选的，并且由于某些原因，可能并非每次都执行。其之一是经济因素：签名验证需要相应的公钥，而并不是每个节点都能维护/访问所有可能的密钥。


    伪造数据 CPA [6], [7] 是最危险的情况，因为拥有合法发布者密钥的入侵者发布者无法与合法发布者区分——他们可以伪造在订阅者端能够通过成功验证的内容。一旦一个响应包在
    NDN 的多个内容存储（Content Stores）中传播，请求该内容的订阅者都会接收并验证投毒内容。投毒内容无法被轻易删除，因为大多数 ICN 节点不支持除原生（例如使用缓存）机制之外的删除/撤销缓存内容。这种方法允许我们通过共享可疑
    NDO 的信息并将其从内容存储中过滤掉来防止伪造内容——这在感兴趣的发布者固定并处理之前很难实现。该问题仍未解决，仅存在早期解决方案。


    我们考虑一种涉及攻击者的场景，即通过合法发布者（凭据所有者）的过期或密钥撤销获得未经授权的凭据访问。因此，入侵者的发布者账户被限制在一个有限的时间窗口内，而合法发布者的访问不受影响。[7]
    我们利用受限和不受限的时间访问序列之间的差异，要求每个发布者在某些时间段内访问凭据。我们将这种认证方法称为“时间证明”。我们通过以下方面扩展了传统的认证模型：


    访问凭据 ⇒ 时间证明 ⇒ 真实性


    *由波兰国家科学中心资助，拨款号 N-2016/2/B3*


    访问凭据可以通过创建一个需要使用凭据的证书或签名来证明。时间证明可以通过随时间重复此过程来证明。通过共识来确保每个对象都具有足够强大的发布者凭据。然而，没有采用公钥加密，因此对等身份管理是极少数的，且该方法可以迁移到其他解决方案。


    NDO 有其信誉（Credibility）——发布者活跃时间越长，信誉越高。理想情况下，另一个发布者应该让网络相信其正确性和可信度。时间证明的实现是要求此类节点在全网数据传输协议中不与网络断开。我们假设网络本身通过公开其信誉分，不包含入侵者发布者。


    在本文中，我们提出了一种替代的感染模型，证明我们的方法是有前景且值得研究的。我们的贡献包括：


    - 制定一个用于缓解 CPA 的区块链框架；

    - 设计一种基于区块链的新型防御机制；

    - 在可扩展性、容错性和韧性方面，定性地评估所提出的机制。


    在第 II 节中，我们回顾了相关工作。在第 III 节中，我们概述了框架和区块链的概念。在第 IV 节中，我们详细说明了基于联邦协议（Federated Agreement）的区块链解决方案。最后，在第
    V 节介绍了基于图方法的对比，并总结全文。


    # II. 相关工作


    CPA 已成为过去几年的活跃研究领域；详细说明请参见 [3]; [6] 以及 NDN 的综述。在 CPA 中，基于共识验证、转发和阻塞的攻击占据主导地位 [8],
    [9]。基于引用的 CPA 文档环境包括 Bitcoin 和 Whisper。该系统是一种具有成员制的内容导向服务，其中编辑器交换待发布文章的更改直到达成共识为止有效。投票可能会削弱
    CPA，但会产生遭受女巫攻击（Sybil attacks）的漏洞。该机制无法良好扩展到全网。在 LOCKSS（一种 PDF 数字保护系统 [10]）中，邀请参与者紧密合作以投票剔除错误的共识。循环投票可能会触发一系列内容修复……


    # III. 共识与区块链


    我们提出了一种基于利用现有共识算法的解决方案。假设对拜斯庭型区块链具有容错性 [11], [12]，对于一个由多个操作员管理的全网机制，可以预见所有节点都会可靠且诚实地运行。因此，可以放宽信任网络叠加关联，允许成员节点随时加入或离开网络。用于保护拜斯庭型区块链的共识协议用于开放成员制的区块链系统。数据存储在区块链系统中，只要入侵者不控制大多数共识手段，就能防止入侵者。示例包括
    Bitcoin [14]、Ethereum 和 Stellar [16]。我们使用了 Stellar，我们的联邦协议（FBA），它与描述的共识机制相似。在第
    IV 节中，我们还使用了一种略微修改的简单交易协议，以防止重放。


    # IV. 提出的解决方案


    我们提出了一种解决方案，其中所有或部分 ICN 节点参与区块链共识协议，与内容存储一起保护一个时间证明增益的公共数据库。事件一致性得到了保证，即每个节点都拥有其他节点具有相同版本的数据库。观察结果是，通过使用区块链系统，我们确保发布者只能发布时间证明。为了进行认证，如果是合法发布者，他们必须在足够的时间内访问相应的凭据，这对于入侵者发布者来说负担不起的，但对于合法发布者是可以的。想要确认内容权限的发布者必须不断提交一个微调


