    Abstract—Information-content networks struggle with content poisoning attacks
    (CPAs), whose stronger form called Fake Data CPA, when an intruder uploads content
    with signed credentials. Following an existing infection approach leveraging the
    constrained time when content can implement it, we design a blockchain-based mechanism
    for Proof-of-Time to distinguish between intruder and legitimate publishers, and
    argue that blockchain solutions implement it. The proposed scheme, using blockchain,
    provides enough security and detail to be a valuable alternative to the infection
    approach, superior with respect to order determination, resiliency, and fault
    tolerance.


    **Keywords—** Data Networking, content poisoning, blockchain.


    # I. INTRODUCTION


    Information-content networks [1] mark a paradigm shift from content-oriented networking.
    With many desirable features, such as content caching, mobility support, and security
    they are guaranteed by the ICN transport layer or more effective network used
    to cache the host-oriented application. An I implementation called Named Data
    Networking (NDN) will serve as a conceptual framework throughout the rest of this
    paper. NDN permits routing and forwarding of content to subscribers by exchanging
    Data and packets, as well as managing access to interested subscribers. A piece
    of content (a Web object, document, image file or a data stream) is requested
    by its location name Named Data Object (NDO). Each should be authenticated by
    the publisher who created it.


    The benefit of content caching becomes a double-edged sword when security concerns
    are taken into account. An intruder who gets to the publisher''s key can create
    poisoned content with valid signatures. Such content can be easily detected in
    ICN nodes. The Content Poisoning Attacks (CPAs) in NDN, as well as in other ICN
    approaches,


    can be Corrupted or Fake Data [3]. In both classes, content is illegally modified.
    In the Corrupted Data CPA [4], [6], an attacker (intruder publisher) does not
    possess the signature key of a legitimate publisher; thus, the content will not
    pass a signature verification. However, verification is optional and there are
    reasons why it may not be performed at every. The first one is economic: signature
    verification requires a corresponding public key, and not every node can be maintained/access
    to all possible keys.


    Fake Data CPA [6], [7] is the most dangerous case, since an intruder publisher
    who has the legitimate publisher''s key, however, is indistinguishable from the
    legitimate publisher—can forge content with successful verification to a subscriber-end.
    Once a bounce gets propagated across multiple Content Stores at NDN, each subscriber
    who requests from that receives and verifies the poisoned content. The poisoned
    content cannot be easily removed as most ICN nodes support not removing/revoking
    of cache content other than native (e.g., using cache) mechanisms. This approach
    allows us to prevent fake content by sharing information on suspicious NDOS and
    filtering them out of the Content Stores—would be hard to perform before in time,
    before the content is fixed and processed by the interested publisher. The problem
    is still unsolved, only early solutions exist.


    We consider a scenario where an attacker is involved, i.e., unauthorized access
    to credentials, either through expiration or key revocation by the legitimate
    publisher (credentials owner). Thus his/her a publisher''s account is restricted
    to a finite window, in contrast with the legitimate publisher access is unaltered.
    [7] we leverage the difference between the restricted and unrestricted time access
    sequences to require each publisher to access to credentials over some time period.
    We refer to this method of authentication as Proof-of-Time. We extend the traditional
    authentication model by the following aspect:


    access to credentials \ Proof of Time ⇒ authenticity


