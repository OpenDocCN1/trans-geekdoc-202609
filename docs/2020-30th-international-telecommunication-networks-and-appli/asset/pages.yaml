    # IV. PROPOSED SOLUTION


    We propose a solution in which all or part of the ICN nodes participate in a blockchain
    consensus protocol, securing a common database of Proof-of-Time gains along with
    the Content Store. Event consistency is ensured, i.e., each node has that the
