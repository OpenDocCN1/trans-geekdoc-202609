    V. COMPARISON


    Being as an asynchronous distributed system, consensus protocols face the IPL
    trilemma [18], where only two of three properties: Fault Tolerance, Liveness,
    and Safety can be satisfied. The mostly choice is between Liveness and Safety.
    Stellar guarantees consistency across all nodes in the network, whereas Liveness
    guarantees eventual consistency and admission of new transactions. Blockchain
    protocols


    +   - Outcome Determination is non-deterministic in terms of a consensus decision:
    even one sequence of interactions can result in an outcome, which is an unwanted
    property. In contrast, Blockchain is a deterministic: with a high number of Proof-of-Time
    clauses it ensures that his/her content will be authenticated, as guaranteed by
    the Safety property of FBA.'
