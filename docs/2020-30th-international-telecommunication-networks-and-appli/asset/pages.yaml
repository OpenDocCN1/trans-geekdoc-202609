    # A. Blockchain Layer


    A network can play two roles: of an ICN node participating in routing and caching,
    and of a blockchain node participating in the consensus protocol and blockchain
    storage (cf. Fig. 2). Nodes connected to subscribers do not participate in the
    blockchain, since they do not content trustworthiness. The blockchain layer could
    also be managed by other than nodes, separating the (content distribution) layer
    from the trust layer, cf. Fig. 3. ICN nodes can be relieved from the network overhead
    to avoid unnecessary complexity. Also, a separate system is more for ICN solutions,
    and legacy systems, the developed trust does not depend on the ICN architecture
    but with the content hash and publisher credentials. The blockchain trust could
    be hosted by more powerful devices and possibly different organizations—achieving
    separation of concerns, which is difficult in the long term. For the rest of the
    paper we assume the separation of the ICN and blockchain node should play one
    or both roles depending on the implementation.


    ![](img/6e72a9e9092760aad8ec93355f31805a_2_2.png)


    Fig. 3. Separated trust and ICN transport layers


    # C. Publisher Workflow


    To publish the content on the ICN network and authenticate it via the blockchain,
    a publisher executes the following:

    1. Create a hash of the NDO.

    2. Compute it using the publisher''s key pair.

    3. Create a Proof-of-Time transaction, which includes the hashes of the NDO and
    of the previous blockchain block, and the signature to prove the private key.

    4. Publish the Proof-of-Time to the blockchain.

    5. Repeat steps 3 and 4 until the required Credibility Score is reached.


