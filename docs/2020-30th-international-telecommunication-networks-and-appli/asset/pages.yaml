    typically chose Liveness, i.e., tolerance of temporary node partitioning. When
    a conflict occurs, the ledger splits into two different versions until the conflict
    is resolved, in which it may contain new transactions. On the other hand, Stellar
    Consensus Protocol (SCP) is backed by a quorum, which has been approved by a network
    quorum, it cannot be changed. SCP is based on Practical Byzantine fault tolerance
    [19] and extends its functionality by allowing open membership. In SCP, each node
    picks itself and a set of trusted nodes to form a quorum, differently for each
    node. A quorum is defined by allowing trust across all quorums. A quorum-intersection
    assumption is made where any two quorums have a nonempty intersection.

    In FBA-systems, the majority of nodes determines the consensus on some proposal.
    The proposal is accepted by the majority, others are rejected or to fail, a final
    decision is reached. In an open system where nodes can just leave, it is hard
    to maintain a majority might shifter. To solve this, FBA introduces a process
    that starts locally and reaches the whole network. The local quorums must overlap
    with at least one common node to convey the voting elections across different
    quorums.


