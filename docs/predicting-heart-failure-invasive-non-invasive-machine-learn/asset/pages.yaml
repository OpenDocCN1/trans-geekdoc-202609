  md: 'Computational techniques combined with AI can transform the understanding of
    vital information from available medical data. These techniques interpret the
    data in the form of structured, optimized, and meaningful information, which is
    readily available for the physicians for timely and accurate diagnosis.


    Rapidly evolving technologies based on AI are non-invasively illuminating the
    fundamental processes contributing to CVDs. New insights into CVDs and strokes
    have important therapeutic implications for an expanding population of patients.
    Digitized medical data combined with information and telecommunication techniques
    are revolutionizing the diagnosis and treatment of complex cardiovascular abnormalities.


    In making their clinical decisions, medical practitioners need to learn and keep
    up with rapidly evolving AI tools and techniques, and to apply them in interpreting
    health-related data received from different sources. AI applications in cardiac
    care are opening a range of possibilities to provide new personalized healthcare
    services. Personalized new contacts between patients and medical practitioners
    are being established, with health data and telemedicine moving healthcare from
    a passive to a pervasive activity. Physicians, scientists are integrating AI for
    faster, accurate, and effective diagnosis and treatment.


    # 10.5 Application of AI in CVD Detection


    In cardiology, AI technologies are being used in cardiac precision medicine, clinical
    assessment, cardiac imaging analysis, and automated robotic systems (Figure 10.6).
    They bring faster and accurate results in detecting CVDs, which previously would
    take hours or days to get detected with traditional methods.


    In improving and optimizing CVD outcomes, AI techniques can drastically transform
    the way cardiology is practiced today. Specifically, the image techniques have
    offered innovative tools to effectively interpret data and arrive at a correct
    clinical assessment.


    Machine learning (ML) and deep learning (DL) techniques of AI not only assist
    medical practitioners with faster and accurate clinical decisions, but also significantly
    improve medical knowledge by handling huge volumes of complex health data and
    revealing clinically significant information about CVDs.


    The application of information and communication technology (ICT) is becoming
    central to the creation of a personalized and efficient healthcare service. It
    not only helps elderly and chronically ill cardiovascular patients to receive
    good medical care in the comfort of their homes, but also significantly reduces
    hospitalization costs and improves patients'' quality of life [30]. Early and
    accurate diagnosis and prognosis assessment are crucial to enhance CVD outcomes.
    The focus, however, rests on imaging when AI is used in cardiovascular medicine.


    ML, DL, and cognitive computing are AI techniques that can be effectively applied
    in early and accurate diagnosis, prediction of CVD outcome, and prognosis assessment
    of CVD.


    A vast number of quantitative, qualitative, and transactional data sets are generated
    from electronic health records and other resources, and these need AI techniques
    to be effectively and meaningfully interpreted [31]. Some of the AI techniques
    used in cardio-vascular medicine and digital healthcare applications are described
    below:'
