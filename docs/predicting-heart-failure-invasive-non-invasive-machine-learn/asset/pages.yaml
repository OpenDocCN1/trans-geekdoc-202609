  md: 'them best.The most important feature that distinguishes supervised learning
    from unsupervised learning is label information in supervised data. It is the
    class label in the data that provides the control. Although the output of both
    methods is different, the goal is to estimate the value of the output variable
    based on input variables.


    # 1.6.2.1.1 Decision Trees


    One of the prominent algorithms related to the classification task is the decision
    tree. The model presented with the tree data structure is learned directly from
    the data. Through the tree induction process, the characteristics of the training
    data are processed on the tree. The decision tree algorithm we often use and are
    used to seeing is the C4.5 algorithm [29]. Since the C4.5 algorithm is suitable
    for working with both numerical and categorical input variables, it can be used
    in many data sets.


    # 1.6.2.1.2 Naive Bayes


    The Naive Bayes classifier is a probability-based classifier. It is an algorithm
    that tries to find the final probabilities P (Cj | A) of the test data with the
    help of the preliminary probabilities P (A | Cj) learned from the training data.
    The algorithm is based on the Bayes’ theorem [30]. According to Bayes’ theorem,
    events are interrelated and there is a relationship between probabilities P (A
    | C) and P (C | A), P (A), P (C). Therefore, while calculating the value of P
    (A | C) with the help of Bayes, we use the equation P (C | A) = (P (A | C) P (C))
    / (P (A)). The Naive Bayes approach is used to solve the zero probability problem
    of Bayesian approach. Thanks to the naive approach, it is assumed that there is
    no relationship between the events and the process is shortened. Thus, it is possible
    to get rid of sparsity in the data relatively.


    # 1.6.2.1.3 Support Vector Machines


    SVMs were first introduced by Vapnik [31]. The technique uses what we call support
    vectors to distinguish between data points belonging to different classes. The
    method aims to find the hyperplane that will best distinguish (margin maximization)
    different classes from each other. In its simplest form, it distinguishes two-class
    spaces from each other with the help of two equations wTx + b = + 1 and wTx +
    b = -1. SVMs were first developed in accordance with linear classification and,
    later, kernel functions for nonlinear spaces were developed. Kernel functions
    express a transformation between linear and nonlinear spaces. There are types
    such as linear, polynomial, radial basis function, and sigmoid. Depending on the
    nature of the data used, kernel functions can be superior to each other.


    # 1.6.2.1.4 K-Nearest Neighbor


    The k-nearest neighbor (k-NN) algorithm is a distance-based classifier, which
    looks at the neighbors of the data point to classify a data object whose class
    is unknown. A majority vote is made for the classification decision. The two prominent
    parameters for the algorithm are the k (neighbor) number and the distance (distance)
    function. There is no exact method for determining the number of neighbors, so
    the ideal k value is often found after trials. The cosine similarity, Manhattan,
    Euclidian, or Chebyshev distance is used as the distance function. One of the
    problems with the k-NN algorithm is the scale'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'problem. When the method based on operating in geometric space gives a scale
    problem, the problem is solved by feature engineering.


    # ### 1.6.2.1.5 Neural Nets


    An ANN is a machine learning method that emulates human learning. ANNs, which
    are frequently used in classification problems, are also used in clustering and
    optimization processes. Although the simplest neural network model is perceptron,
    multilayer perceptron is often used in classification problems. Deep learning
    methods, which have been used in many important tasks recently, are based on ANNs.
    The adaptability and parallel processing capability of ANNs make them a powerful
    option for many problems.


    # ### 1.6.2.2 Unsupervised Learning


    Unsupervised learning works with untagged data and its purpose is to create clusters
    based on the characteristics of the data. Unlike supervised learning, untagged
    data is used instead of labeled data. After the data are divided into groups according
    to their similarity or distance, labeling is done with the help of an expert.
    Two applications that stand out in unsupervised learning are clustering and association
    rule mining. Clustering is the assignment of data points to groups called clusters.
    It has two types: partitioned and hierarchical methods. In partitioned clustering,
    a data point can only be in one cluster. In hierarchical clustering, a point can
    be hierarchically located in more than one cluster. In association rules mining,
    association rules focused on finding rules based on relationships between events
    are used in mining relationships between attributes.


    # ### 1.6.2.2.1 K-Means


    The K-means segmentation clustering algorithm was first developed in 1967 by MacQueen
    [32]. The purpose of the algorithm is to divide the data into K clusters. Each
    cluster is presented with a center of gravity named centroid. The K value is determined
    by the user. An iterative method is used to divide the data into clusters. The
    distance function obtains the point to which each data point will be assigned.


    # ### 1.6.2.2.2 Apriori Algorithm


    The apriori algorithm is the prominent algorithm in association rules mining.
    It finds common patterns in the transaction database and performs rule generation
    [33]. With the help of the obtained rules, the occurrence of another event can
    be predicted after an event occurs. It is a frequently preferred algorithm especially
    because it helps to establish relationships between events.


    # ## 1.6.3 Machine Learning Supported HF Studies


    Machine learning, the most common application of artificial intelligence, reveals
    patterns in data by continuously improving the ability to learn from data and
    the prediction and diagnosis of cardiovascular disease [34]. When the machine
    learning based diagnosis system of HF is considered as input, process, and output
    modules, the modules can be presented as follows. The input module contains data
    to be used by the decision support'
  merge: -1
