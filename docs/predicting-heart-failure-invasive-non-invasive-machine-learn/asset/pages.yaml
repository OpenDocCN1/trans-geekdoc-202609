    # 9.2.2.2 Methodology


    The development of the model for the NYHA class detection module consisted of
    three basic stages: preprocessing, feature selection, and classification. During
    preprocessing, features with more than (≥) 60.00% missing values were removed.
    Furthermore, discrete features with unbalanced distribution of values were removed.
    In the second step, the wrapper approach and correlation-based feature selection
    algorithm were used. In the classification stage, RF, LMT, C4.5, ROT, SVM, radial
    basis function (RBF) Network, BN, Naive Bayes (NB), and Simple CART classifiers
    were applied. The classifiers were combined with resampling techniques (SMOTE
    algorithm), when the class was unbalanced. Resampling was performed only during
