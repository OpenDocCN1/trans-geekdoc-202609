    Based on the processing algorithms utilized to identify features and perform classification,
    there have been multiple DL architectures introduced for the prediction of major
    HF clinical outcomes [22, 42,50-54; Figure 12.1]. CNNs have been shown to be highly
    effective in image classification [55, 56] and have been utilized widely for HF
    detection and diagnosis [51, 57, 58]. RNNs have shown success in identifying HF
    patients [50] and predicting the onset of HF [59-61]. A combination of such architectures
    creating multiple layers of processing can be utilized to improve performance
    and prediction efficacy, creating a deep neural network (DNN) [55, 62], which
    has shown promise in HF prediction [58, 63, 64; Figure 12.1].'
