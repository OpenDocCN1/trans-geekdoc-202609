    Physicians diagnose the disease according to their training, knowledge, experience,
    and clinical results. DL could prove to be extremely beneficial in expanding and
    improving their medical knowledge and understanding. ML models and DL can provide
    great help in clinical practice in a wide range of CVDs. Echocardiographic data
    and clinical factors combined with AI tools can diagnose, classify, estimate the
    severity, and predict the adverse events in CVDs [45–48]. Ouyang et al. [49] successfully
    designed an innovative video-based DL algorithm: EchoNet-Dynamic. This model can
    evaluate cardiac functions with accuracy better than human experts can from echocardiogram
    videos alone.


    # 10.5.4 Magnetic Resonance Imaging


    Magnetic resonance imaging (MRI) is emerging as a strong option for assessing
    several cardiovascular pathological entities. It is a very effective tool for
