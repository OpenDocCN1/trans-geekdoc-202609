    # 2.5.1 AI in Echocardiography


    The role of ultrasound devices is vital in the early diagnosis of cardiovascular
    diseases (CVDs). In addition, some of the risk factors of CVDs can be due to high
    blood pressure or high cholesterol, and one of the main causes of such diseases
    can be the buildup of inflammatory cells known as plaques, which occur in the
    arterial wall and result in both blood restriction to the heart and lower oxygen
    intake. This medical condition is known as atherosclerosis. Early prediction of
    a CVD disease might help in preventing the progression of atherosclerosis as well
    as possible heart failures. In Figure 2.8, it is shown that plaque formation occurs
    mostly in the common carotid artery and internal carotid artery.


    One of the ways to identify the plaques in the arterial wall is by analyzing the
    carotid artery, which consists of a pair of blood vessels and has several parts,
    namely internal, external, and common parts. Plaques occur in the internal section
    as well as in the common blood vessels of the carotid artery. Hence, plaques create
    a thicker wall in these vessels, and can be measured as intima-media thickness
    (IMT). Thus, carotid IMT is used as a risk marker for early heart disease prediction.
    It can be done by


