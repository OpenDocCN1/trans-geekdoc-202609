  md: '# 13


    # Future Techniques and Perspectives on Implanted and Wearable Heart Failure Detection
    Devices


    Muhammad E. H. Chowdhury, Amith Khandaker, Yazan Qiblawey, Fahmida Haque, Maymouna
    Ezeddin, Tawsifur Rahman, Nabil Ibtehaz, and Khandaker Reajul Islam


    # 13.1 Introduction


    Heart failure (HF) affects 1–2% of the population of developed countries [1] and
    the number of people affected is increasing day by day. More than 30% of the patients
    visiting clinics require hospitalization within 12 months [2]. The common clinical
    practice is to make a decision about a patient based on a single short clinical
    visit or on many short visits, often repeated over several months. However, advancements
    in implantable and wearable technology and in the machine learning domain have
    significantly reduced the number of hospital admissions in recent years. Moreover,
    medical doctors have more patient data from less symptomatic patients compared
    to more symptomatic patients and the number of self-reported patients has significantly
    increased over the years [3]. Self-reported patient data, commonly done using
    a set of questions in a self-report tool, is a common method that is used to collect
    medical information and can be used to understand the patient''s perspective regarding
    their own health conditions. Most implantable devices are very expensive and only
    a limited number are approved for clinical applications; on the other hand, the
    number of users of wearable devices has significantly grown over the years and
    it has become evident from the outcome of several research studies of large patient
    cohorts that wearable devices can play a vital role in the disease screening process;
    this has been particularly evident during the outbreak of the coronavirus pandemic
    in 2019 (COVID-19) [4–10].


    Implantable devices are a common approach that has been used for a long time to
    monitor and detect HF, beginning in 1960 with the creation of the first implantable
    pacemaker. Since then, countless lives have been saved [11]. The first implantable
    pacemaker, a battery-powered pacemaker with a myocardial lead, was developed in
    a hospital in Buffalo, New York [12]. According to local news, this work helped
    the first patient to carry on his life for 21 years. With the advances of wearable
    sensors and the growth of the smartphone market, a change in the healthcare system
    is possible by introducing personalized healthcare to billions of people. Moreover,
    these devices are becoming'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'increasingly sophisticated and accurate and can be considered biological sensors,
    which can transform several fields in healthcare including the management of HF,
    where mobile applications can remotely monitor hundreds of thousands of patients
    for signs and symptoms and can notify them to change medication or contact their
    doctors. Management of HF is unique among medical circumstances, in that it requires
    continuous management of data such as weight, heart rate, blood pressure, and
    volume status that may require adjusting daily medication.


    Wearable health devices are already available in the market, although most of
    them are for fitness, these devices are creating a unique opportunity to improve
    HF care. With the advances in technology, some companies have started including
    biosignal sensors to measure biomedical signals such as heart rate and electrocardiographic
    information. Several trials [13–15], using commercial devices, have been conducted
    on using wearable devices for HF management. These studies have confirmed that
    wearable devices can be used to manage HF patients. However, several problems
    still exist, such as how to use the devices, data transmission, analyzing the
    data, and correlating the data with existing records [14, 15]. Advances in machine
    learning and accessibility to extensive patient information in the electronic
    medical records play an important role in improving HF management tools. Several
    studies have shown that machine learning can predict HF diagnosis with reasonable
    accuracy, classify HF cases, and identify HF a long time before the clinical diagnosis
    [16]. Studies exist that have used machine learning to create predictive models
    for HF [16, 17]. The models are trained on different data types, such as ambulatory
    blood pressure and activity level. The models can either identify the factors
    that increase the risk of HF, such as diastolic blood pressure, or identify patients
    at risk, or patients who are at risk of readmission to hospital [18, 19].


    This chapter discusses the applications and challenges of implantable devices
    for HF monitoring, as well as their prospects and limitations, and lists some
    of the data sets recently collected from wearable devices. Finally, the application
    of machine learning for detecting HF using wearable devices and its prospects
    are discussed.


    # 13.2 Applications of Implantable Devices in HF Detection


    Implantable devices are extensively used to monitor patients with cardiovascular
    diseases (CVDs). CVDs contribute to 45% of deaths in Europe and 720,000 people
    suffer from heart attacks every year in the US [20, 21]. Several studies have
    confirmed that there is a close relationship between high blood pressure and increased
    CVD risk in the elderly population. Between 2004 and 2014, there was a significant
    increase (~34%) in deaths in the world population due to high blood pressure,
    which was attributed to ever-increasing socioeconomic pressure, as well as to
    lack of awareness of preventive or monitoring measures, etc [21]. Several implantable
    devices are clinically being used or are under clinical trial for monitoring HF
    patients invasively. Among these, low arterial pressure monitors, intrathoracic
    impedance monitors, and lung fluid monitors are prominent. However, very few remote
    monitoring systems for HF patients are approved by the US Food and Drug Administration
    (FDA); the Cardio-Microelectromechanical'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'system (CardioMEMS™) [22, 23] is one of them. This is a pulmonary artery pressure
    (PAP) device to directly monitor pressure with the help of implanted sensors,
    and the data is communicated to the healthcare provider for better patient management
    (Figure 13.1). Clinical trials have reported that the rate of hospitalization
    has reduced with the application of the CardioMEMS device [24].


    Apart from cardiovascular information, blood pressure provides information about
    other conditions, such as sleep apnea, dementia, and hypertensive multiple sclerosis
    complications [25, 26]. Implantable pressure sensors with wireless communication
    can be effectively used for long-term monitoring. This PAP monitoring has significant
    research importance. It has been reported that HF can be detected several weeks
    earlier by monitoring the changes in blood pressure [27]. Non-invasive solutions
    for real-time arterial blood pressure monitoring can significantly ease the process.
    One major contribution toward this objective has been reported recently, namely
    the extraction of arterial blood pressure non-invasively using the photoplethysmogram
    (PPG) signal [28]. A PPG is an optically obtained plethysmogram that can be used
    to detect blood volume changes in the microvascular bed of tissue. It is often
    obtained by using a pulse oximeter which illuminates the skin and measures changes
    in light absorption. There have been studies conducted by the authors to detect
    blood pressure using PPG signals using machine learning approaches on already
    available labeled datasets [28, 29]. These studies reported a deep learning-based
    approach for predicting the continuous arterial blood pressure (ABP) waveform
    through a non-invasive approach using PPG signals, an approach that is suitable
    for wearable devices and remote patient monitoring.


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_310_0.png)


    Figure 13.1 The system architecture of the CardioMEMS system [25].'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'A cardiac pacemaker generates electrical impulses to be delivered to the atria
    and ventricles to contract and pump blood to the body. By contrast, a cardiac
    resynchronization therapy defibrillator (CRT-D) is a life-saving device for HF
    patients who are at high risk of cardiac arrest in that it not only helps to sustain
    normal heart rhythms like a pacemaker, but also helps to deliver small electrical
    impulses to both ventricles to contract them simultaneously (Figure 13.2). To
    monitor the progression of HF, intracellular and extracellular ion concentrations
    can be monitored and clinical trials with CRT-D and these kinds of sensors can
    help save lives by ensuring better patient management. Wireless communication
    from implantable cardioverter-defibrillators (ICDs) to medical personnel and patients’
    caregivers has now become a reality [30].


    The ICDs continuously monitor the heart signal and, if there are any abnormal
    heart rhythms detected, it immediately works to correct the rhythms. Moreover,
    if a cardiac arrest occurs and the heart stops its pumping action, these devices
    restore heart function by applying an electric shock to revert the situation.
    These devices are FDA-approved and are quite reliable for critical patient management,
    although patients have to maintain a very restricted lifestyle.


    The rise in left atrial pressure (LAP) usually is gradual and precedes symptom
    onset. Therefore, accurate monitoring of LAP using an implantable LAP sensing
    device (as shown in Figure 13.3) could allow earlier identification. A small clinical
    trial with eight HF patients being monitored with LAP devices twice a day resulted
    in no deaths, no unplanned HF clinic visits, and no hospital admissions for HF
    [33].


    There is a wide range of cardiac implantable devices available in the market.
    Figure 13.4 shows some of the implantable devices, with different form factors,
    from different companies.


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_311_0.png)


    Figure 13.2 Cardiac pacemaker (left) [31] and CRT-D (right) [32].'
