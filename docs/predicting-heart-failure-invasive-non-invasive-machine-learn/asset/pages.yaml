    # 9.1.2.6 ML Applications in Mortality Prediction


    Other studies focus on developing a model to predict mortality among patients
    with HF (Table 9.4). In 2013, Pocock et al. [87] used the Meta-Analysis Global
    Group in Chronic Heart Failure (MAGGIC) international database with 39,372 patients
    from 30 studies, to create an easily used risk score for mortality in patients
    with HFrEF and HFpEF. They applied Poisson regression with forward stepwise feature
    selection and concluded to 13 independent features. All were highly significant
    P < 0.002, and most were overwhelmingly significant P < 0.0001.


    In 2017, Miao et al. [88] utilized the public MIMIC II clinical database with
    8059 patients and 32 features consisting of demographics, clinical variables,
    laboratory findings, and medications. They analyzed these features to develop
    a risk model for mortality prediction in patients with HF. They applied the improved
    random survival forest achieving C-statistic 0.821.


    In 2019, Kwon et al. [89] applied a DL-based artificial intelligence algorithm
    for predicting mortality of patients with acute HF. The AUC of the model was 88.00%
    for predicting in-hospital mortality, 78.20% for predicting 12-month mortality,
    and 81.30% for 36-month mortality. They utilized 2165 patients with acute HF for
    training and 4759 patients with acute HF for testing. Their data set included
    demographic features, medications, laboratory results, and ECG and echocardiography
    findings.'
