- pgno: 33
  md: 'system, such as physical examination data, laboratory results, clinical data,
    ECG monitoring data, and electrocardiography data. The transaction module is the
    module that contains machine learning algorithms, which are mainly supervised
    and unsupervised learning algorithms. In diagnosing HF the machine learning algorithms
    currently used include nearest neighbor, self-organizing maps, multilayer perceptron,
    classification and regression trees, random forests, SVMs, neural networks, logistic
    regression, decision trees, clustering, and fuzzy-genetic and neuro-fuzzy expert
    systems. In the output module, information such as the presence of HF, risk of
    HF events, evaluation of left ventricular deterioration, response to advanced
    therapies, and risk of death is attempted to be determined.


    When the literature on machine learning methods (Table 1.2), which is an important
    option in diagnosing HF, is examined, it will be seen that the use of HRV stands
    out in many studies. In one of the case studies, Yang et al. [35] used a scoring
    method to diagnose HF. In the study, with the help of two SVM models, it was first
    checked whether the person has HF. If the result was normal, the second SVM model
    came into play and classified the person being examined as healthy or prone to
    HF. The scores were matched with the SVM model outputs and diagnostic outputs
    were obtained according to the score ranges.


    The aim of the study by Son et al. [36] was to distinguish between CHF and shortness
    of breath problems. The study was initially made with 72 features; rough sets
    and logistic regression techniques were used to reduce the number of variables.
    The accuracy of the classification obtained according to the features selected
    with the help of coarse clusters was 97.5%, and the classification accuracy obtained
    with the features selected based on logistic regression was measured as 88.7%.


    Mastic et al. 2016 [37] applied the random forest algorithm to ECG time series
    to detect CHF. The features on the ECG were extracted using the autoregressive
    Burg method. In the study, apart from the random forest algorithm, C4.5, SVM,
    ANN, and k-NN classifiers were used with the random forest algorithm giving the
    best performance.


    Wu et al. [38] studied detecting HF prior to clinical diagnosis. Information such
    as electronic health records, health behavior, demographic data, clinical diagnosis,
    and clinical precautions were used to detect the disease in advance. SVM, boosting,
    and logistic regression were used for early detection of the disease. In addition,
    the contribution of feature selection to success was observed.


    Aljaaf et al. [39] proposed a multilevel risk assessment for developing HF. With
    the help of the C4.5 classifier, estimates were made according to five different
    risk levels (1: No risk; 2: Low risk; 3: Moderate risk; 4: High risk; 5: Extremely
    high risk). The Cleveland heart disease data set was used in the study. A 10-fold
    cross-validation procedure was followed to evaluate the C4.5 classifier.


    Zheng et al. [40] proposed a computer-aided diagnostic system for diagnosing HF.
    This system uses least-squares SVM (LS-SVM). The LS-SVM classifier gave better
    results than neural nets and hidden Markov models.


    Pattekari et al. [41] designed a Naive Bayes-based smart system and developed
    a decision support system for HF prediction. With the web-based application, users
    were asked predefined questions and the estimation process was carried out by
    comparing their answers with the database.'
