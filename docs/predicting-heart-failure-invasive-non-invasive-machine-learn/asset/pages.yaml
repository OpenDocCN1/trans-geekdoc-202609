    # 11.2.7 Role of Mobile Health Apps in Heart Failure Self-Care


    According to the statistics provided by Forbes in 2017 [46], there exist more
    than 50,000 mobile health (mHealth) apps on the market that are focused on ameliorating
    the mental and physical fitness of individuals. Some of the available apps have
    been developed for general well-being while the rest are for specific purposes
    such as maternal care, child-care, chronic disease management, etc. Numerous studies
    have analyzed the role of mHealth apps for self-care in heart failure patients
    [47–49]. Among these, a few mHealth apps are focused on educating heart failure
    patients. Most of the mHealth apps that focus on therapeutic education rely on
    text messaging. Multiple automated messages are sent to patients to educate them
    on the diet to be followed, symptoms, and how to differentiate these symptoms
    from other diseases which have similar symptoms. Furthermore, the apps provide
    questionnaires that are related to heart failure symptoms, which the patients
    must complete. Some of the apps have integrated the physiological values from
    home-based devices such as body weight scales and BP monitors to provide additional
    care to heart failure patients. The observed results of the studies have shown
    that mHealth apps have improved the knowledge about heart failure and its associated
    issues in heart failure patients as well as increasing their involvement in self-care.
    However, most of the mHealth apps in the literature have conducted only a pilot
    study in a few subjects to analyze the usability and effects of self-care.


    There are several commercially available mHealth apps for heart failure self-care.
    The majority of theses are available free in popular application stores such as
    Google’s Play Store and Apple’s AppStore. A systematic app search was conducted
    in Wali et al. [50] to examine various commercially available heart failure apps.
