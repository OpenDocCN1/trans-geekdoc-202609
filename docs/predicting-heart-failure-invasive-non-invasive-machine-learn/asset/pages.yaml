  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_248_0.png)


    Figure 10.6 Role of AI in CVD treatment.


    # 10.5.1 Telemedicine and Mobile Health


    Telemedicine and mobile health (mHealth) are gaining popularity and playing a
    significant role in the deterrence of CVDs and overall upgrading of cardiac care
    services. mHealth forms an integral part of eHealth and ICT such as computers,
    smartphones, mHealth applications, and patient monitoring services. AI is beneficial
    for remote follow-up of patients, medication reminders, real-time medical counselling,
    and early warnings of symptoms. This vital generated information can be used to
    access the healthcare information and lead to general improvement in healthcare
    services [32]. mHealth supports individuals in maintaining their health under
    the monitoring of physicians while allowing them to continue their daily activities.
    From a clinician’s perspective, AI can prove to be extremely effective in collecting
    voice medical data and connecting electronic medical records, thereby significantly
    reducing the work of clinicians [33]. Mobile devices have shown great promise
    in preventing CVDs, with self-monitoring apps and their use in activities such
    as diet monitoring, physical activity, blood pressure (BP) and sleep monitoring.
    These applications help patients to maintain a healthy exercise routine and proper
    weight, controlling blood glucose and normal BP and lipid profile [34–37]. A study
    reported by Apple and Stanford Medicine [38] assessed whether the Apple heart
    study app, used for the analysis of pulse rate data collected from the Apple Watch,
    could identify irregular heart rhythms.'
