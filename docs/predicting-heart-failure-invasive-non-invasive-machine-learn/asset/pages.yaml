- pgno: 290
  md: 'Importantly, many ML/DL algorithms have shown superior performance in identifying
    HF patients compared with traditional statistical approaches and conventional
    physician diagnosis. Nirschl et al. [51] reported a CNN-based DL classifier to
    detect HF using endo-myocardial biopsy images with 99% sensitivity and 94% specificity.
    The algorithm was highly accurate and shown to outperform two pathology experts
    by 20%. Another study, investigating the efficacy of an RNN model for prediction
    of HF onset and risk, reported an area under curve (AUC) of 82% compared to 79%
    achieved by logistic regression [61]. Additionally, the study demonstrated the
    successful transferability of the ML model to data across different hospitals
    with a conservative 3.6% drop in AUC, highlighting the adaptability of the ML
    algorithm to the variability in data across patient populations and hospitals
    [61]. Choi et al. demonstrated the utility of AI based clinical decision support
    systems in diagnosing HF compared to traditional method of diagnosis by HF specialists
    [65; Figure 12.1]. The AI based system showed high accuracy with a concordance
    rate of 98% between the AI system and HF specialists. Similarly, multiple other
    groups have shown ML/DL algorithms to outperform conventional analytical methods
    [66-69].


    # 12.5 Invasive Monitoring Devices for Prediction of HF


    Recent studies have suggested that physiological parameters, other than the traditionally
    utilized markers of weight or intrathoracic impedance, may be needed for timely
    detection of HF decompensation [70]. In fact, interventions based on pulmonary
    artery hemodynamic monitoring [71, 72] have shown a significant reduction in rehospitalization
    rates.


    Invasive ambulatory hemodynamic monitors have shown promise as early-warning systems
    in HF, with multiple devices having been investigated, including right ventricular
    (COMPASS-HF [9] and REDUCE HF [73]), left atrial (HOMEOSTASIS[74] and LAPTOP-HF
    [11, 71]), and pulmonary artery (CHAMPION [12]) pressure measurement systems [7,
    10–12]. More recently, in the MultiSENSE [75] study, an algorithm based on physiological
    data from sensors in the implantable cardiac resynchronization therapy (CRT) defibrillators,
    showed 70% sensitivity in predicting the risk of HF hospitalizations or worsening
    of HF. Although, in this case, the risk prediction algorithm (HeartLogic [75])
    was constructed by combining heart sounds, respiration, thoracic impedance, heart
    rate, and activity information and did not involve complex ML/DL algorithms, the
    study highlighted the potential of utilizing physiological information from implanted
    CRT devices to predict impending HF decompensation.


    The utility of applying ML algorithms to data acquired from invasive cardiovascular
    devices for the management of HF (Table 12.2) was demonstrated by the COMPANION
    [76] trial. In this study, an RF ML model developed to predict all-cause mortality
    or HF hospitalization at 12-month post-CRT implantation produced quartiles of
    patients with an eightfold difference in survival between those with the highest
    and lowest predicted probability for events [76]. Furthermore, the model also
    performed better at discriminating the risk of all-cause mortality or HF hospitalization
    than traditional methods of assessment based on the bundle branch block morphology
    and QRS duration [76]. While the conventional diagnosis methods failed to significantly
    differentiate survival outcomes in patients with CRT, the RF ML model successfully
    predicted clinical outcomes.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Similarly, a study to predict right-ventricular failure (RVF) following left
    ventricular assist device (LVAD) therapy using a tree-augmented Naive Bayes model,
    demonstrated an accuracy of up to 97% [77]. Bayesian prognostic models of RVF
    applied to patient data from the Inter-Agency Registry for Mechanically Assisted
    Circulatory Support (INTERMACS) who had an implanted LVAD, were shown to be highly
    accurate in predicting acute, early, as well as late RVF with sensitivity of around
    90%, and achieving a maximum specificity of 99% [77]. The Bayesian model was also
    shown to outperform previous risk scores such as the right ventricular failure
    risk score [78] (RVFRS) and Drakos [79], obtained by multivariable logistic regression
    analysis, when applied to the INTERMACS registry (AUC 54.7% and 49.8%, respectively)
    [77]. Another study by the same group showed that Bayesian prognostic models applied
    to the INTERMACS registry accurately (76–87%) predicted mortality as well, with
    an AUC ranging between 0.70–0.71 [80]. Furthermore, they developed a novel Bayesian
    model for risk stratification and prediction of mortality at different time points,
    that is 30 days, 90 days, 6 months, 1 year and 2 years, post-LVAD implantation
    [81]. The AI algorithm exhibited mortality prediction accuracies of 95, 90, 90,
    83, and 78%, at each of the five time-points, respectively, with AUCs of 91, 82,
    82, 80, and 81%, respectively, performing significantly better than the traditional
    logistic regression based HeartMate II Risk Score [82] (AUC 57 and 60%, at 90
    days and 1 year, respectively) [81].


    There are a number of implantable monitoring devices focused on the management
    of HF, such as CardioMEMs [83, 84], which are implantable impedance monitors [85]
    to gauge fluid accumulation [86, 87] and dedicated ML approaches to analyze data
    from CRT devices, LVADs, and implantable cardioverter defibrillator (ICDs) [22,
    32, 33, 43, 45, 88]. While devices like CardioMEMs have shown reduction in HF
    readmissions [12, 72], a major limitation of these devices is that they are invasively
    implanted, costly upfront, and demand additional personnel and resources to handle
    the device implantation and data acquisition. In addition, invasive monitoring
    devices require specialized hardware and data extraction features, often making
    them cumbersome and impractical for real-time monitoring and assessment of active,
    ambulatory patients, especially those who live in underserved areas. Furthermore,
    their cost-effectiveness remains debatable [89–91], highlighting the need for
    affordable non-invasive approaches for HF monitoring enabled with effective AI
    based disease prediction strategies.


    # 12.6 Non-Invasive Wearable Monitoring Devices for Prediction of HF


    The utility of wearable monitoring devices [92–96] in cardiovascular healthcare
    and, in particular, in HF management has been well established [16, 97–99]. Ambulatory
    non-invasive monitoring devices that assess various physiological parameters,
    including blood pressure [100], photoplethysmograms (PPGs) [101], seismocardiograms
    [17], ECG [95, 102], electromagnetic energy-based dielectric properties [103],
    oxygen saturation [104], and fluid status, weight, activity, and bioimpedance
    [105], have enabled access to large amounts of patient data which are ideally
    suited for applying AI algorithms and predicting HF onset or deterioration (Table
    12.2; 98, 106–110).'
