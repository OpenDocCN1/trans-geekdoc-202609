    Numerous studies have proved the positive effect of bioimpedance analysis for
    monitoring heart failure patients. Initially, bioimpedance analysis was conducted
    invasively by transmitting a weak current from the wires of pacemakers and defibrillators
    [26]. Now, however, non-invasive devices are pervasively used for bioimpedance
    analysis and heart failure monitoring. Whole-body impedance, as well as transthoracic
    impedance measurements, are utilized in the literature to predict the risk in
    heart failure patients [27, 28]. Kataoka [29] proposed a novel non-invasive method
    for integrating a bioimpedance index along with body weight for managing the health
    conditions of heart failure patients. The proposed method showed that the bioimpedance
    index and body weight combination have significantly increased the predictive
    accuracy for detecting the worsening of heart failure conditions. However, the
    method was evaluated in only a few subjects. A study by Gyllensten et al. [30]
    compared the performance of traditional algorithms based on body weight and bioimpedance
    measurement for early prediction of risk heart failure patients. In the study,
    91 patients with CHF were made to wear a transthoracic bioimpedance vest containing
    textile electrodes on both sides to transmit current at variable frequencies to
    the body. Along with the bioimpedance measurement, body weight was also monitored
    for a period of 10 months. Compared with body weight, the bioimpedance measurement
    provided a more accurate prediction for early indication of risk in heart failure
    patients.


    In Anand et al.''s MUSIC study [9], a non-randomized study for evaluating the
    efficacy of a multisensory device for monitoring patients suffering from congestive
    heart failure utilized the body composition measurement along with other physiological
    values. Another study examined the efficacy of a fluid accumulation vest (transthoracic
    bio-impedance vest) for monitoring heart failure patients [31]. The selected subjects
    of the study were made to wear the vest and take the body composition measurement.
    The body composition measurements were sent to the clinic using smartphones and
    internet connectivity. The observed output of the study in 180 patients showed
    that monitoring the body composition measurement using the fluid accumulation
    vest can predict the risk, including that of hospitalization, of the patient in
    advance.


    # ## 11.2.5 Smart Wearable and Pocket-Sized Devices for Monitoring of the Heart


    US FDA-approved smart wearables that are equipped with multiple sensors, including
    smartwatches, smart bands, vests or socks embedded with sensors, ECG patches,
    etc., are currently available for monitoring heart conditions. Current generation
    smartwatches and smart bands are equipped with activity recognition sensors and
    with heart rate and heart rhythm sensors. The readings from these sensors can
    be utilized for monitoring of and predicting risk in patients with heart failure.
    Triaxial accelerometers, global positioning systems, and barometers are included
    in the smartwatches and bands to accurately estimate the physical activity of
    an individual. A recent research study [32] found that the data from a pedometer
    is suitable for detecting the risk and severity of heart'
