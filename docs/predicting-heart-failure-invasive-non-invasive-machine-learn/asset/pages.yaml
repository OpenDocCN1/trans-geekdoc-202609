  md: '# 2.3.6 Recording History of Heart Disease


    In many heart patients, mostly adults, the heart disease or discomfort related
    to the heart won’t begin suddenly in a day. A detailed study about the history
    of any chest discomfort or heart disease experienced by the patient in the past
    can provide additional information about the underlying disease for the cardiologist.
    The history recording procedure investigates whether the patient has suffered
    any heart attack or coronary artery diseases, whether they have undergone any
    heart surgery in the past, their medication history, etc. The cardiologist will
    also ask when an incident happened, how it was diagnosed, about the patient’s
    lifestyle after that incident, etc. Furthermore, the history recording procedure
    will inquire into whether the patient was healthy during their childhood, whether
    they were very active and took part in soft or vigorous sports activities, etc.


    # 2.3.7 Family History


    The cardiologist enquires about the family history of the patient including whether
    any cases of heart attacks, strokes, coronary artery diseases, acute heart diseases,
    and early death linked to heart disease have occurred in the patient’s family.
    The family history of heart disease recording is based on the fact that, if family
    members have suffered from any heart or cardiovascular disease, then the patient
    is more likely to have the heart disease. The brothers or sisters of a patient
    with heart disease are 40% more likely to suffer heart disease in the future,
    while the offspring of patients with early heart disease are 60 –75% more prone
    to heart diseases [7].


    # 2.3.8 Blood Pressure and Pulse


    The amount of force used by the heart to pump blood across the body is referred
    to as blood pressure; in other words, the pressure generated when the heart pumps
    blood into the circulatory system. Blood pressure is measured using a sphygmomanometer
    or blood pressure monitor in millimeters of mercury unit (mmHg). There will be
    two components for each reading of blood pressure, the systolic and diastolic
    pressures. The force exerted on the walls of arteries by the heart during systole
    is called systolic pressure. The systole is a short span where the ventricles
    of the heart are contracted, and it happens in between the first and second heart
    sound. Diastolic pressure is the force exerted on the walls of arteries between
    the beats. Generally, blood pressure levels between 120 and 80 mmHg are considered
    normal. Blood pressure level measurement has significant importance in the heart
    disease examination procedure. Several studies have found that high blood pressure
    levels have a clear link with the risk of strokes as well heart diseases in individuals
    irrespective of their ages [8]. However, a study [9] conducted in different age
    groups of the Framingham heart study participants observed that in individuals
    aged less than 50 the diastolic blood pressure levels are a clear indicator for
    predicting heart disease. On the other hand, systolic pressure levels along with
    pulse pressure levels are the clear predictor of heart diseases in individuals
    over 50 years old.


    The heart rate, or the cumulative number of times the heart beats in a minute,
    is referred to as pulse. If the person is resting, 60–100 beats per minute are
    considered natural. The heart rate can elevate up to 150 if the person is involved
    in any highly'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'vigorous activity. If the resting heart rate of an individual is less than
    60, then it is called bradycardia and, if it is greater than 100/120, then it
    is called tachycardia. Bradycardia is often linked with underlying heart diseases
    such as heart failure. Similarly, tachycardia can be an early symptom of heart
    failure or stroke.


    # ## 2.3.9 Total Cholesterol, Triglycerides, and Associated Lipid Profiles


    The lipid fraction of the human body is made up of cholesterol, triglycerides,
    and high-density lipoproteins (HDLs). Elevated cholesterol levels in the human
    body can increase the chances of developing heart diseases and stroke. The cholesterol
    level of a human body is measured by drawing blood samples. The cholesterol level
    examination generates the measurement of four types of fats (lipids) in the blood:
    total cholesterol; HDL cholesterol; low-density lipoprotein (LDL) cholesterol;
    and triglycerides. The overall amount of cholesterol in the blood is known as
    total cholesterol. HDL cholesterol is known as the “good” cholesterol as it aids
    in the removal of LDL cholesterol, allowing arteries to remain open and blood
    to circulate freely. A higher amount of HDL in the blood lowers the rate of heart
    disease risk [10]. LDL cholesterol is known as “bad” cholesterol since a higher
    amount of LDL in blood induces atherosclerosis, which is the accumulation of fatty
    deposits (plaques) in arteries. These plaques may hinder blood flow and cause
    a heart attack or stroke. Therefore, a higher HDL level represents a higher risk
    of heart disease [11]. Triglycerides are a type of fat that occurs naturally in
    the body. Extra calories consumed over the total energy expenditure of a body
    get converted into triglycerides. These triglycerides are contained in fat cells
    and are later released into the blood when the body requires energy to do any
    activity. The elevated level of triglycerides in the blood is due to many reasons,
    such as obesity, thyroid or liver disease, and genetic conditions. High triglyceride
    levels are linked to the increased risk of heart disease [12]. A bad diet that
    includes a significant amount of butter, oil, and excess sugar can cause an increase
    in the level of triglycerides in the body. Eating a lot of foods rich in carbohydrates
    or sugar and drinking excessive amounts of alcohol lead to high triglycerides
    levels in the human body. Apart from food, the main cause of increased triglyceride
    levels is a sedentary lifestyle. Certain types of food should be avoided or limited
    if the patient has high triglyceride levels: the intake of starchy vegetables
    like corn and peas should be limited, while canned fish or beef packed in oil
    should be avoided. Baked foods that contain a high level of saturated fat should
    also be avoided and the consumption of butter or margarine should be limited or
    replaced with olive oil. Lean meats should be preferred over high fat meats such
    as beef or pork. Moreover, all processed meats are bad for patients with higher
    levels of triglycerides and should be avoided.


    # ## 2.3.10 Bruits and Hums of the Head and Neck


    A bruit refers to the vascular sound associated with turbulent blood flow. This
    will be audible and detected with a stethoscope. These auscultatory sounds originating
    in the heart and radiating to the neck are considered to be cardiac valvular murmurs.
    A carotid bruit is the sound heard over the cervical arteries and can indicate
    the underlying arterial occlusive pathology which can lead to a stroke. The carotid
    artery bruit'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'can also be caused by atherosclerotic stenosis in adults. The cervical venous
    hum is often felt over the internal jugular cervical veins and is due to the combined
    effects of gravity on the blood flow and the partial compression of the vein by
    the transverse process of the atlas. These sounds, especially venous hum, are
    more common in children than adults and are quite normal. Cranial and orbital
    bruits, vibrations resulting from turbulence in intracranial or extracranial vessels,
    are less serious and normally occurring in the younger population. However, cranial-orbital
    bruits present in the adult category, are usually pathological and indicate an
    underlying abnormality such as arteriovenous fistulas, arteriovenous malformations,
    and intracranial hemangiomas. In addition, an orbital bruit can occur rarely as
    a result of the atherosclerosis of the arteries in the neck.


    # ## 2.3.11 Jugular Venous Pressure


    The jugular venous pressure or jugular venous pulse estimation is a method for
    assessing central venous pressure. The central venous pressure alters with a change
    in the amount of blood flowing back to the heart as well as an increase or decrease
    in the capability of the heart to drive blood back to the circulatory system.
    The jugular venous pressure assessment procedure includes making the patient lie
    in a semi-recumbent position, turning the head of the patient to the left side
    (normal jugular venous pressure is assessed from the right side of the neck),
    and jugular venous pressure is measured by estimating the distance between the
    top point of the internal jugular vein and sternal angle. An elevated jugular
    venous pressure is linked with abnormal functioning of the right heart, heart
    failure conditions [13], and hypotension.


    # ## 2.3.12 Carotid Pulse and Precordial Impulse


    The carotid pulse is commonly a pressure signal sensed over the carotid artery
    when it passes near the neck. This pulse signifies the variations in the arterial
    blood pressure and volume with each heartbeat. It appears as a smooth rapid upstroke
    and a gradual downstroke with a brief interruption at the pulse peak. The abnormalities
    of the carotid pulse can be identified as an alteration in either pulse peak amplitude
    or a distortion of the upstroke or downstroke or both. These variations in carotid
    pulse contour reflect underlying cardiac abnormalities, such as aortic stenosis.
    However, it is generally confirmed only after detecting abnormal cardiac impulse
    or murmur.


    Precordial impulses generally originate from the heart or great vessels visible
    or palpable on the anterior chest wall. All the precordial impulses including
    apex impulse, parasternal impulse, and pulmonary artery pulsation are observed
    and consideration is taken into account of the relevant location, size, and character,
    which including the duration, force, and contour.


    # ## 2.3.13 Heart Sounds and Murmurs


    Discrete bursts of auditory vibrations that differ in intensity (volume), frequency,
    quality, and duration are known as heart sounds, the sounds for a normal heartbeat
    being first'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'heart sound (called lub) and second heart sound (called dub). The first heart
    sound consists of multiple high-frequency elements where only the first two among
    them can be heard normally. These two normally audible sound waves occur simultaneously
    when the mitral and tricuspid valves close. The first heart sound indicates the
    beginning of ventricular systole and the end of mechanical diastole. The second
    heart sound is described as a discrete burst of vibration that occurred due to
    the immediate closure of the aortic valve and pulmonic valve. The second heart
    sound consists of two components – the aortic component and the pulmonic component
    – with the aortic valve and pulmonic valve being the sources of the second heart
    sound. The second heart sound is produced at the end of ventricular contraction
    and it indicates the beginning of ventricular diastole and the end of mechanical
    systole.


    Apart from the normal first and second heart sounds, unusual third and fourth
    heart sounds are found in healthy as well as unhealthy individuals. The third
    heart sound, or ventricular gallop, is an additional unusual sound produced after
    the first and second heart sound. It is generated when a large amount of blood
    strikes the left ventricle and happens when the mitral valves open after the second
    heart sound, allowing passive blood flow to the left ventricle. The fourth heart
    sound, or atrial gallop, is a low-pitched sound that occurs before the first heart
    sound as the ventricle fills late in its diastole due to atrial contraction. The
    fourth heart sound results from vibrations produced within the ventricle, and
    it is also known as the atrial sound because its development requires an effective
    atrial contraction.


    Generally, the cardiologist examines the heart sound by cardiac auscultation technique
    using a stethoscope. The unusual pattern of heart sound can indicate a serious
    underlying heart condition. The first and second heart sound are common, while
    the third and fourth are unusual in healthy individuals. However, while the third
    heart sounds can be audible in healthy individuals below 40 years of age [14]
    and pregnant women [15], in people younger than 40 they are considered abnormal
    and a possible early indication of heart diseases including heart failure. The
    fourth heart sound is very rare in healthy individuals, but common in patients
    with heart diseases.


    Heart murmurs are the type of abnormal sound generated in the heart as a result
    of the turbulent flow of blood. These murmurs are generated either by blood flow
    through an abnormal valve or by abnormalities in the internal chamber of the heart.
    In most cases, the murmurs are not serious and do not require quick medication
    or a hospital visit. However, in a few cases, the abnormal murmurs are due to
    heart valve problems present at birth, or caused by cardiac shunts or septal defects.


    # ## 2.4 Evolution of the Devices for Conventional Clinical Cardiac Examination


    Multiple devices have been used by physicians and paramedical experts to diagnose
    the existence of any heart defects or disease. Further, they continuously witness
    the evolution of these devices each year, in terms of size, accuracy, and specificity.
    This section discusses the very common devices used by the physicians and paramedical
    experts, and their brief history.'
