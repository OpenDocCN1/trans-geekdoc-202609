    The electrical activity of skeletal muscles was first noticed by Dr. Luigi Galvan,
    a physician in Italy, who pointed out that this activity could be recorded using
    electrical currents. In 1842, another physicist, Dr. Carlo Matteucci, found the
    electrical activity or


