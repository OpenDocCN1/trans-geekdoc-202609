    # ## 9.2 Two Prominent Applications


    In this second part of the chapter, we demonstrate the results of two innovative
    studies: the first for HF diagnosis, and the second for HF severity estimation
    based on NYHA classification and the prediction of adverse events. The results
    for the HF diagnosis are part of the Kardiatool project [101], and the results
    for the severity estimation and the prediction of adverse events are part of the
    Hearten project [102].


    # ### 9.2.1 HF Diagnosis


    # #### 9.2.1.1 The Data Set


    The data set for HF diagnosis consisted of 467 subjects (258 used as control subjects,
    180 subjects with chronic HF, and 29 with acute HF). The HF diagnosis classification
    problem is defined as classifying the 258 control subjects versus the 209 HF subjects.


    Data was provided by University College Dublin, National University of Ireland
    (409 patients), and the 2nd Department of Cardiology of the University Hospital
    of Ioannina (58 patients) as part of the Kardiatool project [101].


    For each patient, data from different categories were recorded. More specifically,
    they were grouped into the following categories: general demographic information,
    personal history of cardiovascular disease, drugs, classical cardiovascular risk
    factors, laboratory findings, clinical examinations, symptoms, physical examination,
    and echocardiographic features (Figure 9.3).'
