    PA pressures may not be useful in all cases of heart failure. For example, it
    is difficult to manage patients with advanced CHF with only the knowledge of PA
    pressure. In this case, the LA pressure or pulmonary capillary wedge pressure
    has proved to be helpful. Abbott, formerly St. Jude Medical/Savacor, Inc., Abbott
    Park, IL, developed the HeartPOD LA pressure sensor. This sensor consists of a
    lead with an antenna coil and is implanted through the femoral vein in the left
    atrium. The antenna is then connected to'
