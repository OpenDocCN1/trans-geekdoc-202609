  md: '# 9


    # Machine Learning Techniques for Predicting and Managing Heart Failure


    Dafni K. Plati, Evanthia E. Tripoliti, Georgia S. Karanasiou, Aidonis Rammos,
    Aris Bechlioulis, Chris J. Watson, Ken McDonald, Mark Ledwidge, Yorgos Goletsis,
    Katerina K. Naka, and Dimitrios I. Fotiadis


    # 9.1 State of the Art of Machine Learning Applications in HF


    In the first part of this chapter a brief definition of heart failure (HF) is
    presented along with the various classifications, evaluation, and diagnosis of
    HF. Moreover, an extended review of the state of the art of applications of machine
    learning (ML) in HF diagnosis, severity estimation, and the prediction of adverse
    events (mortality or rehospitalization) is demonstrated.


    # 9.1.1 Introduction


    # 9.1.1.1 Background


    According to the American College of Cardiology and the American Heart Association,
    HF “is a complex clinical syndrome that results from any structural or functional
    impairment of ventricular filling or ejection of blood” [1]. In simple words,
    HF is a chronic clinical syndrome, where the heart is unable to pump enough blood
    to deal with the systemic needs of the body [2]. It usually occurs because the
    heart has become either too weak or stiff.


    Most patients with HF have symptoms due to impaired left ventricular myocardial
    function [2]. Patients with HF deal with various symptoms that affect their quality
    of life: dyspnea, fatigue, exercise intolerance, fluid retention, pulmonary hypertension,
    or other heart conditions, such as an irregular heartbeat and heart valve disease
    [1].


    Although HF is the result of a number of problems affecting the heart, the predominant
    causes are the presence of myocardial ischemia (reduced coronary blood flow leading
    to reduced oxygen preventing the heart from functioning properly [3]) and high
    blood pressure (the risk for HF doubles in patients with blood pressure > 160/100
    mmHg [4]). Moreover, patients may have more than one causative factor for HF.
    Conditions that can lead to HF include [5, 6]:


    +   - Ischemic heart disease due to coronary artery disease

    +   - Toxic damage due to recreational substance use (alcohol, narcotics, steroids,
    heavy metals, medications,) and chemotherapy'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - Immune and inflammatory diseases

    +   - Infiltrative diseases such as amyloidosis or sarcoidosis

    +   - Metabolic causes (thyroid dysfunction, nutritional deficiencies)

    +   - Genetic abnormalities

    +   - Arrhythmias

    +   - Valvular and structural abnormalities

    +   - Hypertension [5]

    +   - Life style habits such as the lack of exercise, smoking, and obesity, can
    exacerbate an existing problem [6].


    HF is one of the most common causes of admission to hospital and is the cause
    of more than $30 billion spent in the US annually [7]. A total increase of 46%
    is estimated to be associated with more than 8 million adults with HF and can
    be compared to a global epidemic [8]. HF represents the primary cause of hospitalization
    in patients aged 65 years or older in the western world, and is accountable for
    more than 1 million hospitalizations per year in the US [8]. As presented in Figure
    9.1 the HF prevalence is a worldwide phenomenon [9, 10].


    HF imposes a significant burden on both patients and healthcare systems, with
    costly hospitalizations and high mortality rates [11, 12]. Hospitalizations due
    to HF represent 1–2% of all hospital admissions [13]. More than 20% of patients
    are rehospitalized within 30 days and up to 50% within 6 months [14], and 40%
    of patients die within a year of their first hospitalization [15]. Occurring more
    frequently in people over 65 [16], HF prevalence in the general population is
    estimated to be 4.2% [17]. Although HF is perceived as a disease of the elderly,
    studies have indicated that HF incidents are increasing in young people [18, 19].


    Therefore, there is a great interest in reducing hospital readmissions due to
    HF; attempts to achieve this take different forms, from the introduction of penalties
    on hospitals that exceed the expected readmission rates [20] to specialized decision
    models [21].


