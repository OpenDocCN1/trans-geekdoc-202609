    # 6.2.2.1 Supervised Learning


    Supervised learning refers to algorithms learning rules between a set of inputs
    and outputs using a labeled training data set (referred to as mapping) in order
    to predict outcomes for new inputs. The labeled training data set typically consists
    of predictor variables, features, and labeled outcomes (Table 6.1). Features refer
    to pieces of information that make up data and the quality, accuracy, and richness
    of features determine the overall effectiveness of supervised ML algorithms [7].'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'The aim in training a supervised ML algorithm is to optimize its generalizability
    such that the model defines the underlying relationship but not to the extent
    of introducing inadvertent bias from poorly curated data sets [1]. Hence, a variance–bias
    trade-off exists where variance refers to how well the model performs with new,
    subtly different data, and bias refers to how well the model fits to the training
    data [7]. Overfitting refers to a model with a high bias and a low variance: it
    is overfitted to the training data set such that it struggles to adapt to new,
    subtly different data. Obtaining large sets of reliably labeled data is often
    the hardest and most expensive aspect of creating supervised ML algorithms. It
    is important that training is monitored to ensure an optimal balance of bias and
    variance [7]. The most common tasks performed by supervised models include classification
    and regression.


    # 6.2.2.1.1 Classification


    Classification is used when the output of an ML algorithm is a categorical variable
    and involves classifying data points into one or more categories. Linear separability
    is a key concept underpinning this approach and refers to the notion of using
    a line or a plane to separate data (Figure 6.3). The line or plane separating
    data into classes is referred to as a decision boundary, and the area chosen to
    define a class is referred to as a decision surface (Figure 6.3). If a data point
    falls within a decision surface, it is assigned to that class.


    Support vector machines (SVMs) are commonly used technique in supervised classification
    ML algorithms and use hyperplanes to separate data points. An optimal hyperplane
    separates classes in a way that creates maximum separation between the different
    classes. SVMs are relatively straightforward but are less useful in analyzing
    more complex, multidimensional data. Instead, kernel methods are typically used
    for complex multidimensional data where samples cannot be linearly separated.


    # 6.2.2.1.2 Regression


    Regression is used when the output of a supervised ML model is a continuous variable;
    commonly used regression techniques include LASSO, rich regression, and elastic
    net


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'regression. LASSO regression is an important regularization technique which
    uses shrinkage to avoid a regression model being overfitted [5, 6]. Shrinkage
    refers to data points being shrunk toward the mean. It remains an important type
    of regression for models which include multiple factors that are correlated or
    have a high level of multicollinearity [7].


    # 6.2.2.1.3 Examples of Supervised Learning in Cardiology


    There are a growing number of studies applying supervised ML algorithms to cardiology,
    including in personalized medicine, imaging, and disease prognostication. Personalized
    medicine involves tailoring investigations, treatments, and predictions to individual
    patients, thereby minimizing reductionism. Reductionism refers to treating all
    patients with the same disease states identically, irrespective of their genetics,
    lifestyle, background, and determinants of cardiovascular health [6]. One aspect
    of precision medicine involves creating a digital twin of the patient which integrates
    genomics, wearable devices, electronic health records, imaging data, and other
    data points to create a simulated model of the patient that is updated in real
    time through statistical and mechanistic modeling [2]. Traditional cardiovascular
    risk models extrapolate risk from a sample population, inevitably ignoring subtle
    clinical confounders. In contrast, AI algorithms can personalize risk calculations
    by including complex and subtle clinical factors.


    One example is a study using supervised ML algorithms to predict 5-year all-cause
    mortality (ACM) in patients with supervised coronary artery disease (CAD) using
    cardiac computed tomographic angiography (CCTA) images [8]. Included in the development
    of this algorithm were 25 clinical and 44 CCTA parameters, and the algorithm was
    found to be superior to the Framingham risk score (FRS), segment stenosis score
    (SSS), segment involvement score (SIS), and the modified Duke index (MDI) in predicting
    5-year ACM (ML: 0.79 vs. FRS: 0.61, SSS: 0.64, SIS: 0.64, DI: 0.62; p < 0.001)
    [8]. Another example is a study that combined CCTA stenosis and plaque measurements
    to develop a supervised ML algorithm to predict myocardial flow reserve (MFR)
    [9]. In the study, 153 arteries in 51 patients undergoing CCTA were analyzed to
    build this composite risk score and the algorithm was found to be superior to
    quantitative CCTA stenosis in predicting MFR by 13N-ammonia PET scan (ML AUC =
    0.83, CTA stenosis = 0.66; p = 0.005) [9]. A similar multicenter trial evaluated
    a boosted ensemble ML algorithm built from quantitative CCTA measurements to predict
    lesion-specific ischemia [10]. In the trial, 254 patients underwent CCTA and invasive
    coronary angiography with fractional flow reserve (FFR) measurement in 484 vessels
    [10]. The ML algorithm had a superior area under the curve (AUC) of 0.84 compared
    with individual CCTA measurements (AUC: 0.76; p < 0.006) [10].


    Supervised ML algorithms have also been applied to other cardiac imaging modalities.
    A recent study used a combination of supervised and deep learning to develop an
    ML algorithm using 91,232 single-lead ECGs from 53,549 patients to classify a
    single ambulatory electrocardiogram (ECG) monitoring lead into 12 rhythm classes
    with an AUC of 0.97, when tested in an independent data set with a consensus committee
    of board-certified cardiologists [11]. In echocardiography, supervised ML algorithms
    have been developed to identify and classify different echo views, including one
    study successfully classifying 15 standard views with an accuracy of 91.7% after
    training the supervised ML algorithm on 267 transthoracic echocardiogram (TTE)
    studies [12]. This was in comparison to an average accuracy of 79.4% for board-certified
    echocardiographers'
