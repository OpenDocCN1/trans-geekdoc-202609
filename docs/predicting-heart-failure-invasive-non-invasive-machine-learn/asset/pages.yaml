  md: 'carboxylated aniline ratio of 1:4. Techniques such as cyclic voltammetry (CV),
    differential pulse voltammetry (DPV) and scanning electron microscopy (SEM) were
    used for surface characterization of the sensor. The linear range of sensor was
    in the range of 0.02 to 0.09 ng/mL, with the detection limit of 0.008 ng/mL [85].


    A new immunosensor based on bismuth citrate-modified graphite screen-printed electrodes
    (SPEs) has been fabricated for the voltammetric detection of CRP using quantum
    dots (QDs) tags in human serum by Kokkinos et al. The modified SPE was used both
    as a biological recognition element and as a QDs reader. Quantification of the
    target protein was achieved by the acidic dissolution of PbS QDs and anodic stripping
    voltammetric detection of released Pb(II). Determination was performed at bismuth
    nanodomains formed on the sensor surface during the electrolytic preconcentration
    step, as bismuth citrate was reduced to metallic bismuth simultaneously with the
    deposition of Pb on the surface of the immunosensor. The result was linear over
    the range 0.2–100 ng mL −1 CRP and the limit of detection was 0.05 ng mL −1 CRP
    in the optimum conditions [110].


    Nanoparticles (NPs) of commercial lipase from Candida rugosa, glycerol kinase
    (GK) from Cellulomonas species, and glycerol-3-phosphate oxidase (GPO) from Aerococcus
    viridans were prepared with a pencil graphite electrode (PGE) by Narwal and Pundir.
    The characterization of PGE before and after co-immobilization of enzyme nanoparticles
    (ENPs) was achieved by SEM, CV, and EIS. A linear relationship was obtained between
    a wide range (0.1 –45 mm) in the optimum conditions within 2.5s at a pH 7.0 and
    a temperature of 35 °C [159].


    In addition to these, there are other biosensors technologies such as fluorimetric,
    SPR, and chemiluminescence for the determination of CVD biomarkers. For example,
    in CRP analysis, fluorimetric biosensors can offer affordable and accurate analysis
    but their lower sensitivity is a drawback [167]. CRP is a significant biomarker
    in CVDs and is much studied. In a study, a chemiluminescence based biosensor was
    developed for CRP detection using and improving conventional enzyme-linked immunosorbent
    assay (ELISA) [168]. SPR biosensors are popular optical techniques and details
    of their applications on cardiovascular biomarkers such as cTnI and myoglobin
    are available in the literature [169, 170].


    # 3.5 Future Outlook


    Further research is needed to work on novel biomarkers and to offer multistrategy
    strategies for better early treatment protocols. The application of novel detection
    biosensors, such as electrochemical biosensors, piezoelectric biosensors, thermometric
    biosensors, and optical biosensors, is still in the developmental stages, and
    there is the potential for rapid growth. Turning these discoveries into clinical
    practice will be critical for reducing the incidence of CVDs. Point-of-care devices
    provide ease of application for patients and medical staff through user-friendly
    diagnostic and monitoring kits. User-friendly devices will likely become commonplace
    in the future. Smartphone health applications are attracting attention from scientists,
    focusing on their integration with apps and biosensor systems. Wearable sensors
    will also make life easier in the future and, thus, many patients’ lives will
    be saved thanks to the early detection of CVDs.'
