  md: 'of the physician to interpret the results correctly, which delays the treatment.
    This long time period during diagnosis sometimes results in the deterioration
    of the condition of the patient.


    Sensor platforms are required for early and accurate diagnosis of CVD. There are
    various sensor platforms based on the optical and mechanical properties of the
    bio- sensing materials. Electrochemical-based detection techniques are preferred
    due to their high sensitivity, reduced cost, and faster detection; electrochemical
    impedance spectroscopy (EIS) has exhibited excellent results in detecting low
    concentrations of many clinically important biomarkers used to diagnose CVDs.
    The application of bio- markers that can be recognized in blood has attracted
    many researchers’ interest recently in this area [17].


    The vascular wall discharges molecules into the blood, gives necessary information
    about the relevant pathological processes happening in the human system. The concen-
    trations of the released molecules provide potential information of different
    pathological processes and can act as biomarkers.


    An ideal cardiac biomarker has some characteristic features, such as strong clinical
    sensitivity, which are very specific in marking the target molecules. It is quickly
    released in the blood, leading to fast diagnosis, maintains a high elevation level
    for a longer dura- tion in the blood, and is able to assay quantitatively.


    A wide range of potential biomarkers need simultaneous analysis for the correct
    diag- nosis of CVD [18–20]. One research study reported a set of 177 plasma markers
    for the detection of CVDs [20].


    The quantification of biomarkers is required to detect CVD quickly and accurately
    to plan a proper strategy for the care of cardiac patients. Quick and reliable
    detection of these biomarkers helps physicians to distinguish between diseases
    that show similar symptoms. As the clinically significant sensing ranges of some
    important biomarkers have very low concentrations, they need highly sensitive
    assay methods.


    # ## 10.3 Different Types of Cardiac Biosensors


    There are various types of biosensor, as shown in Figure 10.2.


    # ### 10.3.1 Optical Biosensors


    Optical biosensors are very sensitive and efficient biosensors. They detect biomarkers
    by observing the variation in frequency, phase, amplitude, and state of polarization
    of the input light responding to the biorecognition processes. Optical biosensors
    make use of material properties for detection of CVD, such as colorimetry, fluorescence,
    luminescence, fibre optics, etc. [21]. ELISA (enzyme-linked immunosorbent assay)
    based biomarkers use optical properties of chromogenic reporters (Figure 10.3).
    These biomarkers give signals which are colorimetric, fluorogenic, or luminescent
    in nature. ELISA has been extensively used for cardiac marker detection [22–25].
    Research con- tinues into further miniaturization of the sensor platform without
    compromising on detection ability.'
