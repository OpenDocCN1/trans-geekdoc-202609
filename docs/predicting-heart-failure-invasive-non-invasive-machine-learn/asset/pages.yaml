  md: 'the use of smartphone applications and miniaturized devices; on the other hand,
    large-scale randomized trials are necessary to prove ECG reliability in home monitoring
    systems [28, 187–189]. In the study of Kotb et al. (2015), it is stated that ECG
    analysis plays a prominent role in lowering all-cause mortality and hospitalization,
    and in improving quality of life [182]. The highest HF prediction performance
    is observed for RPM trials including multiple monitoring parameters. Through these,
    early warnings of HF may be better recognized using efficient algorithms that
    analyze various sensor measurements [190].


    Another aspect of non-invasive remote monitoring is the adherence of HF patients
    in order to improve the efficiency of proposed trials. It is stated that most
    HF patients are older than 65 years [191]. Proposed RPM systems should be portable
    and easy-to-use for increased adherence. Ware et al. (2019) conducted a study
    to evaluate patient adherence to a remote monitoring program [192]. It is reported
    that the highest patient adherence is observed in older patients, while participation
    of younger patients decreased over time, indicating that older patients adapted
    better to remote monitoring system [3, 192]. There are several recommended systems
    for increasing patient adherence, such as the toilet-seat based cardiovascular
    monitoring system and the clothing-integrated sensor system, which do not require
    any effort from the patient to develop the habit of monitoring themselves [158,
    189].


    Non-invasive measurements are cheap and easy-to-apply. As a result, these modalities
    can be used in large number of patients. Beyond the effectiveness of the methods,
    these measurements encourage patients to make lifestyle changes and increase their
    sensitivity to healthcare, thereby increasing the life quality of HF patients.
    Two important questions for non-invasive RPM are which type of HF patients should
    benefit from remote monitoring and at with what frequency should the measurements
    be performed. Measurements on a daily basis are recommended for increasing the
    efficiency of monitoring systems, as relative changes in the measured data provide
    important clues about upcoming HF decompensation. The viable method for remote
    data analysis systems is that large numbers of patients with low HF severity should
    be encouraged to become involved in RPM with non-invasive measurements, and a
    smaller group of patients with severe HF should be directed to invasive measurement
    techniques.


    # 5.5 Conclusion


    In this chapter, we explained non-invasive and minimally invasive measurement
    techniques and summarized the results of emerging RPM systems to predict impending
    HF decompensation. The use of remote monitoring techniques employing non-invasive
    sensors helps to reduce all-cause mortality, HF-related mortality, and rehospitalization.
    With the advances in sensor technologies, these measurements can be performed
    by patients at home using smart devices and wearables. The data obtained can be
    monitored remotely by the clinicians, providing the opportunity to take precautions
    before serious symptoms are encountered. This also helps reduce the workload of
    hospitals and the economic burden of HF treatment in healthcare systems. The positive
    results of clinical trials with large numbers of patients show the high potential
    of non-invasive sensors for diagnosing HF.'
