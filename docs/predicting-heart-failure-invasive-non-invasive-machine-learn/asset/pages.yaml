  md: '# 13.6 Machine Learning for Improving Cardiac Health of HF Patients


    The advances in machine learning for biomedical applications have stimulated the
    use of wearables for continuous monitoring and abnormality detection [35]. The
    authors have worked on solutions to detect heart attacks amongst drivers using
    models trained on public databases (MIT-BIH ST Change Database) and a conventional
    machine learning model (support vector machine algorithm), showing an accuracy
    of about 97.4 % and 96.3 % in detecting ST-elevation myocardial infarction (STEMI)
    and non-ST-elevation MI (NSTEMI), respectively [72].


    The authors have also worked on another solution to continuously monitor the heart
    sound and use it to train the machine learning model on the 2016 PhysioNet Challenge
    database, consisting of different classes of heart sounds, to detect abnormal
    heart sounds with an accuracy of 97% [73]. There have been studies to use machine
    learning techniques to classify HF patients using the eight strongest derived
    predictors (age, creatinine, hemoglobin, weight, heart rate, systolic blood pressure,
    mean arterial pressure, and income) of mortality, these have shown much more promising
    classification of HF patients than conventional methods, in terms of prognostication
    and response to medications [74]. In the future, the life-saving LVAD for HF patients
    can be further improved in HF prediction, using machine learning techniques with
    the help of a miniature high-configuration low-power-consuming microcontroller
    (Figure 13.10).


    Machine learning techniques can be useful even in the management aspects of HF
    patients, e.g. identification of patients who might adhere to the prescribed medications
    or might need additional measures for treatment adherence. Machine learning approaches
    can also be utilized to identify HF patients at high risk for additional comorbidities
    (such as depression) or in remote HF monitoring systems to improve HF clinical
    outcomes. To protect implantable devices from cybersecurity assaults, effective
    machine learning approaches have been used. When compared with traditional methodologies,
    machine learning approaches have been successful in developing score models with
    improved measure estimates regarding the prediction of cardiac resynchronization
    therapy (CRT) responders.


    ECG-based wearables, such as the Apple Watch (Apple, Cupertino, CA), mobile ECG
    equipment, and temporary patches are all helping to advance ambulatory heart rhythm
    assessment (e.g. Zio patch from iRhythm Technologies, San Francisco, CA). Wearables
    can generate a multiple-lead ECG with a single touch, allowing patients to self-screen
    in the event of any symptomatic episode. As mentioned in section 13.4.5, machine
    learning models are used with AliveCor''s KardiaMobile, which combines cellphones
    as a mobile ECG monitor. In the iTransmit13 and iREAD14 tests, these wireless
    devices had 100% percent and 96.6% sensitivity and 97% and 94.1% specificity for
    AF detection, respectively, using machine learning models. Tison et al. in [76]
    trained a deep neural network using PPG heart rate recordings exhibited a sensitivity
    of 98.0% and specificity of 90.2% in detecting AF, compared to a 12-lead ECG-based
    analysis. The sensitivity and specificity'
