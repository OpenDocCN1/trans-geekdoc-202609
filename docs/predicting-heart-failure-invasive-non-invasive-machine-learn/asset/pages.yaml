  md: 'the physician makes the patient lie in four different positions (shown in Figure
    2.1): supine, upright, left lateral decubitus, and upright leaning forward [2].
    The physician should be looking for irregular murmurs or heart sounds and identifying
    their location, duration, intensity, and pitch. This will all help in diagnosing
    heart conditions. Although irregular murmurs or heart sounds are not always linked
    with underlying heart conditions, they can, however, in certain conditions be
    an early warning of heart diseases.


    # 2.2.4 Electrocardiogram (ECG)


    This ECG is generated by a method called electrocardiography, where several electrodes
    are placed on the patient''s heart, legs, and arms and monitor the pulses for
    around 10 minutes. The technique measures the electrical activity of each heartbeat
    resulting in an electrocardiogram that shows the heart''s functionality. The electrocardiogram
    generated during the electrocardiography technique is a graph that depicts the
    characteristic of voltage versus time of the heart''s electrical activity. During
    each cardiac cycle, these electrodes detect the minor electrical changes that
    occur as a result of cardiac muscle depolarization and repolarization. Several
    cardiac anomalies, such as cardiac rhythm disruptions (e.g. atrial fibrillation
    and ventricular tachycardia), insufficient coronary artery blood flow (e.g. myocardial
    ischemia and myocardial infarction), and electrolyte disturbances (e.g. hypokalemia
    and hyperkalemia) cause changes in the usual ECG pattern. An illustration of the
    ECG test is shown in Figure 2.2. An ECG test is required only if the patient has
    any risk factors, such as hypertension, or physical discomforts, such as angina
    or palpitations including irregular heartbeats or rapid heartbeats. Patients with
    an existing history of heart disease are required to do the ECG test. Moreover,
    healthy individuals with a family history of heart disease are advised to do the
    ECG test if they are going to begin any heavy exercise routine or heavy labor
    routine.


