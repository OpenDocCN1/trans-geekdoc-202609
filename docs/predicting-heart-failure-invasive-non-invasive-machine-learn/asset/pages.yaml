    # 13.3 Wearable Devices in HF Detection Application


    Consumer health technology has grown to an annual market of billions of dollars
    and almost 20% of Americans are now using wearable devices for fitness tracking
    applications [34]. The market of wearable devices is growing very fast and is
    expected to be more than $27 billion by 2026 [35]. These wearable consumable devices
    have increasingly become more sophisticated, accurate, and closer to medical-grade
    devices. They will allow more personalized and precise monitoring of the patients
    with HF along with more frequent and appropriate adjustment of therapy and care.
    Moreover, early detection and diagnosis of the disease can help in immediate intervention
    and save a significant number of lives. At present, patients with a history of
    HF are monitored within the clinic or hospital and remotely using implantable
    cardiac devices. Commercial off-the-shelf'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'devices like sphygmomanometers, left ventricular assist devices (LVADs), and
    ICDs are typically used for HF detection, risk assessment, and patient management
    [36]. On the other hand, wearable devices can be used in a similar way but on
    a much wider range of the population, with and without HF history, and the patients
    can be monitored from the clinic and hospitals when they are in a different setting.
    It is important to note that with the advancement in machine learning technology,
    it is possible to identify risk factors by utilizing the clinical data available
    from the wearable devices to categorize the patients into potentially higher risk
    groups and to ask them to visit hospital for advanced intervention or even implantable
    device placement to monitor high-risk group patients more precisely. The authors
    have done similar work [37], where they ranked features from the collected data
    using different feature-ranking techniques and then used the best-performing machine
    learning classifier to develop a scoring technique for early prediction of mortality
    amongst patients; similar work can be done using the data collected from wearable
    devices.


    # 13.4 Integrating Wearables Technology into the Healthcare System


    Different commercially available wearable devices can monitor steps, heart rate,
    oxygen saturation, blood pressure, and electrocardiogram (ECG) signals, which
    can help the clinician in decision-making and clinical intervention. Wearable
    devices typically, however, focus on predicting HF or cardiac arrhythmia with
    the help of clinicians. There is a limited number of devices available that can
    be used to automatically detect a clinical abnormality of the patient reliably
    without human intervention. Most of such devices are implantable devices; however,
    these devices are very expensive and only a few of them are available on the market.
    Therefore, a safe, reliable, and effective automatic system like a wearable device
    to keep track of patients'' cardiac health is very important. Different types
    of wearable devices in different form factors are shown in Figure 13.5. The name
    and specifications of the devices from the left to right (top row 1–5; bottom
    row 6–10) are:


