  md: 'These promising early studies highlight the utility of AI based technologies
    to detect and assess HF progression using wearable monitoring technologies. However,
    there remains substantial untapped potential for using novel ML/DL strategies
    to identify and predict HF risk using non-invasive remote monitoring devices,
    which warrants further large-scale multicenter trials to evaluate the clinical
    efficacy of AI enabled wearables for improved HF management (Figure 12.1).


    # 12.7 Future Outlook on the Use of AI


    Computational advances have led to the development of numerous AI approaches for
    clinical data analyses [114] to assist HF diagnosis and prediction (Table 12.1).
    Multiple ML/DL strategies with an accuracy of over 90% in classifying HF patients
    and predicting adverse events have been proposed. However, studies comparing the
    clinical efficacy of AI based HF prediction models with conventional diagnostic
    methods have shown mixed results. While some newer predictive models have shown
    improved performance over conventional methods in classifying and identifying
    HF patients [22], other studies have shown no improvement in predicting HF readmissions
    using ML compared to traditional statistical approaches [45, 115]. This discrepancy
    is due to the fact that the accuracy of AI approaches is greatly influenced by
    the availability of large amounts of data that can enable optimal feature extraction
    to efficiently identify patterns in underlying data. Indeed, it has been shown
    that, while AI algorithms provide good discrimination in identifying HF patients
    based on demographics and medical history, HF classification efficiency can be
    affected by the subtleties of the disease progression state (e.g. preserved ejection
    fraction, mid-range ejection fraction, or reduced ejection fraction) and variability
    in patient characteristics (e.g. age, gender) [22]. Yet, while novel ML/DL approaches
    continue to be investigated to address these challenges, improved AI strategies
    have shown promise in outperforming conventional regression models in predicting
    HF outcomes and have also demonstrated better accuracy in predicting mortality
    due to acute HF and HF with preserved ejection fraction [22, 116, 117].


    In parallel, remote monitoring devices have seen an uptick in the past decade,
    with the proliferation of low-cost vital sign monitors available for ambulatory
    real-time assessment of patients’ physiological state. From smartwatches, electronic
    finger-rings, and smart garments to dedicated wearable cardiac and muscle activity
    sensors, miniaturized medical grade ambulatory monitoring devices are readily
    available to assist patient care. Yet, there is sparse availability of devices
    that merge these two technologies and fully utilize the powers of AI and wearable
    monitors for cardiac disease management, in particular HF prediction.


    This technological gap in medical treatment strategies is expected to be bridged
    by the embedding of AI algorithms in wearable ambulatory devices, a transition
    that will enable superior classification and prediction capabilities of cardiovascular
    disease progression, thus accelerating the transition to precision medicine for
    all population groups. AI is expected to pave the way to precision medicine by
    providing patients with self-monitoring opportunities using affordable low-cost
    monitors, hence improving the general quality of life while also reducing the
    current healthcare burden of HF management [13,'
