    The echocardiogram is an ultrasound of the heart that provides moving pictures
    capable of identifying the structure and function of the heart. It is more effective
    and efficient than ECG for detecting heart disease. ECG mainly provides information
    on the rhythm of the heart and involves a lengthy procedure compared to the an
    echocardiogram which involves a quick test that can be done in 5 minutes. An echocardiogram
    helps to visualize the heart beating and pumping blood, and aids the identification
    of heart disease. Providing information about heart functioning by measuring heart
    rate and rhythm, ECG is the preliminary test for detecting heart problems; any
    abnormality found here demands further diagnostic tests like an echocardiogram.
    Moreover, defects in heart valves are often undetected by ECG and the echocardiogram
    is the more preferred method for detecting valvular heart diseases. The echocardiogram
    is more efficient, but expensive compared to ECG.


    # 2.5 Artificial Intelligence for Assisting Clinical Cardiac Examination


    Artificial intelligence (AI) is the ability of the computer to make human-like
    decisions based on previous learning to solve problems, recognize an object, or
    respond to languages. Currently, AI is widely used in various sectors, such as
    business, agriculture, and health. In recent years, the various AI methods such
    as machine learning and deep'
