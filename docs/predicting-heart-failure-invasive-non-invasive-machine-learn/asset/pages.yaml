  md: '# 9.1.1.2 HF Classifications


    The American College of Cardiology/American Heart Association guidelines (2013)
    have classified HF into two categories according to the measurement of the left
    ventricle ejection fraction (EF): HF with preserved (≥50%) ejection fraction (HFpEF)
    – the heart pumps blood normally but is too stiff to fill properly that leads
    to impaired filling of the chambers of the heart; and HF with reduced (≤40%) ejection
    fraction (HFrEF) – the heart is too weak to efficiently pump blood out of the
    left ventricle [1, 22]. Ejection fraction reflects the pump function of the heart;
    it represents the amount of blood being pumped from the left ventricle (the heart’s
    main pumping chamber) with each contraction and is expressed as a percentage.
    HF with mid-range or mildly reduced EF (HFmrEF) is an intermediate stage with
    an EF of 40–49%, that generally progresses either to HFpEF at 25% of cases or
    HFrEF at 33% of cases [23].


    The most common classification for HF severity is the New York Heart Association
    (NYHA) classification. The NYHA classification has been widely used for almost
    a century and was updated in 1994 [24]. It is a fundamental tool for stratifying
    the risk of HF and also determines if a patient is eligible for a clinical trial
    or if the type of medication and devices are appropriate [25]. It classifies HF
    into the categories shown in (Figure 9.2 [26].


    Depending on the time of onset, HF can be classified as acute or chronic. Acute
    HF can be defined as “the rapid onset or change of symptoms and signs of HF that
    requires urgent medical care” [5]. Furthermore, acute HF is a condition with an
    unfavorable prognosis and is characterized by high mortality and rehospitalization
    rates [27]. Patients who have stable HF for some time, without change in clinical
    status, are often said to have chronic HF [5].


    # 9.1.1.3 Evaluation and Diagnosis


    Due to the increased incidence and the large financial costs required to diagnose
    HF, the diagnosis and treatment of the disease are extremely critical issues.
    The diagnosis of HF can be difficult, especially in the early stages and there
    is not a single diagnostic test for HF. Furthermore, it might be particularly
    difficult to recognized and associate symptoms and signs in obese patients, in
    elderly people, and in patients who suffer from chronic lung disease and need
    to be assessed at each visit meticulously [16].


    Initially, clinical symptoms and signs are estimated by clinicians by performing
    a physical examination of the patient. Also, standard biochemical and hematological
    tests have to be requested. These tests include complete blood analysis, urinalysis,
    and a


    +   - Class I – HF does not cause limitations to physical activity. Ordinary activities
    do not cause fatigue or shortness of breath.

    +   - Class II – HF causes slight limitation to physical activity with symptoms
    such as fatigue and shortness of breath. Patients with NYHA class II show no symptoms
    at rest.

    +   - Class III – HF causes marked limitations of physical activity. Patients
    with NYHA class III show no symptoms at rest, but less than ordinary activity
    causes symptoms of HF.

    +   - Class IV – HF patients are unable to carry on any physical activity without
    HF symptoms and even have symptoms when at rest.


    Figure 9.2 NYHA classification. Based on The Criteria Committee of the New York
    Heart Association [24].'
