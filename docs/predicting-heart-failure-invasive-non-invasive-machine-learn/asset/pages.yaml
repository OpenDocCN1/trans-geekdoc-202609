    # 13.4.3 Wearable Devices for HF Prognostic Application


    It was reported from a study of 50 patients with HF that the step-counts for two
    weeks can significantly differentiate New York Heart Association classes [39].
    This cohort used accelerometer data to monitor the physical activity during HF
    as a prognostic measure. Another retrospective study [40] on 189 patients with
    self-reported HF showed that physical activity has a significant relation with
    HF-related mortality. This study was also carried out using accelerometer data.
    A similar prospective study was done on 170 Japanese HF patients, which showed
    that activity data acquired through the wrist-worn devices were associated with
    mortality; in both the studies randomized controlled clinical trials and physical
    activity monitoring using the smartwatches were used for epidemiological investigation
    (e.g. increased aerobic capacity and better health-related quality of life) [41].
    Regular, daily physical activity can lower the risk of heart disease as, primarily,
    it can help to control weight and reduce the chances of developing other straining
    heart conditions such as high blood pressure, high cholesterol, and type 2 diabetes
    [42, 43]. Although it can be summarized from these studies that that wearing devices
    for HF prognostic application has a strong relationship with reducing HF-related
    mortality, to the best of our knowledge, there is no clinical HF-related service
    available yet in the world to routinely use the wearables to assess the patient
    activity.


    # 13.4.4 Monitoring Blood Pressure


    Hypertension is one of the major causes of HF. Clinical therapy has mostly been
    offered based on a single assessment in the clinic or in home visit by the clinicians.
    In general, wearable devices still lack reliability in measuring blood pressure;
    however, the Omron™ HeartGuide (Figure 13.8) has met the American National Standards
    Institute criteria for measuring blood pressure and such wearable devices can
    be used to monitor potential HF patients and also the implication of therapeutic
    treatment on blood pressure.'
