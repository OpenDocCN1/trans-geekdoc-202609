  md: '# 3.6 Conclusion


    Coronary and peripheral artery disease, congenital heart disease, heart failure,
    hypertension, and stroke are responsible for an extremely high mortality rate.
    CVDs are known as the most common disease in the world. The use of cardiac biomarkers
    is one of the best tools for early diagnosis of the disease, monitoring the disease
    stage, determining the treatment protocol, and so on. Early-stage biomarkers of
    CVDs can potentially save many lives and help to fight against CVDs in clinical
    trials. Troponin I, CRP, and lipoproteins (LDH, HDL) are evaluated traditional
    biomarkers, and these types of biomarker biosensors have developed extensively
    in the last 10 years.


    Biosensors are obtained from a combination of biological affinity material and
    transducer. The analyte is recognized from the bioreceptor, analyzed with a transducer,
    and then evaluated after signal processing. In this chapter, cardiovascular biosensors
    have been evaluated under five different subtitles. Electrochemical biosensors
    are widely used for the determination of cardiac biomarkers. The advantages and
    challenges of biosensors are evaluated within the framework of short- and mid-term
    related healthcare applications.


    The many current biomarkers are used clinically for the detection of last-stage
    disease. The discovery of new potential biomarkers for CVDs along with current
    ones has increased the importance of fully validated cardiac biomarker biosensors
    and has led to new approaches for CVDs-based research.


