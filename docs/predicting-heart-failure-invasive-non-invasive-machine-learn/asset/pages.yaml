- pgno: 169
  md: '# 7


    # Utilizing Data Mining Classification Algorithms for Early Diagnosis of Heart
    Diseases


    Ahmad Musa Altamimi and Mohammad Azzeh


    # 7.1 Introduction


    Great attention has been paid to medical research to identify heart disease. Heart
    disease diagnosis is based on the patient''s signs and symptoms and is affected
    by several factors such as cholesterol level, blood pressure, obesity, smoking
    habit, and other factors [1]. This creates a challenge to provide quality services
    with low costs. Quality service involves diagnosing patients properly to get effective
    treatments. According to the World Heart Federation and the World Health Organization,
    heart diseases are top of the list of various life-threatening diseases, taking
    around 17.9 million lives each year [2]. However, 90% of those deaths were estimated
    to have been preventable if patients had been correctly diagnosed early and had
    improved their habits [3].


    In traditional healthcare environments, diagnosing heart diseases is done in the
    conventional way, whereby physicians review the symptoms and order some tests,
    such as blood tests, electrocardiogram, and echocardiogram. However, this conventional
    way leads to uncertainty of diagnosis, which in turn produces complicated therapy
    and more medical costs. The misdiagnosis results from many physicians not following
    the known guidelines for evaluating and managing heart failure [4]. Therefore,
    the high rates of inaccuracy reported in different studies are not surprising
    [5].


    The core element for treatment success is a reliable and precise diagnosis. Expert
    systems [6] could be applied to emulate the ability of experts to answer not only
    simple questions like “What is the average age of patients who have heart disease?”
    or “Identify the patients who have been treated for heart diseases and complaining
    from other diseases” but also complex ones like “Given patient records, predict
    the probability of patients who will be diagnosed with a heart disease?”or “Find
    the most significant risk factor that results in a heart disease?” Using such
    systems could decrease medical examination errors, reduce practice variation,
    and enhance diagnosis outcomes.


    The main use of machine learning algorithms is to discover huge volumes of data
    by detecting patterns and summarizing data into a format that can be understood.
    Three main data mining techniques can classify previously unorganized data into
    predefined'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'classes or categorize new data into pre-existing categories: examining previously
    classified data, learning the classification rules, and applying these rules to
    new data. The same process is also used to identify relationships between them
    and to develop a pattern of these relationships. These patterns can be then used
    as a reference for predicting future behavior. Surveys such as those by Abdelrazek
    et al. [7] and Ranjan et al. [8] investigated the impact and power of machine
    learning algorithms in predicting systems.


    In this chapter, we focus on data mining classification techniques for predicting
    heart diseases. Five classifiers (Naive Bayes (NB), support vector machine (SVM),
    random forest (RF), decision tree (DT), and linear discriminant analysis (LDA))
    have been used to analyze a medical data set recorded to diagnose cardiovascular
    diseases. The data set used in this study has 14 clinical attributes with a different
    full-size training set. Multiple evaluation measures have been used to compare
    each classifier’s performance: the accuracy, the sensitivity, area under the curve
    (AUC), and specificity. For this, several experiments have been conducted. Results
    reported that SVM and NB outperform other classifiers with an accuracy rate above
    80% and a large AUC, providing a more effective and comprehensive forecasting
    mechanism. We believe that these models can be integrated with medical information
    systems to assist in diagnosing heart diseases in the earlier stages.


    The rest of the chapter is structured as follows. Previous studies are discussed
    in Section 7.2. Section 7.3 presents various classification algorithms. Section
    7.4 discusses the research methodology, and the results and discussions are given
    in Section 7.5. Finally, the conclusions and future works are introduced in Section
    7.6.


    # ## 7.2 Previous Studies


    Many data mining investigations have been carried out for diagnosing heart diseases
    [9–11]. In this context, researchers have applied different machine learning algorithms,
    such as the association rules technique, clustering, and classification algorithms,
    to extract significant patterns for predicting heart diseases with good levels
    of accuracy. The association rules mining technique, for example, has been utilized
    in many works to find frequent items among large patient data sets to diagnose
    the presence of heart diseases. Panda and Dash [12] and Ordonez [13] used association
    rules to build a model for determining relations amongst patients’ attributes
    values in order to discover interesting relations between variables in the data
    set. Others have followed the same principle with little modification in their
    models. Ahmed and Hannan [14], for instance, optimized the association rules in
    the case of a huge generated set to save prediction time and avoid unwanted rules,
    while Jabbar et al. [15] proposed a new approach based upon sequence number and
    clustering a small amount of data at a time to produce scalable and efficient
    prediction of heart diseases. Soni et al. used an integrated approach of association
    and classification to discover and then use rules in the database, to construct
    an efficient classifier [16]. However, in Moreno et al.’s study, while association
    algorithms were successfully applied for prediction in the health area of interest,
    they also discovered a large number of rules (some of them of no interest); in
    addition, the performance of association algorithms was generally low [17].'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'On the other hand, in Karegowda et al.''s study [18], clustering was employed
    to partition patients data into a set of meaningful clusters, each of which discovers
    the overall distribution pattern and correlations among the data attributes, thus
    helping practitioners to understand the natural grouping of patients'' data in
    order to diagnose the presence of heart diseases correctly. However, clustering
    is very expensive for processing large data sets, so it is better used as a preprocessing
    step enabling other classification algorithms to get insights into the data distribution.
    That being said, clustering techniques have been applied to discover hidden patterns
    with reference to heart patients. Some studies have used K-means to group and
    extract data relevant to heart disease [19, 20]. The maximal frequent itemset
    algorithm (MAFIA) has also been applied to discover heart attack predictions rules
    [20]. It is important to mention that many clustering algorithms in the literature
    were implemented with a tool called Weka [21], a set of algorithms and tools used
    for preprocessing data, classification, clustering, and visualization. However,
    the main drawbacks of such methods are that they do not work well with dense data,
    it is difficult to predict the number of clusters, and, in the case where different
    initial partitions are chosen, different final clusters will be produced [22,
    23].


    The genetic algorithm was also used by Masilamani et al. [24] to get the optimal
    subset amongst patients'' attribute values adequate for heart disease prediction.
    The genetic algorithm''s global optimization benefit was also used by Amin et
    al. [25] to implement a hybrid system for initializing neural network weights
    based on a set of risk elements such as hypertension, high cholesterol, obesity,
    and others. In another system [26], a layered neuro-fuzzy approach produced a
    very low error rate in predicting heart diseases.


    Classification methods have been extensively applied in developing prediction
    models for heart diseases. Popular classification algorithms such as SVM, DT,
    NB, and neural networks (NNs) have been used in this context. Mixed results were
    presented in Xing et al. [27] and Peter and Somasundaram [28] when these algorithms
    were employed to develop prediction models. For instance, Xing et al. [27] used
    SVMs, NNs, and DTs with 502 cases. Their experiments showed that SVM was the best
    prediction model, followed by NN. In contrast, other studies proved that the NB
    produced more accurate predictions than other popular algorithms such as DT and
    NN [28]. Furthermore, another study reported that NN was recognized as the best
    prediction model with 15 prominent features as risk factors in the literature
    [29]. The hybrid intelligent technique binds to NNs in Chitra and Seeninivasagam
    [30] to produce a prediction model to improve prediction accuracy. The results
    show that the hybrid intelligent technique offer improvement in terms of accuracy.


    Recently, Toughui et al.''s study [31] compared multiple machine learning algorithms
    implemented in the following tools: RapidMiner, Orange, MATLAB, Knime, Weka, and
    Scikit-Learn. The results showed that MATLAB was the best tool.


    After reviewing the classification related literature, we were motivated to use
    the classification algorithms to develop a heart disease prediction model based
    on a clinical data set. Our work is different from the works presented above in
    two ways: firstly, five classifiers were applied to analyze medical data sets
    with different sizes; secondly, extensive analysis has been conducted using the
    MATLAB tool. The simulated implementation produced a very low error rate when
    calculating the prediction''s accuracy.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 7.3 Choice of Machine Learning Algorithms


    The healthcare environment generally includes rich data about patients and their
    treatment stored in health management systems. Such data is valuable, especially
    if we transfer the existing information into good practices. Machine learning
    algorithms are widely used to extract valuable knowledge from hidden relationships
    and trends among the data. In fact, machine learning algorithms have been extensively
    used in healthcare research as a stage of the knowledge discovery process [32],
    which presents favorable ways to discover the hidden relationship in the health
    data [33]. They have been applied to a diversity of healthcare domains to improve
    and accelerate decision-making [32]. Classification methods are the most widely
    used algorithms in the healthcare sector as they help predict patient status by
    classifying patient records to find the class that matches the new patient record
    [3]. Classification is a supervised learning technique, which requires the data
    to be initially labeled [33]. These data are the entered into a classification
    algorithm to be learned, as shown in Figure 7.1, to discover the relationship
    between input variables and the target variable. In this phase, the classification
    algorithms build the classifier from the training data. Each observation that
    forms the training set is referred to as a class label. When a new case is received,
    the constructed classification algorithm is used to classify it into one of the
    predefined labels, as shown in Figure 7.2.


    In the literature, many classification algorithms are used for healthcare data
    sets. Among them, we have chosen five common machine learning algorithms that
    are widely


