    module called Philips health watch, which can detect bradycardic and tachycardia
    with a sensitivity of 85% and 99%, respectively [49]. The E4 wristband from Empatica
    Inc. (Boston, MA) has a smart application that can discriminate AF from atrial
    tachycardia and flutter, and premature ventricular contractions with an accuracy
    of 0.8 using a machine learning algorithm [49]. These devices have received clearance
    from the US FDA.


    A significant increase in the interest in remote monitoring of cardiac and coronavirus
    disease (COVID-19) patients and their hemodynamic monitoring was reported in patients
    with implantable sensors and wearable ECG sensors for detecting AF using off-the-shelf
    solutions HeartLogic™ and CardioMEMS [45].


    # 13.4.6 Technology in Development for Early Detection of HF Decompensation


    ZOLL µCor is a patch-based ECG monitor using a radiofrequency sensor and transmitter
    to measure pulmonary fluid content in the heart and was assessed for predicting
    HF decompensation in a clinical trial [1]. Several electrodes were embedded in
    the textile to measure heart rate, heart rate variability, respiration rate, and
    cardiothoracic impedance with a device-level algorithm using HeartLogic [50].
    A smart sock was proposed by [51] to monitor edema and activity using the accelerometer
    and stretch sensor, which showed high accuracy in measuring ankle circumference
    and activity for a healthy cohort.'
