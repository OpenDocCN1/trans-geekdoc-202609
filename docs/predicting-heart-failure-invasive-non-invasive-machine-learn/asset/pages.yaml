- pgno: 69
  md: '# 3.3 Types of Biosensors for Cardiovascular Biomarkers Detection


    # 3.3.1 Electrochemical Biosensors


    The basic principle of electrochemical biosensors is based on the generated electrical
    signal resulting from the electrochemical redox reaction between the biorecognition
    element and analyte [36]. The analyte concentration is directly proportional to
    the measured electrochemical response, which allows the quantitative analysis
    [37]. Three electrode electrochemical cell systems can use various transducers
    based on voltammetric, potentiometric, conductometric, and impedimetric techniques
    [38].


    Electrochemical biosensors are label-free, affordable, easily applicable, and
    highly sensitive with a low limit of detection (LOD) value, and offer accurate,
    rapid, and robust analysis [39, 40]. They are also easy to miniaturize and apply
    to devices that use small sample volumes to detect more than one analyte simultaneously
    [37, 40]. Electrochemical biosensors include the following:


    Amperometry-based electrochemical biosensors measure the current flow changes
    at a constant potential, and they are the most widely used biosensors [36, 38].
    They are suitable for mass production, and provide more sensitive analysis than
    potentiometry-based biosensors [38].


    Voltammetry-based electrochemical biosensors determine the current change as a
    function of the applied potential. They are highly specific, sensitive sensors
    with noise-free and reproducible measurements [37, 41].


    Potentiometry-based electrochemical biosensors’ measurement principle is based
    on the potential difference at a zero current flow [38]. They are used for the
    determination of both ions and biological molecules [42].


    Impedance-based electrochemical biosensors focus on the changes of resistance
    and capacitance generated by various biomolecular interactions between proteins
    or antigen and antibody etc. [36, 42].


    Conductometry-based electrochemical biosensors focus on electrical conductivity
    changes, but are not widely preferred for enzymatic analysis [36, 38].


    # 3.3.2 Piezoelectric Biosensors


    Piezoelectricity is the ability of some materials to produce an electric potential,
    charge, or field after mechanical stress [38, 43]. Crystals and certain ceramics,
    such as bone, quartz, lithium niobate, polylytic acids, zinc oxide, aluminum nitride
    and phosphate, and polyvinylidene fluoride, are examples of the most common piezoelectric
    materials [41, 43, 44]. In a piezoelectric biosensor, biorecognition material
    is immobilized on the piezoelectric surface that consists of a gold electrode
    coated quartz crystal. When an electric potential is applied due to the interaction
    between analyte and biorecognition material, an elastic deformation and mass change
    occur, resulting in a mechanical vibration effect [38, 42, 43]. The frequency
    of oscillation and crystal mass are related, and increased mass due to analyte
    absorption can cause a change in the oscillation frequency [38]. Quantitative
    determination with piezoelectric biosensors is based on the ratio between analyte
    amount and oscillation frequency [44].'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Piezoelectric biosensors are advantageous because they offer easy, rapid, label-free,
    and low-cost analysis [41]. Nonetheless, issues about the regeneration of crystal
    surface, incubation time, and multiple immobilization steps may cause setbacks
    [41]. Piezoelectric biosensors are used to determine a wide variety of materials,
    such as drugs, pesticides, nucleic acids, bacteria, proteins, pesticides, etc.
    [45].


    # 3.3.3 Thermal/Thermometric Biosensors


    Thermal biosensors are not very commonly used biosensors. In thermal biosensors,
    a reaction that results in heat production or absorption occurs between the biorecognition
    element and the analyte [42]. A thermistor is used for the measurement of temperature
    changes. It is highly sensitive and can detect changes between 0.0001 and 0.05
    oC [38]. Thermal biosensors are able to measure concentrations as low as 10^-5
    M without frequent recalibration [36, 38]. However, they do not show sensitivity
    for electrochemical and optical characteristics of the analyte [38].


    # 3.3.4 Optical Biosensors


    Optical biosensors are biosensors whose transduction principle is based on optical
    processes. The interaction between analyte and biorecognition elements is changed
    into an output signal by optical transducers [46]. The measurement of the change
    in optical characteristics of materials such as polarization, amplitude, frequency,
    and radiation phase is used for quantitative determination [47]. Changes in the
    optical characteristics resulting from the molecular interactions between biological
    elements affect the measured output signal. For example, luminescent biosensors
    focus on the changes of luminescence related to the produced radiation due to
    the biomolecular interaction [47]. Optical biosensors can be either label-free
    or fluorescent-based. In fluorescent-based biosensors, the labeling of biomarkers
    with fluorescent tags provides a highly sensitive analysis. On the other hand,
    fluorescent signal bias is considered an issue [44]. Label-free biosensors are
    capable of rapid and real-time analysis with an ultra-small sample volume [42,
    44].


    Optical biosensors can employ different techniques such as surface plasmon resonance
    (SPR), surface plasmon resonance imaging (SPRi), localized surface plasmon resonance
    (LSPR), surface-enhanced Raman scattering (SERS), laser light scattering, reflection
    spectroscopy, and chemiluminescence, etc. [38, 47]. All of them have their advantages
    and disadvantages. Which is preferred is based on the analyte and characteristics.


    Nevertheless, SPR is considered the most effective and most preferred technique
    which is affordable and highly selective with the ability to detect various interactions
    [37, 48].


    Optical biosensors offer significant advantages over other biosensors: in addition
    to being highly selective, they are sensitive and biocompatible, provide a minimally
    invasive method for in vivo applications, and overcome the electromagnetic interference
    issue [42].


    # 3.3.5 Wearable/Implantable Biosensors


    Biosensor technology is one of the most popular areas continuously being developed
    and studied intensively. In addition to biosensors’ existing advantages, research
    and'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'studies to improve traditional diagnosis and health monitoring methods have
    recently developed wearable/implantable biosensors. [49]. Both wearable and implantable
    sensors provide continuous and remote monitoring for patients without clinical
    procedures [50]. Implantable biosensors are implanted in the body, while wearable
    biosensors are worn on the body, such as in clothes, contact lenses, watches,
    rings, etc. [51].


    In classical biosensors, pretreatment steps are often required after sampling,
    and carrying the samples near the devices/sensors is also required. Although the
    wearable/implantable biosensors utilize the same transducers as classical biosensors
    such as optical, electrochemical, and thermal, miniaturization and wearability
    are the features that make them differ from other biosensors. These new technology
    biosensors offer unique advantages over other classical biosensors: real-time
    and continuous data acquirement, saving money and time, reducing the waste of
    disposable medical materials, and more efficient and quality measurements [52].
    Increases and changes in patients’ and professionals’ healthcare demands have
    also been significant in developing this type of biosensors. Wearable/implantable
    biosensors, which can also be integrated with devices such as smartphones, can
    evaluate the data they measure and provide information to emergency services or
    patient relatives in critical situations (Figure 3.3) [53]. They are used in CVDs
    to detect heart rate, electrocardiography, and blood pressure [53].


    However, some potential technical issues include biocompatibility, biofouling,
    errors in measurements with small volume samples, and challenges with analysis
    of saliva, tears, and sweat [49]. Analysis of biological fluids has always been
    challenging because of the complexity of the medium. Clinical tests based on blood
    samples are reliable but involve invasive strategies that can be uncomfortable
    for patients. Saliva, tears, and sweat are examined as non- or minimally invasive
    biosensor options for diagnostics. Problems such as contamination of saliva samples
    with foods and the presence of several metabolites with concentration correlation
    issues – although they can be detected in sweat samples – demonstrate the improvement
    requirements for wearable sensors [49].


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_71_0.png)


    Figure 3.3 Application of wearable/implantable biosensors for healthcare monitoring.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 3.4 Applications of Biosensors for Cardiovascular Research


    In the last decade, various electrochemical studies investigated the biodetection
    of biomarkers related to CVDs. Some of these studies examined the biosensor, nanomaterial,
    molecularly imprinted polymers, and aptamer-based approaches, while others focused
    on methods of detecting cardiac biomarkers. Reviewing recently published studies
    on different aspects of electrochemical methods, there is considerable research
    on the application of electrochemical techniques to detect cardiovascular biomarkers.
    Table 3.2 provides extensive information on electrochemical biosensing of cardiac
    biomarkers and diverse electrode modification techniques.


    Chi and co-workers have developed a label-free photoelectrochemical (PEC) immunosensor
    using a CdS:Mn sensitized graphene (G)/Cu2MoS4 composite detection probe for the
    quantification of cTnI. The superior sensitivity of the immunosensor and the large
    electrochemical behavior of G/Cu2MoS4 allowed cTnI to be determined effectively.
    Consequently, cTnI was found at a concentration of 0.18 pg. mL−1 in phosphate
    buffer conditions [60]. Nandini et al. also reported an electrochemical biosensor
    based on nanohybrid containing functionalized graphene oxide modified graphite
    electrode for cholesterol biosensing. The proposed Gr/GO-SH/ AuNs/CHOx shows a
    detection limit of 0.2 nM with a linear range from 0.05 mm to 11.45 mm. Conclusively,
    the proposed sensor has been effectively applied for the determination of cholesterol
    in real samples [93]. In another study, Tertis et al. presented a sensitive and
    selective multipulse amperometric sensor for the determination of interleukin
    6 in human serum based on AuNPs and PPy-NPs. The linear concentration range for
    interleukin 6 was from 1.0 pg.mL−1 to 15 μg.mL−1 with the detection limit (S/N
    = 3) of 0.33 pg.mL−1 at the optimized conditions (0.1 M Tris–HCl, pH 7.2) [122].
    In the electrochemical aptasensor suggested by Taghdisi et. al, the detection
    was based on the Y-shaped structure of DApt-CS conjugate using screen-printed
    gold electrodes (SPGEs). Differential pulse voltammetry displayed that the aptasensor
    is able to find out 27 p.m. of myoglobin in a linear range of 100 pM-40 nM. The
    results demonstrated that the DApt-CS-modified electrodes show excellent selectivity,
    accuracy and are very selective in myoglobin determination [141]. These comb structured
    gold microelectrode arrays (CSGMs) were characterized using electrochemical techniques
    by Kongsuphol et al. The resulting biosensor was used for the detection of TNF-α
    under optimum experimental parameters. TNF-α was measured and allowed the LOD
    of 1.0 pg.mL−1 by using cyclic voltammetry (CV) and electrochemical impedance
    spectroscopy (EIS). Finally, this CSGM/Magnetic beads/ Ab sensor can achieve a
    dynamic range between 1 and 1000 pg.mL−1 from non-diluted serum samples [155].


