  md: '# 10.5.2 Internet of Things


    The internet of things (IoT) comprises a network of physical devices, buildings,
    vehicles, and other objects embedded with electronic components, software, sensors,
    and network connections to collect and exchange data. IoT can drastically transform
    the way healthcare services are provided today and can provide fast medical services
    in remote areas where there is no immediate medical help available. In the case
    of CVDs, where timely medical help is highly essential to save patients’ lives,
    IoT can be a great benefit, effectively sending data received from the patient
    to remote physicians who can access it and can monitor patient’s physical status
    in real time.


    In cardiovascular medicine, collected data related to blood pressure, ECG, and
    SpO2 can help the physician to diagnose and prescribe the necessary treatment.
    It will reduce hospital visits as well as hospitalization costs. IoT techniques
    along with real-time analytical algorithms can be instrumental in sending pre-warnings
    to patients about possible cardiac attacks.


    Wearable sensors combined with ML analytics can improve clinical outcomes and
    significantly reduce hospitalizations in cases of heart failure [39–41].


    # 10.5.3 DL and ML


    ML offers a set of new algorithms and tools for the construction of inferential
    and predictive models which are driven by data [34, 42]. Figure 10.7 gives an
    overview of the ML


