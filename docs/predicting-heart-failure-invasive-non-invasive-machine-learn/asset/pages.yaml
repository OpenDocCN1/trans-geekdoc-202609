    Echocardiogram devices were first introduced in 1950, when the first M-mode echocardiography
    was developed by two physicists in order to study mitral stenosis and its diagnosis.
    Their work inspired many cardiologists, as they carried out their work to develop
    Doppler, two-dimensional (2D), contrast, and transesophageal echocardiograms.
    The echocardiogram was inspired by stethoscopes, and actually enables users to
