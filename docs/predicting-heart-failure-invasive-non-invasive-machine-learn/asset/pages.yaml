    are arranged. It uses predefined grammatical rules to test whether a sentence
    string conforms to these set rules [38]. Examples of its current applications
    in cardiology include extracting information from clinical notes, radiology reports,
    and pathology reports.


    # ## 6.3 Steps in Building an AI Algorithm


    Building a clinically meaningful and effective ML algorithm is a multifaceted,
    complex process, and requires the input of a multidisciplinary team with diverse
    skills and talents. Most notably, clinicians are at the forefront of delivering
    healthcare and are most in tune with the problems arising in clinical care. However,
    clinicians often lack the technical capabilities to develop and test ML algorithms
    and thus require data scientists. The process can be broken down into six steps
    (Figure 6.6) [1]. The first is identifying the problem and often requires multidisciplinary
    input from clinicians, data scientists, data engineers, patients, and other stakeholders
    [2]. The second is collecting the appropriate data with features and labels of
    interest; this is often the most time-consuming and expensive aspect. The third
    is preparing the data through a combination of feature selection and feature engineering
    [4]. This step is closely linked with the next step, as the type of ML algorithms
    that can be used is often dictated by the type, quality, and preparation of the
    data. The fifth step involves developing and building the ML algorithm using a
    training data set. The final step is validating the ML algorithm through a process
    of internal and external validation using independent and separate data sets [7].


    # ## 6.4 Limitations, Challenges, and Opportunities


    It is important to appreciate the challenges associated with AI, and these can
    be broadly divided into limitations relating to existing research, limitations
    inherent with AI technology, and challenges in clinical translation.


    # ## 6.4.1 Limitations of Existing Studies


    Most studies thus far employ narrow AI and apply ML algorithms to predefined and
    preselected variables with parameter adjustments in testing cohorts to obtain
    a good'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_164_0.png)


    **Figure 6.6** Steps in building AI algorithms in cardiology.


    performance. Hence, the bulk of ML algorithms have been studied on retrospectively
    collected and curated data. The major limitation with this approach is the obvious
    risk of developing models that are overfitted to the target data that do not generalize
    well to previously unseen external data. There are also the inherent biases which
    are inadvertently introduced into algorithms that are built and validated solely
    on retrospective, single-center data. ML algorithms require large data sets, and
    therefore subtle biases are introduced, such as a lack of diversity leading to
    unintended downstream consequences of the algorithms being inherently skewed to
    identify the dominant types of patients contributing to the model development.
    Another related limitation is the lack of existing frameworks and guidelines in
    conducting AI research. This lack of data set, methodological, and reporting standardization
    leads to an inability to comprehensively evaluate for methodological bias in analyses,
    and often masks biases. Moreover, this makes institutional cross-collaboration
    more difficult.


    The natural next step is to study these ML algorithms on external data sets, not
    involved in model development, in a multicenter prospective study design. These
    future prospective studies will need to evaluate patient outcomes and treatment
    pathways.


    # 6.4.2 Pitfalls with the Technology


    As with all technologies, AI remains susceptible to privacy, security, and data
    breach concerns. Patient data used for algorithm development need to remain de-identified
    and handled with care. Another unique limitation is the black-box phenomenon,
    which a lot of ML algorithms suffer from. This refers to the notion that certain
    ML'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'algorithms, such as deep learning, are inherently opaque where there is a lack
    of clarity as to how the algorithm processes input data to generate outcomes.
    This adds to the complexity and difficulty in being able to rigorously critique
    the methodological validity of ML algorithms. Without this insight, it becomes
    increasingly difficult to sense-check an algorithm to see if it is in line with
    real-world observations. An example of this is in risk prediction ML algorithms,
    where it is important to understand why the algorithm has classified a patient
    as high risk to help tailor interventions appropriately.


    # 6.4.3 Challenges in Clinical Translation


    The novelty of AI algorithms and the lack of prospective, multicenter randomized
    trials mean that large gaps in evidence exist currently. Most notably, the clinical
    translational ability of ML algorithms remains relatively unknown, with the practical
    difficulties of deploying such technologies in real-world clinical practice still
    not fully investigated. Important considerations include the cost-benefit analysis,
    the risks of false-positives, and the longer-term clinical outcomes of AI technologies
    compared with current clinical standards of care. At present, in accordance with
    the Food and Drug Administration, diagnostic software tools are classified as
    Class 2 (medium risk devices). If ML algorithms are to be used to guide treatment
    in addition to diagnosis, they would require a further level of evidence and validation,
    potentially enabling them to be classified as Class 3 medical devices.


    # 6.5 Conclusions


    +   - Clinical decision-making is reliant on synthesizing high-quality data to
    help solve patient problems. As the amount of available patient data increases,
    it is likely clinical decision-making will be augmented by AI techniques in the
    future.

    +   - AI offers the potential to summarize and synthesize this growth of patient
    data to potentially guide individualized therapy.

    +   - There is a large variety of ML approaches that can be employed as detailed
    in this chapter. The most appropriate algorithm choice will be guided by the research
    question and the type of data available.


