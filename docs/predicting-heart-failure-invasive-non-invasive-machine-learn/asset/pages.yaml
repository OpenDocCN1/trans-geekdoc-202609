  md: '# 10

    Clinical Applications of Artificial Intelligence in Early and Accurate Detection
    of Low-Concentration CVD Biomarkers


    Meena Laad, Sajna M.S, Kishor Kumar Sadasivuni, and Sadiya Waseem


    # 10.1 Introduction


    Cardiovascular diseases (CVDs) are a mix of several types of disorders affecting
    the heart and blood vessels (Figure 10.1). Mainly, a plaque is formed in the artery
    walls and narrows the arteries, giving rise to a severe condition called atherosclerosis.
    This narrowing of arteries obstructs the blood flow and makes the free flow of
    blood difficult, leading to a heart attack or stroke. CVDs are one of the leading
    causes of death globally and a major obstacle to sustainable human growth and
    wellbeing [1]. A study reported that the occurrence of the majority of CVDs was
    observed in industrialized countries having high incomes [2]. But in the last
    few decades, the absolute burden of CVDs is seen more in developing countries
    and is expected to grow more in the twenty-first century [2, 3]. To assess the
    CVD associated risk factors, several health examination surveys have been conducted
    in some of the countries with low and middle income [4]. A systematic evaluation
    of data collected through various resources can reduce the CVD mortality rate
    to a great extent.


    # 10.2 Risk Assessment and Early Detection of CVDs Using Biosensors


    Traditionally, CVD prevention begins with identifying potential risk factors.
    Treatment cost and healthcare expenditures are escalating; therefore, there is
    a crucial requirement for early detection followed by proper treatment of asymptomatic
    CVD [5]. Also, many individuals indicating low-risk levels have shown early evidence
    of CVD. There is an important need to understand the factors responsible for the
    initiation, associated symptoms, and early and accurate detection of CVD, thereby
    reducing the high risk of unexpected death. The early and fast diagnosis of CVDs
    is essential not only to save patient''s life but also to save huge hospitalization
    costs and time in successful prognosis of the disease.


    Present CVD detection methods rely greatly on conducting laboratory tests and
    take several hours or sometimes days to produce the results. According to the
    World Health'
