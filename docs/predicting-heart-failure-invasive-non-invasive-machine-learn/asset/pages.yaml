- pgno: 246
  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_246_0.png)


    # Figure 10.5 DNA based magnetic biosensor.


    It is critical to fabricate simple and efficient CVD diagnostic devices, which
    can quickly detect multiple cardiac biomarkers in biological fluids in very low
    volume. Accurate detection using biomarkers is challenging, as most cardiac biomarkers
    also mark common inflammation. Hence, it becomes very difficult to differentiate
    cardiovascular risks. A patient may have an inflammatory process and no CVD at
    all, and biomarkers can report false positives.


    Therefore, there is an urgent need to explore new techniques and tools to enable
    fast and accurate detection of cardiovascular risks, helping physicians to make
    correct clinical decisions. It has become essential to identify new and non-inflammatory
    biomarkers for CVD, developing biorecognition elements, exploring biosensors that
    can directly detect CVD in biological fluids, and developing miniature, portable
    electronic transducers.


    It’s a big challenge to achieve CVD diagnostic tools with rapid, high sensitivity,
    specificity, low-cost, and accurate biosensors. Artificial intelligence (AI) provides
    excellent tools for the discovery of new biosensing materials for the early and
    precise detection of CVDs. New materials that are more functional can be discovered
    with a multidisciplinary approach that brings together researchers from diversified
    fields such as science, engineering, biomedical, and design backgrounds. This
    demands a radical shift away from traditional methods for the synthesis of new
    materials. There are several stages involved in materials discovery, such as conception,
    synthesis, and characterization. The entire process is carried out in the same
    sequence. As a result, only a limited number of materials can be tested at a time.
    AI has great potential for faster and more efficient material development for
    specific applications but AI tools, large computational data sets, and automated
    robotic systems have not yet been widely used for this purpose.'
