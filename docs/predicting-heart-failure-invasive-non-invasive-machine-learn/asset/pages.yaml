    # 2.2.5 Treadmill Test


    The treadmill test is done by making patients walk briskly on a treadmill, which
    makes their hearts pump fast. The treadmill test is conducted to identify how
    well the heart of a patient handles their work and exercise capacity. During the
    test session, the heart rhythm, breathing, and blood pressure of the patient are
    monitored to detect abnormalities. The test is normally done after detecting signs
    or symptoms of coronary heart disease. It can assist the physician in understanding
    the severity of heart disease. Generally, the treadmill test is safe and devoid
    of any risks. However, patients suffering from low


