  md: 'specificity [174, 175]. It can be concluded that including several monitoring
    parameters is critical to improve the effectiveness of RPM [51]. The findings
    of Pekmezaris et al. (2018) support this fact as, by utilizing blood pressure
    measurement and a pulse oximeter in addition to the weight scale, lower hospitalization
    rates are achieved [22].


    In several trials which employ multiple monitoring parameters, thoracic impedance,
    heart rate, heart rate variability, and physical activity are used synchronously
    [176, 177]. In the study of Anand et al. (2012), an algorithm was developed to
    predict impending acute HF decompensation [178]. A total of 543 patients were
    monitored over three months using a device with multiple sensors measuring heart
    rate, respiratory rate, body impedance, and physical activity. It is reported
    that the algorithm predicted HF events with 63% sensitivity, 92% specificity,
    and a false positive rate of 0.9 per patient-year.


    In Table 5.1, remote patient monitoring studies are listed by indicating the subject
    numbers and the non-invasive sensing parameters used.


    # 5.4 Discussion


    HF is a chronic cardiovascular disease which results in frequent hospitalizations,
    increasing the economic burden in healthcare systems and negatively affecting
    the hospital workload. Many rehospitalizations are unnecessary or can be avoided
    by employing remote monitoring of HF patients.


    Hemodynamic effects of HF decompensation begin about 30 days before hospitalization
    [185]. In current practice, in-hospital invasive techniques are applied for assessing
    the HF state by measuring ventricular pressure levels. However, filling ventricle
    pressures can be determined using a catheter and cannot be applied frequently
    because of their invasive nature. An accurate and low-cost non-invasive modality
    is an important requirement for the recognition of HF decompensation. The signs
    of HF decompensation can be sensed in the form of intrathoracic impedance alterations
    measured by non-invasive tools up to 15 days before hospitalization. Systematic
    use of non-invasive techniques allows remote monitoring of the patient''s condition.
    With the development in sensor technologies and data science, lightweight and
    wearable sensors can be designed and the measurements taken can be remotely monitored
    by clinicians.


    The exact role and effectiveness of remote monitoring remains unclear [3, 24,
    182]. Although several RPM studies have reported reduced mortality rates and HF-related
    hospitalizations, large-scale trials tend to give neutral results for mortality
    and hospitalizations [19]. In future, it is necessary to elucidate the effect
    of remote monitoring modalities for HF prediction on large-scale RCTs. We have
    seen that using only one monitoring parameter is not sufficient to reduce hospitalization
    and mortality rates, and multiparameter methods with optimized algorithms are
    recommended for the increased benefit and for improving the life quality of patients
    [22].


    The use of weight scales is common among RPM trials, but the increase in weight
    provides an imprecise estimation because weight can change due to many factors
    other than HF decompensation [186]. A relative increase in thoracic bioimpedance
    provides better prediction of HF-related congestion [3]. ECG is among the under-investigated
    techniques for HF remote monitoring [182]. There is an effort to perform ambulatory
    ECG measurements with'
