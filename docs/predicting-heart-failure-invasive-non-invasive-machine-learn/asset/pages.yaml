    Vectorious Medical Technologies, Tel Aviv, Israel developed a more advanced LAP
    sensor based on the findings of the LAPTOP-HF trial, named V-LAP system. The V-LAP
    Left Atrium Monitoring System for Patients With Chronic Systolic and Diastolic
    Congestive Heart Failure (VECTOR-HF) trial is currently being performed to study
