- pgno: 65
  md: 'Biomarkers are biological materials found in bodily fluids, and they indicate
    the normal or pathological processes or responses of the body [18]. Biomarkers
    are critical tools for diagnosing and monitoring many diseases. CVDs involve various
    disorders, both acute and chronic. The effective, accurate, and rapid diagnosis
    of acute conditions with biomarkers in the short term can be life-saving [19].
    Besides this, for evaluating long-term risks related to CVDs, which can occur
    in the later stages of patients’ lives, biomarkers are widely used to improve
    patient’s life quality. Cardiovascular research research with biomarkers includes,
    in addition to diagnostic studies, post-disease risk and damage monitoring, such
    as evaluation of damages after stroke, the severity of cardiac damage, and cardiac
    arrest-related brain injury in Figure 3.2 [20].


    There are various biomarkers available for cardiovascular research that have been
    used for years and are emerging and new. In Table 3.1, the most significant and
    specific biomarkers for cardiovascular research are classified.


    It is possible to categorize biomarkers based on the physiologic processes. For
    example, inflammation-related biomarkers are CRP, sST2, GDF-15, TNF-α, etc. LDL
    and MPO are related to oxidative stress [24]. Considered from another angle, lipid-based
    biomarkers (HDL, LDL, etc.), CRP, and cTnI are considered widely used traditional
    biomarkers, while sSTN2, TNF-α, Gal-3, and GDF-15 are emerging biomarkers. Copentin
    is another promising biomarker for cardiovascular research, and there are ongoing
    studies on copetin that demonstrate its use as a diagnostic biomarker for MI,
    in addition to the well-known and clinically established biomarkers such as myoglobin
    and cTnI [22, 34]. Stability and ease of measure of copectin are considered an
    alternative biomarker. However, the changes on the levels of copetin during the
    perioperative course should be monitored for establishing copetin as a guiding
    biomarker [34, 35]. On the other hand, myoglobin, H-FABP, and MPO are add-on biomarkers
    that are more valuable with a multibiomarker approach [30].


    Essentially, an ideal cardiovascular biomarker should be highly specific with
    definite reference limits in order to provide valuable information for clinical
    assessment [24].


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_65_0.png)


    Figure 3.2 A schematic representation of some cardiac biomarkers and diseases.'
