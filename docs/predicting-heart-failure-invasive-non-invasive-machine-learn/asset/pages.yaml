  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_244_0.png)


    Surface plasmon resonance (SPR) is an effective and widely used optical transduction
    sensing technique used in most of the commercial optical biosensors. These biosensors
    work on special electromagnetic waves that are surface plasmon and identify variation
    in the refractive index (RI) on the surface of metal [20]. Surface plasmons are
    surface electromagnetic waves that propagate in a direction parallel to the metal
    interface.


    # 10.3.2 Electrochemical Biosensors


    In electrochemical biosensors, an immobilized detecting probe holds together the
    target molecules selectively. The detection of target molecules is based on observing
    the variations in current or voltage at a local surface. The potentiometric (Figure
    10.4), amperometric, and impedimetric transducers used in these biosensors convert
    vital chemical information into a measurable amperometric signal. These biosensors
    are low cost and easy to manufacture [27].


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_244_1.png)'
