  md: '14, 118, 119]. In addition, AI can account for interpatient variability and
    provide accurate automated diagnosis based on consideration of multiple clinical
    factors, which is humanly infeasible.


    Despite the clear advantages offered by an AI based ambulatory monitoring framework,
    the utility of novel invasive and non-invasive health monitoring modalities has
    been met with skepticism due to the lack of a regulatory framework, as well as
    reliability, accountability, liability, and security concerns. Recognizing and
    addressing these critical issues is paramount to the successful implementation,
    transition, and adoption of AI based ambulatory health monitoring systems:


    +   1. **Legislation and liability**: Enabling the universal adaptability of an
    automated monitoring paradigm, involves participation of developers, researchers,
    physicians, and legislators alike, to account for the multiple aspects involved
    in its design, implementation, and end consumer usage. Proper quality checks during
    development and production, along with thorough assessment ensured by Food and
    Drug Administration (FDA) approval will reduce the physician''s liability in cases
    of undesired outcomes [120], enabling a constructive framework for the implementation
    of an AI based medical system.


    +   2. **Data security**: For ambulatory monitoring devices, cybersecurity is
    a rising concern, as patient data is recorded on cloud servers and transferred
    between various digital and IoT platforms. Efficient AI based ambulatory systems
    need to include reliable signal processing algorithms with data security features
    protecting patient confidentiality. Similar to the need for informed consent prior
    to any medical procedure, approval needs be mandated before the implementation
    of AI systems as well to ensure effective patient involvement and account for
    data integrity.


    +   3. **Reliability and accountability**: To standardize the accuracy and efficacy
    requirements of ambulatory monitoring systems, AI devices and algorithms should
    be FDA approved. In addition, with advancements in real-time signal processing
    capabilities, AI algorithms need to be consistently refined to keep up with the
    updated clinical practices. The end performance of the AI based ambulatory healthcare
    system depends on participation by multiple stakeholders, including developers,
    physicians, and technicians in charge of data handling, along with willing involvement
    by patients. Hence, all stakeholders are equally accountable for the quality and
    performance of the AI device.


    +   4. **Equity**: Disparities in mortality rates between rural and urban communities
    has been a growing concern in recent years. Inequitable access to healthcare,
    socioeconomic differences, and geographic variances are significant attributes
    for the regional disparity in healthcare efficiency [121–127]. AI based ambulatory
    monitoring systems hold the potential to enable access to precision medicine by
    providing clinicians with patient custom methodologies for earlier and improved
    disease diagnosis. ML/DL algorithms can identify patterns from large physiological
    observations and provide personalized therapeutic approaches by detecting and
    potentially eliminating bias from underlying data, hence, enabling a more equitable
    healthcare paradigm.'
