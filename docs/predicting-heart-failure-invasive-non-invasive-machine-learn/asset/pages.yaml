- pgno: 194
  md: 'feature vector formed by the concatenation of the continuous and categorical
    variables were passed to the deep learning model for training. The model consists
    of three dense layers with batch normalization and dropout. Comparison with logistic
    regression and random forests models were conducted, and additional validation
    of results for coronary heart disease and HF subgroups were conducted in the experimental
    analysis. The test set included 3840 patients from hospital A and 1560 patients
    from hospital B. The used performance metrics are the area under ROC curve (AUROC)
    and the area under precision recall curve (AUPRC). Based on the hospital A held-out
    set, the deep learning model (AUROC: 0.912, AUPRC: 0.143) outperformed RFs (AUROC:
    0.893, AUPRC: 0.134) and logistic regression (AUROC:0.841, AUPRC: 0.205) in the
    prediction of in-hospital mortality. For the hospital B test set, the deep learning
    model (AUROC: 0.898, AUPRC: 0.280) outperformed RFs (AUROC: 0.848, AUPRC: 0.186)
    and logistic regression (AUROC: 0.841, AUPRC: 0.20) in the prediction of in-hospital
    mortality. The previous results were based on the general cohort of the heart
    disease cohort. For the subgroup of HF patients, the chosen baselines were the
    Meta-Analysis Global Group in Chronic Heart Failure deep learning model (MAGGIC)
    and the Get With The Guidelines-Heart Failure (GWTG-HF) program [55, 56]. The
    deep learning model (AUROC: 0.913, AUPRC: 0.351) significantly outperformed both
    MAGGIC (AUROC: 0.806, AUPRC: 0.154) and GWTG-HF (AUROC: 0.783, AUPRC: 0.285).


    # 8.8.2 Prediction of 30-Day HF Readmission


    HF readmission is a major healthcare problem. Patient deterioration is correlated
    with 30-day readmission and significant costs are attached to it. The early prediction
    of readmission risk can contribute to the reduction of this problem. Scheduling
    early follow-up based on this predictive model can play an important role in preventing
    patient readmission and health complications. J. Frizzel et al. proposed a comparison
    of MLapproaches for this task [57, 58]. The following models were compared: tree-augmented
    Naive Bayesian network (TAN), an RF algorithm, a gradient-boosted model (GBM),
    and logistic regression models (LR and LASSO). The baseline models are statistical
    models built using EHR data (EHR model) [59] and administrative claims model (CMS)
    [60]. The cohort included 56,477 patients from the WGTG-HF data set. The study
    population''s overall 30-day readmission rate was 21.2%. The variables included
    in the analysis were extracted from patient EHRs and cover demographics, socioeconomic
    status, medical history, characterization of HF, lab results, etc. In total, about
    250 variables were used as features in the analysis. The data set was randomly
    divided into training (70%) and validation (30%). The models'' performance was
    assessed based on the validation set. The C statistic was used as a performance
    measure to distinguish between a readmission or not. The performance of the ML
    models and the statistical models are respectively TAN(0.62), LR(0.62), LASSO(0.62),
    RF(0.61), GBM(0.61), EHR model (0.59), and CMS (0.6). The experimental results
    revealed that there is no significant difference between ML models and statistical
    models in this context. One limitation of this study is the use of only C statistics
    as performance metrics. It is possible that additional metrics might better reveal
    a difference between the studied models.'
