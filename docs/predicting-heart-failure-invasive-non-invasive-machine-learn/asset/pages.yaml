  md: '# 5


    # Minimally Invasive and Non-Invasive Sensor Technologies for Predicting Heart
    Failure


    An Overview


    Huseyin Enes Salman, Mahmoud Khatib A.A. Al-Ruweidi, Hassen M. Ouakad, and Huseyin
    Cagatay Yalcin


    # 5.1 Introduction


    Heart failure (HF) is one of most prevalent clinical syndromes, in which the heart
    muscles are not capable of providing adequate blood flow to the circulatory system.
    The symptoms of HF are reported as ankle swelling, dyspnea, and fatigue due to
    elevated jugular venous pressure, pulmonary crackles, and peripheral edema [1–3].
    The estimated number of patients suffering from HF worldwide is reported as 26
    million [4]. Frequent hospitalization and poor life quality are serious risks
    for HF patients. It has been reported that only about 10% of patients with chronic
    HF survive 10 years after diagnosis [5, 6]. HF is a chronic and progressive disease
    and, therefore, HF patients have high rehospitalization rates and emergency visits.
    About 25% of HF patients are readmitted within a month and at least half of these
    readmissions are due to HF related symptoms [7]. These facts demonstrate the high
    economic burden and hospital workload for HF treatment.


    Hospitalization is required for HF patients in case of congestion, which is the
    excessive accumulation of body fluid [8]. Congestion is mainly related to water
    and sodium retention in the body, leading to high left ventricular end-diastolic
    pressure [9, 10]. The symptoms of congestion can be listed as dyspnea, rales,
    and edema [11]. The most-used therapy for congestion is to intravenously inject
    diuretics to minimize the fluid accumulation in the body [8]. The diuretics help
    kidneys to excrete more sodium into the urine, and the excessive sodium results
    in more water absorption from the blood, which reduces the amount of fluid in
    the body.


    The current gold standard for HF diagnosis is to measure intracardiac filling
    pressures using implantable pressure sensors via cardiac catheterization [12].
    However, the invasive nature of cardiac catheterization prevents its routine usage
    for HF patients [10]. In addition, the cost of the implantable pressure sensors
    is more than US$ 20,000, which is not affordable for millions of HF patients [7].
    This demonstrates the need for an inexpensive, non-invasive, easy-to-apply, and
    accurate method for HF diagnosis.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'In the literature, alternative non-invasive modalities are suggested to monitor
    HF patients and diagnose the critical HF stages which require hospitalization.
    This way, unnecessary hospitalizations can be prevented by remotely monitoring
    the patient using non-invasive and minimally invasive sensors [3]. The efficiency
    of remote monitoring is still open to debate, but many studies have indicated
    a reduced rehospitalization rate and increased life quality for patients with
    external monitoring [3]. For this purpose, external devices or wearables with
    embedded non-invasive sensors are employed. By retrieving data from the non-invasive
    sensors, the health status of an HF patient is followed, and clinical therapy
    is offered in emergency cases, which are identified by evaluating the abnormal
    changes in measured data. This method is also known as home monitoring or remote
    patient monitoring [3].


    In this chapter, we explain the non-invasive and minimally invasive sensor technologies
    and techniques employed for HF diagnosis. We also summarize landmark studies and
    clinical trials which prove the potential of non-invasive monitoring of HF patients.


    # 5.2 Methods


    The methods for identifying worsening HF can be listed as body weight measurements,
    electrocardiography (ECG), bioimpedance monitoring, activity tracking, implanted
    pressure sensors, lung ultrasound monitoring, measurements with sound and Doppler
    sensors, seismocardiography, ballistocardiography, photoplethysmography, and measurement
    of natriuretic peptides levels in circulating blood. These methods are explained
    in detail in this chapter.


    # 5.2.1 Body Weight Measurement


    The state of worsening HF is characterized by excessive reduction in circulatory
    volume and body water retention [3, 13]. Depending on the change in water balance
    in the body, a sudden increase in weight is observed in an emergency case. If
    the increase rate in body weight is higher than 2 kg/48 hours, it can be evaluated
    as a deterioration due to the impending HF decompensation [3].


    Many remote monitoring studies used body weight measurements as a rehospitalization
    indicator for HF patients [14–24]. Weight measurements can be easily performed
    on a daily basis using weight scales or shoe-integrated pressure sensors. However,
    pressure sensors used in shoes can lead to inaccuracy in long-term monitoring
    [25] as there are several factors reducing the accuracy of measurements, such
    as different levels of activity in daily life and individual-dependent posture
    and gait disturbances. Alternatively, weight measurements can be performed daily
    by patients using bathroom scales as a part of HF self-management [26, 27].


    # 5.2.2 Electrocardiographic (ECG) Measurement


    ECG measurement is a widely used non-invasive method for HF diagnosis [28, 29].
    The method is based on measuring the electrical activity of the heart using electrodes
    placed'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'on the chest skin [30]. The electrodes identify voltage differences resulting
    from heart muscle depolarization and repolarization during the heartbeat [31].
    In 12-lead ECG measurements, 10 electrodes are placed on limbs and the chest.
    The electric potential of the heart is measured by taking capitalizing on the
    different angles between the heart and electrodes


    Measurements are generally recorded for 10 seconds so that the electrical depolarization
    is monitored during the entire cardiac cycle [32, 33]. The main components of
    ECG signals are P-wave, QRS complex, and T-wave.


    Several ECG parameters are utilized for predicting HF and also its worsening in
    HF patients [3]. The most-used ECG parameters are reduced heart rate variability
    [34], increased heart rate [35], increase in QRS/T angle [36], atrial and ventricular
    tachyarrhythmias [37, 38], increased ECG left ventricle mass index [28, 39], QT
    prolongation [40], increased QRS duration [41, 42], and left ventricle strain
    [20, 43, 44]. Reduced heart rate variability can be determined using the time
    differences in heart rate between day and night [34]. The heart rate variability
    can be determined by examining the standard deviation of sequential 5-minute R-R
    interval means. If the ECG left ventricle mass exceeds 70 ± 9 g/m² in men and
    61 ± 8 g/m² in women [28, 39], or the corrected QR duration is longer than 450
    ms in men and 460 ms in women [40], there is a potential risk factor for the presence
    of HF. QRS durations higher than 100 ms [41, 42, 45], T-wave inversions, and ST
    segment depression [20] are also evaluated as indications of HF.


    # 5.2.3 Bioimpedance Monitoring


    Bioimpedance analysis is a non-invasive method for assessing the body composition
    and fluid overload [46]. Impedance is an electrical parameter defining the resistance
    to the electrical current flow. In bioimpedance monitoring, a high-frequency and
    low-amplitude electrical current is used in the body to measure the bioimpedances
    [47]. Body tissues and fluids have different resistances which change the flow
    behavior of the electrical current. In an HF decompensation scenario, fluid retention
    leads to pulmonary congestion, and this fluid overload in the lungs influences
    the bioimpedance of the thoracic area. The blood and fluids have lower resistance
    to electrical current flow compared to thoracic tissues and air. This means that
    bioimpedance decreases with increasing fluid content. Therefore, there is an inverse
    correlation between the bioimpedance and the amount of fluid [48–50]. Healthy
    and relatively dry lungs are expected to have higher impedances than lungs with
    pulmonary edema that develop as a result of HF [51]. The bioimpedance monitoring
    is important for HF patients, because the thoracic impedance changes start in
    advance of the observation of serious symptoms and hospitalization.


    The traditional non-invasive bioimpedance analysis, also known as transthoracic
    impedance cardiography, is performed using four or six electrodes placed on the
    skin for measuring the changes in thorax resistance. Low-amplitude constant electrical
    current is sent from one of the electrodes and measured by the other electrodes,
    enabling the voltage difference and impedance through the thorax to be determined
    [47].


    Bioimpedance levels show variability for each patient due to individual-dependent
    characteristics such as fat and muscle percentage in the body composition, amount
    of'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'body hair, and skin condition [10]. For this reason, defining the exact values
    of critical impedances for HF emergency conditions is challenging. Therefore,
    individualized analysis is employed for each patient for tracking the relative
    increases in bioimpedance levels [10]. By remotely performing bioimpedance measurements
    at every hour or every day, clinicians can track the relative behavior of impedances
    and have the opportunity to take therapeutic action in case of a sudden and sharp
    decrease in thoracic impedance.


    As a recent application of bioimpedance monitoring, remote dielectric sensing
    technology (ReDS) utilizes the changes in lung fluid status and dielectric properties
    of thoracic tissues for predicting the HF state [52–54]. In this application,
    a wearable vest is used with two sensors placed on the anterior and posterior
    sides. Low-power electromagnetic signals are emitted and received by the implemented
    sensors after passing through the thoracic tissues [55]. There is no need for
    direct skin contact to perform the measurements, and therefore the method can
    be applied over light clothing. The electromagnetic signals are mostly affected
    by the fluid content of the thoracic tissues in the path [55], and the predicted
    fluid balance in the lungs can be used for identification of congestion in case
    of HF decompensation [53].


    # 5.2.4 Pedometers and Activity Trackers


    One of the common symptoms of HF is the restricted exercise ability that prevents
    people performing daily tasks. Regular physical activity is recommended for HF
    patients to improve their functional capacity [56–58]. Walking is a safe and efficient
    form of physical activity, and pedometers are used for counting the number of
    steps [56]. In this way, the activity levels of patients can be remotely monitored
    using biosensing products integrated into accessories and clothing [3].


    Pedometers and activity trackers are portable electronic devices which measure
    the distance traveled by the patient using a global positioning system (GPS) receiver.
    Since the step size of each individual varies, a calibration is required for determining
    the accurate number of steps. There are also pedometers including inertial microelectromechanical
    system (MEMS) sensors for detecting the number of steps utilizing the body accelerations
    in three spatial dimensions [58–60]. Using these portable devices, clinicians
    can track the total physical activity of HF patients, and in case of severe reduction
    in physical activity, patients can be called for medical care. This also helps
    HF patients in tracking their own physical data and taking preventive precautions
    before being face with more serious HF symptoms.


    # 5.2.5 Implanted Pressure Sensors


    The concept of sensors-based device monitoring is a prime prospect for improving
    the outcomes of any long-lasting HF disease supervision [61]. With the rapid increase
    of cardiac implantable sensors in HF patients, some HF monitoring strategies have
    taken broader advantage of such chips [61]. Certainly, the usage of implantable
    sensors has several advantages over other HF monitoring standards (such as in-clinic
    monitoring, where the patient acts as the sensor during the live physical contact),
    which are mainly limited by several factors including subjectivity, variable patient
    ability, and poor'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'sensitivity to symptoms during a premature HF diagnosis process [61]. In addition,
    implantable sensors have several advantages, including live continuous monitoring,
    autonomous assessment based on subjective measurements, and the ability to provide
    a timely profile about a particular patient with relative ease in analyzing its
    medical status.


    One of the chief methods in identifying deteriorating HF can be implantable devices
    such as pressure sensors [62]. It is worth mentioning that the early detection
    of signs of any clinical condition deterioration permits rapid medical preventive
    intervention to optimize and identify an HF status. Consequently, it is not only
    healthcare specialists who can take advantage of a decrease in medical treatments
    and monotonous checks, but also patients who can profit from effective supervision
    of their HF status. Indeed, over the past decade, and with the increasing recognition
    of the value of monitoring HF, there has been an exponential growth in the insertion
    of devices for cardiovascular therapy [62]. Employing implantable pressure sensors
    in cardiovascular therapy-based devices represents an exceptional prospect for
    constant tending of a patient''s clinical HF status through real-time measuring
    of physical activity and cardiac rhythms/events, as well as sensing any health
    malfunction by monitoring different cardiac pressures.


    A key factor in diagnosing an HF is an elevation of the ventricular filling pressures
    and, therefore, much of the focus of HF disease monitoring has centered on achieving
    the lowest ventricular filling pressures possible with medical and device-based
    therapy. Consequently, the opportunity for continuous monitoring of cardiac pressure
    via implantable sensors has been shown to be an attractive opportunity. Early
    effort [63] established the safety and practicability of long-term cardiac pressure-based
    sensors monitoring and also recognized an outstanding connection between the implantable
    heart pressure sensors measurements and the HF attack. From this perspective,
    coupling a pressure transducer to a heart ventricle lead of a pacemaker or defibrillator
    provides the simplest form of continuous cardiac pressure monitoring. Through
    implanted pressure sensors, three major classes of arterial pressures can be remotely
    supervised to mirror a patient''s HF status: (i) the right ventricular (RV) pressure,
    (ii) the left ventricular (LV) pressure, and (iii) the pulmonary arterial (PA)
    pressure.


    Indeed, a patient''s RV pressure can be monitored using a piezoelectric-based
    chip merged at the tip of a pacemaker lead in the RV outflow area [64]. Then,
    the arterial diastolic pressures can be estimated by taking the value of the RV
    pressure at the peak time (first rate of change of the pressure with respect to
    the time) [65]. A particular study on a RV pressure-guided treatment group [66]
    showed a decrease in HF hospitalization and a reduction of about 20% in the need
    for intravenous diuretics. A subsequent analysis on the same group showed an approximately
    20% reduction in HF events. Furthermore, high RV pressure was correlated to an
    augmented risk of ventricular tachyarrhythmias [67, 68].


    The left atrial (LA) pressure sensor is composed of a sensor lead positioned at
    the interventricular septum and attached to a coil antenna for telemetry of sensor
    signals from the LA. In a severe HF patient trial [69], the use of LA pressure
    monitoring resulted in a fall in LA pressure and proved the stability, safety,
    and efficacy (potential risk of pulmonary embolism) of LA pressure sensors.


    Various studies, including that of Abraham et al. [39], have proved that an increase
    in the intracardiac and the PA pressures comes before the commencement of an HF'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'dissociation. A pressure transducer, such as the CardioMEMS HF sensor [70,
    71], can be arranged in any branch of the pulmonary artery. Such a sensor allows
    monitoring of the PA pressure to improve the outcomes of HF patients. The trial
    by Smeets et al. [10] showed that daily measurement of PA pressures in addition
    to ordinary care led to an approximate 40% reduction in HF-related hospitalization
    and improved quality of life scores compared with the control group, while the
    duration of an in-patient stay was significantly shortened from 4 almost to 2
    days.


    The CardioMEMS HF sensor [39, 72, 73] is the first clinically proven HF monitoring
    system confirmed to significantly decrease HF hospital admissions and improve
    quality of life [39]. Additionally, it has been clinically demonstrated to reduce
    hospital admissions by about 60% over an average of 1 year [72]. This HF system,
    almost batteryless, revealed many benefits, including the use of sensor information
    without the patient needing to visit the clinic or hospital as the system regularly
    communicates the measurements wirelessly to the respective care person/doctor.


    In summary, remote wireless pressure sensors-based systems are valuable apparatuses
    that can support several HF clinics by keeping the respective patients regulated,
    out of the medical health centers, and a relatively stable quality of life [74].
    As cardiac pressure sensors-based monitoring systems become automated in terms
    of data collection, smarter and smaller remote nursing will evolve into an essential
    piece of HF patients’ health evaluation, especially with the recently developed
    emphasis on virtual visits in light of the COVID-19 pandemic [74].


    # 5.2.6 Lung Ultrasound


    Lung ultrasound (LUS) is an accurate non-invasive method that can be used for
    quantification of extravascular lung water (EVLW) in patients with known or suspected
    HF [75]. It is a safe, efficient, and reliable method [76].


    The concept of LUS in critical care and cardiovascular medicine is perhaps seen
    as new idea emerging over the past few decades, but its origin dates back to much
    further – to 1946 [77]. It was neglected for a long time [78] due to the belief
    that lungs are an inadequate medium for ultrasound waves because of high air content
    [79]. The discovery of B-lines artifacts and utilizing their presence and summation
    as an indicator for HF made LUS significant in cardiology. The study of ultrasound
    includes three essential modes that form soft tissue imaging: (i) amplitude mode
    (A-mode), (ii) motion mode (M-mode), (iii) brightness mode (B-mode) [80]. In this
    section, we are limiting discussion to the third mode only.


    The LUS for HF applications relies mostly on B-lines artifacts detection. The
    presence of multiple and diffuse B-lines is correlated with the presence of EVLW
    [81, 82]. In a typical B-mode, the ultrasound pulses construct a 2D image [83].
    In a normally aerated lung, ultrasound images will show A-lines consisting of
    regularly spaced horizontal lines and reverberation artifacts between two bordering
    surfaces, which are the probe/body surface and the pleura/air in alveoli [84].
    An image for a lung that contains A-line artifacts is usually called dry lung.
    The presence of B-lines begins to take shape upon the presence of fluids in the
    interstitial or interalveolar spaces due to the reverberation phenomenon, which
    is currently understood to mean'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'that when an ultrasound wave is trapped between materials that possess different
    acoustic impedance, a reverberation artifact will occur [85]. The increase of
    lung tissue density causes a change from the dominant A-line to diffuse B-lines
    in what is known as sliding [86]. B-lines, previously known as comet tails or
    lung cosmists, are defined as discrete laser-like vertical lines that arise from
    the bottom of screen and move synchronously with lung sliding [81, 87]. Lung B-lines
    are not exclusive to HF symptoms, and can be seen in many other conditions such
    as pulmonary edema [88], pneumonia [89], systemic sclerosis [90], acute lung injury
    [91], and other respiratory diseases [92].


    There are multiple factors that affect the quality and quantity of B-lines appearances
    in LUS images, such as the position of the patients, the equipment utilized, clip-length,
    probe selection, the experience of the practitioner, and the number of zones [93].
    The current settings to examine designated thoracic zones can be as low as two
    up to 36 zones. The optimum recommendation is eight zones.


    The visualization of B-lines is possible with cardiac, convex, or linear probes
    [94]. There are two main scanning approaches in LUS, but either way the probe
    has to be placed in intercostal spaces. The first approach is the longitudinal
    scan, while the second is the transverse (oblique) scan. The ribs and their shadows
    are a part of the image in the longitudinal scan. On the other hand, the transversal
    approach allows the practitioner to visualize a wider view of the pleural lines
    uninterrupted by rib shadows [95]. The most important reference point is the pleural
    line with its lung sliding as it would be impossible to obtain any information
    about lung aeration without clearly visualizing it. Patients should be positioned
    either sitting upright, semi-recumbent or supine. In addition, patients should
    maintain the same position if serial examinations are being performed as the B-lines
    appearances in the imaging are greatly influenced by the patient''s position [96,
    97]. The length of the imaging clip is optimally 6 seconds, if the patient is
    breathing normally [98].


    In HF diagnosis and monitoring, the B-lines should be diffuse, bilateral, and
    multiple. Diffuse means that the lines should be adjacent in two areas, bilateral
    means that they should be visible in the left and right hemithorax, and multiple
    means that they should be in abundance [95]. There are many quantification systems
    that have been developed to classify and assess B-lines numbers in order to identify
    the level of risk that at patient is at during and after hospital discharge. The
    methods can be categorized as: (i) score methods and (ii) count-based methods.
    Score methods often rely on a minimum number of B-lines in one intercostal space,
    labeling it as a positive zone and adding up the number of positive zones. In
    addition, lines can be counted one by one, or upon confluence, or as percentage,
    cumulatively known as count-based methods [99]. These wortification systems can
    be important in predicting mortality and hospitalization of worsening HF, and
    are a prognostic marker for HF as shown by many studies [100–108].


    There are many protocols for LUS for diagnosis and prognosis monitoring of HF.
    The most famous protocols being used are: (i) bedside lung ultrasound in emergency
    (BLUE) [109], (ii) fluid administration limited by lung sonography (FALLS-protocol)
    [110], (iii) cardiac arrest ultrasound exam (C.A.U.S.E.) [84], (iv) lung and cardiac
    ultrasound (LuCUS) [111].


    LUS is a powerful and sensitive technique for the prediction and prognosis monitoring
    of HF. It is easy-to-apply, widely available, and has a short learning curve [112].
    Although'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'LUS is a powerful tool for pulmonary and cardiology imaging, there are some
    limitations, including the dependence on the skill of the practitioner, the quality
    and the setting of the hardware [113], and the lack of specificity as B-lines
    can be present in many other conditions. Nevertheless, the future is open for
    LUS to be further developed and specific with the integration of new algorithms
    and reliability on deep learning methods [114].


    # 5.2.7 Sound Sensors


    The flow of blood in and out of the heart and the movement of the structures responsible
    for controlling this flow allow the heart to make sounds [115]. There are four
    types of heart sounds: (i) primary heart sounds in healthy adults, including the
    first heart sound (S1) and the second heart sound (S2) [115–118], (ii) extra heart
    sounds including gallop rhythms of the third heart sound (S3) and fourth heart
    sound (S4) [119–123], (iii) heart murmurs, which are present in congenital abnormalities
    [124–128], (iv) other abnormal sounds such as adventitious sounds, click [129,
    130], rubs [131], snaps [132], knocks [133], and plops [134–136].


    Before the invention of the stethoscope in 1816 by Laënnec, listening to the sounds
    of heart was not possible without physicians applying their ears to the chest
    of the patient [137]. Stethoscopes enabled listening to and interpreting heart
    sounds for diagnosis. The contribution of scientists and introduction of physical
    concepts and technological additions have allowed us to arrive at sound sensors
    for the classification of heart sounds.


    The normal sounds in healthy adults are S1 and S2 [138]. The presence of other
    sounds could be an indicator for cardiovascular problems. For instance, the presence
    of S3 sound could be an indicator for pathological problems such as anemia, thyrotoxicosis,
    mitral regurgitation, hypertrophic cardiomyopathy, aortic and tricuspid regurgitation,
    and LV dysfunction [135]. The S4 sound can result from hypertension, aortic stenosis
    and regurgitation, severe mitral regurgitation, cardiomyopathy, and ischemic heart
    disease [139]. The ability to distinguish the different heart sounds is uniform
    across all practitioners, especially as it is difficult to distinguish some sounds,
    like the S3 sound, which is crucial for HF diagnosis. Therefore, it became important
    to move toward the automatic classification of heart sound signals in order to
    achieve better diagnosis, through signals detected with, for example, stethoscopes,
    electret microphones or piezoelectric acoustic sensors [140–142].


    Over the past few decades, multiple sensors have emerged for better detection
    of heart sounds based on phonocardiography and echocardiography. The sensors focus
    on improving signal processing and noise reduction. In 2004, Reed et al. developed
    a model for the production of heart sounds through a prototype based on wavelet
    decomposition of sounds and a neural network-based classifier that could detect
    abnormal heart sounds, which was very useful in predicting HF [143]. In another
    work, a chest-worn accelerometer with high sensitivity for cardiorespiratory sound
    was based on an asymmetrical gapped cantilever, which is composed of a bottom
    mechanical layer and a top piezoelectric layer separated by a gap with a built-in
    amplifier to amplify the output of the voltage sensor [144]. Mubarak et al. published
    their work centered on improving the quality of phonocardiogram (PCG) signals
    and the removal of noisy and corrupted'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'signals, which allowed them to accurately identify and localize S1 and S2 sounds
    based on homomorphic filtering using support vector machine [145]. Gupta et al.
    utilized commercially available Audicor (Inovise Medical, Oregon, USA) devices
    that use 10 second PCG to detect S3 sounds. They used a proprietary algorithm
    and the S3 intensity is graded on a scale of 0–10. S3 sound is considered present
    when its intensity is greater than 5. They were able to reproduce the data upon
    replacing the old sensors with new pairs of sensors [146]. In their work, Chen
    et al. used a deep neural network (DNN) to recognize S1 and S2 sounds based only
    on acoustical characters through converting signals first into a sequence of Mel-frequency
    cepstral coefficients (MFCCs). The K-means algorithm is applied to cluster MFCC
    features into two groups to refine their representation and discriminative capability.
    The refined features are then fed to a DNN classifier to perform S1 and S2 recognition
    [147]. In a non-invasive pilot study on HF patients with audible S3, Siejeko et
    al. studied the feasibility of heart sound measurements from an accelerometer
    within an implantable cardioverter defibrillator (ICD) pulse generator. In their
    findings S1, S2, and S3 vibrations were detected in all accelerometer locations
    including 16 subjects. However, S3 was not audible because when the signal bandwidth
    was increased, a substantial portion of S2 was infrasonic (below 20 Hz). In their
    conclusions they found that heart sounds, including S3 amplitude and heart sound
    time intervals, can be measured using pulse generator embedded circuitry at implant
    sites without special-purpose leads [148].


    # 5.2.8 Seismocardiography


    Seismocardiography (SCG) is a non-invasive method based on measuring the vibration
    on the chest in response to the movement of heart and blood in the arterial tree
    [149]. Vibration measurements can be performed using a MEMS-based 3-axis accelerometer
    placed on the chest, particularly around the mid-sternum [7, 150]. Since SCG measurements
    are not confounded by body fluid, there is no need to use multiple sensors. The
    waveforms of SCG signals consist of parts that correspond to the opening and closure
    states of the aortic valve, and the ejection of blood from the left ventricle
    to the aorta. The hypothesis of SCG studies depends on the similarity of signals
    for HF patients before and after physical exercise [7], because HF patients have
    less reserve to increase cardiac performance during exercise. In other words,
    SCG signals of HF patients are similar during exercise and rest conditions. On
    the other hand, healthy individuals have relatively altered signal amplitudes
    during exercise and rest. By comparing the recorded signals during rest and exercise,
    the HF severity of the patient can be predicted in a non-invasive way. Recorded
    time signals are covert into frequency domain for detailed investigation. During
    exercise, high-frequency components in SCG waves are more visible in healthy individuals
    compared with the SCG signals of HF patients [7].


    # 5.2.9 Ballistocardiography


    Ballistocardiography (BCG) is a non-invasive technique that examines the movements
    which occur as a result of the ejection of blood during the cardiac cycle [151].
    BCG measures the response of the whole body in terms of displacement, velocity,
    or acceleration'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'to the mechanical forces generated by the movement of blood in heart chambers
    and in arteries, particularly in the aorta, and the movement of the heart muscles.


    BCG signals can be determined using a modified weighing scale capable of measuring
    the response at the bottom of the foot. There is a phase difference between the
    peaks of ECG and BCG signals due to wave propagation through the body. There are
    also secondary peaks in the BCG wave which are not observed in ECG signals. In
    the classic BCG, early peak H occurs due to the heart contraction in systole and
    main IJK complex is observed due to the ventricular ejection and aortic flow [151,
    152]. After BCG had been studied extensively between 1955 and 1980, the method
    was almost extinct by 2010, mainly due to the lack of standardized measurement
    techniques and lack of understanding of the signal source [151]. However, BCG
    research has increased again in recent years, thanks to the advancements in sensing
    technologies such as static-charge-sensitive sensors and piezoelectric films [153–155].
    These sensing technologies simplify the non-invasive measurements of BCG signals
    using weighing scale implemented or bed/chair implemented sensor applications
    that are capable of measuring BCG signals during standing or sitting [156, 157].
    BCG signals vary depending on the cardiovascular health status of the individual
    [158, 159]. The peak amplitudes of BCG signals are significantly lower for HF
    patients compared with the rest or exercise states of healthy individuals [158].


    # ## 5.2.10 Photoplethysmography


    Photoplethysmogram (PPG) is an optical signal used for the quantification of blood
    volume changes during the heartbeat [158]. PPG signal is generally measured to
    monitor the oxygen saturation using a pulse oximeter [160]. The scatter of light
    is different for oxygenated and deoxygenated blood and the amount of oxygen can
    be predicted using this difference [161]. A pulse oximeter is generally used on
    the finger [161, 162]; a beam of light is emitted toward one side of the finger
    and the level of collected light is measured on the other side. As a result, the
    scattered light intensity provides a measure to determine the level of oxygen
    saturation in the body [163]. The baseline oxygen saturation decreases progressively
    due to inadequate cardiovascular performance of HF patients, and HF worsening
    may be suspected when the baseline oxygen saturation is less than 93% [164].


    # ## 5.2.11 Monitoring Natriuretic Peptides Levels


    B-type natriuretic peptide (BNP) and amino-terminal pro-B-type natriuretic peptide
    (NT-proBNP) are biomarkers of HF, and they can be used for the assessment of HF
    severity [165–167]. BNP is a cardiac hormone which is released from the myocytes
    (heart muscle cells) in response to increased wall stress [168]. For the measurements
    of BNP levels, minimally invasive finger-stick self-testing can be used [3].


    In the case of HF, ventricular stress increases, leading to higher levels of BNP
    and NT-proBNP release. It has been reported that the cut-off levels for HF diagnosis
    are 100 pg/mL of BNP [168] or 300 pg/mL of NT-proBNP [169]. Natriuretic peptide
    levels less than these cut-off values are not considered to indicate HF. There
    are several factors which influence the level of BNP and NT-proBNP; therefore,
    in addition to BNP'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'measurements, other supporting diagnostic tools should be employed for accurate
    HF diagnosis [2]. In case of acute coronary syndrome, renal insufficiency, RV
    dysfunction, atrial fibrillation, and advanced aging, higher levels of BNP are
    observed than the expected levels [167]. On the other hand, obesity, flash pulmonary
    edema, and end-stage cardiomyopathy lead to lower levels of BNP than those expected
    [167]. For individuals under 50 years old, presence of HF can be considered when
    the BNP level is higher than 400 pg/mL or NT-proBNP is higher than 450 pg/mL.
    For the groups between 50 and 75 years of age and older than 75 years, these threshold
    levels become 900 pg/mL and 1800 pg/mL, respectively [167]. It is reported that
    impending HF deterioration can be predicted using daily home BNP measurements
    [170, 171]. McDonald et al. (2018) used an averaged filter to reduce the variations
    in daily BNP measurements and provide better assessment of weekly changes for
    predicting emerging HF failure [170].


    # 5.3 Clinical Trials on Remote Monitoring Using Non-Invasive Sensors


    The non-invasive modalities discussed in this chapter are used for remote monitoring
    of HF patients. Many remote monitoring trials investigated different population
    groups and employed different monitoring techniques. Several researchers performed
    meta-analysis by combining randomized control trials (RCTs).


    Klersy et al. (2009) conducted a meta-analysis, using 20 RCTs and 12 cohort studies,
    to identify the effect of remote patient monitoring (RPM) on the outcome of HF
    patients [172]. The RCTs included 6258 patients and had a 6-month follow-up period.
    The RCTs showed that RPM results in a significant reduction in the number of deaths
    (relative risk: 0.83, 95% confidence interval: 0.73 to 0.95, p = 0.006) and hospitalizations
    (relative risk: 0.93, 95% confidence interval: 0.87 to 0.99, p = 0.030), indicating
    that RPM has a clinical protective effect compared with usual care [172]. Inglis
    et al. (2010) performed a similar meta-analysis and reported that RPM decreased
    the number of deaths (2710 subjects were included, relative risk: 0.66), all-cause
    hospitalizations (2343 subjects were included, relative risk: 0.91), and HF-related
    hospitalizations (1570 subjects were included, relative risk: 0.79) [42].


    The meta-analysis of Yun et al. (2018) reported that RPM reduced all-cause mortality
    (relative risk: 0.81) and HF-related mortality (relative risk: 0.81), but no significant
    change is reported for all-cause hospitalizations and HF-related hospitalizations
    [173]. Chaudhry et al.''s (2010) study was a randomized controlled clinical trial
    of RPM by means of measuring weight and collecting daily information about the
    symptoms [14]. They stated that there was no effect of remote monitoring system
    on the number of deaths and hospitalizations. The possible reason for this ineffectiveness
    might be related to using only weight as the indicator. The most commonly used
    parameter for remote monitoring is weight because of its simplicity [51]; however,
    it is not sufficient alone to capture the warning of impending HF decompensation
    [19]. Large-scale trials that use only one remote monitoring parameter tend to
    generate neutral results and show limited positive effect of remote monitoring.
    Similarly, if thoracic impedance is used as the only remote monitoring parameter,
    large trials result in low sensitivity and'
  merge: -1
