    \ the majority of the complete five nearest cases.\n\n# 7.4.3 Performance Measures\n\
    \nFive common evaluation measures were used to assess the efficiency of the prediction\
    \ models. These evaluation measures were selected as they are widely used to evaluate\
    \ the efficiency of prediction models. The first measure is Recall, as shown in\
    \ Equation 7.1, which measures how well a binary classification predicts positive\
    \ labels. The second measure is precision, as shown in Equation 7.2, which measures\
    \ the probability that a positive prediction is correct. The third measure is\
    \ accuracy, as shown in Equation 7.3, which measures the performance of classification.\
    \ The fourth measure is specificity, as shown in Equation 7.4, which measures\
    \ how well a binary classification test correctly identifies the negative cases.\
    \ The last measure is the F-measure, as shown in Equation 7.5, which measures\
    \ the probability that a positive prediction is correct [32].\n\n```\nRecall =\
