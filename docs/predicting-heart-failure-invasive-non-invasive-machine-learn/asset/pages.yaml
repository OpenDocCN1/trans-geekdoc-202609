    In 2016, Chen et al. [71] classified congestive HF patients in four categories
    according to the NYHA class (healthy vs. mild vs. moderate vs. severe) by analyzing
    HRV measures and implementing a decision tree-based SVM with HF prediction accuracy
    of 89.83% and total accuracy of 91.30%. In 2017, Tripoliti et al. [72] estimated
    the severity of HF in terms of NYHA class. They addressed this problem as a two,
    three, and four class classification problem. They utilized 378 subjects (18 in
    NYHA class I, 125 in NYHA class II, 173 in NYHA class III and 62 patients in NYHA
    class IV) of 102 features grouped as demographics, allergies, medical condition,
    medications, biological data related to the HF disease, clinical examinations,
    and adherence. The highest detection accuracy was 97.00% by applying rotation
    forest (ROT) and symmetrical uncertainty for the two-class problem, 87.00% by
    applying ROT and Information Gain for the three-class problem, and 67.00% by applying
    ROT and symmetrical uncertainty for the four-class problem. In 2017, Zhang et
    al. [73] utilized 6174 clinical notes and applied natural language processing
    (NLP) methods to identify NYHA classification, achieving 93.70% accuracy with
    SVM.


    A year later, Ma et al. [74] in their study examined whether NYHA classification
    can be estimated from EHR data, i.e. demographics, symptoms, medication, diagnosis,
    laboratory findings, cardiac vitals, angiogram, imaging, and stress tests, from
    461 subjects. The ensemble tree classifier using fivefold cross-validation was
    able to discriminate between class I versus II or III with AUC 84.00%, between
    class I and IV with AUC 89.00%, and between classes II or III and IV with AUC
    88.00%.


    Groccia et al. in 2018 [75] developed a model for the early detection of worsening
    major cardiovascular events in patients with chronic HF. They utilized 50 chronic
    HF patients, applied various temporal weighting strategies, and analyzed their
    impact on the performance of predictive models. Finally, six temporal weighting
    functions were tested. The original data set was divided into a training (70.00%)
    and a test (30.00%) set. Linear SVM achieved the best accuracy (71.00%), AUC (91.00%),
    sensitivity (71.00%), and specificity (100.00%). An extended review of the literature
    is presented in Tripoliti et al. [72].


    # 9.1.2.4 ML Applications in Clinical Prognosis


    Predicting hospital readmissions or mortality in patients with HF is a huge challenge.
    Therefore, several studies have been conducted to evaluate the clinical prognosis
    of HF patients in terms of readmission to hospital and of mortality prediction.
    Accurate and early prediction can lead to adaptations in patient management in
    order to decrease the risk of adverse events.


    # 9.1.2.5 ML Applications in Hospital Readmission Prediction


    A large number of studies have focused on predicting the rate of readmission to
    hospital for HF patients (Table 9.3). In 2013, Vedomske et al. [76] applied the
    RF classifier to'
