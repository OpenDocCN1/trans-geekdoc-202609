    # 13.4.5 Arrhythmia Detection


    Several life-threatening arrhythmias that lead to HF are atrial fibrillation (AF
    or AFib), ventricular tachycardia (VT or V-tach), and ventricular fibrillation
    (VF or VFib). However, there are very few wearable solutions available for real-time
    monitoring and detection of VT and VF. On the other hand, there is a good number
    of wearable solutions available for AF detection. The main challenges in wearable
    VT or VF detection are due to the complexity of developing an ECG system in wristwatches
    and wristbands. Moreover, irregular pulses cannot be easily detected by analyzing
    the PPG signal without confirming the ECG signals [46]. Ambulatory monitoring
    of the ECG signals is often done using Holter monitors, but Cardioskin, Carnation™
    patch, VivaLNK™, and similar chest patches are becoming popular because they can
    be used for several days comfortably for ECG monitoring and are more convenient
    than the Holter devices (Figure 13.9) [47].


    The Cardioskin is a wearable, wireless medical device, which allows the acquisition,
    recording, storage, transmission, and display of a 15-lead ECG to analyze potential
    cardiac pathological abnormalities. The Carnation Ambulatory Monitor (CAM) – is
    a lightweight, bandage-sized cardiac patch monitor engineered to capture low amplitude,
    low-frequency electrical signals that form the P-wave. This focus on the P-wave
    is a major advancement for cardiologists and cardiac rhythm specialists to aid
    in diagnosing an arrhythmia. The CAM patch is designed to be accurate, promote
    patient compliance, streamline clinical workflow, and yield clinically actionable
    data. VivaLNK is stuck to the skin to record ECG waveforms, respiratory rate,
    heart rate, RR interval, and patient movement, and so has potential to help detect
    cardiac arrhythmias such as AF. Weighing only 0.26 ounces (7.5 grams), it has
    all the electronics of a single-lead ECG, an accelerometer, a rechargeable battery,
    and wireless connectivity. Electrodes can also be woven'
  merge: -1
