- pgno: 234
  md: '# 9.3 Conclusions


    In this chapter, after an introduction to HF, and HF classification, evaluation,
    and diagnosis methods we highlighted the importance and necessity of using ML
    techniques in medicine. Due to the increased incidence and the large financial
    costs required to diagnose HF, the diagnosis and treatment of the disease are
    extremely important.


    An extensive review of the state of the art in the applications of ML in the management
    of HF was demonstrated, utilizing several types of features, HRV measurements,
    heart sound characteristics, ECG recorded signals, and EHR features – and studies
    using the Cleveland heart disease database or the EFFECT study data set.


    As presented in the comparison Table 9.1 different approaches in the literature
    provide methods for detecting and diagnosing HF, acute HF, or the various types
    of HF (HFpEF, HFmrEF, HFrEF) based on several methods, with accuracies ranging
    from 72.41 to 99.93%. Moreover, other studies focus on ML applications for severity
    estimation of HF. Most of the studies classify patients according to NYHA classification
    with accuracies ranging from 71.00% to 97.00%. HF imposes a significant burden
    on both patients and healthcare institutions and thus much effort has been given
    to developing methods to predict adverse events among patients with HF or acute
    HF. Studies address this problem by predicting mortality or readmission over various
    time periods.


    In the last part of the chapter, two novel methods of HF diagnosis, severity estimation,
    and adverse events prediction (mortality or rehospitalization) were presented.
    The models are based on ML approaches and consist of data cleaning, feature selection,
    class balancing, and classification steps. The results are high for all the addressed
    problems, while the innovation of the studies derives from the multiple data types
    that are utilized, especially the biomarkers and the data from the biosensors.
    Since these studies are based on the Kardiatool and Hearten projects, the demonstrated
    method for the HF diagnosis is integrated in a diagnostic tool in Kardiatool.
    In addition, the HF severity estimation and the adverse events prediction are
    embedded in the Hearten Knowledge Management System, which offers decision support
    in HF management. Through these tools, healthcare professionals can receive information
    related to a patient, detect the presence of HF, estimate the severity of a patient’s
    condition, and predict the risk for adverse events; they can therefore adapt patient
    management accordingly.


