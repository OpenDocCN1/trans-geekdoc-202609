- pgno: 319
  md: '# 13.4.6.1 Practical Challenges to Wearable Devices


    There are hundreds of off-the-shelf smartwatches, smart bands, chest straps/patches
    available which can monitor physical activity, sleep, and heart rate. However,
    smartwatches and bands do not perform similarly to a chest strap or patch. It
    has been reported that even on healthy subjects the performance of different wearable
    devices in measuring heart rate varies significantly [52] and that although, on
    a treadmill, there is some agreement, the devices showed the greatest error during
    cycling [52]. Most of the them fail in measuring dynamic heart rate changes. Therefore,
    these devices are most suitable for measuring resting-state heart rate [53].


    Due to the wide range of variability in activity, subject movements, and form
    factors of wearable devices (smartwatches, smart band, earbuds, ring, etc.), up
    to now it has been very difficult to get a high-fidelity PPG signal from them,
    leading to erroneous calculations of heart rate and other parameters [54]. From
    its beginnings in watches and wristbands, wearable technology has now moved to
    being available even in a ring form factor. Ōura [55] is a ring that has infrared
    LEDs, a temperature sensor, accelerometer, and gyroscope. As described at the
    beginning of this section, it can capture heart rate, temperature, and body movements
    and sleep patterns. Moreover, five major challenges can affect the performance
    of the optical monitoring devices: optical noise, sensor location, skin tone,
    crossover, and low perfusion [56]. The main technical challenge of processing
    a PPG signal is the noise, which will escalate in the presence of the motion artifact,
    thus affecting the analysis, which is mostly dependent on clean PPG signals. There
    have been studies done by the authors to reduce the motion artifacts from PPG
    signals using signal processing techniques and machine learning [57]. Only 1%
    of the incident light reflected the photodetector, 1% of which is modulated by
    the heart pumping-related blood flow variations. The rest of the incident light
    is scattered from the skin and body materials and, therefore, time-varying motion
    noise due to dynamic activities of the user makes it difficult to differentiate
    from real blood flow-related variations. The ear, lower or upper arm, and wrist
    are the popular wearable device locations. The earlobe is the best place among
    them as it can provide the best quality signals with minimum affect from the motion
    artifacts. However, the wrist should be choice for wearable devices to ensure
    the acquisition of better quality motion-free signals, while the upper arm or
    forearm can be the better option, compared to the wrist, for higher signal-to-noise
    (SNR) PPG signal acquisition as there is a higher density of blood vessels close
    to the surface of the skin. There is a wide variety of skin tones present among
    the world population and there are six classes among them according to Fitzpatrick
    Scale [58]. Skin tone variation changes the pattern of absorption. PPG sensor
    depends on the skin tone of the user''s wearing the sensor. Darker skin will absorb
    more green light and will make it hard to produce reliable PPG signals and thereby
    other metrics. One of the major challenges of these wearable devices is observed
    with periodic activity. Most often periodicity of this activity falls with the
    range of heartbeats. The process of delivering blood to the capillary bed is called
    perfusion, which significantly varies among the population particularly with diabetes,
    heart problem, obesity, and other arterial problems.'
  merge: -1
  img_proc: true
