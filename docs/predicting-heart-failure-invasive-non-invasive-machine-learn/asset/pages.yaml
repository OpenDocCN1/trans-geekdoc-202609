    | | Diastolic (PADP) | 8–15 mmHg |

    | LA pressure sensor | Left Atrial Pressure (LAP) | 6–12 mmHg |

    | Intrathoracic impedance monitoring | Thoracic Resistance | 200–5000 Ω cm |'
