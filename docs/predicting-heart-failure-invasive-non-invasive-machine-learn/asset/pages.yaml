    # 11.3.5 Commercially Available Devices for Heart Failure Treatment


    Invasive devices which can help in reducing the risks in severe heart failure
    patients and reduce the chances of open-heart surgery are available on the market.
    Some of the newly FDA-approved devices that can help extensively in repairing
    heart failures are given in this section. First, is the LV assist device, HeartMate3,
    introduced by Abbott and approved by the FDA in October 2018. HeartMate3 has shown
    its effectiveness in multiple studies – a feasibility study and ELEVATE. Abbott''s
    MitraClip can be used for advanced heart failure and mitral regurgitation also.
    The Impulse Dynamics Optimizer Smart System is used to strengthen the heart to
    beat on its own. Shunts are common in treating CHFs. Two shunts – Corvia''s InterAtrial
    Shunt Device (IASD) and V-Wave InterAtrial Shunt Device are currently being considered
    by the FDA and clinical studies are ongoing.


    # 11.4 Discussion


    Early detection of the onset of CHF is crucial to reduce the number of hospitalizations,
    which in turn may become a burden to the healthcare system. Heart failure affects
    not only the healthcare system but also the life quality of patients. Many research
    studies conducted in the literature have displayed the effectiveness of non-invasive
    methods for monitoring heart failure patients. Among these, body weight measurement
    using a weighing scale seems to be the cheapest solution. However, body weight
    measurement for detecting fluid retention alone is not sufficient to differentiate
    the health conditions of heart failure patients. Instead of relying on body weight
    measurement, recent studies have examined the possibility of bioimpedance sensors
    for measuring body recomposition and detecting water retention. Furthermore, radio
    frequency sensors have also shown their effectiveness in estimating pulmonary
    fluid levels.


    Most non-invasive monitoring devices rely on internet services for data transmission
    and patient monitoring. Even though existing devices are equipped with the capability
    to store the data locally in the absence of the internet and transmit it to the
    remote server once the internet connection is restored, steady internet service
    is required in the patient''s premises for the uninterrupted working of the monitoring
    system. The lack of uninterrupted internet services in rural areas hinders the
    usage of these devices. Various physiological values, including BP, heart rate
    variability, ECG, etc., are combined in multiple research works to remotely monitor
    heart failure patients and obtained results have shown the monitoring effectiveness.
    Currently, smartwatches and smart wearables have sensors for measuring pressure,
    heart rate variability, ECG, etc. Some studies have found that the sensors embedded
    in smartwatches have acceptable accuracy. However, more studies about these embedded
    sensors are required to show their efficacy for heart failure monitoring tasks.'
