    # 10.5.5 Echocardiography


    Echocardiography has a crucial role in the diagnosis and treatment of CVDs and
    correct quantitative evaluation of cardiovascular functions and structures. AI
    is successfully applied in automated measurement features including left ventricular
    EF, chamber dimensions, wall thickness, etc. (Figure 10.9) [57, 58].


    AI tools, specifically ML, offer new possibilities of better accuracy in interpreting
    the image in clinical echocardiography practice. ML models reveal different features
    in an image, identifying a range of disease patterns by considering each pixel
    in the image and its connections [59]. These models interpret the unused data
    generated by multidimensional imaging techniques like 3D echocardiography and
    speckle tracking, thereby significantly reducing the analysis time and improving
    reproducibility [43].


