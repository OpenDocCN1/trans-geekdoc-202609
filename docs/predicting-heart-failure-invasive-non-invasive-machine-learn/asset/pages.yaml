    Biosensors are used to measure a chemical or biological reaction by generating
    signals proportional to the amount and concentration of the analyte. Portable
    biosensors take the blood or serum to analyze different factors for analyzing
    and monitoring patients’ care. The detection of pregnancy by human chorionic gonadotropin
    (hCG) using colorimetric pregnancy tests is the best example of portable biosensors.
    Wearable biosensors can be used to detect heart rate, BP, respiration rate, skin
    temperature, and brain activity. The accuracy and stability of the wearable biosensors
    are questionable. The privacy, security, and storage of the data collected by
    the biosensors is another factor to be considered. Invasive devices like pressure
    sensors have better accuracy and longer-term reliability compared with biosensors
    [62].


    # 11.3.4 Intrathoracic Impedance Monitoring


    Fluid overload is a common problem faced by heart failure patients and in severe
    cases can lead to hospitalization. Intrathoracic impedance monitoring can be correlated
    with fluid overload and can help in preventing hospitalization. The intrathoracic
    impedance is inverse to the pulmonary capillary wedge pressure and fluid balance.
    A decreased value of intrathoracic impedance indicates the onset of decompensation
    [63].


    The OptiVol Fluid Status Monitor developed by Medtronic Inc. is used to monitor
    intrathoracic impedance. The impedance is measured over a period of 14 months
    to help the physician make informed decisions. A coil to the Can pathway is implanted
    in the thoracic cavity using the Consulta™ CRT-P. After measuring the impedance
    values for the entire day, the average impedance value is calculated. From all
    the available values, a reference impedance value is decided. The following clinical
    trials have been conducted to study the practical utility of OptiVol: MID-HeFT
    Trial [63], PARTNERS HF [64], OFISSER [65], FAST [66], and CONNECT [67]. The St.
    Jude Medical (SJM)'
