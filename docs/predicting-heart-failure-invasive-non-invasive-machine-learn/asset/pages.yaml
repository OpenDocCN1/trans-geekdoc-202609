    of a convolutional neural network (CNN) and a fully convolutional network (FCN).
    The system goes through two deep learning models. The first divides the common
    carotid artery from the ultrasound images into two categories: the rectangular
    wall and non-wall patches. Then, the region of interest is analyzed and fed to
    the second stage, which identifies features in order to calculate the carotid
    IMT and the plaque total.


    The work in Biswas, Kuppili, et al. [26] combined both the CNN algorithm and the
