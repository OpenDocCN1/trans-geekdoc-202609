  md: 'complete metabolic profile for levels of serum electrolytes (including sodium,
    potassium, calcium, and magnesium), serum urea nitrogen, serum creatinine, glucose,
    fasting lipid profile, and thyroid-stimulating hormone. Moreover the kidney and
    liver function have to be tested [28]. Apart from a detailed medical history,
    the electrocardiogram (ECG) is fundamental to reveal arrhythmias, conduction delays,
    or ischemia, while the echocardiogram is also a standard test to confirm systolic
    or diastolic dysfunction [29]. Also, the initial evaluation may include a chest
    X-ray, a coronary angiography (or a computed tomography coronary angiography (CTCA))
    when coronary artery disease is suspected. In addition, cardiac magnetic resonance
    (CMR) imaging has become a very useful tool for investigating HF due to its a
    high spatial resolution and the use of late gadolinium enhancement (LGE) [30,
    31]. Static images using T1 and T2 weighted black blood algorithms are valuable
    for tissue characterization. With CMR, clinicians are informed about anatomic
    structures, perfusion, and ventricular function while LGE can specify the exact
    causes of HF, depending on the pattern of scar formation such as amyloidosis,
    sarcoid, eosinophilic myocarditis, etc. and provide important prognostic information
    beyond other biomarkers [32, 33].


    The measurement of serial natriuretic peptide (B-type natriuretic peptide (BNP)
    or N-terminal pro–B-type natriuretic peptide (NTproBNP)) is also included in the
    HF-specific laboratory tests (specifically in patients with suspected HF) in order
    to address the management of HF. According to the European Society of Cardiology
    (ESC) [5], systolic HF can be effectively ruled out with the levels of BNP or
    NTproBNP. As BNP levels increase, the specificity increases and the diagnosis
    of HF becomes easier [34]. Standard management of the HF patient involves a follow-up
    2–12 times a year and patients are advised to self-monitor their weight and symptoms.


    # ## 9.1.2 Applications of ML in HF


    # ### 9.1.2.1 ML in Medicine


    Medicine has always been characterized by (big) data that is suitable for the
    application of ML. ML is appropriate to clinical research since it is more flexible
    than traditional statistical methods. ML provides great potential for healthcare
    experts to exploit massive amounts of data from numerous sources, integrate them
    in a single system, curate them, and provide assessment and recommendations.


    ML models have the potential to improve healthcare efficiency in numerous ways.
    Prognostic models could empower healthcare experts to select better treatment
    options for their patients. Additionally, diagnostic models could be used in screening,
    risk stratification, and recommending appropriate tests. This would decrease the
    burden on clinicians, save resources, and reduce costs.


    According to Obermeyer and Emanuel [35], increasing the ability to transform data
    into knowledge will affect at least three areas of medicine: (i) it will dramatically
    improve prognosis, (ii) it will improve diagnostic accuracy and (iii) it will
    reduce much of the work of radiologists and anatomical pathologists, since these
    clinicians mainly focus on analyzing digitized images that can easily be processed
    by algorithms instead.


    ML techniques can be grouped into two subcategories: supervised learning and unsupervised
    learning [36, 37]. In supervised learning, the model is trained by having as input
    a data set comprised of instances; every instance has a known outcome. The data
    set may'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'consist of various features (discrete or continuous). The goal of the model
    is to predict a certain output that can also be discrete or continuous. In the
    case of a discrete output, we are referring to a classification problem and in
    the case where the output has a continuous value (range), we have a regression
    problem. By contrast, in unsupervised learning there is not a single output to
    predict; the data are unlabeled. The algorithms try to find patterns in the data.
    Clustering, the most common application, uses algorithms that try to group data
    in clusters based on similarities they might have.


    Early diagnosis of HF, outcome prediction, hospital readmission, and mortality
    prediction in HF patients are the areas that benefit from the application of supervised
    ML techniques in the medical field with a discrete outcome.


    # 9.1.2.2 ML Applications in HF Diagnosis/Prediction


    Models based on ML techniques can be useful in helping physicians in HF diagnosis.
    Several studies have been conducted to build a model that can diagnose and detect
    HF at an early stage based on various ML algorithms (Table 9.1).


    In 2010, Yang et al. [38] proposed a model based on support vector machines (SVM)
    to diagnose HF at an early stage using 289 patient cases. Samples were classified
    into three groups: the control group (70 subjects), the HF-prone group (59 subjects),
    and the HF group (160 subjects). The accuracy of the model was 87.50% and 65.85%
    in identifying subjects in HF-prone group and HF group, respectively. In 2012,
    Son et al. [39] tested an approach that combined rough set (RS)-based model with
    decision trees on 88 control subjects and 71 subjects with congestive HF. In their
    study, they utilized data with no missing values and features consisting of demographics
    information and clinical laboratory findings. The experimental results showed
    that their method performed with an accuracy of 97.50%, sensitivity 97.20%, and
    specificity 97.70%. In 2017, Choi et al. [40] applied deep learning (DL) methods
    and more specifically implemented a recurrent neural network (RNN) for the early
    detection of HF in 3884 HF subjects and 28,903 controls using electronic health
    record (EHR) data. The EHR data set included demographics, habits, clinical and
    laboratory findings, medications, and International Classification of Diseases
    (ICD)-9 codes. Their model achieved 77.70% area under the ROC curve (AUC), with
    a 12-month observation window, higher than regularized logistic regression (LR),
    neural network (NN), SVM and K-nearest neighbor (k-NN) classifier approaches.
    More recently, in 2020, Le et al. [41] implemented a multilayer perceptron (MLP)
    NN achieving an accuracy of 88.00%. The data set (299 subjects) they utilized
    comprised demographics, laboratory findings, lifestyle habits, and ejection fraction.
    Also in 2020, Potter et al. 2020 [42] applied the RF classifier to build a model
    able to predict Stage B HF based on energy waveform ECG. They utilized 254 subjects
    as the training set (135 with HF, 119 controls) and 65 subjects as the test set
    (27 with HF, 38 controls). Their model achieved AUC 76.00%, sensitivity 93.00%,
    and specificity 61.00%. Pecchia et al. [43] conducted a study utilizing the short-term
    heart rate variability (HRV) measures. They analyzed 1914.40 hours of ECG signals
    from 83 patients, of which 54 were used as controls and 29 were subjects suffering
    from chronic HF with NYHA classification I, II, and III. They designed a classifier
    based on the classification and regression trees (CART) method with 94.80% accuracy,
    89.70% sensitivity, and 100% specificity on identifying normal subjects vs. subjects
    with NYHA classification I, II and III.'
