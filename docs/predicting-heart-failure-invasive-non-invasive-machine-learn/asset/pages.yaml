    of studies that can be seen as subcutaneous interventions, non-invasive methods
    refer to procedures performed outside the body, for example measuring blood pressure.


    # 1.3.1 What are Invasive and Non-Invasive Procedures?


    The invasive procedure – also called invasion – involves opening veins that are
    usually closed, stenting, needle procedures, and the like. Invasive procedures
    are generally performed by applying a physical effect to the body. For example,
    operations that cause an incision in the body, such as open surgery, are this
    type.


    Apart from invasive procedures, there are also non-invasive and minimally invasive
    methods. As a medical term, the invasive procedure is used for situations requiring
    surgical intervention, while non-invasive procedure is the name given to situations
    that do not require surgical procedures and do not need any intervention such
    as cutting or piercing the body. Measurement of a patient''s blood pressure and
    temperature are just two examples of the non-invasive method.


    Minimally invasive procedure refers to invasive studies performed in a very narrow
    area, in a very short time, and with little effect. For example, endoscopic interventions
    are known as minimally invasive methods and while taking blood from a vein for
    analysis is invasive, taking blood from a small incision in the tip of the finger
    is known to be minimally invasive.


    # 1.3.2 Diagnosis by Invasive Procedures


    There are many invasive procedures in use, including surgical interventions. Tens
    of millions of invasive procedures are performed on patients worldwide almost
    every year [3].


    One of the invasive tests for heart conditions is blood tests. Within the scope
    of blood tests, cardiac enzymes, C-reactive protein (CRP), fibrinogen, homocysteine,
    lipoproteins, triglycerides, brain natriuretic peptide (BNP), and trothrombin
    values are checked. Blood tests can confirm whether a heart attack has occurred,
    the extent of damage can be predicted, future risk can be found, and general information
    on blood clotting can be obtained [4].


    One of the tests that should be considered within the scope of blood tests is
    the troponin test, which is a method that can determine the risk of heart attack
    in healthy individuals. What is tested is the amount of troponin protein that
    is released when the heart muscle is damaged. Based on this measurement, the cases
    likely to have a heart attack in the coming years can be predicted.


    Another invasive technique is known as heart catheterization. The inside of the
    heart and blood vessels are imaged using special x-rays called angiograms. A thin
    hollow tube, a catheter, is guided through a blood vessel in the arm, groin, or
    neck toward the heart. Dye is injected into the blood vessels through the catheter,
    thus enhancing the image quality of the x-ray. This process takes 2–3 hours on
    average and, through angiography, can lead to an understanding of what caused
    the chest pain – angiography can reveal'
