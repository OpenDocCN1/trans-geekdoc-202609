    # 8.6 HF Diagnosis Using Biopsy Images


    The diagnosis of HF usually relies on physical examination, lab tests, and clinical
    history. However, in some patients, these diagnosis methods fail to identify signs
    of HF. Alternatively, endomyocardial biopsy (EMB) is the gold standard for identifying
    and grading HF. Nirschl et al. proposed an automated deep learning model for the
    recognition of HF from whole slide images of hematoxylin and eosin (H&E) tissue
    [44]. The introduced neural network architecture is an adaptation of the work
    of Janowczyk and Madabhushi [45]. The network is formed by alternating convolutional,
    batch normalization, and rectified linear unit (ReLU) activation layers. The model
    has more than 13,000 tunable weights trained based on a data set of 1144 regions
    of interests (ROI) from 209 whole slide images from 94 patients with HF and 115
    subjects without HF. Several CNN architectures were used such as AlexNet, GoogLeNet,
    ResNet50, and ResNet50. These models were compared with the traditional feature
    engineered approach using WND-CHARM [46]. The latter extracts 4059 features and
    an RF classifier is trained based on these features. The held-out test set was
    blindly and independently evaluated by two expert pathologists to compare with
    the ML models. The clinicians were given unlimited time to complete the task.
    Cohen’s kappa inter-rater agreement between the two pathologists was 0.40 with
    an individual accuracy of 75% at patient level. The performance metrics used are
    accuracy, sensitivity, specificity, positive predictive value, and AUC (area under
    ROC curve). The performance of the deep learning model in terms of AUC was 0.97
    compared to 0.95 for RF and 0.75 for the pathologists. The CNN model shows 99%
    sensitivity and 94% specificity. These results are obtained at ROI level. The
    analysis at patient level also showed an advantage of the deep learning approach.


