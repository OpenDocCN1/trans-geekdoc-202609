  md: '# 1.2 Heart Failure


    HF belongs to a class of diseases that occur due to several diseases known as
    heart diseases and can be fatal if left untreated. In this section, HF is defined
    and the factors causing it, its symptoms, and its treatment are examined.


    # 1.2.1 What is HF?


    HF is sometimes known as congestive HF (CHF). HF is not a failure of the heart,
    but a condition in which the heart muscle cannot pump enough blood. It occurs
    due to, for example, narrowing of the coronary arteries, cardiovascular diseases,
    and high blood pressure.


    HF can occur at any age, but is more common in older people. Although it is not
    possible to cure the disease, some of its symptoms can be improved by the correct
    interventions. Conversely, faulty interventions will make the situation worse
    than before.


    The most common symptoms of HF are shortness of breath after movement or during
    rest, fatigue and weakness, swelling in the ankles and legs, disturbed heartbeat,
    persistent cough, and dizziness and the like. Symptoms can develop rapidly (acute
    HF) or gradually over weeks (chronic HF).


    With early intervention for HF, it will be possible for patients to live longer.
    Some measures such as losing weight, reducing stress, and reducing the amount
    of salt used will positively affect the quality of life of patients. One way to
    prevent HF is to prevent and control conditions such as CAD, high blood pressure,
    diabetes, and obesity.


    The activity that will benefit most is diagnosing the disease and conducting studies
    according to the symptoms. Thus, as in many other diseases, early diagnosis will
    have a life-saving effect in HF, as will correct diagnosis and determining the
    type and real cause of the ailment.


    # 1.2.2 Causes of HF


    As mentioned, the causes of HF are CAD, high blood pressure, and other heart diseases,
    and it occurs because of the damage to the heart muscle brought about by these
    and similar conditions. While oxygen is regularly carried to a normal heart, it
    is not possible to carry enough oxygen in the case of a damaged heart. Although
    HF usually occurs on the left side of the heart, it can develop on the right or
    both sides. Table 1.1 lists multiple HF types and their results.


    Some of the prominent causes of HF are:


    +   • **CAD and heart attack**: CAD is the most prominent heart disease and the
    most common cause of HF. The disease occurs when blood circulation is not normal
    due to fat deposits, called plaques, in the blood vessels. Heart attacks are divided
    into mild heart attack and major heart attack. Mild heart attacks occur in a small
    portion of the heart muscle. However, a mild heart attack should be taken seriously
    because it can cause a second attack. Major heart attack affects a large part
    of the heart muscle.'
