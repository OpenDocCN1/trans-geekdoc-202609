  md: '# 11


    # Commercial Non-Invasive and Invasive Devices for Heart Failure Prediction


    A Review


    Jayakanth Kunhoth, Nandhini Subramanian, and Ahmed Bouridane


    # 11.1 Introduction


    According to statistics provided in Roth et al. [1], the total number of cardiovascular
    cases has doubled, and death-related cardiovascular diseases have increased by
    50% globally in the last three decades. Heart failure is a chronic condition where
    the heart fails to pump sufficient blood and oxygen for the body. A report from
    the American Heart Association reveals that one in five people is prone to heart
    failure and 50% of these patients will live a maximum of 5 years after experiencing
    heart failure [2]. The different risks which can lead to heart failures are high
    systolic blood pressure (hypertension), high fasting plasma glucose, high low-density
    lipoprotein cholesterol, high body mass index (BMI), impaired kidney function,
    ambient and household air pollution, tobacco, dietary risks, low physical activity,
    sedentary behavior, alcohol, chronic stress, adverse childhood experiences, and
    excess body/abdominal fat (obesity) [1, 3]. Age, ethnicity, family history/genetics,
    and gender are some of the non-modifiable factors leading to heart failure [3].
    Fatigue, breathlessness, elevated jugular venous pressure, peripheral edema, etc.
    are the common symptoms of heart failure. Chronic heart failures (CHFs) have become
    a burden to current healthcare systems, mainly because of the increased hospital
    admissions. Not only do the admissions themselves increase for acute diseases,
    but frequent visits to the outpatient clinic are also required to monitor the
    status of the patient. Furthermore, during the current pandemic, in-person monitoring
    and frequent hospital visits are not possible, as they are highly risky. Frequent
    testing and analysis of physiological values, as well as the electronic health
    records of individuals, aid in assessing the condition of heart failure patients.
    These health records include various readings such as heartbeats per minute, the
    fluid level in the lungs, the oxygen level in the blood, ejection fraction levels,
    etc.


    Current technological advancements in electronic health record data acquirement
    and management allow the recording of laboratory testing reports, medical imaging
    data, and personal health information into an electronic format with the help
    of multiple sensors. These recorded health data can be further processed to predict
    and monitoring of various conditions and stages of heart failure using mathematical
    models, data mining techniques, and machine learning methods. Numerous efforts
    have been taken over the'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'last decades to improve the quality of service to patients using invasive and
    non-invasive remote monitoring techniques for heart failure. Invasive devices
    are implanted inside the patient''s body. They collect physiological readings
    from the human body and assist the patient with or without remote communication
    from an external source. On the other hand, non-invasive devices include various
    wearables or bands that are externally attached to an individual''s body and record
    important physiological data for predicting heart failure. Currently available
    non-invasive methods for heart failure monitoring include monitoring of the heartbeat
    using electrocardiography, monitoring blood pressure (BP) daily using BP sensor
    devices, bioimpedance monitoring, wearables like smartwatches, pocket devices
    and Fitbits, and mobile health apps for telemonitoring. Invasive devices are effective
    and precise but can be used for limited cases only. Non-invasive methods do not
    need to be implanted and can be used easily with reduced risk, precision [4],
    and other performance metrics. Non-invasive devices are cost-effective and safe
    compared to invasive devices [5].


    In the literature, researchers have proposed several devices [6–9] for monitoring
    and predicting heart failure conditions by measuring various physiological signals
    including heart rate, BP, pulmonary artery pressure, electrocardiogram (ECG),
    etc. This chapter briefly reviews the current invasive and non-invasive devices
    that are commercially available for monitoring the risk and health status of heart
    failure patients.


    # 11.2 Non-Invasive Devices for Monitoring Heart Failure Patients


    Recent advancements in sensor technology have made the development of high-performance,
    low-cost microsensors easier. This has positively impacted the development of
    various non-invasive devices or external devices for assisting heart failure patients.
    External devices for heart failure monitoring include various wearables, such
    as activity bands, smartwatches, ECG patches, and vests that can estimate heart
    rate, BP, and pulmonary fluid levels as well as tracking the activity of the users.
    This section discusses various available external devices for monitoring and predicting
    the risk, hospital readmission, and mortality of heart failure patients.


    # 11.2.1 Electrocardiography


    Electrocardiography is the process of generating an ECG to detect the problems
    in the rhythm of the heart and, by extension, for early prediction of a heart
    attack as well as heart failure. The results of the study conducted by James et
    al. [10] showed that ECG is a simple and useful test for predicting heart failure
    in its early stages. The findings of the study are based on the fact that, unlike
    non-heart failure patients, heart failure patients have “significantly prolonged
    QRS duration, prolonged QT duration, prolonged QTc, and more rightward T wave
    axis.” Moreover, ECG features have been extensively used in the literature to
    detect heart failure. Several artificial intelligence technology-based heart failure
    prediction systems developed in the literature are based on ECG features [11].
    These systems utilize traditional machine learning [12] as well as deep learning
    methodologies [13] for automated prediction of various heart failure conditions
    using patients’ ECG features.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'A few existing deep learning-based systems [14–18] have achieved acceptable
    performance for predicting heart failure with preserved ejection fraction. The
    findings of this research show the efficacy of detecting heart failure using electrocardiography.


    # 11.2.2.1.1 Electrocardiography-Based Monitoring Systems


    There are many types of external electrocardiography-based systems available,
    one of them being the Holter monitor. Holter monitors are small, wearable electrocardiography
    devices that contain multiple electrodes and data recording devices. A general
    diagram of a Holter monitor is given in Figure 11.1.


    The purpose of a Holter monitor is to record the ECGs of an individual over a
    period of time (24–72 hours). Atrial fibrillation [19] is a type of arrhythmia
    predominantly found in patients with heart failure. The recordings from Holter
    monitors enable doctors or physicians to detect arrhythmias, which helps in the
    early diagnosis of heart failure. In certain cases, resting ECG conducted in clinics
    fails to detect heart rhythm abnormalities in patients experiencing early symptoms
    of heart disease. In this scenario, the physician or cardiologist might suggest
    using a Holter monitor for 24–48 hours. Furthermore, patients with a history of
    heart disease or recovered from heart-related surgeries are also advised to use
    Holter monitors for a couple of days. There is very little risk associated with
    wearing a Holter monitors, the only possible risks being associated with having
    electrodes attached to the skin, as the attached electrodes can often cause skin
    irritations. However, the Holter monitor is not water-resistant and patients are
    advised to not bathe or swim while the device is attached to their body for recording
    the physiological values. Moreover, the patients are advised to stay outside the
    proximity of metal detectors, microwaves, or other devices that can break off
    the signals from the electrodes attached to the body. After fitting a Holter monitor
    on a patient’s body, the cardiologist provides the patient with a diary to record
    their activities and symptoms. The patients have to write down all the activities
    they do while wearing the Holter monitor, noting also the exact time when they
    do them. They also have to note in the dairy if they


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_259_0.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'experience any symptoms such as fluttering or skipped heartbeats, chest pain,
    shortness of breath, etc., and the time of occurrence. Once the monitoring period
    is over, the cardiologist will go through the continuous ECG recorded in the device
    over the monitoring period, and carry out a detailed analysis. During the analysis,
    the cardiologist goes through the patient dairy and, for each recorded activity
    as well as a symptom, the ECG recorded in the device at that particular time is
    investigated with the help of computers preloaded with algorithms to discover
    any abnormalities in the heartbeat. So the precise recording of activities and
    symptoms in patient dairy is essential in Holter monitoring and any mistake in
    the recordings can severely affect the result analysis procedure. Medtronic, GE
    Healthcare, and Abbob are the major producers of commercially available Holter
    monitoring devices, with recent devices including many functionalities such the
    ability to communicate directly with patients'' Bluetooth-enabled smartphones
    or PCs.


    Another type of portable ECG-based device is the event monitor. Event monitors
    are similar to the Holter monitors responsible for recording heart signals. However,
    while Holter monitors are configured to record the heart rhythm continuously for
    24 or 48 hours, event monitors are used to record the heartbeats when the patient
    activates them. Some of the event monitors available on the market can automatically
    turn on the heartbeat recording when an abnormal heart rhythm is identified. Event
    monitors are available in many types, with symptom event monitors and memory looping
    event monitors being the most common. Symptom monitors record the heart''s electrical
    signal after activation, while memory looping monitors record data from a few
    minutes before the activation. This feature of memory looping monitors provides
    additional information for doctors to analyze the heart condition. Mobile cardiac
    telemetry (MCT) devices are similar to Holter monitors and event monitors, but
    they are equipped with more advanced features to provide real-time assistance
    for patients. The general workflow of MCT devices is shown in Figure 11.2.


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_260_0.png)


    Figure 11.2 General workflow of MCT devices.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The ECG patch or multisensory patch attached to the patient’s body will record
    multiple sensors’ data or ECG data and send it to the mobile device installed
    with a software application via Bluetooth or WiFi. The mobile device software
    is configured to transmit the data to the monitoring center via the internet.
    The monitor center will receive the data and analyze it to ensure that there is
    no abnormal event. If any abnormal events are detected, the monitor center will
    provide emergency instructions to the patient with the help of a qualified doctor.
    Unlike Holter monitors, MCT devices can be attached to the body of the patient
    for recording the heart rhythm for up to 30 days. Several research studies have
    been conducted to demonstrate the benefits of MCT devices over event monitors
    and Holter monitors. The comparative study conducted by Tsang and Mohan [20] shows
    that the diagnostic yield of arrhythmia is significantly higher in patients monitored
    with MCT devices compared to the patients monitored with event monitors and Holter
    monitors. The study was conducted on a total of more than 200,000 patients over
    a 5-year period.


    Both MCT devices and Holter monitors are designed to assist the cardiologist in
    monitoring patients with heart diseases. However, there are distinctive differences
    between them in terms of the monitoring period, recording method, data storage,
    data analysis, size of devices, etc. In the case of the monitoring period, usually,
    the Holter monitors are configured to monitor the heart activity for a maximum
    of 72 hours while MCT devices are assigned for 30 days. There are exceptions in
    the Holter monitor’s monitoring period. In a few cases, the Holter monitors are
    prescribed for 7–14 days. Compared with MCT devices, the limited wear time of
    the Holter monitor reduces the inconvenience to patients caused by monitoring
    devices. However, the extended wear time of MCT devices is beneficial for asymptomatic
    patients in certain cases, for example detecting arrhythmia that may not occur
    during the short period in which a Holter monitor is being worn. Generally, the
    Holter monitoring is conducted in a manner where the device is assigned to record
    the heart activities for a given period and the data recorded in the device are
    analyzed once the monitoring period is over. In Holter monitors assigned for 7–14
    days, any abnormalities recorded during the monitoring period will not be addressed
    and analyzed till the monitoring period is over and the device is returned to
    the clinic. On the other hand, the MCT devices are configured to continuously
    record the heart activity and send the recorded data to the server or remote analysis
    center for instantaneous analysis. The instantaneous recording and monitoring
    capability of MCT devices enable immediate assistance for the patient if any abnormalities
    are detected. In this context, MCT devices are more beneficial than Holter monitors
    for patients with a history of heart failure symptoms as well as for patients
    suffering from acute heart failure conditions.


    In traditional Holter monitors, the data are stored locally using an internal
    chip. Local storage is enough for the Holter monitor due to the short monitoring
    period. In old devices, cassettes were used to store the recorded data. Some of
    the latest Holter monitors have the functionality to backup and store the recorded
    data in the cloud. The MCT devices allow both local and cloud storage. Usually,
    the data are sent to the cloud for immediate analysis. However, certain conditions,
    such as the absence of internet connectivity, affect the cloud storage process.
    In this case, the data is stored locally and transferred to the cloud once internet
    connectivity is restored. Moreover,'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the latest devices are equipped with the functionality to transmit the data
    to personal computers and smartphones. The Holter monitors are bulkier compared
    with MCT devices and require more wires as well as leads;the latest MCT devices
    are very small and devoid of wires.


    Many companies like ACS Diagnostics, Biotelemetry, and Medicomp are producing
    different commercial MCT monitoring systems according to the needs of the patients.
    Further, the recent systems can provide real-time analysis and assistance to patients.
    In addition, multifunctioning MCT systems which have multiple functionalities,
    such as MCT monitoring, Holter monitoring, event monitoring, etc., are currently
    available on the market. ACS Diagnostics, the leading MCT developer in the US
    has released a multi-functional MCT device named Core¹². The company reports that
    it is the first of its kind of multifunctional device to be approved by the US
    Food and Drug Administration (FDA). The single device ACS Core¹² provides a resting
    12-lead ECG test, 24 hours Holter monitoring, event monitoring, and MCT monitoring.


    # 11.2.2 BP and Heart Failure


    Hypertension is one of the main causes of cardiovascular disease and its associated
    risks, including death. Many previous research studies have shown that hypertension
    will worsen the condition of heart failure patients and it is essential to maintain
    an optimum BP value [21]. In this context, the daily BP measurement of an individual
    diagnosed with heart failure is required. Frequent BP readings and reporting them
    to the doctor help to reduce the impact and risk of hypertension in patients with
    heart failure. Many home-based and clinical-based BP sensing devices are currently
    available. Most of the home-based BP sensing devices are small in size, portable,
    and affordable. An individual with minimal technical knowledge can operate these
    devices to measure BP. However, the accuracy of home-based BP systems is still
    a concern. A cross-sectional study was conducted by Ruzicka et al. [22], analyzing
    the accuracy of home BP devices. The result of the study suggests that home BP
    monitoring can aid in the early detection of hypertension. But the inaccurate
    readings of several of the available devices can adversely affect hypertension
    management and cause risks related to hypertension.


    BP can be controlled naturally in many ways. Overweight is one of the main causes
    of raised BP. Reducing body weight lowers BP, as can increased activity and daily
    exercise. Increased activity and daily exercise will increase the heart rate and
    breathing rates which make the heart stronger and thereby less effort is required
    by the heart to pump. Proper diet can have a big impact on lowering BP. Controlling
    sodium intake can lower BP in healthy individuals, while increased potassium intake
    can reduce the effect of sodium in the body and lowers BP. Individuals with high
    BP are advised to have potassium-rich foods like low-fat dairy products, fish,
    fruits, and vegetables such as avocado, orange, banana, tomato, greens, etc. Smoking
    can cause sudden fluctuations in BP and continuous use of tobacco products can
    cause damage to the lining of artery walls and increase BP. Stopping smoking can
    reduce BP as well as increasing overall health. Excess stress control and restful
    sleep for at least 8 hours per day can also lower BP to an extent.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 11.2.3 Body Weight Monitoring and Heart Failure


    Body weight is considered to be one of the factors for predicting whether a heart
    failure condition is getting worse or not. It is based on the fact that heart
    failure leads to the accumulation of fluid (edema) in the body followed by rapid
    weight gain [23]. The rapid weight gain due to edema can lead to urgent hospitalization
    and, in the worst case, to death. Usually, diuretic therapy is recommended for
    hospitalized heart failure patients due to fluid retention and rapid weight gain
    [24]. The Heart Failure Society of America advises heart failure patients to monitor
    their body weight daily and report to the doctor if any abnormality is found [25].
    The body weight measurement tool is an invasive device that can be used to measure
    fluctuations in body weight. Advanced body weight measurement tools are equipped
    with innovative features to aid body weight data collection and the ability to
    share the data across multiple mobile devices.


    Even though edema is a symptom of heart failure, monitoring body weight alone
    will not aid in managing heart failure patients. A research study conducted in
    2009 by Zhang et al. [23] examined the effect of body weight alone in monitoring
    heart failure patients. The study focused on analyzing how well weight gain algorithms
    can predict hospitalization in patients with worsening heart failure conditions.
    Three algorithms were compared in the study, with two of the algorithms being
    very simple and triggering an alert when the weight gain was, respectively, over
    1.4 kg or 2.2 kg in a day. The third algorithm analysed the short-term weight
    gain average and long-term weight gain average to trigger the alert. The 168 patients
    who participated in the study were advised to measure their body weight twice
    a day: before breakfast and before the evening meal, after emptying the bladder,
    while wearing light clothes and no shoes. Among the analyzed algorithms, the third
    one, based on the average of short-term weight and long-term weight, displayed
    better performance. In that context, body weight alone is not beneficial for telemonitoring
    heart failure patients. However, integrating body weight along with other physiological
    readings, such as ECG or heart rate, can improve the precision of the tele-monitoring
    systems.


    Body mass index (BMI) is one of the crucial indirect indicators for heart disease.
    BMI and BP values are closely related. Higher BMI values are demonstrated as an
    independent risk factor for hypertension, and hypertension is one of the important
    risk factors for heart diseases. The relation between BMI value ranges and their
    associated disease risks for adults older than 20 years is given in Table 11.1.


    Table 11.1 BMI value ranges and associated health risks.


    | BMI Range | Category | Associated Health Risks |

    | :--- | :--- | :--- |

    | < 18.5 | Underweight | Osteoporosis, anemia, skin, hair problems |

    | 18.5–24.9 | Normal weight | Low risk for heart disease (but there is a higher
    risk if there is a bad cholesterol level and triglyceride levels are high), diabetes
    |

    | 25–29.9 | Overweight | High risk for heart disease, hypertension, diabetes |

    | 30 < | Obese | Very high risk for heart disease, hypertension, diabetes, kidney
    disease |'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'It is clear from Table 11.1 that individuals falling into the overweight and
    obese categories have a high risk for heart diseases. However, individuals with
    normal weight categories also have a risk for heart disease if their cholesterol
    levels are not normal. Moreover, the risk of heart disease depends not only on
    BMI, but also on other factors such as lifestyle, smoking, sleeping hours, etc.


    # 11.2.4 Bioimpedance Monitoring and Heart Failure


    Bioimpedance analysis is a leading and economically feasible method utilized for
    estimating body composition as well as health monitoring. Bioimpedance analysis
    estimates the total body fluid and aids in monitoring the fluid levels in the
    human body. Heart failure patients can benefit from the application of bioimpedance
    analysis, which is based on the electrical properties of the human body. It measures
    how well the body resists the flow of electrical signals when a small electric
    current is passed through it. The fats in the body have a high resistance against
    an electric current, while the water has low resistance. There are multiple types
    of bioimpedance analysis systems available, including systems which are focused
    on estimating the body composition of the lower body alone (leg-to-leg bioimpedance
    analysis), upper body alone (hand-held bioimpedance analysis), and the whole body
    (hand-to-foot bioimpedance analysis). The general workflow of a hand-to-foot bioimpedance
    analysis system is shown in Figure 11.3. The system comprises multiple electrodes,
    with some placed under the feet and the rest attached to the hand. A weak or small
    electric current is transmitted from the electrodes in the feet to the abdominal
