    observations act as test observations. Accordingly, each iteration''s performance
    errors are calculated, and the average performance is calculated at the end of
    validation.


    # 7.4.1 Data Sets Description


    Two data sets were used in this study. The first one was obtained from the Cleveland
    Clinic Foundation [38] and contained 303 records; 297 are complete and 6 have
