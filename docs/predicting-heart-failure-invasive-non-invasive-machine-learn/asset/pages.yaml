    of smart bands were found to be in a range of 75.4–97.0% and 94–100%, respectively,
    while smartwatches showed a sensitivity of 67.7–100% and a specificity of 67.6–98%.


    There have been studies that proposed the use of selfies and machine learning
    models to detect heart abnormalities such as coronary artery diseases (CADs).
    Facial appearance has long been identified as a marker of cardiovascular risk,
    with features such as male pattern baldness, earlobe crease, xanthelasmata, and
    skin wrinkling being the most common predictors. Information extracted from the
    analysis of an individual’s facial photo utilizing the proposed technology can
    unquestionably benefit the individual, the attending physician, and the healthcare
    system altogether. Early detection of individuals at risk for CAD can initiate
    lifestyle and other personal mitigation approaches, guide medication treatment,
    and inspire a novel approach in diagnostic testing and screening algorithms for
    the general population. Despite these challenges, the full potential of such novel
    and out-of-the-box diagnostics lies ahead to the research community. The framework
    proposed in [77] suggested the use of facial images and deep learning techniques
    for early detection of patients with risk of CAD (Figure 13.11).


    Lin et al. [78] evaluated this framework, where they conducted a multicenter cross-sectional
    study of patients undergoing coronary angiography or computed tomography angiography
    at nine Chinese sites to train and validate a deep convolutional neural network
    for the detection of CAD (at least one > 50% stenosis) from patient facial photos.
    The performance was compared with radiologist diagnosis. Results concluded that
    a deep learning algorithm based on facial photos could assist in CAD detection
    in the Chinese cohort. This technique holds promise for pre-test CAD probability
    assessment in outpatient clinics or CAD screening in the community. Table 13.2
