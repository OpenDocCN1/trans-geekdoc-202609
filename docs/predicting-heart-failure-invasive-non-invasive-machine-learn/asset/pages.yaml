- pgno: 294
  md: 'Pulse oximetry constitutes a clinically standardized method for non-invasively
    assessing the pulse oxygen saturation level, SpO2, in order to evaluate the presence
    of hypoxemia commonly associated with acute HF. Pulse oximetry has been shown
    to be useful in diagnosing HF in acute settings such as myocardial infarction
    [111]. While there are multiple commercially available wearable pulse oximetry
    devices like the Masimo MightySat, VitalPatch, EQ02 + Lifemonitor, and VinCense
    WHMS, that offer user-friendly monitoring of the SpO2, as well as the pulse rate,
    many of these lack comprehensive cardiac monitoring to detect abnormal rhythms
    and ischemic events, making them insufficient to assist patients at risk, by detecting
    early warning signs of adverse cardiopulmonary events. Another convenient wristband-based
    SpO2 monitoring device is the Spryhealth Loop, which has been designed specifically
    for use by seniors and offers easy assessment of SpO2 levels, as well as HR and
    respiration. Furthermore, newer devices, like the Everion, which promise a more
    complete physiological assessment by monitoring 22 vital signs, are being investigated.
    Similarly, Current Health has designed a mobile monitoring device for continuous
    SpO2, temperature, heart rate, respiration, and movement measurements, for detection
    of warning signs of health deterioration.


    A 2019 study applied DL on medical data acquired from an internet of things (IoT)
    wearable medical device and successfully predicted heart disease with 99.03% accuracy
    [112]. A higher order Boltzmann deep belief NN was utilized to extract features
    from patients’ physiological data such as ECG, heart rate, blood pressure, peripheral
    pulse oximetry (SpO2) level, glucose level, blood fat level, and pulse rate, acquired
    using the wearable IoT device and stored on cloud servers, to predict heart disease
    by recognizing abnormal heart patterns in just 8.5 seconds [112]. Another multicenter
    study, LINK-HF [15], evaluated the accuracy of non-invasive remote monitoring
    in predicting HF rehospitalization using a wearable multisensor chest patch interconnected
    with a smartphone to continuously upload data to a cloud analytics platform. A
    similarity based ML model detected HF exacerbation and provided early detection
    of impending rehospitalization with a sensitivity ranging between 76% and 88%,
    and specificity of 85% [15]. This met the sensitivity and specificity thresholds
    aimed at for reliable prediction of HF hospitalization (≥70% sensitivity and 85%
    specificity), and was comparable to the predictive ability achieved by implantable
    devices, such as in the MultiSENSE study (70% sensitivity) [75].


    In 2020, a pilot study by Shah et al. [113] aimed to predict HF using PPG and
    accelerometry data acquired from a wearable wristband; using a combination of
    demographics, medical history, vital signals, and data from the wearable, an SVM
    based ML model was able to classify HF with a 0.8 AUC, 72% specificity, and 90%
    sensitivity [113]. In another study, a novel wearable seismocardiogram and ECG
    sensing patch was utilized by Inan et al. [17] to assess the clinical status of
    HF patients; using an ML based graph analytic technique, they generated a graph
    similarity score that was able to differentiate between decompensated and compensated
    HF and also track differences in the clinical progress of the decompensated patients
    from the time of admission to discharge [17]. Similarly, Green et al. [101] demonstrated
    the application of a multi-instance ML classifier in detecting obstructive hypertrophic
    cardiomyopathy using a combination of PPG signals acquired from a wearable biosensor
    and echocardiograms, with a C-statistic of 0.99 (95% CI: 0.99–1.0).'
