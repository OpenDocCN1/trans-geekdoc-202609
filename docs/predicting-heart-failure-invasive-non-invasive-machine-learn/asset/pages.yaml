  md: 'labeling large data sets [25]. Semi-supervised learning provides the ability
    to extrapolate and label a large data set from a smaller, manually labeled data
    set. This is performed by manually labeling a small portion of data and then employing
    unsupervised learning algorithms to extrapolate from this data. Generative adversarial
    networks (GAN) are a commonly used semi-supervised technique that employs two
    neural networks: a generator and discriminator [1, 2, 25]. Generators are trained
    to synthesize plausible data points as outputs, and the discriminator is a typical
    convolutional neural network that aims to distinguish between fake and real data
    [7].


    # 6.2.2.3.1 Examples of Semi-Supervised Learning in Cardiology


    Semi-supervised learning is a more novel technique that requires knowledge of
    various learning techniques. Several studies have employed this in cardiology
    that have focused on using semi-supervised ML algorithms to quantify chamber dimensions
    on echocardiography. An example are algorithms developed to automatically quantify
    left atrium (LA), LV volumes, and LVEF from 3D TTE images [26, 27]. One study
    applied this algorithm to 159 patients and found automated LVEF measurements using
    a semi-supervised algorithm had a strong correlation both with manual 3D volumetric
    measurements from three readers (r = 0.87–0.96) and with cardiac magnetic resonance
    (CMR) (r = 0.84–0.95) [26]. Another example is a study which included apical four-
    and two-chamber views from 255 patients across four centers and applied a semi-supervised
    ML algorithm to assess EF and LV longitudinal strain. The fully automated algorithm
    was compared with manual estimation, and the study found the algorithm to be feasible
    in 98% of studies with an average analysis time of 8 seconds per patient [27].


    # 6.2.2.4 Reinforcement Learning


    Reinforcement learning is a technique in which an algorithm is trained to learn
    an action that gains maximum reward. The algorithm is given input data and a specific
    outcome to optimize, learning through trial and error. This technique is seldom
    used in cardiology, but is more commonly used in computer gaming programs; a notable
    example is AlphaGo (a computer program that uses reinforcement learning to play
    Go) [1]. However, one example of reinforcement learning in cardiology is a study
    which aimed to use this technique to detect eight anatomical landmarks, including
    bony structures, organs, and vessel bifurcations, from 1487 3D-CT scans from 532
    patients [28].


    # 6.2.3 Deep Learning


    Deep learning is another subfield of ML of which artificial neural networks (ANNs),
    recurrent neural networks (RNNs), and convolutional neural networks (CNNs) are
    the most commonly used techniques [25]. In comparison with traditional ML algorithms,
    deep learning requires minimal data arbitration or feature engineering (Figure
    6.4). Feature engineering is a key step in building an ML model and consists of
    extracting all the required features for a problem statement (feature extraction)
    and selecting the most important features that will improve the ML model (feature
    selection). Deep learning automates the process of feature engineering and interrogates
    the input data directly. ANNs are modeled on the neural structures of the brain
    and consist of interconnected perceptrons with varying weights, indicating the
    strength of each connection (Figure'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_161_0.png)


    # Figure 6.4 Comparing ML and deep learning.


    6.5). By providing an ANN with a large training data set, these weights are fine-tuned,
    and the ANN is optimized to better establish the relationship between input and
    output [7]. ANNs typically consist of three layers – input, hidden, and output
    layer – and process inputs in a forward direction to solve problems related to
    tabular, image, or textual data [25]. ANNs can use many hidden layers to produce
    increasingly abstracted and non-linear representations of underlying data [1].


    When a looping constraint is applied to a hidden layer of an ANN, it becomes an
    RNN [7]. RNNs are particularly well suited to processing sequential data, such
    as speech and language.


    CNNs are fully connected neural networks that have learnable weights and biases.
    They employ kernels for automatic feature extraction which are a series of convolutional
    operations which progressively extract relevant features. CNNs are particularly
    useful in processing large and complex data sets such as imaging data [25]. Traditional
    ML algorithms struggle with imaging data as they are highly dimensional, and it
    is extremely difficult to assign individual weights for each feature.


    For example, an image with a pixel size of 750 × 750 and three channels has nearly
    2 million features (750 × 750 × 3). Additionally, a single-pixel does not carry
    enough useful information, but rather a patch of pixels will need to be analyzed
    [1]. Convolutional layers in a CNN attempt to overcome these difficulties. Each
    convolutional layer uses a set of filters that forms a small grid of weights and
    performs a weighted sum nonlinear transformation. The same filter is applied to
    all possible locations in the whole input. In this way, the number of weights
    to train is significantly reduced [7].


