- pgno: 271
  md: '# 11.3.2 PA Pressure Sensors


    Unlike the RV pressure monitoring sensor (the Chronicle IHM), PA pressure sensors
    measure the diastolic PA pressure directly. The CardioMEMS (Cardio-Microelectromechanical)
    HF System developed by Abbott, St. Sylmar, CA, is a PA pressure sensor that is
    placed in any branch of the pulmonary artery. This sensor measures the diastolic,
    systolic, and mean pulmonary artery pressures every day. The collected data is
    then transferred over a secure network. The increase in the PA pressure is an
    indication of the onset of the decompensation and happens in advance of other
    clinical symptoms. The sensor is placed on the femoral vein during right heart
    catheterization and is powered externally. Unlike Chronicle IHM, CardioMEMS is
    MRI- and CRT-compatible with increased longevity.


    The CHAMPIONS (CardioMEMS Heart Sensor Allows Monitoring of Pressure to Improve
    Outcomes in NYHA Class III Heart Failure Patients) trial was conducted in the
    US in 2011 to study the CardioMEMS sensor [57, 58]. The initial study included
    550 patients who were NYHA class III, had had previous hospitalization, and had
    guideline-recommended HF therapy. The study group was divided into control and
    treatment groups. The pressure information is only available for the treatment
    group and not for the control group. Two studies – MEMS-HF (CardioMEMS European
    Monitoring Study for Heart Failure) and the US Post-Approval Study (PAS) – confirmed
    that CardioMEMS reduced the number of hospitalizations and improved the quality
    of life of the patients. CardioMEMS is the only FDA-approved invasive sensor for
    monitoring PA pressure with a European Conformity (CE) mark.


    Yet another PA pressure sensor, the Cordella Pulmonary Artery Pressure Sensor
    System, has been developed by Endotronix, Inc., Chicago. Cordella is like CardioMEMS
    with additional benefits provided by the Corella HF system. Some vital parameters,
    such as BP, oxygen saturation, weight, and heart rate are recorded in addition
    to the diastolic PA pressure. The studies are ongoing, with two clinical studies
    currently being carried out. The first is the SIRONA trial being conducted on
    15 NYHA class III patients [59]. The trial did not show any complications or system-related
    failures. The values measured by the PAP sensors matched with the right heart
    catheterization at the end of the 90-day trial period. The second study, the European
    SIRONA II CE Mark Trial was conducted on 60 patients from the NYHA class II with
    compromised ventricle ejection. The PROACTIVE-HF IDE Trial is a similar trial
    being conducted in the US. Cordella is not FDA approved, does not possess the
    European Conformity mark, and is not available for commercial use.


