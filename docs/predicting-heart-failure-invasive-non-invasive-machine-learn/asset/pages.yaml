  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_318_0.png)


    into a “smart textile” vest for prolonged multilead ECG monitoring. ECG monitoring
    through wearables can therefore be useful for the diagnosis of AF. All three can
    be worn for several days at a time for continuous ECG monitoring more comfortably
    and for longer than a standard Holter monitor. The Apple Heart Study has utilized
