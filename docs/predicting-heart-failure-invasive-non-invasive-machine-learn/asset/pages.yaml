- pgno: 212
  md: 'Furthermore, many studies focused on detecting HF based on heart sound characteristics.
    A healthy heart has two sounds: the first heart sound (S1) and the second heart
    sound (S2). Extra heart sounds can be found in both normal and abnormal situations.
    The third heart sound, or protodiastolic gallop, (S3) that correlates with dysfunction
    or volume overload of the ventricles and the fourth heart sound (S4) that reflects
    left ventricular stiffness are both associated with HF [44]. In 2015, Zheng et
    al. [45] suggested a system for chronic HF prediction based on the analysis of
    cardiac reserve and heart sound characteristics. They applied the LS-SVM (least-squares
    SVM) classifier in 88 control subjects and 64 with chronic HF with an accuracy
    of 95.39%, sensitivity 96.59%, and specificity 93.75% of the proposed system for
    the detection of chronic HF. In 2020, Gjoreski et al. [46] combined classic ML
    and end-to-end DL to detect chronic HF. The classic ML learned from a large set
    of features and the DL learned both from the time- domain representation of the
    signal and the spectral representation of the signal. Their model achieved an
    accuracy of 92.90%, sensitivity 82.30%, and specificity 96.20%.


    A large number of studies focused on predicting HF utilizing HRV measures. Lal
    et al. [47], Wang et al. [48], and Chen et al. [49] utilized HRV measures to predict
    congestive HF. Lal et al. implemented an SVM model with 93.10% accuracy on 116
    subjects (44 with congestive HF and 72 controls), while Wang et al. applied the
    long short-term memory (LSTM) network on 156 subjects (44 with congestive HF and
    112 controls) achieving 99.22% accuracy. Chen et al. applied the sparse auto-encoder-based
    deep learning (SAE- based DL) algorithm on 116 subjects (44 with congestive HF
    and 72 controls), and the results showed that the model achieved 72.41% accuracy.
    In 2020, Pires et al. [50] analyzed various features of heart rate from 270 subjects
    by applying NN, a C4.5 decision tree, k-NN, SVM, and stochastic gradient descent
    (SGD). The highest accuracy (87.69%) was achieved with the implementation of fivefold
    cross-validation with SGD, the same as was achieved with 20-fold cross-validation
    and 10-fold cross-validation implementing C4.5 and SVM.


    In addition, other researchers have focused on analyzing ECG signals. Masetic
    et al. in 2016 [51] implemented C4.5, k-NN, SVM, artificial NN, and random forest
    (RF), classifying ECG signals from 18 patients with congestive HF and 13 controls.
    RF outperformed the others with 100.00% accuracy. In 2019, Acharya et al. [52]
    implemented a convolutional neural network (CNN) on ECG signals from 73 patients
    (15 with congestive HF and 58 controls) with accuracy 98.97%, specificity 99.01%,
    and sensitivity 98.87%. Also in 2019, Kim et al. [53] analyzed ECG features data
    from 2209 subjects with chronic HFrEF (1006 subjects) and HFmrEF (1103 subjects)
    and 18,196 controls. They applied a DL-based analysis with 98.00% specificity
    and 95.00% positive predictive value. In the same year, Kwon et al. [54] developed
    an algorithm using a deep neural network (DNN). They analyzed ECG features and
    demographic information (age, sex, weight, height), heart rate, the presence of
    atrial fibrillation (AF) or atrial flutter (AFL), QT interval, and QRS duration
    in 22,765 patients, of whom 1391 had HFrEF. The AUC for identification of HFrEF
    was 84.30%. In a 2020 study, Ning et al. [55] analyzed ECG signals from 15 chronic
    HF patients and 18 controls, applying a DL technique which consisted of a CNN
    and an RNN with an accuracy of 99.93%, sensitivity 99.85%, and specificity 100.00%.


    Many studies applied various ML techniques on the Cleveland heart disease database
    that consists of demographic characteristics, symptoms, clinical and laboratory
    values,'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'and echocardiographic results used as input features, from 297 subjects (137
    with HF and 160 controls). In 2017, Samuel et al. [56] applied a hybrid decision
    support method based on an artificial NN and the fuzzy analytic hierarchy process
    (fuzzy AHP) technique to detect the presence of HF with 91.10% accuracy. Two years
    later, Mohan et al. [57] applied a hybrid RF on the Cleveland heart disease database.
    Their model achieved an accuracy of 88.40%, sensitivity 92.80%, and specificity
    82.60%. Moreover, in 2019, Ali et al. [58] applied stacked SVM with an accuracy
    of 92.22%, sensitivity 100.00%, and specificity 82.92%, while Javeed et al. [59]
    applied a random search algorithm (RSA) for features selection and RF for HF prediction
    with an accuracy of 93.33%, sensitivity 95.12%, and specificity 89.79%.


    Furthermore, a number of studies have focused on identifying the three subtypes
    of HF (HFrEF, HFmrEF, HFpEF). Reddy et al. [60] and Liu et al. [61] built diagnostic
    tools to detect the presence of HFpEF. Reddy et al. [60] performed LR on 414 patients
    with unexplained dyspnea (267 with HFpEF and 147 controls) achieving AUC 88.60%
    in the independent test cohort. Obesity, AF, age, medications, and echocardiographic
    features were retained for diagnosing patients with HFpEF. Liu et al. [61] applied
    an extreme learning machine (ELM) on heart sound signals from 842 subjects (401
    healthy subjects used as control group, and 441 HFpEF patients). The results showed
    an accuracy of 96.32%, sensitivity 95.48%, and specificity 97.10%. Choi et al.
    [62] developed a hybrid approach (expert-driven and machine-learning driven) to
    classify subjects in four classes – HFrEF, HFmrEF, HFpEF, and healthy subjects
    – and achieved 98.30% accuracy. Demographics, symptoms, clinical history, physical
    examination, ECG and echocardiogram features, and NT-proBNP were used as input
    features from 1198 subjects. In 2013, Austin et al. [63] focused on classifying
    subjects according to disease subtype: HFpEF or HFrEF. To evaluate their model
    they utilized the Enhanced Feedback for Effective Cardiac Treatment (EFFECT) study
    data set. The data set consisted of subjects with acute HF that could be further
    classified as HFpEF or HFrEF. For the HF subtype classification, they selected
    34 features, such as demographics, symptoms, physical examination features, laboratory
    findings, and medical history. The results indicated that the RF classifier could
    classify cases into one of the two subtypes with a 69.60% positive predictive
    value.


    # 9.1.2.3 ML Applications in Severity Estimation


    Due to the fact that HF is one of the main causes of hospitalization in western
    society and its increased mortality rate, it is becoming imperative to be able
    to assess the severity of HF at its early stages. HF might be asymptomatic in
    the early stages and can usually be expressed only by dyspnea or fatigue. Several
    studies propose a model that estimates the severity of patients suffering from
    HF (Table 9.2). In 2011, Pecchia et al. [64] designed a platform to enhance the
    effectiveness and efficiency of home monitoring, using ML for the early detection
    of patient deterioration. Their study, proposed a remote health monitoring platform
    that supported HF severity assessment, based on the CART method. The data set
    they used was based on HRV measures and ECG signals from 29 subjects with HF (12
    with mild HF and 17 with severe HF) and 54 subjects used as controls. Their model
    achieved an accuracy of 79.30%, sensitivity 82.30% and specificity 75.00%. In
    2012, Guidi et al. [65] built an artificial intelligence-based computer aided
    diagnosis system applying NN, SVM, decision trees, and a fuzzy expert system whose
    rules were'
