  md: '# 13.5 Summary of the Cardiac and Wearable Device Data Sets


    There is a large number of data sets publicly available for ECG recording. Recently,
    several data sets have been released for research and PhysioNet has a large collection
    of ECG data sets. A team from Chapman University and Shaoxing People''s Hospital
    (Shaoxing Hospital Zhejiang University School of Medicine) has collected and disseminated
    a novel database that contains 12-lead ECGs of 10,646 patients with a 500 Hz sampling
    rate that features 11 common rhythms and 67 additional cardiovascular conditions,
    all labeled by professional experts. The data set consists of 10-second, 12-dimension
    ECGs and labels for rhythms and other conditions for each subject [59]. Another
    large recent large ECG data set is the PTB-XL ECG dataset [60] containing 21,837
    clinical 12-lead ECGs from 18,885 patients of 10-second length. The raw waveform
    ECG data was annotated by two cardiologists, who assigned potentially multiple
    ECG statements in each record.


    An ECG image data set was released for CVD and COVID-19 patients with 1937 distinct
    patient records [61]. The data were collected using the ECG device EDAN SERIES-3
    from different healthcare institutes across Pakistan. The data set was manually
    reviewed by experts to categorize them into five distinct categories (COVID-19,
    abnormal heartbeat, myocardial infarction (MI), previous history of MI, and normal
    person). ECG data were collected using a 12-lead ECG device which can be used
    for machine learning-based model development for CVD detection among COVID and
    other CVD patients.


    Bogu et al. [5] reported heart rate and steps data from 106 individuals using
    wearable devices. There were 25 COVID-19 +, 11 non-COVID-19 illnesses with self-reported
    symptoms, and 70 healthy individuals with no symptoms or illness during the COVID-19
    period (February 2020 to June 2020) were reported in this data set. Resting heart
    rate was computed by selecting the heart rate intervals where steps were zero
    for 12 minutes ahead of an interrogated time point.


    Similarly, Mishra et al. [10] used the data from consumer smartwatches for the
    pre-symptomatic detection of COVID-19. Using retrospective smartwatch data, they
    showed that 63% of the COVID-19 cases could have been detected before symptom
    onset in real-time via a two-tiered warning system based on the occurrence of
    extreme elevations in the resting heart rate relative to the individual baseline.
    The investigation was carried out on nearly 5300 participants; however, 32 patients
    infected with COVID-19 were identified from the cohort, and the rest weere in
    the control group.


    The MyHeart Counts study [62] used an iOS app among 110,056 users from March 9,
    2015, to October 28, 2015. The study cohort described here is composed of contributions
    from study participants who designated broad sharing of their data (n = 34,189).
    Among consenting participants, 4900 (10.2%) completed a 6-minute walk test at
    the end of day 7 in the study. The 6-minute walk test activity not only collects
    distance traveled but also accelerometry during the walk. Additionally, MyHeart
    Counts users were able to upload data from wearable devices compatible with HealthKit.
    Table 13.1 summarizes some recent cardiac and wearable device data sets.'
