  md: '# ### 9.2.1.2 Methodology


    The proposed methodology consisted of three basic stages: preprocessing, feature
    selection, and classification. At the preprocessing stage features with more than
    (≥) 50% missing values and discrete features with unbalanced distribution of values
    were removed. Next, outliers and typos (e.g 4.5 being recorded instead of 4.5)
    per feature were detected and corrected. A correlation-based feature selection
    method was used to assess the predictive ability of feature subsets and the degree
    of redundancy among them, preferring sets of features that were highly correlated
    with the class but with low intercorrelation [103]. In the classification stage,
    C4.5, RF, ROT, NB, k-NN, SVM, logistic model trees (LMT), and Bayes Network (BN)
    classifiers were applied. In order to achieve class balancing, the undersampling
    method was applied to the data set. The undersampling method is quite common for
    dealing with this problem [104]. It produces a random sub-sample with a given
    spread between class frequencies. The maximum spread between the rarest and most
    common class is specified. In our case, a random undersample of the majority class
    was followed, so that all classes have the same number of instances. The 10-fold
    cross-validation was applied in testing.


    # ### 9.2.1.3 Results


    After removing features with ≥ 50% missing values and deleting discrete features
    with unbalanced distribution of values, there were 30 remaining features (Figure
    9.4). We also excluded from the data set NYHA classification that was recorded
    in all patients, since that would indicate a patient’s condition. Finally, the
    classification of HF phenotype (HFpEF, HFrEF, HFmrEF) did not fit in our analysis
    since the models would be used for HF diagnosis in previously undiagnosed patients.


    The results for the HF diagnosis problem, for the unbalanced class, are depicted
    in Table 9.6.


    The results for HF diagnosis problem, for the balanced class, are depicted in
    Table 9.7.


    The ROT classifier for the unbalanced class, without feature selection, gives
    the best result with an accuracy of 96.36%, sensitivity 96.50%, and specificity
    96.20%.


    # ## 9.2.2 Severity Estimation and Adverse Events Prediction


    # ### 9.2.2.1 The Data Set


    For both the severity estimation problem and the adverse event prediction, the
    data were collected retrospectively by three different clinical centers: Universita
    Di Pisa, Servicio Andaluz de Salud, and the 2nd Department of Cardiology of the
    University Hospital of Ioannina, as part of the HEARTEN project [102].


    The recorded data can be grouped in the following categories: general information,
    medical condition, drugs, clinical examination, score information, biological
    data, allergies and drugs side-effects, sensor data, and biosensor data. More
    specifically, during hospitalization, for each patient the data shown in Figure
    9.5 were collected.


    Regarding the data retrieved from the sensor, the clinicians had to monitor the
    patient (starting from the day of admission) using a sensor device for 20 minutes
    every other day and at discharge.'
