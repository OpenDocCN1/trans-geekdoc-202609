- pgno: 315
  md: '# ### 13.4.1 Activity Monitors


    The most popular form of activity monitoring devices available on the market are
    a ring, wristband, wristwatch, chest strap, and smart insole or shoe. These devices
    use three degrees of freedom accelerometers to identify the activity type of the
    user. They are suitable for activity monitoring and fall detection, but the type
    of movement significantly affects the accuracy of these devices, particularly
    at lower motion activities. Wearable devices, although initially designed for
    activity monitoring, can now be utilized to monitor several other body parameters
    and every day the list of parameters increases as do their accuracy and reliability.
    However, these devices are not yet directly used for HF identification.


    # ### 13.4.2 Heart Rate Monitors


    Most of the wearable devices utilize an optical heart rate monitor using the PPG
    technique, which uses the incident of light of particular wavelengths entering
    the skin, then measuring the perfusion of blood in the dermis and subcutaneous
    tissue by capturing the different amounts of light refracted by varying volumes
    of blood flow occurring due to heart pumps (Figure 13.6). It uses a light-emitting
    diode (LED) to illuminate a capillary bed and thus monitor pulsatile changes in
    light absorption by a photodiode, which is similar to a pulse oximeter [13]. It
    was reported recently that the accuracy of heart rate monitors from wearable PPG
    devices depends on the type of activity being performed and the heart rate range
    of the user.


    The signal acquired using the PPG techniques can be used to generate metrics about
    heart rate, blood pressure, breathing rate, and several other usable metrics,
    as shown in Figure 13.7.


    ![](img/721c7a2c71f4dc63a8585e2ef46838f7_315_0.png)


    **Figure 13.6** Concept of PPG which uses a light-emitting diode and photodiode
    in the PPG acquiring sensor to measure changing blood volume changes due to the
    pumping of the heart.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/721c7a2c71f4dc63a8585e2ef46838f7_316_0.png)


