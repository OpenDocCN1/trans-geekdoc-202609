    the body can detect many things such as blood pressure, sugar levels, heartbeat,
    and cancer and can subsequently relay the results at precise times. It can lead
    to early detection of significant problems inside the body through physiological
    parameter measurements.


    # 4.3 Wireless Power Transmission


    Wireless electricity transfer technology transfers power from one place to another
    without physical support [19] and is therefore beneficial for transmitting electricity
    to sites and devices that are difficult to energize, such as implant sensors.
    In this subsection, we will highlight contemporary media for wireless power transmission.
    There are typically four technologies used for wireless energy transmission, depending
    on the physical energy grandeur sent [20, 21]:


    +   - Microwave wireless power transfer

    +   - Electromagnetic induction energy transfer

    +   - Laser wireless power transmission

    +   - Ultrasonic wireless power transmission.


    # 4.3.1 Categories of Wireless Electricity Transmission


    There are two main techniques of wireless electricity transmission: wireless power
    by induction and wireless power by radiation, as shown in Figure 4.5.


    Many energy sources energize sensors, including dynamic and thermal power harvesters
    such as piezoelectric, RF harvesting, inductive link, and pyroelectric transducers.'
