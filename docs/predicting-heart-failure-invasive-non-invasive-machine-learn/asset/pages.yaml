    # ## 4.6 Conclusion


    The method of charging chips implanted inside the human body were simulated for
    radio frequency energy and verified experimentally in this work. Ambient RF harvesting
    is clean and controllable, and the implanted slices operate independently of patient
    movement, anytime, anywhere. Conversely, inductive radio transmission produces
    heat at the implant position, interfering with the body''s physiological activity.


    In this chapter, we examined how an implanted SoC chip can be charged wirelessly.
    We demonstrated the possibility of using inductive flux and RF harvesting signals
    to activate any microchips implanted inside the body. We tested this research,
    and we prove that the S-band (WiFi) is a suitable power for charging the SoC chip.
    The fractal harvester antenna has a reflection coefficient of S11 of –16.23 dB.
    Therefore, the maximum gain direction of this antenna is –7.06 dBm. We chose Schottky
    diode HSMS2822 and fractal combiner antenna dimensions tested and approved for
    the full-wave bridge rectifier topology.


    Each harvester circuit can supply 1.92 V, and this energy is sufficient to operate
    the sensor implanted under the skin wirelessly. In this study, we agreed that
    we could wirelessly improve the configuration of implant chips and can unlock
    a new solution for using radiation in our lives as a source of energy to activate
    sensors implanted inside a human. This technology is essential for many applications
    both in civilian life and in military sectors.


    In future, we will study how to obtain energy to run the implanted chips from
    human temperature, arm movement, breathing devices, leg movement, or any human'
