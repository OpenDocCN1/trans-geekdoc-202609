  md: 'Another serious concern while using smart wearables is that of data privacy
    and regulation policies. Smart wearables record a heavy amount of data including
    location data as well as physiological data. These recorded data are valuable
    for commercial firms they can be utilized for analyzing customer behavior to extend
    the firms’ market. Various countries around the world have strict rules to ensure
    that commercial medical devices maintain fair data usage and regulation policies.
    However, these rules are applicable only for the devices which are developed for
    medical examination alone. Although non-invasive methods can help to reduce the
    overall health risk of heart failure patients to an acceptable extent, they are
    not as effective as invasive devices. Nevertheless, a substantial number of patients
    worldwide prefer non-invasive devices over invasive devices, because the former
    are economically feasible and devoid of the safety issues that are associated
    with internal implantation.


    Apart from non-invasive devices, commercially available invasive devices that
    are currently used for monitoring CHFs have been described in this chapter. Each
    of the categories discussed is used for different applications and the physicians
    must choose which device to implant based on the patient’s details and severity
    of the condition. There are three factors to consider before deciding on the best-suited
    device. First is safety. The Chronicle IHM had better safety and fewer complications.
    However, it did not show significant results in reducing the number of hospitalizations
    in HF patients. The second factor is efficacy, and HeartPOD had better efficacy
    in preventing the number of hospitalizations, but safety was compromised as the
    implant led to increased complications. In other words, safety and efficacy are
    inversely correlated. Cost-effectiveness is the third important factor to be considered.
    Many devices discussed are not cost-effective and their longevity is still being
    tested. Overall, the CardioMEMS has proved to have better safety and efficacy,
    and is cost-effective as well. It must be reiterated that CardioMEMS is the only
    device that is FDA approved, has a European Conformity (CE) mark, and is available
    for commercial use.


    # 11.5 Future Outlook


    This section provides a brief future insight on non-invasive and invasive systems
    for heart failure monitoring and proposes how the evolving technology can contribute
    to the future development of heart failure monitoring systems.


    +   Currently available non-invasive devices, as well as invasive devices equipped
    with remote monitoring functionality, are providing treatment or advice feedback
    to patients with the help of a physician or cardiologist. They can focus on implementing
    treatment algorithms that are based on the latest artificial intelligence methods
    such as deep learning or machine learning prediction models trained with a large
    amount of data including various attributes such as laboratory values, pulmonary
    pressure, symptoms, etc. This will enable the development of fully automated systems
    for heart failure monitoring.


    +   This review discussed various smartwatches and smart wearables which are equipped
    with multiple sensors for recording physiological values. In this context, developing'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'smartphone applications to record and analyze those values from those sensors
    has the potential to monitor heart failure patients non-invasively.


    +   The role of mHealth apps for the self-care of heart failure patients was discussed
    in this review and it was found that the mHealth apps have the potential to educate
    the heart failure patients about the disease, symptoms, precautions, etc. However,
    most of the existing apps lack user-centered design. In the future, developers
    can focus on developing apps with improved user-centric design. Furthermore, they
    can focus on developing apps for patients who have less knowledge about smartphone
    operations.


    +   The existing commercially available devices or proposed devices in the literature
    have not addressed the security of patients’ data during transfer as well as storage
    for better privacy and security of the patients’ latest information, where security
    techniques like encryption and steganography can be employed.


    +   A mix of invasive and non-invasive devices can be employed in the future to
    get the benefit from both. A hybrid model which combines both invasive and non-invasive
    techniques can be developed.


    +   An effective, efficient, and interdisciplinary collaboration between doctors
    and engineers is required to develop safe, reliable, and long-term devices to
    effectively monitor heart failure.


    # 11.6 Conclusion


    Heart failure is causing an economic burden on the hospital system, due to constant
    admission and readmission of the patients. It also affects the patients’ quality
    of life. Currently, heart failure is detected using the symptoms and signs which
    appear late and are not reliable. Non-invasive and invasive methods are available
    to detect heart failure at early stages. In recent years, the number of research
    activities in the field of remote monitoring techniques for heart failure monitoring
    is increasing rapidly. Non-invasive methods are easy to use and safe, but accuracy
    and reliability are compromised. Invasive methods are accurate and reliable, but
    the safety is questionable. Invasive methods are available only in a limited number
    of cases. In this chapter, the commercially available invasive and non-invasive
    devices for heart failure monitoring are discussed. Discussion of the advantages
    and disadvantages of these devices was included. Finally, a future outlook section
    was added to mention possible future directions in this field.


