  md: 'called natural language processing (NLP), which converts unstructured text
    into a structured form [38]. NLP is a multistep process with the first and most
    important step being lexical analysis. There are various techniques which can
    be employed in lexical analysis, and these include part of speech (POS) tagging,
    hidden Markov model (HMM), names entity recognition (NER) and parsing or syntactic
    analysis (PSA) [38]. In POS tagging, each word is tagged to a corresponding category
    of words that share grammatical properties. HMM remembers the sequence of words
