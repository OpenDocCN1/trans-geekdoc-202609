    MAI recognition was done using pixel classification.


    # 2.5.2 AI in Electrocardiography


    Electrocardiography has a high impact in detecting abnormalities in heart rhythm.
    Most of the existing machine learning applications based on ECG focus on classification
    of electrical signals to spot abnormal activity in the heart. With today''s availability
    of ECG in small portable devices such as smartwatches, AI integration helps patients
    to monitor their heartbeat levels and detect any abnormalities that might require
    seeing a doctor or having further tests.


    The work of Li et al. [28] applied a multichannel, multiscale deep neural network
    model to perform ECG classification of normal and abnormal signals, and their
    method achieved 96.02% accuracy. Other research work by Rajput el. [29] developed
    an automated ECG signal detection specifically for detecting the severity of hypertension,
    a high-risk factor for heart disease. Their method included using a two-band optimal
    bior-thogonal wavelet bank filter as well as machine learning techniques to classify
    the wavelets into low, high-risk hypertension, and healthy. The average classification
    accuracy for this method was found to be 99.95%, and highlights the ability of
    this system to be deployed in clinics.


    A method for ECG identification and detection of congestive heart failure (CHF)
    and arrhythmia (ARR) using deep learning techniques is that proposed by Eltrass
    et al. [30]. It mainly uses both CNN and constant-Q non-stationary Gabor transform
    (CQ-NSGT), which mainly transforms the 1D ECG signal to a 2D time-frequency representation.
    The output is then fed to a pretrained CNN model (AlexNet) to extract the features
    of these'
