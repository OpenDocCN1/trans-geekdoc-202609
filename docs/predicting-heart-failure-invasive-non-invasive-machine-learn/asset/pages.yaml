    # 11.3.1 RV Pressure Monitoring


    RV pressure sensors are used in measuring the diastolic and systolic pressure
    of the right ventricle. During the opening of the pulmonary valve, the diastolic
    pressure of the PA is measured, which is helpful in calculating the left ventricle
    diastolic pressure and pulmonary capillary wedge pressure, and thereby arriving
    at the intracardiac filling pressures. A strong relationship between the RV pressure
    and the PA pressure is observed during invasive catheterization [52–54]. Recording
    and reporting of ventricular pressure are performed at end-systole and end-diastole.
    The normal range of the RV systolic pressure is 25–30-mmHg and the RV end-diastolic
    pressure is 5–7 mmHg. The left ventricle systolic pressure is normally equal to
    the systolic arterial pressure and the left ventricular end-diastolic pressure
    is less than 10 mmHg. With the increase in age, the left ventricle systolic pressure
    also increases [55].


    With these findings as the base, the Chronicle implantable hemodynamic monitor
    (Chronicle IHM) was developed by Medtronic, Inc., Minneapolis, Minnesota. The
    Chronicle IHM consists of two parts – a device that is placed in the pectoral
    area like a pacemaker, and a pressure sensor on the tip (like a transvenous lead)
    placed in the RV outflow tract or septum. This device is not compatible with MRI
    scanning, cardiac resynchronization therapy (CRT), or atrial pacing devices, which
    is a disadvantage in using this device.


    A study on 32 heart failure patients was initially undertaken and the results
    showed a decrease of 57% in hospital admissions. From this result, a clinical
    trial – the COMPASS-HF (Chronicle Offers Management to Patients with Advanced
    Signs and Symptoms of Heart Failure) – was conducted on advanced heart failure
    patients from the New York Heart Association (NYHA) to study the effectiveness
    of the Chronicle IHM sensors [56]. Varied subjects were selected for the study
    (274 patients) and were divided into Chronicle and control groups. The trial did
    not show significant result changes and it was concluded that the Chronicle IHM
    might add value in addition to the existing management routine.


