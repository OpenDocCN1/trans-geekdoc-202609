    # 13.7 Future Directions of Wearables for Early Prediction of HF


    It is well known that an ECG of healthy individuals can have morphological variabilities/abnormalities
    at the baseline with variable prevalence. Similarly, patients following cardiac
    abnormalities can develop persistent abnormal ECG changes, which can be detected
    early if they are continuously monitored. This is where machine learning can play
    a really important role. Machine learning models can be used to detect heart abnormalities
    at an early stage, but the models should be made aware of how abnormalities might
    look and that they might be different for different patients. The authors are
    working on such a machine learning paradigm that can detect cardiac abnormalities
    for a specific patient early and can instruct the patient, along with their doctor
    and care-giver, to take precautionary actions (Figure 13.12).


    Such a system would adhere to the following framework: (i) continuously record
    the ECG signals of a patient using a chest strap or patch, (ii) the existing benchmark
    database will be used to develop a machine learning model to classify the abnormal
    heart condition, (iii) the existing data set of HF patients will always have healthy
    and unhealthy ECG signals; healthy ECG signals of a person will be used to generate
    unhealthy signals of that patient and will be validated with the existing database,
    (iv) real-time acquired'
