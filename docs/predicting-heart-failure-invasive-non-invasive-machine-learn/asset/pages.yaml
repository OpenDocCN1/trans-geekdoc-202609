    # 8.8 ML Techniques for Predicting HF


    Predicting of HF risks using ML is becoming one of the top priorities for medical
    doctors and physicians. Specifically, when ML is applied to different kinds of
    medical records, it helps in predicting survival in patients who have HF symptoms,
    and detecting the main clinical features leading to HF. However, much work is
    still needed to improve the accuracy of HF predictors as most of them have failed
    to reach high performance levels [49, 50]. In addition to the traditional ML models,
    deep learning algorithms are gaining much popularity because of their supremacy
    in terms of performance compared with conventional models, especially if they
    are trained with huge amounts of data, and their ability to improve on human specialists’
    performance.


    To predict HF risks, data sets including medical records of eHF patients are usually
    used for training the ML algorithms. The process is similar to the diagnosis and
    detection of HF already explained in Figure 8.1, but with some differences regarding
    the types of input data that need to be fed into the ML models and the output
    to be produced. Therefore, the objectives are also different, as they are more
    oriented to predicting HF mortality and severity risks, HF destabilizations, HF
    relapses, and/or HF readmission [37, 51]. In this context, in addition to the
    EHR data (e.g. demographics, admission characteristics, medical history, visits
    to emergency departments, history of medication use, and healthcare services out
    of hospital), telemonitoring data can be utilized for identifying and predicting
    different HF risks (e.g. readmission risks) [52]. Moreover, by combining EHR data
    with tele-HF data and wearable sensor data the accuracy of predicting HF risks
    can be improved as discussed in Mortazavi et al. [53].


    # 8.8.1 Prediction of In-Hospital Mortality


    J. Kwon et al. have developed an ML model to predict in-hospital mortality for
    a patient with heart conditions based on echocardiography [54]. The cohort was
    based on a multicenter retrospective data set. The data from hospital A was used
    to train a deep learning model while data from hospital B was used for validation.
    The study size was 25,776 patients, with 1026 registered in-hospital mortalities.
    Predictor variables were extracted from the echocardiography first raw text reports.
    First extracted were 11 continuous variables, such as age, weight, height, left
    or right ventricular systolic dysfunction (LVSD/ RVSD), left atrial dimension
    (LAD), etc. First, these continuous variables were zero-mean and standard-deviation-one
    normalized. Then 54 categorical variables were parsed from the report. These variables
    are counts on the occurrence of specific keywords in the raw text. For example,
    mitral valve description gathers 10 variables for keywords such as stenosis [5
    possible values: absent/trace/mild/moderate/severe], calcification [2 possible
    values: Y/N], prosthesis [2 possible values: Y/N], etc. The input'
