    # 11.3 Invasive Devices for Monitoring Heart Failure Patients


    This section briefly discusses the available invasive techniques and commercially
    available invasive devices and sensors. The available invasive devices for remote
    monitoring of heart failures are classified into right ventricle (RV) pressure
    monitoring, pulmonary artery (PA) pressure sensors, left atrial (LA) pressure
    sensors, and intrathoracic impedance monitoring. The commercial devices falling
    under each category and the corresponding clinical trials are given in detail.
    The overall working of invasive devices with remote monitoring is shown in Figure
