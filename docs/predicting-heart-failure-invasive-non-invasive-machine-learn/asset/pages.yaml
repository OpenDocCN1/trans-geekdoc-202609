  md: '# Applications of Machine Learning for Predicting Heart Failure


    Sabri Boughorbel, Yassine Himeur, Huseyin Enes Salman, Faycal Bensaali, Faisal
    Farooq, and Huseyin Cagatay Yalcin


    # 8.1 Introduction


    Heart failure (HF) is a chronic disease in which the cardiac system fails to pump
    the normal blood level in the body, leading to a reduced oxygen level in organs
    and tissues. It is a global health burden that creates a major challenge for the
    healthcare systems worldwide. The global prevalence of HF is 64.34 million cases,
    corresponding to 8.52 cases per 1000 inhabitants. This translates to 9.9 million
    years lost due to disability. In terms of costs, the HF burden accounts for US$346.17
    billion [1]. In the Arab Gulf Region, the prevalence of HF is about 1–2% of the
    population [2] accounting for more than 4 million patients. The average affected
    population is 10 years younger than in developed countries [2, 3]. Some of the
    main risk factors of HF are sex, obesity, hypertension, diabetes, smoking, and
    previous heart conditions. While, the prevalence of HF as a function of age peaks
    for older people over 70, a recent study showed that HF risk in the younger population
    is higher for obesity, hypertension, diabetes, and smoking. These results emphasize
    the importance of preventive measures across adult life [4, 5].


    Due to the progressive and chronic nature of HF, high hospitalization rates and
    emergency visits are reported for HF patients. About one-fourth of HF patients
    are readmitted for medical care within a month, and at least half of these readmissions
    are related to HF symptoms [6]. High hospitalization rates increase the work burden
    of medical professionals and also increase healthcare expenditure. The healthcare
    costs of HF management are estimated to be about 1–2% of all healthcare expenditure
    [7, 8].


    The early prediction of HF risk is important in enabling preventive action and
    limiting the consequences of HF. The traditional method for developing risk factor
    models for HF is typically using logistic regression models with general health
    data. Such an approach suffers from a limited predictive power when a large population
    is used to fit the models. Since logistic regression is a linear model, it cannot
    capture non-linearity in complex and noisy data. Machine learning (ML) approaches
    provide good alternatives to traditional HF risk scoring and prediction. High
    model capacity allows for a better predictive performance limiting the underfitting
    problem observed with logistic regression models. Several ML approaches incorporate
    interpretability elements to help the user'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'understanding which variables are the most predictive. In the section 8.2,
    we provide the reader with a brief introduction to the field of ML. In the following
    sections we give an introduction to the use of ML for the diagnosis of HF.


    # 8.2 Brief Explanation of ML Techniques for Medicine


    ML is the field responsible for developing methods and tools that can learn and
    make decisions based on data. It can be viewed as the intersection of several
    fields such as computer science and statistics. Software development has recently
    contributed significantly to the rapid progress of the field. Before the emergence
    of ML, intelligent programs were hard-coding rules derived from domain experts.
    These expert systems quickly became very complex and incapable of coping with
    real-world applications. ML automatically derives these rules from the data. Hidden
    patterns can be discovered in the data and be used to detect disease, anomalies,
    and other events. In ML, there is no need to explicitly write these rules as ML
    inherently captures them during model training.


    Because of the digitalization of healthcare, capturing, sharing, and delivering
    massive amounts of data has become a high priority. ML plays an essential role
    by addressing the challenges posed by the huge quantity of data. It tends to demonstrate
    that collecting and processing various data types from different sources, such
    as electronic health record data, raw patient data, diagnosis results, resource/patients
    provision, healthcare personnel information, along with a variety of “big data”
    pertaining to human-to-human interactions (from cellular operators, traffic, airlines,
    social media, etc.) can efficiently improve healthcare services [9]. In this context,
    ML helps healthcare organizations meet the growing demand for medical care, improving
    operations, and lowering costs. At the same time, ML innovation helps healthcare
    experts in (i) effectively predicting, detecting, and treating diseases, (ii)
    speeding up decision-making while guaranteeing more accurate, precise, and personalized
    cares, and (iii) optimizing the use and allocation of scarce healthcare resources
    [10, 11]. ML techniques are capable of automating tedious and repetitive tasks
    such as speech-to-text translation, structuring clinical notes, finding landmarks
    in radiology and pathology images, generating alerts and reminders, etc. Recently,
    chatbots have been successfully used to initiate remote consultations and tackle
    the growing demand for medical care during the pandemic. ML can offload many tasks
    from clinicians, allowing them to free up time to improve patient care.


    The first step in building ML models for HF diagnosis is to prepare a training
    data set. We consider the example of HF diagnosis using electrocardiogram (ECG)
    data. The training dataset is retrospectively collected and here the subject outcomes
    are known. This means that for each recorded ECG in the data set, it is already
    known whether it corresponds to a patient with HF or it corresponds to a subject
    who did not have HF. The information attached to each ECG sample (HF or no HF)
    is typically called the labels. This scenario, where labels are available, is
    known as supervised learning. When labels are not available, an unsupervised learning
    problem is addressed. Once the data is annotated and ready, an ML model can be
    trained to classify whether the ECG corresponds to HF or not. There is extensive
    literature and also prior work on the different types of ML'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'models. Each model has a set of parameters to be estimated based on the training
    data. Once trained, the model can be applied to new data and predict the label
    (HF event or no HF event).


    # 8.3 Detection and Diagnosis of HF


    The growing number of HF patients and increasing healthcare costs indicate the
    importance of the early diagnosis of HF for efficient treatment planning. For
    the diagnosis of HF, several clinical tests including blood tests, chest radiography,
    echocardiography, and ECG are performed in addition to physical examination and
    disease history investigation of the patient [12, 13]. A research study has shown
    that the deep learning model trained with ECG alone has high sensitivity and specificity
    in detecting HF [14]. Several criteria, such as Framingham, Boston, European Society
    of Cardiology (ESC), and the Gothenburg criteria, are employed by evaluating the
    clinical test data to decide on the presence of HF [15]. According to the ESC
    guidelines, the patient''s clinical history, observed symptoms, physical activity,
    and resting ECG are examined at the first step [10]. The symptoms of HF can be
    summarized as ankle swelling, dyspnea, fatigue due to elevated jugular venous
    pressure, pulmonary crackles, and peripheral edema [16–18]. If all examinations
    mentioned are normal, the presence of HF is not expected. If any of the initial
    stage evaluations are abnormal, plasma natriuretic peptides are recommended to
    be measured and, after this measurement, the clinicians decide on whether there
    is a further need for echocardiography [14]. Brain natriuretic peptide (BNP) is
    a protein secreted by the ventricular musculature in response to volume or pressure
    overload. The natriuretic peptide family is important for volume and blood pressure
    regulation. The presence of BNP in blood plasma is being used as a biomarker for
    diagnosing HF. Studies have shown that the use of BPN can improve HF diagnosis
    compared with the use of echocardiography [19]. An effective technique for HF
    diagnosis is to measure the intracardiac filling pressures using implantable pressure
    sensors by means of cardiac catheterization [20] but the invasive nature of catheterization
    limits the routine usage of this method [21].


    # 8.4 Prediction of HF


    After the diagnosis of HF, the severity of the condition is clinically predicted
    and classified using either the New York Heart Association (NYHA) or the American
    College of Cardiology/American Heart Association (ACC/AHA) guidelines [22]. These
    guidelines are constituted to accurately predict the state of the disease and
    to plan the most appropriate treatment methods. NYHA guidelines basically use
    the physical activity capabilities and observed symptoms of the patient for the
    classification of HF [13]. On the other hand, in the ACC/AHA guidelines, the structural
    changes and symptoms are described for HF stages [19]. In other words, NYHA guidelines
    define the exercise capacity and symptomatic status of the patient [14], and ACC/AHA
    guidelines focus on the developmental stage and progression of HF [10]. These
    two methods are complementary and provide important information for deciding the
    presence and severity of HF. NYHA guidelines can be'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'considered to be more subjective compared to ACC/AHA guidelines due to the
    observer variability during the evaluation [23]. An objective evaluation of HF
    severity can be performed using the combination of 2D ECG and Doppler flow imaging
    [17].


    With the advances in sensor technologies, it is also possible to predict the HF
    worsening state remotely before the hospitalization and clinical tests. For this
    purpose, non-invasive or minimally invasive sensor measurements are performed
    via remote patient monitoring (RPM) systems [15]. These RPM methods continuously
    measure the blood pressure [24], body weight [25], physical activity [19], bioimpedance
    [26–28], and ventricular filling pressures [29–31] of HF patients remotely, and
    predict the impending HF decompensation before there are serious symptoms. It
    is reported that RPM trials have reduced the all-cause and HF-related mortality
    of HF patients [32, 33], prevented unnecessary HF-related hospitalizations [34],
    and increased the life quality of HF patients [35].


    # 8.5 ML Techniques for Detection and Diagnosis of HF


    In recent years, ML has gained a growing importance in cardiovascular medicine,
    especially for the detection and diagnosis of HF. This is mainly due to the huge
    amounts of data recorded using different medical devices, such as electronic health
    records (EHRs), multimodality images, and mobile health sensors, which requires
    powerful and smart algorithms to extract pertinent information, predict HF, and
    detect and classify HF [36, 37]. Based on the nature of the ML algorithms used
    for detection and diagnosis of HF, four classes can be identified:


    +   1. **Supervised learning models**: Annotated datasets are used to train this
    kind of model, in which for each item of input data there is a label referring
    to the nature of HF. After training the ML model, a test data set is used for
    its validation which includes labels. Accordingly, different ML metrics are then
    used to estimate the accuracy, precision, recall, specificity, etc. Classification
    and regression are notable supervised learning models [38].


    +   2. **Unsupervised learning models**: Data sets employed for training this
    kind of model do not include labels. Their main role is to discriminate between
    the different HF types by using algorithms relying on clustering, one-class classification,
    dimensionality reduction, etc. [39].


    +   3. **Semi-supervised learning models**: These combine supervised learning
    and unsupervised learning through the use of both unlabeled data and labeled data
    during the training process. Explicitly, this is usually achieved by using a lesser
    amount of annotated data with a hefty amount of unlabeled data [9].


    +   4. **Reinforcement learning models**: The main advantage of these models is
    that they do not require an annotated data set for their training. In addition,
    the results are not directly associated with the input data, hence these models
    can learn from experience. Specifically, these models can detect the HF by (i)
    improving their presentation using their association with the environment, and
    (ii) figuring out the manner for discussing their faults and getting the adequate
    outcome by assessing and testing different prospects [39].'
