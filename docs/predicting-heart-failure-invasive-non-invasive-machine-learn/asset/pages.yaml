    # 9.1.2.7 ML Applications in Mortality or Readmission Prediction


    Furthermore, a large number of studies focus on developing models for jointly
    predicting adverse events, i.e. mortality or rehospitalization in patients with
    HF (Table 9.5).


    In 2013, Zhang et al. [94] utilized decision trees and LR to predict death risk
    or hospitalization due to worsening HF at one year. The mortality prediction had
    an accuracy of 89.20% for decision trees and 85.80% for LR and the composite outcome
    prediction had an accuracy of 79.70% for decision trees and 73.80% for the LR
    model. Their data set consisted of 284 patients for training and 160 patients
    for validation from the TEN-HMS (Trans-European Network Homecare Monitoring System)
    study, utilizing as input features demographics, physical examination, laboratory
    findings, medical history, quality of life, and EuroQoL. NT-proBNP was the feature
    with the strongest prediction of mortality.


    In 2017, Tripoliti et al. [95] presented an ML based method for the prediction
    of adverse events (mortality and relapses) in patients with HF by analyzing breath
    and saliva biomarkers from 27 subjects. The prediction of adverse events achieved
    77.00% accuracy using an ROT algorithm.


    Awan et al. [96] in 2019, conducted a study on HF patients aged over 65 years
    and in hospital, where 23.60% of the patients were readmitted or died within 1
    month of hospital discharge. They developed an MLP-based approach to predict 1-month
    HF readmission or death, achieving AUC 62.00%, sensitivity 48.00% and specificity
    70.00%.'
