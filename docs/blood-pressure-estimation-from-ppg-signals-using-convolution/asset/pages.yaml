    Fig. 1. Ergodic achievable rate versus SNR γ for QPSK GSM over the i.i.d. Rayleigh
    fading MIMO channel with CSIR. $M=8$, $N=2$, and $T=1$.


    In Section III-B averaging over the channel matrix $\boldsymbol{H}$ is considered,
    whereas $\boldsymbol{H}$ was fixed in Section III-A. Note that conditioning with
    respect to $\boldsymbol{H}$ is not omitted in Section III-B.


    We define the achievable rate $C_{\mathrm{FGSM}}(\gamma)$ of the flash GSM for
    the MIMO channel (1) with no CSI as


    $$C_{\mathrm{FGSM}}(\gamma)=\frac{\delta(\gamma)}{T}I\left(\mathcal{D}_t:\text{
    all }t;\boldsymbol{Y}\right). \tag{9}$$


    **Theorem 2:** Suppose that $\boldsymbol{x}_{\mathcal{M},t}$ satisfies all assumptions
    in Corollary 1. For any $\alpha\in(0,1]$, the achievable rate $C_{\mathrm{FGSM}}(\gamma)$
    of the flash GSM with $\delta(\gamma)=\gamma^{-\alpha}$ for no CSI is given by


    $$C_{\mathrm{FGSM}}(\gamma)=N\gamma-\frac{N(M+N)}{2M}\gamma^{1+\alpha}+o(\gamma^{1+\alpha}),
    \tag{10}$$


    if there is some $\epsilon>0$ such that $T$ satisfies (3).


    *Proof:* See Appendix B.


    Comparing (2) and (10) implies that the flash GSM is second-order optimal for
    the MIMO channel (1) with no CSI.


    # IV. NUMERICAL RESULTS


    In order to verify Corollary 1, numerical results are presented for QPSK GSM.
    Fig. 1 shows the ergodic achievable rates $C_{\mathrm{GSM}}^{\mathrm{CSIR}}(\gamma)\triangleq\mathbb{E}_{\boldsymbol{H}}[C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma;\boldsymbol{H})]$
    of the GSM for the CSIR case—estimated by Monte Carlo integration of (6)—as well
    as its low SNR approximation (8). For comparison, the channel capacity is also
    plotted.


    The low SNR approximation (8) is accurate for $\gamma<-5$ dB. In the same low
    SNR regime, the achievable rates of the GSM are indistinguishable from the capacity
    for all $\bar{M}$, as predicted in Corollary 1. As the maximum transmission rate
    $R=2\bar{M}+\log_2\binom{M}{\bar{M}}$ in bits increases, the achievable rates
    get closer to the capacity in the moderate SNR regime, while they are limited
    to below $R$ in the high SNR regime.


    # V. CONCLUSION


    The main results of this letter are twofold: One is that QPSK GSM is second-order
    optimal for the i.i.d. Rayleigh block-fading MIMO channel with CSIR, regardless
    of the number of simultaneously activated transmit antennas. The other is that,
    under a condition for coherence time, flash GSM with QPSK is second-order optimal
    for the no CSI case. The conclusion of this letter is that single-RF MIMO systems
    with QPSK are practically the best option in terms of the information-theoretical
    EE under rich scattering environment.


    An interesting future work is to construct precoded GSM for correlated MIMO channels
    with CSIR or for MIMO channels with full CSI. The low SNR approximation of the
    achievable rate in Theorem 1 can be used as an objective function for designing
    energy-efficient precoders in the low SNR regime. The maximization of the objective
    function over the input covariance matrices is concave, so that the precoder-design
    problem may be solved efficiently.


    # APPENDIX A


    # PROOF OF THEOREM 1


    We shall evaluate $I(\boldsymbol{D};\boldsymbol{y})=h(\boldsymbol{y})-h(\boldsymbol{y}|\boldsymbol{D})$
    in nats. From (5), $h(\boldsymbol{y}|\boldsymbol{D})$ given $\boldsymbol{H}$ is
    equal to the differential entropy of the AWGN vector $\boldsymbol{y}^{-1/2}\boldsymbol{w}$
    [15], i.e. $h(\boldsymbol{y}|\boldsymbol{D})=N\ln(\pi e\gamma^{-1})$.


    The differential entropy $h(\boldsymbol{y})$ given $\boldsymbol{H}$ is defined
    as


    $$h(\boldsymbol{y})=-\int p(\boldsymbol{y}|\boldsymbol{H})\ln p(\boldsymbol{y}|\boldsymbol{H})\,d\boldsymbol{y},
    \tag{11}$$


    with


    $$p(\boldsymbol{y}|\boldsymbol{H})=\mathbb{E}_{\mathcal{D}}\left[p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})\right],
    \tag{12}$$


    where $p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})$ represents the MIMO channel
    (1) with the GSM in a symbol period,


    $$p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})=\frac{1}{(\pi\gamma^{-1})^N}e^{-\gamma\|\boldsymbol{y}-\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2}.
    \tag{13}$$


    Extracting a $\mathcal{D}$-independent factor from (13) yields


    $$p(\boldsymbol{y}|\boldsymbol{H})=\frac{1}{(\pi\gamma^{-1})^N}e^{-\gamma\|\boldsymbol{y}\|^2}G(\sqrt{\gamma}\boldsymbol{y};\gamma),
    \tag{14}$$


    with


    $$G(\boldsymbol{u};\gamma)=\mathbb{E}_{\mathcal{D}}\left[\exp\left\{2\sqrt{\gamma}\,\Re\left[(\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}})^H\boldsymbol{u}\right]-\gamma\|\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2\right\}\right].
    \tag{15}$$


    Substituting (14) into (11) and using the change of variables $\boldsymbol{u}=\sqrt{\gamma}\boldsymbol{y}$,
    we obtain


    $$h(\boldsymbol{y})=N\ln(\pi e\gamma^{-1})+\gamma\mathbb{E}_{\mathcal{D}}\left[\|\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2\right]+H(\gamma),
    \tag{16}$$


    with


    $$H(\gamma)=-\mathbb{E}_{\boldsymbol{u}}\left[G(\boldsymbol{u};\gamma)\ln G(\boldsymbol{u};\gamma)\right],
    \tag{17}$$


    where $\boldsymbol{u}\sim\mathcal{CN}(\boldsymbol{0},I_N)$ is regarded as a standard
    complex Gaussian random vector.


    The first term on the RHS of (16) is equal to the differential entropy $h(\boldsymbol{y}|\mathcal{D})$.
    Furthermore, the second term reduces to the first term on the RHS of (7). Thus,
    it is sufficient to prove


    $$H(\gamma)=-\frac{\gamma^2}{2}\operatorname{Tr}\left\{\left(\boldsymbol{H}\mathbb{E}_{\mathcal{M}}[\boldsymbol{\Sigma}_{\mathcal{M}}]\boldsymbol{H}^H\right)^2\right\}+o(\gamma^2).
    \tag{18}$$


    We follow [4] to expand (17) with respect to $\sqrt{\gamma}$ up to fourth order
    in the low SNR limit $\gamma\to0$. Although the derivation is omitted, as a natural
    generalization of [4], under the assumption (4) we arrive at


    $$H(\gamma)=-\gamma\mathbb{E}_{\boldsymbol{u}}[a_1(\boldsymbol{u})]-\gamma^2\mathbb{E}_{\boldsymbol{u}}\left[a_2(\boldsymbol{u})+\frac{a_1(\boldsymbol{u})^2}{2}\right]+o(\gamma^2).
    \tag{19}$$'
