    # APPENDIX B


    # PROOF OF THEOREM 2


    The proof is an application of [14]. Using the chain rule [15] for mutual information,
    from (9) we obtain

    $C_{\mathrm{FGSM}}(\gamma)=(\delta(\gamma)/T)\{I(\{\mathcal{D}_t\},\boldsymbol{H};\boldsymbol{Y})-I(\boldsymbol{H};\boldsymbol{Y}|\{\mathcal{D}_t\})\}$

    $=\delta(\gamma)\big\{C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma'')+T^{-1}[I(\boldsymbol{H};\boldsymbol{Y})-I(\boldsymbol{H};\boldsymbol{Y}|\{\mathcal{D}_t\})]\big\}$

    $\ge \delta(\gamma)C_{\mathrm{GSM}}(\gamma''),\quad(25)$

    with

    $C_{\mathrm{GSM}}(\gamma'')=C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma'')-\tfrac1T
    I(\boldsymbol{H};\boldsymbol{Y}|\{\mathcal{D}_t\}),\quad(26)$

    where $C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma'')$ denotes the ergodic coherent
    achievable rate $T^{-1}I(\{\mathcal{D}_t\};\boldsymbol{Y}|\boldsymbol{H})$ for
    SNR $\gamma''$. In (26), the second term is interpreted as the penalty due to
    channel uncertainty.


    The upper bound (28) is $o(\gamma''^2)$ if (3) holds for some $\epsilon>0$ [14,
    Eq. (9)]. From (25) and (26) we obtain the lower bound $C_{\mathrm{FGSM}}(\gamma)\ge
    C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma)+o(\gamma''^2)$. Combining the lower bound
    and the trivial upper bound $C_{\mathrm{FGSM}}(\gamma)\le C_{\mathrm{opt}}(\gamma)$
    given by (2), from Corollary 1 we arrive at (10) for $\alpha=1.$


    Assume $\alpha\in(0,1)$. We have already proved that

    $C_{\mathrm{GSM}}(\gamma'')=N\gamma''-\dfrac{N(M+N)}{2M}\gamma''^2+o(\gamma''^2),\quad(29)$

    if $T=M^2(M+N)^{-2}\gamma''^{-2(1+\epsilon)}$ for some $\epsilon>0$. From $\delta(\gamma)=\gamma^{1-\alpha}$
    and $\gamma''=\gamma/\delta(\gamma)$, this is equivalent to

    $\delta(\gamma)C_{\mathrm{GSM}}(\gamma'')=N\gamma-\dfrac{N(M+N)}{2M}\gamma^{1+\alpha}+o(\gamma^{1+\alpha}),\quad(30)$

    if $T=M^2(M+N)^{-2}\gamma^{-2\alpha(1+\epsilon'')}$. Thus, from (25) we obtain
    Theorem 2 by letting $\epsilon=\alpha\epsilon''.$


