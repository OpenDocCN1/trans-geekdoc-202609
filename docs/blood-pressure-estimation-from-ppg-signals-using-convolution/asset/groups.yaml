    # B. No CSI


    It is known that it is wasteful to spread the transmit power over time for the
    no CSI case. An energy-efficient scheme is flash signaling [14], in which data
    transmission is performed only in a part of all fading blocks to reduce the number
    of fading blocks to be estimated. Flash signaling concentrates the transmit power
    on a part of fading blocks. Thus, it should be regarded as power allocation over
    time.


    We propose flash GSM as an energy-efficient scheme for the no CSI case. In flash
    GSM, transmission is performed only in δ(γ) fraction of all fading blocks. When
    transmission is active in a fading block, GSM with SNR γ'' = γ/δ(γ) is used to
    satisfy the average power constraint over all fading blocks.'
