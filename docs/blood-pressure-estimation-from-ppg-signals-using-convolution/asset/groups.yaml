    **推论 1：** 假设非零元素 $x_{\mathcal{M}}$ 的调制方案满足假设 (4)，并且非零元素 $x_{m,t}$ 是平均功率为 $\mathbb{E}[|x_{m,t}|^2]
    = \tilde{M}^{-1}$ 的独立变量。则对于任意同时激活天线数 $\tilde{M}$，遍历可达速率 $C_{GSM}^{CSI}(\gamma)
    = \mathbb{E}_H[ C_{GSM}^{CSI}(\gamma; H) ]$ 由下式给出


    $$

    C_{GSM}^{CSI}(\gamma) = N\gamma - \frac{N(M+N)}{2M} \gamma^2 + o(\gamma^2). \tag{8}

    $$


    ### B. 无 CSI


    已知在无 CSI 情况下在时间上分散发射功率是浪费的。一种节能方案是闪烁信号 [14]，其中数据传输仅在所有衰落块的一部分中进行以减少需要估计的衰落块数量。闪烁信号将发射功率集中在部分衰落块上。因此，它应被视为时间上的功率分配。


    我们提出闪烁 GSM 作为无 CSI 情况下的节能方案。在闪烁 GSM 中，传输仅在所有衰落块的 $\delta(\gamma)$ 分数中进行。当在衰落块中传输激活时，使用
    SNR 为 $\gamma'' = \gamma/\delta(\gamma)$ 的 GSM 以满足所有衰落块上的平均功率约束。


    在第 III-B 节中考虑对信道矩阵 $\boldsymbol{H}$ 的平均，而 $\boldsymbol{H}$ 在第 III-A 节中是固定的。注意第
    III-B 节中关于 $\boldsymbol{H}$ 的条件未被省略。


    我们定义无 CSI 下 MIMO 信道 (1) 的闪烁 GSM 的可达速率 $C_{\mathrm{FGSM}}(\gamma)$ 为


    $$

    C_{\mathrm{FGSM}}(\gamma)=\frac{\delta(\gamma)}{T}I\left(\mathcal{D}_t:\text{
    all }t;\boldsymbol{Y}\right). \tag{9}

    $$


    **定理 2：** 假设 $\boldsymbol{x}_{\mathcal{M},t}$ 满足推论 1 中的所有假设。对于任意 $\alpha\in(0,1]$，无
    CSI 下具有 $\delta(\gamma)=\gamma^{-\alpha}$ 的闪烁 GSM 的可达速率 $C_{\mathrm{FGSM}}(\gamma)$
    由下式给出


    $$

    C_{\mathrm{FGSM}}(\gamma)=N\gamma-\frac{N(M+N)}{2M}\gamma^{1+\alpha}+o(\gamma^{1+\alpha}),
    \tag{10}

    $$


    若存在某个 $\epsilon>0$ 使得 $T$ 满足 (3)。


    *证明：* 见附录 B。


    比较 (2) 和 (10) 可知，闪烁 GSM 对 MIMO 信道 (1) 在无 CSI 下是二阶最优的。


    ## IV. 数值结果


    为验证推论 1，给出了 QPSK GSM 的数值结果。图 1 显示了 CSIR 情况下 GSM 的遍历可达速率 $C_{\mathrm{GSM}}^{\mathrm{CSIR}}(\gamma)\triangleq\mathbb{E}_{\boldsymbol{H}}[C_{\mathrm{GSM}}^{\mathrm{CSI}}(\gamma;\boldsymbol{H})]$
    ——由 (6) 的蒙特卡洛积分估计得到——以及其低 SNR 近似 (8)。为比较，信道容量也被绘制出来。


    ![](img/917df36c69e658161399bf08d818da1c_2_0.png)


    图 1. QPSK GSM 在具有 CSIR 的 i.i.d. 瑞利衰落 MIMO 信道上的遍历可达速率随 SNR $\gamma$ 的变化。$M=8$，$N=2$，且
    $T=1$。


    低 SNR 近似 (8) 在 $\gamma<-5$ dB 时是准确的。在相同的低 SNR 区域，GSM 的可达速率与容量对于所有 $\tilde{M}$
    均无法区分，正如推论 1 所预测的。随着以比特计的最大传输速率 $R=2\tilde{M}+\log_2\binom{M}{\tilde{M}}$ 的增加，可达速率在中等
    SNR 区域更接近容量，而在高 SNR 区域则受限于 $R$ 以下。


    ## V. 结论


    本文的主要结果有两个：一是无论同时激活的发射天线数量如何，QPSK GSM 对于具有 CSIR 的 i.i.d. 瑞利块衰落 MIMO 信道都是二阶最优的。二是在相干时间条件下，QPSK
    闪烁 GSM 对于无 CSI 情况是二阶最优的。本文的结论是，在丰富的散射环境下，具有 QPSK 的单 RF MIMO 系统在信息论 EE 方面实际上是最好的选择。


    一个有趣的未来工作是为具有 CSIR 的相关 MIMO 信道或具有全 CSI 的 MIMO 信道构造预编码 GSM。定理 1 中可达速率的低 SNR 近似可作为低
    SNR 区域设计节能预编码器的目标函数。目标函数在输入协方差矩阵上的最大化是凹的，因此预编码器设计问题可以高效求解。


    ## 附录 A


    ### 定理 1 的证明


    我们将在纳特单位下求值 $I(\boldsymbol{D};\boldsymbol{y})=h(\boldsymbol{y})-h(\boldsymbol{y}|\boldsymbol{D})$。由
    (5) 可知，给定 $\boldsymbol{H}$ 时 $h(\boldsymbol{y}|\boldsymbol{D})$ 等于 AWGN 向量 $\gamma^{-1/2}\boldsymbol{w}$
    的微分熵 [15]，即 $h(\boldsymbol{y}|\boldsymbol{D})=N\ln(\pi e\gamma^{-1})$。


    给定 $\boldsymbol{H}$ 时微分熵 $h(\boldsymbol{y})$ 定义为


    $$

    h(\boldsymbol{y})=-\int p(\boldsymbol{y}|\boldsymbol{H})\ln p(\boldsymbol{y}|\boldsymbol{H})\,d\boldsymbol{y},
    \tag{11}

    $$


    其中


    $$

    p(\boldsymbol{y}|\boldsymbol{H})=\mathbb{E}_{\mathcal{D}}\left[p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})\right],
    \tag{12}

    $$


    其中 $p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})$ 表示符号周期内具有 GSM 的 MIMO 信道 (1)，


    $$

    p(\boldsymbol{y}|\boldsymbol{H},\mathcal{D})=\frac{1}{(\pi\gamma^{-1})^N}e^{-\gamma\|\boldsymbol{y}-\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2}.
    \tag{13}

    $$


    从 (13) 中提取与 $\mathcal{D}$ 无关的因子得到


    $$

    p(\boldsymbol{y}|\boldsymbol{H})=\frac{1}{(\pi\gamma^{-1})^N}e^{-\gamma\|\boldsymbol{y}\|^2}G(\sqrt{\gamma}\boldsymbol{y};\gamma),
    \tag{14}

    $$


    其中


    $$

    G(\boldsymbol{u};\gamma)=\mathbb{E}_{\mathcal{D}}\left[\exp\left\{2\sqrt{\gamma}\,\Re\left[(\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}})^H\boldsymbol{u}\right]-\gamma\|\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2\right\}\right].
    \tag{15}

    $$


    将 (14) 代入 (11) 并使用变量替换 $\boldsymbol{u}=\sqrt{\gamma}\boldsymbol{y}$，我们得到


    $$

    h(\boldsymbol{y})=N\ln(\pi e\gamma^{-1})+\gamma\mathbb{E}_{\mathcal{D}}\left[\|\boldsymbol{H}\boldsymbol{x}_{\mathcal{M}}\|^2\right]+H(\gamma),
    \tag{16}

    $$


    其中


    $$

    H(\gamma)=-\mathbb{E}_{\boldsymbol{u}}\left[G(\boldsymbol{u};\gamma)\ln G(\boldsymbol{u};\gamma)\right],
    \tag{17}

    $$


    其中 $\boldsymbol{u}\sim\mathcal{CN}(\boldsymbol{0},I_N)$ 被视为标准复高斯随机向量。


    式 (16) 右边第一项等于微分熵 $h(\boldsymbol{y}|\mathcal{D})$。此外，第二项化简为式 (7) 右边的第一项。因此，证明以下式子就足够了


    $$

    H(\gamma)=-\frac{\gamma^2}{2}\operatorname{Tr}\left\{\left(\boldsymbol{H}\mathbb{E}_{\mathcal{M}}[\boldsymbol{\Sigma}_{\mathcal{M}}]\boldsymbol{H}^H\right)^2\right\}+o(\gamma^2).
    \tag{18}

    $$


    我们遵循 [4] 在低 SNR 极限 $\gamma\to0$ 下将 (17) 关于 $\sqrt{\gamma}$ 展开到四阶。尽管推导被省略，作为 [4]
    的自然推广，在假设 (4) 下我们得到


    $$

    H(\gamma)=-\gamma\mathbb{E}_{\boldsymbol{u}}[a_1(\boldsymbol{u})]-\gamma^2\mathbb{E}_{\boldsymbol{u}}\left[a_2(\boldsymbol{u})+\frac{a_1(\boldsymbol{u})^2}{2}\right]+o(\gamma^2).
    \tag{19}

    $$

