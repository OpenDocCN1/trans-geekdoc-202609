    # C. Generalized Spatial Modulation


    In GSM, the transmitter activates \tilde{M} transmit antennas \mathcal{M}_t \subset
    \mathcal{M}_{all} = {1,...,M} with |\mathcal{M}_t| = \tilde{M} in symbol period
    t, and send data symbols only from the activated antennas \mathcal{M}_t. Thus,
    the sparse vector x_{\mathcal{M}_t,t} \in \mathbb{C}^M transmitted in symbol period
    t satisfies x_{m,t} = (x_{\mathcal{M}_t,t})_m = 0 for all m \notin \mathcal{M}_t.
    We assume that {\mathcal{M}_t} are sampled from all possible subsets of \mathcal{M}_{all}
    with cardinality \tilde{M} uniformly and randomly for all t, and that {x_{\mathcal{M}_t,t}}
    are independent for all t. The covariance matrix \Sigma_{\mathcal{M}_t} = \mathbb{E}[x_{\mathcal{M}_t,t}
