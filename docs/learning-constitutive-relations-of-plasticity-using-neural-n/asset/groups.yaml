    # 2. A hybrid-NN framework for learning constitutive relations


    ## 2.1. Displacement-based finite element method


    The hybrid FEM-NN framework is developed by extending the displacement-based finite
    element method. Here we describe equations by representing tensors and vectors
    as symbols. The form of equilibrium is given by

    $$\nabla \cdot \sigma + b = 0$$

    where $\sigma$ is the Cauchy stress and $b$ is body force per unit volume. Focusing
    on small analysis, the strain tensor $\varepsilon$ is related to the displacement
    $u$ by

    $$\varepsilon = \frac{1}{2}(\nabla u + \nabla u^T)$$

