    form of rate-independent $J_2$ plasticity. Specifically, the strain rate is decomposed
    into the elastic strain rate $\varepsilon^e$ and plastic strain rate $\varepsilon^p$

    $$\varepsilon = \varepsilon^e + \varepsilon^p$$

    The elastic strain rate determines the stress rate

    $$\dot{\sigma} = \lambda\dot{\varepsilon}I + 2\mu\dot{\varepsilon}$$

    where the Lamé constants $\lambda$ and $\mu$ are related to Young''s modulus $E$
    and Poisson''s ratio by $\lambda = \frac{E\nu}{(1+\nu)(1-2\nu)}$ and $\mu = \frac{E}{2(1+\nu)}$.
    Assuming associated plasticity flow, $J_2$ plasticity

    $$\sigma^p = 2\mu\dot{\varepsilon}^p$$

    where $\dot{\varepsilon}^p$ is the equivalent plastic strain rate, $s$ is the
    deviatoric stress

    $$s = \sigma - \frac{1}{3}\sigma I$$

    and $\sigma$ is the von Mises stress.


