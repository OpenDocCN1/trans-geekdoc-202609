    # 2. A hybrid-NN framework for learning constitutive relations


    # 2.1. Displacement-based finite element method


    The hybrid FEM-NN framework is developed by extending the displacement-based finite
    element method. Here we describe its equations by representing tensors and vectors
    as bold symbols. The form of equilibrium equations is given by


    ```

    $$\nabla \cdot \sigma + b = 0$

    ```


