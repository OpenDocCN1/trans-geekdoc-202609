    Neural networks have demonstrated capabilities of learning constitutive relations
    from big data, however most-based constitutive models require experimental data
    from a considerable number of stress-strain paths that are expensive to collect.
    We develop a hybrid method - NN (FEM-NN) framework for learning the constitutive
    relations from full-field data. As well, the non-uniform displacement field from
    a deformed sample with inhomogeneities can be used for training. Full-field data
    has the advantage of providing many different stress-strain paths in a single
    test, enabling efficient training of material models characterized by rate-independent
    j plasticity. The FEM-NNs demonstrate that the trained NN produce the constitutive
    relations of plasticity with high accuracy and efficiency.

    2022 Elsevier Ltd. All rights reserved.


    # 1. Introduction


    Constitutive relations of plasticity are critically important for representing
    the mechanical behavior of materials beyond their elastic limits. These are commonly
    based on either phenomenological [1,2] or mechanistic models [3]. The development
    of an isotropic (18)-thermodynamically-informed plasticity model requires a comprehensive,
    yet extensive experimental program to capture the stress-strain patterns along
    many paths. In the development of a mechanistic model, such as a crystal plasticity
    model, it relies on the measurement of the microscopic deformation details that
    can be difficult to obtain. In recent years, a different approach has emerged
    that the data-driven learning of constitutive relations through deep neural networks,
    does not necessarily require much human input and is potentially able to acquire
    the data generated from deformed samples.


    The NN-based learning of constitutive relations has been applied to problems involving
    heterogeneous elasticity [9–11], rate-dependent plasticity [12–14], path-dependent
    plasticity [15–17], isotropic-thermodynamically-informed plasticity [21–22]. To
    train these NNs,


    studies require experimental measurements from a considerable number of stress-strain
    paths, which are expensive to collect. It can become much more efficient to study
    the effects of multiple elements on constitutive relations when exploring the
    nearly infinite space of high-entropy alloys [23,24]. Moreover, the conversion
    of dog-bone-tested data into the full constitutive model requires the data that
    are collected for these tests. This mode of learning does not represent an efficient
    use of materials and testing effort. Without much information, the strain-path
    explored alone limits the learning of constitutive relations.


    Recently, a hybrid finite element - NN (FEM-NN) framework was developed to augment
    machine learning with samples from the partial field of deformations [25], and
    can be implemented as an extension of the off-sample FEM framework [26]. This
    makes it possible to learn constitutive relations from the observations of full-field
    data. The hybrid FEM-NN learns to machine-learn constitutive relations of plasticity
    from the full-field deformation of deformed samples, together with the sample-level-displacement
    data. The constitutive relations are learned through the FEM-NN, which acts as
    an'' example of a plastic constraint in the framework of rate-independent j_2
    plasticity.


