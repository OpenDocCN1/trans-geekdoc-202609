    combination of (1) and (2) allows one to solve the displacement field that satisfies
    the strong form of equilibrium. In contrast, the work of equilibrium equations
    can be expressed in terms of virtual work over a volume $V$ bounded by its surface
    $S$:

    $$\int_V \sigma : d\delta\varepsilon - \int_V b \cdot d\delta u = 0$$

    where $\delta u$ is the virtual displacement, $\delta\varepsilon$ is the virtual
    strain, and $t$ is the surface force. Also $\sigma$ depends on the displacement
    field $u$ through the constitutive relation. The work of equilibrium equation
    (3) can be discretized into finite elements to solve the displacement field using
    the Galerkin method.


    In this work, the procedure is implemented using the open-source framework FEniCS
    [26]. The variational problem could be solved in the domain-specific language
    UFL [31], using the following statement

    $$F = \int_\Omega \sigma : d\delta\varepsilon$$

    where $F$ stands for the functional of the variational problem, the "inner" represents
    the scalar product of two tensors through the dot operator in Eq. (3), and $d\Omega$
    integrates over the volume $V$. In Eq. (4), $\sigma$ depends on an unknown displacement
    field $u$. Here displacement boundary conditions are applied. Because the function
    is fixed, it is possible to assemble and solve the nonlinear system $F=0$ with
    Newton''s method. The Jacobian of such a system is calculated automatically by
    automatic differentiation.


