    volume. Focusing on small analysis, the strain tensor $\varepsilon$ is related
    to the displacement vector $u$ by


    ```

    $$\varepsilon = \frac{1}{2}(\nabla u + \nabla u^T)$

    ```


    Since $\sigma$ depends on $\varepsilon$ through the constitutive relation, the
    combination of (1) and (2) allows one to solve the displacement field that satisfies
    the strong form of equilibrium. In contrast, the work of equilibrium equations
    can be expressed in terms of the virtual work principle over a volume of the material
    $V$ bounded by its surface $S$.


    ```

    $$\int_V \sigma :cdot d\delta\varepsilon - \int_V b \cdot d\delta u = 0$

    ```


    where $\delta u$ is the virtual displacement, $\delta\varepsilon$ is the virtual
    strain, and $t$ is the surface force vector on $S$. Also $\sigma$ depends on the
    displacement field $u$ through the constitutive relation. The work of equilibrium
    equation of (3) can be discretized into finite elements to solve the displacement
    field using the Galerkin method.


    In this work, the procedure is implemented using the open-source framework FEniCS
    [26]. The variational problem could be solved in the domain-specific language
    UFL [31], using the following Python statement


    ```

    $F = \int_\Omega \sigma :cdot d\delta\varepsilon$

    ```


