    # Conclusion


    +   [12] X. Wang, J. Zhang, Temperature-rate and deformation constitutive modeling
    of alloys: Experiments and neural network model, Int. J. Phys. 315 (2020) 102788.


    We have developed a HFE-NN framework for learning constitutive relations using
    full-field data as in conjunction with sample-level data such as force-displacement
    curve. The non-uniform deformation in the field is used to generate stress-strain
    paths at different locations, providing many samples by a single test, thereby
    enabling the high efficiency training of NNs. Our study of the models shows that
    the HFE-NN can learn constitutive relations accurately and efficiently. The open-source
    framework FeCNics is designed to handle the trained NN constitutive relations
    which can be transferred to other programs without modification. By integrating
    the HFE-NN approach we achieved the effective constitutive modeling of materials
    by data driven.


    +   [13] L. Liu, Y. Zhang, Data driven machine learning for the prediction of
    temperature and deformation limit in metal alloys with finite element method,
    J.Phys. Solids. 153 (2021) 113036.


    +   [14] J. Wang, Application of neural networks for predicting path deformation
    in metallic networks, J. Mech. Phys. 143 (2020) 104320.


