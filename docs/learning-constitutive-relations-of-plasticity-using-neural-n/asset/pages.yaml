    # 2. A hybrid-NN framework for learning constitutive relations


    # 2.1. Displacement-based finite element method


    The hybrid FEM-NN framework is developed by extending the displacement-based finite
    element method. Here we describe its equations by representing tensors and vectors
    as bold symbols. The form of equilibrium equations is given by


    ```

    $$\nabla \cdot \sigma + b = 0$

    ```


    where $\sigma$ is the Cauchy stress tensor and $b$ is the body force per unit
    volume. Focusing on small analysis, the strain tensor $\varepsilon$ is related
    to the displacement vector $u$ by


    ```

    $$\varepsilon = \frac{1}{2}(\nabla u + \nabla u^T)$

    ```


    Since $\sigma$ depends on $\varepsilon$ through the constitutive relation, the
    combination of (1) and (2) allows one to solve the displacement field that satisfies
    the strong form of equilibrium. In contrast, the work of equilibrium equations
    can be expressed in terms of the virtual work principle over a volume of the material
    $V$ bounded by its surface $S$.


    ```

    $$\int_V \sigma :cdot d\delta\varepsilon - \int_V b \cdot d\delta u = 0$

    ```


    where $\delta u$ is the virtual displacement, $\delta\varepsilon$ is the virtual
    strain, and $t$ is the surface force vector on $S$. Also $\sigma$ depends on the
    displacement field $u$ through the constitutive relation. The work of equilibrium
    equation of (3) can be discretized into finite elements to solve the displacement
    field using the Galerkin method.


    In this work, the procedure is implemented using the open-source framework FEniCS
    [26]. The variational problem could be solved in the domain-specific language
    UFL [31], using the following Python statement


    ```

    $F = \int_\Omega \sigma :cdot d\delta\varepsilon$

    ```


    where $F$ stands for the functional of the variational problem, the "inner" represents
    the scalar product of two tensors through the dot operator in Eq. (3), and $d\Omega$
    integrates over the volume $V$. In Eq. (4), $\sigma$ depends on an unknown displacement
    field $u$. Here the de- displacement boundary conditions are not applied. Because
    the function is fixed, it is possible to assemble and solve the nonlinear system
    $F=0$ with Newton''s method. The Jacobian of such a system is calculated automatically
    by automatic differentiation.


    # 2.2. Constitutive relations of plasticity


    The constitutive relations are learned through an example plasticity constraint
    in the form of rate-independent $J_2$ plasticity. Specifically, the strain rate
    is decomposed into the elastic strain rate $\varepsilon^e$ and plastic strain
    rate $\varepsilon^p$


    ```

    $$\varepsilon = \varepsilon^e + \varepsilon^p$

    ```


    The elastic strain rate determines the stress rate


    ```

    $$\dot{\sigma} = \lambda\dot{\varepsilon}I + 2\mu\dot{\varepsilon}$

    ```


    where the Lamé constants $\lambda$ and $\mu$ are related to Young''s modulus $E$
    and Poisson''s ratio by $\lambda = \frac{E\nu}{(1+\nu)(1-2\nu)}$ and $\mu = \frac{E}{2(1+\nu)}$.
    Assuming associated plasticity flow, the $J_2$ plasticity


    ```

    $$\sigma^p = 2\mu\dot{\varepsilon}^p$

    ```


    where $\dot{\varepsilon}^p$ is the equivalent plastic strain rate, $s$ is the
    deviatoric stress


    ```

    $s = \sigma - \frac{1}{3}\sigma I$

    ```


    and $\sigma$ is the von Mises stress


    In the rate-independent $J_2$ plasticity model, $\sigma_y$ the yield criterion
    is met when $\sigma$ yields the stress yield, $\sigma_y$ is a function of the
    equivalent plastic strain $\varepsilon^p = \int_0^t ||\dot{\varepsilon}^p|| dt$.
    time The material has no quasi-static response and means that the hybrid FEM-NN
    framework can learn the time-dependent constitutive behavior.


    Note that $\sigma_y$ depends on $\varepsilon^p$ through an explicit function and
    is determined by training a NN. When the NN learns the yield stress, the material
    behaves elastically and predicts the correct results.


