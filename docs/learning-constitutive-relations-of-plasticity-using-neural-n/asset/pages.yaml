    # 2.4 Training NN from full-field data


    The NN-based constitutive relation of plasticity in Section 2.3 can be trained
    using experimentally measurable full-field data, such as the non-uniform displacement-data
    of a tensile sample containing geometric heterogeneities, together with simple-plate
    sample containing five positioned randomly colored nodes as full-field data.


    The elastic and plastic properties are modeled separately. We generate the constitutive
    relation from a computational model of experimental measurements. In this case,
    the material model uses the $f_j$ plasticity with a specified yield stress $\sigma_n^{ij}$
    and the corresponding displacement field $u_n^{NN}$ calculated by the integration
    procedure in Section 2.3 of FEniCS.


    The training data include the in-field displacement field $u_n^{NN}$ and the sample-level
    force $\sigma_n^{NN}$ versus $u_n^{NN}$ for all the increments $n=1...N$. To obtain
    the FEM-NN solution of the plate using the $\sigma_n^{NN}$ and the sample-level
    force include the data displacement field $u_n^{NN}$ and the sample-level force
