- pgno: 57
  md: 'PHP simply adds elements to the appropriate superglobal array as they are retrieved
    from the query string or POST information. As a result, if two elements have the
    same name, the first one will be overwritten by the second. Therefore, Answer
    C is correct.


    10. Answer B is always correct. While the implode function can be used to convert
    an array into a string—a prerequisite of being able to store it in a cookie—it
    cannot guarantee that you''ll be able to reconstruct an array at a later day the
    serialize() function. Storing an array in a cookie may not be a good idea because
    browsers only allow a limited amount of storage space for each cookie, but that''s
    not always the case—you should be able to store relatively small arrays without
    much in the way of problems.


    11. Another question designed to see how well you recognize bugs in a script.
    Did you notice that, at the end of the script, the output is misspelled in the
    echo statement? The script will output a notice and, therefore, Answer E is correct.


    12. The filesystem (Answer A). By default, PHP stores all session information
    in the /tmp folder; users of operating systems where this folder doesn''t exist
    (such as Windows) must change the default value of the session.save_path in php.ini
    to a directory appropriate for their setup (e.g.: C:\Temp.


    13. Answers A and D describe likely causes of this type of problem and warrant
    investigation on your part. Since the browser seems to work fine, it''s unlikely
    that its binaries have suffered corruption such that only your site has stopped
    working, and virus-scanning programs do not normally stop secure cookies selectively
    (although all cookies). On the other hand, the browser might have been explicitly
    set to refuse all cookies, which is probably the first source of trouble you should
    check for. By the same token, the computer''s time might have been set incorrectly
    and, since cookie expiration dates are coordinated by GMT, cause the cookie to
    expire as soon as it was set and never returned to your scripts.


    14. The session.gc_maxlifetime ini regulates the amount of time since the last
    access after which the session handler considers a session data file "garbage"
    and marks it for deletion by the garbage handler. Once this has happened, any
    subsequent access to the session will be considered invalid, even if the data
    file still exists. Coincidentally, the session.gc_maxlifetime is set to 1,440
    seconds, but you can''t rely on that as it might have been changed without your
    knowledge by the system administrator. Answer B is, therefore, correct.


    15. This identifies the nl2br function, which can be used precisely for this purpose.'
