- pgno: 150
  md: '# Debugging Code and Managing Performance


    allocation issues. Therefore, the script is immediately halted, because the interpreter
    is unable to guarantee that it will be possible to execute any further code.


    +   9. Answer C is correct. This advantage of a fact, while comparisons are commutative
    operations (meaning that the result is independent of the order of the operands),
    assignments are not. for, example, $a = 10$ and $10 = a$ are equal, while $a =
    10$ and $10 = a$ are not—and the latter generates an error because it is an invalid
    operation. By ensuring that the constant is the first value in the operation,
    you can be sure that you did not mistakenly use an assignment when you wanted
    to compare.


    +   10. Answer C is correct. The `error_log` function can be used, among other
    things, to send a message to a specified internal address. Although it uses the
    same internal function as `mail()`, `error_log()` automatically adds a subject
    to the e-mail and is, therefore, the easiest method of submitting an report using
    this method.


    +   11. The correct answer is no. While the `error_reporting` function can be
    used to turn off all runtime error reporting, it cannot be used to silence parse-time
    errors, for the simple reason that they occur before the script is actually executed.


    +   12. Answer C is, obviously, correct. A profiler monitors a script while it
    is running, recording the times that it takes to execute every single portion
    of it. It can be used to identify and solve bottlenecks.


    +   13. This is the perfect definition for a debugger! Debugging software makes
    it possible to identify and solve any programming defects by allowing you to carefully
    monitor each aspect of your scripts and analyze their effects on system resources
    one step at a time.


    +   14. There really is no difference between `trigger_error()` and `user_error()`—in
    fact, the latter is simply an alias for the former


    +   15. Answer D is correct. The question describes the `debug_backtrace` function,
    which returns an array containing all the function calls (also known as a traceback)
    that led to a certain point in the code.'
