  md: '# 7

    Date and Time Management


    ALMOST EVERY WEBSITE WILL, at some point, have to deal with dates and times. If
    you need to collect your users'' birthdates, or if you need to record the time
    at which a particular transaction took place, PHP''s date functions can help you
    in your tasks.


    However, PHP''s date/time management functions are anything but perfect. The fact
    that they are based entirely on the UNIX timestamp format makes them vulnerable
    to a number of different pitfalls of which you, as a developer, must be acutely
    aware in order to avoid finding yourself in the possession of very bad data.


    At the same time, managing dates on the Web has become an international affair.
    As a result, you should be able to not only deal with different time zones, but
    also with different locales and their peculiar way of display date information.


    This section of the exam tests your abilities in all the areas above.'
