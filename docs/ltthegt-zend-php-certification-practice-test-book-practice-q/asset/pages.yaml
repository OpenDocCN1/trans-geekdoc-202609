  md: '# 11

    Writing Secure

    PHP Applications


    THE DOWNSIDE OF PHP’s low barrier-of-entry is the fact that the language is so
    powerful and easy to use that it is easy to forget the importance of security
    in the context of web applications.


    Despite its significance, security is, possibly, the most-often ignored aspect
    of a web site. Even more unfortunately, there are so many ways to compromise a
    system from the inside out that one has to be constantly on the lookout for potential
    problems.


    When the SMEs were designing the exam, a great amount of emphasis was put on security—not
    only for the questions directly related to it, but on all questions that pertain
    to every other topic.


    Writing a secure application starts with good knowledge of a few fundamental techniques,
    which you will find covered in this chapter.'
  merge: -1
  img_proc: true
