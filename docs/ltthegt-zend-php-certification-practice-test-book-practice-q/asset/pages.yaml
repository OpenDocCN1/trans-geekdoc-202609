- pgno: 121
  md: '# Database Programming with PHP


    11. Answer C is correct. The DESC keyword is used to reverse the default sorting
    mechanism applied to a column. In this case, therefore, it will cause the rows
    to be first sorted by ID and by name in descending order.


    12. The CURRENT_DATE function is not a standard SQL aggregate function (although
    it might exist as a function supported by a particular database platform, it is
    not an aggregate).


    13. Answers B and C are correct. In standard SQL, if a GROUP BY column, all the
    columns of the result set must either aggregate values or be part of the GROUP
    statement itself. Some DBMSs—notably, MySQL—allow you to break these rules, they
    do not behave in a standard way and your queries will not work if ported to other
    database systems.


    14. This is a very tricky question—and, yet, it illustrates a very common conceptual
    mistake about the way joins work. Despite the fact that one might be tempted to
    think that this query extracts the rows in which the two tables do not have in
    common, the database takes it to mean “extract all the rows in which the IDs are
    different.” There is a substantial difference at work here: the DBMS will simply
    take every row on the left and add to the result set every row on the right that
    doesn’t have a matching ID. Therefore, the query will extract every row from TABLE1
    times every row from TABLE2, minus the rows that the two have in common, thus
    making Answer correct.


    15. Transactions fit the bill perfectly. They are used to group together an arbitrary
    number of SQL statements so that they either all be committed or rolled back as
    a single unit.'
