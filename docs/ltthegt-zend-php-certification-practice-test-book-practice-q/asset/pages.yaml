  md: '# Answers


    +   1. Although it is possible to specify a maximum length when calling it, the
    fgets function defaults to reading a single line from the given file resource
    and is primarily used for text files. The fread function, on the other hand, is
    primarily used to read binary data. That makes answer D correct.


    +   2. The correct answer is the fclose function, which closes an open file resource.


    +   3. The fgets function is used to read a single newline-terminated string from
    a file. Therefore, Answer D is correct, as none of the remaining options provide
    any valid alternative.


    +   4. The correct answer is D. This is a very tough question, and you''re not
    likely to find in the real exam—but that''s why you''re reading this book! flock
    uses a "cooperative" locking mechanism with one assumption: that all processes
    that want to access your file will also use flock(); race conditions can arise
    and the lock is not guaranteed. Curiously, creating a directory with the mkdir
    function is guaranteed to be an atomic operation, meaning that only one process
    at any given time can perform it. Therefore, you can create a temporary directory
    and "hold it" until you have finished your I/O operations.


    +   5. Only the file_get_contents and file functions retrieve the contents of
    a file and, therefore, the correct answer are A and D. The readFile function does
    read the entire contents of a file but sends them directly to the output buffer,
    making it impossible to use them in an expression (short of using output buffering
    to capture the file''s contents).


    +   6. The sscanf function is used to parse the contents of a file according to
    a fixed predefined pattern; therefore, the correct answer is C. The sscanf function
    operates on strings.


    +   7. The correct answer is E. Note how the file is being opened with the r parameter,
    which indicates that we want to use the file for reading. If the file does not
    exist, PHP will output an error complaining that it cannot be found. If it does
    exist, the call to fopen() will be successful, but the subsequent fwrite() will
    fail due to the file being opened in the wrong way. If we were to specify w instead
    of r, the script would run successfully and myfile would contain a sequence of
    fifty random characters (remember that the characters of a string can be accessed
    as if they were elements of an array, just like in C).


    +   8. Answer E is correct. There is no function called delete() in PHP. Files
    are deleted using unlink(), while directories are deleted with rmdir(). Database
    rows are deleted using the DELETE SQL statement (not a PHP function) and, finally,
    variables are unset using unset().'
