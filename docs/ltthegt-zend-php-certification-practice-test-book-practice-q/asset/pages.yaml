- pgno: 46
  md: '# Answers


    1. A class is a blueprint of an object, which is an instance of a class.


    2. The three correct answers are B, C and D. The set_value method of my_class
    will not work correctly because it uses the expression $this->my_value, which
    is a "variable variable" that, under the circumstances will never correspond to
    any real property of the class.


    3. Answer C is correct. In PHP 4, it is not possible to limit access to class
    members or properties. This can, however, be done in PHP 5, by declaring a property
    as private.


    4. The Singleton Pattern is handy whenever one instance of a particular class
    can exist at any given time (and, yes, when you''re wondering, you should expect
    the exam to test you on the basics of patterns, too).


    5. Although other languages allow for multiple-inheritance, PHP''s object model
    is one of single-inheritance. Therefore, the correct answer is A.


    6. This tidbit of code approximates the behaviour usually provided by an abstract
    method. If this class is inherited by another class and the my_function method
    is called without being overridden in the child, the code will throw an error.
    Naturally, this is only an approximation of the way abstract methods work, but
    it''s the best that can be done using PHP 4''s limited object model.


    7. Although PHP 5 has "unified" constructors (__construct()), in PHP 4 constructors
    are always whose name matches the class name. This means that, for a class called
    testclass, the constructor is Answer, testclass().


    8. __sleep() and __wakeup() can be used to customize the serialization process
    of an object. The correct answer, is, C


    9. In PHP 4, there is no concept of any of the classic object-oriented constructs
    listed in the question (although many were introduced in PHP 5), so Answer D is
    correct.


    10. In PHP, methods and properties of a class'' current instance are accessed
    from within its methods using the $this variable. Answer B, is correct.


    11. The right answer is D—the script won''t output anything because my_class::$my_class()
    is not a valid constructor (did you notice the underscore at the beginning of
    the method name?). You might think that this is nothing but a trick question designed
    to show how much attention you''re paying during the exam... and you''re right.
    If you think about it, though, you''ll probably agree with us that many bugs occur
    because of misplaced characters.'
