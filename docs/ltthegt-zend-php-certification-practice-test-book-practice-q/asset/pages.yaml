- pgno: 56
  md: '# Answers


    1. Although session data can be accessed using the global variables if the register_globals
    INI setting is turned on, the exam uses a version of PHP configured using the
    default php.ini file found in the official PHP distribution. In recent versions
    of PHP, the register_globals setting is turned off by default because of its serious
    security implications. As a result, Answer E is correct.


    2. Clearly, this question refers to the setcookie or setrawcookie functions, although
    the header function could be used as well.


    3. Answer B is correct. Browsers do not allow an HTTP transaction that takes place
    on one domain to another. Doing otherwise would prevent clear security implications:
    for example, a malicious page on one domain could overwrite your session ID for
    another domain and force you to use another session to which a third party has
    access without your knowledge.


    4. Since the form''s method is post, the script will only be able to read the
    value through the $_POST and $_REQUEST superglobal arrays. The element''s name
    (email) is used as the key for the value in array and, therefore, Answers B and
    D are correct. Note that, although perfectly valid from a logical perspective,
    the use of $_REQUEST should be discouraged because of potential security implications.


    5. This question tests nothing about your knowledge of HTML encoding—and about
    your ability to properly interpret code. The $ss function is left unaltered by
    the call to htmlentities(), which returns the modified string so that it can be
    assigned to $ss. Therefore, Answers B and D are correct. If you''re wondering
    whether this is an "trick" question, keep in mind that, often, the ability to
    find and resolve bugs outweighs discovering little mistakes like this one.


    6. Cookies automatically expire at the end of the user''s browser session if no
    explicit expiration time is set. Cookies are not necessary to maintain a server-side
    session, so answer D is correct.


    7. Since the form is submitted using a POST HTML transaction, whatever values
    are typed in the text boxes are only going to be available in the $_POST superglobal
    array. Therefore, Answer C is correct, since the $_GET array won''t contain any
    values and PHP will issue a notice to this.


    8. When an HTTPS transaction takes place, the browser and the server immediately
    negotiate an encryption mechanism so that subsequent data is not passed in clear
    text—including the URL and query string, which are otherwise passed the same way
    as with a traditional HTTP transaction. Answer B is, therefore, correct.'
