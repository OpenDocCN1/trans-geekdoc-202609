  md: '# 6 Manipulating Files and the Filesystem


    THOUGH YOU MAY NEVER think of file manipulation as one PHP''s strengths, it is
    actually a very useful tool for the developer. Even if you only develop websites,
    being able to read from and write to a file can turn out to be a very handy capability.
    After all, thanks to its stream wrappers (covered in more detail in Chapter 10),
    PHP makes it possible to open a remote file and read from it—useful, for example,
    for including content from a third-party site.


    On a more basic level, however, file input/output can be used for a multitude
    of tasks. For example, it''s handy for reading and interpreting the contents of
    a preformatted file, such as you could receive from a third-party provider sending
    you syndicated content, or for opening up and outputting binary files to the browser
    through your scripts so that you can more tightly control access to them. Whatever
    the end use, you will be tested not only on the basics of opening, closing and
    accessing a file''s contents, but also on fundamental aspects of file manipulation
    that are relevant in a multi-process environment, such as file locking.'
