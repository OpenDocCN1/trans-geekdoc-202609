- pgno: 120
  md: '# Answers


    1. The two best tips for optimizing this query are, if possible, to limit the
    amount of data extracted by it by adding a WHERE clause and specifying the exact
    fields you want extracted from it. In general, unless otherwise dictated by the
    circumstances, you should not use *, both because of the waste of data and because
    it exposes your application to problems arising from changes in the database structure.
    This makes B and C correct.


    2. Queries can be filtered in many ways, but it''s clear here that the question
    asks about filtering performed on the dataset to be returned by a query and; therefore,
    the WHERE clause is the correct answer.


    3. The answer that comes closest to the truth is definitely Answer B. Inner joins
    are used to join the contents of two tables based on a specific set of commonalities
    and then create a dataset that only contains rows in common


    4. Answer E is correct. PHP has dedicated extensions for PostgreSQL and MySQL,
    while DB/2 can be accessed through ODBC and Microsoft SQL Server using TDS and
    mssql extension. This question tests your knowledge of PHP’s capabilities—which
    could come handy if you were discussing database adoption with your development
    team.


    5. Answers B and D are correct. This script is very dangerous because the data
    inputted from the user is not escaped or filtered in any way by the application
    before being sent to the DBMS. Therefore, if the URL contained the parameter ID=0+OR+1,
    the query would become DELETE FROM MYTABLE WHERE ID = 0 OR 1, causing the database
    to delete all the rows from the table.


    6. The INSERT statement is, obviously the correct answer.


    7. Answer C is correct. Writing good indexes often means analyzing the actual
    usage of a database and determining its weak points. It’s also a good way of optimizing
    scripts that perform redundant queries needlessly!


    8. You can nest an arbitrary number of join clauses, although the results may
    not always be what you expect.


    9. Answer C is correct. Indexing the ID column will ensure prompt filtering of
    the dataset from the WHERE clause, while indexing NAME and ZIPCODE will make the
    sorting operation significantly faster.


    10. Given that this set of queries is contained within a transaction and that
    the transaction is rolled back at the end, no changes will be made to the database.
    Therefore, Answer E is correct.'
  merge: -1
