  md: '# # Answers


    1. Of all of the e-mail addresses listed above, only Answer D is invalid. Both
    A and B are classic e-mail addresses that are in use frequently today. Although
    C looks invalid, mail transport agents (MTAs) automatically remove extra whitespace,
    making it just as good, while E is valid for a local delivery. It leaves D, which
    contains an invalid character for an e-mail address (an accented letter).


    2. The correct answers are A and D. While the UNIX version of PHP requires the
    sendmail application (or an equivalent implementation thereof) to send mail through
    SMTP, the Windows/Novell environments communicate directly with the MTA using
    SMTP. However, if PHP can also be configured to use a “sendmail wrapper” to simulate
    the sendmail application on Windows/Novell, in which case all three versions of
    PHP would function in the same way. Also note that, when using the internal implementation
    of mail() on Windows/Novell environments, it is necessary to set the sendmail_from
    configuration directive, while UNIX flavours leave that task to the sendmail application.


    3. PHP can indeed send e-mails of any valid format using the mail function, making
    communication with the MTA at the top of the e-mail must be added as a string
    using the *additional_headers* parameter, with each header ending with both a
    newline and linebreak character (\n). When sending complex e-mails, such as ones
    with file attachments or HTML-formatted text, not only must additional headers
    be added, but MIME-specific headers must also be included in the message portion
    of the e-mail, so answer E is correct.


    4. When sending MIME e-mails that are considered multi-part, you must specify
    a boundary (any US-ASCII string) that is unique not enough to appear at any point
    in the body of the e-mail. This boundary must be unique for each embedded multi-part
    block in a MIME message; it is specified in the content-type: MIME header.


    5. There are indeed two answers above that are valid for including elements, such
    as images, within your HTML document. The fastest method is to simply reference
    a remote image by specifying any valid URL for the *src* attribute of the tag.
    However, images and other component element can be embedded within the MIME e-mail
    itself as a MIME content block. These content blocks are then assigned a content
    ID, which can be referenced from the assigned content ID. This means that Answers
    B and C are correct.


    6. The final parameter of the mail function is used to provide additional parameters
    to the sendmail application and is typically only used in UNIX environments where
    sendmail is available. However, this parameter could also be used in Windows/Novell
    environments where the sendmail_path configuration directive is used.'
