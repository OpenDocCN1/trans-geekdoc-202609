    12. This question is a bit convoluted, so it''s easy to get lost in. For starters,
    notice that it specifies two important assumptions: first, that you do not have
    any compelling reason for passing the array away. If you needed a function to
    modify the array''s contents, you''d have no choice but to pass it by reference—but
    that''s not the case. The question specifies that we''re passing the array to
    a read-only function; if this were not the case, Answer B would be true. As a
    general rule, however passing by reference to a function that does not modify
    its contents is slower than passing it by value, since PHP creates a set of structures
    that it uses to maintain the reference. Because PHP uses a lazy-copy mechanism
    (also called copy-on-write) that does not actually create a copy of a variable
    until it is modified, passing an array by value is very fast and safe method of
    sharing an array with a function, and answer E is correct.


    13. The correct answer is E. The sort function works directly on the array passed
    (by reference) to, without creating a copy and returning it. Instead, it returns
    the Boolean value true (or False to indicate an error). Note that this example
    passes the $ai array to sort_my_array() by reference; then this technique is deprecated
    and the function should be re-declared accepting values by reference instead


