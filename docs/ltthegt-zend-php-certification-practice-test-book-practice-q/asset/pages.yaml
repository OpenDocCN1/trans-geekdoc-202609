- pgno: 124
  md: '# # 10

    # Stream and Network Programming


    WHEN IT COMES TO dealing with external data sources, PHP provides a great many
    different ways to communicating with the external world. These include facilities
    like file access and e-mail management. However, both these systems are highly
    specialized: file management deals load up your local filesystem, while the e-mail
    functions handle only a very narrow aspect of network communications.


    For more generic needs, PHP provides a facility called streams, which simply make
    it possible to treat any data source as a file. For example, the “fopen wrappers”
    that can be used to load up the contents of an external web page in your script
    are an excellent example of streams: they let you use file functions to pull content
    off the Internet.


    Finally, more complex operations can be managed through socket programming, which
    allows for the highest level of flexibility possible.


    This section of the exam tests your knowledge of these two areas of expertise.'
  merge: -1
  img_proc: true
