    however, that in PHP 5 the behaviour of this script would have been different
    (outputting

    10)—but remember that the exam is about PHP 4, not PHP 5.


    13. This is a really tricky one. Upon first examination, it would seem that the
    constructor of

    my_class stores a reference to itself inside the $global_obj variable. Therefore,
    one would

    expect that, when we change the value of $global_obj->my_value to 10, the corresponding

    value in $a would change as well. Unfortunately, the new operator does not return
    a reference,

    but a copy of the newly created object. Therefore, the script will output 5 and
    the correct

    answer is A.


    14. In PHP, objects that are passed to a function or method are, by default, passed
    by value,

    meaning the object used within the function is actually a copy of the object that
    was passed

    as a parameter. This unfortunate side effect means that any modifications to the
    object

    performed within the context of the function or method call will not apply to
    the original

    object outside of the function''s scope.


    In the case of Question 14, this means that the $eight_tenths object was never
    altered by the

    reduce_fraction function, which the $fraction object (the parameter) was. An object
    that might

    be modified inside a function should always be passed to it by reference:


    ```

    function_fraction(&$fraction)

    ```


    Thus, the correct answer is D.


    15. The syntax in the question is used to call methods within a class from a static
    context.

    When methods are called from a static context, they behave like functions, and
    have no

    association with any existing instance of the class. The correct answer is A.


    16. No Static class variables do not exist in PHP 4—the language only allows for
    the

    declaration of static function variables.


    17. Answer A is correct. The $myvar class attribute will be defined in class b
    by the time

    constructor of its parent class a is called and, besides, class variables need
    not be defined for

    a value to be assigned to them—just like any other variable in PHP 4. Because
    class bnassigns a variable to its $myvar property before calling its parent''s
    constructor, which, in turn,

    assigns it a different value, the final output will be 1.'
