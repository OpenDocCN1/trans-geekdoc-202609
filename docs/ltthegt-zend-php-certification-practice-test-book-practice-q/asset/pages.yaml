- pgno: 22
  md: '# # 1n PHP Programming Basics


    THE ZEND EXAM IS designed so that you need a reasonable amount of experience in
    order to pass it. This doesn''t mean that you have to be Superman—it simply means
    that, in order to pass the exam, you''ve had to have a good amount of exposure
    to PHP in your daily life.


    Therefore, it is essential that you know your "basics" very well. These are the
    elements of PHP that you will deal with on a constant basis, since they are at
    the very foundation of the language itself. While not being very prepared on other
    areas of the exam may only be the result of them not being part of your day-to-day
    programming routine, failing a considerable number of questions in this chapter
    should raise a red flag. After all, if you don''t know the basics, you''ll have
    trouble understanding more advanced topics as well.'
  merge: -1
  img_proc: true
