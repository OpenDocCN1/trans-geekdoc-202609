- pgno: 139
  md: '# Answers


    1. The correct answer is D. Although in different ways each answer could be considered
    correct, by far the single largest piece of the security puzzle is the validation
    of information taken from any external source. It be from a user''s form submission
    or from the server environment, any data taken from a third party source should
    always be validated to make sure it fits within the context of each application.


    2. The correct answer is C. This code is, by means, not secure! In fact, it is
    the classic security exploit of PHP scripts using the register_globals configuration
    directive. The problem lies in the $isadmin variable: although this is a Boolean
    value, it is only set in the event that the user is an Admin and not set at all
    if the user is. Because register_globals is enabled, by simply appending to the
    end of the URL as a GET parameter, a malicious user could easily impersonate an
    administrator:


    ```

    http://www.example.com/action.php?action=delete&data=foo&isadmin=1

    ```


    3. The correct answers are A, B, and D. A and B address the same security hole
    common among PHP scripts, where a malicious user is able to inject a URL into
    the $username variable. If a user is able to edit the script.txt file and low_url_fopen
    is enabled, PHP will download the script located on that remote untrusted server
    and execute it as PHP code! Another common exploit, which is arguably less serious,
    consists of passing user input to another user, for example in a forum or e-mail,
    without stripping of unwanted HTML tags. Failing to do so allows a malicious user
    to write JavaScript code that, when displayed to another user, can cause cross-site
    scripting attacks—or it properly exploits a browser bug—cause the user to unwittingly
    reveal personal information.


    4. The correct answers are B and C. Although filtering data from "untrusted" sources
    sounds good, the reality is any any whose contents are taken from any foreign
    source risk being compromised—threatening your scripts as well. When dealing with
    a PHP installation where register_globals is enabled, it is absolutely necessary
    to ensure that all variables used in the script are initialized prior to their
    use to prevent malicious data from being injected into them.


    5. When dealing with user data in database queries, you should always escape any
    undesired data from the SQL code. This is a universal database-related problem—all
    SQL-based database packages are vulnerable to SQL injections, and PHP provides
    comparable escaping functions to prevent them for each.


    6. The correct answers are C and E. In PHP, there is no function that provides
    a "safe" execution of system commands for the command and, in all cases where
    variables are involved, you should escape the arguments passed to the shell using
    the escapeshellcmd and escapeshellarg functions.'
