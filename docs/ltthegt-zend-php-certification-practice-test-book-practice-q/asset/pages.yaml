    that can later be used by the unserialize function to reconstruct the original
    data structure. A valid answer to this question could be the implode function,
    which concatenates each element of an array with a "glue" string.


    +   6. The natsort function uses a "natural ordering" algorithm to sort the contents
    of an array, rather than a simple binary comparison between the contents of each
    array. In fact, in this example the array is not even touched, since its elements
    are already in what could be considered a "natural" order. Therefore, Answer A
    is correct.


    +   7. Despite its name, array_flip($array) only swaps each element of an array
    with its key. Both rsort() and array_reverse() would have the effect of reordering
    the array so that it would read (''d'', ''c'', ''b'', ''a''). Therefore, the correct
    answers are B and D.


    +   8. PHP starts assigning numeric keys to elements without a hard-coded numeric
    key (even if it is a numeric string). If you never specify a numeric key to start,
    it starts from zero. In our script, however, we assigned the key ''3'' to the
