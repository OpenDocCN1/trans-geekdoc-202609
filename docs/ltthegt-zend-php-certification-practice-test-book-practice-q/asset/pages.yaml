- pgno: 144
  md: '# 12

    Debugging Code and Managing Performance


    NO MATTER HOW EXPERIENCED a developer you are, or how hard you''ll try, your applications
    will have bugs. They''re an inevitable part of life, like death and taxes (although
    usually—but not always—less dangerous an expensive than the latter).


    Being able to identify bugs is the first step towards resolving them. In fact,
    many developers spend countless hours staring blankly at a page of code only because
    their applications don''t have good error-monitoring capabilities in the first
    place. Inoring this aspect of programming is a bit like hoping that bugs will
    never happen: hopeless!


    The questions of the Zend Exam that focus around this area test your basic knowledge
    of topics related to debugging and optimizing code, as well as on the facilities
    that PHP provides for this specific purpose.'
