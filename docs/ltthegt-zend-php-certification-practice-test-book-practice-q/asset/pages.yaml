  md: '# Answers


    +   1. The correct answer is E—all of the items listed in the answers are completely
    valid wrapper resources in PHP. Almost all file-access functionality in PHP can
    now use any of these methods to work with both local and remote files.


    +   2. The stream_wrapper_register function is used to register a user-defined
    file wrapper (created as a PHP class) as a valid wrapper protocol. It takes two
    parameters, the name of the new protocol and a class name implementing it.


    +   3. The correct answer is D. The stream_get_data_function does not tell you
    how much data has passed through the stream—it does, however, tell you how much
    there is left to read.


    +   4. The correct answers are B and E. PHP only supports these two stream transports
    (STDIO for local operations and stream for remote operations) and will select
    the appropriate one automatically depending on the type of stream being created.


    +   5. The correct answers are B and C. Stream contexts can be created and used
    to modify the behaviour of the file wrapper being used with a stream, or the transport
    of the stream itself. Usually, creating a stream context is not necessary, as
    PHP does a very good job of managing most common situations for you.


    +   6. You would normally use the fsockopen function to open a socket connection
    for communicating with a server whose protocol is not supported by PHP. This is
    useful, say, for communicating with a server that uses its own protocol and can
    be combined with user-file wrappers to implement stream support in PHP.


    +   7. The correct answer is D—poc, which isn''t a real transport. On top of the
    other transports listed above, PHP also supports secure transports, such as ssl
    and tls.


    +   8. The correct answer is C. By default, sockets created by the fsockopen function
    will have blocking enabled, which means any code to read/write data will "block"
    other code from being executed until the data is actually processed across the
    wire. With blocking turned off, if there is no data to read the fread() will simply
    return quickly and you will be free to move on to other things.


    +   9. To adjust the timeout of a socket when reading or writing data, you must
    use the stream_set_timeout function. It is not possible to adjust the timeout
    of read operations independently of writes—however, note that a stream timeout
    does not affect the connection set when calling fsockopen().


