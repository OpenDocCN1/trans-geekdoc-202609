- pgno: 149
  md: '# Answers


    +   1. Answer E is correct. The ternary operation is arrived at by concatenating
    each of the conditions in the script as part of && operations. In this case, however,
    the assignment $x=1 only takes place if the third condition is evaluated as False.
    If either the first or the second conditions don''t evaluate to True, $x=1 will
    never be executed. You should keep in mind that this is a rather extreme example
    of ternary operator usage—you should always consider introducing these constructs
    in the picture helps code readability or not (in this case, it most definitely
    (wouldn''t)).


    +   2. Since the problem is mainly caused by the existence of a slow third-party
    source of data over which you may be able to increase your performance by working
    on your connectivity (assuming the problem is on your end and not on the third
    party''s) and by caching the content you receive from your counterpart that you
    only have to retrieve it occasionally


    +   3. The correct choices are B and D. Turning off error reporting, using the
    @ operator and turning off error logging would deprive you of a useful debugging
    and analysis tool something goes wrong while your site is being used by the end
    user.


    +   4. This description corresponds to the === operator.


    +   5. The correct answer is D. When a PHP script is executed, it is first parsed
    into “intermediate” code (also called opcode) and then run by an interpreter.
    The opcode cache interposes itself between the two stages, caching the output
    of the parser and feeding it directly to the interpreter the next time your script
    is executed, eliminating the need for the latter to be parsed.


    +   6. The correct answers are A and D. If too little RAM is present, processes
    may find themselves contending for its usage, forcing the server to make heavy
    use of disk swapping. By the same token, allowing too many processes to run at
    the same time can cause the server to switch context often, resulting in slowdowns.


    +   7. The correct answers are A and C. This script does not verify that the call
    to database_query() returns successfully and, therefore, would continue its execution
    without a valid database resource in the event of an error. Additionally, the
    $my_id parameter is not escaped—and this could lead to code injections (covered
    in Chapter 11).


    +   8. Answers B and D are correct. Parse errors, which usually indicate a syntax
    error in the script, cannot be caught by a custom error handler for obvious reasons:
    since the error handler resides in the script and the script cannot be parsed,
    the handler cannot be executed. Similarly, E_ERROR is generally used to indicate
    fatal runtime errors, such as memory'
  merge: -1
