- pgno: 140
  md: 'The correct answers are C and D. Even when dealing with a file that doesn''t
    have to be saved after the script''s execution is complete, the is_uploaded_file
    function should be used prior to accessing it to ensure that the filename was
    correct. Likewise, if the file must be stored for a longer period of time, it
    must be moved out of its temporary location. You should always use the move_uploaded_file
    function, which performs the same check prior to moving the file, for this purpose.


    The correct answers are A, B and C. Safe mode provides a number of additional
    security checks that can prevent security breaches—especially on shared hosts,
    where multiple users have access to the same PHP instance. Although safe mode
    can limit, among other things, the execution of system commands, access to environment
    variables, and what files can be accessed for includes (for example by performing
    additional checks on the UID/GID of each file), it does not perform any database-related
    security checks.


    The correct answer is B; the open_baseir configuration directive allows you to
    define a set of directories from which PHP is allowed to read from. This configuration
    is independent of whether safe_mode is enabled and can be useful for restricting
    access to one or more directories. Note that option D describes a feasible method
    for restricting access; however, it is less simple—and more complicated to maintain—than
    using open_baseir.


    The correct answer is B. Although it is possible to specify a maximum file size
    in your HTML form with the MAX_FILE_SIZE hidden there, there is, of course, no
    way to ensure that the client will be aware—or willing—to enforce such a restriction.


    When run in CGI mode, PHP automatically implements several measures aimed at preventing
    common security vulnerabilities. One of these is passing an arbitrary file as
    a command-line parameter for interpretation and execution. In this case, were
    these measures not in place, PHP would attempt to read /etc/passwd, which is a
    world-readable file, and interpret it as a PHP script, resulting in all your user
    accounts being outputted to the client. However, because of PHP''s built-in security
    mechanisms, nothing happens; therefore, Answer D is correct.


    The correct answer is E. All of the actions listed should be part of the routine
    of any developer serious about keeping their site secure. In order to be effective
    at keeping your security sites, you must first be aware of the potential dangers.
    This means keeping up to date with security announcements and logging suspicious
    activity that could tip you off to a malicious user attempting to hack your system.


    The correct answer is B. Web sites should never dump what might seem worthless
    information (such as a failed SQL query) to the user. Although to most users this
    information means nothing, it can provide a wealth of resources to developers
    (including malicious hackers), who can use them to focus their efforts on a particular
    attack'
