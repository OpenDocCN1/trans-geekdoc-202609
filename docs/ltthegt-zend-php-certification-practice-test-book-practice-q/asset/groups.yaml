    There are many advantages to having a PHP certification program. Foremost, it
    allows employers, especially those of the non-technical kind, to set a certain
    standard for their PHP hiring decisions; they''ll know that people who are certified
    have passed a set of hurdles in earning their credentials and can clearly demonstrate
    their knowledge of PHP and its related technologies.


    Not only does that mean that a Zend Certified Engineer will automatically match
    such criteria and have an immediate advantage on the job market, but the certification
    process also allows for more and more enterprises to adopt PHP. This, in turn,
    will lead to a much more vibrant job market for PHP developers—making it easier
    to make a living from what PHP developers like doing most. I have no doubt that
    we will see an increase in the ongoing PHP proliferation due to the existence
