  mdcn: "\n\n# PHP 4 面向对象的编程\n\n因此，这个问题实际上设计的目的是测试你从 OOP 代码中发现错误的能力，而不是仅仅为了刁难你。\n\n\
    12. 由于在 PHP 4 中，对象的处理方式与标量值相同，当将 $a 赋值给 $b 时，解释器会创建该对象的副本，因此，随后赋值给它的任何值都不会影响原始的对象。因此，正确答案是\
    \ B。然而，在 PHP 5 中，此脚本的行为将会有不同（输出为 10）——但请记住，考试考查的是 PHP 4，而不是 PHP 5。\n\n13. 这是一个非常具有陷骗性的问题。初看起来看之下，`my_class`\
    \ 的构造函数似乎在 `$global_obj` 变量中存储了指向它实例的引用。因此，人们会认为，当我们把 $global_obj->my_value 的值更改为\
    \ 10 时，$a 中对应的值也会随之改变。遗憾的是，`new` 运算符返回的不是引用，而是新创建对象的副本。因此，该脚本将输出 5，正确答案是 A。\n\n\
    14. 在 PHP 中，传递给函数或方法的对象默认情况下是按值传递的，这意味着函数内部使用的对象实际上是作为参数传递的对象的副本。这种遗憾的副作用意味着，在函数或方法调用的上下文中对对象进行的任何修改，都不会应用到函数作用域之外的原始对象。\n\
    \n在第 14 题中，这意味着 `$eight_tenths` 对象从未被 `reduce_fraction` 函数修改过，而 `$fraction` 对象（参数）被修改了。在函数内部可能被修改的对象应该始终通过引用的方式传递给它：\n\
    \n```php\nfunction_fraction(&$fraction)\n```\n\n因此，正确答案是 D。\n\n15. 题目中的语法用于从静态上下文中调用类中的方法。当从静态上下文中调用方法时，它们的行为类似于函数，并且与该类的任何现有实例都没有关联。正确答案是\
    \ A。\n\n16. PHP 4 中不存在静态类变量——该语言仅允许声明静态函数变量。\n\n17. 答案 A 是确的。当父类 `a` 的构造函数被调用时，$myvar\
    \ 类属性将已经在类 `b` 中被定义，而且，类变量在赋值时不需要先定义——就像 PHP 4 中的任何其他变量一样。因为类 `b` 在调用其父类的构造函数之前给它的\
    \ $myvar 属性赋值了一个变量，而构造函数反过来又赋值了一个不同的值，所以最终输出将是 1。\n\n# PHP 面向对象编程\n\n- 18. 在 PHP\
    \ 4 中，无法按需加载类——它们必须在使用或引用它们之前显式声明。在 PHP 5 中，你可以使用 `__autoload` 函数，以便在解释器需要一个在当前脚本上下文中找不到的类时收到通知，但这一功能不适用于\
    \ PHP 4。因此，答案 D 是确的。\n\n- 19. 这清楚地标识了设计模式，设计模式为应用设计和编程中常见问题提供了定义良好且优雅的解决方案。\n\n\
    - 20. 脚本将不输出任何（答案 D）。这是因为父类构造函数不会从子类的构造函数自动调用——它们必须被显式执行。当然，任何其他类成员也是如此。\n\n#\
    \ 3 PHP 作为一种 Web 开发语言\n\n如果没有万维网，PHP 开发人员的生活将变得非常凄惨——事实上，人们可能会想，如果不是因为 Web 的巨大普及为更快速更简单的应用开发需求打开了大门，PHP\
    \ 是否还会存在。\n\n在处理网站时，密切熟悉 HTML 的 Web 浏览器编程基础知识，以及通过头部和 cookie 进行 HTTP 事务操作是非常关重要的。此外，本节还涵盖了通过\
    \ cookie 实现跨请求的数据持久化，以便你非常熟悉这些概念。\n\n问题\n\n1. 如何通过以下哪项访问全局变量？\n\n- A. `$_GET`\n\
    - B. `$_POST`\n- C. `$_SESSION`\n- D. `$_REQUEST`\n- E. 以上均不是\n\n2. 下列哪项会导致 cookie\
    \ 被发送到服务器？\n\n```http\nSet-cookie: foo=bar;\n```\n\n3. 在正常情况下，如果没有显式设置 cookie\
    \ 的过期时间，会发生什么？\n\n- A. 立即过期\n- B. 永远不会过期\n- C. 不设置\n- D. 在浏览器关闭时过期\n- E. 这取决于\
    \ PHP\n\n4. 如何通过以下 HTML表单来访问 email 元素？\n（多选）\n\n```html\n<form action=\"index.php\"\
    \ method=\"post\">\n  <input type=\"text\" name=\"email\">\n  <input type=\"text\"\
    \ name=\"email\">\n</form>\n```\n\n- A. `$_GET`\n- B. `$_POST`\n- C. `$_SESSION`\n\
    - D. `$_REQUEST`\n- E. `$_POST`\n\n5. 运行以下脚本的影响是什么？\n（多选）\n\n```php\n<?php\n$ss\
    \ = '<p>Hello</p>';\n$ss = htmlspecialchars($ss);\necho $ss;\n?>\n```\n\n- A.\
    \ 字符串会转换为 HTML 字符\n- B. 字符串将保持不变\n- C. 如果打印到浏览器，角括号将可见的\n- D. 如果打印到浏览器，角括号将不可见\n\
    - E. 字符串被 `htmlspecialchars()` 销毁\n\n"
