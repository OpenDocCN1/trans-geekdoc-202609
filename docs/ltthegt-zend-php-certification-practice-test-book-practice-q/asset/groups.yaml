    分配问题。因此，脚本会立即停止，因为解释器无法保证能够执行后续代码。


    - 9. 答案 C 正确。事实的优势在于，虽然比较是交换操作（这意味着结果与操作数的顺序无关），但赋值不是。例如，$a = 10$ 和 $10 \neq a$
    是等等的，而 $a = 10$ 和 $10 = a$ 则是不等等的——后者会产生错误，因为它是一个无效操作。通过确保常量是操作中的第一个值，你可以确保自己在想要比较时没有误用赋值。


    - 10. 答案 C 正确。可以使用 `error_log` 函数（以及其他方法）向指定的内部地址发送消息。尽管它与 `mail()` 使用了相同的内部函数，但
    `error_log()` 会自动为电子邮件添加主题，因此它是使用该方法提交报告简单的方法。


    - 11. 正确答案否。虽然可以使用 `error_reporting` 函数关闭所有的运行时错误报告，但无法用它来消除解析时错误，简单原因是这些错误发生在脚本实际执行之前。


    - 12. 答案 C 显然是正确的。性能分析器（profiler）在脚本运行时对其进行监控，记录执行其每一个部分所需的时间。它可以用于识别并解决性能瓶颈。


    - 13. 这是调试器的完美定义！调试软件允许你仔细监控脚本的每个方面，并逐步分析它们对系统资源的影响，从而识别并解决任何编程缺陷。


    - 14. `trigger_error()` 和 `user_error()` 之间真的没有区别——事实上，后者只是前者的别名。


    - 15. 答案 D 正确。这个问题描述了 `debug_backtrace` 函数，它返回一个包含导致代码中某一点的所有函数调用（也称为回溯）的数组。


