    我记得那些问题非常详尽，很可能是因为出题者是 PHP 社区的领军人物，他们希望给出最好的题目。在不让考试过于困难的前提下，这确保了每一道题都经过了深思熟虑、彻底的同行评审和精心构建；这难免会让你任何潜在的考生——尤其是那些参与了如此严谨过程的人——感到有些紧张！


    我很高兴地告诉大家我通过了考试——但我承认有些题目确实相当困难。我认为总的来说，这次考试是公平的，与其他许多认证测试相比，它详尽得多。一个没有经验的 PHP
    开发人员无法通过这次考试，我认为这非常好。它真正认证了那些在现实世界中开发过基于 PHP 的 Web 程序的 PHP 开发者。


    我相信这本书将对准备认证考试有很大帮助。Marco 和 John 都是 Zend PHP 认证顾问委员会的成员，了解考试的性质及其目标。这两位作者在 PHP
    方面都有多年经验，这从书中内容可以显易看出。这本书非常很好地涵盖了你将接受测试的不同主题，并提供了与你在考试中看到的非常相似的题目。在每个章节的末尾提供答案将使你能够轻松验证自己的优劣。


    我祝你认证过程一切顺利，希望你很快能加入不断壮大的 Zend 认证工程师大家。


    Andi Gutmans

    Zend Technologies 联合创始人兼技术副总裁

    Zend 认证工程师


    ## 关于作者


    John Coggeshall 是 Zend Technologies 的技术顾问，在该处为全球客户提供专业服务。他从 1997 年开始接触 PHP，是三本出版书籍的作者，并发表了超过
    100 篇关于 PHP 技术的文章，合作对象包括 phparchitect、SAMS Publishing、Apress 和 O''Reilly 等行业内的顶尖机构。John
    还是作为 tidy 扩展的作者，一直是 PHP 核心代码的活跃贡献者、Zend 教育顾问委员会的成员，以及全球范围内 PHP 相关会议的频繁演讲者。他的网站
    http://www.coggeshall.org/ 是任何 PHP 开发人员的极佳资源。


    Marco Tabini 是 php|architect (http://www.phmarch.com) 的出版者，这是一本面向 PHP 专业人士的顶级杂志。作为四本书的作者和合著者，他还加入了编写
    Zend 认证考试的领域专家 (SME) 小组。他定期维护一个博客，可以在 http://blogs.phmarch.com 找到，他在那里讨论开源软件的业务。


    ## 引言


    编写试卷绝不是一项轻松的任务。苏格拉底曾被引用说：“未经审查的生活是不值值的”，但（尽管他并不是真的指参加技术测试）我们确信，大多数坐在考场里的人会宁愿与那位传奇哲学家交换位置并喝下他的毒芹汁，也不愿参加考试。


    幸运的是，编写考试不必是一次如此创伤的经历。只要有足够的准备和经验，你应该能够成功通过，而不会遇到太大问题。Zend 考试本身的设计有两个目标：首先，测试你对
    PHP 的知识；其次，尽可能以大量实用的方法来进行。


    仅测试你对 PHP 知识的想法基于一个简单的假设：你作为 PHP 程序员的经验是通过你对外部技术的了解来衡量的。正如我们在第 9 章中提到的，你可能一生都在开发
    PHP，而从不需要连接 MySQL 数据库，因此通过测试你对 MySQL 的知识来衡量你对 PHP 的熟悉程度是不公平的。此外，MySQL AB（以及大多数其他相关的第三方软件供应商）已经有了自己的认证计划。


    至于题目的实用性，没有任何领域专家 (SME) 认为一个好的程序员是一本行走的 PHP 参考书。事实是，PHP 提供了超过 1500 个不同的函数——了解每一个函数，以及它们所有的细微差别，在实践上是不可能的，也是没用的。PHP
    手册可以在世界上任何地方访问；因此，除非有人把你关在一个没有互联网连接的房间里，否则你无法访问它的概率微乎其微。尽管如此，如果你每三十秒就要查阅一次手册就无法编程，考试将以相当教学的方式测试你的基础
    PHP 功能。


    大部分情况下，考试测试你理解、解释和编写正确代码的能力。准备好分析大量的代码示例，找出它们的作用、工作原理以及是否存在 Bug。有些问题看起来可能诡异且过度复杂，但如果你仔细想想，对于任何在现实世界中工作过的人来说，处理不完美的（当然是别人写的）代码并不常见。


    ## 为什么需要练习题集？


    参加考试时总是准备越充分越好。你的经验正如 SAMS 出版的《Zend PHP 认证指南》一样，将成为确保通过考试的宝贵工具，而坐下来参加考试本身与你日常生活中可能做的任何活动都不同。


    这本书为你提供了一系列高度结构化的题目，旨在模拟（而非复制）你在考试中会看到的实际题目。它将帮助你“进入考试的氛围”。


    ## 本书是如何组织的？


    这种安排背后的逻辑很简单：如果你想通过考试，你就需要练习。这本书的每个章节都旨在关注考试的一个特定领域。在每个章节的末尾，你将找到问题的答案，并附有解释。这将帮助你理解为什么答案是正确的。


    书的组织结构如下：


    - 第一部分：PHP 基础

    - 第二部分：面向对象编程

    - 第三部分：数据库与 MySQL

    - 第四部分：Web 开发概念

    - 第五部分：安全与测试


    这种结构将帮助你在准备认证时系统地构建知识。


    '
