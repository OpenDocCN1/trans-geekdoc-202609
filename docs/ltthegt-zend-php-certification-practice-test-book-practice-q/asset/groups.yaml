    # Introduction


    WRITING AN EXAM IS never an easy task. Socrates is quoted as saying that “an unexamined
    life is not worth living,” but (although he wasn''t really referring to taking
    technical tests) we''re sure that most people sitting in an examination room would
    gladly exchange places with the legendary philosopher and drink his hemlock rather
    than take a test.


    Luckily, writing an exam doesn''t have to be such a traumatic experience. Given
    enough preparation and experience, you should be able to successfully pass it
    without much in the way of problems. The Zend exam itself is designed with two
    goals in mind: first, to test your knowledge of PHP and, second, to do so with
    much of a practical approach as possible.


    The idea of testing only your knowledge of PHP is based on a simple assumption:
    that your experience as a PHP programmer is measured by your knowledge of external
    technologies. As we will reiterate in Chapter 9, you may go all your life developing
    PHP without ever having to interface to a MySQL database and, therefore, testing
    your knowledge of MySQL'
  - '[PAGE 17]


    # Introduction


    would be an unfair to gauge your familiarity with PHP. Besides, MySQL AB (as well
    as most other relevant vendors of third-party software) already has its own certification
    program.


    As far as the practicality of the questions, none of the Subject Matter Experts
    (SMEs) believed that a good programmer is a walking PHP reference book. The truth
    is that PHP provides in excess of 1,500 different functions—and knowing each of
    them, together with all its nuances, would not be practically impossible, but
    useless as well. The PHP Manual is promptly available online from anywhere in
    the world; therefore, unless someone is going to lock you in a room with no Internet
    access, the chances you won''t be able to access it and be quite minimal. Still,
    if you can''t program if you have to consult the manual every thirty seconds and,
    the exam will test your knowledge of some basic PHP functionality in a fairly
    didactic way.


    For the most part, the exam tests your ability to understand, interpret and write
    proper PHP code. Prepare to analyze plenty of code examples to find out what they
    do, how they work and they have any bugs. Some of the questions may seem a little
    tricky and unduly complex, but if you think about it, having to deal with less-than-perfect
    code (written by someone else, of course!) is not uncommon for anyone who has
    ever worked in the real world.


    # Why a Book of Practice Questions?


    It''s always best to go into an exam as prepared as possible. Your experience,
    like the Zend PHP Certification Study Guide, published by SAMS, will be an invaluable
    tool in ensuring that you will pass, by sitting down and taking the exam itself
    is unlike anything you''re likely to do as part of your daily routine.


    This book provides you a highly structured series of questions designed to mimic
    (without reproducing) the actual questions that you will find in the exam. It
    will help you "get in the spirit" of the exam and learn how the questions are
    phrased and what they expect you to be able to.


    We worked at building questions that, while close to the real ones, are usually
    slightly difficult to answer correctly. The reasoning behind this is simple: if
    you get the ones right, the real exam will be a breeze!


    # How is this Book Organized?


    The PHP Certification Practice Test Book is designed to work as a companion to
    the Official Zend PHP Certification Study Guide (ISBN 0672327090) published by
    SAMS Publishing. As a result, its chapters closely reflect those of the guide
    in order to facilitate your learning process as much as possible. You can read
    a chapter of the guide, turn to the corresponding chapter in the Practice Questions
    Book and take a mini-exam centered exclusively on that particular topic. As an
    alternative, you can use this book as a testing resource with the PHP Manual.
    Our table of contents will give you the basic layout of the topics covered by
    the exam, which you can use to study directly from the manual, as well as many
    of the other resources available on the Internet. Once you think you''re ready
    to try your head at some questions, you can use this book for that purpose.'
  - '[PAGE 18]


    Each chapter contains fifteen questions, with the exclusion of Chapters 1, 2,
    5 and 6 which contain twenty. The reason for this is that these chapters discuss
    the most fundamental aspects of PHP; therefore, we thought that a few additional
    questions per chapter might helped you gauge your preparedness. You''ll find the
    answers to all the questions, together with an explanation, at the end of each
    chapter.


    While you are of course, free to use this any way you like, we''d like to suggest
    a simple approach that can maximize your effectiveness. First of all, you should
    try at practice with the questions when you actually have time to do so—at least
    ninety minutes for answering the questions, and then thirty to sixty minutes to
    check your answers.


    Start by answering five questions each fifteen-question chapter, and six from
    the twenty-one ones. Take care of each chapter in sequence, without stopping to
    check your answers. This will add up to around sixty-seven questions, a very close
    approximation of the actual exam, which can set yourself eighty minutes to complete
    the entire set—again, a good approximation of the ninety allocated in the real
    exam.


    At the end of this process, you can go back and check the answers you gave against
    the correct ones reported at the end of each chapter. This will give you an opportunity
    to determine how prepared you are in each different area and to focus on topics
    where your results were less than brilliant.


    Once you feel ready, you can try again using the same technique. This will make
    possible for you to answer a fresh batch of questions every time and test your
    knowledge anew.


    # Finding Errata and Discussing Your Concerns


    A lot of work went into writing, reviewing, editing and then reviewing some more
    the questions in this book, as well as their answers. Yet, we are but mortals
    and, as such, prone to making mistakes.


    If you think you''ve found something wrong with the contents of the book, come
    and discuss it on the phparch forums at this URL:


    ```

    http://forums.phparch.com/162

    ```


    Of course, this is also true if one of the questions has stumped you and you want
    to chat with other PHP enthusiasts about the how''s and the why''s of the answers
    we provide. Both of us visit the forums regularly, and we are always happy to
    help out.


    # Acknowledgements


    Writing a book—no how small—is always a monumental task that involves the assistance
    and expertise of many people.


    We''d like to extend our thanks to Derek Rethans, who has spent considerable time
    performing a ruthless technical review of each question, pointing out errors and
    suggesting ways to improve the overall quality of the practice tests. It''s thanks
    to him that so many questions are understandable and technically accurate—and
    entirely our responsibility if some are not.'
  md: '

    remembered that the questions were very thorough, most probably due to the fact
    that the exam authors are leaders in the PHP community who wanted to come with
    the best possible questions. Without making the exam overly difficult, this ensured
    that every question was well-thought-out, thoroughly peer-reviewed and carefully
    constructed; this is bound to make any prospective exam-taker—especially one that
    was an integral part of such a thorough process—a bit nervous!


    I''m happy to say that I passed the exam—but I admit that some questions were
    quite hard. I think that, overall, the exam is fair, unlike many other certification
    tests, much more thorough. A PHP developer with no experience cannot pass this
    exam, which I think is great. It really certifies PHP developers who have experience
    in developing PHP based web applications in the real world.


    I believe this book will be of great help in preparing for the certification exam.
    Both Marco and John were on the Zend PHP Certification Advisory Board and understand
    the nature of the exam and what its goals are. Both authors also have many years
    of experience in PHP, which is readily recognizable from the book''s contents.
    This book very nicely covers the different topics on which you will be tested
    and provides questions that are very similar to the ones you will see on the exam.
    Having the answers at the end of each chapter will make it easy for you to validate
    your strengths and weaknesses.


    I wish you all the best with the certification progress and hope you will soon
    join the growing family of Zend Certified Engineers.


    Andi Gutmans

    Co-founder & VP of Technology, Zend Technologies

    Zend Certified Engineer


    ## About the Authors


    John Coggeshall is a Technical Consultant for Zend Technologies, where he provides
    professional services to clients around the world. He got started with PHP in
    1997 and is the author of three published books and over 100 articles on PHP technologies
    with some of the biggest names in the industry such as phparchitect, SAMS Publishing,
    Apress and O''Reilly. John also is an active contributor to the PHP core as the
    author of the tidy extension, a member of the Zend Education Advisory Board, and
    frequent speaker at PHP-related conferences worldwide. His web site, http://www.coggeshall.org/
    is an excellent resource for any PHP developer.


    Marco Tabini is the publisher of php|architect (http://www.phmarch.com), the premier
    magazine for PHP professionals. The author and co-author of four books, he was
    also part of the group of Subject Matter Experts (SMEs) who helped write the Zend
    Certification Exam. He regularly maintains a blog, which can be found at http://blogs.phmarch.com,
    where he discusses the business of open-source software.


    ## Introduction


    WRITING AN EXAM is never an easy task. Socrates is quoted as saying that “an unexamined
    life is not worth living,” but (although he wasn''t really referring to taking
    technical tests) we''re sure that most people sitting in an examination room would
    gladly exchange places with the legendary philosopher and drink his hemlock rather
    than take a test.


    Luckily, writing an exam doesn''t have to be such a traumatic experience. Given
    enough preparation and experience, you should be able to successfully pass it
    without much in the way of problems. The Zend exam itself is designed with two
    goals in mind: first, to test your knowledge of PHP and, second, to do so with
    much of a practical approach as possible.


    The idea of testing only your knowledge of PHP is based on a simple assumption:
    that your experience as a PHP programmer is measured by your knowledge of external
    technologies. As we will reiterate in Chapter 9, you may go all your life developing
    PHP without ever having to interface to a MySQL database and, therefore, testing
    your knowledge of MySQL would be an unfair to gauge your familiarity with PHP.
    Besides, MySQL AB (as well as most other relevant vendors of third-party software)
    already has its own certification program.


    As far as the practicality of the questions, none of the Subject Matter Experts
    (SMEs) believed that a good programmer is a walking PHP reference book. The truth
    is that PHP provides in excess of 1,500 different functions—and knowing each of
    them, together with all its nuances, would not be practically impossible, but
    useless as well. The PHP Manual is promptly available online from anywhere in
    the world; therefore, unless someone is going to lock you in a room with no Internet
    access, the chances you won''t be able to access it and be quite minimal. Still,
    if you can''t program if you have to consult the manual every thirty seconds and
    the exam will test your knowledge of some basic PHP functionality in a fairly
    didactic way.


    For the most part, the exam tests your ability to understand, interpret and write
    proper PHP code. Prepare to analyze plenty of code examples to find out what they
    do, how they work and if they have any bugs. Some of the questions may seem a
    little tricky and unduly complex, but if you think about it, having to deal with
    less-than-perfect code (written by someone else, of course!) is not uncommon for
    anyone who has ever worked in the real world.


    ## Why a Book of Practice Questions?


    It''s always best to go into an exam as prepared as possible. Your experience,
    like the Zend PHP Certification Study Guide, published by SAMS, will be an invaluable
    tool in ensuring that you will pass, by sitting down and taking the exam itself
    is unlike anything you''re likely to do as part of your daily routine.


    This book provides you a highly structured series of questions designed to mimic
    (without reproducing) the actual questions that you will find in the exam. It
    will help you "get in the spirit" of the exam.


    ## How is this Organized?


    The reasoning behind this is simple: if you want to pass the exam, you need to
    practice. Each chapter of this book is designed to focus on a specific area of
    the exam. At the end of each chapter, you will find the answers to the questions,
    along with an explanation. This will help you understand why an answer is correct.


    The book is organized as follows:


    - Part 1: PHP Basics

    - Part 2: Object-Oriented Programming

    - Part 3: Databases and MySQL

    - Part 4: Web Development Concepts

    - Part 5: Security and Testing


    This structure will help you build your knowledge systematically as you prepare
    for the certification.

