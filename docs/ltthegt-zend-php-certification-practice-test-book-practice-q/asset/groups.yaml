    +   9. Answer E is correct. Clearly, time() calculates the number of seconds since
    the epoch and, since both Answer A and D express that same concept, they are obviously
    correct. Answers B and C are a bit less immediate, but really mean the same thing.
    The number of seconds since the epoch is the same, regardless of whether you express
    it in the local time zone or with GMT the epoch itself is a fixed point in time.
    It is only when you need to convert the integer into human-readable format that
    you must consider the representation appropriate for any given time zone. Therefore,
    Answers B and C are also correct. This might sound like a bit of a trick question,
