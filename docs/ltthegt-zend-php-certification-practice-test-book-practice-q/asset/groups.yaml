    # 答案


    1. 在上述列出的所有电子邮件地址中，只有答案 D 是无效的。A 和 B 都是今天频繁使用的经典电子邮件地址。尽管 C 看起来是无效，但邮件传输代理（MTA）会自动移除多余的空格，使其同样有效；而
    E 对于本地投递是有效的。剩下的 D 包含一个电子邮件地址中无效的字符（带重音的字母）。


    2. 正确答案是 A 和 D。虽然 UNIX 版本的 PHP 需要 sendmail 应用程序（或等等实现）通过 SMTP 发送邮件，但 Windows/Novell
    环境直接使用 SMTP 与 MTA 通信。然而，PHP 也可以配置为使用“sendmail 包装器”来在 Windows/Novell 上模拟 sendmail
    应用程序，在这种情况下，三个版本的 PHP 将以相同的方式运行。另外注意，在 Windows/Novell 环境下使用 `mail()` 的内部实现时，必须设置
    `sendmail_from` 配置指令，而 UNIX 版本则将此任务留给 sendmail 应用程序。


    3. PHP 确实可以使用 `mail` 函数发送任何有效格式的电子邮件，因此邮件顶部的与 MTA 的通信必须使用 *additional_headers*
    参数作为字符串添加，每个头部都以换行符和回车符 (\n）结尾。在发送复杂的电子邮件（例如带有文件附件或 HTML 格式文本的邮件）时，不仅必须添加额外的头部，还必须在邮件部分包含
    MIME 特定的头部，因此答案 E 是正确的。


    4. 在发送被视为多部分的 MIME 电子邮件时，你必须指定一个边界（任何 US-ASCII 字符串），该边界必须足够唯一，不会出现在邮件正文的任何位置。该边界对于
    MIME 消息中的每个嵌入多部分块必须是唯一的；它在 `content-type: MIME` header 中指定。


    5. 上方确实有两个答案适用于在 HTML 文档中包含元素（如图像）。最快的方法是仅通过为标签的 *src* 属性指定任何有效 URL 来引用远程图像。然而，图像和其他组件元素可以作为
    MIME 内容块嵌入到 MIME 电子邮件中。这些内容块被分配一个内容 ID（content ID），可以从分配的内容 ID 进行引用。这意味着答案 B 和
    C 是正确的。


    6. `mail` 函数的最后一个参数用于向 sendmail 应用程序提供额外参数，通常只在可用 sendmail 的 UNIX 环境中使用。然而，此参数也可以用于使用了
    `sendmail_path` 配置指令的 Windows/Novell 环境。


    7. 正确答案是 C。Content-Transfer-Encoding MIME 头部用于指定 MIME 电子邮件任何段的编码。该头部最常见的是与二进制数据相关，用于指定用于对其编码的算法。默认情况下，7bit、quoted-printable、base64、8bit
    和 binary 是允许的——但是，任何人可以使用类似于 x-unique 的编码名称指定自己的编码。


    8. 正确答案是 B、C 和 E。边界（Boundaries）是发送 MIME 电子邮件的关键部分。虽然对边界的长度没有限制，但选择糟糕边界会导致严重的后果。因为边界是邮件中的简单文本字符串，因此其值出现在其中一个
    MIME 分段的实际正文中非常重要。例如，考虑一下如果名为 John 的人签署了他们的邮件，名为 John 的边界虽然在技术上是有效的，会造成什么潜在的灾难：接收邮件客户端将将其解析为新
    MIME 分段的开始，并极可能完全误解邮件内容。


    9. 要从给定的纯文本消息创建有效的 MIME 电子邮件，正确答案是 A 和 D。MIME 电子邮件在开头必须有 MIME-version 头部，而每个分段（包括“根”段）都必须带有相关的
    content-type 和 Content-Transfer-encoding 头部。答案中提到的另外两个头部是可选的：Content-Disposition
    用于指示如何显示分段（例如，它是否应该作为附件表示），Content-ID 是可选分配给分段中内容的唯一标识符。


    10. 正确答案是 B。这种特殊的 MIME 内容类型用于定义一个包含相同内容多个版本的段。例如，一个 multipart/alternative 段内部可能包含两个类型为
    text/plain 和 html 的分段。由邮件客户端选择最合适的格式并显示给该用户。根据经验，将最易读的版本（即纯文本/plain text）放在最前面总是一个好主意，以防消息从不支持
    MIME 的非 邮件客户端中被读取。


    11. 在类 UNIX 系统上，PHP 依赖 sendmail 应用程序来处理其电子邮件（即使服务器上没有安装 sendmail，或者它由不同的邮件传输代理模拟）。然而，在
    Windows 机器上，`mail` 函数实际上会针对 SMTP INI 设置中指定的服务器执行 SMTP 事务，除非使用了 sendmail 包装器。因此答案
    D 是正确的。


    12. 在纯文本电子邮件上使用 `html()` 对防止跨站攻击毫无帮助——事实上，它可能导致收件者无法阅读。强制使用 POST 变量只会让潜在的黑客更难伪造你的表单（尽管并非不可可能），而确保电子邮件字段（它将成为邮件中的
    to: 头部）不包含换行符可以防止恶意用户将自己的电子邮件地址添加到用户地址并接收邮件副本。因此，答案 C 和 E 是正确的。


    13. 序列化数组将其转换为字符串的正确方法——这是通过电子邮件网络传输的第一步。接下来，你需要对其进行编码以便安全发送；在 PHP 4 中简单的方法是使用
    `base64_encode` 函数，它将其转换为每字符使用 7 位的格式。因此，答案 D 是正确的。


    14. 使用 `mime_content_type` 函数是确定文件 MIME 类型最简单安全的方法。因此，答案 D 是正确的。注意此函数是一个已弃用扩展的一部分——但你仍很有可能在旧代码中发现它。


    15. 添加 From 头部不足以确保 sendmail 在发送时不会重写你的发送者地址。事实上，你必须使用 -f 额外参数向 sendmail 指定邮件的信封发送者。这两个步骤本身并不一定足够；你还必须确保运行
    Apache 的用户有权限更改信封 From 头部。因此，正确答案是 A、B 和 D。


