    ## 编写安全的 PHP 应用


    12. 虽然不一定万无一失，但以下哪些项有助于识别并防止代码中潜在的安全风险？（请选择最合适的答案）


    - 意识到 PHP 手册中记录的潜在安全问题。

    - 记录所有脚本数据验证失败的所有情况。

    - 保持 PHP 的最新版本，特别是那些包含安全修复程序的版本。

    - 在使用第三方 PHP 包时，了解其中发现的任何安全漏洞并保持修复为最新。

    - 以上所有。


    13. 当你的网站发生错误时，应该如何处理？


    - 应向用户显示包含其表观原因技术信息的错误消息，以便网站管理员进行处理。

    - 应该记录错误，并向用户显示一条表明服务器故障的礼貌消息。

    - 应该显示带有有关错误技术信息的错误消息，以便用户可以将其发送给网站管理员，并对错误进行记录。

    - 错误应该将用户重定向到主页，以免指示出故障。

    - 以上都不是。


    14. 在什么情况下，以下代码可以被认为是安全的？


    ```php

    <?php

    $newfunc = create_function(''$sa'', ''return $sa * {$_POST[''number'']};'');

    $newfunc(10);

    ?>

    ```


    - 总是如此——最坏的情况下匿名函数 `newfunc()` 将始终返回数字。

    - 仅当启用 `register_globals` 时。

