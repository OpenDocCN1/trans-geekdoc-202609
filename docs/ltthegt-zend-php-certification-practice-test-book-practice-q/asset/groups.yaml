    \ each other.\n\nYour Answer:\n\n5. What does an opcode cache do?\n\n- A. It compiles\
    \ scripts into binary objects to make them run faster\n- B. It replaces the Zend\
    \ Engine to provide a faster interpreter\n- C. It caches a script's output to\
    \ improve its performance\n- D. It improves performance by caching the intermediate\
    \ code produced by the parser\n- E. It caches a script in memory, thus eliminating\
    \ the need for reloading it from disk at every iteration\n\n6. Which of the following\
    \ could result in resource starvation? (Choose 2)\n\n- A. Using too little RAM\n\
    - B. Using a connection capable of low bandwidth only\n- C. Increasing virtual\
    \ memory beyond 2GB\n- D. Allowing too many web server processes to run at the\
    \ same time\n- E. None of the above\n\n7. What's missing from the following script?\
    \ (Choose 2)\n\n```php\n<?php\n$rs = database_query(\"select * from mytable where\
    \ id = \"$my_id;\");\n\nwhile($a = database_get_data($rs)) {\n    var_dump($a);\n\
    }\n?>\n```\n\n- A. Parameter escapement\n- B. Output formatting\n- C. Error checking\n\
    - D. A SQL query\n- E. None of the above\n\n8. Which of the following error types\
    \ cannot be caught by setting up a custom error handler? (Select two)\n\n- A.\
    \ E_WARNING\n- B. E_ERROR\n- C. E_USER_ERROR\n- D. E_PARSE\n- E. E_NOTICE\n\n\
    9. When comparing a constant against a variable, what is the easiest way to?\n\
    \n- A. By caching content\n- B. By deconstructing\n- C. By ternary operators\n\
    - D. By identity operators\n- E. By mail\n\n10. What is the way to send an error\
    \ message to the administrator?\n\n- A. By content\n- B. By mail\n- C. By SMTP\n\
    - D. By function\n- E. By server\n\n11. Can you turn off error reporting within\
    \ a script?\n\n- A. Yes\n- B. No\n\n12. What is the role of a profiler?\n\n- A.\
    \ To create content\n- B. To deconstruct\n- C. To measure times\n- D. To transform\n\
    - E. To identify bugs\n\n13. A _________________ can help identify something goes\
    \ wrong.\n\nYour Answer:\n\n14. What is the difference between trigger_error()\
    \ and user_error()?\n\n- A. trigger_error() also allows a script to throw system-level\
    \ errors\n- B. user_error() also allows a script to throw system-level errors\n\
    - C. user_error() cannot be used in handler\n- D. trigger_error() is only available\
    \ in PHP\n- E. There is no difference\n\n15. This _________________ function is\
    \ often used for debugging purposes.\n\n- A. print_r\n- B. var_dump\n- C. stack_dump\n\
    - D. debug_backtrace\n- E. None of the above\n\n## Answers\n\n1. Answer E is correct.\
    \ The ternary operation is arrived at each of the conditions. In this case, however,\
    \ the assignment x=1 only takes place if the third condition is evaluated.\n\n\
    2. Since the problem is mainly caused by the existence of a slow third-party source\
    \ of data over which you may be able to increase performance by working on your\
    \ connectivity (assuming the problem is on your end) and by caching the content\
    \ you receive\n\n3. The correct choices are B and D. Turning off error reporting,\
    \ using the @ operator and turning off error logging would deprive you of a useful\
    \ tool.\n\n4. This description corresponds to the === operator.\n\n5. The correct\
    \ answer is D. When a PHP script is executed, it is first parsed into intermediate\
    \ code (also called opcode) and then run by an interpreter. The opcode cache interposes\
    \ itself between the two stages, caching the output of the parser and feeding\
    \ it directly to the interpreter the next time your script is executed, eliminating\
    \ the need for the latter to be parsed.\n\n6. The correct answers are A and D.\
    \ If too little RAM is present, processes may find themselves contending for its\
    \ usage, forcing the server to make heavy use of disk swapping. By the same token,\
    \ allowing too many processes to run at the same time can cause the server to\
    \ switch context often, resulting in slowdowns.\n\n7. The correct answers are\
    \ A and C. This script does not verify that the call to database_query() returns\
    \ successfully and, therefore, would continue its execution without a valid database\
    \ resource in the event of an error. Additionally, the $my_id parameter is not\
    \ escaped—and this could lead to injections.\n\n8. Answers B and D are correct.\
    \ Parse errors, which usually indicate a syntax error in the script, cannot be\
    \ caught by a custom error handler for obvious reasons: since the error handler\
    \ resides in the script and the script cannot be parsed, the handler cannot be\
    \ executed. Similarly, E_ERROR is generally used to indicate fatal runtime errors,\
    \ such as memory\n"
  mdcn: "\n\n## 12 调试代码与性能管理\n\n无论你是一个多么经验丰富的开发者，无论你付多么努力，你的应用程序都会出现 bug。它们是生活中不可避免的一部分，就像死亡和税收一样（尽管通常——但并非总是——比后者不危险且不那么昂贵）。\n\
    \n识别 bug 是解决它们的第一步。事实上，许多开发者花费了无数小时对着一页代码发呆，仅仅是因为他们的应用程序本身没有良好的错误监控能力。忽略编程的这方面就像希望\
    \ bug 永远不会发生一样：徒劳的！\n\nZend 考试中围绕这一领域的问题测试了你对调试和优化代码相关主题的基础知识，以及 PHP 为这一特定目的所提供的功能。\n\
    \n## Questions\n\n1. 下面三元运算符中哪一个等于以下脚本？\n\n```php\n<?php\nif ($a < 10) {\n   \
    \ if ($b > 11) {\n        if ($c == 10 && $d != $c) {\n            $x = 0;\n \
    \       } else {\n            $x = 1;\n        }\n    }\n}\n?>\n```\n\n- A. $x\
    \ = ($a < 10 || $b > 11 && $c == 11 && $d != $c) ? 0 : 1;\n- B. $x = ($a < 10\
    \ || $b > 11) || ($c == 11 && $d != $c)) ? 0 : 1;\n- C. $x = (($a < 10 && $b >\
    \ 11) || ($c == 11 && $d != $c)) ? 0 : 1;\n- D. $x = ($a < 10 && $b < 11 && $c\
    \ == 11 && $d != $c) ? 1 : 0;\n- E. 以上皆非\n\n2. 以下哪些措施可以帮助提高一个脚本的性能？该脚本缓慢是因为需要从一个你无法控制的远程源获取数据。（选择\
    \ 2 项）\n\n- A. 安装字节缓存（opcode cache）\n- B. 优化或升级你的网络连接\n- C. 为你的 Web 服务器增加更多硬件\n\
    - D. 增加服务器上的可用 RAM\n- E. 使用内容缓存（content cache）\n\n3. 在设置生产环境 Web 服务器时，以下哪些是良好的步骤？选择\
    \ 2 项）\n\n- A. 关闭错误报告\n- B. 开启错误日志\n- C. 关闭错误日志\n- D. 关闭错误显示\n- E. 使用 @ 错误抑制运算符\n\
    \n4. 该运算符通过检查操作数之间的类型是否匹配，使比较变得更加严格。\n\n你的答案：\n\n5. 字节码缓存（opcode cache）的作用是什么什么？\n\
    \n- A. 它将脚本编译为二进制对象以使其运行得更快\n- B. 它替换 Zend 引擎以提供更快的解释器\n- C. 它缓存脚本的输出以提高其性能\n\
    - D. 它通过缓存解析器产生的中间代码（opcode）来提高性能\n- E. 它将脚本缓存在内存中，从而消除了每次迭代时从磁盘重新加载的需要\n\n6.\
    \ 以下哪些情况可能导致资源饥饿？（选择 2 项）\n\n- A. 使用的 RAM 太少\n- B. 使用仅支持低带宽的连接\n- C. 将虚拟内存增加到\
    \ 2GB 以上\n- D. 允许过多的 Web 服务器进程同时运行\n- E. 以上皆非\n\n7. 下面脚本缺少了什么？（选择 2 项）\n\n```php\n\
    <?php\n$rs = database_query(\"select * from mytable where id = \"$my_id;\");\n\
    \nwhile($a = database_get_data($rs)) {\n    var_dump($a);\n}\n?>\n```\n\n- A.\
    \ 参数转义（Parameter escapement）\n- B. 输出格式\n- C. 错误检查\n- D. SQL 查询\n- E. 以上皆非\n\n\
    8. 以下哪些错误类型无法通过设置自定义错误处理器来捕获？选择两个）\n\n- A. E_WARNING\n- B. E_ERROR\n- C. E_USER_ERROR\n\
    - D. E_PARSE\n- E. E_NOTICE\n\n9. 在比较常量和变量时，最简单的方法是？\n\n- A. 通过缓存内容\n- B. 通过解构\n\
    - C. 通过三元运算符\n- D. 通过身份运算符（identity operators）\n- E. 通过邮件\n\n10. 向管理员发送错误消息的方法是？\n\
    \n- A. 通过内容\n- B. 通过邮件\n- C. 通过 SMTP\n- D. 通过函数\n- E. 通过服务器\n\n11. 可以在脚本内部关闭错误报告吗？\n\
    \n- A. 可以\n- B. 不可以\n\n12. 性能分析器（profiler）的作用是什么？\n\n- A. 创建内容\n- B. 解构\n- C.\
    \ 测量时间\n- D. 转换\n- E. 识别 bug\n\n13. 一个 _________________ 可以帮助识别出了什么问题。\n\n你的答案：\n\
    \n14. trigger_error() 和 user_error() 的区别是什么？\n\n- A. trigger_error() 也允许脚本抛出系统级错误\n\
    - B. user_error() 也允许脚本抛出系统级错误\n- C. user_error() 不能在处理器中使用\n- D. trigger_error()\
    \ 仅在 PHP 中可用\n- E. 没有区别\n\n15. 这个 _________________ 函数通常用于调试目的。\n\n- A. print_r\n\
    - B. var_dump\n- C. stack_dump\n- D. debug_backtrace\n- E. 以上皆非\n\n## Answers\n\
    \n1. 答案 E 是正确的。三元运算符是在每个条件中达的。在这种情况下，只有当第三个条件被求值时，赋值 x=1 才会发生。\n\n2. 因为问题主要是由于一个缓慢的第三方数据源引起的，你可能通过改进连接性（假设问题出在你这边）以及缓存你收到的内容来提高性能。\n\
    \n3. 正确选项是 B 和 D。关闭错误报告、使用 @ 运算符和关闭错误日志将使你失去有用的工具。\n\n4. 该描述对应 === 运算符。\n\n5.\
    \ 正确答案是 D。当执行 PHP 脚本时，它首先被解析为中间代码（称为 opcode），然后由解释器运行。字节码缓存介入这两个阶段之间，缓存解析器的输出，并在下次执行你的脚本时将其直接传递给解释器，从而消除了后者进行解析的需要。\n\
    \n6. 正确答案是 A 和 D。如果 RAM 太少，进程可能会争抢使用内存，迫使服务器大量使用磁盘交换。同样，允许过多的进程同时运行会导致服务器频繁切换上下文，导致速度变慢。\n\
    \n7. 正确答案是 A 和 C。此脚本没有验证 database_query() 调用是否成功，因此在发生错误时它将在没有有效数据库资源的情况下继续执行。此外，$my_id\
    \ 参数未经过转义——这可能导致注入。\n\n8. 答案 B 和 D 是正确的。解析错误（通常表示脚本中的语法错误）无法通过自定义错误处理器捕获，原因显而易见：由于错误处理器位于脚本中，而脚本无法解析，因此处理器无法执行。同样，E_ERROR\
    \ 通常用于表示致命的运行时错误，例如内存\n\n"
