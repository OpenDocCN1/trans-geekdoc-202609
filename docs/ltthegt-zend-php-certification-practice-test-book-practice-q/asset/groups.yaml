    common, the database takes it to mean “extract all the rows in which the IDs are
    different.” There is a substantial difference at work here: the DBMS will simply
    take every row on the left and add to the result set every row on the right that
    doesn’t have a matching ID. Therefore, the query will extract every row from TABLE1
    times every row from TABLE2, minus the rows that the two have in common, thus
    making Answer correct.


