    +   8. This is a very tricky question, but easily explained. The values passed
    to gmtime() correspond to the UNIX epoch, which is really the timestamp "0". Internally,
    however, gmtime() makes use of mtime(), which works with local time. The problem
    here is that UNIX epoch cannot be represented in a time zone that is off the Greenwich
    Mean Time line—as is for Moscow—because, on a Windows machine, this would result
