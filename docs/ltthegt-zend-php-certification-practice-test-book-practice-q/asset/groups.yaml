    # # 5

    Strings and Regular Expressions


    STRINGS ARE THE SWISS-ARMY knife of PHP, particularly if you consider the fact
    that most PHP scripts are used to serve web pages—which are, for the most part,
    nothing more than large strings. Knowing how to use this particular facility is,
    therefore, one of the most fundamental skills of the PHP developer, since you''ll
    be working with them day in and day out.


    Luckily, its essential role in the life of a PHP script has resulted in string
    manipulation being made exceptionally easy by the PHP development team. Therefore,
    once you get past the few hurdles, handling strings becomes easy, quick and—to
    some extent—even fun.


    However, this particular aspect of PHP programming is far from being free of pitfalls.
    This portion of the exam tests your understanding of strings as well as your knowledge
    of the body of functions that are used to manipulate them. Additionally, you''ll
    find yourself faced with the basics of most voodoo art of writing regular expressions,
    which, despite being a hugely useful tool, is too often neglected by most developers.'
