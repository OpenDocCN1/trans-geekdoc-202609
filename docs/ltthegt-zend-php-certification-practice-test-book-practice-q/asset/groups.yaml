    # 前言


    拥有 PHP 认证计划具有许多优势。首先，它允许雇主（特别是非技术类雇主）为他们的 PHP 招聘设定某些标准；他们知道获得认证的人员通过了获得证书的一系列障碍，并能够清晰地展示对
    PHP 及其相关技术的理解。


    这不仅意味着 Zend 认证工程师将符合此类标准并在市场上具有立即优势，而且认证过程还能让越来越多的企业采用 PHP。反，这将为 PHP 开发者创造一个更加活跃的就业市场——让他们更容易通过自己最喜欢的事情生活。


    几周前，我终于抽出时间参加了 Zend PHP 认证。尽管我编写了其中的一些问题，并在几个月前加入了评审这些问题的考试教育咨询委员会，但我惊讶地发现自己有些紧张——我想这不仅是因为考试通常对我产生这种影响，还因为我


