    - 永远不是。匿名函数 `newfunc()` 存在用户在服务器上执行任意代码的风险。

    - 仅当启用 `allow_url_fopen` 时。


    15. **以下哪些 PHP 设置潜在的安全陷阱最多且性能最低？**


    - A. 共享 Apache 模块

    - B. 编译 Apache 模块

    - C. CGI

    - D. IIS 下的 ISAPI 模块


    # 答案


    1. 正确答案是 D。虽然从不同角度看每个答案都可以被认为是正确的，但安全拼图中迄为止最大的单一部分是对从任何外部源获取的信息进行验证。无论是来自用户的表单提交还是服务器环境，从第三方源获取的任何数据都应该经过验证，以确保它符合每个应用程序的语境。


