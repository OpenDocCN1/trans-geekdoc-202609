  mdcn: "\n\n## 5\n字符串与正则表达式\n\n字符串（STRINGS）是 PHP 的**瑞士军刀**，特别是当你考虑到大多数 PHP 脚本都用于提供网页这一事实时——而这些网页在大多数情况下无非是巨大的字符串。因此，知道如何使用这一特定功能是\
