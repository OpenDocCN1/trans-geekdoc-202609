    4. 单例模式（Singleton Pattern）在任何时刻只能存在类的实例时非常有用（而且，当你好奇时，你应该预期考试也会测试你对模式的基本知识）。\n\
    \n5. 虽然其他语言允许多重继承，但 PHP 的对象模型是单继承的。因此，正确答案是 A。\n\n6. 这段代码近似了抽象方法通常提供的行为。如果该类被另一个类继承，并在没有重写的情况下调用了\
