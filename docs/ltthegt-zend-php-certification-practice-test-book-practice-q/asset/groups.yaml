    \ PHP 5 有统一的构造函数 (__construct())，但在 PHP 4 中，构造函数的名称总是与类名匹配。这意味着对于名为 testclass\
    \ 的类，构造函数是答案，syscall()。\n\n8. __sleep() 和 __wakeup() 可以自定义对象的序列化过程。正确答案是 C。\n\n\
    9. 在 PHP 4 中，不存在问题中所列的任何经典面向对象构造（尽管许多是在 PHP 5 中引入的），所以答案 D 是正确的。\n\n10. 在 PHP\
