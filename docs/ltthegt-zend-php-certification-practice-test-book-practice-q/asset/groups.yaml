  mdcn: "\n\n# PHP 编程基础\n\n# 答案\n\n- 1. 观察答案，每个空处唯一合理的选项是 B。PHP 是一种基于 Zend 引擎的脚本语言，通常嵌入在\
    \ HTML 代码中。因此，它主要用于开发 HTML 文档，尽管它也可以同样很好地用于开发其他类型的文档，如 XML。\n\n- 2. 虽然在 PHP 编程中\
    \ `<?php` 和 `?>` 标签经常被忘记，但它们是界定 PHP 代码块的有效方式。`<!` 和 `|` 标签是无效，因此正确答案是 D。请记住，根据\
    \ `php.ini` 文件或 PHP 解释器的运行配置，其中某些标签并不总是可用的。\n\n- 3. PHP 变量始终以美元符号 `$`开头，并由拉丁字母范围内的字符和数字组成，加上下划线字符。`{$var}`\
    \ 是一个变量名，只是使用了一种较不常见的命名规范，`&$something` 是 `$something` 变量的引用。然而，变量不能以数字开头，因此 `$10_invalid`\
    \ 是无效的，答案 D 正确。\n\n- 4. 这里需要注意的重要点是，`$smiley` 数组的键在没有加引号的情况下被引用。因此，访问的键不是 `myvalue`\
    \ 字符串，而是 `myvalue` 常量代表的值。在这里，它等同于访问 `$smiley[10]`，其值为 `dog`，因此答案 A 正确。\n\n- 5.\
    \ 即使 `print()` 和 `echo()` 在大多数情况下可以互换，但它们之间存在显著差异。虽然 `print()` 的行为像函数一样有返回值（尽管它是一个语言结构），但\
    \ `echo()` 实际上是一个没有返回值的语言结构，因此不能在表达式中使用。那么，答案 A 正确。\n\n- 6. 除了简单的数学运算，`%` 运算符是取模运算符，它返回操作数相除后的余数。`<<`\
    \ 运算符是左移运算符，它实际上是将整数乘以 2 的幂。然而，结果仍然被打印出来，且没有任何小数部分，因为后者是 `nil`。最终输出是 256（答案 D）。\n\
    \n- 7. 按照条件的逻辑，获取 `hello world!` 字符串唯一的方法是在 `else` 语句中。因此，`$a` 必须为 `false`。同样，`$b`\
    \ 必须为 `false`。最后的条件依赖于 `($a && $b)` 为 `true`（答案 D）。\n\n- 8. 正确答案是 C。对于 PHP 4.2，不需要使用\
    \ `rand()` 初始化随机数生成器，除非需要特定的伪随机数序列。此外，即使随机数生成器没有种子，脚本每次都会输出相同的数字。变量 `$Array` 虽然是一个字符串，但可以作为数组访问，在这种情况下将返回数字索引。最后，循环从\
    \ 1 开始，直到 `$i` 小于 5 为止——总共 9 次。\n\n- 9. 一系列如上述检查单个条件的 `if...else` 块是使用 `switch`\
    \ 的完美位置：\n\n```php\n<?php\nswitch($a) {\n    case 'a':\n        somefunction();\n\
    \        break;\n    case 'b':\n        anotherfunction();\n        break;\n \
    \   case 'c':\n        dosething();\n        break;\n    default:\n        nothing();\n\
    }\n?>\n```\n因为有一个通捕机制（catch-all），所以这种情况也必须提供一个 `default` 情况。答案 E 正确。\n\n- 10.\
    \ 通常，`foreach` 语句是遍历数组最合适的结构。然而，因为我们要求修改数组中的每个元素，此选项不可用，因为 `foreach` 在数组的副本上工作，会导致开销。虽然\
    \ `do-while` 循环可能可行，但该语句最适合这项任务，因此选 A。\n\n- 11. 由于只能在提供的段落中添加一行代码，唯一合理的语句是 `for`\
    \ 循环，因此选择 C 或 D。在 PHP 中，循环声明如下：\n\n```\nfor (init; continue; iteration)\n```\n\
    其中 `init` 语句在进入循环之前执行。然后 `for` 循环开始执行其块中的代码，直到 `continue` 语句的值为 `False`。每当完成一次循环迭代时，都会执行迭代语句。将此应用于我们的代码，正确的语句是：\n\
    \n```php\nfor ($idx = 1; $idx < 5; $idx *= 2)\n```\n或者答案 C。\n\n- 12. 在五个选项中，只有两个是有效的函数声明（A\
    \ 和 D）。在这两个中，只有一个在没有传递参数时会提供默认参数——答案 A。\n\n- 13. 此题旨在测试您在处理函数时对 PHP 变量的知识。具体来说，你必须理解\
    \ `global` 语句如何将全局变量引入局部作用域，以及全局数组（如 `$_GET`、`$_POST`、`$_COOKIE` 等）的性质。在这种情况下，计算结果为\
    \ 5²，即 25，答案 B。\n\n- 14. 函数可以使用括号动态调用。因此，对于 A，正确的索引是 0，对应字符串 `myfunction`。另一方面，对于\
    \ B，正确的索引是 7 和 8，分别对应 `$a` 和 `$b`。\n\n- 15. 通常，`require()`（或 `require_once()`）与\
    \ `include()`（或 `include_once()`）的区别在于，当找不到文件时，前者抛出警告并允许脚本继续执行，后者抛出错误并停止脚本。因此，答案\
    \ E 正确。\n\n- 16. 当参数被声明为引用传递时，无法为其指定默认值，解释器期望一个可以在函数内部修改的变量。因此，答案 C 正确。\n\n- 17.\
    \ 正确答案是异或（xor）运算符。\n\n- 18. 标识运算符通过首先比较两个操作数的类型，然后比较的值来工作。如果不同，则返回 `false`——因此答案\
    \ B 正确。\n\n- 19. 正确答案是 A 和 C。在答案 A 中，使用 `pow` 函数计算 2²，对应 4。在答案 C 中，使用左位移运算符将 `$a`\
    \ 的值左移位，对应乘以 4。\n\n- 20. 唯一符合要求的答案是 A。脚本在到达主文件以外的任何文件的结尾并不一定会终止——因此“当前”文件可以被外部包含而不会导致脚本在其结尾终止。至于\
    \ PHP 和 Apache 崩溃，它们很难被视为终止脚本的“整洁”方式。\n\n# 2 使用 PHP 4 进行面向对象编程\n\nWHILE PHP 4\
    \ 并不是一个成功 OOP 实现的典范，但它仍然可以构建可行的面向对象应用程序——你只需要知道不完美模型的陷阱在哪里，并仔细避开它们。\n\n尽管 PHP\
    \ 5 对 PHP 处理对象的方式带来了许多变化，你可能会倾向于忽略 PHP 4 的功能，但事实是，许多用“旧版” PHP 开始开发应用程序的程序员已经拥抱了\
    \ OOP。这导致世界上存在大量的 OOP 代码——即使在你跳转到 PHP 5 之前，你遇到这些代码的概率也非常大。\n\n考试的 OOP 部分测试了你对通用面向对象编程的知识，还测试了\
    \ PHP 4 实现这些内容的独特方式。\n\n"
