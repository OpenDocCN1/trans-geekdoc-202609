    11. Answer C is correct. The DESC keyword is used to reverse the default sorting
    mechanism applied to a column. In this case, therefore, it will cause the rows
    to be first sorted by ID and by name in descending order.


    12. The CURRENT_DATE function is not a standard SQL aggregate function (although
    it might exist as a function supported by a particular database platform, it is
    not an aggregate).


    13. Answers B and C are correct. In standard SQL, if a GROUP BY column, all the
