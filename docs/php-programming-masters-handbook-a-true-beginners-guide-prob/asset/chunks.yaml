    # PHP-01：定义与设计你的数据


    在 PHP 中，注释与 C、C++ 和 Java 等常用语言相同。


    单行注释以双斜杠（`//`）开始，在行结束处结束。


    多行注释以斜杠和星号（`/*`）开始，并以相反的星号和斜杠（`*/`）结束。通常，多行注释的每行都会以星号（`*`）开头。


    在 PHP 中表示数据。


    ## 基础 PHP 语法


    .php 文件本身就是网页，就像 .html 文件一样。


    然而，PHP 代码以此行（<?php`）开始，以此行（?>`）结束。因此你的 PHP 代码如下：


    ```php

    <?php

    // 代码

    ?>

    ```


    此外，类似于 C、C++ 和 Java 等代码，PHP 中的代码行以分号（;）结束。这一点非常重要；PHP 程序员经常遇到错误仅仅是因为他们的行没有以分号结束。


    ```php

    <?php

    echo ''line 1'';

    echo ''line 2'';

    echo ''line 3'';


    ?>

    ```


    ## PHP 中的原子数据


