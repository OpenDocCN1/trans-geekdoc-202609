    \ = \\_\\_\\_\\_ ;\n\nprint $NAME . '\\\\n';\n\nprint $AGE . '\\\\n';\n\nif($ISMARRIED\
    \ == TRUE) print $NAME . ' is Married.';\n\n// #################\n\n?>\n\nIf you\
    \ try to run your code - and it runs correctly - you should see the following:\n\
    \n'Jane'\n\n(Jane’s age)\n\nAnd if you properly set Jane to be married, it should\
    \ print 'Jane is Married.' If Jane isn’t married, the line won’t print at all.\
    \ This is up to you!\n\nChapter 2: Compound/Composite Data \n\nFrom the last chapter’s\
    \ example, you can start to wonder that there just has to be a way to group all\
    \ that data: your name, age, location, whether or not you have pets, etc.\n\n\
    Also, notice that a person can neither be a String, Number, Integer, nor Boolean.\
    \ A person just holds too much data to be defined as either one of the above.\n\
    \nSo what do we do?\n\nWhat a Composite Data Structure is\n\nFrom the previous\
    \ example, you can think of all the data you’ve defined as small parts of a whole.\
    \ But what is this “whole”?\n\nEnter Composite Data.\n\nA Composite Data structure\
    \ includes many parts of data within it.\n\nThose parts of the Composite could\
    \ be whatever you wish to declare. Strings, Integers, Booleans, Lists, and even\
    \ Other Composite Data.\n\nIdentify & Defining a Composite Data Structure\n\n\
    When you were asked earlier to define what type of data are you dealing with,\
    \ what if you designed & defined data for an object that you couldn’t identify\
    \ as atomic data? What if it had plenty of Characteristics? What if there was\
    \ more depth in that object?\n\nThe key thing to remember in identifying composite\
    \ data is depth. There are more parts to that ‘thing’ you were trying to define\
    \ as data. If there’s more to anything than just a name, number, or true/false\
    \ switch, then it’s probably going to be a composite data structure.\n\nRepresenting\
    \ information as Composite Data\n\nLet’s take YOU as an example. You are a Person.\
    \ As a person, you’re not JUST a name or number; you are comprised of a lot of\
    \ data. An endless amount of data, rather.\n\nThe Elements that Comprise your\
    \ Data\n\nAs an example of Composite Data, let’s define you.\n\nFor now, let’s\
    \ start with the basics.\n\nRemember: you are a Person. Using simple pseudocode,\
    \ let’s define that:\n\n// I am a PERSON\n\nCompositeStructure PERSON;\n\nAn Explanation\
    \ for your Composite Data’s Parts\n\nSimilar to what you did earlier for defining\
    \ data, it’s also best that you identify what your composite data structure is\
    \ comprised of.\n\nFor practice, use comments to describe what your data structure\
    \ has.\n\nFollowing the example above, You have a Name and an Age as well. Let’s\
    \ include that:\n\n// I am a PERSON\n\n// A person has:\n\n// - a name (string)\n\
    \n// - an age (number)\n\nCompositeStructure Person {\n\nString NAME;\n\nNumber\
    \ AGE;\n\n{\n\nYou live in a City. Oh but wait, a City isn’t just a name is it?\
    \ It’s comprised of plenty of data as well!\n\n// This is a CITY\n\n// A City\
    \ has:\n\n// - a name (string)\n\n// - a Latitude and Longitude (2 numbers)\n\n\
    // - a Population count (an integer, above 0)\n\nCompositeStructure City {\n\n\
    String NAME;\n\nNumber LATITUDE;\n\nNumber LONGITUDE;\n\nInteger POPULATION;\n\
    \n{\n\nLet’s not forget about YOU now. You live in a City, remember?\n\n// I am\
    \ a PERSON\n\n// A person has:\n\n// - a name (string)\n\n// - an age (number)\n\
    \n// - a City they live in (Composite data City)\n\nCompositeStructure PERSON\
    \ {\n\nString NAME;\n\nNumber AGE;\n\nCity LOCATION;\n\n}\n\nNotice what happened\
    \ here. A compound data structure within another compound data structure!\n\n\
    PHP-02: Compound/Composite Data\n\nThere are two common ways to construct composite\
    \ data structures in PHP: using PHP associative arrays and using PHP classes.\n\
    \nPHP Composite Data as Object-Oriented Programming\n\nComposite data structures\
    \ in PHP can be declared as Classes. Luckily, the syntax structure is very similar\
    \ to many common programming languages such as Java, C, and C++. Creating classes\
    \ in PHP is often the easier, more simple way to create data structures. This\
    \ is also best if those classes are going to define plenty of data objects in\
    \ the program.\n\nAs classes, here’s how a data structure with two attributes\
    \ would look like, including the Explanation Comments:\n\n<?php\n\n// Our class\
    \ has:\n\n// - a variable (String)\n\n// - another variable (Integer)\n\nclass\
    \ className {\n\npublic $attribute1 = 'Data Type as String';\n\npublic $attribute2\
    \ = 123;\n\n}\n\n$DATASTRUCTURE = new className;\n\n?>\n\nIf you’ve coded other\
    \ languages before, you’ll notice that the syntax structure is quite familiar.\n\
    \nBut here are the main points when creating classes in PHP:\n\n\\-Define a Class\
    \ data structure by writing ‘class’, then the class name, then curly brackets\
    \ ({})\n\n\\-Include all data attributes and even functions (we’ll cover these\
    \ later) within those curly brackets\n\n\\-Attributes are going to be PHP variable\
    \ declarations, just like you’ve done before.\n\n\\-However, for each attribute\
    \ or function, you add ‘private’ or ‘public’ just before your $attributeName.\
    \ Public data or functions can be accessed outside the class, while Private ones\
    \ can’t.\n\nInitializing a PHP Class\n\nTo create an Object based on your PHP\
    \ class, it would be just like setting a PHP variable. However, you’ll be setting\
    \ that variable as a new Object. This object will have the same data structure\
    \ as the class you set it as.\n\nIt would look like the following notation:\n\n\
    $DATASTRUCTURE = new className;\n\nIn the above line, the Global variable $DATASTRUCTURE\
    \ would be a composite data structure based on the Class it’s initialized to.\
    \ You decide with class by setting the class name on that variable\n\nPHP Composite\
    \ Data as Associative Arrays (advanced)\n\nIn PHP, you can create quick composite\
    \ data structures as array objects.\n\nUse these if you just want a quick, simple\
    \ data structure that you won’t really use frequently."
