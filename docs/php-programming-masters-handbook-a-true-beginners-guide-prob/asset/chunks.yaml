- raw: "In cases where you set clear boundaries for your data, yet you have some code\
    \ that sets your data to go past those boundaries (and nothing is done about it),\
    \ it might create problems for your code later on.\n\nNow you understand how crucial\
    \ it is to keep track of your data. There are many aspects of coding that depend\
    \ on it, such as Debugging and making sure your code works the way you intend\
    \ it to.\n\nPHP Workshop #2\n\nBasketball Finals\n\nLet’s say there’s a basketball\
    \ game between two teams: the Eastern Champions and the Western Champions.\n\n\
    Here are your initial lines of your code:\n\n// —————\n\n// WestTeam has a Score\
    \ (Integer)\n\n$westTeam;\n\n// EastTeam has a Score (Integer)\n\n$eastTeam;\n\
    \n// The game Begins:\n\n$westTeam = 0;\n\n$eastTeam = 0;\n\n// For each quarter,\n\
    \n// Each Team scores a random amount of points between 15 and 45\n\n// 1st Quarter\
    \ Score:\n\n$westTeam += rand(15, 45);\n\n$eastTeam += rand(15, 45);\n\n// 2nd\
    \ Quarter Score:\n\n$westTeam += rand(15, 45);\n\n$eastTeam += rand(15, 45);\n\
    \n// HALFTIME!!!\n\n// —————\n\nIt is now HALFTIME.\n\nHow would you edit the\
    \ above code to PRINT the scores for each team?\n\nWhich team would score more\
    \ in the 1st Quarter? In the 2nd Quarter? How would you know? And how would you\
    \ show it?\n\nAlso, how would you edit the code to add the 3rd and 4th quarters?\n\
    \nTest and run your code in an IDE of your choice.\n\nYou can also use a free\
    \ IDE such as [http://rextester.com/runcode](http://rextester.com/runcode)\n\n\
    Chapter 5a: Defining & Designing your Functions\n\nNow we’ll move on to the parts\
    \ of programming where the magic happens.\n\nFunctions.\n\nWhere data structures\
    \ are used to represent “things” in this universe, you define functions as the\
    \ “actions” or verbs in this universe.\n\nAnd you can make your functions do whatever\
    \ you want/need it to do, as long as you know what you’re doing. You can calculate\
    \ math, write sentences for you, change or update data, sort out lists with tens\
    \ of thousands of items, make websites for you, whatever you like. In reality,\
    \ the possibilities can be endless.\n\nBut first let’s understand the core parts\
    \ of function design: its inputs, its output, its signature, its effects, and\
    \ its functionality.\n\nA Function’s Inputs\n\nYou can set your function to accept\
    \ whatever data you need it to.\n\nThese are called a function’s arguments or\
    \ parameters. Your function will use this incoming data to perform what you intend\
    \ it to.\n\nOr, on the other hand, you can also have a function NOT require any\
    \ inputs. Your function will then perform what you’ve programmed it to, but it\
    \ won’t need any incoming data.\n\nFor practice, let’s use comments to declare\
    \ what inputs we want our function to have. Let’s say we want a name (a string)\
    \ as an input\n\n// INPUT: - a name (String)\n\nA Function’s Output\n\nYour function\
    \ can also return a data value - based on whatever you want to set it to. You\
    \ can then program your function to output that same data type.\n\nOr, you can\
    \ also have a function NOT return anything. You can then program your function\
    \ to do what you intend it to do, but it won’t return any data after it executes.\n\
    \nIn most programming languages, functions only return ONE thing - whether it\
    \ be a data value, an entire list, compound data, or more.\n\nHowever, you must\
    \ make sure your function outputs whatever you have set it to. Say, if you want\
    \ your function to output a String, the very last line of that function MUST return\
    \ a String data type. If you set your function to have no outputs, your function\
    \ MUST NOT return any data types after it executes.\n\nFor practice, let’s use\
    \ comments to declare what outputs we want our function to have. We’ll continue\
    \ designing our function. We now have an input, now we want to have an output.\n\
    \n// INPUT: - a name (String)\n\n// OUTPUT: - an ID (Number)\n\nDefining what\
    \ your Function will Do\n\nNow we figure out what EFFECT our function will have\
    \ once we run it.\n\nThis is your function’s main purpose - it’s the reason why\
    \ you’re going to write these lines of code!\n\nYour function’s effect will be\
    \ whatever you intend it to do. Change data, create new data, calculate a few\
    \ values together, whatever you want.\n\nBut isn’t an Output and Effect the same\
    \ thing? Well, no.\n\nThere is a difference between a function’s OUTPUT and EFFECT.\
    \ A function’s output is the data it returns, while a function’s effect is anything\
    \ that the function does or anything the function’s action has affected.\n\nFor\
    \ practice, let’s use comments to declare what effects we want our function to\
    \ have. We’ll continue designing our function. We now have an input and output.\
    \ Now we figure out what it does when we run it.\n\nLet’s say we want it to come\
    \ up with a random number. We first put in the comments of what we intend it to\
    \ do\n\n// INPUT: - a name (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT:\
    \ generates a random number for a given name\n\nKey Function Rule-of-Thumb:\n\n\
    Make sure your function only does the only one thing you want it to do. A function\
    \ that does too many things will not only complicate your code and make it look\
    \ bad, but it will cause headaches and frustration for programming teammates.\n\
    \nHowever, your function can include and call on many other functions to help\
    \ process something. These are called Helper Functions (we’ll cover this later!)\n\
    \nA Function’s Signature\n\nHere is when we start writing our function’s lines\
    \ of code.\n\nIn most programming languages, a function’s signature defines a\
    \ function’s name, inputs, outputs, and even particular traits it has.\n\nRemember\
    \ when we declared our Composite data? We first started out designing the name\
    \ of our whole data structure, then we started designing what it consisted of.\n\
    \nFor function signatures, we first code what its name is - as well as any inputs\
    \ and outputs it has.\n\nNow, let’s look back at the function we were designing\
    \ for practice. We now know what it does, what it requires and what it returns.\n\
    \nFor now, we’ll use Pseudocode to design our function’s Signature. Our signatures\
    \ will then be structured in this form:\n\n(OutputType) functionName(InputType\
    \ inputName)\n\nSo our function’s signature will look like this:\n\n// INPUT:\
    \ - a name (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT: generates a random\
    \ number for a given name\n\nnumber createID(string name)\n\nImplementing your\
    \ Function\n\nThis can be the tricky part - unless you know exactly what you’re\
    \ doing.\n\nIn designing functions, the last thing you do is to program your function’s\
    \ actual functionality. You would now know what inputs & outputs it has, as well\
    \ as what it’s trying to do. You’ve essentially planned what your function will\
    \ do.\n\nNow you’ll have your function do what you planned it to.\n\nYou program\
    \ the functionality in the next few lines after your function’s signature.\n\n\
    In pseudocode, we’ll use curly brackets ( { } ) right after the function’s signature\
    \ to include its functionality code. Our functions will then be structured in\
    \ this form:\n\n(OutputType) functionName(InputType inputName) {\n\n(your function’s\
    \ code)\n\nreturn OutputType if any\n\n}\n\nFinally, let’s look back at the function\
    \ we were designing for practice. We are ready to finish it.\n\nLet’s say there’s\
    \ such thing as a function named randomNumber() that creates a random number for\
    \ us. \n\n// INPUT: - a name (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT:\
    \ generates a random number for a given name\n\nnumber createID(string name) {\n\
    \nrandomNumber()\n\n}\n\nA Common Error in Function Design\n\nBut wait. The above\
    \ code isn’t going to work. Can you guess why?\n\nOh right.\n\nIn our signature,\
    \ our function is supposed to RETURN a number. So in order for this function to\
    \ work, it needs to actually return a number.\n\nSo we make the function RETURN\
    \ whatever random number is generated by the inside function randomNumber()\n\n\
    // INPUT: - a name (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT: generates\
    \ a random number for a given name\n\nnumber createID(string name) {\n\nreturn\
    \ randomNumber()\n\n}\n\nand now, we finally complete our function - from design\
    \ to code.\n\nCalling your Function Procedure"
