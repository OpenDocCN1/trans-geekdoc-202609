    \ separate City data structure, but it certainly isn’t called CITY.\n\nCompositeStructure\
    \ PERSON {\n\nString NAME;\n\nNumber AGE;\n\nCity LOCATION;\n\n}\n\nOh, so it\
    \ should be Jamie-LOCATION= NewYork;"
