    \ \\_\\_ 17) print \"Just a School Kid\";\n\nelse print \"A Fully Responsible\
    \ Adult!\";\n\nprint \"\\\\n\";\n\n}\n\n$x \\_\\_ 4;\n\nageLifeTeller($x);\n\n\
    $x \\_\\_ 16;\n\nageLifeTeller($x);\n\n$x \\_\\_ 2;\n\nageLifeTeller($x);\n\n\
    $x \\_\\_ 2;\n\nageLifeTeller($x);\n\n$x \\_\\_ 21;\n\nageLifeTeller($x);\n\n\
    $x \\_\\_ 3;\n\nageLifeTeller($x);\n\n$x \\_\\_ 3;\n\nageLifeTeller($x);\n\n//\
    \ - - - - - - \\- - - - - -- - - - - -- - - - - -- - - - - -\n\nPART IV: Lists\n\
    \nChapter 12a: Lists\n\nAt one point, computers will eventually have a collection\
    \ of data to deal with - regardless whether they are objects or basic data.\n\n\
    Thus, we have lists.\n\nLists in General\n\nAs an Abstract Data Type, lists are\
    \ essentially a series of data items connected together.\n\nComputers will generally\
    \ go through data item on the lists one by one.\n\nThere are two general types\
    \ of lists: linked lists and arrays. Most programming languages will usually include\
    \ either type of list.\n\nLinked Lists v.s. Arrays. Which list to use?\n\nIMPORTANT\
    \ NOTE: The ironic thing about most programming languages is the fact that they\
    \ ALL have arrays and linked lists available. But, what if a colleague or boss\
    \ asks you which one to use? See, sometimes making the slightest decisions like\
    \ these will be such big deals that make or break an app - and sometimes, even\
    \ job applications, careers and startups. \n\nIn general, use Linked Lists for\
    \ quickly adding and deleting data items for that list, no matter what order they\
    \ are. Whether the item is first, last, or in the middle of the list, it takes\
    \ the same time and effort for the computer to add/remove data items. Also, if\
    \ you also don’t know how big your list will be, linked lists are preferable.\n\
    \nIn general, use Arrays for any computing where you need to access or process\
    \ each element in the list. The indices in the Array will help your computer process\
    \ the list faster, as well as give your computer multi-process potential for that\
    \ list. Also, use arrays if each item in the list needs an index. For example,\
    \ if you wanted to randomly get list items, you can only do it in an array (in\
    \ a linked list, how would the computer know what item to get? Think about it…)\n\
    \nBottom line:\n\nLinked Lists = any size, faster add/remove\n\nArrays = fixed\
    \ size, faster access/process\n\nLinked Lists v.s. Arrays: Data Management\n\n\
    In general, if given the same data type to store in lists, arrays take less memory/storage\
    \ space than linked lists. You’ll find out about this later, but linked lists\
    \ generally need slightly more data in its structure than arrays. However, in\
    \ lists with very high number of items, this slight difference is actually significant.\n\
    \nChapter 12b: Linked Lists\n\nThe concept of linked lists is actually very simple.\n\
    \nThink of linked lists as a chain - literally. In a linked list, each “link”\
    \ in the chain will have its item, followed by whatever “link” is next. If a certain\
    \ link has no links next, then that link is at the end of the chain - or rather,\
    \ the end of the linked list.\n\nHere’s an example of what a doubly linked list\
    \ would look like visually:\n\n\\[ ID01 \\]\\[ item \\]\\[ Prev: NULL\\]\\[ Next:\
    \ ID03\\] \n\n\\[ ID04 \\]\\[ item \\]\\[ Prev: ID03\\]\\[ Next: NULL\\]\n\n\\\
    [ ID03 \\]\\[ item \\]\\[ Prev: ID01\\]\\[ Next: ID04\\]\n\nThere are three “links”\
    \ in the chain, with link ID04 being the last one. Why is ID04 last? Easy - because\
    \ there is no link after it.\n\nAnd note how the IDs go from 01, then 04, and\
    \ 03, and they’re not in order. However, in linked lists, the numbers DO NOT tell\
    \ you the order. I REPEAT. The NUMBERS DO NOT tell you the order\n\nIt’s because\
    \ of one crucial fact about how the ordering in linked lists are set up."
