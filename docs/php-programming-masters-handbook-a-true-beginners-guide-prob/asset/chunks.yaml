    # 第 6 章：世界设计与简单应用入门，第一部分


    此时，你已经学会了如何将现实物体解释为计算机数据表示，以及将动作和程序解释为编程函数。


    现在，你将开始设计过程。你开始描述虚拟世界和应用，而且几乎总是视觉化的方式。你正准备将你的想法转化为代码和数据。


    就像木工思考如何建造自己的房子一样，你在开发应用和游戏世界时也采用相同的方法。你识别构建项目所需的所有组件。


    ## 简单应用设计流程


    关于你的想法，有三点关键内容你需要识别：想法背后的事实、保持不变的部分，以及将会发生变化/差异的部分。


    这样做的是为了让你和其他程序员对数据拥有尽可能多的控制和稳定性。你将知道自己正在处理什么类型的数据，以及这些数据是否会或如何发生变化。丰富的程序员随后可以检查特定的数据结构或函数设计是否符合预期。


    为了引导你完成这一过程，我们将描述经典的贪吃蛇游戏——并从程序员的角度识别大量关于游戏的细节。这就像是我们第一次第一次设计这个游戏一样。仿佛我们正处 70
    年代。


    ### 识别事实 (FACTS)


    首先，你需要事实。你需要描述你的想法是关于什么的，涉及哪些内容等。尽可能详细地描述，包括你提供的环境和关键人物。


    #### 示例：


    在单局贪吃蛇游戏中，存在一条有头部和身体的蛇，以及随机出现的食物项。蛇的头部、身体的所有分段以及食物都有一个 `X-Y 坐标` 和视觉表示（因为它们具有相似的特征，可以被分组为游戏精灵/sprite）。`X-Y
    坐标` 代表可玩区域内的位置：一个具有高度和宽度的形形区域。分数记录了吃掉了多少个食物。


    玩家改变蛇移动的方向：上、下、左、右。当蛇撞到墙壁或撞到自己身体的任何一段时，游戏结束。


    当蛇头“吃到食物”（在与食物相同的坐标上出现）后，蛇会生长一个身体段。


    ```

    [food] + [head] [body] [body]

    =

    [head] [body] [body] [body]

    ```


    ### 识别保持不变的 (CONSTANT)


    其次，你需要识别你的世界或应用中哪些元素在整个编程过程中保持一致。此外，识别你的想法中是无条件存在的。


    #### 示例：


    食物项、蛇头和身体段具有一致的图像。


    游戏板具有固定的宽度和高度。


    ### 识别变化/差异的 (CHANGES/VARIES)


    第三，识别程序运行时哪些会发生变化或差异。


    #### 示例：


    食物项、蛇头和身体段在整个游戏中都具有不断变化的 `X-Y 坐标`。身体段的数量会变化，从初始的 2 个一直到尽可能多。


    ## 将你的想法转化为代码


    现在，记录下你提出的所有事实、描述和想法。你将对它们进行数据表示。


    在书的早期，我们使用注释来描述将创建的所有信息有一个充分的理由。这是因为它们有助于为你的每一点信息选择最佳的数据表示。在你描述完应用或世界将关于什么之后，你将开始使用注释来开发那个数字世界。


    #### 示例：


    对于我们提出的关于贪吃蛇游戏的每个事实和想法，我们将使用注释来提示它们应该如何用数据表示。


    ```

    // 游戏精灵具有：

    // - 一个 X 坐标（整数）

    // - 一个 Y 坐标（整数）

    // - 一个表示它自身的图像（选择你的视觉表示）


    // 蛇头、蛇身体段和食物项

    // 分别由游戏精灵表示


    // 整个蛇类包含：

    // - 一个蛇头（游戏精灵）

    // - 一个蛇身体段列表（游戏精灵的列表）


    // 一条完整的蛇可以：

    // - 吃食物

    // - 生长

    // - 在板上移动


    // 可玩板具有：

    // - 一个固定长度（整数）

    // - 一个固定的宽度（整数）


    // 贪吃蛇游戏有：

    // - 一个可玩板（Playable Board 类）

    // - 食物项（Food 列表）

    // - 蛇（EntireSnake）

    // - 分数计数（整数）


    // 蛇游戏可以：

    // - 开始新游戏

    // - 结束游戏（无论是胜是负）

    // - 更新正在进行的游戏

    // - 更新分数

    // - 在按键时移动蛇

    // - 创建或删除食物项

    ```


    注意，还没有编写任何实际代码；只有注释。这个过程的优之处在于，给定了事实和想法（以及它们的数据表示），我们可以用任何喜欢的语言开始创建代码。我们现在知道哪些将是数据结构、类、整数等等。


    我们确实需要过更多工具，所以稍后我们将继续设计。


    同时，在下一个大工作坊中，你把想法注释转换为实际代码。祝你好运！


    ## PHP 工作坊


    ### 游戏设计：数据与函数


    首先，去一个你喜欢的 IDE。在线 IDE 包括 `rextester.com`、`codechef.com` 和 `ideone.com`。


    你将练习设计数据结构和函数——你得到一组描述简单游戏的注释。如果你觉得想创建或删除字段、类或方法，尽管这样做。


    现在，让我们继续。我们将设计的游戏是……


    PONG！


    祝你好运！


    ```

    // - - - - - - - - - - - - - - - - - - - - -

    // 游戏精灵类具有：

    // - 一个宽度（整数）

