    \ theArray[i]; // 这将打印 i 位置上的任何内容\n    }\n}\n```\n\n### 反向遍历\n```java\n// 输入:\
    \ - 无\n// 输出: - 无\n// : 打印数组中的每个名称，从最后一个开始\n// - 开始: (设置一个起始值)\n// - 继续: 0 < 计数整数\n\
    // - 重复执行步骤: (计数整数 -1)\nvoid printArrayFromEnd() {\n    // 这是一个 for-循环\n    for\
    \ (integer i = 4; 0 < i; i--) {\n        print theArray[i]; // 这将打印 i 位置上的任何内容\n\
    \    }\n}\n```\n\n每个版本将以不同的方向遍历数组。这些方向取决于迭代组成部分：一个将从 `0` 遍历到数组大小，另一个将向相反方向遍历。\n\
    \n# 第 15 章：迭代：While 循环\n\n简单来说，`While-loop` 是一种更简单的的迭代形式。\n\n它包含与 `IF-statement`\
    \ 相似的特征：它包含一个重复条件（布尔语句），以及一段只要该重复条件保持为 TRUE（真）就会重复处理的代码。\n\n然而，`While-Loop` 内部的重复代码将一直重复，直到重复条件返回\
    \ FALSE（假）为止。然后，代码将继续执行。\n\n记住这个概念：反复地执行一个过程，每次重复都让距离某个限制近一步，然后停止重复并继续执行。对于 `While-Loop`\
    \ 也是如此。\n\n在重复代码中，应该有一或两行代码来改变重复条件。它应该向着返回 FALSE 的方向移动，以便 `while-loop` 最终能够停止重复。\n\
    \n与其他迭代形式一样，`While-Loop` 函数几乎总是涉及某些数据收集、整数或某些数字。它需要这些数据来判断重复条件。数据将被检查，重复条件将返回\
    \ TRUE 或 FALSE —— 因此，要么重复代码，要么继续执行。\n\n在伪代码中，这里有一个使用 `While-Loop` 的示例函数：\n\n```java\n\
    // 输入: ____\n// 输出: ____\n// : ____\n// - 如果满足重复: 计数整数 < (设置一个限制)\nvoid countTo(Integer\
    \ n) {\n    Integer LOCALCOUNTER = 0\n    while (LOCALCOUNTER < n) {\n       \
    \ print(LOCALCOUNTER)\n        LOCALCOUNTER++\n    }\n}\n```\n\n现在，让我们分析一下 `While-Loop`\
    \ 及其组件：\n\n### 重复条件\n只要 `Repeat-Condition` 保持 true，`Repeating Code` 就会被处理并持续被重新处理。在这个例子中，局部变量\
    \ `integer` 最初设置为 `0`。只要局部变量小于限制（输入整数），`while-loop` 就会重复。\n\n```java\n// - 如果满足重复:\
    \ 计数整数 < (设置一个限制)\n…\nwhile (LOCALCOUNTER < n) {\n    ....\n}\n```\n\n### 重复代码\n\
    正如你所猜的，只要 `Repeat-Condition` 为 TRUE，这部分代码就会不断重复。\n\n然而，必须至少有一行代码让下一次重复向着 `Repeat-Condition`\
