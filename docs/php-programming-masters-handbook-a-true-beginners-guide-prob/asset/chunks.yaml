- raw: "To check whether or not the function has reached its base case, note its use\
    \ of the IF statement above: As a condition, it checks whether or not the input\
    \ has reached the base case. If true, the function returns and ends.\n\nImplementing\
    \ the Function: The Base Case\n\nA Base Case is always the first component of\
    \ a Self-Recursive Function.\n\nYou need to set your self-recursive function limit.\
    \ This could be when either there are no more data items left to process or some\
    \ variable or input is at a minimum/maximum value. Once your self-recursive function\
    \ encounters that limit, the function should stop repeating and end.\n\nIn the\
    \ example above, the base case is set when the input is not a positive integer\
    \ - essentially when it’s 0 or below. Whenever that becomes the function input,\
    \ the function will return and end.\n\n// \\- Base Case: input is <= 0\n\n…\n\n\
    //Base Case:\n\n if (i <=0) return;\n\nAlso, observe carefully. Remember the IF\
    \ statements we went over in a previous chapter? Self-recursive functions will\
    \ utilize that concept to check for the Base Case.\n\nWhy you NEED a Base Case\n\
    \nWithout a proper base case, a self-recursive function will process forever -\
    \ a term called an Infinite Loop. The function will keep repeating its process\
    \ despite having a reduced or augmented input. It wouldn’t know how to stop processing,\
    \ so it would go on forever.\n\n“ Eat, sleep, rave, repeat “\n\n“ Eat, sleep,\
    \ rave, repeat “\n\n“ Eat, sleep, rave, repeat “ … and so on\n\nThe Recursive\
    \ Step: Self-Reference\n\nThere are two main components in the Recursive Step:\
    \ the function effect and the call to same function. That function call needs\
    \ to have an input that steps closer to the Base Case.\n\nJust as a typical function,\
    \ the effect is whatever you’ve intended your function to do.\n\nThe call to the\
    \ same function is what defines this as a Self-Recursive function. Note that in\
    \ the last line of the example, there is a call to that same function. However,\
    \ and most importantly, the input in that function is decremented by 1. And it’s\
    \ eventually going to be decremented all the way to 0 - the Base Case!\n\n// -\
    \ Recursive Step: Repeat with input - 1\n\n…\n\n // Recursive Step:\n\nprint 10\
    \ ^ i;\n\nprintPowerTen(i - 1); // this is the self-reference\n\n…\n\nTail-Recursive\n\
    \nA Self-reference Function is tail recursive when the very last line of its procedure\
    \ is a call to itself. You want your self-recursive functions to have this; it\
    \ helps ensure your function process the way you intend it to be.\n\nIn our example,\
    \ the function is definitely self-recursive. There is a process to increment the\
    \ input by one, then the function repeats itself using that input.\n\nprintPowerTen(i\
    \ - 1); // this is the self-reference\n\nThe Recursive Rule of thumb: TRUST THE\
    \ RECURSION\n\nYou’ve defined what your function limit is. It’s on your Base Case.\n\
    \nNow as long as your self-reference function is tail recursive, and the recursive\
    \ function call’s input is changed to a step closer to the base case, then your\
    \ function should operate repeatedly over and over until it reaches a base case.\n\
    \nAs long as you have these pieces in place, your recursive function should process\
    \ as planned. You just need to Trust the Recursion.\n\nGet your base case defined,\
    \ call the function recursively, and set that input to inch closer to the base\
    \ case. \n\nDefining the Function\n\nWhile the function input and output will\
    \ vary for each situation, the effect will remain consistent: the function will\
    \ keep repeating and producing its desired effect until it hits its base case\
    \ limit.\n\n// INPUT: \\_\\_\\_\\_\\_\n\n// OUTPUT: \\_\\_\\_\\_\\_\n\n// EFFECT:\
    \ \\_\\_\\_\\_\\_\n\n// \\- Base Case: function has reached a limit\n\n// - Recursive\
    \ Step: variable/input, with a step closer to reaching limit\n\nHere’s an example:\n\
    \n// INPUT: - Array of Strings, and a String Length (Integer)\n\n// OUTPUT: -\
    \ Array of Strings\n\n// EFFECT: Returns an array of Strings that have the given\
    \ string length\n\n// \\- Base Case: function has no more Array Elements to process\n\
    \n// - Recursive Step: Repeat without recently processed String\n\nArray\\[String\\\
    ] matchLength(Array\\[String\\] stringArray, Integer length) {\n\n…\n\n}\n\nChapter\
    \ 14: Iteration Loops\n\nOnce you understand how recursive functions work, you’ll\
    \ understand how similar the next two chapters (iteration and while loops) are\
    \ to self-recursion.\n\nIn essence, self-recursion, iteration loops, and while-loops\
    \ have the same concept: repeat a process over and over, with each repeat a step\
    \ closer to reaching some limit, then stop repeating and move on.\n\nSelf-Recursion,\
    \ Iteration Loop, and While Loop functions will almost always involve some data\
    \ collection, integer, or some number.\n\nParts of the For-Loop Function\n\nLet’s\
    \ observe a for-loop Function example in Pseudocode:\n\n// INPUT: an Integer\n\
    \n// OUTPUT: none\n\n// EFFECT: Given a positive integer, prints (input),\n\n\
    // then repeats and prints input - 1, then afterwards\n\n// prints “WE HAVE LIFT\
    \ OFF”\n\n// \\- Start: given input\n\n// \\- Continue: counting integer is >\
    \ 0\n\n// - Repeating Step: Repeat with input - 1\n\nvoid printCountdown(integer\
    \ input) {\n\n// this is the for-loop\n\n for (integer i = input; i > 0; input—)\
    \ {\n\n//this is the looped procedure\n\nprint(i);\n\n}\n\n// this occurs after\
    \ the for-loop ends\n\nprint(“WE HAVE LIFT OFF”)\n\n}\n\n(remember: this concept\
    \ will remain the same throughout many programming languages!)\n\nA for-loop function\
    \ will also have the main components of a regular function: possible inputs and\
    \ outputs, and an effect.\n\nIt will also have the three key components in an\
    \ iteration loop: the start value, the continuing condition, and the next step.\
    \ These describe how the loop will iterate and repeat a process.\n\nHow? The for-loop\
    \ will use a counting integer, set it to the start value, process the looped procedure,\
    \ then modify the counting integer. The for-loop will repeat the looped procedure\
    \ over and over until the counting integer is at a certain value - a point where\
    \ the continuing condition decides to stop.\n\nThe Iteration’s Start & Ends\n\n\
    First, use an integer and give it a starting value - say, zero.\n\nNext, define\
    \ what the integer value should be in order to continue repeating: the continuing\
    \ condition\n\n// \\- Start: 0\n\n// - Continue: counting integer < given input\n\
    \n…\n\n// this is the for-loop\n\nfor (integer i = 0; input > i; … ) {\n\nYou\
    \ can also have your iteration loop inversely; the starting value as some integer\
    \ and the continuing condition as the counting integer greater than 0.\n\n// \\\
    - Start: given input\n\n// - Continue: input is > 0\n\n…\n\n// this is the for-loop\n\
    \n for (integer i = input; i > 0; … ) {\n\nThe Iteration’s Next Step\n\nRegardless,\
    \ of what the start value and continuing condition should be, the next-step should\
    \ change the counting integer value. Increment or decrement the integer to inch\
    \ closer to disabling the continuing condition.\n\n// - Repeating Step: Repeat\
    \ with input - 1\n\n…\n\n// this is the for-loop\n\nfor ( … input—) {\n\nThis\
    \ is comparable to the self-reference function call in the previous chapter. The\
    \ for-loop will repeat the process within that loop, then change the counting\
    \ integer.\n\nIt then repeats until the counting integer eventually causes the\
    \ continuing condition to no longer repeat.\n\nDefining the Function, Inputs &\
    \ Outputs\n\nThe function input and output varies, depending on the situation.\
    \ However, the effect will remain consistent: the function will keep iterating\
    \ and producing its desired effect until it hits its base case limit.\n\nThere\
    \ are two commonly used versions, depending on how the iterating components are\
    \ configured.\n\n// Iterating Up\n\n// INPUT: \\_\\_\\_\\_\\_\n\n// OUTPUT: \\\
    _\\_\\_\\_\\_\n\n// EFFECT: \\_\\_\\_\\_\\_\n\n// \\- Start: 0\n\n// \\- Continue:\
    \ (set a limit) > counting integer\n\n// - Repeating Step: (counting integer +1)\n\
    \n// Iterating Down\n\n// INPUT: \\_\\_\\_\\_\\_\n\n// OUTPUT: \\_\\_\\_\\_\\\
    _\n\n// EFFECT: \\_\\_\\_\\_\\_\n\n// \\- Start: (set a starting value)\n\n//\
    \ \\- Continue: 0 < counting integer\n\n// - Repeating Step: (counting integer\
    \ -1)\n\nUsing the array below, here’s an example for each version, in pseudocode:\n\
    \n// an Array of Names (Strings)"
