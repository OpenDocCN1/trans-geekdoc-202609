    \ access or process each element in the list. The indices in the Array will help\
    \ your computer process the list faster, as well as give your computer multi-process\
    \ potential for that list. Also, use arrays if each item in the list needs an\
    \ index. For example, if you wanted to randomly get list items, you can only do\
    \ it in an array (in a linked list, how would the computer know what item to get?\
    \ Think about it…)\n\n**Bottom line:**\n- Linked Lists = any size, faster add/remove\n\
    - Arrays = fixed size, faster access/process\n\n#### Linked Lists v.s. Arrays:\
    \ Data Management\n\nIn general, if given the same data type to store in lists,\
    \ arrays take less memory/storage space than linked lists. You’ll find out about\
    \ this later, but linked lists generally need slightly more data in its structure\
    \ than arrays. However, in lists with very high number of items, this slight difference\
    \ is actually significant.\n\n### Chapter 12b: Linked Lists\n\nThe concept of\
    \ linked lists is actually very simple.\n\nThink of linked lists as a chain -\
    \ literally. In a linked list, each “link” in the chain will have its item, followed\
    \ by whatever “link” is next. If a certain link has no links next, then that link\
    \ is at the end of the chain - or rather, the end of the linked list.\n\nHere’s\
    \ an example of what a doubly linked list would look like:\n\n`[ID01] [item] [Prev:\
    \ NULL] [Next: ID03]`\n`[ID04] [item] [Prev: ID03] [Next: NULL]`\n`[ID03] [item]\
    \ [Prev: ID01] [Next: ID04]`\n\nThere are three “links” in the chain, with link\
    \ `ID04` being the last one. Why is `ID04` last? Easy - because there is no link\
    \ after it.\n\nAnd note how the IDs go from 01, then 04, and 03, and they’re not\
    \ in order. However, in linked lists, the numbers DO NOT tell you the order. I\
    \ REPEAT. The NUMBERS DO NOT tell you the order.\n\nIt’s because of one crucial\
    \ fact about how the ordering in linked lists are set up.\n"
  trans: "\n\n在大多数语言中，你可以使用这些运算符来比较整数（Integers）和数字（Numbers）。因此可以使用这些数据类型的变量，或者是返回这些类型的函数/方法。\n\
    \n### 比较运算符\n\n- 大于：`(your data) > \\_\\_\\_\\_`\n- 大于或等于：`(your data) >= \\_\\\
    _\\_\\_`\n- 小于：`(your data) < \\_\\_\\_\\_`\n- 小于或等于：`(your data) <= \\_\\_\\\
    _\\_`\n\n#### 等于运算符\n\n在两个值之间使用这些运算符，可以比较这两个值是否相等。\n\n- 等于：`(value1) == (value2)`\n\
    - 不等于：`(value1) != (value2)`\n\n在大多数语言中，`==` 和 `!=` 将一致地比较两个值的等相等性。\n\n#### 通用赋值运算符\n\
    \n这仅仅是使用等号（`=`）来分配数据。是的，你一直都在使用它！我们只是想保持简单，并一次添加一个步骤。\n\n为了确保万无一，它的设置方式如下：\n\n\
    `(第一个变量名) = (要更改第一个变量值的值或表达式)`\n\n#### 数学赋值运算符\n\n这些与通用赋值运算符类似（单个等号，`=`；你设置变量时使用的相同运算符！）。然而，在大多数语言中，你可以根据你使用的赋值运算符，使用右侧的值来修改左侧的值：\n\
    \n`(第一个变量名) (赋值运算符) (要更改第一个变量值的值)`\n\n本质上，在等号之前有一个额外的字符；这个字符将决定你的赋值运算符是什么操作。\n\
    \n在大多数编程语言中，这些赋值运算符是一致的：\n`%=`, `/=`, `//=`, `-=`, `+=`, `*=`, `**=` 赋值运算符\n\n\
    - 加到第一个值：`(第一个值) += (要相加的值)`\n- 乘以第一个值：`(第一个值) *= (要相乘的值)`\n- 除以第一个值：`(第一个值) /=\
    \ (要除以的值)`\n- 对第一个值取模：`(第一个值) %= (要除以的值，不留余数)`\n\n出于显而易见的原因，这些最适用于数值数据类型 - 例如整数和数字。当然，我们需要数字来进行数学运算！\n\
    \n## PHP-05: PHP 中的布尔运算符\n\n#### 逻辑运算符\n\n在 PHP 中，三个基础逻辑运算符如下：\n\n- 与（AND）：`and`\n\
    - 或（OR）：`or`\n- 非（NOT）：`!`（只是一个感感叹号）\n\n以下是几个 PHP 代码示例：\n\n```php\n<?php\n// 打印\
    \ False:\nif (True and False) print(\"True\" . \"\\n\");\nelse print(\"False\"\
    \ . \"\\n\");\n\n// 打印 False:\nif (True or False) print(\"True\" . \"\\n\");\n\
    \n// 打印 False:\nif (!True) print(\"True\" . \"\\n\");\nelse print(\"False\" .\
    \ \"\\n\");\n?>\n```\n\n#### 比较运算符\n\n在 PHP 中，使用了与伪代码相同的字符（`>`, `<`, 和 `=`）作为比较运算符。你可以尝试这些运算符。运行这些代码行：\n\
    \n```php\n<?php\n// 这些会打印四行的‘1’\nprint(17 > 15);\nprint(\"\\n\");\nprint(17 >=\
    \ 17);\nprint(\"\\n\");\nprint(12 < 15);\nprint(\"\\n\");\nprint(12 <= 12);\n\
    print(\"\\n\");\n\n// 这些什么都不会打印\nprint(0 > 15);\nprint(\"\\n\");\nprint(11 >=\
    \ 15);\nprint(\"\\n\");\nprint(100 < 15);\nprint(\"\\n\");\nprint(16 <= 15);\n\
    ?>\n```\n\n#### 等于运算符\n\n在 PHP 中，这些运算符与伪代码代码相同。尝试一下这些：\n\n```php\n<?php\n// 这些打印两行‘1’\n\
    print(\"xyz\" == \"xyz\");\nprint(\"aab\" != \"aaa\");\n?>\n```\n\n#### 数学赋值运算符\n\
    \n是的，与我们的运算符相同：\n\n```php\n<?php\n## 将 'a' 设置为整数 3\n$a = 3;\n\n## 这应该打印 66\n$a\
    \ = 3;\n$a += 3;\nprint($a);\n\n$a = 3;\n$a *= 2;\nprint($a);\nprint(\"\\n\");\n\
    \n## 这应该打印 111\n$a = 3;\n$a -= 2;\nprint($a);\n\n$a = 3;\n$a /= 3;\nprint($a);\n\
    \n$a = 3;\n$a %= 2;\nprint($a);\n?>\n```\n\n## PHP 工作坊 #4: 使用运算符\n\n首先，进入任一个 IDE。在线\
    \ IDE 包括 Rextester (`http://rextester.com`)、CodeChef (`http://www.codechef.com`)、CodePad\
    \ (`http://codepad.org`) 和 Ideone (`https://ideone.com/)。将以下内容（虚线之间）粘贴到你的 IDE\
    \ 中。然后用你喜欢的任何运算符填充空白。尽情尝试吧。\n\n记住返回布尔值的运算符与改变值的运算符之间的区别！\n\n```php\n// - - - -\
    \ - - - - - - - - - - - - - - - - - - - - - - -\n// 输入: 一个年龄 (Integer)\n// 输出:\
    \ 无\n// 效果: 根据年龄打印某些消息\n\nfunction ageLifeTeller($age) {\n    if ($age \\_\\_\
    \ 5) print \"Just a Baby\";\n    else if ($age \\_\\_ 5 and $age \\_\\_ 17) print\
    \ \"Just a School Kid\";\n    else print \"A Fully Responsible Adult!\";\n   \
    \ print \"\\n\";\n}\n\n$x \\_\\_ 4;\nageLifeTeller($x);\n$x \\_\\_ 16;\nageLifeTeller($x);\n\
    $x \\_\\_ 2;\nageLifeTeller($x);\n$x \\_\\_ 2;\nageLifeTeller($x);\n$x \\_\\_\
    \ 21;\nageLifeTeller($x);\n$x \\_\\_ 3;\nageLifeTeller($x);\n$x \\_\\_ 3;\nageLifeTeller($x);\n\
    // - - - - - - - - - - - - - - - - - - - - - - - - - - -\n```\n\n## 第四部分：列表 (Lists)\n\
    \n### 第 12 章：列表\n\n在某一点，计算机最终将有一组数据需要处理 - 无论是对象还是基础数据。因此我们有了列表。\n\n#### 通用列表\n\
    \n作为抽象数据类型，列表本质上是连接在一起的数据项。计算机通常会逐个遍历列表中的数据项。\n\n有两种通用列表：链表（linked lists）和数组（arrays）。大多数编程语言通常都会包含其中一种列表。\n\
    \n#### 链表 vs 数组：使用哪种列表？\n\n重要提示：大多数编程语言讽刺的地方在于它们**都**提供了数组和链表。但是，如果同事或老板问你用哪种呢？你看，有时做出这些微小的决定会影响应用的成败\
    \ - 有时甚至影响工作申请、职业和创业。\n\n通常，使用链表来快速添加和删除数据项，无论顺序如何。无论项是在列表开头、结尾还是中间，计算机添加/删除数据花费的时间和精力都是一样的。此外，如果你不知道列表有多大，链表更好。\n\
    \n通常，对于任何需要访问或处理列表每个元素的计算，使用数组。数组中的索引将帮助计算机更快地处理列表，并为该列表提供多处理潜力。此外，如果列表中的每个项都需要索引，请使用数组。例如，如果你想随机获取列表项，你可以在数组中这样做（在链表中，计算机如何知道获取哪一个项？思考一下……）。\n\
    \n**结论:**\n- 链表 = 任意大小，添加/删除更快\n- 数组 = 固定大小，访问/处理更快\n\n#### 链表 vs 数组：数据管理\n\n\
    通常，如果要在列表中存储相同的数据类型，数组占用的内存/存储空间比链表少。你以后会发现这一点，但链表在结构上通常比数组需要更多数据。然而，在项数很多的列表中，这种微小差异实际上是巨大的。\n\
    \n### 第 12 章：链表\n\n链表的概念其实非常简单。\n\n将链表看作一条链 - 字面意义上的。在链表中，链中的每个“环”都有其项，后面紧跟着下一个任何“环”。如果某个环没有后续的环，那么这个环就在链的末尾\
    \ - 或者说，在链表的末尾。\n\n这是一个双向链表看起来像样的示例：\n\n`[ID01] [item] [Prev: NULL] [Next: ID03]`\n\
    `[ID04] [item] [Prev: ID03] [Next: NULL]`\n`[ID03] [item] [Prev: ID01] [Next:\
    \ ID04]`\n\n"
