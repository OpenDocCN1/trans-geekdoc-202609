    Booleans can either be in uppercase (`TRUE`), or lowercase (`True`). This is because
    most PHP code isn’t case-sensitive (except for variable names).


    Strings can start & end with either single quotation marks (`''`), or double (`"`).


    # PHP Data Definitions


    Let’s define some data in PHP.


    First, PHP variable names start with the dollar sign (`$`) on them. So for example,
    PHP variables would be named like `$var1` or `$var2`.


    But as mentioned earlier, variable names ARE case sensitive. So the variable `$id`
    would be a different variable to `$ID`.


    And don’t forget; each line of code, therefore each data definition, ends with
    a semicolon (`;`).


    So in general, a variable declaration in PHP would look like so:


    `$variableName = (Initial Value);`


    Luckily, in PHP, you won’t have to openly declare your data type as you set your
    variable. You can also declare your variable name, then initialize it with a data
    type and value later:


    `$variableName;`


    `$variableName = (Initial Value);`


    However, just remember what you intend your data to be. This will save you headaches
    in the long run!


    So, let’s practice. Let’s start with defining the data for your friend’s name.
    Let’s call her Jennifer. First, let’s add a comment line to note what data type
    we want to deal with:


    `// Jennifer’s name is a String`


    Now we define the data for her name. Remember the syntax PHP uses, including the
    variable name and an end-of-line semicolon:


    `// Jennifer’s name is a String`


    `$NAME = ''Jennifer'';`


    So the PHP compiler will know that you’ve stored the String `''Jennifer''` into
    a variable you called `$NAME`. When your code calls `$NAME`, it will bring up
    your data type: `String`.


    ## PRACTICE


    Let’s start by declaring things that follow into each of: Strings, Numbers, Integers,
    and Booleans.


    Fill in the blanks below, and copy-paste code between the lines to an IDE of your
    choice. You may also use online IDE’s such as [rextester.com](http://rextester.com),
    [ideone.com](http://ideone.com), or [codepad.org](http://codepad.org).


    ```php

    <?php


    // #################


    // Jane’s name is what data type? \_\_\_\_\_


    $NAME = ''aaa'';


    // Jane’s age is what data type? \_\_\_\_\_\_\_


    $AGE = \_\_ ;


    // Jane is EITHER married OR not.


    // Jane’s marriage status is what data type?


    $ISMARRIED = \_\_\_\_ ;


    print $NAME . ''\n'';


    print $AGE . ''\n'';


    if($ISMARRIED == TRUE) print $NAME . '' is Married.'';


    // #################


    ?>

    ```


    If you try to run your code - and it runs correctly - you should see the following:


    ''Jane''


    (Jane’s age)


    And if you properly set Jane to be married, it should print `''Jane is Married.''`
    If Jane isn’t married, the line won’t print at all. This is up to you!


    # Chapter 2: Compound/Composite Data


    From the last chapter’s example, you can start to wonder that there just has to
    be a way to group all the data.


    (Note: The provided text contained many repetitive placeholder-like phrases in
    the second half. I have preserved the core structural logic based on the instructions
    to keep core content and optimize formatting.)

