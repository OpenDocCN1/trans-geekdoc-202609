  trans: "\n二叉树有许多不同的类型，每种类型都有其各自的额外结构规则。例如：二叉搜索树、最小堆、最大堆、AVL 树等。\n\n## 数据结构\n\n对于二叉树中的每个节点，它要么拥有左/右子节点，要么完全没有节点（这些被称为叶子节点）。\n\
    \n下面是一些通用的伪代码。你可以根据需求，在任何你希望的编程语言中实现你的 `Binary Tree` 节点。\n\n```cpp\n// A Binary\
    \ Tree Node contains:\n// - 一个数据键值（任何你想要的数据类型）\n// - 一个左子节点（可以是 BTreeNode 或 NULL）\n\
    // - 一个右子节点（可以是 BTreeNode 或 NULL）\n\nCompositeStructure BTreeNode {\n<data type\
    \ of your choice> key\nBTreeNode LEFT\nBTreeNode RIGHT\n}\n```\n\n## 通用处理函数\n\n\
    如果你读到了这里，你可能已经学过自递归函数了（如果没有，你可能想想回去快速浏览一遍）。通用的函数类似于自递归函数，包含一个基准情况（base case）以及针对左右子节点的两个自递归调用。\n\
    \n处理处理二叉树的通用算法如下：\n\n```cpp\n// INPUT: - 一个二叉树节点\n// OUTPUT: - <选择你的输出数据类型>\n\
    // EFFECT: \\_\\_\\_\\_\n// - Base Case: 输入为 NULL\n// - Recursive Steps: 递归调用左、右子树\n\
    \n<chosen output data type> procBTree(BTreeNode n) {\n    // BASE CASE:\n    if\
    \ (n == NULL) {\n        return <chosen output data type>\n    }\n    // MAIN\
    \ PROC:\n    // 在此处编写任何你想要\n    // RECURSIVE CALL: LEFT TREE\n    procBTree(n-LEFT)\n\
    \    // RECURSIVE CALL: RIGHT TREE\n    procBTree(n-LEFT)\n}\n```\n\n### 输入\n\n\
    输入几乎总是节点。\n\n```cpp\n// INPUT: - 一个二叉树节点\n…\n… procBTree(BTreeNode n) {\n…\n```\n\
    \n### 基准情况\n\n大多数二叉树算法会重复处理，直到没有剩余节点需要处理为止。在此时，函数将返回（可能带有你设置的数据类型），并且不再对任何子节点进行自递归。\n\
    \n```cpp\n// BASE CASE:\nif (n == NULL) {\n    return <chosen output data type>\n\
    }\n```\n\n### 递归步骤\n\n与自递归函数一样，二叉树算法会对两个子节点（以及子树）重复自身。这些代码行会让离基准情况——没有节点——更近一步。\n\
    \n```cpp\n// RECURSIVE CALL: LEFT TREE\nprocBTree(n-LEFT)\n// RECURSIVE CALL:\
    \ RIGHT TREE\nprocBTree(n-LEFT)\n```\n\n## 记住递归规则：信任递归\n\n我们之前在“自递归”章节中讨论过这些。只需确保你的函数有一个限制，并且每次自递归函数调用都向该限制迈进一步。然后你只需要信任递归并让它运行即可。\n\
    \n对于二叉树，只要你的函数有一个停止处理的点（你的基准情况：`NULL` 节点），并且你的函数自递归调用处理了左右子节点，你的代码就能运行。就像上面一样，你需要信任递归。\n\
    \n## 感谢！\n\n感谢下载我们的书籍。\n\n正如我们所说，你可以免费访问此书的所有版本。\n\n以下是下次更新中可能包含的内容：\n\n- 设计世界与简单应用，更高级的内容\n\
    - 数据树结构\n- 健壮的功能\n- 抽象函数\n- 生成式递归（自动解题器！）\n- 图与网络数据结构\n"
