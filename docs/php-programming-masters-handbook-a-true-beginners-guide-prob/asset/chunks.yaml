    \ with and if/how that data would or would not change. Experienced programmers\
    \ can then check if a particular data structure or function is designed the way\
    \ it was intended to be.\n\nTo guide you through this process, we’ll describe\
    \ the classic Snake game - and identify plenty of details about the game from\
    \ a programmer’s standpoint. It will be as if we’re designing the game for the\
    \ first time. As if we’re in the 70’s.\n\n### Identifying the FACTS\n\nFirst,\
    \ you need the facts. You need to describe what your idea is about, what’s involved,\
    \ etc. Describe as much detail as you can, including the environment and key figures\
    \ you provide.\n\n#### Example:\n\nIn a single game of Snake, there exists a snake\
    \ with a head and body, as well as food items that appear randomly. The snake’s\
    \ head, all segments of its body, and the food pieces have an `X-Y coordinate`\
    \ and a visual representation (since they have similar traits, they can be grouped\
    \ together as a game sprite). An `X-Y coordinate` represents a location within\
    \ the playable zone: a rectangular area with a height and width. A score keeps\
    \ track of how many food items have been eaten.\n\nThe player changes which direction\
    \ the snake will travel to: up, down, left, and right. The game ends when the\
    \ snake either hits a wall or runs into one of its body segments.\n\nThe snake\
    \ grows by one body segment after the snake head “eats a food item” (appears on\
    \ the same coordinate as a food item).\n\n```\n[food] + [head] [body] [body]\n\
    =\n[head] [body] [body] [body]\n```\n\n### Identifying what’s CONSTANT\n\nSecond,\
    \ you need to identify what elements in your world or app remain consistent throughout\
    \ the programming. Also, identify what will exist in your idea unconditionally.\n\
    \n#### Example:\n\nThe food items, snake head, and body segments have consistent\
    \ images.\n\nThe playing board has a fixed width and height.\n\n### Identifying\
    \ what CHANGES/VARIES\n\nThird, identify what will change or vary when the program\
    \ runs.\n\n#### Example:\n\nThe food items, snake head, and body segments all\
    \ have varying `X-Y coordinates` throughout the game. The number of body segments\
    \ vary, from the initial number of 2, all the way to as much as possible.\n\n\
    ## Turning your ideas into code\n\nNow, you take note of all the facts, descriptions,\
    \ and ideas you’ve come up with. You’ll be making data representations of them.\n\
    \nEarly in the book, there is a great reason why we’ve used comments to describe\
    \ all the information we are going to create. It’s because they help select the\
    \ best possible data representation for each pint of information you have. And\
    \ after you’ve described what your app or world will be about, you’ll start developing\
    \ that digital world first by using comments.\n\n#### Example:\n\nFor each fact\
    \ and idea about the Snake game that we’ve come up with, we’ll use comments to\
    \ hint how they should be represented by data.\n\n```\n// A Game Sprite has:\n\
    // - an X-coordinate (Integer)\n// - a Y-coordinate (Integer)\n// - an image to\
    \ represent itself (choose your visual representation)\n\n// Snake Heads, Snake\
    \ Body Segments, and Food Pieces\n// are each represented by Game Sprites\n\n\
    // An EntireSnake contains:\n// - a Snake Head (GameSprite)\n// - a list of Snake\
    \ Body Segments (list of GameSprites)\n\n// A FullSnake can:\n// - eat food\n\
    // - grow\n// - move on the board\n\n// The Playable Board has:\n// - a fixed\
    \ length (Integer)\n// - a fixed width (Integer)\n\n// A Game of Snake has:\n\
    // - a playable board (Playable Board Class)\n// - food items (list of Food)\n\
    // - the Snake (EntireSnake)\n// - a Score Count (Integer)\n\n// A Game of Snake\
    \ can:\n// - start a new game\n// - end the game (as a loss or win)\n// - update\
    \ a game in progress\n// - update the score\n// - move the snake on keypresses\n\
    // - create or delete food items\n```\n\nNotice how there is no actual code written\
    \ yet; only comments. The beauty of this process is that, given the facts and\
    \ ideas (as well as their data representations), we can start creating the code\
    \ in any language we want. We now know what will be data structures, classes,\
    \ integers, and so on.\n\nWe do need to go over more tools, so we will continue\
    \ with design later on.\n\nMeanwhile, in the next big workshop, you will be converting\
    \ idea comments into actual code. Good luck and have fun!\n\n## PHP Workshop\n\
    \n### Game Design: Data & Functions\n\nFirst, go to an IDE of your choice. Online\
