    \ 也是如此。\n\n本质上，`while-loop` 函数几乎总是涉及某些数据收集、整数或某些数字。它需要这些数据来判断重复条件。数据将被检查，重复条件将返回\
    \ TRUE 或 FALSE —— 因此，要么重复代码，要么继续执行。\n\n从比喻上来说，`while-loop` 几乎总是自递归函数。\n\n只需确保你的\
