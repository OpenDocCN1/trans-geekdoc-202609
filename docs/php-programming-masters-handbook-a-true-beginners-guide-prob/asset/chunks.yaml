- raw: "“The Ordering of a Linked List is this: The very first node (no nodes before\
    \ it), then its next one, then the next one, and so on - until there’s a node\
    \ with nothing after it.”\n\nBuilding Linked Lists From Scratch:\n\nIf you ever\
    \ had to design a linked list from scratch, the concept is simple. A single link\
    \ in a linked list consists of the actual data, then the ID of whatever the next\
    \ or previous nodes are. Singly linked list nodes only point to the next node,\
    \ while Doubly Linked List nodes point to both next and previous nodes.\n\nIn\
    \ our pseudocode below, there are four key fields in a doubly linked list node:\
    \ the ID, the previous node’s ID, the next node’s ID, and the actual data item.\n\
    \n// Abstract Data Type: Linked List\n\n// Each element in the Linked List is\
    \ represented by a Node.\n\n// A Node has:\n\n// - an ID (String)\n\n// - the\
    \ ID of the Previous Node (String)\n\n// - the ID of the Next Node (String)\n\n\
    // - the Data Item (choose what data type you want)\n\nCompositeStructure Node\
    \ {\n\nString ID\n\nString PREVID\n\nString NEXTID\n\n(choose a data type) ITEM\n\
    \n}\n\nUsually, you can only use one data type per each linked list. The reason\
    \ is simply how the computer system itself processes and organizes data (you’ll\
    \ learn more about this if you know how Computer Systems themselves work).\n\n\
    Chapter 12c: Arrays\n\nIf you look up the word ‘array’ in the dictionary, you’ll\
    \ find out that it’s an elaborate, and sometimes beautiful, arrangement of items\
    \ in a particular order.\n\nEmphasize the phrase “arrangement of items in a particular\
    \ order”.\n\nAnd in programming, you now know the key point of Arrays - they’re\
    \ a list of data items sorted in a particular order.\n\nHere’s an example of what\
    \ an array with a size of 5 would look like visually:\n\n\\[ 0 \\]\\[item A\\\
    ]\n\n\\[ 1 \\]\\[item B\\]\n\n\\[ 2 \\]\\[ NULL \\]\n\n\\[ 3 \\]\\[item D\\]\n\
    \n\\[ 4 \\]\\[ NULL \\]\n\nHere, you can see how quickly and easily you can add\
    \ or get data items from an array. If you know the index where you stored your\
    \ data, just access the array, the index, then the data is yours.\n\nAlso, arrays\
    \ sizes are usually fixed. In some programming languages, there are also Dynamic\
    \ or Variable-Size Arrays. But depending on how the programming language works,\
    \ the data items are usually re-added into arrays that have as much room as the\
    \ number of items.\n\nQuick Note: Why is Zero first?\n\nIn Computer Science, data\
    \ is counted from zero first. Meaning, 0 will be the first thing, 1 will be the\
    \ second, 2 will be the third, and so on. \n\nIf it sounds confusing to you, just\
    \ keep in mind that if you had to count within computer terms, have the i-th position\
    \ in mind, minus one.\n\nSo if we had an array of 10 items, the very first item\
    \ in the array would be in Index 0 (1st - 1) and the very last item in the list\
    \ would be Index n - 1 (meaning, the size of your array, minus one.\n\nBuilding\
    \ Arrays From Scratch:\n\nIf you ever had to design a data array from scratch,\
    \ the concept is simple too. But unlike linked lists, there aren’t any individual\
    \ nodes. Building an array requires two main things: the length or size of the\
    \ array and the data type you want to store in it.\n\nMost programming languages\
    \ should be able to support simple arrays. In pseudocode, we create an array like\
    \ so:\n\n// Abstract Data Type: Array\n\n// An Array has:\n\n// - an Array Size\n\
    \n// - the Type of Data Item to Store (choose what data type you want)\n\n(choose\
    \ a data type) ArrayName\\[ArraySize\\]\n\nAnd just like linked lists, you can\
    \ only use one data type per each array. Unlike linked lists, however, arrays\
    \ are strict about having only one data type per array. The reason for this is\
    \ how the computer assigns data memory/storage for that array. Having one data\
    \ type per each array makes the array much more structured and easy to access.\n\
    \nPHP-06: Linked Lists & Arrays in PHP\n\nCreating Arrays \n\nArrays in PHP are\
    \ declared in the following format:\n\n$<Variable Name> = array( <# of items in\
    \ array> );\n\nTo set up an array in PHP, use the line of code above. Then choose\
    \ your variable name,and how many item objects you want in the array.\n\nHere’s\
    \ an example. I’m declaring an array named ‘intArray’. It will also have 10 elements\
    \ in it:\n\n$intArray = array(10);\n\nAccessing Array Items\n\nYou can access\
    \ data objects within an array by calling the variable name, followed by its index\
    \ (position within the array) as an integer within brackets:\n\n$<Variable Name>\\\
    [<index of array data object>\\];\n\nRemember: don’t forget the Dollar Sign!\n\
    \nFor example, if you wanted to access the third item in intArray, you would use\
    \ this expression:\n\n… = $intArray\\[2\\]\n\nBut why 2 and not 3?\n\nBecause,\
    \ remember, in Computer Science, data is counted from zero first!\n\nNote on PHP\
    \ Arrays:\n\nArrays in PHP can also be maps - meaning, elements within PHP arrays\
    \ can also be accessed using ‘keys’ as well as indexes.\n\nTo do this, you can\
    \ set up your array as so:\n\n$<Variable Name> = array(\n\n<key 1> => <value 1>,\n\
    \n<key 2> => <value 2>,\n\n<key 3> => <value 3>,\n\n…\n\n<key n> => <value n>,\n\
    \n);\n\nThe keys can be any atomic data type, such as strings, integers, and even\
    \ booleans.\n\nHere’s an example of the previous array - as a PHP mapped array:\n\
    \n$intArray = array(\n\n'ONE' => 'aaa',\n\ntrue => 'bbb',\n\n3 => 'ccc',\n\n);\n\
    \nAnd to access any value within a mapped array, it’s quite similar to accessing\
    \ a regular array - except that you would put the Key instead of the Index:\n\n\
    … $intArray\\['ONE'\\];\n\nCreating Linked Lists from Scratch\n\nThis can be a\
    \ little more tricky than usual, as you’ll usually need to design a single node\
    \ first.\n\nJust remember what a Linked List node essentially consists of. For\
    \ Singly Linked Lists, you’ll need its contained data item and what the next node\
    \ will be.\n\nHere’s the comments to design it:\n\n// Abstract Data Type: Linked\
    \ List, Singly\n\n// Each element in the Linked List is represented by a Node.\n\
    \n// A Node has:\n\n// - the Data Item (choose what data type you want)\n\n//\
    \ - the Next Node (Node Object)\n\nAs for Doubly Linked Lists, you’ll need the\
    \ data item, as well as the previous and next nodes:\n\n// Abstract Data Type:\
    \ Linked List, Doubly\n\n// Each element in the Linked List is represented by\
    \ a Node.\n\n// A Node has:\n\n// - the Data Item (choose what data type you want)\n\
    \n// - the Previous Node (Node Object)\n\n// - the Next Node (Node Object)\n\n\
    Chapter 13: Self-Reference Recursion\n\nSelf-Reference recursion - self-recursion\
    \ for short - is one of the most important concepts in Computer Programming.\n\
    \nThe main idea behind Self-Recursion is this: given some initial input, a self-recursive\
    \ function will process an effect, then continue to repeat processing that effect\
    \ with a reduced or augmented version of that input. The function will continue\
    \ repeating its process - until the input is at a certain state that causes the\
    \ function to stop repeating.\n\nSelf-reference is a key procedure in processing\
    \ collections of data items. Given, a self-recursive function will repeat its\
    \ procedure for each data item in the collection. The function will keep repeating\
    \ until either there are no more data items left to process, or the function has\
    \ encountered its intended solution.\n\nThis concept is seen throughout simple\
    \ and advanced programming - including algorithms, auto-generating data, and more.\n\
    \nParts of the Self-Recursive Function\n\nLet’s observe a Self-Recursive Function\
    \ example in Pseudocode:\n\n// INPUT: an Integer\n\n// OUTPUT: none\n\n// EFFECT:\
    \ Given a positive integer, prints 10^(input),\n\n// then repeats with input -\
    \ 1 until it prints just 10\n\n// \\- Base Case: input is <= 0\n\n// - Recursive\
    \ Step: Repeat with input - 1\n\nvoid printPowerTen(integer i) {\n\n//Base Case:\n\
    \nif (i <=0) return;\n\n // Recursive Step:\n\nprint 10 ^ i;\n\nprintPowerTen(i\
    \ - 1); // this is the self-reference\n\n}\n\n(remember: this concept will remain\
    \ the same throughout many programming languages!)\n\nA Self-Recursion function\
    \ will have the main components of a regular function: possible inputs and outputs,\
    \ and an effect.\n\nIt will also have two additional components: a Base Case and\
    \ a Recursive Step."
