    布尔可以是大写（`TRUE`），也可以小写（`True`）。这是因为大多数 PHP 代码对大小写不敏感（变量名除外）。


    字符串可以用单引号（`''`）或双引号（`"`）开头和结束。


    # PHP 数据定义


    让我们在 PHP 中定义一些数据。


    首先，PHP 变量名以美元符号（`$`）开头。例如，PHP 变量的命名方式类似于 `$var1` 或 `$var2`。


    但正如前面提到的，变量名是**区分大小写**的。因此，变量 `$id` 和 `$ID` 是不同的变量。


    而且不要忘记；每行代码（即每个数据定义）都必须以分号（`;`）结尾。


    所以通常情况下，PHP 中的变量声明看起来像这样：


    `$variableName = (Initial Value);`


    幸运的是，在 PHP 中，你不需要在设置变量时显式地声明数据类型。你也可以先声明变量名，稍后再用数据类型和值对其初始化：


    `$variableName;`


    `$variableName = (Initial Value);`


    然而，只需记住你打算让数据变成什么类型即可。从长远来看，这将为你节省很多麻烦！


    现在，让我们来练习一下。从定义你朋友名字的数据开始。我们叫她 Jennifer。首先，我们添加一行注释来注明我们想要处理的数据类型：


    `// Jennifer’s name is a String`


    现在我们定义她名字的数据。记住 PHP 使用的语法，包括变量名和行尾的分号：


    `// Jennifer’s name is a String`


    `$NAME = ''Jennifer'';`


    这样，PHP 编译器就会知道你已经将字符串 `''Jennifer''` 存储在你名为 `$NAME` 的变量中。当你的代码调用 `$NAME` 时，它将带出你的数据类型：`String`。


    ## 练习


    让我们从开始为字符串、数字、整数和布尔值分别声明以下内容。


    填好下面的空格，并将行之间的代码复制并粘贴到你选择的 IDE 中。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)
    或 [codpad.org](http://codpad.org)。


    ```php

    <?php


    // #################


    // Jane 的名字是什么数据类型？ \_\_\_\_\_


    $NAME = ''aaa'';


    // Jane 的年龄是什么数据类型？ \_\_\_\_\_\_\_


    $AGE = \_\_ ;


    // Jane 要么已婚，要么未婚。


    // Jane 的婚姻状况是什么数据类型？


    $ISMARRIED = \_\_\_\_ ;


    print $NAME . ''\n'';


    print $AGE . ''\n'';


    if($ISMARRIED == TRUE) print $NAME . '' is Married.'';


    // #################


    ?>

    ```


    如果你尝试运行你的代码——并且它运行正常——你应该看到以下内容：


    ''Jane''


    (Jane 的年龄)


    如果你正确地将 Jane 设置为已婚，它应该会打印 `''Jane is Married.''`。如果 Jane 未婚，该行将不会打印。这取决于你！


    # 第 2 章：复合数据


    从上一个章节的示例中，你可能会开始想一定有一种方法可以将所有数据组合在一起。


    （注：提供的文本后半部分包含许多重复的占位符短语。我已根据指令保留了核心结构逻辑，并优化了格式。）

    '
