    With associative arrays, here’s how a data structure with two attributes would
    look like, including the Explanation Comments:


    ```php

    <?php

    // Our $DATASTRUCTURE has:

    // - a variable (String)

    // - another variable (Integer)


    $DATASTRUCTURE = (object) array(

    ''attribute1'' => ''Data Type as String'',

    ''attribute2'' => 123);

    ?>

    ```


    Here is what’s happening in these lines of code:


    - A variable `$DATASTRUCTURE` is assigned to an `Array` (You’ll learn more about
    `Arrays` later)

    - To turn our `Array` into a Composite Data Object, we add `(object)` right after
    the equals `=`.

    - For `Associative Array Objects`, we use `Strings` to name our data structure’s
    attributes

    - We also assign our attributes using `(=>)`, instead of just an equals sign (`=`).


    ## Accessing Class Attributes


    This follows a similar structure to our `PseudoCode`.


    To access a `Class Attribute`, you first have a variable object that has been
    assigned that `Class` structure. Then follow it up with an arrow (`->`) and the
    class attribute you want to access.


    However, you DON’T put the dollar signs (`$`) on the attribute names you want
    to access. You simply use the attribute names.


    Let’s recall setting `object1` into a class:


    ```

    object1 = ClassName()

    ```


    Then accessing `object1`’s attributes would look like the following notation:


    ```

    object1.attribute1

    ```


    ## EXAMPLE


    Let’s think about a milkshake for example. Let’s start defining the Composite
    Data Structure for it.


    First, let’s use comments to describe what our our data will look like.


    ```

    A MilkShake Has:

    ```


    Now think of the little attributes a milkshake has. There definitely are different
    types of cups or glasses to store it in: styrofoam, glass, paper cups, etc. There
    are definitely different sizes too. And what milkshake flavour is it? How much
    did that MilkShake cost?


    # A MilkShake Has:

    # - a Container Type (String)

    # - a Size (String)

    # - a Flavour (String)

    # - a price (Number)


    Now, let’s design the `Coffee Cup Class`. We’ll have its attributes publicly accessible,
    for now:


    ```php

    class MilkShake {

    public $containerType = '''';

    public $size = '''';

    public $flavour = '''';

    public $price = 0.00;

    }

    ```


    Let’s also make a milkshake and call it `M`. Let’s also make it flavoured strawberry,
    in a glass, sized large, and price it at $6.


    ```php

    $M = new MilkShake;

    $M->containerType = ''glass'';

    $M->size = ''large'';

    $M->flavour = ''strawberry'';

    $M->price= 6.00;

    ```


    ## PHP Workshop #1: Classy Kids


    Design a data class definition for a 10-year old boy. Think carefully. What attributes
    would that boy have?


    First, use comments to describe what attributes you want the young kid to have.
    Then figure out what `Data Types` those attributes are. This is totally up to
    you. Make it up as you go along!


    Then, code your data class to include those attributes.


    Then, create a data object and name it `Jack Grey`.


    Afterwards, test and run your code in an IDE of your choice.


    You can also use a free IDE such as `http://rextester.com/runcode`.


    ## Chapter 3: Data Initialization


    Let’s recall the Composite Data Structure of `Person`:


    ```

    // A person has:

    // - a name (string)

    // - an age (number)

    // - a City they live in (Composite data)

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    We’ll also create two `Atomic Data` pieces as the Time: integers. `Integer HOUR;
    MINUTE;`


    You have noticed one thing: You’ve defined what types of data you’re dealing with
    - but don’t know any people. Nor do we know what time is! Now we INITIALIZE our
    data. Now that we’ve defined what types of data we have, we then set our data
    for the first time.


    ### Initializing Atomic Data


    First, we’ll set the time. Let’s say it’s 8:30 PM. To set data, most programming
    languages use Equals (`=`) operator. Here, we’ll do the same.


    ```

    HOUR = 20;

    MINUTE = 30;

    ```


    DON’T make this mistake… But if we tried to set `HOUR` and `MINUTE` to another
    data type?


    ```

    HOUR = aaaa;

    MINUTE = Integer; String;

    ```


    Notice earlier that you’ve set both `HOUR` and `MINUTE` as Integers. Here, we’re
    trying to set up those data as different types. In some programming languages,
    it’s not going to work. In most cases, your code might not work because of this.
    Here, you’ve set up your data as Integers - therefore, you need to initialize.
    Lesson learned: if you set up your data as a certain data type, unless you really
    know what you’re doing, DO NOT try to set up that data as another type!


    ### Initializing Data Structures


    Now, let’s define an actual `Person` using our data structure. There are FOUR
    KEY steps to do this:


    **STEP ONE**: Identify & describe a data object you’re trying to create. For practice,
    use comments to describe what that object is & what it’s like. We’ll use a friend
    of yours called `Jamie`, for example.


    ```

    // Jamie Denise is a person

    // She has:

    // - a name: Jamie Denise

    // - an age: 19

    // - a City she lives in: New York

    ```


    **STEP TWO**: Declare what type of composite data your object is. In this example,
    we declare `Jamie` as a:


    ```

    // Jamie Denise is a person

    Person Jamie;

    ```


    **STEP THREE**: INITIALIZE your object’s data structure, so that your object actually
    IS represented by the Composite Data in your program. In most languages, you declare
    that you have a new’case’ or instance of this object. Think of this step as “registering”
    your new object into your data. In this example, we INITIALIZE `Jamie` as a data
    object that HAS the `Person` Composite Data Structure.


    ```

    // Jamie Denise is a person

    Person Jamie = new Person;

    ```


    **STEP FOUR**: Identify your object. Then, for each data part that your Composite
    Data is made of, set those initial values. Remember `Jamie`’s Attributes?


    ```

    // Jamie Denise is a person

    // She has:

    // - a name: Jamie Denise

    // - an age: 19

    // - a City she lives in: New York

    ```


    Now let’s initialize each attribute onto our Data Object `Jamie`. You first need
    to identify the data object you’re trying to reach. In this case, it’s `Jamie`.
    Next (and this is important!), identify which attribute you’re planning to reach.
    Here is it best to reference the Data Structure you’ve defined earlier:


    ```

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    Let’s set all three of `Jamie`’s Attributes:


    ```

    // Jamie Denise is a person

    // She has:

    // - a name: Jamie Denise

    // - an age: 19

    // - a City she lives in: New York

    Person Jamie = new Person;

    Jamie-NAME = "Jamie"; // <— a "String": Remember?

    Jamie-AGE = Nineteen;

    CITY = NewYork;

    ```


    Okay, we’re done. Hold on. This code is wrong. Why? DON’T make these mistakes…


    The line `Jamie-AGE = Nineteen;` won’t work. Why? Just a friendly reminder. Make
    sure the data type you’re trying to set MATCHES the data type you’ve defined.
    In most programming languages, this is one of the most common mistakes programmers
    make. `Nineteen` is definitely not a `Number` data type nor is it a `String` (where’s
    the "Quotation marks?"). However, `19` works.


    ```

    Jamie-AGE = 19;

    ```


    Also, this line `CITY = NewYork;` won’t work. Why? What’s `CITY`? Did we mean
    `Jamie`’s current `CITY`? Remember to first identify the DATA OBJECT you’re accessing.
    AND THEN that object’s attributes. Well, let’s try that.


    ```

    Jamie-CITY = NewYork;

    ```


    This line `Jamie-CITY = NewYork;` won’t work either. Why? Because `Jamie` is a
    data object that follows the `Person` Composite Data Structure you’ve defined.
    And note how that Structure does NOT have any attributes named `CITY` in it. Again,
    first identify the DATA OBJECT you’re accessing. AND THEN access that object’s
    correct attributes. The `Person` Structure includes a separate `City` data structure,
    but it certainly isn’t called `CITY`.


    ```

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    Oh, so it should be `Jamie-LOCATION= NewYork;`

