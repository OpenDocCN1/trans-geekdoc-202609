    使用关联数组，这里是具有两个属性的数据结构看起来的样子，包括解释注释：


    ```php

    <?php

    // 我们的 $DATASTRUCTURE 包含：

    // - 一个变量 (String)

    // - 另一个变量 (Integer)


    $DATASTRUCTURE = (object) array(

    ''attribute1'' => ''Data Type as String'',

    ''attribute2'' => 123);

    ?>

    ```


    以下是这些代码行的作用：


    - 将变量 `$DATASTRUCTURE` 赋值为一个 `Array`（你稍后会学习更多关于 `Arrays` 的知识）。

    - 为了将我们的 `Array` 转换为复合数据对象，我们在 `=` 之后添加了 `(object)`。

    - 对于 `Associative Array Objects`，我们使用 `Strings` 来命名数据结构的属性。

    - 我们还使用 `(=>)` 来分配属性，而不仅仅是等号 (`=`)。


    ## 访问类属性


    这与我们的 `PseudoCode` 结构相似。


    要访问一个 `Class Attribute`，你首先需要一个被分配了该 `Class` 结构的变量对象。然后紧跟一个箭头 (`->`) 和你想访问的类属性。


    但是，你**不需要**在你想要访问的属性名称加上美元符号 (`$`)。你只需使用属性名称即可。


    让我们回想将 `object1` 设置为类：


    ```

    object1 = ClassName()

    ```


    然后访问 `object1` 的属性将显示如下表示法：


    ```

    object1.attribute1

    ```


    ## 示例


    让我们以奶昔为例。让我们开始为它定义一个复合数据结构。


    首先，让我们用注释来描述我们的数据看起来是什么样的。


    ```

    奶昔具有：

    ```


    现在想一想奶昔具有的小属性。它肯定有不同类型的杯子或玻璃杯来盛放：泡沫塑料、玻璃、纸杯等。肯定也有不同的尺寸。它是什么口味的奶昔？这个奶昔花了多少钱？


    # 奶昔具有：

    # - 一个容器类型 (String)

    # - 一个尺寸 (String)

    # - 一个口味 (String)

    # - 一个价格 (Number)


    现在，让我们来设计 `Coffee Cup Class`（咖啡杯类）。目前，我们将它的属性设置为公开可访问：


    ```php

    class MilkShake {

    public $containerType = '''';

    public $size = '''';

    public $flavour = '''';

    public $price = 0.00;

    }

    ```


    让我们也做一个奶昔并将其命名为 `M`。让我们让它是草莓味的，装在玻璃杯里，大号，定价为 6 美元。


    ```php

    $M = new MilkShake;

    $M->containerType = ''glass'';

    $M->size = ''large'';

    $M->flavour = ''strawberry'';

    $M->price= 6.00;

    ```


    ## PHP 工作坊 #1：潮流小子


    为一个 10 岁的男孩设计一个数据类定义。仔细思考。那个男孩会有哪些属性？


    首先，使用注释描述你希望这个小孩子拥有哪些属性。然后确定这些属性是什么 `Data Types`。这完全取决于你。随过程中构思即可！


    然后，编写你的数据类以包含这些属性。


    然后，创建一个数据对象并命名为 `Jack Grey`。


    之后，在你选择的 IDE 中测试并运行你的代码。


    你也可以使用免费的 IDE，例如 `http://rextester.com/runcode`。


    ## 第 3 章：数据初始化


    让我们回想 `Person` 的复合数据结构：


    ```

    // 一个人拥有：

    // - 一个名字 (string)

    // - 一个年龄 (number)

    // - 他们居住的城市 (复合数据)

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    我们还将创建两个 `Atomic Data` 部分作为时间：整数。`Integer HOUR; MINUTE;`


    你注意到了一点：你定义了你正在处理什么类型的数据——但你不认识任何人。我们也不知道现在是什么时间！现在我们要**初始化**我们的数据。既然我们已经定义了拥有什么类型的数据，现在第一次设置我们的数据。


    ### 初始化原子数据


    首先，我们将设置时间。假设是晚上 8:30。为了设置数据，大多数编程语言使用等号 (`=`) 运算符。在这里，我们将这样做。


    ```

    HOUR = 20;

    MINUTE = 30;

    ```


    **不要**犯这种错误……但是，如果我们尝试将 `HOUR` 和 `MINUTE` 设置为另一种数据类型呢？


    ```

    HOUR = aaaa;

    MINUTE = Integer; String;

    ```


    注意之前你已经将 `HOUR` 和 `MINUTE` 都设置为了整数。在这里，我们正尝试将这些数据设置为不同的类型。在某些编程语言中，这是不起作用的。在大多数情况下，你的代码可能会因为此无法运行。在这里，你将数据设置为了整数——因此，你需要初始化。教训：如果你将数据设置为了某种数据类型，除非你真的知道自己在做什么，否则**不要**尝试将该数据设为另一种类型！


    ### 初始化数据结构


    现在，让我们使用我们的数据结构定义一个真实的 `Person`。执行此操作有四个四个关键步骤：


    **第一步**：识别并描述你尝试创建的数据对象。为了练习，使用注释描述该对象是什么以及什么样子。我们以你的一个叫 `Jamie` 的朋友为例。


    ```

    // Jamie Denise 是一个人人

    // 她拥有：

    // - 一个名字: Jamie Denise

    // - 一个年龄: 19

    // - 她居住的城市: 纽约

    ```


    **第二步**：声明你的对象是什么类型的复合数据。在这个例子中，我们将 `Jamie` 声明为：


    ```

    // Jamie Denise 是一个人人

    Person Jamie;

    ```


    **第三步**：**初始化**你的对象的数据结构，以便你的对象在程序中确实由复合数据表示。在大多数语言中，你声明你有一个此对象的新“用例”或实例。将这一步想为将你的新对象“注册”到你的数据中。在这个例子中，我们将
    `Jamie` **初始化**为一个拥有 `Person` 复合数据结构的数据对象。


    ```

    // Jamie Denise 是一个人人

    Person Jamie = new Person;

    ```


    **第四步**：识别你的对象。然后，对于你的复合数据所组成的每个数据部分，设置这些初始值。记得 `Jamie` 的属性吗？


    ```

    // Jamie Denise 是一个人人

    // 她拥有：

    // - 一个名字: Jamie Denise

    // - 一个年龄: 19

    // - 她居住的城市: 纽约

    ```


    现在识别你的对象。然后，对于你的复合数据所组成的每个数据部分，设置这些初始值。首先我们要访问的对象是 `Jamie`。这里最好引用你之前定义的结构：


    ```

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    让我们设置 `Jamie` 的三个属性：


    ```

    // Jamie Denise 是一个人人

    // 她拥有：

    // - 一个名字: Jamie Denise

    // - 一个年龄: 19

    // - 她居住的城市: 纽约

    Person Jamie = new Person;

    Jamie-NAME = "Jamie"; // <— 一个 "String": 记得吗？

    Jamie-AGE = Nineteen;

    CITY = NewYork;

    ```


    好了，我们完成了。等一下。这段代码是错误的。为什么？**不要**犯这些错误……


    `Jamie-AGE = Nineteen;` 不行。为什么？只是友好的提醒。确保你尝试设置的数据类型与你定义的类型匹配。在大多数编程语言中，这是程序员犯的最常见错误之一。`Nineteen`
    绝对不是 `Number` 数据类型，也不是 `String`（引号在哪里？）。然而，`19` 可以的。


    ```

    Jamie-AGE = 19;

    ```


    另外，这一行 `CITY = NewYork;` 不行。为什么？`CITY` 是什么？我们指的是 `Jamie` 的 `CITY` 吗？记住首先识别你要访问的数据对象。然后访问该对象的属性。好吧，让我们试试。


    ```

    Jamie-CITY = NewYork;

    ```


    这行 `Jamie-CITY = NewYork;` 行。为什么？因为 `Jamie` 是一个遵循你定义的 `Person` 复合数据结构的数据对象。并注意该结构中**没有**名为
    `CITY` 的属性。再次，首先识别你要访问的数据对象。然后访问该对象的正确属性。`Person` 结构包含一个单独的 `City` 数据结构，但它显然不叫
    `CITY`。


    ```

    CompositeStructure PERSON {

    String NAME;

    Number AGE;

    City LOCATION;

    }

    ```


    噢，所以应该是 `Jamie-LOCATION= NewYork;`


