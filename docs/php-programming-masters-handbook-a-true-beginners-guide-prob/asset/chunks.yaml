    \ simple. If there’s an error in the programming about checking obstacles or stepping\
    \ with either foot, you can focus on that specific helper function and any code\
    \ inside it.\n\n## Putting it All Together\n\nThe concept behind helper functions\
    \ is simple: for a bigger, general function, give it a general purpose, then have\
    \ it call other smaller single-purpose functions to help achieve its purpose.\n\
    \nThis applies to all programming languages as well.\n\n## Chapter 9: Local Variables\n\
    \n### The Function, and Its Locals\n\nYou can define variables within a function/method\
    \ to hold key data for that function/method to use.\n\nThese are called `Local\
    \ Variables`, or `locals` for short.\n\nLater on, you will need `locals` for more\
    \ advanced concepts, such as accumulator variables and even within algorithms.\n\
    \n### Local Variables V.S. Global Variables\n\nHere are the key differences between\
    \ `Local` and `Global` variables.\n\n`Global variables` can be accessed and will\
    \ exist throughout your entire code file.\n\n`Local Variables` can only be accessed\
    \ within the functions/methods they’re defined in. They’ll also be gone once your\
    \ function finishes running.\n\n### Defining Locals\n\nIn most programming languages,\
    \ you would simply define a local variable as if you were defining a global one.\
    \ The difference is that you define the local variable within the function code\
    \ only.\n\nHere is a pseudocode example where we define local variables, as opposed\
    \ to global variables:\n\n```text\nString GLOBAL1 = “aaa”\nInteger GLOBAL2 = 123\n\
    Boolean GLOBAL3 = TRUE\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\
    \nvoid functionName() {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2 = 123\n  Boolean\
    \ LOCAL3 = TRUE\n}\n```\n\n### Referencing a Local Variable Properly\n\nThese\
    \ next few rules may vary depending on the programming language you’re working\
    \ with, but these generally apply to most of them (if not all).\n\nHere are some\
    \ key rules in accessing `Global` v.s. `Local Variables`:\n\n1) `Local variables`\
    \ can only be accessed within the same function code.\n2) `Global variables` can\
    \ be accessed throughout the code file - whether or not it’s accessed inside a\
    \ function.\n3) Depending on which programming language, local variable names\
    \ may or or not have the exact name as an existing global variable. If the language\
    \ allows it, you might need to distinctly identify which variable you are accessing.\n\
    \nNow let’s take a look at these lines of pseudocode:\n\n```text\nString GLOBAL1\
    \ = “aaa”\nInteger GLOBAL2 = 123\nBoolean GLOBAL3 = TRUE\nString SAMEVAR = “samevar”\n\
    (any type) ACCESS3 = \\_\\_\\_\\_\\_\\_\n\n// INPUT: - none\n// OUTPUT: - none\n\
    // EFFECT: ?????\n\nvoid function1() {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2\
    \ = 123\n  Boolean LOCAL3 = TRUE\n  String SAMEVAR = “samevar”\n  (any type) ACCESS1\
    \ = \\_\\_\\_\\_\\_\\_\n}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\
    \nvoid function2() {\n  String LOCAL4 = “aaa”\n  Integer LOCAL5 = 123\n  Boolean\
    \ LOCAL6 = TRUE\n  String SAMEVAR = “samevar”\n  (any type) ACCESS2 = \\_\\_\\\
    _\\_\\_\\_\n}\n```\n"
  trans: "\n\n```cpp\nvoid walk() {\n  if (checkObstacle()) return\n  leftFootStep()\n\
