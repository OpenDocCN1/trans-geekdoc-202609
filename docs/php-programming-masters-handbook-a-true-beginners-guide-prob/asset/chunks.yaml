    Welcome to the Path of Mastery\n\nWe thank you for purchasing & downloading our\
    \ work, the Master’s Handbook. By doing so, we can tell you have a curiosity to\
    \ learn Programming in a deeper, more comprehensive way.\n\nWe notice that you\
    \ don’t just want to learn a few tricks here and there, but you want the confidence\
    \ to take on any programming challenge with ease.\n\nHence, you’ve come to the\
    \ right place…\n\nThe Master’s Circle\n\nYou aren’t alone.\n\nBehind this book\
    \ are programmers hailing from some of the most Best Computer Science Programs\
    \ taught by some of the most Advanced Universities in the World Today.\n\nFoundations\n\
    \nThere are two major things that you need to do to be a good programmer. One\
    \ is to get a good amount of practice. The other is to get a really good education.\n\
    \nBut how can you tell what source of education is good or not?\n\nYou see, we\
    \ can tell you that 90% of programming learning sources out there will show you\
    \ WHAT the code is and HOW it works, for any amount of Programming languages.\
    \ But that’s not necessarily a bad thing - and plenty of those sources are really\
    \ good too.\n\nHowever, they might not teach you WHY or WHEN you would use that\
    \ code. NOR would they show you WHAT ELSE you might need with that code.\n\nIf\
    \ you needed to program something, you don’t want to be someone that knows a bunch\
    \ of code but with no real idea how to use them, right?\n\nAs you read on, you’ll\
    \ quickly learn not just the HOW and WHAT the code is, but the WHERE, WHEN, WHY\
    \ to use it, WHAT ELSE you’ll need with it- and more importantly, HOW to use it.\n\
    \nThe Master Structure\n\nWe start by observing the world and defining the code\
    \ to represent things (data) or actions (functions). As you progress through the\
    \ book, you’ll find more advanced concepts and ways to combine them all together.\n\
    \nYou’re also accommodated with the Main Programming Language this book comes\
    \ with, as well as general PseudoCode to help understand coding concepts. Often\
    \ times, you’ll find that our PseudoCode bridges you from learning this Book’s\
    \ Main Language to learning your Next Language!\n\nWhether you haven’t coded a\
    \ single line before, or you’ve already build serious projects, you WILL find\
    \ great value in this book. Often times, you’ll run into a coding challenge in\
    \ your programming journey. This book will help you identify how to progress through\
    \ it!\n\n\\========================= ======\n\nEditor’s Note\n\n#  \n\n\\=========================\
    \ ======\n\nReality\n\nIf you ever wonder why Computer Scientists make so much\
    \ money (including junior programmers, developers, software engineers, IT folks,\
    \ and just about any job involving programming), there are plenty of good reasons.\
    \ \n\nOne, is that in today’s world, just about EVERY industry out there requires\
    \ a level of technological sophistication. So you can imagine the level of demand\
    \ for a qualified programmer.\n\nBut the truth about Computer Science is that\
    \ it can be very intellectually challenging most of the time. Thus, only a certain\
    \ number of people will be good enough to get a real career in programming.\n\n\
    So there you have it. High Demand + Few Good Programmers = GOOD Salary.\n\nHowever,\
    \ you may not need a university degree to be a good programmer…\n\nIn-Depth\n\n\
    The true point of this book, along with others in the series, is to go deeper\
    \ than the lines of code you see. You’ll learn how to use every bit of data and\
    \ code to any situation you encounter - and at one point, intuitively.\n\nA real\
    \ programmer’s job is to create tools that improve life in one way or another.\
    \ Almost all of the time, it will involve having to come up with ways to represent\
    \ things in life as data - as well as getting a computer to process the data properly\
    \ and turn into something useful.\n\nSo if you want to become a better programmer,\
    \ read on…\n\nPHP Introduction \n\n\\========================= ======\n\nPHP:\
    \ Server’s Secret Service\n\nIf you have a web structure including web code, databases,\
    \ security, servers, and functionality, then PHP may be your programming language\
    \ to glue them all together. PHP is innately integrated with almost every database\
    \ type out there, including MySQL and MS Access. PHP can also be easily integrated\
    \ into your web pages as functionality. And fortunately, PHP can be remarkably\
    \ easy to learn - with so many ways to code it.\n\nHowever, it’s this combination\
    \ of an easy learning curve and flexible implementation that can limit PHP code.\
    \ Many, many programmers can implement web functionality one way, and many more\
    \ can do it in another way. And when multiple programmers create PHP code together,\
    \ they might find plenty of issues attempting to get their code to work together.\n\
    \nAlso, PHP is purely limited to the server. If you access a web app powered by\
    \ PHP, you will have absolutely no idea what the PHP code is doing. But being\
    \ bound only to the server may be both a curse AND a blessing; PHP can execute\
    \ its code regardless of whatever computing device accesses its websites and web\
    \ apps.\n\nRegardless, if you want solid, flexible service on your server, look\
    \ no further than using PHP.\n\nPHP Advantages:\n\n\\-Integration & Support for\
    \ plenty of database types\n\n\\-Excellent combination with HTML/CSS\n\n\\-easy\
    \ to learn, deep enough to master\n\n\\-code is only visible to servers\n\n\\\
    -can be consistent throughout all computing devices\n\nPHP Disadvantages:\n\n\\\
    -code is only executed on the Server\n\n\\-different PHP code between teammates\
    \ = bad teamwork\n\n\\-“flexible but scatterbrained”\n\nPHP Workshops:\n\nThese\
    \ workshops are yours to complete in whichever way you like (However, the code\
    \ MUST work!).\n\nThey’re designed to put the most recent concepts into real-life\
    \ practice, yet giving you the flexibility and critical thinking along the way.\n\
    \nAnd of course, flexibility and deep critical thinking are key programmer traits!"
