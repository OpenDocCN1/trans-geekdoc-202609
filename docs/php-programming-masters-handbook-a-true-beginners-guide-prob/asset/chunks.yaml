- raw: "To have your code execute whatever effect or procedure you’ve defined in your\
    \ functions, you simply put your function name in your code - but in a particular\
    \ way\n\nKeep in mind that you can only place your function wherever its output\
    \ data type is expected to be. The exception is when your function has no data\
    \ output (returns void). You can place this function on lines by itself.\n\nFor\
    \ example, take these two functions:\n\n// INPUT: - none\n\n// OUTPUT: - an ID\
    \ (Number)\n\n// EFFECT: ?????\n\nnumber procedureA() {…}\n\n// INPUT: - none\n\
    \n// OUTPUT: - none\n\n// EFFECT: ?????\n\nvoid procedureB() {…}\n\nProcedure\
    \ A outputs a number. Place the function wherever the data type Number is expected:\n\
    \nNumber x = procedureA();\n\nNumber y = 10.213 \\* procedureA();\n\nProcedure\
    \ A outputs nothing. Place the function on its own line of code.\n\nprocedureB();\n\
    \nIf a function belongs to a data class, make sure to access that function from\
    \ an instance of that data class:\n\nClassC instanceC = new ClassC;\n\ninstanceC.procedureC();\n\
    \nChapter 5b: Matching Data with Functions\n\nHere’s an inevitable truth when\
    \ it comes to functions: they will almost always involve data in any way.\n\n\
    Later on, you’ll find that all sorts of different data structures will have at\
    \ least one key function associated with it.\n\nAlso, some data structures, by\
    \ default, will have associated go-to templates to use in programming. Remember\
    \ this well; if you’re given a certain data structure to work with, you should\
    \ already have the function structure you’ll need in mind.\n\nFunctions using\
    \ Atomic Data\n\nThere’s usually no structure or template involved when dealing\
    \ with Atomic Data.\n\nFunctions may have atomic data as inputs or outputs when\
    \ necessary.\n\nHere are some pseudocode to demonstrate:\n\n// INPUT: - a Name\
    \ (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT: ?????\n\nnumber procedureA(String\
    \ name) {… return ID}\n\n// INPUT: - none\n\n// OUTPUT: - none\n\n// EFFECT: ?????\n\
    \nvoid procedureB() {…}\n\nAlso, Functions can even modify existing variables.\
    \ \n\n// Player1 Score, as an Integer\n\nInteger Score = 0\n\n// INPUT: - none\n\
    \n// OUTPUT: - none\n\n// EFFECT: increments the score by one\n\nvoid score1()\
    \ { Score += 1}\n\nFunctions using Composite Data\n\nThe key thing to remember\
    \ here is that, for every component a composite data structure has, its associated\
    \ function will have a template that accesses and deals with each component (regardless\
    \ of what data type each component is). Also, each component will be treated as\
    \ whatever data type it is; a String treated as a String, composite data as composite\
    \ data, and so on.\n\nWe demonstrate this in pseudocode:\n\n// Structure of a\
    \ Book:\n\nCompositeStructure Book {\n\nString AUTHOR\n\nString TITLE\n\nInteger\
    \ PAGECOUNT\n\n}\n\n// INPUT: - a Book\n\n// OUTPUT: - none\n\n// EFFECT: ?????\n\
    \nvoid bookTemplateFunc(Book b) {\n\nb.AUTHOR //do something\n\n b.TITLE // do\
    \ something\n\n b.PAGECOUNT // do something\n\n}\n\nHere’s an example of a printing\
    \ function, based on the above template:\n\n// INPUT: - a Book\n\n// OUTPUT: -\
    \ none\n\n// EFFECT: prints book details\n\nvoid printDetails(Book b) {\n\nprintString(b.AUTHOR)\n\
    \n printString(b.TITLE)\n\n printInteger(b.PAGECOUNT )\n\n}\n\nMethods: Functions\
    \ for Object-Oriented Programming\n\nIn Object-oriented programming, data and\
    \ procedures are bundled in data structures called classes.\n\nFunctions are called\
    \ Methods and class variables are called Fields.\n\nYou can think of Methods within\
    \ a class as ‘behaviours’ - or what actions an instance of that class can do.\n\
    \nTo describe Class Methods in comments, simply list the behaviours it can do:\n\
    \n// A Space Invaders Tank Class can:\n\n// - move left\n\n// - move right\n\n\
    // - shoot a missile\n\n// A Dog Class can:\n\n// - walk\n\n// - bark\n\n// -\
    \ sit\n\n// - eat\n\nFunctions for Sequences\n\n(You’ll cover this in later chapters…)\n\
    \nBasically, data elements of the same type can be grouped together into sequenced\
    \ collections. Examples can be lists and strings.\n\nFor these, functions process\
    \ each element one by one until all data elements are covered. \n\nFunctions for\
    \ more Sophisticated Data Structures\n\n(You’ll cover this in later chapters…)\n\
    \nPHP-04: Function Structure\n\nFunctions in PHP\n\nThe syntax structure for PHP\
    \ functions are so:\n\nfunction functionName($input1, $input2) {\n\n// any code\
    \ here\n\n}\n\nHere are a few key notes in PHP functions:\n\n\\-PHP functions\
    \ always start with the word ‘function’, then your function name, parentheses\
    \ along with any inputs, then curly brackets ( { } )\n\n\\-For defining functions,\
    \ the function inputs are in PHP variable syntax - that is, the input names start\
    \ with a dollar sign ($), then the rest of the name.\n\n\\-You place your function\
    \ code within the curly brackets of your function.\n\n\\-If your PHP function\
    \ returns data, you put the word ‘return’, then a $variable name or data you want\
    \ to return. Once the function reaches the ‘return’ line, it will output whatever\
    \ data you’ve set it to, then the function will finish running.\n\nFunction Example\n\
    \nHere’s what the createID() function looks like in PHP:\n\n// INPUT: - a name\
    \ (String)\n\n// OUTPUT: - an ID (Number)\n\n// EFFECT: generates a random number\
    \ for a given name\n\nfunction createID($name) {\n\nreturn rand();\n\n}\n\nClass\
    \ Methods in PHP:\n\nIn PHP, here’s what the createID() function looks like, as\
    \ a method within the IDGenerator class:\n\n// An IDGenerator can:\n\n// - generate\
    \ a random number\n\nclass IDGenerator{\n\n// INPUT: - a name (String)\n\n// OUTPUT:\
    \ - an ID (Number)\n\n// EFFECT: generates a random number for a given name\n\n\
    function createID($name) {\n\nreturn randomNumber();\n\n}\n\nIf createID() belonged\
    \ to the IDGenerator class (instead of being just a function by itself), you would\
    \ need to create an IDGenerator object to be able to use createID(). Note that\
    \ you need to use a dash-arrow ( -> ) to access a class method.\n\nidg = new IDGenerator();\n\
    \nsomeNumber = idg->createID(“Name\");\n\nPHP Workshop #3\n\nDesigning & Calling\
    \ Functions\n\nFirst, go to an IDE of your choice. Online IDE’s include Rextester\
    \ ([rextester.com](http://rextester.com)), CodeChef ([www.codechef.com/ide](http://www.codechef.com/ide)),\
    \ CodePad ([codepad.org](http://codepad.org)), and Ideone ([https://ideone.com/](https://ideone.com/)).\n\
    \nThen, copy and paste the following lines of code between the php declarations.\n\
    \nYour code should be like so:\n\n<?php\n\n// ==================================\n\
    \nclass calculator{\n\n// INPUT: - two Integers\n\n// OUTPUT: - a result(Integer)\n\
    \n// EFFECT: add two integers together & give result\n\npublic function add(\\\
    _\\_, \\_\\_){\n\nreturn $a + $b;\n\n}\n\n// INPUT: - two Integers\n\n// OUTPUT:\
    \ - a result(Integer)\n\n// EFFECT: subtract 1st integer from 2nd & give result\n\
    \npublic function subtract($a, $b){\n\nreturn \\_\\_;\n\n}\n\n};\n\n// INPUT:\
    \ - a String\n\n// OUTPUT: - nothing (Void)\n\n// EFFECT: prints the string input\n\
    \nfunction printer(\\_\\_\\_){\n\nprint($string . \"\\\\n\");\n\n}\n\n// Your\
    \ Bank Account is an Integer\n\n$BANKACCOUNT;\n\n// Create a Calculator Object\n\
    \n$c = new calculator();\n\n// Income & Expenses, as Integers\n\n$PAYCHEQUE =\
    \ 4500;\n\n$LIVINGEXP = 2100;\n\n$FUNSTUFF = 1200;\n\n$TRAVEL = 2700;\n\n// How\
    \ much would fun stuff and travel be together?\n\n$FUNTRAVEL = $c->add(\\_\\_\\\
    _, \\_\\_\\_);\n\nprinter(\"Fun Stuff & Travel Together: \" . $FUNTRAVEL);\n\n\
    // Your Paycheque, after paying your living expenses?\n\n// (HINT: call the calculator\
    \ object c, then access one of its methods. . .)\n\n$BANKACCOUNT = $c->\\_\\_\\\
    _(\\_\\_\\_, \\_\\_\\_);\n\nprinter(\"Bank Account Balance, normal: \" . $BANKACCOUNT;\n\
    \n// Your Paycheque, after paying your living expenses AND fun stuff?\n\n// (HINT:\
    \ call the calculator object c, then access one of its methods. . .)\n\n// (HINT:\
    \ try subtracting your living expenses from your paycheque.\n\n// Then afterwards,\
    \ try subtracting the fun stuff AFTER what’s left\n\n// (HINT: the printer() returns\
    \ Void, aka nothing. Use it on a line on its own!)\n\n$BANKACCOUNT = \\_\\_\\\
    _;\n\n$BANKACCOUNT = \\_\\_\\_\\_ ;\n\n\\_\\_\\_(“Bank Account Balance, w/ Fun\
    \ Stuff: \" . $BANKACCOUNT;\n\n// ==================================\n\n?>\n\n\
    Before you begin, your code should look exactly to the code above.\n\nNow, fill\
    \ in the blanks.  "
  fmt: "\n# Calling Functions and Methods\n\nTo have your code execute whatever effect\
    \ or procedure you’ve defined in your functions, you simply put your function\
    \ name in your code - but in a particular way.\n\nKeep in mind that you can only\
    \ place your function wherever its output data type is expected to be. The exception\
    \ is when your function has no data output (returns `void`). You can place this\
    \ function on lines by itself.\n\nFor example, take these two functions:\n\n```php\n\
    // INPUT: - none\n// OUTPUT: - an ID (Number)\n// EFFECT: ?????\nnumber procedureA()\
    \ {…}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\nvoid procedureB()\
    \ {…}\n```\n\nProcedure `A` outputs a number. Place the function wherever the\
    \ data type `Number` is expected:\n\n```php\nNumber x = procedureA();\nNumber\
    \ y = 10.213 * procedureA();\n```\n\nProcedure `A` outputs nothing. Place the\
    \ function on its own line of code.\n\n```php\nprocedureB();\n```\n\nIf a function\
    \ belongs to a data class, make sure to access that function from an instance\
    \ of that data class:\n\n```php\nClassC instanceC = new ClassC;\ninstanceC.procedureC();\n\
    ```\n\n# Chapter 5b: Matching Data with Functions\n\nHere’s an inevitable truth\
    \ when it comes to functions: they will almost always involve data in any way.\n\
    \nLater on, you’ll find that all sorts of different data structures will have\
    \ at least one key function associated with it.\n\nAlso, some data structures,\
    \ by default, will have associated go-to templates to use in programming. Remember\
    \ this well; if you’re given a certain data structure to work with, you should\
    \ already have the function structure you’ll need in mind.\n\n## Functions using\
    \ Atomic Data\n\nThere’s usually no structure or template involved when dealing\
    \ with Atomic Data.\n\nFunctions may have atomic data as inputs or outputs when\
    \ necessary.\n\nHere are some pseudocode to demonstrate:\n\n```php\n// INPUT:\
    \ - a Name (String)\n// OUTPUT: - an ID (Number)\n// EFFECT: ?????\nnumber procedureA(String\
    \ name) {… return ID}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\
    void procedureB() {…}\n```\n\nAlso, Functions can even modify existing variables.\n\
    \n```php\n// Player1 Score, as an Integer\nInteger Score = 0\n\n// INPUT: - none\n\
    // OUTPUT: - none\n// EFFECT: increments the score by one\nvoid score1() { Score\
    \ += 1}\n```\n\n## Functions using Composite Data\n\nThe key thing to remember\
    \ here is that, for every component a composite data structure has, its associated\
    \ function will have a template that accesses and deals with each component (regardless\
    \ of what data type each component is). Also, each component will be treated as\
    \ whatever data type it is; a `String` treated as a `String`, composite data as\
    \ composite data, and so on.\n\nWe demonstrate this in pseudocode:\n\n```php\n\
    // Structure of a Book:\nCompositeStructure Book {\n  String AUTHOR\n  String\
    \ TITLE\n  Integer PAGECOUNT\n}\n\n// INPUT: - a Book\n// OUTPUT: - none\n// EFFECT:\
    \ ?????\nvoid bookTemplateFunc(Book b) {\n  b.AUTHOR //do something\n  b.TITLE\
    \ // do something\n  b.PAGECOUNT // do something\n}\n```\n\nHere’s an example\
    \ of a printing function, based on the above template:\n\n```php\n// INPUT: -\
    \ a Book\n// OUTPUT: - none\n// EFFECT: prints book details\nvoid printDetails(Book\
    \ b) {\n  printString(b.AUTHOR)\n  printString(b.TITLE)\n  printInteger(b.PAGECOUNT\
    \ )\n}\n```\n\n## Methods: Functions for Object-Oriented Programming\n\nIn Object-oriented\
    \ programming, data and procedures are bundled in data structures called `classes`.\n\
    \nFunctions are called `Methods` and class variables are called `Fields`.\n\n\
    You can think of `Methods` within a class as ‘behaviours’ - or what actions an\
    \ instance of that class can do.\n\nTo describe `Class Methods` in comments, simply\
    \ list the behaviours it can do:\n\n```php\n// A Space Invaders Tank Class can:\n\
    // - move left\n// - move right\n// - shoot\n```\n\n```php\n// A Dog Class can:\n\
    // - walk\n// - sit\n// - eat\n```\n\n## Functions for Sequences\n\nBasically,\
    \ you’ll find that all sorts of different data structures will have at least one\
    \ key function associated with it.\n\nAlso, some data structures, by default,\
    \ will have associated go-to templates to use in programming. Remember this well;\
    \ if you’re given a certain data structure to work with, you should already have\
    \ the function structure you’ll need in mind.\n\n## Functions for Sophisticated\
    \ Data Structures\n\nIn Object-oriented programming, data and procedures are bundled\
    \ in data structures called `classes`.\n\nFunctions are called `Methods` and class\
    \ variables are called `Fields`.\n\nYou can think of `Methods` within a class\
    \ as ‘behaviours’ - or what actions an instance of that class can do.\n\nTo describe\
    \ `Class Methods` in comments, simply list the behaviours it can do:\n\n```php\n\
    // A Space Invaders Tank Class can:\n// - move left\n// - move right\n// - shoot\n\
    ```\n\n```php\n// A Dog Class can:\n// - walk\n// - sit\n// - eat\n```\n\n## Workshop\
    \ #3: Designing & Calling Functions\n\nFirst, go to an IDE of your choice: Rextester\
    \ (`http://rextester.com/), CodeChef (`http://www.codechef.com/), CodePad (`http://codepad.org/),\
    \ and Ideone (`https://ideone.com/`).\n\nThen, copy and paste the following code\
    \ between the declarations.\n\n```php\n<?php\n\n// ==================================\n\
    \nclass calculator{\n\n// INPUT: - two Integers\n// OUTPUT: - a result(Integer)\n\
    // EFFECT: add two integers together & give result\npublic function add($a, $b){\n\
    \nreturn $a + $b;\n\n}\n\n// INPUT: - two Integers\n// OUTPUT: - a result(Integer)\n\
    // EFFECT: subtract 1st integer from 2nd & give result\npublic function subtract($a,\
    \ $b){\n\nreturn $a - $b;\n}\n\n};\n\n// INPUT: - a String\n// OUTPUT: - nothing\
    \ (Void)\n// EFFECT: prints the string input\nfunction printer($string){\n\nprint($string\
    \ . \"\\n\");\n}\n\n// Your Bank Account is an Integer\n$BANKACCOUNT = \n\n//\
    \ Create a Calculator Object\n$c = new calculator();\n\n// Income & Expenses,\
    \ as Integers\n$PAYCHEQUE = 4500;\n\n$LIVINGEXP = 2100;\n\n$FUNSTUFF = 1200;\n\
    \n$TRAVEL = 2700;\n\n// How much would fun stuff and travel be together?\n$FUNTRAVEL\
    \ = $c->add(__, {});\n\nprinter(\"Fun Stuff & Travel Together: \" . $FUNTRAVEL);\n\
    \n// Your Paycheque, after paying your living expenses?\n// (HINT: call the calculator\
    \ object c, then access one of its methods. . .)\n$BANKACCOUNT = $c->____, {});\n\
    \nprinter(\"Bank Account Balance, normal: \" . $BANKACCOUNT);\n\n// Your Paycheque,\
    \ after paying your living expenses AND fun stuff?\n// (HINT: call the calculator\
    \ object c, then access one of its methods. . .)\n// (HINT: try subtracting your\
    \ living expenses from your paycheque.\n// Then afterwards, try subtracting the\
    \ fun stuff AFTER what’s left\n// (HINT: the printer() returns Void, aka nothing.\
    \ Use it on a line on its own!)\n$BANKACCOUNT = __;\n\n$BANKACCOUNT = __; ;\n\n\
    printer(\"Bank Account Balance, w/ Fun Stuff: \" . $BANKACCOUNT);\n\n?>\n```\n\
    \nBefore you begin, your code should look exactly to the code above.\n\nNow, fill\
    \ in the blanks.\n"
  trans: "\n\n# 调用函数与方法\n\n要让你的代码执行你在函数中定义的任何效果或过程，你只需要在代码中放入函数名即可——但要以特定的方式。\n\n\
    请记住，你只能将函数放置在期望输出数据类型的地方。异常情况是当你的函数没有数据输出时（返回 `void`）。在这种情况下，你可以将该函数单独放在一行。\n\n\
    例如，参考这两个函数：\n\n```php\n// INPUT: - none\n// OUTPUT: - an ID (Number)\n// EFFECT:\
    \ ?????\nnumber procedureA() {…}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT:\
    \ ?????\nvoid procedureB() {…}\n```\n\n过程 `A` 输出一个数字。在任何期望数据类型 `Number`的地方放置该函数：\n\
    \n```php\nNumber x = procedureA();\nNumber y = 10.213 * procedureA();\n```\n\n\
    过程 `A` 不输出任何内容。将函数放在单独的一行代码中。\n\n```php\nprocedureB();\n```\n\n如果一个函数属于某个数据类，请确保通过该数据类的实例来访问该函数：\n\
    \n```php\nClassC instanceC = new ClassC;\ninstanceC.procedureC();\n```\n\n# 第\
    \ 5b 章：用函数匹配数据\n\n关于函数，有一个不可避免的真理：它们几乎总是会以某种方式涉及数据。\n\n以后，你会发现各种不同的数据结构都至少与一个关键函数相关。\n\
    \n此外，某些数据结构默认会有关联的编程可用模板。记住这一点；如果你被赋予某个数据结构来处理，你应该心中已经有了所需的函数结构。\n\n## 使用原子数据的函数\n\
    \n在处理原子数据时，通常不涉及结构或模板。\n\n需要时，函数可以将原子数据作为输入或输出。\n\n是一些演示用伪代码：\n\n```php\n// INPUT:\
    \ - a Name (String)\n// OUTPUT: - an ID (Number)\n// EFFECT: ?????\nnumber procedureA(String\
    \ name) {… return ID}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\
    void procedureB() {…}\n```\n\n此外，函数甚至可以修改现有变量。\n\n```php\n// Player1 Score，一个整数\n\
    Integer Score = 0\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: 将分数加一\nvoid\
    \ score1() { Score += 1}\n```\n\n## 使用复合数据的函数\n\n这里需要记住的关键点是，对于复合数据结构的每一个组件，其关联的函数将有一个模板来访问并处理每个组件（无论每个组件的数据类型是什么）。此外，每个组件将按照其所属的数据类型被处理；`String`\
    \ 被视为 `String`，复合数据视为复合数据，以此此类推。\n\n我们通过伪代码中演示了这一点：\n\n```php\n// 书的结构：\nCompositeStructure\
    \ Book {\n  String AUTHOR\n  String TITLE\n  Integer PAGECOUNT\n}\n\n// INPUT:\
    \ - a Book\n// OUTPUT: - none\n// EFFECT: ?????\nvoid bookTemplateFunc(Book b)\
    \ {\n  b.AUTHOR // 执行一些操作\n  b.TITLE // 执行一些操作\n  b.PAGECOUNT // 执行一些操作\n}\n```\n\
    \n这是一个基于上述模板的打印函数示例：\n\n```php\n// INPUT: - a Book\n// OUTPUT: - none\n// EFFECT:\
    \ 打印书籍详情\nvoid printDetails(Book b) {\n  printString(b.AUTHOR)\n  printString(b.TITLE)\n\
    \  printInteger(b.PAGECOUNT )\n}\n```\n\n## 方法：面向对象编程的函数\n\n在面向对象编程中，数据和过程被封装在称为`类（classes）的数据结构中。\n\
    \n函数被称为`方法（Methods），类变量被称为`字段（Fields）。\n\n你可以将类内部的`方法` 视为“行为”——或者该类的实例可以执行的操作。\n\
    \n要在注释中描述`类方法`（Class Methods），只需列出它可以执行的行为即可：\n\n```php\n// 街机入侵者坦克类可以：\n// -\
    \ 左移\n// - 右移\n// - 射击\n```\n\n```php\n// 狗类可以：\n// - 走路\n// - 坐\n// - 吃\n```\n\
    \n## 序列函数\n\n基本上，你会发现各种不同的数据结构都至少与一个关键函数相关。\n\n此外，某些数据结构默认会有关联的编程可用模板。记住这一点；如果你被赋予某个数据结构来处理，你应该心中已经有了所需的函数结构。\n\
    \n## 复杂数据结构的函数\n\n在面向对象编程中，数据和过程被封装在称为`类（classes）的数据结构中。\n\n函数被称为`方法（Methods），类变量被称为`字段（Fields）。\n\
    \n你可以将类内部的`方法` 视为“行为”——或者该类的实例可以执行的操作。\n\n要在注释中描述`类方法`（Class Methods），只需列出它可以执行的行为即可：\n\
    \n```php\n// 街机入侵者坦克类可以：\n// - 左移\n// - 右移\n// - 射击\n```\n\n```php\n// 狗类可以：\n\
    // - 走路\n// - 坐\n// - 吃\n```\n\n## 工作坊 #3：设计与调用函数\n\n首先，进入你喜欢的 IDE：Rextester (`http://rextester.com/`),\
    \ CodeChef (`http://www.codechef.com/`), CodePad (`http://codepad.org/`) 以及 Ideone\
    \ (`https://ideone.com/`)。\n\n然后，将以下代码粘贴在声明之间。\n\n```php\n<?php\n\n// ==================\n\
    \nclass calculator{\n\n// INPUT: - two Integers\n// OUTPUT: - a result(Integer)\n\
    // EFFECT: 将两个整数相加并结果\npublic function add($a, $b){\n\nreturn $a + $b;\n\n}\n\n\
    // INPUT: - two Integers\n// OUTPUT: - a result(Integer)\n// EFFECT: 从第二个整数中减去第一个并返回结果\n\
    public function subtract($a, $b){\n\nreturn $a - $b;\n\n}\n\n};\n\n// INPUT: -\
    \ a String\n// OUTPUT: - nothing (Void)\n// EFFECT: 打印字符串输入\nfunction printer($string){\n\
    \nprint($string . \"\\n\");\n}\n\n// 银行账户是一个整数\n$BANKACCOUNT = \n\n// 创建计算器对象\n\
    $c = new calculator();\n\n// 收入与支出，作为整数\n$PAYCHEQUE = 4500;\n\n$LIVINGEXP = 2100;\n\
    \n$FUNSTUFF = 1200;\n\n$TRAVEL = 2700;\n\n// 娱乐费用和旅行加在一起是多少？\n$FUNTRAVEL = $c->add(__,\
    \ {});\n\nprinter(\"娱乐费用和旅行在一起: \" . $FUNTRAVEL);\n\n// 支付完生活费后你的工资是多少？\n//（提示：调用计算器对象\
    \ c，访问它的其中一个方法。..）\n$BANKACCOUNT = $c->____, {});\n\nprinter(\"银行余额，正常: \" . $BANKACCOUNT);\n\
    \n// 支付完生活费和娱乐费用后，你的工资是多少？\n//（提示：调用计算器对象 c，访问它的其中一个方法。..）\n//（提示：尝试从你的工资中减去生活费。\n\
    // 然后在剩余部分之后尝试减去娱乐费用\n//（提示：printer() 返回 Void，即没有内容。请单独占 own 一行使用它！）\n$BANKACCOUNT\
    \ = __;\n\n$BANKACCOUNT = __; ;\n\nprinter(\"银行余额，含娱乐费用: \" . $BANKACCOUNT);\n\
    \n?>\n```\n\n在开始之前，你的代码应该与上方完全一致。\n\n现在，填空空白。\n\n"
