    \ <# of items in array> );`\n\nTo set up an array in PHP, use the line of code\
    \ above. Then choose your variable name, and how many item objects you want in\
    \ the array. Here’s an example. I’m declaring an array named `intArray`. It will\
    \ also have 10 elements in it:\n\n`$intArray = array(10);`\n\n### Accessing Array\
    \ Items\n\nYou can access data objects within an array by calling the variable\
    \ name, followed by its index (position within the array) as an integer within\
    \ brackets:\n\n`<Variable Name>[<index of array data object>];`\n\nRemember: don’t\
    \ forget the Dollar Sign! For example, if you wanted to access the third item\
    \ in `intArray`, you would use this expression:\n\n`… = $intArray[2]`\n\n### But\
    \ why 2 and not 3?\n\nBecause, remember, in Computer Science, data is counted\
    \ from zero first!\n\n### Note on PHP Arrays:\n\nArrays in PHP can also be maps\
    \ - meaning, elements within PHP arrays can also be accessed using ‘keys’ as well\
    \ as indexes. To do this, you can set up your array as so:\n\n```\n<Variable Name>\
    \ = array(\n<key 1> => <value 1>,\n<key 2> => <value 2>,\n<key 3> => <value 3>,\n\
    …\n<key n> => <value n>,\n);\n```\n\nThe keys can be any atomic type, such as\
    \ strings, integers, even booleans. Here’s an example of a mapped array:\n\n```\n\
    $intArray = array(\n'ONE' => 'aaa',\ntrue => 'bbb',\n3 => 'ccc',\n);\n```\n\n\
    And to access any value within a mapped array, it’s quite similar to a regular\
    \ array: `$intArray['ONE']`.\n\n## Creating Linked Lists from Scratch\n\nThis\
    \ can be a little more tricky than usual, as you’ll usually need to design a node\
    \ first. For Singly Linked Lists, you’ll need its contained data and next node:\n\
    \n```\n// Abstract Data Type: Linked List, Singly\n// Each element in the Linked\
    \ List is represented by a Node.\n// A Node has:\n// - the Data Item (choose what\
    \ data type you want)\n// - the Next Node (Node Object)\n```\n\nAs for Doubly\
    \ Linked Lists, you’ll need the data item, as well as the previous and next nodes:\n\
    \n```\n// Abstract Data Type: Linked List, Doubly\n// Each element in the Linked\
    \ List is represented by a Node.\n// A Node has:\n// - the Data Item (choose what\
    \ data type you want)\n// - the Previous Node (Node Object)\n// - the Next Node\
    \ (Node Object)\n```\n\n## Chapter 13: Self-Reference Recursion\n\nSelf-Reference\
    \ recursion - self-recursion for short - is one of the most important concepts\
    \ in Computer Programming. The main idea behind Self-Recursion is this: given\
    \ some initial input, a self-recursive function will process an effect, then continue\
    \ to repeat that effect with a reduced or augmented version of that input. The\
    \ function will continue repeating until the input is at a certain state that\
    \ causes the function to stop repeating.\n\nSelf-reference is a key procedure\
    \ in processing collections of data items. Given, a self-recursive function will\
    \ repeat its procedure for each data item in the collection. The function will\
    \ keep repeating until either there are no data items left to process, or the\
    \ function has encountered its intended solution. This concept is seen throughout\
    \ simple and advanced programming - including algorithms, auto-generating data,\
    \ and more.\n\n### Parts of the Self-Recursive Function\n\nLet’s observe a Self-Recursive\
    \ Function example in Pseudocode:\n\n```\n// INPUT: an Integer\n// OUTPUT: none\n\
    // EFFECT: Given a positive integer, prints 10^(input),\n// then repeats with\
    \ input - 1 until it prints just 10\n// - Base Case: input is <= 0\n// - Recursive\
    \ Step: Repeat with input - 1\n\nvoid printPowerTen(integer i) {\n  //Base Case:\n\
    \  if (i <=0) return;\n\n  // Recursive Step:\n  print 10 ^ i;\n  printPowerTen(i\
    \ - 1); // this is the self-reference\n}\n```\n\n(remember: this concept will\
    \ remain the same throughout many programming languages!) A Self-Recursion function\
    \ will have the main components of a regular function: possible inputs and outputs,\
    \ and an effect. It will also have two additional components: a Base Case and\
    \ a Recursive Step.\n"
  trans: "\n\n“链表的顺序是这样的：最节点节点（前面没有节点），然后是它的下一个节点，再是下一个，以此此类推——直到有一个节点后面什么都没有了。”\n\
    \n## 从零开始构建链表\n\n如果你曾经需要从零设计一个链表，这个概念其实很简单。链表中的单个链接由实际数据，以及后续节点或前一个节点的 ID 组成。单向链表节点只指向下一个节点，而双向链表节点则同时指向下一个节点和前一个节点。\n\
    \n在我们下方的伪代码中，一个双向链表节点包含四个关键字段：ID、前一个节点的 ID、下一个节点的 ID 以及实际数据项。\n\n```\n// 抽象数据类型：链表\n\
    // 链表中的每个元素都由一个 Node（节点）表示。\n// 一个 Node 包含：\n// -一个 ID (String)\n// - 前一个节点的 ID\
    \ (String)\n// - 下一个节点的 ID (String)\n// - 数据项 (根据需要选择你想要的数据类型)\n\nCompositeStructure\
    \ Node {\nString ID\nString PREVID\nString NEXTID\n(choose a data type) ITEM\n\
    }\n```\n\n通常情况下，每个链表只能使用一种数据类型。原因仅仅在于计算机系统本身处理和组织数据的方式（如果你了解计算机系统是如何运作的，将会学到更多）。\n\
    \n## 第 12c 章：数组\n\n如果你在字典中查找“array”（数组）这个词，你会发现它是按照特定顺序对项目进行的一种详尽且有时非常美的排列。强调“按照特定顺序对项目进行排列”这个短语。\n\
    \n在编程中，你现在已经知道了数组的关键点——它们是按特定顺序排序的数据项列表。\n\n以下是一个大小为 5 的数组在视觉上的示例：\n\n[ 0 ][item\
    \ A]\n[ 1 ][item B]\n[ 2 ][ NULL ]\n[ 3 ][item D]\n[ 4 ][ NULL ]\n\n在这里，你可以看到多快速、方便地从数组中添加或获取数据项。如果你知道存储数据的索引，只需访问数组、然后是索引，数据就属于你了。\n\
    \n此外，数组的大小通常是固定的。在某些编程语言中，还有动态或可变尺寸数组。但取决于编程语言的工作机制，数据项通常会被重新添加到空间与项目数量相符的数组中。\n\
    \n### 快速提示：为什么零是第一个？\n\n在计算机科学中，数据是从零开始计数的。这意味着 0 是第一个，1 是第二个，2 是第三个，以此此类推。如果这听起来让你很困惑，只需记住，如果你必须用计算机术语计数，请记住第\
    \ `i` 个位置减去 1。\n\n所以，如果我们有一个有 10 个项目的数组，数组中的第一个项目将位于索引 `0`（第 1 个 - 1），列表中的最后一个项目将是\
    \ `n - 1`（这意味着你的数组大小减 1）。\n\n## 从零开始构建数组\n\n如果你曾经需要从零设计一个数据数组，这个概念同样简单。但与链表不同，它没有独立的节点。构建数组需要两个要素：数组的长度或大小，以及你想存储在其中的数据类型。\n\
    \n大多数编程语言都应该支持简单数组。在伪代码中，我们这样创建一个数组：\n\n```\n// 抽象数据类型：数组\n// 一个 Array 包含：\n//\
    \ - 数组大小\n// - 存储的数据项类型 (根据需要选择你想要的数据类型)\n(choose a data type) ArrayName[ArraySize]\n\
    ```\n\n和链表一样，每个数组只能使用一种数据类型。然而，与链表不同，数组对每个数组仅有一种数据类型有严格限制。此的原因是计算机为该数组分配数据内存/存储的方式。每个数组使用一种数据类型使得数组结构更加化且易于访问。\n\
    \n## PHP-06：PHP 中的链表与数组\n\n### 创建数组\n\nPHP 中的数组按以下格式声明：\n\n`<Variable Name> =\
    \ array( <数组中的项目数量> );`\n\n要在 PHP 中设置数组，请使用上面的代码行。然后选择你的变量名，以及你想在数组中包含多少个项目对象。这是一个示例。我声明了一个名为\
    \ `intArray` 的数组，它也将包含 10 个元素：\n\n`$intArray = array(10);`\n\n### 访问数组项\n\n你可以通过调用变量名，后跟其整数形式的索引（在数组中的位置）来访问数组内的数据对象：\n\
    \n`<Variable Name>[<数组数据对象的索引>];`\n\n记住：不要忘记美元符号 `$`！例如，如果你想访问 `intArray` 中的第三项，你将使用此表达式：\n\
    \n`… = $intArray[2]`\n\n### 但为什么是 2 而不是 3？\n\n因为，记住，在计算机科学中，数据是从零开始计数的！\n\n###\
    \ 关于 PHP 数组的注意：\n\nPHP 数组也可以是映射（maps），这意味着 PHP 数组中的元素可以使用“键”（keys）以及索引来访问。要实现这一点，你可以这样设置数组：\n\
    \n```\n<Variable Name> = array(\n<key 1> => <value 1>,\n<key 2> => <value 2>,\n\
    <key 3> => <value 3>,\n…\n<key n> => <value n>,\n);\n```\n\n映射键可以是任何类型，例如字符串、整数，甚至是布尔值。这是一个映射数组的示例：\n\
    \n```\n$intArray = array(\n'ONE' => 'aaa',\ntrue => 'bbb',\n3 => 'ccc',\n);\n\
    ```\n\n这比通常情况稍微复杂，因为你通常需要先设计节点。对于单向链表，你需要包含的数据和下一个节点：\n\n```\n// 抽象数据类型：链表，单向\n\
    // 链表中的每个元素由一个 Node 表示。\n// 一个 Node 包含：\n// - 数据项 (根据需要选择你想要的数据类型)\n// - 下一个节点\
    \ (Node Object)\n```\n\n对于双向链表，你需要数据项，以及前一个和下一个节点：\n\n```\n// 抽象数据类型：链表，双向\n//\
    \ 链表中的每个元素由一个 Node 表示。\n// 一个 Node 包含：\n// - 数据项 (根据需要选择你想要的数据类型)\n// - 前一个节点\
    \ (Node Object)\n// - 下一个节点 (Node Object)\n```\n\n## 第 13 章：自递归\n\n自引用——简称自递归是计算机编程中最重要的概念之一。自递归的核心思想是：给定某个初始输入，自递归函数会处理一个效果，然后用输入的减少或增强版本继续重复该效果。函数将持续重复，直到输入达到某种函数停止重复的状态。\n\
    \n自引用是处理数据集合的关键过程。给定，自递归函数会对集合中的每个项目重复其过程。函数将一直重复，直到没有数据项目需要处理，或者函数遇到了预期的解决方案。这个概念贯穿于简单和高级编程——包括算法、自动生成数据等。\n\
    \n### 自递归函数的组成\n\n让我们观察一个伪代码中的自递归函数示例：\n\n```\n// 输入：一个整数\n// 输出：无\n// 效果：给定一个正整数，打印\
    \ 10^(输入)，\n// 然后用输入减 1 重复，直到只打印 10\n// - 基本情况：输入 <= 0\n// - 递归步骤：用输入减 1 重复\n\n\
    void printPowerTen(integer i) {\n  // 基本情况：\n  if (i <=0) return;\n\n  // 递归步骤：\n\
    \  print 10 ^ i;\n  printPowerTen(i - 1); // 这自引用\n}\n```\n\n（记住：这个概念在许多编程语言中保持不变！）自递归函数具有普通函数的主要组件：可能的输入和输出以及效果。它还有两个额外的组件：基本情况（Base\
    \ Case）和递归步骤（Recursive Step）。\n\n"
