- raw: "void walk() {\n\n if (checkObstacle()) return\n\nleftFootStep()\n\nrightFootStep()\n\
    \n}\n\nDo you notice how much cleaner and simple the method walk() is now?\n\n\
    And if you had to debug something, it would be much more simple. If there’s an\
    \ error in the programming about checking obstacles or stepping with either foot,\
    \ you can focus on that specific helper function and any code inside it.\n\nPutting\
    \ it All Together\n\nThe concept behind helper functions is simple: for a bigger,\
    \ general function, give it a general purpose, then have it call other smaller\
    \ single-purpose functions to help achieve its purpose.\n\nThis applies to all\
    \ programming languages as well.\n\nChapter 9: Local Variables\n\nThe Function,\
    \ and Its Locals\n\nYou can define variables within a function/method to hold\
    \ key data for that function/method to use.\n\nThese are called Local Variables,\
    \ or locals for short.\n\nLater on, you will need locals for more advanced concepts,\
    \ such as accumulator variables and even within algorithms.\n\nLocal Variables\
    \ V.S. Global Variables\n\nHere are the key differences between Local and Global\
    \ variables.\n\nGlobal variables can be accessed and will exist throughout your\
    \ entire code file.\n\nLocal Variables can only be accessed within the functions/methods\
    \ they’re defined in. They’ll also be gone once your function finishes running.\n\
    \nDefining Locals\n\nIn most programming languages, you would simply define a\
    \ local variable as if you were defining a global one. The difference is that\
    \ you define the local variable within the function code only.\n\nHere is a pseudocode\
    \ example where we define local variables, as opposed to global variables:\n\n\
    String GLOBAL1 = “aaa”\n\nInteger GLOBAL2 = 123\n\nBoolean GLOBAL3 = TRUE\n\n\
    // INPUT: - none\n\n// OUTPUT: - none\n\n// EFFECT: ?????\n\nvoid functionName()\
    \ {\n\nString LOCAL1 = “aaa”\n\nInteger LOCAL2 = 123\n\nBoolean LOCAL3 = TRUE\n\
    \n}\n\nReferencing a Local Variable Properly\n\nThese next few rules may vary\
    \ depending on the programming language you’re working with, but these generally\
    \ apply to most of them (if not all).\n\nHere are some key rules in accessing\
    \ Global v.s. Local Variables:\n\n1) Local variables can only be accessed within\
    \ the same function code.\n\n2) Global variables can be accessed throughout the\
    \ code file - whether or not it’s accessed inside a function.\n\n3) Depending\
    \ on which programming language, local variable names may or may not have the\
    \ exact name as an existing global variable. If the language allows it, you might\
    \ need to distinctly identify which variable you are accessing.\n\nNow let’s take\
    \ a look at these lines of pseudocode:\n\nString GLOBAL1 = “aaa”\n\nInteger GLOBAL2\
    \ = 123\n\nBoolean GLOBAL3 = TRUE\n\nString SAMEVAR = “samevar”\n\n(any type)\
    \ ACCESS3 = \\_\\_\\_\\_\\_\\_\n\n// INPUT: - none\n\n// OUTPUT: - none\n\n//\
    \ EFFECT: ?????\n\nvoid function1() {\n\nString LOCAL1 = “aaa”\n\nInteger LOCAL2\
    \ = 123\n\nBoolean LOCAL3 = TRUE\n\nString SAMEVAR = “samevar”\n\n(any type) ACCESS1\
    \ = \\_\\_\\_\\_\\_\\_\n\n}\n\n// INPUT: - none\n\n// OUTPUT: - none\n\n// EFFECT:\
    \ ?????\n\nvoid function2() {\n\nString LOCAL4 = “aaa”\n\nInteger LOCAL5 = 123\n\
    \nBoolean LOCAL6 = TRUE\n\nString SAMEVAR = “samevar”\n\n(any type) ACCESS2 =\
    \ \\_\\_\\_\\_\\_\\_\n\n}\n\nThe code within function1() cannot access the locals\
    \ within function2(), and vice versa. Hence, ACCESS1 and ACCESS2 cannot refer\
    \ to any locals, respectively, within function2() and function1().\n\nBoth functions\
    \ can access the Global Variables. Hence, ACCESS1 and ACCESS2 can refer to any\
    \ global variable.\n\nHowever, any code outside the functions cannot access its\
    \ locals. Hence, ACCESS3 cannot refer to any locals within function2() and function1().\n\
    \nThe rules within each programming language will differ about the third rule.\
    \ If somehow our pseudocode allows local/global variables with same names, you’ll\
    \ need to identify which variable you’re referring to. For example, if ACCESS1\
    \ and ACCESS2 were to refer to SAMEVAR, they can refer to either the locals within\
    \ their respective functions, or refer to the global SAMEVAR:\n\n// refer to Local\n\
    \n(any type) ACCESS1 = SAMEVAR\n\n// or refer to Global\n\n(any type) ACCESS1\
    \ = global SAMEVAR\n\nPutting it All Together\n\nDespite a few rules about local\
    \ variables, you’ll find how important they’ll be in the chapters to come. Functions\
    \ with the ability to store data themselves will open many programming possibilities.\n\
    \nPART III: Operators and Logic\n\nChapter 10: Boolean Logic and Operators\n\n\
    For every line or expression that needs to return a Boolean, use these operators\
    \ to compare values together.\n\nIt’s best to compare Atomic Data Types, such\
    \ as Strings, Integers, Numbers and even Booleans themselves. Remember: Some programming\
    \ languages are more strict about what data types you use as values; and some\
    \ are more lax.\n\nYou can also compare Function and Method outputs, as we’ll\
    \ show later, but you have to make sure that they return the exact data types\
    \ that you’ll be comparing.\n\nBoolean Logic is particularly important for managing\
    \ more sophisticated algorithms, functions, and methods - so take note.\n\nBasic\
    \ Boolean Logic:\n\nThe three basic Boolean Operators are AND, OR, and NOT. Use\
    \ these to compare booleans together.\n\nSpeaking of comparing booleans, if you\
    \ compare booleans together using the boolean operators from above, you’ll get\
    \ a result based on the below:\n\nThe AND operator:\n\nUsing the AND operator,\
    \ comparing two values together will return TRUE - if, and only if, both values\
    \ are true. \n\nTRUE and TRUE returns TRUE\n\nTRUE and FALSE returns FALSE\n\n\
    FALSE and TRUE returns FALSE\n\nFALSE and FALSE returns FALSE\n\nThe OR operator:\n\
    \nComparing two values together using the OR operator will return TRUE - if at\
    \ least one value is true.\n\nTRUE or TRUE returns TRUE\n\nTRUE or FALSE returns\
    \ TRUE\n\nFALSE or TRUE returns TRUE\n\nFALSE or FALSE returns FALSE\n\nMultiple\
    \ Boolean Operators:\n\nYou can also compare multiple boolean values together.\
    \ But to keep things simple (and not mess up your code), make sure you’re only\
    \ comparing with either the AND or OR operator - but not both.\n\n(TRUE and FALSE\
    \ and FALSE and TRUE) returns FALSE\n\n(TRUE or FALSE or TRUE or FALSE) returns\
    \ TRUE\n\nThe NOT operator:\n\nYou can convert a single Boolean into its opposite\
    \ value using the NOT operator.\n\nnot TRUE returns FALSE\n\nnot FALSE returns\
    \ TRUE\n\nFunction Outputs and Variables\n\nYou can compare these values using\
    \ Boolean Operators with Functions that return a Boolean as a data type.\n\nHere’s\
    \ an example in Pseudocode:\n\n// INPUT: - two integers\n\n// OUTPUT: - Boolean\n\
    \n// EFFECT: check if 1st integer is larger than 2nd one\n\nBoolean check(Integer\
    \ a, Integer b) {\n\nreturn a > b\n\n}\n\n// will print TRUE\n\nprint(check(12,\
    \ 1) and check(100, 1))\n\nYou can also compare variables that hold booleans.\
    \ In most languages, they can be any variable type.\n\nHere’s an example in Pseudocode:\n\
    \n// Two Global Variables that hold Booleans\n\nBoolean YOUARECOOL = true\n\n\
    Boolean YOUAREAWESOME = true\n\n// will print TRUE\n\nprint(YOUARECOOL or YOUAREAWESOME)\n\
    \nChapter 11: Fundamental Programming Operators\n\nThese operators are designed\
    \ to either manipulate your data or compare/contrast two values together.\n\n\
    These operators are frequently used to develop functionality - from complex algorithms\
    \ to simple functions. Programmers will almost always use these operators well.\n\
    \nAn important note here is to use these operators with a purpose. The point behind\
    \ leaving comments to describe your code does just that. If you - or your colleague\
    \ - were trying to compare two values together, you would use comments to describe\
    \ what’s required. Afterwards, whoever is writing the actual code can add the\
    \ right functionality to your code.\n\nAgain, it’s best to compare Atomic Data\
    \ Types, such as Strings, Integers, Numbers and even Booleans themselves.\n\n\
    Just like the Boolean Operators, you can compare Function and Method outputs,\
    \ but you have to make sure that they return the exact data types that you’ll\
    \ be comparing.\n\nComparison operators:\n\nThese are what you use to compare\
    \ a value greater than/ less than /or equal to another value."
