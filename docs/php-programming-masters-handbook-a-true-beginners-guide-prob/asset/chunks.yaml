    \nHowever, you must make sure your function outputs whatever you have set it to.\
    \ Say, if you want your function to output a `String`, the very last line of that\
    \ function MUST return a `String` data type. If you set your function to have\
    \ no outputs, your function MUST NOT return any data types after it executes.\n\
    \nFor practice, let’s use comments to declare what outputs we want our function\
    \ to have. We’ll continue designing our function. We now have an input, now we\
    \ want to have an output.\n\n```php\n// INPUT: - a name (String)\n// OUTPUT: -\
    \ an ID (Number)\n```\n\n### Defining what your Function will Do\n\nNow we figure\
    \ out what EFFECT our function will have once we run it.\n\nThis is your function’s\
    \ main purpose - it’s the reason why you’re going to write these lines of code!\n\
    \nYour function’s effect will be whatever you intend it to do. Change data, create\
    \ new data, calculate a few values together, whatever you want.\n\nBut isn’t an\
    \ Output and Effect the same thing? Well, no.\n\nThere is a difference between\
    \ a function’s OUTPUT and EFFECT. A function’s output is the data it returns,\
    \ while a function’s effect is anything the function does or anything the function’s\
    \ action has affected.\n\nFor practice, let’s use comments to declare what effects\
    \ we want our function to have. We’ll continue designing our function. We now\
    \ have an input and output. Now we figure out what it does when we run it.\n\n\
    Let’s say we want it to come up with a random number. We first put in the comments\
    \ of what we intend it to do:\n\n```php\n// INPUT: - a name (String)\n// OUTPUT:\
    \ - an ID (Number)\n// EFFECT: generates a random number for a given name\n```\n\
    \n**Key Function Rule-of-Thumb:**\n\nMake sure your function only does the only\
    \ one thing you want it to do. A function that does too many things will not only\
    \ complicate your code and make it look bad, but it will cause headaches and frustration\
    \ for programming.\n\n### A Function’s Signature\n\nA function’s signature defines\
    \ its name, inputs, outputs, and even traits it has. In pseudocode, we’ll use\
    \ the following format for signatures:\n\n`(OutputType) functionName(InputType)`\n\
    \nSo our function’s signature will look like this:\n\n```php\n// INPUT: - a name\
    \ (String)\n// OUTPUT: - an ID (Number)\n// EFFECT: generates a random number\
    \ for a given name\nnumber createID(string name)\n```\n\n### Implementing your\
    \ Function\n\nThis can be the tricky part - unless you know exactly what you’re\
    \ doing. In designing functions, the last thing you do is to program your function’s\
    \ actual functionality. You now know what it does. Now you’ll have your function\
    \ do what you planned it to. You program the functionality in the next few lines\
    \ after your function’s signature. In pseudocode, we’ll use curly brackets `{\
    \ }` right after the function’s signature to include its functionality code. Our\
    \ functions will then be structured in this format:\n\n```php\n(OutputType) functionName(InputType)\
    \ {\n    (your function’s code)\n    return OutputType if any\n}\n```\n\nFinally,\
    \ let’s look back at the function we were designing for practice. We are ready\
    \ to finish it. Let’s say there’s such thing as a function named `randomNumber()`\
    \ that creates a random number for us.\n\n```php\n// INPUT: - a name (String)\n\
    // OUTPUT: - an ID (Number)\n// EFFECT: generates a random number for a given\
    \ name\nnumber createID(string name) {\n    randomNumber()\n}\n```\n\n### A Common\
    \ Error in Function Design\n\nBut wait. The above code isn’t going to work. Can\
    \ you guess why?\n\nOh right. In our signature, our function is supposed to RETURN\
    \ a number. So in order for this function to work, it needs to actually return\
    \ a number.\n\nSo we make the function RETURN whatever random number is generated\
    \ by the inside function `randomNumber()`:\n\n```php\n// INPUT: - a name (String)\n\
    // OUTPUT: - an ID (Number)\n// EFFECT: generates a random number for a given\
    \ name\nnumber createID(string name) {\n    return randomNumber()\n}\n```\n\n\
    And now, we finally complete our function - from design to code.\n"
  trans: "\n\n当你为数据设置了清晰的边界，但又有一些代码让你的数据超出了这些边界（且没有对其进行任何处理）时，这可能会以后给你的代码带来问题。\n\n\
    现在你已经理解追踪数据是多么重要。编程的许多方面都依赖于它，例如调试（Debugging）以及确保你的代码按照你预期的方式运行。\n\n# PHP 工作坊\
    \ #2\n\n## 篮球决赛\n\n假设两支球队之间有一场篮球比赛：东部冠军和西部冠军。\n\n以下是你代码的初始几行：\n\n```php\n// —————\n\
    // 西部队有一个得分（整数 Integer）\n$westTeam;\n\n// 东部队有一个得分（整数 Integer）\n$eastTeam;\n\n\
    // 比赛开始：\n$westTeam = 0;\n$eastTeam = 0;\n\n// 每一半节，\n// 每支队伍在 15 到 45 分之间获得随机数量的分数\n\
    // 第一节得分：\n$westTeam += rand(15, 45);\n$eastTeam += rand(15, 45);\n\n// 第二节得分：\n\
    $westTeam += rand(15, 45);\n$eastTeam += rand(15, 45);\n\n// 半场休息！！！\n// —————\n\
    ```\n\n现在是半场休息。\n\n你会如何修改上述代码来打印（PRINT）每支队伍的得分？\n\n哪支队伍在第一节得分更高？第二节呢？你如何知道？又如何展示出来？\n\
    \n另外，你会如何修改代码来添加第三节和第四节？\n\n在你选择的 IDE 中测试并运行你的代码。你也可以使用免费的 IDE，例如 [`rextester.com/runcode`](http://rextester.com/runcode)\n\
    \n# 第 5a 章：定义与设计你的函数\n\n现在我们将进入编程中发生魔法的部分。\n\n### 函数（Functions）。\n\n当数据结构被用来表示这个宇宙中的“事物”时，你就可以将函数定义为这个宇宙中的“动作”或动词。\n\
    \n只要你清楚自己在做什么，就可以让你的函数执行任何想要或需要它执行的操作。你可以计算数学题、为你写句子、更改或更新数据、对包含数万项目的列表进行排序、为你制作网站，随你所欲。在现实中，可能性是无限的。\n\
    \n但首先，让我们理解函数设计的核心部分：它的输入（inputs）、输出（output）、签名（signature）、影响（effects）和功能（functionality）。\n\
    \n### 函数的输入（Inputs）\n\n你可以设置你的函数接受任何你需要的数据。\n\n这些被称为函数的参数（arguments）或参数（parameters）。你的函数将使用这些传入的数据来执行你打算它执行的操作。\n\
    \n相反，你也可以让一个函数不需要任何输入。那么你的函数将执行你为其编写的程序，但它不需要任何传入的数据。\n\n为了练习，让我们使用注释来声明我们希望函数拥有的输入。假设我们想要一个名字（字符串）作为输入：\n\
    \n```php\n// INPUT: - 一个名字 (String)\n```\n\n### 函数的输出（Output）\n\n你的函数还可以返回一个数据值——基于你想要它设置的任何内容。然后你可以编写函数来输出相同的数据类型。\n\
    \n或者，你也可以让一个函数不返回任何内容。你可以编写函数来执行你打算它执行的操作，但它在执行后不会返回任何数据。\n\n在大多数编程语言中，函数只返回一个东西——无论是数据值、整个列表、复合数据还是更多。\n\
    \n然而，你必须确保你的函数输出了你设置的任何内容。例如，如果你想让函数输出一个 `String`，那么该函数的最后一行必须返回一个 `String` 数据类型。如果你将函数设置为无任何输出，那么你的函数在执行后绝对不能返回任何数据类型。\n\
    \n为了练习，让我们使用注释来声明我们希望函数拥有的输出。我们将继续设计我们的函数。现在我们有了输入，现在我们想要一个输出。\n\n```php\n// INPUT:\
    \ - 一个名字 (String)\n// OUTPUT: - 一个 ID (Number)\n```\n\n### 定义你的函数将做什么\n\n现在我们确定一旦运行函数后，它会产生什么影响（EFFECT）。\n\
    \n这是你函数的主要目的——这也是你编写这些行代码的原因！\n\n函数的影响将是你打算它执行的任何事情。更改数据、创建新数据、共同计算几个值，随你所欲。\n\
    \n但输出（Output）和影响（Effect）不是同一回事吗？不，不是的。\n\n函数的输出（OUTPUT）和影响（EFFECT）之间存在区别。函数的输出是它返回的数据，而函数的影响是函数所做的任何事情或函数的动作所影响的任何事情。\n\
    \n为了练习，让我们使用注释来声明我们希望函数产生什么影响。我们将继续设计我们的函数。现在我们有了输入和输出。现在我们确定它在运行时会做什么。\n\n假设我们让它生成一个随机数。我们首先在注释中写下我们打算它执行的操作：\n\
    \n```php\n// INPUT: - 一个名字 (String)\n// OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\n\
    ```\n\n**函数关键准则（Rule-of-Thumb）：**\n\n确保你的函数只做你想要它做的一件事。做太多事情的函数不仅会让你的代码变得复杂，还会让它看起来糟糕。\n\
    \n### 函数签名（Signature）\n\n函数的签名定义了它的名称、输入、输出，甚至它拥有的特征。在伪代码中，我们使用以下格式定义签名：\n\n`(OutputType)\
    \ functionName(InputType)`\n\n所以我们的函数签名如下：\n\n```php\n// INPUT: - 一个名字 (String)\n\
    // OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name)\n\
    ```\n\n### 实现你的函数\n\n这可能是最困难的部分——除非你清楚自己在做什么。在设计函数时，最后最后一步是编写函数的实际功能。你现在知道它要做什么了。现在你让函数执行你计划的操作。你在函数签名的后续几行编写功能。在伪代码中，我们在函数签名之后使用大括号\
    \ `{ }` 来包含功能代码。我们的函数结构如下：\n\n```php\n(OutputType) functionName(InputType) {\n\
    \    (你的函数代码)\n    return OutputType 如果\n}\n```\n\n最后，让我们回顾我们为练习设计的函数。我们准备好完成它了。假设有一个名为\
    \ `randomNumber()` 的函数可以为生成随机数。\n\n```php\n// INPUT: - 一个名字 (String)\n// OUTPUT:\
    \ - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name) {\n \
    \   randomNumber()\n}\n```\n\n### 函数设计中的常见错误\n\n等一下。上面的代码无法运行。你能猜到为什么吗？\n\n哦对。在我们的签名中，我们的函数应该返回一个数字。因此，为了让这个函数工作，它必须实际返回一个数字。\n\
    \n所以让函数返回内部函数 `randomNumber()` 生成的任何随机数：\n\n```php\n// INPUT: - 一个名字 (String)\n\
    // OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name)\
    \ {\n    return randomNumber()\n}\n```\n\n现在，我们终于完成了我们的函数——从设计到代码。\n\n"
