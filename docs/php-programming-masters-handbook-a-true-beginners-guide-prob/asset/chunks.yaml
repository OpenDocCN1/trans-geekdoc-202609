    \ - 它看起来像一棵“树”。\n\n在这种情况下，一个节点最多有两个子节点，它看起来像一棵二叉树：![pasted-image.png](img/00001.jpeg)\n\
    \n#### 二叉树的用途\n\n树结构通常来说是计算中最重要的数据结构之一。对于搜索和答案生成算法尤其如此。\n\n二叉树特别是，是最简单的树结构之一。数据的布局方式使得递归算法可以处理每个节点和它的子节点。\n\
    \n为了让你直观理解二叉树的工作原理，这里有一个例子。\n\n我正在想一个 1 到 100 之间的随机数。如果你猜数字是多少，我会告诉你高、低，或者你猜对了。所以，如果你说\
    \ 50，我会告诉你高还是低（不是 50；所以继续猜），然后你再猜一次，我会告诉你高还是低，以此类推，直到你得到答案。\n\n#### 二二叉树规则\n\n\
    在核心范围内，有效的二叉树应该具备以下条件：\n\n- 每个树节点代表某些数据：原子数据或复合数据即可\n- 每个节点最多有两个子节点：左节点和/或右节点\n\
    - 如果一个节点没有子节点，它被称为叶节点（Leaf node）\n\n"
