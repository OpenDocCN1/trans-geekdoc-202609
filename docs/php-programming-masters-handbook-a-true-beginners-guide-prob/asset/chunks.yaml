    \ 6: Intro to Designing Worlds & Simple Apps, PT1\n\nAt this point, you know how\
    \ to interpret real-life objects as computer data representations, as well as\
    \ interpreting actions & procedures as programming functions.\n\nNow, you’ll begin\
    \ the design process. You start to describe virtual worlds and apps, almost always\
    \ visually. You prepare to translate your ideas into code and data.\n\nJust as\
    \ if you were a carpenter thinking of how to build your house, you use the same\
    \ approach towards developing apps and game worlds. You identify all the components\
    \ required to build your project.\n\nSimple App Design Process\n\nThere are three\
    \ key things about your idea that you need to identify: the facts behind your\
    \ idea, what remains constant, and what will change/vary.\n\nThe reason for this\
    \ is to give you and other programmers as much control and stability over your\
    \ data as possible. You would know what type of data you would be working with\
    \ and if/how that data would or would not change. Experienced programmers can\
    \ then check if a particular data structure or function is designed the way it\
    \ was intended to be.\n\nTo guide you through this process, we’ll describe the\
    \ classic Snake game - and identify plenty of details about the game from a programmer’s\
    \ standpoint. It will be as if we’re designing the game for the first time. As\
    \ if we’re in the 70’s.\n\nIdentifying the FACTS\n\nFirst, you need the facts.\
    \ You need to describe what your idea is about, what’s involved, etc. Describe\
    \ as much detail as you can, including the environment and key figures you provide.\n\
    \nExample:\n\nIn a single game of Snake, there exists a snake with a head and\
    \ body, as well as food items that appear randomly. The snake’s head, all segments\
    \ of its body, and the food pieces have an X-Y coordinate and a visual representation\
    \ (since they have similar traits, they can be grouped together as a game sprite).\
    \ An X-Y coordinate represents a location within the playable zone: a rectangular\
    \ area with a height and width. A score keeps track of how many food items have\
    \ been eaten.\n\nThe player changes which direction the snake will travel to:\
    \ up, down, left, and right. The game ends when the snake either hits a wall or\
    \ runs into one of its body segments.\n\nThe snake grows by one body segment after\
    \ the snake head “eats a food item” (appears on the same coordinate as a food\
    \ item).\n\n\\[food\\] + \\[head\\] \\[body\\] \\[body\\]\n\n\\=\n\n\\[head\\\
    ] \\[body\\] \\[body\\] \\[body\\]\n\nIdentifying what’s CONSTANT\n\nSecond, you\
    \ need to identify what elements in your world or app remain consistent throughout\
    \ the programming. Also, identify what will exist in your idea unconditionally.\n\
    \nExample:\n\nThe food items, snake head, and body segments have consistent images.\n\
    \nThe playing board has a fixed width and height.\n\nIdentifying what CHANGES/VARIES\n\
    \nThird, identify what will change or vary when the program runs.\n\nExample:\n\
    \nThe food items, snake head, and body segments all have varying X-Y coordinates\
    \ throughout the game. The number of body segments vary, from the initial number\
    \ of 2, all the way to as much as possible.\n\nTurning your ideas into code\n\n\
    Now, you take note of all the facts, descriptions, and ideas you’ve come up with.\
    \ You’ll be making data representations of them.\n\nEarly in the book, there is\
    \ a great reason why we’ve used comments to describe all the information we are\
    \ going to create. It’s because they help select the best possible data representation\
    \ for each pint of information you have. And after you’ve described what your\
    \ app or world will be about, you’ll start developing that digital world first\
    \ by using comments.\n\nExample:\n\nFor each fact and idea about the Snake game\
    \ that we’ve come up with, we’ll use comments to hint how they should be represented\
    \ by data.\n\n// A Game Sprite has:\n\n// - an X-coordinate (Integer)\n\n// -\
    \ a Y-coordinate (Integer)\n\n// - an image to represent itself (choose your visual\
    \ representation)\n\n// Snake Heads, Snake Body Segments, and Food Pieces\n\n\
    // are each represented by Game Sprites\n\n// An EntireSnake contains:\n\n// -\
    \ a Snake Head (GameSprite)\n\n// - a list of Snake Body Segments (list of GameSprites)\n\
    \n// A FullSnake can:\n\n// - eat food\n\n// - grow\n\n// - move on the board\n\
    \n// The Playable Board has:\n\n// - a fixed length (Integer)\n\n// - a fixed\
    \ width (Integer)\n\n// A Game of Snake has:\n\n// - a playable board (Playable\
    \ Board Class)\n\n// - food items (list of Food)\n\n// - the Snake (EntireSnake)\n\
    \n// - a Score Count (Integer)\n\n// A Game of Snake can:\n\n// - start a new\
    \ game\n\n// - end the game (as a loss or win)\n\n// - update a game in progress\n\
    \n// - update the score\n\n// - move the snake on keypresses\n\n// - create or\
    \ delete food items\n\nNotice how there is no actual code written yet; only comments.\
    \ The beauty of this process is that, given the facts and ideas (as well as their\
    \ data representations), we can start creating the code in any language we want.\
    \ We now know what will be data structures, classes, integers, and so on.\n\n\
    We do need to go over more tools, so we will continue with design later on.\n\n\
    Meanwhile, in the next big workshop, you will be converting idea comments into\
    \ actual code. Good luck and have fun!\n\nPHP BIG Workshop A\n\nGame Design: the\
    \ Data & Functions\n\nFirst, go to an IDE of your choice. Online IDE’s include\
    \ Rextester ([rextester.com](http://rextester.com)), CodeChef ([www.codechef.com/ide](http://www.codechef.com/ide)),\
    \ and Ideone ([https://ideone.com/](https://ideone.com/)).\n\nYou’re going to\
    \ practice designing Data Structures and Functions - as if you were designing\
    \ an app yourself.\n\nAll you’ll be given is a set of comments describing the\
    \ data objects within a very, very simple video game. If you can, you may continue\
    \ developing it into a full-blown game.\n\nCopy and paste all the comment code\
    \ below, then start writing code for the data definitions.\n\nAs you improve your\
    \ programming and learn more tricks over time, you can revisit this workshop and\
    \ re-create it using your new skills.\n\nFor example: for the functions and class\
    \ methods, they might need more intermediate functionality. So you can come back\
    \ to them later - after going through the necessary chapters.\n\nIf you feel like\
    \ you want to create or remove new Fields, Classes, or Methods, feel free to do\
    \ so.\n\nNow, let’s move forward.\n\nThe game we’ll be designing is…\n\nPONG!\n\
    \nGood luck!\n\n// - - - - - - - - - - - - - - - - - - - - - - - - -\n\n// A Game\
    \ Sprite Class has:\n\n// - a Width (Integer)\n\n// - a Height (Integer)\n\n//\
    \ - an X-coordinate (Integer)\n\n// - a Y-coordinate (Integer)\n\n// A Ball Class\
    \ has:\n\n// - all properties of a Game Sprite\n\n// - either an UP or DOWN direction\
    \ (String)\n\n// - either a LEFT or RIGHT direction (String)\n\n// A Ball Class\
    \ can:\n\n// - move in all 4 diagonal directions\n\n// - bounce off Paddles or\
    \ the Game Board Up/Down Walls\n\n// A Paddle Class has:\n\n// - all properties\
    \ of a Game Sprite\n\n// A Paddle Class can:\n\n// - move up & move down\n\n//\
    \ A Player Class has:\n\n// - a Paddle\n\n// - a Score (Integer)\n\n// A Player\
    \ Class Can:\n\n// - Score a Goal\n\n// a Game Board has:\n\n// - a Width (Integer)\n\
    \n// - a Height (Integer)\n\n// - two X-Coordinates for Player-side Edges (Integers,\
    \ set to 0 and Width)\n\n// - two Y-Coordinates for Up-Down Walls (Integers, set\
    \ to 0 and Height)\n\n// A Game Class has:\n\n// - two Paddles\n\n// - a Ball\n\
    \n// - a Game Board\n\n// - a Player on the Left\n\n// - a Player on the Right\n\
    \n// - a Game Speed (Strings: “SLOW” “MEDIUM”, or “FAST”)\n\n// - a Timer (a Number,\
    \ Integer, or any other Data Type you like)\n\n// When Created, A Game Instance\
    \ also creates:\n\n// - a Paddle for the Left Player\n\n// - a Left Player\n\n\
    // - a Right Player\n\n// - a Paddle for the Right Player\n\n// - a Ball, moving\
    \ at a given random direction\n\n// A Game Class can:\n\n// - manage a goal scored\
    \ by either player\n\n// - end the game\n\n// - declare a winning player"
