    \ functions to have this; it helps ensure your function process the way you intend\
    \ it to be.\n\nIn our example, the function is definitely self-recursive. There\
    \ is a process to increment the input by one, then the function repeats itself\
    \ using that input.\n\n```\nprintPowerTen(i - 1); // this is the self-reference\n\
    ```\n\n### The Recursive Rule of thumb: TRUST THE RECURSION\n\nYou’ve defined\
    \ what your function limit is. It’s on your `Base Case`.\n\nNow as long as your\
    \ self-reference function is tail recursive, and the recursive function call’s\
    \ input is changed to a step closer to the base case, then your function should\
    \ operate repeatedly over and over until it reaches a base case.\n\nAs long as\
    \ you have these pieces in place, your recursive function should process as planned.\
    \ You just need to Trust the Recursion.\n\nGet your base case defined, call the\
    \ function recursively, and set that input to inch closer to the base case.\n\n\
    ### Defining the Function\n\nWhile the function input and output will vary for\
    \ each situation, the effect will remain consistent: the function will keep repeating\
    \ and producing its desired effect until it hits its base case limit.\n\n```\n\
    // INPUT: ____\n// OUTPUT: ____\n// EFFECT: ____\n// - Base Case: function has\
    \ reached a limit\n// - Recursive Step: variable/input, with a step closer to\
    \ reaching limit\n```\n\nHere’s an example:\n\n```java\n// INPUT: - Array of Strings,\
    \ and a String Length (Integer)\n// OUTPUT: - Array of Strings\n// EFFECT: Returns\
    \ an array of Strings that have the given string length\n// - Base Case: function\
    \ has no more Array Elements to process\n// - Recursive Step: Repeat without recently\
    \ processed String\n\nArray[String] matchLength(Array[String] stringArray, Integer\
    \ length) {\n    …\n}\n```\n\n## Chapter 14: Iteration Loops\n\nOnce you understand\
    \ how recursive functions work, you’ll understand how the next two chapters (iteration\
    \ and while loops) are to self-recursion.\n\nIn essence, self-recursion, iteration\
    \ loops, and while-loops have the same concept: repeat a process over and over,\
    \ with each repeat a step closer to reaching some limit, then stop repeating and\
    \ move on.\n\nSelf-Recursion, Iteration Loop, and While Loop functions will almost\
    \ always involve some data collection, integer, or some number.\n\n### Parts of\
    \ the For-Loop Function\n\nLet’s observe a for-loop Function example in Pseudocode:\n\
    \n```cpp\n// INPUT: an Integer\n// OUTPUT: none\n// EFFECT: Given a positive integer,\
    \ prints (input),\n// then repeats and prints input - 1, then afterwards\n// prints\
    \ “WE HAVE LIFT OFF”\n// - Start: given input\n// - Continue: counting integer\
    \ is > 0\n// - Repeating Step: Repeat with input - 1\n\nvoid printCountdown(integer\
    \ input) {\n    // this is the for-loop\n    for (integer i = input; i > 0; input--)\
    \ {\n        //this is the looped procedure\n        print(i);\n    }\n    //\
    \ this occurs after the for-loop ends\n    print(“WE HAVE LIFT OFF”)\n}\n```\n\
    \n(remember: this concept will remain the same throughout many programming languages!)\n\
    \nA for-loop function will also have the main components of a regular function:\
    \ possible inputs and outputs, and an effect.\n\nIt will also have the three key\
    \ components in an iteration loop: the start value, the continuing condition,\
    \ and the next step. These describe how the loop will iterate and repeat a process.\n\
    \nHow? The for-loop will use a counting integer, set it to the start value, process\
    \ the looped procedure, then modify the counting integer. The for-loop will repeat\
    \ the looped procedure over and over until the counting integer is at a certain\
    \ value - a point where the continuing condition decides to stop.\n\n### The Iteration’s\
    \ Start & Ends\n\nFirst, use an integer and give it a starting value - say, zero.\n\
    \nNext, define what the integer value should be in order to continue repeating:\
    \ the continuing condition.\n\n```cpp\n// - Start: 0\n// - Continue: counting\
    \ integer < given input\n\n// this is the for-loop\nfor (integer i = 0; input\
    \ > i; … ) {\n```\n\nYou can also have your iteration loop inversely; the starting\
    \ value as some integer and the continuing condition as the counting integer greater\
    \ than 0.\n\n```cpp\n// - Start: given input\n// - Continue: input is > 0\n\n\
    // this is the for-loop\nfor (integer i = input; i > 0; … ) {\n```\n\n### The\
    \ Iteration’s Next Step\n\nRegardless, of what the start value and continuing\
    \ condition should be, the next-step should change the counting integer value.\
    \ Increment or decrement the integer to inch closer to disabling the continuing\
    \ condition.\n\n```cpp\n// - Repeating Step: Repeat with input - 1\n\n// this\
    \ is the for-loop\nfor ( … input--)) {\n```\n\nThis is comparable to the self-reference\
    \ function call in the previous chapter. The for-loop will repeat the process\
    \ within that loop, then change the counting integer.\n\nIt then repeats until\
    \ the counting integer eventually causes the continuing condition to no longer\
    \ repeat.\n\n### Defining the Function, Inputs & Outputs\n\nThe function input\
    \ and output varies, depending on the situation. However, the effect will remain\
    \ consistent: the function will keep iterating and producing its desired effect\
    \ until it hits its base case limit.\n\nThere are two commonly used versions,\
    \ depending on how the iterating components are configured.\n\n#### Iterating\
    \ Up\n```\n// INPUT: ____\n// OUTPUT: ____\n// EFFECT: ____\n// - Start: 0\n//\
    \ - Continue: (set a limit) > counting integer\n// - Repeating Step: (counting\
    \ integer +1)\n```\n\n#### Iterating Down\n```\n// INPUT: ____\n// OUTPUT: ____\n\
    // EFFECT: ____\n// - Start: (set a starting value)\n// - Continue: 0 < counting\
    \ integer\n// - Repeating Step: (counting integer -1)\n```\n\nUsing the array\
    \ below, here’s an example for each version, in pseudocode:\n\n// an Array of\
    \ Names (Strings)\n"
  trans: "\n要检查函数是否已达到基准情况（base case），请注意上面使用的 `IF` 语句：作为一个条件，它检查输入是否已达到基准情况。如果为，函数返回并结束。\n\
    \n## 实现函数：基准情况\n\n`Base Case`基准情况）始终是`Self-Recursive Function”（自递归函数）的第一个组件。\n\
    \n你需要设置你的自递归函数限制。这可以是当没有更多数据项需要处理时，或者某个变量或输入达到了最小值/最大值。一旦你的自递归函数遇到该限制，函数就应该停止重复并结束。\n\
    \n在上面的示例中，当输入不是正整数时设置了 `base case`——本质上就是当它是 `0` 或以下时。每当该情况成为函数输入时，函数将返回并结束。\n\
    \n```\n// - Base Case: input is <= 0\n\n//Base Case:\nif (i <=0) return;\n```\n\
    \n此外，仔细观察。记得我们在上一个章节中过的 `IF` 语句吗？自递归函数将利用该概念来检查 `Base Case`。\n\n### 为什么你需要基准情况\n\
    \n如果没有合适的基准情况，自递归函数将永远处理下去——这被称为 `Infinite Loop`无限循环。尽管输入已经减少或增加，函数将继续重复其过程。它将不知道如何停止处理，因此将一直持续下去。\n\
    \n“吃、睡、狂欢、重复”\n\n## 递归步骤：自引用\n\n`Recursive Step`递归步骤）中包含两个主要组件：函数效果和对相同函数的调用。该函数调用需要一个让输入更接近\
    \ `Base Case` 的输入\n\n就像典型的函数一样，效果就是你想要让函数执行的操作。\n\n对相同函数的调用定义了它是一个`Self-Recursive\
    \ function`自递归函数。注意在示例的最后一行，有一个对相同函数的调用。然而，最重要的是，该函数中的输入减了 `1`。它最终将一直减到 `0`——`Base\
    \ Case`！\n\n```\n// - Recursive Step: Repeat with input - 1\n\n// Recursive Step:\n\
    print 10 ^ i;\nprintPowerTen(i - 1); // this is the self-reference\n```\n\n###\
    \ 尾递归\n\n当一个`Self-reference Function`自引用函数）的程序最后一行是对其自身的调用时，它是尾递归的。你希望你的自递归函数具有这一点；这有助于确保你的函数按照你预期的方式运行。\n\
    \n在我们的示例中，该函数是自递归的。有一个将输入加一的过程，然后函数使用该输入重复自身。\n\n```\nprintPowerTen(i - 1); //\
    \ this is the self-reference\n```\n\n### 递归的准则：信任递归\n\n你已经定义了你的函数限制是什么。它就在你的 `Base\
    \ Case`上。\n\n现在，只要你的自引用函数是尾递归的，并且递归函数调用的输入变为更接近基准情况的一步，那么你的函数应该就会反复运行，直到达到基准情况。\n\
    \n只要这些组件到位，你的递归函数就应该按计划处理。你只需要信任递归。\n\n定义好你的基准情况，递归地调用函数，并设置该输入逐步趋近基准情况。\n\n###\
    \ 定义函数\n\n虽然函数的输入和输出随每种情况而异，但效果将保持一致：函数将不断重复并产生其期望的效果，直到它达到其基准情况限制。\n\n```\n//\
    \ INPUT: ____\n// OUTPUT: ____\n// EFFECT: ____\n// - Base Case: function has\
    \ reached a limit\n// - Recursive Step: variable/input, with a step closer to\
    \ reaching limit\n```\n\n这里是一个示例：\n\n```java\n// INPUT: - Array of Strings, and\
    \ a String Length (Integer)\n// OUTPUT: - Array of Strings\n// EFFECT: Returns\
    \ an array of Strings that have the given string length\n// - Base Case: function\
    \ has no more Array Elements to process\n// - Recursive Step: Repeat without recently\
    \ processed String\n\nArray[String] matchLength(Array[String] stringArray, Integer\
    \ length) {\n    …\n}\n```\n\n## 第 14 章：迭代循环\n\n一旦你理解了递归函数是如何工作的，你就会理解接下来的两个章节（迭代和\
    \ while 循环）是如何对应自递归的。\n\n本质上，自递归、迭代循环和 while 循环具有相同的概念：反复执行一个过程，每次重复都更接近某个限制，然后停止重复并继续后续。\n\
    \n自递归、迭代循环和 while 循环函数几乎总是涉及某些数据收集、整数或某些数字。\n\n### For-循环函数的组成\n\n让我们在伪代码中观察一个\
    \ for-loop 函数示例：\n\n```cpp\n// INPUT: an Integer\n// OUTPUT: none\n// EFFECT:\
    \ Given a positive integer, prints (input),\n// then repeats and prints input\
    \ - 1, then afterwards\n// prints “WE HAVE LIFT OFF”\n// - Start: given input\n\
    // - Continue: counting integer is > 0\n// - Repeating Step: Repeat with input\
    \ - 1\n\nvoid printCountdown(integer input) {\n    // this is the for-loop\n \
    \   for (integer i = input; i > 0; input--) {\n        //this is the looped procedure\n\
    \        print(i);\n    }\n    // this occurs after the for-loop ends\n    print(“WE\
    \ HAVE LIFT OFF”)\n}\n```\n\n（记住：这个概念在许多编程语言中将保持一致！）\n\nfor-loop 函数也将具有普通函数的主要组件：可能的输入和输出，以及效果。\n\
    \n它还将具有迭代循环的三个关键组件：起始值、继续条件和下一步。这些描述了循环将如何迭代和重复一个过程。\n\n如何做到的？for-loop 将使用一个计数整数，将其设置为起始值，处理循环过程，然后修改计数整数。for-loop\
    \ 将反复执行循环过程，直到计数整数达到某个特定值——一个继续条件决定停止的点。\n\n### 迭代的开始与结束\n\n首先，使用一个整数并给它一个起始值——例如，零。\n\
    \n接下来，定义为了继续重复整数值应该是多少：继续条件。\n\n```cpp\n// - Start: 0\n// - Continue: counting\
    \ integer < given input\n\n// this is the for-loop\nfor (integer i = 0; input\
    \ > i; … ) {\n```\n\n你也可以反过来使用迭代循环；起始值为某个整数，继续条件为计数整数大于 0。\n\n```cpp\n// - Start:\
    \ given input\n// - Continue: input is > 0\n\n// this is the for-loop\nfor (integer\
    \ i = input; i > 0; … ) {\n```\n\n### 迭代的下一步\n\n无论起始值和继续条件是什么，下一步应该改变计数整数的值。增加或减少整数以逐步接近禁用继续条件。\n\
    \n```cpp\n// - Repeating Step: Repeat with input - 1\n\n// this is the for-loop\n\
    for ( … input--)) {\n```\n\n这与前一个章节中的自引用函数调用相当。for-loop 将重复循环内的过程，然后更改计数整数。\n\n\
    然后它一直重复，直到计数整数最终导致继续条件不再重复。\n\n### 定义函数、输入与输出\n\n函数的输入和输出随情况而异。然而，效果将保持一致：函数将不断迭代并产生其期望的效果，直到它达到基准情况限制。\n\
    \n有两种常用的版本，取决于迭代组件的如何配置。\n\n#### 向上迭代\n```\n// INPUT: ____\n// OUTPUT: ____\n\
    // EFFECT: ____\n// - Start: 0\n// Continue: (set a limit) > counting integer\n\
    // - Repeating Step: (counting integer +1)\n```\n\n#### 向下迭代\n```\n// INPUT: ____\n\
    // OUTPUT: ____\n// EFFECT: ____\n// - Start: (set a starting value)\n// - Continue:\
    \ 0 < counting integer\n// - Repeating Step: (counting integer -1)\n```\n\n使用下面的数组，是每个版本的示例，采用伪代码形式：\n\
    \n// an Array of Names (Strings)\n\n"
