    // - 一个游戏速度（字符串：“SLOW”、“MEDIUM”或“FAST”）

    // - 一个计时器（数字、整数或你喜欢的任何其他数据类型）


    // 创建时，游戏实例还会创建：

    // - 左侧玩家的拍板

    // - 左侧玩家

    // - 右侧玩家

