    \ (the Input Integer), the while-loop will repeat.\n\n…\n\n// \\- Repeat if: counting\
    \ integer < (set a limit)\n\n…\n\nwhile (LOCALCOUNTER < n) {\n\n….\n\nThe Repeating\
    \ Code\n\nAs you can guess, this portion of the code will keep repeating as long\
