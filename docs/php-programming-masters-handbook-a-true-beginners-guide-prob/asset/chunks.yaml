- raw: 'Find them throughout the book!


    \========================= ======


    Prelude: Atomic Data Types


    First off, we’ll briefly start with primitive data types. It’s important to know
    what they are, because you’ll be identifying real-life information with them later.


    Booleans


    Booleans, often called bools, are either TRUE or FALSE. This is the simplest data
    type, but often one of the most important. A LOT of functionality depends on Booleans,
    as you will find out later


    A Boolean will always be a two-state situation. For example, the lights in your
    living room are either on (TRUE) or off (FALSE).


    Integers


    These are all the standard whole numbers, both positive and negative. The highest
    and lowest integers depend on the number of bits to represent them (i.e. 8-bit
    integers, 16-bit, etc.). Mathematic and boolean operators often use Integers,.i.e.


    10 + 50 == 60,


    \-4 - 12, != -10,


    and so on.


    Characters


    These are all letters and symbols that can be represented by ASCII characters.
    Think of one character as a single symbol or letter.


    Floats


    Formally called floating-point numbers, these represent decimals - including the
    decimal point and decimal numbers beyond.


    Examples:


    2.3


    0.75


    Prelude: Data Sequences & Combinations


    Strings


    These are merely a collection of Characters in sequence. Think of these as words
    or phrases.


    In most programming languages, Strings are represented by a sequence of characters
