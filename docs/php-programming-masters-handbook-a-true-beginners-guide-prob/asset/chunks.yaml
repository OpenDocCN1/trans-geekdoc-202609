- raw: 'There are many different subtypes of binary trees, each with its own set of
    additional structure rules. For example: there are Binary Search Trees, Minimum
    Heaps, Maximum Heaps, AVL Trees, and more.


    The Data Structure


    For each node in a binary tree, it will either have left/right sub-nodes nodes,
    or have no nodes at all (these are called leaf nodes).


    Here is some general pseudocode below. You can implement your Binary Tree node
    on any programming language you wish, depending on what you need to be done.


    // A Binary Tree Node contains:


    // - a data key (whatever data type you want)


    // - a Left Sub-Node (either a BTreeNode or NULL)


    // - a Right Sub-Node (either a BTreeNode or NULL)


    CompositeStructure BTreeNode {


    <data type of your choice> key


    BTreeNode LEFT


    BTreeNode RIGHT


    }


    General Processing Function:


    If you''ve read this far, you may have gone over self-recursive functions already
    (if not, you may want to go back and quickly skim through). The general function
    resembles a self-recursive function, with a base case and two self-recursive calls
    for both left and right sub-nodes.


    The general algorithm for processing a Binary Tree is below:


    // INPUT: - a Binary Tree Node


    // OUTPUT: - <choose your output data type>


    // EFFECT: \_\_\_\_\_


    // \- Base Case: input is NULL


    // - Recursive Steps: recursive call to left & right sub-trees


    <chosen output data type> procBTree(BTreeNode n) {


    // BASE CASE:


    if (n == NULL) {


    return <chosen output data type>


    }


    // MAIN PROC:


    // whatever code you want here


    // RECURSIVE CALL: LEFT TREE


