    \n## 整合一切\n\n辅助函数背后的概念非常简单：对于一个较大的通用函数，赋予它一个通用的目标，然后让它调用其他较小的、单一目的函数来帮助实现该目标。\n\
    \n这也适用于所有的编程语言。\n\n## 第 9 章：局部变量\n\n### 函数及其局部变量\n\n你可以在函数/方法内部定义变量，以存储该函数/方法使用的关键数据。\n\
    \n这些变量被称为 `Local Variables`（局部变量），简称为 `locals`。\n\n以后，你将在更高级的概念中需要 `locals`，例如累加器变量，甚至在算法内部。\n\
    \n### 局部变量 VS 全局变量\n\n以下是 `Local`（局部）变量与 `Global`（全局）变量之间的主要区别。\n\n`Global variables`（全局变量）可以被访问，并在你的整个代码文件中一直存在。\n\
    \n`Local Variables`（局部变量）只能在定义它们的函数/方法内部被访问。一旦函数运行结束，它们也会消失。\n\n### 定义局部变量\n\n\
    在大多数编程语言中，你定义局部变量的方式就像定义全局变量一样。区别在于，你只在函数代码内部定义局部变量。\n\n这是一个伪代码示例，展示了定义局部变量而非全局变量：\n\
    \n```text\nString GLOBAL1 = “aaa”\nInteger GLOBAL2 = 123\nBoolean GLOBAL3 = TRUE\n\
    \n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\nvoid functionName()\
    \ {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2 = 123\n  Boolean LOCAL3 = TRUE\n\
    }\n```\n\n### 正确引用局部变量\n\n以下几条规则可能会根据你使用的编程语言而异，但它们通常适用于大多数语言（如果不是所有）。\n\n以下是访问\
    \ `Global` 变量与 `Local Variables` 的一些关键规则：\n\n1) `Local variables`（局部变量）只能在同一个函数代码内部被访问。\n\
    2) `Global variables`（全局变量）可以在整个代码文件中被访问 - 无论是否在函数内部访问。\n3) 取决于具体的编程语言，局部变量名可能与现有全局变量名称完全相同，也可能不同。如果语言允许，你可能需要明确区分你正在访问的是哪个变量。\n\
    \n现在让我们来看这几行伪代码：\n\n```text\nString GLOBAL1 = “aaa”\nInteger GLOBAL2 = 123\nBoolean\
    \ GLOBAL3 = TRUE\nString SAMEVAR = “samevar”\n(any type) ACCESS3 = \\_\\_\\_\\\
    _\\_\\_\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\nvoid function1()\
    \ {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2 = 123\n  Boolean LOCAL3 = TRUE\n\
    \  String SAMEVAR = “samevar”\n  (any type) ACCESS1 = \\_\\_\\_\\_\\_\\_\n}\n\n\
    // INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\nvoid function2() {\n\
    \  String LOCAL4 = “aaa”\n  Integer LOCAL5 = 123\n  Boolean LOCAL6 = TRUE\n  String\
    \ SAMEVAR = “samevar”\n  (any type) ACCESS2 = \\_\\_\\_\\_\\_\\_\n}\n```\n"
