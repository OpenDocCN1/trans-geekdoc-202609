  \n娱乐与旅行合计：3900\n\n银行账户余额（正常状态）：2400\n\n银行账户余额（含娱乐支出）：1200\n\n祝你好运！\n\n## 第 6 章：世界设计与简单应用入门，第一部分\n\
  \n此时，你已经学会了如何将现实物体解释为计算机数据表示，以及将动作和程序解释为编程函数。\n\n现在，你将开始设计过程。你开始描述虚拟世界和应用，而且几乎总是视觉化的方式。你正准备将你的想法转化为代码和数据。\n\
  \n就像木工思考如何建造自己的房子一样，你在开发应用和游戏世界时也采用相同的方法。你识别构建项目所需的所有组件。\n\n### 简单应用设计流程\n\n关于你的想法，有三点关键内容你需要识别：想法背后的事实、保持不变的部分，以及将会发生变化/差异的部分。\n\
  \n这样做的是为了让你和其他程序员对数据拥有尽可能多的控制和稳定性。你将知道自己正在处理什么类型的数据，以及这些数据是否会或如何发生变化。丰富的程序员随后可以检查特定的数据结构或函数设计是否符合预期。\n\
  \n为了引导你完成这一过程，我们将描述经典的贪吃蛇游戏——并从程序员的角度识别大量关于游戏的细节。这就像是我们第一次第一次设计这个游戏一样。仿佛我们正处 70\
  \ 年代。\n\n### 识别事实 (FACTS)\n\n首先，你需要事实。你需要描述你的想法是关于什么的，涉及哪些内容等。尽可能详细地描述，包括你提供的环境和关键人物。\n\
  \n#### 示例：\n\n在单局贪吃蛇游戏中，存在一条有头部和身体的蛇，以及随机出现的食物项。蛇的头部、身体的所有分段以及食物都有一个 `X-Y 坐标` 和视觉表示（因为它们具有相似的特征，可以被分组为游戏精灵/sprite）。`X-Y\
  \ 坐标` 代表可玩区域内的位置：一个具有高度和宽度的形形区域。分数记录了吃掉了多少个食物。\n\n玩家改变蛇移动的方向：上、下、左、右。当蛇撞到墙壁或撞到自己身体的任何一段时，游戏结束。\n\
  \n当蛇头“吃到食物”（在与食物相同的坐标上出现）后，蛇会生长一个身体段。\n\n```\n[food] + [head] [body] [body]\n=\n\
  [head] [body] [body] [body]\n```\n\n### 识别保持不变的 (CONSTANT)\n\n其次，你需要识别你的世界或应用中哪些元素在整个编程过程中保持一致。此外，识别你的想法中是无条件存在的。\n\
  \n#### 示例：\n\n食物项、蛇头和身体段具有一致的图像。\n\n游戏板具有固定的宽度和高度。\n\n### 识别变化/差异的 (CHANGES/VARIES)\n\
  \n第三，识别程序运行时哪些会发生变化或差异。\n\n#### 示例：\n\n食物项、蛇头和身体段在整个游戏中都具有不断变化的 `X-Y 坐标`。身体段的数量会变化，从初始的\
  \ 2 个一直到尽可能多。\n\n### 将你的想法转化为代码\n\n现在，记录下你提出的所有事实、描述和想法。你将对它们进行数据表示。\n\n在书的早期，我们使用注释来描述将创建的所有信息有一个充分的理由。这是因为它们有助于为你的每一点信息选择最佳的数据表示。在你描述完应用或世界将关于什么之后，你将开始使用注释来开发那个数字世界。\n\
  \n#### 示例：\n\n对于我们提出的关于贪吃蛇游戏的每个事实和想法，我们将使用注释来提示它们应该如何用数据表示。\n\n```\n// 游戏精灵具有：\n\
  // - 一个 X 坐标（整数）\n// - 一个 Y 坐标（整数）\n// - 一个表示它自身的图像（选择你的视觉表示）\n\n// 蛇头、蛇身体段和食物项\n\
  // 分别由游戏精灵表示\n\n// 整个蛇类包含：\n// - 一个蛇头（游戏精灵）\n// - 一个蛇身体段列表（游戏精灵的列表）\n\n// 一条完整的蛇可以：\n\
  // - 吃食物\n// - 生长\n// - 在板上移动\n\n// 可玩板具有：\n// - 一个固定长度（整数）\n// - 一个固定的宽度（整数）\n\n\
  // 贪吃蛇游戏有：\n// - 一个可玩板（Playable Board 类）\n// - 食物项（Food 列表）\n// - 蛇（EntireSnake）\n\
  // - 分数计数（整数）\n\n// 蛇游戏可以：\n// - 开始新游戏\n// - 结束游戏（无论是胜是负）\n// - 更新正在进行的游戏\n// -\
  \ 更新分数\n// - 在按键时移动蛇\n// - 创建或删除食物项\n```\n\n注意，还没有编写任何实际代码；只有注释。这个过程的优之处在于，给定了事实和想法（以及它们的数据表示），我们可以用任何喜欢的语言开始创建代码。我们现在知道哪些将是数据结构、类、整数等等。\n\
  \n我们确实需要过更多工具，所以稍后我们将继续设计。\n\n同时，在下一个大工作坊中，你把想法注释转换为实际代码。祝你好运！\n\n### PHP 工作坊\n\n\
  ### 游戏设计：数据与函数\n\n首先，去一个你喜欢的 IDE。在线 IDE 包括 `rextester.com`、`codechef.com` 和 `ideone.com`。\n\
  \n你将练习设计数据结构和函数——你得到一组描述简单游戏的注释。如果你觉得想创建或删除字段、类或方法，尽管这样做。\n\n现在，让我们继续。我们将设计的游戏是……\n\
  \nPONG！\n\n祝你好运！\n\n```\n// - - - - - - - - - - - - - - - - - - - - -\n// 游戏精灵类具有：\n\
  // - 一个宽度（整数）\n// - 一个高度（整数）\n// - 一个 X 坐标（整数）\n// - 一个 Y 坐标（整数）\n\n// 球类具有：\n//\
  \ - 游戏精灵的所有属性\n// - 一个向上或向下的方向（字符串）\n// - 一个向左或向右的方向（字符串）\n\n// 球类可以：\n// - 向四个对角线方向移动\n\
  // 从拍板或游戏板上下反射\n\n// 拍板类具有：\n// - Sprite 的所有属性\n\n// 拍板类可以：\n// - 向上和向下\n\n// 玩家类具有：\n\
  // - 一个拍板\n// - 分数（整数）\n\n// 玩家类可以：\n// - 得分\n\n// 游戏板具有：\n// - 一个宽度（整数）\n// - 一个高度（整数）\n\
  // - 两个边缘 X 坐标（整数，设置为 0 和宽度）\n// - 两个上下墙 Y 坐标（整数，设置为 0 和高度）\n\n// 游戏类具有：\n// - 两个拍板\n\
  // - 一个球\n// - 一个游戏板\n// - 左侧玩家\n// - 右侧玩家\n// - 一个游戏速度（字符串：“SLOW”、“MEDIUM”或“FAST”）\n\
  // - 一个计时器（数字、整数或你喜欢的任何其他数据类型）\n\n// 创建时，游戏实例还会创建：\n// - 左侧玩家的拍板\n// - 左侧玩家\n//\
  \ - 右侧玩家\n// - 右侧玩家的拍板\n// - 一个以给定随机方向移动的球\n\n// 游戏类可以：\n// - 管理任一玩家的得分\n// - 结束游戏\n\
  // - 宣布获胜玩家\n```\n\n\n\n\n\n# 第二部分：特殊函数与方法工具\n\n## 第 7 章：IF & ELSE 语句\n\n在所有编程语言中，`IF\
  \ & ELSE` 语句的概念都非常简单：几行代码要么执行，要么不执行，取决于某些条件。\n\n### 重要性\n\n`IF/ELSE` 语句将是编程中最常用的代码之一。事实上，更高级的代码通常依赖于这些语句。\n\
  \n### 分析\n\n在伪代码中，这里有一个 IF-ELSE 语句示例：\n\n```\n// 效果：检查条件 A\n\n// - 如果条件为真，执行真过程\n\
  \n// - 如果条件为假，执行假过程\n\nif (conditionA == TRUE) {\n    // 可执行代码：\n    trueProcedure();\n\
  }\nelse {\n    // ELSE 语句代码\n    falseProcedure();\n}\n```\n\n现在，让我们分析上述代码的各个部分。\n\
  \n### 签名 (Signature)\n\n一如既往，最佳实践是在创建代码之前描述其代码的功能。\n\n如果你还记得上一章节中的编程函数，函数在被调用后会产生你意图让执行的特定效果。`IF/ELSE`\
  \ 语句的作用也是在你代码的任何地方放置它们时（只要条件成立），创建一个效果。\n\n在我们的签名中，我们通过我们寻找的条件和希望发生的效果来描述 `IF/ELSE`\
  \ 语句。\n\n```\n// 效果：检查条件 A\n\n// - 如果条件为真，执行真过程\n\n// - 如果条件为假，执行假过程\n```\n\n###\
  \ IF 语句的组成\n\n在几乎所有的编程语言中，IF 语句都有三个部分。第一个是单词 `if`；在这里，你的代码声明了一个 IF 语句。第二和第三部分是条件和可执行代码。\n\
  \n```\nif (.....) {\n    …..\n};\n```\n\n#### 条件 (Condition)\n\n在 If 语句中，圆括号 `(\
  \ )` 内的代码是条件。条件中的代码必须返回一个布尔值——`TRUE` 或 `FALSE`。在这里，你可以使用包含布尔值的字段，使用运算符（`==`, `!=`,\
  \ `>`, `<`, 以及更多）比较两个值，甚至可以在两个值上使用布尔逻辑运算符（`AND`, `NOT`, `OR`）。\n\n```\nif (conditionA\
  \ == TRUE) {\n    …..\n};\n```\n\n#### 可执行代码 (Executable Code)\n\n在条件返回 true 后，程序将执行其后的所有代码——一直到代码行的末尾。\n\
  \n但如果条件返回 false，程序将跳过可执行代码并继续后续。\n\n对于多行可执行代码，请将它们放在大括号 `{ }` 中。\n\n```javascript\n\
  if (conditionA == TRUE) runFunctionA();\n\nif (conditionB == TRUE) {\n    runFunctionB();\n\
  \    runFunctionC();\n};\n```\n\n#### ELSE 语句\n\n在条件返回 false 后，程序将跳过可执行代码。但如果你有一个\
  \ `ELSE` 语句，程序将改为执行该 ELSE 语句之后的所有代码——一直到代码行的末尾。多行可执行代码也放置在大括号 `{ }` 之中。\n\n```javascript\n\
  if (conditionA == TRUE) runFunctionA();\n\nelse {\n    runFunctionB();\n    runFunctionC();\n\
  };\n```\n\n## 第 8 章：辅助函数 (Helper Functions)\n\n辅助函数背后的概念非常简单。\n\n一个大型、复杂的通用函数会调用其他更小、更专门的函数来实现给定的目的。为了做到这一点，你必须记住重要的一点……\n\
  \n### 核心概念：整体的局部部分\n\n如果编程中你需要学习的涵盖编程**每一个**方面的唯一内容，那就是这句话：\n\n“将一个大概念拆分为几个更小的部分，然后再次进一步拆分为更小的部分，直到你拥有最基本的元素。定义并创建每个基本元素是什么，然后继续构建你的概念直到它完成。”\n\
  \n例如，如果你已经读到了设计贪吃蛇游戏的章节，你会注意到创建一个应用遵循了上述方法：将大型应用拆分为若干个数据结构，然后这些数据结构被进一步拆分为其他数据结构或原子数据类型。\n\
  \n在本章中，我们将把这种“从大到小”的概念应用于函数和类方法。探索辅助函数概念的最佳方法是看它的实际运行。\n\n### 示例：机器人腿\n\n看看这个针对\
  \ `Droid` 类的伪代码方法。假设它是 `Droid` 的一个更大的、正在运行的人工智能程序的一部分：\n\n```\n// 输入：- 无\n// 输出：-\
  \ 无\n// 效果：机器人使用它的脚在地形上向前行走，除非有机器人无法越过的障碍物。\n\nvoid walk() {\n    // 检查前方障碍物\n \
  \   // 如果机器人无法越过障碍物则返回\n    if (frontSensor.detectsObject\n    & objectDetected.height\
  \ > Droid.height / 2\n    & objectDetected.distance <= 1Foot)\n    return\n\n  \
  \  // 检查左脚是否在右脚之后\n    // 如果是，则左脚迈一步\n    if (rightFoot.y > leftFoot.y) {\n    \
  \    rightFoot.transferBalance()\n        leftLeg.lift()\n        rightFoot.moveBalanceForward()\n\
  \        leftFoot.moveForward(PastOtherFoot)\n        leftFoot.placeOnGround()\n\
  \    }\n\n    // 检查右脚是否在左脚之后\n    // 如果是，则右脚迈一步\n    if (leftFoot.y > rightFoot.y)\
  \ {\n        leftFoot.transferBalance()\n        right Leg.lift()\n        leftFoot.moveBalanceForward()\n\
  \        rightFoot.moveForward(PastOtherFoot)\n        rightFoot.placeOnGround()\n\
  \    }\n}\n```\n（注：由于原文文本在结尾部分出现了重复和逻辑混乱，译文已根据上下文逻辑进行了对齐处理，以确保通顺）\n\n*注：由于提供的原文文本在\
  \ `walk()` 方法之后出现了大量的重复和乱码片段（如“If a single method, it does far too things”反复出现），在翻译时已根据文档工程师的逻辑去除了冗余重复，保持了核心逻辑的完整性。*\n\
  \n\n\n\n\n```cpp\nvoid walk() {\n  if (checkObstacle()) return\n  leftFootStep()\n\
  \  rightFootStep()\n}\n```\n\n你是否注意到现在的 `walk()` 方法变得多么简洁和简单？\n\n如果你需要调试某些内容，它也会变得简单得多。如果编程中关于检查障碍或双脚迈步的代码出现错误，你可以专注于那个特定的辅助函数及其内部的任何代码。\n\
  \n## 整合一切\n\n辅助函数背后的概念非常简单：对于一个较大的通用函数，赋予它一个通用的目标，然后让它调用其他较小的、单一目的函数来帮助实现该目标。\n\n\
  这也适用于所有的编程语言。\n\n## 第 9 章：局部变量\n\n### 函数及其局部变量\n\n你可以在函数/方法内部定义变量，以存储该函数/方法使用的关键数据。\n\
  \n这些变量被称为 `Local Variables`（局部变量），简称为 `locals`。\n\n以后，你将在更高级的概念中需要 `locals`，例如累加器变量，甚至在算法内部。\n\
  \n### 局部变量 VS 全局变量\n\n以下是 `Local`（局部）变量与 `Global`（全局）变量之间的主要区别。\n\n`Global variables`（全局变量）可以被访问，并在你的整个代码文件中一直存在。\n\
  \n`Local Variables`（局部变量）只能在定义它们的函数/方法内部被访问。一旦函数运行结束，它们也会消失。\n\n### 定义局部变量\n\n在大多数编程语言中，你定义局部变量的方式就像定义全局变量一样。区别在于，你只在函数代码内部定义局部变量。\n\
  \n这是一个伪代码示例，展示了定义局部变量而非全局变量：\n\n```text\nString GLOBAL1 = “aaa”\nInteger GLOBAL2\
  \ = 123\nBoolean GLOBAL3 = TRUE\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT:\
  \ ?????\n\nvoid functionName() {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2 = 123\n\
  \  Boolean LOCAL3 = TRUE\n}\n```\n\n### 正确引用局部变量\n\n以下几条规则可能会根据你使用的编程语言而异，但它们通常适用于大多数语言（如果不是所有）。\n\
  \n以下是访问 `Global` 变量与 `Local Variables` 的一些关键规则：\n\n1) `Local variables`（局部变量）只能在同一个函数代码内部被访问。\n\
  2) `Global variables`（全局变量）可以在整个代码文件中被访问 - 无论是否在函数内部访问。\n3) 取决于具体的编程语言，局部变量名可能与现有全局变量名称完全相同，也可能不同。如果语言允许，你可能需要明确区分你正在访问的是哪个变量。\n\
  \n现在让我们来看这几行伪代码：\n\n```text\nString GLOBAL1 = “aaa”\nInteger GLOBAL2 = 123\nBoolean\
  \ GLOBAL3 = TRUE\nString SAMEVAR = “samevar”\n(any type) ACCESS3 = \\_\\_\\_\\_\\\
  _\\_\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\nvoid function1()\
  \ {\n  String LOCAL1 = “aaa”\n  Integer LOCAL2 = 123\n  Boolean LOCAL3 = TRUE\n\
  \  String SAMEVAR = “samevar”\n  (any type) ACCESS1 = \\_\\_\\_\\_\\_\\_\n}\n\n\
  // INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\nvoid function2() {\n  String\
  \ LOCAL4 = “aaa”\n  Integer LOCAL5 = 123\n  Boolean LOCAL6 = TRUE\n  String SAMEVAR\
  \ = “samevar”\n  (any type) ACCESS2 = \\_\\_\\_\\_\\_\\_\n}\n```\n\n\n\n\n在大多数语言中，你可以使用这些运算符来比较整数（Integers）和数字（Numbers）。因此可以使用这些数据类型的变量，或者是返回这些类型的函数/方法。\n\
  \n### 比较运算符\n\n- 大于：`(your data) > \\_\\_\\_\\_`\n- 大于或等于：`(your data) >= \\_\\\
  _\\_\\_`\n- 小于：`(your data) < \\_\\_\\_\\_`\n- 小于或等于：`(your data) <= \\_\\_\\_\\\
  _`\n\n#### 等于运算符\n\n在两个值之间使用这些运算符，可以比较这两个值是否相等。\n\n- 等于：`(value1) == (value2)`\n\
  - 不等于：`(value1) != (value2)`\n\n在大多数语言中，`==` 和 `!=` 将一致地比较两个值的等相等性。\n\n#### 通用赋值运算符\n\
  \n这仅仅是使用等号（`=`）来分配数据。是的，你一直都在使用它！我们只是想保持简单，并一次添加一个步骤。\n\n为了确保万无一，它的设置方式如下：\n\n`(第一个变量名)\
  \ = (要更改第一个变量值的值或表达式)`\n\n#### 数学赋值运算符\n\n这些与通用赋值运算符类似（单个等号，`=`；你设置变量时使用的相同运算符！）。然而，在大多数语言中，你可以根据你使用的赋值运算符，使用右侧的值来修改左侧的值：\n\
  \n`(第一个变量名) (赋值运算符) (要更改第一个变量值的值)`\n\n本质上，在等号之前有一个额外的字符；这个字符将决定你的赋值运算符是什么操作。\n\n\
  在大多数编程语言中，这些赋值运算符是一致的：\n`%=`, `/=`, `//=`, `-=`, `+=`, `*=`, `**=` 赋值运算符\n\n- 加到第一个值：`(第一个值)\
  \ += (要相加的值)`\n- 乘以第一个值：`(第一个值) *= (要相乘的值)`\n- 除以第一个值：`(第一个值) /= (要除以的值)`\n- 对第一个值取模：`(第一个值)\
  \ %= (要除以的值，不留余数)`\n\n出于显而易见的原因，这些最适用于数值数据类型 - 例如整数和数字。当然，我们需要数字来进行数学运算！\n\n## PHP-05:\
  \ PHP 中的布尔运算符\n\n#### 逻辑运算符\n\n在 PHP 中，三个基础逻辑运算符如下：\n\n- 与（AND）：`and`\n- 或（OR）：`or`\n\
  - 非（NOT）：`!`（只是一个感感叹号）\n\n以下是几个 PHP 代码示例：\n\n```php\n<?php\n// 打印 False:\nif (True\
  \ and False) print(\"True\" . \"\\n\");\nelse print(\"False\" . \"\\n\");\n\n//\
  \ 打印 False:\nif (True or False) print(\"True\" . \"\\n\");\n\n// 打印 False:\nif (!True)\
  \ print(\"True\" . \"\\n\");\nelse print(\"False\" . \"\\n\");\n?>\n```\n\n### 比较运算符\n\
  \n在 PHP 中，使用了与伪代码相同的字符（`>`, `<`, 和 `=`）作为比较运算符。你可以尝试这些运算符。运行这些代码行：\n\n```php\n<?php\n\
  // 这些会打印四行的‘1’\nprint(17 > 15);\nprint(\"\\n\");\nprint(17 >= 17);\nprint(\"\\n\"\
  );\nprint(12 < 15);\nprint(\"\\n\");\nprint(12 <= 12);\nprint(\"\\n\");\n\n// 这些什么都不会打印\n\
  print(0 > 15);\nprint(\"\\n\");\nprint(11 >= 15);\nprint(\"\\n\");\nprint(100 <\
  \ 15);\nprint(\"\\n\");\nprint(16 <= 15);\n?>\n```\n\n#### 等于运算符\n\n在 PHP 中，这些运算符与伪代码代码相同。尝试一下这些：\n\
  \n```php\n<?php\n// 这些打印两行‘1’\nprint(\"xyz\" == \"xyz\");\nprint(\"aab\" != \"aaa\"\
  );\n?>\n```\n\n#### 数学赋值运算符\n\n是的，与我们的运算符相同：\n\n```php\n<?php\n## 将 'a' 设置为整数 3\n\
  $a = 3;\n\n## 这应该打印 66\n$a = 3;\n$a += 3;\nprint($a);\n\n$a = 3;\n$a *= 2;\nprint($a);\n\
  print(\"\\n\");\n\n## 这应该打印 111\n$a = 3;\n$a -= 2;\nprint($a);\n\n$a = 3;\n$a /=\
  \ 3;\nprint($a);\n\n$a = 3;\n$a %= 2;\nprint($a);\n?>\n```\n\n## PHP 工作坊 #4: 使用运算符\n\
  \n首先，进入任一个 IDE。在线 IDE 包括 Rextester (`http://rextester.com`)、CodeChef (`http://www.codechef.com`)、CodePad\
  \ (`http://codepad.org`) 和 Ideone (`https://ideone.com/)。将以下内容（虚线之间）粘贴到你的 IDE 中。然后用你喜欢的任何运算符填充空白。尽情尝试吧。\n\
  \n记住返回布尔值的运算符与改变值的运算符之间的区别！\n\n```php\n// - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - -\n// 输入: 一个年龄 (Integer)\n// 输出: 无\n// 效果: 根据年龄打印某些消息\n\nfunction\
  \ ageLifeTeller($age) {\n    if ($age \\_\\_ 5) print \"Just a Baby\";\n    else\
  \ if ($age \\_\\_ 5 and $age \\_\\_ 17) print \"Just a School Kid\";\n    else print\
  \ \"A Fully Responsible Adult!\";\n    print \"\\n\";\n}\n\n$x \\_\\_ 4;\nageLifeTeller($x);\n\
  $x \\_\\_ 16;\nageLifeTeller($x);\n$x \\_\\_ 2;\nageLifeTeller($x);\n$x \\_\\_ 2;\n\
  ageLifeTeller($x);\n$x \\_\\_ 21;\nageLifeTeller($x);\n$x \\_\\_ 3;\nageLifeTeller($x);\n\
  $x \\_\\_ 3;\nageLifeTeller($x);\n// - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - -\n```\n\n# 第四部分：列表 (Lists)\n\n## 第 12 章：列表\n\n在某一点，计算机最终将有一组数据需要处理 -\
  \ 无论是对象还是基础数据。因此我们有了列表。\n\n#### 通用列表\n\n作为抽象数据类型，列表本质上是连接在一起的数据项。计算机通常会逐个遍历列表中的数据项。\n\
  \n有两种通用列表：链表（linked lists）和数组（arrays）。大多数编程语言通常都会包含其中一种列表。\n\n#### 链表 vs 数组：使用哪种列表？\n\
  \n重要提示：大多数编程语言讽刺的地方在于它们**都**提供了数组和链表。但是，如果同事或老板问你用哪种呢？你看，有时做出这些微小的决定会影响应用的成败 - 有时甚至影响工作申请、职业和创业。\n\
  \n通常，使用链表来快速添加和删除数据项，无论顺序如何。无论项是在列表开头、结尾还是中间，计算机添加/删除数据花费的时间和精力都是一样的。此外，如果你不知道列表有多大，链表更好。\n\
  \n通常，对于任何需要访问或处理列表每个元素的计算，使用数组。数组中的索引将帮助计算机更快地处理列表，并为该列表提供多处理潜力。此外，如果列表中的每个项都需要索引，请使用数组。例如，如果你想随机获取列表项，你可以在数组中这样做（在链表中，计算机如何知道获取哪一个项？思考一下……）。\n\
  \n**结论:**\n- 链表 = 任意大小，添加/删除更快\n- 数组 = 固定大小，访问/处理更快\n\n#### 链表 vs 数组：数据管理\n\n通常，如果要在列表中存储相同的数据类型，数组占用的内存/存储空间比链表少。你以后会发现这一点，但链表在结构上通常比数组需要更多数据。然而，在项数很多的列表中，这种微小差异实际上是巨大的。\n\
  \n## 第 12 章：链表\n\n链表的概念其实非常简单。\n\n将链表看作一条链 - 字面意义上的。在链表中，链中的每个“环”都有其项，后面紧跟着下一个任何“环”。如果某个环没有后续的环，那么这个环就在链的末尾\
  \ - 或者说，在链表的末尾。\n\n这是一个双向链表看起来像样的示例：\n\n`[ID01] [item] [Prev: NULL] [Next: ID03]`\n\
  `[ID04] [item] [Prev: ID03] [Next: NULL]`\n`[ID03] [item] [Prev: ID01] [Next: ID04]`\n\
  \n\n\n\n\n“链表的顺序是这样的：最节点节点（前面没有节点），然后是它的下一个节点，再是下一个，以此此类推——直到有一个节点后面什么都没有了。”\n\n\
  ### 从零开始构建链表\n\n如果你曾经需要从零设计一个链表，这个概念其实很简单。链表中的单个链接由实际数据，以及后续节点或前一个节点的 ID 组成。单向链表节点只指向下一个节点，而双向链表节点则同时指向下一个节点和前一个节点。\n\
  \n在我们下方的伪代码中，一个双向链表节点包含四个关键字段：ID、前一个节点的 ID、下一个节点的 ID 以及实际数据项。\n\n```\n// 抽象数据类型：链表\n\
  // 链表中的每个元素都由一个 Node（节点）表示。\n// 一个 Node 包含：\n// -一个 ID (String)\n// - 前一个节点的 ID\
  \ (String)\n// - 下一个节点的 ID (String)\n// - 数据项 (根据需要选择你想要的数据类型)\n\nCompositeStructure\
  \ Node {\nString ID\nString PREVID\nString NEXTID\n(choose a data type) ITEM\n}\n\
  ```\n\n通常情况下，每个链表只能使用一种数据类型。原因仅仅在于计算机系统本身处理和组织数据的方式（如果你了解计算机系统是如何运作的，将会学到更多）。\n\n\
  ## 第 12c 章：数组\n\n如果你在字典中查找“array”（数组）这个词，你会发现它是按照特定顺序对项目进行的一种详尽且有时非常美的排列。强调“按照特定顺序对项目进行排列”这个短语。\n\
  \n在编程中，你现在已经知道了数组的关键点——它们是按特定顺序排序的数据项列表。\n\n以下是一个大小为 5 的数组在视觉上的示例：\n\n[ 0 ][item\
  \ A]\n[ 1 ][item B]\n[ 2 ][ NULL ]\n[ 3 ][item D]\n[ 4 ][ NULL ]\n\n在这里，你可以看到多快速、方便地从数组中添加或获取数据项。如果你知道存储数据的索引，只需访问数组、然后是索引，数据就属于你了。\n\
  \n此外，数组的大小通常是固定的。在某些编程语言中，还有动态或可变尺寸数组。但取决于编程语言的工作机制，数据项通常会被重新添加到空间与项目数量相符的数组中。\n\
  \n### 快速提示：为什么零是第一个？\n\n在计算机科学中，数据是从零开始计数的。这意味着 0 是第一个，1 是第二个，2 是第三个，以此此类推。如果这听起来让你很困惑，只需记住，如果你必须用计算机术语计数，请记住第\
  \ `i` 个位置减去 1。\n\n所以，如果我们有一个有 10 个项目的数组，数组中的第一个项目将位于索引 `0`（第 1 个 - 1），列表中的最后一个项目将是\
  \ `n - 1`（这意味着你的数组大小减 1）。\n\n### 从零开始构建数组\n\n如果你曾经需要从零设计一个数据数组，这个概念同样简单。但与链表不同，它没有独立的节点。构建数组需要两个要素：数组的长度或大小，以及你想存储在其中的数据类型。\n\
  \n大多数编程语言都应该支持简单数组。在伪代码中，我们这样创建一个数组：\n\n```\n// 抽象数据类型：数组\n// 一个 Array 包含：\n// -\
  \ 数组大小\n// - 存储的数据项类型 (根据需要选择你想要的数据类型)\n(choose a data type) ArrayName[ArraySize]\n\
  ```\n\n和链表一样，每个数组只能使用一种数据类型。然而，与链表不同，数组对每个数组仅有一种数据类型有严格限制。此的原因是计算机为该数组分配数据内存/存储的方式。每个数组使用一种数据类型使得数组结构更加化且易于访问。\n\
  \n## PHP-06：PHP 中的链表与数组\n\n### 创建数组\n\nPHP 中的数组按以下格式声明：\n\n`<Variable Name> = array(\
  \ <数组中的项目数量> );`\n\n要在 PHP 中设置数组，请使用上面的代码行。然后选择你的变量名，以及你想在数组中包含多少个项目对象。这是一个示例。我声明了一个名为\
  \ `intArray` 的数组，它也将包含 10 个元素：\n\n`$intArray = array(10);`\n\n### 访问数组项\n\n你可以通过调用变量名，后跟其整数形式的索引（在数组中的位置）来访问数组内的数据对象：\n\
  \n`<Variable Name>[<数组数据对象的索引>];`\n\n记住：不要忘记美元符号 `$`！例如，如果你想访问 `intArray` 中的第三项，你将使用此表达式：\n\
  \n`… = $intArray[2]`\n\n### 但为什么是 2 而不是 3？\n\n因为，记住，在计算机科学中，数据是从零开始计数的！\n\n### 关于\
  \ PHP 数组的注意：\n\nPHP 数组也可以是映射（maps），这意味着 PHP 数组中的元素可以使用“键”（keys）以及索引来访问。要实现这一点，你可以这样设置数组：\n\
  \n```\n<Variable Name> = array(\n<key 1> => <value 1>,\n<key 2> => <value 2>,\n\
  <key 3> => <value 3>,\n…\n<key n> => <value n>,\n);\n```\n\n映射键可以是任何类型，例如字符串、整数，甚至是布尔值。这是一个映射数组的示例：\n\
  \n```\n$intArray = array(\n'ONE' => 'aaa',\ntrue => 'bbb',\n3 => 'ccc',\n);\n```\n\
  \n这比通常情况稍微复杂，因为你通常需要先设计节点。对于单向链表，你需要包含的数据和下一个节点：\n\n```\n// 抽象数据类型：链表，单向\n// 链表中的每个元素由一个\
  \ Node 表示。\n// 一个 Node 包含：\n// - 数据项 (根据需要选择你想要的数据类型)\n// - 下一个节点 (Node Object)\n\
  ```\n\n对于双向链表，你需要数据项，以及前一个和下一个节点：\n\n```\n// 抽象数据类型：链表，双向\n// 链表中的每个元素由一个 Node 表示。\n\
  // 一个 Node 包含：\n// - 数据项 (根据需要选择你想要的数据类型)\n// - 前一个节点 (Node Object)\n// - 下一个节点\
  \ (Node Object)\n```\n\n## 第 13 章：自递归\n\n自引用——简称自递归是计算机编程中最重要的概念之一。自递归的核心思想是：给定某个初始输入，自递归函数会处理一个效果，然后用输入的减少或增强版本继续重复该效果。函数将持续重复，直到输入达到某种函数停止重复的状态。\n\
  \n自引用是处理数据集合的关键过程。给定，自递归函数会对集合中的每个项目重复其过程。函数将一直重复，直到没有数据项目需要处理，或者函数遇到了预期的解决方案。这个概念贯穿于简单和高级编程——包括算法、自动生成数据等。\n\
  \n### 自递归函数的组成\n\n让我们观察一个伪代码中的自递归函数示例：\n\n```\n// 输入：一个整数\n// 输出：无\n// 效果：给定一个正整数，打印\
  \ 10^(输入)，\n// 然后用输入减 1 重复，直到只打印 10\n// - 基本情况：输入 <= 0\n// - 递归步骤：用输入减 1 重复\n\n\
  void printPowerTen(integer i) {\n  // 基本情况：\n  if (i <=0) return;\n\n  // 递归步骤：\n\
  \  print 10 ^ i;\n  printPowerTen(i - 1); // 这自引用\n}\n```\n\n（记住：这个概念在许多编程语言中保持不变！）自递归函数具有普通函数的主要组件：可能的输入和输出以及效果。它还有两个额外的组件：基本情况（Base\
  \ Case）和递归步骤（Recursive Step）。\n\n\n\n\n要检查函数是否已达到基准情况（base case），请注意上面使用的 `IF` 语句：作为一个条件，它检查输入是否已达到基准情况。如果为，函数返回并结束。\n\
  \n### 实现函数：基准情况\n\n`Base Case`基准情况）始终是`Self-Recursive Function”（自递归函数）的第一个组件。\n\n\
  你需要设置你的自递归函数限制。这可以是当没有更多数据项需要处理时，或者某个变量或输入达到了最小值/最大值。一旦你的自递归函数遇到该限制，函数就应该停止重复并结束。\n\
  \n在上面的示例中，当输入不是正整数时设置了 `base case`——本质上就是当它是 `0` 或以下时。每当该情况成为函数输入时，函数将返回并结束。\n\n\
  ```\n// - Base Case: input is <= 0\n\n//Base Case:\nif (i <=0) return;\n```\n\n\
  此外，仔细观察。记得我们在上一个章节中过的 `IF` 语句吗？自递归函数将利用该概念来检查 `Base Case`。\n\n### 为什么你需要基准情况\n\n\
  如果没有合适的基准情况，自递归函数将永远处理下去——这被称为 `Infinite Loop`无限循环。尽管输入已经减少或增加，函数将继续重复其过程。它将不知道如何停止处理，因此将一直持续下去。\n\
  \n“吃、睡、狂欢、重复”\n\n### 递归步骤：自引用\n\n`Recursive Step`递归步骤）中包含两个主要组件：函数效果和对相同函数的调用。该函数调用需要一个让输入更接近\
  \ `Base Case` 的输入\n\n就像典型的函数一样，效果就是你想要让函数执行的操作。\n\n对相同函数的调用定义了它是一个`Self-Recursive\
  \ function`自递归函数。注意在示例的最后一行，有一个对相同函数的调用。然而，最重要的是，该函数中的输入减了 `1`。它最终将一直减到 `0`——`Base\
  \ Case`！\n\n```\n// - Recursive Step: Repeat with input - 1\n\n// Recursive Step:\n\
  print 10 ^ i;\nprintPowerTen(i - 1); // this is the self-reference\n```\n\n### 尾递归\n\
  \n当一个`Self-reference Function`自引用函数）的程序最后一行是对其自身的调用时，它是尾递归的。你希望你的自递归函数具有这一点；这有助于确保你的函数按照你预期的方式运行。\n\
  \n在我们的示例中，该函数是自递归的。有一个将输入加一的过程，然后函数使用该输入重复自身。\n\n```\nprintPowerTen(i - 1); // this\
  \ is the self-reference\n```\n\n### 递归的准则：信任递归\n\n你已经定义了你的函数限制是什么。它就在你的 `Base Case`上。\n\
  \n现在，只要你的自引用函数是尾递归的，并且递归函数调用的输入变为更接近基准情况的一步，那么你的函数应该就会反复运行，直到达到基准情况。\n\n只要这些组件到位，你的递归函数就应该按计划处理。你只需要信任递归。\n\
  \n定义好你的基准情况，递归地调用函数，并设置该输入逐步趋近基准情况。\n\n### 定义函数\n\n虽然函数的输入和输出随每种情况而异，但效果将保持一致：函数将不断重复并产生其期望的效果，直到它达到其基准情况限制。\n\
  \n```\n// INPUT: ____\n// OUTPUT: ____\n// EFFECT: ____\n// - Base Case: function\
  \ has reached a limit\n// - Recursive Step: variable/input, with a step closer to\
  \ reaching limit\n```\n\n这里是一个示例：\n\n```java\n// INPUT: - Array of Strings, and\
  \ a String Length (Integer)\n// OUTPUT: - Array of Strings\n// EFFECT: Returns an\
  \ array of Strings that have the given string length\n// - Base Case: function has\
  \ no more Array Elements to process\n// - Recursive Step: Repeat without recently\
  \ processed String\n\nArray[String] matchLength(Array[String] stringArray, Integer\
  \ length) {\n    …\n}\n```\n\n## 第 14 章：迭代循环\n\n一旦你理解了递归函数是如何工作的，你就会理解接下来的两个章节（迭代和\
  \ while 循环）是如何对应自递归的。\n\n本质上，自递归、迭代循环和 while 循环具有相同的概念：反复执行一个过程，每次重复都更接近某个限制，然后停止重复并继续后续。\n\
  \n自递归、迭代循环和 while 循环函数几乎总是涉及某些数据收集、整数或某些数字。\n\n### For-循环函数的组成\n\n让我们在伪代码中观察一个 for-loop\
  \ 函数示例：\n\n```cpp\n// INPUT: an Integer\n// OUTPUT: none\n// EFFECT: Given a positive\
  \ integer, prints (input),\n// then repeats and prints input - 1, then afterwards\n\
  // prints “WE HAVE LIFT OFF”\n// - Start: given input\n// - Continue: counting integer\
  \ is > 0\n// - Repeating Step: Repeat with input - 1\n\nvoid printCountdown(integer\
  \ input) {\n    // this is the for-loop\n    for (integer i = input; i > 0; input--)\
  \ {\n        //this is the looped procedure\n        print(i);\n    }\n    // this\
  \ occurs after the for-loop ends\n    print(“WE HAVE LIFT OFF”)\n}\n```\n\n（记住：这个概念在许多编程语言中将保持一致！）\n\
  \nfor-loop 函数也将具有普通函数的主要组件：可能的输入和输出，以及效果。\n\n它还将具有迭代循环的三个关键组件：起始值、继续条件和下一步。这些描述了循环将如何迭代和重复一个过程。\n\
  \n如何做到的？for-loop 将使用一个计数整数，将其设置为起始值，处理循环过程，然后修改计数整数。for-loop 将反复执行循环过程，直到计数整数达到某个特定值——一个继续条件决定停止的点。\n\
  \n### 迭代的开始与结束\n\n首先，使用一个整数并给它一个起始值——例如，零。\n\n接下来，定义为了继续重复整数值应该是多少：继续条件。\n\n```cpp\n\
  // - Start: 0\n// - Continue: counting integer < given input\n\n// this is the for-loop\n\
  for (integer i = 0; input > i; … ) {\n```\n\n你也可以反过来使用迭代循环；起始值为某个整数，继续条件为计数整数大于\
  \ 0。\n\n```cpp\n// - Start: given input\n// - Continue: input is > 0\n\n// this\
  \ is the for-loop\nfor (integer i = input; i > 0; … ) {\n```\n\n### 迭代的下一步\n\n无论起始值和继续条件是什么，下一步应该改变计数整数的值。增加或减少整数以逐步接近禁用继续条件。\n\
  \n```cpp\n// - Repeating Step: Repeat with input - 1\n\n// this is the for-loop\n\
  for ( … input--)) {\n```\n\n这与前一个章节中的自引用函数调用相当。for-loop 将重复循环内的过程，然后更改计数整数。\n\n\
  然后它一直重复，直到计数整数最终导致继续条件不再重复。\n\n### 定义函数、输入与输出\n\n函数的输入和输出随情况而异。然而，效果将保持一致：函数将不断迭代并产生其期望的效果，直到它达到基准情况限制。\n\
  \n有两种常用的版本，取决于迭代组件的如何配置。\n\n#### 向上迭代\n```\n// INPUT: ____\n// OUTPUT: ____\n//\
  \ EFFECT: ____\n// - Start: 0\n// Continue: (set a limit) > counting integer\n//\
  \ - Repeating Step: (counting integer +1)\n```\n\n#### 向下迭代\n```\n// INPUT: ____\n\
  // OUTPUT: ____\n// EFFECT: ____\n// - Start: (set a starting value)\n// - Continue:\
  \ 0 < counting integer\n// - Repeating Step: (counting integer -1)\n```\n\n使用下面的数组，是每个版本的示例，采用伪代码形式：\n\
  \n// an Array of Names (Strings)\n\n\n\n\n\n```java\nString theArray[4] = [\"Anna\"\
  , \"Betty\", \"Cammy\", \"Daphne\"];\n```\n\n### 正向遍历\n\n```java\n// 输入: - 无\n//\
  \ 输出: - 无\n// : 打印数组中的每个名称，从第一个开始\n// - 开始: 0\n// - 继续: (设置一个限制) > 计数整数\n// - 重复执行步骤:\
  \ (计数整数 +1)\nvoid printArrayFromStart() {\n    // 这是一个 for-循环\n    for (integer\
  \ i = 0; 4 > i; i++) {\n        print theArray[i]; // 这将打印 i 位置上的任何内容\n    }\n}\n\
  ```\n\n### 反向遍历\n```java\n// 输入: - 无\n// 输出: - 无\n// : 打印数组中的每个名称，从最后一个开始\n// -\
  \ 开始: (设置一个起始值)\n// - 继续: 0 < 计数整数\n// - 重复执行步骤: (计数整数 -1)\nvoid printArrayFromEnd()\
  \ {\n    // 这是一个 for-循环\n    for (integer i = 4; 0 < i; i--) {\n        print theArray[i];\
  \ // 这将打印 i 位置上的任何内容\n    }\n}\n```\n\n每个版本将以不同的方向遍历数组。这些方向取决于迭代组成部分：一个将从 `0` 遍历到数组大小，另一个将向相反方向遍历。\n\
  \n## 第 15 章：迭代：While 循环\n\n简单来说，`While-loop` 是一种更简单的的迭代形式。\n\n它包含与 `IF-statement`\
  \ 相似的特征：它包含一个重复条件（布尔语句），以及一段只要该重复条件保持为 TRUE（真）就会重复处理的代码。\n\n然而，`While-Loop` 内部的重复代码将一直重复，直到重复条件返回\
  \ FALSE（假）为止。然后，代码将继续执行。\n\n记住这个概念：反复地执行一个过程，每次重复都让距离某个限制近一步，然后停止重复并继续执行。对于 `While-Loop`\
  \ 也是如此。\n\n在重复代码中，应该有一或两行代码来改变重复条件。它应该向着返回 FALSE 的方向移动，以便 `while-loop` 最终能够停止重复。\n\
  \n与其他迭代形式一样，`While-Loop` 函数几乎总是涉及某些数据收集、整数或某些数字。它需要这些数据来判断重复条件。数据将被检查，重复条件将返回 TRUE\
  \ 或 FALSE —— 因此，要么重复代码，要么继续执行。\n\n在伪代码中，这里有一个使用 `While-Loop` 的示例函数：\n\n```java\n\
  // 输入: ____\n// 输出: ____\n// : ____\n// - 如果满足重复: 计数整数 < (设置一个限制)\nvoid countTo(Integer\
  \ n) {\n    Integer LOCALCOUNTER = 0\n    while (LOCALCOUNTER < n) {\n        print(LOCALCOUNTER)\n\
  \        LOCALCOUNTER++\n    }\n}\n```\n\n现在，让我们分析一下 `While-Loop` 及其组件：\n\n### 重复条件\n\
  只要 `Repeat-Condition` 保持 true，`Repeating Code` 就会被处理并持续被重新处理。在这个例子中，局部变量 `integer`\
  \ 最初设置为 `0`。只要局部变量小于限制（输入整数），`while-loop` 就会重复。\n\n```java\n// - 如果满足重复: 计数整数 <\
  \ (设置一个限制)\n…\nwhile (LOCALCOUNTER < n) {\n    ....\n}\n```\n\n### 重复代码\n正如你所猜的，只要\
  \ `Repeat-Condition` 为 TRUE，这部分代码就会不断重复。\n\n然而，必须至少有一行代码让下一次重复向着 `Repeat-Condition`\
  \ 变为 FALSE 的方向迈进 —— 因此，停止重复。\n\n注意这个例子。在每次重复期间，`counting integer` 都会递增。最终，`counting\
  \ integer` 将等于或大于限制 —— 因此，函数将停止。\n\n```java\nwhile (LOCALCOUNTER < n) {\n    print(LOCALCOUNTER)\n\
  \    LOCALCOUNTER++\n}\n```\n\n这个概念：反复地执行一个过程，每次重复都让距离某个限制近一步，然后停止重复并继续执行。对于 `While-Loop`\
  \ 也是如此。\n\n本质上，`while-loop` 函数几乎总是涉及某些数据收集、整数或某些数字。它需要这些数据来判断重复条件。数据将被检查，重复条件将返回\
  \ TRUE 或 FALSE —— 因此，要么重复代码，要么继续执行。\n\n从比喻上来说，`while-loop` 几乎总是自递归函数。\n\n只需确保你的\
  \ `repeat-condition` 有某种限制，并且你的 `repeating code` 会向该限制迈进。最终，你的函数将不断重复直到达到某一点，然后继续执行。\n\
  \n再次，只要这些部分到位，你的 `while-loop` 函数就应该按计划处理。你只需要信任。\n\n## PHP 中的迭代\n\n在任何编程语言中，`Self-Recursion`\
  \ 和 `Iteration` 都是处理整个数据列表的最佳工具。\n\n为什么呢？思考一下。\n\n如果你有一个数据列表，并且需要处理列表中的每一个元素，这不意味着要对每个数据元素重复相同的函数吗？\n\
  \n这就是为什么你需要这些概念来遍历列表。\n\n让我们运行下面的列表运行示例：\n\n```php\n// STR_ARRAY 是一个包含 5 个槽位的字符串数组\n\
  $STR_ARRAY = array(5);\n```\n\n现在，假设你将五个朋友输入该列表：\n```php\n$STR_ARRAY[0] = \"Amy\"\
  ;\n$STR_ARRAY[1] = \"Ben\";\n$STR_ARRAY[2] = \"Charlie\";\n$STR_ARRAY[3] = \"Diana\"\
  ;\n$STR_ARRAY[4] = \"Emily\";\n```\n\n那么，如果我们想要相同地修改数组中的每个元素呢？或者如果我们想要相同地处理它们呢？\n\
  \n你猜对了。`Self-Recursion` 或 `Iteration`！\n\n让我们写一个函数。它将在添加字符串后打印数组中的每一项。\n\n```php\n\
  // 输入: - 字符串数组\n// 输出: - 无\n// : 打印数组中的每个字符串以及一个额外的字符串\nfunction addPrint($array,\
  \ $addString) {\n    // 我们应该如何实现这个\n};\n```\n\n你也可以尝试这个。在你的 PHP 代码中粘贴每个函数存根。\n\n\
  我们在设置朋友的名字后添加函数调用。看起来如下：\n\n```php\n$STR_ARRAY[0] = \"Amy\";\n$STR_ARRAY[1] = \"\
  Ben\";\n$STR_ARRAY[2] = \"Charlie\";\n$STR_ARRAY[3] = \"Diana\";\n$STR_ARRAY[4]\
  \ = \"Emily\";\n\naddPrint($STR_ARRAY, \"Is My Friend!\")\n```\n\n将上述内容粘贴到你的 PHP\
  \ 代码中，就在函数声明之后。\n\n之后，你运行你的代码。但什么都没有发生，因为你还没有实现 `addPrint()` 内部的功能！\n\n但通过注释，我们已经确定了想要让函数执行的操作。所以如果你运行最终代码，它应该打印：\n\
  Amy Is My Friend!\nBen Is My Friend!\nCharlie Is My Friend!\nDiana Is My Friend!\n\
  Emily Is My Friend!\n\n让我们开始让我们的函数工作。\n\n我们将从使用 `For-Loops` 和 `While-Loops` 开始。\n\
  \n### 数组的 For-Loop 迭代\n\n你将迭代器设置为？\n迭代器是多少以保持重复？\n你如何修改迭代器以停止函数的重复？\n\n仔细考虑如何遍历列表并修改每个元素。记住我们在注释中想要的；我们要在每个数组元素添加一个字符串。\n\
  \n然而，注意我们可以通过索引访问每个数组元素。列表中的每个元素将从 `0` 索引到数组大小。\n\n因此，我们可以从 `0` 遍历到数组大小！我们可以使用索引修改每个元素！\n\
  \n所以我们已经弄出了如何迭代该功能。对于 `aMod()`，让迭代器从 `0` 设置到项目大小。\n\n目前的函数如下：\n\n```php\n// 输入:\
  \ - 字符串数组\n// 输出: - 无\n// : 打印数组中的每个字符串以及一个额外的字符串\n// 作为一个 For-Loop:\n// - 开始: 迭代器为\
  \ 0\n// - 继续: 迭代器小于数组大小\n// - 重复执行步骤: 迭代器 + 1\nfunction addPrint($array, $addString)\
  \ {\n    for($i = 0; $i < count($array); $i++) {\n        // ???\n    }\n};\n```\n\
  \n但功能将会是什么？嗯，我们知道想要的。让我们直接使用我们的运算符：\n\n```php\n// 输入: - 字符串数组\n// 输出: - 无\n// :\
  \ 打印数组中的每个字符串以及一个额外的字符串\n// 作为一个 For-Loop:\n// - 开始: 迭代器为 0\n// - 继续: 迭代器小于数组大小\n\
  // - 重复执行步骤: 迭代器 + 1\nfunction addPrint($array, $addString) {\n    for($i = 0; $i\
  \ < count($array); $i++) {\n        $array[$i] = $array[$i] . \" \" . $addString\
  \ . \"\\n\";\n        print $array[$i];\n    }\n};\n```\n\n搞定了！\n\n尝试代码并看看它是否能正确添加并打印每个数组元素！\n\
  \n\n\n\n我们也可以通过将每个函数设置为 While 循环的迭代来获得相同的结果。\n\n但我们如何做到此呢？让我们思考一下。\n\n对于我们的重复条件，我们只是想对数组中的所有元素不断重复相同的功能\
  \ - 直到没有更多元素可以重复该功能为止。\n\n由于我们处理的是数组，我们可以使用索引来访问每个数据元素。由于数组索引是整数，我们可以使用一个计数整数来遍历数组。因此，我们可以从\
  \ 0 到数组大小重复该功能 - 就像我们使用 For 循环 一样！\n\n```php\n// INPUT: - 一个字符串数组\n// OUTPUT: -\
  \ 无\n// EFFECT: - 打印数组中的每个字符串并带有一个额外的字符串\n\n// 使用 While 循环实现：\n// - 设置一个计数整数并初始化为\
  \ 0\n// - 如果满足则重复：计数整数 < 数组大小\n\nfunction addPrint($array, $addString) {\n    $i\
  \ = 0;\n    while ($i < count($array)) {\n        // ????\n        $i++;\n    }\n\
  };\n```\n\n我们已经设出了 For 循环版本中重复的功能。所以这里是该函数：\n\n```php\nfunction addPrint($array,\
  \ $addString) {\n    $i = 0;\n    while ($i < count($array)) {\n        $array[$i]\
  \ = $array[$i] . \" \" . $addString . \"\\n\";\n        print $array[$i];\n    \
  \    $i++;\n    }\n};\n```\n\n尝试这段代码并看看它是否正确地添加并打印了每个数组元素！\n\n## PHP-07b: PHP 中的自递归\n\
  \n对于链表，处理每个链表的最佳工具是自递归。\n\n但为什么不使用 for 循环呢？因为 for 循环使用整数来遍历数组 - 从头到尾。数组有索引供函数和方法进行遍历。但链表没有。\n\
  \n相反，对于链表，你可以对剩余的链表不断重复该功能 - 直到你到达链表的末尾（你的基础情况 Base Case!）\n\n根据上一章的内容，如果你的名字列表是一个链表会怎样？下面是它的样子。\n\
  \n在 PHP 中，这是一个单向链表节点类（Class），以及 `addPrint` 函数，并将你同样的 5 个好朋友也包含在链表中。像这样将其复制粘贴到你的代码中：\n\
  \n```php\n// 抽象数据类型：链表，单向\n// 链表中的每个元素都由一个节点（Node）表示。\n// 节点包含：\n// - 数据项（选择你想要的数据类型）\n\
  // - 下一个节点（Node 对象）\n\nclass Node {\n    public $DATA;\n    public $NEXT;\n\n  \
  \  // INPUT: - 无\n    // OUTPUT: - 无\n    // EFFECT: Node 类的构造函数\n    function __construct()\
  \ {\n\n    }\n}\n\n// INPUT: - 一个字符串数组\n// OUTPUT: - 无\n// EFFECT: 打印节点内的数据并带有一个额外的字符串；\n\
  // 持续进行直到没有后续节点\n\nfunction addPrint($node, $addString) {\n    // ???\n};\n\n$a\
  \ = new Node();\n$a->DATA = \"Amy\";\n$a->NEXT = null;\n\n$b = new Node();\n$b->DATA\
  \ = \"Ben\";\n$b->NEXT = $a;\n\n$c = new Node();\n$c->DATA = \"Charlie\";\n$c->NEXT\
  \ = $b;\n\n$d = new Node();\n$d->DATA = \"Diana\";\n$d->NEXT = $c;\n\n$e = new Node();\n\
  $e->DATA = \"Emily\";\n$e->NEXT = $d;\n```\n\n现在，让我们实现 `aMod()` 和 `aPrint()` 功能\
  \ - 这样运行上面的代码将打印出这些：\n\nEmily is my Friend!\nDiana is my Friend!\nCharlie is my\
  \ Friend!\nBen is my Friend!\nAmy is my Friend!\n\n## 链表的自引用递归\n\n我们将使用自递归来实现这两个函数。\n\
  \n思考一下链表由什么组成：一组链式节点（Linked Nodes）。你将对每个链表节点重复该函数。但最终，你会到达链表的末尾。你如何知道自己到达了呢？很简单。如果你发现一个节点后面什么都没有呢\
  \ - 在这种情况下，如果下一个节点是 `null` 呢？\n\n这就是你功能的限制 - 或者换句话说，就是基础情况（Base Case）。如果没有了更多节点可以遍历，你就可以结束函数。\n\
  \n```php\n// INPUT: - 一个字符串数组\n// OUTPUT: - 无\n// EFFECT: - 打印节点内的数据并带有一个额外的字符串；\n\
  // 持续进行直到没有后续节点\n\n// 使用自引用：\n// - 基础情况：输入为 null（列表结束）\n// - 递归步骤：对下一个节点重复\n\nfunction\
  \ addPrint($node, $addString) {\n    // ???\n};\n```\n\n现在，让我们开始写代码。记住，你需要的基础情况、递归步骤以及实际的功能逻辑：\n\
  \n```php\nfunction addPrint($node, $addString) {\n    // 基础情况：\n    // ???\n\n \
  \   // 递归步骤：\n    else {\n        // ???\n        // ???\n    }\n};\n```\n\n我们知道基础情况需要什么；如果你到达了列表末尾（如果你的输入是\
  \ `null`），则结束功能。对于递归步骤，对列表中的 `NEXT` 节点重复函数。对于主功能，我们知道想要什么 - 根据我们写的注释。\n\n```php\n\
  function addPrint($node, $addString) {\n    // 基础情况：\n    if (n == null) return;\n\
  \n    // 递归步骤：\n    else {\n        $node->DATA = $node->DATA . \" \" . $addString\
  \ . \"\\n\";\n        print $node->DATA;\n        addPrint($node->NEXT, $addString);\n\
  \    }\n};\n```\n\n现在在你实现函数后，尝试运行它并看看是否打印了正确的输出。记住：相信递归（Trust the Recursion）！\n\n\
  # 第五部分：特殊数据结构\n\n## 第 16 章：二叉树\n\n想象一下你的家族树 - 只有你、你的父母、所有的祖父母、太祖父母等等。\n\n你会很快发现，你只有一个，最多有两个父母，最多四个祖父母，最多八个太祖父母，以此类推。\n\
  \n如果你把每个人列在一个图表上 - 你在顶部，父母在下一层，祖父母在下一层 - 它看起来像一棵“树”。\n\n在这种情况下，一个节点最多有两个子节点，它看起来像一棵二叉树：![pasted-image.png](img/00001.jpeg)\n\
  \n#### 二叉树的用途\n\n树结构通常来说是计算中最重要的数据结构之一。对于搜索和答案生成算法尤其如此。\n\n二叉树特别是，是最简单的树结构之一。数据的布局方式使得递归算法可以处理每个节点和它的子节点。\n\
  \n为了让你直观理解二叉树的工作原理，这里有一个例子。\n\n我正在想一个 1 到 100 之间的随机数。如果你猜数字是多少，我会告诉你高、低，或者你猜对了。所以，如果你说\
  \ 50，我会告诉你高还是低（不是 50；所以继续猜），然后你再猜一次，我会告诉你高还是低，以此类推，直到你得到答案。\n\n#### 二二叉树规则\n\n在核心范围内，有效的二叉树应该具备以下条件：\n\
  \n- 每个树节点代表某些数据：原子数据或复合数据即可\n- 每个节点最多有两个子节点：左节点和/或右节点\n- 如果一个节点没有子节点，它被称为叶节点（Leaf\
  \ node）\n\n\n\n\n二叉树有许多不同的类型，每种类型都有其各自的额外结构规则。例如：二叉搜索树、最小堆、最大堆、AVL 树等。\n\n## 数据结构\n\
  \n对于二叉树中的每个节点，它要么拥有左/右子节点，要么完全没有节点（这些被称为叶子节点）。\n\n下面是一些通用的伪代码。你可以根据需求，在任何你希望的编程语言中实现你的\
  \ `Binary Tree` 节点。\n\n```cpp\n// A Binary Tree Node contains:\n// - 一个数据键值（任何你想要的数据类型）\n\
  // - 一个左子节点（可以是 BTreeNode 或 NULL）\n// - 一个右子节点（可以是 BTreeNode 或 NULL）\n\nCompositeStructure\
  \ BTreeNode {\n<data type of your choice> key\nBTreeNode LEFT\nBTreeNode RIGHT\n\
  }\n```\n\n### 通用处理函数\n\n如果你读到了这里，你可能已经学过自递归函数了（如果没有，你可能想想回去快速浏览一遍）。通用的函数类似于自递归函数，包含一个基准情况（base\
  \ case）以及针对左右子节点的两个自递归调用。\n\n处理处理二叉树的通用算法如下：\n\n```cpp\n// INPUT: - 一个二叉树节点\n//\
  \ OUTPUT: - <选择你的输出数据类型>\n// EFFECT: \\_\\_\\_\\_\n// - Base Case: 输入为 NULL\n//\
  \ - Recursive Steps: 递归调用左、右子树\n\n<chosen output data type> procBTree(BTreeNode\
  \ n) {\n    // BASE CASE:\n    if (n == NULL) {\n        return <chosen output data\
  \ type>\n    }\n    // MAIN PROC:\n    // 在此处编写任何你想要\n    // RECURSIVE CALL: LEFT\
  \ TREE\n    procBTree(n-LEFT)\n    // RECURSIVE CALL: RIGHT TREE\n    procBTree(n-LEFT)\n\
  }\n```\n\n### 输入\n\n输入几乎总是节点。\n\n```cpp\n// INPUT: - 一个二叉树节点\n…\n… procBTree(BTreeNode\
  \ n) {\n…\n```\n\n### 基准情况\n\n大多数二叉树算法会重复处理，直到没有剩余节点需要处理为止。在此时，函数将返回（可能带有你设置的数据类型），并且不再对任何子节点进行自递归。\n\
  \n```cpp\n// BASE CASE:\nif (n == NULL) {\n    return <chosen output data type>\n\
  }\n```\n\n### 递归步骤\n\n与自递归函数一样，二叉树算法会对两个子节点（以及子树）重复自身。这些代码行会让离基准情况——没有节点——更近一步。\n\
  \n```cpp\n// RECURSIVE CALL: LEFT TREE\nprocBTree(n-LEFT)\n// RECURSIVE CALL: RIGHT\
  \ TREE\nprocBTree(n-LEFT)\n```\n\n## 记住递归规则：信任递归\n\n我们之前在“自递归”章节中讨论过这些。只需确保你的函数有一个限制，并且每次自递归函数调用都向该限制迈进一步。然后你只需要信任递归并让它运行即可。\n\
  \n对于二叉树，只要你的函数有一个停止处理的点（你的基准情况：`NULL` 节点），并且你的函数自递归调用处理了左右子节点，你的代码就能运行。就像上面一样，你需要信任递归。\n\
