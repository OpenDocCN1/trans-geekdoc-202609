- "# PHP 编程：大师手册：真正的初学者指南！问题解决、代码、数据科学、数据结构与算法（24小时内像专业人士一样编程 ... r 语言、iOS 开发）\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n## 欢迎来到精通之路\n感谢您购买并下载我们的作品《大师手册》。通过这样做，我们可以告诉您，以更深入、更全面的方式学习\
  \ `Programming` 充满好奇心。\n\n我们注意到，你不仅仅想在这里学几个小技巧，你还想有信心从容应对任何编程挑战。\n\n因此，你来对地方了……\n\
  \n### 大师圈\n你并不孤单。这本书背后的程序员来自当今世界上一些最先进大学所授的最优秀计算机科学课程。\n\n### 基础知识\n要成为一名优秀的程序员，你需要做两件大事。其一个是进行大量的练习；另一个是接受良好的教育。\n\
  \n但你如何判断哪个教育来源的好坏呢？\n\n你要知道，我们可以告诉你，市场上 90% 的编程学习资源都会告诉你任何 `Programming` 语言的代码**是什么**（WHAT）以及**如何**（HOW）工作。但这并不一定是坏事——而且其中许多资源也非常优秀。\n\
  \n然而，它们可能不会教你**为什么**（WHY）或**什么时候**（WHEN）使用这些代码。也不会向你展示在使用这些代码时还需要**什么**（WHAT ELSE）。\n\
  \n如果你需要编写程序，你不想成为一个懂一堆代码但完全不知道如何使用它们的人，对吧？\n\n随着阅读的深入，你将很快学到不仅是代码的**如何**是什么，还包括在**哪里**、**什么时候**、**为什么**使用它，你还需要**其他什么**——更重要的是，**如何**使用它。\n\
  \n### 大师结构\n我们从观察世界开始，定义代码来代表事物（`data`）或动作（`functions`）。随着你阅读这本书，你将发现更多更高级的概念以及将它们结合在一起的方法。\n\
  \n书中还配备了主编程语言，以及通用的 `PseudoCode`（伪代码）以帮助理解编码概念。很多时候，你会发现我们的 `PseudoCode` 帮助你从学习本书的主语言过渡到学习你的下一种语言！\n\
  \n无论你在此之前没有写过一行代码，还是已经构建了严肃的项目，你**将**会在书中发现巨大的价值。在你的编程之旅中，你经常会遇到编码挑战。这本书将帮助你识别如何突破这些！\n\
  \n## 编辑者的话\n\n### 现实\n如果你好奇为什么计算机科学家能赚这么多钱（包括初级程序员、开发者、软件工程师、IT 人员以及几乎任何涉及编程的工作），有很多充分的理由。\n\
  \n首先，在当今世界，几乎**每一个**行业都需要某种程度的技术水平。所以你可以想象一下对合格程序员的需求有多大。\n\n但计算机科学的真相是，它大多数时候非常有智力挑战性。因此，只有一部分的人足够优秀，能够在编程领域获得真正的事业。\n\
  \n事实就是如此。你可能不需要大学学位就能成为一名优秀的程序员……\n\n### 深度\n这本书以及系列中的其他书籍的真正意义在于深入比你看到的代码行更深。你将学习如何将每一比特的数据和代码应用到你遇到的任何情况下——并且在某一点，是直觉地做到。\n\
  \n真正的程序员的工作是创造以各种方式改善生活的工具。在大多数时候，它将涉及到将生活中的事物表示为 `data` 的方法，以及让计算机处理它们。\n\n所以如果你想成为更好的程序员，请继续阅读……\n\
  \n## PHP 简介\n\n### PHP：服务器的秘密\n如果你有一个包含 Web 代码、数据库、服务器和功能的 Web 结构，那么 PHP 可能就是将它们胶在一起的编程语言。PHP\
  \ 天生与世界上几乎每种数据库集成，包括 `MySQL` 和 `MS Access`。PHP 还可以作为功能被轻松集成到你的网页中。幸运的是，PHP 非常容易学习——有如此多的编码方式来编写它。\n\
  \n然而，正是这种易学的学习曲线和灵活实现的结合限制了 PHP 代码。很多、非常多的程序员可以用一种方式实现 Web 功能，而更多的人可以用另一种方式实现。当多个程序员一起创建\
  \ PHP 代码时，他们可能会在尝试让代码运行时遇到很多问题。\n\n此外，PHP 完全仅限于服务器。如果你访问由 PHP 驱动的 Web 应用，你将完全不知道\
  \ PHP 代码在做什么。但仅限于服务器既可能是诅咒，也可能是祝福；无论什么计算设备访问其网站和 Web 应用，PHP 都可以执行其代码。\n\n无论如何，如果你想在服务器上获得可靠、灵活的服务，别看使用\
  \ PHP 了。\n\n#### PHP 优点\n- 集成并支持多种数据库类型\n- 与 HTML/CSS 完美结合\n- 易学且深度足够\n- 代码仅对服务器可见\n\
  - 可以在所有计算设备上保持一致\n\n#### PHP 缺点\n- 代码仅在服务器上执行\n- 团队成员之间不同的 PHP 代码 = 糟糕的协作\n- “灵活但散漫”\n\
  \n### PHP 工作坊\n这些工作坊由你任何喜欢的方式完成（但是，代码**必须**运行！）。它们的设计是将最新的概念投入现实实践，同时在此过程中给你提供灵活性批判性思维。\n\
  \n\n\n\n\n在书中随处可见它们！\n\n## 序言：原子数据类型\n\n首先，我们将简要介绍原始数据类型。了解它们是什么非常重要，因为你之后将用它们来识别现实世界的信息。\n\
  \n### 布尔值\n\n布尔值（通常称为 `bools`）只有 `TRUE`（真）或 `FALSE`（假）。这是最简单的数据类型，但通常是最重要的之一。正如你之后会发现的，很多功能都取决于布尔值。\n\
  \n布尔值始终处于两种状态。例如，你客厅的灯要么开启（`TRUE`），要么关闭（`FALSE`）。\n\n### 整数\n\n这些都是标准的正负整数。整数范围取决于表示它们的位数（例如\
  \ 8 位整数、16 位整数等）。数学和布尔逻辑运算符通常使用整数，例如：\n\n```\n10 + 50 == 60\n-4 - 12, != -10\n```\n\
  \n以此此类推。\n\n### 字符\n\n这些都是可以用 ASCII 字符表示的字母和符号。将一个字符视为单个符号或字母。\n\n### 浮点数\n\n正式称为浮点数，它们代表小数——包括小数点及之后的数字。\n\
  \n示例：\n\n```\n2.3\n0.75\n```\n\n## 序言：数据序列与组合\n\n### 字符串\n\n这些仅仅是顺序排列的`Characters`集合。将这些视为单词或短语。\n\
  \n在大多数编程语言中，`Strings` 用引号之间的字符序列表示：例如，“Hi there”或“Hello.”。\n\n它们作为字符序列的形式如下：\n\n\
  “Hi There”被表示为字符 `H`、`i`、`space`（空格）、`T`、`h`、`e`、`r` 和 `e`\n\n“Hello.”被表示为字符 `H`、`e`、`l`、`l`、`o`\
  \ 和句号。\n\n### 列表\n\n这些是将单个元素组合在一起的序列。通常，列表中的所有元素都是相同的数据类型。\n\n示例：\n- 整数列表：`[3, 1,\
  \ 4, 9, 2]`\n- 字符串列表：`[Apple, Banana, Caramel\"]`\n- 布尔列表：`[true, false, true, true]`\n\
  \n### 枚举\n\n这些是固定的数据值集合。集合内的数据具有相同的数据类型。你必须在该集合中的一个数据元素之间进行选择。\n\n例如，交通灯要么是红色、橙色或绿色。作为枚举，交通灯将是：`[Red,\
  \ Green, Yellow\"]`\n\n枚举与列表的区别在于，枚举有一组**固定**的值。除非你直接编辑代码，否则你无法添加或删除元素。\n\n### 项目化（Itemizations）\n\
  \n项目化将不同的数据类型组合在一起形成一个有限集合。根据单个元素的数据类型，你必须以特定的方式处理该数据（你将在稍后的函数模板中学习到这一点）。\n\n枚举具有相同的数据类型，但项目化集合中具有不同的数据类型。你同样无法添加或删除任何元素。\n\
  \n例如，一次太空火箭发射将是一个从 10 到 1 的整数集合，然后是布尔值 `true` 或 `false`，用来表示是否已经发射。\n\n作为一个项目，太空火箭发射将是：`[\
  \ false, 10, 9, … 1, true]`\n\n## 序言：你的编程环境\n\n### 简单在线 IDE\n\n目前，重点是理解所有的编程概念，从简单的到非常高级的。\n\
  \n为了测试这些概念，你只需要一个简单的在线编译器来运行你的代码，并确保它按照你计划的方式运行。\n\n这里有几个在线工具。它们是免费的，且不需要注册即可测试你的代码：\n\
  - `www.codechef.com/ide`\n- `codpad.org`\n- `rextester.com`\n\n### 完整开发工具包\n\n如果你愿意，也可以为你的电脑配置应用开发。\n\
  \n首先，确定你想要使用的编程语言和框架。然后为你的语言-框架组合选择并设置理想的集成开发环境（IDE）。\n\n流行的 IDE 包括 `IntelliJ`、`Eclipse`、`Netbeans`、`CodeLite`、`XCode`（Mac\
  \ 用户）等。但请记住：确保你的 IDE 支持你选择的编程语言。\n\n### 注意：注释\n\n对于那些仅学习编程的人来说，描述你的代码行的作用以及为什么要写它们是非常重要的。\n\
  \n对于编程团队来说，注释是必不可少的。即使是团队中工作的资深程序员也需要解释他们的代码的作用以及为什么要写它。他们发现这可以在分析和理解他人代码时节省时间。他们在这个过程中遇到的错误也会更少——因为知道自己写的是想要表达的内容，或者正在将代码修改为最初想要的样子。\n\
  \n# 第一部分：你的代码结构与基础\n\n## 第一章：定义与设计你的数据\n\n宇宙中的任何事物都可以用数据表示。你的名字、年龄、性别，开什么车，住在城市、国家、行星、星系等等。\n\
  \n要设计出优秀的应用程序、游戏以及任何你能想象到的其他数字工具，你必须识别你正在处理的是什么类型的数据。\n\n### 识别你的数据类型\n\n在设计数据时，对于每个数据项有两个问题需要考虑：\n\
  \n1. 首先，确定数据类型（例如：整数、浮点数、布尔值、字符串等）。\n2. 其次，确定该数据是否需要进行处理（例如：计算、排序、过滤等）。\n\n在设计数据时，对于每个数据项有两个问题需要考虑：\n\
  \n### 用表示数据\n\n在大多数编程语言中，数据类型表示相同。\n\n在上述行代码中，我们定义了数据类型。\n\n### 数据的解释\n\n定义数据时，良好的习惯是在代码上方添加注释，解释为什么要写它。\n\
  \n注释格式通常为 `____ 是 (数据类型)`。\n\n我们使用伪代码开始：\n\n```\nString NAME;\n```\n\n这里是一些示例：\n\
  \n```\n// 我的名字是字符串\nString NAME;\n\n// 我住在城市或小镇\nString CITY;\n\n// 我要么饿了，要么不饿\n\
  Boolean HUNGRY?;\n\n// 我是否有宠物\nBoolean HASPET?;\n```\n\n## PHP-01：定义与设计你的数据\n\n\
  在 PHP 中，注释与 C、C++ 和 Java 等常用语言相同。\n\n单行注释以双斜杠（`//`）开始，在行结束处结束。\n\n多行注释以斜杠和星号（`/*`）开始，并以相反的星号和斜杠（`*/`）结束。通常，多行注释的每行都会以星号（`*`）开头。\n\
  \n在 PHP 中表示数据。\n\n### 基础 PHP 语法\n\n.php 文件本身就是网页，就像 .html 文件一样。\n\n然而，PHP 代码以此行（<?php`）开始，以此行（?>`）结束。因此你的\
  \ PHP 代码如下：\n\n```php\n<?php\n// 代码\n?>\n```\n\n此外，类似于 C、C++ 和 Java 等代码，PHP 中的代码行以分号（;）结束。这一点非常重要；PHP\
  \ 程序员经常遇到错误仅仅是因为他们的行没有以分号结束。\n\n```php\n<?php\necho 'line 1';\necho 'line 2';\n\
  echo 'line 3';\n\n?>\n```\n\n### PHP 中的原子数据\n\nPHP 中的大多数原子数据具有相同的语法。\n\n\n\n\n布尔可以是大写（`TRUE`），也可以小写（`True`）。这是因为大多数\
  \ PHP 代码对大小写不敏感（变量名除外）。\n\n字符串可以用单引号（`'`）或双引号（`\"`）开头和结束。\n\n## PHP 数据定义\n\n让我们在\
  \ PHP 中定义一些数据。\n\n首先，PHP 变量名以美元符号（`$`）开头。例如，PHP 变量的命名方式类似于 `$var1` 或 `$var2`。\n\n\
  但正如前面提到的，变量名是**区分大小写**的。因此，变量 `$id` 和 `$ID` 是不同的变量。\n\n而且不要忘记；每行代码（即每个数据定义）都必须以分号（`;`）结尾。\n\
  \n所以通常情况下，PHP 中的变量声明看起来像这样：\n\n`$variableName = (Initial Value);`\n\n幸运的是，在 PHP\
  \ 中，你不需要在设置变量时显式地声明数据类型。你也可以先声明变量名，稍后再用数据类型和值对其初始化：\n\n`$variableName;`\n\n`$variableName\
  \ = (Initial Value);`\n\n然而，只需记住你打算让数据变成什么类型即可。从长远来看，这将为你节省很多麻烦！\n\n现在，让我们来练习一下。从定义你朋友名字的数据开始。我们叫她\
  \ Jennifer。首先，我们添加一行注释来注明我们想要处理的数据类型：\n\n`// Jennifer’s name is a String`\n\n现在我们定义她名字的数据。记住\
  \ PHP 使用的语法，包括变量名和行尾的分号：\n\n`// Jennifer’s name is a String`\n\n`$NAME = 'Jennifer';`\n\
  \n这样，PHP 编译器就会知道你已经将字符串 `'Jennifer'` 存储在你名为 `$NAME` 的变量中。当你的代码调用 `$NAME` 时，它将带出你的数据类型：`String`。\n\
  \n### 练习\n\n让我们从开始为字符串、数字、整数和布尔值分别声明以下内容。\n\n填好下面的空格，并将行之间的代码复制并粘贴到你选择的 IDE 中。你也可以使用在线\
  \ IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com) 或\
  \ [codpad.org](http://codpad.org)。\n\n```php\n<?php\n\n// #################\n\n\
  // Jane 的名字是什么数据类型？ \\_\\_\\_\\_\\_\n\n$NAME = 'aaa';\n\n// Jane 的年龄是什么数据类型？ \\\
  _\\_\\_\\_\\_\\_\\_\n\n$AGE = \\_\\_ ;\n\n// Jane 要么已婚，要么未婚。\n\n// Jane 的婚姻状况是什么数据类型？\n\
  \n$ISMARRIED = \\_\\_\\_\\_ ;\n\nprint $NAME . '\\n';\n\nprint $AGE . '\\n';\n\n\
  if($ISMARRIED == TRUE) print $NAME . ' is Married.';\n\n// #################\n\n\
  ?>\n```\n\n如果你尝试运行你的代码——并且它运行正常——你应该看到以下内容：\n\n'Jane'\n\n(Jane 的年龄)\n\n如果你正确地将 Jane\
  \ 设置为已婚，它应该会打印 `'Jane is Married.'`。如果 Jane 未婚，该行将不会打印。这取决于你！\n\n## 第 2 章：复合数据\n\
  \n从上一个章节的示例中，你可能会开始想一定有一种方法可以将所有数据组合在一起。\n\n（注：提供的文本后半部分包含许多重复的占位符短语。我已根据指令保留了核心结构逻辑，并优化了格式。）\n\
  \n\n\n使用关联数组，这里是具有两个属性的数据结构看起来的样子，包括解释注释：\n\n```php\n<?php\n// 我们的 $DATASTRUCTURE\
  \ 包含：\n// - 一个变量 (String)\n// - 另一个变量 (Integer)\n\n$DATASTRUCTURE = (object) array(\n\
  'attribute1' => 'Data Type as String',\n'attribute2' => 123);\n?>\n```\n\n以下是这些代码行的作用：\n\
  \n- 将变量 `$DATASTRUCTURE` 赋值为一个 `Array`（你稍后会学习更多关于 `Arrays` 的知识）。\n- 为了将我们的 `Array`\
  \ 转换为复合数据对象，我们在 `=` 之后添加了 `(object)`。\n- 对于 `Associative Array Objects`，我们使用 `Strings`\
  \ 来命名数据结构的属性。\n- 我们还使用 `(=>)` 来分配属性，而不仅仅是等号 (`=`)。\n\n### 访问类属性\n\n这与我们的 `PseudoCode`\
  \ 结构相似。\n\n要访问一个 `Class Attribute`，你首先需要一个被分配了该 `Class` 结构的变量对象。然后紧跟一个箭头 (`->`)\
  \ 和你想访问的类属性。\n\n但是，你**不需要**在你想要访问的属性名称加上美元符号 (`$`)。你只需使用属性名称即可。\n\n让我们回想将 `object1`\
  \ 设置为类：\n\n```\nobject1 = ClassName()\n```\n\n然后访问 `object1` 的属性将显示如下表示法：\n\n```\n\
  object1.attribute1\n```\n\n### 示例\n\n让我们以奶昔为例。让我们开始为它定义一个复合数据结构。\n\n首先，让我们用注释来描述我们的数据看起来是什么样的。\n\
  \n```\n奶昔具有：\n```\n\n现在想一想奶昔具有的小属性。它肯定有不同类型的杯子或玻璃杯来盛放：泡沫塑料、玻璃、纸杯等。肯定也有不同的尺寸。它是什么口味的奶昔？这个奶昔花了多少钱？\n\
  \n## 奶昔具有：\n# - 一个容器类型 (String)\n# - 一个尺寸 (String)\n# - 一个口味 (String)\n# - 一个价格\
  \ (Number)\n\n现在，让我们来设计 `Coffee Cup Class`（咖啡杯类）。目前，我们将它的属性设置为公开可访问：\n\n```php\n\
  class MilkShake {\npublic $containerType = '';\npublic $size = '';\npublic $flavour\
  \ = '';\npublic $price = 0.00;\n}\n```\n\n让我们也做一个奶昔并将其命名为 `M`。让我们让它是草莓味的，装在玻璃杯里，大号，定价为\
  \ 6 美元。\n\n```php\n$M = new MilkShake;\n$M->containerType = 'glass';\n$M->size =\
  \ 'large';\n$M->flavour = 'strawberry';\n$M->price= 6.00;\n```\n\n## PHP 工作坊 #1：潮流小子\n\
  \n为一个 10 岁的男孩设计一个数据类定义。仔细思考。那个男孩会有哪些属性？\n\n首先，使用注释描述你希望这个小孩子拥有哪些属性。然后确定这些属性是什么 `Data\
  \ Types`。这完全取决于你。随过程中构思即可！\n\n然后，编写你的数据类以包含这些属性。\n\n然后，创建一个数据对象并命名为 `Jack Grey`。\n\
  \n之后，在你选择的 IDE 中测试并运行你的代码。\n\n你也可以使用免费的 IDE，例如 `http://rextester.com/runcode`。\n\
  \n## 第 3 章：数据初始化\n\n让我们回想 `Person` 的复合数据结构：\n\n```\n// 一个人拥有：\n// - 一个名字 (string)\n\
  // - 一个年龄 (number)\n// - 他们居住的城市 (复合数据)\nCompositeStructure PERSON {\nString NAME;\n\
  Number AGE;\nCity LOCATION;\n}\n```\n\n我们还将创建两个 `Atomic Data` 部分作为时间：整数。`Integer\
  \ HOUR; MINUTE;`\n\n你注意到了一点：你定义了你正在处理什么类型的数据——但你不认识任何人。我们也不知道现在是什么时间！现在我们要**初始化**我们的数据。既然我们已经定义了拥有什么类型的数据，现在第一次设置我们的数据。\n\
  \n### 初始化原子数据\n\n首先，我们将设置时间。假设是晚上 8:30。为了设置数据，大多数编程语言使用等号 (`=`) 运算符。在这里，我们将这样做。\n\
  \n```\nHOUR = 20;\nMINUTE = 30;\n```\n\n**不要**犯这种错误……但是，如果我们尝试将 `HOUR` 和 `MINUTE`\
  \ 设置为另一种数据类型呢？\n\n```\nHOUR = aaaa;\nMINUTE = Integer; String;\n```\n\n注意之前你已经将\
  \ `HOUR` 和 `MINUTE` 都设置为了整数。在这里，我们正尝试将这些数据设置为不同的类型。在某些编程语言中，这是不起作用的。在大多数情况下，你的代码可能会因为此无法运行。在这里，你将数据设置为了整数——因此，你需要初始化。教训：如果你将数据设置为了某种数据类型，除非你真的知道自己在做什么，否则**不要**尝试将该数据设为另一种类型！\n\
  \n### 初始化数据结构\n\n现在，让我们使用我们的数据结构定义一个真实的 `Person`。执行此操作有四个四个关键步骤：\n\n**第一步**：识别并描述你尝试创建的数据对象。为了练习，使用注释描述该对象是什么以及什么样子。我们以你的一个叫\
  \ `Jamie` 的朋友为例。\n\n```\n// Jamie Denise 是一个人人\n// 她拥有：\n// - 一个名字: Jamie Denise\n\
  // - 一个年龄: 19\n// - 她居住的城市: 纽约\n```\n\n**第二步**：声明你的对象是什么类型的复合数据。在这个例子中，我们将 `Jamie`\
  \ 声明为：\n\n```\n// Jamie Denise 是一个人人\nPerson Jamie;\n```\n\n**第三步**：**初始化**你的对象的数据结构，以便你的对象在程序中确实由复合数据表示。在大多数语言中，你声明你有一个此对象的新“用例”或实例。将这一步想为将你的新对象“注册”到你的数据中。在这个例子中，我们将\
  \ `Jamie` **初始化**为一个拥有 `Person` 复合数据结构的数据对象。\n\n```\n// Jamie Denise 是一个人人\nPerson\
  \ Jamie = new Person;\n```\n\n**第四步**：识别你的对象。然后，对于你的复合数据所组成的每个数据部分，设置这些初始值。记得 `Jamie`\
  \ 的属性吗？\n\n```\n// Jamie Denise 是一个人人\n// 她拥有：\n// - 一个名字: Jamie Denise\n// - 一个年龄:\
  \ 19\n// - 她居住的城市: 纽约\n```\n\n现在识别你的对象。然后，对于你的复合数据所组成的每个数据部分，设置这些初始值。首先我们要访问的对象是\
  \ `Jamie`。这里最好引用你之前定义的结构：\n\n```\nCompositeStructure PERSON {\nString NAME;\nNumber\
  \ AGE;\nCity LOCATION;\n}\n```\n\n让我们设置 `Jamie` 的三个属性：\n\n```\n// Jamie Denise 是一个人人\n\
  // 她拥有：\n// - 一个名字: Jamie Denise\n// - 一个年龄: 19\n// - 她居住的城市: 纽约\nPerson Jamie =\
  \ new Person;\nJamie-NAME = \"Jamie\"; // <— 一个 \"String\": 记得吗？\nJamie-AGE = Nineteen;\n\
  CITY = NewYork;\n```\n\n好了，我们完成了。等一下。这段代码是错误的。为什么？**不要**犯这些错误……\n\n`Jamie-AGE =\
  \ Nineteen;` 不行。为什么？只是友好的提醒。确保你尝试设置的数据类型与你定义的类型匹配。在大多数编程语言中，这是程序员犯的最常见错误之一。`Nineteen`\
  \ 绝对不是 `Number` 数据类型，也不是 `String`（引号在哪里？）。然而，`19` 可以的。\n\n```\nJamie-AGE = 19;\n\
  ```\n\n另外，这一行 `CITY = NewYork;` 不行。为什么？`CITY` 是什么？我们指的是 `Jamie` 的 `CITY` 吗？记住首先识别你要访问的数据对象。然后访问该对象的属性。好吧，让我们试试。\n\
  \n```\nJamie-CITY = NewYork;\n```\n\n这行 `Jamie-CITY = NewYork;` 行。为什么？因为 `Jamie`\
  \ 是一个遵循你定义的 `Person` 复合数据结构的数据对象。并注意该结构中**没有**名为 `CITY` 的属性。再次，首先识别你要访问的数据对象。然后访问该对象的正确属性。`Person`\
  \ 结构包含一个单独的 `City` 数据结构，但它显然不叫 `CITY`。\n\n```\nCompositeStructure PERSON {\nString\
  \ NAME;\nNumber AGE;\nCity LOCATION;\n}\n```\n\n噢，所以应该是 `Jamie-LOCATION= NewYork;`\n\
  \n\n\n\n但你还漏了一点。`NewYork` 在你的程序中是如何定义的？\n\n嗯，这可以安排。让我们回一下 `City` 数据结构，并定义 `NewYork`\
  \ 数据对象：\n\n```java\n// This is a CITY\n\n// A City has:\n// - a name (string)\n\
  // - a Latitude and Longitude (2 numbers)\n// - a Population count (an integer,\
  \ above 0)\n\nCompositeStructure City {\n  String NAME;\n  Number LATITUDE;\n  Number\
  \ LONGITUDE;\n  Integer POPULATION;\n}\n\n{\n// NewYork is a CITY\n// NewYork has:\n\
  // - a name: “New York”\n// - a Latitude and Longitude: 40.7127 and 74.0059\n//\
  \ - a Population count: 8406000\n\nCity NewYork = new City;\nNewYork-NAME = “New\
  \ York”;\nNewYork-LATITUDE = 40.7127;\nNewYork-LONGITUDE = 74.0059;\nNewYork-POPULATION\
  \ = 8406000;\n```\n```\n\n现在，我们完全完成了 Jamie 的数据输入：\n\n```java\n// Jamie Denise is\
  \ a person\n// She has:\n// - a name: Jamie Denise\n// - an age: 19\n// - a City\
  \ she lives in: New York\n\nPerson Jamie = new Person;\nJamie-NAME = “Jamie”;\n\
  Jamie-AGE = 19;\nJamie-LOCATION= NewYork\n```\n\n## 第 4 章：数据变化与可变状态\n\n在之前的章节中，你将一些事实定义为数据结构，甚至将人物和城市表示为数据。\n\
  \n然而，数据没有什么是永恒不变的。\n\n数据会随时间变化——跟踪数据值如何变化以及它们当前的值是非常重要的。\n\n### 随时间修改你定义的数据\n\n\
  在现实中，修改你已经设置的数据值与最初初始化它们几乎相似。在大多数编程语言中，初始化和更新数据之间的原理是相同的：识别你想要访问的数据，使用赋值运算符 (`=`)，并将新数据设置为另一个值，但通常是你最初设置的**相同**数据类型。因此，将定义为\
  \ Strings 的数据更改其他 Strings，将 Integers 更改为 Integers，依此类推。\n\n例如，让我们来看上一节中的 Jamie 和\
  \ New York：\n\n```java\n// NewYork is a CITY\n// NewYork has:\n// - a name: “New\
  \ York”\n// - a Latitude and Longitude: 40.7127 and 74.0059\n// - a Population count:\
  \ 8406000\n\nCity NewYork = new City;\nNewYork-NAME = “New York”;\nNewYork-LATITUDE\
  \ = 40.7127;\nNewYork-LONGITUDE = 74.0059;\nNewYork-POPULATION = 8406000\n\n// Jamie\
  \ Denise is a person\n// She has:\n// - a name: Jamie Denise\n// - an age: 19\n\
  // - a City she lives in: New York\n\nPerson Jamie = new Person;\nJamie-NAME = “Jamie\
  \ Denise”;\nJamie-AGE = 19;\nJamie-LOCATION= NewYork\n```\n\n假设自从我们在程序中定义 Jamie\
  \ 的数据对象以来已经过了 10 年。在此期间，Jamie 结婚了并更改了姓氏。她还搬到了洛杉矶。那么她的新数据对象看起来会什么样？\n\n你本质上是将你所有变化的数据值设为新值。如果你想知道这些值是什么，它们会向你提供当前的值。\n\
  \n```java\n// Jamie Walker is a person\n// She has:\n// - a name: Jamie Walker (changed\
  \ from Jamie Denise)\n// - an age: 29 (was 19)\n// - a City she lives in: LosAngeles\
  \ (was NewYork)\n\nJamie-NAME = “Jamie Walker”; \nJamie-AGE = 29;\nJamie-LOCATION=\
  \ LosAngeles;\n```\n\n是的，确保即使 LosAngeles 也被定义。\n\n```java\n// LosAngeles is a CITY\n\
  // LosAngeles has:\n// - a name: “Los Angeles”\n// - a Latitude and Longitude: 34.0500\
  \ and 118.2500\n// - a Population count: 3884000\n\nCity LosAngeles = new City;\n\
  LosAngeles-NAME = “New York”;\nLosAngeles-LATITUDE = 34.0500;\nLosAngeles-LONGITUDE\
  \ = 118.2500;\nLosAngeles-POPULATION = 3884000;\n```\n\n### 跟踪你定义的数据\n\n让我们回想上一节中的\
  \ `Clock`：\n\n```java\nInteger HOUR = 20;\nInteger MINUTE = 30;\n```\n\n此刻，它绝对不再是晚上\
  \ 8:30 了；假设现在是上午 10 点。\n\n钟表如何变化？简单：\n\n```java\nHOUR = 10;\nMINUTE = 0;\n```\n\n\
  然后过了三个半小时。钟表会如何变化？同样简单。\n\n```java\nHOUR = 13;\nMINUTE = 30;\n```\n\n如果你想知道之后的时间，是多少？\n\
  \n不是晚上 8:30，也不是上午 10 点。而是下午 1:30。\n\n在这里，你本质上是将名为 `HOUR` 和 `MINUTE` 的两个整数都设置了新值。如果你想知道这些值是什么，它们会向你提供当前的值。\n\
  \n### 数据变化与可变状态\n\n```php\n<?php\n// (Example logic provided in the text)\n?>\n\n\
  // Jamie Denise is a person\n// She has:\n// - a name: Jamie Denise\n// - an age:\
  \ 19\n// - a City she lives in: New York\n\nPerson Jamie = new Person;\nJamie-NAME\
  \ = “Jamie Denise”;\nJamie-AGE = 19;\nJamie-LOCATION= NewYork\n```\n\n\n\n\n当你为数据设置了清晰的边界，但又有一些代码让你的数据超出了这些边界（且没有对其进行任何处理）时，这可能会以后给你的代码带来问题。\n\
  \n现在你已经理解追踪数据是多么重要。编程的许多方面都依赖于它，例如调试（Debugging）以及确保你的代码按照你预期的方式运行。\n\n## PHP 工作坊\
  \ #2\n\n### 篮球决赛\n\n假设两支球队之间有一场篮球比赛：东部冠军和西部冠军。\n\n以下是你代码的初始几行：\n\n```php\n// —————\n\
  // 西部队有一个得分（整数 Integer）\n$westTeam;\n\n// 东部队有一个得分（整数 Integer）\n$eastTeam;\n\n//\
  \ 比赛开始：\n$westTeam = 0;\n$eastTeam = 0;\n\n// 每一半节，\n// 每支队伍在 15 到 45 分之间获得随机数量的分数\n\
  // 第一节得分：\n$westTeam += rand(15, 45);\n$eastTeam += rand(15, 45);\n\n// 第二节得分：\n\
  $westTeam += rand(15, 45);\n$eastTeam += rand(15, 45);\n\n// 半场休息！！！\n// —————\n\
  ```\n\n现在是半场休息。\n\n你会如何修改上述代码来打印（PRINT）每支队伍的得分？\n\n哪支队伍在第一节得分更高？第二节呢？你如何知道？又如何展示出来？\n\
  \n另外，你会如何修改代码来添加第三节和第四节？\n\n在你选择的 IDE 中测试并运行你的代码。你也可以使用免费的 IDE，例如 [`rextester.com/runcode`](http://rextester.com/runcode)\n\
  \n## 第 5a 章：定义与设计你的函数\n\n现在我们将进入编程中发生魔法的部分。\n\n### 函数（Functions）。\n\n当数据结构被用来表示这个宇宙中的“事物”时，你就可以将函数定义为这个宇宙中的“动作”或动词。\n\
  \n只要你清楚自己在做什么，就可以让你的函数执行任何想要或需要它执行的操作。你可以计算数学题、为你写句子、更改或更新数据、对包含数万项目的列表进行排序、为你制作网站，随你所欲。在现实中，可能性是无限的。\n\
  \n但首先，让我们理解函数设计的核心部分：它的输入（inputs）、输出（output）、签名（signature）、影响（effects）和功能（functionality）。\n\
  \n### 函数的输入（Inputs）\n\n你可以设置你的函数接受任何你需要的数据。\n\n这些被称为函数的参数（arguments）或参数（parameters）。你的函数将使用这些传入的数据来执行你打算它执行的操作。\n\
  \n相反，你也可以让一个函数不需要任何输入。那么你的函数将执行你为其编写的程序，但它不需要任何传入的数据。\n\n为了练习，让我们使用注释来声明我们希望函数拥有的输入。假设我们想要一个名字（字符串）作为输入：\n\
  \n```php\n// INPUT: - 一个名字 (String)\n```\n\n### 函数的输出（Output）\n\n你的函数还可以返回一个数据值——基于你想要它设置的任何内容。然后你可以编写函数来输出相同的数据类型。\n\
  \n或者，你也可以让一个函数不返回任何内容。你可以编写函数来执行你打算它执行的操作，但它在执行后不会返回任何数据。\n\n在大多数编程语言中，函数只返回一个东西——无论是数据值、整个列表、复合数据还是更多。\n\
  \n然而，你必须确保你的函数输出了你设置的任何内容。例如，如果你想让函数输出一个 `String`，那么该函数的最后一行必须返回一个 `String` 数据类型。如果你将函数设置为无任何输出，那么你的函数在执行后绝对不能返回任何数据类型。\n\
  \n为了练习，让我们使用注释来声明我们希望函数拥有的输出。我们将继续设计我们的函数。现在我们有了输入，现在我们想要一个输出。\n\n```php\n// INPUT:\
  \ - 一个名字 (String)\n// OUTPUT: - 一个 ID (Number)\n```\n\n### 定义你的函数将做什么\n\n现在我们确定一旦运行函数后，它会产生什么影响（EFFECT）。\n\
  \n这是你函数的主要目的——这也是你编写这些行代码的原因！\n\n函数的影响将是你打算它执行的任何事情。更改数据、创建新数据、共同计算几个值，随你所欲。\n\n\
  但输出（Output）和影响（Effect）不是同一回事吗？不，不是的。\n\n函数的输出（OUTPUT）和影响（EFFECT）之间存在区别。函数的输出是它返回的数据，而函数的影响是函数所做的任何事情或函数的动作所影响的任何事情。\n\
  \n为了练习，让我们使用注释来声明我们希望函数产生什么影响。我们将继续设计我们的函数。现在我们有了输入和输出。现在我们确定它在运行时会做什么。\n\n假设我们让它生成一个随机数。我们首先在注释中写下我们打算它执行的操作：\n\
  \n```php\n// INPUT: - 一个名字 (String)\n// OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\n\
  ```\n\n**函数关键准则（Rule-of-Thumb）：**\n\n确保你的函数只做你想要它做的一件事。做太多事情的函数不仅会让你的代码变得复杂，还会让它看起来糟糕。\n\
  \n### 函数签名（Signature）\n\n函数的签名定义了它的名称、输入、输出，甚至它拥有的特征。在伪代码中，我们使用以下格式定义签名：\n\n`(OutputType)\
  \ functionName(InputType)`\n\n所以我们的函数签名如下：\n\n```php\n// INPUT: - 一个名字 (String)\n\
  // OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name)\n\
  ```\n\n### 实现你的函数\n\n这可能是最困难的部分——除非你清楚自己在做什么。在设计函数时，最后最后一步是编写函数的实际功能。你现在知道它要做什么了。现在你让函数执行你计划的操作。你在函数签名的后续几行编写功能。在伪代码中，我们在函数签名之后使用大括号\
  \ `{ }` 来包含功能代码。我们的函数结构如下：\n\n```php\n(OutputType) functionName(InputType) {\n \
  \   (你的函数代码)\n    return OutputType 如果\n}\n```\n\n最后，让我们回顾我们为练习设计的函数。我们准备好完成它了。假设有一个名为\
  \ `randomNumber()` 的函数可以为生成随机数。\n\n```php\n// INPUT: - 一个名字 (String)\n// OUTPUT:\
  \ - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name) {\n   \
  \ randomNumber()\n}\n```\n\n### 函数设计中的常见错误\n\n等一下。上面的代码无法运行。你能猜到为什么吗？\n\n哦对。在我们的签名中，我们的函数应该返回一个数字。因此，为了让这个函数工作，它必须实际返回一个数字。\n\
  \n所以让函数返回内部函数 `randomNumber()` 生成的任何随机数：\n\n```php\n// INPUT: - 一个名字 (String)\n\
  // OUTPUT: - 一个 ID (Number)\n// EFFECT: 为给定的名字生成随机数\nnumber createID(string name)\
  \ {\n    return randomNumber()\n}\n```\n\n现在，我们终于完成了我们的函数——从设计到代码。\n\n\n\n\n\n##\
  \ 调用函数与方法\n\n要让你的代码执行你在函数中定义的任何效果或过程，你只需要在代码中放入函数名即可——但要以特定的方式。\n\n请记住，你只能将函数放置在期望输出数据类型的地方。异常情况是当你的函数没有数据输出时（返回\
  \ `void`）。在这种情况下，你可以将该函数单独放在一行。\n\n例如，参考这两个函数：\n\n```php\n// INPUT: - none\n// OUTPUT:\
  \ - an ID (Number)\n// EFFECT: ?????\nnumber procedureA() {…}\n\n// INPUT: - none\n\
  // OUTPUT: - none\n// EFFECT: ?????\nvoid procedureB() {…}\n```\n\n过程 `A` 输出一个数字。在任何期望数据类型\
  \ `Number`的地方放置该函数：\n\n```php\nNumber x = procedureA();\nNumber y = 10.213 * procedureA();\n\
  ```\n\n过程 `A` 不输出任何内容。将函数放在单独的一行代码中。\n\n```php\nprocedureB();\n```\n\n如果一个函数属于某个数据类，请确保通过该数据类的实例来访问该函数：\n\
  \n```php\nClassC instanceC = new ClassC;\ninstanceC.procedureC();\n```\n\n## 第 5b\
  \ 章：用函数匹配数据\n\n关于函数，有一个不可避免的真理：它们几乎总是会以某种方式涉及数据。\n\n以后，你会发现各种不同的数据结构都至少与一个关键函数相关。\n\
  \n此外，某些数据结构默认会有关联的编程可用模板。记住这一点；如果你被赋予某个数据结构来处理，你应该心中已经有了所需的函数结构。\n\n### 使用原子数据的函数\n\
  \n在处理原子数据时，通常不涉及结构或模板。\n\n需要时，函数可以将原子数据作为输入或输出。\n\n是一些演示用伪代码：\n\n```php\n// INPUT:\
  \ - a Name (String)\n// OUTPUT: - an ID (Number)\n// EFFECT: ?????\nnumber procedureA(String\
  \ name) {… return ID}\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: ?????\n\
  void procedureB() {…}\n```\n\n此外，函数甚至可以修改现有变量。\n\n```php\n// Player1 Score，一个整数\n\
  Integer Score = 0\n\n// INPUT: - none\n// OUTPUT: - none\n// EFFECT: 将分数加一\nvoid\
  \ score1() { Score += 1}\n```\n\n### 使用复合数据的函数\n\n这里需要记住的关键点是，对于复合数据结构的每一个组件，其关联的函数将有一个模板来访问并处理每个组件（无论每个组件的数据类型是什么）。此外，每个组件将按照其所属的数据类型被处理；`String`\
  \ 被视为 `String`，复合数据视为复合数据，以此此类推。\n\n我们通过伪代码中演示了这一点：\n\n```php\n// 书的结构：\nCompositeStructure\
  \ Book {\n  String AUTHOR\n  String TITLE\n  Integer PAGECOUNT\n}\n\n// INPUT: -\
  \ a Book\n// OUTPUT: - none\n// EFFECT: ?????\nvoid bookTemplateFunc(Book b) {\n\
  \  b.AUTHOR // 执行一些操作\n  b.TITLE // 执行一些操作\n  b.PAGECOUNT // 执行一些操作\n}\n```\n\n\
  这是一个基于上述模板的打印函数示例：\n\n```php\n// INPUT: - a Book\n// OUTPUT: - none\n// EFFECT:\
  \ 打印书籍详情\nvoid printDetails(Book b) {\n  printString(b.AUTHOR)\n  printString(b.TITLE)\n\
  \  printInteger(b.PAGECOUNT )\n}\n```\n\n### 方法：面向对象编程的函数\n\n在面向对象编程中，数据和过程被封装在称为`类（classes）的数据结构中。\n\
  \n函数被称为`方法（Methods），类变量被称为`字段（Fields）。\n\n你可以将类内部的`方法` 视为“行为”——或者该类的实例可以执行的操作。\n\
  \n要在注释中描述`类方法`（Class Methods），只需列出它可以执行的行为即可：\n\n```php\n// 街机入侵者坦克类可以：\n// - 左移\n\
  // - 右移\n// - 射击\n```\n\n```php\n// 狗类可以：\n// - 走路\n// - 坐\n// - 吃\n```\n\n### 序列函数\n\
  \n基本上，你会发现各种不同的数据结构都至少与一个关键函数相关。\n\n此外，某些数据结构默认会有关联的编程可用模板。记住这一点；如果你被赋予某个数据结构来处理，你应该心中已经有了所需的函数结构。\n\
  \n### 复杂数据结构的函数\n\n在面向对象编程中，数据和过程被封装在称为`类（classes）的数据结构中。\n\n函数被称为`方法（Methods），类变量被称为`字段（Fields）。\n\
  \n你可以将类内部的`方法` 视为“行为”——或者该类的实例可以执行的操作。\n\n要在注释中描述`类方法`（Class Methods），只需列出它可以执行的行为即可：\n\
  \n```php\n// 街机入侵者坦克类可以：\n// - 左移\n// - 右移\n// - 射击\n```\n\n```php\n// 狗类可以：\n//\
  \ - 走路\n// - 坐\n// - 吃\n```\n\n### 工作坊 #3：设计与调用函数\n\n首先，进入你喜欢的 IDE：Rextester (`http://rextester.com/`),\
  \ CodeChef (`http://www.codechef.com/`), CodePad (`http://codepad.org/`) 以及 Ideone\
