  \ Instagram 时代。\n\nKaur 和她的诗歌拥有极大的内容资本。她既是一位网红，又是一位诗人，这两种身份在她身上并非此消彼长，而是相互促进的：她之所以成为受欢迎的网红，部分原因是因为她的诗歌，而她的诗歌之所以流行，部分原因是因为她建立的在线平台。摄影师\
  \ Patrick Janelle 也是同样的动态——我们忽略了他的艺术性，转而关注他的生活方式奇观——或许还有像小说家 Sean Thor Conroe，他\
  \ 2022 年的作品 `Fuccboi` 采用了社交媒体和短信的语言，充满了简练的格言式行文和数字俚语。Conroe 的个人 Instagram 账号充满了忧郁的抽烟自拍，这些照片像他小说最终的封面，以“坏男孩小说家”的模式记录并戏剧化了作家的生活。成为职业艺术家一直意味着某种公众人物，但在“过滤世界”中，完美的图像是艺术的先决条件。\n\
  \nKaur 意识到 Instagram 如何对她的作品施加审美压力，让某些主题比其他主题获得更多关注。在 2017 年接受《娱乐周刊》（Entertainment\
  \ Weekly）采访时，她说：“我在网上获得最多的喜爱是关于情诗和心碎的诗。”例如，关于性暴力的诗歌获得的点赞较少。有一次，她转为为期一个月只发布这些基础主题，她的互动数据确实上升了。但她说，这感觉也并不真实。艺术家必须积极反抗社交媒体的激励机制，那种不断诱惑人们只给观众他们点击最多的东西（也要忘了观众在做决定时同样会被信息流所操纵）。“当你陷得太深时，你就会让人们的思想改变你想创造的和你想写的东西，”Kaur\
  \ 说。对社交媒体的持续被动消费导致了深层自我意识的缺失，Kaur 承认这一点，尽管她的作品正利用这一点将陈词滥调装点成独特的见解：“我们连接得太密了，以至于几乎不再与自我连接，”她说道。根据某些采访，Kaur\
  \ 手机上没有社交媒体，而且像许多名人一样，她有一支员工团队管理她的真实账号，在从其呈现的亲密感中获益的同时，将自己与其在线形象隔离开来。\n\n在任何将社交媒体视为艺术对立面的评价中，都存在着精英主义的成分。并不是每个人都能进入传统的、更被接受的艺术创作途径：常春藤大学、文学杂志、切尔西的画廊。利用引人入胜的图像成为一种吸引受众的手段，但并非所有艺术家都能触及。这种动态方式同样适用于摄影师\
  \ Patrick Janelle——或许也像小说家 Sean Thor Conroe，他的 2022 年的作品 `Fuccboi` 采用了社交媒体和短信的语言，充满了简练的格言式行文和数字俚语。Conroe\
  \ 的个人 Instagram 账号充满了忧郁的抽烟自拍，这些照片像他小说最终的封面，以“坏男孩小说家”的模式记录并戏剧化了作家的生活。成为职业艺术家一直意味着某种公众人物，但在“过滤世界”中，完美的图像是艺术的先决条件。\n\
  \n*(注：此处去除了原文中重复的段落，仅保留不同核心内容的翻译。)*\n\n\n\n我第一次通过一位共同的小说家朋友结识 Depp；当时她正为了书签巡演经过这座城市，并邀请我在\
  \ Depp 华盛顿特区的店里为她举办活动。考虑到疫情无止境且不可预测的反复，这位小说家和我虽然是面对面的，但我们的对话通过 `Zoom` 播发给了物理上不在场的观众。这个超现实时刻的积极之处在于，活动结束后，Depp、那位小说家和我一起去了\
  \ Depp 最喜欢的酒吧——红德比（Red Derby）。那是一个杂乱、破旧的地方，墙上堆满了杂物，宽敞的屋顶酒吧提供着充足的威士忌姜汁。红德比是那种为其自己的地理位置和社区感到自豪的酒吧：它并不试图迎合\
  \ Instagram，也不刻意去经营良好的 Yelp 评价。这家酒吧及其老板因是当地创意群体的优秀雇主而闻名，他们营造出的一种好客氛围也为 Depp 发展自己的业务增长了灵感。\n\
  \n在红德比酒吧的各种饮品中，Depp 和我讨论了互联网对书籍的影响：创作、销售、寻找和阅读。Depp 天生带有一种权威感；作为在极其白人、单一且保守的图书出版和销售领域的一名黑人酷儿女性，她必须开辟自己的道路并建立一种新机构。她最初学习艺术史，这让她对视觉文化产生了兴趣，并在像华盛顿\
  \ Politics and Prose 这样的老牌书店工作过。先在 Twitter 上、后在 Instagram 上发现了一个其他有色人种讨论书籍的社区，这给了她更大的信心去创业。（算法推送也能帮助人们找到彼此并建立社区。）“忠诚”（Loyalty）最初并没有固定的地点，但\
  \  留心地安排她的临时店面装置，带有一种永久感。她复制了自己客厅的审美风格：“那是‘古董店遇见宜家’，”她说。\n\n她注意到华盛顿聚集了大量的书虫博主（bookstagrammers），这部分归功于该市的主要产业——这些行业雇佣了受过良好教育的官僚，他们有空闲维护社交媒体账号。书虫博主也感到自己与文学主流界隔阂。相比于纸质出版物的传统评论家，他们被忽视了；直到事实上，出版商才开始直接与网红合作，分发难以获得的校样书。Depp\
  \ 说，“书虫博主‘倾向于女性或酷儿’。他们想要一家不会问出‘你为什么要拍照？’或将他们的阅读品味天生低下的书店。”通过社交媒体成名的书籍通常是言情和奇幻小说，比如凯西·麦奎斯顿的《红、白、王室与蓝》（一个关于美国人和威尔士王子的同性恋故事），以及\
  \ V. E. 施瓦布的《阿黛·拉鲁的奇异生活》（关于时间旅行和不死诅咒的故事）。\n\n因此，当 Depp 搬入长期经营的场所时，这些空间必须充满有趣的瞬间，以提供良好的拍照背景。“视觉部分是卖点。什么会让某人进来并说‘噢我的天，我必须发这张照片’？”Depp\
  \ 说，“一切的安排方式都能确保如果你拍张快照，它看起来很好看。我想的是店里的每一寸空间不仅是在三维现实空间里，而且如果放在正方形框或长视频里，它能否捕捉你的目光？”它是针对在线内容创作进行了优化的，因为商店和书籍都必须通过算法推送进行传播，就像它们在物理空间中发挥作用一样：对于在线的路人，也对于从人行道走进来的人。\n\
  \nDepp 较难把握的是，哪些书籍会在 Bookstagram 或 Booktok 上流行。Instagram 速度较慢且更本地化；书商可以关注其客户群的趋势，并确保备货那些吸引买家的系列书籍。（许多书店开始摆出‘你在\
  \ Instagram 上看到的书’的桌子。）但 TikTok 更具即时性，并触达更广泛的全球观众。“它脱离你的控制的速度快得多，”Depp 说，“这仅仅是一种更强大的趋势算法。”出版商经常对哪些书籍会走红感到意外，他们挣扎于印刷足够的书籍并将其运送到正确的地点，这意味着像“忠诚”这样的商店无法储备足够的销售副本来卖给客户。这有时会导致客户转回到算法反派——亚马逊，因为亚马逊可以接收并持有更多的副本——部分原因是出版商优先供应给这家规模大得多的公司。\n\
  \n网红推推广的文学类型也存在同质化，缩小到那些可以在信息流中快速传播的书籍。“畅销者通常是写情感类书籍的直体女性：自我帮助导向的、言情的，或者——”Depp\
  \ 解释道。Booktok 之星科琳·霍佛（Colleen Hoover）可能属于后一类，而玛德琳·米勒对希腊神话的两个重构作品《阿喀琉之歌》和《喀耳塞》，在\
  \ Booktok 关注后销量都突破了百万，将古代原型的宏大与千禧一代对爱情和关系的感性融合在一起（把乌尔西斯变成了一个落魄的浪男）。\n\n算法策展也会疏远消费者。埃莉诺·斯特恩（Eleanor\
  \ Stern）是一位作家和应届研究生，她是 Booktok 的一部分，但也对此持怀疑。她在 2020 年疫情期间加入平台，并在 2021 年开始制作视频。我把她是一个\
  \ TikTok 原生代的评论家。她对着摄像头口述从晦涩语言学到新书和杂志文章的所有话题。她有超过七万粉丝，对于她的主题来说这是一个很高的数字。当涉及到文学文化时，TikTok\
  \ 的算法推送“确实在驱动一切趋向同质，”斯特恩说。这是一个问题，因为“为你推荐”流（你的个性化算法）也被视为“潜意识的外化版本”。斯特恩观察到 TikTok\
  \ 如何鼓励用户将自己归入特定的身份类别或类型，就像它对文化类型进行分类一样。“无论你消费什么，它变成了你自我的表达；它只在能描述你时才存在，”她说。在平台上，书籍的流行不再是作为阅读的文本，而是作为可购买的生活配件，身份的视觉符号。这就是滤镜世界（Filterworld）所鼓励的自恋倾向。\n\
  \n\n\nDepp 发现，当人们进入她的商店时，如果看到她没有在显眼位置展示最火的 TikTok 书籍，甚至店里根本没有这些书，他们会感到惊讶。他们预期她的空间遵循信息流的逻辑，但事实并非如此。这是因为\
  \ Depp 亲自挑选店里的每一件物品：一种“人的算法”。“他们没有意识到这种策展并不是由互联网上的某个第三方完成的，因为他们看待所有信息的方式，是由互联网上的一只无形的手所策划过的，”她说道。在足够迎合算法流和过度依赖它们之间找到平衡点是一个极难的挑战。追求极高关注从而获取利润的诱惑始终存在，但过度依赖自动化信息流的累积效应会导致一种感官迟钝。我们最终变得，无法想象文化可以脱离算法的其他方式运作。\n\
  \n## 算法对创造力的压力\n\n我第一次在 21 10 年初认识我的朋友 Hallie Bateman，当时我们都住在布鲁克林。她从湾区搬来，在那里兼职咖啡师的工作，同时追求她从事绘画和社论插画的艺术实践。我们通过一个共同朋友认识的，那位朋友经营着一个博客，Hallie——用她的姓氏显得太正式了——在上面投稿漫画，而我撰写文章。但实际上，我们是在\
  \ Twitter 和 Instagram 上每天关注对方的作品。当她在 *The Awl*（一家极具影响力的纽约博客，已于 2018 年关闭）以及最终的《纽约客人》（*The\
  \ New Yorker*）网站上发表艺术和文字时，我一直为她加油。\n\n一直令我印象深刻的是 Hallie 作品中的奇诡与个性。21 10 年代是整洁、扁平化设计的时代，那些平滑的、柔和色彩的图形看起来就像被熨斗机压过一样。（有一个名为\
  \ `Humans of Flat` 的 Twitter 账号收集了各种通用的初创公司插画风格示例，这些风格准备好在社交媒体上进行推广。）相反，Hallie 却坚决地在纸上作画，线条乱糟糟的、颤巍巍的，让人联起如\
  \ Lynda Barry 和 Roz Chast 这样的漫画家。整洁的完美从未重点；相反，重点似乎她在每一处涂鸦中融入了多少情感，无论是一张她狗的速写，还是一个描绘生活本身混沌本质的叙事性场景。她最为人知的图像之一是她在\
  \ Instagram 上发布的一个白色正方形，上面有一群极小的人形在走动，每个人都拖着一条属于自己的原色线条。他们中的似乎都不会发生交汇。在画的中心，Hallie\
  \ 写道：“我们能相遇真是个奇迹。”这是一件苦乐参半的作品：在这个世界上，我们的生活确实与极少数其他人产生了重叠，但他们确实产生了重叠这一事实本身就值得庆祝。这件作品非常受欢迎，传播范围远超\
  \ Hallie 的个人账号，以至于许多人在不知道其起源的情况下将其纹在身上。在《过滤世界》（`Filterworld`）中，它被强行地剥离了语境。\n\n我记得晚上，我们散坐在\
  \ Hallie 布鲁克林公寓客厅的低矮咖啡桌旁；她的室友们是学者、作家和其他艺术家。那种氛围让任何人都能发挥创造力：你不需要把自己当成艺术家也可以去画画、弹奏乐器或写诗。其他人也是如此，无论他们的专业水平如何，都没有权力评判你所创作的任何东西在艺术上是不价值的。（这与互联网恰恰相反，在互联网上每个人都觉得自己有权批评或评论。）Hallie\
  \ 通过她的在线形象也散发出这种精神——这就是为什么当她开始发布自己无法忍忍 Instagram 时，我感到惊讶，尽管她在那里拥有超过十万粉丝，并利用平台出售作品打印品，并在大型出版社出版了书籍。\n\
  \nHallie 职业生涯和在线艺术实践的轨迹，勾勒出了 20 00 年代末到 21 10 年代互联网上创造力的历史。当时，用户创建的小型网站让位于了巨大的社交平台，而算法流决定了观众所看到的内容。这也显示了这些信息流的规模和自动化程度是如何让最初吸引观众的创作者感到疏离的。\n\
  \n\n\n\n“这是一种格式；它是可识别的；你可以重复它，”哈莉（Hallie）解释道，“我会大批量地创作，然后逐一检查并发布。”这是一种像迷因一样的流水线式过程，非常适合\
  \ Instagram：鲜艳色彩和简单的文字为她粉丝的动态增添了些许趣味，同时也伴随着简单的道德信息。粉丝们开始仅仅为了这些作品而依赖她的账号。“人们关注你，并继续对此抱期待，”她说。每一张“指南”（Directions）图片都会获得数千个点赞。从互动率的角度来看，这个系列是一次彻底的成功，但哈莉对此持矛盾态度。她的风格在每件作品之间一直在变化。“我开始对这种流行感到反感和困惑。我必须告诉自己：‘不要受此影响，继续做下去。’这一切听起来也像是对你其他作品的评论，”她说。她其他所有画作点赞更少这一事实是否意味着那些作品更糟糕？她应该永远一直画下去她的“指南”吗？哈莉感受到的那种让其他艺术作品同样明亮、清晰和简单的压力，就像音乐家感受到的那种将歌曲钩子（hook）前置以便其在\
  \ TikTok 上成功的压力，又像作家感受到的那种让观点足够火爆以点亮 Twitter 动态的压力一样。\n\n与此同时，Instagram 也在发生变化。哈莉在\
  \ 2017 年左右感受到了算法推送的显著差异，帕特里克·詹内尔（Patrick Janelle）等人也是如此。“我开始真正感受到心理上的转变，从有趣和鼓励变得有些疲惫和无所措。Instagram\
  \ 变得变得更加不稳定，”她说。Instagram 的推荐机制将她的作品推给了并不理解其背景的观众；当她的艺术或标题涉及政治问题时，她开始收到仇恨的评论。\n\n\
  因此，哈莉决定离开社交媒体。她仍然创作许多其他艺术作品，但不再发布它们。以前，她的创作过程不可避免地受到线上表现良好的内容的塑造，并受到持续反馈循环的影响。现在，情况不同了。“我已经从一个‘测试气球型’的艺术家转变为那种‘正在忙于很多事情，除了朋友外不告诉任何人’的艺术家，”她说，“如果我不是为了这个平台创作艺术，我就是为了我自己，或者为了人类。”\n\
  \n这种内在的创作过程，甚至是独立思考的过程，在“过滤世界”（Filterworld）时代似乎是缺失的，在那个时代，任何想法或思想都可以被瞬间公开并接受互动率的测试。作为影响者的艺术家并不是内省的；她存在于事物转瞬即逝的表面，根据反应进行迭代和适应。哈莉的评论让我感到一种私人的悲哀：我是否已经丧失了独立思考的能力，或者说在没有隐形观众的动力下，我不再愿意进行创作工作了？哲学家韩炳哲（Byung-Chul\
  \ Han）描述过生活在后互联网社会的人可能“不再拥有无意识”。\n\n现在艺术的制作和分发方式与过去几个世纪完全不同。在安静的工作室、工作坊或写字台旁，没有观众不断的冷嘲热讽。创新不再来自对持续互动率指标的适应，而是来自初看之下可能令人震惊的创意跨越。当你过早地顺从预期或重新排列你的想象力以适应特定的标准时，创作精神就会被扼杀。哈莉感受到的那种让其他艺术作品同样明亮、清晰和简单的压力，就像音乐家感受到的那种将歌曲钩子前置以便其在\
  \ TikTok 上成功的压力，又像作家感受到的那种让观点足够火爆以点亮 Twitter 动态的压力一样。\n\n# 第五章\n\n▪ ▪ \n\n## 监管过滤世界\n\
  \n## 莉·罗塞尔（MOLLY RUSSELL）\n\n现在，我们这些用户受算法推荐的摆布。它们是一种弗兰肯斯坦式的现象，由人类发明并赋予权力，但其作用远超了人类本身。我们无法控制或影响它们。就像邮局、下水道系统或电线路一样，它们是必不可少的，但与这些公共基础设施不同，它们不受政府的监督或监管。推荐系统肆意生长。也许我们倾向于忽视它们在文化领域的反复无常，因为它们所影响的内容似乎没有自来水那么重要。如果\
  \ Spotify 在用户听完一张金属乐队的专辑后开始推荐一系列金属音乐，那么算法的单调可以被付之一笑或作为小故障而被忽略。这看起来并不特别危险，因为最大的风险是无聊。然而，内容的算法加速可能是一个关乎生死的问题。\n\
  \n2017 年 11 月，一位来自伦敦西北部的 14 岁学生莫莉·罗塞尔（Molly Russell）自杀身。然而，罗塞尔对自己的行为并非完全负责责任。2022\
  \ 年，伦敦北部首席法医安德鲁·沃克（Andrew Walker）以不同的方式描述了她的死：“她死于抑郁症和在线内容负面影响期间的自残行为。”在一个开创性的时刻，沃克正式将社交媒体列为潜在的致命医学危险。罗塞尔的背景讲述了一个社交媒体时代青少年熟悉的故事，在那个时代，生活在网上和在生活中同样丰富。像任何青少年一样，罗塞尔花费了大量时间使用数字平台。在她去世前的六个月里，她在\
  \ Instagram 上接触了超过 1.6 万条内容。根据政府对其死亡的调查，其中 2100 条（即 13%）与自杀、自伤和抑郁有关。罗塞尔还围绕这些主题建立了一个包含\
  \ 469 张图片的 Pinterest 画板。\n\n\n\n\n算法推荐在向拉塞尔（Russell）推送大量心理健康相关内容方面发挥了主要作用。《Wired》杂志报道，拉塞尔曾收到一封标题为“你可能喜欢的抑郁图钉”的邮件，其中包含一张血淋剃刀的照片作为其画板的建议——将这种负面图像与\
  \ Pinterest 上占据大量空间的家居装饰灵感同等对待。随后，Facebook 透露拉塞尔被推荐了三十个名称中带有“悲伤或抑郁主题”的不同账号，这为她接收可能恶化其心理健康的内容提供了更多途径。在她自己的秘密\
  \ Twitter 账号上，拉塞尔转发了诸如“抑郁语录”之类的账号，分享了美化自杀的图片，并联系了谈论抑郁的影响者。社交网络的信息馈流驱动了法医所说的“沉溺期”，期间，拉塞尔会消耗自动推送给她的内容。\n\
  \n拉塞尔的去世是算法过度扩张的人类代价之一，当内容的移动速度之快、规模之大，以至于无法通过人工审核时，任何杂志的编辑都不会发布如此大量的抑郁内容，电视频道也不会播放它。但算法推送流可以汇集出一个即时的、按需的集合，交付拉塞尔可能认为最有吸引力的内容，尽管这些对她有害。拉塞尔案例的悲剧证明了“过滤世界”（Filterworld）的问题通常是结构性的，根植于数字平台运作的方式之中。用户改变行为所能做的是有限；我们无法信任这些机制永远会将我们的福祉优先置于引发更多以驱动广告收入的互动之上。用户在数字平台内只能行使某些类型的主动性。例如，他们可以追求特定的主题内容，但无法改变推荐算法的方程式。我们没有足够的替代方案来在算法馈流之外浏览互联网，部分原因是因为互联网现在很大程度上由少数几家公司主导。\n\
  \n## 结构性垄断\n\n我们今天的在线体验是高度中心化的。消费者被驱赶到少数巨型平台——Twitter、Facebook、Instagram、TikTok、YouTube——并被留在大众平台的范围内寻找他们想要发现的任何东西。由于观众在这些平台上如此集中，创作者也也必须在这些平台内工作，将他们的作品转化为内容并适应平台的馈流。如果他们这样做，他们将保持相对隐形。尽管我们在在线上看到的许多内容是“用户生成”的——自由上传，既没有门禁也没有支持——但它仍然必须符合公司决定的预设模具。然而，互联网在几十年的历史中经历了几次中心化和去中心化的周期，早期的时代可能为用户体验提供一个更好的模型。\n\
  \n## ARPANET 与 Usenet 时代\n\n1969 年，在美国国防部高级研究计划局署（DARPA）的控制下，只有几台联网计算机。ARPANET 是第一个广域计算机网络。人们可以将其所包含的每台计算机都绘制在一张小小的美国地图上——它不仅是中心化的，而且你只能通过政府和大学访问它。逐渐地，它扩大了。如果说\
  \ ARPANET 像是一个地铁系统，只连接特定的点，那么始于 1980 年创建的 Usenet 则更像是一条道路：任何拥有相应设备的人都可以加入。Usenet\
  \ 是互联网上分发和消费内容的最早方式之一。它是一个数字告示牌系统，最终连接到了 ARPANET。任何拥有服务器的人都可以托管“新闻组”（newsgroup），人们可以使用它来发布文章和帖子。新闻组为讨论从近期政治新闻到家庭酿酒最佳方法等任何话题提供了空间。每个新闻组都有自己的主题和规则；没有一个新闻组能控制网络。这些小组的策展和节奏完全由其参与者设定。\n\
  \n## “永恒的九月”\n\n尽管如此，这些在线观众是一群精通新兴技术的自选性高级用户。他们很可能受过良好教育且富有。大多数人在上大学时第一次访问 Usenet，以及互联网本身，这导致了一个奇怪的问题。每年九月，大量新学生会涌入新闻组，却并不知道规则或礼仪。这不是他们的错；他们只是从未进入过在线社区。但他们倾向于大肆破坏，发表离题评论，卷入争吵（“喷口战”），并破坏既定的基调，就像一台推土机滚入平静的森林。逐渐，这些“新手”（noobs，用我那代人的网络俚语来说）变得令人无法忍喻，骚扰着老用户。公司也开始通过家庭拨号连接访问\
  \ Usenet。美国在线公司（AOL）于 1993 年整合了 Usenet，新手的突然涌入被称为“永恒的九月”（Eternal September）。这个短语的含义是，错误的类型用户突然主导了这些曾经的小众群体。数字景观，即数字文化的早期版本，似乎被毁了，尽管它当然持续存在着。\n\
  \n## AOL 的兴起\n\nAOL 将互联网简化为易于使用的选项菜单，将其中心化，使其在 2000 年左右达到了 2300 万订阅者的顶峰。它那无处不在的光光盘（无论你是否已经拥有该服务，每月都会邮寄送达）在简单的网页界面上加载了一系列横幅。点击这些横幅允许用户进入娱乐、体育和个人财务等其他主题的指定网站区域——类似于\
  \ Usenet，但更平易近人且用户生成的内容更少。这些主题频道是我 20 世纪 90 年代最早的一些互联网体验所在地。当然，我花费时间最长的是“儿童专用”板块，那里为孩子们举办了安全的（理论上是这样，但实际上并非如此）聊天室、“作业帮助”以及带有在线高分榜单的基础电脑游戏。\n\
  \n我最清楚地记得这些早期的互联网空间，是在家庭旅行期间，我在祖父母家里通过台式电脑登录的时候。也许是因为在那里我父母对我的关注较少；我可以坐在“电脑房”（客厅旁一间杂乱的前厅）的小桌子旁，坐在一把中世纪风格椅子上，盯着笨笨的白色显示器。那里有一叠\
  \ CD 盒（现在已是完全的过董），里面装着电脑游戏和软件，但发现你完全可以在线在包含 Internet Explorer 浏览器的 AOL 软件内找到要做的事，这是一种启示。我被那种可能性所吸引了。AOL\
  \ 频道是我最早的社交媒体版本，也是我第一次接触在线文化。它们让我感觉到，还有人在通过他们自己的屏幕进行着活动和思考。\n\n但只要我可以，我就会离开那个公司化的空间，发现了一个更广阔、再次变得去中心化的互联网。人们在没有监督的情况下建立自己的\
  \ HTML 网站，而且通常缺乏专业性。网页曾是一个业余区域，由手工页面组成，这些页面推崇某种特定的粉丝（例如剧集《良家女孩》）或小众爱好（如建造独木舟），通过早期的\
  \ Google 搜索很容易发现。你可以使用像 1994 年启动的 Geocities 这样的服务，使用基础工具构建和托管网站，但没有两个 Geocities\
  \ 页面看起来是一样的。它们是怪异的动画 GIF 在混乱的框架布局中的碰撞，就像是孩子做的一样。\n\n\n\nLiveJournal 起于 1999 年推出，提供了一种更直观的日记体验，让每个用户脱颖而出的的是他们发布的文本。它是更流行的博客形式的前身，这种服务允许用户拥有自己的个人页面，并设计其呈现方式以匹配自己的个性或选择的主题。论坛架构也允许人们设计自己的社区空间——那些软件工具的名字，如\
  \ `vBulletin` 和 `phpBB`，会唤起我对头像和签名横幅的视觉记忆。我加入了那些我所痴迷的大型在线角色扮演游戏社区的论坛。\n\n其中一个网站名为\
  \ `Merchant Guild`，那是一个金绿相间的公告板，人们在上面讨论 `Ragnarok Online`，这是一款韩国 MMORPG，占据了我青少年早期的绝大部分时间。在那里，我可以与那些化用假名的陌生人互动，他们把我当作同龄人，这给了我一种在生活中其他地方所缺乏的掌控感；而在高中的课堂上，我必须尽职尽责地听课，电脑存在是为了玩\
  \ `Number Munchers` 和 `Oregon Trail` 的。我不是在英语课上举手，而是可以讨论如何才能最好装备一个骑士角色。我在网上学到了很多东西；只是在那个时候，这些与我生活的其他任何方面无关。我参与的其他论坛专注于特定的即兴乐队或分享演唱会录音。这些是我在线下无法接触的利基领域，因为我与这些社区缺乏任何物理上的距离。\n\
  \n通常情况下，如果一个网站存在，那是因为人们（一个或多个个人）付出了努力让它出现在那里并保持运行。我第一次接触在线发布是在高中，我于 2002 年作为大一新生进入高中的，当时一个名叫\
  \ Parker 的朋友在她为自己建立的艺术作品集网站上建立了一个博客。在周周复一日地阅读了她的帖子后，我请求她也为我做一个类似的，然后花费了无尽的时间摆弄横幅设计和字体。我最终做出的东西能唤起咖啡馆内部的氛围——我记得网站横幅上有一张经过深度修图的冒热咖啡杯照片——或者是一间安静的图书馆，背景色调是柔和的灰色和棕色。即便在那时，我唯一常去的咖啡馆也是一家带有得车窗的独立\
  \ `Starbucks`，我在那里大多点的是大杯过热的绿茶，但那种氛围对我来说是向往的。\n\n在我真正明白“发布”意味着什么之前，我在那个博客上发布了数十篇帖子，尽管它们大多是对学校或我父母的抱怨。我甚至没有完全意识到其他人也能看到这些愤青的文字。在\
  \ 21 世纪初，玩上网仍然是一项足够“极客”的追求，很少有人理解它的什么意义。它没有在学校里引起嘲笑，因为其他孩子并不知道论坛是什么，数字生活也更加安静，因为现在人身攻击横行的社交媒体公共竞技场当时还不存在。由于网络喷子或机器人的大军无法骚扰单个用户。由于一切的规模都更小，因为它不那么中心化。Parker\
  \ 可能是唯一读过我帖子的那。尽管如此，这个博客让我理解了拥有一个数字影子自我意味着什么，那是一个只存在于网上的生活和性格版本。在当时，这感觉像是一次激进的创新，一种耳目一新的新奇。我可以控制自己在网上的如何呈现自己。尽管如此，我并没意识到屏幕另一端是谁在关注，部分是因为我们的网络存在与我们的现实生活联系得那么紧密——在网上使用全名会显得很奇怪。在社交媒体接管世界之前，它曾本身就是一个小众领域，一种晦涩的爱好。随着互联网与“现实生活”密不可分，这种脱节感慢慢改变并消失了。\n\
  \n到 2004 年，我有了一个 `MySpace` 账号，但只有几个高中同学也有，而在上面最流行的活动是重新排列你喜欢的歌曲列表和最好的朋友。`Friendster`\
  \ 早于 `MySpace` 出现，并且在比我稍大的人群中流行，也一直存在。`Facebook` 起始于大学生群体。和 `Usenet` 一样，进入学校是进入它的途径。这个现在无处不在的社交网络最初用于联系同学并发布派对照片或关系更新，但它很快变成了一个吸入其他类型数字内容的真空中，特别是当它向非大学群体开放时。\n\
  \n朋友的状态更新穿插着群组通知、新闻文章和广告，并由算法推送进行过滤。这家公司开创了这种内容的碰撞，与其说是用户要求的，不如说是它符合其自身的利益——就像 `Walmart`\
  \ 或 `Amazon` 一样，如果 `Facebook` 能一次性提供所有服务，那么它的用户就没什么理由使用竞争服务了。从手动构建 `HTML` 网站的完全专业化形式，互联网正向一种一刀切的方法转变。`Facebook`\
  \ 既是个人博客，又是论坛、新闻推送和相册库。显而易见，马克·扎克伯格并不希望它仅仅是一个网站，而是我们数字生活的全部。互联网已开始结合成少数巨型平台。\n\n\
  `Facebook` 在 21 10 年代初确实有竞争。`Twitter` 在 `Facebook` 发布两年后推出，为那些希望在尽可能小的空间内获取尽可能信息的人提供了实时的、按时间顺序的信息流，因此最初的\
  \ 140 个字符限制具有吸引力。`Tumblr` 提供了一种更侧重图像且更私密的体验；作为对 `LiveJournal` 的更新，它倾向于成为私人思考和奇珍收藏的聚集地。我喜欢的一些\
  \ `Tumblr` 策划了具有感染力的动漫截图或中世纪手稿插图。（不同程度的色情也大量存在，这使得 `Tumblr` 与其他社交网络区别开来。）但在 `Instagram`\
  \ 出现之前，没有什么真正威胁到 `Facebook` 对在线社交的控制。我记得 2011 年加入时，这个应用感觉像是一股清风。`Instagram` 做了 `Facebook`\
  \ 最初成功实现的事情，将自己定位为查看你朋友在做什么的方式。但它并没有 `Facebook` 在试图涵盖所有格式时所积累的规模、混乱的内容组合和杂乱的界面。\n\
  \n\n\n\n## Facebook 的扩张战略：收购与埋没\n\n公司执行了这一计划。扎伯格提议以 10 亿美元的价格收购 `Instagram`，并在 2012\
  \ 年 4 月，`Instagram` 的首席执行官兼创始人 Kevin Systrom 接受了这一提议。他认为自己并没有多少选择。正如 Systrom 告诉一位\
  \ `Instagram` 投资者的所说：“我认为我们永远无法逃脱马克的愤怒。”要么 Facebook 收购这家公司，要么就通过切断这家初创公司访问 Facebook\
  \ 更庞大的平台（以及其业务软件和社交数据）来确保其增长放缓。这一策略就是“要么收购，要么毁灭”。\n\n在收购后的几年里，`Instagram` 基本上保持原样。但在\
  \ 2015 年，该应用引入了广告；2016 年，它切换到了算法推送；2017 年，它添加了 `Stories`（快拍动态），这是它试图复制（并摧毁）竞争对手\
  \ `Snapchat` 的尝试。`Instagram` 逐渐变得越来越像 Facebook 本身：不同类型内容的杂烩；个人与非个人化的社交连接；以及一个给你的内容并非你真正想要的，而是公司当时正在强调的内容（如视频或购物机会）的推送流。对于一个致力于审美体验的应用来说，这些混乱的变动令人沮丧。2018\
  \ 年底，Systrom 和他的 `Instagram` 共同创始人 Mike Krieger 彻底离开了 Facebook。（“没有人会因为一切都很完美而离开一份工作，”Systrom\
  \ 当时这样说，暗示了他的不满。）\n\n其实，当 Facebook 购买 `Instagram` 时，就感觉互联网的围墙似乎在我们用户周围收缩得更紧了一点。像\
  \ `Geocities` 那种网络上广阔的可能性、混乱性，或者像 `Tumblr` 那样的个人表达都被关闭了。数字生活变得日益模板化，变成了一系列等待填充的框框，而不是一个可以涂满你自己图像的画布。（你不需要重新设计你的\
  \ Facebook 个人资料的外观；你只需要更改头像。）我感到了一种某种失落感，但起初，这种用创意换取传播范围的交易似乎是值得的：你可以在社交媒体上同时与许多人交流！但这种暴露也变得精疲力竭，我怀念以前那种亲密感，怀念互联网作为一个私密空间——一个现实生活的避难所，而不是现实生活的决定力量。随着围墙的收缩，算法推送变得越来越具有影响力和权威。\n\
  \n## 创新的放缓与竞争格局\n\n创新放缓了。涌出的各种其他工具和平台很快被 Facebook 和 Google 挤出。`Twitter` 在 2013 年创建了短视频网站\
  \ `Vine`，但由于管理不善，在 2017 年将其关闭。Google 自己的社交网络 `Google Plus` 从 2011 年发布到 2019 年悄悄消失，期间一直都令人费解且难以捉懂。众筹服务（如\
  \ `Kickstarter` 和 `Patreon`）通过允许支持者直接为他们想看到的内容付费，为更多小众的文化项目带来了希望，但它们没有像 `Snapchat`\
  \ 和 `TikTok`——Facebook 社交主导地位唯一的真实竞争对手——后来获得的那种动能。\n\n## 即时通讯的崛起\n\n很快，Facebook\
  \ 的下一个威胁出现了：即时通讯。该公司看到新应用利用智能手机所有者的联系人列表，取代了 `SMS` 和 `iMessage` 成为人们之间直接通信的方式（这些消息应用使用互联网连接而非手机信号）。Facebook\
  \ 拥有自己的自己的消息工具，一个名为 `Messenger` 的应用，于 2011 年首次发布，但公司理智地担心消息应用可能会扩展到更大规模的社交网络，从而引走用户。\n\
  \n“消息是演变为 Facebook 最危险的滩头阵之一，”一位 Facebook 副总裁在 2013 年初写道。成立于 2009 年的消息应用 `WhatsApp`\
  \ 证明了他们的观点，它变得日益突出，特别是在亚洲和欧洲。到那年底，它已经拥有了超过四亿名用户，收入来自下载和订阅费用，而非广告。因此，扎伯格提出了另一个无法拒绝的提议。2014\
  \ 年初，Facebook 同意以 190 亿美元收购 `WhatsApp`——尽管 `WhatsApp` 最近的估值仅为 15 亿美元——这对于一家初创公司来说是一个极其高昂的价格。反之，`WhatsApp`\
  \ 变质了。2020 年，它引入了广告，但它从未变成与 Facebook 竞争的社交网络，因为 Facebook 管理了该公司的目标和野心。扎伯格可以阻止其扩展功能——这次收购抵消了对母公司的真实威胁。\n\
  \n## 垄断争议与法律挑战\n\n`Instagram` 和 `WhatsApp` 只是 Facebook 几十次收购中的两个。Google 同样在 2006\
  \ 年收购了 `YouTube`，并将这个视频上传网站转变为媒体消费巨头，成为有线电视的替代品。其他社交网络没有生存下来。例如，`Tumblr` 曾与 `Twitter`\
  \ 和 Facebook 并肩，但在 2013 年被 `Yahoo` 收购，价格为 11 亿美元。然而，它在管理不善和增长下滑中挣扎了多年，最终在 2019 年以\
  \ 300 万美元的价格卖给了 `WordPress`。也许在不同的情况下，像 `Instagram` 这样的应用也会面临同样的命运。但我们并没有机会发现——它被吸入了\
  \ Facebook 的引力中。Facebook 变得太大了——不仅是大到不能倒，而是可能在法律上违法。许多内部细节来自 2020 年美国联邦贸易委员会的一项诉讼，指控\
  \ Facebook 通过其“反竞争行为”在社交网络领域形成了垄断。许多州政府也加入了这项诉讼或发起了类似的诉讼。\n\n## 互联网周期的周期性\n\n在经历这些互联网周期时，会产生某种程度的震荡感。我们用户认为应该以某种方式行为，然后相反的情况变成了事实，比如从匿名到实名的运动。我们被要求使用工具建立自己的空间，自由表达自我，然后被命令适应社交网络预设的色板。然而，一旦某个标准占据主导地位，它似乎就失去了控制力。数字平台并没有目标论的弧线；它们并不是朝着完美移动，正如硬盘随着时间的推移能够存储更多数据那样。相反，它是周期性的，在中心化和去中心化的不同策略之间摆动。\n\
  \n创新从微观层面开始，一群用户或一个新应用开启新的行为，如发布新类型的内容或创建新的社区。一段时间内，数字文化感到有机且令人兴奋，与以前不同。但随后，这些新行为和功能被大公司采用，通过复制、业务压力或兼并。用户对自己的旧应用感到新的兴奋并加入，但随着创新被变现过度，新鲜感就消失了。新表达形式中的任何快乐都被无情地剥削，最通常表现为广告的增加。整个过程中有一种西西弗式的徒劳感。真实的在线文化总是被破坏，正如用户不可避免地抱怨的那样，但也总是重新出现。没有任何平台是绝对安全的。最大的现有者可能会受到微型新竞争者的威胁，仅仅是因为技术的细微进化——如\
  \ `Snapchat` 的快拍动态或 `TikTok` 的全算法推送——或者一个不可避免的事实：人们只是会厌倦，技术就像时尚一样，必须不断变化以维持对用户的注意力。\n\
  \n\n\n\n尽管如此，当今时代的互联网从未像现在这样看起来如此单一。个人网站被吞没在源源不断的的动态信息流中。所有内容都必须适应同少数几种模版。内容创作者可能有许多平台供选择，但平台本身变得越来越相似，功能也大同小异。感觉我们的选择缩小到了令人窒息的地。互联网巨头如此巨大且强大，拥有数十亿用户和数百百亿美元的市值，以至于即使是创新的创业公司也很难以在不被以某种方式压制的情况下蓬勃发展。他们的优势太强大了，他们没有动力去改变那些正在抹平我们体验的榨取手段。正如联邦贸易委员会（FTC）对\
  \ Facebook 的诉讼中所指出的，“结果是竞争减少、投资减少、创新减少，用户和广告商的选择也更少。”\n\n我们这些用户无法独自对抗这种死闷的环境。在应用之间切换和调整设置所能起的作用是有限的。要打破“过滤世界”（Filterworld），改变必须在工业层面发生，在科技公司自身的规模上。去中心化倾向于赋予用户最大的自主权，但也给个体带来了更高的劳动和责任负担。这也是抵抗过滤世界并为数字生活培养新可能性的最佳方式。但公司不太可能主动拥抱去中心化，因为通常利润较低。改变的唯一途径可能是强迫他们。\n\
  \n对于这样一个规模巨大且强大、影响着数十亿人的行业，社交网络业务并没有面临太多的政府监管。它似乎落在了硬件行业（设备和制造供应链面临审查）与传统媒体行业之间的鸿沟中——自从美国宪法确立言论自由以来，媒体企业可以播放什么类型的内容一直是法律问题。社交网络是否应该被像报纸和电视节目那样对待，对其范围内托管的所有内容负责？它们长期以来一直逃避了这种责任。或者它们是否应该被归类为像电话线，理论上是信息的中立传输器？但考虑到它们的算法判断，它们决然不是中性的。也许社交媒体属于“恶性行业”类别，需要受到严格的限制，以确保那些可能滥用它的个人的安全。毕竟，有这么多用户沉迷于此。\n\
  \n无论我们如何对构成过滤世界的数字平台进行分类，显而易见的是它们需要某种形式的监管。作为用户，我们只能感受到这些结构带来的后果，并据此调整自己的行为。新的行为，从而新的文化形式，需要新的结构，而在科技巨头的垄断和双垄断被打破之前，这些结构将不存在。\n\
  \n## 寻求透明度\n\n改变数字平台运作方式最快的方法可能是强制透明化：迫使公司解释其算法推荐如何以及何时工作的。透明度至少能让用户获得更多信息，关于那些不断决定向我们展示什么内容的的。。如果我们知道算法是如何工作的，也许我们能更好地抵抗它们的影响并做出自己的决定。\n\
  \n在 2016 年唐纳德·特朗普当选后，美国公众稍微地意识到了我们是如何被算法信息流操纵的。民主党人无法理解为什么有人会投票给特朗普，因为他们的 `Facebook`\
  \ 和 `Twitter` 信息流没有推销许多来自政治光谱另一端的帖子，这创造了埃利·帕里泽（Eli Pariser）所说的“过滤泡”之一，即一个数字回声室。在网上，他们生活在一种认为特朗普很荒谬的完全一致的幻觉中。与此同时，他的支持者被加强了他们观点的内容所包围。推荐系统将观众分成了整齐的类别，这让他更容易获胜。我在本书的前面部分提到过对过滤泡的批评；这种现象对导致这种惊讶的影响可能比其发生本身更大。\n\
  \n特朗普确实利用了算法技术。他的竞选活动对 `Facebook` 的精准广告利用极佳。他的竞选购买了 590 万份 `Facebook` 广告，在 11 月之前的五个月里花费了\
  \ 4400 万美元，是希拉里·克林顿竞选活动的数倍，后者买了 6.6 万份广告。特朗普的团队与 `Facebook` 本身紧密合作，使用精准广告软件测试哪些信息最有效。\n\
  \n在用户端，根据你关注的谁或什么，要判断哪些 `Facebook` 内容是作为付费广告推广的，哪些是自然流量也变得更加困难。信息流变得更加混乱，因此也更加困惑和具有操纵性。这种结合导致了当时对\
  \ `Facebook` 罕见的公众反弹。\n\n一位名叫 Krishna Gade 的工程师此前曾在 `Pinterest` 和 `Twitter` 担任管理职位，他在\
  \ 2016 年 11 月在这场闹剧中心被用。他成为了 `Facebook` 新闻信息流的工程经理，负责其内容排名系统。在当时，这是一份至关重要的工作。“关于新闻信息流如何运作的内部问题多得多，”Gade\
  \ 告诉我。他意识到信息流的同质化力量。\n\n首先，Gade 开发了一个内部调试工具，以理解推荐算法究竟是如何工作的。它可以告诉人们为什么某条内容在特定时间被推广。内容片段会附带一个很小的链接，显示其出现在信息流中的几个原因，即让算法记录它的内容的变量。产品早期版本的截图显示了诸之类的解释，例如用户与发布者是朋友、用户倾向于对带有照片的帖子发表评论，或者帖子在用户所属的特定小组内很受欢迎。逻辑非常简单，主要围绕着那个主导的参与度指标——即已经受欢迎的内容会获得更多的曝光。\n\
  \n\n\n对于 Gade 而言，这一功能是数字平台运作模式的核心。“用户应该有权询问正在发生什么，”他告诉我。这一原则被称为“算法透明度”，它认为我们与之交互的算法中包含的变量和权重应该是可以访问并公开的，就像窥视驱动表盘的内部齿轮一样。正如\
  \ Mike Ananny 和 Kate Crawford 在《新媒体与社会》（*New Media & Society*）杂志 2016 年的一篇论文中所写道，在理想情况下，透明度是“一种能够及时查看、理解和治理复杂系统的方法”。了解某些内容是如何以及为何被推荐，可能有助于消除环绕在我们在线体验周围的算法焦虑，因为我们可以识别出推荐算法考虑了我们的哪些行为。然而，这让用户必须为自己负责：了解算法如何运作并不等同于能够控制它。Ananny\
  \ 和 Crawford 写道：“仅凭透明度无法建立起负责任的体系。”\n\n2015 年，联邦贸易委员会（FTC）设立了技术研究与调查办公室，其职责包括研究算法透明度的可能性。即便在当时，显而易见的是算法在人们生活中扮演的角色日益重要：“消费者无论是否知情，每天都在与算法交互。到目前为止，我们对这些算法如何运作、背后的激励、使用了什么数据以及数据如何结构化了解甚少，”当时的\
  \ FTC 首席技术官 Ashkan Soltani 在 2015 年告诉 *PC World*。但这一方向的进展缓慢，特别是在社交媒体背景下。FTC 办公室的行动更多地集中在监管数字广告、加密货币和隐私上，而不是信息流是如何运作的。\n\
  \n在几年前实施解释功能后，Facebook 在拥抱透明度方面进展并不理想。在我几个月来对自己的 Facebook 信息流进行实验时，它给出的最常见理由是某个帖子“与你看到的其他帖子相比更受欢迎”。对于任何平台上发现的几乎任何算法推荐的内容，都可以做出这样的假设。\n\
  \n直到最近的 2021 年，Facebook 母公司 Meta 的全球事务总裁 Nick Clegg（他曾任英国副首相））仍在描绘一条通往更高透明度的路径。他在\
  \ Medium 上的一篇题为《你与算法：双人舞》的文章中写道：“你应该能够与算法反驳，并有意识地调整或忽略它所做出的预测。”根据 Clegg 的说法，通过“平台设计中内置的呼吸空间，在光天白日之下更改你的个人算法”应该是可能的。这是一个非常生动的描述，暗示存在一个独立于推荐之外的空间，但他的雇主并未将其付诸行动。Facebook\
  \ 目前赋予用户对信息流的少数控制权之一是选择账户和小组作为“收藏”，这意味着算法会更频繁地推广它们，或者通过“稍后”（少查看特定账户，尽管只是暂时的）降低其优先级。很快，算法就会重新占据主导。用户无法平衡一系列话题，无法选择看更多朋友而不是新闻故事，无法为了积极的情绪而调低政治愤怒。尽管每个人的信息流看起来都不同，适应了我们的兴趣和习惯，但它们都以相同的根本方式运作，由公司主宰。\n\
  \nGade 于 2018 年 10 月离开了 Facebook。他决定通过他共同创办的一家名为 `Fiddler` 的新公司独立解决算法透明度问题。`Fiddler`\
  \ 帮助客户拆解机器学习模型并查看其内部。这可能意味着评估为什么算法银行流程会自动向一个客户提供贷款而拒绝另一个客户，或者为什么像亚马逊的 Alexa 这样的语音控制应用会持续误解某个单词。它还可以更深入地观察\
  \ Facebook 推荐算法为何会在信息流中推广某个特定内容——前提是 Facebook 允许 `Fiddler` 访问其数据和模型。\n\n`Fiddler`\
  \ 创建了一个变量和结果的仪表板，允许客户对其进行实验性微调，然后根据结果更新其内部模型。它的软件还可以查看这些由于经常被描述为“黑箱”的算法系统内部。Gade\
  \ 告诉我，*黑箱*这个词“有一点夸张”。虽然机器学习开发出人类可能无法理解的抽象模式，但其他机器可以感知并呈现它们。“`Fiddler` 为你提供了一个透视结构的窗口，”他说道。\n\
  \nGade 通过视频聊天向我演示了 `Fiddler` 的仪表板。在公司上传模型和数据后，软件可以“衡量公平性”，使用性别或种族等特定示例进行测试，并确保结果的一致性。许多推荐算法基于对内容的解读，评估帖子、说明或用户评论，以衡量特定项目的相关性。但算法可能会误解语言。Gade\
  \ 向我展示了一个案例，一个模型为 *gay*（同性恋）一词赋予了非常负面的内涵，这意味着包含该词的内容没有获得优先考虑。如果该词是积极的，那么这可能是完全错误——或者它应该被解释为中性。如果自动化内容审核或推荐系统误解了词汇或行为，“你可能会让整个群体沉默，”Gade\
  \ 说。这就是为什么能够看到算法决策周围发生的情况是如此重要的。\n\nTwitter 提供了一个关于不透明性损害的教材。当埃隆·马斯克在 2022 年收购这家社交网络时，人们希望这位企业家能帮助这个缓慢的服务实现其潜力。随之而来的是一系列随机且半成品式的改变，这些改变通常会损害用户体验，尤其是信息流方面。Twitter\
  \ 信息流的每个版本——无论是手机应用程序、网站还是 `Tweetdeck` 软件——功能似乎都不同。用户可以切换到“最新”流，这意味着推文将按时间顺序排列，结果却发现奇怪的异常，如一堆来自已验证账户的推文，并不断被推荐推文中断。我开始觉得我无法信任算法信息流每天如何运作，更不用说多年了。尽管我像使用公共事业一样依赖这项服务，但它提醒我，我从未知道背后发生了什么。\n\
  \n\n\n\n正如数字平台不对对其算法推送的内容负责解释一样，它们也不对推送所推广的内容承担责任——它们将自己与推荐系统的结果隔离开来。他们之所以这样做，归功于美国\
  \ 1996 年的《电信法》，该法案包含一部《通信规范法案》，其中一项名为`第 230 条`的条款。`第 230 条`让互联网在过去的几十年里呈指数级增长。如果没有它，我们的数字世界将大不相同。但在社交媒体时代，它也让那些取代传统媒体业务的科技公司能够在没有传统媒体保护的情况下运营。`第\
  \ 230 条`将像`Facebook`这样的开放平台与用户在其平台上发布的内容区分开来。法律规定：“交互式计算机服务的提供者或用户均不被视为其他信息内容提供者所提供的任何信息的发布者或发言人。”这是一个重要的区别，因为“发布者”对其发布的内容承担法律责任：例如，如果一家杂志刊登了关于人的人的诽性内容，可能会被受害者起诉。相比之下，`Facebook`可以规避这种风险，因为从技术上讲，发布内容的是用户而非平台。\n\
  \n### 第 230 条的先例\n\n`第 230 条`的先例来自 20 世纪 90 年代的两个案件。1991 年，`Cubby v. CompuServe`案始于两家数字媒体公司之间的冲突。Robert\
  \ Blanchard 的`Cubby Inc.`（名为`Skuttlebutt`的新闻服务出版者）起诉了 Don Fitzpatrick 的出版物`Rumorville`，因为后者发表了一篇诽谤`Skuttlebutt`的文章。`Rumorville`出现在由`CompuServe`托管的在线论坛上，`CompuServe`是早期的家庭网络提供商，也是\
  \ 90 年代的主力。Blanchard 不仅起诉了`CompuServe`本身，也起诉了 Fitzpatrick。美国地区法院裁定，`CompuServe`只是分发者，而非涉嫌诽谤内容的发布者。换句话说，作为托管方，`CompuServe`的作用更像报摊或书店。它不控制发布的内容，只控制材料如何触达消费者。20\
  \ 世纪 50 年代的一个案件已经裁定，书店不可能在法律上对通过其书架的每一本书进行审核，因此免除了对书籍内容的责任。\n\n第二个关于数字分发的案件得出了不同的结果。在\
  \ 1995 年的`Stratton Oakmont v. Prodigy`案中（由纽约州最高法院审理），`Prodigy Services Company`是一个在线论坛的托管方，其中包含一个讨论财务的板块。`Prodigy`的一名用户在论坛上发表了诽谤性评论，目标是经纪公司`Stratton\
  \ Oakmont, Inc.`及其总裁 Daniel Porush。此案看起来与`Cubby v. CompuServe`案相似，但`Prodigy`在其服务上发布的实际内容中参与程度更深。论坛对可以发布的内容有明确的规定，并实施了审核系统，包括自动过滤和人工审核。法院裁定，在这种语境下，`Prodigy`是发布者而非分发者，因此对其网站上的材料承担法律责任。法院判决写道：“`Prodigy`显然对内容做出决策……而此类决策构成了编辑控制。”`Prodigy`根据`Cubby\
  \ v. CompuServe`案的先例请求撤销案件，但无济于果。\n\n### 审核的悖论\n\n这两个冲突的案件提出了一个根本性的悖论：不对发送给用户的内容进行任何过滤的互联网服务受到了法律保护，而那些尝试过滤内容（即使只是为了基本的质量或安全）的服务则没有受到保护。对于互联网公司来说，尝试影响内容反而风险更大。两位国会代表员\
  \ Christopher Cox 和 Ron Wyden 决定这个问题需要解决。“如果这条规则生效，互联网将变成西部荒野，没有人会有动力保持互联网文明，”Cox\
  \ 后来告诉`Wired`。Cox 和 Wyden 的`第 230 条`允许数字平台在“善意”的情况下干预任何“色情、淫秽、猥亵、过度暴力、骚扰或以其他方式令人反感”的内容，而无需对其出版责任。`第\
  \ 230 条`由克林顿总统于 1996 年签署生效。\n\n### 社交媒体时代\n\n然而，2010 年代的主流社交媒体与`第 230 条`的关系完全不同。在\
  \ 1996 年，互联网对于其 1600 万用户来说仍然是一种小众体验，在媒体分发中所扮演的角色小得多。今天，`Twitter`和`Facebook`已经涵盖了人们从娱乐到新闻的所有媒体形式。\n\
  \n社交网络通过吸收广告收入、将内容孤岛化以及调解出版者与消费者之间的关系，取代了传统出版者。结果是，传统媒体公司遭受了毁灭，与过去相比失去了大部分收入，而现在被迫以更少的人员维持其作为负责发布者的身份。尽管环境受限，传统媒体公司仍对其发布的每一个内容承担责任。与此同时，数字平台可以利用`第\
  \ 230 条`的借口声称自己完全不是媒体公司。\n\n### 角色的模糊\n\n角色界限模糊了。在这个新的生态系统中，数字平台在决定哪些内容触达消费者方面承担了发布者的部分功能。如果说`CompuServe`在案件中可以声称中立，因为它没有影响`Rumorville`的出版内容，那么`Facebook`则几乎没有中立可言。算法的策展行为类似于报纸选择将哪些故事放在头条。`第\
  \ 230 条`一直充当盾牌，将社交网络与用户在其平台上发布的内容隔离开来。这涵盖了从#MeToo 调查到种族主义言论或暴力威胁的一切。该法律已成为日益增长的质疑的目标，诉讼正试图让社交网络对其分发的内容负责。\n\
  \n2015 年 11 月，一系列后由`ISIS`声称的恐怖袭击袭击了巴黎。有 130 人遇难，其中包括一名 23 岁的美国学生 Nohemi Gonzalez。Gonzalez\
  \ 的家庭指控`Google`、`Twitter`和`Facebook`对其死亡负责——特别是`Google`的`YouTube`——因为这些公司通过算法推荐向用户推广了与`ISIS`相关的内容，并在激化巴黎袭击者方面发挥了作用。从本质上说，他们必须在其平台上的内容以及这些内容推送到观众的方式上某种程度上承担责任。该诉讼最初被驳回，理由是`Google`并未通过广告收入在物质上支持`ISIS`，且对`ISIS`相关内容的处理与其他内容相比没有区别，维持了其作为分发者的理论中立性。\n\
  \n\n但但在 2022 年 10 月，最高法院决定与另一起针对数字平台的诉讼共同审理此案，这可能是在我们算法无处不在的时代确立一个重要的先例。“`Section\
  \ 230` 是否适用于这些算法生成的推荐具有巨大的实践意义。互动式计算机服务不断地以某种或另一种形式将此类推荐推给美国几乎每一位使用社交媒体的成年人和孩子，”冈萨莱斯家族在案件的上诉中辩证道。脸书吹哨人弗朗西斯·哈根（Frances\
  \ Haugen）泄露了证明公司已意识到其算法推荐可能造成的损害的文件，她也对该法律发表了反对意见。“如果我们改革 `Section 230`，让脸书对比其刻意排名决定的后果负责，我认为他们就会取消基于参与度的排名，”哈根在\
  \ 2021 年向一个参议院小组委员会如是说。\n\n算法推送有助于自动传播虚假信息，并可能加速意识形态的激化，在单一类别中向用户推送日益极端的内容。`Section\
  \ 230` 的问题在于，最终且奇怪的是，这项法律使得目前没有人对算法推荐的效果负责。科技公司本身不承担责任，系统仅在内部受到监管，而用户则只能自生自灭，缺乏基本的内容审核。如果算法推送误待了我们，或导致了虐待或剥削性的在线环境，我们作为用户和公民几乎无处可说。我们唯一的可能性之一是切换到另一个平台，尽管这也已经被垄断问题所限制。我们与算法推送的关系感觉像一个陷阱：我们既无法影响它们，也无法逃避它们。\n\
  \n废除 `Section 230` 并非万灵药。在某些方面，它保护了用户在网上的言论自由，并允许我们所知的数字平台得以存在，而不至于因为每一条随意的推文侮辱或指控而被起诉到灭亡。但也有关于修改它的建议。2021\
  \ 年 10 月，在哈根对脸书进行举报后，众议院的议员们引入了一项名为《反对恶意算法法案》（`Justice Against Malicious Algorithms\
  \ Act`，简称 `JAMA`）的立法。该法案将“当在线平台故意或轻率使用算法或其他技术推荐对人身或严重情感伤害有重大贡献的内容时，取消对 `Section\
  \ 230` 的责任豁免”。它消除了在任何“基于个人特定信息的个性化推荐”案例中 `Section 230` 的保护。该法案不涵盖源于用户自身搜索的结果（如 `Google\
  \ query`），也不涵盖支撑社交网络的网络托管和数据存储等服务，这些服务更具中性，且更符合 `Section 230` 的初衷。\n\n2023 年 2 月，最高法院对\
  \ `Gonzalez v. Google` 和 `Twitter v. Taamneh` 案举行听证会。在这些案件中，另一起伊斯组织（ISIS）相关的恐怖袭击的受害者属根据《反恐主义法》起诉推特、谷歌和脸书，指控这些公司托管并向用户推荐了伊斯组织的内容，从而为该恐怖组织提供了实质性支持。\n\
  \n早些时候，埃琳娜·卡根（Elena Kagan）法官几乎开玩笑说法院对数字平台问题一知如少。“这些人可不是互联网的九位最顶尖专家，”卡根说道，引发了法庭的一阵大笑。但她也反思了算法推送的主导影响：“每当有人看互联网上的任何东西时，都有算法参与其中，”她说。法官们调查了算法推荐的使用和能力，并辩论算法是否可以被认为是“中性的”（我认为它们不能），但那种普遍的困惑是显而易见的。原告律师埃里克·斯纳珀尔（Eric\
  \ Schnapper）在描述 `YouTube video thumbnails` 等互联网支柱时，表现得极度吃力。2023 年 5 月，最高法院裁定科技公司不承担责任，并再次维护了对\
  \ `Section 230` 最强有力的解释。\n\n在剧剧改革的 `Section 230` 下，我们的推送将看起来大不相同。社交网络将被迫对其网站上每条获得算法推广的内容负责。也许它们会通过对每一条获得算法推广的内容采取措施来适应。如果算法推送误待了我们，或导致了虐待或剥削性的在线环境，这意味着用户必须主动关注或搜索特定主题。那些仍获得算法推广的内容将经过审核，以确保它们是中性的——像`America's\
  \ Funniest Home Videos`那样可爱的宠物趣事和好消息。它将仍然是有趣的，但不再具有成性或操纵性。内容审核将变得更加严格。\n\n改变平衡以强调线性的、主动加入的内容而非自动推荐，可能是件好事，如果这能限制有害材料的接触。但这将是一个更加干净、在必要时更慢的互联网。问题在于决定哪种类型的内容可以在\
  \ `Filterworld` 中如此快速且无障碍地传播，而哪些应该减速或停止。\n\n如果说 2000 年代见了主流互联网的出现，2010 年代见了大型数字平台的崛起和主导，那么下一个十年可能再次拥抱去中心化。`Agency`（自主性）可能是关键词：个人用户决定他们如何发布和查看内容的能力。我希望看到更像\
  \ `Geocities` 的互联网，随处是个性化的表达和定制，但具有让 2020 年代互联网引人入胜的多媒体创新。它将是一个更混乱、更有趣的地方——更像一个乐场或沙盒，而不是像那样的办公室隔间地板。\n\
  \n像 `Mastodon` 这样的开源软件允许其用户创建和托管自己的类推特社交网络，为未来可能发生的情况提供了一个线索。但 `Mastodon` 也展示了此类不同基础设施的缺点。自托管平台上的受众较小，互动也更困难。你可能找不到任何你想要的内容。那里没有病毒成名的可能或威胁。但这些是我们为了更具可持续性的整体数字文化可能必须做出的权衡。\n\
  \n## 减缓放大\n\n正如自杀的英国少女莫莉·罗塞尔（Molly Russell）所经历的抑郁内容浪潮一样，推荐加速负面材料的速度并不比正面材料。虽然系统可能对所有内容一视同仁，但推广的后果并非如此。新冠期间，在线虚假信息的传播引发了对\
  \ `Ivermectin` 的病毒式狂热，这种药物通常用于马。服用这种药物的患者受到的伤害远大于获得的帮助，有时因为摄入该药物而住院。\n\n\n\n处理这一问题的通常策略是适度管理，或者为了安全进行审查：即对有问题的内容进行完全拦截，从根本上不允许进入用户的信息流。社交网络通过机器学习分析（例如，自动审查特定关键词）以及人工审核员进行过滤，后者会手动决定允许哪些内容通过。Facebook\
  \ 将其大部分人工审核工作外包给一家名为 `Accenture`（埃森哲）的公司，该公司在全球范围内雇佣了数千名审核员，包括在葡萄牙和马来西亚等国家。这些劳动者每天都要面对镜头中的死亡画面、录录的虐待和儿童色情。他们为我们其他人保持信息流的整洁，却让自己暴露在心理伤害中，就像在加纳等地区挖掘国际电子垃圾的拾垃圾者暴露在毒化学物质中一样。毒性并不会因为算法的调解而神奇般地消失。人类的劳动再次被掩盖了。\n\
  \n然而，总有一些内容会漏掉，一旦它们进入信息流，没有任何东西能阻止它们被推荐。对抗算法过度扩张的一种方法是监管哪些类型的内容推荐生效，正如对 `Section\
  \ 230` 的某些改革所建议的那样。在英国，一项名为 `Online Safety Bill`（在线安全法案）的法律正在考虑中，旨在防止类似 `Russell’s`\
  \ 的案件。该法案的议会声明规定：“可能被儿童访问的服务都有责任保护他们免受有害内容。”允许此类有害内容的平台还必须在审核和推荐方面的处理上保持透明。这可能包括移除或“降低优先级”有害内容——即减少其推荐频率或完全不推荐。\n\
  \n社交网络必须在困难的优先级中寻找平衡。我们使用它们来相互直接通信，作为消息服务或关注朋友更新的方式。但它们也扮演着广播角色，触达数百万用户。这两种类型的内容无论是私密的还是公共，都受到相同规则和力量的影响。`康奈大学`的技术学者、现任`Microsoft`首席研究员\
  \ Tarleton Gillespie 解释了这种差距意味着什么。\n\n“平台为我们提供了本应用于亲密、连接性对话的内容。然后，他们以一种统计学上广泛的、系统的方式对其进行审核，”`Gillespie`\
  \ 告诉我。这几乎没有空间来考虑特定内容的特殊性质，因为缺乏上下文，并在整个信息流中变得原子化。这意味着我们也对自己发布的内容在在线上的传播方式产生了预期——即，我们最期望它传播得越远越好。`Gillespie`\
  \ 告诉我：“人们产生了一种观念，不仅他们可以发言，而且对它应该去向哪里也有某种预期。”换句话说，我们已经把算法推广几乎视为一种权利。\n\n但也许这种预期需要改变，我们需要学习在一个没有这么多自动化加速的数字世界中生存。触达大量陌生人并不是一种权利；它是一种特权，不需要每个用户或帖子都具备。`amplification`（放大）一词描述了算法推荐在比通常更广泛传播内容的作用：像扩声器一样，它将普通的言语变成了大喊。放大是\
  \ `Filterworld`（过滤世界）问题的核心；一种格式被放大到一切之上。利用监管来针对放大可以为生态系统创造更多平衡。\n\nDaphne Keller\
  \ 是`斯坦福大学网络政策中心``平台监管计划`的主任。2021 年，`Keller` 通过`哥伦比亚大学`发表了一篇名为《放大及其不满》的文章。“放大既可以产生危害，也可以产生好处，”她写道。`Keller`\
  \ 告诉我，“监管的技巧在于`harness`（利用）其收益——如帮助用户发现新声音——同时减少随之而来的伤害。“美国大多数关于监管的讨论都是关于内容的，但并没有所谓的基准。”我们可以抱怨在\
  \ `Spotify` 上听了太多同样的音乐，或在 `Facebook` 上看到太多的家人，但算法信息流的构成可以比作健康饮食的食物金字塔。`USDA`（美国农业部）建议脂肪、油和糖最少，水果和蔬菜较多。监管放大可以迫使信息流包含特定比例的不同内容，优先考虑信息性或本地的材料。此类规则将限制我们现在在信息流中体验到的无限扩张。\n\
  \n类似的法律已经存在于儿童电视领域。`Children’s Television Act`（《儿童电视法》）由`国会`于 1990 年通过，并在 1997 年变得更加严格。它规定所有主要的广播电视节目站每周至少提供三小时针对儿童的内容。除了具有“教育和信息性”外，电视节目还必须满足其他要求，如限制广告和不显示商业地址。根据`媒体教育中心`的说法，法律的压力促成了如\
  \ `Beakman’s World`（贝克曼的世界）和 `Bill Nye, The Science Guy`（比·尼，科学奇士）等节目的制作。\n\n但随着电视在\
  \ 2010 年代从少数基本频道分裂为更大的电缆包，然后变为流媒体服务，法律变得更难以应用，因为这些不受相同监管的约束。什么样的节目算得上适当教育也具有模糊性；有些频道甚至开始使用针对青少年的真人秀节目来满足他们的教育要求。无论一个节目是否具有信息量，它仍然可能变成鼓励消费主义的商业实体：`Barney\
  \ & Friends`（巴尼和他的朋友们）多年来由公共电视制作。尽管存在缺陷，`Children’s Television Act` 已经持续了几十年，并被证明具有威慑力。2007\
  \ 年，美国频道 `Univision` 因为违反法律面临 `FCC`（美国联邦通信委员会）的 2400 万美元罚款。它曾试图将自己的梅罗剧肥皂剧定义为适当的教育内容。美国政府不同意，这些节目并未证明合格，`Univision`\
  \ 最终以 `Planeta U` 的名称重新启动了它的儿童节目板块。\n\n如果我们接受现在的社交网络做出的决策与像电视频道这样的媒体业务相同的编辑决策这一事实，那么它们是否应该被强迫定期展示某些内容，优先考虑对我们有益——或最终对社会有益的信息？\n\
  \n\n\n\n## 算法推荐与人类行为\n\n算法推荐考虑了我们潜意识里趋向的内容：任何我们鼠标悬停时间较长的内容，更不用说点击了。当我们在滑动跳过一个 `TikTok`\
  \ 视频前感到犹豫时，这些数据就会被考虑在内。就像垃圾食品或成瘾物质一样，人类可能只是在选择消费的内容混合方面需要帮助。正如凯勒（Keller）告诉我的那样：“我们用猴子大脑进行点击，而正是这种大脑让我们在杂货店结账台买下一块糖棒。”算法推送流加速了这些最糟糕的冲动，不仅是在个人层面，而且是在社交网络所有用户的聚合层面。煽动性的素材——那些可能具有暴力、挑衅性或误导性的内容——比那些虽然无聊但更有价值的内容更容易被发现。\n\
  \n“这不是一种构建我们信息饮食的良好方式。它加剧了社会问题，”凯勒继续说道。她将答案描述为“强迫平台在用户所要求的这种‘全糖果饮食’中加入一些蔬菜。”从本质上说，我们必须接受算法推荐并不完全提供我们切想要的，或我们最可能参与的内容——就像我们接受人类新闻编辑最清楚什么对他们的受众最重要一样。（我们并不期望\
  \ `The New York Times` 的头页符合我们的个人偏好。）推送中的此类“蔬菜”可以采取以下形式：来自经过审核的出版物列表的故事，或者更像公共服务公告的帖子——这些是我们集体决定值得讨论的话题，尽管这种全社会的共识现在似乎比以往任何时候都要稀缺。也许关于好莱坞电影的更新足够中立，或者是穿插着令人愉快的当地报道的国家新闻摘要。当然，那种混合模式正是传统媒体过去提供的，它与我们习惯从社交网络中获得的内容截然相反。\n\
  \n## 文化动态的转变\n\n社交媒体的兴起为文化和娱乐创造了一套新的动态。用户在特定时刻对消费内容有了更多选择，而创作者只需通过将内容上传到 `Internet`\
  \ 就能更容易触达观众。我们不必仅仅观看制片人选择放在电缆电视上的节目。我们已经开始期待个性化，无论是由我们自己的行动还是算法驱动的。但这种看似更民主、低层级化的动态也让我们感到旧的法律和法规不再适用，恰恰是因为我们可以决定何时观看或收听某物，以及何时选择另一个来源。我们可能拥有更多的独立性，但作为消费者最终获得的保护却少了。\n\
  \n## 监管与言论自由\n\n监管算法推荐很快变成了言论自由问题。正如 `Santa Clara University` 法律教授、`High Tech Law\
  \ Institute` 联合主任埃里克·戈尔曼（Eric Goldman）告诉我的那样，“`algorithm` 只是将服务的言论选择代码化的方式。”凯勒将有问题的内容（以暴力威胁或\
  \ `hate speech` 为特征的内容）与“合法但具有挑衅性的言论”区分开来。如果一个用户不断点击这类内容并表达出这种渴望，那么法律应该阻碍吗？在莫莉·罗塞尔（Molly\
  \ Russell）的案例中，她接触了关于抑郁的内容，并收到了更多此类推荐。这本可以是一个积极的经历，帮助她在网上找到社区和同情。但它变成了负面的，因为此类内容被得太频繁，这是算法同质化恶性循环的另一个后果。\n\
  \n如果要对推荐进行监管，必须根据内容做出某些决定。“哪些偏好是不可接受的且必须被法律覆盖？”凯勒问道。“假设平台停止给人们他们想要的东西；你必须给他们其他东西。蔬菜是什么，我们强行加入饮食的信息又是什么，我们又如何决定那是什么？我不知道答案是什么，”凯勒说。她建议建立一种“内容中立”的“断路器”系统。与其判断哪些内容是正面或负面的，任何病毒式传播的内容——通过推荐快速加速的内容——将受到限制而非更多推广，从而减缓其传播，并让审核人员在到达大量观众之前有更多时间判断其是否合适。断路器还可能让我们回到一个去全球化的媒体生态系统，当时的内容会更稳固地留在其原始语境中。虽然这可能会限制像有趣视频之类的无害内容，但也意味着罗塞尔可能没有接触过许多伤害过她的迷因。她也就不会收到那封来自\
  \ `Pinterest` 的“抑郁图”邮件并促使她更深层地掉进兔子洞。\n\n## 内容决策中的人性因素\n\n关于内容的决定最终必须由人类做出，既是因为 `machine-learning`\
  \ 系统还没有能力做出如此细微的区分，也是因为它们的后果影响着人类的生活。这种人类能力无法像软件那样扩展——一个人无法保护数百万用户，无法审核每一个获得算法推广的帖子。而且，符合危险定义的范畴（例如禁用词列表）需要随着它的变化不断更新，因为文化永远不是静态的。但还有其他解构\
  \ `Filterworld`（过滤世界）的方法，这些方法较少依赖于评估内容本身，更多是针对于 2010 代 `Internet` 的基本结构。如果我们改变了平台运作的方式，我们也可以改变我们体验它们的最终结果。\n\
  \n## 欧盟联盟策略\n\n在 2010 年代，Facebook 就像一个微型侦探，追踪你在 `Internet` 上的足迹，记录你看到并点击的每一项内容，你搜索的每一个术语，以及你所连接的每一个人。它不仅在\
  \ `Facebook` 内部追踪你；在没有请求特别明确许可的情况下，它通过 `tracking cookies` 和 `Like` 按钮的帮助，也跟随着你到了其他网站。它的目标是收集足够的数据，以便在其平台上向你提供个性化推荐和精准投放的广告，将你的注意力卖给那些寻找例如居住在明尼苏达州、年龄在四十五十之间且对园艺设备感兴趣的广告主。大多数应用\
  \ 都以同样的方式运行，创建了无处不在的数字监控网络。无论你去哪里，你的足迹都会被某个实体捕捉，慢慢汇聚成可供企业利用的详细画像。逃避追踪的唯一方法是隐藏，使用\
  \ `incognito web browser` 或通过 `virtual private network` 伪造 `Identity`。即便如此，数字平台在你未登录账户时也会提供功能——而这些行为当然是被持续追踪的。\n\
  \n2016 年 4 月，欧盟通过了一项名为 `General Data Protection Regulation`（通用数据保护条例）的法律。它从 2012\
  \ 年开始开发，旨在赋予互联网用户对其所有在线个人数据更强大的权利，并在欧盟成员国之间建立统一的监管结构。通常缩称为 `GDPR` 的法律使用 `data subject`\
  \ 一词来描述我们所有用户。它指的是任何从其在线数据中可以识别的人，无论是他们的姓名、位置，还是“特定于自然人的身体、生理、遗传、心理、经济、文化或社会身份的一个或多个因素”。\n\
  \n\n\n\n\nGDPR 认识到在如今，我们即是数据——数据既记录了我们做过的事情，也影响着我们未来能够做或最可能做的事情，而且往往是通过算法决策实现的。因此，我们对数据应该拥有某些与对物理身体类似的控制权和权利。该法律列出了一份“数据主体权利”清单，就像基本人权一样，数字平台必须遵守遵守。\n\
  \n### 数据主体权利：透明度与访问权\n\n第一是透明度权，迫使公司以“清晰易懂的语言”对用户提出的关于如何以及为何使用其数据的请求做出回应。第二确保用户可以提出此类请求，赋予他们对收集了哪些形式的数据、何时进行追踪以及数据存储多久等信息的“访问权”，并可以请求数据本身的副本。\n\
  \n2017 年，在《卫卫报》（*The Guardian*）工作的记者朱迪斯·杜波尔泰（Judith Duportail）利用 GDPR 索了 Tinder\
  \ 上留的关于她的所有数据——多达八百页，包括她的 Facebook 点赞；她在平台上进行的每一次匹配和对话的元数据；以及超过一千七百条信息。（她是一个典型的数据主体。）杜波尔泰写道，“我对自己自愿披露了这么多信息感到很惊讶。”但她本不应该惊讶的：此类数据是\
  \ Tinder 产品本身的燃料，而自我披露是我们为了自动化效率而做出的妥协。浪漫匹配——另一种算法推荐——需要亲密的了解。\n\n### 修改、删除与反对权\n\
  \nGDPR 的第三组权利涉及数据本身修改。“更正权”意味着能够编辑或纠正关于自己的数据，而“删除权”则确保了个人数据在“不再必要”、用户撤回同意或被非法收集时将会被删除。它也有一个更具诗意的名称——“被遗忘权”，它自\
  \ 2014 年起就存在于欧盟，尽管美国还没有同等规定。\n\n第四组是关于退出，赋予用户“反对权”，让他们选择不再被追踪。这在广告领域尤尤为适用：法律规定：“当数据主体反对出于直接营销目的而处理时，个人数据不应再为了此类目的进行处理。”如果你不想为了精准广告而被追踪，你就不必被追踪——尽管广告确实可以通过其他方式触达你。它还包括“不受完全基于自动化处理的决策的权利”。换句话说，用户除非同意，否则无需经历任何算法行为。你可以阻止\
  \ Facebook 的那个小侦探在你身边转转圈，以研究下一步应该推荐什么。\n\n### 执行与执法\n\nGDPR 于 2018 年 5 月 25 日生效，影响的不仅是总部位于欧洲的公司，还包括任何向欧盟公民提供商品或服务的公司，这几乎几乎所有主要的数字平台。从表面上看，这些变化看起来并不大。网站突然开始实施弹窗，在你的首次访问时请求追踪你的许可，并提供审阅详尽服务条款文档的机会。“Cookie”（Cookies）——即网站用于追踪你时使用的数据包的术语，其名称源自\
  \ 1990 年代计算中的幸运饼干——已成为常用术语。但它代表了在追究网站肆意积累个人数据责任以及实施实际后果方面的巨大巨变。在缓慢起步后，欧盟国家已开始积极对其司法管辖范围内的公司适用该法律，被引用的次数从\
  \ 2020 年开始持续增长。截至 2023 年初，根据 GDPR 处出的罚款超过一千三百项，总额超过 23 亿欧元。\n\n### 主要监管罚款\n\n2022\
  \ 年 11 月，Facebook 因违反 GDPR 面临 2.75 亿美元的罚款，此前一次数据泄露泄露了超过五亿名用户的个人信息，这些信息在黑客论坛上流传。这并不是该公司第一次被罚款。9\
  \ 月的一项罚款是因为 Instagram 在未能保护未成年人数据后被处以 4 亿欧元；2021 年，WhatsApp 在缺乏透明的隐私政策后被处以 2.25\
  \ 亿欧元。最大的罚款来自 Amazon，其因未允许用户退出而被处以 7.46 亿欧元。除了科技巨头外，其他公司也违反了法律。2020 年 3 月，荷兰网球协会（Royal\
  \ Dutch Tennis Association，荷兰网球管理机构）因在未经许可的情况下出售成员数据而被处以 52 万欧元罚款。荷兰数据保护局还以 35 万欧元罚款了网球协会，因为其为了营销目的出售数据。利尔森（Leerssen）继续表示，“GDPR\
  \ 产生的这种这种类型的个人责任机制并非真正有效。”\n\n### 合规的局限性\n\n尽管这些处罚与科技公司的年收入相比是微不足道的，但它们确实证明了 GDPR\
  \ 如何引发某种程度的合规。虽然数据权利听起来像是一个理想的解决方案，但法律在其他方面令人失望。只需点击“接受所有 Cookie”的按钮，用户就会像以前一样被追踪。正如美国倡议组织\
  \ Accountable Tech 创始人尼科尔·吉尔（Nicole Gill）所观察到的，对于公司来说，让追踪变得尽可能无缝是符合其利益的。“摩擦力允许人们思考自己的行为，”吉尔说，这一点同样适用于\
  \ Spotify 音乐或 TikTok 馈流。无摩擦感始终是数字世界的理想状态——只要你停下来，你可能就会重新考虑。\n\n### 用户行为与界面设计\n\n\
  我自己也是这种被动行为主义者。当此类 GDPR 通知开始在这些网站上弹出时，我通常只是点击交出我的数据。如果是一个我喜欢的网站——例如 Eater（一家国家性的美食出版物）——我会乐意接受追踪，因为我想（也许是错）我可以信任该网站。当《卫报》（*The\
  \ Guardian*，我所欣赏的一份左翼英国报纸）向我索要数据时，我也答应了。能出什么坏处呢？要求退出感觉像是一种劳动。如果我感到义愤填，我会愤怒地点击“拒绝”。*我当然不想要这种监控！*\
  \ 但如果我感到愤俗，我就会直接接受，因为也许它可以改进我的算法推荐，并产生一些吸引人的个性化体验。\n\n在某种程度上，是因为懒惰和界面设计的技巧。接受按钮通常比退出按钮颜色更深、更显，所以我的大脑花了太长时间才分清哪个是哪个。但同时也感觉我的个人选择并不会改变网站的运行方式，对我还是其他人都是如此。\n\
  \n\n\n\n\n《数字服务法案》（DSA）于 2022 年 7 月通过，并于 2024 年生效，它在推荐机制方面提供了与`GDPR`对数据处理要求类似的透明度和沟通机制。平台“应当以易于理解的方式清晰地展示此类推荐系统的主要参数，以确保接收者理解信息是如何为他们进行优先排序的。”但它同时也规定，算法流必须是可定制的，使用户可以随意更改变量的平衡，或选择完全不利用个人数据的流：“即不基于对接收者进行画像的选项。”\n\
  \n另一项欧盟法律《数字市场法案》（DMA）于 2022 年 9 月签署，旨在解决垄断问题并鼓励竞争。科技巨头被标记为“守门人”。该法禁止在未经用户同意的情况下，合并由同一家公司运营不同服务的数据，例如`Meta`旗下的`Facebook`和`WhatsApp`。它还禁止“自我优待”，即`Google`和`Amazon`\
  \ 有时在中立自动推荐的掩子下（如搜索结果中）推销自己产品的这种行为——这是强化当前互联网同质化的花招之一。`DMA`的罚金最高可达公司年收入的 10%，惯犯者为\
  \ 20%，这使得合规变得更加至关重要。\n\n随着这些法律的生效，它们可能会彻底改变我们的算法格局，让用户在推荐和内容流配置方面拥有更多自主权。当我们开始探索自己的偏好并根据自己的喜味来塑造数字生活时，这种被动的关系将变为更加主动的关系。算法流将看起来不再像现在这样铁板一块化且不可渗透，而是更像它们本质上的功能性工具。没有理由要求你的信息流运行方式必须和我的一模一样。由此产生的丰富也可能带来在线文化的多样性。\n\
  \n科技公司正在对新的法律格局做出反应。2023 年 8 月，母公司`Meta`宣布，`Facebook`和`Instagram`都将增加选项，允许用户完全退出算法推荐，消除自动化个性化的可能。但该选项仅对`EU`用户开放——因为`US`在采用此类立法方面要慢得多。当我看到这些新闻标题时，我感到非常嫉妒。仿佛仿佛只有`EU`居民才能呼吸到没有污染的空气。\n\
  \n## 美国监管\n\n`EU`数字平台监管已经预示了美国社交网络的一场重大变革。尽管这些法律并不一定适用于美国，但它们创造了一种罕见的改变压力。2021 年\
  \ 4 月，`Apple`宣布了其`iPhone`操作系统的更新，名为“应用跟踪透明度”（App Tracking Transparency）。任何想要为了广告目的跟踪其用户数据的应用都必须先请求许可，并在弹窗中允许用户选择不被跟踪。`Apple`还添加了一个跟踪菜单，提供了关闭所有下载应用跟踪的选项。这看起来可能不是一个重大变化，但其后果是立而易见的：早期统计显示，只有\
  \ 16%的用户同意跟踪，尽管这一比例在一年后增加到 25%左右。因为我的手机感觉比网页浏览器更个性化、更私密，所以我通常选择拒绝。至少在移动端，这项功能限制了占据科技公司大部分收入的精准投放广告。2022\
  \ 年初，`Facebook`预测该功能将导致其高达 100 亿美元的损失，导致其股价下跌超过 26%——损失超过 2300 亿美元。\n\n`Apple`的“应用跟踪透明度”提供了一次现实实验，展示了美国用户将如何应对类似于`GDPR`提供的强制数据隐私。事实证明，除非我们看到这样做的好处，否则我们并不特别想被跟踪。（例如，某些游戏类应用的同意跟踪率要高得多。）`Apple`通过提供简单的隐私功能脱颖而出，并在过程中损害了其竞争对手，这证明了也许最大的公司并不像看起来那样无懈可击。数据访问是他们的阿喀琉斯之踵；切断他们收集数据的能力就能打破“过滤泡世界”（Filterworld）的控制。\n\
  \n根据斯坦福大学法律教授、斯坦福网络政策中心联合主任`Nathaniel Persily`等人的说法，`EU`的立法形式与美国的立法通常不同。他告诉我，`EU`法律（包括`GDPR`和`DSA`）往往更广泛、更模糊，要求采取可能无法立即实现的行动。这些法律是“要在几十年内不断完善的”。但此类监管规定将为其他国家提供一个功能性模型和前进道路。“在这里，欧洲将成为摇动美国狗的尾巴，”Persily\
  \ 说。`GDPR`的持续也证明了另一个重要论点：更多的个人数据保护不会破坏互联网。我们可以像以前一样多或少地消费内容，只是拥有更强的安全感和自主权。\n\n\
  `Persily`见证了数字平台与其用户及政府之间关系的变化。2018 年，他帮助创建了`Social Science One`，这是`Facebook`与学术界之间一项突破性的合作，最终允许研究人员研究社交网络的内部数据。2020\
  \ 年，他们发布了一个`URL Shares`数据集，总计超过 1EB（10 亿 GB），包含了 3800 万个被`Facebook`用户分享和点击的链接。在\
  \ Persily 看来，监管往往紧随争议之后产生。`Social Science One`的产生受`Cambridge Analytica`丑闻的影响，这家英国咨询公司在未获得用户同意的情况下收集了数百万`Facebook`用户的数据，并将其用于政治竞选（包括唐纳德·特朗普的）。对算法平台日益增长的不满增加了对监管的开放态度。“人们迫切希望看到一些行动，”Persily\
  \ 说。\n\n\n\n\n特拉华州参议员克里斯·孔斯（Chris Coons）迅速联系了 Persily，并将其文本作为透明度法案的基础，一个更大的群体开始推动该法案。他的理念变成了《平台问责与透明度法案》（Platform\
  \ Accountability and Transparency Act），并于 2021 年 12 月在两党的支持下公布。这些学术思想已走向法律。`PATA`\
  \ 强制社交媒体公司通过国家科学基金会审核的请求，向研究人员提供数据。不合规的公司将失去 `Section 230` 的保护，并对其平台上的所有内容负责。\n\n\
  PATA 加入了其他可能的立法，例如 `NUDGE Act`，这是参议员艾米·克洛布（Amy Klobuchar）和辛西娅·卢米斯（Cynthia Lummis）在\
  \ 2022 年的一项两党提案。（这个复杂的缩写代表“引导用户在社交媒体上获得良好体验法案”）。在美国，这些努力与其说是开始而非结束：我们可能已经意识到算法推送正在损害我们个人及集体利益，但对于如何在政府层面最好地减轻其影响，我们远未理解。\n\
  \n监管为通常被视为政治问题的问题提供了政治解决方案。事实上，算法推送一些最明显的问题触及了政治，涉及言论自由、骚扰、技术编码偏见以及工业资本主义。但在《过滤世界》（`Filterworld`）中，推送也影响了生活中更平凡方面。任何监管在线仇恨言论的尝试最终都会影响我们选择观看电视节目或听音乐专辑的方式。算法对我们注意力的垄断也可以被打破。\n\
  \n然而，涉及到文化时，监管不能是唯一的答案。（政府政策在该领域很少成功。）法律可以强制平台封禁有问题的内容，但它不能让 `Spotify` 为你推荐更具挑战性或更有创意趣味的音乐列表。遗憾的是，我们并没有个人品味的宪法保障的权利。因此，我们还必须改变自己的习惯，更清楚地意识到我们是如何消费文化的，以及我们如何抵抗算法推送的被动路径。就像我们可能会在超市里购买有机标签的食品一样，我们必须寻找支持非同质化文化、并允许艺术家在没有同质化巨大压力下表达自我的数字空间。\n\
  \n我们必须仔细对待我们关注的每一个推送，并精确了解我们的注意力是如何转化为创作者的经济支持的。定向广告可能是最糟糕的可能性之一。数字景观像一片森林；`Facebook`\
  \ 和 `TikTok` 也许是参天大树，挡住了大部分阳光，但如果你去寻找，它们的阴影下也有其他可能性在生长。\n\n已经有方法直接为艺术家的在线创作进行付费。`Bandcamp`\
  \ 充当独立音乐人的数字版独立唱片店；用户可以直接购买数字文件和流媒体访问，而不是由 `Spotify` 调解。`Patreon` 允许创作者对其选择的任何内容设置付费墙，无论是写作、图像还是音频。它提供了一种用户付费订阅的线性帖子流，这种关系比\
  \ `Twitter` 关注要强大得多。`Substack` 对邮件通讯订阅做了同样的事。\n\n2008 年，《连接》（`Wired`）编辑凯文·凯利（Kevin\
  \ Kelly）曾著名地写道，创作者只需要找到“1000 忠实粉丝”就能资助他们的工作并维持生计——即一千个可能每年支付他们 100 美元的人。这与大型数字平台是完全不同的模型，在那些平台上，受众必须尽可能大。“目标是一千个客户比目标是一万个粉丝要可行得多，”凯利写道。然而，所有这些小型平台在试图增长并服务尽可能多的用户、创作者和消费者时，都面临着变得算法化的诱惑。它们还不断受到巨型科技公司的威胁，这些公司可能会收购或消灭它们。无法保证它们的非算法功能将保持不变。\n\
  \n最有力的选择可能是最简单的：停止将你的注意力提供给剥削这种注意力的平台。有一种方法可以在继续使用数字技术的同时，坚持对待用户更好的网站和公司。我们可以回到一个更加\
  \ DIY 的互联网。但更具戏剧性的选择是完全注销，并思考如何在线下再次维持文化。过去十年的数字身份危机让改变变得不可能。`Facebook` 像亮蓝色的数字葛藤一样缓慢扼杀开放互联网。随着这个平台变得不可逃避，我感到自己也对它失去了兴趣，因为它不可能同时服务于所有目的并在所有方面都保持成功。如果\
  \ `Facebook` 是一切，那么它也什么都不是，是一团毫无区分的内容。其他平台也以同样的方式衰落：马克·扎克伯格领导下的 `Instagram`、丹尼尔·埃克领导下的\
  \ `Spotify`、埃隆·马斯克领导下的 `Twitter`。到 2023 年，社交媒体似乎进入了一个新阶段，其劣势比优势更加明显。\n\n最近我每天在在线上感到有些压抑，部分是因为我无法像以前在个人博客时代和与他人缓慢交流的时代那样表达自我。模板太有局限性，节奏太快了。尽管二十年前的技术要糟糕得多，但那种体验（或生态系统）有它的优势。我认为有一种方法可以重新捕捉那种创意能量，那种低保真（lo-fi）的可能性和自由的氛围。虽然监管可以对算法推送提供基本的控制，但文化的重建是一个不同的过程，更像种植和经营一个园艺。这需要时间。首先，我们需要寻找合适的数字结构，然后我们需要执行决定在线生活新方式的日常劳动。\n\
  \n# 第 6 章\n\n## 寻找人类策展\n\n## 我的算法清洗\n\n\n\n我很难言言，这些信息流是如何如此丝滑地渗透进我的生活的。关注所有这些动态就像整天都在抽烟，一次又一次的信息狂欢：从早晨醒来刷刷\
  \ `Twitter` 查看隔夜新闻，到深夜在 `Netflix` 首页上来回划动以决定看什么。我对这种状况的不满已经积聚已久，并在新冠疫情期间变得愈演愈烈；作为一名作家和各种文化的消费者，这些平台是我与那些向我推介新奇有趣事物的人建立联系的地方。我很感激自己在\
  \ `Twitter` 和 `Instagram` 上投入的多年时光，以及在这些空间里建立的个人和职场关系。但我开始认为，尽管这些信息流带给了我在其他情况下永远无法看到或听过的东西，但我对它们的过度依赖也将我与另一种在过去十年中被遗忘的体验领域隔离开来：那是与匮乏而非无限的邂逅，是在没有滑动划走选项的情况下，由自己判断并选择在特定时刻想要看的内容的过程。\n\
  \n## 算法劫持\n\n如果说一种算法焦虑是感到被算法推荐所误解，那么另一种就是感到被它们劫持，感觉即使试了也无法逃脱。也许现在有太多的事情依赖于这些信息流，它们的影响是无处不在的。目前为止，监管的效果一直不好，而且这种体验是如此引入胜且便利，以至于大多数互联网用户难以放弃。算法推荐之所以让人成瘾，是因为它们总是在微妙地证实你自己的文化、政治和社会偏见，将你的周围环境扭曲成你本人的镜像，同时对其他人也这样做。这让我感到焦虑，担心我对自己生活的看法——这种通过互联网生活的生活——只是一个由信息流构成的虚构故事。我对于朋友在某一天在做什么、各个城市发生了什么、哪些新闻报道重要、甚至包括天气的感知，在很大程度上是由我在自动化应用上看到的内容决定的。更有甚，那些信息流都变得日益破碎且充满缺陷，将几天前的帖子呈现得仿佛刚刚发生一样。根结底，我的自我感取决于从那些隐形观众那里获得的反馈，而那些人的注意力也是通过算法调解的。我不确定如果没有算法推荐我会变成什么样；我不知道其他在数字平台上度过多年的人中，是否有人能完全确定。一种恐惧油然而生：在被动地消费我感兴趣的内容时，我是否已经放弃了寻找对我而言真正有意义的自主权？\n\
  \n## 实验的决定\n\n为了对抗那种迫在眉睫的徒劳感，我做了唯一能的事。我决定看看自己能否过没有这些信息流的生活，离开它们一段时间，就像某些人为了大斋期戒糖，或者在一月份戒酒一样。我会拒绝它们那种替我思考的诱人提议，并尝试自己去思考。\n\
  \n这听起来是一件很容易完成的事。我所做的是从手机上删除一些应用，并在我笔记本电脑上那些太容易滑入的网站上注销一些账户。但与此同时，这感觉似乎是不可能的。我的工作生活在\
  \ `Twitter` 上，我的社交生活在 `Instagram` 上，我的音乐在 `Spotify` 上。我担心自己会错过一些关重要的事情，比如从远处观察朋友的生活事件、读到新的喜爱的文章，或者错失一个只会在网上找到我的工作机会。“FOMO”（错失恐惧症）这个词太太轻了——我担心，尽管有各种反面证据，如果不再像以前那样持续地活跃在社交媒体、始终参与集体信息流，就等同于不存在。如果算法没有记录我，那么我是否还参与了这场宏大的集体对话？在线发帖就像艺术家冈泽宽（On\
  \ Kawara）从 1969 年开始的系列“我依然活着”，他在作品中发送了数百封印有标题文字的电报，仿佛在不断地证明这一点。\n\n## 意识到现实\n\n\
  然而，当我仔细思考自己的焦虑时，我意识到它们其实是相对无关紧要的。如果不看到朋友度假的十几张照片，或者没看到那些热销小说的最新评论，或者没看到某个特定时刻哪些病毒式争论正在主宰\
  \ `Twitter`，我真的会错过什么？在我日常的物理生活背景下，这些内容几乎没有任何影响。我担心失去某些联系，但那种联系毕竟比我散狗时与邻居聊天更具环境性，也更不直接。我想，在一直在线、追逐算法信息流更新而进入的持续超警醒状态，与完全无知的状态之间，一定存在一种更快乐的媒介。如果我一直都在网上追逐算法更新，我到底需要多少数字输入？这种的恐惧可能比现实本身更糟糕。\n\
  \n## 算法清理\n\n我开始将我的实验视为一种算法清理，一种理想情况下能让我比以前更健康的数字饮食。我也想知道在没有推荐的情况下如何关注当代文化。但我一直在推迟这项承诺。最终，在\
  \ 2022 年 8 月的一个周末，关注信息流的前景比离开它们更让我精疲力竭。当时，由于收购电动汽车公司成为世界最富有的人之一，埃隆·马斯克威胁要收购 Twitter\
  \ 并将其变成他的私人乐场（他最终在 10 月成功了）。该平台的氛围变得比比常更消极。`Instagram` 也变得越来越不可用，因为它开始优先推广视频片段——引发了用户的大规模投诉——以追\
  \ `TikTok`。\n\n`TikTok` 本身是一种麻痹，因为它对用户输入的响应像是一种读心术，消除了我思考的需求。我可以从眼前现实中获得五分钟（更有可能是十五分钟）的休息，而干扰极小，就像一次让你彻底离开世界的致幻之旅。`TikTok`\
  \ 的“为你推荐”流是大卫·福斯特·华莱斯小说《无尽的》（Infinite Jest）中“娱乐”：一种引人注目以至于人们无法停止观看的内容。尽管它是如此成瘾，华莱斯还是将其虚构的“娱乐”描述为“奇特地空虚、毫无意义，没有戏剧性——没有向真实故事的移动”，这对于\
  \ TikTok 流向无形氛围和感觉的漂移也是一个恰当的描述。沉迷这些技术并没有让我变得更聪明，或能够产生更复杂的想法，而这本是我作家的工作。\n\n当我离开社交媒体时，我没有告别，也没有在我的各种信息流上发布公告。公开承认清理会破坏运气，更不用说这是社交媒体鼓励的那种自大行为。没有人会在意你停止推文；算法会简单地插入另一个更愿意参与的人的内容，因为在过滤世界（Filterworld）中，每个人都是可以被取代的。大多数粉丝可能不会注意到你的缺席，因为至少对算法来说，你沉睡的账户被认为不再值得优先考虑。\n\
  \n所以，八月的一个周五晚上，我结束工作后直接切断了联系。当然，我以前注销过很多次。但我知道我一段时间内不会回来——我计划进行几个月的清理——这种安静是震耳欲聋的。\n\
  \n\n\n第一个周末并没有那么糟。按理说，周末本该是我们下线的时候，尽管当我不得不处理几个小时工作时，我开始怀念 Twitter 上那种氛围式的同伴感，就像是一群在课间休息被关在教室里的孩子们。然而，接下来的周一简直是种折磨。我的拇指发痒，想要滑动，我的大脑也因为没有持续不断的信息轰炸而产生了戒断反应。这些症状类似于焦虑的生理表现：神经质的抽动、易怒、普遍的不适感。我非但没有因为这种改变而放松，反而因为这种缺失而感到困扰。也许我有些大其实了，但这种反差确实是巨大的。我从每天看到成百甚至上千条碎片信息和多媒体内容，变成了现在只能看到寥寥。通过切断算法推送，我踩下了数字消费习惯的刹车。\n\
  \n为了获得纯粹的刺激，我在手机上下载了几个“解压应用”——那些允许你堆叠积木或拨动灯开关的游戏，就像数字版的念珠。一个名为 `Antistress` 的应用提供了诸如将肮脏地板吸得干净整净之类的选项。它们缓解了我的坐躁，但和向虚空发推文一样毫无意义——只有行动而没有意义。相反，我在笔记本电脑上建立了一个名为“未发表的推文”的文件，在其中写下我本会发布的每一个观察结果。回来看这份文档，那些草稿并不鼓人心：“马克思主义者诺拉·艾弗洛恩：‘一切都是资本。’”“我怀念那些可以通过翻盖手机发送短信到\
  \ 244244 来发推文的日子。”这些笑话或许能换来几个点赞，但在 Twitter 本身之外毫无意义。毕竟，那里才是我感性进化并与之适应的场所。\n\n就像任何类型的戒断反应一样，这种“大扫除”让我变得很坏躁。由于无法从隐形的观众那里通过点赞和转发获得持续的反馈，我向现实生活中的\
  \ `Jess` 投喂了太多平庸的观察，而当她（理所当然地）忽略了大部分时，我感到很恼火。我不断的坐立不安和对刺激的寻找变得如此分心，导致 `Jess` 经常离开公寓去进行异常深夜、异常漫长的散狗活动。\n\
  \n在接下来的几周里，我发现互联网已经不再设计为没有算法推送就能运行了。这些推送像至关重要的航道一样，确保各种形式的内容到达预定目标，而无需让创作者或消费者付出太大精力。创作者（无论是个人、品牌还是出版物）可以发布内容并相信它会触达关注他们的人，尽管效率并非\
  \ 100%。消费者可以打开推送，看到对他们有吸引力的内容，至少在大多数时候是如此。那些功能是汇总标题和突出趋势的博客及其他网站（如最初的 `Gawker.com`）在推送的轰炸中消失了。因为这个系统已经根深蒂固，出版网站已经拆解了它们的主页，以至于它们通常在屏幕上一次只显示几个故事，图片最多，而文字最少。当我浏览这些网站时，感觉自己像一个不速之客的访客，一个不该出现在那里的人。这些网站几乎在大喊：*难道不知道你应该在\
  \ Facebook 或 Twitter 上吗！？*\n\n在我的“大扫除”期间，我还发现推荐系统会出现在意想不到的地方。我最终转向了《纽约时报》应用作为查看新闻的主要途径，但该应用有一个“为你推荐”标签，非常像\
  \ `TikTok` 的，它利用你之前的行为来建议一系列你被认为可能点击的文章。它立刻将我归类到艺术和文化文章中，偶尔夹杂着一些房产奇观的内容，我对此表示赞赏。但那种局限的视野恰正是我试图避免的。我停止了使用那个标签，却发现很难在应用的其他地方获得广泛的新闻视野。屏幕仍然局限于编辑认为重要的几项内容，但这些内容并不总是符合我的兴趣。我必须面对自己对个性化的预期。\n\
  \n2022 年 9 月伊丽莎白二世女王去世的那一天，我已经好久没看新闻了，`Jess` 在几小时后才告诉我。当我最终因为无聊而使用《纽约时报》应用阅读大卫·布鲁克斯的一篇评论文章时——这是一种之前完全不感兴趣的写作和作者——她甚至考虑要对我进行一次“干预”。我突然理解了那些老情景剧中的场景：某人在早餐桌旁折报纸并引用一个平庸的标题。在缺乏细分领域的\
  \ Twitter 戏剧之后，这就是新鲜感的主要来源。\n\n完全逃避算法几乎是不可能的。毕竟，`Google Search` 仍然由算法驱动，而且每个电子邮件客户端在某种程度上都会自动对消息进行排序——我没法关闭我的\
  \ `Google Maps`。但我可以不需要那些自动化的内容高速公路。\n```\n\n\n\n1998 年，日本艺术家兼作家别部朝龙（Yoshitoshi\
  \ ABe）推出了一部名为《玲》（`Serial Experiments Lain.`）的动画电视节目。几年后，当我在美国作为一个青少年时得益于早期互联网发现了它，它成为了我审美感的重要组成部分，也成为思考“在线”的本质意义的一种方式。别部的作品在美国并不出名，尤其是与吉卜力工作室这种现象级作品相比，但它将卡夫卡式的文学黑暗与梵高绘画的视觉冲击力结合在了一起。《玲》（通常简称\
  \ *Lain*）是一个关于互联网时代生活的寓言。在剧中，一个名叫玲的少女发现了一个名为“局网”（the Wired）的虚拟世界。剧集的色调阴暗而柔和，沉浸在深夜亮灯卧室的氛围中，那是玲度过大部分时间的地方。这让我想起了自己家里放置电脑桌面的地下室，在那里，我经常发现自己虽然身体上是孤独的，却沉浸在互联网那种抽象的聚集感中。\n\
  \n这部剧震撼人心，正如伟大的艺术应当做的那。在玲的世界里，局网是地球上所有通信的互联：电视、电话和互联网。它们共同构成了一个跨越物理和虚拟空间的完全合成现实——让人意识到，无论在线上发生什么，都会影响现实世界。通过在局网中的经历，玲发现了自己除了害羞初中生之外的另一个身份。对她来说，那里变成了一个完全独立的空间，她通过那里定义了了自己。\n\
  \n尽管我对算法推送持怀疑态度，但我从未能完全放弃互联网，因为在我的一生中，它带给我太多东西。它的正面影响仍然大于负面影响。正如它对玲来说一样，互联网定义了我的生活。我所追求的问题不是我们是否应该放弃数字生活，而是我们如何改进它们，让它们更有价值。（一个全球化的世界似乎永远不会再次放弃数字网络。）从我父母在童年家里的地下室通过拨号上网器连接到一台老旧的台式电脑开始，互联网就提供了一种逃避之所，一个发现新文化领域、结识新朋友并构建一个超越我即时所接触范围的世界观的空间——就像亚历山大大图书馆一样——每天\
  \ 24 小时开放，总有乐于助人的人值守。我的家人鼓励我所有的兴趣，但他们无法向我介绍我在网上发现的那些小说、音乐、视频游戏和电视。当我感到被困在康涅狄格州的郊区，那里没有任何繁华的街道生活或文化机构可以求助（除了几家破旧的音乐场）时，互联网是我触及范围内文化上最激进的空间。\n\
  \n我我想美国千禧一代的很多人有同样的感觉；就像拥有自己的车一样，开放的互联网为自我主张提供了即时的自由。我们在培养个人品味的过程中都走着不同的道路，弄清楚自己喜欢什么和不喜欢什么。但我们自我发现的模式是相似的，它们由我们的时代和周围的技术所决定。以前几代人可能通过舞厅或独立广播电台来帮助他们在性格形成的青少年时期发现新音乐，而\
  \ 21 世纪的年轻人有 `TikTok` 反馈和 `Spotify` 歌单，20 世纪 90 年代末和 21 世纪初的千禧一代拥有在线论坛和 `MP3` 盗版。与算法推送那种无摩擦的途径相比，寻找并消费你喜欢的内容需要多得多的劳力和精力。虽然避免这种劳作可能很方便，但也让我们的个人品味变得更加薄弱，不再那么来之不易。\n\
  \n在流媒体和社交媒体出现之前，文化往往感到相对稀缺且有限。要么你能接触某些东西，要么不能。我关于多媒体最早的记忆之一是：小时候，我和弟弟会在每个工作日的早晨早早打开电视，试图捕捉一部《超级马里奥》动画片。我们会确保\
  \ `VCR` 里装好了一盘 `VHS` 磁带，因为我们想见证并捕捉特定的剧集，比如把从电台录制的一首歌放到磁带上。当我感到被困在康涅狄格州的郊区，那里没有任何繁华的街道生活或文化机构可以求助（除了几家破旧的音乐场）时，互联网是我触及范围内文化最激进的空间。我记得某个特殊的剧集是关于玲拯救皮欧的。当我们第一次看到它时，它在我们脑中获得了神话地位，但当时我们只能通过电视节目获取它。只有当它被录制在磁带上，我们才能完全拥有它（磁带并不总是可靠。）只有那时，我们才能随意观看《超级马里奥》。\n\
  \n这种体验是缓慢且充满摩擦的。然而，这种匮乏感对我来说往往是如此迷人。我曾投入了如此多的精力和情感，以至于二十后的我依然记得它，尽管现在它已遗留在某个 `VHS`\
  \ 磁带中。对于通过推送交付的任何数字内容，我不能这么说。我们可能在推送中发现某些东西，但在它们再次消失在以太之前，我们必须抓住它们并深入挖掘。我们必须有意识地反抗这种速度和无摩擦。\n\
  \n深入挖掘曾是寻找文化的默认任务，特别是在早期互联网上。我对动画的首次接触是 90 年代美国有线电视上的《龙球 Z》（Dragonball-Z），但当我想要寻找比无无止战斗更复杂的叙事时，我必须上网。我发现了一些论坛，经验丰富的动漫迷在那里讨论他们的喜好，不是为了获得粉丝或像当今平台那样变现，而是出于个人热情。那些论坛是“消费社区”，学术界用这个术语来描述围绕特定共同追求而聚集的多元群体，无论是交换产品建议还是讨论先锋文学。一篇论文将消费社区描述为一种“相互学习”—我们共同弄清楚我们在寻找什么以及如何找到。像\
  \ `Twitter` 和 `Facebook` 这种具有不稳定性界面和操纵性算法的平台，不利于相互学习。\n\n进入文化黑洞有多种方法。算法推荐几乎可以瞬间完成。得益于\
  \ `TikTok` 的推送，你从不知道 `ASMR` 挤海绵视频的存在，直接跳跃到沉浸在几十个视频中。我在一个早晨感受到了那种加速感，当时我还在床上时，App\
  \ 开始向我推送一连串来自丹麦的美国籍人的视频日记，展示该国家的产假政策和舒适的咖啡馆。这些人的存在是理所当然的，但我不知道他们正在制作易于理解的一分钟纪录片。我关注了一些账号，但正当它们涌入时，它们也消退了，我无法回到那个特定的类型。并没有特定的标签将它们联系在一起；算法推送根据内容的参与模式将它们汇集在一起。\n\
  \n\n\n\n一种更慢、更审慎的方法是亲自寻找这些文化缝隙并规划自己的路径：收藏账号、与同样对这些事物感兴趣的人建立联系并交流心得，就像我我在动漫论坛或 Twitter\
  \ 早期所做的那样——在它变得如此庞大而让人无法掌握之前。这是一种更具意识性且有目的的消费形式——在信息流（feeds）让我们如此轻易地外包在线消费选择的选择之前，这种形式曾是强制性的。\n\
  \n这让我想起“鉴赏家（connoisseur）”一词。在艺术史语境下，这个描述词可以追溯到 18 世纪，当时，鉴赏家是指仅凭视觉观察就能判断作品出自哪位艺术家之手的爱好者收藏家。他们在特定作品中寻找他们研究过并编目过的艺术家标志性笔触。鉴赏家很大程度上通过消费行为积累了专家知识。德国人约翰·约阿希姆·温克尔曼`Johann\
  \ Joachim Winckelmann`）就是这样的鉴赏家之一；尽管他并非出身贵族，职业生涯始于教师，但他成为了希腊和罗马艺术最顶尖的收藏家和学者之一。他的努力促成了艺术史这一学科的形成。\n\
  \n在 TikTok 上，成为鉴赏家变得困难，因为你几乎没有机会培养专业知识，或为你所看的内容构建背景信息。你必须付出努力，离开信息流，并逐渐提炼你所寻找的事物。这种缓慢的、自我管理的文化消费方式的好处在于，它可能会让你对当下内容产生更深刻的欣赏，而且你可能引导他人走上你走过的道路，教他们如何欣赏事物。这种方式更具可持续性，也对文化更加尊重，将其视为重要的东西而非转瞬即逝的、仅仅是碎片化注意力的饲料。无论结果如何，创造出原创性的东西都需要大量的人力。正如我的朋友奥里特·加特`Orit\
  \ Gat` 曾经告诉我的那样（半是开玩笑，也半是认真的），你观察一幅画的时间，应该象像艺术家画完这幅画所花费的时间一样长。而在我们的信息流中翻看那些零散组合的内容，没有机会去同化、理解，更不用说传递给他人。这种消费的浅薄导致了文化的整体扁庸化。\n\
  \n在青少年时期，我曾试图成为动漫的鉴赏家。多亏了论坛的推荐，我从《龙球》（Dragonball）之类的陈词滥调进步到《出色的早缘》（Love Hina）和《魔法人工巧克力》（Chobits）等浪漫喜剧作品。这些作品过度迎合男性凝视（该流派另一种说法是“后宫”），但对当时的我来说，由于其人际戏码和科幻套路，感到很新颖。我身边没有人可以讨论这些发现，只有萌芽阶段的在线社区。当我发现阿部庆史（Yoshitoshi\
  \ Abe`）的作品，如《玲》（Lain）时，我才发现自己的鉴赏之路还有很长要走。在《玲》之后，阿部创作了一部名为《羽动物语》（Haibane Renmei）的动画，译为“炭之羽”。它更加奇诡。在剧中，一个名叫落卡（Rakka）的女孩从一个虫茧重生，成为一种炼狱中的天使，背上还长着退化的翅膀。她以这种形态出现，仿佛是从一个噩梦中来到一个被田野环绕的、看起来古老的围墙镇。这些被称为“羽动者”（Haibane）的天使不能拥有任何新东西，不被允许使用货币，必须工作，并禁止离开小镇。\n\
  \n尽管场景凄凉，这部剧是令人慰藉的。如果说它初看起来像场噩梦，它就会变成一个神话寓言。当我十四岁第一次看《羽动物语》时，我并不知道“哀歌般的（elegiac）”这个词，但现在现在我会用这个词——忧伤而温柔地萦绕，蕴含着一种愉悦的忧郁。动画中粗粝的线条处理和暗淡、有机的色调增强了这种氛围。多年后，我发现这部剧灵感源于村上春树（Haruki\
  \ Murakami`）的小说《硬壳梦想与羊底世界》（Hard-Boiled Wonderland and the End of the World），该书最初于\
  \ 1985 年。一个文化作品引发了另一个，我顺着那根线索追寻而去。小说和动画共享一种心情、一种词汇和一种哲学——它们都具有围墙小镇、某种蒸汽朋克美学，以及一种以新的方式理解生活。\n\
  \n《羽动物语》（Haibane Renmei）是我第一次发现真正属于自己的文化发现之一，在寂静中遇到它。我察觉到，我周围的人并不喜欢或理解这部剧，但它对我产生了深层的共鸣。这是一种私人的体验。\n\
  \n如果没有互联网，我无法接触到这种艺术——不仅是因为我是在那里发现它的，更是因为那是它唯一存在的地方。当《羽动物语》在 2002 年在日本首映时，它并没有立即翻译成英文。动漫爱好者聚集在一起，制作“粉丝字幕（fansubs）”——将日语翻译成数字字幕。粉丝字幕是激情的产物。尽管并不完美（有很多拼写错误和文本故障），但它们让网络居民在没有其他途径的情况下看到节目。这是在线消费社区的另一个益处。\n\
  \n反过来，如果没有那个早期互联网文化的很大一部分来源：文件盗版，粉丝字幕是无法被下载的。当时没有流媒体服务，但有像 `Kazaa` 和 `BitTorrent`\
  \ 这样的工具，允许用户上传和下载任何类型的媒体——MP3、电影、PDF。只要至少有一个人在上传某个特定文件，你就可以搜索并下载，质量和速度因而异。上传同一个文件的人越多（`BitTorrent`\
  \ 将上传用户称为“种子者”），下载速度就越快，这形成了一种松散的质量排名，无需信息流或算法推荐。种子者越多，手中的文件可能越好。有时这种质量是体现在分辨率或字幕上的。它也是抽象的，衡量艺术成就或文化意义的标准：越来越多的人认为这个特定的东西值得投入成本和风险。\n\
  \n我记得等待专辑或动漫季下载完成需要几天几，进度条缓慢填充。在电脑常开时代之前，我必须确保桌面保持开启状态以让 `BitTorrent` 继续运行。有时，在所有努力之后，文件会被错误标记（无论是无意还是恶意的），我必须重新开始。但这种分享网络让我感到与其他粉丝建立了联系。这是我生活中其他部分缺失的东西。\n\
  \n\n\n\n在刘易斯·海德（Lewis Hyde）1983 年的著作《礼物》（*The Gift*）中，他将艺术品定义为艺术家通过创作行为自由给出的东西，无论它最终流向何处：“艺术作品包含了艺术家礼物的精神。”但从某种意义上说，口味也可以是一种礼物。向某人介绍你认为他们可能喜欢的新文化作品不需要成本，这种行为可能会让所有参与方受益。毕竟，文化不是一种一对多多的广播系统，而是一个点对点的网络，类似于`BitTorrent`，我们通过刻意分享来共同决定什么对我们最有意义。正如海德所写：“礼物的精神通过不断的捐赠而保持活力。”\n\
  \n我在音乐方面也有过类似的“钻牛角”经历。我从母亲那里继承了对戴夫·马修斯乐队（Dave Matthews Band）的欣赏，那是 90 年代混乱的吉他即兴乐队的巅峰，这种喜好我无法完全辩解，但也无法消除。我在离家有一小时车程的巨型\
  \ Borders 书卖店购买 CD，那里也是我发现第一批新引进的日本漫画的地方。但在网上，我寻找自己音乐口味的过程走了一条更为曲折的路线。\n\n### 味觉的数字化演变\n\
  我的第一个“家”是一个大型在线角色扮演游戏（MMORPG）的论坛——这是一个你在互联网上与成千上万玩家同时生活的的游戏世界——那里有一个附属的音乐板块。然后，我搬到了名为\
  \ `AntsMarching.org`的戴夫·马修斯乐队专门论坛（再次，听起来很尴尬）。最后，在 2000 年代初，我落入了一个稍宽一点的独立音乐论坛 `UFCK.org`，那里聚集了一些对该乐队感到有些疏离的\
  \ DMB 粉丝——也许是已经成长不再迷了。\n\n就像一位刷掉数百年尘土的考古学家，我现在在网上只能找到 `UFCK` 的裸露痕迹，大多是它在 2006 年关闭后在其他论坛上的回忆帖或“难民”贴。那时，它是我网络生活的中心，我从那里发现了其他乐队和音乐人的推荐，这些推荐成了我口味的核心：安德鲁·伯德（Andrew\
  \ Bird）、十二月乐队（The Decemberists）、苏富扬·史文斯（Sufjan Stevens）。这种选择绝非独特；它变成了那些过度上网或过于文青的北美青少年的的一种通用音乐品味，是跨越地理的在线同质化的早期象征。在我的现实生活中，这是不寻常的。我不认识其他任何在听这些乐队的人。论坛还充当演唱会录音的档案，特别是针对\
  \ DMB。录音师（Tapers）会带着录音设备——麦克风、吊杆和录带机——去演唱会，然后在网上分享结果。论坛成员争论哪场 DMB 演唱会或哪首歌的现场直播版本最好，追溯一直远到该乐队\
  \ 1991 年的建队。这种集体讨论在这一小众音乐欣赏领域中形成了一个 DIY 典范——遵循了早先由感恩之死（Grateful Dead）和飞鱼虫乐队（Phish）建立的生态系统。\n\
  \n### 鉴赏力 vs 算法\n随着时间的推移，我通过文件分享收集了自己的自己的演唱会 MP3 数字档案，并按年份排序，就像一个葡萄酒爱好者存放陈年佳酒酒窖一样。我开始最欣赏\
  \ 90 年代中期的录音，并断言 1997 年是该乐队最好的一年。录音有杂音且不完整，或者表演不合常规，这并不重要。必须有意识地积累收藏，并思考你最喜欢某个创作者或文化体的哪些部分，意味着要成为一个鉴赏家。这个词带有一种傲慢的色彩，但我们可以成为任何东西的鉴赏家：真人秀、噪音音乐、苹果派食谱。我们通过算法推送在可用性上获得的那些东西——即时访问随心扫描的广泛材料——我们在鉴赏力上却失去了这些，因为鉴赏需要深度和意图。这归结底是一种深层欣赏的形式，不仅为了艺术家的所作，也为了我们自身口味的能力。\n\
  \n从经济角度来看，我青少年时期从事的那种盗版行为是不道德的，更不用说大多数时候是违法的。我知道我在偷这些专辑和电视节目，这些是在美国已经获得商业许可的作品。艺术家们并没有从我的粉丝行为中获得财务收益。（这个问题并不新鲜；19\
  \ 世纪的小说家面临外国出版商的图书盗版版本，正如 2000 年代的音乐人面临来自 `Napster` 的盗版，正如历史学家奥兰多·菲格斯（Orlando Figes）在他的书《欧洲人》（*The\
  \ Europeans*）中记忆深刻描述的那样。）但作为 2000 年代存在的文化分发模型，我想不出比论坛和文件分享生态系统更好的了。它是我的亚历山大图书馆。互联网的早期是一个中介较少的口口传播环境，专业知识从一个人传递给另一个人，缓慢积累成群体和社区，凝聚成一种尽管如此仍可捕捉的整体文化。\n\
  \n### 推荐中的人性元素\n我必须承认，我对这段的崇拜部分是出于怀旧。我们都梦想过那段青春，那时自我尚未完全成型，与艺术的相遇具有震撼的力量。青少年对新体验更加开放，无论他们使用什么技术来消费它们，并且有倾向和时间去沉浸于痴迷，成为鉴赏家。但我意识到，我之所以如此欣赏那些在线互动，是因为它们建立在人与人的推荐之上，而不是自动化的推荐。必须有人足够在意并告诉我他们喜欢什么，我也必须足够在意去信任他们并公平地尝试。这种文化推荐——表达认可——是社交道德行为。我们告诉彼此喜欢某些东西，就像蜜蜂通过跳舞来传递特别丰饶的花朵的位置。这一行为本身将我们联系在一起。\n\
  \n那么，推荐系统就是这种交换的更抽象的版本。在这些系统中，我们的网络行为被算法聚合，然后经过处理和平均，再吐出来，创造出强加在他人身上的消费模板。它以加速为名，实际上却阻碍了那种文化的有机发展，转而优先考虑扁平化和相同性，即跨越数字平台网络中最易传输的美学。从某种意义上说，这本书是尝试从推荐系统中夺回推荐。我们应该更多地谈论我们喜欢的事，共同体验它们，并建立我们自己审慎的喜好收藏。不是为了微调算法，而是为了我们集体的满足感。\n\
  \n毕竟，推荐事物是一项专业的人类工作。有人致力于研究我们应该接触什么种文化以及我们可能欣赏什么，根据时刻调整他们的方法，并扩展被视为有品味之物的边界。你可能会在精品店、艺术博物馆、广播电台，或电影院的幕后找到他们。这些专业的推荐者被称为“策展人”（curators）。他们确保接触到的是值得关注的事物。他们履行语境化的劳动，并向我们介绍新事物，给予我们足够的挑战，使我们避免同质化。他们引导我们的消费。虽然这个词在互联网上可能被滥用，但我们真正需要的是更多的策展——即个人品味的培养和运用。\n\
  \n\n\n\n策展始于责任。\n\n根据一本 1875 年的词典，`curatore`一词的词源祖是指古罗马“公共官员”的术语，这些职位早于公元前 27 年开始执政的奥古斯塔皇帝。他们管理着城市维护的各个方面：有负责台比伯河的\
  \ `curatores`、食品采购、将水引向城市的输水道，以及举办公共赛事的官员。在拉丁语中，`curare` 意味着照顾，而 `curatio` 则表示关注和管理。在几个世纪以后，这个词的含义变得不那么平庸而更具精神性，但仍与照料有关。到\
  \ 14 世纪，名词 `curate` 指的是担任宗教指导工作的人。在 1662 年的英文版《公祷文书》中，`curate` 是教区的副牧师，引导他的教徒并照顾他们灵魂的“牧养”（cure，即照料）。至少从\
  \ 19 世纪中叶以来，`curator` 特指博物馆及其收藏品的经理，无论是艺术品还是历史文物——它是物品的管家，而非人。\n\n## 明星策展人的兴起\n\n\
  这个词的词源暗示了策展的重要性，它不仅是一种消费行为、品味展示，甚至是自我定义的手段，更是对文化的照料，是一个严谨且持续的过程。20 世纪后半叶出现了明星策展人的兴起，他们是强大的品味引领者，他们的选择影响了时代的集体口味。从\
  \ 1932 年开始，菲利普·约翰逊（Philip Johnson）作为现代博物馆的第一任建筑策展（该部门也得到了他家族财富的资助），他是推广设计设计学的人物之一。通过在博物馆空间内展示路德维希·密斯·凡·罗哈（Ludwig\
  \ Mies van der Rohe）等人的冷峻工业家具（这些家具最初看起来令人震惊），约翰逊逐渐让它们变得易于接受。\n\n20 世纪 60 年代，出生于比利利的亨利·盖尔德扎勒（Henry\
  \ Geldzahler）在大都会博物馆担任美国艺术策展人，逐渐关注活跃艺术家，这在当时的这类机构中是罕见的。盖尔德扎勒利用他的职位支持波普艺术期的艺术家，包括安迪·沃霍尔（Andy\
  \ Warhol）和大卫·霍克尼（David Hockney，他的密友），以及像罗伯特·劳森伯格（Robert Rauschenberg）和贾斯珀·约翰斯（Jasper\
  \ Johns）这样的艺术家。（策展工作总是带有某种个人色彩，但盖尔德扎勒做得比大多数人都多。）波普艺术俗艳和平庸的特质最初震惊了观众，但策展人帮助将其语境化，坚持其重要性，直到盖尔德扎勒在\
  \ 1977 年离开大都会博物馆时，这场运动已被广泛接受为艺术史的一部分。\n\n正如博物馆研究学者布鲁斯·阿尔舒勒（Bruce Altshuler）在他 1994\
  \ 年的著作《展览中的先锋》中所说，那几十年经历了“策展人作为创造者的兴起”。在 20 世纪末 21 世纪初，我们看到汉斯·乌尔里希·奥布斯特（Hans Ulrich\
  \ Obrist）和卡罗琳·克里斯托夫-巴尔吉耶夫（Carolyn Christov-Bakargiev）等明星策展人的出现。他们像无任外交官一样在国际范围内工作，进驻不同的博物馆或画廊，组织既反映他们个人感性又反映当下的的展览。策展实践成为了一种在国际范围内主张和恢复可见性的策略。尼日利亚策展人奥奎维·恩韦佐尔（Okwui\
  \ Enwezor）组织了大型展览，如 1989 年的“地球魔术师”和 2002 年的“文献展”（一项每五年举行一次的德国当代艺术调查）。在展览中，恩韦佐尔将来自被忽视国家和背景的艺术家与西方艺术界已经成名的名字放在一起，为当代艺术作为全球思想交流提供了强有力的论证——德国的安塞尔姆·基费尔（Anselm\
  \ Kiefer）与中国的黄永平以及澳大利亚原住民艺术家约翰·马恩德朱尔（John Mawurndjul）并列。\n\n## 策展 vs 推荐算法\n\n在某种意义上，个人明星策展人是推荐算法对立面：他们利用所有的知识、专业知识和经验来决定向我们展示什么以及如何展示，并带有极度的敏感性和人关怀。考虑到他们职业的范围——这确实是世界上最酷的工作之一——策展人的形象已成为一个迷人的原型和一个他人渴望攀附的标签，这并不意外。甚至机器也试图成为策展人。\n\
  \n从 21 世纪 10 年代初开始并持续了十年，至今仍没有停止迹象，`curated`（策划过的）一词变得无处不在。这个曾经仅由专家和学者使用的奥奥术语，现在被滥用于\
  \ Instagram 的帖子网格、化妆品色板和时尚品牌配件上。以下是我观察到的关于“策展”的一些过度用法：\n- 一位网红“策划”她为创作赞助内容的公司，或“策划”活动的贵宾名单。\n\
  - 一位餐厅老板“策划”酒吧菜单，或一个食品市场“策划”占据摊位的商户。\n- 酒店“策划”其客房选择，仿佛每间房间都是其独特的体验。\n- 流媒体服务“策划”其提供的内容。\n\
  - 根据美国公共广播电台，一位音乐家甚至“策划了一个不寻常的职业”。\n\n社交网络时代，我们都必须“策划”自己的身份，即在个人页面上选择哪些内容最能代表我们。在\
  \ 2012 年的一次讲座中，互联网艺术家乔纳森·哈里斯（Jonathan Harris）总结了这种转变：“策展正在取代创作成为自我表达的模式。”与其说是一种投入的照料，不如说它更是一种自恋行为。\n\
  \n## “策展”一词的语义饱和\n\n这个词的氛围是向往的，旨在赋予一种意义感和质感，就像白兰地瓶上的“特级”标记。你难道不想想要一个经过策划的东西，而不是一个没经过策划的吗？最近，这个词仅仅表示在选项中进行选择，一个由具有某种专业知识和意图的人做出的决定。然而，算法推荐也经常被描述为“策划”信息流，尽管背后并没有意识。当我写这些文字时，我的手机提供了一个自动“策划”的相库，将它们分类为理论上有意义且具有吸引力的精选。（根据什么标准，它说明。）这个词的语义饱和之所以发生，是因为算法的普及使得事物之间的选择变成了一种新奇。当我们不需要自己选择时，这样做（或知道是别人这样做的）就变成了一种奢侈，尽管是可怜的奢侈。如果我们从这种现代定义推测，在信息流时代之前，有线电视节目到收电里的歌曲，一切都应该是经过策划的。\n\
  \n在这个词过度使用的过程中，迷失了策展人本身的形象——一个有责任做出明智选择、照料其职责范围内材料的人。如果你在我高中时问我想对生活做什么，我会说我想成为这样的策展人。我的渴望灵感来自于现代艺术史书籍，以及对曼哈顿现代博物馆的访问，我每年会从康涅狄格州乘坐通勤火车去。我参加过奥尔里奇当代艺术博物馆的一个课后计划，那里的全职策展人会向学生介绍他们正在合作组织展览和完成委托的艺术家。\n\
  \n\n\n\n在高中时期，我曾在某种程度上想象过，策展人的角色主要是是决定物品在白色画廊墙面上的位置，就像是室内装饰的极端版本。我原以为他们会精确地选择每幅画及其邻近艺术品的位置，设计观众体验展览作品的顺序。在某种意义上，我是对的——安排艺术品确实是工作的一大部分。但这只是它最公开的一面。大学期间，当我在波士顿美术博物馆的当代部进行暑期实习时，我意识到这项工作要深得多。它也是一项具有学术性的、近乎苦行者的工作，就像司职的策展人那样。在那些布局决策的背后，是数百小时的研究、写作、思考和维护。这并不一定光鲜：我实习的大部分时间都在更新一份物理艺术品储存在位置的卡片目录。但我最自豪的时刻发生在多年后，当我意识到我为一张巨大的菲利普·古斯顿（Philip\
  \ Guston）画作撰写的几行标签文字已安装在博物馆里，并看到好奇的游客走近标签阅读我的文字时。我以一种微小的方式参与了那个公共策展过程，并负责告诉他们关于古斯顿和那幅画他们需要了解的信息。\n\
  \n互联网可能策展过剩，但策展也远不足，从内容的长期维护、组织和语境化的角度来看——所有这些过程都被外包给了算法。为了确定策展人在“过滤世界”（Filterworld）的算法僵局中的角色，我与帕奥拉·安东内利（Paola\
  \ Antonelli）见了面。她于 1994 年加入纽约现代博物馆（MoMA），现在是其建筑与设计部高级策展人，同时也是研发总监。安东内利是我们时代最具创新性的策展人之一，我很幸运能认识她十多年之久，并就艺术、设计、技术和文化未来进行着漫漫的交谈。\n\
  \n## 帕奥拉·安东内利的愿景\n\n安东内利出生于意大利的丁丁尼亚岛，在米兰学习建筑。进入 MoMA 后，她领导了博物馆设计收藏的扩张工作，这项工作始于菲利普·约翰逊（Philip\
  \ Johnson）时代，她收集了一系列不寻常的物体，这些物体初看可能并不属于博物馆。在 2010 年，安东内利的带领下，博物馆收购了`@`符号（因为属于公共领域，它是免费的），并在\
  \ 2012 年收购了一批代表该媒介历史的十四款视频游戏，包括`Tetris`（俄罗斯方块）、`Myst`和`The Sims`（模拟人生）。\n\n安东内利认为世界充满了设计，从街道上的消防栓栓到你打字用的键盘。她的策展实践将这些日常物品重新语境化，并突显了它们创作中的天才之处。在她\
  \ 2011 年的“跟我对话”（Talk to Me）展览中，她收集了探讨“人与物之间的交流”的作品。她写道：“物在与我们说话。”展览涵盖了从可以编写`code`的物理方块，到一个为无法体验经痛的人模拟经痛的设备，以及一台\
  \ 1999 年的真实的纽约地铁卡售卖机。该展览并非以现代艺术展通常的极简主义模式布置，而是几乎像一家令人兴奋的零售商店，作品陈列在地面中央亮橙色的货架模块上。\n\
  \n我记得第一次遇到它时，被那种布局的活力所震撼。安东内利对物体进行的三维拼贴唤起了一个互动技术的世界，其中数字和物理设备不断调解着我们的人际关系。安东内利以一种不加修饰却严谨的方式安排她的选品，其中编码了一整套哲学。事实上，算法推送完全可以作为该展览中的物体存在。\n\
  \n## MoMA 的朝圣\n\n在约定的日子，我乘坐阿特拉斯克（Amtrak）火车从华盛顿特区来到纽约，穿过中哈顿，那是我青少年时期去 MoMA 时走过的同样的街区，路过熟悉的公共雕塑和人行道上的清真饭车。安东内利对物体进行的三维拼贴唤起了一个互动技术的世界，其中数字和物理设备不断调解着我们的人际关系。安东内利以一种不加修饰却严谨的方式安排她的选品，其中编码了一整套哲学。事实上，算法推送完全可以作为该展览中的物体存在。\n\
