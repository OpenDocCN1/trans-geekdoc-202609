  \ Johnson）时代，她收集了一系列不寻常的物体，这些物体初看可能并不属于博物馆。在 2010 年，安东内利的带领下，博物馆收购了`@`符号（因为属于公共领域，它是免费的），并在\
  \ 2012 年收购了一批代表该媒介历史的十四款视频游戏，包括`Tetris`（俄罗斯方块）、`Myst`和`The Sims`（模拟人生）。\n\n安东内利认为世界充满了设计，从街道上的消防栓到你打字用的键盘。她的策展实践将这些日常物品重新语境化，并突显了它们创作中的天才之处。在她\
  \ 2011 年的“跟我对话”（Talk to Me）展览中，她收集了探讨“人与物之间的交流”的作品。她写道：“物在与我们说话。”展览涵盖了从可以编写`code`的物理方块，到一个为无法体验经痛的人模拟经痛的设备，以及一台\
  \ 1999 年的真实的纽约地铁卡售卖机。该展览并非以现代艺术展通常的极简主义模式布置，而是几乎像一家令人兴奋的零售商店，作品陈列在地面中央亮橙色的货架模块上。\n\
  \n我记得第一次遇到它时，被那种布局的活力所震撼。安东内利对物体进行的三维拼贴唤起了一个互动技术的世界，其中数字和物理设备不断调解着我们的人际关系。安东内利以一种不加修饰却严谨的方式安排她的选品，其中编码了一整套哲学。事实上，算法推送完全可以作为该展览中的物体存在。\n\
  \n## 向 MoMA 的朝圣\n\n在约定的日子，我乘坐阿特拉斯克（Amtrak）火车从华单顿特区来到纽约，穿过中哈顿，那是我青少年时期去 MoMA 时走过的同样的街区，路过熟悉的公共雕塑和人行道上的清真饭车。\n\
  \n*(注：原文中后续重复的段落已按要求剔除)*\n\n\n\n这三件作品共同在画廊中构成了一幅图景，无论在视觉还是概念上都令人震撼。每一件作品在媒介和主题上都是独一无二的，但它们共享某种基调，这是安东内利（Antonelli）通过将它们放在一起所营造出的。也许是一种共同的方法，从表面将我们的环境翻转过来，将熟悉的视角反转到令人不适的程度。它们并不是像\
  \ `Spotify` 电台播放列表那样相互互补或流畅地流动，而是相互对比和冲突，挖掘出每件作品的新侧面。画廊的那个角落通过引目的并置，让起了诗人伊西多尔·路西恩·杜卡斯（Isidore\
  \ Lucien Ducasse）著名的超现实主义语句：“正如解剖台上缝纫机与雨伞偶然相遇般美丽。”不同物体之间的碰撞总是能带来一种新的美。“永久收藏和画廊策展的内容包含着非算法的特性，”安东内利说道。\n\
  \n当她权威地穿过画廊时，安东内利注意到各种展示中的细微缺陷。在其中一个房间里，墙上的标签看起来太破旧、卷角了。在另一个房间里，投影仪没有按预期投射在展览标题上以完成其字体。然后她发现一个展厅缺少了安保人员——考虑到这些作品是互动视频游戏，安保人员尤为重要。她在手机上向员工口述短信，一名助手冲过去解决问题。为了赢得观众的信任，每一个细节都必须是正确的。\n\
  \n策展的缓慢过程与互联网特征的无语境性、快速和转瞬即逝背道而驰。“当你想社交媒体时，它是这种白噪音，是死空间，”安东内利说。（这是对整个 `Filterworld`\
  \ 的恰当描述，那里没有什么能脱颖而出。）“这就是算法变成你的对手的地方，”她继续说道。算法推送破坏了策展的并置，使得解释广大的文化领域变得更加困难，难以弄清哪些主题将事物联系在一起，哪些方面又将它们隔离开。我们拥有的不是通过体验进行的有效进展，而是一个日益难以区分的泥潭。正如任何用过互联网的人都知道，通过推送进行学习是很的。从理解积累的意义上说，学习总是发生在平台之外，当你有时间为自己整合信息时。即便如此，正如我的艺术家朋友哈莉·贝特曼（Hallie\
  \ Bateman）所说，在互联网上组织材料就像在潮汐来临时海滩上筑沙堡——你精心收集的东西几乎避免地会被破坏，就像当我弄乱我的 `Spotify` 界面后一样。\n\
  \n像 `MoMA` 这样的收藏至关重要，因为它是我们这个时代的持久文献。世界上有太多的物体、内容碎片和文物，以至于在消费什么和保留什么方面必须做出选择。每位策展人都带入了自己的观点。人类共同建立了一份关于我们文化中重要事物的记录，这通常被称为正典（canon）。正典可以扩张和变化，拓宽以涵盖新思想，但它的存在是不可避免的。它不仅仅基于流行程度。“有些策展人说，我不再想要正典了，”安东内利说，“但你知道吗？我们无法逃避它，所以不如拥抱它。”在策展人的帮助下，正典将奇异、不安、局促或震惊的事物与直观的美感或吸引力的事物并蓄。它们不断促使我们重新考虑特定物体或审美体验的意义。\n\
  \n\n\n在那时，我对 Cavalconte 一无无所知。但我们在车里听到的是他那平滑、甜美单调的声音，宛如台球桌上的绿色毛毡，为我们在挡风玻璃外的某个开辟了一条隧道，通向他自己的音乐宇宙。那周，他以“剩余菜肴”为主题构建了他的节目，反映了感恩节的背景。他创建了一个由翻唱曲和\
  \ B 面歌曲组成的列表，这些录音可能无法反映一位音乐家的全部作品，但正因如此而更有趣，是一份深度曲目的合集。但随着我们开车，DJ 不断地闲谈，我们开始注意到了一种更深层的结构。Cavalconte\
  \ 创作了一种“花链”，由一位艺术家翻唱另一位：乐队 `Death Cab for Cutie` 翻唱了 `Cat Power` 的《Metal Heart》，然后\
  \ `Cat Power` 翻唱了 `Bob Dylan` 的《Stuck Inside of Mobile with the Memphis Blues Again》，接着\
  \ `Bob Dylan` 翻唱了 `Joni Mitchell` 的《Big Yellow Taxi》。翻唱的并置揭示了歌手歌曲领域内部的影响纽带。每位艺术家都是对方的仰慕者，并挖掘出歌曲中特定的特质，同时也暗示了艺术家自身的原始音乐感性，比如\
  \ `Cat Power` 用她自己烟熏、讽刺的声音，突出了 `Dylan` 歌声中被低估的旋律和动力。特别是由于我当时正处于算法清理期，极度渴望推荐，这给我留下了深刻的印象。\n\
  \n就像 Paola Antonelli 在纽约现代艺术博物馆（MoMA）陈列艺术品一样，Cavalconte 歌曲的方式传达了关于它们的某些信息，构建出一幅更广泛的文化蓝图。DJ\
  \ 也是策展人——在列表背后，我们可以感受到汇编它所需的所需的深厚专业知识和敏感度。当 `Spotify` 切换到自动电台模式时，我会感到沮丧，因为它组合的曲目之间除了流派或声音相似性外没有任何联系。相比之下，听\
  \ Cavalconte 的节目，我总能感受到背后的人类智慧，这使其具有无限吸引力。就像展览中每个物品的标签一样，Cavalconte 也会定期停顿，提供一些音乐历史或他对某组特定歌曲的个人观点。尽管这个角色如今可能没有那么引人注目（部分由于算法的入侵），但\
  \ DJ 也在帮助听众完成发现新文化的至关重要的过程。\n\n在我写这本书的过程中，独立电台 DJ 在我脑海中脱颖而出，成为非算法文化传播的理想典范。即使在互联网时代之前，电台也播送全天候的音乐和信息流，所有的都是手工挑选的。当通过真实的无线电波接收时，它们也针对特定的地理区域（电波无法无限传输），并且以实时形式存在，对与听众共享的背景做出反应——无论是天气、时间还是地区方言。这样描述，它听起来几乎是乌托邦的，但它也是平庸的：人们通过我们的扬声器向我们说话的奇迹已变得寻常，尽管它曾像机器排序的内容的数字馈流一样稀奇。但当受信赖电台的\
  \ DJ 播放某些歌曲时，我们仍然倾向于听得更仔细，关注的时间也比我们可以立即跳到下一个推荐时要长得多。\n\n就像艺术展一样，电台可以挑战我们对可能性的认知。这发生在我高三那年的一个晚上。我的方向感糟糕，经常迷失在穿过家乡山丘的没有路灯的道路上。深夜从朋友家回来的路上，我会听当地的电台\
  \ `WPKN`，这是一家由志愿者 DJ 组成员工的非营利电台，源于布里奇福特大学（`University of Bridgeport`）。《纽约人》曾带有半讽刺地称其为“世界上最伟电台”；我很幸运地在它的覆盖范围内长大。2005\
  \ 年左右的周六晚上，一位女性主持爵士和蓝调节目；我不知道她的名字，但我熟悉了她的声音，纤细而沙哑，经常消失在沉默中，带着独立电台特有的杂乱中断。我并不是爵士或蓝调的特定粉丝，随后的很多年里也不是，但\
  \ `WPKN` 的信号总是很清晰，播放的音乐比商业电台上的有趣得多。\n\n那天晚上，一首爵士乐曲以一系列密集的钢琴和弦和鼓点后拍开始，伴随着低提琴的砰砰声。然后，一段单支管乐旋律在背景中划过，像流星，又像在在晴空中盘旋的鸟。尽管从结构上说它是标准的爵士四重奏，但它与我以前听过的任何东西都不同。随着我开车，歌曲不断展开，每当我认为它可能会停止时，它就冲刺向前，穿过节奏平静的时期，然后进入不和谐的管乐独奏，这些独奏偶尔进入可辨认的旋律。它持续了十三多分钟，一直带我回到了车道。当歌曲终于平息时，无线电里的女性解释说这是\
  \ `John Coltrane` 1961 年录制的《My Favorite Things》，是完整版，而不是作为单曲热销的短得电台编辑版。（我甚至不知道这首由\
  \ `Rodgers and Hammerstein` 在 1959 年创作的原曲。）在那曲中，`Coltrane` 奏了一支 `Miles Davis` 在前一年为他买的高音萨克斯管，这在当时的爵士乐中是一种罕见的乐器。随着这段简短但富有信息量的注释，DJ\
  \ 开启了她的下一组歌曲。我坐在驾驶位上，若若震惊。\n\n从那以后，那段录音一直是我最喜欢的音乐之一。每个人都有类似的故事，一件艺术品——绘画、音乐、电影——如何令他们措手不及，让他们在瞬间发生了无法言喻的改变。但如果没有策展人的帮助和电台等既有文化渠道的背景，我们不太可能有这些遭遇。\n\
  \n如果同一首 `Coltrane` 的歌曲在 `Spotify` 上自动播放，我可能从字面意义上听过它，但我不会像当它在电台上播放时那样去听它。`Spotify`\
  \ 的推荐系统从未为我建议过这么长的歌曲，也许因为那种时间上的投入往往会导致跳过曲目，这在算法标准中是一个负面指标。（回想流媒体时代歌曲长度的缩短。）我也不会学到任何关于\
  \ `Coltrane` 或他的影响的知识。`Spotify` 虽然了艺术家的长传记并开发自己的手工列表，但它的界面使得在不离开应用直接去 Google 搜索的情况下，很难找到关于特定专辑的任何信息，甚至是重新发行的原始录制日期，更不用说哪位音乐家演奏哪种乐器了。与\
  \ CD 盒或黑胶折叠封面不同，这里没有反映艺术家审美感性的内页。\n\n算法是人类 DJ 的糟糕替代品。也许 `Spotify` 意识到了这一点；2023 年，它推出了一个\
  \ AI DJ，可以间断向听众告知算法列表中的歌曲名称，但使用它感觉像是侮辱而非创新。这需要创造力。当我和 Jess 从感恩节开车回家时，我们完整听了 `Paul\
  \ Cavalconte` 在 `WFUV` 节目的三个小时。\n\n\n\nCavalconte 当 DJ 已经三十多年了，看起来完全如你想象中那样：带点书呆气，高额头上顶着一圈发际，眼睛大大的，带着灿烂的笑容，散发着富有感染力的热情。他住在距离\
  \ `WFUV` 直播室仅十分钟车程的地方，就在他长大的家里；在那里，他将地下室公寓变成了自己的音频工作室，周围环绕着数以千计的唱片架。他是独生子，父母年龄偏大，因此他最早接触音乐的方式是通过他们的古典音乐和士乐唱片收藏，在他入学后，这种混合风格加入了摇滚的元素。他\
  \ 20 世纪 80 年代初就读`福特汉大学`，并在电台担任志愿者，当时的电台完全由学生志愿者运营。他告诉我，在他成长的 FM 广播的黄金时期，电台 DJ “就像是一种文化仲裁者”，他用那种我在电台里听过的、圆滑且略带纽约口音的嗓对我说道。\n\
  \nCavalconte 在 `WLIR` 获得了他的第一份电台兼职工作，那是一家位于长岛、极具影响力的进步摇滚电台。该电台以允许 DJ 在直播中采用更随意的语气，并播放更多冷门的专辑曲目而不仅仅是广播单曲而闻名。`WLIR`\
  \ 较早引入了 80 年代兴起的新音乐流派，包括后朋克（post-punk，它是 70 年代中期朋克略具旋律感的继承者，拥有如 `B-52s` 等乐队）和新波（No\
  \ Wave，一种源自纽约市艺术界、更加嘈杂且无调性的运动）。该电台播放的音乐至今仍挑战着主流审美。它的目的是保持在文化的边缘，并为听众提供一个策展渠道；该电台甚至建立了自己的供应链，以确保从英国获取最新唱片的当日送达。离开\
  \ `WLIR` 之后，Cavalconte 的职业横跨了纽约的各大电台：`WNEW-AM`、`WNCN`、`Q104.3`、`CD101.9`、`WRXP`，所有名字都有自己的格式、个性以及我们现在所说的品牌。\n\
  \nCavalconte 也会主持古典音乐和士乐节目，承担这份工作所需的任何格式。他在 2013 年回到 `WFUV`，并在 2015 年开始了 `Cavalcade`节目。2017\
  \ 年，他还接管了 `WNYC` 的周六晚上和周日下午时段，这些时段曾由 DJ `Jonathan Schwartz` 占据，他曾通过取材 20 世纪《美国伟大歌曲谱》的漫谈节目，直到他在一场骚扰丑闻中离开了该电台。这是一个标志性的时段，在纽约居民准备外出或在新周开始前放松时，直播着一种这座城市的实时氛围——这是一份沉重的策展责任。\n\
  \nCavalconte 说，DJ 挑选的特定歌曲通过穿插其中的闲聊联系在一起，加上他们个人的声音——最好听起来像“酷酷的老师”，“这会让你被吸引那么一点，让你的脚趾没入反文化的深水区。“这在某种程度上是一种教化；它非常具有颠覆性，”他说。随着他的话语，Cavalconte\
  \ 的声音进入了完全的电电模式，语速慢了下来，字字清晰。我脖子后的毛竖竖地了起来。“当我长大时，”他说，“那些 DJ 都有这种磁性的声音；听起来真的非常性感。我想去他或她带带我去的地方——那个灯光昏暗、烟灰缸里燃着香烟的世界。你想象一下电播室的这种深夜氛围，仅仅是一个人的音调就能带你到达那里。”他继续说道，“DJ\
  \ 是原始影响者群体的一部分，我们曾非常嫉妒这些人能拿钱做这些事——穿得像个落魄，喝免费的啤酒，听免费的音乐。”\n\n就像博物馆策展一样，DJ 培养了一种信任的氛围，消费者可以在其中吸收新文化。“如果那个声音好听的男人引你进入圈子，也许会发生神奇的事情，”Cavalconte\
  \ 说，“现在需要这种陪伴。“策展现在就是陪伴。”这句话让我思考，算法推送是如何缺乏陪伴的：它们只是呈现出一段内容，然后让你独自地与它相处，直到你失去耐心并决定跳到下一首歌或视频。\n\
  \n在独立无线电台上的 DJ 演出是一场整体的沉浸体验，由他人为你规划好，这种体验深受策展者品味和知识的影响。根据 Cavalconte 的说法，音乐的选择构成了一个“更大的叙事概念”。当然，更商业化的电台必须遵循公司音乐列表和严格歌曲配额的指示，但对于他的每周\
  \ `WFUV` 节目，Cavalconte 只是跨越时代和流派探索他自己的音乐品味——美国标准曲、民谣、士乐、摇滚、流行、嘻哈——这是几十年研究和实践积累而成的。“品味是一个更大的参考系；它是一系列你一直有意识或无意识地做出的复杂的价值判断，”他说。推荐算法是策展者的一种竞争对手，就像民间故事中`约翰·亨利`为了修建铁路隧道而赛跑的蒸汽机一样。“这个‘东西’——算法——现在竟然变成了你的朋友、你的品味仲裁者，这太恶心了。我不想参与其中任何部分；我要真人，一个值得投入的人，”Cavalconte\
  \ 说。\n\n尽管如此，数字过滤机器中仍存在着某种比喻。“我的方法是算法化的，但它是从我自己的头脑和经验框架中生成的，”Cavalconte 解释道，“我试着尽可能自由联想，把自己放在心理治疗师的沙发上玩那个游戏。如果是些愚蠢的东西，就顺其自然。”在他的感恩节节目中，这表现为加入了几首\
  \ `Taylor Swift` 的歌曲。Cavalconte 说，在更经典的音乐人和翻唱曲中，选择这位当代流行星是一个“讽刺的笔触”（尝试让 `Spotify`\
  \ 算法提供讽刺或幽默。）\n\n人与人之间的推荐是双向交流：策展者必须考虑他们传递的内容价值，而消费者必须保持开放心态，即使歌曲没有立即吸引力，也要放弃跳过的选项。“你必须让某人认同没有控制权这个想法。事实上，整个重点在于你顺从控制权的丧失，”Cavalconte\
  \ 说。\n\n\n\n\n```markdown\n由于缺乏策展带来的摩擦力，文化往往会变得越来越同质化。Cavalconte 在算法推送时代的音乐中观察到了这种现象——他从专业和个人两个领域都在关注这一点。“技术让人们能够更即时地接触音乐，并以一种快节奏的方式‘试听’音乐，而不是那种坐下来听完一张专辑、体验专辑信息如何以平实的、小说化的方式一首一尾地展开的纪律，”他说。单曲的重要性已经超过了专辑，而专辑已变成了冗余材料的松散集合，更多是作为情绪背景，而非简洁的陈述。与黑胶唱片专辑或磁带不同，流媒体格式没有施加任何时间限制；曲目越多，算法推荐的素材和基于流播放的版税就越广泛。\n\
  \n以泰勒·斯威夫（Taylor Swift）的作品为例。她在 2020 年到 2022 年间发布了三张新专辑，并重录了她的两个早期专辑，了 Spotify Spotify\
  \ 执行官 `Daniel Ek` 的指令：当代音乐人必须不断发布新音乐。（在 2020 年，`Ek` 表示，艺术家每隔几年发布一张专辑是不够的；他们必须与粉丝保持“持续的互动”。）尽管在\
  \ 2014 年，斯威夫特因为觉得 Spotify 降低了她的作品价值而下架了她的音乐，但她最终接受了这种无尽的内容流。那两张原始专辑 `Folklore` 和\
  \ `Evermore` 是一对低沉的民谣唱片，几乎无法区分。2022 年的 `Midnights` 是一张充满冷峻、反思、重合成器风格曲目的专辑，并附带了其自己的七首类似的\
  \ B 面曲。听众得到了更多音乐，但更多的是老调重弹。（Drake，另一位世界最大的流行巨星之一，在那几年里也发布了一系列混音带，包括 2022 年的 `Honestly,\
  \ Nevermind,`，这张专辑让这位歌手的狂热缩减为寥寥的、重复的、在环境合成器洗礼下的自恋式焦虑。）\n\n就像 Instagram 上极简主义室内设计的通用设计审美一样，音乐在算法推送的压力下也陷入了同质化的风格。“一切听起来都像一个循环，声音是单一的。节奏比旋律更具主导性，”Cavalconte\
  \ 说，并引用了比莉·艾利什（Billie Eilish）的“卧室流行”，她是完全出现在“滤世界”时代的明星之一。TikTok 视频的简短和即时跳过性将音乐艺术压缩成了几秒钟的自包含片段，而这就是一个“声音”捕捉用户注意力的所有时间。持续几分钟的发展并不是一个选项。\n\
  \n“当代音乐中几乎不存在关键性的转换，因为那是不再起作用的钩子（hook），”Cavalconte 说。他哼了几惠特妮·休斯顿（Whitney Houston）《I\
  \ Wanna Dance with Somebody》的几句，那首歌有一个高潮部分的转调。这种技术需要一种音乐叙事来建立旋律对比，有清晰的之前和之后。它不能被简化为一个声音片段。“那种悬念的营造——现在什么悬念都没有了。一切都必须在前三十秒内发生，”他说。\n\
  \n这种观察不仅仅是这位 DJ 的直觉。一位研究人员发现，从 1960 年到 1990 年的 `Billboard Hot 100` 榜，四分之一的歌曲包含转调，但\
  \ 2010 年代只有一首歌如此。加州大学洛杉矶分校的数据科学家计算出，2020 年歌曲的平均长度比 1995 年短，而且这种长度正朝着更短的方向发展。音乐学家\
  \ `Nate Sloan` 认为，这种集体缩短是由流媒体服务的激励机制引起的——例如，`Spotify` 将收听 30 秒计为一次“播放”。延长时长并没有财务收益。\n\
  \n并不是说今天的音乐比几十年前差，或者艺术家们没有在努力。（作为环境音乐的忠实粉丝，我个人很欣赏这种氛围的特质。）但显而易见，文化的默认形式在很大程度上取决于平台的需求，也取决于艺术家的创造力。寻找人类策展者，而不是跟随推送，可以帮助我们打破这种自我加强的循环。\n\
  \n## 策展的作用\n\n“这就是我的追求——让它变得激进，变得有趣，”Cavalconte 说。他以十五世纪画家波提切利（Sandro Botticelli）举例。波提切利在\
  \ 15 世纪 80 年代创作了《维纳斯的诞生》，女神从海洋中浮现。今天它是艺术史上最著名的画作之一，但在当时它是震惊且奇特的，是一张你在 Instagram\
  \ 上不会点击‘点赞’的图像。品味是一种想象力的练习，其目的是让人不舒服。\n\n## 在线复兴策展\n\n策展是一个模拟过程，无法像社交网络推送那样被完全自动化或规模化。它最终归结为人类对事物的核准、选择和安排。但并不是说策展不能像博物馆展览或广播节目那样存在于在线。既然我们已经看到了\
  \ 2010 年代后半部分算法推送主导文化的扁平化影响，企业家和设计师正在建立新的数字平台，将策展放在首位并淡化自动化推荐。与 Facebook 和 Spotify\
  \ 相比，它们小得多，既是出于刻，也是出于无奈。\n\n`Criterion Collection` 是一家始于 1984 年的公司，目标是将世界范围内重要的当代电影经典汇集在一起，然后以各种格式（录像带、CD-ROM\
  \ 和 DVD）进行授权和出版。Criterion 成为电影策展最知名且最重要的品牌之一，就像是电影界的“米其林指南”，但可以在家里消费。它建立了一个拥有一千多作品的库，收集了独立电影热门片和艺术电影，涵盖了从让·科陶（Jean\
  \ Cocteau）到黑泽明（Akira Kurosawa）、斯派克·李（Spike Lee）以及阿尔丰索··库亚隆（Alfonso Cuarón）等导演的作品。几十年来，它从一种媒体格式移动到另一种，保留了那些可能被技术变革所冲掉的艺术品。\n\
  ```\n\n\n\n\n2008 年，Criterion 开始将其产品转向线上，最初通过一个名为 `Mubi` 的流媒体服务，随后通过 `Hulu`，最后通过\
  \ `FilmStruck`——这是由 Turner Classic Movies 创建的另一个订阅制流媒体服务。它在 `Kanopy` 上也可用，用户可以通过图书馆或其他机构访问该服务。但在\
  \ 2018 年，`FilmStruck` 被其所有者华纳媒体（Warner Media）关闭。《纽约时报》将这一消息描述为“毁灭性的”，并列出了该服务消失前最值得观看的作品清单。这促使\
  \ Criterion 启动了自己名为 `Criterion Channel` 的数字流媒体服务。如今，Criterion 可以在任何连接互联网的地方获取，它就像是\
  \ `Netflix` 的超深度精选版。该片库配备了丰富的观看指南、导演的历史访谈、评论人的视频论文以及具有时效性的电影精选。这些定制化的推荐和背景材料使其与\
  \ `Netflix` 的算法驱动主页区分开来。\n\n我与 Penelope Bartlett 聊了聊，她直到 2022 年一直担任 `Criterion Channel`\
  \ 的节目总监。Bartlett 在 2016 年于电影节工作并担任过制片后，成为 Criterion 的策展人——那些决定展示哪些电影的人，是另一种形式的策展人。她说，这份工作“非常类似于艺术电影院策展人所做的工作：选择主题性节目，将电影组合成有趣、有吸引力的包”。这种形式可以表现为对特定导演或特定演员的回顾，展现他们的职业生涯，或者安排特别出色的双片放映。\n\
  \n“与某种算法相比，这是由 Criterion Collection 员工经过深思熟虑策划的，”Bartlett 说道。即使有算法推荐的帮助，在线内容的广度也可能导致一种选择恐症。“人们往往会被流媒体领域海量的选择所淹没。我们花了好几个小时来决定看什么，”Bartlett\
  \ 继续说道。Criterion 的节目编排“只是试图帮助人们以令人兴奋的方式享受并发现电影，而且这种方式也感觉是容易掌握的，是你在一个晚上就能看完的内容。”\n\
  \nBartlett 将她的角色描述为一种尝试“牵着人们的手”。“有时人们会对那些制作过三十部电影的电影人感到有些畏惧。你真的不知道从哪里开始；最后因为不确定切入点在哪里，导致一部电影都没看，”她说。基于某部电影观看次数次数的算法推荐可能并非最佳选择。Criterion\
  \ 的意义超越了肤浅的推荐：“这不仅仅是我应该看什么，而是我为什么要看它，以及还可以配合它还可以看什么。”Criterion 充当了某种内容认可印章，其标准不是取决于观众人数或销售额，而是由其员工策展人决定的纯粹艺术质量。\n\
  \nCriterion 帮助我发现了自己的电影感性。香港导演王家卫已成为我最喜欢的电影人之一，因为他流光溢彩的视觉美学以及叙事中那种缓慢、怀旧、浪漫的特质。我是在青少年时期在当地的\
  \ `Blockbuster` 外语片货架上第一次遇到他 2000 年的电影《花样年华》，那是在一个印有 `Criterion` 标志的 DVD 盒里。电影对世纪中期香港双重婚姻的酸心刻画，以及错过的爱缘（更不用说角色们吃外卖面汤的饮食习惯），从那时起令我记忆犹新。多亏了这家公司，以及一位匿名但非常令人感激的\
  \ `Blockbuster` 员工，我才接触到了王家卫的作品。从《花样年华》开始，我一路看到了他的早期电影《重庆森林》——一部关于忧郁警察的黑色幽默片，以及《2046》——一部比《花样年华》更显晦涩、带有科幻色彩的续集。\n\
  \n如果没有那次机缘般的 `Blockbuster` 发现，我可能在生命中那个成长期阶段完全错过王家卫的作品，因为我当时无法接触电影节或文艺复映院——但所有这些电影现在都可以在线。流媒体\
  \ `Criterion Channel` 将互联网的即时、跨地域访问性与图书馆或博物馆深度且负责任的策划结合在一起——兼了两者的优点，且没有无尽信息流的持续干扰。这是关于如果我们决定互联网*应该*如何运作的一种愿景。\n\
  \n## 在线为文化付费\n\n迈向更精选互联网的又一步，是更仔细地思考驱动我们所用平台的商业模式。关于互联网有一条格言，可能源于 2010 年 `MetaFilter`\
  \ 论坛的一条评论：“如果你不付费，你就不是客户；你是被售卖的产品。”当数字平台免费使用并通过广告盈利时，内容就被简化为吸引注意的手段。然而，当你直接为内容本身付费时，内容在经济上更具可持续性，并往往投入更多资源，这对创作者和消费者都是利好的。在\
  \ `Netflix` 和 `Spotify` 等流媒体服务上，用户支付订阅费以获取内容，但这些资金分散在平台的所有内容中——随着新订阅增长放缓，这两家公司都日益转向广告收入。\n\
  \n规模较小的流媒体服务提供了一种替代生态系统，在其中你可以订阅特定的精选内容并更好地支持其创作者。Criterion 是视频流媒体的一个选择，但也存在专注于英国电视、惊悚电影或动画的服务。`Idagio`\
  \ 是专门针对古典音乐的流媒体服务，于 2015 年推出作为一种“公平流媒体”，正如创始人 Till Janczukowicz 告诉我的那样——就像承诺向咖啡农提供非剥削交易的咖啡公司一样。`Spotify`\
  \ 根据超过三十秒的播放次数向艺术家和唱片公司付费，而 `Idagio` 托管的录音比普通流行歌曲长得多，它根据用户听某个特定标签的时间比例（精确到秒）来付费。例如，如果一个用户花了\
  \ 30%的时间听来自 `Deutsche Grammophon` 的录音，那么这个百年历史的德国古典音乐唱片公司就会该用户 30%的版税。根据原则，内容创作者从平台获得的报酬越直接、比例越高，其可持续性就越强。\n\
  \n过去几十年的互联网很大程度上建立在内容可以尽可能免费访问的基础上。在 20 世纪 90 年代和 21 世纪初，网站对公司来说似乎是一项微不足道的侧面支出，而非主流产品。然后，随着\
  \ `Google Search` 和 `AdSense` 的兴起，广告成为互联网主要的商业模式。由于流量越大意味着钱越多，限制访问是没有意义的。随着社交网络的出现，`Facebook`、`Twitter`\
  \ 和 `YouTube` 等公司通过算法流捕捉用户注意力并销售自己的广告，吸收了更多广告收入，迫使创作者和出版者去迎合系统。直到最近几年，我们才开始意识到出售注意力比出售内容本身更困难且更缺乏可持续性。直到\
  \ 2011 年 3 月，任何人都可以在网上阅读《纽约时报》。它实施严格付费墙并让读者为数字内容付费的曾被认为是有风险且不合常理的，但它现在是全球最成功的报业公司之一，拥有超过\
  \ 900 万数字订阅用户，因为它很早地拥抱了付费墙。虽然当在线文化需要直接付费时，看起来似乎更商品化了，但实际上，文化*应该*是产品，正如古典音乐在 `Idagio`\
  \ 上一样，而不是你的注意力。\n\n\n\nJanczukowicz 从传统的古典音乐界转向数字技术领域，是因为他看到自己爱的文化在互联网时代正在落后。作为一名德国制作人，Janczukowicz\
  \ 从五岁起开始弹钢琴，但逐渐转向撰写古典音乐、组织工作坊、制作录音以及管理著名的音乐家和指挥家。他曾与中国钢琴家张龙洋、日本指挥家小泽锐以及芬兰指挥家尤卡-佩卡·萨拉斯特等人合作。在引导他们的职业生涯的过程中，他注意到这些作品的呈现并没有达到应有的可获取性。“如果它们在数字空间中无法被检索，它们就会失去关联性，”Janczukowicz\
  \ 告诉我。他总结了 Idagio 的目标：“我们在这里不是为了建立一个流媒体服务。其背后的主要动力和使命是，我们如何利用技术来维护一种文化？”（“维护文化”正是\
  \ Filterworld 在其向最低公约数加速的竞赛中未能做到的。）\n\nJanczukowicz 认为，Spotify 的算法不可避免地将用户推向流行的流行音乐，而\
  \ Idagio 的建立是为了支持更小众的艺术创作。该服务是“内容完备的”，这意味着 Idagio 已经安排了超过两百万首曲目的许可协议，尽可能涵盖了历史上制作过的每一部古典音乐录音，包括二千五百个交响乐团和六千名指挥。每月十美元的价格，该服务提供了一个类似于完美的数字图书馆——一个可以听的维基百科。你可以在那里找到寻找的任何古典录音，然后根据专辑的任何细节进行进一步探索。当然，对于古典音乐这样特定的流派来说，这比更广泛的领域更容易实现。但与许多科技公司不同，Idagio\
  \ 并不不惜代价追求规模；它不需要无限扩张并涵盖每一个流派。Criterion 的 Bartlett 告诉我：“我们不需要达到那些巨型流媒体服务的水平。如果我们有一群忠诚、投入的观众，我们应该能够在我们所需的水平上维持下去。”除了技术之外，这种不计代价的资本主义增长心态从根本上也是\
  \ Filterworld 文化平庸化的根源。\n\n同时兼顾每种用户是一个刻意的决定，但这通常以牺牲可用性为代价。正如 Facebook 扩展到涵盖网络上的每形式的内容一样，流媒体服务往往试图为所有消费者提供一切。追求一种能够吸引（或至少不冒犯）最多人的道路会导致同质化。而这种同质化不可避免地被刻画在主流群体的模具中：白人、顺性别者、异性恋者。很难通过一个同时适用于数十人的算法模具来培养出个性化的认同。相比之下，建立致力于更特定主题的小型消费社区，可以带来更深层次的参与感，无论是针对内容本身还是用户之间。小规模的可持续性仍然被视为成功。这是我们在互联网优先考虑无缝便利和尽可能向许多人同时进行广播时，我们所错过的东西。\n\
  \n“我不相信这种按一下按钮就能立即获得音乐的孤立便利性，”Janczukowicz 说，他提到了 Spotify 的界面。虽然你仍然可以在 Idagio 上随时播放任何你想听的内容，“但我对背景也感兴趣。”例如，听众在离开一场柴尔斯基音乐会后可能想寻找更多这位俄罗斯作曲家的交响曲，或者寻找由同一个乐团演奏的贝多芬交响曲。Spotify\
  \ 让这种程度的细粒度几乎是不可能的。但 Idagio 的界面具有迪特·拉姆斯（Dieter Rams）设计的利落几何感，并强调文字而非图像，这使得一切变得毫不费力。你可以按作曲家、表演者、作品或年代进行浏览，每位表演者都经过标识，现场录音与录音室版本有不同的标记。点击按钮即可获得印刷\
  \ CD 小子的 PDF 版本。这是一种启示，是对 Paola Antonelli 将数字平台视为无差异的“死空间”之批判的解决方案。在这些被恢复之前，你并不会意识到大多数平台缺失了多少信息和导航（它们为了迎合算法推荐而消失了）。\n\
  \n当我订阅 Idagio 时，我惊喜地发现了法国作曲家埃里克·萨蒂埃（Erik Satie）我最喜的作品——1888 年的 `Gymnopédie No. 1`。它那温柔、游离、稀疏的独钢琴旋律，就像在雨天漫无目的地散步，这在\
  \ TikTok 上变得非常流行，它为超过 15 万个视频提供了配乐，涵盖了从水母视频到关于爱情的个人故事等。我立即在 Idagio 上调出了这首作品的几十种不同版本的列表，这些是由世界各地的音乐家在过去的半世纪里演奏的。它们包括\
  \ Jeroen van Veen 特别缓慢且响亮的版本、小川直子（Noriko Ogawa）1890 年的钢琴演奏，以及 1951 年弗朗西斯·波澜（Francis\
  \ Poulenc）更欢快的表演，当时这首作品远没有今天这样出名。萨蒂最初只注释应该演奏得“缓慢而忧伤”；每一段录音都给我提供了关于音乐的不同视角，以及它是如何随时间被重新诠释的。在\
  \ Idagio 上，平台的结构根据特定内容进行了调整，提升了文化体验。相比之下，在 TikTok 上，萨蒂在最常用的 `Gymnopédie` 录音中甚至没有署名，而在\
  \ Spotify 上，专辑目录分类的差异使得追踪表演者和日期变得一团糟。\n\n随着我使用 Idagio 的次数增加，我发现自己以一种有机的方式漫步在古典音乐的走廊中，如果没有这项服务，我永远无法做到这一点：跟随像赵哲赫（Jae-hyuck\
  \ Cho）这样的特定钢琴家，或者钻研肖芬的夜曲，听许多不同的表演者和作品。我对古典音乐的了解极少，但这个产品让体验变得愉快，并且比听古典音乐电台少那么令人畏。在没有算法推送帮助的情况下，在网上托管大量的文化体是完全可能的；毕竟文化本身就提供了一种可以遵循的算法，因为每位艺术家都在影响和启发他人，并在历史的基础上进行创作。这些正是\
  \ Paul Cavalconte 构建电台歌单的联系。我想起了 Janczukowicz 对“维护文化”的描述。这不仅仅是音乐需要在网上可以被获取；它必须以一种连贯的方式呈现，以一种允许超越被动消费的教育的方式。这适用于任何其他文化形式。如果你喜欢某样东西，为什么不多了解它并深入探索呢？\n\
  \n在与策展人的对话中，我发现了一种关怀和照顾的语调，这在大型数字平台上是完全缺失的，这些平台将所有文化视为可以无差别大量输送的内容，并鼓励消费者一直停留在表面。对于\
  \ YouTube 来说，一个视频和另一个没有区别；唯一重要的是你是否可能点击它，以便接触到更多广告。但这种优美的关怀感，既针对观众，也针对当下的文化——以正确的方式呈现艺术品、专辑或电影——让与文化的接触变得好得多。对于艺术家来说，在理解和欣赏他们试图实现的目标方面，这同样更有利，而这通常是艺术的目标。\n\
  \n我们转向艺术是为了寻求连接，但算法推送带给我们纯粹的消费。真正的连接需要慢下来太多，以至于脱离算法的控制。你无法在阅读 CD 小子时保持算法心流状态。\n\n\
  \n\n\n## 回到信息流\n\n我算法排毒的最初几周非常艰难，但随后我适应了，时间也过得很快。我并没有回到那个数字领域角落的强烈渴望。但在经历了三个月的禁欲后，我决定回去，这很大程度上是因为新闻周期的影响。作为一名科技科技记者，我*必须*知道网络上发生了什么，而\
  \ 2022 年底当时的核心议题已变成了社交媒体本身，尤其是埃隆·马斯克对推特那充满争议的收购。\n\n我也怀念那种对朋友生活的“环境感知”。虽然我很感激自己不再被\
  \ Instagram 上那些他们在科莫莫湖度假的照片所轰炸，但我无法看到他们的书单推荐、他们烹饪的美食，或是可爱的宠物快照，而这一切都是算法确保会送给我的。我不情愿地重新登录，并将\
  \ App 恢复到手机上。我的拇指很快就学会了旧的习惯。\n\n但我惊讶地发现，即使在离开社交媒体的短暂时间里，我的大脑化学状况也发生了变化。逃离算法流就像变成一个素食者后看到了一块多汁的牛排——曾经可能吸引人的东西现在却变得令人反感。我的消费节奏变慢了，在选择阅读、倾听或观看内容时变得更加审慎。当我回来时，信息流显得太快、太混乱，且离时间顺序太远。\n\
  \n随着我的耐受力再次提高，我逐渐习惯了它们。但那种厌恶感一直挥之不去。这段休息让我更直观地理解到，推特信息流中的戏剧性与线下的日常生活几乎毫无关系。（我原本就需要学习这个教训，这说明我沉浸得有多深。）当我不再点赞和粉丝有意义的平台上花费大量时间时，对帖子点赞的娱乐化追求便失去了意义。我问\
  \ Jess，在排毒期间我的行为或态度是否有任何变化；她说我最初的脾气变成了整体的冷静，并且“对网上发生的事情没那么不安”。（不过，她确实抱怨我没能在 Instagram\
  \ 上发她的任何漂亮照片。）我发现自己开始注意到朋友在聚在一起时看手机，这恰恰是因为我的手机上没有那么多能引起我的兴趣。\n\n就像制造低焦油香烟的烟草公司一样，算法流创造了它们所声称要解决的问题。我们不需要每天接触成千上万条由我们可能认为最有吸引力的内容排列的数字更新。即使我们不完全注销，按时间顺序排列的信息以及少发少发的激励机制可能对我们更好，对文化也更好。\n\
  \n与其浮在事物的表面，我利用了没有算法的时间去研究我发现感兴趣的事物，并弄清我在网络上无目的的时间里在寻找什么。专注于少数几个文化创作者让我感到更加满足。当我得到\
  \ 2022 年的 `Spotify Wrapped` 回顾报告时，那份对我那年品味的总结告诉我，我是 Bill Evans 听众中排名前 0.01% 的人之一，他是一位创新的爵士钢琴家，职业生涯巅峰在\
  \ 20 世纪 60 年代。尽管这个数字看起来极端，甚至有些丢脸，但我理解为什么我会得到它。我持续的写作背景音乐一直是 Bill Evans Trio 在 1961\
  \ 年在村庄卫卫场的演唱会，那是一个跨越三张唱片的完整录音。我熟悉了这张专辑的每一秒，从“Gloria’s Step”第一次录制时不可避免的磁带故障，到结束演唱会的连续两首“Jade\
  \ Visions”。《Jade Visions》是一首由节奏贝斯和弦支撑的、哀伤且冥想式的曲目，由三重奏的贝斯手 Scott LaFaro 作曲，他在 1961\
  \ 年底的一场车祸中去世，年仅二十五岁。我越听这张专辑，收获就越多，仿佛它是我收藏中唯一的张 CD 一样。在算法推荐将我带向其他音乐家或专辑之后，我依然在听。\n\
  \n我发现，对抗平庸的方法是寻求具体，无论你被什么所吸引。你不需要成为一个经过认证或职业化的专家才能成为鉴赏家。你不需要作为影响者将你的观点变现来证明它合法。算法承诺取代你的品味并为你外包，就像一个机械肢体一样，但形成你自己的品味只需要思考、意图和关注。策展是人类行为的一个自然方面：正如我们选择吃什么食物或服装中搭配什么颜色一样，我们有有机地形成对哪些文化作品吸引我们、哪些不吸引我们的观点。\n\
  \n像 `Spotify radio` 或 `TikTok “为你推荐”流` 所鼓励的这种“躺平消费”有其特定的时机和场合，但我担心其根本的消极性正在贬低整个文化创新，并降低了我们对艺术的享受。文化建立在个人推荐之上，而非自动推荐，因为我们会分享、解释并回应我们所喜爱的事物。这种人类的推荐过程可以像给朋友发送一个他们可能喜欢的链接，并附上几句关于他们为什么可能喜欢的描述那样简单。\n\
  \n## 我的推荐\n\n用一个个人推荐来结束这一章很合适，这是我最初通过算法流发现的，但现在已成为我品味和自我的一个基本部分。这是一张 1982 年的专辑，名为\
  \ *Awakening*，由日本音乐家佐藤龙史（Hiroshi Sato）创作，除了是我认为史上最好的专辑之一外，它完美展示了书中记录的各种过滤世界力量。我第一次接触佐藤来自\
  \ `YouTube` 的推荐算法。我偶然发现了专辑中的一首名为“Say Goodbye”的歌曲，但在 `YouTube` 上它是一个名为“This Boy”的重制版本，由名为\
  \ `Boogie80` 的频道上传。它没有太多其他信息，但那张在海中游泳的肤色男人的感性封面，以及模块合成器奏出的轻盈开场旋律立刻抓住了我。\n\n我把那个\
  \ `YouTube` 链接看了几十次，赞叹这首歌完美的流行曲简洁感和忧伤的英文歌词，在进一步探索佐藤的作品之前，这些歌词正哀悼一段分手——“希望你不要孤独”。当我开始听整张\
  \ *Awakening* 时，一段时间内，“Say Goodbye”仍然是唯一首令我印象深刻的歌曲。然而，音乐色调中的某些元素保持着我的好奇。\n\n\n\n\
  \nSato 的专辑成了我做晚饭时会播放的音乐——在疫情期间，我每天都会完整播放——我和 Jess 在厨房里伴着它跳舞，沉浸在艺术那种带你通往完全另一个地方的片刻之中。`Awakening`\
  \ 包含了一首名为《Blue and Moody Music》歌曲的两个版本，歌词描绘了一个从深夜练习钢琴直到清晨，并在乐器中寻求慰藉的场景。第一版录音是佐藤一个人的演绎，节奏低沉，伴随着键盘的修饰。很容易想象出这位音乐家坐在大钢琴前，俯瞰着灯火通明的城市天际线。但第二个版本将歌曲推向了一个超然的高度，带有近乎热带风情的合成器颤音音，背景是持续不断的电吉他分解，而\
  \ Matthews 进入了完全的歌剧模式，像一颗划过那片夜空的流星，佐藤那略显沙哑的声音作为和唱，形成了互补性的对比。录音在接近结尾时不断加速；它并没有停止，而是在盛放中淡出，仿佛永远持续下去。这是天才之作，是一首完全属于那个时代又完全永恒的音乐。然而，`Spotify`\
  \ 的播放量告诉我，“Blue and Moody Music (Wendy’s Version)”是专辑中较不受的曲目之一，相比于 YouTube 热曲《Say\
  \ Goodbye》超过 300 万的播放量，它只有 28 万次。\n\n这样一部杰作是如何流入我眼中的呢？为了满足自己的痴迷，我开始研究它的起源。佐藤是日本几十年来著名的钢琴家、制作人和词曲作家，直到他在\
  \ 2012 年去世。但他与美国听者的接触源于算法。21 世纪 10 年代中期，`YouTube` 的推荐开始关注一种被称为“城市流行（City Pop）”的日本流派，这是一种在\
  \ 20 世纪 70 年代后期和 80 年代初出现的模糊的音乐运动。它始于像 `Happy End` 这样的乐队，这支极具影响力的东京乐队是首批用日语歌词创作摇滚和迷幻民谣音乐的团体。`Happy\
  \ End` 并没有持续多久，但其成员包括细野晴臣（Haruomi Hosono），他曾与佐藤等许多音乐人合作，并在更前卫的乐队 `Yellow Magic Orchestra`（黄色魔法乐队）中尝试合成器。（细野后来还为第一家\
  \ `Muji` 商店创作了环境电子音乐配乐，这种美学非常符合 `Filterworld`。）\n\n佐藤、细野等人开始将来自 `Beach Boys` 等乐队的美国冲浪摇滚和游艇摇滚（yacht-rock）声音与他们领先的技术感性相结合。1977\
  \ 年，评论家东野清和（Tōno Kiyokazu，在学者 Moritz Sommet 2020 年的一篇权威论文中被引用）将“城市音乐”描述为具有“都市感”的音乐。这位评论家也指出，这个词“并没有任何特别深层的意义”。它是“某种看起来你懂，但其实并不懂的东西”。换说，某种模糊性可能是其本质属性的一部分。它是逃避的，反映出投射在它的任何东西。山下达郎（Tatsuro\
  \ Yamashita）1978 年的专辑 `Pacific,`（细野参与了制作）就是一个代表性的例子：它有着明显的夏威夷影响，带有滑音吉他（slack-key\
  \ guitar）和海浪声的氛围采样。它几几乎是俗气的。但在这张本就完美热带风情的专辑中，最后一曲却是一个完全合成的、不和谐的、机器人式的声景，仿佛那个岛屿实际上是机械化的。\n\
  \n城市流行也受到另一个技术创新的影响：1979 年 `Walkman`（随身听）的发明ھSony` 前执行官井深（Masaru Ibuka）希望能在飞机上听音乐。他非常喜欢它，并推荐给了公司会长盛田昭（Akio\
  \ Morita），后者决定生产它。`Sony` 售出了数十万台 `Walkman`。突然，音乐可以在听者去的任何地方包裹他们。就像算法推送一样，`Walkman`\
  \ 是一种戏剧性的个性化形式。在 1984 年为《Popular Music》杂志写的一篇名为《Walkman 效应》的文章中，日本音乐学学者细川秀（Shuhei\
  \ Hosokawa）写道，“听者似乎切断了他真正生活的外界：通过 `Walkman`，物理现实顺从了听者的欲望。”\n\n80 年代最初的城市流行热潮在几年内就消逝了，但该流派以落满灰尘的黑胶片实体形式保留了下来。接着，在\
  \ 2000 年代，翻找旧专辑唱箱的日本 DJ 重新发现了这个流派，并开始让它重新回到循环。（考虑到数字文件及其托管平台的相对瞬时性，未来这种复兴可能会变得困难得多。）这种复兴通过小众论坛和博客传到海外，激发了西方\
  \ DJ 计划前往东京购买自己的唱片。然后，城市流行席卷了 `YouTube` 并在全球进入主流。\n\n出于某种原因，像佐藤这样的音乐为推荐算法提供了理想的解决方案。其中有一首歌曲特别火爆：竹内玛利亚（Mariya\
  \ Takeuchi）1984 年的《Plastic Love》，这是一首带有律动感 R&B 后节奏拍点和柔和合成器键盘的洗脑旋律。它是一首纯粹的流行甜点。\n\
  \n\n\n对于 City Pop 在线上的狂热成功，人们提出了多种解释。一些作家将其与 `YouTube` 上流行的 lo-fi chill 音乐流直播联系起来，这种音乐是为学习或工作提供背景音乐的放松电子乐。这些直播流吸引了数百万听众，随后他们可能会被推向另一个充满合成器色彩、不干扰且中速的音乐来源。张（Zhang）在另一项\
  \ 2021 年的 *Pitchfork* 调查中发现，“算法简单地将听众从‘lo-fi beats’视频引导到《Plastic Love》。”在过去的几年里，City\
  \ Pop 流派已成为该平台本身的代名词。在 `Rate Your Music` 网站上，甚至有一位用户将其称为“日本 YouTube 推荐核心”，并收集了播放量超过十万的\
  \ City Pop `YouTube` 视频。以《Plastic Love》为例，这首歌的流行可能得益于 `YouTube` 视频封面上歌手那优美的黑白照片——那是一个充满绝对自由和无忧幸福感的感性画面：竹内（Takeuchi）大嘴微笑，眼睛由于运动而略显模糊。“歌曲与照片之间存在着完美的缘分，”摄影师艾兰·莱文森（Alan\
  \ Levenson）告诉张。正如 `Instagram` 上白色背景下色彩鲜艳的陶瓷瓶一样，这张照片经过优化，使其作为 `YouTube` 推荐缩略图进行传输。\n\
  \n除了任何算法推广外，事实上的也是这些仅仅是好歌曲，由才华横溢的音乐人在他们创作巅峰时期创作，尽管它们在发行时并不一定是热门歌曲（与 2000 年代文青青人的信条相反，仅仅因为某东西流行并不意味着它很坏，而默默并不意味着它本质上就是好）。这些歌曲并非偶然优秀；它们是为了触达观众而创作的，尽管它们最终触达的观众规模是无法预测的。\n\
  \n也许就像丹蒙·克鲁科夫斯基（Damon Krukowski）的 Galaxie 500 乐队歌曲《Strange》（它在 `Spotify` 上独立于乐队其他作品走红）一样，City\
  \ Pop 拥有最普通、最悦人、最平均的流行音色，让人无法点开关闭。这个流派虽然很小众，但它是各种音乐风格的平均值，国际平台上的用户都能轻松找到。City Pop\
  \ 的听觉审美部分是东方的（源于其日本创作者），部分是西方的（源于其灵感），部分是怀旧的（从 2010 年代看 80 年代的感），部分是未来的（源于对当时新音乐技术的拥抱，如合成器和电子鼓机）。City\
  \ Pop 拥有一种像垃圾食品般吸引人的元素密度。高亢的歌声、厚重的合成器冲刷、R&B 乐器和鼓点惯性的组合是不可抵抗的，而它未被充分研究的日本起源故事使其足够异域，让网络上的西方听众感到陌生。\n\
  \n名字本身可能也有帮助：“City Pop”是一个模糊的概念，可以与任何地方的任何城市联系在一起，就像我通过 `Airbnb` 注意到的空间审美（AirSpace），但它是针对音乐的。安迪·库什（Andy\
  \ Cush）在 *Spin* 杂志中对那些在 `YouTube` 上流行的类似日本环境录音的观察道：“如果音乐不是那么好，它可能会像是一个陷阱。”当然，这就是过滤世界（Filterworld）的陷阱。算法推送塑造出一种既足够吸引人，又完全去语境化且传播如此广泛的文化，以至于它变得空虚毫无意义，提供了如此多的审美却没有任何内容。\n\
  \n在某些方面，这种空虚过程对 City Pop 来说已经发生了。2015 年《日本时报》的一篇文章观察到，这一流派是一个“简化的独立流行词”。\n\n为了抵抗过滤世界，我们必须再次成为自己的策展人，并对我们的内容负责。重新获得那种控制并不困难。你做出个人选择并开始有意识地寻找你自己的文化兔子洞，这会引导你走向新的方向，走向更多独立的决策。这些决定随着时间的推移积累成一种品味，最终形成一种自我意识。\n\
  \n\n\n1939 年，沃尔特·本雅明（Walter Benjamin）完成了他的论文《机械时代的艺术作品》的修订版。他在文中考虑的摄影技术，在他撰写此文时已经存在了一个多世纪了。第一张包含人物的照片是由路易·达盖尔（Louis\
  \ Daguerre）于 1838 年拍摄的，他记录了从工作室窗外看到的巴黎林林大道——这是一个极其平凡的场景，但将其凝固成图像却是前所未有的成就。随着时间的推移，摄影变得越来越普遍，到本雅明时代，它已成为一种主流产品。任何人都可以拍摄肖像，或者买一张风景的明信片寄给别人，让他们也能看到。在论文中，这位评论家开始审视摄影如何改变了文化，破坏了我们对单件艺术品独特性的感知。本雅明写道，像照片或留声唱片这样的复制技术，“让原作能够与接收者在途中相遇。”“大教堂离开了了它的所在地，在艺术爱好者的工作室里被接受。”尽管在摄影时代，某种真实性消失了——复制品并不等同于原作；明信片只是真实大教堂的影子——但可获得性增加了。本雅明所看重的那种稀缺的高文化变成了大众体验：正如他在其他处所言，“大众艺术”。\n\
  \n“正如人类集体的整个生存模式随着漫长的历史时期发生变化，他们的感知方式也是如此，”本雅明写道。技术既改变了我们产生的文化形式，也改变了我们对这种文化的感知，即我们吸收周围人工世界的方式。（这两种变化是同时发生的。）本雅明认为，摄影作为一种新感知形式的扩散导致视觉艺术的危机，最终解放了它对记录现实的需求——这项任务留给照片更好——并激发了“纯粹”艺术的理念。也就是说，艺术不再关乎再现或任何社会功能，正如\
  \ 19 世纪的美学信条所说，“为了艺术而艺术”。\n\n本雅明也观察到，摄影在某种程度上使世界商品化了，他在 1935 年的一篇论文《十九世纪的首都巴黎》中指出，“通过向市场倾销无数人物、风景和事件的图像，而这些内容以前要么完全无法获得，要么仅作为个人客户的图片。”摄影对文化施加了使其“可摄影化”的压力，使其以照片的形式流传，而文化不可避免地反过来适应。他写道：“被复制的作品变成了为了可复制性而设计的作品的复制。”\n\
  \n我再次提到本雅明是为了指出技术塑造文化的力量一直存在，而且这种力量是中性的，并非本质上是负面的。无论摄影如何破坏了单件艺术品的“灵光”（aura），今天没有人会要求放弃图像的复制，也不会建议我们应该抛弃录制音乐而只听现场音乐家的现场。（本雅明的论文与其说是对摄影的赞美而非斥责。）此外，需要几十年甚至几个世纪的时间才能确定某项技术究竟如何影响了文化形式。艺术家将其整合到自己的创作过程中，消费者也开始将其视为常态；只有当一种新工具变得平不足道时，它的影响才能被判断。我们在自己的时代也看到了同样过程：数字平台的全球化和算法流的兴起，这对不可分割的技术组合改变了我们的感知，正正如摄影的发明一样。\n\
  \n文化必须追随特定时代的主导感知模式。虽然 20 世纪的建筑可能是为了摄影而设计的，但 21 世纪的艺术品则是通过算法流被“设计为可复制性”，例如帕特里克·詹内尔（Patrick\
  \ Janelle）在`Instagram`上的拿铁咖啡美照，或尼格尔·卡比纳（Nigel Kabvina）在`TikTok`上的烹饪视频。它们各自贡献并符合一种通用的、扁平的、可复制的美学。因此产生了普遍的厌倦和疲惫感，感觉没有什么新东西会出现。\n\
  \n即使在算法起的短暂时间内，算法推荐也扭曲了从视觉艺术到产品设计、歌曲创作、编舞、城市规划、食物和时尚的的一切。各种文化体验都被简化为数字内容这一同质化的类别，并顺从参与率的法则。任何内容，无论是图像、视频、声音还是文本，都迫使观众做出即时的（往往是浅薄的）反应。它必须让他们点击“赞”或“分享”按钮，防止他们点击“停止”或“跳过”。\n\
  \n创作者面临参与和避免疏化的双重压力，意味着许多文化形式变得更具即时吸引力但也更转瞬即逝，只留下了氛围。这种强制的情感易逝性和语境不永久性掏空了当代文化，使其在没有这些压力的情况下本可以具有实验性和力量。\n\
  \n算法推荐由于其无处不在以及在消费者日常活动中的突然亲密性，已成为新的文化仲裁。智能手机屏幕让我们能够随身携带互联网，而数字平台的流正是互联网传递给我们的媒介。在这个过程中，它们将一切压缩为驱动它们的内容。在文化进入我们方式方面，算法推荐取代了人类新闻编辑、零售精品店买手、画廊策展人和电台\
  \ DJ——这些我们曾依赖他们的个人品味来突出独特和创新的人。相反，我们拥有的是科技公司主导的推荐优先级，这些优先级隶属于通过广告产生的利润。在过滤世界（Filterworld）中，最流行的文化也是最枯竭的。它被精简和平均化，直到像维生素片一样，可能含有必要的成分，但缺乏任何光彩或活力。\n\
  \n\n\n我们留下的只有广为接受却毫无根源且毫无意义的数字全球化文明符号：通用的极简主义室内设计，墙上贴着地铁砖；陶瓷杯中覆盖着一层平坦蒸馏牛奶朵的浓缩咖啡；手术增强后的\
  \ Instagram 脸那人造的丰满嘴唇和高颧骨；在设定的鼓点和无限循环的柔和合成器波浪伴奏下的低声吟唱；准备好被智能手机相机捕捉并在小屏幕上复制的抽象粉色调色块。就像沉降的大陆一样，这些符号将随着时尚和个人品味的潮汐随时间推移，只要审美仍然行使。但在这种平台生态系统被打破之前——无论是通过法律还是通过用户的决定，只要有足够的人决定放弃——它们的同质化将保持根深蒂固。与此同时，根据资本主义的指令，“过滤世界”（Filterworld）必须不断增长。停滞或萎缩意味着失败。\n\
  \n算法推送与技术创新的其他迭代不同，因为它们不仅仅是向我们展示一种待考虑的新奇新格式，如胶片或电视屏幕。它们还试图利用新发现的数据监控和机器学习工具，通过个性化推荐为我们预判个人的文化欲望。算法推送介于人类创造者和人类消费者之间，对文化做出无限的决策。这项技术从未被如此广泛地应用，用户也从未如此频繁地体验，而且是在生活中如此私人的方面。如果说摄影复制了艺术品，那么算法推荐可能复制了对艺术本身的渴望，廉价化并扼杀了那种创造好奇心的感觉，使其更容易通过更少的东西满足。推送引发的变化不仅是审美上的，更是隐秘的心理上的，它们对“消费选择”的调节作用不亚于“被消费的内容”。\n\
  \n如果打破“过滤世界”有一个简单的答案，那么它可能类似于 20 世纪 90 年代流行的“慢食运动”的版本，但是针对文化的。慢食是对工业化农业主导的反击；它主张对食物的来源和如何制作方式进行深度思考，不仅考虑最终产品，还考虑其到达消费者的整个过程。这场运动奖励了追求小规模经营的农民、长期可持续增长的企业以及知晓并珍视食材来源的厨师。客户也学会了珍视这些品质。（尽管来源和模糊性这些特质有时会变成另一种极端的恋物。）我们也需要对在线消费和支持文化的方式带来同样的这种对可持续性和特异性的理解。\n\
  \n对算法无缝化的抵抗需要意志力的行动，一种以不同方式穿过世界的选择。这并不非得是戏剧性的。\n\n一个下午，在华盛顿剪完头发后，我再次注意到了一家我住在那里这几年里路过数百次的咖啡馆。它叫作\
  \ `Jolt n’ Bolt`，这是一个充满廉价感的复古名字，来自一个咖啡被看重更多是因为咖啡因而非味道或单产地源的时代。它于 1994 年开业，就在第一家\
  \ `Starbucks` 在华盛顿开业后，那是该连锁店在东海岸的首家店。我从未进去过；那个名字、剪贴画风格的 Logo 和深色的室内装潢令人反感。它不适合发\
  \ Instagram 打卡。但那天，我决定进去。它的室内设计确实直接取自 20 世纪 90 年，深色哑光漆，柜台上方挂着菜单的招牌。小桌子是人造木层压板，配有软垫金属椅。当地艺术家的画布以沙龙风格挂满墙壁。滴滤咖啡是深烘焙到近乎焦苦的。这也是一种可识别的风格，那种略显杂乱的当地咖啡馆，仍然存在于波特兰、波士顿和华盛顿这样规模较小、节奏慢的城市。\n\
  \n我感到既困惑又难过，这是一种稀有的经历，就像参观博物馆一样。我们的手机和推送吸收了大量的注意力，主导了我们如此偏好，以至于跳出它们那些便利的预设路径并选择一种并非立即具有吸引力的体验，感觉有些激进。这不仅适用于时尚选择，也适用于食物、我们看的电视节目、我们读的书、我们买的家具以及我们旅行的地方。如果我们把优先级从算法数字平台空间转移，重新回到物理世界——在这个世界里，一切都不再根据参与度被即时评估——我们可能会发现自己不仅在构建更好的文化，还在构建更好的社区、关系和政治。人类学家大卫·格雷伯伯（David\
  \ Graeber）曾写道：“世界终极、隐藏的真相是，它是我们创造的东西，而且我们可以同样容易地创造出不同的。”互联网也是如此。\n\n不存在发生在技术影响之外的纯粹文化形式，也不存在消费文化的唯一最佳方式。我们无法仅仅消除算法的影响，即使我们想这样做，因为这项技术已经不可避免地塑造了我们的时代。但逃离算法控制的第一步是承认它的。通过远离被动消费的思维并思考后算法时代的数字生态系统，我们开始构建那种替代方案，证明算法的影响既不是必然的也不是永久的。最终，“过滤世界”本身及其那套根深蒂固的风格，将被证明是文化的一个有限阶段，恰恰因为它将耗尽燃料，并在自身的自我指涉中搁浅。新事物正出现在地平线上；它是由人工智能机器生成的甚至更多的人造内容洪流，还是人类自我表达的复兴，取决于我们的选择。本雅明（Benjamin）曾写道：“事实上，每一个时代不仅梦见下一个时代，而且在梦梦中加速了它的觉醒。它在自身包含着自己的终结。”\n\
  \n# 致谢\n\n`Filterworld` 的诞生离不开我在 Doubleday 出版社了不起的编辑 Thomas Gebremedhin，他立即就看到了这本书对话的重要性。没有任何作者能希望在梳理文本时找到比他更好的倾听者或伙伴。任何对在线文化策展的必要性表示怀疑的人看看他的\
  \ Instagram 动态。Johanna Zwirner、Nora Reichard、Elena Hershey、Anne Jaconette 以及 Bill\
  \ Thomas 领导下的 Doubleday 全体员工，让从收购到发行的整个过程成为了一种真诚的快乐。我非常感谢 Oliver Munday 在封面设计上的不勤努力以及最终呈现的清晰度。我的经纪人和朋友\
  \ Caroline Eisenmann，一如既往，以她独特且不知疲倦的方式将这些思想的种子引导得连贯起来。\n\n在思考和写这本书的过程中，生活发生了许多事情，很多事情没有进入书中，但像它的影子一样持续着。在我创作\
  \ `Filterworld` 期间，我与 Jess Bidgood 结婚了，我只能形容为我的真爱。在那之前，我们养了一只叫 `Rhubarb` 的狗，我的另一个挚爱。我想念这段期间去世的人，特别是我亲爱的祖父母\
  \ Alfonse 和 Mary DeSalvio，他们向我展示了许多追求个人愿景的真谛。\n\n\n\n我的研究助理 Ena Alvarado 的帮助是无价的。也要感谢多年来投入建议并倡导此书出版的编辑们，包括\
  \ Michael Zelenko、William Staley 和 Julia Rubin。我在《新 Yorker 人》（*The New Yorker*）的编辑\
  \ Rachel Arons 在我们试图涵盖互联网的荒诞性时，一直是稳定、灵感的源泉，并给我带来了许多欢笑声。感谢 Michael Luo 和 David Remnick\
  \ 在杂志期间对我工作的支持与鼓励。\n\n这本书的大部分内容是在华盛顿特区 Line 酒店的大厅咖啡厅写写的（那是一座由巴西利式教堂改建而成的，天花板非常高耸），那里离我们的公寓只有一个街区之隔，友好的咖啡师\
  \ DJ 和 Myesha 一直陪着我。写出一本好书需要良好的氛围。\n\n# 关于作者\n\nKyle Chayka 是《新 Yorker 人》（*The New\
  \ Yorker*）的特约作家，他在那里撰写关于数字技术以及互联网和社交媒体对文化影响的专栏。他的第一本非虚构书籍《渴望减少》（*The Longing for\
  \ Less*）是对生活和艺术中极简主义的探索，于 2020 年出版。作为一名记者和评论家，他曾为许多出版物贡献过，包括《纽约时报杂志》（*The New York\
  \ Times Magazine*）、《哈珀杂志》（*Harper’s Magazine*）、《新共和》（*The New Republic*）和 Vox。他是艺术出版物\
  \ Hyperallergic 的第一个特约作家。Chayka 还是记者在线社区 Study Hall 以及关于数字文化的通讯邮件 Dirt 的共同创始人。他居住在华盛顿特区。\n\
