- "# Filterworld：算法如何平庸化文化\n\n\n\n\n\n# 凯尔·查亚卡（KYLE CHAYKA）其他作品\n\n《渴望简约》\n\n\n\n\n\
  \n\n\n\n\n\n`ep_prh_6.2_145871955_c0_r0`\n\n## 献给 Jess\n\n> 你可能没有在使用社交媒体，但它正在使用你。\n\
  \n> —Eileen Myles\n\n▪ ▪ ▪ \n\n> 美国许多事物传达的信息是：“要么像这样，要么死。”\n\n> —George W. S. Trow\n\
  \n\n\n`145871955` ![JOSEPH RACKITZ 绘制的 1789 年机械人设想图](img/001_Chay_9780385548281_all_art.jpg)\n\
  \n## 引言\n\n▪ ▪ ▪ \n\n## 欢迎来到“滤世界”\n\n## 机械人\n\n1769 年，哈布斯堡帝国的一位名叫约翰·里特·冯·肯普伦（Johann\
  \ Ritter von Kempelen）的官员制造了一台被称为“机械人”的设备。这是送给奥地利帝国皇后玛丽亚·特蕾莎的礼物。肯普伦那台近乎魔法的机器仅通过内部的时钟齿轮和传带，就能与人类对手下棋并获胜。正如历史版画所示，机械人是一个巨大的木柜，宽约\
  \ 4 英尺，深 2.5 英尺，高 3 英尺，打开的门露出了内部复杂的机械。顶部坐着一个孩子大小的人形自动机，穿着衣服。\n\n从东方主义视角来看，这种机器是一个全知的实体。机械人的手悬停在棋盘上方，抓取棋子，并操控着棋子的移动。所有的内部齿轮和绳带只是为了表演。当机器做出移动时，它被观众察觉到。这种机器就像从蜡灯的烟雾中漏出来，如果观众想窥视内部，木柜的门就会打开。然而，机器内部驱动的其实是一个穿着长袍、戴头巾、留着胡须、坐在棋盘前的人类专家。本杰明·富兰克林（Benjamin\
  \ Franklin）和拿破仑（Napoleon）都曾输给它。机械人真正做不到的是下棋。一些怀疑的英国人菲利普·西克尼斯（Philip Thicknesse）在\
  \ 1784 年的一书中写道：“称其为自动机是一种强加，它是被隐形盟友控制的。”他继续写道：“自动棋手的外表如何，他内部都有一个生命的灵魂。”西克尼斯是正确的，但这个秘密直到\
  \ 1860 年才完全揭露，当时机器已经巡游了美国，并进入了爱伦··坡的私人医生约翰·凯斯利·米切尔（John Kearsley Mitchell）的收藏。原作在火中被毁，米切尔的儿子在《象棋月刊》上撰写了揭秘文章。自从发明以来，这个设备已成为技术操控的流行隐喻。它代表了隐藏在看似先进的技术背后的人类，也代表了此类设备欺骗我们运作方式的能力。（2005\
  \ 年，亚马逊将其完成数字任务（如标记照片或清理数据）的服务命名为“机械人”（Mechanical Turk）。）机械人就像《奥兹的魔法师》中的幕后人——一个全知且不可思议的实体，最终被揭示为更为平庸和易理解的东西。机器和戏法相互加强。通过这种双重欺骗，正如沃尔特·本雅明（Walter\
  \ Benjamin）在 1940 年的一篇文章中反思该设备时所说，它能够“一直赢”。\n\n最近我经常思考机械人，因为它让我想起我们 21 世纪初笼罩着我们的技术幽灵。那个幽灵的名字叫“算法”。算法通常是“算法推荐”的缩写，指那些数字机制吸收大量用户数据，通过一组方程进行处理，然后输出认为与预设目标相关的的结果。算法决定了我们在\
  \ Google 搜索结果中找到网站、我们在 Facebook 动态中看到的动态、Spotify 播放的无尽歌单、我们在约会 App 上看到的潜在匹配对象、Netflix\
  \ 主页推荐的电影、TikTok 呈现的个性化视频流、Twitter 和 Instagram 上的帖子顺序、邮件自动分类的文件夹，以及在互联网上追随我们的广告。\n\
  \n\n\n\n今天，我们不断与各种算法作斗争，每种算法都试图在我们意识到答案之前，就猜出我们正在思考、寻找和渴望什么。当我写邮件时，我的 `Gmail` 应用程序会预测我正尝试输入的单词和短语并为我填好，就好像读懂了我的心术一样。`Spotify`\
  \ 在我的屏幕上堆满了它预测我可能听的音乐家和专辑，而我往往只是出于习惯就选了这些内容。当我解锁手机时，我可能想看的过去的照片——被标记为“记忆”，仿佛它们存在于我的潜意识中——会被预先加载，还有我可能想打开的\
  \ App 建议和我可能想发短信的朋友。`Instagram` 提供了一个由其算法感知的我兴趣构成的情绪板：俯视角的食物照片、建筑快照、热门剧集的循环视频片段。`TikTok`\
  \ 为我推送了一系列无法解释的视频，内容是人们在重新铺设浴室砖，而我莫名其妙地一直看下去，不由自主地被吸引。难道我作为一个文化消费者的身份远不止于此吗？\n\n\
  所有这些小决定过去都是由人类一个一个完成的：报纸编辑决定将哪些故事放在头版，杂志摄影编辑选择要发表的照片；电影放映员挑选在电影院展映季中播放的电影；独立广播电台的\
  \ DJ 汇编符合他们自己心情以及某一天或某个地方氛围的歌单播放列表。虽然这些决定无疑会受到各种社会和经济力量的影响，但负责这些的人确保了基本的质量水平，甚至是安全性，而这种质量在互联网加速的流媒体推送中可能是或缺的。\n\
  \n算法推荐是“机械土人”（Mechanical Turk）的最新演变：一系列人类决策被伪装并自动化为技术决策，其规模和速度是以一种非人类的程度在运行的。这项技术由垄断性科技公司的工程师设计和维护，并运行在我们用户每天登录时不断提供的数据之上，它既是由我们构建的，又主宰着我们，操纵着我们的感知和注意力。算法`always`\
  \ 赢。\n\n## 发现滤镜世界（FILTERWORLD）\n\n`Filterworld` 是这本书的书名，是我对影响我们今天生活的庞大、交错却又分散的算法网络的称呼，它对文化及其分发和消费方式产生了特别戏剧的影响。尽管\
  \ `Filterworld` 也改变了政治、教育和人际关系等社会许多其他方面，但我的重点是文化。无论是视觉艺术、音乐、电影、文学还是编舞，算法推荐及其填充的内容流都中介了我们与文化的关系，引导我们的注意力关注那些最符合数字平台结构的事物。自动推荐是过滤器，它们既在受关注的内容与被忽视的内容之间进行筛选，又在微妙地扭曲了这些事物的外观，就像\
  \ `Instagram` 上的照片滤镜一样，放大了某些品质而缩小了另一些。`Filterworld` 的文化成功是显而易见的。它们包括这样的现象：如乡村风的\
  \ `TikTok` 舞步推了 Lil Nas X 2018 年的歌曲《Old Town Road》享誉全球；困扰 `Instagram` 的陈词滥调设计趋势，如极简主义室内设计和时尚品牌近年来采用的单调无衬线字体标志；以及引发愤怒的、毫无意义的\
  \ `Twitter` 争议洪流。\n\n算法推荐根据哪些能立即吸引最多注意的内容，通过在推送流中推广特定的陈词滥调，决定了文化流派。2018 年，作家 Liz\
  \ Pelly 将“流媒体饵”（streambait）识别为其中一种流派：`Spotify` 特有的“静静、中速、忧郁流行乐”。2019 年，作家 Jia Tolentino\
  \ 同样识别出“Instagram 脸”（Instagram face），这种在平台上流行并通过整形手术实现的“明显的白人化但族裔模糊”的特征混合：“它有像猫一样的眼睛和长长的卡通睫毛；它有小而整齐的鼻子和丰满红润的嘴唇。”TikTok\
  \ 嗓音成为一个描述 `TikTok` 视频中许多影响者配音那种匆忙、单调拖腔的术语。每个平台发展出自己的风格原型，这种原型不仅受到审美偏好的影响，还受到偏见的影响。\n\
  \n\n\n\n正如印度文学理论家佳雅特·斯皮瓦克（Gayatri Spivak）在 2012 年所写的：“全球化只发生在资本和数据中。其他一切都是损害控制。”在过滤世界（Filterworld）时代，Facebook、Instagram\
  \ 和 TikTok 等数字平台以用户活动的形式积累并传播了它们的数据，以服务器农场和算法技术的形式在全球范围内积累资本，捕获了数十亿用户。同质化文化是对这种传播性损害的必然反应，是一种应对或适应损害的方式。长期以来，我一直认为“通用咖啡馆”（Generic\
  \ Coffee Shop）美学会消失，它可能只是一个转瞬即逝的趋势。但它却变得愈发根深蒂固。随着数字平台的扩张，引发的同质化也随之扩散。\n\n过滤世界及其精致的相似性会引发一种令人窒息、近乎虚脱的焦虑感。这种相似性让人感到无法逃避，尽管它被推销为向往，却让人感到疏离。学者肖申娜·祖博夫（Shoshana\
  \ Zuboff）称之为“监控资本主义”，是指科技公司通过不断吸收我们的个人数据来变现，这是注意力经济的强化。然而，尽管拥有所有这些数据，算法推送往往会误解我们，将我们与错误的人联系起来，或推荐错误类型的内容，鼓励那些我们并不想要的习惯。算法网络为我们做了如此多的决定，但我们几乎没有办法对其进行反驳或改变它的运作方式。这种不平衡导致了一种被动状态：我们消费推送推荐给我们的内容，而不对素材进行深度参与。我们还根据其激励机制来调整自己在网上的呈现方式。我们写推特、在\
  \ Facebook 上发布动态、在 Instagram 上拍照，其形式都是我们深知能够吸引注意力、获得点赞或点击的，而这些又为科技公司带来了收入。科学研究表明，这些点赞会触发大脑中多巴胺的冲动，这意味着追逐它们并顺从推送是有成瘾性的。\n\
  \n在我们算法焦虑的另一侧是一种麻木状态。多巴胺的冲动变得力不从心，推送的噪音和速度让人无所措。我们的自然反应是寻找拥抱虚无的文化，那种只负责覆盖和抚慰，而非像强大的艺术品那样去挑战或惊喜的文化。我们被触动、甚至产生兴趣和好奇心的能力被耗尽了。\n\
  \n## 文化的扁坦化\n\n为了理解过滤世界如何塑造我们的经历，我们必须理解它是如何形成的。算法推送的主导是一个较近的现象。在 Twitter、Facebook、Instagram\
  \ 和 Tumblr 等社交网络的早期，网站的内容在很大程度上是按时间顺序排列的。你选择关注或添加好友，他们的帖子会按照发布顺序显示。随着平台在 2010 年代增长到数百万、数十亿用户，用户同时连接的人越来越多，完全按时间顺序的推送变得变得繁琐，且并不总是有趣的。你可能仅仅因为没有在正确的时间滑动，就错过了一个热门或引人注目的帖子。因此，推送逐渐充满了更高比例的推荐帖子，且不再按时间顺序。这些由算法决定的帖子甚至来自你不关注的账号或你并不感兴趣的话题，被插在推送中，仅仅是为了在你打开应用时有东西可看。\n\
  \n这种转变动力与其说是易用性，不如说是利润。用户在应用上花费的时间越长，产生的数据就越多，越容易被追踪，他们的注意力卖给广告商的效率就越高。随着时间的推移，推送变得日益算法化，特别是在\
  \ 2010 年代中期的那个转折点。\n\n2018 年在美国推出的 TikTok 通过使其主页“为你推荐”（For You）推送几乎完全算法化，实现了重大创新。该应用的体验与其说是用户选择关注谁，不如说是推荐算法为他们选择了哪些内容（这就是为什么我被浴室瓷砖视频轰炸）。TikTok\
  \ 迅速成为历史上增长最快的社交网络，在不到五年的时间内拥有了 15 亿用户，其努力追赶的竞争对手也纷纷效仿算法化。Instagram 在 2020 年增加了推荐驱动的“Reels”视频推送，而\
  \ Twitter 在被埃隆·马斯克收购后，于 2022 年引入了推荐推文的“为你推荐”栏。至少对于构成互联网大部分的大型公司来说，算法浪潮没有任何逆转的迹象。\n\
  \n取代人类守门人和文化策展人、编辑和 DJ 的，我们现在拥有一套算法守门人。虽然这种转变降低了许多文化准入门槛，因为任何人都可以在网上公开自己的作品，但它导致了某种实时数据的暴政。注意力变成了衡量文化的唯一标准，而什么能获得注意力由硅谷工程师开发的方程式决定的。这种算法守门的结果就是整个文化领域发生的普遍扁坦化。我所说的`flatness`既意味着同质化，也意味着向简单性的还原：最不模糊、最无破坏性、可能也意义最小的文化片段得到了最多的推广。扁坦是最低公约数，是一种平庸，从未人类最自豪的文化创作的标志。\n\
  \n我在田中康雄 1980 年的一部日本小说《无论如何，水晶水晶》（*Somehow, Crystal*）中看到了一个过滤世界的比喻。这部小说与其说是戏剧性的叙事，不如说是时尚标签、产品品牌、餐厅和精品店的列表。它完美地捕捉了东京名为由莉（Yuri）的年轻女性周围的消费主义环境，讲述了她购买的东西以及使用的各种设备——这在文学上等同于网红的\
  \ Instagram 账号。小说以由莉醒来并打开床边的音响开始。她按下一个预设的调谐器按钮，让收音机跳到 FEN，这是一个播放美国摇滚乐的电台。在脚注中，书对那个按钮的技术进行了沉思：“这是一个很好的功能，你可以预设想听的电台频率，”但手动调台的那种狂热乐趣已经消失了。”\n\
  \n作者观察了按下按钮瞬间调到电台与反复扭动旋钮、穿过静音并最终找到完美模拟位置之间的区别。后者可能不那么精确、不那么方便，但它多了一些魔力和人性。那里没有预设，没有预定的解决方案。过滤世界的文化是预设文化，是不断重复的模式。技术限制了我们的某些消费模式；你无法在界线之外。正如由莉所说，“狂热乐趣”消失了——也就是说，当文化通过数字推送传播的能力受到如此巨大压力时，某种程度的原创性、前所未有的、创造力和惊喜就消失了。\n\
  \n\n\n\n\n`Algorithm` 一词简单地描述了一个等式：任何产生所需结果的公式或规则集。最早的例子可以追溯到古巴比伦，即现在的伊拉克地区。追溯到公元前\
  \ 1800–1600 年的楔形文字记录了用于某些目的的算法，例如根据深度和挖掘的土方量计算水池的长度和宽度。根据数学家唐纳德··克努斯（Donald E. Knuth）的话，巴比伦人“通过逐步的评估规则列表来表示每个公式，即通过计算该公式的算法”。克努斯写道，他们有一套专门的记录计算系统，使用“公式的‘机器语言’表示法而非符号语言”。每个巴比伦算法的字面解释都以同一短语结束：“这就是程序。”那句话强调了算法的一种内在特性：它们是可以重复的，并且在给定情况出现时，每次都同样适用且有效。今天，硅谷的追随者可能会将其描述为可扩展的。\n\
  \n算法是早期数学史的关键。公元前 300 年左右，希腊哲学家欧几里德在他的著作《要素几何》（`Elements`）中记录了所谓的欧几里得算法，一种寻找两个或多个数字最大公约数的方法。该公式以及埃拉托尼筛法（`Sieve\
  \ of Eratosthenes`，一种公元前三世纪识别一组数字中质数的算法）至今仍在使用中，特别是在密码学领域。但 `algorithm` 这个词实际上源于一个人——或者至少是他的出生地。\n\
  \n穆哈默德·本··穆萨·阿尔·花子米（Muhammad ibn Musa al-Khwarizmi）是一位波斯学者，约于公元 780 年出生于花剌子米（现今土尔曼斯坦和乌兹别克斯坦之间的地区）。尽管他的生活为人知较少，但阿尔·花子米离开了巴格达，在七世纪穆斯林阿拔斯王朝征服波斯后，那里那里已成为该地区的学术中心。他在智慧宫（也称为巴格达大图书馆）工作，研究占星术、地理和数学。像前身埃及亚历山大图书馆一样，智慧宫是一个跨学科的学习中心，科学研究备受重视，希腊语、拉丁语、梵语和波斯语的文本在这里被翻译成阿拉伯语。公元\
  \ 820 年左右，阿尔·花子米完成了《印度数字计算法》（`On the Calculation with Hindu Numerals`），这本文最终向欧洲引入了我们今天使用的数字系统。他还写了《还原与归归》（`The\
  \ Rules of Restoration and Reduction`），这是一本关于解方程策略的书。它的阿拉伯名称缩短为 `al-jabr`（意为还原，或抵消方程两边的同类项），这为该词和代数学科提供了来源。《还原与归归》包含了二次方程的解法以及计算面积和体积的方法，以及对π的近似值。\n\
  \n12 世纪中期，精通阿拉伯语的英国学者罗伯特·切斯特（Robert of Chester）住在西班牙，那里穆斯林、犹太教和基督教文化交织在一起，有时和平，有时则不那么。这是另一个思想在不同文明之间交流和传播的时刻。1145\
  \ 年，罗伯特将《还原与归归》翻译成拉丁语。`Al-jabr` 变成了“algeber”，而阿尔·花子米变成了“Algoritmi”。在当时，“algorismus”泛指任何使用印度-阿拉伯数字的数学程序，而实践这种艺术的人被称为\
  \ algorists。（该术语在 2000 年被开始使用算法过程的视觉艺术家所采用。）\n\n## 计算机编程的发明\n\n所有计算机都由 0 和 1 构建。1822\
  \ 年，英国发明家查尔斯·巴别（Charles Babbage）概述了他名为差分机（`Difference Engine`）的天文学表概念。这台机器从未完全建成，但他后改进的分析机（`Analytical\
  \ Engine`）如果建成，可以通过打孔片接收指令并执行循环等简单功能。\n\n爱达·洛芙莱（Ada Lovelace）是拜伦勋族的女儿，现在被广泛认为是第一位计算机程序员；她为巴别设计的机器编写了算法，包括伯努利数（`Bernoulli\
  \ numbers`）。洛芙莱还意识到，机械过程可以应用于数学之外的领域。1843 年，洛芙莱写道，分析机“如果能发现其相互关系可以用运算关系来表示的对象，那么它就可以作用于数字以外的其他事物。”换句话说，任何可以转化为类似数据（一系列数字）的东西都可以以公式化的方式进行处理。这可能包括文本、音乐、艺术，甚至是像象棋这样的游戏。\n\
  \n洛芙莱想象了这种自动化的一种形式：“例如，如果和律科学和音乐创作中音高的基本关系可以进行这种表达和适应，那么机器就可以创作出任何复杂程度或范围的精妙科学音乐作品。”她想象的是类似于作曲家布莱恩·埃诺（Brian\
  \ Eno）在 1995 年并推广的“生成式音乐”——一系列由音乐软件驱动的氛围合成器作品，软件每次运行都会创建不同的旋律。洛芙莱设想的是文化如何被这种新技术所塑造和延续，就像今天的算法推送所做的那样。\n\
  \n洛芙莱早早发现，操控这样的机械命令本身就是一种形式和自我表达。在 20 世纪 90 年代和 21 世纪 00 年代，计算机编程开始与基础数学科学并列，成为儿童完整教育所需的技能。我在\
  \ 2002 年左右在高中计算机室的电脑上接触到了它，我们在那里玩类似于编程语言的教育视频游戏。但我真正学到它是在我们为了高级数学课而配备的厚塑料 `TI-83`\
  \ 计算器上。这些计算器具有使用一种名为 `TI-BASIC` 的语言进行编码的能力，这种语言有简单的 `if-then` 循环和变量函数。起初，我编写了一些简单的程序来自动处理测试所需的公式，但一旦我对这种语言变得更加精练，我就制作了自己的版本的井井棋和四子棋。\n\
  \n\n\n\n在洛芙拉斯之后的百年后，第二次世界大战期间，英国数学家和计算机科学家艾兰·图灵在政府从事破译工作——他帮助破译了德国的恩尼玛（Enigma）密码机。1946\
  \ 年，战争结束后，图灵为国家物理图书馆写了一份报告，建议开发一种“自动计算机”。这是对人工智能作为一种现实可能的首次描述。\n\n根据图灵，这种设备能够在任何规模下执行任何种计算，而无需重新配置。它有自己的内部逻辑语言，可以适应不同的目的来解决任何类型的问题。“人们如何指望机器完成这所有事情呢？”图灵写道，“答案是我们应该认为机器在做非常简单的事情，即以它能够理解的标准形式执行指令。”它将执行算法。这种系统将比人类快快的速度和更复杂的水平进行计算，远超人类。图灵写道：“机器的速度不再受限于人类操作的速度。”仅仅因为它们是自动的，并不意味着它们总是是正确的。“人类的易错性被消除了，尽管它在某种程度上被机械的易错性所取代。”然而，图灵并没有将这些机器视为乌托邦式的工具。\n\
  \n早在 1936 年，图灵就构思了现在被称为“图灵机”的东西，他在 1948 年的一篇名为《智能机器》的文章中详细勾勒。图灵机是“一条被划分为格子的无限带带，每个格子上都可以打印符号”。带带通过一个读取器移动，一次扫描一个格子并执行由符号指示的操作，格子也可以被擦除或覆盖。任何历史意义上的数学过程，算法都可以由这样的图灵机计算。任何图灵机可以计算的计算系统都被说是“图灵完备的”。例如，所有的编程语言都是图灵完备的，因为它们可以模拟任何方程。（甚至是表格软件\
  \ `Excel` 在 2021 年也变得图灵完备。）图灵得出的结论是，任何计算机都能完成其他机器的工作——如果给予无限的规模和时间，巴贝奇十九世纪的分析机理论上可以执行我们笔记本电脑完成的复杂任务。\n\
  \n在图灵的生活中，也存在机械规则与人类操作之间的冲突。1952 年，图灵因“同性恋表达”（与另一个男性发生性关系的法律术语）被指控犯有严重猥亵，这是在他自己的房子被抢劫后起的混乱法律诉讼期间。在英国，成年人之间的同性性直到\
  \ 1967 年仍然非法——法律是它自己的算法，根据一套不可动摇的规则做出判断。图灵最终对指控认了罪。他没有被入狱，而是被迫接受了化学阉割。1954 年 6 月，41\
  \ 岁的图灵被管家发现死亡。原因是氰化物中毒，他的死一直以来被认为是自杀，怀疑的媒介是图灵床边被吃了一半的苹果。\n\n当我们谈论“算法”时，往往感觉像是一种最近在社交网络时代才出现的力量。但我们讨论的是一种在互联网存在之前的几个世纪里缓慢形成的历史和遗产的技术。恢复这一宏大背景可以帮助我们更好地理解今天算法所拥的力量。尽管无论算法多么复杂，它本质上仍然是一个方程：一种得出预期结论的方法，无论是将谷物平均分配给几个人的苏米尔图表，还是在当你打开网站时决定向你展示哪条\
  \ Facebook 动态的内容。所有算法都是自动化的引擎，而且正如阿达·洛芙拉斯预言的那样，自动化现在已经进入了我们生活中纯数学之外的许多方面。\n\n##\
  \ 算法决策\n\n1971 年，在智利圣地亚哥，市中心的办公大楼内建造了一个被设计为整个国家控制室的六角形房间。显示器和背光显示屏装饰着房间的木护板墙，显示着如国家原材料供应和劳动力参与率等指标的数据读取。七把椅子在房间中心围成圈面对面坐，白色玻璃纤维高背椅看起来像科幻小说中的太空巡洋舰船长椅。每把椅子的右侧都有一个控制面板用于导航各种屏幕，还有一个烟灰缸和一个杯架，可能是为了放一杯威士忌。这个房间在较大的\
  \ `Project Cybersyn` 项目庇护下被命名为操作室，它是在智利社会主义总统萨尔瓦多·阿连德的领导和斯塔福德·啤酒的咨询下设计的，啤酒是一个英国人，他在他自己的国家以将“控制论”实践应用于企业管理而闻名。啤酒将控制论描述为“控制的科学”。它涉及分析复杂系统（无论是公司还是生物学），并确定它们如何工作以便更好地建模或创建这种智能的、自纠的系统。（在美国，类似的系统分析实践是由\
  \ `RAND Corporation` 在 20 世纪 50 年代开创的。）`Project Cybersyn` 旨在提供一个理想模型，在智利政府的决策者坐在房间里抽香烟、喝威士忌时为他们提供实时帮助——这是又一次冷冰冰的技术与混乱的人性的会面。`Project\
  \ Cybersyn` 的物理设计由德国顾问吉·邦斯耶佩领导，创造出一种中世纪现代主义乌托邦的形象。显示器悬浮在墙上，隐藏的布线将它们连接到椅子上。驾驶舱椅本身光滑且统一，以一种成型形状平滑弯曲。这个房间象征地将政府简化为对数据的操控，就像玩视频游戏一样。\n\
  \n\n\n然而，赛博计划（Project Cybersyn）的技术只是一个假象，类似于“设计虚构”——一种对可能性的交互式幻想。它所承诺的内容在当时的计算机网络下是实现的。它的数据幻灯片是手工创建的，而不是自动生成的。它在单台计算机上运行，由电传机供，智利工厂可以使用这些机器通过电话线发送信息。最后，尽管房间已经竣工，但它从未投入运行。1973\
  \ 年 9 月 11 日，在美国`CIA`的协助下，阿永德政府被推翻，奥古斯托·皮诺切特接管了。\n\n赛博计划的照片仍然具有着不可否认的吸引力。它们反复出现在设计情绪板中，投影出一种在几十年后看起来仍然像未来的审美。也许这些图像之所以如此有力，是因为我们保留了这样一个梦想：将现实的原始数据处理并计算成数字图表，然后进行评估，并据此确定正确的行动路径。赛博计划散发出一种无不可击的气质，尽管像`Turing`这样的发明者知道计算机无法运行得如此完美。正如控制论先驱`Stafford\
  \ Beer` 所说的，我们倾向于使用机器来自动化已经存在的结构和过程，而这些结构最初就是人类的产物。`Beer`在他 1968 年的书籍*Management\
  \ Sciences**中写道：“我们将钢铁、玻璃和半导体尊奉了那些手、眼、脑的局限性，而计算机的发明恰恰是为了超越这些限制，”指出了其中的悖论。正如“机械象棋”一样，人类依然存在于机器之中。\n\
  \n今天确实有了算法政府和算法生活的版本：银行使用机器学习来决定谁获得贷款；`Spotify`利用你过去的行为数据来决定推荐歌曲，它们认为与你的感性最契合的歌曲。但实现这些成就的技术并不像赛博计划。没有六角形房间或翼背椅。算法已变得既无形又无处不在，包含在我们随身携带的手机应用中，而它们的数据物理上托管在遥远的地方，位于设置在自然景观偏僻位置的巨大空调服务器农场内。赛博计划暗示由数据驱动的世界可能是连贯且易于理解的，包含在一个房间内；而我们现在知道它是抽象且弥散的，无处不在却无无处。我们被鼓励忘记算法的存在。\n\
  \n新技术的出现不可避免地创造新的行为形式，但这些行为很少是发明者预期的。技术有其内在的意义并最终显现出来。`Marshall McLuhan`在他 1964\
  \ 年的书籍*Understanding Media: The Extensions of Man**中写下了著名的格言“媒介即信息”。他的意思是，新媒介——电灯、电话、电视——的结构比其传输的内容更重要。电话连接人们的能力超过了任何特定的对话。“任何媒介或技术的‘信息’是它引入人类事务的规模、步调或模式的改变，”`McLuhan`写道。在我们的案例中，媒介是算法推送；它规模了并加速了人类在全球范围内的互联互通，达到了无法想象的程度。它的信息是，在某种层面上，我们的集体消费习惯翻译成数据后，汇聚成了同一性。\n\
  \n## 推荐算法的工作原理\n\n算法是将一系列输入转换为特定输出的数字机器，就像工厂里的传送带。让一个算法与另一个算法不同的，与其说是它们的结构，不如说是构建算法的成分。所有的推荐算法都通过收集一组原始数据来工作。该数据集的总术语是`signal`（信号），即输入机器的收集到的输入。信号数据可能包括用户在`Amazon`上的过去购买记录，或者有多少其他用户在`Spotify`上收藏了某首歌曲。数据是定量的而非定性的，因为必须能够被机器处理。所以，即使数据是关于像音乐偏好这样主观的事物，它也被翻译成数字：`x`个用户对`y`乐队的评分为`z`，或者`x`个用户听了`y`乐队`z`次。输入到许多社交媒体推荐的首要信号是`engagement`（参与度），它描述了用户如何与内容进行交互。这可能以点赞、转发或播放的形式出现——帖子旁看到的任何类型的按钮。高参与度意味着点赞、观看量或分享的数量高于其他帖子的平均水平。\n\
  \n信号通过`data transformer`（数据转换器）传输，将其封装成可用的包，供不同类型的算法处理。参与度数据可能需要与评分数据或关于内容主题本身的数据分开。`social\
  \ calculator`（社交计算器）可能被用于添加有关用户在单一平台内相互关系的信息——例如，我经常与我的朋友`Andrew`的`Instagram`帖子互动，这会让推荐系统更有可能在我的个人动态中将他的某条帖子排在高位。\n\
  \n然后是单个算法的特定方程。在今天的平台中，很少只有一组算法——有很多组。我们正在经历的是一系列不同的方程，这些方程考虑数据变量并以几种方式对其进行处理。其中一个方程仅根据参与度计算结果，可能找到平均参与度最高的内容；而另一个方程则为特定用户优先考虑某条内容的社交背景。这些算法还会相互进行权衡。`Hybrid\
  \ filtering`（混合过滤）是在使用了多种技术时。最后，`output`（输出）是推荐本身，即自动播放列表中的下一首歌或按顺序排列的帖子列表。例如，算法决定是否应该在你的\
  \ Facebook 动态中将一个朋友的动态更新排在政治新闻之上。\n\n音乐目录分类和推荐服务`Pandora`的一位高管曾向我描述该公司的系统为一个算法的“交响乐团”，并配有一个“指挥家”算法。每个算法都使用不同的策略来产生建议，然后由指挥家算法决定在特定时刻使用哪些建议。（唯一的输出是播放列表中的下一首歌。）不同的时刻需要不同的算法推荐技术。\n\
  \n不存在单一的、整体的“算法”，因为每个平台都以自己的方式运行，结合了自定义变量和方程组。记住，Facebook 动态的工作方式是一个商业决策，就像食品制造商决定使用哪些成分一样。算法也会随着时间改变，通过机器学习进行自我完善。它们吸收的数据被用于逐渐改进，以鼓励更多的参与度；机器适应用户，用户也适应机器。\n\
  \n\n\n作为用户，我们本质上并不理解算法推荐在日常是如何运作的。它们的方程、变量和权重是不公开的，因为科技公司几乎没有动力公开它们。它们是严密保护的商业秘密，对于业务而言，其重要性几乎就像核代码一样，且极少被披露或暗示。其中一个由于是，如果算法公开公开，用户就可以操纵系统来推广自己的内容。另一个由于是对竞争的恐惧：其他数字平台可能会窃取这些“秘密配方”并做出更好的产品。然而，这些工具像许多数字技术一样，最初是在非商业背景下起步。\n\
  \n### 推荐算法的起源\n\n推荐算法作为一种自动处理和排序信息的方法，于 20 世纪 90 年代开始投入实践。最早的例子之一是一个邮件排序系统——直到今天，这仍然是一项烦人的杂事。即使在\
  \ 1992 年，施乐公司帕洛阿尔托研究中心（广被称为 `PARC`）的工程师们已经对此应接不暇。David Goldberg、David Nichols、Brian\
  \ M. Oki 和 Douglas Terry 在 1992 年的一篇论文中写道，他们试图解决“电子邮件使用的日益增加导致用户被海量的 `Incoming`\
  \ 文档流所淹没的问题”。（他们当时并不知道我们在 21 世纪将面临如此巨大的数字通信量。）\n\n他们的邮件过滤系统名为 `Tapestry`，它同时使用两种算法：“基于内容的过滤”和“协作过滤”。前者已用于若干邮件系统，它通过评估邮件的文本——例如，如果你想优先处理所有包含\
  \ `algorithm` 一词的内容。但后者，这种更具创新性的技术基于其他用户的行为。谁打开了某封邮件以及他们如何做出反应，将纳入系统对该邮件的优先考虑因素中。正如论文描述的那样：\n\
  \n> 人们通过记录对所读文档的反应来协助彼此执行过滤。这些反应可能是某份文档特别有趣（或特别无趣）。这些反应更通俗地称为注释，可以被他人的过滤器访问。\n\n\
  `Tapestry` 使用一个 `filterer`（过滤器）对一组文档运行反复查询，一个收集可能让用户感兴趣材料的“小盒子”，以及一个可以对文档进行优先级排序和分类的\
  \ `appraiser`（评估器）。从概念上说，它与我们现在看到的算法推送非常相似：`Tapestry` 的目标是呈现最可能对用户重要的内容。但这种系统需要用户投入更多的前期行动，用户必须根据内容或其他用户的行为编写查询语句，以确定他们想看什么。系统中的其他用户也必须执行非常有意图的行动，反过来将材料标记为引人入胜或无关。这样的系统需要一小群相互认识并理解其群体如何与邮件交互的人——例如，你可能需要预先知道\
  \ Jeff 只回复特别重要的邮件，因此你希望你的过滤器能呈现所有 Jeff 回复的邮件。`Tapestry` 在非常私密的规模下运行效果最好。\n\n###\
  \ 社交信息过滤\n\n1995 年，麻省理工学院媒体实验室（MIT Media Lab）的 Upendra Shardanand 和 Pattie Maes\
  \ 的的论文描述了“社交信息过滤”，这是一种“根据该用户兴趣偏好与其他用户偏好之间的相似性，从任何类型的数据库向用户提供个性化推荐的技术”。在 `Tapestry`\
  \ 想法的基础上，它是对在线信息过载的一种回应：“事物的数量远远超过任何人可能通过过滤来找到他或她会喜欢的内容。”他们得出结论，自动过滤器是必要的：“我们需要技术来帮助我们穿过所有信息，找到我们真正想要和需要的项目，并摆脱我们不想被打扰的东西。”（当然，这在网上仍然是一个巨大的问题。）\n\
  \nShardanand 和 Maes 认为，基于内容的过滤有显著缺点。它要求将材料转换为机器可以理解的数据（如文本）；它缺乏意外惊喜，因为只能根据用户输入的术语进行过滤；而且它不衡量内在质量。它无法“区分一篇写得好的和一篇写得糟糕的文章，如果这两篇文章使用了相同的术语”。无法对质量进行评估的能力让人想起了人工智能：像\
  \ `ChatGPT` 这样的新工具似乎能够理解并生成有意义的语言，但实际上，它们只是重复其所训练的预存数据中固有的模式。质量是主观的；在缺乏人类判断的情况下，仅凭数据在衡量质量方面是有限的。\n\
  \n### Ringo 系统\n\n社交信息过滤回避了这些问题，因为它由人类用户的行为驱动，由他们自己评估内容——使用定量和定性的判断。它更像口口碑，就像我们从偏好与我们相似的朋友那里获得关于听什么或看什么的建议：根据论文描述，“根据其他具有相似品味的人所分配的值向用户推荐项目。”一个用户的口味与其他用户的相似性是使用统计相关性计算的。\n\
  \n研究人员设计了一个名为 `Ringo` 的系统，使用邮件列表进行音乐推荐。当用户评估音乐时（对第一批 125 位艺术家进行 1 到 7 分的评分），一张他们的偏好图表就随之建立了。然后，通过将该图表与其他用户的图表进行比较，系统建议他们可能喜欢的音乐——或者讨厌的音乐，后者也是一个选项。`Ringo`\
  \ 的推荐附带有置信度衡量，指示了建议正确的概率，并允许用户进一步考虑算法选择。到 1994 年 9 月，`Ringo` 已拥有 2100 名用户，每天有 500\
  \ 封邮件评估音乐。\n\n`Ringo` 测试了各种特定算法来根据评分做出决策：\n1. 第一种算法衡量用户口味之间的差异，并根据最相似的用户进行推荐。\n\
  2. 第二种算法衡量相似性，然后利用与其他用户的正负相关性做出决策。\n3. 第三种算法确定不同艺术家之间的相关性，推荐与用户已喜欢的艺术家强相关的艺术家。\n\
  4. 第四种算法（根据研究人员的说法，是最有效的）根据用户是否对相同项目给出正面或负面评价来匹配用户。\n\n换句话说，他们的口味是匹配的。“相似性”是最好的变量。系统中的用户越多，用户提供的前期投入越多，`Ringo`\
  \ 的效果就越好——某些用户甚至描述它为“准确得令人不安”。`Ringo` 的创新在于它承认了最好的推荐（或最相关的指示）可能来自其他人类，而不是对内容本身的分析。它代表了人类品味的扩展。\n\
  \n### 结论\n\n早期的互联网算法旨在从海量材料中筛选出对用户重要的内容，并以连贯的方式呈现。推荐是其目标：推荐信息、歌曲、图像或社交媒体更新。算法推送有时被更正式、更字面地标记为“推荐系统”，对应于选择内容的简单行为。\n\
  \n\n\n\n第一个完全主流的互联网算法，几乎每个互联网用户都遇到过的，是 `Google Search` 算法。1996 年，在斯坦福大学学习期间，Google\
  \ 的创始人谢尔盖·布林（Sergey Brin）和拉里·佩奇（Larry Page）开始开发后来成为 `PageRank` 的系统，这是一个爬取互联网（当时总共可能有一亿文档）并识别哪些网站和页面比其他页面更有用或更有信息的系统。`PageRank`\
  \ 的原理是衡量其他网站链接某个网站的次数，类似于学术论文引用过去关键研究的方式。链接越多，页面可能越重要。布林和佩奇在 1998 年的一篇论文《大规模超文本网络搜索引擎的解剖》中写道：“引用指标‘与人们对重要性的主观想法相吻合’。”`PageRank`\
  \ 将协同过滤与内容过滤混合在一起。通过链接各种页面，人类用户已经形成了一个主观的推荐地图，算法可以将其纳入。它还衡量了诸许多因素，如页面上的链接数量、链接的相对质量甚至是文本的大小——文本越大，对于特定搜索词的相关性可能越高。`PageRank`\
  \ 较高的页面更有可能出现在 Google 搜索结果列表的顶部。\n\n佩奇和布林预测他们的系统随着互联网的增长而保持功能性和可扩展性，这是正确的。几十年后，`PageRank`\
  \ 已变得近乎专权，成为一个主宰网站如何以及何时被看到的系统。对于企业或资源来说，适应 `PageRank` 算法进入 Google 搜索结果的第一页至关重要。21\
  \ 世纪初，我曾仔细浏览许多连续的 Google 结果页以找到我确切想要的东西。Google 现在会将它认为相关的文本置顶，从网站中提取并直接显示在搜索页面顶部的用户面前，位于实际结果之前。因此，诸如“我可以给我的狗喂胡萝卜吗？”这样的查询——我在养狗初期不断谷歌这类问题——将直接提供答案，而用户无需加载另一个网站，进一步巩固了\
  \ Google 的权威地位。弗朗西斯·培根在 16 世纪写道：“知识本身就是力量”，但在互联网时代，分类知识可能更加强大。现在信息很容易找到且海量丰富；理解它、知道哪些信息是有用的，要困难得多。\n\
  \n佩奇和布林希望他们的系统保持相对中立，仅根据相关性评估每个网站。算法的指令是为用户优先提供最好的信息。将搜索迎合特定的网站或业务会破坏结果。这两位创业者在\
  \ 1998 年写道：“我们预计广告资助的搜索引擎本质上会偏向于广告商，而忽视消费者的需求。”然而，在 2000 年，他们推出了 `Google AdWords`\
  \ 作为公司针对广告商的试点产品。今天读他们的批判是有趣的，因为广告现在提供了 Google 绝大部分的收入——2020 年占比超过 80%。随着 `PageRank`\
  \ 吸引了数十亿用户使用 Google 搜索，公司还可以追踪用户在搜索什么，从而可以在特定的搜索查询中向广告商出售空间。用户看到的广告与搜索结果一样，也受到算法的信息。而建立在搜索算法之上的广告，将\
  \ Google 变成了一个巨头。\n\n## 算法过滤与电子商务\n到 21 世纪初，算法过滤就已经主导了我们的数字体验。Amazon 网站早在 1998 年就开始使用协同过滤来为客户推荐购买的产品。该系统并不是像\
  \ Ringo 那样尝试通过衡量相似的用户画像来估算品味，而是通过确定哪些物品可能被捆带购买——例如，一个摇铃和一个奶瓶。一篇由 Amazon 员工合著的 2017\
  \ 年论文描述了网站上此类建议的轰炸：\n\n> 首页显著地显示了基于你过去的购买记录和浏览物品的推荐……购物车推荐了其他要添加到购物车的物品，也许是最后时刻的冲动购买，或者是你正在考虑的物品的补充。在你的订单结束时，出现了更多推荐，建议稍后下单。\n\
  \n算法推荐类似于 Trader Joe's 结账台前的货架，最后推销你可能需要的产品。但在这种情况下，推荐的内容是针对每个网站用户定制的，正如论文所描述的，“为每个客户提供一个商店”。Amazon\
  \ 发现，个性化产品推荐在点击率和销售方面比横幅广告和畅销列表等非个性化营销策略有效得多。推荐算法改进了业务，对客户来说也更加方便，他们可能会发现自己不知道需要的东西。\n\
  \n早期的算法过滤的是个人电子邮件、音乐人（而非特定歌曲）、网页和商业产品。随着数字平台的扩张，推荐系统进入了更复杂的领域，并以更快的速度和更大的规模运行，过滤数百万条推文、电影、用户上传的视频，甚至是潜在的伴侣。过滤成了在线的默认体验。\n\
  \n## 算法的本质\n这段历史也提醒我们，推荐系统不是全知的实体，而是由技术人员或工人构建的工具。它们是有缺陷的产品。Nick Seaver 是特普斯大学的一位社会学家和教授，他研究推荐系统。他的研究关注算法的人性侧面，即制造算法的工程师如何思考算法推荐。在与他的讨论中，Seaver\
  \ 总是确保澄清算法这一模糊实体，将单个方程与其设计背后的公司动机以及对用户的最终影响离开来。“算法是整个公司的代名词，”他告诉我，“Facebook 算法不存在；Facebook\
  \ 存在。算法是讨论 Facebook 决策的一种方式。”\n\n技术本身不是问题——你不能像归罪工程缺陷一样归罪算法本身。而且，为了让数字平台上的海量内容变得易理解，某种程度的重新排序是必要的。过滤世界的负面方面可能是因为技术应用得太广泛，而没有充分考虑用户体验，而不是针对他们的广告商。\n\
  \n\n\n\n我对社交媒体最早有意义的记忆来自于 Facebook，我是在接受了特夫斯大学（Tufts University）的录取录取后加入了它，我并在那里读了大学。在\
  \ 2006 年夏天，潜在用户需要一个官方的 `.edu` 邮箱地址才能访问该平台的完整大学板块。与如今的结构相比，早期版本的 Facebook 几乎让人无法认出来。那时，Facebook\
  \ 的范围受到严格限制；我主要将其用作与其他即将入学的特夫斯学生联系的手段。如果说今天的 Facebook 是一条每隔几秒就有出口和汇入口的繁忙高速公路，那么在\
  \ 21 世纪初，它更像是一个高中的休息室，一次只能几个人待在一起。你可以建立简介，在简介上更新状态，并加入围绕共同兴趣的小组——除此之外没有别的。\n\nFacebook\
  \ 并非在线社交的首种方式。Friendster 和 MySpace 是它的前身。`AOL` 的即时通讯和 `Google` 的 `gChat` 提供了与朋友实时相处的迷人方式。到\
  \ 2006 年，我已经在旧的论坛网站上花费了数百小时讨论视频游戏和音乐。但扎克伯格的 Facebook 将在线身份连贯且一致地与线下世界联系起来。该平台鼓励用户使用真实姓名而非晦涩的代名，并影响了大学这个小世界里的现实生活计划：举办派对、策划学术活动以及处理人际关系。通过这种方式，它为数百万乃至数十亿用户的在线社交生活主流化铺平了道路。\n\
  \n### 动态消息的崛起\n\n2006 年 9 月，在我加入该网络不久后，Facebook 实施了它最大的变化之一，这一功能将决定它未来作为互联网上“百货百卖”超级大卖场的发展方向。`News\
  \ Feed`（动态消息）——一个包含更新、帖子和提醒的运行列表——成为了平台的核心功能。它是无法被忽视的，就像一条穿过安静村庄的新筑高速公路。“现在，每当你登录时，都会收到由你的朋友和社交小组活动生成的最新头条，”Facebook\
  \ 的官方更新说明中写道。\n\n该当年申请的 `News Feed` 专利虽然直到 2012 年才获得授权，但它描述了其目的：“一种系统和方法，为社交网络环境中使用电子设备的人提供动态选择的媒体内容。”换句话说，`News\
  \ Feed` 是由算法决定的信息流，算法决定向用户展示什么。另一项专利声称能够“为基于网络的社交网络成员生成个性化的动态基于关系的内容”。起初，`News Feed`\
  \ 仅仅是一系列关于恋爱状态改变和头像更新的公告流。它并没有特别的威胁。\n\n`News Feed` 专利申请中较长的描述暗示了一个协同过滤系统，其运作规模比\
  \ 20 世纪 90 年代的电子邮件系统大得多。值得全文引用，因为它预测了随后的十年里，在线生活的很大一部分——从社交网络到流媒体和电子商务——变成了什么样子：如此由公司而非用户主导的自动化推送，逐渐在用户和内容流之间形成了一种更具被动的关系。\n\
  \n> 根据用户与一个或多个用户的关系，为用户选择媒体内容项。用户与其他用户的关系反映在所选的媒体内容及其格式中。媒体内容项被分配一个顺序，例如，根据它们对用户的预期重要性，并按照分配顺序将媒体内容显示给用户。用户可以更改媒体内容的顺序。对用户与社交网络环境中可用媒体内容的交互进行监控，并利用这些交互为用户选择额外的媒体内容项。\n\
  \n### 算法逻辑\n\n算法流的所有元素都出现在这段文字中——这是一种能够预测某项内容对单个用户的相对重要性的系统，该重要性通过对他们过去参与的内容进行监控来确定，并将根据认为最可能同样吸引人的内容推送到列表顶端。目标是过滤内容以选择最有趣的内容，从而鼓励用户消费更多内容并总体关注更多账号。用户能够更频繁地使用社交媒体并在网站上停留更久，这使得它们具有可行性。（如果我们的朋友在\
  \ Facebook 上不活跃，我最近几年就是如此，那么我们可能也会减少活动。）\n\n起初，`News Feed` 完全是按时间顺序排序的，最新的更新排在前，但它逐渐遵循了更复杂的算法逻辑。随着\
  \ Facebook 的增长和用户增加更多连接（从个人关系扩展到出版物和品牌），个人更新量增加了。随着时间的推移，更新不再仅仅是朋友的琐碎笔记，而是来自小组的消息、新闻故事的链接以及销售公告。普通用户无法希望跟上具有如此数量和多样性的帖子时间流，最终，消费的规模和速度使得激进的过滤变得必要。\n\
  \nFacebook 带有标志性大指符号的 `Like` 按钮于 2009 年推出，提供了关于用户对特定内容感兴趣程度的一种数据。用户参与度通过点赞、评论以及一个账号与另一个之前的交互来衡量，影响了动态流的排序。该算法系统被称为\
  \ `EdgeRank`，Facebook 将其主要变量确定为亲密度分、边权重和时间衰减。“Edge”指的是人们在 Facebook 上执行的任何动作，然后作为更新发送到\
  \ Feed。`affinity score`（亲密度分）代表用户与发布者之间的联系程度以及这种联系的强度（例如，持续在朋友帖子下评论）。评论比点赞计数，最近的交互比旧的交互计数。`edge\
  \ weight`（边权重）评估不同类型的交互：朋友发布新照片的更新算法权重可能高于发布新闻链接或加入新小组。`time decay`（时间衰减）是动作的年龄；在其他因素相等的情况下，最近的动作比旧动作更有可能出现在\
  \ Feed 顶部。`EdgeRank` 分数不是一次性永久分配的（就像锦标赛篮球赛的结果一样），而是时时刻变化的。\n\n\n\n\n算法推送本身并不是一贯的，也不是通向某种终极完美的线性路径。它随着公司优先事项的变化而改变。2011\
  \ 年，Facebook 将新闻动态（News Feed）描述为“你自己的私人报纸”，暗示其目标是将社交更新与外部世界的新闻故事相结合。2013 年，它表示其算法致力于“检测被定义为高质量的内容”。但在整个\
  \ 2010 年代，追逐那些公司评定为“高质量”的任何内容，在某种程度上是一场荒谬的游戏。如果你想让你的 Facebook 帖子获得关注——这对于新闻出版物和自由撰稿人来说是一个大问题——你必须猜猜什么样的材料正在获得优先考虑。这种关系几乎是对立的；只有当你“玩弄”（gamed）算法时，你的声音才会被听到。你不能再依靠那些关注或添加你好友的用户能看到你的帖子。\n\
  \n在我从事自由记者生涯的某个时期，我记得流传着一个传言，说算法对文章链接的权重不再很高了。因此，我们不再直接通过简单的链接发布故事，我和许多其他记者会在评论帖子时才添加故事链接。这种做法据称可以提高算法的推广力度，尽管这对读者来说更加困惑。在另一个时期，事实变得明确：编写像婚礼公告的文字以及写“祝贺”的评论会将帖子推送到动态的最顶部。因此，我开始分享关于虚假婚礼或其他人生里程碑的文章。这些现象表明，当用户试图操纵算法或规避检测时，算法是如何扭曲语言本身的。最近，在\
  \ TikTok 上，出现了一些委婉语，用来替代触发算法屏蔽或限流视频的词：用“unalive”（取消生命）代替“杀死”，用“SA”代替性侵犯，用“香辣茄子”代替震动器，正如记者泰勒·洛伦斯在《华盛顿邮报》中记录的那样。这种词汇被称为“算法语”（algospeak）：即按照算法形象塑造的语言。\n\
  \n我不清楚我在 Facebook 上使用的这些技巧是否有多大影响，但我愿意为了接触潜在读者尝试任何方法。这就像为 Google 搜索引擎优化设计网站一样：记者根据算法的指标优化内容，或者至少根据我们感知的指标进行优化。这个过程感觉是操纵性的，有时带有卡夫卡式的荒诞感；我们面对一个看不见、不可理解且不断变化的对手。\n\
  \n在 2015 年左右，Facebook 决定优先考虑视频内容，因此推荐算法比以前推广视频的频率得多。媒体公司随后“转型”制作视频以追逐那部分观众，有时还会得到\
  \ Facebook 本身的资金支持。这种努力只持续了几年，然后 Facebook 再次降低了视频的优先级，导致这些媒体公司（包括 BuzzFeed、Mashable\
  \ 和 MTV）出现了一波裁员潮。（在计划结束后，根据一起诉讼，还发现 Facebook 在视频获取的流量数据上撒了谎，将数字夸大了高达九倍。）算法推送不断变化着。2016\
  \ 年，Facebook 在帖子上添加了“反应”（reactions），让观众可以使用一系列表情符号进行回应，而不仅仅是“赞”按钮。收到许多表情反应的帖子会获得更多推广。但这种变化也适得其反，因为煽动性内容——例如收到许多愤怒脸表情反应的帖子，如引发愤怒的政治报道——获得了过多的推广，并破坏了整个网站的基调。它们吸引了更多互动，但这并不意味着这些帖子一定更有价值。\n\
  \n不仅仅是 Facebook 从时间顺序动态变为不断增加的算法推荐。几乎每一个主要的社交网络在 2010 年代都遵循了同样的路径。随着算法化的加剧，“过滤世界”（Filterworld）在那个年代的中期开始成型。\n\
  \nFacebook 在 2012 年收购了 Instagram，当时它只有 13 名员工。在过去的几年里，这个照片共享应用已变得越来越像 Facebook 本身，从朋友上传的照片的线性动态转变为视频、广告和推荐帖子的流。2016\
  \ 年 3 月，Instagram 动态开始从时间顺序排列转变为算法排列。这种变化在小用户组中进行了测试，然后推广到越来越多的人手中，直到覆盖所有人。这种越发无序的动态引发了某种困惑和焦虑感，类似于有人在\
  \ fact 不知情的情况下重新摆放了你家里的家具。以前，通过滚动动态，你是在回到过去。但突然之间，一条两天前的帖子出现在了你动态的最上方。\n\n2016 年初，Twitter\
  \ 也变得不那么注重时间顺序了，在用户首次登录应用时曾短暂地将算法动态设为默认设置——对于一个许多人将其用作实时新闻条的网站来说，这是一个问题。（时间顺序选项被称为“Twitter\
  \ 经典版”，就像它是一种受喜爱的垃圾食品口味一样。）后来，应用程序会在一段时间后自动将用户切换到算法动态，并强制他们退出。尽管 Netflix 的内容推荐长期以来一直是算法驱动，但\
  \ 2016 年也是该流媒体服务开始更改其主页界面、将推荐置优先并为每个用户进行个性化的时期。\n\n这种转变导致了用户以及公司本身可能未预料到的更深文化影响——就像筑坝河流会改变整个生态系统一样。当动态是算法驱动时，它们对不同的人呈现方式不同：你无法知道在特定时间其他人在看什么，因此更难在线上与他人产生社区感，即你在电影院看电影或观看预设电缆电视节目时可能感受到的集体感。“过滤世界”的标志着单一文化的崩溃。它具有某些优势——我们比以往任何时候都能消费更广泛的媒体——但它也有负面影响。文化本应是社区性的，并需要观众之间存在某种程度的一致性；没有了共同性，它就会失去一些核心影响力。\n\
  \n\n\n\n在马尔塞尔·普鲁斯特那部宏大的 20 世纪初小说*追寻逝去的时光*中，他在技术演变的背景下，挖掘了个人感官如此细微的变化。在其中一段中，普鲁斯特叙述者将电话描述为“一种超自然的仪器，我们曾对其奇迹感到惊叹，而现在我们却不经思索地用它来唤醒裁缝或订购冰淇淋。”电话才在\
  \ 19 世纪末发明，这正是普鲁斯特小说背景所在的时代。到 1899 年，巴黎已有七千名电话用户。然而，电话已经变得平庸无奇。甚至在他最初的几次通话中，叙述者也对这个设备感到恼恼而非敬畏。普鲁斯特写道：“习惯只需要很短的时间就能剥夺我们所接触的神圣力量的神秘感，因此由于我的电话没有立即接通，我的第一反应是这非常漫长且非常不方便，我几乎决定要投诉。”\n\
  \n1933 年，日本小说家谷崎一郎通过《阴影礼赞》纪念了另一个技术变革时刻，这是一本关于电灯进入东京的长篇随笔。隐喻的开关已经拨动；在谷崎的一生中（他出生于\
  \ 1886 年），得益于 1867 年开始的西方入侵以及在日益全球化的浪潮和随后的文化冲突，电灯已从他国家的未知变成了无处不在。谷崎写道：“西方人对更亮光明的追求永无止境。”在文中，谷崎哀悼了由烛光这种老式昏暗感所激发的日本文化的独特形式，从家室内推拉门上金箔的光泽，到昏暗餐厅里味噌汤的浑浊外表：“我们的烹饪依赖于阴影，与黑暗密不可分。”\n\
  \n然而，谷崎无法忽视电力和其他新设备的吸引力：陶瓷马桶、暖气器和霓虹灯牌。“我并不是反对现代文明的便利性，”他写道。正如他在小说中描述描述的那样，这位小说家对电影院和现代建筑的热爱正如他欣赏传统一样。《阴影礼赞》追踪了技术如何变化、文化如何适应以及个人品味如何随之转移——这种模式在我们当代的“过滤世界”（Filterworld）中随处可见。\n\
  \n随着新技术的出现，奇迹很快变得平庸，其功能的任何小故障都会被感到烦扰，最终它变得可以忽略，奇迹被遗弃。我们忘记了生活并非总是这样的，忘记了我们无法直接与远方的人交流，忘记了天板灯并没有让每个房间都明亮，或者忘了我们的信息和媒体没有被机器自动过滤。算法推送（algorithmic\
  \ feeds）在我们生活中的存在感正是如此；算法往往不被考虑，就像家具的一部分，只有在它没有按照预期运行时才会被注意到，就像红绿灯或来水。\n\n## 捕捉算法焦虑\n\
  \n如果说下棋的“机械土耳其”（Mechanical Turk）是几个世纪前与（幻象）奇迹技术的邂逅，能够做出独立于人手的决策，那么我们现在每天在习惯依赖的数字空间里经历这种体验几十次。机器的影响之无处不在怎么强调都为不过。从我们通过公开指标来看，Facebook\
  \ 今天有近三亿用户。Instagram 有约 2 亿。TikTok 超过 10 亿。Spotify 有超过 5 亿。Twitter 有 4 亿。Netflix\
  \ 超过 2 亿。对于这些平台上的所有人来说，每一次互动、每一个被动消费的时刻都是通过算法推荐进行中介的。即使某些用户可以退出算法推送，他们的参与也贡献了驱动其他用户推荐的数据。这种天罗网是逃不掉。社交网络和流媒体服务已成为全球大部分人口代谢信息的主要方式，无论是音乐、娱乐还是艺术。我们现在生活在一个算法文化的时代。\n\
  \n技术公司一直寻求实现这种巨大的规模。对于这些实体来说，垄断性增长比用户体验的质量更重要，显然比通过服务推送进行文化分配更为重要。（数字平台并不具备像艺术博物馆那样的策展责任。）根据硅谷意识形态，对规模的追求远超过其可能产生的任何负面后果，正如马克·扎克伯格在\
  \ Facebook 的副安德鲁·博斯沃在 2016 年写的一份备忘录中所示：\n\n> 所以我们连接了更多的人。如果他们产生负面影响，这可能是糟糕的。也许暴露在霸凌者面前让某人失去了生命。也许有人在我们的工具协调的恐怖袭击中去世。尽管如此，我们仍然连接了人们。残酷的事实是，我们深信于连接人们，以至于任何让我们更频繁、更多地连接更多的人的事在*事实上*都是好的。\n\
  \n那段陈明地说明了这样态度：如果人们正在使用一个平台、保持参与和活跃，那么就被认为是成功的——无论他们在做什么。这种持续的参与是由自动化推荐维持的，交付下一个引人入胜的新闻标题或催眠般的娱乐发布。今天，很难想象创造出一个脱离算法推送的文化作品，因为这些推送控制了作品将如何向国际数字受众中的数十亿消费者展示。没有推送，就没有观众——创作品将仅存在于其创作者及其直接联系人之中。而想象在算法推送之外消费某些东西更加困难，因为它们的推荐不可避免地影响了电视上显示的内容、无线电里播放的内容以及书中出版的内容，即使这些体验并不包含在推送中。“过滤世界”溢到了处处。\n\
  \n特雷沃·博福恩（Trevor Boffone）是一位转行高中教师的戏剧学者，他对我算法文化的本质给出了恰当的描述：“表现好的电影是那些拥有 TikTok 粉丝的电影；告示牌单\
  \ 100 强是由 TikTok 决定的；你去巴恩与诺尔书店会看到一个 BookTok 展示桌，”他说。（BookTok 是 TikTok 上文学影响者社区的术语。）换句话之，一个文化作品要获得商业上的成功，它必须已经在数字平台上具有吸引力。博福恩的职业也受到了算法推送的影响。当他开始和青少年学生学习舞蹈动作并将视频发布在网上时，他很快在\
  \ Instagram 和其他平台上积累了数十万粉丝。他出现在国家级电视上，短暂地成为一个走红人物——舞蹈老师。在这些经历之后，他出版了一本关于舞蹈表演的学术专著，由于在\
  \ TikTok 上公众普及度的上升，这个主题对大学和编辑来说迅速变得更有吸引力。“今年这一个月，我对我工作的兴趣比过去十年加起来还要多，”博福恩告诉我。\n\n\
  博福恩的经历遵循了“过滤世界”的一个基本规则：在算法推送下，流行的变得更流行，而晦见的变得越来越不可见。成功或失败被加速了。“传统的 Instagram 帖子，它的生命取决于发布后的前三到五分钟，”博福恩说。如果一个帖子立即获得了互动，那么它可能会获得更多，反之亦然。这种动态可能是残酷的。当我发布了一张奇特的\
  \ Instagram 图片或一条冷门的推文而它没有得到多少回应时，这并不能阻止我多次查看以获取更多赞，尽管我知道我没有击中算法的大奖。\n\n\n\n\n\n\
  注意力的缺失不可避免地引发了一个问题：信息流推广的是什么？这在默中鼓励更安全的选择，促使人们趋同。谁获得推广也是一个问题。往往并非迷因或趋势的原始创作者，因其在算法信息流中的流行而获得声誉、关注，从而获得经济收益。TikTok\
  \ 舞蹈本身就是一个例子。TikTok 网红 `Charli D’Amelio` 在 2019 年因她在平台上的舞蹈视频而闻名。但她所推广并经常被归功于一个名为\
  \ `Renegade` 的动作，实际上是由来自佐治亚州的黑人少女 `Jalaiah Harmon` 早早创作的。`Renegade`是一系列非常适合 TikTok\
  \ 屏幕的正面动作，带有挥拳和扭胯动作——这组动作并不复杂，但也难以记忆，因此重新表演很有成就感。\n\nHarmon 最初在一家名为 `Funimate` 的\
  \ App 以及 `Instagram` 上发布了这段舞蹈。但 TikTok 的超算法信息流在 `D’Amelio` 粉丝的推动下，加速了其走向主流成名，尽管这也帮助抹去了\
  \ `Harmon` 的作者身份，因为 `D’Amelio` 没有引用她。来自边缘化群体的内容创作者无法像 `D’Amelio` 那种受过白人私立学校教育、受过训练的舞者那样获得媒体和关注，他们很难从\
  \ `Filterworld`（过滤世界）的浪潮中获益。（自从她的工作获得认可以来，`Harmon` 本人已获得了三百万 TikTok 粉丝。）\n\n鉴于这些反复变化的系统控制着我们生活的许多方面，从与朋友社交到为我们的创意项目建立受众，社交媒体用户感到偏执难道不奇怪吗？我们被鼓励忽视算法过程，但它们的故障提醒着我们它们拥有名不其实的权威性。算法影响的模糊性产生了一种被标记为“算法焦虑”的感觉。算法焦虑描述了人们日益增长的意识，即我们必须不断与超出我们理解和控制范围的自动化技术过程作斗争，无论是在我们的\
  \ `Facebook` 信息流、`Google Maps` 驾驶路线，还是 `Amazon` 的产品推广中。我们永远在预判并质疑算法所做出的决定。算法焦虑并非假设或抽象：它已经普遍存在。科技公司意识到了这一点，多年来一直在操纵用户中的这种感觉。\n\
  \n2018 年，当时在佐治亚理工学院读博士的 `Shagun Jhaver` 与两名 `Airbnb` 员工合作，对该公司的用户进行了一项社会学研究。他们分析了平台的房东（即在该平台上出租房屋以获取收入的人）如何与\
  \ `Airbnb` 的算法推荐、搜索和评分系统互动并对其产生感受，这些系统帮助租客找到并预订房源。`Jhaver` 和其他研究人员提出了“算法焦虑”一术，用来描述房东“对\
  \ `Airbnb` 算法如何运作的不确定，以及对控制感的缺失”，团队在研究结果中写道。房东担心搜索算法不公平地忽略了他们，或者优先考虑其他物业。`Jhaver`\
  \ 注意到，这种焦虑更多是归咎于技术而非房东出租房屋的实际质量：“这特别与算法本身有关，而不是通过其他方式改进他们的房源和物业，”他告诉我。\n\n研究人员写道，`Airbnb`\
  \ 迫使房东进行“双重谈判”，因为他们必须确定客人在房源中寻找什么，以及算法正在优先考虑哪些变量以更多地推广他们的物业。但房东无法判断哪些变量实际上提升了他们的房源。他们认为诸如评论数量、评论质量和可用照片数量等因素会增加他们的推广机会，但他们不太确定算法是否分析了他们的定价、房屋设施或作为房东的入驻。他们关于系统如何运作的信息极少。这完全是一个感知问题。正如研究中的一位房东抱怨的那样：“看到搜索结果很沮丧：有很多房源出现在更高的位置。”当然，质量是主观的，但房东的情绪说明了用户如何可能感到算法评估感到被误解和误判。“这就像一场考试，你不知道发生了什么，也不知道如何在这场考试中得高分，”`Jhaver`\
  \ 解释道。而且不仅仅是用户不知道。归根结底，即使是创建算法的人也无法告诉你哪个因素导致了哪个决定；算法的复杂性极高，要解分这些因素是不可能的。\n\n未能玩转算法可能会导致房东收入立即下降，而他们作为任何工作者一样，依赖于保持一致性。（算法推广的不稳定性迫使我们不断与其交道并为此倍感压力，就像拉老虎机杠杆以中大奖一样。）像\
  \ `Airbnb` 这样的零工平台长期承诺提供灵活的工作和替代的生活方式，但它们也创造了一种新的劳动形式，即需要跟上算法优先级的变化。当房东担心 `Airbnb`\
  \ 的搜索算法时，艺术家同样担心 `Instagram`，音乐家则担心 `Spotify`。研究人员发现，房东对这种算法焦虑的反应是开发出“民间理论”——即一些迷信的小技巧，旨在获得更多的算法推广和更好的搜索结果——就像我以前用虚假的婚礼公告来发布我的文章链接一样。其中一些策略包括不断更新房源、更改个人资料，甚至在一天中更频繁地打开\
  \ `Airbnb` 网站。这些技巧让人联起孩子在枕头下放勺子以导致学校放雪假，其效果可能也相上下。正如研究人员发现的那样，房东“通常对这些理论是否真实表示怀疑，但尽管不确定，仍然执行这些行动试图影响算法。”\n\
  \n算法焦虑是某种当代瘟疫。它引发了许多用户一种类似强迫症的过度意识和重复相同仪式的倾向，因为当这些仪式“起作用”时，效果是如此迷人，既带来了获得关注的心理多巴胺冲动，如果你的在线形象已变现，还能带来潜在的经济回报。它成了我们许多在线行为的基础：选择正确的头像、在\
  \ `Instagram` 账户中策划精美的照片网格、在市场列表上选择正确的关键词。\n\n\n\n\n\n# 算法焦虑与数字文化的变迁\n\n## 算法焦虑的本质\n\
  \n算法焦虑的产生是因为用户与算法之间存在着极度不对称的关系。对于个人用户而言，试图预测或主宰算法的结果就像试图控制潮汐。延续这个比喻，所有用户所能做的只是冲浪已经形成的波浪。对于公司来说，缓解这种焦虑并没有太大动力，因为用户的困惑对业务可能是有益的。当公司的产品失效或用户遇到困难时，这些可以被归咎于“算法”这一不透明的实体，它被认为是独立于用户和公司之外的外部存在，因为它们被比作不透明的“黑箱”。剥削行为被伪装成偶然的故障，而非刻意的公司政策。事实上，像\
  \ `Facebook` 这样的公司完全控制着它们的算法系统，并能够随心所欲地改变它们——或将其关闭。\n\n算法焦虑将行动的负担推给了个人而非企业——用户必须改变自己的行为，否则就会面临消失的风险。当用户在平台上的帖子或内容互动量突然不如从前时，他们有时会抱怨自己被“影子禁”（shadowbanned）。用户经常担心自己的账号被某个决策者在没有预警或申诉渠道的情况下封锁了；但算法的优先级可能只是默默地发生了变化，流量不再流向他们。这种效应可以追溯到“机械土人”（Mechanical\
  \ Turk）；我们并不总是分辨技术的正常运作与技术运作的幻象，但最终，这种感知产生的影响可能与现实本身等大。\n\n## 学者的视角\n\n学者 `Patricia\
  \ de Vries` 在她 2019 年的论文《当代艺术中的算法焦虑》（*Algorithmic Anxiety in Contemporary Art*）中将算法焦虑定义为：“可能的自我被认为受到算法限制、边界和治理的状态。”她的话准确得令人惊叹。我们为自己感知到的各种可能性——我们的表达和创作模式——现在存在于数字平台的结构之中。`de\
  \ Vries` 写道，这种焦虑的后果包括“算法决定论、宿命论、愤世嫉俗和虚无主义”。它导致了一种感认为：既然我们这些用户无法控制技术，还不如顺从算法文化的局限性并将其视为不可避免。许多用户已经进入了这种绝望状态，既感到不满，又无法想象出替代方案。\n\
  \n## 变迁的历史背景\n\n`De Vries` 早在 2013 年就开始观察这种文化转变，当时她看到几场博物馆展览突出了几位对自动化监控和数据收集持批判态度的艺术家的作品。虽然算法推送才开始进入主流视野，但像\
  \ 2010 年由算法股票交易引起的“闪崩”（Flash Crash）以及人脸识别等技术，已经让这个词进入了新闻头条。到那个年代中期，当她开展研究时，`de Vries`\
  \ 告诉我，它已成为“我们痴迷的对象之一”。算法是一个幽灵，困扰着与数字平台的每一次接触，以及它们在我们生活中日益增加的侵略性。这并不是说我们理解了算法本身在做什么：`de\
  \ Vries` 说：“正如恐高症并非关于高度一样，算法焦虑并非仅仅关乎算法。”\n\n## 前行\n\n要继续前进，我们必须将算法推荐作为技术的影响，与我们习惯性将其采纳为在线通信主要门禁的方式隔离开来。毕竟，算法与其其运行的数据是不可分割的，而这些数据是由人类创造并不断更新的。实际的影响与对影响的恐惧并存，后者同样具有操纵性。算法通过承诺为我们做决定、预判我们的想法进入了我们的生活。\n\
  \n# 第二章\n\n## 个人口味的颠覆\n\n### 亚马逊书店\n\n一个下午，在华盛顿特区（`Washington, D.C.`），我走到了乔治敦（`Georgetown`），那是市中心的枢纽之一。有一家店脱颖而出：`Amazon\
  \ Books`（亚马逊书店），这是一家实体书店。`Amazon` 从 2015 年开始建立实体书店，第一家店位于西雅图（`Seattle`）。当它 2018\
  \ 年在华盛顿开业时，在现实世界遇到它的无衬线标志感觉很奇怪。书店的内部也十分陌生。当我第一次走进去时，我被视觉上的混乱震惊了——它没有书店应有的平静。相反，它更像一家杂货店。所有的封面都向外，并排排列在书架上。实体店的布局遵循其网站的设计，将“最热门”的作品放在前面。书籍并没有按照作者、作者国籍，甚至没有统一按照类型来组织，而是根据它们在网上的成功程度——这正是\
  \ `Amazon Books` 用于判断文学质量和价值的算法。互动率再次占据了主地位。商店里到处贴的告示解释了为什么某些书会被展示：它们是“畅销书”，或者评分为“4.5\
  \ 星及以上”，甚至是“4.8 星及以上”。平均多出的 0.3 星真的能反映出一本书的价值吗？其他作品是“亚马逊.com 上最受期待的”，或者根据其在线收到的预订数量被重点介绍。一些书架被排列成了一个模拟推荐系统。每个书架的左侧有一本书，标记为“如果你喜欢\
  \ ←”，右侧是一系列书籍，标记为“你也会喜欢 →”。例如，哈拉利编写的《人类简史》（*Sapiens*）引发了对其他非虚构畅销书的推荐，如贾雷德·戴蒙（`Jared\
  \ Diamond`）的《枪、菌与钢铁》和彼得·弗兰科潘（`Peter Frankopan`）的《丝绸之路》。然而，最令人惊的是，每本书的价格都是根据 `Amazon`\
  \ 网站算法定价的，该算法根据供需实时调整价格。\n\n\n\n\n\n[content]\n这与独立书店恰恰相反，独立书店以魅力和个性的独特而名实虚归。它们的书签独特且不落寻常，呈现出各种特色：新时代音乐、艺术专著、地方历史。店主们熟悉当地客户，并微妙地调整库存以反映他们的需求。有些书可能卖得不是特别好，但店主们选择将它们列出来，作为书店理念和个人品味的展示。\n\
  \n在亚马逊书店（Amazon Books）中很难辨别出一种品味；那里没有一种能让我产生共鸣的精神。相反，整个叙事完全由市场和任何引起注意的事物所驱动。其展示的美学被束缚于浅层、即时互动的需求，这或许也是\
  \ 20 世纪 10 年代后期流行由亮色、半抽象、半具象斑块组成的奇特封面的原因之一。（这些封面可能引人注目，但与小说内容无关。）尽管亚马逊商店售的许多书籍与我常去的其他书店相同，但其环境却令人陌生且产生疏离感。我无法将自己想象为一个买家，不仅是因为亚马逊作为雇主和垄断企业的破坏性行为，更因为那里没有一个关于想象中购物者的连贯理念。\n\
  \n就像许多在互联网规模下运作的事物一样，这家书店是非人性的。它根据所有亚马逊客户产生的海量数据进行推荐。这好像你只能买出现在《纽约时报》畅销榜上的书籍，但该名单是由一家不可信的公司运营的，这家公司完全致力于将书籍视为可以尽快抛售的同质化、待处理的物品。亚马逊通过销售额来衡量书籍，就像\
  \ Facebook 通过点赞来评估内容一样，这种方法和我对书店的浪漫愿景背道而驰——我将书店视为一个逃避现实、发现新奇惊喜的地方。\n\n亚马逊书店让人感到如此奇怪的一个原说是，它代表了互联网算法逻辑对我们所谓的“现实生活”的公然侵入。我们在网上被各种歌曲、图像和电视节目的建议所轰炸；当这些体验发生在屏幕上时，我们很容易接受推荐和算法的自动调解，因为这些建议是如此无摩擦力、快速且不可避免的。但当它们发生在物理世界时，它们就会变得突兀得多，在物理世界里，我们的选择很少被如此明显地由机器支配。也许亚马逊商店的怪异感源于它如何让我面对自己自由的匮乏，证明了算法在多大程度上迫使我们不再为自己思考。\n\
  \n由亚马逊所有数据的平均值驱动的书店选择奇奇地同质且最终变得无味。它预先经过了激进的过滤，以迎合我——或者至少迎合作为一个通用消费者的我——并提供了充足的保证，即*其他人*确实喜欢展示的书籍。但我并没有在翻阅其中任何一本书时感到兴奋或受鼓励。相反，我感到被信息所淹没，这可能是“滤镜世界”（Filterworld）中消费者的默认状态：被过剩的内容包围，却未从中任何一点中获得启发。\n\
  \n2017 年，一位名叫 Chet Haase 的 Google 工程师在 Twitter 上写的一句笑话，直指问题的所在：“一个机器学习算法走进酒吧。调酒师问：‘你想喝点什么？’算法说：‘大家都在喝什么？’笑点在于，在算法文化中，正确的选择总是是大多数人已经选择过的。但即使其他人都在选，也许你只是没心情喝一杯酸威士忌。”\n\
  \n我最喜欢的书店一直是 McNally Jackson，这是一个位于纽约市地区的连锁书店集合，其首家店位于 SoHo（2023 年，原旗舰店搬迁到了六个街区之外）。尽管它在任何方面都不个性化，但它总感觉这家店就像是为我个人而存在的，仿佛它理解我在寻找什么，因为它的库存既宽泛又具体。在布鲁克林生活的这十年里，我经常乘坐\
  \ L 号线进入曼哈顿，然后换乘 6 号线向南行驶，走过绿意葱葱的街道到达 McNally 的店面，穿过玻璃门进入门厅，然后进入书店那被围合而延展的空间。门前的两张同样大小的桌子构成了它的核心：左侧是一张非虚构类桌，右侧是小说类桌，后面配有相应的书架。许多堆叠展示的书籍是近期新书，但也有一些书店员工认为值得仔细观察的书籍，这是一种集体策展行为。一本来自小型出版社的哲学著作夹在热门非虚构书籍旁边；小说桌上不仅有小说，还有诗歌、独立杂志（zines）、虚构化回忆录和混合类型书籍。这些安排似乎总是在说：*相信我们吧。*\n\
  \nMcNally 桌上的内容每周都会变化。在每次重新安排之后，我都能感受到挑选书籍的那只手——一种个体的智慧，而非单一的公式。浏览是一种发现新事物的方式；可以说亚马逊的“如果你喜欢这个，你就会喜欢那个”的公式原理类似，但\
  \ McNally 的联系并不那么直接和字面化。它们扩展了购物者对特定类别可能包含内容的认知。\n\n如果说亚马逊书店代表了算法逻辑的胜利，那么 McNally\
  \ 就是人类品味引导者的巅峰，我们经常用这个词来描述那些筛选和选择文化的人。书商是品味引导者，为读者推荐书籍的图书管理员、精品店的专业买手、广播电台 DJ、为全国剧院争取电影的经纪人，以及为音乐场策划演出的人也是如此。这些品味引导者在文化创造者与消费者之间提供了一个界面。他们不断收集并判断素材，以决定其为何会引起观众共鸣——这一过程现在被归于“策展”（curation）这个词的大伞下。\n\
  \n我们很容易忽视这样一个事实：当通过数字平台消费内容时，我们在特定时刻看到的内容是由方程而非此类品味引导者决定的。Netflix 的首页、Facebook 的动态和\
  \ Spotify 的自动电台，并没有编辑、DJ 或预订人的直接影响，反而是对众数据的数学处理。这种策展，如果存在的话，是自动化的，规模大到个人无法触及。通过我们的算法推送，我们得到的只是亚马逊式的零售体验，而不是\
  \ McNally 的策展眼光。\n\n## 品味\n\n品味引导者的“品味”意味着个人偏好，即我们在确定自己喜欢音乐、时尚、食物或文学时应用的鉴别力。我们不断地选择听、读或穿某物，而不是其他。这些选择是私密的，反映了我们转瞬即的情绪以及个人感官的缓慢构建。\n\
  \n\n\n\n在其他情况下，我们有那种总是知道在晚餐时该带哪种酒的朋友，有那种关注最相关时尚品牌的朋友，还有那种推荐值得看的电视节目的朋友。`Taste`（品味）是一个衡量我们衡量文化以及判断我们与文化关系的词汇。如果某物符合我们的口味，我们会感到与它亲近并产生认同，并基于此与他人建立联系，就像客户通过服装标签进行交流一样（无论是喜爱还是讨厌某个特定品牌）。刻意的“糟糕的品味”可能与良好的品味同样具有吸引力，正如作者\
  \ Rax King 在她的书 `Tacky:` 中描述的那样：“俗气是喜悦。”但从根源上说，品味是一个深刻的哲学概念。它接近道德，代表了对世界上美好事物的本能感知。\n\
  \n### 西方品味的哲学根源\n\n18 世纪 50 年代，品味在一个法国百科全书条目中得到了讨论，引用了哲学家伏尔泰（Voltaire）和蒙德斯鸠（Montesquieu）的笔记，他们共同为品味的西方概念奠定了良好的基础。伏尔泰写道：“要拥有品味，仅仅看到并知道某件作品之美是不够的。你必须感受到美并被它打动。仅仅感受到、模糊地被打动是不够的：关键在于辨别出感受的细微差别。”品味超越了肤浅的观察，超越了仅仅将某物识别为“酷”。品味要求完整地体验创作过程，并对自身产生的真实情感反应进行评估，解析其影响。（品味不是被动的；它需要努力。）蒙德斯鸠不仅是一位受人尊敬的知识分子，还曾任男爵和法官，他贡献了《关于自然与艺术主题的品味随笔》，这是一部他在\
  \ 1755 年去世时留下的未完成的文学速写。这是一篇关于什么事物能取悦灵魂的、写得优美且悠长的文章。根据蒙德斯鸠的观点，“品味无非一种能够以敏锐和快速发现发现万物本应带给人的快乐程度的能力。”\n\
  \n“天生的品味不是理论性知识，”蒙德斯鸠继续道，“它是对我们甚至不知道的规则的快速且精妙的应用。”那段话述的后半部分触动了我：品味是一种抽象、不可言说且不稳定的东西。音乐听众或书籍读者在体验之前，无法真正判断自己是否会喜欢某物；艺术品带来的快乐从不是有保障的。因此，当遇到艺术品时，我们立即根据一套心理原则对其进行评估，并希望从中发现美，感到被肯定，即使我们无法完全描述那种美究竟是什么，或者我们最初究竟是如何确定它的。品味本应是模糊的。正如意大利哲学家乔尔乔·阿格廷本（Giorgio\
  \ Agamben）在他 1979 年关于品味的专著中所总结的那样：“品味享受美，却无法解释它。”\n\n### 身份与算法挑战\n\n品味是自我的基本部分；培养或沉溺于品味意味着构建更稳固的自我感。它成为了身份识别的基础。1906\
  \ 年，日本作家冈仓铁拙（Okakura Kakuzo）写了《茶之书》（The Book of Tea），这是一种用英语向他在美国的朋友和赞助人传达日本品味的方式，其中包含了艺术收藏家伊莎贝拉·斯图亚特·加德纳（Isabella\
  \ Stewart Gardner）。冈仓在讨论茶室设计时认为，艺术本身并不是为了大众化或迎合广大观众：“茶室的建造为了适应某些个人的品味，这是对艺术生命力原则的执行。”冈仓讲述了\
  \ 17 世纪艺术家小织圆州（Kobori Enshiu）的一句话。圆州在对弟子们说话时，称赞了另一位茶道大师的茶具收藏，恰恰是因为很少有人能欣赏它们：“伟大的利休敢于只爱那些个人上吸引他的物品，而我却在下意识地迎合大多数人的品味。”圆州嘲笑自己的品味太过于主流，无法达到真正的伟大。然而，迎合“大多数人的品味”可能是算法推送的唯一目标——一种基于数据的多数派。\n\
  \n品味并不完全是正面的或高效的。1930 年，日本哲学家九龟十仓（Kuki Shuzo）写了一篇文章，试图定义一种被称为“意”（iki）的日本文化价值，它等同于一种世俗的厌倦，以及对生活各个方面表现出的明显矛盾感。（W·大卫·马克斯，一位长期住在东京的美国作家，我的朋友，将其与新英格兰的白人教徒特质进行了比较。）爱、金钱和美都可以像获得一样容易失去，而获得并不总是比失去好。缺失必须像存在一样被欣赏。九龟写道：“‘意’被理解为一种高级的品味。”\n\
  \n### 惊喜的重要性\n\n蒙德斯鸠关键性地指出，惊喜（可能会产生疏离感或挑战，比如一个特别丑的日本“侘寂”器皿）是品味的基本元素。他写道：“某物能让我们感到惊讶，是因为它激发了好奇，或者因为它是新的或出乎意料的，”它存在于我们已知范围之外。当我们的灵魂感受到某些它无法分析的事物时，往往会产生快乐。理解这种惊喜感需要时间。品味不是即时的，它随着你思考和消化这种体验而改变：“当某物以最初细微的惊喜启发我们时，这种惊喜会持续、增加，并最终转化为崇仰。”\n\
  \n引用文艺复兴时期意大利画家拉斐尔（Raphael）的作品，这种优雅可能会意想不到地出现。对我来说，这让我想起了弗兰克·奥齐（Frank Ocean）2016\
  \ 年的专辑《Blonde》，那是在他首张专辑《橙色频道》（Channel Orange）四年后发布的。起初，我忽略了它。曲目听起来不像单单的歌曲，更像是一片合成音的流，歌词模糊得难以捉摸。但当我继续听，被音乐中某种无法定义的特质吸引时，我意识到这张专辑的抽象性正是重点所在，其难以捉摸性是对现代疏离感以及尽管如此仍需生活的写照。当然，《Blonde》是\
  \ 21 世纪初的一部流行杰作，也是畅销书。但这张专辑和音乐人都没有按照算法推送的规则办事。\n\n\n\n\n\n## 建立你自己的品味\n\n与被动接受信息推送给你的任何内容相比，识别你喜欢什么的那套潜意识原则是一场艰辛的苦斗。但这种情况并不能完全归咎于算法的存在。今天，我们拥有的文化选择比任何时候都多，而且随叫随到。我们可以自由选择任何东西。然而，我们经常做出的选择是不放弃选择，让自己的视野被自动化信息流所塑造——这些信息流可能基于人类的聚合`actions`，但其本身并不`not`人类。\n\
  \n## 算法的便利性\n\n在某些方面，这种向算法的转变是便利的。不断质疑自己的偏好很累人：研究有哪些新的文化产品可以使用；阅读杂志或向朋友寻求书单；以及决定吃什么、在哪里吃。这是一种奢侈形式的劳动，十八世纪的法国哲学家可能有充足的时间去做的，但在节奏快得多的当代世界，我们大多数人负担不起。（孟德斯鸠没有\
  \ Instagram 来分心让他远离拉斐尔画布的沉思。）例如，遵循 `Netflix` 首页的建议就提供了一条捷径。\n\n## 自动化品味的风险\n\n品味有时感觉更像是一个担忧的来源，而不是个人成就感的来源。根据你个人品味做出的选择，如果不经意地与当前情境的规范冲突，可能会很尴尬，比如在办公室穿运动休闲装，或在阴郁的葬礼上穿亮色的衣服。当我为一群朋友挑选一家以前未探索过的酒吧或餐厅时，我感到非常羞愧，我本以为这个选择会受大家喜欢，结果被发现氛围完全不对。（华盛顿的一处这样的酒吧结果被发现墙上挂了太多的标本动物头，让人感到不适。）\n\
  \n在那种情况下，`Yelp` 或 `Google Maps` 的自动推荐可能更适合我：这种民主的、平均认可的证明减轻了做出可能过于古怪的选择的压力。然而同时，我不希望这些“最低公约数”的规则决定我读什么书或看什么电视节目。文化不是一个你可以给五五星评价的烤面包机——尽管\
  \ `Amazon` 拥有的网站 `Goodreads` 试图将这些评分应用于书籍。我有许多喜爱的体验——例如 `Rachel Cusk` 的 `Outline`\
  \ 这这种没有情节的小说——其他人无疑会给出差评。但这些就是 `Filterworld` 对所有事物执行的规则。\n\n## 品味即消费主义\n\n由于品味需要惊喜，它也在挑战和风险中茁成长，在特定方向上走得太远。安全可以避免尴尬，但也是无聊的。在整个二十世纪，品味与其说是关于艺术质量的哲学概念，不如说是工业时代消费主义的平行物，一种判断应该买什么以及反过来判断他人买什么的方式。这种现象——过度迎合大众品味，从而使自己与文化之间更具启发性的、个人化的遭遇隔绝——在\
  \ `Georges Perec` 1965 年的小说 `Things` 中有描述。\n\n故事关于一对二十来出头的夫妇，`Jerome` 和 `Sylvie`，他们担任市场研究员，采访消费者并提出的问题诸如“为什么纯吸式吸尘器卖得这么差？出身平凡的人如何看待菊苣咖啡？”。这对夫妇是人类数据收集者。他们的个人欲望也像营销调查的结果：他们喜欢他们本应该喜欢的东西。`Perec`\
  \ 对他们虚构的理想公寓的描绘包括玉石烟灰缸、藤编坐椅、`Toile de Jouy` 壁纸、瑞典灯具和 `Paul Klee` 的画。我承认，这在今天听听起来依然很不错。\n\
  \n## 标准化的空虚\n\n然而，完美的形象意味着某种程度的空虚。当品味过于标准化时，它就降级了。“他们那摇摇不定的品味，他们过度犹豫的细心，他们经验的缺乏，他们对他们认为的真良好品味标准的近乎短视的尊重，给他们带来了一些刺耳的时刻，一些羞辱，”`Perec`\
  \ 写道。比如 `Jerome` 试图通过穿得像英国绅士来追随潮流，但只成功地模仿了一种“大陆式的漫画形象”，看起来像一个“薪水微薄的近期移民”。他因因穿得太频繁而穿坏了一双优雅的英国皮鞋。`Jerome`\
  \ 和 `Sylvie` 对他们应该喜欢什么有个想法，但他们并不完全理解为什么或如何。没有品味的消费只是纯粹、加速的资本主义。\n\n## 塑造品味的两种力量\n\
  \n有两种力量塑造了我们的品味。正如我之前描述的，第一种是我们对个人喜好的独立追求，而第二种是我们对大多数其他人喜欢的物的意识，即主导主流。两者可能向相反的方向移动，但遵循后者通常更容易，特别是当\
  \ `Internet` 让其他人的消费变得如此即时公开时。（如果你没发帖分享它，你真的看那个电视节目吗？）\n\n算法信息流进一步强化了那种主流的存在，我们的个人选择正是据此接受评估的。品味是不可避免的；它涉及“生活中最常见的选择，例如烹饪、服装或装饰，”法国社会学家\
  \ `Pierre Bourdieu` 在他 1984 年的著作 `Distinction: A Social Critique of the Judgement\
  \ of Taste.` 中写道。这些选择可以代表超出审美偏好的广泛范围，例如经济阶级、政治意识和社会身份。“品味分类，它同时也分类者，”Bourdieu` 写道。难怪我们担心喜欢什么，有时发现将这种责任交给机器更简单。\n\
  \n## Amazon Echo Look 案例研究\n\n`Amazon` 创建了一个旨在模拟品味的设备。它被称为 `Amazon Echo Look`，可以为你做所有的时尚决策。在它\
  \ 2017 年发布后我尝试了。`Echo Look` 是一个塑料制的小圆柱体，安装在一个支架上，中心有一个摄像头，像独眼巨人的眼睛。它被广告为一种轻松拍摄全身自拍的方法——只需将设备放在架子上，然后使用语音命令让它拍照，同时摆出俏的姿势。照片会被发送到你的手机，并存储在一个\
  \ App 中，该 App 构建了你衣橱的百科全书——就像《傲娇女孩》中的 `Cher Horowitz` 一）。但摄像头还会通过一个名为 `Style Check`\
  \ 的功能来判断你的衣服，利用算法分析和人工操作（回想 `Amazon` 的伪自动 `Mechanical Turk`）来告诉你服装是否匹配或组合是否时尚。\n\
  \n为了看看 `Echo` 如何评估风格，我尝试穿了两套不同的 T 恤和牛仔裤套装——一套全黑，另一套全灰，站在 `Echo Look` 前，就像在小学拍照日面对妈妈一样。当我用\
  \ `Style Check` 比较两套套装时，黑色衣服的表现更好，在满分 100 分中得了 73 分的时尚分，而灰色套装只得到了剩下的 27 分。系统对评分没有太多解释：“你穿搭那些单品的方式看起来更好，”它说。也许单色黑色是一个已知的时尚陈调，而单色灰色不那么悦目，因此更激进？我无法判断。\n\
  \n\n\n\n其他简练的判断还包括“色彩搭配更好”和“服装形状更合适”。`Style Check` 还告诉我，穿牛津衬衫时，卷袖子比扣在手腕处更好，翻起衣领是个好主意（这与我自己在中学时期反抗\
  \ `Abercrombie` 时尚顶峰时所建立的个人审美认知完全背道而驰）。根据 `Echo Look` 的算法，蓝色牛仔布是牛仔裤的最佳选择。它提供了评估，但既没有整体性的理解，也没有情感基础。`Style\
  \ Check` 简单地将你的选择与其档案中的数据网络平均值进行比较。当你的时尚品味遵循他人的时，你的品味才是最好的。此外，`Echo Look` 还提供即时购买符合其理想着装规范的服装，当然这些是由\
  \ `Amazon` 销售的，它从这种算法化平庸的愿景中获利。\n\n这是一种自下而上的文化偏好模型，与个人对味味的定义以及互联网之前的潮流引领者系统均格格不入——潮流引领者是指那些手工挑选酷的东西并将其强加给其他人的个人。这种等级制度通过\
  \ 2006 年电影*穿普拉达的女王*中的一个场景（现在已成为梗）描述得最传神。梅丽·斯特普饰演了 `Vogue` 总编辑安娜·温图的翻版，而安妮·哈瑟薇是她那个刚刚学习时尚媒体门道的天真助手。在其中一，哈瑟薇穿了一件她在百货商店特卖中随手买的蓝色厚针毛衣，看起来似乎是为了方便，而不是为了它的时尚性。但斯特普告诉她，这个决定早已预由像她这样的时尚编辑为她做好了。斯特普的独白充满了专横：“这种蓝色代表了数百万美元和无数工作机会，你竟然认为自己做出了一个让自己脱离时尚行业的选择，这简直很滑稽，而事实上，你穿的这件毛衣是房间里的这些人在一堆‘东西’中为你挑选的，”斯特普说。是人类潮流引领者挑选出来的。\n\
  \n品味最终是它自己的算法，将事物分类为好或坏。它所依据的方程式基于个人偏好、从营销中吸收的先入为主观念和社会象征意义，以及对某种文化作品的直接体验，并最终产生一个个人答案，判断你认为手头的东西是令人愉快还是厌恶。因此，很难区分这种有机社会代码与推荐算法的软件代码，尽管这种区分至关重要。\n\
  \n应该是人类时尚编辑来告诉你喜欢什么，还是应该由算法机器（以 `Amazon` 书店、`Spotify` 馈或 `Netflix` 首页的形式）来决定？这是《过滤世界》中文化的核心困境。前者是变幻莫测的并由精英守门人驱动的，这是一个经过一个世纪现代文化产业建立的强大群体，充满了他们自己的盲点和偏见，包括性别和种族偏见。（该群体不仅包括纽约大部分白人时尚杂志编辑，还包括好莱坞制片、唱片公司高管和博物馆策展人。）然而，当算法生态系统中大众观众的行为决定了什么可以被轻易看到时，人类的缺陷可能会变得更加极端。种族主义、性别歧视和其他形式的偏见是该方程式中事实存在的一部分。\n\
  \n在网上，用户往往与与其自身冲突的观点和文化隔离开。整个数字环境由具有冷酷资本主义扩张动机的科技公司主宰，这些公司并没有为文化提供最肥沃的土壤。当杂志去中心化了编辑时，算法去中心化了品味。\n\
  \n## 品味的常态化\n\n算法压力的力量并非理论上的。它不是一个阴暗的反乌托邦未来，而是一种已经影响着消费者和创造者的无不在的力量。在消费者端，推荐的轰炸可以引发一种催眠，使得听音乐、观看或购买某种产品变得几乎不可避免——无论它是否真的符合你的品味。\n\
  \n`Echo Look` 可能确实走得太远了。评论人士欣赏这种创新，但它从未成为过受欢迎的产品。2020 年，`Amazon` 宣布该设备将停产，`Style\
  \ Check` 也停止运行。\n\n\n\n2021 年底，彼特陷入了其中一种微趋势中。一种腿袜的跟风——那种拉到膝盖处的毛绒织物筒突然占领了她的信息流——她的\
  \ Instagram 探索页面、TikTok 的“为你推荐”反馈以及 Pinterest 的推荐，同时出现。这并非付费广告，却无处不在。彼特告诉我，在网上接触到这些东西之前，“我根本没想过要买腿袜。我觉得它们很丑、极其难看、很荒唐。”但很快，她发现自己只需点一下按钮就在网上买了一双，这几乎是潜意识的冲动——她说这很“奇迹”。这次购买行为最终并没有改变她的想法；彼特穿那双倒霉的腿袜只穿了几次，然后就将它们收进了衣橱深处。她说，买它们是“我都不确定是否我自己做出的选择”。\n\
  \n在那些认为大部分是自然流量的社交媒体流中，算法的影响让她感到具有侵略性，就像显眼的产品植入可能会干扰一部本该让人入迷的电影。尽管如此，就像我在世界各地遇到的普通咖啡馆一样，没有任何一个实体强迫所有不同的网红和平台去顺从趋势；拥抱腿袜仅仅是一种博弈信息流的方式，为了获得推广，从而获得关注和粉丝。一旦彼特对哪怕是一个关于腿袜的单条帖子产生互动，推荐算法就会扑上来，内容便变得无处可逃。（遵循算法的逻辑：“如果你喜欢其中的某一个，你一定会喜欢越来越多的东西。”）\n\
  \n彼特在凡克莱夫与宝齐（Van Cleef & Arpels）珠宝上也有过类似的经历，这种珠宝在真人秀中出现后在 TikTok 上走红；还有占星术，彼特曾在\
  \ Twitter 上短暂关注过这个主题，然后失去了兴趣。但 Twitter 的推荐不断向她推送关于占星术的推文，通常是负面的警告，无论她要求停止多少次她说：“每当水星逆行时，我开始担心自己的命。我不想看它，但它一直推给我。这正在毁掉我的生活。”信息流不仅试图猜测你喜欢什么，它可能无法理解你的偏好何时转移或演变。\n\
  \n算法焦虑在很大程度上是由目标在线广告的肆虐引起的，它使用了与信息流相同的算法。你的参与行为被数字监控追踪，然后你就会收到与你互动内容相匹配的产品广告，这些广告来自那些购买你注意力的品牌。由于广告是许多数字平台和在线出版物盈利的主要手段，它们无处不在，中断文章，以自动播放视频的形式弹出来。与电视广告或纸质杂志广告不同，它们是个性化的，并且不断重复你可能倾向于忽略的话题——因为有许多出版商通过同一种软件（如\
  \ Google 的 AdSense）出售广告，同样的广告可能会出现在每个网站上。我在一件家具上经历过这种挥之不去的干扰，那是一个由德国制造商 USM 制造的餐边柜。那件家具由鲜艳金属架架组成的现代主义网格结构无处不在，在我甚至还没意识过来之前就吸引了我的目光。然而，这并没有让我更想要那个餐边柜，我反而厌了它，对自己的喜好产生了怀疑。\n\
  \n“现在很多文化都是围绕社交媒体塑造的；有太多的微趋势。在你眨眨眼或决定是否喜欢某样东西之前，信息流已经转移到了下一个事物了，”彼特向我解释道。她总结了这个问题：“我只想知道我喜欢的真的是我真正喜欢的。”换句话说，她正在自己的品味中寻求信心和稳定性。尽管她知道自己对推荐负有部分责任，但在线内容的算法加速在荒谬的程度上超过了她的日常体验。“并不是我在现实生活中的每一次互动都会塑造我的选择。为什么我与一个穿腿袜的网红之间最微小的互动就能影响我呢？是它们投喂给我的，”她说。在曼彻斯特的人行道上散散步，其多样性和原创性远比她那些混为一谈的数字信息流得多。\n\
  \n我对个人设计审美也有同样的感觉，它倾向于中世纪中期和极简主义——毕竟，这些都是……\n\n\n\n\n“在他们切换预设的那天，就是这首歌从我们整个曲库中被分离出去的开始，”Krukowski\
  \ 说，“《Strange》这首歌被该系统推荐的频率比 Galaxie 500 的其他任何歌曲都高。”Krukowski 在他的通讯中发布了他的观察结果，这引起了\
  \ Glenn McDonald 的注意，他当时担任 Spotify 的“数据炼金术士”。McDonald 进行了一项内部调查，并得出结论，《Strange》之所以击中算法彩票，并不是因为\
  \ Galaxie 500 独特的音乐风格，而是因为这首歌与其他乐队的歌曲相比，比 Galaxie 500 其他曲目更相似。在很多情况下，如果《Strange》播放，听者不太可能点击\
  \ `Skip` 或 `Stop` 按钮，因此推荐系统将其记录为一次有效选择，并推荐给更多的听众。\n\n当我询问 Krukowski 为什么他认为这首歌击中了要害时，他指出了其中带有玩笑性质的特质，这使其与\
  \ 80 年代流行的重金属抒情歌并无二：鼓点上规律的后拍、不符合 Galaxie 500 风格的刺耳吉他音色、缺乏长独奏，以及只有三分十九秒的短运行时间。换句话说，《Strange》听起来就像一首普通的歌。“一起弹奏很有趣，因为我们允许自己比平时更用力地扫弦，”Krukowski\
  \ 说，“这就是算法在歌曲中听到的。”此外还有一种算法反馈循环，即流行的内容会变得越来越流行。“一旦它发布并被大量推荐，它就会被推荐得更多，”他说。考虑到当时\
  \ Spotify 推荐系统的优先考虑因素，最平庸的内容最最成功。\n\n### 算法归一化\n这就是算法归一化的发生方式。`Normal`（正常）是一个形容不显眼和平均水平的词，指的是任何不会引发负面反应的内容。任何符合这种“平庸区域”的内容都能看到加速的推广和增长，就像《Strange》那样，而其他内容则会被遗弃。随着看到未被推广的内容的人越来越少，人们对它的认知也越来越少，创作者制作这类内容的动力也越来越少——部分是因为这在财务上是不可持续的。（过滤世界中的文化规则是：要么走红，要么死亡。）审美可接受的边界变得越发紧，直到只剩下中间的一列。虽然流行风格像移动目标一样在变化，但中心化和归一化持续存在。这就是为什么当特定的推文模式开始大火时，Twitter\
  \ 上的每个人似乎突然都在模仿：例如，发布一个开放式的推荐请求，或者将一个荒谬的笑话当作你的孩子（真实的或虚构的）对你说的话。语言本身也被归一化了。“有一种正常的压力。这种压力仅仅是在说：保持一致，无论你熟悉什么都是安全的，并以某种方式让你觉得自己是群体的一部分，”Krukowski\
  \ 说，“这其中有一个可怕的消失点，那就是法西斯主义。”他将过滤世界的状况描述为“常态化的黑洞”。\n\n### 过滤世界的本质\n法西斯主义意味着被迫服从单一意识形态的世界观信条，这种观点可能完全忽视某个特定的身份或人口统计。它是同质化的指令。过滤世界可以是法西斯主义的，因为算法推送往往会创造出事物本应该是那样的模板，并且始终受到内在偏见的影响——一种对现实的圈括，然后通过用户创建符合模版的内容得以实现。这种圈括包含了文化形式，也包含了身份。将过滤世界描述为独裁或封建可能也是准确的：我们都居住在网上我们没有控制权的空间里，遵循着我们并不认可的反复无常的规则。\n\
  \nKrukowski 并不讨厌他后期大红的歌曲《Strange》，但他说，“我从未认为它是一首脱颖出的曲目。如果你眯起眼睛——这正是算法所做的——并且侧过头，透过一层纱来听，你可能会误以为是另一支乐队。”这首歌并没有代表鼓手对\
  \ Galaxie 500 在创作上想要实现的目标的理解；起初像是一个音乐玩笑的东西，在无意中变成了乐队整体作品的象征。乐队实际上选择了节奏较慢、更安静的《Blue\
  \ Thunder》作为最初的主打单，一些唱片公司的高管对这一选择持有异。\n\n### 对艺术家的影响\n有了现代的算法推荐，艺术家在什么会流行方面的选择少得多，对其作品出现的语境的控制也更少。`Spotify\
  \ 的界面`将乐队播放次数最多的歌曲放在页面顶部，这使得更难找到并按原始顺序播放整张专辑。Galaxie 500 无法像他们以前反抗唱片公司那样有意识地抵制算法决策。Krukowski\
  \ 继续道：“算法奇怪的地方在于，我们都处于这种压力之下，无论我们是否情愿。即使我们不想与它有任何关系，算法也会俯冲进来挑选你最‘正常’的一首歌，并让你认同那首歌，而不是你那首最独特、最‘你’的曲目。”同样的过程适用于艺术家、作家以及在线上任何感到压力将自己限制在任意“个人品牌”内的人。\n\
  \n而且由于 Spotify 无情地控制听众如何与音乐互动，所以他们不需要像大型唱片公司那样，通过丰厚的唱片合约或其他福利来激励音乐家。“面对这种来自算法的压力，他们没有为我们提供任何交换，”Krukowski\
  \ 说。甚至没有稳定的生活。《Strange》在它 Spotify 的生命周期内有 1400 万次播放，而 Galaxie 500 第二大的歌曲《Tug Boat》有\
  \ 900 万次。然而，《Strange》在 Spotify 的总收益仅为一万美元。这种用曝光换取收入的，特别是以乐队的身份感为代价，对音乐来说是不公平的：“这是一种剥削。”然而，这就是许多创作者为了融入过滤世界而不得不做的交易。\n\
  \n## 被 Netflix 分类\n在我成年后的大部分时间里，我没有电视。在大学期间，我通常盗版我想看的剧，如《广告狂人》，这种非法习惯持续到了 2010 年代的《权力的游戏》时代。我通过在床上用笔记本电脑观看大部分电视节目和电影，枕头垫起头部以获得完美的观看角度。Netflix\
  \ 在 2007 年推出了其早期流媒体服务，但我很长一段时间都没有自己的账户，即使有，也是我父母订阅下的一个用户配置文件。这种内容观看模式是随机且随意的。首先，我必须知道我想看什么，这意味着遵循朋友的建议或社交媒体和博客上的推荐。然后，我必须寻找它并设置我的电脑，在黑暗的房间里沐浴在近屏幕的冷光中。\n\
  \n\n\n\nNetflix 的主页通过滚动的缩略图网格展示每部独立的节目或电影，这变成了另一种内容推送，类似于 Spotify、Instagram 或 Twitter。在那些日子，我查看它的频率让我更加意识到，界面是如何根据它感知的我的偏好进行自我定制的。它逐渐将特定类别的节目推到主页顶部：旅游纪录片、烹饪节目和国际悬疑剧剧。这些选择被汇总在“为\
  \ Kyle 精选”和“为你推荐的分类”等标语下，承诺着个性化。从上到下的分类行以及从左到右的单个节目，都是通过算法排序的。正如 Netflix 在其官方帮助中心描述的那样：“我们的系统对标题进行了排名，旨在以呈现你可能喜欢的标题的最佳排序方式。”\n\
  \nNetflix 通过推荐引擎开创了文化过滤的先河。在它 2007 年推出流媒体服务之前（当时它还是一套邮寄租赁 DVD 的系统），Netflix 在其网站上就有一个\
  \ `Cinematch` 模块，该模块根据其他用户的评分（五星制）为用户推荐电影，这种社交信息过滤的形式与前章中提到的早期音乐推荐系统 `Ringo` 并无二致。`Cinematch`\
  \ 于 2002 年推出。多年来，这些预测在四分之三的时间里准确在半星以内，且一半租了 `Cinematch` 推荐电影的 Netflix 用户给出了五星好评。2006\
  \ 年，Netflix 为机器学习工程师举办了一项竞赛，要求将推荐准确提高 10%——即构建更好的算法——以获得 100 万美元奖金。竞赛中的一名开发者在 2008\
  \ 年告诉《纽约时报》，他在处理某一组特定电影时遇到了困难，这个问题一旦解决，就能让他的算法评分提高高达 15%。这些电影是像《莱昂的秘密》（*Napoleon\
  \ Dynamite*）、《侧西伯人》、《迷失东京》和《极速杀：第一卷》这样的电影——它们是具有独特且审美两极分化的故事，观众要么非常喜欢，要么非常讨厌。这些电影可能属于“邪典经典”之类的类别，尽管具有文化重要性，但它们的吸引力无法完全简化为数学。这是一种算法归一化仍在抵制的品质，因此在“过滤世界”（Filterworld）时代往往是缺失的。\n\
  \n2009 年，一个由 AT&T 研究工程师领导的 `BellKor in Chaos` 团队以及另一个名为 `Pragmatic Theory` 的团队赢得了\
  \ Netflix 的竞赛。他们共同创建了一个名为 `Pragmatic Chaos` 的工具，比原始算法提升了 10.06%。一项主要创新是引入了“奇异值分解”，这是一种算法策略，将共享特定特质（如浪漫或喜剧）的电影分组在一起。增加的奇异值分解层可以筛选出更微妙的因素，例如不含血腥的动作片。品味的概念变成了一系列日益细粒的偏好，即喜欢\
  \ A 而不是 B，而不是一种更深层的、整体的自我感知。\n\n`Cinematch` 在 Netflix 网站顶部的“你将喜欢的电影”缩略图，是如今 Netflix\
  \ 观众熟悉并喜爱（或讨厌）的更具动态的流媒体主页的前身。虽然 Spotify 的推荐在每首歌结束时快速且反复地发生，但电视流媒体服务的算法反应较慢。用户选择新节目来观看的频率低得多，大多数时候平台只需要播放剧集的下一集，这种推荐不需要计算。但尽管如此，Netflix\
  \ 的功能与 Spotify 类似，引导我们的选择转向特定内容，并塑造我们对特定类型代表性的感知，就像 Galaxie 500 乐队的歌曲《Strange》变得误导性地代表了该乐队的音乐一样。\n\
  \nNetflix 应用内的搜索功能缓慢且不准确；很难按类型搜索，也无法通过演员或导演等信息进行过滤。（这种缺失催生了一整类类型发布在网络上的搜索引擎优化文章，这些文章列出了\
  \ Netflix 上有什么和不缺什么，就像流媒体的电话簿一样。）搜索结果还受到其他用户之前操作的影响——它不仅仅是信息索引，而是另一个推荐推送，更有可能呈现出其他人已经喜欢的内容。用户的意图几乎被\
  \ Netflix 抑制了。主页变成了发现的主要方法，影响了观众看什么以及何时观看。根据 Carlos A. Gomez-Uribe 和 Neil Hunt 在\
  \ 2015 年的一项研究，用户 80% 以上的流时间是由 Netflix 的推荐引擎驱动的。在 Netflix Research 于 2018 年发布的一个宣传视频中，一位名为\
  \ Aish Fenton 的机器学习经理表示：“我们所做的一切几乎都是推荐算法。”\n\nNetflix 算法考虑了用户的观看历史和评分；具有相似偏好的其他用户的操作；以及内容本身的信息，如类型、演员和发布日期。它还包括用户观看的时间、在什么设备上观看，以及他们在该背景下倾向于观看多久。Netflix\
  \ 表示，特定的用户人口统计数据（如年龄、种族和性别）并未考虑在内——这些变量可能被认为接近偏见——但此类身份通常可以从关于用户的其他信息中推断出来。Netflix\
  \ 最终结合了基于内容的过滤和协同过滤。主页变成了一面魔镜，不需要用户输入就能呈现出他们那时可能想要消费的内容。它消除了选择的负担，以及数字文化早期阶段必须发生的更具目的性的筛选过程。正如“过滤世界”的许多方面一样，算法界面将自己为一个中立的媒介、一扇开放的窗户，或者更具体地说，是你个人品味的准确反映和强化。然而，它远非中立。\n\
  \n2021 年，一位名为 Niko Pajkovic 的传播策略师在新媒体杂志《Convergence》上发表了一篇关于 Netflix 推荐系统的论文。“算法正在取代从根本上人类——或者说，较少数字干预的——文化意义构建和决策过程，”他写道。Pajkovic\
  \ 旨在测试 Netflix 对个人品味的影响，为此设计了一组具有不同原型性格的虚假账号。这些性格从“硬核运动迷”到“文化傲慢者”再到“无可救的浪漫主义者”。运动迷观看与剧烈活动有关的内容，无论是虚构还是纪录片，偶尔看超级英雄电影但鄙视浪漫喜剧。傲慢者追求小众艺术电影和外国导演，任何能挑战他们感官的东西。但他们不怎么看电视，讨厌真人秀。浪漫主义者喜欢激情和高戏剧，在高雅和通俗之间切换。Netflix\
  \ 要求新用户选择几个符合他们品味的内容来塑造初始推荐，但 Pajkovic 没有选择任何内容，因此不同账户各自的主页最初在很大程度上是相同的。但这种情况很快发生了变化。\n\
  \n\n\n\nPajkovic 依次登录每个账户，观看符合该角色虚构口味的节目和电影，并随机化观看时间以消除这一变量。在开始观看的第二天，，个性化推荐就就开始了，各个账户的主页也开始出现分化。到了第五天，浪漫主义者的账户出现了一行标题为“给绝望的浪漫主义者的电影”的广告，而傲慢者的账户则显示了一行“受影评赞誉的大师电影”。诸如“经典最爱”和“刺激电影”等更通用的主页分类也包含了个性化结果，反映出相同类型的内容：为浪漫主义者推荐浪漫喜剧，为体育迷推荐运动员纪录片。或许这种轻微误导的策略对消费者来说是种讨好方式：你并不总是希望主页上的文字标签直白地提醒你，你看的所有都是浪漫喜剧。\n\
  \n### 品味社区与变体类型\n\nNetflix 算法将用户归入特定的“品味社区”，这类社区超过两千种。此外还有七七万多个“变体类型”或小众类别，包括“脑力法国艺术电影”、“20\
  \ 世纪 70 年代非裔美国动作冒险片”以及“基于真实生活的感性战争剧”。用户通常不知道自己是如何被分类的，也不了解这些不同小众类别的全貌。用户并非刻意选择这些分类；他们只是在主页不断缩小到他们最可能开始观看的主题时，看到了算法给出的结果。\n\
  \n### 视觉作品个性化\n\n比推荐本身更引人注目的是，Netflix 还会通过算法更改所有内容的缩略图，以针对特定用户进行定制。这种花招是于 2017 年底以“视觉作品个性化”的名义开始的。Pajkovic\
  \ 观察到这种现象发生在他的测试账户上。在观看两周后，页面上所有的缩略图看起来都彼此相似：“在为绝望浪漫主义者推荐的前 10 个标题中（分布在前两行），有五个标题的缩略图包含了浪漫的拥抱（例如，一对夫妇接吻或深情对视）。”同样，体育迷的主页也满了各种男性形象执行剧性动作的图像：挥拳、防守足球门门、骑牛。在截图中，这些布局看起来几乎令人作呕，内容同质化，就像一份只有汉堡的餐厅菜单。\n\
  \n有时，这些图像也具有误导性。对于 Netflix 制制的剧集《Outer Banks》（外岸滩），体育迷收到一张两个拿着冲浪板走向水的缩略图，而对于浪漫主义者，则是两个即将接吻的角色的特写。两者都符合账户的特定偏好，正如他们的观看历史所示的那样。但这两张图像都没有真正代表该剧，那是一部关于失踪和谋杀的动作驱动悬疑片。用户带着合理的焦虑发现，尽管理论上不追踪他们的种族，但\
  \ Netflix 的主页只显示与他们肤色相同的缩略图。2018 年发生了一场争议，有人观察到浪漫喜剧《爱情假期》（Love Actually）推荐给他们时，画面中突出了黑人演员\
  \ Chiwetel Ejiofor 的形象，而他在电影中仅饰演了一个配角。通过以这种激进的方式更改节目缩略图，平台正在操纵用户，而不是推荐他们可能喜欢的的内容，而是改变相同内容的呈现方式，使其看起来更符合他们的偏好。算法图像选择正推动你去观看一些原本可能并不感兴趣——特别是如果它被诚实地标注的话——抱着它最终对你有效的微小机会。这与界面传达的个性化信息背道而驰，也与个人品味的培养背道而驰，因为它从一开始就是一种操纵。\n\
  \n### 多样性的幻象\n\nPajkovic 在一个用于随机选择内容的账户（作为实验对照组）上发现了另一种操纵。在该账户的主页上，最终被呈现了《速与激情》系列的所有八部电影。算法事实上推荐了这些电影，尽管\
  \ Netflix 支付了高昂费用来获取其许可权。Pajkovic 写道：“算法在个性化的伪装下，默认推荐那些极有可能让用户产生高参与度的内容。”你可能喜欢《速与激情》电影是因为很多人喜欢它们，但这并不等同于针对你的特定偏好。最终，这种推荐创造了一种并不存在的多样性和深度幻象。\n\
  \n### 道德品味的侵蚀\n\n在过滤世界（Filterworld）时代，品味的空洞化与数字平台衡量参与度的方式有共同点：它是基于是否引起即时喜爱或厌恶的快速判断。品味的道德功能——即它通常能引导个人通向更好的社会以及更好的文化——正在流失。相反，品味等同于消费主义的形式，你购买或观看的内容是对你身份的最终定论，并决定了你未来的消费。\n\
  \nPajkovic 虚构的 Netflix 用户并非常态——很少消费者如此关注特定类别，因此主页可能更多样化。但推荐机制和缩略图的定制平庸了我们对文化的认知，限制了扩展视野的可能性。通过软强制将我们引导进入特定类别，Netflix\
  \ 算法最终将我们的品味定义为单一固定物，并随着每一次互动而变得更加僵化，越陷越深。即使推荐是准确的，它们也具有局限性。正如 Pajkovic 写道：“反馈循环强化了用户现有的偏好，减少了他们接触多元文化供给的机会，剥夺了艺术、审美和文化的冲突性角色。”这种冲突性的缺失令人担忧。并不是说艺术必须具有冒犯性；相反，当一切都符合预期时，我们就错过了那些真正进步且令人不安的文化，那些可能会颠覆类别而非完美契合的文化。\n\
  \nSpotify 的工作方式类似于 Netflix，将用户归入预定义的品味类别，与其他平台一样，它的算法往往存在缺陷、偏见且不中立。2019 年 9 月，乡村音乐之星\
  \ Martina McBride 尝试在 Spotify 上创建一个乡村音乐歌列表。该平台可以自动推荐歌曲添加到歌列表中。McBride 发现，算法连续 14\
  \ 次提供的列表全是男性乡村音乐人的歌曲，在刷新又刷新之后，才出现了一位女性音乐人。McBride 感到震惊，她在 Instagram 上写道：“这是懒惰吗？是歧视吗？是听力缺失吗？是脱节吗？”\n\
  \n\n\n\n渥太华大学研究乡村音乐电台播放情况的教授杰达·沃特森（Jada Watson）亲自尝试了这一功能，结果大相径：她对“全男性”列表进行了十二次刷新。尽管出于研究目的，沃特森仅使用\
  \ Spotify 听女性艺术家的歌曲，但她发现“在前 200 首歌中（经过 19 次刷新），只有 6 首歌（3%）是女性的作品，5 首（3%）是男女合唱曲（全部在男性歌手\
  \ 121 首歌曲后出现）”。这些推荐显然与她在 Spotify 上听的其他内容并无太大。麦布莱德（McBride）发现，歌列表推荐功能完全基于用户的收听习惯，而是基于歌列表的标题。因此，根据\
  \ Spotify 的算法，人们可能会认为乡村音乐等同于男性，即使在沃特森创建一个名为“带阴道的音乐人创作的乡村音乐”的歌列表时，这一公式依然有效。偏见的算法以一种偏见的方式定义了流派。沃特森告诉我，“这是对乡村音乐含义的一种非常狭隘的视角。”尽管传达了个性化的信息，但\
  \ Spotify 在这种情况下创造了一个多样性的真空。\n\n在 2014 年微软研究院的一篇博客中，一位名叫克里斯蒂安·桑德格（Christian Sandvig）的学者提出了“腐败个性化”（corrupt\
  \ personalization）一词，用来描述这种缺陷推荐，例如操纵性的 Netflix 电影封面和同质化的 Spotify 歌列表。桑德格写道：“腐败个性化是你的注意力被吸引到不属于自己的兴趣的过程。”推荐系统“服务于往往与我们的利益冲突的商业利益”。在\
  \ Netflix 的案例中，误导性的图像和无处不在的`Fast & Furious`建议可能会增加用户参与度，并鼓励人们认为从服务中获得了价值，从而继续续订，维持公司的增长。\n\
  \n腐败个性化的其他例子还包括：亚马逊在其市场中先于其他结果推荐其自有品牌，以及谷歌搜索将该公司的其他产品（如谷歌地图）列为最佳信息来源。公司获利了，但用户可能遭受损失，并且损害了整体的文化生态系统。正如桑德格写道：“随着时间的推移，如果人们经常被提供与其兴趣不符的东西，他们就会被教会想要什么……他们可能会错误地认为这些是他们真实的兴趣，并且很难以其他方式看待这个世界。”互联网日益被封闭在一系列泡泡中，这些是自我强化的空间，在其中找到多样化的观点变得越来越困难。这种观点在政治中并不陌生见——自由派主要消费反映其信仰的数字内容，保守派也是如此——但它也适用于文化。在个人品味方面，知道你喜欢什么是困难的，但当某物被如此费力地呈现为“为你推荐”时，知道你何时不喜欢或不想要某物同样困难。在“过滤世界”（Filterworld）中，在算法推荐的感知中，要信任自己或知道“你”是谁变得越来越困难。\n\
  \n2011 年，作家兼互联网活动分子埃利·帕里泽（Eli Pariser）出版了他的著作《过滤气泡》（`The Filter Bubble`），描述了算法推荐和其他数字通信渠道如何将互联网用户隔绝，使他们只遇到与自身相匹配的意识形态。在过去的十年里，过滤气泡的概念一直存在争议，特别是在政治新闻媒体的背景下。一些评估，例如阿塞尔·布鲁斯（Axel\
  \ Bruns）2019 年的书《过滤气泡是真实的吗？》（`Are Filter Bubbles Real?,`），得出了影响有限的结论。其他科学研究，例如 2016\
  \ 年《公共舆论季》（`Public Opinion Quarterly`）对过滤气泡的调查发现，确实存在某种“意识形态隔离”，特别是在涉及观点驱动的内容时。\n\
  \n然而，文化和文化品味与在线政治内容和意识形态信仰具有不同的动态；尽管它们通过相同的推送传输，但受不同激励驱动。政治过滤气泡通过分歧将用户隔绝在对立的派中，而文化推荐将他们聚集在一起，目标是为最大化材料建立越来越大的观众。算法文化汇聚在中心，因为消费某项文化的决定很少由仇恨或冲突驱动。印第安纳大学研究推荐算法的教授张静静（Jingjing\
  \ Zhang）在参加 2012 年都柏林推荐系统会议并的一个关于个性化音乐推荐的实验时，为同质化理论找到了证据。\n\n学生们看到的歌曲根据他们的告知，这些歌曲是根据他们的个人品味推荐的，并带有星级评分——但这些评分实际上是人为且任意的。然后，学生被问及愿意为某首歌付多少钱；星级越高，他们愿意支付的钱越多。每增加一个星级，支付意愿就会增加\
  \ 10 到 15%。实验显示了对推荐的感知如何扭曲某项文化的价值。由于算法推荐的自我强化循环，这种缺陷加剧了。张告诉播客`Planet Money`，随着时间的推移，系统将“提供更少多样化的推荐”。最终，她说，它将“为所有人提供类似的物品，就像口味一样”。\n\
  \n## 收集文化\n\n呈现推荐外 App 界面在决定我们消费文化以及对它的感受方面，可能与实际推荐一样重要。界面设计属于科技行业的术语“用户体验”：用户在导航、搜索和点击时发生的微交互。当今平台的用户体验往往是极度被动的。你不应该过多查看内部构造，只需消费眼前的内容——理论上，算法比你了解自己还了解你，尽管这显然不是事实。如果我们总是能够依赖于\
  \ Netflix 的主页、Instagram 的发现页或 TikTok 的“为你推荐”馈流来向我们展示我们感兴趣的内容，那么我们就不太有动力自己决定去寻找、关注以及最重要的保存。我们通常通过保存文化碎片来建立个人品味感：慢慢建立我们关心的事物的收藏，作为我们偏好的纪念碑，就像鸟筑巢一样。\n\
  \n但算法馈流越自动化，我们作为消费者就越被动，也就越觉得没必要建立收藏，去保护我们关心的事物。我们放弃了收集的责任。在过去的二十年里，文化的收集——无论是 DVD\
  \ 上的电影、黑胶唱专辑还是书架上的书籍——已经从一种必需变成了看起来像放纵的奢侈品。\n\n\n\n\n\n# 数字流离\n\n2021 年底的一个早晨，我在笔记本电脑上打开\
  \ Spotify，却发现自己突然迷失了方向。我习惯了通过一系列特定的点击来听我喜欢的音乐——在这个例子中是尤瑟夫·莱蒂夫（Yusef Lateef）1961\
  \ 年的一张名为《Eastern Sounds》的爵士专辑。在疫情期间居家办公的许多工作早晨，我第一件事就是播放这张专辑，这经常让 Jess 感到恼恼，她经常对那段重复且不和谐的开头音符发笑。但那天，我找不到那张专辑，也找不到我用\
  \ `Spotify Like` 按钮保存的完整专辑列表，那是该软件将它们保存在一起的主要方式。我的肌肉记忆失效了。这个收藏集在没有给我任何通知或选择的情况下，被重新排列了。这种感觉就像像是一种失语症，仿佛有人在一夜之间移动了我客厅所有的家具，而我仍在试图像往常一样在其中穿行。Spotify\
  \ 那种忧郁的黑绿相间的界面中，一个新的“我的媒体库”标签暗示了我正试图寻找的一切，但它打开的只是一个由自动生成的播放列表窗口，而我并不认识它们。相邻的标签提供了播客，而我从不在该应用上听过播客。一切都不合逻辑。\n\
  \n随着所有形式的媒体都转向流媒体，当一切似乎只需点击一下即可获得时，人们很容易忘记，我们也可以在个人时间里与所消费的文化作品建立物理的、非算法的关系。我们将书储存在书架上，将艺术品挂在客厅墙上，保留一叠叠黑胶片。当我们想要体验某些东西时，我们会去寻找：通过书脊找到一本书，或从封里取出一张专辑。我们与事物互动的方式以及存储它的地方，也会改变我们消费它的方式，正如\
  \ Spotify 的更新强制提醒了我的那样。同样的事情也发生在 Twitter 添加它自己的算法“为你推荐”馈时，也发生在 Instagram 移动发布照片按钮时（在那一段时间，它被替换成了观看\
  \ TikTok 风格视频的按钮）。\n\n所有这些变化都让我渴望相反的东西：一种固定、稳定、可靠的方式来获取你想要的任何文化。这正是早期的文化收藏和消费形式曾经提供的。我们曾认为这种稳定性是理所当然。\n\
  \n## 沃尔特·本雅明与所有权哲学\n\n1931 年，德国文化评论家沃尔特·本雅明写了一篇名为《打开我的图书馆》的文章，描述了我们与物理文化对象之间的关系。在文中，本雅明讲述了从满是灰尘的木箱中取出他的书收藏的过程，那些书籍已经被封存了多年。书卷散落在地板上，“尚未被秩序带来的轻微无聊所侵扰”，正准备好再次重新排列在书架上。对于本雅明来说，拥有这些书本身就成了成了作为读者、作家和人类的身份——即使他没有读过其中的每一本。它们骄傲地立在他的书架上，作为象征，代表着他仍渴望获得的知识，或是他旅行过的城市。积累书籍是他与世界互动的方式，是他构建世界观的方式，并在他的批判性写作中进一步深化这种世界观。\n\
  \n本雅明的图书馆是一座个人纪念碑，我们都会为自己喜欢或认同的事物构建类似的纪念碑，借此建立自己的品味。它的重要性在于它的持久性——收藏由我们拥有的东西组成，除非我们决定它们离开，否则它们不会消失。“所有权是人与物体之间能产生的最亲密的关系，”本雅明写道，“并不是说它们在他身上活了过来；而是他活在它们之中。”换句话说，我们经常在自己留下的东西中发现甚至重新发现自己。但如果本雅明书架的顺序和书籍目录每隔几个月就改变一次，那种收藏与人之间的共生或共同进化就不会发生了。这正是\
  \ Spotify 的界面更新和算法变化给我的感觉：对我塑造了我的艺术和文化作品的彻底破坏。\n\n## 能动性的的侵蚀\n\n在“过滤世界”（Filterworld）中，我们的文化收藏不再完全属于我们自己了。就好像书架开始实时自行变换形状，将某些材料移到前面，并淡化其他的。这让我想起一位幻术魔术师，在潜意识里鼓励你选择一张特定的牌牌——尽管魔术师让你相信那是你自己的选择。这种能动性的缺失正在破坏我们与所爱文化之间的联系。我们并不经常单独考虑书架本身（将其与其包含的内容分开），但它们是极好的装置。它们展示书籍或专辑，你可以以相对中立的方式从显示的选项中进行选择。收藏者是唯一决定如何安排其财产的人，按作者、标题、主题，甚至是封面颜色对书籍进行排序——而且它们会留在被放置的同一个位置。但我们的数字文化界面并非如此，它们遵循拥有这些技术的科技公司的喜好和优先事项。例如，如果\
  \ Spotify 突然给播客类别提供了一个显眼的新位置，那是因为公司决定播客在未来将贡献更多的收入。界面遵循了公司的激励机制，优先推销自己的产品，或者通过改变熟悉的模式来操纵用户尝试新功能。\n\
  \n本雅明写道，收藏者对他们的收藏有一种“责任感”。但对于我们在互联网上收集的事物，想要产生这种所有权感是非常困难的；我们无法像本雅明那样成为我们所欣赏的文化的守护者。我们并没有真正拥有它，也无法保证每次都能以相同的方式访问它。\n\
  \n## 瞬态的数字当下\n\n你可能积累了一个经过精心策划的数字音乐库，结果在应用更改时变得乱七八糟。或者当某个流媒体服务关闭时，你的收藏可能会完全丢失。数字界面倾向于在没有预警和没有记录的情况下改变；每次重新设计都会抹除之前的迭代。我们无法像几十年前那样通过拒绝更新来访问旧的、喜爱的\
  \ Spotify 或 Instagram 版本。现在的应用程序大多存在于云端，由用户在线访问，而公司完全控制它们的运行方式。这种不稳定性只会加剧正在发生的文化扁平化，因为用户无法在原始语境中存储或重温过去的经历。唯一存在的只是不断变化的数字当下。\n\
  \n某个应用的消失或重构会将那里收集的内容付之东流。互联网并不像一叠八轨磁带，可以通过适当的技术再次播放并完整地体验。在网上建立收藏更像是在海滩上建沙堡：最终潮水会席涌来，就好像它从未存在过一样。当我回顾自己在\
  \ Tumblr 等旧平台上的账号时会有这种感觉，在 2010 年代初，我在那里收集了 408 页的动画 GIF、诗歌片段和忧郁色彩的游戏截图；或者当我回溯到我在\
  \ 2007 年左右发布在 Facebook 上的相册时，那个功能已经过时，至少按其最初的设想那样消失了。\n\n\n\n\n数字技术的流沙夺夺了我们收藏品的意义。它们看起来仅仅是怀旧的废墟，是曾经繁华如今已归寂的大都市遗迹。我曾经在\
  \ Tumblr 上分享的许多图像现在已是失效的链接。我本可以在这些收藏品鼎盛时期下载它们，并确保我可以一直访问它们，但那样无法捕捉到它们曾经所代表的流动性和社交交换的意义。当我看着目前仍在线的\
  \ Tumblr 存档时，我看到了一个比如今算法时代涡轮加速推送流更慢、更亲密、更线性且更连贯的数字空间的一角。Tumblr 更像是一个书架。它提醒我事物曾几何与众不同，但并没有带给我多少重拾那种冥想式节奏的希望。\n\
  \n在青少年时期，我有一盒 CD 音乐收纳盒，存放在我经常驾驶的家车里。有些是我买的；另一些是我自己组装并刻制的混合带，将我的个人品味编码。我仍然留着那个收纳盒，现在看着它——典型的\
  \ 90 年代橡胶边缘和耐用织物面料——带给我一种怀旧感，以及对其中录音乐的记忆。有了 `Spotify`，我没有可以随身携带的 CD 收纳盒。随着我使用该平台的时间越长，界面不断变化，我发现自己变成了一个更加被动的用户，保存的专辑越来越少，对它们作为整体创作的主题和故事的思考也越来越少。但对我这个收藏者和文化消费者来说，最糟糕的是，这最终对平台是有利的：我会继续订阅\
  \ `Spotify`，因为这是我获取音乐的唯一途径。\n\n虽然我们拥有选择自由的优势，但算法推送呈现的无尽选择往往会引发一种无意义感：我可以听任何东西，所以为什么某件事对我来说应该是重要的呢？收藏与文化之间的建设性关系是双向的。当我们发现足够有意义的东西来保存并加入我们的收藏时，这一行为既让它在我们的心中刻得更深了一些，也为器物本身（无论是文字、歌曲、图像还是视频）创造了一个语境。这个语境不仅是为了我们，也是为了他人，为了大文化中那种交织在一起的共享的语境。这就是本雅在写作时描述的：“收藏现象在失去其个人所有者时，就失去了意义。”收藏需要个人的看护者，他们的声音和品味表达了收藏。`Spotify`\
  \ 的整体并不是连贯的收藏；它是一场雪崩。\n\n用户有时会觉得自己是那场雪崩的无助受害者。正如高管向我描述的那样，流媒体服务区分两种消费风格来分析用户。有“倾身”（lean-in）时刻，用户专注其中，选择消费内容并积极判断结果。还有“后仰”（lean-back）时刻，用户顺着背景运行的内容随波而去，并不太担心内容是什么或下一个将播放什么。算法推荐将我们推向后一类，在那里，我们像被养的鹅肝鸭一样被喂养文化，比起质量更注重数量——因为数量，即纯粹花费的时间，是平台通过精准广告获利的关键。\n\
  \n随着消费者变得越来越被动，无法行使与有培养的品味，艺术家们被迫更多地应对算法压力，因为通过推送流工作是他们获得维持生活所需的受众规模和参与度的唯一方式。他们需要在我们所在的地方触达我们，而我们所在的地方是在推送流中“后仰”，没有投入太多注意力，既接受最新的算法推荐，又可能在不满的一瞬间滑走。别无选择，只能适应。\n\
  \n## 创作者顺从推送\n\n`TikTok` 是一个我加入较晚但充满渴望的平台。那已经是 2020 年后期，在经历了几个月的疫情隔离后，我觉得自己已经耗尽了所有可能的在线娱乐形式。但我从未尝试过\
  \ `TikTok`：我认为它不适合我，认为作为一个千禧一代而非 Z 世代（Gen Z）成员，我并不是目标受众的一部分。但我渴望活动，于是我把 App 下载到手机上并打开了主流。我的“处女流”立即被视频片段填充，似乎是随机的。算法正向我的个人品味靶子投飞镖，看什么会落中——监视我一直看哪些，以及通过滑动跳过了哪些。几个主题开始显现：滑板技巧、可爱的狗和弹奏吉他的音乐家。这非常具有催眠性，尤其是因为我不需要做任何事情。我只需要向后靠，让我的大脑几乎在潜意识地决定什么是有趣的。逐渐，新主题在推送流中出现：游记、烹饪视频、在野外用原始工具制作的手工艺品。在短短几周内，大多数人喜欢的通用类别就精炼成了一系列我与一小群体共享的特定兴趣。这就是算法推送的运作方式，将我的偏好归类为品味，然后反复不断地提供这些主题。这是我用过的最个性化、最准确的推送流；因此，它感觉既令人愉悦又令人恐怖。\n\
  \n`TikTok` 由一家名为 `ByteDance`（字节跳动）的中国公司运营，并有一个中国对应的 `抖音`，但它直到 2018 年才在美国上线。那时 `ByteDance`\
  \ 收购了另一个名为 `Musically` 的中国社交网络，它于 2014 年上线，以青少年发布对口型音乐视频而闻名，在美国拥有预先的强大用户基础。`Musically`\
  \ 合并进了 `TikTok`，后者因其快速的音乐或舞蹈短视频而走红，这是其前身的遗留。起初 `TikTok` 视频最长只有 15 秒，是对短暂但深受喜爱的视频应用\
  \ `Vine` 的回响；然后限制被延长到一分钟，接着是十分钟。同样让 `TikTok` 脱颖而出的是它主要的“为你推荐”（For You）推送，这几乎完全是算法驱动。用户并不被鼓励去关注谁；他们只是信任公式的决定。（与\
  \ `Twitter` 和 `Facebook` 不同，后者在某种程度上保持时间顺序并基于关注关系。）这种噱头起效了；2021 年 `TikTok` 月活跃用户突破十亿，确立了其作为承载我们数字生活的巨大社交网络继者的地位。它的成功意味着全算法推送日益成为默认，并开始开启一个数字成名和文化成功的新时代。\n\
  \n我开始在推送流中看到的一类视频是快速的、无叙事的日常生活剪辑：咖啡倒出的瞬间、被铺好的床铺、阳光穿过公寓窗户的光。这些大多是匿名的，创作者将手机举在面前，组合出一幅周围环境的肖像。流行音乐提供了背景音乐：熟悉的歌曲为那一刻注入了电影般的氛围。这种格式似乎特别适合疫情期间，当时家庭环境必须被——正如\
  \ `TikTok` 用户所说的——浪漫化”，因为手头没有其他奇观。在一条 `TikTok` 中，一个男人拍摄了自己在高层公寓楼顶层道池中游泳的画面。背景音乐是\
  \ Frank Ocean 的《White Ferrari》，这是一首关于深夜驾驶的柔和且忧伤的歌曲。\n\n\n\n这是我对比格尔·卡比维纳（Nigel Kabvina）作品的介绍，当时他只是一个住在英国北部曼彻斯特的无名二十五岁。当我看到他的游泳视频时，卡比维纳只有几千粉丝。在接后的两年里，他拥有了超过四百万粉丝，并进入了\
  \ `TikTok` 创作者的顶尖行列，这得益于“为你推荐”流能够将视频瞬间推给数百万观众，即使该账号相对冷门。（如果推荐机制占据主导地位，其实不需要固定的粉丝群，尽管这样做也没有坏处。）卡比维纳通过激进地迎合算法获得了成功，将自己的品味——他的创作表达——屈从于算法推广的限制。但在最初，他只是在玩玩。在我们的第一次对话中，他解释说在制作视频时，他试图捕捉某些感受，一种\
  \ `TikTok` 格式特别擅长捕捉的瞬时氛围。这是对抗隔离压力的一种；卡比维纳在连锁特色鸡尾酒吧的调酒工作消失了。\n\n卡比维纳开始在自己的公寓里拍摄烹饪视频，这些短剪辑记录了他组装复杂的菜肴的过程，通常是为室友准备的午餐。他在牛油吐司上刻上巴洛克图案；烧焦迷迭香并将烟雾困在玻璃杯下；甚至将冰冻成一个晶莹剔透的碗来盛麦片。我看着他的账号粉丝不断增加，从最初几万到几十万。他的视频大火了；一个拥有自己内部梗的活跃社区在视频评论区壮大起来。到\
  \ 2021 年 8 月，卡比维纳已经拥有了一百万粉丝，并决定全职经营 `TikTok`。他很快争取到了如 `Google` 和英国杂货连锁店 `Sainsbury’s`\
  \ 等赞助客户。\n\n在在冬日的某天，我在伦敦会面见到了卡比维纳，当时他正从曼彻斯特出差回来。我让他选一个见面的地方，他选择了 Swift，这是一家在苏荷（Soho）有分店的著名鸡尾酒吧——“伦敦之必去之地，”他给我发短信说。我们先坐在一个铺满地铁瓷砖的店面二楼，然后溜进舒适地下室的一个卡座里。我也听从了卡比维纳关于开场酒的建议：爱尔兰咖啡，这是店里的特产，非常适合我们这种傍晚的会议时间。他穿着一套低调的全黑装扮，带着宽大而随意的微笑。我之所以认出他的脸，是因为他最近开始在\
  \ `TikTok` 上露脸，而之前他只从肩膀以下拍摄自己。卡比维纳的 `TikTok` 观众已经多到足以支撑他的生活，尽管其巨大的规模仍然让他感到困惑。“想象你走进厨房泡杯茶，想象有三十个人走进房间目不转睛盯着你看。然后试着想象一百万，”他说。每个月，他的\
  \ `TikTok` 视频都有四千万的播放量。卡比维纳的视频、算法流和贪婪的观众形成了一个反馈循环。他称之为“即时满足”：“我可以在 `TikTok` 上发布视频，十分钟后我回来查看，发现有三万人看过了。”\n\
  \n卡比维纳的背景中几乎没有任何迹象预示他会在社交媒体上成名。他出生于马拉维，他的父亲曾通过交换项目在英国曼彻斯特外的一个镇上的一所工程学院学习。21 世纪初，当卡比维纳六岁时，他父亲将他和母亲搬到了曼彻斯特。这座城市无论在温度还是性格上都是冰冷的。尽管他们搬进了一个小的马拉维社区，但这个家庭面临着英国当地人的种族歧视。“人们向我们房子扔东西；人们会朝我吐唾沫。当你是个孩子时，你对这些会产生脱敏感，”他说。这种氛围导致了一种疏离感。作为孩子时，卡比维纳在学校里并不热衷，直到他遇到了克拉克先生（Mr.\
  \ Clark），一位数学老师，他严谨的风格与他很合拍，卡比维纳的考试成绩开始提高。一天，数学课上的另一个学生说他想当会计师，卡比维纳决定追随这一脚步。\n\n\
  \n\n\nKabvina 喜欢这种细粒度的反馈和改进工作的迭代过程，这或许源于他的数学背景。“我看到创作者们对算法感到沮丧；他们认为是哪里出了问题，”他说，“比起试着说‘我的内容没那么好’，把责任归咎于算法要容易得多。”对于独立创作者来说，算法取代了老板和绩效考核；它是一个实时的权威，衡量着你适应其对“引人胜的内容”定义的成功程度，而这种定义总是在变化的。\n\
  \nKabvina 建立了自己的的一套用来衡量作品的公式。他获取某个视频的播放量，然后取其中的 10%。这就是一个视频获得成功所需的点赞数：至少有十分之一的观众必须被吸引并产生点击点赞按钮的动作。艺术家一直根据数字评估自己的作品，无论是电台播放次数、电影票销量，还是博物馆的观众人数。但在“过滤世界”（Filterworld）出现之前，创意品味——即艺术家评价自己作品的方式，以及消费者评价其鉴赏程度的方式——从未受到过数据和对注意力细粒度衡量的如此影响。\n\
  \n## 氛围文化\n\n当 Nigel Kabvina 在算法推送的压力下茁壮成长，并不断通过刷它来获得更高的粉丝数和赞助内容机会时，同样的力量也作用于各种类型的创作者身上。正如算法推荐将用户归入特定的消费类别并取代了他们的个人品味一样，算法也将文化输出进行分类，而创作者们正与这些类别发生冲突。这些类别是“过滤世界”的家族风格，在其中，伟大是由优化定义的，而非向未知领域进行戏剧性的创意跨越。文化根据数字平台产生的过剩数据被不断精炼，而这些平台提供了关于观众在何时、如何以及与哪些内容进行互动的每秒级记录。预设的风格无处不在且令人沉闷。同质化开始疏远消费者而非娱乐他们，而应该被指责的对象是“算法”。近年来，出现了一种潜在的情绪，认为算法文化是浅薄、廉价且退化的，就像一张被多次复印的复印件那样褪色变质。这也是一种算法焦虑：感到当像创作文化这样的人类活动都变得如此自动化时，真实性就变得不再可能。\n\
  \n关于这种无处不在的浅薄的抱怨日益频繁且愈发剧烈。我开始收集这些抱怨，以记录日益增长的敌意。诗人 Eileen Myles 说，创作过程与数字技术是无法剥离开的：“你可能不使用社交媒体，但它正在使用你。无论你喜不喜欢，你都在写推文。”剧作家兼小说家\
  \ Ayad Akhtar 描述了我们的“点击党意识”，这种意识被训练得去与推送流中任何旨在引发共鸣的内容产生互动。“对算法的崇拜正在摧残创意产业，”电视剧作家\
  \ Cord Jefferson 抱怨道，“文化已不再被创造了。它仅仅是从现有文化中被筛选、精炼，然后重新吐回给我们的。算法切断了发现新事物的可能性，”一位反技术生活方式的影响者\
  \ Paul Skallas 写道，他哀叹 2010 年代电影集的泛滥和漫威超级英雄系列无休止的延续。Skallas 将这种缺乏创新的现象称为“停滞文化”。“算法正在将未来限制在过去，”未来主义者\
  \ Jarod Lanier 说。正如已故的英国哲学家 Mark Fisher 所写：“21 世纪受于一种毁灭性的终结感和疲竭感的压迫。它感觉不像未来。”\n\n\
  这种认为文化停滞并深受同质化之苦的认知，确实是因为算法推送的无处不在。但并不是没有创新发生；而是创新仅仅在朝着推送的方向上改进，鼓励了服务于数字平台结构的产品开发，正如\
  \ Nigel Kabvina 的烹饪视频所做的那样。毕竟完美的算法文化作品几乎是刻意变得无趣的。它的空虚有时甚至是字面意义上的。2014 年，一个名为 Vulfpeck\
  \ 的乐队在 `Spotify` 上上传了一张包含十首沉默曲目的专辑，并将其命名为 `The Old Tape from Vulfpeck`（注：此处原文可能有误或特指\
  \ `Sleepify`，根据语境理解为该专辑）——*注：原文此处应为 `The Old Tape from Vulfpeck` 或是 `Sleepify`，根据下文，应为\
  \ `Sleepify`*。它的空虚有时是字面意义上的。由于是 John Cage 的作品 `4'33`，由于 `Spotify` 无法判断用户是否真的在听音乐，这首助眠专辑赚取了至少两万美元的播放分成，但\
  \ `Spotify` 要求乐队下架它，因为它“违反了我们的内容条款。”（作为回应，乐队录制了名为“Official Statement”的曲目并上传了它。）尽管它最终消失了，就像所有对抗数字平台的内容一样，尽管是一片空白，`Sleepify`\
  \ 仍然获得了一种成功。\n\n尽管这种概念出现于 20 世纪，但 21 世纪文化最相关的概念之一是作曲家 Brian Eno 创造的词“氛围音乐”（ambient\
  \ music）。Eno 在 1978 年的专辑 `Music for Airports` 的旁书中命名了这一新流派。“氛围音乐必须既可以被忽略，又有趣，”他写道。“氛围被定义为一种环境，或周围的影响：一种色调。”Eno\
  \ 创作了刻意氛围化的音乐。`Music for Airports` 是一系列缓慢、柔和的合成器曲目，像波浪拍击沙滩一样流入流出，非常适合机场这种转瞬即逝、空灵的空间。当你听这张专辑时，它轻微地影响着你的感官环境而不会产生干扰——你可以一边听一边工作、聊天，或者将其作为艺术品进行冥想。它奖励所有形式的注意力，适应任何目的。在“过滤世界”中，文化正变得越来越氛围化。就像\
  \ `Sleepify` 一样，它被设计成被忽略，或者像漫威电影系列一样，它的任何一个时刻或片段都没有特殊的意义，因为总有更多的等待等待。\n\nTikTok\
  \ 的“为你推荐”是这种趋势的一个很好的例子。信息流流过，用户不需要密切关注任何事物，因为另一个内容即将加载，并且根据他们之前的行为进行了某种程度的个性化。没有任何东西会疏远个人品味，也没有东西能深度吸引它。这种推送鼓励了氛围的特质，因为允许持续的基础性参与；用户永远不会停止流。然而，连续长时间消费（例如在刷\
  \ TikTok 视频期间）会导致去人格化的感觉：你正在变成算法推送所感知到的那个人，还是你本来已经是了？\n\n\n\n\n\nBrian Eno 的《机场音乐》的继任者是\
  \ YouTube 直播“lofi hip hop—beats to relax/study to”，它由一个名为 `ChilledCow` 的 DJ 在 2015\
  \ 年创建。这是一个 24/7 不断直播的频道，就像电视频道一样，中速带有原声倾向的电子乐，听起来通常迷幻或怀旧，仿佛是来自未来的音乐。该频道已经连续播放了超过两万小时，拥有超过一千万订阅者；它可能是我们时代最流行的平台之一。然而，这些音乐完全是不值得遗忘的：歌曲之间几乎没有区别，而音乐那种不干扰生活的一致性使其正如标题所示的那样，非常适合放松或学习——或者作为一段受吉卜力电影启发的、戴着大耳机坐在书桌前的女孩的动漫风格动画背景。正如埃诺所说，它可以被忽略，也可以被主动倾听——但它大多数时候被忽略了。\n\
  \n像 Nigel 早期那些氛围感视频和演讲传达的是一种没有具体含义的情绪，而这种含义留给消费者去解读。它们可以代表任何意义，也可以不代表。许多流媒体节目也是环境式的。2020\
  \ 年在隔离期间在 `Netflix` 上首映的喜剧剧《爱德玛丽在巴黎》很可能是巴黎的一个屏幕保护程序，庆祝了女主角在社交媒体上发布她在该城市生活片段的成就。当我们没有看电视或被社交网络应用催眠时，播客提供了背景式的闲聊和噪音。在许多情况下，通过算法推送传播的文化，要么设计旨在产生感官真空，要么是为了被平庸化为生活的背景，这是艺术向类似壁纸的事物的隐性退化。虽然个性化推送流制造了算法焦虑，但它们提供的唯一慰藉就是这种环境文化，它可以让你感觉很私人，但实际上并非如此——因为你不需要对正在消费的艺术思考太多，因为它很平淡。就像公司化的佛教形式一样，隐含的答案是从一开始就学会不要产生差异化的渴望，对摆在你面前的任何东西感到满足。品味的培养是不被鼓励的，因为在最大化参与度方面，品味是无效的。虽然对品味的阻碍可能看起来是个人问题——用户必须更努力才能识别自己真正喜欢什么——但它也会演变成巨大的社会问题。当数百万消费者被微妙地误导并因此被投养他们消费的内容时，某些类型的文化就失去了曝光和资金支持。这是因为资本流发生了变化，并很容易流向适应算法推送的事物。在选择观看的电视节目或购买衣服的背景下，这种影响是显而易见的，但它也影响我们生活中更大规模的行动，比如我们去的餐厅、旅行的地方，以及我们与邻里和社区成员互动的方式。\n\
  \n# 第三章\n\n## 算法全球化\n\n## 寻找通用咖啡店\n\n“过滤世界”（Filterworld）不仅限于我们屏幕上的数字体验。它也是一种塑造物理世界的无形力量。因为算法系统影响了我们作为个体消费的文化类型，塑造了我们的个人品味，它们也影响了我们倾向于的场所和空间。而我们的偏好流向哪里，希望向我们卖东西或吸引我们注意的商家就会随之而去。正如\
  \ `Netflix`、`Spotify` 和 `Instagram` 以算法方式优先考虑某些符合每个平台结构的数字内容一样，其他应用也将我们的注意力引向同样符合平台激励机制的地方。`Airbnb`\
  \ 引导用户选择符合其欲望算法反映的房屋租赁；`Google Maps` 通过在数字地图上强调本地机构，突出了一个个性化的本地机构集合；`Yelp` 和 `Foursquare`\
  \ 将用户评价和参与度汇总成餐厅、酒吧和咖啡馆的排名列表。认为在屏幕之外存在“信息流”很奇怪，但这些应用的作用就像是物理空间的算法版 `Netflix` 首页。你可以向下滚动列表并选择你想要获得的体验。这些应用让我们的现实（IRL）体验变得和数字体验一样毫无阻碍。\n\
  \n在 2010 年的大部分时间里，我是 `Yelp` 的忠实用户，这是一个用于寻找和评价餐厅和其他本地企业的应用。红白相间的界面变成了可靠的推荐来源。当我住在布鲁克林时，我每隔一周就会打开它，看看附近新开了哪些咖啡馆，或者查看那里的评价。当我旅行需要一个工作或打时间的地方时，我也会这个应用。在柏林、京都和雷克雅未克，我搜索咖啡店，并快速浏览\
  \ `Yelp` 的列表，列表是根据咖啡馆的星级排序的。\n\n我经常在搜索栏输入“文青咖啡店”作为一种简写，因为 `Yelp` 的搜索算法总是确切地知道我指的是什么。这种咖啡馆正是像我这样的人（当时是一个二十多岁的、敏锐感知自己品味的互联网脑型千禧一代）想要去的地方。不可避免的是，我可以在搜索结果中快速识别出具有必要质量的咖啡馆：大窗户带来的充足阳光；工业风大木桌供人坐卧；墙壁刷白或铺满地铁砖的明亮室内；以及可用于写作或拖延的\
  \ `Wi-Fi`。当然，咖啡本身也很重要，在这些咖啡馆里，你可以保证喝到用时尚的浅烘焙浓缩咖啡（比传统的深烘焙更具果味）制制的卡布奇，牛奶种类（包括全脂、豆浆、杏仁奶、大麻奶和燕麦奶，在不断增加列表中），以及复杂的拉花（用蒸发的牛奶在咖啡顶部拉出的玫瑰花图案，这已变成一种文青品牌标志）。咖啡店中最为坚定的会提供“平白咖啡铁”（澳洲式卡布奇变体）和牛油果吐，这是一种简单的食物，也源自澳大利亚，在\
  \ 2010 年代变成了千禧一代消费偏好的缩影。臭名昭著的标题指责千禧一代对昂贵牛油果吐的痴迷导致他们无法在绅化城市购买住房。\n\n这些咖啡馆都采用了类似的美学并提供类似的菜单，但它们并不是被母公司强迫这么做的，就像星巴克那样的连锁复制自己。对于公司来说，严格的统一确保了各门店的效率、熟悉感和可靠性——驱动了客户忠诚度和利润。相反，尽管地理位置遥远且彼此完全独立，这些咖啡馆都趋向了相同的终点。这种极致的相似性令人震惊且新奇，以至于并不无聊。\n\
  \n\n\n\n当然，这种文化全球化的例子可以追溯到有记载的文明时期，从遍布古罗马帝国各地的同质化大理石庙和浴场，到各种无处不在的殖民主义和全球迁移符号：十八世纪随处可见的英式红茶，爱尔兰酒吧或移民开办的中餐馆的大同小异。事实上，法国社会学家加布里埃尔·塔德（Gabriel\
  \ Tarde）在 1890 年曾抱怨过同质化，因为随着旅客列车的兴起，旅游业在欧洲兴起。正如他在《模仿法则》中所写道：\n\n> 现代大陆游客会发现，特别大城市和上层阶级中，酒店的票价和服务、家居家具、服装珠宝、剧院公告以及橱窗里的书籍，都存在着一种持续的相似性。\n\
  \n地方仅仅因为其相互互通（从产品、人物和思想的流动意义而言），就会在某些方面变得相似。交换越快，相似性就产生得越快。但 21 世纪的这些通用型咖啡馆的独特之处在于，其匹配细节的特定性，以及每个地方似乎都是从其所在地有机产生出来的感觉。它们是引以为傲的本土努力成果，常被描述为“地道”，我也曾负于过度使用这个形容词。旅行时，我总是想找个“地道”的地方喝杯饮料或吃饭。然而，如果这些地方都如此相似，那么它们究竟是对什么“地道”呢？地道性通常意味着与某个根源有直接联系，一个历史和意义的稳定来源。我最终得出的结论是，它们都真实地连接到了新的数字地理网络，通过社交网络实时连结在一起。它们对于互联网是地道的，尤其是\
  \ 2010 年代基于算法推送的互联网。\n\n2016 年，我为《The Verge》写了一篇名为《欢迎来到空中空间》（Welcome to AirSpace）的文章，描述了我对这种相似现象的第一印象。“AirSpace”是我对数字平台创造的奇特无摩擦地理环境的术语，在那种环境里，你可以在不同地点之间移动，而不会超出应用程序的边界。这个词部分是对\
  \ `Airbnb` 的变体，因为它具有实现全球旅行的能力，但也灵感来源于这些地方给我的虚幻感和不真实感。它们看起来与地理如此脱节，以至于可以漂浮并落在任何其他地方。当你身处其一时，你仿佛身处任何地方。\n\
  \n我的理论是，所有通过应用程序相互互通的物理场所——塔德泛欧列车的现代等价物——都有相互相似的方式。在咖啡馆的情况下，`Instagram` 的增长让国际咖啡馆主和咖啡师有了一种实时关注彼此的方式，并逐渐通过算法推荐开始消费相同类型的咖啡馆相关内容。一位咖啡馆主的个人品味也会向其他人的喜好倾斜，最终汇合成一个网络平均值。在商业方程式的另一端，`Yelp`、`Foursquare`\
  \ 和 `Google Maps` 驱动像我这样同样也能关注 `Instagram` 上流行美学的客户走向符合他们愿望的咖啡馆，通过将这些咖啡馆放在搜索结果顶端或在地图上突出显示。为了迎合受互联网塑造的大型客户群体，更多的咖啡馆需要采用已经在平台上占据主导地位的美学。适应规范不仅是追随时尚，更是一种商业决策，得到了消费者的回报。当一家咖啡馆在视觉上足够漂亮时，客户会受到鼓励在网上发布它。\n\
  \n\n\n\n正如 17 世纪早期的西方咖啡馆通过在同一物理空间内融合不同阶层，为民主和平等理念的传播提供了场所，2010 代的咖啡馆也创造了一种社会组织形式。它们为日益增长的“零工经济”者和数字创意劳动者提供了一个非正式的聚集点，这些人的时间表与传统办公室典型的“朝九晚五”不一致，而且完全缺乏办公室的基础设施。（我曾是其中一员，穿梭于布鲁克林的各种咖啡馆之间撰写计件文章，并逐渐熟悉其他常客的面孔。）除了通过数字平台建立联系，这种地理位置还服务于那些在数字平台上寻找工作的人，无论是\
  \ `Uber` 上的司机，还是 `Fiverr` 上的自由平面设计师。\n\n当我的《AirSpace》一文在 2016 年发表时，读者们接纳了我创造的这个词，并在他们自己的日常生活中观察到了它。他们给我发邮件分享“AirSpace\
  \ 味”的咖啡馆案例，并对这种风格的无处不在感到惊奇。尽管这种风格在咖啡馆中尤为易辨，但同样的感性可以在共享办公空间、初创公司办公室、酒店和餐厅中找到——所有这些都是人们临时花费时间和展示美学的地方，物理空间被转化为产品。\n\
  \n然而，随着时间的推移，我意识到 `AirSpace` 与其说是一种特定的风格，不如说是我们所处的一种状态，某种超越了单一审美趋势的东西。就像所有时尚一样，2010\
  \ 年代中期那个时刻的视觉风格也衰退了。白色地铁砖开始显得过于陈腐，我童年家里的层压木板台面感觉像极了 90 年代，它们被色彩鲜艳或更具质感的陶瓷砖所取代。布鲁克林早期那种“高大伐木工”式的原始粗犷风格（配以重新利用的工业家具），让位于精致的斯堪的纳维亚中世纪现代主义（细腿椅和木接接工艺）。在\
  \ 2010 年代后期，主导审美变得更加冷峻和极简，水泥泥台面和生硬的几何方块取代了椅子。像由生锈水管配件制成的灯具等装饰被抛弃，取而代之的是室内植物（尤其是多肉植物）和高质感的纤维艺术，唤起的是西海岸波西米亚风情而非苦辛的纽约市。与布鲁克林的关联逐渐消失（2020\
  \ 年疫情后，布鲁克林本身被认为没有曼哈顿下城那么吸引力），这种通用风格与某个地方的关联减少，转而与数字平台联系增加，如 `Instagram` 和崛起的 `TikTok`。在\
  \ 2020 年的一篇文章中，作家莫莉·费舍尔（Molly Fischer）将其标记为“千禧一代审美”；它也受到床垫供应商 `Casper` 以及共享办公空间连锁\
  \ `WeWork` 和 `The Wing` 等初创公司的青睐。费舍尔问：“千禧一代审美会结束吗？”\n\n风格的元素——爱迪生灯泡对比霓虹灯——事实不如基础性的同质性重要，而同质性变得越来越根深蒂固。招牌在变，多年来一步步演变，但相同性始终如一。即使在\
  \ 19 世纪，泰尔德就预测，未来的风格差异将不再基于“空间的多样性”，而是“时间的多样性”。\n\n每种新的审美转变都会变得无处不在。在我旧住的布鲁克林布什维奇（Bushwick）社区，一家名为\
  \ `Swallow` 的昏暗工业风咖啡馆（其家具经常像跳蚤市场的商品）曾是时尚巅峰，但很快被 `Supercrown` 赶超，后者是一个更光亮、配有匹配凳子和宽敞天窗的空间。在\
  \ `Supercrown` 关门后，`Sey Coffee` 在几街外出现。这是一个极简的环境，在这里多肉植物（有些甚至嵌入墙中）的数量超过了舒适的椅子。它的裸露砖墙被涂成了白色。曾几何时，后面有一个整个陶瓷工作室，生产咖啡馆使用的杯子，透着侘寂（wabi-sabi）的味道。这不是一个久留的空间，但在审美上是完美的。你几乎必须把它\
  \ `Instagram` 一下，在明亮的日光下，在光滑的水泥吧台上捕捉你的卡布奇。`Sey` 体现了那种为数字平台开发的、无摩擦且易于分享的审美。\n\n有时人们对咖啡馆里出现地铁砖感到恼恼。但我认为令人反感的是\
  \ `AirSpace` 的相同性，而不恰恰是风格本身。在多样化的世界中同质性是诡异的。在又一个地方发现预期的审美可能会感到失望——一种新生的无聊——以及一种被入侵的感觉，即数字平台的影响正延伸到以前未触及的地方，这是\
  \ `Filterworld`（过滤世界）扩张的标志。\n\n一位名叫萨里塔·皮拉·戈勒斯（Sarita Pillay Gonzalez）的南非女性在 2010\
  \ 年代后期在城市主义非营利组织工作时注意到了开普敦的这种审美。Gonzalez 将视为士绅化的形式，甚至是一个后殖民国家殖民主义的回声。通用极简主义的咖啡馆在开普敦市中心的克鲁夫街（Kloof\
  \ Street）不断涌现。当我与她交谈时，她列出了通过“长木桌、铁艺装饰、那些悬挂着的灯泡、悬挂植物”来识别这些咖啡馆。审美本身也蔓延到了不同的场所：啤酒厅、精酿酒馆、艺术廊、`Airbnbs`。Gonzalez\
  \ 说道：“这不仅仅是咖啡馆；即使是出租或翻新历史房屋的人，许多人也在遵循那种审美。”她在 2016 年左右住在明尼阿波利斯东北部时注意到类似的转变，那里的仓库建筑被变成了咖啡馆、微型酿酒厂和共享办公室，这些都是社区士化的化的标志。\n\
  \n根据 Gonzalez 的说法，这种风格标志着“一个全球可及的空间。你可以从曼谷跳到纽约、伦敦，南非再到孟买，你可以找到同样的感觉。因为这个空间如此熟悉，所以你可以轻松融入。”这种同质性与\
  \ 2010 年代通用的文士青年哲学相矛盾，即通过消费特定的产品和文化产物来宣告自己区别于大众的独特性——在这种情况下，是一个特定的咖啡馆，而不是某个冷门乐队或服装品牌。Gonzalez\
  \ 说：“这一切的讽刺在于，这些空间本应代表个性的空间，但它们极其单调。”她的评论呼应了 `Filterworld` 和算法推荐的另一个悖论信息：你是独特的，就像其他人一样。\n\
  \n不仅是空间，客户也是同质的，Gonzalez 观察到：“如果你进入咖啡馆，那里主要是白人。但那里在历史上是有色人种的社区。它显然与士绅化阶层的人有关。”只有某些类型的人被鼓励在\
  \ `AirSpace` 区域感到舒适，而其他人则被主动过滤掉。士绅化也是一种平庸化——这一事实从翻新建筑的视觉学中尤为易见，砖被涂成灰色，木栏杆变成了张力线，门旁挂着无衬线体的数字门牌号。\n\
  \n\n\n\n\n## 引言\n\n在 21 世纪初的美国，我是在“世界是平的”这一观念中长大的。那些年份见证了全球化意识的萌芽，殖民主义和资本主义让地球变得比以往任何时候都更加互联，也显得更加小。这一流行观点的主要魁祸首是《纽约时报》专栏作家托马斯·弗里德曼\
  \ 2005 年的著作《世界是平的》。这看起来像是一个常识：平坦化意味着人员、商品和思想跨越物理空间的流动比以往任何时候都更快、更易。这是历史上一个动荡的时刻，但即使是\
  \ 9/11 事件以及随后的持久战争，也带来了一个直观的教训：美国与地球其他地区并不那么遥远或隔绝。“世界是平的”因此变成了一个矛盾的教训：你可以消费大量在中国制造的产品，但中国发生的事情也可能影响到你个人。\n\
  \n## 平坦世界的力量\n\n在书中，弗里德曼写到了各种“平坦者”，即将地球连接得更紧密的力量。其中几种是数字技术：如廉价的网浏览器`Netscape`；实现国际企业与工厂之间协作的工作流软件；以及像`Google`\
  \ 这样扩展了信息获取渠道的搜索引擎。弗里德曼写道：“在人类历史上，从未有如此多的人——凭他们自己——能够找到关于如此多事物和如此多其他人的这么多信息。”这本书主要讨论的是国家和公司的宏观层面（这些实体正在迅速变得相似）。“竞技场”正在被公平化，这意味着无论公司位于何地都可以与其他任何公司竞争。层级制度正在被平坦化，因此小公司或自由职业者可以与大企业竞争。弗里德曼写道，正如公路连接了美国一样，互联网的光纤网络创造了一个“更加无缝的全球商业网络”，并“帮助打破全球区域主义”。\n\
  \n## 文化平坦化\n\n在新全球化秩序中，不仅工业和经济正在被平坦化，文化也呈现这种趋势。新兴的互联网产生了分享的压力，它在微观层面上连接了个体，就像国家和公司被连接一样。弗里德曼写道：“每个人都尽可能地将一切数字化，以便他们可以通过互联网管道发送给其他人。”自此以后，这些管道变得更大、速度更快了。\n\
  \n## 数字平台的兴起\n\n“过滤世界”（Filterworld）是弗里德曼平坦世界的终点，因为同样的力量日益作用于我们个人生活的方方面，直到潜意识层面。除了关于制造订单或消费者需求的枯燥统计数据外，图像和视频比以往任何时候都更快在全球范围内流动，特别是随着社交媒体的兴起鼓励用户生成自己的内容。社交网络在弗里德曼的书之后才开始突出，但与`Netscape`类似，它们使在线数字媒体的获取民主化——使得创作和消费变得可能。`Flickr`于\
  \ 2004 年启动，针对业余摄影师，赋予用户在个人账户上通过基础性社交网络上传、发布和组织照片的能力。`YouTube`成立于 2005 年。它允许任何拥有足够强大互联网连接的人上传和分享视频片段。`Instagram`于\
  \ 2010 年推出，创造了一种更大的分享文化，分享从新主流`iPhone`相机拍摄的快照。这些也变得全球化了。\n\n## 案例研究：江南风格\n\n没有什么比“江南风格”更能体现这种转变了。这是一首来自韩国歌手\
  \ Psy 的音乐录影带，由赵秀贤导演，于 2012 年夏天在`YouTube`上首映。这段长四分钟的视频从一开始就是一个国际化的产物，它源于美国`MTV`建立的模式、欧洲俱乐部科技舞的合成器色调，以及韩国流行音乐产业在全亚洲的流行。但这段视频也具有深层的特殊性，基于一首讽刺首尔最富有社区的歌曲，主要用韩语演唱。（除了那段段史诗般的英语副歌：“Eh,\
  \ sexy lady.”）。2012 年 12 月，“江南风格”成为第一个播放量突破十亿次的`YouTube`视频。最终超过了四十亿次。\n\n## 算法全球化\n\
  \n当这首歌和视频流行时，我记得自己对如此轻松就能 KK 感到困惑，就像观看任何美国音乐录影带一样顺畅。多亏于`YouTube`让这种体验如此无摩擦，部分归功于平台的算法推荐让这么多人看到了它。（记得在“过滤世界”中，注意力产生注意力）。2012\
  \ 年也是`YouTube`将`watchtime`（观看时长）变量整合到算法中的一年，根据公司博客文章，这意味着“你看了哪些视频看了多久”，从而导致了更具针对性的推荐。突然间，通过数字平台，世界上大部分的人都在看同一个东西。那只是数字全球化的早期。现在十年后，有超过三十`YouTube`视频的播放量超过三亿次——这象征着`YouTube`从电视那里吸收了多少观众注意力，也象征着它的用户基础变得多么广泛。\n\
  \n## 对个人体验的影响\n\n全球化通常被用来描述智能手机等商业产品的可用性；民主等政治思想；以及对如美国领导的伊拉克战争等国际冲突的干预。但这种互联也导致了个人体验更加平庸和无处不在的平坦化。在美国，我与印度、巴西或南非的互联网用户使用相同的设备，访问许多相同的社交网络，并连接相同的流媒体服务。弗里德曼加强国际竞争的模式导致了只有少数几个整体赢家，他们通过对国际化数字空间的垄断获取了巨额利润。（个人和小企业进行竞争，但在许多大型平台公司的背景下，他们主要是相互竞争购买份额，就像狼争夺领地一样。）\n\
  \n## 理论视角：流动空间\n\n事实上，在《世界是平的》出现之前的十多年里，文化理论学家就已经在描述全球化（特别是互联网带来的加速版）如何产生相似性和单调性。对于这种相似性也存在日益增长的焦虑，对全球化的文化后果感到不满。1989\
  \ 年，西班牙社会学家曼努埃尔·卡斯泰（Manuel Castells）构想了“流动空间”（space of flows），他在 1999 年的一篇文章中将其定义为“允许没有领土连续性的情况下社会实践同步进行的物质安排”。换句话说，卡斯泰认为，互联网等电子电信基础设施使得共享文化能够跨距离进行集体开发，而不是依赖于物理上的接近。形成的文化在电信网络覆盖的各个地点是相同的。这是对物理地理的偏离，卡斯泰将其标记为“场所空间”（space\
  \ of places）。\n\n\n\n\n\n如果地理位置变得不再重要，那么交通和移动区域就变得更为关键。1992 年，法国哲学家马克·奥热（Marc Augé）写了一本名为《非场所》（*Non-Places*）的书，研究了公路、机场和酒店的感官体验：这些区域在全球范围内已变得可靠地同质化。它们为现代游民带来了一种独特而矛盾的舒适感，而这些游民正属于无名之地带。奥热写道，在非场所，“人们始终在家里，却永远不在家里。”书的序言讲述了一位法国商人开车前往`Charles\
  \ de Gaulle airport`，穿过安检，在免税店购物，然后在飞机登机前等候。机场那毫无缺乏个性的空间达到了\n\n> 某种类似于荒地、庭院和建筑工地、火站台和候机室那种不确定的魅力——旅行者在此停下脚步，所有发生瞬时情感的偶然相遇之地，以及关于继续冒险的可能性。\n\
  \n通往飞机的行进以及随后飞行本身的麻木体验，涉及到对自我和周围环境的一种剥离，直到一切变得平滑且统一。这是一种熟悉的感觉——飞机起飞时那种与现实的轻微分离，或者第一次打开酒店房门时那种纯粹的匿名感。“非场所的空间既不产生单一的身份，也不产生关系；只有孤独和相似性，”奥热写道。他描述了“身份丧失带来的被动喜悦”。甚至连那名虚构的商人在飞机上阅读的杂志，也提到了“国际商务环境”中“需求和消费模式的同质化”。\n\
  \n### 全球化的乐观主义\n\n在 20 世纪 90 年代和 21 世纪，对于全球化的进程以及这种经验的空灵化存在着一种乐观主义或乌托邦主义。如果通过新的机场和国际酒店连锁让地球变得更加紧密，也许人们能更好地理解彼此。地理的平坦化就像通用语`Esperanto`（世界语）：它可能代表着一种简化，但至少对每个人来说都是熟悉的。有一种观点认为，相同性更有效，这不仅是为了舒适（至少对于富裕的西方旅行者来说），也是为了资本以投资或基础设施的形式从一个地方流向另一个地方时的培养。固定的模式更具可预测性，并且可以更快地规模。混乱的多样性是不盈利的，正如个人品味会导致数字消费效率低下一样。\n\
  \n### 雷姆·库哈斯与通用城市\n\n荷兰建筑师雷姆·库哈斯（Rem Koolhaas）对这种国际汇聚非常精通。他的事务所`Office for Metropolitan\
  \ Architecture`在 90 年代活跃于全欧洲，并因大胆的概念性建筑闻名，尽管这些建筑并不总是被建成。库哈斯的设计是超凡的。`OMA`1996 年的`Hyperbuilding`看起来像几座摩天大楼以尖锐的角度相撞，它可以建在任何地方，正如该事务所描述所说，“这是一个为\
  \ 120,000 人设计的自给自足城市：建筑的结构是城市的隐喻：塔楼构成街道，水平元素是公园，体量是区域，对角线是林大道。”建筑的无特征化，它易于融入新兴的非场所领域，是设计中刻意为之的一部分——一种拥抱通用性的美学。库哈斯在\
  \ 1995 年的一名为《通用城市》（The Generic City）的文章中描述了他的哲学，这种文章是那种你读过一次就会永远留在脑海中的短文之一。它对美学和建筑理论的尖锐断言在\
  \ 21 世纪被证明具有预言性。“当代城市是否像当代机场一样——‘完全一样’？”文章开头写，“如果这种看似偶然（且通常令人遗憾）的同质化是一个刻意的过程，一个从差异性向相似性移动的有意识的运动呢？如果我们正在见证一场全球性的解放运动：‘推翻个性化！’呢？”\n\
  \n库哈斯的通用城市是所有城市居民居住的地方，那里有经过士绅化的`AirSpace`建筑和咖啡馆；为技术工作者服务的共享空间；以及同样的餐厅和酒吧。这是我们下飞机后到达的熟悉地点，穿过机场，来到一间阁楼风格的酒店，使用手机办理入住。库哈斯认为身份的全球化平坦化是积极的，至少有其优势：“身份越强，就越封闭，越排斥扩张、阐释和矛盾。”以巴黎为例，“巴黎只能变得更加巴黎化——它变成了一个抛光的漫画形象。”一个地方的独特性只是吸引了更多游客，逐渐将其磨成粉末。差异仅仅成了阻碍。\n\
  \n### 流动空间与现代性\n\n人们必须以讽刺和对荒诞的包容来对待库哈斯的著作。这位建筑师有一种艺术倾向，做出宏大的言论，但这并非完全基于事实或数据。他的文章最好被视为挑衅，是对未来建筑如何运作或人们如何生活的狂喜愿景。库哈斯甚至从\
  \ 1995 年的视角就认为身份的衰落是互联网的结果。“通用城市是城市生活大部分跨越网络空间后的剩余，”他写道，“这是一个充斥着虚弱和扩张感的地方，情感稀少，像被床灯照亮的大空间一样谨慎而神秘。”在这种描述中，带有曼努埃尔·卡斯泰尔（Manuel\
  \ Castells）所解释的流动空间流失场所空间的影子，因为更多的生活和文化发生在物理位置之间或之中，而非内部。\n\n通用城市或流动空间，或是平坦的世界，逐渐创造了自身的语境、规范和期待。库哈斯写道，“它引发了对正常的幻觉。”“幻觉”是因为它并非完全有机，它是技术引发的幻象，像一场热梦；而“正常”是因为它是同质化的模板，一种无处不在的重复模式建立了一种它自身的正常性。通用城市已不可阻挡地扩张，不受约束。\n\
  \n盖特里·查拉克拉沃蒂·斯皮瓦克（Gayatri Chakravorty Spivak）是一位文学理论家，1942 年出生于印度加尔答，被认为是后殖民理论的先驱之一。她出身于西方，但在康奈尔大学和剑桥大学等西方机构受过教育，她的视角是审视和批判上世纪结果的独特棱镜。她在\
  \ 2012 年的论文集《全球化时代的审美教育》（An Aesthetic Education in the Era of Globalization）中写道：“1989\
  \ 年后，获胜的资本主义引导了全球化。”通过仅从财务生产力的角度衡量一切，资本主义已将生活的许多变成了“几乎完全的抽象”。\n\n\n\n\n我在本书引言中引用了斯皮瓦克（Spivak）的名言之一：“全球化仅发生在资本和数据中。一切都是损害控制。”我们谈论政治、文化和旅行的全球化，但从更基础的层面来看，斯皮瓦克是正确的，真正流遍地球的是各种形式的货币和信息：投资、公司、基础设施、服务器群以及所有数字平台的汇总数据，它们像风或洋流一样在国家之间无形地穿梭。我们这些用户自愿地通过这套系统泵入自己的信息，将自己也变成了流动的商品。\n\
  \n这种“扁平化”的历史非常重要，因为它证明了扁平化是有历史的。`Filterworld`（过滤世界）的同质化不仅是我们这个时代的现象；它是算法推送出现很久就已经发生的变化的结果，而且在未来同样可能加剧。毕竟，每当一次大扁平化被宣布时，世界总能找到某种方式变得更加扁平。\n\
  \n`Augé`（奥热）、`Koolhaas`（库哈斯）和 `Spivak`（斯皮瓦克）等思想家都曾将软件作为比喻，描述在在全球互联极度紧密的时代，地理位置和国家如何变得相似，并作为导致这种同质化发生的因素。但在社交媒体时代，同样的效应也发生在个人层面，包括文化消费者和文化创作者，他们都登录到同一组应用程序。在物理酒店和机场的位位上，我们有了\
  \ `Twitter`、`Facebook`、`Instagram` 和 `TikTok` 作为抹除差异的聚会空间。在越过 `Koolhaas` 的“通用城市”之后，现在还出现了通用的全球消费者，他们的偏好和欲望与其说是受居住地的影响，不如说是受他们使用的平台塑造得更多。在某些情况下，我们的生活更多是在“流空间”中进行，而非“场所空间”。我们才刚刚开始理解，如何和我们的世界一起，我们现在也变得扁平了。\n\
  \n作为一名活跃在网络上、并在记者职业中充当“作为内容的文化”筛子的人，我是这个系统的参与者和加速器。并不是因为我特别喜欢它，或者我希望同质化进一步蔓延。但 `Filterworld`\
  \ 的大多数居民要么是不愿意的，要么是不知情的。我们仅仅为了维持生或娱乐自己，就在加速这种扁平化。\n\n## 通用咖啡馆主们\n\n2019 年，当我为我的第一本书进行调研旅行并在京都时，在访问寺庙石水园的空隙，我也穿梭于这座城市的咖啡馆景观。20\
  \ 世纪初的日本，出现了一种 `kissaten`（喫茶室）文化：安静的茶室，提供咖啡且不供应酒精，服务于寻求安静环境的作家和知识分子群体。直到 19 世纪末，在荷兰商人首次引入后，咖啡才被正式引入这个闭关的国家。日本咖啡馆是以巴黎咖啡馆为蓝本的——尽管当时巴黎是极少数日本人去过的地方，除了富人和学术知识分子之外，他们正开始阅读和翻译法国作家的作品。\n\
  \n我从一个住在东京的朋友那里得到推荐，去参观 `Rokuyosha`（六如舍），那是那是 1950 年在京都开的一家 `kissaten`风格的咖啡馆。它很难找，位于繁忙街道的一处地下楼梯下，挂着一个不起眼的木牌子，安装在斑驳的青绿色和棕色方形瓷砖上，我后来发现那些瓷砖是为这家店定制的。走进店里就像进入了一个子宫：室内表面覆盖着装饰性的深色木质墙板，走廊宽的空间内排列着皮质垫长椅和双人位。一次最多只能舒适地坐下十个人。我向柜台后方经营店铺的老夫妇点了一杯手冲咖啡和一份手工甜甜圈，他们的声音几乎低如耳语，因为咖啡馆里一片寂静。像其他客人一样，我坐在自己的位子里，翻看一本书，并在笔记本上写字。里面的人没有在看手机，部分原因我觉得是因为这个空间似乎仍然存在于它最初建造的时代。\n\
  \n\n\n虽然街头艺术最初是一种游击活动，但“Instagram 墙”（Instagram walls）是专为让人们停下来拍照并发布到 Instagram 而设计的场所。它们也被称为“Instagram\
  \ 陷阱”。有些仅仅是色彩鲜艳的图形图案，为照片提供了完美的背景——墨西哥建筑师路易斯·巴拉干（Luis Barragan）1948 年住宅中那闪烁的粉色墙壁已成为了事实上的\
  \ `Instagram wall`，吸引了大量游客。另一些则创造了一个场景，让摄影的主体成为其中的一部分，类似于那些带有镂空的彩绘卡通木道具，人们可以把脸伸进去，假装成农夫或足球运动员。Instagram\
  \ 墙的缩影，也是其最流行的主题之一，是一对在空地两侧展开的天使翅膀，人站在中间，通常向上伸展手臂，仿佛在飞翔。只需让朋友向后退一步拍照，然后发布即可！\n\n\
  这一现象的巅峰可能是一家名为“Carthage Must Be Destroyed”的专注于早午餐的餐厅。它于 2017 年在我当时所在的布什维克（Bushwick）社区开业，位于一个布满森森仓库的街区。内部装修非常简陋——裸露的砖墙和管道、共用木桌——但它有一个极其激进的设计噱头：一切都被涂成了淡粉色。门是粉色的，柜台铺着粉色瓷砖，浓缩咖啡机有粉色外壳，餐具也是粉色釉面陶瓷。菜单并不特别独特，提供通常的吐司、牛油果等类（其合经营人\
  \ Amanda Bechara 是澳大利亚人），因此主要的吸引力在于美学。当媒体照片发布的那一刻，每个人都想去“那家粉色餐厅”。\n\n这个空间是为作为数字图像进行消费而优化的。当时，“千禧粉”（millennial\
  \ pink）——一种稍暗的腮红色——已通过互联网变得无处不在。它有时甚至被称为“Tumblr 粉”，与它扎根的那个早期多媒体社交网络相关联。你可以在 Nike\
  \ 运动鞋、Glossier 化妆品和 Away 行李箱上看到它。Apple 在 2015 年发布的“玫瑰金”设备也是这股潮流的一部分。Carthage 或许可以被称为“千禧粉体验馆”，一个沉浸式的\
  \ `Instagram wall`。游客们花了大量时间在拍照，以至于餐厅规定了一项官方政策，禁止对整个空间拍照——只允许拍摄自己的食物。这项政策并没有真正起作用；它几乎要求顾客拍几张违规照片并发布。如今\
  \ Instagram 上仍然充斥着理论打破规则的证据。\n\n到那个年代末，遇到这些装置变得令人精疲力竭。所谓的“Instagram 博物馆”应运而生，它们让拍照成为体验的刻意目标，仿佛去卢浮宫的唯一意义就是在《蒙娜丽莎》前拍一张自拍。那里甚至没有餐厅菜单来分散创作数字图像行为的注意力。2017\
  \ 年在旧金山开业的冰淇淋博物馆（Museum of Ice Cream）提供了以甜点为主题的沉浸式装置，同样来自 2017 年的色彩工厂（Color Factory）则为戏剧肖像提供了超现实的单色房间。它们作为引人的视觉艺术都是失败的，因为它们需要主体的存在和拍照才有意义——在数字平台之外，它们是不完整的；内容的产才是最重要的。在这方面，它们起到了非常明确的作用。`Instagram\
  \ walls` 或体验将游客吸引到某个地点，并通过提供一种可以用手机进行的活动来保持他们的参与度，就像餐厅为孩子提供涂色书一样。\n\n\n\n\n在一部名为《全球布鲁克林：在全球化城市设计食物体验》的\
  \ 2018 年学术论文集中，编辑者 Fabio Parasecoli 和 Mateusz Halawa 提到了“去中心化的相似性”。他们写道，2010 年代咖啡馆或餐厅的同质化模板“缺乏任何形式的中心化协调”，而是运行在网络动态之上，网络中的每个节点都在广播和接收其美学特征。这种分布发生的主要网络是\
  \ `Instagram`，咖啡馆老板们强调了这一点。这种从众的压力是真实的。\n\n在过去的十年里，`Instagram` 变成了“我们观察全球精品咖啡馆世界的透镜，”多伦诺极简主义咖啡馆连锁\
  \ Pilot Coffee Roasters 的营销经理特雷沃·沃尔什（Trevor Walsh）告诉我。“我们希望我们的设计选择能拍出漂亮的照片，营造一个可以分享精彩时刻的氛围。”在\
  \ Pilot 的 `Instagram` 账号上发布照片并让客户分享他们的体验，是与其他城市的咖啡馆和咖啡行业同事联系的一种。但该平台也造成了跟上的压力。“有一种持续生产内容的紧迫感。我们不断觉得必须出现在人们的手机里，出现在人们的桌面上，”沃尔什说。他们必须填充算法信息流。\n\
  \n仅仅作为一家咖啡馆存在是不够的；业务必须在互联网上培养一种并行的存在，这完全是另外一种技能组合。“感觉就像，你必须具备社交媒体敏锐度，你必须在这个与业务相关但未直接嵌入业务的领域精通此道，才能获得成功并被关注，”沃尔什继续写道。这意味着要实现诸诸之类的指标，例如在\
  \ `Instagram` 上有大量的标记照片，以及在 `Google Maps` 上的商家列表上有良好的用户评价。这种对拥有数字存在感压力的终点是一种只存在于线上的餐厅。“幽灵厨房”是简单外卖食品（如汉堡或比萨）的列名，它们在\
  \ `Uber Eats` 或 `DoorDash` 上有品牌标识，但没有实体位置；它们在另一家餐厅或工业集团厨房内运营。食物首先作为数字内容存在，并通过相同的渠道传输。\n\
  \n社交媒体敏锐度需要对每个平台的推荐算法保持关注，这一点与其他任何事情一样。沃尔什观察到，有些公司可能有很棒的故事讲，但他们“并没有试图跟上这些算法模式，而这些模式本可以让他们被更广泛的观众看到”。也许是他们发布不够频繁，或者他们没有跟上趋势的变化，例如\
  \ `Instagram` 推广视频多于静态图像，这是在 2022 年左右发生的一个尤为显著的变化，当时该平台正试图模仿 `TikTok`。算法推广也可能失效，即使你认为自己知道如何破解它。正如沃尔什告诉我的那样，“我们投入了大量的精力和精力来创作漂亮的内容。但由于算法的原因，我们发现自己并不一定能触达到我们认为或应该触到的那么多眼球，有时这会让人感到有些沮丧。”人气与咖啡味道好不好喝的关系较小，不如说它在\
  \ `Instagram` 照片中看起来如何。在线形象的重要性超过了几乎一切，这是一条现在适用于各种类型业务的法则：酒吧、烘焙店、时尚精品店，甚至是艺术博物馆。（在最后一种情况下，幸运的是画廊本身就已设计成观察物品的空间，创造了完美的视觉构图，可以转化为\
  \ `Instagram` 内容。）\n\n“我讨厌算法。每个人都讨厌算法，”罗马尼亚布加勒斯特咖啡公司 Beans & Dots 的所有兼创始人安卡·翁古雷亚努（Anca\
  \ Ungureanu）说，该公司的原址位于一家前印刷厂内。她的目标是建立“某种当时布加勒斯特不存在的东西”——一个至少在美学上是非本地化的空间。它吸引了国际观众；当有人在\
  \ `Google` 上搜索布加勒斯特精品咖啡店时，Beans & Dots 就会出现。翁古雷亚努开发了一个充满卡布奇快照的 `Instagram` 账号并积累了七千多粉丝，但当她觉得该平台正在夺走她通过信息流接触观众的能力时，她感到沮丧。当她的咖啡馆开始在线销售咖啡时，社交媒体的算法似乎限制了她的触达范围——除非购买广告。这种对数字存在感压力的终点是一种形式。这感觉像是一种勒索：交钱，否则我们不推。你。曾经帮助咖啡馆增长和接触新客户的工具突然反过来针对它。从某个时刻起，事情变得不公平，”翁古雷亚努说。\n\
  \n其他咖啡馆主也提出了同样的抱怨，例如柏林 Halles Haus 的联合创始人朱莉安·梅（Jillian May），这是一家 2014 年开业的咖啡馆兼杂货店。在它那高挑的天花板、带有拱形窗户的空间里，游客可以购买水壶、灯具、陶瓷盆，以及咖啡或沙拉。它有近三万\
  \ `Instagram` 粉丝。然而，“随着时间的推移，点赞量与粉丝数量的比例越来越，”，”告诉我，“五年前发布的同样的照片可以获得一千个赞，而今天只有一百到两百个赞。”她觉得该应用程序正在“迫使用户付费推广帖子，而我们并不习惯这样做。”对于一个建立在民主化用户内容基础上的社交网络来说，这种差异感觉像是违背了承诺。我们用户是社交媒体运行的动力，但我们对在平台上建立的关系并没有完全控制权，很大程度上是因为算法推荐占据了主导地位。\n\
  \n梅观察到了可能被称为粉丝通胀的影响。随着时间的推移，高粉丝量与实际互动之间的关联越来越小，因为平台的优先事项发生了变化，有些活跃账号离开了，或者同样的技巧不再有效。对于我们所有过去十年一直在使用\
  \ `Instagram` 的人来说，这是一种熟悉的感觉。虽然自拍照片点赞减少可能会损害自尊心，但当这种粉丝足迹是业务盈利的方式时，这是一个真实的财务问题，无论是吸引游客的咖啡馆还是销售赞助内容的网红。\n\
  \n追求“Instagram 网感”是一个陷阱：通过采用可识别的模板（无论是物理空间还是纯数字内容）而带来的快速增长，很快就变成了日常维护帖子和研究算法最新变化的苦差事——哪些话题标签、迷因或格式需要被遵循。数字平台剥夺了企业主主的自主权，迫使他们步调一致，而不是追求自己的创作奇想。过度趋近趋势也有风险。陈词滥调是不可取的。如果一个老梗调太陈旧，算法观众也不会与之互动。这就是为什么完美的通用咖啡馆设计不断发生细微变化，增加一些盆栽或移走几个。在算法信息流中，时机就是一切。\n\
  \n\n\n\n另一种策略是保持一致性，不必担心趋势或参与度，而仅仅专注于你最擅长的领域——在最深层意义上忠于个人理念或品牌身份。位于京都的地下室咖啡馆 Rokuyosha\
  \ 就是这样一个机构。如果顾客愿意，它完全负担得起让顾客随性流向它的水平。它没有 `Instagram` 账号。在某种程度上，咖啡馆也是一种物理过滤算法：它们根据人们的偏好对人进行分类，通过其设计和菜单选择静静地吸引特定人群并排斥其他人。从长远来看，这种社区的形成可能比获得完美的拉花艺术和收集\
  \ `Instagram` 粉丝更重要。这就是 Anca Ungureanu 在布加罗斯 尝试做的事情。“我们是一家咖啡馆，你可以在这里遇到和你相似的人，那些兴趣和你相的人的人，”她说。她的这段话让我思考，某种程度的同质化可能是算法全球化不可避免的后果，仅仅因为现在有这么多志同道合的人穿梭在同样的物理空间，受到相同数字平台的影响。这种相似性具有不断复合的。\n\
  \n## 算法驱动旅游\n\n`Yelp` 或 `Google Maps` 上的推荐通过轻微引导个体的脚步重塑了城市的地理格局：访问者步行去一家咖啡馆而不是另一家，或者即使他们是初到该城市，也能轻松找到他们喜爱的餐厅所在的社区。像看幻灯片一样搜索和翻阅一个地方的景点变得更容易，并以此决定去哪里，将浏览视为一种内容形式。在找到理想的地点后，他们可能会叫一辆车无缝地将他们送到那里，利用另一个按需算法市场。这种轻微的重定向也改变了资金和注意力的流向，使得某些位置优于其他位置。如果算法推广持续下去，增长将是自我强化的，因为注意力会再次产生注意力。\n\
  \n“过滤世界”（Filterworld）提供了一个日益密封的气泡，让你在其中穿梭世界，你的注意力顺畅地从一个对象引导到另一个，你的物理移动通过应用程序被引导向每个目的地。我亲自经历过这种旅行方式的转变。`Yelp`\
  \ 推荐让位于 `Airbnb` 租赁，这让我感觉自己不像个游客，而更像是任何全球城市中酷酷社区的临时居民。`Uber` 逐渐扩展到更多国家，因此我可以在更广泛范围内使用同一个熟悉的应用程序和界面打车。随着近期移动支付的扩张，我可以用手机在商店商店支付费用，甚至在纽约、伦敦或里斯本乘坐地铁。（加密货币曾承诺过——尽管并未真正实现——一种独立于政府的货币，可以随地、无缝地进行消费。）这类工具有一种让地方显得略微无意义的方法，因为它们很容易就能通过手机进行导航。城市变成了全知屏幕的背景，落入了流的空间。地理差异让位给数字相似性，当有太多的人遵循相同的算法路径时，这种相似性有时会变得非常不便。\n\
  \n21 世纪 10 年代中期，洛杉矶的居民发现，地图应用 `Waze`（它根据其他汽车的实时数据提供驾驶路线并会自动过滤出理想路线）正在破坏原本宁静的社区。当高速公路交通拥堵时，该程序会将驾驶者重新路由到住宅区，试图让他们更快到达目的地。“算法就是神，”《洛杉矶杂志》\
  \ 2018 年的一篇文章所宣称的那样。当使用人数不多时，这个招数很奏效，但随后它引发了自身的问题。北好莱坞和影制城的社区挤满了汽车和卡车，它们被困在陡峭的山坡和狭窄的角。事实证明，`Waze`\
  \ 算法将这些较小的街道视为与更大的街道具有容量；它做出建议时仿佛这些街道可以承受另外百辆车的流量，尽管显然它们并不能。交通导致了噪音污染和事故，导致当地政府开始与\
  \ `Google` 谈判以更改数据。社区居民开始自己反抗算法，登录 `Waze` 报告虚假的事故和道路阻塞，从而向应用程序表明绕过他们房屋的路线并不能节省时间。\n\
  \n## 对社区的影响\n\n机器将住宅道路视为它必须解决的方程的便利解决方案，尽管这个解决方案也有了自己的不满。（当地幸福并不是算法考虑的变量。）我在伴侣 Jess\
  \ 父母居住的康涅狄格州威斯特波特观察到了同样的情况。在距离纽约一小时程的地方，许多通勤者在向北或向东行驶时经过威斯特波特。当 I-95 高速拥堵时，`Waze`\
  \ 或 `Google Maps`（其母公司于 2013 年收购了 Waze 并开始整合其数据）会将驾驶者引导过这个两百年历史的小镇中心，那里仅供当地交通使用的道路。双车道桥变得堵塞，短路交通灯在再次变红前仅让几辆车辆通过。最终，时间并没有节省，市中心的生活质量遭受了损害。\n\
  \n仅仅因为应用程序本身的原因，这种奇异的运动才能以这样的速度和强度发生，这是另一种“去中心化的相似性”，但是行为上的而非审美上的。`Waze` 被动地引导驾驶者（他们可能甚至没有意识到前方的拥堵）采取它认定的最佳替代路线。这种通常可靠的应用程序的存在取代了我们对决策的需求以及决策所需的判断力。（虽然高速公路的选择并不实际上是文化差异的问题，但它是算法推荐取代个人品味的一种回声。）我高度依赖\
  \ `Google Maps` 来引导我到达目的地，早已忘记了曾经背过的任何驾驶路线。`Waze` 算法是资本和数据的新聚集，以意想不到的方式扭曲了周围的世界。\n\
  \n\n\n整个冰兰国家经历了某种类似于 Waze 高公路效应的现象，尽管这是他们刻意培养出来的。这是一个有生的 Instagram 陷阱。对于地球上几乎任何地方来说，这个岛屿作为吸引人类的目的地几乎是不可能了。它独自地漂浮在大西洋北部的海域，由活火山、、不可逾越的冰川和陡峭的峡湾组成。事实上，直到公元\
  \ 9 世纪左右，那里完全无人。一位名叫瑞典维京人加达尔·斯瓦瓦尔森（Garðar Svavarsson）在 870 年首次航行了整个岛屿，随后的 874 年在雷克雅未克建立了最早的定居点。（它的名字意思是“烟雾之湾”，之所以是因为首领因格尔夫尔·阿纳尔森（Ingólfr\
  \ Arnarson）在登陆该地之前注意到地热喷口发出的蒸汽。）1703 年首次官方统计冰兰人口时，有超过五万名居民。直到今天，其人口仍少于四十万，每平方英里约\
  \ 8 人，是世界上密度最低的国家之一。尽管如此，冰兰每年仍吸引了超过两百万游客（是当地人口的五倍），他们在该国至少停留一晚。2019 年，旅游业占该国出口收入的\
  \ 35%，并在新冠肺炎导致国际旅行停止之前达到巅峰。它比任何其他行业都要大，这意味着冰兰最有利的产品是推销自己，提供一种对往日无法触及之地的体验。\n\n###\
  \ 繁荣的催化剂\n\n旅游业并不一直是冰兰的支柱产业。直到 2000 年左右，游客人数才超过当地人口，而增长在 2010 年左右真正开始爆发。从那一年起，图表呈指数级增长，就像病毒传播一样。讽刺的是，是一场灾难引发了\
  \ 21 世纪的旅游热潮。第一个原因是 2010 年 3 月艾雅法山冰火山（Eyjafjallajökull）的喷发，由于空气中的火山灰会损坏飞机引擎，导致 4\
  \ 月份全欧洲航班停飞了一周。（对于冰兰本身而言，爆发在一个非常偏远的农业社区，只需要疏散大约八百人——没什么大不了。）这种戏剧性的新闻事件被全球报道，所有电视新闻节目都播放了冰兰的照片，而冰兰通常并不是这种全球性媒体曝光的主题。突然之间，数百万人看到了原始的景观、远方若隐若现在的冰川、倾泻而下的瀑布和天然温泉。“因为火山喷发，整个世界突然关注了我们，”在雷克雅未克市从事旅游创新的卡琳··玛丽亚·约恩斯多尔（Karen\
  \ María Jónsdóir）告诉我。\n\n### Instagram 效应\n\n根据一些冰兰人的说法，旅游热潮的另一个原因是 Instagram。在喷发后的多年里，数百万人试图为自己的账户重新创作那些像田园诗般的冰兰风景照片。在网上发布度假照片是\
  \ 21 世纪对典型的 1970 年代家庭幻灯片的更新。看到一张很棒的旅行照片，特别是在在线社交空间里，会引发一种本能的 FOMO 感——错失恐惧症。你想知道是在哪里拍的，那个人是怎么去里的，以及他们住在哪里。多亏了\
  \ Instagram 的标签和位置标记以及附带的落地页，点击链接查看某个地点通过算法推荐的热门照片变得非常容易。当然，冰兰的美丽并不是因为 Instagram，不像那些咖啡馆被刻意设计成适合发\
  \ Instagram 的样子。它的美丽是因为地质和地理的各种偶然。但 Instagram 框架并凸显了它的自然资产，该平台的推荐将冰兰标志性景点的图像推向数亿用户流的顶端，使这些图像变成了该国事实上的代表。\n\
  \n### 算法身份\n\n正如 Galaxie 500 乐队的戴蒙·克鲁夫斯基（Damon Krukowski）发现他的乐队音乐与其在 Spotify 上通过算法推动的首选歌曲的关联度，超过了音乐人选择来代表自己的单曲一样，Instagram\
  \ 流也开始为冰兰创造一种新的公共身份。在冰兰航空（Icelandair）工作了数十年的迈克尔·鲁切森（Michael Raucheisen）告诉我，社交媒体开始引导冰兰航空感知游客的需求。“我们从乘客那里看到的视觉效果几乎比我们素材里的照片更令人震撼，”他说。航空公司开始在机上杂志发表源自\
  \ Instagram 的照片。“全世界的人都能他们的社交媒体频道上分享冰兰的美景，这让我们的工作容易得多，”鲁切森说。再次，并不是 Instagram 创造了旅游业，而是它给了旅游业一个巨大的机会。冰兰航空提供了廉价机票和中转优惠，旨在帮助旅行者停留。雷克雅未克周边建立了新的、化的酒店。出现了许多以游客为主题的酒吧，如美国酒吧（American\
  \ Bar）。\n\n社交媒体也吸引了新的游客群体，他们的行为方式出乎意料。在繁荣之前的几十年里，冰兰的大多数游客来自邻国以及德国和法国。游客倾向于停留较长时间，计划在国家偏远地区进行探险。最近，主要群体已变为美国人、英国人和中国人。他们停留时间较短——有些被中转优惠吸引，在前往其他地方（通常是欧洲大陆）途中停靠——并且靠近雷克雅未克。从城市酒店出发的巴士之旅将游客送到主要景点、间泉和瀑布，然后将他们安全地送回房间。在线旅行社（OTA），如\
  \ `Kayak` 和 `Booking.com` 在 2010 年代不断增长，每年占据数亿次旅行预订。这些网站是搜索引擎、用户生成评论网站和推荐系统的结合，为航班、酒店和城市提供五星制中的平均评分，就好像有那么多\
  \ Netflix 节目供选择一样。通过这些渠道引导的游客越多，他们在该国的路径就越同质化，就像 Waze 将汽车引导过韦斯特波特市中心一样。\n\n### 优化的消费\n\
  \n就像通用咖啡馆（Generic Coffee Shops）的居民一样，算法驱动的全球旅行者是一个特权群体。能够在世界上自由移动需要正确的护照（可能是美国护照）以及正确的性别表达和肤色。以黑人用户为例，长期以来在使用\
  \ `Airbnb` 时一直困难，因为有种族主义倾向的房东，他们会拒绝预订请求，直到平台删除了显示用户脸部的个人资料。并不是所有人都能轻易被视为普通或融入看似无缝的空间。对于一组用户的便利并不意味着对所有人的便利。\n\
  \n\n\n\n在 Booking.com 的雷雅未克“最受欢迎”景点榜的首位，列出的是“金圈一日游”——这是一条涵盖冰岛最著名景光的线路，包括豪卡达达尔间歇泉、黄金瀑布瀑布以及辛廷格利尔国家公园（后者是公元\
  \ 930 年冰岛第一个议会的选址）。96% 的游客都喜欢这个行程，因为该景点在搜索结果中显示得非常突出。（相比之下，只有 69% 的人喜欢列出的那个三小时观鲸之旅——这蕴含的信息是：别费劲了。）在线旅行社（OTA）分类这些产品的方式对游客选择哪些项目有着巨大的影响，从而决定了酒店和旅行运营商等企业的存亡。当我与冰岛旅游局局长斯卡尔菲丁·伯格·斯泰纳尔松（Skarphéðinn\
  \ Berg Steinarsson）交时，他很快批评了这些服务。“他们的经济回报来自快速销售和简单产品。他们无休止地推广前十列表，因为那是一种简单产品，”斯坦纳尔松说。这种激励并不是提供特别独特的体验，而是说服尽可能多的网站访问者点击`Buy`按钮，参与内容。\n\
  \n这种建议信息的推送是肤浅的，并引发了快速、被动的决策；作为互联网用户，我们被教导顶部结果就是最好的。但我们缺失了深度，错过了那些鲜为人知的景点。2006 年，《Wired》杂志主编克里斯·安德森（Chris\
  \ Anderson）出版了他的畅销书《长尾》（*The Long Tail*），认为互联网的广度使得小众业务、产品和内容得以生存。人气是一条向左侧指数级增长的曲线；安德森预测，曲线长而平坦的部分（即多样但相对不受的事物）将以一种新的方式维持自身，因为消费者总能在网上找到他们寻找的特定物品。安德森在\
  \ 21 世纪初就观察到了亚马逊上算法推荐的自我维持效应，它们推动了一本出版于 1985 年、此前冷门的书籍《触摸虚空》（*Touching the Void*）的销量，该书最终进入了畅销榜。“大众市场正在变成一片小众市场，”安德森写道。\n\
  \n在过滤世界（Filterworld）时代，这种效应在某些方面被证明是正确的。TikTok 确实让小众内容创作成为可能；我喜欢的一位创作者通过制作北极岛日常生活的视频来维持生。但现在无处不在的算法推荐也让长尾图的左侧变得大得多，因为它们将即使是不感兴趣的消费者引向已经证明流行的标准化内容。视频游戏直播平台\
  \ Twitch 的泄露数据显示，只有前 .01% 的 Twitch 创作者能够获得美国中位数收入。安德森可能没有考虑到注意力与利润之间的关联会如此紧密，这种关联是由广告驱动的，而不是书籍或\
  \ DVD 的销售。“大众文化不会消失，它只是变得不再那么大众，”安德森预测道。我们现在知道事实并非如此。如果说的话，最近大众文化在审美上比以往任何时候都更加单一。\n\
  \n斯坦纳尔松在 OTA 推荐的浪潮中为冰岛旅游的“长尾”哀哀。“有这么多地方不在这些名单上，而且永远不会在名单上，”他说，“你需要挖掘多深才能开始看到那些真正特别的地方？”游客的体验被扁平化了，并不是因为他们没有其他选择，而是因为数字平台让仅仅随他人的脚步变得极其方便，这像是旧式旅游指南的加强版、更具强制性的版本。OTA\
  \ 和 Instagram 共同导致了冰岛成为“过度旅游”的象征，这个术语由旅游媒体企业家拉法塔特·阿里（Rafat Ali）于 2016 年创造，越来越多地用于描述那些因大量游客通过而遭受破坏或发生不可逆转改变的地方。数字内容承诺是可扩展的：只要服务器空间能够托管它，同一个文件就可以服务无限数量的消费者。更大的观众不会改变体验。但物理场所是不可扩展的。\n\
  \n2019 年，由于一项报道任务，我前往冰岛体验那里的旅游热潮，这种热潮在疫情完全停止全球旅行之前正处于顶峰。我住在 Airbnb 而不是酒店，选了雷雅未克市中心一小段的公寓。通过\
  \ `Airbnb` 的搜索功能，我确保了公寓靠近一家名为 `Reykjavík Roasters` 的工业风咖啡馆，这是我提前在 `Google Maps`\
  \ 上找到的。这间 `Airbnb` 是以工业风阁楼为模型设计的，拥有落地窗，窗可以俯瞰整个微缩的天际线。在装饰方面，这间毫无特色的公寓挂着一张巨大的布鲁克林大桥照片印张，这让我觉得离开纽约后哪里也没去过。尽管我特意选择了这种审美，但对于世界上物理位置最孤立的地方之一来说，这种标准化似乎太过度了。\n\
  \n我第一次离开雷雅未克的探险是环绕金圈的一天巴士游。这感觉就像回到了小学野外活动，我们这群游客坐在座位上满怀期待，一位极其冷静的导游重复着我们要去的地方的基础事实。黄金瀑布，那巨大的瀑布，是一个令人震撼的景象，地球的一道裂缝，每秒有\
  \ 110 立方米的水流过。巨大的水量和充满空气的、如音乐会扬声器反馈般的轰鸣声，即使没有背景也足以令人印象深刻：布满翠绿苔藓的岩石一直延伸到田野。但我所在的小组中许多人都在通过手机相机看风景。他们捕捉的景致，精确到角度，与瀑布\
  \ `Instagram` 页面上反复出现的画面完全一样。他们正在进一步复制这一图像，确保了它作为冰岛通用符号的主导地位。这让我想起了唐·德里留（Don DeLillo）1985\
  \ 年的小说《噪音》（*White Noise*），在书中，大学教授主角与同事穆里前往乡下看“美国最常拍照的谷仓”。观察着谷仓周围的摄影师群，穆里说：“我们来这里不是为了捕捉一个图像，我们是为了维护一个图像。每一张照片都在强化这种光环。“没有人看到谷仓，”他得出结论，“他们是在拍‘拍照的照片’。”在过滤世界中，很难将某物的本质或现实与其在注意力方面的受欢迎程度区分开来。单纯的人气往往被误认为是意义或重要性，就像德里留笔下的谷仓那样。\n\
  \n\n\n\n\n涌入冰岛的游客数量正缓慢地破坏着游客最初此的目的：这座岛的自然壮丽。在像 `Haukadalur` 间泉这样的某些地方，不断的脚步踩踏已让地面变成了泥泞。在夏季淡季，地面通常会有机会干透，但旅游业日益变得全方位化，草坪没有时间恢复。“如果那里流量太大，它会直接毁掉的，”Steinarsson\
  \ 说。\n\n由数字平台驱动的旅游导致了物理意义上的“扁坦化”——无数双脚和车轮造成的物理破坏，以及隐喻上的扁坦化。正如我对其他文化形式所指出的那样，在线的无处不在会让其主体变质，将其本质磨灭成为更容易被消费的东西，或者直接导致其被消耗直到消失。在“过滤世界”（Filterworld）中，独特性是一种转瞬即逝的产品，被算法推荐捕捉，并推荐得越来越多，直到它身上任何独特或特别的特征被摧毁或变成陈词滥调。例如，希腊岛屿圣托里尼以其白色建筑和蓝色圆顶闻名，在\
  \ 2019 年不得不发布告示，要求访问的 Instagram 游客停止闯入屋顶以拍摄完美照片。屋顶不仅仅是数字内容；它们是当地居民的家。2023 年，在疫情后旅游复苏期间，一段圣托里尼的\
  \ TikTok 视频观察到这种扁坦化进一步加剧，人群在屋顶上排队。发布者 Nikki Gibson 在旁白中说：“仅仅因为那里美就去视觉化消费它，这并不是旅游应该有的样子。”\n\
  \n这种“Instagram 化”（Instagrammification）的过程在我造访的两处冰岛温泉井中随处可见。第一个是 `Blue Lagoon`（蓝湖），是一个成熟的自拍打卡地。它便利地位于机场附近，是一组如画般的玻璃质建筑，环绕着一个落在深色崎岖火山岩之中的宽大池池。浅蓝色水面上升起的水雾在异星般的景观映衬下，构成了完美的拍照背景。尽管\
  \ `Blue Lagoon`并非完全天然温泉——它是通过地热发电厂的径流加热的——但我在那里度过了非常愉快的时光，在热水里漂浮，游到酒吧边，并用挂在脖子上的塑料手机壳手机拍照。我在脸上抹上白色的冰岛泥，拍了一张发在\
  \ Instagram 自拍。我周围的游客都在做同样的事情。你永远不会忘记自己是 `Blue Lagoon` 的游客，这里每年接待约百万游客。这并不是坏事，但对于那些自诩于寻找更“真实”体验并试图让自己置于当地人中的旅行者来说，这可能会感觉很奇怪。（尽管它对缓解时差很有处。）\n\
  \n我造访的另一处温泉在我的长途巴士游中被称为“秘密泻湖”（Secret Lagoon），尽管它的当地名称是 `Gamla Laugin`，或简单称为“老游泳池”。事实上，它是冰岛最老的池子；池水由间泉自然补水，每二十四小时更换一次水，始建于\
  \ 1891 年。1909 年，这里曾举办了冰岛第一场游泳课。在闲弃几十年后，它于 2014 年重新开放，有一栋单层建筑设有储物柜和淋浴室。与 `Blue Lagoon`\
  \ 不同，它并不是为了拍照而设计的。水是深色的，不是浅蓝色，周围环绕着平石床和长满苔藓的小丘，一条小小的木栈道穿过流流汩的间泉。一个没有门窗的破旧石小屋是该池历史用途的遗迹，赋予了它一种年代感和永恒感。它感觉很地道。我有点不好意思，我们这十几个外国人的旅行团在一个工作日的午后到达，似乎扰乱了几个老练独自游泳者的日常作息。但我喜欢这种宁静的氛围，以及这种地方除了让我欣赏之外，并不向我提出任何要求的感。我沉入水中，游向岸边，周围有充足的空间。没有人在挥动手机。\n\
  \n尽管我很庆幸能到达那里，但也感受到了像我这样的游客潮即将来临的威胁，这或许会损害 `Gamla Laugin` 的独特性，将其变成另一个 `Blue Lagoon`——一个拍摄\
  \ TikTok 视频和吸引 Instagram 评论的地方。在具有戏剧性的旅行 Instagram 照片下，最常见的评论总是“这是哪里？”，这暗示了另一个问题：我如何也能去那里？某种矛盾心理一直是旅行的一部分，既知道自己是游客，又渴望与不同的地方建立直接接触。然而，算法推荐已经自动化了那种口碑传播的过程，并将旅游变成了一条传送带，更深地侵入当地的文化生态系统——在这个过程中让地方（或至少是它们的体验）变得更加相似。世界仅仅是内容的潜在素材，用来吸引少数点赞，为数字平台赚钱，然后消失，不太可能再次被看到。曾有一刻想要避开那种循环，我离开了\
  \ `Gamla Laugin`，并且没有发布过关于它的任何内容。\n\n## Airbnb 迁移\n\n在 COVID-19 疫情期间，塑造旅游业的同样的算法力量也开始塑造美国境内的移动。在短短几周内，许多人评估房地产的方式发生了反转。密集的城市曾日益成为理想的居住地，但由于医院过度负荷和隔离的幽闭恐惧，密度变得不再那么有吸引力。根据美国人口普查局的估计，2020\
  \ 年和 2021 年，人口明显向郊区和农村转移。像俄勒冈州本德（Bend）、缅因州波特兰（Portland）和蒙大拿州白鱼（Whitefish）这样的风景胜地蓬勃发展，房价也随之上涨。在东北部和大西洋地区，重点是纽约州北部，即哈德逊河谷到宾夕法尼亚边界的广阔土地。在\
  \ 2020 年夏季混乱的月份里，如果你买不起乡村房屋，次优选择就是租一间作为避风港，而这样做最快的方法是通过 `Airbnb`。算法市场让移动变得点击按钮一样简单——但这种发生的速度和规模意味着租金也变得负担不起。如果你足够快且付得起钱，地理位置就没有阻碍；如果你不能，你就被困住了，并且可能面临更高的新冠感染风险。\n\
  \n2020 年夏天，我和一群朋友在卡茨基尔山区（Catskills）预订了一间 `Airbnb`，这样我们就可以从不同的城市汇合：华盛顿、波士顿、纽约。我注意到，那些具有典型\
  \ `AirSpace` 美学的房子——白墙洁新，配备极简主义家具和黄铜配件——往往预订最快，价格最贵。我们的小组最终在纽约州亨特（Hunter）发现了一栋大房子，里面有一件来自直销品牌\
  \ `Joyboy` 的切斯特菲尔沙发，大木板餐桌旁放着漆成黑色的谢克椅。我们能得到它非常幸运——一个女人刚刚取消了她的夏季租约，而我在十二小时后预订了它。事实上，这栋房子位于一个院落内，地上还有两间较小的木屋，两个布鲁林的家庭已经预订了连续几个月。这些\
  \ `Airbnbs` 的存在是因为 COVID-19。“因为有很多人想要长期租住，我们在疯狂的疫情期间一直在拼命地翻修它们，”房东 Deirdre Patton\
  \ 后来告诉我。Patton 在向房源列表目上传照片之前，就已经在平台上租出了那些小木屋。\n\n\n\n\n迁移的突然发性导致纽约州北部地区出现了一些奇怪的现象。装修被仓促进行，房屋在几乎没有任何家具的情况下就被推向市场，并伴随着如水管道损坏或地板漏洞等显眼的问题。正如一家租赁公司的创始人告诉我的，习惯了全屋厨房的城市租客会发生意外，比如忘记把派留在烤箱里烤焦并触发了火灾报警。随着纽约市的人口涌向北边，占据了本就紧张的住房存，一种“涡轮绅士化”正在发生。根据一位房地产经纪人的说法，房屋的成交价比挂牌价高出\
  \ 20%%。这不仅发生在纽约州北部；那些突然能够（并被迫）在家办公的人可以在任何地方工作。选择地包括墨西哥城、里斯本和巴厘等热门的远程工作目的地，这些地方涌入了大量新的长期游客。这些人是“数字游民”——他们在旅行的同时从事着高薪的远程工作或自由职业兼职，在风景如画且价格实惠的地方通过笔记本电脑工作。\n\
  \n当然，即使没有`Airbnb`，这场疫情迁移仍然会发生，但平台通过让租客能够极其轻松地找到他们所需的空间，并激励房东将房屋投入市场，加速并加剧了这种趋势。在某种意义上，`Airbnb`创造了这种即时移动的预期。该公司最著名的口号之一是“身在随处”（Belong\
  \ Anywhere），这是一场始于 2014 年的营销活动。“像住在那里一样去体验一个地方”是另一个口号。其背后的信息是，你不再仅仅是一个游客了；你可以通过住在他们家里来扮演一个真实当地人的生活。\n\
  \n`Airbnb`由布莱恩·切斯基（Brian Chesky）和乔·格比亚（Joe Gebbia）于 2008 年创立，他们是来自罗德岛设计学院的室友兼老同学，都学习过工业设计，此外还有开发者内森·布莱查齐克（Nathan\
  \ Blecharczyk）。大学毕业后，他们搬到了旧金山，产生了一个想法：在公寓的客厅铺设充气床垫，将其作为一种极简的民宿出租。在城里的一场设计会议期间，他们获得了第一位客户，当时酒店人满为患，游客在住宿方面几乎没有负担得起的选择。这种情况构成了平台对亲密感和归属感的承诺基础：它应该是关于闲置空间的，一种近乎慈善的分享行为，带有网络社交积极面性的外壳。陌生人可能会互相认识，而房东（或秘密租客）可以通过变现并不总是必需的房间来支持自己的生计。这种交汇产生了一家现在价值超过\
  \ 800 亿美元的公司，拥有超过 1.5 亿用户。`Airbnb`可能是具有最直接物理后果影响的大型数字社交网络。\n\n在实践中，该公司建立了一个如此丰厚的市场，以至于许多列表仅限短期租赁——没有人住在里面，让公寓甚至某些整个街道都带有了酒店的氛围，就像马克·奥热（Marc\
  \ Augé）所说的“非场所”（non-place）失控一样。在早期，`Airbnb`派遣专业摄影师记录物业，确保所有列表都共享相同的冷色调、广角、攻击性明亮的美学，以便像\
  \ Instagram 那样的数字图像更具吸引力。辅助性的手工业行业随之兴起，比如`Airbnb`经理（在客户之间打扫房屋）以及设计顾问（可以就吸引平台人群的装饰提供建议）。其中一位顾问纳塔莎·福伦斯（Natascha\
  \ Folens）在 2016 年告诉我，房东应该拥抱“工业风和中世纪风格”。“只要它看起来不杂乱不陈旧，”她补充道。\n\n当我回溯浏览我在`Airbnb`上拥有十年的个人资料历史时，我看到了一格格同样空旷的白墙空间：里斯本的一座山顶公寓，我和我不得不支付滞纳金才能进入；塞维利亚带有戏剧性木质百叶窗的庭院；纽约州北部由一位模特转行的经营者拥有的森林玻璃房；东京即使在密集的城市中心，也包含在独立微小建筑内的无菌阁楼式工作室；位于圣马特山附近完美无瑕的巴黎公寓，拥有完美的艺术书集。我去过所有这些地方，但从某种意义上说，它们是同一个地方，包含在我的账户里，不属于任何地方。当然，这些真实的城市依然存在。普通人在其中以某种密度和个性的方式生活，这是任何旅行都无法涵盖的。但我与这些地方的接触是有限的，我被引导向那些强化我自身观点的体验，即由我所有的在线个人数据所构建的品味特征。我觉得我居住在每个目的地的\
  \ Instagram 版本中——一个浅的、表面上互动的图像，最终并没有反映现实。事实上，图像遮蔽了现实，使其更难被发现。这种感觉——真理和真实性是难以捉摸的，而我们被一系列数字中介阻碍去寻求它们——似乎是“过滤世界”（Filterworld）的核心。\n\
  \n近年来，反`Airbnb`的涂鸦出现在其已占据主导地位的城市墙壁上。在雅典，写着“停止 Airbnb 和旅游”以及“我们的城市正在变成商品”。在威尼斯，写着“去\
  \ TMAirbnb”。在葡萄牙的科布拉，写着“一个 Airbnb 游客驱赶了我们城市的 2 到 3 名学生”。这些是对算法的抗议，也是对美国硅谷公司整体统治地位的抗议。巴塞罗那和柏林因对`Airbnb`的严格监管而闻名，限制谁可以在平台上出租空间以及租多久。人们对`Airbnb`这家公司遭到了反弹，抗议其激进的费用和对不可靠房东的松散审核。也许酒店，这种最初的通用体验，正在重新流行？但我从未放弃过`Airbnb`。我太被那个抽象的承诺所吸引了：在几天里过上与自己不同的真实生活，想象自己是里斯本的雕塑家，或者是东京的音乐家。对我来说，如果我住在真实的公寓里，旅游的幻象会更加完整——尽管它终究还是一个幻象。\n\
  \n`Airbnb`作为一家公司意识到了它的扁平化效应。2021 年底，我与现任`Airbnb`CEO 切斯基进行了交谈。那是一次`Zoom`通话；切斯基在他旧金山的家中，尽管背景被滤镜模糊成了虚无。他说话很快且坚定，这是一种对事事一切都有自己想法的人的语气。“我正试图学习过度旅游的教训。我并不认同世界上有太多的旅游；我认为过度旅游主要是因为太多的人在同一时间去了同一个地方，”他说，“如果你能设计出一个完美的画面，你会把人们均匀地分布在许多地方、许多日期，而不会让任何一个地方过载。”\n\
  \n\n\n\nChesky 表示，Airbnb 专注于解决这种“旅游重新分配”的问题。由于科技平台很少正视自身所造成的巨大社会变革，并倾向于淡化自己的影响力，因此令我很惊讶的是，他承认\
  \ Airbnb 不仅影响了人们的旅行方式，还影响了他们去哪里，并积极影响了目的地。“我们将需求引向我们有供应的地方，引向那些需要需求的城市，”他说道。正如“过滤世界”（Filterworld）中的其他内容一样，地理位置也面临着发现的问题。在有这么多选择的情况下，想要找到一个特定的旅行地非常困难；推荐既要提供有趣的发现，又要提供熟悉且易于识别的内容。用户倾向于留在预定的路径上，正如\
  \ Chesky 所解释的那样：“Airbnb 上有十万个城市和城镇。人们脑子里并记不住十万个目的地；他们只记得大约十个，而这十个是他们在 Netflix 剧里看到的那些。每个人都想去巴黎，是因为有了*《艾玛丽在巴黎》（Emily\
  \ in Paris）*。”\n\n我问 Chesky，他认为认为有这么多人通过他的数字平台前往同一个地点，其选择和品味受到在在那里发现的内容的影响，后果是什么。他问：“你触及了我们时代的核心问题之一：我们与地方的关系是什么？在一个人们可以自由跨国移动的世界里，民族主义是增多了还是减少了？”Chesky\
  \ 最终认为这种转变是积极的：“我内心的乐观主义者希望这一切的意义是世界变得更小了一点。如果你能让物理世界变小，那几乎完全是一件好事。我认为这就是终局。”然而，这种“小”的愿景是在\
  \ Airbnb 的庇护和控制下的，遵循公司设定的模板和其获利的条件。“小”意味着同质化和向统一的转变，而且很可能是在西方默认设置下、在科技行业的意识形态下进行的。Chesky\
  \ 暗示的权衡是：流动越多，认同感就越少。认同感同样也是内容的问题。\n\n# 第 4 章\n\n## 影响者经济\n\n## 追赞\n\n对我而言，互联网与劳动力始终密不可分。网络生活是工作与娱乐的混合物，往往二者兼顾——考虑到互联网的演变是为了将上面涌出的文化商品化，这完全是可以预料的。甚至在我上大学之前，社交媒体就是成年职业化的标志：2006\
  \ 年夏天，你只有在拥有即将入读学校的大学邮箱地址后才能登录 Facebook，而被录取的学生直到大一入学前的夏天才能收到该邮箱。所以，当我终于获得 Facebook\
  \ 账号时，它主要是一个建立人脉的空间，用来结识将与我在塔夫茨大学（Tufts University）学习的其他同学。我们很快为 2010 届届生建立了一个 Facebook\
  \ 小组，这在当时似乎还是遥远的未来。我们列出家乡，辩论想主什么专业，并计划线下（IRL）聚会。因为共同的归属感，这个社交网络提前在数字空间里将我们聚集在一起——这在当时是一种罕见的社会组织形式，将互联网与线下生活融合在一起。一个影响重大的生活事件从那个\
  \ Facebook 小组诞生：那是我第一次与我的伴侣 Jess 互动的地方，我们开始就共同的音乐趣味进行交流。\n\n在大学三年期间，互联网也为我提供了最初的一些机会。我为《塔夫茨日报》（Tufts\
  \ Daily）撰稿过评论，并在 2008 年加入了 `Twitter`，当时那个平台更像是一个咖啡馆，而不是轰鸣的体育场。那时和现在一样，`Twitter`\
  \ 最成瘾的用户群体是记者，他们忍不住大声呐叫。（埃隆·马斯克可能在 2023 年将 `Twitter` 的官方名称改为 `X`）。与此同时，《大西洋月》（The\
  \ Atlantic）当时还是一本印刷杂志，最近在其网站上启动了博客，涵盖了文化和政治等广泛领域。自由稿人往往是新兴的年轻作家，因为他们必须愿意接受低廉的费用。塔夫茨大学的一个曾在《大西洋月》实习过暑假的朋友向我介绍了一位编辑，她采纳了我的几篇稿件。\n\
  \n\n\n\n\n流行度竞争是文化中一个永恒的特征。（在史前时代，肯定某些洞穴画比其他的更受推崇，并吸引了尼安德特特人一个接一个地观看。）中国古代绘画收藏家习惯于通过加盖印章在喜爱的画上留下自己的名字——这类似于一种赞同的推特或点赞。大师杰作在几个世纪里积累了大量的印章，有些甚至直接层叠在彩绘的风景之上。在西方艺术中，画作周围带有徽章的精美画框可能代表了它的重要性，正如书籍上的畅销榜标签或“白金认证”的专辑标签一样——这些都是高文化价值、或至少是高经济估值的符号。这些信号一直引导着消费者可能想要消费并因此欣赏的内容。例如，畅销榜标签可能会鼓励购物者对某本书再看一眼，或翻到第一页。艺术家一直必须是某种营销人员，演变出作为其作品名片的公众形象，正如杰克逊·波洛克和安迪·沃霍尔所做的那样。现在的不同在于，在“过滤世界”（Filterworld）中，指标——点赞数、预先的关注——往往比文化作品本身声音更响亮。它们不仅是成功的衡量标准，更创造了成功，因为它们决定了最初推荐给观众并被观众看到的内容。这就好像一位十二世纪的中国艺术家在展示作品之前，必须获得足够数量的印章。\n\
  \n### 指标的兴起\n\n我很快学会了几乎完全根据数字来衡量我在互联网上的成功，这些数字在主流社交媒体的早期阶段就泛滥了。`Facebook` 帖子或 `Tweet`\
  \ 点赞数代表了触达了多少人，代表了有多少人被你那短小的自我推销公告或带有主张的信件所启发并点击了按钮。但这能代表帖子的质量吗？我们真的应该通过这种任意的新指标来评价自己吗？这些问题悬之不去，但考虑到新社交网络的实用性以及它们提供的即时触达，人们很容易忽视这些困境并继续发布。\n\
  \n突然之间，用户可以得知每一件小内容与任何其他内容的对比。数字是无法逃避的，出现在你阅读或观看的任何内容旁边。即使点赞、分享、转发或收藏的计数是平台本身强加的人工价值衡量标准，它们仍然是判断无限内容流中弹出什么内容最快、最简单的方式。越多越越好：如果一个\
  \ `YouTube` 视频有很多播放量，也许它很有见地，或者至少很有趣。病毒式传播等同于质量——别人喜欢这个，你也会喜欢。对于创作者来说，无论是作家还是有志之成为\
  \ `Instagram` 网红，指标都是目标、激励，以及评估哪些有效、哪些不佳的内在指南针。特别是在新闻领域，数字越高，某件事似乎就越重要。这是一个不证的真理：点赞越多意味着更多的人看到了东西。每一个点赞都是这个看似唯胜论的互联网中的投票。\n\
  \n### 病毒式传播法则与算法\n\n病毒式传播法则——点赞作为向算法的信号，表明特定内容值得获得更多推广——在数字媒体的早期尤为相关。出版物的网站开始在故事标题附近添加快捷按钮，以便将文章分享到\
  \ `Facebook`、`Twitter` 以及不断增加的其他平台。然后，这些按钮被更新为带有它们自己的微小数字，显示了读者在遇到文章内容之前，文章已经获得了多少点赞或转发。点赞变成了互联网的货币，记者被迫追逐它们。\n\
  \n作为一名作家，我密切监控文章的点击量。当我的故事获得的点赞比其他多时，我感到自豪。当我推特链接或在 `Facebook` 上分享我的故事时，我会注意到哪些帖子获得的响应最多。最成功的往往是那些影响了读者个人生活，或具体化了他们面临的抱怨或问题的故事。当我做出权威或戏剧性的陈述时，反应也同样剧烈。我会通过我们一直开启的\
  \ `Gchat` 窗口招募朋友和同事，在内容发布的一刻通过点赞来为我的成功预热。多年后，当这些按钮不再受宠、可见的数字从文章页面上消失时，我松了一口气。但在过去的十年里，每当我发表一篇文章，我都会为有多少人点击了“点赞”和“转发”而焦虑。我可以尝试操纵系统，并意识到哪些方法可能会社交媒体上产生额外的互动，但最终结果不受我控制。\n\
  \n### 算法生态系统\n\n点赞的暴政在某种程度上是我们在线上存在的算法生态系统的功能。每一次按键都是另一个待吸收的数据信号，一个你正在关注某件内容的微小信号，这可以被用来训练机器学习系统，以便为你提供更多此类内容。计算机并不追踪我们的眼球运动——至少目前还没有——所以点赞或表情符号等按钮充当了我们对内容反应的代名词。这些是自我表达的便利捷径，但也不可避免地为精准广告的磨坊提供了更多燃料。我们通过如此公开地发出自己的偏好信号，参与了自我监控。\n\
  \n不只是文章是被点赞衡量的。`Instagram` 自拍、`Facebook` 上关于假期或婚礼的状态更新，以及 `Medium` 上宣布新创业项目的博客文章也是如此。`Medium`\
  \ 是一家由 `Twitter` 创始人于 2012 年推出的极简博客平台，曾采用“点赞”作为其衡量标准。用户可以点击按钮为作品点赞，并根据意愿点击多次——最多五十次。曾一度，点赞数还决定了\
  \ `Medium` 向使用该平台的作者支付的费用，这是点赞与价值的等式。随着时间的推移，点赞出现了通胀。每个点赞的价值越来越低。到 2020 年，对某物点击“点赞”与其说是你喜欢它，不如说是你只是感知到了它它突破了互联网的整体噪音。记者通常会在社交媒体简介中加入免责声明，“点赞不同于认可”，以防误读。尽管你并不总是因为真的喜欢一个帖子才按点赞赞按钮，但点赞是你唯一获得的功能。\n\
  \n每位社交媒体用户对什么会获得点赞都有一种直觉。就像古典美或几何比例一样，这个公式是不精确的，但总是可以识别的。挑衅引发点赞，因为点赞是一种忠诚和同意的姿态，是判断用户站在喷子的一方还是受攻击者的一方的符号。愤怒获得点赞，因为点赞信号了同情的愤怒：你也生气，因为谁能不生气呢？因此，有一种常见的帖子格式声称没有足够的人关注某个话题：战争、灾难、糟糕的政策、一个坏人。这种无知本身就是一种愤怒！\n\
  \n\n\n\n还有一些更易接受的情绪被用来诱发点赞。幽默非常奏效，既是因为你喜欢这个笑话，也是因为你想把它分享给他人，所以分享会催生更多的分享。\n\n共鸣（Relatability）之所以有效，是因为它让社交媒体上最广泛的受众能在事物中看到自己的影子。具有共鸣的内容包括饮食习惯、对自身懒惰的抱怨以及共同的童年经历（例如“你是否曾经……？”）。我曾推特过：“抱歉我晚回回了你的邮件，我当时莫名无故地恐恐打开它”，这是我对自己邮箱收箱焦虑症的瞬间反思。这句话并不特别幽默，也不辞藻华丽，但有近\
  \ 15 万人点赞——通过点赞，他们实际上以某种方式替自己说出了这些话。一位作家朋友习惯于将她最平庸的观察保存起来，在周末发推特，理由是那时观众正在寻找特别能引起共鸣的内容。这通常很有效，经常能获得数万个点赞。\n\
  \n最后，从怀旧或熟悉的意义上的认可度（Recognizability），是驱动点赞和参与度的完美因素。你点赞是因为你知道某个东西是什么；比起没看过的节目片段，你更有可能点赞一个你看过很多遍的节目片段，因为后者需要你坐下来看完视频并进行评估。\n\
  \n这些激发点赞的情绪属于我们人类最原始的本能之一，这很合情，因为它们……（注：提供的文本后半部分包含重复/乱码片段；我已根据指令对前半部分的核心叙述进行了处理）。\n\
  \n\n\n这并不是新的压力；想要被喜欢是人类的基本心理，我们最终总是喜欢与自己最相似的事物，这就像在对话中模仿他人的肢语言可以让你看起来更有说服力或更具同理心一样。讨喜感通过“互不冒犯或不疏远彼此”的共同驱动力将社会联系在一起。然而，人际间的讨喜程度一直不是一种常见的文化标准，特别是我们在过去一两个世纪里所推崇的那种创新型艺术。艺术本身——更不用说作为人的艺术家——往往不受追求讨喜的束缚，然而，“点赞”却是当前这种量化暴政最优先考虑的东西。在“过滤世界”（Filterworld）中，受欢迎的会成功，而不受欢迎的注定会失败，特别是在任何必须依赖观众才能生存的文化领域。而且由于我们的美国文化景观几乎完全隶从于资本主义，这意味着多或少，所有内容都是如此。\n\
  \n## 算法文化的空虚\n\n2021 年，在艺术和商业上都取得了成功的电影大师马丁·斯塞斯（Martin Scorsese）在《哈哈的杂志》杂志上发表了一篇文章，这本杂志以刊登小众文学评论而闻名，而非世界级导演的舞台。在文中，斯塞斯讲述了他对费莱里尼（Fellini）的个人赞赏，这位中世纪的意大利导演以宏大、华丽的作品著称，但他借此机会谴了当代电影的现状。斯塞斯写道，在视频流媒体时代，电影已被平庸化为“内容”这一类别。“内容变成了一个涵盖所有动态影像的商业术语：大卫·林恩的电影、猫咪视频、超级碗广告、超级英雄续集、某部剧集的一集。”斯塞斯继续描述了我们文化生态系统的架构——我们消费的内容正在被算法推荐所过滤，而这些算法根据我们已经看过的以及当前内容的主题或流派来运作。“根据定义，算法是基于计算的，将观众仅仅视为消费者，别无其他，”他写道。与内容互动只有一种方式：吸收并点赞。\n\
  \n斯塞斯认为，这种对“内容”的泛泛分类以及对熟悉感的算法优先考虑已经破坏了电影这一媒介：“电影一直不仅仅是内容，而且将永远如此。”失去的是电影更深层次的艺术形式，这种改变了他自己以及许多人生活的媒介，以及通过银幕呈现的审美上甚至是道德上的挑战。观看伟大的电影并不总是舒适的；那种体验超越了平庸的消费，旨在审视社会规范，并让观众发现自我的新维度。\n\
  \n斯塞斯以费莱尼的电影作为“易于消化的内容”的对立面，并将电影制作作为艺术的巅峰。费莱尼 1963 年的电影`8½½`在斯塞斯眼中是这位导演作品的巅峰，是一部关于艺术家生活的、碎片化的、自我指涉的冥。斯塞斯描述了该电影首映时的场景：“人们对它争论不休：效果太有戏剧性了。我们每个人都有自己的解读，我们会一直坐到深夜谈论这部电影——每一个场景，每一秒钟。当然，我们从未达成过一个确定的解读。”它是如此奇异和陌生，以至于斯塞斯必须缓慢地消化，将其影响融入他后来的电影中。我在斯塞斯的文章中听到的那种偏执感是：21\
  \ 世纪的艺术已不再经受起这样的审视。相反，它是廉价且转瞬即逝的，掠过你的生活却没有留下任何可辨别的痕迹。（他文字中的激情显示出斯塞斯受费莱尼的影响有多么大，这种影响在六十年后他仍在处理。）这可能是因为为了适应数字信息流，为了吸引那些有害的点赞并尽可能地推销自己，文化必须先是内容，后是艺术——如果还有艺术的话。\n\
  \n斯塞斯的抱怨可以归因于他作为该领域元老的身份；有些人可能甚至认为他的立场是过时的。自他青少年时代以来世界已经改变；他不再需要思考什么是新颖，因为他的名声和地位意味着他可以创造任何他想要的东西。但其他人也有同样的无味和焦虑，呼应了斯塞斯的哀叹，算法推荐的某些特性剥夺了文化的内在意义。在接受《美国公共广播电》（NPR）采访时，制作人巴里·迪勒（Barry\
  \ Diller）评论道：“这些流媒体服务一直在制作他们所谓的‘电影’。它们不是电影。它们是一些奇怪的算法过程，创造出了一些持续 100 分钟左右的东西。”当代文化最犀利的评论家之一迪恩·基西克（Dean\
  \ Kissick）在 2021 年写道：“现在的文化很大程度上带有被算法制造的空洞、空虚感。”‘算法化’已成为任何感觉过于圆滑、过度简化或为了吸引注意力而过度优化的事物的代名词：高制作价值与对基本内容几乎不关注的结合。”\n\
  \n我也感受到了这种空虚。到 21 世纪 10 年代末和 2020 年代初，许多文化形式——书籍、电视节目、电影、音乐和视觉艺术——似乎主要存在是为了获取转瞬即逝的注意力并填充无尽的\
  \ App 信息流。没有什么能像杰作在几十年后仍会被重温的作品那样留人心。对我来说，一个重大信号来自艺术界流行的某种绘画风格，年轻艺术家在画廊和拍卖会上赚取了巨额。2014\
  \ 年，艺术评论家兼画家沃尔特·罗宾森（Walter Robinson）创造了“僵尸形式主义”一词来描述它。僵尸形式主义是剥离了情感和宏大的抽象表现主义，如奥斯卡·穆里奥（Oscar\
  \ Murillo）和雅各·凯西（Jacob Kassay）等人的软塌塌笔触或冷色单调画布。评论家杰里·萨尔茨（Jerry Saltz）呼应道那是“仿制品艺术”。他们对无意义装饰性的倾向导致了一批描绘光鲜超现实场景的画家，例如艾玛丽·梅·史密斯（Emily\
  \ Mae Smith）拟人化扫帚的画。（迪恩·基西克将其称为“僵尸写实”。）\n\n这些是适应了 Instagram 的绘画，而那里也是收藏家日益倾向于发现和购买它们的地方（通常没有亲眼看到艺术品），再次通过算法推荐进行媒介。他们可以轻松地在同样的平台上进行转售，就像分享帖子一样简单。2014\
  \ 年，臭名昭著的挪用艺术家理查德·普林斯（Richard Prince）跳过了这一过程，创作了一系列“绘画”，这些实际上是发现的 Instagram 帖子的复制品，售价价格高达\
  \ 10 万美元。\n\n对算法驱动艺术的恐惧部分在于对艺术家的消解：如果可行的艺术可以由计算机创作或筛选，那么人类创作它的意义何在？像迈克·温尔曼（Mike\
  \ Winkelmann，化名 Beeple）这样的艺术家在 Instagram 上通过他那些草率的 CGI 卡通片积累了数百万粉丝，但这种成功需要每天发布，且认知水平很少超过\
  \ 13 岁男孩。（在 2021 年非同质化代币（NFT）热潮早期，Beeple 的作品在佳士拍卖以 6900 万美元售出，这既是一个笑话，也是一个完全严肃的人气证明。）担心自己作为创作者即将到来的被淘汰很容易。但消费者同样受到了影响。\n\
  \n\n\n\n在 2022 年的一篇文章中，音乐杂志 `Pitchfork` 的编辑杰米·拉森（Jeremy Larson）抱怨道，在 `Spotify` 上听音乐的算法体验正在阻碍音乐本身。“尽管它拥有想要的所有音乐，但其中没有一首能让我感到有回报感、情感化或个性化，”拉森写道。尽管艺术家的意图可能没有改变，但“音乐变成了流媒体服务的广告，你投入的时间和注意力越多，这家科技公司受益的就越多。”这个平台成为了听众与艺术家及其作品之间关系的过滤器，有时也是障碍。而且并不是每位艺术家都允许流媒体服务播放他们的音乐。像尼尔·杨（Neil\
  \ Young）和乔尼·米切尔（Joni Mitchell）这样的音乐家已经从 `Spotify` 上删除了他们的作品集，以抗议公司的某些决定，包括资助传播政治和文化阴谋论的播客。为艾莉雅（Aaliyah）的音乐集的数字版权花费了多年时间；直到\
  \ 2021 年才在 `Spotify` 上线。音乐人的缺失使得他们更难获取，或许可能让 `Spotify` 订阅者更容易忘记——或者从根本上发现——因为该服务涵盖了用户大部分的收听习惯。即使听众可能喜欢他们，其推荐算法也不会推广艾莉雅、杨或米切尔，因为\
  \ `Spotify` 无法从这些收听中获利。它被动地限制了我们感知音乐的方式。拉森将其描述为“一种制造出来的现实，旨在取代应用软件之外生活的随机轮廓。”\n\n\
  在对我们集体算法消费的极具生动的比喻中，拉森写道，“数百万用户现在以每月一个墨西哥比饼（Chipotle burrito）的价格，并肩坐在这一个巨大录制音乐池的边缘。”这是对这种媒介的一种具有象征意义且是字面意义的贬值；无论这种订阅价格有多低，`Spotify`\
  \ 只有其中的极少部分分给了真正的艺术家。在自助式流媒体服务和无限信息流出现之前，单张黑胶唱片、磁带或 CD 的稀缺性为听众了解一位艺术家的作品提供了动力，因为否则，对音乐的金钱投入可能并不会觉得有所值。算法推送的承诺是，如果音乐变得任何无聊或乏味，你就可以切换到下一首歌。那下一条推荐可能局限于你预定的品味范围，而且你不需要为此多付一分钱。\n\
  \n当我看 `Netflix` 的剧时，我有拉森描述的那种感觉，尤其是当一次连刷多集剧时。诚然，这些剧很好看——好看到我根本无法停下来。但我说不出多少由 `Netflix`\
  \ 制作的令我印象深刻的剧。我个人的流媒体成瘾是美食纪录片。我会看该类别中的任何内容：介绍不同大陆街头美食的旅游节目，或者一部追踪米林星级厨师的传记片，配有大量牛排落在烤架上的\
  \ B-roll 镜头。鉴于这些作品中很少有富有魅力的个人主持人——他们的存在会使得大批量制作剧集变得更加困难——它们在我的记忆中模糊在一起，就像一个长长的屏幕保护程序。这些节目等同于来自旅游目的地的单调\
  \ `Instagram` 帖子——为了空洞的点赞和不加思考的互动的饲料，是内容的无止尽复制。\n\n并不是说这类内容不能具有艺术性；`Netflix` 收购的如《寿司之神》（Jiro\
  \ Dreams of Sushi）等创新作品以及后续剧集《主厨餐桌》（Chef’s Table），之处在于优先关注视觉美感，使用软焦镜头对准食物的特写。它们将\
  \ `Instagram` 照片中的“食物色情”转化为了电视。然而，这种艺术性被束缚在平稳、不干扰和氛围化的需求中——开发出视听等同于完美亚麻床单的效果。这些作品没有引发思考，只有感官愉悦。与艺术电影院或独立视频录像店为了确保每部作品都能独立立足所需的策展不同，这些节目不需要提供有意义的单一体验；它们只需要作为一种麻痹的毒药大量存在即可。\n\
  \n将氛围类美食纪录片的空热量与 20 世纪 90 年代和 20 年代 Food Network 电视频道的兴起进行对比。在流媒体服务上，真正的烹饪节目很少见，因为它们可能会鼓励离开屏幕的活动。剩下的是纯粹的、催眠的娱乐，因为核心目的仅仅是让观众保持活跃。\n\
  \n\n\n\n2007 年，亚马逊推出了 Kindle Direct Publishing，这是一个电子书市场平台，这些电子书在其新的 Kindle 电子阅读器上阅读。随着时间的推移，`KDP`\
  \ 成为自出版作者的枢纽，他们通过在线绕过了代理人、编辑和书店的传统层级；在那里，新书通过与亚马逊商店中衬衫或搅拌机相同的机制被自动推荐给读者。在 `KDP`\
  \ 上成功的内容也与既定文学界的成功之道有所不同。这是一个“作为内容的文学”空间，在这里，主题的针对性和字数量远胜评论家的意见。作者产的书籍越多越好。根据一项估计，`KDP`\
  \ 在 2022 年提供了超过 200 万部电子书。亚马逊不仅仅是在控制电子书；2019 年，其更大的数字商店占据了成人新书在线销售额的四之三，几乎占了所有新书销售额的一半。换句话说，大部分文学被迫通过亚马逊平台才能接触消费者，这迫使书籍呈现特定的形式——即局限于特定类型类别的高产量系列，并以内容滴灌的方式持续发布——就像推文必须以特定的写法才能在\
  \ Twitter 信息流中成功一样。\n\n斯坦福大学教授马克·麦格尔（Mark McGurl）研究了现代主义文学在整个二十世纪的演变，包括追踪小说 MFA\
  \ 项目的发展如何影响了中世纪小说。小说家转变为教授，为了支持自己的写作实践而工作，在 `Iowa Writers’ Workshop` 等机构指导学生，通常促使他们从个人角度追求自我意识的文学现实主义风格。温德·贝瑞（Wendell\
  \ Berry）、理查德·福特（Richard Ford）、迈克尔·查邦（Michael Chabon）、里克·穆迪（Rick Moody）和塔玛·雅诺维茨（Tama\
  \ Janowitz）是 MFA 模式的一些成功案例。今天，MFA 项目仍然充当门人的角色，帮助出版商识别新人才并引导小说家进入专业行业。此类项目的精选性质，以及出版业封闭的、握手性质，维持了推广单一或具有挑战性的艺术家的能力——这是一种品味塑造——尽管它们本质上带有某种精英主义。\n\
  \n麦格尔识别出了 MFA 风格即将到来的同质化。但算法门人可能会抢先一步。年轻作家往往在进入 MFA 程序之前，就在 Twitter、Instagram 或\
  \ TikTok 上找到培养在线存在感的方法。他们让自己的声音承受社交媒体扁平化的力量。这些预先准备的人设甚至在竞争激烈的研究生申请中有所帮助。在过程的每一步，一个文学想法都会受到其在注意力市场中吸引在线参与的能力的测试。\n\
  \n麦格尔现在认为我们正在进入一个亚马逊文学时代，在这个时代，公司既是审美仲裁者也是商业仲裁者。麦格尔在他 2021 年的书《一切与更少：亚马逊时代的小说》（*Everything\
  \ and Less: The Novel in the Age of Amazon.*）中写道，“它将自己作为文学生活的新平台”。平台对质量的衡量是数量，与其他算法推送相同的无情参与度指标。更多的购买和更多的阅读页意味着一本书优于同类书籍。书籍封面不仅必须设计得在小屏幕上易读，写作也必须针对所谓的“翻页”进行优化——也就是说，用每一行文字不断抓住读者的注意力。（当然，这是优秀写作通常具有的品质，但并不如此。）\n\
  \n一方面，这是一种民主化：任何人都可以出版书籍，并有机会通过完全相同的通道、以相同的方式进行销售。没有书店采购员或前台陈列的障碍；只有算法的数学计算。超级畅销作家科尔琳·胡弗（Colleen\
  \ Hoover）提供了机会的例子。胡弗最初在亚马逊上自出版她的小说，这些小说通常属于言情、惊悚和青少年类别。她前两部作品的成功促使主流出版社 `Atria Books`\
  \ 在 2012 年重新出版了它们，她的小说也开始持续登榜畅销书。（尽管有其他邀约，胡弗在她的第三部小说上仍坚持了自出版。）在疫情期间，胡弗将她的旧书电子书设免费——这是另一种提升数字参与度的策略——并在\
  \ TikTok 上引发了粉丝热潮，在那里，新兴的书籍社区对她写作的影响写下了泪水的见证。据估计，她二十多部书籍的销量超过 2000 万册，正如《纽约时报》报道的，“比詹姆斯·帕特森（James\
  \ Patterson）和约翰·格里姆（John Grisham）总和还要多。”飞轮效应在胡弗控制之外甚至加速了：“我读别人的书，我非常羡慕。我在想，天哪，这些书好得多，为什么我的书卖得是这样？”她在\
  \ 2022 年告诉《时报》如是。\n\n另一方面，对大众参与的要求背离了文学历史，在历史中，编辑和学者的意见比一本书最初卖出多少份要重要得多。麦格尔写道，文学经典是“亚马逊与其完全没有特殊关系，除了作为学生倾向于购买的书单之外。”他写道，通过平台的过滤，“所有虚构类小说都是类型小说，”无论是一部花费了十年时间才写成的实验性小说，还是无止境色情小说电子书系列中的第五卷。麦格尔识别出某些在亚马逊\
  \ `KDP` 市场中找到成功家园的特定类型。言情小说表现良好，包括小众子类型，如“阿尔法亿富翁言情”，其中《五十五十的灰》（*Fifty Shades of\
  \ Grey*）是最著名的例子，以及“三人行 MMF 军题材”（类型名称本身类似于搜索引擎优化语言，这并非巧合）。史诗是另一个热门，包括宏大的奇幻系列。\n\n\
  在最易观察的范围内，亚马逊文学现象局限于一个较小的空间：数字商店和 `Kindle` 阅读器。两者都被边缘化到特定的情况下，并可能特别适合阅读“罪恶感”之类的活动——在\
  \ `Kindle` 上，没有人能看到你正在读的书。很容易避开算法的影响，去实体书店，在那里店员可能会提供个人化建议。然而，麦格尔也将亚马逊影响读者的消费习惯与高雅文学类型的兴起联系起来，例如\
  \ 2010 年代的自传体——这些出版业阶层并不被认为是如此算法化或市场驱动的。\n\n\n\n根据 McGurl 的分析，卡尔·奥维·克纳斯高尔（Karl Ove\
  \ Knausgaard）和瑞切尔·库斯（Rachel Cusk）的自传体小说都是系列形式的，为读者提供了大量内容，并呈现出对成功作家生活的代入式的、几乎近乎消费主义的视角。有时，这些书会演变成一种愿望实现的形式，至少对于他们的文化精英目标受众是如此。人们买书就像在购买那种遥远居住地和作者座谈会的生活方式，阅读它们就像在看真人秀节目。扎迪·史密斯（Zadie\
  \ Smith）曾在评价《我的挣扎》（My Struggle）时写道：“我像毒瘾一样需要下一卷”，这就像你对《真人秀》（Real Housewives）的一季说的话一样。我认为库斯和克纳斯高尔是\
  \ 21 世纪最有趣的小说家之一，但我可能无意中忽略了这种看似先锋的文学风格在多大程度上掩盖了书中书中平庸且主流的内容。在最近的重读中，我想起库斯的《轮廓》（Outline）三部曲中的第二部《中转》（Transit），很大程度上是由关于沙龙理发和家居装修的轶事组成的。她是在彻底颠覆我与叙事的关系，还是我只是希望自己在伦敦理想街区有一套公寓可以翻新？\n\
  \n这里的重点并不是说克纳斯高尔在描写他在挪威乡村的青少年时代时关注 Instagram 的点赞。而是算法塑造了整个文化格局，调控了我们的品味。一切都存在于被动、无摩擦消费的算法语境之中。无论一本书或其他内容似乎存在于算法生态之外；它仍然受到算法推送所催生的主导审美和趋势的影响。算法文化的终点是持续不断的、相似而又异的内容流，其多样性足以让人不至于完全无聊，但又从未多样到足以让人产生疏离感。追求宏大的艺术理想可能已经褪色，转而追求以点赞和互动为首要目标的精细化。\n\
  \n21 世纪初的许多流行文化形式似乎被简化为麻醉性的情绪增强，或者是留给观众解决后进入下一个的简单谜题。这甚至延伸到了我们最大的制作作品。像 2019 年的《复仇者联盟：终局之战》这样的电影，本应为多年的漫威超级英雄电影画上句号，就像最初《星球大战》的结局曾占据公众想象力一样。在长达三小时的片时间内（远超通常的大片），《终局之战》优先考虑的是特效和粉丝冷知识的满足——你可以看到你喜欢的超级英雄全部回来最后一次与反派战斗——而不是满意的叙事。漫威的忠实粉丝可能很高兴——“**粉丝福利**”（fanservice）是形容那些公开迎合硬核粉丝需求的内容的术语——但从情感影响或创意表达的角度来看，最终结果几乎毫无意义。\n\
  \n算法推送并没有鼓励原创的艺术成就，而是创造了对为了产生更多内容而存在的内容的需求：电影提供现成的、供在 Twitter 或 TikTok 上分享的高潮场景\
  \ GIF，以及能激发迷因并作为营销的幽趣台词。对互动的需求可能会鼓励向粉丝福利妥协，或者至少是尝试这样做。\n\n由于原版《权力的游戏》电视剧在 2019 年完结时也陷入了同样的问题。两万人看了大结局——这是史上收视率最高的剧集之一。然而，它却让许多观众感到冷淡。在经历了许多季精心塑造的角色弧光后，最后几集似乎将既定角色抛到了窗外。剧集人大卫·贝尼夫（David\
  \ Benioff）和 D.B. 魏斯（D.B. Weiss）必须完成这部剧，但结果是一场缺乏早期季节深度的盛宴。\n\n萨莉·罗尼（Sally Rooney）的三部小说目前被认为千一代小说的巅峰，是一部戏剧化成长的爱情三部曲。在《与朋友聊天》（Conversations\
  \ with Friends）中，是多角恋和自残。在《正常人》（Normal People）中，是受虐性性。在《美丽的世界，你在哪里？》（Beautiful World,\
  \ Where Are You）中，是经济阶级差异和文学名声，向自传体小说转型。\n\n\n\n\n一部流媒体电视剧体现了算法平台时代文化的平庸化。它于 2020\
  \ 年 10 月在 Netflix 上线，当时全球正值疫情期间，大多数人被困在家里，除了看电视别无他选。尽管如此，这部剧如此迅速地主导了话题（至少在网上，即所有非本土讨论都发生的地方），仍令人惊讶。《艾米在巴黎》（Emily\
  \ in Paris）是达伦·斯坦（Darren Star）的作品，他因《欲望都市纽约》系列而闻名的导演兼制片人，该剧对世纪 90 年代后期曼哈顿的生活进行了偶尔华丽又写实的描绘。《艾米在巴黎》原本是为电线电视设计的，但最终落在了流媒体平台上，第一季的所有内容立即供追集观看。\n\
  \n这是一部既关于社交媒体又属于社交媒体的剧，剧主角`艾米·库珀`（Emily Cooper）——由莉莉·柯林斯演绎得极度甜腻——是一个二十岁出头的芝加哥女性。由于她在一家营销公司工作、留着长马尾以及穿着运动休闲服在城市里跑步的习惯，她可能会被称为“土气（basic）”。艾米来到巴黎将她的美国专业知识带给`Savoir`，这是一家专门从事奢侈时尚品牌营销的虚构机构。具体来说，艾米的工作是培训员工如何创作互联网内容。像一个满怀好意的传教士，她打破了法国传统的相对平静——长长的午餐、纸质杂志广告、时装秀——并试图将当地人转化为\
  \ Instagram 帖的粉丝。\n\n在斯坦的《欲望都市》中，`凯莉·布拉德肖`（Carrie Bradshaw）是一位报纸专栏作家，描写关于她的约会经历、购物习惯和深厚友谊的文章——这些文章仅在她坐在笔记本电脑前时，在那些感性的草稿行间间若有若现。布拉德肖作为作家的身份让她成为文化中富有产出的部分：她正在构建一种特定的个人生活与爱情哲学。相比之下，艾米仅仅是一个职业消费者。她版本中的“凯莉式写作”是用手机拍照，而手机在剧中无无处不在。\n\
  \n在第一集中，她拿出手机，对着她的`女佣房`（chambre de bonne）窗外的景色拍了一张自拍。随后，一个手机屏幕的象征性影像在摄像头的真实画面框内弹出。艾米将照片发布到一个未名的\
  \ Instagram 类平台（以避免版权侵权），她在该通用平台上的粉丝数量出现在屏幕上。她将用户名从`@emilycooper`改为`@emilyinparis`。在同一集的稍后时间，她又拍了一张巴黎自拍——她的粉丝数翻了四倍，然后在她发布这张图片时再次跳升。她对这个数字表现出困惑而满意的表情。在第二集中，当她发布市场市场的快照时，她的粉丝数量增加了十倍。她图片上的点赞和评论数像老虎机上的轮子一样向上飙升：她中了社交媒体的头彩，让陌生人变成了她个人生活的亲密粉丝。\n\
  \n这种视觉噱头贯穿全剧，艾米拍了更多的自拍，记录派对并展示服装。没有新东西被创造出来，也没有见解被传达；帖子只是在角色经历她积累粉丝的成长小说（bildungsroman）过程中不断增加。不像，比如，艺术摄影师在按下快门前会苦苦地构构图，对于艾米来说，为\
  \ Instagram 拍照的行为似乎是瞬时且不加思虑的。她只是凭本能行动，早已被对社交媒体的消费所条件化，将她的生活实时转化为优化的内容。\n\n当我第一次看这部剧时，它将社交媒体视觉化和价值化的方式在我看来是反乌托邦的，尽管它是完全现实的。我们在线身份的幽灵笼罩着每一个时刻，导致我们不断判断生活中的哪些场景值得向我们的个人观众播放，将它们投放到信息流中。更糟糕的是，《艾米在巴黎》将生活转化为内容美化了，将其视为主角性格成长的证据。艾米在`Savoir`取得成功是因为她太精通社交媒体了；她的专业劳动（为时尚品牌创作内容）与她通过同种媒介构建的自我感之间没有界限。她是一个单人的商业品牌，并为此感到快乐。\n\
  \n在这部剧平滑处理的表面下，隐藏着一系列假设。艾米固有的特权未被提及，仿佛这仅仅是生活的常态。她是白人，极其苗条，符合大众审美，且总是化着浓妆。脱离语境来看，她正如建筑师`库哈斯`（Rem\
  \ Koolhaas）所写的，“一种常的幻觉”。艾米每天穿着精致昂贵的服装——更多是为了拍照而不是为了走路——而剧没有暗示这些衣服或购买衣服的钱是从何处而来。（这使得艾米像一个任性的小贵族，可以随心所欲，而结果就是发布动态。）剧中的其他角色也是白人，从艾米的主要情感对象到她的老板以及大多数同事。这对一个国际城市的描写非常糟糕。但在这里，真实的巴黎主要作为艾米自拍的背景。\n\
  \n在第一季中，艾米成为了一个影响者（influencer）——这个术语指的是并非因为任何伟大的成就而闻名，而是因为粉丝数量和激发点赞的能力。这个角色最终获得了推广`Savoir`客户的交易，这种胜利被呈现为值得庆祝，就像过去乐队与唱片公司签约或作家获得出版合同一样。营销取代了创作，正如顺应算法流量取代了创造性的自我表达一样——两者对原创性都不特别感兴趣。《艾米在巴黎》意识到生活如何被社交媒体信息流所接管，以及任何文化作品——时尚线、零售店、公共艺术装置——如何激发内容创作。该剧记录了我们平庸化的文化而不对其进行批判；相反，它加速了这种平庸化。到第三季，每个主要情节似乎都以一条\
  \ Instagram 帖子结束，几集还包含了真实品牌的广告植入，包括`麦当劳`、`捷驰`和`AMI Paris`：剧中的虚构营销变成了真实的营销。\n\n该剧庆祝影响者具有某种意义；2022\
  \ 年美国的一项调查显示，在 13 至 38 岁的受访者中，54%如果有机会会成为影响者。2019 年对三千儿童的另一项调查显示，30%的他们选择成为`YouTuber`（另一种影响者），而不是职业运动员、音乐家和航天员等职业。在\
  \ 2010 年代，影响者的形象既被发明又发生了变异，可能成为文化版图中单一主的主角。毕竟，如果现在的大部分文化发生在社交媒体上，还有什么比控制注意力流并引导观众以特定方式行动更有强大的角色呢？\n\
  \n\n\n\n\n这个词本身的肤浅性已经说明了一切：“影响”（influence）从来不是终点，只是传达特定信息的手段。定义一个网红（influencer）简单的方法是看他们是如何赚钱的。就像制作杂志或播客的媒体公司一样，他们向自己聚集的受众出售广告。但起初吸引观众的内容通常是网红的个人生活、他们极具审美吸引力的环境（以及具有审美吸引力的自我）以及趣味性活动。他们生活的素材——以不同程度的自然或刻意呈现——在\
  \ `Instagram` 这样的社交媒体平台上被详尽地记录，他们那里还会为品牌发布赞助帖子。另一个区别在于，不像在街上派发的免费报纸或发送信号的电台，网红并不拥有他们所属媒介的基础设施。他们利用数字平台分发内容的能力，无论是通过广泛安装的智能手机应用程序还是应用内的信息流。\n\
  \n对一个人的迷恋，尤其是对其外貌或私生活的迷恋，为自我推广铺平道路早在互联网时代之前就开始了。从历史上看，这种现象最出现在皇室或城市知识分子的圈子里，地理位置接近的成员对彼此的日常观察程度，与我们今天在\
  \ `Instagram` 上发布的频率不相上下。尼农·德·朗克鲁（Ninon de L’Enclos）于 1620 出生于巴黎的一个富家庭；在父亲被流放、母亲去世后，她不得不独自生活，并决定终身不婚。她成为一名拥有一系列贵族情人的交际花，以及作家和反宗教哲学家。在一个特别戏剧性的插剧中，她与一位乡村的长期情人分手并回到巴黎。她的前男友维拉罗索克斯侯爵（Marquis\
  \ de Villarceaux）迅速搬进街对面的房子来监视她，留意每一个新访客。为了安抚他，她剪下了一段头发作为离别礼物送给他。此举奏效了，但也引发了一场模仿波波头的狂热，正如贝西·普里约奥（Betsy\
  \ Prioleau）在著作《诱惑者》（`Seductress`）中所述，被称为“尼农波”。这是一个完美网红发的时尚迷梗。\n\n后来，在 1882 年，英国名媛兼演员莉莉·兰格里（Lillie\
  \ Langtry）成为第一个代言产品的名人，她成为了彼尔皂（Pears Soaps）的脸，她的肖像被复制在广告上。兰格里以白皙的肤色而闻名，这可能是遗传结果，而非肥皂的作用，但她的个人形象为广告赋予了权威性。事实上，兰格里是通过其形象的复制而闻名的，首先是著名英国画家的作品，然后是印在明信片上的速写。当复制品是如此稀缺时，复制这一事实本身代表了认可——图像的泛滥等同于一次“点赞”。\n\
  \n消费者总是关心那些因其他事情而闻名的名人的生活方式选择：演员的饮食计划、大亨的赛马、画家的私情。名声——也可以被定义为注意力——会投射出它自己的光环，让几乎任何事物都变得有趣。在\
  \ 20 世纪 60 年代，安迪·沃霍尔（Andy Warhol）通过他的“超级明星”群体将名气的平庸推向了极致。对于沃霍尔在 20 世纪 60 年代初的“屏幕测试”（`Screen\
  \ Test`）系列，一群在圈子外不为人知的反文化人物在摄像机前长时间摆姿，镜头仅仅是观察他们的脸，就像一场不存在的电影的试镜（今天，这让我们联想起自拍的排练，或者在录制\
  \ `TikTok` 前置视频之前的瞬间）。这些视频证明了，我们只需要注视某人就能感觉到他们很重要——摄像镜头的构图和投影仪施加了魔咒。\n\n电脑或手机屏幕完成了同样的壮举：`TikTok`\
  \ 信息流中的任何人看起来都和其他人一样有名，这是另一种形式的扁平化。沃霍尔曾说：“未来，每个人都会成名 15 分钟。”在 1991 年，音乐家兼在线博客领域的先驱莫缪斯（Momus）富有先见地将这一预测更新为：“未来，每个人都将为\
  \ 15 个人成名。”在社交媒体上，这已成为事实。每一位用户对他们的追随者来说都是著名的。\n\n网红在某种程度上是博主的继承者，后者是 2000 年代新兴主流互联网的明星。博主同样利用数字工具通过连续的文本报道自发并戏剧化他们的个人生活——从如\
  \ 002 年左右开始的“妈妈博客”浪潮是其中最典型的。博主也卖广告，形式为赞助帖子和出现在网站边缘的横幅广告。根据记录搜索词流行度的 `Google` 趋势追踪器，“博主”（blogger）自\
  \ 2011 年以来缓慢下滑，而“网红”（influencer）在 2016 年初左右强劲出现。那时 `Instagram` 的用户突破了五亿，社交网络信息流也普遍开始变得更加算法化。`Instagram`\
  \ 为网红提供了一个完美的场所：不需要长篇大论或对自我的情感披露。仅凭精美的图片就足以吸引粉丝，随后就可以进行变现。如果说 `blogger` 一词描述的是写作的字面活动，那么“影响”（influencing）则更接近所发生事情的财务方面。这是一份销售工作，说服观众购买某些东西，首先是一种向往的生活方式愿景，然后是这种愿景的产品。\n\
  \n帕特里克·詹内尔（Patrick Janelle）某于是 `Netflix` 中艾米莉·库珀（Emily Cooper）的现实版，尽管他作为网红的职业开始比她的早得多。在\
  \ 2010 年代初后期，他将生活转化为内容，并逐渐以此建立了职业，然后是业务。虽然这现在不再是他的主要重心，但他今天的 `Instagram` 账号仍有超过四十万粉丝和十年来使用产的六千张照片，使用的是平易近人的账号名\
  \ `@aguynatrick`。他的帖子看起来像 `GQ` 等男士杂志的摄影作品：华丽的酒店房间、采亮的咖啡馆、他曼哈顿公寓装饰着艺术品的墙壁，主角都是粗犷帅气的詹内尔。照片清晰、流畅且具有几何构图，全部由詹内尔本人用\
  \ `iPhone` 拍摄的，有时会借助远程触发器。然而，他的生活并不总是如此精心打扮，特别是他在 2012 年进入 `Instagram` 的时候。\n\n\
  我多年前在 The Dutch 第一次见到詹内尔，那是他推荐的一家位于他公寓附近的 SoHo 街角的餐厅。那里配备了所需的球形吊灯和开放式架架。这家餐厅对詹内尔来说，像是一个总部，他甚至在自己的网站上展示过它。2011\
  \ 年，他刚满三十岁，搬到纽约，并在美食杂志 `Bon Appétit` 担任兼职设计师。`Instagram` 成为他与朋友分享生活的方式，包括他出国旅行期间，以及在他长大的科罗拉多州期间。“这种媒介是为记录你的生活而生的，”他告诉我。他拥有专业模特那种冷静的自信。在从事杂志工作之前经常去曼哈顿的咖啡馆，詹内尔开始了\
  \ `Instagram` 标签 `#dailycortado`，指的是当时咖啡爱好者喜爱的短缩咖啡。每天，他都会为那杯带有拉花的咖啡拍照，咖啡被放在大理石或木质桌子上——这些手工制作的表面恰好与光滑的瓷咖啡杯形成良好对比——并发布在\
  \ `Instagram` 上。这些材料是昂贵和品质的象征；它们的自然感和质感与手机屏幕光滑的扁平形成了引人注目的对比，尽管这些照片本身也是数字饲料。\n\n\n\
  \n\n\nJanelle 是 Instagram 上这种审美的先驱之一，他帮助这种审美被坚定地植入品味大众咖啡馆设计的标志。他还推广了该标签供他人使用，就像任何优秀的梗图一样邀请人们参与。十年后，`#dailycortado`\
  \ 依然活跃，并成为该平台基石的一部分。现在，它被包含在用户堆砌在文案中的标签列表中，以便让更多人发现他们的账号，以此引导算法将照片推荐给咖啡爱好者。\n\n\
  如果我们回看这些照片，它们具有一种矛盾论的特质。Janelle 捕捉的是一个慢下来并关注的时刻：当你放下咖啡杯，坐下，在用之前欣赏它一秒钟。这是繁华城市生活中一个宁静的时刻；当街道上的其他人飞驰而过时，你保持着。然而，每一条\
  \ Instagram 帖子都在喂养“信息流”这头巨兽，它以最快的速度向眼睛传递尽可能的内容——这与慢下来背道而驰。相反，照片是加速的矢量，既是为了内容消费，也是为了\
  \ Janelle 在线足迹的扩张，而这正是作为网红为他赚钱的观众。Janelle 可以慢下来，但仅是为了拍摄一张构图完美的照片，而他的观众或许可以在信息流将他们的注意力带向更多刺激之前，代入式地慢下片。\n\
  \n“起初只是咖啡，以及我看到的那些视觉上令人愉的图像；这关乎身处城市，”Janelle 在谈及早期使用 Instagram 时说道。他的帖子源自街头摄影的词汇：逃生梯、建筑立面、穿梭的人群。但随着时间的推移，以及\
  \ Instagram 和网红的兴起，他那些向往城市生活的照片变成了实现同样生活方式的一种。奢侈的图像带他进入了奢侈的情境。“生活方式产生了生活方式，”他告诉我，“随着我继续发布，我作为活动参与者的身份变得更受欢迎，获得了更多机会，并在财务上建立了一个品牌。”他在自拍中展示的个人时尚感，促成了与拉夫·洛伦的推广交易。他发布的一次度假导致了免费酒店房间的邀约。\n\
  \n影响力成了一项职业，尽管 Janelle 不喜欢“品味引领者”这样的词。“我不认为我在创造它、制造品味，但我正在挑选我认为新颖且兴奋的事物，并记录它们，”他说。2014\
  \ 年，美国时尚设计师协会授予了 Janelle 其首位“年度 Instagram 用户”。我在 22015 年的一天在 Instagram 的发现页面上发现了\
  \ Janelle，该页面收集了算法推荐的点赞帖子或待关注账号。我猜，由于我关注了足够多的纽约餐厅和室内设计灵感账号（充满了市中心阁楼公寓和中世纪家具），Janelle\
  \ 的账号恰恰完美契合了我认知的品味，至少根据算法来说是这样。\n\n当时我作为一名布鲁克林居民正步入二十多后期，寻找对成年生活应该是什么样的定义——本质上，即如何以及在哪里花掉我那点闲钱。Janelle\
  \ 那些严谨且精心策划的照片提供了这种暗示，尽管他作为一个专注于奢侈的社交达人不断变化的人设比他的街景快照更缺乏共鸣。Instagram 还为这类生活方式内容增添了一层真实的外壳，这是媒体公司制作的纸质杂志无法为我提供的——尽管他的帖子在另一种意义上具有企业化色彩，因为它们通过\
  \ Instagram 这家科技公司经过了过滤。“我理解它的运作方式，”Janelle 说，“我是系统的一部分。”\n\n### 人设的演变\n\nJanelle\
  \ 那些严谨且精心策划的照片提供了这种暗示，尽管他作为一个专注于奢侈的社交达人不断变化的人设比他的街景快照更缺乏共鸣。Instagram 还为这类生活方式内容增添了一层真实的外壳，这是媒体公司制作的纸质杂志无法为我提供的——尽管他的帖子在另一种意义上具有企业化色彩，因为它们通过\
  \ Instagram 这家科技公司经过了过滤。“我理解它的运作方式，”Janelle 说，“我是系统的一部分。”\n\n### 算法的转变\n\n平台从时间流到算法流的转变标志着一个重要的转折点。最初，创作者可以发布并知道他们的内容会实时送达粉丝者。现在，算法根据预测的互动来决定用户看到的内容。这种变化改变了像\
  \ Janelle 这样的网红的环境，他们现在必须驾驭算法来维持可见度。\n\n\n\n\nJanelle 对 Instagram 感到厌倦，但不想切换到 TikTok\
  \ 等更新的替代品——在当今的网红经济中生存，往往需要玩这种“跳房子”的游戏的游戏。他知道 TikTok 可能提供更好的商业机会，但也会消耗他太多的创作精力。（尽管如此，最新信息流的引力可能是不可抵拒的：在我们交谈几个月后，他开始尝试性地发布\
  \ TikTok 视频，并在那里也积累了粉丝。）不断需要寻找下一个大型社交媒体平台的需求，让人联想起 20 世纪初尝试转型有声片的无声电影明星，或者转型电视电视的剧院演员：并不是每个人都能成功，也不是每个人的艺术方法在新的媒介中行得通。\n\
  \n现在这种转型的需求每隔几年（如果不是每年）就会发生一次，而不是几十年一次，并且需要对技术噱头有更敏锐的感知力。你必须知道何时避开那些彻底的失败品，例如寿命很短的移动视频流媒体服务\
  \ `Quibi`（“快速零食”的缩写），它尽管内容预算高，但吸引的用户寥寥，并在不到一年后就关闭了。大部分炒作并不会付诸实施，网红在失败平台上投入的任何努力都会化为乌有。\n\
  \nJanelle 是一个精明的创业者。在“滤镜世界”（Filterworld）中，潮流变化迅速，因此他并没有不断调整自己的内容来适应各种平台青睐的格式，而是建立了一家名为\
  \ `Untitled Secret` 的公司，代表其他十多名网红，并在不断增长的员工帮助下与企业客户协调营销交易。他影响网红们。\n\n虽然 Janelle\
  \ 所推崇的 2010 年代整体工业风氛围仍然非常流行，但尖端品味已经转向了更混乱、更无序甚至是激进性伪造的风格。网红们现在经常拥有数百万粉丝，在这个规模下，个人之间的联系几乎是不可能的，复制了传统名人的疏离感。卡达珊家族式的真人秀开启了一类新型网红，他们在小屏幕和手机上更更小的屏幕之间顺畅地切换：你可以在电视上看\
  \ `Kim`，然后在 `Instagram` 上关注她，她在那里现在有 3.49 亿粉丝，这相当于一个分散的粉丝国家的人口。与 Janelle 的情况不同，Instagram\
  \ 并不是卡达珊家族声名的源头，而只是其声名的另一个容器。现有的名是启动算法推广的最佳方式，而这会进一步增强声名。\n\n虽然社交媒体早期的承诺是将用户与真实朋友联系起来，但随着时间的推移，不真实性变成了一种被接受的东西。2016\
  \ 年，名为 `Brud` 的科技公司的联合创始人 Trevor McFedries 和 Sara DeCou 创建了一个名为 `@lilmiqueta`（小米奎拉）的\
  \ Instagram 账号。该账号的简介描述了一个十九岁的巴西美国人，其图片是标准的 Instagram 内容：随意的自拍、与朋友的合照，以及在城市墙前的摆拍像。Miquela\
  \ 的审美是典型的网红风格，是她之前成功账号的平均水平。她本身也很平庸：不是人类，而是计算机渲染图。\n\n她的皮肤像蜡一样且不似人类地光滑，从内部散发出光芒。她的眼睛异奇地空洞。尽管如此，她出现在真人身边，穿着真实的衣服，出现在真实的地方。该账号的核心是一个虚拟三维模型，一个近乎照片写实的数字娃娃，可以摆出任何可以想象的姿态。这种光泽的图像比大多数时尚大片稍假一点，但被证明是成功的：她作为第一位著名的“虚拟网红”登上头条新闻，并签约了经纪公司\
  \ `WME`（或者至少是她的创作者签约了）。\n\n她的不存在这一事实让她具有可销售价值，因为 `Miquela` 目前拥有三百万粉丝，像 `Calvin Klein`\
  \ 和 `Prada` 这样的时尚品牌已经与她签约。\n\n\n\n\n这种通过在社交媒体上获得成功来提前聚集受众的需求，可以用“内容资本”（content capital）这一有用术语来解释。这一概念由学者\
  \ Kate Eichhorn 在她 2022 年的专著 `Content,` 中提出，它描述了互联网时代的这种状态：“一个人作为艺术家或作家从事工作的能力，日益取决于其内容资本；也就是说，取决于其产生并非关于其工作本身、而是关于其作为艺术家、作家或表演者身份的内容的能力。”换句话说，重点不在于事物本身，而在于环绕着它的光环，以及人们因为过着创作者的生活方式而产生的辅助材料。这些辅助内容可能是\
  \ Instagram 上的自拍、绘画画室的照片、旅行的证明、在 Twitter 上随口写出的观察，或者是 TikTok 上的独白。这一切都为这个人建立了受众，而这个人仍然与他们创作的作品是相互分离的实体。如果说罗兰·巴特（Roland\
  \ Barthes）1967 年的论文预言了“作者之死”，那么现在作者的个人品牌就是唯一重要的；作品本身已经“死了”。\n\nEichhorn 回应了社会学家皮埃·布尔迪厄（Pierre\
  \ Bourdieu）在 2 世纪 70 年代提出的“文化资本”概念：对高文化形式的熟练运用，这种形式可以赋予社会地位并帮助精英阶层成员相互识别。文化资本是知道羊绒比棉花更具向往的面料，或者知道一张杰逊·波洛克（Jackson\
  \ Pollock）的画远非孩子可以复制的滴水杂乱。（布尔迪厄指出，在西方，对激进的美学实验和抽象的开放态度是精英阶级的标志。）这不仅是对艺术的理解；更是对艺术在社会背景下的意义的理解，以及不同作品或艺术家象征着什么的理解。那么，内容资本是对数字内容的熟练：知道生产什么类型的内容、各种平台的信息流是如何运作的、它们优先考虑什么，以及观众会对给定的创作做出什么反应。拥有更多内容资本的人获得更多粉丝，从而在“过滤世界”（Filterworld）的文化生态系统中拥有更大的权力。\n\
  \n这条规则是网络生活中一个平庸的事实，无处不在，以至于很容易忘记它的存在：更多的粉丝和更多的互动总是被设定为更好。（一个人不再被认为仅仅满足于几百个粉丝，尽管这可能是你在物理世界中认识的人的极限。）首要激励是让数字涨起来。Eichhorn\
  \ 写道：“人们只需通过在网上闲逛，更准确地说，通过发布能引起反响的内容并带来更多粉丝和更多内容，就能建立自己的内容资本。”这种内容资本可以被使用或转化为其他形式的资本：通过出售赞助或直接向粉丝出售产品来赚钱，无论是印有网红账号的\
  \ T 恤，还是某本印有作者名字的精装书。这两者作为特定个人粉丝的物理符号（也称为周边商品/swag）并没有太大区别。\n\n这个方程式适用于任何文化产出或领域：粉丝越多，你赚的钱就越多。社交媒体将文化量化为一套平庸的指标，衡量观看量、点击率以及最终的购买率。净效应是同质化，因为创作者们都在追求同样的激励措施以吸引更多注意力，复制在当下最有效的公式。Eichhorn\
  \ 写道：“随着时间的推移，媒介（如电影、视频、音频录制、印刷书籍）之间以及类型（如非虚构与虚构或电视戏剧与情景剧）之间的区别似乎变得不再重要。”她描述了那场无止的竞赛：“越来越重要的仅仅是一个人正在创作内容，并且以越来越高的频率和数量进行创作。”在书的其他地方，Eichhorn\
  \ 的表述更简单也更残酷：“内容产生内容。”\n\n这并不是说内容产生艺术。事实上，算法信息流所要求的过剩内容往往会阻碍艺术，因为它们占据了创作者日益增加的时间比例。“Eichhorn\
  \ 写道：“过去可能专注于写书、制作电影或创作艺术的文化生产者，现在现在还要花费大量时间制作（或付钱让他人制作）关于他们和他们工作的内容。”正如任何尝试过在网上启动某项活动——烘焙义卖、派对、艺术装置的人所知道的，辅助内容很快就会变成一种分心。作者（我）太忙于在\
  \ Instagram 上拍摄他那刻意凌乱的办公桌，直播他的作家身份，并检查随后的点赞，以至于没有时间真正写他的书。\n\n我们都必须担心在线上的内容资本，即使我们只是和朋友交流。某些餐厅餐点或假期目的地比其他具有更多内容资本，从而产生更好的\
  \ Instagram 帖子，就像某些生活里程碑会在 Facebook 信息流中引起更大的反响一样。人们可能会利用生日或婚礼获得一些额外的推广。但这种曝光并不总是个人层面的肯定。\n\
  \n在 TikTok 上，即使视频可能显示一个人叙述个人创伤或展示新的艺术创作，评论区也充满了关于疯狂的问题，询问创作者穿着什么牌子的衣服或家里用的是什么家具，仿佛这些建议将是他们最有说服力的文化贡献一样。我记得\
  \ TikTok 上一个女性面对着 iPhone 摄像头讨论一次工作中的骚扰事件。评论者纠缠她问她的挂脖衫是从哪里来的；品牌是 `Zara`，但这绝不是视频的重点。即使是个人脆弱情感的表达也被降低到了视觉内容的水平。我观察到一位关注食物的创作者，她在平静的烹饪过程视频（切菜、炒蔬菜做成汤）之上，开始讨论她遭受种族主义的经历。视觉氛围被用来掩盖个人内容，也许使其更有可能接触算法信息流中分心的观众。\n\
  \n建立内容资本是一种分心，尽管为了触达消费者来说是必要的。在“过滤世界”中，不以被消费为目标而创作艺术几乎是不可想象的。这与卡尔门·赫雷拉（Carmen Herrera）这样的画家的做法相反，她在九十岁时才获得成名，并在\
  \ 2022 年去世，在世纪的大部分时间里都在极简主义画布上默默创作。今天，往往感觉没有注意力就没有创造力，而没有算法推荐的催化就没有注意力。\n\n\n\n\n\
  \n我很早以前就决定，不再完全让自己的声音去迎合算法推送——或者与其说不是没决定，不如说是感到无力做到这一点。我不够够酷、不够幽默、不够有吸引力，也不够马基雅维主义，无法确切知道该操纵哪些变量。我的推文很少火过，我显然也没有足够的生活方式素材来填满\
  \ Instagram 动态。我永远无法成为那样的影响者。然而，多年来，我意识到，尽管我不是一个拥有数十万粉丝的 Instagram 明星，但我对那些关注我发布内容的群体来说具有影响力，而最终，他们的注意力确实影响了我所发布的内容。\n\
  \n我发现，我可以通过某些方式来展示我所做的事情，以最大化我可能的内容资本。我苦苦推敲推文来分享我的最新文章，试图弄清楚什么会获得最多的分享：也许是一个留下悬念的奇差标题，亦或是突出故事中最具戏剧性的引言。我迎合我的在线受众，切中那些人们因我而闻名的话题：小众设计评论、对硅谷文化的抱怨、艺术史的引用。个人生活的证据，比如对我工作的咖啡馆的抱怨，总是反响很好。问题在于，我开始将算法奖励的话题与我的个人品味混淆了——我写的是\
  \ Twitter 想看的东西，这开始遮蔽了我对“自己会写什么或对什么感兴趣”的认知。\n\n帖子发布后即时性的点赞浪潮有助于推荐算法评估哪些内容应该被推广，但它为创作者提供了一个前所未有的实时衡量标准，来判断什么能引起观众的共鸣，仿佛每一个念头都通过手机上可见的尼尔森收视率来衡量。文化扁化是结果之一。但同样的机制也是我们的公共政治话语变得越来越极端，因为冲突和争议能够点亮动态并吸引点赞，而微妙和模糊性是永远无法做到的。\n\
  \n## Instagram 诗歌 (INSTA-POETRY)\n\n数字平台和算法推送奖励的文化类型，与传统人类品味者模式下成功的类型在形式和内容上都显著不同。诗歌是算法改变艺术形式及其公众接收的最的最直白的例子之一。在过去的十年里，一代“Instagram\
  \ 诗人”在 Instagram 上出现，通过将他们的作品塑造为平台的结构和需求，向他们的粉丝卖出了数百万本书。\n\n鲁皮·考尔 (Rupi Kaur) 是最著名的：这位\
  \ 1992 年出生于印度的加拿大女性，通过发布简短的诗——将诗拆分成短行，并在 Instagram 的正方形图像中，配上她自己简单的线条画，积累了 450 万粉丝。这些诗使用标准的衬线字体并全小写字母，仿佛是在手机键盘上随手写下的——尽管这也参考了旁遮普语，因为那种语言没有大小写之分。其中一段写道：“他们没有告诉我这会这样疼\
  \ / 没有人警告过我 / 关于我们在朋友之间经历的心碎。”这些“诗歌图像”签名为“- rupi kaur”，这一手势强化了个人作者身份——一个品牌名——但也起到了某种作者水印的作用，以防图像（这极有可能）脱离其原始的数字语境，或在动态的其他地方被转发。观众总是知道这是谁写的。\n\
  \n其他的 Instagram 诗人是男性，他们奉有一种有意识的脆弱的典型男性气概形式。其中一个化名叫阿提库斯 (Atticus)，这是一位匿名诗人，拥有 160\
  \ 万 Instagram 粉丝和多本畅销书。阿提库斯的诗经常散布在酒瓶或度假中人们的库存照片上，关注爱情、美感和醉酒等主题：“我的亲爱的 / 让我们你我在这生活里漫游一会儿”是其中一个帖子的全部。然后是\
  \ R. M. 德雷克 (R. M. Drake)，拥有 280 万粉丝，他更倾向于散文诗段落，回响着死记硬背的自救咒言：“如果你失去了一个不在乎你的人，那并不是一种损失，”一首短诗这样开头道。R.\
  \ M. 德雷克同样在每一个 Instagram 画面中都附上自己的名字，看起来像是考尔的“大哥们版”。\n\n他们共同开发了 Instagram 诗歌的通用风格，具有与国际极简主义咖啡店相同的同质化。这种风格遵循了我一直在概述的、作为“过滤世界”(Filterworld)\
  \ 特征的原则：诗歌必须像图像像文本一样发挥功能，并能在各种数字平台中无缝穿梭，无论是 Instagram 动态、Facebook 帖子还是 TikTok 幻灯片。诗歌的内容本身必须是共鸣且可分享的，与其说针对个人化的经验或观点，不如说针对通用的、可识别的主题。\n\
  \n有些不公平的是，考尔既是这场运动的脸面，又是替罪羊，而平台本身对于 Instagram 诗歌的空庸美学可能有更多责任。考尔在青少年时期就开始表演朗诵诗，然后转到在\
  \ Tumblr 上发布，2013 年转到 Instagram。2014 年，她还自出版了自己的本诗集《牛奶与蜂蜜》(*Milk and Honey*)。随着她网络名声的增长，这本书在\
  \ 2015 年由专业出版社重版，销量超过两百万册，并登上了《纽约时报》畅销榜首。然而，批评家——长期以来一直是诗歌这种小众艺术形式的唯一裁决者——很大程度上讨厌考尔的作品。他们将其比作贺卡文案，并哀于它的直白。它并不值得长时间思考。\n\
  \n有些评论或许无意中反映了她的诗在多程度上满足了 Instagram 发布的需求：“考尔的诗以视觉吸引力的方式陈述了显而易见的、有趣的思维碎片，”一位批评家法里亚·费苏丁\
  \ (Fareah Fysudeen) 写道。“她的诗是预料之中的、显而易见的、空虚的。”在 Instagram 上，一切都必须是视觉化的：因此考尔大量的换行和线条增加了趣味。当一个帖子被设计成在动态中出现一次，吸引注意力几秒，然后毫无冒犯地滑过时，浅薄就不是一种缺陷。“考尔作为艺术家的成就在于她的作品在形式上体现了定义当代生活的科技：智能手机和互联网，”小说家鲁曼·阿勒姆\
  \ (Rumaan Alam) 在 2019 年为《共和国报》写的一篇名为《鲁皮·考尔是十年作家》的文章中写道。\n\n2023 年，我给阿勒姆打电话，询问他如何看待他当时的判断，那种判断引发了其他批评家的反弹。“我感到被证实了，”他说，“能够舒适地装进一眼范围内的、完全不需要移动手机屏幕的文字要有力得多。”\n\
  \n\n\n\nKaur 本人极具视觉冲击，这并非坏处：她的长脸、锐利的下颌线和大而富有戏剧性的眼睛，是她 Instagram 账号中充斥的大量自拍照的主角。近年来，她形成了一种在诗歌图像与自画像之间交替的模式，大多数是经过精心摆拍的造型（而非标准的随意的快照），穿着精细的高级时装化着精致的妆容。她将自己的外表呈现为与艺术同等的地位，这种融合并非每位创作者都能能力或愿意去做的。（在那种极具人性的美学评价中，我们都是不平等的，这是一种不同的算法。）想要成为成功的艺术家必须长得漂亮吗？当然不是，但这确实有帮助，特别是在\
  \ Instagram 时代。\n\nKaur 和她的诗歌拥有极大的内容资本。她既是一位网红，又是一位诗人，这两种身份在她身上并非此消彼长，而是相互促进的：她之所以成为受欢迎的网红，部分原因是因为她的诗歌，而她的诗歌之所以流行，部分原因是因为她建立的在线平台。摄影师\
  \ Patrick Janelle 也是同样的动态——我们忽略了他的艺术性，转而关注他的生活方式奇观——或许还有像小说家 Sean Thor Conroe，他\
  \ 2022 年的作品 `Fuccboi` 采用了社交媒体和短信的语言，充满了简练的格言式行文和数字俚语。Conroe 的个人 Instagram 账号充满了忧郁的抽烟自拍，这些照片像他小说最终的封面，以“坏男孩小说家”的模式记录并戏剧化了作家的生活。成为职业艺术家一直意味着某种公众人物，但在“过滤世界”（Filterworld）中，完美的图像是艺术的先决条件。\n\
  \nKaur 意识到 Instagram 如何对她的作品施加审美压力，让某些主题比其他主题获得更多关注。在 2017 年接受《娱乐周刊》（Entertainment\
  \ Weekly）采访时，她说：“我在网上获得最多的喜爱是关于情诗和心碎的诗。”例如，关于性暴力的诗歌获得的点赞较少。有一次，她转为为期一个月只发布这些基础主题，她的互动数据确实上升了。但她说，这感觉也并不真实。艺术家必须积极反抗社交媒体的激励机制，那种不断诱惑人们只给观众他们点击最多的东西（也要忘了观众在做决定时同样会被信息流所操纵）。“当你陷得太深时，你就会让人们的思想改变你想创造的和你想写的东西，”Kaur\
  \ 说。对社交媒体的持续被动消费导致了深层自我意识的缺失，Kaur 承认这一点，尽管她的作品正利用这一点将陈词滥调装点成独特的见解：“我们连接得太密了，以至于几乎不再与自我连接，”她说道。根据某些采访，Kaur\
  \ 手机上没有社交媒体，而且像许多名人一样，她有一支员工团队管理她的真实账号，在从其呈现的亲密感中获益的同时，将自己与其在线形象隔离开来。\n\n在任何将社交媒体视为艺术对立面的评价中，都存在着精英主义的成分。并不是每个人都能进入传统的、更被接受的艺术创作途径：常春藤大学、文学杂志、切尔西的画廊。利用引人入胜的图像成为一种吸引受众的手段，但并非所有艺术家都能触及。这种动态方式同样适用于摄影师\
