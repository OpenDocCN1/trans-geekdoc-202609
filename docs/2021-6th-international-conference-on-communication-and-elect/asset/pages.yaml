  md: '# Traffic Rules Violation Detection by Machine Learning Techniques


    P.Srinivas Reddy¹, T. Nishwa², R. Shiva Kiran Reddy³, Ch Sadviq⁴, K. Kithivik⁵

    1,2,3,4,5 Department of Computer Science and Engineering, MLR Institute of Technology

