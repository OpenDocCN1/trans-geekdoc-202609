    # ABSTRACT—


    Due to the growing population and people''s need for comfort, more automobiles
    are being purchased, particularly in urban areas. This results in heavy traffic,
    indicating that traffic violations are becoming more dangerous in every corner
    of the world. As a result, people''s wealth decreases, and there are more accidents
    resulting in the loss of many lives. This necessitates the need to develop traffic
    violation detection systems to automate and eliminate the unaware among population.
    The proposed traffic violation detector can identify signal violations who are
    unaware that they are apprehended if they break traffic law. The proposed system
    is faster and easier than human, as traffic police are the only one who can capture
    images of violating traffic but not one violation simultaneously. The proposed
    system can detect most common types of violations in real-time through computer
    vision techniques and leaves good results with great accuracy.


    used for analyzing imagery. This project is built on TensorFlow and it relies
    on various libraries to perform the required actions. This system can detect three
    types of traffic violations.


    # II. LITERATURE SURVEY


    In the existing system, a police officer regulates traffic and captures a photo,
    which is then used to submit images of vehicles that break traffic rules on official
    website with the licence number. This process takes more time and also of the
    vehicles may escape capturing photos because it is difficult to control traffic
    and capture the photos of vehicles who violates traffic rule simultaneously.


    # III. PROPOSED SYSTEM


    Due to ever-increasing traffic, it is evident that it is becoming tough to monitor
    every individual under these conditions and it is difficult to maintain the road
    under control as it is demanding more power. This problem can also lead to accidents,
    traffic rules and other situations. Hence, this research proposes an automated
    system for maintaining these violations by developing a system with help of computer
    vision, which detects the violations caused by vehicles and identifies the registration
    number of violated vehicles in order to send an alert to the host. In general,
    Computer Vision is concerned on how a system can obtain high-level features from
    the images and videos. This project entails the process of locating and identifying
    a car''s registration number. Furthermore, it uses Convolutional Neural Networks
    (CNN''s), which is a class of Deep learning that comes under deep neural learning


    +   - The proposed model necessitates two things in particular -Vehicle detection
    process

    - Graphical User Interface [GUI]

    The CCTV camera footage that recorded from different areas will be sent to the
    system. Whenever the vehicle will be detected. Whenever the proposed software
    tests the footage, the violation will be detected. The proposed software supports
    signal violation by identifying the algorithm called R-CNN algorithm. A system
    flowchart1 shows how the software works. We use tkinter for Graphical user interface
    and tkinter is very interactive for the user. Police officer can take care and
    track the traffic footage and get the details of violation with the captured vehicle
    image. User can take further action like notifying licence numbers which violates
    traffic rules and send to nearby police stations to take further actions.'
