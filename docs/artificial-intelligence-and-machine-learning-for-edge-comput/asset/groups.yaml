  - '[PAGE 7]


    # 3 It takes two to tango: Future of artificial intelligence and machine learning
    in blockchain technology


    Security is a major area of concern in traditional e-commerce projects [15]. Blockchain
    has numerous advantages, but there are also some implementations. For example,
    the threats and limitations of blockchain in health care are discussed in Ref.
    [16]. Fig 3 shows the blockchain technology of concerns where ML and AI can help.
    To overcome these limitations and concerns of blockchain technology, the capability
    of AI can be exploited.


    # 3.1 Sustainability


    Sustainability is the major concern in the blockchain technology as mining requires
    a lot of energy. AI has already proven its mittle in the optimization of power
    consumption. So, it can be utilized to employed.


    # 3.2 Scalability


    Scalability is another critical issue in the blockchain. The size of the blockchain
    is growing 1 MB in 600 s. Blockchain pruning [6] is not able to handle this. AI-powered
    federated learning or novel data-shredding techniques may be used here.


    # 3.3 Security


    Due to high energy consumption in the mining blockchain, it is almost impossible
    to hack into; but, its applications and layers are not secure as smart contracts
    in the blockchain are written by the programmers themselves. Here, we can exploit
    the ML capability of intrusion detection.


    # 3.4 Privacy


    AI- and ML-based models can prove useful to protect the privacy of blockchain
    data. For example, the HDG mobile app aims to automate medical histories without
    breaches in privacy [17].


    # 3.5 Adaptability


    AI- and ML-based models can accurately predict the adaptability of blockchain
    applications. The adaptability of the blockchain is predicted according to the
    needs of the business, the management as well as the employees'' willingness to
    switch over a newer technology.


    ![](img/d482d976e7e75f102ff440e8522a951e_7_0.png)


    FIG. 3 Blockchain area of concerns.'
