    the blockchain and limitations of blockchain are tailored by AI. ML is proving
    its capability in automating the blockchain

    IoT with edge computing is another weapon to use with blockchain technology and
    AI. With edge computing, our computational power can be increased many folds.
    The absence of a middle party or governing party is the beauty of blockchain technology,
    which is a double-edged sword. To remove the clouds of uncertainty that surround
    the blockchain, AI and ML can play a vital role. This article discussed lot of
    applications of AI and ML in blockchain technology. We also discussed edge computing
    as a potential use of blockchain technology. Research in these areas are open
    for contributions.


