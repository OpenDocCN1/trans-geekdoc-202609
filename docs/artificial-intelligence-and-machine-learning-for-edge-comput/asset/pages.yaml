    # 1.3 Blockchain trust builder attributes


    Blockchain technology has become the talk of the town because of the trust it
    infuses into the system. Building without intermediaries is the unique selling
    point of this technology. Fig. 2 shows the blockchain trust builder attributes
    [11].


    +   - Distributed: There is no central authority to trust with. Every transaction
    is mirrored in the shared ledger of blockchain members. The shared ledger is updated
    in real time.

    - Sustainable: The sustainability of the blockchain network lies in its architecture.
    No individual entity poses any threat to the existence of a blockchain platform.

    - Protected: Unauthorized access is checked by the crypto-graph tools and by the
    restrictions imposed on permissions.

    - Confidential: Cryptographic techniques along with data partitioning techniques
    preserve the privacy of the trading parties and the transactions.

    - Permanent: Once transactions are agreed upon the smart contract and the transaction
    is completed, no one can alter the transaction in the ledger. In case of an erroneous
    transaction, the effect of errors will be reversed by only the new transaction
    in the ledger.

    - Transparent: As participants of the network have access to the same ledger,
    verification of the credentials of all the entities participating in the transaction,
    and the validation of each transaction are done, without help of any mediator,
    through various crypto-graph tools by each member of the network.

    - Verifiable: The beauty of blockchain is we can verify in real time all transactions
    as the ledger are recorded in sequence and time-stamped.

    - Consensus: Smart contracts are the soul of the blockchain and consensus algorithms
    are the crux of smart contracts. All stakeholders of the network must ensure the
    validity of the transaction.

    - Transactional: Each smart contract of the blockchain can formulate its own terms
    and conditions of the transaction for the exchange activity.

    - Coordination: Participating parties can coordinate, design, and agree upon rules,
    terms, and conditions for each transaction in the blockchain platform.

    - Elastic: The blockchain network is very flexible in nature; all business needs
    of all lives can be designed and developed through smart contracts. No approval
    is needed from any central or supreme authority. Therefore, end-to-end transactions
    can be developed meticulously with flexibility.


