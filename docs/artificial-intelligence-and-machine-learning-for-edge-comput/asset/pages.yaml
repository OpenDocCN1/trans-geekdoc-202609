  md: '# Edge computing: A potential use of blockchain


    The idea of edge computing is to bring the computational capacity at the origin
    of "instant data" itself. Therefore, this paradigm of edge computing may serve
    better for delay-sensitive jobs by pushing the cloud computational capability
    to the edge of that network [18]. The backbone of edge computing is its distributed
    computational framework. The purpose of this is to bring the storage capacities
    and computational abilities of the data sources, devices, nearer to the enterprise
    business logic where they are actually needed [19-21]. The working of edge computing
    is different; the difference is that edge devices process the computation locally,
    whereas the cloud computing centralizes it in a single data center [22], as shown
    in Fig. 4. Edge computing has advantage over cloud computing in terms of latency
    and bandwidth edge devices have to send only individual results, after processing
    on the local data, to the edge servers.


    Internet of Things (IoT) is one of the possible uses of edge computing. Let us
    use an example of store of clothing, where local and batch, both types of processing,
    are needed for inventory and sales. Geographically distributed outlets tally their
    inventory and sales and then forward the computational results to the head office
    each day. The top hierarchy, head office in this example is not interested in
    each transaction that happens at the outlet (edge) but in the final statistics
    of sales and inventory computed by the outlet (edge devices). By exhausting the
    capabilities of edge computing, we reshape almost every industry. Use cases of
    edge computing including telecommunication, health, financial services, media
    and entertainment, manufacturing, supply chain, retail, insurance, pharmaceuticals,
    and automotive with smart and smart city. Fig. 5 shows some of the uses of edge
    computing.


    # 4.1 Edge computing architectures


    The architecture of cloud computing and IoT may be expanded to the illusion diagram
    of edge computing architecture. Basilly, edge computing utilizes a multilayered
    distributed architecture to balance among between cloud layer, edge layer or edge
    network, and the edge layer that connects edge local server layer and edge device;
    a high-level illusion diagram of edge computing architecture is presented in Fig.
    6. Fig. 7 represents a simplified edge architecture reference based on IBM edge
    computing architecture.


    The top layer, or cloud microcloud, is used for analysis of large-scale data.
    It consists of a dashboard that may be the focus of device management and monitoring.
    This layer may have hundreds of devices. The size of software components as AI
    services and Models at each layer varies according to the size of data it has
    to process.


    The second layer is the edge cloud or micro data centers that may be thought of
    as a local cloud for edge devices computing support. This layer is also considered
    as an edge network in the telecommunication field. Edge clouds can do most of
    the computing on their own without consulting the top layer, decreasing latency
    and minimizing bandwidth widths. This layer may have thousands of devices.


    The third layer is the edge server layer. Edge devices communicate with edge servers
    with the help of agents installed in devices. Edge devices may do cloud computation
    by themselves, if more analytics are required then they communicate


    ![](img/d482d976e7e75f102ff440e8522a951e_9_0.png)


    FIG. 4 High-level idea of cloud and edge computing.'
