    # ## 1 Introduction


    A distributed immutable ledger is the backbone of blockchain technology that facilitates
    the process of recording and auditing all transactions and tracking the assets,
    in real time, in a business network [1]. Artificial intelligence (AI) tries to
    make machines do things which, as now, humans do appropriately. Blockchain and
    AI when combined can facilitate the process of software development and its maintenance
    in almost every industry. For example, we can see how both technologies, implemented
    in the areas of health care, can make much for each. Supply chain, entertainment,
    cybersecurity and logistics have however impacted. Blockchain can be made for
    each. The limitations of AI include privacy, transparency, and trustworthiness,
    whereas blockchain can infer privacy, transparency. Similarity, efficiency, scalability,
    and security are the main bottlenecks of blockchain technology.


    Each of the blockchain contains multiple transactions. New-known cryptographic
    tools like hashing or the proof of work [4] algorithm, SHA256, ethics and each
    are used to compute the hash value of the blocks. The hash of the previous block
    is considered as the base-block (see Fig. 1) for the current block [5].


    The blockchain provides an immutable ledger that can store the decision-making
    process of AI in a more transparent and understandable manner. The data on blockchain
    is publicly; Bitcoin can enforce smart contracts and confidentiality of data in
    a blockchain ledger. Advances in AI and ML have fostered the adoption of their
    applications in blockchain technology. The use of AI in things like self-driving
    cars and personal assistants who are well versed in natural language is the new
    normal for us [7]. AI has put a lot of interest充分 to tap the table on the one
    hand, but on the other hand, AI and ML may cause critical issues like the creation
    of fake photographs, videos, notes against false, and pornography [8]. Privacy
    breach [9] with the help of AI is a potential threat for us. Here, blockchain
    technology can provide helpful as it gives you the power to control of your data.
    Blockchain technology brings characteristics like explaining ability, privacy,
    and trustworthiness to the implementation of AI.


    # ## 1.1 Blockchain characteristics


    E-transactions of the traditional banking system are costly as as prone to malicious
    attacks on the intermediaries [10]. However, the blockchain network is an efficient
    and cost-effective technology because it eliminates the disparity of efforts by
    removing the need for intermediaries. Uses of consensus models to validate information
    make it less vulnerable. Transactions in blockchain technology are secure, verifiable,
    and authenticated.'
