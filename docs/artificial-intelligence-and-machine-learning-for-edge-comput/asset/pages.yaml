    #  4.3 Applications of blockchain technology in edge computing


    In edge computing, edge devices frequently communicate with each other and edge
    servers to do AI and learning-enabled decision-making. Communication networks
    and the devices themselves are prone to security threats, for tampering or leakage
    of information transmitted over the edge network due to possible attacks by hackers
    or failure of devices [23]. The tamper-proof ledger of blockchain technology can
    play a key role. Blockchain technology can ensure tamper-proof network communication
    and data storage on edge devices, the edge network, and the enterprise cloud.
    An AI-trust model in edge computing can be optimized and improved with the help
    of smart contracts and consensus protocols of blockchain technology [24]. The
    blockchain and edge computing technologies have great efficacy and the potential
    to provide solutions in diverse scenarios [25]. Blockchain-powered trusted, secure,
    and tamper-proof edge computing framework can provide effective solutions. Researchers
    have proposed several frameworks for blockchain-enabled edge computing. Some of
    the recent state-of-the-art blockchain edge computing frameworks are summarized
    in Table 7.


