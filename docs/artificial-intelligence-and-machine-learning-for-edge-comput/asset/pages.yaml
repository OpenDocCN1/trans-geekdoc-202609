    ![](img/d482d976e7e75f102ff440e8522a951e_1_0.png)


    FIG. 1 Basic diagram of a blockchain.


    The following are the general characteristics of blockchain technology:


    +   - Consensus: All members in the blockchain network must agree on the validity
    of the transactions.

    - Immutability: Once transactions have been recorded in the ledger, then it will
    become impossible to tamper with by any of the members of the blockchain network.
    If there is an error in the transaction, then that a new transaction must be executed
    to revert the error induced. The beauty of blockchain is that both transactions
    are visible to all, now.

    - Source: The source of the asset is known to all the nodes of the blockchain
    as well as the change in ownership of the asset is visible to all, too.

    - Inevitability: Blockchain gives the one-stop solution, in the form of a single
    ledger, to verify the accomplishment of the transaction as well as the asset''s
    ownership.


    # 1.2 Advantages of blockchain


    Blockchain technology has the following advantages for a business:


    +   - Less turnaround time: The turnaround time of a transaction in the blockchain
    is much less as compared to other traditional middle-party undertakings. The absence
    of central authority verification boosts the speed of the transactions.

    - Impregnable fort: Blockchain applications may be thought of like an impregnable
    fort because of the security features it has. Hacking, cybersecurity, breach of
    data, or trust are not possible in the blockchain ledger.

    - Cost-efficient: The following attributes of the blockchain network make it cost-efficient
    compared to other classical networks with authority.

    - Low maintenance: There is no central authority to monitor the activities of
    activities in the blockchain. All participants contribute to make the network
    up and kicking.

    - Peer-to-peer transaction: Members of the blockchain can exchange assets or services
    directly without any interference or central authority.

    - No repetitive efforts: A single ledger is shared by all the members of the blockchain
    network, eliminating the duplication of efforts.'
