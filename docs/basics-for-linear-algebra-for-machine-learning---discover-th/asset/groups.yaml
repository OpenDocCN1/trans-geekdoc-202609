    \ -0.81649658]\n [-0.8186735  0.61232756  0.40824829]]\n```\n\nListing 15.2: Sample\
    \ output from calculating an eigendecomposition.\n\n### 15.5 Confirm an Eigenvector\
    \ and Eigenvalue\n\nWe can confirm that a vector is indeed an eigenvector of a\
