    ## 5.4 数组切片


    目前为止，一切顺利；创建和索引数组看起来很熟悉。现在我们来谈谈数组切片，这是导致 Python 和 NumPy 数组初学者遇到问题的一个功能。列表和 NumPy
    数组等结构都可以进行切片。这意味着结构的一个子序列可以被索引和检索。在机器学习中，当指定输入变量和输出变量，或将训练行与测试行分开时，这非常有用。切片使用冒号运算符
    : 进行指定，分别在列之前和之后提供 from 索引和 to 索引。切片从 from 索引开始，并在 to 索引之前的一项处结束。


    ```python

    data[from:to]

    ```


    列表 5.17: 数组切片语法示例。


    ### 5.4.1 一维切片


    你可以通过指定没有索引的切片 ‘:’ 来访问数组维度中的所有数据。


    ```python

    # slice a one-dimensional array

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    print(data[:])

    ```


