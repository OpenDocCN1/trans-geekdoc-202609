    # ## 12.2 Sparse Matrix


    A sparse matrix is a matrix that is comprised of mostly zero values. Sparse matrices
    are distinct from matrices with mostly non-zero values, which are referred to
    as dense matrices.


    A matrix is sparse if many of its coefficients are zero. The interest in sparsity
    arises because its exploitation can lead to enormous computational savings and
    because many large matrix problems that occur in practice are sparse.


    > > — Page 1, Direct Methods for Sparse Matrices, Second Edition, 2017.


    The sparsity of a matrix can be quantified with a score, which is the number of
    zero values in the matrix divided by the total number of elements in the matrix.


    ```

    sparsity = \frac{\text{count of non-zero elements}}{\text{total elements}} (12.1)

    ```


    Below is an example of a small 3 × 6 sparse matrix.


    ```

    A = \begin{pmatrix} 1 & 0 & 0 & 1 & 0 & 0 \\ 0 & 0 & 2 & 0 & 0 & 1 \\ 0 & 0 &
    0 & 2 & 0 & 0 \end{pmatrix} (12.2)

    ```


    The example has 13 zero values of the 18 elements in the matrix, giving this matrix
    a sparsity score of 0.722 or about 72%.


    # ## 12.3 Problems with Sparsity


    Sparse matrices can cause problems with regards to space and time complexity.


    # ## 12.3.1 Space Complexity


    Very large matrices require a lot of memory, and some very large matrices that
    we wish to work with are sparse.


    In practice, most large matrices are sparse — almost all entries are zeros.


    > > — Page 465, Introduction to Linear Algebra, Fifth Edition, 2016.


    An example of a very large matrix that is too large to be stored in memory is
    a link matrix that shows the links from one website to another. An example of
    a smaller sparse matrix might be a word or term occurrence matrix for words in
    one book against all known words in English. In both cases, the matrix contained
