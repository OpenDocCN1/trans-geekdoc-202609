    # Chapter 19


    # Linear Regression


    Linear regression is a method for modeling the relationship between one or more
    independent variables and a dependent variable. It is a staple of statistics and
    is often considered a good introductory machine learning method. It is also a
    method that can be reformulated using matrix notation and solved using matrix
    operations. In this tutorial, you will discover the matrix formulation of linear
    regression and how to solve it using direct and matrix factorization methods.
    After completing this tutorial, you will know:


    +   - Linear regression and the matrix reformulation with the normal equations.

    +   - How to solve linear regression using a QR matrix decomposition.

    +   - How to solve linear regression using SVD and the pseudoinverse.


    Let''s get started.


    # 19.1 Tutorial Overview


    This tutorial is divided into 7 parts; they are:


    +   1. What is Linear Regression

    +   2. Matrix Formulation of Linear Regression

    +   3. Linear Regression Dataset

    +   4. Solve via Inverse

    +   5. Solve via QR Decomposition

    +   6. Solve via SVD and Pseudoinverse

    +   7. Solve via Convenience Function'
  - '[PAGE 169]


    # 19.2 What is Linear Regression


    Linear regression is a method for modeling the relationship between two scalar
    values: the input variable x and the output variable y. The model assumes that
    y is a linear function or a weighted sum of the input variable.


    y = f(x) (19.1)


    Or, stated with the coefficients.


    y = b0 + b1 × x1 (19.2)


    The model can also be used to model an output variable given multiple input variables
    called multivariate linear regression (below, brackets were added for readability).


    y = b0 + (b1 × x1) + (b2 × x2) + ⋯ (19.3)


    The objective of creating a linear regression model is to find the values for
    the coefficient values (b) that minimize the error in the prediction of the output
    variable y.


    # 19.3 Matrix Formulation of Linear Regression


    Linear regression can be stated using Matrix notation; for example:


    y = X · b (19.4)


    Or, without the dot notation.


    y = Xb (19.5)


    Where X is the input data and each column is a data feature, b is a vector of
    coefficients and y is a vector of output variables for each row in X.


    X = ( x1,1 x1,2 x1,3 x2,1 x2,2 x2,3 x3,1 x3,2 x3,3 x4,1 x4,2 x4,3 ) (19.6)


    b = ( b1 b2 b3 ) (19.7)


    y = ( y1 y2 y3 y4 ) (19.8)


    Reformulated, the problem becomes a system of linear equations where the b vector
    values are unknown. This type of system is referred to as overdetermined because
    there are more equations than there are unknowns, i.e. each coefficient is used
    on each row of data. It is a'
  - '[PAGE 170]


    challenging problem to solve analytically because there are multiple inconsistent
    solutions, e.g. multiple possible values for the coefficients. Further, all solutions
    will have some error because there is no line that will pass nearly through all
    points, therefore the approach to solving the equations must be able to handle
    that. The way this is typically achieved is by finding a solution where the values
    for b in the model minimize the squared error. This is called linear least squares.


    \(||X \cdot b - y||^2 = \sum_{i=1}^m \sum_{j=1}^n X_{i,j} \cdot (b_j - y_i)^2\)
    (19.9)


    This formulation has a unique solution as long as the input columns are independent
    (e.g. uncorrelated).


    We cannot always get the error \(e = b - Ax\) down to zero. When \(e\) is zero,
    \(x\) is an exact solution to \(Ax = b\). When the length of \(e\) is as small
    as possible, \(\hat{x}\) is a least squares solution.


    > — Page 219, *Introduction to Linear Algebra*, Fifth Edition, 2016.


    In matrix notation, this problem is formulated using the so-named normal equation:


    \(X^T \cdot X \cdot b = X^T \cdot y\) (19.10)


    This can be re-arranged in order to specify the solution for b as:


    \(b = (X^T \cdot X)^{-1} \cdot X^T \cdot y\) (19.11)


    This can be solved directly, although given the presence of the matrix inverse
    can be numerically challenging or unstable.


    # 19.4 Linear Regression Dataset


    In order to explore the matrix formulation of linear regression, let''s first
    define a dataset as a context. We will use a simple 2D dataset where the data
    is easy to visualize as a scatter plot and models are easy to visualize as a line
    that attempts to fit the data points. The example below defines a \(5 \times 2\)
    matrix dataset, splits it into X and y components, and plots the dataset as a
    scatter plot.


    ```

    # linear regression dataset

    from numpy import array

    from matplotlib import pyplot

    # define dataset

    data = array([

    [0.05, 0.12],

    [0.18, 0.22],

    [0.31, 0.35],

    [0.42, 0.38],

    [0.5, 0.49]])

    print(data)

    # split into inputs and outputs

    ```'
