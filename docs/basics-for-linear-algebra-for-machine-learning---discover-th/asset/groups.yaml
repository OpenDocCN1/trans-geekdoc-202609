  mdcn: "\n\n$L^1$ 范数常用于拟合机器学习算法作为正则化方法，例如一种保持模型系数较小，从而使模型复杂度较低的方法。\n\n## 8.4 向量 $L^2$\
    \ 范数\n\n向量的长度可以使用 $L^2$ 范数来计算，其中 2 是 $L$ 的上标。向量的 $L^2$ 范数记作 $||v||_2$，其中 2 是下标。\n\
    \n$$L^2(v) = ||v||_2$$ (8.3)\n\n$L^2$ 范数计算向量坐标相对于向量空间原点的距离。因此，它也被称为欧几里得范数，因为它是从原点计算的欧几里得距离。结果是一个正距离值。$L^2$\
    \ 范数计算为向量值平方和的平方根。\n\n$$||v||_2 = \\sqrt{a_1^2 + a_2^2 + a_3^2}$$ (8.4)\n\n向量的\
    \ $L^2$ 范数可以在 NumPy 中使用带默认参数的 `norm()` 函数计算。\n\n```\n# vector L2 norm\nfrom numpy\
    \ import array\nfrom numpy.linalg import norm\n# define vector\na = array([1,\
    \ 2, 3])\nprint(a)\n# calculate norm\nl2 = norm(a)\nprint(l2)\n```\n\n清单 8.3：计算\
    \ $L^2$ 向量范数的示例。\n\n首先，定义一个 3 元素向量，然后计算向量的 $L^2$ 范数。运行示例首先打印定义的向量，然后打印向量的 $L^2$\
    \ 范数。\n\n```\n[1 2 3]\n\n3.74165738677\n```\n\n清单 8.4：计算 $L^2$ 向量范数的示例输出。\n\n\
    与 $L^1$ 范数类似，$L^2$ 范数常用于拟合机器学习算法作为正则化方法，例如一种保持模型系数较小，从而使模型复杂度较低的方法。相比之下，$L^2$\
    \ 范数在机器学习中比其他向量范数更常用。\n\n## 8.5 向量最大范数\n\n向量的长度可以使用最大范数（也称为 max 范数）来计算。向量的最大范数称为\
    \ $L^{inf}$，其中 inf 是上标，可以用无穷符号表示。最大范数的记法是 $||v||_{inf}$，其中 inf 是下标。\n\n$L^{inf}(v)\
    \ = ||v||_{inf}$ (8.5)\n\n最大范数通过返回向量的最大值来计算，因此得名。\n\n$||v||_{inf} = \\max a_1,\
