    \ array([\n    [1, 2],\n    [3, 4]])\nprint(B)\n# multiply matrices\nC = A.dot(B)\n\
    print(C)\n# multiply matrices with @ operator\nD = A @ B\nprint(D)\n```\n\nListing\
    \ 9.11: Example of matrix-matrix dot product."
