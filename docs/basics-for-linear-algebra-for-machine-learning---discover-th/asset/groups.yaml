    \ 中没有 pca() 函数，但我们可以使用 NumPy 函数轻松逐步计算主成分分析。下面的示例定义了一个小的 3 x 2 矩阵，对矩阵中的数据进行中心化，计算中心化数据的协方差矩阵，然后计算协方差矩阵的特征分解。将特征向量和特征值作为主成分和奇异值，并用于投影原始数据。\n\
