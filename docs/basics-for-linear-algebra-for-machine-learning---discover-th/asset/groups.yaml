    \ creating a diagonal matrix.\n\n# 10.6 Identity Matrix\n\nAn identity matrix\
    \ is a square matrix that does not change a vector when multiplied. The values\
    \ of an identity matrix are known. All of the scalar values along the main diagonal\
    \ (top-left to bottom-right) have the value one, while all other values are zero.\n\
    \n> An identity matrix is a matrix that does not change any vector when we multiply\
    \ that vector by that matrix.\n> — Page 36, Deep Learning, 2016.\n\nAn identity\
    \ matrix is often represented using the notation $I$ or with the dimensionality\
    \ $I^n$, where $n$ is a subscript that indicates the dimensionality of the square\
    \ identity matrix. In some notations, the identity may be referred to as the unit\
