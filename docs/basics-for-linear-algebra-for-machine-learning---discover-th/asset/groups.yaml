    \ a_{1,1,2} & a_{1,2,2} & a_{1,3,2} \\\\ a_{2,1,2} & a_{2,2,2} & a_{2,3,2} \\\
    end{pmatrix} \\) (13.6)\n\n\\( B = \\begin{pmatrix} b_{1,1,1} & b_{1,2,1} & b_{1,3,1}\
    \ \\\\ b_{2,1,1} & b_{2,2,1} & b_{2,3,1} \\end{pmatrix}, \\begin{pmatrix} b_{1,1,2}\
    \ & b_{1,2,2} & b_{1,3,2} \\\\ b_{2,1,2} & b_{2,2,2} & b_{2,3,2} \\end{pmatrix}\
    \ \\) (13.7)\n\n\\( C = A - B \\) (13.8)\n\n\\( C = \\begin{pmatrix} a_{1,1,1}\
    \ - b_{1,1,1} & a_{1,2,1} - b_{1,2,1} & a_{1,3,1} - b_{1,3,1} \\\\ a_{2,1,1} -\
    \ b_{2,1,1} & a_{2,2,1} - b_{2,2,1} & a_{2,3,1} - b_{2,3,1} \\end{pmatrix}, \\\
