    # 2.4 Learn Linear Algebra for Statistics


    You must learn linear algebra in order to be able to learn statistics. Especially
    multivariate statistics. Statistics and data analysis are another pillar field
    of mathematics to support machine learning. They are primarily concerned with
    describing and understanding data. As the mathematics of data, linear algebra
    has left its fingerprint on many related fields of mathematics, including statistics.


    In order to be able to read and interpret statistics, you must learn the notation
    and operations of linear algebra. Modern statistics uses both the notation and
    tools of linear algebra to describe the tools and techniques of statistical methods.
    From vectors for the means and variances of data, to covariance matrices that
    describe the relationships between multiple Gaussian variables. The results of
    some collaborations between the two fields are also staple machine learning methods,
    such as the Principal Component Analysis, or PCA for short, used for data reduction.


    # 2.5 Learn Matrix Factorization


    Building on notation and arithmetic is the idea of matrix factorization, also
    called matrix decomposition. You need to know how to factorize a matrix and what
    it means. Matrix factorization is a key tool in linear algebra and used widely
    as an element of many more complex operations in both linear algebra (such as
    the matrix inverse) and machine learning (least squares).


    Further, there are a range of different matrix factorization methods, each with
    different strengths and capabilities, some of which you may recognize as “machine
    learning” methods, such as Singular-Value Decomposition, or SVD for short, for
    data reduction. In order to read and interpret higher-order matrix operations,
    you must understand matrix factorization.


    # 2.6 Learn Linear Least Squares


    You need to know how to use matrix factorization to solve linear least squares.
    Linear algebra was originally developed to solve systems of linear equations.
    These are equations where there are more equations than there are unknown variables.
    As a result, they are challenging to solve arithmetically because there is no
    single solution as there is no line or plane can fit the data without some error.
    Problems of this type can be framed as the minimization of squared error, called
    least squares, and can be recast in the language of linear algebra, called linear
    least squares.


    Linear least squares problems can be solved efficiently on computers using matrix
    operations such as matrix factorization. Least squares is most known for its role
    in the solution to linear regression models, but also plays a wider role in a
    range of machine learning algorithms. In order to understand and interpret these
    algorithms, you must understand how to use matrix factorization methods to solve
    least squares problems.


