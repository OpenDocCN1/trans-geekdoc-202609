    - https://www.quora.com/topic/Linear-Algebra

    - 数学子版块。

    - https://www.reddit.com/r/math/


    ### A.7 如何提问


    知道在哪里获得帮助是第一步，但您需要知道如何充分利用这些资源。以下是一些您可以使用的技巧：


    - 将您的问题简化为最简单的形式。例如，不要提出诸如“我的模型无法运行”或“x 是如何工作的”这样宽泛的问题。

