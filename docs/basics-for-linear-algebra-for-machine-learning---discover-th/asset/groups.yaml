    using the limited precision of computers. Matrix decompositions are methods that
    reduce a matrix into constituent parts that make it easier to calculate more complex
    matrix operations. Matrix decomposition methods, also called matrix factorization
    methods, are a foundation of linear algebra in computers, even for basic operations
