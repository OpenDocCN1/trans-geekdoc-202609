    \ perhaps the most popular method is called the principal component analysis or\
    \ PCA for short. This method is used in machine learning to create projections\
    \ of high-dimensional data for both visualization and for training models. The\
    \ core of the PCA method is a matrix factorization method from linear algebra.\
    \ The eigendecomposition can be used and more robust implementations may use the\
    \ singular-value decomposition or SVD.\n\n## 3.8 Singular-Value Decomposition\n\
    \nAnother popular dimensionality reduction method is the singular-value decomposition\
    \ method or SVD for short. As mentioned and as the name of the method suggests,\
    \ it is a matrix factorization method from the field of linear algebra. It has\
    \ wide use in linear algebra and can be used directly in applications such as\
    \ feature selection, visualization, noise reduction and more. We will see two\
    \ more cases below of using the SVD in machine learning.\n\n## 3.9 Latent Semantic\
    \ Analysis\n\nIn the sub-field of machine learning for working with text data\
    \ called natural language processing, it is common to represent documents as large\
    \ matrices of word occurrences. For example, the columns of the matrix may be\
    \ the known words in the vocabulary and rows may be sentences, paragraphs, pages\
    \ or documents of text with cells in the matrix marked as the count or frequency\
    \ of the number of times the word occurred. This is a sparse matrix representation\
    \ of the text. Matrix factorization methods such as the singular-value decomposition\
    \ can be applied to this sparse matrix which has the effect of distilling the\
    \ representation down to its most relevant essence. Documents processed in this\
    \ way are much easier to compare, query and use as the basis for a supervised\
    \ machine learning model. This form of data preparation is called Latent Semantic\
    \ Analysis or LSA for short, and is also known by the name Latent Semantic Indexing\
    \ or LSI.\n\n## 3.10 Recommender Systems\n\nPredictive modeling problems that\
    \ involve the recommendation of products are called recommender systems, a sub-field\
    \ of machine learning. Examples include the recommendation of books based on previous\
    \ purchases and purchases by customers like you on Amazon, and the recommendation\
    \ of movies and TV shows to watch based on your viewing history and viewing history\
    \ of subscribers like you on Netflix. The development of recommender systems is\
    \ primarily concerned with linear algebra methods. A simple example is in the\
    \ calculation of the similarity between sparse customer behavior vectors using\
    \ distance measures such as Euclidean distance or dot products. Matrix factorization\
    \ methods like the singular-value decomposition are used widely in recommender\
    \ systems to distill item and user data to their essence for querying and searching\
    \ and comparison.\n\n## 3.11 Deep Learning\n\nArtificial neural networks are nonlinear\
    \ machine learning algorithms that are inspired by elements of the information\
    \ processing in the brain and have proven effective at a range of problems not\
    \ least predictive modeling. Deep learning is the recent resurged use of artificial\
    \ neural networks with newer methods and faster hardware that allow for the development\
    \ and training of larger and deeper (more layers) networks on very large datasets.\
    \ Deep learning methods routinely achieve state-of-the-art results on a range\
    \ of challenging problems such as machine translation, photo captioning, speech\
    \ recognition and much more.\n\nAt their core, the execution of neural networks\
    \ involves linear algebra data structures multiplied and added together. Scaled\
    \ up to multiple dimensions, deep learning methods work with vectors, matrices\
    \ and even tensors of inputs and coefficients, where a tensor is a matrix with\
    \ more than two dimensions. Linear algebra is central to the description of deep\
    \ learning methods via matrix notation to the implementation of deep learning\
    \ methods such as Google's TensorFlow Python library that has the word \"tensor\"\
    \ in its name.\n\n## 3.12 Summary\n\nIn this chapter, you discovered 10 common\
    \ examples of machine learning that you may be familiar with that use and require\
    \ linear algebra. Specifically, you learned:\n\n- The use of linear algebra structures\
    \ when working with data such as tabular datasets and images.\n- Linear algebra\
    \ concepts when working with data preparation such as one hot encoding and dimensionality\
    \ reduction.\n- The ingrained use of linear algebra notation and methods in sub-fields\
    \ such as deep learning, natural language processing and recommender systems.\n\
    \n## 3.12.1 Next\n\nThis is the end of the first part, in the next part you will\
    \ discover how to manipulate arrays of data in Python using NumPy.\n\n## Part\
    \ III\n\n### NumPy\n\n## Chapter 4\n\n### Introduction to NumPy Arrays\n\nArrays\
    \ are the main data structure used in machine learning. In Python, arrays from\
    \ the NumPy library, called N-dimensional arrays or the `ndarray`, are used as\
    \ the primary data structure for representing data. In this tutorial, you will\
    \ discover the N-dimensional array in NumPy for representing numerical and manipulating\
    \ data in Python. After completing this tutorial, you will know:\n\n- What the\
    \ `ndarray` is and how to create and inspect an array in Python.\n- Key functions\
    \ for creating new empty arrays and arrays with default values.\n- How to combine\
    \ existing arrays to create new arrays.\n\nLet's get started.\n\n### 4.1 Tutorial\
    \ Overview\n\nThis tutorial is divided into 3 parts; they are:\n\n- 1. NumPy N-dimensional\
    \ Array\n- 2. Functions to Create Arrays\n- 3. Combining Arrays\n\n### 4.2 NumPy\
    \ N-dimensional Array\n\nNumPy is a Python library that can be used for scientific\
    \ and numerical applications and is the tool to use for linear algebra operations.\
    \ The main data structure in NumPy is the `ndarray`, which is a shorthand name\
    \ for N-dimensional array. When working with NumPy, data in an `ndarray` is simply\
    \ referred to as an array. It is a fixed-sized array in memory that contains data\
    \ of the same type, such as integers or floating point values.\n\nThe data type\
    \ supported by an array can be accessed via the `dtype` attribute on the array.\
    \ The dimensions of an array can be accessed via the `shape` attribute that returns\
    \ a tuple describing the length of each dimension. There are a host of other attributes.\
    \ A simple way to create an array from data or simple Python data structures like\
    \ a list is to use the array() function. The example below creates a Python list\
    \ of 3 floating point values, then creates an ndarray from the list and access\
    \ the arrays’ shape and data type.\n\n```\n# create array\nfrom numpy import array\n\
    # create array\nl = [1.0, 2.0, 3.0]\na = array(l)\n# display array\nprint(a)\n\
    # display array shape\nprint(a.shape)\n# display array data type\nprint(a.dtype)\n\
    ```\n\nListing 4.1: Example of creating an array with the array() function.\n\n\
    Running the example prints the contents of the ndarray, the shape, which is a\
    \ one-dimensional array with 3 elements, and the data type, which is a 64-bit\
    \ floating point.\n\n```\n[ 1. 2. 3.]\n(3,)\nfloat64\n```\n\nListing 4.2: Sample\
    \ output of creating an array with the array() function.\n\n### 4.3 Functions\
    \ to Create Arrays\n\nThere are more convenience functions for creating fixed-sized\
    \ arrays that you may encounter or be required to use. Let’s look at just a few.\n\
    \n### 4.3.1 Empty\n\nThe empty() function will create a new array of the specified\
    \ shape. The argument to the function is an array or tuple that specifies the\
    \ length of each dimension of the array to create. The values or content of the\
    \ created array will be random and will need to be assigned before use. The example\
    \ below creates an empty 3 × 3 two-dimensional array.\n\n```\n# create empty array\n\
    from numpy import empty\na = empty([3,3])\nprint(a)\n```\n\nListing 4.3: Example\
    \ of creating an array with the empty() function.\n\nRunning the example prints\
    \ the content of the empty array. Your specific array contents will vary.\n\n\
    ```\n[[ 0.0000000e+000 0.0000000e+000 2.20802703e-314]\n [ 2.20803350e-314 2.20803353e-314\
    \ 2.20803356e-314]\n [ 2.20803359e-314 2.20803362e-314 2.20803366e-314]]\n```\n\
    \nListing 4.4: Sample output of creating an array with the empty() function.\n"
  mdcn: "\n\n对未见数据。在许多涉及系数的方法中，例如回归方法和人工神经网络，更简单的模型通常表现为具有较小系数值的模型。一种常用于鼓励模型在拟合数据时最小化系数大小的技术称为正则化。常见的实现包括L^2和L^1形式的正则化。这两种形式的正则化实际上是系数作为向量的大小或长度的度量，并直接从线性代数中借用，称为向量范数。\n\
    \n## 3.7 主成分分析\n\n通常，一个数据集有许多列，也许有几十、几百、几千或更多。对具有许多特征的数据进行建模具有挑战性，并且由包含不相关特征的数据构建的模型通常不如由最相关数据训练的模型有效。很难知道数据的哪些特征是相关的，哪些不是。自动减少数据集列数的方法称为降维，也许最流行的方法称为主成分分析或简称PCA。这种方法在机器学习中用于创建高维数据的投影，用于可视化和训练模型。PCA方法的核心是来自线性代数的矩阵分解方法。可以使用特征值分解，更健壮的实现可能使用奇异值分解或SVD。\n\
    \n## 3.8 奇异值分解\n\n另一种流行的降维方法是奇异值分解方法或简称SVD。如前所述，正如方法名称所暗示的，它是来自线性代数领域的矩阵分解方法。它在线性代数中有广泛用途，可以直接用于特征选择、可视化、噪声降低等应用。下面我们将看到在机器学习中使用SVD的另外两个案例。\n\
    \n## 3.9 隐语义分析\n\n在处理文本数据的机器学习子领域（称为自然语言处理）中，通常将文档表示为词频的大型矩阵。例如，矩阵的列可能是词汇表中的已知单词，行可能是句子、段落、页面或文档文本，矩阵中的单元格标记为单词出现的次数或频率。这是文本的稀疏矩阵表示。奇异值分解等矩阵分解方法可以应用于这个稀疏矩阵，其效果是将表示提炼为其最相关的本质。以这种方式处理的文档更容易比较、查询，并作为监督机器学习模型的基础。这种数据准备形式称为隐语义分析或简称LSA，也称为隐语义索引或LSI。\n\
    \n## 3.10 推荐系统\n\n涉及产品推荐的预测建模问题称为推荐系统，是机器学习的一个子领域。示例包括基于之前购买以及与你类似的客户在Amazon上的购买推荐图书，以及基于你的观看历史和与你类似的订阅者在Netflix上的观看历史推荐电影和电视节目。推荐系统的开发主要涉及线性代数方法。一个简单的例子是使用欧几里得距离或点积等距离度量计算稀疏客户行为向量之间的相似度。奇异值分解等矩阵分解方法在推荐系统中被广泛使用，以将项目和用户数据提炼为其本质，用于查询、搜索和比较。\n\
    \n## 3.11 深度学习\n\n人工神经网络是非线性机器学习算法，受大脑信息处理元素的启发，并已被证明在一系列问题上有效，不仅限于预测建模。深度学习是人工神经网络的近期复兴使用，采用更新的方法和更快的硬件，允许在非常大的数据集上开发和训练更大、更深（更多层）的网络。深度学习方法在一系列具有挑战性的问题上常规地实现最先进的结果，例如机器翻译、图片字幕、语音识别等。\n\
    \n在其核心，神经网络的执行涉及线性代数数据结构相乘和相加。扩展到多维时，深度学习方法处理输入和系数的向量、矩阵甚至张量，其中张量是具有超过两个维度的矩阵。线性代数对于通过矩阵表示法描述深度学习方法到实现深度学习方法（例如Google的TensorFlow\
    \ Python库，其名称中包含\"tensor\"一词）都是核心。\n\n## 3.12 总结\n\n在本章中，你发现了10个你可能熟悉的机器学习常见示例，这些示例使用并需要线性代数。具体来说，你学习了：\n\
    \n- 在处理表格数据集和图像等数据时使用线性代数结构。\n- 在处理数据准备（如独热编码和降维）时使用线性代数概念。\n- 在深度学习、自然语言处理和推荐系统等子领域中根深蒂固地使用线性代数表示法和方法。\n\
    \n## 3.12.1 接下来\n\n这是第一部分的结束，在下一部分中，你将发现如何在Python中使用NumPy操作数据数组。\n\n## 第三部分\n\n\
    ### NumPy\n\n## 第4章\n\n### NumPy数组简介\n\n数组是机器学习中使用的主要数据结构。在Python中，NumPy库中的数组（称为N维数组或`ndarray`）被用作表示数据的主要数据结构。在本教程中，你将发现NumPy中的N维数组，用于在Python中表示和操作数值数据。完成本教程后，你将知道：\n\
    \n- 什么是`ndarray`以及如何在Python中创建和检查数组。\n- 创建新空数组和带默认值数组的关键函数。\n- 如何合并现有数组以创建新数组。\n\
    \n让我们开始吧。\n\n### 4.1 教程概览\n\n本教程分为3个部分，它们是：\n\n- 1. NumPy N维数组\n- 2. 创建数组的函数\n\
    - 3. 合并数组\n\n### 4.2 NumPy N维数组\n\nNumPy是一个可用于科学和数值应用的Python库，是执行线性代数操作的工具。NumPy中的主要数据结构是`ndarray`，它是N-dimensional\
    \ array的简称。使用NumPy时，`ndarray`中的数据简称为数组。它是内存中的固定大小数组，包含相同类型的数据，例如整数或浮点值。\n\n数组支持的数据类型可以通过数组上的`dtype`属性访问。数组的维度可以通过`shape`属性访问，该属性返回一个描述每个维度长度的元组。还有许多其他属性。从数据或简单的Python数据结构（如列表）创建数组的简单方法是使用array()函数。下面的示例创建一个包含3个浮点值的Python列表，然后从列表创建一个ndarray并访问数组的shape和数据类型。\n\
    \n```\n# create array\nfrom numpy import array\n# create array\nl = [1.0, 2.0,\
    \ 3.0]\na = array(l)\n# display array\nprint(a)\n# display array shape\nprint(a.shape)\n\
    # display array data type\nprint(a.dtype)\n```\n\n清单4.1: 使用array()函数创建数组的示例。\n\
    \n运行示例将打印ndarray的内容、shape（即具有3个元素的一维数组）以及数据类型（即64位浮点数）。\n\n```\n[ 1. 2. 3.]\n\
    (3,)\nfloat64\n```\n\n清单4.2: 使用array()函数创建数组的示例输出。\n\n### 4.3 创建数组的函数\n\n有更多便捷函数用于创建固定大小的数组，你可能会遇到或需要使用它们。让我们看看其中几个。\n\
    \n### 4.3.1 空数组\n\nempty()函数将创建指定形状的新数组。传递给该函数的参数是一个数组或元组，用于指定要创建的数组的每个维度的长度。创建的数组的值或内容将是随机的，并在使用前需要赋值。下面的示例创建一个空的3\
    \ × 3二维数组。\n\n```\n# create empty array\nfrom numpy import empty\na = empty([3,3])\n\
    print(a)\n```\n\n清单4.3: 使用empty()函数创建数组的示例。\n\n运行示例将打印空数组的内容。你的特定数组内容会有所不同。\n\n\
    ```\n[[ 0.0000000e+000 0.0000000e+000 2.20802703e-314]\n [ 2.20803350e-314 2.20803353e-314\
