    # 5.3 Array Indexing


    Once your data is represented using a NumPy array, you can access it using indexing.
    Let''s look at some examples of accessing data via indexing.


    # 5.3.1 One-Dimensional Indexing


    Generally, indexing works just like you would expect from your experience with
    other programming languages, like Java, C#, and C++. For example, you can access
    elements using the bracket operator [] specifying the zero-offset index for the
    value to retrieve.


    ```

    # index a one-dimensional array

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    # index data

    print(data[0])

    print(data[4])

    ```


    Listing 5.5: Example of indexing a one-dimensional array.


    Running the example prints the first and last values in the array.


    ```

    11

    55

    ```


    Listing 5.6: Sample output from indexing a one-dimensional array.


    Specifying integers too large for the bound of the array will cause an error.


    ```

    # index array out of bounds

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    # index data

    print(data[5])

    ```


    Listing 5.7: Example of an error when indexing a one-dimensional array.


    Running the example prints the following error:


    ```

    IndexError: index 5 is out of bounds for axis 0 with size 5

    ```


    Listing 5.8: Sample error output from indexing a one-dimensional array.


    One key difference is that you can use negative indexes to retrieve values offset
    from the end of the array. For example, the index -1 refers to the last item in
    the array. The index -2 returns the second last item all the way back to -5 for
    the first item in the current example.


    ```

    # negative array indexing

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    # index data

    print(data[-1])

    print(data[-5])

    ```


    Listing 5.9: Example of negative indexing a one-dimensional array.'
