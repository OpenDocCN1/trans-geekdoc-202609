    \ uppercase Q.\n\nMultiplication by an orthogonal matrix preserves lengths.\n\n\
    > — Page 277, No Bullshit Guide To Linear Algebra, 2017.\n\nThe orthogonal matrix\
    \ is defined formally as follows:\n\n$Q^T \\cdot Q = Q \\cdot Q^T = I$\n\nWhere\
    \ Q is the orthogonal matrix, $Q^T$ indicates the transpose of Q, and I is the\
    \ identity matrix. A matrix is orthogonal if its transpose is equal to its inverse.\n\
    \n$Q^T = Q^{-1}$ (10.15)\n\nAnother equivalence for an orthogonal matrix is if\
