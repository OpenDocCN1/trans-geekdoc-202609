    - https://en.wikipedia.org/wiki/Matrix_(mathematics)

    - Matrix decomposition.

    - https://en.wikipedia.org/wiki/Matrix_decomposition

    - List of linear algebra topics.

    - https://en.wikipedia.org/wiki/List_of_linear_algebra_topics


    ### A.2 Linear Algebra Textbooks


    I strongly recommend getting a good textbook on the topic of linear algebra and
    using it as a reference. The benefit of a good textbook is that the explanations
    of the various operations you require will be consistent (or should be). The downside
    of textbooks is that they can be very expensive. A good textbook is often easy
    to spot because it will be the basis for a range of undergraduate or postgraduate
    courses at top universities. Some introductory textbooks on linear algebra I recommend
    include:


    - *Introduction to Linear Algebra*, Fifth Edition, Gilbert Strang, 2016.

    - http://amzn.to/2j2J0g4

    - *Linear Algebra Done Right*, Third Edition, 2015.

    - http://amzn.to/2BGuEqI

    - *No Bullshit Guide To Linear Algebra*, Ivan Savov, 2017.

    - http://amzn.to/2k76D4C


    Some more advanced textbooks I recommend include:


    - *Matrix Computations*, Gene Golub and Charles Van Loan, 2012.

    - http://amzn.to/2B9xnLD

    - *Numerical Linear Algebra*, Lloyd Trefethen and David Bau 1997.

    - http://amzn.to/2kjEF4S


    I''d also recommend a good textbook on multivariate statistics, which is the intersection
    of linear algebra, and numerical statistical methods. Some good introductory textbooks
    include:


    - *Applied Multivariate Statistical Analysis*, Richard Johnson and Dean Wichern,
    2012.

    - http://amzn.to/2AUcEc5

    - *Applied Multivariate Statistical Analysis*, Wolfgang Karl Hardle and Leopold
    Simar, 2015.

    - http://amzn.to/2AWIViz


    There are also many good free online books written by academics. See the end of
    the *Linear Algebra* page on Wikipedia for an extensive (and impressive) reading
    list.


    ### A.3 Linear Algebra University Courses


    University courses on linear algebra are useful in that they layout the topics
    that an undergraduate student is expected to know. As a machine learning practitioner,
    it is more than you need, but does provide context for the elements that you do
    need to know. Many university courses now provide PDF versions of lecture slides,
    notes, and readings. Some even provide pre-recorded video lectures, which can
    be invaluable. I would encourage you to use university course material surgically
    by dipping into courses to get deeper knowledge on specific topics. I think working
    through a given course end-to-end is too time consuming and covers too much for
    the average machine learning practitioner. Some recommended courses from top US
    schools include:


    - Linear Algebra at MIT by Gilbert Strang.

    - https://ocw.mit.edu/courses/mathematics/18-06-linear-algebra-spring-2010/index.htm

    - The Matrix in Computer Science at Brown by Philip Klein.

    - http://cs.brown.edu/courses/cs053/current/index.htm

    - Computational Linear Algebra for Coders at University of San Francisco by Rachel
    Thomas.

    - https://github.com/fastai/numerical-linear-algebra/


    ### A.4 Linear Algebra Online Courses


    Online courses are different from university courses. They are designed for distance
    education and often are less complete or less rigorous than a full undergraduate
    course. This is a good feature for machine learning practitioners looking to get
    up to speed fast on the topic. If the course is short, it may be worth taking
    it through end-to-end. Generally, and like university courses, I would recommend
    being surgical with the topics and dip in as needed. Some online courses I recommend
    include:


    - **Linear Algebra on Khan Academy.**

    - https://www.khanacademy.org/math/linear-algebra


    - **Linear Algebra: Foundations to Frontiers on edX.**

    - https://www.edx.org/course/laff-linear-algebra-foundations-to-frontiers


    ### A.5 NumPy Resources


    You may need help with NumPy when implementing your linear algebra in Python.
    The NumPy API documentation is excellent, below are a few resources that you can
    use to learn more about how NumPy works or how to use specific NumPy functions.


    - **NumPy Reference.**

    - https://docs.scipy.org/doc/numpy/reference/


    - **NumPy Array Creation Routines.**

    - https://docs.scipy.org/doc/numpy/reference/routines.array-creation.html


    - **NumPy Array Manipulation Routines.**

    - https://docs.scipy.org/doc/numpy/reference/routines.array-manipulation.html


    - **NumPy Linear Algebra.**

    - https://docs.scipy.org/doc/numpy/reference/routines.linalg.html


    - **SciPy Linear Algebra.**

    - https://docs.scipy.org/doc/scipy/reference/linalg.html


    If you are looking for a broader understanding on NumPy and SciPy usage, the below
    books provide a good starting reference:


    - **_Python for Data Analysis_, 2017.**

    - http://amzn.to/2B1sfXi


    - **_Elegant SciPy_, 2017.**

    - http://amzn.to/2yujXnT


    - **_Guide to NumPy_, 2015.**

    - http://amzn.to/2j3kEzd


    ### A.6 Ask Questions About Linear Algebra


    There are a lot of places that you can ask questions about linear algebra online
    given the current abundance of question-and-answer platforms. Below is a list
    of the top places I recommend posting a question. Remember to search for your
    question before posting in case it has been asked and answered before.


    - Linear Algebra tag on the Mathematics Stack Exchange.

    - https://math.stackexchange.com/?tags=linear-algebra

    - Linear Algebra tag on Cross Validated.

    - https://stats.stackexchange.com/questions/tagged/linear-algebra

    - Linear Algebra tag on Stack Overflow.

    - https://stackoverflow.com/questions/tagged/linear-algebra

    - Linear Algebra on Quora.

    - https://www.quora.com/topic/Linear-Algebra

    - Math Subreddit.

    - https://www.reddit.com/r/math/


    ### A.7 How to Ask Questions


    Knowing where to get help is the first step, but you need to know how to get the
    most out of these resources. Below are some tips that you can use:


    - Boil your question down to the simplest form. E.g. not something broad like
    my model does not work or how does x work.

    - Search for answers before asking questions.

    - Provide complete code and error messages.

    - Boil your code down to the smallest possible working example that demonstrates
    the issue.


    ### A.8 Contact the Author


    You are not alone. If you ever have any questions about deep learning, natural
    language processing, or this book, please contact me directly. I will do my best
    to help.


    Jason Brownlee

    Jason@MachineLearningMastery.com


    ## Appendix B


    ### How to Setup a Workstation for Python


    It can be difficult to install a Python machine learning environment on some platforms.
    Python itself must be installed first and then there are many packages to install,
    and it can be confusing for beginners. In this tutorial, you will discover how
    to setup a Python machine learning development environment using Anaconda.


    After completing this tutorial, you will have a working Python environment to
    begin learning, practicing, and developing machine learning software. These instructions
    are suitable for Windows, Mac OS X, and Linux platforms. I will demonstrate them
    on OS X, so you may see some mac dialogs and file extensions.


    ### B.1 Overview


    In this tutorial, we will cover the following steps:


    - 1. Download Anaconda

    - 2. Install Anaconda

    - 3. Start and Update Anaconda


    Note: The specific versions may differ as the software and libraries are updated
    frequently.


    ### B.2 Download Anaconda


    In this step, we will download the Anaconda Python package for your platform.
    Anaconda is a free and easy-to-use environment for scientific Python.


    - 1. Visit the Anaconda homepage.

    - https://www.continuum.io/

    - 2. Click Anaconda from the menu and click Download to go to the download page.

    - https://www.continuum.io/downloads

