    Forms, 2009. http://amzn.to/2qarp8L


    +   The Language and Grammar of Mathematics, Timothy Gowers. http://assets.press.princeton.edu/chapters/gowers/gowers_I_2.pdf


    +   Understanding Mathematics, a guide, Peter Alfeld. http://www.math.utah.edu/~pa/math.html


    # D.10 Summary


    In this tutorial, you discovered the basics of mathematical notation that you
    may come across when reading descriptions of techniques in machine learning. Specifically,
    you learned:


    +   Notation for arithmetic including variations of multiplication, exponents,
    roots and logarithms.


    +   Notation for sequences and sets including indexing, summation and set membership.


    +   5 Techniques you can use to get help if you are struggling with mathematical
    notation.'
