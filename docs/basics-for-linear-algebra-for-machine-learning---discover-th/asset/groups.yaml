    ## 1.7 总结


    在本教程中，您从机器学习的角度了解了线性代数的温和介绍。具体来说，您学到了：


    - 线性代数是数据的数学。

    - 线性代数对统计学领域产生了显著影响。

    - 线性代数是许多实用数学工具的基础，例如傅里叶级数和计算机图形学。


