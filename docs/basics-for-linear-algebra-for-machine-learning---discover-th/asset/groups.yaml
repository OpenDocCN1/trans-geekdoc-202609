    \n## 19.7 通过 SVD 和伪逆求解\n\n奇异值分解（简称 SVD）是一种类似于 QR 分解的矩阵分解方法。\n\n```\nX = U \\cdot\
    \ \\Sigma \\cdot V^T\n```\n\n其中 A 是我们希望分解的实 n×m 矩阵，U 是 m×m 矩阵，\\Sigma（通常用大写希腊字母\
    \ Sigma 表示）是 m×n 对角矩阵，V^T 是 n×n 矩阵的转置。与 QR 分解不同，所有矩阵都有奇异值分解。作为求解线性回归线性方程组的基础，SVD\
    \ 更稳定且是首选方法。分解后，可以通过计算输入矩阵 X 的伪逆并将其与输出向量 y 相乘来求得系数。\n\n```\nb = X^+ \\cdot y\n\
    ```\n\n其中伪逆 X^+ 的计算方法如下：\n\n```\nX^+ = U \\cdot D^+ \\cdot V^T\n```\n\n其中 X+ 是\
    \ X 的伪逆，+ 为上标，D+ 是对角矩阵 Σ 的伪逆，V^T 是 V 的转置。NumPy 提供了 pinv() 函数来直接计算伪逆。完整示例如下。\n\n\
    ```\n```python\n# SVD solution via pseudoinverse to linear least squares\nfrom\
    \ numpy import array\nfrom numpy.linalg import pinv\nfrom matplotlib import pyplot\n\
    # define dataset\ndata = array([\n    [0.05, 0.12],\n    [0.18, 0.22],\n    [0.31,\
    \ 0.35],\n    [0.42, 0.38],\n    [0.5, 0.49]])\n# split into inputs and outputs\n\
    X, y = data[:,0], data[:,1]\nX = X.reshape((len(X), 1))\n# calculate coefficients\n\
    b = pinv(X).dot(y)\nprint(b)\n# predict using coefficients\nyhat = X.dot(b)\n\
    # plot data and predictions\npyplot.scatter(X, y)\npyplot.plot(X, yhat, color='red')\n\
