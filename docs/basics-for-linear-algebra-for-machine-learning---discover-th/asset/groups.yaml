    ## 附录 D


    ### 基本数学符号


    阅读机器学习方法的描述时，你无法避免数学符号。通常，方程中的一个术语或一个符号片段就足以让你对整个流程的理解完全偏离。这可能会非常令人沮丧，尤其是对于来自开发领域的机器学习初学者。如果你了解几个基本的数学符号领域，以及一些在论文和书籍中处理机器学习方法描述的技巧，你可以取得很大进步。在本教程中，你将发现阅读机器学习技术描述时可能遇到的数学符号基础。完成本教程后，你将了解：


    - 算术符号，包括乘法、指数、根和对数的变体。

    - 序列和集合符号，包括索引、求和和集合成员关系。

    - 如果你在数学符号方面遇到困难，可以使用的 5 种获取帮助的技巧。


    让我们开始吧。


    ## D.1 教程概述


    本教程分为 7 部分，分别是：


    - 1. 数学符号带来的挫败感

    - 2. 算术符号

    - 3. 希腊字母

    - 4. 序列符号

    - 5. 集合符号

    - 6. 其他符号

    - 7. 获取更多帮助的技巧


    ## D.2 数学符号带来的挫败感


    阅读机器学习算法时，你会遇到数学符号。例如，符号可能用于：


    - 描述算法。

    - 描述数据准备。

    - 描述结果。

    - 描述测试框架。

    - 描述影响。


    这些描述可能出现在研究论文、教科书、博客文章及其他地方。通常术语定义明确，但也存在你可能不熟悉的数学符号规范。只需一个你不理解的术语或一个方程，你对整个方法的理解就会丧失。我自己多次遭受这个问题，而且非常令人沮丧！在本教程中，我们将回顾一些基本数学符号，这些符号将帮助你阅读机器学习方法的描述。


    ## D.3 算术符号


    在本节中，我们将介绍一些不太明显的基本算术符号，以及你可能自上学以来就遗忘的几个概念。


    ### D.3.1 简单算术


    基本算术的符号与你书写时一样。例如：


    - 加法：1 + 1 = 2

    - 减法：2 - 1 = 1

    - 乘法：2 x 2 = 4

    - 除法：2/2 = 1


    大多数数学运算都有一个执行逆运算的姐妹运算，例如减法是加法的逆运算，除法是乘法的逆运算。


    ### D.3.2 代数


    我们经常希望以抽象的方式描述运算，以将其与特定数据或特定实现分开。出于这个原因，我们大量使用代数，即大写和/或小写字母或单词来表示数学符号中的术语或概念。使用希腊字母中的字母也很常见。数学的每个子领域可能都有保留字母，即始终表示相同含义的术语或字母。尽管如此，代数术语应作为描述的一部分定义，如果没有定义，那可能只是描述不佳，而不是你的错。


    ### D.3.3 乘法符号


    乘法是一种常见的符号，有几种简写形式。通常，一个小“x”（×）或星号“*”用于表示乘法：


    $c = a \times b$ (D.1)


    或


    $c = a * b$ (D.2)


    你可能会看到点符号，例如：


    $c = a \cdot b$ (D.3)


    或者，你可能会看到没有运算符，之前定义的术语之间也没有空格分隔，例如：


    $c = ab$ (D.4)


    这又是同一件事。


    ### D.3.4 指数和平方根


    指数是一个数的幂。符号写作原始数或底数，第二个数或指数显示为上标，例如：


    $2^3$ (D.5)


    这将被计算为 2 乘以自身 3 次，即立方：


    $2 \times 2 \times 2 = 8$ (D.6)


    一个数的二次幂称为其平方：


    $2^2 = 2 \times 2 = 4$ (D.7)


    一个数的平方可以通过计算平方根来反演。这使用带有上方勾号的数字符号表示 $\sqrt{x}$。


    $\sqrt{4} = 2$ (D.8)


    这里，我们知道结果和指数，并希望找到底数。事实上，根运算可以用来反演任何指数，只是默认的平方根假设指数为 2，由平方根符号前的下标 2 表示。例如，我们可以通过取立方根来反演一个数的立方：


    $2^3 = 8$ (D.9)


    $\sqrt[3]{6} = 2$ (D.10)


    ### D.3.5 对数和 e


    当我们将 10 提升到整数指数时，我们通常称其为数量级。


    $10^2 = 10 \times 10$ (D.11)


    反转此操作的另一种方法是计算结果 100 的对数，假设底数为 10，在符号中写作 `log10()`。


    $log10(100) = 2$ (D.12)


    这里，我们知道结果和底数，并希望找到指数。这使我们可以非常轻松地在数量级之间上下移动。假设底数为 2 的对数也常用，鉴于计算机中使用的二进制算术。例如：


    $2^6 = 64$ (D.13)


    $log2(64) = 6$ (D.14)


    另一种流行的对数是假设称为 $e$ 的自然底数。$e$ 是保留的，是一个特殊的数字或常数，称为欧拉数（发音为 *oy-ler*），指的是具有几乎无限精度的值。


    $e = 2.71828 \cdots$ (D.15)


    将 $e$ 提升到幂称为自然指数函数：


    $e^2 = 7.38905 \cdots$ (D.16)


    它可以使用自然对数来反转，记作 `ln()`：


    $ln(7.38905 \cdots) = 2$ (D.17)


    不深入细节，自然指数和自然对数在整个数学中都很有用，可以抽象地描述某些系统的连续增长，例如呈指数增长的系统，如复利。


    ## D.4 希腊字母


    希腊字母在数学符号中用于变量、常数、函数等。例如，在统计学中，我们使用小写希腊字母 mu ($\mu$) 来表示均值，使用小写希腊字母 sigma ($\sigma$)
    来表示标准差。在线性回归中，我们使用小写字母 beta ($\beta$) 来表示系数。等等。了解所有大写和小写希腊字母及其发音很有用。当我是研究生时，我打印了希腊字母表并贴在电脑显示器上，以便我可以记忆它。一个有用的技巧！下面是完整的希腊字母表。


    | 名称 | TeX | HTML | 名称 | TeX | HTML | 名称 | TeX | HTML | 名称 | TeX | HTML | 名称 |
    TeX | HTML |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Alpha | A α | A α | Digamma | Ϝ ϝ | Ϝ ϝ | Kappa | Κ κ | Κ κ | Omicron | Ο ο
    | Ο ο | Upsilon | Υ υ | Υ υ |

    | Beta | Β β | Β β | Zeta | Ζ ζ | Ζ ζ | Lambda | Λ λ | Λ λ | Pi | Π π | Π π |
    Phi | Φ φ | Φ φ |

    | Gamma | Γ γ | Γ γ | Eta | Η η | Η η | Mu | Μ μ | Μ μ | Rho | Ρ ρ | Ρ ρ | Chi
    | Χ χ | Χ χ |

    | Delta | Δ δ | Δ δ | Theta | Θ θ | Θ θ | Nu | Ν ν | Ν ν | Sigma | Σ σ | Σ σ |
    Psi | Ψ ψ | Ψ ψ |

    | Epsilon | Ε ε | Ε ε | Iota | Ι ι | Ι ι | Xi | Ξ ξ | Ξ ξ | Tau | Τ τ | Τ τ |
    Omega | Ω ω | Ω ω |


    图 D.1：希腊字母表，摘自 Wikipedia。


    标题为 *数学、科学和工程中使用的希腊字母*<sup>1</sup> 的 Wikipedia 页面也是一份有用的指南，因为它列出了每个希腊字母在数学和科学不同子领域中的常见用法。


    ## D.5 序列符号


    机器学习符号通常描述对序列的操作。序列可以是数据数组或术语列表。


    ### D.5.1 索引


    读取序列符号的关键是序列中元素的索引符号。通常，符号将指定序列的开始和结束，例如 1 到 _n_，其中 _n_ 将是序列的范围或长度。序列中的项目由变量（如
    _i_、_j_、_k_）作为下标索引。这就像数组符号一样。例如，_a<sub>i</sub>_ 是序列 _a_ 的 _i<sup>th</sup>_ 元素。如果序列是二维的，可以使用两个索引，例如：_b<sub>i,j</sub>_
    是序列 _b_ 的 (_i,j_)<sup>_th_</sup> 元素。


    ### D.5.2 序列运算


    可以对序列执行数学运算。两种运算在序列上执行得非常频繁，以至于它们有自己的简写形式，即求和和乘法。


    #### 序列求和


    序列上的求和用大写希腊字母 sigma (\(\Sigma\)) 表示。它在 sigma 下方指定变量和序列求和的开始（例如 _i_ = 1），在 sigma
    上方指定求和结束的索引（例如 _n_）。


    ```

    \sum_{i=1}^n a_i

    ```


    这是序列 a 从元素 1 到元素 _n_ 的求和。


    <sup>1</sup>https://en.wikipedia.org/wiki/Greek_letters_used_in_mathematics,_science,_and_engineering


    '
