    # define one-dimensional array\nb = array([1, 2])\nprint(b.shape)\n# attempt broadcast\n\
    C = A + b\nprint(C)\n```\n\n清单 6.7：NumPy 中广播错误的示例。\n\n运行示例首先打印数组的形状，然后在尝试广播时引发错误，正如我们所期望的那样。\n\
    \n```\n(2, 3)\n(2,)\nValueError: operands could not be broadcast together with\
    \ shapes (2,3) (2,)\n```\n\n清单 6.8：广播错误的示例输出。\n\n"
