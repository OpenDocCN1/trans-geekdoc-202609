    - **_用 Python 进行数据分析_, 2017。**

    - http://amzn.to/2B1sfXi


    - **_优雅的 SciPy_, 2017。**

    - http://amzn.to/2yujXnT


    - **_NumPy 指南_, 2015。**

    - http://amzn.to/2j3kEzd


    ### A.6 关于线性代数提问


    鉴于当前问答平台众多，网上有很多地方可以提出关于线性代数的问题。以下是我推荐发布问题的顶级场所列表。请记住，在发布之前先搜索您的问题，以防它之前已经被问过并回答过。


    - 数学 Stack Exchange 上的线性代数标签。

