    ### 7.5 Vector Dot Product


    We can calculate the sum of the multiplied elements of two vectors of the same
    length to give a scalar. This is called the dot product, named because of the
    dot operator used when describing the operation.


    The dot product is the key tool for calculating vector projections, vector decompositions,
    and determining orthogonality. The name dot product comes from the symbol used
    to denote it.


    > — Page 110, No Bullshit Guide To Linear Algebra, 2017.


    $c = a \cdot b$ (7.16)


    The operation can be used in machine learning to calculate the weighted sum of
    a vector. The dot product is calculated as follows:


    $c = (a_1 \times b_1 + a_2 \times b_2 + a_3 \times b_3)$ (7.17)


    or


    $c = (a_1b_1 + a_2b_2 + a_3b_3)$ (7.18)


    We can calculate the dot product between two vectors in Python using the dot()
    function on a NumPy array.


    ```python

