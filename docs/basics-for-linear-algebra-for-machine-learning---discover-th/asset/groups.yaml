    5. 矩阵-向量乘法\n6. 矩阵-标量乘法\n\n## 9.2 什么是矩阵\n\n矩阵是一个由一个或多个列和一个或多个行组成的标量二维数组。\n\n矩阵是一个数字的二维数组（表格）。\n\
    \n> ——第 115 页，《线性代数无废话指南》，2017 年。\n\n矩阵的记法通常是大写字母，例如 $A$，条目通过行 $(i)$ 和列 $(j)$\
    \ 的二维下标引用，例如 $a_{i,j}$。例如，我们可以定义一个 3 行 2 列的矩阵：\n\n$A = ((a_{1,1}, a_{1,2}), (a_{2,1},\
    \ a_{2,2}), (a_{3,1}, a_{3,2}))$\n\n更常见的是使用水平记法来定义矩阵。\n\n$A = \\begin{pmatrix}\
    \ a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\\\ a_{3,1} & a_{3,2} \\end{pmatrix}$\n\
    \n在机器学习中，您可能遇到矩阵的第一个地方是模型训练数据，它由许多行和列组成，通常用大写字母 $X$ 表示。用于帮助理解向量及其某些操作的几何类比不适用于矩阵。此外，向量本身可以被视为具有一列和多行的矩阵。矩阵的维数通常表示为\
    \ $m$ 和 $n$ 或 $m \\times n$，分别表示行数和列数。既然我们知道了什么是矩阵，让我们来看看如何在 Python 中定义一个矩阵。\n\
    \n## 9.3 定义矩阵\n\n我们可以在 Python 中使用二维 NumPy 数组来表示矩阵。给定一个列表的列表，可以构造一个 NumPy 数组。例如，下面是一个\
    \ 2 行 3 列的矩阵。\n\n```\n# create matrix\nfrom numpy import array\nA = array([[1,\
    \ 2, 3], [4, 5, 6]])\nprint(A)\n```\n\n清单 9.1：创建矩阵的示例。\n\n运行示例将打印创建的矩阵，显示预期的结构。\n\
    \n```\n[[1 2 3]\n [4 5 6]]\n```\n\n清单 9.2：创建矩阵的示例输出。\n\n## 9.4 矩阵运算\n\n本节将演示简单的矩阵-矩阵运算，其中所有操作都在两个大小相等的矩阵之间逐元素执行，以生成大小相同的新矩阵。\n\
    \n### 9.4.1 矩阵加法\n\n相同维度的两个矩阵可以相加以创建一个新的第三个矩阵。\n\nC = A + B\n\n结果矩阵中的标量元素计算为所加矩阵中元素的相加。\n\
    \nC = \\begin{pmatrix} a_{1,1} + b_{1,1} & a_{1,2} + b_{1,2} \\\\ a_{2,1} + b_{2,1}\
    \ & a_{2,2} + b_{2,2} \\\\ a_{3,1} + b_{3,1} & a_{3,2} + b_{3,2} \\end{pmatrix}\n\
    \n或者，换一种说法：\n\nC[0, 0] = A[0, 0] + B[0, 0]\nC[1, 0] = A[1, 0] + B[1, 0]\nC[2,\
    \ 0] = A[2, 0] + B[2, 0]\nC[0, 1] = A[0, 1] + B[0, 1]\nC[1, 1] = A[1, 1] + B[1,\
    \ 1]\nC[2, 1] = A[2, 1] + B[2, 1]\n\n我们可以直接在两个 NumPy 数组上使用加号运算符在 Python 中实现此功能。\n\
    \n```\n# matrix addition\nfrom numpy import array\n# define first matrix\nA =\
    \ array([\n    [1, 2, 3],\n    [4, 5, 6]])\nprint(A)\n# define second matrix\n\
    B = array([\n    [1, 2, 3],\n    [4, 5, 6]])\nprint(B)\n# add matrices\nC = A\
    \ + B\nprint(C)\n```\n\n清单 9.3：矩阵加法示例。\n\n示例首先定义两个 2 x 3 矩阵，然后将它们相加。运行示例首先打印两个原始矩阵，然后打印将它们相加的结果。\n\
    \n```\n[[1 2 3]\n [4 5 6]]\n\n[[1 2 3]\n [4 5 6]]\n\n[[ 2  4  6]\n [ 8 10 12]]\n\
