  mdcn: "\n\n### 12.3.2 时间复杂度\n\n假设一个非常大的稀疏矩阵可以装入内存，我们希望对该矩阵执行操作。简单地说，如果矩阵中大部分是零值，即没有数据，那么对该矩阵执行操作可能需要很长时间，而大部分计算都涉及将零值相加或相乘。\n\
    \n对这类问题使用通用线性代数方法是浪费的，因为求解方程组或求逆矩阵所用的大部分 O(N³) 算术运算都涉及零操作数。\n\n> — 第 75 页，《科学计算的艺术：数值方法》，第三版，2007。\n\
    \n这是矩阵操作时间复杂度随矩阵大小增加而增加的问题。当我们考虑到即使是简单的机器学习方法也可能需要对每一行、每一列甚至整个矩阵进行许多操作时，这个问题会更加严重，导致执行时间大大延长。\n\
    \n## 12.4 机器学习中的稀疏矩阵\n\n稀疏矩阵在应用机器学习中非常常见。在本节中，我们将查看一些常见示例，以激励您意识到稀疏性问题。\n\n###\
    \ 12.4.1 数据\n\n稀疏矩阵出现在某些特定类型的数据中，最显著的是记录活动发生情况或次数的观察数据。三个示例包括：\n\n- 用户是否在电影目录中观看过电影。\n\
    - 用户是否在产品目录中购买过产品。\n- 歌曲目录中歌曲的播放次数。\n\n### 12.4.2 数据准备\n\n稀疏矩阵出现在数据准备中使用的编码方案中。三个常见示例包括：\n\
    \n- 独热编码，用于将类别数据表示为稀疏二进制向量。\n- 计数编码，用于表示文档中词汇表里单词的频率\n- TF-IDF 编码，用于表示词汇表中归一化的单词频率得分。\n\
    \n### 12.4.3 研究领域\n\n机器学习中的一些研究领域必须开发专门方法来直接解决稀疏性问题，因为输入数据几乎总是稀疏的。三个示例包括：\n\n\
    - 用于处理文本文档的自然语言处理。\n- 用于处理目录中产品使用情况的推荐系统。\n- 用于处理包含大量黑色像素的图像时的计算机视觉。\n\n如果语言模型中有\
    \ 100,000 个单词，则特征向量长度为 100,000，但对于一封简短的电子邮件，几乎所有特征的计数都将为零。\n\n> — 第 22 页，《人工智能：一种现代的方法》，第三版，2009。\n\
    \n## 12.5 使用稀疏矩阵\n\n表示和处理稀疏矩阵的解决方案是使用替代数据结构来表示稀疏数据。可以忽略零值，只需存储或处理稀疏矩阵中的数据或非零值。可以使用多种数据结构来高效构建稀疏矩阵；下面列出了三个常见示例。\n\
    \n- **键字典**。使用字典，其中行和列索引映射到一个值。\n- **列表的列表**。矩阵的每一行存储为一个列表，每个子列表包含列索引和值。\n- **坐标列表**。存储元组列表，每个元组包含行索引、列索引和值。\n\
    \n还有更适合执行高效操作的数据结构；下面列出了两个常用示例。\n\n- **压缩稀疏行**。稀疏矩阵使用三个一维数组表示，分别用于非零值、行范围和列索引。\n\
    - **压缩稀疏列**。与压缩稀疏行方法相同，只是列索引被压缩并在行索引之前先读取。\n\n压缩稀疏行（简称 CSR）常用于在机器学习中表示稀疏矩阵，因为它支持高效的访问和矩阵乘法。\n\
    \n## 12.6 Python 中的稀疏矩阵\n\nSciPy 提供了使用多种数据结构创建稀疏矩阵的工具，以及将稠密矩阵转换为稀疏矩阵的工具。许多在 NumPy\
    \ 数组上操作的线性代数 NumPy 和 SciPy 函数可以透明地在 SciPy 稀疏数组上操作。此外，使用 NumPy 数据结构的机器学习库也可以透明地在\
    \ SciPy 稀疏数组上操作，例如用于通用机器学习的 scikit-learn 和用于深度学习的 Keras。\n\n存储在 NumPy 数组中的稠密矩阵可以通过调用\
    \ `csr_matrix()` 函数使用 CSR 表示转换为稀疏矩阵。在下面的示例中，我们将一个 $3 \\times 6$ 稀疏矩阵定义为稠密数组（例如\
    \ `ndarray`），将其转换为 CSR 稀疏表示，然后通过调用 `todense()` 函数将其转换回稠密数组。\n\n```\n# sparse matrix\n\
    from numpy import array\nfrom scipy.sparse import csr_matrix\n# create dense matrix\n\
    A = array([\n    [1, 0, 0, 1, 0, 0],\n    [0, 0, 2, 0, 0, 1],\n    [0, 0, 0, 2,\
    \ 0, 0]])\nprint(A)\n# convert to sparse matrix (CSR method)\nS = csr_matrix(A)\n\
    print(S)\n# reconstruct dense matrix\nB = S.todense()\nprint(B)\n```\n\n清单 12.1：稠密矩阵和稀疏矩阵之间转换的示例。\n\
    \n运行示例首先打印定义的稠密数组，然后是 CSR 表示，最后是重建的稠密矩阵。\n\n```\n[[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n\
    \ [0 0 0 2 0 0]]\n\n(0, 0) 1\n(0, 3) 1\n(1, 2) 2\n(1, 5) 1\n(2, 3) 2\n\n[[1 0\
    \ 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n```\n\n清单 12.2：稠密矩阵和稀疏矩阵之间转换的示例输出。\n\
    \nNumPy 不提供计算矩阵稀疏性的函数。尽管如此，我们可以通过先求出矩阵的密度再用 1 减去它来轻松计算。NumPy 数组中非零元素的数量可以由 `count_nonzero()`\
    \ 函数给出，数组中的元素总数可以由数组的 size 属性给出。因此，数组稀疏性可以计算为\n\n```\nsparsity = 1.0 - count_nonzero(A)\
    \ / A.size\n```\n\n清单 12.3：手动稀疏性计算示例。\n\n下面的示例演示了如何计算数组的稀疏性。\n\n```\n# sparsity\
    \ calculation\nfrom numpy import array\nfrom numpy import count_nonzero\n# create\
    \ dense matrix\nA = array([\n    [1, 0, 0, 1, 0, 0],\n    [0, 0, 2, 0, 0, 1],\n\
    \    [0, 0, 0, 2, 0, 0]])\nprint(A)\n# calculate sparsity\nsparsity = 1.0 - count_nonzero(A)\
    \ / A.size\nprint(sparsity)\n```\n\n清单 12.4：计算稀疏性的示例。\n\n运行示例首先打印定义的稀疏矩阵，然后是矩阵的稀疏性。\n\
    \n```\n[[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n0.7222222222222222\n```\n\
    \n清单 12.5：计算稀疏性的示例输出。\n\n## 12.7 扩展\n\n本节列出了一些您可能希望探索的扩展教程的想法。\n\n- 开发将稠密数组转换为稀疏数组并计算稀疏性的示例。\n\
