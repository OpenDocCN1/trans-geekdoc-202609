    If the probability of each example in the distribution is equal, variance calculation
    can drop the individual probabilities and multiply the sum of squared differences
    by the reciprocal of the number of examples in the distribution.


    $$Var[X] = \frac{1}{n} \times \sum(x_1 - E[X])^2,(x_2 - E[X])^2,\cdots,(x_n -
    E[X])^2$$ (17.10)


    In statistics, the variance can be estimated from a sample of examples drawn from
    the domain. In the abstract, the sample variance is denoted by the lower case
    sigma with a 2 superscript indicating the units are squared (e.g. \(\sigma^2\)),
    not that you must square the final value. The sum of the squared differences is
    multiplied by the reciprocal of the number of examples minus 1 to correct for
    a bias (bias is related to a deeper discussion on degrees of freedom and I refer
    you to references at the end of the lesson).


    $$\sigma^2 = \frac{1}{n - 1} \times \sum_{i=1}^n (x_i - \mu)^2$$ (17.11)


    In NumPy, the variance can be calculated for a vector or a matrix using the var()
    function. By default, the var() function calculates the population variance. To
    calculate the sample variance, you must set the ddof argument to the value 1.
    The example below defines a 6-element vector and calculates the sample variance.


    ```

