    - *线性代数导论*，2016年。http://amzn.to/2j2J0g4

    - *数值线性代数*，1997年。http://amzn.to/2kjEF4S

    - *统计学的线性代数与矩阵分析*，2014年。http://amzn.to/2A9ceNv


    ### 1.6.2 文章


    - 维基百科上的线性代数。https://en.wikipedia.org/wiki/Linear_algebra

    - 维基百科上的线性代数分类。https://en.wikipedia.org/wiki/Category:Linear_algebra

    - 维基百科上的线性代数主题列表。https://en.wikipedia.org/wiki/List_of_linear_algebra_topics

