    # 11.6 Rank


    The rank of a matrix is the estimate of the number of linearly independent rows
    or columns in a matrix. The rank of a matrix M is often denoted as the function
    rank().


    rank(A) (11.10)


    An intuition for rank is to consider it the number of dimensions spanned by all
    of the vectors within a matrix. For example, a rank of 0 suggest all vectors span
    a point, a rank of 1 suggests all vectors span a line, a rank of 2 suggests all
    vectors span a two-dimensional plane. The rank is estimated numerically, often
    using a matrix decomposition method. A common approach is to use the Singular-Value
    Decomposition or SVD for short. NumPy provides the matrix_rank() function for
    calculating the rank of an array. It uses the SVD method to estimate the rank.
    The example below demonstrates calculating the rank of a matrix with scalar values
    and another vector with all zero values.


    ```

    # vector rank

    from numpy import array

    from numpy.linalg import matrix_rank

    # rank

    v1 = array([1,2,3])

    print(v1)

    vr1 = matrix_rank(v1)

    print(vr1)

    # zero rank

    v2 = array([0,0,0,0,0])

    print(v2)

    vr2 = matrix_rank(v2)

    print(vr2)

    ```


    Listing 11.9: Example of calculating the rank of vectors.


    Running the example prints the first vector and its rank of 1, followed by the
    second zero vector and its rank of 0.


    ```

    [1 2 3]

    1

    [0 0 0 0]

    0

    ```'
