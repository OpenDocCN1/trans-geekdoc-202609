  mdcn: "\n\n## 10.4 三角矩阵\n\n三角矩阵是一种方阵，其右上角或左下角的所有位置都有数值，其余元素填充为零值。仅在主对角线上方有数值的三角矩阵称为上三角矩阵。而仅在主对角线下方有数值的三角矩阵称为下三角矩阵。下面是一个\
    \ 3 x 3 上三角矩阵的示例。\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_88_0.png)\n\n下面是一个\
    \ 3 x 3 下三角矩阵的示例。\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_88_1.png)\n\nNumPy\
    \ 提供了从现有方阵计算三角矩阵的函数。tril() 函数从给定矩阵计算下三角矩阵，triu() 函数从给定矩阵计算上三角矩阵。下面的示例定义了一个 3 x\
    \ 3 方阵，并从中计算下三角矩阵和上三角矩阵。\n\n```\n# triangular matrices\nfrom numpy import array\n\
    from numpy import tril\nfrom numpy import triu\n# define square matrix\nM = array([\n\
    \    [1, 2, 3],\n    [1, 2, 3],\n    [1, 2, 3]])\nprint(M)\n# lower triangular\
    \ matrix\nlower = tril(M)\nprint(lower)\n# upper triangular matrix\nupper = triu(M)\n\
    print(upper)\n```\n\n清单 10.1：创建三角矩阵的示例。\n\n运行示例将打印定义的矩阵，随后是下三角矩阵和上三角矩阵。\n\n```\n\
    [[1 2 3]\n [1 2 3]\n [1 2 3]]\n\n[[1 0 0]\n [1 2 0]\n [1 2 3]]\n\n[[1 2 3]\n [0\
    \ 2 3]\n [0 0 3]]\n```\n\n清单 10.2：创建三角矩阵的示例输出。\n\n## 10.5 对角矩阵\n\n对角矩阵是指主对角线以外的值都为零的矩阵，主对角线从矩阵的左上角延伸到右下角。对角矩阵通常用变量\
    \ D 表示，可以表示为完整矩阵，也可以表示为主对角线上的值向量。\n\n对角矩阵主要由零组成，仅在主对角线上有非零元素。\n\n> —— 第 40 页，《深度学习》，2016\
    \ 年。\n\n下面是一个 3 x 3 方阵对角矩阵的示例。\n\n\\[\nD = \\begin{pmatrix} 1 & 0 & 0 \\\\ 0 &\
