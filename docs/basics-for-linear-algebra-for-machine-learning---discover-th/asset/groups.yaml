    ### 5.4.2 二维切片


    让我们看看在机器学习中你最可能使用的二维切片的两个示例。


    ### 分割输入和输出特征


    通常将加载的数据分割为输入变量 (X) 和输出变量 (y)。我们可以通过切片所有行和所有列（直到但不包括最后一列），然后单独索引最后一列来实现这一点。对于输入特征，我们可以通过在行索引中指定
    :，在列索引中指定 :-1 来选择所有行和除最后一列以外的所有列。


    ```python

    X = [:, :-1]

    ```


    列表 5.24: 对输入变量进行切片的示例。


    对于输出列，我们可以再次使用 : 选择所有行，并通过指定 -1 索引仅索引最后一列。


    ```python

    y = [:, -1]

    ```


    列表 5.25: 对输出变量进行切片的示例。


    将所有这些结合起来，我们可以将一个 3 列 2D 数据集分离为输入和输出数据，如下所示：


    ```python

    # split input and output data

    from numpy import array

    # define array

    data = array([

    [11, 22, 33],

    [44, 55, 66],

    [77, 88, 99]])

    # separate data

    X, y = data[:, :-1], data[:, -1]

    print(X)

    print(y)

    ```


    列表 5.26: 将数据集切片为输入和输出变量的示例。


    运行示例将打印分离的 X 和 y 元素。请注意，X 是一个 2D 数组，y 是一个 1D 数组。


    ```

    [[11 22]

    [44 55]

    [77 88]]

    [33 66 99]

    ```


    列表 5.27: 将数据集切片为输入和输出变量的示例输出。


    ### 分割训练和测试行


    通常将加载的数据集分割为单独的训练集和测试集。这是行的分割，其中一部分将用于训练模型，剩余部分将用于估计训练模型的技能。这涉及通过在第二个维度索引中指定 :
    来切片所有列。训练数据集将是从开始到分割点的所有行。


    ```python

    train = data[:split, :]

