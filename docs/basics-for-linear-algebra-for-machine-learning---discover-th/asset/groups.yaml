    \n### 15.3 特征向量和特征值\n\n特征向量是单位向量，这意味着它们的长度或大小等于 1.0。它们通常被称为右向量，这仅仅意味着列向量（与行向量或左向量相对）。右向量就是我们通常理解的向量。特征值是应用于特征向量的系数，使向量具有长度或大小。例如，负特征值可能作为缩放的一部分反转特征向量的方向。仅具有正特征值的矩阵称为正定矩阵，而如果特征值全为负，则称为负定矩阵。\n\
