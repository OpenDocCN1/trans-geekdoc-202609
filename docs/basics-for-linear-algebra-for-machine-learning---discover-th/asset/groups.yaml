    ## 第 7 章 向量与向量运算


    向量是线性代数的基础元素。向量在机器学习领域广泛用于描述算法和过程，例如训练算法时的目标变量 (y)。在本教程中，您将了解机器学习的线性代数向量。完成本教程后，您将知道：


    - 什么是向量，以及如何在 Python 中使用 NumPy 定义向量。

    - 如何执行向量运算，例如加法、减法、乘法和除法。

    - 如何执行其他运算，例如点积和与标量相乘。


    让我们开始吧。


    ### 7.1 教程概览


    本教程分为 5 个部分，分别是：


    - 1. 什么是向量

    - 2. 定义向量

    - 3. 向量运算

    - 4. 向量点积

    - 5. 向量-标量乘法


    ### 7.2 什么是向量


    向量是一个或多个称为标量的值的元组。


    向量由组件构成，组件是普通数字。您可以将向量视为数字列表，将向量代数视为对列表中的数字执行的操作。


    向量通常使用小写字符表示，例如 $v$；例如：


    $v = (v_1, v_2, v_3)$


    其中 $v_1, v_2, v_3$ 是标量值，通常是实数值。


    向量也可以用垂直表示或列表示；例如：


    $v = \begin{pmatrix} v_1 \\ v_2 \\ v_3 \end{pmatrix}$


    在描述机器学习算法的训练时，通常使用小写 $y$ 将目标变量表示为向量。通常使用几何类比来介绍向量，其中向量表示 $n$ 维空间中的一个点或坐标，$n$ 是维数，例如
    2。向量也可以被视为从向量空间原点出发、具有方向和大小的线段。


    这些类比作为起点很好，但不应过于执着，因为在机器学习中我们经常考虑非常高维的向量。我认为向量即坐标是机器学习中最引人注目的类比。既然我们知道了什么是向量，让我们来看看如何在
    Python 中定义向量。


    ### 7.3 定义向量


    我们可以在 Python 中将向量表示为 NumPy 数组。NumPy 数组可以从数字列表创建。例如，下面我们定义一个长度为 3 且整数值为 1、2 和 3
    的向量。


    ```

    # create a vector

    from numpy import array

    # define vector

    v = array([1, 2, 3])

    print(v)

    ```


    清单 7.1：定义向量的示例。


    该示例定义了一个包含 3 个元素的向量。运行示例会打印定义的向量。


    ```

    [1 2 3]

    ```


    清单 7.2：定义向量的示例输出。


    ### 7.4 向量运算


    本节将演示简单的向量-向量运算，其中所有操作都在两个等长向量之间逐元素执行，以生成具有相同长度的新向量


    ### 7.4.1 向量加法


    两个等长向量可以相加以创建一个新的第三个向量。


    c = a + b (7.3)


    新向量与另外两个向量具有相同的长度。新向量的每个元素都计算为其他向量在相同索引处的元素之和；例如：


    c = (a1 + b1, a2 + b2, a3 + b3) (7.4)


    或者，换一种说法：


    c[0] = a[0] + b[0]

    c[1] = a[1] + b[1]

    c[2] = a[2] + b[2] (7.5)


    我们可以通过添加 NumPy 数组直接在 Python 中相加向量。


    ```

    # vector addition

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([1, 2, 3])

    print(b)

    # add vectors

    c = a + b

    print(c)

    ```


    清单 7.3：向量加法示例。


    该示例定义了两个各包含三个元素的向量，然后将它们相加。运行示例首先打印两个父向量，然后打印两个向量之和的新向量。


    ```

    [1 2 3]

    [1 2 3]

    [2 4 6]

    ```


    清单 7.4：向量加法的示例输出。


    ### 7.4.2 向量减法


    可以从另一个等长向量中减去一个向量以创建一个新的第三个向量。


    c = a - b (7.6)


    与加法一样，新向量与父向量具有相同的长度，新向量的每个元素都计算为相同索引处元素的差。


    $c = (a_1 - b_1, a_2 - b_2, a_3 - b_3)$ (7.7)


    或者，换一种说法：


    $c[0] = a[0] - b[0]$

    $c[1] = a[1] - b[1]$

    $c[2] = a[2] - b[2]$

    (7.8)


    NumPy 数组可以在 Python 中直接相减。


    ```

    # vector subtraction

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([0.5, 0.5, 0.5])

    print(b)

    # subtract vectors

    c = a - b

    print(c)

    ```


    清单 7.5：向量减法示例。


    该示例定义了两个各包含三个元素的向量，然后用第二个减去第一个。运行示例首先打印两个父向量，然后打印第一个减去第二个的新向量。


    ```

    [1 2 3]

    [ 0.5 0.5 0.5]

    [ 0.5 1.5 2.5]

    ```


    清单 7.6：向量减法的示例输出。


    ### 7.4.3 向量乘法


    两个等长向量可以相乘。


    $c = a \times b$ (7.9)


    与加法和减法一样，此操作逐元素执行，以生成相同长度的新向量。


    $c = (a_1 \times b_1, a_2 \times b_2, a_3 \times b_3)$ (7.10)


    或


    $c = (a_1b_1, a_2b_2, a_3b_3)$ (7.11)


    或者，换一种说法：


    c[0] = a[0] * b[0]

    c[1] = a[1] * b[1]

    c[2] = a[2] * b[2] (7.12)


    我们可以直接在 NumPy 中执行此操作。


    ```

    # vector multiplication

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([1, 2, 3])

    print(b)

    # multiply vectors

    c = a * b

    print(c)

    ```


    清单 7.7：向量乘法示例。


    该示例定义了两个各包含三个元素的向量，然后将它们相乘。运行示例首先打印两个父向量，然后打印新向量。


    ```

    [1 2 3]

    [1 2 3]

    [1 4 9]

    ```


    清单 7.8：向量乘法的示例输出。


    ### 7.4.4 向量除法


    两个等长向量可以相除。


    c = \frac{a}{b} (7.13)


    与其他算术运算一样，此操作逐元素执行，以生成相同长度的新向量。


    c = (\frac{a_1}{b_1}, \frac{a_2}{b_2}, \frac{a_3}{b_3}) (7.14)


    或者，换一种说法：


    c[0] = a[0]/b[0]

    c[1] = a[1]/b[1]

    c[2] = a[2]/b[2] (7.15)


    我们可以直接在 NumPy 中执行此操作。


