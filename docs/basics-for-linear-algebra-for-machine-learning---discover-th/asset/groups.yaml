    # Chapter 17


    # Introduction to Multivariate Statistics


    Fundamental statistics are useful tools in applied machine learning for a better
    understanding your data. They are also the tools that provide the foundation for
    more advanced linear algebra operations and machine learning methods, such as
    the covariance matrix and principal component analysis respectively. As such,
    it is important to have a strong grip on fundamental statistics in the context
    of linear algebra notation. In this tutorial, you will discover how fundamental
    statistical operations work and how to implement them using NumPy with notation
    and terminology from linear algebra.


    After completing this tutorial, you will know:


    +   - What the expected value, average, and mean are and how to calculate them.

    +   - What the variance and standard deviation are and how to calculate them.

    +   - What the covariance, correlation, and covariance matrix are and how to calculate
    them.


    Let''s get started.


