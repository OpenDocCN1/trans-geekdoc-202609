    ³https://en.wikipedia.org/wiki/Set_(mathematics)\n\n## D.7 其他记法\n\n你可能会遇到其他记法。我试图在本节中列出一些。通常会先在抽象层面定义一种方法，然后再用单独的记法将其定义为具体实现。例如，如果我们正在估计变量\
    \ x，我们可以使用修改 x 的记法来表示它，例如：\n\n- x-bar (x̄)\n- x-prime (x̊)\n- x-hat (x̂)\n- x-tilde\
    \ (x̃)\n\n相同的记法在不同的上下文中可能有不同的含义，例如用于不同的对象或数学的子领域。例如，一个常见的混淆点是 |x|，根据上下文不同，它可能表示：\n\
    \n- |x|：x 的绝对值或正值。\n- |x|：向量 x 的长度。\n- |x|：集合 x 的基数。\n\n本教程仅涵盖了数学记法的基础知识。有些数学子领域与机器学习更相关，应该更详细地复习。它们是：\n\
    \n- 线性代数。\n- 统计学。\n- 概率论。\n- 微积分。\n\n也许还有少量的多元分析和信息论。\n\n## D.8 获取更多帮助的技巧\n\n\
    本节列出了一些在机器学习中为数学记法苦恼时可以使用的技巧。\n\n### D.8.1 考虑作者\n\n你正在阅读的论文或书是由人写的。人可能会犯错、遗漏，甚至因为不完全理解自己在写什么而使事情变得混乱。稍微放宽你正在阅读的记法的限制，思考作者的意图。他们想要传达什么？也许你甚至可以通过电子邮件、Twitter、Facebook、LinkedIn\
    \ 等联系作者，寻求澄清。请记住，学者们（大部分）希望其他人理解和使用他们的工作。\n\n### D.8.2 查阅 Wikipedia\n\nWikipedia\
    \ 上有记法列表，可以帮助缩小你正在阅读的记法的含义或意图范围。我建议你从以下两个地方开始：\n\n- Wikipedia 上的数学符号列表。\n  https://en.wikipedia.org/wiki/List_of_mathematical_symbols\n\
    \n- Wikipedia 上数学、科学和工程中使用的希腊字母。\n  https://en.wikipedia.org/wiki/Greek_letters_used_in_mathematics,_science,_and_engineering\n\
    \n### D.8.3 在代码中草图\n\n数学操作只是数据上的函数。将你阅读的所有内容映射到带有变量、for 循环等的伪代码中。你可能想在进行过程中使用脚本语言，配合小的构造数据数组，甚至\
    \ Excel 电子表格。随着你对技术的阅读和理解不断加深，你对该技术的代码草图会变得更有意义，最后你会得到一个可以玩耍的小型原型。\n\n我过去从不太重视这种方法，直到我看到一位学者用几行\
    \ Matlab 和一些构造数据勾勒出一篇非常复杂的论文。这让我大吃一惊，因为我曾认为系统必须完全编码并用真实数据集运行，唯一的选择是获取原始代码和数据。我非常错误。而且回过头来看，那个人很有天赋。我现在一直使用这种方法，并用\
    \ Python 绘制技术草图。\n\n### D.8.4 寻找替代方案\n\n当我试图理解一种新技术时，我使用一个技巧。我会找到并阅读所有引用我正在阅读的包含新技术的论文的论文。阅读其他学者对该技术的解释和重新阐述，通常可以澄清我对原始描述的误解。不过并非总是如此。有时它会使事情变得混乱，并引入误导性的解释或新记法。但大多数时候，它有帮助。在回到原始论文并重新阅读后，我通常可以发现后续论文实际上对原始方法犯了错误和误解的情况。\n\
    \n### D.8.5 发布问题\n\n网上有些地方的人们很乐意向他人解释数学。认真的！考虑拍摄你正在苦恼的记法的屏幕截图，写出完整的参考文献或链接，并将其和你不理解的领域发布到问答网站。两个很好的起点是：\n\
    \n- Mathematics Stack Exchange。\n  https://math.stackexchange.com/\n\n- Cross\
    \ Validated。\n  https://stats.stackexchange.com/\n\n## D.9 进一步阅读\n\n如果你想深入了解，本节提供了更多关于该主题的资源。\n\
    \n- 第 0.1 节。Reading Mathematics, Vector Calculus, Linear Algebra, and Differential\
    \ Forms, 2009. http://amzn.to/2qarp8L\n\n- 数学的语言和语法，Timothy Gowers。http://assets.press.princeton.edu/chapters/gowers/gowers_I_2.pdf\n\
    \n- 理解数学，一本指南，Peter Alfeld。http://www.math.utah.edu/~pa/math.html\n\n## D.10 总结\n\
    \n在本教程中，你了解了在阅读机器学习技术描述时可能遇到的数学记法基础知识。具体来说，你学习了：\n\n- 包括乘法变体、指数、根和对数在内的算术记法。\n\
    \n- 包括索引、求和和集合成员关系在内的序列和集合记法。\n\n- 5 种在为数学记法苦恼时可以使用的技巧。\n\n## 第 VIII 部分\n\n##\
    \ 结论\n\n## 你已经走得多远\n\n你做到了。做得好。花点时间回顾一下你已经走得多远。你现在知道：\n\n- 什么是线性代数，以及为什么它与机器学习相关且重要。\n\
    - 如何在 NumPy 数组中创建、索引和一般操作数据。\n- 什么是向量，以及如何执行向量运算和计算向量范数。\n- 什么是矩阵，以及如何执行矩阵运算，包括矩阵乘法。\n\
    - 一系列矩阵类型、它们的属性以及涉及矩阵的高级操作。\n- 什么是张量，以及如何执行基本张量运算。\n- 矩阵分解方法，包括特征值分解和奇异值分解。\n\
    - 如何使用线性代数工具计算和解释基本统计量。\n- 如何使用线性代数工具实现方法，例如主成分分析和线性最小二乘回归。\n\n不要轻视这一点。你在短时间内已经走得很远。你已经发展了线性代数中重要而宝贵的基础技能。你现在可以自信地：\n\
    \n- 阅读机器学习论文中的线性代数数学。\n- 实现机器学习算法的线性代数描述。\n- 使用线性代数的记法和运算描述你的机器学习模型。\n\n天空是极限。\n\
