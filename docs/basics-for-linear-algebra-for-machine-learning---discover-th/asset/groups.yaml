    ) (13.21)\n\n或者，展开为：\n\n\\(C = \\begin{pmatrix} a_1 \\times b_1 & a_1 \\times\
    \ b_2 \\\\ a_2 \\times b_1 & a_2 \\times b_2 \\end{pmatrix}\\) (13.22)\n\n让我们来看看矩阵的张量积。\n\
    \n\\(A = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\end{pmatrix}\\\
    ) (13.23)\n\n$$B = \\begin{pmatrix} b_{1,1} & b_{1,2} \\\\ b_{2,1} & b_{2,2} \\\
    end{pmatrix}$$ (13.24)\n\n$$C = A \\otimes B$$ (13.25)\n\n$$C = \\begin{pmatrix}\
    \ a_{1,1} \\times \\begin{pmatrix} b_{1,1} & b_{1,2} \\\\ b_{2,1} & b_{2,2} \\\
    end{pmatrix} & a_{1,2} \\times \\begin{pmatrix} b_{1,1} & b_{1,2} \\\\ b_{2,1}\
    \ & b_{2,2} \\end{pmatrix} \\\\ a_{2,1} \\times \\begin{pmatrix} b_{1,1} & b_{1,2}\
    \ \\\\ b_{2,1} & b_{2,2} \\end{pmatrix} & a_{2,2} \\times \\begin{pmatrix} b_{1,1}\
    \ & b_{1,2} \\\\ b_{2,1} & b_{2,2} \\end{pmatrix} \\end{pmatrix}$$ (13.26)\n\n\
    或者，展开为：\n\n$$C = \\begin{pmatrix} a_{1,1} \\times b_{1,1} & a_{1,1} \\times b_{1,2}\
    \ & a_{1,2} \\times b_{1,1} & a_{1,2} \\times b_{1,2} \\\\ a_{1,1} \\times b_{2,1}\
    \ & a_{1,1} \\times b_{2,2} & a_{1,2} \\times b_{2,1} & a_{1,2} \\times b_{2,2}\
