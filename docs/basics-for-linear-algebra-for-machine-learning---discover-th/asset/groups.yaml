    with systematic procedures that get results, and work back to the deeper understanding
    of theory, using working results as a context. I call this the top-down or results-first
    approach to machine learning, and linear algebra is not the first step, but perhaps
    the second or third.


    ### Practitioners Study Too Much Linear Algebra


    When practitioners do circle back to study linear algebra, they learn far more
    of the field than is required for or relevant to machine learning. Linear algebra
    is a large field of study that has tendrils into engineering, physics and quantum
    physics. There are also theorems and derivations for nearly everything, most of
    which will not help you get better skill from or a deeper understanding of your
    machine learning model. Only a specific subset of linear algebra is required,
    though you can always go deeper once you have the basics.


    ## Practitioners Study Linear Algebra Wrong


    Linear algebra textbooks will teach you linear algebra in the classical university
    bottom-up approach. This is too slow (and painful) for your needs as a machine
    learning practitioner. Like learning machine learning itself, take the top-down
    approach. Rather than starting with theorems and abstract concepts, you can learn
    the basics of linear algebra in a concrete way with data structures and worked
    examples of operations on those data structures. It’s so much faster. Once you
    know how operations work, you can circle back and learn how they were derived.


    ## A Better Way


    This book was born out of my frustrations at seeing practitioner after practitioner
    diving into linear algebra textbooks and online courses designed for undergraduate
    students and giving up. The bottom-up approach is hard, especially if you already
    have a full time job. Linear algebra is not only important to machine learning,
    but it is also a lot of fun, or can be if it is approached in the right way. I
    put together this book to help you see the field the way I see it: as just another
    set of tools we can harness on our journey toward machine learning mastery.


    Jason Brownlee

    2018


    ## Part I


    ## Introduction


    ## Welcome


    Welcome to _Basics of Linear Algebra for Machine Learning_. Linear algebra is
    a pillar of machine learning.


    The field started to be formalized about 150 years ago, but it was only about
    70 years ago that modern linear algebra came into existence. It’s a huge field
    of study that has made an impact on other areas of mathematics, such as statistics,
    as well as engineering and physics. Thankfully, we don’t need to know the breadth
    and depth of the field of linear algebra in order to improve our understanding
    and application of machine learning.


    I designed this book to teach you step-by-step the basics of linear algebra with
    concrete and executable examples in Python.


    ## Who Is This Book For?


    Before we get started, let’s make sure you are in the right place. This book is
    for developers that may know some applied machine learning. Maybe you know how
    to work through a predictive modeling problem end-to-end, or at least most of
    the main steps, with popular tools. The lessons in this book do assume a few things
    about you, such as:


    - You know your way around basic Python for programming.

    - You may know some basic NumPy for array manipulation.

    - You want to learn linear algebra to deepen your understanding and application
    of machine learning.


    This guide was written in the top-down and results-first machine learning style
    that you’re used to from MachineLearningMastery.com.


    ## About Your Outcomes


    This book will teach you the basics of linear algebra that you need to know as
    a machine learning practitioner. After reading and working through this book,
    you will know:


    - What linear algebra is and why it is relevant and important to machine learning.

    - How to create, index, and generally manipulate data in NumPy arrays.

    - What a vector is and how to perform vector arithmetic and calculate vector norms.

    - What a matrix is and how to perform matrix arithmetic, including matrix multiplication.

    - A suite of types of matrices, their properties, and advanced operations involving
    matrices.

    - What a tensor is and how to perform basic tensor arithmetic.

    - Matrix factorization methods, including the eigendecomposition and singular-value
    decomposition.

    - How to calculate and interpret basic statistics using the tools of linear algebra.

    - How to implement methods using the tools of linear algebra such as principal
    component analysis and linear least squares regression.


    This new basic understanding of linear algebra will impact your practice of machine
    learning in the following ways:


    - Read the linear algebra mathematics in machine learning papers.

    - Implement the linear algebra descriptions of machine learning algorithms.

    - Describe your machine learning models using the notation and operations of linear
    algebra.


    This book is not a substitute for an undergraduate course in linear algebra or
    a textbook for such a course, although it could complement to such materials.
    For a good list of top courses, textbooks, and other resources on linear algebra,
    see the *Further Reading* section at the end of each tutorial.


    ## How to Read This Book


    This book was written to be read linearly, from start to finish. That being said,
