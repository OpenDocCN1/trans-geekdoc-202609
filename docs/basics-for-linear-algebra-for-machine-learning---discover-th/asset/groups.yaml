    \ & a_{2,2} \\times b_{1,2} \\\\ a_{2,1} \\times b_{2,1} & a_{2,1} \\times b_{2,2}\
    \ & a_{2,2} \\times b_{2,1} & a_{2,2} \\times b_{2,2} \\end{pmatrix}$$ (13.27)\n\
    \n张量积可以使用 NumPy 中的 `tensordot()` 函数实现。该函数将要相乘的两个张量以及对乘积求和的轴作为参数，称为归约求和。要计算张量积（在\
    \ NumPy 中也称为张量点积），轴必须设置为 0。在下面的示例中，我们定义两个一阶张量（向量）并计算张量积。\n\n```\n# tensor product\n\
