  - '[PAGE 163]


    PCA is an operation applied to a dataset, represented by an \( n \times m \) matrix
    \( A \) that results in a projection of \( A \) which we will call \( B \). Let''s
    walk through the steps of this operation.


    ```

    $$

    A = \begin{pmatrix} a_{1,1} & a_{1,2} \\ a_{2,1} & a_{2,2} \\ a_{3,1} & a_{3,2}
    \end{pmatrix}

    $$

    (18.1)

    ```


    ```

    $$

    B = PCA(A)

    $$

    (18.2)

    ```


    The first step is to calculate the mean values of each column.


    ```

    $$

    M = mean(A)

    $$

    (18.3)

    ```


    Next, we need to center the values in each column by subtracting the mean column
    value.


    ```

    $$

    C = A - M

    $$

    (18.4)

    ```


    The next step is to calculate the covariance matrix of the centered matrix \(
    C \). Correlation is a normalized measure of the amount and direction (positive
    or negative) that two columns change together. Covariance is a generalized and
    unnormalized version of correlation across multiple columns. A covariance matrix
    is a calculation of covariance of a given matrix with covariance scores for every
    column with every other column, including itself.


    ```

    $$

    V = cov(C)

    $$

    (18.5)

    ```


    Finally, we calculate the eigendecomposition of the covariance matrix \( V \).
    This results in a list of eigenvalues and a list of eigenvectors.


    ```

    $$

    values, vectors = eig(V)

    $$

    (18.6)

    ```


    The eigenvectors represent the directions or components for the reduced subspace
    of \( B \), whereas the eigenvalues represent the magnitudes for the directions.
    The eigenvectors can be sorted by the eigenvalues in descending order to provide
    a ranking of the components or axes of the new subspace for \( A \). If all eigenvalues
    have a similar value, then we know that the existing representation may already
    be reasonably compressed or dense and that the projection may offer little. If
    there are eigenvalues close to zero, they represent components or axes of \( B
    \) that may be discarded. A total of \( m \) or less components must be selected
    to comprise the chosen subspace. Ideally, we would select \( k \) eigenvectors,
    called principal components, that have the \( k \) largest eigenvalues.


    ```

    $$

    B = select(values, vectors)

    $$

    (18.7)

    ```


    Other matrix decomposition methods can be used such as Singular-Value Decomposition,
    or SVD. As such, generally the values are referred to as singular values and the
    vectors of the subspace are referred to as principal components. Once chosen,
    data can be projected into the subspace via matrix multiplication.


    ```

    $$

    P = B^T \cdot A

    $$

    (18.8)

    ```


    Where \( A \) is the original data that we wish to project, \( B^T \) is the transpose
    of the chosen principal components and \( P \) is the projection of \( A \). This
    is called the covariance method for calculating the PCA, although there are alternative
    ways to calculate it.'
  - "[PAGE 164]\n\n# 18.3 Calculate Principal Component Analysis\n\nThere is no pca()\
    \ function in NumPy, but we can easily calculate the Principal Component Analysis\
    \ step-by-step using NumPy functions. The example below defines a small 3 x 2\
    \ matrix, centers the data in the matrix, calculates the covariance matrix of\
    \ the centered data, and then the eigendecomposition of the covariance matrix.\
    \ The eigenvectors and eigenvalues are taken as the principal components and singular\
    \ values and used to project the original data.\n\n```\n# principal component\
    \ analysis\nfrom numpy import array\nfrom numpy import mean\nfrom numpy import\
    \ cov\nfrom numpy.linalg import eig\n# define matrix\nA = array([\n\t[1, 2],\n\
    \t[3, 4],\n\t[5, 6]])\nprint(A)\n# column means\nM = mean(A.T, axis=1)\n# center\
    \ columns by subtracting column means\nC = A - M\n# calculate covariance matrix\
    \ of centered matrix\nV = cov(C.T)\n# factorize covariance matrix\nvalues, vectors\
    \ = eig(V)\nprint(vectors)\nprint(values)\n# project data\nP = vectors.T.dot(C.T)\n\
    print(P.T)\n```\n\nListing 18.1: Example of calculating a PCA manually.\n\nRunning\
    \ the example first prints the original matrix, then the eigenvectors and eigenvalues\
    \ of the centered covariance matrix, followed finally by the projection of the\
    \ original matrix. Interestingly, we can see that only the first eigenvector is\
    \ required, suggesting that we could project our 3 x 2 matrix onto a 3 x 1 matrix\
    \ with little loss.\n\n```\n[[1 2]\n[3 4]\n[5 6]]\n\n[[ 0.70710678 -0.70710678]\n\
    \ [ 0.70710678  0.70710678]]\n\n[8. .  .]\n\n[[-2.82842712  0.         ]\n [ 0.\
    \          0.         ]\n [ 2.82842712  0.         ]]\n```\n\nListing 18.2: Sample\
    \ output from calculating a PCA manually."
  - "[PAGE 165]\n\n# 18.4 Principal Component Analysis in scikit-learn\n\nWe can calculate\
    \ a Principal Component Analysis on a dataset using the `PCA()` class in the scikit-learn\
    \ library. The benefit of this approach is that once the projection is calculated,\
    \ it can be applied to new data again and again quite easily. When creating the\
    \ class, the number of components can be specified as a parameter. The class is\
    \ first fit on a dataset by calling the `fit()` function, and then the original\
    \ dataset or other data can be projected into a subspace with the chosen number\
    \ of dimensions by calling the `transform()` function. Once fit, the singular\
    \ values and principal components can be accessed on the PCA class via the `explained_variance_`\
    \ and `components_` attributes. The example below demonstrates using this class\
    \ by first creating an instance, fitting it on a $3 \\times 2$ matrix, accessing\
    \ the values and vectors of the projection, and transforming the original data.\n\
    \n```\n# principal component analysis with scikit-learn\nfrom numpy import array\n\
    from sklearn.decomposition import PCA\n# define matrix\nA = array([\n\t[1, 2],\n\
    \t[3, 4],\n\t[5, 6]])\nprint(A)\n# create the transform\npca = PCA(2)\n# fit transform\n\
    pca.fit(A)\n# access values and vectors\nprint(pca.components_)\nprint(pca.explained_variance_)\n\
    # transform data\nB = pca.transform(A)\nprint(B)\n```\n\nListing 18.3: Example\
    \ of calculating a PCA with scikit-learn.\n\nRunning the example first prints\
    \ the $3 \\times 2$ data matrix, then the principal components and values, followed\
    \ by the projection of the original matrix. We can see, that with some very minor\
    \ floating point rounding that we achieve the same principal components, singular\
    \ values, and projection as in the previous example.\n\n```\n[[1 2]\n [3 4]\n\
    \ [5 6]]\n\n[[ 0.70710678  0.70710678]\n [ 0.70710678 -0.70710678]]\n\n[  8.00000000e+00\
    \   2.25080839e-33]\n\n[[ -2.82842712e+00   2.22044605e-16]\n [  0.00000000e+00\
    \   0.00000000e+00]\n [  2.82842712e+00  -2.22044605e-16]]\n```\n\nListing 18.4:\
    \ Sample output from calculating a PCA with scikit-learn."
