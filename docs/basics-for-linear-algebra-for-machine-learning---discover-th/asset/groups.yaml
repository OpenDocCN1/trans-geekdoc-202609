    \n## 13.5 张量积\n\n张量积算子通常表示为中间带有小 x 的圆圈。我们在此将其表示为 \\(\\otimes\\)。给定具有 \\(q\\) 个维度的张量\
    \ \\(A\\) 和具有 \\(r\\) 个维度的张量 \\(B\\)，这些张量的乘积将是一个新张量，其阶数为 \\(q + r\\)，或者说具有 \\\
    (q + r\\) 个维度。张量积不仅限于张量，也可以在矩阵和向量上执行，这可以作为练习的好地方，以便为更高维度建立直觉。让我们来看看向量的张量积。\n\n\
    \\(a = \\begin{pmatrix} a_1 \\\\ a_2 \\end{pmatrix}\\) (13.18)\n\n\\(b = \\begin{pmatrix}\
