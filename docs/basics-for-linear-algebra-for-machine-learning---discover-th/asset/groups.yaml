    \ applies for a chain of matrix multiplications where the number of columns in\
    \ one matrix in the chain must match the number of rows in the following matrix\
    \ in the chain.\n\nOne of the most important operations involving matrices is\
    \ multiplication of two matrices. The matrix product of matrices A and B is a\
    \ third matrix C. In order for this product to be defined, A must have the same\
    \ number of columns as B has rows. If A is of shape m x n and B is of shape n\
    \ x p, then C is of shape m x p.\n\n> — Page 34, Deep Learning, 2016.\n\nThe intuition\
    \ for the matrix multiplication is that we are calculating the dot product between\
    \ each row in matrix A with each column in matrix B. For example, we can step\
    \ down rows of column A and multiply each with column 1 in B to give the scalar\
    \ values in column 1 of C. Below describes the matrix multiplication using matrix\
    \ notation.\n\nA = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\\
    \\ a_{3,1} & a_{3,2} \\end{pmatrix} (9.18)\n\nB = \\begin{pmatrix} b_{1,1} & b_{1,2}\
    \ \\\\ b_{2,1} & b_{2,2} \\end{pmatrix} (9.19)\n\nC = \\begin{pmatrix} a_{1,1}\
    \ \\times b_{1,1} + a_{1,2} \\times b_{2,1}, a_{1,1} \\times b_{1,2} + a_{1,2}\
    \ \\times b_{2,2} \\\\ a_{2,1} \\times b_{1,1} + a_{2,2} \\times b_{2,1}, a_{2,1}\
    \ \\times b_{1,2} + a_{2,2} \\times b_{2,2} \\\\ a_{3,1} \\times b_{1,1} + a_{3,2}\
    \ \\times b_{2,1}, a_{3,1} \\times b_{1,2} + a_{3,2} \\times b_{2,2} \\end{pmatrix}\
    \ (9.20)\n\nWe can describe the matrix multiplication operation using array notation.\n\
    \nC[0, 0] = A[0, 0] x B[0, 0] + A[0, 1] x B[1, 0]\nC[1, 0] = A[1, 0] x B[0, 0]\
    \ + A[1, 1] x B[1, 0]\nC[2, 0] = A[2, 0] x B[0, 0] + A[2, 1] x B[1, 0]\nC[0, 1]\
    \ = A[0, 0] x B[0, 1] + A[0, 1] x B[1, 1]\nC[1, 1] = A[1, 0] x B[0, 1] + A[1,\
    \ 1] x B[1, 1]\nC[2, 1] = A[2, 0] x B[0, 1] + A[2, 1] x B[1, 1] (9.21)\n\nThe\
    \ matrix multiplication operation can be implemented in NumPy using the dot()\
    \ function. It can also be calculated using the newer @ operator, since Python\
    \ version 3.5. The example below demonstrates both methods.\n\n```\n# matrix dot\
    \ product\nfrom numpy import array\n# define first matrix\nA = array([\n    [1,\
    \ 2],\n    [3, 4],\n    [5, 6]])\nprint(A)\n# define second matrix\nB = array([\n\
    \    [1, 2],\n    [3, 4]])\nprint(B)\n# multiply matrices\nC = A.dot(B)\nprint(C)\n\
    # multiply matrices with @ operator\nD = A @ B\nprint(D)\n```\n\nListing 9.11:\
    \ Example of matrix-matrix dot product.\n\nThe example first defines two 3 x 2\
    \ matrices and then calculates their dot product using the dot() function and\
    \ the @ operator. Running the example first prints the two parent matrices and\
    \ then the results of the two dot product operations.\n\n```\n[[1 2]\n [3 4]\n\
    \ [5 6]]\n\n[[1 2]\n [3 4]]\n\n[[ 7 10]\n [15 22]\n [23 34]]\n\n[[ 7 10]\n [15\
    \ 22]\n [23 34]]\n```\n\nListing 9.12: Sample output matrix-matrix dot product.\n\
    \nI recommend using the dot() function for matrix multiplication for now given\
    \ the newness of the @ operator.\n\n## 9.6 Matrix-Vector Multiplication\n\nA matrix\
    \ and a vector can be multiplied together as long as the rule of matrix multiplication\
    \ is observed. Specifically, that the number of columns in the matrix must equal\
    \ the number of items in the vector. As with matrix multiplication, the operation\
    \ can be written using the dot notation. Because the vector only has one column,\
    \ the result is always a vector.\n\n$c = A \\cdot v$ (9.22)\n\nOr without the\
    \ dot in a compact form.\n\n$c = Av$ (9.23)\n\nThe result is a vector with the\
    \ same number of rows as the parent matrix.\n\n$A = \\begin{pmatrix} a_{1,1} &\
    \ a_{1,2} \\\\ a_{2,1} & a_{2,2} \\\\ a_{3,1} & a_{3,2} \\end{pmatrix}$ (9.24)\n\
    \n$v = \\begin{pmatrix} v_1 \\\\ v_2 \\end{pmatrix}$ (9.25)\n\n$c = \\begin{pmatrix}\
    \ a_{1,1} \\times v_1 + a_{1,2} \\times v_2 \\\\ a_{2,1} \\times v_1 + a_{2,2}\
    \ \\times v_2 \\\\ a_{3,1} \\times v_1 + a_{3,2} \\times v_2 \\end{pmatrix}$ (9.26)\n"
  mdcn: "\n\n## 9.4.2 矩阵减法\n\n同样，一个矩阵可以从另一个具有相同维度的矩阵中减去。\n\n$$C = A - B$$ (9.6)\n\n\
    结果矩阵中的标量元素是通过对每个矩阵中的元素进行减法计算得出的。\n\n$$C = \\begin{pmatrix} a_{1,1} - b_{1,1} &\
    \ a_{1,2} - b_{1,2} \\\\ a_{2,1} - b_{2,1} & a_{2,2} - b_{2,2} \\\\ a_{3,1} -\
    \ b_{3,1} & a_{3,2} - b_{3,2} \\end{pmatrix}$$ (9.7)\n\n或者，换句话说：\n\n- $C[0, 0]\
    \ = A[0, 0] - B[0, 0]$\n- $C[1, 0] = A[1, 0] - B[1, 0]$\n- $C[2, 0] = A[2, 0]\
    \ - B[2, 0]$\n- $C[0, 1] = A[0, 1] - B[0, 1]$\n- $C[1, 1] = A[1, 1] - B[1, 1]$\n\
    - $C[2, 1] = A[2, 1] - B[2, 1]$ (9.8)\n\n我们可以直接在两个 NumPy 数组上使用减号运算符在 Python 中实现这一点。\n\
    \n```\n# matrix subtraction\nfrom numpy import array\n# define first matrix\n\
    A = array([\n    [1, 2, 3],\n    [4, 5, 6]])\nprint(A)\n# define second matrix\n\
    B = array([\n    [0.5, 0.5, 0.5],\n    [0.5, 0.5, 0.5]])\nprint(B)\n# subtract\
    \ matrices\nC = A - B\nprint(C)\n```\n\n清单 9.5：矩阵减法示例。\n\n示例首先定义两个 2 x 3 矩阵，然后相互相减。运行示例首先打印两个父矩阵，然后用第一个矩阵减去第二个矩阵。\n\
    \n```\n[[1 2 3]\n [4 5 6]]\n\n[[ 0.5  0.5  0.5]\n [ 0.5  0.5  0.5]]\n\n[[ 0.5\
    \  1.5  2.5]\n [ 3.5 4.5 5.5]]\n```\n\n清单 9.6：矩阵减法的示例输出。\n\n## 9.4.3 矩阵乘法（Hadamard\
    \ 积）\n\n相同大小的两个矩阵可以相乘，这通常被称为逐元素矩阵乘法或 Hadamard 积。这不是提及矩阵乘法时通常指的操作，因此通常使用不同的运算符，例如圆圈\
    \ \\(\\circ\\)。\n\n\\(C = A \\circ B\\) (9.9)\n\n与逐元素减法和加法一样，逐元素乘法涉及从每个父矩阵中相乘元素以计算新矩阵中的值。\n\
    \n\\(C = \\begin{pmatrix} a_{1,1} \\times b_{1,1} & a_{1,2} \\times b_{1,2} \\\
    \\ a_{2,1} \\times b_{2,1} & a_{2,2} \\times b_{2,2} \\\\ a_{3,1} \\times b_{3,1}\
    \ & a_{3,2} \\times b_{3,2} \\end{pmatrix}\\) (9.10)\n\n或者，换句话说：\n\n\\(C[0,0]\
    \ = A[0,0] \\times B[0,0]\\\\\nC[1,0] = A[1,0] \\times B[1,0]\\\\\nC[2,0] = A[2,0]\
    \ \\times B[2,0]\\\\\nC[0,1] = A[0,1] \\times B[0,1]\\\\\nC[1,1] = A[1,1] \\times\
    \ B[1,1]\\\\\nC[2,1] = A[2,1] \\times B[2,1]\\) (9.11)\n\n我们可以直接在两个 NumPy 数组上使用星号运算符在\
    \ Python 中实现这一点。\n\n```\n# matrix Hadamard product\nfrom numpy import array\n\
    # define first matrix\nA = array([\n    [1, 2, 3],\n    [4, 5, 6]])\nprint(A)\n\
    # define second matrix\nB = array([\n    [1, 2, 3],\n    [4, 5, 6]])\nprint(B)\n\
    # multiply matrices\nC = A * B\nprint(C)\n```\n\n清单 9.7：矩阵 Hadamard 积示例。\n\n示例首先定义两个\
    \ \\(2 \\times 3\\) 矩阵，然后将它们相乘。运行示例首先打印两个父矩阵，然后打印使用 Hadamard 积将它们相乘的结果。\n\n```\n\
    [[1 2 3]\n [4 5 6]]\n\n[[1 2 3]\n [4 5 6]]\n\n[[ 1  4  9]\n [16 25 36]]\n```\n\
    \n清单 9.8：矩阵 Hadamard 积的示例输出。\n\n## 9.4.4 矩阵除法\n\n一个矩阵可以被另一个具有相同维度的矩阵除。\n\n$$C\
    \ = \\frac{A}{B}$$\n\n结果矩阵中的标量元素是通过对每个矩阵中的元素进行除法计算得出的。\n\n$$C = \\begin{pmatrix}\
    \ \\frac{a_{1,1}}{b_{1,1}} & \\frac{a_{1,2}}{b_{1,2}} \\\\ \\frac{a_{2,1}}{b_{2,1}}\
    \ & \\frac{a_{2,2}}{b_{2,2}} \\\\ \\frac{a_{3,1}}{b_{3,1}} & \\frac{a_{3,2}}{b_{3,2}}\
    \ \\end{pmatrix}$$\n\n或者，换句话说：\n\n$$\nC[0, 0] = A[0, 0] / B[0, 0] \\\\\nC[1, 0]\
    \ = A[1, 0] / B[1, 0] \\\\\nC[2, 0] = A[2, 0] / B[2, 0] \\\\\nC[0, 1] = A[0, 1]\
    \ / B[0, 1] \\\\\nC[1, 1] = A[1, 1] / B[1, 1] \\\\\nC[2, 1] = A[2, 1] / B[2, 1]\n\
    $$\n\n我们可以直接在两个 NumPy 数组上使用除法运算符在 Python 中实现这一点。\n\n```\n# matrix division\nfrom\
    \ numpy import array\n# define first matrix\nA = array([\n    [1, 2, 3],\n   \
    \ [4, 5, 6]])\nprint(A)\n# define second matrix\nB = array([\n    [1, 2, 3],\n\
    \    [4, 5, 6]])\nprint(B)\n# divide matrices\nC = A / B\nprint(C)\n```\n\n清单\
    \ 9.9：矩阵除法示例。\n\n示例首先定义两个 2 x 3 矩阵，然后将第一个矩阵除以第二个矩阵。运行示例首先打印两个父矩阵，然后用第一个矩阵除以第二个矩阵。\n\
    \n```\n[[1 2 3]\n [4 5 6]]\n\n[[1 2 3]\n [4 5 6]]\n\n[[ 1.  1.  1.]\n [ 1.  1.\
    \  1.]]\n```\n\n清单 9.10：矩阵除法的示例输出。\n\n## 9.5 矩阵-矩阵乘法\n\n矩阵乘法（也称为矩阵点积）比之前的操作更复杂，涉及一条规则，因为并非所有矩阵都可以相乘。\n\
    \n$C = A \\cdot B$ (9.15)\n\n或\n\n$C = AB$ (9.16)\n\n矩阵乘法的规则如下：\n\n- 第一个矩阵（A）中的列数（n）必须等于第二个矩阵（B）中的行数（m）。\n\
    \n例如，矩阵 A 的维度为 m 行 n 列，矩阵 B 的维度为 n 行 k 列。A 中的 n 列和 B 中的 n 行相等。结果是一个具有 m 行和 k 列的新矩阵。\n\
    \n$C(m, k) = A(m, n) \\cdot B(n, k)$ (9.17)\n\n此规则适用于矩阵乘法链，其中链中一个矩阵的列数必须与链中下一个矩阵的行数匹配。\n\
    \n涉及矩阵的最重要操作之一是两个矩阵的乘法。矩阵 A 和 B 的矩阵乘积是第三个矩阵 C。为了定义此乘积，A 必须具有与 B 相同数量的列（即 B 的行数）。如果\
    \ A 的形状为 m x n，B 的形状为 n x p，则 C 的形状为 m x p。\n\n> — 第 34 页，《深度学习》，2016 年。\n\n矩阵乘法的直觉是，我们正在计算矩阵\
    \ A 中每一行与矩阵 B 中每一列之间的点积。例如，我们可以沿矩阵 A 的行向下移动，将每一行与 B 中的第 1 列相乘，以给出 C 中第 1 列的标量值。下面使用矩阵符号描述矩阵乘法。\n\
    \nA = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\\\ a_{3,1} &\
    \ a_{3,2} \\end{pmatrix} (9.18)\n\nB = \\begin{pmatrix} b_{1,1} & b_{1,2} \\\\\
    \ b_{2,1} & b_{2,2} \\end{pmatrix} (9.19)\n\nC = \\begin{pmatrix} a_{1,1} \\times\
    \ b_{1,1} + a_{1,2} \\times b_{2,1}, a_{1,1} \\times b_{1,2} + a_{1,2} \\times\
    \ b_{2,2} \\\\ a_{2,1} \\times b_{1,1} + a_{2,2} \\times b_{2,1}, a_{2,1} \\times\
    \ b_{1,2} + a_{2,2} \\times b_{2,2} \\\\ a_{3,1} \\times b_{1,1} + a_{3,2} \\\
    times b_{2,1}, a_{3,1} \\times b_{1,2} + a_{3,2} \\times b_{2,2} \\end{pmatrix}\
    \ (9.20)\n\n我们可以使用数组符号描述矩阵乘法操作。\n\nC[0, 0] = A[0, 0] x B[0, 0] + A[0, 1] x B[1,\
    \ 0]\nC[1, 0] = A[1, 0] x B[0, 0] + A[1, 1] x B[1, 0]\nC[2, 0] = A[2, 0] x B[0,\
    \ 0] + A[2, 1] x B[1, 0]\nC[0, 1] = A[0, 0] x B[0, 1] + A[0, 1] x B[1, 1]\nC[1,\
    \ 1] = A[1, 0] x B[0, 1] + A[1, 1] x B[1, 1]\nC[2, 1] = A[2, 0] x B[0, 1] + A[2,\
    \ 1] x B[1, 1] (9.21)\n\n矩阵乘法操作可以在 NumPy 中使用 dot() 函数实现。它也可以使用较新的 @ 运算符计算，自 Python\
    \ 3.5 版本起。下面的示例演示了这两种方法。\n\n```\n# matrix dot product\nfrom numpy import array\n\
    # define first matrix\nA = array([\n    [1, 2],\n    [3, 4],\n    [5, 6]])\nprint(A)\n\
    # define second matrix\nB = array([\n    [1, 2],\n    [3, 4]])\nprint(B)\n# multiply\
    \ matrices\nC = A.dot(B)\nprint(C)\n# multiply matrices with @ operator\nD = A\
    \ @ B\nprint(D)\n```\n\n清单 9.11：矩阵-矩阵点积示例。\n\n示例首先定义两个 3 x 2 矩阵，然后使用 dot() 函数和\
    \ @ 运算符计算它们的点积。运行示例首先打印两个父矩阵，然后打印两个点积操作的结果。\n\n```\n[[1 2]\n [3 4]\n [5 6]]\n\n\
    [[1 2]\n [3 4]]\n\n[[ 7 10]\n [15 22]\n [23 34]]\n\n[[ 7 10]\n [15 22]\n [23 34]]\n\
    ```\n\n清单 9.12：矩阵-矩阵点积的示例输出。\n\n鉴于 @ 运算符较新，我目前建议对矩阵乘法使用 dot() 函数。\n\n## 9.6 矩阵-向量乘法\n\
    \n只要遵守矩阵乘法规则，矩阵和向量就可以相乘。具体来说，矩阵中的列数必须等于向量中的元素个数。与矩阵乘法一样，该操作可以使用点号表示法编写。因为向量只有一列，结果始终是一个向量。\n\
    \n$c = A \\cdot v$ (9.22)\n\n或者，不带点号的紧凑形式。\n\n$c = Av$ (9.23)\n\n结果是一个与父矩阵具有相同行数的向量。\n\
    \n$A = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\\\ a_{3,1}\
    \ & a_{3,2} \\end{pmatrix}$ (9.24)\n\n$v = \\begin{pmatrix} v_1 \\\\ v_2 \\end{pmatrix}$\
    \ (9.25)\n\n$c = \\begin{pmatrix} a_{1,1} \\times v_1 + a_{1,2} \\times v_2 \\\
    \\ a_{2,1} \\times v_1 + a_{2,2} \\times v_2 \\\\ a_{3,1} \\times v_1 + a_{3,2}\
    \ \\times v_2 \\end{pmatrix}$ (9.26)\n\n"
