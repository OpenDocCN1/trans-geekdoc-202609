    # Chapter 7


    # Vectors and Vector Arithmetic


    Vectors are a foundational element of linear algebra. Vectors are used throughout
    the field of machine learning in the description of algorithms and processes such
    as the target variable (y) when training an algorithm. In this tutorial, you will
    discover linear algebra vectors for machine learning. After completing this tutorial,
    you will know:


    +   - What a vector is and how to define one in Python with NumPy.

    +   - How to perform vector arithmetic such as addition, subtraction, multiplication
    and division.

    +   - How to perform additional operations such as dot product and multiplication
    with a scalar.


    Let''s get started.


    # 7.1 Tutorial Overview


    This tutorial is divided into 5 parts; they are:


    +   1. What is a Vector

    +   2. Defining a Vector

    +   3. Vector Arithmetic

    +   4. Vector Dot Product

    +   5. Vector-Scalar Multiplication


    # 7.2 What is a Vector


    A vector is a tuple of one or more values called scalars.


    Vectors are built from components, which are ordinary numbers. You can think of
    a vector as a list of numbers, and vector algebra as operations performed on the
    numbers in the list.'
  - '[PAGE 60]


    Vectors are often represented using a lowercase character such as $v$; for example:


    $v = (v_1, v_2, v_3)$


    Where $v_1, v_2, v_3$ are scalar values, often real values.


    Vectors are also shown using a vertical representation or a column; for example:


    $v = \begin{pmatrix} v_1 \\ v_2 \\ v_3 \end{pmatrix}$


    It is common to represent the target variable as a vector with the lowercase $y$
    when describing the training of a machine learning algorithm. It is common to
    introduce vectors using a geometric analogy, where a vector represents a point
    or coordinate in an $n$-dimensional space, where $n$ is the number of dimensions,
    such as 2. The vector can also be thought of as a line from the origin of the
    vector space with a direction and a magnitude.


    These analogies are good as a starting point, but should not be held too tightly
    as we often consider very high dimensional vectors in machine learning. I find
    the vector-as-coordinate the most compelling analogy in machine learning. Now
    that we know what a vector is, let''s look at how to define a vector in Python.


    # 7.3 Defining a Vector


    We can represent a vector in Python as a NumPy array. A NumPy array can be created
    from a list of numbers. For example, below we define a vector with the length
    of 3 and the integer values 1, 2 and 3.


    ```

    # create a vector

    from numpy import array

    # define vector

    v = array([1, 2, 3])

    print(v)

    ```


    Listing 7.1: Example of defining a vector.


    The example defines a vector with 3 elements. Running the example prints the defined
    vector.


    ```

    [1 2 3]

    ```


    Listing 7.2: Sample output from defining a vector.


    # 7.4 Vector Arithmetic


    In this section will demonstrate simple vector-vector arithmetic, where all operations
    are performed element-wise between two vectors of equal length to result in a
    new vector with the same length'
  - '[PAGE 61]


    # 7.4.1 Vector Addition


    Two vectors of equal length can be added together to create a new third vector.


    c = a + b (7.3)


    The new vector has the same length as the other two vectors. Each element of the
    new vector is calculated as the addition of the elements of the other vectors
    at the same index; for example:


    c = (a1 + b1, a2 + b2, a3 + b3) (7.4)


    Or, put another way:


    c[0] = a[0] + b[0]

    c[1] = a[1] + b[1]

    c[2] = a[2] + b[2] (7.5)


    We can add vectors directly in Python by adding NumPy arrays.


    ```

    # vector addition

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([1, 2, 3])

    print(b)

    # add vectors

    c = a + b

    print(c)

    ```


    Listing 7.3: Example of vector addition.


    The example defines two vectors with three elements each, then adds them together.
    Running the example first prints the two parent vectors then prints a new vector
    that is the addition of the two vectors.


    ```

    [1 2 3]

    [1 2 3]

    [2 4 6]

    ```


    Listing 7.4: Sample output from vector addition.


    # 7.4.2 Vector Subtraction


    One vector can be subtracted from another vector of equal length to create a new
    third vector.


    c = a - b (7.6)'
  - '[PAGE 62]


    As with addition, the new vector has the same length as the parent vectors and
    each element of the new vector is calculated as the subtraction of the elements
    at the same indices.


    $c = (a_1 - b_1, a_2 - b_2, a_3 - b_3)$ (7.7)


    Or, put another way:


    $c[0] = a[0] - b[0]$

    $c[1] = a[1] - b[1]$

    $c[2] = a[2] - b[2]$

    (7.8)


    The NumPy arrays can be directly subtracted in Python.


    ```

    # vector subtraction

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([0.5, 0.5, 0.5])

    print(b)

    # subtract vectors

    c = a - b

    print(c)

    ```


    # Listing 7.5: Example of vector subtraction.


    The example defines two vectors with three elements each, then subtracts the first
    from the second. Running the example first prints the two parent vectors then
    prints the new vector that is the first minus the second.


    ```

    [1 2 3]

    [ 0.5 0.5 0.5]

    [ 0.5 1.5 2.5]

    ```


    # Listing 7.6: Sample output from vector subtraction.


    # 7.4.3 Vector Multiplication


    Two vectors of equal length can be multiplied together.


    $c = a \times b$ (7.9)


    As with addition and subtraction, this operation is performed element-wise to
    result in a new vector of the same length.


    $c = (a_1 \times b_1, a_2 \times b_2, a_3 \times b_3)$ (7.10)


    or


    $c = (a_1b_1, a_2b_2, a_3b_3)$ (7.11)'
  - '[PAGE 63]


    Or, put another way:


    c[0] = a[0] x b[0]

    c[1] = a[1] x b[1]

    c[2] = a[2] x b[2] (7.12)


    We can perform this operation directly in NumPy.


    ```

    # vector multiplication

    from numpy import array

    # define first vector

    a = array([1, 2, 3])

    print(a)

    # define second vector

    b = array([1, 2, 3])

    print(b)

    # multiply vectors

    c = a * b

    print(c)

    ```


    Listing 7.7: Example of vector multiplication.


    The example defines two vectors with three elements each, then multiplies the
    vectors together. Running the example first prints the two parent vectors, then
    the new vector is printed.


    ```

    [1 2 3]

    [1 2 3]

    [1 4 9]

    ```


    Listing 7.8: Sample output from vector multiplication.


    # 7.4.4 Vector Division


    Two vectors of equal length can be divided.


    c = \frac{a}{b} (7.13)


    As with other arithmetic operations, this operation is performed element-wise
    to result in a new vector of the same length.


    c = (\frac{a_1}{b_1}, \frac{a_2}{b_2}, \frac{a_3}{b_3}) (7.14)


    Or, put another way:


    c[0] = a[0]/b[0]

    c[1] = a[1]/b[1]

    c[2] = a[2]/b[2] (7.15)


    We can perform this operation directly in NumPy.'
