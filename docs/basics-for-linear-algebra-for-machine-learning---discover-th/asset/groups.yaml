    # 9.5 Matrix-Matrix Multiplication


    Matrix multiplication, also called the matrix dot product is more complicated
    than the previous operations and involves a rule as not all matrices can be multiplied
    together.


    $C = A \cdot B$ (9.15)


    or


    $C = AB$ (9.16)


    The rule for matrix multiplication is as follows:


    +   - The number of columns (n) in the first matrix (A) must equal the number
    of rows (m) in the second matrix (B).


    For example, matrix A has the dimensions m rows and n columns and matrix B has
    the dimensions n and k. The n columns in A and n rows in B are equal. The result
    is a new matrix with m rows and k columns.


    $C(m, k) = A(m, n) \cdot B(n, k)$ (9.17)


    This rule applies for a chain of matrix multiplications where the number of columns
    in one matrix in the chain must match the number of rows in the following matrix
    in the chain.


    One of the most important operations involving matrices is multiplication of two
    matrices. The matrix product of matrices A and B is a third matrix C. In order
    for this product to be defined, A must have the same number of columns as B has
    rows. If A is of shape m x n and B is of shape n x p, then C is of shape m x p.


    > — Page 34, Deep Learning, 2016.'
  - "[PAGE 80]\n\nThe intuition for the matrix multiplication is that we are calculating\
    \ the dot product between each row in matrix A with each column in matrix B. For\
    \ example, we can step down rows of column A and multiply each with column 1 in\
    \ B to give the scalar values in column 1 of C. Below describes the matrix multiplication\
    \ using matrix notation.\n\nA = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1}\
    \ & a_{2,2} \\\\ a_{3,1} & a_{3,2} \\end{pmatrix} (9.18)\n\nB = \\begin{pmatrix}\
    \ b_{1,1} & b_{1,2} \\\\ b_{2,1} & b_{2,2} \\end{pmatrix} (9.19)\n\nC = \\begin{pmatrix}\
    \ a_{1,1} \\times b_{1,1} + a_{1,2} \\times b_{2,1}, a_{1,1} \\times b_{1,2} +\
    \ a_{1,2} \\times b_{2,2} \\\\ a_{2,1} \\times b_{1,1} + a_{2,2} \\times b_{2,1},\
    \ a_{2,1} \\times b_{1,2} + a_{2,2} \\times b_{2,2} \\\\ a_{3,1} \\times b_{1,1}\
    \ + a_{3,2} \\times b_{2,1}, a_{3,1} \\times b_{1,2} + a_{3,2} \\times b_{2,2}\
    \ \\end{pmatrix} (9.20)\n\nWe can describe the matrix multiplication operation\
    \ using array notation.\n\nC[0, 0] = A[0, 0] x B[0, 0] + A[0, 1] x B[1, 0]\nC[1,\
    \ 0] = A[1, 0] x B[0, 0] + A[1, 1] x B[1, 0]\nC[2, 0] = A[2, 0] x B[0, 0] + A[2,\
    \ 1] x B[1, 0]\nC[0, 1] = A[0, 0] x B[0, 1] + A[0, 1] x B[1, 1]\nC[1, 1] = A[1,\
    \ 0] x B[0, 1] + A[1, 1] x B[1, 1]\nC[2, 1] = A[2, 0] x B[0, 1] + A[2, 1] x B[1,\
    \ 1] (9.21)\n\nThe matrix multiplication operation can be implemented in NumPy\
    \ using the dot() function. It can also be calculated using the newer @ operator,\
    \ since Python version 3.5. The example below demonstrates both methods.\n\n```\n\
    # matrix dot product\nfrom numpy import array\n# define first matrix\nA = array([\n\
