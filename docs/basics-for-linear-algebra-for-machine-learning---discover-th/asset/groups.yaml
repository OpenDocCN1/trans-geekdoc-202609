    \ below, which is an example of a reflection matrix or coordinate reflection.\n\
    \n\\[\nQ = \\begin{pmatrix} 1 & 0 \\\\ 0 & -1 \\end{pmatrix}\n\\] (10.17)\n\n\
    The example below creates this orthogonal matrix and checks the above equivalences.\n\
