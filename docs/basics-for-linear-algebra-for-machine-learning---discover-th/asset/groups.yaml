    # 19.7 Solve via SVD and Pseudoinverse


    The Singular-Value Decomposition, or SVD for short, is a matrix decomposition
    method like the QR decomposition.


    ```

    X = U \cdot \Sigma \cdot V^T

    ```


    Where A is the real n x m matrix that we wish to decompose, U is a m x m matrix,
    \Sigma (often represented by the uppercase Greek letter Sigma) is an m x n diagonal
    matrix, and V^T is the transpose of an n x n matrix. Unlike the QR decomposition,
    all matrices have a singular-value decomposition. As a basis for solving the system
    of linear equations for linear regression, SVD is more stable and the preferred
    approach. Once decomposed, the coefficients can be found by calculating the pseudoinverse
    of the input matrix X and multiplying that by the output vector y.


    ```

    b = X^+ \cdot y

    ```


    Where the pseudoinverse X^+ is calculated as following:


    ```

    X^+ = U \cdot D^+ \cdot V^T

    ```'
