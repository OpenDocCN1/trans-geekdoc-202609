    # Chapter 5


    # Index, Slice and Reshape NumPy Arrays


    Machine learning data is represented as arrays. In Python, data is almost universally
    represented as NumPy arrays. If you are new to Python, you may be confused by
    some of the Pythonic ways of accessing data, such as negative indexing and array
    slicing. In this tutorial, you will discover how to manipulate and access your
    data correctly in NumPy arrays. After completing this tutorial, you will know:


    +   - How to convert your list data to NumPy arrays.

    +   - How to access data using Pythonic indexing and slicing.

    +   - How to resize your data to meet the expectations of some machine learning
    APIs.


    Let''s get started.


    # 5.1 Tutorial Overview


    This tutorial is divided into 4 parts; they are:


    +   1. From List to Arrays

    +   2. Array Indexing

    +   3. Array Slicing

    +   4. Array Reshaping


    # 5.2 From List to Arrays


    In general, I recommend loading your data from file using Pandas or even NumPy
    functions. This section assumes you have loaded or generated your data by other
