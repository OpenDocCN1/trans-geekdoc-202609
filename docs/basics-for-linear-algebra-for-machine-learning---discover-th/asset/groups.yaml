    \ = eig(A)\n# confirm first eigenvector\nB = A.dot(vectors[:, 0])\nprint(B)\n\
    C = vectors[:, 0] * values[0]\nprint(C)\n```\n\nListing 15.3: Example of calculating\
    \ a confirmation of an eigendecomposition.\n"
