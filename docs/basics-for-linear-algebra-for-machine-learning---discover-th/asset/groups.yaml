    # Chapter 1


    # Introduction to Linear Algebra


    Linear algebra is a field of mathematics that is universally agreed to be a prerequisite
    to a deeper understanding of machine learning. Although linear algebra is a large
    field with many esoteric theories and findings, the nuts and bolts tools and notations
    taken from the field are practical for machine learning practitioners. With a
    solid foundation of what linear algebra is, it is possible to focus on just the
    good or relevant parts. In this tutorial, you will discover what exactly linear
    algebra is from a machine learning perspective. After completing this tutorial,
    you will know:


    +   - Linear algebra is the mathematics of data.

    +   - Linear algebra has had a marked impact on the field of statistics.

    +   - Linear algebra underlies many practical mathematical tools, such as Fourier
    series and computer graphics.


    Let''s get started.


    # 1.1 Tutorial Overview


    This tutorial is divided into 4 parts; they are:


    +   1. Linear Algebra.

    +   2. Numerical Linear Algebra.

    +   3. Linear Algebra and Statistics.

    +   4. Applications of Linear Algebra.


    # 1.2 Linear Algebra


    Linear algebra is a branch of mathematics, but the truth of it is that linear
    algebra is the mathematics of data. Matrices and vectors are the language of data.
    Linear algebra is about linear combinations. That is, using arithmetic on columns
    of numbers called vectors and arrays'
  - '[PAGE 18]


    of numbers called matrices, to create new columns and arrays of numbers. Linear
    algebra is the study of lines and planes, vector spaces and mappings that are
    required for linear transforms.


    It is a relatively young field of study, having initially been formalized in the
    1800s in order to find unknowns in systems of linear equations. A linear equation
    is just a series of terms and mathematical operations where some terms are unknown;
    for example:


    y = 4 x x + 1


    Equations like this are linear in that they describe a line on a two-dimensional
    graph. The line comes from plugging in different values into the unknown x to
    find out what the equation or model does to the value of y. We can line up a system
    of equations with the same form with two or more unknowns; for example:


    y = 0.1 x x1 + 0.4 x x2

    y = 0.3 x x1 + 0.9 x x2

    y = 0.2 x x1 + 0.3 x x2

    ...


    The column of y values can be taken as a column vector of outputs from the equation.
    The two columns of integer values are the data columns, say a1 and a2, and can
    be taken as a matrix A. The two unknown values x1 and x2 can be taken as the coefficients
    of the equation and together form a vector of unknowns b to be solved. We can
    write this compactly using linear algebra notation as:


    y = A · b


    Problems of this form are generally challenging to solve because there are more
    unknowns (here we have 2) than there are equations to solve (here we have 3).
    Further, there is often no single line that can satisfy all of the equations without
    error. Systems describing problems we are often interested in (such as a linear
    regression) can have an infinite number of solutions. This gives a small taste
    of the very core of linear algebra that interests us as machine learning practitioners.
    Much of the rest of the operations are about making this problem and problems
    like it easier to understand and solve.


    # 1.3 Numerical Linear Algebra


    The application of linear algebra in computers is often called numerical linear
    algebra.


    > “numerical” linear algebra is really applied linear algebra.


    > — Page ix, Numerical Linear Algebra, 1997.


    It is more than just the implementation of linear algebra operations in code libraries;
    it also includes the careful handling of the problems of applied mathematics,
    such as working with the limited floating point precision of digital computers.
    Computers are good at performing linear algebra calculations, and much of the
    dependence on Graphical Processing Units (GPUs) by modern machine learning methods
    such as deep learning is because of their ability to compute linear algebra operations
    fast.'
