    array with one column and multiple arrays. NumPy provides the reshape() function
    on the NumPy array object that can be used to reshape the data. The reshape()
    function takes a single argument that specifies the new shape of the array. In
    the case of reshaping a one-dimensional array into a two-dimensional array with
    one column, the tuple would be the shape of the array as the first dimension (data.shape[0])
    and 1 for the second dimension.


