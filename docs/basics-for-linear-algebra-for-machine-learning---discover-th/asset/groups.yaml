  mdcn: "\n\n## Chapter 19\n\n## 线性回归\n\n线性回归是一种用于建模一个或多个自变量与因变量之间关系的方法。它是统计学的基石，常被视为良好的入门机器学习方法。它也是一种可以使用矩阵表示法重新表述并使用矩阵运算求解的方法。在本教程中，你将发现线性回归的矩阵表述，以及如何使用直接方法和矩阵分解方法求解它。完成本教程后，你将知道：\n\
    \n- 线性回归及其与正规方程的矩阵重述。\n- 如何使用 QR 矩阵分解求解线性回归。\n- 如何使用 SVD 和伪逆求解线性回归。\n\n让我们开始吧。\n\
    \n### 19.1 教程概览\n\n本教程分为 7 个部分，分别是：\n\n- 1. 什么是线性回归\n- 2. 线性回归的矩阵表述\n- 3. 线性回归数据集\n\
    - 4. 通过逆矩阵求解\n- 5. 通过 QR 分解求解\n- 6. 通过 SVD 和伪逆求解\n- 7. 通过便捷函数求解\n\n### 19.2 什么是线性回归\n\
    \n线性回归是一种用于建模两个标量值之间关系的方法：输入变量 x 和输出变量 y。该模型假设 y 是输入变量的线性函数或加权和。\n\ny = f(x) (19.1)\n\
    \n或者，用系数表示。\n\ny = b0 + b1 × x1 (19.2)\n\n该模型也可用于在给定多个输入变量（称为多元线性回归，下文中为可读性添加了括号）的情况下建模输出变量。\n\
    \ny = b0 + (b1 × x1) + (b2 × x2) + ⋯ (19.3)\n\n创建线性回归模型的目标是找到系数值（b）的值，以最小化输出变量\
    \ y 预测中的误差。\n\n### 19.3 线性回归的矩阵表述\n\n线性回归可以使用矩阵表示法表述；例如：\n\ny = X · b (19.4)\n\
    \n或者，不使用点表示法。\n\ny = Xb (19.5)\n\n其中 X 是输入数据，每一列是一个数据特征，b 是系数向量，y 是 X 中每一行的输出变量向量。\n\
    \nX = ( x1,1 x1,2 x1,3 x2,1 x2,2 x2,3 x3,1 x3,2 x3,3 x4,1 x4,2 x4,3 ) (19.6)\n\
    \nb = ( b1 b2 b3 ) (19.7)\n\ny = ( y1 y2 y3 y4 ) (19.8)\n\n重新表述后，问题变成一个线性方程组，其中\
    \ b 向量的值未知。这类系统被称为超定系统，因为方程数量多于未知数，即每个系数都用于数据的每一行。在解析上求解这是一个具有挑战性的问题，因为存在多个不一致的解，例如系数的多个可能值。此外，所有解都会有一些误差，因为没有一条直线能几乎穿过所有点，因此求解方程的方法必须能够处理这种情况。通常实现这一点的方法是找到一个解，其中模型中\
    \ b 的值最小化平方误差。这称为线性最小二乘法。\n\n\\(||X \\cdot b - y||^2 = \\sum_{i=1}^m \\sum_{j=1}^n\
    \ X_{i,j} \\cdot (b_j - y_i)^2\\) (19.9)\n\n只要输入列是独立的（例如不相关），此表述就有唯一解。\n\n我们不能总是将误差\
    \ \\(e = b - Ax\\) 减为零。当 \\(e\\) 为零时，\\(x\\) 是 \\(Ax = b\\) 的精确解。当 \\(e\\) 的长度尽可能小时，\\\
    (\\hat{x}\\) 是最小二乘解。\n\n> — 第 219 页，《线性代数导论》，第五版，2016 年。\n\n在矩阵表示法中，此问题使用所谓的正规方程表述：\n\
    \n\\(X^T \\cdot X \\cdot b = X^T \\cdot y\\) (19.10)\n\n这可以重新排列，以指定 b 的解为：\n\n\
    \\(b = (X^T \\cdot X)^{-1} \\cdot X^T \\cdot y\\) (19.11)\n\n这可以直接求解，尽管由于存在矩阵逆，可能在数值上具有挑战性或不稳定。\n\
    \n### 19.4 线性回归数据集\n\n为了探索线性回归的矩阵表述，让我们先定义一个数据集作为上下文。我们将使用一个简单的 2D 数据集，其中数据易于可视化为散点图，模型易于可视化为尝试拟合数据点的直线。下面的示例定义了一个\
    \ \\(5 \\times 2\\) 矩阵数据集，将其拆分为 X 和 y 组件，并将数据集绘制为散点图。\n\n```\n# linear regression\
    \ dataset\nfrom numpy import array\nfrom matplotlib import pyplot\n# define dataset\n\
    data = array([\n[0.05, 0.12],\n[0.18, 0.22],\n[0.31, 0.35],\n[0.42, 0.38],\n[0.5,\
    \ 0.49]])\nprint(data)\n# split into inputs and outputs\n```\n\n```\nX, y = data[:,\
    \ 0], data[:, 1]\nX = X.reshape((len(X), 1))\n# scatter plot\npyplot.scatter(X,\
    \ y)\npyplot.show()\n```\n\n清单 19.1: 示例线性回归数据集。\n\n运行示例首先打印定义的数据集。\n\n```\n[[\
    \ 0.05 0.12]\n [ 0.18 0.22]\n [ 0.31 0.35]\n [ 0.42 0.38]\n [ 0.5  0.49]]\n```\n\
    \n清单 19.2: 示例线性回归数据集的示例输出。\n\n然后创建数据集的散点图，显示一条直线无法精确拟合此数据。\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_171_0.png)\n\
    \n图 19.1: 线性回归数据集的散点图。\n\n### 19.5 通过逆矩阵求解\n\n第一种方法是尝试直接使用矩阵逆求解回归问题。也就是说，给定 X，哪些系数\
    \ b 的集合在与 X 相乘时会给出 y。如前一节所示，正规方程定义了如何直接计算 b。\n\n$b = (X^T \\cdot X)^{-1} \\cdot\
    \ X^T \\cdot y$ (19.12)\n\n这可以直接在 NumPy 中使用 `inv()` 函数计算矩阵逆。\n\n```\nb = inv(X.T.dot(X)).dot(X.T).dot(y)\n\
    ```\n\n清单 19.3: 直接求解线性最小二乘法的示例代码。\n\n计算系数后，我们可以使用它们在给定 X 时预测结果。\n\n```\nyhat =\
    \ X.dot(b)\n```\n\n清单 19.4: 使用系数进行预测的示例代码。\n\n将此与前一节中定义的数据集结合起来，完整示例如下所示。\n\n\
    ```\n# direct solution to linear least squares\nfrom numpy import array\nfrom\
    \ numpy.linalg import inv\nfrom matplotlib import pyplot\n# define dataset\ndata\
    \ = array([\n    [0.05, 0.12],\n    [0.18, 0.22],\n    [0.31, 0.35],\n    [0.42,\
    \ 0.38],\n    [0.5, 0.49]])\n# split into inputs and outputs\nX, y = data[:,0],\
    \ data[:,1]\nX = X.reshape((len(X), 1))\n# linear least squares\nb = inv(X.T.dot(X)).dot(X.T).dot(y)\n\
    print(b)\n# predict using coefficients\nyhat = X.dot(b)\n# plot data and predictions\n\
    pyplot.scatter(X, y)\npyplot.plot(X, yhat, color='red')\npyplot.show()\n```\n\n\
    清单 19.5: 直接计算线性回归解的示例。\n\n运行示例执行计算并打印系数向量 b。\n\n```\n[ 1.00233226]\n```\n\n清单\
    \ 19.6: 直接计算线性回归解的示例输出。\n\n然后创建数据集的散点图，并带有模型的线图，显示对数据的合理拟合。\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_173_0.png)\n\
    \n图 19.2: 线性回归问题直接解的散点图。\n\n这种方法的一个问题是矩阵逆，它既计算昂贵又数值不稳定。一种替代方法是使用矩阵分解来避免此操作。我们将在以下部分中查看两个示例。\n\
    \n### 19.6 通过 QR 分解求解\n\nQR 分解是将矩阵分解为其组成元素的方法。\n\n$$A = Q \\cdot R$$ (19.13)\n\
    \n其中 $A$ 是我们希望分解的矩阵，$Q$ 是大小为 $m \\times m$ 的矩阵，$R$ 是大小为 $m \\times n$ 的上三角矩阵。QR\
    \ 分解是求解线性最小二乘方程的流行方法。跳过所有推导，系数可以使用 $Q$ 和 $R$ 元素按如下方式找到：\n\n$$b = R^{-1} \\cdot\
    \ Q^T \\cdot y$$ (19.14)\n\n该方法仍然涉及矩阵逆，但在此仅对更简单的 $R$ 矩阵进行。QR 分解可以使用 NumPy 中的 `qr()`\
    \ 函数找到。在 NumPy 中计算系数的方式如下：\n\n"
