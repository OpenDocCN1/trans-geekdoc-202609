    \ 1))\n# calculate coefficients\nb, residuals, rank, s = lstsq(X, y)\nprint(b)\n\
    # predict using coefficients\nyhat = X.dot(b)\n# plot data and predictions\npyplot.scatter(X,\
    \ y)\npyplot.plot(X, yhat, color='red')\npyplot.show()\n```\n\n清单 19.12: 使用 `lstsq()`\
    \ 计算线性回归解的示例。\n\n运行示例打印系数，并用红线绘制模型预测的数据图。\n\n```\n[ 1.00233226]\n```\n\n清单 19.13:\
    \ 使用 `lstsq()` 计算线性回归解的示例输出。\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_178_0.png)\n\
    \n图 19.5: 线性回归问题 `lstsq()` 解的散点图。\n\n## 19.9 扩展\n\n本节列出了一些可供扩展教程的想法，你可以自行探索。\n\
    \n- 在你自己构建的小型数据集上测试每个线性回归模型。\n- 加载表格数据集，测试每种线性回归方法并比较结果。\n- 研究并使用线性代数实现求解线性最小二乘问题的其他方法。\n\
