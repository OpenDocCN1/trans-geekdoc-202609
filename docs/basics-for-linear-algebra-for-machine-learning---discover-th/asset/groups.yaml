    # 17.5 Covariance Matrix


    The covariance matrix is a square and symmetric matrix that describes the covariance
    between two or more random variables. The diagonal of the covariance matrix are
    the variances of each of the random variables, as such it is often called the
    variance-covariance matrix. A covariance matrix is a generalization of the covariance
    of two variables and captures the way in which all variables in the dataset may
    change together. The covariance matrix is denoted as the uppercase Greek letter
    Sigma, e.g. \(\Sigma\). The covariance for each pair of random variables is calculated
    as above.


