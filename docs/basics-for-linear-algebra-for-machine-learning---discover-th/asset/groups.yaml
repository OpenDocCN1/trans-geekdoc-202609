    \ \\\\ a_{2,1,1} & a_{2,2,1} & a_{2,3,1} \\end{pmatrix}, \\begin{pmatrix} a_{1,1,2}\
    \ & a_{1,2,2} & a_{1,3,2} \\\\ a_{2,1,2} & a_{2,2,2} & a_{2,3,2} \\end{pmatrix}\
