  - "[PAGE 172]\n\n# 19.5 Solve via Inverse\n\nThe first approach is to attempt to\
    \ solve the regression problem directly using the matrix inverse. That is, given\
    \ X, what are the set of coefficients b that when multiplied by X will give y.\
    \ As we saw in a previous section, the normal equations define how to calculate\
    \ b directly.\n\n$b = (X^T \\cdot X)^{-1} \\cdot X^T \\cdot y$ (19.12)\n\nThis\
    \ can be calculated directly in NumPy using the `inv()` function for calculating\
    \ the matrix inverse.\n\n```\nb = inv(X.T.dot(X)).dot(X.T).dot(y)\n```\n\nListing\
    \ 19.3: Example code for solving linear least squares directly.\n\nOnce the coefficients\
    \ are calculated, we can use them to predict outcomes given X.\n\n```\nyhat =\
    \ X.dot(b)\n```\n\nListing 19.4: Example code for using the coefficients to make\
    \ a prediction.\n\nPutting this together with the dataset defined in the previous\
    \ section, the complete example is listed below.\n\n```\n# direct solution to\
    \ linear least squares\nfrom numpy import array\nfrom numpy.linalg import inv\n\
    from matplotlib import pyplot\n# define dataset\ndata = array([\n    [0.05, 0.12],\n\
    \    [0.18, 0.22],\n    [0.31, 0.35],\n    [0.42, 0.38],\n    [0.5, 0.49]])\n\
    # split into inputs and outputs\nX, y = data[:,0], data[:,1]\nX = X.reshape((len(X),\
    \ 1))\n# linear least squares\nb = inv(X.T.dot(X)).dot(X.T).dot(y)\nprint(b)\n\
    # predict using coefficients\nyhat = X.dot(b)\n# plot data and predictions\npyplot.scatter(X,\
    \ y)\npyplot.plot(X, yhat, color='red')\npyplot.show()\n```\n\nListing 19.5: Example\
