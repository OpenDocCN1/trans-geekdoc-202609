  mdcn: "\n\n## 5.5 数组重塑\n\n对数据进行切片后，您可能需要重塑它。例如，某些库（如 scikit-learn）可能要求将一维输出变量数组（y）重塑为具有一列和每列结果的二维数组。某些算法（如\
