    > 学习线性代数也可以非常有趣。读者在学习概念之间的联系时会体验到*知识兴奋*，而在学习这门学科时，体验到开阔思维的时刻也并不罕见。

    >

    > —— 第 ix 页，《No Bullshit Guide To Linear Algebra》，2017 年。


