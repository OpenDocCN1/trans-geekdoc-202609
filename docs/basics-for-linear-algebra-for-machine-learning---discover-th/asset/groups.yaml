  md: "\n### 12.3.2 Time Complexity\n\nAssuming a very large sparse matrix can be\
    \ fit into memory, we will want to perform operations on this matrix. Simply,\
    \ if the matrix contains mostly zero-values, i.e. no data, then performing operations\
    \ across this matrix may take a long time where the bulk of the computation performed\
    \ will involve adding or multiplying zero values together.\n\nIt is wasteful to\
    \ use general methods of linear algebra on such problems, because most of the\
    \ O(N³) arithmetic operations devoted to solving the set of equations or inverting\
    \ the matrix involve zero operands.\n\n> — Page 75, *Numerical Recipes: The Art\
    \ of Scientific Computing*, Third Edition, 2007.\n\nThis is a problem of increased\
    \ time complexity of matrix operations that increases with the size of the matrix.\
    \ This problem is compounded when we consider that even trivial machine learning\
    \ methods may require many operations on each row, column, or even across the\
    \ entire matrix, resulting in vastly longer execution times.\n\n## 12.4 Sparse\
    \ Matrices in Machine Learning\n\nSparse matrices turn up a lot in applied machine\
    \ learning. In this section, we will look at some common examples to motivate\
    \ you to be aware of the issues of sparsity.\n\n### 12.4.1 Data\n\nSparse matrices\
    \ come up in some specific types of data, most notably observations that record\
    \ the occurrence or count of an activity. Three examples include:\n\n- Whether\
    \ or not a user has watched a movie in a movie catalog.\n- Whether or not a user\
    \ has purchased a product in a product catalog.\n- Count of the number of listens\
    \ of a song in a song catalog.\n\n### 12.4.2 Data Preparation\n\nSparse matrices\
    \ come up in encoding schemes used in the preparation of data. Three common examples\
    \ include:\n\n- One hot encoding, used to represent categorical data as sparse\
    \ binary vectors.\n- Count encoding, used to represent the frequency of words\
    \ in a vocabulary for a document\n- TF-IDF encoding, used to represent normalized\
    \ word frequency scores in a vocabulary.\n\n### 12.4.3 Areas of Study\n\nSome\
    \ areas of study within machine learning must develop specialized methods to address\
    \ sparsity directly as the input data is almost always sparse. Three examples\
    \ include:\n\n- Natural language processing for working with documents of text.\n\
    - Recommender systems for working with product usage within a catalog.\n- Computer\
    \ vision when working with images that contain lots of black pixels.\n\nIf there\
    \ are 100,000 words in the language model, then the feature vector has length\
    \ 100,000, but for a short email message almost all the features will have count\
    \ zero.\n\n> — Page 22, Artificial Intelligence: A Modern Approach, Third Edition,\
    \ 2009.\n\n## 12.5 Working with Sparse Matrices\n\nThe solution to representing\
    \ and working with sparse matrices is to use an alternate data structure to represent\
    \ the sparse data. The zero values can be ignored and only the data or non-zero\
    \ values in the sparse matrix need to be stored or acted upon. There are multiple\
    \ data structures that can be used to efficiently construct a sparse matrix; three\
    \ common examples are listed below.\n\n- **Dictionary of Keys**. A dictionary\
    \ is used where a row and column index is mapped to a value.\n- **List of Lists**.\
    \ Each row of the matrix is stored as a list, with each sublist containing the\
    \ column index and the value.\n- **Coordinate List**. A list of tuples is stored\
    \ with each tuple containing the row index, column index, and the value.\n\nThere\
    \ are also data structures that are more suitable for performing efficient operations;\
    \ two commonly used examples are listed below.\n\n- **Compressed Sparse Row**.\
    \ The sparse matrix is represented using three one-dimensional arrays for the\
    \ non-zero values, the extents of the rows, and the column indexes.\n- **Compressed\
    \ Sparse Column**. The same as the Compressed Sparse Row method except the column\
    \ indices are compressed and read first before the row indices.\n\nThe Compressed\
    \ Sparse Row, also called CSR for short, is often used to represent sparse matrices\
    \ in machine learning given the efficient access and matrix multiplication that\
    \ it supports.\n\n## 12.6 Sparse Matrices in Python\n\nSciPy provides tools for\
    \ creating sparse matrices using multiple data structures, as well as tools for\
    \ converting a dense matrix to a sparse matrix. Many linear algebra NumPy and\
    \ SciPy functions that operate on NumPy arrays can transparently operate on SciPy\
    \ sparse arrays. Further, machine learning libraries that use NumPy data structures\
    \ can also operate transparently on SciPy sparse arrays, such as scikit-learn\
    \ for general machine learning and Keras for deep learning.\n\nA dense matrix\
    \ stored in a NumPy array can be converted into a sparse matrix using the CSR\
    \ representation by calling the `csr_matrix()` function. In the example below,\
    \ we define a $3 \\times 6$ sparse matrix as a dense array (e.g. an `ndarray`),\
    \ convert it to a CSR sparse representation, and then convert it back to a dense\
    \ array by calling the `todense()` function.\n\n```\n# sparse matrix\nfrom numpy\
    \ import array\nfrom scipy.sparse import csr_matrix\n# create dense matrix\nA\
    \ = array([\n    [1, 0, 0, 1, 0, 0],\n    [0, 0, 2, 0, 0, 1],\n    [0, 0, 0, 2,\
    \ 0, 0]])\nprint(A)\n# convert to sparse matrix (CSR method)\nS = csr_matrix(A)\n\
    print(S)\n# reconstruct dense matrix\nB = S.todense()\nprint(B)\n```\n\nListing\
    \ 12.1: Example of converting between dense and sparse matrices.\n\nRunning the\
    \ example first prints the defined dense array, followed by the CSR representation,\
    \ and then the reconstructed dense matrix.\n\n```\n[[1 0 0 1 0 0]\n [0 0 2 0 0\
    \ 1]\n [0 0 0 2 0 0]]\n\n(0, 0) 1\n(0, 3) 1\n(1, 2) 2\n(1, 5) 1\n(2, 3) 2\n\n\
    [[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n```\n\nListing 12.2: Sample output\
    \ from converting between dense and sparse matrices.\n\nNumPy does not provide\
    \ a function to calculate the sparsity of a matrix. Nevertheless, we can calculate\
    \ it easily by first finding the density of the matrix and subtracting it from\
    \ one. The number of non-zero elements in a NumPy array can be given by the `count_nonzero()`\
    \ function and the total number of elements in the array can be given by the size\
    \ property of the array. Array sparsity can therefore be calculated as\n\n```\n\
    sparsity = 1.0 - count_nonzero(A) / A.size\n```\n\nListing 12.3: Example of the\
    \ manual sparsity calculation.\n\nThe example below demonstrates how to calculate\
    \ the sparsity of an array.\n\n```\n# sparsity calculation\nfrom numpy import\
    \ array\nfrom numpy import count_nonzero\n# create dense matrix\nA = array([\n\
    \    [1, 0, 0, 1, 0, 0],\n    [0, 0, 2, 0, 0, 1],\n    [0, 0, 0, 2, 0, 0]])\n\
    print(A)\n# calculate sparsity\nsparsity = 1.0 - count_nonzero(A) / A.size\nprint(sparsity)\n\
    ```\n\nListing 12.4: Example of calculating sparsity.\n\nRunning the example first\
    \ prints the defined sparse matrix followed by the sparsity of the matrix.\n\n\
    ```\n[[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n0.7222222222222222\n```\n\
    \nListing 12.5: Sample output from calculating sparsity.\n\n## 12.7 Extensions\n\
    \nThis section lists some ideas for extending the tutorial that you may wish to\
    \ explore.\n\n- Develop your own examples for converting a dense array to sparse\
    \ and calculating sparsity.\n- Develop an example for the each sparse matrix representation\
    \ method supported by SciPy.\n- Select one sparsity representation method and\
    \ implement it yourself from scratch.\n\nIf you explore any of these extensions,\
    \ I'd love to know.\n\n## 12.8 Further Reading\n\nThis section provides more resources\
    \ on the topic if you are looking to go deeper.\n\n### 12.8.1 Books\n\n- Introduction\
    \ to Linear Algebra, Fifth Edition, 2016. http://amzn.to/2AZ7R8j\n\n- Section\
    \ 2.7 Sparse Linear Systems, Numerical Recipes: The Art of Scientific Computing,\
    \ Third Edition, 2007. http://amzn.to/2CF5atj\n\n- Artificial Intelligence: A\
    \ Modern Approach, Third Edition, 2009. http://amzn.to/2C4LhMW\n\n- Direct Methods\
    \ for Sparse Matrices, Second Edition, 2017. http://amzn.to/2DcsQVU\n\n### 12.8.2\
    \ API\n\n- Sparse matrices (scipy.sparse) API. https://docs.scipy.org/doc/scipy/reference/sparse.html\n\
    \n- scipy.sparse.csr_matrix() API. https://docs.scipy.org/doc/scipy/reference/generated/scipy.sparse.csr_matrix.html\n\
    \n- numpy.count_nonzero() API. https://docs.scipy.org/doc/numpy-1.13.0/reference/generated/numpy.count_nonzero.html\n\
    \n- numpy.ndarray.size API. https://docs.scipy.org/doc/numpy-1.13.0/reference/generated/numpy.ndarray.size.html\n\
    \n### 12.8.3 Articles\n\n- Sparse matrix on Wikipedia. https://en.wikipedia.org/wiki/Sparse_matrix\n\
    \n## 12.9 Summary\n\nIn this tutorial, you discovered sparse matrices, the issues\
