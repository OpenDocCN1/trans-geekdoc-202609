    \ Map everything you’re reading to pseudocode with variables, for-loops and more.\
    \ You might want to use a scripting language as you go along with small arrays\
    \ of contrived data or even an Excel spreadsheet. As your reading and understanding\
    \ of the technique improves, your code-sketch of the technique will make more\
    \ sense and at the end you will have a mini prototype to play with.\n\nI never\
    \ used to take much stock in this approach until I saw an academic sketch out\
    \ a very complex paper in a few lines of Matlab with some contrived data. It knocked\
    \ my socks off because I believed the system had to be coded completely and run\
