    \n图 19.4: 线性回归问题 SVD 解的散点图。\n\n## 19.8 通过便捷函数求解\n\n基于 SVD 的伪逆方法是求解线性最小二乘问题的事实标准。这是因为它稳定且适用于大多数数据集。NumPy\
    \ 提供了一个名为 `lstsq()` 的便捷函数，该函数使用 SVD 方法求解线性最小二乘问题。该函数以 $X$ 矩阵和 $y$ 向量作为输入，返回 $b$\
    \ 系数以及残差误差、给定 $X$ 矩阵的秩和奇异值。下面的示例在测试数据集上演示了 `lstsq()` 函数。\n\n```\n# least squares\
    \ via convenience function\nfrom numpy import array\nfrom numpy.linalg import\
    \ lstsq\nfrom matplotlib import pyplot\n# define dataset\ndata = array([\n[0.05,\
