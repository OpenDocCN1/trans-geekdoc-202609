    \nThe LU decomposition is found using an iterative numerical process and can fail\
    \ for those matrices that cannot be decomposed or decomposed easily. A variation\
    \ of this decomposition that is numerically more stable to solve in practice is\
    \ called the LUP decomposition, or the LU decomposition with partial pivoting.\n\
    \n$A = L \\cdot U \\cdot P$ (14.3)\n\nThe rows of the parent matrix are re-ordered\
    \ to simplify the decomposition process and the additional P matrix specifies\
    \ a way to permute the result or return the result to the original order. There\
    \ are also other variations of the LU. The LU decomposition is often used to simplify\
    \ the solving of systems of linear equations, such as finding the coefficients\
    \ in a linear regression, as well as in calculating the determinant and inverse\
    \ of a matrix.\n\nThe LU decomposition can be implemented in Python with the lu()\
    \ function. More specifically, this function calculates an LPU decomposition.\
