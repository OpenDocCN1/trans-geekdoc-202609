    \ covariance matrix of centered matrix\nV = cov(C.T)\n# factorize covariance matrix\n\
    values, vectors = eig(V)\nprint(vectors)\nprint(values)\n# project data\nP = vectors.T.dot(C.T)\n\
    print(P.T)\n```\n\nListing 18.1: 手动计算 PCA 的示例。\n\n运行示例时，首先打印原始矩阵，然后打印中心化协方差矩阵的特征向量和特征值，最后打印原始矩阵的投影。有趣的是，我们可以看到只需要第一个特征向量，这表明我们可以将\
