    a matrix and returns the U, \(\Sigma\) and _V<sup>T</sup>_ elements. The \(\Sigma\)
    diagonal matrix is returned as a vector of singular values. The _V_ matrix is
    returned in a transposed form, e.g. _V<sup>T</sup>_. The example below defines
    a 3 × 2 matrix and calculates the singular-value decomposition.

