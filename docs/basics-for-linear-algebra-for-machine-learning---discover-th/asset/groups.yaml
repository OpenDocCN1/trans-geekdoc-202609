    ### 2.8 总结


    在本章中，你作为机器学习从业者，发现了为什么应该加深对线性代数的理解。具体来说，你学到了：


    - 并非每个人都应该学习线性代数，这取决于你在机器学习过程中的阶段。

    - 5 个理由，说明为什么中级机器学习从业者需要更深入地理解线性代数。

    - 线性代数如果以正确的方式接近是可以很有趣的。


    ### 2.8.1 接下来


    在下一章中，你将发现 10 个需要理解线性代数的机器学习概念和方法的具体示例。


    ## 第 3 章


    ### 机器学习中的线性代数示例


    线性代数是数学的一个子领域，涉及向量、矩阵和线性变换。它是机器学习领域的关键基础，从用于描述算法运算的符号，到代码中算法的实现。尽管线性代数是机器学习领域不可或缺的一部分，但这种紧密关系往往未得到解释，或是使用向量空间或特定矩阵运算等抽象概念来解释。在本章中，你将发现
    10 个你可能熟悉的机器学习常见示例，它们使用、需要并且最好是通过线性代数来理解。阅读本章后，你将知道：


    - 处理表格数据集和图像等数据时使用线性代数结构。

    - 进行独热编码和降维等数据准备时的线性代数概念。

    - 在深度学习、自然语言处理和推荐系统等子领域中根深蒂固地使用线性代数符号和方法。


    让我们开始吧。


    ### 3.1 概述


    在本章中，我们将回顾机器学习中 10 个明显且具体的线性代数示例。我尽量选择你可能熟悉或甚至之前使用过的示例。它们是：


    - 1. 数据集和数据文件

    - 2. 图像和照片

    - 3. 独热编码

    - 4. 线性回归

    - 5. 正则化

    - 6. 主成分分析

    - 7. 奇异值分解

    - 8. 隐语义分析

    - 9. 推荐系统

    - 10. 深度学习


    你自己在机器学习中有最喜欢的线性代数示例吗？请告诉我。


    ### 3.2 数据集和数据文件


    在机器学习中，你在数据集上拟合模型。这是一组类似表格的数字，其中每一行表示一个观测值，每一列表示观测值的一个特征。例如，以下是鸢尾花数据集¹的片段：


    清单 3.1：鸢尾花数据集的示例输出。


    | 5.1 | 3.5 | 1.4 | 0.2 | Iris-setosa |

    | --- | --- | --- | --- | --- |

    | 4.9 | 3.0 | 1.4 | 0.2 | Iris-setosa |

    | 4.7 | 3.2 | 1.3 | 0.2 | Iris-setosa |

    | 4.6 | 3.1 | 1.5 | 0.2 | Iris-setosa |

    | 5.0 | 3.6 | 1.4 | 0.2 | Iris-setosa |

    | ... | ... | ... | ... | ... |


    这些数据实际上是一个矩阵，线性代数中的关键数据结构。此外，当你将数据分割为输入和输出以拟合监督机器学习模型（例如测量值和花卉物种）时，你会得到一个矩阵（X）和一个向量（y）。向量是线性代数中的另一个关键数据结构。每一行的长度相同，即相同的列数，因此我们可以说数据是向量化的，行可以一次或批量地提供给模型，并且模型可以预先配置为期望固定宽度的行。


    ### 3.3 图像和照片


    也许你更习惯在计算机视觉应用中处理图像或照片。你处理的每个图像本身就是一个表格结构，具有宽度和高度，黑白图像每个单元格有一个像素值，彩色图像每个单元格有 3
    个像素值。照片是线性代数中矩阵的又一个示例。对图像的操作，例如裁剪、缩放、剪切等，都使用线性代数的符号和运算来描述。


    ¹http://archive.ics.uci.edu/ml/datasets/Iris


    ### 3.4 独热编码


    在机器学习中，你有时会处理分类数据。可能是分类问题的类别标签，也可能是分类输入变量。对分类变量进行编码是常见的做法，以便某些技术更容易处理和学习。分类变量的一种流行编码是独热编码。独热编码是创建一个表格来表示变量，每个类别一列，数据集中的每个示例一行。在给定行的分类值列中添加一个标记或值为
    1，并在所有其他列中添加值为 0。例如，包含 3 行的颜色变量：


    清单 3.2：分类变量示例。


    | red |

    | --- |

    | green |

    | blue |

    | ... |


    可能被编码为：


    清单 3.3：独热编码的分类变量示例。


    | red | green | blue |

    | --- | --- | --- |

    | 1 | 0 | 0 |

    | 0 | 1 | 0 |

    | 0 | 0 | 1 |

    | ... | ... | ... |


    每一行都被编码为一个二进制向量，即值为零或一的向量，这是稀疏表示的一个示例，而稀疏表示是线性代数的一个整个子领域。


    ### 3.5 线性回归


    线性回归是统计学中用于描述变量之间关系的一种古老方法。它常用于机器学习中，在较简单的回归问题中预测数值。描述和求解线性回归问题有多种方法，即找到一组系数，当它们分别乘以每个输入变量并相加时，能得出对输出变量的最佳预测。如果你使用过机器学习工具或库，求解线性回归最常见的方式是通过最小二乘优化，该优化使用线性回归中的矩阵分解方法求解，例如
    LU 分解、奇异值分解或 SVD。即使是总结线性回归方程的常见方式也使用线性代数符号：


    ```

    y = A · b

    (3.1)

    ```


    其中 y 是输出变量，A 是数据集，b 是模型系数。


    ### 3.6 正则化


    在应用机器学习中，我们通常寻求在我们的问题上达到最佳性能的最简单模型。更简单的模型通常在从特定示例中泛化方面表现更好


