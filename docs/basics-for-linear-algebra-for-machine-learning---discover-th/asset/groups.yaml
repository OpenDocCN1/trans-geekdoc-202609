    ## Chapter 16


    ## Singular Value Decomposition


    Matrix decomposition, also known as matrix factorization, involves describing
    a given matrix using its constituent elements. Perhaps the most known and widely
    used matrix decomposition method is the Singular-Value Decomposition, or SVD.
    All matrices have an SVD, which makes it more stable than other methods, such
    as the eigendecomposition. As such, it is often used in a wide array of applications
    including compressing, denoising, and data reduction. In this tutorial, you will
    discover the Singular-Value Decomposition method for decomposing a matrix into
    its constituent elements. After completing this tutorial, you will know:


    - What Singular-value decomposition is and what is involved.

    - How to calculate an SVD and reconstruct a rectangular and square matrix from
    SVD elements.

    - How to calculate the pseudoinverse and perform dimensionality reduction using
    the SVD.


    Let''s get started.


    ### 16.1 Tutorial Overview


    This tutorial is divided into 5 parts; they are:


    - 1. What is the Singular-Value Decomposition

    - 2. Calculate Singular-Value Decomposition

    - 3. Reconstruct Matrix

    - 4. Pseudoinverse

    - 5. Dimensionality Reduction


    ### 16.2 What is the Singular-Value Decomposition


    The Singular-Value Decomposition, or SVD for short, is a matrix decomposition
    method for reducing a matrix to its constituent parts in order to make certain
    subsequent matrix calculations simpler. For the case of simplicity we will focus
    on the SVD for real-valued matrices and ignore the case for complex numbers.


    \( A = U \cdot \Sigma \cdot V^T \) (16.1)


    Where _A_ is the real _n_ × _m_ matrix that we wish to decompose, _U_ is an _m_
    × _m_ matrix, \(\Sigma\) represented by the uppercase Greek letter sigma) is an
    _m_ × _n_ diagonal matrix, and _V<sup>T</sup>_ is the _V_ transpose of an _n_
    × _n_ matrix where _T_ is a superscript.


    The Singular Value Decomposition is a highlight of linear algebra.


    > — Page 371, _Introduction to Linear Algebra_, 2016.


    The diagonal values in the \(\Sigma\) matrix are known as the singular values
    of the original matrix _A_. The columns of the _U_ matrix are called the left-singular
    vectors of _A_, and the columns of _V_ are called the right-singular vectors of
    _A_. The SVD is calculated via iterative numerical methods. We will not go into
    the details of these methods. Every rectangular matrix has a singular value decomposition,
    although the resulting matrices may contain complex numbers and the limitations
    of floating point arithmetic may cause some matrices to fail to decompose neatly.


    The singular value decomposition (SVD) provides another way to factorize a matrix,
    into singular vectors and singular values. The SVD allows us to discover some
    of the same kind of information as the eigendecomposition. However, the SVD is
    more generally applicable.


    > — Pages 44-45, _Deep Learning_, 2016.


    The SVD is used widely both in the calculation of other matrix operations, such
    as matrix inverse, but also as a data reduction method in machine learning. SVD
    can also be used in least squares linear regression, image compression, and denoising
    data.


    The singular value decomposition (SVD) has numerous applications in statistics,
    machine learning, and computer science. Applying the SVD to a matrix is like looking
    inside it with X-ray vision...


    > — Page 297, _No Bullshit Guide To Linear Algebra_, 2017.


    ### 16.3 Calculate Singular-Value Decomposition


