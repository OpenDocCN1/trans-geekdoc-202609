    > ——第 262 页，《*无废话线性代数指南*》，2017 年。\n\n### 15.4 特征分解的计算\n\n特征分解是在方阵上使用高效迭代算法计算的，我们不会深入细节。通常先找到一个特征值，然后找到一个特征向量来求解方程作为一组系数。可以在\
