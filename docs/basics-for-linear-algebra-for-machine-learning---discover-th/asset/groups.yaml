    Principal Component Analysis, or PCA for short, is a method for reducing the dimensionality
    of data. It can be thought of as a projection method where data with m-columns
    (features) is projected into a subspace with m or fewer columns, whilst retaining
    the essence of the original data. The PCA method can be described and implemented
    using the tools of linear algebra.'
