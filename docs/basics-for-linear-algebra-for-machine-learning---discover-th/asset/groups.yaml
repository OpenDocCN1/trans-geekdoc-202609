    ## D.2 The Frustration with Math Notation


    You will encounter mathematical notation when reading about machine learning algorithms.
    For example, notation may be used to:


    - Describe an algorithm.

    - Describe data preparation.

    - Describe results.

    - Describe a test harness.

    - Describe implications.


    These descriptions may be in research papers, textbooks, blog posts and elsewhere.
    Often the terms are well defined, but there are also mathematical notation norms
    that you may not be familiar with. All it takes is one term or one equation that
    you do not understand and your understanding of the entire method will be lost.
    I''ve suffered this problem myself many times and it is incredibly frustrating!
    In this tutorial we will review some basic mathematical notation that will help
    you when reading descriptions of machine learning methods.


    ## D.3 Arithmetic Notation


    In this section we will go over some less obvious notations for basic arithmetic
    as well as a few concepts you may have forgotten since school.


    ### D.3.1 Simple Arithmetic


    The notation for basic arithmetic is as you would write it. For example:


    - Addition: 1 + 1 = 2

    - Subtraction: 2 - 1 = 1

    - Multiplication: 2 x 2 = 4

    - Division: 2/2 = 1


    Most mathematical operations have a sister operation that performs the inverse
    operation, for example subtraction is the inverse of addition and division is
    the inverse of multiplication.


    ### D.3.2 Algebra


    We often want to describe operations abstractly to separate them from specific
    data or specific implementations. For this reason we see heavy use of algebra,
    that is uppercase and/or lowercase letters or words to represents terms or concepts
    in mathematical notation. It is also common to use letters from the Greek alphabet.
    Each sub-field of math may have reserved letters, that is terms or letters that
    always mean the same thing. Nevertheless, algebraic terms should be defined as
    part of the description and if they are not, it may just be a poor description,
    not your fault.


    ### D.3.3 Multiplication Notation


    Multiplication is a common notation and has a few shorthands. Often a little “x”
    (×) or an asterisk “*” is used to represent multiplication:


    $c = a \times b$ (D.1)


    Or


    $c = a * b$ (D.2)


    You may see a dot notation used, for example:


    $c = a \cdot b$ (D.3)


    Alternately, you may see no operation and no white space separation between previously
    defined terms, for example:


    $c = ab$ (D.4)


    Which again is the same thing.


    ### D.3.4 Exponents and Square Roots


    An exponent is a number raised to a power. The notation is written as the original
    number or the base with a second number or the exponent shown as a superscript,
    for example:


    $2^3$ (D.5)


    Which would be calculated as 2 multiplied by itself 3 times or cubing:


    $2 \times 2 \times 2 = 8$ (D.6)


    A number raised to the power to is said to be its square


    $2^2 = 2 \times 2 = 4$ (D.7)


    The square of a number can be inverted by calculating the square root. This is
    shown using the notation of a number and with a tick above $\sqrt{x}$.


    $\sqrt{4} = 2$ (D.8)


    Here, we know the result and the exponent and we wish to find the base. In fact,
    the root operation can be used to invert any exponent, it just so happens that
    the default square root assumes an exponent of 2, represented by a subscript 2
    in front of the square root tick. For example, we can invert the cubing of a number
    by taking the cube root:


    $2^3 = 8$ (D.9)


    $\sqrt[3]{6} = 2$ (D.10)


    ### D.3.5 Logarithms and e


    When we raise 10 to an integer exponent we often call this an order of magnitude.


    $10^2 = 10 \times 10$ (D.11)


    Another way to reverse this operation is by calculating the logarithm of the result
    100 assuming a base of 10, in notation this is written as `log10()`.


    $log10(100) = 2$ (D.12)


    Here, we know the result and the base and wish to find the exponent. This allows
    us to move up and down orders of magnitude very easily. Taking the logarithm assuming
    the base of 2 is also commonly used, given the use of binary arithmetic used in
    computers. For example:


    $2^6 = 64$ (D.13)


    $log2(64) = 6$ (D.14)


    Another popular logarithm is to assume the natural base called $e$. The $e$ is
    reserved and is a special number or a constant called Euler''s number (pronounced
    *oy-ler*) that refers to a value with practically infinite precision.


    $e = 2.71828 \cdots$ (D.15)


    Raising $e$ to a power is called a natural exponential function:


    $e^2 = 7.38905 \cdots$ (D.16)


    It can be inverted using the natural logarithm which is denoted as `ln()`:


    $ln(7.38905 \cdots) = 2$ (D.17)


    Without going into detail, the natural exponent and natural logarithm prove useful
    throughout mathematics to abstractly describe the continuous growth of some systems,
    e.g. systems that grow exponentially such as compound interest.


    ## D.4 Greek Alphabet


    Greek letters are used throughout mathematical notation for variables, constants,
    functions and more. For example in statistics we talk about the mean using the
    lowercase Greek letter mu ($\mu$), and the standard deviation as the lowercase
    Greek letter sigma ($\sigma$). In linear regression we talk about the coefficients
    as the lowercase letter beta ($\beta$). And so on. It is useful to know all of
    the uppercase and lowercase Greek letters and how to pronounce them. When I was
