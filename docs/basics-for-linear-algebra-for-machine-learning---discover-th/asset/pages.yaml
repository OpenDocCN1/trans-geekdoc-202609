  md: "# 5.5.3 Reshape 2D to 3D Array\n\nIt is common to need to reshape two-dimensional\
    \ data where each row represents a sequence into a three-dimensional array for\
    \ algorithms that expect multiple samples of one or more time steps and one or\
    \ more features. A good example is the LSTM recurrent neural network model in\
    \ the Keras deep learning library. The reshape function can be used directly,\
    \ specifying the new dimensionality. This is clear with an example where each\
    \ sequence has multiple time steps with one observation (feature) at each time\
    \ step. We can use the sizes in the shape attribute on the array to specify the\
    \ number of samples (rows) and columns (time steps) and fix the number of features\
    \ at 1.\n\n```\ndata.reshape((data.shape[0], data.shape[1], 1))\n```\n\nListing\
    \ 5.41: Example the reshape() function for reshaping from 2D to 3D data.\n\nPutting\
    \ this all together, we get the following worked example.\n\n```\n# reshape 2D\
    \ array to 3D\nfrom numpy import array\n# list of data\ndata = [[11, 22],\n  \
    \      [33, 44],\n        [55, 66]]\n# array of data\ndata = array(data)\nprint(data.shape)\n\
    # reshape\ndata = data.reshape((data.shape[0], data.shape[1], 1))\nprint(data.shape)\n\
    ```\n\nListing 5.42: Example of changing the shape of a two-dimensional array\
