    # 9.5 Matrix-Matrix Multiplication


    Matrix multiplication, also called the matrix dot product is more complicated
    than the previous operations and involves a rule as not all matrices can be multiplied
    together.


    $C = A \cdot B$ (9.15)


    or


    $C = AB$ (9.16)


    The rule for matrix multiplication is as follows:


    +   - The number of columns (n) in the first matrix (A) must equal the number
    of rows (m) in the second matrix (B).


    For example, matrix A has the dimensions m rows and n columns and matrix B has
    the dimensions n and k. The n columns in A and n rows in B are equal. The result
    is a new matrix with m rows and k columns.


    $C(m, k) = A(m, n) \cdot B(n, k)$ (9.17)


    This rule applies for a chain of matrix multiplications where the number of columns
    in one matrix in the chain must match the number of rows in the following matrix
    in the chain.


    One of the most important operations involving matrices is multiplication of two
    matrices. The matrix product of matrices A and B is a third matrix C. In order
    for this product to be defined, A must have the same number of columns as B has
    rows. If A is of shape m x n and B is of shape n x p, then C is of shape m x p.


    > — Page 34, Deep Learning, 2016.'
