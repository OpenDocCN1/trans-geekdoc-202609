    \ Introduction to Linear Algebra, Fifth Edition, 2016.\n\nWe can transpose a matrix\
    \ in NumPy by calling the T attribute.\n\n```\n# transpose matrix\nfrom numpy\
    \ import array\n# define matrix\nA = array([\n    [1, 2],\n    [3, 4],\n    [5,\
