    \ variance is indicated as $s^2$, with 2 as a superscript, again showing that\
    \ the units are squared. NumPy also provides a function for calculating the standard\
    \ deviation directly via the `std()` function. As with the `var()` function, the\
    \ `ddof` argument must be set to 1 to calculate the unbiased sample standard deviation\
    \ and column and row standard deviations can be calculated by setting the axis\
    \ argument to 0 and 1 respectively. The example below demonstrates how to calculate\
    \ the sample standard deviation for the rows and columns of a matrix.\n\n```\n\
    # matrix standard deviation\nfrom numpy import array\nfrom numpy import std\n\
    # define matrix\nM = array([\n    [1,2,3,4,5,6],\n    [1,2,3,4,5,6]])\nprint(M)\n\
    # column standard deviations\ncol_std = std(M, ddof=1, axis=0)\nprint(col_std)\n\
    # row standard deviations\nrow_std = std(M, ddof=1, axis=1)\nprint(row_std)\n\
    ```\n\nListing 17.9: Example of calculating matrix standard deviations.\n\nRunning\
    \ the example first prints the defined matrix and then the column and row sample\
    \ standard deviation values.\n\n```\n[[1 2 3 4 5 6]\n [1 2 3 4 5 6]]\n```"
