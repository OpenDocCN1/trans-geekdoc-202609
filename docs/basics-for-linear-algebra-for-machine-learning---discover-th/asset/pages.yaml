    ```\n\nListing 14.2: Sample output from calculating an LU decomposition.\n\n#\
    \ 14.4 QR Decomposition\n\nThe QR decomposition is for n × m matrices (not limited\
    \ to square matrices) and decomposes\na matrix into Q and R components.\n\nA =\
    \ Q · R (14.4)\n\nOr, without the dot notation.\n\nA = QR (14.5)\n\nWhere A is\
    \ the matrix that we wish to decompose, Q a matrix with the size m × m, and R\
    \ is\nan upper triangle matrix with the size m × n. The QR decomposition is found\
    \ using an iterative\nnumerical method that can fail for those matrices that cannot\
    \ be decomposed, or decomposed\neasily. Like the LU decomposition, the QR decomposition\
    \ is often used to solve systems of\nlinear equations, although is not limited\
    \ to square matrices.\n\nThe QR decomposition can be implemented in NumPy using\
    \ the qr() function. By default,\nthe function returns the Q and R matrices with\
    \ smaller or reduced dimensions that is more"
