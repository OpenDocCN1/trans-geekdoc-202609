    The covariance can be normalized to a score between -1 and 1 to make the magnitude
    interpretable by dividing it by the standard deviation of X and Y. The result
    is called the correlation of the variables, also called the Pearson correlation
    coefficient, named for the developer of the method.


    \( r = \frac{cov(X, Y)}{s_X \times s_Y} \) (17.17)


    Where r is the correlation coefficient of X and Y, cov(X, Y) is the sample covariance
    of X and Y and s_X and s_Y are the standard deviations of X and Y respectively.
    NumPy provides the corrcoef() function for calculating the correlation between
    two variables directly. Like cov(), it returns a matrix, in this case a correlation
    matrix. As with the results from cov() we can access just the correlation of interest
    from the [0,1] value from the returned squared matrix.


    ```

    # vector correlation

    from numpy import array

