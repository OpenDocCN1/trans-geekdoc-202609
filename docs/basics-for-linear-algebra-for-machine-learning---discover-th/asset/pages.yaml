    # 9.6 Matrix-Vector Multiplication


    A matrix and a vector can be multiplied together as long as the rule of matrix
    multiplication is observed. Specifically, that the number of columns in the matrix
    must equal the number of items in the vector. As with matrix multiplication, the
    operation can be written using the dot notation. Because the vector only has one
    column, the result is always a vector.


    $c = A \cdot v$ (9.22)


    Or without the dot in a compact form.


    $c = Av$ (9.23)


    The result is a vector with the same number of rows as the parent matrix.


    $A = \begin{pmatrix} a_{1,1} & a_{1,2} \\ a_{2,1} & a_{2,2} \\ a_{3,1} & a_{3,2}
    \end{pmatrix}$ (9.24)


    $v = \begin{pmatrix} v_1 \\ v_2 \end{pmatrix}$ (9.25)


    $c = \begin{pmatrix} a_{1,1} \times v_1 + a_{1,2} \times v_2 \\ a_{2,1} \times
    v_1 + a_{2,2} \times v_2 \\ a_{3,1} \times v_1 + a_{3,2} \times v_2 \end{pmatrix}$
    (9.26)'
