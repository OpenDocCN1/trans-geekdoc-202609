    # 5.4 Array Slicing


    So far, so good; creating and indexing arrays looks familiar. Now we come to array
    slicing, and this is one feature that causes problems for beginners to Python
    and NumPy arrays. Structures like lists and NumPy arrays can be sliced. This means
    that a subsequence of the structure can be indexed and retrieved. This is most
    useful in machine learning when specifying input variables and output variables,
    or splitting training rows from testing rows. Slicing is specified using the colon
    operator : with a from and to index before and after the column respectively.
    The slice extends from the from index and ends one item before the to index.


    ```

    data[from:to]

    ```


    Listing 5.17: Example of the syntax of array slicing.


    # 5.4.1 One-Dimensional Slicing


    You can access all data in an array dimension by specifying the slice ‘:’ with
    no indexes.


    ```

    # slice a one-dimensional array

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    print(data[:])

    ```


    Listing 5.18: Example of slicing a one-dimensional array.


    Running the example prints all elements in the array.


    ```

    [11 22 33 44 55]

    ```


    Listing 5.19: Sample output from slicing a one-dimensional array.


    The first item of the array can be sliced by specifying a slice that starts at
    index 0 and ends at index 1 (one item before the to index).


    ```

    # slice a subset of a one-dimensional array

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    print(data[0:1])

    ```


    Listing 5.20: Example of slicing a subset of a one-dimensional array.


    Running the example returns a sub-array with the first element.


    ```

    [11]

    ```


    Listing 5.21: Sample output from slicing a subset of a one-dimensional array.'
