    \ 4. 5. 6.]\n[ 3.5 3.5]\n```\n```\n\nListing 17.4: Sample output from calculating\
    \ matrix means.\n\n# ## 17.3 Variance and Standard Deviation\n\nIn probability,\
    \ the variance of some random variable X is a measure of how much values in the\
    \ distribution vary on average with respect to the mean. The variance is denoted\
    \ as the function Var() on the variable.\n\n\\( Var[X] \\) (17.7)\n\nVariance\
    \ is calculated as the average squared difference of each value in the distribution\
    \ from the expected value. Or the expected squared difference from the expected\
    \ value.\n\n\\( Var[X] = E[(X - E[X])^2] \\) (17.8)\n\nAssuming the expected value\
    \ of the variable has been calculated (E[X]), the variance of the random variable\
    \ can be calculated as the sum of the squared difference of each example from\
    \ the expected value multiplied by the probability of that value.\n\n\\( Var[X]\
    \ = \\sum p(x_1) \\times (x_1 - E[X])^2, p(x_2) \\times (x_2 - E[X])^2, \\cdots,\
    \ p(x_n) \\times (x_n - E[X])^2 \\) (17.9)"
