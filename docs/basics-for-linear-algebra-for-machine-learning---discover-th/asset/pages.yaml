    \ in the new matrix.\n\n\\(C = \\begin{pmatrix} a_{1,1} \\times b_{1,1} & a_{1,2}\
    \ \\times b_{1,2} \\\\ a_{2,1} \\times b_{2,1} & a_{2,2} \\times b_{2,2} \\\\\
