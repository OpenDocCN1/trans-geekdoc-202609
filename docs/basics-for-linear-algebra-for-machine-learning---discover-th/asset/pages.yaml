  md: "# 10.4 Triangular Matrix\n\nA triangular matrix is a type of square matrix\
    \ that has all values in the upper-right or lower-left of the matrix with the\
    \ remaining elements filled with zero values. A triangular matrix with values\
    \ only above the main diagonal is called an upper triangular matrix. Whereas,\
    \ a triangular matrix with values only below the main diagonal is called a lower\
    \ triangular matrix. Below is an example of a 3 x 3 upper triangular matrix.\n\
    \n![](img/aa6336b23f772f63e5bedc91bdf02fe6_88_0.png)\n\nBelow is an example of\
    \ a 3 x 3 lower triangular matrix.\n\n![](img/aa6336b23f772f63e5bedc91bdf02fe6_88_1.png)\n\
    \nNumPy provides functions to calculate a triangular matrix from an existing square\
    \ matrix. The tril() function to calculate the lower triangular matrix from a\
    \ given matrix and the triu() to calculate the upper triangular matrix from a\
    \ given matrix The example below defines a 3 x 3 square matrix and calculates\
    \ the lower and upper triangular matrix from it.\n\n```\n# triangular matrices\n\
    from numpy import array\nfrom numpy import tril\nfrom numpy import triu\n# define\
    \ square matrix\nM = array([\n    [1, 2, 3],\n    [1, 2, 3],\n    [1, 2, 3]])\n\
    print(M)\n# lower triangular matrix\nlower = tril(M)\nprint(lower)\n# upper triangular\
    \ matrix\nupper = triu(M)\nprint(upper)\n```\n\nListing 10.1: Example of creating\
    \ a triangular matrices.\n\nRunning the example prints the defined matrix followed\
    \ by the lower and upper triangular matrices.\n\n```\n[[1 2 3]\n [1 2 3]\n [1\
    \ 2 3]]\n\n[[1 0 0]\n [1 2 0]\n [1 2 3]]\n\n[[1 2 3]\n [0 2 3]\n```"
  merge: -1
