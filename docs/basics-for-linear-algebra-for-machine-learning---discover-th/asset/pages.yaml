    # ## D.5 Sequence Notation


    Machine learning notation often describes an operation on a sequence. A sequence
    may be an array of data or a list of terms.


    # ### D.5.1 Indexing


    A key to reading notation for sequences is the notation of indexing elements in
    the sequence. Often the notation will specify the beginning and end of the sequence,
    such as 1 to _n_, where _n_ will be the extent or length of the sequence. Items
    in the sequence are index by a variable such as _i_, _j_, _k_ as a subscript.
    This is just like array notation. For example _a<sub>i</sub>_ is the _i<sup>th</sup>_
    element of the sequence _a_. If the sequence is two dimensional, two indices may
    be used, for example: _b<sub>i,j</sub>_ is the (_i,j_)<sup>_th_</sup> element
    of the sequence _b_.


    # ### D.5.2 Sequence Operations


    Mathematical operations can be performed over a sequence. Two operations are performed
    on sequences so often that they have their own shorthand, the sum and the multiplication.


    # #### Sequence Summation


    The sum over a sequence is denoted as the uppercase Greek letter sigma (\(\Sigma\)).
    It is specified with the variable and start of the sequence summation below the
    sigma (e.g. _i_ = 1) and the index of the end of the summation above the sigma
    (e.g. _n_).


    ```

    \sum_{i=1}^n a_i

    ```


    This is the sum of the sequence a starting at element 1 to element _n_.


    <sup>1</sup>https://en.wikipedia.org/wiki/Greek_letters_used_in_mathematics,_science,_and_engineering'
