- pgno: 211
  md: '# # How Far You Have Come


    You made it. Well done. Take a moment and look back at how far you have come.
    You now know:


    +   - What linear algebra is and why it is relevant and important to machine learning.

    +   - How to create, index, and generally manipulate data in NumPy arrays.

    +   - What a vector is and how to perform vector arithmetic and calculate vector
    norms.

    +   - What a matrix is and how to perform matrix arithmetic, including matrix
    multiplication.

    +   - A suite of types of matrices, their properties, and advanced operations
    involving matrices.

    +   - What a tensor is and how to perform basic tensor arithmetic.

    +   - Matrix factorization methods, including the eigendecomposition and singular-value
    decomposition.

    +   - How to calculate and interpret basic statistics using the tools of linear
    algebra.

    +   - How to implement methods using the tools of linear algebra, such as principal
    component analysis and linear least squares regression.


    Don’t make light of this. You have come a long way in a short amount of time.
    You have developed the important and valuable foundational skills in linear algebra.
    You can now confidently:


    +   - Read the linear algebra mathematics in machine learning papers.

    +   - Implement the linear algebra descriptions of machine learning algorithms.

    +   - Describe your machine learning models using the notation and operations
    of linear algebra.


    The sky’s the limit.


    # ## Thank You!


    I want to take a moment and sincerely thank you for letting me help you start
    your linear algebra journey. I hope you keep learning and have fun as you continue
    to master machine learning.


    Jason Brownlee 2018'
