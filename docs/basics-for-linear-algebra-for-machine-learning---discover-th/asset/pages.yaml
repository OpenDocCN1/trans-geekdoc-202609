    # # Matrices and Matrix Arithmetic


    Matrices are a foundational element of linear algebra. Matrices are used throughout
    the field of machine learning in the description of algorithms and processes such
    as the input data variable (X) when training an algorithm. In this tutorial, you
    will discover matrices in linear algebra and how to manipulate them in Python.
    After completing this tutorial, you will know:


    +   - What a matrix is and how to define one in Python with NumPy.

    +   - How to perform element-wise operations such as addition, subtraction, and
    the Hadamard product.

    +   - How to multiply matrices together and the intuition behind the operation.


    Let''s get started.


    # ## 9.1 Tutorial Overview


    This tutorial is divided into 6 parts; they are:


    +   1. What is a Matrix

    +   2. Defining a Matrix

    +   3. Matrix Arithmetic

    +   4. Matrix-Matrix Multiplication

    +   5. Matrix-Vector Multiplication

    +   6. Matrix-Scalar Multiplication


    # ## 9.2 What is a Matrix


    A matrix is a two-dimensional array of scalars with one or more columns and one
    or more rows.


    A matrix is a two-dimensional array (a table) of numbers.'
