  md: '# Appendix A


    # Getting Help


    This is just the beginning of your journey with linear algebra. As you start to
    work on projects and expand your existing knowledge of the techniques, you may
    need help. This appendix points out some of the best sources of help.


    # A.1 Linear Algebra on Wikipedia


    Wikipedia is a great place to start. All of the important topics are covered,
    the descriptions are concise, and the equations are consistent and readable. What
    is missing is the more human level descriptions such as analogies and intuitions.
    Nevertheless, when you have questions about linear algebra, I recommend stopping
    by Wikipedia first. Some good high-level pages to start on include:


    +   * Linear Algebra.

    +     https://en.wikipedia.org/wiki/Linear_algebra

    +   * Matrix (mathematics).

    +     https://en.wikipedia.org/wiki/Matrix_(mathematics)

    +   * Matrix decomposition.

    +     https://en.wikipedia.org/wiki/Matrix_decomposition

    +   * List of linear algebra topics.

    +     https://en.wikipedia.org/wiki/List_of_linear_algebra_topics


    # A.2 Linear Algebra Textbooks


    I strongly recommend getting a good textbook on the topic of linear algebra and
    using it as a reference. The benefit of a good textbook is that the explanations
    of the various operations you require will be consistent (or should be). The downside
    of textbooks is that they can be very expensive. A good textbook is often easy
    to spot because it will be the basis for a range of undergraduate or postgraduate
    courses at top universities. Some introductory textbooks on linear algebra I recommend
    include:'
  merge: -1
  img_proc: true
- pgno: 184
