    \ To do this we can perform an SVD operation on the original data and select the\
    \ top k largest singular values in \\(\\Sigma\\). These columns can be selected\
    \ from \\(\\Sigma\\) and the rows selected from \\(V^T\\). An approximate \\(B\\\
    ) of the original vector \\(A\\) can then be reconstructed.\n\n\\(B = U \\cdot\
    \ \\Sigma_k \\cdot V_k^T\\) (16.10)\n\nIn natural language processing, this approach\
    \ can be used on matrices of word occurrences or word frequencies in documents\
    \ and is called Latent Semantic Analysis or Latent Semantic Indexing. In practice,\
    \ we can retain and work with a descriptive subset of the data called \\(T\\).\
    \ This is a dense summary of the matrix or a projection.\n\n\\(T = U \\cdot \\\
    Sigma_k\\) (16.11)"
