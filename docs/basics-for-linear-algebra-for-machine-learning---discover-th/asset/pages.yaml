- pgno: 206
  md: '# Sequence Multiplication


    The multiplication over a sequence is denoted as the uppercase Greek letter pi
    (Π). It is specified in the same way as the sequence summation with the beginning
    and end of the operation below and above the letter respectively.


    ![](img/aa6336b23f772f63e5bedc91bdf02fe6_206_0.png)


    This is the product of the sequence a starting at element 1 to element n.


    # D.6 Set Notation


    A set is a group of unique items. We may see set notation used when defining terms
    in machine learning.


    # D.6.1 Set of Numbers


    A common set you may see is a set of numbers, such as a term defined as being
    within the set of integers or the set of real numbers. Some common sets of numbers
    you may see include:


    +   - Set of all natural numbers: ℕ

    +   - Set of all integers: ℤ

    +   - Set of all real numbers: ℝ


    There are other sets, see Special sets on Wikipedia². We often talk about real-values
    or real numbers when defining terms rather than floating point values, which are
    really discrete creations for operations in computers.


    # D.6.2 Set Membership


    It is common to see set membership in definitions of terms. Set membership is
    denoted as a symbol that looks like an uppercase “E” (∈).


    ![](img/aa6336b23f772f63e5bedc91bdf02fe6_206_1.png)


    Which means a is defined as being a member of the set ℝ or the set of real numbers.
    There is also a host of set operations, two common set operations include:


    +   - Union, or aggregation: \(A \cup B\)

    +   - Intersection, or overlap: \(A \cap B\)


    Learn more about sets on Wikipedia³.


    ²https://en.wikipedia.org/wiki/Set_(mathematics)#Special_sets

    ³https://en.wikipedia.org/wiki/Set_(mathematics)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # D.7 Other Notation


    There is other notation that you may come across. I try to lay some of it out
    in this section. It is common to define a method in the abstract and then define
    it again as a specific implementation with separate notation. For example, if
    we are estimating a variable x we may represent it using a notation that modifies
    the x, for example:


    +   - x-bar (x̄)

    +   - x-prime (x̊)

    +   - x-hat (x̂)

    +   - x-tilde (x̃)


    The same notation may have different meaning in a different context, such as use
    on different objects or sub-fields of mathematics. For example, a common point
    of confusion is |x|, which, depending on context can mean:


    +   - |x|: The absolute or positive value of x.

    +   - |x|: The length of the vector x.

    +   - |x|: The cardinality of the set x.


    This tutorial only covered the basics of mathematical notation. There are some
    subfields of mathematics that are more relevant to machine learning and should
    be reviewed in more detail. They are:


    +   - Linear Algebra.

    +   - Statistics.

    +   - Probability.

    +   - Calculus.


    And perhaps a little bit of multivariate analysis and information theory.


    # ## D.8 Tips for Getting More Help


    This section lists some tips that you can use when you are struggling with mathematical
    notation in machine learning.


    # ### D.8.1 Think About the Author


    People wrote the paper or book you are reading. People that can make mistakes,
    make omissions, and even make things confusing because they don''t fully understand
    what they are writing. Relax the constraints of the notation you are reading slightly
    and think about the intent of the author. What are they trying to get across?
    Perhaps you can even contact the author via email, Twitter, Facebook, Linked-in,
    etc, and seek clarification. Remember that academics want other people to understand
    and use their work (mostly).'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# D.8.2 Check Wikipedia\n\nWikipedia has lists of notation which can help narrow\
    \ down on the meaning or intent of the notation you are reading. Two places I\
    \ recommend you start are:\n\n+   • List of mathematical symbols on Wikipedia.\n\
    +   https://en.wikipedia.org/wiki/List_of_mathematical_symbols\n+   \n+   • Greek\
    \ letters used in mathematics, science, and engineering on Wikipedia.\n+   https://en.wikipedia.org/wiki/Greek_letters_used_in_mathematics,_science,_and_engineering\n\
    \n# D.8.3 Sketch in Code\n\nMathematical operations are just functions on data.\
    \ Map everything you’re reading to pseudocode with variables, for-loops and more.\
    \ You might want to use a scripting language as you go along with small arrays\
    \ of contrived data or even an Excel spreadsheet. As your reading and understanding\
    \ of the technique improves, your code-sketch of the technique will make more\
    \ sense and at the end you will have a mini prototype to play with.\n\nI never\
    \ used to take much stock in this approach until I saw an academic sketch out\
    \ a very complex paper in a few lines of Matlab with some contrived data. It knocked\
    \ my socks off because I believed the system had to be coded completely and run\
    \ with a real dataset and that the only option was to get the original code and\
    \ data. I was very wrong. Also, looking back, the guy was gifted. I now use this\
    \ method all the time and sketch techniques in Python.\n\n# D.8.4 Seek Alternatives\n\
    \nThere is a trick I use when I’m trying to understand a new technique. I find\
    \ and read all the papers that reference the paper I’m reading with the new technique.\
    \ Reading other academics interpretation and re-explanation of the technique can\
    \ often clarify my misunderstandings in the original description. Not always though.\
    \ Sometimes it can muddy the waters and introduce misleading explanations or new\
    \ notation. But more often than not, it helps. After circling back to the original\
    \ paper and re-reading it, I can often find cases where subsequent papers have\
    \ actually made errors and misinterpretations of the original method.\n\n# D.8.5\
    \ Post a Question\n\nThere are places online where people love to explain math\
    \ to others. Seriously! Consider taking a screen shot of the notation you are\
    \ struggling with, write out the full reference or link to it and put it and your\
    \ area of misunderstanding to a question and answer site. Two great places to\
    \ start are:\n\n+   • Mathematics Stack Exchange.\n+   https://math.stackexchange.com/\n\
