    A problem with this approach is the matrix inverse that is both computationally
    expensive and numerically unstable. An alternative approach is to use a matrix
    decomposition to avoid this operation. We will look at two examples in the following
    sections.


    # 19.6 Solve via QR Decomposition


    The QR decomposition is an approach of breaking a matrix down into its constituent
    elements.


    ```

    $$A = Q \cdot R$$ (19.13)

    ```


    Where $A$ is the matrix that we wish to decompose, $Q$ a matrix with the size
    $m \times m$, and $R$ is an upper triangle matrix with the size $m \times n$.
    The QR decomposition is a popular approach for solving the linear least squares
    equation. Stepping over all of the derivation, the coefficients can be found using
    the $Q$ and $R$ elements as follows:


    ```

    $$b = R^{-1} \cdot Q^T \cdot y$$ (19.14)

    ```


    The approach still involves a matrix inversion, but in this case only on the simpler
    $R$ matrix. The QR decomposition can be found using the `qr()` function in NumPy.
    The calculation of the coefficients in NumPy looks as follows:'
