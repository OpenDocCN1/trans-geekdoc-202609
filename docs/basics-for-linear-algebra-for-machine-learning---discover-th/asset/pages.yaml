  md: "The intuition for the matrix multiplication is that we are calculating the\
    \ dot product between each row in matrix A with each column in matrix B. For example,\
    \ we can step down rows of column A and multiply each with column 1 in B to give\
    \ the scalar values in column 1 of C. Below describes the matrix multiplication\
    \ using matrix notation.\n\nA = \\begin{pmatrix} a_{1,1} & a_{1,2} \\\\ a_{2,1}\
    \ & a_{2,2} \\\\ a_{3,1} & a_{3,2} \\end{pmatrix} (9.18)\n\nB = \\begin{pmatrix}\
    \ b_{1,1} & b_{1,2} \\\\ b_{2,1} & b_{2,2} \\end{pmatrix} (9.19)\n\nC = \\begin{pmatrix}\
    \ a_{1,1} \\times b_{1,1} + a_{1,2} \\times b_{2,1}, a_{1,1} \\times b_{1,2} +\
    \ a_{1,2} \\times b_{2,2} \\\\ a_{2,1} \\times b_{1,1} + a_{2,2} \\times b_{2,1},\
    \ a_{2,1} \\times b_{1,2} + a_{2,2} \\times b_{2,2} \\\\ a_{3,1} \\times b_{1,1}\
    \ + a_{3,2} \\times b_{2,1}, a_{3,1} \\times b_{1,2} + a_{3,2} \\times b_{2,2}\
    \ \\end{pmatrix} (9.20)\n\nWe can describe the matrix multiplication operation\
    \ using array notation.\n\nC[0, 0] = A[0, 0] x B[0, 0] + A[0, 1] x B[1, 0]\nC[1,\
    \ 0] = A[1, 0] x B[0, 0] + A[1, 1] x B[1, 0]\nC[2, 0] = A[2, 0] x B[0, 0] + A[2,\
    \ 1] x B[1, 0]\nC[0, 1] = A[0, 0] x B[0, 1] + A[0, 1] x B[1, 1]\nC[1, 1] = A[1,\
    \ 0] x B[0, 1] + A[1, 1] x B[1, 1]\nC[2, 1] = A[2, 0] x B[0, 1] + A[2, 1] x B[1,\
    \ 1] (9.21)\n\nThe matrix multiplication operation can be implemented in NumPy\
    \ using the dot() function. It can also be calculated using the newer @ operator,\
    \ since Python version 3.5. The example below demonstrates both methods.\n\n```\n\
    # matrix dot product\nfrom numpy import array\n# define first matrix\nA = array([\n\
