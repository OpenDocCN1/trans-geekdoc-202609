    # 5.5.2 Reshape 1D to 2D Array


    It is common to need to reshape a one-dimensional array into a two-dimensional
    array with one column and multiple arrays. NumPy provides the reshape() function
    on the NumPy array object that can be used to reshape the data. The reshape()
    function takes a single argument that specifies the new shape of the array. In
    the case of reshaping a one-dimensional array into a two-dimensional array with
    one column, the tuple would be the shape of the array as the first dimension (data.shape[0])
    and 1 for the second dimension.


    ```

    ```

    data = data.reshape((data.shape[0], 1))

    ```

    ```


    Listing 5.38: Example the reshape() function for reshaping from 1D to 2D data.


    Putting this all together, we get the following worked example.


    ```

    ```

    # reshape 1D array to 2D

    from numpy import array

    # define array

    data = array([11, 22, 33, 44, 55])

    print(data.shape)

    # reshape

    data = data.reshape((data.shape[0], 1))

    print(data.shape)

    ```

    ```


    Listing 5.39: Example of changing the shape of a one-dimensional array with the
    reshape() function.


    Running the example prints the shape of the one-dimensional array, reshapes the
    array to have 5 rows with 1 column, then prints this new shape.


    ```

    ```

    (5,)

    (5, 1)

    ```

    ```


    Listing 5.40: Sample output of changing the shape of a one-dimensional array with
    the reshape() function.'
