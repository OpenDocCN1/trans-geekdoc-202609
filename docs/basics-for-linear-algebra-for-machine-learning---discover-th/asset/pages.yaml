  md: "# 12.6 Sparse Matrices in Python\n\nSciPy provides tools for creating sparse\
    \ matrices using multiple data structures, as well as tools for converting a dense\
    \ matrix to a sparse matrix. Many linear algebra NumPy and SciPy functions that\
    \ operate on NumPy arrays can transparently operate on SciPy sparse arrays. Further,\
    \ machine learning libraries that use NumPy data structures can also operate transparently\
    \ on SciPy sparse arrays, such as scikit-learn for general machine learning and\
    \ Keras for deep learning.\n\nA dense matrix stored in a NumPy array can be converted\
    \ into a sparse matrix using the CSR representation by calling the `csr_matrix()`\
    \ function. In the example below, we define a $3 \\times 6$ sparse matrix as a\
    \ dense array (e.g. an `ndarray`), convert it to a CSR sparse representation,\
    \ and then convert it back to a dense array by calling the `todense()` function.\n\
    \n```\n# sparse matrix\nfrom numpy import array\nfrom scipy.sparse import csr_matrix\n\
    # create dense matrix\nA = array([\n    [1, 0, 0, 1, 0, 0],\n    [0, 0, 2, 0,\
    \ 0, 1],\n    [0, 0, 0, 2, 0, 0]])\nprint(A)\n# convert to sparse matrix (CSR\
    \ method)\nS = csr_matrix(A)\nprint(S)\n# reconstruct dense matrix\nB = S.todense()\n\
    print(B)\n```\n\nListing 12.1: Example of converting between dense and sparse\
    \ matrices.\n\nRunning the example first prints the defined dense array, followed\
    \ by the CSR representation, and then the reconstructed dense matrix.\n\n```\n\
    [[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n\n(0, 0) 1\n(0, 3) 1\n(1, 2)\
    \ 2\n(1, 5) 1\n(2, 3) 2\n\n[[1 0 0 1 0 0]\n [0 0 2 0 0 1]\n [0 0 0 2 0 0]]\n```\n\
    \nListing 12.2: Sample output from converting between dense and sparse matrices.\n\
    \nNumPy does not provide a function to calculate the sparsity of a matrix. Nevertheless,\
    \ we can calculate it easily by first finding the density of the matrix and subtracting\
    \ it from one. The number of non-zero elements in a NumPy array can be given by\
    \ the `count_nonzero()` function and the total number of elements in the array\
    \ can be given by the size property of the array. Array sparsity can therefore\
    \ be calculated as"
