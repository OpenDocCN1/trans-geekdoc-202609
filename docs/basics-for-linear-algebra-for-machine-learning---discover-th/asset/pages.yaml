    # 10.5 Diagonal Matrix


    A diagonal matrix is one where values outside of the main diagonal have a zero
    value, where the main diagonal is taken from the top left of the matrix to the
    bottom right. A diagonal matrix is often denoted with the variable D and may be
    represented as a full matrix or as a vector of values on the main diagonal.


    Diagonal matrices consist mostly of zeros and have non-zero entries only along
    the main diagonal.


    > — Page 40, Deep Learning, 2016.


    Below is an example of a 3 x 3 square diagonal matrix.


    D = \(\begin{pmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \\ 0 & 0 & 3 \end{pmatrix}\) (10.7)


    As a vector, it would be represented as:


    d = \(\begin{pmatrix} d_{1,1} \\ d_{2,2} \\ d_{3,3} \end{pmatrix}\) (10.8)


    Or, with the specified scalar values:


    d = \(\begin{pmatrix} 1 \\ 2 \\ 3 \end{pmatrix}\) (10.9)


    A diagonal matrix does not have to be square. In the case of a rectangular matrix,
    the diagonal would cover the dimension with the smallest length; for example:


    D = \(\begin{pmatrix} 1 & 0 & 0 & 0 \\ 0 & 2 & 0 & 0 \\ 0 & 0 & 3 & 0 \\ 0 & 0
    & 0 & 4 \\ 0 & 0 & 0 & 0 \end{pmatrix}\) (10.10)


    NumPy provides the function diag() that can create a diagonal matrix from an existing
    matrix, or transform a vector into a diagonal matrix. The example below defines
    a 3 x 3 square matrix, extracts the main diagonal as a vector, and then creates
    a diagonal matrix from the extracted vector.'
