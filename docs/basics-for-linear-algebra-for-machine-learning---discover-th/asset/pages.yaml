    # 10.7 Orthogonal Matrix\n\nTwo vectors are orthogonal when their dot product\
    \ equals zero. The length of each vector is 1 then the vectors are called orthonormal\
    \ because they are both orthogonal and normalized.\n\n$v \\cdot w = 0$\n\nor\n\
    \n$v \\cdot w^T = 0$\n\nThis is intuitive when we consider that one line is orthogonal\
    \ with another if it is perpendicular to it. An orthogonal matrix is a type of\
    \ square matrix whose columns and rows are orthonormal unit vectors, e.g. perpendicular\
    \ and have a length or magnitude of 1.\n\nAn orthogonal matrix is a square matrix\
    \ whose rows are mutually orthonormal and whose columns are mutually orthonormal\n\
    \n> — Page 41, Deep Learning, 2016.\n\nAn Orthogonal matrix is often denoted as\
    \ uppercase Q.\n\nMultiplication by an orthogonal matrix preserves lengths.\n\n\
    > — Page 277, No Bullshit Guide To Linear Algebra, 2017.\n\nThe Orthogonal matrix\
    \ is defined formally as follows:\n\n$Q^T \\cdot Q = Q \\cdot Q^T = I$"
