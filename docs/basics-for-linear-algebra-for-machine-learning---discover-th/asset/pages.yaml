    \ each dimension in the 2D array, reshapes the array, then summarizes the shape\
    \ of the new 3D array.\n\n```\n(3, 2)\n(3, 2, 1)\n```\n\nListing 5.43: Sample\
    \ output of changing the shape of a two-dimensional array with the reshape() function.\n\
