- pgno: 127
  md: "economical. We can change this to return the expected sizes of m × m for Q\
    \ and m × n for R by specifying the mode argument as ‘complete’, although this\
    \ is not required for most applications. The example below defines a 3 × 2 matrix,\
    \ calculates the QR decomposition, then reconstructs the original matrix from\
    \ the decomposed elements.\n\n```\n# QR decomposition\nfrom numpy import array\n\
    from numpy.linalg import qr\n# define rectangular matrix\nA = array([\n    [1,\
    \ 2],\n    [3, 4],\n    [5, 6]])\nprint(A)\n# factorize\nQ, R = qr(A, 'complete')\n\
    print(Q)\nprint(R)\n# reconstruct\nB = Q.dot(R)\nprint(B)\n```\n\nListing 14.3:\
    \ Example of calculating an QR decomposition.\n\nRunning the example first prints\
