    # 5.4.2 Two-Dimensional Slicing


    Let''s look at the two examples of two-dimensional slicing you are most likely
    to use in machine learning.


    # Split Input and Output Features


    It is common to split your loaded data into input variables (X) and the output
    variable (y). We can do this by slicing all rows and all columns up to, but before
    the last column, then separately indexing the last column. For the input features,
    we can select all rows and all columns except the last one by specifying : for
    in the rows index, and :-1 in the columns index.


    ```

    X = [:, :-1]

    ```


    Listing 5.24: Example of slicing input variables.


    For the output column, we can select all rows again using : and index just the
    last column by specifying the -1 index.


    ```

    y = [:, -1]

    ```


    Listing 5.25: Example of slicing the output variable.


    Putting all of this together, we can separate a 3-column 2D dataset into input
    and output data as follows:


    ```

    # split input and output data

    from numpy import array

    # define array

    data = array([

    [11, 22, 33],

    [44, 55, 66],

    [77, 88, 99]])

    # separate data

    X, y = data[:, :-1], data[:, -1]

    print(X)

    print(y)

    ```


    Listing 5.26: Example of slicing a dataset into input and output variables.'
