  img_proc: true
- pgno: 152
  md: 'It is calculated as the probability weighted sum of values that can be drawn.


    $E[X] = \sum x_1 \times p_1, x_2 \times p_2, x_3 \times p_3, \cdots, x_n \times
    p_n$ (17.2)


    In simple cases, such as the flipping of a coin or rolling a dice, the probability
    of each event is just as likely. Therefore, the expected value can be calculated
    as the sum of all values multiplied by the reciprocal of the number of values.


    $E[X] = \frac{1}{n} \times \sum x_1, x_2, x_3, \cdots, x_n$ (17.3)


    In statistics, the mean, or more technically the arithmetic mean or sample mean,
    can be estimated from a sample of examples drawn from the domain. It is confusing
    because mean, average, and expected value are used interchangeably. In the abstract,
    the mean is denoted by the lower case Greek letter mu \(\mu\) and is calculated
    from the sample of observations, rather than all possible values.


    \(\mu = \frac{1}{n} \times \sum x_1, x_2, x_3, \cdots, x_n\) (17.4)


    Or, written more compactly:


    \(\mu = P(x) \times \sum x\) (17.5)


    Where \(x\) is the vector of observations and \(P(x)\) is the calculated probability
    for each value. When calculated for a specific variable, such as \(x\), the mean
    is denoted as a lower case variable name with a line above, called x-bar e.g.
    \(\bar{x}\).


    \(\bar{x} = \frac{1}{n} \times \sum_{i=1}^{n} x_i\) (17.6)


    The arithmetic mean can be calculated for a vector or matrix in NumPy by using
    the `mean()` function. The example below defines a 6-element vector and calculates
    the mean.


    ```

    # vector mean

    from numpy import array

    from numpy import mean

    # define vector

    v = array([1,2,3,4,5,6])

    print(v)

    # calculate mean

    result = mean(v)

    print(result)

    ```


    Listing 17.1: Example of calculating a vector mean.


    Running the example first prints the defined vector and the mean of the values
    in the vector.


    ```

    [1 2 3 4 5 6]

    3.5

    ```


    Listing 17.2: Sample output from calculating a vector mean.'
