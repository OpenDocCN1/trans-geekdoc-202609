  md: "# 13.4 Tensor Arithmetic\n\nAs with matrices, we can perform element-wise arithmetic\
    \ between tensors. In this section, we will work through the four main arithmetic\
    \ operations.\n\n# 13.4.1 Tensor Addition\n\nThe element-wise addition of two\
    \ tensors with the same dimensions results in a new tensor with the same dimensions\
    \ where each scalar value is the element-wise addition of the scalars in the parent\
    \ tensors.\n\n\\( A = \\begin{pmatrix} a_{1,1,1} & a_{1,2,1} & a_{1,3,1} \\\\\
    \ a_{2,1,1} & a_{2,2,1} & a_{2,3,1} \\end{pmatrix}, \\begin{pmatrix} a_{1,1,2}\
    \ & a_{1,2,2} & a_{1,3,2} \\\\ a_{2,1,2} & a_{2,2,2} & a_{2,3,2} \\end{pmatrix}\
    \ \\) (13.2)\n\n\\( B = \\begin{pmatrix} b_{1,1,1} & b_{1,2,1} & b_{1,3,1} \\\\\
    \ b_{2,1,1} & b_{2,2,1} & b_{2,3,1} \\end{pmatrix}, \\begin{pmatrix} b_{1,1,2}\
    \ & b_{1,2,2} & b_{1,3,2} \\\\ b_{2,1,2} & b_{2,2,2} & b_{2,3,2} \\end{pmatrix}\
    \ \\) (13.3)\n\n\\( C = A + B \\) (13.4)\n\n\\( C = \\begin{pmatrix} a_{1,1,1}\
    \ + b_{1,1,1} & a_{1,2,1} + b_{1,2,1} & a_{1,3,1} + b_{1,3,1} \\\\ a_{2,1,1} +\
    \ b_{2,1,1} & a_{2,2,1} + b_{2,2,1} & a_{2,3,1} + b_{2,3,1} \\end{pmatrix}, \\\
