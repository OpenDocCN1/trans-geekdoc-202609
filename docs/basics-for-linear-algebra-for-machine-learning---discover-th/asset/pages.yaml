  md: '# Chapter 11


    # Matrix Operations


    Matrix operations are used in the description of many machine learning algorithms.
    Some operations can be used directly to solve key equations, whereas others provide
    useful shorthand or foundation in the description and the use of more complex
    matrix operations. In this tutorial, you will discover important linear algebra
    matrix operations used in the description of machine learning methods. After completing
    this tutorial, you will know:


    +   - The Transpose operation for flipping the dimensions of a matrix.

    +   - The Inverse operations used in solving systems of linear equations.

    +   - The Trace and Determinant operations used as shorthand notation in other
    matrix operations.


    Let''s get started.


    # 11.1 Tutorial Overview


    This tutorial is divided into 5 parts; they are:


    +   1. Transpose

    +   2. Inverse

    +   3. Trace

    +   4. Determinant

    +   5. Rank


    # 11.2 Transpose


    A defined matrix can be transposed, which creates a new matrix with the number
    of columns and rows flipped. This is denoted by the superscript _T_ next to the
    matrix _A<sup>T</sup>_.


    ```

    C = A^T

    (11.1)

    ```'
