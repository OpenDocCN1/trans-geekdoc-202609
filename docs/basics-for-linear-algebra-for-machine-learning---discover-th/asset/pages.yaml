    # 4.2 NumPy N-dimensional Array


    NumPy is a Python library that can be used for scientific and numerical applications
    and is the tool to use for linear algebra operations. The main data structure
    in NumPy is the `ndarray`, which is a shorthand name for N-dimensional array.
    When working with NumPy, data in an `ndarray` is simply referred to as an array.
    It is a fixed-sized array in memory that contains data of the same type, such
    as integers or floating point values.


    The data type supported by an array can be accessed via the `dtype` attribute
    on the array. The dimensions of an array can be accessed via the `shape` attribute
    that returns a tuple describing the length of each dimension. There are a host
    of other attributes. A simple way'
