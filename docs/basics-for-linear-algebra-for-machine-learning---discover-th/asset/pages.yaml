- pgno: 141
  md: "We can achieve this by creating a new \\(\\Sigma\\) matrix of all zero values\
    \ that is \\(m \\times n\\) (e.g. more rows) and populate the first \\(n \\times\
    \ n\\) part of the matrix with the square diagonal matrix calculated via `diag()`.\n\
    \n```\n# reconstruct rectangular matrix from svd\nfrom numpy import array\nfrom\
    \ numpy import diag\nfrom numpy import zeros\nfrom scipy.linalg import svd\n#\
    \ define matrix\nA = array([\n    [1, 2],\n    [3, 4],\n    [5, 6]])\nprint(A)\n\
    # factorize\nU, s, V = svd(A)\n# create m x n Sigma matrix\nSigma = zeros((A.shape[0],\
    \ A.shape[1]))\n# populate Sigma with n x n diagonal matrix\nSigma[:A.shape[1],\
