  md: '# # Chapter 6


    # # NumPy Array Broadcasting


    Arrays with different sizes cannot be added, subtracted, or generally be used
    in arithmetic. A way to overcome this is to duplicate the smaller array so that
    it has the dimensionality and size as the larger array. This is called array broadcasting
    and is available in NumPy when performing array arithmetic, which can greatly
    reduce and simplify your code. In this tutorial, you will discover the concept
    of array broadcasting and how to implement it in NumPy. After completing this
    tutorial, you will know:


    +   - The problem of arithmetic with arrays with different sizes.

    +   - The solution of broadcasting and common examples in one and two dimensions.

    +   - The rule of array broadcasting and when broadcasting fails.


    Let''s get started.


    # ## 6.1 Tutorial Overview


    This tutorial is divided into 4 parts; they are:


    +   1. Limitation with Array Arithmetic

    +   2. Array Broadcasting

    +   3. Broadcasting in NumPy

    +   4. Limitations of Broadcasting


    # ## 6.2 Limitation with Array Arithmetic


    You can perform arithmetic directly on NumPy arrays, such as addition and subtraction.
    For example, two arrays can be added together to create a new array where the
    values at each index are added together. For example, an array a can be defined
    as [1, 2, 3] and array b can be defined as [1, 2, 3] and adding together will
    result in a new array with the values [2, 4, 6].'
  merge: -1
  img_proc: true
- pgno: 51
  md: "```\na = [1, 2, 3]\nb = [1, 2, 3]\nc = a + b\nc = [1 + 1, 2 + 2, 3 + 3]\n```\n\
    \nStrictly, arithmetic may only be performed on arrays that have the same dimensions\
    \ and dimensions with the same size. This means that a one-dimensional array with\
    \ the length of 10 can only perform arithmetic with another one-dimensional array\
    \ with the length 10. This limitation on array arithmetic is quite limiting indeed.\
    \ Thankfully, NumPy provides a built-in workaround to allow arithmetic between\
    \ arrays with differing sizes.\n\n# 6.3 Array Broadcasting\n\nBroadcasting is\
    \ the name given to the method that NumPy uses to allow array arithmetic between\
    \ arrays with a different shape or size. Although the technique was developed\
    \ for NumPy, it has also been adopted more broadly in other numerical computational\
    \ libraries, such as Theano, TensorFlow, and Octave. Broadcasting solves the problem\
    \ of arithmetic between arrays of differing shapes by in effect replicating the\
    \ smaller array along the last mismatched dimension.\n\n> Vectors are built from\
    \ components, which are ordinary numbers. You can think of a vector as a list\
    \ of numbers, and vector algebra as operations performed on the numbers in the\
    \ list.\n> \n> — Broadcasting, SciPy.org.\n\nNumPy does not actually duplicate\
    \ the smaller array; instead, it makes memory and computationally efficient use\
    \ of existing structures in memory that in effect achieve the same result. The\
    \ concept has also permeated linear algebra notation to simplify the explanation\
    \ of simple operations.\n\n> In the context of deep learning, we also use some\
    \ less conventional notation. We allow the addition of matrix and a vector, yielding\
    \ another matrix: C = A+b, where Ci,j = Ai,j + bj. In other words, the vector\
    \ b is added to each row of the matrix. This shorthand eliminates the need to\
    \ define a matrix with b copied into each row before doing the addition. This\
    \ implicit copying of b to many locations is called broadcasting.\n> \n> — Page\
    \ 34, Deep Learning, 2016.\n\n# 6.4 Broadcasting in NumPy\n\nWe can make broadcasting\
    \ concrete by looking at three examples in NumPy. The examples in this section\
    \ are not exhaustive, but instead are common to the types of broadcasting you\
    \ may see or implement."
  merge: -1
  img_proc: true
