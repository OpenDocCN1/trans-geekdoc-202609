  md: "# 9.4.1 Matrix Addition\n\nTwo matrices with the same dimensions can be added\
    \ together to create a new third matrix.\n\nC = A + B\n\nThe scalar elements in\
    \ the resulting matrix are calculated as the addition of the elements in each\
    \ of the matrices being added.\n\nC = \\begin{pmatrix} a_{1,1} + b_{1,1} & a_{1,2}\
    \ + b_{1,2} \\\\ a_{2,1} + b_{2,1} & a_{2,2} + b_{2,2} \\\\ a_{3,1} + b_{3,1}\
    \ & a_{3,2} + b_{3,2} \\end{pmatrix}\n\nOr, put another way:\n\nC[0, 0] = A[0,\
    \ 0] + B[0, 0]\nC[1, 0] = A[1, 0] + B[1, 0]\nC[2, 0] = A[2, 0] + B[2, 0]\nC[0,\
    \ 1] = A[0, 1] + B[0, 1]\nC[1, 1] = A[1, 1] + B[1, 1]\nC[2, 1] = A[2, 1] + B[2,\
    \ 1]\n\nWe can implement this in Python using the plus operator directly on the\
    \ two NumPy arrays.\n\n```\n# matrix addition\nfrom numpy import array\n# define\
