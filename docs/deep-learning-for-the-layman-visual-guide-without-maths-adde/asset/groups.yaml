    # 7. Other Deep Learning Algorithms


    # Recurrent Neural Networks


    In traditional neural networks, all inputs and outputs are independent of one
    another. In recurrent neural networks, this condition is not valid, and sequential
    information is used. Recurrent neural networks are reliant on preceding computations
    as well as on what has previously been calculated.


    Recurrent neural networks can be conceptualized as a neural network that has been
    unrolled over time. When you have different layers in a regular neural network,
    you apply the same layer to the input at each time step in a recurrent neural
    network, using the output, i.e. the state of the previous time step, as input.
    Connections between entities in a recurrent neural network form a directed cycle,
    creating a sort of internal memory that helps the model leverage long chains of
    dependencies.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_78_0.png)


    Figure 7.1: Recurrent Neural Network Algorithm


    # Recursive Neural Network


    A recursive neural network is a generalization of a recurrent neural network and
    is generated by applying a fixed and consistent set of weights repetitively, or
    recursively, over the structure. Recursive neural networks take the form of a
    tree, while recurrent neural networks are in the form of a chain. Recursive neural
    networks have been utilized in natural language processing for tasks such as sentiment
    analysis.'
