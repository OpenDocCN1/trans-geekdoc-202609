    在上面的图中，你可以看到 Google 如何在其各种产品中使用机器学习。机器学习/深度学习的应用是无处不在的，你只需要寻找正确的机会即可！


    ## 未来趋势


    上面的文字将让你对机器学习、深度学习以及它们之间的区别有一个大致的了解。


    首先，考虑到工业界对数据科学和机器学习日益增长的使用趋势，对于每一家想要生存并在行业中融入机器学习的公司来说，这将比以往任何时候都更加重要。此外，每个个人都被期望掌握基础术语。


    - 深度学习每天都在震撼我们，并在不久的将来将继续如此。这是因为深度学习已被证明是目前发现的具有顶级性能的卓越技术之一。

    - 机器学习和深度学习的研究在不断进行。然而，与过去研究局限于学术界不同，机器学习和深度学习的研究在工业界和学术界都在爆发。随着比以往任何时候更多的资金可用，它可能在人类整体发展中发挥关键作用。


    ## 3. 人工神经网络：是什么？为什么？


    ### 本章目标


    在本章结束时，读者应该学会：


    - 人工神经网络架构

    - 人工神经网络应用


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_40_0.png)


    ## 章节介绍


    正如你之前学到的，深度学习的实现是通过引入和使用人工神经网络。这些网络是为了反映动物大脑中工作的生物神经网络而开发的，使其能够作为独立生物体发挥功能。这些系统具有自我学习的能力，使它们能够逐步提高自己的知识和能力。这些系统背后的思想是，它们可以学会自己执行任务，而不需要特殊的编程或人类的干预来教它们如何做，就像真正的动物一样。


    人工神经网络工作的一个很好的例子是观察它们如何对包含狗的图片做出反应。例如，如果有一个程序标记了“狗”和“不是狗”，人工神经网络将开始识别图片中的哪个元素实际上是狗。结果是，它就知道狗长什么样了。从那以后，它将能够识别狗，并对狗是什么有深刻的理解。这就像你教婴儿识别狗一样。起初，你必须教他们如何做，但在他们能够在任何情况下识别狗之后，他们就可以发展出关于狗的信息，例如它们长什么样、什么定义了狗，以及什么不是。例如，他们将能够通过外貌将狗和猫区分开来，以后通过动作和声音来区分。人工神经网络具有这种能力，使其能够成为它们自己的独立物种。


    开发人工神经网络需要大量的连接单元。这些单元被称为人工神经元，它们的创建是为了模仿生物大脑中的轴突，轴突是神经元的一种。每个神经元都有与其他神经元的连接，这被称为突触。突触用于将信号传输到人工神经网络中的其他神经元。就像动物大脑一样，接收到的神经元可以向序列中的其他神经元发出信号，允许人工神经网络运行得像动物大脑一样。序列化的结果是某些信号和消息发送到整个大脑，导致连接在大脑上的身体以各种独特的方式行动、反应和响应。


    在真正的动物大脑中，神经元被组织成一系列。这些层中的每一层都负责帮助大脑执行不同的任务，每一层本质上都专注于某些信息和转换。它可以接收从一个神经元到下一个神经元的传输，以便将信号从第一个输入层传到最后一个输出层。最初，负责处理和创建人工神经网络的科学家试图完全模仿动物大脑，这就是为什么它是这样构建的。然而，后来他们决定在每个产物中创建特定的能力，以便每一个都专业化。


    迄为止，科学家和研究人员已经使用人工神经网络创建了能够完成各种任务的系统。这些任务包括从语音识别到计算机视觉、游戏中的计算机对手，甚至是医疗诊断系统。尽管人工神经网络已经变得非常有才华，并且远超最初的人工神经网络，但与人类大脑相比，它们仍然非常简单。在本书出版时，它们还与虫的大脑进行了比较。然而，尽管只被认为具有与虫脑相当的能力，但它们已经能够完成许多远比虫能做的更先进的任务。


    ## 神经网络概述


    正如我们所知，计算机具有用于计算的处理器和内存。它们在短时间内执行复杂的计算，但它们的适应性并不强。神经网络的引入了一种不同于传统计算机的解决问题的方法。在过去的十年里，神经网络收到了大量的关注。它们被广泛使用是因为它们会对意外输入做出反应。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_42_0.png)


    图 3.1: 神经系统的框图表示


    从左到右的箭头表示携带信息的信号在系统中正向传输，而从右到左的箭头显示反馈。大脑与计算机的比较见表 3.1。


    | 特性 | 大脑 | 计算机 |

    |---|---|---|

    | 处理单元数量 | $\approx10^{11}$ | $\approx10^{9}$ |

    | 计算类型 | 神经元 | 大规模并行 通常是串行 |

    | 数据存储 | | 基于地址 |

    | 切换时间 | $\approx10^{-3}$s | $\approx10^{-9}$s |

    | 可能的切换操作 | $\approx10^{13}\frac{1}{4}}$ | $\approx10^{18}\frac{1}{2}}$ |

    | 实际切换操作 | $\approx10^{12}\frac{1}{2}}$ | $\approx10^{16}\frac{1}{2}}$ |


