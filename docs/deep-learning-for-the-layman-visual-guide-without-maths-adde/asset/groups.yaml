    # 神经网络的应用


    神经网络的应用可以分为以下几类。


    ## 聚类


    聚类算法探索模式之间的相似性，并将相似的模式放在一个聚类中。最为人知的应用包括数据压缩和数据挖掘。


    ## 分类与模式识别


    一个例子是将一个信息设计（如手画的图像）分配到许多类别中的某一个。这种分类包含了算法的使用，例如熟悉记忆。


    ## 函数近似


    函数近似的任务是寻找一个受噪声影响的未知函数的估计值。各种工程和科学领域都需要函数近似。


    ## 预测与动力学系统


    任务是预测（时间序列数据）的未来值。预测显著影响了情感支持网络的选择。与函数近似不同，预测考虑了时间因素。在这里，框架根据框架状态（时间）为相似的信息提供独特的执行结果。


    以下是人脸识别的示例，这只是为了帮助理解大规模人工神经网络（ANN）如何运作的一个心理构图。在这个阶段，你只需要阅读这个示例并思考 ANN 的架构。


    假设我们想为计算机视觉应用构建一个网络。更具体地说，我们的网络用于识别人脸和面部表情。这是一个已经实现的示例。所有信息、程序代码、数据等都可以在 http://www.cs.cmu.edu/afs/cs.cmu.edu/user/mitchell/ftp/faces.html
    找到。


    目标是分类具有各种面部表情和姿态的不同人的脸图像。收集了 20 个不同人的图像，每人最多 32 张。引入了以下变量：


    - 表情（快乐、悲伤、愤怒、中性）

    - 视线（左、右、正前方、上方）

    - 眼镜（有或无）


    总共收集了 624 张灰度图像，每张图像的分辨率为 30x32 像素，强度值在 0 到 255 之间。这里介绍的网络任务只是确定输入图像中显示的脸姿态（左、右、上、正前）。


    它使用了：


    - 960 个输入单元（图像中的每个像素一个）

    - 3 个隐藏单元

    - 4 个输出神经元（每个姿态一个）


    每个输出单元接收一个额外的输入，该输入始终为 1。


    通过改变此输入的权重，反向传播算法可以调整网络输入信号的偏移量。它们的值由亮度表示（从黑色 = -1 到白色 = 1）。每个 30x32 的矩阵代表三个隐藏层单元之一的权重。每行的四个正方形代表一个输出神经元的权重（三个用于隐藏单元信号的权重，以及一个用于常数信号的权重！）。训练后，网络能够正确分类
    90% 的新（非训练）人脸。


    # 人工神经网络面临的挑战


    尽管人工神经网络非常强大且具有革命性，但它们面临着许多需要开发者解决的挑战。它们体积庞大、运行缓慢，并且只能执行最小的任务。


    使用人工神经网络完成任何基本功能所需的计算时间非常长。虽然观察机器通过人工神经网络完成其中的某些事情确实引人入胜，但这并不合理。由于许多研究人员和开发者希望看到深度学习机器用于各种社会功能，尽管它们目前仍仍一定程度上被使用，但其流行已远不如最初了。最终，开发者决定建立一种形式的“人工神经网络
    2.0”。也就是说，他们创建了深度神经网络，你将在接下来的章节中学习它们。


    在涉及深度学习时，人工神经网络是方程中的“如何做”部分。它们负责促进一个使深度学习能够发生的网络。没有人工神经网络，就没有深度学习。就像的大脑一样，这些网络负责连接到深度学习系统的工智能的发展和增长。如果它们不存在，系统本质上将是空虚的。它们将消失，不再有深度学习。如果我们没有自己的大脑，情况也是如此。正如你所看到的，深度学习远不止人工神经网络，但如果没有它们，也将无从起。它们是整个系统的核心组成部分。


    # 4. 深度学习的概述


    ### 本章目标

    在本章结束时，读者应该学到：


    - 人工智能与深度学习之间的联系

    - GPU 与 CPU 的重要性

    - 三类分类法

    - 深度学习的循环方法


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_57_0.png)


    深度学习


    人工神经网络是深度学习的基础，但深度网络的发展远超人工神经网络。自从人工神经网络开发以来，科学家和研究人员一直致力于开发和使用深度网络。这些系统与人工神经网络非常相似；然而，它们也有一些不同。它们是深度学习的未来，随着深度学习系统的进步，预计深度神经网络最终将完全取代人工神经网络。


    如你所知，人工神经网络是为了模拟动物大脑而开发的浅层网络。然而，它们确实有很多缺点，其中就是体积庞大且需要许多系统才能工作，并且它们只能完成少数的专门任务。就深度学习而言，目标是最终创建出完全的智能，它只需要或不需要人类输入即可有效运行和增长。为了让我们更接近这一目标，深度神经网络被了。


    深度神经网络是人工神经网络的高级版本。它具有更小的单元且不那么“僵硬”，但能够执行人工神经网络的复杂函数。这些网络的架构师专注于少数基本方法，以开发一种更新、更实用的程序，让深度学习网络高效地运行。


    # 用于神经网络深度学习的快速图形处理器 (GPU)


    CPU（中央处理器）通常被认为是电脑的大脑。但日益，这个大脑正在被电脑的另一个部分——GPU（图形处理器）增强，它是灵魂。所有电脑都有具有渲染显示器图像的芯片。但并非所有这些芯片都是平等的。集成显卡提供基础图形，显示生产力应用程序如
    Microsoft PowerPoint、低分辨率视频和基础游戏。


    GPU 属于独立范畴，远超图形控制器的功能，并且本身就是一个可编程的强大计算设备。深度学习需要系统来运行，GPU 必须是解决方案的一部分。


    GPU 通常用于计算机游戏，这是一个巨大且专注的市场，降低了设备成本。GPU 在感知或提供虚拟内容所需的快速矩阵和向量乘法方面表现超预期，并且可以将学习加速
    50 倍。


    ## GPU 与 CPU


    GPU 有数百个简单核心，而 CPU 只有少数简单核心。GPU 有数千个并发硬件线程，并可以最大化浮点吞吐量。


    为了理解这一特征，我们取了一个自然区分的示例。假设你需要将货物从一个地方移动到另一个地方。你可以选择法拉利或货车。法拉利确实快得多，让你能够在眨眼之间移动货物，但你能运输的货物数量很少，而且油成本很高。货车


