    | :--- | :--- |

    | Neural networks | Different types of clustering |

    | Multilayer perceptron | Distances and normalization |

    | Decision trees | K-means |

    | | Self-organizing maps


    A case of unsupervised learning is clustering, which puts similar things in one
    group and dissimilar things in another group, whereby the idea of similarity relies
