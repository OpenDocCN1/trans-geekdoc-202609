    Having a smart home could be incredible in that you would no longer have to do
    much in order to manage your home. Instead, you could cast aside such tasks as
    cleaning and cooking and spend more time enjoying your home. This particular level
    of smart home is likely not to be introduced for quite some time, and will only
    be available to those who are wealthy to begin with, but it is unlikely that we
    may eventually have smart homes as an average everyday home for consumers.


    # Advanced Mobile Technology


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_95_0.png)


    If you have watched the evolution of cellphones, you have seen from simple phones
    in your pocket that could merely be used to call mini-computers that are capable
    of performing many incredible functions. Social media, texting, managing your
    calendar, taking high quality photos, and many other things can be completed using
    current smart phones.


    As they continue developing deep learning technology and refining deep neural
    networks, it is likely that we will continue to see the smart phone even smarter.
    Over time, these devices may become personal managers that we carry around in
    our pockets. We would be able to accomplish many of the same things we already
    complete without having to take out or interact with them in any way beyond speaking.
    We would be able to communicate with the device and it would do everything from
    mark cancel dinner reservations to order new outfits or products straight to our
    home. They could communicate with our friends for us to establish plans or help
    us communicate with clients if it were to be used as a business device.


    Essentially, anything that is typically done by a personal manager can be done
    by your phone one day Having personal manager would no longer be reserved for
    those who are rich and famous, as we would have all one in the form of a mobile
    device.


    # Automated Commercial Use Programs


    In addition to managing our personal lives, deep learning machines could be used
    to manage businesses and organizations as well. They could organize and arrange
    business meetings, reserve tables or spaces for the meetings to be held, and send
    out automated reminders to everyone who is required to show up without ever having
    to be present for the arranging. One person could communicate with the device
    and every other person would have that information and would be able to automatically
    perform any activities that need to be accomplished in advance. These devices
    could also be used to manage advertisements. They could be responsible for collecting
    data and creating advertisement campaigns for various products or businesses based
    on what was presently taking place in the company. For example, they could determine
    the target'
