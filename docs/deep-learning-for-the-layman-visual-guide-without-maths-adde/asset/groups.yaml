    通过全自动化的智能家居实现其他任何虚拟化操作。此外，他们正尝试创建一种不仅能完成所有这些操作并接收指令，还能进行智能对话并从本质上与家里的人建立“关系”系统。它能够记住关于你的重要信息，并根据意愿执行事情，如祝生日、询问你今天过得如何，并根据你的回答与你互动，以及进行并非由设备预录回答所引导的更智能、独特的对话。


    拥有的智能家居可能是不可思议的，因为你再也不需要花费精力精力管理你的家。相反，你可以放下打扫和烹饪等任务，花更多时间享受你的家。这种水平的智能家居可能在相当一段时间内都不会推出，而且最初只有那些富人可以使用，但我们最终不太可能拥有智能家居作为消费者的普通日常家居。


    ## 高级移动技术


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_95_0.png)


    如果你观察过手机的演变，你就会看到从口袋里仅仅用于通话的简单手机，演变成了能够执行许多惊人功能的微型计算机。社交媒体、短信、管理你的日历、拍摄高质量照片以及许多其他事情都可以使用目前的智能手机完成。


    随着他们继续开发深度学习技术并完善深度神经网络，我们可能会继续看到手机变得更加智能。随着时间的推移，这些设备可能会成为我们随身携带在口袋里的个人管家。我们能够完成许多已经在完成的事情，而无需取出它们或通过语音以外的任何方式与它们互动。我们能够与设备通信，它将完成从标记/取消晚餐预订到直接订购新服装或产品送到家里的一切事情。它们还可以代表我们与朋友交流以制定计划，或者如果用作业务设备，可以帮助我们与客户沟通。


    从本质上说，通常由个人管家完成任何事情将来都可以由你的手机完成。拥有个人管家将不再是富人和名人的专属，因为我们将以移动设备的形式拥有每一个。


    ## 自动化商业用途程序


    除了管理我们的个人生活外，深度学习机器还可以用于管理企业和组织。它们可以组织和安排商务会议，为将举行的会议预留位置或空间，并向所有需要出席的人发送自动提醒，而无需亲自到场安排。一个人可以与设备交流，其他其他人都会获得该信息，并能够自动执行任何需要提前完成的活动。这些设备还可以用于管理广告。它们负责根据公司目前发生的情况，收集数据并为各种产品或业务创建广告活动。例如，它们可以确定目标受众以及如何针对他们、活动中应包含哪些参数以确保触达他们，以及应该使用什么样的图形来吸引消费者。它们还能衡量活动返回的任何指标和数据，包括其表现如何、每个线索的成本是多少、每个线索的价值是多少，以及未来可以做什么来使活动更有效。这一切都将完全由设备完成，永远不需要人类做任何事情。

    '
