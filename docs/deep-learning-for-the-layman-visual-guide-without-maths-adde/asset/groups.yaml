    apply gradient strategies (partially because few parameters are discrete values
    and others are real values). Third, the optimization problem is not convex and
    finding a local would include a significant amount of work.


    Fortunately, in the last 25 years, scientists have developed different general
    guidelines for selecting hyper-parameters in a neural system. A decent outline
    of these traps can be found in Efficient BackProp by Yann LeCun, Leon Bottou,
    Genevieve Orr, and Klaus-Robert Mueller.


    # Backpropagation


    This was originally introduced in the 1970s but its worth''s not fully known until
    1986. It works faster than many early approaches and make it possible to solve
    many neural net problems which are insoluble.


    Backpropagation, the short name for the "backward propagation of errors" (shown
    in figure 2.5) is an algorithm for the supervised learning of artificial neural
    networks for gradient descent and a common method for training neural networks.
    Known as an artificial neural network and an error function, the method calculates
    the gradient of the error function with respect to the neural network''s weights.
    It is a generalization of perceptron''s to multilayer feed-forward neural networks.
    It is named after that the calculations of the gradient precede backward through
    the network. The gradient of the final layer of weights are calculated first and
    the gradient of the first layer of weights are calculated last.


    When training a neural network using the back-propagation algorithm, the gradient
    descent technique is used to determine the weight updates. Gradient descent is
    an iterative minimization method. The gradient of the error function always indicates
    the direction of the steepest ascent of the error function. Thus, we can start
    with a random weight vector.


    # Definition backward backpropagation


    Backpropagation is analogous to calculating the delta rule for a multilayer feed-forward
    network. Like, the delta rule, backpropagation requires three things:


    +   1. A dataset consisting of input-output pairs, where xi the input and y, is
    the desired output of network depending on the input. This set of input-output
