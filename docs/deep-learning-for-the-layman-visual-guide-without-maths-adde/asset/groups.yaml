    目前的先进深度神经网络利用算法、大数据和 GPU 的计算能力来改变这种动态局面。研究领域和工业界利用深度学习来帮助解决许多数据问题，例如计算机视觉、语音识别和自然语言处理。实际示例包括：


    - 图像识别

    - 语音识别与翻译

    - 自然语言处理

    - 生命科学


    ## 三类分类法


    如前所述，深度学习涉及到非常广泛的机器学习策略和模型，其特征是利用许多层非线性数据处理，而这些处理在本质上是分层级（层次化）的。根据设计和策略的使用方式（例如组合/生成或识别/分类），可以将绝大多数工作分为三类值得注意的类别：


    ### 用于无监督或生成式学习的深度网络


    这些网络用于在没有目标类别标签数据的情况下，捕捉可见或明显信息的高度组织相关性，以用于模式分析或合成。文献中的无监督组件或表示学习指的就是这类深度系统分类。当作为生成模式的一部分使用时，它可能同样被用于描述可见信息与相关类别之间的联合统计分布（如果可用），并将其视为可见数据的特征。在最后一种情况下，利用贝叶斯定理可以将这类生成网络转换为用于学习的判别网络。


    ### 用于监督学习的深度网络


    这些网络专门用于为模式分类目的提供判别能力，通常通过描述根据条件数据调整的类分布来实现。在监督学习中，目标标签数据在直接或间接结构中始终可用。这些也被称为判别深度系统。


    ### 混合深度网络


    其目标是判别，并通过生成网络或无监督网络的结果辅助。可以通过对分类中的深度系统进行更好的优化和/或正则化来提高。当利用监督学习的判别标准来评估上述分类中任何深度生成或无监督深度结构的参数时，目标也可以得到改进。


    ## 深度学习的常见方法


    下面讨论了深度学习的一些反复出现的主。


    ### 监督学习 / 强化学习中的动态规划


    深度学习的一个反复主题是动态规划（DP），它可以在特定假设下促进任务完成。例如，在监督学习（SL）神经网络中，反向传播本身就可以一种基于 DP 的强化学习（RL），在稳固的马尔可夫假设下，基于
    DP 的策略可以帮助显著减少问题复杂度。DP 算法也是结合神经网络和图模型概念（如隐马尔可夫模型 HMM 和期望最大化 EM）的框架的基础必要要素。


    ### 促进 SL 和 RL 的无监督学习 (UL)


    另一个反复主题是 UL 促进 SL 和 RL 的方式。UL 通常用于将输入数据（如视频或语音流）编码为更便于后续目标导向学习的形式。特别是，以更少冗余或更紧凑的方式解码原始数据的代码可以输入
    SL 或 RL 机器，其搜索空间可能比处理原始数据所需的空间更小（且 CAPS 深度更浅）。UL 与正则化和压缩主题紧密相关。


    ### 通过深度 SL、UL、RL 学习层次表示


    用于老式人工智能（GOFAI）的许多策略以及后期处理 AI 和机器学习的方法，学习了日益增多的动态信息表示的层次。例如，某些句法模式识别技术，如通过语法归纳来寻找正式标准的链以展示观测结果。大多数（无）监督的自动数学家/EURISKO
    通过结合已学习的观点不断学习新思想。这种层次表示学习也是深度 SL、UL 辅助 SL 以及层次化 RL 深度学习神经网络的反复主题。通常，抽象的层次表示是信息压缩的正常结果。


    ### 奥姆剃刀：压缩与最小描述长度 (MDL)


    奥姆剃刀倾向于选择简单的结构而非复杂的结构。给定某种编程语言，可以使用最小描述长度（MDL）规则通过处理它的最短程序的长度来量化答案候选者的方面质量。一些策略显然考虑了程序运行时间；可能仅考虑具有恒定运行时间的用非通用编程语言编写的程序。在神经网络的情况下，MDL
    标准在贝叶斯视角下建议低神经网络权重复杂度相比于高神经网络概率，对应于高泛化性能，而不会过拟合训练信息。已经提出了许多用于正则化神经网络的策略，包括扫描求解计算以及简单、低复杂的
    SL 神经网络和 RL 神经网络。这与某些 UL 技术紧密相关。


