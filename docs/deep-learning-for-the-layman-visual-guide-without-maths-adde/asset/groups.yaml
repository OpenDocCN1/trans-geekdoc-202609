    # 理解黑盒


    学术界的主要目标是获得最先进的性能。在处理现实世界应用时，仅仅设计一个模型往往是不够的。相反，重要的是：


    - 知道模型为什么会做出错误预测。

    - 提供为什么我们的模型可以表现更好的直观感受。

    - 确保模型不会被欺骗。


    ## 深度学习的视觉应用


    以下是深度学习的一些视觉应用：


    - 为无声电影添加声音。

    - 机器翻译。

    - 照片中的物体分类。

    - 字符文本生成。

    - 图像描述生成。

    - 自动游戏。


    ### 为无声电影添加声音


    在这项任务中，框架可以合成与无声视频同步的。框架利用 1000 个视频示例进行训练，视频中有鼓棒击击不同表面产生不同声音。深度学习模型将视频帧与预录声音数据库相关联，以选择与场景发生的情况匹配的声音。


    ### 机器翻译


    这是将一种语言的单词、短语或句子翻译成另一种语言。机器翻译已经存在很久，但深度学习在两个特定领域取得了顶级成果：


    - 文本自动翻译。

    - 图像自动翻译。


    文本翻译可以在不对安排进行预处理的情况下进行，允许算法学习单词之间的依赖关系及其到新语言的映射。使用大型 LSTM 递归神经网络的网络来执行这种翻译。


    ## 照片中的物体分类和检测


    这项任务涉及将照片中的物体分类为已知物体之一。在基准上已获得最先进的物体分类；例如，在该问题中使用大型卷积神经网络。Alex Krizhevsky 等人该问题的突破导致了名为
    ALEX-Net 的 ImageNet 分类问题。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_88_0.png)


    图 8.5：取自 ImageNet 分类的、深度卷积神经网络的物体分类


    该任务的一个更复杂的变体被称为物体检测，它专门识别照片场景中的一个或多个物体，并在它们周围画框。


