    另一方面，CNN 包含各种卷积层和下采样层，随后是全连接层。卷积层的输入是一张 $m \times m \times r$ 的图片，其中 $m$ 是图片的高度和宽度，$r$
    是通道数（例如 $r=3$）。卷积层将具有 $k$ 个通道（或滤波器/卷积核），其大小为 $n \times n \times q$，其中 $n$ 小于图片的维度，$q$
    可以与通道数 $r$ 相同，也可以随每个滤波器而变化。滤波器的范围提供了对局部关联滤波器的提升，这些滤波器与图片进行卷积以生成 $k$ 个大小为 $n-n+1$
    的特征图（maps）。然后，每个图通常在 $p \times p$ 的连续区域上进行下采样，其中 $p$ 对于小图片（如 MNIST）在 2 之间，而对于较大的输入源通常不超过
