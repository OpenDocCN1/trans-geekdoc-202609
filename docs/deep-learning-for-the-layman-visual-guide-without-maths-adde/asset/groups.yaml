    ## 不同的机器学习方法


    机器学习策略大部分可以分为两类，即监督类和无监督类，通常还会添加更多，例如强化学习。


    ## 监督学习


    监督学习算法是机器学习的一类，它使用一组标记数据对相同的未标记数据进行分类。分类过的数据是标记数据，而未标记数据未标记。标签是离散或连续的。大多数实际机器学习都使用监督学习。


    为了更好地理解，我们应该利用另一个示例。机器人正在思考如何使用视觉识别来分拣垃圾。它整天在通过运输线时从垃圾中选出可回收物品。它将玻璃、塑料和金属等材料放入
    12 个容器中。每件物品在贴纸上都有一个 ID 号。每天，人类专家会查看容器并指示机器人哪些物品安排不正确。机器人利用这些输入来取得进步。


    一个正在研究如何区分路面上行人的 AI 使用了 2200 万段来自自动驾驶汽车的短路道路场景。部分记录没有行人，而其他记录则多达 25 个。根据这些信息准备了一系列学习计算，每个计算都有正确答案。每个计算都建立了一个模型集，用于识别快速移动场景中的步行者。然后对另一组信息对这些计算进行测试，以评估精确性和准确性。


    在算法于标记数据（也称为训练数据）上运行之后，它会停止提高准确率。它可以用于新的未标记数据。有时输出并不一定是离散的，并且我们可能没有有限的类别来对数据进行分类。例如，下面的图
    2.3 在拥有数百或数千个维度时可能会变得非常复杂。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_27_0.png)


    # 图 2.3：作为分割输入的分类


    监督学习问题可以进一步分为回归问题和分类问题（图 2.4）。


    - 分类问题的分类是指结果变量是一个类别的点，例如，“红色”或“蓝色”或“生病”和“未感染”。

    - 复发问题的回归是指结果变量是一个真实的估计值的点，例如，“美元”或“重量”。


