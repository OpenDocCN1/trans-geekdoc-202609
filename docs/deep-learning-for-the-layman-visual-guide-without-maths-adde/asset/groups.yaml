    # Applications using existing APIs


    APIs are not merely software running on the other side of the Internet in a remote
    computer which one can get in the neighborhood. For instance, you may connect
    Bluetooth speakers to your laptop even if your machine has natural speakers. So,
    we are able to access the speaker remotely at the same time as we are at our laptop.


    # Advantages of deep learning APIs


    - * A standard deep learning application requires weighty computation power in
    terms of GPUs and data storage/processing. For this reason, you have to set a
    workstation of your own (or use any of the cloud services) and utilize any system
    locally to access the workstation and run your applications.

    - * The local system is not weighed down by the computations.

    - * The latest functionalities can be integrated without difficulty.


    # Disadvantages of deep learning APIs


    - * Constructing an API may not be of use in terms of cost. An API needs both
    time and resources to build up and maintain, which tends to be.

    - * You are restricted by the Internet connection. If your connection fails at
    any time, the whole system breaks down.

    - * Your application is open to the elements, security-wise, as anyone can access
    it without difficulty. Here, you have to add extra security layers like username
    and password to access the service and limit how many times you can access it
    over a certain time period.


    # Open-source applications


    A most excellent and helpful thing in the research community right now is its
    open-source frame of mind. Researchers are all set to share their findings, no
    matter what they achieved, so that deep learning research can grow; as a result,
    it''s growing continuously.


    # Advantages of open source applications


    - * As the applications are open sourced, we have access to the each and every
    element of the application and can easily customize according to one''s requirements.

