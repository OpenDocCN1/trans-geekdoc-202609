    it is unrealistic to connect neurons to all neurons in the past volume. Rather,
    we associate every neuron to just a local region of the input volume. The spatial
    degree of this connectivity is a hyper parameter called the receptive field of
    the neuron (proportionately this is the filter size). The degree of the connectivity
    along the axis is constantly equivalent to the depth of the input volume. It is
    vital to put emphasis on this asymmetry by the way we treat the spatial dimensions
