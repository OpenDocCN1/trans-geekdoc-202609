    # Understanding the black box


    The primary goal in academia is to attain state-of-the-art performance. When functioning
    on real-world applications it is often not enough to design a model. As an alternative,
    it is important to be:


    - To know why a model can make incorrect predictions.

    - To give some intuition why our model can perform better.

    - To make sure the model cannot be tricked.


    ## Visual applications of deep learning


    Some visual applications of deep learning are listed below:


    - Adding sounds to silent movies.

    - Automatic machine translation.

    - Object classification in photographs.

    - Character text generation.

    - Image caption generation.

    - Automatic game playing.


    ### Adding sounds to silent movies


    In this undertaking, the framework may synthesize sounds that coordinate with
    a silent video. The framework is trained utilizing 1000 examples of video with
    the sound of a drumstick striking distinct surfaces and creating different sounds.
    A deep learning model associates the video frames with a database of pre-recorded
    sounds in order to choose a sound that matches what is going on in the scene.


    ### Automatic machine translation


    This is where words, expressions or sentences in one language, and translation
    of it into another language. Automatic machine translation has been around for
    quite while, yet deep learning is accomplishing top outcomes in two particular
    territories:


    - Automatic translation of text.

    - Automatic translation of images.


    Text translation can be performed with no preprocessing of the arrangement, enabling
    the algorithms to learn the dependencies between words and their mapping to a
    new language. Stacked networks of large LSTM recurrent neural networks are used
    to perform this translation.


    ## Object classification and detection in photographs


    This task involves the classification of objects inside a photograph as one of
    ser of earlier known objects. State-of-the-art objects have been attained on a
    benchmark; for instance, in this problem using very large convolutional neural
    networks. A breakthrough regarding this problem by Alex Krizhevsky et al. resulted
    in the ImageNet classification problem called ALEX-Net.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_88_0.png)


    Figure 8.5: Object classification taken from ImageNet classification with deep
    convolutional neural networks


    A more complicated variation of this task is called object detection and includes
    specifically identifying one or more objects within the scene of a photograph
    and drawing a box around them.

