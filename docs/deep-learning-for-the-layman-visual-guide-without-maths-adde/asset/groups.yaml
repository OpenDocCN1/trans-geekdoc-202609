    # Preface


    > "Robots took the jobs of factory workers. Artificial Intelligence will take
    the jobs of office workers."

    — EverythingSupplyChain


    Deep learning is a terminology used for a type of technological research and development
    that is responsible for building machines that are considered to be artificial
    intelligences. These are machines that are capable of completing complex functions
    such as speech recognition, image recognition, bioinformatics and more.


    Understanding deep learning, including what it is and what makes it work, means
    that you will have a greater understanding of how computer scientists and researchers
    are developing the systems that may create a complete and pure artificial intelligence
    one day in the future. Until now, they have only created ones that can complete
    one or two functions. However, it is hoped that one day they will create something
    that closely resembles the human brain. Ideally, we want to create a “pure” artificial
    intelligence, which is one that would be created by a human but would learn and
    operate free of human influence. In essence, it would be a “superhuman”.


    This book was written to help Layman understand what deep learning is and why
    it is such a fascinating and revolutionary concept. It is written after the book
    “Deep Learning for Beginners” after we understand that this first may be more
    technical for the layman in Computer Sciences.


    Deep learning is not a new concept; it is one that is becoming more and more popular
    as we speed towards the possibility of having a true artificial intelligence walking
    amongst us. One thing you may be fascinated to as you read through this book is
    how much we are already using deep learning technologies. Even though the idea
    of a complete and pure artificial intelligence walking amongst us seems to be
    a reality of the distant future, the amount we use the technology is rather fascinating.


    Deep learning is an incredible concept that is here to stay. The revolutionary
    science that is taking place on a daily basis and is slowly being integrated into
    our society for regular consumer use is a fascinating one, and it is incredible
    to learn about it. Understanding it may help you understand the technology you
    are using right now, and the future of society. You may be surprised about what
    you learn! Please, take your time and enjoy reading this educational book about
    deep learning.


    # Book Objectives


    If you are interested in learning more about deep learning, what is used to create
    them, the concept of deep learning, the techniques used by the machines, and the
    tools that are being designed by scientists, then Deep Learning: Concepts and
    Algorithms is exactly what you need. This book will help you explore exactly what
    deep learning is and will also teach you why it so revolutionary and fascinating.
    By the end, you will have a full understanding of what this technology is, how
    it works,


    This book will help you:


    - Have an appreciation for deep learning and an understanding of their fundamental
    principles.

    - Have an elementary grasp of deep learning concepts and algorithms.

    - Have achieve a technical background in deep learning and also artificial neural
    networks


    # Target Users


    The book designed for a variety of target audiences. The most suitable users would
    include:


    - Newbies in computer science techniques and deep learning

    - Professionals in data science and social sciences

    - Professors, lecturers or tutors who are looking to find better ways to explain
    the content to their students in the simplest and easiest way

    - Students and academicians, especially focusing on neural networks and deep learning


    # Is this book for me?


    If you want to learn more about deep learning without technical formulas and practical
    data, this book is for you. No need for maths and coding knowledge is required.
    This book has been written in layman''s terms as an introduction to deep learning
    and neural networks and their algorithms. Each algorithm is explained very easily
    for more understanding.


