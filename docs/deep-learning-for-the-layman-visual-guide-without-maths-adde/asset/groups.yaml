  - '[PAGE 100]


    # Smaller and More Efficient


    One common goal of those studying and developing deep learning machines is establishing
    a system that enables them to have all of the same, if not better, outcomes while
    using much less space. Similar to how computing devices have gotten smaller over
    time, developers are seeking to make deep neural networks and artificial neural
    networks that are significantly smaller than the present ones. By being smaller,
    they become more manageable and are more likely to be used in everyday life.


    Another thing that developers are seeking to accomplish is a system that enables
    the deep learning machines to work more efficiently and quickly. At this time,
    the computing speed of artificial neural networks is rather slow, making them
    almost pointless for regular use. While certain functions as speech recognition
    and image recognition are quick, other functions are extremely slow and this makes
    them irrelevant in most situations places. If a human can complete the same task
    quicker and with more accuracy, there is virtually no point in replacing them
    with an artificial intelligence. If they were able to create deep learning machines
    that were capable of automatically accomplishing all of the same tasks, only quicker
    and more accurately, then it would make sense to replace humans with these machines
    as they would be more efficient and successful with the task at hand.


    The future of deep learning machines is similar to the future of computing machines.
    Just as the latter continues to shrink while becoming more advanced, developers
    are attempting to do the same with the former. The coolest part is that the two
    are already entwined and may continue to grow further entwined as they go along.
    The idea of having a device that fits in your pocket and can do almost everything
    for you may not be just an idea in the not-so-far future.


    # More Automation


    Although the systems are already incredibly talented, developers are seeking to
    make them even more automated. Essentially, they want to add more capabilities
    to deep learning machines and teach them how to do things with less human interaction.
    This is the reason why they are heavily invested in learning about the different
    layers of neural networks and how they can establish machines that have many capabilities.
    The more research and develop these parts of the deep learning machines, the more
    automated these systems will become and the more tasks they will be able to successfully
    complete without having to be driven or guided by a human. Instead, one day they
    may be able to make choices on their own without requiring a human to intervene
    and give the machine direction on what to do in every situation.


    # Perfected Specialized Abilities'
  - '[PAGE 101]


    Before they create a fully artificial intelligence, researchers and developers
    are likely to continue creating machines that are highly specialized in different
    fields, such as personalized devices that can help you manage your life and medical
    devices that can help diagnose and treat illnesses. The two are very different,
    but both require highly specialized requirements from the machine operating them.
    Ideally, researchers and developers will find ways to perfect the operations of
    the machines and make them even more capable of helping with a variety of tasks
    in real life. Instead of merely demonstrating that they can do so, they will be
    used in practice to help people perform various functions, including day-to-day
    activities and different tasks within unique professions.


    Given the incredible and vast abilities deep learning machines already have, it
    is not unlikely that we will start creating machines and technologies being introduced
    that can help us accomplish various tasks in society. Slowly, we see people being
    replaced with machines that are more efficient and accurate. These machines will
    be highly specialized at performing many different functions in society. Truly,
    the potential and opportunities are limitless. The only thing standing between
    us and that next step of advanced deep learning machinery is time, but researchers
    are rapidly advancing towards creating machines that can be used for virtually
    everything in society.


    # Full Artificial Intelligence


    The creation of unique specialized machines that can help us with many different
    aspects of running our society is the goal of creating a fully artificial intelligence.
    This would essentially be one machine that do it all. Every task that was previously
    replaced by specialized machinery would be condensed into one single machine.
    This would enable a single machine to be capable of doing virtually anything that
    a human could do, only better. This would essentially be the “perfect human” or
    “superhuman” that everyone refers to when they discuss artificial intelligences.
    It would be a robotic species entirely capable of doing virtually everything on
    its own, from learning to taking actions and fulfilling various tasks in society.


    Many people participating in the development of an artificial intelligence are
    interested in creating the ultimate superhuman that can do everything. This is
    the next step for after creating specialized machines using deep learning abilities.
    After they perfect each unique element of those machines, they hope to start working
    towards a single machine that can do it all. With the knowledge they gain from
    each independent machine, they will be able to program one that can do everything,
    from recommending where to eat and what to do to identifying your ailment and
    how to treat it, and even helping you cook your dinner. It would be able to literally
    everything a human could, which is why they model robots after humans. This would
    be an entirely robotic species that would live simultaneously amongst humans.
    The species would be capable of doing virtually anything on its own and wouldn’t
    require human interaction at all, though they would hope that it would interact
    with humans and integrate with our society to help us fulfill many tasks that
    exist within modern society.'
  - '[PAGE 102]


    Although there are some clear visions for the future of deep learning, the true
    future is entirely unknown. To date, it is likely that many of the researchers
    that were on board with learning about and developing deep learning machinery
    were unaware of just how far it would go and how much they would be able to accomplish.
    The technology is truly incredible and revolutionary, and it is capable of doing
    things that we aren''t even fully aware of at this time. Since we are not entirely
    clear on the full capabilities of this technology are, it is really hard to pinpoint
    exactly where the future will go with deep learning. Furthermore, it is hard to
    say whether or not government officials or other authorities would even allow
    the creation of a pure artificial intelligence, given that it jeopardize our own
    existence on Earth.

    The future of deep learning is an expansive one that truly could go in any direction.
    We may simply end up with highly specialized machines that are capable of fulfilling
    roles in society better than any human could, or we may end up with completely
    artificial intelligences that walk among us and interact with our society as their
    own independent species. The only way we will ever find out what is actually going
    to happen is to wait and watch. Every day we are learning more and more about
    this revolutionary technology, it is capabilities, and what our future may look
    like with the existence and integration of deep learning networks.'
