    # 作者简介


    François Duval 是一位资深数据科学专家和新兴作家，在信息技术和数据分析领域迅速赢得了创新领导者的声誉。在过去的十年里，他在领域积累了丰富的经验。目前，Francois
    自豪地担任科学数据顾问。他还在编写一系列关于统计学和计算机科学的书籍。


    在从事目前的业务之前，他在 IBM 团队工作了两年，是 Intelligence Consulting 的创始人，这是一家在法国和整个欧洲提供数据分析咨询的知名公司。他还在多个行业担任过工程师，包括但不限于金融业（伦敦
    KPMG 的财务咨询部门）以及环境和医疗研究（法国的 INERIS 和 Mines ParisTech）。无论从事什么项目，Francois 都致力于一个终身使命：向数据分析新手传授他们理解所需的知识。通过有效地简化这些方法，新兴专业人士能够在计算机科学世界中创造积极的变化，这种影响将继续在我们所知的整个领域产生涟漪效应。


    此外，François 拥有定量分析和随机微积分博士学位，以及统计学与数据分析的学士学位。


    在沉浸于多变的职业生涯之，François Duval 喜欢与爱的人度过高质量的时光。如今，他快乐地住在英国伦敦，是两个漂亮孩子的父亲。


