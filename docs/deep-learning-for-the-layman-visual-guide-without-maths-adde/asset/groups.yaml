    ## 5. 多层感知机与反向传播：它们的工作原理


    ### 本章目标

    本章将涵盖利用一种名为“多层感知机”（简称 MLP）的特定系统以及反向传播算法的核心内容。


    ## 多层感知机


    当你拥有大多数人认为“标准数据”时，通常会使用 MLP，例如表格格式的数据，其中行是样本，列是变量。这里需要包含的另一个重要点是，行和列之间都是可以互换的，这意味着我们可以交换行的顺序或列的顺序，而不会改变输入信息的“含义”。


    MLP 可以被视为逻辑回归分类器，其中输入首先通过非线性变换进行改变。这种变换将输入数据投影到一个空间，在该空间中数据证明是线性可分的。这个中间层被称为隐藏层。单个隐藏层就足够构建
    MLP 了。


    ## MLP 模型


    图 5.1 显示了一个带有单个隐藏层的 MLP。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_64_0.png)


    图 5.1：MLP 模型


    ## 训练 MLP 的技巧


    有几个超参数是无法通过梯度下降来增强的（通常也无法增强）。从本质上说，为这些超参数找到合适的超参数并不是一个可行的问题。首先，我们不能自由地优化每一个超参数。其次，我们无法立即应用梯度策略（部分是因为少数参数是离散值，而其他是实数值）。第三，优化问题不是凸的，寻找局部最优将涉及大量工作。


    幸运的是，在过去的 25 年里，科学家们开发了在神经系统中选择超参数的不同通用指南。在 Yann LeCun、Leon Bottou、Genevieve Orr
    和 Klaus-Robert Mueller 编写的《高效反向传播》（Efficient BackProp）中可以找到这些陷阱的良好概述。


    ## 反向传播


    这最初于 20 世纪 70 年代引入，但直到 1986 年价值才被充分认识。它比许多早期方法更快，并使得许多无法解决的神经网络问题变得可能。


    反向传播（Backpropagation，简称 BP）是“误差反向传播”（如图 2.5 所示），是一种用于人工神经网络梯度下降的监督学习算法，也是训练神经网络的常用方法。该方法被称为人工神经网络和误差函数，它计算误差函数相对于神经网络权重的梯度。它是感知机向多层前馈神经网络的推广。它的命名是因为梯度的计算是先通过网络从后向前传播的。首先计算最后一层权重的梯度，最后计算第一层权重的梯度。


    在使用反向传播算法训练神经网络时，使用梯度下降技术来确定权重的更新。梯度下降是一种迭代最小化方法。误差函数的梯度始终指示误差函数上升最快的方向。因此，我们可以从一个随机权重向量开始。


    ## 定义反向传播


    反向传播类似于为多层前馈网络计算增量规则（delta rule）。与增量规则一样，反向传播需要三个要素：


    - 1. 一个由输入-输出对组成的数据集，其中 $x_i$ 是输入，$y$ 是取决于输入的网络期望输出。这组大小为 $N$ 的输入-输出对表示为：

    - 2. 前馈神经网络统一记为 $\theta$。同一层的节点之间没有连接，而层与层之间是全连接的。

    - 3. 误差函数定义了给定输入下期望输出与计算输出之间的误差。


    使用梯度下降的神经网络需要计算用于训练的误差函数梯度，涉及权重和偏置。根据学习率 $\alpha$，梯度更新权重和偏置的迭代如下：


    ## 反向传播的应用


    在函数近似中，网络被训练用于估计某些函数的值。系统存储或输入一些噪声数据，并被训练以识别所需的模式。训练后，网络可以产出地估算出高斯函数的值（图 5.2）。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_66_0.png)


    图 5.2：函数近似


    在时间序列预测中，目标是设计一个神经网络根据给定的时间序列数据预测值（例如基于给定趋势的股票市场预测）。为了解决这个问题，神经网络的输入必须分块反映，产生的输出将直接是紧随该块的下一个数据项（图
    5.3）。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_66_1.png)


    图 5.3：使用反向传播进行序列预测


    ## 自然语言处理与情感分析


    利用人工神经网络和深度神经网络，科学家们已经能够创建协助翻译和语言建模的机器。该程序被称为 LSTM，并于 21 世纪初引入。


    使用 LSTM，深度学习网络已经具备了理解自然语言的能力，使其能够与人进行基础对话。虽然目前可以进行对话，但技术正在快速向能够与人进行连贯对话的深度网络发展。


    由于这项技术非常先进，深度学习可以理解笑话、改写以及自然语言的其他部分，并像真正的人类与你进行智力交流一样做出响应。


