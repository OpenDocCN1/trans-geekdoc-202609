    ## 5. Multilayer Perceptron and Backpropagation: How they work


    ### Objective of this Chapter

    This chapter will cover the essentials of neural nets utilizing a particular sort
    of system called a "multilayer perceptron", or MLP for short and backpropagation
    algorithms.


    ## Multilayer perceptron


    MLPs are normally utilized when you have what the vast majority would consider
    "standard data", e.g. data in a tabular format where rows are samples and column
    are variables. Another important thing to include here that the rows and columns
    are both interchangeable, which means we can swap the sequence of the rows or
    the order of the column and not change the “meaning” of the input information.


    A MLP can be seen as a logistic regression classifier where the input is first
    changed utilizing a non-linear transformation. This change projects the input
    data into a space, where it turns out to be linearly separable. This middle layer
    is alluded to as a hidden layer. A single hidden layer is sufficient to make MLPs.


