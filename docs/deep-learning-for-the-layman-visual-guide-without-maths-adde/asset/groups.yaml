    # Understanding the black box model


    The primary goal in academia is to attain or outperform state-of-the-art performance,
    no matter what the model is like. When functioning on real-world applications
    it is often not enough to design a model that performs well.


    As an alternative, it is important to be:


    +   • To know why and how a model can make incorrect predictions.

    • To give some intuition why our model can perform better than any previous solution.

    • To make sure that the model cannot be tricked.


    # Visual applications of deep learning


