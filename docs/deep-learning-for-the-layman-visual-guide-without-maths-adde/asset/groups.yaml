    Once again, we discuss the potential of creating a completely artificial intelligence.
    Complete artificial intelligences would be literal superhumans. They would be
    capable of doing anything a human could. They would fulfill and execute complex
    actions and functions, carry on intelligent conversations, learn, grow, and do
    virtually anything a human could.


    While the idea of creating an complete artificial intelligence is staggering,
    a completely artificial intelligence may be beneficial overall, but it could also
    pose many threats and dangers to society. If they create their own complete artificial
    intelligence replicas and develop their society with as many or as few as they
    wanted. They would be able to create armies, potentially destroy society, and
    even wipe humans out. If we were to have created artificial intelligences, it
    could even be that one were hacked or turned "evil" and thus create a large amount
    of damage in society. Since they would be created to be so strong and virtually
    perfect, the "imperfect" humans would be capable of stopping them. We would have
    to outsmart them, since the intelligence would be created to be smarter than us,
    that be virtually impossible. We would not have the strength to stop them and
    would require the involvement of other artificial intelligences which could ultimately
    lead to a war between superhuman machines and humans.


    Although the idea of creating a completely artificial intelligence is incredible,
    it is highly unlikely. Not at any time in the near future. Having a completely
    artificial intelligence would require us to know basically everything there is
    to about the human brain in order to recreate it in a machine form. We would also
    have to know how to recreate it in machine form not to only function like ours
    but to function better. This is highly unlikely, potentially impossible. If it
    were to happen, it is likely that it wouldn''t happen for another few generations
    at least. And when it did, these machines would have to be created in such a way
    that they could be outsmarted, which then take away from being entirely artificial
    intelligences. So, unless developers and the government are willing to jeopardize
    society as a whole, it is extremely unlikely that we will see a true and complete
    artificial intelligence.


    The future of deep learning is vast and incredible. There are so many things that
    could take place it is hard to dream upon every single. There are truly many routes
    that this technology could go and the only way we will ever know where it ends
    up is by watching and waiting. Deep learning networks are essentially our key
    to creating the sci-fi world that we all dreamed about one time or another, watched
    or read in pop culture. There are so potentially incredible, and devastating,
    things that could happen as society without having a significantly negative impact
    from deep learning. In order for us to continue advancing as a society must take
    our time and roll things out slowly.


    Additionally, major developments must be monitored and thoroughly understood before
    they are ever exposed to the general public. If something were not fully comprehended
    and were to be released too soon, could wreak serious havoc on society. The reality
    is, a human with bad intentions could turn basic deep learning against society.
    It is important that we take our time and really investigate each part of the
    process and continue learning more and more about deep learning and deep neural
    networks before we ever plan to use them as a large and important part of society.'
