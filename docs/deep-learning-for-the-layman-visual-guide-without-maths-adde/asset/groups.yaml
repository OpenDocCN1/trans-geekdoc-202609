    如所述，深度学习适应了广泛的机器学习策略和模型，其特征是利用许多层非线性数据处理，而这些处理在本质上是分层级（层次化）的。根据设计和策略的使用方式（例如组合/生成或识别/分类），可以将这里的绝大多数工作分为三类值得注意的类别：


