    The input layer of the first auto encoder is the input layer for the complete
    network. The greedy-wise training mechanism is like this:


    - Train the initial auto encoder ($f=1$, or the red connections in the figure
    above, but with an additional output layer) individually using the backpropagation
    method with all accessible training data.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_81_0.png)


    Figure 7.3: Stacked auto encoders


    - Train the next auto encoder $f=2$. In view of the fact that the input layer
    for $f=2$ is the hidden layer of $f=1$, we are no longer interested in the output
    layer of $f=1$ and we eliminate it from the network. Training begins by clamping
    an input sample to the input layer of $f=1$, which is propagated forward to the
    output layer of $f=2$. Next, the weights (input-hidden and hidden-output) of $f=2$
    uses all the training samples, similar to using backpropagation.

    - Repeat the earlier procedure for all the layers (i.e., remove the output layer
    of the previous auto encoder, replace it with yet another auto encoder, and train
    with backpropagation).

    - All above steps are pre-training. After pre-training the network can become
    extensive connecting one or more fully connected layers to the last layer. This
    forms a multilayer perceptron which can then be fine-tuned.


    ### Types of Autoencoders


    1. Denoising autoencoder

    2. Sparse autoencoder

    3. Variational autoencoder (VAE)

    4. Contractive autoencoder (CAE)


    ### Deep belief networks


    As with auto encoders, we can also stack Boltzmann machines to generate a class
    known as deep belief networks (DBNs) as shown in 8.3.


    In this scenario, the hidden layer of RBM, $t$, acts as a visible layer for $t+1$.
    The input layer of the initial RBM is the input layer for the whole network, and
    the greedy layer-wise pre-training works like this:


    - Train the next RBM $t=1$ using contrastive divergence with all the training
    samples.

    - Train the next RBM $t=2$. In view of the fact that the visible layer for $t=2$
    is the hidden layer of $t=1$, training begins by clamping the input sample to
    the visible layer of $t=1$, which is propagated forward to the hidden layer of
    $t=1$. This data serves to initiate contrastive divergence training for $t=2$.

    - Repeat the previous procedure for all the layers.

    - After pre-training the network can become extensive connecting one or more fully
    connected layers to the final RBM hidden layer. This forms a multilayer perceptron
    which can then be fine-tuned using backpropagation. This procedure is akin to
    that of stacked auto encoders, but with the auto encoders replaced by RBMs and
    backpropagation replaced with the contrastive divergence algorithm.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_82_0.png)


    Figure 7.4: Deep belief networks


    ## 8. Deep Learning Applications


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_83_0.png)


    ### Chapter Introduction


    The recent ascent of artificial intelligence is grounded in the accomplishment
    of deep learning. Three noteworthy drivers have caused the leap forward of (deep)
    neural systems: The accessibility of immense measures of training data, effective
    computational foundations, and advances in the scholarly community. Accordingly,
    deep learning frameworks have begun to overcome traditional techniques, as well
    as human benchmarks in different undertakings like image characterization or face
    recognition. This makes the potential for some, troublesome new organizations
    to utilize learning to figure out how to take care of certain issues.

