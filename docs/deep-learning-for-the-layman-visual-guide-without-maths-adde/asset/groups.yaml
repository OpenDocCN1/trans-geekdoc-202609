    卷积神经网络可以被视为利用了大量相同神经元副本的神经网络。这种做法的好处是，它允许网络只学习一次神经元并在许多地方使用它，从而简化了模型的学习过程并减少了误差。


    卷积系统的推动源于自然或生物过程，在这些过程中，神经元之间的网络设计灵感来源于与动物视觉皮层的关联。单个皮层神经元对刺激的反应仅限于视觉野中的一个局部区域，被称为“感受野”（receptive
    field）。各种神经元的感受野大部分覆盖了整个视觉野。卷积神经网络（CONV-Nets 或 CNNs）是一种神经网络分类，它们已被证明在图像识别和分类等某些领域极其强大。CNN
    在独立识别人脸、物体和交通标志方面非常有效，同时也用于机器人和自动驾驶汽车的视觉控制。


