    If the weights in this matrix are little (or, more formally, if the leading eigenvalue
    of the weight matrix is smaller than 1.0), it can lead to a situation called vanishing
    gradients, where the gradient signal gets so little that learning either becomes
    very slow or stops working entirely. It can also make more complex the task of
    learning long-term dependencies in the data. On the other hand, if the weights
    in this matrix are big (or, again, more formally, if the leading eigenvalue of
    the weight matrix is larger than 1.0), it can lead to a situation where the gradient
    signal is so large that it can cause learning to diverge. This is frequently referred
    to as exploding gradients.


    These problems are the major motivation behind the LSTM model, which introduces
    a new structure called a memory cell (see figure 5.4 below). It consists of four
    major elements: an input gate, a neuron with a self-recurrent connection (a connection
    to itself), a forget gate, and an output gate. The self-recurrent link has a weight
    of 1.0 and gives surety that, barring any outside interference, the state of the
    memory cell can remain constant from one time step to another. The input gate
    can permit an incoming signal to alter the state of the memory cell to have an
    effect on it or it can block it. On the other hand, the output gate can allow
    the state of the memory cell to have an effect on other neurons or it can prevent
    it. Finally, the forget gate can modulate the memory cell''s self-recurrent connection
    and permit the cell to remember or forget its state, as needed.


