    A restricted Boltzmann machine is a kind of stochastic neural network that consists
    of one layer of visible units, one layer of hidden units, and a bias unit. The
    architecture is developed in such a way that each visible unit is connected to
    all hidden units, and bias units are attached to all visible and hidden units.
    During the learning process, the restriction is developed so that no visible unit
    is connected with any visible units, and no hidden unit is connected with any
    hidden unit.


    # Auto encoders


    An auto encoder is a neural network that has three layers: an input layer, a hidden
    (encoding) layer, and a decoding layer. The network is trained to reconstruct
    its inputs, which forces the hidden layer to try to learn good representations
    of the inputs.


    It is an unsupervised learning algorithm that applies backpropagation, setting
    the target values to be equal to the inputs. An auto encoder is trained to copy
    its input to its output. Internally, it has a hidden layer that describes a code
    to represent the input.


    The expectation is that the code y is a distributed representation that captures
    the coordinates all along the main factors of variation in the data. This is similar
    to the way the projection on principal components would capture the main factors
    of variation in the data. Indeed, if there is one linear hidden layer (the code)
    and the mean squared error criterion is used to train the network, then the k
    hidden units learn to project the input in the span of the first k principal components
    of the data. If the hidden layer is non-linear, the auto-encoder behaves differently
    from PCA, with the ability to capture multiple-modal aspects of the input distribution.
    The disappearance of PCA becomes even more important when we consider multiple
    encoders (and their corresponding decoders) when building a deep autoencoder.


    Because y is seen as a loss compression of x, it cannot be a good quality (small-loss)
    compression for all x. Optimization makes it a good compression for training examples,
    and hopefully for all inputs but not for arbitrary inputs. That is the sense in
    which an auto-encoder generalizes: it gives a low reconstruction error on test
    examples from the same distribution as the training examples, but generally high
    reconstruction error on samples randomly chosen from the input space.


    # Stacked auto encoders


    This network consists of multiple stacked auto encoders, as the name shows (8.2).
    The hidden layer of auto encoder acts as an input layer to auto encoder i + 1.
    The input layer of the first auto encoder is the input layer for the complete
    network. The greedy-wise training mechanism is like this:


    +   * Train the initial auto encoder (/=, or the red connections in the figure
    above, but with an additional output layer) individually using the backpropagation
    method with all accessible training data.'
