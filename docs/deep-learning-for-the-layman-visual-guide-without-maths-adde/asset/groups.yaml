    # 6. Convolutional Neural Networks (CNN): How it is works?


    Objective of this Chapter


    At the end of this chapter, the reader should have learnt:


    +   - Convolution layer

    - Pooling layer

    - Fully connected layer

    - CONV-NET Architecture


    A convolutional neural networks can be considered as a neural network that utilizes
    numerous identical replicas of the same neuron. The benefit of this is that it
    enables a network to learn a neuron once and use it in numerous places, simplifying
    the model learning process and thus reducing error.


    Convolutional systems were propelled by natural or biological processes in which
    the network design between neurons is inspired by the association with the animal
    visual cortex. Individual cortical neurons react to stimuli just in a limited
    locale of the visual field known as the receptive field. The receptive fields
    of various neurons mostly cover the whole visual field. Convolutional neural networks
    (CONV-Nets or CNNs) are classifications of neural networks that have demonstrated
    to be extremely powerful in certain fields, such as image recognition and classification.
    CNN have been effective in recognizing faces, objects and traffic signs separately
    from controlling vision in robots and self-driving autos.'
