    # 如何联系我们


    如果您发现书中包含任何破损、编辑问题或其他任何问题，请立即通过电子邮件通知我们的客户服务部门：customer_service@datasciences-book.com


    如果您有任何问题或建议，也可以直接与我联系：Francois Duval@datasciences-book.com


    我们的目标是为您在计算机科学领域的技术学习提供高质量的书籍。


    感谢您购买本书。


    François Duval


    # 前言


    > “机器人取代了工厂工人的工作。人工智能将取代办公室人员的工作。”

    — EverythingSupplyChain


    深度学习是一个术语，用于一类技术研发，负责构建被认为是人工智能的机器。这些机器能够完成复杂的功能，如语音识别、图像识别、生物信息学等。


    理解深度学习（包括它是什么以及它的工作原理），意味着您将更好地理解计算机科学家和研究人员是如何开发系统的，这些系统可能在未来的某一天创造出完全的人纯人工智能。直到目前，他们只创建了能够完成一或两个功能的系统。然而，人们希望有一天他们创造出非常类似于人类大脑的东西。理想情况下，我们想要创建一个“纯粹”的人工智能，即由人类创造但不受人类影响进行学习和运行的。从本质上说，它是一个“超级人类”。


    本书的编写目的是帮助外行者理解什么是深度学习，以及为什么它是一个如此迷人且具有革命性的概念。本书是在写了《深度学习入门》一书后编写的，因为我们意识到，对于计算机科学的外行者来说，前者可能更具技术性。


    深度学习并不是一个新概念；随着我们向拥有真正的人工智能走在我们身边的可能性迈进，它正变得越来越流行。在阅读本书时，你可能会感到惊讶的是，我们已经使用了多少深度学习技术。尽管一个完全且纯粹的人工智能走在我们身边似乎是遥远的未来，但我们使用这项技术的程度相当引人入胜。


    深度学习是一个不可思议的概念，它将一直存在。每天发生并缓慢整合到我们社会以供普通消费者使用的革命性科学是一个迷人的科学，学习它是不可思议的。理解它可能帮助你理解你现在使用的技术以及社会的未来。你可能会对所学到的感到惊讶！请花点时间享受这本关于深度学习的教育书籍。


    # 本书目标


    如果您感兴趣学习更多关于深度学习、创建它的要素、深度学习概念、机器使用的技术以及科学家正在设计的工具，那么《深度学习：概念与算法》正是你需要的。这本书将帮助你深入探索深度学习到底是什么，并教你为什么它是如此具有革命性和迷人。到结束时，你将对这项技术是什么、它是如何工作的有一个全面的理解。


    本书将帮助你：


    -   对深度学习产生欣赏并理解其基本原理。

    -   初步掌握深度学习概念和算法。

    -   在深度学习和人工神经网络领域获得技术背景。


    # 目标用户


    本书为各种读者群体设计。最合适的用户包括：


    -   计算机技术和深度学习领域的新手

    -   数据科学和社会科学领域的专业人士

    -   寻求以最简单、最容易的方法向学生解释内容的教授、讲师或导师

    -   学生和学者，特别是关注神经网络和深度学习的人士


    # 这本书适合我吗？


    如果您想在不涉及技术公式和实际数据的情况下学习更多关于深度学习的知识，这本书就适合您。不需要数学和编码知识。本书用通俗易懂的语言编写，作为深度学习、神经网络及其算法的介绍。每个算法都解释得非常简单，以便于理解。


