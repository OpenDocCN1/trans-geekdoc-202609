    ## Classification and clustering


    Clustering and classification seem to be similar processes. They are actually
    two types of learning methods, and they categorize groups according to their features.


    ## Classification


    In classification on the basis of a training set of data, objects are differentiated.
    The aim is to predict the target class by analyzing the training set. To get better
    boundary conditions that can be used to determine each target class, a training
    dataset is used.


    ## Classification algorithms


    Any classification algorithm can be used; some are named below.


    - Linear classifiers

    - Logistic regression

    - Naive Bayes classifier

    - Fisher''s linear discriminant

    - Support vector machines

    - Least squares support vector machines

    - Quadratic classifiers

    - Kernel estimation

    - k-nearest neighbor

    - Decision trees

    - Random forests

    - Artificial Neural networks

    - Learning vector quantization


    ## Applications of classification algorithms


    - Email spam classification

    - Prediction of a bank customer''s willingness to pay back a loan

    - Tumor cell identification

    - Sentiment analysis

    - Drug classification

    - Facial key points detection

    - Pedestrian''s detection in self-driving vehicles


    ## Clustering


    In clustering, objects with the same features are grouped together and those with
    dissimilar features are also grouped together. The target class is not predicted,
    as it is in classification. It is about grouping similar kinds of things by considering
    the most satisfied condition, whereby all the items in the same group should be
    similar and no two different group''s items should be similar (shown in figure
    2.8).


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_32_0.png)


    Figure 2.8: Clustering


    ## Clustering algorithms


    Clustering algorithms can be classified into two main categories: linear clustering
    algorithms and Non-linear clustering algorithms.

