    # 将深度学习应用于现实世界问题


    训练神经网络比以前任何时候都要简单。然而，你几乎无法直接从教程中获取代码并让它直接适用于你的目标。


    ## 预训练的价值


    在机器学习的知识宇宙中，很少关注数据集的获取。相反，为了将深度学习技术与其他方法进行对比，并确保其中一种方法优于其他方法，标准策略是在标准数据集上使用相似的评估程序来衡量性能。然而，在现实世界中，任务的重点不在于证明你的新算法比另一种方法多挤出
    1% 的性能，而是构建一个能够以足够准确率解决所需任务的健壮系统与所有的机器学习系统一样，这需要标记过的训练数据，算法可以从中学习。


    对于许多现实世界问题，遗憾的是，获取良好的标记训练数据相当昂贵。为了详细阐述这个问题，让我们考虑两种情况。


    ### 医学视觉


    如果我们需要制造一个检测计算机断层扫描（CT）图像中人体淋巴结的系统，我们需要标注有淋巴结的图像。这是一项相当耗时的任务，因为图像是 3D 的，并且需要识别非常小的结构。假设放射科医生每小时薪酬
    100 美元，每小时可以谨慎地标注 4 张图像，这意味着我们每张图像的成本为 25 美元，或者 10,000 张标记图像需要 25 万美元。考虑到我们需要多位医生标注同一张图像以确保接近
    100% 的诊断准确性，获取该医疗任务的数据集将很容易超过这 25 万美元，这显然是非常昂贵的。


    ### 信用评分


    如果我们想建立一个做出信用决策的系统，我们想知道谁可能违约，这样我们就可以训练机器学习系统提前预知此。不幸的是，只有在某人违约发生时，你才能确定。因此，一种朴素的策略是给每个人提供
    1 万美元的贷款。然而，这意味着每个违约的人都会让我们损失 1 万美元。这为每个标记数据点付诸了非常昂贵的代价。我们确实可以降低成本，但关键点是它们的成本很高。


    ### 高成本的解决方案


    预训练是降低成本的解决方案。预训练的核心思想是，我们最初在一个低价格的大型数据集上训练神经网络（或其他机器学习算法），该数据集位于


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_84_0.png)


    相关领域，或在相似领域的嘈杂数据上。尽管这不会直接解决原始问题，但它将让神经网络对你的预测问题看起来如何有一个大致的概念。现在，在下一步中，神经网络的参数将在你实际尝试解决的问题的小得多且更昂贵的数据集上进一步优化。这个两步过程如图
    5.1 所示。


    ## 预训练：相关领域的廉价大型数据集


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_85_0.png)


    ##  微调：昂贵的良好标记数据


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_85_1.png)


    图 8.1：首先在相关领域的大型低廉价数据集上预训练神经网络；其次，在昂贵的良好标记数据集上对其进行微调。与仅在小数据集上训练相比，这将带来性能的提升。


    在微调时，类别的数量可能会发生。人们经常在包含 1000 个类的 ImageNet 数据集上预训练神经网络，并将其微调到他们的特定问题（这是预期的，具有不同的类别数量）。这告诉我们最后一层需要初始化。通常最后一层的学习率会高一点，因为它需要从零开始学习，而之前的层以较低的学习率进行训练。对于像
    ImageNet 这样的数据集，学习到的特征（最后一个全连接层）是如此通用的，可以现用并直接用于其他几个计算机视觉问题。


    ## 现实世界标签分布的注意事项


    一旦我们收集了用于预训练和微调的数据，我们就可以继续开始训练我们的神经网络。这里是学术界与现实世界之间的另一个巨大差异。在学术界，数据集通常是平衡的。这意味着对于监督分类问题，每个类别的样本数量通常相等。在下方（图
    5.2 和 5.3）中你会找到两个例子：MNIST 是一个著名的手写数字数据集，包含每个数字大约等量的样本。Food101 是另一个学术数据集示例，它包含
    101 种食品类别中的每种类别恰好 1000 张图像。


