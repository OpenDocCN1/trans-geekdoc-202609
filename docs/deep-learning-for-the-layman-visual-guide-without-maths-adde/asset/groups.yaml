    is likely to default so that we can train a machine learning system to know this
    beforehand. Unluckily, you only know for sure if somebody defaults when it occurs.
    Thus, a naive strategy would be to give loans of, $10k to everyone. However, this
    means that every person who defaults will cost us 10k $. This puts a very expensive
    price on each labeled data point. We can definitely lower the costs, but the key
    point is their cost is high.


