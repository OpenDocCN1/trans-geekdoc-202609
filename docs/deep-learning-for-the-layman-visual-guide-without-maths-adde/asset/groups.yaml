    +   • Adding sounds to silent movies.

    • Automatic machine translation.

    • Object classification in photographs.

    • Automatic handwriting generation.

    • Character text generation.

    • Image caption generation.

    • Automatic game playing.


    # Adding sounds to silent movies:


    In this undertaking, the framework may synthesize sounds that coordinate with
    a silent video. The framework is trained utilizing 1000 examples of video with
    the sound of a drumstick striking distinct surfaces and creating different sounds.
    A deep learning model associates the video frames with a database of pre-recorded
    sounds in order to choose a sound that best matches what is going on in the scene.
    The framework was then assessed utilizing Turing Test-like setup where humans
    had to figure out which video had the real or the fake (synthesized) sounds.


