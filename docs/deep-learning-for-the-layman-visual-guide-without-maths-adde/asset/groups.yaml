    # 4 autoencoders


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_81_0.png)


    Figure 7.3: Stacked auto encoders


    +   - Train the next auto encoder $f=2$. In view of the fact that the input layer
    for $f=2$ is the hidden layer of $f=1$, we are no longer interested in the output
    layer of $f=1$ and we eliminate it from the network. Training begins by clamping
    an input sample to the input layer of $f=1$, which is propagated forward to the
    output layer of $f=2$. Next, the weights (input-hidden and hidden-output) of $f=2$
    uses all the training samples, similar to using backpropagation.

    - Repeat the earlier procedure for all the layers (i.e., remove the output layer
    of the previous auto encoder, replace it with yet another auto encoder, and train
    with backpropagation).

    - All above steps are pre-training and leave the weights correctly initialized.
    On the other hand, there''s no mapping between the input data and the output labels.
    For example, if the network is trained to identify handwritten digits, it''s still
    not possible to map the units from the last feature detector (i.e., the hidden
    layer of the last auto encoder) to the digit type of the image. In that case,
    the most common solution is to add one or more fully connected layer to the last
    layer. The whole network can now be viewed as a multilayer perceptron and is trained
    using backpropagation (this step is also called fine-tuning).


    Stacked auto encoders, then, are all providing an effective pre-training technique
    for initializing the weights of a network, leaving you with a complex, multi-layer
    perceptron that''s ready to train (or fine-tune)


    # Types of Autoencoders


    +   1. Denoising autoencoder

    2. Sparse autoencoder

    3. Variational autoencoder (VAE)'
