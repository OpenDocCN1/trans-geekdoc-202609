    其他非线性能力，例如 tanh 或 sigmoid，同样可以被用来代替 ReLU；但事实证明很大程度上 ReLU 的表现更好。


    ## 卷积层


    CONV 层（卷积层）是卷积网络的核心构建单元，承担了大部分真正困难的计算工作。


    ## 无需大脑模型


    让我们首先利用这个机会，在不类用大脑/神经元类比的情况下，讨论一下 CONV 层处理的内容。CONV 层的参数包含了一组可学习滤波器的参数。每个滤波器（通道）在空间上是较小的（沿宽度和高度），但贯穿了输入卷的整个深度。例如，在
    CONV-Net 的第一层运行一个典型滤波器可能会估计 5x5x3（即宽度和高度为 5 像素，深度为 3 的三张图片，即阴影通道）。随着前向传播，我们在输入卷的宽度和高度上滑动（更准确地说是卷积）每个滤波器，并计算通道通过之间的项以及在任何位置的贡献。当我们在输入卷的宽度和高度上滑动时，我们将得到一个二维激活轮廓，它给出了该通道在每个空间位置的反应。自然地，系统会学习在看到某种视觉元素时启动的通道，例如主层（第一层）上某些引言的边缘，或者主层上某种颜色的标记，或者是网络更高层上的整个蜂窝状或轮子状图案。目前，我们在每个
    CONV 层中都有一整组通道（例如 12 个通道/滤波器），其中每一个都会创建一个不同的二维激活图（轮廓）。我们将这些激活图沿深度测量方向进行堆叠，并输出输出卷。


    ## 大脑视角


    如果你是大脑/思维/神经元类比的信徒，那么 3D 输出卷中的每个部分也可以被翻译为神经元的输出，该神经元只关注输入中的一小区域，并为空间上左侧和右侧的所有神经元提供参数（因为这些数字都是通过应用一种细微通道产生的）。我们现在讨论神经网络的细微元素、它们在空间中的排列以及它们的参数共享计划。


    ## 本地连接


    在处理高维输入源（如图片）时，正如我们在上面看到的，将神经元连接到过去卷中的所有神经元是不现实的。相反，我们将每个神经元关联到输入卷的一个局部区域。这种连接的空间程度是一个被称为神经元感受野的超参数（按比例，这是滤波器的大小）。沿轴的连接程度始终等同于输入卷的深度。通过我们处理空间维度（宽度和高度）和深度维度的方式，强调这种不对性至关重要：连接在空间上（沿宽度和高度）是邻的（局部的），但在输入卷的整个深度上是贯穿的。


    ## 空间排列


    我们已经澄清了输入 ConvLayer 中每个神经元的连接性；我们还没有检查输出卷中有多少个神经元或它们是如何组织的。三个超参数控制着输出卷的跨度：深度（depth）、步长（stride）和零填充（zero-padding）。我们接下来将讨论这些：


    - 1. 首先，输出卷的深度是一个超参数：它关系到我们想要使用的滤波器数量，每个滤波器都学习在输入中搜索其他内容。例如，如果主卷积层以粗糙/原始图片输入，在那个点，深度维度上的多样化神经元可能对不同排列的边缘或色块的存在起作用。我们将提到一种整体上将输入的相同区域作为深度列的神经元排列（有些人倾向于使用“纤维”这一术语）。

    - 2. 第二，我们应该确定滑动滤波器的步长。当步长为 1 时，我们在任何给定时刻都移动滤波器一个像素。当步长为 2 时（或者显著至少为 3，尽管这通常不常见），在那个点，当我们滑动滤波器周围时，滤波器在任何给定时刻跳跃
    2 个像素。这将产生空间上更小的输出卷。

    - 3. 正如我们很快将看到的，有时在输入卷边界周围填充零是有帮助的。这种零填充的度是一个超参数。填充的好处是，它使我们能够控制输出卷的空间尺寸。


    ## 现实案例


    Krizhevsky 等人赢得 2012 年 ImageNet 挑战赛的工程承认了大小为 [227x227x3] 的图片。在主卷积层上，它利用了感受野 F=11、步长
    S=4 且无填充的神经元。由于 (227 - 11)/4 + 1 = 55，且由于 ConvLayer 的深度为 K=96，输出卷具有 [55x55x96]，这里的
    55*55 个神经元中的每一个都与输入的 [11x11x3] 区域相关。此外，每个深度列 96 个神经元中的每一个都与相同的 [11x11x3] 区域相关。有趣的是，如果你阅读这篇论文，它断言信息是224x224。


    ## 参数共享


    参数共享计划作为卷积层的一部分用于控制参数数量。在当前情况下，我们看到有 55*55*96=290,400 个神经元，每个有 11*11*3=363 个权重和
    1 个偏置。这是 290400*363 = 105,415,200 个参数（+96 个偏置）。每个深度片中的 55*55 个神经元现在将使用相似的参数。


    通过做出一个简单的假设，我们可以显著减少参数数量：如果一个组件在某个空间位置 (x,y) 用于计算，那么在那个点它也应该在不同的位置 (x'',y'') 用于计算。因此，由于一个大小为
    [55x55x96] 的二维深度切片具有 96 个深度片，每个大小为 [55x55x1]，我们将约束每个深度片中的神经元使用相似的权重。并且，通过反向传播，卷中的每个神经元都会计算其权重的梯度；然而，这些梯度将跨越每个深度片并刷新每个切片的权重权重。


    注意，如果单个深度片中的所有神经元都使用相似的权重向量，那么在那个点，ConvLayer 在每个深度片的前向运动可以被视为神经元权重与输入卷的卷积（因此命名为卷积层）。这基本上是权重排列被称为通道/滤波器（或内核），它与输入进行卷积。


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_77_0.png)


    图 6.7：Krizhevsky 等人学习的示例滤波器。这里显示的 96 个滤波器中的每一个一个大小为 [11x11x3]，并且每一个一个都被一个深度片中的
    55*55 个神经元共享。注意，参数共享假设是相对合理的：如果检测水平边缘在图片的某个位置很重要，那么由于图片的平移不变结构，直觉上它在其他位置也应该是有用的。因此，没有必要在
    ConvLayer 输出卷的 55*55 个不同位置中的每一个位置都重新学习水平边缘。


