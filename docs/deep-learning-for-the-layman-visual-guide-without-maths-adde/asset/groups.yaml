    When you are sorting a problem by means of a conventional machine learning algorithm,
    it generally suggested to break the problem down into many parts, solve them independently,
    and merge the result. Deep learning in contrast advocates solving the problem
    end-to-end. Let us take an illustration to examine this.


    Let us say that you have the task of detecting several objects. The task is to
    recognize what the object is and where it is present in the image (figure 2.11).


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_36_0.png)


    In a typical machine learning recognition approach, you would divide the problem
    into two steps, object detection and object recognition, you would use a bounding
    box detection algorithm, to skim through the image and find all the achievable
    objects. Then, for all the recognized objects, you would utilize an object recognition
    algorithm like SVM with HOG to recognize the relevant objects. In contrast, in
    deep learning approach, you would do the process end-to-end. For example, a YOLO
    net (which is a type of deep learning algorithm), you would pass in an image,
    and it would give out the location along with the name of object.


    ## Execution time


    Generally, a deep learning algorithm takes a long time to train. This is because
    there are so many parameters in a deep learning algorithm that training takes
    them more than usual time spent. The state of the art deep learning algorithm
    RES-Net takes about 15 days to train completely from scratch. Machine learning,
    on the other hand, comparatively takes much less time to train, ranging from a
    few seconds to a few hours.


    This turn is completely reversed attesting time. At the test time, the deep learning
    algorithm takes a much reduced amount of time to run. However, if you match it
    up to the k-nearest neighbors (a type of machine learning algorithm), the test
    time increases with the increasing size of the data. However, this is not applicable
    to all machine learning algorithms, as some of them have small testing times too.


    ## Interpretability


    Last but not least, we have interpretability as a feature of contrast between
    machine learning and deep learning. This is the main reason why deep learning
    is still being considered 10 times before its use in industry.


    Let us take an example. Let us say we use deep learning to use automated marking
    on essays. The calculation it gives is quite tremendous and is close to the performance
    of human being. But there''s a problem. It does not show why that score is given
    to any particular assignment. Indeed, mathematically you can find out which nodes
    of a deep neural network were activated, but we don''t know what their neurons
    were thought to model and what these layers of neurons were doing as a group.
    So, we fail to interpret the outcomes.


    On the other hand, machine learning algorithms like decision trees give us crisp
    rules as why we chose what they chose, so it is particularly easy to interpret
    the reasoning behind them. Therefore, algorithms like decision trees and linear/logistic
    regressions are primarily used in the industry for interpretability.


    ## Where deep learning and machine learning has been used


    The areas in which machine learning has been used include:


    - Computer vision; for applications like vehicle number plate identification and
    facial recognition.

    - Information retrieval; for applications like search engines, both text search
    and image search.

    - Marketing; for applications like automated email marketing and target identification

    - Medical diagnosis; for applications like cancer identification and anomaly detection

    - Natural language processing; for applications like sentiment analysis and photo
    tagging

    - Online advertising, etc.

