    # Recurring methods of deep learning


    Some recurring themes for deep learning are discussed below.


    # Dynamic programming for supervised learning / reinforcement learning


    One recurring subject of deep learning is dynamic programming (DP), which can
    encourage task under specific assumptions. For instance, in supervised learning
    (SL) neural networks, backpropagation itself can be a DP-derived reinforcement
    learning (RL), and in light of solid Markovian assumptions, DP-derived strategies
    can help to significantly diminish issue proficiency. DP algorithms are likewise
    a basic necessity for frameworks that join the concepts of neural networks and
    graphical models, such as hidden Markov models (HMMs) and expectation maximization
    (EM).


    # Unsupervised learning (UL) facilitating SL and RL


    Another recurring theme is the manner by which UL can encourage both SL and RL.
    UL is regularly used to encode incoming data, such as video or speech streams,
    into a shape that is more convenient for subsequent goal-directed learning. In
    particular, codes that decode the original data in a less redundant or more compact
    way can be fed into SL or RL machines, whose search spaces may become smaller
    (and CAPS shallower) than those necessary for dealing with the raw data. UL is
    closely connected to the topics of regularization and compression.


    # Learning hierarchical representations through deep SL, UL, RL


    Numerous strategies for Good Old-Fashioned Artificial Intelligence (GOFAI) and,
    in addition, later ways to deal with AI and machine learning learn the hierarchies
    of an ever-increasing number of dynamic information portrayals. For instance,
    certain techniques for syntactic pattern recognition, such grammar induction to
    find chains of formal standards to display observations. The mostly (un-) supervised
    Automated Mathematician/EURISKO ceaselessly learns ideas by joining already learned
    ideas. This hierarchical representation learning is also a repeating topic of
    deep learning neural networks for SL, UL-aided SL, and hierarchical RL. Often,
    abstract hierarchical portrayals are the normal results of information compression.


