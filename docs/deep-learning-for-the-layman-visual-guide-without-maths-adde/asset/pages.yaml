- pgno: 84
  md: '# Applying deep learning to real-world problems


    It is simpler than ever before to train a neural network. However, it is hardly
    ever the case that you can just take code from a tutorial and directly make it
    work for your purpose.


    # The value of pre-training


    In the intellectual universe of machine learning, there is little focus on acquiring
    datasets. Rather, it is the opposite in order to contrast deep learning techniques
    with other methodologies and guarantee that one method outperforms others, the
    standard strategy is to measure the performance on a standard dataset with a similar
    evaluation procedure. However, in real-world situations, it is less about showing
    that your new algorithm squeezing an additional 1% in performance compared to
    another method. Rather it is about building a robust system that solves the required
    task with enough accuracy. As for all machine learning systems, this requires
    labeled training from which the algorithm can learn.


    For many real-world problems it is unfortunately somewhat costly to get well-labeled
    training data. To elaborate on this issue, let consider two cases.


    # Medical vision


    If we are required to manufacture a system that detects lymph nodes in a human
    body in computed tomography (CT) images, we require annotated images where the
    lymph nodes are labeled. This is a somewhat time consuming task, as the images
    are 3D and the recognition of very small structures is required. Assuming that
    a radiologist earns 100$/h and can cautiously annotate 4 images per hour, this
    shows that we incur costs of 25 $ per image or 250k for 10,000 labeled images.
    Considering that we require more than a few physicians to label the same image
    to ensure close to a 100% diagnosis correctness, acquiring a dataset for the given
    medical task would easily exceed those 250k and that is obviously costly.


    # Credit scoring


    If we like to build a system that makes credit decisions, we want to know who
    is likely to default so that we can train a machine learning system to know this
    beforehand. Unluckily, you only know for sure if somebody defaults when it occurs.
    Thus, a naive strategy would be to give loans of, $10k to everyone. However, this
    means that every person who defaults will cost us 10k $. This puts a very expensive
    price on each labeled data point. We can definitely lower the costs, but the key
    point is their cost is high.


    # Solution to the high cost


    Pre-training is the solution to lowering the cost. The crucial idea of pre-training
    is that we initially train a neural network (or another machine learning algorithm)
    on a low priced and large dataset in


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'an associated domain or on noisy data in a similar domain. Even though this
    will not directly solve the original problem, it will give the neural network
    a rough idea of what your prediction problem looks like. Now, in a next step,
    the parameters of the neural network are additionally optimized on a much smaller
    and more expensive dataset of the problem you are actually trying to solve. This
    two-step procedure is depicted in figure 5.1 below.


    # Pre-training: cheap large datasets on related domain


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_85_0.png)


    # Fine-tuning: expensive well-labeled data


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_85_1.png)


    Figure 8.1: First pre-train the neural network on a large and low-priced dataset
    in a related domain; secondly, fine-tune it on a pricey well-labeled dataset.
    This will result in a performance boost compared to just training on the small
    dataset.


    When fine-tuning, the quantity of classes might alter. People often pre-train
    a neural network on a dataset ImageNet with 1000 classes and fine-tune it to their
    explicit problem, which is to be expected, with a different number of classes.
    This tells us about the last layer needs to be initialized. The learning rate
    is then normally a bit higher on the last layer as it needs to be learned from
    scratch, whereas the previous layers are trained with a lower learning rate. For
    some datasets like ImageNet, the features (the last fully connected layer) learned
    are so generic they can be taken off-the-shelf and directly used for several other
    computer vision problems.


    # Caveats of real-world label distributions


    Once we have gathered data for both pre- and fine-tuning, we can move on and begin
    training our neural networks. Here comes one more huge difference among academia
    and the real world. In'
