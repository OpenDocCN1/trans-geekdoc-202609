- pgno: 75
  md: '# The brain-view


    In case you''re a devotee of brain/mind/neuron analogies, each section in the
    3D output volume can likewise be translated as an output of a neuron that focuses
    on just a little region in the input and offers parameters with all neurons to
    one side and the right spatially (since these numbers all come because of applying
    a subtle channel). We now talk about subtle elements of the neuron networks, their
    arrangement in space, and their parameter sharing plan.


    # Local connectivity


    When managing high-dimensional sources of input, such as pictures, as we saw above
    it is unrealistic to connect neurons to all neurons in the past volume. Rather,
    we associate every neuron to just a local region of the input volume. The spatial
    degree of this connectivity is a hyper parameter called the receptive field of
    the neuron (proportionately this is the filter size). The degree of the connectivity
    along the axis is constantly equivalent to the depth of the input volume. It is
    vital to put emphasis on this asymmetry by the way we treat the spatial dimensions
    (width and height) and the depth dimension: The connections are nearby (local)
    in space (along width and height), however constantly full along the whole depth
    of the input volume.


    # Spatial arrangement


    We have clarified the connectivity of every neuron in the ConvLayer for our input;
    we haven''t yet examined what number of neurons there are in the output volume
    or how they are organized. Three hyper parameters control the span of the output
    volume: the depth, stride and zero-padding. We talk about these next


    +   1. In the first place, the depth of the output volume is a hyper parameter:
    It relates to the quantity of filters we might want to utilize, each learning
    to search for something else in the input. For instance, if the primary convolutional
    layer takes as the crude/raw picture, at that point diverse neurons along the
    depth dimension may act in presence of different arranged edges, or blobs of colors.
    We will allude to an arrangement of neurons that are on the whole taking a same
    region of the input as a depth column (a few peopleにつき toward the term fiber).

    2. Second, we should determine the step with which we slide the filter. At the
    point when the stride is 1, then we move the filter one pixel at any given moment.
    At the point, when the stride is 2 (or remarkably at least 3, however this is
    generally uncommon) at that point the filters hop 2 pixels at any given moment
    as we slide them around. This will deliver littler output volumes spatially.

    3. As we will soon observe, now and again it is helpful to pad the input volume
    with zeros around the border. The measure of this zero-padding is a hyper parameter.
    The good part of padding is that it will enable us to control the spatial size
    of the output volumes.'
