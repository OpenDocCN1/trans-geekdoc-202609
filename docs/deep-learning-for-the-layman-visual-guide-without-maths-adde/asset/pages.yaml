- pgno: 82
  md: '# 4. Contractive autoencoder (CAE)


    # Deep belief networks


    As with auto encoders, we can also stack Boltzmann machines to generate a class
    known as deep belief networks (DBNs) as shown in figure 8.3.


    In this scenario, the hidden layer of an RBM, $t$, acts as a visible layer for
    RBM $t+1$. The input layer of the initial RBM is the input layer for the whole
    network, and the greedy layer-wise pre-training works like this:


    +   1. Train the next RBM $t=1$ using contrastive divergence with all the training
    samples.


    +   2. Train the next RBM $t=2$. In view of the fact that the visible layer for
    $t=2$ is the hidden layer of $t=1$, training begins by clamping the input sample
    to the visible layer of $t=1$, which is propagated forward to the hidden layer
    of $t=1$. This data serves to initiate contrastive divergence training for $t=2$.


    +   3. Repeat the previous procedure for all the layers.


    +   4. Like the stacked auto encoders, after pre-training the network can become
    extensive connecting one or more fully connected layers to the final RBM hidden
    layer. This forms a multilayer perceptron which can then be fine-tuned using backpropagation.
    This procedure is akin to that of stacked auto encoders, but with the auto encoders
    replaced by RBMs and backpropagation replaced with the contrastive divergence
    algorithm.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_82_0.png)


    Figure 7.4: Deep belief networks'
  merge: -1
