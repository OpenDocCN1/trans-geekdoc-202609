- pgno: 41
  md: '# Chapter Introduction


    As you learned previously, deep learning is made possible through the introduction
    and use of artificial neural networks. These are networks that were developed
    to reflect the biological neural networks that work in animal brains to make them
    function as independent creatures. These systems have the capability of learning
    on their own grants them the ability to progressively improve their knowledge
    and abilities. The idea behind these systems is that they can learn to do tasks
    on their own without requiring special programming or interference from humans
    to teach them how to do so, like true animals.


    One great example of how the artificial neural network works is examining how
    they respond to pictures containing dogs. For example, if there was programming
    that had labeled "dog" and "no dog", the artificial neural network would begin
    to identify which element in the picture was actually the dog. As a result, it
    would know what dogs looked like. From thereon out, this would be able to identify
    dogs and it would have a sound understanding of what dogs are. This is like if
    you were to teach a baby how to identify a dog. At first, you must teach them
    how, but after they can identify dogs in any of situations. They can then develop
    information about dogs, such how they look, what defines a dog, and what does
    not. For example, they would be able to tell a dog apart from a cat by appearance
    and, later, actions and sounds. Artificial neural networks carry this same ability,
    making them capable of being their own independent species.


    Developing an artificial neural network requires a large series of connected units.
    These are called artificial neurons and they were created to resemble axons in
    the biological brain, which are a form of neuron. Each neuron has its own connection
    to other neurons, which is called a synapse. Synapse is used to transmit signals
    to other neurons in the artificial neural network. Much like an animal brain,
    the receiving neuron can then signal to other neurons in a sequence that allows
    the artificial neural network to operate just like an animal brain. The result
    of the sequencing is that certain signals and messages are sent throughout the
    brain which can lead to the body to which the brain is attached to act, react,
    and respond in a variety of unique ways.


    In a true animal brain, neurons are organized in a series of layers. Each one
    of these layers is responsible for helping brain perform different tasks, which
    each one essentially specializes in certain information and transformations. It
    can take a set of transmissions from one neuron to the next in order to get the
    signal from the first input layer to the last output layer. Originally, the scientists
    responsible for working with and creating artificial neural networks were attempting
    to mimic the animal brain entirely, which is why it was built in such a way. Later,
    however, they decided to pay attention to creating specific abilities in each
    creation so that each one was specialized.


    To date, scientists and researchers have used artificial neural networks to create
    systems that could accomplish a great variety of tasks. These tasks include anything
    from speech recognition to computer vision, computerized opponents in games, and
    even medical diagnosis systems. Although'
  merge: -1
  img_proc: true
