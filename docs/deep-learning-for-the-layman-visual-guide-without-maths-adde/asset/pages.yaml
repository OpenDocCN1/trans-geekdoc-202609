- pgno: 76
  md: '# Real lifes example


    The Krizhevsky et al. engineering that won the ImageNet challenge in 2012 acknowledged
    pictures of size [227x227x3]. On the principal convolutional layer, it utilized
    neurons with receptive field F=11, stride S=4 and no zero padding P=0. Since (227
    - 11)/4 + 1 = 55, and since the ConvLayer has a depth of K=96, the ConvLayer output
    volume had the estimate [55x55x96]. Each of the 55*55*96 neurons in this volume
    was associated with a region of size [11x11x3] in the input volume. Additionally,
    every one of the96 neurons in every depth column was associated with the same
    [11x11x3] area of the input, with different weights. As a fun aside, on the off
    chance that you read the real paper, it asserts that the information pictures
    were 224x224, which is without a doubt off base because (224 - 11)/4 + 1 is obviously
    not an integer. This has befuddled individuals in the historical background of
    Conv-Nets and little is about what happened.


    # Parameter sharing


    A parameter sharing plan is utilized as part of convolutional layers to control
    the quantity of the parameters. Utilizing the present real-world case given above,
    we see that there are 55*55*96 = 290,400 neurons in the primary ConvLayer, and
    each has 11*11*3 = 363 weights and 1 bias. This, indicates 290400*364 = 105,705,600
    parameters on the principal layer of the CONVNet alone. Otherwise, this is nothing.


    Things being what they are, we can significantly lessen the quantity of parameters
    by making one simple assumption: On the off that one component is utilized to
    compute at some spatial position (x,y), at that point it ought to be likewise
    to compute at a different position (x,y2). As such, indicating a single 2-dimensional
    slice of depth as a depth slice (e.g. a volume of size [55x55x96]) has 96 depth
    slices, each of size [55x55x1], we will constrain the neurons in every depth slice
    to utilize similar weights and bias. With this parameter sharing plan, the primary
    ConvLayer in our illustration will have just 96 set of weights (for every depth
    slice), for some of 96*11*11*3 = 34,848 weights, or 34,444 parameters (+96 biases).
    Every one of the 55*55 neurons in every depth slice will now utilize similar parameters.
    And by by, along with backpropagation, each neuron in the volume will compute
    the gradients for its weights; however, these gradients will be included over
    every depth slice and refresh a single set of weights per slice.


    Notice that if all neurons in a single depth slice are utilizing a similar weight
    vector, at that point the forward motion of the ConvLayer in every depth slice
    can be figured as a convolution of the neuron''s weights with the input volume
    (hence the name: convolutional layer). This is basically with the arrangements
    of weights are referred to as a channel/filter (or a kernel) that is convolved
    with the input.'
