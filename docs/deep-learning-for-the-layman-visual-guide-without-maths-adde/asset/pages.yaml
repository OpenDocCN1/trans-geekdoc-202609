  md: '# Training a perceptron


    The training perceptron consists of using different preparing tests and figuring
    the yield for each of them. After each example, the weights w are balanced in
    a path in order to limit the yield error, characterized by the distinction between
    the coveted (target) and the genuine yields. There are other error functions,
