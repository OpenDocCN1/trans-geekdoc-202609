    # History of Deep Learning


    Deep learning is a popular topic today, as organizations attempt to discover how
    to utilize progressed computational strategies to discover helpful data inside
    enormous swaths of information. While the field of artificial intelligence is
    decades old, leaps forward in the field of simulated neural systems are driving
    the sudden increase in deep learning.


    Attempts to make computerized reasoning go back decades. In the world of World
    War II, the English mathematician and code breaker Alan Turing penned a definition
    for genuine computerized reasoning. He named it the Turing Test, whereby a conversational
    machine would need to persuade a human that they were conversing with another
    human.


    After 60 years, a computer finally breezed through the Turing Test in 2014, when
    automated bot created by the University of Reading named "Eugene" persuaded 33%
    of the judges gathered by the Royal Society in London that it was genuine. It
    was the first occasion that the 30% limit had been surpassed.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'From point forward, the field of deep learning and AI has begun expanding as
    computers moving closer nearer to conveying human-level capacities. Consumers
    interact with a variety of bots like Apple''s Siri, Amazon''s Alexa, and Microsoft''s
    Cortana, which utilize regular language and machine in order to know how to answer
    questions.


    Presently, multiple organizations are hoping to use their huge informational indexes
    as a preparation to create better AI programs that can associate with the world
    in regular ways, while concentrating helpful ways that have not yet been determined.
    Scientists have discovered that amix of cutting-edge neural systems; prepared
    accessibility of immense masses of information, and, to great degree, effective
    circulated GPU-based frameworks give us the plans to make shrewd, self-learning
    machines that can equal people in their cognition.


    A definitive wellspring of deep learning''s energy is the manner in which it empowers
    computers to separate the contention bits and after that construct a deliberation
    layer over it that relates to our impression of reality.


    # Deep Learning Timeline


    Below is a timeline that will help you see how deep learning has been established
    and the growth has accumulated along the way. This timeline will give you insight
    to some of the biggest developments in deep learning technology and the people
    who have played a key role in establishing these developments. This will help
    you understand for how long deep learning has been around, and just bow far it
    comes in a few short decades.


    1965: Akeyey Ivakhnenko and Lapa publish a working learning algorithm that uses
    supervised, deep, feedforward, multilayer perceptrons.


    1971: A paper is published that describes the algorithm as an 8-layer-deep network
    that is trained by the group method of data handling algorithm.


    1980: A deep learning algorithm is published as the "Neocognitron" by Kunihiko
    Fukushima.


    1986: Riga Dechter introduces the phrase "Deep Learning", and the concept becomes
    an official topic of interest for computer scientists.


    1989: The standard back propagation algorithm is applied to a deep neural network
    by Yann LeCun, who used it as a system to read and recognize handwritten ZIP codes
    on pieces of mail.


    1991: The same piece of machinery to read ZIP codes on mail was advanced and developed
    that it it could begin recognizing 3-D objects. This was completed by matching
    2-D images with handcrafted 3-D object models.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '1992: The Cresceptron was introduced by Weng. This was a publication that was
    used to perform 3D recognition and could work even in a cluttered place where
    there wasn''t a single isolated object to recognize. Similar to the Neocognron,
    which was introduced in 1980, the Cresceptron was developed using multiple layers.
    Unlike the Neocognit, it did not require supervision or human interaction and
    manipulation to complete various functions. In other words, it could perform many
    functions and operations on its own.


    1994: A multi-layer Boolean neural network was introduced by Andre C. P. L. F.
    de Carvalho, Fairhurst and Bitter. The neural network module was independently
    trained and created a completely weightless neural network that was composed of
    self-organizing feature extractions.


    1995: A network comprising six fully connected layers was trained in two days
    by Brendan Frey. The network had several hidden units within it, which were each
    trained during this period. He proved that using the wake-sleep algorithm, you
    could train the network to several different functions. At the time, however,
    the speed was slower.


    1997: Over the years, the deep learning network has struggled with what was called
    the “vanishing gradient problem”. This prevented learning systems from retaining
    information in gradient-based learning methods. In 1997, Hochreiter and Schmidhuber
    published the short-term memory (LSTM) network, which was capable of avoiding
    the vanishing gradient problem. It did so by maintaining memories of events that
    had happened several times over. This was important in the development of speech
    recognition.


    2006: Hinton and Salakhutdinov successfully showed how many-layer feedforward
    neural network systems were capable of being pre-trained one layer at a time.
    Each layer was treated as an unsupervised but restricted machine. Afterward, they
    used supervised backpropagation to fine-tune the system so that it worked the
    way they desired it to.


    2009: Hinton and Li Deng worked together to apply deep learning algorithms to
    speech recognition. Together, they co-organized a workshop that took place in
    late 2009 called “Workshop on Deep Learning for Speech Recognition”. Here, they
    learned how they could deepen the generative models of speech and potentially
    use more capable hardware and large scale datasets so that deep neural nets would
    become possible.


    2010: Computer scientists and researchers extend deep learning to encompass larger
    vocabulary speech recognition.


    2012: The “Merck Molecular Activity Challenge” was won by Dahl and his team when
    they used a multi-task deep neural network to predict the biomolecular target
    of a drug.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/9fe8d2acb79e08fc7077850a9468c4c3_23_0.png)


    **2014:** The “Tox21 Data Challenge” was won by a team lead by Hochreiter, who
    used deep learning as a system to detect off-target and toxic effects of environmental
    chemicals that can be found in nutrients, drugs, and various household products.


    There have been many discoveries and advances in deep learning over the years.
    The concept was originally introduced in 1965, and since then scientists and researchers
    have developed it to the extent that there is now a real and impending possibility
    that a true and complete artificial intelligence will soon exist. At this point,
