  md: '# Layer


    A layer is the highest-level building block in deep learning. A layer is a container
    that usually receives weighted input, transforms it with a set of mostly non-linear
    functions, and then passes on these values as output to the next layer. A layer
    is usually uniform, that is, it contains only one type of activation, pooling,
    convolution etc, etc., so that it can be easily compared to other parts of the
    network. The first and last layers in a network are called the input and output
    layers, respectively, and all layers in-between are called hidden layers.


    # Unit


    A unit refers to the activation function in a layer by which the inputs are transformed
    via a nonlinear activation function. Usually, a unit has several incoming connections
    and several outgoing connections. Pooling, convolution, and other input transforming
    functions are usually not referred to units.


    # Activation function


    A neural networks calculates a weighted sum of its input, adds a bias, and then
    decides whether it should be “considered” or not. The value of the weighted sum
    + bias can range between any intervals.


    So, how do we decide whether the neuron should be considered or not? The activation
    functions fulfill this task; they check the value produced by a neuron and decide
    whether outside connections should consider this neuron as “fired” or not.


    The difference between units and activation functions is that units can be more
    complex, that is, a unit can have multiple activation functions or a slightly
    more complex structure.


    The neuron of a specific layer receives a similar kind of enactment work. In all
    cases, non-straight enactment capacities are utilized. The different sorts of
    enactment capacities are utilized as a part of


    +   - Threshold function

    - Piecewise-linear function

    - Sigmoid function


    # Feature engineering


    Here, we give a practical explanation of feature engineering. It is the art of
    extracting useful patterns from data that will make it easier for machine learning
    models to distinguish between classes. The features can be pixel values, shape,
    textures, position and orientation.


    In a machine learning algorithm, the performance is based on the accuracy of these
    features as well as their identification and extraction. However, deep learning
    algorithms to learn high-level'
