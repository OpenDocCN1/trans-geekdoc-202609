  md: '# CNN Architecture


    A CNN comprises various convolutional and sub-sampling layers on the other hand
    followed by completely connected layers. The input to a convolutional layer is
    an m x m r picture, where m is the height and width of the picture and r is the
    quantity of channels, e.g. r=3. The convolutional layer will have k channels (or
    filters/kernels) of size n x n x q, where n is less than the dimension of the
    picture and q can either be the same as the number of channels r or may shift
    for every filter. The extent of the filters offers an ascent to the locally associated
    filters, which are convolved with the picture to create k, including maps of size
    n-n+1. Each map is then sub-sampled normally over a p x p contiguous region, where
    p is between 2 for small pictures (e.g. MNIST) and is typically not more than
    5 for bigger sources of input. Either earlier or after the sub-sampling layer,
    an additive bias and sigmoidal nonlinearity is connected to each component map.
    The feature beneath represents a full layer in a CNN comprising convolutional
    and sub-sampling layers. Units of similar shading have tied weights. The architecture
    is shown in figures 6.1 and 6.2.


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_70_0.png)


    Figure 6.1: CNN architecture


    After the convolutional layers, there might be any number of completely connected
    layers. The thickly connected layers are indistinguishable from the layers in
    a standard multilayer neural system.'
