- pgno: 18
  md: '# What Is Deep Learning, Exactly?


    Deep learning is essentially a system of neural networks that are used to help
    try and make learning algorithms much easier to use as well as much better in
    their abilities. They are also used to create revolutionary advancements in artificial
    intelligence, well as machine learning, and ultimately to create what will eventually
    be a true and complete artificial intelligence.


    In the past, computing systems were too slow and we didn''t have enough information
    to create the networks required to make a true artificial intelligence. What means
    is that we were not advanced enough to create an artificial intelligence that
    would be able to completely act, think, and live on its own. Until now, we have
    only been able to create partial artificial intelligences that are able to do
    certain things on their own based on a set of metrics that have been programmed
    into their intelligence network.


    With the introduction of deep learning, however, we have been able to begin developing
    large neural network systems that are capable of taking in information and responding
    to it on their own. The end goal will be create neural networks that mimic the
    human brain and operate as their own intelligence, completely capable of learning
    new things and advancing on their without human manipulation. Essentially, we
    would create an artificial species and introduce it into the world.


    At the very foundation of all these advances and progressions in artificial intelligence
    lie deep learning. In the past, the algorithms were slow. While they could process
    a large quantity of data, their performance was limited. Deep learning combines
    performance with data intake to create an optimal and advanced system that out
    competes anything we have used before.


    # What Is Learned?


    Currently, deep learning is used in practice under conditions of supervised learning.
    This means that the deep learning machines can only learn from labelled data that
    they have been exposed to. They have not yet left unsupervised, and likely won''t
    be for some time. At the very least, they won''t be unsupervised until they are
    reliable and yet understood.


    Over time, the goal is to open up the deep learning networks and artificial intelligences
    to unsupervised learning, where they will be able to learn anything without restriction
    on what they can or access. When they are able to access this data without restriction,
    artificial intelligences will then become complete and will be an artificial intelligence
    in the truest sense of the word.


    # Feature Learning


    Deep learning is based on large neural networks, it has the ability to be scaled
    to incredible sizes. These networks can also be trained with "feature learning",
    however, which means that they can perform automatic features based on raw data.
    Essentially, the artificial intelligences will be able to intake raw data and
    have pre-programmed feature responses that will help them to respond'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'efficiently and in a positive manner. This means that they will be able to
    learn data, but then turn it into their own learning process, growing away from
    human-inputted features so that they can operate entirely on their own without
    any human implications or manipulations.


    When we learn about things as humans, we often build on concepts, allowing us
    to learn more and more. That is how we are able to learn everything: we start
    small and grow from there. The idea with artificial intelligences is to teach
    hierarchy feature learning, which means that the artificial intelligences will
    be able to create something they''ve learned, such as human-inputted information,
    and grow on that concept to create their own concept. They will also be able to
    advance similarly to how humans are presently advancing: by building on concepts
    and moving forward through the natural learning process.


    # Why is it Called "Deep Learning?"


    In some of the earliest literature on deep learning, Geoffrey Hinton was a co-publisher
    of the first paper written on the backpropagation algorithm. In that paper, he
    was said to have used the word "deep" to represent the development of large artificial
    neural networks. It is likely he meant that they were large and much "deeper"
    than the networks they were using to date in the field of artificial intelligence.


    In, 2006 he co-authored a paper where he stated: "Using complimentary priors,
    we derive a fast, greedy algorithm that can learn deep, directed belief networks
    one layer at a time, provided the top layers form an undirected associative memory."


    He has also written more papers where he uses the word deep to describe the abilities
    of the algorithm and the learning network and how these are used to grow and advance
    from things these are taught in the beginning. He has been cited hundreds, if
    not thousands, of times using deep as a descriptive factor for how the network
    operates and its abilities. As a result, the term has been promoted into the title
    and the entire program is now called "deep learning" instead of "artificial neural
    networks". Essentially, "deep learning" is the name of the system and "artificial
    neural networks" is what they are composed of.


    Deep learning permits computational models that consist of various preparing layers
    to learn portrays of information with various levels of reflection. These techniques
    have drastically enhanced the cutting edge in speech and visual recognition, and
    object detection as well as numerous fields, such as drug disclosure and genomics.'
  merge: -1
  img_proc: true
