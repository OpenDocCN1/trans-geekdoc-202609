    # Adaline Learning Algorithm


    ADALINE is an acronym for ADaptive LINear Element or ADaptive LINear Neuron. This
    algorithm was developed by Bernard Widrow and Marcian Hoff (1960).


    The adaline learning rule is also known as the least-mean-squares rule, the delta
    rule. It is a training rule that minimizes the output error using gradient descent.
    After each training pattern a correction is applied to the weights proportionally
    to the error. The correction is calculated before the thresholding.


    The idea is to pick tests in arbitrary request and perform a (moderate) angle
    plummet in their individual blunder capacities. This method permits incremental
    learning, i.e., a refining of weights as additionally preparing tests are included.


    # The Delta Rule


    Developed by Widrow and Hoff, the delta rule, also called the Least Mean Square
    (LMS) method, is one of the most commonly used learning rules. For a given input
    vector, the output vector is compared to the correct answer. If the difference
    is zero, no learning takes place; otherwise, the weights are adjusted to reduce
    this difference.


    # The Delta Rule and Learning Rate


    In addition to the weight parameters defined in our neural network, learning algorithms
    also need a couple of additional parameters to carry out the training process.
    One of these so-called parameters is the learning rate.


    In practice, at each step of moving perpendicular to the line, we need to determine
    how far we want to walk before recalculating our new direction. This distance
    depends on the steepness of the surface. The closer we are to the minimum, the
    shorter we want to step forward. We know we are close to the minimum, because
    the surface is a lot flatter, so we can use the steepness as an indicator of how
    close we are to the minimum. However, if our error surface is shallow, training
    can potentially take a large amount of time. As a result, we often multiply the
    gradient by a factor ε, the learning rate. The selection of the learning rate
    is a tough problem. As we have just'
