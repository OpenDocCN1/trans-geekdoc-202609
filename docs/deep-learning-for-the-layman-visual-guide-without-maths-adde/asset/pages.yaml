    may eventually have smart homes as an average everyday home for consumers.


    # Advanced Mobile Technology


    ![](img/9fe8d2acb79e08fc7077850a9468c4c3_95_0.png)


    If you have watched the evolution of cellphones, you have seen from simple phones
    in your pocket that could merely be used to call mini-computers that are capable
    of performing many incredible functions. Social media, texting, managing your
    calendar, taking high quality photos, and many other things can be completed using
    current smart phones.


    As they continue developing deep learning technology and refining deep neural
    networks, it is likely that we will continue to see the smart phone even smarter.
    Over time, these devices may become personal managers that we carry around in
    our pockets. We would be able to accomplish many of the same things we already
    complete without having to take out or interact with them in any way beyond speaking.
    We would be able to communicate with the device and it would do everything from
    mark cancel dinner reservations to order new outfits or products straight to our
    home. They could communicate with our friends for us to establish plans or help
    us communicate with clients if it were to be used as a business device.


    Essentially, anything that is typically done by a personal manager can be done
    by your phone one day Having personal manager would no longer be reserved for
    those who are rich and famous, as we would have all one in the form of a mobile
    device.


    # Automated Commercial Use Programs


    In addition to managing our personal lives, deep learning machines could be used
    to manage businesses and organizations as well. They could organize and arrange
    business meetings, reserve tables or spaces for the meetings to be held, and send
    out automated reminders to everyone who is required to show up without ever having
    to be present for the arranging. One person could communicate with the device
    and every other person would have that information and would be able to automatically
    perform any activities that need to be accomplished in advance. These devices
    could also be used to manage advertisements. They could be responsible for collecting
    data and creating advertisement campaigns for various products or businesses based
    on what was presently taking place in the company. For example, they could determine
    the target'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'audience and how to target them, what parameters would be included in the campaign
    to ensure that they were reached, and what graphics should be used in order to
    appeal to the consumer. They would also be able to measure any metrics and data
    that was returned by the campaign, including how well it performed, how much money
    each lead cost, the value of each lead, and what could be done to make the campaigns
    even more effective going forward. Everything would be entirely done by a device
    and nothing would ever have to be done by an individual person.


    There are many other ways that learning machines could be great for businesses
    as well. They could be used to oversee the payments made to and from companies,
    order products or services, schedule employees, hire and fire employees, and more.
    There are truly limitless opportunities when it comes to learning about what could
    be done in a corporate or commercial world using deep learning machinery.


    # Partial Artificial Intelligences


    Although the focus often remains on completely artificial intelligence, it is
    worth paying attention to the idea of partial artificial intelligence as well.
    This would be a system that is more advanced than specialized machines but not
    quite a complete artificial intelligence. For example, it could be a human-sized
    and shaped figure that your personal manager and was capable of taking commands
    and completing many functions but not entirely independent. Instead, it still
    relies somewhat on human interaction to complete many functions. This device could
    be responsible for helping you your day, schedule commitments, order stuff for
    your house or yourself, and otherwise perform daily activities. It could also
    help you manage other partial artificial intelligences you may have.


    Yes, in addition to a personal manager style artificial intelligence, you could
    have one that was responsible for physically taking care of your house, one that
    was responsible for driving your car, and other such things. These would be partial
    robots capable of performing complex and advanced tasks, but not completely capable
    of operating on their own with zero assistance from a human. They would be an
    incredible addition to help people perform daily activities without having to
    do them on their own, but they would be manageable and programmable by humans.


    One why a partial intelligence like this is useful, even one that could perform
    all the aforementioned tasks, is because it reduces or even eliminates the fear
    of having a complete artificial intelligence that could take over the world. These
    ones would be manageable and could be stopped the instant they attempted to cause
    any harm. They would not be completely independent and therefore could be prevented
    from wreaking havoc on society the way a completely artificial intelligence might
    be able to. It would help reduce many of the fears that several people have around
    while still offering all the benefits and convenience of an artificial intelligence
    that was capable of performing complex tasks for its owners.


    # Complete Artificial Intelligences'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Once again, we discuss the potential of creating a completely artificial intelligence.
    Complete artificial intelligences would be literal superhumans. They would be
    capable of doing anything a human could. They would fulfill and execute complex
    actions and functions, carry on intelligent conversations, learn, grow, and do
    virtually anything a human could.


    While the idea of creating an complete artificial intelligence is staggering,
    a completely artificial intelligence may be beneficial overall, but it could also
    pose many threats and dangers to society. If they create their own complete artificial
    intelligence replicas and develop their society with as many or as few as they
    wanted. They would be able to create armies, potentially destroy society, and
    even wipe humans out. If we were to have created artificial intelligences, it
    could even be that one were hacked or turned "evil" and thus create a large amount
    of damage in society. Since they would be created to be so strong and virtually
    perfect, the "imperfect" humans would be capable of stopping them. We would have
    to outsmart them, since the intelligence would be created to be smarter than us,
    that be virtually impossible. We would not have the strength to stop them and
    would require the involvement of other artificial intelligences which could ultimately
    lead to a war between superhuman machines and humans.


    Although the idea of creating a completely artificial intelligence is incredible,
    it is highly unlikely. Not at any time in the near future. Having a completely
    artificial intelligence would require us to know basically everything there is
    to about the human brain in order to recreate it in a machine form. We would also
    have to know how to recreate it in machine form not to only function like ours
    but to function better. This is highly unlikely, potentially impossible. If it
    were to happen, it is likely that it wouldn''t happen for another few generations
    at least. And when it did, these machines would have to be created in such a way
    that they could be outsmarted, which then take away from being entirely artificial
    intelligences. So, unless developers and the government are willing to jeopardize
    society as a whole, it is extremely unlikely that we will see a true and complete
    artificial intelligence.


    The future of deep learning is vast and incredible. There are so many things that
    could take place it is hard to dream upon every single. There are truly many routes
    that this technology could go and the only way we will ever know where it ends
    up is by watching and waiting. Deep learning networks are essentially our key
    to creating the sci-fi world that we all dreamed about one time or another, watched
    or read in pop culture. There are so potentially incredible, and devastating,
    things that could happen as society without having a significantly negative impact
    from deep learning. In order for us to continue advancing as a society must take
    our time and roll things out slowly.


    Additionally, major developments must be monitored and thoroughly understood before
    they are ever exposed to the general public. If something were not fully comprehended
    and were to be released too soon, could wreak serious havoc on society. The reality
    is, a human with bad intentions could turn basic deep learning against society.
    It is important that we take our time and really investigate each part of the
    process and continue learning more and more about deep learning and deep neural
    networks before we ever plan to use them as a large and important part of society.'
