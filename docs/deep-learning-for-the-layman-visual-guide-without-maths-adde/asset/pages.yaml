  md: '# Book Objectives


    If you are interested in learning more about deep learning, what is used to create
    them, the concept of deep learning, the techniques used by the machines, and the
    tools that are being designed by scientists, then Deep Learning: Concepts and
    Algorithms is exactly what you need. This book will help you explore exactly what
    deep learning is and will also teach you why it so revolutionary and fascinating.
    By the end, you will have a full understanding of what this technology is, how
    it works,


    This book will help you:


    +   * Have an appreciation for deep learning and an understanding of their fundamental
    principles.

    * Have an elementary grasp of deep learning concepts and algorithms.

    * Have achieve a technical background in deep learning and also artificial neural
    networks


    # Target Users


    The book designed for a variety of target audiences. The most suitable users would
    include:


    +   * Newbies in computer science techniques and deep learning

    * Professionals in data science and social sciences

    * Professors, lecturers or tutors who are looking to find better ways to explain
    the content to their students in the simplest and easiest way

    * Students and academicians, especially focusing on neural networks and deep learning


    # Is this book for me?


    If you want to learn more about deep learning without technical formulas and practical
    data, this book is for you. No need for maths and coding knowledge is required.
    This book has been written in layman''s terms as an introduction to deep learning
    and neural networks and their algorithms. Each algorithm is explained very easily
    for more understanding.'
