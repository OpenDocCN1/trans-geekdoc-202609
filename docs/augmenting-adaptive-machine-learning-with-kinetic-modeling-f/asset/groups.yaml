    longistrobus*— presented the blueprints for efficient platelet-derived growth
    factor receptor alpha kinase (PDGFRα) modulation while using self-organizing maps
    for target deorphanization. The tractability of 1 as a prototype for medicinal
    chemistry was demonstrated by the development of potent PDGFRα and IkB kinase
    inhibitors based on the imidazoquinoline scaffold—a hinge binding motif (Figure
    1). However, synthetic access to 1 through Friedländer quinoline synthesis proved
    challenging in our hands. Poor (15%) yield was obtained, which limited screening
    efforts on a wider scale.


