    为全面表征该转化，我们在95%置信水平下提取了一级和二级速率（k）、平衡（Keq）常数及活化能（Ea）值（参见表S4）。反应速率预测表明，1的生成发生迅速，脱水步骤为限速步骤。结果还表明，2-氨基苯甲醛的消耗是通过羟醛缩合朝向中间体2进行的。此外，当使用过量2-氨基苯甲醛和t-BuOK时，1相对于消去步骤倾向于缓慢降解。领域知识表明，在碱性条件下形成席夫碱不可行。作为对拟议机制的对抗性对照，我们拟合了一个假设以亚胺形成作为第一步的模型。结果与既定直觉一致，并断言2的形成（$k_\text{min}e
    = 0.01 M^{-1} s^{-1}$ vs $0.05 M^{-1} s^{-1}$），从而为我们的动力学模型提供了额外的置信度。


    从更广阔的角度来看，我们通过一种正交手段验证了ML预测，因为我们的研究中两种方法均趋同于相同的反应方案和预测产率。更具体地说，动力学模型表明，在78 °C下，分别使用2和1.05摩尔当量的2-氨基苯甲醛及t-BuOK，经过593
    min反应，可在最小化副产物的同时达到全局最优（图S15）。然而，将两种方法整合为一个精简工作流是有价值的。动力学模型通过阐明反应机理和速率常数，增强了从ML得出的直觉。它还揭示了副产物对优化合成方案开发的影响，尽管需要耗时的计算（ML约需5–10
    min，而动力学模型约需220–250 min）。共同，这证实了通过ML进行模式识别的威力。当增加价值合理时，它也为采用计算成本高昂的方法提供了动力。


    总之，我们实施了一个包含自适应学习和动力学建模的级联工作流，以促进通过Friedländer化学获得1并提供物理化学见解。整个优化过程——包括特征选择、随机选择、超参数调优和ML选择——允许对实验进行优先排序并识别最优解，同时仅执行所有可能反应的少量部分（3%）。这很重要，因为ML可以同样作为实验的优化器或微调器，分别以不良或良好产率作为起点。此外，该过程还允许建立转化的机理路径。我们的研究为过程化学中确立概念与新兴技术的可行整合提供了概念验证。最终，它可能通过加速筛选目的高价值化学品的获取，对分子医学管道产生影响。我们预见此类及类似整合将充当研究助手，促进基于概率的知情决策，并在数字化学时代实现有机合成的民主化。


