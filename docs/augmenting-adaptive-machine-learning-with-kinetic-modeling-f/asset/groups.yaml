    Machine Learning. We used random forest regressors and probed several hyperparameters
    [number of trees (100–1000), tree depth (none, 2, 4) and number of features (auto
    or sqrt)] to create a prediction model. A 10-fold cross-validation was applied,
    splitting the data set into a training group with 90% of data and test group with
    the remaining 10%. The selection of best hyperparameters was guided by the calculation
    of the mean absolute error (MAE). With these parameters, the model predicted the
    product yield for the remaining possible reaction conditions, and then the next
    reaction was selected. An exploration approach was applied for the first three
    iterations to allow model improvement. For the next iterations, an exploitative
    approach was applied by selecting the reaction with the lowest variance among
    the predicted top-5 high-yielding reactions. The model develops with each added
    data point by improving its predictive model. The model and data analyses were
    fully implemented in Python 3.7.3 using the NumPy 1.16.4, Pandas 0.24.2 and Scikit-learn
    0.21.2 libraries and was run (5–10 min) on an HP ProBook G3 (2.40 GHz 2 core processor,
    4 Gb RAM). For initialization, 20 random reactions were performed in parallel
    (Table S1) and analyzed through HPLC to create the first training data set. Using
    a calibration curve, it was possible to quantify the product yield obtained in
    each reaction. Based on this data, the machine learning routine selected one additional
    set of conditions, at a time, for experimental validation. The output for the
    selected experiment was added to training set and an iterative process involving
    design–make–test was pursued over five iterations. Code for the optimization routine
    is accessible at https://github.com/tcorodrigues/LabMate. ML.


    Machine Learning Controls. To evaluate the robustness of the method, other models,
    such as linear regression, ridge, and lasso, were computed. In parallel, we performed
    y-randomization studies to rule out artifacts in the decision process of our random
    forests. Error metrics, such as the root mean square error (RMSE), mean absolute
    errors (MAE), and coefficient of determination (r2) were calculated and used for
    comparison between the different methods.


    Kinetic Method. The DynoChem software (Scale-Up Systems; Build: 1.3.20b340, Data
    Version: 1.0) was used for reaction modeling. The software includes model templates,
    provides simulator, fitting, and optimization add-in options to run the models.
    In this work, we used a single model template to fit all experiments and calculate
    kinetic parameters. We employed the Levenberg–Marquardt algorithm for fitting,
    during minimization of SSQ, and the Backward Euler (BE) integration method to
    solve the mass balance differential and algebraic equations associated with the
    reaction. The kinetic parameters were calculated at a defined reference temperature
    (78 °C). All reactions were run for 360 min and aliquots collected at specified
    time points. Analyses were performed in HPLC and based on calibration curves.


