    机器学习。我们采用了随机森林回归器，并探测了多个超参数[树的数量（100–1000），树深度（无，2，4）以及特征数量（自动或平方根）]来构建预测模型。采用了10倍交叉验证，将数据集分为包含90%数据的训练组和剩余10%的测试组。最佳超参数的选择由平均绝对误差（MAE）的计算指导。使用这些参数，模型预测了其余可能反应条件的产物产率，然后选择了下一个反应。对前三次迭代应用了勘探方法以允许模型改进。对于后续迭代，通过选择预测中前5个高产反应中方差最低的反应，应用了开发方法。模型随着每个新增数据点的加入而通过改进其预测模型来发展。该模型和数据分析完全使用Python
    3.7.3以及NumPy 1.16.4、Pandas 0.24.2和Scikit-learn 0.21.2库实现，并在HP ProBook G3（2.40
    GHz 2核处理器，4 Gb RAM）上运行（5–10 min）。为初始化，并行进行了20个随机反应（表 S1），并通过HPLC分析以创建第一个训练数据集。使用校准曲线，可以量化每个反应中获得的产物产率。基于这些数据，机器学习例程一次选择一组额外条件用于实验验证。所选实验的输出被添加到训练集中，并进行了涉及设计–制造–测试的迭代过程，共五次迭代。优化例程的代码可在
    https://github.com/tcorodrigues/LabMate 获取。ML.


    机器学习对照。为评估该方法的鲁棒性，计算了其他模型，如线性回归、岭回归和套索回归。与此同时，我们进行了y随机化研究，以排除随机森林决策过程中的伪效应。计算了根均方误差（RMSE）、平均绝对误差（MAE）和决定系数（r2）等误差指标，并用于不同方法之间的比较。


    动力学方法。使用DynoChem软件（Scale-Up Systems；构建：1.3.20b340，数据版本：1.0）进行反应建模。该软件包含模型模板，并提供模拟器、拟合和优化插件选项来运行模型。在这项工作中，我们使用单一模型模板来拟合所有实验并计算动力学参数。我们采用Levenberg–Marquardt算法进行拟合，在最小化SSQ期间，并使用Backward
    Euler（BE）积分方法求解与反应相关的物料平衡微分和代数方程。动力学参数在定义的参考温度（78 °C）下计算。所有反应运行了360 min，并在指定时间点收集分析样品。分析通过HPLC进行，并基于校准曲线。


