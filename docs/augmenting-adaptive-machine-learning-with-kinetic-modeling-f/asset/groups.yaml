    在此Friedländer喹啉合成中，小反应体积至关重要，长时间回流同样关键（图3a,b）。的确，在未编码任何显式化学知识的情况下，我们的ML程序能够自主形式化直觉的不成文规则，这印证了其效用。这些解释支持反应优化可以有效配置为数据挖掘问题。此外，通过流形学习（图3c），我们确认所有反应在特定的反应性岛屿中共聚类，这些岛屿被我们的算法利用，且每个簇可以以中等产率得到1。该结果提供了所追求选择策略的易于可视化的解释。此外，可以观察到，迭代搜索主要围绕初始化步骤中表现最佳的随机反应进行，而不会削弱对最优解的识别（例如，迭代2）。


    在此基础上，我们接下来思考初始搜索空间离散化步骤是否限制了识别全局最优解的能力，因此ML是否仅用于对Friedländer反应性空间进行快速但粗粒度的探测，且仍有改进空间。为此，我们开展了一系列实验来模拟反应动力学、识别全局最优解并建立机制。具体地，我们探索了2-氨基苯甲醛原料（0.94、1.0、1.45、2.0）、t-BuOK（1.25、1.5、2.2、2.9）以及温度值（40、53和78
    °C；参见表S4）的不同摩尔当量值。在这些实验中，在指定时间点收集反应混合物的分取样品，并通过HPLC–UV/vis–MS（例如，图4a）定量所有相关物种。这使我们能够


