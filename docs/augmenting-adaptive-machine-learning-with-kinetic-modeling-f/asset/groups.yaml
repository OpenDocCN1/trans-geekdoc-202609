    随后，基于描述上述所有物种随时间浓度变化的反应速率的微分方程，开发了Friedländer喹啉合成的动力学模型。通过使用基于梯度的Levenberg–Marquardt算法，将实验数据与模型预测之间的平方和最小化，在DynoChem（Scale-up
