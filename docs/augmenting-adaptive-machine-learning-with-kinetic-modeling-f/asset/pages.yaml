  md: 'exploits kinetic modeling to motivate reaction conditions lead to productive
    syntheses.22,23 Ultimately, this approach allows a data-informed elucidation of
    reaction mechanisms and tailored protocol design.22,24 Herein, we build on our
    prior ML workflow and provide a preliminary proof of concept for cascading active
    learning and kinetic modeling as an approach toward fast reaction optimization,
    including the identification of a global optimum. Using 1 as the model compound,
    our ML tool rapidly exploited a discretized Friedländer reaction space. The generated
    insights were subsequently augmented with kinetic modeling to ascertain a reactivity
    pathway and corresponding rate/equilibrium constants, which to the best of our
    knowledge have not been determined.25 We also confirmed that the ML routine had
    rapidly converged to a global optimum (88%) with minimal experimental effort.
    Overall, our multiscale, human-in-the-loop approach may prove transferable to
    other chemistries and enable the swift access to high value chemical matter by
    democratizing organic synthesis.


    To delve into the reactivity space and identify an optimal synthesis protocol
    toward 1, we initially surveyed the literature and collected preferable conditions
    that could be experimentally probed26–30 (Figure 2a). These included different


    ![](img/9970a440d267063602c5f557ad656a85_1_0.png)


    Figure 2. Optimization of reaction conditions toward isomocroin, 1. (a) Six reaction
    variables were probed in the optimization of a Friedländer quinoline synthesis.
    Both real-valued and categorical features were considered, affording a search
    space for 756 possible reactions. Categorical variables were one-hot encoded for
    modeling. Real value variables were employed for modeling without any transformation.
    (b) Optimization routine, following a user-defined number of random reactions
