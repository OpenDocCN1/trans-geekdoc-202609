  md: '# # Augmenting Adaptive Machine Learning with Kinetic Modeling for Reaction
    Optimization


    A. Filipa Almeida, Filipe A. P. Ataíde,* Rui M. S. Loureiro, Rui Moreira, and
    Tiago Rodrigues*


    ABSTRACT: We combine random sampling and active machine learning (ML) to optimize
    the synthesis of isomacroin, executing only 3% of all possible Friedländer reactions.
    Employing kinetic modeling, we augment machine intuition by extracting mechanistic
    knowledge and verify that a global optimum was obtained with LM. Our study contributes
    evidence on the potential of multiscale approaches to expedite the access to chemical
    matter, further democratizing organic chemistry in a data-motivated fashion.


    ![](img/9970a440d267063602c5f557ad656a85_0_0.png)


    Synthetic organic chemistry toward high value bioactive entities and materials
    is key in modern molecular medicine, but often delivers suboptimal processes and
    insufficient amounts of chemical matter for advanced functional profiling. Indeed,
    the lack of screening materials for biological investigations may curb or delay
    the identification of potentially life-changing therapies. Natural products (NPs)
    have long been exploited as therapeutics or as a source of inspiration for molecular
    design due to the biological prevalidation of their frameworks as protein-binding
    motifs. In fact, ca. 33% of approved small-molecule drugs are either NPs or NP-derived
    compounds, which highlights their value in translational science.


    Fragment-like NPs usually provide simpler and synthetically more accessible architectures
    that can also be readily adopted for myriads discovery chemistry applications.
    For example, we had unveiled that isomacroin (1) —a fragment-like NP from *Macrorungia
    longistrobus*— presented the blueprints for efficient platelet-derived growth
    factor receptor alpha


    kinase (PDGFRα) modulation while using self-organizing maps for target deorphanization.
    The tractability of 1 as a prototype for medicinal chemistry was demonstrated
    by the development of potent PDGFRα and IkB kinase inhibitors based on the imidazoquinoline
    scaffold—a hinge binding motif (Figure 1). However, synthetic access to 1 through
    Friedländer quinoline synthesis proved challenging in our hands. Poor (15%) yield
    was obtained, which limited screening efforts on a wider scale.


    With that problem in mind, we have recently developed LabMate.ML—a self-evolving
    machine-learning (ML) routine for digitalizing reaction optimizations under low
    data regimes—with the goal of providing an interpretable, generalizable, and nonexhaustive
    search space exploration alternative to full/fractional factorial “design-of-experiments”.
    The method leverages information in a small set of random reactions for initialization,
    and adaptive random forests powered by a bespoke experiment selection policy to
    iteratively drive the optimization process. In a previous report, and in alignment
    with related methods, we have shown that LabMate.ML not only efficiently modeled
    real-valued and categorical variables but, more importantly, was competitive with
    expert intuition in competition studies. Taking advantage of its decision process,
    interpretable outputs could also be extracted to augment domain intuition.


    Notwithstanding the prior success of LabMate.ML, daily practice in process chemistry
    optimization more frequently


    ![](img/9970a440d267063602c5f557ad656a85_0_1.png)


    Figure 1. Structure of isomacroin, 1, and related molecules as human kinase inhibitors.
    The framework of 1 is highlighted in the NP-derived, bioactive small molecules.


    Special Issue: Enabling Techniques for Organic Synthesis


