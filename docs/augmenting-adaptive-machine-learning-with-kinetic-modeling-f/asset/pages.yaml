    reasonable convergence was obtained (blue).


    solvents and their volume, bases and molar amount, temperature, and reaction time.
    The reaction variables were encoded as real values (e.g., volume) or strings as
    in the case of categorical (e.g., base) variables. For machine interpretation
    and modeling, categorical variables were then one-hot encoded, denoting either
    the presence (“1”) or absence (“0”) of a specified entity. Collectively, 756 reactions
    were digitalized in high dimensional space, which in this case constitutes more
    combinations than are reasonably feasible to screen. This search space was subjected
    to iterative investigation by our adaptive random


    forest routine—a supervised learning algorithm that harnesses the “wisdom of the
    crowds” concept by aggregating individual predictions from uncorrelated decision
    trees. Because each tree analyzes a fraction of data, only weak predictions are
    individually expected as output. However, averaging those over n trees allows
    for a significantly more realistic prediction and uncertainty estimation. Together,
    these characteristics endorse the popularity of random forests in the chemical
    sciences17,31,32 and make them robust to common pitfalls in ML research, such
    as outliers, noise, and overfitting.33,34


    To initialize the optimization campaign, 20 random reactions were performed. Their
    outcomes (target variable/ yield) were collected via a calibration curve that
    was built from the area under the curve for the required product peak at different
    concentration values (HPLC–UV/vis–MS traces). Interestingly, one such random reaction
    corresponded to literature conditions,11 but afforded a higher yield in this reassessment
    (76% here vs 15% literature). The obtained yield was still used as benchmark,
    yet highlights the previously discussed variability in chemical data that can
    determine the predictive power of statistical learning.35 All random reaction
    conditions and their yields (0–76%, Figure 2b) were employed as an initial training
    set, and a stratified 10-fold cross-validation routine, wherein analyses are repeated
    with 90% of data used for training and 10% as internal test set, was implemented
    for a preliminary assessment of the model utility. By harnessing a previously
    validated18 “greedy” approach for experiment prioritization, i.e., selecting reactions
    with high-predicted yield and low uncertainty, our recommender tool rapidly (over
    five iterations) converged to an optimum (Figure 2b). Relative to the literature
    conditions, the ML routine elected to substitute the base (KOH to t-BuOK) and
    its molar equivalent amount (from 1.25 to 1.50 molar equiv) to afford 1 in 88%
    yield (cf. Table S1). Our understanding is that such modifications are reasonable
    and among the top variables a skilled chemist would also probe, which supports
    a correct formalization of chemical intuition by the computational tool.


    Additionally, shuffling of target (Y) variables resulted in less predictive control
    models. This evidenced that meaningful, true patterns in the data structure had
    been disrupted in the Y-randomization process (cf. Table S3). We deemed this control
    necessary due to the high likelihood of ML heuristics exploiting artifacts and
    memorizing rather than learning data.36–39 This is especially critical when dealing
    with low data in high dimensional space, as in the present case. Finally, we studied
    if different baseline algorithms, e.g., linear, lasso, and ridge regression, could
    provide similar or better statistical models relative to our random forests while
    enforcing simplicity in the decision process. Our method proved more accurate
    and efficient in navigating the training data, as assessed through RMSE and MAE
    values (cf. Table S2). Overall, the results attest to the appropriateness and
    robustness of adaptive random forests for assisting chemists in reaction optimization
    problems.


    It is now established that different ML algorithms can afford expert level predictions
    in numerous tasks relevant to the chemical sciences.40–42 However, it is still
    usual to harness ML as black boxes, wherein no insight into the decision process
    is provided. This can not only hinder the adoption of potentially useful technologies
    but also bypass on new knowledge that might otherwise remain hidden to perception.43
    To shed light onto the key variables for our statistical model and infer on their
    directionality, i.e., desired or undesired, we extracted'
