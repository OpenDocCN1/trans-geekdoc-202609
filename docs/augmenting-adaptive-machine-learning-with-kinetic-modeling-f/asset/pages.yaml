    In this Friedländer quinoline synthesis, small reaction volumes were crucial,
    as was refluxing for a long period of time (Figure 3a,b). Indeed, without encoding
    any explicit chemical knowledge, our ML routine was able to autonomously formalize
    unwritten rules of intuition, which corroborates its utility. These interpretations
    support that reaction optimizations can effectively be configured as data mining
    problems. Furthermore, with manifold learning (Figure 3c) we confirmed that all
    reactions cocluster in specific islets of reactivity that were exploited by our
    algorithm, and that each cluster can afford 1 in moderate yields. This result
    provides a readily visualizable interpretation of the pursued selection policy.
    Moreover, it is possible to observe that the iterative search chiefly revolved
    around the best performing random reactions in the initialization step, without
    undermining the identification of an optimum (e.g., iteration 2).


    With this result in hand, we next wondered if the initial search space discretization
    step had limited the ability to identify a global optimum and, therefore, if ML
    served the purpose of a swift yet coarse-grained interrogation of the Friedländer
    reactivity space with additional room for improvement. To that end, we set up
    a series of experiments to model the reaction kinetics, identify a global optimum,
    and establish a mechanism. Specifically, we explored different molar equivalent


    values for the 2-aminobenzaldehyde starting material (0.94, 1.0, 1.45, 2.0), t-BuOK
    (1.25, 1.5, 2.2, 2.9), and temperature values (40, 53, and 78 °C; cf. Table S4).
    In these experiments, reaction mixture aliquots were collected at specified time-points
    and all relevant species were quantified through HPLC–UV/vis–MS (e.g., Figure
    4a). This allowed us


    ![](img/9970a440d267063602c5f557ad656a85_2_1.png)


    Figure 4. Kinetic modeling as an orthogonal approach to augment machine-learning
    outputs. (a) Exemplary, overlaid HPLC–UV traces (0.5 and 6 h) showing the formation
    of isomacroin over time. (b) Exemplary plot showing the evolution of species concentration
    over time and fitted curve. Kinetic parameters were extracted from a series of
    similar experiments.


    monitoring the concentration increase/decrease of each starting material, product,
    and byproduct over 360 min of reaction (e.g., Figure 4b). While reaction intermediates
    may provide an additional layer of information and confidence in downstream data
    inference, such species were not quantifiable through our analytical method. We
    thus assumed their transient nature and did not consider them for modeling.


    A kinetic model for the Friedländer quinoline synthesis was then developed based
    on differential equations that describe the reaction rate as a function of concentration
    change over time for all above-mentioned species. This valuable information was
    modeled in DynoChem (Scale-up Systems)46 by minimizing the sum of squares between
    the experimental data and model predictions using the gradient-based Levenberg–Marquardt
    algorithm.


    The fitted model led us to establish the reaction mechanism toward 1, in line
    with the literature25 (Figure 5). To fully profile the transformation, we extracted
    the first- and second-order rates (k), equilibrium (Keq) constants, and activation
    energy (Ea) values at a 95% confidence level (cf. Table


