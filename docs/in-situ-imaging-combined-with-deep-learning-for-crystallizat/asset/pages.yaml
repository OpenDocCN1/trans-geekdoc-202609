  md: "robust monitoring of the slurry is essential for the production of a pure and\
    \ high-quality product that meets set quality-attribute standards. We take the\
    \ production of cephalexin (CEX, a beta-lactam antibiotic with a large annual\
    \ production rate of >5,000 tons per year31) as an example where a byproduct of\
    \ the reaction may crystallize and contaminate the product in the event of deviation\
    \ from the process set point.32\n\n# 2. MATERIALS AND METHODS\n\n# Crystallization\
    \ Experiments.\n\nIndustrial processes for cephalexin production typically use\
    \ an enzymatic reaction between an activated acyl donor such as phenylglycine\
    \ methyl ester (PGME) and the beta-lactam nucleus 7-aminodesacetoxy-cephalosporanic\
    \ acid (7-ADCA).31,32 The biocatalyst used in this process is typically penicillin\
    \ G acylase (PGA), which catalyzes the primary reaction of producing cephalexin\
    \ as well as two hydrolysis side reactions shown in eq 1. In the reactive crystallization\
    \ process, conditions are set such that cephalexin is crystallized in the reactor\
    \ to produce CEX crystals, which protects the cephalexin from biocatalytic hydrolysis.32\
    \ However, the byproduct phenylglycine (PG) has a low solubility in water (~30–35\
    \ mM at 25 °C and pH = 5.5–7.533) and may crystallize and contaminate the product\
    \ if generated in excess.\n\n```\nPGME + 7-ADCA\n  → MeOH + CEX\n  → CEX·H₂O (crystal)\n\
    \nPGME + H₂O → MeOH + PG → PG (crystal)\n\nCEX + H₂O → 7-ADCA + PG → PG (crystal)\
    \    (1)\n```\n\nFor the production of CEX crystals, pH manipulations were used\
    \ to generate the required supersaturation (solubility of cephalexin in water\
    \ as a function of pH value is presented in Figure S1 in Supporting Information).\
    \ A typical crystallization experiment started with dissolving a sufficient amount\
    \ of CEX solids (RIA, Hanover, NJ) in 200 mL of deionized water at pH 7.5 to prepare\
    \ a saturated solution. After saturation, the resulting solution was filtered\
    \ to remove any undissolved solids. The solution was then transferred to a jacketed\
    \ crystallization vessel that maintained a temperature of 25 °C and was mixed\
    \ using a pitched blade stainless-steel impeller (with four 45° blades and 1 cm\
    \ off-bottom clearance) at 250 rpm. Crystallization was started by adding 0.05\
    \ g of ground seed crystals and adding 2 M HCl to acidify the solution and generate\
    \ supersaturation. The pH value was lowered from the initial 7.5–5.5 over a period\
    \ of 2–3 h using a Mettler-Toledo SP-50 dosing unit. The slurry was mixed for\
    \ 3–5 h after the pH manipulation and until no significant change in the solution\
    \ turbidity (measured using the EasyViewer probe) was detected. Figure 2 shows\
    \ the course of a typical CEX crystallization experiment where pH and turbidity\
    \ values are tracked.\n\nPG crystals were produced in two sets of experiments.\
    \ In the first, PG was crystallized using the same pH swing method described above;\
    \ initial and final pH values ranged from pHinitial of 9 to pHfinal of 5 (PG solubility\
    \ in water as a function of pH is provided in Figure S1 in Supporting Information).\
    \ The crystals were filtered, dried at room temperature, and later sieved to remove\
    \ large agglomerates (particles >300 μm). In the second set, PG was formed under\
    \ conditions mimicking that of the enzymatic synthesis. The PGA biocatalyst (obtained\n\
    \n![](img/548193ad63966e98f89fe201ab5832bb_2_0.png)\n\nFigure 2. Solution pH value\
    \ and turbidity throughout a CEX monohydrate crystallization experiment. The in\
    \ situ image on the left shows the initial seeded solution, and the image on the\
    \ right shows the slurry at the end of the experiment.\n\nfrom Centrient, Netherlands)\
    \ at a concentration of about 2 μM was added to a CEX slurry saturated with PG\
    \ at pH = 7. The solution was then given sufficient time for the enzyme to hydrolyze\
    \ the cephalexin and produce sufficient PG supersaturation for PG crystallization\
    \ to occur (5–8 h). PG particles formed by the first method (pH swing) had a larger\
    \ mean size which helps to quantify their number density in a solution more accurately.\
    \ PG particles formed by the second method (enzymatically) had a smaller mean\
    \ size but more accurately represent the shape and characteristics of the byproduct\
    \ particles formed during the enzymatic synthesis of cephalexin. Figure 3 shows\
    \ the in situ image and offline optical microscope image of systems containing\
    \ each type of PG particles (plate-like) with cephalexin (needle-shaped).\n\n\
    ![](img/548193ad63966e98f89fe201ab5832bb_2_1.png)\n\nFigure 3. Optical microscope\
    \ and in situ images from CEX and PG crystals, highlighting the PG particles made\
    \ via the enzymatic (top) and pH swing (bottom) methods. PG particles are outlined\
    \ with dashed circles.\n\n# Training Data Preparation.\n\nTwo image classes are\
    \ defined, a “Good” class, that is, pure CEX crystals in the slurry, and a “Bad”\
    \ class, that is, PG crystals (made by either the enzymatic or pH-swing method)\
    \ in the predominately CEX slurry. For each system, a set of training data was\
