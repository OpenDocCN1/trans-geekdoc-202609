    size range is to use the average size of the bounding boxes drawn during the training
    data preparation. Other methods such as building an image pyramid for detecting
    instances of an object with different scales are common in computer vision.37
    However, considering that crystals’ characteristics are known in our case, we
    have limited our analysis to each image’s original scale.


    In some cases (such as panel c in Figure 7), several overlapping or neighboring
    regions are reported, which is a result of the sliding window grid and the overlap
    threshold used for NMS. Sliding window size and the threshold used in NMS are
    hyperparameters that can be adjusted for specific cases to reduce the number of
    overlapping regions; nevertheless, the main goal of locating the PG particle is
    achieved. Another observation is that depending on the classification threshold
    used some regions might or might not be flagged. Classification threshold in Figures
    7 and 8 refers to the class Bad score above which the model flags the corresponding
    region. The choice of the classification threshold may be any number in the range
    of 0.5–1 (below 0.5 being assigned to the other class), and it directly impacts
    the false-positive and false-negative rates. For example, in Figure 7 panel b,
    using the value of 0.8 leads to a false-positive in the center of the image. On
    the other hand, using the value of 0.9 leads to a false-negative in panel f. This
    threshold is an important hyperparameter in the model and should be chosen based
    on the specific process at hand and the degree of acceptable risk in it.


    To further test the accuracy and limit of detection of the image analysis model,
    experiments were conducted with a gradually increasing number of PG crystals.
