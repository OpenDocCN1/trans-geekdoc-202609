    sliding window size. Size of the sliding window should be chosen considering the
    system under study and the characteristics of the specific crystals. For example,
    for PG crystals made by the pH swing method (Figure 3), crystals are relatively
    larger than those produced by the enzymatic route. Naturally, the sliding window
    grid used for that system is chosen such that it has larger candidate boxes (100–125
