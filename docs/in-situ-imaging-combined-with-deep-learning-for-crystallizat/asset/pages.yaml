  md: 'employed, which utilize hydrodynamic focusing, backlighting, and dilution to
    obtain images of in-focus, clearly delineated, nonoverlapping crystals.^{16,18,19}
    Image quality sometimes is gained at the cost of not accurately representing the
    crystal population: conditions (e.g., temperature) in the sample loop may not
    match those in the crystallizer, throughput can be low, and well-mixed isokinetic
    sample withdrawal may be a poor assumption. Besides practical problems associated
    with having a high-resolution camera inside or in an external loop parallel to
    a crystallization vessel, a range of challenges related to the analysis of captured
    images may hinder gaining usable information from them. Some of the common challenges
    in computer vision are illumination, rotation, and deformation, overlap or occlusion,
    background clutter, and interclass variation,^20 many of which are common in crystallization
    especially in images captured *in situ*.


    Using imaging to monitor a crystallization process requires (1) high-quality images
    that provide information on the shape and texture of the particles and (2) robust
    image analysis to extract useful information from each image by translating the
    image to qualitative or quantitative data for subsequent decisions. The first
    is possible thanks to recent advancements in PAT development. There are different
    commercial or custom-built instruments used in the literature for *in situ* imaging
    in crystallization processes, such as EasyViewer, Blaze, and EZprobe.^11,12,21
    As an example, the Mettler-Toledo particle view and measurement (PVM) probe, EasyViewer
    100, used in this study is capable of capturing high-resolution images (1500 by
    1500 pixels) as frequently as one image per second. There are also numerous studies
    by the crystallization community using a variety of image analysis methods to
    analyze slurry images. However, most of these are based on traditional methods.
    These typically start with a series of image modification and enhancement steps
    and use edge detection algorithms, such as the Sobel operator, to detect and characterize
    single objects in an image.^22–24 The main issue with this approach is that dense
    slurries (or dense images) with significant particle overlap cannot be parsed
    into individual objects. This is partially why many of the reports in the literature
    use either external loops and a flow cell or offline imaging to acquire analyzable
    images from a crystal slurry. Figure 1 provides an example highlighting the complexities
    of *in situ* images versus offline images captured from diluted samples. Another
    issue with the traditional approaches is that


    ![](img/548193ad63966e98f89fe201ab5832bb_1_0.png)


    **Figure 1.** Comparison between offline microscopy (a) and *in situ* image (b)
    from a cephalexin monohydrate (CEX) slurry. The *in situ* image highlights many
    of the typical image analysis challenges, such as highly overlapped objects. The
    needle-like shape and high number density of the crystal particles further complicate
    the analysis of the *in situ* image.


    the developed algorithms typically have several hyperparameters that may significantly
    impact the image analysis results. This is an issue especially when the goal is
    to quantify the crystal size distribution which might be impacted by the choice
    of hyperparameters (a simple example is the impact of dilation and erosion operations
    on the estimated size of a particle).


    Modern computer vision is mainly based on data-driven models and deep learning
    in the form of convolutional neural networks (CNNs).^{25,26} In short, in a typical
    deep learning-based image analysis method, a series of filters (convolutional
    layers) are applied to an input image (possibly after some image modification
    or enhancement steps), and the results are a series of feature maps that highlight
    certain characteristics of the input image. These feature maps then can be used
    by fully connected layers for different purposes such as classification. Finally,
    each filter and other layers’ parameters are optimized during the training step
    to achieve the best performance. Naturally, similar to other deep learning-based
    models, training these networks requires substantial amounts of data, especially
    for deeper networks which may possess millions of parameters.^26 Modern *in situ*
    imaging probes can capture thousands of images per hour of process time, providing
    a significant amount of data that can be used for training these networks. There
    are several well-known CNN architectures that are pretrained on standard image
    data sets and are capable of extracting different low- and high-level image features.
    These pretrained networks can be fine-tuned for specific applications using a
    limited amount of training data (i.e., transfer learning). Examples of using these
    novel deep learning-based models in the crystallization community are few. Recently,
    Chen et al.^27 used a regional-CNN (R-CNN) to detect and characterize the length
    of needle-like L-glutamic acid crystals. Gao et al.^12 used a mask R-CNN for crystal
    object segmentation to monitor the formation of two different polymorphs, α- and
    β-forms, of L-glutamic acid. Mane et al.^16 also used a mask R-CNN approach with
    RetinaNet as the supporting network to characterize the crystal size distribution
    in NaCl–ethanol–water antisolvent crystallization. These studies use deep learning-based
    approaches and provide quantitative data about the progress of a crystallization
    process. However, they either still deal with dilute slurries with a low solid
    density and limited object overlap in the captured images or rely on external
    loops to generate analyzable images. Neural networks as regression models are
    also used for shape characterization of plate-like crystals based on dual-projection
    images^28 or to extract information about solution and solid-phase concentrations
    from Raman and IR spectra in different crystallization processes.^29,30


    In the present work, we develop a computer vision model, based on CNNs, that can
    be combined with high-throughput *in situ* imaging using a PVM probe for live
    monitoring of crystallization processes. The focus is on a system where *in situ*
    images contain highly overlapped objects and traditional approaches proved inadequate.
    The goal is specifically to develop a tool for automated process monitoring that
    can (1) examine *in situ* images taken using a PVM probe to monitor the state
    of the slurry, (2) detect and communicate the potential presence of undesired
    crystals in the slurry, and (3) estimate the location of the undesired object
    for the operator for further inspection and taking proper control action. Particularly,
    we focus on the application of such a tool in continuous pharmaceutical manufacturing
    processes where'
