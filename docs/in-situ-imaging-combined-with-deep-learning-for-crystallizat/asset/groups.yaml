    (b)。


    ![](img/548193ad63966e98f89fe201ab5832bb_4_2.png)


    图7. 将图像分析模型（使用ResNet-18）应用于从添加了pH法PG晶体的晶体浆料中获取的一系列原位图像的结果。黄色实线框对应于根据0.9的分类阈值判定为含有PG颗粒的区域。虚线框则是根据0.8的分类阈值额外标注的区域。


    在典型结晶过程的时间尺度（数百秒）上，ResNet-50较长的响应时间实际上并不限制其应用，仍然能够采取与控制相关的行动。此系统中合适的控制动作可以是调节进入容器内的酰基供体（PGME）的流速，以降低PG浓度并溶解其晶体。在其他结晶系统中，操作可能是温度循环或pH循环以溶解不需要的颗粒。


    在训练好用于对各系统（pH摆动法或酶法生成的PG）两种晶体类型进行分类的主干CNN后，我们通过在一组新图像上调用图像分析模型来评估其性能。这些图像是在单独实验中获取的，并未用于CNN的训练过程（既未用作训练数据、验证数据，也未被用作测试数据）。此外，请注意，CNN是使用各类别的原位图像的相关裁剪区域（而非整张原始图像）进行训练的。如前所述，我们采用类似滑动窗口的方法，通过将图像的不同区域传递给CNN进行分析。在“坏”类别中获得高分的区域（即很可能包含PG晶体的区域）会被标记并报告。与现代计算机视觉中其他较新的方法（如EdgeBox35或选择性搜索34）相比，使用滑动窗口方法研究图像实际上不太常见。然而，在我们的案例中，目标是构建一个用于识别具有已知特征晶体的工具。例如，在酶法生成PG的过程中，通过初步实验即可知道不需要的PG颗粒的典型尺寸和形状。图7和图8展示了基于ResNet-18的图像分析模型应用于来自各系统的一系列示例图像的结果，其中使用了两种不同的分类截止值。在每张图像中，模型都能成功地识别出对应于具有PG特征的颗粒的区域。基于ResNet-50的模型的结果非常相似，并在支持信息中的图S.3和图S.4中给出。


    ![](img/548193ad63966e98f89fe201ab5832bb_5_0.png)


    图8. 将图像分析模型（使用ResNet-18）应用于从含有酶法生成的PG颗粒的晶体浆料中获取的一系列原位图像的结果。黄色实线框对应于根据0.9的分类阈值判定为含有PG颗粒的区域。虚线框则是根据0.8的分类阈值额外标注的区域。


    除了训练参数、分类阈值以及为提高原位图像质量可能采取的预处理步骤外，该模型中另一个重要的超参数是滑动窗口的大小。滑动窗口的大小应结合所研究的系统和特定晶体的特征来选择。例如，对于通过pH摆动法生成的PG晶体（图3），晶体比酶法生成的晶体相对更大。因此，该系统的滑动窗口网格选择得较大，具有更大的候选框（100–125
    μm，而酶法体系为60–70 μm）。选择滑动窗口大小范围的一个好的经验法则是使用训练数据准备期间绘制的边界框的平均大小。其他方法（如构建图像金字塔来检测不同尺度的物体实例）在计算机视觉中很常见。但考虑到在我们的案例中晶体特征已知，我们将分析限制在每张图像的原始尺度上。


    在某些情况下（例如图7中的面板c），会报告几个重叠或相邻的区域，这是滑动窗口网格和用于NMS的重叠阈值的结果。滑动窗口大小和NMS中使用的阈值是可针对特定情况调整的超参数，以减少重叠区域的数量；尽管如此，定位PG颗粒的主要目标已经实现。另一个观察结果是，根据所使用的分类阈值，某些区域可能会或可能不会被标记。图7和图8中的分类阈值指的是“坏”类别的得分阈值，高于该阈值模型会标记相应区域。分类阈值的选择可以是0.5–1范围内的任何数字（低于0.5则归属为另一类别），它直接影响假阳性和假阴性率。例如，在图7的面板b中，使用0.8的值会在图像中央导致一个假阳性。另一方面，使用0.9的值会在面板f中导致一个假阴性。这个阈值是模型中的一个重要超参数，应根据当前具体过程和可接受的风险程度来选择。


    为了进一步测试图像分析模型的准确性和检测极限，我们进行了逐步增加PG晶体数量的实验。除了检测极限，通过在以高度受控的方式将PG晶体添加到标准CEX浆料中的实验，还获得了对模型性能、图像采集和浆料行为的深入了解。使用了足够大的晶体（75–225
    μm），以便每次添加等分试样时都能加入可预测数量的晶体。正如预期的那样，在实验过程中，被标记为含有PG的图像数量随着PG固体浓度的增加而增加。最终，容器中的PG晶体数量足够多，以至于几乎每张图像都能检测到它们。该实验的示意图如图9所示。


    ![](img/548193ad63966e98f89fe201ab5832bb_5_1.png)


    图9. 实验示意图，其中以高度受控的方式将PG晶体（紫色，低长径比）添加到CEX（绿色，高长径比）浆料中，以评估使用图像分析模型检测它们的频率。


    如图所示，容器中存在两种类型的晶体（CEX和PG）。根据PG晶体的数密度和探针可观察到的溶液体积，通过探针窗口可能检测到零到几十个PG晶体。图10显示了图像分析模型在CEX浆料中检测到至少一个PG晶体的帧的百分比，作为PG晶体质量的函数。在每个PG固体浓度下，该百分比基于分析100帧计算得出，从这100帧中随机抽样50帧共30次以计算标准误差。通过分析从浆料中捕获的图像，模型能够识别PG晶体质量的增加，并更频繁地检测到它们的存在（标记相应图像）。然而，正如之前在图7中所见，模型也会报告假阳性，即纯CEX浆料的图像被标记为含有PG，尤其是在使用较低分类阈值时（在这种情况下，对于分类阈值
    S* = 0.8，约有5%的图像被错误标记，对于 S* = 0.9，则为0–1%）。


    PG晶体的数量 N_PG 可以根据添加的质量和它们的平均尺寸进行估算（参见支持信息）。PVM探针可见的溶液体积 V_samplingbox 估算为探针窗口面积乘以焦距范围（~1000
    × 1000 × 100 μm³）。完全失焦的晶体无法高精度地进行分析，也不会从分类网络中获得高分。因此，捕获的帧中至少包含一个PG颗粒的概率等于1减去不包含任何PG颗粒的概率（等式2的推导见支持信息）。


    ![](img/548193ad63966e98f89fe201ab5832bb_6_0.png)


    图10. 在每个PG晶体浓度下，通过分析100帧获得的模型检测到至少一个PG晶体的图像百分比。每个点的误差线通过子采样50个随机帧进行分析（30次）并计算标准差得出。顶部x轴对应于估计的PG晶体数量
    [1000/mL]。略微向右偏移的条形对应于较高的分类阈值。


    图11显示了使用等式2预测的、帧中PG晶体检测概率作为其在浆料中质量函数（针对不同平均尺寸）的模拟结果。模拟假设一个理想观察者，在图像分析步骤中不会漏掉任何PG颗粒。图10的实验数据（三角形标记）用于比较。最顶部的曲线对应于最小的平均尺寸。


    P(N_PG) = 1 - (1 - V_samplingbox / V_vessel)^{N_PG} (2)


    ![](img/548193ad63966e98f89fe201ab5832bb_6_1.png)


    图11. 使用等式2预测的、含有至少一个PG晶体的帧的百分比作为其在浆料中质量（针对各种平均尺寸）的函数。模拟假设一个理想观察者，在图像分析步骤中不会漏掉任何PG颗粒。图10的实验数据（三角形标记）用于比较。最顶部的曲线对应于最小的平均尺寸。


    模拟结果证实，在所描述的系统中，PG的观测结果应符合指数饱和曲线（类似于图10）。但是，理论计算与实验点之间的表观相似性不应被视作图像分析模型完美的标志。在使用该模型对每帧进行分析时，可能存在计算机未检测到的PG晶体，或者存在一些假阳性情况。这些模拟的重要性在于它们证实了实验曲线的整体形状。图11还强调了在类似图10所示的实验中，需要使用预先制备的且平均尺寸相对较大的PG晶体的必要性。


    也可以训练一个用于细化所报告的边界框坐标的第二个回归神经网络，例如类似于Fast R-CNN中的做法。然而，采用这种方法需要对本文所述算法的前面部分进行调整，并且不能提供关于苯基甘氨酸是否已在容器中成核的重要信息。


