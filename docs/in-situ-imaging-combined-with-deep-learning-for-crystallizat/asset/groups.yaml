    slurry. Using the 0.8 mg/mL data set in Figure 12a as an example, if 30% of frames
    contain PG, then there is a 60% chance the system contains at least 0.8 mg/mL
    PG but a negligible chance the system contains >1.5 mg/mL PG. Similarly, if 50%
    of frames contain PG, there is a ~0% chance the slurry contains >3.8 mg/mL PG
    but almost 100% chance the slurry contains >0.8 mg/mL PG. These probabilities
    could help inform a controller (human or automated) what action to take to ensure
    slurry purity. As mentioned, as the number of sampled and analyzed images increases,
    the distribution narrows and the confidence of the PG concentration measurement
    increases. Alternatively, the data in Figure 12 can be analyzed from the viewpoint
    of detection time. In some applications, it might be required to detect the presence
    of the undesired particle, in this case, PG, in the shortest time possible. Note
    that detecting even a single PG particle is sufficient for this purpose. The detection
    time depends on the time it takes to analyze each frame and the amount of the
    impurity. Figure 12b shows the probability of detecting the PG particles’ presence
    in the system as a function of time observing the slurry, at three different PG
    solid concentrations. Observation time corresponds to the time that is required
    to capture images and analyzing them. At the low solid density, 0.8 mg/mL, a short
    observation time (e.g., only one frame taken and processed) might not lead to
    detecting the PG presence, and the slurry needs to be observed for a longer time
    using the model. It is only after 60 s that it is certain that the model can detect
    the PG presence. Naturally, this time significantly shortens at higher PG concentration.
    In all cases, a probability value of 1 means the model has detected the PG presence
    by flagging at least one of the images captured and analyzed during that time
    period. As mentioned, this analysis directly depends on the number of undesired
    particles in the system. For cases with a small mean size, even a small mass leads
    to immediate detection of the presence of PG by analyzing only a few frames. A
    similar mathematical model to that of Figure 11 can be built to relate the PG
    detection to observation time for the case of an ideal observer. As a final note,
    during a crystallization process, undesired crystals (be a byproduct as in the
    case of PG in CEX crystallization or an undesired polymorph as in the case of,
    e.g., piroxicam crystallization¹) may form if the process deviates from its appropriate
    setpoint and trajectory. Detecting this


    deviation as soon as possible is important, so proper control actions (such as
    adjustment of pumps or a temperature cycle) can be taken. Unfortunately, in the
    early stages of nucleation and growth, particle sizes are likely to be relatively
    small. Microscope resolution therefore puts a limit on the applicability of the
    image analysis for process monitoring. Clearly, using direct imaging as a robust
    PAT for process fault detection requires sufficiently large crystals such that
    they can be visually detected. In some specific cases, nucleation and growth of
    the undesired particles may lead to some changes in the slurry, such as a sudden
    change in solution turbidity, but whether that can be used as a robust monitoring
    tool is probably highly case-dependent.


    # 4. CONCLUSIONS


    An image analysis model, based on deep learning and CNNs, was developed for the
    classification of complex in situ images from a CEX crystal slurry. Provided sufficient
    training data, the model can detect the presence of an undesired crystal (e.g.,
    a byproduct, which in this case was phenylglycine, or an undesired polymorph)
    in the slurry by processing different regions of the raw in situ microscope images.
    The two networks used as the classification backbone, ResNet-18 and ResNet-50,
    showed high classification accuracy and were capable of distinguishing between
    different crystal types. However, considering the very distinct visual features
    of CEX and PG, other well-known deep, or even shallow, CNNs may also be capable
    of performing the classification task. The proposed approach can be extended to
    other crystallization systems where the detection of undesired crystals is critical
    to producing an acceptable product. Typical challenges of computer vision, such
    as overlapping objects which is found in high suspension density slurries, can
    complicate this task. Note that the analysis of neat images from a processed slurry
    (such as dilution) in a highly controlled setup remains the best and most robust
    method for observing and measuring crystals in a process. However, the approach
    proposed here enables the use of PVM probes and in situ imaging as a practical
    and direct approach to monitoring a crystal slurry in a large-scale process in
    real-time. Finally, it is worth emphasizing that in this work, the classifier
    network was trained to identify undesired crystals with known characteristics;
    however, a somewhat similar approach may be applied in'
