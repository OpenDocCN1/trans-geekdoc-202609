  mdcn: "\n采用了利用流体动力聚焦、背光照明和稀释来获得聚焦清晰、界限分明且不重叠的晶体图像的方法。<sup>16,18,19</sup> 图像质量有时是以不能准确代表晶体群体为代价获得的：样品环路中的条件（例如温度）可能与结晶器中的条件不匹配，通量可能较低，且充分混合的等速取样可能是一个不好的假设。除了在结晶容器内部或与其平行的外部环路中放置高分辨率相机的实际问题外，与捕获图像分析相关的各种挑战也可能阻碍从中获得可用信息。计算机视觉中的一些常见挑战是照明、旋转和变形、重叠或遮挡、背景杂乱以及类间差异，<sup>20</sup>\
    \ 其中许多在结晶中很常见，尤其是在捕获的*原位*图像中。\n\n使用成像来监测结晶过程需要（1）提供颗粒形状和纹理信息的优质图像，以及（2）稳健的图像分析，通过将图像转化为定性或定量数据来从每张图像中提取有用信息以供后续决策。第一点得益于过程分析技术\
    \ PAT 发展的最新进展。文献中用于结晶过程*原位*成像的不同商用或定制仪器有 EasyViewer、Blaze 和 EZprobe。<sup>11,12,21</sup>\
    \ 例如，本研究中使用的 Mettler-Toledo 颗粒观察与测量（PVM）探头 EasyViewer 100 能够以每秒一张图像的频率捕获高分辨率图像（1500×1500\
    \ 像素）。结晶学界也有大量研究使用各种图像分析方法来分析浆料图像。然而，其中大多数基于传统方法。这些方法通常首先进行一系列图像修改和增强步骤，并使用边缘检测算法，例如\
    \ Sobel 算子，来检测和表征图像中的单个物体。<sup>22–24</sup> 这种方法的主要问题是具有显著颗粒重叠的浓浆料（或密集图像）无法解析为单个物体。这部分也是为什么文献中的许多报道使用外部环路和流动池或离线成像来从晶体浆料中获取可分析图像的原因。图\
    \ 1 提供了一个示例，突出了*原位*图像与从稀释样品捕获的离线图像之间的复杂性。\n\n![](img/548193ad63966e98f89fe201ab5832bb_1_0.png)\n\
    \n**图 1.** 离线显微镜（a）与头孢氨苄一水合物（CEX）浆料的*原位*图像（b）之间的比较。*原位*图像突出了许多典型的图像分析挑战，例如高度重叠的物体。晶体颗粒的针状形状和高数量密度进一步使*原位*图像的分析复杂化。\n\
    \n传统方法的另一个问题是，所开发的算法通常有几个超参数，可能显著影响图像分析结果。当目标是量化晶体尺寸分布时尤其存在问题，因为晶体尺寸分布可能受超参数选择的影响（一个简单的例子是膨胀和腐蚀操作对颗粒估计尺寸的影响）。\n\
    \n现代计算机视觉主要基于数据驱动模型和以卷积神经网络（CNN）形式实现的深度学习。<sup>25,26</sup> 简而言之，在典型的基于深度学习的图像分析方法中，一系列滤波器（卷积层）被应用于输入图像（可能在某些图像修改或增强步骤之后），结果是一系列特征图，突出输入图像的某些特征。然后这些特征图可以被全连接层用于不同的目的，例如分类。最后，每个滤波器和其他层的参数在训练步骤中进行优化以实现最佳性能。自然地，与其他基于深度学习的模型类似，训练这些网络需要大量的数据，尤其是对于可能拥有数百万参数的更深网络而言。<sup>26</sup>\
    \ 现代*原位*成像探头每小时可捕获数千张过程时间图像，提供可用于训练这些网络的海量数据。有几种众所周知的 CNN 架构在标准图像数据集上预训练，能够提取不同的低级和高级别图像特征。这些预训练网络可以使用少量训练数据进行微调以用于特定应用（即迁移学习）。在结晶学界使用这些新型基于深度学习的模型进行应用的例子很少。最近，Chen\
    \ 等人<sup>27</sup> 使用区域 CNN（R-CNN）检测并表征针状 L-谷氨酸晶体的长度。Gao 等人<sup>12</sup> 使用 Mask\
    \ R-CNN 进行晶体物体分割，以监测 L-谷氨酸两种不同多晶型物 α- 和 β- 形式的形成。Mane 等人<sup>16</sup> 也使用以 RetinaNet\
    \ 为支持网络的 Mask R-CNN 方法来表征 NaCl–乙醇–水抗溶剂结晶中的晶体尺寸分布。这些研究使用基于深度学习的方法并提供关于结晶过程进展的定量数据。然而，它们要么仍然处理固体密度低且捕获图像中物体重叠有限的稀释浆料，要么依赖外部环路生成可分析图像。神经网络作为回归模型也被用于基于双投影图像的板状晶体形状表征<sup>28</sup>\
    \ 或从不同结晶过程中的拉曼和红外光谱中提取溶液和固相浓度信息。<sup>29,30</sup>\n\n在本工作中，我们开发了一种基于 CNN 的计算机视觉模型，可与使用\
    \ PVM 探头的高速*原位*成像相结合，用于结晶过程的实时监测。重点是一个*原位*图像包含高度重叠物体且传统方法证明不足够的系统。目标是专门开发一种用于自动化过程监测的工具，该工具可以（1）检查使用\
    \ PVM 探头拍摄的*原位*图像以监测浆料状态，（2）检测并传达浆料中可能存在不需要晶体的情况，（3）估计不需要物体的位置以供操作员进一步检查并采取适当的控制措施。特别是，我们关注在连续制药制造工艺中应用此类工具，在这些工艺中，浆料的稳健监测对于生产符合设定质量属性标准的纯净高质量产品至关重要。我们以头孢氨苄（CEX，一种\
    \ β-内酰胺抗生素，年产量 >5,000 吨/年<sup>31</sup>）的生产为例，其中反应副产物可能在偏离过程设定点时结晶并污染产品。<sup>32</sup>\n\
    \n## 2. 材料与方法\n\n### 结晶实验\n\n头孢氨苄生产的工业工艺通常使用活化的酰基供体如苯甘氨酸甲酯（PGME）与 β-内酰胺核 7-氨基去乙酰氧基头孢烷酸（7-ADCA）之间的酶促反应。<sup>31,32</sup>\
    \ 该工艺中使用的生物催化剂通常是青霉素 G 酰化酶（PGA），它催化产生头孢氨苄的主要反应以及式 1 中所示的两个水解副反应。在反应结晶过程中，条件设定为使头孢氨苄在反应器中结晶以产生\
    \ CEX 晶体，从而保护头孢氨苄免受生物催化水解。<sup>32</sup> 然而，副产物苯甘氨酸（PG）在水中的溶解度很低（~30–35 mM，25 °C，pH\
    \ = 5.5–7.5<sup>33</sup>），如果生成过量可能会结晶并污染产品。\n\n```\nPGME + 7-ADCA\n  → MeOH +\
    \ CEX\n  → CEX·H₂O (crystal)\n\nPGME + H2O → MeOH + PG → PG (crystal)\n\nCEX +\
    \ H2O → 7-ADCA + PG → PG (crystal)    (1)\n```\n\n为了生产 CEX 晶体，使用 pH 调节来产生所需的过饱和度（水中头孢氨苄溶解度随\
    \ pH 值变化见支持信息中的图 S1）。典型的结晶实验始于在 pH 7.5 的 200 mL 去离子水中溶解足够量的 CEX 固体（RIA，Hanover，NJ）以制备饱和溶液。饱和后，将所得溶液过滤以去除未溶解固体。然后将溶液转移至夹套结晶容器中，保持温度\
    \ 25 °C，并使用带四片 45° 叶片且底部间隙 1 cm 的不锈钢斜叶桨式搅拌器以 250 rpm 搅拌。通过加入 0.05 g 研磨的种子晶体并加入\
    \ 2 M HCl 使溶液酸化以产生过饱和度来开始结晶。使用 Mettler-Toledo SP-50  dosing 单元在 2–3 小时内将 pH 值从初始的\
    \ 7.5 降低至 5.5。pH 调节后浆料搅拌 3–5 小时，直至溶液浊度（使用 EasyViewer 探头测量）无显著变化。图 2 显示了典型的 CEX\
    \ 一水合物结晶实验过程中 pH 值和浊度的变化情况。\n\n![](img/548193ad63966e98f89fe201ab5832bb_2_0.png)\n\
    \n**图 2.** CEX 一水合物结晶实验过程中溶液 pH 值和浊度。左侧的*原位*图像显示初始接种溶液，右侧图像显示实验结束时的浆料。\n\nPG 晶体在两组实验中生产。在第一组中，使用上述相同的\
    \ pH 摆动方法结晶 PG；初始和最终 pH 值范围从初始 pH 9 到最终 pH 5（水中 PG 溶解度随 pH 值变化见支持信息中的图 S1）。晶体被过滤，在室温下干燥，然后过筛以去除大团聚体（颗粒\
    \ >300 μm）。在第二组中，PG 在模拟酶促合成的条件下形成。将 PGA 生物催化剂（购自 Centrient，荷兰）以约 2 μM 的浓度加入到 pH\
    \ = 7 时饱和于 PG 的 CEX 浆料中。然后给予溶液足够的时间让酶水解头孢氨苄并产生足够的 PG 过饱和度以使 PG 结晶发生（5–8 小时）。第一种方法（pH\
    \ 摆动）形成的 PG 颗粒平均尺寸较大，有助于更准确地量化溶液中的数量密度。第二种方法（酶促）形成的 PG 颗粒平均尺寸较小，但更准确地代表了头孢氨苄酶促合成过程中形成的副产物颗粒的形状和特征。图\
    \ 3 显示了含有每种类型 PG 颗粒（板状）与头孢氨苄（针状）的系统的*原位*图像和离线光学显微镜图像。\n\n![](img/548193ad63966e98f89fe201ab5832bb_2_1.png)\n\
    \n**图 3.** CEX 和 PG 晶体的光学显微镜和*原位*图像，突出了通过酶促（上）和 pH 摆动（下）方法制成的 PG 颗粒。PG 颗粒用虚线圆圈标出。\n\
    \n### 训练数据准备\n\n定义了两个图像类别，“Good” 类，即浆料中纯 CEX 晶体，和 “Bad” 类，即主要为 CEX 浆料中存在的 PG 晶体（由酶促或\
    \ pH 摆动方法制成）。对于每个系统，首先使用\n"
