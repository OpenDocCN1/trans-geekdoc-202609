    containing PG, especially when a lower classification threshold is used (in this
    case, about 5% of images are falsely flagged for classification threshold S* =
    0.8, and 0–1% for S* = 0.9).


    The number of PG crystals, N_PG, can be estimated from the added mass and their
    average size (see Supporting Information). The solution volume visible to the
    PVM probe, V_samplingbox is estimated as the area of the probe window multiplied
    by a focal range (~1000 × 1000 × 100 μm³). Completely out-of-focus crystals cannot
    be analyzed with high accuracy and will not receive high scores from the classification
    network. The probability of a captured frame containing at least one PG particle
    is then equal to 1 minus the probability of it containing none (derivation of
    eq 2 is presented in Supporting Information).


    ![](img/548193ad63966e98f89fe201ab5832bb_6_0.png)


    Figure 10. Percentage of images in which at least one PG crystal is detected using
    the model obtained by analyzing 100 frames at each PG crystal concentration. Error
    bars at each point are calculated by subsampling 50 random frames for analysis
    (30 times) and calculating the standard deviation. The top x-axis corresponds
    to the estimated number of PG crystals in [1000/mL]. Bars slightly shifted to
    the right correspond to the higher classification threshold.


    Figure 11 shows the simulation results for the probability of PG crystal detection
    in a frame as a function of their mass in the slurry for different mean sizes
    predicted using eq 2. Simulations assume an ideal observer where no PG particle
    is missed during the image analysis step. Experimental data of Figure 10 (triangle
    markers) are shown for comparison. The top curve corresponds to the smallest mean
    size.


    P(N_PG) = 1 - (1 - V_samplingbox / V_vessel)^{N_PG} (2)


    ![](img/548193ad63966e98f89fe201ab5832bb_6_1.png)


    Figure 11. Percentage of frames containing at least one PG crystal as a function
    of its mass in the slurry for various mean sizes predicted using eq 2. Simulations
    assume an ideal observer where no PG particle is missed during the image analysis
    step. Experimental data of Figure 10 (triangle markers) are shown for comparison.
    The top curve corresponds to the smallest mean size.


    Simulations confirm that the PG observations in the described system should mimic
    an exponential saturation curve (similar to Figure 10). However, the apparent
    similarity between the theoretical calculations and the experimental points should
    not be taken as a sign of a perfect image analysis model. In the analysis of each
    frame using the model, there might be PG crystals that are not detected by the
    computer, or there might be some false-positive cases. The significance of these
    simulations is that they confirm the overall shape of the experimental curve.
    Figure 11 also highlights the necessity of using premade PG crystals with relatively
    large mean size in the experiments such as that depicted in Figure 10.


    It is also possible to train a second regression neural network for refining the
    reported bounding box coordinates similar to, for example, that of the fast R-CNN.36
    However, taking that approach requires adjustments in previous parts of the algorithm
    presented here and does not add significant information as to whether or not phenylglycine
    has nucleated in the vessel.

