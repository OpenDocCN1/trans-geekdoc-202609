    \ in water as a function of pH is provided in Figure S1 in Supporting Information).\
    \ The crystals were filtered, dried at room temperature, and later sieved to remove\
    \ large agglomerates (particles >300 μm). In the second set, PG was formed under\
    \ conditions mimicking that of the enzymatic synthesis. The PGA biocatalyst (obtained\n\
