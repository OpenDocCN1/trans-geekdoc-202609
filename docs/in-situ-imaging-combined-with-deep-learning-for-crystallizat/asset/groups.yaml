    \ an enzymatic reaction between an activated acyl donor such as phenylglycine\
    \ methyl ester (PGME) and the beta-lactam nucleus 7-aminodesacetoxy-cephalosporanic\
    \ acid (7-ADCA).31,32 The biocatalyst used in this process is typically penicillin\
    \ G acylase (PGA), which catalyzes the primary reaction of producing cephalexin\
    \ as well as two hydrolysis side reactions shown in eq 1. In the reactive crystallization\
    \ process, conditions are set such that cephalexin is crystallized in the reactor\
    \ to produce CEX crystals, which protects the cephalexin from biocatalytic hydrolysis.32\
    \ However, the byproduct phenylglycine (PG) has a low solubility in water (~30–35\
    \ mM at 25 °C and pH = 5.5–7.533) and may crystallize and contaminate the product\
    \ if generated in excess.\n\n```\nPGME + 7-ADCA\n  → MeOH + CEX\n  → CEX·H₂O (crystal)\n\
    \nPGME + H₂O → MeOH + PG → PG (crystal)\n\nCEX + H₂O → 7-ADCA + PG → PG (crystal)\
    \    (1)\n```\n\nFor the production of CEX crystals, pH manipulations were used\
    \ to generate the required supersaturation (solubility of cephalexin in water\
    \ as a function of pH value is presented in Figure S1 in Supporting Information).\
    \ A typical crystallization experiment started with dissolving a sufficient amount\
    \ of CEX solids (RIA, Hanover, NJ) in 200 mL of deionized water at pH 7.5 to prepare\
    \ a saturated solution. After saturation, the resulting solution was filtered\
    \ to remove any undissolved solids. The solution was then transferred to a jacketed\
    \ crystallization vessel that maintained a temperature of 25 °C and was mixed\
    \ using a pitched blade stainless-steel impeller (with four 45° blades and 1 cm\
    \ off-bottom clearance) at 250 rpm. Crystallization was started by adding 0.05\
    \ g of ground seed crystals and adding 2 M HCl to acidify the solution and generate\
    \ supersaturation. The pH value was lowered from the initial 7.5–5.5 over a period\
    \ of 2–3 h using a Mettler-Toledo SP-50 dosing unit. The slurry was mixed for\
    \ 3–5 h after the pH manipulation and until no significant change in the solution\
    \ turbidity (measured using the EasyViewer probe) was detected. Figure 2 shows\
    \ the course of a typical CEX crystallization experiment where pH and turbidity\
    \ values are tracked.\n\nPG crystals were produced in two sets of experiments.\
    \ In the first, PG was crystallized using the same pH swing method described above;\
