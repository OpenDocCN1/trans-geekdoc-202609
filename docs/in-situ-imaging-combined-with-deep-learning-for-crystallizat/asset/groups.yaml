    \ and turbidity throughout a CEX monohydrate crystallization experiment. The in\
    \ situ image on the left shows the initial seeded solution, and the image on the\
    \ right shows the slurry at the end of the experiment.\n\nfrom Centrient, Netherlands)\
    \ at a concentration of about 2 μM was added to a CEX slurry saturated with PG\
    \ at pH = 7. The solution was then given sufficient time for the enzyme to hydrolyze\
    \ the cephalexin and produce sufficient PG supersaturation for PG crystallization\
    \ to occur (5–8 h). PG particles formed by the first method (pH swing) had a larger\
    \ mean size which helps to quantify their number density in a solution more accurately.\
    \ PG particles formed by the second method (enzymatically) had a smaller mean\
    \ size but more accurately represent the shape and characteristics of the byproduct\
    \ particles formed during the enzymatic synthesis of cephalexin. Figure 3 shows\
    \ the in situ image and offline optical microscope image of systems containing\
    \ each type of PG particles (plate-like) with cephalexin (needle-shaped).\n\n\
