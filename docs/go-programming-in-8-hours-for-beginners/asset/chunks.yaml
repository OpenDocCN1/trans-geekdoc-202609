  fmt: "\nFor example: `var ipoint *int` // declare an int pointer\n`var fpoint *float32`\
    \ // declare a float32 pointer\n`*ipoint` // gets the ipoint value in the memory\
    \ address .\n`*fpoint` // gets the fpoint value in the memory address .\n\n###\
    \ Example 6.6\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var num\
    \ int= 100\n    var pt *int // declare a pointer pt\n    pt = &num // &num get\
    \ address and assign to pt\n    fmt.Printf(\"The address of num: %x\\n\", &num)\n\
    \    fmt.Printf(\"The address in pt: %x\\n\", pt)\n    fmt.Printf(\"The value\
    \ of the *pt: %d\\n\", *pt)\n}\n```\nOutput:\n```\nThe address of num: C000044058\n\
    The address in pt: C000044058\nThe value of the *pt: 100\n```\nExplanation:\n\
    `&num` gets the memory address from `num`.\n`pt = &num` assigns the memory address\
    \ to `pt`.\n`*pt` returns the `pt` value in the memory address.\n\n### Example\
    \ 6.7\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var a string=\"\
    Hello\"\n    var b *string\n    var c string\n    b=&a //&a gets the memory address\n\
    \    c=*b //*b gets the value in memory address\n    fmt.Println(a)\n    fmt.Println(b)\n\
    \    fmt.Println(c)\n}\n```\nOutput:\n```\nHello\n0xc0000381c8\nHello\n```\nExplanation:\n\
    `&variablename` returns a memory address.\n`*variable` returns a value in the\
    \ memory address.\n\n### Nil Pointer\nWhen a pointer is defined and not assigned\
    \ to any variable address, its value is `nil`.\n\n### Example 6.8\n```go\npackage\
    \ main\nimport \"fmt\"\nfunc main() {\n    var npt *int\n    fmt.Printf(\"The\
    \ address stored in npt: %x\\n\", npt)\n}\n```\nOutput:\n```\nThe address stored\
    \ in npt: 0\n```\nExplanation: “`npt`” is a pointer, which has not yet been assigned\
    \ any address, so the value of `npt` is 0.\n\n### Summary\nAn array is a collection\
    \ of variables of the same type and name.\n- **Array element**: each variable\
    \ in an array.\n- **Array index**: also called as key, the numbers on each element.\n\
    - **Note**: the array index or array key starts from zero.\n- A pointer represents\
    \ the value of a memory address.\n- `&variable` // get the memory address of a\
    \ variable\n- `var variable_name *type` // declare a pointer\n- `*variable_name`\
    \ // get the variable value in the address\n- When a pointer is defined and not\
    \ assigned to any variable address, its value is `nil`.\n\n# Hour 7\n\n## Structures\n\
    A structure is a collection of data with the same or different types of data.\n\
    \n#### (1) Define Structure Type\n```go\ntype structure_name struct {\n    member1\
    \ type;\n    member2 type;\n    ...\n    member3 type;\n}\n```\n\n#### (2) Access\
    \ Structure Members\n```go\nstructure_name{member1: value1, member2: value2, …\
    \ }\n```\n\n### Example 7.1\n```go\npackage main\nimport \"fmt\"\ntype Flower\
    \ struct {\n    // define a structure type\n    color string // structure member\n\
    \    size string\n    number int\n}\nfunc main() {\n    fmt.Println(Flower{color:\"\
    Red\", size:\"Large\", number:10 })\n}\n```\nOutput:\n```\nRed\nLarge\n10\n```\n\
    Explanation: “`type Flower struct`” defines a structure type.\n\n#### (3) Declare\
    \ Structure Variables\n```go\nvar variable structure_name\n```\n\n#### (4) Assign\
    \ Values to Structure Members\n```go\nvariable.member = value\n```\n\n### Example\
    \ 7.2\n```go\npackage main\ntype Flower struct {\n    // define a structure type\n\
    \    color string // structure member\n    size string\n    number int\n}\nfunc\
    \ main() {\n    var Rose Flower // declare a structure variable\n    Rose.color\
    \ = \"Red\" // assign value to structure member\n    Rose.size = \"Large\"\n \
    \   Rose.number = 10\n    println(\"Rose color : \", Rose.color);\n    println(\"\
    Rose size : \", Rose.size);\n    println(\"Rose number : \", Rose.number);\n}\n\
    ```\nOutput:\n```\nRose color: Red\nRose size: Large\nRose number: 10\n```\nExplanation:\
    \ “`var Rose Flower`” declares a structure variable `Rose`. `Rose.color = \"Red\"\
    ` assigns value to structure member `Rose.color`.\n\n## Slice\nSlice is a special\
    \ array, but its length is changeable.\n\n#### (1) The first syntax to create\
    \ a Slice is as follows:\n```go\nslice_name := []type{val1, val2, … }\n```\n\n\
    ### Example 7.3\n```go\npackage main\nimport \"fmt\"\nfunc main(){{\n    s :=\
    \ []int{1,2,3,4,5} // create a slice\n    fmt.Println(s)\n}\n```\nOutput:\n```\n\
    1 2 3 4 5\n```\nExplanation: “`s := []int{1,2,3,4,5}`” creates a Slice with five\
    \ values.\n\n#### (2) The second syntax to create a Slice is as follows:\n```go\n\
    slice_name := make([]type, len, cap)\n```\n`len` means the length of the slice.\
    \ `cap` means the capacity to contain elements.\n\n### Example 7.4\n```go\npackage\
    \ main\nimport \"fmt\"\nfunc main() {\n    s := make([]int, 5, 8)\n    fmt.Printf(\"\
    len=%d cap=%d slice=%v\\n\", len(s), cap(s), s)\n}\n```\nOutput:\n```\nlen=5 cap=8\
    \ slice=[0 0 0 0 0]\n```\nExplanation: `len(s)` gets the length of the slice.\
    \ `cap(s)` gets the capacity. Because Slice elements have not been assigned any\
    \ values, the five values of this Slice are zero.\n\n#### (3) Get some value from\
    \ Slice elements:\n```go\nslice_name[key1:key2]\n```\nGet the value from `key1`\
    \ to `key2`.\n\n### Example 7.5\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n    var s = []int{0, 1, 2, 3, 4, 5, 6, 7}\n    mySlice := s[2:6] // get the\
    \ value from s[2] to s[5]\n    fmt.Println(mySlice)\n}\n```\nOutput:\n```\n[2\
    \ 3 4 5]\n```\nExplanation: “`s[2:6]`” gets the value from `s[2]` to `s[5]`.\n\
    \n#### (4) Assign value to Slice elements.\n```go\nslice_name[key] = value\n```\n\
    \n### Example 7.6\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var\
    \ s = []int{0, 1, 2, 3, 4, 5, 6, 7}\n    s[3] = 10 // assign a new value to s[3]\n\
    \    s[6] = 100 // assign a new value to s[6]\n    fmt.Println(s)\n}\n```\nOutput:\n\
    ```\n[0 1 2 10 4 5 100 7]\n```\nExplanation: `s[3] = 10` and `s[6] = 100` assign\
    \ new values.\n\n#### `append()` & `copy()`\n```go\nappend(slice_name, values)\
    \ // append values to a Slice\ncopy(new_slice, old_slice) // copy old Slice to\
    \ new Slice\n```\n\n### Example 7.7\n```go\npackage main\nimport \"fmt\"\nfunc\
    \ main() {\n    mySlice := make([]int, 0, 0)\n    showSlice(mySlice)\n    mySlice\
    \ = append(mySlice, 10, 20, 30) // append\n    showSlice(mySlice)\n    newSlice\
    \ := make([]int, len(mySlice), cap(mySlice)*2) // copy\n    copy(newSlice, mySlice)\n\
    \    showSlice(newSlice)\n}\nfunc showSlice(x []int){\n    fmt.Printf(\"len=%d\
    \ cap=%d slice=%v\\n\", len(x), cap(x), x)\n}\n```\nOutput:\n```\nlen=0 cap=0\
    \ slice=[]\nlen=3 cap=4 slice=[10 20 30]\nlen=3 cap=8 slice=[10 20 30]\n```\n\
    Explanation: `append(mySlice, 10, 20, 30)` appends three values to `mySlice`.\
    \ `cap(mySlice)*2` makes the capacity double. `copy(newSlice, mySlice)` copies\
    \ the contents of `mySlice` to `newSlice`.\n\n### Summary\nA structure is a collection\
    \ of data with the same or different types of data.\n- **(1) Define Structure\
    \ Type**:\n```go\ntype structure_name struct {\n    member1 type;\n    member2\
    \ type;\n    ...\n    member3 type;\n}\n```\n- **(2) Access Structure Members**:\
    \ `structure_name{member1: value1, member2: value2, …}`\n- **(3) Declare Structure\
    \ Variables**: `var variable structure_name`\n- **(4) Assign Values to Structure\
    \ Members**: `variable.member = value`\n- Slice is a special array, but its length\
    \ is changeable.\n- `append(slice_name, values)` // append values to a Slice\n\
    - `copy(new_slice, old_slice)` // copy old Slice to new Slice\n\n# Hour 8\n\n\
    ## GOROUTINE\n“goroutine” is used to run multiple tasks simultaneously, which\
    \ means that goroutine function can execute multiple threads at the same time\
    \ by using `go` keyword. The following example is to define a goroutine function,\
    \ and run the goroutine function.\n\n```go\ngo func(arguments) {\n    // define\
    \ a goroutine function\n} (arguments) // run the goroutine function\n```\n\n###\
    \ Example 8.1\n```go\npackage main\nimport \"fmt\"\nfunc fn(s string) {\n    //\
    \ define a function for\n    for i := 0; i < 5; i++ {\n        fmt.Println(s)\n\
    \    }\n}\nfunc main() {\n    fn(\"Thread B\") // call the function\n    go func(msg\
    \ string) {\n        // define a goroutine function\n        fmt.Println(msg)\n\
    \    } (\"Press Enter to Stop! \") // run the goroutine function\n    fmt.Scanln()\
    \ // accept user input from keyboard\n    fmt.Println(\"Complete! \")\n}\n```\n\
    Output:\n```\nThread B\nThread B\nThread B\nThread B\nThread B\nPress Enter to\
    \ Stop!\nComplete!\n```\nExplanation: `go func(msg string) {…}` defines a goroutine\
    \ function. `(\"Press Enter to Stop! \")` runs the goroutine function, and pass\
    \ the parameter to the gorountine function.\n"
  trans: "\n例如：`var ipoint *int` // 声明一个 int 指针\n`var fpoint *float32` // 声明一个 float32\
