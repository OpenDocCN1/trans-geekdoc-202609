  trans: "\n\n# 安装 Go\n\n本书以 Windows 操作系统作为安装 Go 的示例。下载链接:[`golang.org/dl/`](https://golang.org/dl/)\n\
    \n1. 点击链接，进入下载页面。![](img/rsrc2U8.jpg)\n2. 点击 `go1.11.2 windows-amd64.msi`，将 Go\
    \ 安装程序下载到本地计算机。\n3. 点击 Go 安装程序，开始安装……![](img/rsrc2U9.jpg)\n4. 点击 `Next`……。默认情况下，Msi\
    \ 文件将安装在 `c:\\Go` 目录下。\n5. 安装完成后，请点击 `Finish`![](img/rsrc2UA.jpg)\n\n## 环境变量\n\
    \n安装 Go 之后，你需要将 `c:\\Go\\bin` 添加到环境变量的 `PATH` 中。请配置环境变量。前往“控制面板” > “系统” > “高级系统设置”\
    \ > “高级” > “环境变量” > `Path` > “编辑” > “新建”。将 `C:\\Go\\bin` 添加到 `Path` 的末尾![](img/rsrc2UB.jpg)\n\
    \n注意：不同 Windows 操作系统的设置界面有所不同。请重启计算机使设置生效。\n\n## Go 的第一个程序\n\n请在 `C:\\` 下创建一个工作文件夹\
    \ `myGo`，打开记事本编辑器，并将以下代码写入编辑器。示例 1.1\n\n```go\npackage main\nimport \"fmt\"\n\
    func main() { \n    fmt.Println(\"Hello, World! \") \n}\n```\n\n将文件保存为 `hello.go`\
    \ 并存放在 `C:\\myGo` 中。使用 `cmd` 打开命令行，输入以下命令：![](img/rsrc2UC.jpg)\n\n输出: Hello World!\n\
    \n**解释：**\n- `package main` 定义包名为 `main`。每个 Go 应用程序必须包含一个名为 `main` 的包。\n- 导入的包\
    \ `fmt` 包含 I/O 函数。\n- `func main()` 是 Go 应用程序执行的第一个函数。\n- `fmt.Println(\"Hello,\
    \ World! \")` 输出文本 `Hello, World! `。\n- `C:\\Windows\\system32>cd\\` 返回 `C:` 根目录。\n\
    - `C:\\cd myGo` 进入 `myGo` 文件夹。\n- `go run` 是执行 Go 程序的命令。\n\n### 注释\n\n- `//` 是单行注释的符号。\n\
    - `/*` 和 `*/` 是多行注释的符号。\n- 注释不会被编译。Go 编译器将忽略所有注释。示例 1.2\n\n```go\npackage main\
    \  // 包声明\nimport \"fmt\" \nfunc main() {\n    // 定义 main 函数\n    fmt.Println(\"\
    Hello, World! \") \n} \n/* 上述代码的输出是: Hello, World! */\n```\n\n请使用 `go run` 命令运行此程序并检查结果。\n\
    \n## 标识符\n\n标识符用于命名变量、函数、表达式等。标识符由一个或多个字母（A~Z 和 a~z）、数字（0~9）和下划线组成，但第一个字符必须是字母或下划线。标识符的首字符不能是数字。\n\
    \n**有效的标识符：**\n- `myVariable`\n- `_Variable`\n- `variable100`\n\n**无效的标识符：**\n\
    - `continue` (`continue` 是 Go 语言的关键字)\n- `100Variable` (以数字开头)\n\n## 总结\n\n- `package\
    \ main` 定义包名为 `main`。每个 Go 应用程序必须包含一个名为 `main` 的包。\n- 导入的包 `fmt` 包含 I/O 函数。\n\
    - `func main()` 是 Go 应用程序执行的第一个函数。\n- `fmt.Println(\"Hello, World! \")` 输出文本 `Hello,\
    \ World! `。\n- `//` 是单行注释的符号。\n- `/*` 和 `*/` 是多行注释的符号。注释不会被编译。Go 编译器将忽略所有注释。\n\
    - 标识符用于命名变量、函数、表达式等。标识符由一个或多个字母（A~Z 和 a~z）、数字（0~9）和下划线组成，但第一个字符必须是字母或下划线。标识符的首字符不能是数字。\n\
    \n## 第二小时\n\n### 行分隔符\n\n在 Go 语言中，每个语句不需要用分号来结束行。例如：\n\n```go\nfmt.Println(\"\
    Hi, My friend! \")\nfmt.Println(\"Hi, Guy! \")\n```\n\n上述代码中有两行，每一行代表一个语句的结束，每个语句不需要分号来结束行。\n\
    \n关于以下内容：\n```go\nfmt.Println(\"Hi, My friend! \")\nfmt.Println(\"Hi, Guy! \"\
    )\n```\n以下代码会在运行时产生错误：\n```go\nfunc main() {\n```\n\nGo 语言中有 25 个关键字：`break`,\
    \ `case`, `default`, `chan`, `const`, `continue`, `decl`, `else`, `for`, `func`,\
    \ `go`, `import`, `interface`, `map`, `package`, `select`, `struct`, `switch`,\
    \ `type`, `var`, `range`, `return`, `fallthrough`, `goto`。\n\n### 数据类型\n\n在 Go\
    \ 中，我们定义变量。四种数据：\n\n1. **布尔型：** `bool`\n2. **数值型：** `int`, `int8`, `int16`, `int32`,\
    \ `int64`, `uint`, `uint8`, `uint16`, `uint32`, `uint64`, `float32`, `float64`,\
    \ `complex64`, `complex128`。\n3. **字符串型：** `string`\n4. **派生类型：** `array`, `slice`,\
    \ `map`, `struct`, `interface`, `pointer`。\n\n### 变量声明\n\n有三种声明变量的方法：\n\n1. `var\
    \ name type value`\n2. `var name = value`\n3. `name := value`\n\n示例：\n```go\n\
    var a int = 100\nvar b = 200\nc := 300\n```\n\n示例 2.1\n```go\npackage main\nimport\
    \ \"fmt\"\nfunc main() {\n    var a = \"C# in 8 Hours\"\n    var b = \"is a book!\"\
    \n    var c = true\n    fmt.Println(a, b, c)\n}\n```\n输出: C# in 8 Hours is a book!\
    \ true\n\n示例 2.2\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var\
    \ a, b, c int = 100, 200, 300\n    var d, e, f = 400, 500, 600\n    s1, s2, s3\
    \ := \"R in 8 Hours\", \"is\", \"good book.\"\n    fmt.Println(a, b, c)\n    fmt.Println(d,\
    \ e, f)\n    fmt.Println(s1, s2, s3)\n}\n```\n输出：\n100 200 300\n400 500 600\n\
    R in 8 Hours is a good book.\n\n"
