    \ npt: %x\\n\", npt)\n}\n```\n输出:\n```\nThe address stored in npt: 0\n```\n解释：“`npt`”是一个指针，尚未被分配任何地址，因此\
    \ `npt` 的值为 0。\n\n### 总结\n数组是相同类型和同名变量的集合。\n- **数组元素**：数组中的每个变量。\n- **数组索引**：也称为键（key），每个元素上的数字。\n\
    - **注意**：数组索引或数组键从零开始计数。\n- 指针代表内存地址的值。\n- `&variable` // 获取变量的内存地址\n- `var variable_name\
    \ *type` // 声明一个指针\n- `*variable_name` // 获取地址中的变量值\n- 当指针被定义但没有赋值给任何变量地址时，它的值为\
    \ `nil`。\n\n# 第 7 小\n\n## 结构体 (Structures)\n结构体是相同或不同类型数据的集合。\n\n#### (1) 定义结构体类型\n\
    ```go\ntype structure_name struct {\n    member1 type;\n    member2 type;\n  \
    \  ...\n    member3 type;\n}\n```\n\n#### (2) 访问结构体成员\n```go\nstructure_name{member1:\
    \ value1, member2: value2, … }\n```\n\n### 示例 7.1\n```go\npackage main\nimport\
    \ \"fmt\"\ntype Flower struct {\n    // 定义一个结构体类型\n    color string // 结构体成员\n\
    \    size string\n    number int\n}\nfunc main() {\n    fmt.Println(Flower{color:\"\
    Red\", size:\"Large\", number:10 })\n}\n```\n输出:\n```\nRed\nLarge\n10\n```\n解释：“`type\
    \ Flower struct`”定义了一个结构体类型。\n\n#### (3) 声明结构体变量\n```go\nvar variable structure_name\n\
    ```\n\n#### (4) 给结构体成员赋值\n```go\nvariable.member = value\n```\n\n### 示例 7.2\n\
    ```go\npackage main\ntype Flower struct {\n    // 定义一个结构体类型\n    color string\
    \ // 结构体成员\n    size string\n    number int\n}\nfunc main() {\n    var Rose Flower\
    \ // 声明一个结构体变量\n    Rose.color = \"Red\" // 给结构体成员赋值\n    Rose.size = \"Large\"\
    \n    Rose.number = 10\n    println(\"Rose color : \", Rose.color);\n    println(\"\
    Rose size : \", Rose.size);\n    println(\"Rose number : \", Rose.number);\n}\n\
    ```\n输出:\n```\nRose color: Red\nRose size: Large\nRose number: 10\n```\n解释：“`var\
    \ Rose Flower`”声明了一个结构体变量 `Rose`。`Rose.color = \"Red\"` 给结构体成员 `Rose.color` 赋值。\n\
    \n#### 切片 (Slice)\n切片是一种特殊的数组，它的长度是可变的。\n\n#### (1) 创建切片的种语法：\n```go\nslice_name\
    \ := []type{val1, val2, …\n```\n\n### 示例 7.3\n```go\npackage main\nimport \"fmt\"\
    \nfunc main(){\n    s := []int{1,2,3,4,5} // 创建切片\n    fmt.Println(s)\n}\n```\n\
    输出:\n```\n1 2 3 4 5\n```\n解释：“`s := []int{1,2,3,4,5}`”创建了一个包含五个值的切片。\n\n#### (2)\
    \ 创建切片的第二种语法：\n```go\nslice_name := make([]type, len, cap)\n```\n`len` 表示切片的长度，`cap`\
    \ 表示容量。\n\n### 示例 7.4\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  \
    \  s := make([]int, 5, 8)\n    fmt.Printf(\"len=%d cap=%d\\n\", len(s), cap(s))\n\
    }\n```\n输出:\n```\nlen=5 cap=8\n```\n解释：`len(s)` 获取切片的长度。`cap(s)` 获取容量。由于切片元素尚未赋值，该切片的值为零。\n\
    \n#### (3) 从切片中获取某些值：\n```go\nslice_name[key1:key2]\n```\n获取从 `key1` 到 `key2`\
    \ 的值。\n\n### 示例 7.5\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var\
    \ s = []int{0, 1, 2, 3, 4, 5, 6, 7}\n    mySlice := s[2:6] // 从 s[2] 到 s[5] 获取值\n\
    \    fmt.Println(mySlice)\n}\n```\n输出:\n```\n2 3 4 5\n```\n解释：“`s[2:6]`”获取从 `s[2]`\
    \ 到 `s[5]` 的值。\n\n#### (4) 给切片元素赋值。\n```go\nslice_name[key] = value\n```\n\n###\
    \ 示例 7.6\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var s = []int{0,\
    \ 1, 2, 3, 4, 5, 6, 7}\n    s[3] = 10 // 给 s[3] 赋值新值\n    s[6] = 100 // 给 s[6]\
    \ 赋值新值\n    fmt.Println(s)\n}\n```\n输出:\n```\n0 1 2 10 4 5 100 7\n```\n解释：`s[3]\
    \ = 10` 和 `s[6] = 100` 赋值了新值。\n\n#### `append()` & `copy()`\n```go\nappend(slice_name,\
    \ values) // 向切片追加值\ncopy(new_slice, old_slice) // 将旧切片拷贝到新切片\n```\n\n### 示例 7.7\n\
    ```go\npackage main\nimport \"fmt\"\nfunc main() {\n    mySlice := make([]int,\
    \ 0, 0)\n    showSlice(mySlice)\n    mySlice = append(mySlice, 10, 20, 30) //\
    \ append\n    showSlice(mySlice)\n    newSlice := make([]int, len(mySlice), cap(mySlice)*2)\
    \ // copy\n    copy(newSlice, mySlice)\n    showSlice(newSlice)\n}\nfunc showSlice(x\
    \ []int){\n    fmt.Printf(\"len=%d cap=%d slice=%v\\n\", len(x), cap(x), x)\n\
    }\n```\n输出:\n```\nlen=0 cap=0 slice=[]\nlen=3 cap=4 slice=[10 20 30]\nlen=3 cap=8\
    \ slice=[10 20 30]\n```\n解释：`append(mySlice, 10, 20, 30)` 向 `mySlice` 追加了三个值。`cap(mySlice)*2`\
    \ 使容量翻倍。`copy(newSlice, mySlice)` 将 `mySlice` 的内容拷贝到 `newSlice`。\n\n### 总结\n结构体是相同或不同类型数据的集合。\n\
    - **(1) 定义结构体类型**：\n```go\ntype structure_name struct {\n    member1 type;\n \
    \   member2 type;\n    ...\n    member3 type;\n}\n```\n- **(2) 访问结构体成员**：`structure_name{member1:\
    \ value1, member2: value2, …}`\n- **(3) 声明结构体变量**：`var variable structure_name`\n\
    - **(4) 给结构体成员赋值**：`variable.member = value`\n- 切片是一种特殊的数组，但它的长度是可变的。\n- `append(slice_name,\
    \ values)` // 向切片追加值\n- `copy(new_slice, old_slice)` // 将旧切片拷贝到新切片\n\n# 第 8 小\n\
    \n## GOROUTINE (协程)\n“goroutine”用于同时运行多个任务，这意味着 goroutine 函数可以通过使用 `go` 关键字同时执行多个线程。以下示例是定义一个\
    \ goroutine 函数并运行该 goroutine 函数。\n\n```go\ngo func(arguments) {\n    // 定义一个 goroutine\
    \ 函数\n} (arguments) // 运行 goroutine 函数\n```\n\n### 示例 8.1\n```go\npackage main\n\
    import \"fmt\"\nfunc fn(s string) {\n    // 定义一个用于...循环的函数\n    for i := 0; i\
    \ < 5; i++ {\n        fmt.Println(s)\n    }\n}\nfunc main() {\n    fn(\"Thread\
    \ B\") // 调用函数\n    go func(msg string) {\n        // 定义一个 goroutine 函数\n    \
    \    fmt.Println(msg)\n    } (\"Press Enter to Stop! \") // 运行 goroutine 函数\n\
    \    fmt.Scanln() // 接收键盘用户输入\n    fmt.Println(\"Complete! \")\n}\n```\n输出:\n\
    ```\nThread B\nThread B\nThread B\nThread B\nThread B\nPress Enter to Stop!\n\
    Complete! \n```\n解释：`go func(msg string) {…}` 定义了一个 goroutine 函数。`(\"Press Enter\
    \ to Stop! \")` 运行 goroutine 函数，并将参数传递给 goroutine 函数。\n\n"
