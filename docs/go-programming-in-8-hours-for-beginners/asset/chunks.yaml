  fmt: "\n# Summary\n`if statement` executes codes inside `{ … }` only if a specified\
    \ condition is true, does not execute any codes inside `{…}` if the condition\
    \ is false. In `switch statement`, the value of the variable will compare each\
    \ case first, if equals one of the `case` value; it will execute that `“case`\
    \ code. `Select Statement` is a bit like `Switch Statement`. `Switch Statement`\
    \ executes case code sequentially. `Select Statement` executes case code randomly.\
    \ `For Loop` is a control structure that can execute a specified number of loops.\n\
    \n# Hour 5\n\n## break\nThe `break` statement is used to terminate the loop. `Break`\
    \ statement also is used to terminate the `case` in `switch statement`.\n\nExample\
    \ 5.1\n```go\npackage main\nfunc main() {\n    var num int = 20\n    for num <\
    \ 30 {\n        print(num,\" \");\n        num++;\n        if num > 25 {\n   \
    \         break;     // terminate the for loop\n        }\n    }\n}\n```\nOutput:\
    \ 20 21 22 23 24 25\nExplanation: if `num > 25` is a test expression, if true,\
    \ the `break` statement will terminate the loop.\n\n## continue\nThe `continue`\
    \ statement skips the current loop to execute the next one.\n\nExample 5.2\n```go\n\
    package main\nfunc main() {\n    var num int = 20\n    for num < 30 {\n      \
    \  if num == 25 {\n            num = num + 1;\n            continue;     // skip\
    \ the current for loop\n        }\n        print(num, \" \")\n        num++; \
    \ \n    }\n}\n```\nOutput: 20 21 22 23 24 26 27 28 29\nExplanation: if `num ==\
    \ 25` is a test expression, if true, the `continue` statement will skip the current\
    \ for loop, and execute the next one.\nNote: there is no 25 in the result.\n\n\
    ## goto\n`goto label; ... label: statement;`\nThe `goto` statement can go to the\
    \ specified code and execute them unconditionally.\n\nExample 5.3\n```go\npackage\
    \ main\nfunc main() {\n    var num int = 10\n    if num > 10{\n        goto code01\n\
    \    }\n    if num == 10{\n        goto code02\n    }\n    code01: print(\"num\
    \ > 10\")\n    code02: print(\"num == 10\")\n}\n```\nOutput: num == 10\nExplanation:\
    \ `goto code01` means to execute the statement with label `code01`. `goto code02`\
    \ means to execute the statement with label `code02`.\n\n## Function\nA function\
    \ is a block of code that is reused to perform the same task.\n\n(1) The syntax\
    \ to define a function is as follows:\n`func function_name ( parameter type) type\
    \ { …… return … }`\n`func`: define a function\n`return`: pass the result to the\
    \ caller.\n\n(2) The syntax to call a function is as follows:\n`variable = function_name\
    \ ( parameter type )`\n\nExample 5.4\n```go\npackage main\nfunc main() {\n   \
    \ var a int = 10\n    var b int = 20\n    var result int\n    result = add(a,\
    \ b)    // call the function\n    print( \"The sum is \", result )\n}\nfunc add(num1,\
    \ num2 int) int {\n    // define a function\n    return num1 + num2 // pass the\
    \ result to the caller\n}\n```\nOutput: The sum is 30\nExplanation: `add(a, b)`\
    \ calls the function `add(a, b)`, and pass parameter values of `a` and `b` to\
    \ `num1` and `num2`. `func add(num1, num2 int) int` defines a function `add(...)`,\
    \ `num1` and `num2` receive the value from `a` and `b`. `return num1 + num2` passes\
    \ the result to the caller `add(...)`.\n\nExample 5.5\n```go\npackage main\nimport\
    \ \"fmt\"\nfunc swap(a, b string) (string, string) {\n    // define a function\n\
    \    return b, a // returns two values to the caller\n}\nfunc main() {\n    x,\
    \ y = swap(\"8 Hours\", \"JavaScript\") // call the function\n    fmt.Println(x,\
    \ y)\n}\n```\nOutput: JavaScript 8 Hours\nExplanation: `func swap(a, b string)\
    \ (string, string) {…}` defines a function. `swap(\"8 Hours\", \"JavaScript\"\
    )` call the function `swap(...)`, and pass the parameters to the function.\n\n\
    ## Working Scope\nThe working scope in any coding is range where a variable can\
    \ be accessed, and outside that scope the variable cannot be accessed.\nVariables\
    \ defined within a function are called local variables.\nVariables defined outside\
    \ a function are called global variables.\n\nExample 5.6\n```go\npackage main\n\
    func main() {\n    var a, b, c int // defines local variables\n    a = 100\n \
    \   b = 200\n    c = a + b\n    print(a, b, c)\n}\n```\nOutput: 300\nExplanation:\
    \ `var a, b, c int` define three local variables inside function `main`.\n\nExample\
    \ 5.7\n```go\npackage main\nvar v int = 100 // define a global variable\nfunc\
    \ main(){\n    print (\"The value of global variable is \", v)\n}\n```\nOutput:\
    \ The value of global variable is 100\nExplanation: `var v int = 100` defines\
    \ a global variable.\n\n## Summary\nThe `break` statement is used to terminate\
    \ the loop. `Break` statement also is used to terminate the `case` in `switch\
    \ statement`. The `continue` statement skips the current loop to execute the next\
    \ one. The `goto` statement can go to the specified code and execute them unconditionally.\n\
    (1) The syntax to define a function is: `func function_name ( parameter type)\
    \ type { …… return … }`\n(2) The syntax to call a function is: `variable = function_name\
    \ ( parameter type )`\nVariables defined within a function are called local variables.\
    \ Variables defined outside a function are called global variables.\n\n# Hour\
    \ 6\n\n## Array\nAn array is a collection of variables of the same type and name.\n\
    Array element: each variable in an array.\nArray index: also called as key, the\
    \ numbers on each element.\nNote: the array index or array key starts from zero.\
    \ There are several kinds of way to define an array:\n\n(1) `var array_name[length]\
    \ type` // define an array\n`array_name[key] = value` // assign value to the element\n\
    \nExample 6.1\n```go\npackage main\nfunc main(){\n    var arr [3]int // define\
    \ an array with three elements\n    arr[0] = 100 // assign a value to the array\
    \ element\n    arr[1] = 101\n    arr[2] = 102\n    print(arr[0], \" \", arr[1],\
    \ \" \", arr[2])\n}\n```\nOutput: 100 101 102\nExplanation: `var arr [3]int` defines\
    \ an array with three elements. `arr` is the array name. `3` is array length.\
    \ The array type is `int`. `arr[0]=100` assigns a value to the array element.\
    \ `arr` is the array name, `0` is an index or key.\n\n(2) `var array_name []type\
    \ = make( type, length )` // defines an array.\n\nExample 6.2\n```go\npackage\
    \ main\nfunc main(){\n    var arr []int = make([]int, 3) // define an array\n\
    \    arr[0] = 100 // assign a value to the array element\n    arr[1] = 101\n \
    \   arr[2] = 102\n    print(arr[0], \" \", arr[1], \" \", arr[2])\n}\n```\nOutput:\
    \ 100 101 102\nExplanation: `var arr []int = make([]int, 3)` defines an array\
    \ with three elements.\n\n(3) `var array_name = [length] type {value1,value2,\
    \ ... }` // defines an array with values.\n\nExample 6.3\n```go\npackage main\n\
    func main(){\n    var arr = [3]int{100,101,102} // define an array with values\n\
    \    print(arr[0], \" \", arr[1], \" \", arr[2])\n}\n```\nOutput: 100 101 102\n\
    Explanation: `var arr = [3]int{100,101,102}` defines an array with three values\
    \ 100, 101, and 102.\n\n(4) `var array_name = [...] type {value1,value2, … }`\
    \ // defines an array with values.\n\nExample 6.4\n```go\npackage main\nfunc main(){\n\
    \    var arr = [...]int{100,101,102} // defines an array\n    print(arr[0], \"\
    \ \", arr[1], \" \", arr[2])\n}\n```\nOutput: 100 101 102\nExplanation: `var arr\
    \ = [...]int{100,101,102}` defines an array with three values.\n\n## Pointers\n\
    A pointer represents the value of a memory address. \n(1) `&variable` // get the\
    \ memory address of a variable\n\nExample 6.5\n```go\npackage main\nimport \"\
    fmt\"\nfunc main() {\n    var num int = 10\n    fmt.Printf(\"The address of the\
    \ variable: %x\\n\", &num)\n}\n```\nOutput: The address of the variable: C000044058\n\
    Explanation: `&num` returns the address of the variable `num`.\n\n(2) `var variable_name\
    \ *type` // declare a pointer, `*variable_name` // get the variable value in the\
    \ address\n"
  trans: "\n\n# 总结\n`if statement` 只有在指定条件为真时才执行 `{ … }` 内部的代码，如果条件为假，则不执行 `{…}` 中的任何代码。在\
    \ `switch statement` 中，变量的值将首先与每个 `case` 进行比较，如果等于其中一个 `case` 值，它将执行该 `“case`\
    \ 代码。`Select Statement` 有点像 `Switch Statement`。`Switch Statement` 按照顺序执行 case\
    \ 代码。`Select Statement` 随机执行 case 代码。`For Loop` 是一种可以执行指定次数循环的控制结构。\n\n# 第 5 小时\n\
    \n## break\n`break` 语句用于终止循环。`Break` 语句也用于终止 `switch statement` 中的 `case`。\n\n\
    示例 5.1\n```go\npackage main\nfunc main() {\n    var num int = 20\n    for num\
    \ < 30 {\n        print(num,\" \");\n        num++;\n        if num > 25 {\n \
    \           break;     // 终止 for 循环\n        }\n    }\n}\n```\nOutput: 20 21 22\
    \ 23 24 25\nExplanation: 如果 `num > 25` 是测试表达式，如果为真，`break` 语句将终止循环。\n\n## continue\n\
    `continue` 语句跳过当前循环并执行下一次。\n\n示例 5.2\n```go\npackage main\nfunc main() {\n   \
    \ var num int = 20\n    for num < 30 {\n        if num == 25 {\n            num\
    \ = num + 1;\n            continue;     // 跳过当前的 for 循环\n        }\n        print(num,\
    \ \" \")\n        num++;  \n    }\n}\n```\nOutput: 20 21 22 23 24 26 27 28 29\n\
    Explanation: 如果 `num == 25` 是测试表达式，如果为真，`continue` 语句将跳过当前的 for 循环并执行下一次。\nNote：结果中没有\
    \ 25。\n\n## goto\n`goto label; ... label: statement;`\n`goto` 语句可以跳转到指定的代码并无条件地执行。\n\
    \n示例 5.3\n```go\npackage main\nfunc main() {\n    var num int = 10\n    if num\
    \ > 10{\n        goto code01\n    }\n    if num == 10{\n        goto code02\n\
    \    }\n    code01: print(\"num > 10\")\n    code02: print(\"num == 10\")\n}\n\
    ```\nOutput: num == 10\nExplanation: `goto code01` 意味着执行标签为 `code01` 的语句。`goto\
    \ code02` 意味着执行标签为 `code02` 的语句。\n\n## Function\n函数是一个重复用于执行相同任务的代码块。\n\n(1) 定义函数的语法如下：\n\
    `func function_name ( parameter type) type { …… return … }`\n`func`: 定义函数\n`return`:\
    \ 将结果传递给调用者。\n\n(2) 调用函数的语法如下：\n`variable = function_name ( parameter type )`\n\
    \n示例 5.4\n```go\npackage main\nfunc main() {\n    var a int = 10\n    var b int\
    \ = 20\n    var result int\n    result = add(a, b)    // 调用函数\n    print( \"The\
    \ sum is \", result )\n}\nfunc add(num1, num2 int) int {\n    // 定义一个函数\n    return\
    \ num1 + num2 // 将结果传递给调用者\n}\n```\nOutput: The sum is 30\nExplanation: `add(a,\
    \ b)` 调用函数 `add(a, b)`，并将参数 `a` 和 `b` 的值传递给 `num1` 和 `num2`。`func add(num1, num2\
    \ int) int` 定义了函数 `add(...)`，`num1` 和 `num2` 接收来自 `a` 和 `b` 的值。`return num1 +\
    \ num2` 将结果传递给调用者 `add(...)`。\n\n示例 5.5\n```go\npackage main\nimport \"fmt\"\n\
    func swap(a, b string) (string, string) {\n    // 定义一个函数\n    return b, a // 向调用者返回两个值\n\
    }\nfunc main() {\n    x, y = swap(\"8 Hours\", \"JavaScript\") // 调用函数\n    fmt.Println(x,\
    \ y)\n}\n```\nOutput: JavaScript 8 Hours\nExplanation: `func swap(a, b string)\
    \ (string, string) {…}` 定义了一个函数。`swap(\"8 Hours\", \"JavaScript\")` 调用函数 `swap(...)`\
    \ 并将参数传递给函数。\n\n## Working Scope\n任何编码中的作用域是变量可以访问的范围，在该范围之外无法访问该变量。\n在函数内部定义的变量称为局部变量。\n\
    在函数外部定义的变量称为全局变量。\n\n示例 5.6\n```go\npackage main\nfunc main() {\n    var a, b,\
    \ c int // 定义局部变量\n    a = 100\n    b = 200\n    c = a + b\n    print(a, b, c)\n\
    }\n```\nOutput: 300\nExplanation: `var a, b, c int` 在函数 `main` 内部定义了三个局部变量。\n\n\
    示例 5.7\n```go\npackage main\nvar v int = 100\n```\n(Wait,此处原文示例 5.7 似乎不完整，我根据提供的文本进行翻译)\n\
    ```go\npackage main\nvar v int = 100\n```\n(注：原文提供的示例 5.7 文本不完整，此处按原文提供的内容翻译)\n\
    \n"
