    \ 示例 4.1\n```go\npackage main\nfunc main() {\n    if 10 > 5 {\n        println(\"\
    greater\")\n    }\n}\n```\n**输出：** greater\n**解释：** `10 > 5` 为真，因此执行了块。\n\n###\
    \ else 语句\n如果 `if` 条件为假，则执行 `else` 块中的代码。\n\n### 示例 4.2\n```go\npackage main\n\
    func main() {\n    if 10 < 5 {\n        println(\"less\")\n    } else {\n    \
    \    println(\"greater\")\n    }\n}\n```\n**输出：** greater\n**解释：** `10 < 5` 为假，执行了\
    \ `else` 块。\n\n### else if 语句\n如果前面的 `if` 条件为假，可以使用 `else if` 检查另一个条件。\n\n###\
    \ 示例 4.3\n```go\npackage main\nfunc main() {\n    if 10 > 5 {\n        println(\"\
    greater\")\n    } else if 10 == 5 {\n        println(\"equal\")\n    } else {\n\
    \        println(\"less\")\n    }\n}\n```\n**输出：** greater\n**解释：** `10 > 5` 为真，执行了第一个块。\n\
    \n## switch 语句\n`switch` 语句允许根据多个值执行不同的代码块。\n\n### 示例 4.4\n```go\npackage main\n\
    func main() {\n    os := 2\n    switch os {\n    case 1:\n        println(\"one\"\
    )\n    case 2:\n        println(\"two\")\n    case 3:\n        println(\"three\"\
    )\n    }\n}\n```\n**输出：** two\n**解释：** `os` 的值为 2，匹配到 `case 2`。\n\n### break 语句\n\
    在 Go 的 `switch` 中，每个 `case` 后面都有隐含的 `break`，不需要手动编写。\n\n### 示例 4.5\n```go\npackage\
    \ main\nfunc main() {\n    switch 2 {\n    case 1:\n        println(\"one\")\n\
    \    case 2:\n        println(\"two\")\n        break\n    case 3:\n        println(\"\
    three\")\n    }\n}\n```\n**输出：** two\n**解释：** 匹配到 `case 2` 后遇到 `break`，退出 `switch`。\n\
    \n### default 语句\n如果没有 `case` 匹配，则执行 `default` 块。\n\n### 示例 4.6\n```go\npackage\
    \ main\nfunc main() {\n    switch 5 {\n    case 1:\n        println(\"one\")\n\
    \    default:\n        println(\"default\")\n    }\n}\n```\n**输出：** default\n\
    **解释：** 没有匹配的项，执行了 `default`。\n\n### 多值 case\n一个 `case` 可以包含多个可能的值。\n\n### 示例\
    \ 4.7\n```go\npackage main\nfunc main() {\n    switch 2 {\n    case 1, 2:\n  \
    \      println(\"one or two\")\n    case 3:\n        println(\"three\")\n    }\n\
    }\n```\n**输出：** one or two\n**解释：** `2` 匹配了 `case 1, 2`。\n\n### 无表达式 switch\n\
    如果 `switch` 后面没有跟表达式，它将充当一个更简洁的 `if-else` 链。\n\n### 示例 4.8\n```go\npackage main\n\
    func main() {\n    n := 15\n    switch {\n    case n > 20:\n        println(\"\
    large\")\n    case n > 10:\n        println(\"medium\")\n    default:\n      \
    \  println(\"small\")\n    }\n}\n```\n**输出：** medium\n**解释：** `n > 10` 为真。\n\n"
