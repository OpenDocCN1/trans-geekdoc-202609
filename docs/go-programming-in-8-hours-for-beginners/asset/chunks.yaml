    \ 6.6\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var num int= 100\n\
    \    var pt *int // 声明一个指针 pt\n    pt = &num // &num 获取地址并赋值给 pt\n    fmt.Printf(\"\
    The address of num: %x\\n\", &num)\n    fmt.Printf(\"The address in pt: %x\\n\"\
    , pt)\n    fmt.Printf(\"The value of the *pt: %d\\n\", *pt)\n}\n```\n输出:\n```\n\
    The address of num: C000044058\nThe address in pt: C000044058\nThe value of the\
    \ *pt: 100\n```\n解释：\n`&num` 从 `num` 获取内存地址。\n`pt = &num` 将内存地址赋值给 `pt`。\n`*pt`\
    \ 返回内存地址中的 `pt` 值。\n\n### 示例 6.7\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n    var a string=\"Hello\"\n    var b *string\n    var c string\n    b=&a\
    \ //&a 获取内存地址\n    c=*b //*b 获取内存地址中的值\n    fmt.Println(a)\n    fmt.Println(b)\n\
    \    fmt.Println(c)\n}\n```\n输出:\n```\nHello\n0xc0000381c8\nHello\n```\n解释：\n\
    `&variablename` 返回一个内存地址。\n`*variable` 返回内存地址中的值。\n\n#### 空指针 (Nil Pointer)\n\
    当指针被定义但没有赋值给任何变量地址时，它的值为 `nil`。\n\n### 示例 6.8\n```go\npackage main\nimport \"\
