  fmt: "\n# Range\n\n`Range` is a built-in function of the Go language, it is used\
    \ to iterate over arrays, slices, strings and maps.\n- Iterating over array, slice,\
    \ string returns index and value.\n- Iterating over map returns keys and value.\n\
    - Iterating over channel return values.\n\n## (1) Iterating Over Array/slice\n\
    \n```go\nfor key, value : = range array/slice { }\n```\n\n**Example 8.2**\n```go\n\
    package main\nimport \"fmt\"\nfunc main(){\n    for key, value : = range []int{10,\
    \ 11, 12, 13} {\n        fmt.Printf(\"key:%d  value:%d\\n\", key, value)\n   \
    \ }\n}\n```\n**Output:**\n```\nkey: 0    value: 10\nkey: 1    value: 11\nkey:\
    \ 2    value: 12\nkey: 3    value: 13\n```\n**Explanation:** `range []int{10,\
    \ 11, 12, 13}` iterates over an array or slice, and returns the keys and values.\n\
    \n## (2) Iterating Over String\n\n```go\nfor key, value : = range str { }\n```\n\
    \n**Example 8.3**\n```go\npackage main\nimport \"fmt\"\nfunc main(){\n    var\
    \ str = \"hello\"\n    for key, value : = range str {\n        fmt.Printf(\"key:%d\
    \ value:0x%x\\n\", key, value)\n    }\n}\n```\n**Output:**\n```\nkey : 0    value\
    \ : 0x68\nkey : 1    value : 0x65\nkey : 2    value : 0x6c\nkey : 3    value :\
    \ 0x6c\nkey : 4    value : 0x6f\n```\n**Explanation:** `range str { }` iterate\
    \ over a string, returns its keys and values.\n\n## (3) Iterating Over Channel\n\
    \n```go\nfor value : = range channel\n```\n\n**Example 8.4**\n```go\npackage main\n\
    import \"fmt\"\nfunc main(){\n    c : = make(chan int)\n    go func() {\n    \
    \    // define a goroutine function\n        c <- 1    // send datas to channels\n\
    \        c <- 2\n        c <- 3\n        close(c)  // close channels\n    }()\
    \ // call the goroutine function\n    for v := range c {\n        // iterate over\
    \ the channels\n        fmt.Println(\"Send data to channel: \",v)\n    }\n}\n\
    ```\n**Output:**\n```\nSend data to channel: 1\nSend data to channel: 2\nSend\
    \ data to channel: 3\n```\n**Explanation:** `range c` iterates over the channels.\
    \ `go func(){}` defines a goroutine function. `()` calls the goroutine function.\n\
    \n# Map\n\n`Map` is an unordered collection of key-value pairs. `Map` is used\
    \ to quickly retrieve data by key, which is similar to an index and points to\
    \ the value of the data. Two syntaxes to define a map is as follows:\n\n### (1)\n\
    ```go\nm1 : = map[key_type]value_type{}\n```\n**Explanation:** `m1` is a map.\n\
    \n### (2)\n```go\nm2 : = make(map[key_type]value_type)\n```\n**Explanation:**\
    \ `m2` is a map.\n\n**Example 8.5**\n```go\npackage main\nimport \"fmt\"\nfunc\
    \ main(){\n    m1 := map[int]int{1:10} = 10\n    m1[2] = 20\n    for key, value\
    \ : = range m1 {\n        fmt.Println(\"Key: \", key, \"Value:\", value)\n   \
    \ }\n    m2 := make(map[int]int)\n    m2[1] = 10\n    m2[2] = 20\n    for key,\
    \ value : = range m2 {\n        fmt.Println(\"Key: \", key, \"Value:\", value)\n\
    \    }\n}\n```\n**Output:**\n```\nKey:  1 Value: 10\nKey:  2 Value: 20\nKey: \
    \ 1 Value: 10\nKey:  2 Value: 20\n```\n*(Note: order may vary as maps are unordered)*\n\
    \n# Type Conversion\n\nType conversion means the one data type of a variable being\
    \ converted into another type.\n\n### (1)\n```go\ndata_type (variables)\n```\n\
    \n**Example 8.6**\n```go\npackage main\nimport \"fmt\"\nfunc main(){\n    var\
    \ num1 int = 100\n    var num2 int = 33\n    var result float32 = float32(num2)\n\
    \    fmt.Printf(\"The result is %f\\n\", result)\n}\n```\n**Output:**\n```\nThe\
    \ result is 33.000000\n```\n**Explanation:** `float32(num2)` converts the data\
    \ type.\n\n# Recursion\n\nRecursion means that the function calls itself.\n\n\
    ```go\nfunc recursion() {\n    recursion() // call itself\n}\nfunc main() {\n\
    \    recursion()\n}\n```\n\n**Example 8.7**\n```go\npackage main\nimport \"fmt\"\
    \nfunc myRecur(n int) int {\n    if n == 0 {\n        return 1\n    }\n    return\
    \ n * myRecur(n-1)\n}\nfunc main() {\n    fmt.Print(\"Factorial of 10 is \")\n\
    \    fmt.Print(myRecur(10))\n}\n```\n**Output:**\n```\nFactorial of 10 is 3628800\n\
    ```\n**Explanation:** `myRecur(n-1)` calls itself. The recursion doesn't stop\
    \ until `myRecur(0)` occurs.\n\n# Summary\n\n`goroutine` is used to run multiple\
    \ tasks simultaneously, which means that goroutine function can execute multiple\
    \ threads at the same time by using `go` keyword. Range Range is a built-in function\
    \ of the Go language, it is used to iterate over arrays, slices, strings and maps.\
