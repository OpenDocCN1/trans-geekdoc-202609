    ## 前言

    《8 小时 Go 语言编程》涵盖了所有核心 Go 语言知识。你可以快速轻松地掌握 Go 编程技能。


    本书包含了适用于初者的实用示例，并包含了适用于考试、工程师认证和工作面试的测试。


    ### 源代码下载

    本书提供了源代码下载，你可以将源代码下载到你喜欢的编辑器中进行测试。

    下载链接：`https://forms.aweber.com/form/34/180549243.htm`


    ## 目录

    - **第 1 小时**: 什么是 Go？ | 安装 Go | 环境 | 第一个程序 | 注释 | 标识符 | 总结

    - **第 2 小时**: 分隔符 | 关键字 | 数据类型 | 变量 | 声明 | `:=` | 总结

    - **第 3 小时**: 常量 | iota | 算术运算符 | 关系运算符 | 逻辑运算符 | 赋值运算符 | 优先级 | 总结

    - **第 4 小时**: if 语句 | else | switch 语句 | select 语句 | for 循环 | 总结

    - **第 5 小时**: break | continue | goto | 函数 | 作用域 | 总结

    - **第 6 小时**: 数组 | 指针 | 空指针 | 总结

    - **第 7 小时**: 结构体 | 切片 | `append()`, `copy()` | 总结

    - **第 8 小时**: 协程 | range | 映射 (map) | 类型转换 | 递归 | 总结

    - **附录 1**: 并发

    - **附录 2**: 测试 | 答案


    ## 什么是 Go？

    Go 是 Google 在 2009 年发布的开源编程语言。Go 是一种全新的、并发且带有垃圾回收的编译语言。它有一个很大的特点：可以在几秒钟完成大型 Go
    程序的编译。


    Go 提供了一种构建模型，使得依赖分析变得更容易。Go 是一种静态类型语言，其类型定义没有层次结构，因此用户不需要花时间定义类型之间的关系，这让用户觉得它比典型的面向对象的语言轻量。


    Go 提供了一种多核机器上构建系统软件的方法。Go 语言编程针对多处理器应用程序进行了优化，比 C 或 C++ 代码更快，并更安全地支持并行进程。


    ### Go 语言的特点：

    1. 简单、快速安全

    2. 并发、有趣、开源

    3. 内存管理、数组安全、快速编译。


