    \ main(){\n    c : = make(chan int)\n    go func() {\n        // 定义一个 goroutine\
    \ 函数\n        c <- 1    // 向通道发送数据\n        c <- 2\n        c <- 3\n        close(c)\
    \  // 关闭通道\n    }() // 调用该 goroutine 函数\n    for v := range c {\n        // 遍历通道\n\
    \        fmt.Println(\"Send data to channel: \",v)\n    }\n}\n```\n**输出:**\n```\n\
    Send data to channel: 1\nSend data to channel: 2\nSend data to channel: 3\n```\n\
    **解释：** `range c` 遍历通道。`go func(){}` 定义了一个 goroutine 函数。`()` 调用了该 goroutine 函数。\n\
    \n# Map \n\n`Map` 是一个无序的键值对集合。`Map` 用于通过键快速检索数据，类似于索引并指向数据的值。定义 map 的两种语法如下：\n\
    \n### (1)\n```go\nm1 : = map[key_type]value_type{}\n```\n**解释：** `m1` 是一个 map。\n\
    \n### (2)\n```go\nm2 : = make(map[key_type]value_type)\n```\n**解释：** `m2` 是一个\
    \ map。\n\n**示例 8.5**\n```go\npackage main\nimport \"fmt\"\nfunc main(){\n    m1\
    \ := map[int]int{1:10} = 10\n    m1[2] = 20\n    for key, value : = range m1 {\n\
    \        fmt.Println(\"Key: \", key, \"Value:\", value)\n    }\n    m2 := make(map[int]int)\n\
    \    m2[1] = 10\n    m2[2] = 20\n    for key, value : = range m2 {\n        fmt.Println(\"\
    Key: \", key, \"Value:\", value)\n    }\n}\n```\n**输出:**\n```\nKey:  1 Value:\
    \ 10\nKey:  2 Value: 20\nKey:  1 Value: 10\nKey:  2 Value: 20\n```\n*(注：顺序可能会变化，因为\
    \ map 是无序的)*\n\n# 类型转换\n\n类型转换意味着将变量的一种数据类型转换为另一种类型。\n\n### (1)\n```go\ndata_type\
    \ (variables)\n```\n\n**示例 8.6**\n```go\npackage main\nimport \"fmt\"\nfunc main(){\n\
    \    var num1 int = 100\n    var num2 int = 33\n    var result float32 = float32(num2)\n\
    \    fmt.Printf(\"The result is %f\\n\", result)\n}\n```\n**输出:**\n```\nThe result\
    \ is 33.000000\n```\n**解释：** `float32(num2)` 了数据类型。\n\n# 递归\n\n递归意味着函数调用自己。\n\n\
    ```go\nfunc recursion() {\n    recursion() // 调用自己\n}\nfunc main() {\n    recursion()\n\
    }\n```\n\n**示例 8.7**\n```go\npackage main\nimport \"fmt\"\nfunc myRecur(n int)\
    \ int {\n    if n == 0 {\n        return 1\n    }\n    return n * myRecur(n-1)\n\
    }\nfunc main() {\n    fmt.Print(\"Factorial of 10 is \")\n    fmt.Print(myRecur(10))\n\
    }\n```\n**输出:**\n```\nFactorial of 10 is 3628800\n```\n**解释：** `myRecur(n-1)`\
    \ 调用了它自己。在出现 `myRecur(0)` 之前，递归不会停止。\n\n# 总结\n\n`goroutine` 用于同时运行多个任务，这意味着 goroutine\
    \ 函数可以通过 `go` 关键字同时执行多个线程。`Range` 是 Go 语言的内置函数，用于遍历数组、切片、字符串和 map。`Map` 是一个无序的键值对集合。`Map`\
    \ 用于通过键快速检索数据，类似于索引并指向数据的值。`类型转换`意味着将变量的一种数据类型转换为另一种类型。`data_type (variables)`\
    \ `递归` 意味着函数调用自己。\n\n```go\nfunc recursion() {\n    recursion() // 调用自己\n}\nfunc\
    \ main() {\n    recursion()\n}\n```\n\n# 附录 1\n\n## 并发\n\nGo 语言支持并发，我们可以使用 `go`\
    \ 关键字调用函数，启动一个新的运行时线程 goroutine。使用 `go` 关键字调用函数的语法如下：\n\n```go\ngo function_name(arguments)\n\
    ```\n\n**示例:**\n```go\npackage main\nimport (\n    \"fmt\"\n    \"time\"\n)\n\
    func fn(s string) {\n    // 定义一个函数 fn\n    for i := 0; i < 5; i++ {\n        time.Sleep(200\
    \ * time.Millisecond) // 延迟运行\n        fmt.Println(s)\n    }\n}\nfunc main() {\n\
    \    go fn(\"Thread A\") // 调用函数 fn\n    fn(\"Thread B\") // 调用函数 fn\n    go func(msg\
    \ string) {\n        // 定义一个 goroutine 函数\n        fmt.Println(msg)\n    }(\"\
    Press Enter to Stop! \") // 运行 goroutine 函数\n    fmt.Scanln() // 接受键盘用户输入\n  \
    \  fmt.Println(\"Complete! \")\n}\n```\n**输出:**\n```\nThread B\nThread A\nThread\
    \ B\nThread A\nThread B\nThread A\nThread B\nThread A\nThread B\nPress Enter to\
    \ Stop!\nComplete! \n```\n**解释：** `go fn(\"Thread A\")` 使用 `go` 关键字调用函数 `fn`，启动了一个新的线程\
    \ goroutine。\n\n# 附录 2\n\n"
