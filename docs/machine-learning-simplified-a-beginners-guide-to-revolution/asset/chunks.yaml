    of the relationship between x1 and h1. Similarly, w2 determines that for x1 and
    h2 and so on. For example, if x1 is the amount of rainfall and h1 is the amount
    of crops grown, then w1 will be high because these two things are strongly related.
    Same applies to your brain as well. You remember some moments of your life clearly
    whereas you forget most of them. This is because you’ve been thinking about that
    moment and it made the relationship strong. So, you remember those moments. Whereas,
    you don’t think about other moments and gradually the relationship gets weaker
    and will be difficult for you to remember later on. Consider it as the fundamental
    thing that defines what decisions the neural network makes. Now, what are those
    b1, b2, b3? These are biases. Let’s say you have a factory. You get expenses from
    electricity, raw materials, etc. while your industry is running. But there are
    some fixed expenses that will occur even if you stop production for sometime.
    Those costs include land rent, employee salary, etc. From now on, Whenever I use
    W and B, W represents all the weights of the model i.e. w1, w2, w3, .... ,wn and
    B represents all the biases of the model i.e. b1, b2, b3, ..., bn. B and W changes
    throughout the training process to make the prediction better. So, B and W are
    called Parameters . Also, consider B as the c in the linear equation Y = mX +
    c. They are constant values which helps a line to deviate from the origin to fit
    the data better. (And of course, W is similar to m in the linear equation.) Now,
    let’s see what happens inside each node in a hidden layer (In this case, h1,h2
    and h3). h1 = x1 \* w1 + x2 \* w4 + b1 h2 = x1 \* w2 + x2 \* w5 + b2 h3 = x1 \*
    w3 + x2 \* w6 + b3 And ŷ = h1 \* w7 + h2 \* w8 + h3 \* w9 As you can see, each
    input node is multiplied with the respective weight connecting it to a specific
    hidden layer node and added together with the bias. After that, those hidden layer
    nodes are multiplied with the weights connecting them with the output layer and
    added together. (Note: Output Layer doesn’t contain any bias. We’ll talk about
    it later.) By doing this, the data is moving in the forward direction i.e. from
    input node to hidden layer(s) to output layer. So, during training the neural
    network model, this process is called Forward Propagation . After it reaches the
    output layer, an output is generated i.e. ŷ. At first, W and B are all randomly
    generated. So, ŷ is also arbitrary. Now, The error/loss in the prediction is
    calculated by, Loss = (y - ŷ) ² For a better prediction, This loss has to be
    minimized to its least. For this, we have to change the values of the parameters
    (W and B). We do it by the process called Backward Propagation . ![](rsrc242.jpg)Fig
    6-2. Backward Propagation algorithm The goal of taking derivatives of Loss (L)
