  fmt: "\n# Code Implementation\n\nSo, that’s it for the theory. Now, let’s straightly\
    \ jump into the code. We will create a `CIFAR-10` dataset classifier. `CIFAR-10`\
    \ is a colored image dataset of various objects like airplanes, trucks, etc. Let’s\
    \ import the required libraries.\n\n```python\nimport tensorflow as tf\nimport\
    \ tensorflow_datasets as tfds\nimport matplotlib.pyplot as plt\n```\n\nDownload\
    \ the `CIFAR10` dataset from the `tfds` module.\n\n```python\ndataset, info =\
    \ tfds.load('cifar10', as_supervised=True, with_info=True)\n```\n\nSplit train\
    \ and test dataset and find the number of images in the training and test set.\n\
    \n```python\ntrain_dataset, test_dataset = dataset['train'], dataset['test']\n\
    num_train = info.splits['train'].num_examples\nnum_test = info.splits['test'].num_examples\n\
    ```\n\nLet’s see the information of the dataset.\n![](rsrc24K.jpg)\n\nNow, let’s\
    \ create a `normalize` function that takes an image and resizes it to 32x32 and\
    \ normalizes it by dividing the image by 255.\n\n```python\ndef normalize(image,\
    \ labels):\n    image = tf.image.resize(image, (32, 32)) / 255.0\n    return image,\
    \ labels\n```\n\nNow, let’s create batches of training and test set after normalizing\
    \ the whole dataset.\n\n```python\nBATCH_SIZE = 32\n# shuffling and implementing\
    \ normalize function on train, test and validation dataset\ntrain_batches = train_dataset.shuffle(num_train\
    \ // 4).map(normalize).batch(BATCH_SIZE).prefetch(1)\nvalidation_batches = test_dataset.map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
    test_batches = test_dataset.map(normalize).batch(3000).prefetch(1)\n```\n\nNow,\
    \ let’s create the model. We will use 3 Convolutional layers and the kernel size\
    \ of 3x3 as usual. 16 filters for the first Convolutional layer and 32 filters\
    \ for the next 2 layers each. Remember to Pool after each convolution. Then, we\
    \ flatten the image and use Neural networks.\n\n```python\nmodel = tf.keras.Sequential([\n\
    \    tf.keras.layers.Conv2D(filters=16, kernel_size=(3, 3), activation='relu',\
    \ input_shape=(32, 32, 3)),\n    tf.keras.layers.MaxPool2D(),\n    tf.keras.layers.Conv2D(filters=32,\
    \ kernel_size=(3, 3), activation='relu'),\n    tf.keras.layers.MaxPool2D(),\n\
    \    tf.keras.layers.Conv2D(filters=32, kernel_size=(3, 3), activation='relu'),\n\
    \    tf.keras.layers.Flatten(),\n    tf.keras.layers.Dense(100, activation='relu'),\n\
    \    tf.keras.layers.Dense(10, activation='softmax')\n])\n```\n\nLet’s see the\
    \ model we created in summary.\n\n```python\nmodel.summary()\n```\n![](rsrc24M.jpg)\n\
    \nNow, let’s compile the model with Adam optimizer and Sparse Categorical Cross\
    \ Entropy as the loss function. This is the most commonly used loss function for\
    \ Categorical data.\n\n```python\nmodel.compile(optimizer='adam', loss='sparse_categorical_crossentropy',\
    \ metrics=['accuracy'])\n```\n\nNow, let’s train the model on 12 epochs.\n\n```python\n\
    history = model.fit(train_batches, epochs=12, validation_data=validation_batches)\n\
    ```\n\nLet’s test the model.\n\n```python\ntest_loss, test_acc = model.evaluate(test_batches)\n\
    ```\n\nStore the performance variables.\n\n```python\nloss_train = history.history['loss']\n\
    accuracy_train = history.history['accuracy']\nloss_val = history.history['val_loss']\n\
    accuracy_val = history.history['val_accuracy']\n```\n\nNow, let’s create a function\
    \ to visualize our training performance.\n\n```python\ndef visualize(is_acc):\n\
    \    epochs = range(1, 13)\n    if is_acc:\n        plt.plot(epochs, accuracy_train,\
    \ 'r', label='Training accuracy')\n        plt.plot(epochs, accuracy_val, 'y',\
    \ label='validation accuracy')\n        plt.title('Training and Validation Results')\n\
    \        plt.xlabel('Epochs')\n        plt.ylabel('Accuracy')\n    else:\n   \
    \     plt.plot(epochs, loss_train, 'g', label='Training loss')\n        plt.plot(epochs,\
    \ loss_val, 'b', label='validation loss')\n        plt.title('Training and Validation\
    \ Results')\n        plt.xlabel('Epochs')\n        plt.ylabel('Loss')\n    plt.legend()\n\
    \    plt.show()\n```\n\n`visualize(is_acc=True)`\n![](rsrc24N.jpg)\n`visualize(is_acc=False)`\n\
    ![](rsrc24P.jpg)\n\nConclusion: So, this way we learnt the architecture of CNN,\
    \ their application and how they work. After that, we implemented CNN to create\
    \ a CIFAR10 image classifier. I can guarantee you if you create this same model\
    \ without CNN, then’ll see a significant drop in accuracy. So, this is all about\
    \ CNN. In the next chapter, we will learn about an important technique in ML.\
    \ I hope you are enjoying it till now.\n\n# CHAPTER 8: Transfer Learning\n\nLet’s\
    \ say there are two friends: `John` and `Kim`. `John` is a Baseball player and\
    \ has been one of the best in his field but `Kim` is not a sports guy. One day\
    \ there was a challenge to hit sixes in Cricket. The one to complete the challenge\
    \ would get $20,000 prize. So both `John` and `Kim` started practicing Cricket.\
    \ Now who do you think has better chance of winning the prize? Of course `John`.\
    \ It has experience in sports. On top of that, baseball and cricket are somewhat\
    \ similar. So `John` can learn to play better in a little amount of time because\
    \ of his experience. But `Kim` on the other hand has to learn the skill from scratch.\
    \ It is completely new for him. Talking about the brain, `Kim` has to rewire his\
    \ neural connections but for `John`, he has already rewired those connections\
    \ due to his experience in a similar field can help you learn a new skill faster\
    \ and efficiently. This is the core idea of Transfer Learning. According to the\
    \ book Deep Learning by Ian Goodfellow, Aaron Courville, and Yoshua Bengio, the\
    \ definition of transfer learning is a “situation where what has been learned\
    \ in one setting is exploited to improve generalization in another.”\n\n![](rsrc24.jpg)\n\
    Fig.8-1. Traditional Machine Learning Vs Transfer learning (source: [Click here](https://subscription.packpub.com/book/big_data_and_intelligence/9781788969212/ch2/introduction-to-transfer-learning))\n\
    \nSo let’s see what is actually done. Let’s say you want to create a dog/cat classifier\
    \ and you have a dataset for that purpose. And there is a dataset called `ImageNet`\
    \ which contains 4 million images with over 20,000 categories. The model trained\
    \ on `ImageNet` is available on the internet. Now what you can do is download\
    \ that `ImageNet` pre-trained model and remove the output layer. You can then\
    \ add your own output layer with Dog and Cat nodes. Now you can train the model.\
    \ But remember these points:\n\n- You have to resize your input according to the\
    \ architecture of the pre-trained model. For example, if you use `ImageNet`, you\
    \ must resize your input image to 224 pixels.\n- You have to freeze i.e. not update\
    \ the parameters of either or most of the hidden layers according to your requirements.\n\
    \nDidn’t understand? No problem. We are going to create a dog breed classifier\
    \ using a `ResNet` pre-trained model.\n\nCode Implementation: Import all the required\
    \ libraries. `tfds` is for dataset and `tensorflow_hub` to download pre-trained\
    \ model.\n\n```python\nimport tensorflow as tf\nimport tensorflow_datasets as\
    \ tfds\nimport tensorflow_hub as hub\n```\n\nLet’s import `stanford_dogs` dataset\
    \ that contains 120 classes of dogs.\n\n```python\ndataset, info = tfds.load('stanford_dogs',\
    \ as_supervised=True, with_info=True)\n```\n\nSplit train and test set.\n\n```python\n\
    train_dataset, test_dataset = dataset['train'], dataset['test']\nnum_train = info.splits['train'].num_examples\n\
    num_test = info.splits['test'].num_examples\n```\n![](rsrc24S.jpg)\n\nNormalize\
    \ and batch the data. We are resizing the image to 224x224 because we will be\
    \ using ResNetNet pre-trained model which requires a 224x224 image as input.\n\
    \n```python\ndef normalize(image, labels):\n    image = tf.image.resize(image,\
    \ (224, 224)) / 255.0\n    return image, labels\n\nBATCH_SIZE = 64\n# shuffling\
    \ and implementing normalize function on train, test and validation dataset\n\
    train_batches = train_dataset.shuffle(num_train // 4).map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
    validation_batches = test_dataset.map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
    ```\n\nYou can go the tensorflow website and find the pre-trained model you like.\
    \ You can then copy’s link and then use `KerasLayer` method to download it.\n\n\
    ```python\n# downloading pre-trained model\nfeature_extractor = hub.KerasLayer(\n\
    \    \"https://tfhub.dev/google/imagenet/resnet_v2_50/feature_vector/4\",\n  \
    \  input_shape=(224, 224, 3)\n)\n```\n\nThe pre-trained model we downloaded doesn’t\
    \ contain any output layer. So we don’t have to remove it. We can add our own\
