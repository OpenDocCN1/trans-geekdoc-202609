    \ )\n\nHuman body contains around 100 billion neurons that transmits messages\
    \ throughout the body. A neuron consists of `Dendrites`, `Soma` and `Axon`. `Soma`\
    \ processes the information passed by `Dendrites`.\n\n*(Note: The remaining text\
