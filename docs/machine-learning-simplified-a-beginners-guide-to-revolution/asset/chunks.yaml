    结论：简单神经网络的介绍到此结束。在这一章中，我们学习了神经网络的工作原理、相关的各种术语，并实现了两个项目。我们还学习了图像知识。我希望你喜欢。现在，我们将讨论神经网络的一些变体。真正的乐趣从这里开始。


    # 第 7 章：卷积神经网络 (CNN)


    你知道吗，我们可以训练舌头来帮助我们检查自己是否盲盲？是的，这是真的。有一家名为 Brainport 的公司正在做这件事。但等一下，我们在上一章中也做过类似的事情。简单神经网络并不是为了图像处理设计的。尽管如此，我们还是得到了良好的准确率。但通过卷积神经网络，我们可以获得更高的准确率，特别是使用彩色图像作为数据时。因此，主要用于图像处理的神经网络变体是
    `Convolution Neural Network`。


    现在你可能会问，`CNN` 如何在图像处理中提供更好的结果呢？简单的答案是“通过称为卷积的过程”。`CNN` 是一个在开头带有卷积的简单神经网络。假设你想识别图像中某人的脸，但背景中还有汽车、道路等物品。如果使用简单神经网络，它会给图像中的每个像素分配权重。但在卷积的帮助下，网络将对脸分配权重，这将显著提高计算效率并提高准确率。因此，它被
    Google、Facebook、Instagram 等科技巨头使用。


    ![](img/rsrc24B.jpg)图 7-1.卷积神经网络（来源:[点击此处](https://adeshpande3.github.io/A-Beginner%27s-Guide-To-Understanding-Convolutional-Neural-Networks/)）


    ## 卷积过程


    假设这是一张图像![](img/rsrc24C.jpg)现在，为了从这张图像中提取有用信息（特征），需要将其与一个相对较小的矩阵（通常大小为 `3x3`）进行逐元素乘![](img/rsrc24D.jpg)那个较小的矩阵被称为
    `kernel` 或 `filter`。现在，将此 `kernel` 应用于图像矩阵以提取特征。操作后的矩阵被称为 `feature map`。


    ![](img/rsrc24E.jpg)图 7-2. 特征图提取（来源:[点击此处](https://www.oreilly.com/library/view/learn-unity-ml-agents/9781789138139/16671cc8-0aff-433a-878c-7430be8b9aa1.xhtml））


    `feature map` 总是比输入图像小。如果你想让 `feature map` 的大小与输入相同，可以在 `feature map` 矩阵周围添加零。这个过程被称为
    `zero padding`（零填充）。查看这张图片以帮助更好地理解卷积![](img/rsrc24F.jpg)图 7-3. 特征图图像（来源:[点击此处](https://www.kdnuggets.com/2016/11/intuitive-explanation-convolutional-neural-networks.html））


    `CNN` 中的一些术语是：

    -   **深度 (Depth)**：它是应用于图像的过滤器数量。在上面的示例中我们使用了一个过滤器。所以它的深度为 1。如果使用 3 个过滤器，则深度为
    3，依此类推。通常彩色图像使用 3 个过滤器，因为有 3 个矩阵。

    -   **步长 (Stride)**：它是输入矩阵中每一步跳过的像素数。如果 `stride` 为 1，则 `kernel` 每步向前移动一个像素；如果是
    2，则 `kernel` 每步向前移动两个像素，依此类推。


    步长为 1 的示例![](img/rsrc24G.jpg)

    步长为 2 的示例![](img/rsrc24H.jpg)

    图 7-4.步长


    ### 非线性

    提取特征图后，你需要对 `feature map` 应用非线性。对于 `CNN` 来说，最好的是 `ReLU`。


    ### 池化 / 下采样 (Pooling / Subsampling)

    我们已经提取了特征并对其应用了非线性。现在，我们必须将其准备好进行处理。`Pooling` 是一种缩小特征图尺寸的方法。尺寸减小意味着权重更少，这意味着模型过拟合的可能性较低，并且增加了计算效率。池化有
    2 类型![](img/rsrc24J.jpg)图 7-5. 池化的类型（来源:[点击此处](https://www.researchgate.net/figure/Illustration-of-Max-Pooling-and-Average-Pooling-Figure-2-above-shows-an-example-of-max_fig2_333593451））


    正如你看到的，`Max pooling`（最大池化）是从矩阵的池大小中提取最大值像素的技术，而 `Average pooling`（平均池化）是将矩阵池大小内的像素平均化为一个像素的技术。在图中，池的大小为
    `2x2`，因此每个颜色覆盖矩阵的 `2x2` 部分，并对其进行池化操作。


    ### 神经网络

    这是 `CNN` 的最后部分。它是我们在之前的课程中学习如何构建的简单神经网络。所以，我在这里不再谈论它。你已经都理解了。


    ### 快速回顾：

    `CNN` 包含以下步骤：

    1. 使用 `kernel/filter` 从输入图像创建 `feature map`。

    2. 使用激活函数（通常是 `ReLU`）为 `feature map` 提供非线性。

    3. 随后对非线性特征图进行 `pooling` 处理，以缩小 `feature map` 的尺寸。

    4. 将 `pooling` 后得到的矩阵交给简单神经网络进行预测。


