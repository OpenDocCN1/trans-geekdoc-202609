  fmt: "\n# IMDB Review Sentiment Analysis\n\nImport all the required libraries. Import\
    \ `imdb` dataset from `tf.keras.dataset` and import `sequence` which is required\
    \ for text preprocessing.\n\n```python\nimport tensorflow as tf\nfrom tensorflow.keras.datasets\
    \ import imdb\nfrom tensorflow.keras.preprocessing import sequence\n```\n\n###\
    \ Storing data in respective variables\n\nThe maximum number of vocabulary(words)\
    \ is `5000`. The target variable contains `0s` and `1s` where `0` means negative\
    \ review and `1` means positive review.\n\n```python\n(training_text, training_targets),\
    \ (testing_text, testing_targets) = imdb.load_data(num_words=5000)\n```\n\nTaking\
    \ the first 400 words of each text in the dataset because it would be enough to\
    \ know the sentiment of the sentence.\n`max_words = 400`\n\nThe text in the dataset\
    \ is tokenized by default. So, we need to apply padding to the data.\n\n```python\n\
    training_text = sequence.pad_sequences(training_text, maxlen=max_words)\ntesting_text\
    \ = sequence.pad_sequences(testing_text, maxlen=max_words)\n```\n\n### Creating\
    \ the model\n\nNow, let’s create the model. The first layer would be an embedding\
    \ layer with `input_dimension` equal to no. of vocabulary and input length as\
    \ `400`. The output dimension is `30`. Then it is passed to a `Dense` layer and\
    \ then the output is generated.\n\n```python\nmodel = tf.keras.Sequential([\n\
    \    tf.keras.layers.Embedding(input_dim=5000, output_dim=30, input_legth=max_words),\n\
    \    tf.keras.layers.Flatten(),\n    tf.keras.layers.Dense(256, activation='relu'),\n\
    \    tf.keras.layers.Dense(1, activation='sigmoid')\n])\n```\n\nLet’s compile\
    \ the model with binary cross entropy loss function because it is a binary classification\
    \ and `Adam` as optimizer function.\n\n```python\nmodel.compile(loss='binary_crossentropy',\
    \ optimizer='adam', metrics=['accuracy'])\n```\n\nLet’s see the model architecture.\n\
    ```python\nmodel.summary()\n```\n![](rsrc24Z.jpg)\n\n### Training the model\n\n\
    Finally, let’s train the model on `3` epochs.\n\n```python\nhistory = model.fit(training_text,\
    \ training_targets, validation_data=(testing_text, testing_targets), epochs=3,\
    \ batch_size=128)\n```\n\nThe training accuracy is found to be `0.9841`.\n`test_loss,\
    \ test_accuracy = model.evaluate(testing_text, testing_targets)`\n`print(test_accuracy)`\n\
    The text accuracy was found to be `0.854`.\n\n### Testing the model\n\nNow, let’s\
    \ test the model using a random `imdb` review I copied from the internet. Let’s\
    \ store the text in a list.\n\n```python\ntext = [ \"I have never seen such an\
    \ amazing film since I saw The Shawshank Redemption. Shawshank encompasses friendships,\
    \ hardships, hopes, and dreams. And what is so great about the movie is that it\
    \ moves you, it gives you hope. Even though the circumstances between the characters\
    \ and the viewers are quite different, you don't feel that far removed from what\
    \ the characters are going through. It is a simple film, yet it has an everlasting\
    \ message. Frank Darabont need to put any kind of outlandish special effects to\
    \ get us to love this film, the narration and the acting does that for him. Why\
    \ this movie didn't win all seven Oscars is beyond me, but don't let that sway\
    \ you to not see this film, let its ranking on the IMDb's top 250 list sway you,\
    \ let your friends recommendation about the movie sway you.Set aside a little\
    \ over two hours tonight and rent this movie. You will finally understand what\
    \ everyone is talking about and you will understand why this is my all time favorite\
    \ movie.\" ]\n```\n\nNow, to pre-process the text import `Tokenizer`.\n\n```python\n\
    from tensorflow.keras.preprocessing.text import Tokenizer\n```\n\nCreate an instance\
    \ of `Tokenizer`.\n```python\ntokenizer = Tokenizer()\n```\n\nTokenize the text\
    \ using `.fit_on_texts` method.\n```python\ntokenizer.fit_on_texts(text)\n```\n\
    \nConvert the words into sequences using `.texts_to_sequences` method.\n```python\n\
    seq = tokenizer.texts_to_sequences(text)\n```\n\nNow, pad the sequences.\n```python\n\
    seq = sequence.pad_sequences(seq, maxlen=400, padding='post')\n```\n\nIt is ready\
    \ for prediction. The sequence is passed to the model.\n```python\npred = model.predict(seq)\n\
    ```\n\nNow, let’s round the prediction and print it.\n```python\nround(pred[0][0])\n\
    ```\nIt gives `1` as the result which means the review is positive.\n\nColab notebook:\
    \ [Click here](https://colab.research.google.com/drive/1iICl6ot8OmxwdZoyvNU4TPy6xHkJy6T0)\n\
    \n### Conclusion\n\nIn this chapter, we learnt different terminologies of NLP.\
