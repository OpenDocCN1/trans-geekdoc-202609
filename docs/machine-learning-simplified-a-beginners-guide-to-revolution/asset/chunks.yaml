- raw: 'CHAPTER 1 Introduction to AI Artificial Intelligence is a hot topic all around
    the world. Most of the big companies claim to have used Artificial Intelligence
    in their products and services. It has started to gain hype in the market, again.
    Yes, Artificial Intelligence was a hot topic even during the 1960s and 70s but
    it all faded away. Is history going to repeat again? There is no clear Yes/No
    answer for this question. Artificial Intelligence is actually an ideology. It
    is an ideology in which a computer must have human-like cognitive abilities. By
    cognitive abilities, I mean Human-like understanding, vision and speech. Artificial
    Intelligence can be categorized into 3 types on the basis of its abilities. Artificial
    Narrow Intelligence (ANI): Often referred to as weak AI, this is the kind of AI
    that is less capable than human beings. This is the AI we all are seeing now-a-days.
    They are often limited to a certain task. For example, a face recognition program
    cannot perform speech recognition. On a quick glance, they may seem more capable
    than humans, but our vast brain and experiences make us far better than these.
    Artificial General Intelligence (AGI): This kind of AI’s capabilities is on-par
    with human’s. They are also referred to as strong AI. It can mimic humans but
    exists only on concepts and theories. Not only on a single task, but it should
    be able to excel on various tasks. With current computing technologies, we cannot
    expect AGI anytime soon, unless there is a revolution. Some researchers suggest
    Quantum Computers might be the breakthrough required for AGI. Artificial Super
    Intelligence (ASI): Above human’s capabilities, they are the most intelligent
    beings on the planet. They have exceeded humans and may enslave humans just like
    humans enslave animals. They can have emotions and become self-aware. Robots shown
    in movies like Ex-Machina, Terminator, Enthiran, etc. fall under the category
    of ASI. Fortunately, they are just hypothetical and most probably we may not see
    them in our lifetime (unless there is a major breakthrough in technologies.) So,
    to answer our first question of whether history is going to repeat, it all depends
    upon the expectations of the general population. If they are expecting AGI and
    ASI, then, it might repeat. To approach this ideology, we use a method called
    Machine Learning. So, if any of the online courses or books claims to teach you
    Artificial Intelligence, then it’s just a clickbait. Actually, they are teaching
    you Machine Learning. Then, what is Machine Learning? What is Machine Learning?
    Machine Learning is the use of mathematical and statistical tools to recognize
    a pattern in a dataset. Mostly, it is used to perform tasks that are repetitive
    in nature and exhausting for humans. By far, it is the best method to approach
    Artificial Intelligence. Machine Learning process can be divided into 4 steps
    : ●       Collect and refine the dataset (labelled or unlabeled) ●       Choose
    a Machine Learning Algorithm ●       Train a Machine Learning model ●       Make
    predictions out of trained model There are three types of Machine Learning Algorithms:
    Supervised Machine Learning Algorithms: Those kinds of Machine Learning Algorithms
    where you use a collection of input-output pairs to make machines understand the
    relation between them. This collection of input-output pairs is called a labelled
    dataset. Applying that relation, the machine can then predict the output for a
    given unknown input.  (Don’t worry if you haven’t understood, just stay till the
    end, you’ll understand all.) Some of the examples of supervised Machine Learning
    Algorithms are: ●       Linear Regression ●       Artificial Neural Networks ●
          Logistic Regression ●       Support Vector Machine ●       Naive Bayes Classifier,
    etc. Unsupervised Machine Learning Algorithms: Those kind of machine Learning
    Algorithms where you have to use unlabeled dataset to train a machine learning
    model are unsupervised machine learning algorithms. They are mostly used for classification
    and clustering tasks. Some of the examples of Unsupervised Machine Learning algorithms
    are: ●       K-means clustering ●       Autoencoders ●       Principal Component
    Analysis ●       Generative Adversarial Networks , etc. Reinforcement Learning
    Algorithms: This is a relatively new approach which works on a hit-and-trial method.
    There is a system of reward and punishment. The model performs random activities
    at initial stage and for each activity that didn’t provide a good outcome, it’ll
    get a negative point and vice versa. The model works to increase its points. After
    the process, the result is an optimal model. For example, let’s say you are learning
    cycling. Then, every time you fall, you realize that particular step used when
    you fell should not be used again i.e. punishment and every time you cycle without
    falling, you realize you should use that particular steps i.e. reward. After a
    few days of similar repetition, you will learn cycling. This is how reinforcement
    learning works. What is Deep Learning? Neural Network is the network of artificial
    neurons that best tries to mimic the biological neuron. Let''s talk about biological
    neurons. Biological neurons ![](rsrc232.jpg)Fig 1-1. Structure of a neuron (source:
    [Click Here](https://socratic.org/questions/how-is-a-neuron-adapted-to-perform-its-function)
    ) Human body contains around 100 billion neurons that transmits messages throughout
    the body. A neuron consists of Dendrites, Soma and Axon. Soma processes the information
    passed by Dendrites and axon. A neuron is connected to another through axon and
    dendrites. ![](rsrc233.jpg)Fig 1-2. Artificial Neural Network (Source: [Click
    Here](https://www.semanticscholar.org/paper/Combination-forecasting-based-on-SVM-and-neural-for-Han-Wang/56335d70dce4dfc548ce1b5189f1dab1ee9de2f5)
    ) Similarly, Artificial Neural Network consists following parts: Input Layer:
    Identical to Dendrites of Biological neurons, it receives the input signal that
    is to be processed. Then it passes the input to Hidden Layer. Hidden Layer(s):
    It receives and processes the input provided by the input layer similar to Soma
    of Biological Neuron. Depending upon the complexity of the problem, there can
    be more than 1 hidden layer in a neural network. Output Layer: After Processing
    the input, Hidden layer passes the information to the output layer which provides
    the output to the user. It is similar to the axon of a biological neuron. If we
    use more than two Hidden layers, then our network becomes DEEP. so, we call them
    Deep Neural Networks . And the process of training a Deep Neural Network is called
    DEEP LEARNING. Do I Need to Be an Expert at Math to learn Machine Learning? Short
    Answer: Oh, Hell No! But there’s more to this. Many experts say to focus mostly
    on math. Yes! You need to understand basic concepts of Linear Algebra, Calculus,
    Statistics, Probability, etc. To understand these concepts isn’t hard, believe
    me. But what’s more important is to understand the problem, to use right ML algorithm
    at right problem. It is just like programming. Programming is not about knowing
    syntaxes but it’s about coming up with an efficient algorithm. It is developed
    over time with proper practice. But there’s an exception to my opinion if you
    are trying to create a new Machine Learning Algorithm or writing a research paper. 
    Conclusion: In this chapter, we learnt the difference between AI and ML. We learnt
    about the types of AI and different types of ML algorithms. Don’t worry if you
    didn’t understand. Just stay till the end, I guarantee you will learn. CHAPTER
    2 Introduction to TensorFlow TensorFlow is one of the most popular Machine Learning
    Framework provided by Google. It was developed to ease the process of developing
    ML models. Currently, TensorFlow is in its 2.x version. The previous version i.e.
    1.x was not very flexible and hence not much popular for research. It was mainly
    used for deployment of ML models at a large scale. Now with some major changes,
    it is good for research as well. Now, Let’s discuss a few terms frequently used
    in Machine Learning. And at the end, we will understand the meaning of the name
    TensorFlow. Vectors ![](rsrc234.jpg)Fig 2-1. A line on XY plane Let us consider
    a line segment OA on a XY plane. Generally, vectors are on the XYZ plane but for
    the sake of simplicity, we are using a two-dimensional vector. Let the equation
    of the line OA be 5x + 4y. Then, the magnitude of line OA is given by, ![](rsrc235.jpg)Fig.
    2-2. Magnitudes of a line So, in this way, a two-dimensional line can be divided
    into two components which will result in the equation on adding them. For example,
    if you add 5x and 4y, you’ll get 5x+4y which is the equation. Now, you can represent
    the components of this line as, So, the arrangement of magnitudes of a line in
    a column is a vector. The elements of a vector are called scalar. In OA, 5 and
    4 are the scalars and the shape of OA is 2x1 (pronounced as 2 by 1). ![](rsrc236.jpg)If
    you take a three-dimensional line, you’ll get three components and if you have
    a four-dimensional line, you’ll get four components and so on. Since a Vector
    has only a column and multiple rows, it is one-dimensional . Matrices Previously,
    we learnt about Vectors. In that lesson, we arranged the magnitudes of a single
    line in a column. What if we had to arrange magnitudes of two lines or three lines
    or greater? Matrix comes handy on this. ![](rsrc237.jpg)Fig 2-3. Multiple Lines
    on XY plane We know the magnitudes of the line OA. Similarly, we can calculate
    the magnitudes of line OB. The vector of line OB is, ![](rsrc238.jpg)Now, we can
    represent both of them by, ![](rsrc239.jpg)Where, M is the Matrix. So, We now
    understand that a matrix is nothing but a vector containing more than 1 column.
    Since a Matrix contains multiple rows and columns, It is two-dimensional. Tensors
    Here comes the interesting thing. Just like a computer processes the information
    in the form of Binary Digits, TensorFlow and many other ML libraries process the
    information in the form of Tensors. Then, what is a Tensor? According to the definition
    from TensorFlow Developers, A tensor is a generalization of vectors and matrices
    to potentially higher dimensions. Internally, TensorFlow represents tensors as
    n-dimensional arrays of base datatypes. From the above definition, you might have
    understood something. A tensor can be a scalar or a vector or a matrix. They can
    go up to any dimension. A scalar is a zero-dimensional tensor. A vector is a one-dimensional
    tensor and a matrix is a two-dimensional tensor. Dimensions are also called rank
    in a tensor. ![](rsrc23A.jpg)Fig 2-4. Various Dimensions of Tensor (source: [Click
    Here](https://www.datacamp.com/community/tutorials/investigating-tensors-pytorch)
    ) Installation of TensorFlow I assume that you have already installed python on
    your system. Now, let’s install TensorFlow. Local System: For Local system, you
    can go to Command Prompt and type the following code: ![](rsrc23B.jpg)Fig 2-5
    If you want to use GPU for TensorFlow then: pip3 install tensorflow-gpu Then you
    can go to your IDE and use TensorFlow as: import tensorflow as tf Google Colab
    In this book, we will be using Google Colab, which is an online Interactive notebook.
    So, TensorFlow is already installed in Google Colab, you don’t need to do anything.
    Just write the code. To use Colab: '
