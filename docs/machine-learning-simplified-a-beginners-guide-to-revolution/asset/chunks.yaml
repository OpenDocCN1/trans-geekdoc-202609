    \ result is an optimal model. \n\nFor example, let’s say you are learning cycling.\
    \ Then, every time you fall, you realize that particular step used when you fell\
    \ should not be used again i.e. punishment and every time you cycle without falling,\
    \ you realize you should use that particular steps i.e. reward. After a few days\
    \ of similar repetition, you will learn cycling. This is how reinforcement learning\
    \ works.\n\n## What is Deep Learning?\n\nNeural Network is the network of artificial\
    \ neurons that best tries to mimic the biological neuron. Let's talk about biological\
    \ neurons.\n\n![](rsrc232.jpg)\nFig 1-1. Structure of a neuron (source: [Click\
