    # 第 3 章：线性回归：什么是它？


    ## 引言

    假设你是一个巧克力爱好者，经常去 Frodo 的零售店买巧克力。第 1 天，你买了 6 包 KitKat，他们要求你支付 12 美元。第二天，你买了 9 包，他们要
    18 美元。现在，第三天你只有 14 美元了，你不想问他们 14 美元能买多少巧克力。于是，你尝试在脑海中建立这种关系，并立刻得出结论：`巧克力数量 = 金钱
    / 2`。所以通过计算，你发现你可以买 7 包。当你到达接待处时，他们正好向你要 14 美元。然后，你开心地回家了。


    这就是线性回归。线性回归进入机器学习世界的敲阶石。它是映射输入与输出之间（线性）关系并利用该关系预测输出的过程。线性函数看起来像这样：`Y = mX + c`
    其中 `X` 是输入，`Y` 是输出。使用算法提供的数据，它尝试估计 `m` 和 `c` 的值，这些值将用于找到 `Y`，即输出。


    假设你在图上画了一些点。![](img/rsrc23D.jpg)

    图 3-1. 数据点


    现在，线性回归的作用是尝试拟合一条最适合这些数据点的直线。![](img/rsrc23E.jpg)

    图 3-2. 拟合在数据点上的直线


    为了实现这一点，程序为 `m` 和 `c` 生成随机值。然后，通过输入-输出对来验证 `m` 和 `c`。为了验证，它使用了均方误差。例如，如果你有 `(10,30)`，其中
    10 是 `X`，30 是 `Y`。那么，使用随机生成的 `m` 和 `c` 值输入 10 得到 65（这是一个任意值），但实际输出是 30。因此，误差计算为：![](img/rsrc23F.jpg)

    其中，`N = 示例总数（输入-输出对）`

    `yi = 实际输出`

    `yi^ = 预测输出`


    ## 代码实现

    现在，让我们用代码来实现。首先，我们导入所有必要的库。`sklearn` 中的 `linear_model` 我们将使用的 `LinearRegression`
    类，而 `datasets` 包含一些示例数据集。


    ```python

    from sklearn import datasets, linear_model

    import numpy as np

    from sklearn.metrics import mean_squared_error

    ```


    我们使用 `.load_boston` 方法加载波士顿数据集，将其参数设置为 `true`，这有助于我们把数据集解包为两个变量，即 `Input(data_X)`
    和 `Output(data_Y)`。


    ```python

    data_X, data_Y = datasets.load_boston(return_X_y= True)

    ```


    总共有 13 个输入特征。但为了简单起见，我们将省略 12 个特征。


    ```python

    data_X = data_X[:, np.newaxis, 2]

    ```


    数据集中共有 506 个示例。因此，我们将数据集分为 400 个示例用于训练，106 个示例用于测试。


    ```python

    train_X, test_X = data_X[: 400], data_X[400:]

    train_Y, test_Y = data_Y[: 400], data_Y[400:]

    ```


    现在，我们将 `LinearRegression` 类实例化到 `regressor` 变量中。


    ```python

    regressor = linear_model.LinearRegression()

    ```


    我们使用 `.fit` 方法并通过向提供训练示例来训练模型。


    ```python

    regressor.fit(train_X, train_Y)

    ```


    现在，我们使用训练好的模型预测 `test_X` 中输入的输出。


    ```python

    pred = regressor.predict(test_X)

    ```


    现在，我们通过提供预测输出和实际输出的参数来计算预测的均方误差。


    ```python

    mse = mean_squared_error(test_Y, pred)

    ```


    我们得到了 43.834 的均方误差（这可能会有所变化），显示结果并不准确。这是因为我们只使用了一个特征，它不足以映射输入和输出之间的关系。


    现在，让我们可视化我们的回归器。


    ```python

    import matplotlib.pyplot as plt


    # 训练集上的回归器

    plt.scatter(train_X, train_Y, c= ''red'' )

    plt.plot(train_X, regressor.predict(train_X), c= ''blue'' )

    plt.show()

    ```


    ![](img/rsrc23G.jpg)

    ```python

    plt.scatter(test_X, test_Y, c= ''red'' )

    plt.plot(train_X, regressor.predict(train_X), c= ''blue'' )

    plt.show()

    ```


    ![](img/rsrc23H.jpg)

