    # CHAPTER 7: Convolutional Neural Network (CNN)


    Did you know that we could train our tongue to help us see if we are blind? Yes,
    it’s true. There’s a company called Brainport doing this. But wait, we also did
    something similar in the previous chapter. Simple neural networks are not meant
    for image processing. Even with that, we got good accuracy. But with Convolutional
    Neural Network, we can get even better accuracy, especially with colored images
    as data. So, the variant of neural networks mostly used for image processing is
    `Convolution Neural Network`.


    Now you might question, how does `CNN` provide better results in image processing?
    The simple answer is ‘With the process called Convolution’. `CNN` is a simple
    neural network with a convolution at the beginning. Let’s say you want to recognize
    the face of a person in an image. But there are some items like cars, roads, etc.
    in the background. With a simple Neural Network, it would assign weights to every
    pixel in the image. But, with the help of convolution, the network would assign
    weights to only the face which will significantly increase computational efficiency
    and also increase the accuracy. So, it is used by big techies like Google, Facebook,
    Instagram, etc.


    ![](rsrc24B.jpg)Fig 7-1. Convolutional Neural Network (source: [Click Here](https://adeshpande3.github.io/A-Beginner%27s-Guide-To-Understanding-Convolutional-Neural-Networks/))


    ## Convolution Process


    Let’s say this is an image. ![](rsrc24C.jpg)Now, to extract the useful information
    (features) from this image, element-wise multiplication is performed with it and
    a relatively smaller matrix (usually of size `3x3`). ![](rsrc24D.jpg)That smaller
    matrix is called `kernel` or `filter`. Now, this `kernel` is applied to the image
    matrix to extract features. The resulting matrix after the operation is called
    a `feature map`.


    ![](rsrc24E.jpg)Fig 7-2. Feature Map Extraction (source: [Click Here](https://www.oreilly.com/library/view/learn-unity-ml-agents/9781789138139/16671cc8-0aff-433a-878c-7430be8b9aa1.xhtml))


    The `feature map` is always smaller than the input image. If you want the `feature
    map` to be of the same size as input, then you can add zeroes around the `feature
    map` matrix. This process is called `zero padding`. Check out this image for better
    understanding of convolutions. ![](rsrc24F.jpg)Fig 7-3. Feature map images (source:
    [Click Here](https://www.kdnuggets.com/2016/11/intuitive-explanation-convolutional-neural-networks.html))


    Some of the terms in `CNN` are:

    - **Depth**: It is the number of filters to be applied in the image. We used only
    one filter in the above example. So, its depth is 1. If there are 3 filters used
    then its depth is 3 and so on. Usually, 3 filters are used for a colored image
    as there are 3 matrices.

    - **Stride**: It is the number of pixels jumps in an input matrix per step. If
    `stride` is 1, then the `kernel` moves one pixel forward per step and if it is
    2, then the `kernel` moves 2 pixels forward per step and so on.


    Example of Stride 1 ![](rsrc24G.jpg)

    Example of Stride 2 ![](rsrc24H.jpg)

    Fig 7-4. Strides


    ### Non-Linearity

    After the feature map is extracted, you need to apply non-linearity to the `feature
    map`. The best one for `CNN` is `ReLU`.


    ### Pooling / Subsampling

    We have extracted features and applied non-linearity to it. Now, we must get it
    ready for processing. `Pooling` is a way to reduce the size of feature maps. The
    reduced size means a smaller number of weights which means the model will less
    likely be overfitted and also increased computational efficiency. There are 2
    types of pooling. ![](rsrc24J.jpg)Fig 7-5. Types of pooling(source: [Click Here](https://www.researchgate.net/figure/Illustration-of-Max-Pooling-and-Average-Pooling-Figure-2-above-shows-an-example-of-max_fig2_333593451))


    As you can see, `Max pooling` is a technique to take the pixel with max value
    out of the pool size in a matrix and `Average pooling` is the technique of averaging
    the pixels into one pixel out of the pool size in a matrix. In the figure, the
    pool size is `2x2`, so each color covers `2x2` of the matrix and performs pooling
    operations on them.


    ### Neural Network

    This is the last part in the `CNN`. It is a simple neural network that we learnt
    to build in a previous lesson. So, I am not going to talk about it again here.
    You understand it all.


    ### Quick Recap:

    `CNN` consists of following steps:

    1. Creating a `feature map` from the input image using `kernel/filter`.

    2. Providing Non-linearity to the `feature map` using an activation function (mostly
    `ReLU`).

    3. The Non-linear feature map is then subjected to `pooling` which reduces the
    size of the `feature map`.

    4. The matrix obtained after `pooling` is given to the simple neural network for
    prediction.

