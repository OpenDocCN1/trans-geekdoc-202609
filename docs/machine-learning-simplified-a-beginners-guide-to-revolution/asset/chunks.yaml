    \ algorithms? The simple answer is NON-LINEARITY. Linear Regression can map only\
    \ linear relation but real life data rarely have linear relation and neural networks\
    \ is the best algorithm for most of the cases if provided enough data.\n\n![](rsrc241.jpg)Fig.\
    \ 6-1. Structure of a Neural Network\n\nDon’t get panicked by seeing this figure.\
    \ I will explain every bit of it. From the previous knowledge, you might have\
    \ understood this neural network takes two inputs and gives one output. Each circle\
    \ in the figure is called a node and as you can see in the figure, each node is\
    \ connected with every other node of neighboring layers.\n\nYou might be wondering\
    \ what are those `w1`, `w2`, `w3`, `…. Stuffs. They are weights of the network.\
    \ Simply, each of them are the strength of the relationship between two nodes.\
    \ In the figure, `w1` determines the strength of the relationship between `x1`\
    \ and `h1`. Similarly, `w2` determines that for `x1` and `h2` and so on. For example,\
    \ if `x1` is the amount of rainfall and `h1` is the amount of crops grown, then\
    \ `w1` will be high because these two things are strongly related. Same applies\
    \ to your brain as well. You remember some moments of your life clearly whereas\
    \ you forget most of them. This is because you’ve been thinking about that moment\
    \ and it made the relationship strong. So, you remember those moments. Whereas,\
    \ you don’t think about other moments and gradually the relationship gets weaker\
    \ and will be difficult for you to remember later on. Consider it as the fundamental\
    \ thing that defines what decisions the neural network makes.\n\nNow, what are\
    \ those `b1`, `b2`, `b3`? These are biases. Let’s say you have a factory. You\
    \ get expenses from electricity, raw materials, etc. while your industry is running.\
    \ But there are some fixed expenses that will occur even if you stop production\
    \ for sometime. Those costs include land rent, employee salary, etc. From now\
    \ on, Whenever I use `W` and `B`, `W` represents all the weights of the model\
    \ i.e. `w1`, `w2`, `w3`, `....`, `wn` and `B` represents all the biases of the\
    \ model i.e. `b1`, `b2`, `b3`, ..., `bn`. `B` and `W` changes throughout the training\
    \ process to make the prediction better. So, `B` and `W` are called Parameters\
    \ . Also, consider `B` as the `c` in the linear equation `Y = mX + c`. They are\
    \ constant values which helps a line to deviate from the origin to fit the data\
    \ better. (And of course, `W` is similar to `m` in the linear equation.)\n\nNow,\
    \ let’s see what happens inside each node in a hidden layer (In this case, `h1`,\
    \ `h2` and `h3`).\n\n```\nh1 = x1 * w1 + x2 * w4 + b1\nh2 = x1 * w2 + x2 * w5\
    \ + b2\nh3 = x1 * w3 + x2 * w6 + b3\nŷ = h1 * w7 + h2 * w8 + h3 * w9\n```\n\n\
    As you can see, each input node is multiplied with the respective weight connecting\
    \ it to a specific hidden layer node and added together with the bias. After that,\
    \ those hidden layer nodes are multiplied with the weights connecting them with\
    \ the output layer and added together. (Note: Output Layer doesn’t contain any\
    \ bias. We’ll talk about it later.) By doing this, the data is moving in the forward\
    \ direction i.e. from input node to hidden layer(s) to output layer. So, during\
    \ training the neural network model, this process is called Forward Propagation\
    \ . After it reaches the output layer, an output is generated i.e. `ŷ`. At first,\
    \ `W` and `B` are all randomly generated. So, `ŷ` is also arbitrary.\n\nNow,\
    \ The error/loss in the prediction is calculated by, `Loss = (y - ŷ) ²` For a\
    \ better prediction, This loss has to be minimized to its least. For this, we\
    \ have to change the values of the parameters (`W` and `B`). We do it by the process\
    \ called Backward Propagation .\n\n![](rsrc242.jpg)Fig 6-2. Backward Propagation\
    \ algorithm\n\nThe goal of taking derivatives of `Loss` (`L`) with each respective\
    \ weight is to check how a small change in each weight affects the Loss. Let’s\
    \ take `w8` and see how it is updated.\n\n```\nw8 ” = w8 - η * dL/dw 8\n```\n\n\
    Where, `η` = Learning Rate (LR). They are introduced to prevent a big change in\
    \ weights. Let’s say `dL/dw 8 = 20`. This is a huge number and will change `w\
    \ 8` drastically. So, to minimize this, we can multiply it by some minimal value,\
    \ let’s say 0.01. Then, it would only change the value of `w 8` by 0.2. This is\
    \ the function of Learning Rate. Similarly, every other weights and biases are\
    \ updated. As you can see, the process moves backwards i.e. from output layer\
    \ to hidden layer to input layer. So, this process is called Backward Propagation\
    \ .\n\nNow, before diving into code, let’s learn about a few more things.\n\n\
    ## Activation Function\n\nThere’s one thing I haven’t told you yet. The actual\
    \ non-linearity in the model is given by activation function. Previously, we wrote\
    \ that,\n\n```\nh1 = x1 * w1 + x2 * w4 + b1\nh2 = x1 * w2 + x2 * w5 + b2\nh3 =\
    \ x1 * w3 + x2 * w6 + b3\n```\n\nBut to provide non-linearity, what actually happens,\n\
    \n```\nh1 = f (x1 * w1 + x2 * w4 + b1)\nh2 = f (x1 * w2 + x2 * w5 + b2)\nh3 =\
    \ f (x1 * w3 + x2 * w6 + b3)\n```\n\nWhere, `f(x)` can be any activation function.\
    \ We will discussing about few of major.\n\n### ReLU\nThis is the most commonly\
    \ used Activation Function. For positive inputs, it outputs the same but for negative\
    \ inputs, it outputs zero. For example, if the input is 9, then it outputs 9 but\
    \ if the input is -9, then the output is 0.\n\n![](rsrc243.jpg)Fig 6-3. ReLU (source:\
    \ [https://michielstraat.com/talk/])\n\n### Sigmoid\nIt is also one of the most\
    \ common activation functions. It is mostly used for Logistic prediction. ![](rsrc23K.jpg)Fig\
    \ 6-4. Sigmoid (source: [https://hackaday.io/page/5331-function])\n\nSome of the\
    \ other activation functions are:\n- Hyperbolic Tangent (Tanh) function\n- Softmax\
    \ function\n\n### Loss Function\nThe function used to calculate the error of prediction\
    \ after each forward propagation during training is called loss function. For\
    \ binary classification, Binary Entropy is the most commonly used function whereas\
    \ for regression problems, mean squared error is used. It needs to be minimized\
    \ for the better performance of the model.\n\n### Optimizer\nTo minimize the loss\
    \ in a model, some algorithms must be used. That algorithm is called optimizer.\
    \ There are varieties of optimizer but you must choose the algorithm according\
    \ to the model. The most common one is Stochastic Gradient Descent (SGD). Some\
    \ other optimizers are:\n- Adam\n- AdaGrad\n- Momentum\n\n## Overfitting and Underfitting\n\
    \nConsider a bed like in the fig ![](rsrc244.jpg)Fig 6-5. Real Life example of\
    \ Overfitting You might be the one who sleeps in that pose. So, the bed is made\
    \ focusing just on you. It will not be appropriate for other people. Similarly,\
    \ In a neural network if you over train your model or you’t have enough data,\
    \ then your model is prone to overfitting. Similarly, if the model is way too\
    \ generalized, then is underfitting. They are opposite to each other and the only\
    \ thing common in them is they both are harmful for a model. The best ways to\
    \ prevent it are:\n- Data Augmentation\n- Dropout\n- Choosing proper Network architecture.\n\
    - Using enough data\n- Not training models for more epochs than necessary.\n\n\
    **Dropout**: Dropout is a technique to randomly select a few neurons and ignore\
    \ them while updating the parameters. It ranges from 0 to 1 where 1 means ignoring\
    \ all the neurons. This is an efficient method to prevent overfitting in complex\
    \ model architecture.\n\n**Data Augmentation**: When training a Machine Learning\
    \ model, especially Deep Learning models, We require a lot of data. If there is\
    \ a scarcity of data, then the model is prone to underfitting. Unfortunately,\
    \ scarcity of data is very. So, we have to make use of the handful amount of data\
    \ we have. Also, creating a variation in data helps in preventing overfitting\
    \ as well. In this scenario, using data augmentation, We could increase the number\
    \ of examples of a dataset. We take the provided data and augment it i.e. crop\
    \ the image, rotate it, change colors, flip, etc. Doing this increases the number\
    \ of samples and increase variation and helps us to create a good model. If you\
    \ want know more about Data Augmentation and its coding implementation, you can\
    \ check my blog, which is accepted by TensorFlow official website. Link: https://videhablogs.com/data-augmentation-in-tensorflow/\n\
    \n## Code Implementation\n\nNow, you are ready for the code. Let’s begin. First,\
