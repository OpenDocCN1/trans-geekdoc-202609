  trans: "\n\n# IMDB 评论情感分析\n\n导入所有需要的库。从 `tf.keras.dataset` 导入 `imdb` 数据集并导入文本预处理所需的\
    \ `sequence`。\n\n```python\nimport tensorflow as tf\nfrom tensorflow.keras.datasets\
    \ import imdb\nfrom tensorflow.keras.preprocessing import sequence\n```\n\n###\
    \ 将数据存储在相应的变量中\n\n词汇（单词）的最大数量为 `5000`。目标变量包含 `0s` 和 `1s`，其中 `0` 表示负评，`1` 表示正评。\n\
    \n```python\n(training_text, training_targets), (testing_text, testing_targets)\
    \ = imdb.load_data(num_words=5000)\n```\n\n取数据集中每条文本的前 400 个单词，因为这足够判断句子的情绪了。\n\
    `max_words = 400`\n\n数据集中的文本默认经过分词的（tokenized）。因此，我们需要对数据进行填充（padding）。\n\n```python\n\
    training_text = sequence.pad_sequences(training_text, maxlen=max_words)\ntesting_text\
    \ = sequence.pad_sequences(testing_text, maxlen=max_words)\n```\n\n### 创建模型\n\n\
    现在，让我们创建模型。第一层将嵌入层（embedding layer），`input_dimension` 等于词汇数量，输入长度为 `400`。输出维度为\
    \ `30`。然后将其传递到 `Dense` 密集层，最后生成输出。\n\n```python\nmodel = tf.keras.Sequential([\n\
    \    tf.keras.layers.Embedding(input_dim=5000, output_dim=30, input_legth=max_words),\n\
    \    tf.keras.layers.Flatten(),\n    tf.keras.layers.Dense(256, activation='relu'),\n\
    \    tf.keras.layers.Dense(1, activation='sigmoid')\n])\n```\n\n使用二分类交叉熵损失函数编译模型，因为这是一个二分类任务，并使用\
    \ `Adam` 作为优化器。\n\n```python\nmodel.compile(loss='binary_crossentropy', optimizer='adam',\
    \ metrics=['accuracy'])\n```\n\n查看模型架构。\n```python\nmodel.summary()\n```\n![](img/rsrc24Z.jpg)\n\
    \n### 训练模型\n\n最后，让我们在 `3` 个 epoch 上训练模型。\n\n```python\nhistory = model.fit(training_text,\
    \ training_targets, validation_data=(testing_text, testing_targets), epochs=3,\
    \ batch_size=128)\n```\n\n找到训练准确率为 `0.9841`。\n`test_loss, test_accuracy = model.evaluate(testing_text,\
    \ testing_targets)`\n`print(test_accuracy)`\n找到文本准确率为 `0.854`。\n\n### 测试模型\n\n\
    现在，让我们使用我从网上复制的一个随机 `imdb` 评论来测试模型。将文本存储在列表中。\n\n```python\ntext = [ \"I have\
    \ never seen such an amazing film since I saw The Shawshank Redemption. Shawshank\
    \ encompasses friendships, hardships, hopes, and dreams. And what is so great\
    \ about the movie is that it moves you, it gives you hope. 尽管角色和观众之间的情况非常不同，但你不会觉得与他们所经历的非常遥远。这是一部简单的电影，但它有永恒的信息。Frank\
    \ Darabont 不需要任何华丽的特效来让我们爱上这部电影，旁白和表演已经为他做到了。为什么这部电影没有获得全部七项奥斯卡奖我无法理解，但不要让这影响你不去看这部电影，让它在\
    \ IMDb 前 250 强单中的排名影响你，让你的朋友对这部电影的推荐影响你。今晚留出两个多小时时间租这部电影。你将最终理解大家在说什么，你也将理解为什么这是我一直以来喜欢的电影。\"\
    \ ]\n```\n\n现在，为了预处理文本，导入 `Tokenizer`。\n\n```python\nfrom tensorflow.keras.preprocessing.text\
    \ import Tokenizer\n```\n\n创建一个 `Tokenizer` 实例。\n```python\ntokenizer = Tokenizer()\n\
    ```\n\n使用 `.fit_on_texts` 方法对文本进行分词。\n\n```python\ntokenizer.fit_on_texts(text)\n\
    ```\n\n使用 `.texts_to_sequences` 方法将单词转换为序列。\n\n```python\nseq = tokenizer.texts_to_sequences(text)\n\
    ```\n\n现在对序列进行填充。\n\n```python\nseq = sequence.pad_sequences(seq, maxlen=400,\
    \ padding='post')\n```\n\n准备好进行预测。将序列传递给模型。\n\n```python\npred = model.predict(seq)\n\
    ```\n\n现在，让我们舍入预测并打印。\n\n```python\nround(pred[0][0])\n```\n结果为 `1`，意味着该评论是正面的。\n\
