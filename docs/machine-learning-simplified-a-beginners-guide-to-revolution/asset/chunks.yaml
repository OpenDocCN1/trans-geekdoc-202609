    ```\n\n让我们总结一下我们创建的模型。\n\n```python\nmodel.summary()\n```\n![](img/rsrc24M.jpg)\n\
    \n现在，让我们使用 Adam 优化器和稀疏分类交叉熵（Sparse Categorical Cross Entropy）作为损失函数编译模型。这是分类数据中最常用的损失函数。\n\
    \n```python\nmodel.compile(optimizer='adam', loss='sparse_categorical_crossentropy',\
    \ metrics=['accuracy'])\n```\n\n现在，让我们在 12 个 epoch（epoch）上训练模型。\n\n```python\n\
