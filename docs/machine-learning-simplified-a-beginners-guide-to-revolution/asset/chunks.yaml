    # CHAPTER 3: Linear Regression: What is it?


    ## Introduction

    Let’s say you are a chocolate lover and you always go to Frodo’s Retail Shop to
    buy chocolates. On day 1, you bought 6 packs of KitKat and they asked you to pay
    $12. The next day, you bought 9 packs and they asked you $18. Now, the next day
    you have only $14 and you don’t want to ask them how many chocolates you can buy
    with $14. So, you try to map the relation in your mind and you instantly get this,
    `No. of chocolates = money / 2` So, by calculating you find that you can buy 7
    packs. When you got to the receptionist, they asked you for exactly $14. Then,
    you go home happily.


    This is Linear Regression. Linear Regression is the stepping stone into the world
    of Machine Learning. It is the process of mapping the (linear) relation between
    input and output and using that to predict the output. A linear function looks
    like this, `Y = mX + c` Where `X` is the input and `Y` is the output. Using the
    data the algorithm is provided, it tries to estimate the value of `m` and `c`
    which would be used to find `Y` i.e. Output.


    Let’s say you have plotted some points on the graph. ![](rsrc23D.jpg)

    Fig 3-1. Data points


    Now, what Linear Regression does is try to fit the line that best suits these
    data points. ![](rsrc23E.jpg)

    Fig 3-2. Line fitted on data points


    To do this, the program generates a random value for `m` and `c`. Then, it takes
    input-output pairs to validate `m` and `c`. To validate, it uses mean squared
    error. For example, if you have `(10,30)` where 10 is `X` and 30 is `Y`. Then,
    with the randomly generated value of `m` and `c`, inputting 10 gives us 65 (it
    is an arbitrary value) but the actual output is 30. So, the error is calculated
    by, ![](rsrc23F.jpg)

    Where, `N = total no. of examples (input-output pairs)`

    `yi = actual output`

    `yi^ = predicted output`


    ## Code Implementation

    Now, let''s implement this in code. First, we import all the necessary libraries.
    `linear_model` from `sklearn` contains `LinearRegression` Class which we will
    be using and `datasets` contain some sample datasets.


    ```python

    from sklearn import datasets, linear_model

    import numpy as np

    from sklearn.metrics import mean_squared_error

    ```


    We load the boston dataset with `.load_boston` method and it’s argument set to
    `true` which helps us to unpack the dataset into two variables i.e. `Input(data_X)`
    and `Output(data_Y)`.


    ```python

    data_X, data_Y = datasets.load_boston(return_X_y= True)

    ```


    There are a total of 13 input features. But for the sake of simplicity, we will
    be omitting 12 features.


    ```python

    data_X = data_X[:, np.newaxis, 2]

    ```


    There are 506 examples in the dataset. So, we split the dataset into 400 examples
    for training and 106 for testing.


    ```python

    train_X, test_X = data_X[: 400], data_X[400:]

    train_Y, test_Y = data_Y[: 400], data_Y[400:]

    ```


    Now, we instantiate the `LinearRegression` class into the `regressor` variable.


    ```python

    regressor = linear_model.LinearRegression()

    ```


    We train the model with the `.fit` method and by giving training examples to it.


    ```python

    regressor.fit(train_X, train_Y)

    ```


    Now, we use our trained model to predict the output of the inputs in `test_X`.


    ```python

    pred = regressor.predict(test_X)

    ```


    Now, we calculate the Mean Squared Error of the prediction by giving the arguments
    of predicted outputs and actual outputs.


    ```python

    mse = mean_squared_error(test_Y, pred)

    ```


    We get the Mean Squared Error of 43.834 (This might vary) which shows the result
    is not very accurate. This is because we used only one feature and it was not
    enough to map a relationship among input and output.


    Now let’s visualize our regressor.


    ```python

    import matplotlib.pyplot as plt


    # Regressor on training set

    plt.scatter(train_X, train_Y, c= ''red'' )

    plt.plot(train_X, regressor.predict(train_X), c= ''blue'' )

    plt.show()

    ```


    ![](rsrc23G.jpg)

    ```python

    plt.scatter(test_X, test_Y, c= ''red'' )

    plt.plot(train_X, regressor.predict(train_X), c= ''blue'' )

    plt.show()

    ```


    ![](rsrc23H.jpg)

    The colab notebook for the code can be found [here](https://bit.ly/3c8nIn9) .


    ### Advantages

    - Easy to understand

    - Uses less computational power

    - Doesn’t require much data


    ### Disadvantages

    - It cannot map the non-linear relationship

