    # Conclusion

    In this chapter, we learnt about the mechanism of Logistic Regression and implemented
    it in code. We also discussed about confusion matrix and different metrics to
    evaluate performance of the model. Next, we will be learning about another classifier
    algorithm.


    # CHAPTER 5: K-Nearest Neighbors (KNN)


    ## Introduction

    “You are the average of 5 people you spend the most time with.” – Jim Rohn


    This statement by one of the most popular American Entrepreneur, Jim Rohn, comes
    very close to the concept of K-Nearest Neighbors. It is a classification algorithm
    just like Logistic Regression. This is better than Logistic Regression because
    it introduces non-linearity in the boundary instead of just using a straight line.


    ## Steps in KNN Algorithm

    1. Plot the given training labeled data. The below image has 2 class i.e. Red
    and Green. There is no training process in KNN. The calculations are done in real-time.

    ![](rsrc23X.jpg)

    Fig 5-1. Labeled Data plotted (source: [Click Here](https://www.kdnuggets.com/2017/09/rapidminer-k-nearest-neighbors-laziest-machine-learning-technique.html)
    )


    2. Now, introduce the input that you want to predict. Then, the machine looks
    at `K` (any integer number) nearest datapoints. The category with highest datapoints
    is assigned as the class of the new input.

    ![](rsrc23Y.jpg)

    Fig 5-2. New data point (source: [Click Here](http://brokerstir.com/knn-classifier-algorithm/)
    )


    If we take `K = 5` in the above figure, Just by our guess, 3 will belong to the
    red category and 2 will belong to green category. So, the new data belongs to
    red category. Remember to use `K` as an odd number because you might get equal
    number of data points from each category if you use even number. The distance
    between datapoints can be calculated by many ways but the common one is Euclidean
    method. By finding distance, the machine can know which data points are nearest.
    That’s it for theory. Now, let’s implement this in code.


    ## Code Implementation

    Import the required modules. We will use iris dataset which has 3 output classes.

    ```python

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.datasets import load_iris

    ```

    load the dataset in `X` and `y` variables.

    ```python

    X, y = load_iris(return_X_y= True )

    ```

    Split the dataset into training and test set. We use `test_size=0.25` which means
    25% of data will be a test set.

    ```python

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size =0.25 , random_state
    =0 )

    ```

    Now, let’s import `StandardScaler` class to scale our data down so that it becomes
    computationally efficient. The `.fit_transform` method will scale down our data.

    ```python

    from sklearn.preprocessing import StandardScaler

    sc = StandardScaler()

    X_train = sc.fit_transform(X_train)

    X_test = sc.transform(X_test)

    ```

    Create an instance of `KNeighborsClassifier` class. We will choose `n_neighbors`
    i.e. `k = 5` and train the model.

    ```python

    classifier = KNeighborsClassifier(n_neighbors= 5 )

    classifier.fit(X_train, y_train)

    ```

    let’s predict the output of test set.

    ```python

    y_pred = classifier.predict(X_test)

    ```

    Now, let’s evaluate the performance of the model.

    ```python

    from sklearn.metrics import confusion_matrix

    from sklearn.metrics import classification_report

    print (confusion_matrix(y_test, y_pred))

    ```

    ![](rsrc23Z.jpg)

    Since we have 3 classes, so we get a confusion matrix of size 3x3 instead of 2x2.

    ```python

    print (classification_report(y_test, y_pred))

    ```

    ![](rsrc240.jpg)


    ## Advantages

    - Since it can map non-linear data, its performance is better than Logistic Regression.

    - Simple to understand

    - No training required


    ## Disadvantages

    - Slow Algorithm

    - Harder to predict when there are more dimensions of features

    - It is highly sensitive to outliers (exceptional data that belongs to a certain
    class but doesn’t contain much of its features)

