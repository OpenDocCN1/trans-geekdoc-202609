    As the real-world data are mostly in non-linear form, this algorithm is rarely
    used. There is a modified version of `Linear Regression` called `Polynomial Regression`.
    It is out of scope of our book but you can check this beautiful article: [https://videhablogs.com/polynomial-regression-on-tensorflow-2-0/](https://videhablogs.com/polynomial-regression-on-tensorflow-2-0/)


    ## Conclusion

    In this chapter, we learnt about the concept of `Linear Regression` with some
    real-life examples. Then, we touched the surface of Mathematics. After that, we
    implemented the code with explanation. I hope you understood the chapter. If not,
    you can repeat the chapter. If you are ready, Let’s move on to the next step.


    # CHAPTER 4 Logistic Regression


    ## Introduction

    Don’t let the name fool you. It is not a Regression algorithm. It doesn’t predict
    continuous (numerical) values but it predicts CATEGORICAL values like dog/cat
    classifier like this: ![](rsrc23J.jpg)Fig 4-1. Logistic Regression (source: [Click
    Here](https://blog.goodaudience.com/machine-learning-using-logistic-regression-in-python-with-code-ab3c7f5f3bed?gi=cd0934386999)
    ) So, Basically It creates a boundary for categories. The data outside that boundary
    would be one category and inside would be another. Everything in the working mechanism
    is almost similar to `Linear Regression` with a few tweaks.


    Let’s say for this example, you have more that 1 input variable(`X`). So, the
    equation will be: `Z = m1 X1 + m2 X2 + m3 X3 +...+ mn Xn + c` Where `X1`, `X2`,
    `X3` …. are input variables and `m1`, `m2`, `m3` ­ …. are the slopes and `c` is
    the intercept and `Z` is the output variable.


    We used to do up to this and it used to be our output in `Linear Regression` but
    in `Logistic Regression`, there is one more step. The value of `Z` is passed to
    a logistic function.


    `P(Y=1) = 1 / (1+ e\-Z )` This function converts any given numerical value into
    categorical value i.e. 0 or 1. So, here it returns the probability of our output
    being 1. This function can be visualized as: ![](rsrc23K.jpg)This function is
    commonly called `Sigmoid Function`.


    ## Code Implementation

    Import the required libraries. We will create a breast cancer classifier. It has
    30 input variables and outputs either 0 or 1.


    ```python

    from sklearn.datasets import load_breast_cancer

    from sklearn.linear_model import LogisticRegression

    ```


    load the dataset in `X` and `y` variables.


    ```python

    X, y = load_breast_cancer(return_X_y= True )

    ```


    Split the dataset into training and test set. We use `test_size=0.25` which means
    25% of data will be a test set.


    ```python

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.25, random_state
    = 0 )

    ```


    Now we import `StandardScaler` to scale our data so that it becomes computationally
    efficient.


    ```python

    from sklearn.preprocessing import StandardScaler

    scaler = StandardScaler()

    X_train = scaler.fit_transform(X_train)

    ```


    Create an instance of `LogisticRegression`.


    ```python

    classifier = LogisticRegression(random_state= 0 )

    ```


    train your model.


    ```python

    classifier.fit(X_train, y_train)

    ```


    predict the data from the model.


    ```python

    y_pred = classifier.predict(X_test)

    ```


    ## Confusion Matrix

    After you’ve trained a model, you need check its performance. There are many metrics
    to do it but the best and the most popular is `confusion matrix`. It is used to
    check the performance of a classification model. It is a matrix in the form of:
    ![](rsrc23N.jpg)Fig 4-2. Confusion Matrix (source: [Click Here](https://towardsdatascience.com/understanding-confusion-matrix-a9ad2d6)
    )


    Terms used:

    - `True Positive (TP)`: The number of examples where both Actual Value and Predicted
    value are positive.

    - `True Negative (TN)`: The number of examples where both Actual Value and Predicted
    value are negative.

    - `False Positive (FP)`: The number of examples where Actual Value is Negative
    but predicted value is Positive.

    - `False Negative (FN)`: The number of examples where Actual Value is Positive
    but predicted value is negative.


    Let’s see one random meme to understand this: ![](rsrc23P.jpg)From these values,
    you can calculate different values like precision, recall, etc. to check the performance
    of your model.


    - `Recall`: ![](rsrc23R.jpg)This value is for each category. High `Recall` means
    the category is predicted correctly. It gives us an idea about when an example
    is positive, how often does the model predicts positive.

    - `Precision`: ![](rsrc23S.jpg)This value is for each category. High `Precision`
    means the positive example is predicted to be positive. It gives us an idea about
    when the model predicts positive, how often is it correct.

    - `F1 Score`: ![](rsrc23T.jpg)It is a combined representational score of both
    `Recall` and `Precision`.

    - `Accuracy`: ![](rsrc23U.jpg)Before this, you might have thought good accuracy
    means better performance. It’s not true. Let’s say you have a dataset containing
    90% of class A and 10% of class B. Then, if you predict every example to be of
    class A, then you have an accuracy of 90%. But is it really accurate? Accuracy
    works in an ideal condition where all the classes have equal number of data.


    Let’s see the confusion matrix of the model we trained before: Import required
    modules.


    ```python

    from sklearn.metrics import confusion_matrix

    from sklearn.metrics import classification_report

    ```


    print the confusion matrix.


    ```python

    print (confusion_matrix(y_test, y_pred))

    ```

    ![](rsrc23V.jpg)


    Print the classification report which gives all the metrics of prediction for
    this model.


    ```python

    print (classification_report(y_test, y_pred))

    ```

    ![](rsrc23W.jpg)


