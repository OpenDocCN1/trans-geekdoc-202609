    ![](rsrc231.jpg)


    ![](rsrc231.jpg)


    Why I wrote this Book? Few years back, I started to learn Machine Learning in
    the traditional way. First, I went through the Mathematics, and then I understood
    the algorithms mathematically. After that, understood the application of each
    algorithm. Finally, I went to the code. This is a good approach. No doubt. But
    then I thought why can’t we do this the other way around? It would be easier for
    starters to keep them motivated and interested. Why is very little people supporting
    this? So, I came up with this approach and wrote a book on this. Why should you
    read this book? Are you uncomfortable with the puzzling Mathematics used in Machine
    Learning algorithms? Do you want to learn the algorithms in an easy way? Do you
    apply the ML algorithms as soon as possible and see it in action? If your answer
    is Yes to any of these questions, then this book is absolutely for YOU. But if
    you are here to learn about the advanced Mathematics or want to write a research
    paper after finishing this book, then you are going to be disappointed. This book
    focuses on introducing ML algorithms, their applications, pros and cons and finally
    implement that in code. It acts as a guide to help you get started in the world
    of machine learning. So, Good Luck and Happy Coding! Contents [Why I wrote this
    Book?](#part0001.xhtml) [Why should you read this book?](#part0001.xhtml#a20H)
