  \n# 第 3 章：线性回归：什么是它？\n\n## 引言\n假设你是一个巧克力爱好者，经常去 Frodo 的零售店买巧克力。第 1 天，你买了 6 包 KitKat，他们要求你支付\
  \ 12 美元。第二天，你买了 9 包，他们要 18 美元。现在，第三天你只有 14 美元了，你不想问他们 14 美元能买多少巧克力。于是，你尝试在脑海中建立这种关系，并立刻得出结论：`巧克力数量\
  \ = 金钱 / 2`。所以通过计算，你发现你可以买 7 包。当你到达接待处时，他们正好向你要 14 美元。然后，你开心地回家了。\n\n这就是线性回归。线性回归进入机器学习世界的敲阶石。它是映射输入与输出之间（线性）关系并利用该关系预测输出的过程。线性函数看起来像这样：`Y\
  \ = mX + c` 其中 `X` 是输入，`Y` 是输出。使用算法提供的数据，它尝试估计 `m` 和 `c` 的值，这些值将用于找到 `Y`，即输出。\n\n\
  \n\n为了实现这一点，程序为 `m` 和 `c` 生成随机值。然后，通过输入-输出对来验证 `m` 和 `c`。为了验证，它使用了均方误差。例如，如果你有 `(10,30)`，其中\
  \ 10 是 `X`，30 是 `Y`。那么，使用随机生成的 `m` 和 `c` 值输入 10 得到 65（这是一个任意值），但实际输出是 30。因此，误差计算为：![](img/rsrc23F.jpg)\n\
  其中，`N = 示例总数（输入-输出对）`\n`yi = 实际输出`\n`yi^ = 预测输出`\n\n## 代码实现\n现在，让我们用代码来实现。首先，我们导入所有必要的库。`sklearn`\
  \ 中的 `linear_model` 我们将使用的 `LinearRegression` 类，而 `datasets` 包含一些示例数据集。\n\n```python\n\
  from sklearn import datasets, linear_model\nimport numpy as np\nfrom sklearn.metrics\
  \ import mean_squared_error\n```\n\n我们使用 `.load_boston` 方法加载波士顿数据集，将其参数设置为 `true`，这有助于我们把数据集解包为两个变量，即\
  \ `Input(data_X)` 和 `Output(data_Y)`。\n\n```python\ndata_X, data_Y = datasets.load_boston(return_X_y=\
  \ True)\n```\n\n总共有 13 个输入特征。但为了简单起见，我们将省略 12 个特征。\n\n```python\ndata_X = data_X[:,\
  \ np.newaxis, 2]\n```\n\n数据集中共有 506 个示例。因此，我们将数据集分为 400 个示例用于训练，106 个示例用于测试。\n\n\
  ```python\ntrain_X, test_X = data_X[: 400], data_X[400:]\ntrain_Y, test_Y = data_Y[:\
  \ 400], data_Y[400:]\n```\n\n现在，我们将 `LinearRegression` 类实例化到 `regressor` 变量中。\n\n\
  ```python\nregressor = linear_model.LinearRegression()\n```\n\n我们使用 `.fit` 方法并通过向提供训练示例来训练模型。\n\
  \n```python\nregressor.fit(train_X, train_Y)\n```\n\n现在，我们使用训练好的模型预测 `test_X` 中输入的输出。\n\
  \n```python\npred = regressor.predict(test_X)\n```\n\n现在，我们通过提供预测输出和实际输出的参数来计算预测的均方误差。\n\
  \n```python\nmse = mean_squared_error(test_Y, pred)\n```\n\n我们得到了 43.834 的均方误差（这可能会有所变化），显示结果并不准确。这是因为我们只使用了一个特征，它不足以映射输入和输出之间的关系。\n\
  \n现在，让我们可视化我们的回归器。\n\n```python\nimport matplotlib.pyplot as plt\n\n## 训练集上的回归器\n\
  plt.scatter(train_X, train_Y, c= 'red' )\nplt.plot(train_X, regressor.predict(train_X),\
  \ c= 'blue' )\nplt.show()\n```\n\n```python\nplt.scatter(test_X, test_Y, c= 'red'\
  \ )\nplt.plot(train_X, regressor.predict(train_X), c= 'blue' )\nplt.show()\n```\n\
  \n代码的 colab 笔记本可以在[这里](https://bit.ly/3c8nIn9) 找到。\n\n## 优点\n- 易于理解\n- 计算量较少\n-\
  \ 不需要大量数据\n\n### 缺点\n- 它无法映射非线性关系\n\n\n\n\n由于真实世界中的数据大多是非线性形式，这种算法很少被使用。`Linear\
  \ Regression`（线性回归）有一个改进版本称为 `Polynomial Regression`（多项回归）。它超出了本书的范围，但你可以查看这篇文章：[`videhablogs.com/polynomial-regression-on-tensorflow-2-0/`](https://videhablogs.com/polynomial-regression-on-tensorflow-2-0/)\n\
  \n## 结论\n在本章中，我们通过一些真实生活的示例学习了 `Linear Regression` 的概念。然后，我们接触了数学的门槛。之后，我们实现了代码并进行了解释。我希望你已经理解了这一章。如果没有，你可以重读一遍。如果你准备好了，让我们进入下一步。\n\
  \n# 第 4 章 逻辑回归\n\n## 引言\n不要被这个名字误导了。它并不是一种回归算法。它不预测连续（数值）值，而是预测类别（CATEGORICAL）值，例如像这样的狗/猫分类器：![](img/rsrc23J.jpg)图\
  \ 4-1 逻辑回归（来源：[点击此处](https://blog.goodaudience.com/machine-learning-using-logistic-regression-in-python-with-code-ab3c7f5f3bed?gi=cd0934386999)\
  \ ) 基本上，它为类别创建了一个边界。边界之外的数据为一个类别，内部的另一个类别。工作机制几乎与 `Linear Regression` 相似，只有一些微调。\n\
  \n假设在这个例子中，你有超过 1 个输入变量(`X`)。那么方程将是：`Z = m1 X1 + m2 X2 + m3 X3 +...+ mn Xn + c`\
  \ 其中 `X1`, `X2`, `X3` …… 是输入变量，`m1`, `m2`, `m3` …… 是斜率，`c` 是截距，`Z` 是输出变量。\n\n我们在\
  \ `Linear Regression` 中通常只到这里，这就是我们的输出，但在 `Logistic Regression` 中，多了一步。`Z` 的值被传递给逻辑函数。\n\
  \n`P(Y=1) = 1 / (1+ e\\-Z )` 该函数将任何给定的数值转换为类别值，即 0 或 1。因此，这里它返回我们的输出为 1 的概率。该函数可以可视化为：![](img/rsrc23K.jpg)这个函数通常被称为\
  \ `Sigmoid Function`（Sigmoid 函数）。\n\n## 代码实现\n导入所需的库。我们将创建一个乳腺癌分类器。它有 30 个输入变量并输出\
  \ 0 或 1。\n\n```python\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.linear_model\
  \ import LogisticRegression\n```\n\n将数据集加载到 `X` 和 `y` 变量。\n\n```python\nX, y = load_breast_cancer(return_X_y=\
  \ True )\n```\n\n将数据集分为训练集和测试集。我们使用 `test_size=0.25`，这意味着 25% 的数据将作为测试集。\n\n```python\n\
  from sklearn.model_selection import train_test_split\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y, test_size = 0.25, random_state = 0 )\n```\n\n\
  现在我们导入 `StandardScaler` 对数据进行标准化，以便提高计算效率。\n\n```python\nfrom sklearn.preprocessing\
  \ import StandardScaler\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)\n\
  ```\n\n创建一个 `LogisticRegression` 实例。\n\n```python\nclassifier = LogisticRegression(random_state=\
  \ 0 )\n```\n\n训练你的模型。\n\n```python\nclassifier.fit(X_train, y_train)\n```\n\n从模型预测数据。\n\
  \n```python\ny_pred = classifier.predict(X_test)\n```\n\n## 混淆矩阵\n在训练完模型后，你需要检查它的性能。有很多指标可以做到，但最好且最流行的是\
  \ `confusion matrix`（混淆矩阵）。它用于检查分类模型的性能。它的形式如下矩阵：![](img/rsrc23N.jpg)图 4-2 混淆矩阵（来源：[点击此处](https://towardsdatascience.com/understanding-confusion-matrix-a9ad2d6)\
  \ )\n\n使用的术语：\n- `True Positive (TP)` (真阳性)：实际值和预测值均为正的样本数量。\n- `True Negative (TN)`\
  \ (真阴性)：实际值和预测值均为负的样本数量。\n- `False Positive (FP)` (假阳性)：实际值为负，但预测值为正的样本数量。\n- `False\
  \ Negative (FN)` (假阴性)：实际值为正，但预测值为负的样本数量。\n\n让我们看一个随机梗图来理解这个：![](img/rsrc23P.jpg)通过这些值，你可以计算精确率（precision）、召回率（recall）等不同的值来检查模型的性能。\n\
  \n- `Recall` (召回率)：![](img/rsrc23R.jpg)该值针对每个类别。高 `Recall` 意味着该类别被正确预测。它告诉我们当样本为正时，模型预测为正的频率有多高。\n\
  - `Precision` (精确率)：![](img/rsrc23S.jpg)该值针对每个类别。高 `Precision` 意味着正样本被预测为正的概率。它告诉我们当模型预测为正时，正确的概率有多大。\n\
  - `F1 Score` (F1 分)：![](img/rsrc23T.jpg)它是 `Recall` 和 `Precision` 的综合得分。\n- `Accuracy`\
  \ (准确率)：![](img/rsrc23U.jpg)在此之前，你可能认为高准确率意味着更好的性能。事实并非如此。假设你有一个包含 90% A 类和 10%\
  \ B 类数据的数据集。那么，如果你预测每个样本都是 A 类，那么你的准确率就是 90%。但这真的准确吗？准确率在所有类别数据量相等的理想情况下才有效。\n\n\
  让我们看看之前训练的模型的混淆矩阵：导入所需的模块。\n\n```python\nfrom sklearn.metrics import confusion_matrix\n\
  from sklearn.metrics import classification_report\n```\n\n打印混淆矩阵。\n\n```python\n\
  print (confusion_matrix(y_test, y_pred))\n```\n\n打印分类报告，它提供了该模型的所有预测指标。\n\n```python\n\
  print (classification_report(y_test, y_pred))\n```\n\nColab 笔记本：[点击此处](https://colab.research.google.com/drive/1V8EO8lL-NgY4PGNW3M98DtOR8-ROp)\n\
  \n\n\n\n\n## 结论\n在本章中，我们学习了逻辑回归（Logistic Regression）的机制并在代码中实现了它。我们还讨论了混淆矩阵以及评估模型性能的不同指标。接下来的，我们将学习另一种分类算法。\n\
  \n# 第 5 章：K 近邻算法 (KNN)\n\n## 引言\n“你是你相处时间最长的 5 个人的平均值。” – 吉姆·罗恩（Jim Rohn）\n\n这句来自美国著名企业家吉姆·罗恩的话非常接近\
  \ K 近邻的概念。它是一种与逻辑回归类似的分类算法。它比逻辑回归更好，因为它在边界中引入了非线性，而不是仅仅使用直线。\n\n## KNN 算法的步骤\n1.\
  \ 绘制给定的训练标记数据。下图有 2 个类，即红色和绿色。KNN 没有训练过程，计算是实时完成的。\n图 5-1 绘制的标记数据（来源：[点击此处](https://www.kdnuggets.com/2017/09/rapidminer-k-nearest-neighbors-laziest-machine-learning-technique.html)\
  \ ）\n\n2. 现在，引入你想要预测的输入。然后，机器会查看 `K`（任意整数）最近的数据点。拥有最多数据点的类别被分配为新输入的类。\n图 5-2 新数据点（来源：[点击此处](http://brokerstir.com/knn-classifier-algorithm/)\
  \ ）\n\n如果我们在上面的图中取 `K = 5`，根据我们的推测，3 个将属于红色类别，2 个属于绿色类别。因此，新数据属于红色类别。请记住将 `K` 设置为奇数，因为如果你使用偶数，可能会从每个类别中获得相同数量的数据点。数据点之间的距离可以通过许多方法计算，但常用的是欧几里得法。通过寻找距离，机器可以知道哪些数据点是最近的。理论部分就此此。现在，让我们在代码中实现它。\n\
  \n## 代码实现\n导入所需的模块。我们将使用具有 3 个输出类的鸢花数据集。\n```python\nfrom sklearn.neighbors import\
