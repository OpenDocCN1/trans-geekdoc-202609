  \ label='Training accuracy')\n        plt.plot(epochs, accuracy_val, 'y', label='validation\
  \ accuracy')\n        plt.title('Training and Validation Results')\n        plt.xlabel('Epochs')\n\
  \        plt.ylabel('Accuracy')\n    else:\n        plt.plot(epochs, loss_train,\
  \ 'g', label='Training loss')\n        plt.plot(epochs, loss_val, 'b', label='validation\
  \ loss')\n        plt.title('Training and Validation Results')\n        plt.xlabel('Epochs')\n\
  \        plt.ylabel('Loss')\n    plt.legend()\n    plt.show()\n```\n\n`visualize(is_acc=True)`\n\
  ![](img/rsrc24N.jpg)\n`visualize(is_acc=False)`\n![](img/rsrc24P.jpg)\n\n结论：所以，通过这种方式我们学习了\
  \ CNN 的架构、应用以及它们的工作原理。之后，我们实现了 CNN 来创建一个 CIFAR10 图像分类器。我可以保证，如果你不使用 CNN 创建相同的模型，你会看到准确率大幅下降。所以，这就是关于\
  \ CNN 的所有内容。在下一章中，我们将学习机器学习中的一项重要技术。希望你到目前得愉快。\n\n# 第 8 章：迁移学习\n\n假设有两个朋友：`John`\
  \ 和 `Kim`。`John` 是一个棒球运动员，但 `Kim` 不是。有一天，他们面临挑战要学习板球（Cricket）。你认为谁更有机会赢？当然，`John`\
  \ 有运动方面的经验。此外，棒球和板球有些相似，所以 `John` 可以在很短的时间内学会。但另一方面，`Kim` 必须从零学习，这对他来说是全新的。关于大脑，由于经验，可以帮助你更快、更高效地学习新技能。这就是迁移学习的核心思想。根据\
  \ Ian Goodfellow、Aaron Courville 和 Yoshua Bengio 的深度学习，迁移学习的定义是“利用在一个任务中学到的知识来提高另一个任务性能的方法”。\n\
  \n图 8-1 传统机器学习 VS 迁移学习（来源：[点击此处](https://example.com/book/big_data/978178896212/introduction-to-learning））\n\
  \n让我们看看实际上是如何做的。假设你想创建一个狗猫分类器，并且有一个名为 `ImageNet` 的数据集，其中包含 400 万张图像。在 `ImageNet`\
  \ 上训练的模型是可用的。现在你可以做的是下载那个 `ImageNet` 预训练模型并移除输出层。你可以在预训练模型之上添加你自己的输出层。现在你可以训练模型。但记住这些点：\n\
  \n- 你必须根据预训练模型的架构调整你的输入。例如，如果你使用 `ImageNet`，你必须将输入图像调整大小为 224 像素。\n- 你需要冻结部分或大部分隐藏层的参数。\n\
  \n没懂？没问题。我们将使用 `ResNet` 预训练模型创建一个犬种分类器。\n\n代码实现：导入所有可能的库。`tfds` 用于数据集，`tensorflow_hub`\
  \ 用于下载预训练模型。\n\n```python\nimport tensorflow as tf\nimport tensorflow_datasets as\
  \ tfds\nimport tensorflow_hub as hub\n```\n\n导入 `stanford_dogs` 数据集，它包含 120 类狗。\n\
  \n```python\ndataset, info = tfds.load('stanford_dogs', as_supervised=True, with_info=True)\n\
  ```\n\n划分训练集和测试集。\n\n```python\ntrain_dataset, test_dataset = dataset['train'],\
  \ dataset['test']\nnum_train = info.splits['train'].num_examples\nnum_test = info.splits['test'].num_examples\n\
  ```\n\n归一化并批处理数据。我们将图像调整大小为 224x224，因为我们将使用需要 224x224 图像输入的 ResNet 预训练模型。\n\n```python\n\
  def normalize(image, labels):\n    image = tf.image.resize(image, (224, 224)) /\
  \ 255.0\n    return image, labels\n\nBATCH_SIZE = 64\n# 在训练、测试和验证集上洗牌并实现 normalize\
  \ 函数\ntrain_batches = train_dataset.shuffle(num_train // 4).map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
  validation_batches = test_dataset.map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
  ```\n\n你可以去 TensorFlow 网站找到你喜欢的预训练模型。你可以复制链接并使用 `KerasLayer` 方法下载它。\n\n```python\n\
  ## 下载预训练模型\nfeature_extractor = hub.KerasLayer(\n    \"https://tfhub.dev/google/imagenet/resnet_v2_50/feature_vector/4\"\
  ,\n    input_shape=(224, 224, 3)\n)\n```\n\n我们下载的预训练模型不包含任何输出层。所以我们不需要移除它。我们可以在预训练模型顶部添加我们自己的输出层。\n\
  \n```python\nmodel = tf.keras.Sequential([\n    feature_extractor,\n    tf.keras.layers.Dense(120,\
  \ activation='softmax')\n])\n```\n\n`model.summary()`\n\n你可以看到，输出层的参数是可训练的，其他的是不可训练的。\n\
  \n```python\n## 编译并训练模型\nmodel.compile(optimizer='adam', loss='sparse_categorical_crossentropy',\
  \ metrics=['accuracy'])\nEPOCHS = 5\nhistory = model.fit(train_batches, epochs=EPOCHS,\
