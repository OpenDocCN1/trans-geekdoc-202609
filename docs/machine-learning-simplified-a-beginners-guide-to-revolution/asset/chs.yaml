  ```\n创建 `KNeighborsClassifier` 类的实例。我们将选择 `n_neighbors` 即 `k = 5` 并训练模型。\n```python\n\
  classifier = KNeighborsClassifier(n_neighbors= 5 )\nclassifier.fit(X_train, y_train)\n\
