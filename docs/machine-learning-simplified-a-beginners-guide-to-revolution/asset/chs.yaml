  \n# 第 7 章：卷积神经网络 (CNN)\n\n你知道吗，我们可以训练舌头来帮助我们检查自己是否盲盲？是的，这是真的。有一家名为 Brainport 的公司正在做这件事。但等一下，我们在上一章中也做过类似的事情。简单神经网络并不是为了图像处理设计的。尽管如此，我们还是得到了良好的准确率。但通过卷积神经网络，我们可以获得更高的准确率，特别是使用彩色图像作为数据时。因此，主要用于图像处理的神经网络变体是\
  \ `Convolution Neural Network`。\n\n现在你可能会问，`CNN` 如何在图像处理中提供更好的结果呢？简单的答案是“通过称为卷积的过程”。`CNN`\
  \ 是一个在开头带有卷积的简单神经网络。假设你想识别图像中某人的脸，但背景中还有汽车、道路等物品。如果使用简单神经网络，它会给图像中的每个像素分配权重。但在卷积的帮助下，网络将对脸分配权重，这将显著提高计算效率并提高准确率。因此，它被\
  \ Google、Facebook、Instagram 等科技巨头使用。\n\n\n## 卷积过程\n\n假设这是一张图像![](img/rsrc24C.jpg)现在，为了从这张图像中提取有用信息（特征），需要将其与一个相对较小的矩阵（通常大小为\
  \ `3x3`）进行逐元素乘![](img/rsrc24D.jpg)那个较小的矩阵被称为 `kernel` 或 `filter`。现在，将此 `kernel`\
  \ 应用于图像矩阵以提取特征。操作后的矩阵被称为 `feature map`。\n\n\n`feature map` 总是比输入图像小。如果你想让 `feature\
  \ map` 的大小与输入相同，可以在 `feature map` 矩阵周围添加零。这个过程被称为 `zero padding`（零填充）。查看这张图片以帮助更好地理解卷积![](img/rsrc24F.jpg)图\
  \ 7-3. 特征图图像（来源:[点击此处](https://www.kdnuggets.com/2016/11/intuitive-explanation-convolutional-neural-networks.html））\n\
  \n`CNN` 中的一些术语是：\n-   **深度 (Depth)**：它是应用于图像的过滤器数量。在上面的示例中我们使用了一个过滤器。所以它的深度为 1。如果使用\
  \ 3 个过滤器，则深度为 3，依此类推。通常彩色图像使用 3 个过滤器，因为有 3 个矩阵。\n-   **步长 (Stride)**：它是输入矩阵中每一步跳过的像素数。如果\
  \ `stride` 为 1，则 `kernel` 每步向前移动一个像素；如果是 2，则 `kernel` 每步向前移动两个像素，依此类推。\n\n图 7-4.步长\n\
  \n### 非线性\n提取特征图后，你需要对 `feature map` 应用非线性。对于 `CNN` 来说，最好的是 `ReLU`。\n\n### 池化 /\
  \ 下采样 (Pooling / Subsampling)\n我们已经提取了特征并对其应用了非线性。现在，我们必须将其准备好进行处理。`Pooling` 是一种缩小特征图尺寸的方法。尺寸减小意味着权重更少，这意味着模型过拟合的可能性较低，并且增加了计算效率。池化有\
  \ 2 类型![](img/rsrc24J.jpg)图 7-5. 池化的类型（来源:[点击此处](https://www.researchgate.net/figure/Illustration-of-Max-Pooling-and-Average-Pooling-Figure-2-above-shows-an-example-of-max_fig2_333593451））\n\
  \n正如你看到的，`Max pooling`（最大池化）是从矩阵的池大小中提取最大值像素的技术，而 `Average pooling`（平均池化）是将矩阵池大小内的像素平均化为一个像素的技术。在图中，池的大小为\
  \ `2x2`，因此每个颜色覆盖矩阵的 `2x2` 部分，并对其进行池化操作。\n\n### 神经网络\n这是 `CNN` 的最后部分。它是我们在之前的课程中学习如何构建的简单神经网络。所以，我在这里不再谈论它。你已经都理解了。\n\
  \n## 快速回顾：\n`CNN` 包含以下步骤：\n1. 使用 `kernel/filter` 从输入图像创建 `feature map`。\n2. 使用激活函数（通常是\
  \ `ReLU`）为 `feature map` 提供非线性。\n3. 随后对非线性特征图进行 `pooling` 处理，以缩小 `feature map` 的尺寸。\n\
  4. 将 `pooling` 后得到的矩阵交给简单神经网络进行预测。\n\n\n\n\n\n## 代码实现\n\n理论部分就介绍到这里。现在，让我们直接进入代码。我们将创建一个\
  \ `CIFAR-10` 数据集分类器。`CIFAR-10` 是一个包含飞机、卡车等各种对象的彩色图像数据集。让我们导入所需的库。\n\n```python\n\
  import tensorflow as tf\nimport tensorflow_datasets as tfds\nimport matplotlib.pyplot\
  \ as plt\n```\n\n从 `tfds` 模块下载 `CIFAR10` 数据集。\n\n```python\ndataset, info = tfds.load('cifar10',\
  \ as_supervised=True, with_info=True)\n```\n\n划分训练集和测试集，并找到训练集和测试集中图像的数量。\n\n```python\n\
  train_dataset, test_dataset = dataset['train'], dataset['test']\nnum_train = info.splits['train'].num_examples\n\
  num_test = info.splits['test'].num_examples\n```\n\n让我们看看数据集的信息。\n\n现在，让我们创建一个 `normalize`\
  \ 函数，它接收图像并将其调整为 32x32，通过将图像除以 255 进行归一化。\n\n```python\ndef normalize(image, labels):\n\
  \    image = tf.image.resize(image, (32, 32)) / 255.0\n    return image, labels\n\
  ```\n\n现在，在归一化整个数据集后，创建训练集和测试集的批次。\n\n```python\nBATCH_SIZE = 32\n## 在训练、测试和验证集上进行洗牌并实现\
  \ normalize 函数\ntrain_batches = train_dataset.shuffle(num_train // 4).map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
  validation_batches = test_dataset.map(normalize).batch(BATCH_SIZE).prefetch(1)\n\
  test_batches = test_dataset.map(normalize).batch(3000).prefetch(1)\n```\n\n现在，让我们创建模型。我们将使用\
  \ 3 个卷积层，卷积核大小同样为 3x3。第一层卷积层使用 16 个过滤器，接下来的两层各使用 32 个过滤器。记住在每次卷积后进行池化（Pool）。然后，我们展平图像并使用神经网络。\n\
  \n```python\nmodel = tf.keras.Sequential([\n    tf.keras.layers.Conv2D(filters=16,\
  \ kernel_size=(3, 3), activation='relu', input_shape=(32, 32, 3)),\n    tf.keras.layers.MaxPool2D(),\n\
  \    tf.keras.layers.Conv2D(filters=32, kernel_size=(3, 3), activation='relu'),\n\
  \    tf.keras.layers.MaxPool2D(),\n    tf.keras.layers.Conv2D(filters=32, kernel_size=(3,\
  \ 3), activation='relu'),\n    tf.keras.layers.Flatten(),\n    tf.keras.layers.Dense(100,\
  \ activation='relu'),\n    tf.keras.layers.Dense(10, activation='softmax')\n])\n\
  ```\n\n让我们总结一下我们创建的模型。\n\n```python\nmodel.summary()\n```\n\n现在，让我们使用 Adam 优化器和稀疏分类交叉熵（Sparse\
  \ Categorical Cross Entropy）作为损失函数编译模型。这是分类数据中最常用的损失函数。\n\n```python\nmodel.compile(optimizer='adam',\
  \ loss='sparse_categorical_crossentropy', metrics=['accuracy'])\n```\n\n现在，让我们在\
  \ 12 个 epoch（epoch）上训练模型。\n\n```python\nhistory = model.fit(train_batches, epochs=12,\
  \ validation_data=validation_batches)\n```\n\n让我们测试模型。\n\n```python\ntest_loss,\
  \ test_acc = model.evaluate(test_batches)\n```\n\n存储性能变量。\n\n```python\nloss_train\
  \ = history.history['loss']\naccuracy_train = history.history['accuracy']\nloss_val\
  \ = history.history['val_loss']\naccuracy_val = history.history['val_accuracy']\n\
  ```\n\n现在，让我们创建一个函数来可视化我们的训练性能。\n\n```python\ndef visualize(is_acc):\n    epochs\
