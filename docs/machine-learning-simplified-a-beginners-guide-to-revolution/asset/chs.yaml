  \ 神经网络\n\n在第 1 章中，我们接触了深度学习和神经网络的边缘。现在，我们需要进一步深入。你的脑海中可能会产生一个问题：我们有了线性回归，为什么还需要其他算法呢？简单的答案是**非线性性**。线性回归只能映射线性关系，但现实生活中的数据很少具有线性关系，而在提供足够数据的情况下，神经网络是大多数情况下的最佳算法。\n\
  \n\n不要被这张图吓到。我会解释它的每一个部分。根据之前的知识，你可能已经理解这个神经网络接收两个输入并给出一个输出。图中的每个圆被称为节点，如图所示，每个节点都与相邻层中的每个其他节点连接。\n\
  \n你可能在好奇那些 `w1`, `w2`, `w3`, `….` 是什么。它们是网络的**权重**。简单来说，每一个都是两个节点之间关系的强度。图中，`w1`\
  \ 决定了 `x1` 和 `h1` 之间关系的强度。同样，`w2` 决定了 `x1` 和 `h2` 之间的关系，依此类推。例如，如果 `x1` 是雨量而 `h1`\
  \ 是产量，那么 `w1` 就会很高，因为这两者之间密切相关。这同样适用于你的大脑。你清楚地记得生活中的某些时刻，而忘记了大部分时刻。这是因为你一直在思考那个时刻，这让关系变得稳固。所以你记得那些时刻。而你没有考虑其他时刻，关系逐渐变弱，以后你就很难记忆。可以将其考虑为定义神经网络做出决策的基础要素。\n\
  \n现在，那些 `b1`, `b2`, `b3` 是什么？这些是**偏置**。假设你有一家工厂。在工厂运行期间，你会产生电力、原材料等费用。但即使你停止生产一段时间，也会产生一些固定费用。这些成本包括土地租金、员工工资等。从现在起，每当我使用\
  \ `W` 和 `B` 时，`W` 代表模型所有的权重，即 `w1`, `w2`, `w3`, `....`, `wn`，`B` 代表模型所有的偏置，即 `b1`,\
  \ `b2`, `b3`, ..., `bn`。`B` 和 `W` 在整个训练过程中不断以使预测更好。因此，`B` 和 `W` 被称为**参数**。此外，将 `B`\
  \ 视为线性方程 `Y = mX + c` 中的 `c`。它们是常数值，帮助直线偏离原点以更好地拟合数据。（当然，`W` 线性方程中的 `m`。）\n\n现在，让我们看看隐藏层中每个节点（在此情况下，为\
  \ `h1`, `h2` 和 `h3`）内部发生了什么。\n\n```\nh1 = x1 * w1 + x2 * w4 + b1\nh2 = x1 * w2 +\
  \ x2 * w5 + b2\nh3 = x1 * w3 + x2 * w6 + b3\nŷ = h1 * w7 + h2 * w8 + h3 * w9\n\
  ```\n\n如你所示，每个输入节点都与其连接到特定隐藏层节点的权重相乘，并与偏置相加。之后，这些隐藏层节点再与它们连接到输出层的权重相乘并相加。（注意：输出层不包含任何偏置。我们稍后会讨论。）通过这种方式，数据向正向移动，即从输入节点到隐藏层（层）再到输出层。因此，在训练神经网络期间，这个过程被称为**前向传播**。当它到达输出层后，就会生成输出，即\
  \ `ŷ`。最初，`W` 和 `B` 都是随机生成的。因此，`ŷ` 也是任意的。\n\n现在，预测的误差/损失通过公式 `Loss = (y - ŷ) ²`\
  \ 计算。为了获得更好的预测，必须将此损失降到最低。为此，我们必须改变参数（`W` 和 `B`）的值。我们通过被称为**反向传播**的过程来实现。\n\n\n\
  对每个相应权重取 `Loss` (`L`) 导数的目的是检查每个权重的微小变化如何影响损失。让我们取 `w8` 看看它是如何更新的。\n\n```\nw8 ”\
  \ = w8 - η * dL/dw 8\n```\n\n其中，`η` = 学习率 (LR)。引入它的目的是为了防止权重发生剧烈变化。假设 `dL/dw 8 =\
  \ 20`。这是一个巨大的数字，会剧烈改变 `w 8`。因此，为了最小化这一点，我们可以乘以一个极小值，比如 0.01。那么它只会改变 `w 8` 数值的 0.2。这就是学习率的功能。同样，其他所有权重和偏置都会更新。如你所示，这个过程是倒着移动，即从输出层到隐藏层再到输入层。因此，这个过程被称为反向传播。\n\
  \n现在，在深入代码之前，让我们再学习几点。\n\n## 激活函数\n\n还有一件事还没告诉你们。模型中的实际非线性是由**激活函数**提供的。之前我们写道：\n\
  \n```\nh1 = x1 * w1 + x2 * w4 + b1\nh2 = x1 * w2 + x2 * w5 + b2\nh3 = x1 * w3 +\
  \ x2 * w6 + b3\n```\n\n但为了提供非线性，实际发生的是：\n\n```\nh1 = f (x1 * w1 + x2 * w4 + b1)\n\
  h2 = f (x1 * w2 + x2 * w5 + b2)\nh3 = f (x1 * w3 + x2 * w6 + b3)\n```\n\n其中，`f(x)`\
  \ 可以是任何激活函数。我们将讨论几个。\n\n### ReLU\n这是最常用的激活函数。对于正输入，它输出相同，但对于负输入，它输出零。例如，如果输入是 9，它输出\
  \ 9；但如果输入是 -9，输出是 0。\n\n\n### Sigmoid\n这也是最常用的激活函数之一。主要用于逻辑回归![](img/rsrc23K.jpg)图\
  \ 6-4 Sigmoid (来源：[https://hackaday.io/page/5331-])\n\n其他激活函数有：\n- 双曲正切 (Tanh) 函数\n\
  - Softmax 函数\n\n### 损失函数\n在每次正向传播期间计算预测误差的函数。对于二分类，交叉熵最常用，而对于回归问题，使用均方误差。\n\n###\
  \ 优化器\n为了最小化模型的损失，必须使用某些算法。最常用的是随机梯度下降 (SGD)。其他优化器有：\n- Adam\n- AdaGrad\n- Momentum\n\
  \n## 过拟合与欠拟合\n\n考虑![](img/rsrc244.jpg)图 6-5 生活中的过拟合示例。如果你的神经网络没有足够的数据，就会倾向于欠拟合。相反，如果模型训练过度，它就会倾向于过拟合。它们是相互相对的。防止它们的最佳方法是：\n\
  - 数据增强\n- Dropout\n- 选择合适的网络架构\n- 使用足够的数据\n\n**Dropout**：Dropout 是一种在更新参数时随机忽略一些节点的技术，其范围从\
  \ 0 到 1。这是一种防止复杂模型过拟合的有效方法。\n\n**数据增强**：在训练机器学习模型（特别是深度学习模型）时，需要大量数据。如果数据不足，模型就会倾向于欠拟合。同样，使用数据增强有助于防止过拟合。在这种情况下，通过裁剪图像、旋转、翻转等来增加数据集的数量。如果你想了解更多关于数据增强及其实现，可以查看我的博客，这是\
  \ TensorFlow 官方接受的链接：https://videhablogs.com/data-augmentation-in-tensorflow/\n\n\
