  - "[PAGE 0]\n\n# Corrigendum to “Prediction of narrow HT-SMA thermal hysteresis\
    \ behaviour using explainable machine learning” [Mater. Today Commun. 35 (2023)\
    \ 105806]\n\nRonald Machaka<sup>a,*</sup>, Precious M. Radingoana<sup>b</sup>\n\
    \n<sup>a</sup> Independent Researcher, Hamilton, 2303, Newcastle, New South Wales,\
    \ Australia  \n<sup>b</sup> Advanced Materials Manufacturing, Manufacturing Cluster,\
    \ Council for Scientific and Industrial Research, P.O. Box 395, Pretoria 0001,\
    \ South Africa\n\nThe authors regret that before the online release of our article,\
    \ some information remained unnoticed during the proof correction. After careful\
    \ consideration, we decide to make this corrigendum for our article. The corrected\
    \ form of the expression of Eq. (1) is given as follows:\n\n**Revision 1: Typographical\
    \ errors in** [Eq. (1)] **and** [Eq. (2)]:\n\n$$R^2 = 1 - \\sum_{i=1}^{n}\\frac{(y_i-\\\
    hat{y}_i)^2}{(y_i-\\bar{y})^2}$$  \n(1)\n\nThe corrected form of the expression\
    \ of Eq. (2) is given as follows:\n\n$$RMSE = \\sqrt{\\frac{\\sum_{i=1}^{n}(y_i-\\\
    hat{y}_i)^2}{n}}$$  \n(2)\n\nwhere $y_i$ is the dataset target value and $\\hat{y}_i$\
    \ represents its corresponding predicted value, $\\bar{y}$ is the mean of the\
    \ target descriptor of $n$ dataset entries.\n\n**Revision 2:** [Table 3]’s caption\
    \ was mislabelled. Two Ti–Ni–Cu alloys in [Table 3] are misrepresented as ‘Ti–47.5N–2.5Cu’\
    \ and ‘Ti–42.5N–7.5Cu’ when they should be ‘Ti–47.5Ni–2.5Cu’ and ‘Ti–42.5Ni–7.5Cu’,\
    \ respectively.\n\n[Table 3] has been corrected as follows:\n\n**Revision 3: typographical\
    \ errors in** [Table A1]:  \nThe feature description column in [Table A1] has\
    \ been revised.  \n[Table A1] has been corrected as follows:\n\n**Revision 4:\
    \ Corresponding author’s new e-mail address:**  \nThe new e-mail address for the\
    \ corresponding author (Ronald Machaka) is as follows ron[dot]machaka@gmail.com.\
    \  \nNone of these changes affect the original content, the methodology and the\
    \ interpretation of the results, or the conclusions presented in this published\
    \ paper.  \nThe authors sincerely apologise for any inconvenience caused.\n\n\
    **Table 3**  \n*Experimentally measured and ML-predicted ΔT<sub>H</sub> behaviour\
    \ of TiNiCu alloys.*\n\n| Alloys [Ref.] (at%) | Experimentally Measured ΔT<sub>H</sub>\
    \ [Ref.] | ML Predicted ΔT<sub>H</sub> [This Study] |\n|---|---:|---:|\n| (Ti<sub>50−x</sub>Ni<sub>50−y</sub>Cu<sub>y</sub>)\
    \ alloy system | | |\n| Ti–50Ni | 33.20 {2.3} [38,42,45] | 34.315 (6.6) |\n| Ti–47.5Ni–2.5Cu\
    \ | 35.60 [42] | 34.963 (1.8) |\n| Ti–45.0Ni–5.0Cu | 23.00 [36,42] | 21.724 (5.5)\
    \ |\n| Ti–42.5Ni–7.5Cu | 19.90 [42] | 19.692 (1.0) |\n| (Ti<sub>50−x</sub>Zr<sub>x</sub>)(Ni<sub>50−y</sub>Cu<sub>y</sub>)\
    \ system | | |\n| Ti–50Ni–15Zr | 44.80 [44] | 44.41 (0.9) |\n| Ti–47Ni–15Zr–3Cu\
    \ | 58.80 [44] | 57.10 (2.89) |\n| Ti–45Ni–15Zr–5Cu | 55.00 [44] | 52.94 (3.7)\
    \ |\n| Ti–40Ni–15Zr–10Cu | 52.40 [44] | 54.02 (3.2) |\n| Ti–35Ni–15Zr–15Cu | 57.00\
    \ [44] | 56.70 (0.5) |\n\n**Notes:**  \nValues in [] parenthesis point to cited\
    \ references. Values in {} parenthesis represent the error in estimating the mean\
    \ values. Values in () parenthesis represent the percentage error between a predicted\
    \ value and the true or experimentally measured value."
