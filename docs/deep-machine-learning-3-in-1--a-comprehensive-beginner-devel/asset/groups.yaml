    ## 语音识别


    这是人工神经网络最常见的用途之一。语音在人与人之间的交互中扮演着显眼且至关重要的角色。因此，人们自然会希望与机器之间有语音界面。然而，尽管世界取得了巨大进步，人类仍然需要一些复杂的语言来与机器通信。这些语言难以学习。为了缓解沟通障碍并平缓学习曲线，解决这个问题有一个简单的方法。沟通应采用机器容易理解的媒介。该领域也取得了巨大进展。然而，词汇量有限和语法等问题不时出现，试图破坏进展。ANN
    被视为机器通信领域的游戏规则改变者。为此，你可以使用多层网络、自组织特征映射以及具有循环连接的多层网络。


    最重要的网络是 Kohonen 的自组织特征映射。该网络将以输出数组的形式映射相似的音素，这被称为特征提取技术。在借助声学模型提取特征后，网络将开始识别语音。


    ## 签名验证


    签名验证是在法律交易中验证个人身份时保持安全的最重要方式之一。这是一种非基于视觉的技术。第一种方法是提取代表特定签名的几何特征集。获得这些特征集后，你可以通过编写神经网络算法来训练人工神经网络。训练好的神经网络会将签名标记为伪造或真实。


    ## 第八章


    ### 卷积神经网络


    卷积层被认为是卷积神经网络（CNN）的关键构建模块。卷积是应用滤波器以获得输入的最简单应用，这将导致一种激活。反复应用滤波器会产生称为特征图的激活图。这指示了输入中某个特征的确切位置和强度。这可以是一张图像。


    卷积神经网络与简单神经网络不同的原因在于，它们可以自行学习针对特定训练数据集（在特定建模问题的约束下，例如图像分类）的不同滤波器。结果是你可以在任何地方检测到的高度特定的特征。


    卷积神经网络是一种专门设计用于处理二维数据的神经网络模型。然而，它们也可以用于三维和二维数据类型。卷积神经网络的核心是卷积层，这使得该网络拥有其独特的名称。这个特定的层旨在执行一种广为人知的操作，即卷积。


    这是一种线性操作，包括将权重与输入到网络的输入相乘。在这里，它就像传统网络一样工作。这种技术专门为 2D 输入设计。卷积神经网络中的滤波器比输入数据的大小小。卷积神经网络中存在点积，这是滤波器与输入之间的逐元素乘法过程。将它们相加总是产生一个单一值。完整的操作可以称为标量积。


    如果你使用比输入尺寸更小的滤波器，它将允许滤波器在多个点上与输入数组进行乘法过程。滤波器系统地应用于输入数据的不同重叠部分。如果你设计滤波器以在输入中发现某个特定特征，那么在输入图像上应用相同的滤波器会使滤波器能够在同一图像的任何位置找到相同的特征。可以说，滤波器将该特征作为参考点，以在图像的其他位置检测它。这使得卷积神经网络非常精确和可靠。滤波器与输入数组相乘的输出将是一个单一值。随着滤波器多次进行乘法过程，结果将是一个包含输出值的
    2D 数组。该数组也称为特征图。


    一旦创建了特征图，你就可以将每个值传递通过非线性过程。


    将此卷积操作应用于图像数据的概念对卷积神经网络来说并不新鲜。它已经在计算机视觉技术中实现。计算机视觉专家手动设计滤波器，然后将其应用于特征图中的特定图像。


    卷积神经网络通常不依靠单个滤波器进行学习。针对特定输入，多个特征并行运行。卷积层为某个输入并行从 32 到 512 个滤波器中自我学习是非常常见的。


    彩色图像由每个颜色通道（如红色、蓝色和绿色）的多个通道组成。从数据角度来看，这意味着作为输入馈送到模型的单个图像实际上是三个图像的组合。滤波器应具有与输入相同数量的通道。这通常被称为卷积神经网络的深度。如果你馈送到模型作为输入的图像包含三个通道，那么你需要应用一个也具有三个通道的滤波器到图像上。如果一个卷积层包含
    32 个滤波器，它们不仅是 2D 的，而且也是 3D 形式。每个滤波器产生一个特征图。这意味着具有 32 个滤波器的特定卷积层的输出深度是 32。


    卷积层不仅应用于输入数据，还应用于每个层的输出。当你堆叠层时，它会形成输入的分层分解。请考虑这样一个事实：滤波器将逐渐学习提取线条等特征的过程。通常在每个层的输出上运行的滤波器可能会提取不同的特征，这些特征构成了包含多个线条以表达不同形状类型的某些低级特征的组合。该过程持续进行，直到超深层开始提取动物、面部、房屋等。


