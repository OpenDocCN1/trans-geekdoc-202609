    ## Chapter Eight


    ### Convolutional Neural Networks


    Convolutional layers are considered the key building blocks of convolutional neural
    networks or CNN. A convolution is the simplest application of a filter to get
    an input that would result in a kind of activation. Recurrent application of a
    filter yields a map of activations that are called a feature map. This indicates
    the exact locations and the strengths of a certain feature in the input. This
    can be an image.


    Why convolutional neural networks differ from simple neural networks is from the
    fact that they can learn by themselves about different filters that are specific
    to a particular training dataset within the constraints of a particular modeling
    problem like the classification of images. The result is highly specific features
    that you can detect anywhere.


    A convolutional neural network is known as a specialized kind of neural network
    model that is specifically designed to work with two-dimensional data. However,
    they also can be used with three-dimensional and two-dimensional data-types. The
    core of a convolutional neural network is the convolutional layer which gives
    this network its peculiar name. This particular layer would like to perform a
    specific operation popularly known as a convolution.


    It is a kind of linear operation that includes multiplication of weights with
    the input you feed to the network. Here it acts just like a traditional network.
    This technique was particularly designed for 2D input. The filter in the convolutional
    neural networks is smaller than the size of the input data. There is a dot product
    in convolutional neural networks which is an element-wise multiplication process
    between the filter and input. Their sum is drawn which always yields a single
    value. The full operation can be referred to as a scalar product.


    If you use a filter that is smaller in size than the input, it would allow the
    filter to go through the process of multiplication by the input array at more
    than one point. The filter is systematically applied to different overlapping
    parts of the input data. If you have designed the filter to spot a particular
    feature inside the input, the application of the same filter across the input
    image gives filter the power to find the same feature at any point in the same
    image. It can be said that the filter takes that feature as a reference point
    to detect it at other places in the image. This makes convolutional neural networks
    highly precise and trustworthy. The output from the multiplication of the filter
    with an input array will be a single value. As the filter runs through the process
    of multiplication more than once, the result will be a 2D array, containing the
    output values. The array is also known as a feature map.


    Once the feature map is created, you will be able to pass each value through the
    process of nonlinearity.


    The concept of applying this convolutional operation to the image data is nothing
    new for convolutional neural networks. It has already been implemented in computer
    vision technology. Computer vision experts design filters by hand, which are then
    applied to a particular image inside of a feature map.


    Convolutional neural networks don’t usually learn by a single filter. Multiple
    features run in parallel for specific input. It is quite common for the convolutional
    layer to educate itself from 32 to 512 filters in parallel for a certain input.


    Color images consist of more than one channel for each color channel like red,
    blue, and green. From a data perspective, it means that a single image that is
    fed as input to a model is in reality a combination of three images. A filter
    ought to have the same number of channels as the input has. This is often referred
    to as the depth of the convolutional neural network. If the image you are feeding
    to the model as input consists of three channels, then you need to apply a filter
    to the image that also has three channels. If a convolutional layer consists of
    32 filters, they are not just 2D but they also are in 3D form. Each of these filters
    results in one feature map. This means that the depth of the output of a particular
    convolutional layer that has 32 filters is 32.


    Convolutional layers not only are applied to the input data but they are also
    applied to the output of each layer. When you stack up the layers, it shapes up
    a hierarchical decomposition of your input. Consider the fact that the filters
    will gradually learn the extraction process of features such as lines. The filters
    that generally operate on the output of each layer may extract different features
    that form the combinations of certain low-level features that contain more than
    one line to express different types of shapes. The process carries on until ultra-deep
    layers start extracting animals, faces, houses, etc.


    Keras library in Python offers an array of convolutional layers that you can use
    for programming purposes.


