    The first step is to load the dataset. Then I will prepare the pixels for the
    images that exist in the dataset. You will have to rescale the images to the range
    of [0,1]. This involves the conversion of the data type from integers to floats
    and then dividing the value of pixels by the maximum value.


    Then comes the process of defining the deep learning model. The model will be
    trained for 10 training epochs that have a default size of 32 examples.


    ### This is the baseline convolutional neural network model for mnist dataset


    ```

