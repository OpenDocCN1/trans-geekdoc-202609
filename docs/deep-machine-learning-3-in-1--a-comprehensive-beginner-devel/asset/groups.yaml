    \n人工智能（AI）一直是媒体机构炒作的极端话题。关于机器学习、AI和深度学习的利弊，已经有无数文章。甚至连名人也卷入了关于AI未来及其对人类种族危险的口水战和推特争吵。特斯拉首席执行官（CEO）埃隆·马斯克是少数几个反对在人工智能领域不受限制地竞相追求卓越的名人亿万富翁之一。无论事实如何，目前我们被承诺将迎来一个全新且进化的智能聊天机器人和虚拟助理（VA）族群。\n\
    \n有人认为，深度学习系统将把人类的未来描绘成一幅暗淡的图景。那将是乌托邦时代，人类将大量失业，机器人将处理大部分经济活动。不过，也有积极的一面。在我看来，媒体发布和辩论被过度炒作了。AI只会提高人类生活的质量。它将帮助我们以更好的方式生存。它将通过减轻艰巨任务，并以快速而高效的方式帮助完成体力消耗大的工作，从而帮助人类最大限度地提高工作产出。AI是未来，你必须在这个革命性的未来中发挥积极作用。\n\
    \n你可能会听到人工智能、机器学习和深度学习等不同但相似的术语。本章将逐一讨论这些术语，使你清楚每个术语的含义及其重要性。\n\n### 人工智能\n\n\
    人工智能诞生于20世纪50年代，当时一些计算机科学的先驱开始提出一个关键问题：计算机能否像人类一样思考。该问题的影响至今仍在被探索。作为一个领域，人工智能可以定义为努力实现某些固有于人类的智力任务的自动化。虽然AI是一个广泛的领域，但深度学习和机器学习是其子领域。然而，该领域还包括那些不需要太多学习的领域。例如，国际象棋程序涉及程序员编写的硬编码规则。它们不属于机器学习范畴。专家认为，只有当程序员为知识操作手工制作显式规则时，才能实现人类水平的AI。这种方法可以被称为符号AI，它在20世纪50年代到80年代占据主导地位。\n\
    \n### 机器学习\n\n机器学习系统通常是经过训练，而不是被编程的。程序员展示与某项任务相关的不同示例。如果你计划自动化整理配偶照片集的任务，你可以用她的不同照片示例来喂养机器学习系统。系统学习统计规则，将多张图片与特定标签关联起来。\n\
    \n"
