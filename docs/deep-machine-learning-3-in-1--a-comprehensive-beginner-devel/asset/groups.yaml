  - '[PAGE 103]


    Machine learning systems developed in the 1990s and since then it has fast become
    a highly popular and successful subfield of AI. As the datasets and hardware got
    faster and more efficient, machine learning gained popularity and success. Mathematical
    statistics drives machine learning. Unlike mathematical statistics, machine learning
    deals with complex and large datasets like the dataset of millions of pictures.


    Machine learning demands certain input data points. For example, if the task is
    recognition of speech, the data points can speeches by the people. If the task
    is the recognition of pictures, the data points can be images of people. For a
    speech recognition task, the expected output can be human-generated transcripts
    of audio files while in the image task, the outputs can be tags like humans or
    animals. You also can measure the performance of an algorithm.


    A machine learning model transforms the input data into something meaningful.
    The main problem in the processes of deep learning and machine learning is the
    meaningful transformation of data. A color image can be easily encoded into RGB
    format which includes red-green-blue colors. It can also be encoded into HSV format
    which is the short form of hue-saturation-value. These are considered as the two
    different representations of the same type of data. If a task appears to be difficult
    with one representation, you can easily do that with another. The objective of
    machine learning models are to locate the appropriate representation for the input
    data.


    # Deep Learning Models


    Deep learning is a branch of machine learning. You can see it as a new take on
    educating a system with the help of data that tries to emphasize leaning successive
    layers of different meaningful representations. Deep learning is not a reference
    to any type of deep understanding that you can achieve by this approach. It denotes
    the idea of different types of layers of representations. The higher the number
    of layers is the more the depth of the model is. Other names for the field can
    be hierarchical representations learning and layered representations learning.
    Presently, deep learning systems have tens even hundreds of successive layers
    of representations. They tend to learn from exposure to training data. The machine
    learning systems that focus on just a couple of layers of representations are
    called shallow learning systems.


    The models in deep learning systems are known as neural networks that have'
  - '[PAGE 104]


    layers that are stacked on one over another. The term neural network refers to
    neurobiology as a few central concepts in deep learning are developed by drawing
    inspiration from the understanding of the human brain. However, deep learning
    models are not exact models of the human brain because the evidence doesn''t exist
    that the human brain has anything akin to the learning mechanisms of deep learning
    models.


    # How Do Deep Learning Models Work?


    Deep learning is known for its accuracy. They have achieved recognition accuracy
    more than ever. These models make the foundation of safety-critical applications
    such as driverless cars. In some instances, deep learning models even surpass
    in efficiency and speed. Image classification tasks are the example of the fast
    working of deep learning models.


    The concept of deep learning came into existence in the 1980s. However, at that
    point, it needed a big supply of labeled data. For instance, if you need to build
    driverless cars, you need thousands of video hours and millions of images. They
    also required countless computing power. High-performance GPUs and cloud computing
    were needed to reduce the training time for deep learning networks from months
    to weeks or even days.


    # How Deep Learning Differs From Traditional Models


    Deep learning models are considered superior because they are stacked hierarchically.
    On the other hand, traditional machine learning algorithms are linear. A hierarchical
    order boosts abstraction and complexity. If you want to understand deep learning
    models, you ought to imagine a toddler who learns the first-word ‘cat.’ She learns
    what a cat is by pointing toward an object and uttering the word ‘cat.’ If she
    is right, her mother would say, ‘Yes, it is a cat.’ Otherwise, she would tell
    her that it is not a cat. As she points to more objects, she educates her brain
    about the different features that a cat possesses such as her color, shape, and
    paws. She is, unintentionally, clarifying a somewhat complex abstraction. The
    toddler would build a hierarchy of knowledge in her mind. In the hierarchy, each
    abstraction level is formed on the foundation of knowledge gained from the previous
    layer.


    The computer programs that are backed by deep learning models go through a similar
    process like the one the toddler’s brain has gone through. Each'
  - '[PAGE 105]


    algorithm in this hierarchy uses the knowledge it has gained to build a statistical
    model. Iterations through the layers continue until the output reaches an acceptable
    level of accuracy.


    Traditional machine learning is different in the sense that the learning process
    is largely supervised. The programmer needs to be very specific when educating
    the computer on what types of things it must be looking for to decide whether
    a certain image is of a cat or a dog or any other animal. The process is dubbed
    as feature extraction. The success rate of the computer is dependent upon the
    ability of the programmer to define a particular feature set for a cat. Simply
    put, you have to define the feature set yourself while in deep learning, the program
    itself builds this feature without any kind of supervision. This makes the process
    faster and highly accurate.


    The process is largely smooth. The computer program is fed with training data
    which is a bunch of images that are labeled with a cat or not cat. The labels
    are known as meta tags. The computer program uses this initial dose of information
    for training the model. Then it receives a constant feed of data while the model
    trains itself. The very first form of the model is known as the predictive model.
    The first model may predict that anything that has four legs is known as a cat.
    It will label it a cat even if it is a dog because it will match the images by
    looking for different pixels in the data. Each iteration makes the model complex
    and highly accurate.


    A toddler may take months to decipher and digest the concept of a cat but a deep
    learning model will take a fraction of that time to learn how a cat looks as it
    will be able to iterate through millions of images in a short time.


    Some people question the accuracy of the model. If a model is not accurate, it
    is a matter of much concern. Deep learning programs need access to a bulk of processing
    power and training data. Deep learning models are accurate because they can easily
    create highly complex statistical models from an iterative output. Constant iterations
    help the model build accurate models out of unlabeled and unstructured data.


    # Deep Learning Model Examples


    Deep learning models are deployed in automated driving and medical devices. Automotive
    researchers use these models for the detection of'
  - '[PAGE 106]


    different objects such as traffic lights and lampposts that are installed along
    the side of roads. These models are being used in driverless cars to detect pedestrians
    and discriminate them from moving cars and still objects. That’s how developers
    expect to lower the number of accidents. These models are also used in defense
    and aerospace to detect objects and discriminate them from satellites. That’s
    how experts can declare different zones as safe or unsafe.


    These models also are being used in the medical field. Cancer researchers are
    using these systems to detect cancer cells in the human body. Deep learning models
    are also used to improve the safety of workers as they automatically detect when
    objects and people come close to machines and are likely to fall into danger.
    This technology is also being used for translation of speech and automated hearing.


    Deep learning models work on the back of neural network architectures, which is
    why these models are often labeled as deep neural networks. The ‘deep’ in deep
    learning means the total number of layers in each neural network. Traditionally,
    a neural network only had two to three layers while deep neural networks may contain
    as many as 150 layers. Once you have created these models, you will have to train
    them with the help of neural network architectures and labeled data.


    Deep learning has brought remarkable achievements for human beings and these achievements
    are visible in the form of automated cars. However, some highly awaited applications
    such as human-level translation, human-level dialogue systems, and human-level
    language understanding are largely elusive. However, AI has been through cycles
    of expectations and disappointments in the past.'
