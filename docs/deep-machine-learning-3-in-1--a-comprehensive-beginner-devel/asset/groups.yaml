    elements from them as the program runs its course. For instance, you might be
    able to create a game in which a player builds and destroys computer accessories.
    You can store the accessories in a list and remove each as the player destroys
    an accessory. Each time, he buys or builds one, it will be added to the list.
    You can change the value of an element by adding a new element after mentioning
    the index number.


