    ## 协助


    在旅游行业，您可以使用人工智能为聊天机器人和助手服务，以满足客户的需求。随着技术变得高度复杂，人工智能现在可以通过回答客户提出的常见问题来提供现场协助。它们甚至可以执行某些请求并提供精确的实时建议。聊天机器人可以被塑造为俏皮的个性，以逗乐客户。这将彻底改变旅游行业。


    ## 第六章


    ### 数学术语解释


    如果您想了解深度学习技术，应该熟悉不同的数学概念，例如梯度下降、张量、微分和张量运算。要构建深度学习模型，您需要一个充满数据的多维 Numpy 库。库中的数据存储在称为张量的
    Numpy 数组中。所有当前的机器学习模型都将这些张量用作数据的基本结构。如果您分析一个张量，就会知道张量是一个存储数据的容器。您必须知道它存储的数据是数值。


    ### 标量


    某些矩阵是 2D 张量。维度也称为轴。如果张量只包含一个数字，则称为标量张量。它也称为 0D 张量。Numpy 库中的 Float 64 和 float 32
    称为标量张量。标量张量没有任何轴。张量中的轴数也称为秩。


    ### 向量


    多个数字组成的数组称为向量。有些人也称其为 1D 张量。从其名称显而易见，它包含单个轴。如果向量有五个条目，则将其标记为 5 维向量。请记住，5D 向量与
    5D 张量不同。基本区别在于，5D 向量沿轴具有五个维度，而 5D 张量总共有五个轴。它们沿轴可能具有不同数量的维度。维度要么显示张量内的轴数，要么显示单个轴上的条目数。


    ### 矩阵


    包含向量的数组称为矩阵。它的另一个名称是 2D 张量。两个轴通常被称为列和行，您可以将矩阵定义为数字的矩形网格。第一个轴中的条目称为行，而第二个轴中的条目称为列。


    ### 3D 张量


    如果将不同的矩阵打包成新数组的形式，您将得到一个 3D 张量，可以将其解释为数字立方体。如果将 3D 张量打包在数组中，您将能够创建 4D 张量。原理依此类推。


    三个关键属性通常定义张量。第一个是轴的数量。例如，3D 张量可能有三个轴，而矩阵具有两个轴。这在 Numpy 中也称为张量的 ndim。张量的 shape
    是一组整数元组，描述每个张量沿某个轴具有多少个维度。然后是数据类型，在 Python 库中用 dtype 符号表示。这是张量中包含的特定类型的数据。张量的类型可以是
    uint8、float64 和 float32。在某些情况下，您也可能会看到 char 张量。必须注意的是，几乎不存在字符串张量。


    ### 向量数据集


    这是数据方面最常见的情况之一。在这种数据集中，单个数据点可以轻松地以向量形式编码。因此，一批数据将以 2D 张量形式编码，即向量数组。在这里，第一个轴称为样本轴，第二个轴称为特征轴。以人员数据集为例，您需要考虑特定人员的年龄、收入和邮政编码。数据集中的每个人都应被描述为包含三个值的向量。因此，包含
    300,000 人的整个数据集可以轻松地打包成以下 shape 的 2D 张量 (300000, 3)。


    然后是文本文档数据集，我们将根据某个单词在文档中出现的次数来展示每个文档。您可以在 10,000 个单词的字典中计算这一点。每个文档都必须编码为 10,000
    个值的向量，即字典中每个单词一个计数。因此，400 个文档的整个数据集将轻松地以以下形式存储在张量中 (400, 10000)。


    ### 序列数据


    当数据中时间很重要时，将数据存储在具有明确 3D 结构的 3D 张量中更为明智。在这里，每个样本都应以 3D 张量形式编码。按照惯例，时间轴始终被视为第二个轴。请看几个例子。


    假设有一个股票价格数据集。每过一分钟，就必须存储特定股票的当前价格，以及上一分钟的最低价和最高价。因此，每分钟都以 3D 向量形式编码。当一天结束时，整个交易日将编码为
    (350, 3)，前提是交易日总共有 350 分钟。您可以使用 3D 张量存储 250 天的数据，形式如下 (250, 350, 3)。张量的每个样本代表一天的数据。


    您还可以形成多个推文的数据集，其中可以编码包含 250 个字符的单条推文。推文中的每个字符都可以编码为大小为 128 的二进制向量（字母表数量为 128）。然后可以将每条推文编码为以下形式的
    2D 张量 (250, 128)。如果必须创建 100,000 条推文的数据集，它将如下所示 (100000, 250, 128)。


    ### 图像


    通常，图像由三个维度组成，即宽度、高度和颜色深度。类似于 MNIST 数字中包含的灰度图像具有一个单一的颜色通道。它们可以存储在 2D 张量中。按照惯例，图像被打包在
    3D 张量中。灰度图像具有一个 1 维颜色通道。如果您有一批 256 个大小为 128x128 的灰度图像，可以将它们以以下形式存储 (256, 128,
    128, 1)。


    如果讨论图像张量的惯例，有两种，即 channels-first 惯例和 channels-last 惯例。


    ### 视频


    视频数据是需要 5D 张量的现实世界数据类型。视频应被视为帧序列，其中每帧被视为彩色图像。每帧应以 3D 张量形式存储，形式如下 (高度, 宽度, 颜色深度)。如果必须将帧序列存储为
    4D 张量，则需要在开头添加帧属性。如果处理一批不同的视频且需要将其存储在 5D 张量中，数据集将在帧之前具有样本属性。


