    \ BI 解决方案希望优先考虑自助分析和对业务运营的快速洞察。\n\n商业智能被视为一个统称，通常涵盖不同的流程以及从不同业务运营中收集、存储和分析数据的方法，以优化性能。所有这些因素汇集在一起，形成对特定业务的广泛视图，这最终帮助人们改善生活并做出一些可操作的决策。在过去几年中，商业智能倾向于演进，以包含不同的活动和流程，帮助提升性能。\n\
    \n### 流程\n\n进入商业智能循环的第一个流程是数据挖掘。这包括使用数据库和机器学习来挖掘大型数据集中的不同趋势。接下来是报告流程。这指的是在企业利益相关者之间共享数据分析，以便他们可以得出多个不同的结论并做出明智的决策。下一个流程是绩效指标。这包括将当前绩效数据与一系列历史数据进行比较，以跟踪与一组目标的绩效。绩效指标通常显示在自定义仪表板上。下一个流程称为描述性分析，它使用多种初级数据分析来梳理已发生的情况。其他发挥作用的流程包括数据可视化、可视分析和数据准备。\n\
    \n### 商业智能功能\n\n商业智能的关键功能之一是报告。报告可以是定期的，也可以是临时的。这取决于向行业关键利益相关者提供数据。这些报告注定会采取多种形式，可以使用多种方法生成。然而，商业智能允许您消除报告准备中的人为因素。它利用整个流程的自动化，并减轻了生成定期报告中的痛点。这节省了大量时间，否则这些时间将花费在收集文档和数据以制作每周报告上。BI\
    \ 可以帮助企业节省人力，用于其他复杂任务。即使是小企业使用 BI 工具生成报告，也将获得企业级可扩展性。\n\n企业中的另一项功能是分析，即对数据进行检查并在数据中形成模式。分析力求具有描述性、预测性和规定性。描述性分析会以众数、均值和中位数的形式准备数据。规定性分析是商业智能的一个分支，它向管理层建议某些行动，以最大化产出并优化结果。它将确定\n"
