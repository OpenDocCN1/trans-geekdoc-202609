    人工神经网络的历史可以追溯到 20 世纪 40 年代，当时 Walter Pitts 和 Warren McCullough 构建了一个旨在像人脑一样运作的基于算法的系统。随着名为
    _感知机_ 的算法的诞生，构建人工神经网络领域取得了进展。感知机能够执行一些复杂的操作，例如识别任务。


    人工神经网络 (ANN) 正在彻底改变商业和日常生活。ANN 将 AI 提升到了一个新水平。机器可以被训练来学习和识别不同的模式。它们可以做出以前只有人类才能做出的预测。因此，它们也可以解决人类每天遇到的不同问题。


    人工神经网络是本质上是算法的计算模型。它们具有从复杂或不精确的数据中提取意义以定位模式，并检测对人脑来说似乎过于复杂的趋势的独特能力。人工神经网络已经缓解了人类的各种困难。您可以在
    Gmail、Uber 和 Amazon 中发现它们。一旦被有效训练，它们就不再需要您的帮助。它们将从遇到的任何数据中学习。人脑由构成大脑基本单元的神经元组成。人工神经网络与人脑相似，因为它们也包含许多处理信息并根据需要传输信息的神经元。


