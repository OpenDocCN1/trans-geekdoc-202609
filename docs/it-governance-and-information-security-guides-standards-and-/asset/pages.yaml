    # 7.4 SUMMARY


    Compliance audits and reviews are the secret ingredients to ensuring security
    policies and processes are strictly adhered to, in line with an organization’s
    risk or security management strategy. They are also an integral component of all
    operations management programs, including ISO 27001, COBIT, Sarbanes Oxley, and
    TTL. Without a assurance process, it is impossible to ensure that risks are being
    managed as intended or to detect and correct potential problems when they are
    not.


    This chapter presents an ISG framework to provide a practical tool for measuring
    and improving governance in organizations. ISG has been implemented in a medium
    organization to drive and improve ISG maturity. The results are satisfactory and
    prove that the model will provide great support to organizations in different
    sizes and various sectors of activity in their governance and management of information
    security. Nevertheless, it is suggested that the scientific community and organizations
    adopt this framework and test it in different case studies.'
