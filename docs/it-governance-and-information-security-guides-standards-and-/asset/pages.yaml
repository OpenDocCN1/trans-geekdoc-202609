- pgno: 111
  md: '# IT Governance in Organizations 93


    The PCM utilized in COBIT provides a structured approach for IT capability assessment
    through evaluating processes capability against a consistent and well-established
    scale (Olive & Lainhart, 2012). The evaluation is performed through metrics that
    assess a unique set of key indicators (KGIs) and key performance indicators (KPIs)
    for each IT process. KGIs are lead indicators that aim to identify and measure
    the application of processes. On the other hand, KPIs are lag indicators that
    assess the achievement of process goals. KPIs and KGIs are also associated with
    Balanced Scorecard (BSC). They are critical to the success of ITG. For all 37
    processes, the relationship between IT processes and business goals is a set of
    IT-related goals (i.e., to define what IT objectives are achieved by the process),
    process goals (i.e., to define what IT must deliver to support objectives), and
    activities (i.e., to assess actual performance).


    According to ISACA (2012), there are six levels of capability that a process can
    achieve in COBIT as shown in Figure 3.1:


    +   - Incomplete (level 0): The process is not implemented or fails to achieve
    its objective. This level has no process attributes;

    - Per (level 1): The process is implemented and achieves its objective. This level
    has only one process attribute: process performance;

    - Managed (level 2): The previously described process is now implemented using
    a managed approach and its outcomes are appropriately established. This level
    has two process attributes: performance management and work management;

    - Established (level 3): The previously described managed process is now implemented
    using a defined process capable of achieving its process outcomes. This level
    has two process attributes: process definition and process deployment;

    - Predictable (level 4): The previously described established process now operates
    within a defined boundary that allows the achievement of the process''s outcomes.
    This level has two process attributes: process management and process control;

    - Optimizing (level 5): The process is continuously improved to enable it to achieve
    relevant control, and projected goals. This level has two process attributes:
    process innovation and process optimization.


    Furthermore, each capability level can be achieved only when the level below has
    been fully achieved as shown in Table 3.1. For example, a process capability level
    4 (predictable) requires the process management and process control attributes
    to be medium and primarily achieved, on top of full achievement of the attributes
    for a process capability level 3 (established).


    The COBIT framework was selected for this research. It was explicitly developed
    to guide IT governance and is extensively utilized throughout the public and private
    sectors for this purpose. It is important to note that in many previous studies,
    the decision to utilize all or a of IT processes from COBIT was based on the opinion
    of the researchers. As a result, no consistency for selecting specific IT processes
    was provided for a given context, which also makes it difficult to compare results.
    Consequently, the following section explores previous studies that have attempted
    to adapt the COBIT framework to evaluate IT governance.'
