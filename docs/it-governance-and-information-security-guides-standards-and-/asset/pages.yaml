  md: '254 IT Governance and Information Security


    # 8.2.1 The ISO/IEC 2700x Family


    Several standards, methods, and repositories of good practices in information
    systems security are available. They constitute methodological guides and the
    means to guarantee a coherent security approach.


    ISO has undertaken a significant effort to streamline existing work, resulting
    in the ISO/IEC 27000 series of standards. This number corresponds to the reservation
    of a series of safety standards. To date, only standards 27000, 27001, 27002,
    and 27006 are published. Some are mandatory to obtain certification, and others
    are more guides:


    +   - ISO/IEC 27000 presents the vocabulary and definitions of the security field,
    applicable to each of the standards;

    - ISO/IEC 27001 describes the information systems security management practices
    within a company that serves as a reference for certification;

    - ISO/IEC 27002 is the good practice guide for IS security;

    - ISO/IEC 27003 is intended to be an implementation guide;

    - ISO/IEC 27004 will be a new standard for steering indicators and measures in
    the field of IS security;

    - ISO/IEC 27005 will be a new standard on risk management for IS security;

    - ISO/IEC 27006 summarizes the requirements applicable to external auditors in
    their ISO 27001 certification assignment.


    As shown in Figure 8.3, ISO/IEC 27001 is the center of gravity of the ISMS referential.


    ![](img/62b08fcc83049d99252c223afe5d1c9e_272_0.png)


    FIGURE 8.3 The ISO 2700x series.'
