    Its objective is to control engineering processes, and consequently, the quality
    of the products and services resulting from these processes. It provides a reference
    for best practices in software development.


    The CMMI is an extension of the CMM (Capability Maturity Model), presented by
    the SEI (Software Engineering Institute) in the 1980s.'
