  md: '# 7.2.3 Framework Maturity Profile


    The bottom line on information security is that the threat environment of today
    is simply too dynamic. The only practical and survivable defense strategy is to
    move to a more mature security model that integrates multiple layers of protection
    technology.


    We propose a mature and systematic approach to information security governance.
    Adopting a security maturity strategy requires a full range of protection, management,
    and defensive features that can be integrated and fully of operation.


    Concerning each security practice objectives SPO outlined in Table 7.1, the framework
    defines a five-level maturity that serves as the basis for understanding an organization''s
    ISG capability and provides a foundation for capability improvement planning.


    +   **Level 0 – None:** No process or documentation in place;

    **Level 1 – Initial:** Maturity is characterized by the ad hoc definition of information
    security strategy, policies, and standards. Physical environment and IT component
    security are only locally addressed. There is no explicit consideration of budget
    requirements for information security activities and systematic management of
    security risks. Access rights and the security of data throughout its lifecycle
    are managed at best using informal procedures. Similarly, security incidents are
    managed on an ad hoc basis;

    **Level 2 – Basic:** Maturity reflects the linking of a basic information security
    strategy to business and IT strategies and risk appetite in response to individual
    needs. It also involves the development and review of information security policies
    and standards, particularly after significant incidents. There is some consideration
    of security budget requirements within IT, and requirements for high-level security
    features are specified for major software and hardware purchases. A basic risk
    and vulnerability management process are established within IT according to the
    perceived risk. The access rights control and management depend on the services
    provided by the provider. Processes for managing the security of data throughout
    its life cycle are emerging. Major security incidents are tracked and recorded
    within IT;

    **Level 3 – Defined:** Maturity reflects a detailed information security strategy
    that''s regularly aligned to business and IT strategies and risk appetite across
    IT and some other business units.


    Information security policies and standards are developed and revised based on
    a defined process and regular feedback. IT and some other business units have
    agreed on IT component and physical environment security measures. IT budget processes
    acknowledge and provide the most important information security budget requests
    in IT and some other business units. The security risk management process is proactive
    and is jointly shared with corporate collaboration. Access rights are granted
    on the basis of a formal and audited authorization process. Detailed methods for
    managing data security throughout its life cycle are implemented. Security incidents
    are handled based on the urgency to restore services, as agreed upon by IT and
    some other business units;'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Level 4 – Managed: Maturity is characterized by regular, enterprise-wide improvement
    in the alignment of the information security strategy, policies, and standards
    with business and IT strategies and compliance requirements. IT component security
    measures on IT systems are implemented and enterprise-wide for threat detection
    and mitigation. Physical environment security is integrated with access controls
    and surveillance systems across the enterprise. Detailed security budget requirements
    are incorporated into enterprise-wide business planning and budgeting activities.
    A standardized security risk management process is aligned with a firm risk-management
    process. Data are adequately preserved and audited throughout its life cycle,
    and data availability is an effective requirement. Recurring incidents are systematically
    addressed enterprise-wide through problem-management processes that are based
    on the root cause analysis;


    Level 5 – Optimized: Maturity reflects an information security strategy largely
    aligned to business and IT strategies and risk appetite across the business ecosystem.
    Information security policies and standards are periodically reviewed and revised
    on the basis of the input from the business ecosystem. The management of IT component
    security is optimized by the security framework layers. Physical access and environmental
    controls are regularly improved. Security budget requirements are adjusted to
    provide adequate funding for the current and future security purposes. The security
    management process is agile and adaptable, and tools can address the business
    ecosystem’s requirements. The control and management of access rights are dynamic
    and can effectively deal with the organizational restructuring of acquisitions
    and divestitures. Processes for managing data security throughout its life cycle
    are continuously improved. Automated incident prediction systems are in place,
    and security incidents are effectively managed.


    # 7.3 USE CASE


    The pre-established questionnaire took into account the realities of the organization.
    At the end of this survey, and following a metric, we evaluated the deviations
    from the norm and assessed the level of maturity concerning the different aspects
    of our framework. The audit questionnaire consists of 100 questions divided into
    different objectives and control of the information security governance inspired
    by best practice guides ISO 27001 (Johnson, 2014) and OWASP (Delensyer et al.,
    2009). Each item is assigned a weighting coefficient on the effectiveness of the
    reference system to which the question relates regarding risk reduction. After
    the validation of the questionnaire, the chosen answers were introduced into the
    software maturity framework to allow the automation of the processing and to determine
    the maturity score. The treatment considers calculating a weighted average of
    the scores obtained according the chosen responses and the efficiency coefficient.
    The result is a numerical result (0–5 or expressed as a percentage), representing
    the audited IS level of security (maturity).'
