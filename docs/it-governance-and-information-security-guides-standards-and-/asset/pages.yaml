- pgno: 140
  md: '# IT Governance and Information Security


    The adapted ITG framework contains six processes from COBIT used by previous studies
    to evaluate ITG processes. These are as follows:


    +   - DSS05 Manage Security Services;

    - APO13 Manage Security;

    - EDM03 Ensure Risk Optimization;

    - EDM02 Ensure Benefits Delivery

    - DSS02 Manage Service Requests and Incidents;

    - DSS04 Manage Continuity.


    The remaining ten IT processes:


    +   - DSS04 Manage Continuity;

    - APO12 Manage Risk;

    - APO02 Manage Strategy;

    - EDM04 Ensure Resource Optimization;

    - EDM01 Ensure Governance Framework Setting and Maintenance;

    - DSS03 Manage Problems;

    - BAI06 Manage Changes;

    - APO06 Manage Budget and Costs;

    - DSS01 Monitor, Evaluate and Assess Performance and Conformance;

    - BAI09 Manage Assets.


    The proposed framework was considered appropriate by many methods, including triangulation
    and the perceived relevance of the evaluation program. The trial of the ITG framework
    showed that it contained few evaluation measures that were not relevant to other
    jurisdictions in MENA or international organizations, which suggests that its
    development was appropriate. The results of this study show


    +   - The overall level of process capability in the MENA port organizations is
    relatively modest;

    - Undertaking IT governance evaluation based on COBIT 5 is significantly more
    rigorous than earlier versions of the framework;

    - There is considerable inter-process variability in capability levels as some
    processes were expected to have a relatively high capability level were relatively
    underdeveloped;

    - There is a similar inter-organizational variation in process capability and
    maturity within the MENA port organizations, which appears to be linked to the
    organizational size.


    The results demonstrated that mid and large organizations tend to have higher
    IT governance maturity than smaller organizations. Therefore, when studying organizations
    with approximately 10,000 employees, IT governance maturity levels of between
    2.5 and 3 should be expected. Insufficient literature exists to determine whether
    that maturity level is sufficient or not.'
