  md: '# 274 IT Governance and Information Security


    +   * The protection of the information assets essential to the performance of
    its activities;

    * Minimize the risk of information unavailability or alteration;

    * Ensure and guarantee the brand image.


    # 8.4.7.2 The Scope of the IS Security Policy


    The IS Security Policy applies to the following contexts:


    +   * Computer, network, and telecom equipment;

    * Software and computer data;

    * Information system services;

    * Bank premises at the central and regional level;

    * Human resources.


    # 8.4.7.3 Review and Evaluation


    The security policy must be reviewed regularly. Regular reassessment (at least
    once a year) ensures its relevance and effectiveness. The organization of this
    revision is the responsibility of the PUBLIC_ORG ISSR.


    # 8.4.7.4 Compliance with Policy


    PUBLIC_ORG requires any natural or legal person who accesses its information to
    respect the information security policy and the procedures, charters, mandates
    that result from it.


    # 8.4.7.3 Asset Management


    # 8.4.7.1 Property Inventory


    An inventory of all assets (activities, data, applications, and infrastructures)
    of the information system must be carried out. This inventory should not be limited
    to physical assets. Inventory monitoring and updating must also be ensured. An
    owner must be designated for each asset (activities, data, applications, and infrastructure).
    The IS security officer must be responsible for updating the inventory.


    # 8.4.7.2 Classification of Information and Assets


    Assets (activities, data, and infrastructures) must be classified in terms of
    values, legal or regulatory requirements, sensitivity, or criticality concerning
    availability, integrity, confidentiality, and traceability (DICT) criteria.


    Such classification makes it possible to better fight against threats that could
    harm PUBLIC_ORG. The impact analysis conducted by the process owner, assisted
    by the safety manager, enables the value of the IS asset, and therefore, its sensitivity
    level to be assessed.


    # 8.4.7.4 Human Resources Security


    # 8.4.7.41 Transfer and Departure of Staff


    Any transfer or departure of an employee automatically entails updating or suppressing
    his access rights. The line manager decides the new access rights to the employee''s
    new tasks. The departments and services concerned must notify the Information
    System Department, by a note, of any change in the status of an employee.'
