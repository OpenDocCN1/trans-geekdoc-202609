  md: '# 34 IT Governance and Information Security


    # 1.2 SUMMARY


    The company''s master plan, a strategic plan designed to pilot IT development
    in the company, by translating its strategy into actions relating to the information
    system, has mostly satisfied these needs. However, agility has become a necessary
    quality, especially in a constantly unstable economic environment, making it necessary,
    even indispensable.


    IT agility has become the primary purpose of any information systems department;
    more than that, it is a quality that any company must meet to have the customers''
    needs, effectiveness challenges and rapid technological evolution.


    Faced with the various transformations and needs of the internal and/ external
    environment, it is essential to structure the EIS to facilitate its evolution
    and modify its position, structure, skills, all in harmony with the strategic
    evolution of its company, ensuring overall consistency in permanent IT governance
    with the global strategy, interoperability, integration, autonomy, flexibility.
    However, the EIS must be agile.


