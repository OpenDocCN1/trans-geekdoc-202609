    # 1.1.1 Information System Definition and Objective


    Nowadays, organizations are more open to the outside world than before, forcing
    managers to seek the adequacy and coherence between external and internal factors
    and the content of the company''s strategy. As such, information is the nerve
    center of war and development. The need to collect, process, and diffuse information
    and the need for increased coordination of activities inside and between companies
    are emerging sources of competitive advantage (Figure 1.2).


    The information system addresses these through new information technologies and
    the implementation of KMSs appropriate to the technologies acquired to put knowledge
    to the company''s benefit and facilitate the internal distribution of knowledge
    (Galliers, 2006). ICT-based KMS accelerate information flows, remove value-added
    tasks, enhance process reliability and quality, support tacit and explicit knowledge,
    promote knowledge sharing across the organization, and facilitate decision-making
    (Halawi et al., 2005; Wickramasinghe, 2003). However, new information technologies
    do not always guarantee the efficiency of modern information systems, which require
    critical success factors. The continuous and coherent evolution of information
    systems constitutes the major problem facing companies with some issues, including
    the integration, interoperability, and agility of information systems in the context
    of their company strategy to ensure evolution in correlation with unpredictable
    and external changes.'
