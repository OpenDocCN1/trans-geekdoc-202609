  md: '# 7.3.2 Data Analysis


    The pre-established questionnaire took into account the realities of the organization.
    At the end of this survey, and following a metric, the authors evaluated the deviations
    from the norm and assessed the level of ISG maturity regarding the different axes
    of the framework. The audit questionnaire consisted of 110 questions divided into
    different ITSG objectives and controls inspired by best practices ISO 27000 (Johnson,
    2014) and COBIT (Deelyersnyder et al., 2009). Each item is assigned a weighting
    coefficient on the effectiveness of the rule of the reference system to which
    the question regards risk reduction. After the validation of the questionnaire,
    chosen answers were introduced to the software framework used to allow the automation
    of the processing and to determine the ISG maturity score. The treatment consists
    of calculating a weighted average of the scores obtained according to the chosen
    responses and the efficiency coefficient. The result is a numerical result (0–5
    or expressed as a percentage) representing the level of maturity of the audited
    ISG.


    # 7.3.3 Conducting Assessments


    A comprehensive picture of integrated security assurance activities is created
    by measuring an organization based on defined security practices. This type of
    evaluation is helpful in understanding the extent of the security activities currently
    in place in an organization. Also, it allows the organization to use the maturity
    framework to create a future roadmap for continuous improvement.


    An important first step of the assessment is to define the assessment scope. An
    assessment can be carried out for a complete organization or selected business
    units. This scope should be agreed upon with the key stakeholders involved (Figure
    7.2).


    ![](img/62b08fcc83049d99252c223afe5d1c9e_243_0.png)


    FIGURE 7.2 Conducting assessment model.'
