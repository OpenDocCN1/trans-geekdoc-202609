    # 8.2.1.5 Other ISO 27000 Standards


    In addition to ISO 27001 and 27002, there are several other ISO standards in the
    27000 range. These other standards guide and support ISO 27001/27002 for both
    organizations and auditors.


    # 8.2.1.5.1 ISO 27003


    ISO 27003 is used as the implementation standard for ISO 27001. This standard
    is intended to obtain management approval, define CMSS, conduct an organizational
    analysis and a risk analysis.


    # 8.2.1.5.2 ISO 27004


    ISO 27004 is a standard that helps measure the effectiveness of ISMS. ISO 27004
    includes the following chapters:


    +   * Overview of Information Security Measurement; Management Responsibilities;

    * Measurement and development;

    * Measurement operation;

    * Data analysis and reporting on measurement results;

    * Evaluation and improvement of the information security measurement program.


    # 8.2.1.5.3 ISO 27005


    ISO 27005 is a standard that guides the implementation of ISO 27001. ISO 27005''s
    approach begins by setting the context – defining the scope (primary processes
    and related assets) and boundaries of the organization. When defining the scope,
    a risk analysis will be carried out. Risk analysis consists of identifying the
    assets and the threats they face. In addition, the impact of a successful exploitation
    of a certain threat must be analyzed. When this is done, for each threat, an estimate
    of the likelihood that the threat will be successfully exploited will be multiplied
    by the costs of the impact of that exploitation. Based on this list, each risk
    should be mitigated by implementing controls, risk acceptance, risk avoidance,
    or risk transfer.'
