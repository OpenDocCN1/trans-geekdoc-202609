    # 5.22 SUMMARY


    In the era of digitalization and uncertainty, cloud computing constitutes an important
    evolution. It provides attractive characteristics such as mobility, scalability,
    pay-per-use, and profitability. This study aimed to define the determinants of
    cloud computing adoption based on innovation characteristics and organizations''
    technical, organizational, and environmental contexts and how agility is evolving
    in cloud computing and proposing a conceptual model that incorporates DOI theory
    and TOE structure. The model was evaluated through a quantitative study from 200
    MENA region medium and large enterprises.


    Results showed that agility, costs savings, security, privacy and confidence,
    technology readiness, and data sovereignty directly affect a company''s cloud
    computing adoption. Results analysis confirmed agility''s direct effect on cloud
    adoption.


