    enterprise should provide ‘Information Security Governance: Guidance for Boards
    of Directors and Executive Management’, 2006. It also notes that the assessment
    of process capability based on the COBIT maturity models is a key part of IT governance
    implementation as shown in Figure 3.1.


    Although obtaining an objective view of an organization’s IT performance through
    maturity models has been described as a challenging undertaking, COBIT enables
    the measurement of IT capability as a portfolio by assessing IT processes’ maturity
    (Chen et al., 2008). Evaluating IT governance can be based on the Process Capability
