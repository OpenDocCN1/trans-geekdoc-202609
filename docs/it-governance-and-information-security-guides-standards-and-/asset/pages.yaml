- pgno: 116
  md: 'in the financial sector environment. Published mixed-methods studies (De Haes
    & Van Gremberg, 2006; Hiererra, 2012; McEvoy & Richards, 2006; McGuire, 2016)
    suggest that social researchers used mixed-methods approaches for one or more
    of the following purposes: providing a complete picture, improving accuracy, compensation
    for strengths and weaknesses, and, more importantly, developing robust analysis
