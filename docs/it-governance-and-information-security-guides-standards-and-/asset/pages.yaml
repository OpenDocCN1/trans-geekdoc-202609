    the responses received in it will make it possible to evaluate the levels of maturity
    of the IS. In this context, we refer, for this exhaustive questionnaire, to the
    standard ISO/IEC 27002:2013 as defined in Appendix 1 (Table 8.4).


    The study found that the organization has an information security policy and helps
