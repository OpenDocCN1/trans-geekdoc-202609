- pgno: 293
  md: '# ## 8.7.4.2 Information Security Awareness and Training


    The IS Security Policy must be assimilated, implemented, and maintained at all
    levels of the organization. The involvement of all employees is necessary for
    this policy to be a success and for the defined level of safety to be achieved.


    Users must be aware of information security issues, threats, and good practices.
    They must thus be able to support PUBLIC_ORG''s security policy within the regular
    and daily framework of their work.


    # ## 8.4.7.5 Physical and Environmental Safety


    # ### 8.4.5.1 Access to Buildings


    PUBLIC_ORG has taken measures to reduce access to its buildings. All visitors
    and external speakers must identify themselves and visibly wear a badge throughout
    their visit on the PUBLIC_ORG site.


    # ### 8.4.5.2 Security Service


    A security service (from 7 am to 7 pm) ensures the physical security and operation
    of the PUBLIC_ORG building. An external company provides the security service.

    In this sense, the security service must record the CIN number of visitors in
    the access register.

    A remote monitoring system must be put in place.


    # ### 8.4.5.3 Datacenter Security


    Security zones must be located and protected to reduce the risks posed by environmental
    threats and hazards (fire, flood, earthquake, explosion, or other types of disasters).
    The following measures may be required to enhance physical security:


    +   * Automatic fire detection and suppression systems;

    * Protection against water damage;

    * Air conditioning safety;

    * Protection against electrical incidents;

    * Surveillance cameras;

    * False floors;

    * Protection against physical access.


    # ### 8.4.5.4 Disposal of Such Sensitive Assets


    Equipment used to store sensitive information (data) for disposal must be destroyed
    effectively to prevent recovery attempts.


    # ## 8.4.7.6 Operations Management


    # ### 8.4.6.1 Development of Operating Procedures


    Operational procedures related to the management and operation of information
    processing facilities shall be documented and maintained. The management and the
    use of information processing resources must be formalized through operational
    procedures. These procedures shall include the measures necessary to address the
    security needs expressed.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 8.4.7.6.2 Backup Procedures


    A backup policy must be defined for sensitive or critical PUBLIC_ORG information,
    applications, and systems based on the analysis of business impacts carried out
    in collaboration with information owners and business departments.


    Backups must be performed regularly, tested, and protected appropriately. Regular
    recovery tests ensure that backups have been performed correctly and that backup
    media is readable. To ensure the protection of backup media, the following steps
    can be taken:


    +   - Conservation at a remote site;

    - Storage in a secure location (fireproof box, locked cabinet).


    # 8.4.7.6.3 Management of Traceability of Operations


    Traceability of safety-related operations and events must be ensured. Traces of
    events must also be kept secure. Regular analyses and reviews of trace files should
    be performed by the CISO.


    # 8.4.7.6.4 Use of Communication Tools (Internet, Intranet, Messaging)


    Information technologies, such as the Internet or intranet, are necessary for
    business activities. However, their advantageous features may present risks related
    to PUBLIC_ORG environment.


    The use of communication tools must be regulated and integrated into PUBLIC_ORG''s
    resources use charter.


    Particular attention should be paid to the presence of wireless networks that
    could compromise the access control devices envisaged.


    # 8.4.7.6.5 Maintenance of IT Assets and Environmental Equipment


    IT assets (servers, databases, network, workstations, etc.) and environmental
    equipment (inverters, fire detection systems, etc.) must be adequately maintained
    to ensure their proper operation.


    This maintenance must be carried out regularly to avoid incidents related to equipment
    obsolescence and poor maintenance.


    # 8.4.7.6.6 External IT Service Providers


    Suppliers, external consultants, and subcontractors working for PUBLIC_ORG are
    subject to PUBLIC_ORG information security policy. External providers who access
    the information system must sign a confidentiality agreement that defines the
    rules, rights, and obligations that they must comply with to guarantee.


    # 8.4.7.7 Access Controls


    # 8.4.7.7.1 System Access Control Standard


    All users of the IT system must have an identifier to ensure optimal management
    of access controls, individual accountability, and the creation of complete audit
    reports. The user ID linked to a user must not be shared. Shared identifiers must
    be limited and restricted in use.'
