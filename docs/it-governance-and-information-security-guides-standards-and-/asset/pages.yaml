    Davenport (1993) defines a business process as


    a structured and measured framework of activities designed to produce a specific
    output for a customer or market. This involves focusing on how work is done within
    an organization, rather than focusing on the product. Therefore, a process is
    a order of activities across time and space, with a clearly defined beginning
    and end, and outputs: a structure for action.


    There are several business processes: Approaches characterize this notion (Alonso
    et al., 1997; Rummler & Brache, 2012). The first structure defines processes in
    terms of their direct/indirect contribution to value creation. The approach (Rummler
    & Brache, 2012) distinguishes primary processes, which are in direct contact with
    the customer and directly generate value, from supporting processes.


    The BUSINESS PROCESS captures these aspects. The typology of Alonso et al. (1997)
    is used to characterize the values of the business process facet as shown in Table
    2.1.


    +   - CHANGE


    CHANGE management refers to the management of the organization’s transformation
    processes and its business or IT processes. Ploesser et al. (2008) propose a typology
    of change processes:


    +   - Change by substitution: The temporary replacement of one business process
    by another, structurally different business processes, and usually responding
    to an unforeseen event such as emergency;

    - Adaptive change: The temporary adaptation of the structure of a business process
    in relation to a planned and temporary event, without erasing the structural identity
    of the process;

    - Change by evolution: The changes made in the business process are permanent.
    They considerably modify the structural composition of the process or its type.


    The classification of Ploesser et al. (2008) is taken on the typology of business
    process changes and adapts it to propose the values of the change facet. Changes
    can be as follows: (i) ad hoc, this is the case for unchanged changes; (ii) evolutionary,
    when an improvement is envisaged; and (iii) corrective, which processes are adapted
    to execution.


    In the context of IT governance, changes occur in business processes and IT development
    and maintenance projects. The CHANGE facet captures this aspect and takes its
    values from an enumerated domain that includes ad hoc, evolutive, and corrective
    values, as shown in Table 2.1.


