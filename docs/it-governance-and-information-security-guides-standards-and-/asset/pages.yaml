- pgno: 64
  md: '# IT Governance and Information Security


    IT governance consists of structures, processes, and operational mechanisms that
    work together to ensure IT investments and business objectives are aligned (De
    Haes & Van Gemenberg, 2005). The cornerstone of IT governance is to provide decision-makers
    an acceptable level of assurance that an organization''s strategic objectives
    are not jeopardized by IT failures (Benarach & Chernobai, 2021). A conventional
    or, rather, invariable approach for attaining a level of assurance includes evaluating
    the IT governance system in place. The evaluation was born to assess the degree
    of conformance with standard practice by utilizing methodologies and frameworks
    (Vlietland et al., 2016). In this particular means that by engaging in IT governance,
    organizations can periodically measure IT governance performance using well-known
    worldwide frameworks or methods such as Control Objectives for Information and
    Related Technology (COBIT), IT Framework Library ITIL, or the International Standards
    Organization''s ISO 38500, to name few.


    A range of literature examines IT governance structures and mechanisms (De Haes
    & Van Gemenberg, 2005; Guldentos et al., 2002; McKay et al., 2003; Peterson et
    al., 2002; Wim Van Gemberg & de Haes, 2009) explores factors influencing adoption
    and implementation of IT governance systems (Aasi et al., 2014; Reich & Benbasat,
    2000), and the use of codified frameworks and their impact on IT governance (El-Mawy
    et al., 2015; Guldentos, 2002; Wim Van Gemberg & de Haes, 2009; Weber). The literature
    also indicates that, while there is the widespread use of governance frameworks,
    more research is needed to investigate how these frameworks could be modified
    to fit a specific circumstance or context (Maleh et al., 2018). Aspects involving
    behavior in IT governance, although they have been long acknowledged (Grunwal
    & Sahama, 2016; Herath & Rao, 2009), have received less attention from academics
    (Smits & Hillebersberg, 2015).


    Several IT frameworks can guide the implementation of an IT governance program.
    Although frameworks and guidelines such as CoBIT, ITIL, VaIT, and ISO 38500 (Prieto-Diaz,
    1991) have been widely adopted, there is no absolute standard IT governance framework;
    the combination that works best for an organization depends on business factors,
    corporate culture, maturity, and staffing capacity. The level of implementation
    of these frameworks will also vary by organization (Maleh et al., 2019).


    This chapter presents the state of the research on the implementation of information
    technology (IT) governance through an analysis of the various proposed standards.
    This analysis was conducted on the basis of a meta-model of four frameworks. This
    chapter is organized as follows. The first part describes the proposed reference
    framework for IT governance. Five recognized approaches are then evaluated under
    this framework. Finally, this chapter highlights the gaps in current approaches,
    our positioning concerning the literature, and its contribution to IT governance.


    # 2.2 RESEARCH METHODOLOGY


    This section proposes a meta-model to evaluate IT governance ITG approaches. This
    model is built around facets capturing a specific dimension of information governance.
    The principle of was was introduced in Jarke et al. (1992) for software engineering.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# IT Governance and Information Security 47


    framework is not intended to describe governance activities but to organize governance
    approaches along analytical lines that remain relevant to us.


    The framework is structured around four poles or ''words''. The four words have
    been used in various engineering disciplines: IS engineering (Jeranke & Pohl,
    1993), requirements engineering (Rolland, 1998), process engineering (Nurcan &
    Roland, 2003), and change engineering (Nehan & Deneckere, 2007). The framework
    has been used for IT governance engineering and component-based situational method
    engineering (Prieto-Diaz, 1991).


    Facets supplement it according to the approach in ''Information Security Governance:
    Guidance for Boards of Directors and Executive Management Guidance for Boards
    of Directors and Executive Management'' (2006). The aim is to allow a flexible
    and precise classification of software components is based on the enumeration
    of component descriptors, their association with a lexicon of terms (thesaurus),
    and a graph of facets. The initial framework of the four words has been adapted
    by facets that describe elements. Each facet can define a predefined value by
    a ''value domain'':


    +   * A simple value domain refers to a predefined primitive type. This is the
    case of integer or real value;

    * An overall value domain (SET[b...]) refers to a structured type. For example,
    a vector with n dimensions is typically structured on n elements;

    * A listed value domain (Enum[a, b...]) refers to a listed type. Thus, a mention
    for a diploma is from a listed field and can take its value among the values defined
    on Enum(''Fairly Good'', ''Good'', ''Very Good'').


    The metamodel in Figure 2.1 presents the proposed framework.

    The framework is obtained by instantiating the metamodel described in Figure 2.1.
    The governance literature allows us to define the values taken by the attributes
    of the metamodel classes. The framework is presented in Figure 2.2 and comprises
    the following four words:


    +   * The word ''subject''. It presents IS governance as the object of analysis
    and identifies its intrinsic characteristics. Governance is described as an organizational
    structure for decision-making concerned with the simultaneous evolution of IT
    projects, business processes, and IT processes;


    | Terms of Reference | 4 | Word |

    |---|---|---|

    | +name: String | 1 | +name: String |

    | | | Simple | Set | Listed |

    | | | | Facet |

    | | | +name: String | Value Domain |


    FIGURE 2.1 The proposed meta-model to evaluate IT governance frameworks.'
