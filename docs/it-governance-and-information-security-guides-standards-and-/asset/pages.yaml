    1997 define change readiness as the ability of information systems (IS) organization
    to provide strategic IT applications in short development cycles using a highly
    skilled IT workforce.


    IS organization requirements have been addressed in several conceptual documents.
    One of the primary antecedents of a flexible IS organization is a partnership
    relationship between the IS organization and the company. IT departments are advised
    to adopt a matrix organizational structure while simultaneously supporting customer-focused
    development and service processes. Often referred to as a center of excellence
    (Clark et al., 1997; Gerth & Rothman, 2007), it distinguishes technical and control
    tasks from business development tasks. Generally, an IT organization should to
    become an emerging organization and create virtual teams to promote close collaboration
    with business units (Prager, 1996).


