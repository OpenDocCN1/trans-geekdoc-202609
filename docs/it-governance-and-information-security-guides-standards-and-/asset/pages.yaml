- pgno: 233
  md: '# Information

    Security Governance

    A Maturity Framework Based on ISO/IEC 27001


    # 7.1 INTRODUCTION


    Many organizations today face a global governance revolution that could directly
    impact their information management practices. Information security has become
    an integral part of daily life, and organizations must ensure that their information
    security systems are an integral part of everyday life.


    In a distributed and dynamic services environment, security must not be limited
    to providing a strategy taking into account business, organizational, and technical
    dimensions (Nassar et al., 2009). Besides, security must be seen as an ongoing
    process that aims to optimize security investments and ensure the sustainability
    of the security measures implemented (Lomas, 2010). However, reference service
    domain models and architectures have underestimated the definition of security
    needs, the assets to be protected, and the identification of these assets (Huang
    et al., 2006; Williams, 2007). We propose approaching the problem of security
    by a practical approach of governance, allowing us to identify the various aspects
    of IT security and propose adequate security measures to the context. However,
    IT security governance is a real challenge in an open collaborative service environment
    (Maleh et al., 2018). Improving security has emerged as one of the IT priorities
    across all business lines.


    Areas as the aerospace industry and strategic resources can be ideal targets for
    cyber espionage by nation-states. Others managing financial assets or large-scale
    credit card information are equally attractive to international criminal groups
    (Posthumus &'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 216 IT Governance and Information Security


    von Solms, 2004; Humphreys, 2008). These malicious actors no longer content themselves
    with thwarting the means of technical protection. Instead, they survey and exploit
    various weaknesses in the targeted environment (Galliers & Leiden, 2014). These
    shortcomings are technological and result from failures in protection procedures
    or gaps in vulnerability management practices. If misused, the best technology
    in the world will not provide an adequate defense against such threats (von Solms
    & van Niekerk, 2013).


    IT and security executives have to make complex calculations and decisions about
    security with limited information (Dhillon et al., 2016). They need to make decisions
    that are based on analyzing opportunities, risks, and security. In an uncertain,
    information security governance (ISG) issues are at the forefront of any discussions
    for security organization''s information assets, which includes considerations
    for managing risks, data, and costs. Organizations worldwide have adopted practical
    and applied approaches for mitigating risks and managing information security
    programs (Maleh et al., 2018; Yassine Maleh, 2018).


    The problem is that the security governance framework is designed to guide organizations
    in their IT security strategy but does not define the practical framework for
    the engagement in this strategy. Some repositories (NIST, Cobit, ISACA, and RiskIT)
    and international standards (ISO 27000 and ISO 15408) now include paragraphs on
    governance to address these concerns. The first reports or articles in academic
    journals that evoke the governance of information security date back to the early
    2000s. The proposed referred and best practices are designed to guide organizations
    in their IT security governance strategy. However, it does not define the practical
    framework to implement or measure the organization''s engagement in IS security
    governance (Yassine Maleh et al., 2021). The main contributions of the proposed
    frameworks are as:


    +   - It includes standards, methodologies, procedures, and processes that align
    policy, business, and technological approaches to address information security
    governance;


    +   - It provides a prioritized, flexible, repeatable, performance-based, and
    cost-effective approach, including information security measures and controls,
    to help owners and operators of critical infrastructure identify, assess, and
    manage information security;


    +   - It identifies areas for improvement to be addressed through future collaboration
    with particular standards and standard-developing organizations;


    +   - It is consistent with voluntary international standards (IS27000, NIST,
    COBIT, ISACA).


    This chapter proposes a practical maturity framework to evaluate the organization''s
    maturity state and improve the IS security governance level according to their
    needs and resources. This chapter is structured as follows. Section 2 presents
    the theoretical frameworkwork and describes the proposed capability maturity framework
    for information security governance. Section 3 discusses the results of the implementation
    through a practical use case. Finally, section 4 presents the summary of this
    chapter.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 7.2 THEORETICAL FRAMEWORK


    ISG frameworks can be successfully implemented by adopting best practices (Williams,
    2001). Von Solms (2005) indicated that companies realize that instead of establishing
    information security governance environment on an ad hoc basis, it is preferable
    to follow an internationally recognized framework. Several resources can be used
    as a guide for information security governance, for example:


    +   - Control Objectives for Information Technology and Related Technologies (COBIT)
    that help mitigate risk, assess the maturity of strategic alignment and value
    of IT delivery (Mataracoglu & Ozkan, 2011; Rau-Kounovsky et al., 2010; Saetang
    & Haider, 2011; Simmonson et al., 2008)

    - National Institute of Standards and Technology (NIST) IT Governance) 2008 (Dlamini
    et al., 2009)

    - International Organization for Standardization (ISO/International Electromechanical
    Commission (IEC) 27000 family of safety standards (ITG, 2008) that are ISO17799
    (Spafford, 2003) and ISO27001 (Mataracoglu & Ozkan, 2011)

    - Certified Information Systems Professional (CISSP) (Harris, 2007)


    Von Solms (2005) discussed the advantages and disadvantages of COBIT and ISO17799
    and stated that both are good for information security governance and are complementary,
    when used together, can bring benefits to the organization. COBIT allows information
    security to be integrated into a broader IT framework, which means that it is
    available if the company decides to integrate the rest of the framework. WORKBIT
    focuses on what needs to be done but does not provide detailed guidelines on how
    to do it, but only addresses information security and is not integrated into a
    broader IT governance framework. ISO17799, on the other hand, provides more detailed
    guidance on how things should be done, is the only framework that allows an organization
    to obtain third-party audit certification (Saint-Germain, 2005).


    The IT Governance Institute (ITG, 2008) recommended that a framework be established
    and maintained by the management to guide the development and maintenance of an
    information security program to achieve effective information security governance
    (Spafford, 2003). Several compelling reasons why organizations should instead
    adopt established standards, such as a well-defined structure, have been developed
    and evaluated over many years by many individuals and organizations. They provide
    a platform for knowledge sharing among organizations, and they also facilitate
    the certification of organizations against a basic standard from which improvements
    can be recommended.


    The following section presents a maturity framework based on practices that integrate
    the technical, process, and human dimensions. The framework is based on the fact
    that the pace and manner in which an organization can respond proactively to new
    and emerging security threats depend on the maturity of its ISG capacity. The
    fundamental pillars of the framework must be flexible and responsive to the changing
    landscape of'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 218 IT Governance and Information Security


    information security; by developing their capabilities to detect, assess, and
    respond to new emerging security threats, organizations can position themselves
    more proactively and efficiently and continuously secure information resources.


    # 7.2.1 Framework Overview


    We propose a global maturity framework to achieve an effective information security
    governance and governance approach, as shown in Figure 7.1. The path to security
    maturity requires a diversified range of layered endpoint protection, management,
    and capabilities, all integrated and fully automated. The only practical and survivable
    defensive strategy is moving to a more mature security model that incorporates
    multiple layers of protective technology.


    The proposed framework focuses on determining the capacity of an organization
    to directly oversee and monitor the actions and processes to protect documented
    and digitized information and information systems to ensure protection against
    access, unauthorized use, disclosure, disruption, alteration, or destruction,
    and to guarantee confidentiality, integrity, availability, accessibility, and
    usability of the data (Kenneally et al., 2012). The framework extends the triad
    confidentiality, integrity, and availability with accessibility and usability
    concepts. Concerning accessibility, a failure to support and understand how security
    can change work practices can impede how data and information are accessed, shared,
    and acted on in an increasingly dynamic, competitive


    ![](img/62b08fcc83049d99252c223afe5d1c9e_236_0.png)


