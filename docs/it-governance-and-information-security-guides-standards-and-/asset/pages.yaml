  md: '# Section 2: Maturity Frameworks for Information Technology Governance


    Chapter 3, ''IT Governance in Organizations: A Maturity Framework based on COBIT
    5'', provides a deeper understanding of IT governance frameworks and their adoption,
    drawing on established information systems theories. A mixed two-stage approach
    using quantitative and qualitative studies is used to examine the feasibility
    of developing an IT governance framework based on COBIT.


    Chapter 4, ''IT Service Management as a key pillar for IT Governance: A Maturity
    Framework Based on ITIL4'', proposes a practical maturity framework to improve
    ITSM/ITAM processes with the addition of two drivers: agility and security.


    Chapter 5, ''Cloud Computing as a Key Pillar for Agile IT Governance'', proposes
    a conceptual framework to improve IT agility, through cloud computing. One of
    the primary motivations of this research is the lack of fieldruck when considering
    how cloud computing improves system''s agility.


    # Section 3: Maturity Frameworks for Information Security Governance


    Chapter 6, ''Information Security Governance: Best Practices in Organizations'',
    aims to explore the engagement processes and the practices of organizations involved
    in a strategy of information security governance.


    Chapter 7, ''Information Security Governance: A Maturity Framework Based on ISO/IEC
    27001'', aims to discuss information security governance and to address the weaknesses
    identified in the literature. Based on ISO/IEC 27001 framework and practices of
    information security management and governance described in Chapter 6, the authors
    propose a practical maturity framework for information security governance and
    management in organizations.


    Chapter 8, ''Information Security Policy: A Maturity Framework Based on ISO/IEC
    27002'', aims to guide organizations in their approach to implementing an IT Security
    policy. The purpose is to present a practical model of IT security policy based
    on ISO/IEC 27002 through a case study.


    The last section of this book will summarize the different contributions while
    highlighting the challenges and limits of current IT governance and information
    security strategies.


