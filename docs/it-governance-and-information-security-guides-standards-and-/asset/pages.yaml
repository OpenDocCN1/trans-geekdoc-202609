    # 2.5.3 Implementation Tiers


    Implementation tiers describe the extent to which an organization’s cybersecurity
    risk management practices exhibit the characteristics defined in the Framework,
    ranging from partial (tier 1) to adaptive (tier 4).


    # 2.5.4 Framework Profile


    Framework profile represents the categories and subcategories of core functions
    prioritized by an organization based on business needs. It can be used to measure
    the organization’s progress toward the target profile.


    # 2.5.5 Comparison and Analysis


    The six different governance approaches reviewed each cover specific IS properties.
    IS governance is a large-scale project that requires prior evaluation to avoid
    failure during its implementation.


    IT governance concerns mid-sized and larger companies. Initiating and undertaking
    work is complex, time-consuming and costly. It requires ongoing stakeholder investment
    and the establishment of teams to implement the governance project. The cost of
    implementation can be high; training of the persons concerned in the company,
    use of an external consultant, and certification of the standard. Governance does
    not solve all problems. As we have, each of the approaches is dedicated to specific
    subjects. Because of its implementation cost, a return on investment is less guaranteed.


