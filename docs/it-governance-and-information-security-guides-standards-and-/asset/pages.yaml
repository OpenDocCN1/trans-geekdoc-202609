    # 8.1.1 Problem Statement


    Many prescriptive approaches to ISO 27002 already exist, for example, ISO 27003,
    which is the official standard with guidelines for ISO 27001 (Talib et al., 2012).
    Several steps to implement the management framework provided in ISO 27001, called
    ISMS, are presented. However, a practical methodology for implementing an information
    security policy does not exist.


    Many organizations do not have the resources or expertise to conduct a risk analysis
    and implement an ISMS (Mintz et al., 2003). Therefore, they could now know what'
