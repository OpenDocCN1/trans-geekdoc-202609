  md: 'Although IT governance has gained popularity, there is little academic research
    on the subject (Marrone & Kolbe, 2011). On the other hand, IT governance concerns
    are very present in professional journals and reports, which advocate the need
    to deploy frameworks and standards to address governance challenges. Thus, several
    different models and standards have been developed for IT governance, of which
    COBIT is often used. Research shows that efforts devoted to these models and standards
    can help create value, improve productivity, optimize resources, increase compliance,
    reduce costs, and improve lead times (Belogazlov et al., 2024).


    The adoption of best practices by IT departments aim to provide IT services to
    businesses more effectively and efficiently according to their demand. When IT
    begins to better support business, a chain of events will begin when adopting
    standards and best practices that business meets needs (Peters et al., 2002).
    Furthermore, it takes significant time to fully implement a framework the size
    of COBIT in its entirety. These timeframes when the COBIT framework is often considered
    an expensive approach for many organizations, as significant resources need to
    be allocated over an extensive period. The substantial investment leads to many
    organizations reluctant to embark on a long path of IT governance implementation.
    Despite the importance of IT governance frameworks, little empirical research
    has been carried out on developing ways to maintain, effectively and evaluate
    IT governance (Bermejo et al., 2014).


    Significant focus has been placed on the development of IT governance standards
    and models. This suggests that the current challenges of IT governance are not
    the absence of standards or models, but rather the absence of an effective and
    practical strategy for successfully assessing IT governance. In particular, there
    is little research in the literature that analyzes uses COBIT as a tool for implementing
    research programs (Aprilinda et al., 2019). To facilitate effective IT governance
    implementation, the maturity of organizations should be measured by using IT evaluation
    methods (De Haes & Van Gembergen, 2005). These evaluation methods are often based
    on a more or less comprehensive set of criteria and provide a way of securing
    the capability of IT governance processes (Cadete & da Silva, 2017). However,
    organizations generally adopt ad hoc instead of standard methods to assess IT.
    Therefore, governance assessment methodologies need to be adjusted according to
    their applicability in a specific area and sector (Tonelli et al., 2017). Therefore,
    it is necessary to contextualize COBIT before it can be applied appropriately
    to assess IT governance in any industry and provide more contextualized methods
    (Omari et al., 2012).


    The major challenges of IT governance are the lack of practical methods to contextualize
    or adapt evaluation frameworks, particularly in specific contexts, and the lack
    of understanding of the adoption of the framework, particularly the factors that
    influence its adoption (Maleh et al., 2019). Therefore, this chapter aims to determine
    the main areas of adoption of IT governance, based on COBIT, to provide a practical
    and efficient framework to evaluate IT governance in medium and large organizations
    (Rizal et al., 2020).


    The remaining sections of this chapter present the background and the literature
    review in the next section. Section 3.2 describes the theoretical framework. An
