  md: '# 250 IT Governance and Information Security


    aspects of security might be relevant to them. Instead of doing a comprehensive
    risk analysis, an organization could also look to its peers. What are they doing?
    Although it is not as good to follow your peers as it is to do an extensive risk
    analysis, it is certainly better than setting up controls for no reason.


    Modern times require different approaches to problems. Nowadays, mobile phones
    and tablets are common problems. Employees are supposed to work everywhere. Information
    is quickly shared via social media. How do companies manage these new issues –
    what controls they do put in place and how do they select?


    To date, there was no literature on practical research using ISO 27000, Google
    Scholar and SCOPUS. Almost all results had a very limited number of references.
    However, some were still useful. The following paragraphs describe the documentation
    used for the research.


    There are few scientific papers on ISO 27002, and none found that research practices
    ISO 27002 as described in the background section. This chapter can be considered
    exploratory: The data collected in this research may be used to formulate hypotheses
    for other research projects.


    # 8.1.2 Research Question/Approach


    The research question in this chapter is: What relevant ISO 27002 controls and
    good practices do corporate security managers choose to implement, and why are
    they chosen?


    The approach taken in this research is qualitative research, using interviews
    with experts. Expert interviews are a good way to explore an area of research.
    Experts often know a lot about the research topic. It is possible to know whether
    there is a consensus or whether there is still much debate on certain subjects
    by talking to several of them. Both results could be used in future research.


    Unlike quantitative research, qualitative research focuses more on ‘why’ and ‘how’
    questions. As a result, qualitative research generally takes smaller, but more
    focused samples than quantitative research. Qualitative research often does not
    have a clear hypothesis in instead, we need an open question. The selection is
    not made by statistical chance, but to what is available. When interviewing information
    security officials, the objective is to get an overview of the controls they choose
    and why they have been chosen over others.


    # 8.1.3 Purpose


    As is there very scientific literature on the practical use of ISO 27002, this
    research can be exploratory. The purpose of this chapter is to investigate what
    controls are commonly used and how they are selected for the implementation of
    information security in large public organizations in the Middle East and North
    Africa MENA through ISO27002 (Calder & Watkins, 2010), with a specific focus on
    a practical framework for the implementation of an effective information security
    policy through ISO27002 (Calder & Watkins, 2010).'
