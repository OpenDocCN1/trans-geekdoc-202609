    # Structure of ISO/IEC 27001:2005


    The 34-page document is structured into nine sections and has three appendices.
    The highlight of each section is described here:


    +   * **Introduction:** Asserts the standard uses a process approach;

    * **Scope:** It specifies generic ISMS requirements suitable for organizations
    of any type, size, or nature;

    * **Normative references:** The standard recommends the essential use of ISO/IEC
    27002:2005.

    * **Terms and definitions:** A brief, formalized glossary.

    * **Information security management system:** The details of the standard based
    on the Plan-Do-Check-Act cycle, where Plan = define requirements, assess risks,
    which controls are applicable; Do = implement and operate the ISMS; Check = monitor
    and review the ISMS; Act = maintain and continuously improve the ISMS. Also specifies
    certain specific documents that are required and must be controlled that records
    must be generated and controlled to proceed the operation of the ISMS (e.g., certification
    audit purposes);

    * **Management responsibility:** Management must demonstrate their commitment
    to the ISMS, principally allocating resources to implement and operate it;

    * **Internal ISMS audits:** The organization must conduct periodic audits to ensure
    the ISMS incorporates adequate controls that operate effectively;

    * **Management review of the ISMS:** Management must review the suitability, adequacy,
    and effectiveness of the ISMS at least once a year, assessing opportunities for
    improvement and the need for changes;'
