    **Compliance processes** provide a formalized approach to reviewing and approving
    cloud adoption decisions. The flexibility and convenience of a monthly expense
    of IT capabilities using a cloud business model allow a business unit to introduce
    new technology without giving IT staff and any candidate the opportunity to review
    solutions for reuse or ensure that any cloud selection complies with your company''s
    information management standards and security policies.


    Exception handling and appeals are other examples of a compliance process. Exception
    handling is critical to managing risk and complexity as well as tracking cloud
    and other business technologies.


    Industry-specific and regulatory compliance policies and processes should be addressed
    as early as possible in the decision lifecycle, such as the implications of data
    privacy on the decision to adopt clouds. The company''s cloud adoption strategy
    should contain compliance processes tailored to common business scenarios and
    serve as a baseline for seeking guidance on compliance procedures.


    Effective exception management is necessary to ensure the agility of your strategy
    and its value appropriately. It does not change the introduction of the cloud
    into the enterprise; however, experts in the field should be part of the exception
    and appeal process to ensure that requests are interpreted properly. It is essential
    to ensure that justifiable exceptions are approved to prevent the exception process
    from being misused and requests from being approved by default, which would defeat
    the value of the process. The exception handling process is typically initiated
    by a project manager making an exception.


    **Communication processes** ensure that all stakeholders remain informed of the
    company''s cloud adoption strategy.


    **Tools and metrics** enable effective governance, management, and performance
    monitoring of local and extended environments that incorporate the cloud. They
    are an essential part of the governance framework. Metrics ensure that processes
    are properly controlled and deliver the expected results.'
