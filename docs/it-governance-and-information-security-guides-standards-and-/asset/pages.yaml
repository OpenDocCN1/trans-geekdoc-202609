    # # 3.7 CASE STUDY


    In order to gain a detailed understanding of the process for evaluating IT governance
    using the adapted IT Governance Framework based on the COBIT model, previously
    unexplored in the MENA port organizations, exploratory case study was deemed appropriate.


    Specifically, this research activity applied case study research considering that
    ‘where only theoretical knowledge exists on a particular phenomenon, an inductive
    research strategy can be a valuable starting point’ (Siggkel, 2007). An inductive,
    case study strategy was adopted as it facilitated the identification of practical
    insights into IT governance evaluation frameworks. It also allows ‘replication
    logic’, where multiple cases are treated as a series of experiments, with each
    case serving to confirm, or not, the inferences drawn from previous cases. This
    approach also matches the research’s paradigm (i.e., realism) and adds credibility
    to the study (Tsang & Kwan, 1999). In addition, the use of case study research
    permits a flexible and thorough approach by employing a variety of data sources
    and research methods (Denscombe, 2014). Table 3.5 presented the selected top high-level
    IT processes for MENA port organizations.


    In the evaluation of IT governance using the COBIT framework, organizations make
    assertions about how these IT governance processes are met. This is verified by
    internal or external auditors or by conducting self-assessments. The COBIT framework
    utilizes capability levels to assess IT processes on a scale from 0 (non-existent)
    to 5 (optimized).'
