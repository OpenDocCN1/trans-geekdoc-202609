- pgno: 311
  md: '# Conclusion


    This chapter presents a summarized review of the book. The IT governance evolutions
    and standards are described in Chapters 1 and 2. These included material on different
    Information Technology Governance evolution, definitions, issues, and standards.
    Chapter 3 provided a practical framework to evaluate Information Technology governance
    through COBIT 5. This chapter presented a review of related theories and an applied
    discussion of IT Governance, including use, strategy, and adoption by large organizations.
    Chapter 4 investigated IT service management and proposed a practical maturity
    framework based on ITIL. The last three chapters described Information Security
    Governance by exploring the processes, and the practices of organizations involved
    in a strategy of information security governance are presented in Chapter 7. A
    capability security governance is presented in Chapter 8. Finally, Chapter 9 aimed
    to guide organizations in implementing an effective Information Security Policy
    through ISO 27002.


    Organizations are becoming more and more dependent on IT to manage their business
    processes. The IT domain is a dynamic and fast-changing environment where is constant
    evolution of this information implies directly beneficial to organizations. However,
    the evolution presents new challenges for information security and management
    of critical IT infrastructures while maintaining the performance of primary processes,
    including business continuity.


    Discussion on governance deal with all the processes involved in managing information
    system, from the budgetary approach and strategic alignment (CMMI, COBIT, etc.)
    to SOA (service catalog, versions, etc.), data administration, and production
    assets (ITIL, CMDB, etc.). In the end, if you look closely, these practices simplify
    formalize management concerns that are now being reclassified under the ‘governance’.
    This at least has the merit of promoting mutualized practices, which are usually
    the best. However, there is a severe problem with the current discourse on governance:
    it claims to exist existing assets, but rarely reveal the evolution of the information
    system. The risk is to implement governance processes that are more rigid than
    the agility of the system, especially the new service-oriented systems.


    Security governance brings together the essential elements of cyber defense and
    effective risk management. Without this governance, dangerous gaps remain and
    assets are inevitably compromised. By taking the steps outlined in this book,
    an organization will be better prepared to implement an agile IT governance and
    manage risks as they arise and become resilient to counter today’s threats.


    It has been suggested in this book to address the issue of IT governance and information
    through guides, practices, and maturity frameworks. This book explores the characteristics
    of IT governance and information security to give a theoretical and practical
    basis for understanding IT governance and provide decision-makers the necessary
    tools to succeed in their IT governance strategy in the organization.


    DOI: 10.1201/9781003161998-13'
