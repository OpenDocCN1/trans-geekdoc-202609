  md: '# IT Governance and Information Security 79


    standards (COBit, COSO, ITIL, CMMI, PMBOK) according to the four words described
    in Chapter 1.


    This overview of the leading governance methods has enabled us to fully understand
    what governance means and the role of each of them: security, quality, supply,
    services, standardization, project management, and costs. The application of different
    good governance practices influences the operational aspects of IT transformation
    and facilitates management and control. Knowing the governance function for the
    IT also avoiding confusing it with the enterprise architecture, which is also
    concerned with the IT.


    Most IT governance frameworks are designed to help determine how your IT department
    is functioning overall, what key management needs, and what return IT is giving
    back to the business from its investments.


    Where COBIT and COSO are used mainly for risk, ITIL helps to streamline service
    and operations. Although CMMI was initially intended for software engineering,
    it now involves in hardware development, service delivery, and purchasing. As
    previously mentioned, FAIR is fairly for assessing operational and cybersecurity
    risks.


    Though COBIT is one of the most popular frameworks used by publicly traded companies
    in the United States probably with the Sarbanes-Oxley Act, the purpose for IT
    management and compliance. It helps strengthen the security of healthcare systems,
    but security is not the primary goal of COBIT. This standard may not be suitable
    for small healthcare organizations that want to improve the security of their
    system.


    ISO/IEC 27002:2005 can be applied to the organization of any size concerned with
    the information security of their systems. An organization can use this as a guide
    to managing its information security program. Organizations can seek certification
    for their Information Security Management System to comply with ISO/IEC 27001:
    2005.


    When reviewing frameworks, consider your corporate culture. Does a particular
    framework or model seem like a natural fit for your organization? Does it resonate
    with your stakeholders? That framework is probably the best choice. Whether you
    don''t have to choose only one framework. For example, COBIT and ITIL complement
    one another in COBIT often explains why something is needed or where ITIL provides
    the ''how''. Some organizations have used COBIT and COSO, along with the ISO 27001
    standard (for managing information security).


    # 2.6 SUMMARY


    This chapter proposed a faceted framework for the analysis of IT governance. This
    framework considers four perspectives, called words of the subject, use, system,
    and development of ITG. Facets and their values detail these four perspectives.
    This framework has been applied to five known IT governance standards. This application
    revealed that of the current approaches cover all facets of the framework. The
    approaches do not have an overall vision of ITG but piecemeal visions. The emphasis
    is on collections of good practices that are updated regularly. This work on state
    of the art has highlighted the need for research on the globalization of ITG.
    This chapter aimed to provide a comprehensive understanding of ITG.'
