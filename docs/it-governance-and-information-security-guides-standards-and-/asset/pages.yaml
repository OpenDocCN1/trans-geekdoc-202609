    studies in our sample reveal that to approach the capabilities of IS professionals
    more broadly in the field of IT infrastructure alone or information systems development
    ISD. The starting point for these documents is IS professionals will need change
    capabilities (Markus & Benjamin, 1999). In their documents, researchers argue
    (Butler & Gray, 2006) that organizational structures and the standardization of
    work roles and practices can prevent professionals from taking a more effective
    change agent role or acting cautiously in the following areas unexpected situations.


    # ## 1.1.16.3 IS Development


    In information systems development (ISD), research related to agility has focused
    on agile methods. Conceptual research helped to define the key variables of the
    research. Lee & Xia (2005) developed measurement scales for the two central components
    of IS flexibility: responsiveness and the effectiveness of the response. Later,
    based on an exhaustive review of the use of concepts flexibility, agility, and
    leanness in business studies, Conboy (2009) defines the agility of an ISD method
    as follows.


    The continuous readiness of an ISD method is to create a change quickly or inherently,
    to adopt proactively or reactively, and to learn from the change while contributing
    to the perceived value of the client (economy, quality, and simplicity), through
    its components and its relation to its environment (Conboy, 2009).


    Several case studies then attempted identify a history of flexibility or agility
    in ISD. A central book that is follow the so-called agile ISD methods (Baskerville
    & Pries-Heje, 2004; Volker & Sanger, 2009).


    However, it was acknowledged that adopting methods is a slow learning process
    (Berger & Beyond-Davies, 2009; Cao et al., 2009; Wang et al., 2012). Many other
    variables, such as the organizational context, the various attributes of the project,
    and collective and individual consciousness, define the ability of project teams
    to effectively deploy agile principles (Cao et al., 2009; Kalle & Rose, 2003;
    Ramesh et al., 2011; Zheng et al., 2011).


    # ## 1.1.16.4 Design of IT Infrastructure


    Research on IT infrastructure flexibility has benefited from early conceptual
    work by (Duncan, 1995) and by (Byrd & Turner, 2000). Although Duncan does not
    provide a precise definition, the following description provides a starting point
    for understanding the flexibility of the IT infrastructure.


    Infrastructure flexibility determines IS''s ability to respond quickly and cost-effectively
    to system demands, which evolve as business practices or strategies. Ideally,
    flexible infrastructure would be an infrastructure designed to evolve itself with
    emerging technologies and supporting the ongoing restructuring of related activities
    and processes (Duncan, 1995).


    Subsequently, Byrd & Turner (2000) developed an instrument to measure flexibility.
    The instrument was based on the assumption that the flexibility of the IT infrastructure
    has eight dimensions: four in the technical base (IT connectivity, application
    functionality, IT compatibility, data transparency) and four in the human component
    (technology management; business knowledge; management knowledge technical knowledge).


    New technical trends can be both a means (Fink & Neumann, 2009) and a challenge
    (Benamati & Lederer, 2001) for the flexibility of IT infrastructures.'
