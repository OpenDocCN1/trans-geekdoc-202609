    # 1.1.14 Urbanization


    The dynamism of enterprise applications is another feature introduced by Singh
    et al. (2005). Indeed, since current information systems are open and subject
    to frequent changes in response to strategic, business, or technological changes
    affecting the company, the applications of these systems must then be able to
    evolve dynamically to cope with the changes.


    # 1.1.14.1 The Metaphor of the City


    Indeed, urban planning is generally based on geographical invariants. A city is
    structured into zones, districts, and blocks. Planning rules are then established
    and applied for each area. The city actor will consider them invariant. Similarly,
    IS urbanization is based on the assumption that stable, functional blocks can
    be determined, at least for a long time, if not forever (Imache et al., 2012).
    Urbanization changes as follows:


    +   - Cost-saving: Ways to eliminate redundancies and reduce costs without disrupting
    business processes;

    - Providing more value: How to introduce new technology to bring more value to
    the business;

    - Flexibility: To design an architecture that facilitates the evolution of business
    processes;

    - Cost-effective and efficient production: Whether new technology can be implemented
    at a lower cost without rebuilding the existing information system?

    - Interoperability: How to integrate existing applications and data blocks and
    make them interoperable?

    - Opening: How to build the foundations for applications that interact with the
    ecosystem (Internet, WEB, etc);

    - Ensure quality of service: The ways to manage and control the quality of the
    service offered.


    Accordingly, urbanization provides an information system that is better adapted
    to serve the company’s strategy and anticipate changes in the environment. Corporate
    information system managers want to satisfy the demands of technological solutions;
    however, they face several challenges: Costs, budgets, applications that are often
    not well known, resulting in difficulties in integrating new projects and evolving
    the information system. Management of these problems leads to dramatic failures.'
