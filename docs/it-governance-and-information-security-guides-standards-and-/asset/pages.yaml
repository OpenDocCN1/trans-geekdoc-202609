    # 6.3 RESEARCH METHODOLOGY


    Our literature review suggests that information security has gradually moved from
    an operational to a strategic dimension. Past contributions have proposed various
    models for ISG, discussed the role of management, and the added value of this
    approach. But it appears that the involvement of organizations in the ISG process
    has not yet been studied.


    Moreover, within the academic community, difficulties are regularly reported by
    security researchers, both in the development of theories (Dlamini et al., 2009)
    and empirical research (low participation rates in studies) attest to this; apart
    from a few case studies, surveys identifying the detailed practices of a significant
    sample of organizations in ISG are rare. It seems that a state of current organizational
    practices, based on new data, would update knowledge in this area of research.
    Therefore, we propose to answer two questions:


    +   * What are the factors that determine the commitment of organizations to ISG?

    * How to define a conceptual maturity framework based on best practices and commitments
    in organizations?


    # 6.3.1 Data Collection


    Our data are collected from large and medium companies on an international scale.
    There are several justifications for this choice. Governance first implemented
    by large firms (Waddock & Graves, 1997) demonstrated that organizations with significant
    financial resources could invest more in strategic activities (Archibugi & Michie,
    2005). Cohen (2006) stated that organizations must consider the security dimension
    in their strategy when operating in a competitive environment, which is often
    the case for large enter- prises. Moreover, small- and medium-sized enterprises
    (SMEs) have shown an overall lack of security awareness (Mitchell et al., 1999).
    They faced more severe prob-lems than encountered by large companies regarding
    security difficulties and a realistic assessment of the risks involved (Siponen
    & Willison, 2009; Goodhue & Straub, 1991; Peltier, 2013).'
