    # 4.2.1 Agility in Literature


    The concept of agility was first used in the literature of strategic management
    and industry at the beginning of the years (Meade, 1997; Vernatad, 1999; Yusuf
    et al., 1999; Richards, 1996; Goldman, 1995). Agility is introduced and proposed
    in the literature to argue that success in volatile industries requires a set
    of capabilities from those required for success in stable industries (Volberda,
    1996; Volberda & Rutges, 1999). In situations, the organization must be agile
    and capitalize and respond to opportunities generated by new market situations
    faster than their competitors (Goldman, 1995). The key then is: how can an organization
    become agile? How can they create the required capabilities? Moreover, perhaps
    maybe, what are these capabilities? This subject was being addressed in several
    strategic management and organizational studies, rooting the theory began well
    before introducing the agility concept. In IS, the agility concept has been Introduced
    in early 1990 (Ciborra, 1992; Markus & Benjamin, 1996; Clark et al., 1997; Sharp
    et al., 1999; Zhang & Sharifi, 1999) after the success of agile methods in computer
    development. In research, the concepts of flexibility and agility have been associated
    with the broader challenge of combining complex systems with unexpected changes,
    sometimes surprising in user needs, business processes, company structure, strategy,
    markets, and overall. At the beginning of the year 2000, the emphasis was on other
    attributes of IS, which explain agility through IT, development methods (IS),
    and IS outsourcing practices.


    In the literature, we deduced that a lack of a unique definition of the agility
    concept; The Agility Research in IS was being divided over various axes (Lee,
    et al., 2006; Fink & Neuman, 2009; Holmqvist & Pessi, 2006; Hong et al., 2011).
    However, there is a lack of research regarding agility in IT Management Systems.
    Although the IT function is at stake. In all its dimensions, the IT function has
    the capability to accelerate its adaptation to business needs, market requirements,
    and the strategic alignment of the IS and the organization. Agility is the best
    solution to cope with different internal/external changes. DevOps is one of best
    practices and change guidance that ensures development, assurance, and quality
    improvement and operations to better respond to customer needs effectively. Patrick
    Debois invented the word DevOps during the organization of the first DevOps days
    in Ghent, Belgium, in October 2009. To ensure competitiveness, the organization
    must accelerate the delivery'
