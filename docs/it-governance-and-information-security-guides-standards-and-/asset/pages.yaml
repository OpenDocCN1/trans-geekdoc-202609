- pgno: 20
  md: '# 2 IT Governance and Information Security


    59% of the affected companies that would have noticed a negative impact after
    having suffered a cyberattack.

    To IT risks, organize security layers by implementing firewalls, IDS/IPS, PKI
    architecture, NAC, access control, anti-virus, among others (Kumar & Kumar, 2014).
    This approach is fundamentally inadequate (Eoglu & Çakmak, 2016). It is even the
    first brick to be implemented to build a robust security program. However, this
    approach remains insufficient and reactive because of its purely technical aspect;
    it is due to its structures which consist of a technical and a functional part.
    To ensure the resilience of the Information management system, organizations are
    increasingly adopting proactive strategies, through the implementation of business
    continuity plans (BCPs) and disaster recovery plans (DRPs), or by using private
    or public clouds that allow outsourcing to an external entity to solve security
    problems (attacks, viruses, intrusion, etc.) (Bahi & Wali, 2014). These approaches
    have given a lot of satisfaction over time. Still, the feedback from the giants
    in the field. Rocha Flores et al. (2014) show that economic changes and new trends
    influence the current vision of IS. The obvious problem is that all approaches
    (both proactive and reactive) do not cover all aspects of the organization (functional,
    social, organizational, operational, managerial, etc.).


    Hence, it is important to adopt a broader vision that includes risk management,
    agility, and IT governance (Nicho, 2017). In this sense, several methodologies
    and strategies have emerged to ensure good governance and agility of the organization''s
    IS to optimize processes to achieve business objectives and align with IT while
    complying with the legislation in force. This broad spectrum of approach chooses
    significant fusion between IT managers and between the different terminologies
    that have suddenly emerged in the business, including IT governance, IS governance,
    organizational governance, information security management system (ISMS), and
    change management and IT agility.


    Facing the problems generated by the use of IT is done, among other things, by
    the implementation of an information security management system (ISMS) to protect
    the fundamental pillars of information security, namely confidentiality, integrity,
    and availability (Nicho, 2017). To achieve this crucial objective, reference systems,
    methods, and standards (COBIT, ITIL, ISO 27000, ISO38350, CMMI, CSO, etc.) can
    be used separately or at the same time to benefit from the set of functionalities
    at are redundant and at others (Maleh et al., 2019). The use of these standards
    and references generates a considerable cost, not to mention the problems caused
    by redundancy and the mountains of documentation that go with it. At this point,
    it must be emphasized that there is no single leading practice model for IT-GOV
    because the security risk profile and the objectives and practices of each organization
    (even within the same sector). Therefore, it is important to recognize that any
    model must be customized or merged with others to fit the needs of each organization.


    This book aims to study the impact and role of implementing IT governance practices
    on the business value derived from IT. This research looks at the gaps between
    business practices in IT governance and information security: best practices,
    guides, and maturity frameworks. Several surveys and case studies have been conducted
    in organizations, providing readers with a practical vision of IT governance and
    information security.'
  merge: -1
  img_proc: true
