    #  1.1.3 Concepts of Enterprise Application


    An EIS can contain a multitude of computer applications. An enterprise application
    is a set of programs, or software, articulated between them, and used to automate
    or assist information processing tasks in a particular area within the company
    (Walls et al., 1992; Imache et al., 2012).


    According to Hasselberg (2000), the main characteristics of an application are
    follows:


    +   * The application components it contains, which represent the coherency of
    the application''s sub-assemblies (modules or software);

    * The application field(s) (context of use) defines either structurally (a workstation,
    a department) or functionally (a management function: maintenance, orders);

    * Functionality that refers to a set of tasks supported by the application;

    * Data processes means the various forms of information used and produced by the
    application. The different human resources, software, and hardware used by the
    application.


    Figure 1.5 presents a summary of these characteristics, using the UML notation.


    ![](img/62b08fcc83049d99252c223afe5d1c9e_33_0.png)


    FIGURE 1.5 Concept of application.'
