    (i) According to Hancock and Algozanine (2016), case research emphasizes studies
    in natural settings. It allows for a greater understanding of the context in which
    a phenomenon exists by collecting rich data to conclude. IT governance is a phenomenon
    that occurs within the context of the organization and is the unit of analysis.
    (ii) Case studies allow the exploration of the individual participant''s viewpoint
    and various groupings of participants (Cronin, 2014). The use of multiple sources
    of data from the perspective of various stakeholders was required to ensure accurate
    evaluation of IT governance processes. (iii) Case study research is suitable for
