- pgno: 66
  md: '# 48 IT Governance and Information Security


    ![](img/62b08fcc83049d99252c223afe5d1c9e_66_0.png)


    **FIGURE 2** Reference framework for IT governance.


    +   - The word ''use'' is the purpose of ITG. It concerns the objectives of its
    users. In governance, CIOs decide to limit risk, create value, and achieve a certain
    performance level;

    - The word ''system'' contains all the valuable information about the activities
    of the ITG. It is the informational basis for decision-making. It contains the
    elements for measuring ITG objectives and all the documents and models helpful
    in sharing knowledge related to ITG;

    - The word ''development'' consists of the processes of ITG. Their execution achieves
    the objectives of ITG and relies on the manipulation of the information elements
    of the ITG system.


    The words are in relation to each other (Clauspierre & Nuran, 2007): The *word
    subject* defines a framework for identifying and justifying the purposes of the
    word of use. The word system is the support for the representation of the reality
    of the word subject. The word system is built to facilitate the processes described
    in the word *development word*. Finally, the word system supports the achievement
    of the objectives presented in the *word use*.


    The IT governance managers are thus positioned at the center of the four words:
    they control the governance environment and its mechanisms (subject word), sets
    a set of objectives to be achieved (use word), executes processes to achieve them
    (development word), and uses documents, models, and metrics (system word).'
