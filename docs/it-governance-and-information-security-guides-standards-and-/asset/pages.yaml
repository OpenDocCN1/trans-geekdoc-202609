  md: '# Cloud Computing as a Key Pillar for Agile IT Governance


    # 5.1 INTRODUCTION


    In the world of development and innovation, the emerging concepts of Cloud Computing
    are increasingly used by software development companies to accelerate the pace
    of production.


    In software development, agile methodology is an increasingly common approach
    used for effective project management. Agile project management is iterative and
    aims to continuously incorporate user adjustments in each iteration of the development
    project (Zhang et al., 2020).


    Agile mode allows development in a continuous software production cycle. Cloud
    Computing provides tools and infrastructure to the teams that carry out these
    agile developments, to guarantee security and facilitate the integration, automation,
    and deployment processes.


    Cloud computing blends two fundamental IT trends: efficiency, IT performance is
    used effectively, and market agility, where IT becomes a strategic weapon for
    fast implementation, batch parallelism, and intensive processing (Lynn et al.,
    2018).


    Previous research offers tentative empirical proof that agility and one of the
    variables shaping decision-making are linked to the implementation of cloud computing
    technologies and their role in increasing the agility of information systems (Yang
    et al., 2013).


    Based on these studies, our chapter seeks to theorize and empirically validate
    the factors that influence the cloud-computing technology decision by responding
    to the following research questions:


    +   * What are the reasons behind the use of cloud computing and why?

    * How will cloud-based boost IT governance through agility?'
