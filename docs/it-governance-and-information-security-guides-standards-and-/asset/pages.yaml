- pgno: 276
  md: '# 258 IT Governance and Information Security


    The ISSP centralizes the organization''s information protection strategy. It is
    validated by the COSI and approved by the General Management and is available
    to all the organization''s agents and transmitted to the third parties concerned.


    # 2. Organization of Information Security


    Objectives: To manage, monitor, and guarantee the security of information within
    the organization in a transversal way, and to define the responsibilities and
    roles of the various actors.


    The organization of the information security clause addresses the need to define
    and allocate the necessary roles and responsibilities for information security
    management processes and activities. This includes controls related to the definition
    of information security rules and responsibilities, segregation of duties, contact
    with authorities, contact with special interest groups, information security in
    project management, and mobile devices and teleworking.


    # 3. Human Resource Security


    Objectives: To ensure that employees and contractors understand their responsibilities
    and are suitable for the roles for which they are considered. To ensure that employees
    and contractors are aware of and fulfill their information security responsibilities.
    To protect the organization''s interests as part of the process of changing or
    terminating employment.


    The Human Resource Security clause addresses the required controls for processes
    to staff recruitment, job during employment, and after the termination of their
    contracts. These considerations should include information security coordination,
    allocation of information security responsibilities, authorization processes for
    processing facilities, confidentiality agreements, contact with authorities, contact
    with special interest groups, independent review of information security, identification
    of risks related to external parties, addressing security when dealing with customers,
    addressing security on contractors'' agreements, etc.


    # 4. Asset Management


    Objectives: To identify, inventory and classify all assets required for information
    management. Each of them, a person in charge must be identified. The latter is
    responsible for enforcing the security policy for its assets.


    The asset management clause addresses the responsibilities that need to be defined
    and assigned for asset management processes and procedures. The owner of assets
    and other parties involved in this issue should be identified to be responsible
    for the security of the assets, including classification, labeling, and information
    processing, and the information processing facilities should be identified and
    maintained. In addition, this clause addresses the control of removable media
    management, media disposal, and physical media.


    # 5. Access Control


    Objectives: To ensure that users are aware of security responsibilities. To reduce
    the risk of accidents, errors, and/or malicious acts by integrating safety principles
    into human resources management, from recruitment to the end of the collaboration.'
