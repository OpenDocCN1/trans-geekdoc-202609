  md: '# Information Security Governance 191


    Several authors have studied the added value, the strategic, or competitive advantage
    provided by implementing an ISG. In this sense, Schou & Shoemaker (2006) found
    to provide a more significant benefit to the organization, the ISG can eventually
    coordinate with strategic approaches to economic intelligence, social responsibility,
    or communication. Huang et al. (2006) relied on a balanced dashboard to establish
    performance indicators for information security management in organizations and
    strengthen the link between these indicators and the institutional strategy. Williams
    (2007) outlined the lines of management and the board of directors in the area
    of information security. Dhillon et al. (2007) presented the results of an empirical
    study to determine the dimensions of ISG governance benefit better. Kraemer et
    al. (2009) showed that human and organizational factors play a significant role
    in developing vulnerabilities to ISG and suggest a multilevel approach to improve
    security performance. Johnston & Hale (2009) examined the strategic aspects of
    information security and tried to assess the added value to the organization through
    the security governance approach. The authors proposed an information security
    roadmap by a survey conducted among security professionals and suggest programs
    for their implementation. Kryukov & Strauss (2009), the added value and performance
    are crucial ISG elements.


    In his thesis on, Brody (2009) devoted chapters to the roles and responsibilities
    of managers, the strategic measures and benefits of the approach, the development
    and implementation of a strategy for ISG and incident management. Klaic (2010)
    discussed the need to define a level of governance in the organization and clarify
    the link between level and security performance.


    Da Vega & Elloff (2010) provided a framework to develop a culture of information
    security within an organization and how to use it. An empirical study was conducted
    to validate the proposed culture of information security. Michael E. Whitman (2011)
    proposed value to the executive by defining governance as it is applied for information
    security and exploring three specific governance issues. He inspected how government
