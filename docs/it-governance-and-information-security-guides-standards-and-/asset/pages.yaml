- pgno: 295
  md: '# 8.4.7.7.2 Workstation and Equipment


    It is a question of controlling allocations for strictly professional needs through:


    +   - Theactivation of the administrator account;

    - Internet filtering;

    - Disabling USB flash drives;

    - Standardization of positions.


    # 8.4.7.7.3 Password Management


    Users should follow good security practices when selecting and using passwords.
    Following the password policy defined by PUBLIC_ORG, rules must be defined to
    ensure proper password management.


    # 8.4.7.7.4 Network Partitioning


    The implementation of control measures within the network to isolate information
    services, users, and information systems should be considered.


    # 8.4.7.8 Cryptography


    # 8.4.7.8.1 Cryptographic Controls


    Confidential information within PUBLIC_ORG must be encrypted using valid encryption
    processes for data at rest and in motion, as required by state or federal laws
    or regulations. This includes but is not limited to sensitive information on mobile
    devices, disks, and laptops.


    # 8.4.7.8.2 Cryptographic Authentication


    Public Sec Information system must obtain and issue public key and Transport Layer
    Security (TLS) certificates from an approved service provider. This control focuses
    on certificates with visibility external to the information system and does not
    include certificates related to internal system operations, for example, application-specific
    time services. Secure Socket Layer (SSL) protocol must be disabled on all devices.


    # 8.4.7.9 System Acquisition, Development, and Maintenance of Information Security


    # 8.4.7.9.1 Separation of Development and Production Facilities


    As far as possible, development, test, and production environments should be separated
    according to the risks involved. The transfer of programs and information must
    be controlled. The development and testing environment must be independent from
    the production environment. The production environment must be installed on machines
    that will not be used simultaneously in development or test environments. A developer
    must not access production.


    # 8.4.7.9.2 Integrating Security into Projects Development


    PUBLIC_ORG''s statements of requirements for acquiring new systems or for improvements
    to existing systems shall specify the requirements for security measures.'
