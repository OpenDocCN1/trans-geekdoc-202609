  md: 'In the same vein, Al-Khazrajy (2011) indicated that COBIT helps in conducting
    IT governance evaluations at low cost with better value, as it can be tailored
    to fit certain organizational needs. However, none of these studies provided empirical
    evidence of the validity of their selection or practical methods for utilizing
    COBIT by auditors. As a result, it is proposed that tailoring the COBIT framework
    to conduct IT governance evaluation that is relevant to a specific organizational
    context is possible.


    Afterward, Warland and Ridley (2005) conducted a study to establish a benchmark
    of maturity level over IT processes in the Australian financial sector by adopting
    a self-assessment tool based on the study''s selection of 15 controls from COBIT
    by Gulentops (2002) to elicit the level of control over IT processes. They then
    compared the Australian benchmark with the international benchmark established
    by Gulentops (2002) and concluded that the Australian financial sector had a better
    performance for IT control over the 15 most important IT processes. Subsequently,
    by Nfuka and Rusu (2010) also used the previously selected 15 processes from the
    COBIT framework to evaluate IT governance maturity in five Tanzanian public organizations
    and compared the results with those of previous studies (Gulentops, 2002; Warland
    & Ridley, 2005).


    They contended that the maturity levels in the studied environment compared with
    the public sector in Australia and internationally in a range of nations, the
    maturity appeared to be relatively lower in Tanzania as a developing country.
    As observed in the previous studies, the authors agreed on three points. First
    of all, only a limited number of empirical research studies focus on the evaluation
    of IT governance using COBIT in the public sector environments worldwide. Second,
    the authors noted the similarity between the rankings of the IT processes, which
    suggests that the priority placed on these specific IT processes is medium and
    largely consistent.


    This also indicates a consistency in the nature of the governance practices and
    maturity within the public sector worldwide. Third, none of the studies provided
    a justification or a mechanism for the selection of the leading (or most important)
    15 IT processes from the COBIT framework. Another project was undertaken by the
    IT working group at the European Organization of Supreme Audit Institutions (EUROSA)
    to design a self-assessment tool for evaluating IT governance based on the COBIT
    framework. Similar to the previous studies, a list of 16 key control objectives
    was identified as the most important (Huissoud, 2005). In the same way, a study
    was undertaken by Webb et al. (2006) in Australia to identify and assess a set
    of control objectives to be used as an IT evaluation by the Tasmanian Audit Office
    within public organizations. The authors produced an abbreviated list of 17 high-level
    control objectives from the COBIT framework that were considered to be important
    to Tasmanian organizations.


    # 3.3 THEORETICAL FRAMEWORK


    The COBIT framework recognizes the importance of effectively assessing IT governance
    to organizations by articulating that a basic need for every enterprise is to
    understand the status of its own IT systems and to decide what level of control
    the'
