- pgno: 87
  md: '# IT Governance and Information Security 69


    At the US Department of Defense (DoD), the SEI developed a set of criteria to
    determine whether a SEI project would be completed on time, budget, and specifications.


    In 2001, the SEI created a new version of the CMM, incorporating all the advances
    of other models that had emerged to fill specific gaps in the CMM. The latest
    version of the CMMI (version 2.0) was released in 2018. It allows the model to
    be applied to hardware, software, and services in all industries.


    CMMI proposes a set of objectives to guarantee the quality of projects (RamírezMora
    et al., 2020). It is accompanied by a repository of good practices expected to
    achieve these objectives. CMMI provides a framework for the definition of the
    organization’s processes, including project management (planning, resource management,
    risk management, etc.), engineering (requirements management, technical solutions,
    product integration, etc.), and support (configuration management, quality assurance,
    measurement, and analysis, etc.). It is a tool to help define and improve processes.


    The need to implement a CMMI model in an organization arises when the company
    detects recurring problems like late deliveries, budget overruns, customer dissatisfaction,
    and lack of management visibility.


    +   CMMI, therefore, aims to:

    - Improve the quality of the delivered product and the productivity of the project;

    - Increase customer satisfaction by better meeting their requirements;

    - Reduce costs and meet deadlines;

    - Give better visibility to management and allow better risk management.


    The good practices recommended by the model are grouped into 25 key processes
    (Process Area), themselves grouped into five levels of maturity/capacity:


    # 2.3.4.1 Level 1: Initial


    Every organization defaults to level 1. Project management is not defined within
    the organization. Effectiveness relies on the skills and motivation of individuals.
    No control is carried out. The project can succeed but with cost and time overruns.
    Success factors are not identified, and the project does not build on experience.


    # 2.3.4.2 Level 2: Managed


    Project management is defined at the organization level and is applied by default
    to all projects. All projects meet the CMMI level 2 objectives with the processes
    proposed by the organization or by default processes defined at the project level.
    The project builds on what has been done previously, thanks to better discipline.
    Successes are repeatable.


    # 2.3.4.3 Level 3: Defined


    Project management processes are extended to the entire organization through standards,
    procedures, tools, and methods also defined at the organizational level. The entire
    organization has a discipline that is applied consistently. The organization monitors
    and manages the improvement of these processes.'
