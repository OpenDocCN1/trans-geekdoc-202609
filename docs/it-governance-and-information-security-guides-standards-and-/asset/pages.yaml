    # 2.5.2 Core Framework


    The Core Framework is a set of cybersecurity activities, desired outcomes, and
    applicable benchmarks common to all critical infrastructure sectors. It consists
    of five concurrent and continuous functions: Identity, Protect, Detect, Respond,
    and Recover. Figure 2.10 presents NIST Core Framework.


