    # 8.4 CASE STUDY


    A qualitative methodology was used and semi-structured interviews were conducted
    in the study (Creswell & Cromwell, 2017). An interview guide was developed containing
    open questions. The interview questions were based on ISO 27002. The interview
    guide is presented in Appendix 1 (Table 8.4). We organized a meeting with the
    employees to explain the control objectives, and we also sent a explanation of
    the theories by email (Burns, 2010). Accordingly, these explanations would enhance
    their possibility if giving adequate answers. The next step was to send the interviews
    to the security coordinator, the employees from other departments of the public
    organization in Morocco.


    The second part of this document deals with developing an information security
    policy in a large organization (for confidentiality reasons, we will not be able
    to disclose the organization''s name). The objective of this policy will be to
    provide a coherent, recognized, and shared security framework between all the
    organization''s stakeholders, enable the implementation and ensure the long-term
    security of their information systems, and define a coordinated action plan enabling
    each entity to better address its challenges.'
