  md: '# 3.4 RESEARCH METHODOLOGY


    Despite its prevalence in practice, little academic literature has been published
    on adapting and adopting best practice frameworks and models for assessing IT
    governance. It is necessary to understand whether theoretical constructions of
    information systems (IS) can help understand the adoption of the IT governance
    framework and how these factors can guide developers and proponents of contextualized
    frameworks. More formally, the overarching research question for this research
    is: How can best practice frameworks be adapted and adopted to assess IT governance
    in medium and large organizations across all sectors? The secondary research questions
    are as follows:


    +   * Question 1. Which pertinent process can be adapted to conduct IT governance
    assessments in medium and large organizations?

    * Question 2. How can medium and large organizations assess IT governance using
    appropriate best practice frameworks?


    A mixed approach was adopted because this conception is linked to the research
    paradigm of ‘realism’, research methods were chosen on the basis of the nature
    of the research problem (McVoy & Richards, 2006). Therefore, a mixed approach,
    which combines quantitative and qualitative methods, is considered the most effective
    strategy for this research (Perry et al., 1997). By applying both approaches at
    different stages of the research program, the researcher collected data on the
    questions from different sources, which could be triangulated. This approach also
    reduces the weaknesses associated with using a single method (Charles & Tashakkori,
    2009). In addition, a mixed approach is considered most appropriate for exploring
    the research question ‘How to adapt and adopt best practice frameworks to assess
    IT governance in medium and large organizations’, the implementation of multiple
    methods over several steps or research activities helps answer this type of general
    question (Morse & Niehaus, 2009). From a theoretical perspective, a mixed approach
    gave the research chance to discover the theoretical mechanisms underlying the
    contextualization and adoption of IT governance frameworks (Charles & Tashakkori,
    2009). A combination of quantitative and qualitative methods has been designed
    to lead to a thicker and deeper understanding of the research question (Creswell
    & Morris, 2017). As the research progressed, the design of mixed methods developed
    that the results of the first phase, including research activities or studies,
    contributed to the development of a more in-depth study of the drivers of innovation
    adoption and IT governance frameworks in the second phase (Charles & Tashakkori,
    2009). In addition, the mixed approach allowed this to develop from the literature
    on IT governance and innovation adoption, and thus, this research is considered
    from a unified position. Therefore, this research can combine the strengths of
    quantitative research with those of qualitative research to deepen understanding
    of a complex phenomenon.


    Several apparent gaps emerge from previous research concerning the challenges
    of assessing IT governance, particularly appropriate governance frameworks, or
    the lack of governance frameworks in medium and large organizations. There is
    also a gap in the study of the'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# IT Governance in Organizations 97


    methodological adaptation of the COBIT framework to the specific needs of individual
    organizations or sectors. Therefore, this research seeks to address the gaps in
    the area of IT governance by answering the primary research question: ''How can
    best practice frameworks be adapted and adopted IT governance in financial sector
    organizations?''

    The primary research questions are as follows:


    +   - Research activity 1. Which is the best process that can be adapted to conduct
    IT governance assessments in medium and large organizations? This question aims
    to address one of the key IT governance assessment challenges identified. While
    there may be several ways to do this, an intervention in this research, IT governance
    frameworks, particularly COBIT, have been taken into account because of the need
    highlighted in the literature to focus on contextualization (or adaptation) important
    research area. To make optimal use of scarce medium and large organizations''
    resources effectively and efficiently.

    - Research activity 2. How can medium and large organizations evaluate governance
    using adapted best-practice frameworks? A method with guidelines in the form of
    an evaluation framework for IT governance was tested. The research activity evaluated
    IT governance in medium and large organizations in terms of the capability levels
    of their IT processes.


    Embarking on a research project requires the investigator to understand the research
    process and associated activities. The research methodology and approach must
    be carefully planned and formulated to successfully answer the research questions
    and successfully solve the research problem. To explore whether the COBIT framework
    can be adapted and adopted to evaluate IT governance in the Middle East and North
    MEN Port organizations from different sectors, the researchers employed a two-stage
    mixed-methods approach that evolved.


    Generally, two approaches are often employed by social science research studies,
    including information systems (IS), namely, quantitative and qualitative. Typically,
    researchers choose one or both of these approaches (known as mixed methods) Although
    research studies can be generally classified as having a more qualitative or quantitative
    focus in nature, the distinction between the two becomes less. It can be more
    accurately described as representing different ends on a continuum (Cress & Maxwell,
    2017). This study adopted a mixed-methods approach which is suitable within the
    realism paradigm and provides the depth dictated by the nature of the research
    problem. This approach assisted in attaining a better understanding of the research
    problem and leverage the most appropriate tools for the research questions. In
    addition, using a mixed-methods approach provided an opportunity to minimize flaws
    associated with using qualitative methods (e.g., lack of context understanding)
    individually, as embracing a blend of qualitative and quantitative approaches
    will draw from the strengths and mitigate the weaknesses of both.


    Similarly, Charles and Tashakkori (2009) suggest that qualitative and quantitative
    methods will reduce bias in the results and mutually strengthen the findings from
    both approaches. The mixed-methods approach was essential in understanding the
    evaluation of IT governance processes, customized IT governance frameworks, and
    the factors impacting the adoption of information systems-related innovation'
  merge: -1
