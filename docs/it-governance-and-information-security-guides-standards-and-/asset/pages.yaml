- pgno: 196
  md: '# 178 IT Governance and Information Security


    Indeed, security is a fundamental component of your organization''s cloud adoption
    strategy. The more we know security requirements and factor them into the cloud
    decision-making process, the less likely projects will fail costly downstream
    project or vendor issues once the move to the cloud begins.


    Various organizations have created a cloud center of excellence to drive cloud-based
    transformation (CCoE), composed of resources with deep cloud technology and business
    skills. This may not be necessary for organizations that are interested in the
    public cloud. But in the case where your strategy depends on the ''on-premises''
    private cloud, more in-depth skills are required. You should also expect a CCoE
    or similar organization to exist in your cloud provider''s domain and consider
    this as a key part of your vendor selection criteria in areas such as product
    viability.


    Important strategic-level responsibilities include the following:


    +   * Strategic roadmap approval;

    * Support compliance and security;

    * Promote relationships with cloud partners.


    **The company''s executive steering board** authorizes and supports strategic
    roadmaps, ensuring that budget and funding activities are prioritized and that
    roadmaps are aligned with the overall company strategy. The more executive leadership
    is engaged during the development of your enterprise cloud adoption strategy (typically
    led by a dedicated strategy team), the more effective it is, because a key outcome
    is a strategic roadmap, and because the stakeholders who make up your strategy
    team could very well become members of your executive steering committee.


    As illustrated, the executive steering committee is an advocate and speaker to
    industry regulations and company policies. They emphasize the validity of building
    relationships in advance by leveraging their networks to facilitate the process.
    Each of the responsibilities described is critical and should not be overlooked
    given the direct impacts on service excellence.


    Management and control responsibilities, particularly those of the Architectural
    Review Board, include the following:


    +   * Manage evolving strategic roadmaps;

    * Monitor;

    * Determine policies and standards;

    * Build and manage cloud stakeholder relationships;

    * Embedded service management process.


    The Architecture Review Board includes IT and business leaders and includes architects
    and subject matter experts or specialists. Working closely with the steering committees
