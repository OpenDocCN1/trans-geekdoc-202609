- pgno: 193
  md: '# Cloud Computing for Agile IT Governance 175


    contexts prevent cloud benefits from translating to a competitive advantage. Also,
    regulatory support for cloud computing adoption was not significant. Regulatory
    processes are important to instill trust in companies to transform creativity
    into business opportunities. Our study findings suggest that agility, cost saving,
    security, privacy, and trust, technological readiness, and data sovereignty influences
    cloud computing adoption.


    # 5.17 THE PROPOSED CLOUD GOVERNANCE FRAMEWORK


    A key success factor for governance is not simply managing cloud impacts on the
    business but also governing the cloud. By defining enterprise architecture (EA),
    you must have defined how it will be managed, using a governance framework in
    which accountability controls are established to ensure appropriate adoption and
    use of EA. In this case, the next step is to incorporate cloud governance considerations
    as illustrated in Figure 5.3.


    The Computing Cloud Governance Framework is intended to support the organization''s
    cloud adoption strategy. Five core components of the framework include:


    +   * Policies and principles;

    * Organization;

    * Finance;

    * Process;

    * Tools and metrics.


    # 5.18 POLICIES AND PRINCIPLES


    Policies and principles are the company''s rules and laws for cloud adoption.
    A principle is a belief statement that serves as the base for establishing decision-making
    policies. In contrast, a policy outlines the underlying rules that an organization
    must consider when making decisions about cloud adoption.


    Usually, policies are defined at the strategy level. For example, they may relate
    to decisions about cloud vendor selection (e.g., contractual restrictions, which
    aren''t allowed, processes for managing required services, and specification of
    what business applications and data can be moved in the cloud). Policies define
    management''s direction to support the company''s business purposes and needs,
    ensure the company''s compliance with applicable legislation, reflect management''s
    commitment, and clarify responsibilities. As such, you may have a data encryption
    or separation policy that must apply to all clouds, whether private, public, hybrid,
    or community.'
