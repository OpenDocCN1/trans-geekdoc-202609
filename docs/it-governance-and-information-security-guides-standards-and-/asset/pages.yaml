- pgno: 141
  md: 'In retrospect, it seems highly impractical for organizations to achieve capability
    level 5 in all process areas. So, what is the ideal capability these organizations
    need to achieve for each process area? It appears that organizations can very
    well successful with a capability level 2 or 3 for most process areas. Depending
    on business objectives or the types of services being offered, organizations can
    aim for specific process areas to be at a higher capability level. In other cases,
    there would be no incentive or a justified business case for trying to achieve
    a higher capability level for a given process area. The results show that the
    adapted version of the COBIT 5 model was fit for evaluating IT governance and
    contextualized to the needs of organizations. Accordingly, this study adds credibility
    to the practitioner reports that it is possible to implement COBIT to produce
    a practical ITG framework that reflects the needs of individual organizations
    or sectors.


    # 3.8 SUMMARY


    The primary objective of this research was to explore how best-practice frameworks,
    such as the COBIT model, can be adapted to conduct evaluations of IT governance
    within medium and large organizations and to explore further the factors that
    influence the acceptance and adoption of the adapted framework. Four sub-research
    questions were answered and a research model was proposed to support the primary
    objective of the research.


    The research findings reinforce the important role of frameworks in IT governance
    evaluation. Employing an approach based on innovation adoption enables the understanding
    of the factors related to acceptance of IT governance frameworks, providing practitioners
    with additional knowledge and thus enabling a better understanding, and hence
    influencing, the adoption of IT governance frameworks.


    In conclusion, considering the limitations identified, it is recommended that
    this research is extended to other organizations in both the private and public
    sectors. In addition, it is recommended that the research model is further developed
    to improve the quality of the findings and more exploratory research is conducted
    on the relationship specified in the model.


    The next section, proposes three chapters to address the IT agility axis in large
    organizations. The first chapter of this section discusses the different models
    and frameworks of agility. The second focuses on IT service management agility
    through a case study. The third chapter deals with the cloud-computing axis as
    a pillar of IT agility in organizations.


