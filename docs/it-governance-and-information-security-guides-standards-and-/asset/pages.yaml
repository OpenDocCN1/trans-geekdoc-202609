    Commission (commonly referred to as COSO) in response to well-publicized financial
    irregularities in the late 1980s. COSO formulated an internal control framework
    to help organizations reduce the risk of asset loss, ensure the reliability of
    financial statements and compliance with laws and regulations, and promote efficiency.
    COSO is recognized by many public and professional bodies as a standard for evaluating
    internal control and the risk environment (Chiu & Wang, 2019). Under the COSO
    framework, the effectiveness of an internal control system is measured by its
    capacity to provide reasonable assurance to management and the board of directors
    of their bank''s achievement of its objectives in three categories:


    +   * Effectiveness and efficiency of operations;

    * Reliability of financial reporting;

    * Compliance with applicable laws and regulations.


    The emphasis on behavior in the COSO model recognizes reality, namely that policies
    specify what management wants to happen, what happens, and which rules are obeyed,
    bent, or ignored, which is determined by corporate culture. The COSO ''internal
    control model'' consists of five integrated components inherent in managing the
    organization. The components are linked and serve as criteria for determining
    environment, risk assessment, control activities, monitoring and learning, and
    information and communication. COSO is indeed a framework that allows to manage
    risks at all levels of the company, and not only for its IT system. COSO divides
    the enterprise risk management'
