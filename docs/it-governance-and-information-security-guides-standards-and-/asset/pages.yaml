    # 3.7.2 Data Analysis


    The data collected from the questionnaire were analyzed using Microsoft Excel
    to establish the capability level of selected IT governance processes. MS Excel
    was selected as an exploratory data analysis tool because of the combination of
    its simplicity and its capability to calculate and present the results in tables
    and graphs. Specifically, respondents’ scores (from ‘not achieved’ to ‘fully achieved’)
    for each attribute evaluation of IT process were incorporated into an Excel worksheet
    (see Table 3.4 as an example). This was carried out for each capability level
    of key practices and statements (from 0 to 5). Eventually, the capability level
    of each IT process was obtained. This was carried out for all ten processes in
    each studied organization.


    All data collected each case study individually, across the case studies, and
    collectively for all case studies discussed. The evaluation of the IT governance
    processes from this analysis is discussed further in the following section.


    This study opted to distinguish the utilization of maturity and capability levels
    as these terms were found to be loosely used in previous studies. Often considered
    similar concepts, organizational maturity applies to an organization’s overall
    maturity and is concerned with evaluating a set of process areas. In contrast,
    process capability relates to evaluating a set of sub-processes and generic practices
    for a process area that can improve the organization’s associated with that area
    (Huang & Han, 2006). A maturity level results from aggregating the capability
    levels of all capability areas and demonstrates the extent to which an organization
    has developed its capabilities (Forstner et al., 2014).


    # 3.7.3 Assessing Capability Maturity


    The analysis of the average maturity level across the studied organization involved
    calculating the average of each IT capability level across these organizations.
    The averages provided the range within which the maturity levels of all assessed
    IT processes were calculated. The overall capability ratings of each IT process
    as evaluated by the respondents are presented in Table 3.8. The table also displays
    the means for the individual processes of each organization as well as the overall
    mean for each process.


    The analysis of the organization’s maturity levels was carried out using the obtained
    capability level for each IT process from each organization’s point of view. Different
    from the previous one, the capability levels of IT processes were compared to
    the level of individual organizations. Such comparisons provided the relative
    evaluation of the processes in each organization and led to the individual organizations’
    maturity levels for the adapted ITG framework based on the COBIT 5.'
