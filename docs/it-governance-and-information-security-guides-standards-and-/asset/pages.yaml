- pgno: 297
  md: '# 8.5 SUMMARY


    The objective of this study was to establish a practical framework for the formulation
    and implementation of the IS security policy. The problem arising from this situation
    is an ineffective IS security policy and therefore a vulnerable system. To achieve
    this objective, we reviewed the ISO 20002 security policy frameworks and put them
    in place.


    During this part, the document called ISSP was set up, which reflects PUBLIC_ORG
    and requirements to implement the means to protect in the most effective way the
    heritage represented by Information Systems, with all its resources (information
    and their various means of sharing, processing, exchange, and storage), and to
    preserve its operation as a production tool for users.


    Further research is to determine situations within more controlled environments,
    such as commercial or private organizations. Being a state educational entity
    may have distorted the results to a degree and having addition, more diverse data
    would validate the framework to a greater level. Also, this study focused on the
    relatively small subset of most directly involved in policy. A quantitative examination
    of a wide base of users might need some slight addition on policy.


