    # 2.3 IT GOVERNANCE STANDARDS


    Governance, whatever the level at which it operates (management control, project
    portfolio, data administration, COBIT alignment, CMMI, ITSM, etc.) must be situated
    with a trajectory of the evolution of the information system toward its progressive
    overhaul. The renovation of it systems towards the addition of devices to promote
    agility. It is necessary to modify systems more quickly and more reliably to consider
    business and technical developments (Valentine, 2016).


    To achieve quality objectives and ensure the continuous improvement of the enterprise
    information system, the company must be managed according to a governance framework
    based on good practices and standards compatible with agile practices.


    A comprehensive information system program should include IT governance. IT is
    the primary means by which stakeholders ensure that IT investments create business
    value and contribute to business objectives. Strategic alignment of IT with business
    is both challenging and essential. IT governance programs go further and improve
    IT performance and deliver optimal business value while meeting regulatory compliance
    requirements (Benachor & Chernobyl, 2017).


    While the CIO is generally responsible for implementing IT, the CEO and Board
    of Directors receive reports and updates to fulfill their IT governance responsibilities
    and ensure that the program is working well and delivering business benefits (Turel
    & Bart, 2014).


    Several IT governance frameworks allow the implementation of an IT governance
    program. Although frameworks and guidelines such as CoBIT, ValIT, and ISO 38500
    (Simonson & Johnston, 2006) are widely adopted, the combination that works for
    an organization depends on business factors, corporate culture, maturity, and
    staffing capacity. The level of implementation of these frameworks will also vary
    by organization.


    IT governance is a relatively new term, first coming into use in the late 90s
    (Magnagnusso, 2010). Until about 2009, definitions of IT governance primarily
    focused on creating the correct settings for internal management of technological
    infrastructure and IT department (Ali et al., 2009; Weiss & Ross, 2005; Xue et
    al., 2008). IT departments were expected to deal with many different issues, including
    rapid technological change over a brief period. ‘Boards needed little or no understanding
    of technological issues because the technology was simple to implement a strategy’
    (Carter &'
