    # # 6.4 SURVEY RESULTS


    This section shows the detailed practices of organizations interviewed in ISG
    using descriptive statistics, answering our second research question.


    # # 6.4.1 IT Security Governance Knowledge


    The survey reveals that 78% of organizations are familiar with ISG practices,
    mainly through the Internet, vocational training, and technology watch. As shown
    in Figure 6.1, 75% of these organizations are involved in an approach to ISG;
    80% of organizations are aware of other organizations involved in ISG, of which
    34% are clients, 59% are suppliers, and 41% are competitors. Eighty of these organizations
    (78%) are involved in the governance of information security.


    # # 6.4.2 Conditions for Implementing Information Security Governance


    Before embarking on an approach to ISG, practicing organizations took stock of
    actions already carried out internally (81%) as well as possible envisaged measures
    (87%), knowledge of standards, and certifications (80%). The collected information
    from specialized security agencies and organizations (73%), evaluated security
    budget and costs (75%), and reviewed actions by other organizations (39%). These
    results are illustrated in Figure 6.2.'
