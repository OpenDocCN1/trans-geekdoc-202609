    # 8.2.1.2 ISO/IEC 27002:2005 (Revised by ISO/IEC 27002:2013)


    ISO/IEC 27002:2005 is another generic standard applied to health information systems
    to ensure security. It establishes general principles and guidelines for effective
    initialization, implementation, maintenance, and improvement of information security
    management. The objectives therein provide general guidance on the commonly accepted
    goals of information security management. Thus, any organization seeking to adopt
    a comprehensive information security management program or improve its existing
    information security practices can use the standard. The ISO standard asserts
    that information can be protected using a wide variety of controls. Controls include
    hardware and software functions, processes, policies, and organizational structures.
    Organizations including healthcare organizations must develop, implement, monitor,
    evaluate, and improve these security practices (PRGL, 2011).


    # 8.2.1.3 ISO/IEC 27002:2005


    ISO/IEC 27002 2005 is entitled Information technology–Security techniques–Code
    of practice for information security management. It is published by the International
    Organization for Standardization (ISO) and International Electrotechnical Commission
    (IEC).

    ISO/IEC 27002:2005 was developed from BS7799, a British standard that was published
    in the 1990s. ISO/IEC adopted this as ISO/IEC 17799:2000 in December 2000. In
    June 2005, the standard was revised and officially published as ISO/IEC 17799:2005.
    On July 1, 2007, it was renamed ISO/IEC 27002:2005 to align with the other ISO/IEC
    27000-series standards (ISO/IEC, 2013). On the other hand, ISO/IEC 27002:2005
    has been revised by ISO/IEC 27002:2013 (ISECT, 2012).


    In this research, ISO 27002 serves as the framework for measuring information
    security in organizations. It is well suited for this work, as the idea behind
    ISO 27002 is to have a list of controls that should mitigate all possible information
    security risks.


    # 8.2.1.4 ISO/IEC 27002:2005


    The 39 security categories of the standard are specified under 11 security control
    clauses. Each main security category contains one control objective stating what
    is to be achieved. In addition, one or more controls are specified to help achieve
    the control'
