- pgno: 131
  md: '# IT Governance in Organizations 113


    The respondents were asked to self-evaluate IT governance processes in their organizations
    based on the ITG framework, which contained 16 high-level IT processes. This approach
    was consistent with that of the original study (Gerke & Ridley, 2009). The guidelines
    provided through the ''Process Assessment Model (PAM): using COBIT 5'' contained
    nine process capability levels to evaluate the IT governance processes of an organization
    as described. Taking one IT process at a time, the questionnaire introduces the
    investigating purpose and key attributes from the PAM that respondents could simply
    choose the capability level for each of the attributes for process.


    However, face-to-face interviews have been scheduled with IT staff to assess governance
    within the organization. For each organization, a maximum of 100 data points was
    collected, representing achievement for ten attributes (nine process attributes
    + zero criteria criteria), for the 16. When calculating the overall capability
    level for one process, the highest full or medium achievement of the nine attributes
    associated with that process was taken. Similarly, a simple average of responses
    was calculated when more than one was given. The capability levels for the 16
    critical IT processes reported a mean for each process.


    This research activity also prepared and analyzed a list of possible work products
    (WP) according to the evaluated IT processes (ISACA, 2013). The WPs included strategic
    and operational plans, structures, processes, frameworks, service level agreements,
    performance reports, and so forth. The nominated WPs were included in the collection
    instrument to elicit well-informed responses from respondents. In fact, in the
    process, APO02 Manage Strategy, respondents were instructed to consider a strategic
    plan as a product of process if it was the organization''s. In other words, this
    allowed the triangulation of different data sources, adding to the credibility
    of the evaluated IT governance processes. The researcher could not validate the
    responses by inspection of each IT WP listed or through other techniques. Therefore,
    based on the researcher''s experience in the field, only two WPs were chosen and
    included in the questionnaire for each IT process to indicate capability levels.
    The number of level 0 and level 1 responses received the respondents seemed candid
    in the information provided.


    In the last section of the questionnaire, respondents were asked to rate the importance
    of 17 enterprise goals and 17 IT-related goals of IT governance of their respective
    organizations. This will assist in building a mapping between enterprise goals,
    IT-related groups, and IT governance processes similar to the goals cascaded by
    the COBIT 5 framework (ISACA, 2012).


    Before distributing the final version of the self-evaluation instrument, a web-based
    pilot was created. This pilot was posted online and two senior IT auditors. Based
    on comments and suggestions, the instrument was made more user-friendly and accessible.
    Data collection for this research activity was performed in the period January–March
    2018.


    After data collection, a draft report for each organization was sent back to respondents
    within that organization for review and confirmation.


    The results for the position level of the respondents are presented in Table 3.6.
    From the 20 responses received, 15% (3 respondents) specified executive officer,
    20% (4 respondents) specified officer, 30% (6 respondents) specified IT manager,
    15% (3 respondents) specified Senior, and 20% (4 respondents) specified Auditor.'
