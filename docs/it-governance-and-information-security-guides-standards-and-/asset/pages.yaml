    # 5.19 ORGANIZATION


    The ‘Organizational Structure’ section illustrates the leadership and the key
    roles, responsibilities, and levels of accountability necessary for effective
    decision-making around cloud adoption. Examples include creating an executive
    board (ESB) to authorize and approve cloud-related acquisitions and a review board
    (RB) responsible for the effective integration of cloud into the environment.
    These committees are critical to the creation, execution, and integration of the
    cloud to the company.


    The chief enterprise architect will communicate to senior executives the benefits
    of the cloud and execute the strategy without getting the details of cloud infrastructure
    and implementation. Clarify the value and impacts of cloud adoption on the business
    and opportunities that positively impact the organization''s strategy.


    This responsibility applies to both small and large enterprises, for example,
    to expand their market share or are on the verge of adopting a solution but are
    hesitant due to high-profile outages. In turn, the chief enterprise architect
    can suggest innovative strategies, such as partnering with aggregated cloud providers,
    to ensure that in the event of a primary provider'' service unavailability, partner
    services are executed in a way that preserve service levels and the end-customer
    experience.


    If you''re an enterprise architect, it''s highly recommended that you have at
    least cloud business skills and the ability to guide decisions. This is because
    you will face situations as service management asking you what the guidelines
    are for commissioning and decommissioning cloud environments in your organization.
    Traditionally, this has not been the case; however, given that it is possible
    to offload key dimensions of EA to the cloud (e.g., offload a major of your IT
    infrastructure assets and services), you need to have the skills to make the appropriate
    business decisions to ensure interoperability within your organization and across
    different business lines.


    The cloud architect has been added to the review committee (RC). The expertise
    and talents of this role from a technology and business perspective should not
    be ignored. A cloud architect role can assist in standardizing virtualization
    strategies and associated business efficiencies.


    Included is the UX architect, who is critical in determining the appropriate service
    interfaces presented cloud end users and consumers. For instance, many consumers
    want their portal to be the entry point to cloud, which implies that the vendor''s
    services are accessed through application programming interfaces (APIs) or web
    services. The review committee should also include a test and security architect,
    and both should be tailored to support the integration of cloud solutions into
    the enterprise through the development of testing strategies and the implementation
    of proper processes, procedures, and tools that validate that any proposed cloud
    adoption is secure to mitigate vulnerability risks.'
