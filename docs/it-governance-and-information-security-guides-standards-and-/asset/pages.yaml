    # # 2.4 ISO/IEC 27002:2005 (REVISED BY ISO/IEC 27002:2013)


    ISO/IEC 27002:2005 is another generic standard applied to health information systems
    to ensure security. It establishes generic general principles and guidelines for
    effective initialization, implementation, maintenance, and improvement of information
    security management. The objectives outlined therein provide general guidance
    on the commonly accepted goals of information security management. Thus, any organization
    seeking to adopt a comprehensive information security management practices can
    use the standard. The ISO standard asserts that information can be protected using
    a wide variety of controls. Such controls include hardware and software functions,
    procedures, policies, processes, and organizational structures. Organizations,
    including healthcare organizations, must develop, implement, monitor, evaluate
    and improve these security controls.


    # # 2.5 ISO/IEC 27002:2005 (REVISED BY ISO/IEC 27002:2021)


    The typical lifespan of an ISO standard is 5 years. After this period, it is decided
    whether the norm can stay valid, needs revision, or retracts. In 2018, it was
    decided that ISO 27002:2013 should be revised. The draft is currently under review
    and is expected to be published by the end of 2021.


    As Annex A of ISO 27001 is based on ISO 27002, it is expected that this standard
    will soon follow, after which it will be possible to certify against the new standard.'
