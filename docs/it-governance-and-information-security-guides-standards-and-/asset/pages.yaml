  md: '158 IT Governance and Information Security


    To address these questions, we build on the literature on the Technology Acceptance
    Model (TAM) and Diffusion of Innovation (DOI) and suggest a web-based implementation
    paradigm to enhance IT agility through cloud computing technologies. The next
    segment discusses the literature on factors affecting cloud adoption to create
    a theoretical model for implementing cloud technologies. The second section explains
    the empiric experiments that evaluate the proposed model.


    # 5.2 LITERATURE REVIEW


    This literature review synthesizes current cloud studies from an operational perspective.
    This incorporates the results using the defined framework. We organized the deductions
    according to the following four aspects: the properties of cloud computing, the
    features of implementation, governance mechanisms, and the effect on the agility
    of the information system. We noticed that research encouraging or discouraging
    cloud technology use and the study on cloud computing agility is a recent and
    relatively new topic (Adamson, al., 2017).


    Although this is not fully modern, there is no standardized or traditional description
    of cloud computing. This has grown with recent technologies in virtualization,
    cloud computing, and Internet-based content delivery. The ‘cloud’ term refers
    to the universal development and connectivity of computing services by Internet
    technologies. Through cloud applications, businesses and customers can conveniently
    access large amounts of computing performance at a marginal cost, allowing organizations
    to reduce the overall cost of information technology. Cloud computing brings competitive
    and financial benefits that companies should certainly not ignore (Chemjor & Lagat,
    2017).


    Cloud computing reflects the convergence of IT performance and market agility.
    IT performance results from scalable hardware and software resources improved
    efficiency and coordination between firms, with high availability of services.
    In their study, Noor et al. (2018) enhanced work performance and collaboration
    between companies and readily accessible resources. The business agility in cloud
    infrastructure is the capacity to rapidly implement computational resources, rising
    initial capital spending, and adapting quickly to evolving customer demands. Cloud
    Computing removes the traditional boundaries between companies.


    Cloud technology delivers its commitments through minimized capability and limitless
    scalability to on-demand capability and CapEx cost savings (Nasir, 2017), cloud
    technology delivers its commitments. While there are still unanswered questions
    about cloud computing, regardless of how cloud computing performs on its commitments,
    the organizations cannot risk stability, efficiency, and flexibility to move to
    the cloud. In addition, agility is a critical element in cloud computing, this
    ability to respond reliably in times of uncertainty becomes a necessity. This
    is why we have continued this work to analyze how cloud computing will increase
    the information system agility, and provide a model to adapt the cloud technology
    while getting the maximum benefit from this technology.'
