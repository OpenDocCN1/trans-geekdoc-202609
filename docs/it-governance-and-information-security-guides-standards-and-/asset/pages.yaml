    # 3.2 BACKGROUND AND LITERATURE REVIEW


    IT governance is considered a complex system as it includes several critical aspects,
    namely, leadership, organization and decision rights, scalable processes, enabling
    technologies (Selig, 2008). Early conceptualizations of IT governance, often considered
    a subset of corporate governance (De Haes et al., 2013; Posthumus et al., 2010),
    recognized the role of IT governance in ensuring a valuable contribution from
    the organization''s to its overall business strategy. More specifically, the role
    of IT governance is to ‘ensure’ that the organization''s IT sustains and extends
    the organization''s strategies and objectives (ITGI, 2003).


    Several respected organizations and authors have attempted to define IT governance(Simonson
    & Johnson, 2006). Still, there is no universally definition of IT governance at
    the date of this chapter. IT governance can be defined as the process of controlling
    an organization''s IT resources (Hunton et al., 2004). The International Standard
    for ICT Corporate Governance extends this definition to indicate that IT governance
    is the system by which the current and future use of ICT is directed and controlled.
    This involves assessing and guiding ICT use to support the organization and monitoring
    ICT to achieve the plans. It includes strategies and policies for ICT within an
    organization.


    As a result, governance has become a standard component of most organizations’
    governance, oversight, and control landscapes (Schubert, 2004). With most social
    phenomena, the increasing importance of IT governance has risen to several industry
    frameworks, tools, best practices, and maturity models, offering a prescriptive
    and deterministic approach to establishing effective governance. Nonetheless,
    the significant role of frameworks has been established as a practical approach
    to IT governance (Guldents, 2002; Webb et al., 2006) by providing guidance to
    organizations and offering an advantage over compliance with standards best practices
    and complying with regulatory rules (Brown et al., 2005a). For example, prominent
    meta-frameworks such as ISO 38500 and ITIL provide a comprehensive subset of best
    practices for standardizing, monitoring, and controlling IT activities (Wallhoff,
    2004). However, guidance on IT governance can perhaps be found through the Information
    Systems Audit and Control Association (ISACA) and as its professional organization,
    the IT Governance Institute (ITGI) (Moeller, 2011).


    BIT is a set of best practices developed by ITGI and is widely accepted as the
    main IT governance framework for establishing control over the IT environment,
    performing measurement of IT processes, and allowing executives to bridge the
    gap between control requirements, technical issues, and business risks (van Wyk
    & Rudman, 2019).


    Given the varied and significant organizational pressures to ensure proper oversight
    and control of IT, it is interesting to note that the considerable academic and
    practitioner'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 90 IT Governance and Information Security


    focus on COBIT as a facto framework for IT governance over the last two decades
    (Brown et al., 2005b; De Haes et al., 2013; Guldentops, 2002; Webb et al., 2006).
    Many organizations continue to struggle with fundamental governance practices,
    as select-ing, managing, and evaluating IT governance processes (Heier et al.,
    2007; McKay et al., 2003).


    From an anecdotal perspective, COBIT''s size and multifaceted and complex structure
    making a framework of this magnitude in its entirety too medium and large task
    (De Haes et al., 2013; Warland & Ridley, 2005). This is also echoed by statements
    that view the COBIT framework as too extensive to be applied entirely and proposed
    to move to a less approach to defining and selecting controls. Prominent researchers
    in the domain (De Haes & Van Greenberg, 2005; Peterson, 2004; Webb et al., 2006;
    Weill & Ross, 2005) all put forth converging views of IT governance that recognizes
    the importance of all structural, process, and relational mechanisms. Although
    the value of user involvement in various aspects of IT governance has long been
    recognized (Gremberg, 2004; Posthumus et al., 2010), human behavior of IT governance
    has received less attention from academics (El-Makway et al., 2015; Lengnick-Hall
    et al., 2011).


    The importance of IT governance and the relevance of frameworks provide the content
    for this study, which also focuses on the factors underlying the adoption of IT
    govern-frameworks. The intentions and intentions of the adopters are explored
    to shed light on the factors influencing adoption.


    Several studies have endeavored to tailor and adapt the COBIT framework for a
    specific organizational context. For example, by Nugro (2014) examined COBIT 5
    as an IT governance tool in higher education institutions in Indonesia. The author
    concluded that IT governance must consider its specific situation to define its
    own set of governance processes as it sees fit, as long as all necessary management
    and governance objectives are covered. Similarly, Hierraiz (2012) conducted a
    evaluation using eight high-level controls from COBIT to determine the IT governance
    maturity of the information systems (ISS) department within a single university
    in Indonesia. Along the same line, by Wood (2010) adopted a case study design
    based on nine of the COBIT high-level control as a modified framework to evaluate
    the IT governance maturity of the city of San Marcos in the United States. Similarly,
    the implementation of COBIT as an IT governance framework was examined in an educational
    institution in Portugal by Gomes and Ribeiro (2009) and two Australian institutions
    of higher education by Bhattacharjee and Chang (2010).


    In a similar effort to derive an abbreviated list of processes for creating an
    integrated IT governance framework in the Malaysian Ministry of Education, Azizi
    Ismail (2008) noted that the focus on IT governance differs the organization.
    For example, the Plan and Organize domain was the main focus at the ministerial
    level, whereas the Monitor and Evaluate domain was the highest emphasis at the
    school''s level. Their study determined 20 high-level controls that were considered
    to be most important in one organization. Similarly, Bragas (2015) adopted COBIT
    the framework''s goals cascade mechanism to pick a specific set of primary and
    secondary processes that relate to two IT-related goals: compliance with external
    regulations and security of information, processing infrastructure, and applications.'
