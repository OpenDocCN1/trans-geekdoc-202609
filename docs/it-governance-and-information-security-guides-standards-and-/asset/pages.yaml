  md: '# 4.2 RELATED RESEARCH


    During the last two decades, the ITSM-related frameworks have provided a better
    systematic approach to manage IT services in the fields of IT operation for continuous
    improvement, implementation, and design (Marrone, 2011). For example, different
    studies have concentrated on adopting ITSM as a ‘specific service-oriented best
    practice’. According to Winnifred (2009), 45% of US corporations are operating
    ITSM while 15% are using its usage. ITSM is somehow the quality service that tries
    to ensure customer needs and expectations are met at all times (Tan, 2009).


    In ‘ITIL: What It Is And What Is Not’, Hank (2006) examined the measuring techniques
    of successful companies when implementing the ITIL best practice. He describes
    Service Support and Service Delivery explains its stress on an ITIL best practice
    that does not stand alone and could be successful when other practices. The authors
    define three significant tasks, which define appropriate goal setting through
    a Process Maturity Framework (PMF), rigorous auditing and reporting through a
    Quality Management System (QMS), Project Management and a Continuous Service Improvement
    Program (CSIP), to support ITIL usage. Furthermore, he provided more information
    about agile continuous and continuous improvement of the tactical and operational
    components, especially those focused on service quality by clients and users (Hank,
