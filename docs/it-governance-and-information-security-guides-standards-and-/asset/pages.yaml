  md: '# Information Security Policy

    A Maturity Framework Based on ISO/IEC 27002


    # 8.1 INTRODUCTION


    Information systems (IS) is an integral part of the functioning of public administrations
    and bodies, the activity of businesses, and the way of life of citizens. The security
    of these information systems has become a significant issue for all public or
    private sectors, which would be very seriously affected in the event of serious
    malfunctions (Paliszkiewicz, 2019).


    Information security policy is the general term to describe any document that
    transmits an element of the security program to ensure compliance with organization''s
    security goals and objectives. Since this definition covers a wide range of security
    policies, it is helpful to describe the various types of information security
    policies that an organization may use. The terms used later to describe these
    types of information security policies are generally used in the security industry
    and will be used consistently throughout this chapter (Ifinedo, 2014). However,
    its not unusual for a government organization or agency to have different names
    for the use of information security policies. For example, in many organizations
    and certainly in government departments, the word ‘policy’ is closely associated
    with laws and regulations (Rees et al., 2003). In these cases, a limited number
    of individuals (e.g., the legislature) have the power to create a policy, so that
    an information security policy is generally referred to by other names such as
    ‘information security statement’, or ‘information security document’ or other
    terms avoiding the use of the word ‘policy’. The term used by an organization
    to describe these documents is irrelevant. The overall organization and completeness
    of these documents are important'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 248 IT Governance Information Security


    The security policy is primarily implemented to communicate with system users
    and administrators, which must be taken into account when security decisions are
    made. It defines the explicit expectations and responsibilities of users and administrators
    and allows both groups to know what to expect (Knapp et al., 2009). It should
    explain why certain decisions have been made and why they are important, to help
    users understand how the policy is designed to benefit them (Flowerday & Tuikeike,
    2016).


    The security policy should specifically state the types of data that are considered
    important enough to warrant protection. This would include the user''s files in
    the form of programs, text documents like a thesis or an email, and system-configuration
    files (Yassine et al., 2017). This helps users understand why security measures
    are in place, and why secure services have been restricted.


    A password policy is already in place. However, it should most be defined in the
    security policy. It is one of many things the user could do to help keep the system
    secure, but it is probably one of the most important. Other ways that a user could
    contribute to system security would be properly managing its file and directory
    permissions or using other software designed with the security-conscious person
    in mind (Knapp et al., 2009).


    Should a security incident occur, the security policy should state and any procedures
    that should be followed throughout the period. If the person in charge of system
    security detects a break-in, like should be notified and what should be done with
    the compromised machine? Issues these must be addressed to ensure that any disrupted
    services are restored properly and second, so that proof of the incident can be
    obtained should legal need arise (Male, 2018). The source of the security breach
    should be identified and fixed so that the incident does not repeat itself. Once
    the problem has been adequately documented, the system administration team should
    be aware of what happened (Gwwe et al., 2020).


    The Information Systems Security Policy (ISSP) reflects the expectations and requirements
    of the executive management concerning the information system (Canavan, 2003;
    Hone & Eloff, 2002b). It must take into account the needs of availability, confidentiality,
    and integrity of applications and data used and transitioning on networks and
    systems. It constitutes a set of technical, organizational, legal, and human security
    rules and principles to ensure an efficient and uniform level of security (Fomin,
    2008). The ISSP is the counterpart of the Information Systems Master Plan for
    security. It should be an ISSP action plan that prioritizes projects to meet ISSP
    objectives. The objectives of the ISSP are described in Figure 8.1.


    There are several standards and best practices to guide organizations in implementing
    an information security policy such as ISO 27000, ISACA, and NIST. ISO 27001 (ISECT,
    2012) is an international standard that is part of the ISO 27000 family (Van Solms,
    2005). It refers to a set of standards relating to the ISMS. The ISO 27001 standard
    is a British standard that came into being in October 2005, succeeding the BS
    7799-2 standard. It describes the requirements for the implementation of ISMS.
    This standard allows to choose security measures to protect sensitive assets within
    a well-defined perimeter by implementing a systematic and proactive approach to
    security risk management. Figure 8.2 presents a history of ISO/IEC 2701.


    Best practices such as ISO 27000, COBIT, and ISACA do not provide the practical
    framework for implementing an IS security policy (Höne & Eloff, 2002a). The'
