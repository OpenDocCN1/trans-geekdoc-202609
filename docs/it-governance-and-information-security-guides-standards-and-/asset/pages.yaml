    # 6.5 DISCUSSION AND INTERPRETATION


    To answer our first research question, we present the different determinants of
    the organizational engagement process in an ISG approach, using theit specifications
    described in the research methodology section. We define several models to introduce
    the determinant variables to ensure the quality of the effects obtained. Table
    A.3 (Appendix 2) describes the results of the five models used. Model 1 highlights
    the positive impact of the expected benefits of an ISG approach on the likelihood
    of adopting it. It is also noted that the number of organizations to have adopted
    an ISG approach has a positive effect on the probability of adopting such an approach.
    On the other hand, the characteristics of the organization (its sector of activity,
    the growth of its turnover, membership of a group) do not affect results.


    To refine this last result, we have introduced successively obstacles encountered
    by the organizations. We note that only two obstacles have a significant effect:
    the difficulty of translating concepts into concrete actions is a brake on the
    adoption of ISG (model 2); the low interest of top management for issues related
    to information security also has a negative impact (model 3). The simultaneous
    consideration of these two obstacles confirms the negative effect of translating
    the concepts into concrete actions (model 4).


    The set of models 1 to 5 shows that the number of values shared by the organization
    under the governance of ISG does not affect its adoption. When the values necessary
    by the organization are taken into account successfully, this results permits.


    A detailed analysis of the impact of the organization''s environment (knowing
    an organization that seeks to promote it) shows that the organization''s environment
    has a positive effect on the probability of adopting such an approach, regardless
    of how this dimension is taken into consideration. Generally speaking, on models
    4 and 5, the effects obtained in the model could be qualified as model 1 are summarized:
    the growth of turnover and the number of values of the ''organization'' do not
    affect''. Knowledge of other competing organizations at the regional or international
    level has a positive effect on adopting information security (Model 5).


    Given that the benefits derived from security governance approaches have a positive
    effect on the probability of adopting models 1 to 5, we have successively introduced
    each profit considered necessary by the organization to identify the profits having
