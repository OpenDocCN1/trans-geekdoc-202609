  md: '# 5.7 TECHNOLOGICAL READINESS


    The technology background relates to the organization’s technical features for
    technology adoption. This covers both institutional and individual human capital.
    Structural aspects refer to the company’s platform or technological infrastructure
    that cloud-computing services can complement or replace. Unique human resources
    are inside the company who have the expertise and skills to incorporate cloud
    computing together they improve an organization’s technological readiness (Cervone,
    2010)


    Hence, H5. Technological readiness positively influence cloud-computing adoption.


    # 5.8 THE ORGANIZATION CONTEXT


    +   * Top Management Support


    Organizational context refers to the availability of resources facilitating innovation
    adoption, that is, organizational characteristics that promote or limit a company’s
    adoption and implementation of innovation. Many factors affect the relationship
    with the organizational structure and innovation adoption, such as centralization
    level, power and control distribution, information links, insufficient resource
    availability, lateral communication, company size, and senior management support.
    Senior management support plays a significant role in cloud IT adoption by supporting
    resource allocation, integrating resources, and re-engineering processes (Abdollahzadehgan
    et al., 2013).


    So, H6. Top management support will have a positive influence on cloud adoption.


    +   * Firm Size


    Nevertheless, large companies have an advantage over small firms as they have
    more resources and can take more risks related to innovation adoption. Research
    has shown that small companies, although more flexible, do not embrace emerging
    technologies readily. Therefore, enterprise size is a determining factor in cloud
    computing adoption (Thiese et al., 2011).


    Hence H7. The firm size will have a positive influence on cloud adoption.


    +   * Competence and Awareness


    One of the cloud computing’s main challenges is the lack of competent cloud profiles.
    Today, these problems are critical for organizations that want to stand out from
    the crowd to attract and retain the best applicants and meet the standards of
    the new generations. The university’s role is crucial for continuous evolution
    and helping companies learn and train cloud computing concepts and applications
    (Abolfazli et al., 2015).


    Hence, H8. The firm size will have a positive influence on cloud adoption.'
