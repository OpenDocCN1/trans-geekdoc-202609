  md: '# 5.13 FINDING


    +   - Innovation Characteristics


    Of the four innovation functions, Agility (H1) positively affects cloud-computing
    adoption. This finding reflects similar literature studies (Hsu et al., 2014).
    The survey confirms that cloud computing agility benefits organizations. The benefits
    found by the report included improved service efficiency, faster task execution,
    increased profitability, and new market opportunities.


    Due to recent advances in privacy technology, monitoring, and encryption systems,
    security issues (H2a) do not preclude cloud adoption ensuring confidentiality,
    integrity, and data protection in the cloud (Ifened, 2011). Current federal guidelines
    and legislation like GDPR (Tankard & Pathways, 2016) and FedRamp (Montalbano,
    2012) help create-ate trust and organizational control over data while implementing
    cloud-based technologies that can clarify why security and privacy are not a concern
    while considering cloud computing.


    Cost reduction (H2b) is verified as an integral factor illustrating cloud computing''s
    relative advantage. This finding is consistent with studies showing that cost
    savings are a powerful driver of cloud-based solutions in sectors such as technology,
    manufacturing, finance, logistics, services, and education (Adamson et al., 2017).


    Compatibility (H4) is considered to encourage the adoption of cloud computing
    for the business industry, but not essential for manufacturing. The work-style
    preferences and Internet business transactions among companies in this sector
    may explain their significance in the service industry. The lack of consistency
    in manufacturing is attributed to the complexity of applications (e.g., the vital
    position of in-house software systems such as resource planning software and computer-controlled
    machining) and restricted market standards for Internet solutions (Ramdani et
    al., 2009). Compatibility findings are still inconsistent compared to previous
    studies, and further research is needed to draw a definitive conclusion.


    The complexity factor (H3) is an obstacle to cloud computing in the service sector.
    Cloud computing''s concept of complexity is no different from other disruptive
    technologies and appears to be an essential element to cloud control. Results
    suggest that uncertainty is not a limiting factor for manufacturing firms. Some
    researchers found complexity insignificant (Skafi et al., 2020), while others
    say the opposite (Borgman et al., 2013). Consequently, previous studies are not
    explicit on the position of complexity, suggesting that more work is required
    before a definitive conclusion.


    # Technology Readiness


    Technology readiness (H5) is a cloud adoption catalyst. To the study, companies
    with established technology infrastructure and technically skilled workforce be
    better suited to cloud computing integration. However, our study shows that cloud
    computing can disrupt services and create management challenges in IT and non-IT
    organizations. The finding suggests that companies must ensure that IT professionals''
    technology resources and availability are sufficient to incorporate cloud applications
    into business'
  merge: -1
  img_proc: true
