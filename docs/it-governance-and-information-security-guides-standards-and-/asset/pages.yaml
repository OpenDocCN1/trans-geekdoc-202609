    # 4.5 SUMMARY


    An efficient, agile, and practical approach to ITSAM is vital for IT organizations
    to increase the quality of services they provide, provide speed and agility of
    the service desk, and improve user experience, reducing the cost run of IT. This
    chapter aims to identify the important aspects of a practical framework for ITSM/ITAM
    efficiency. It was collected based on a theoretical and empirical research study
    that generated answers to the sub-level research questions, and a return of experience
    analysis of the best practices in organizations.


    In a theoretical study, the concept and needs of ITSM in the organization are
    presented with applying different methods and improvement techniques, hence the
    most important of the ITIL-ITSM best practice model. This work aims to propose
