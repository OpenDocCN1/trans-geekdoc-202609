  md: '# Cloud Computing for Agile IT Governance 165


    case cloud computing) outweigh existing processes and procedures (FINEDO, 2011),
    the advantages will positively affect its implementation.


    Therefore, H2. The relative advantage will have a positive influence on cloud
    computing.


    +   - Security, privacy, and trust


    The term ‘breach of security’ applies to an incident where a corporation or government
    agency loses classified information, personal data, or other confidential information
    (Bishop, 2002). Cloud computing is a combination of resources in a shared multi-user
    network. This raises security threats (Schneidman, 2011), as companies become
    unsure about future security risks (Benlian & Hess, 2011). Often, the lack of
    established security policies and identity management requirements means companies
    would be hesitant to implement a cloud-based solution. Cloud migration introduces
    new layers of complexity to data protection, significantly affecting the company’s
    decision to embrace innovation.


    Hence, H2a. The security and privacy issues will have a negative impact in terms
    of cloud computing’s relative advantage.


    +   - Cost Savings


    Cloud computing technology provides innovation opportunities, decreases IT spending,
    and lowers overall computing costs. In cloud storage, an organization will reduce
    the time spent on system maintenance and routine updates. Cloud computing also
    lowers network costs, electricity usage, and maintenance costs (Mazhelis & Tyrväinen,
    2012).


    Hence H2b. Cost savings would positively influence the relative benefits of cloud
    computing.


    +   - Complexity


    Complexity is the stage where creativity is considered difficult to understand.
    The better technology incorporates into company processes, the greater probability
    of adoption. Cloud systems will pool resources to meet workloads. Moving to a
    cloud system, however, may be a problem for organizations lacking technological
    knowledge and IT specialists.


    Hence, H3. Complexity will have a negative influence on cloud adoption.


    +   - Compatibility


    So, H4. Compatibility can positively affect cloud adoption.'
