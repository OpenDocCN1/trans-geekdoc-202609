    # 5.20 FINANCIALS


    Financial governance is a key factor in the adoption of cloud and enterprise technologies
    as a whole. It includes financial stewardship, funding models, financial management,
    and building acceptable business models for cloud investments.


    Financial management may seem less complex for the cloud because of the pay-per-use
    pricing model and bundling of services, which minimizes the number of contracts
    your company needs to manage and prepares for a hybrid environment of traditional
    and cloud-based services, at least initially.


    Therefore, how should cloud services be governed, manage renewals, and maintain
    only those subscriptions that provide business value?


    One example of a financial area that needs to be governed is the revenue generated
    by the cloud adoption. As the transition to the cloud helps organizations improve
    services to customers (as well as business entities with private adoption) thanks
    to, for instance, a faster time to value and reduced costs as IT support personnel
    are rationalized or no longer have to deal with customer issues, the cloud adoption
    strategy may require re-budgeting and reallocating earned revenue to strategic
    and related business imperatives, such as implementing executive education programs
    that enable employees to more effectively oversee and govern cloud service providers.


    In this example, financial governance ensures that monetary goals are identified
    and achieved through stakeholder accountability, budget allocations, auditing
    of financial activities, tracking revenue and expenses, and allocating funds related
    to cloud adoption.


    Assessing the financial viability and impact of cloud adoption on the organization,
    in both the short and long terms, is key.'
