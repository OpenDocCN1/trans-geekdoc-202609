- pgno: 270
  md: 'On the emergent side of the strategic paradigm, researchers have examined how
    problems are dealt with creating an IS security policy. It has been noted that
    52% of all logistical and physical security breaches arise from the activities
    of personnel within the organization (Ahmad & Ruighfer, 2003). Research has sought
    to determine the most optimal control method to handle these breaches. IS security
    policy formally defines security requirements, outlines the main security objectives,
    and allocates resources. To maximize the probability of compliance, the enlightenment
    of staff to their responsibilities as outlined in the IS security policy is one
    potential solution.


    Also, from the emergent perspective, there has been a call for the improvement
    of audit management to allow administrators to configure the software to reflect
    an organization''s security needs as defined in the IS security policy. This demonstrates
    a dynamic approach to the policy in that it can be reactive to how an audit trail
    affects an information system. Changing the configuration from the status quo
    bottom-up approach to a policy-centric top-down approach would help the configuration
    closely match an organization''s security goals (Coyne & Kluksdahl, 1994).


    While not explicitly approaching the issue from an emergent perspective (Coye
    & Kluksdahl, 1994), failing a IS security policy implementation demonstrates an
    analysis from an emergent perspective. The implication remains in how elements
    could have adapted to how the actual was different from the rational plan. They
    found that compliance-based approaches are more prone to failure than risk-based
    approaches. De facto compliance-based policy led to the reaction of all security-related
    matters being answered (Walsham, 1993).


    This research was conducted via an interpretive study in the Information Technology
    Department of a large university in the south-eastern portion of the United States.
    The interpretive tradition perceives that the knowledge of reality is a social
    construction by human actors (Howcroft, 2005). In contrast to the assumptions
    of objective science, this knowledge of reality applies equally to researchers.
    It leads to the perception that there is no objective reality researchers can
    discover. This perspective is also described whereby interpretive research provides
    in-depth insights into social, cultural and historical contexts wherein particular
    events and actions are described and interpreted as the authentic experiences
    of the people studied (Reich & Benbasat, 2000).


    Approximately 45 employees worked for the department under study. Of these, 20
    participated in the interviews. The subjects involved in the formulation and implementation
    of the IS security policy. They included the Chief Information Officer, Security
    Officer, and a group of operational level employees who were members of a Security
    Planning Team (SPT). SPT members included systems analysts, web developers, a
    database administrator, two school administrators, and three faculty members.
    The employees within the department who did not participate in the study included
    those who were not stakeholders in the IS policy formulation and implementation
    process.


    The previously discussed conceptual framework grounded the interviews. The interview
    questions were grounded in the theoretical framework, they were conducted in a
    semi-structured manner. Many IS researchers utilized semi-structured interviewing
    techniques (Walsham, 1993). The semi-structured nature of the interview'
