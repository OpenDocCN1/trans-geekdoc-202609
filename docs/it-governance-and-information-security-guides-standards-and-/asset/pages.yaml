  md: '# BOOK OVERVIEW


    The threat to technology-based information assets is greater today than in the
    past. The evolution of technology has also been reflected in the tools and methods
    used by those who attempt to gain unauthorized access to data or disrupt business
    processes. Attacks are inevitable, regardless of the organization (Tashi & Ghernaouti-Hélie,
    2007). The sophistication and persistence of these attacks depend on the antiquity
    of organization as a target, primarily based on its role and assets. The threats
    posed by many misguided individuals have been replaced by highly specialized international
    crime groups or foreign states that have the skills, personnel, and tools to conduct
    covert and sophisticated cyber-espionage attacks (Ula et al., 2011).


    We live in a technology-driven world. It is not uncommon for organizations to
    look to technical security solutions first, without considering how these solutions
    will be implemented, maintained, and managed on a day-to-day basis. Too often,
    we see organizations implementing technical safeguards such as firewalls or intrusion
    detection, but not implementing security policies or procedures. This results
    in inadequate practices that compromise security and expose assets to significant
    risk (Volms & Niekerk, 2013).


    Security governance brings together all the basic elements of defense and effective
    risk management. Without this governance, dangerous gaps persist and assets are
    inevitably compromised. In addition, the executive team is unaware of their organization''s
    risk exposure, for which they will ultimately be held accountable.


    Security cannot exist in a vacuum and must be part of an overall risk management
    strategy based on the organization''s business objectives and values. Organizations
    need to know their risk tolerance or ''acceptable risk level''. This threshold
    may by class asset where the impact is considered minor but very resistant to
    any such risk that could damage its reputation. Governance is the mechanism by
    which these risk values are reflected in the direction and judgment and operating
    practices (Xue et al., 2008). However, there is no point in determining if there
    are no measures to ensure it is followed.


    Compliance audits and reviews are the ’ secrets’ ensure security policies and
    processes are strictly adhered to, by the company''s risk or security management
    strategy (Gwebu et al., 2020). They are also an integral component of all operations
    management programs, including ISO 27001, COBIT, Sarbanes Oxley, and ITIL. Without
    a compliance assurance process, it is impossible to ensure that risks are being
    managed or to detect or correct potential problems when they are not.


    # BOOK OBJECTIVES


    This book discusses IT governance and information security. Many books discuss
    the topics of IT governance. However, the main concept of this book is to explore
    IT governance'
