- pgno: 273
  md: '# 8.2.1.1 ISO/IEC 27001


    The ISO/IEC 27001 standard, published in November 2005, defines the IS security-management
    policy within a company (Johnson, 2014). It is derived from the BS 7799–2:1999
    specification (Specification for Information Security Systems), which defines
    the requirements to be met to create an ISMS (PRGL, 2011). It is in the annex
    specific safety controls, taken from the ISO/IEC 17799 standard, the mandatory
    implementation. ISO 27001 comprises six process areas.


    +   * Define an information security policy;

    * Define the scope of the ISMS;

    * Conduct a safety risk assessment;

    * Manage identified risks;

    * Select and implement controls;

    * Prepare SoA (statement of applicability).


    ISO 27001 specifies the processes that enable a company to build, manage, and
    maintain ISMS. It integrates the process approach and the PDCA (Plan-Do-Check-Act)
    cycle of continuous improvement already contained in ISO 9001 and ISO 14001 standards
    (Figure 8.4):


    +   * Plan: Organize the implementation of the ISMS;

    * Do: Set up and operate the system;

    * Check: Monitor system effectiveness through internal audits and risk assessments;

    * Act: Improve the system through appropriate corrective and preventive actions
    and maintain it through communication and training actions.


    In terms of security, the improvement loop is synonymous with a risk reduction
    loop. In practice, procedures should be put in place for:


    +   * Quickly detect processing errors;

    * Immediately identify any noncompliance with safety rules and organize the immediate
    reporting of incidents;


    ![](img/62b08fcc83049d99252c223afe5d1c9e_273_0.png)


    FIGURE 8.4 PDCA cycle.'
  merge: -1
  img_proc: true
