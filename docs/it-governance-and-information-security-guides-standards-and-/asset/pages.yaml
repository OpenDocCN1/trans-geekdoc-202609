    # 3.7.7 Discussion


    The majority of recent IT governance research on the international scale has focused
    on accountability, decision-making requirements, structures and mechanisms, and
    factors reflecting a significant yet understated aspect of IT governance is the
    goal of organizations to meet adoption and implementation. The ever-increasing
    resources and budget challenges by employing effective IT processes. Measuring
    IT process capability is considered important to ensure successful governance
    over IT. Nonetheless, very little empirical data on the level of process capabilities
    in the medium and large organizations context exists. To overcome this gap in
    the research, this activity endeaved to seek for and refine the IT framework adapted
    from the COBIT model within selected state organizations and compare the evaluation
    results with those obtained by other studies.'
