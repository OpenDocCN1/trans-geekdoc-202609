- pgno: 19
  md: '# Introduction


    # BOOK TOPIC


    Every organization has an information system (IS) to support its activities, business,
    and exchanges with the outside world, whatever its size, purpose, means, or sector
    of activity. IS is the organization''s nervous system; indeed it reflects its
    image. The organization''s performance depends on the efficiency of its IS; in
    other words, the organization cannot function without IS. The services they provide
    are just as indispensable as the supply of water or electricity. Communication,
    which occupies a prominent place in our contemporary societies searching for increasing
    productivity, requires the mastery of economic, social, and cultural information.
    The global explosion of the Internet has considerably changed the situation and
    given IS an inescapable dimension to the development of the global economy and
    society (Ali et al., 2020). All this makes IS governance, security, and a agility
    any society must understand and be aware of the need to ensure the security of
    its IS by analyzing and managing the risks that might weigh on its assets to ensure
    the continuity of operation of its services sustainable over time. The environment
    related to IT and communication is the target of many threats. The openness of
    networks and their increasing complexity involving actors with multiple profiles
    have increased the vulnerability of IS, which is manifested by the destruction,
    alteration, and disclosure of sensitive data to modify or harm the proper functioning
    of IS or the reputation of organizations (Chatterjee et al., 2018). Organizations
    are subject to numerous attacks. The balance sheet shows to executives and managers
    (Benarok & Chernobyl, 2017), according to a study by the consulting firm Price
    Waterhouse Coopers (PwC) published in October 2015 (PwC, n.d.), the number of
    attacks against companies has increased by 38% worldwide in 12 months.


    Thus, a quantitative study conducted by OpinionWay on cybersecurity among 174
    members of the Club Experts de la Sécurité de l''Information et du Numérique (CESIN)
    received a lot of information on this subject; according to the report of the
    study, 80% had suffered at least one cyberattack in 2018. This is the headline
    of the study, 48% of the companies have suffered least four cyberattacks over
    the past 12 months (CESIN, 2019). That''s why some of the findings of this CESIN
    barometer prove to be more worrying. Indeed, the cyberattacks encountered would
    be more harmful and influential on the business of companies. It would even be


