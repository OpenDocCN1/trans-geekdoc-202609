    # One Response to Agile, Lean, and DevOps?


    ITIL itself has become agile. This can be mainly seen in the guiding principles,
    the emphasis on value generation, improvement in small steps, the importance of
    process simplicity, etc., are all part of this. There is a clear perception of
    agile thinking. These agile ITIL guidelines also facilitate collaboration with
    agile teams. To demonstrate that version 4 is adapted to the agile philosophy,
    Axelo recently published a case study of Spotify, which is known to be one of
    the most agile companies.


    However, this version does not provide a complete answer to the agile, lean, and
    DevOps aspects. Admittedly, Foundation methods terms agile and DevOps. There are
    few concrete situations on the possibilities of combining ITIL with more agile
    methods. Example: how should a helpdesk comply with strict service level agreements
