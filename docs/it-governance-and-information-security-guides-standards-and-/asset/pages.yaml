    # 2.5.1 NIST


    The NIST-National Institute of Standards and Technology Framework for Improving
    Critical Infrastructure Cybersecurity, commonly referred to as the NIST Cybersecurity
    Framework (CSF), provides private sector organizations with a structure to assess
    and improve their ability to prevent, detect, and respond to incidents.

    The Framework uses operational factors to guide cybersecurity activities and consider
    cybersecurity as part of an organization’s risk management processes. Many organizations
    are adopting this framework to help manage their cybersecurity risks. Figure 2.9

