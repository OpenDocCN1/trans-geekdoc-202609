    # THE BOOK''S ORGANIZATION


    The book is organized into three sections and eight chapters. A brief description
    of each of the chapters follows:


    The Introduction section provides the background for the book; introduces the
    research, including the problem being addressed, the motivation for the research,
    and the book organization.


    # Section 1: IT Governance: Definitions and Standards


    Chapter 1, ''Information System and IT Governance Evolution'', illustrates the
    evolution of information systems development based on three independent phases
    and provides a profound overview of current IT governance literature.


    Chapter 2, ''IT Governance and Information Security: Guides and Standards'', presents
    a comprehensive understanding of the current state of IT governance standards
    and best practices. It exploits a frame of reference inspired by the four ’words’
    framework that was initially introduced to characterize IT engineering problems.'
