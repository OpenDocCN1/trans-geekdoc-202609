    In the first research activity, a quantitative survey is used to develop an evaluation
    framework for IT governance in medium and large organizations. An questionnaire
    was developed to gather respondents'' perceptions of the importance of each of
    the 37 high-level IT processes from the COBIT framework. Given the findings from
