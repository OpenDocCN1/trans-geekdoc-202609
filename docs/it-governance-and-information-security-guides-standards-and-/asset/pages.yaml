    The proposed information capability framework is a comprehensive suite of proven
    management practices, assessment approaches, and improvement strategies covering
    5 governance capabilities, 21 objectives, and 80 controls.


    # 7.2.2 Framework Core


    The ISG framework classifies the information security activities across the following
    high-level function categories:


    +   - Information security strategy and governance provide the oversight structures
    for supporting ISG; it implements information security strategy, policies, and
    controls; assigns; defines rules and responsibilities for ISG activities; provides
    communication and training; reports on ISG activities'' effectiveness; manages
    supplier requirements; and plans tests the security of business continuity measures

    - Technical security management establishes a security architecture and implements
    measures to control IT components and public infrastructure security;

    - Information systems, system, and data management provide security budgets, tools,
    and resources; measure the resource efficiency of security investments; define
    data security classifications; and guides managing access rights and data throughout
    its lifecycle;

    - Vulnerability and risk management control profile security threats and assess
    priorities, handles, and monitors security-related risks;

    - Information security compliance, control, and verification.


    As Table 7.1 shows, these high-level function categories are decomposed into 21
    security practice objectives (SPOs).


