  md: '# 262 IT Governance and Information Security


    # 8.2.1.5.4 ISO 27006 and Certification


    An organization can be certified in ISO 27001. Accredited auditors can only do
    this. The organization can only be certified if the ISMS and a number of controls
    are correctly implemented. ISO 27002 defines how an auditor can evaluate an organization
    to accred it. ISO 27002 defines two steps for the accreditation of an organization.


    # 8.3 RESEARCH METHODOLOGY


    # 8.3.1 Data Collection


    As part of this, MENA large organizations experts are interviewed. These experts
    hold the title of a security officer, or what most closely resembles their organization.
    We chose the large public sector organizations because there are interesting problems
    to this sector. For example, government organizations usually possess a lot of
    privacy-sensitive data - example, information about citizens. In addition, it
    appears that data leaves from public bodies are well exposed in the media.


    In the first round, we mailed a letter with details of the research content, what
    would be asked for, and their benefits. Before the final question, we is an optimized
    version of the ISO 27002 questionnaire presented in Appendix 1 (Table 8.4). A
    total of 20 organizations were selected, 6 agreements to give us interviews to
    answer our questions, that is, 30%, a percentage too credible for this research.


    In the second round, we validated the first results with a qualitative methodology
    through a case study in a large public organization in Morocco.


    As we conducted interviews by e-mail, we did not need to go to the locations of
    the interviews. When participants sent me answers that we could not understand,
    we then ask them to give me more details or explanations on previous comments.
    The e-mail interviews allowed us to interview several participants at the same
    time. They were also easy to transcribe. At some time, there was a lack of richness
    in the responses we received from participants. It was also not for participants
    to get clarification on the meaning of the questions, so we sent them a brief
    explanation of the theories by email. These explanations improve their possibilities
    if they gave appropriate answers. Table 8.2 shows the summary of key attributes
    of participating organizations.


