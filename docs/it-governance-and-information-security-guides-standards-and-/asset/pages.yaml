    #  2.3.2 LIBRARY ITIL


    ITIL is a framework of best practices, based on a process-based approach, to improve
    the delivery of high-quality IT services at low cost. Before its creation, agencies
    and private sector contractors independently created their own IT practices and
    duplicated efforts. The content of ITIL is independent of tools, vendors, or industry
    in which the service is executed and can be applied to organizations of any size.
    However, it is not intended to be applied as is; organizations are motivated to
    adapt it to their business needs.


    According to ITIL, service management is a set of specialized organizational capabilities
    for providing value to customers in services. The act of transforming resources
    into valuable services is at the core of service management. Without these capabilities,
    a service organization is merely a bundle of resources that by itself has relatively
    low value for customers. However, ITIL considers service management as more than
    just a set of capabilities. It is also a professional practice supported by an
    extensive body of knowledge, experience, and skills.


    ITIL also defines the distinction between functions and processes. Functions are
    specialized organizations with certain types of work and responsible for specific
    outcomes. Such organizations are self-contained, with all the necessary capabilities
    and resources available for their performance and outcomes. For example, the Service
    Desk is one of the role’s primary point of contact when there is a service disruption.
    On the other hand, processes can be managed as closed-loop systems, providing
    changes and transformations towards a specific goal and using feedback for self-reinforcing
    and self-corrective actions. Processes are measurable, have specific results delivered
    to customers, and respond to specific events. For example, event management is
    a process responsible for monitoring all the events throughout the IT infrastructure.


    Up to version 2, the ITIL focus was on processes, but since its version 3, the
    focus changed to business value. This change occurred to strengthen the relationship
    between the organization’s business needs and operational IT processes. Version
    3 also recognizes the value and applicability of other standards, such as COBIT
    and CMMI. The ITIL v3 structure comprises two components: the ITIL Core, which
    provides best practices applicable to organizations of all sizes and types, and
    the ITIL Complementary Guidance, which comprises a complementary set of publications
    with guidance specific to industry sectors, operating models, and technology architectures.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# IT Governance and Information Security


    The focus on Change Management Advisory Boards (CABs) in previous ITIL versions
    has led to a misperception of ITIL as not being agile or hindering rapid deployment.
    However, ITIL was never designed to be implemented in such a way that the IT department
    would evaluate or finuture changes.


    To reinforce this and help organizations develop flexible service management strategies,
    ITIL 4 incorporates agile and DevOps practices into the framework. ITIL4 encourages
    collaboration and communication within the organization and guides how to implement
    change quickly (Woo et al., 2020).


    # 2.3.3 Structure of ITIL 4


    ITIL 4 comprises the following subdivisions:


    +   * Key concepts (concepts) of service management;

    * The four dimensions of service management;

    * Service value system (SVS), whose guiding principles are detailed later;

    * Management practices.


    A brief explanation for each of these subdivisions is as follows:


    +   * Key concepts: value, cocreation, outcomes


    ITIL Foundation introduces some concepts that are important for a good understanding
    of the framework. These concepts include standard terms such as service providers,
    stakeholders, and risks. Nevertheless, new concepts are also emerging.

    ITIL 4 does not focus on service delivery, as was the case in version 3, but rather
    on value creation. It is not up to the service provider alone to provide this
    value. Instead, it is a co-creation, the result of a partnership with the customer.
    This version does not aim at respecting processes, but rather at pursuing objectives:
    outcomes and improved customer experience as one of the main objectives.


    +   * The four dimensions of service management


    Where v3 focused primarily on the 26 IT processes could be arranged, ITIL 4 goes
    further. The new version''s spirit also involves taking into account the four
    dimensions of service management for each service designed or delivered:


    +   * Organizations and individuals;

    * Information technology;

    * Partners and suppliers;

    * Value flows and processes.


    +   * Service Value System and Service Value Chain


    With a value-oriented perspective, we will no longer speak of ‘process models’
    but instead of ‘value systems’ or ‘value chains''.'
  merge: -1
  img_proc: true
