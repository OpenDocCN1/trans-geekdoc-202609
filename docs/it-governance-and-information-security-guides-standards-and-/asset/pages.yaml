    The authors used all 34 processes in COBIT 4 as a foundation to evaluate process
    capability by interacting with process owners at 52 organizations in several countries.
    The authors applied an extensive survey, which found that the main level of process
    maturity is rather low, with higher maturity being observed in more operational
    processes. However, the authors concluded that exploiting the COBIT framework
    in its entirety was too generic and may have directly correlated to the capabilities
    of any particular organization. On the other hand, Weber (2014) developed an evaluation
    framework based on a selection of processes to be used in South African organizations.
    The author concluded that using a selection of processes from COBIT 5 produced
    an acceptable and fit-for-purpose framework to use in evaluating ITG.


