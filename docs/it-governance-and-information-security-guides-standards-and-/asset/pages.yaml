  md: '# IT Governance and Information Security 61


    of governance must allow the ascent of understandable performance indicators used
    by management to assess the proper functioning of IT services, in response to
    the strategic business needs (Beloglazov al., 2014). The most common IT governance
    standards are presented later.


    # 2.3.1 COBIT


    The Information Systems Audit and Control Association (ISACA) and the ITGI founded
    COBIT in 1992. The first edition of COBIT was published in 1996, and the first
    and latest editions were published in April 2012. The framework has grown to,
    and still is, one of the most significant global frameworks for IT governance
    (Omari et al., 2012), COBIT was initially built as an IT audit guideline (ISACA,
    2012) because the framework contained a comprehensive set of guidelines to improve
    audit and compliance, provided detailed guidance on governance practices, and
    offered auditors customized checklists for various aspects of controls assessment
    (Hierierra, 2012). These aspects make COBIT a perfect framework for establishing
    control over IT; facilitating performance measurement of IT processes, and allowing
    executives to bridge the gap between control requirements, technical issues, and
    business risks (Brbauer, 2016). Also, COBIT has significant value in terms of
    increased compliance, risk reduction, and provider accountability is proven to
    be a useful tool to establish a baseline for process maturity (Nianxin et al.,
    2011). Moreover, the framework is growing to be universally applicable due to
    its full implementation as an IT governance framework (Ribeiro e Gomes, 2009;
    Wim van Gerenberg & de Haes, 2009).


    From an IT governance perspective, the primary objective of COBIT is to enable
    value creation by ensuring benefits are realized, reduced, and resources optimized.
    It is also proclaimed to provide business stakeholders with an IT governance model
    that improves the management of risks associated with IT leverages and a top-down
    structure to ensure systematic management of the detailed processes to achieve
    proper IT governance (Von Solms, 2005). The COBIT framework is considered to be
    a generic, comprehensive, and independent framework designed to measure the maturity
    of IT processes within organizations of all sizes, whether commercial, not-for-profit,
    or in the public sector (Elshnaoui et al., 2015; Nianxin et al., 2011).


    The COBIT framework has been steadily achieving worldwide recognition as the most
    effective and reliable tool for implementing and auditing IT governance and assessing
    IT capability. It is regarded as the leading standard to adopt for organizations
    striving to comply with SarbanesOxley (SOX) regulations in the United States.
    It is also considered a trusted standard that has been adopted, and it provides
    extended sets of predefined processes that can be continuously revised to support
