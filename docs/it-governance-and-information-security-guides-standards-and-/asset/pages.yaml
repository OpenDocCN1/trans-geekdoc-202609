    plan planned over three phases in 2 years, as presented in Table 7.5. To reach
    the desired level of maturity, the organization implemented some programs during
    each phase of the rollout. The following initiatives were adopted in the first
    phase (months 0–6):


    +   - Construct a white paper of technical guidance for application security on
    the technologies used within the organization;

    - Create a risk process and conduct high-level business risk assessments for application
    platforms and review the business;

    - Prepare initial guidelines and technical standards for developers;

    - Conduct short implementation reviews on application platforms that pose a significant
    risk to the organization;'
