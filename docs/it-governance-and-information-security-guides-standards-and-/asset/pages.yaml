    # 8.2 BACKGROUND


    The business policy has been conceptualized as a form of strategic management
    (Mintzberg, 1983). Two perspectives make up how strategy is made: deliberate formulation
    and emergent formation (Mintzberg, 1983). The classical approach advocated by
    Quinn is the approach to strategy grounded in the military strategy used for thousands
    of years. This type of strategy advocates the use of deliberate plans to win battles
    and wars. Prominent historical figures in military strategies such as Sun Tzu,
    Napoleon, Lenin, and Machiavelli have contributed to the classical strategy to
    its modern form. Rees et al. (2003) stepped away from this rigid approach to business
    strategy and by advocating an emergent approach. In this, an organization''s realized
    strategy is a combination of the organization''s deliberate strategy with the
    evolving emergent strategy. This emergent strategy is identified by a strategy
    of actions that can represent a pattern.


    Two perspectives of strategic management can be used to investigate the research
    behind IS security policy. One strategy is grounded in the classical approach,
    while the other in the emergent approach. The following section will utilize each
    of these perspectives in examining the literature behind IS security policy.


    formalism.


    Continuing with the classical perspective, Kühnhauser (1999) expounded on planning
    a multi-domain policy system. These are defined as systems that a multitude of
    independent security domains in which an individual IS security policy is enforced
    on the applications. Joshi et al. (2001) performed a logical analysis to produce
    a formal model of policy groups. Research has also examined the issue of multi-policy
    systems by investigating the ‘digital government’ (Knapp et al., 2007). A sequence
    of solutions to the issues of multi-domain environments are presented, including
    ad hoc approaches, formal approaches, model-based methods, agent-based methods,
    architectural methods, and the database federation approach. However, policy enforcement
    does not highly correlate with policy effectiveness (Baskerville & Siponen, 2002).


    The classical perspective has also welcomed a call for a security meta-policy
    (Willison, 2002). It is noted that existing IS security policy approaches do not
    pay attention to policy formulation itself. In other words, the actual creation
    of the policy is done in ad hoc manner. Calling for a meta-policy implies that
    to the best strategy or policy is through choice rational planning.'
