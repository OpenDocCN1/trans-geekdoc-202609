    # 3.7.4 Capability Level Analysis


    Figure 3.4 provides a box plot of the average capability level by the IT process.
    The mean capability level for all COBIT processes is at level 2 (managed process)
    but with a significant variation (SD = 0.89), strikingly clearer from the box
    plots. There are outliers at the highest and lowest levels of capability for each
    of these processes. As shown in Figure 3.4 there are clear differences between
    the 16 most important processes. The average level of process capability is relatively
    low within the organization, with most processes having a mean capability level
    score between 1 (19%) and 2 (56%) on a scale of 0 to 5. Only 19% of the processes
    have a mean capability level of 3, while just 6% had a mean capability level of
    4.


