  md: 'interesting to note another result of the survey: 31% of organizations practised
    security governance did not value this approach either internally or externally,
    and 33% have not communicated at all about their engagements. Evidence that ISG
    is not necessarily considered an asset in the communication plan of the organization
    with its various partners and collaborators.


    Given results of the survey, it seemed interesting to test whether the perception
    of the stakes of the governance was the same or not, for the organizations involved
    in the process and for having no practical experience, given the distinction made
    in the questionnaire about the organizations involved in the governance of information
    security. We observe 100% similarity in the first three priorities by ranking.
    The ranking differs from only a few organizations (fewer than 30) for the following
    benefits. Regarding the perceived obstacles of the approach, we observe 100% similarity
    in the classification results. Therefore, the perceived strategic purposes of
    ISG are very similar, whether or not the organization involved in this process.


    On the practical aspect, this research provides managers detailed information
    on the engagement of organizations in ISG. The survey suggests knowledge of organizations
    engaged in promoting the process, expected performance, effort to overcome difficulties,
    and sharing of positive values associated with IS promote the organization''s
    involvement in this process. It also describes medium and large companies of different
    sectors involved in the ISG in terms of knowledge and strategic challenges, implementation
    conditions, and governance organization. Finally, we addressed the challenge of
    the organizations interviewed regarding ISG.


    Based on the return of experience of this empirical study and different maturity
    models in the literature (ISACA, ISO 2700x), we suggest a practical IT security
    management and governance framework in the next part of this chapter.


    # 6.6 SUMMARY


    Today, protecting ourselves against IT risks through the establishment of good
    governance has become an important activity to maintain the operational capacity
    of organizations by best practices.


    This chapter proposes an exploration of the determinants of organizations best
    practices in ISG. The survey conducted among 200 large organizations proposes
    a model consisting of seven determinants of the commitment of organizations in
    the ISG process: it suggests that the knowledge of organizations engaged in the
    governance of security Information or promotion, the performance executed, and
    the effort deployed to encourage the commitment of organizations in the process.
    The responses to the questionnaire increase awareness of current practices of
    ISG implemented by organizations.


    By this empirical study and the results of our survey, a framework for measuring
    the maturity of information security was proposed to provide a practical tool
    for measuring and improving governance of information security in the organization.
    To show the effectiveness of the proposed framework, we implemented the resultant
    maturity framework in a large organization. The results will be presented in the
    next chapter.'
