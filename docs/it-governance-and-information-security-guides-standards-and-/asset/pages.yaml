- pgno: 185
  md: '# 5.9 THE ENVIRONMENTAL CONTEXT


    +   - The Competitive Pressure


    The environmental backdrop is the context in which a company operates and depends
    on the consumer dynamics, its competitors, and others’ ability to access capital
    and government relations. Cloud adaption include market competitiveness and regulatory
    environment. Adopting new technologies is also a competitive market rivalry imperative.
    Cloud computing offers greater operational flexibility, increased consumer exposure,
    and more reliable access to real-time data to businesses (Hsu et al., 2014).


    That is H9. The competitive pressure will influence the adoption of cloud computing.


    +   - Data Sovereignty


    Data sovereignty is the respect of rights associated with data based on the entity’s
    location that has control over it. Governments generally apply data sovereignty
    to limit the cross-border storage of (sensitive) data, limiting organizations
    to operating local data centers only when external services are more efficient
    and affordable (Abolfazli et al., 2015).


    Guaranteeing the ownership, security, and sovereignty of data has become a vital
    issue for companies, especially governments, who have decided to dematerialize
    their information systems in the cloud (Zhu, Kraemer, et al., 2006). Several organizations
    are asking questions about the store and sovereignty of data in the cloud. Answering
    these questions and clarifying misunderstandings around data sovereignty promote
    better cloud adoption.


    H10. Data sovereignty has an impact on cloud adoption.


    # 5.10 RESEARCH METHODOLOGY


    # 5.10.1 Quantitative Methodology


    This research uses a quantitative approach in which participants are not supposed
    to justify their reactions (Tashakkori & Creswell, 2007). Through this approach,
    researchers will explore participants’ thoughts, assumptions, and strategies.
    There are numerous studies performing quantitative performance. Such findings
    are grouped into technological, cultural, and efficiency measures. These studies
    interpret organizational characteristics, user characteristics, technological
    features, and information need as rigid, autonomous, and objective constructs
    rather than dynamic and interacting.


    Our study focuses on various aspects of cloud computing in information systems
    and their effect on IT agility. The quantitative analysis approach is presented
    in Figure 5.2.'
