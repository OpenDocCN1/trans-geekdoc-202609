    The quotation is based on ISO/IEC 27002:2013 (Peltier, 2013). Each question is
    waiting for an answer in the form according to the maturity model described in
    Table 8.3.


    # TABLE 8.3 The Maturity Level Model


    | VALUE | SHORT NAME | DESCRIPTION | DETAILS |

    |---|---|---|--|

    | 0 | Nonexistent | Nonexistent; process not exist or is not applied | Nonexistent
    – complete lack of any recognizable processes. The enterprise has not even recognized
    that there is an issue to be addressed. |

    | 1 | Initial/ad hoc | Initial/ad hoc; process is ad hoc and disorganized | Initial/ad
    hoc – There is evidence that the enterprise has recognized that the issues need
    to be addressed. There are, however, no standardized processes; instead, there
    are ad hoc approaches that tend to be applied on an individual or case-by-case
    basis. The overall approach to management is disorganized. |

    | 2 | Repeatable | Repeatable but intuitive; processes follow a regular pattern
    | Repeatable but intuitive – processes developed to the stage where similar procedures
    are followed by different people undertaking the same task. There is no formal
    training or communication of standard procedures, and responsibility is left to
