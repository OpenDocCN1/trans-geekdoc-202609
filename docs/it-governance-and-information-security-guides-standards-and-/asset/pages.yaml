  md: '# # Information System and IT Governance Evolution


    # ## 1.1 INTRODUCTION


    The first generation of information systems was mainly considered a strictly technical
    discipline. To automate existing manual processes, each application is considered
    a separate entity, and its use aims to increase organizational productivity and
    efficiency. As a result, the primary efforts of IT professionals have been to
    develop new methods for modeling organizational information; hence, database management
    was the ‘killer application’ (Chen, 1976; Halpin, 2001). Also, the possibility
    of networking and the advent of personal computers (instead of terminals) has
    provided the cornerstone for a new and broader use of information technology,
    which promotes a transition in the use of technology and its use. However, the
    second phase’s conceptual challenge was to manage the information rather than
    merely collect it and store it in a central database (Aiken et al., 1991; Batra
    et al., 1988; Dennis et al., 1988; Drucker, 1995; Galluppe et al., 1988; Olson,
    1985; Zwass, 1992). The designation of the services reflected this commitment
    to support management rather than office work: most IT services became management
    services and were coordinated by IT managers (Couger et al., 1979).


    However, during this period, most IS activities focused primarily on data management,
    with little attention to information management needs (Goodhue et al., 1988; Senn,
    1978).


    Since the 1980s to the early 1990s, research has focused more on identifying relevant
    information technology applications, which has led to new applications, through
    generic systems, data processing systems and information management system (MIS).
    CIOs realized that it is possible to effectively leverage the advanced information
    content of MIS applications in support of top management’s decision-making processes.
    Thus, during the second phase, a new concept was developed, including decision
    support systems (Kasper, 1996), expert systems (Yoon et al., 1995), data warehousing'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 10 IT Governance and Information Security


    (Chenoweth et al., 2006), intelligent system (Gregor & Benbas, 1999), knowledge
    management systems (KMSs) (Alavi & Leidner, 2001), and executive information systems
    (Walls et al., 1992).


    The management services were renamed information services, the primary objective
    of which was to make information accessible to all departments of the organization.
    Issues of inter-connectivity, scalability, and reliability of the information
    system have become essential. Also, enterprise resource planning (ERP) system
    is merging with an exponential increase in installations in large organizations
    (Beaty & Smith, 1987; Hayes et al., 2001; Scheier & Habermann, 2000; Sharif et
    al., 2005).


    In the third phase, the critical change introduced the emergence of global networks
    and the World Wide Web (WWW), which have overcomed the traditional limitations
    of IT use.


    Many researchers perceive Internet computing as a significant computer revolution
    that has changed previous concepts (Isakowitz et al., 1995), in different ways,
    mainly how a computer service is developed and compiled. A new concept marked
    this phase: the ‘digital enterprise’ (Bauer et al., 2001).


    The Internet has enabled new digital relationships to be established through organizational
    systems, taking advantage of e-commerce and business services (Allen, 2003; Daniel
    & White, 2005; Shore, 2006), electronic markets (Albrecht et al., 2005; Bakos
    et al., 2005), new application services and CRM, other services (Currie et al.,
    2014; Ma et al., 2005, Susarla et et., 2006). The Internet has allowed the emergence
    of business models based on the degree of digitization of their products, services
    sold, business processes, or delivery agents (Oetzel, 2004; Turban, 2007).


    Meanwhile, organizations have become aware of the strategic importance of information
    systems. While initially considered IT as ‘necessary evil’, IT has emerged as
    a necessary part of staying in business, and many companies see it as an essential
    source of strategic opportunities, proactively trying to determine in what way
    it can help them gain competitive advantage.


    Strategic information systems have been developed to support strategy formulation
    and planning, particularly in uncertain and highly competitive environments (Buhalis,
    2004; Newkirk & Lederer, 2006).


    The third phase marked the technological development in miniaturization of the
    devices and increasing processing capacity, which ultimately allowed them to be
    commercially exploited in line with their functions.


    The manifestation of IT users in physical space makes it possible to offer new
    applications and services that target a much larger and more diverse group of
    users. Traditionally, users had to be trained in the functionalities of the information
    system. This training process can be supplemented either formally or through repeated
    trial and error.


    The vision of ‘everyday computing’ (Zaphiris et al., 2002) requires that information
    technologies can be used, literally by everyone, regardless of their knowledge
    and experience in computing. Wireless sensors can detect and process information
    about the individual and trigger the system response based on certain dynamic
    or predefined events.'
