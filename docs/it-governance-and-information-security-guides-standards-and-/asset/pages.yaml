  md: '# 5.3 THEORETICAL FOUNDATION


    Tornatzky et al. (1990) outlined the technological, organizational, and environmental
    (TOE) framework to understand the innovation process in an enterprise context.
    It addresses three factors that influence the adoption of an innovation: technology,
    organization, and the environment. Technology context means the internal and external
    technologies pertaining to the organization and those that could be adopted. Organizational
    context relates to company describe characteristics (i.e., size, organizational
    structure, level of centralization), resources (human and insufficient resources),
    and communication process (formal and informal) among employees. Concerning the
    environment, this context includes market elements, competitors, and the regulatory
    framework.


    Several studies have examined technical and operational issues related to cloud
    computing, involving topics as selecting cloud computing services in terms of
    cost and risk, secure storage audit protocol and computing in the cloud, cost
    of cloud computing ownership models and security issues, privacy risks, and information
    loss.


    Triuero-Preciado et al (2013) surveyed 94 Spanish small- and medium-sized businesses
    and found that knowledge of cloud computing was poor among companies and that
    companies did not know much about cloud computing.


    Our analysis of academic sources revealed few research chapters that examined
    the implementation of cloud computing from an operational point of view, as given
    in Table 5.1.


    In their study, Abdollahzadehgan et al (2013) used DOI and TOE platforms to research
    the implementation of cloud computing in Taiwan''s high-tech industry, they often
    find cloud adoption rather than a continuous cycle as a complex, dependent variable.
    However, their approach was not robust, as did not consider core drivers such
    as cost savings and security issues essential to the company''s cloud infrastructure
    adoption.


    Nkhoma et al. (2013) used secondary data from the survey of a large services company
    to study the drivers and barriers to cloud computing adoption. Wu et al. (2013)
    investigated whether the information processing requirements and affect the firm’s
    intention to adopt cloud computing; they used the DOI theory and information processing
    (IPV) to conduct the study in the supply chain domain.


    The review of published journal articles indicates that most studies empirically
    evaluate the effects of innovation, contextual factors, or codent analysis using
    qualitative methods or secondary data on the adoption of cloud computing. In addition,
    we found that no study has taken a holistic approach to validate the direct and
    indirect effects of innovation characteristics and the underlying technology,
    organization, and environmental contexts. The study by Yang & Tate (2012) indicates
    that research on cloud computing is skewed toward technological issues. They highlight
    the lack of cumulative research to address cloud computing’s social, organizational,
    and environmental perspectives. This study addresses this crucial gap by developing
    an integrative research model that combines the theoretical perspectives of the
    diffusion of innovation and the technology, organization, and contexts. Table
    5.1 discusses cloud computing studies in the literature.'
