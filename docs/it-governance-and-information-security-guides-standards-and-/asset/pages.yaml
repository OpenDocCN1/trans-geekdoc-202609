    # 1.1.13 IT Governance


    Despite IT Governance (ITG)''s importance and the currency of the term since the
    late 1990s, academics working in the area continue to define the term in several
    ways (Webb et al., 2006). This lack of a comprehensive definition has possibly
    impeded in-depth research, further limiting the validity of cross-study comparisons
    of results (Simonson & Johnson, 2006). It is thus necessary to clarify the concept
    of ITG through systematically classifying and drawing together various definitions
    of ITG in the hope of supporting active research. A variety of definitions of
    ITG are summarized in Table 1.1.


    These diverse definitions may be classified into three perspectives. First, researchers
    seek to understand ITG as the location of decision-making rights and accountabilities
    within organizations. Peterson (2004) and Weil and Woodham (2002) define ITG as
    basically decision-making in the IT domain, focusing on the distribution of decision
    rights and accountabilities (or responsibilities) to effectively use IT resources.'
