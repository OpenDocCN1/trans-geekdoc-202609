    # 4.3.1 IT Service Management (ITSM)


    Most ITSM organizations consider the Service Support process a difficult task.
    Difficulties are mainly due to the following reasons:


    +   - IT organizations do not have a structured approach for measuring IT service
    and service management processes.

    - Different tools exploited by IT Support Teams do not enable effective measurement.

    - ITSM referral and standards do not provide practical guidelines and a road-map
    to measure the IT support process (Lahtela, 2010).

    - Therefore, the IT Support processes such as ITIL V2/V3 or other reliable sources
    to increase IT quality of services. So, implementations of the Service Support
    process are chosen as a priority to support continuous improvement in ITSM.


    As illustrated in Table 4.2, the IT Service Support process includes five main
    steps (Wui-Gee, 2009).


    The scope of the evaluation would cover only the key processes of the service
    operation and service transition. Data are collected through interviews, workshops,
    literature reviews, and site visits. Visits to the service desk and data center
    may be required. A list of questions is used often. A time-based assessment would
    aim to determine the level of maturity of each ITIL process. Other data to be
    collected include the availability of tools, competencies, the role, and responsibilities
    of the organization, availability, and quality of documentation, evidence of continuous
    improvement, measurement and reporting, dissemination, and the use of reports.
    Based on the answers to the questions collected, the scores are tabulated using
    a spreadsheet tool and presented. A time-based assessment can use the five-level
    ITSM maturity model to evaluate the individual process of ITSM shown in Table
    4.3.'
