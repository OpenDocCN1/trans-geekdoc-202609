    # # 8.4.6 Security Requirements


    The Information Systems Security needs of the PUBLIC_ORG are based on four criteria
    (AICD):


    +   * Availability: Guarantee that the elements considered (files, messages, applications,
    services) are accessible at the desired time by the authorized persons;

    * Integrity: Ensure that the elements considered (data, messages, etc.) are accurate
    and complete that they have not been modified;

    * Confidentiality: Guarantee that only authorized persons have access to the elements
    considered (applications, files);

    * Data recovery point: Ensure that data are restored following a loss according
    to its criticality.


