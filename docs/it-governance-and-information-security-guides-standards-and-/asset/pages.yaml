  md: '# 8.3.2 Data Analysis


    For each interview, a report was written. The size was limited to about one page.
    The following section contains the reports from each interview. For reasons of
    anonymity, organizations are indicated by alphabets from A to F. The questionnaire
    results for each organization are presented in the following section. For each
