  md: '# Information Security Governance

    Best Practices in Organizations


    # 6.1 INTRODUCTION


    The threat to technology-based information assets is greater today than in the
    past (Maleh et al., 2018). The evolution of technology has also reflected in the
    tools and methods used by those attempting to gain unauthorized access to the
    data or disrupt business processes (Goodhue & Strauss, 1991). whatever the organization
    (''Information Security Governance: Guidance for Boards of Directors and Executive
    Management'', 2006). However, the degree of sophistication and persistence of
    these attacks depend on the attractiveness of this organization as a target (Rockart
    & Crescenzi, 1984), mainly regarding its role and assets. The threats posed by
    some misguided individuals have been replaced by international criminal groups
    highly specialized or by foreign states that have the skills, personnel, and tools
    necessary to conduct secret and sophisticated cyber espionage attacks. These attacks
    are not only targeted at government entities. In recent years, several companies
    have infiltrated, and their data have been ''consulted'' for several years without
    their knowledge. Improving cybersecurity has emerged as one of the IT priorities
    across all business lines. So, while companies (von Solms & Niekerk, 2013; Bowen
    et al., 2007) and areas such as the aerospace industry and strategic resources
    are ideal targets for cyber espionage by nation-states, others managing financial
    assets or large-scale credit card information are equally attractive to international
    criminal groups (Posthumus & von Solms, 2004; Humphreys, 2008).'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 190 IT Governance and Information Security


    These malicious actors no longer content themselves with thwarting the means of
    technical protection. Instead, they survey and exploit various weaknesses detected
    in the targeted environment (Galliers & Laird, 2014). These shortcomings are technological
    result from failures in protection procedures or gaps in vulnerability management
    practices. If misused, the best technology in the world will not provide an adequate
    defense against such threats (Volms & van Niekerk, 2013).


    Ensuring IS in a large organization is a real challenge (Sohrabi Safa et al.,
    2016). Only good governance can recover the general management, customers and
    partners, shareholders, and the public at large (Mark Duffield, 2014).


    The problem is that the security governance framework is designed to organize
    its governance strategy but does not define the practical framework for the engagement
    in this.


    now include best practices and international standards (NIST, ISACA, ISO 27000,
    etc.). The first reports or articles in academic journals that evoke the governance
    of information security date back to the early 2000s.


    The proposed referential and best practices are designed to guide organizations
    in their IT security governance strategy. It does not define the practical framework
    to implement or measure the organization''s engagement in IT security governance.


    This chapter studies the practices and commitments of organizations in IS security
    governance. A survey of 836 medium and large companies at the international level
    (USA, UK, France, China, Russia, etc.) was set up to define the best practices
    of these organizations regarding information security governance (ISG). This allowed
    us to propose a practical framework to evaluate the organization''s maturity state
    and improve its level of information security governance according to its needs
    and resources.


    This chapter is structured as follows. Section 6.2 presents the previous work
    on information security governance proposed in the literature. Section 6.3 describes
    the research methodology. Section 6.4 presents the survey carried out 836 medium
    and large companies and gave an accurate picture of their practices in ISG through
    statistical analysis. Section 6.5 describes the proposed capability maturity framework
    for ISG. Finally, Section 6.6 presents the summary of this chapter.


    # 6.2 LITERATURE REVIEW AND BACKGROUND


    In management sciences, several authors put forward the responsibilities and roles
    of management and general management. Thereby, Straub & Welke (1998) argued that
    the security risk for IT could be reduced when managers are aware of the extent
    of existing controls and implement the most effective controls based on the identified
    risks. Williams (2001) then the president of ISACA and co-founder of the IT Governance
    Institute ruled that directors of organizations are responsible for protecting
    shareholder value and that this responsibility applies to valued information assets.
    F. Rockart & D. Crescenzi (1984), Markus (1983), and Knapp et al. (2009) confirmed
    that security must take into account at the general management level of the organization.'
