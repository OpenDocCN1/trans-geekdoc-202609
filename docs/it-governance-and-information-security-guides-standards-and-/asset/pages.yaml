- pgno: 15
  md: '# Preface


    Implementing information technology (IT) governance is imperative for driving
    and evolving the information system (IS) in agreement with the stakeholders. This
    requirement has been seriously amplified in the era of digital transformation.
    Historically, the information system entered the company in stages, as services
    were provided, but today, it plays a key strategic role and must be managed in
    this way.


    IT Governance (IT-GO), which has emerged in the business and IT world, is a complex
    subject to demystify. Researchers and professionals from different perspectives
    have investigated this field. From a theoretical point of view, studies have been
    carried out on decision-making structures, affecting factors and characteristics
    of IT-GO. Instead, professionals became interested in the technical mechanisms
    and tools of IT-GO. The latter, there has no study addressing IT-GO as a whole,
    nor a holistic approach integrating governance, risk management, compliance, and
    agility into a single approach to manage IT services. To develop this approach,
    we have a plethora of methodologies and standards, which have been developed to
    achieve business objectives, including ISO 27001, 38500, COBIT, ISO 27005, and
    ITIL or DevOps or SecOps. Organizations use various mechanisms to ensure that
    their security architecture is aligned with the organization’s business objectives
    and complies with local standards, rules, and regulations for global IT and IT-GO
    governance. Despite the different options available, there is a fundamental confusion
    about the various methods used by IT managers and between the different terminologies
    that have suddenly emerged (all at once) in the business world, including corporate-GO
    (C-GO) and IT-GO, due to their lack of a Universal approach to governance.


    This book discusses strategic information technology governance and information
    security: guides, practices, and maturity frameworks. There are many works which
    discuss the topic of IT governance. However, this main concept is to explore IT
    governance and information security through new approaches for IT governance in
    a large organization. This book can examine IT governance and information security
    and provide IT staff, managers, and various IT professionals with frameworks and
    models to implement effective strategic governance.


    The book’s scope covers the maturity of IT governance and information security
    processes in the organization, which closely associates general management, business
    alignment, and departments.


    On the other hand, and despite their importance, it does not cover the operational
    aspects of IT management, such as project development and the recurring production
    of services, as long as these are placed entirely under the responsibility of
    the IT department and therefore have less interaction with the rest of the organization.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'These operational aspects are also dealt with, particularly in the ''general
    IT controls''. Our approach consists of addressing IT governance and information
    security through four axes:


    +   * IT governance guides and practices;

    * IT Service Management as a key pillar for IT governance;

    * Cloud computing as a key pillar for Agile IT Governance;

    * IT-GOV and maturity frameworks.


    In the context of these trends, this book addresses significant issues in the
    field of IT governance and cybersecurity. For its value to be practically and
    scientifically realized, this book aims to provide a sampling of recent advances
    and ideas on research progress. It will present the state of the art and the state
    of the practice of how to address unique IT governance and information security
    challenges facing emerging technologies. This book is ideally designed for policymakers,
    students, researchers, academicians, and professionals looking for current research
    interesed in exploring and implementing efficient IT governance and information
    security strategies.


    Yassine Maleh

    Abdelkebir Sahid

    Mamoun Alazab

    Mustapha Belaissaoui'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# About the Authors


    **Yassine Maleh** (http://orcid.org/0000-0003-4704-5364) is an associate professor
    of cybersecurity and IT governance at Sultan Moulay Slimane University, Morocco.
    He is the founding chair of IEEE Consultant Morocco and founding president of
    the African Research Lab in Cybersecurity and Information Technology. He is a
    senior member of IEEE and a member of the International Association of Engineers
    IAENG and The Machine Intelligence Research Labs. Dr Maleh has made contributions
    to the fields of information security and privacy, Internet of things security,
    wireless and constrained network security. Internet of things, network security,
    information systems, and IT governance. He has published over 50 papers (book
    chapters, international journals, and workshops), eight edited books, and is the
    editor-in-chief of the International Journal of Information Security and Privacy
    (IJISP) and the International Journal of Smart Security Technologies (IJST). He
    serves as an associate editor for IEEE Access (2019 Impact Factor 4.098) and the
    International Journal of Digital Crime and Forensics (IJCDF). He was also a guest
    editor of a special issue on Recent Advances on Cyber Security and Privacy for
    Cloud-of-Things in the International Journal of Digital Crimes and Forensics (IJDCF),
    Volume 10, Issue 3, July-September 2019. He has served and continues to serve
    on technical and program committees and as a reviewer of numerous international
    conferences and journals such as Elsevier Ad Hoc Networks, IEEE Network Magazine,
    IEEE Sensor Journal, ICT Express, and Springer Cluster Computing. He was the Publicity
    chair of BCCA 2019 and the General Chair of the MLBDACP He has received the Pubon
    Top 1% reward for the years 2018 and 2019.


    **Abdeker Sahid** (https://orcid.org/0000-0003-2952-5700) is a Ph.D. of the Hassan
    1st University in Morocco, in Information Systems Management Agility, 2014. Dr
    Sahid is Senior Lecturer IDS (Information Systems and Decision Support) laboratory
    at Hassan 1st University since 2019. Dr Sahid has made contributions to the fields
    of Information Systems Strategic Agility. IT Management, and Governance. He has
    published over 30 papers (book chapters, international journals, and conferences/workshops)
    and is the author of two books: *Strategic IT Governance and Performance Frameworks
    in Large Organizations* published by Emerald. In addition, he has served and continues
    to serve as the reviewer of numerous international conferences and journals, such
    as the *Journal of Cases on Information Technology (JCIT)* and the *International
    Journal of End-User Computing and Development (IEUCD)*.


    **Mamoun Alazab** (https://orcid.org/0000-0002-1928-3704) is the associate professor
    in the College of Engineering, IT and Environment at Charles Darwin University.'
  merge: -1
  img_proc: true
