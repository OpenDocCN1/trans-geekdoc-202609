  img_proc: true
- pgno: 34
  md: '# 1.1.4 Features of Enterprise applications


    The critical characteristics of enterprise applications are autonomy, distribution,
    and heterogeneity (Hasselberg, 2000; Roman et al., 2005).


    The three attributes are mutually perpendicular to each other they constitute
    the application''s independent dimensions. Each of these characteristics can create
    specific problems to make different applications work together. The objective
    is to manage these dimensions to increase the capacity of applications. To these
    three dimensions, some authors as Hasselberg (2000) have added another dimension
    called dynamism because applications can evolve according to the evolutions and
    changes that occur in their environment, as shown in Figure 1.6.


    # 1.1.5 Autonomy


    An organizational application is autonomous when it is possible to design and
    execute it independently. In the context of databases, Hasselberg (2000) proposes
    a classification of autonomy notion by defining several aspects of this concept:


    +   - Design autonomy means that an application is independent of other applications
    in its intrinsic design (its data model, its processing model, etc.);

    - Autonomy of communication means that an application can locally choose with
    which applications it can communicate;

    - Runtime autonomy means the independence of the application to manage actions
    with its external environment. The level of autonomy depends on the organizational
    changes implemented to this end.


    ![](img/62b08fcc83049d99252c223afe5d1c9e_34_0.png)


    FIGURE 1.6 Dimensions of enterprise applications.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 1.1.6 Distribution


    The second characteristic of enterprise applications is distribution, which refers
    to the fact that the applications are often physically distributed over the enterprise
    network. This is achieved by distributing the data and/or processing so that specific
    data and/or processing in the information system can be implemented at the local
    level.


    Among the techniques most used to enable application distribution, distribution
    is based on the implementation of middlewares such as CORBA (Group, 1997), Java/RMI
    (Newcomer, 2002; Vaughan-Nichols, 2002), and MOM (Hohpe & Woold, 2004).


    # 1.1.7 Heterogeneity


    The heterogeneity is an inherent in that enterprise applications can be developed
    and deployed independently and according to different approaches and methodologies.
    There are several reasons why heterogeneity can occur at different levels, and
    three primary levels of heterogeneity can be distinguished as follows (Wiederheld,
    1992):


    +   - Technological heterogeneity corresponds to the differences present in the
    necessary hardware and software used;

    - Heterogeneity at the hardware level includes differences related to computers
    and networks used;

    - Basic software heterogeneity (platform heterogeneity) includes differences associated
    with operating systems, database management systems, execution platforms, etc;

    - Syntactic heterogeneity refers to the differences in data formats and application
    interfaces, the signature of syntactic transformations can resolve.


    This heterogeneity expresses that the symbolic name of a concept can be interpreted
    differently according to the applications considered. These semantic conflicts
    occur merely when (1) the same symbolic name cover different concepts (in this
    homonym) or (2) several symbolic names cover the same concept (and in this case,
    synonymy).


    Semantic problems are a fact in any company. Also, it becomes vital that these
    conflicts are identified and resolved as soon as possible, preferably before the
    upstream phases of the project. Many authors (Hasselbring, 2000; Roman et al.,
    2005) admit that the heterogeneity of applications is the real change in integration.


    # 1.1.8 Dynamism


    The dynamism of enterprise applications is another feature introduced by Sarkis
    (2001). Indeed, as current information systems are open and exposed to frequent
    changes in response to strategic, commercial, or technological changes affecting
    the company, the applications of these systems should evolve dynamically to cope
    with these changes. Dynamism is a dimension that is generally manifested in two
    ways:'
  merge: -1
  img_proc: true
