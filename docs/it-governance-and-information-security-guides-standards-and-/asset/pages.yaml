  md: '# # IT Governance in Organizations

    A Maturity Framework Based on COBIT 5


    # ## 3.1 INTRODUCTION


    Strategic information technology (IT) has become an indispensable element for
    success in the contemporary business world. The dependency on IT by many organizations
    today to support, sustain and drive organizational growth increases (Posthumus
    & von Solms, 2004). Business and IT alignment are considered one of the main issues
    in managing its IS (information system). However, alignment is described as an
    object that can never be achieved entirely and must be adjusted frequently within
    the organization (Baker & Jones, 2008). To maximize alignment facilitators and
    minimize inhibitors, various frameworks are developed for IT Governance (ITG),
    which is an important concept for IT organizations in enterprises (Joshi et al.,
    2018).


    Many professionals and researchers believe that Information System Governance
    is a complex subject. The words that immediately come into use of jargon are ''strategic
    alignment, Arid, Boring, Wave, unrealistic'', organizational transformation, value
    creation, synergy creation'', complicated vision and mission statements, which
    the average person finds difficult to understand (Peterson, 2001). The result
    is IT governance is poorly adopted as corporate governance because of the lack
    of understanding of its role within the organization (Luna-Reyes et al., 2020).


    The purpose of this chapter is to determine how effectively adopt frameworks,
    practices, and standards as organizations face significant challenges in meeting
    their IT governance obligations. Despite the potentially costly consequences of
    IT and business alignment failure, there is little direct guidance to organizations
    on providing, demonstrating, and maintaining IT governance (Renaud et al., 2016).


    A key aspect of this problem is twofold. The finding is that there is a lack of
    theoretical knowledge on examining the adoption and adaptation of IT governance
    frameworks.'
  merge: -1
  img_proc: true
