    et al., 2011).


    Competence and understanding (H8) is a key factor in cloud adoption in various
    organizations. Organizations are embracing the cloud world (Abolfazli et al.,
    2015). The pattern will continue with talent acquisition, retention, and performance
    management. Today, these problems are critical for businesses that want to stand
    out from the crowd to attract and retain the best applicants and meet new generations''
    standards.


    # 5.15 ENVIRONMENTAL CONTEXT


    Few kinds of research have discussed cloud computing''s environmental significance.
    According to competitive pressure pushed high-tech firms to adopt cloud computing
    faster, Ifinedo (2011) also determined that competitive pressure positively impacts
    the adoption of e-commerce technologies. While customers, business partners, and
    government support played no significant role.


    Data sovereignty (H10) is a crucial factor in cloud adoption. The challenge for
    companies to handle data sovereignty is heightened by various approaches that
    governments are taking to ensure citizens'' data privacy (Abolfazli et al., 2015).


    # 5.16 DISCUSSION AND INTERPRETATIONS


    Survey results indicate that market pressure will not decide cloud adoption. Companies
    are probably aware of cloud benefits, but specific technology factors and organizational'
