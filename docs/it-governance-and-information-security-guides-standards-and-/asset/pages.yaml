- pgno: 67
  md: '# 2.2.1 The Word of the IT Governance Subject


    The word ‘subject’ answers the question ‘What is IT governance?. It is a faceted
    description of the intrinsic nature of governance. This word has six facets: GOVERNANCE
    ORGANIZATION, DECISION, IT PROCESS, BUSINESS PROCESS, CHANGE, and PROJECT PORTFOLIO.
    All of these facets make it possible to situate IT governance as a set of organized
    activities for decision-making dedicated to the choices to be made for IT projects,
    their impacts on business processes and IT processes. Table 2.1 lists all facets
    and their values for the subject''s word.


    +   - ORGANIZATION OF GOVERNANCE


    Weil and Ross (2004) propose to analyze the management behavior of information
    systems by comparing it to the archetypes of state governance. They describe the
    organization around decision-making. Centralized decision-making is responsible
    when compared to a monarchy, and collaborative decision-making is compared to
    participatory democracy between two groups (business and IS). This decision-making
    structure is organized around a typology of decisions, and the study shows that
    investment decisions in new technologies are the responsibility of the business
    departments.


    In contrast, more technical decisions concerning the architecture and infrastructure
    of the system are the responsibility of the IT department. De Haes (2005) agrees
    with this that an organization of Information systems is structured for decision-making
    around a committee where roles and responsibilities are distributed.


    The ORGANIZATION OF GOVERNANCE facet reflects a structure where responsibility
    for decisions is assigned to a single person. For example, the CIO is responsible
    for IT decisions without consulting business managers. A decentralized governance
    structure represents an organization where the decision results from an exchange
    and constitutes a consensus among several stakeholders. A hybrid structure makes
    it possible to adopt a centralized mode of responsibility for certain decisions
    and decentralized for others.


    +   - DECISION


    # TABLE 2.1 List of Facets of the Word ‘Subject''


    | FACET | VALUE |

    | --- | --- |

    | GOVERNANCE ORGANIZATION | Enum(centralized, decentralized, hybrid) |

    | DECISION | Enum(it architecture, IT infrastructure, project planning) |

    | IT PROCESS | Enum(documented, piloted, evolutive) |

    | BUSINESS PROCESS | Enum(productive, administrative, ad-hoc, collaborative) |

    | CHANGE | Enum(ad-hoc, evolutive, corrective) |

    | IT PROJECT PORTFOLIO | SET(classification mode: Enum(monocriteria, multi-criteria);
    transformation mode: Enum(creation, maintenance, evolution)) |'
