- pgno: 296
  md: '# 8.4.7.10 Supplier Relationships


    8.4.7.10.1 Information Security Incident Management


    A procedure to ensure the recording and reporting of any security incident must
    be defined. (Users bank staff, contractors, and third-party users with access
    to the system) must be informed of their obligation to report any security incident
    (loss/threat of PUBLIC_ORG information, documents, or material) as soon as possible.


    PUBLIC_ORG''s incident management procedure includes reporting mechanisms for
    these incidents and a specific organization for handling security alerts.


    8.4.7.10.2 Information Security Aspects of Business Continuity Management


    Business continuity and business resumption plans must be maintained to restore
    PUBLIC_ORG''s critical activities within the required timeframe after an interruption
    or failure of their critical processes.


    The continuity plan integrates preventive and curative measures enabling business
    management to overcome a major incident by reducing the impact on its activities
    to an acceptable level.


    These plans must indicate the conditions under which they are triggered, the organization
    of the implementation, the crisis management measures, the detailed planning of
    the actions to be carried out, the communication plans, and the means used for
    crisis management.


    A disaster scenario approach is preferred to consider the various scenarios (e.g.,
    destruction of the computer room, and unavailability of premises) and to plan
    appropriate corrective measures (e.g., regular extraction of vital information
    on paper, redundancy of sensitive environments).


    The emergency site in Tangier must meet international standards in terms of physical
    security.


    # 8.4.7.11 Compliance


    8.4.7.11.1 Identification and Communication of Applicable Legislation


    All legal, regulatory, and contractual requirements must be identified and documented
    for each information system. These regulatory requirements may include the following:


    +   - Protection of personal data;


    +   - Respect for intellectual property (e.g., keeping proof of software purchase,
    maximum number of users allowed on a system, information to staff on legal issues).


    8.4.7.11.2 IS Security Audit


    Information security should be audited and monitored periodically. The audit should
    focus on compliance with security policies and procedures and the effectiveness
    of the security measures in place and their adequacy to the potential risks identified.


    Access to security audit tools and reports must be protected to prevent possible
    misuse or compromise.'
