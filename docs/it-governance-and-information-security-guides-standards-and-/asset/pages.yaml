    # 4.1 INTRODUCTION


    In the age of digitization, the world is evolving at a constant pace. Organizations
    need to respond to changing conditions and often agility is the only guarantee
    of survival. Globalization means that there is more competition (Kumbakara, 2008).
    The life cycle of products is shorter than ever. A disturbing technology can change
    markets overnight. The company faces challenging challenges in maintaining security
    and compliance while achieving its business objectives, complying with current
    regulations, and managing staff and technology. We understand that the IT staff
    must react quickly to changing business while maintaining the existing infrastructure.
    We also know that the management objective so often quoted, ‘Doing more with less’,
    is not only a goal but also a corporate commitment (Mesquida, 2012).


    Most CIOs believe that IT management is simply about filling security gaps, collecting
    inventory, and automating application delivery, and they are not convinced that
    it is also necessary to define and better manage the assets, processes, and services
    that determine resource allocation, cost control, performance measures, and service
    delivery.


    With improved Service Management (ITSM) processes and the adoption of best practice
    guides and benchmarks as ITIL (van Bon, 2007) and ISO 20000 (ISO/IEC'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 130 IT Governance and Information Security


    20000, 2010), compliance appears to be a need rather than a strategic choice to
    improve rapidly and easily decisions about IT and business processes. Get better
    agility, which allows the business to benefit from a faster Return On Investment
    (ROI) and a constant competitive advantage.


    Recent developments in the field of IT governance and ITSM have led to the introduction
    of new technology and concepts such as service-oriented architecture (SOA), decision-making,
    and course agility (Uebernick, 2006).


    Over the last decade, agility has been proposed primarily around methods, such
    as Scrum (Ken Schwab, 2004) and Extreme Programming XP (Beck, 1999), for lifecycle
    management of software and IT developments. However, with the strategic changes
    that companies are currently experiencing, agility is a more strategic than a
    simple development method, affecting all business activities.


    The management of IT services implies the adoption of an agile vision. Resilience
    adds a layer of flexibility and dynamism to this management (Sahid et al., 2021).


    The IT department''s responsibility for maintaining and securing the IT environment
    now includes all departments employees use, but budgets and IT resources are limited.
    Agility is the right solution for IT departments to streamline processes and manage
    all aspects of end-user productivity. The objective is to refine the traditional
    IT services of the ''control'' and control'' type, oriented peripheral by a complete
    integrated approach, oriented user. ITSM increases communication efficiency between
    business departments and implement services. The needs of ITSM in organizations
    can change by how they do business, communicate, and also develop and innovate,
    gain a market advantage (Brooks, 2006). In addition, ITSM allows companies to
    internally govern and follow the global standards (Mior, 2008). To better understand
    the ITSM concept in the organization, reviewing the ITSM component would be helpful.
    ITSM components consist of Process, Technology, Management (people), Organization,
    and Security, which is recently added to agile construction to improve the security
    parity (Park, 2008), (Mcaughton, 2010).


    At first glance, the Agile and IT principles seem to contradict each other because
    of the values they promote. However, these two share common values that should
    be put in synergy to get the most out of them. Version 4 of ITIL, published in
    February 2019 (Shekhor, 2020), will go in this by adopting ITSM best practices
    for agile operating methods.


    In literature and industry, there is no practical, concrete, and agile method
    for implementing IT services and assets management in the literature and even
    references as ITIL, ISO 20000, and COBIT (Adelkbir et al., 2017). This chapter
    proposes a global, practical, and agile framework to support ITSM and IT Asset
    Management (The proposed framework surpasses the limitations of existing methods/referential
    and meets the needs of international standards in terms of flexibility and agility
    to improve and enhance ITSM/IT processes. This generic framework will help any
    type of organization implementation an agile, secure, and optimal IT Service Center.
    We measure the proposed framework by adopting a continuous improvement process
    based on DevOps (DevOps is the concatenation of the first three letters of the
    word ''development'' and the usual abbreviation ''ops'' of the word ''operations'')
    and the PDCA Deming cycle.'
