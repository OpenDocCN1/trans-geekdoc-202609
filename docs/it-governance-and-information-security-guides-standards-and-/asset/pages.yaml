    # 1.1.10 Enterprise Information Systems Complexity


    Over the past 70 years, information technologies have rapidly evolved and revolutionized
    the company''s tools (high-level programming languages, databases, integrated
    software packages, Internet, Big Data, etc.). However, decision-makers make difficult
    inappropriate information that will facilitate their decision-making, which remains
    a challenge.


    The rapid evolution of the IT infrastructure leads to creating ''layers'' in the
    IS that make it complicated and rigid by making interventions to develop it costly
    and risky. The complexity of information systems reduces their flexibility when
    flexibility, adaptability, interoperability, and agility are essential for their
    survival. The complexity of complicated monitors progress and building qualified
    teams requires extensive outsourcing which increases the difficulty of overall
    control (Goldman & Nagel, 1993).


    # 1.1.11 Complexity Factors


    Information system''s complexity is due to three factors: Heterogeneity, autonomy,
    and development, making it challenging to model and define the engineering methods
    of the information systems. The purpose is to manage these characteristics to
    increase the individual and collective capacity of the different EIS parts.


    +   **Heterogeneity:** It is related to the multiplicity and diversity of the
    models used: various models from different points of view, different levels of
    abstraction (conceptual, physical, etc.), types of abstraction (data, transactions,
    etc.), usage categories (managers, users, etc.), domains (study, production, finance,
    etc.), etc. (Ariteta & Giacchi, 2004)

    Autonomy:** A system is autonomous when it is disconnected and independent of
    other systems. Autonomy is driven by the fact that an information system is never
    isolated; it is embedded in another system with which it interacts through interfaces,
    technical devices, temporal or factual events. This environment limits IS''s autonomy
    (time, material, human, and financial resource constraints, etc.). (Ariteta &
    Giacchi, 2004)

    **Evolution and dynamism:** Evolution and dynamism constitute the ''vital'' aspect
    of an IS. The information system is scalable in response to changes in its environment
    (strategic, business, or technological changes that the company is undergoing)
    (Goldman & Nagel, 1993; Peterson, 2001; Singh et al., 2005), (Goldman & Nagel,
    1993; Peterson, 2001).


    Also, information system complexity increases with the heterogeneity and evolution
    and decreases with its autonomy (Goldman & Nagel, 1993).'
