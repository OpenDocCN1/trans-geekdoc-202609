    # 5.10.2 Measurement Model


    In the Middle East and North Africa (MENA) zone, 200 small and large organizations
    covering the manufacturing and service sectors were surveyed to determine theoretical
    constructions. These businesses work in the public and private sectors. Constructions
    (agility, protection concerns, cost savings, strategic benefit, difficulty, reliability,
    technical preparation, senior management support, competitive pressure, and regulatory
    support) were evaluated using the five-point Likert scale at intervals ranging
    from ''strongly disagree'' to ''strongly accept''. The research was performed
    in different stages. The first edition designed to understand the different scientific
    theories reviewed by managers and technical experts. A pre-test also made it easier
    to reformulate some questions to enhance the questionnaire’s understanding and
    the quality of the answers. The questionnaire was formulated in the company’s
    three common languages, such as English, French, and Arabic.


    # 5.11 DATA COLLECTION


    An online version of the questionnaire was e-mailed to the decision-makers and
    qualified individuals with an important position in the organization. Data were
    collected using a two-stage online questionnaire from mid-2018 to early 2019.
    These data were updated with responses from the first quarter of 2020. Table 5.3
    presents the participants’ demographics.'
