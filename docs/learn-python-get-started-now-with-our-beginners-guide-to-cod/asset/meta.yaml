  - 第一章：什么是数据分析和机器学习？
- - '##'
  - 什么是数据分析？数据评估被描述为一种对信息进行清洗、更改和建模的过程，旨在发现对公司决策有帮助的信息。数据评估的目标是从数据中提取有用信息，并根据信息分析结果做出选择。我们在日常生活中做任何选择时，实际上都在考虑上一次发生了什么，或者通过选择特定的选项预测将要发生什么。这只是对我们的未来或过去进行评估并得出结论。为此，我们收集过去的记忆或对未来的幻想。这本质上就是信息评估。数据分析师为公司职能做的相同的事情，被称为数据评估。
