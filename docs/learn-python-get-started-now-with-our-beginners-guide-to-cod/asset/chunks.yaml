    ### C# vs Python：脑对决

    | 特性 | C# | Python |

    | :--- | :--- | :--- |

    | 开发者 | Microsoft | 开源 |

    | 分发 | 带有所有许可 | 开源发行 |

    | 用途 | 工业用途 | 开发 |

    | 范式 | 多范式（面向对象、过程） | 多范式（面向对象、过程） |

    | 类型 | 静态类型 | 动态类型 |

    | 错误 | 编译器为错误提供错误提示 | 运行时错误 |

    | 转换 | 类型转换 | 动态转换 |

    | 声明 | 需要变量声明 | 不需要 |

    | 执行 | 构建（编译）后运行 | 运行时解释器 |

    | 速度 | 较快 | 较慢 |

    | 语法 | 持久且有结构化 | 简单、易于编写和阅读 |

    | 符号 | 不包含大量符号 | 易于阅读 |

    | 语言 | 静态语言 | 交互式解释器 |

    | 库 | 海量的预包集合 | 大量的常规库集合 |

    | 开发 | 工作更快 | 更快 |

    | 功能 | 稍显不足 | 极佳 |

    | 多线程 | 使用 `.net` 框架易于实现 | 由于全局解释器锁 (`gil`) 需要进程 |


    ### 2020 年的 Python vs java

    编程语言是计算机科学的重要组成部分，它们是开发者工具箱中的基本工具，对每个编程任务都至关重要。在编程语言之间进行选择可能会令人困惑，尤其是在这些著名的语言之间选择。`Python`
    和 `java` 正在争夺市场的最佳位置，`Python` 在过去几年中取得了巨大进展，而 `java` 仍然占据着它的位置。这些语言往往看起来是同样理想的，事实上，它们能够胜任市场上的大多数工作，但某些关键差异可能会帮助你做出选择。


    #### Java

    `Java` 是一种静态类型的通用编程语言，它是一种面向对象且并发的语言。`Java` 的初衷是实现“编写一次，到处运行”的理念，它的创建是为了在几乎任何平台上运行，并借助这一
    `java virtual machine` (`JVM`) 尽可能减少依赖。


    #### Python

    `Python` 确实是一种动态类型的通用编程语言。`Python` 的早期增长始于荷兰的一家研究机构。这背后的最初动机是创建一种高级别的语言来弥接 `c`
    和其他语言之间的差异，正如作者所说，在那个时代使用传感器制作系统实用程序相当复杂。它的语法受到了 `algol68`、`pascal` 以及 `ABC` 等多种语言的启发，并被认为是简洁且易读的。你可以通过
    `Python 作者的博客` 了解更多关于 `Python` 的背景知识。


    #### 性能

    语言本身没有速度，它们只有语义。如果你想比较速率，你需要选择特定的实现进行相互比较。你可以在名为 `benchmarks-game` 的尝试（见下方截图）中获得全面的
    `Python` vs `java` 功能对比，其中不同的语言在各种程序中都经过了基准测试。记住，性能不仅是这段话的执行速率，应用程序的执行情况以及后续第三方库的功能通常是方程中的一个变量。


    #### 流行度

    流行度在这两种语言之间一直是平鼓相当的，因为它们在人气排行榜前三中与 `JavaScript` 激烈竞争。在 `JavaScript` 革命之前，`java`
    曾是最受欢迎的语言。当 `JavaScript` 刚出现时，创建者选择了一个接近 `java` 的标题以使其获得关注。根据 github 的 octoverse
    报告，`java` 是 GitHub 上第二最常用的语言，紧随 `Python` 之后。在 stack overflow 的 2018 程序员调查中，`Python`
    保持为增长最快的编程语言，今年后来超过了 `c#` 的位置，并在过去的日历年中超过了 `php`。`Java` 的评分仍然在 `Python` 之上，受到
    45% 程序员的喜爱，尽管 `Python` 目前为 39%，尽管如此这一差距正在缩小。可以说这些语言在流行度上处于同一水平。


