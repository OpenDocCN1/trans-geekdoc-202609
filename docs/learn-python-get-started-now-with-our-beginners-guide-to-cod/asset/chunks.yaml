    - `Ubuntu 16.10` 和 `17.04` 默认不带 Python 3.6，但它位于 universe 仓库。你应该可以使用以下命令进行安装：

    ```bash

    $ sudo apt-get upgrade

    $ sudo apt-get install Python3.6

    ```

    之后你可以使用 `Python3.6` 命令调用它。


    如果你正在使用 `ubuntu 14.04` 甚至 `16.04`，Python 3.6 不在 universe 仓库中，你需要从私有包存档（PPA）获取。例如，要在
    "deadsnakes" ppa 中安装 Python，请执行以下操作：

    ```bash

    $ sudo add-apt-repository ppa:deadsnakes/ppa

    $ sudo apt-get upgrade

    $ sudo apt-get install Python3.6

    ```


