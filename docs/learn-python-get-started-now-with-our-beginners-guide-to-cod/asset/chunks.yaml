    # 第五章：Python 如何工作以及它与 Java 或 C# 等语言的区别


    ## Python 与其他语言的对比


    Python 可以与其他翻译语言如 `java`、`JavaScript`、`Perl`、`TCL` 甚至 `small talk` 进行比较。与 `c++`、`common
    lisp` 和 `scheme` 的比较也很有启发。在本节中，我将简要比较 Python 与这些每一种语言。这些比较仅关注语言本身的问题。但是，编程语言的选择可能受到额外的现实世界限制，如成本、可访问性、培训和之前的投入，以及心理因素。考虑到这些因素具有巨大的变数，在这种对比中花大量时间去考虑它们似乎是浪费时间。


    ### Java

    `Python` 程序通常被认为运行比 `java` 应用更快，但此外它们增长所需的时间要少得多。`Python` 程序通常比等效的 `java` 应用短
    3-5 倍。这种差距可以归于 `Python` 内置的高级信息类型及其自身的动态类型。例如，`Python` 开发者不需要浪费时间来声明参数的类型或因子，而
    `Python` 强大的多态字典和列表类型（其丰富的语法支持直接构建在语言中）在几乎每个 `Python` 应用中都有。由于运行时类型，`Python` 的执行时间必须比
    `javas` 更努力。例如，在评估表达式 `a+b` 时，它必须首先检查项 `a` 和 `b` 以发现它们的类型，这在编译时是未知的。然后它调用相应的改进功能，这可能是重载的用户自定义方法。


    另一方面，`Java` 可以执行高效的整数或浮点访问，但需要对 `a` 和 `b` 进行变量声明，并且在大多数用户定义类的情况下不允许重载运算符。由于所有这些原因，`Python`
    更适合作为一种“胶水”语言，而 `java` 则被描述为非侵入式执行语言。事实上，两者结合是一个极佳的组合。可以在 `java` 中开发组件并在 `Python`
    中将其组合成程序；`Python` 也可以用于模拟部分内容，直到它们的布局可以在 `java` 实现中被“硬化”。为了鼓励这种进步，正在开发一种用 `java`
    编写的 `Python` 实现，允许在 `java` 中调用 `Python` 代码，反之亦然。在这种执行中，`Python` 源代码可以翻译成 `java`
    字节码（借助运行时库来确认 `Python` 的动态语义）。


    ### JavaScript

    `Python` 的“基于对象”子集大约等同于 `JavaScript`。就像 `JavaScript` 一样（与 `java` 不同），`Python`
    支持一种使用简单函数和因子而不参与类定义的编程风格。但对于 `JavaScript` 来说，这就是全部了。另一方面，`Python` 支持通过真正的面向对象编程方式组合规模更大的应用和更好的代码重用，在这种方式中，继承和类起着重要作用。


    ### Perl

    `Python` 和 `Perl` 源于相似的历史（Unix 脚本，后者已过时），并且许多许多许多特征，但具有不同的教条。`Perl` 强调对共享面向应用型任务的支持，例如通过内置的正则表达式、文档扫描和文档生成特性。`Python`
    强调对编程方法的支持，如信息结构布局和面向对象编程语言，这通过提供一种优美但不过神秘的符号，激励开发者编写可读（因此是易于维护的）代码。因此，`Python`
    接近 `perl` 但很少在它的首个应用领域击败它；尽管如此，`Python` 的适用性远超 `perl` 的市场。


    ### TCL

    与 `Python` ，`TCL` 可以作为应用扩展语言，也可以作为独立的编程语言。但 `TCL` 将所有数据存储为字符串，这在信息结构方面很弱，并且实现典型代码的速度比
    `Python` 慢得多。`TCL` 还缺少编写大型应用程序所需的特性，例如：模块命名空间。因此，虽然使用 `TCL` 的“平均”大程序通常由用 `c` 或
    `c++` 编写的特定 `TCL` 扩展组成，但等效的 `Python` 程序经常可以用“纯 Python”编写。显然，纯 Python 的增长速度比必须编写和调试
    `c` 或 `c++` 元素快得多。有人说 `TCL` 的一个救救性特征是 `TK` 工具包。`Python` 接受了进入 `TK` 的接口，因为其常规组件库。`TCL`
    8.0 通过提供带有受限数据类型服务的字节码编译器来处理速率问题，并提供了命名空间。但它仍然是一种非常笨拙的编程语言。


    ### Smalltalk

    也许 `Python` 和 `small talk` 之间最大的差距是现在 `Python` 更“主流”的语法，这使其在开发者培训方面处于优势。就像 `small
    talk` 一样，`Python` 具有动态绑定和类型，并且 `Python` 中的一切都是对象。但 `Python` 区分了内置形式和用户定义类，并且现在不允许从内置类型继承。`Smalltalk`
