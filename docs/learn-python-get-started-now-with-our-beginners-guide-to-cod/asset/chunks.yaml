    \ `~.local`（具有扩展的完整路径），这意味着你需要永久地修改路径 `~.profile`。\n\n#### 先决条件\n\n安装在文件中列出的先决条件。\n\
    \n```bash\npip install -r requirements.txt\n```\n\n#### 通过 VCS 安装\n\n以“可编辑”方式从\
    \ VCS 安装任务。对于此语法的完整分解，访问 pip 的 VCS 部分。\n\n```bash\npip install -e git+https://git.repo/somepkg.git#egg=someproject\n\
    ```\n\n```bash\npip install -e hg+https://hg.repo/somepkg#egg=someproject\n```\n\
    \n```bash\npip install -e svn+https://svn.repo/somepkg/trunk/#egg=someproject\n\
    ```\n\n```bash\npip install -e git+https://git.repo/somepkg.git@feature#egg=someproject\n\
    ```\n\n#### 从不同的索引安装\n\n从另一个索引安装，你可以呈现 pep 503 格式的信息，并应用 `--index-url` 标记引导 pip\
    \ 使用该索引。\n\n```bash\npip install --index-url http://my.package.repo/simple/ someproject\n\
    ```\n\n```bash\npip install --index-url http://localhost:7777 someproject\n```\n\
    \n#### 通过 SRC 树安装\n\n以开发模式安装 SRC，即任务已安装但在 src 树中保持可编辑状态。\n\n```bash\npip install\
    \ -e .\n```\n\n#### 从归档安装\n\n安装特定的源码归档。\n\n```bash\npip install /downloads/someproject-1.0.4.tar.gz\n\
    ```\n\n#### 在包含归档的本地目录安装（并且检查 pypi）\n\n```bash\npip install --no-index --find-links=file:///local-dir/\
    \ someproject\n```\n\n```bash\npip install --no-index --find-links=/local-dir/\
    \ someproject\n```\n\n#### 从不同的资源安装\n\n要从额外源（如 amazon s3 存储）安装，你可以呈现 pep 503 格式的信息，并应用\
    \ `--index-url` 标记引导 pip 使用该索引。\n\n```bash\npip install --index-url http://localhost:7777\
    \ someproject\n```\n\n#### 安装预发布\n\n查找预发布和开发版本，以及安全版本。默认情况下，pip 只查找稳定版本。\n\n```bash\n\
    pip install --pre someproject\n```\n\n#### 安装 extras\n\n安装 setuptools extras。\n\
    \n```bash\npip install somepackage[pdf]\n```\n\n```bash\npip install somepackage[pdf]==3.0\n\
    ```\n\n```bash\npip install -.\n```\n\n==当前目录中的任务。“安全”在这种语境下意味着带有支持下载 https urls\
    \ 时 SSL 认证的工具（如 curl）。根据你的阶段，这将需要 root 或管理员访问。Pip 目前正在考虑通过产生用户匹配作为默认行为来改变这一点。从\
    \ Python 3.4 开始，venv（virtualenv 的标准库选项）将生成预安装了 pip 的虚拟环境，从而使其 virtualenv 的替代品。兼容发布指定符在\
    \ pep 440 中被批准，并在 setup tools v8.0 和 pip v6.0 中推出。\n\n# 如何在 windows 上安装 Python\n\
    \nPython 不随 windows 一起提供，但这并不意味着 windows 用户不会发现这种灵活语言的帮助。然而，这并不像安装最新模型简单，所以让我们确保你获得适合任务的理想工具。Python\
    \ 最初于 1991 年发布，是一种广喜的、用于通用语言的高级编程语言。由于强调可读性的设计哲学，它长期以来一直是爱好爱好者和严肃开发者的喜爱。不仅一个简单的语言（相对来说）可以让你选择，你将在互联网上遇到成上万个需要你安装\
    \ Python 才能使用应用程序的任务。你需要哪个版本？遗憾的是，多年前 Python 有一次重大升级，在版本之间产生了一个巨大的鸿沟。这会让新手感到有些困惑，但别担心。我们将引导你安装两个主要版本。当你看到\
    \ Python for windows 下载网页时，你会立即发现这个划分。在正上方、正中位置，仓库询问你是否想要获取最新发布的 Python 2 或 Python\
    \ 3（截至教程期间，分别为 2.7.13 和 3.6.1）。更新更好吗？也许是，也许不是。\n\n"
