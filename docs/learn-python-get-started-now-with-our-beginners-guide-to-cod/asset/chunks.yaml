    as listed under.


    ## 1 problem with debian


    One problem with debian, however, is that it normally doesn''t set up the `sudo`
    command. To install it, then you will have to do the following until you execute
    the compiling Python by source instructions under:


    ```bash

    $ su

    $ apt-get set up sudo

    $ 1 /etc/sudoers

    ```


    After that, start the `/etc/sudoers` file with the `sudo vim` control (or your
    favourite text editor.) Insert the next line of text into the end of the document,
    substituting `your_username` along with your real username: `Your_username all=(all)
    all`


    ## Opensuse


    Many websites describing how to find `zypper` to install the newest version of
    Python, however they appeared obsolete or debatable. We didn''t figure out how
