  trans: '

    与前一样，使用 `Python3.6` 控制进行安装。Linux mint Mint 和 ubuntu 使用完全相同的包管理系统，这通常会让生活变得更简单。你可以按照上述说明对
    ubuntu `14.04` 进行操作。即使是 "deadsnakes" `ppa` 也适用于 mint。我们发现一些来源表明 ubuntu `16.10`
    的策略适用于 Debian，但我们找到了一种让它在 Debian `9` 上运行的方法。相反，我们最终按照下文列出的方法从源码创建了 Python。


    ## 1 关于 debian 的一个问题


    然而，debian 的一个问题是，它通常不会设置 `sudo` 命令。若要安装它，你将需要执行以下操作，直到执行下方的从源码编译 Python 指令：


    ```bash

    $ su

    $ apt-get set up sudo

    $ 1 /etc/sudoers

    ```


    之后，使用 `sudo vim` 控制打开 `/etc/sudoers` 文件（或你喜喜欢的文本编辑器）。在文档末尾插入下一行文本，将 `your_username`
    替换为你真实的用户名：`Your_username all=(all) all`


    ## Opensuse


    许多网站描述了如何找到 `zypper` 来安装最新版本的 Python，但它们看起来已经过时或有争议。我们没有弄清楚如何找到这些中的任何一个来操作，因此我们回到了从源码构建
    Python。要做到这一点，你必须安装开发应用程序，这可以通过 `yast`（通过菜单）或使用 `zypper` 完成：


    ```bash

    $ sudu

    zypper set up -t routine devel_c_c++

    ```


    此措施花费了一些时间并涉及很多操作。安装了 154 个包，但在完成后，我们可以像上面的从源码编译 Python 部分那样构建原始。


    ## Centos


    `ius` 社区在为“企业级 Linux”发行版（即 red hat enterprise 和 centos）提供更新版本的应用程序方面做得出色。你可以使用他们的工作来帮助你设置
    Python 3。要进行设置，你首先需要使用 `yum` 包管理器升级系统：


    ```bash

    $ sudo yum upgrade

    $ sudo yum install yum-utils

    ```


    然后你可以通过他们的网站设置 centos `ius` 捆绑，从而让你保持最新状态：


    ```bash

    $ sudo yum install https://centos7.iuscommunity.org/ius-release.rpm

    ```


    最后你可以放入 Python 以及同 `pip`：


    ```bash

    $ sudo yum install Python36u

    $ sudo yum install Python36u-pip

    ```


    ## Fedora


    Fedora 包含一个切换到 Python 3 的路线图，因为这里打印的默认 Python 指示了当前版本和未来的几个变体将带有 Python2 作为默认选项，但
    Python 3 很快就会被设置。如果安装在你变体上的 `Python3` 不是 `3.6`，你可以使用以下命令安装它：


    ```bash

    $ sudo dnf set up Python36

    ```


    ## Arch Linux


    Arch Linux 在维护 Python 发布版本方面非常有竞争性。你可能拥有最新版本。否则，你可以使用此控制：


    ```bash

    $ packman -s Python

    ```


    ## 从源码编译 Python


    偶尔，你的 Linux 发行版可能没有最新版本的 Python，或者你可能只想拥有创建最新、最强大模型的能力。这里是你想要选择从源码构建 Python 的步骤：


    ### 步骤 1：获取源代码


    开始之前，你必须获取 Python 源代码。Python.org 使这非常简单。如果你访问下载页面，你会在最顶部看到 Python 3 的最新源码。（确保你没有获取到旧版
    Python，即 Python 2。）


    当你选择模型时，在页面的底部有一个文档部分。选择 gzipped 源码 tarball 并将其下载到你的机器上。如果你更喜欢命令行程序，可以轻松地使用 `wget`
    将其获取到你的目录：


    ```bash

    $ wget https://www.Python.org/ftp/Python/3.6.5/Python-3.6.5.tgz

    ```


    ### 步骤 2：准备系统


    从头构建 Python 涉及一些特定于发行版的措施。每个步骤的目标在所有发行版上完全相同，但如果你的供应源不使用 `apt-get`，你可能需要根据你的情况进行解释：


    *   在执行此类操作时，第一步是在开始之前升级你机器上的系统包。在 debian 上，这看起来就像是：

    ```bash

    $ sudo apt-get upgrade

    $ sudo apt-get update

    ```


    *   接下来，我们希望确保机器拥有构建 Python 所需的工具。你会发现很多工具，你可能已经有了其中任何一个，但没关系。我将它们记录在一行命令行中，但你只需通过复制
    `sudo apt-get set up -y` 部分将列表拆分为更短的控制：


    *   **针对基于 apt 的程序（如 debian, ubuntu 和 mint）：**

    ```bash

    $ sudo apt-get set up -y create build-essential libssl-dev zlib1g-dev libbz2-dev
    libreadline-dev libsqlite3-dev wget curl llvm libncurses5-dev libncursesw5-dev
    xz-utils tk-dev

    ```


    *   **针对基于 yum 的方法（如 centos）：**

    ```bash

    $ sudo yum -y groupinstall

    $ sudo yum -y zlib-devel

    ```


    ### 步骤 3：构建 Python


    一旦你获取了要求，可能需要解压源码到一个名为 `Python-3.6.5` 的目录：


    ```bash

    $ tar xvf Python-3.6.tgz

    $ cd Python-3.6.5

    ```


    你需要执行 `configure` 来准备：


    ```bash

    ./configure --enable-optimizations --with-ensurepip=set

    ```


    接下来使用 `make` 构建 Python。`-j` 选项仅告诉 `make` 将构建划分为并行操作以加速。尽管这可能需要一些时间：


    ```bash

    $ make -j 8

    ```


    之后你将想要安装 Python。使用 `altinstall` 目是为了不会覆盖系统的 Python：


    ```bash

    sudo make altinstall

    ```


    ### 步骤 4：确认你的 Python 安装


    最后，你可以尝试你的新版本：


    ```bash

    Python3.6 -v

    ```


    ## MacOS / mac os x


    当前的 MacOS（以前被称为 mac os x）包含 Python2，而且它可能已经过期了一几个月。此外，本教程显示 Python 3，所以让我们让你更新。我们在
    MacOS 上安装 Python 3 的最佳方法是通过 homebrew 包管理器。


    ### 测量 1：安装 homebrew（部分）


    开始之前，你想安装 homebrew：


    *   打开浏览器并访问 http://brew.sh/。页面加载完成后，选择“install homebrew”下方的 homebrew 启动代码。按 cmd+c
    将其复制到剪贴板。确保你获取了完整的文本，否则设置将失败。


    *   你需要启动一个终端.app 窗口，粘贴 homebrew 启动代码，然后按回车。这将启动 homebrew 设置。


    *   如果你是在新安装的 MacOS 上操作，可能会发现一个弹窗警告请求你设置苹果的“命令行开发者工具”。你需要这些工具来继续设置，因此请确认对话框并点击“安装”。


    现在，你可能正在等待命令行开发者工具完成安装，这可能需要几分钟。时间去喝杯茶或咖啡吧！


    ### 测量 2：安装 homebrew（部分二）


    在命令行开发者工具设置完成后，你可以继续安装 homebrew：


    *   验证应用程序已在程序员软件中设置。


    *   回到终端，按回车继续安装 homebrew。

    '
