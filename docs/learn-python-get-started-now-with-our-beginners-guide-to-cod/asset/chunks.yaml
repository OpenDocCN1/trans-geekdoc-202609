    # 第三章：Python 以及与数据分析和机器学习的关系


    ## 用于数据科学和数据分析的 Python


    开发者将 Python 语言描述为“……一种解释型的、面向对象的、具有动态语义的高科技编程语言。它具有高层内置信息结构，结合动态类型和动态绑定，使其在快速应用程序开发中极具吸引力，还可以作为脚本语言或胶水语言来连接现有组件”。


    Python 是一种面向对象的编程语言，这意味着它可以用于桌面软件和 Web 软件的发展。此外，它在复杂的数值和技术应用的演进中大有益。凭借这种灵活性，Python
    成为全球最受欢迎的编程语言之一也并不意外。


    Python 如何与数据评估契合呢？我们将详细查看为什么对于今天任何想从事数据评估工作或正在寻找技能提升路径的人来说，这种编程语言都是关重要的。读完，你将更清楚地理解为什么要选择
    Python 进行数据分析。


    ## 数据评估：概述


    数据分析师到底在做什么？简单回顾一下数据分析师的功能，可能更容易回答为什么 Python 是一个完美的选择。你对工作越了解，在分配执行工作所需的资源时就能做出越明智的决策。


    数据分析师负责分发数据、使用统计策略评估结果，并提供持续报告。他们创建并执行信息分析、数据收集程序以及旨在最大化统计效率和质量的方法。他们还负责从初级或次级信息源获取信息并维护数据库。总之，他们识别、检查并翻译复杂数据集中中的趋势或模式。


    数据分析师检查监控报告、打印输出和性能指标以发现并修复代码问题。因此，他们可以清洗和过滤信息。数据分析师运行整个生命周期的调查以包含需求、行动和布局，并开发报告和分析能力。他们还跟踪性能和卓越的管理策略以识别发展。最终，他们利用上述职责的准确结果与管理层合作，以营销业务和数据需求。


    只需简要浏览一下这些数据密集型活动记录就能发现，使用一种能够快速轻松地处理大量信息的工具是绝对必要的。考虑到大数据的扩散（而且它仍在增长），拥有管理海量数据、清洗和处理使用它们的能力至关重要。Python
    迎合了需求，因为它执行重复性任务的简单易用性意味着不需要花较多时间去研究工具是如何工作的。


    ## 数据评估 vs 数据科学


    在深入探讨 Python 为什么对数据分析确实重要之前，重要的是界定数据分析与数据科学之间的关系，因为后者在你的编程语言方面往往获益巨大。换句话说，Python
    对数据科学有帮助的许多动机也成了它适用于数据评估的理由。这两个领域有大量的重叠，但各自也有独特之处。


    数据分析师和数据科学家之间最重要的区别在于，前者从已知信息中提炼重要的见解，而后者处理所有的假设和“如果……”。数据分析师管理日常事务，使用信息来回答提交给他们的查询；而数据科学家试图预测长期并将这些预测框架化为新的问题。或者换一种说法，数据分析师关注当下，而数据科学家推测可能发生的情况。


    经常会出现这两个专业领域之间界限模糊的情况，这就是为什么 Python 为数据科学带来的益处可能也是统计分析所青睐的益处。例如，这两个职业都需要软件技术知识、良好的沟通能力、基础数学知识以及对计算的理解。此外，这两个职业都需要理解如
    `r`、`sql` 显然还有 `Python` 这样的编程语言。


    另一方面，数据科学家理想上必须具备强大的商业敏锐度，而数据分析师不需要担心具备这种特定才能。但数据分析师必须熟练使用 `excel` 等电子表格工具。就工资而言，初级统计分析师通常可以获得每年
    60,000 美元的薪，而美国和加拿大的数据科学家中位薪资为 122,000 美元，数据科学主管平均收入为 176,000 美元。


    ## 为什么 Python 对数据分析至关重要？


    ### 它是自适应

    如果你想尝试以前从未实现过的创意事物；那么 Python 是你的理想选择。它对于希望为网站和应用程序编写脚本的程序员来说非常完美。


    ### 它容易上手

    由于 Python 专注于易用可读性，它的学习曲线较慢且较低。这种学习的简单性使得 Python 成为初开发者的完美工具。Python 为程序员提供了比使用旧语言更少代码行来完成任务的优势。换句话说，你投入更多时间玩它，花更少时间管理代码。


    ### 它是开源的

    Python 是开放的，因此它是免费的并利用基于社区的版本进行增长。Python 设计用于 Windows 和 Linux 环境下运行。此外，它可以轻松移植到许多平台。有许多开源
    Python 库，例如信息操作、数据可视化、统计、数学、机器学习和自然语言处理，仅举几例（请看下文以了解更多）。


    ### 它有良好的支持

    任何可能出错的都会失败，如果你使用你不熟悉的东西，获得帮助可能是一个巨大的挑战。幸运的是，Python 拥有庞大的粉丝，并在学术和工业界被广泛使用，这意味着有很多非常有用的分析库。需要帮助的
    Python 用户可以转向 `stack overflow`、邮件列表以及用户贡献的文档和代码。随着 Python 越来越流行，会有更多的客户为消费体验贡献信息，这意味着可以找到更多免费的服务材料。这形成了一个不断增加的数据分析师和数据科学家认可的良性螺旋。无论
    Python 的名声如何上升！总之，由于这些因素，Python 使用起来并不复杂，成本合理（免费！），而且有足够的帮助确保你在遇到问题时不会陷入停滞。这通常意味着这是少数几个“一分钱一货”肯定不成立的情况之一！


    Python 是数据分析师工具箱中无价的一部分，因为它专为执行重复任务和信息操作而量身定制，而且任何处理过大量数据的人都清楚复制进入其中有多频繁。使用一种管理琐碎工作的工具，数据分析师将释放更多精力来处理项目中更有趣、更有成就感的领域。


    数据分析师还必须记住市场上大量的其他 Python 库。这些库，例如 `pandas` 和 `matplotlib`，帮助数据分析师执行他们的目标。


