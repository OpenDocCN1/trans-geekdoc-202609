    # 引言


    `Python` 编程语言是一种真正的现代在线编程语言，最初由 `Guido van Rossum` 在 20 世纪 80 年代构思并创建。从那时起，`Python`
    一了一种模块化且适应性强的高级编程语言。世界上许多大型网站使用 `Python`，例如 `YouTube`、`Disqus` 和 `Reddit`。`Python`
    具有许多使其成为极具吸引力的编程平台属性，例如稳定性、可移植性、面向对象的改进、强大的标准库以及丰富的第三方模块或包。


    ## 稳定性

    `Python` 自 20 世纪 80 年代后期以来一直活跃，现在被认为是一种编程语言。`Python` 语言的程序员进行全面的功能测试和回归测试，以确保语言在每次发布后都能保持无错误且稳定。


    ## 可移植性

    `Python` 编程提供了若干特性，使其成为在线软件开发的极佳选择。由于 `Python` 解释器可以在许多现代操作系统以及一些嵌入式计算应用程序中轻松获取，因此
    `Python` 程序是可移植的。


    ## 面向对象的改进

    `Python` 的面向对象特性使其成为新开发者的理想入门语言，对于从其他面向对象语言迁移到 `Python` 的程序员来说也容易学习。`Python` 编程符合直觉，并强化了良好的应用结构和面向对象的方法。


    ## 标准库

    标准 `Python` 库为开发者提供了类似于 `c++` 等复杂语言的各种属性，同时保持了务实简单的语言语法。全面的文件 I/O、数据库交互、创新的异常处理以及大量的内置数据类型使得
    `Python` 适用于 Web 程序和模拟编程。这使得希望转向网络软件开发的开发者来说，`Python` 网络编程成为了一项简单的任务。


    ## 第三方模块

    `Python` 以利用库内部广泛的功能而闻名。另一方面，`Python` 编程的日益普及导致了大量的第三方包模块，从而扩展了 `Python` 的功能，并允许语言处理异常的编程挑战。例如，可以获得用于管理非标准数据库链接和高级加密功能的模块。此外，还有可用模块用于管理日常任务，例如读取记录元数据（包括图表）以及将
    `Python` 编译为标准的可执行应用程序。由于可以使用多个以 Web 为中心的模块来管理诸如电子邮件、维护 `http` 状态、与所有 `JavaScript`
    交互以及其他普通的 Web 开发任务，`Python` Web 编程变得触及。


    # 信息评估程序：增强决策的 5 个步骤


    你需要更深入的信息分析。通过理想的信息分析程序和资源，海量零散的数据将变成一个简单、清晰的决策阶段。为了提高你的信息评估技能并简化决策，请在数据评估过程中实施以下五项措施：


    ### 第 1 步：建立你的查询

    在组织或业务信息评估中，你必须从理想的查询开始。问题必须是可化的、简洁且清晰的。安排你的查询，以对你的特定问题或机会筛选或排除潜在答案。例如，从一个明确的问题开始：一家政府承包商正面临价格不断上涨，已无法发布具有竞争力的合同建议。在解决这一业务问题的几个问题中，包括：公司可以在不损害质量的情况下减少员工吗？


    ### 第 2 步：建立的衡量优先级

    这一步分为两个子步骤：a) 选择量化的内容，以及 b) 决定如何量化。


    #### A) 选择量化的内容

    以该承包商实例为例，考虑你想要什么类型的信息来回答主问题。在这种情况下，你会想了解现有员工的数量和价格，以及他们花费在核心业务目标上的时间比例。在回答此查询时，你可能需要回答几个子问题（例如，员工目前是否未充分利用？如果是这样，哪些流程开发可以有所帮助？）。最后，在你关于衡量衡的选择上，务必包含利益相关者可能拥有的任何合理理解（例如，如果员工减少，公司如何应对需求激增？）。


    #### B) 选择如何量化它

    思考你量化信息的方式同样重要，特别是在信息收集之前，因为你的衡量程序将支持或削败你未来的调查。此项衡量需要问的关键问题包括：


    *   你的时间跨度是什么？（例如：年度价格对比季度价格）

    *   你的衡量单位是什么？（例如：`USD` 对比 `euro`）

    *   必须包含哪些变量？（例如：仅年薪，对比年薪和人员福利成本）


    ### 第 3 步：收集数据

    在明确了查询并确定了衡量优先级后，现在是收集你自己的数据了。在收集和组织信息时，请记住这些重要要点：


    *   在收集新信息之前，确定可以从现有来源或可用数据库中收集哪些数据。收集这些信息。

    *   预先决定文档保存和命名系统，以协助所有任务人员进行协作。此程序可以节省时间并防止员工重复收集相同的数据。

    *   如果你必须通过访谈或观察来收集数据，请先创建一个会议模板以确保一致性并节省时间。

    *   将你收集的数据组织在日志中，并记录日期，并在过程中包含一些其他来源说明（如所做的任何数据归一化处理）。这将有助于你未来的决策。


    '
