    - 你可以在 Python 软件基金会的 `Python.org` 获取 Python。通常，这涉及到下载适用于操作系统的安装程序并在你的设备上运行它。

    - 某些操作系统，尤其是 `Linux`，提供了一个包管理器，可以通过运行它来设置 Python。

    - 在 `MacOS` 上，设置 Python 3 的最佳方法是安装一个名为 `homebrew` 的包管理器。你可以在教程的相关章节中了解到如何操作。

    - 在 `android` 和 `iOS` 等移动操作系统上，可以安装提供 Python 编程环境的程序。这可能是移动中控制你编程能力的极佳方式。


    此外，还有许多网站允许你在线获取 Python 解释器，而无需在电脑上安装任何东西。注意：Python 可能已经随你的操作系统一起发送，并且目前可能已经安装好了。即便如此，安装的版本可能已经过时，而你可能仍然想获取最新版本。在本份
    Python 安装手册中，你将逐步了解如何在 windows、MacOS、Linux、iOS 和 android 上建立可运行的 Python 3 环境。那么，让我们开始吧！


    ### Windows

    你的 Windows 系统极可能没有预装了 Python。Windows 系统通常没有。幸运的是，安装并不比简单的从 `Python.org` 站点下载 Python
    安装程序并运行它复杂多少。让我们来看看如何在 Windows 上设置 Python 3：


    #### 第一步：下载 Python 3 安装程序

    - 打开浏览器窗口，并浏览到 `Python.org` 中的 windows 下载页面。

    - 在顶部标有“Python releases for windows”的标题下方，点击最新的 Python 3 发布版本链接 - `Python 3.x.x`。（截至编写时，最新的是
    `Python 3.6.5`。）

    - 滚动到底部，选择 `windows x86-64 executable installer` 获取 64 位版本，或选择 `windows x86 executable
    installer` 获取 32 位版本。（见下文。）


    **侧边栏：32 位还是 64 位 Python？** 对于 Windows，你可以选择 32 位或 64 位的安装程序。两者的区别归结如下：

    - 如果机器是 32 位芯片，那么你需要选择 32 位安装程序。

    - 在 64 位系统上，两种安装程序在许多功能上实际上都能完成任务。32 位版本通常占内存较少，但 64 位版本在处理密集计算型软件时表现更好。

    - 如果你不确定选择哪种型号，请直接使用 64 位版本。


    注意：请记住，如果你发现选错了“错误”选项并想更改到 Python 的其他版本，你只需卸载 Python，然后从 `Python.org` 下载不同的安装程序重新安装即可。


    #### 第二步：运行安装程序

    一旦你选择并下载了安装程序，只需双击下载的文件即可运行。将出现一个类似下面的对话框：然后只需点击“立即安装”。这样大功就完成了。几分钟后，你的机器上就应该有一个可以运行的
    Python 3 环境了。


    ### Windows 的 Linux 子系统 (WSL)

    如果你运行的是 Windows 10 创建者版甚至是周年更新版，你确实有安装 Python 的另一个选择。这些 Windows 10 版本包含一个名为“Windows
    的 Linux 子系统”的功能，它可以让你直接在 Windows 中运行 Linux 环境，无需修改且没有虚拟服务器的开销。


    - 欲了解更多信息，请访问微软网站上关于 Windows 的 Linux 子系统的文档书籍。

    - 关于如何最好地从 Windows 10 启用子系统并设置 Linux 发行版的指南，请访问 Windows 10 设置指南。

    - 你也可以查看 YouTube 上来自 Sarah Cooley 的演示，她是该 WSL 开发群组的成员之一。


    一旦你在所选的 Linux 发行版上安装了系统，你就可以在 bash 终端台中安装 Python 3，就像你直接在运行该 Linux 系统上操作时一样。（见下文。）


    ### Linux

    你的 Linux 发行版很有可能已安装 Python，但它可能不是最新型号，而且可能是 Python 2 而不是 Python 3。要查看你拥有什么版本，启动终端窗口并尝试以下命令：

    - `Python --variant`

    - `Python2 --variant`

    - `Python3 --variant`


    其中某些命令会返回版本号，如下所示：

    ```

    $ Python3 --variant Python 3.6.5

    ```

    如果显示的版本是 `Python 2.x.x` 甚至是不是最新的 Python 3 版本（编写时为 3.6.5），而你又想安装最新版本，那么操作过程将取决于你运行的
    Linux 发行版。


    #### Ubuntu

    根据你运行的 Ubuntu 发行版型号，Python 的安装说明会有所不同。你可以通过运行以下命令确定你的区域 Ubuntu 型号：

    ```bash

    $ lsb_release -a

    ```

