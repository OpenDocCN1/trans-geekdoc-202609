  trans: "\n\n什么是数据评估？数据分析师通常是指那些能够进行基础描述性数据处理、收集数据并为决策传递信息点的人。他们必须具备数据的基础知识、对数据库的理想化感知，以及提出新视角的能力，并对信息的可视化理解。数据分析被认为是信息科学的核心程度。\n\
    \n## 成为数据分析师所需的技能\n数据分析师应该能够针对某个问题或主题，准确讨论信息呈现的样貌，并将这些信息传递给提供方中的重要利益相关者。如果你正寻求进入数据分析师的工作领域，你必须掌握这四项重要技能：\n\
    - 数学数字知识 - 熟练掌握 `r` 和 `Python` \n- 数据清洗（Data wrangling）\n- 熟悉 `pig`/`hive`\n\n\
    ## 成为数据分析师需要哪些技能？\n\n### 数据科学与数据分析\n信息科学是一个术语，涵盖了数据分析、数据挖掘、机器学习、数据以及许多其他相关学科。虽然信息科学家被预测为根据以往模式预测未来，但信息分析师则是从多个信息源中提取重大的见解。信息科学家提出问题，而数据分析师则发现当前一组查询的答案。\n\
    \n### 什么是机器学习？\n机器学习可以描述为一种同时使用算法来提取信息、从中学习，然后对该主题预测未来趋势的实践。经典的机器学习应用包括统计研究和预测性评估，用于根据感应数据识别模式并捕捉隐藏的见解。\n\
    \n机器学习执行的一个绝佳案例是 Facebook。Facebook 的机器学习算法为社交平台上的每一个用户收集行为建议。根据之前的行为，算法会征求关注请求，并在信息流中推送帖子和告警。同样，当\
    \ `amazon` 推荐商品，或者如果 `Netflix` 根据之前的行为推荐电影时，机器学习正在发挥作用。\n\n## 成为机器学习专家所需的技能\n\
    ## 成为机器学习专家需要哪些技能？\n机器学习仅仅是统计学的另一种视角。下面列出了可以帮助你在这个快速领域开启职业生涯的关键技能：\n- 计算机原理的经验\n\
    - 对编程能力的深入理解\n- 对概率和数据的理解\n- 数据建模和分析能力\n\n### 数据科学与机器学习\n由于信息科学是一个涵盖多个领域的广义术语，因此机器学习属于信息科学。机器学习利用了多种方法，包括回归和监督聚类。相反，数据科学中的信息可能也可能演变为一个系统或机械程序。两者之间的主要区别在于，数据科学作为一个更广泛的表达，不仅关注计算和数据，还处理完整的数据处理策略。\n\
    \n### 数据科学可以是跨学科的\n数据科学可以认为是多个父领域的整合，包括信息分析、软件工程、信息技术、机器学习、预测分析、数据分析等。它涉及对大量信息的获取、收集、摄取和转换，统称为大数据。信息科学负责为大数据构建结构，尝试寻找有说力的模式，并建议决策者做出高效的更改以匹配公司需求。信息分析和系统学习是信息科学利用许多工具和程序之一。\n\
    \n### 机器学习\n机器学习是目前非常热门的话题，可能是人工智能的一种应用。它使用特定的统计计算让计算机以给定的方式运行，无需专门编程。增强器具有输入信号，并利用特定的统计过程预测此的输出。机器学习的主要目标是生成智能机器，这些机器可以像人类一样思考和运行。\n\
    \n## 生成良好的机器学习方法的准备条件\n## 产生这些智能系统需要什么？\n生产机器学习方法的产品包括：\n- 统计 - 输入信息对于调用输出至关重要\n\
    - 算法 - 机器学习由特定的统计计算来确定数据模式\n- 自动化 - 它具有让系统自动运行的能力\n- 迭代 - 深度过程是迭代的，即过程的复制\n- 可扩展性\
    \ - 程序的能量可以根据规模和比例增加或减少\n- 建模 - 所有这些变化都是根据过程中的要求进行的\n\n### 机器学习策略\n应用被分为特定的类。这些是：\n\
    - `supervised learning`：这种方法在教育期间，将输入和输出连同注释一起提供给计算机。计算机预测的有效性可以被分析。主要目标是让机器学会如何将输入映射到输出。\n\
    - `unsupervised learning`：在这样的情况下，不提供此类指令，使得计算机仅根据输出产生结果。无监督学习主要应用于非结构化信息。它被用于复杂任务。它使用另一种被称为深度学习的方法来得出少数结论。\n\
    - `reinforcement learning`：这种学习使用三个组件，即代理、环境和动作。代理人将是感知其环境的人，以及代理人在环境中交互和采取行动的情况。强化学习的主要目标是找到可能的策略。\n\
    \n## 机器学习是如何工作的？\n机器学习利用了与数据挖掘相似的流程。计算围绕目标函数 (id) 明确，将输入信号 (x) 映射到变量 (y)。这有时表示为：\n\
    ```\ny=f(x)\n```\n同样存在一个误差 e 对应输入 x。因此，通用形式是：\n```\ny=f(x) + e\n```\n最典型的机器学习类型是学习\
    \ x 到 y 的映射以获取预测。这种方法被称为预测建模，以创建最准确的预测。\n- 决策更快 - 这通过遵循常规结论提供了非常有潜力的结果。\n- 适应性\
    \ - 这提供了立即适应新环境的能力。问题变化很快，因为信息在更新。\n- 构建 - 这些变化是根据过程的要求制作的。\n- 洞察 - 机器学习分析利用特定信息来获取见解。\n\
    - 增长 - 这种方法可以根据规模和比例增加或减少。\n- 结果 - 这种方法是科学的，因为结果是经过验证的。\n\n### 深度学习\n深度学习是一个新颖且热门的话题，可能是人工智能的一种应用。它使用特定的统计计算让计算机以给定的方式运行，无需专门编程。增强器具有输入信号，并利用特定的统计过程预测此的输出。机器学习的主要目标是生成智能机器，这些机器可以像人类一样思考和运行。\n\
    \n### 深度神经网络\n深度神经网络是一种使用许多层的神经网络，这些层位于输入信号和输出之间。这种概念被称为深度层级。深度学习是许多技术的一部分。它利用深度神经网络来处理高维数据。\n\
    \n## 什么是机器学习？\n机器学习可以描述为一种同时使用算法来提取信息，从中学习，然后对该主题预测未来趋势的实践。经典的机器学习应用包括统计研究和预测性评估，用于根据感应数据识别模式并捕捉隐藏的见解。\n\
    \n## 机器学习的技术是什么？\n机器学习利用了与数据挖掘相似的流程。计算围绕目标函数 (id) 明确，将输入信号 (x) 映射到变量 (y)。这有时表示为：\n\
    ```\ny=f(x)\n```\n同样存在一个误差 e 对应输入 x。因此，通用形式是：\n```\ny=f(x) + e\n```\n最典型的机器学习类型是学习\
    \ x 到 y 的映射以获取预测。这种方法被称为预测建模，以创建最准确的预测。\n- 决策更快 - 这通过遵循常规结论提供了非常有潜力的结果。\n- 适应性\
    \ - 这提供了立即适应新环境的能力。问题变化很快，因为信息在更新。\n- 构建 - 这些变化是根据过程的要求制作的。\n- 洞察 - 机器学习分析利用特定信息来获取见解。\n\
    - 增长 - 这种方法可以根据规模和比例增加或减少。\n- 结果 - 这种方法是科学的，因为结果是经过验证的。\n\n机器学习的任务被划分为特定的类。这些是：\n\
    - `supervised learning`：这种方法在教育期间，将输入和输出连同注释一起提供给计算机。计算机预测的有效性可以被分析。主要目标是让机器学会如何将输入映射到输出。\n\
    - `unsupervised learning`：在这样的情况下，不提供此类指令，使得计算机仅根据输出产生结果。无监督学习主要应用于非结构化信息。它被用于复杂任务。它使用另一种被称为深度学习的方法来得出少数结论。\n\
    - `reinforcement learning`：这种学习使用三个组件，即代理、环境和动作。代理人将是感知其环境的人，以及代理人在环境中交互和采取行动的情况。强化学习的主要目标是找到可能的策略。\n\
    \n机器学习的应用广泛应用于以下领域：\n- 分类（Classification）：将数据分配到不同的类别中。\n- 回归（Regression）：预测连续的数值。\n\
    - 聚类（Clustering）：将相似的数据点分在起。\n- 降维（Dimensionality Reduction）：减少数据的维度，同时保留重要信息。\n\
    - 异常检测（Anomaly Detection）：识别偏离正常行为的数据点。\n\n"
