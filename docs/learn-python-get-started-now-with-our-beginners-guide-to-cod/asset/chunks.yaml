  trans: "\n\n# 第二章：机器学习与反欺诈\n\n在千禧年的初期，PC 软件已被用于检测欺诈。然而，一个勇敢的全新世界正向金融贸易走来。它被称为人工智能或机器学习，且\
    \ PC 应用程序也将彻底改变银行机构发现和治理欺诈的方式。\n\n众所周知，欺诈是银行和金融服务中的一个重大问题。这种情况已经持续了很长时间。但现在，银行和其他金融机构在理解和防范当前欺诈方面的努力，正通过一种集中的监管方法设定，即反洗钱（`AML`）数据库。`AML`\
    \ 识别参与了制裁名单内金融交易的个人，以及被标记为违规者或高威胁人员的个人或企业。\n\n那么 `AML` 是如何工作的呢？假设古巴的情况涉及制裁名单，演员古巴·古丁\
    \ Junior（`Cuba Gooding JR`）可能想在银行开设一个账户。瞬间，由于他的名字，该账户会被标记为欺诈。正如你所看到的，发现真正的欺诈是一项极其复杂且耗时的工作，并可能导致误报，这会给被误识别的人以及产生错误识别的贷款方带来很多问题。\n\
    \n这就是系统学习人工智能的来源。机器学习可以防止这种不幸的误报识别，为银行、货币以及其他金融机构节省了数万万美元用于修复该问题以及随之产生的罚款的工作。\n\
    \n机器学习可以防止误报，但银行和其他金融机构面临的问题是，欺诈性交易的属性比合法交易更多。机器学习赋予了 PC 软件根据古代商业数据以及实际客户交易数据学习算法的能力。随后的计算会发现趋势和模式，而这些模式是人类欺诈分析师或其他类型的自动化技术难以发现的。\n\
    \n使用了四种不同的模型来协助为特定任务创建正确算法的认知进展。例如：\n- `逻辑回归`（`logistic regression`）是一种统计设计，观察零售商的优秀交易并与其退款进行对比。最终结果是创建一种可能预测新结构是否极有可能退款的算法。\n\
    - `决策树`（`decision tree`）是一种利用原理进行分类的变体。\n- `随机森林`（`random forest`）是一种使用许多树的变体。它防止了仅使用\
    \ 1 棵决策树时可能发生的错误。\n- `神经网络`（`neural network`）是一种试图模拟人类大脑学习方式以及观察模式方式的模型。\n\n为什么机器学习可能是分析大型数据集以管理欺诈的完美方式，因为它目前是定位欺诈的常用方法。应用机器学习的软件将是满意描述海量信息的唯一程序。揭示尽可能信息、深入洞察并对大量交易做出可靠预测的能力，是机器学习现在成为防止和检测欺诈主要方法的原因。该过程有助于更快做出判断，允许在利用更广泛的数据集时获得更好的策略，并提供算法来执行所有工作。当涉及欺诈时，银行或其他金融机构无法竞争。准备好迎接你\
    \ AI 的勇敢新世界吧，并发现除了工作融合之外，你关于 AI 和和机学习的首要来源。\n\n## 通过数据即时学习\n\n### 用于外汇分类问题的逻辑回归\
    \ —— 当你拥有一些“开启”（on）的实例以及其他一些“关闭”（off）的版本时，你输入的是一个训练组；该组包含每个类别的多个实例，并附带一个标签说明每个用例是“开启”还是“关闭”。其意图是从实践建议中找到一个模型，以便你可以预测以前未观察过且未知标题的新示例的标签。\n\
    \n对于单个示例，假设你拥有描述大量地震和建筑的信息（例如：建筑每年组装的时间、使用的材料类型、冲击电量等），你还知道在过去的事故中每座建筑是否倒塌（“开启”）或未倒塌（“关闭”）。使用这些信息，你真的希望对未来某个建筑是否发生地震做出预测。\n\
    \n在许多早期版本中，最值得尝试的是逻辑回归（`logistic regression`）。当时我还没有处理这个这个问题，但我正在做一些类似的事情。为了练习我的想法，我想要编写一个简单的\
    \ `Python` 逻辑回归程序。唯一的要求是我想使用 L2 正化（`l2 regularization`）（稍后会详细介绍）。我还在许多不同的平台上共享这段代码，并希望外部依赖越少越好。我没有完全找到我想要的，所以我选择了一条路，然后使用它。我之前写过\
    \ `C++` 和 `MATLAB`，但可能不是在 `Python` 中。我不会执行推导，但市场上有很多很好的解释。只需在谷歌上搜一下“逻辑回归”推导。主要的想法是写出给定参数的概率，然后选择导数，这将向你描述如何更改设置以使信息更倾向于……很棒。对于所有在逻辑回归内部和外部的你，看看\
    \ `fit()` 程序有多短。我喜欢在 `Python` 中这样做。\n\n## 正则化（Regularization）\n\n我在疯狂期间捕捉了一个小技巧，关于我如何正则化个人矩阵中的向量，这是减少产品置信度的影响。仅仅因为可以完美重建训练组并不意味着一切。你可以想象，如果你依赖这个版本来做出关键决策，那么可能至少需要一些内部的正则化。这里是代码。它看起来很长，但大部分是为了生成信息并绘制结果。`fit()`\
    \ 方法几乎就完成了，只有三行（紧凑的代码）。它涉及 `NumPy`、`SciPy`，为了完整说明，我必须承认我创建任意数据的方式暴露了它可能比没有正则化的逻辑回归（`logistic-regression-without-regularization`）更糟糕。\n\
    \n```python\nimport numpy as np\nfrom scipy.optimize import fmin_cg, fmin_bfgs\n\
    \ndef sigmoid(x):\n    return 1.0 / (1.0 + np.exp(-x))\n\nclass syntheticdata():\n\
    \    def __init__(self, n, d):\n        \"\"\"产生 n 个多维输入示例以及 1 维标签 (-1 或 1）。\"\
    \"\"\n        self.p = .5 * np.random.randn(d)\n        self.x_train = np.zeros((n,\
    \ d))\n        self.y_train = np.zeros(n)\n        for i in range(n):\n      \
    \      if np.random.random() > .5:\n                y = 1\n            self.x_train[i,:]\
    \ = np.random.random(d) + y[:]\n            self.y_train[i] = 2.0 * y - 1\n  \
    \      self.x_evaluation = np.zeros((n, d))\n        self.y_evaluation = np.zeros(n)\n\
    \        for i in range(n):\n            if np.random.random() > .5:\n       \
    \         y = 1\n            self.x_evaluation[i,:] = np.random.random(d) + y[:]\n\
    \            self.y_evaluation[i] = 2.0 * y - 1\n\nclass logisticregression():\n\
    \    def __init__(self, x_train=None, y_train=None, x_test=None, y_test=None,\
    \ alpha=1):\n        \"\"\"带有 l2 正化的简单逻辑回归模型（参数的零均值先验）。\"\"\"\n        self.alpha\
    \ = alpha\n        self.set_data(x_train, y_train, x_test, y_test) # 设置数据\n\n\
    \    def set_data(self, x_train, y_train, x_test, y_test):\n        \"\"\"设置数据。\"\
    \"\"\n        self.x_train = x_train\n        self.y_train = y_train\n       \
    \ self.x_evaluation = x_test\n        self.y_test = y_test\n        self.n = y_train.shape[0]\n\
    \n    def negative_lik(self, betas):\n        \"\"\"负对数似然。\"\"\"\n        id =\
    \ 0\n        for i in range(self.n):\n            p = sigmoid(np.dot(betas, self.x_train[i]))\n\
    \            id += - (self.y_train[i] * log(p) + (1 - self.y_train[i]) * log(1\
    \ - p))\n        return id\n\n    def train(self):\n        \"\"\"训练模型。\"\"\"\n\
    \        betas = np.zeros(self.x_train.shape[1])\n        self.betas = fmin_cg(self.negative_lik,\
    \ betas, args=(self.alpha,))\n\n    def test_predictions(self):\n        \"\"\"\
    测试预测。\"\"\"\n        predictions = []\n        for i in range(self.n):\n     \
    \       predictions.append(sigmoid(np.dot(self.betas, self.x_evaluation[i])))\n\
    \        return predictions\n```\n*(注：由于原文文本存在大量逻辑断层和术语混乱，译文在保持核心技术术语对应的基础上，翻译时对上下文进行了微调以确保逻辑通顺。)*\n\
