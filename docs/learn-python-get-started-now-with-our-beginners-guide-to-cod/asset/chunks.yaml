    # 数据科学与机器学习分析


    ### 预测因果数据

    数据科学家利用这一版本来推导公司的预测。预测模型以量化的术语规定了各种小型业务活动的结果。对于希望理解任何新小型业务移动潜力的公司来说，这可能是一个很好的工具。


    ### 规范性评估

    这种分析通过关注可能成功的活动来帮助公司设定目标。规范性分析利用预测设计中的推理，并通过指示实现这些目标的最有效方法来协助公司。


    ## 技术格局

    数据科学采用了广泛的面向数据的技术，如 `SQL`、`Python`、`r` 和 `Hadoop` 等……但此外，它还广泛利用统计分析、信息可视化、分布式结构等，从一组信息中提取含义。数据科学家是熟练的专业人士，他们的经验使他们能够在所有数据科学工作生命周期的任何阶段快速变换工作。他们可以同样简单的方式利用
    `ai` 和 `machine learning`。


    ## 机器学习方法

    *   **监督学习**：监督学习使用标记数据来训练算法。这种机器学习非常常见，用于根据历史数据预测结果。

    *   **无监督学习**：无监督学习不使用标记数据。相反，它专注于发现数据内部的隐藏模式或结构。这通常用于聚类和关联。

    *   **半监督学习**：半监督学习结合了监督和无监督学习的元素。它用于标记数据稀缺或获取昂贵，但未标记数据充足的情况。

    *   **强化学习**：强化学习是机器学习的一种，代理通过在环境中执行操作以最大化奖励来学习做出决策。它基于试错法。


    ## 核心概念与应用

    *   **自动化**：`ai` 可以自动执行重复任务，提高效率。

    *   **智能系统**：`ai` 帮助创建能够适应新信息的系统。

    *   **自然语言处理**：这允许 `ai` 理解并处理人类语言。


    ## 案例研究：谷歌搜索

    谷歌搜索引擎现在是信息科学的一种商品。它利用 `predictive evaluation`（一种由 `artificial intelligence` 使用的方法）为消费者提供智能效果。例如，如果有人在谷歌搜索引擎上输入“greatest
    coats in NY”，`ai` 就会通过系统学习收集这些信息。今天，当个人在搜索工具“ideal location to purchase”中写下这两个短语时，`ai`
    就会介入，正如规范性评估完成句子一样，正如“ideal spot to purchase coats in NY”，这是用户脑海中问题的一个非常可能的后缀。

    '
