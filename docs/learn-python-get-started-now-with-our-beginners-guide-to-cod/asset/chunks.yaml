    ```


    This measure took some time and involved. Installment of 154 packs, however after
    it had been finished, we could construct the origin as shown from the compiling
    Python out of source segment over.


    ## Centos


    The `ius` community does a wonderful job of supplying newer versions of applications
    such as "enterprise Linux" distros (i.e. red hat enterprise and also centos).
    It''s possible to use their job that will assist you set up Python 3. To set up,
    you need to first upgrade your system using the `yum` package manager:


    ```bash

    $ sudo yum upgrade

    $ sudo yum install yum-utils

    ```


    You can then set up the centos `ius` bundle which can get you current by using
    their website:


    ```bash

    $ sudo yum install https://centos7.iuscommunity.org/ius-release.rpm

    ```


    Eventually you can then put in Python along with `pip`:


    ```bash

    $ sudo yum install Python36u

