- "# Typed PHP 入门指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 引言\n\n### 为什么写这本书\n\n我决定写这本书是因为我花了大量时间致力于开发简化字符串、数组等处理方法的库。它们被称为标量类型（Scalar\
  \ Types），因为 PHP 处理它们的方式与对象不同。它们没有属性，也没有方法。\n\nPHP 拥有丰富的历史并在 Web 占据主导地位。尽管存在语言不一致性和困难（特别是在处理这些标量类型时），它取得了巨大的成就。Bjarne\
  \ Stroustrup 曾说过：“语言只有两种：人们抱怨的语言和没有人使用的语言。”。PHP 是那种*每个人*都在使用的语言之一，但这通常被视为忽视糟糕部分并直接完成任务的理由。\n\
  \n\n\n\n最后，你应该拥有一个良好的网络连接。本书中的示例在 `Vagrant` 虚拟机内部运行效果最好。如果你对这个术语熟悉，不用担心。我们稍后会讨论它，它基本上是一种用于安装开发环境的软件。这种安装经常发生，并且受益于快速的连接。\n\
  \n## 过程式 / 面向对象\n\n过程式和面向对象是不同的编程风格，它们以不同的方式处理程序执行。了解它们的工作原理，以及它们如何定义标量类型的状态是有益的。\n\
  \n### 过程式编程\n\n过程式编程描述了一种**自上而下**程序执行方法。也就是说；过程式程序由一系列解释器要执行的步骤组成（从上到下）。\n\n在伪代码中，一个过程式的图像缩放程序可能如下：\n\
  \n1. 开始执行\n2. 然后存储由 `open_file()` 函数返回的文件引用\n3. 然后存储由 `resize_image()` 函数返回的修改后的图像\n\
  4. 然后关闭打开的文件\n5. 然后存储由 `open_file()` 函数返回的文件引用\n6. 然后将修改后的图像数据写入第二个打开的文件\n7. 然后关闭该文件\n\
  8. 然后清空修改后的图像变量\n9.结束执行\n\n过程式程序可以调用函数（如示例所示）并可以定义函数。当前执行的行位置可以通过循环结构和类似 goto 的结构进行修改，但在大多数情况下，程序是框定在一组指令中的。\n\
  \n### 面向对象编程\n\n面向对象编程将程序执行描述为实体（或对象）的交互和描述。这些对象可以具有任意属性（所有变量的别名）和方法（所有函数的别名）的组合。\n\
  \n这些所有函数内部的代码仍然是从上到下执行的，但核心思想是程序依赖对象之间的通信来保持其连贯性。\n\n在伪代码中，一个面向对象的图像缩放程序可能如下：\n\n\
  1. 开始执行\n2. 然后创建一个文件对象\n3. 然后创建一个图像缩放对象\n4. 然后将文件对象传递给图像缩放对象\n5. 然后创建另一个文件对象\n6.\
  \ 然后将图像缩放对象的 `resize()` 方法的结果写入第二个文件对象\n7. 然后关闭第二个文件对象\n8. 然后 销毁第二个文件对象\n9. 然后 销毁图像缩放对象\n\
  10. 然后 销毁第一个文件对象\n11. 结束执行\n\n### 哪种最好？\n\n……这是一个错误的问题。两者都有其优缺点。面向对象编程产生的代码通常比过程式编程多。面向对象编程有利于更好的关注点分离。换句话说——思考对象及其行为比思考整个程序的流程要更容易。\n\
  \n最终，过程式代码可以像面向对象代码一样整洁。\n\n“有时，优雅的实现就是一个函数。不是方法。不是类。不是框架。仅仅是一个函数。” - John Carmack\n\
  \n### PHP 是哪种？\n\nPHP 是非常过程式的。这就是 Rasmus（在那个远古的时代）构建它的方式，它也一直基本保持这样。这一点在处理和操作标量变量时是显而易见的。PHP\
  \ 类型不是对象。\n\n\n\n对于大多数中小型项目来说，添加一个修订后的类型系统是没有必要的。然而，如果你已经学会了如何构建（甚至只是使用）一个良好的类型系统，那么在大型项目中使用它难道不是很有意义吗？或者在任何你足够在乎的项目中使用呢？\n\
  \nPHP 的这一领域经常将开发者推向更漂亮的语言。不要成为那些开发者之一！学习如何通过使用整洁的抽象来编写更整洁的代码。\n\n## 结构\n\n### 封装\
  \ (Boxing)\n\n“封装”（Boxing）是指将数据封装（封闭）在类中的做法，以便为被封装的数据添加行为。让我们来看一个例子：\n\n```php\n\
  \ 1 <?php\n 2 \n3 class StringBox\n 4 {\n 5   /**\n 6    * @var string\n 7    */\n\
  \ 8   protected $data;\n 9 \n10   /**\n11    * @param string $data\n12    */\n13\
  \   public function __construct($data)\n14   {\n15     $this->data = $data;\n16\
  \   }\n 17 \n18   /**\n19    * @return string\n20    */\n21   public function toString()\n\
  22   {\n23     return (string) $this->data;\n24   }\n 25 \n 26   /**\n27    * @return\
  \ string\n28    */\n29   public function toUpperCase()\n30   {\n31     return strtoupper($this->data);\n\
  32   }\n 33 \n 34   /**\n35    * @return string\n36    */\n37   public function\
  \ toLowerCase()\n38   {\n39     return strtolower($this->data);\n40   }\n 41 \n\
  \ 42   /**\n43    * @param string $needle\n44    * @param mixed  $offset\n45   \
  \ *\n46    * @return int\n47    */\n48   public function getIndexOf($needle, $offset\
  \ = null)\n49   {\n50     $index = strpos($this->data, $needle, $offset);\n51 \n\
  52     if ($index === false) {\n53       return -1;\n54     }\n55 \n56     return\
  \ $index;\n57   }\n58 }\n 59 \n60 $box = new StringBox(\"Hello World\");\n61 \n\
  62 print $box->toString();          // \"hello world\"\n63 print $box->toUpperCase();\
  \       // \"HELLO WORLD\"\n64 print $box->toLowerCase();       // \"hello world\"\
  \n65 print $box->getIndexOf(\"foo\");   // -1\n66 print $box->getIndexOf(\"World\"\
  ); // 6\n```\n\n这种方法被 PHP 完全支持，不需要任何额外的扩展或依赖。如果你仔细想，这是一个简单的概念。你正在使用受保护属性，并暴露一个公有\
  \ API 来设置、获取和操作它们。\n\n它的困难之处在于，这会导致比直接使用原生函数产生多得多的代码。你需要定义包装器（wrappers）。你需要定义 setter（set\
  \ 器）和 getter（get 器）。每当你想要放入 `native` 类型并取出 `native` 类型时，都必须使用它们。我最后那句话的意思是？\n\n\
  ```php\n1 $helloBox = new StringBox(\"Hello\");\n2 $worldBox = new StringBox(\"\
  World\");\n3 \n4 $worldBox = new StringBox(\n5   $helloBox->toString() . \" \" .\
  \ $worldBox->toString()\n6 );\n```\n这很快就会变得难以处理。它也更消耗内存，并且比直接使用原生函数更慢。PHP 允许使用一个名为\
  \ `__toString` 的方法。当一个类定义了这个方法（返回一个字符串），并且该类的实例用在一个期望字符串的操作中时；`__toString` 方法会被自动调用。这还不足以让我们模拟一个可扩展的类型系统，否则它就太短了。\n\
  \n### 解析类型 (Resolving Types)\n\nPHP 是弱类型的。这意味着，变量可以在不指定类型的情况下声明。它们的类型可以在任何时候被更改。它们可以根据需要强制转换为不同的类型。如果我们想实现更强的类型处理，我们需要能够识别变量的类型。`gettype`\
  \ 函数返回变量的数据类型。它可以识别以下类型：\n\n- `boolean`\n- `integer`\n- `double`\n- `string`\n-\
  \ `array`\n- `object`\n- `resource`\n\n如果这些类型中没有一个能正确描述变量，`gettype` 将返回 `unknown\
  \ type`。我们再次看到了一些不一致之处。首先，浮点数被识别为 `double`，而空值返回为 `NULL`（与其他所有类型标识符相反）。我们可以使用类似于下面的内容对此函数进行抽象：\n\
  \n```php\n1 <?php\n 2 \n3 function type($variable) {\n4   $type = gettype($variable);\n\
  5 \n6   switch ($type) {\n7 \n8     case \"integer\":\n9     case \"double\":\n\
  10       return \"number\";\n11 \n12     case \"NULL\":\n13       return \"null\"\
  ;\n14 \n15   }\n 16 \n17   return $type;\n18 }\n 19 \n20 print type(0);    // \"\
  number\"\n21 print type(0.0);   // \"number\"\n22 print type(null); // \"null\"\n\
  ```\n\n`type(0)` // \"number\"\n`type(0.0)` // \"number\"\n`type(null)` // \"null\"\
  \n\n### 可调用性 (Callable)\n\n`is_callable` 函数用于检查变量是否是可调用的。在 PHP 中，很多东西都是可调用的：\n\n\
  - 匿名函数\n- 闭包\n- 静态方法\n- 实例方法\n- 带有 `__invoke` 方法的对象\n\n例如：\n\n```php\n<?php\nfunction\
  \ hello() {\n    echo \"hello\";\n}\nvar_dump(is_callable('hello')); // true\n\n\
  $anonymous = function() {\n    echo \"anonymous\";\n};\nvar_dump(is_callable($anonymous));\
  \ // true\n\nclass MyClass {\n    public static function method() {\n        echo\
  \ \"static method\";\n    }\n    public function method() {\n        echo \"method\"\
  ;\n    }\n}\n\nvar_dump(is_callable(['MyClass', 'method'])); // true\n$obj = new\
  \ MyClass();\nvar_dump(is_callable([$obj, 'method'])); // true\n\nclass Invoker\
  \ {\n    public function __invoke() {\n        echo \"invoked\";\n    }\n}\n$invoker\
  \ = new Invoker();\nvar_dump(is_callable($invoker)); // true\n```\n\n但是，`is_callable`\
  \ 并不总是检查它是否是函数。它只是检查它是否可以被调用。这意味着，如果一个类定义了 `__invoke` 方法，那么它的实例就是可调用的。\n\n```php\n\
  <?php\nclass Invoker {\n    public function __invoke() {\n        echo \"invoked\"\
  ;\n    }\n}\n$invoker = new Invoker();\nvar_dump(is_callable($invoker)); // true\n\
  ```\n\n此外，`is_callable` 还可以检查字符串是否代表一个定义的函数名。\n\n```php\n<?php\nfunction hello()\
  \ {\n    echo \"hello\";\n}\nvar_dump(is_callable('hello')); // true\nvar_dump(is_callable('non_existent_function'));\
  \ // false\n```\n\n总之，`is_callable` 是一个非常实用的工具，只要你理解它的工作原理。\n\n\n\n\nPHP 文档（请访问\
  \ [`www.php.net/manual/en/intro.pcre.php`](http://www.php.net/manual/en/intro.pcre.php)）将表达式描述为用定界符包围的[字符串]。这些定界符可以是任何非字母数字字符，但不能是反斜杠或空字节。\n\
  \n我们可以使用以下代码涵盖大部分情况：\n\n```php\n 1 <?php\n 2 \n 3 function is_regex($variable) {\n\
  \ 4   return @preg_match($regex, \"\") !== false\n 5     && preg_last_error() ==\
  \ PREG_NO_ERROR;\n 6 }\n 7 \n 8 print is_regex(\"/^.*$/\"); // true\n 9 print is_regex(\"\
  /hello world/\"); // true\n10 print is_regex(\"/hello world/i\"); // true\n11 print\
  \ is_regex(\"hello world\"); // false\n12 print is_regex(\"\\\\hello world\\\\\"\
  ); // false\n13 print is_regex(\"\\\\x00foo\\\\x00\"); // false\n14 print is_regex(\"\
  1foo1\"); // false\n15 print is_regex(\"afooa\"); // false\n```\n\n`preg_match`\
  \ 函数在匹配时返回 `1`，不匹配时返回 `0`，发生错误时返回 `false`。假设 `preg_match` 返回 `false`，错误可能是由于任何原因引起的（例如\
  \ `PREG_INTERNAL_ERROR` 或 `PREG_BAD_UTF8_ERROR`）。因此，我们使用 `preg_last_error` 函数来排除所有其他错误。\n\
  \n使用错误抑制（`@`）通常是一个坏主意。只有极少数情况下使用它被认为是可以的。而这里就是其中之一！\n\n## 命名空间函数 (Namespace Functions)\n\
  \n我之前提到过所有这些全局函数都是不好的，而且有一个非常简单的替代方案：命名空间函数。你可能已经在已经在类中使用过命名空间，但同样的结构也能很好地隔离函数：\n\
  \n```php\n 1 <?php\n 2 \n 3 namespace Type\\String {\n 4   function length($string)\
  \ {\n 5     return strlen($string);\n 6   }\n 7 }\n 8 \n 9 namespace {\n10   print\
  \ Type\\String\\length(\"Hello World\");\n11 }\n```\n\n### Composer 自动加载 (Composer\
  \ Autoload)\n\n这种函数定义并不遵循标准的自动加载模式。为了让 Composer 自动加载此类文件，必须显式定义应该加载哪些文件：\n\n```json\n\
  1 {\n2   \"autoload\" : {\n3     \"files\" : [\n4       \"namespace-functions.php\"\
  \n5     ]\n6   }\n7 }\n```\n\n之后，我们必须使用以下命令导出旧的自动加载器：\n\n```bash\n1 $ composer dump-autoload\n\
  2 \n3 Generating autoload files\n```\n\n现在，这些（包含命名空间函数的文件将在任何使用 Composer 自动加载器的地方被自动加载。\n\
  \n### 未来的特性 (Future Goodies)\n\nPHP 5.6 支持 `use function` 结构，用于从其他命名空间导入函数。它目前处于测试阶段（编写本文时），但这个功能非常符合我们的胃口。\n\
  \n同时，可以部分导入函数：\n\n```php\n1 use Type\\String;\n2 \n3 print String\\length(\"Hello\
  \ World\");\n```\n\n这对于深度嵌套的设计尤为有用。尽管如此，能够省略全命名空间仍然很棒。结果更加整洁（er）。\n\n## 结论 (Conclusion)\n\
  \n即使在今天，也可以创建更整洁的类型/抽象。我们不需要特殊的扩展或编译。只需要一点努力就能让代码变得干净。尽管如此，扩展可以使我们的生活更轻松，同时允许我们希望实现的定制化程度。我们将在下一章中查看其中几个……\n\
  \n## 扩展 (Extensions)\n\n即使在今天，也可以创建更整洁的类型/抽象。我们不需要特殊的扩展或编译。只需要一点努力就能让代码变得干净。尽管如此，扩展可以使我们的生活更轻松，同时允许我们希望实现的定制化程度。我们将在下一章中查看其中几个……\n\
