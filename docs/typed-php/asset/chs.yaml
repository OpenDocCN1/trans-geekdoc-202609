  \ Autoload)\n\n这种函数定义并不遵循标准的自动加载模式。为了让 Composer 自动加载此类文件，必须显式定义应该加载哪些文件：\n\n```json\n\
  1 {\n2   \"autoload\" : {\n3     \"files\" : [\n4       \"namespace-functions.php\"\
  \n5     ]\n6   }\n7 }\n```\n\n之后，我们必须使用以下命令导出旧的自动加载器：\n\n```bash\n1 $ composer dump-autoload\n\
  2 \n3 Generating autoload files\n```\n\n现在，这些（包含命名空间函数的文件将在任何使用 Composer 自动加载器的地方被自动加载。\n\
  \n### 未来的特性 (Future Goodies)\n\nPHP 5.6 支持 `use function` 结构，用于从其他命名空间导入函数。它目前处于测试阶段（编写本文时），但这个功能非常符合我们的胃口。\n\
  \n同时，可以部分导入函数：\n\n```php\n1 use Type\\String;\n2 \n3 print String\\length(\"Hello\
  \ World\");\n```\n\n这对于深度嵌套的设计尤为有用。尽管如此，能够省略全命名空间仍然很棒。结果更加整洁（er）。\n\n## 结论 (Conclusion)\n\
  \n即使在今天，也可以创建更整洁的类型/抽象。我们不需要特殊的扩展或编译。只需要一点努力就能让代码变得干净。尽管如此，扩展可以使我们的生活更轻松，同时允许我们希望实现的定制化程度。我们将在下一章中查看其中几个……\n\
  \n## 扩展 (Extensions)\n\n\n\n\n\n此命令将带你进入虚拟机内部，就像连接到远程服务器一样。在虚拟机内部，你可以运行客主机操作系统通常支持的任何命令，包括针对虚拟机上安装的包执行\
  \ PHP 脚本。\n\n[`phansible.com`](http://phansible.com) 是 [Erika Heidi](https://twitter.com/erikaheidi)\
  \ 的心血。她也是 [Vagrant Cookbook](https://leanpub.com/vagrantcookbook) 的作者。如果你有任何问题或者只是想了解更多关于\
  \ Vagrant 的信息，我强烈推荐阅读这本书！\n\n## SPL 类型\n\nSPL（或标准 PHP 库）是一个包含额外类型的库，用于增强 PHP 生类型。它有一些流行的类（如\
  \ `LogicException` 和 `ArrayObject`）。某些 `standard` PHP 安装版本附带了部分 SPL。但我们很快要查看的部分并不包含它们……\n\
  \n你可以在 `http://www.php.net/manual/en/book.spl-types.php` 找到这些神秘库。\n\n本节假设你正在使用之前介绍的\
  \ Vagrant box。如果不是，请先进行设置。这些命令是 Linux 特有的，并且取决于之前解释过的预装模块。\n\n### 安装 SPL 类型\n\n\
  要安装它们，请运行以下命令：\n\n```\n1 $ sudo apt-get install libpcre3-dev php5-dev\n2 \n3 Reading\
  \ package lists... Done\n4 Building dependency tree\n5 Reading state information...\
  \ Done\n6 The following extra packages will be installed:\n7   autoconf automake\
  \ autotools-dev build-essential...\n```\n\n```\n1 $ sudo pecl install SPL_Types\n\
  2 \n3 downloading SPL_Types-0.4.0.tgz ...\n4 Starting to download SPL_Types-0.4.0.tgz\
  \ (8,388 bytes)\n5 .....done: 8,388 bytes\n6 6 source files, building\n7 running:\
  \ phpize...\n```\n\n这两个命令安装了编译 PECL 扩展所需的先决条件。PECL 是一个类似于 PEAR 的库。如果你这两个都还没听过，请不要担心。你只需要知道\
  \ SPL 类型托管在此处，因此为了安装它们，我们需要能够编译 PECL 扩展。\n\n```\n1 $ sudo bash -c \"echo extension=spl_types.so\
  \ >> /etc/php5/cli/php.ini\"\n```\n\n此命令将 `extension=spl_types.so` 添加到 `php.ini`\
  \ 文件中（按照安装说明）。\n\n```\n1 $ sudo service php5-fpm restart\n2 \n3 php5-fpm stop/waiting\n\
  4 php5-fpm start/running, process...\n```\n\n此命令重启 PHP-FPM —— 解释 PHP 命令行指令和 Nginx\
  \ Web 请求的进程。这些命令应该已经安装了 SPL 类型，但为了起见，请运行以下命令：\n\n```\n1 $ php -i | grep SPL_Types\n\
  2 SPL_Types\n```\n\n如果你看到了 `SPL_Types` 这一行，那么就可以正常使用了！\n\n### 使用 SPL 类型\n\n让我们来看一些这些类的用法示例：\n\
  \n```\n 1 <?php\n 2 \n3 class NumberType extends SplFloat\n4 {\n 5   /**\n6    *\
  \ @return float\n7    */\n8   public function toInteger()\n9   {\n10     return\
  \ round($this);\n11   }\n 12 \n13   /**\n14    * @return string\n15    */\n16  \
  \ public function toString()\n17   {\n18     return (string) $this;\n19   }\n20\
  \ }\n 21 \n22 $number = new NumberType(13.86);\n23 \n24 print $number->toInteger();\
  \ // 14\n25 print $number->toString();  // \"13.86\"\n26 \n27 print (float) $number\
  \ + 1.00; // 14.86\n28 print $number * 12;           // 156\n```\n\n`toInteger`\
  \ 和 `toString` 方法对包装类做了类似的事情。神奇发生在对 `$number` 对象进行基础算术运算时。SPL 类型在算术表达式、类型转换或拼接时会自动解箱。任何通常情况下适用于标量类型的运算符，也适用于相应的\
  \ SPL 类型。\n\n这里是另一个例子：\n\n```\n 1 <?php\n 2 \n3 class StringType extends SplString\n\
  4 {\n 5   /**\n6    * @param int   $start\n7    * @param mixed $length\n8    *\n\
  9    * @return StringType\n10   */\n11   public function slice($start = 0, $length\
  \ = null)\n12   {\n13     if ($length === null) {\n14       return new static(substr($this,\
  \ $start));\n15     }\n16 \n17     return new static(substr($this, $start, $length));\n\
  18   }\n19 }\n20 }\n 21 \n22 $string = new StringType(\"Hello World\");\n23 \n24\
  \ print $string->slice(6); // \"World\"\n```\n\n我们可以设计这些类型使其返回新实例。这为我们提供了一个简单的链式调用接口。\n\
  \n在假设原生 PHP 函数的返回类型时要小心。务必确认。\n\n\n\n\nZephir 是一个用于编写可编译和可安装 PHP 扩展的框架，它使用一种与 C\
  \ 代码具有相似之处的 PHP 超集语言。Zephir 并不是严格的 PHP 扩展，Zephir 库也用用 PHP 编写的。\n\n它与 Phalcon 框架属于同一个集体，而\
  \ Phalcon 本身就是一个 PHP 扩展。这将会变得非常有趣！\n\n## 安装 Zephir\n\nZephir 需要一些库才能正确编译。我们可以通过以下命令安装它们：\n\
  \n```\n1 $ sudo apt-get install git gcc make re2c php5 php5-json php5-dev libpcre3-dev\n\
  ```\n\n接下来，我们需要安装 `JSON-C` 库（Zephir 用它来编译扩展）：\n\n```\n1 $ git clone https://github.com/json-c/json-c.git\
  \ && cd json-c && sh autogen.sh\\\n2 && ./configure && make && sudo make install\n\
  ```\n\n这些命令将克隆 `JSON-C` 仓库并对其进行配置和编译。最后，我们需要安装 Zephir：\n\n```\n1 $ git clone https://github.com/phalcon/zephir\
  \ && cd zephir && ./install -c\n```\n\n这应该已经安装了一个可用的 Zephir 版本。你可以进入克隆文件夹并运行以下命令来检查它是否正常工作：\n\
  \n```\n1 $ zephir version\n```\n\n## 使用 Zephir\n\n使用 Zephir 相对简单（考虑到实际执行的工作）。让我们从初始化一个全新的扩展骨架项目开始：\n\
  \n```\n1 $ zephir init type\n```\n\n这将在当前工作目录下创建一个骨架项目文件夹。进入新创建的 `type` 目录并运行：\n\
  \n```\n1 $ ls -la\n2 \n3 ext/ type/ config.json\n```\n\n扩展类位于 `type` 文件夹中（这特定于扩展的名称，即我们通过\
  \ `init` 命令指定的名称）。在其中找到一个名为 `StringType.zep` 的文件，用你的编辑器打开它。\n\nZephir 的语法与 PHP 非常相似，但带有一丝\
  \ C 风格。你可以在 [`www.zephir-lang.com/index.html`](http://www.zephir-lang.com/index.html)\
  \ 找到相当的文档。\n\n创建以下类：\n\n```\n 1 namespace Type;\n 2 \n 3 class StringType\n 4 {\n\
  \ 5   protected data;\n 6 \n 7   public function __construct(var data)\n 8   {\n\
  9     let this->data = data;\n10   }\n11 \n12   public function length()\n13   {\n\
  14     return strlen(this->data);\n15   }\n16 }\n```\n\n除了缺少 `$` 符号以及增加了 `var`/`let`\
  \ 关键字外，这非常容易理解。保存文件并（从扩展根目录）运行：\n\n```\n 1 $ zephir build\n 2 \n 3 Compiling...\n\
  4 /bin/bash /vagrant/zephir/type/ext/libtool --mode=compile gcc  -I. -I/vagrant/\\\
  \n 5 zephir/type/ext -DPHP_ATOM_INC -I/vagrant/zephir/type/ext/include -I/vagrant/z\\\
  \n6 ephir/type/ext/main -I/vagrant/zephir/type/ext -I/usr/include/php5 -I/usr/incl\\\
  \n 7 ude/php5/main -I/usr/include/php5/TSRM -I/usr/include/php5/Zend -I/usr/include\\\
  \n 8 /php5/ext -I/usr/include/php5/ext/date/lib  -DHAVE_CONFIG_H  -O2 -fvisibility=\\\
  \n9 hidden -Wparentheses -flto -c /vagrant/zephir/type/ext/stringtype.zep\n10 -o\
  \ type/stringtype.lo...\n```\n\n扩展类文件编译为纯 C 代码，并添加类加载代码。构建的最后可能类似于：\n\n```\n1 Installing...\n\
  2 Extension installed!\n3 Add extension=type.so to your php.ini\n4 Don't forget\
  \ to restart your web server\n```\n\n我们需要将其添加到 `php.ini` 文件中：\n\n```\n1 $ sudo bash\
  \ -c \"echo extension=type.so >> /etc/php5/cli/php.ini\"\n```\n\n这将安装我们刚刚创建的 `Type`\
  \ 扩展。我们可以通过运行以下命令检查它是否已安装：\n\n```\n1 $ php -i | grep \"type => enabled\"\n2 \n3\
  \ type => enabled\n```\n\n如果你看到了这一行，说明扩展已安装并准备就绪。\n\n使用这个新扩展非常简单：\n\n```\n1 <?php\n\
  2 \n3 $string = new Type\\StringType(\"Hello World\");\n4 \n5 print $string->length();\n\
  ```\n\n命名空间和类完全位于编译扩展文件中。Zephir 扩展可以使用现有的核心和扩展命名空间/类。它可以被纯 PHP 代码使用（只要在在使用时已注册）。\n\
  \n## 结论\n\n扩展极大地简化了我们的工作，因为它处理了如装箱和解箱等问题。\n\n## 设计\n\n### 使用何种方法\n\n我们已经决定使用命名空间函数作为基础，因此需要决定如何在类内部使用这些函数。\n\
  \n#### 解析类型\n\n在类型方法中，我们经常需要解析类型。任何参数都可能是错误的类型。将类型解析/转换函数放在自己的命名空间中是合理的：\n\n*  \
  \ `Type\\isString`\n*   `Type\\isStringObject`\n*   `Type\\isExpression`\n*   …\n\
  *   `Type\\toStringObject`\n*   `Type\\toExpression`\n*   …\n\n我们应该代理到创建方法：\n\n\n\
  \n\n\n```php\nclass StringObject extends SPLString\n{\n  public function trim($mask\
  \ = \"\\t\\n\\r\\0\\x0B\")\n  {\n    $isString       = Type\\isString($mask);\n\
  \    $isStringObject = Type\\isStringObject($mask);\n\n    if ($isString or $isStringObject)\
  \ {\n      if (Type\\isExpression($mask)) {\n        $raw = Type\\String\\trimWithExpression(\n\
  \          $this,\n          $mask\n        );\n      } else {\n        $raw = Type\\\
  String\\trimWithString(\n          $this,\n          $mask\n        );\n      }\n\
  \n      return Type\\toStringObject($raw);\n    }\n\n    throw new LogicException(\"\
  mask is not a string\");\n  }\n}\n```\n\n## 链式调用\n\n我们所采用的面向对象方法的好处之一是我们可以对类型进行链式调用。你可能已经注意到它是如何实现的（参考上一个示例），但万一你没：\n\
  \n```php\nreturn Type\\toStringObject($raw);\n```\n\n操作方法应该返回原始的 PHP 类型 - 因为我们希望人们能够交替使用这些类型。因此，轮由类（代理）将原始\
  \ PHP 类型封装在 `SPL Types` 中。\n\n## 合并数字类型\n\n我已经提到过我对单一数字类型的愿望，而这正是我想要在这里实现的。出于这个原因，我们将完全忽略\
  \ `SPLNumber` 类，转而使用 `SPLFloat`。\n\n原因很简单 - 数字应该能够处理小数点，而不需要额外的一组方法或额外的心理负担。这将导致数值操作中产生额外的类型转换，但并不是世界末日。\n\
  \n## 如何测试\n\n测试是取代原生类型处理系统的至组成部分。好消息是，这很容易！\n\n### PHPUnit\n\nPHPUnit 是一个单元测试库，它让测试小型代码单元的过程变得超级简单：\n\
  \n```php\nclass StringObjectTest extends PHPUnit_Framework_TestCase\n{\n  /** @test\
  \ */\n  public function trimWorksWithStrings()\n  {\n    $subject = Type\\toStringObject(\"\
  Hello World...\");\n\n    $this->assertEquals(\n      \"Hello World\",\n      $object->trim(\"\
  .\")\n    );\n  }\n}\n```\n\n这种测试可以使用许多测试框架完成。归根结底，只要你在编写测试，使用哪种测试框架由你决定。\n\n###\
  \ 应该测试什么？\n\n简短的答案是：一切。\n\n我们的目标是构建一些稳固的东西，而且它是非常底层的。这意味着我们需要确保事情继续按照预期工作。考虑到我们将制作的方法是多么简单，这甚至并不难。\n\
  \n我们应该力求对命名空间下的函数有有良好的覆盖率，并编写几个测试以确保它们从（代理）类中被正确调用。\n\n### 什么时候应该编写测试？\n\n这真的取决于你。也许你想先写测试，并遵循“红-绿-重构”循环。也许你想先写完所有的库代码，然后确保一切都按照你预期的方式运行（通过为库代码编写测试）。\n\
  \n重要的一是编写测试。\n\n### 建议\n\n我强烈推荐以下书籍：\n\n* [Robert C. Martin 写的《Clean Code》](http://www.amazon.com/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882)\n\
  * [Chris Hartjes 写的《The Grumpy Programmer’s PHPUnit Cookbook](https://leanpub.com/grumpy-phpunit)\n\
  \n## 如何打包\n\n如果你希望你的代码被（他人）使用，那么明智的做法是将其打包，让别人也想使用它。\n\n### 创建一个 `Readme` 文件\n\n\
  这听起来很简单，但你会对实际上有多少开发者在做这件事感到惊讶！当其他开发者偶然发现你的仓库（在 Github/BitBucket 等地方）时，如果他们看到的只有一个空空目录结构而空无一物，他们不会印象深刻。\n\
  \n创建一个 `Readme` 文件，并包含以下内容……\n\n### 几个示例\n\n展示你的库能做什么。没有什么比更令人沮丧的，被某些营销吸引（去了解更多某个库），结果却不得不从测试和/或源代码中去搞清楚。\n\
  \n那些地方是学习的绝佳场所，但它们必须主动寻找，而几个示例（在你的 `Readme` 文件中）是很容易找到。包含涵盖你库主要方面的示例。\n\n在我们的情况下，这意味着提供一个或两个关于支持库的底层过程代码示例。这意味着提供一个或两个关于面向对象封装的示例，它们为传统的过程化操作提供了流式接口。这意味着提供一个或两个关于如何子类这些类型以进一步自定义的示例。\n\
  \n制作这些并不难 - 甚至可以从你的单元测试中提取……\n\n### 测试说明\n\n开发者想知道你的代码有多稳固。诚然你使用了 [SemVer](http://semver.org)，但你的测试覆盖率是多少？你的测试通过了吗？我可以信任你吗？\n\
  \n回答这些问题最简单的方法是编写单元测试，然后提供如何运行它们的说明。你不需要任何复杂的配置：\n\n```bash\ncomposer install &&\
  \ phpunit\n```\n\n### 安装说明\n\n好了 - 你已经说服了某人使用经过良好测试的库。示例提供了它的价值。那么他们如何安装你的库呢？\n\n\
  这就是你创建一个 `composer.json` 文件并包含 Composer 安装说明的地方。这需要去 [Packagist](https://packagist.org)\
  \ 转一圈，但这样做会让你受益匪浅。\n\n然后只需要一组简单的指令即可：\n\n```bash\ncomposer require \"vendor/library:1.0.0\"\
  \n```\n\n### 许可证\n\n包含一个开源许可。像 [MIT](http://opensource.org/licenses/MIT) 这样友好的许可就可以。在你的\
  \ `Readme` 文件中指定，并包含一个命名清晰的文件（如 `LICENSE` 或 `license.md`），其中包含完整的许可内容。\n\n### 贡献指南\n\
  \n这是可选的，但它大大增加了其他开发者发送兼容拉取请求的概率。如果你对代码风格很挑剔（你应该是这样的），请务必告诉人们你希望他们的提交看起来像什么样。\n\n\
  ### 总结\n\n构建一个新的类型系统部分是关于代码。制作良好的库包含了大量的设计考虑。花时间决定一个合理的结构 - 一个能让使用者获得最大灵活性的结构。\n\
  \n良好测试。良好打包。清晰。\n\n## 为未来设计\n\n本章节尚未完整。\n\n## 附录\n\n### PHP 实现\n\n此部分尚未完整。\n\n###\
  \ Zephir 实现\n\n此部分尚未完整。\n\n### JavaScript 实现\n\n此部分尚未完整。\n\n"
