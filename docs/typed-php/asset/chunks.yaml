- fmt: "\nAnd for most small-to-medium sized projects, adding a revised type-system\
    \ is unnecessary. Yet if you learned how to make (or even just use) a well-built\
    \ type system, wouldn’t it make sense to use it in large projects? Or in any projects\
    \ you cared enough about?\n\nThis area of PHP often chases developers into prettier\
    \ languages. Don’t be one of those developers! Learn how to write cleaner code,\
    \ by using a clean abstraction.\n\n## Structure\n\n### Boxing\n\nBoxing is a term\
    \ given to the practice of wrapping (enclosing) data within a class, so that behaviour\
    \ can be added to the wrapped data. Let’s look at an example:\n\n```php\n 1 <?php\n\
    \ 2 \n 3 class StringBox\n 4 {\n 5   /**\n 6    * @var string\n 7    */\n 8  \
    \ protected $data;\n 9 \n10   /**\n11    * @param string $data\n12    */\n13 \
    \  public function __construct($data)\n14   {\n15     $this->data = $data;\n16\
    \   }\n 17 \n18   /**\n19    * @return string\n20    */\n21   public function\
    \ toString()\n22   {\n23     return (string) $this->data;\n24   }\n 25 \n 26 \
    \  /**\n27    * @return string\n28    */\n29   public function toUpperCase()\n\
    30   {\n31     return strtoupper($this->data);\n32   }\n 33 \n 34   /**\n35  \
    \  * @return string\n36    */\n37   public function toLowerCase()\n38   {\n39\
    \     return strtolower($this->data);\n40   }\n 41 \n 42   /**\n43    * @param\
    \ string $needle\n44    * @param mixed  $offset\n45    *\n46    * @return int\n\
    47    */\n48   public function getIndexOf($needle, $offset = null)\n49   {\n50\
    \     $index = strpos($this->data, $needle, $offset);\n51 \n52     if ($index\
    \ === false) {\n53       return -1;\n54     }\n55 \n56     return $index;\n57\
    \   }\n58 }\n 59 \n60 $box = new StringBox(\"Hello World\");\n61 \n62 print $box->toString();\
    \          // \"hello world\"\n63 print $box->toUpperCase();       // \"HELLO\
    \ WORLD\"\n64 print $box->toLowerCase();       // \"hello world\"\n65 print $box->getIndexOf(\"\
    foo\");   // -1\n66 print $box->getIndexOf(\"World\"); // 6\n```\n\nThis approach\
    \ is fully supported by PHP, without any additional extensions or dependencies.\
    \ It’s a simple concept, if you think about it. You’re using protected properties\
    \ and exposing a public API for setting them, getting them and manipulating them.\n\
    \nThe difficulty with it is that it leads to a lot more code than just using the\
    \ native functions. You need to define wrappers. You need to define setters and\
    \ getters. You have to use them every time you want to put `native` types in and\
    \ get `native` types out. What I mean by that last statement?\n\n```php\n1 $helloBox\
    \ = new StringBox(\"Hello\");\n2 $worldBox = new StringBox(\"World\");\n3 \n4\
    \ $worldBox = new StringBox(\n5   $helloBox->toString() . \" \" . $worldBox->toString()\n\
    6 );\n```\nThis quickly becomes unwieldy. It’s also more memory intensive, and\
    \ slower than just using the native functions. PHP allows the use of a method\
    \ called `__toString`. When a class defines this method (to return a string),\
    \ and an instance of the class is used in an operation that expects a string;\
    \ the `__toString` method is automatically called. This isn’t enough for us to\
    \ simulate an extensible type system, or this would be short.\n\n### Resolving\
    \ Types\n\nPHP is weakly typed. That is, variables can be declared without specifying\
    \ a type. Their type can be changed at any point. They can be coerced into different\
    \ types on demand. If we want to implement stronger type handling, we need to\
    \ be able to identify the type of a variable. The `gettype` function returns the\
    \ data type of a variable. It can identify the following types:\n\n- `boolean`\n\
    - `integer`\n- `double`\n- `string`\n- `array`\n- `object`\n- `resource`\n\nIf\
    \ none of these types correctly describes the variable, `gettype` will return\
    \ `unknown type`. Again we see some inconsistencies. Firstly, floats are identified\
    \ as `double` and null values are returned as `NULL` (in contrast to every type\
    \ identifier). We can abstract around this function with something resembling\
    \ the following:\n\n```php\n1 <?php\n 2 \n3 function type($variable) {\n4   $type\
    \ = gettype($variable);\n5 \n6   switch ($type) {\n7 \n8     case \"integer\"\
    :\n9     case \"double\":\n10       return \"number\";\n11 \n12     case \"NULL\"\
    :\n13       return \"null\";\n14 \n15   }\n16 \n17   return $type;\n18 }\n19 \n\
    20 print type(0);    // \"number\"\n21 print type(0.0);   // \"number\"\n22 print\
    \ type(null); // \"null\"\n```\n\nWhat about when the variable contains a callback?\
    \ In that case, we can use…\n\n#### Functions\n\nThe `is_callable` function checks\
    \ to see if something is a callable function, whether it is a string or an anonymous\
    \ function.\n\n```php\n1 <?php\n2 \n3 print is_callable(\"is_callable\"); // true\n\
    4 print is_callable(function(){});  // true\n5 print is_callable(null);      \
    \    // false\n6 \n7 class Foo\n8 {\n9   public function bar()\n10   {\n11   }\n\
    12 \n13   public function identify()\n14   {\n15     return is_callable([$this,\
    \ \"bar\"]);\n16   }\n17 }\n18 \n19 $foo = new Foo();\n20 \n21 print $foo->identify();\
    \ // true\n```\n\nTechnically, `is_callable` identifies a valid argument to any\
    \ callback-accepting function in PHP. The following are all valid for these kinds\
    \ of functions:\n\n- An actual function (`function(){}`)\n- An array of context\
    \ and method name (`[$this, \"bar\"]`)\n- The name of a function, as a string\
    \ (`\"is_callable\"`)\n\nDue to how loose this method is, you need to be careful\
    \ when trying to identify strings and functions in the same resolver function.\
    \ If you’re using `is_string` and `is_callable` at the same time, your results\
    \ may differ depending on the order in which these are called. For example:\n\n\
    ```php\n1 $variable = \"is_callable\";\n2 \n3 if (is_string($variable)) {\n4 \
    \  die(\"variable is a string\");\n5 }\n6 \n7 if (is_callable($variable)) {\n\
    8   die(\"variable is callable\");\n9 }\n```\n\nThe script will terminate with\
    \ the string `variable is a string`, because it is a string. But it’s also the\
    \ name of a callable function, so swapping the conditional statements will make\
    \ the script terminate in `variable is callable`.\n\nIf you want to get more specific,\
    \ then it’s helpful to know that `gettype(function(){})` will return `\"object\"\
    `. In that case, we can do this:\n\n```php\n1 <?php\n2 \n3 function is_function($variable)\
    \ {\n4   return is_callable($variable) and gettype($variable) === \"object\";\n\
    5 }\n6 \n7 print is_function(function(){});  //true\n8 print is_function(\"is_function\"\
    ); //false\n9 print is_function(new stdClass);  //false\n```\n\n#### Classes\n\
    \nSometimes what we want to do is identify the type of object we’re working with.\
    \ `gettype` won’t tell us much more than that the variable is an object. We’ll\
    \ have to combine that with the `get_class` function:\n\n```php\n 1 <?php\n 2\
    \ \n3 function type($variable) {\n4   $type = gettype($variable);\n5 \n6   switch\
    \ ($type) {\n7 \n8     case \"integer\":\n9     case \"double\":\n10       return\
    \ \"number\";\n11 \n12     case \"NULL\":\n13       return \"null\";\n14 \n15\
    \     case \"object\":\n16       return get_class($variable);\n17 \n18   }\n19\
    \ \n20   return $type;\n21 }\n22 \n23 print type(\"foo\"); // \"string\"\n24 \n\
    25 class Foo\n26 {\n27 \n28 }\n29 \n30 $foo = new Foo();\n31 \n32 print type($foo);\
    \         // \"Foo\"\n33 print type(function(){}); // \"Closure\"\n```\n\nSince\
    \ PHP has multiple sets of string functions (one for plain strings and a few for\
    \ regular expressions), it would be great if we had a way to differentiate between\
    \ things that look like regular expressions and things that don’t. It’s important\
    \ to differentiate between definitively identifying regular expressions and identifying\
    \ things that *look like*. Just because something looks like a regular expression\
    \ doesn’t mean that it is. Nor does it mean that the intention of the author was\
    \ for it to be a regular expression.\n"
