- fmt: "\nThis command will take you inside the virtual machine, just as if you were\
    \ connecting to a remote server. Inside the virtual machine, you can run any of\
    \ the commands usually supported by the guest operating system, including executing\
    \ PHP scripts against the packages installed on the virtual machine.\n\n[http://phansible.com](http://phansible.com)\
    \ is the brain-child of [Erika Heidi](https://twitter.com/erikaheidi). She is\
    \ also the author of [Vagrant Cookbook](https://leanpub.com/vagrantcookbook).\
    \ I highly recommend reading this book, if you have any questions or simply want\
    \ to know more about Vagrant!\n\n## SPL Types\n\nSPL (or Standard PHP Library)\
    \ is a library of additional types to augment those native to core PHP. There\
    \ are some popular classes (like `LogicException` and `ArrayObject`). Some of\
    \ the SPL ships with `standard` PHP installations. The parts we’re going to look\
    \ at shortly do not…\n\nYou can find these mystery libraries at `http://www.php.net/manual/en/book.spl-types.php`.\n\
    \nThis section assumes you’re using the Vagrant box explained earlier. If not,\
    \ please set that up first. These commands are Linux-specific and depend on the\
    \ pre-installed modules explained earlier.\n\n### Installing SPL Types\n\nTo install\
    \ them, run the following commands:\n\n```\n1 $ sudo apt-get install libpcre3-dev\
    \ php5-dev\n2 \n3 Reading package lists... Done\n4 Building dependency tree\n\
    5 Reading state information... Done\n6 The following extra packages will be installed:\n\
    7   autoconf automake autotools-dev build-essential...\n```\n\n```\n1 $ sudo pecl\
    \ install SPL_Types\n2 \n3 downloading SPL_Types-0.4.0.tgz ...\n4 Starting to\
    \ download SPL_Types-0.4.0.tgz (8,388 bytes)\n5 .....done: 8,388 bytes\n6 6 source\
    \ files, building\n7 running: phpize...\n```\n\nThese two commands install the\
    \ pre-requisites for compiling PECL extensions. PECL is a repository just like\
    \ PEAR. If you’ve heard of neither, then don’t worry. All you need to know is\
    \ that the SPL Types are hosted here, so to install them we need to be able to\
    \ compile PECL extensions.\n\n```\n1 $ sudo bash -c \"echo extension=spl_types.so\
    \ >> /etc/php5/cli/php.ini\"\n```\n\nThis command appends `extension=spl_types.so`\
    \ to the `php.ini` file (as per the installation instructions).\n\n```\n1 $ sudo\
    \ service php5-fpm restart\n2 \n3 php5-fpm stop/waiting\n4 php5-fpm start/running,\
    \ process...\n```\n\nThis command restarts PHP-FPM - the process that interprets\
    \ PHP command line instructions and Nginx web requests. These commands should\
    \ have installed the SPL Types, but just to be sure, run the following command:\n\
    \n```\n1 $ php -i | grep SPL_Types\n2 SPL_Types\n```\n\nIf you see that `SPL_Types`\
    \ line, then you should be good to go!\n\n### Using SPL Types\n\nLet’s look at\
    \ a few examples of how these classes can be used:\n\n```\n 1 <?php\n 2 \n 3 class\
    \ NumberType extends SplFloat\n 4 {\n 5   /**\n 6    * @return float\n 7    */\n\
    \ 8   public function toInteger()\n 9   {\n10     return round($this);\n11   }\n\
    \ 12 \n 13   /**\n 14    * @return string\n 15    */\n 16   public function toString()\n\
    \ 17   {\n 18     return (string) $this;\n 19   }\n 20 }\n 21 \n 22 $number =\
    \ new NumberType(13.86);\n 23 \n 24 print $number->toInteger(); // 14\n 25 print\
    \ $number->toString();  // \"13.86\"\n 26 \n 27 print (float) $number + 1.00;\
    \ // 14.86\n 28 print $number * 12;           // 156\n```\n\nThe `toInteger` and\
    \ `toString` methods do similar things to the box classes. The magic happens when\
    \ we do basic arithmetic with the `$number` object. SPL Types are automatically\
    \ unboxed when they are used in arithmetic expressions, or cast or concatenated.\
    \ Any operator that would normally with with a scalar type will work with the\
    \ corresponding SPL Type.\n\nHere’s another example:\n\n```\n 1 <?php\n 2 \n 3\
    \ class StringType extends SplString\n 4 {\n 5   /**\n 6    * @param int   $start\n\
    \ 7    * @param mixed $length\n 8    *\n 9    * @return StringType\n10    */\n\
    \ 11   public function slice($start = 0, $length = null)\n 12   {\n 13     if\
    \ ($length === null) {\n 14       return new static(substr($this, $start));\n\
    \ 15     }\n 16 \n 17     return new static(substr($this, $start, $length));\n\
    \ 18   }\n 19 }\n 20 \n 21 $string = new StringType(\"Hello World\");\n 22 \n\
    \ 23 print $string->slice(6); // \"World\"\n```\n\nWe can design our types so\
    \ that they return new instances. This gives us a simple `chaining` interface.\n\
    \nBe careful when assuming the return type of native PHP functions. Be sure to.\n"
