    \ that tell Vagrant which dependencies to install for you. There are many kinds\
    \ of Vagrant provisioners, but the only one we will use is called Ansible.\n\n\
    We’ll use [http://phansible.com](http://phansible.com) to do most of the heavy-lifting.\n\
    \n![](images/phansible.png)\n\nSet the following options:\n\n1.  Operating System:\
    \ Ubuntu Precise Pangolin 64\n\n2.  Webserver: Nginx + PHP5-FPM\n\n3.  PHP: 5.5\n\
    \n4.  Composer: Enabled\n\n5.  PHP Modules: php-pear php5-cli php5-common\n\n\
    When you click “Generate”, you’ll start downloading an archive of files. Extract\
    \ these into a working directory and start up Terminal.\n\nThese files are instruction\
    \ files (Ansible-specific YAML syntax) which describe which dependencies Vagrant\
    \ must automatically install. You shouldn’t need to change them to get the PHP\
    \ stack working, but feel free to familiarise yourself with what they are doing.\n\
    \nTo start the virtual machine, run the following command:\n\n```\n1 $ vagrant\
    \ up\n2 \n3 Bringing machine 'default' up with 'virtualbox' provider...\n4 ==>\
    \ default: Importing base box 'precise64'...\n5 ==> default: Matching MAC address\
    \ for NAT networking...\n6 ==> default: Setting the name of the VM: Default\n\
    7 ==> default: Clearing any previously set network interfaces...\n```\n\nYou may\
    \ be asked to provide an administrator password, as part of setting up the virtual\
    \ machine. This will allow the NFS shared folders to be set up.\n\nOnce the virtual\
    \ machine is initialised, you can log into it with:\n\n```\n1 $ vagrant ssh\n\
    2 \n3 Welcome to Ubuntu 12.04 LTS (GNU/Linux 3.2.0-23-generic x86_64)\n4 \n5 \
    \ * Documentation:  https://help.ubuntu.com/\n6 Welcome to your Vagrant-built\
    \ virtual machine.\n7 Last login: Tue May 27 11:16:05 2014 from 10.0.2.2\n8 \n\
    9 vagrant@precise64:~$\n```\n\nYou can also check the installed version of PHP\
    \ (and that the CLI was installed correctly) with:\n\n```\n1 $ php -v\n2 \n3 PHP\
    \ 5.5.12-2+deb.sury.org~precise+1 (cli) (built: May 12 2014 13:46:35)\n4 Copyright\
    \ (c) 1997-2014 The PHP Group\n5 Zend Engine v2.5.0, Copyright (c) 1998-2014 Zend\
    \ Technologies\n6     with Zend OPcache v7.0.4-dev, Copyright (c) 1999-2014, by\
    \ Zend Technologies\n```\n\n#### Vagrant Commands\n\nThere are a few Vagrant commands\
    \ you’re likely to use often:\n\n```\n1 $ vagrant up\n```\n\nThis command will\
    \ start the Vagrant virtual machine, and run any outstanding provisioning. That\
    \ means the first time you run this command, it will take longer boot (depending\
    \ on the complexity of your provisioning scripts).\n\n```\n1 $ vagrant halt\n\
    ```\n\nThis command will shut the virtual machine down. It will try to gracefully\
    \ shut the machine down.\n\n```\n1 $ vagrant destroy\n```\n\nThis command will\
    \ remove the virtual machine and clean up settings applied when it was created.\
    \ If you break something inside the visual machine, and you want to *reset* it\
    \ to the default state, you’ll want to run this command followed by `vagrant up`.\n\
    \n```\n1 $ vagrant ssh\n```"
