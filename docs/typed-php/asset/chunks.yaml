  trans: "\nZephir 是一个用于编写可编译和可安装 PHP 扩展的框架，它使用一种与 C 代码具有相似之处的 PHP 超集语言。Zephir 并不是严格的\
    \ PHP 扩展，Zephir 库也用用 PHP 编写的。\n\n它与 Phalcon 框架属于同一个集体，而 Phalcon 本身就是一个 PHP 扩展。这将会变得非常有趣！\n\
    \n## 安装 Zephir\n\nZephir 需要一些库才能正确编译。我们可以通过以下命令安装它们：\n\n```\n1 $ sudo apt-get\
    \ install git gcc make re2c php5 php5-json php5-dev libpcre3-dev\n```\n\n接下来，我们需要安装\
    \ `JSON-C` 库（Zephir 用它来编译扩展）：\n\n```\n1 $ git clone https://github.com/json-c/json-c.git\
    \ && cd json-c && sh autogen.sh\\\n2 && ./configure && make && sudo make install\n\
    ```\n\n这些命令将克隆 `JSON-C` 仓库并对其进行配置和编译。最后，我们需要安装 Zephir：\n\n```\n1 $ git clone https://github.com/phalcon/zephir\
    \ && cd zephir && ./install -c\n```\n\n这应该已经安装了一个可用的 Zephir 版本。你可以进入克隆文件夹并运行以下命令来检查它是否正常工作：\n\
    \n```\n1 $ zephir version\n```\n\n## 使用 Zephir\n\n使用 Zephir 相对简单（考虑到实际执行的工作）。让我们从初始化一个全新的扩展骨架项目开始：\n\
    \n```\n1 $ zephir init type\n```\n\n这将在当前工作目录下创建一个骨架项目文件夹。进入新创建的 `type` 目录并运行：\n\
    \n```\n1 $ ls -la\n2 \n3 ext/ type/ config.json\n```\n\n扩展类位于 `type` 文件夹中（这特定于扩展的名称，即我们通过\
    \ `init` 命令指定的名称）。在其中找到一个名为 `StringType.zep` 的文件，用你的编辑器打开它。\n\nZephir 的语法与 PHP\
    \ 非常相似，但带有一丝 C 风格。你可以在 [`www.zephir-lang.com/index.html`](http://www.zephir-lang.com/index.html)\
    \ 找到相当的文档。\n\n创建以下类：\n\n```\n 1 namespace Type;\n 2 \n 3 class StringType\n 4\
    \ {\n 5   protected data;\n 6 \n 7   public function __construct(var data)\n 8\
    \   {\n9     let this->data = data;\n10   }\n11 \n12   public function length()\n\
    13   {\n14     return strlen(this->data);\n15   }\n16 }\n```\n\n除了缺少 `$` 符号以及增加了\
    \ `var`/`let` 关键字外，这非常容易理解。保存文件并（从扩展根目录）运行：\n\n```\n 1 $ zephir build\n 2 \n 3\
    \ Compiling...\n4 /bin/bash /vagrant/zephir/type/ext/libtool --mode=compile gcc\
    \  -I. -I/vagrant/\\\n 5 zephir/type/ext -DPHP_ATOM_INC -I/vagrant/zephir/type/ext/include\
    \ -I/vagrant/z\\\n6 ephir/type/ext/main -I/vagrant/zephir/type/ext -I/usr/include/php5\
    \ -I/usr/incl\\\n 7 ude/php5/main -I/usr/include/php5/TSRM -I/usr/include/php5/Zend\
    \ -I/usr/include\\\n 8 /php5/ext -I/usr/include/php5/ext/date/lib  -DHAVE_CONFIG_H\
    \  -O2 -fvisibility=\\\n9 hidden -Wparentheses -flto -c /vagrant/zephir/type/ext/stringtype.zep\n\
    10 -o type/stringtype.lo...\n```\n\n扩展类文件编译为纯 C 代码，并添加类加载代码。构建的最后可能类似于：\n\n```\n\
    1 Installing...\n2 Extension installed!\n3 Add extension=type.so to your php.ini\n\
    4 Don't forget to restart your web server\n```\n\n我们需要将其添加到 `php.ini` 文件中：\n\n\
    ```\n1 $ sudo bash -c \"echo extension=type.so >> /etc/php5/cli/php.ini\"\n```\n\
    \n这将安装我们刚刚创建的 `Type` 扩展。我们可以通过运行以下命令检查它是否已安装：\n\n```\n1 $ php -i | grep \"type\
    \ => enabled\"\n2 \n3 type => enabled\n```\n\n如果你看到了这一行，说明扩展已安装并准备就绪。\n\n使用这个新扩展非常简单：\n\
    \n```\n1 <?php\n2 \n3 $string = new Type\\StringType(\"Hello World\");\n4 \n5\
    \ print $string->length();\n```\n\n命名空间和类完全位于编译扩展文件中。Zephir 扩展可以使用现有的核心和扩展命名空间/类。它可以被纯\
    \ PHP 代码使用（只要在在使用时已注册）。\n\n## 结论\n\n扩展极大地简化了我们的工作，因为它处理了如装箱和解箱等问题。\n\n## 设计\n\n\
    ### 使用何种方法\n\n我们已经决定使用命名空间函数作为基础，因此需要决定如何在类内部使用这些函数。\n\n#### 解析类型\n\n在类型方法中，我们经常需要解析类型。任何参数都可能是错误的类型。将类型解析/转换函数放在自己的命名空间中是合理的：\n\
    \n*   `Type\\isString`\n*   `Type\\isStringObject`\n*   `Type\\isExpression`\n\
    *   …\n*   `Type\\toStringObject`\n*   `Type\\toExpression`\n*   …\n\n我们应该代理到创建方法：\n\
    \n"
- fmt: "\n```php\nclass StringObject extends SPLString\n{\n  public function trim($mask\
    \ = \"\\t\\n\\r\\0\\x0B\")\n  {\n    $isString       = Type\\isString($mask);\n\
    \    $isStringObject = Type\\isStringObject($mask);\n\n    if ($isString or $isStringObject)\
    \ {\n      if (Type\\isExpression($mask)) {\n        $raw = Type\\String\\trimWithExpression(\n\
    \          $this,\n          $mask\n        );\n      } else {\n        $raw =\
    \ Type\\String\\trimWithString(\n          $this,\n          $mask\n        );\n\
    \      }\n\n      return Type\\toStringObject($raw);\n    }\n\n    throw new LogicException(\"\
    mask is not a string\");\n  }\n}\n```\n\n## Chaining\n\nOne of the benefits of\
    \ the object-oriented approach we’re taking is that we can chain calls on the\
    \ types. You may have noticed how this is implemented (from the previous example),\
    \ but in-case you didn’t:\n\n```php\nreturn Type\\toStringObject($raw);\n```\n\
    \nThe manipulation methods should return plain PHP types - because we want people\
    \ to be able to use the types interchangeably. So it falls to the classes (proxies)\
    \ to wrap plain PHP types within the `SPL Types`.\n\n## Combining Number Types\n\
    \nI’ve already alluded to my desire of a single number type, and that’s exactly\
    \ what I want to achieve here. For that reason, we’ll completely ignore the `SPLNumber`\
    \ class in favour of `SPLFloat`.\n\nThe reason is simple - numbers should be able\
    \ to handle decimal points, without a separate set of methods or additional mental\
    \ overhead. This will lead to additional casting in numeric operations, but that’s\
    \ not the end of the world.\n\n## How To Test\n\nTesting is an essential part\
    \ of supplanting the native type handling system. The good news is that it will\
    \ be easy to do!\n\n### PHPUnit\n\nPHPUnit is a unit-testing library which makes\
    \ the process of testing small units of code super easy:\n\n```php\nclass StringObjectTest\
    \ extends PHPUnit_Framework_TestCase\n{\n  /** @test */\n  public function trimWorksWithStrings()\n\
    \  {\n    $subject = Type\\toStringObject(\"Hello World...\");\n\n    $this->assertEquals(\n\
    \      \"Hello World\",\n      $object->trim(\".\")\n    );\n  }\n}\n```\n\nThis\
    \ kind of testing can be done with a number of testing frameworks. At the end\
    \ of the day, as long as you are writing tests, whichever testing framework you\
    \ use is up to you.\n\n### What Should Be Tested?\n\nThe short answer is: everything.\n\
    \nWe’re aiming to build something solid, and it’s pretty low-level. That means\
    \ we need to be sure things continue to work as expected. It’s not even that hard\
    \ when you consider how simple the methods are that we are going to make.\n\n\
    We should aim to have good coverage of the namespaced functions, and a few tests\
    \ to ensure that these are correctly called from the (proxy) classes.\n\n### When\
    \ Should Tests Be Written?\n\nThis is really up to you. Maybe you want to write\
    \ your tests first, and follow the red-green-refactor cycle. Maybe you want to\
    \ write all of your library code first, and then make sure everything works as\
    \ you expected it to (by writing tests for the library code).\n\nThe important\
    \ thing is to write tests.\n\n### Recommendations\n\nI highly recommend the following\
    \ books:\n\n* [Clean Code, by Robert C. Martin](http://www.amazon.com/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882)\n\
    * [The Grumpy Programmer’s PHPUnit Cookbook, by Chris Hartjes](https://leanpub.com/grumpy-phpunit)\n\
    \n## How To Package\n\nIf you want your code to be used (by anyone else), you’d\
    \ be wise to package it in such a way that others will want to use it.\n\n###\
    \ Make a `Readme` File\n\nIt sounds simple, but you’d be surprised how few developers\
    \ actually do this! When other developers stumble across your repository (on Github/BitBucket/what-have-you),\
    \ they won’t be impressed to see a bare-bones directory structure and nothing\
    \ else.\n\nMake a `Readme` file, and include the following…\n\n### A Few Examples\n\
    \nShow what your library can do. There are few things more frustrating than being\
    \ enticed (to learn more about a library) by some marketing, only to have to figure\
    \ it out from tests and/or source-code.\n\nThose things are excellent places to\
    \ learn, but they must be sought out, whereas a few examples (in your `Readme`\
    \ file) are easy to find. Include examples covering the major aspects of your\
    \ library.\n\nIn our case, this means an example (or two) about the procedural\
    \ code underpinning the library. It means an example (or two) about the object-oriented\
    \ wrappers, which provide fluent interfaces to traditionally procedural actions.\
    \ It means providing an example (or two) about who to subclass the types for further\
    \ customisation.\n\nIt’s not hard to make these - they can even be extracted from\
    \ your unit tests…\n\n### Testing Instructions\n\nDevelopers want to know how\
    \ solid your code is. Sure you’re using [SemVer](http://semver.org), but how much\
    \ test coverage do you have? Do your tests pass? Can I trust you?\n\nThe easiest\
    \ want to answer these questions is to write the unit tests, and then provide\
    \ instructions how to run them. You don’t require anything elaborate:\n\n```bash\n\
    composer install && phpunit\n```\n\n### Installation Instructions\n\nOk - you’ve\
    \ convinced someone to use your well-tested library. The examples provide its\
    \ value. So how do they install your library?\n\nThis is where you make a `composer.json`\
    \ file and include Composer installation instructions. This will require a round-trip\
    \ to [Packagist](https://packagist.org), but you’ll be all the better for it.\n\
    \nThen just a simple set of instructions is all you need add:\n\n```bash\ncomposer\
    \ require \"vendor/library:1.0.0\"\n```\n\n### License\n\nInclude an open-source\
    \ license. Something friendly like [MIT](http://opensource.org/licenses/MIT) will\
    \ do nicely. Specify this in your `Readme` file, and include a clearly-named file\
    \ (like `LICENSE` or `license.md`) which contains the full license.\n\n### Contribution\
    \ Guidelines\n\nThis is optional, but greatly increases the chance that other\
    \ developers will send compatible pullrequests. If you are fussy about code style\
    \ (and you should be), then be sure to tell people how you want their submissions\
    \ to look.\n\n### Conclusion\n\nBuilding a new type system is only partly about\
    \ code. There’s a lot of design consideration that goes into well-crafted libraries.\
    \ Take the time to decide on a reasonable structure - one that allows consumers\
    \ the most flexibility.\n\nTest well. Package well. Be clear.\n\n## Designing\
    \ For The Future\n\nThis chapter is incomplete.\n\n## Appendices\n\n### PHP Implementation\n\
    \nThis section is incomplete.\n\n### Zephir Implementation\n\nThis section is\
    \ incomplete.\n\n### JavaScript Implementation\n\nThis section is incomplete.\n"
