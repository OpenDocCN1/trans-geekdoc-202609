    \ is_callable(function(){});  // true\n 5 print is_callable(null);          //\
    \ false\n 6 \n 7 class Foo\n 8 {\n 9   public function bar()\n10   {\n11 \n12\
    \   }\n13 \n14   public function identify()\n15   {\n16     return is_callable([$this,\
    \ \"bar\"]);\n17   }\n18 }\n19 \n20 $foo = new Foo();\n21 \n22 print $foo->identify();\
    \ // true\n```\n\nTechnically, `is_callable` identifies a valid argument to any\
    \ callback-accepting function in PHP. The following are all valid for these kinds\
    \ of functions:\n\n*   An actual function (`function(){}`)\n\n*   An array of\
    \ context and method name (`[$this, \"bar\"]`)\n\n*   The name of a function,\
    \ as a string (`\"is_callable\"`)\n\nDue to how loose this method is, you need\
    \ to be careful when trying to identify strings and functions in the same resolver\
    \ function. If you’re using `is_string` and `is_callable` at the same time, your\
    \ results may differ depending on the order in which these are called.\n\nFor\
    \ example:\n\n```\n1 $variable = \"is_callable\";\n2 \n3 if (is_string($variable))\
    \ {\n4   die(\"variable is a string\");\n5 }\n6 \n7 if (is_callable($variable))\
    \ {\n8   die(\"variable is callable\");\n9 }\n```\n\nThe script will terminate\
    \ with the string `\"variable is a string\"`, because it is a string. But it’s\
    \ also the name of a callable function, so swapping the conditional statements\
    \ will make the script terminate in `\"variable is callable\"`.\n\nIf you want\
    \ to get more specific, then it’s helpful to know that `gettype(function(){})`\
    \ will return `\"object\"`. In that case, we can do this:\n\n```\n1 <?php\n2 \n\
    3 function is_function($variable) {\n4   return is_callable($variable) and gettype($variable)\
    \ === \"object\";\n5 }\n6 \n7 print is_function(function(){});  //true\n8 print\
    \ is_function(\"is_function\"); //false\n9 print is_function(new stdClass);  //false\n\
    ```\n\n#### Classes\n\nSometimes what we want to do is identify the type of object\
    \ we’re working with. `gettype` won’t tell us much more than that the variable\
    \ is an object. We’ll have to combine that with the `get_class` function:\n\n\
    ```\n 1 <?php\n 2 \n 3 function type($variable) {\n 4   $type = gettype($variable);\n\
    \ 5 \n 6   switch ($type) {\n 7 \n 8     case \"integer\":\n 9     case \"double\"\
    :\n10       return \"number\";\n11 \n12     case \"NULL\":\n13       return \"\
    null\";\n14 \n15     case \"object\":\n16       return get_class($variable);\n\
    17 \n18   }\n19 \n20   return $type;\n21 }\n22 \n23 print type(\"foo\"); // \"\
    string\"\n24 \n25 class Foo\n26 {\n27 \n28 }\n29 \n30 $foo = new Foo();\n31 \n\
    32 print type($foo);         // \"Foo\"\n33 print type(function(){}); // \"Closure\"\
    \n```\n\nWe could further normalise `\"Closure\"` to something like `\"function\"\
    `; if we wanted to treat it with the same gravity as the other types.\n\n####\
    \ Regular Expressions\n\nSince PHP has multiple sets of string functions (one\
    \ for plain strings and a few for regular expressions), it would be great if we\
    \ had a way to differentiate between things that look like regular expressions\
    \ and things that don’t.\n\nIt’s important to differentiate between definitively\
    \ identifying regular expressions and identifying things that *look like*. Just\
    \ because something looks like a regular expression doesn’t mean that it is. Nor\
    \ does it mean that the intention of the author was for it to be a regular expression."
