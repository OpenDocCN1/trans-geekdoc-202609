  trans: "\n对于大多数中小型项目来说，添加一个修订后的类型系统是没有必要的。然而，如果你已经学会了如何构建（甚至只是使用）一个良好的类型系统，那么在大型项目中使用它难道不是很有意义吗？或者在任何你足够在乎的项目中使用呢？\n\
    \nPHP 的这一领域经常将开发者推向更漂亮的语言。不要成为那些开发者之一！学习如何通过使用整洁的抽象来编写更整洁的代码。\n\n## 结构\n\n###\
    \ 封装 (Boxing)\n\n“封装”（Boxing）是指将数据封装（封闭）在类中的做法，以便为被封装的数据添加行为。让我们来看一个例子：\n\n```php\n\
    \ 1 <?php\n 2 \n3 class StringBox\n 4 {\n 5   /**\n 6    * @var string\n 7   \
    \ */\n 8   protected $data;\n 9 \n10   /**\n11    * @param string $data\n12  \
    \  */\n13   public function __construct($data)\n14   {\n15     $this->data = $data;\n\
    16   }\n 17 \n18   /**\n19    * @return string\n20    */\n21   public function\
    \ toString()\n22   {\n23     return (string) $this->data;\n24   }\n 25 \n 26 \
    \  /**\n27    * @return string\n28    */\n29   public function toUpperCase()\n\
    30   {\n31     return strtoupper($this->data);\n32   }\n 33 \n 34   /**\n35  \
    \  * @return string\n36    */\n37   public function toLowerCase()\n38   {\n39\
    \     return strtolower($this->data);\n40   }\n 41 \n 42   /**\n43    * @param\
    \ string $needle\n44    * @param mixed  $offset\n45    *\n46    * @return int\n\
    47    */\n48   public function getIndexOf($needle, $offset = null)\n49   {\n50\
    \     $index = strpos($this->data, $needle, $offset);\n51 \n52     if ($index\
    \ === false) {\n53       return -1;\n54     }\n55 \n56     return $index;\n57\
    \   }\n58 }\n 59 \n60 $box = new StringBox(\"Hello World\");\n61 \n62 print $box->toString();\
    \          // \"hello world\"\n63 print $box->toUpperCase();       // \"HELLO\
    \ WORLD\"\n64 print $box->toLowerCase();       // \"hello world\"\n65 print $box->getIndexOf(\"\
    foo\");   // -1\n66 print $box->getIndexOf(\"World\"); // 6\n```\n\n这种方法被 PHP\
    \ 完全支持，不需要任何额外的扩展或依赖。如果你仔细想，这是一个简单的概念。你正在使用受保护属性，并暴露一个公有 API 来设置、获取和操作它们。\n\n\
    它的困难之处在于，这会导致比直接使用原生函数产生多得多的代码。你需要定义包装器（wrappers）。你需要定义 setter（set 器）和 getter（get\
    \ 器）。每当你想要放入 `native` 类型并取出 `native` 类型时，都必须使用它们。我最后那句话的意思是？\n\n```php\n1 $helloBox\
    \ = new StringBox(\"Hello\");\n2 $worldBox = new StringBox(\"World\");\n3 \n4\
    \ $worldBox = new StringBox(\n5   $helloBox->toString() . \" \" . $worldBox->toString()\n\
    6 );\n```\n这很快就会变得难以处理。它也更消耗内存，并且比直接使用原生函数更慢。PHP 允许使用一个名为 `__toString` 的方法。当一个类定义了这个方法（返回一个字符串），并且该类的实例用在一个期望字符串的操作中时；`__toString`\
    \ 方法会被自动调用。这还不足以让我们模拟一个可扩展的类型系统，否则它就太短了。\n\n### 解析类型 (Resolving Types)\n\nPHP\
    \ 是弱类型的。这意味着，变量可以在不指定类型的情况下声明。它们的类型可以在任何时候被更改。它们可以根据需要强制转换为不同的类型。如果我们想实现更强的类型处理，我们需要能够识别变量的类型。`gettype`\
    \ 函数返回变量的数据类型。它可以识别以下类型：\n\n- `boolean`\n- `integer`\n- `double`\n- `string`\n\
    - `array`\n- `object`\n- `resource`\n\n如果这些类型中没有一个能正确描述变量，`gettype` 将返回 `unknown\
    \ type`。我们再次看到了一些不一致之处。首先，浮点数被识别为 `double`，而空值返回为 `NULL`（与其他所有类型标识符相反）。我们可以使用类似于下面的内容对此函数进行抽象：\n\
    \n```php\n1 <?php\n 2 \n3 function type($variable) {\n4   $type = gettype($variable);\n\
    5 \n6   switch ($type) {\n7 \n8     case \"integer\":\n9     case \"double\":\n\
    10       return \"number\";\n11 \n12     case \"NULL\":\n13       return \"null\"\
    ;\n14 \n15   }\n 16 \n17   return $type;\n18 }\n 19 \n20 print type(0);    //\
    \ \"number\"\n21 print type(0.0);   // \"number\"\n22 print type(null); // \"\
    null\"\n```\n\n`type(0)` // \"number\"\n`type(0.0)` // \"number\"\n`type(null)`\
    \ // \"null\"\n\n### 可调用性 (Callable)\n\n`is_callable` 函数用于检查变量是否是可调用的。在 PHP 中，很多东西都是可调用的：\n\
    \n- 匿名函数\n- 闭包\n- 静态方法\n- 实例方法\n- 带有 `__invoke` 方法的对象\n\n例如：\n\n```php\n<?php\n\
    function hello() {\n    echo \"hello\";\n}\nvar_dump(is_callable('hello')); //\
    \ true\n\n$anonymous = function() {\n    echo \"anonymous\";\n};\nvar_dump(is_callable($anonymous));\
    \ // true\n\nclass MyClass {\n    public static function method() {\n        echo\
    \ \"static method\";\n    }\n    public function method() {\n        echo \"method\"\
    ;\n    }\n}\n\nvar_dump(is_callable(['MyClass', 'method'])); // true\n$obj = new\
    \ MyClass();\nvar_dump(is_callable([$obj, 'method'])); // true\n\nclass Invoker\
    \ {\n    public function __invoke() {\n        echo \"invoked\";\n    }\n}\n$invoker\
    \ = new Invoker();\nvar_dump(is_callable($invoker)); // true\n```\n\n但是，`is_callable`\
    \ 并不总是检查它是否是函数。它只是检查它是否可以被调用。这意味着，如果一个类定义了 `__invoke` 方法，那么它的实例就是可调用的。\n\n```php\n\
    <?php\nclass Invoker {\n    public function __invoke() {\n        echo \"invoked\"\
    ;\n    }\n}\n$invoker = new Invoker();\nvar_dump(is_callable($invoker)); // true\n\
    ```\n\n此外，`is_callable` 还可以检查字符串是否代表一个定义的函数名。\n\n```php\n<?php\nfunction hello()\
    \ {\n    echo \"hello\";\n}\nvar_dump(is_callable('hello')); // true\nvar_dump(is_callable('non_existent_function'));\
    \ // false\n```\n\n总之，`is_callable` 是一个非常实用的工具，只要你理解它的工作原理。\n"
- fmt: "\nThe PHP documentation (at [http://www.php.net/manual/en/intro.pcre.php](http://www.php.net/manual/en/intro.pcre.php))\
    \ describes expressions as [a string] enclosed in delimiters. These delimiters\
    \ can be any non-alphanumeric that aren’t also a backslash or null byte.\n\nWe\
    \ can cover a large majority of cases, using the following:\n\n```php\n 1 <?php\n\
    \ 2 \n 3 function is_regex($variable) {\n 4   return @preg_match($regex, \"\"\
    ) !== false\n 5     && preg_last_error() == PREG_NO_ERROR;\n 6 }\n 7 \n 8 print\
    \ is_regex(\"/^.*$/\"); // true\n 9 print is_regex(\"/hello world/\"); // true\n\
    10 print is_regex(\"/hello world/i\"); // true\n11 print is_regex(\"hello world\"\
    ); // false\n12 print is_regex(\"\\\\hello world\\\\\"); // false\n13 print is_regex(\"\
    \\\\x00foo\\\\x00\"); // false\n14 print is_regex(\"1foo1\"); // false\n15 print\
    \ is_regex(\"afooa\"); // false\n```\n\nThe `preg_match` function returns a `1`\
    \ for a match, `0` for no match and `false` if an error occurred. Assuming `preg_match`\
    \ returns false, the error could be for any number of reasons (like `PREG_INTERNAL_ERROR`\
    \ or `PREG_BAD_UTF8_ERROR`). So then we use the `preg_last_error` function to\
    \ rule out all other errors.\n\nUsing error suppression (`@`) is generally a bad\
    \ idea. There are very few instances when using it is considered ok. This is one\
    \ of them!\n\n## Namespace Functions\n\nI’ve spoke a bit about how all these global\
    \ functions are bad, and there’s a really simple alternative: namespace functions.\
    \ You’ve probably used namespaces, for classes, but the same constructs work well\
    \ to isolate functions:\n\n```php\n 1 <?php\n 2 \n 3 namespace Type\\String {\n\
    \ 4   function length($string) {\n 5     return strlen($string);\n 6   }\n 7 }\n\
    \ 8 \n 9 namespace {\n10   print Type\\String\\length(\"Hello World\");\n11 }\n\
    ```\n\n### Composer Autoload\n\nThis kind of function definition doesn’t follow\
    \ normal autoload patterns. In order to have Composer autoload these kinds of\
    \ files is to explicitly define which files should be loaded:\n\n```json\n1 {\n\
    2   \"autoload\" : {\n3     \"files\" : [\n4       \"namespace-functions.php\"\
    \n5     ]\n6   }\n7 }\n```\n\nFollowing this, we’ll have to dump the old autoloader,\
    \ with:\n\n```bash\n1 $ composer dump-autoload\n2 \n3 Generating autoload files\n\
    ```\n\nThe files (containing namespace functions) will now be automatically loaded,\
    \ wherever the Composer autoloader is used.\n\n### Future Goodies\n\nPHP 5.6 supports\
    \ the `use function` construct, to import functions from other namespaces. It’s\
    \ currently in beta (at the time of writing), but this feature is right up our\
    \ proverbial alley.\n\nIn the meantime, it’s possible to partially import functions:\n\
    \n```php\n1 use Type\\String;\n2 \n3 print String\\length(\"Hello World\");\n\
    ```\n\nThis is especially useful for deeply-nested designs. Still; it’s great\
    \ to be able to omit the full namespace. The result is clean(er).\n\n## Conclusion\n\
    \nEven today, it’s possible to create a cleaner type/abstraction. We don’t need\
    \ special extensions, or compilation. Just a little bit of work will clean the\
    \ code up. Having said that, extensions can go a way towards making our lives\
    \ easier, while allowing the level of customisation that we are hoping to achieve.\
    \ We’ll look at a few of these in the following chapter…\n\n## Extensions Vagrant\
    \ + Ansible\n\nMany of the libraries, we will be working with, require a bit of\
    \ special installation. Instead of labouring away at guide for each operating\
    \ system, we’re going to use Vagrant for our development environment. Vagrant\
    \ (in case you haven’t heard of yet) is a program interface for managing virtual\
    \ machines. If you’ve ever set up a virtual machine, installed the development\
    \ tools, you will know how much it takes to do well. This process can be automated\
    \ with `Vagrant`.\n\n`Vagrant` depends on underlying virtualisation providers\
    \ and provisioners. We’ll look at using `VirtualBox` as virtualisation provider\
    \ and `Ansible` as provisioner.\n\n### Installing\n\nTo get `VirtualBox` installed,\
    \ go to `https://www.virtualbox.org/wiki/Downloads` and download the installer\
    \ for your operating system. Once you have downloaded and installed `VirtualBox`,\
    \ you should be able to install `Vagrant`. Go to `http://vagrantup.com/downloads.html`\
    \ and download the installer for your operating system. We’ll also need to install\
    \ `Ansible` so we can use books to provision the virtual machine.\n\n### Provisioning\n\
    \nProvisioning is just another word for a set of instructions that tell `Vagrant`\
    \ which dependencies to install for you. There are many kinds of `Vagrant` provisioners,\
    \ but the only one we will use is called `Ansible`. We’ll use `http://vagrant.com`\
    \ to do most of the heavy-lifting.\n\nSet the following options:\n1. Operating\
    \ System: Ubuntu Precise 64\n2. Webserver: Nginx + PHP-FPM\n3. PHP: 5.5\n4. Composer:\
    \ Enabled\n5. PHP Modules: `php-pear`, `php5-cli`, `php5-common`\n\nWhen you click\
    \ “Generate”, you’ll start downloading an archive of files. Extract these into\
    \ a working directory and start up Terminal. These files are instruction files\
    \ (Ansible-specific YAML syntax) which describe which dependencies `Vagrant` must\
    \ automatically install. You shouldn’t need to change them to get the PHP stack\
    \ working, but feel free to familiarise yourself with what they doing.\n\nTo start\
    \ the virtual machine, run the following command:\n\n```bash\n1 $ vagrant up\n\
    2 \n3 Bringing machine 'default' up with 'virtualbox' provider...\n4 ==> default:\
    \ Importing base box 'precise64'...\n5 ==> default: Matching MAC address for NAT\
    \ networking...\n6 ==> default: Setting the name of the VM: Default\n7 ==> default:\
    \ Clearing any previously set network interfaces...\n```\n\nYou may be asked to\
    \ provide an administrator password, as part of setting up the virtual machine.\
    \ This will allow the NFS shared folders to be set up. Once the virtual machine\
    \ is initialized, you can log into it with:\n\n```bash\n1 $ vagrant ssh\n2 \n\
    3 Welcome to Ubuntu 12.04 LTS (GNU/Linux 3.2.0-23-generic x86_64)\n4 \n5  * Documentation:\
    \  https://help.ubuntu.com/\n6 Welcome to your Vagrant-built virtual machine.\n\
    7 Last login: Tue May 27 11:16:05 2014 from 10.0.2.2\n8 \n9 vagrant@precise64:~$\n\
    ```\n\nYou can also check the installed version of PHP (and that the CLI was installed\
    \ correctly) with:\n\n```bash\n1 $ php -v\n2 \n3 PHP 5.5.12-2+deb.sury.org~precise+1\
    \ (cli) (built: May 12 2014 13:46:35)\n4 Copyright (c) 1997-2014 The PHP Group\n\
    5 Zend Engine v2.5.0, Copyright (c) 1998-2014 Zend Technologies\n6     with Zend\
    \ OPcache v7.0.4-dev, Copyright (c) 1999-2014, by Zend Technologies\n```\n\n###\
    \ Vagrant Commands\n\nThere are a few `Vagrant` commands you’re likely to use\
    \ often:\n\n```bash\n1 $ vagrant up\n```\n\nThis command will start the `Vagrant`\
    \ virtual machine, and run any outstanding provisioning. That means the first\
    \ time you run this command, it will take longer boot (depending on the complexity\
    \ of your provisioning scripts).\n\n```bash\n1 $ vagrant halt\n```\n\nThis command\
    \ will shut the virtual machine down. It will try to gracefully shut the machine\
    \ down.\n\n```bash\n1 $ vagrant destroy\n```\n\nThis command will remove the virtual\
    \ machine and clean up settings applied when it was created. If you break something\
    \ inside the visual machine, and you want to reset it to the default state, you’ll\
    \ want to run this command followed by `vagrant up`.\n\n```bash\n1 $ vagrant ssh\n\
    ```\n"
