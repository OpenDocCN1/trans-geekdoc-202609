  trans: "\n\n此命令将带你进入虚拟机内部，就像连接到远程服务器一样。在虚拟机内部，你可以运行客主机操作系统通常支持的任何命令，包括针对虚拟机上安装的包执行\
    \ PHP 脚本。\n\n[`phansible.com`](http://phansible.com) 是 [Erika Heidi](https://twitter.com/erikaheidi)\
    \ 的心血。她也是 [Vagrant Cookbook](https://leanpub.com/vagrantcookbook) 的作者。如果你有任何问题或者只是想了解更多关于\
    \ Vagrant 的信息，我强烈推荐阅读这本书！\n\n## SPL 类型\n\nSPL（或标准 PHP 库）是一个包含额外类型的库，用于增强 PHP 生类型。它有一些流行的类（如\
    \ `LogicException` 和 `ArrayObject`）。某些 `standard` PHP 安装版本附带了部分 SPL。但我们很快要查看的部分并不包含它们……\n\
    \n你可以在 `http://www.php.net/manual/en/book.spl-types.php` 找到这些神秘库。\n\n本节假设你正在使用之前介绍的\
    \ Vagrant box。如果不是，请先进行设置。这些命令是 Linux 特有的，并且取决于之前解释过的预装模块。\n\n### 安装 SPL 类型\n\n\
    要安装它们，请运行以下命令：\n\n```\n1 $ sudo apt-get install libpcre3-dev php5-dev\n2 \n3 Reading\
    \ package lists... Done\n4 Building dependency tree\n5 Reading state information...\
    \ Done\n6 The following extra packages will be installed:\n7   autoconf automake\
    \ autotools-dev build-essential...\n```\n\n```\n1 $ sudo pecl install SPL_Types\n\
    2 \n3 downloading SPL_Types-0.4.0.tgz ...\n4 Starting to download SPL_Types-0.4.0.tgz\
    \ (8,388 bytes)\n5 .....done: 8,388 bytes\n6 6 source files, building\n7 running:\
    \ phpize...\n```\n\n这两个命令安装了编译 PECL 扩展所需的先决条件。PECL 是一个类似于 PEAR 的库。如果你这两个都还没听过，请不要担心。你只需要知道\
    \ SPL 类型托管在此处，因此为了安装它们，我们需要能够编译 PECL 扩展。\n\n```\n1 $ sudo bash -c \"echo extension=spl_types.so\
    \ >> /etc/php5/cli/php.ini\"\n```\n\n此命令将 `extension=spl_types.so` 添加到 `php.ini`\
    \ 文件中（按照安装说明）。\n\n```\n1 $ sudo service php5-fpm restart\n2 \n3 php5-fpm stop/waiting\n\
    4 php5-fpm start/running, process...\n```\n\n此命令重启 PHP-FPM —— 解释 PHP 命令行指令和 Nginx\
    \ Web 请求的进程。这些命令应该已经安装了 SPL 类型，但为了起见，请运行以下命令：\n\n```\n1 $ php -i | grep SPL_Types\n\
    2 SPL_Types\n```\n\n如果你看到了 `SPL_Types` 这一行，那么就可以正常使用了！\n\n### 使用 SPL 类型\n\n让我们来看一些这些类的用法示例：\n\
    \n```\n 1 <?php\n 2 \n3 class NumberType extends SplFloat\n4 {\n 5   /**\n6  \
    \  * @return float\n7    */\n8   public function toInteger()\n9   {\n10     return\
    \ round($this);\n11   }\n 12 \n13   /**\n14    * @return string\n15    */\n16\
    \   public function toString()\n17   {\n18     return (string) $this;\n19   }\n\
    20 }\n 21 \n22 $number = new NumberType(13.86);\n23 \n24 print $number->toInteger();\
    \ // 14\n25 print $number->toString();  // \"13.86\"\n26 \n27 print (float) $number\
    \ + 1.00; // 14.86\n28 print $number * 12;           // 156\n```\n\n`toInteger`\
    \ 和 `toString` 方法对包装类做了类似的事情。神奇发生在对 `$number` 对象进行基础算术运算时。SPL 类型在算术表达式、类型转换或拼接时会自动解箱。任何通常情况下适用于标量类型的运算符，也适用于相应的\
    \ SPL 类型。\n\n这里是另一个例子：\n\n```\n 1 <?php\n 2 \n3 class StringType extends SplString\n\
    4 {\n 5   /**\n6    * @param int   $start\n7    * @param mixed $length\n8    *\n\
    9    * @return StringType\n10   */\n11   public function slice($start = 0, $length\
    \ = null)\n12   {\n13     if ($length === null) {\n14       return new static(substr($this,\
    \ $start));\n15     }\n16 \n17     return new static(substr($this, $start, $length));\n\
    18   }\n19 }\n20 }\n 21 \n22 $string = new StringType(\"Hello World\");\n23 \n\
    24 print $string->slice(6); // \"World\"\n```\n\n我们可以设计这些类型使其返回新实例。这为我们提供了一个简单的链式调用接口。\n\
    \n在假设原生 PHP 函数的返回类型时要小心。务必确认。\n\n"
- fmt: "\nZephir is a framework for writing compilable and installable PHP extensions,\
    \ using a PHP superset language sharing some similarity with C code. Zephir isn’t\
    \ strictly a PHP extension, nor are Zephir libraries written in true PHP.\n\n\
    It’s part of the same collective from which the Phalcon framework comes, and Phalcon\
    \ is itself a PHP extension. This should get interesting!\n\n## Installing Zephir\n\
    \nZephir requires a few libraries, in order to compile correctly. We can install\
    \ these with:\n\n```\n1 $ sudo apt-get install git gcc make re2c php5 php5-json\
    \ php5-dev libpcre3-dev\n```\n\nNext, we need to install the `JSON-C` library\
    \ (which Zephir uses to compile extensions):\n\n```\n1 $ git clone https://github.com/json-c/json-c.git\
    \ && cd json-c && sh autogen.sh\\\n2 && ./configure && make && sudo make install\n\
    ```\n\nThese commands will clone the `JSON-C` repository, configure and compile\
    \ it. Finally, we need to install Zephir:\n\n```\n1 $ git clone https://github.com/phalcon/zephir\
    \ && cd zephir && ./install -c\n```\n\nThat should have installed a usable version\
    \ of Zephir. You can check that it’s working by heading into the clone folder\
    \ and running:\n\n```\n1 $ zephir version\n```\n\n## Using Zephir\n\nUsing Zephir\
    \ is relatively simple (considering the work that actually goes on). Let’s begin\
    \ by initialising a new extension skeleton project:\n\n```\n1 $ zephir init type\n\
    ```\n\nThis will create a skeleton project folder in the current working directory.\
    \ Navigate into the new `type` directory and run:\n\n```\n1 $ ls -la\n2 \n3 ext/\
    \ type/ config.json\n```\n\nExtension classes go in the `type` folder (it’s specific\
    \ to the name of the extension, which we gave the `init` command). Make a find\
    \ in there, called `StringType.zep`, and open that file in your editor.\n\nThe\
    \ Zephir syntax is quite similar to PHP, but with a twist of C style. You can\
    \ find a reasonable amount of documentation at [http://www.zephir-lang.com/index.html](http://www.zephir-lang.com/index.html).\n\
    \nCreate the following class:\n\n```\n 1 namespace Type;\n 2 \n 3 class StringType\n\
    \ 4 {\n 5   protected data;\n 6 \n 7   public function __construct(var data)\n\
    \ 8   {\n 9     let this->data = data;\n10   }\n11 \n12   public function length()\n\
    13   {\n14     return strlen(this->data);\n15   }\n16 }\n```\n\nOther than the\
    \ missing `$` symbols, and the `var`/`let` keywords added, this is pretty understandable.\
    \ Save the file and (from the base extension folder) run:\n\n```\n 1 $ zephir\
    \ build\n 2 \n 3 Compiling...\n4 /bin/bash /vagrant/zephir/type/ext/libtool --mode=compile\
    \ gcc  -I. -I/vagrant/\\\n 5 zephir/type/ext -DPHP_ATOM_INC -I/vagrant/zephir/type/ext/include\
    \ -I/vagrant/z\\\n6 ephir/type/ext/main -I/vagrant/zephir/type/ext -I/usr/include/php5\
    \ -I/usr/incl\\\n 7 ude/php5/main -I/usr/include/php5/TSRM -I/usr/include/php5/Zend\
    \ -I/usr/include\\\n 8 /php5/ext -I/usr/include/php5/ext/date/lib  -DHAVE_CONFIG_H\
    \  -O2 -fvisibility=\\\n 9 hidden -Wparentheses -flto   -c /vagrant/zephir/type/ext/type/stringtype.zep.c\\\
    \n10 -o type/stringtype.lo...\n```\n\nZephir cross-compiles the extension class\
    \ files to Plain Ol’ C, and adds the class loading code. The end of the build\
    \ output should look something like:\n\n```\n1 Installing...\n2 Extension installed!\n\
    3 Add extension=type.so to your php.ini\n4 Don't forget to restart your web server\n\
    ```\n\n…So we need to add the extension to the `php.ini` file:\n\n```\n1 $ sudo\
    \ bash -c \"echo extension=type.so >> /etc/php5/cli/php.ini\"\n```\n\nThis will\
    \ have installed the `Type` extension we just created. We can check that it’s\
    \ installed by running:\n\n```\n1 $ php -i | grep \"type => enabled\"\n2 \n3 type\
    \ => enabled\n```\n\nIf you see that line returned, you know the extension is\
    \ installed, and ready to go.\n\nUsing this new extension is as simple as:\n\n\
    ```\n1 <?php\n2 \n3 $string = new Type\\StringType(\"Hello World\");\n4 \n5 print\
    \ $string->length();\n```\n\nThe namespace and class reside completely within\
    \ the compiled extension file. Zephir extensions can use pre-existing core and\
    \ extension namespaces/classes. The can be used by Plain Ol’ PHP code (provided\
    \ the extension is registered by the time it’s used).\n\nZephir extensions can\
    \ even override core functions, with better-performing versions.\n\n## Conclusion\n\
    \nExtensions make our lives significantly easier, by handling things like boxing\
    \ and unboxing.\n\n## Design\n\n### Which Method To Use\n\nWe’ve already decided\
    \ to use namespaced functions as the basis, so we need to decide how to use these\
    \ from within classes.\n\n#### Resolving Types\n\nWe’ll often need to resolve\
    \ types, within the type methods. Any arguments could potentially be the wrong\
    \ type. It makes sense for the type resolution/conversion functions to be in their\
    \ own namespace:\n\n*   `Type\\isString`\n*   `Type\\isStringObject`\n*   `Type\\\
    isExpression`\n*   …\n*   `Type\\toStringObject`\n*   `Type\\toExpression`\n*\
    \   …\n\nWe should proxy to the creation methods:\n"
  raw: "Zephir is a framework for writing compilable and installable PHP extensions,\
    \ using a PHP superset language sharing some similarity with C code. Zephir isn’t\
    \ strictly a PHP extension, nor are Zephir libraries written in true PHP.\n\n\
    It’s part of the same collective from which the Phalcon framework comes, and Phalcon\
    \ is itself a PHP extension. This should get interesting!\n\n#### Installing Zephir\n\
    \nZephir requires a few libraries, in order to compile correctly. We can install\
    \ these with:\n\n```\n1 $ sudo apt-get install git gcc make re2c php5 php5-json\
    \ php5-dev libpcre3-dev\n```\n\nNext, we need to install the JSON-C library (which\
    \ Zephir uses to compile extensions):\n\n```\n1 $ git clone https://github.com/json-c/json-c.git\
    \ && cd json-c && sh autogen.sh\\\n2  && ./configure && make && sudo make install\n\
    ```\n\nThese commands will clone the JSON-C repository, configure and compile\
    \ it. Finally, we need to install Zephir:\n\n```\n1 $ git clone https://github.com/phalcon/zephir\
    \ && cd zephir && ./install -c\n```\n\nThat should have installed a usable version\
    \ of Zephir. You can check that it’s working by heading into the clone folder\
    \ and running:\n\n```\n1 $ zephir version\n```\n\n#### Using Zephir\n\nUsing Zephir\
    \ is relatively simple (considering the work that actually goes on). Let’s begin\
    \ by initialising a new extension skeleton project:\n\n```\n1 $ zephir init type\n\
    ```\n\nThis will create a skeleton project folder in the current working directory.\
    \ Navigate into the new `type` directory and run:\n\n```\n1 $ ls -la\n2 \n3 ext/\
    \ type/ config.json\n```\n\nExtension classes go in the `type` folder (it’s specific\
    \ to the name of the extension, which we gave the `init` command). Make a find\
    \ in there, called `StringType.zep`, and open that file in your editor.\n\nThe\
    \ Zephir syntax is quite similar to PHP, but with a twist of C style. You can\
    \ find a reasonable amount of documentation at [http://www.zephir-lang.com/index.html](http://www.zephir-lang.com/index.html).\n\
    \nCreate the following class:\n\n```\n 1 namespace Type;\n 2 \n 3 class StringType\n\
    \ 4 {\n 5   protected data;\n 6 \n 7   public function __construct(var data)\n\
    \ 8   {\n 9     let this->data = data;\n10   }\n11 \n12   public function length()\n\
    13   {\n14     return strlen(this->data);\n15   }\n16 }\n```\n\nOther than the\
    \ missing `$` symbols, and the `var`/`let` keywords added, this is pretty understandable.\
    \ Save the file and (from the base extension folder) run:\n\n```\n 1 $ zephir\
    \ build\n 2 \n 3 Compiling...\n 4 /bin/bash /vagrant/zephir/type/ext/libtool --mode=compile\
    \ gcc  -I. -I/vagrant/\\\n 5 zephir/type/ext -DPHP_ATOM_INC -I/vagrant/zephir/type/ext/include\
    \ -I/vagrant/z\\\n 6 ephir/type/ext/main -I/vagrant/zephir/type/ext -I/usr/include/php5\
    \ -I/usr/incl\\\n 7 ude/php5/main -I/usr/include/php5/TSRM -I/usr/include/php5/Zend\
    \ -I/usr/include\\\n 8 /php5/ext -I/usr/include/php5/ext/date/lib  -DHAVE_CONFIG_H\
    \  -O2 -fvisibility=\\\n 9 hidden -Wparentheses -flto   -c /vagrant/zephir/type/ext/type/stringtype.zep.c\\\
    \n10  -o type/stringtype.lo...\n```\n\nZephir cross-compiles the extension class\
    \ files to Plain Ol’ C, and adds the class loading code. The end of the build\
    \ output should look something like:\n\n```\n1 Installing...\n2 Extension installed!\n\
    3 Add extension=type.so to your php.ini\n4 Don't forget to restart your web server\n\
    ```\n\n…So we need to add the extension to the `php.ini` file:\n\n```\n1 $ sudo\
    \ bash -c \"echo extension=type.so >> /etc/php5/cli/php.ini\"\n```\n\nThis will\
    \ have installed the Type extension we just created. We can check that it’s installed\
    \ by running:\n\n```\n1 $ php -i | grep \"type => enabled\"\n2 \n3 type => enabled\n\
    ```\n\nIf you see that line returned, you know the extension is installed, and\
    \ ready to go.\n\nUsing this new extension is as simple as:\n\n```\n1 <?php\n\
    2 \n3 $string = new Type\\StringType(\"Hello World\");\n4 \n5 print $string->length();\n\
    ```\n\nThe namespace and class reside completely within the compiled extension\
    \ file. Zephir extensions can use pre-existing core and extension namespaces/classes.\
    \ The can be used by Plain Ol’ PHP code (provided the extension is registered\
    \ by the time it’s used).\n\nZephir extensions can even override core functions,\
    \ with better-performing versions.\n\n### Conclusion\n\nExtensions make our lives\
    \ significantly easier, by handling things like boxing and unboxing for us. They\
    \ let us create better-performing code (as in the case of Zephir) and stricter\
    \ types (as in the case of SPL Types).\n\nWe don’t have to use these to make a\
    \ cleaner system. If we do, we can expect to have a much strong type system, without\
    \ the hard work that library-only code expects of us.\n\n## Design\n\n### Which\
    \ Method To Use\n\nWe’ve had a look at a number of methods and extensions which\
    \ can help us to abstract away the inconsistent type handling PHP presents to\
    \ us. Part of creating this abstraction is deciding on which methods and/or extensions\
    \ to use.\n\n#### Namespace Methods\n\nGenerally, we should avoid any method that\
    \ would expose a significant amount of functions in the global scope. We don’t\
    \ want to create any more clutter than there already is, and being able to use\
    \ our abstraction, in addition to the standard stuff, is definitely beneficial.\n\
    \n> We should endeavour to have all our code reside in namespaces.\n\nFurthermore,\
    \ we should implement our code in such a way that it can be used both in procedural\
    \ environments and object-oriented environments. Stated differently; we should\
    \ contain the business logic within functions and call those functions (so that\
    \ they can be used in procedural code) from within an object-oriented framework\
    \ (so that scalar types can be used like objects).\n\n> We should build our logic\
    \ in functions and add those functions (as methods) to scalar type objects.\n\n\
    #### Scalar Objects / SPL Types\n\nThis means we will want to use the namespace\
    \ functions we covered earlier, and that we will also want to use either the scalar\
    \ objects or the SPL Types as an Object-Oriented basis for our type system.\n\n\
    I mentioned that the Scalar Objects and SPL Types extensions shouldn’t be used\
    \ together. That’s because they do the same thing. It’s not possible to proxy\
    \ function calls (in the way I’ve just described) without repeating the whole\
    \ Object-Oriented side of things for each extension.\n\nThis is due to the fact\
    \ that the Scalar Objects extension automatically boxes variables while the SPL\
    \ Types extension expects developers to box their own variables. It’s the different\
    \ between `return new static(substr($this, $offset, $length));` and `return substr($this,\
    \ $offset, $length);`\n\nWhile I love the Scalar Objects extension, I am inclined\
    \ to suggest with the SPL Types extension. The main reason is that it doesn’t\
    \ interfere with how PHP handles scalar types. This means we will need to box\
    \ variables, but we’ll also enjoy the benefits of state (object-like scalar variables)\
    \ and automatic unboxing.\n\n#### Zephir\n\nAs cool as Zephir is, it’s not PHP.\
    \ That means any developers you want to work on your code, will need to know or\
    \ learn another language. It also increases the time between coding, testing and\
    \ shipping.\n\nSo, for the remainder of the book, I will show code that is built\
    \ on top of SPL Types and not translated into Zephir extensions.\n\nThe appendices\
    \ \\[will\\] include a PHP and a Zephir implementation. I don’t want the implementation\
    \ to be a focus of the book, but I will enjoy making it!\n\n### How To Structure\
    \ The Types\n\nWe’ve already decided to use namespaced functions as the basis,\
    \ so we need to decide how to use these from within classes.\n\n#### Resolving\
