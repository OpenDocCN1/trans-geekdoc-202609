- "# Python 数据分析：通过 Python 掌握深度学习并精通编程。Python 初学者指南：带项目实用指南\n\n\n\n\n\n\n\n\n## 引言\n\
  \n恭喜你购买 `Python for Data Analysis`，感谢你的支持。后续章节将讨论我们所需的一切，特别是我们如何工作。\n\n数据科学世界以及相关的各种术语已经飞速发展。许多公司开始意识到他们可以利用这些信息，以及计算机和系统能够自我训练的事实，并对学习更多如何实现这一点感到兴奋。\n\
  \n无论你处于什么种行业，数据分析、机器学习、人工智能和深度学习等流程都可以发挥作用，并在过程中为你带来优秀的结果。但带着这种心态，我们将花时间关注深度学习以及它能为你的业务带来什么。市场上有很多关于这个主题的书，再次感谢你选择这一本！我们尽力确保它包含尽可能多的信息，请享受！\n\
  \n## 第 1 章：什么是深度学习？\n\n### 什么是深度学习？\n\n深度学习是一个在机器学习领域完成我们所需的过程，通常使用人工神经网络，该网络由许多分层的结构组成，以便简化处理。当你进入第一层时，网络会学习一些简单的内容，然后将该信息以及它在该部分学到的所有内容发送到下一层。\n\
  \n从这里开始，下一层可以获取这些简单信息的一部分，并尝试将其与被认为稍微复杂的内容结合，然后将所有内容传递给第三层。这个过程将从一层持续到下一层，每一层都根据从前一层接收的任何输入构建出更复杂的内容。\n\
  \n\n\n\n这是一个有趣的过程，它向我们准确展示了深度学习究竟是如何运作的，以及为什么它如此有价值。它基本上是一个计算机根据数据科学家能够添加到系统中的简单程序，自己学会如何学习的过程。其实就这么简单！我们将讨论机器学习和深度学习中一些最优秀的库和算法来实现这一目标，但深入理解这一切的运作方式，真的会对你如何使用它产生巨大影响。\n\
  \n## 什么是深度学习\n\n我们在这里需要深入探讨的首要主题是深度学习的本质。深度学习被认为是人工智能的一种功能，它能够尽可能地模拟人类大脑在创建模式和处理复杂数据以用于决策时的某些工作机制。基本上，我们可以利用深度学习的部分来帮助我们的机器或系统，并教它如何像人类一样思考问题，尽管速度更快、效率也更高。\n\
  \n深度学习被认为是机器学习的一个子集，而机器学习又是人工智能的一个子集。它还拥有一个网络，能够从无监督数据以及无标记或非结构化数据中学习大量知识。这种学习还有其他名称，包括深度神经网络和深度神经学习。\n\
  \n因此，为了更好地了解它将如何让我们受益，我们首先需要查看如何与深度学习合作。深度学习的过程在过去几年里确实进化了很多，并与我们在数字时代看到的许多事物并肩发展。这段时期确实带来了如此多的数据，这些数据以许多形式出现。特别是，这些数据被称为大数据，我们能够从电子商务平台、搜索引擎、社交媒体等许多不同领域从中提取数据。\n\
  \n如果一家公司使用机器学习自带的某些算法，他们实际上就可以利用他们收集的所有信息。他们可以利用这些信息为客户推荐产品，真正致力于对信息进行预测和寻找模式，以便他们能够按照自己的意愿经营业务。\n\
  \n但你会发现，这些非结构化数据将非常庞大，如果让员工去浏览这些信息并从中提取相关部分，将花费太长时间，以至于信息不再具有相关性和实用性。等他们完成时，信息已经过时了，世界已经向前发展并呈现了不同的信息。但许多公司仍然意识到他们可以从所有这些信息中学习的潜力，即使这些信息规模非常大，许多公司正在寻找各种\
  \ AI 系统如何帮助他们处理这些信息并获得所需洞察的不同方法。\n\n考虑到这一点，我们花一些时间研究深度学习将如何运作是非常重要的。深度学习的进化与我们看到的数字时代同步，且往往节奏相同的速度。这是一个见证了各种形式、来自世界每个地区数据大爆炸的时代。这是大量的数据，它们可以帮助企业做出过去无法做到的明智决策。\n\
  \n想一下你手头已经拥有的所有信息，你可能甚至没有意识到它们就在那里。在你决定开始处理大数据之前，你已经知道如果你需要查阅某些东西，可以去你最喜欢的搜索引擎，一切都会会在那里。我们的数字时代正在产生大量的新信息和数据，而那些想要领先的明智公司，不仅收集了所有数据，而且学会了如何使用它们。\n\
  \n这些数据（通常被称为大数据）根据业务试图实现的目标，源自各种来源。这些数据可能来自电子商务平台、搜索引擎、在线电影院、搜索引擎等等。符合“大数据”类别的海量数据将任何想要它的人都可以轻松获取，并且可以通过云计算等许多不同的应用程序进行共享。\n\
  \n然而，这些数据通常以非结构化的形式呈现给我们，它们是如此庞大，以至于如果一个人手动浏览所有内容，可能需要几十年才能提取出与其需求相关的信息。公司意识到了这一点，他们现在知道他们收集的所有数据中存在着巨大的潜力。这就是为什么许多公司已开始关注创建和适应具有自动化支持的人工智能系统。\n\
  \n## 深度学习与机器学习有什么不同？\n\n本章中我们需要关注的下一个重点是深度学习和机器学习的概念。对于那些没有机会探索这些主题及其相关过程的人来说，这两个术语似乎是一模一样的，我们可以交替使用它们。但在本节中，我们将更深入地探索这些内容，看看它们之间的相似之处和不同之处。\n\
  \n人工智能中最常用的技术之一是用来帮助我们处理长期以来收集的一些大数据的，这被称为机器学习。机器学习将是一种自适应的算法。这意味着它能够从过去发生的事情中学习，并能够随着时间的推移对新添加的数据、甚至通过其自身的经验，不断做出更好的分析和模式识别。\n\
  \n有许多关于这在现实世界中如何运作的例子，也有许多公司已经在为满足其需求努力实现这一目标。让我们来看一家处理数字支付的公司。他们主要关心的问题之一是防止潜在和实际欺诈的发生。欺诈案件每年可能给他们带来数百万美元甚至更多损失，能够及早发现这些欺诈并理解如何在它们发生之前预防它们，对于大多数此类金融公司来说可能是救命稻草。\n\
  \n好消息是，这些数字支付公司可以为此类目的使用一些机器学习工具。添加到你的计算机模型中的计算算法将处理我们数字平台上发生的所有交易，并确保我们在任何数据集中都能找到正确的模式。如果它能够以正确的方式学习，该算法将能够指出在该模式中检测到的任何异常及更多情况。\n\
  \n深度学习作为机器学习的子集，以类似的方式运作，但它的执行方式更具体，并包含了特定的机器学习算法来完成任务。当我们谈论深度学习过程时，我们指的是一种机器学习的形式，它将利用分层的人工神经网络来确保机器学习过程得到正确执行。\n\
  \n这些人工神经网络的构建方式非常像人类大脑，其神经元节点像网一样相互连接。这些节点能够相互发送信息，并相互通信，以确保这一过程良好运作。\n\n\n\n\n\
  与某些旨在以线性方式处理手头数据并构建新分析的传统程序不同，深度学习系统自带的层级函数将使我们的机器以及我们在此过程中使用的任何系统能够以更具非线性的方式处理数据。\n\
  \n让我们回到之前那个关于在线支付公司进行反欺诈保护的例子。如果这家公司采用更传统的方法来检测洗钱和欺诈等行为，他们将依赖系统仅捕捉交易金额。这意味着，只有在有大额资金转出时，他们才能发现问题，可能在出现了一个非常奇怪且不符合其所在地逻辑的地理位置时，才会发现几次。我们可以看到这可能会遇到一些麻烦，因为并不是每一宗欺诈或洗钱案件都会涉及大额资金，而且尝试执行这些任务的人为了躲避监测，会倾向于使用较小金额。\n\
  \n但当我们使用深度学习时，我们能够使用一种被视为非线性的技术，这包括交易时间、使用的零售商类型、IP 地址、用户的地理位置以及交易发生的时间，以及公司希望依赖的任何其他特征，以便指出交易何时可能存在欺诈。\n\
  \n### 神经网络流程\n\n这个神经网络过程的第一层是我们将原始数据进行输入。这可能包括交易金额等信息。然后，它被转化为第一层的输出。第二层将使用该输出进行自身处理，并可能包含一些额外信息（如\
  \ IP 地址），并将所有内容作为其结果或输出传递。\n\n然后我们移动到第三层。这一层将获取第二层的所有信息，并包含更多的原始数据（如地理位置），从这里开始使机器的模式更加完善。这将一直持续到程序员为神经网络设置的所有层，直到系统能够确定交易是合法的还是欺诈的。\n\
  \n在此记住，深度学习被认为是人工智能的一个函数，它可以帮助我们模拟人类大脑内部的运作方式，至少在通过处理大量数据以做出重要决策方面是如此。人工智能的深度学习非常有用，因为它可以从数据中学习，无论我们拥有的是有标签的数据，还是我们处理的是既无标签又非结构化的数据。深度学习作为流行机器学习的一个子集，可以帮助几乎我们能想到的任何行业，但在我们讨论的例子中，它对检测欺诈和洗钱等行为特别有帮助。\n\
  \n## 深度学习工作的一个示例\n\n我们需要关注的下一个点是深度学习是如何工作的。真正观察这种技术将如何让我们受益并提供我们想要的结果的最佳方法，是查看它实际运行的一些示例。\n\
  \n如果我们继续使用之前用机器学习处理过的那套欺诈检测系统，可以很快创建一个深度学习的示例。如果机器学习系统能够创建一个围绕用户可以接收或发送的美元金额构建了参数的模型，那么深度学习的方法就可以在机器学习提供的某些结果的基础上进行构建。\n\
  \n该神经网络的每一层都能工作，因为它有助于在之前一层的基础上进行构建。通过这些每一层，我们都能够添加一些重要数据，如 IP 地址、信用评分、零售商和发送者、社交媒体事件、用户，甚至根据数据和机器的需求而产生的信用评分。\n\
  \n深度学习自带的算法训练不仅是为了从交易中创建某些模式，它们还会让我们知道何时出现模式。深度学习的算法经过训练，可以识别欺诈模式。最终层会将信号传递给分析师，直到确定洗钱是否发生。\n\
  \n在所有行业中使用深度学习是可能的，以完成行业需要的任务。例如，某些商业应用可以使用这种技术来帮助解决图像识别问题。一些开源平台，甚至用于药物研究的工具也可以使用它。这些只是深度学习的几个例子。\n\
  \n## 为什么深度学习如此重要？\n\n我们需要探讨的另一个问题是为什么深度学习如此重要？以及为什么这种形式的机器学习能够帮助我们获得惊人的结果？简单来说，深度学习的运行归功于准确性。深度学习的算法可以达到以前无法实现的水平。\n\
  \n这非常有帮助，因为它帮助任何电子产品满足用户的预期，对于依赖安全性的应用（如自动驾驶汽车的发展）至关重要。深度学习的一些最新进展已经提高到在许多情况下，依赖深度学习的系统实际上优于人类人工的操作，例如分类图像中的物体。\n\
  \n\n\n\n\n深度学习模型之所以能够训练，是因为它们依赖于大量的标记数据集以及神经网络的架构。这些元素可以结合在一起直接学习特征，而不需要手动提取特征。\n\
  \n虽然程序员可以关注的几种不同类型的深度神经网络，但其中最好的选择之一，也是数据科学家最可能使用的模型，是卷积神经网络，或 CNN。CNN 将从你添加的数据中学习到的特征进行卷积处理，然后使用\
  \ 2D 卷积层，这使得该架构在处理任何 2D 数据（包括图像等选项）时非常适用。\n\nCNN 有助于消除手动特征提取的必要性。这意味着我们不需要去遍历并识别用于帮助分类图像的特征。CNN\
  \ 将通过直接从图像中提取特征来工作。相关特征不会预先进行训练，因为它们将在网络对你提供的图像集进行训练的过程中，随着过程被学习到。\n\n这听起来可能很复杂，但当我们加入自动化特征提取加入后，它会使事情变得简单。它将确保你通过深度学习创建的模型在各种计算机视觉任务（包括目标分类）中最终变得非常准确。\n\
  \nCNN 能够学习如何检测图像中的各种特征，在此过程中可能会使用成千上万个隐藏层。每一个隐藏层都会增加所学图像特征的复杂性。一个例子是，第一个隐藏层将负责检测图像的边缘，而最后一层（无论有多少层）将检测一些更复杂的形状，这有助于它确定该特定图像中有哪些物体。\n\
  \n## 创建和训练我们的深度学习模型\n\n我们稍后会花更多时间深入探讨这一点，但我们现在先花一点时间看看当我们想要创建并训练我们自己的深度学习模型时会涉及的一些基础知识。有三种相当常用的方法，特别是当我们想要关注包括目标分类在内的任务时：\n\
  \n### 1. 从零训练 (Training from scratch)\n要从零开始训练我们自己的深度网络，我们必须采取几个可能耗时的大步骤。首先，我们需要收集大量数据，特别是大型标记数据集。然后，我们需要为网络设计所需的架构，确保它能够学习在该标记数据集中找到的特征，并能够对其进行建模。\n\
  \n这是一个非常耗时的选项，但当我们想要创建一个全新的应用程序，或者当我们正在处理一个具有大量输出类别的应用程序时，它是很好的选择。当然，由于我们需要的数据量（特别是考虑到是大量的标记数据）以及学习率，这是所有方法中最不常见的。通常，它们需要几周或更长时间才能进行适当的训练，但在某些情况下它们仍然是一个很好的选择。\n\
  \n### 2. 迁移学习 (Transfer learning)\n然后我们可以使用所谓的迁移学习。你看到的大多数深度学习应用都是基于迁移学习方法的。这个过程让我们在一个预训练模型上工作，然后对某些部分进行微调。\n\
  \n为了使这种方法生效，我们选择一个已经存在的网络，例如 `GoogLeNet` 或 `AlexNet`，然后输入包含之前未知类别的新数据。在对网络进行必要的更改和调整后，我们现在能够执行新任务，例如仅对狗或猫进行分类，而不是一次关注\
  \ 1000 种不同的物体。\n\n这种深度学习模型会有几个优点，但其中一个优点是它完成任务所需的数据少得多。我们可以将处理范围限制在几千张图像上，而不是像网络最初可能那样关注数百万张图像。这使得计算成本和时间下降，通常取决于情况，在几分钟内就能完成模型。\n\
  \n这种学习要求我们拥有一个预存在网络内部的接口，以便以更具针对性的方式进行修改和增强，以处理你设定的新任务。`MATLAB` 拥有你所需的所有函数和工具，以确保你在迁移学习中获得最佳结果。\n\
  \n### 3. 特征提取 (Feature extraction)\n我们在创建深度学习模型时可以使用的第三种选择是特征提取。这是一种稍微不那么常见的方法，因为它更多是一种可以与深度学习结合的专门方法，即使用我们的网络作为特征提取器。考虑到我们所有的层都负责从图像中学习某些特征，我们可以在训练过程中的任何时候从网络中提取这些特征。这些特征随后可以被用于各种不同的模型中，包括\
  \ `SVM` 或支持向量机。\n\n\n\n\n\n数据分析可以通过许多不同的方式进行。但由于这些分析大部分是针对大规模数据集（也称为大数据）进行的，人类很难手动处理所有这些信息并了解其中的内容，尤其是在需要及时处理的情况下。这正是深度学习大显身手的地方，它可以帮助我们在短时间内完成优质分析。基于此，让我们深入探讨一下，并仔细地观察数据分析的本质。\n\
  \n## 什么是数据分析？\n\n世界上存在着海量的数据。公司喜欢花时间从客户处、社交媒体账号以及行业内的其他来源收集信息和数据。如果能正确使用这些数据，它们将帮助他们获得真正的竞争优势，并确保在提供良好客户服务的同时，发布正确的产品。\n\
  \n问题在于，在你收集完数据后，你必须能够处理所有这些数据。这并非易事。由于数据量通常非常庞大，要弄清楚如何处理它们以及数据中包含哪些信息将是一项挑战。收集了所有需要的数据却不进行后续分析，将是极大的浪费，你不如节省时间，根本不要这么做。但如果你已经收集了数据，我们需要能够审阅并分析这些数据，以便做出更明智的业务决策。这正是我们在本指南中将花费精力的内容。\n\
  \n数据分析是公司的一种实践，他们获取原始数据并对其排序和组织，使我们能够查看并提取其中所有的有用信息以供使用。组织数据并思考数据的过程，是理解数据包含什么、不包含什么的关键。公司可能会为你提供大量数据，但如果你无法审阅并看到其中包含哪些信息，那么这些数据就无法对你产生帮助，你将不知道数据中到底有什么，以及什么不包含在。\n\
  \n现在，当我们进行数据分析时，可以加入许多方法来处理分析，并确保获得某些结果。然而，无论你选择哪种方法，在操作数据时都必须保持谨慎。我们不希望将自己的意图和结论强加于数据上。我们希望看到从所有数据中发现的真实见解和信息。\n\
  \n是的，你在执行这一过程中会带着一些想要获得答案的问题，可能还对将在数据中发现的内容持有某种假设。但如果你不留心，将不会对数据中发现的所有信息保持开放的心态，从而错失业务所需的宝贵见解和预测。如果我们从一开始就以错误的方式进行分析，那么我们能赋予这些数据多少价值或意义呢？我们这里的全部目标是发现信息中的内容，并学习数据实际上能告诉我们什么，而在这个过程中不带入自己的偏见。\n\
  \n如果你忽略这条建议，仅仅带着自己的结论直接投入，而不关注数据实际上在试图告诉你什么，那么你还现在就放弃吧。你会恰好找到你想要的东西，但这并不意味着我们以正确的方式查看了信息。而且这通常会引导你和你的业务走向错误的道路。\n\
  \n我们首先需要关注的是数据分析的本质。当我们观察数据分析（Data Analytics）时，看到它是一门用于分析大量原始数据的科学，帮助公司对这些信息做出明智且充分的结论和决策。数据分析相关的许多技术和过程已经自动化为机械流程和算法，这些算法能够处理原始数据，使其更便于人类从中学习。\n\
  \n与让人手动审阅和阅读这些信息相比，这个过程要容易得多，速度也快得多。这使得公司更容易利用他们一直收集的所有大数据。你可以拥有任何想要的大数据，并以你喜欢的方式存储它们，但如果这些数据从未被分析和阅读，你会发现它们是毫无用的。\n\
  \n我们可使用的技术非常有帮助，因为它们揭示了否则就会流失的趋势。一旦公司能够使用深度学习模型来帮助进行良好的数据分析，他们就能看到其中涉及的指标。更进一步，我们必须理解“数据分析”是一个非常广泛的术语，在某些时刻它可以涵盖许多不同类型的数据分析。如果你想进一步发展业务，你收集并可能存储的任何类型的信息都可以采用这些技术。\n\
  \n## 行业示例\n\n例如，我们可能会发现许多制造公司正通过数据分析来帮助其运行和表现更好。例如，他们可能会记录各种机器的运行时间、停机时间以及工作队列，或者系统执行特定项目所需的时间。然后他们可以分析所有这些信息和数据，以便更容易规划工作负载，确保每台机器的运行都接近其容量。\n\
  \n数据分析可以帮助我们确保生产环节不再有瓶颈，但这并不是良好数据分析唯一发挥的地方。例如，我们可以看到游戏公司通常会利用某种数据分析来确保他们能够按照固定的日程奖励玩家，让大多数用户更有可能留在游戏中，而不是放弃并感到沮丧。\n\
  \n数据分析如何运作的另一个例子（特别是配合正确的深度学习模型）是在内容公司领域。其中许多公司已经依靠数据分析来留住客户点击、重新组织或观看内容。他们获得的点击和观看越多，就能从网站上的广告等赚取更多钱。\n\
  \n现在，执行数据分析的步骤可能非常复杂，需要花费时间来完成。但我们将专注于每一步中的基础知识，以便我们对这一过程如何运作有一个良好的整体，以及为什么许多企业在对自己的数据进行数据分析时能够看到如此出色的结果。\n\
  \n\n\n\n\n## 数据分析流程\n\n### 初始步骤\n\n我们首先需要要做的任务是确定我们对数据提出的要求，或者我们希望如何对数据进行分组。数据可以按照你喜欢的任何方式进行分类，包括按性别、收入、人口统计数据和年龄。数据值可以是数值型的，我们也可以按类别进行划分。了解你的业务问题以及你希望通过这些数据分析解决什么，可以让你更准确地知道数据所需的需求究竟是什么。\n\
  \n### 收集\n我们在这里需要关注的下一个步骤是收集数据。没有任何数据，我们就无法创建所需的深度学习模型，并将陷入完全无法进行分析的困境。我们可以从各种来源收集数据，包括计算机、在线资源、摄像头、人员渠道以及环境来源。\n\
  \n### 数据组织\n一旦我们收集了想要使用的数据，就可以通过几个步骤来组织这些数据了。这使得在分析数据时变得更容易，且不会出现错误或疏漏。组织工作可能花费一些时间，你所使用的方法将取决于数据的类型以及你试图学习的内容。\n\
  \n### 数据清洗\n在组织数据的同时，我们还需要花一些时间对其进行清洗。这意味着我们需要对数据进行处理，然后进行检查以确保没有重复或错误，并确保数据在任何方面都是完备。这是一个很好的步骤，因为它在你尝试迁移数据并对其进行分析之前，它会修复数据集中的任何错误。\n\
  \n## 高级分析\n\n数据分析的应用将涉及几个不同的步骤，而不仅仅是分析你收集的数据。特别是在一些更高级的分析项目中，大部分所需的工作将在前期完成，例如数据的收集、整合和准备工作。然后，我们就可以进入开发、测试和审查分析模型的阶段，以确保它们产生的结果是准确的。\n\
  \n分析过程将从最开始开始，即收集数据。在这个阶段，数据科学家及其团队将识别出为了某个特定的分析应用需要寻找和收集的信息，然后他们将继续独立工作或与某些 IT\
  \ 人员和数据工程师协作，汇总所有收集到的数据以供人类使用。\n\n来自不同来源的数据有时可以在数据集成例程的帮助下进行合并，转换为通用格式，然后加载到所谓的分析系统中。有许多此类系统供你选择，包括数据仓库、`NoSQL`\
  \ 数据库和 `Hadoop` 集群。\n\n在某些其他情况下，收集过程会略有不同。在这种情况下，收集过程可能包括从流入存储器的原始数据流中提取出相关的子集，然后将其移动到系统的第二个且独立的分区中。这样做是为了对信息进行分析，而你所执行的任何工作都不会影响整个数据集。\n\
  \n## 质量保证\n\n一旦我们收集了所需的数据并将其就位，我们需要处理的下一个步骤就是发现并修复数据中的任何质量问题。我们希望在执行过程中，清理掉任何可能影响我们应用程序准确性的质量问题。这可以包括许多不同的过程，如数据清洗和数据剖析，以确保我们数据集中的信息尽可能一致，并消除重复条目和错误。\n\
  \n除了我们目前所做的工作之外，还有一些我们需要关注的额外数据准备工作。这项工作非常重要，因为它将操纵并组织你计划在分析中使用的数据。你应该加入一些数据治理策略，以帮助数据符合公司的标准，并确保所有工作都按照行业标准进行。\n\
  \n## 建模与测试\n\n当你到达这一点时，数据分析的流程将正式开始。数据科学家将使用一些预测建模工具或分析软件来构建分析模型。我们还可以还可以关注一些编程语言，包括\
  \ `SQL`、`R`、`Scala` 和 `Python`，以完成工作。模型最初将在部分数据集上运行，因为这是方法之一。\n\n当然，第一次测试的准确性不会像你预期的那样，这意味着数据科学家必须根据需要修改模型。这个过程被称为模型训练。\n\
  \n## 生产与沟通\n\n最后，我们将在所谓的“生产环境”中运行模型。这意味着它将在完整数据集上运行。某些情况下，每当我们更新数据时，这种运行就会持续进行。\n\
  \n在某些情况下，分析的应用可以被设置为能够触发业务操作的方式。例如，我们可能会在金融服务公司使用的某些股票交易中看到这种应用。否则，这个数据分析流程的最后一步是将你使用的分析模型生成的的结果传给业务高管和其他终端用户，以帮助他们做出决策。\n\
  \n你可以使用几种不同的方法来实现这一点，但这里最常用的技术是数据可视化。这意味着数据科学家以及他们所工作的任何团队将从模型中提取收集的信息，然后将其转换为图表或其他类型的信息图。这样做是为了更容易理解研究结果。\n\
  \n## 统计方法\n\n我们在这里还需要考虑的最后一点是，我们必须考虑数据分析中可用的各种统计方法，并决定如何使用每种方法。有一些方法非常适合完成这项工作，但通常取决于我们想通过这些手段实现什么。但首先，我们需要查看它们，以及它们将如何帮助我们获得想要的结果。你可能需要在项目中考虑的一些最佳统计方法包括：\n\
  \n1. 通用线性模型。它是线性回归的推广，适用于具有两个或多个因变量的情况。\n2. 广义线性模型。这个模型听起来和另一个模型相似，但它有所不同。它是一种扩展，当你的因变量更加离散时工作效果最好。\n\
  3. 结构方程模型。这种特定的建模适用于你想评估从显性变量中测出的某些潜在结构的情况。\n4. 项目反应理论：这类模型将将用于帮助我们从二元测量的变量中评估仅某一个潜变量。\n\
  \n\n\n\n\n根据你所呈现的信息类型以及你在此过程中的最终目标，有几种不同的方法可以采用，以帮助完成数据分析。你可以选择的一些最常用的方法（再次强调，请根据你的数据以及你试图从这些信息中弄出的结果来帮助做出决策）包括以下：\n\
  \n1. 跨文化分析\n2. 内容分析\n3. 扎根理论分析\n4. 话语分析\n5. 解释学分析\n6. 恒定比较分析\n7. 现象学分析\n8. 叙事分析\n\
  9. 民族志分析\n\n## 为什么数据分析如此重要？\n\n既然我们在这里，我们需要花几分钟讨论一下为什么数据分析如此重要，以及为什么这么多企业都在加入其中，希望在此过程中看到一些改进。数据分析之所以如此重要，是因为它可以帮助企业优化其整体表现。\n\
  \n当公司能够将数据分析落实到业务模型中时，意味着他们能够减少日常运营成本。发生这种情况的原因是因为分析将帮助他们识别最佳且最高效的业务模式，而且由于他们能够存储大量数据，帮助他们及时完成这一整个过程。\n\
  \n使用这种数据分析的另一个益处，以及它对对很多公司非常重要的原因，是公司可以利用这一过程来做出最佳业务决策。这些业务决策不再需要依赖其他公司的做法，也不需要依赖关键决策者的直觉。相反，它们依赖于收集到的数据所提供的事实和洞察。\n\
  \n许多公司还喜欢开展数据分析工作，因为它可以帮助他们更好地了解并服务客户。数据分析可以帮助我们分析客户趋势和满意度，从而帮助公司提供新的、更好的产品。\n\n\
  ## 可用的数据分析类型\n\n当我们观察数据分析过程时，会发现公司可以选择不同的类型来完成工作并学习他们收集的数据中隐藏的信息。为了简单起见，我们将关注许多公司依赖的四种基础数据分析类型。\n\
  \n## 描述性分析\n首先，我们有描述性分析。这种数据分析类型向我们描述在特定时间内发生了什么。当我们想查看本月的销售额与上个月相比是否有增长时，可以使用它。或者我们可以将其用于社交媒体页面，以查看帖子的访问量是增加、减少还是保持不变。\n\
  \n## 诊断性分析\n然后我们可以合作的第二种数据分析类型是诊断性分析。这种类型有点不同，因为它更关注事情发生的“为什么”，而不是“是什么”。这涉及到一些多样化的数据输入，数据科学家需要带着准备好的假设进入。例如，数据科学家可能会关注上次发行的营销活动是否对销售产生了积极或负面的影响。\n\
  \n## 预测性分析\n我们还可以利用被称为预测性分析的内容。这种类型用于根据历史数据来理解未来可能发生的情况。\n\n## 规范性分析\n最后，我们可以关注的第四种数据分析类型被称为规范性分析（建议分析）。这种分析类型可以根据数据建议行动方案。\n\
  \n## 真的有人在使用数据科学吗？\n\n在涉及到数据科学和数据分析时，很多人提出的另一个问题是，是否有其他公司或其他行业正在使用这种技术。有时，考虑到所有的工作、算法和各种程序，使用数据科学和数据分析似乎是一项难以处理的任务。但你可能会惊讶地发现，有很多行业和公司已经在利用数据科学以及随而来的数据分析，来帮助他们真正获得竞争优势。\n\
  \n\n\n\n\n## 医疗健康数据分析\n\n这是我们在医疗健康行业中看到大量数据分析的地方。该行业有许多领域可以利用良好的数据分析，特别是当它与机器学习和深度学习结合时，可以帮助医生和其他医疗专业人员更好地完成工作。它可以帮助医生更快地审阅图像并诊断患者，可以帮助跟进患者情况并确保他们获得正确的治疗，可以用于病房内监测患者并在出现问题时警报护理人员，甚至在无人手处理此类工作时可以担任接待员或其他类似角色的工作。\n\
  \n最后，零售行业能够以多种方式从`data science`中获益。这是因为我们随时间收集的数据被进行`analyzed`，以识别趋势并向客户推荐产品。\n\n\
  ## 零售行业中的数据科学\n\n正如我们在这里看到的，有很多可以做的事情，`data analysis`可以用于跟上市场需求。需要注意的是，收集到的`data`被用于业务做出更明明的决策。\n\
  \n## 深度学习库\n\n到此为止，我们已经讨论了`deep learning`，现在是时候看看我们可以使用的库了。我们有很多选项可以选择，而且它们都用于`machine\
  \ learning`。\n\n## TensorFlow\n\n与`Tensorano`相比，我们看到的`TensorFlow`最大的优势之一是它能够与`distributed\
  \ computing`协同工作。当我们想要在多个`GPUs`上训练网络时，这一点尤为真实。\n\n`TensorFlow`最初由`Google Brain`团队开发，是一个可以用于`machine\
  \ learning`的开源库。`TensorFlow`的关键特性之一是它使用`flow graph`来表示计算。这允许它优化模型在不同硬件上的执行情况。`TensorFlow`也被广泛用于`numerical\
  \ computation`。\n\n## Keras\n\n许多程序员发现，在涉及`deep learning`时，他们喜欢使用`Keras`。`Keras`被认为比其他某些库更简约的`neural\
  \ network`库。这个库可以使用`TensorFlow`或`Tensorano`作为后端，因此你可以选择最适合你需求的一个。`Keras`的主要目标是让你能够快速地对模型进行实验，并尽可能快地从想法变为结果。\n\
  \n`Keras`包含了一些用于`optimizers`、`normalization`甚至`activation layers`的顶级算法。如果你的流程包含这些内容，那么它是一个非常棒的型库。此外，如果你想花些时间开发自己的`CNNs`，`Keras`是一个非常很棒的选择。`Keras`的设置重点放在了这类神经网络上，这在你处理`computer\
  \ vision`时非常有价值。`Keras`还允许我们构建`sequence-based networks`和`graph-based networks`。\n\
  \n\n\n\n如果你想尽可能快地训练你的网络，使用像 `MXNet` 这样的库可能是更好的选择。但如果你正在寻找调整超参数的方法，你可能想利用 `Keras`\
  \ 的功能来设置四个独立的实验，然后评估这些实验结果之间的相似性或差异。\n\n### Sklearn-Theano\n\n在进行深度学习工作时，会有某些你想要端到端地训练\
  \ `CNN` 的时候。但某些时候并不需要这样做。相反，在不需要的时候，你可以将 `CNN` 视为特征提取器。这在你可能会遇到的某些情况下非常有用，在这些情况下你没有足够的数据从头开始训练\
  \ `CNN`。因此，在这种情况下，只需将你的输入图像通过一个流行的预训练架构即可，该架构可以包括 `VGGNet`、`AlexNet` 和 `OverFeat`\
  \ 等选项。然后你就可以使用这些预训练选项，并从你想要的层（通常是 `FC` 层）中提取特征。\n\n总而言之，这正是你使用这类库时完全希望发生的情况。你无法用它从头开始训练模型，所以如果这是你的目标，那么你就需要寻找其他专注于此的库。然而，当你想要一个可以评估特定问题是否适用于深度学习和其他流程的库时，它是最好的选择之一。\n\
  \n### Nolearn\n\n一个适合你工作的优秀库是 `nolearn` 库。这是一个帮助进行初始 GPU 实验的好工具，特别是在 `MacBook Pro`\
  \ 上。它也是一个帮助在 `Amazon EC2` GPU 实例上执行某些深度学习的优秀库。\n\n虽然 `Keras` 将 `TensorFlow` 和 `Theano`\
  \ 封装成更用户友好的 API，但你会发现 `nolearn` 库也能做到同样，只不过它是通过 `Lasagna` 库来实现的。此外，我们在 `nolearn`\
  \ 中找到的所有代码都与 `Scikit-Learn` 兼容，这对于你想要工作的很多项目来说是一个巨大的加分。\n\n### Digits\n\n这个库需要注意的第一点是，它不被认为是真正的深度学习库。尽管它是用\
  \ `Python` 编写，并且全称是“深度学习 GPU 训练系统”。这是因为该库更是一个 Web 应用程序，可以用于训练通过 `Caffe` 帮助创建的一些深度学习模型。你可以处理一下源代码来使用\
  \ `Caffe` 以外的后端，但在此过程中这需要大量的额外工作。由于 `Caffe` 库在它所擅长的领域非常好，并且可以帮助你完成的许多深度学习任务，因此真的不值得你花费时间。\n\
  \n如果你过去花过时间使用过 `Caffe` 库，你已经证明了定义你的 `.prototxt` 文件、生成图像的数据集、运行网络以及通过提供的终端照看网络训练是多么枯燥。这里的好消息是，`DIGITS`\
  \ 库旨在解决所有这些问题，允许你仅通过浏览器就能完成许多任务（如果不是全部的话）。所以，它本身可能不是深度学习库，当你与 `Caffe` 库作斗时，它确实派上了用场。\n\
  \n除了上述所有优点，用户交互的界面被认为是完美的。这是因为它可以为我们提供有价值的统计和图表，帮助你更有效地训练模型。你还可以轻松地可视化网络的一些激活层，以根据需要帮助各种输入。\n\
  \n最后，该库可能的另一个益处是，如果你有一张特定的图像想要测试，你有几种方法可以完成它。第一种选择是将图像上传到 `DIGITS` 服务器，或者你可以输入图像的\
  \ URL，然后你用 `Caffe` 创建的模型将能够自动对图像进行分类并在浏览器中显示你想要的结果。\n\n`Python` 是现有的帮助深度学习、机器学习甚至是人工智能主题（它涵盖了另外两个概念）任务的最佳编程语言之一。还有其他语言可以处理我们一直说的深度学习，但没有哪种能像\
  \ `Python` 那样高效、强大、选项更多，或者像这样为初学者设计。\n\n这正是为什么我们把注意力集中在 `Python` 语言以及我们能够选择的帮助处理各种深度学习任务的一些优秀库上。这些库中的每一个都可以加入你的项目，并为我们提供一组独特的函数和技能来完成工作。查看一下这些库，看看哪一个最适合你的数据分析，并在完成深度学习的同时为你提供极佳的洞察。\n\
  \n## 第 4 章节：伴随神经网络的数学\n\n我们需要花时间查看的下一个主题是神经网络的概念。如果你不能处理这些神经网络，你的深度学习工作将无法取得进展，而且你还可以创建和使用几种不同类型的网络。所以，让我们直接深入，学习更多关于这些可以帮助我们构建深度学习模型的优秀神经网络。\n\
  \n### 神经网络\n\n我们要查看的第一类网络是“普通”类型的神经网络。如果你不能处理这些神经网络，你的深度学习工作将无法取得进展。这些神经网络将属于无监督机器学习的类别，因为它们可以独立工作并为我们提供优秀的结果。神经网络是机器学习中一个很好的选择，因为它们被设计用于捕捉数据中的任何模式或趋势。这可以通过多个阶段来实现，而且这种方式比人类手动处理工作要快得多、有效得多。\n\
  \n当我们处理神经网络时，我们关注的每一层都负责在该层中花费时间，查看它们是否能够在图像或数据内部找到模式或趋势。一旦它找到了趋势或模式，它就会开始进入下一层的过程。这个过程将持续进行，网络发现新的模式或趋势，然后进入下一个阶段，直到到达一个不再能发现更多趋势或模式的地方。\n\
  \n这个过程可能会产生许多不同的层，一层又一层地叠在其他之上，直到你能够看到全部的内容。\n\n但在继续之前，我们必须记住，在这一点上会发生一些变化，这取决于你如何设置程序运行。\n\
  \n\n\n\n之所以发生这种情况，是因为程序正在依赖人工智能，更具体地说，是依赖深度学习，以便在它看到的模式与物体之间建立这种强大的关联。请记住，算法在这个过程中能够提供正确答案的次数越多，当你下次使用它时，它的效率就会越高。神经元会变得越来越强大，你会发现答案出现得更快，而且整体准确性也更高。\n\
  \n现在，如果你过去没有接触过机器学习和深度学习，这些神经网络看起来似乎是不可能亲眼看到发生的。但对这些算法进行更仔细的检查可以帮助我们更好地理解它们是如何运作的，以及为什么它们对这个过程如此重要。对于我们将处理的这个例子，假设我们的目标是创建一个程序，该程序可以接收我们展示的图像，然后通过不同的层，程序能够识别出该照片中的图像实际上是一辆汽车。\n\
  \n如果我们以正确的方式创建了神经网络，那么它就能查看我们使用的图像，并给出一个良好的预测，认为图片里有一辆汽车。然后，程序将根据它已经知道的汽车的任何特征和部分得出此预测。这可能包括颜色、车牌、车门的位置、大灯所在的位置等。\n\
  \n当我们观察使用一些传统方法进行编码时（无论是否是 Python 方法），这是你可能可以做到的，但它花费的时间太长，不是工作的最佳选择。这可能需要大量的编码，并且真的会搞乱整个过程。但有了这些神经网络，你将能够写出代码来完成这种网络。\n\
  \n为了让神经网络算法按照你想要的方式工作，你必须为系统提供一张良好且清晰的汽车图像。然后网络可以查看该照片，并开始处理它查看图像时所需的某些层。因此，系统将通过第一层，第一层可能包括汽车的外边缘等。完成这一步后，网络将继续从一层到另一层，经过所需的所有层数来完成整个过程并为我们提供一个良好的预测。有时这只需要几层，但这个程序经过的层数越多，它最终提供准确预测的概率就越大。\n\
  \n取决于你想要处理的情况或项目，都有添加许多不同层的潜力。关于这方面的好消息是，神经网络发现的细节越多、层数越多，它就能越准确地预测它面前的物体是什么，甚至是它正在看的是哪种汽车。\n\
  \n当神经网络经历这个过程，并在识别汽车型号时显示出准确的结果时，它实际上能够从教训中学习，类似于我们在人脑中看到的情况。神经网络的设置方式可以记住它在汽车型号中看到的模式和不同特征，并存储这些信息，以便在以后再次遇到另一辆相同的汽车时再次使用。因此，如果你在稍后的时间展示了另一张带有相同汽车型号的图像，神经网络就可以很快地对那张图像做出预测。\n\
  \n你有几个选项可以选择用于这种类型的系统，但请记住，每当你创建一个神经网络时，它一次只能处理一个任务。例如，你可以创建一个处理人脸识别的神经网络，以及创建一个可以在搜索引擎中找到我们需要的图片的神经网络，但你不能让一个神经网络完成你想要的所有所有任务。你可能需要将其拆分并制作几个网络来实现这一目标。\n\
  \n例如，在创建可以识别人脸的软件时，神经网络通常有很大的用处。创建这种网络所需的所有信息都无法提前获得，因此神经网络将在此过程中不断学习，并在识别视频或图像中看到的面部方面变得越来越好。当你想让它识别不同的动物，或识别其他图像或视频中的特定物品时，这种方法也是有效的。\n\
  \n为了在这里帮助我们，我们需要查看一下这种机器学习模型可能带来的的一些优势。许多程序员喜欢的这种模型的优势之一是，你可以使用这种算法工作，而不需要对算法的统计数据进行完全控制。即使你不是一直处理统计数据，或者你并不熟悉如何使用它们，你也会发现这些网络可以在没有这些统计数据的情况下使用；但如果信息中存在任何关系（无论它有多复杂），当你运行网络时它就会显示出来。\n\
  \n这种方法的用处在于，可以找到数据内部的关系，无论变量是依赖的还是独立的，即使你处理的是不遵循线性路径的变量。对于刚刚开始学习机器学习的人来说，这是一个极好的消息，因为它确保了我们能够更好地理解数据之间的相互关系，以及你想要处理的一些见解，无论你正在处理的是什么变量。\n\
  \n考虑到这一点，我们必须记住，仍然会有我们不使用神经网络的时候，它不会是深度学习中我们想要处理的每一个问题的解决方案。这些神经网络算法带来的一个较大问题是，以及一些程序员决定不使用它的原因，是计算成本会很高。\n\
  \n\n\n\n开始研究这些循环神经网络（或 `RNN`）的一种好方法是观察人脑。当我们这样做时，我们知道可以合理地理解：我们的思维过程或理解并不会每秒都重新开始。我们能够保留听到的和学到的信息，并在此基础上进行构建。这是我们从小时候就开始做的事情。我们并不是仅仅看到字母\
  \ `A` 然后在五秒后就忘记了它。我们将其作为字母表的开头，并以此为基础构建到 `B`、`C` 等。我们始终在新的知识上进行构建，无论这些是源于童年，还是我们刚刚学到的东西。\n\
  \n随着我们学习本指南中的其他部分，你将开始看到每个单词是如何根据你对前一页中写写单词的理解程度来呈现的。你的大脑不会在看到一个单词后立即将其丢弃，然后从头重新开始思考过程。这里的观点是，我们的思想基本上能够保持某种一致性和持续性，这也是让它们工作时如此强大的原因之一。\n\
  \n我们在上一节中讨论的传统神经网络无法做到这种工作。在很多情况下，这可能是一个更大的短板。例如，如果你正在处理一个需要分类电影中不同部分发生的事件类型的项目，那么传统神经网络对你的帮助不很大，因为它无法对电影中早些时候事件进行推理。程序内部并没有出现那样的通信或能力。\n\
  \n尽管传统神经网络在处理这类任务及其他任务时可能会力不从心，但好消息是，我们可以依靠循环神经网络来帮助我们解决机器学习中的这些问题和项目。这类网络带有循环，它会允许其学到的信息得以持续。在这种方法中，循环允许信息从网络的一个部分传递，然后移动到代码的下一个部分。循环神经网络的概念类似于拥有多个相同网络的副本，并在过程中将每条消息都传递给后继者。\n\
  \n这种这种网络具有的链式特性将会在我们学习过程中，揭示这些网络是如何与序列和列表紧密联系的。这些将是神经网络用于处理所有此类数据时的自然架构。而且在深度学习中，这些网络在很多时候都会被用到。\n\
  \n事实上，在过去的几年里，将这些循环神经网络应用于各种项目已经取得了巨大成功，这种成功在未来很可能会持续。循环神经网络可以使用的一些当前示例包括语音识别、语言建模、翻译和图像描述项目。\n\
  \n在处理这些神经网络时，一个非常明显的局限性是，随之而来的 `API` 在整个过程中会包含许多限制。`API` 只能接收一个固定大小的向量作为输入，然后只能产生固定大小的向量作为输出，这在需要执行操作时可能会很困手。\n\
  \n### 循环神经网络的应用\n\n正如我们之前讨论过的，在 Python 帮助深度学习方面，有很多不同的库和选项可供你使用。我们之前讨论过其中几个，但现在是时候深入研究一些与深度学习工作的最佳\
  \ Python 库了，看看它们是如何工作的，以及它们能为你提供什么。\n\n![神经网络架构](https://cdn-images.medium.com/media/max:1500/1*00000000000000000000)\
  \ - *注：为了图像上下文保留了占位符路径。*\n\n让我们来看看这些每一个是如何工作的：\n\n1. **图像分类**：第一个是原始模式，完全不使用 `RNN`\
  \ 的模式。它包含固定的输入和固定的输出。这也称为图像分类。\n2. **图像描述**：序列输出是第二部分。这是图像描述，能够接收一张图像并为你提供单词输出。\n\
  3. **情感分析**：序列输入：这是第三部分。它是情感分析，向我们展示给定的句子并确保将其分类为负面或正面。\n4. **机器翻译**：序列输出和序列输出。这在第四个框中。当\
  \ `RNN` 能够读出一句英文句子，然后获取该信息并为你提供法语输出时。\n5. **视频分类**：最后，最后一个框是同步的序列输入和输出。这里的视频分类将帮助我们标记视频中出现的每一帧。\n\
  \n注意，在这些每一项中，我们对必须预先指定的序列长度都没有施加任何限制。这是因为用绿色显示的循环变换是固定的，我们可以根据意愿将其应用多次。\n\n这些神经网络对你想要用\
  \ Python 语言编写的任何代码都是极佳补充，而且它们绝对是深度学习领域我们能够处理的内容的很好的范例。深度学习可以引导我们许多不同的项目，其中许多项目在过去我们可能认为是不可能的。但通过一些出色的神经网络包括循环神经网络和传统神经网络，我们能够实现这些程序，搜索大量信息，并获得我们正在寻找的预测和见解。\n\
  \n\n\n\n## TensorFlow\n\n我们将要介绍的第一个库被称为 TensorFlow。这个库需要一些时间，因为使用这个库可以实现的操作的复杂性会让许多人在刚开始工作时感到畏畏。但它是一个非常棒的库，可以帮助处理线性代数和向量微积分等问题。该库中出现的\
  \ `Tensors` 能够为我们提供多维数据数组，但在我们深入并真正理解这些张量究竟是什么之前，很可能需要更多的介绍。所以，让我们开始吧：\n\nTensorFlow\
  \ 是由 Google 提供的的一种框架，当你准备好创建一些深度学习模型时，就会使用它。这个 TensorFlow 将依赖数据流图进行数值计算。它已经让机器学习变得比以往时候都更加简单。\n\
  \n它让获取数据、训练你想要使用的某些机器学习模型、做出预测，甚至修改你看到的某些未来结果的过程变得更加简单。由于这些内容在机器学习中都非常重要，因此学习如何使用\
  \ TensorFlow 是非常重要的。\n\n这是一个由 Google 的 Brain 团队开发的库，用于在大规模进行机器学习时。TensorFlow 将机器学习和深度学习的算法及模型结合在一起，并通过一个通用的喻让它们变得有用得多。正如我们之前所说的，TensorFlow\
  \ 将使用 `Python`，并为其用户提供一个前端 API，当你想要构建应用程序时可以使用它，而应用程序将在高性能的 `C++` 中执行。\n\n我们将发现，当我们不仅想要构建，还要训练和运行我们的深度神经网络时，TensorFlow\
  \ 通常是所使用的那个库。当我们想要处理图像识别、手写数字分类、自然语言处理、循环神经网络等许多过程时，这些神经网络会非常出色。使用 TensorFlow 语言我们能够做很多事情，当它与某些扩展结合在一起时，你所实现的深度学习将是惊叹的。\n\
  \nTensorFlow 与其他的一些深度学习库一起，是你完成工作的极佳选择。无论你想处理深度神经网络还是另一种形式的深度学习来处理你的数据并帮助你发现内部的洞察和预测，或者你正在寻找深度学习的其他用途来帮助你的业务，TensorFlow\
  \ 都是现有的帮助你完成工作的最佳 `Python` 库之一。\n\n### 平向量\n\n在开始讨论之前，我们需要看看一种被称为向量（vector）的东西。TensorFlow\
  \ 中的向量将是一种特殊的矩阵，它可以存储一个矩形数字数组以帮助深度学习。因为这些向量是数字的有序集合，它们将以列矩阵的形式出现。在大多数情况下，这些向量将带有一列，以及完成过程所需的行。考虑这些向量的一种好方法是将它们看作具有某种行为方向的标量级（scalar\
  \ magnitude）。\n\n记住，标量的一个很好的例子是 `60 m/s` 或 `5 meters`，而向量则更像 `5 meters north`（向北\
  \ 5 米）。这两者之间的区别在于，向量将告诉我们去向哪里，而不只是距离，但标量不会这样做，它只关注距离。尽管如此，这些示例与我们一直以来关注的一些其他机器学习和深度学习项目中看到的可能有所不同，这在目前是相当正常的。\n\
  \n但请记住，向量中给出的方向只是相对的。这意味着方向必须相对于你添加到整个结构中的某个参考点进行测量。我们将以弧度或角度为单位显示这种方向，以便于更容易操作。为了让这在大多数情况下生效，你必须假设方向是正的，并且它将朝着我们作为参考点的方向的逆时针方向旋转。\n\
  \n然而，当我们从更具视觉化的角度来看待时，我们必须确保用箭头表示向量。这意味着你必须将这些向量视为同时具有长度和方向的箭头。你需要遵循的方向可以通过观察箭头头部指示，但我们想要遵循的长度或距离在看到箭头真实有多长时将得到最好的指示。\n\
  \n所以，这将把我们带到了一个十字路口，我们需要关注这些平面向量（plane vectors）究竟是什么。在张量方面，平面向量的设置非常简单。它们可能与我们之前讨论的普通向量相似，唯一的区别是它们将出现在所谓的向量空间（vector\
  \ space）中。\n\n这起初可能有点困惑，但为了让我们更好地理解它的含义，我们需要举例例子说明它是如何运作的。假设在这个例子中，我们正在处理一个 `2 X1`\
  \ 的向量。这意味着该向量属于一组每两个成对的实数。用另一种可能更容易解释的方式来说，它们都是二维空间（two-space）的一部分。当这种情况发生时，你可以在坐标系上表示这些向量，就像我们熟悉的平面上的\
  \ `x` 和 `y`，以及我们讨论过的射线。\n\n当我们在坐标平面上工作时，我们必须从位于原点（即点 `(0,0)`）端点的向量开始，或者你通过查看第一行推导出我们的\
  \ `x` 坐标。此时我们也可以在第二行中找到我们的坐标。\n\n关于这一点，我们必须记住，向量中给出的标准位置并不是一直保持不变的，也不是我们必须维持的。向量可以移动，通常在同一平面内平行移动，我们不需要担心因此产生的任何变化。\n\
  \n### TensorFlow 库的基础知识\n\n在准备好一些背景信息并对随该库的张量和向量有了更好的理解之后，现在是时候进入另一个轨道，学习一些关于 TensorFlow\
  \ 的基础知识了。我们将从查看设置此库并准备好使用的某些步骤开始，从一些基础知识开始，让你更加熟悉。\n\n\n\n\n\n对于我们在这里正在观察的一些基础知识，我们希望将重点放在第二个选项上。这很重要，因为它不仅能帮助我们在使用\
  \ TensorFlow 库时有一个良好的开始，还能在过程中帮助我们理解如何处理深度学习。在开始讨论我们能够使用 TensorFlow 和深度学习所做的一些酷炫功能之前（这些我们将在下一节中讨论），我们首先需要进入几个主题来帮助自己。\n\
  \n要进行任何基础操作，我们首先需要像以前一样，通过别名 `TF` 导入 TensorFlow 库。然后我们将能够初始化两个作为常量的变量。接着，你需要使用 `constant()`\
  \ 函数传递一个包含四个数字的数组。\n\n你也可以直接遍历并传递一个整数。但在大多数情况下，处理并尝试传递数组会更简单，也最符合你的需求。张量（Tensors）通常与数组有关，这就是为什么使用它们更好。\n\
  \n一旦你输入了想要使用的整数（或更有可能是数组），现在就是使用 `multiply()` 函数将这些变量相乘的时刻了。将结果存储在 `result` 变量中。最后，使用\
  \ `print()` 函数打印结果。\n\n请记住，如果你在 DataCampLight 代码中定义了常量。不过，还有其他几种你可以在此工作的值类型，即占位符（placeholders）。这些占位符很重要，因为它们是未赋值的值，可以由你选择让运行的会话（session）进行初始化。正如其名，你想要处理的特定张量的占位符会在会话实际运行时被赋值。\n\
  \n在此过程中，我们还可以引入变量（variables）。这些是带有附加值的选项（你可以在过程中选择想要附加到每个变量上的值），并且我们可以在过程中更改它们。如果你希望通过这个过程进行检查，确保以后没有人能在这里修改你在方程中设置的值，那么你需要切换到某些常量（constants）。如果你不太担心这些值偶尔发生变化，或者你希望以后能够进入并对值进行一些更改，那么变量是一个很棒的选择。\n\
  \n你在这里编写的代码执行结果最终会在你的计算图中生成一个抽象张量（abstract tensor）。尽管这在程序中似乎并不总是奏效，但随之产生的结果将不会被计算。它只是被推送到算法中帮助定义模型，但并没有运行过程来帮助我们计算结果。\n\
  \n### 深度学习与 TensorFlow\n\n现在我们已经花了一些时间来了解 TensorFlow 的基础知识，并看到了使用该库的一些益处，现在是时候实际看看如何将\
  \ TensorFlow 与我们在本指南中讨论过的深度学习结合起来了。我们目前的工作方式是为神经网络构建我们自己的架构。但这次，我们想要确保能够通过 TensorFlow\
  \ 包完成任务。\n\n就像我们引入 Keras 库时所做的一样（我们将在下一章稍微提到这一点），我们需要通过逐层构建来创建我们自己的神经网络。如果你还没有机会这样做，请确保你将\
  \ `TensorFlow` 包导入到你想要使用的工作空间中，并使用惯例的别名 `TF` 以于操作。如果需要，你也可以选择另一个名称。\n\n从这一步开始，我们的目标是使用简单的\
  \ `Graph()` 函数初始化图来帮助完成此任务。这是一个引入到组中的重要函数，因为你将在整个执行过程中使用它来定义计算。请记住，当我们在这里工作并创建图时，我们不需要担心此时的计算工作。这是因为图（至少目前）还没有持持有任何我们需要的值。现在，图被用于定义我们稍后想要运行的操作。\n\
  \n在这种情况下，我们将使用一个名为 `as_default()` 的函数，以确保默认上下文已设置好并准备就绪。这种方法效果最好，因为它会向我们返回一个上下文管理器，可以将我们想要的特定图设置为默认图。这是一个很好的学习方法，因为当你的模型在同一个进程中需要多个图时，你可以随时使用它。\n\
  \n当你使用我们在上面列出的函数时，你将需要确定所谓的全局默认图（global default graph）。这非常重要，因为它是将保存你所有操作图。直到你遍历并创建一个新图来协助此工作。\n\
  \n一旦到达这一步，我们还需要花一些时间添加我们希望在图中看到的各种操作。我们这样做的方法是构建模型。一旦完成，我们就编译模型，然后定义指标（metric）、优化器（optimizer）和损失函数（loss\
  \ function）。然后你就可以使用 TensorFlow 了，这就是我们引入它的步骤。当我们到达这一点时，需要的一些步骤包括：\n\n1. 定义你想用于标签（labels）和输入（inputs）的占位符，因为我们现在不会放入真实数据。记住，你在这里使用的占位符是未赋值的值，它们将在你执行并运行的过程中被初始化。所以，当你准备好运行会话时，这些占位符将从你在\
  \ `run()` 函数中传递的数据集中获取值。\n2. 现在我们想要构建我们的网络。你可以通过展平输入开始，这是通过使用 `flatten()` 函数完成的。这将给你一个形状数组，而不是用于灰度图像的所种形状。\n\
  3. 在你能够展平输入后，你的构造需要变成一个全连接层，生成指定大小的逻辑值（logits）。Logits 是作用于之前层产生的未缩放输出的函数。然后它将使用相对缩放来确保单位是线性的。\n\
  4. 在你花了一些时间处理多层感知器（perceptron）之后，你将能够确保损失函数已定义。你对损失函数做出的选择取决于你当时正在执行什么种的任务。\n  \
  \  1. 记住，当你使用回归（regression）时，它能够预测连续值。当你处理分类（classification）时，你将预测数据点的离散类别或值。\n\
  \    2. 从这里开始，你可以封装 `reduce_mean()` 函数，它将计算整个张量元素的平均值。\n5. 现在你想获取训练优化器并定义它。你可以用于优化此的一些最佳算法包括\
  \ RMSprop、ADAM 和随机梯度下降（Stochastic Gradient Descent）。取决于你使用的算法，你可能需要设置一些时间参数，例如学习率或动量。\n\
  6. 最后，你需要在执行整个过程之前初始化操作，以便开始训练。\n\n\n\n\n虽然我们确实花了一些时间研究 `TensorFlow` 库能够实现的某些惊人功能，但请记住，这些只是该库自带的所有精妙模型和算法的示例。这确实是一个非常棒的程序，因为它能将人工智能、深度学习和机器学习全部整合在了一起。如果这听起来是一个可以帮助你完成某些想要完成的库，请花些时间将其下载到你的计算机上，并进行实验，看看它能帮助你完成哪些深度学习模型和功能。\n\
  \n## 第 6 章：我可以使用 Keras 库工作吗？\n\n列表中下一个我们可以稍微关注的库是 `Keras` 库。在涉及到深度学习以及在完成数据分析时处理你想处理的所有数据时，这将是我们可以使用的最佳选项之一。请记住，在\
  \ `Python` 中我们可以找到的两个顶级数值平台——那些能够为我们的深度学习研究开发提供一些基础的平台——包括 `TensorFlow` 和 `Theano`。\n\
  \n这两个库都拥有强大的强大，但在某些情况下，直接使用它们来创建我们想要的深度学习模型可能会很困难。因此，我们经常需要引入 `Keras` 库来帮助处理其中的一些模型。它运行在\
  \ `TensorFlow` 和 `Theano` 库之上，所以你仍然可以获得这些库的力量和功能，同时通过 `Keras` 额外的力量和易用性来处理深度学习。\n\
  \n### 什么是 Keras？\n\n首先，我们需要查看 `Keras` 库的一些基础知识、它能为我们做什么，以及学习这个库的重要性。`Keras` 被认为是一个极简的深度学习\
  \ `Python` 库，可以与 `TensorFlow` 和 `Theano` 一起运行。这个库的开发是为了让深度学习模型的实现尽可能快速、越简单，确保开发者和研究人员能够在没有繁琐麻烦的情况下完成工作。\n\
  \n要使用此库，程序员需要确保他们的计算机上安装了 `Python 2.7` 或 `3.5`。该库也是一个很棒的库，因为在底层框架的支持下，它可以无缝在 `CPUs`\
  \ 和 `GPUs` 上执行。得益于 `MIT` 的宽松许可，它已经发布，使得其他程序员和数据科学家能够从中获得全部益处。\n\n`Keras` 库由 Francois\
  \ Chollet 开发并持续维护，他曾是 `Google` 的工程师。该库的运行基于四个指导原则，包括：\n\n1. **模块化**：这个理念认为模型可以被理解为单独的图或序列。深度学习模型的所有关注点都是离散的组件，程序员可以介入并以任意的方式进行组合。\n\
  2. **极简主义**：该库的核心在于减少一些杂乱，并保持尽可能简单。我们发现 `Keras` 库为我们提供了恰足够的工具、函数和特性来实现我们的目标。其核心思想是最小化修饰并最大化可读性。\n\
  3. **可扩展性**：这意味着该库的设计初衷就是为了便于在该框架内添加并使用一些新组件。这样做是为了让研究人员能够无障碍地尝试新事物并探索他们遇到的一些新想法。\n\
  4. **Python**：我们在这种语言中做的一切都将依赖于原生的 `Python` 语言。不会有带有自定义文件格式的独立模型文件。这些在某些情况下可能很好，但通常会增加很多不值得的麻烦和困惑。让一切都与\
  \ `Python` 语言运行可以产生巨大的差异。\n\n使用 `Keras` 库有很多益处。它的设计目标是尽可能简单，同时让深度学习模型的创建比我们在 `TensorFlow`\
  \ 或 `Theano` 中看到的更简单一点。当你想要创建某些模型时引入它，可以让事情变得更简单。\n\n我们还可以花点时间看看在你的系统上安装此库的基础知识。如果不以正确的方式安装，将无法从整个库中获得我们想要的所有效率和模型创建功能。\n\
  \n首先，我们需要确保 `Python` 库已经在我们的系统上设置好，但我们将假设这已经完成，并继续后续为了让该库满足你的需求而需要采取的其他步骤。数据科学家或程序员可以用来在系统上添加\
  \ `Keras` 库并开始使用它满足其需求的步骤包括：\n\n1. **OpenCV 安装指南**：这将是一种可以链接到各种教程的启动板，可以帮助你安装该库。\n\
  2. **在 TensorFlow 中安装 Keras**：你可以通过 `pip` 在几分钟内安装 `TensorFlow` 和 `Keras`。\n3. 你可以在\
  \ Raspberry Pi 上尝试安装这些内容，但由于空间限制，这通常是困难的。\n4. **安装 Matplotlib、Scikit-Learn 和 imutils\
  \ 库**：你想要首先将这些库安装在你的计算机上。如果可以，尝试将它们安装到虚拟环境中。你可以使用以下代码通过 `pip` 安装：\n\n```bash\nworkon\
  \ <your_env> # pip install --upgrade imutils pip install --upgrade scikit-learn\n\
  ```\n\n通过上述代码，你就可以在你的计算机上获取 `Keras` 的整个程序，以及你需要的所有其他文件。\n\n### Keras 和 TensorFlow\n\
  \n当我们谈到这个话题时，我们需要查看 `Keras` 是如何与 `TensorFlow` 库工作的。鉴于 `TensorFlow` 项目已采用 `Keras`\
  \ 作为高层 API，似乎这个库将成为一个赢家。这是因为有很多人会将 `Keras` 与 `TensorFlow` 一起使用，使得 `TensorFlow` 的开发者认为这是一个应该欢迎的库。\n\
  \n记住，`Keras` 并不是一个我们可以独立运行的库。它需要底层有 `Theano` 或 `TensorFlow` 来完成我们想要的某些不同任务，并确保我们能够创建必要的深度学习模型。\n\
  \n虽然有些开发者喜欢使用 `Theano` 来完成一些工作，但另一些人则喜欢调用 `TensorFlow`，而这通常是人们在所有选项中的选择。\n\n###\
  \ Keras 的原则\n\n`Keras` 的原则非常独特，这也是为什么这种 `Python` 库会非常好用的原因，即使是在处理神经网络和深度学习模型时。首先，`Keras`\
  \ 的创建是为了更加易用、在需要时易扩展、支持 `Python` 并具有模块化。\n\n\n\n\n\n该库带来的核心优势之一是它是为人类使用而设计的，而不是为了机器。有时，我们讨论过的其他一些编码库的\
  \ API 运行起来太困难。它们在设计时没有考虑到用户，学习如何调出这些功能和所有算法可能是一件痛苦的事。但是，通过 Keras 提供的 API，这就不再是一个大问题了。它的设计目标是供人类使用，同时也遵循了行业中某些减少认知负荷的最佳实践。\n\
  \n如果你之前以前看过其他一些用于深度学习模型的 Python 库，你可能会担心程序会太难处理。但事实并非如此。Keras 的设定让任何人都能易于使用，你只需要在里面稍微研究一下，就会发现它是如此直观且易于使用的，无论你的模型最终变得多么复杂。\n\
  \nKeras 库还附带了许多独立模块。你可以根据需要将这些模块组合在一起，在 Python 的支持下创建你需要的新模型。你可以享用的一些独立模块示例包括（但不限于）正则化方案、激活函数、初始化方案、优化器、代代价函数以及神经网络层。\n\
  \n除了组合其中一些独立模块来创建你想要处理的新模型之外，添加新模块也是很容易的。这通常通过新的函数或类来实现。在这里完成的模型将在 Python 代码中定义，而不是使用它们各自的、独立的模型配置文件来工作。\n\
  \n你和其他程序员想要使用 Keras 库的最主要原因源于我们之前讨论过的那些指导原则。首先，Keras 如此易用这一事实正在这个行业中引起巨大浪潮。除了学习它的易用性以及它如何让构建模型的过程变得简单之外，Keras\
  \ 还将为我们提供广泛采用的优势、对许多生产部署选项的支持、与至少五个后端引擎集成，以及对大量 GPU 的强力支持。我们甚至发现它可以帮助我们完成一些所需的某些分布式训练。\n\
  \n如果你仍然不确定这是否是你适合的库，请想想所有已经在使用该库的公司。不仅是程序员和少数研究人员对这个库感到满意并将其用于自己的需求，一些外面的大型知名公司也正在使用这个库。这些公司包括\
  \ Uber、NVIDIA、Apple、Amazon、Microsoft 和 Google。\n\n## 使用 Keras 构建深度学习模型\n\n我们在这里需要查看的是如何利用\
  \ Keras 库来帮助我们构建一些自己的深度学习模型。对 Keras 的关注将放在模型的构思上。我们在这个库中能够处理的主要模型将被称为 `Sequence`，这是一个层的线性堆叠结构。\n\
  \n作为一个程序员，你将从一个基础序列开始，然后你可以向其中添加一些层，按照你希望它们在执行期间计算的顺序来添加它们。一旦你花时间定义了这些，你就可以编译你将使用的模型，这基本上会确保底层框架能够优化你希望该模型执行的计算。在此期间，程序员或研究人员可以指定他们想要使用的损失函数和优化器。\n\
  \n在我们花时间处理并编译了所有这些信息之后，我们需要获取模型并找到一种方法将其拟合到数据上。我们有几种方法可以完成工作。首先，你可以一次处理一批数据进行拟合，也可以通过启动整个模型训练过程来进行。这将是我们首次看到计算的发生。\n\
  \n现在，训练过程将需要一些时间，而且可能没有我们希望的那样高效。但我们展示给模型的数据越多，我们花更多时间用一些高质量数据来完成任务，模型的性能就会越好。一旦模型训练得当，你就可以使用该模型查看呈现的新数据，并为你做出一些良好的预测。\n\
  \n虽然将模型转换为你可以用于洞察和预测的东西需要经过许多步骤，特别是当它是一个深度学习模型时，但我们能够对其进行总结以使事情变得简单一些。帮助我们解释 Keras\
  \ 中深度学习模型构建所需的摘要将包括以下步骤：\n\n1. **定义模型。** 这意味着我们必须从创建自己的序列开始，然后添加我们想要处理的层数。\n2. **编译模型。**\
  \ 这一步让程序员或研究人员指定所有优化器以及损失函数。\n3. **拟合你的模型。** 这一步是你可以使用所有收集到的数据来执行模型。这将包括大量的训练，以确保模型能够按照我们想要的方式工作。\n\
  4. **做出预测。** 在模型有足够的时间进行适当的训练后，我们就可以使用该模型来帮助为任何呈现的新数据生成所需的预测。随着时间的推移和接收到更多数据，模型在预测方面将变得更快、更高效。\n\
  \n在使用 Keras 库时，有许多值得喜爱的地方。很多人担心它会太难使用，或者认为不浪费时间，因为这个库不会添加从 Theano 或 TensorFlow 获得的任何额外功能。然而，这是一个可以独立运行的库。\n\
  \n## PyTorch 的起源\n\n\n\n\n如我们上面提到的，PyTorch 是目前最新的库之一，它可以与 Python 配合工作并帮助深度学习。尽管它在\
  \ 2016 年 1 月才刚刚发布，但它已经成为数据科学家喜欢使用的库之一，这主要是因为它可以轻松构建出非常复杂的神经网络。这对于许多过去无法处理这些神经网络的初学者来说是完美的。即使他们的编程经验有限，他们也能在短时间内使用\
  \ PyTorch 构建出属于自己的网络。\n\n这个 Python 库的创建者们设想，当他们想要尽可能快速地运行大量的数值计算时，这个库将是至关重要的。这是理想的方法论之一，而且与我们在\
  \ `Python` 中看到的编程风格完美契合。该库连同 Python 库一起，允许神经网络的调试器、机器学习开发者和深度学习科学家不仅能够运行，而且实时测试代码的部分。这是一个极好的消息，因为这意味着这些专业人士不再需要等待整个代码完成并执行，就可以检查代码是否运行正常，或者是否需要修复某些部分。\n\
  \n除了 PyTorch 库自带的一些功能外，请记住，您还可以通过添加其他 Python 包来扩展该库的一些功能。像 `Cython`、`SciPy` 和 `NumPy`\
  \ 这样的 Python 包都能与 PyTorch 良好地工作。\n\n尽管有这些优点，我们仍然可能对为什么 PyTorch 库如此特殊，以及为什么我们在需要构建深度学习所需模型时想要使用它产生疑问。答案很简单，主要是因为\
  \ PyTorch 被视为一个动态库。这意味着该库非常灵活，您可以根据任何需求和更改来使用它。它在这一方面表现非常出色，正被人工智能领域的开发者、学生以及许多行业的研究人员使用。事实上，在一次\
  \ Kaggle 比赛中，几乎所有进入前十名的人都使用了这个库。\n\n## PyTorch 的亮点\n\n虽然 PyTorch 库带来了许多优点，但我们首先需要介绍一下各种专业人士如此喜欢这种语言的几个亮点。其中一些包括：\n\
  \n1. **界面简单易用。** PyTorch 界面将为我们提供一个易于使用的 API。这意味着我们发现操作和运行就像使用 `Python` 一样简单。\n\
  2. **本质上是 Pythonic 的。** 由于该库被认为是 Pythonic 的，它将无缝地集成到 Python 数据科学栈中进行工作。对于那些不想在此过程中与其他编程语言一起工作、只想坚持\
  \ `Python` 基础知识及其某些功能的人来说，可以使用此库来实现目标。您将获得利用通过 `Python` 环境提供的所有功能和服务的优势。\n3. **计算图：**\
  \ PyTorch 库的另一个亮点是它将为我们提供一个带有动态计算图的平台。这意味着您有能力在运行时甚至更改这些图。每当您需要处理某些图，并且不确定在为神经网络创建此模型时需要使用多少内存时，这将非常有用。\n\
  \n## PyTorch 社区\n\n我们在这里需要查看的下一点是 PyTorch 库附带的社区。由于 PyTorch 带来的所有优点，我们可以看到开发者和其他专业人士的社区每天都在增长。在短短几年内，这个库已经展示了巨大的进步，甚至导致该库被许多研究论文和小组所引用。在涉及到人工智能和深度学习模型时，PyTorch\
  \ 正开始成为主要的开发库之一。\n\nPyTorch 的有趣之处之一是它仍然处于早期发布版（beta）阶段。但由于如此多的程序员已经在采用这个深度学习框架，而且采用速度如此之快，它已经展示了随之而来的力量和潜力，以及社区可能会继续增长。例如，尽管我们仍然处于\
  \ PyTorch 的 beta 版本阶段，但目前仅 `GitHub` 仓库就有 741 个贡献者。这意味着有超过 700 个人致力于增强并为 PyTorch\
  \ 已有的功能添加改进。\n\n想想这有多惊人！PyTorch 在技术上尚未正式发布，仍处于早期阶段。但这个深度学习库引起了如此大的关注，这么多程序员已经在用它进行深度学习和人工智能开发，以至于已经大量的贡献者在致力于为其添加更多功能和改进供他人使用。\n\
  \n由于其模块化设计和灵活性，PyTorch 不会限制我们正在使用的特定应用。它已经受到了一些领先科技巨头的大量使用，你甚至可能认出某些名字。已经开始使用 PyTorch\
  \ 改进他们自己的深度学习模型的人包括 `Uber`、`NVIDIA`、`Twitter` 和 `Facebook`。该库也被用于许多研究领域，包括神经网络、图像识别、翻译以及\
  \ `NLP` 等其他关键领域。\n\n## 为什么在数据分析中使用 PyTorch\n\n任何从事数据科学、数据分析、人工智能或深度学习领域的人可能都花过时间使用我们在本指南中提到过的\
  \ `TensorFlow` 库。`TensorFlow` 可能是 Google 推的最流行的库，但由于 PyTorch 深度学习框架，我们可以发现对于这些专业人士想要修复的研究工作，该库能够解决一些新问题。\n\
  \n人们通常认为，在处理数据方面，PyTorch 现在是 `TensorFlow` 最大的竞争对手，而且在研究社区中，它是最受欢迎的人工智能和深度学习库之一。这种现象发生有很多原因，我们将在下面讨论其中一些：\n\
  \n\n\n\n命令式风格是使用此类库的另一个优势。这意味着当我们使用这个库进行工作时，它既易用又非常直观。当你执行一行代码时，它将按照你预期的的方式执行，并且你能够进行一些实时的跟踪。这允许程序员持续跟踪神经网络模型的运行情况。得益于其所具备的优秀架构以及精简高效的方法，它已经提高了该库在整个程序员社区中的整体采用率。\n\
  \n### 可扩展性\n我们在使用 `PyTorch` 时将享有的另一个优势是它是易于扩展的。这个库特别是在集成方面表现优异，可以与 `C++` 代码良好地工作，并且在我们构建自己的深度学习框架时，它将与该语言共享部分后端。这意味着程序员不仅可以使用\
  \ `Python` 来处理 CPU 和 GPU，还可以使用 `C` 或 `C++` 语言添加 API 扩展。这意味着我们能够将 `PyTorch` 的使用范围扩展到一些新的、实验性的用例中，这使得当我们想要用它进行某些研究时，它变得更好。\n\
  \n### Python 原生方法\n最后，我们在这里关注的最后一个优势是 `PyTorch` 将被视为一个 Python 风格的库。这是因为从设计方式来说，该库就是一个原生的\
  \ `Python` 包。随之而来的功能是以 `Python` 类构建的，这意味着你在这里编写的所有代码都可以与 Python 的模块和包无缝集成。\n\n与我们在\
  \ `NumPy` 中看到的情况类似，这个基于 Python 的库将使我们能够在经 GPU 加速的张量上工作，并在应用神经网络时，其计算为我们提供了丰富的 API\
  \ 选项。`PyTorch` 将为我们提供从端到端所需的科研框架，其中包含了我们日常开展深度学习研究所需的多数不同构建块。我们还注意到，该库将为我们提供高层神经网络模块，因为它也可以与类似于\
  \ `Keras` 库的 API 进行工作。\n\n## PyTorch 1.0 – 这如何推动我们从研究迈向生产\n\n在本章中，我们花了一些时间讨论了 `PyTorch`\
  \ 库所具备的许多优势，以及这些优势如何帮助许多研究人员和数据科学家将其作为他们的首选库。然而，该库也存在一些缺点，其中之一就是它在生产支持方面一直非常匮乏。不过，由于\
  \ `PyTorch` 将发生一些改进和变化，预计这种情况很快就会改变。\n\n下一个版本的 `PyTorch`（即 `PyTorch 1.0`）已经预计将是一个重大发布，旨在克服研究人员、程序员和开发者在生产环境中面临的一些最大挑战。这是整个框架的最新迭代，预计将与基于\
  \ `Python` 的 `Caffe2` 结合，允许深度学习研究人员和机器学习开发者从研究转向生产。此举目的是让这一过程以一种无烦恼的方式发生，而不需要程序员去额外操作。\n\
  \n## 第 8 章：观察机器学习以及它是如何融入的\n\n在我们谈论这个话题时，我们还需要花时间看看机器学习，以及它是如何融入深度学习主题之中的。机器学习是另一个在整个商业界备受关注的话题，无论你投身于哪个行业，学习如何实现这一点，以及机器学习和人工智能其他部分的重要性都是至关重要的。\n\
  \n当你开始深入研究人工智能领域的所有进展时，可能会感到有些无从。。但如果你现在只是对学习一些基础知识感兴趣，可以将人工智能带来的许多创新归纳为两个主要概念。这两个概念将包括我们已经花过时间讨论的深度学习以及机器学习。\n\
  \n 什么是机器学习？\n\n我们在这里需要查看的是机器学习的基础。这将包含许多算法，它们能够首先解析我们拥有的数据，从数据中学习，然后将它们从数据中学到的知识应用以做出更明智的决策。\n\
  \n\n\n\n\n让我们来看一个它是如何运作的例子。这个过程的一个很好的例子是点播音乐流媒体服务。为了让这项服务在决定向听众者推荐哪些艺术家或歌曲的决策上保持一致，机器学习算法将全力工作。这些算法能够将用户的喜好与音乐品味相似的其他听众者联系起来。这种技术通常被通俗地称为**人工智能**，它将用于应用在许多其他能够自动方式向我们提供推荐的服务中。\n\
  \n机器学习将为各种自动化的且跨越许多行业的任务提供动力。这可能从一些负责数据安全的公司开始，他们将搜寻恶意软件并在其感染大量计算机之前将其关闭。它也可以适用于金融专业人士，他们希望防止欺诈，并确保在出现可以信赖的良好交易时收到警报。\n\
  \n我们可以利用一些随人工智能而来的算法，并对它们进行编程，使其能够不断学习。这将以一种能够刺激虚拟个人助手动作的方式来实现，你会发现这些算法能够非常高效地完成这些工作。\n\
  \n机器学习将是一个复杂的程序，通常需要正确的编程语言（如 `Python`）以及一些最棒的库来完成任务。你创建的算法将涉及许多复杂的代码和数学知识，这些可以作为机械功能。这种功能类似于我们在计算机屏幕、汽车或手电筒上看到的为我们服务的功能。\n\
  \n当我们说像过程或机器之类的东西能够进行“机器学习”时，基本上意味着它能够根据你提供的数据执行某种功能，并且随着时间的推移，它在执行该任务方面也会变得越来越好。把它想象成一个手电筒，每当你说“天黑了”这个词时，它都能打开，因此它可以识别包含“黑”字词的不同短语，然后知道继续执行手头的动作。\n\
  \n现在，我们训练这些机器来完成上述技巧以及更多操作的方法确实非常有趣。处理这种工作没有比这更好的方法了，那就是在过程中加入一点神经网络和深度学习，以使这些结果在整体变得更加普遍。\n\
  \n## 机器学习 VS 深度学习\n\n现在，我们需要看看机器学习和深度学习之间会有何相同之处，它们又会有何不同。从实际角度来看，深度学习仅仅是机器学习中看到的一个子集。事实上，我们看到的一个事实是，深度学习在技术上是一种机器学习，它的运行方式与机器学习相似。这就是为什么许多没有接触过这两个领域任一主题的人可能认为它们是同一件事。然而，理解深度学习和机器学习之间的能力差异是非常关重要的。\n\
  \n虽然机器学习的基础模型会随着你训练它们所执行的功能而稳步改进，但它们仍然需要依靠你提供的一些指导。如果算法给出的预测是不准确的，那么工程师必须介入，并确保尽早完成必要的调整。然而，对于一个依赖于深度学习的模型，算法可以在没有任何帮助的情况下，确定它所做的预测是否准确。这是在神经网络的帮助下完成的。\n\
  \n让我们回到之前那个关于手电筒的例子。你可以对它进行编程，使其每当能识别出有人重复“黑”这个词的听觉信号时就打开。随着它的不断学习，它随后可能在任何包含该词的短语中也打开。这通过一个简单的机器学习模型就可以实现。\n\
  \n但如果我们决定加入一个深度学习模型来帮助我们完成这项工作，那么手电筒就能根据其他线索打开。不再只是等待“黑”字的出现，当有人说“灯开关坏了”或“我看不清了”之类的短语时，我们就能看到它工作，这表明他们需要光。深度学习模型将能够通过自己的计算方法进行学习，这将是一种非常有帮助的技术。\n\
  \n## 在过程中加入深度学习\n\n考虑到这一点，深度学习的应用将能够以一种似乎拥有自己大脑的方式工作。真正让所有人感到震惊并将这种技术推向前沿的部分是，它能够击败许多世界闻名的游戏“大师”。这意味着机器不仅可以学习游戏中的一些抽象方面和复杂技巧，而且还成为了该游戏最优秀的棋手之一。\n\
  \n我们现在可以观察的深度学习的一个例子是 `Google` 开发的 `AlphaGo` 产品。`Google` 致力于创建一个与神经网络工作的计算机程序。在这个计算机程序中，网络能够学习如何玩被称为\
  \ `围棋` 的棋类游戏，这种游戏需要大量的直觉和智力才能完成。\n\n这个程序最初通过与其他围棋专业选手对弈开始，模型能够学习如何玩这个游戏并击败其中的一些专业人士，在一个以前未见的智能系统中击败了智力水平。而且这一切是在没有任何告诉程序何时应该采取特定移动的情况下完成的。遵循标准机器学习要求的模型需要这种指导。但这个程序将独立完成一切。\n\
  \n\n\n\n为了总结这些信息并帮助我们记住机器学习与深度学习之间出现的一些区别，我们需要讨论以下内容：\n\n1. 机器学习将通过算法来解析数据，从其拥有的数据中学习，然后根据算法在此过程中所学到的内容做出一些明智且知晓的决策。\n\
  2. 深度学习算法的结构将以分层的形式出现。这有助于我们获得一个人工神经网络，它将完全独立地学习并做出某些智能决策。\n3. 另一方面，深度学习是机器学习的一个子领域。它们两者都属于人工智能的范畴。但通过深度学习，我们将看到更多驱动机器中类似于人类思维方式的人工智能的动力。\n\
  \n现在，这些有时看起来会有些复杂，因为要实现这些功能有太多的因素参与其中了。我们理解深度学习和机器学习之间差异最容易掌握的要点，只需要意识到深度学习是机器学习的一种类型。\n\
  \n为了更进一步并增加一些具体的细节，深度学习被认为是机器学习的一种演变，它向我们展示了这种技术在多年来是如何变化的。这种学习方式可能会出现很多技术，但它通常与我们能够编程的神经网络一起工作，这将使机器能够在没有程序员任何帮助的情况下做出准确的决策。\n\
  \n## 数据是我们未来所需的燃料\n\n随着我们现在这个时代——大数据时代——所产生的海量数据，我们看到一些让我们所有人感到惊叹和惊喜的创新并不为奇。而且未来，我们很可能会看到许多目前甚至无法想象的新创新。根据该领域许多专家的说法，我们很可能会看到许多此类创新出现在深度学习的应用中。\n\
  \n这对我们的未来来说是一件好事。想想这种技术将如何接管世界，并帮助我们以从未想过的可能的方式去做事和体验事物。想想这种技术在未来将带我们走向哪里，它将如何改变许多我们彼此以及与其他业务互动的方式。\n\
  \n我们看到的许多人工智能应用出现在客户服务中。这些将用于帮助推动自助服务的到来，提高代理人员的效率，并确保工作流更加可靠。\n\n输入这些算法的数据将来自不断涌入客户查询。这可能包括业务客户所面临某些问题的很多相关背景。企业在与客户接触时已经能够收集到大量数据，他们还可以添加一些第三方调查，甚至征求客户的意见，以创建良好的机器学习算法。这些算法随后可以帮助我们确定客户想要什么、发布哪些产品等。\n\
  \n机器学习和深度学习是两个看起来几乎相同的话题，对于那些刚开始这种流程的人来说，很难看出这两个术语会有何不同。随着我们更深入研究数据分析的概念以及我们对收集到的所有数据所能做什么，我们将发现机器学习和深度学习是两个非常不同的过程，它们可以帮助我们完成一些惊不起的事情。\n\
  \n## 第 9 章：深度学习如何帮助完成你自己的预测分析\n\n很多时候，我们都能认同，机器学习已经能够介入并迅速改善我们与所拥有的所有数据以及互联网互动的方式。例如，当我们谈论机器学习时，我们可以看到它与搜索引擎协同工作。\n\
