  \n*纠正：由于原文文本中确实存在段落完全重复，为了确保“不漏掉任何行”，我在译文中完整翻译了所有出现的内容。*\n\n\n\n\n\n1. 可用数据可以对此有所帮助。数据量的增长以及数据类型都是一个很好的切入点。而且，许多公司对利用数据在过程中产生一些出色的洞解产生了浓厚的兴趣。\n\
  \n2. 完成这种预测性分析所需的计算机和系统比以往任何时候都更便宜、更快。\n\n3. 完成预测性分析的软件变得更加易用。\n\n4. 企业现在面临着激烈的竞争。得益于经济中更严峻的环境以及竞争，企业需要找到自己的差异化方法并超越对手。预测性分析可以帮助他们实现这一点。\n\
  \n随着比以往任何时候都易用的交互式软件，预测分析取得了巨大的发展。它不再仅仅是数学和统计学研究者的领域。业务专家甚至业务分析师也能使用这种技术。\n\n考虑到这一点，现在是时候看看预测性分析是如何运作的。预测模型将通过使用已知结果来帮助训练或开发模型，该模型可用于预测不同或新数据的值。随预测性分析的建模可以为我们提供结果，通常以预测的形式出现，可以代表目标变量的概率。该变量将根据你想要寻找的结果而变化，可能包括收入等内容。\n\
  \n请记住，这与帮助我们理解过去发生了什么的描述性模型，或者我们用来帮助我们理解某些关键关系并确定为什么某些情况在过去发生的某些诊断模型相比，会有所不同。事实上，有整本书将专门介绍比其他技术更具分析性的各种技术和方法。甚至有完整的大学课程也会深入这一主题，但我们可以查看该过程中的一些基础知识，以及我们如何将其用于满足我们的需求。\n\
  \n我们可以首先查看两种类型的预测模型。这些包括分类模型和回归模型。首先是分类模型，它用于预测类别的成员身份。例如，你可能从事一个项目，试图弄清楚员工是否可能离开公司、某人是否会对你业务的推销做出反应，或者在贷款资金之前某人的信用状况是好是坏。\n\
  \n对于这类模型，我们将坚持二分类选项，这意味着结果必须是 `0` 或 `1`。因此，模型结果将是这些数字，`1` 告诉我们目标事件可能会发生。这是确保我们能看到某事是否可能发生的极佳方法。\n\
  \n然后我们有了回归模型。它们负责为我们预测一个数字。一个很好的例子是预测客户在明年将产生多少收入，或者我们的某台设备在机器上开始故障之前我们还有几个月的时间，以便我们可以更换。\n\
  \n在预测建模方面，我们有许多不同的技术可以处理。属于预测建模类别的三种最常见技术类型包括回归、决策树和神经网络。\n\n### 回归模型\n\n在预测建模方面，我们有许多不同的技术可以处理。属于预测建模类别的三种最常见技术类型包括回归、决策树和神经网络。\n\
  \n列表上的第一个是 `regression`（回归）。当我们进行回归分析时，我们希望确保能够预测一个数字，这被称为响应变量，在本文中为 `Y`。通过一些 `linear\
  \ regressions`（线性回归），我们将有一个独立变量，可以帮助解释或预测 `Y` 的结果。而 `multiple regression`（多元回归）将与两个或多个独立变量一起工作，帮助预测结果将如何。\n\
  \n`regression` 将估计变量之间存在的关系。它还用于被假设服从正态分布的连续数据，它能发现通常用于回答某些业务问题的模式，例如影响资产的价格。\n\n\
  ### 决策树\n\n在预测建模方面，我们有许多不同的技术可以处理。属于预测建模类别的三种最常见技术类型包括回归、决策树和神经网络。\n\n很多时候，数据科学家会选择使用\
  \ `decision tree`（决策树）来帮助确认你使用的其他技术得出的发现。`decision tree` 受欢迎是因为它们易于解释，而且在处理某些类型的数据时表现也很好。\n\
  \n### 神经网络\n\n在预测建模方面，我们有许多不同的技术可以处理。属于预测建模类别的三种最常见技术类型包括回归、决策树和神经网络。\n\n`neural\
  \ networks`（神经网络）是一种我们能够处理的更复杂的技术，具有建模非常复杂关系的能力。它们受欢迎有很多原因，但其中最大的原因之一是 `neural networks`\
  \ 如此灵活且强大。我们在 `neural network` 中看到的强大之处源于它们处理数据中非线性关系的能力。\n\n### 分类模型\n\n然后我们可以转向\
  \ `logistic regression`（逻辑回归）。通过这种模型，我们将看到它是基于某些变量的已知值来预测离散变量的未知变量。响应变量将更具类别性，这意味着与其他模型相比，它只能假设有限数量的值。\n\
  \n最后，我们有了 `binary logistic regression`（二分类逻辑回归）。这种模型的响应变量只有两个值。所有发生的结果都将以 `0` 或\
  \ `1` 输出。如果我们看到 `0`，这意味着预期的结果不会发生。如果它显示为 `1`，那么这意味着我们预期的结果将会发生。\n\n\n\n\n\n神经网络将基于许多特征，包括模式识别以及人工智能的一些过程，这些过程可以以图形化的方式对我们的参数进行建模。当我们不知道可以将输入和输出联系起来的数学公式时，这些网络将运行良好；当预测比解释工作更重要时，或者当我们有大量的训练数据可以处理时，它们也会表现出色。\n\
  \n我们必须考虑的另一个选项是人工神经网络。这些最初由研究人员开发，他们试图在机器上模拟人类大脑中可以发现的东西。当他们成功时，我们就获得了许多今天喜欢使用的现代技术。\n\
  \n预测性分析将为你的业务带来巨大的益处。它能确保你能够处理业务面临的一些更复杂的问题，并让你更容易了解未来可能发生的情况。基于数据以及预测分析发现的洞察来做出重大业务决策，可以更容易战胜竞争并脱颖而出。\n\
  \n## 深入深度学习\n\n现在，除了我们手动编码的某些类别之外，机器可以使用一些神经网络来帮助它学习你正在处理对象的特征。回想上面的例子，我们可以使用神经网络帮助机器学习桃子和芒果的一些特征，而机器可以独立完成这一切。\n\
  \n记住之前的观点，记住这些网络的工作方式与我们看到的大脑相似，它们由人工神经组成，帮助我们对数据进行建模。网络中还会有类型的突触反应，使用不同的值作为输入。特征输出产生的值可以作为其他人工神经的新输入。\n\
  \n这些神经网络将是我们看到的可以自主学习机器的核心。我们可以预期，在经过正确的训练和测试后，它们将通过学习感知图像的特征将桃子和芒果区分开。\n\n这是深度学习发挥作用的绝场所，因为它将帮助我们定义在神经网络内部使用的层数。为了让这更容易，这基本上是给定网络深度的术语。为了让网络被认为是详尽的，我们需要尽可能多添加层，因此我们需要让它尽可能深。\n\
  \n即使你花时间创建了神经网络并设置了所有特征，许多网络也无法投入实际应用。发生这种现象的主要原因是没有足够的数据来使训练生效。如果你无法收集到大量的大数据来训练模型，那么模型永远不知道它应该如何表现，也没有办法确保准确性。\n\
  \n然而，这种情况下最重要的陷阱是机器或系统可能无法产生足够的计算能力来完成工作。这再次是大数据可以上场并提供帮助的地方。这些大数据能够以自然的方式帮助深度学习和网络，并在业务智能的帮助下提供一些计算能力。如果你能够为你正在做的事情添加足够的动力，并以适当的方式使用大数据，你会发现计算能力问题将不再是一个大问题。\n\
  \n## 深度学习的应用\n\n在许多公司，机器学习和深度学习技术的使用将被广泛采用。它们可以用于医学领域，帮助我们了解更多不同疾病，并帮助医生以更快的方式提供准确的诊断。它们可以用于零售行业，帮助确定触达客户的最佳营销技术，以及放置不同产品的位置。制造企业可以使用深度学习帮助他们发现浪费产生的地方并消除它，并对设备何时故障进行预测，以便他们可以提前修理。\n\
  \n尽管有所有这些选项，仍然存在其他针对机器学习的方法和用途，特别是那些由深度学习辅助的类型。其中一些包括：\n\n1. **文本分析**：这是一种预测分析的形式，可以根据按键的压力强度和打字速度，帮助我们提取文本背后的情感。\n\
  2. **人工智能**：这可能是一个独立领域，但它可以从深度学习中获取大量线索。这是因为你处理的许多人工智能模型都会利用神经网络的想法。Google DeepMind\
  \ 就是一个很好的例子。\n3. **预测性异常分析**：深度学习可以帮助我们发现信号中何时出现异常和不正常模式。这对于许多想要尽早发现灾难的公司非常有用，并可以帮助我们避免主要系统的故障。\n\
  \    - 在需要检测这些异常时，许多情况下深度神经网络将是首选，因为它能够接收输入信号并将其重构为输出。如果过程中发生了任何变化，这些也将被报告。如果你有一个非常深的网络，那么就有可能以更精细的方式处理这些信息。\n\
  4. **故障分析**：神经网络通常能够预先检测到将发生的故障，即使这些网络不是针对故障系统设计的。如果我们设置了深度学习，服务器过载和其他一些可能异常的行为也可以被轻松检测。\n\
  5. **IT 环境中的干扰**：大多数组织服务在过去几年里发生了巨大变化，包括微服务、交付系统和物联网（IoT）。当大多数团队都在开发各种工具来帮助理解这些服务的本质时，当需要评估模式并更改\
  \ IT 栈时，深度学习将非常有帮助。\n\n## 描述\n\n现在，你已经从许多来源收集并存储了所有这些数据，下一步是什么？你的业务应该如何搜索所有这些信息，并实际上弄清楚它们表达了什么？所有这些数据真的包含了你所需的领先和战胜竞争，同时降低成本并提高客户满意度的洞察和预测吗？\n\
  \n\n\n\n本指南将花费一些时间来探索深度学习，以及它如何帮助你在面对海量数据时改进数据分析。通过使用正确的深度学习算法或模型，并时对这些数据进行分析，你将获得最终所需的全部深度洞察和预测，从而取得领先地位。\n\
  \n如果你能在竞争对手之前击败他们并找到新的利基市场，感觉会如何？如果你能自信地将产品推向市场并确保它表现良好，感觉会如何？如果你能在最关键的领域提高客户满意度，这意味着什么？这一切通过数据分析都是可能的。\n\
  \n### 主题\n我们将通过深度学习和数据分析讨论的一些主题将包括：\n\n* 深度学习的核心内容以及它如何帮助你的业务。\n* 数据分析重要性，以及为什么它是你大数据流程的下一步一步。\n\
  * 一些优秀的 Python 库，它们将把你的工作提升到新的水平，并让深度学习和数据分析变得更加简单。\n* `Keras` 库、`PyTorch` 库以及 `TensorFlow`，它们每一个都可能成为你在深度学习领域最终取得成功的答案。\n\
  * 如何创建你自己的神经网络，包括传统和循环神经网络。\n* 机器学习如何融入其中，并帮助我们让代码比以往任何时候都更强大。\n* 在进行预测性分析时，深度学习如何发挥作用，并真正提升你的业务的竞争优势。\n\
  \n深度学习和数据分析有许多益处，本指南已经涵盖了其中许多方面，以帮助我们入门。当你准备好将收集的所有这些信息付诸用处，并准备好真正获得竞争优势时，请务必查阅本指南以开始！\n\
  \n## 结论\n\n感谢你读到《Python 数据分析》的最后，希望这本书对你大有裨益，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\n下一步是开始将本指南中讨论的某些模型和\
  \ Python 库付诸实践。公司已经在收集大量数据。现在是时候让我们获取这些数据，并实际学习这些数据中究竟包含着哪些预测和洞察了。\n\n本指南花费了一些时间研究深度学习，以及它如何让我们的数据分析比以往任何时候都变得简单。这种数据分析将改变你经营业务的方式，并确保你每次都能从数据中获得最佳结果。我们查看了在利用深度学习进行数据分析时可以使用的不同语言、库和技术。\n\
  \n当你准备好将你收集的所有数据通过深度学习进行良好的数据分析并付诸用处时，请务必查阅本指南来帮助你开始。\n\n最后，如果你发现这本书在任何方面都有帮助，我们将非常感谢你在\
