    \ - 32), 1);\n}\n```\n\n# Basic Conventions\n\n# Conventions for PHPUnit\n\nHere\
    \ are basic conventions for PHPUnit.\n\n+   1. The tests for a Class go into a\
    \ class ClassTest.\n2. ClassTest extends PHPUnit_Framework_TestCase (most of the\
    \ time).\n3. The tests are public methods named test*. Alternatively, you can\
    \ use the @test tag in a method's docblock to mark it as a test method.\n4. Inside\
    \ the test, assertion methods such as assertEquals() are used to assert that an\
    \ actual value matches an expected value.\n\n# Conventions for ci-phpunit-test\n\
    \nWe will change some of these conventions for CodeIgniter according to CodeIgniter's\
    \ coding standards and provide a convenient way to test.\n\n+   1. The tests for\
    \ a named Class go into a named Class_test.\n2. Class_test extends TestCase.\n\
    3. The tests are public methods named test_*. Alternatively, you can use the @test\
    \ tag in a method's docblock to mark it as a test method.\n\nThe TestCase class\
    \ extends PHPUnit_Framework_TestCase, so we are technically, still following the\
    \ conventions for PHPUnit in terms of extending PHPUnit_Framework_TestCase, but\
    \ the TestCase class adds some convenient functionality for running tests in CodeIgniter.\n\
    \nWe put the test files in the application/tests directory."
