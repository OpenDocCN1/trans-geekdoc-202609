  md: '# Comparisons of Floating-Point Numbers


    Comparisons of floating-point numbers using $this->assertEquals() should supply
    an accepted delta as the fourth argument. For more information, see "What Every
    Computer Scientist Should Know About Floating-Point Arithmetic" and the PHP Manual.


    Because we compare floating-point numbers, we have to set the fourth argument.
    When comparing strings or integers we don''t need it, so we often write vert code
    like this:


    ```

    $this->assertEquals($expected, $actual);

    ```


