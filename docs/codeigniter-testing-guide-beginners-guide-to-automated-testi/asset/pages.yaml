    \    libraries/\n      Seeder.php\n\napplication/database/seeds/NewsSeeder.php\n\
    \n```\n<?php\nclass NewsSeeder extends NewsSeeder {\n    private $table = 'news';\n\
    \    public function run() {\n        $this->db->truncate($this->table);\n   \
    \     // Reset autoincrement sequence number in SQL\n```\n\n> *https://github.com/kenji/ci-phpunit-test/blob/master/application/libraries/Seeder.php\n\
