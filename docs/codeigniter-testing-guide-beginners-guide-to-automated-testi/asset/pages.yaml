- pgno: 56
  md: "# Testing Tip: Data Provider from Another Class\n\nYou can use a data provider\
    \ from another class by specifying the class in the tag: @dataProvider Bar::provide_baz_data.\
    \ If the class is defined (or autoloable) and the provider method is, PHPUnit\
    \ will use it.\n\n# Incomplete Tests\n\nWe have written test code for the FToc()\
    \ method, but there is another method, CtoF(), in the class. So we need to test\
    \ this method, as well.\n\nWhen we need to write a test method, but we have not\
    \ finished it, we can use PHPUnit's $this->markTestIncomplete() method. This is\
    \ a marker which can be used to indicate the test is incomplete or not currently\
    \ implemented.\n\nAdd the following method to the bottom of the test class:\n\n\
    application/tests/libraries/Temperature_converter_test.php\n\n```\npublic function\
    \ test_CtoF() {\n    $this->markTestIncomplete(\n        'This test has not been\
    \ implemented yet.'\n    );\n}\n```\n\nAn incomplete test is denoted by an I in\
    \ the output of the phpunit.php and the OK line is yellow, not green, if your\
    \ terminal has color capability.\n\n```\n$ php phpunit.phar libraries/Temperature_converter_test.php\
    \ --no-coverage\\PHPUnit 4.8.10 by Sebastian Bergmann and contributors.\n```\n\
    \n```\n...I\nTime: 817 ms, Memory: 7.50Mb\n```\n\nOK, but incomplete, skipped,\
    \ or risky tests!\nTests: 6, Assertions: 5, Incomplete: 1.\n\nIf you put a test\
    \ method without assertions and without $this->markTestIncomplete(), you will\
    \ see the green OK and you cannot determine whether a test is actually successful\
    \ or just not yet implemented."
  merge: -1
  img_proc: true
- pgno: 57
  md: "# Adding Tests\n\nIt is easy to add test code for the Ctof() method, because\
    \ Ctof() is just the opposite of FtoC(). We can reuse the data provider from the\
    \ test_FtoC() method.\n\n# Exercise\n\nPlease stop here and think about how you\
    \ would write the test method.\n\nUpdate the test_FtoC() method:\n\n```\napplication/tests/libraries/temperature_converter_test.php\n\
    /**\n * @dataProvider provide_temperature_data\n */\npublic function test_FtoC($expected,\
    \ $degree) {\n    $obj = new Temperature_converter();\n    $actual = $obj->FtoC($degree);\n\
    \    $this->assertEquals($expected, $actual, '', 0.01);\n}\n```\n\nThe order of\
    \ the test_FtoC() parameters is reversed.\nThis test class is okay, but we can\
    \ still improve it a bit with PHPUnit's setUp() method.\n\n# Fixtures\n\nA fixture\
    \ is a state for an application. If you run tests, you must set the world up in\
    \ a known state before running tests, because any difference in the state may\
    \ change the test results.\nPHPUnit has methods for defining fixtures. In this\
    \ test case, we don't need to do anything, because the class under has no dependencies\
    \ except for PHP's internal function, round(). The round() also has no dependencies,\
    \ it returns a calculated value.\nHowever, we can still improve our test code\
    \ by setting up our environment.\n\n# setUp()\n\nsetUp() is a method which is\
    \ called before a test method is run. In other words, PHPUnit calls setUp() before\
    \ running each test method. If you use it, you can share the setup code and the\
    \ state over multiple test methods."
  merge: -1
