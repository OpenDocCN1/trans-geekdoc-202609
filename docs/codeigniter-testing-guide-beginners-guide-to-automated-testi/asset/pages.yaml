- pgno: 141
  md: "# 9. Testing REST Controllers\n\nYou can also test your REST controllers easily.\
    \ The examples in this chapter will use CodeIgniter Rest Server.\n\n# 9.1 Installing\
    \ CodeIgniter Rest Server\n\n**CodeIgniter Rest Server** is a fully RESTful server\
    \ implementation for CodeIgniter.\nDownload the latest version (in this book we\
    \ use v2.7,2) by https://github.com/chriskacerguis/codeigniter-restserver/releases\
    \ and unzip it. Copy the following files into your CodeIgniter/application directory\
    \ from the corresponding directory in the Zip package.\n\n```\nCodeIgniter/\n\
    └── application/\n    ├── config/\n    │   └── rest.php\n    ├── controller/\n\
    \    │   └── api/\n    │       └── Example.php\n    └── libraries/\n        └──\
    \ Format.php\n    └── REST_Controller.php\n```\n\nCodeIgniter Rest Server is licensed\
    \ under the MIT License. See the [License Agreement for CodeIgniter Rest Server](https://github.com/chriskacerguis/codeigniter-restserver/blob/master/LICENSE).\n\
    \n# Fixing the CodeIgniter Rest Server Code\n\nUp to the present we have never\
    \ modified code to write tests, because we don't normally have to do so. However,\
    \ we have to modify CodeIgniter Rest Server in order to be able to write tests.\n\
    \n> **Testing Tip: Untestable Code**\nIf you can't write tests or it is hard to\
    \ write tests, it is a sign that your application code design should be improved.\n\
    \nFirst, replace require with `require_once` in the Example controller. If there\
    \ is more than one REST controller, we load them at the same time during execution,\
    \ which will result in *Fatal error: Cannot redeclare class REST_Controller* if\
    \ require is used."
