- pgno: 54
  md: "# PHPUnit Basics\n\nFortunately, PHPUnit includes functionality to repeat tests\
    \ like this. One method of doing so is with a Data Provider. Using this, we can\
    \ write tests like the following:\n\napplication/tests/libraries/Temperature_converter_test.php\n\
    \n```\n<?php\nclass Temperature_converter_test extends TestCase {\n  /**\n   *\
    \ @dataProvider provide_temperature_data\n   */\n  public function test_FtoC($degree,\
    \ $expected) {\n    $obj = new Temperature_converter();\n    $actual = $obj->FtoC($degree);\n\
    \    $this->assertEquals($expected, $actual, '', 0.01);\n  }\n\n  public function\
    \ provide_temperature_data() {\n    return [\n      // [Fahrenheit, Celsius]\n\
    \      [-40, -40.0],\n      [ 0, -17.8],\n      [ 32, 0.0],\n      [100, 37.8],\n\
    \      [212, 100.0],\n    ];\n  }\n}\n```\n\nFirst, the provide_temperature_data()\
    \ method was added. This is the method to provide data for testing. It returns\
    \ an array of arrays.\n\nSecond, the @dataProvider tag was added to the docblock\
    \ of the test_FtoC() method. This sets a data provider method for the test method.\n\
    \n```\n/**\n * @dataProvider provide_temperature_data\n */\n```"
