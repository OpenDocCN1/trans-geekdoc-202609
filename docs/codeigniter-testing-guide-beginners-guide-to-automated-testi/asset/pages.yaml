  md: '# # 11. Congratulations


    You’ve learned how to write tests for your applications. I hope you have enjoyed
    the book.

    Writing good tests now will help you catch mistakes earlier, and make it easier
    to change your code without introducing errors, saving time in the long run. It
    could also improve the design of your code.


    # ## Last Message


    We dedicated more pages to controller testing than any other type of testing in
    this book, but that is just because testing is more important to test models (or
    libraries) in most Codelegniter applications. Of course, it is better to test
    both controllers and models, but testing controllers is less important than testing
    models.


    Generally speaking, fat controllers are a bad practice. The most important code,
    usually *Models* or *Business Logic*, should be in your models (or libraries).
    This is the code for which tests should be written.


