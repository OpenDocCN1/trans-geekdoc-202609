  md: "# Unit Testing CLI Controllers\n\n+   - $this->seeder Seeder object)\n\nThe\
    \ glob() function uses the hard-coded argument APPPATH.'.database/seeds/*Seeder.php'.\
    \ basename() is a simple function and has no side-effects, so we use it as is.\
    \ We don't have to mock it.\n\nglob()² depends on the file system and has a hard-coded\
    \ argument. We should mock it.\n\nWe can create mock objects, but how do we mock\
    \ a global function? In this case, we can use Monkey Patching in ci-phpunit-test,\
    \ but it has some limitations. Monkey patch functions may cause errors if you\
    \ attempt to replace them, see the documentation³ for details.\n\nBy default,\
    \ only some global functions, like_mt_uniq(),md5(),time(), and date(), can be\
    \ patched. To patch the glob() function, we use the monkey patching configuration\
    \ in application/tests/Bootstrap.php.\n\n```\n```\n--- a/CodeIgniter/application/tests/Bootstrap.php\n\
    +++ b/CodeIgniter/application/tests/Bootstrap.php\n@@ -316,6 +316,7 @@ MonkeyManager::init[\n\
    \  // Additional functions to patch\n  'functions_to_patch' => [\n    //'random_string',\n\
    \    'glob',\n  ],\n  'exit_exception_classname' => 'PHPUnitTestException',\n\
    ]);\n```\n```\n\n> The listing above is in a format unified diff. It shows the\
    \ difference between two files. In short, add the green line starting with + to\
    \ the original file, to get the new file. See Conventions In This Book for details.\n\
    \nWe can patch the glob() function with the MonkeyPatch::patchFunction() method.\
    \ The first argument is the name of the function to patch. The second argument\
    \ is the return value. The third argument is the class and method name in which\
    \ to apply this patch."
