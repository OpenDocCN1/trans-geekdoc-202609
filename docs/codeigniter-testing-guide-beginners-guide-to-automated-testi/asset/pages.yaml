    # # 10.2 Writing Tests


    # # Conventions for Codeception Acceptance Tests


    Here are some basic conventions for the Codeception acceptance tests.


    +   - 1. Test files have the suffix Cept.php.

    - 2. The test code begins with $1 = new AcceptanceTester($scenario);

    - 3. The $1->wantTo() method defines your scenario (test name).


    Put the files in tests/acceptance directory.


    > Cept is a scenario-based format for test case file in Codeception. While we
    don''t use it in this book, Codeception also has a Cept format, which combines
    scenario-driven test approach with OOP design. If you want to group multiple testing
    scenarios into one, you should consider using Pest format. See the Pest Classes
    documentation for details.


    # # Our First Test


    Now we know the basic conventions, we can start to write our first acceptance
    test.


    http://codeception.com/docs/07-AdvancedUsage#Cest-Classes'
