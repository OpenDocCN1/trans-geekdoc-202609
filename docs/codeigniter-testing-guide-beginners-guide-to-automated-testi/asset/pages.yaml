  md: "# Unit Testing CLI Controllers\n\n```\nMonkeyPatch::patchMethod('Dbfxture',\
    \ [\n    'migrate' => null,\n    'seed' => null,\n]);\n```\n\nWith the code above,\
    \ the migrate() and seed() methods of the Dbfxture class will return null. We\
    \ can write test code for the all() method of the Dbfxture class like this:\n\n\
    application/tests/controllers/Dbfxture_test.php\n\n```\npublic function test_when_run_all_Then_migrate_and_seed_are_called()\
    \ {\n    MonkeyPatch::patchMethod('Dbfxture', [\n        'migrate' => null,\n\
    \        'seed' => null,\n    ]);\n    MonkeyPatch::verifyInvokedOnce('Dbfxture::migrate');\n\
    \    MonkeyPatch::verifyInvokedOnce('Dbfxture::seed');\n\n    $this->obj->all();\n\
    }\n```\n\nMonkeyPatch::verifyInvokedOnce() verifies that a patched class method\
    \ or a patched function was invoked only once.\n\nIn addition to verifyInvokedOnce(),\
    \ there are other methods to verify the number of times a monkey-patched method\
    \ or function has been invoked:\n\n+   - MonkeyPatch::verifyInvokedOnce($class_method,\
    \ $params) ... at least once\n- MonkeyPatch::verifyInvokedOnce($class_method,\
    \ $params) ... only once\n- MonkeyPatch::verifyInvokedMultipleTimes($class_method,\
    \ $count, $params) ... exactly count times\n- MonkeyPatch::verifyNeverInvoked($class_method,\
    \ $params) ... never\n\nRun the phpunit command and verify that the tests pass.\n\
    \n# 8.7 Checking Code Coverage\n\nBefore checking code coverage, remove the controllers/Dbfxture.php\
    \ line in phpunit.xml."
