  md: '# Testing REST Controllers


    curl is an open source command line tool and library for transferring data. It
    supports many protocols, including HTTP, HTTPS, FTP, IMAP, POP3, and SMTP.


    Open your terminal, navigate to the directory in CodeIgniter''s index.php is located,
    and run the following command.


    ```

    php -S 127.0.0.1:8000 index.php

    ```


    # Getting All of the Data


    When we send a GET request to api/example/users, it returns all the users'' data
    in JSON format. Open another terminal, and type the following command. The -X
    or --request option specifies the HTTP method.


    ```

    curl -X GET ''http://127.0.0.1:8000/api/example/users''

    ```


    You should see the following JSON output:


    ```

    [{"id":1,"name":"John","email":"john@example.com","fact":"Loves coding"},{"id":2,"name":"Jim","email":"jim@example.com","fact":"Developed
    on CodeIgniter"},{"id":3,"name":"Jane","email":"jane@example.com","fact":"Lives
    in the USA","0":{"hobb":["guitar","cycling"]}}}]

    ```


    You can add the -i or --include option to see the HTTP response headers.


    ```

    curl -X GET ''http://127.0.0.1:8000/api/example/users''

    HTTP/1.1 200 OK

    Host: 127.0.0.1:8000

    Connection: close

    X-Powered-By: PHP/5.2.26

    Content-Type: application/json; charset=utf-8

    ```


    ```

    [{"id":1,"name":"John","email":"john@example.com","fact":"Loves coding"},{"id":2,"name":"Jim","email":"jim@example.com","fact":"Developed
    on CodeIgniter"},{"id":3,"name":"Jane","email":"jane@example.com","fact":"Lives
    in the USA","0":{"hobb":["guitar","cycling"]}}}]

    ```


    If you want to see verbose output, add the -v or --verbose option.'
