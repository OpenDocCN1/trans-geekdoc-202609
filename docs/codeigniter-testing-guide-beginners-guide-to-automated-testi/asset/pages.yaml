  md: "# Creating a Mock Object for CI_Loader\n\nFirst we create a mock object for\
    \ CI_Loader. $this->load->database() loads the database classes and opens a connection\
    \ to the database. We are going to write tests without the database, so we don't\
    \ want to call the real method. We have to replace it with a mock object.\n\n\
    If we insist on unit testing, we have to mock all methods in CI_Loader. Since\
    \ we can't load a lot of classes and other files without CI_Loader, we only mock\
    \ the database() method to prevent it connecting to the database. Yes, this is\
    \ not unit testing, but we are avoiding extremes, so this is not a problem.\n\n\
    The test case and setUp() will look like this:\n\n```\nclass News_model_with_mocks\
    \ extends TestCase\n{\n    public function setUp() {\n        // Reset CodeIgniter\
    \ super object\n        $this->resetInstance();\n\n        // Create mock object\
    \ for CI_Loader\n        $loader = $this->getMockBuilder('CI_loader')\n      \
    \      ->setMethods(['database'])\n            ->getMock();\n        $loader->method('database')->willReturn($loader);\n\
    \n        // Inject mock object into CodeIgniter super object\n        $this->load\
    \ = $loader;\n\n        if (! class_exists('CI_DB', false)) {\n            //\
    \ Define CI_DB class\n            eval('class CI_DB extends CI_DB_query_builder\
    \ {}');\n        }\n\n        $this->obj = new News_model();\n    }\n}\n```\n\n\
    First, we reset the CodeIgniter super object to prevent the previous test state\
    \ from affecting the next test. Next, we create a partial mock for CI_loader and\
    \ inject it into the CodeIgniter super object.\n\nNext, we define the CI_DB class,\
    \ if it does not already exist. We replaced the $this->load->database() method\
    \ with a mock method which does nothing, so we have to load the expected"
