  md: "# Unit Testing for Cto\n\n$mock2->CtoF(100)\n=> 212.0\n\nThis time, the method\
    \ did not specify when we created the mock returns real values, not null, Mocks\
    \ like this are called Partial Mocks. When we use setMethods(), we tell PHPUnit\
    \ to mock the specific methods included in the array, but other methods will call\
    \ the original class, and cannot be configured using your $mock2 object.\n\n#\
    \ Verifying Expectations\n\nWe defined and looked at mock's output above. We can\
    \ also check mock's input. In the code below, the mock expects that the FtoC()\
    \ method is called once with the value 0 passed to the parameter.\n\napplication/tests/models/Play_with_mocks_test.php\n\
    \n```\npublic function test_mock_expectations() {\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->once())\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->FtoC(0);\n}\n```\n\nThere are no assertions in\
    \ the test method, but it is a real test. If you change or remove \"$mock->FtoC(0);\"\
    , the test will fail.\nIn addition to $this->once(), PHPUnit uses other methods\
    \ to verify the number of invocations:\n\n+   - $this->any() ... any number of\
    \ times, including 0\n- $this->once() ... only once\n- $this->exactly($count)\
    \ ... exactly $count times\n- $this->at($index) ... See example below\n- $this->never()\
    \ ... never\n- $this->atLeastOnce() ... at least once\n\nThe following is an example\
    \ of a passing test using the $this->at() method."
