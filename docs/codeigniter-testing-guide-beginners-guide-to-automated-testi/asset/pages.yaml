  md: "Unit Testing CLI Controllers\n\n# 8.6 Monkey Patching\n\nMonkey Patching allows\
    \ us to replace code on the fly without modifying the original code. The monkey\
    \ patching provided by ci-phpunit-test can patch exit() or die(), as well as some\
    \ global functions and methods of user-defined classes. \n\nWe have already used\
    \ it to patch exit() in the previous section. Without monkey patching, we can't\
    \ usually test code which contains exit().\n\nMonkey patching is a powerful tool\
    \ for testing, so use it with caution. \n\n# **Testing Tip: Untestable without\
    \ Monkey Patching**\n\nIf you can't write tests without monkey patching, it may\
    \ be a sign that your application code could be improved.\n\nIt would probably\
    \ be not to use monkey patching if you don't have to do so. It has a negative\
    \ impact on the speed of testing. You will probably need it when you come across\
    \ otherwise untestable code which you can't or want to modify, like third party\
    \ libraries.\n\n# Patching Functions\n\nLet's use the seed() method of the controller.\
    \ To write unit tests, we have to find all of the dependencies and replace them\
    \ with mocks.\n\napplication/controllers/Dbfixture.php\n\n```\npublic function\
    \ seed() {\n    $this->load->library('{*seeder}');\n    foreach (glob(APPPATH.'.database/seeds/*Seeder.php')\
    \ as $file) {\n        $seeder = basename($file, '.php');\n        $this->seeder->call($seeder);\n\
    \    }\n}\n```\n\nThe above code has five dependencies:\n\n+   - $this->load(CI_Loader\
    \ object)\n- glob() function\n- APPPATH constant\n- basename() function"
