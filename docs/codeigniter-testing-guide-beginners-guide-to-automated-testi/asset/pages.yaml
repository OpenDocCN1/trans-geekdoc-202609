- pgno: 154
  md: '# What is Selenium Server?


    Selenium is a project that automates browsers made up of three parts: the WebDriver,
    the Server, and the client. Selenium WebDriver is a driver to manipulate a browser.
    Selenium Server is a Java server application that communicates with Selenium client
    (in our case, facebook/webdriver in Codeception) and Selenium WebDriver.


    In summary, Codeception acts as our Selenium client, and uses Selenium Server
    to control the browser(s) used in our tests. Selenium Server uses the WebDriver(s)
    to control the browser(s) specified when we run Codeception.


    # Installing Selenium Server


    Download the latest version (in this book we use v2.48.2) from http://docs.seleniumhq.org/download/
    and place the downloaded selenium-server-standalone-x.x.x.jar in the root directory
    of your PHP project.


    ```

    CodeIgniter/

    - selenium-server-standalone-2.48.2.jar

    ```


    # Initializing Codeception


    To begin, initialize Codeception by running the following command:


    ```

    $ php codecept.phar bootstrap

    ```


    This command creates files and a tests directory. You should see output similar
    to this:


    ```

    Initializing Codeception in .../CodeIgniter


    File codeception.yml created      <- global configuration

    tests/unit created               <- unit tests

    tests/unit.suite.yml written      <- unit suite configuration

    tests/functional created        <- functional tests

    tests/functional.suite.yml written <- functional tests suite configuration

    tests/acceptance created        <- acceptance tests

    tests/acceptance.suite.yml written <- acceptance tests suite configuration

    tests/_output was added to .gitignore

    tests/_bootstrap.php written      <- global bootstrap file

    ```


    > *https://github.com/facebook/php-webdriver'
