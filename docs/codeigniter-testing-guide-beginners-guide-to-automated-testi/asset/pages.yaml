- pgno: 15
  md: "# 1. What is Automated Testing?\n\nWelcome to the testing world!\n\n this chapter,\
    \ we will learn about the concept of automated testing and learn why and what\
    \ you should test. As we go, we will begin to develop the testing strategy which\
    \ will be applied by this book.\n\n# 1.1 Primitive Example\n\nWe will begin with\
    \ a very simple example, a function which returns 'Hello World!'. For this, we'll\
    \ place the function in a file called hello.php in a location easily accessible\
    \ to our server.\n\nhello.php\n\n```\n```php\n<?php\nfunction hello()\n{\n   \
    \ return 'Hello World!';\n}\n```\n```\n\nHow do we test this function?\n\n> Exercise\n\
    At this point, please stop and think about how you would test this function.\n\
    \n# Manual Testing\n\nWe'll start with a manual test, printing the result of the\
    \ function in a page viewed by your browser. We'll place this function in another\
    \ file, called hello_test_with_your_eyes.php in the same location as the hello.php\
    \ file which holds our hello() function."
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What is Automated Testing


    hello_test_with_your_eyes.php


    ```

    <?php

    require __DIR__ . ''/hello.php'';

    echo hello();

    ```


    If you navigate to hello_test_with_your_eyes.php in your browser and see Hello
    World!, the function and the test both work.


    Alternatively, you can just run it from PHP’s Command Line Interface (CLI):


    ```

    $ php hello_test_with_your_eyes.php

    Hello World!

    ```


    This is manual testing.


    All PHP developers have tested this at some point. Manual testing with your web
    browser is very common. You write some code expecting a outcome, then you run
    the code to verify that you receive the expected outcome. If you look at the web
    page you built to verify you aren’t receiving errors and the outcome looks more
    or less as you expect, you are already testing your application.


    However, if you test your application by yourself, and by manually checking every
    possible action the user might take, it could take some time to test. If your
    application is very big, testing every possibility in the entire application could
    take a very long time, which means you cannot possibly test everything often.


    # Automated Testing


    What if, instead of manually checking the results in a web browser, you write
    code to test your application? The following is some very primitive test code
    for our primitive hello.php application. We would place this code in a file called
    hello_test_automated.php alongside our application and our manual test.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# hello_test_automated.php\n\n```\n<?php\nerror_reporting(-1);\nrequire __DIR__\
    \ . './hello.php';\nfunction assertTrue($condition) {\n    if (!$condition) {\n\
    \        throw new Exception('Assertion failed.');\n    }\n}\n$actual = hello();\n\
    $expected = 'Hello World!';\nassertTrue($expected === $actual);\n```\n\n> If you\
    \ run this code, you probably won't see anything, unless the hello() function\
    \ returns something unexpected, in which case you will receive a fatal PHP error\
    \ and a stack trace.\n\nIf our hello() function does not return 'Hello World!',\
    \ our test will fail. Since the code verifies that the result of executing the\
    \ function matches the expected result, rather than verifying the result in a\
    \ browser (or in the CLI) for ourselves, we call this automated testing. Using\
    \ automated tests, you can run the test every time you make a change, or at a\
    \ certain time every day because it is PHP code!\n\nWhen writing an automated\
    \ test, think of what you would do to test the code by or how you might confirm\
    \ the code is working properly, write code which will do the testing for you.\
    \ In the long run, this means you can spend less manually testing your code, and\
    \ it will protect your code base from unexpected changes.\n\nAutomated testing\
    \ has two features:\n\n+   - it is very fast,\n- so you can run tests often.\n\
    \n# Testing Tip: Avoid Slow Tests\n\nSpeed is the one of the most important things\
    \ in testing. If you have slow tests, they prevent you from testing. If you find\
    \ that one or more of your tests is slow, you should probably try to speed it\
    \ up."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# What is Automated Testing?


    This example is simple, so you might think the test is nonsense. However, if you
    expect a certain output given a certain input, the complexity of the function
    you are testing has very little impact on the complexity of the test, so even
    very complicated functions might have tests with code which is similar to the
    test we created for our primitive hello function.


    # 1.2 Why should you write test code?


    You don''t have to write test code, even if you choose not to, it is better that
    you know how to write it. Thinking about how you would write a test for your code
    considers how your code might fail and what expectations you have for a given
    piece of code.


    According to “Top 12 Reasons to Write Unit Tests¹, you will get the following
    benefits when you test code:


    +   1. Tests Reduce Bugs in New Features

    2. Tests Reduce Bugs in Existing Features

    3. Tests Are Good Documentation

    4. Tests Reduce the Cost of Change

    5. Tests Improve Design

    6. Tests Allow Refactoring

    7. Tests Constrain Features

    8. Tests Defend Against Other Programmers

    9. Testing Is Fun

    10. Tests Forces You to Slow Down and Think

    11. Tests Makes Development Faster

    12. Tests Reduce Fear


    In my opinion, the most important thing is reducing fear. If we have well-tested
    code, we can change and improve it without fear that we might break existing code.


    # 1.3 Finding the Middle Way


    Have you ever heard about the right way to write unit tests?


    +   - Don''t access the database.

    - Don''t use new operators (use dependency injection and factories).

    - Rewrite your code to be more testable.

    - Don''t interact with the file system, use a virtual file system instead.


    > http://www.onjava.com/pub/a/onjava/2003/04/02/javascapeckbk.html'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# What is Automated Testing?


    Each of these is true in a sense, but not in all situations. In this book, I don''t
    say such things, instead recommend following "The Way Of Testivus":


    +   - If you write code, write tests

    - Don''t get stuck on unit testing dogma

    - Embrace unit testing karma

    - Think of code and test as one

    - The test is more important than the unit

    - The best time to test is when the code is fresh

    - Tests do not run away

    - An imperfect test is better than a perfect test someday

    - An ugly test is better than no test

    - Sometimes, the test justifies the

    - Only fools use no tools

    - Good tests fail


    Avoid extremes, find the middle way. We prefer simple and easy to understand solutions
    in this book.


    # 1.4 What should you test?


    This is the most difficult question to answer, and in some cases it''s nearly
    impossible to answer. Instead, it is better to ask what we don''t have to test.


    If we absolutely think we don''t have to test *something*, then we don''t test
    it. If we are not sure, we test everything.


    However, we are trying to find the middle way, we''ll come back to this idea later,
    in Chapter 3, Coverage. For now, rather than worrying about everything, we''re
    going to focus on writing tests whenever we can and acquiring good test karma.


    # 1.5 TDD or Not TDD


    *Test Development (TDD)* is a software development process in which you write
    code first, then write code which passes the tests, and repeat automated testing
    in very short development cycles.


    We prefer TDD, but you can choose whatever development process works for you.
    If we''d return to *The Way Of Testivus*, which says "Think of code and test as
    one" and "The best time to test is when the code is fresh."


    According to James Shore¹, the development process in TDD is the following:'
