  md: "# Database Fixtures\n\nSince the model we use the database to store data, and\
    \ the data changes if you insert a news item, we have to prepare Database Fixtures\
    \ before we can write test code for the model.\n\nFor example, we start with empty\
    \ table. When you insert a news item during test execution, the table has one\
    \ record. You run the test twice, the table has two records. The state of the\
    \ table changes every time you run the tests.\n\nIf you write a test to check\
    \ the total count of the news items, the test will fail the next time you run\
    \ the tests.\n\n# Testing Tip: Repeatable\n\nGood tests do not depend on execution\
    \ order or time. If the tests pass, they should always pass.\n\nSo we have to\
    \ fix the database state before running the tests. In other words, we have to\
    \ set the database to a known state before we can run the tests.\n\nTo do so,\
    \ we use Database Migration and Database Seeding. We created a migration file\
    \ in the Database Migration section.\n\nTo run migrations automatically in testing,\
    \ we modify our TestCase class.\n\n```\n<?php\napplication/tests/TestCase.php\n\
    class TestCase extends CIPHPUnitTestCase {\n    private static $migrate = false;\n\
    \n    public static function setUpBeforeClass() {\n        parent::setUpBeforeClass();\n\
    \n        // Run migrations once\n        if (! self::$migrate) {\n          \
    \  $CI = &get_instance();\n            $CI->load->database();\n            $CI->load->library('migration');\n\
    \            if ($CI->migration->current() === false) {\n                throw\
    \ new RuntimeException($this->migration->error_string());\n            }\n   \
    \     }\n    }\n}\n```"
