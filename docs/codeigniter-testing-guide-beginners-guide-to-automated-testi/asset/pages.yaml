    \  $expected = 37.8;\n  $this->assertEquals($expected, $actual, '', 0.01);\n}\n\
    ```\n\nThe listing is in a format unified diff. It shows the difference between\
    \ two files. The format starts with two-line header, with the path and name of\
    \ the original file preceded by --- on the first line, and the new file preceded\
    \ by + on the second line. In some situations, each line could include a date/time\
    \ stamp, as well.\n\nIn this case, the original file and the new file are the\
    \ same file (this might not be the case if the file was moved or renamed, or if\
    \ the diff was to indicate that the content was moved to a new file). Following\
    \ this are one or more change hunks which show where the files differ.\n\nThe\
    \ line \"-6,7 +6,7\" indicates the hunk range. The first set of numbers (\"-6,7\"\
    ) indicates the lines in the original file, the second set (\"+6,7\") indicates\
    \ the lines in the new file. These numbers are in the format 'start,count', where\
    \ the 'count' may be omitted if the hunk includes only one line. So, in this,\
    \ the hunk starts at 6 lines in file and contains 7 lines in both files.\n\nThe\
    \ contents of the hunk (following the hunk range) contain the lines from the files,\
    \ with additions preceded with + (highlighted in green), and deletions preceded\
    \ with - (highlighted in red). The remaining lines (not preceded with either a\
    \ - +) are provided for context.\n\nIn short, remove the line(s) starting with\
    \ - from the original file and add the line(s) starting with + to get the new\
    \ file.\n\nThis is an example of a Bash command and its output:\n\n```\n$ echo\
    \ 'Hello World!'\nHello World!\n```\n\nThis is an example of a note or general\
    \ information.\n\nThis is an example of a tip or suggestion."
