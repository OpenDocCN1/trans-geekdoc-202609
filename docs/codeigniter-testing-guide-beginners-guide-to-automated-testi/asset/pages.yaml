  md: "# Testing REST Controllers\n\n19 }\n20 }\n\n$this->request('GET', 'api/example/users')\
    \ throws an exception, so we catch it. The $this-\nrequest() method has turned\
    \ on output buffering to capture the output of the controller, so we\nget the\
    \ buffer contents using PHP's ob_get_clean() function in the catch block.\n\n\
    The value of $output is in JSON format. We can convert it to an array using the\
    \ Json_\ndecode() function in PHP. We then assert the output data has three elements,\
    \ and the HTTP\nresponse code is 200 (OK).\n\nRun the phpunit command, and verify\
    \ that the test passes.\n\n# Getting User's Data\n\nIf we use an ID, it returns\
    \ the user's data in JSON format.\n\n```\n$ curl 'http://127.0.0.1:8000/api/example/users/id/1'\n\
    (\"id\":\"1\",\"name\":\"John\",\"email\":\"john@example.com\",\"fact\":\"Loves\
    \ coding\")\n```\n\nWe can write a test method like the following:\n\n```\napplication/tests/controllers/api/Example_id_test.php\n\
    public function test_when_get_valid_user_id_Then_returns_the_user_data()\n{\n\
    \    $json = {\n        \"id\":\"1\",\"name\":\"John\",\"email\":\"john@example.com\"\
    ,\n        \"fact\":\"Loves coding\"\n    };\n\n$output = $this->request('GET',\
    \ 'api/example/users/id/1');\n$this->assertJsonStringEqualsString($json, $output);\n\
    $this->assertResponseCode(200);\n}\n```\n\nIn this case, the controller does not\
    \ call exit(), so we don't need the try and catch blocks.\n$this->assertJsonStringEqualsString()\
    \ method in PHPUnit checks whether the value of\nJSON string received from the\
    \ request (second argument) matches the expected JSON string\n(the first argument).\n\
    \nRun the phpunit command, and verify that the test passes.\n\nIf there is no\
    \ user with the provided ID, it returns an error message.\n\n> *http://php.net/en/ob_get_clean\n\
    *http://php.net/en/json_decode"
