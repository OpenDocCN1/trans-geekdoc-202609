  md: "# Unit Testing for Models\n\napplication/tests/models/Play_with_mocks_test.php\n\
    \n```\npublic function test_mock_at_method()\n{\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->at(0))\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->expects($this->at(1))\n        ->method('CtoF')\n\
    \        ->with(100);\n\n    $mock->FtoC(0);\n    $mock->CtoF(100);\n}\n```\n\n\
    The argument for $this->at() method refers to the zero-based index of all method\
    \ invocations for a given mock object. So, $mock->expects($this->at(0))->method('FtoC')->with(0);\
    \ configures the mock to expect the first method invocation after the: mock is\
    \ defined to be FtoC(0), and $mock->expects($this->at(1))->method('CtoF')->with(100);\
    \ configures the mock to expect the second method invocation to be CtoF(100).\
    \ If we changed the index passed to call at at() or changed the order in which\
    \ the FtoC() and CtoF() methods were called, the tests would fail.\n\n# 6.3 Testing\
    \ Models without Database\n\nIn the previous chapter, we wrote test code for a\
    \ model that uses the database (see Chapter 5, Case for News Model). In functional\
    \ testing, we need the database to run the tests.\n\nDatabase testing has its\
    \ merits in we can test real database interaction and confirm the stored data.\
    \ It is intuitive and easy to understand what we are doing, but it takes time.\
    \ The more fixture data we have, the more time it takes to write and run our tests.\n\
    \nWe can write test code for models without the database, if we use test doubles.\n\
    \n# Testing the get_news() Method with Mocks\n\nLet’s look at the News_model class\
    \ again. To test it, we need to find all of the dependencies and replace them\
    \ with mocks.\n\n+   - If class A uses, or otherwise depends on class B, B is\
    \ a dependency of A."
