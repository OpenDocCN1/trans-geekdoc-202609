    $this->verifyInvokedMultipleTimes() method is a helper method for PHPUnit Mock
    Objects in ci-phpunit.


    ```

    $this->verifyInvokedMultipleTimes($seeder, ''call'', 3, [

    [''NewsSeeder''],

    [''BookSeeder''],

    [''ShopSeeder''],

    ]);

    ```


    The above code is equivalent to following:


    ```

    $seeder->expects($this->exactly(3))

    ->method(''call'')

    ->withConsecutive(

    [''NewsSeeder''],

    [''BookSeeder''],

    [''ShopSeeder''],

    );

    ```


    The withConsecutive() method can take any number of arrays arguments, depending
    on the calls you want to test against. Each array is a list of constraints corresponding
    to the arguments of the method being mocked, when calling with().


    Run the phpunit command and execute the tests.


