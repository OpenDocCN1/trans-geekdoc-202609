- pgno: 8
  md: '# # Preface


    When I learned PHP for the first time, I did not know about writing test code
    at all. Nobody around me was writing test code. There was no PHPUnit (a testing
    framework for PHP), yet. In 2004, PHPUnit 1.0.0 was released for PHP4. In the
    same year, PHPUnit 2.0.0 was released for PHP5. However, I have never used PHPUnit
    1 or 2.


    When I found CodeIgniter (a PHP web application framework) for the first time,
    in 2007, I had a Unit testing class, but there was no test code for the framework
    itself.


    Now, in more than 10 years have passed since PHPUnit 1.0.0. CodeIgniter 3.0 has
    its own test code with PHPUnit, and the code for those tests is around 60%. We
    are progressing a bit by day by day.


    Have ever written test code for your web application? If you haven''t, you might
    imagine that writing test code will be very difficult or bothersome. Maybe you
    want to write test code, but don''t know how to do so.


    It is common to over-estimate the cost of learning something, and testing is no
    exception. After reading a tutorial for PHPUnit, I thought, "How do I test my
    application?" I had trouble seeing the similarities between the tests in the tutorial
    and the tests I need to write for my own application.


    This book is a beginners'' guide for automated testing of PHP applications. Of
    course, you will be able to write test code for any PHP applications after reading
    this book, but the focus will be on web applications.


    I eschew complexity, favoring simple solutions. I use simple and easy to understand
    solutions in the book, so you won''t get lost. Let''s keep going!


    # ## The Book at a Glance


    If you want to know about this book, this is a great place to start. What follows
    is a very quick overview of what each chapter covers. This should give you an
    idea of what you''s ahead, or serve as a starting point if you want to find a
    particular portion of the content to review later.


    # ### Chapter 1: What is Automated Testing?


    Let''s begin learning about automated testing. First we will explore the basic
    concepts of automated testing. We will find out why and what you should test.
    At the same time, I will explain the ideas and testing policies used by this book.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Chapter 2: Setting Up the Testing Environment


    To run tests in your PHP environment, you will need to install some additional
    software. For this book, this includes CodeIgniter, PHPUnit and a tool which acts
    as a bridge between them, ci-phpunit-test. If you don''t know command line, you
    can use VisualPHPUnit to run tests via your web browser.


    # Chapter 3: Test Jargon


    We define test jargon here. One of the annoying and confusing things in testing
    is the new vocabulary required to understand it. By the end of this chapter we''ll
    help you understand the difference between Unit, Integration, and System testing;
    Functional and Acceptance testing; Fixtures and Mocks; and more.


    # Chapter 4: PHPUnit Basics


    In this chapter, we will learn the basics of PHPUnit. We will run PHPUnit and
    learn how to configure it. After, we will study PHPUnit conventions and write
    our first test. We also cover PHPUnit functionality, data providers, fixtures,
    and assertions.


    # Chapter 5: Testing a Simple MVC Application


    You''ve already learned how to write test code, so here we write tests for a CodeIgniter
    Tutorial application. We will write tests for a controller and a model. In this
    chapter, we will use the database for model testing.


    # Chapter 6: Unit Testing for Models


    We will learn more about testing models. We will write tests for models without
    using the database. To do this, we will learn about PHPUnit mock objects.


    # Chapter 7: Testing Controllers


    We will learn more about testing controllers in this and the next two chapters.
    In this chapter, we will write tests for a controller for reviewing, and write
    tests with mocking models. We also will write test cases for authentication and
    redirects.


    # Chapter 8: Unit Testing CLI Controllers


    We will continue learning to write tests for controllers. In this chapter, we
    will write unit tests for controllers, and learn about monkey patching.


    # Chapter 9: Testing REST Controllers


    In this chapter, we will learn about testing REST controllers. You will learn
    how to send (emulate) requests with methods other than GET and POST.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Chapter 10: Browser Testing with Codeception


    In previous chapters, we have been using PHPUnit. In this chapter, we will learn
    about another testing tool. We will install *Codeception*, learn to configure
    it, and write tests which work with the web browser.


    # What You Need for This Book


    I assume you have a general understanding of PHP 5.4 and object-oriented programming
    (OOP), and you have PHP 5.4, 5.5, or 5.6 installed.


    If you know CodeIgniter, you may have an easier time with some parts of this book,
    but if you don''t know it, don''t worry. CodeIgniter is an MVC framework that
    is very easy to learn and understand, and it has great documentation. I will explain
    CodeIgniter-specific conventions and functionality in this book.


    I do not assume you are using a specific operating system. However, my code examples
    are written for Mac OS X. Windows. Bash commands are provided for Mac OS X and
    will also work on Ubuntu. I have not tested them on Ubuntu, but they will probably
    work.


    We use the following software in this book:


    +   * PHP 5.5 (You can use PHP 5.4 or 5.6)

    * CodeIgniter¹ 3.0

    * ci-phpunit-test² 0.10

    * PHPUnit³ 4.8

    * Codeception⁴ 2.1

    * Selenium Standalone Server*⁵ 2.48


    # Who should read This Book?


    This book is for PHP developers who don''t know *Automated Testing* or *Unit Testing*,
    or for those looking for help testing CodeIgniter applications.


    If one or more of the lines below sounds familiar, this book is perfect for you!


    +   * I have never written test code.

    * I want to write test code, but I don''t know how.

    * I tried to write test code in the past, but I didn''t quite figure it out.


    > ¹http://www.codeigniter.com/

    ²http://kenjis.github.io/ci-phpunit-test/

    ³https://phpunit.de/

    ⁴http://codeception.com/

    ⁵http://www.selenium.org/'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Why PHPUnit?


    PHPUnit is the de facto standard Testing Framework in the PHP world.


    These popular PHP frameworks use PHPUnit for their own tests, and they provide
    support for application testing with PHPUnit:


    +   - CakePHP

    - FuelPHP

    - Laravel

    - Symfony

    - Yii

    - Zend Framework


    CodeIgniter 3.0 uses PHPUnit for testing its system code. Support for application
    testing with PHPUnit is currently planned for CodeIgniter 4.0.


    # Is This a CodeIgniter Book?


    This book is not specifically for CodeIgniter, but we use CodeIgniter applications
    in our examples. Probably 85% of the book''s content is not specific to CodeIgniter,
    and is applicable to testing any PHP application.


    So, if you want to learn Automated Testing in PHP, this book is still good for
    you. Most of the techniques outlined in this book can be applied to any other
    PHP framework, and even to other languages.


    In modern web development, you probably use a framework. I don''t know what framework
    you use or like, but if you learn testing with a framework, you can write test
    code more easily in your real development environment.


    CodeIgniter is one of the most easily understood frameworks currently available
    for PHP. This will allow you to spend more of your time learning about testing,
    even if you don''t know CodeIgniter.


    Another reason I chose CodeIgniter as the framework used in this book is that
    too many CodeIgniter developers don''t write test code. So, I''m hoping that choosing
    CodeIgniter for my examples, this book will promote better testing practices in
    the CodeIgniter community.


    # Is Testing PHP Applications Difficult?


    No, but you need the right tools and you need to know how to write tests.'
  merge: -1
  img_proc: true
