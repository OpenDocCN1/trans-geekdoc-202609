    \ do we mock a global function? In this case, we can use Monkey Patching in ci-phpunit-test,\
    \ but it has some limitations. Monkey patch functions may cause errors if you\
    \ attempt to replace them, see the documentation³ for details.\n\nBy default,\
    \ only some global functions, like `mt_uniq()`, `md5()`, `time()`, and `date()`,\
    \ can be patched. To patch the `glob()` function, we use the monkey patching configuration\
    \ in `application/tests/Bootstrap.php`.\n\n```\n--- a/CodeIgniter/application/tests/Bootstrap.php\n\
    +++ b/CodeIgniter/application/tests/Bootstrap.php\n@@ -316,6 +316,7 @@ MonkeyManager::init[\n\
    \  // Additional functions to patch\n  'functions_to_patch' => [\n    //'random_string',\n\
    \    'glob',\n  ],\n  'exit_exception_classname' => 'PHPUnitTestException',\n\
    ]);\n```\n\n> The listing above is in a format unified diff. It shows the difference\
    \ between two files. In short, add the green line starting with + to the original\
    \ file, to get the new file. See Conventions In This Book for details.\n\nWe can\
    \ patch the `glob()` function with the `MonkeyPatch::patchFunction()` method.\
    \ The first argument is the name of the function to patch. The second argument\
    \ is the return value. The third argument is the class and method name in which\
    \ to apply this patch.\n\n## Unit Testing CLI Controllers\n\n```\nMonkeyPatch::patchFunction('glob',\
    \ [\n    '/application/database/seeds/NewsSeeder.php',\n    '/application/database/seeds/BookSeeder.php',\n\
    \    '/application/database/seeds/ShopSeeder.php',\n], 'Dbfixture::seed');\n```\n\
    \nThe glob function will be patched only in the `Dbfixture::seed()` method, and\
    \ it will return the array passed to the `MonkeyPatch::patchFunction()` method's\
    \ second argument.\n\n- If you call `MonkeyPatch::patchFunction()` without the\
    \ third argument, all of the functions (located in include_paths and not in exclude_paths\
    \ in the monkey patching configuration in the `application/tests/Bootstrap.php`\
    \ file) called during the test execution will be replaced.\n\nUsing `MonkeyPatch::patchFunction()`,\
    \ we can write a test method like the following:\n`application/tests/controllers/Dbfixture_test.php`\n\
    \n```php\npublic function test_when_run_seed_Then_seeders_are_called() {\n   \
    \ // Patch on glob() function\n    MonkeyPatch::patchFunction('glob', [\n    \
    \    '/application/database/seeds/NewsSeeder.php',\n        '/application/database/seeds/BookSeeder.php',\n\
    \        '/application/database/seeds/ShopSeeder.php',\n        'Dbfixture::seed';\n\
    \    ]);\n\n    // Create mock object for CI_Loader\n    $loader = $this->getDouble(\n\
    \        'CI_Loader',\n        'library' => null,\n    );\n\n    // Create mock\
    \ object for Seeder\n    $seeder = $this->getDouble('Seeder', ['call' => null]);\n\
    \    $this->verifyInvokedMultipleTimes($seeder, 'call', 3, [\n        ['NewsSeeder'],\n\
    \        ['BookSeeder'],\n        ['ShopSeeder'],\n    ]);\n}\n```\n\n## Unit\
    \ Testing CLI Controllers\n\n```php\n// Inject mock objects\n$this->obj->load\
    \ = $loader;\n$this->obj->seeder = $seeder;\n\n$this->obj->seed();\n```\n\n`$this->verifyInvokedMultipleTimes()`\
    \ method is a helper method for PHPUnit Mock Objects in ci-phpunit.\n\n```php\n\
    $this->verifyInvokedMultipleTimes($seeder, 'call', 3, [\n    ['NewsSeeder'],\n\
    \    ['BookSeeder'],\n    ['ShopSeeder'],\n]);\n```\n\nThe above code is equivalent\
    \ to following:\n\n```php\n$seeder->expects($this->exactly(3))\n->method('call')\n\
    ->withConsecutive(\n    ['NewsSeeder'],\n    ['BookSeeder'],\n    ['ShopSeeder'],\n\
    );\n```\n\nThe `withConsecutive()` method can take any number of arrays arguments,\
    \ depending on the calls you want to test against. Each array is a list of constraints\
    \ corresponding to the arguments of the method being mocked, when calling with().\n\
    \nRun the phpunit command and execute the tests.\n\n## Patching Class Methods\n\
    \nYou can patch user-defined class methods with `MonkeyPatch::patchMethod()`.\
    \ The first argument is the class name. The second argument is an array containing\
    \ the method name and its return value:\n\n## Unit Testing CLI Controllers\n\n\
    ```php\nMonkeyPatch::patchMethod('Dbfixture', [\n    'migrate' => null,\n    'seed'\
    \ => null,\n]);\n```\n\nWith the code above, the `migrate()` and `seed()` methods\
    \ of the `Dbfixture` class will return null. We can write test code for the `all()`\
    \ method of the `Dbfixture` class like this:\n\n`application/tests/controllers/Dbfi_test.php`\n\
    \n```php\npublic function test_when_run_all_Then_migrate_and_seed_are_called()\
    \ {\n    MonkeyPatch::patchMethod('Dbfixture', [\n        'migrate' => null,\n\
    \        'seed' => null,\n    ]);\n    MonkeyPatch::verifyInvokedOnce('Dbfixture::migrate');\n\
    \    MonkeyPatch::verifyInvokedOnce('Dbfixture::seed');\n\n    $this->obj->all();\n\
    }\n```\n\n`MonkeyPatch::verifyInvokedOnce()` verifies that a patched class method\
    \ or a patched function was invoked only once.\n\nIn addition to `verifyInvokedOnce()`,\
    \ there are other methods to verify the number of times a monkey-patched method\
    \ or function has been invoked:\n\n- `MonkeyPatch::verifyInvokedOnce($class_method,\
    \ $params)` ... at least once\n- `MonkeyPatch::verifyInvokedOnce($class_method,\
    \ $params)` ... only once\n- `MonkeyPatch::verifyInvokedMultipleTimes($class_method,\
    \ $count, $params)` ... exactly count times\n- `MonkeyPatch::verifyNeverInvoked($class_method,\
    \ $params)` ... never\n\nRun the phpunit command and verify that the tests pass.\n\
    \n## 8.7 Checking Code Coverage\n\nBefore checking code coverage, remove the `controllers/Dbfixture.php`\
    \ line in phpunit.\n\n```\n--- a/CodeIgniter/application/tests/phpunit.xml\n+++\
    \ b/CodeIgniter/application/tests/phpunit.xml\n@@ -17,7 +17,6 @@\n  <directory\
    \ suffix=\".php\">hooks</directory>\n  <exclude>\n    <file>controllers/Dbfi.php</file>\n\
    \    <file>libraries/Seeder.php</file>\n  </exclude>\n```\n\nThe listing above\
    \ is in a format unified diff. It shows the difference between two files. In short,\
    \ remove the red line starting with - from the original file and add the green\
    \ line starting with +, to get the new file. See Conventions in This Book for\
    \ details.\n\n## 9.1 CodeIgniter Rest Server\n\n**CodeIgniter Rest Server** is\
    \ a fully RESTful implementation for CodeIgniter.\nDownload the latest version\
    \ (in this book v2) by https://github.com/chaceris/codeigniter-restserver and\
    \ unzip it. Copy the following files into your CodeIgniter directory.\n\n```\n\
    CodeIgniter/\n└── application/\n    ├── config/\n    │   └── rest.php\n    ├──\
    \ controller/\n    │   └── api/\n    │       └── Example.php\n    ├── libraries/\n\
    \    │   └── Format.php\n    └── REST_Controller.php\n```\n\nCodeIgniter Rest\
    \ Server is licensed under the MIT License. See the [License Agreement for CodeIgniter\
    \ Rest](https://github.com/chaceris/codeigniter-restserver/blob/master/LICENSE).\n\
    \n## Fixing the CodeIgniter Rest Server\n\nUp to the present we never modified\
    \ code to write tests. However, we have to modify CodeIgniter Rest Server in order\
    \ to be able to test.\n\n> **Testing Tip: Untestable Code**\nIf you can't write\
    \ tests or it is hard to write tests, it is a sign that your application design\
    \ should be improved.\n\nFirst, replace `require` with `require_once` in the Example\
    \ controller. If there is more than one REST controller, we load them at the same\
    \ time, which will result in *Fatal error: Cannot redeclare class REST_Controller*\
    \ if require is used.\n\n## Testing Rest Controllers\n\n```php\n--- a/CodeIgniter/application/controllers/api/Example.php\n\
    +++ b/CodeIgniter/application/controllers/api/Example.php\n@@ -3,7 +3,7 @@\ndefined('BASEPATH')\
    \ OR exit('No direct access allowed');\n```\n\n// This can be removed if you use\
    \ __autoload() in config.php OR Modular Extensions\n-require APPPATH.'libraries/REST_Controller.php';\n\
    require_once APPPATH.'libraries/REST_Controller.php';\n\n/**\n* This is example\
    \ of a few user interaction methods you could use\n\nThe listing above is in a\
    \ format unified diff. It shows the difference between two files. In short, remove\
    \ the red line starting with - from the original file and add the green line starting\
    \ with +, to get the new file. See Conversions in This Book for details.\n\nSecond,\
    \ add the catch block below REST_Controller.php. CodeIgniter Rest Server calls\
    \ exit() and monkey patching by ci-phpunit-test converts it to an exception, but\
    \ the Rest Server catches it by default. We want to catch the exception thrown\
    \ by the monkey patch and re-throw it.\n\n```php\n--- a/CodeIgniter/application/libraries/REST_Controller.php\n\
    +++ b/CodeIgniter/application/libraries/REST_Controller.php\n@@ -653,6 +653,11\
    \ @@ abstract class REST_Controller extends CI_Controller {\n    call_user_func_array([$this,\
    \ $controller_method], $arguments);\n+ catch (PHPUnitTestExitException $ex) {\n\
    +\n    // This block is for ci-phpunit-test\n+    throw $ex;\n+ }\n catch (Exception\
    \ $ex) {\n{\n    // If the method doesn't exist, then the error will be caught\
    \ and a error response shown\n```\n\n## 9.2 Testing GET Requests\n\nLet's access\
    \ the web API using the curl command.\n"
