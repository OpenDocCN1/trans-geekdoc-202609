  - "[PAGE 95]\n\n# Unit Testing for Models\n\napplication/tests/models/Play_with_mocks_test.php\n\
    \n```\npublic function test_mock_at_method()\n{\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
