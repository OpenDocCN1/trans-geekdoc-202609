  - '[PAGE 89]


    # # 6. Unit Testing for Models


    In this chapter, we will learn how to unit test models using doubles.


    # ## 6.1 Why Should You Test Models First?


    Models may be the most important part of your application code. The CodeIgniter
    User Guide says, "Models are PHP classes that are designed to work with information
    in your database." While this is a good start, we will extend CodeIgniter''s definition
    of Models to include classes which may include your Domain Models and/or Business
    Logic.


    You may also choose to put some of this code in libraries. So, in the context
    of CodeIgniter, we should test models and libraries first.


    In other words, put your most important code, like Domain Models or Business Logic,
    in models and libraries, then test them first (and well).


    # ## 6.2 PHPUnit Mock Objects


    By writing test code for models, let''s see what PHPUnit Mock Objects are like.


    > There are some well-known Mocking libraries in PHP. PHPUnit has its own Mocking
    library (PHPUnit Mock Objects), but Prophecy, Phing, Mockery, and AspectMock are
    also well-known. In this book, we use only PHPUnit Mock Objects.


    > final, private and static methods cannot be mocked by PHPUnit Mock Objects.
    They are ignored and retain their original behavior. If you really want to mock
    them, you can do so by using the Monkey Patching functionality provided by ci-phpunit-test.


    PHPUnit has a great deal of functionality to create test doubles. If you want
    to dig into the details, see the PHPUnit Manual https://phpunit.de/manual/4.8/en/test-doubles.html.


    # ## Playing with Mocks


    We will start by creating mock objects for the Temperature_converter class and
    testing with them.'
