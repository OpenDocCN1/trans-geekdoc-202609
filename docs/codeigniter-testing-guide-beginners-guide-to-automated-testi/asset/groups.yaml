    \    $actual = $this->obj->bar('test');\n        $this->assertEquals('mocked value',\
    \ $actual);\n    }\n}\n```\n\nIs this test useful? What do we test in the test\
    \ case?\n\nIt seems the $this->assertEquals() line is almost nonsense, because\
    \ the return value is from the mock we injected. The only thing we can say from\
    \ the test is that the method Foo::baz() calls the Bar::baz() method and returns\
    \ the result. So our mock is as the internal implementation of the Foo class.\n\
    \nWhy is this test of little value? The Foo class has no logic of its own. It\
    \ is just returning the return value of the Bar object's baz() method.\n\nSimilarly,\
    \ if we are simply returning the results straight from the database, unit testing\
    \ using mocked database objects is of little value. In that case, it is better\
    \ to write database tests without the database.\n\n# When You Write Tests without\
    \ the Database\n\nOn the contrary, if our models have a lot of logic to do something\
