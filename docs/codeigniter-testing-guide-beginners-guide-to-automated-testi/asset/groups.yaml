    # 3. Test Jargon


    In this book, we define test jargon as indicated in this chapter. One of the annoying
    and confusing things in testing is new jargon, and a term''s meaning is slightly
    different depending on the person. This chapter is intended to help you understand
    the generally-used jargon in testing, as well as the specific meaning we intend
    when we use that jargon in this book.


    If you think something is wrong with the definitions, please let me know.


    # 3.1 Testing levels


    # Unit Testing


    Unit Testing refers to tests that verify the functionality of a specific section
    of code. In an object-oriented environment, this is usually at the class level.
    In other words, a unit is usually a class and a unit test would verify the functionality
    of the class as a whole.


    However, when you have, for example, two tightly coupled classes, and your team
    may decide that they need to be tested as a single unit. In short, your team and
    your code decide what makes up a unit.


    If you are not sure what constitutes a unit in your code base, a class is a good
    place to start. The smallest unit is a class, or a function if you have some code
    which uses PHP functions outside of classes. A method (a function defined within
    a class) is usually not considered a unit, so it can''t be tested in isolation
    from the class which defines it.


    > Testing Tip: Test Classes, Not Methods

    Testing rather than individual methods is good practice, because we don''t have
    to concern ourselves with the internal state of a class if it never changes the
    outcome of a method call. If you write a test to check the internal logic of a
    class, it may prevent you from refactoring the class later.


    # Integration Testing


    Integration Testing refers to tests that verify the functionality of more than
    one unit. If all units pass, there might be bugs where two units interact with
    each other, so unit testing is not enough.


    We can say that Functional Testing, Database Testing, and Browser Testing are
    types of Integration Testing.'
