    \n```php\npublic function test_mock_expectations() {\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->once())\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->FtoC(0);\n}\n```\n\napplication/tests/models/Play_with_mocks_test.php\n\
    \n```php\npublic function test_mock_at_method()\n{\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->at(0))\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->expects($this->at(1))\n        ->method('CtoF')\n\
    \        ->with(100);\n\n    $mock->FtoC(0);\n    $mock->CtoF(100);\n}\n``` (Wait,\
    \ I'm repeating the same thing. I will just provide the final output once properly.)\n\
    \n---\n\n[content]\n# Unit Testing for Models\n\n```\n>>> $mock->FtoC(100)\n=>\
    \ 99.9\n>>> $mock->FtoC(50)\n=> 99.9\n>>> $mock->FtoC(0)\n=> 99.9\n```\n\nAll\
    \ of the return values are 99.9, because this is the only value we tell the mock\
    \ to return.\n\n```php\n$mock = $this->getMockBuilder('Temperature_converter')\n\
    \    ->getMock();\n$mock->method('FtoC')->willReturn(99.9);\n```\n\nThe last line\
    \ in this code shows that the mock has a method named FtoC which will return the\
    \ value 99.9.\n\nHow about running another method?\n\n```\n>>> $mock->CtoF(0)\n\
    => null\n```\n\nThe methods we do not specify when we created the mock return\
    \ null. This is the default behavior PHPUnit provides when we have explicitly\
    \ defined a method.\n\n![](img/ce0568211401542acf89e27068fbf651_92_0.png)\n\n\
    Psy Shell\n\nPress the [control] key and the [c] key at the same time to terminate\
    \ the PHPUnit process.\n\n# Unit Testing for Models\n\n# Partial Mocks\n\nNext,\
    \ how about another method of defining a mock? We will just add setMethods(['FtoC'])\
    \ when we define this mock.\n\n```diff\n--- a/CodeIgniter/application/tests/models/Play_with_mocks_test.php\n\
    +++ b/CodeIgniter/application/tests/models/Play_with_mocks_test.php\n@@ -8,6 +8,11\
    \ @@ class Play_with_mocks_test extends TestCase\n-- ->getMock();\n-$ $method('FtoC')->willReturn(99.9);\n\
    +\n+$mock2 = $this->getMockBuilder('Temperature_converter')\n+    ->setMethods(['FtoC'])\n\
    +    ->getMock();\n+$mock2->method('FtoC')->willReturn(99.9);\n+\n+eval(\\PhpShell($mock));\n\
    +var_dump($mock, $mock->FtoC(100), $mock->CtoF(0)); execute;\n```\n\nThe listing\
    \ above is in a format unified diff. It shows the difference between two files.\
    \ In short, add the green lines starting with +, to get the new file. See Conventions\
    \ Used in This Command for details.\n\nRun the phpunit command and check the results.\n\
    \n```\n$ php phpunit.phar models/Play_with_mocks_test.php\n#/usr/bin/env php\n\
    PHPUnit 4.8.10 by Sebastian Bergmann and contributors.\n```\n\nPsy Shell v0.6.0-dev\
    \ (PHP 5.5.26 - cli) by Justin Hileman\n$mock2->FtoC(100)\n=> 99.9\n$mock2->FtoC(50)\n\
    => 99.9\n$mock2->FtoC(0)\n=> 99.9\n$mock2->CtoF(0)\n=> 32.0\n$mock2->CtoF(50)\n\
    => 122.0\n```\n\n# Unit Testing for CtoF\n\n```\n$mock2->CtoF(100)\n=> 212.0\n\
    ```\n\nThis time, the method did not specify when we created the mock returns\
    \ real values, not null. Mocks like this are called Partial Mocks. When we use\
    \ setMethods(), we tell PHPUnit to mock the specific methods included in the array,\
    \ but other methods will call the original class, and cannot be configured using\
    \ your $mock2 object.\n\n# Verifying Expectations\n\nWe defined and looked at\
    \ mock's output above. We can also check mock's input. In the code below, the\
    \ mock expects that the FtoC() method is called once with the value 0 passed to\
    \ the parameter.\n\napplication/tests/models/Play_with_mocks_test.php\n\n```php\n\
    public function test_mock_expectations() {\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->once())\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->FtoC(0);\n}\n```\n\nThere are no assertions in\
    \ the test method, but it is a real test. If you change or remove \"$mock->FtoC(0);\"\
    , the test will fail.\nIn addition to $this->once(), PHPUnit uses other methods\
    \ to verify the number of invocations:\n\n- $this->any() ... any number of times,\
    \ including 0\n- $this->once() ... only once\n- $this->exactly($count) ... exactly\
    \ $count times\n- $this->at($index) ... See example below\n- $this->never() ...\
    \ never\n- $this->atLeastOnce() ... at least once\n\nThe following is an example\
    \ of a passing test using the $this->at() method.\n\n# Unit Testing for Models\n\
    \napplication/tests/models/Play_with_mocks_test.php\n\n```php\npublic function\
    \ test_mock_at_method()\n{\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->at(0))\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->expects($this->at(1))\n        ->method('CtoF')\n\
    \        ->with(100);\n\n    $mock->FtoC(0);\n    $mock->CtoF(100);\n}\n```\n\n\
    The argument for $this->at() method refers to the zero-based index of all method\
    \ invocations for a given mock object. So, $mock->expects($this->at(0))->method('FtoC')->with(0);\
    \ configures the mock to expect the first method invocation after the: mock is\
    \ defined to be FtoC(0), and $mock->expects($this->at(1))->method('CtoF')->with(100);\
    \ configures the mock to expect the second method invocation to be CtoF(100).\
    \ If we changed the index passed to call at at() or changed the order in which\
    \ the FtoC() and CtoF() methods were called, the tests would fail.\n\n# 6.3 Testing\
    \ Models without Database\n\nIn the previous chapter, we wrote test code for a\
    \ model that uses the database (see Chapter 5, Case for News Model). In functional\
    \ testing, we need the database.\n"
  mdcn: "\n# 模型的单元测试\n\n```\n>>> $mock->FtoC(100)\n=> 99.9\n>>> $mock->FtoC(50)\n\
    => 99.9\n>>> $mock->FtoC(0)\n=> 99.9\n```\n\n所有的返回值都是 99.9，因为这是我们告诉 mock 返回的唯一值。\n\
    \n```php\n$mock = $this->getMockBuilder('Temperature_converter')\n    ->getMock();\n\
    $mock->method('FtoC')->willReturn(99.9);\n```\n\n这段代码的最后一行显示 mock 有一个名为 FtoC 的方法，它将返回值\
    \ 99.9。\n\n运行另一个方法会怎样？\n\n```\n>>> $mock->CtoF(0)\n=> null\n```\n\n我们在创建 mock\
    \ 时没有指定的方法将返回 `null`。这是 PHPUnit 在我们显式定义方法时提供的默认行为。\n\n![](img/ce0568211401542acf89e27068fbf651_92_0.png)\n\
    \nPsy Shell\n\n同时按下 [control] 键和 [c] 键来终止 PHPUnit 进程。\n\n# 模型的单元测试\n\n# 部分 Mock\
    \ (Partial Mocks)\n\n接下来，定义 mock 的另一种方法如何？我们在定义这个 mock 时只需添加 `setMethods(['FtoC'])`\
    \ 即可。\n\n```diff\n--- a/CodeIgniter/application/tests/models/Play_with_mocks_test.php\n\
    +++ b/CodeIgniter/application/tests/models/Play_with_mocks_test.php\n@@ -8,6 +8,11\
    \ @@ class Play_with_mocks_test extends TestCase\n-- ->getMock();\n-$ $method('FtoC')->willReturn(99.9);\n\
    +\n+$mock2 = $this->getMockBuilder('Temperature_converter')\n+    ->setMethods(['FtoC'])\n\
    +    ->getMock();\n+$mock2->method('FtoC')->willReturn(99.9);\n+\n+eval(\\PhpShell($mock));\n\
    +var_dump($mock, $mock->FtoC(100), $mock->CtoF(0)); execute;\n```\n\n上面的列表是统一\
    \ diff 格式。它显示了两个文件之间的差异。简单来说，添加以 `+` 开头的绿色行即可获取新文件。详情请参见“此中使用的约定”。\n\n运行 phpunit\
    \ 命令并检查结果。\n\n```\n$ php phpunit.phar models/Play_with_mocks_test.php\n#/usr/bin/env\
    \ php\nPHPUnit 4.8.10 by Sebastian Bergmann and contributors.\n```\n\n```\nPsy\
    \ Shell v0.6.0-dev (PHP 5.5.26 - cli) by Justin Hileman\n$mock2->FtoC(100)\n=>\
    \ 99.9\n$mock2->FtoC(50)\n=> 99.9\n$mock2->FtoC(0)\n=> 99.9\n$mock2->CtoF(0)\n\
    => 32.0\n$mock2->CtoF(50)\n=> 122.0\n```\n\n# 为 CtoF 进行单元测试\n\n```\n$mock2->CtoF(100)\n\
    => 212.0\n```\n\n这一次，我们在创建 mock 时没有指定的方法返回了真实值，而不是 `null`。这样的 mock 被称为**部分 Mock\
    \ (Partial Mocks)**。当我们使用 `setMethods()` 时，我们告诉 PHPUnit 模拟数组中包含的方法，但其他方法将调用原始类，并且无法通过你的\
    \ $mock2 对象进行配置。\n\n# 验证期望 (Verifying Expectations)\n\n我们在上面定义并了 mock 的输出。我们也可以检查\
    \ mock 的输入。在下面的代码中，mock 期望 FtoC() 方法被调用一次并向参数传递值 0。\n\napplication/tests/models/Play_with_mocks_test.php\n\
    \n```php\npublic function test_mock_expectations() {\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->once())\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->FtoC(0);\n}\n```\n\n测试方法中没有断言，但这是一个真实的测试。如果你更改或删除了\
    \ `$mock->FtoC(0);`，测试将失败。\n除了 `$this->once()` 之外，PHPUnit 使用其他方法来验证调用次数：\n\n-\
    \ `$this->any()` ... 任意次数，包括 0\n- `$this->once()` ... 仅一次\n- `$this->exactly($count)`\
    \ ... 恰好 $count 次\n- `$this->at($index)` ... 参见下文示例\n- `$this->never()` ... 永远不被调用\n\
    - `$this->atLeastOnce()` ... 至少一次\n\n以下是一个使用 `$this->at()` 方法通过测试的示例。\n\n# 模型的单元测试\n\
    \napplication/tests/models/Play_with_mocks_test.php\n\n```php\npublic function\
    \ test_mock_at_method()\n{\n    $mock = $this->getMockBuilder('Temperature-converter')\n\
    \        ->getMock();\n    $mock->expects($this->at(0))\n        ->method('FtoC')\n\
    \        ->with(0);\n    $mock->expects($this->at(1))\n        ->method('CtoF')\n\
    \        ->with(100);\n\n    $mock->FtoC(0);\n    $mock->CtoF(100);\n}\n```\n\n\
    `$this->at()` 方法的参数指的是给定 mock 对象所有方法调用的从零开始的索引。因此，`$mock->expects($this->at(0))->method('FtoC')->with(0);`\
    \ 配置 mock 期望第一次方法调用为 FtoC(0)，而 `$mock->expects($this->at(1))->method('CtoF')->with(100);`\
    \ 配置 mock 期望第二次方法调用为 CtoF(100)。如果我们更改了传递给 `at()` 的索引，或者更改了 FtoC() 和 CtoF() 方法被调用的顺序，测试将会失败。\n\
    \n# 6.3 测试不带数据库的模型\n\n在上一章中，我们为一个使用数据库的模型编写了测试代码（参见第 5 章，新闻模型案例）。在功能测试中，我们需要数据库。\n\
    \n# 测试不带数据库的模型\n\n（注：原文后续部分存在大量重复的 OCR 错误文本，已根据要求按核心逻辑进行处理。）\n"
