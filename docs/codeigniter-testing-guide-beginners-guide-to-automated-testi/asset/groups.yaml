    \ 5.6.18-dev | Yes | 2.0RC3 | n/a | n/a | 4.8.21 (Phar) | 26.53 | 29.920 |\n|\
    \ 5.6.18-dev | No | 2.0RC3 | no-coverage | n/a | 4.8.21 (Phar) | 3.29 | 3.426\
    \ |\n| 5.6.18-dev | No | n/a | n/a | n/a | 4.6.10 (Phar) | 1.51 | 1.638 |\n| 5.6.18-dev\
    \ | No | n/a | n/a | n/a | 4.8.21 (Phar) | 1.51 | 1.633 |\n\n## Use phpdbg instead\
    \ of Xdebug\n\nIf you only need the coverage report, you could generate it using\
    \ phpdbg using the following options:\n\n```\n$ phpdbg -q phpunit.phar\n```\n\n\
    This is not a fair comparison, but phpdbg appears to be faster than Xdebug for\
    \ coverage reporting.\n\n| PHP | Coverage | Xdebug | option | phpdbg | PHPUnit\
    \ | Test Time (sec) | Total Time (sec) |\n|---|---|---|---|---|---|---|---|\n\
    | 5.6.18-dev | Yes | 2.0RC3 | n/a | n/a | 4.8.21 (Composer) | 21.60 | 24.922 |\n\
