    # # Appendix B


    # ## How to Read ci-phpunit-test


    If you want to customize or improve ci-phpunit-test, you need to read its source
    code. This is a guide to help you do so.


    # ### Structure of ci-phpunit-test


    ci-phpunit-test consists of the following major parts:


    +   - Bootstrap ... Bootstrap for PHPUnit.

    - Autoloader ... Autoloader for application and ci-phpunit-test class files.

    - Replaced Classes and Functions ... Replacements for CodeIgniter code.

    - New Functions ... Functions added for testing.

    - TestCase classes ... TestCase classes provided by ci-phpunit-test.

    - Request-related classes ... $this->request() and related functionality.

    - Helper classes ... Helper or short-cut methods for test code.

    - Monkey Patch ... Library to provide monkey patching capabilities.


    ```

    tests/

    ├── Bootstrap.php ... Bootstrap

    ├── TestCase.php ... TestCase class for users

    |├── _ci_phpunit-test/ ...

    |   ├── CIPUnitTest.php ... Bootstrap

    |   ├── CIPUnitTestAutoloader.php ... Autoloader class

    |   ├── CIPUnitTestCase.php ... Base TestCase class

    |   ├── CIPUnitTestDouble.php ... Helper class to create Mock objects

    |   ├── CIPUnitTestCache.php ... Cache class for Autoloader

    |   ├── CIPUnitTestReflection.php ... Helper class to access private methods

    |   ├── CIPUnitTestRequest.php ... Request related class (main)

    |   ├── CIPUnitTestRouter.php ... Request related class for routing

    |   ├── CIPUnitTestSuperGlobal.php ... Request related class for super globals

    |   ├── alias/ ... Class aliases

    |   └── autoloader.php ... Autoloader

    └── exceptions/ ... Exception classes

    ```'
  md: "\n# Appendix A\n\n## How to Speed Up Testing\n\nIf you have slow tests, they\
    \ may prevent you from testing, so your tests should be fast. This appendix will\
    \ give you some hints to speed up your tests.\n\nWhenever possible, you should\
    \ make your tests faster. However, if you keep writing tests, you can end up with\
    \ so many tests running your whole test suite will take a long time, no matter\
    \ how fast the individual tests may be.\n\nStill, there is usually something you\
    \ can do to speed up your tests.\n\n## Speed Up without Code Modifications\n\n\
    Without modifying your application/test code, there are still some things which\
    \ might make your tests run faster:\n\n- change the version of PHPUnit you are\
    \ using\n- install PHPUnit via Composer\n- disable code coverage reporting\n-\
    \ disable Xdebug\n- use phpdbg instead of Xdebug\n- upgrade to PHP 7\n- use a\
    \ SQLite in-memory database\n\nHere are the benchmarks of a certain Codeigniter\
    \ project:\n\n| PHP | Coverage | Xdebug option | phpdbg | PHPUnit | Test Time\
    \ (sec) | Total Time (sec) |\n|---|---|---|---|---|---|---|\n| 5.6.18-dev | Yes\
    \ | 2.4.RC3 | n/a | n/a | 4.6.10 (Phar) | 32.35 | 35.644 |\n| 5.6.18-dev | Yes\
    \ | 2.4.RC3 | n/a | n/a | 4.8.21 (Phar) | 26.53 | 29.920 |\n| 5.6.18-dev | No\
    \ | 2.4.RC3 | no-coverage | n/a | 4.8.21 (Phar) | 3.29 | 3.426 |\n| 5.6.18-dev\
    \ | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Composer) | 21.60 | 24.922 |\n\n| PHP\
    \ | Coverage | Xdebug | option | phpdbg | PHPUnit | Test Time (sec) | Total Time\
    \ (sec) |\n|---|---|---|---|---|---|---|---|\n| 5.6.18-dev | Yes | 2.4.0 | n/a\
    \ | n/a | 5.0.10 (Phar) | 25.99 | 29.350 |\n| 5.6.18-dev | Yes | 2.4.03 | n/a\
    \ | n/a | 5.1.3 (Phar) | 26.14 | 29.512 |\n| 5.6.18-dev | No | n/a | n/a | n/a\
    \ | 4.6.10 (Phar) | 1.51 | 1.638 |\n| 5.6.18-dev | No | n/a | n/a | n/a | 4.8.21\
    \ (Phar) | 1.51 | 1.633 |\n| 5.6.18-dev | No | n/a | n/a | n/a | 4.8.21 (Composer)\
    \ | 1.30 | 1.416 |\n| 7.0.3-dev | Yes | n/a | n/a | 0.5.0 | 4.8.21 (Composer)\
    \ | 2.00 | 2.728 |\n| 7.0.3-dev | No | n/a | n/a | n/a | 4.6.10 (Phar) | 0.799\
    \ | 0.834 |\n| 7.0.3-dev | No | n/a | n/a | n/a | 4.8.21 (Phar) | 0.792 | 0.825\
    \ |\n| 7.0.3-dev | No | n/a | n/a | n/a | 4.8.21 (Composer) | 0.732 | 0.769 |\n\
    \nTest Time is the output by PHPUnit. Total Time is the whole time measured by\
    \ the time command. If Coverage is Yes, it includes the time to generate the coverage\
    \ report. Both columns are displayed in seconds.\n\nThe actual commands are like\
    \ following:\n\n```\n$ time phpunit-4.8.21.phar\n$ time ../vendor/bin/phpunit\n\
    $ time phpdbg -q ../vendor/bin/phpunit\n```\n\nUnfortunately the following combinations\
    \ do not work properly:\n\n- PHP 7 + phpdbg + PHPUnit (Phar) ... 2 errors\n- PHP\
    \ 7 + xdebug ... Segmentation fault\n\nYou need PHP 7 to use phpdbg for coverage\
    \ reporting.\n\n## Changing PHPUnit\n\n| PHP | Coverage | Xdebug | option | phpdbg\
    \ | PHPUnit | Test Time (sec) | Total Time (sec) |\n|---|---|---|---|---|---|---|---|\n\
    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.6.10 (Phar) | 32.35 | 35.634 |\n\
    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Phar) | 26.55 | 29.920 |\n\
    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Composer) | 21.60 | 24.922\
    \ |\n| 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 5.0.10 (Phar) | 25.99 | 29.350\
    \ |\n| 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 5.1.3 (Phar) | 26.14 | 29.512\
    \ |\n\nPHPUnit 4.8.21 is faster than 4.6.10. PHPUnit 4.8.21 installed via Composer\
    \ is a little faster than same version of PHPUnit Phar. Updating PHPUnit does\
    \ not guarantee that the tests will speed up, but there may be benefits to keeping\
    \ it to date.\n\n## Disable Coverage Reporting\n\nIf you want to make your tests\
    \ faster, disable the code coverage report.\n\n| PHP | Coverage | Xdebug | option\
    \ | phpdbg | PHPUnit | Test Time (sec) | Total Time (sec) |\n|---|---|---|---|---|---|---|---|\n\
    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Phar) | 26.53 | 29.920 |\n\
    | 5.6.18-dev | No | 2.4.RC3 | no-coverage | n/a | 4.8.21 (Phar) | 3.29 | 3.426\
