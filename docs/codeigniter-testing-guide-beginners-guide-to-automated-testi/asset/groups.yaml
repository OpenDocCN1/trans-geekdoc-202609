    # What is Automated Testing?


    This example is simple, so you might think the test is nonsense. However, if you
    expect a certain output given a certain input, the complexity of the function
    you are testing has very little impact on the complexity of the test, so even
    very complicated functions might have tests with code which is similar to the
    test we created for our primitive hello function.


    # 1.2 Why should you write test code?


    You don''t have to write test code, even if you choose not to, it is better that
    you know how to write it. Thinking about how you would write a test for your code
    considers how your code might fail and what expectations you have for a given
    piece of code.


    According to “Top 12 Reasons to Write Unit Tests¹, you will get the following
    benefits when you test code:


    +   1. Tests Reduce Bugs in New Features

    2. Tests Reduce Bugs in Existing Features

    3. Tests Are Good Documentation

    4. Tests Reduce the Cost of Change

    5. Tests Improve Design

    6. Tests Allow Refactoring

    7. Tests Constrain Features

    8. Tests Defend Against Other Programmers

    9. Testing Is Fun

    10. Tests Forces You to Slow Down and Think

    11. Tests Makes Development Faster

