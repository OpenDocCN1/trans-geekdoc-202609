  md: "\n[content]\n# Installing Ion Auth\n\nIon Auth is a simple and lightweight\
    \ authentication library for CodeIgniter, licensed under the MIT License. See\
    \ the License Agreement for Ion Auth.\n\nI changed the coding style of the authentication\
    \ source code a bit. Download the latest version (in this book we use v2.6.0-343-g7d1f6af)\
    \ from http://github.com/benedmund/CodeIgniter-Ion-Auth/zipball/2 and unzip. Copy\
    \ the following files into your CodeIgniter/application directory from the corresponding\
    \ directory in the Zip package, except for application/migrations/001_install_ion_auth.php,\
    \ which we will place in the CodeIgniter/application/database/migrations/\n\n\
    - CodeIgniter/\n  application/\n    config/\n      auth.php\n    controller/\n\
    \      auth.php\n    database/\n      migrations/\n        001_install_ion_auth.php\n\
    \    language/\n      english/\n        auth_lang.php\n        ion_auth_lang.php\n\
    \  libraries/\n    Crypt.php\n    Ion_auth.php\n  models/\n    ion_auth_model.php\n\
    \  views/\n    auth/\n\nRename the class files to make them work with CodeIgniter\
    \ 3.0:\n\n```\napplication/controllers/auth.php -> Auth.php\napplication/models/ion_auth_model.php\
    \ -> Ion_auth_model.php\n```\n\nRename the migration file to use the timestamp\
    \ format.\n\n# Testing Controllers\n\napplication/database/migrations/001_install_ion_auth.php\n\
    -> 20150920182600_install_ion_auth.php\n\n# Database Migrations\n\nUpdate the\
    \ migration config file.\n\n```diff\n--- a/CodeIgniter/application/config/migration.php\n\
    +++ b/CodeIgniter/application/config/migration.php\n@@ -6,7 +6,7 @@ $config['migration_auto_latest']\
    \ = FALSE\n | be upgraded | downgraded to.\n /*\n-$config['migration_version']\
    \ = 20150907090030;\n+$config['migration_version'] = 20150920182600;\n /*\n |\\\
    -\n```\n\nThe listing above is in a format called unified diff. It shows the difference\
    \ between two files. In short, remove the red line starting with - from the original\
    \ file and add the green line starting with +, to get the new file. See Conventions\
    \ Used in This Book for details.\n\nRun the migrations via CLI.\n\n```bash\n$\
    \ php index.php dbfixture migrate\n```\n\nIf there is no output, the migration\
    \ ran and the groups, users, users_groups, login_attempts tables were created\
    \ successfully. You can confirm this using the sqlite3 command.\n\n```bash\n$\
    \ sqlite3 application/data/sqlite-database.db\nSQLite version 3.8.5 2014-08-15\
    \ 22:37:57\nEnter \".help\" .schema groups\nsqlite> CREATE TABLE \"groups\" (\n\
    \  \"id\" INTEGER PRIMARY KEY AUTOINCREMENT,\n  \"name\" VARCHAR NOT NULL,\n \
    \ \"description\" VARCHAR NOT NULL\n);\nsqlite> .schema users\n```\n\n# Routing\n\
    \n```sql\nCREATE TABLE \"users\" (\n  \"id\" INTEGER PRIMARY KEY AUTOINCREMENT,\n\
    \  \"ip_address\" VARCHAR NOT NULL,\n  \"username\" VARCHAR NOT NULL,\n  \"password\"\
    \ VARCHAR NOT NULL,\n  \"salt\" VARCHAR NOT NULL,\n  \"email\" VARCHAR NOT NULL,\n\
    \  \"activation_code\" VARCHAR NOT NULL,\n  \"forgotten_password_code\" VARCHAR\
    \ NOT NULL,\n  \"forgotten_code_password_time\" INT NULL,\n  \"remember_code\"\
    \ VARCHAR NOT NULL,\n  \"created_on\" INT NULL,\n  \"last_login\" INT NULL,\n\
    \  \"active\" TINYINT NULL,\n  \"first_name\" VARCHAR NOT NULL,\n  \"last_name\"\
    \ VARCHAR NOT NULL,\n  \"company\" VARCHAR NOT NULL,\n  \"phone\" VARCHAR NOT\
    \ NULL\n);\nsql> .schema users_groups\nCREATE TABLE \"users_groups\" (\n  \"id\"\
    \ INTEGER PRIMARY KEY AUTOINCREMENT,\n  \"user_id\" MEDIUMINT NOT NULL,\n  \"\
    group_id\" MEDIUMINT NOT NULL\n);\nsql> .schema login_attempts\nCREATE TABLE \"\
    login_attempts\" (\n  \"id\" INTEGER PRIMARY KEY AUTOINCREMENT,\n  \"ip_address\"\
    \ VARCHAR NOT NULL,\n  \"login\" VARCHAR NOT NULL,\n  \"time\" INT NULL\n);\n\
    sql> .exit\n```\n\nYou can see all the tables in the database. Add a route for\
    \ auth.\n\n```diff\n--- a/CodeIgniter/application/config/routes.php\n+++ b/CodeIgniter/application/config/routes.php\n\
    @@ -52,6 +52,8 @@ defined('BASEPATH') OR exit('No direct script allowed');\n $route['404_override']\
    \ = '';\n $route['translate_uri'] = FALSE;\n+$route['auth'] = 'auth';\n+\n+$route['news/create']\
    \ = 'news/create';\n+$route['news/(:any)'] = 'news/$1';\n```\n\nNeed to add the\
    \ route for auth after the above code which prevents the auth route from being\
    \ resolved automatically by CodeIgniter.\n\n# Manual Testing with a Web Browser\n\
    \nLet's access the login page using PHP's built-in server.\n\n```bash\n$ php -S\
    \ 127.0.0.1:8000 index.php\n```\n\nThen, access http://127.0.0.1:8000/auth in\
    \ your web browser. You should be directed to login and see the form below.\n\n\
    # Login form\n\nTry to login using the default user. Type admin@admin.com in the\
    \ \"Email/Username\" field and password in the \"Password\" field, then submit\
    \ the form using the \"Login\" button. If you logged in successfully, you should\
    \ be redirected to the Home page.\n\nThen, access http://127.0.0.1:8000/auth.\
    \ You should see the user list:\n\n# Redirection\n\nLet’s look at an example controller\
    \ included in Ion Auth: application/controllers/Auth.php\n\n```php\n<?php defined('BASEPATH')\
    \ or exit('No direct script allowed');\n\nclass Auth extends CI_Controller\n{\n\
    \    public function __construct()\n    {\n        parent::__construct();\n  \
    \      $this->load->database();\n        $this->load->library(['ion_auth', 'form_validation']);\n\
    \        $this->load->helper(['url', 'language']);\n    }\n\n    $this->form_validation->set_error_delimiters(\n\
    \        $this->config->item('error_start_delimiter', 'ion_auth'),\n        $this->config->item('error_end_delimiter',\
    \ 'ion_auth')\n    );\n\n    // redirect if needed, otherwise display the user\
    \ list\n    public function index()\n    {\n        if (!$this->ion_auth->logged_in())\
    \ {\n            // redirect them to the login page\n            redirect('auth/login',\
    \ 'refresh');\n        }\n        // remove this if you want to enable this for\
    \ non-admins\n        elseif (!$this->ion_auth->is_admin()) {\n            //\
    \ redirect them to the home page because they must be an\n            // administrator\
    \ to view this\n            return show_error('You must be an administrator to\
    \ view this page.');\n        } else {\n            // set the flash error message\
    \ if there is one\n            $this->data['message'] =\n                (validation_errors())\
    \ ? validation_errors()\n                : $this->session->flashdata('message');\n\
    \        }\n\n        // list the users\n        $this->data['users'] = $this->ion_auth->users()->result();\n\
    \        foreach ($this->data['users'] as $k => $user) {\n            $this->data['users'][$k]->groups\
    \ =\n                $this->ion_auth->get_users_groups($user->id)->result();\n\
    \        }\n        $this->render_page('auth/index', $this->data);\n    }\n}\n\
    ```\n\nTesting redirection is very simple, because ci-phpunit-test provides a\
    \ special redirect() function by default. You can use the $this->assertRedirect()\
    \ method in ci-phpunit-test with the argument set to a URI string which will be\
    \ used as the target of the redirect. So, the test case will be like the following:\
    \ application/tests/controllers/Auth_test.php\n\n```php\n<?php\nclass Auth_test\
    \ extends TestCase\n{\n    public function test_When_not_login_user_get_auth_Then_redirected()\
    \ {\n        $this->request('GET', 'auth');\n        $this->assertRedirect('auth/login');\n\
    \    }\n}\n```\n\nRun the phpunit command and check that the test passes.\n\n\
    # Mocking Auth Objects\n\nIf you want to test the output by authenticated users,\
    \ mocking auth objects is easy. You can use the $this->request->setCallable()\
    \ method in ci-phpunit-test to inject mocks. We add the test method to the bottom\
    \ of the test case. application/tests/controllers/Auth_test.php\n\n```php\npublic\
    \ function test_When_admin_get_auth_Then_returns_user_list() {\n    $this->request->setCallable(\n\
    \        function ($CI) {\n            $auth = $this->getDouble(\n           \
    \     'Ion_auth', ['logged_in' => true, 'is_admin' => true]\n            );\n\
    \            $CI->ion_auth = $auth;\n        }\n    );\n\n    $output = $this->request('GET',\
    \ 'auth');\n    $this->assertContains('<p>Below is a list of the users.</p>',\
    \ $output);\n}\n```\n\nThe $this->getDouble() helper method in ci-phpunit-test\
    \ to create a partial mock object. The logged_in() and is_admin() methods of the\
    \ object return true. Run the phpunit command and check that the tests pass.\n\
    \n# Exercise\n\nAt this point, please stop and write rest tests for the Auth controller.\n\
    \n# 7.5 What if My Controller Needs Else?\n\nWe have covered all the common cases\
    \ for testing controllers and we will learn more in the next two chapters.\n\n\
    - Chapter 8, Unit Testing CLI Controllers\n- Chapter 9, Testing REST Controllers\n\
    \nIn my opinion, we will have covered more than 90% of techniques to write test\
    \ code for controllers by the time we finish Chapter 9. So, you will be able to\
    \ write test code for almost anything.\n"
