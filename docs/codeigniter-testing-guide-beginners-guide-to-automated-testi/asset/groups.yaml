    # 1.4 What should you test?


    This is the most difficult question to answer, and in some cases it''s nearly
    impossible to answer. Instead, it is better to ask what we don''t have to test.


    If we absolutely think we don''t have to test *something*, then we don''t test
    it. If we are not sure, we test everything.


    However, we are trying to find the middle way, we''ll come back to this idea later,
    in Chapter 3, Coverage. For now, rather than worrying about everything, we''re
    going to focus on writing tests whenever we can and acquiring good test karma.


