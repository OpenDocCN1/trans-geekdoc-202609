  - "[PAGE 96]\n\n# Unit Testing for Models\n\napplication/models/News_model.php\n\
    \n```\nclass News_model extends CI_Model\n{\n    public function __construct()\n\
    \    {\n        $this->load->database();\n    }\n\n    public function get_news($slug\
    \ = false)\n    {\n        if ($slug === false) {\n            $query = $this->db->get('news');\n\
    \            return $query->result_array();\n        }\n\n        $query = $this->db->get_where('news',\
    \ ['slug' => $slug]);\n        return $query->row_array();\n    }\nn\n```\n\n\
    The above code has three dependencies:\n\n+   - $this->load (CI_Loader object)\n\
    - $this->db (CI_DB object)\n- $query (CI_DB_result object)\n\n> $this->load and\
    \ $query will be an instance of different classes based on your database configuration.\
    \ Using our sqlite configuration, $this->db will likely be an instance of CI_pdo_sqlite_driver\
    \ and $query will be an instance of CI_DB_result. CodeIgniter's database library\
    \ uses the CI_DB and CI_DB base classes to support drivers for multiple databases,\
    \ so CI_pdo_sqlite_driver extends CI_DB_driver, which extends CI_DB and CI_pdo_result\
    \ extends CI_DB_result. Similarly, the CI_Loader object could easily be an instance\
    \ of MY_Loader or some other library which extends the CodeIgniter loader. With\
    \ this in mind, our mocks target the base classes, rather than the more specific,\
    \ configuration-dependent classes.\n\nThe _construct() method depends on $this->load\
    \ (the CI_Loader object). As with most CodeIgniter classes, it is loaded into\
    \ a property of the core CI_Controller object.\n\nThe get_news() method depends\
    \ on $this->db (the CI_DB object, or CodeIgniter's database library) and $query\
    \ (the CI_DB_result object, also part of CodeIgniter's database library)."
