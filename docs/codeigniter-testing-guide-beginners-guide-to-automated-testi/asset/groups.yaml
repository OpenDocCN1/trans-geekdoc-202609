    \ {\n        $news_model = $this->getDouble(\n          'News_model', ['get_news'\
    \ => $result_array]\n        );\n        $CI->news_model = $news_model;\n    \
    \  }\n    );\n    $output = $this->request('GET', '/news');\n    $this->assertContains('<h1>News\
    \ archive</h1>', $output);\n    $this->assertContains('<h3>News test</h3>', $output);\n\
    \    $this->assertContains('<h3>News test 2</h3>', $output);\n    }\n}\n```\n\n\
    We use the $this->request->setCallable() and $this->getDouble() methods in ci-phpunit-test.\
    \ The $this->request->setCallable() method sets a callable to run after the controller\
    \ instantiation. The $this->getDouble() method is a helper method to create a\
    \ PHPUnit partial mock.\n\n```php\n$news_model = $this->getDouble(\n  'News_model',\
    \ ['get_news' => $result_array]);\n```\n\nThe above code is equivalent to the\
    \ following:\n\n```php\n$news_model = $this->MockBuilder('News_model')\n->disableOriginalConstructor()\n\
    ->setMethods(['get_news'])\n->getMock();\n$news_model->method('get_news')\n->willReturn($result_array);\n\
    ```\n\nIf you need to call the original constructor, use true for the third argument:\n\
    \n```php\n$form_validation = $this->getDouble(\n['CI_Form_validation', ['run'\
    \ => true], true\n);\n```\n\nThe following code sets a closure which creates a\
    \ mock for the model and adds it to the CodeIgniter super object. In fact, the\
    \ CodeIgniter super object is the controller object, and the $this->request()\
    \ method passes to the parameter of the closure. the $this->news_model property\
    \ in the controller will be the mock when the action method (News::index()) is\
    \ called.\n\n```php\n$this->request->setCallable(\nfunction ($CI) use ($result_array)\
    \ {\n    $news_model = $this->getDouble(\n    'News_model', ['get_news' => $result_array]\n\
    );\n$CI->news_model = $news_model;\n}\n);\n```\n\n$this->request() method:\n\n\
    1. Resets the CodeIgniter super object\n2. Creates the controller instance (the\
    \ CodeIgniter super object is a singleton reference in the base CI_Controller)\n\
    3. Calls the callable set by the $this->request->setCallable() method\n4. Calls\
    \ the requested method in the controller\n\n## Exercise\n\nAt this point, please\
