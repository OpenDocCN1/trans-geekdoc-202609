  - "[PAGE 153]\n\n# # 10. Browser Testing with Codeception\n\nIn previous chapters,\
    \ we have been using PHPUnit, but in this chapter we will explore some other tools.\
    \ We will install Codeception and Selenium Server, learn how to configure them,\
    \ and how to write browser tests.\n\n# ## 10.1 Installing and Configuring Codeception\n\
    \n### What is Codeception?\n\n*Codeception* is a PHP testing framework which provides\
    \ three levels of testing: Acceptance Tests, Functional Tests, and Unit Tests.\
    \ We use *Acceptance Tests* as a synonym for *Browser Tests* in this chapter.\n\
    \nAny web site can be covered with acceptance tests. To use functional tests,\
    \ we need a module for our framework, but we don't have a module for CodeIgniter.\
    \ For this reason, we will only use Codeception for acceptance tests in this chapter.\n\
    \nIn previous chapters, we have been using PHPUnit with ci-phpunit-providing framework\
    \ integration with CodeIgniter. Since we don't have framework integration for\
    \ Codeception, we will be using Codeception on its own, which should simplify\
    \ the process of learning to use it for acceptance tests.\n\n# ## Installing Codeception\n\
    \nDownload the latest version (in this book we use v2.1.4) from http://codeception.com/install\
    \ and place the downloaded codecept.phar in the root directory of your PHP project.\n\
    \n```\nCodeIgniter/\n  codecept.phar\n```\n\n> > To Composer users\nCodeception\
    \ may also be installed via Composer as follows:\n\n```\n$ composer require codeception/codeception\
    \ --dev\n```\n\nOnce installed via Composer, use vendor/bin/codecept in place\
    \ of php codecept.phar in the remaining instructions in this chapter."
  - '[PAGE 154]


    # What is Selenium Server?


    Selenium is a project that automates browsers made up of three parts: the WebDriver,
    the Server, and the client. Selenium WebDriver is a driver to manipulate a browser.
    Selenium Server is a Java server application that communicates with Selenium client
    (in our case, facebook/webdriver in Codeception) and Selenium WebDriver.


    In summary, Codeception acts as our Selenium client, and uses Selenium Server
    to control the browser(s) used in our tests. Selenium Server uses the WebDriver(s)
    to control the browser(s) specified when we run Codeception.


    # Installing Selenium Server


    Download the latest version (in this book we use v2.48.2) from http://docs.seleniumhq.org/download/
    and place the downloaded selenium-server-standalone-x.x.x.jar in the root directory
    of your PHP project.


    ```

    CodeIgniter/

    - selenium-server-standalone-2.48.2.jar

    ```


    # Initializing Codeception


    To begin, initialize Codeception by running the following command:


    ```

    $ php codecept.phar bootstrap

    ```


    This command creates files and a tests directory. You should see output similar
    to this:


    ```

    Initializing Codeception in .../CodeIgniter


    File codeception.yml created      <- global configuration

    tests/unit created               <- unit tests

    tests/unit.suite.yml written      <- unit suite configuration

    tests/functional created        <- functional tests

    tests/functional.suite.yml written <- functional tests suite configuration

    tests/acceptance created        <- acceptance tests

    tests/acceptance.suite.yml written <- acceptance tests suite configuration

    tests/_output was added to .gitignore

    tests/_bootstrap.php written      <- global bootstrap file

    ```


    > *https://github.com/facebook/php-webdriver'
