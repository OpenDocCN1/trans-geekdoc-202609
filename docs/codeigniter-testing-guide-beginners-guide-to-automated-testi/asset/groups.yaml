    \n# 1. 什么是自动化测试？\n\n欢迎测试的世界！\n\n在本章中，我们将学习自动化测试的概念，并学习为什么要测试以及你应该测试什么。随着学习，我们将开始制定此本书将采用的测试策略。\n\
    \n## 1.1 原始示例\n\n我们将从一个非常简单的示例开始，一个返回 'Hello World!' 的函数。为此，我们将该函数存放在一个名为 `hello.php`\
