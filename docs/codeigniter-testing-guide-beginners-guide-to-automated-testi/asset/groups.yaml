    \ to help you understand the generally-used jargon, as well as the specific meaning\
    \ we intend when we use that.\n\nIf you think something is wrong with the definitions,\
    \ please let me know.\n\n# 3.1 Testing levels\n\n# Unit Testing\n\nUnit Testing\
    \ refers to tests that verify the functionality of a specific section of code.\
    \ In an object-oriented environment, this is usually at the class level. In other\
    \ words, a unit is usually a class and a unit test would verify the functionality\
    \ of the class as a whole.\n\nHowever, when you have, for example, two tightly\
    \ coupled classes, and your team may decide that they need to be tested as a single\
    \ unit. In short, your team and your code decide what makes up a unit.\n\nIf you\
