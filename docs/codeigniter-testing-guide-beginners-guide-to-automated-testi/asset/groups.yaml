    \        ->with(100);\n\n    $mock->FtoC(0);\n    $mock->CtoF(100);\n}\n```\n\n\
    The argument for $this->at() method refers to the zero-based index of all method\
    \ invocations for a given mock object. So, $mock->expects($this->at(0))->method('FtoC')->with(0);\
