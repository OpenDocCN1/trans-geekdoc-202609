    # 10.4 Browser Testing: Pros and Cons


    There are pros and cons in browser testing.

    Pros:


    +   * can test whole system (it is system testing)

    * can test JavaScript and Ajax

    * less affected by changes in source code

    * can be run on any web site

    * can be shown to your clients and managers


    Cons:


    +   * they are really slow (it requires running web server, web browser and database)

    * affected by changes in views

    * fewer checks can lead to false-positive results

    * rendering and JavaScript issues can lead to unpredictable results


    # 10.5 Database Fixtures


    The browser test tests the whole system, so we need the database. That means we
    need database fixtures, too. Codeception includes functionality to restore a SQL
    dump file to the database when running acceptance tests. However, since we have
    been using database migrations and seeders for our tests, we don''t have a SQL
    dump file.'
  - "[PAGE 161]\n\nWe could generate a SQL dump file, but the migrations and seeders\
    \ have many benefits of their own, as discussed in Chapter 5. Since we already\
    \ have the migrations, seeders, and the capability to run them, we should make\
    \ use of them from here, as well.\n\nWe use the Dbfixture controller, which we\
    \ tested in Chapter 8, and run the controller before executing the acceptance\
    \ tests. If we do this way, we don't have to maintain a SQL dump file, and we\
    \ make good of our existing testing infrastructure.\n\napplication/controllers/Dbfixture.php\n\
    \n```\n<?php\nclass Dbfixture extends CI_Controller {\n    public function __construct()\
    \ {\n        parent::__construct();\n        // Only accessible via CLI\n    \
    \    if (is_cli() === false) {\n            exit();\n        }\n    }\n\n    public\
    \ function migrate() {\n        $this->load->library('migration');\n        if\
    \ ($this->migration->current() === false) {\n            echo $this->migration->error_string()\
    \ . PHP_EOL;\n        }\n    }\n\n    public function seed() {\n        $this->load->library('seeder');\n\
    \        foreach (glob(APPPATH.'.database/seeds/Seeder.php') as $file) {\n   \
    \         $seeder = basename($file, '.php');\n            $this->seeder->call($seeder);\n\
    \        }\n    }\n\n    public function all() {\n        $this->migrate();\n\
    \    }\n```"
