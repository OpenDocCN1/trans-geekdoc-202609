    \ to start. The smallest unit is a class, or a function if you have some code\
    \ which PHP functions outside of classes. A method (a function defined within\
    \ a class) is usually not considered a unit, so it can't be tested in isolation\
    \ from the class which defines it.\n\n> Testing Tip: Test Classes, Not Methods\n\
