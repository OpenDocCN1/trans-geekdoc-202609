    \ library for CodeIgniter, licensed under the MIT License. See the License Agreement\
    \ for Ion Auth.\n\nI changed the coding style of the authentication source code\
    \ a bit. Download the latest version (in this book we use v2.6.0-343-g7d1f6af)\
    \ from http://github.com/benedmund/CodeIgniter-Ion-Auth/zipball/2 and unzip. Copy\
    \ the following files into your CodeIgniter/application directory from the corresponding\
    \ directory in the Zip package, except for application/migrations/001_install_ion_auth.php,\
    \ which we will place in the CodeIgniter/application/database/migrations/\n\n\
    +   CodeIgniter/\n  application/\n    config/\n      auth.php\n    controller/\n\
    \      auth.php\n    database/\n      migrations/\n        001_install_ion_auth.php\n\
    \    language/\n      english/\n        auth_lang.php\n        ion_auth_lang.php\n\
    \  libraries/\n    Crypt.php\n    Ion_auth.php\n  models/\n    ion_auth_model.php\n\
    \  views/\n    auth/\n\nRename the class files to make them work with CodeIgniter\
    \ 3.0:\n\n```\napplication/controllers/auth.php -> Auth.php\napplication/models/ion_auth_model.php\
    \ -> Ion_auth_model.php\n```\n\nRename the migration file to use the timestamp\
    \ format."
