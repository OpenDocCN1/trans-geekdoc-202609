    By reading the code above, you probably have a good idea of what this test does.

    We must always write line "$I = new AcceptanceTester($scenario);" at the top of
    the test code. $I->wantTo() defines our scenario (test name). The rest of the
    test accesses /, and checks whether the page received in the response contains
    the string Home.


    # 10.3 Running Tests


    # Running Selenium Server


    To run tests, we need to start Selenium server to control the web browser(s).
    Run the server with the following command:


    ```

    $ java -jar selenium-server-standalone-2.48.2.jar

    ```


    # Running the Web Server


    We also need a web server. Open another terminal, and run PHP’s built-in web server:


    ```

    $ CI_ENV=testing php -S 127.0.0.1:8000 index.php

    ```


    We added CI_ENV=testing to run it under the testing environment. Because we want
    to set the environment of the CodeIgniter running on the server to a level of
    testing. It is the same thing you set CI_ENV in your .htaccess or Apache configuration
    file.

    Our PHPUnit tests in the testing environment, because ci-phpunit changes the environment
    automatically. But in this case, the PHP process of the web server is different
    from the process running Codeception. We have no way to change the environment
    of the CodeIgniter on the server from our test.


    # Running Codeception


    Since we will be using Firefox*, it needs to be installed, as well.

    Open another terminal. If you use the codedecept run command, Codeception runs
    all tests:


    > https://www.firefox.com/'
