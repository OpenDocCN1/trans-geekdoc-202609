    \ = $this->getDouble(\n        'CI_Migration',\n        [\n            'current'\
    \ => false,\n            'error_string' => $error_msg,\n        ]\n    );\n\n\
    \    // Inject mock objects\n    $this->obj->load = $loader;\n    $this->obj->migration\
    \ = $migration;\n\n    $this->expectOutputString($error_msg . PHP_EOL);\n    $this->obj->migrate();\n\
    }\n```\n\nThe $this->getDouble() helper method in ci-phpunit-test creates a partial\
    \ mock object. The library() method of the CI_Loader object will return null.\
    \ The current() method of the CI_Migration object will return false, and the error_string()\
    \ method will return 'Migration error'.\n\nSince the migrate() method in the controller\
    \ outputs 'Migration error', we can check the string using the $this->expectOutputString()\
    \ method. PHPUnit also has a $this->expectOutputRegex() method, which allows you\
    \ to set the expectation that the output matches a regular expression.\n\nRun\
    \ the phpunit and ensure that the tests pass.\n\n### 8.6 Monkey Patching\n\nMonkey\
    \ Patching allows us to replace code on the fly without modifying the original\
    \ code. The monkey patching provided by ci-phpunit-test can patch exit() or die(),\
    \ as well as some global functions and methods of user-defined classes.\n\nWe\
    \ have already used it to patch exit() in the previous section. Without monkey\
    \ patching, we can't usually test code which contains exit().\n\nMonkey patching\
    \ is a powerful tool for testing, so use it with caution.\n\n**Testing Tip: Untestable\
    \ without Monkey Patching**\n\nIf you can't write tests without monkey patching,\
    \ it may be a sign that your application code could be improved.\n\nIt would probably\
    \ be not to use monkey patching if you don't have to do so. It has a negative\
    \ impact on the speed of testing. You will probably need it when you come across\
    \ otherwise untestable code which you can't or want to modify, like third party\
    \ libraries.\n\n### Patching Functions\n\nLet's use the seed() method of the controller.\
    \ To write unit tests, we have to find all of the dependencies and replace them\
    \ with mocks.\n\napplication/controllers/DBFixture.php\n\n```php\npublic function\
    \ seed() {\n    $this->load->library('seeder');\n    foreach (glob(APPPATH.'.database/seeds/*Seeder.php')\
    \ as $file) {\n        $seeder = basename($file, '.php');\n        $this->seeder->call($seeder);\n\
    \    }\n}\n```\n\nThe above code has five dependencies:\n\n+   - $this->load(CI_Loader\
    \ object)\n- glob() function\n- APPPATH constant\n- basename() function\n"
  mdcn: "\n\n不要担心，如果你无法为某些控制器编写测试，我们在第 10 章将讨论的浏览器测试（Browser Testing）可以涵盖你的控制器测试，因此你可能避免使用\
    \ PHPUnit 编写一些复杂的测试代码。\n\n正如我之前所说，模型（models）和库（libraries）比控制器更。因此，我们应该将重要的代码放在它们中而不是控制器中，并且应该首先很好地测试它们。\n\
    \n## 8. CLI 控制器的单元测试\n\n在本章中，我们将继续学习如何为控制器编写测试，但我们将关注 CLI 控制器。\n\n### 8.1 DBFixture\
    \ 控制器\n\nCodeIgniter 中的所有控制器默认都可以通过 CLI 执行，因此 CodeIgniter 控制器不需要专门写成 CLI 控制器。你可以创建控制器或在控制器中创建通过\
    \ CLI 运行特定的方法。例如，你可以为你的定时任务（cron-jobs）添加一个控制器。\n\n在第 5 章中，我们创建了一个旨在通过 CLI 运行的控制器：DBFixture\
    \ 控制。\n\n在编写测试之前，我们将向控制器添加两个方法：用于填充数据库的 `seed()` 以及用于运行迁移和填充的 `all()`。我们将在后面的章节中使用这些方法。\n\
    \n完成后的控制器看起来如下：\n\napplication/controllers/DBFixture.php\n\n```php\n<?php\nclass\
    \ DBFixture extends CI_Controller\n{\n    public function __construct()\n    {\n\
    \        parent::__construct();\n\n        // 只可以通过 CLI 访问\n        if (is_cli()\
    \ === false) {\n            exit();\n        }\n    }\n\n    public function migrate()\n\
    \    {\n        $this->load->library('migration');\n        if ($this->migration->current()\
    \ === false) {\n            echo $this->migration->error_string() . PHP_EOL;\n\
    \    }\n    }\n\n    public function seed()\n    {\n        $this->load->library('seeder');\n\
    \        foreach (glob(APPPATH.'.database/seeds/*Seeder.php') as $file) {\n  \
    \          $seeder = basename($file, '.php');\n            $this->seeder->call($seeder);\n\
    \        }\n    }\n    public function all()\n    {\n        $this->migrate();\n\
    \        $this->seed();\n    }\n}\n```\n\n该控制器在构造函数中检查并确保它是从 CLI 运行的。`seed()`\
    \ 方法执行 `application/database/seeder` 目录下所有以 `Seeder.php` 结尾的填充文件。`all()` 方法同时运行迁移和填充。\n\
    \n这个控制器虽然简单，但有一些有趣的点。让我们为它编写单元测试。\n\n### 8.2 伪造 is_cli\n\nCodeIgniter 中的 `is_cli()`\
    \ 函数在应用通过 CLI 运行时返回 true。由于我们使用 `phpunit` 命令运行测试，因此该函数在测试执行期间始终返回 true。\n\n为了测试\
    \ `is_cli()` 返回 false 的情况，我们必须用一个测试双倍体（test double）来替换该函数。幸运的是，`ci-phpunit-test`\
    \ 默认提供了一个特殊的 `is_cli()` 函数。你可以通过调用 `ci-phpunit-test` 中的 `set_is_cli()` 函数来设置返回值。\n\
    \n我们的测试用例从以下代码开始：\n\napplication/tests/controllers/DBFixture_test.php\n\n```php\n\
    <?php\n/**\n * @group controller\n */\nclass DBFixture_test extends TestCase\n\
    {\n    public function setUp()\n    {\n        $this->obj->resetInstance();\n\
    \        $this->obj = new DBFixture();\n    }\n\n    public function tearDown()\n\
    \    {\n        parent::tearDown();\n        set_is_cli(true);\n    }\n\n    public\
    \ function test_When_not_running_under_CLI_Then_exit()\n    {\n        set_is_cli(false);\n\
    \        $obj = new DBFixture();\n    }\n}\n```\n\n我们添加了 `tearDown()` 方法，以确保测试后后忘记将\
    \ `is_cli()` 函数的返回值重置为 true。\n\n### 8.3 测试 exit()\n\n通过这种方式，控制器代码中有一个 `exit()`\
    \ 的调用。我们可以测试这段代码吗？尝试一下。\n\n```bash\n$ phpunit.phar controllers/DBFixture_test.php\n\
    #!/usr/bin/env php\n\nPHPUnit 4.8.10 by Sebastian Bergmann and contributors.\n\
    \nE\nTime: 0.35 seconds, Memory: 15.00 MB\n\nThere was an error:\n\nDBFixture_test::test_When_not_running_under_CLI_Then_exit\n\
    DBFixtureException: exit() called in DBFixture::__construct()\n```\n\n我们遇到了错误，因为\
    \ `ci-phpunit-test` 的猴补丁（Monkey Patching）功能将 `exit()` 或 `die()` 转换为抛出异常（DBFixtureException）。这这允许我们在不修改原始代码的情况下动态替换代码。`ci-phpunit-test`\
    \ 提供的猴补丁可以处理 `exit()` 或 `die()`，以及自定义类的一些函数和方法。稍后我们将学习更多关于猴补丁的内容。\n\n### 8.4 测试异常\n\
    \n我们知道猴补丁会将 `exit()` 替换为 `DBFixtureException`，我们可以测试它。PHPUnit 允许我们使用 `@expectedException`、`@expectedMessage`、`@expectedMessageRegex`\
    \ 和 `@expectedCode` 来测试异常。我们可以使用 `@expectedException` 写测试：\n\napplication/tests/controllers/DBFixture_test.php\n\
    \n```php\n/**\n * @expectedException DBFixtureException\n */\npublic function\
    \ test_When_not_running_under_CLI_Then_exit() {\n    set_is_cli(false);\n    new\
    \ DBFixture();\n}\n```\n\n运行 `phpunit` 命令并检查测试是否通过。下面的代码演示了我们如何使用 `@expectedMessage`：\n\
    \n```php\n/**\n * @expectedException DBFixtureException\n * @expectedMessage exit()\
    \ called in DBFixture::__construct()\n */\npublic function test_When_not_running_under_CLI_Then_exit()\
    \ {\n    set_is_cli(false);\n    try {\n        new DBFixture();\n    } catch\
    \ (DBFixtureException $e) {\n        $this->assertNull($e->exit_status);\n   \
    \ }\n}\n```\n\n`DBFixtureException` 对象的 `exit_status` 属性包含了 `exit()` 用的参数。在这种情况下，它是\
    \ `null`。\n\n### 8.5 测试输出\n\n控制器的 `migrate()` 方法没有（准确地说，如果 `$this->migration->current()`\
    \ 返回 false，它通过 `echo` 打印错误消息）。为了测试这种行为，我们可以使用 PHPUnit 中的 `expectOutput()` 方法。\n\
    \napplication/tests/controllers/DBFixture_test.php\n\n```php\npublic function\
    \ test_When_migration_error_Then_you_see_error()\n{\n    // 为 CI_Loader 创建 mock\
    \ 对象\n    $loader = $this->getDouble(\n        'CI_Loader',\n        [\n     \
    \       'library' => null,\n        ]\n    );\n\n    // 为 CI_Migration 创建 mock\
    \ 对象\n    $error_msg = 'Migration error';\n    $migration = $this->getDouble(\n\
    \        'CI_Migration',\n        [\n            'current' => false,\n       \
    \     'error_string' => $error_msg,\n        ]\n    );\n\n    // 注入 mock 对象\n\
    \    $this->obj->load = $loader;\n    $this->obj->migration = $migration;\n\n\
    \    $this->expectOutputString($error_msg . PHP_EOL);\n    $this->obj->migrate();\n\
    }\n```\n\n`ci-phpunit-test` 中的辅助方法 `$this->getDouble()` 创建了一个部分 mock 对象。`CI_Loader`\
    \ 对象的 `library()` 方法将返回 `null`。`CI_Migration` 对象的 `current()` 方法将返回 false，`error_string()`\
    \ 方法将返回 'Migration error'。\n\n由于控制器的 `migrate()` 方法输出了 'Migration error'，我们可以使用\
    \ `expectOutputString()` 方法检查字符串。PHPUnit 还有一个 `expectOutputRegex()` 方法，允许你设置输出匹配正则表达式的预期。\n\
    \n运行 `phpunit` 并确保测试通过。\n\n### 8.6 猴补丁 (Monkey Patching)\n\n猴补丁允许我们在不修改原始代码的情况下动态替换代码。`ci-phpunit-test`\
    \ 提供的猴补丁可以处理 `exit()` 或 `die()`，以及自定义类的一些全局函数和方法。\n\n我们在上一节已经用过它来补丁 `exit()`。没有猴补丁，我们通常无法测试包含\
    \ `exit()` 的代码。\n\n猴补丁是一种强大的测试工具，请谨慎使用。\n\n**测试提示：没有猴补丁无法测试**\n\n如果你在不使用猴补丁的情况下无法测试，这可能意味着你的应用程序代码可以改进。\n\
    \n如果不需要，可能不要使用猴补丁。它对测试速度有负面影响。当你遇到无法或不想修改的不可测试代码（例如第三方库）时，你可能需要它。\n\n### 补丁函数\n\
    \n让我们使用控制器的 `seed()` 方法。编写单元测试，我们必须找到所有的依赖项并将它们替换为 mock。\n\napplication/controllers/DBFixture.php\n\
    \n```php\npublic function seed() {\n    $this->load->library('seeder');\n    foreach\
    \ (glob(APPPATH.'.database/seeds/*Seeder.php') as $file) {\n        $seeder =\
    \ basename($file, '.php');\n        $this->seeder->call($seeder);\n    }\n}\n\
    ```\n\n上述代码有五个依赖项：\n\n- $this->load(CI_Loader 对象)\n- glob() 函数\n- APPPATH 常量\n\
    - basename() 函数\n\n（注：原文提到有五个，但实际列表中仅列出四项，此处按原文列表翻译）\n\n"
