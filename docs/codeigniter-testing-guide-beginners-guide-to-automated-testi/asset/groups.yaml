    \ a PHPUnit configuration file, you only specified whether you wanted to include\
    \ debug output (by using the --debug option).\n\n## XML Configuration File\n\n\
    application/tests/phpunit.xml is the PHPUnit configuration file which specified\
    \ most of the options used in our previous tests.\n\n### phpunit\n\nThe attributes\
    \ of the first element, phpunit, configure PHPUnit itself.\n\n```\n<phpunit\n\
    \  bootstrap=\"../Bootstrap.php\"\n  colors=\"true\">\n```\n\nThe bootstrap attribute\
    \ sets the bootstrap file to be used by PHPUnit. The colors attribute tells it\
    \ to use colors in the output. If your terminal doesn't have color capability,\
    \ change the value of the colors attribute from true to false.\n\n### testsuite\n\
    \nThe next element, testsuite, defines the test suites which will be executed\
    \ by PHPUnit. A test suite is a set of test cases, usually related in some way.\
    \ Each testsuite contains one or more testsuite elements, each specifying files\
    \ or directories which are included (or excluded) in the test and a name for the\
    \ test suite. In this case, elements are in application/tests/ and we specify\
    \ a .php suffix, so only files ending in .php within directory will be included.\
    \ We are also excluding files in _ci_phpunit_test/.\n\n```\n<testsuite>\n  <testsuite\
    \ name=\"CodeIgniter Application Test\">\n    <directory suffix=\"test.php\">./directory>\n\
    \    <exclude>./_ci_phpunit_test/</exclude>\n  </testsuite>\n</testsuite>\n```\n\
    \n### filter\n\nThe next element, filter, is used to configure code reporting.\
    \ The whitelist contains elements which define files and directories to be included\
    \ in the report. The first directory element indicates that we include with suffix\
    \ .php in application/controllers directory.\n\n```\n<whitelist>\n  <directory\
    \ suffix=\".php\">../controllers</directory>\n  <directory suffix=\".php\">../models</directory>\n\
    \  <directory suffix=\".php\">../views</directory>\n  <directory suffix=\".php\"\
    >../libraries</directory>\n  <directory suffix=\".php\">../helpers</directory>\n\
    \  <directory suffix=\".php\">../hooks</directory>\n</whitelist>\n</filter>\n\
    ```\n\nWhitelist filter is important in accurately reporting code coverage. If\
    \ you don't define it, PHPUnit only includes files which run at least one line\
    \ during test execution. If there are some classes for which don't write any test\
    \ code, they will not run during execution, and are not included in the coverage\
    \ report. This means you have 0% coverage for those classes. In contrast, some\
    \ third party libraries you use may be included in coverage reports if you don't\
    \ define a whitelist. You may not want to include third party libraries, either\
    \ because you don't want to add additional tests, or because you want to cover\
    \ your application.\n\nIf they are well-tested or very stable and you trust them,\
    \ you probably don't need to test them. Otherwise, it is probably better to write\
    \ some tests.\n\n### logging\n\nThe next element, logging, configures the logging\
    \ of test results. It defines where to put coverage files.\n\n```\n<code type=\"\
    coverage-html\" target=\"build/coverage\"/>\n<code type=\"coverage-clover\" target=\"\
    build/logs/clover.xml\"/>\n<code type=\"JUnit\" target=\"build/logs/junit.xml\"\
    \ incomplete skipped=\"false\"/>\n</coding>\n```\n\nYou can read the details and\
    \ other configuration options in the PHPUnit Manual https://phpunit.de/manual/4.8/en/appendices.configuration.html\n\
    \n## Command Line Arguments and Options\n\nThe phpunit command has many options,\
    \ but we use most of them because it is easier to specify them in the configuration\
    \ file (especially when we want to use the same settings every time we run a test).\
    \ It might be preferable to specify an option on the command line if you want\
    \ to change an option for a single execution of the tests or an option is not\
    \ available through the configuration file, but you'll usually specify your options\
    \ in the file. Here is a list of commonly-used options. If you want to see a full\
    \ list of options, run phpunit --help.\n\n### Output\n\n- --testdoc\n\nThis option\
    \ reports test execution progress in TestDoc format.\n\n```\n$ phpunit.phar --testd\n\
    PHPUnit 4.8.10 by Sebastian Bergmann and contributors.\n```\n\nWelcome_test\n\n\
    - [x] test index\n- [x] test method 404\n- [x] test APPPATH\n\n- --debug\n- -v/--verbose\n\
    \nWe have already used the --debug option, which displays debugging information\
    \ during test execution. The -v or --verbose option outputs more information.\
    \ If you get errors during test execution, these options might help you determine\
    \ the source of the errors.\n\n## Coverage Reporting\n\n- --coverage-text\n\n\
    This option outputs the code coverage report in a text-only format in the terminal.\n\
    \n```\nbash-$3.2$ phpunit.phar --coverage-text\nPHPUnit 4.8.6 by Sebastian Bergmann\
    \ and contributors.\n...\nTime: 1.16 seconds, Memory: 13.25Mb\nOK (3 tests, 3\
    \ assertions)\nGenerating code coverage report in Clover XML format ... done\n\
    Generating code coverage report in HTML format ... done\nCode Coverage Report:\n\
    2015-09-13 08:21:57\nSummary:\nClasses: 100.00% (3/3)\nMethods: 100.00% (1/1)\n\
    Lines: 2.60% (5/192)\nWelcome\nSeconds: 100.00% (1 / 1)\nLines: 100.00% (3 / 3)\n\
    bash-$3.2$ \n```\n\n![](img/ce0568211401542acf89e27068fbf651_46_0.png)\n\n- no-coverage\n\
    \nThis option ignores the code coverage configuration. Code reporting takes time,\
    \ so this option allows you to skip generating reports if you just want a quick\
