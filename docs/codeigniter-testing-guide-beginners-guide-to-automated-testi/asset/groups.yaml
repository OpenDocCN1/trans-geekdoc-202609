    \ (sec) | Total Time (sec) |\n|---|---|---|---|---|---|---|---|\n| 5.6.18-dev\
    \ | Yes | 2.4.RC3 | n/a | n/a | 4.6.10 (Phar) | 32.35 | 35.644 |\n| 5.6.18-dev\
    \ | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Phar) | 26.53 | 29.920 |\n| 5.6.18-dev\
    \ | No | 2.4.RC3 | no-coverage | n/a | 4.8.21 (Phar) | 3.29 | 3.426 |\n| 5.6.18-dev\
    \ | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Composer) | 21.60 | 24.922 |\n| 5.6.18-dev\
    \ | Yes | 2.4.0 | n/a | n/a | 5.0.10 (Phar) | 25.99 | 29.350 |\n| 5.6.18-dev |\
    \ Yes | 2.4.03 | n/a | n/a | 5.1.3 (Phar) | 26.14 | 29.512 |\n| 5.6.18-dev | No\
    \ | n/a | n/a | n/a | 4.6.10 (Phar) | 1.51 | 1.638 |\n| 5.6.18-dev | No | n/a\
    \ | n/a | n/a | 4.8.21 (Phar) | 1.51 | 1.633 |\n| 5.6.18-dev | No | n/a | n/a\
    \ | n/a | 4.8.21 (Composer) | 1.30 | 1.416 |\n| 7.0.3-dev | Yes | n/a | n/a |\
    \ 0.5.0 | 4.8.21 (Composer) | 2.00 | 2.728 |\n| 7.0.3-dev | No | n/a | n/a | n/a\
    \ | 4.6.10 (Phar) | 0.799 | 0.834 |\n| 7.0.3-dev | No | n/a | n/a | n/a | 4.8.21\
    \ (Phar) | 0.792 | 0.825 |\n| 7.0.3-dev | No | n/a | n/a | n/a | 4.8.21 (Composer)\
    \ | 0.732 | 0.769 |\n\n## SQLite in-memory database\n\nTo use a SQLite in-memory\
