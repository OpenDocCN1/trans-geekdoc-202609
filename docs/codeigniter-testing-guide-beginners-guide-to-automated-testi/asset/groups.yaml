    # 启动 (Bootstrap)


    PHPUnit 的启动文件是 `tests/Bootstrap.php`。它在运行测试用之前执行一次。它包含三个部分：


    1. CodeIgniter `index.php` 文件的近乎副本。

    2. Monkey Patch 库的初始化。

    3. 调用 `PHPUnitTest::init()` 方法。


    `PHPUnitTest::init()` 方法注册自动加载器，用于加载新函数以及被替换的类和函数。它还会执行 CodeIgniter 的 `core/CodeIgniter.php`，但不是全部。你可以在
    `replacing/core/CodeIgniter.php` 中看到它的替换版本。


    # 自动加载器 (Autoloader)


    `tests/autoloader.php` 文件注册了自动加载器。`PHPUnitTest-Autoloader::load()` 方法提供了自动加载器的功能。它自动加载
    `ci-phpunit-test` 的类，如控制器、模型和库。


    # 被替换的类和函数 (Replaced Classes and Functions)


    某些 CodeIgniter 的类和函数被 `ci-phpunit-test` 替换，以便更容易编写测试。你可以在《编写测试》中看到所有被替换的函数和类名。`ci-phpunit-test`
    替换的大多数函数和类出于两个原因：


    1. 重置 CodeIgniter 超对象 (super object)

    2. 仅为测试提供行为


    https://github.com/kenjis/ci-phpunit-test/blob/docs/ToWriteTests.md#can-and


    第一点要求主要是因为 CodeIgniter 超对象是单例（singleton）的一种形式。单例是一种限制类实例化只有一个实例的设计模式。事实上，在正常情况下，预期只存在一个实例。除非将它们重置为已知状态（为了测试的各个部分），否则单例非常难以测试。因此，`ci-phpunit
    test` 具有重置 CodeIgniter 超对象的能力。某些函数被替换是为了使 `load_class()` 和 `is_loaded()` 可用。


    第二点的必要性部分是因为 CodeIgniter 代码的部分执行了会阻止测试运行的操作。例如，`redirect()`、`show404()` 和 `show_error()`
    调用了 `exit()`，因此 `ci-phpunit` 将它们替换为不调用 `exit()` 的版本。


    另一个例子是 `CI_load`。当我们运行测试时，可能会调用多个控制器，并可能多次加载库。`CI_load` 类具有防止重复加载的代码，因此我们需要调试该部分代码。


    如果你通过 Composer 安装了 CodeIgniter 和 `ci-phpunit`，你可以使用以下命令检查 `CI_Load` 类的差异：


    ```

    $ cd vendor/kenjis/ci-phpunit-test

    $ bin/check-diff.sh

    ```


    在另一个替换类以仅提供测试行为的例子中，`set_header()` 被替换了，以允许它在从 CLI 运行时能够运行，并将状态保存在 `CI_Output`
    对象中，从而让 `ci-phpunit` 更好地访问这些信息。


    # 新函数 (New Functions)


    出于同样的原因，需要新函数：


    - 重置 CodeIgniter 超对象

    - 仅为测试提供行为


    `reset_instance()` 函数重置 CodeIgniter 超对象。


    `load_class_instance()` 函数提供了仅测试需要的行为。通过直接向 `load_class()` 函数注入 CodeIgniter 实例，它可以操作该函数的状态。`set_is_cli()`
    函数允许 `ci-phpunit` 修改 CodeIgniter 的 `is_cli()` 函数的返回值。


    # TestCase 类 (TestCase classes)


    `PHPUnitTestCase` 是 `TestCase` 类的基类。`TestCase` 类允许用户自定义，因此它默认没有逻辑。


    `PHPUnitTestCase` 提供了许多测试方法，包括断言 (assertions)、设置 (setup) 和拆除 (teardown)。它还将方法传递到其他对象（例如
    `PHPRequest` 和 `UnitTestDouble`）。


    # 请求相关类 (Request related classes)


    `PHPUnitTestRequest` 提供 `$this->request()` 方法。它模拟对控制器或 URI 字符串的 HTTP 请求。如果你向 `$this->request()`
    传递 URI 字符串，`PHPUnitTestRequest` 对象将使用 `PHPRouter` 对象解析路由。


    `PHPUnitTestGlobal` 对象为请求设置超全局变量 (super global variables)。在 phpunit-v0.10.1 之后，它还将用于设置
    CodeIgniter 核心对象的全局变量。


    # 辅助类 (Helper classes)


    有两个辅助类。一个是 `PHPUnitTestDouble`，它帮助创建 PHPUnit Mock 并验证调用。另一个是 `PHPUnitTestReflection`，它帮助使用
    PHP 反射访问私有方法/属性。


    辅助类仅提供辅助方法或快捷方式。`$this->getDouble()` 和 `$this->verifyInvoked()` 方法被传递给 `PHPUnitTestDouble`
    对象。


    `PHPUnitTestReflection` 类可以用作 `ReflectionHelper` 类。这种设置是一个别名，可以在 `alias` 目录下找到。


    # 补丁库 (Monkey Patch library)


    Monkey 补丁库通过 `ci-phpunit-test` 提供补丁功能。它可以作为独立库使用，提供了三种补丁器：


    - ExitPatcher ... 转换 exit()

    - FunctionPatcher ... 转换函数

    - MethodPatcher ... 转换方法


