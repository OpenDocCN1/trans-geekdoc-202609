  - '[PAGE 20]


    # What is Automated Testing?


    +   1. **Think**: Figure out what test will move your code towards completion.
    (Take as much time as you need. This is the hardest step for beginners.)


    +   2. **Red**: Write a very small amount of test code. Only a few lines... usually
    no more than five. Run the tests and watch the test fail: the test bar should
    turn red. (This should only take about 30 seconds.)


    +   3. **Green**: Write a very small amount of production code. Again, usually
    no more than five lines of code. Don''t worry about design purity or conceptual
    elegance. Sometimes you can just hardcore the answer. This is okay because you''ll
    be refactoring in a moment. Run the tests and watch them pass: the test bar will
    turn green. (This should only take about 30 seconds, too.)


    +   4. **Refactor**: Now that your tests are passing, you can make changes without
    worrying about breaking anything. Pause for a moment. Take a deep breath if you
    need to. Then look at the code you''ve written, and ask yourself if you can improve
    it. Look for duplication and other "code smells." If you see something that doesn''t
    look right, but you''re not sure how to fix it, that''s okay. Take a look at it
    again after you''ve gone through the cycle a few more times. (Take as much time
    as you need on this step.) After each little refactoring, run the tests and make
    sure they still pass.


    +   5. **Repeat**: Do it again. You''ll repeat this cycle dozens of times in an
    hour. Typically, you''ll run through several cycles (three to five) very quickly,
    then find yourself slowing down and spending more time on refactoring. You''ll
    speed up again. 20-40 cycles in an hour is not unreasonable.


    Unfortunately, this book won''t serve as a good example of TDD, because we won''t
    write tests first, since we will use existing application code for most of our
    tests. I recommend you try to write test code in your real application development.'
