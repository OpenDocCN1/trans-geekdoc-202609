    }\n```\n\n## 基础规范\n\n## PHPUnit 规范\n\n这里是 PHPUnit 的基本规范。\n\n- 1. 类的测试放入名为 ClassTest\
    \ 的类中。\n- 2. ClassTest 继承自 PHPUnit_Framework_TestCase（大多数情况下）。\n- 3. 测试是以 test*\
    \ 命名的公共方法。或者，你也可以在方法的 docblock 中使用 @test 标签将其标记为测试方法。\n- 4. 在测试内部，使用诸如 `assertEquals()`\
    \ 等断言方法来断言实际值是否匹配预期值。\n\n## ci-phpunit-test 规范\n\n我们将根据 CodeIgniter 的编码规范对这些规范进行一些修改，并提供一种方便的测试方法。\n\
    \n- 1. 命名类的测试放入对应命名的 Class_test 中。\n- 2. Class_test 继承自 TestCase。\n- 3. 测试是以 test_*\
    \ 命名的公共方法。或者，你也可以在方法的 docblock 中使用 @test 标签将其标记为测试方法。\n\nTestCase 类继承自 PHPUnit_Framework_TestCase，因此从技术上说，在继承\
    \ PHPUnit_Framework_TestCase 方面我们仍然遵循 PHPUnit 的规范，但 TestCase 类为在 CodeIgniter 中运行测试添加了一些方便的功能。\n\
    \n我们将测试文件放在 `application/tests` 目录下。\n\n## PHPUnit 基础\n\n- CodeIgniter/\n  application/\n\
    \    tests/\n      Bootstrap.php ... PHPUnit 的引导文件\n      TestCase.php ... TestCase\
    \ 类\n      controllers/ ... 存放你的控制器测试\n      libraries/ ... 存放你的库测试\n      models/\
    \ ... 存放你的模型测试\n      phpunit.xml ... PHPUnit 的配置文件\n\n## 我们的第一个测试\n\n现在我们已经了解了基础，可以为我们的\
    \ `Temperature_converter` 类编写测试代码了。\n\napplication/tests/libraries/Temperature_converter_test.php\n\
    \n```php\n<?php\nclass Temperature_converter_test extends TestCase\n{\n    public\
    \ function test_FtoC()\n    {\n        $obj = new Temperature_converter();\n \
    \       $actual = $obj->FtoC(100);\n        $expected = 37.0;\n        $this->assertEquals($expected,\
    \ $actual, '', 0.01);\n    }\n}\n```\n\n> 给 CodeIgniter 用户\n>在这种情况下，ci-phpunit\
    \ 会自动加载 `Temperature_converter` 库，所以你不需要在 CodeIgniter 中调用 `$this->load->library()`\
    \ 方法。\n\n`$this->assertEquals()` 方法是 PHPUnit 的断言方法之一。它检查两个值是否相等。第三个参数允许我们提供错误信息，但我们将其设置为空字符串以使用默认消息。第四个参数是允许的差值（delta），即前两个值之间被认为是相等的差异。\n\
    \n## 浮点数的比较\n\n使用 `$this->assertEquals()` 对浮点数进行比较时，应该作为第四个参数提供允许的差值。更多信息请参阅《每个计算机科学家应该知道的浮点算术》和\
    \ PHP 手册。\n\n由于我们比较的是浮点数，我们必须设置第四个参数。在比较字符串或整数时我们不需要它，所以我们经常编写这样的代码：\n\n```php\n\
    $this->assertEquals($expected, $actual);\n```\n\n尝试使用 phpunit 命令运行测试用例。\n\n```bash\n\
    $ php phpunit.phar libraries/Temperature_converter_test.php\n```\n\n## 给 Composer\
