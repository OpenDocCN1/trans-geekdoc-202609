    \n## 4.3 配置 PHPUnit\n\n在上一节中，你运行了 `phpunit` 命令并看到了输出。由于大多数配置选项都是通过 PHPUnit 配置文件指定的，因此你只需要指定是否要包含调试输出（通过使用\
    \ --debug 选项）。\n\n## XML 配置文件\n\n`application/tests/phpunit.xml` 是 PHPUnit 配置文件，它指定了我们在之前的测试中使用的大多数选项。\n\
    \n### phpunit\n\n第一个元素 `phpunit` 的属性用于配置 PHPUnit 自身。\n\n```\n<phpunit\n  bootstrap=\"\
    ../Bootstrap.php\"\n  colors=\"true\">\n```\n\n`bootstrap` 属性设置了 PHPUnit 使用的引导文件。`colors`\
    \ 属性告诉它在输出中使用颜色。如果你的终端不支持颜色，请将 `colors` 属性的值从 `true` 改为 `false`。\n\n### testsuite\n\
    \n下一个元素 `testsuite` 定义了由 PHPUnit 执行的测试套件。测试套件是一组测试用例，通常在某些方面相互相关。每个 `testsuite`\
    \ 包含一个或多个 `testsuite` 元素，每个元素指定了测试中包含（或排除）的文件或目录，以及测试套件的名称。在这种情况下，元素位于 `application/tests/`\
    \ 中，我们指定了 `.php` 后缀，因此目录中所有以 `.php` 结尾的文件将被包含。我们还排除了 `_ci_phpunit_test/` 中的文件。\n\
    \n```\n<testsuite>\n  <testsuite name=\"CodeIgniter Application Test\">\n    <directory\
    \ suffix=\"test.php\">./directory>\n    <exclude>./_ci_phpunit_test/</exclude>\n\
    \  </testsuite>\n</testsuite>\n```\n\n### filter\n\n下一个元素 `filter` 用于配置代码报告。白名单包含了定义要包含在报告中的文件和目录的元素。第一个\
    \ `directory` 元素表示我们包含了 `application/controllers` 目录中以 `.php` 为后缀的文件。\n\n```\n\
    <whitelist>\n  <directory suffix=\".php\">../controllers</directory>\n  <directory\
    \ suffix=\".php\">../models</directory>\n  <directory suffix=\".php\">../views</directory>\n\
    \  <directory suffix=\".php\">../libraries</directory>\n  <directory suffix=\"\
    .php\">../helpers</directory>\n  <directory suffix=\".php\">../hooks</directory>\n\
    </whitelist>\n</filter>\n```\n\n白名单过滤对于准确报告代码覆盖率非常重要。如果不定义它，PHPUnit 只包含在执行期间至少运行了一行的文件。某些类没有编写测试代码，它们在执行期间将不会运行，也不会被包含在覆盖率报告中。这意味着这些类的覆盖率为\
    \ 0%。与相比之下，如果你不定义白名单，你使用的某些第三方库可能会被包含在覆盖报告中。你可能不想包含第三方库，可能是因为你不想添加额外的测试，也因为你只想覆盖自己的应用程序。\n\
    \n如果它们经过了良好的测试或者非常稳定且你信任它们，可能不需要对它们进行测试。否则，编写一些测试可能更好。\n\n### logging\n\n下一个元素\
