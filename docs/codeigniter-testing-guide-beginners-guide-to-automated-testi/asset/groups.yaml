    # PHPUnit Basics


    The whitelist filter is important in accurately reporting code coverage. If you
    don''t define it, PHPUnit only includes PHP files which run at least one line
    during test execution. If there are some PHP classes for which you don''t write
    any test code, they probably will not run during test execution, and they are
    not included in the coverage report. This means you have 0% coverage for those
    classes, but your coverage report doesn''t include the classes in calculating
    the coverage for your application.


    In contrast, some third party libraries which you use may be included in coverage
    reports if you don''t define a whitelist element. You may not want to include
    the third party libraries, either because you don''t want to add the additional
    tests, or the tests aren''t available.


    # Do We Need to Test Third Party Libraries?


    If they are well-tested or are very stable and you trust them, you probably don''t
    need to test them. Otherwise, it is probably better to write some tests. In most
    cases, you''ll probably want to write some tests to at least cover your assumptions
    about the library.


    # logging


    The next element, logging, configures the logging of test results. It defines
    where to put coverage report files.


    ```

    <code type="coverage-html" target="build/coverage"/>

    <code type="coverage-clover" target="build/logs/clover.xml"/>

    <code type="JUnit" target="build/logs/junit.xml" logIncompleteSkipped="false"/>

    </coding>

    ```


    You can read the details and other configuration options in the PHPUnit Manual
    https://phpunit.de/manual/4.8/en/appendices.configuration.html


    # Command Line Arguments and Options


    The phpunit command has many options, but we don''t use most of them, because
    it is easier to specify them in the configuration file (especially when we want
    to use the same settings every time we run a test). It might be preferable to
    specify an option on the command line if you want to change an option for a single
    execution of the tests or an option isn''t available through the configuration
    file, but you''ll usually specify your options in the file.


    Here is a list of commonly-used options. If you want to see a full list of options,
    runphpunit --help.


    # Output


    +   - --testdoc


    This option reports test execution progress in TestDoc format.'
