  mdcn: "\n# 什么是自动化测试？\n\n这些观点在某种意义上都是正确的，但并非在所有情况下都适用。在书中，我不会说这些话，而是建议遵循“Testivus\
    \ 之路”：\n\n- 如果你写了代码，就写测试\n- 不要陷入单元测试的教条主义中\n- 拥抱单元测试的因果（Karma）\n- 将代码和测试视为一体\n\
    - 测试比单元更重要\n- 测试的最佳时机是代码记忆犹新的时候\n- 测试不会逃跑\n- 一个不完美的测试也比某天一个完美的测试好\n- 一个糟糕的测试也比没有测试好\n\
    - 有时，测试证明了……的合理性\n- 只有愚蠢才不使用工具\n- 好的测试是失败的\n\n避免极端，寻找中道。在书中，我们倾向于提供简单易于理解的解决方案。\n\
    \n# 1.4 你应该测试什么？\n\n这是一个最难回答的问题，在某些情况下几乎无法回答。相反，问我们**不需要**测试什么会更好。\n\n如果我们绝对认为不需要测试*某些东西*，那么我们就不测试它。如果我们不确定，我们就测试一切。\n\
    \n然而，我们正试图寻找中道，我们稍后第 3 章“覆盖率”中回到这个观点。现在，与其担心一切，我们将专注于在可能的情况下编写测试，并获得良好的测试因果。\n\
    \n# 1.5 TDD 还是非 TDD\n\n*测试驱动开发（TDD）* 是一种软件开发过程，你先编写代码，然后编写通过测试的代码，并在极短的开发周期内重复自动化测试。\n\
    \n我们更倾向于 TDD，但你可以选择任何适合你的开发流程。如果我们回到“Testivus 之路”，它说“将代码和测试视为一体”以及“测试的最佳时机是代码记忆犹新的时候”。\n\
    \n根据 James Shore¹，TDD 的开发流程如下：\n\n- 1. **思考 (Think)**：弄清楚什么测试能让你的代码走向完成。（花费你需要的时间。这是初学者最难的一步。）\n\
    \n- 2. **红色（Red）**：编写极少量的测试代码。只有几行……通常不超过五行。运行测试并观察测试失败：测试状态条应该变成红色。（这应该只需要大约\
    \ 30 秒。）\n\n- 3. **绿色（Green）**：编写极少量的生产代码。同样，通常不超过五行代码。不要担心设计的纯洁性或概念的优雅。有时你可以直接硬编码答案。没关系，因为你稍后就会进行重构。运行测试并观察它们通过：测试状态条将变成绿色。（这也只需要大约\
    \ 30 秒。）\n\n- 4. **重构 (Refactor)**：现在你的测试通过了，你可以进行更改而不用担心破坏任何东西。停顿一下。如果需要，深呼吸。然后查看你编写的代码，并问问自己是否可以改进它。寻找重复和其他“代码异味”。如果你看到某些看起来不对劲，但不确定如何修复，没关系。在运行过几次循环后再次查看它。（在这一步上你可以花费任何需要的时间。）每次小幅重构后，运行测试并确保它们仍然通过。\n\
    \n- 5. **重复 (Repeat)**：再次执行。你会在一个小时内重复此此循环几十次。通常情况下，你会非常快速地运行几个循环（三到五个），然后发现自己速度慢了下来，在重构上花费了更多时间。你会再次加速。每小时\
    \ 20-40 个循环并不合理。\n\n遗憾的是，这本书不会作为 TDD 的良好范例，因为我们不会先写测试，由于我们大多数测试将使用现有的应用程序代码。我建议你在真实的应用程序开发中尝试编写测试代码。\n\
    \n# 设置测试环境\n\n在你的 PHP 环境中运行测试，你可能需要安装一些额外的软件。假设你已经安装了 PHP 5.4、5.5 或 5.6。\n\n如果你熟悉并偏于使用\
    \ Composer，请参阅 [通过 Composer 安装]().\n\n# 2.1 安装 CodeIgniter\n\n从 [http://www.codeigniter.com/download]()\
    \ 下载最新的 CodeIgniter 3.0 版本（在书中我们 v3.0.1）并解压。\n\n为了简单起见，我们将 CodeIgniter-3.0.1 目录重命名为\
    \ CodeIgniter。\n\n```\nCodeIgniter/\n|- application/ ... 你的应用程序文件将放在这里。\n|- system/\
    \ ... CodeIgniter 文件，你不应该修改这些文件。\n|- user_guide/ ... CodeIgniter 用户指南 (HTML)，可以省略。\n\
    ```\n\n# 2.2 安装 ci-phpunit-test\n\nci-phpunit-test 是由 Kenji Suzuki 编写的一个工具，它让\
    \ CodeIgniter 3.0 和 PHPUnit 的配合变得更容易。CodeIgniter 有自己的单元测试库，但其功能非常有限，PHPUnit 用于测试\
    \ CodeIgniter 本身。CodeIgniter 的开发者计划在 CodeIgniter 4 中提供基于 PHPUnit 的应用测试。因此 ci-phpunit-test\
    \ 是 CodeIgniter 3.0 缺失拼图，提供了使用 PHPUnit 进行应用测试的能力。\n\n从 [https://github.com/kenji/ci-phpunit-test/releases]()\
    \ 下载最新版本的 ci-phpunit-test（在书中使用 v0.10）并解压。将文件夹放在你任何地方。\n\n```\nCodeIgniter/\n\
    |- application/\n|- tests/\n```\n\n# 猴补丁 (Monkey Patching)\n\n> ci-phpunit-test\
    \ 是由 Kenji Suzuki 编写的一个工具，它让 CodeIgniter 3.0 和 PHPUnit 的配合变得更容易。CodeIgniter 有自己的单元测试库，但其功能非常有限，PHPUnit\
    \ 用于测试 CodeIgniter 本身。CodeIgniter 的开发者计划在 CodeIgniter 4 中提供基于 PHPUnit 的应用测试。因此\
    \ ci-phpunit-test 是 CodeIgniter 3.0 缺失拼图，提供了使用 PHPUnit 进行应用测试的能力。\n\n> 猴补丁是一种是一种在不修改原始源代码的情况下替换\
    \ `exit()`、`die()` 以及代码中某些函数和方法的方法。要启用猴补丁，请在编辑器中打开 `application/bootstrap.php`。\n\
    \n*(注：OCR 文本在末尾极其重复且破碎。我将根据提供的逻辑片段提供一个干净的合并版本。)*\n\n[content]\n# 什么是自动化测试？\n\n\
    这些观点在某种意义上都是正确的，但并非在所有情况下都适用。在书中，我不会说这些话，而是建议遵循“Testivus 之路”：\n\n- 如果你写了代码，就写测试\n\
    - 不要陷入单元测试的教条主义中\n- 拥抱单元测试的因果（Karma）\n- 将代码和测试视为一体\n- 测试比单元更重要\n- 测试的最佳时机是代码记忆犹新的时候\n\
    - 测试不会逃跑\n-不完美的测试也比某天一个完美的测试好\n- 一个糟糕的测试也比没有测试好\n- 有时，测试证明了……的合理性\n- 只有愚蠢才不使用工具\n\
    - 好的测试是失败的\n\n避免极端，寻找中道。在书中，我们倾向于提供简单易于理解的解决方案。\n\n# 1.4 你应该测试什么？\n\n这是一个最难回答的问题，在某些情况下几乎无法回答。相反，问我们**不需要**测试什么会更好。\n\
    \n如果我们绝对认为不需要测试*某些东西*，那么我们就不测试它。如果我们不确定，我们就测试一切。\n\n然而，我们正试图寻找中道，我们稍后第 3 章“覆盖率”中回到这个观点。现在，与其担心一切，我们将专注于在可能的情况下编写测试，并获得良好的测试因果。\n\
    \n# 1.5 TDD 还是非 TDD\n\n*测试驱动开发（TDD）* 是一种软件开发过程，你先编写代码，然后编写通过测试的代码，并在极短的开发周期内重复自动化测试。\n\
    \n我们更倾向于 TDD，但你可以选择任何适合你的开发流程。如果我们回到“Testivus 之路”，它说“将代码和测试视为一体”以及“测试的最佳时机是代码记忆犹新的时候”。\n\
    \n根据 James Shore¹，TDD 的开发流程如下：\n\n- 1. **思考 (Think)**：弄清楚什么测试能让你的代码走向完成。（花费你需要的时间。这是初学者最难的一步。）\n\
    \n- 2. **红色（Red）**：编写极少量的测试代码。只有几行……通常不超过五行。运行测试并观察测试失败：测试状态条应该变成红色。（这应该只需要大约\
    \ 30 秒。）\n\n- 3. **绿色（Green）**：编写极少量的生产代码。同样，通常不超过五行代码。不要担心设计的纯洁性或概念的优雅。有时你可以直接硬编码答案。没关系，因为你稍后就会进行重构。运行测试并观察它们通过：测试状态条将变成绿色。（这也只需要大约\
    \ 30 秒。）\n\n- 4. **重构 (Refactor)**：现在你的测试通过了，你可以进行更改而不用担心破坏任何东西。停顿一下。如果需要，深呼吸。然后查看你编写的代码，并问问自己是否可以改进它。寻找重复和其他“代码异味”。如果你看到某些看起来不对劲，但不确定如何修复，没关系。在运行过几次循环后再次查看它。（在这一步上你可以花费任何需要的时间。）每次小幅重构后，运行测试并确保它们仍然通过。\n\
    \n- 5. **重复 (Repeat)**：再次执行。你会在一个小时内重复此循环几十次。通常情况下，你会非常快速地运行几个循环（三到五个），然后发现自己速度慢了下来，在重构上花费了更多时间。你会再次加速。每小时\
    \ 20-40 个循环并不合理。\n\n遗憾的是，这本书不会作为 TDD 的良好范例，因为我们不会先写测试，由于我们大多数测试将使用现有的应用程序代码。我建议你在真实的应用程序开发中尝试编写测试代码。\n\
    \n```php\n$config = array(\n    // 测试所在的目录\n    'test_directory' => array(\n \
    \       'Sample Tests' => '{$root}/app/test',\n        '//My Project' => '{$var/www/sites/my.awesome.site/laravel/tests',\n\
    \        'CodeIdentifier Testing Guide'\n        => '/Users/kenji/code/CodeIdentifier/application/tests',\n\
    \    ),\n\n    // 必要的路径\n    'include_paths' => array(\n        APPPATH,\n   \
    \     BASEPATH,\n    ),\n\n    // 排除的目录\n    'exclude_paths' => array(\n     \
    \   APPPATH . '/tests/',\n    ),\n\n    // 你使用的所有补丁\n    'patch_list' => array(\n\
    \        'ExitPatcher',\n        'FunctionPatcher',\n        'MethodPatcher',\n\
    \    ),\n\n    // 需要补丁的函数\n    'functions_to_patch' => array(\n        'random_string',\n\
    \    ),\n\n    // 为了让 PHP 正常工作，配置文件必须\n    // 包含 JSON 监听器（更多信息请参 README）\n   \
    \ 'xml_configuration_files' => array(\n        '/Users/kenji/code/CodeIdentifier/tests/phpunit.xml',\n\
    \    ),\n);\n```\n"
