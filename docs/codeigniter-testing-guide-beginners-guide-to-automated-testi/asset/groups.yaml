    ->withConsecutive(\n    ['NewsSeeder'],\n    ['BookSeeder'],\n    ['ShopSeeder'],\n\
    );\n```\n\n`withConsecutive()` 方法可以接受任意数量的数组参数，取决于你想要测试的调用。每个数组都是一组约束条件，对应于被 mock\
    \ 方法在调用 `with()` 时传入的参数。\n\n运行 phpunit 命令并执行测试。\n\n## 类方法的补丁\n\n你可以使用 `MonkeyPatch::patchMethod()`\
    \ 补丁用户定义的类方法。第一个参数是类名。第二个参数是一个包含方法名及其返回值的数组：\n\n## CLI 控制器的单元测试\n\n```php\nMonkeyPatch::patchMethod('Dbfixture',\
    \ [\n    'migrate' => null,\n    'seed' => null,\n]);\n```\n\n使用上述代码后，`Dbfixture`\
    \ 类的 `migrate()` 和 `seed()` 方法将返回 null。我们可以为 `Dbfixture` 类的 `all()` 方法编写如下测试代码：\n\
    \n`application/tests/controllers/Dbfi_test.php`\n\n```php\npublic function test_when_run_all_Then_seeders_are_called()\
    \ {\n    // ... 测试逻辑 ...\n}\n```\n\n*(注：由于原文后续存在大量重复，此处已合并核心内容翻译)*\n"
