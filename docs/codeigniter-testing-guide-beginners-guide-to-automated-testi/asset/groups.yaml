    \ | 总时间 (sec) |\n|---|---|---|---|---|---|---|---|\n| 5.6.18-dev | 是 | 2.4.0 |\
    \ n/a | n/a | 5.0.10 (Phar) | 25.99 | 29.350 |\n| 5.6.18-dev | 是 | 2.4.03 | n/a\
    \ | n/a | 5.1.3 (Phar) | 26.14 | 29.512 |\n| 5.6.18-dev |  | n/a | n/a | n/a |\
    \ 4.6.10 (Phar) | 1.51 | 1.638 |\n| 5.6.18-dev |  | n/a | n/a | n/a | 4.8.21 (Phar)\
    \ | 1.51 | 1.633 |\n| 5.6.18-dev |  | n/a | n/a | n/a | 4.8.21 (Composer) | 1.30\
    \ | 1.416 |\n| 7.0.3-dev | 是 | n/a | n/a | 0.5.0 | 4.8.21 (Composer) | 2.00 |\
    \ 2.728 |\n| 7.0.3-dev |  | n/a | n/a | n/a | 4.6.10 (Phar) | 0.799 | 0.834 |\n\
    | 7.0.3-dev |  | n/a | n/a | n/a | 4.8.21 (Phar) | 0.792 | 0.825 |\n| 7.0.3-dev\
    \ |  | n/a | n/a | n/a | 4.8.21 (Composer) | 0.732 | 0.769 |\n\n测试时间（Test Time）是\
    \ PHPUnit 的输出。总时间（Total Time）是通过 time 命令测量的整个时间。如果覆盖率（Coverage）为“是”，则包含了生成覆盖率报告的时间。两列都以秒为单位显示。\n\
    \n实际命令如下：\n\n```\n$ time phpunit-4.8.21.phar\n$ time ../vendor/bin/phpunit\n$\
    \ time phpdbg -q ../vendor/bin/phpunit\n```\n\n遗憾的是，以下组合无法正常工作：\n\n- PHP 7 + phpdbg\
    \ + PHPUnit (Phar) ... 2 个错误\n- PHP 7 + xdebug ... 段错误 (Segmentation fault)\n\n\
    你需要 PHP 7 才能使用 phpdbg 进行覆盖率报告。\n\n## 更改 PHPUnit\n\n| PHP | 覆盖率 | Xdebug | 选项 |\
    \ phpdbg | PHPUnit | 测试时间 (sec) | 总时间 (sec) |\n|---|---|---|---|---|---|---|---|\n\
