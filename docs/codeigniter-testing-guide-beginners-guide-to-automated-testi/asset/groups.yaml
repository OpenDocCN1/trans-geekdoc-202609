  md: "\n# What is Automated Testing?\n\nEach of these is true in a sense, but not\
    \ in all situations. In this book, I don't say such things, instead recommend\
    \ following \"The Way Of Testivus\":\n\n- If you write code, write tests\n- Don't\
    \ get stuck on unit testing dogma\n- Embrace unit testing karma\n- Think of code\
    \ and test as one\n- The test is more important than the unit\n- The best time\
    \ to test is when the code is fresh\n- Tests do not run away\n- An imperfect test\
    \ is better than a perfect test someday\n- An ugly test is better than no test\n\
    - Sometimes, the test justifies the\n- Only fools use no tools\n- Good tests fail\n\
    \nAvoid extremes, find the middle way. We prefer simple and easy to understand\
    \ solutions in this book.\n\n# 1.4 What should you test?\n\nThis is the most difficult\
    \ question to answer, and in some cases it's nearly impossible to answer. Instead,\
    \ it is better to ask what we don't have to test.\n\nIf we absolutely think we\
    \ don't have to test *something*, then we don't test it. If we are not sure, we\
    \ test everything.\n\nHowever, we are trying to find the middle way, we'll come\
    \ back to this idea later, in Chapter 3, Coverage. For now, rather than worrying\
    \ about everything, we're going to focus on writing tests whenever we can and\
    \ acquiring good test karma.\n\n# 1.5 TDD or Not TDD\n\n*Test Development (TDD)*\
    \ is a software development process in which you write code first, then write\
    \ code which passes the tests, and repeat automated testing in very short development\
    \ cycles.\n\nWe prefer TDD, but you can choose whatever development process works\
    \ for you. If we'd return to *The Way Of Testivus*, which says \"Think of code\
    \ and test as one\" and \"The best time to test is when the code is fresh.\"\n\
    \nAccording to James Shore¹, the development process in TDD is the following:\n\
    \n- 1. **Think**: Figure out what test will move your code towards completion.\
    \ (Take as much time as you need. This is the hardest step for beginners.)\n\n\
    - 2. **Red**: Write a very small amount of test code. Only a few lines... usually\
    \ no more than five. Run the tests and watch the test fail: the test bar should\
    \ turn red. (This should only take about 30 seconds.)\n\n- 3. **Green**: Write\
    \ a very small amount of production code. Again, usually no more than five lines\
    \ of code. Don't worry about design purity or conceptual elegance. Sometimes you\
    \ can just hardcore the answer. This is okay because you'll be refactoring in\
    \ a moment. Run the tests and watch them pass: the test bar will turn green. (This\
    \ should only take about 30 seconds, too.)\n\n- 4. **Refactor**: Now that your\
    \ tests are passing, you can make changes without worrying about breaking anything.\
    \ Pause for a moment. Take a deep breath if you need to. Then look at the code\
    \ you've written, and ask yourself if you can improve it. Look for duplication\
    \ and other \"code smells.\" If you see something that doesn't look right, but\
    \ you're not sure how to fix it, that's okay. Take a look at it again after you've\
    \ gone through the cycle a few more times. (Take as much time as you need on this\
    \ step.) After each little refactoring, run the tests and make sure they still\
    \ pass.\n\n- 5. **Repeat**: Do it again. You'll repeat this cycle dozens of times\
    \ in an hour. Typically, you'll run through several cycles (three to five) very\
    \ quickly, then find yourself slowing down and spending more time on refactoring.\
    \ You'll speed up again. 20-40 cycles in an hour is not unreasonable.\n\nUnfortunately,\
    \ this book won't serve as a good example of TDD, because we won't write tests\
    \ first, since we will use existing application code for most of our tests. I\
    \ recommend you try to write test code in your real application development.\n\
    \n# Setting Up the Testing Environment\n\nRun tests in your PHP environment, you\
    \ will probably need to install some additional software. We will assume you have\
    \ PHP 5.4, 5.5, or 5.6 installed.\n\nIf you are familiar with Composer and prefer\
    \ it, go to [Installing via Composer]().\n\n# 2.1 Installing CodeIgniter\n\nDownload\
    \ the latest version of CodeIgniter 3.0 (in this book we use v3.0.1) from [http://www.codeigniter.com/download]()\
    \ and unzip it.\n\nFor simplicity, we renamed the CodeIgniter-3.0.1 directory\
    \ to CodeIgniter.\n\n```\nCodeIgniter/\n|- application/ ... Your application files\
    \ will be placed here.\n|- system/ ... CodeIgniter files, you shouldn't modify\
    \ these files.\n|- user_guide/ ... CodeIgniter User Guide (HTML), this can be\
    \ omitted.\n```\n\n# 2.2 Installing ci-phpunit-test\n\nci-phpunit-test is a tool,\
    \ written by Kenji Suzuki, which makes it easier to work with CodeIgniter 3.0\
    \ and PHPUnit together. CodeIgniter has its own Unit testing library, but its\
    \ capabilities are pretty limited, and PHPUnit is used to test CodeIgniter itself.\
    \ CodeIgniter's developers plan to provide application testing with PHPUnit in\
    \ CodeIgniter 4. So ci-phpunit-test is a missing piece for CodeIgniter 3.0, providing\
    \ the ability to perform application testing with PHPUnit.\n\nDownload the latest\
    \ version of ci-phpunit-test (in this book we use v0.10) from [https://github.com/kenji/ci-phpunit-test/releases]()\
    \ and unzip it. Put the folder wherever you want.\n\n```\nCodeIgniter/\n|- application/\n\
