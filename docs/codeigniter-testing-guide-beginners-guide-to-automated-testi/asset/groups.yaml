    ```\n\nWe are done. Run phpunit and verify that all of the tests pass. Check the\
    \ code coverage percentage, as well.\n\n## 7.3 Mocking Models\n\nIn the previous\
    \ section, we wrote tests the database. We performed some integrated testing with\
    \ the controller, model, and views.\n\nIf you are not interested in testing the\
