    \ the Database?\n\nWe wrote the test case with Database Fixture in Chapter 5,\
    \ Test Case for Model. We wrote the test case with Mocks in the previous section.\n\
    \nWhich is better? In this case, the test case with the database is simpler and\
    \ easier to understand. In fact, it seems a bit faster than the test case with\
    \ mocks on my computer. You will probably prefer testing with the database.\n\n\
    Does it mean you should always write tests with the database? The answer is not\
    \ so simple.\n\n# Testing with Little Value\n\nIf we have two classes, Foo and\
    \ Bar, like below:\n\napplication/libraries/Foo.php\n\n```php\n<?php\nclass Foo\
    \ {\n    private $bar;\n    public function __construct(Bar $bar) {\n        $this->bar\
    \ = $bar;\n    }\n    public function bar($arg) {\n        return $this->bar->baz($arg);\n\
    \    }\n}\n```\n\nThe Foo depends on the class Bar.\n\napplication/libraries/Bar.php\n\
    \n```php\n<?php\nclass Bar {\n    public function baz($arg) {\n        // Very\
    \ complex logic\n        // ...\n        return $return;\n    }\n}\n```\n\nWe\
    \ can write a test case for the Foo class using a mock like this:\n\napplication/tests/libraries/Foo_test.php\n\
    \n```php\n<?php\n/**\n * @group library\n */\nclass Foo extends TestCase\n{\n\
    \    public function test_bar()\n    {\n        $mock = $this->getMockBuilder('Bar')\n\
    \            ->getMock();\n        $mock->method('baz')->willReturn('mocked value');\n\
