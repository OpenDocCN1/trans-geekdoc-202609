    # # Appendix A


    # ## How to Speed Up Testing


    If you have slow tests, they may prevent you from testing, so your tests should
    be fast. This appendix will give you some hints to speed up your tests.


    Whenever possible, you should make your tests faster. However, if you keep writing
    tests, you can end up with so many tests running your whole test suite will take
    a long time, no matter how fast the individual tests may be.


    Still, there is usually something you can do to speed up your tests.


    # ## Speed Up without Code Modifications


    Without modifying your application/test code, there are still some things which
    might make your tests run faster:


    +   - change the version of PHPUnit you are using

    - install PHPUnit via Composer

    - disable code coverage reporting

    - disable Xdebug

    - use phpdebug instead of Xdebug

    - upgrade to PHP 7

    - use a SQLite in-memory database


    Here are the benchmarks of a certain Codeigniter project:


    | PHP | Coverage | Xdebug option | phpdbug | PHPUnit | Test Time (sec) | Total
    Time (sec) |

    |---|---|---|---|---|---||}{

    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.6.10 (Phar) | 32.35 | 35.644 |

    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Phar) | 26.53 | 29.920 |

    | 5.6.18-dev | No | 2.4.RC3 | no-cov-er | n/a | 4.8.21 (Phar) | 3.29 | 3.426 |

    | 5.6.18-dev | Yes | 2.4.RC3 | n/a | n/a | 4.8.21 (Composer) | 21.60 | 24.922
    |'
