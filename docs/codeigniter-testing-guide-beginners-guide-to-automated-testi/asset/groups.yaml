    # 7. Testing Controllers


    We will learn more about testing controllers in this and the next two chapters.
    In this chapter, we will write tests for the News controller for a quick review,
    then write tests with mock models. We will also write tests for authentication
    and redirection.


    # ##7.1 Why is Testing Controllers Difficult?


    In a previous chapter, we wrote test code for a controller (See Chapter 5, Test
    Case for Page Controller). Those tests are simple, but that is because the controller
    is very simple.


    The controller does not use any models, libraries, or databases. Normally controllers
    have many dependencies. We can write test code (functional tests), but if one
    of the dependencies changes, tests may break and fail. The objects you test at
    a time, the more fragile your tests will be.


    If controllers depend on the database, we have to prepare database fixtures, too.
    The more objects you test at a time, the more you have to prepare.


    What if you try to unit test controllers? In case, you have to mock a lot of dependencies,
    and it is not so easy.


    Do you remember Our First Test in Chapter 4, which was very easy to write? That
    is because the class under test had no dependencies at all. In other words, the
    more dependencies your class has, the more difficult your tests will be to write
    and maintain.


    # ##7.2 Test Case for the News Controller


    We did not write tests for the News Controller in Chapter 5. We have a goal to
    get 100% code coverage, so we will write tests here. The controller depends on
    the database, so we need to prepare database fixtures.


    # ## Exercise


    At this point, please stop and write the test case for the News controller.'
