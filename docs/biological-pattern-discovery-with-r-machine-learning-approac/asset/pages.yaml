  md: '# Chapter 7


    # Whole Genome Pattern Discovery


    Either a DNA sequence or a protein sequence is the basic component for most genomics
    research. It is well understood that a sequence is the main carrier of genetic
    information for any species. It is also no doubt that genomics research can hardly
    be successful without looking into sequence constituents. Importantly, most novel
    and significant discoveries in biology or medicine are based on sequencing data
    analysis nowadays. This chapter will introduce the commonly used sequence analysis
    approaches from the basic ones to the advanced ones and mainly focus on the sequence
    comparison approaches for whole genome pattern discovery. Moreover, this chapter
    will show how the sequence comparison approaches can be used to analyse the SARS-CoV-2
    pandemic data.


    # 7.1 The SARS-CoV-2 pandemic


    The COVID-19 (Coronavirus Disease 2019) pandemic caused by SARS-CoV-2 (severe
    acute respiratory syndrome coronavirus 2) is still in a huge challenging situation
    worldwide it firstly emerged in Wuhan, China in December 2019 [Zhou, et al., 2020].
    Till the 30th March 2021, there have been more than 128.6 million infections and
    more than 2.8 million deaths worldwide reported at worldmeter webpage. Until the
    4th January, GISAID has collected 315,253 SARS-CoV-2 DNA genome sequences from
    almost all countries in the world. Based on these huge volumes of genomic data,
    there are many questions which are waiting for answers'
  merge: -1
