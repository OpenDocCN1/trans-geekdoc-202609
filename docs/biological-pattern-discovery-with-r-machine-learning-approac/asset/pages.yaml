  md: '# Gene Expression Pattern Discovery 297


    For each of 9,230 bimodal genes identified by the bimodal index test, a variance
    test was applied to two populations. 2,495 bimodal genes had variance test p values
    less than 0.01. When the variance test p value is less than 0.01, it means that
    the null hypothesis of identical variance between two clusters of expressions
    of a bimodal gene is rejected. In total, 27% predicted bimodal genes had significantly
    heterogeneous variances across two clusters of expressions. However, this will
    not happen when using the gap maximisation test approach. The gap maximisation
    test does not need a data distribution assumption.


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_311_0.png)


    Fig. 6.39. The distribution of the variance test p values for the identified bimodal
    genes using the Bimodal Index test for the letrozole drug.


    The other problem of the bimodal index test is the uncertainty. This is because
    it involves a clustering process employing the mixture model algorithm, which
    can lead to different clustering results in different runs. The test was applied
    to the breast cancer letrozole drug treatment data ten times. Ten sets of predictions
