    # 6.1.2 The statistical significance


    To examine whether a variable such as a gene displays statistically significant
    differential expressions across two experimental conditions, the $t$ test is a
    traditional approach [Bland, 1995]. A null hypothesis is proposed before running
    a $t$ test,


    > $\mathcal{H}_0: \mu_A = \mu_B$ (6.3)


    The $t$ test will be used to test this hypothesis using the following statistic,
    namely the $t$ statistic [Bland, 1995], where $\hat{U}_A$ and $\hat{U}_B$ are
    the estimated mean expressions of two experimental conditions, $\sigma(x_A, x_B)$
    is the pooled standard deviation of two experimental conditions,


    > $t = \frac{\hat{U}_A - \hat{U}_B}{\sigma(x_A, x_B)}$ (6.4)


    A $p$ value will be derived from a $t$ statistic and is used for the statistical
    significance analysis. It will provide a statistical evidence for accepting or
    rejecting the null hypothesis. Figure 6.2 shows two genes in the letrozle drug
    data [Miller, 2007; Miller, et al., 2010]. The expressions of the gene NEK2 show
    a significant different distribution between two conditions and hence its $t$
    test $p$ value is $2.282e-11$. Therefore, the null hypothesis is rejected and
    this gene is certainly a DEG in terms of statistical significance. However, the
    expressions of the gene SLC25A30 in two conditions were heavily overlapped leading
    to a large $t$ test $p$ value, which is almost one. Therefore the null hypothesis
    cannot be rejected and this gene is certainly not a DEG.'
