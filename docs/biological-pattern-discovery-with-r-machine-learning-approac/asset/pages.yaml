    # 7.2 Sequence alignment


    Either DNA or RNA protein sequence analysis is one important area in modern biology.
    There are several separate subjects in the area of sequence analysis. Two subjects
    are the fundamental stones for the modern biology. They are the sequence homology
    alignment problem [Lipman, et al., 1989; Thompson Plewniak, 1999; Nguyen, et al.,
    216] and the sequence assembly problem [Mysers, et al., 2000]. Two or more than
    two sequences to discover how sequences are similar to each other so that the
    annotation of a novel sequence can be made. The latter results from the modern
    sequencing technology, where a sequencing equipment will generate short sequencing
    segments which are called sequencing reads for a genome. It is required to assemble
    these sequencing reads to generate longer sequencing segments before being aligned
    or mapped to a reference genome for further study.


    The sequence homology alignment is used to determine how similar two sequences
    are. This approach has at least three benefits. First, species evolutionary history
    can be revealed through an alignment of the collected sequences for a species
    or an organism [Voronova and Chelomina, 2020]. This can also be extended to cross-species
    and cross-organisms studies [Burow, et al, 2020]. Second, the sequence homology
    alignment approach can help reveal some conserved segments which correspond to
    some important genes in relation with biological properties of a species or an
    organism, or in relation with some diseases [Caldovic, et al., 2014]. Third, the
    sequence homology alignment approach can be used to reveal genetic traits [Yu,
    et al., 2019].


    Determining how similar two sequences are to determine the best position for each
    character of each sequence and to quantitatively score the similarity between
    two sequences. Suppose there are two sequences, x=CCGAATG and y=CCAATT. One alignment
    between these two sequences is shown below,'
  merge: -1
  img_proc: true
