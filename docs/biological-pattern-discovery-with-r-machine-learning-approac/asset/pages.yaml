    # 4.9 Epigenetic-genetic interplay pattern discovery


    The data were downloaded from GEO. GSE36001[Kresse, et al., 2012], GSE53261 [Wagner,
    et al., 2014] and GSE68909. GSE36001 contains human osteosarcoma cell lines. The
    study were 48,701 genes and 27,578 methylation sites. The study identified differentially
    expressed genes and differentially methylated CpG sites. In this chapter, only
    genes with in-body methylation sites and genes with the genomic base-pair location
    information were used for the demonstration of the genetic-epigenetic interplay
    pattern discovery. This led to 23,215 genes and methylation sites for the analysis.
    The data were composed of 19 osteosarcoma cell lines and 6 normal cell lines.
    Because samples were paired, the cross-replicate method was used to calculate
    differential expressions for each gene and to calculate differential methylations
    for each methylation site. For instance, the 19 osteosarcoma cell lines were compared
    with each of 6 normal cell lines to calculate 19 differential expression or methylation
    for one gene or one methylation site. Finally a differential expression matrix
    of 114 columns and a differential methylation matrix of 114 columns were generated
    for identifying the differentially expressed genes and the differentially methylated
    sites.


