    ```

    $\pi(x_m, r_m) \quad (8.11)$

    ```


    Suppose a number of residues between a peptide and a rule were involved in decision-making.
    The min-max function was developed for this kind of analysis [Yang, et al., 2003].
    The min function was defined as below, where x was a peptide and r was a GP rule,


    ```

    $\psi^+(\mathbf{x, r}) = \min\{\pi(x_m, r_m)\} \quad (8.12)$

    ```


    To express the min function, a RPN chromosome was expressed as below, where $r_m$
    was the $m^{th}$ residue of the GP rule and $c_m$ was the amino acid used by $r_m$.


    ```

    $\psi^+(\mathbf{x, r}) = \prod \{(r_m c_m)\} + \quad (8.13)$

    ```


