    # 7.2.1.2 The alignment gap


    The second issue of sequence homology alignment alignment is the alignment gap.
    An alignment algorithm has to satisfy the following requirements. Aligning two
    sequences without inserted a gap may not work properly, especially when an indel
    event has happened. This is because two sequences definitely have different lengths
    when an indel event has happened. For instance, the evolution of the ancestor
    sequence LGPSSKQT to the descendant sequence LGPSQT has resulted in sequences
    with different lengths. Without introducing gaps, aligning these two sequences
    will not generate a meaningful alignment. Of course, aligning two sequences with
    too many gaps is also unacceptable. Therefore, an alignment should maximise the
    number of the aligned pairs and minimise the number of the inserted gaps. A gap
    penalty, which can quantify the impact of gap insertion on an alignment performance,
    which therefore been introduced for this purpose in almost every alignment algorithm.


