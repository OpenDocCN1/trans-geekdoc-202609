  md: '# Responsive Gene Discovery


    For the latter, data points are merged into a tree-like structure gradually. Such
    a tree displays the hierarchical relationships between data points. Each data
    point has a clear pattern to join the tree at different stages with different
    data points. Therefore the relationship between data points can be easily investigated.
    The hierarchical clustering algorithm is such an algorithm.


    # 2.3.1 The hierarchical cluster analysis algorithm


    The hierarchical cluster analysis algorithm merges data points gradually into
    a hanging tree [Jardine and Sibson, 1971]. Afterwards, such a tree is cut to generate
    subtrees if it is required. Each of the cut subtrees is treated as a cluster.
    The most attractive feature of the hierarchical cluster analysis algorithm is
    that the pairwise relationships between data points can be clearly generalised
    in a hierarchical structure.


    The hierarchical cluster analysis algorithm has been used to classify red wines
    of two varieties using phenolic compounds analysis and discovered major clusters
    of red wines [Stoj, et al., 2020]. In a colon cancer study, it has been used to
    evaluate different approaches and revealed that Raman spectroscopy shows the best
    performance for colon cancer diagnosis [Depciuch, et al., 2020]. The hierarchical
    cluster analysis has also been used to discover extremely small volume of interesting
    molecules and to separate molecules based on bacteriophage-based colorimetric
    sensor array technology [Kim, et al., 2020]. In blood monocyte subtype research
    which aims to discover biomarkers for cardiovascular inflammation, the knowledge
    of human monocyte heterogeneity is imperfect. Therefore, a study has employed
    the hierarchical cluster analysis algorithm to discover circulating monocyte subtypes
    based on expression data provided by high-throughput flow cytometry arrays [Hoffmann,
    et al., 2020]. The study has discovered 242 specific markers and revealed some
    new markers which can define classical, intermediate and non-classical subtypes.


    Given a data set $\mathcal{D}$, the algorithm finds a pair of data points $(\mathbf{x}_n
    \in \mathcal{D}$ and $\mathbf{x}_m \in \mathcal{D})$ with the least distance or
    the maximum correlation coefficient at one cycle of a clustering process and thus
    merge them.'
  merge: -1
  img_proc: true
