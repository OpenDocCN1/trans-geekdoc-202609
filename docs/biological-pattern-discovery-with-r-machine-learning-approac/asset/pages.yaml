    # 5.5 The adaptive iterative reweighted penalised least square smoother


    The adaptive iterative reweighted penalised least square algorithm

    (airPLS) employs another smoothing mechanism [Zeng, et al., 2010;

    Zhang, et al., 2020]. First, a spectrum is denoted by s and a baseline is

    doted by b. A penalised LSE function is defined as below,


    $O = (\mathbf{s}-\mathbf{b})^T(\mathbf{s}-\mathbf{b}) + \lambda(\mathbf{D}z)^T(\mathbf{D}z)$
    (5.8)


    where $\mathbf{D}$ is the second-order difference operator and $\lambda$ is the
    regularisation

