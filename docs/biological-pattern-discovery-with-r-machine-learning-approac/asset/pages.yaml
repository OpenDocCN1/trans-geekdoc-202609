    been classified as showing significant differential expressions across two conditions.
    This kind of error is named as a Type I error. A Type II error, on the other hand,
    refers to a falsely accepted null hypothesis. In the context of gene differential
    expression analysis, a Type I error refers to a wrongly predicted DEG and a Type
    II error stands for a wrongly predicted non-DEG, i.e., a missing DEG [Li, *et
    al.*, 2013; Mudge, *et al.*, 2017; Gonzalez, *et al.*, 2020].


    The Type I and II errors occur often in an experiment especially when the sample
    size of a data is small. This is because it is often to prepare a few replicates
    to cut the expenses in many biological experiments. A severe outcome for a data
    set with insufficient replicate is an unreliable population variance in addition
    to an unreliable population


    In the letrozole drug data which employs 58 baseline replicates and 58 letrozole
