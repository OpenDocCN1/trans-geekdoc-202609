    # 6.6.1.2 DSG for simulated data DEG discovery


    A simulated data set of 900 non-DEGs and 100 DEGs was designed [Al watban, 2015].
    Only one replicate was used. The design was composed of three segments. All non-DEGs
    were designed to follow a Gaussian distribution centred at zero with a unit deviation.
    In total, 50 down-regulated DEGs were designed to follow a Gaussian distribution
    centred at negative with a standard deviation. In addition, 50 up-regulated DEGs
    were designed to follow a Gaussian distribution centred at five with a standard
    deviation. Figure 6.49(a) shows the estimated density for this simulated data.
    It can be seen that the alternative density has a very wide distribution compared
    with the null density. Figure 6.49(b) shows the ROC curve for this DSG model.
    The AUC value was 0.996.


    The next thing to be investigated was whether the alternative standard deviation
    caused a difference in DEG discovery using DSG. Rather than fixing at two, the
    standard deviation for both down-regulated DEGs and up-regulated DEGs was varied
    from one to five. Therefore, the overlap between the null density of DEGs and
    the alternative density of non-DEGs was varied in this. For each standard deviation,
    50 DSG models were constructed and the Jackknife test was used to evaluate these
    50 models. The mean AUC was calculated for the evaluation. Thus, how model performance
    (AUC) varied with the overlap between the non-DEG distribution (the null density)
    and the DEG distribution (the alternative density) was examined. Figure 6.50 shows
    the result. It can be seen that the model performance (AUC) of DSG deteriorated
    slightly when the overlap between the null density and the alternative density
    was increased. This is not a surprise at all.'
