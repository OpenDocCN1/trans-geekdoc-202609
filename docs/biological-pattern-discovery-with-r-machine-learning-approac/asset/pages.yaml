    # 6.2.3 The visualisation of the discovered DEGs using the volcano plot


    As aforementioned, the biological significance measurement can indicate whether
    a gene is up- or down-regulated while the statistical significance measurement
    can assess the significance of the differential expression between two conditions.
    Combining both, therefore, can lead to meaningful conclusion for a gene expression
    pattern discovery project.


    The popularly used approach to visualise the discovered DEGs for both biological
    significance and statistical significance is the volcano plot [Cui and Churchill,
    2003]. It has been widely used in gene expression pattern'
  merge: -1
  img_proc: true
