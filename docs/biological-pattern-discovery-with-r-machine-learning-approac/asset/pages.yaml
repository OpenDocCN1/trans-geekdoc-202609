    The expressions in this vector were sorted in an ascending order and expressed
    as below,


    ```

    $$x''_n = (x_{n,1}, x_{n,2}, \dots, x''_{n,K})$$ (6.39)

    ```


    A delta expression was calculated by the difference between all consecutive pairs
    of sorted expressions,


    ```

    $$\delta_n = (x_{n,2} - x_{n,1}, x_{n,3} - x_{n,2}, \dots, x_{n,K} - x_{n,(K-1)})$$
    (6.40)

    ```


    Figure 6.32 shows that the Gamma density modelling worked very well for fitting
