- pgno: 174
  md: '# Chapter 4


    # Genetic-Epigenetic Interplay Discovery


    A biological system is very complex, in which different components interplay all
    the time. The interactions include gene-gene interaction, gene-metabolite interaction,
    pathway interaction and genetic-epigenetic interaction. It has been found in several
    studies that the genetic-epigenetic interplay may contribute to the development
    of diseases. How the genetic-epigenetic interplay contributes to the disease development
    thus requires descent research about how genetic signatures and epigenetic signatures
    interplay. To determine how thousands of epigenetic signatures are associated
    with a genetic signature and to determine how thousands of genetic signatures
    are associated with an epigenetic signature is a regression problem. Importantly,
    the genetic-epigenetic interplay may happen between local or remote contributing
    components. Therefore, it is desirable to discover and focus on the most important
    signatures among thousands of signatures instead of every contributing signature.
    In this way, whether the interplay happens locally or remotely can be discovered.
    Therefore, a regression analysis algorithm with well-equipped variable ranking
    mechanism is desirable. Only in such models, the quantitative evidence of local
    interplay or remote interplay between genetic signatures and epigenetic signatures
    can be well-researched. This chapter will introduce several regression algorithms
    which can rank variables for genetic-epigenetic interplay pattern discovery.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Genetic-Epigenetic Interplay Discovery


    # 4.1 A biological question — the genetic-epigenetic interplay pattern discovery
    problem


    The DNA methylation is a common process which covalently modifies DNA bases and
    adds a methyl group to the cytosine or adenine DNA bases. It has been widely studied
    in many species including bacteria, plants, and mammalian cells [Capuano, et al.,
    2014]. Though methylation can occur at both CpG and non-CpG islands, most studies
    have focused on the methylations at CpG islands in the promoter regions and the
    gene bodies [Jones and Liang, 2009; de Carvalho, et al., 2010; Lou, et al., 2014].
    The fact that methylation modification can be inherited across generations has
    investigated influences into various cellular functions and disease development
    [Law and Jacobson, 2010; Boyko, et al., 2011; Iqbal, et al., 2011; Cedar and Bergman,
    2012; Wagner, et al., 2014; Meng, et al., 2015].


    The non-reversible property of methylation has led to the studies of how methylation
    influences disease development [Jones and Liang, 2009; Iqbal, et al., 2011; Chambaz
    and Neuvial, 2016]. The methylation strength is measured by the beta value which
    is defined as the ratio of methyl signal over total methylation and non-methylated
    signals [Chari, et al., 2010]. The methylation strength is classified as the hypo-
    or hyper-methylation representing less or more methylation depending on the magnitude
    and the sign of differential methylation ratio for comparing an experiment sample
    against a control sample [Ehrlich, 2002; Chari, et al., 2010]. The hypo-methylation
    has been found in relationships with tumour genesis [Ehrlich, 2002], gene expression
    profiling [O''Neil, et al., 1998; Walsh, et al., 1998; Morgan, et al., 1999; Tao,
    et al., 2000]. The hyper-methylation can also affect gene expression profiling,
    leading to some diseases [Network, 2011; Fujiwara-Igarashi, et al., 2014; Bryan,
    et al., 2009].


    The combined or integrative study of the epigenetic and the genetic signatures
    can be used to discover more biological insight than using a gene expression data
    set alone. For instance, several studies have found that the interplay between
    the epigenetic and the genetic signatures is one of the most important mechanisms
    leading to cancer development and cellular functions [Chang, et al., 2003; Chari,
    et al., 2010; Baylin and Jones, 2011; Sandoval and Esteller, 2012; You and Jones,
    2012].'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'There are currently two types of integrative studies for the interplay between
    the epigenetic signatures and the genetic signatures. The first type analyzes
    the epigenetic signatures and the genetic signatures separately followed by a
    consistency validation about how the discovered differentially expressed genes
    and the discovered differentially methylated sites are correlated in the relationship
    with a disease. For instance, this approach was used to discover aberrant genes
    in association with breast cancer [Chari, et al., 2010]. The cluster analysis
    algorithms have also been used to examine whether the epigenetic signatures and
    the genetic signatures show similar abundance pattern in relation with diseases
    [Kresse, et al., 2012].


    The second type of approach models the epigenetic-genetic interplay directly.
    For instance, the correlation analysis was used to examine how the DNA copy number
    and the methylation ratio interact with the gene expression based on the deep
    sequencing transcript expression for a breast cancer [Sun, et al., 2011]. When
    studying the sperm motility, a mixture model has been constructed based on the
    pooled methylation data and the gene expression data [Pacheco, et al., 2011].
    The correlation between the methylation and sperm motility was examined using
    regression models, where the positive regression coefficient was mapped to a hyper-methylated
    site and the negative one hyper-methylated [Sms, 2004]. In one study, 62 primary
    fibroblast samples were used to analyse how the epigenetic signatures influence
    the genetic signatures for the species, where the gene expressions were regressed
    on the neighbouring methylation sites [Wagner, et al., 2014]. Another study also
    employed only local and few epigenetic signatures to examine their contributions
    to the regulation of genes [Ping, et al., 2015].


    # 4.2 Regression analysis


    The method of regression analysis has been researched since the 19th century [Galton,
    1986] and has been continuously researched till today [Duda, et al., 2000; Bishop,
    2006; Chatterjee and Hadi, 2015; Montgomery, et al., 2021]. Regression analysis
    can be the best candidate to analyse how two sets of experiments interact and
    correlate. The main objective of regression analysis is to establish a quantitative
    model to'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Genetic-Epigenetic Interplay Discovery


    discover and quantify how variables interact and thus to study the degrees of
    the dependency between variables. Having understood that almost all experimental
    data is very likely contaminated by noise, the basic principle used in almost
    all regression analysis algorithms is what is called regressing random to unknown
    truth, i.e., the mean of the observations. All regression analysis approaches
    therefore have the same principle,"regress to mean”. In a simple experiment it
    is assumed that most observations are composed of a variation due to sample preparation
    error, technique error and data collection error. The error is assumed to be random
    and mostly follow a Gaussian distribution. Regressing these noises will finally
    lead the answer to the mean of these observations.


    If the errors of a collected data set are assumed to follow a Gaussian distribution,
    the mean of these observations is the true value. The likelihood of the Gaussian
    errors of N observed data is defined as below, where $x_n$ is the $n^{th}$ data
    point, $\sigma^2$ stands for the variance of the data, $\mu$ is the unknown truth,
    i.e., the,


    ```

    $$\mathcal{L} = (2\pi)^{-N/2} \prod_{n=1}^{N} \exp\left(\frac{(x_n-\mu)^2}{2\sigma^2}\right)
    \quad (4.1)$

    ```


    Applying the negative logarithm to this likelihood function leads to the following
    equation,


    ```

    $-\log\mathcal{L} = \sum_{n=1}^{N}(x_n-\mu)^2 + C \quad (4.2)$

    ```


    Its derivative is shown below,


    ```

    $$\frac{\partial(-log\mathcal{L})}{\partial\mu} = \sum_{n=1}^{N}x_n - N\mu \quad
    (4.3)$

    ```


    Zeroing this derivative leads to the estimated mean as shown below,


    ```

    $$\hat{\mu} = \frac{1}{N}\sum_{n=1}^{N}x_n \quad (4.4)$

    ```'
  merge: -1
  img_proc: true
