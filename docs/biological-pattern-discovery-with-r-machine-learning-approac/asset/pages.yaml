    # 3.6.1.2 The learning mechanism of MLP


    To estimate the parameters of a MLP model, a simple way is to establish an error
    function, such as


    ```

    $$\varepsilon = \frac{1}{N} \sum_{n=1}^{N} (\hat{y}_n - y_n)^2 \quad (3.33)$

    ```


    Denoting all model parameters using a vector **$\mathbf{w}$** and a data point
    as **$\mathbf{x}_n$**, the estimation of **$\mathbf{w}$** is an optimisation process


    ```

    $$\hat{\mathbf{w}} = \min_{\arg} \left( \frac{1}{N} \sum_{n=1}^{N} f(\mathbf{x}_n,
    \hat{\mathbf{w}}) - y_n)^2 \right) \} \quad (3.34)$

    ```


    Because $f(\mathbf{x}_n, \hat{\mathbf{w}})$ is a nonlinear function, there will
    not be an analytic format of the estimated model parameters such as the used in
    linear models. Therefore, an algorithm called the back propagation algorithm has
    been developed to estimate parameters for a MLP model [Rumelhart, et al., 1986].
    The back propagation algorithm is a variant of the Newton''s method [Fletcher,
    1987]. It is based on the derivative function of an error function, which is defined
    in an equation shown below, where $0 < \eta < 1$ is called the learning rate,


    ```

    $$\Delta\mathbf{w} = -\eta \frac{\nabla\varepsilon}{\nabla\mathbf{w}} \quad (3.35)$

    ```


    The use of the above equation means that the change (update) of every new model
    parameter is negatively proportional to the derivative function of the error function,
    $\mathbf{w}^{t+1} = \mathbf{w}^t - \eta\nabla\varepsilon/\nabla\mathbf{w}$. A
    great derivative points to a steep or sharp curve of the error function. Therefore,
    a cautious update of the model parameters is required. This cautious move can
    avoid missing the optimal point (jumping over the saddle point). A small derivative
    function corresponds to a more curved curve of the error function. Therefore,
    a greedy or greater update can happen to the model parameters.


    However, this simple update may cause oscillation, i.e. the over-update will jump
    over the saddle point of the error function curve forward and'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'backward, and on and on. This is shown in Figure 3.23, where the move is from
    $x_0$ to $x_1$, and from $x_2$ to $x_1$, and from $x_1$ to $x_2$, and on on.


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_132_0.png)


    In order to improve the learning quality of a MLP model, the above simple update
    rule has been altered by introducing the momentum term [Rumelhardt, et al., 1986],
    which is based on the update of the model parameters in the previous learning
    cycle. The momentum term can efficiently prevent over-update of model parameters.
    The use of the momentum term is shown below, where $0 < \alpha < 1$ is called
    the momentum factor.


    $\Delta\mathbf{w}^{t+1} = -\eta\frac{\nabla\mathcal{E}^t}{\nabla\mathbf{w}^t}
    + \alpha\Delta\mathbf{w}^t$ (3.36)


    In the above equation, $\Delta\mathbf{w}^t$ stands for the update of $\mathbf{w}$
    at the learning cycle $t$ and $\Delta\mathbf{w}^{t+1}$ stands for the update of
    $\mathbfmathbf{w}$ in the learning cycle $t+1$. It can be seen that the update
    term $\eta\nabla\mathcal{E}^t/\nabla\mathbf{w}^t$ and the momentum term $\alpha\Delta\mathbf{w}^t$
    have different signs, different directions. Whenever the term $\eta\nabla\mathcal{E}^t/\nabla\mathbf{w}^t$
    goes too far, the term $\alpha\Delta\mathbf{w}^t$ will pull the move backward
    slightly. Therefore the momentum term can reduce the oscillation possibility and
    prevent the potential move from a wrong direction so as to miss the saddle point
    on the error function curve. As shown in Figure 3.23, it is the move from $x_0$
    to $x_3$, which will make the move to the saddle point fast. The other advanced
    approach for improving the learning capability is the use of the second order
    derivative, such as the Hessian matrix [Bishop, 1996].'
  merge: -1
  img_proc: true
