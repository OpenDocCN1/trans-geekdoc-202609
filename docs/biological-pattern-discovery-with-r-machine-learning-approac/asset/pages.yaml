- pgno: 80
  md: '# Biological Pattern Discovery with R


    by a transposon and a species still survives, the function of the gene is thus
    the target of research.


    A transposon sequencing data set has two types of transposon statistics. They
    are the insertion statistic and the site statistic. The former stands for the
    number of transposon insertions per gene and the latter stands for the number
    of transposon insertion sites per gene. These two types of statistics represent
    two types of transposon events in a genome. The insertion statistic represents
    the total number of transposon insertions a gene has. This value depends on the
    sequencing coverage. The greater the sequencing coverage, the greater the insertions
    per gene. The site statistic represents the strength of the transposon distribution
    across a gene. This statistic depends on two factors, i.e. the sequencing coverage
    and the gene essentiality.


    Table 2.12 shows a few lines of one replicate of the transposon sequencing data
    of the Francisella tularensis species [Yang, et al., 2017]. Note that these statistics
    are all gene-wise summary statistics. This means that the insertions per gene
    and the sites per gene have been summarised from genome-wise data.


    Table 2.12. The few lines of the first replicate of the Francisella Tularensis
    species. ''counts'' stands for ''sites'' stands for the site statistic. ''MF''
    stands for the mutation feature statistic, which is a convolution between ''counts''
    and ''sites''.


    | ID#symbol | counts | sites | MF |

