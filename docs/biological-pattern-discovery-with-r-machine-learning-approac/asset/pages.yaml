  md: '0.01, It resulted in 1,250 DEGs. The limma package will be introduced in Chapter
    6. The differentially methylated sites (DMSs) were also identified using the limma
    package with a critical fold change value 0.5 and a critical p value 0.01. This
    led to 910 DMSs to be used. The reason of using these critical values was for
    generating roughly balanced DEGs and DMSs for the affordable analysis in a normal
    computer.


    Afterwards, two objectives were investigated for this set. The first was to investigate
    how the differential expressions of each DEG were contributed or determined by
    the differential methylations of 910 DMSs. This was called the methylation-to-expression
    pattern discovery. This set of models were called the M2E models. A regression
    model was constructed between one DEG and 910 DMSs which were used as the regressors.
    For the quantitative relationship between DEGs and DMSs have been modelled using
    the regression analysis methods, the most important DMS contributor of each DEG
    was identified and analysed. Moreover, whether the differential methylation of
    the local methylation sites or the remote methylation sites were the top contributor
    to the differential expression pattern of a gene was examined.


    The second aimed to discover the expression-to-methylation pattern. This set of
    models were named E2M models. For each DMS, a regression model was constructed
    between its differential methylations and the differential expressions of 1,250
    DEGs. Through this regression model, the quantitative relationship between the
    differential methylations and the differential expressions were used to identify
    the most influencing DEG for a DMS. Similarly, whether the differential expression
    of the local gene or the remote gene was the major contributor to the differential
    methylation of a methylation site was examined.


    The main aim of the study was not the simple ranking of the independent variables
    or regressors in both M2E and E2M models. Instead, the top-ranked regressor of
    each regression model, which was either a DMS or a DEG, was discovered and analysed
    in terms of their genomic relationship with their target variable, which was either
    a DEG or a DMS. The process of these models was to examine whether a local regressor
    or a remote regressor is the main contributor of a target variable. Therefore,
    this process was also referred to as an impact analysis.'
