    # 3.6.3 The bio-basis function neural network algorithm


    Most machine learning algorithms except the decision tree algorithms are used
    to model numerical data. Therefore, how to deal with nonnumerical variables as
    the amino acids of a sequence data requires requires careful experimental design.


    One popularly used approach is the binary encoding of the amino acids or the nucleic
    acids in peptides [Wu, et al., 1995; Kawabata and Doi, 1997; White and Seffens,
    1998]. With this approach, each nucleic acid is encoded by a four-bit binary vector
    and each amino acid is encoded by a 20-bit binary vector. For instance, the amino
    acid alanine (A) is expressed by 000000000 000000001 and the amino acid cysteine
    (C) is'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Protease Cleavage Pattern Discovery


    expressed by 00000000 000000010. This encoding method is simple and straightforward.
    However, it is not biologically sound because the mutation rate between the nucleic
    acids or between the amino acids in peptides may not be a constant.


    Based on the principle of the kernel method, the principle of using a mutation
    matrix to quantify how similar two sequences are, which is used in sequence homology
    alignment can be considered to measure the similarity between peptides as well
    [Holm and Sander, 1996]. For instance, to align two protein sequences, an amino
    acid mutation matrix such as the Dayhoff matrix [Dayhoff and Schwartz, 1978] has
    been considered [Lipman, et al., 1989]. This idea has led to the development of
    the algorithms which employ a mutation matrix for protease cleavage pattern discovery.


    A mutation is normally derived based on a large number of protein sequences. A
    substitution in a mutation matrix actually represents the mutation rate between
    two amino acids. A mutation matrix is commonly derived through investigating thousands
    of sequences within a biological family. This means that a mutation matrix is
    perhaps more biologically sound and robust to measure the similarity between peptides.


    Here are three factor X protease cleaved peptides, $x_1$=IEGRT, $x_2$=IEGRI and
    $x_3$=IEGR. When using the binary encoding approach, a binary vector for each
    amino acid in a peptide has only one entry as one, leaving other entries as zeros.
    Therefore, the pairwise distance between a pair of peptides actually depends on
    the difference of residues in these peptides. The pairwise distance between these
    sub-sequences is always one because one residue is occupied by different amino
    acids. However, the pairwise homology score (similarity) between these sub-sequences
    will not be a constant. Table 3.10 shows a partial Dayhoff amino acid mutation
    matrix. Suppose this mutation matrix is used to measure the pairwise-similarity
    between these three-sequences. The partial similarity between $x_1$ and $x_2$
    for the fifth residue (between the amino acid T and I) is -2. The partial similarity
    between $x_1$ and $x_3$ is -4. The partial similarity between $x_2$ and $x_3$
    for the fifth residue (between the amino acid T and the amino acid D) is -6. It
    can be seen that they are not constants at all. This shows a very important concept
    that the binary encoding approach may not be able to reflect the true biological
    relationship between peptides.'
