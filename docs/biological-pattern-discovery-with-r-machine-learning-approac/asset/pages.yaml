    # 7.4.1 The k-mers approach


    Comparing sequences using homology alignment approaches, either global or local,
    is very costly as aforementioned. The alignment-free sequence comparison approach
    is therefore of great interest. Most alignment-free sequence comparison approach
    explore the pattern of the sequence statistics for sequence comparison and are
    still widely used in many applications [Lichtblau, 2019, Randhawa, et al., 2020;
    Rohling, et al., 2020].


    One of the basic principles of the alignment-free sequence comparison approach
    is to use the pattern of the sequence statistics to represent sequences [Le and
    Huynh, 2019; Nguyen, et al., 2019; Guo, et al., 2020]. This process is called
    a feature extraction process. Suppose the $n^{th}$ sequence is denoted by $\mathbf{s}_n$.
    The mapping between $\mathbf{s}_n$ and a feature vector $\mathbf{x}_n$ is formulated
    by the following equation, where $\mathcal{C}$ is a set of the nucleic acids or
    a set of amino acids, $\ell_n$ stands for the length of the $n^{th}$ sequence
    and $d$ stands for the feature space dimension,'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Biological Pattern Discovery with R


    $$\mathbf{s}_n \in \mathcal{C}^{\ell_n} \Rightarrow \mathbf{x}_n \in \mathcal{R}^d$
    \quad\quad\quad\quad\quad\quad(7.14)$


    Suppose all sequences S have been mapped to a feature space X. A machine learning
    model can be constructed based on the feature space as shown below, where $\Omega_k$
    is a subspace to be generated using a cluster analysis model or a classification
    analysis model $f(X)$,


    $f(X) \Rightarrow U\Omega_k$ \quad\quad\quad\quad\quad\quad\quad(7.15)$


    It is understood that different species will represent different sequence statistics
    in their genomes. A nucleotide sequence or a protein sequence is therefore assumed
    to be a string of genetic recombination of the nucleic acids or the amino acids.
    Therefore they will form different distributions of sequence statistics. In natural
    language processing, a library of basic words constitutes the basis for the classification
    of articles or books. A nucleotide sequence or a protein sequence of base can
    be treated as an article or a book. It should contain some basic sequence statistics
    pattern about how short-sequences of the nucleic acids or the amino acids are
    distributed within a genome or a whole sequence. Therefore, extracting the sequence
    statistics to generate the frequency or library of sub-sequences from a sequence
    can be used to compare or classify sequences, hence species.


    The sequence statistics mainly represent the distribution of words, which are
    consecutive sub-strings within a sequence string. These substrings or words are
    called k-mers in the application to sequence comparison. For instance, any nucleotide
    sequence is a chain or a string of four nucleic acids, $\mathbf{s}_n \in (A, C,
    G, T)^n$. In case when $k=1$ using the k-mers approach to represent sequence spaces,
    $\mathbf{x}_n \in \mathcal{R}^4$. There are 16-mer words such as AA, AC, AG, AT,
    CA, etc. Therefore, $\mathbf{s}_n \Rightarrow \mathbf{x}_n \in \mathcal{R}^{16}$
    if 2-mers are used to represent represent nucleotide sequences. There are 64-mer
    words such as AAA, AAC, etc in a nucleotide sequence. Therefore, $\mathbf{s}_n
    \in \mathcal{R}^{64}$ if 3-mers are used to represent represent nucleotide sequences.


    The collection of all words for a specific size $k$ is called a word set. Counting
    the times each word occurs in a sequence thus builds up a sequence statistics
    library or the word library. Similar sequences are assumed to have similar sequence
    statistics patterns.'
