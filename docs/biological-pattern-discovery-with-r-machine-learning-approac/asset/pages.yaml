    # Summary


    This chapter has introduced how the genetic programming approach can be used to
    provide another way to discover intelligent rules for the peptide pattern discovery.
    The most striking features of the genetic programming approach are its great interpretation
    capability as well as the possibility of discovering the optimal rules without
    exhausting all possible candidates. This chapter has introduced the min-max function,
    which is especially useful for dealing with the protease cleavage pattern discovery.
    In addition, the reverse Polish notation has been used to express the chromosomes
    of rules for mimicking an evolution process for the optimal solutions. By the
    mutation operator, the dual-chromosome operator and the single-chromosome crossover
    are designed and used for breeding new RPN chromosomes of rules have been introduced
    and demonstrated in this chapter as well. In order to avoid the possibility of
    a homogeneous population and increase the diversity among candidates in a GP pool,
    the process called the revolution has been introduced. This chapter has applied
    the genetic programming approach with the min-max function to the factor Xa protease
    cleavage data analysis. The resulting decision-making rule shows a good discrimination
    power and has a good interpretation capability.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# Chapter 9


    # Advanced Subjects


    Biological/medical systems are highly complex. It is still a challenge to improve
    the accuracy, robustness and interpretation capability of approaches or models
    for biological pattern discovery. The previous chapters in this book have only
    covered a very small proportion of biological pattern discovery subjects. Even
    for these subjects, there have been ongoing advanced studies. This last chapter
    is dedicated to a brief introduction of several promising new trends in this area.


    # 9.1 Neural networks and deep learning


    In addition to the accuracy of a constructed machine learning model, a very common
    question in most biological/medical experiments is how the phenomenon change can
    be explained by the genetic components. For instance, the explanation must be
    given when a disease has been diagnosed and the answer must be sought when one
    set of genes is very active while others are found silent in an experiment with
    an applied stress.


    Before using machine learning algorithms to model biological/medical data for
    pattern discovery, the conventional statistical models, which are basically linear,
    are used, and they normally have an excellent interpretation capability. For instance,
    a linear regression model can show which explanatory variables have the most significant
    impact on the phenomenon change of a predictor variable. Moreover, a linear discriminant
    analysis model can explain how an object is labelled when such a model has been
    constructed. In addition to the interpretation'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'capability, most linear algorithms have another important and unique feature,
    the extrapolation capability in addition to the interpolation capability. A very
    promising feature that a linear model has is such that a model is possible to
    extrapolate beyond the interval of the available data on which a model has been
    constructed. The reason that a linear model has this capability is that a linear
    model can discover the trend relationship between variables.


    However, linear models have a common limitation that they may fail to model a
    complicated data set. This therefore may result in some misleading interpretations
    if the nonlinearity in data has been missed during a modelling process. The nonlinear
    modelling algorithms such as neural network learning and then later deep learning
    algorithms have drawn great attention for modelling biological/medical data for
    knowledge discovery and pattern analysis since 1980s. The greatest contribution
    is the significant improvement of the accuracy of such a model. Deep learning
    as a new promising machine learning strategy has drawn even greater attention
    for biological/medical data analysis and pattern discovery. The reason that deep
    learning is its unique property. When a machine learning model is constructed
    based on some non-numerical variables, such as the variables in the image data
    or spectra data, a conversion process from non-numerical variables to numerical
    variables has to be followed, which is called the feature extraction. A feature
    extraction process can generate hundreds or thousands of feature variables based
    on an image data. Some of them may have a high discrimination power, but some
    may not. Some of them may be highly correlated to each other, making some feature
    variables redundant, but some may not. Therefore, after feature variables have
    been extracted, a process has to be followed to filter out non-contributing feature
    variables. This is called a feature selection process. Although there have been
    many machine learning algorithms developed for both feature extraction and feature
    selection, these two processes are still non-trivial. Selecting the most representative
    feature variables is also another tedious process in addition to feature extraction
    and is prone to error. Importantly, there is no unique method for this process.
    When a research objective changes or even when there are some changes in the data,
    a new process must start again. A deep learning model can incorporate a feature'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# Advanced Subjects


    extraction/selection process into a modelling process. This can avoid the potential
    loss of the predictive power if a search of the best set of features is incomplete.
    For instance, to provide accurate discrimination between benign and malignant
    tumours, researchers have employed deep learning algorithms to construct predictive
    models based on either biomarkers or images [Coudray, et al., 2018; Munir, et
    al., 2019; Shen, et al., 2019; Campi, et al., 2020; Pathak, et al., 2021; Kumar
    and Bakariya, 2021; Lotter, et al., 2021; Masoudi, et al., 2021].


    Different deep learning algorithms have also been considered for different data
    sets and requirements. The algorithms include different learning strategies as
    static models like the convolutional neural networks and the generative adversarial
    models as well as the dynamic models like restricted Boltzmann’s machine and the
    recurrent neural networks [Munir, et al., 2019]. Based on a deep network model
    constructed on the image data, the detection accuracy for breast cancer [Shen,
    et al., 2019; Lotter, et al., 2021], lung cancer [Coudray, et al., 2018; Kumar
    and Bakariya, 2021] and prostate cancer [Masoudi, et al., 2021] as well as other
    cancers have significantly improved. Deep learning has also been used to detect
    differentially expressed genes from a single-cell RNA-sequencing data set [Cui
    and Wang, 2021], to discriminate the SARS-CoV-2 genome from other viral genomes
    [Lopez-Rin, et al., 2021].


    However, no matter how successful neural network and deep learning algorithms
    are in different areas, the advantages of the linear models have become the disadvantages
    of neural network and deep learning models [Heaven, 2019; Waldrop, 2019]. After
    a neural network model or a deep neural network has been well trained, its tolerance
    capability is still in doubt. This is not a surprise because most of these models
    are well trained in house using well-prepared data [Heaven, 2019]. Heaven’s opinion
    is that such a model is too complicated so that it pick up too many details, making
    it fragile. George Hinton, the pioneer of the theory and algorithms of neural
    networks and deep neural networks, also had a question: “what is missing?” Waldrop
    has suggested to consider the employment of separate networks rather than a single
    network which has a too complicated structure. Even so, deep learning is still
    making a huge progress in many areas including biological/medical pattern analysis.
