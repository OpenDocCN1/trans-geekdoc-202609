  md: '# Whole Genome Pattern Discovery


    # 7.2.1.1 The three evolution events


    The first issue of sequence homology alignment is that a species or an organism
    can evolve, making its primary sequence structure slightly changed. There are
    three evolution events which may happen through an evolution process. They are
    the residue substitution, which is also called the mutation, the insertion and
    the deletion of a residue or a segment within a sequence [Tseng, et al., 2006;
    Rivas, et al., 2008]. The latter two are also called the indel process. A residue
    substitution means the replacement of a residue, i.e., an existing nucleic acid
    or an amino acid has been replaced by a new nucleic acid or a new amino acid in
    evolution. For instance, the second residue of LGPSSQT has been mutated from G
    to S in an evolution leading to a new sequence LGPSSQT.


    The indel stands for two scenarios. First, residue(s) is introduced into a sequence
    through an evolution process. This is called the insertion. Second, residue(s)
    is missing through an evolution process. This is called the deletion. Suppose
    an original sequence is LGPSSQT. Its evolutionary sequence may be a new residue
    C is introduced between S and K through an evolution process. One of the alignments
    between these sequences is shown below, where a gap denoted by a hyphen is inserted
    in the ancestor sequence for it to be aligned with its descendant sequence for
