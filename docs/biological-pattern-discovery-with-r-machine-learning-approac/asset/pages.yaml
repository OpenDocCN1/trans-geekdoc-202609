    sequences is filled by one and others are filled by zeros. Shown in Table 7.6
    is an example for aligning two sequences x=CAGGCA and y=AGTCA, where the initialisation
    stage has been completed.


    Table 7.6. The initialisation of a Needleman-Wunsch algorithm for aligning CAGGCA
    and AGTCA.


    | | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|

    | | A | G | T | C | A |

    | 1 | C | 0 | 0 | 0 | 1 | 0 |

    | 2 | A | 1 | 0 | 0 | 0 | 1 |

    | 3 | G | 0 | 1 | 0 | 0 | 0 |

    | 4 | G | 0 | 1 | 0 | 0 | 0 |

    | 5 | C | 0 | 0 | 0 | 1 | 0 |

    | 6 | A | 1 | 0 | 0 | 0 | 1 |


    # 7.2.3.2 The forward propagation stage


    In the forward propagation stage, the cells of the table are filled row by row
    from the bottom to the top of a table and column from column to the left of a
    table. The score calculation of the Needleman-Wunsch algorithm is defined as


    ```

    $M_{ij} = S_{ij} + \max\{M_{i+1,j+1}, M_{i+1,j}, M_{i,j+1}\}$ (7.11)

    ```


    where $i$ and $j$ represent the $i^{th}$ row and the $j^{th}$ column, $M_{ij}$
    is the alignment score of the cell indexed by $i$ and $j, S_{ij}$ is the match
    score of the cell. This update rule indicates that a new alignment score is maximised
    between three scores calculated from three directions as well. Similar to the
    Sellers algorithm, they are the diagonal move, the vertical move and the horizontal
    move. $S_{ij} + M_{i+1,j+1}$ is the diagonal move, where $M_{i+1,j+1}$ is the
    partial alignment score of the cell one row below and one column on the right
    of the current cell. $S_{ij} + M_{i+r,j+1}$ is the'
