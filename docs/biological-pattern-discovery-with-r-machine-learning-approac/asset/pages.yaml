    #  6.6 Dual-scale Gaussian model for small replicate data DEG discovery


    Biological data often has a problem of having insufficient replicates, which causes
    the difficulty of robust DEG discovery. This section will introduce an alternative
    called the dual-scale Gaussian model (DSG) which can model a gene expression data
    set without replicate or with a few replicates (Everson, 2014; Al watban, 2015).


    #  6.6.1 The dual-scale Gaussian model


    #  6.6.1.1 The working principle of DSG


    DSG is a mixture model composed of two Gaussian components with an identical centre
    for both Gaussian components but different variances as shown in Figure 6.47 (Bertschinger,
    2001; Billings, et al., 2007; Kramer, et al., 2007). A vector $x = \{z_i\}_{i=1}^n$
    is assumed to follow a mixture of two Gaussians. One of them has a smaller variance
    which referred to as the null density $f_0$ and other a greater variance referred
    to as the alternative density $f_1$. Figure 6.47 demonstrates the working principle
    of DSG. The null density $f_0$ has a smaller variance, hence a sharp peak at the
    centre zero. The alternative density $f_1$ has a greater variance, hence a flattened
    curve extending towards two extremes. The identification of a DEG depends on the
    magnitudes of $f_0$ and $f_1$. For instance, a gene marked by the pair of the
    dots in the figure is identified as a non-DEG because of the relationship $f_0
    > f_1$. However, a gene marked by the pair of the triangles is identified as a
    DEG because of the relationship $f_0 < f_1$.'
  merge: -1
  img_proc: true
