  md: "# Gene Expression Pattern Discovery 277\n\n$\\log\\mathcal{L}(\\mathbf{z}^+|\\\
    mu, \beta) \\propto \\frac{1}{2}\\log\beta - \\frac{1}{2}\beta(\\mathbf{z}^+ -\
    \ \\mu)^2$  (6.23)\n\nThe log-prior $\beta$ is defined as follows,\n\n$\\log IG(\b\
    eta|a,b) \\propto a\\log\beta + (a+1)\\log\beta - b\beta$  (6.24)\n\nThe log-prior\
    \ of $\\mu$ is defined as follows,\n\n$\\log G(\\mu|\\mu_0, \\sigma_0^2) \\propto\
    \ \\frac{1}{2}\\log\\sigma_0^2 - \\frac{(\\mu-\\mu_0)^2}{2\\sigma_0^2}$  (6.25)\n\
    \nThe optimisation follows the procedure of maximising a posteriori [Bishop, 2006].\
    \ The process is implemented in two steps, i.e., the expectation step and the\
    \ maximisation step. In the expectation step, the posterior is calculated based\
    \ on both the model parameters and the hyperparameters. In the maximisation step,\
    \ the model parameters and the hyperparameters are updated based on the evaluated\
    \ posterior. The update of $\\mu$ is shown below [Yang and Yang, 2013]\n\n$\\\
    mu = \\frac{\beta \\mathbf{z}^+ + \beta_0 \\mu_0}{\beta n + \beta_0}$  (6.26)\n\
    \nThe update rule for $\beta$ is shown below,\n\n$\beta = \\frac{n+2a+2}{\\sum_i(\\\
    mathbf{z}_i^+ - \\mu)^2 + 2b}$  (6.27)\n\nThe update rule for $\beta_0$ is shown\
    \ below,\n\n$\beta_0 = \\frac{a+1}{(\\mu-\\mu_0)^2/2+b}$  (6.28)\n\nBased on the\
    \ analysis above, a $t$ statistic is defined as below, $\\mathbf{z}_i^- \\in \\\
    mathbf{z}^-$ is the first candidate outlier in $\\mathbf{z}^-$ or the one which\
