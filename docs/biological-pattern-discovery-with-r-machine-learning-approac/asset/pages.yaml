- pgno: 288
  md: '# Biological Pattern Discovery with R


    DOG that the non-outlier case (or control) expressions have a significantly small
    distance with the tight cluster formed by the control expressions for most non-DEG.
    Each of such a case (or control) expression will be merged into the tight cluster.
    Therefore the tight cluster will be adaptively updated or growing its size when
    scanning the case expressions. All case expressions will be scanned by one to
    the point where a case expression cannot be treated as a member of the tight cluster
    and its membership of the tight cluster is significantly denied. In other words,
    the adaptive process of the algorithm is terminated when the remaining case expressions,
    which are treated as outliers, cannot be merged to the tight cluster. An alternative
    to allow an outlier to present among the control expressions in DOG is to use
    the 9^th percentile of the control expressions to form an initial tight cluster
    [Yang and Yang, 2013]. For a DEG, most case expressions will be significantly
    deviated from a tight cluster constructed based on the control expressions. Therefore,
    a process of searching for an outlier using the tight cluster approach will be
    terminated in a very early stage.


    It is common that there is normally an overlap between the control expressions
    and the case expressions for a gene. Therefore, DOG has been further updated in
    this chapter. Rather than using the 9^th percentile of the control expressions,
    a new initial tight cluster is formed in a slightly different way. With this method,
    an initial equation defines an empirical standard deviation, where the coefficient
    1.4826 used in the COPA algorithm [Tom, et al., 2005] and $\mu$ stands for the
    median of all expressions,


    $$\hat{\sigma} = 1.4826 \times \text{median}(|x - \mu|)$


    Figure 6.17 shows the relationship between the true (or expected) standard deviations
    ($\sigma$) and the estimated standard deviations ($\hat{\sigma}$) using the above
    equation. The correlation between two sets of standard deviations was about 0.97
    meaning that an estimated standard deviation can be a very good approximate to
    the true or expected standard deviation and can be used as an initial standard
    deviation to start a tight cluster in the algorithm.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Gene Expression Pattern Discovery


    # 275


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_289_0.png)


    An expression is included in the initial tight cluster (z+) if it satisfies the
    following condition, where xi stands for either a control expression or a case
    expression and the tight cluster box is sized by four standard deviations (-2σ
    and +2σ) from the left to the mean of the tight cluster μ,


    z+ = U {xi|xi ∈ [μ - 2σ, μ + 2σ]} (6.17)


    In this way, the initial tight cluster is composed of part or all control expressions
    and maybe a few case expressions. The rest of expressions, which can be some control
    expressions and case expressions, are treated as the candidate outliers. The outlier
    list is denoted by z-. They are then sorted in an ascending order. As in [Yang
    and Yang, 2013], each candidate outlier is tested one by one in terms of its relationship
    with the tight cluster. The one in the candidate list, is most close to the tight
    cluster box z+ defined above, is selected for testing at the first. If the relationship
    is significant, this candidate outlier is merged into the tight cluster z+ and
    the parameters of the tight cluster are updated. The merged outlier is removed
    from the candidate set z- and the test continues. If a candidate outlier cannot
    be merged into the tight cluster, a search process is terminated. At this point,
    all the rest candidates in z- are treated as the outliers or the outstanding case
    expressions for a DEG. To do so is because the initial candidate list has been
    ordered. If the first of the remaining candidates in z- cannot be merged into
    the tight cluster z+, all the rest of candidates cannot be merged into the tight
    cluster well.'
  merge: -1
