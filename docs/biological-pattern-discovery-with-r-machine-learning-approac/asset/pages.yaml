    # 3.4.3 Generalisation


    An important issue associated with a supervised machine learning model is its
    generalisation power. The generalisation power of a supervised machine learning
    model is an estimation of how a constructed supervised machine learning model
    can work for new data. Whether a model works well for new data is much more important
    than a model works well for data which is used to construct the model. A process
    of testing the generalisation power of a supervised machine learning model is
    called the generalisation test, which has to be implemented on new data. The meaning
    of new data is that the data has not been used for model construction.


    All classification models are supervised machine learning models, which entirely
    require a supervised test in place [Devroye, et al., 1996; Bishop, 1996; Ripley,
    1996]. The subject of the generalisation test of a supervised earning model has
    been well-exercised for analysing biological/medical data as well. For instance,
    classification models have been constructed for gastric and colonic epithelial
    tumour [Izuka, et al.,'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Protease Cleavage Pattern Discovery


    2020] and histopathology data classification [Jones, et al., 2019] and generalisation
    performance of these models have been tested.


    In most situations it is infeasible to have new data on hand to test a supervised
    model. Therefore an in-house test will employ part of the available data to mimic
    a real-world out-house test on new data. This part of the available data is commonly
    reserved from the whole available data and is called a testing data set. In contrast,
    the data used to construct a classifier is called a training data set. The final
    or ultimate evaluation of a supervised machine learning model must be based on
    the performance of the generalisation test applied on a testing data set.


    A common exercise for the generalisation test of a supervised machine learning
    model is to randomly divide a collected data set into two parts. One of them is
    used as the training data set and the other is reserved as the testing data set.
    However, it can be difficult to guarantee a robust distribution from an available
    data so to deliver unbiased generalisation performance. The robustness here means
    whether a random division can generate a testing data set which represents the
    data distribution of a training data set. This is a very important point to address
    and is the key of a successful generalisation test process.


    Three approaches have been used for a generalisation test for a supervised machine
    learning model so far. They are the random sampling approach, the K-fold cross-validation
    approach [Devijver and Kittler, 1982, Bishop, 1996] and the Jackknife test [Quenouille,
    1949; Efron and Stein, 1981].


    The random sampling is an application of the Monte Carlo simulation [Metropolis,
    1987]. The basic principle of the Monte Carlo simulation is to draw samples from
    a population many times to estimate a parameter. It is proved that when the sampling
    time increases, the trend of a parameter will be approaching the true one. Therefore,
    a parameter can be well-estimated if sufficient sampling times can be guaranteed.
    To demonstrate how this works, a one-dimensional Gaussian distribution centred
    at zero was generated with one million data points. Many samples were then drawn
    from this population with a varying number from ten to 10,000 to estimate the
    mean of the Gaussian distribution. Figure 3.13 shows the simulation result. It
    can be seen that the estimated mean of the Gaussian distribution was gradually
    converged to the true sample, i.e., zero.'
