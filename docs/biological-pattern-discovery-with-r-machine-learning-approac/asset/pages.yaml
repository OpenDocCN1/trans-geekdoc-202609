    # 6.5 Gene expression bimodality pattern discovery


    In addition to the heterogeneous gene expression pattern discovery problem, the
    gene expression bimodality pattern discovery problem is another important subject
    in gene expression pattern discovery. This is due to the fact that many human-related
    diseases as well as treatments such as cancers can hardly demonstrate genetic
    responses to a stress, especially in some therapeutic exercises [Farahani, et
    al., 2007]; Ertel, et al., 2010; Randade, et al., 2010; Sun, et al., 2010]. The
    main player for this phenomenon to occur is the bio-medical diversity across populations
    as well as across people. The most observable phenomenon is the subpopulation
    formation problem due to the intrinsic diverse biological nature on human [Basu,
    et al., 2011; Krejci and Grim, 2010; Emmink, et al., 2011; He, et al., 2011; Trujillo,
    et al., 2011].


    The problem of the inconsistent responses across replicates or the subpopulation
    formation has been well studied in the biomedicine area along with the fast development
    of the high-throughput gene expression technologies. To well understand and interpret
    the issue of the genetic response diversity within a population of patients, the
    subpopulation formation is this critical subject to study [Wappett, et al., 2016].
    The tool for studying such type of problems is called the gene expression bimodality
    pattern discovery problem.


    The main step in a gene expression bimodality pattern discovery exercise is the
    bimodality test for a population of data. As one of many classic statistical test
    approaches, the bimodality test has widely used'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'in many areas for a very long time. Among many exercises, one of the most popularly
    used approaches is the Hartigan test. It tests the bimodality for a population
    of data through maximising the difference between two clusters of an empirical
    distribution [Hartigan, 1985; Hartigan and Hartigan, 1985]. Its null hypothesis
    is the unimodality.


    To study the subprocess problem in biomedical practices, a gene expression bimodality
    pattern discovery project can be based on a single-object approach or a dual-object
    approach. The dual-object approaches assume the cooperation between two genes
    such as an oncogene and a suppression gene relationship to a disease development
    [Wappert et al., 2016]. The single-object approach takes one gene for the study.
    This chapter mainly focuses on the single-object approaches for gene expression
    bimodality pattern discovery. Most single-object approaches assume that the expressions
    of a gene follow a mixture of two distributions [Hellwig, et al., 2010].


    The measure used by the PACK algorithm is similar to the Kurtosis test [Teschendroff,
    et al., 2006], where the bimodality of a gene is tested by a kurtosis profile,
    which is either negative or positive. A positive measure stands for a super-Gaussian
    and a negative measure represents a sub-Gaussian. The bimodality index approach,
    on the other hand, assumes that the expressions of a bimodal gene follow a mixture
    of two Gaussians [Wang, et al., 2009]. The relative discrepancy measure is also
    based on the assumption of a Gaussian mixture [Besserabova, et al., 2010]. By
    formulating a ratio between a bimodal distribution and a unimodal distribution,
    the likelihood ratio between them is used for the bimodality pattern discovery
    [Hu, 2008]. In addition to the use of a measure, cluster analysis has also been
    used to discover a bimodal distribution [Gormley and Tozeren, 2008].


    # 6.5.1 The likelihood ratio test approach


    The likelihood ratio test (LR) assumes that gene expressions follow a Gaussian
    distribution and the bimodality only occurs in the case population [Hu, 2008].
    Suppose a gene expression vector is denoted by z. It is a joint vector of a control
    expression vector x and a case expression'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'vector y, i.e., z = x ∪ y'', where y'' stands for a sorted vector of y. The
    z

    vector is shown below, where n is the number of the control expressions,

    m is the number of the case expressions, x_{i} is the $i^{th}$ control expression
    and

    y_{k''} is the $k^{th}$ sorted case expression,


    ```

    $z = (x_1, x_2, ..., x_n, y_1, y_2, ..., y_m) \quad (6.32)$

    ```


    A cumulative S is defined as below,


    ```

    $S_r = \sum_{i=1}^{r} z_i \quad (6.33)$

    ```


    Based on the S statistic, the likelihood ratio statistic is defined as below,


    ```

    $\lambda = \max_{n<i<n+m} \frac{iS_{n+m}/(n+m) - S_i}{\sqrt{i(1 - i/2)}} \quad
    (6.34)$

    ```


    An approximate significance level will be calculated for the likelihood

    ratio [Hu, 2008].


    # 6.5.2 The bimodality index test approach


    The bimodality index test approach assumes that the expressions of a

    bimodal gene follow a mixture of two Gaussians. It also joins the control

    replicates and the case replicates together into one vector for the test. The

    mixture model for the bimodality index test is shown below, where $z_{i}$

    stands for the $i^{th}$ expression in $z$, $\mu_{1}$ and $\mu_{2}$ stand for the
    mean values of

    t Gaussians, $\sigma_{1}^{2}$ and $\sigma_{2}^{2}$ stand for the variances of
    two Gaussians,


    ```

    $z \sim \pi G(\mu_1, \sigma_1^2) + (1 - \pi) G(\mu_2, \sigma_2^2) \quad (6.35)$

    ```


    The bimodality index simplifies the model using a uniform variance,

    i.e., $\sigma_1^2 = \sigma_1^2 = \sigma^2$. A standardised distance is defined
    by the

    bimodality index by $\mathcal{H}_0: \delta = 0$


    ```

    $\delta = \frac{|\mu_1 - \mu_2|}{\sigma} \quad (6.36)$

    ```'
