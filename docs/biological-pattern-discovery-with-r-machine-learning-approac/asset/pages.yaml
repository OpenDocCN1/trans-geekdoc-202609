    zero. It can be seen that all the cells which align a residue against a gap were
    assigned a score zero in the table.


    # 7.2.4.3 The forward propagation


    The update rule of the Smith-Waterman algorithm for the forward propagation is
    shown below, where D stands for the diagonal move, V is for the vertical move
    and H represents the horizontal move:


    ```

    $M_{ij} = \max \left\{0, \begin{matrix} M_{i-1,j-1} + S_{ij} & D \ \max\{M_{i-x,j}
    + G_x\} & V \ \max\{M_{i,j-x} + G_x\} & H \end{matrix}\right\ (7.13)$

    ```


    No residue from sequence y matched the first residue move: Therefore all the cells
    of this row were filled with zeros. Their moving directions were not of interest.
    The cell (2, 3) was for the second residue C of sequence x and the third residue
    C of sequence y. This was the first pair of identical residues from two sequences
    from the top-left corner cell. The alignment score for this cell was calculated
    as below,


    ```

    $M_{2,3} = \max \left\{0, \begin{matrix} \max\{0 + (-1 - L/3)\} & V \ \max\{0
    + (-1 - L/3)\} & H \ \end{matrix}\right\ = 1$

    ```


    The diagonal move led to a score one shown below,


    ```

    $M_{1,2} + s_{2,3} = 0 + 1 = 1$

    ```


    Both the horizontal move and the vertical move ended up with a zero score. For
    instance, the score of the horizontal move from the cell (2, 2) and the cell (2,
    1) was calculated as below,


    ```

    $\max\{0 + (-1 - 1/3), 0 + (-1 - 2/3)\} = -4/3$

    ```


    Here -4/3 was capped to zero. Maximising three scores resulted in the selection
    of the diagonal move for this cell, shown in Table 7.13.'
