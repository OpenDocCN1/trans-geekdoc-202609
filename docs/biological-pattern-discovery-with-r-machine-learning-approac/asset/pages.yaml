    # 9.3 Quantum computing for biological pattern analysis


    Quantum computing started in the 1980s and it implements computations employing
    quantum mechanics such as superposition and entanglement. This has led to the
    development of the quantum computers. The research of quantum computing has led
    to the development of quantum machines such as the quantum neural networks [Benioff,
    1980; Feynman, Ladd, et al., 2010; Reicher, et al., 2017].


    Quantum computing has been implemented for machine learning in recent years. The
    basic component of machine learning is an information system that incorporates
    noise data with a properly designed cost function. Unsupervised machine learning
    can be implemented by developing a new entangled quantum states of the quantum
    bus in a quantum computer [Gyongozzi, 2020]. The work was introduced based on
    the observation that the quantum gate oscillates in a random mode which is similar
    to data noise. Quantum computing has been implemented as a kernel-based support
    vector machine. The support vector machine algorithm has a limitation when a feature
    space is too large. The quantum computing can implement the quantum-based support
    vector machines to speed up learning, where the novel idea is to use a smaller
    quantum space to replace a kernel space [Vojtech, et al., 2019].


    Quantum computing, as a novel pattern recognition approach, has been applied to
    biology pattern discovery and recognition because of the potentially huge computing
    power of the quantum computers. For instance, the quantum sequence pairwise alignment
    has been developed [Prousal and Konofao, 2019]. It has been recognised that generating
    a dot-lot is computationally very expensive. The quantum sequence alignment can
    make it much faster. Other quantum computing applications for sequence homology
    alignment the genetic algorithm enhanced quantum computing [Huo, et al., 2008].
    Quantum computing can also be used for the whole-genome de novo sequence assembly
    problem, which is one of the most computational time costing process with many
    uncertainties'
  merge: -1
  img_proc: true
