- pgno: 102
  md: 'A LDA model involves a weight assigned to each class. Such a weight is called
    the a priori probability, which is different from model parameters w. It is so
    because it is irrelevant with data collection and model construction. These a
    priori probabilities are assumed to exist before data collection as well as model
    construction.


    A naive interpretation of the a priori probabilities is the proportions of data
    points belonging to two classes. Suppose the two-class problem is denoted by $\pi_A$
    and $\pi_B$. If two classes have the same number of data points


    > $$\pi_A + \pi_B \equiv 1$\n$\pi_A, \pi_B \geq 0$$  (1.14)


    At the same time, a discriminant model is constructed on a collected data set.
    This process is named as an experiment, which has nothing to do with the a priori
    probabilities. In other words, the commonly used maximum likelihood process of
    parameter optimisation of a discrimination model will not utilise any knowledge
    from the a priori probabilities. The two sets are independent from each other
    during a learning process. Such an experimental outcome, i.e., a discrimination
    model, is commonly called an empirical likelihood function or an empirical model
    because it is data-dependent.


    Based on two densities and two a priori probabilities and an empirical model,
    the posterior probabilities $(p_A$ and $p_B)$ for two classes can be derived.
    A posterior probability model is a convolution between the a priori probabilities
    and the likelihoods derived from an empirical model. Obviously, the posterior
    probabilities are derived in a post-experiment manner. Rather than defining an
    arbitrary threshold to make decisions or using a likelihood function for decision
    making, using the posterior'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Protease Cleavage Pattern Discovery 89


    probabilities for decision-making can remove possible bias, especially when data
    show a great discrepancy between two classes. Two posterior probabilities are
    defined as below,


    ```

    $$p_A = \frac{\pi_A f_A}{\pi_A f_A + \pi_B f_B}$

    $p_B = \frac{\pi_B f_B}{\pi_A f_A + \pi_B f_B}$ (1.15)$

    ```


    These two posterior probabilities have the properties, $0 \le p_A, p_B \le 1$
    and $p_A + p_B = 1$. Using these two probabilities, the Bayes rule is defined
    as below,


    ```

    $$Z = \begin{cases} A & p_A > p_B \ B & p_A \le p_B \end{cases}$ (1.16)$

    ```


    or


    ```

    $$Z = \begin{cases} A & p_A > 0.5 \ B & p_A \le 0.5 \end{cases}$ (1.17)$

    ```


