  md: '# Chapter 5


    # Spectral Pattern Discovery


    Analysing a spectrum to discover chemicals and molecules has been one of the important
    subjects in biochemistry research. However, spectrometric data is complex because
    it is often a mixture between a number of signals and a complicated background.
    The latter is also called a baseline. The signals mixed with the background of
    a spectrum can be well discovered only after the background of a spectrum has
    been accurately identified. Background estimation or baseline removal is thus
    the very first step to go in the area of spectra pattern discovery. The difficulty,
    however, is that a baseline of a spectrum is hardly an easily estimated linear
    function (a straight curve) or a simple function. Instead, it is commonly a complex,
    unknown and a non-analytic function. Many algorithms have therefore been developed
    for estimating the baseline of a spectrum in the hope to extract peaks and thus
    discover the signals as accurately and correctly as possible. Only when a baseline
    has been accurately estimated and removed, the number of the falsely signals can
    be minimised and the number of the true signals can be maximised. Among many algorithms,
    the Whittaker-Henderson smoother is one of the best for spectra pattern discovery.
    This chapter will introduce this algorithm and its variants as well as other algorithms
    which are used for spectra pattern discovery. How these algorithms can be applied
    to some real spectrometric data for spectra pattern discovery will be introduced
    in this chapter. How to'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'However, the spectrum generated by the spectroscopy technology is

    often composed of a complex mixture between the signals and a baseline.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Spectral Pattern Discovery 211


    In most situations, the function of a baseline is unknown and will not be in an
    analytic format. Importantly, the background structure or the baseline (curve)
    varies with the spectrum across experiments and samples. This therefore leads
    to the difficulty in analysing the spectrometric data for detecting chemicals
    or molecules from a spectrum. This difficulty has resulted the development of
    various algorithms for baseline estimation.


    There are mainly three types of baseline estimation algorithms. The first type
    is to fit a smoothing spline to a spectrum (Hastie and Tibshirani, 1990). The
    fitting is based on a pre-defined model structure, i.e., the smoothing order or
    the smoothing degree. These algorithms have a typical advantage of simplicity
    and therefore have been widely used in a variety of applications for discovering
    chemicals or molecules from spectra data including the Raman spectrum [Shusterman,
    et al., 2000; Fonseca, et al., 2015; Schulz, et al., 2019; Monteiro, et al., 2020].
    However, these algorithms have a typical limitation because a model structure
    must be defined and the baseline removal performance is closely related with a
    priori design of a smoothing degree [Froning, et al., 1988]. These algorithms
    also have a problem to effectively deal with some complicated baseline structures
    [Perperglou, et al., 2019].


    The second type of baseline estimation algorithms is to use the wavelet smoothing
    technique, or the wavelet decomposition and integration approach [Price, et al.,
    2008; Restrepo-Agudelo, et al., 2017]. The approach assumes that a spectrum has
    a typical property that a high wave intensity corresponds to a chemical peak (or
    a signal) and a low wave intensity represents a baseline value. Therefore two
    types of spectroscopic patterns can be separated by decomposing two types of wave
    intensities. The wavelet approach has also been applied to the Raman spectrometric
    data [Hwang, et al., 2005; Alimov, et al., 2019]. However, this approach suffers
    a problem that an optimised threshold should be carefully determined between the
    low and high wave intensities [Hu, et al., 2007].


    The third type of algorithms for baseline estimation is the least squared error
    approach (LSE). LSE has been the most and widely adopted one for the estimation
    of a baseline in a spectrum. This is mainly because of its flexibility though
    it also has a problem of model selection or optimisation. Both the classical and
    the LSE variants have been used to'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'detect chemicals from the Raman spectroscopic data [Vyumvuhore, et al., 2014;
    Acikgoz, et al., 2018]. The Whittaker-Henderson algorithm is a typical regularised
    LSE variant for the baseline estimation [Whittaker, 1923; Henderson, 1924; Taylor,
    1992].


    # 5.3 The Whittaker-Henderson algorithm


    The Whittaker-Henderson algorithm (WH) is a special case of the ridge linear regression
    algorithm (RLR). The main concept and implementation of RLR has been introduced
    in the last chapter. The error term used in RLR is named as the fidelity in WH.
    Suppose a spectrum is expressed as a vector of $n$ entries, $\mathbf{s} = (s_1,
    s_2, \dots, s_n)$. Each entry of this vector is called a wave intensity or simply
    intensity. As aforementioned, such intensity may not represent a real signal or
    a peak of a chemical. It is instead a mixture between a baseline intensity and
    a signal intensity, i.e., $s_i = b_i + e_i$, where $b_i$ stands for the baseline
    intensity contained in the $i^{th}$ intensity and $e_i$ stands for the distance
    between the $i^{th}$ signal intensity $s_i$ and the $i^{th}$ baseline intensity
    $b_i$. Such a distance is also called an error. The vector-matrix expression of
    this relationship is $\mathbf{s} = \mathbf{b} + \mathbf{e}$, where three values
    are expressed by three vectors. Both $\mathbf{b}$ and $\mathbf{e}$ are unknown.
    In addition to the fidelity definition, which is $d_i = b_i - b_{i-1}$. A vector
    $\mathbf{d}$ is used to represent all the smoothness values. WH has employed an
    objective function by introducing a regularisation constant $\lambda$ to make
    a balance between the fidelity (regression error) and the smoothness. The WH objective
    function is defined as below,


    ```

    $O = \mathbf{e}^T\mathbf{e} + \lambda\mathbf{d}^T\mathbf{d} \quad (5.1)$

    ```


    The LSE optimisation of this objective function leads to the solution of an unknown
    baseline below,


    ```

    $\mathbf{b} = (\mathbf{I} + \lambda\mathbf{d}^T\mathbf{d})\mathbf{s} \quad (5.2)$

    ```


    Figure 5.1 shows an example based on a simulated spectrum, where the baseline
    ($\mathbf{b}$) is expressed by a solid line and the spectrum ($\mathbf{s}$) is
    expressed by a dotted line. It can be seen that if the baseline has very'
  merge: -1
  img_proc: true
