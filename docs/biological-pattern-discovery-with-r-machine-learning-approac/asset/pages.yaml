    # 3.6.7.2 The purity measurements


    A decision-making model is a system composed of a set of partitioning rules. To
    derive an optimal set of partitioning rules as the best decision-making model
    for a data set is an inductive learning process. For instance, y = 0 is certainly
    not a good partitioning rule compared with the partitioning rule although the
    lower subspace is very pure to one y = 2 in Figure 3.37(a). This is because the
    upper subspace generated by this partitioning rule is highly mixed by two classes
    of data points On the other hand, each subspace generated by the partitioning
    rule y = 2 is more pure to one class of data points.


    To automate the discovery of an optimal partitioning rule set, a quantitative
    measurement for measuring the purity or impurity of the subspaces generated by
    every partitioning rule is required. Two measurements have been proposed and are
    still in use. One is called the Gini index used by CART [Breiman, et al., 1984]
    and the other is called the information given by both DT and CART [Breiman, et
    al., 1984; Quinlan, 1986].


    The Gini index is calculated for each partitioning rule. It is the classwise sum
    of the products between the probability of correct classification and the probability
    of mis-classification. The product p_k(τ)[1 - p_k(τ)] is'
