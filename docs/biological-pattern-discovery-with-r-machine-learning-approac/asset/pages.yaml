    The delta expression of a gene was generated using the following approach. Suppose
    a vector of $K$ ($58$ for the letrozole drug data) case expressions were expressed
    as below, where $n$ was the $n^{th}$ gene in data,


    ```

    $$x_n = (x_{n,1}, x_{n,2}, \dots, x_{n,K})$$ (6.38)

