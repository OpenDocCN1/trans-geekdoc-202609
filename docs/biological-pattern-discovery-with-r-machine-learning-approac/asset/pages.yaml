    # 3.6.3.1 The bio-basis function neural network algorithm


    The bio-basis function neural network (BBFNN) has been developed based on this
    idea, i.e., mapping a non-numeric peptide space to a numerical space which is
    supported by the homology alignment scores between peptides using an amino acid
    mutation matrix [Thomson, et al., 2003; Yang and Berry, 2004; Berry, et al., 2004;
    Yang and Chou, 2004b; Senawongse, et al., 2005; Yang, et al., 2005; Yang, 2005b;
    Yang, 2005c; Yang and Thomson, 2005; Sidhu and Yang, 2006; Yang, et al., 2006;
    Yang and Hammer, 2007; Maji and Das, 2010; Maji and Das, 2010b].


    Suppose a peptide is denoted by $x_n$ and its functional status is denoted by
    $y_n \in [0,1]$, which is either functional (cleaved) or non-functional (non-cleaved).
    Suppose set of cleaved peptides is denoted by $\Omega^+$ and a protease cleavage
    discovery problem is a discrimination problem. It is well-understood that only
    cleaved peptides will show the amino acid composition trend. Moreover, a basis
    used in a basis function neural network mode is served as a supporting coordinate
    in the kernel space. Such a supporting coordinate must be composed of rich information.
    Non-cleaved peptides are certainly non-informative. Therefore, only cleaved peptides
    are employed as bio-bases in BBFNN. Suppose a bio-basis, $s_k$, which is a cleaved
    peptide, is denoted by $B(x_n, s_k)$, which stands for the non-gap alignment score
    between $x_n$ and $s_k$ and is calculated using a mutation matrix.


    It is thus assumed that a cleaved peptide $(x_n \in \Omega^+)$ will show a high
    homology score (similarity) with some bio-basis peptides because they belong to
    the same category and should show a similar biological property, i.e., the amino
    acid composition pattern or trend for a protease to recognise'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Protease Cleavage Pattern Discovery


    easily. On the other hand, a non-cleaved peptide ($x_n \in \Omega^-$) will show
    a small homology score (similarity) with the bio-basis peptides. The non-cleaved
    peptides will not maintain any amino acid composition pattern or trend, but a
    random distribution. In other words, each of 20 amino acids has the same probability
    to appear at each residue of a non-cleaved peptide. Therefore, it is expected
    that the homology scores of cleaved peptides and the homology scores of non-cleaved
    peptides should show different densities in theory.


    Based on the above analysis, BBFNN is designed in the following ways. Suppose
    there are $K$ bio-bases. A non-numerical peptide is mapped to a $K$-dimensional
    space, i.e., $\mathcal{B}(x_n, s_1), \mathcal{B}(x_n, s_2), \dots,$ and $\mathcal{B}(x_n,
    s_K)$. A linear function is generated for combining K bio-basis functions through
    the weighting parameters $w_k$.


    ```

    $$\sum_{k=1}^K w_k \mathcal{B}(x_n, s_k) \quad (3.42)$

    ```


    It is expected that this linear combination of the bio-basis functions will have
    a bimodal distribution if weights $(w_k)$ have been well-estimated. Such a bimodal
    distribution is expected to fit the classification of peptides in terms of peptide
    status $(y_n)$. A linear classifier can then be built in the $K$-dimensional bio-basis
    function space,


    ```

    $y_n = \sum_{k=1}^K w_k \mathcal{B}(x_n, s_k) \quad (3.43)$

    ```


    Suppose **X** is a collection of peptides and **S** is a matrix of all peptides
    mapped to this $K$-dimensional bio-basis function space. The matrix **S** has
    $N$ rows for $N$ peptides and $K$ columns for $K$ bio-bases. A target vector of
    classification labels is denoted by **y**,


    ```

    $**y** = (y_1, y_2, \dots, y_N)^T \quad (3.44)$

    ```


    Finally, a weight vector is represented by **w**.


    ```

    $**w** = (w_1, w_2, \dots, w_K)^T \quad (3.45)$

    ```'
