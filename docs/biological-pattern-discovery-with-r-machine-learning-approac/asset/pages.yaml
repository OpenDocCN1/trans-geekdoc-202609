  md: '# Protease Cleavage Pattern Discovery


    A classifier with its ROC curve approaching the top-left corner is a good classifier.
    In this scenario, no matter what the threshold variation, the true positive rate
    is always 100% and the false positive rate is 0%. When an ROC curve is approaching
    the diagonal line, a classifier makes decisions by chance. In this scenario, the
    false positive rate equals the true positive rate all the times. For instance,
    when the false positive rate is 10% for a threshold, correspondingly, the true
    positive rate is also 10%. When the true positive rate becomes 90%, the false
    positive rate is also 90%. This means when the false positive rate is controlled,
    the true positive rate is also dropping to the same level. When an ROC curve is
    below the diagonal line, it is very likely that the predictions are on the opposite
    side of the raw class labels. If this happens, a higher prediction value is delivered
    by a model for a lower-class label value and a lower prediction value is delivered
    for a higher class label value. This happens when a simulation is inappropriately
    designed.


    Based on an ROC curve, the area under an curve (AUC) is calculated, which is between
    zero and one. Using AUC as a measurement, a qualitative robustness visualisation
    using an ROC curve turns to a quantitative robustness analysis result.


    ROC has a wide application in biological/medical pattern analysis research. For
    instance, ROC has been used to evaluate the performance of a classification model
    for assessing the prognostic function of EEG in cardiac arrest practice [Barbella,
    et al., 2020] and to predict postoperative pancreatic fistula for patients who
    suffer from distal pancreatectomy with geriatric nutritional risk index [Funamizu,
    et al., 2020].


    One of the widely used R packages for ROC analysis is ROC. To do an ROC analysis
