    # 8.2 Introduction


    Most linear algorithms enjoy an excellent interpretation and explanation capability,
    but may not be sufficient to explain the interplay between residues in protease
    cleavage data or posttranslational modification data. Although the decision-tree
    algorithms and the random forest algorithms can be used to deliver intelligent
    rules, these algorithms may not deliver optimal rules because both types of algorithms
    derive rules based on the heuristic principles. Discovering the best solution
    for a system among a huge number of candidates is prohibitive and problematic
    if the exhaustive approach has to be used. Avoiding the expensive and exhaustive
    search strategies, the use of an optimisation process is considered as a reasonable
    strategy. Inspired by Darwin’s natural evolutionary theory, various evolutionary
    computation algorithms have been developed, aiming to mimic a natural evolutionary
    process using a computer program in a computer so as to examine how the rule of
    survival of the fittest be utilised for the optimisation problems of rule discovery
    [Fogel, et al., 1966; Holland, 1975; Goldberg, 1989].


    There are mainly three types of evolutionary computation approaches. They are
    the evolutionary algorithms (EA), the genetic algorithms (GA) and the genetic
    programming algorithm (GP). The evolutionary algorithms are normally used to optimise
    a numerical system with many parameters which are required for optimisation. For
    instance, the evolutionary algorithm can be used to optimise the parameters of
    a neural network. This is because the conventional Newton’s method used to optimise
    the model parameters is very likely stuck in a local optimum and the objective
    function of a neural network model is complex [Angeline, et al., 1994; Brusic,
    et al., 1998; Bird, et al., 2019]. The use of the evolutionary algorithm can start
    with a pool of initial sets of weights. The use of the Newton approach for each
    of an individual set of weights can approach one of many local optimum including
    the one which is the global optimum. Among many candidate solutions, the evolutionary'
