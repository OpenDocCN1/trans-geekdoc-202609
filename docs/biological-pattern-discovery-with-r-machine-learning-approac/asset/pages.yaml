    # 7.4.2 The alignment-based approach versus the alignment-free approach for sequence
    comparison


    If the alignment-free multiple sequence comparison can cover the whole genome
    pattern discovery, it is interesting to compare the alignment-free approach with
    the alignment-based approach for three aspects, i.e., the speed, the accuracy
    and the pattern discovery power.


    # 7.4.2.1 The speed comparison


    Whether the alignment-free sequence comparison is saving the CPU time significantly
    was examined on a 3-mer word set. Two pseudo nucleotide sequences were generated.
    Their lengths varied from 1,000 to 10,000. The mutation rate on one sequence was
    10%. The Needleman-Wunsch algorithm was applied for the homology alignment between
    them, i.e., the alignment-based sequence comparison. The k-mer word frequency
    was calculated for each sequence. The pairwise distances between sequences were
    calculated based on the word frequency vectors. The CPU time was recorded. Figure
    7.14(a) shows the comparison. It can be seen that the CPU time of the alignment-free'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'approach was almost a constant, but the CPU time of the alignment-based approach
    was increasing exponentially along with the increase of the sequence length. This
    clearly shows an important fact that the alignment-free approach can speed up
    the multiple sequence comparison dramatically for long sequences.


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_367_0.png)


    Fig. 7.14. (a) The CPU time comparison between the alignment-based approach using
    the Needleman-Wunsch algorithm and the alignment-free approaches using the k-mer
    word frequency library for sequence comparison. The horizontal axis stands for
    the sequence length. (b) The accuracy comparison between the alignment-based approach
    using the Needleman-Wunsch algorithm and the alignment-free approach, i.e., the
    k-mer word frequency library for sequence comparison. ''rho'' stands for the correlation
    coefficient and ''p'' is the correlation test value.


    # 7.4.2.2 The accuracy comparison


    Whether the alignment-free approach is accurate was also examined. It aimed to
    investigate whether the measurement between sequences of the alignment-free approach
    was correlated with the alignment distance of the alignment-based approach. One
    hundred pairs of pseudo nucleotide sequences were randomly generated. The mutation
    rate was between 0.5% and 5%. Every mutation was repeated for 500 times. Therefore,
    there were 50,003 trials in total. Both the alignment-based approach and the alignment-free
    approach were applied for each pair of random pseudo nucleotide sequences. First,
    the distance percentage was defined as the ratio of the alignment distance over
    the alignment length. The correlation between the distance percentage and the
    distance among k-mer word frequencies was tested. Figure 7.14(b) shows the result.
    It can be seen that the correlation coefficient was greater than 0.927 and'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'the p value of correlation test was almost zero, indicating very significant
    correlation between two sets of distances.


    # 7.4.2.3 The pattern discovery power


    It is also interesting to examine whether the word length (the k value of the
    k-mer approach) matters. Based on the above two comparisons, the k value varied
    from two to six to examine whether the accuracy of alignment-free approach can
    be maintained. Figure 7.15 shows the result. It can be seen that when the word
    length increases, the correlation between the alignment distance and the k-mer-distance
    decreases. This means that it is better to use shorter words for using the alignment-free
    approach for sequence comparison so to maintain the discovery power.


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_368_0.png)


    Figure 7.15. An examination whether the k-mer word length matters for the alignment-free
    approach to maintain the accuracy in multiple sequence comparisons.


    # 7.5 K-mer machine


    Finally whether a word matrix (a k-mer frequency matrix) generated by an alignment-free
    approach can show a good discrimination power needs to be examined. Therefore,
    ten SARS-CoV genome sequences and ten SARS-CoV-2 genome sequences were downloaded
    from NCBI. A word matrix (library) of the 3-mers for these sequences was derived.
    Figure 7.16 shows a heatmap generated for this word matrix. It can be seen that
    even unsupervised machine learning model can make a good separation between two
    types of SARS genomes using the 3-mer frequency.'
