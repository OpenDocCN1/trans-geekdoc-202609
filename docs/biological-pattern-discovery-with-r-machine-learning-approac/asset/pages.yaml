    # 2.2.3 The non-parametric approach


    The histogram approach is generally used for generating a visible density, which
    is loyal to the true data distribution. But, it cannot be used for a data set
    in a high-dimensional space. The parametric approach enjoys the simplicity and
    a resulting density model is parsimonious in structure. It is also based on two
    important assumptions. First, the density format is known in advance. Second,
    the density is a single-mode data distribution such as a single Gaussian or a
    single Gamma distribution. Therefore to estimate the density for a single more
    complicated distribution, the alternatives should be considered. Among them, the
    non-parametric approach is the one.


    The advantage of the non-parametric density estimation approaches are that they
    can estimate a density function without priori knowledge about how a distribution
    looks like and still maintain a limited flexibility of the parameterisation of
    a density model [Rosenblatt, 1956; Parzen, 1962; Duda, et al., 2000].


    # 2.2.3.1 The kernel method


    There are several non-parametric density estimation approaches. The kernel method
    is one of the widely used ones. It employs a set of raw data'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'points to act as kernels. Each kernel is a Gaussian distribution, for which
    a raw data point acts as the centre. Each kernel thus has a density and is called
    the kernel density. The whole density for a data set is an integration of all
    kernel densities. Suppose there are N data points, for which a subset (M data
    points) is used as the kernels. The kernel densities are denoted by $f_1, f_2,
    \dots, f_M$, where $M \le N$. The format of the kernel method for estimating a
    density for a data set is shown below,


    ```

    $F = \frac{1}{M} \sum_{m=1}^{M} f_m = \frac{1}{M}(f_1 + f_2 + \dots + f_M) \quad
    (2.5)$

    ```


    where each kernel density $f_m$ is defined as below,


    ```

    $f_m = \frac{1}{\sqrt{2\pi}\sigma} e^{\frac{(x-u_m)^2}{\sigma^2}} \quad (2.6)$

    ```


    Figure 2.10 shows how the kernel-based density estimation works for a data set.
    Each dotted curve represents a kernel density centred at one data point. The thick
    curve represents the whole density, which is generated by integrating all kernel
    densities.


