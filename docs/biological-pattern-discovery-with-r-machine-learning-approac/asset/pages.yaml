- pgno: 7
  md: '# Preface


    Over time, the majority of biological data pattern discovery tasks have shifted
    from traditional univariate approaches, by which the activity of a single molecule
    is analysed using a statistical test, to more sophisticated approaches. Along
    with the fast development and modernisation of biotechnology such as the microarray
    technology, the next-generation sequencing and mass-spectroscopy technology, biological
    pattern discovery has gradually become multivariate, multi-species and multi-omics
    as well as network-based. It is the so-called big-data era, which not only has
    the promising prospect but also brings with it challenges such as the computing
    facility problem, the model complexity problem, the generalisation capability
    problem, and importantly the interpretation and extrapolation capability problem.


    Researchers and scientists have therefore made huge efforts to overcome such challenges.
    Among many successful developments, machine learning has always played and still
    plays a very important as well as unique role in biological pattern discovery.
    Almost all machine learning areas have greatly engaged in biological pattern discovery
    from unsupervised to supervised machine learning, from deterministic modelling
    to stochastic modelling, from classical algorithms to more and more cutting-edge
    algorithms. The variety of biological data, such as from the microarray gene expression
    data to the next-generation sequencing data, from image data to spectroscopy data,
    have all seen the involvement of various advanced machine learning algorithms
    and approaches. The huge success of biological pattern discovery could not have
    been realised without the support of machine learning.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Biological Pattern Discovery with R


    This book was written based on the author’s research in collaboration with his
    colleagues, and the objective of this book is to provide some bases for researchers
    who enter this area. The book was especially written with the aim to give readers
    the opportunity to transfer their machine learning theories to practical problems.
    From this, they can be motivated to develop new methodologies, new ideas and new
    algorithms for biological pattern discovery. Therefore, the R programming environment
    was used throughout this book. Moreover, this book was written on individual subjects
    of biological pattern discovery. The main subjects include gene expression data
    analysis for both microarray and sequencing count data, genomic sequencing comparison,
    peptide data analysis, spectra data analysis for molecule discovery, as well as
    pattern optimisation involving the evolutionary computation approaches. The selection
    of the subjects in this book was based on individual machine learning approaches.
    Therefore, each chapter of this book can be independently read and referred to.
    The reader can start via any chapter according to his/her requirements.


    The author feels very lucky to have been a part of the current era in which biological
    pattern discovery has been revolutionised. The author would like to make an acknowledgement
    to his research collaborators in the biology department of the University of Exeter.
    Without these important and fruitful collaborations, it is almost impossible for
    the author to develop the ideas, algorithms and models for biological pattern
    discovery, hence resulting in this book. The author would also like to thank his
    students, especially some excellent students. Their desire to learn new skills
    has greatly motivated the author’s research.


    Most importantly, the author would like to make a sincere acknowledgement to the
    huge support from his family, especially the support from his wife and his daughter.
    The author makes his best wishes to his new-born grand-daughter Poppy: may her
    become a wise and beautiful scholar in the future.


    31 March 2021


    Exeter


    ron.zheng.rong.yang@gmail.com'
