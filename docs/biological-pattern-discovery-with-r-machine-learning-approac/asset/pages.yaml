    # Summary


    This chapter has introduced one important biological pattern analysis subject,
    which is the spectra pattern discovery. Spectra data has been used in many subjects
    in biology. The main objective of using spectra data for research is to discover
    molecules or chemicals within a spectrum after a baseline has been estimated and
    removed by an algorithm. The estimation'
  merge: -1
  img_proc: true
- pgno: 258
  md: of a baseline must be as accurate and as correct as possible so as to ensure
    effective signal (chemicals or molecules) discovery. A baseline is commonly contaminated
    by noise of multiple reasons, such as equipment error, sample preparation error
    and sample variance. Noise certainly adds diff to the accurate and correct estimation
    of a baseline. Because the baseline of a spectrum is unknown and not in an analytic
    format and importantly contaminated by noise, estimating the baseline for a spectrum
    needs special algorithms. Most baseline estimation algorithms work on two parts,
    i.e., the error be minimised and the smoothness of a baseline curve must be maximised.
    Therefore almost every baseline estimation algorithm has to trade off between
    the fidelity (error) and the smoothness. A model that strengthens too much on
    the fidelity will end up with a peak spectrum, in which almost no signal can be
    detected. However, a model that strengthens too much on a peak with too many artifacts
    leading to many false signals and missed signals. The success of accurate signal
    discovery is thus highly related with the selection of a proper baseline estimation
    algorithm. This chapter has introduced several baseline estimation algorithms
    including the most classical ones, such as the Whittaker-Henderson algorithm,
    the spline algorithm and the wavelet approach and the advanced one, such as the
    Bayesian Whittaker-Henderson algorithm. One important issue of discovering signals
    from a spectra data set with multiple replicates is the alignment of the discovered
    peaks across replicates. This is because the signals in a spectrum will have two
    uncertainties. First, a signal may occupy an interval on the horizontal axis of
    a spectrum (the spectra analyser). Therefore identifying a unique spectra analyser
    for a signal needs a smoothing process. Second, a signal may have some variation
    across replicates regarding the spectra analyser values. An appropriate alignment
    of the discovered signals across replicates must be considered. This chapter has
    therefore introduced a novel approach to align discovered peaks across replicates
    within the Bayesian Whittaker-Henderson algorithm.
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Chapter 6


    # Gene Expression Pattern Discovery


    Differentially expressed genes are treated as the major signal to understand how
    a stress results in a phenomenon change in a species. Scientists hypothesised
    that it is the genetic signature that ultimately causes the observed phenomenon
    change. The major objective of gene expression pattern discovery is to discover
    differentially expressed genes. In this chapter, the approaches for gene expression
    pattern discovery will be introduced for two major types of data, i.e., the microarray
    gene expression data and the RNA-seq sequencing count data. Gene expression pattern
    discovery may encounter the challenges of the outlier problem or the subpopulation
    problem. Therefore this chapter will also introduce the alternatives for gene
    expression pattern discovery. Moreover, insufficient replicate number is the common
    issue in gene expression pattern discovery. The dual-scale Gaussian mixture algorithm
    for discovering differentially expressed genes in a data set with insufficient
    replicates will be introduced in this chapter.


    # 6.1 Differentially expressed genes


    In most situations, an experiment with two conditions is conducted to discover
    which has caused a phenomenon change in a species for it to respond to a stress.
    These two experimental conditions normally have different settings. One is called
    the control condition, in which no stress is applied and the other is called the
    case condition, in which a stress is'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'applied. In a biological/medical research, the genetic signature space is composed
    of thousands of genes, which are examined simultaneously using either the microarray
    technology or the sequencing technology nowadays. The output of the former technology
    is called the microarray gene expression data, and the latter is called the sequencing
    count data. The phenomenon change can be observed in the output data of either
    technology by comparing two conditions. The main objective of gene expression
    pattern discovery is thus to search in the genetic space to discover a small subset
    of genes which have significantly different responses to a stress across experimental
    conditions.


    An important understanding of a living system is that such a system will not use
    all its genes to respond to a stress [Liu, et al., 2016; Antolovic, et al., 2019;
    Siderenko, et al., 2019]. This is why the subset of genes, which have significantly
    different responses to a stress across two experimental conditions, is normally
    of a small size. To discover differentially expressed genes (DEGs) given two experimental
    conditions, it is required to compare genes one by one using a significance measurement.
    A measurement should be unified across different experiments or experimental data
    sets. Two commonly used significance measurements are the biological significance
    and the statistical significance [Chagoyen and Pazos, 2010; Mingue and Dopazo,
    2011; Chagoyen, et al., 2017; Miller, et al., 2019].


    # 6.1.1 The biological significance


    The biological significance used to discover DEGs is the so-called fold change
    or the base two logarithm fold change. It has been exercised in biology since
    1960s [Pauly, 1960; Hill and Sussman, 1964; Gilbert and Ehrenstein, 1969]. Suppose
    a case is denoted by $A$ and a control condition is denoted by $B$. The case normally
    represents the experimental group in which a stress is applied or a phenomenon
    change has been observed. The control condition normally represents the group
    in which no stress is applied or no phenomenon change has been observed. The fold
    change below is defined as the ratio between two mean expressions ($\mu_{g,A}$
    and $\mu_{g,B}$). Note that $\mu_{g,A}$ and $\mu_{g,B}$ stand for the mean expressions
    of the $g^{th}$ gene.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Gene Expression Pattern Discovery 247


    $F_g = \frac{\mu_{g,A}}{\mu_{g,B}} \quad (6.1)$


    The base two logarithm fold change is defined as below,


    $\log_2(F_g) = \log_2\left(\frac{\mu_{g,A}}{\mu_{g,B}}\right) = \log_2(\mu_{g,A})
    - \log_2(\mu_{g,B}) \quad (6.2)$


    When a fold change is two, the base two logarithm fold change is one, meaning
    that the case expression is the double of the control mean expression. When a
    fold change is half, the base two logarithm fold change is negative, meaning that
    the control mean is double of the case mean expression. For short, the base two
    logarithm fold change is expressed as the fold change in the following discussions.
    A gene with a negative fold change is called a down-regulated gene and a gene
    with a positive fold change is called an up-regulated gene. The gene regulation
    direction is from a control to a case condition. If the fold change of a down-regulated
    DEG is less than a pre-defined negative threshold, the gene is named as a down-regulated
    DEG. If the fold change of an up-regulated gene expression is missing in the fold
    change space, the gene is named as an up-regulated DEG.


    Figure 6.1 shows the distribution of the fold changes of all genes in a microarray
    gene expression data, in which the letorole drug was used to treat the breast
    cancer patients [Miller, et al., 2007; Miller, et al., 2010]. The data set is
    composed of two conditions, i.e., before and after using the drug. The condition
    population was named as baseline before using the drug. The fold change threshold
    was one, 22 down-regulated DEGs and six up-regulated DEGs were identified. All
    the down-regulated DEGs were on the left side of the estimated density function
    of the fold change. Meanwhile, all the up-regulated DEGs were on the right side
    of the estimated density function of the fold change.


    However, the fold change may have little information regarding the statistical
    significance. For instance, it has no statistical significance to compare a gene
    with a fold change 2.5 with a gene with a fold change 2.1. Therefore, the statistical
    significance is missing in the fold change space.'
  merge: -1
  img_proc: true
