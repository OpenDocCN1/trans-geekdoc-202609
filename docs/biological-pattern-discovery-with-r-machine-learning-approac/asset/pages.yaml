- pgno: 15
  md: '# Chapter 1


    # Introduction


    Classical approaches have been used for solving biological systems since the Newton
    time. Most of the earlier effort has reduced a system to the simplest levels for
    the study. Such an effort is referred to as the reductionist [Mazzochhi, 2008].
    Having recognised that a biological system is one of the most complicated systems
    on the earth, whether a biological system can be easily simplified for a meaningful
    research has been debated for a few decades [Mazzochhi, 2008]. Moreover, decomposing
    a biological system, such as a single organism or a single cell, to unrelated
    subparts to reduce the component number for the study has been greatly challenged
    nowadays [Glaeser, 1994; Wood, et al., 2004; Schenkel and Leggewie, 2015; Nussinov,
    2015]. The challenges not only result from the aspects before an analysis such
    as experiment condition, data creation and the storage, but also the methods used
    in analysis including the computational approaches, the computing facility as
    well as the interpretation and explanation after an analysis.


    Some biological discovery approaches based on the reductionist principle have
    been criticised as “meaningless” due to four concerning issues [Mazzochhi, 2008].
    They include the problem of component insertion, the problem of debatable extrapolation
    based on some small in-house mathematical models, the problem of deterministic
    conceptual thinking and the problem of insufficient treatment in an experiment
    or a modelling process regarding the self-organisation within a biological system.
    New trends of biological pattern analysis have been directed to employ more sophisticated
    methods to understand, model and interpret biological systems. They have provided
    new conceptual ideas and methodologies for researching complicated biological
    systems'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Biological Pattern Discovery with R


    [Nussinov, 2015; Cortesi, et al., 2020; Gillen, et al., 2020; Tang, et al., 2020].


    # 1.1 The responsive gene discovery problem


    One major objective of a biological investigation through an experiment is to
    identify genes with some desired functions. When a species or an organism has
    experienced a stress and some phenotypic phenomenon has been observed, it is desirable
    to study which genes have responded to the stress. A gene which shows a significant
    response to a stress in an association with a phenotypical phenomenon or phenomenon
    change is called a responsive gene [Alves, et al., 2016]. Responsive gene discovery
    in a stress-related experiment is called a genotype-phenotype mapping process
    [Bassel, 2019; Bolker, 2019; Koch, 2019; Lian, et al., 2019; Kawasaki, et al.,
    2020; Kowalko, 2020; Morris, et al., 2020].


    The main objective of a genotype-phenotype mapping process is to establish either
    a qualitative or quantitative associative model. Based on such a model, it is
    aimed to discover and describe the dependency relationship between the genotype
    data and the phenotype data in an experiment. Afterwards, either the interpretation
    of the existing phenomena or the prediction of future events is followed.


    A responsive gene is also called an essential gene or a differentially expressed
    gene depending on an experiment. Normally, the proportion of responsive genes
    is small in most biological experiments. This provides a traditional basis for
    simplifying, but not completely ignoring the complexity of a biological system
    to focus focal points of interest [Lai, et al., 2008; Chen, et al., 2011; Zeng,
    et al., 2013; Alves, et al., 2016; Liu, et al., 2016; Antolovic, et al., 2019;
    Sidorenko, et al., 2019; Trolet, et al., 2019].


    There are mainly two types of approaches for the genotype-phenotype mapping study.
    The two types depend on how an experiment has been carried out. Suppose a phenotypical
    phenomenon (change) within a biological system has been observed and the corresponding
    activity changes of all genes of the species have been recorded. When a researcher
    wants to do next is to find which genes are the responsive genes. For instance,
    suppose the bacterial growth has been observed in a transposon'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction 3


    experiment and the transposon distribution across a genome has been estimated.
    The analysis of the distribution can identify genes which are essential to the
    bacterial growth [Langridge, et al., 2009; Zomer, et al., 2012; Yang, et al.,
    2017]. This kind of responsive gene discovery study is normally based on a single-condition
    experiment. If a biology experiment is composed of two conditions, a condition-wise
    comparison process can identify genes with different activities across two conditions.
    In this situation, the other approach is employed to discover the responsive genes,
    such as the gene expression pattern discovery [Tusher, et al., 2001; Smyth, 2004;
    Chagoyen and Pazos, 2010; Mingue and Dopazo, 2011; Chagoyen, et al., 2017; Miller,
    et al., 2019; Tsuda, et al., 2019].


    # 1.2 The peptide function discovery problem


    Predicting or discovering the protein function within a protein sequence has been
    one of the most researched subjects in biology. Proteins as macromolecules have
    a variety of roles in cells. Metabolism relies on the functional proteins for
    enzymatic function, working as the energy carriers as well as the hormones for
    chemical reactions in cells. The protein functions are researched mainly in two
    ways, i.e., the crystal structural analysis and the primary structure analysis.
    The crystallising experiment is a 3D technology to investigate the protein structures.
    For instance, the disordered segments of a protein can be discovered using the
    3D crystallising experiment [Yang, et al., 2005]. The molecular structures of
    S1 and S2 subunits of SRAS were examined using the crystallising technique [Spiga,
    et al., 2003]. The study examined the shape and surface of the hydrophobicity
    in association with the known functional proteins so the cleavage pattern between
    the S1 and S2 subunits can be thoroughly examined. Another recent crystal structure
    study has examined the structure of non-structural protein nine (NSP9) of SARS-CoV-2,
    which can mediate viral replication, the role of promoting virulence as well as
    the role of replicating genomic RNAs. Through the use of the crystallising technology,
    it has been found that NSP9 of SARS-CoV-2 is highly structurally conserved [Little,
    et al., 2020].


    The other mainstream of protein function discovery is to research the protein
    primary structures, i.e., the protein sequences. The pattern of'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'protein functional sites can be discovered in two ways. One employs the whole
    protein sequence comparison approach. The other examines the nucleic acid composition
    pattern or the amino acid pattern on sub-sequences. Discovering the protein functional
    sites based on the whole sequence pattern is mainly based on the sequence homology
    alignment approaches. Through an alignment, it is possible to annotate and discover
    the functions of a novel protein as well as the functional sites. This process
    is called the protein function annotation [Lowenstein, et al., 2007; Huerta-Cepas,
    et al, 2017; Mahlich, et al., 2018]. This method has been widely used; for instance,
    the primary sequence comparison can enhance the protein function annotation performance
    in addition to the use of the 3D protein structuring technology [Whisstock and
    Lesk, 2003; Shatsky, et al., 2008].


    Predicting and discovering protein functional sites based on sequences or peptides
    is an exercise of the local protein function annotation. This study includes the
    discovery of the protein cleavage sites [Thomson, et al., 2003; Yang and Berry,
    2004; Berry, et al., 2004; Senawongse, et al., 2005; Yang, et al., 2005; Yang
    and Thomson, 2005; Sidhu and Yang, 2006; Yang and Hammer, 2007; Maji and Das,
    2010; Maji and Das, 2010b; Cabuk, et al., 2018; Betancur-Anconca, et al., 2018]
    and the discovery of the post-translational modification sites [Lu, et al., 2011;
    Trost, et al., 2016; Ivanisenko, et al., 2019]. This kind of research targets
    local protein structures, such as the amino acid composition in the posttranslational
    cleaved peptides. This set collects two sets of peptides. One is composed of the
    experimentally verified peptides and the other is composed of the null peptides.
    A null peptide is a peptide in which there is no experimentally verified protein
    functional site.


    # 1.3 The molecular interaction discovery problem


    The molecular interaction within a biological system is a complex issue. The interaction
    can happen between a biological system and some environmental factors as well
    within a biological system. For instance, the interaction relationship between
    a single nucleotide polymorphism and a gene-environment has been examined for
    the pregnant women'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    implications of the pregnancy outcome [Gao, et al., 2019]. The gene-metabolite
    interaction has been examined in association with the pig feeding efficiency [Wang
    and Kadarmideen, 2020].


    Another typical issue is the interaction between the genetic signatures and the
    epigenetic signatures such as the methylation sites and the DNA copy numbers [Comai,
    2000; Chang, et al., 2003; Chari, et al., 2010; Baylin and Jones, 2011; Sandoval
    and Estelle, 2012; 2012]. In this type of research, it has been found that the
    epigenetic signatures closely interact with the genetic signatures for certain
    disease development. Therefore combined or integrated studies have been carried
    out for researching and discovering of the genetic-epigenetic interplay in association
    with cancers as well as cellular functions. The studies have analysed these two
    types of signatures either separately followed by a consistency analysis or a
    joint cluster analysis [Chari, et al., 2010; Pacheco, et al., 2011; Sun, et al.,
    2011; Kresse, et al., 2012; Ping, et al., 2015]. Recent studies of the genetic-epigenetic
    interplay have covered the heart disease development [Akerberg and Pu, 2019],
    the colorectal cancer function [Yeh, et al., 2020] and the gestational diabetes
    mellitus [Rosik, et al., 2020]. The research of the genetic-epigenetic interplay
    is still challenging when more and more complicated experiments have been conducted.


    # 1.4 The spectral molecular discovery process


    The advanced scientific research of the light and spectroscopy analysis have been
    used in many areas including biology. A spectrum is composed of the continuous
    light waves. Many biology researches employ the spectral technology for the discovery
    of novel chemicals and drugs [Petucci, et al., 2007; Cho, et al., 2008; Kim, et
    al., 2008; de Sanctis, et al., 2011; Pitteri, et al., 2011; Baygi, et al., 2016;
    Kumamoto, et al., 2019]. For instance, the singular spectrometry and automated
    baseline correction have been used to discover novel chemicals based on the NMR
    spectroscopy [de Sanctis, et al., 2011]. To analyse breast cancer is developed,
    the mass spectroscopy has been used to discover and verify proteomic signatures
    of breast cancer [Pitteri, et al., 2011]. To examine breast cancer cell lines,
    different machine learning algorithms have been'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Biological Pattern Discovery with R


    integrated to model the narrowband Raman spectroscopy to discover disease-associated
    molecules [Kumamoto, et al., 2019].


    Because of the experimental bias and the equipment resolution, the chemical signals
    to be discovered can only reside on a baseline [Greif, et al., 2008]. Therefore,
    estimating the baseline of a spectrum has been studied in many areas [Greif, et
    al., 2008; Sanctis, et al., 2011; Kumamoto, et al., 2019]. To successfully discover
    the chemicals from a spectrum, the accuracy of baseline estimation is thus very
    desirable [Haste and Tibshirani, 1990; Price, et al., 2008; Vymvuhore, et al.,
    2014; Restrepo-Agudelo, et al., 2017; Acikgoz, et al., 2018].


    # 1.5 The whole-genome pattern discovery process


    The DNA sequencing technology has been improved continuously for several decades.
    Because of this, the high-throughput sequencing data have played an outstanding
    role in modern biology research nowadays. The modern DNA sequencing technology
    or the next-generation sequencing technology (NGS) can generate sequencing count
    data for a genome in less than an hour’s time. It has changed, shaped and transformed
    the modern biology/medicine research thoroughly [Hood and Rowen, 2013]. Among
    them, the most exciting project is the human genome project, which has made a
    huge impact on genome genome [Dulbecco, 1984; Collins and Galas, 1993; Collins
    and McKusick, 2001; Vincent, et al., 2017; Dunn, et al., 2018].


    There are many subjects for the whole-genome pattern discovery based on NGS count
    data. Among them two are more relevant to the machine learning concepts. The first
    one is how to analyse whole genome sequences for knowledge discovery, i.e., the
    research of the sequence homology alignment approaches. It has had at least five
    decades since the first sequence homology alignment algorithm was developed [Needleman
    and Wunsch, 1970]. Besides, the currently widely used one named as BLAST has been
    developed for three decades [Altschul, et al., 1990].


    Most earlier alignment algorithms align sequences pairwise and mostly globally.
    Along with the huge increase of sequencing data using NGS, the speed of sequence
    comparison is hugely challenged especially when comparing a novel sequence against
    a database of'
  merge: -1
  img_proc: true
