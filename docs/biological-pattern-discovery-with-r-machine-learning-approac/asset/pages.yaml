    BBFFN [Yang, 2005b]. The parameters are updated in a loop with the initialised
    values for $\mathbf{w}$, $\vartheta$ and $\tau$. The parameters $\alpha$ and $\beta$
    are estimated at first. The estimate of $\alpha$ is shown below, where $\mathbfmathbf{e}$
    is an error vector between a model output vector $\hat{\mathbf{y}}$ and a target
    vector $\mathbfmathbf{y}$,


