  md: "# Biological Pattern Discovery with R\n\nAs usual, a control expression vector\
    \ is denoted by **x** and a case\nexpression vector is denoted by **y**. A joint\
    \ expression vector is composed\nof all expressions and is denoted by **z = U(x,y)**.\
    \ A tight Gaussian cluster\n is denoted by **z+**. A tight cluster box is defined\
    \ as above, i.e., $\\omega = [\\mu - 2\\hat{\\sigma}, \\mu + 2\\hat{\\sigma}]$\
    \ for 95% of a Gaussian confidence interval. A candidate\noutlier set **z-⁻**\
    \ is composed of all expressions which are not included in the\ntight cluster\
    \ set **z+** and is denoted by\n\n```\n$z^- = \\{z_i^- | z_i^- \\in \\omega\\\
    }$ (6.18)\n```\n\nBased on the initial tight cluster **z+** and an initial candidate\
    \ outlier set\n**z-**, an adaptive learning process is implemented using the Bayesian\n\
    learning mechanism [Yang and Yang, 2013]. The likelihood function of\nthe Gaussian\
    \ tight cluster is defined as below, where **i** is an identity vector\nand $\\\
    beta = \\sigma^{-2}\n\n```\n$\\mathcal{L}(z^+|\\mu, \\beta) = \\frac{\\beta}{2\\\
    pi} \\exp(-\\frac{1}{2}(z^+ - \\mu i)^2)$ (6.19)\n```\n\nFor this Gaussian likelihood\
    \ function, one *a priori* structure for the\ninverse variance $\\beta$ is defined\
    \ as an inverse Gamma\n\n```\n$IG($\\beta|a, b) = \\frac{b^a}{\\Gamma(a)} \\beta^{-(1+a)}\\\
    exp(\\frac{b}{\\beta})$ (6.20)\n```\n\nA prior for the mean $\\mu$ is defined\
    \ as a Gaussian function,\n\n```\n$G(\\mu|\\mu_0, \\sigma_0^2) = \\frac{1}{\\\
    sqrt{2\\pi\\sigma_0^2}} \\exp(-\\frac{(\\mu - \\mu_0)^2}{2\\sigma_0^2})$ (6.21)\n\
    ```\n\nThe log-posterior of the likelihood combined with priors leads to the\n\
    following format, where the model parameter set is $\\theta = (\\mu, \\beta)$\
    \ and\nthe hyper-parameter set is $\\alpha = (\\mu_0, \\sigma_0^2, a, b)$,\n\n\
    ```\n$logP(\\theta|z^+, \\alpha) \\propto \\alpha log\\mathcal{L}(z^+|\\mu, \\\
    beta) + logIG($\\beta|a, b)$ \\n$+ logG($\\mu|\\mu_0, \\sigma_0^2)$) (6.22)\n\
    ```\n\nIn the equation above, the log-likelihood is simplified as below,"
