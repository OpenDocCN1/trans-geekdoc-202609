    # 3.6.2 Radial basis function neural network


    The radial basis function neural network algorithm (RBFNN) is an extension of
    the kernel density estimation approach to the classification problems. The kernel
    density estimation approach is an unsupervised machine learning approach, which
    does not involve class labels and is only working on one set of experimental data,
    which is normally the genotype data when analyse biological/medical data. When
    there are two experimental data (one is the genotype data X and the other is the
    phenotype data y), the kernel density estimation approach can be extended to a
    classification analysis problem to generate a map X to y. This extension is called
    RBFNN and the basis function of RBFNN adopts a bell-shaped density distribution
    such as the Gaussian function.


    Suppose there are N data points. A general format of a basis function method is
    defined as below, where x is a data point for estimating its density, x_n is the
    nth data points with known class information, ϑ is the smoothing parameter and
    f(x) is the estimated density for x.


    ```

    f(x) = \frac{1}{N} \sum_{n=1}^{N} p(x|x_n, \vartheta) \quad (3.37)

    ```


    The earlier application of RBFNN is for nonlinear function approximation [Powell,
    1977; Broomhead and Lowe, 1988]. Suppose there are K basis functions. The output
    of a RBFNN is defined as below,'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Protease Cleavage Pattern Discovery


    ```

    $$\hat{Y} = \sum_{n=1}^{K} w_n \mathcal{G}(\mathbf{x}|\mathbf{x}_n, \vartheta_n)
    = \mathbf{G}^t\mathbf{w}$ $(3.38)$

    ```


    where $\mathbf{x}_n \in \mathbb{R}^d$ is the $n^{th}$ basis function, $\mathbf{x}$
    has the same dimension as $\mathbf{x}_n$, i.e., $\mathbf{x} \in \mathbb{R}^d$,
    and $w_n$ are the $n^{th}$ smoothing parameter and weighting parameter, $\mathcal{G}(\cdot)$
    is the basis (normally Gaussian) function, and $\hat{y}$ is the model output or
    prediction for $\mathbf{x}$. This transformation maps any $d$-dimensional data
    space $(\mathbf{x,x}_n \in \mathbb{R}^d)$ to a $K$-dimensional kernel space. It
    is assumed that this $K$-dimensional kernel space has a linearity property, i.e.,
    a linear relationship between a dependent variable or phenotype variable (y) and
    the features or the basis function $(\mathcal{G}(\cdot))$.


    To establish a RBFNN model, the likelihood function is commonly used as an objective
    function for classification problems. Suppose the sigmoid is used by RBFNN for
    the output transformation based on the following definition, where the sigmoid
    output is treated as a probability,


    ```

    $p(\mathbf{x}_n) = \frac{1}{1 + \exp(-\hat{y}_n)}$ $(3.39)$

    ```


    The likelihood function for $N$ data points is defined as below using the Bernoulli
    function [Uspensky, 1937]


    ```

    $$\mathcal{L} = \prod_{n=1}^{N} P(\mathbf{x}_n|y_n) = \prod_{n=1}^{N} p(\mathbf{x}_n)^{y_n}(1
    - p(\mathbf{x}_n))^{1-y_n}$ $(3.40)$

    ```


    For a regression analysis problem, an error function shown below is commonly used,


    ```

    $$\varepsilon = \frac{1}{N} \sum_{n=1}^{N} (y_n - \hat{y}_n)^2$ $(3.41)$

    ```


    RBFNN has a wide application in many areas including biological/medical pattern
    analysis. For instance, RBFNN has been used to examine how pear rootstocks tissue
    culture media is formed [Jamshidi et al., 2019] and to remove tomography ring
    artifacts [Chao and Kim, 2019].'
