  md: "In the second step, a tree is pruned if it does not generate a significantly\
    \ better prediction performance compared to a simpler (smaller) tree. Note that\
    \ when a tree pruning process is completed, a leaf node may not be pure for one\
    \ class of data points. In this case, a probability that data points belonging\
    \ to one class in the corresponding subspace is calculated for the leaf node.\
    \ For instance, if $m < n$ of data points belong to the class $A$ in the corresponding\
    \ subspace denoted by a leaf, the probability of the class $A$ is commonly denoted\
    \ $m/n$ and the probability of the class $B$ is commonly denoted by $(n-m)/n$\
    \ for the leaf.\n\nA pruning select may produce multiple simpler trees. Therefore,\
    \ an optimal tree is selected among multiple pruned trees for the optimal generalisation\
    \ capability in the last step of CART.\n\nUsing a constructed CART tree or model\
    \ for making predictions on novel data or interpreting the decision-making process\
    \ using the model will scan a tree from its root node gradually downwards to a\
    \ leaf. The root node examines a variable's value against a threshold to determine\
    \ where to move, i.e., to its left branch or its right branch. The same examination\
    \ applies to all the following nodes of a tree until reaching a leaf. When a leaf\
    \ is reached, the prediction is made through maximising two probabilities, i.e.,\
