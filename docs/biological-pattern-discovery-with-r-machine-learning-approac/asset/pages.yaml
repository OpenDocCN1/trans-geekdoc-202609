    \ $\\theta = \\beta$ is called a slop parameter and $\\delta = -\beta/\\alpha$\
    \ is called a threshold parameter\n\n```\n$p(x) = \\frac{1}{1+e^{-\\theta(x-\\\
    delta)}} \\quad (3.21)$\n```\n\nFigure 3.9 shows some logistic function with different\
    \ parameter values. When $\\theta=1$ and $\\delta=0$, the logistic function is\
    \ degenerated to the sigmoid function, which has been widely used in neural network\
