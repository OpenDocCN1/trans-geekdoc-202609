    # 2.4.1 The data


    The transposon sequencing technology can insert a transposon into a genome millions
    of times, generating millions of mutants. A mutant represents an insertion site
    in a gene because such an insertion site may disrupt the function of the gene.
    If the function of a gene is not disrupted'
