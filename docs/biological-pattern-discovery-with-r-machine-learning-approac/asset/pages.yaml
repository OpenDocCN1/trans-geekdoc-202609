    # 3.2.4 Making decision using the Bayes rule for a LDA model


    Decisions can be made to classify data points into two classes by comparing the
    LDA predictions (projections) against a threshold so that the LDA predictions
    are converted to the predicted class labels which are binary. To be able to deliver
    a robust decision making system, the Bayes rule has been used in the LDA algorithm
    and many other discrimination analysis algorithms.


    Suppose a data point belongs to either the class $A$ or the class $B$. The density
    functions ($f_A$ and $f_B$) have been built up for both classes of the model outputs
    $(\hat{y}_A$ and $\hat{y}_B$). Using the Bayes rule for decision-making for'
