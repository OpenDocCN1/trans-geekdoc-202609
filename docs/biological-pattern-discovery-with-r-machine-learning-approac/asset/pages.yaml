    Based on the definition, $b_i + w$ defines a homogeneous upper-bound of noise
    above a baseline. Because of this, the noise from both sides of a baseline will
    be finally removed during a baseline estimation process for discovering peaks.
    Therefore, the likelihood of false signals can be minimised.


    BWH has introduced an indicator for the peaks. If a wave number (a spectra analyser
    value) does not correspond to a peak, a unit value is assigned, otherwise a zero
    is assigned. The definition of this indicator is for incorporating peak information
    into a baseline estimation process. The indicator is defined as below,


