    # 2.2.4 The semi-parametric approach


    Both the parametric approaches and the non-parametric approaches enjoy their advantages
    when estimating a density for a data set. However they still have some limitations.
    The inflexibility of the parametric approaches and the space costing problem of
    the non-parametric approaches lead to the consideration of the semi-parametric
    approaches for density estimation. The semi-parametric approaches estimate a density
    function for a data set by assuming that a data set is drawn from a mixture of
    the finite number of components, which have the similar function as the kernels
    used in the kernel density estimation approach. Each component can be a single
    Gaussian distribution or a single Gamma distribution or [Olkin and Spiegelman,
    1987; Duda, et al., 2000]. The number of components in a mixture is pre-defined
    or can be optimised using a statistic metric.


    # 2.2.4.1 The Gaussian mixture


    Below shows the Gaussian mixture of $K$ components, where $\mu_k.\sigma_k^2$,
    and $w_k$ stand for the mean, the variance and the mixing coefficient (weight)
    of the $k^{th}$ component, respectively,


    ```

    $f(x_i) = \sum_{k=1}^{K} w_k \mathcal{G}(x_i|\mu_k, \sigma_k^2)$ (2.9)

    ```


    The log-likelihood function of such a model is defined as below, where $\beta_k
    = \sigma_k^{-2}$,


    ```

    $log L \propto \sum_{i=1}^{N} \sum_{k=1}^{K} w_k \sqrt{\beta_k} \exp\left(-\frac{\beta_k}{2}(x_i
    - \mu_k)^2\right)$ (2.10)

    ```


    The maximum likelihood method is normally used to estimate the model parameters
    for a Gaussian mixture model. The following equations are used to estimate $\mu_k,
    \beta_k$, and $w_k$, respectively,'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Responsive Gene Discovery


    ```

    $$\mu_k = \frac{\sum_{i=1}^N f(k|x_i)x_i}{\sum_{i=1}^N f(k|x_i)}$$

    $\beta_k^1 = \frac{\sum_{i=1}^N f(k|x_i)(x_i - \mu_k)^2}{\sum_{i=1}^N f(k|x_i)}$$

    $$w_k = \frac{1}{N}\sum_{i=1}^N f(k|x_i)$$\quad (2.11)

    ```


    In the above equations, $f(k|x_i)$ is defined as below,


    ```

    $$f(k|x_i) = w_k \frac{\mathcal{G}(x_i|\mu_k,\sigma_k^2)}{f(x_i)}$$\quad (2.12)

    ```


    The major difference between the non-parametric (kernel) approach and the semi-parametric
    approach is the number of kernels or components. Each data point is perhaps used
    as a kernel in a kernel-based density estimation model. Sometimes, a subset of
    data points is employed as the kernels in a kernel-based density estimation model.
    All kernels of a kernel-based model normally employ an identical variance, i.e.,
    $\sigma_1^2 = \sigma_2^2 = \dots = \sigma_M^2 = \sigma^2$ supposing $M$ kernels
    are employed in a model. In a semi-parametric model, the number of components
    is much smaller than the number of kernels. Moreover, the components of a semi-parametric
    model have different variances, i.e., $\sigma_1^2 \neq \sigma_2^2 \neq \dots \neq
    \sigma_M^2$ if $M$ components are employed.


    Figure 2.13 shows a comparison between a kernel-based model and a semi-parametric
    model for a data set. A kernel-based model constructed for this set is shown in
    Figure 2.13(a), in which a random sample of 20 data points were used as the kernels.
    A semi-parametric model constructed for the same data set is shown in Figure 2.13(b),
    in which two Gaussian components were used. Although two density estimators result
    in a similar density function, their basic principles are different and their
    computational costs are different as well. A kernel-based model is less costing
    when it is constructed, but is costing when it is used for the inference on new
    data. A semi-parametric model requires more time to construct, but it is computationally
    cheap when it is used for the inference on new data.'
