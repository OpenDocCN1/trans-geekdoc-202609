  md: '# Introduction


    hundreds or thousands of known sequences. BLAST is such an algorithm. However,
    no matter how fast a homology algorithm is, the speed is still the bottleneck
    to the requirement of the fast sequence comparison. Therefore, some more advanced
    sequence comparison algorithms were developed more than a decade ago, i.e., comparing
    sequences based on the sequence statistics such as the word library or the k-mer
    library (Gao and Qi, 2007; Sims, et al., 2009; Wang, et al., 2009; Sims, and Kim,
    2011; Kolekar, et al., 2012; Hatje and Kollmar, 2012; Leimeister, et al., 2014).
    This type of algorithms is named as the alignment-free sequence comparison approaches
    and has played a very important role in many modern whole-genome pattern discovery
    projects.


    In addition, the quantum computing technique has also been considered for sequence
    homology alignment [Huo, et al., 2008; Prousalis and Konofao, 2019] and whole-genome
    *de novo* sequence assembly [Sohn and Nam, 2018].


    # 1.6 The global optimisation pattern discovery problem


    Many machine learning algorithms are originally based on the Newton’s method which
    is also called the greatest descent method or the greedy search method. To estimate
    model parameters for a machine learning model, a numerical objective function,
    which is differentiable, needs to be established at first. The basic principle
    is to find a saddle point on the objective function curve. At the saddle point,
    the objection function is minimise. The most useful method of detecting a saddle
    point within an objective curve is based on the derivative function of the objective
    function. This is why an objective function must be differentiable. A saddle point
    is always residing at the point in which the first derivative function is zero
    and the objective function value at a saddle point is minimised.


    To search for a saddle point within an objective function curve to estimate the
    parameters for a complicated model is called the Newton’s method [Fletcher, 1987;
    Nocedal and Wright, 1999]. With this method, no matter where the initial point
    is, the method will lead the move to a saddle point of the objective function
    curve quickly and efficiently. The parameters of a model which have been mapped
    to a saddle point are called'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'optimised parameters. But, this is true only if an objective function curve
    has a unique saddle point.


    If an objective function curve is complex with more than one saddle point, the
    problem becomes complex. This is because it is impossible to guarantee that all
    the saddle points have the same minimum objective value. In addition, the Newton''s
    method can only guarantee an optimisation process to reach one saddle point based
    on one initial point on an objective function curve. Therefore, one initial point
    leads to one multiple saddle points using the Newton''s method. Whenever one saddle
    point has been reached, the Newton''s optimisation process will never be able
    to move out from the saddle point even if this saddle point does not correspond
    to the minimum objective function value.


    Therefore, the evolutionary computation techniques or algorithms have been considered
    for the optimisation problems where a problem requires a complex objective function
    with multiple saddle points [Fogel, et al., 1966; Holland, 1975; Goldberg, 1989].
    The basic principle of the evolutionary computation approaches is to start from
    multiple initial points in an objective function curve. Multiple models are constructed
    simultaneously using the Newton''s method or similar greatest descent methods
    from these multiple initial points. In an evolutionary computation model, a pool
    of candidates (or candidate solutions) is designed. Only those candidates with
    the best fitness measurements have the right to maintain the pool and have the
    right to breed new offspring, which are used to replace those who fail the designed
    criterion. Through this kind of evolution process, an optimal candidate or solution
    to a system can be discovered finally. The evolutionary computation approaches
    have been widely used in many biological/medical research projects with success
    [Fogel, 2008; Francois and Siggia, 2008; Rostain, et al., 2015; An, et al., 2020;
    Ereemev and Spirov, 2021].


