    lambda$ is the median of both $\\mathbf{x}$ and $\\mathbf{y}$. The calculation\
    \ of the $r^{th}$ percentile is irrelevant to both of outliers. When the outlier\
    \ number is small, the difference between $q_r(\\mathbf{y})$ and $\\lambda$ is\
    \ small. However, when the outlier number is large, the difference between $q_r(\\\
    mathbf{y})$ and $\\lambda$ is large. The $r^{th}$ percentile also depends on the\
