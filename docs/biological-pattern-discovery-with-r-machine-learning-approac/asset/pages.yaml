  md: '# 7.2.4 The Smith-Waterman algorithm


    The Sellers algorithm and the Needledman-Wunsch algorithm were designed for the
    global pair-wise homology alignment. Using these algorithms, every residue of
    two sequences is used in an alignment. The local homology alignment only focuses
    on the segments which are the most similar to each other. The Smith-Waterman alignment
    algorithm is such a typical algorithm [Smith and Waterman, 1981].


    # 7.2.4.1 The alignment metric and moving directions


    The algorithm uses a uniform positive score for an exact match, which is one,
    a negative score for a mismatch, which is -0.3 and a length-dependent gap penalty,
    which is defined below with L denoting the number of continuous gaps or the length
    of a gap inserted into a sequence,


    $G_L = -1 - L/3$


    The moving directions are used from the top-left corner cell to the bottom-right
    corner cell as shown in Figure 7.3, where $s_{ij}$ is the alignment score between
    the $i^{th}$ residue of sequence $x$ and the $j^{th}$ residue of sequence $y$,
    $M_{ij}$ is the score of the previous optimised alignment till the cell $(i, j)$
    in the table. For the cell $(i, j)$, there can be three moving directions for
    an alignment. If no gap is inserted, a move is from the cell $(i-1, j-1)$ to the
    cell $(i, j)$ meaning both the $i^{th}$ residue of sequence $x$ and the $j^{th}$
    residue of sequence $y$ are used for a new incremental alignment. This is called
    the diagonal move in the table.


    ![](img/c3caa39b5c0f40fb2a44f2ab6e940f78_346_0.png)


    Fig.7.3. The moving directions for the Smith-Waterman update rule.


    If the $i^{th}$ residue of sequence $x$ is aligned with a gap, no residue from
    sequence $y$ will be picked up. This means that the $j^{th}$ residue of sequence
    $y$'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Whole Genome Pattern Discovery 333


    has been already aligned with a previous residue of sequence x. This is called
    the vertical move, i.e., moving from the cell (i-1, j), a downward cell to the
    cell (i, j). More than one cell is allowed meaning more one gap is allowed to
    be inserted for the cell (i, j). For instance, both the $i^{th}$ and $i-1^{th}$
    residues of sequence x are aligned with gaps, a vertical move is from cell (i-2,
    j) to cell (i, j).


    To align the $i^{th}$ residue of sequence y with a gap, no residue from sequence
    x is picked up. This means that the $i^{th}$ residue of sequence x is aligned
    with other residue of sequence y in previous alignment. This is the horizontal
    move, i.e., moving from the cell (i, j-1) on the left side to the cell (i, j).
    Similar to the vertical move mentioned above, the horizontal move can be done
    more than one cell. For instance, both the $j^{th}$ and $j-1^{th}$ residues of
    sequence y are aligned with gaps, a horizontal move is from the cell (i, j-2)
    to cell (i, j).


