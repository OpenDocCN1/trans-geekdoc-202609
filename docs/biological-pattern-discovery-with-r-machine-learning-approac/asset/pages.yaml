  md: '# Chapter 2


    # Responsive Gene Discovery


    A phenomenon change will usually occur in a species after an appropriate stress
    has been applied. What researchers want to know how an observed phenomenon change
    in a species is determined by or associated with some genetic function. It has
    been well-researched that it is the genetic function of a species that responds
    to a stress directly and leads to the observed phenomenon change. Rather than
    employing all of genetic elements, such as genes, a biological system only activates
    a small proportion of genes to respond to a stress. Moreover, different genes
    may have different strengths to respond to a stress. Filtering out non-responsive
    genes to discover responsive genes thus plays a key role in researching and investigating
    the mechanism by which a biology system responds to a stress. From this, interpreting,
    explaining and extrapolating the discovered mechanism can follow. No doubt, computational
    models are required to help discover these responsive genes through a research
    of the pattern by which a phenomenon change is associated with genetic functions.
    And the unique function of the computational models constructed by machine learning
    algorithms can never be ignored for this purpose. A task of responsive gene discovery
    normally has no'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Responsive Gene Discovery


    knowledge about how such a pattern is formed, and hence discovered. This therefore
    fits to one typical machine learning mechanism, i.e., unsupervised learning. This
    chapter will introduce several unsupervised machine learning algorithms such as
    density estimation and cluster analysis and demonstrate how these algorithms can
    be used for responsive gene discovery. A typical responsive gene discovery problem,
    i.e., the essential gene discovery problem, will be introduced and discussed in
    this chapter. How essential genes can be discovered using unsupervised machine
    learning algorithms will be demonstrated.


    # 2.1 A biological question — essential gene discovery


    In a genome, genes may play different roles for a cell or an organism to function,
    for instance for a bacteria to survive or grow under a specific condition. A gene
    that has such a function for a cell or an organism to function or survive is called
    an essential gene [Guecksohn-Waelsch, 1963]. If the function of such a gene is
    disrupted or disabled, the organism or the cell may not survive or replicate.
    Such a gene is also called a lethal gene in relationship with the bacterial growth.
    Discovering and characterising these genes is important because their products
    can be the targets for developing drugs to fight diseases [Rancati, et al., 2018;
    Bartha, et al., 2018].


    Using the transposon technology to discover essential genes has been exercised
    for many years. Theoretically, in a survived or a well-grown bacterial species,
    non-essential genes attract transpos insertions, but an essential gene will attract
    no transposon insertion. Therefore analysing the genome-wise transposon insertion
    pattern can rely on the selection against a mutant [Rubin, et al., 2015; Yang,
    et al., 2017]. Recently, analysing the genome-wise transposon insertion pattern
    to discover the essential genes for a species has been facilitated by the high-throughput
    transposon sequencing technology [Langridge, et al., 2009; Zomer, et al., 2012;
    Yang, et al., 2017]. The technology can map millions of transposon insertions,
    hence mutants, to a genome in one experiment. It thus makes it'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'possible to simultaneously identify a minimum set of essential genes that are
    refractory to mutagenesis without repeated tedious experiments.


    Although an essential gene should not attract any transpos insertion theoretically,
    a transpos may be found in an essential gene because of several reasons [Lamichhane,
    et al., 2003; Deng, et al., 2013; Fels, et al., 2013]. For instance, the essentially
    of a gene may not be disrupted if a transpos is inserted within the distal regions
    of a gene because the truncated gene product may still retain functionality. Often,
    the essentiality of a gene may still maintain if a transpos is inserted in only
    a few sites of a gene. In addition to these biological reasons, there are also
    two technical reasons by which it is required to examine the transpos insertion
    pattern genome-wise to avoid missed discovery of essential genes. First, the transpos
    sequencing technology is not yet 100% accurate to distribute a transpos to the
    locations where it should go without any bias. Second, aligning short transpos
    sequencing reads to a reference genome will not be free of error. The shorter
    the sequencing reads for an alignment, the greater the error will be. Therefore,
    a few insertions occurring in a gene may be caused by either error or errors aforementioned.


    Due to the aforementioned reasons, there have been three updated machine learning
    approaches for a robust gene essential pattern analysis based on the high-throughput
    transpos sequencing technology. First, a gene with a few insertion sites may be
    classified as an essential gene [Langridge, et al., 2009]. Second, a gene with
    a few insertions may also be classified as an essential gene [Zomer, et al., 2012].
    Third, a gene with the transpos insertions only in its distal regions may also
    be classified as an essential gene [Yang, et al., 2017].


    The density estimation approaches have been exercised for discovering essential
    genes for a long time. In the context of gene essentiality analysis, the basic
    principle of density estimation is to re-construct a density function, which is
    unknown in advance, for a transpos statistic such as the transpos insertions per
    gene statistic or the transpos insertion sites per gene statistic. A constructed
    density model is thus used for the interpretation and prediction. The assumption
    is that such a density function should show a bimodal distribution, in which a
    cutting point can be effectively determined to separate genes into two clusters.
    After a'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Responsive Gene Discovery


    division, one cluster is composed of genes with smaller transposon statistic values
    and the other cluster is composed of genes with greater transposon statistic values.
    The cluster of genes with smaller transposon statistic values is therefore treated
    as an essential gene cluster. Several density estimation algorithms have been
    developed for identifying essential genes based on some genome-wise transposon
    statistic [Langridge, *et al.*, 2009; Zomer, *et al.*, 2012; Yang, *et al.*, 2017].
    Different models for essential gene discovery are based on different assumptions
    of the nature of transposon insertion profile. TraDIS discovers essential genes
    through estimating a density function based on the transposon insertion sites
    per gene statistic [Langridge, *et al.*, 2009]. ESSENTIALS discovers essential
    genes through estimating a density function based on the transposon insertions
    per gene statistic [Zomer, *et al.*, 2012]. DEM (distinct effect model) discovers
    essential genes through estimating a density function based on the mutation feature
    statistic which is the convolution between the transposon insertions per gene
    and the transposon insertion sites per gene [Yang, *et al.*, 2017].


    In addition to density estimation, cluster analysis can also be considered when
    dealing with the problems for separating essential genes from non-essential genes,
    especially in the context of multivariate analysis.


    # 2.2 Density estimation


    Very often, the future inference is required based on the knowledge learned from
    collected experimental data through a pattern discovery and analysis process.
    Various density estimation approaches are such a process of re-constructing an
    unknown data distribution from which data are believed to be sampled or drawn
    [Silverman, 1986; Duda, *et al.*, 2000]. For instance, a mean value and a standard
    deviation can be estimated for a data set if the data set is assumed to be a sample
    drawn from a Gaussian distribution. After these two parameters have been well-estimated,
    a distribution model of the data set can be constructed and be used for the future
    inference for novel data.


    It should be noted that an estimated density based on a collected data set may
    have some deviation from the expectation. This is not a surprise because a drawn
    sample always has a much smaller size than a whole'
  merge: -1
  img_proc: true
- pgno: 30
