    a set of the cleaved peptides.


    Before starting the description of how to use GP to model factor X protease cleavage
    data, the first thing was how to quantify the similarity between residues, which
    were the amino acids, from two peptides. The idea of bio-basis function [Thomson
    and Yang, 2002; Thomson et al., 2003] was used to measure how a rule fit a data
    point (an amino acid). Suppose the $m^{th}$ residue of a peptide $x$ was denoted
    by $x_m$ and the $m^{th}$ residue in a GP rule was denoted by $r_m$. The fitness
    was defined as below, where $\pi()$ was the mutation probability between two acids
