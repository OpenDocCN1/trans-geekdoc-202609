    \ the code, you will see another “Out” section that displays the true result.\
    \ This way you can also test to see if the code gives you the result you expect.\n\
    \n## Chapter 2: Functions in Python\n\nIn Python programming, functions refer\
    \ to any group of related statements which perform a given activity. Functions\
    \ are used in breaking down programs into smaller and modular bits. In that sense,\
    \ functions are the key factors which make programs easier to manage and organize\
    \ as they grow bigger over time. Functions are also helpful in avoiding repetition\
    \ during coding and makes codes reusable.\n\n### The Syntax of Functions\n\nThe\
    \ syntax of functions refers to the rules which govern the combination of characters\
    \ that make up a function. These syntaxes include the following:\n\n1. The keyword\
    \ `def` highlights the beginning of every function header.\n2. A function named\
    \ `function_name` is to identify it distinctly. The rules of making functions\
    \ are the same as the rules which apply for writing identifiers in Python.\n3.\
    \ Parameters or arguments via which values are passed onto a function are optional\
    \ in Python.\n4. A colon sign (`:`) is used to highlight the end of every function\
    \ header.\n5. The optional documentation string is used to define the purpose\
    \ of the function.\n6. The body of a function is comprised of one or more valid\
    \ statements in Python. The statements must all have a similar indentation (typically\
    \ four spaces).\n7. An optional return statement is included for returning a value\
    \ from a function.\n\nBelow is a representation of the essential components of\
    \ a function as described in the syntax:\n\n```python\ndef function_name(parameters):\n\
    \    '''docstring'''\n    statement(s)\n```\n\n### How functions are called in\
    \ Python\n\nOnce a function has been defined in Python, it is capable of being\
    \ called from another function, a program, or the python prompt even. Calling\
    \ a function is done by entering a function name with a proper parameter.\n\n\
    #### 1. Docstring\n\nThe docstring is the first string which comes after the function\
    \ header. The docstring is short for documentation string and is used in explaining\
    \ what a function does briefly. Although it is optional part of a function, the\
    \ documentation process is a good practice in programming. So, unless you have\
    \ got an excellent memory which can recall what you had for breakfast on your\
    \ first birthday, you should document your code at all times.\n\nIn the example\
    \ shown below, the docstring is used directly beneath the function header:\n\n\
    ```python\n>>> greet(“Amos”)\nHello, Amos. Good morning!\n```\n\nTriple quotation\
    \ marks are typically used when writing docstrings so they can extend to several\
    \ lines. Such a string is inputted as the `__doc__` attribute of the function.\
    \ Take the example below. You can run the following lines of code in a Python\
    \ shell and see what it outputs:\n\n```python\n>>> print(greet.__doc__)\nThis\
    \ function greets to the person passed into the name parameter\n```\n\n#### 2.\
    \ The return statement\n\nThe purpose of the return statement is to go back to\
    \ the location from which it was called after exiting a function.\n\n**Syntax\
    \ of return:** This statement is able to hold expressions which have been evaluated\
    \ and have their values returned. A function will return the `None` object if\
    \ the statement is without an expression, or its return statement is itself absent\
    \ in the function. For instance:\n\n```python\n>>> print(greet('Amos'))\nHello,\
    \ Amos. Good morning!\nNone\n```\n\nIn this case, the returned value is `None`.\n"
