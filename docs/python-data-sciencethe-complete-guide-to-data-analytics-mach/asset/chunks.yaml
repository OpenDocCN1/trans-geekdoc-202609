    # 第 7 章：概率 – 基础 – 统计 – 数据类型


    在知识表示与推理（`KR&R`）中，事情非常直观。排除怀疑的话，公式化和表示命题很容易的。问题在于，当不确定性显现时，问题就开始出现——例如，设计用于取代医生的专家系统。在诊断患者时，医生并不拥有关于治疗患者的正式知识，也没有基于症状的官方规则。在这种情况下，为了确定患者是否患有特定疾病及其治疗方法，专家系统将使用概率来制定最高概率的机会。


    ## 日生活中的概率示例


    作为一个数学术语，概率是指事件发生的可能性，例如从装有各种颜色的袋中取出一个绿色的碎片，或者从扑牌中抽出一张王。在所有的日常决策过程中，即使你对结果一无所知，也会使用概率。虽然你可能认为最佳行动方案是使用主观概率做出判断，但有时你并不执行实际的概率计算。


    ### 围绕天气进行组织

    你可以根据天气制定计划，因为你几乎每天都会使用概率。对于气象学家来说，预测天气状况是不可能的，因此为了建立下雪、冰雹或降雨的可能性，他们利用仪器和工具。例如，在相同的天气条件下，100
    天中有 60 天会下雨，那么降雨的概率就是 60%。直觉上，与其带伞上班或穿拖鞋，也许穿包头鞋是更首选的装扮。此外，气象学家不仅分析该周或当天的可能的天气模式，还通过他们的历史数据库来计算近似的最高温度和最低温度。


    ### 运动中的策略

    对于比赛和游戏，概率是教练和运动员用来影响运动最佳策略的工具。在将任何球员列入阵容时，棒球教练会评估该球员的击球率。例如，在每十次击球中，如果球员的击球率为
    200，运动员可能会获得两次安打。如果该球员的击球率为 400，那么每十次击球中获得四次击中的概率更高。另一个例子是：一个高中橄榄球踢球员在一个赛季中从 40
    码外的 15 次射门尝试中进了 9 个，那么他下一次在相同位置的射门可能大约是 60%。我们可以有这样的方程：


    ```

    9/15 = 0.60 或 60%

    ```


    ### 保险方案

    对于最适合你家庭甚至你自己的计划以及所需的免赔额，概率在分析保险保单方面起着至关重要的作用。例如，在选择车险政策时，你利用概率来了解你需要报案的可能性有多大。你可能不仅考虑责任险，还考虑汽车综合险，因为过去一年中，每
    100 名司机中有 12%（即你社区的 12 人）曾撞到鹿。此外，如果发生与撞鹿相关的事件花费了$2,800，为了不至于陷入无法负担某些费用的境地，你可能会考虑降低汽车维修的免赔额。


    ### 娱乐和游戏活动

    当你参与视频游戏、纸牌游戏或涉及机会或运气的棋盘游戏时，概率就是你使用的工具。你权衡的是视频游戏中隐藏导弹的概率，或者在扑克中获得所需牌牌的几率。此外，你愿意承担的风险程度的确定取决于获得那些筹码或牌牌的可能性。例如，正如
    Wolfram Math World 所建议，在扑克牌中获得三张同类牌的几率是 `46.3-to-1`，大约是 2%的机会。然而，你有大约 42%或`1.4-to-1`的几率会拿到对子。正是通过概率的帮助，你会在评估赌注大同时，决定你意图游戏的方式。


    ## 统计学


    现代科学的基础是概率陈述和统计学显著性。在一个例子，根据研究，吸烟者患肺癌的概率是非吸烟者的 20 倍。在另一项研究中，未来 200,000 年地球发生灾难性陨石撞击的可能性。此外，与第二个男孩子相比，头胎男孩子的智商测试得分高出
    2.82 分。但是，为什么科学家要用含糊的表达方式说话呢？为什么他们不直接说肺癌是吸烟的结果？而且如果为了逃避外星灾难需要在月球上建立殖民地，他们本可以告知人们。


    这些近期分析的逻辑是对数据的准确反映。在科学数据中，得出绝对结论并不常见。某些烟民如果戒烟可以降低患肺癌风险，而有些烟民从未患上肺癌以外的疾病；是心血管疾病导致了一些烟民过早死亡。作为允许科学家对他们的数据做出更准确陈述的形式，统计的功能是量化变异性，因为所有数据都表现出变异性。认为统计提供的证据是某些错误的可能是常见的误解。然而，统计学并没有这种特征。相反，为了观察特定结果，它们提供了一种概率的衡量标准。科学家可以通过统计技术为概率赋值，从“某人吸烟可能更容易患肺癌”的陈述转变为报告，指出吸烟者患肺癌的概率几乎是非吸烟者的
    20 倍。


    ### 数据中的统计


    由于科学家只能对特定数据类型使用统计技术，因此数据类型是一个核心概念。如果你继续以不同于预期的方式分析数据，可能会得出错误的分析。因此，当你拥有数据时，你将具备选择正确研究技术的能力。数据分析分为两部分：推断性和描述性统计：


    #### 描述性统计：

    通过使用`平均值`、`中位数`和`标准差`等测量量对数据进行描述，这允许科学家在广泛的背景内总结数据。例如，在 1959 年开始的死亡率研究中，描述性统计为了进行精确的可视化过程，对变量进行分类。在其他变量中，研究者提供了参与者的年龄报告，以便他们进行比较。美国的人口年龄从
    30 岁到 52 岁之间，这是描述性统计。此外，在 1960 年，女性的人口比例为 57%，黑人和白人占比约为 97%。


    #### 推断统计：

    当科学家想要对数据做出推断时，使用较小样本的数据来发现变量之间的模式，这就是推断统计。从统计学的角度来看，`总体`一词可能与集合不同，推断统计用于做出假设。例如，癌症研究`I`和`II`分析了`250,000`名士兵的测试得分。根据他们的研究，头胎男孩子的智商测试得分比第二胎男孩子高出`2.82`分，置信度为
    95%。数据中的重要概念是`统计显著性`，大多数人误解了它。类似情况下，当人们认为结果是重要的时，会假设。然而，概率的估计是观测差异。此外，因为没有实际联系，概率的估计是观测差异。


    ---


    ## 数据类型


    为了进行探索性数据分析（`EDA`），你需要对测量尺度有清晰的理解，因为特定的数据类型与个体测量值相关。现在，让我们深入研究变量的主要类型及其示例，我们可能将它们称为测量尺度。


    ### 分类数据

    特征是分类数据的表示。因此，它代表如语言、性别等事物。此外，数值值与分类数据相关，例如女性为`0`，男性为`1`。注意这些数字没有数学意义。


    ### 命名数据

    单位是命名值的表示，它们用于在没有任何定量值的情况下标记变量。它们是标签。重要的是，命名数据没有顺序。因此，即使你改进值的顺序，意义也不会改变。例如，在询问性别时，顺序没有价值。


    ### 序数数据

    有序且离散的单位是序值的表示。除了顺序的重要性，序数数据与命名数据相似。例如，在询问教育背景时，顺序是小学、本科和研究生。这里是序数数据的局局限性：很难知道值之间的差异。由于这种局限性，他们使用标尺来衡量非数值特征，如客户满意度、幸福等。


    #### 数值数据

    当值是分离且独特的时，我们指的是离散数据。换句话说，当数据可以取特定值时，我们说它是离散数据。这种数据是可以计数的，但我们无法测量它。分类是信息表示的类别。一个完美的例子是
    100 次抛硬币中正面的次数。要判断你处理的是否离散数据，尝试问以下问题：你可以将其分成更小的部分吗？或者你可以计算它吗？


    #### 连续数据

    测量是连续数据的表示，因此你只能测量它们，但不能计算它们的值。例如，通过实数线上的区间，你可以描述某人的身高。


    #### 间距数据

    具有相同差异的有序单位值的表示。因此，在一个包含有序数值的变量中，如果我们知道值之间的实际差异，那就是间距数据。例如，包含某地温度的特征可能具有`-10`、`-5`、`0`、`+5`、`+10`和`+15`度的温度。间距值有一个缺陷，因为它们没有`真正的零`。这意味着在例子中，不存在所谓的温度。在间距数据上进行加减法是可能的。但它们没有为比率的除法、计算或乘法留出空间。


    #### 比例数据

    同样，具有相同差异的比例值是有序单位。比例值具有绝对零，这与间距值相同。例如，重量、长度、身高等。


    ## 数据类型的重要性


    由于科学家只能对特定数据类型使用统计技术，因此数据类型是一个基本概念。如果你继续以不同于预期的方式分析数据，可能会得出错误的分析。因此，当你拥有数据时，你将能够选择正确的研究方法。这是数据分析中统计学部分，本章将讨论统计方法。


    ## 统计方法


    ### 命名数据

    处理命名数据通过以下方式收集信息：

    - **频率**：在数据或样本中，统计每个类别出现的次数。

    - **比例**：将频率除以样本总数。

    - **百分比**。

    为了将命名数据转换为数值，可以使用独热编码（one-hot encoding）。


    ### 序数数据

    处理序数数据通过以下方式收集信息：

    - **频率**：在数据或样本中，统计每个类别出现的次数。

    - **比例**：将频率除以样本总数。

    - **百分比**。

    为了对序数数据进行可视化，可以使用条形图或饼图。


    ### 连续数据

    处理连续数据通过以下方式收集信息：

    - **频率**：在数据或样本中，统计每个类别出现的次数。

    - **比例**：将频率除以样本总数。

    - **百分比**。

    为了对连续数据进行可视化，可以使用直方图、箱线图或散点图。


