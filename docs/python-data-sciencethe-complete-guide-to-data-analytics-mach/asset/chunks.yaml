    # 第 4 章：数据结构与 A* 算法


    在本章中，你将学习如何使用已经掌握的 Python 数据类型创建抽象数据结构。抽象数据结构允许你的程序以直观的方式处理数据，并遵循“不要重复自己”（DRY）原则。也就是说，使用更少的代码，而不是为每种情况重复输入相同的操作。在学习所给出的示例时，你将开始注意到一种模式的出现：使用互补的类，其中一个类作为节点，另一个作为节点的容器。在计算机科学中，使用节点的数据结构通常被称为树。有许多不同类型的树，每种树都有专门的用例。如果你对编程或计算机科学感兴趣，可能已经听过二叉树了。一种可能的树类型被称为
    n 叉树，或 n 维树。与二叉树不同，n 叉树包含具有任意数量节点的节点。子节点只是另一个节点的实例，它连接到另一个节点（有时称为父节点）。父节点必须有某种机制来连接到子节点。实现此最简单的方法是使用对象列表。


    ## 示例代码 #1：模拟文件系统


    n 叉树的一个自然应用是传统的 Windows 或 UNIX 文件系统。节点可以是文件夹、目录或单独的文件。为了保持简单，以下程序假设一个单一目录作为树的根。


    ### ch1a.py


    `FileSystem`充充树，而 `Node` 类承担了大部分工作，这在树数据结构中很常见。同时注意 `FileSystem` 会跟踪每个节点的单独 ID。ID
    可以作为量化文件系统中节点数量的方法，或提供查找功能。涉及到树时，最繁重的任务通常是编写遍历的解决方案。树的通常结构是以单个节点作为根，从该节点节点可以访问树的其他部分。在这里，`look_up_parent`
    函数使用循环来遍历模拟目录结构，但它也可以轻松地适配为递归解决方案。程序的通用用法如下：初始化 `FileSystem` 类，使用目录语法声明 `Node`
    对象（在这种情况下使用反斜杠 `\` 以便 Python 不将其误认为是转义字符），然后对它们调用 `add` 方法。


    ## 示例代码 #2：二叉搜索树 (BST)


    二叉搜索树之得名源于一个节点最多包含两个子节点。虽然这听起来像是一个限制，但实际上是一个很好的限制，因为树的遍历变得非常直观。相比之下，n 叉树可能会变得混乱。


    ### ch1b.py


    与之前一样，`Node` 类承担了大部分工作。此程序主要使用 `BST` 对数字列表进行排序，但可以推广到排序任何数据类型。还有许多辅助方法用于查找树的大小以及哪些节点没有子节点（叶节点）。这种树的实现更好地说明了递归在遍历树时的作用，即在每个节点处调用一个方法（例如
    `insert`）并创建一个链，直到达到基准情况。


    ## 示例代码 #3：A* 算法


    A* 星搜索算法被认为是“带有大脑”的 Dijkstra 算法。Dijkstra 几乎是近乎穷力地搜索直到找到路径为止，而 A* 使用了所谓的“启发式”（heuristic），这是对“有经验的猜测”的一种高级说法。A*
    之所以快，因为它能够指向目标（使用启发式）并找到该路径上的步骤。首先，这里是对该算法的简要说明。为了简化问题，我们将使用仅限正交移动的正方形网格（不包含对角线）。A*
    的目标是找到 A 点到 B 点之间的最短路径。也就是说，我们知道 B 点的位置。这将是终点节点，A 是起点。为了从 A 到达 B，算法必须计算 A 和 B
    之间节点的距离，使得每个节点都靠近 B 或被丢弃。编写此程序的简单方法是使用堆或优先级队列，并使用某种距离衡量进行排序。在第一个节点添加到堆后，将评估每个相邻节点的距离，并将离
    B 最近的一个加入堆。该过程重复直到节点等于 B。


    ### ch1c.py


    在这种情况下，启发式被称为曼顿距离，即当前节点与目标之间的绝对值。`heapq` 库用于创建一个以 `f` 为优先级的优先级队列。注意 `backtrace`
    函数只是在遍历每个只有一个父节点的节点树。你可以将 `g` 变量理解为从起点移动到路径某处的成本。由于我们使用的是移动成本没有变化的网格，`g` 可以是常数。`h`
    变量是当前节点与目标之间的估计距离。将这两个值相加得到 `f` 变量，它控制了路径上节点的顺序。


