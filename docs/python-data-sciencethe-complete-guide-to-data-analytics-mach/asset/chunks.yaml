    ## 引言

    数据科学可能是一个较新的跨学科领域，但其组成部分早已由数学家和 IT 专业人员研究了数十年。其中一些核心元素包括机器学习、图分析、线性代数、计算语言学等。由于数学、数据通信和软件工程这种看似疯狂的结合，数据科学领域具有极高的通用性。请记住，并非所有数据科学家都是一样的。每个人都根据自己的能力和专业领域进行分工。考虑到这一点，你可能会想，对于任何想要成为数据科学家的人来说，最重要或强大的工具是什么。本书将重点关注
    `Python` 的使用，因为该工具在数据科学家社区中广受青睐，而且很容易上手。这是一种多功能的编程语言，用于广泛的技术领域，包括软件开发和生产。它强大、易于理解，并且可以处理任何大小或复杂的程序。`Python`
    起于 1991 年，与蛇无关。一个有趣的事实是，这种深受初学者和专业人士喜爱的编程语言之所以命名，是因为它的创建者是蒙提派剧团（Monty Python，一个英国喜剧小组）的忠实粉丝。如果你也是他们的粉丝，你可能会在代码以及语言文档中注意到对他们的多次引用。琐事就到此为止——我们将关注
    `Python`，是因为它能够进行快速实验并部署科学应用。以下是解释为什么 `Python` 是学习数据科学的优选方案的其他核心特性：


    - **集成性**：`Python` 可以集成许多其他工具，甚至是用其他编程语言编写的代码。它可以作为一种统一的力量，将算法、数据策略和语言结合在一起。

    - **通用性**：你是一个从未学过任何编程语言（无论是过程化的还是面向对象的）的完全初学者吗？没问题，许多人认为 `Python` 是初任数据科学家掌握编程概念的最佳工具。你一旦学完基础知识就可以开始编码！

    - **强大性**：`Python` 提供了数据分析及更多需求所需的所有工具。越来越多的包和外部工具可以导入到 `Python` 中以扩展其可用性。可能性真的是无限的，这也是这种编程语言在包括数据科学在内的各种技术领域如此受欢迎的原因之一。

    - **跨平台兼容性**：无论在什么平台，移植性都不是问题。用 `Python` 编写的程序和工具可以在 Windows、Mac 以及 Linux 及其许多发行版上运行。


    `Python` 是一个全才，大师。它易于学习、功能强大，并且易于与其他任何工具和语言集成，这就是为什么我们在讨论数据科学及其许多方面时会重点关注它。现在，让我们从安装
    `Python` 开始吧。


