    # Chapter 10: Linear Regression


    The easiest and most basic machine learning algorithm is linear regression. It
    will be the first one that we are going to look at and it is a supervised learning
    algorithm. That means that we need both – inputs and outputs – to train the model.


    ## Mathematical Explanation


    Before we get into the coding, let us talk about the mathematics behind this algorithm.
    In the figure above, you see a lot of different points, which all have an x-value
    and a y-value. The x-value is called the `feature`, whereas the y-value is our
    `label`. The `label` is the result for our `feature`. Our linear regression model
    is represented by the blue line that goes straight through our data. It is placed
    so that it is as close as possible to all points at the same time. So we “trained”
    the line to fit the existing points or the existing data.


    The idea is now to take a new x-value without knowing the corresponding y-value.
    We then look at the line and find the resulting y-value there, which the model
    predicts for us. However, since this line is quite generalized, we will get a
    relatively inaccurate result. However, one must also mention that linear models
    only really develop their effectiveness when we are dealing with numerous features
    (i.e. higher dimensions). If we are applying this model to data of schools and
    we try to find a relation between missing hours, learning time and the resulting
    grade, we will probably get a less accurate result than by including 30 parameters.
    Logically, however, we then no longer have a straight line or flat surface but
    a hyperplane. This is the equivalent to a straight line, in higher dimensions.


    ## Preparing Data


    Our data is now fully loaded and selected. However, in order to use it as training
    and testing data for our model, we have to reformat them. The `sklearn` models
    do not accept `Pandas` data frames, but only `NumPy` arrays. That''s why we turn
    our features into an `x-array` and our label into a `y-array`.


    ```python

    X = np.array(data.drop([''prediction''], 1 ))

    Y = np.array(data[''prediction''])

    ```


    The method `np.array` converts the selected columns into an array. The `drop`
    function returns the data frame without the specified column. Our `X` array now
    contains all of our columns, except for the final grade. The final grade is in
    the `Y` array. In order to train and test our model, we have to split our available
    data. The first part is used to get the hyperplane to fit our data as well as
    possible. The second part then checks the accuracy of the prediction, with previously
    unknown data.


    ```python

    X_train, X_test, Y_train, Y_test = train_test_split(X, Y, test_size = 0.1 )

    ```


    With the function `train_test_split`, we divide our `X` and `Y` arrays into four
    arrays. The order must be exactly as shown here. The `test_size` parameter specifies
    what percentage of records to use for testing. In this case, it is 10%. This is
    also a good and recommended value. We do this to test how accurate it is with
    data that our model has never seen before.


    ## Training and Testing


    Now we can start training and testing our model. For that, we first define our
    model.


    ```python

    model = LinearRegression()

    model.fit(X_train, Y_train)

    ```


    By using the constructor of the `LinearRegression` class, we create our model.
    We then use the `fit` function and pass our training data. Now our model is already
    trained. It has now adjusted its hyperplane so that it fits all of our values.
    In order to test how well our model performs, we can use the `score` method and
    pass our testing data.


    ```python

    accuracy = model.score(X_test, Y_test)

    print (accuracy)

    ```


    Since the splitting of training and test data is always random, we will have slightly
    different results on each run. An average result could look like this: 0.9130676521162756.
    Actually, 91 percent is a pretty high and good accuracy. Now that we know that
    our model is somewhat reliable, we can enter new data and predict the final grade.


    ```python

    X_new = np.array([[18 , 1 , 3 , 40 , 15 , 16]])

    Y_new = model.predict(X_new)

    print (Y_new)

    ```


    Here we define a new `NumPy` array with values for our features in the right order.
    Then we use the `predict` method, to calculate the likely final grade for our
    inputs. [17.12142363]. In this case, the final grade would probably be 17.


    ## Visualizing Correlations


    Since we are dealing with high dimensions here, we can’t draw a graph of our model.
    This is only possible in two or three dimensions. However, what we can visualize
    are relationships between individual features.


    ```python

    plt.scatter(data[''studytime''], data[''G3''])

    plt.title( "Correlation")

    plt.xlabel( "Study Time")

    plt.ylabel( "Final Grade")

    plt.show()

    ```


    Here we draw a scatter plot with the function `scatter`, which shows the relationship
    between the learning time and the final grade. In this case, we see that the relationship
    is not really strong. The data is very diverse and you cannot see a clear pattern.


    ```python

    plt.scatter(data[''G2''], data[''G3''])

    plt.title( "Correlation")

    plt.xlabel( "Second Grade")

    plt.ylabel( "Final Grade")

    plt.show()

    ```


    However, if we look at the correlation between the second grade and the final
    grade, we see a much stronger correlation. Here we can clearly see that the students
    with good second grades are very likely to end up with a good final grade as well.
    You can play around with the different columns of this data set if you want to.


    ## Conclusion


    In conclusion, Python and big data provide one of the strongest capabilities in
    computational terms on the platform of big data analysis. If this is your first
    time at data programming, Python will be a much easier language to learn than
    any other and is far more user-friendly. And so, we’ve come to the end of this
    book which was meant to give you a taste of data analysis techniques and visualization
    beyond the basics using Python. Python is a wonderful tool to use for data purposes
    and I hope this guide stands you in good stead as you go about using it for your
    purposes. I have tried to go more in-depth in this book, give you more information
    on the fundamentals of data science, along with lots of useful practical examples
    for you to try out. Please read this guide as often as you need to and don’t move
    on from a chapter until you fully understand it. And do try out the examples included
    – you will learn far more if you actually do it rather than just reading the theory.
    This was just an overview to recap on what you learned in the first book, covering
    the datatypes in pandas and how they are used. We also looked at cleaning the
    data and manipulating it to handle missing values and do some string operations.

