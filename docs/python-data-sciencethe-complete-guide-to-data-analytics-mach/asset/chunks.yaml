    ## Introduction

    Data Science might be a relatively new multi-disciplinary field, however its integral
    parts have been individually studied by mathematicians and IT professionals for
    decades. Some of these core elements include machine learning, graph analysis,
    linear algebra, computational linguistics, and much more. Because of this seemingly
    wild combination of mathematics, data communication, and software engineering,
    the domain of data science is highly versatile. Keep in mind that not all data
    scientists are the same. Each one of them specializes based on competency and
    area of expertise. With that in mind, you might be asking yourself now what’s
    the most important, or powerful, tool for anyone aiming to become a data scientist.
    This book will focus on the use of `Python`, because this tool is highly appreciated
    within the community of data scientists and it’s easy to start with. This is a
    highly versatile programming language that is used in a wide variety of technical
    fields including software development and production. It is powerful, easy to
    understand, and can handle any kind of program whether small or complex. `Python`
    started out in 1991, and it has nothing to do with snakes. As a fun fact, this
    programming language loved by both beginners and professionals was named this
    way because its creator was a big fan of Monty Python, a British comedy group.
    If you’re also one of their fans, you might notice several references to them
    inside the code, as well as the language’s documentation. But enough about trivia
    - we’re going to focus on `Python` due to its ability to develop quick experimentations
    and deploy scientific application. Here are some of the other core features that
    explain why `Python` is the way to go when learning data science:


    - **Integration**: `Python` can integrate many other tools and even code written
    in other programming languages. It can act as a unifying force that brings together
    algorithms, data strategies, and languages.

    - **Versatility**: Are you a complete beginner who never learned any kind of programming
    language, whether procedural or object-oriented? No problem, `Python` is considered
    by many to be the best tool for aspiring data scientists to grasp the concepts
    of programming. You can start coding as soon as you learn the basics!

    - **Power**: `Python` offers every tool you need for data analysis and more. There
    are an increasing number of packages and external tools that can be imported into
    `Python` to extend its usability. The possibilities are truly endless, and that
    is one of the reasons why this programming language is so popular in diverse technical
    fields, including data science.

    - **Cross-Platform Compatibility**: Portability is not a problem no matter the
    platform. Programs and tools written in `Python` will work on Windows, Mac, as
    well as Linux and its many distributions.


    `Python` is a Jack of all trades, master of everything. It easy to learn, powerful,
    and easy to integrate with any other tools and languages, and that is why this
    book will focus on it when discussing data science and its many aspects. Now let’s
    begin by installing `Python`.

