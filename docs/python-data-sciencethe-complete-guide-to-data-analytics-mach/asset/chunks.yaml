    # 第 10 章：线性回归


    最简单且最基础的机器学习算法是线性回归。我们将学习的第一个算法，它是一种监督学习算法。这意味着我们既需要输入也输出来训练模型。


    ## 数学原理


    在开始写代码之前，让我们先谈谈这种算法背后的数学原理。在上面的图中，你看到了许多不同的点，每个点都有一个 x 值和一个 y 值。x 值被称为 `feature`（特征），而
    y 值即是我们的 `label`（标签）。`label` 是我们 `feature` 的对应结果。我们的线性回归模型由一条直接穿过数据的蓝线表示。它的位置安排使得它尽可能同时靠近所有点。因此，我们“训练”了这条线，使其拟合现有的点或现有的数据。


    现在的想法是在不知道对应 y 值的情况下，取一个一个新的 x 值。然后我们观察这条线，并找到该处对应的 y 值，这就是模型为我们预测的数值。然而，由于这条线具有很强的通用性，我们将得到一个相对不准确的结果。不过，必须提到的是，只有当我们处理大量特征（即高维数据）时，线性模型才能真正发挥其效用。如果我们把此模型应用于学校数据，并试图寻找缺课小时数、学习时间与最终成绩之间的关系，我们得到的结果可能没有包含
    30 个参数时准确。但从逻辑上讲，我们拥不再是直线或平面，而是一个超平面（hyperplane）。这是高维空间中直线的等价物。


    ## 数据准备


    现在我们的数据已经完全加载并选择完毕。然而，为了将其作为模型的训练和测试数据，我们必须对其进行重新格式。`sklearn` 模型不接受 `Pandas` 数据帧，只接受
    `NumPy` 数组。这就是为什么我们将特征转换为 `x-array`，将标签转换为 `y-array`。


    ```python

    X = np.array(data.drop([''prediction''], 1 ))

    Y = np.array(data[''prediction''])

    ```


    `np.array` 方法将选定的列转换为数组。`drop` 函数返回不包含指定列的数据帧。我们的 `X` 数组现在包含了我们所有的列，除了最终成绩。最终成绩在
    `Y` 数组中。为了训练和测试我们的模型，我们必须划分可用数据。第一部分用于让超平面尽可能地拟合我们的数据。第二部分则用之前未知的数据检查预测的准确性。


    ```python

    X_train, X_test, Y_train, Y_test = train_test_split(X, Y, test_size = 0.1 )

    ```


    通过 `train_test_split` 函数，我们将 `X` 和 `Y` 数组分为四个数组。顺序必须与此处完全一致。`test_size` 参数指定了用于测试的记录百分比。在这种情况下，它是
    10%。这是一个很好且推荐的值。我们这样做是为了测试模型对于以前未见过的数据有多有多准确。


    ## 训练与测试


    现在我们可以开始训练和测试模型了。为了此，我们首先定义模型。


    ```python

    model = LinearRegression()

    model.fit(X_train, Y_train)

    ```


    通过使用 `LinearRegression` 类的构造函数，我们创建了模型。然后我们使用 `fit` 函数并传入训练数据。现在我们的模型已经训练好了。它已经调整了超平面，使其拟合我们所有的值。为了测试我们模型的性能，我们可以使用
    `score` 方法并传入测试数据。


    ```python

    accuracy = model.score(X_test, Y_test)

    print (accuracy)

    ```


    由于训练和测试数据的划分总是随机的，我们每次运行的结果都会略有不同。平均结果可能像这样：0.9130676521162756。实际上，91% 是一个非常高且良好的准确率。现在我们知道模型是有可靠性的，可以输入新数据并预测最终成绩。


    ```python

    X_new = np.array([[18 , 1 , 3 , 40 , 15 , 16]])

    Y_new = model.predict(X_new)

    print (Y_new)

    ```


    在这里我们定义了一个按正确顺序包含特征值的新 `NumPy` 数组。然后我们使用 `predict` 方法来计算输入输入可能的最终成绩。[17.12142363]。在这种情况下，最终成绩可能是
    17。


    ## 可视化相关性


    由于我们在这里处理的是高维数据，我们无法为模型画图。这只在二维或三维中是可能的。然而，我们可以可视化的是单个特征之间的关系。


    ```python

    plt.scatter(data[''studytime''], data[''G3''])

    plt.title( "Correlation")

    plt.xlabel( "Study Time")

    plt.ylabel( "Final Grade")

    plt.show()

    ```


    在这里我们使用 `scatter` 函数绘制散点图，显示了学习时间与最终成绩之间的关系。在这种情况下，我们看到这种关系并不强。数据非常多样化，你看不到清晰的模式。


    ```python

    plt.scatter(data[''G2''], data[''G3''])

    plt.title( "Correlation")

    plt.xlabel( "Second Grade")

    plt.ylabel( "Final Grade")

    plt.show()

    ```


    然而，如果我们观察二阶段成绩与最终成绩之间的相关性，我们会看到更强的相关性。在这里我们可以清楚地看到，成绩良好的学生很可能获得良好的最终成绩。如果你愿意，可以对该数据集的不同列进行尝试。


    ## 结论


    总之，Python 和大数据在计算能力方面提供了大数据分析平台上强大的能力之一。如果你是第一次接触数据编程，Python 将比任何其他语言都更容易学习，并且更加用户友好。现在，我们已经来到了这本书的末尾，这本书旨在让你体验使用
    Python 进行基础之外的数据分析技术和可视化的魅力。Python 是用于数据目的的极佳工具，我希望本指南在你将其用于目的时能提供良好的帮助。在这本书中，我尝试了更深入地提供了更多关于数据科学基础的知识，以及许多实用的实践示例供你尝试。请根据需要多次阅读本指南，在完全理解一个章节之前不要跳到下一章。务必尝试包含的示例——如果你实际动手，会比只读理论学得得多。


