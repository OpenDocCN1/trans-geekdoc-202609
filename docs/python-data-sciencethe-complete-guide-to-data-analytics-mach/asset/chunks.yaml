    # Chapter 4: Data Structures and the A* Algorithm


    In this chapter, you will learn how to create abstract data structures using the
    same Python data types you already know. Abstract data structures allow your programs
    to process data in intuitive ways and rely on the Don’t Repeat Yourself (DRY)
    principle. That is, using less code, and not typing out the same operations repeatedly
    for each case. As you study the examples given, you will begin to notice a pattern
    emerging: the use of classes that complement each other with one acting as a node
    and another as a container of nodes. In computer science, a data structure that
    uses nodes is generally referred to as a tree. There are many different types
    of trees, each with specialized use cases. You may have already heard of binary
    trees if you are interested in programming or computer science at all. One possible
    type of tree is called an n-ary tree, or n-dimensional tree. Unlike the binary
    tree, the n-ary tree contains nodes that have an arbitrary number of children.
    A child is simply another instance of a node that is linked to another node, sometimes
    called a parent. The parent must have some mechanism for linking up to child nodes.
    The easiest way to do this is with a list of objects.


    ## Example Coding #1: A Mock File-System


    A natural application of the n-ary tree is a traditional windows or UNIX file
    system. Nodes can be either folders, directories or individual files. To keep
    things simple the following program assumes a single directory as the tree’s root.


    ### ch1a.py


    The `FileSystem` acts as the tree, and the `Node` class does most of the work,
    which is common with tree data structures. Notice also that `FileSystem` keeps
    track of individual ID’s for each node. The ID’s can be used as a way to quantify
    the number of nodes in the file system or to provide lookup functionality. When
    it comes to trees, the most onerous task is usually programming a solution for
    traversal. The usual way a tree is structured is with a single node as a root,
    and from that single node, the rest of the tree can be accessed. Here the function
    `look_up_parent` uses a loop to traverse the mock directory structure, but it
    can easily be adapted to a recursive solution as well. General usage of the program
    is as follows: initiate the `FileSystem` class, declare `Node` objects with the
    directory syntax (in this case backslash so Python won’t mistake it for escape
    characters), and then calling the `add` method on them.


    ## Example Coding #2: Binary Search Tree (BST)


    The binary search tree gets its name from the fact that a node can contain at
    most two children. While this may sound like a restriction, it is actually a good
    one because the tree becomes intuitive to traverse. An n-ary tree, in contrast,
    can be messy.


    ### ch1b.py


    As before, the `Node` class does most of the heavy lifting. This program uses
    a `BST` primarily to sort a list of numbers but can be generalized to sorting
    any data type. There are also a number of auxiliary methods for finding out the
    size of the tree and which nodes are childless (leaves). This implementation of
    a tree better illustrates the role that recursion takes when traversing a tree
    at each node calls a method (for example `insert`) and creates a chain until a
    base case is reached.


    ## Example Coding #3: A* Algorithm


    The A* star search algorithm is considered the same as the Dijkstra algorithm
    but with brains. Whereas Dijkstra searches almost exhaustedly until the path is
    found, A* uses what is called a heuristic, which is a fancy way of saying “educated
    guess.” A* is fast because it is able to point an arrow at the target (using the
    heuristic) and find steps on that path. First, here’s a brief explanation of the
    algorithm. To simplify things, we will be using a square grid with orthogonal
    movement only (no diagonals). The object of A* is to find the shortest path between
    point A and point B. That is, we know the position of point B. This will be the
    end node, and A the start. In order to get from A to B, the algorithm must calculate
    distances of nodes between A and B such that each node gets closer to B or is
    discarded. An easy way to program this is by using a heap or priority queue and
    using some measure of distance to sort order. After the first node is added to
    the heap, each neighbor node will be evaluated for distance and the closest one
    to B is added to the heap. The process repeats until the node is equal to B.


    ### ch1c.py


    In this case, the heuristic is called Manhattan distance, which is just the absolute
    value between the current node and the target. The `heapq` library is being used
    to create a priority queue with `f` as the priority. Note that the `backtrace`
    function is simply traversing a tree of nodes that each has a single parent. You
    can think of the `g` variable is the cost of moving from the starting point to
    somewhere along the path. Since we are using a grid with no variation in movement
    cost `g` can be constant. The `h` variable is the estimated distance between the
    current node and the target. Adding these two together gives you the `f` variable,
    which is what controls the order of nodes on the path.


    # Chapter 5: Reading data in your script


    ## Reading data from file


    Let’s make our data file using Microsoft Excel, LibreOffice Calc, or some other
    spreadsheet application and save it in a tab delimited file `ingredients.txt`.


    | Food | carb | fat | protein | calories | serving size |

    | --- | --- | --- | --- | --- | --- |

    | pasta | 39 | 1 | 7 | 210 | 56 |

    | parmesan grated | 0 | 1.5 | 2 | 20 | 5 |

    | Sour cream | 1 | 5 | 1 | 60 | 30 |

    | Chicken breast | 0 | 3 | 22 | 120 | 112 |

    | Potato | 28 | 0 | 3 | 110 | 148 |

