  trans: "\n\n启动你的 IPython notebook 服务器。使用右上角的“New”（新建）下拉菜单，创建一个新的 Python3 notebook，并在代码单元格中输入以下\
    \ Python 程序：\n\n```python\n#open ingredients.txt 文件\nwith open ('ingredients.txt',\
    \ 'rt') as f: \n    for line in f:\n        #读取行直到文件结束 \n        print (line)\
    \   \n        #打印每一行 \n```\n\n请记住，在 Python 程序中，缩进至关重要，它用于指定嵌套运算符。可以使用菜单选项 `Cell/Run`（单元/运行）、右箭头按钮或\
    \ `Shift-Enter` 快捷键运行程序。你可以在 IPython notebook 中拥有许多代码单元格，但只有当前中的单元格会被运行。之前运行过的单元格生成的变量是可以访问的，但如果你刚下载了一个\
    \ notebook，你需要运行所有初始化当前单元格所需变量的单元格。你可以通过菜单选项 `Cell/Run All`（运行所有）或 `Cell/Run All\
    \ Above`（运行上方）来运行 notebook 中的所有代码单元格。\n\n此程序将打开名为 \"ingredients\" 的文件并逐行打印内容。`with`\
    \ 运算符是一个上下文管理器 - 它打开文件并让嵌套运算符识别为 `f`。在这里，它被用作一种惯用法，确保我们在完成读取后自动关闭文件。`for` 之前的缩进是必须的\
    \ - 它显示 `for` 嵌套在 `with` 内部，并且可以访问指定文件的变量 `f`。`print` 函数嵌套在 `for` 内部，这意味着它将对文件中读取的每一行执行一次，直到到达文件尾且\
    \ `for` 循环结束。仅需 3 行 Python 代码即可遍历任意长度的文件。\n\n现在，让我们从每行中提取字段。为了做到这一点，我们需要使用字符串方法\
    \ `split()`，它将行进行分割并返回一个子字符串列表。默认情况下，它会在每个空白字符处分割行，但我们的数据是用制表符字符分隔的 - 因此我们将使用制表符来分割字段。制表符在\
    \ Python 中指定为 `\\t`。\n\n```python\nwith open ('ingredients.txt', 'rt' ) as f:\
    \ \n    for line in f:\n        fields=line.split ('\\t' ) #将行分割为独立的字段 \n    \
    \    print(fields)      #打印字段\n```\n\n这段代码的输出是：`['food', 'carb', 'fat', 'protein',\
    \ 'calories', 'serving size\\n']`，`['pasta', '39', '1', '7', '210', '56\\n']`，`['parmesan\
    \ grated', '0', '1.5', '2', '20', '5\\n']`，`['Sour cream', '1', '5', '1', '60',\
    \ '30\\n']`，`['Chicken breast', '0', '3', '22', '120', '112\\n']`，`['Potato',\
    \ '28', '0', '3', '110', '148\\n']`。\n\n现在，每个字符串都方便地分割成了字段列表。最后一个字段包含一个讨厌的 `\\\
    n` 字符表示行结束。我们将使用 `strip()` 方法将其移除，该方法会去除字符串两端的空白字符。在将字符串分割为字段列表后，我们可以使用索引操作来访问每个字段。例如，`fields[0]`\
    \ 将带我们第一个字段，其中包含食物名称。在 Python 中，列表或数组的第一个元素的索引为 `0`。这些数据还无法直接使用。所有字段（包括这些数字）都用字符串形式表示。这通过单引号指示。我们希望食物名称是字符串，但营养素、卡路里和份量必须是数字，这样我们才能对它们进行排序和计算。\n\
    \n另一个问题是第一行包含列名。我们需要对它进行区别处理。一种方法是使用文件对象的方法 `readline()` 读取第一行。另一种方法是使用 `enumerate()`，它不仅会返回行，还会返回从零开始的行号：\n\
    \n```python\nwith open ('ingredients.txt', 'rt') as f: #获取行号和行本身\n    for i,line\
    \ in enumerate (f):\n        fields=line.strip().split('\\t') #将行分割为字段\n```\n\n\
    这产生了如下输出：`0 ['food', 'carb', 'fat', 'protein', 'calories', 'serving size']`\n\
    `1 ['pasta', '39', '1', '7', '210', '56']`\n`2 ['parmesan grated', '0', '1.5',\
    \ '2', '20', '5']`\n`3 ['Sour cream', '1', '5', '1', '60', '30']`\n`4 ['Chicken\
    \ breast', '0', '3', '22', '120', '112']`\n`5 ['Potato', '28', '0', '3', '110',\
    \ '148']`\n\n现在我们知道了当前的行号，并可以区别处理第一行。让我们利用这一知识将数据从字符串转换为数字。为了做到这一点，Python 提供了\
    \ `float()` 函数。我们需要转换多个字段，因此我们将使用一种名为列表推导式的强大功能。\n\n```python\nwith open ('ingredients.txt',\
    \ 'rt') as f:\n    for i,line in enumerate (f):\n        fields=line.strip().split('\\\
    t')\n        if i==0 : #如果是第一行\n            print ( i,fields ) #打印 i 和 fields\n\
    \        food=fields[0]\n        numbers=[float (n) for n in fields[1 :]] #打印\
    \ i, food 和转换数值\n        print (i,food,numbers)\n```\n\n`if` 运算符测试条件是否成立。为了检查相等性，你需要使用\
    \ `==`。\n\n### 处理损坏的数据\n有时，大文件中只有某一行格式不正确。例如，它可能包含一个无法转换为数字的字符串。除非妥善处理，否则这种情况将强制程序崩溃。为了处理此类情况，我们必须使用\
    \ Python 的异常处理。程序可能出错的部分应该嵌入 `try... except` 块。在我们的程序中，一个容易出错的部分是将字符串转换为数字：`numbers=[float\
    \ (n) for n in fields[1 :]]`。\n\n让我们对这一行进行保护：\n\n```python\n# ...之前的代码 ...\n \
    \       try :\n            # 注意错误！\n            numbers=[ float (n) for n in fields[\
    \ 1 :]]\n        except :\n            # 如果发生错误\n            print ( i,line )\
    \ # 打印出错行及其行号\n            print ( i,fields ) # 它是如何被分割的\n            continue\
    \ # 跳到下一行而不崩溃\n```\n\n"
- fmt: "\n# Chapter 6: Manipulating data\n\n## Sorting data\n\nIn order to do something\
    \ meaningful with the data, we need a container to hold it. Let’s store information\
    \ for each food in a list, and create a list of these lists to represent all the\
    \ foods. Having all the data conveniently in one list allows us to sort it easily.\n\
    \n```python\ndata= [] # create an empty list to hold data\nwith open ('ingredients.txt',\
    \ 'rt') as f:\n    for i,line in enumerate (f):\n        fields=line.strip().split('\\\
    t')\n        if i==0 :\n            header=fields #remember a header\n       \
    \     continue\n        food=fields [0].lower () #convert to lower case\n    \
    \    try :\n            numbers=[ float (n) for n in fields[ 1 :]]\n        except\
    \ :\n            print (i,line)\n            print (i,fields)\n            continue\n\
    \        #append food info to data list\n        data.append([food]+numbers)\n\
    \n# Sort list in place by food name\ndata.sort(key=lambda a:a[3]/a[4], reverse=True\
    \ )\nfor food in data: #iterate over the sorted list of foods\n    print (food\
    \ )\n\n#print info for each food\n['chicken breast', 0.0, 3.0, 22.0, 120.0, 112.0]\n\
    ['parmesan grated', 0.0, 1.5, 2.0, 20.0, 5.0]\n['pasta', 39.0, 1.0, 7.0, 210.0,\
    \ 56.0]\n['potato', 28.0, 0.0, 3.0, 110.0, 148.0]\n['sour cream', 1.0, 5.0, 1.0,\
    \ 60.0, 30.0]\n```\n\n`data=[]` creates an empty list and `append()` method appends\
    \ new variables to the list. `sort()` method sorts lists in place. If the list\
    \ contains simple values (such as numbers or strings), they are sorted from small\
    \ to large or alphabetically by default. \n\nWe have a list of complex data and\
    \ it is not obvious how to sort it. So, we pass a `key` parameter to the `sort()`\
    \ method. This parameter is a function that takes an element of the list and returns\
    \ a simple value that is used to order the elements in the list. In our case,\
    \ we used a simple nameless `lambda` function that took record for each food and\
