    < package\_name > Once the command is given, the specified package will be downloaded
    and installed together with any other dependencies they require in order to run.
    We will go over the most important packages that you will require in a later section.
    For now, it’s enough to understand the basic setup process. Scientific Distributions
    As you can see in the previous section, building your working environment can
    be somewhat time consuming. After installing Python, you need to choose the packages
    you need for your project and install them one at a time. Installing many different
    packages and tools can lead to failed installations and errors. This can often
    result in a massive loss of time for an aspiring data scientist who doesn’t fully
    understand the subtleties behind certain errors. Finding solutions to them isn’t
    always straightforward. This is why you have the option of directly downloading
    and installing a scientific distribution. Automatically building and setting up
    your environment can save you from spending time and frustration on installations
    and allow you to jump straight in. A scientific distribution usually contains
    all the libraries you need, an Integrated Development Environment (IDE), and various
    tools. Let’s discuss the most popular distributions and their application. Anaconda
    This is probably the most complete scientific distribution offered by Continuum
    Analytics. It comes with close to 200 packages pre-installed, including Matplotlib,
    Scikit-learn, NumPy, pandas, and more (we’ll discuss these packages a bit later).
    Anaconda can be used on any machine, no matter the operating system, and can be
    installed next to any other distributions. The purpose is to offer the user everything
    they need for analytics, scientific computing, and mass-processing. It’s also
    worth mentioning that it comes with its own package manager pre-installed, ready
    for you to use in order to manage packages. This is a powerful distribution, and
    luckily it can be downloaded and installed for free, however there is an advanced
    version that requires purchase. If you use Anaconda, you will be able to access
    “conda” in order to install, update, or remove various packages. This package
    manager can also be used to install virtual environments (more on that later).
    For now, let’s focus on the commands. First, you need to make sure you are running
    the latest version of conda. You can check and update by typing the following
    command in the command line: conda update conda Now, let’s say you know which
    package you want to install. Type the following command: conda install < package\_name
    > If you want to install multiple packages, you can list them one after another
    in the same command line. Here’s an example: conda install < package\_number\_1
    > < package\_number\_2 > < package\_number\_3 > Next, you might need to update
    some existing packages. This can be done with the following command: conda update
    < package\_name > You also have the ability to update all the packages at once.
    Simply type: conda update --all The last basic command you should be aware of
    for now is the one for package removal. Type the following command to uninstall
    a certain package: conda remove < package\_name > This tool is similar to “pip”
    and “easy install”, and even though it’s usually included with Anaconda, it can
    also be installed separately because it works with other scientific distributions
    as well. Canopy This is another scientific distribution popular because it’s aimed
    towards data scientists and analysts. It also comes with around 200 pre-installed
    packages and includes the most popular ones you will use later, such as Matplotlib
    and pandas. If you choose to use this distribution instead of Anaconda, type the
    following command to install it: canopy\_cli Keep in mind that you will only have
    access to the basic version of Canopy without paying. If you will ever require
    its advanced features, you will have to download and install the full version.
    WinPython If you are running on a Windows operating system, you might want to
    give WinPython a try. This distribution offers similar features as the ones we
    discussed earlier, however it is community driven. This means that it’s an open
    source tool that is entirely free. You can also install multiple versions of it
    on the same machine, and it comes with an IDE pre-installed. Virtual Environments
    Virtual environments are often necessary because you are usually locked to the
    version of Python you installed. It doesn’t matter whether you installed everything
    manually or you chose to use a distribution - you can’t have as many installations
    on the same machine as you might want. The only exception would be if you are
    using the WinPython distribution, which is available only for Windows machines,
    because it allow you to prepare as many installations as you want. However, you
    can create a virtual environment with the “virtualenv”. Create as many different
    installations as you need without worrying about any kind of limitations. Here
    are a few solid reasons why you should choose a virtual environment: '
