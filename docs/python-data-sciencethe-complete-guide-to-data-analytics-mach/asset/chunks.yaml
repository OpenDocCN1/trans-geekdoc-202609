  trans: "\n\n# 第 6 章：数据处理\n\n## 数据排序\n\n为了对数据进行某些有意义的操作，我们需要一个容器来存放它。让我们将每种食物的信息存储在一个列表中，并创建一个这些列表的列表来表示所有食物。将所有数据方便地放在一个列表中允许我们轻松对其进行排序。\n\
    \n```python\ndata= [] # 创建一个空列表存储数据\nwith open ('ingredients.txt', 'rt') as f:\n\
    \    for i,line in enumerate (f):\n        fields=line.strip().split('\\t')\n\
    \        if i==0 :\n            header=fields # 记住表头\n            continue\n \
    \       food=fields [0].lower () # 转换为小写\n        try :\n            numbers=[\
    \ float (n) for n in fields[ 1 :]]\n        except :\n            print (i,line)\n\
    \            print (i,fields)\n            continue\n        # 将食物信息添加到数据列表\n\
    \        data.append([food]+numbers)\n\n# 按食物名称原地排序列表\ndata.sort(key=lambda a:a[3]/a[4],\
    \ reverse=True )\nfor food in data: # 遍历排序后的食物列表\n    print (food )\n\n# 打印每种食物的信息\n\
    ['chicken breast', 0.0, 3.0, 22.0, 120.0, 112.0]\n['parmesan grated', 0.0, 1.5,\
    \ 2.0, 20.0, 5.0]\n['pasta', 39.0, 1.0, 7.0, 210.0, 56.0]\n['potato', 28.0, 0.0,\
    \ 3.0, 110.0, 148.0]\n['sour cream', 1.0, 5.0, 1.0, 60.0, 30.0]\n```\n\n`data=[]`\
    \ 创建了一个空列表，`append()` 方法将新变量添加到列表中。`sort()` 方法对列表进行原地排序。如果列表包含简单值（如数字或字符串），它们默认按从小到大或按字母顺序排序。\n\
    \n我们有一个包含复杂数据的列表，并不清楚该如何排序它。因此，我们向 `sort()` 方法传递了一个 `key` 参数。该参数是一个函数，它接收列表的一个元素并返回一个用于列表元素排序的简单值。在我们情况下，我们使用了一个简单的无名\
    \ `lambda` 函数，它接收每种食物的记录并返回第一个元素，即食物名称。因此，我们得到了按字母顺序排序的列表。\n\n我们也可以按第二个值对列表进行排序，该值代表每份碳水化合物的。我们只需要更改计算键的\
    \ `lambda` 函数：`data.sort(key=lambda a:a[1])` 这返回不同顺序的食物：\n['parmesan grated',\
    \ 0.0, 1.5, 2.0, 20.0, 5.0]\n['chicken breast', 0.0, 3.0, 22.0, 120.0, 112.0]\n\
    ['sour cream', 1.0, 5.0, 1.0, 60.0, 30.0]\n['potato', 28.0, 0.0, 3.0, 110.0, 148.0]\n\
    ['pasta', 39.0, 1.0, 7.0, 210.0, 56.0]\n\n当然，按每份碳水化合物含量排序没有太大意义，因为分量可能差异很大，帕马士士是\
    \ 5 克而土豆是 148 克。也许，按每卡路里的蛋白质含量对食物排序可能更有意义；其中，该值将反映食物的“健康程度”。再次，我们只需要更改键函数：`data.sort(key=lambda\
    \ a:a[3]/a[4])`。输出是：\n['sour cream', 1.0, 5.0, 1.0, 60.0, 30.0]\n['potato', 28.0,\
    \ 0.0, 3.0, 110.0, 148.0]\n['pasta', 39.0, 1.0, 7.0, 210.0, 56.0]\n['parmesan\
    \ grated', 0.0, 1.5, 2.0, 20.0, 5.0]\n['chicken breast', 0.0, 3.0, 22.0, 120.0,\
    \ 112.0]\n\n我们将“最不健康”的食物放在了顶部。也许我们想从最健康的开始。要做到这一点，我们需要为 `sort()` 方法提供另一个参数——`reverse`。`data.sort(key=lambda\
    \ a:a[3]/a[4], reverse=True)` 将反转列表：\n['chicken breast', 0.0, 3.0, 22.0, 120.0,\
    \ 112.0]\n['parmesan grated', 0.0, 1.5, 2.0, 20.0, 5.0]\n['pasta', 39.0, 1.0,\
    \ 7.0, 210.0, 56.0]\n['potato', 28.0, 0.0, 3.0, 110.0, 148.0]\n['sour cream',\
    \ 1.0, 5.0, 1.0, 60.0, 30.0]\n\n虽然在传统的电子表格应用中按一列或多列排序是很容易，但要根据需要几列值计算的复杂表达式进行排序要困难得多。Python\
    \ 允许你轻松实现。\n\n## 数据过滤\n\n将数据存储在列表中允许我们使用一行代码通过列表推导式对其进行过滤，但这次，我们将使用列表推导式的新的 `if`\
    \ 选项——一个允许我们从新列表中排除某些元素的 `if`：\n\n```python\ndata_filtered=[a for a in data if\
    \ a[3]/a[4]>0.09 ]\nfor food in data_filtered:\n    print (food)\n```\n\n过滤后的列表为：\n\
    ['chicken breast', 0.0, 3.0, 22.0, 120.0, 112.0]\n['parmesan grated', 0.0, 1.5,\
    \ 2.0, 20.0, 5.0]\n\n"
