  trans: "\n\n# 第 8 章：分布式系统与大数据\n\n## 分布式系统\n分布式系统是若干相互独立的计算机的集合，它们通过全球网络上的局域网络相互连接。分布式系统允许不同的机器执行各种程序。分布式系统的示例包括银行系统、机票预订系统等。\n\
    \n### 分布式系统的目标\n分布式系统有许多目标。以下是几个：\n- **可扩展性 (Scalability)**：在不破坏任何管理的情况下扩展和处理服务器。\n\
    - **异构性 (Heterogeneity)**：处理各种不同类型的节点。\n- **简单性 (Straightforwardness)**：隐藏内部工作机制，使使用户无需理解其复杂性。\n\
    - **可访问性 (Accessibility)**：使资源可用，让使用户能够访问并充分利用这些资源。\n- **响应性 (Receptiveness)**：根据标准策略提供服务。\n\
    \n### 关注的关键点\n分布式系统中有很多关注点。以下是：\n- 分布式系统隐藏了复杂性。\n- 分布式系统保证了可扩展性。\n- 传输系统提供了一致性。\n\
    - 分布式系统比其他系统更高效。\n\n### 分布式系统的缺点\n分布式系统的一个缺点如下：\n- **成本 (Cost)**：由于分布式系统的开发非常困难，其成本日益增加。\n\
    - **安全性 (Security)**：更容易受到黑客攻击，因为资源通过网络暴露。\n- **复杂性 (Complexity)**：理解结构的使用变得更加令人头疼。\n\
    - **网络依赖 (Network reliance)**：当前网络可能会导致一些问题。\n\n## 如何上手实践分布式系统？\n通过以下方式学习分布式系统构思想：\n\
    \n1. **构建一个简单的聊天应用程序**：\n   - **步骤 1**：从小开始，实现一个简单的聊天应用程序。如果成功，就修改它以支持多用户会话。你会在处理消息请求时在这里遇到一些问题。\n\
    \   - **步骤 2**：在阅读了后续、因果和其他请求程序的分布式理论后，将每一个程序逐个实现到你的系统中。\n\n2. **构建一个容量测试系统**：\n\
    \   - **步骤 1**：编写一个 Android 应用（不需要复杂的 UI，只需几个 catch），它能够嵌入并查询隐藏的 `Content Provider`。该应用程序应该具有与运行你应用程序的不同设备通信的选项。\n\
    \   - **步骤 2**：在阅读了 `Chord` 协议和 `DHT` 理论后，在你的分布式环境中重新实现这些协议。例如，假设我在三个模拟器上运行你的程序。这三个应用程序实例应该形成一个\
    \ `chord ring`，并按照 `chord` 协议所示，以分布式方式提供嵌入/查询需求。如果某个模拟器宕机，你应该能够根据你的哈希计算将键重新分配给当前运行的实例。\n\
    \n## 分布式系统的应用有哪些？\n合适的系统是协作的计算机集合，对终端用户而言就像单台计算机。当服务器流量增长时，人们必须重新设计服务器的硬件和编程安排来处理，这被称为垂直扩展。垂直扩展非常出色。但在一段时间后，你就无法继续扩展它。事实上，即使最好的硬件和程序无法为巨大的流量提供更好的支持。\n\
    \n### 应用\n- 全球定位系统\n- 万维网 (World Wide Web)\n- 机场调度系统\n- 自动化银行系统\n\n### 万维网\n在万维网应用中，信息或应用程序分布在少数异构计算机系统中，但对于终端用户或浏览器来说，它完全是一个用户从中获取数据的单一系统。多台计算机同时工作并参与万维网的资源共享。所有这些系统都有内部容错能力，如果任何系统崩溃，应用程序不会中断，故障任务可以由系统中的另一台计算机接管，而这一切将在终端用户或浏览器无感知的情况下发生。\n\
    \n万维网的元素是：\n- 多台计算机\n- 共同状态\n- 多台计算机的互连。\n\n### 分布式系统的类型\n1. **企业系统**：用于数据库、业务智能、交易准备和服务的独立服务器。这些通常不是一个网站，但如果持续管理很重要，它们可能拥有多个服务器。\n\
    2. **大型网站**（如 Google、Facebook、Quora、维基百科）：这些类似于企业系统，但规模巨大，以至于它们拥有自己的服务器，被迫是分布式的。\n\
    3. **某些依赖系统可用性或需求的分布式连接**：\n   - 军事需要某些单元级方向和控制，这将作为一个中心，通过调整一些数据和可视化来降低所有单元。\n\
    \   - 挖掘操作通常具有巨大的限制，并由本地 IT 用于控制、财务和人员系统提供服务。\n   - 开发组织通常拥有巨大的项目，但没有产生重要的互动，在最糟糕的情况下，它们可能依赖于网络中跳动的数据来关联。\n\
    \n## 数据可视化\n### 什么是数据可视化？\n数据可视化是交互性的。你是否曾经在网上预订机票时，看到过可以查看位置的地图？你可能在需要查看另一个国家的数据时发现了一个网站，其中所有你需要的内容都通过简单的显示、图表或图形来呈现。数据可视化通过调整一些数据来创建报告，让发送者和接收者都感到满意。\n\
    \n### 数据可视化是创造性的\n如果你能在脑中将其可视化，你就可以在屏幕上可视化。渴望的人可能想要查看数据的平均增长率。专家和学生可能需要以创造教育的方式呈现项目。数据可视化已被国家和办公室采用，以向社会提供有用信息。无论你在哪里，需要什么，数据可视化都能方便的方式提供答案。\n\
    \n### 数据可视化是全面的\n我们都在网上研究信息，发现了以复杂技术展示细节的设计。信息是 21 世纪的语言，意味着每个人都在发送它，每个人都在查看它。数据可视化通过创建基本机制让发送者和搜索者都感到满意。\n\
    \n### 数据可视化的基础\n数据可视化是通过图表、条形图和图形显示信息的方式。它被用于为用户的性能、任务或一般测量提供视觉化回答。数据可视化通常通过从基本系统中提取数据完成。\n\
    \n### 软件可视化\n软件可视化是创建视觉工具来描述或通常显示代码部分的行为。这可以通过广泛的语言实现。通过创建视觉界面，开发者可以支持其他人员获取代码或配置应用程序。大量的可视化涉及到理解代码片段之间的关系，特定的视觉工具（例如窗口）将公开这些信息。不同的亮点可能包括各种图表或格式，开发者可以使用它们与特定标准进行对比。\n\
    \n### 大数据可视化\n大数据可视化指的是使用现代可视化方法来显示数据内部的关系。可视化策略包括可以显示动态变化和图形设计的应用程序，超出了饼图、条形图等各种图表。这些描述远离了使用许多路径、片段和属性，转向数据的创意视觉呈现。通常，当企业需要引入数据之间的关系时，它们使用图表、条形图和图形。它们也可以使用各种颜色、术语和图像。尽管如此，这种安排的主要问题是它无法很好显示大数据或包含巨大数字的数据。数据可视化日益智能图形表示（包括个性化和活力）来显示数字并建立数据片段之间的关系。\n\
    \n### 数据可视化的许多面貌\n数据可视化已成为如今网络上主要的“热点”词汇之一。随着大多数大数据和 `IoT` 的出现，更多企业试图从它们产生的海量数据中获得更多激励。这通常包括复杂的分析——既是实时的也是历史的。将这些数据解释为有意义信息的关键因素是可视化方法。数据会被逐步发现吗？此外，由谁发现？它会以生动的气泡图和趋势图显示吗？还是相反，会被植在高细节\
    \ 3D 图形中？可视化的目标是什么？是共享信息？赋能协作？参与基础领导？数据可视化可能是一个粗略的概念，但我们对它的含义并没有统一的想法。\n\n对于某些组织来说，有效的数据可视化是协作的重要部分。它甚至可能涉及生死（考虑医疗保健和军事应用）。数据可视化是某些科学研究的重要部分。从分子材料科学到社会学，制作紧凑而精彩的研究数据可视化可以帮助研究人员快速识别示例或异常。\n\
    \n### 现在的视觉文化\n我们生活在现实中，正以一种令人措措的速度产生新信息。由于电视、网络、路边广告以及所有竞争我们不可分割注意力的事物，媒体和美国企业被迫发现新方法来穿过杂音进入我们的视野。通常情况下，如果可能的话，所选择信息的媒介是视觉化的。\n\
    \n"
- fmt: '

    # Chapter 9: Python in the Real World


    Now that you know the basics behind Python programming, you might be wondering
    where exactly could you apply your knowledge. Keep in mind that you only started
    your journey, so right now you should focus on practicing all the concepts and
    techniques you learned. However, having a specific goal in mind can be extremely
    helpful and motivating. As mentioned earlier in this book, Python is a powerful
    and versatile language with many practical applications. It is used in many fields
    from robotics to game development and web-based application design. In this chapter
    you are going to explore some of these fields to give you an idea about what you
    can do with your newly acquired skills.


    ## What is Python Used For?


    You’re on your way to work listening to your favorite `Spotify` playlist and scrolling
    through your `Instagram` feed. Once you arrive at the office, you head over to
    the coffee machine and while waiting for your daily boost you check your `Facebook`
    notifications. Finally, you head to your desk, take a sip of coffee and you think
    “Hey, I should `Google` to learn what Python is used for.” At this point you realize
    that every technology you just used has a little bit of Python in it. Python is
    used in nearly everything, whether we are talking about a simple app created by
    a startup company or a giant corporation like `Google`. Let’s go through a brief
    list of all the ways you can use Python.


    ### Robotics


    Without a doubt, you’ve probably heard about tiny computers like the `Raspberry
    Pi` or `Arduino` board. They are tiny, inexpensive devices that can be used in
    a variety of projects. Some people create cool little weather stations or drones
    that can scan the area, while others build killer robots because why not. Once
    the hardware problems are solved, they all need to take care of the software component.
    Python is the ideal solution and it is used by hobbyists and professionals alike.
    These tiny computers don’t have much power, so they need the most powerful programming
    language that uses the least amount of resources. After all, resources also consume
    power and tiny robots can only pack so much juice. Everything you have learned
    so far can be used in robotics because Python is easily combined with any hardware
    components without compatibility issues. Furthermore, there are many Python extensions
    and libraries specifically designed for the field of robotics. In addition, Google
    uses some Python magic in their AI-based self-driving car. If Python is good for
    Google and for creating killer robots, what more can you want?


    ### Machine Learning


    You’ve probably heard about machine learning because it is the new popular kid
    on the block that every tech company relies on for something. Machine learning
    is all about teaching computer programs to learn from experience based on data
    you already have. Thanks to this concept, computers can learn how to predict various
    actions and results. Some of the most popular machine learning examples can be
    found in:


    1. `Google Maps`: Machine learning is used here to determine the speed of the
    traffic and to predict for you the most optimal route to your destination based
    on several other factors as well.

    2. `Gmail`: `SPAM` used to be a problem, but thanks to Google’s machine learning
    algorithms, `SPAM` can now be easily detected and contained.

    3. `Spotify` or `Netflix`: Noticed how any of these streaming platforms have a
    habit of knowing what new things to recommend to you? That’s all because of machine
    learning. There are algorithms that can predict what you will like based on what
    you have watched or listened to so far.


    Machine learning involves programming as well as a great deal of mathematics.
    Python’s simplicity makes it attractive for both programmers and mathematicians.
    Furthermore, unlike other programming languages, Python has a number of add-ons
    and libraries specifically created for machine learning and data science, such
    as `Tensorflow`, `NumPy`, `Pandas`, and `Scikit-learn`.


    ### Cybersecurity


    Data security is one of the biggest concerns of our century. By integrating our
    lives and business into the digital world, we make it vulnerable to unauthorized
    access. You probably read every month about some governmental institution or company
    getting hacked or taken offline. Most of these situations involve terrible security
    due to outdated systems and working with antiquated programming languages. Python’s
    own popularity is something that makes it far more secure than any other. How
    so? When something is popular it becomes driven by a large community of experts
    and testers. For this reason Python is often patched and security issues are plugged
    in less than a day. This makes it a popular language in the field of cybersecurity.


    ### Web Development


    As mentioned several times before, Python is simple yet powerful. Many companies
    throughout the world, no matter the size, rely on Python to build their applications,
    websites, and other tools. Even the giants like `Google` and `Facebook` rely on
    Python for many of their solutions. We discussed earlier in the book the main
    advantages of working with Python, so we won’t explore them yet again. However,
    it is worth mentioning that Python is often used as a glue language, especially
    in web development. Creating web tools always involves several different programming
    languages, database management languages, and so on. Python can act as the integration
    language by calling `C++` data types and combining them with other elements, for
    example. `C++` is mentioned because in many tech areas the performance critical
    components are written in `C++` which offers unmatched performance, however Python
    is used for the high level customization.

    '
