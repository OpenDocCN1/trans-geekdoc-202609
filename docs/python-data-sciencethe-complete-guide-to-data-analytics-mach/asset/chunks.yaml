    # Chapter 7: Probability – Fundamental – Statistics – Data Types


    Things are quite straightforward in Knowledge Representation and Reasoning; `KR&R`.
    Exclusive of doubt, formulating and representing propositions is easy. The thing
    is, when uncertainty makes itself known, problems begin to arise – for example,
    an expert system designed to replace a doctor. For diagnosing patients, a doctor
    possesses no formal knowledge of treating the patient and no official rules based
    off of symptoms. In this situation, to determine if the patient has a specific
    condition and also the cure for it, it is the probability the expert system will
    use to formulate the highest probability chance.


    ## Real-Life Probability Examples


    As a mathematical term, probability has to do with the possibility that an event
    may occur, like taking out from a bag of assorted colors a piece of green or drawing
    an ace from a deck of cards. In all daily decision-making process, you use probability
    even without having a clue of the consequences. While you may determine the best
    course of action is to make judgment calls using subjective probability, you may
    not perform actual probability problems sometimes.


    ### Organize around the weather

    You can make plans with the weather in mind since you use probability almost every
    day. Predicting the weather condition is not possible for meteorologists and as
    a result, to establish the possibility that there will be snow, hail, or rain,
    they utilize instruments and tools. For example, it has rained with the conditions
    of the weather that is 60 out of 100 days amid the same conditions when there
    is a 60 percent chance of rain. Intuitively, rather than going to work with an
    umbrella or putting on sandals, closed-toed shoes, maybe preferred outfit to wear.
    Also, not only do meteorologists analyze probable weather patterns for that week
    or day but with the historical databases that they also examine to calculate approximately
    low and high temperatures.


    ### Strategies in sports

    For competitions and games, the probability is what coaches and athletes utilize
    to influence the best strategies for sports. When putting any player in the lineup,
    a coach of baseball evaluates the batting average of such a player. For example,
    out of every ten at-bats, an athlete may get a base hit two if the player’s batting
    average is 200. The odd is even higher for a player to even have, out of every
    ten at-bats, four hits when such a player has a 400-batting average. Another example
    is when; field goal attempts from over 40 yards out of 15, a high-school football
    kicker makes nine in a season, his next goal effort from the same space may be
    about 60 percent chance. We can have an equation like this:


    ```

    9/15 = 0.60 or 60 percent

    ```


    ### Insurance option

    To conclude on the plans that are best for your family and even for you and the
    required deductible amounts, probability plays a vital role in analyzing insurance
    policies. For example, you make use of probability to know how possible it can
    be that you will need to make a declaration when you choose a car insurance policy.
    You may likely make consideration for not only liability but comprehensive insurance
    on your car when 12 percent or of every 100 drivers over the past year, 12 out
    of them in your community have crashed into a deer. Also, if following a deer-connected
    event run $2,800, not to be in a situation where you cannot afford to cover certain
    expenses, you might consider a lower deductible on car repairs.


    ### Recreational and games activities

    Probability is what you use when you engage in video or card games or play board
    games that has the involvement of chance or luck. A required video game covert
    missile or the chances of getting the cards you need in poker is what you must
    weigh. Also, the determination of the extent of the risk you will be eager to
    take rests on the possibility of getting those tokens or cards. For example, as
    Wolfram Math World suggests, getting three of a class in a poker hand is the odds
    of `46.3-to-1`, about a chance of 2 percent. However, you will have about 42 percent
    or `1.4-to-1` odds that you will catch one pair. It is through the help of probability
    that you settle on the manner with which you intend to play the game when you
    assess what is at stake.


    ## Statistics


    The basis of modern science is on the statements of probability and statistical
    significance. In one example, according to studies, cigarette smokers have a 20
    times greater likelihood of developing lung cancer than those that don’t smoke.
    In another research, the next 200,000 years will have the possibility of a catastrophic
    meteorite impact on Earth. Also, against the second male children, the first-born
    male children exhibit IQ test scores of 2.82 points. But, why do scientists talk
    in ambiguous expressions? Why don’t they say it that lung cancer is as a result
    of cigarette smoking? And they could have informed people if there needs to be
    an establishment of a colony on the moon to escape the disaster of the extraterrestrial.


    The rationale behind these recent analyses is an accurate reflection of the data.
    It is not common to have absolute conclusions in scientific data. Some smokers
    can reduce the risk of lung cancer if they quit, while some smokers never contract
    the disease, other than lung cancer; it was cardiovascular diseases that kill
    some smokers prematurely. As a form of allowing scientists to make more accurate
    statements about their data, it is the statistic function to quantify variability
    since there is an exhibition of variability in all data. Those statistics offer
    evidence that something is incorrect may be a common misconception. However, statistics
    have no such features. Instead, to observe a specific result, they provide a measure
    of the probability. Scientists can put numbers to probability through statistic
    techniques, taking a step away from the statement that someone is more likely
    to develop lung cancer if they smoke cigarettes to a report that says it is nearly
    20 times greater in cigarette smokers compared to nonsmokers for the probability
    of developing lung cancer. It is a powerful tool the quantification of probability
    statistics offers and scientists use it thoroughly, yet they frequently misunderstand
    it.


    ### Statistics in data analysis

    Developed for data analysis is a large number of procedures for statistics they
    are in two parts of inferential and descriptive:


    #### Descriptive statistics:

    With the use of measures for deviation like `mean`, `median`, and `standard`,
    scientists have the capability of quickly summing up significant attributes of
    a dataset through descriptive statistics. They allow scientists to put the research
    within a broad context while offering a general sense of the group they study.
    For example, initiated in 1959, potential research on mortality was Cancer Prevention
    Study 1 (`CPS-1`). Among other variables, investigators gave reports of demographics
    and ages of the participants to let them compare, at the time, the United States’
    broader population and also the study group. The age of the volunteers was from
    ages 30 to 108 with age in the middle as 52 years. The research had 57 percent
    female as subjects, 2 percent black, and 97 percent white. Also, in 1960, the
    total population of female in the US was 51 percent, black was about 11 percent,
    and white was 89 percent.


    #### Inferential statistics:

    When scientists want to make considered opinion about data, making oppositions
    about bigger populaces with the use of smaller samples of data, discover connection
    between variables in datasets, and patterns in data, they make use of inferential
    statistics. From the perspective of statistics, the term `population` may differ
    from the ordinary meaning that belongs to a collection, the larger group is used
    by dataset for making suppositions about society, locations, or some impacts.
    For example, `Cancer Prevention Studies I` and `II`, `179 million` and `226 million`,
    are inferential techniques. For example, Bjerkedal and Peter Kristensen analyzed
    `250,000` male’s test scores in personnel of the military in `2007`. According
    to their examination, IQ test scores of first-born male children scored higher
    points `2.82` than second-born male children, 95 percent confidence. The vital
    concept in data is the phrase `statistically significant`, and most people misunderstand
    it. Similar to the case, people assume that a result is momentous or when they
    call it significant. However, the estimate of probability is the difference or
    observed link. In other words, the estimate of probability is the difference or
    observed link, because of chance instead of any actual connection.


    ---


    ## Data Types


    To do Exploratory Data Analysis (`EDA`), you need to have a clear grasp of measurement
    scales, which are also different data types because specific data types have correlated
    with the use of individual measurements. To select the precise visualization process,
    categorize types of variables. Now, let’s take an in-depth look at the main types
    of variables and their examples, and we may refer to them as measurement scales.


    ### Categorical data

    Characteristics are the representation of categorical data. As a result, it stands
    for things such as language, gender. Also, numerical values have connection with
    categorical data like `0` for female and `1` for male. Be aware that those numbers
    have no mathematical meaning.


    ### Nominal data

    The units are the representation of nominal values, and they use them to label
    variables without any quantitative value. They are labels. It is important to
    note that nominal data has no order. Hence, nothing would change about the meaning
    even if you improve the order of its values. For example, when asking for gender,
    the order has no value.


    ### Ordinal data

    Ordered and discrete units are what ordinal values represent. Except for the importance
    of its ordering, ordinal data is therefore similar to nominal data. For example,
    when asking about educational background, the order is of elementary, undergraduate,
    and graduate. Here is where the major limitation of ordinal data suffices; it
    is hard to know the differences between values. Due to this limitation, they use
    scales to measure non-numerical features such as customer satisfaction, happiness,
    etc.


    #### Numerical Data

    When values are separate and distinct, we refer to discrete data. In other words,
    when the data can take on specific benefits, we speak of discrete data. It is
    possible to count this type of data, but we cannot measure it. Classification
    is the category that information represents. A perfect instance is the number
    of heads in `100-coin flips`. To know if you are dealing with discrete data or
    not, try to ask the following questions: can you divide it into smaller parts,
    or can you count it?


    #### Continuous data

    Measurements are what continuous data represents, and as such, you can only measure
    them, but you’t count their values. For example, with the use of intervals on
    the real number lines, you can describe someone’s height.


    #### Interval data

    The representation of ordered units with similar differences is interval values.
    Consequently, in the course of a variable that contains ordered numeric values
    where we know the actual differences between the values is interval data. For
    example, a feature that includes a temperature of a given place may have the temperature
    in `-10`, `-5`, `0`, `+5`, `+10`, and `+15`. Interval values have a setback since
    they have no `true zero`. It implies there is no such thing as the temperature
    in regards to the example. Subtracting and adding is possible with interval data.
    However, they don’t give room for division, calculation, or multiplication of
    ratios.


    #### Ratio data

    Also, with a similar difference, ratio values are ordered units. The contrast
    of an absolute zero is what ratio values have, the same as the interval values.
    For example, weight, length, height, and so on.


    ## Importance of Data Types


    Since scientists can only use statistical techniques with specific data types,
    data types are an essential concept. You may have a wrong analysis if you continue
    to analyze data differently than intended. As a result, you will have the ability
    to choose the correct technique of study when you have a clear understanding of
    the data with which you are dealing. It is essential to go over every data once
    more. However, in regards to what statistic techniques one can apply, there is
    a need to understand the basics of descriptive statistics before you can comprehend
    what we have to discuss now. Note: you can read all about descriptive statistics
    down the line in this chapter.


    ## Statistical Methods


    ### Nominal data

    The sense behind dealing with nominal data is to accumulate information with the
    aid of:

    - **Frequencies**: The degree upon which an occasion takes place concerning a
    dataset or over a period is the frequency.

    - **Proportion**: When you divide the frequency by the total number of events,
    you can easily calculate the proportion. For example, how often an event occurs
    divided by how often the event could occur.

    - **Percentage**: Here, the technique required is visualization, and a bar chart
    or a pie chart is all that you need to visualize nominal data. To transform nominal
    data into a numeric feature, you can use one-hot encoding.


    ### Ordinal data

    The sense behind dealing with ordinal data is to accumulate information with the
    aid of:

    - **Frequencies**: The degree upon which an occasion takes place concerning a
    dataset or over a period is the frequency.

    - **Proportion**: When you divide the frequency by the total number of events,
    you can easily calculate the proportion. For example, how often an event occurs
    divided by how often the event could occur.

    - **Percentage**: Here, the technique required is visualization, and a bar chart
    or a pie chart is all that you need to visualize ordinal data.


    ### Continuous data

    The sense behind dealing with continuous data is to accumulate information with
    the aid of:

    - **Frequencies**: The degree upon which an occasion takes place concerning a
    dataset or over a period is the frequency.

    - **Mean, Median, and Standard Deviation**: These are used to describe the probability
    of the data.

    - **Correlation**: Correlation, testing, and regression are some inferential techniques.
    For example, Bjerkedal and Peter Kristensen analyzed `250,000` male’s test scores
    in personnel of the military in `2007`. According to their examination, IQ test
    scores of first-born male children scored higher points `2.82` than second-born
    male children, 95 percent confidence.

    - **Visualization**: Histogram, box-plot, and scatter plot are all that you need
    to visualize data.

    - **Descriptive Statistics**: Histogram, the mean, median, standard deviation,
    variance, kurtosis, and modality are all that you need to describe the data.

