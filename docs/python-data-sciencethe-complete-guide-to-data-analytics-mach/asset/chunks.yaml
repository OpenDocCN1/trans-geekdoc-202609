- fmt: "\nFire up your IPython notebook server. Using the New drop down menu in the\
    \ top right corner, create a new Python3 notebook and type the following Python\
    \ program into a code cell:\n\n```python\n#open file ingredients.txt\nwith open\
    \ ('ingredients.txt', 'rt') as f: \n    for line in f:\n        #read lines until\
    \ the end of file \n        print (line)   \n        #print each line \n```\n\n\
    Remember that indent is important in Python programs and designates nested operators.\
    \ Run the program using the menu option `Cell/Run`, the right arrow button, or\
    \ the `Shift-Enter` keyboard shortcut. You can have many code cells in your IPython\
    \ notebooks, but only the currently selected cell is run. Variables generated\
    \ by previously run cells are accessible, but, if you just downloaded a notebook,\
    \ you need to run all the cells that initialize variables used in the current\
    \ cell. You can run all the code cells in the notebook by using the menu option\
    \ `Cell/Run All` or `Cell/Run All Above`.\n\nThis program will open a file called\
    \ \"ingredients\" and print it line by line. Operator `with` is a context manager\
    \ - it opens the file and makes it known to the nested operators as `f`. Here,\
    \ it is used as an idiom to ensure that the file is closed automatically after\
    \ we are done reading it. Indentation before `for` is required - it shows that\
    \ `for` is nested in `with` and has an access to the variable `f` designating\
    \ the file. Function `print` is nested inside `for` which means it will be executed\
    \ for every line read from the file until the end of the file is reached and the\
    \ `for` cycle quits. It takes just 3 lines of Python code to iterate over a file\
    \ of any length.\n\nNow, let’s extract fields from every line. To do this, we\
    \ will need to use a string's method `split()` that splits a line and returns\
    \ a list of substrings. By default, it splits the line at every white space character,\
    \ but our data is delimited by the tab character - so we will use tab to split\
    \ the fields. The tab character is designated `\\t` in Python.\n\n```python\n\
    with open ('ingredients.txt', 'rt' ) as f: \n    for line in f:\n        fields=line.split\
    \ ('\\t' ) #split line in separate fields \n        print(fields)      #print\
    \ the fields\n```\n\nThe output of this code is: `['food', 'carb', 'fat', 'protein',\
    \ 'calories', 'serving size\\n']`, `['pasta', '39', '1', '7', '210', '56\\n']`,\
    \ `['parmesan grated', '0', '1.5', '2', '20', '5\\n']`, `['Sour cream', '1', '5',\
    \ '1', '60', '30\\n']`, `['Chicken breast', '0', '3', '22', '120', '112\\n']`,\
    \ `['Potato', '28', '0', '3', '110', '148\\n']`.\n\nNow, each string is split\
    \ conveniently into lists of fields. The last field contains a pesky `\\n` character\
    \ designating the end of line. We will remove it using the `strip()` method that\
    \ strips white space characters from both ends of a string. After splitting the\
    \ string into a list of fields, we can access each field using an indexing operation.\
    \ For example, `fields[0]` will give us the first field in which a food’s name\
    \ is found. In Python, the first element of a list or array has an index `0`.\
    \ This data is not directly usable yet. All the fields, including those numbers,\
    \ are represented by strings. This is indicated by single quotes. We want food\
    \ names to be strings, but the amounts of nutrients, calories, and serving sizes\
    \ must be numbers so we could sort them and do calculations with them.\n\nAnother\
    \ problem is that the first line holds column names. We need to treat it differently.\
    \ One way to do it is to use file object's method `readline()` to read the first\
    \ line. Another method is to use `enumerate()` which will return not only a line\
    \ but also its number starting with zero:\n\n```python\nwith open ('ingredients.txt',\
    \ 'rt') as f: #get line number and a line itself\n    for i,line in enumerate\
    \ (f):\n        fields=line.strip().split('\\t') #split line into fields\n```\n\
    \nThis produces output: `0 ['food', 'carb', 'fat', 'protein', 'calories', 'serving\
    \ size']`\n`1 ['pasta', '39', '1', '7', '210', '56']`\n`2 ['parmesan grated',\
    \ '0', '1.5', '2', '20', '5']`\n`3 ['Sour cream', '1', '5', '1', '60', '30']`\n\
    `4 ['Chicken breast', '0', '3', '22', '120', '112']`\n`5 ['Potato', '28', '0',\
    \ '3', '110', '148']`\n\nNow we know the number of current line and can treat\
    \ the first line differently. Let’s use this knowledge to convert our data from\
    \ strings to numbers. To do this, Python has function `float()`. We have to convert\
    \ more than one field so we will use a powerful feature called list comprehension.\n\
    \n```python\nwith open ('ingredients.txt', 'rt') as f:\n    for i,line in enumerate\
    \ (f):\n        fields=line.strip().split('\\t')\n        if i==0 : # if it is\
    \ the first line\n            print ( i,fields ) # treat it as header\n      \
    \      continue # go to the next line\n        food=fields[0] # keep food name\
    \ in food\n        #convert numeric fields no numbers\n        numbers=[float\
    \ (n) for n in fields[1 :]] #print line, food name and nutritional values\n  \
    \      print (i,food,numbers)\n```\n\nOperator `if` tests if the condition is\
    \ true. To check for equality, you need to use `==`. The index is only 0 for the\
    \ first line, and it is treated differently. We split it into `fields`, `print`,\
    \ and skip the rest of the cycle using the `continue` operator. Lines describing\
    \ foods are treated differently. After splitting the line into `fields`, `fields[0]`\
    \ receives the food's name. All other fields contain numbers and must be converted.\
    \ In Python, we can easily get a subset of a list by using a slicing mechanism.\
    \ For instance, `list1[x:y]` means that a list of every element in `list1` starting\
    \ with index `x` and ending with `y-1`. If `x` is omitted, the slice will contain\
    \ elements from the beginning of the list up to `y-1`. If `y` is omitted, the\
    \ slice goes from element `x` to the end of the list. Expression `fields[1:]`\
    \ means every field except the first `fields[0]`. `numbers=[float (n) for n in\
    \ fields[1 :]]` means we create a new list `numbers` by iterating from the second\
    \ element in the `fields` and converting them to floating point numbers. Finally,\
    \ we want to reassemble the food's name with its nutritional values already converted\
    \ to numbers. To do this, we can create a list containing a single element - food's\
    \ name - and add a list containing nutrition data. In Python, adding lists concatenates\
    \ them: `[food]+numbers`.\n\n### Dealing with corrupt data\nSometimes, just one\
    \ line in a huge file is formatted incorrectly. For instance, it might contain\
    \ a string that could not be converted to a number. Unless handled properly, such\
    \ situations will force a program to crash. In order to handle such situations,\
    \ we must use Python's exception handling. Parts of a program that might fail\
    \ should be embedded into a `try... except` block. In our program, one such error\
    \ prone part is the conversion of strings into numbers: `numbers=[float (n) for\
    \ n in fields[1 :]]`.\n\nLet's insulate this line:\n\n```python\nwith open ('ingredients.txt',\
    \ 'rt') as f:\n    for i,line in enumerate (f):\n        fields=line.strip().split('\\\
    t')\n        if i==0 :\n            print (i,fields)\n            continue \n\
    \        food=fields[0 ]\n        try :\n            # Watch out for errors!\n\
    \            numbers=[ float (n) for n in fields[ 1 :]]\n        except :\n  \
    \          # if there is an error\n            print ( i,line ) # print offing\
    \ lile and its number\n            print ( i,fields ) # print how it was split\n\
    \            continue # go to the next line without crashin\n        print (i,food,numbers)\n\
    ```\n"
