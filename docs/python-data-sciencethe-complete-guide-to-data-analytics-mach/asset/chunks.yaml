    # 第 1 章：安装 Python


    由于许多有抱负的数据科学家之前从未使用过 Python，我们将讨论安装过程，以让你熟悉你之后可能需要的各种包和发行版。在开始之前，值得注意的是 Python
    有两个版本，即 Python 2 和 Python 3。你可以使用其中任何一个，但 Python 3 是未来。许多数据科学家仍然在使用 Python 2，但向版本
    3 的迁移正在逐渐进行。需要记住的是，这两个版本之间存在各种兼容性问题。这意味着，如果你使用 Python 2 编写了一个程序然后在 Python 3 解释器中运行它，代码可能无法运行。Python
    后面的开发者也已经停止了对 Python 2 的关注，因此版本 3 是正在被不断开发和改进的版本。话如此，让我们分步进行安装过程。


    ## 逐步设置


    首先，访问 Python 的官方网站 `www.python.org` 并下载 Python。接下来，我们将进行手动安装，这需要几个步骤和说明。手动设置 Python
    并不是强制的，但它能让你对安装拥有极佳的控制力，对于你以后根据每个项目的规范独立执行的安装来说，这很重要。安装 Python 更简单的方法是通过自动安装科学数据发行版，它会为你配置你可能需要的所有包和工具（包括许多你可能不需要的因此，如果你希望通过简化的安装方法，请查看有关科学发行版的章节。


    当你从开发者网站下载 Python 时，请确保根据你机器的操作系统选择正确的安装程序。之后，只需运行安装程序即可。Python 现在已安装，但它还没有完全准备好满足我们的需求。我们现在必须安装各种包。简单的方法是打开控制台并输入
    `pip` 来调出包管理器。`easy_install` 包管理器是另一种选择，但 `pip` 被广泛认为是一个改进。如果你运行命令后什么都没有发生，意味着你需要下载并安装这些管理器中的任何一个。只需访问各自的网站并通过基础安装过程即可获取它们。


    但对于初学者，为什么要费力去用包管理器呢？像 `pip` 这样的包管理器将让你安装/卸载包变得容易得多，或者在包版本导致某些不兼容问题或错误时将它们回滚。由于这种简化流程的优势，大多数新的
    Python 安装程序都预装了 `pip`。


    现在让我们来学习如何安装一个包。如果你选择了 `pip`，只需在控制台中输入以下行：

    ```

    pip install < package_name >

    ```

    如果你选择了 `Easy Install`，过程是相同的。只需输入：

    ```

    easy_install < package_name >

    ```

    一旦给出命令，指定的包将被下载并与它们运行所需的任何其他依赖项一起安装。我们将在稍后的章节中介绍你将需要的最重要的包。目前，理解基础设置过程就足够了。


    ## 科学发行版


    正如你在上一节中看到的，构建工作环境可能相当耗时。安装 Python 后，你需要为项目选择所需的包并逐个安装。安装许多不同的包和工具可能会导致安装失败和错误。对于一个不完全理解某些错误背后细微差异的有抱负的数据科学家来说，这通常会导致大量时间浪费。寻找解决方案并不总是直观的。这就是为什么你可以选择直接下载和安装科学发行版。自动构建和设置你的环境可以避免让你在安装上花费时间和并感到挫败，让你能够直接开始。科学发行版通常包含你所需的所有库、集成开发环境
    (IDE) 和各种工具。让我们讨论一下最流行的发行版及其应用。


    ### Anaconda


    这可能是 Continuum Analytics 的最完整的科学发行版。它预装了近 200 个包，包括 Matplotlib、Scikit-learn、NumPy、pandas
    等更多（我们稍后会讨论这些包）。Anaconda 可以用于任何机器，无论操作系统是什么，并且可以安装在任何其他发行版旁边。其目的是为用户提供分析、科学计算和海量处理所需的一切。。值得一提的是，它还预装了自己的包管理器，准备供你使用以管理包。这是一个强大的发行版，幸运的是它可以免费下载和安装，但它也有一个需要购买的高级版本。


    如果你使用 Anaconda，你将能够访问 `conda` 来安装、更新或删除各种包。该包管理器还可以用于安装虚拟环境（稍后会详细介绍）。现在，让我们关注这些命令上。首先，你需要确保你正在运行最新版本的
    `conda`。你可以通过在命令行中输入以下命令来检查并更新：

    ```

    conda update conda

    ```

    现在，假设你知道想要安装哪个包。输入以下命令：

    ```

    conda install < package_name >

    ```

    如果你想安装多个包，可以在同一行命令行中连续列出它们。这是一个示例：

    ```

    conda install < package_number_1 > < package_number_2 > < package_number_3 >

    ```

    接下来，你可能需要更新某些现有的包。可以使用以下完成：

    ```

    conda update < package_name >

    ```

    你还有一次性更新所有包的能力。只需输入：

    ```

    conda update --all

    ```

    你现在应该注意的最后一个基础命令是删除包的命令。输入以下命令卸载某个包：

    ```

    conda remove < package_name >

    ```

    该工具类似于 `pip` 和 `easy install`，尽管它通常包含在 中，但也可以单独安装，因为它与其他发行版兼容。


    ### Canopy


    这是另一个流行的科学发行版，因为它面向数据科学家和分析师。它还预装了大约 200 个包，包含了你之后将使用的最流行的包，如 Matplotlib 和 pandas。如果你选择这种发行版而不是
    Anaconda，输入以下命令进行安装：

    ```

    canopy_cli

    ```

    请记住，如果不付费你只能访问 Canopy 的基本版本。如果你需要它的高级功能，将必须下载并安装完整版本。


    ### WinPython


    如果你运行 Windows 操作系统，你可能想尝试 WinPython。该发行版提供了与之前讨论的类似的功能，但它是社区驱动的。这意味着它是一个完全免费的开源工具。你还可以在同一台机器上安装它的多个版本，并且预装了一个
    IDE。


    ### 虚拟环境


    虚拟环境通常是必要的，因为你通常被限制在安装的 Python 版本。无论你是手动安装还是选择发行版，你无法在同一台机器上拥有可能需要的安装。唯一的例外是你使用的是
    WinPython 发行版（它仅适用于 Windows 机器），因为它允许准备尽可能多的安装。然而，你可以使用 `virtualenv` 创建虚拟环境。创建你需要的任何不同安装，而不必担心任何限制。以下是为什么你应该选择虚拟环境的几个坚实理由：


    '
- fmt: '

    - **Testing grounds**: It allows you to create a special environment where you
    can experiment with different libraries, modules, Python versions and so on. This
    way, you can test anything you can think of without causing any irreversible damage.

    - **Different versions**: There are cases when you need multiple installations
    of Python on your computer. There are packages and tools, for instance, that only
    work with a certain version. For instance, if you are running Windows, there are
    a few useful packages that will only behave correctly if you are running Python
    `3.4`, which isn’t the most recent update. Through a virtual environment, you
    can run different version of Python for separate goals.

    - **Replicability**: Use a virtual environment to make sure you can run your project
    on any other computer or version of Python aside from the one you were originally
    using. You might be required to run your prototype on a certain operating system
    or Python installation, instead of the one you are using on your own computer.
    With the help of a virtual environment, you can easily replicate your project
    and see if it runs under different circumstances.


    With that being said, let’s start installing a virtual environment by typing the
    following command: `pip install virtualenv`. This will install `virtualenv`, however
    you will first need to make several preparations before creating the virtual environment.
    Here are some of the decisions you have to make at the end of the installation
    process:


    - **Python version**: Decide which version you want `virtualenv` to use. By default,
    it will pick up the one it was installed from. Therefore, if you want to use another
    Python version, you have to specify by typing `-p python 3.4`, for instance.

    - **Package installation**: The virtual environment tool is set to always perform
    the full package installation process for each environment even when you already
    have said package installed on your system. This can lead to a loss of time and
    resources. To avoid this issue, you can use the `--system-site-packages` command
    to instruct the tool to install the packages from the files already available
    on your system.

    - **Relocation**: For some projects, you might need to move your virtual environment
    on a different Python setup or even on another computer. In that case, you will
    have to instruct the tool to make the environment scripts work on any path. This
    can be achieved with the `--relocatable` command.


    Once you make all the above decisions, you can finally create a new environment.
    Type the following command: `virtualenv myenv`. This instruction will create a
    new directory called `myenv` inside the location, or directory, where you currently
    are. Once the virtual environment is created, you need to launch it by typing
    these lines:


    ```bash

    cd myenv

    activate

    ```


    Now you can start installing various packages by using any package manager like
    we discussed earlier in the chapter.


    ### Necessary Packages


    We discussed earlier that the advantages of using Python for data science are
    its system compatibility and highly developed system of packages. An aspiring
    data scientist will require a diverse set of tools for their projects. The analytical
    packages we are going to talk about have been highly polished and thoroughly tested
    over the years, and therefore are used by the majority of data scientists, analysts,
    and engineers. Here are the most important packages you will need to install for
    most of your work:


    - **NumPy**: This analytical library provides the user with support for multi-dimensional
    arrays, including the mathematical algorithms needed to operate on them. Arrays
    are used for storing data, as well as for fast matrix operations that are much
    needed to work out many data science problems. Python wasn’t meant for numerical
    computing, therefore every data scientist needs a package like `NumPy` to extend
    the programming language to include many high level mathematical functions. Install
    this tool by typing the following command: `pip install numpy`.

    - **SciPy**: You can’t read about `NumPy` without hearing about `SciPy`. Why?
    Because the two complement each other. `SciPy` is needed to enable the use of
    algorithms for image processing, linear algebra, matrices and more. Install this
    tool by typing the following command: `pip install scipy`.

    - **pandas**: This library is needed mostly for handling diverse data tables.
    Install `pandas` to be able to load data from any source and manipulate as needed.
    Install this tool by typing the following command: `pip install pandas`.

    - **Scikit-learn**: A much needed tool for data science and machine learning,
    `Scikit`` is probably the most important package in your toolkit. It is required
    for data preprocessing, error metrics, supervised and unsupervised learning, and
    much more. Install this tool by typing the following command: `pip install scikit-learn`.

    - **Matplotlib**: This package contains everything you need to build plots from
    an array. You also have the ability to visualize them interactively. You don’t
    happen to know what a plot is? It is a graph used in statistics and data analysis
    to display the relation between variables. This makes `Matplotlib` an indispensable
    library for Python. Install this tool by typing the following command: `pip install
    matplotlib`.

    - **Jupyter**: No data scientist is complete without `Jupyter`. This package is
    essentially an IDE (though much more) used in data science and machine learning
    everywhere. Unlike IDEs such as `Atom`, or `R Studio`, `Jupyter` can be used with
    any programming language. It is both powerful and versatile because it provides
    the user with the ability to perform data visualization in the same environment,
    and allows customizable commands. Not only that, it also promotes collaboration
    due to its streamlined method of sharing documents. Install this tool by typing
    the following command: `pip install jupyter`.

    - **Beautiful Soup**: Extract information from HTML and XML files that you have
    access to online. Install this tool by typing the following command: `pip install
    beautifulsoup4`.

    '
