    - **测试场**：它允许你创建一个特殊环境，你可以在其中尝试不同的库、模块、Python 版本等。通过这样，你可以测试任何你想想到的东西，而不会造成任何不可逆的损坏。

    - **不同版本**：在某些情况下，你需要在计算机上安装多个版本的 Python。例如，某些包和工具只在特定版本上运行。比如，如果你运行的是 Windows，有一些有用的包只有在你运行
    Python `3.4` 时才能正常工作，而这并不是最新的更新版本。通过虚拟环境，你可以为不同的目标运行不同版本的 Python。

    - **可复现性**：使用虚拟环境来确保你的项目可以在除原始使用的版本之外的任何其他计算机或 Python 版本上运行。你可能被需要在特定的操作系统或 Python
    安装上运行你的原型，而不是在你自己电脑上使用的那个。在虚拟环境的帮助下，你可以轻松地复制你的项目，并查看它在不同情况下是否运行。


    话如此，让我们通过输入以下命令开始安装虚拟环境：`pip install virtualenv`。这将安装 `virtualenv`，但在创建虚拟环境之前，你首先需要进行一些准备工作。以下你在安装过程结束时必须做的一些决定：


    - **Python 版本**：决定你想让 `virtualenv` 使用哪个版本。默认情况下，它会选择安装时所在的版本。因此，如果你想使用另一个 Python
    版本，必须通过输入 `-p python 3.4` 来指定。

    - **包安装**：虚拟环境工具被设置为对每个环境始终执行完整的包安装过程，即使你已经在系统中安装了该包。这可能会导致时间和资源的浪费。为了避免这个问题，你可以使用
    `--system-site-packages` 命令来指示工具从系统已可有的文件中安装包。

    - **迁移**：对于某些项目，你可能需要将虚拟环境移动到不同的 Python 设置，甚至移动到另一台计算机上。在这种情况下，你必须指示工具让环境脚本在任何路径下运行。这可以通过
    `--relocatable` 命令实现。


    一旦你做出了上述所有决定，就可以创建一个新环境了。输入以下命令：`virtualenv myenv`。该指令将在你当前所在的位置或目录内创建一个名为 `myenv`
    的新目录。虚拟环境创建后，你需要通过输入以下行来启动它：


    ```bash

    cd myenv

    activate

    ```


    现在，你可以像我们在本章之前讨论过的那样，使用任何包管理器开始安装各种包了。


    ### 必要的包


    我们之前讨论过，使用 Python 进行数据科学的优势在于它的系统兼容性和高度开发的包系统。一个有抱的数据科学家为他们的项目需要一套多样化的工具。我们将讨论的分析包多年来已经经过了高度精炼和彻底测试，因此被大多数数据科学家、分析师和工程师使用。以下是你在大多数工作中需要安装的最重要包：


    - **NumPy**：该分析库为用户提供了多维数组的支持，包括操作这些数组所需的数学算法。数组用于存储数据，还用于快速矩阵运算，这对于解决许多数据科学问题非常需要。Python
    设计并不是为了数值计算，因此每个数据科学家都需要一个像 `NumPy` 这样的包来扩展编程语言，包含许多高级数学函数。通过以下命令安装此工具：`pip install
    numpy`。

    - **SciPy**：在阅读 `NumPy` 时你不可能不听说 `SciPy`。为什么？因为两者互为补充。需要 `SciPy` 来启用图像处理、线性代数、矩阵等算法。通过以下命令安装此工具：`pip
    install scipy`。

    - **pandas**：该库主要用于处理各种类型的数据表。安装 `pandas` 以从任何源加载数据并根据需要进行处理。通过以下命令安装此工具：`pip
    install pandas`。

    - **Scikit-learn**：数据科学和机器学习中非常需要的工具，`Scikit` 可能是你工具箱中最重要的包。它用于数据预处理、误差指标、监督学习和无监督学习等等。通过以下命令安装此工具：`pip
    install scikit-learn`。

    - **Matplotlib**：该包包含了从数组构建图形所需的所有内容。你还能够交互式地可视化它们。你不知道什么是图吗？它是统计学和数据分析中用于显示变量之间关系的图。这使得
    `Matplotlib` 成为 Python 不可缺的库。通过以下命令安装此工具：`pip install matplotlib`。

    - **Jupyter**：没有 `Jupyter`，数据科学家是不完整的。这个包本质上是一个用于各地数据科学和机器学习的 IDE（尽管功能远不止此）。与
    `Atom` 或 `R Studio` 等 IDE 不同，`Jupyter` 可以配合任何编程语言。它既强大又多功能，因为它为用户提供了在同一环境中执行数据可视化的能力，并允许自定义命令。不仅如此，它由于其精简的文档共享方法还促进了协作。通过以下命令安装此工具：`pip
    install jupyter`。

    - **Beautiful Soup**：从你可以在网上访问的 HTML 和 XML 文件提取信息。通过以下命令安装此工具：`pip install beautifulsoup4`。


