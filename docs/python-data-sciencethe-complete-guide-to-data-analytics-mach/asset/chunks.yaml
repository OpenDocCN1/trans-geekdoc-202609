    # 第 9 章：现实世界中的 Python


    现在你已经了解了 Python 编程的基础知识，你可能在好奇具体可以在哪里应用你的知识。请记住，你才刚刚开始这段旅行，所以现在你应该专注于练习你学到的所有概念和技术。然而，心中有一个具体的目标会非常有帮助并起到激励作用。正如本书前面提到的，Python
    是一种强大且多功能的语言，具有许多实际应用。它被用于从机器人技术到游戏开发以及 Web 应用设计等许多领域。在本章中，你将探索这些领域领域，让你对利用新学的技能可以做什么有一个直观的认识。


    ## Python 的用途？


    你正在上班的路上，听着你最喜欢的 `Spotify` 歌列表，刷着 `Instagram` 动态。当你到达办公室后，你走向咖啡机，在等待每日能量补充时，你查看了
    `Facebook` 通知。最后，你回到座位，喝了一口咖啡，心想：“嘿，我应该 `Google` 查一下 Python 是用来做什么的。” 此时，你意识到你刚刚使用的每项技术都包含有一点
    Python。Python 几乎被应用于一切领域，无论我们谈论的是初创公司创建的简单应用，还是 `Google` 这样的巨型企业。让我们简单列一下使用 Python
    的所有方法。


    ### 机器人技术


    毫无疑问，你可能听说过像 `Raspberry Pi` 或 `Arduino` 板之类的微型电脑。它们是微小、廉价的设备，可以用于各种项目。有些人创建酷酷的小气象站或可以扫描区域的无人机，而另一些人则制造强大的机器人，为什么不呢？一旦解决了硬件问题，它们都需要处理软件部分。Python
    是理想的解决方案，深受爱好者和专业人士的。这些微型电脑性能并不强大，因此它们需要消耗资源最少的强大编程语言。毕竟，资源也会消耗能量，而微型机器人携带的电量有限。你到目前为止学的所有内容都可以用于机器人技术，因为
    Python 可以轻松与任何硬件组件结合而不会出现兼容性问题。此外，还有许多专门为机器人领域设计的 Python 扩展和库。此外，Google 在其基于 AI
    的自动驾驶汽车也运用了一些 Python 魔法。如果 Python 对 Google 有用，又能制造强大的机器人，你还有什么可要求的呢？


    ### 机器学习


    你可能听说过机器学习，因为它是每个科技公司都依赖它来完成某些任务的新宠儿。机器学习的核心在于教计算机程序根据你已有的数据从经验中学习。得益于这个概念，计算机可以学习如何预测各种动作和结果。一些最流行的机器学习示例可以在：


    1. `Google Maps`：机器学习在这里被用于确定交通速度，并根据其他几个因素为你预测通往目的地的最优路线。

    2. `Gmail`：`SPAM`（垃圾邮件）曾是一个问题，但得益于 Google 的机器学习算法，`SPAM` 现在可以被轻易地检测和拦截。

    3. `Spotify` 或 `Netflix`：有没有注意到这些流媒体平台都有习惯知道该向你推荐什么新事物？这完全归功于机器学习。这些算法可以根据你目前为止看过或听过的内容来预测你会喜欢什么。


    机器学习涉及编程以及大量的数学知识。Python 的简单性使其对程序员和数学家都具有吸引力。此外，与其他编程语言不同，Python 拥有许多专门为机器学习和数据科学创建的插件和库，如
    `Tensorflow`、`NumPy`、`Pandas` 和 `Scikit-learn`。


    ### 网络安全


    数据安全是我们这个世纪最大的关注问题之一。通过将生活和业务整合到数字世界，我们使其容易受到未经授权的访问。你可能每个月都会读到某些政府机构或公司被黑客攻击或离线。这些情况大多数都是由于系统过时和使用陈旧的编程语言导致的安全漏洞。Python
    本身的流行使其比任何其他语言都安全得多。这是为什么呢？当某个东西流行时，它会由大量的专家和测试人员社区驱动。由于这个原因，Python 往往在一天内被修补并解决安全问题。这使得它成为网络安全领域的一种流行语言。


    ### Web 开发


    正如之前多次提到的，Python 简单而强大。世界各地的公司无论规模大小，都依赖 Python 来构建应用程序、网站和其他工具。即使是像 `Google`
    和 `Facebook` 这样的巨头也依赖 Python 来解决许多方案。我们在书中之前已经讨论过使用 Python 的主要优势，所以我们不再重复探讨。然而，值得提到的是
    Python 经常被用作“胶水语言”，特别是在 Web 开发中。创建 Web 工具总是涉及多种不同的编程语言、数据库管理语言等。Python 可以作为集成语言，通过调用
    `C++` 数据类型并将其与其他元素结合来发挥作用，例如。提到 `C++` 是因为在许多科技领域，性能关键的组件是用 `C++` 编写的，因为它提供了无与伦比的性能，而
    Python 则用于高层定制。


