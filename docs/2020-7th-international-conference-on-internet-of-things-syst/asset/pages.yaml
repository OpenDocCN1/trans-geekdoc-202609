    With the dataset presented in Table II, we performed an exploratory analysis to
    adapt the dataset for ML. This analysis consisted of treating missing values,
    checking the existence of outliers, normalizing variables and converting variables
    to numeric. The exploratory analysis was made advantage of Pandas [17] and scikit-learn
    [18] libraries.


    The missing values in TLD were replaced by ''None''. The isDomainOnline, mc_Age,
    mc_Country, mc_City, mc_ASN, mc_Organization are created and have been automatically
    transformed, using the Label Encoder function in the scikit library. Considering
    that many machine learning algorithms perform better when input data is scaled
    to a standard range, the sc-learn StandardScaler was used to standardize the dataset,
    keeping the distribution of values and the standard deviation is 1. The entropy
    was standardized.


    # C. ML Classification Algorithms


    With the dataset properly analyzed and prepared, the next phase is data analysis.
    For this step, the following ML algorithms were chosen:


    +   - Naive Bayes

    - Support Vector Machines (SVM)

    - Decision Tree

    - Random Forest


    +   - Logistic Regression

    - Neural Networks (MLP Classifier)


    The Naive Bayes classifier is based on a Bayesian approach. A probabilistic classifier
    estimates conditional probabilities of the dependent variable using training data
    and uses them for classification of new data.


    Support vector SVM is a technique that splits the attribute space with a hyper-plane
    to maximize the margin between the different of classes or class values.


    The Decision Tree algorithm splits the data into one or more homogeneous sets.
    It partitions the data using the most significant features in input variables.
    Random Forest is an ensemble method that uses a set of Trees. Each Tree is built
    from a sample extracted from the training data. When developing individual trees,
    an attribute is split from that attribute to prevent overfitting. The final model
    is based on the majority vote of independently developed Trees in the Forest.


    The classic application of logistic regression is limited by the sample size


    The mix of algorithms evaluate how they deal with situations of overfitting and
    noise in the data. for the logistic regression and derivatives are prone to overfitting
    but are more robust to noise, decision trees are less influenced by the presence
    of them.


    In the next section, we present the results obtained with of the algorithms presented
    throughout this section.


    # IV. DATA ANALYSIS AND RESULTS


    A good approach for selecting the algorithms is to generate the generalization
    performance of different models, and training set to select the one with the best
    performance.


    One criterion for selecting the algorithms is going through cross-validation.
    In K fold-validation, the data is divided into k subsets. The method is repeated
    k times, with that each one of the k is used as the test/validation set and the
    k subsets put together to form a training set. The error is averaged over all
    k trials to get total effectiveness of the method. We will adopt the rule determined
    by empirical evidence of K = 5.


    Before starting the dataset to the algorithms, a selection of the most relevant
    parameters for the model was carried out. The information process conducted in
