    # V. CONCLUSIONS


    The results were obtained in a system composed of an intel7 core, with 16GB of
    RAM running macOS 10.15.7, python 3.7 with pandas 1.0.1 and pickle version 0.2.
    The used dataset contains 121505 malicious domain names and 187518 non-malicious.
    The data results are presented in Table III.


    To maximize the detection of malicious domains it is necessary to create methods
    that, in the face of a new domain, are able to determine in time whether it is
    potentially malicious.


    In this article we presented an analysis on ML to determine if it is viable from
    the view of timely detecting malicious domains. An initial dataset was created,
    labeled, and grown to a size of more than 300,000 domains malicious and non-malicious.
    The dataset was analyzed using 6 ML algorithms and the results were collected
    to classify the domains as being malicious or not with accuracy rates that varied
    between 75% and 92%. The time required for classification was measured, and 277
    and 5520 seconds were used.


