    The comparison metrics between the ML classification algorithms are: Accuracy,
    Precision, Recall, and Duration. Accuracy is the proportion of correctly classified
    examples (Eq. 1). Precision is the proportion of true positives among identified
    classified (true positive and false positive). Recall is the proportion of true
    positives among all instances in the data (Eq. 2). The F is a weighted harmonic
    mean of precision and recall (Eq. 4). Duration is the time in seconds to classify
    a new domain, considering a properly trained.


    Internet domains are indispensable for communications computer systems. Through
    the domain name, the website is found and, emails are sent and hosted on servers.
    Domain names are easier to remember and widely used. Unfortunately, domains are
    used for both good and evil. Malicious actors register domains to use for malicious
    communications or to trick users into believing they are a legitimate domain.
    Use of a list of malicious domains is a common practice, however many of these
