  md: '# II. RELATED WORK


    Several prior studies investigate the security of DNS systems and how to improve
    the detection of threats using ML algorithms.


    In [3] authors used features of botnet querying and a popular classifier algorithm
    to filter the malicious domains out of DNS traffic allowing security to improve
    the accuracy of malicious domain detection. The results obtained using the Random
    Forest classifier reached the 99.38% accuracy after four optimizations, a false
    positive rate of 0.028 and a false negative rate of 1.86%.


    Another study presented in [4] focus the importance of monitoring of a firewall
    system for DNS server. The use of numerous attacks targets the DNS and the limitation
    of the firewall to enforce specific rules the authors developed for the DNS to
    allow attacks that DNS requests. A study was conducted in the suburb of a network
    used by students and the firewall can dynamically adjust the traffic to allow
    some packets when the DNS server is under attack. It used the traffic shaping
    and prioritization for the rules of the firewall to ensure connectivity for the
    objects of high demand.


    A more recent study in [5] combines blockchain with ML approach on DNS traffic.
    A deep neural architecture was built using passive DNS database. This study was
    also to detect if a domain is benign, malicious or a sinkhole with 95% accuracy
    and a false positive rate of 1:100. The authors collected different algorithms
    and methods comparison between the algorithms.


    To avoid the takeover of botnets by the enforcement authorities, malicious authors
    make use of Domain Generation (DGA). It is a technique that generates domain names
    change over time, making the process and takeover difficult. To cope with the
    use of malicious domains generated using DGA algorithms typically use two methods.
    The first tries to detect the algorithm and the seed, by reverse engineering,
    which detects the domains, anticipating the names that will be generated and including
    them in the blacklist. The other method consists of analyzing the structure of
    the domain name to determine if it is potentially malicious or not. For example,
    in [6], the authors proposed a DGA detection method and improve the security of
    DNS solutions. In [7] the authors present a prototype of DNS firewall with flexible
    response control. The policy handles the queries done by the DNS clients to the
    DNS server and manipulates the responses of queries from attackers-based-the analysis.


    In [8] authors propose a machine learning method to detect malware domain names
    using Extreme Learning Machine (ELM). ELM is a modern neural network with high
    accuracy and fast speed. Authors applied ELM to classify domain names based on
    features extracted


    multiple resources. The experimentation results reveal a high detection rate and
    accuracy of more than 95%


    Authors in [9] by considering that most of malicious domains use English words
    or look meaningful English while many malicious domains are randomly generated
    and do not include meaningful words. So, they transformed this observation into
    informative features using second Order Markov models. Four matrices were built
    to learn legitimate domain names, known domain words in English and based on a
    distribution. The probabilities from these Markov models, as well as features
    extracted from DNS data, were used to build a Random Forest classifier. The results
    achieved by the authors show that the system can quickly catch malicious domains
    with a low false rate.


    In [10] authors explore a deep learning approach based and evaluate the effectiveness
    of such deep learning approaches as recurrent neural network (RNN), short term
    memory (LSTM) and other machine learning classifiers. From the results they concluded,
    that deep learning approaches performed well in comparison to the other methods.
    The authors found that the deep learning algorithms have the capability to obtain
    the right features. Moreover, LSTM has obtained highest detection rate in all
    comparisons to the other deep learning approaches.


    The use of DNS Policy Zones (RPZ) to block malicious domains is still a useful
    approach. Using ML based regression classification, to identify potentially threats
    at DNS level in [12] with a DNS RPS approach can be valuable and avoid the detection
    of malicious domains and avoid the communication with them.


    # III. PRO METHOD TO DETECT MALICIOUS NAMES


    This paper presented a study to verify if the creation of a dataset-based known
    domain names, classified as benign or malicious, allows to classify by means of
    ML domains. To do this, the domain names needs to be formatted and create a dataset
    with specific features. The dataset needs to be analyzed so that it can be prepared
    (e.g. handling missing values, treating outliers, and the distribution). With
    the prepared dataset, the next steps to classify the ML queries and test their
    effectiveness. The general process is illustrated in Figure 1 and its steps detailed
    in the next sections.


    # A. Feature extraction from a domain name


    A domain name is composed of strings that identifies the top-level domain, another
    that identifies the name by the organization wants to know in relation to its
    brand or product (second-domain name) and'
