    Among the algorithms used, one of the best results is the Decision Tree with 92%
    of accuracy. It still requires 11 seconds to classify new domains which is a considerable
    amount of time for real-time detection of malicious domains. The lowest time-to-classify
    was achieved by the Naive Bayes with time-of-2.7 seconds, however the performance
    drops to 76%.


