    # 采用机器学习支持恶意域名检测


    **第一作者 Fernanda Magalhães**

    LouEst Informatics and Research

    LouEstR&D

    葡萄牙

    fernandomagalhaes@gmail.com


    **第二作者 João Paulo Galalhães**

    CICESI, Escola Superior de Tecnologia e Gestão

    Politécnico do Porto

    Felgueiras, 葡萄牙

    jpm@segi.pt


    *摘要—* 目前有许多域名命名系统（DNS）解决方案可以防止访问恶意域名。这些方案可以提供实时保护并防止非法通信。其中许多方案依赖于未定期更新的黑名单。然而，这只能阻止已知恶意域名的恶意通信，而忽略了许多恶意但尚未被发现的域名。本文通过实验分析了利用机器学习从大量分类的域名特征中检测恶意域名的实用性。开展了探索性分析和准备工作，并利用机器学习分类算法取得了结果。结果介于
    75% 到 92% 之间，分类时间范围在 2.77 到 5320 秒之间。有趣的是，我们可以在短时间内以较好的准确率将其分类为恶意或非恶意。*索引术* 网络安全，机器学习，恶意域名


    每天都有大量域名被注册，其中一些域名活跃时间很短，因此在有效时间内检测恶意域名是一项具有挑战性的任务。大多数域名解析过滤器基于恶意域名的黑名单。当域名请求到达
    DNS 服务器时，由于黑名单的存在，请求会被过滤；如果存在于列表中，请求会被丢入陷洞（sinkholes），即通信过程在不断更新；但如果新域名不在列表中，请求将允许在访问恶意域名时离开组织网络。


    考虑到每天创建的恶意域名数量及其生存周期，基于黑名单的过滤解决方案不足以缓解这一问题。在此背景下，采用机器学习（ML）来准确且及时检测新恶意域名的解决方案可以缓解该问题。在本文中，我们探索了使用机器学习将域名分类为良性或恶意。更具体地说，在这项工作中


    ## I. 引言


    域名是互联网运行的核心。名称服务器维护着域名与 IP 地址之间的映射关系，通过联系 DNS 获取所需服务的 IP 地址，从而促进通信。


    随着互联网的增长，域名数量也随之增加。根据 Veris [1] 的一份报告，2020 年第二季度所有顶级域名（TLD）共注册了 3.701 亿域名。与 2020
    年第一季度相比增加了 0.9%，年增长率为 4.3%。遗憾的是，这种增长也有其负面影响。根据 [2]，每天注册的 200,000 个域名中有 70% 是恶意或可疑的。研究显示，某些域名只活跃很短，而另一些则保持活跃较长时间，作为命令服务器、分发恶意软件或钓鱼网站。


    实施域名过滤解决方案（如 DNS 防火墙）非常重要。然而，我们：


    - 能够转换域名以便通过机器学习进行分类吗？

    - 构建并准备了一个数据集以衡量机器学习算法的有效性吗？

    - 研究最佳超参数组合以衡量检测准确率？

    - 衡量机器学习分类算法的准确率和持续时间？


    主要目标是利用机器学习的实用性对域名进行分类，并根据请求的域名是否为恶意来对其进行过滤。数据通过开源情报（OSINT）源进行增强。数据集在被机器学习算法分析之前，已经过探索性分析并完成了准备工作。使用了不同的算法来衡量准确率并解决域名分类问题。


    本文的结构如下：第 2 节介绍了相关工作；第 3 节介绍了数据集；第 4 节介绍了实验设置和结果；第 5 节总结全文。


    这项工作得到了 FCT – 科学技术基金会国家资金的支持，项目编号 UIDB/04728/2020。


    ## II. 相关工作


    之前的研究调查了 DNS 的安全以及如何使用机器学习算法改进检测。


    在 [3] 中，作者利用僵尸网络查询特征和常用的分类算法从 DNS 流量中过滤恶意域名，以提高安全准确率。使用随机森林分类器在四次优化后达到了 99.38%
    的准确率，误报率为 0.028。


    [4] 中提出的另一项研究关注 DNS。作者发现深度学习算法具有获取正确特征的能力。此外，LSTM 在所有深度学习方法的对比中获得了最高的检测率。


    在 [5] 中，作者使用机器学习检测恶意域名。作者获得的结果显示，该系统可以快速捕捉恶意域名且误报率较低。


    在 [6] 中，作者提出了 DGA 检测以提高安全性。


    在 [7] 中，作者展示了一个 DNS 原型。


    在 [8] 中，作者提出了一种使用极限学习机（ELM）检测恶意软件的机器学习方法。


    [9] 的作者考虑到大多数恶意域名使用单词或看起来有意义，而许多恶意域名是随机生成的，不包含意义单词。因此，他们使用二阶马尔可夫模型将这一观察转化为信息特征。


    [10] 作者探索了基于深度学习的方法，并评估了循环神经网络（RNN）、长短期记忆（LSTM）和其他机器学习分类器的有效性。


    ## III. 检测恶意名称的方案


    本文介绍了一项研究，旨在验证基于已知域名（分类为良性或恶意）创建的数据集是否允许通过机器学习分类。为了实现这一点，需要格式化域名并创建一个包含特定特征的数据集。


