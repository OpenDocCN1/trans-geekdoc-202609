    *Abstract—* there are many Domain Name System (DNS) solutions to prevent access
    malicious domains. These can provide real-time protection and illegitimate communications.
    Many of them rely on blocklists which are not been updated regularly. However,
    this is only possible to block malicious communications for known malicious domains,
    leaving out many that are malicious but not yet seen. The usefulness of adopting
    machine learning to detect malicious domains from a large set of domain classified
    features was experimentally analyzed. The exploratory analysis and the preparation
    tasks were carried out and the results achieved by machine learning classification
    algorithms. Results varied between 75% and 92% and the classification time ranged
    between 2.77 and 5320 seconds. It is interesting that we can classify as malicious
    or not in a short time and with good rate. *Index Terms* cybersecurity, machine
    learning, malicious domains


    many domains are registered every day, where some of them remain active for short
    time, the process of detecting malicious domains in useful time a challenging
    task. Most of domain naming filters are based on blocklists of malicious domains.
    With blocklists in place when a domain request reaches the DNS server, it is filtered
    and if in the list then the sinkholes the request, i.e the communication process
    are constantly updated, but if a new domain is not in the list the request leaves
    the organization at accessing a malicious domain


    Considering the number of malicious domains created every day and their lifetime,
    the filtering solutions based on blocklists are not enough to mitigate the problem.
    In this context, solutions that adopt Machine Learning (ML) to support the detection
    of new malicious domains accurately and in a timely manner could mitigate the
    problem. In this paper, we explore the use of ML to classify domain names as benign
    or malicious. More specifically, in this work


    # I. Introduction


    The domain names are central to the functioning of the Internet. The name servers
    keep the mapping between a domain and the IP address of, so facilitate the communications
    by contacting the DNS to get IP address after the desired service.


    As the Internet grows, the number of domain names increases. According to a report
    by Veris [1], the second quarter of 2020 saw 370.1 million domain name registrations
    across all top-level domains (TLDs). An increase of 0.9% compared to the first
    quarter of 2020 and a growth of 4.3%, per year. Unfortunately, this growth has
    a less positive side. According to [2], 70% of the 200,000 domains registered
    every day are malicious or suspicious. The study shows that some of the domain
    names just stay active for short periods of time, while others remain active for
    longer periods, serving as command servers, distributing malware or phishing sites.


    The implementation of domain filtering solutions, like DNS firewalls is very important.
    However, we


    +   * Transform a domain name so it can be classified through ML?

    * Build and prepare a dataset to measure the effectiveness of the ML algorithms?

    * Study the best combination of hyperparameters to measure the detection accuracy?

    * Measure the accuracy and duration by the ML classification algorithms?


    The main objective is to use the usefulness of ML to classify domains and filters
    them regarding the risk of requested domain name is malicious or not. The data
    is enriched using Open Source Intelligence (OSINT) sources. The dataset is submitted
    to exploratory analysis and prepared before it is analyzed by the ML algorithms.
    Different algorithms are used to measure the accuracy and classify the domain
    name problem.


    The paper is organized as follows: Section 2 presents the related work; the dataset
    in section 3; the experimental setup and the results are presented in section
    4; section 5 concludes the paper.


    This work was supported by national funds through FCT – Fundação para a Ciência
    e Tecnologia through UIDB/04728/2020.'
