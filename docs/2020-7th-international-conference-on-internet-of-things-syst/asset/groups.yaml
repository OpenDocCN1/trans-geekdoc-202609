    # TABLE II

    DATASET STRUCTURE


    | Feature | Description |

    | --- | --- |

    | Domain name | Domain name including the TLD. |

    | Entropy | Shannon entropy truncated to two decimal places. |

    | isDomain | Yes (Y) or No (N). |

    | diff_iplList | Number of IPs associated with the domain |

    | n_Age | Number of days since the last change (creation age). |

    | diff_Country | Number of different countries. |

    | mc_Country | Most common country in the list of countries. |

    | diff_City | Number of different cities. |

    | mc_City | Most common city in the list of cities. |

    | TLD | Top-Level Domain extracted from the domain name |

    | diff_ASN | Number of different Autonomous Systems. |

    |mc_ASN | Most common ASN in the list of ASNs. |

    |diff_Organization | Number of different organizations. |

    |mc_Organization | Most common organization in the list of organizations. |

    | SubDomains | Number of subdomain associated with the IPs. |

    | Unusual/Class | Number of different chars [0 for non-class and 1 for class domain]
    |


    With the dataset presented in Table II, we performed an exploratory analysis to
    adapt the dataset for ML. This analysis consisted of treating missing values,
    checking the existence of outliers, normalizing variables and converting variables
    to numeric. The exploratory analysis was made advantage of Pandas [17] and scikit-learn
    [18] libraries.


    The missing values in TLD were replaced by ''None''. The isDomainOnline, mc_Age,
    mc_Country, mc_City, mc_ASN, mc_Organization are created and have been automatically
    transformed, using the Label Encoder function in the scikit library. Considering
    that many machine learning algorithms perform better when input data is scaled
    to a standard range, the sc-learn StandardScaler was used to standardize the dataset,
    keeping the distribution of values and the standard deviation is 1. The entropy
    was standardized.


    # C. ML Classification Algorithms


    With the dataset properly analyzed and prepared, the next phase is data analysis.
    For this step, the following ML algorithms were chosen:


