  trans: '


    与 AI 系统工作通常意味着要处理一些权衡。在理想的世界里，我们应该能够处理这些权衡，并将它们与我们的目标和伦理规则对齐。在本章中，我们将深入探讨一种策略，在让系统运行得更好与确保每个人的公平之间找到平衡。


    将这些权衡想象成图上的点。一个轴显示了从 AI 工具中受益的额外人数（例如看到更多人出庭）。另一个轴显示了这些利益在不同人群之间分配的公平程度。一旦你运行通了
    AI 模型，就可以画出这幅图，以观察这两个重要因素之间的平衡。图上的每一个点都代表一个特定的政策选择——在让事情运行良好和保持公平之间取得微妙的平衡。


    这幅图确实凸显了在效率、准确性、影响力和不同群体公平性之间做出艰难选择的必要性。AI 让我们能够看清这些权衡并对其进行微调。通过使用预测模型，我们可以构建出一个系统，在图上清晰地展示我们偏好的平衡点，并与政策目标相匹配。


    记住，这不仅仅关乎伦理。它对我们制定规则的方式也产生巨大影响。人们可能对于图上最佳平衡点在哪里达成共识。但他们应该同意这幅图应该是存在的，以平衡可以衡量的关键因素。理解这一点将带来更明智的政策选择。AIAI
    促使我们对权衡进行量化，让我们更清楚地看到我们的决定导致了什么结果。例如，如果一个法官必须决定由谁获得某些福利，他们选择中隐藏的权衡可能并不明确。但通过 AI
    提供的精确预测，我们可以为这些权衡赋值。随着这种方法扩展到政策制定中，我们就可以更公平地处理这些权衡，避免依赖某人不透明的决策过程。


    这些权衡的一个真实世界案例是线广告的拍卖方式。理解正在使用的预测模型，并意识到这些模型可能导致的任何潜在不公平结果是非常重要的。


    ### 在线广告拍卖


    在线广告拍卖运作非常简单。当你访问一个在线平台时，广告商会竞价向你展示他们的广告。平台使用机器学习来猜测你点击每条广告的概率。然后，它向你展示预期带来最多资金的广告——即竞价金额与点击概率的乘积。


    但不公平之处可能从哪里溜进来呢？Facebook 的一个知名案例为我们提供了一个有用的例子。从鞋子到招聘信息，不同的广告针对不同的人群。这导致了这样的情况：女性主要看到鞋子广告，而男性看到更多工作广告，在无意中制造了不平衡。


    2018 年，美国住房和城市发展部因广告分发的这些差异起诉 Facebook。住房、工作和信贷的广告受联邦法律监管，一份结算协议要求 Facebook 确保这些类型的广告被等量展示给所有群体。这项政策意味着一种权衡——放弃
    Facebook 的部分收入，以确保所有群体获得平等的广告曝光。


    ### 理解 AI 算法背后的金钱和细节


    为了开始理解 AI 算法错综复杂的网络以及它们涉及的经济理论，让我们想象一个涉及 AI 广告算法的情景。我们把用户命名为 Sigal。Sigal 可能会看到一条能带来
    3 美元的鞋子广告。或者，她可能会看到一条收益稍少一点的广告——2 美元的工作广告。从核心上说，该算法的构建目的是从竞价价值中获得最大收益，偏离这一目标可能意味着亏钱。


    但这种计算涉及不仅仅是竞价价值。它还考虑了对用户互动概率的估计，通常由点击率衡量。用户互动较少的广告自然挣钱较少。因此，当公司微调这些算法以对抗偏见时，他们也需要考虑可能的经济后果。


    监管机构在保持 AI 系统平衡方面也发挥着关键作用。虽然他们对 AI 的了解可能没有科技公司那么多，但他们的见解和决策非常重要。他们并不是独立做决策；他们的决策由许多专家提供的技术咨询支持。记住，这些监管机构通常在实际限制和职责范围内工作，例如避免收集人口统计数据。


    因此，对监管机构行为的任何批评都应该结合本章中讨论的限制和原则来看待。虽然监管机构在解决 AI 伦理问题方面取得了进展，但考虑到技术的复杂性和多层次性，这项任务是艰巨的。


    ### AI 的深远影响


    AI 系统的影响可能是深远的。对一个人的预测和行动可能会引发连锁反应，并可能为他人制造不平衡。所以，如果你遇到一个声称`无 own`或`公平`的 AI 产品，请带着健康的怀疑态度对待它。要求对这些流行术语给出明确解释，并质疑为了减少偏见采取了哪些具体步骤。


    例如，一个 AI 系统可能承诺不同人群之间的选拔率相等，但这引发了关于潜在影响和法律问题的问题。随着 AI 变得越来越复杂，公司必须对其 AI 模型可能导致的任何不公平行为负责。


    目前，美国的反歧视法是反应性的，这意味着在问题发生后才采取行动。虽然证明算法歧视的成功案例并不多，但可能有很多模型已经接近违法。


    在总结这部分内容时，有几点需要记住。首先，基于历史数据的 AI 模型可能会无意中反映历史偏见。它们并不是解决问题的灵丹，只是反映了现有的不平衡。其次，模型使用的语境至关重要，并会极大地影响结果。在可能的情况下，这些权衡应该被清晰地说明，以培养一种透明和问责的文化。最后，始终要对`无偏见`或`公平`的
    AI 系统保持健康的怀疑。


    ## AI 领域的隐私


    ### 通过 AI 的影响解析隐私


    当我们说`隐私`时，人们会想到各种事情。有些人可能认为这指的是保持与朋友聊天的秘密。另一些人可能认为这指的是不受扰的权利。有些人可能将其视为控制谁可以看到他们的个人信息。因此，隐私不仅仅是一件事；它是一系列相关的概念。在我们谈论
    AI 和机器学习时，我们将尝试阐明隐私的这些部分以及它们为何如此重要。


    当我们谈论 AI 时，隐私为什么变成了一件大事？主要问题是 AI 需要数据——大量的数据。这些数据可以提供关于我们生活的很多。每当我们使用数据构建 AI 或机器学习模型时，我们可能都在交出一些秘密。这引发了一个问题：我们是否将其视为
    AI 进步的必要权衡？在构建高性能 AI 系统的同时，保持隐私是否很难？


    一个很好的例子是 Cambridge Analytica 丑闻。这家公司从 Facebook 获取了用户数据，并将其用于在 2016 年投放政治广告。他们想要影响民意和选举结果。尽管他们显显然违反了
    Facebook 的规则，但损害已经造成。


    '
- fmt: '

    Events like this have pushed the industry to be more careful about privacy. This
    change is due to new laws like the General Data Protection Regulation (`GDPR`)
    and big fines. Look at Facebook; they’ve been hit with big fines for their earlier
    relaxed attitude to privacy. Their privacy policy changed a lot, from being almost
    nonexistent in 2013 to very careful by 2018.


    As we explore privacy and machine learning, we need to rethink our old beliefs.
    We need to think more about how these privacy issues shape our view of AI and
    how big tech companies are changing their strategies.


    Understanding the puzzle of privacy means looking at its different interpretations
    and the contexts they work in. It’s not just about keeping our personal chats
    private or staying anonymous. Privacy, especially in AI, is about finding the
    balance between chasing tech advancements and our basic right to control our personal
    information. It’s a big mix of ethical, societal, and tech factors that we need
    to think about and handle carefully. This isn’t just for academics; it’s a crucial
    part of understanding the role and responsibilities of AI in our world.


    ## 50 Shades of Gray in Privacy


    A lot of folks think that information is either private or public, and that’s
    it. But it’s not that simple. In reality, there’s a whole range of how accessible
    information can be. For example, encrypted data is technically public, but it’s
    not as easy to get to as the stuff on your public social media page. Looking at
    information this way helps us understand privacy better.


    Let’s look at a real-life example. A group of researchers once collected data
    from `OkCupid`, an online dating site, for a study. Even though these profiles
    were public and anyone with the Internet could see them, people got pretty mad
    when this data was collected and shared publicly. This shows that even when information
    is technically public, we might still want some privacy around it.


    How we understand what’s private or public is a tricky balancing act. And as technology
    gets more advanced, this balance can shift. Imagine if the cops used heat-sensing
    tech to look inside your home from their car parked outside—would that invade
    your privacy? As tech gets better, we need to update our definitions and standards
    of privacy.


    An interesting way to keep privacy online is the `no index` request. This is a
    tool that lets websites tell search engines not to list certain pages, making
    them harder to find. While this can protect sensitive information, it can also
    be misused. For instance, `TurboTax` used a `no index` request to hide its free
    version from Google search results, making it tricky for users to find.


    When we think about how to protect privacy in datasets, the first solution we
    often think of is `anonymization`. The idea is simple—just remove things like
    names and addresses from the dataset, and then it’s safe for public use. But,
    as we’ve learned from past events, this basic approach to privacy, which became
    popular in the mid-1990s, doesn’t always work.


    Anonymization doesn’t consider all the complexities of privacy. It assumes that
    by taking out personally identifiable information, we’ve completely protected
    privacy. But in today’s world of big data, people can often be reidentified by
    cross-referencing `anonymized` datasets with other public information. Privacy
    isn’t just a one-and-done thing but an ongoing process. As we use more and more
    data, we need to make our privacy strategies more sophisticated and flexible.


    ## The Web of Privacy


    When `AOL` once shared what it thought was anonymous search data, things didn’t
    go as planned. They gave unique numbers to users, tying them to their searches.
    But `The New York Times`, working with this `anonymous` data, was able to find
    a specific woman by analyzing her search history and figuring out where she was.
    This incident powerfully showed us that just using anonymization doesn’t really
    keep our privacy safe.


    `Netflix`, a giant tech company, had a similar problem. They shared movie-watching
    data they thought was anonymous for research purposes. However, researchers showed
    it could be cross-referenced with `IMDb` data to figure out who the users were.


    These cases highlight the fact that just anonymizing data isn’t enough to deal
    with privacy concerns. To really protect privacy, it’s not enough to just remove
    personal identifiers. We need to look at the type of data we’re dealing with and
    use other strategies, like adding noise to make the data less easy to trace back
    to a person.


    When we mix privacy and machine learning, we face a whole new set of challenges.
    For example, can we get personal details or specifics about the training data
    from the machine learning model itself? This was a big question when the `Getty
    Images` and AI model outputs case came to light. The models were churning out
    results very similar to the training images, suggesting that the model had somehow
    `memorized` the training data.


    Worse still, this could potentially lead to leaking sensitive data. Think about
    autocomplete features on our devices, driven by machine learning models that learn
    from our typing habits. They could accidentally learn and suggest sensitive details
    like credit card numbers or passwords.


    To tackle this, we add noise to the text data and program in specific rules to
    avoid storing and suggesting sensitive details. This step helps ensure privacy
    but also highlights potential pitfalls. Even machine learning models with good
    intentions can reveal sensitive details about the people whose data was used in
    their training.


    In fields like health care, where privacy is essential, such weak spots could
    cause serious problems. Recent studies show it’s possible to pull out patients’
    genetic markers from models predicting the right medication dosage, which is a
    scary privacy risk.


    So what’s the big lesson here? Simply, models can give away information. They
    reveal details about the people in the dataset. While this is partly what they’re
    designed to do—they’re supposed to learn from data—it becomes a huge issue if
    it gives away details about people.


    ## Key Takeaways


    - **Unexpected Results**: AI models have a big influence on society, and sometimes,
    this can lead to unexpected outcomes. For instance, algorithms might accidentally
    strengthen existing biases. This shows that developers need to think about potential
    issues when they’re making these models.

    - **How AI Affects the Economy**: AI algorithms can have serious effects on the
    economy. When we’re trying to tweak these algorithms to lessen bias, we need to
    think about possible economic side effects.

    - **Why Regulation Matters**: Regulators play a key role in keeping AI systems
    balanced. They bring a certain level of knowledge to AI, and their decisions are
    made smarter by technical input from different experts.

    - **What Privacy Really Means**: Privacy is a complex idea that people can interpret
    in different ways. It can mean staying anonymous or having control over personal
    information. As AI tech relies a lot on data, it’s extremely important to think
    about privacy.

    '
