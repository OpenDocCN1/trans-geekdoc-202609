- fmt: "\nTo figure this out, let’s look back at an idea we talked about earlier.\
    \ It’s an idea that relies on a comparison between two different places; the real\
    \ world that we live in, and the world of AI. In this idea, the designer’s main\
    \ job is in the real world. They closely watch what’s happening, find problems\
    \ that need fixing, and come up with AI solutions to these problems.\n\nThink\
    \ of the designer like a football coach. The coach comes up with the game plan,\
    \ kicks it off, and closely watches how it plays out. On the other side, you’ve\
    \ got the machine learning engineers or data scientists. They’re like the players\
    \ on the field, running the plays to make these smart systems work.\n\nIn this\
    \ setup, the designer’s role could be compared to a coach’s, while the machine\
    \ learning engineer’s job is more like a player’s. The coach plans out the big\
    \ picture, thinking about each detail, taking practical things into account, and\
    \ picturing the end game. The player, meanwhile, gets in the game and makes the\
    \ coach’s plan a reality, move-by-move, always sticking to the playbook.\n\nBut\
    \ let’s make this clear: the coach isn’t the one scoring the goals. They’re the\
    \ ones coming up with, planning, and designing the system that the players will\
    \ put into action. They’re in charge of shaping the game environment, creating\
    \ a space that’s perfectly suited to its purpose.\n\nNow, you might be wondering,\
    \ how do coaches do this in real life? What basic rules guide their game plan?\
    \ And the big question: can we use these same rules when we’re designing environments\
    \ for machine learning?\n\nTo get a better understanding of how to create the\
    \ best setting for AI, we need to look more closely at how designers, or our coaches,\
    \ work. How do they start their game plan? What are the main things they think\
