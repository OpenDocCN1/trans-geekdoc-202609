    There are two main things to consider in this quest. First, we have to look at
    the cost of errors. In some cases, like self-driving cars, the cost of mistakes
    is high because it can lead to damage to people and property. But in other cases,
    like AI chatbots in customer service, the cost of mistakes is lower because incorrect
    answers can be fixed without causing major problems.


    The second thing we need to consider is how we handle errors when they happen.
    The key question is whether there’s a practical way to pass these errors to a
    human or another system. Can the system smoothly switch from AI to human control
    when things go wrong? Or does the whole system crash and burn, leading to disaster
    in the 20 percent of cases where the AI messes up?


    Figuring out these tricky issues is at the heart of using the Pareto principle
    for developing AI applications. By finding uses where near-perfect (but not totally
    perfect) accuracy is okay, and where there are ways to manage errors, we can create
    AI systems that are both effective and realistic.


    ## Change the Workflow


    ### Lessons From the Horse Carriage and Automobile


    Finally, let’s chat about the idea of changing the way we do things, or in more
    formal terms, `workflow transformation`. To make this clearer, let’s hop into
    a time machine and revisit a significant period in history, specifically to the
    transition from horse carriages to automobiles.


    In the old days, the horse carriage was the main mode of transport. It was like
    the hero of the journey, driving people and goods from Point A to Point B. The
    entire journey was planned around the capabilities of the horse and carriage.
    The horse’s strength determined the load it could carry, and its endurance dictated
    how far and how long the journey could be.


    This setup meant travel routes and schedules had to be designed a certain way.
    As the horse’s energy was finite and needed replenishing (through rest and feeding),
    inns and stables were strategically placed along popular routes for necessary
    stopovers.


    But when the automobile rolled onto the scene, everything shifted gears. Cars,
    powered by combustion engines, could carry heavier loads and travel farther and
    faster without the need for prolonged rests. This meant that there was no longer
    a need for frequent stopovers, allowing for more direct routes and flexible travel
    times. Fuel could be carried onboard and refilled at infrequent intervals, giving
    much more freedom in planning journeys.


    The impact of this change was massive. To truly harness the benefits of automobiles,
    travel plans had to be significantly reimagined. The transformation wasn’t just
    about switching the horse for an engine-powered vehicle. The real advantage materialized
    when travel routes, schedules, and logistics were reshaped to align with the capabilities
    of the automobile.


    This historical transition is a great analogy for the transition to AI. We can’t
    just toss AI into a system and expect monumental improvements. Just like the switch
    from horse carriages to cars, AI can revamp things, but only if we tweak our workflows
    to accommodate it. This might mean that we need to rearrange our surroundings,
    rules, and systems to mesh better with AI, letting us unlock all the benefits
    it can provide.


    So, progressing toward an AI future means we have to seriously examine the ways
    we currently operate. We have to be prepared to make substantial changes to craft
    a space that’s conducive to AI, ensuring we’re squeezing out all the possible
    advantages. This will definitely involve meticulous planning, experimentation,
    and continuous learning, as we refine the ways that AI fits into our workflows.


    ### From Stockpiling to On-Demand


    Traditionally, manufacturing has been all about the `stockpiling` approach. Basically,
    manufacturers try to guess what customers will want, make a bunch of products
    based on those guesses, distribute the products, and then hope their guesses were
    right. It’s a bit like trying to hit a target blindfolded.


    While this stockpiling model has been around for ages, it does have its problems.
    It risks the manufacturer making too much or not enough. If manufacturers make
    more than what’s needed, they end up with a surplus of unsold goods. Picture parking
    lots filled with hundreds or even thousands of unsold cars because the manufacturer
    didn’t accurately predict the demand or made too many of a certain model for a
    certain location. This kind of mistake can lead to too much stock, high storage
    costs, and potentially waste if the products can spoil or become outdated.


    On the flip side, if manufacturers don’t make enough, they could be left with
    not enough stock to meet customer needs. This situation can result in missed sales,
    unhappy customers, and potentially a loss of market share.


    To counter the problems of the stockpiling model, industry is starting to shift
    toward an `on-demand` approach. This method is about making goods only when they’re
    needed, which can significantly cut the costs of maintaining large inventories.
    The aim of on-demand manufacturing is to be more efficient, cut down on waste,
    and be more responsive to what the market wants.


    However, the on-demand model comes with its own challenges. It needs a strong
    supply chain that can quickly adapt to changes in demand. Any disruptions in the
    supply chain could lead to shortages and hold up production, which can negatively
    affect customer satisfaction. It also requires sophisticated tools to predict
    demand to make sure production matches customer needs.


    So, manufacturers are left with a tricky question: should they dive into the complex
    world of on-demand manufacturing? This is where AI could be a game-changer. By
    using AI for accurate demand prediction, smart supply chain management, and efficient
    production processes, manufacturers could successfully move from a stockpiling
    model to an on-demand one. But, just like when we switched from steam power to
    electricity, this change will mean rethinking current workflows and production
    processes to make them AI-friendly.


    ### The Conductor in the Orchestra of On-Demand Manufacturing


    AI, with its ability to predict and streamline, could potentially revolutionize
    on-demand manufacturing processes. But there is a big but here; how effective
    it can be depends on how ready you are to rethink your production strategy. If
    your manufacturing process is still stuck in the stockpiling mindset, the benefits
    you can get from AI may be limited.


    Let’s unpack this a bit. At its heart, on-demand manufacturing works like a well-oiled
    machine. Every part of the supply chain, from getting raw materials to delivering
    the finished product, works together seamlessly. It’s a constant balancing act
    between having just enough inventory to meet immediate demand and avoiding making
    too much or not using resources efficiently.


    This is where AI can really shine. It can predict customer demand in detail, estimate
    lead times, find potential bottlenecks in the production process, and optimize
    how resources are used. With AI, you can make accurate forecasts, which lets you
    manufacture products `on-demand` to meet customer needs, ensuring a smooth and
    efficient supply chain.


    But to make full use of AI in this way, you need to shift from a stockpiling to
    an on-demand manufacturing model. If you’re ready to make this big change, the
    benefits from AI could be game-changing. But this change is more than just adding
    AI into an existing process. It requires a broader shift in strategy that may
    at first seem unrelated to AI.

