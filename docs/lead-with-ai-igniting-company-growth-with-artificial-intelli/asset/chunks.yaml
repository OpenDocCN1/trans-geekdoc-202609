- fmt: '

    Lastly, the task needs to be self-contained. This means that all the required
    information to do the task is included in `X`, without needing to rely on outside
    information that we can’t feed into the machine. In other words, the task can
    be done based solely on the available input data, without needing extra data or
    context outside its scope. If a task meets these criteria, it’s more likely to
    be a good fit for successful automation.


    ## Two Flavors of Automation


    We need to distinguish between two main types of objectives that are fit for automation.
    Each of these objectives has unique characteristics and potential. Understanding
    their differences is the key to identifying opportunities for successful automation
    within your organization.


    The first type of objective we’re discussing involves replicating things that
    humans are already doing. The talent scout example we talked about is a great
    example of this category. The second type of objective is a bit more imaginative—it
    poses the question, what tasks would a human do if we were willing to pay them
    enough? This requires us to think beyond current roles and contemplate potential
    tasks that could be automated.


    Let’s take, for instance, AI apps that analyze a human’s handwriting and transform
    it into a font. While it’s technically feasible for a skilled human typographer
    to do this, it wouldn’t make financial sense to pay a typographer hundreds of
    dollars to turn someone’s handwriting into a single unique font. But it could
    be a wise investment to pay typographers to create a bunch of these fonts if we’re
    planning to use them to train a machine learning system, which could then generate
    similar fonts at a fraction of the cost, or even for free.


    This example demonstrates the critical idea that, when thinking about tasks for
    automation, we shouldn’t restrict ourselves to just the tasks that are currently
    being done. Economic limitations might prevent certain tasks from being executed
    by humans, but AI automation can significantly reduce the cost, making these tasks
    feasible.


    There are countless examples of tasks that fall into this category. A typographer
    could technically do what online font generators do, but it might not be worth
    their time. However, we could pay typographers to create a database of fonts that
    we could use to train an AI model. Consider something as commonplace as scanning
    barcodes at a grocery checkout—while nobody would hire a person to manually input
    each item’s details, if we could gather enough training examples of barcode readings,
    we could train an AI system to manage this task effortlessly.


    Another example might be a system that schedules your robotic vacuum cleaner to
    clean the house when you’re expected to be away. It wouldn’t be cost-effective
    to hire someone to keep an eye on your schedule and operate your vacuum cleaner
    accordingly, but it could be practical and cost-saving to automate this task.


    This leads us to the second big takeaway in automation: We need to look beyond
    the tasks that are currently being done. Think about tasks that humans could technically
    do but don’t, often because of economic limitations or other logistical challenges.
    Automation has the potential to make these tasks economically feasible, paving
    the way for increased efficiency and innovation.


    ## The Potential of Automation


    On the path to full-on automation, one worry tends to come up a lot: will this
    replace people’s jobs? This worry has made people in the research world dig into
    which jobs are more or less likely to get hit by automation. There’s a popular
    idea that automation will mostly affect folks with lower-paying jobs. To check
    this out, the researchers plotted wages on one axis and how well a job fits with
    machine learning on the other axis, with higher scores showing a bigger chance
    for automation. The results showed that the level of pay doesn’t have a strong
    tie with how likely a job is to get automated. Jobs that are ready for automation
    can be found at all pay levels, suggesting that automation could affect a wide
    range of jobs, not just the ones with lower pay.


    Despite what most people think, the results suggest that it’s not really the wage
    levels that define about how well a job fits with machine learning. And, funnily
    enough, people with high-paying jobs might have more to worry about. This is because
    automating these high-paying jobs can lead to bigger returns on investment, which
    could speed up the move to automate these roles. When you look at individual jobs,
    it’s clear that some are less ready for automation (like massage therapists, vets,
    and archaeologists), while others are more mature (like concierges, mechanical
    drafters, and even funeral directors). The job of funeral directors is a fascinating
    example because it’s high on the automation list, mostly because of the paperwork
    involved, which is something that can easily be automated.


    It’s easy to be fooled when you look at a job as a single, static thing. Different
    parts of the same job can be more or less ready for automation. The work of a
    lawyer provides an interesting example. While some parts of a lawyer’s job are
    complicated and tough to automate, a good chunk of their work is repetitive and
    could be ready for automation. For example, the discovery process involves going
    through loads of data to find relevant information, a task that’s hard, repetitive
    work, and makes up 20 to 25 percent of the costs of a lawsuit. This part of a
    lawyer’s job seems ready for automation and, indeed, there are already companies
    out there creating software to make the discovery process more efficient.


    This brings us to our third big lesson about automation; we need to stop thinking
    about automating entire jobs and start focusing on automating specific tasks within
    jobs. Most jobs are too complex for a single machine learning system to fully
    automate. However, by pinpointing and automating individual tasks within jobs,
    we can see big gains in productivity and cost-saving.


    So, our first rule of thumb for finding AI opportunities is to focus on tasks
    that can be automated. These could be tasks that people are currently doing, or
    tasks that they could potentially do. Your aim is to think about a task or part
    of someone’s job that you think fits well with machine learning. It could be a
    task in health care, a specific part of a lawyer’s job, or something entirely
    different. The challenge is in finding these tasks, figuring out how to collect
    quality data, and deciding how to separate a specific task from a job for automation.


    By shifting our focus from automating entire jobs to automating specific tasks,
    we can balance the potential of machine learning with human skills, creating a
    future where AI enhances human labor rather than replacing it. We’re on the brink
    of a thrilling era where technology is set to shake up our work lives, boost efficiency,
    and unlock amazing productivity. With an understanding of how to identify tasks
    that are ready for automation, we can make the most of the opportunities this
    revolution brings.


    ***Prediction***


    ## Forecasting


    In the last section, we dug into automation, talking about what it’s good for
    and when it hits the mark. Now, we’re about to jump into something just as intriguing
    but a bit different: the world of prediction. This will give us a better handle
    on the relationship between automation and prediction.


    Let’s kickstart this with some real-life examples where this stuff can really
    be useful, such as weather forecasting. It’s extremely complex, but it’s also
    a goldmine of opportunities for predictive models. Think about the number of people
    whose daily activities are influenced by weather changes. These folks could spend
    hours guessing what the weather will be like, which is where predictive tools
    can lend a hand.

