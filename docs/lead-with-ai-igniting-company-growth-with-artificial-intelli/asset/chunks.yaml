- fmt: '

    - **Probability Theory is at the Core**: These AI models rest on the foundations
    of probability theory and machine learning, concepts initially unveiled by Claude
    Shannon. They guess the next word based on the probabilities they’ve learned from
    heaps of training data.

    - **Language Models as Time Capsules**: Language models like GPT-3 are a bit like
    condensed time capsules of the Internet at the time they were trained. They mix
    and mash existing data, but they don’t come up with brand new information.

    - **The Journey of Refinement**: The journey from a broad language model like
    GPT to a more specialized one like ChatGPT is guided by a refining process called
    `finetuning`. This process uses a task-specific dataset to tweak the general model
    for a particular use.

    - **Walking the Line Between General and Specific Data**: The `finetuning` process
    walks a fine line between a lot of somewhat relevant data and a smaller amount
    of high-quality, task-specific data. This balance sets the stage for dynamic models
    that can be adapted to different contexts.

    - **Unlocking Organizational Memory**: Language models can tap into a company’s
    collective memory by learning from its internal communications, turning it into
    a living, accessible knowledge base. But this strategy has to be implemented while
    strictly sticking to data privacy and confidentiality standards.

    - **Getting to Know Language Models**: Understanding how language models work
    lets us critically evaluate their strengths and weaknesses. While they’re insanely
    good at predicting, they don’t truly understand or know stuff in the way humans
    do.


    ## Identifying Opportunities With AI


    *Driving efficiency in the enterprise is going to be a big opportunity ahead.*


    ### The Lens of Objectives


    #### Automation


    #### Starting on the Right Foot


    If you’re someone who’s always curious about the next big thing in your industry,
    you’ve probably been amazed by what a real game-changer AI can be. It’s clear
    that it has enormous potential to boost efficiency and take your operations to
    a whole new level. But the million-dollar question is, where do you start? How
    do you identify the objectives that are not only ready for automation but that
    also exist where AI can make a serious impact? In this chapter, we’re going to
    show you how to find these golden opportunities, point out objectives that are
    crying out for automation, and highlight the incredible benefits AI brings.


    Let’s use an example to shed some light on this. Imagine a key job in the music
    industry—the talent scout. This person has a critical role in record companies,
    identifying and signing new artists. They need to sift through tons of demos and
    live performances, ensuring the potential artists tick all the boxes before getting
    a record deal. Just picture the pile of demos and gig recordings, all waiting
    for the thumbs up from our talent scout.


    Here’s the magic phrase—“tick all the boxes.” What does this mean? Essentially,
    these are rules like having a unique sound or a solid fanbase that decide who
    gets a record deal. Now, at first glance, you might think this job is perfect
    for automation. After all, these rules seem simple enough to turn into a computer
    program. Traditional programming methods, where these rules are set out clearly,
    could help figure out whether a potential artist ticks all the boxes.


    But here’s where it gets interesting. There are different ways to describe what
    we want from this system. One way could be, `Y = meet specific talent requirements`,
    an output that traditional programming can handle pretty well. However, we could
    also describe it as `Y = the talent scout’s decision to sign`. This is where machine
    learning really comes into its own. We can use old data and past decisions made
    by talent scouts to train a machine learning system. To make it even more impressive,
    we could define `Y` as `the artist’s song becomes a hit”—the sort of task machine
    learning excels at.


    Now, let’s take a moment to consider the subtle differences between the last two
    scenarios. To get this, we need to revisit our earlier discussions about prediction
    and automation. In prediction, the situation dictates the outcome, like whether
    a song will become a hit. The outcome is a future event that unfolds over time.
    By contrast, automation lets us, the human operators, control the outcome based
    on the information we have right now. For example, a talent scout decides to sign
    an artist after carefully evaluating their potential.


    So, what kind of tasks are mature for automation? They usually involve a repetitive
    process where you look at an `X` (like a demo) to make a `Y` decision (like a
    record deal). Ideally, these tasks would have a lot of data, and automating them
    would bring real benefits, like saving time or freeing up resources. Automating
    the job of a talent scout, for instance, could free up resources that could be
    better utilized elsewhere.


    The main point is, `X` could be anything, as long as it’s clearly defined and
    measurable. We can build a dataset around it or use standard digital formats like
    audio or video. The key part of `Y` is that it’s a human judgment, just like a
    talent scout’s decision to sign an artist. The catch is, this judgment should
    be based solely on `X`, the input data. If it depends on additional information
    not included in `X`, then that part of the task might be hard to automate, because
    we don’t have access to this external data.


    And this isn’t just about talent scouting; it’s about spotting any potential areas
    for automation in your operations. By viewing roles through this lens, you can
    identify objectives where AI could make a massive difference, where your operations
    could see major benefits. With this mindset, you’re well equipped to kick off
    your AI projects, inspire change within your team, and disrupt your industry.


    #### The Guiding Light


    When you’re ready to dive into the automation game, having some guidelines to
    help you figure out which tasks are right for automation can be extremely handy.
    A few years ago, there was a pretty neat rule of thumb: if a regular person can
    do a task in about a second, then it’s ready for automation. But while this rule
    might sound useful, it’s not a one-size-fits-all deal. There are plenty of tasks
    that take more than a second that have parts that can be automated just fine.
    Let’s take radiology as an example—a field where human involvement usually takes
    more than a second, but certain parts of the job can be automated nicely.


    On the flip side, some tasks that take less than a second can be surprisingly
    tough to automate. Humor is a perfect example of this puzzle. For us humans, it
    might be a no-brainer, but automating humor is a big challenge. It needs a deep
    understanding of context, cultural differences, and even what’s happening in the
    real world now. Humor is a complex human experience, closely tied to our personal
    and cultural understanding of the world, making it a hard nut for automation to
    crack.


    But it’s key to remember that the world of AI is not stuck—it’s always changing.
    With the rise of advanced big language models, our edge in understanding the world
    is slowly being chipped away. These models, having swallowed up a massive part
    of the Internet, are now armed with a huge amount of context, making the job of
    automating complex functions a bit less scary.


    The main principle here is that, for a task to be ready for automation, the relationship
    between `X` and `Y` must meet three key criteria—stability, generality, and self-containment.
    The relationship needs to be stable, meaning it doesn’t change drastically over
    time. This stability allows for predictability, which is key for automation. The
    relationship should also be general enough for different individuals to arrive
    at roughly the same relationship under different situations.

