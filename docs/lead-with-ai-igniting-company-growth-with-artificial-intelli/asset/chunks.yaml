    我们可以对《蒙娜丽莎》处于这一特殊位置进行推测。也许是因为它被盗后又发现的戏剧性故事，这一事件让它推向了风中心。也许是时间的流逝和被反复观看的影响，为它带上了一层光环，使其变得越来越有名，甚至到了近乎崇拜的。但事实是，对于《蒙娜丽莎》无伦比的名声，并没有简单的答案或最终的解释。如果我们作为人类都难以解释，那么以
    AI 目前的水平，它不太可能解决这个谜题。


    作为对《蒙娜丽莎》地位的一种幽默致敬，请想一下这个事儿：金·卡戴珊 ian（Kim Kardashian）尽管拥有巨大的全球知名度，也去卢浮宫与《蒙娜丽莎》拍了自拍。当然，《蒙娜丽莎》并不回礼。这种等级是显而易见的——即使是名人也想吸收这幅世界上最名画作的余光。


    虽然这个故事为我们的对话增添了幽默色彩，但它也强调了一个重要的点：在理解人类行为、社会现象以及我们有时重视并推崇的非逻辑事物方面，AI 是有其局限性的。这是对我们文化基础中的微妙性、非理性和情感复杂性的承认——这些事物在目前很大程度上超出了
    AI 的触及范围。


    那么，接下来要做什么？这很简单：投入工作构建一个不可思议的世界——不仅是为了我们，也是为了我们之后的世后代。利用你所拥有的每一个工具去努力吧：无论是 AI、机器学习、深度学习，还是未来出现的任何其他高科技。利用这些工具让你变得更高效，并提高你所做每事的效能。


    但不要忘记你应该一直提问的三个重要问题：


    1. AI 是如何工作的？

    2. AI 真正擅长什么？

    3. 哪些事情我们不应该交给 AI 处理？


    ## 它是如何工作的？它真正擅长什么？它不能做什么？


    请理解，AI 尽管很聪明，但还没有完全准备好讲一个精彩的笑话。请记住，你自己产生新想法的能力比目前任何 AI 都要好——而且在未来很长一段时间内可能都是如此。


    请接受，虽然 AI 在帮助你进行战略规划方面可以发挥重要作用（如果你希望利用更多能力或市场时），但在完全依赖它产生突破性的、改变游戏规则的想法之前，你可能需要三思一下。AI
    可以帮助引导你，提供基于数据的洞察，这可能帮助你做出决策。但当涉及到真正的创新——那些改变规则、震动行业的想法时——AI 与人脑之间仍然存在巨大的鸿沟。


    充分利用 AI 能做到的，但不要忘记它不能做到的。在追求成功的道路上，要在机器智能和人类创造力之间寻求平衡。这就是我们如何构建一个利用双方长处的未来，确保为后世后代留下创新和进步的遗产。


    ## 我对 AI 的观点


    在考虑如何最好利用 AI 时，我形成了一种能指导我决定的特定观点。是的，AI 能够处理复杂的任务，但在涉及需要人类触感的复杂、细微的工作时，我倾向于依靠我的团队。AI
    的优势在于它有处理重型计算负荷的能力，但对于需要更深层次理解、共情和判断的事物，人类的投入仍然是不可或缺的。


    这是我的另一个指导原则：让 AI 的战略性思维被战术任务所塑造，而不是相反。作为领导者，我的责任是决定我们的战略——我们在哪里投入时间和资源、我们针对哪些客户、我们关注哪些地理市场，以及我们的方法是灵活且伴生的，还是僵化且周密计划的。决定我们的优先级、对威胁和机会的回应，以及我们如何分配可用资源，是我的决策。


    所以，尽管我非常欣赏 AI 的潜力，但在战略方面，那是我的领域。我乐意让 AI 帮个忙，分担大量的战术性工作。通过承担更多的常规、复杂任务，AI 可以有效地释放出更多属于我和我团队的精力，使我们能够专注于定义我们未来道路的关键战略决策。


    通过这种方式，AI 变成了一种战略伙伴，执行它最擅长的任务，并给我们留出空间和时间来处理那些人类洞察和判断至关重要的方面。我们最终获得了一种共生关系，AI
    和人类各展所长，从而在各方面获得更好的结果。


    ## 释放你的潜力


    手握这本书，你就拥有了一个超级工具，它可以在 AI 和商业世界中释放你的潜力。但要真正让这个工具发挥魔力，关键在于务要掌握前面提到的三个大问题的答案。


    掌握 AI 如何工作并不意味着你必须成为编程高手。它更多是关于 AI 真正擅长什么，以及哪些事情我们不应该交给 AI。当我们谈论 AI 擅长什么时，我们谈论的是它在数据分析、自动化等领域的强大，它可以发现人类可能需要几个月甚至几年才能发现的模式。


    另一方面，记住哪些不能交给 AI 至关重要。尽管 AI 非常聪明且先进，但它缺乏人类所拥深层理解、共力和判断。在需要这些人类特质的任务上，始终要把 AI 视为助手，而不是完全交给它。


    只要对这三个问题有了清晰的思路，你就准备好利用 AI 为你、你的团队以及世界创造一个美好的未来了。


    去努力吧，在世界上留下属于你的印记。


    关于作者


    **Amir Elkabir** 是软件交付和应用 AI 领域的全球专家。他曾为顶级杂志撰稿，并并在国际舞台演讲。在职业生涯中，Amir 成功领导了多项 AI
    和机器学习项目，目前在行业担任领导职务。


    Amir 是麻理工学院（MIT）校友，拥有显赫的学术背景，融合了技术和商业领域的深厚知识。目前，Amir 居住在多个全球城市，并在全球科技和商业社区中保持着活跃。


