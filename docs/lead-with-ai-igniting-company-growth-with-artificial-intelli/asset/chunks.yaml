  trans: '

    考虑为警报设置的阈值。作为系统的协调者，你必须决定：你是希望系统在流感爆发的细微迹象出现时就报警，还是应该等到迹象不可否认时？我们先假设你已经找到了正确的平衡点。


    然而，核心问题不仅仅在于 `FluSense` 的准确性。更在于这个工具将如何增强决策。我们不应该仅仅问“这个模型有多好？”，而应该问“这个系统将如何帮助我们做出更好的决策？”


    能够这样阐述系统的影响，使我们能够将其与其他潜在的解决方案进行比较。例如，如果我们考虑 `FluSense` 的变体——即在警报发送给卫生部门之前，由分析师进行验证——那么我们就可以评估潜在的结果。


    设想这样一种场景：没有发生流感爆发，系统正确识别了这一点。太棒了！一切如常。但如果发生了爆发，而系统没有检测到呢？那么，这意味着错过了干预和控制传播的机会。那么误报呢？误报现在不会引起不必要的恐慌，而只会浪费分析师的时间。


    那么当爆发发生并被正确识别时呢？嗯，分析师现在有机会在触发警报之前进行验证。但记住，分析师并非无一不的。他们可能会漏掉一些真实的爆发，或确认了误报，这也会影响系统的影响。


    通过这些现实结果来表达系统的性能，可以与最初的、无需分析师的 `FluSense` 模型进行更清晰的比较。这是对系统更接地气的评估，卫生官员可以据此对部署做出明智的决策。与其纠结于错误率等技术细节，他们可以理解实际的后果：有多少爆发会被早检测到？可能会有多少次误报？分析师的时间成本是多少？不可避免地，还会有多少爆发被漏掉？这些才是关重要的现实世界指标。


    ### 聊天机器人行为的挑战


    像 `ChatGPT` 等模型提供了一个有趣的案例。它们生成的是文本而不是提供“是”或“否”的答案，这使得很难断定判断它们的输出对错。例如，我们如何衡量像
    `ChatGPT` 这样的模型生成不当或有害内容（如仇恨言论）的倾向？


    假设你是 `OpenAI` 团队的一员，想要确保模型不会产生攻击性内容。逻辑上的第一步是识别某些不应该使用的词汇。你可以扫描模型的输出以寻找这些词汇，甚至实施规则将它们完全排除。这是一个良好的开始，但正如任何尝试过情感分析的人所知，实际上无法通过预定义的规则集来捕捉所有仇恨言论的实例。在这里，你可能会发现自己再次进入了机器学习的领域，尝试将给定的文本分类为是否仇恨。


    所以，让我们想象你正处于测试的早期，正试图评估模型生成的文本类型。你不希望出现任何仇恨内容，但如何有效地衡量这一点呢？一种简单的方法如下：


    首先，你为仇恨言论创建一个分类器。这是一个独立的机器学习模型，其唯一目的是识别给定的文本是否仇恨恨。然后，你将这个分类器应用于 `ChatGPT` 生成的文本，实际上是使用一个机器学习模型来评估另一个模型。


    人类在这个过程中也起着至关重要的作用。你会生成一组模型输出，请人类进行审查，并对他们认为是否具有攻击性的评分。这些标签有助于训练你的仇恨言论分类器。


    到此时，你基本上建立了一个二分类问题（输出是否仇恨）来评估一个开放式文本生成模型的性能。现在，你可以将类似的评估技术应用于我们之前用于二分类问题的方法上。


    从这个过程中获得的指标可以告诉你，攻击性内容可能频繁地被你的分类器漏掉并可能到达终端用户。这种方法为你提供了一种具体的方法来评估和完善像 `ChatGPT`
    等模型的行为。


    总结一下：我们关注的是评估 AI 机器学习模型，以及这些模型如何实现权衡。有时，你可能接受更多的假阳性，而另有时，你可能接受更多的假阴性。这些选择是基于现实结果的。


    现在，在某些情况下，这些结果直接与我们能观察到的错误相关联。但有时，我们需要投入额外的精力来识别和衡量这些后果。例如，对于 `ChatGPT`，并不仅仅简单地说是答案是对是错。坏的程度是有不同等级的，我们有不同的标准来评估。这要求我们自己创建特定的评估机制。


    总体想法是根据系统所能实现的决策质量来评估你的系统。像真阳性、假阳性之类的指标是很有用的，但对于正在决定要不要部署该模型的人来说，它们可能没有太大用。我们的目标应该是将这些模型指标转化为任何人都能理解并参与的现实后果。所以，问题是，我们是否可以思考部署整个系统的后果将是什么，而不是仅仅依赖描述模型性能的指标？


    ### 机器学习背后的数据评估


    我们将评估构建这些机器学习系统的数据，并深入探讨拥有良好数据究竟意味着什么。你将如何识别高质量数据？人们在尝试策划数据集时通常会犯哪些错误？


    考虑一下：一种理解数据收集如何出错的非常有意义的方法，是考虑产品评论。考虑曾深受虚假评论困扰的在线购物平台，这误导了客户并推高了产品评分。


    现在，你可能认为这些平台的主要任务是提供准确的产品评论以引导客户，对吗？

