  trans: '

    这本书不仅是一份指南；它是一次邀请，邀请你探索 AI 多元化的世界，并对其潜力、挑战以及它对我们所知的社会和生活的深远影响进行思索。这段旅程可能会有些复杂，但回报是对当今最具影响的技术之一进行透彻且细致的理解。


    ## 寻找平衡


    AI 和机器学习面临的一个重大障碍在于，如何在技术层面与其实际的真实世界应用之间取得正确的平衡。虽然许多资源和课程高度侧重于数学和计算方面，但这往往会导致它们与实际用途之间产生脱节。我的职业经历让我产生了一个至重要的认知：你不需要理解每一个细微的技术细节就能有效使用
    AI。在弥合这一鸿沟的关键思维工具正是我们经常使用但甚至没有察觉到的东西——`conceptualization`（概念化）。


    “概念化”的概念经常出现在基础编程和计算机科学课程中，但它的意义远超编程范畴。概念化本质上意味着忽略细枝末节，而专注于关注更广泛、更具通用性的概念。在编码时，我们经常使用
    `APIs` 和 `modules`，而无需担心它们的内部工作原理。这些组件被托付执行其功能，让我们能够专注于真正重要的事情——我们正在开发的应用程序。概念化的美之处在于，它能够将我们的注意力从单纯的以技术为导向，转向关注我们如何利用这些技术。


    应用概念化鼓励我们提出正确的问题，并从全新的视角观察问题。我们不再仅仅关注某个特定方面的功能——例如，是一个机器学习算法还是风能原理——而是可以探索更有效的方法来理解这些主题。概念化使我们能够在不需要理解其所有细微细节的情况下，处理复杂的设备。以风力发电机为例——它是由叶片、齿轮和电气系统构成的网络。尽管它非常复杂，但设计者明白，用户并不需要理解其运行的每一个方面。他们为我们提供了一个概念层，即一个简化的界面，带有易于遵循的指令和极少数的交互点。这种概念化允许我们操作复杂的系统，而不会迷失在具体的细节中。


    但概念化并不局限于风力发电机和其他设备。它是我们与日常技术互动的方式。当你使用笔记本电脑滚动网页时，你可能没有察觉后台正在发生的复杂过程。但当你点击电子邮件的`发送`时，你信任它会到达预想的收件人手中，即使你并不理解实现这一点的互联网协议。概念化允许你在使用这些技术时，而无需掌握每一个技术细节。


    然而，值得注意的是，概念化并非完美。它本质上涉及遗失一些细节。我们与技术元素的距离越远，就越有损害有效使用它们能力的风险。例如，如果我的电动滑板车电池没电了，而我甚至连最基本的充电知识都没有，我就会被困在途中。因此，开发在预设语境下运行良好且用户的界面和概念层至关重要。


    在书中，我们将更深入地探讨概念化如何赋能领导者理解并驾驭 AI 的力量。我们将探讨实际应用、战略考虑以及 AI 的社会影响。通过拥抱概念化并专注于其关键方面，我们可以驾驭
    AI 复杂的领域，并挖掘其产生影响性变革的潜力。通过这个过程，我们可以将 AI 视为一个令人敬畏的复杂网络，而是一个触手可及的工具，它能够促进创新和变革。


    ## 成为设计者


    我想谈谈 AI 世界的一项重要工作。这项工作目前非常需要，但还没有足够的熟练人才来胜任。我们之前讨论过不同的 AI 用法，但我们没有深入到收集数据、检查系统或规划如何部署它们等细节。然而，这些事情超级重要。通常，处理这些部分并不是工程师的工作。如果他们在处理这些问题时卡住了，那么项目在开始之前就注定失败了。这本书的目标是帮助你像设计者一样思考，而不是像程序员一样。


    ## 什么是 AI？


    *随着 AI 变得先进，成为通才而非专家将具有巨大的优势。*


    ### 人与机器的舞蹈


    在本质上，人工智能（AI）是一个先驱约翰·麦卡锡（John McCarthy）构想的想法。他将其描述为智能机器的艺术与科学，即让计算机理解并可能模拟人类智能。但重要的是，AI
    并不是试图完全复制人类大脑的工作方式。

    '
- fmt: '

    The phrase `artificial intelligence` came about in the summer of 1956. Around
    that time, a plan was hatched to bring 10 top researchers together for a summer
    brainstorm at Dartmouth College in Hanover, New Hampshire. The lead organizer
    was `John McCarthy`, who had the bold goal of tackling tricky topics like language
    and abstraction, problem-solving, and self-improvement in just a few months. The
    aim of teaching computers to think like humans, driven by the hope of huge potential
    benefits, was a massive task. But the group was full of hope. `Claude Shannon`
    of Bell Telephone Laboratories was another pivotal figure in that research collective.
    We will get to his substantial contributions to the field of generative AI later
    in this book.


    You might be wondering why they were so confident. Why did they think they could
    achieve such an amazing thing in the summer of 1956? The answer lies in the spirit
    of the time. The mid-1950s was when computers started showing serious talent in
    chess—a game traditionally seen as a test of intelligence. The thinking was simple:
    If smart people are good at chess, and computers could nail this game, then it
    wasn’t a big jump to think that computers could be taught to be intelligent.


    But does being a champ at chess really mean you’re intelligent? Back then, the
    usual plan for computer chess was to predict 15 to 20 moves ahead and pick the
    move that would result in the best board position. This plan mirrors the way that
    top chess players play, showing a key way to develop intelligence: watch human
    behavior, figure out the rules and decision-making processes behind these actions,
    and then program these rules into a machine. When computers started winning at
    chess—a game seen as complicated—it sparked the belief that AI could handle many
    tasks that humans find less challenging.


    However, as the story of AI continues, we’re finding that reality can often surprise
    us, diverging from our assumptions. We’ll dig deeper into this fascinating journey
    in the coming chapters. For now, think of AI as a flexible and powerful tool that
    isn’t tied down by human biology or behavior. This broader view will give you
    a solid base to really appreciate AI’s enormous potential, preparing you for the
    deep explorations to come.


    ## Poker and Logos


    Let’s look at a comparison, using a poker game and routine marketing tasks as
    our backdrop. At first glance, many regular marketing tasks may seem less complex
    than a game of poker. If AI can grasp the nuanced strategies and countless possibilities
    of poker, couldn’t it manage other tasks, potentially simpler ones, with equal
    efficiency? Consider the task of recognizing a company’s logo. For us, a swift
    look at a logo is usually enough. Hence, it’s reasonable to assume that a computer
    program would be exceptionally proficient at recognizing logos, a task we instinctively
    find less challenging than poker.


    With that initial thought process in mind, earlier in our century, there was an
    attempt to develop an app that can identify if a symbol in a photo is a logo,
    but many predicted that this app would take a team of developers half a decade
    to devise. Surprisingly, this prediction was spot on; it took roughly five years
    for AI to reliably recognize logos. However, it’s critical to underscore that
    this accomplishment took over 50 years from when the idea was initially proposed.
    A project initially planned for the summer of which `McCarthy` and friends came
    together ended up spanning more than five decades. So, why was this seemingly
    simple task so challenging?


    Poker, despite its intricacy, conforms to well-defined rules. Yet, the complexity
    of the real world is far greater. The rule-based approach, which relied on explicitly
    defining every possibility, proved insufficient when faced with the nuances of
    the real world. This led to the rise of machine learning, where algorithms learn
    from data rather than being explicitly programmed with rules.

    '
