  raw: 'To understand the beginnings of generative AI and language models, we need
    to time travel back to the 1940s. In those days, the idea of statistical language
    modeling was as ground-breaking as AI is in some sectors today. One pioneering
    brain behind this transformative concept was the brilliant mathematician Claude
    Shannon. The same Claude Shannon of Bell Telephone Laboratories, who also contributed
    to the seminal 1956 Dart-mouth College research with John McCarthy, discussed
    in earlier chapters.


    Shannon started his journey with a basic but powerful concept, envisioning English
    as a system made up of 26 characters and spaces, generated randomly. This idea
    is similar to the birth of a business idea—raw and somewhat tangled, but signifying
    the start of something significant.


    Through careful refinement and iterative adjustments based on feedback, Shannon’s
    model started showing promise. Identifying the sequence of characters, he made
    considerable progress toward creating text that seemed somewhat realistic. This
    is similar to a business finetuning its product to better meet market demands.


    The cycle of refining the model, shifting from characters to words, is like a
    business scaling up its operations. Shannon showed that by predicting the next
    word based on the previous one, he could put together a sequence of English words.
    While these sentences lacked logical coherence, they still looked a lot like English.
    Despite the computational limitations of his time, Shannon’s foresight paved the
    way for today’s language models.


    Let’s dig deeper now to understand how language models, like AI chatbots, work.
    Picture a gigantic spreadsheet, spreading 100,000 words wide and shooting up to
    an astounding height of 10^(20). Each cell represents a tiny possibility within
    a vast sea of potential word sequences. It’s a mind-boggling idea, right?


    However, this method turns out to be impractical. Think about tracking not just
    three, but 20 previous words. All of a sudden, the potential combinations exceed
    the total number of atoms in the known universe! This daunting challenge underscores
    the limitations of Claude Shannon’s early methodology.


