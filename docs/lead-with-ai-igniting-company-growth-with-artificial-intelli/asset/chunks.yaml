    每种方法都有其优点，但当我们面临如识别不同犬种之类的挑战时，它们都会陷入困境。我们挣扎于定义确切的规则，而且矛盾的是，检查成千上万张狗的照片并不会带来任何新的启示。因此，两种方法都无法准确提供我们所需的内容。


    这种困境将我们引向现代机器学习的核心。想象一下重新排列这两张图片以描述一个新过程：人类退后一步，直接利用数据来制定规则，而不需要人类的洞察。这种转变体现了当前机器学习的精髓。


    起初，将基于规则和统计方法结合起来似乎是合理的。你可能认为我们可以使用规则从数据中提取洞察，这反过来会扩展我们的理解并帮助我们制定更好的规则。然而，这个过程只强调了人类参与的冗余性。我们作为中介的角并没有做出任何实质性的贡献。事实上，最有效的学习发生在我们完全从过程中抽离时。我们允许从数据中得出的洞察直接塑造规则，而无需人工干预。我们变成了过程的观察者，从中获益。这种新方法展示了数据驱动规则形成的真正力量，这也是现代机器学习的基石。


    ## 算法建模与数据建模的鸿沟


    在数据科学领域，有两种主要的文化：算法建模和数据建模。理解其中的区别将帮助你明白为什么我们正在从仅仅理解数据转向使用算法进行预测。


    将传统的统计建模想象为一个过程，你从一些原始数据开始——我们称之为 `X`。这些数据经过业务运营、市场动态或经济因素的转换，导致一个我们可以看到的结果。长期以来，目标一直是预测这个结果，分析不同部分是如何结合在一起的，并确保模型符合逻辑。这有点像尝试拼图，其中的图片是由影响结果的变量组成的。


    然而，统计和机器学习领域的一些早期创新者对这种传统方法并不满意。他们认为它无法胜任我们今天面临的许多预测问题。他们建议转向一种更灵活的方法，将数据置于中心位置。这种新方法更关注做出准确的预测，而不是理解数据连接的每一个细节。


    让我们思考一些现实生活中的情况：根据经济指标预测股价、根据购买历史猜测客户行为、根据内容判断封邮件是否会被标记为垃圾邮件，甚至根据发布策略预测产品是否会成功。尽管这些问题各异，但它们都归结为同一点——使用输入来预测输出。这就是预测建模背的核心思想；无论输入是什么或如何变化，我们仍然可以对接下来将发生什么做出准确的预测。


    这种预测建模原理就像一把瑞士军刀。它可以应用于各种语境，证明了机器学习在当今预测分析中是多么重要。


    一方面，我们有数据建模文化。它像是一个侦探，总是试图理解业务世界的因果机制和底层模型。它想要知道从输入到输出转换的 `black box` 内部发生了什么。它关乎细节以及对系统内部运作的理解。


    另一方面，作为现代 AI 的算法建模文化不会为这个 `black box` 内部发生了什么而担心。它的主要工作是做出准确的预测，而无需过多担心涉及的规则。这种文化关乎近似世界现有的规则，而对理解或精确描述这些规则的关注较少。它就像是直指终点，而不太在意旅程。


    现在，这可能看起来有些令人沮丧，特别是因为它没有关注数据内部的因果关系。但它的主要目标非常明确——做出我们可以信赖的预测。


    这种方法可能并不是所有人都能接受，但它代表了一种务实的、结果为导向的心态，符合当今行业的节奏。它支持了这样一个观点：实用性比完全理解更重要，做出准确的预测比解释一切更有价值。归根结底，最重要的不是我们是如何获得结果的，而是结果本身。而且，在我们数据驱动的世界里，做出准确预测的能力变得越来越有价值。


    ## 算法对比数据建模


    让我们通过另一个不同的例子来深入探讨算法建模和数据建模文化之间的差异。假设我们正在尝试预测一家零售业务的销售额。这里有一个价值 10 万美元的问题：我们需要完全理解消费者行为的细微差别，还是说仅仅做出准确的预测就足够了？这就是算法建模的精髓。


    但不要忘记，数据建模方法绝对还有空间，特别是当我们试图预测销售额时。这些场景需要的不仅仅是预测；它们需要对因果关系的理解。在这些情况下，关注理解和清晰度的数据建模可能会胜出。


    然而，机器学习并不是什么魔幻解决方案。它可能会下简单的错误，因为它不具备人类拥有的自然理解力。机器学习模型可以根据它从数据中检测到的模式做出预测，但它并不总是理解这些模式背后的“为什么”。它就像一只会模仿词汇但不理解其含义的鹦鹉。


    机器学习的真正力量来自于它的程序化和算法本质。它具有令人印象的能力，可以从输入预测输出，而无需理解中间发生了什么。这使得它成为许多任务的强大工具，这些任务的主要目标并不一定是理解整个过程，而是准确预测结果。


    ## 在数据主导的世界中破解


    数据科学是一个令人兴奋的领域，充满了惊喜的转折。以 Netflix 的推荐算法为例。它并不遵循人类制定的规则，而是直接从数据中创建自己的规则。机器学习负责制定规则，然后我们可以回过来看这些规则，看看是否能学到新东西。但随着这些规则变得日益复杂且数量众多，我们检查每条规则的能力开始下降。

