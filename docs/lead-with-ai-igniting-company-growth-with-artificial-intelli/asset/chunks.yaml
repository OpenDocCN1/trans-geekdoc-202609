    这里的核心观点是，受限结果（restricted outcomes）问题有多种形式，反映了决策影响我们能看到的结果范围的广泛背景。通过理解这些变化，我们可以设计出更有效地处理这些场景的机器学习系统。


    ## 受限结果问题的重要性


    受限结果问题的真正问题在于数据不足——或者更准确地说，缺失了群体中某些部分的样本标签。这个问题类似于试图在一张丢失了一半地图的迷宫中寻找出路——你缺乏了可能从根本上改变你决策的关键信息。


    考虑一下那些我们没有信息的人：比如那些没有获得大学录取的人、没有获得工作录用通知的人，或者项目提案没有获得绿灯的人。问题的问题的核心在于，我们不知道如果我们选择了不同的路径，可能会发生什么。换句话说，我们永远无法窥见这些人的
    `what-if`（如果……怎样）情景——即那些替代的现实。


    让我们回到大学录取的例子。我们永远无法真正发现那些未被录取的人是否会在学业上表现出色。即使你的模型在判断谁会成功、谁不会成功方面非常准确，也没有万无一失的方法来验证这一点。如果模型出错了了呢？如果你拒绝了太多本可能表现出色的人入学，并没有真实的方法可以发现这些失误。你永远看不到替代的结果——即如果你做出不同的选择会发生什么。


    这使得受限结果问题变成了一个非常隐蔽的问题，因为这意味着失误可能不会被察觉。如果没有反馈，你的模型可能会持续偏离正确道路，导致错误决策的循环。如果你没有使用全量的数据集，那么你构建的任何模型自然都会与目标存在偏差，这可能会带来巨大的麻烦，特别是在教育或商业等关键领域。因此，理解并解决受限结果问题，是任何使用预测模型的决策过程中至关重要的一步。


    ## 我们有哪些选择？


    当我们开始与受限结果问题斗争时，我们需要仔细思考如何才能最好应对这种棘手的局面。让我们来看看一些人们在领域内常用的几种策略。我们将解释每种策略，讨论它们在现实情况中如何使用，并找出每种策略的优势所在。


    最流行的方法（在我看来这是最低的解决方案）是简单地什么都不做。这可以被称为 `launch and pray`（发布并祈祷）方法。选择这种方法的唯一充分理由是，当你做决策时存在很大程度的随机性。


    换句话说，如果你的决策没有一致地将大量人群排除在标签收集之外，那么这种策略可能效果还可以。为了清楚起见，让我们切换到教育系统和大学录取预测。在现实生活中，这些系统的成功与否是根据招生官决策的差异程度来衡量的。


    招生官毕竟是人，他们的决策中自然带有一丝随机性——他们都有评估申请者的独特方式。如果你只为一位招生官部署了录取预测模型，要确定它的性能如何将是非常挑战性的。但是，如果你有（比如）10
    位招生官，他们都按照自己的方式解释预测结果——有些人可能会忽略预测。


    这使得受限结果问题变成了一个非常隐蔽的问题，因为这意味着失误可能不会被察觉。如果没有反馈，你的模型可能会持续偏离正确道路，导致错误决策的循环。如果你没有使用全量的数据集，那么你构建的任何模型自然都会与目标存在偏差，这可能会带来巨大的麻烦，特别是在教育或商业等关键领域。因此，理解并解决受限结果问题，是任何使用预测模型的决策过程中至关重要的一步。

