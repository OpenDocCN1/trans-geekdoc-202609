- fmt: "\n- Data Privacy and Ethical Queries: The abundance of digital data brings\
    \ its own set of hurdles, including surveillance, privacy, and fair representation.\
    \ It’s vital to keep these issues at the forefront when collecting data. \n- Grasping\
    \ Inputs, Outputs, and Data Source: Understanding what the inputs and outputs\
    \ are, and where the data originate from, is an essential part of comprehending\
    \ the model. This understanding enables you to effectively tweak and troubleshoot\
    \ the model.\n\n## Under the Hood](#contents.xhtml#chapter-03)\n\n*We are at a\
    \ time where the algorithms write the code that improves the algorithm.*\n\n###\
    \ A Quick Refresher\n\nBefore we dig in further, let’s take a moment to go over\
    \ what we’ve covered so far. Remember when we started? We identified particular\
    \ problems, a combination of inputs and outputs, and we gave them to what we called\
    \ a training algorithm. This algorithm will then evolve into a model, which is\
    \ a handy tool that can take on tasks like sorting or predicting. It just needs\
    \ a set of inputs to make predictions. That’s machine learning in a nutshell.\n\
    \nWhat’s cool about this is the way it can adapt to loads of tasks that we come\
    \ across in our daily life. Imagine being able to predict if someone’s going to\
    \ fail to pay back a loan, or if a student is likely to ace their exams, or even\
    \ if a former criminal is likely to return to crime. The range of possibilities\
    \ is huge and really interesting.\n\nYet, despite this interest, we often avoid\
    \ trying to understand the ins and outs of what’s `under the hood`, to figure\
    \ out how it works. Our main way of controlling it tends to be the kind of data\
    \ we give it—the food for the beast. Remember when we talked about how crucial\
    \ it is to understand a system’s inputs and outputs? If you can’t nail them down\
    \ accurately, you’re basically sailing in the dark. The aim is to map your inputs\
    \ as accurately as your tools allow.\n\nEarlier, we also began making a cheat-sheet—a\
    \ set of key questions that you should be able to answer about any system. If\
    \ these questions leave you stumped, it’s a warning sign that it’s time to dig\
    \ deeper, to understand the maze of the system’s inner workings. These questions\
    \ revolve around the inputs and outputs—how the outputs are made, what real-world\
    \ measurements bring the system to life, and where the data comes from and how\
    \ well it’s been cared for.\n\nIt’s worth repeating that machine learning isn’t\
    \ like your usual programming, where code is king. Instead, in the world of machine\
    \ learning, the code, nestled in the training algorithm, is pretty much standardized.\
    \ The secret to getting the system to do what you want is to show it, through\
    \ examples, what you want it to do. This might seem tricky, but it often turns\
    \ out to be the toughest part of working with modern machine learning systems.\
    \ Training algorithms, expertly shaped by the pros, are readily available to us—stored\
    \ in countless Internet libraries. The real challenge isn’t finding the algorithm—it’s\
    \ finding the right data to solve the problem you’re trying to fix.\n\n## Peeling\
    \ Back the Layers With Case Studies\n\nLet’s look at the world of online shopping.\
    \ Picture this: we’re trying to guess what a customer might want to buy next based\
    \ on what they’ve bought before. Sounds pretty straightforward, right? You put\
    \ in the customer’s past purchases, and boom, out pops a suggestion, like `ecofriendly\
    \ products` or `luxury items`. But, once you start to dig into what’s really going\
    \ into and coming out of this system, things get a bit tricky. Ever thought about\
    \ where these product recommendations come from? If you’re no shopping guru, you\
    \ might need to use extra information, like customer reviews or surveys, and use\
    \ those results as your labels.\n\nThe accuracy of your labels really depends\
    \ on how well the retailer knows their customers. If the retailer misses some\
    \ hints about changing customer tastes, your model will be left in the dark. On\
    \ the other hand, customer reviews might reveal trends that aren’t quite so obvious.\
    \ These small things can make a big difference to your results.\n\nWe’ll take\
    \ a closer look at these details, especially the way that labels made using human\
    \ judgment stack up against labels pulled straight from the data. So far, we’ve\
    \ been pretty chill about our labels—tagging `eco-conscious` or `luxury-lover`\
    \ without really thinking about where this information comes from. But the more\
    \ we get into it, the more we see the limits of different methods and how they\
    \ can shape what we’re able to do.\n\nThink about farming. In places where the\
    \ weather’s been all over the place because of climate change, farmers have had\
    \ to switch up their planting plans. One idea that came up was to predict crop\
    \ yields based on weather patterns and soil conditions. How would you map out\
    \ the inputs and outputs here? Where would you get the data? What exactly are\
    \ you trying to guess?\n\nLet’s say you’re trying to guess a farmer’s crop yield.\
    \ What information would you need to make this guess? Would you just use their\
    \ past yields and weather records?\n\nTo build the model, you’d feed these pairs\
    \ of `X` and `Y` (the weather and soil conditions and their related yields) into\
    \ your training algorithm. This data, taken from databases or spreadsheets of\
    \ crop records and weather reports, gets crunched by your training algorithm to\
    \ spit out the model you want.\n\nIt’s crucial to think about the effects of the\
    \ data we use to train these models. Thinking back to the farming example, one\
    \ big factor that might slip through the cracks is the farmers’ access to modern\
    \ farming tech. This is a big deal because it often shows differences in resources\
    \ among farmers and tells us more about their farming practices. Farmers with\
    \ less resources might have higher or lower yields than expected based on the\
    \ tools or methods they use. Ignoring this key factor can mess up your predictions.\n\
    \nThis goes to show that, even if we don’t know the ins and outs of the model,\
    \ we can still spot potential issues as long as we know what data is being used.\
    \ This naturally brings us to our next big question—how should we use these predictions?\n\
    \nOf course, we can create a system to guess crop yields, but whether this is\
    \ ethical or not depends on how we use it. If these predictions are used to interfere\
    \ with market prices, it could make existing inequalities in farming even worse.\
    \ But if these predictions are used to help farmers who need extra support, it\
    \ could lead to more equal farming results. Therefore, how we use these predictions\
    \ is a key factor in deciding whether such a system is ethical or not.\n\n###\
    \ A Case of Content Moderation\n\nNow let’s turn our attention to the impact of\
    \ machine learning on the rapidly growing world of social media. As the digital\
    \ landscape keeps getting bigger, social media platforms are turning to machine\
    \ learning to help with the huge job of managing content. Let’s take a look at\
    \ Facebook’s journey. In the beginning, the company hired thousands of people\
    \ whose main job was to manage the massive amount of content. They had to wade\
    \ through endless streams of posts, marking each one as either adhering to the\
    \ platform’s content rules or not.\n\nThese marks, the `Y` in our inputs and outputs,\
    \ create a treasure trove of data for a machine learning system. The `X` here\
    \ would be the text, image, or video of the post, while the `Y` is a tag that\
    \ tells us if the content breaks the platform’s rules. This system is the foundation\
    \ of most online content management processes today.\n\nIt’s important to remember\
    \ that when a platform boasts about using AI for content management, it’s simply\
    \ automating the previously human-led process of checking content. The AI or machine\
    \ learning model isn’t bringing anything new; it’s just reflecting the data given\
    \ by human reviewers, but on a much larger scale.\n"
  raw: '• Data Privacy and Ethical Queries: The abundance of digital data brings its
    own set of hurdles, including surveillance, privacy, and fair representation.
    It’s vital to keep these issues at the forefront when collecting data.


    • Grasping Inputs, Outputs, and Data Source: Understanding what the inputs and
    outputs are, and where the data originate from, is an essential part of comprehending
    the model. This understanding enables you to effectively tweak and troubleshoot
    the model.


    [**Under the Hood**](#contents.xhtml#chapter-03)


    *We are at a time where the algorithms write the code that improves the algorithm.*


    **A Quick Refresher**


    Before we dig in further, let’s take a moment to go over what we’ve covered so
    far. Remember when we started? We identified particular problems, a combination
    of inputs and outputs, and we gave them to what we called a training algorithm.
    This algorithm will then evolve into a model, which is a handy tool that can take
    on tasks like sorting or predicting. It just needs a set of inputs to make predictions.
    That’s machine learning in a nutshell.


    What’s cool about this is the way it can adapt to loads of tasks that we come
    across in our daily life. Imagine being able to predict if someone’s going to
    fail to pay back a loan, or if a student is likely to ace their exams, or even
    if a former criminal is likely to return to crime. The range of possibilities
    is huge and really interesting.


    Yet, despite this interest, we often avoid trying to understand the ins and outs
    of what’s *under the hood*, to figure out how it works. Our main way of controlling
    it tends to be the kind of data we give it—the food for the beast. Remember when
    we talked about how crucial it is to understand a system’s inputs and outputs?
    If you can’t nail them down accurately, you’re basically sailing in the dark.
    The aim is to map your inputs as accurately as your tools allow.


    Earlier, we also began making a cheat-sheet—a set of key questions that you should
    be able to answer about any system. If these questions leave you stumped, it’s
    a warning sign that it’s time to dig deeper, to understand the maze of the system’s
    inner workings. These questions revolve around the inputs and outputs—how the
    outputs are made, what real-world measurements bring the system to life, and where
    the data comes from and how well it’s been cared for.


    It’s worth repeating that machine learning isn’t like your usual programming,
    where code is king. Instead, in the world of machine learning, the code, nestled
    in the training algorithm, is pretty much standardized. The secret to getting
    the system to do what you want is to show it, through examples, what you want
    it to do. This might seem tricky, but it often turns out to be the toughest part
    of working with modern machine learning systems. Training algorithms, expertly
    shaped by the pros, are readily available to us—stored in countless Internet libraries.
    The real challenge isn’t finding the algorithm—it’s finding the right data to
    solve the problem you’re trying to fix.


    **Peeling Back the Layers With Case Studies**


    Let’s look at the world of online shopping. Picture this: we’re trying to guess
    what a customer might want to buy next based on what they’ve bought before. Sounds
    pretty straightforward, right? You put in the customer’s past purchases, and boom,
    out pops a suggestion, like *ecofriendly products* or *luxury items*. But, once
    you start to dig into what’s really going into and coming out of this system,
    things get a bit tricky. Ever thought about where these product recommendations
    come from? If you’re no shopping guru, you might need to use extra information,
    like customer reviews or surveys, and use those results as your labels.


    The accuracy of your labels really depends on how well the retailer knows their
    customers. If the retailer misses some hints about changing customer tastes, your
    model will be left in the dark. On the other hand, customer reviews might reveal
    trends that aren’t quite so obvious. These small things can make a big difference
    to your results.


    We’ll take a closer look at these details, especially the way that labels made
    using human judgment stack up against labels pulled straight from the data. So
    far, we’ve been pretty chill about our labels—tagging *eco-conscious* or *luxury-lover*
    without really thinking about where this information comes from. But the more
    we get into it, the more we see the limits of different methods and how they can
    shape what we’re able to do.


    Think about farming. In places where the weather’s been all over the place because
    of climate change, farmers have had to switch up their planting plans. One idea
    that came up was to predict crop yields based on weather patterns and soil conditions.
    How would you map out the inputs and outputs here? Where would you get the data?
    What exactly are you trying to guess?


    Let’s say you’re trying to guess a farmer’s crop yield. What information would
    you need to make this guess? Would you just use their past yields and weather
    records?


    To build the model, you’d feed these pairs of X and Y (the weather and soil conditions
    and their related yields) into your training algorithm. This data, taken from
    databases or spreadsheets of crop records and weather reports, gets crunched by
    your training algorithm to spit out the model you want.


    It’s crucial to think about the effects of the data we use to train these models.
    Thinking back to the farming example, one big factor that might slip through the
    cracks is the farmers’ access to modern farming tech. This is a big deal because
    it often shows differences in resources among farmers and tells us more about
    their farming practices. Farmers with less resources might have higher or lower
    yields than expected based on the tools or methods they use. Ignoring this key
    factor can mess up your predictions.


    This goes to show that, even if we don’t know the ins and outs of the model, we
    can still spot potential issues as long as we know what data is being used. This
    naturally brings us to our next big question—how should we use these predictions?


    Of course, we can create a system to guess crop yields, but whether this is ethical
    or not depends on how we use it. If these predictions are used to interfere with
    market prices, it could make existing inequalities in farming even worse. But
    if these predictions are used to help farmers who need extra support, it could
    lead to more equal farming results. Therefore, how we use these predictions is
    a key factor in deciding whether such a system is ethical or not.


    **A Case of Content Moderation**


    Now let’s turn our attention to the impact of machine learning on the rapidly
    growing world of social media. As the digital landscape keeps getting bigger,
    social media platforms are turning to machine learning to help with the huge job
    of managing content. Let’s take a look at Facebook’s journey. In the beginning,
    the company hired thousands of people whose main job was to manage the massive
    amount of content. They had to wade through endless streams of posts, marking
    each one as either adhering to the platform’s content rules or not.


    These marks, the Y in our inputs and outputs, create a treasure trove of data
    for a machine learning system. The X here would be the text, image, or video of
    the post, while the Y is a tag that tells us if the content breaks the platform’s
    rules. This system is the foundation of most online content management processes
    today.


    It’s important to remember that when a platform boasts about using AI for content
    management, it’s simply automating the previously human-led process of checking
    content. The AI or machine learning model isn’t bringing anything new; it’s just
    reflecting the data given by human reviewers, but on a much larger scale.'
