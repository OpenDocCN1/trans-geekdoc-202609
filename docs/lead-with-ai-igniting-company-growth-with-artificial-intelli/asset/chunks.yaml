    do. They deploy chatbots to handle most of these familiar requests, based on their
    experience with what customers usually need help with. This leaves the human tech
    support team free to deal with the more complex, oddball problems. It’s all about
    letting AI tackle the regular stuff and letting humans deal with the unique, one-of-a-kind
    cases.


    The same idea works well in areas like automated captioning and voice recognition.
    When we speak, we often use a bunch of common words again and again. AI is pretty
    nifty at spotting and transcribing these words. Sure, it might have a tough time
    with unusual slang or specialized jargon, but it handles the everyday language
    like a champ. And that’s what counts most of the time.


    But it’s not just about simple tasks like voice recognition and tech support queries.
    This principle is at play even in high-tech systems like an AI restaurant table
    booking service. You might think making a reservation could lead to all sorts
    of different chats, right? But in reality, most of these conversations stick to
    a few main details—how many diners, what date and time, and any specific seating
    needs. The AI booking service might trip up with more rare requests, but it nails
    it for the majority of standard reservations.


    So what’s the key lesson here? The Pareto principle is like a secret superpower
    for AI. It tells us that we can achieve a lot by zooming in on a small set of
    common patterns and leaving the unique, out-of-the-ordinary stuff to humans. It’s
    like a global positioning system (GPS) guiding us along the quickest route to
    automating the things that really matter. This helps us decide where to point
    our AI efforts, making our AI tools more efficient and helping them excel at what
    they do best.


    The Impact on AI


    The point we’re discussing in this section is like a secret sauce that’s added
    to various aspects of life and fields of study. It tells us that a tiny bit of
    something can often lead to a whole lot of something else. And although it sounds
    simple, this principle packs a punch when it comes to shaping the ways we use
    AI.


    One of the main hurdles we face with perfecting AI is dealing with the *long tail*,
    or the rare or unique situations that don’t happen very often. This is one of
    the reasons why we don’t see self-driving cars everywhere yet. Sure, the AI that
    drives these cars can handle normal driving scenarios and most highways. But when
    it comes to driving, we need super high levels of accuracy because safety is at
    stake. The tricky part is coming up with a smooth system that lets a human driver
    take over when the AI encounters a strange or dangerous situation it can’t handle.
    And let’s face it, reaching 100 percent perfection is pretty much impossible,
    given all the different driving conditions and potential emergency situations
    that could pop up in the long tail.


    So, given this reality, it makes more sense to look for places where we can use
    AI, even if it’s not 100 percent perfect. In other words, we need to find situations
    where an 80 or 90 percent success rate is good enough.'
