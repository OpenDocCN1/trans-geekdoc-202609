    将 `GPT` 转换为像 `ChatGPT` 这样的对话式 AI 是通过微调实现的。在构建一个 AI 模型时，过程始于利用海量的互联网文本和我们拥有的强大计算能力，构建一个稳健的下一个词预测器（如
    `GPT`）。训练这些模型需要投入大量的资源和时间，像 `GPT` 这样的产品需要数年的计算工作和巨额资金。目前，只有少数机构有能力承担这项资源密型型任务，这导致了模型训练在某种程度上的集中。


    一旦 `GPT` 得到良好开发，下一步就是将其转化为更具专业性的形态，例如 `ChatGPT`。这里的秘诀在于针对你追求的目标精心设计一个特定任务的数据集。例如，如果你目标是创建一个机器人，你就会生成可能的机器人问题和答案，创建一个易于管理的数据集进行额外精炼。对于专业领域（如法律分析）的任务，基础
    `GPT` 模型可能并不够用。然而，通过精选的法律问题问答数据集，你可以对模型进行微调，以提升其在你所在领域的性能。


    这种微调过程涉及基于特定任务数据集对模型进行逐步精炼，在 `GPT` 坚实的基础上进行。该过程始于海量的互联网文本和原始的下一个词预测器。从这个庞大的主体中，提取出一个较小、更集中的数据集。然后将该数据集通过一个与初始训练算法相同的微调算法，得到一个专门针对当前任务精炼的模型。这种策略允许创建特定任务模型，与原始
    `GPT` 训练数据集相比，它们所需的数据少得多。


    在 `ChatGPT` 的情况下，使用了一个由交互式提示和回答组成的独特数据集。从 `GPT` 模型开始，模型经过几个阶段的微调，最终产生 `ChatGPT`。这一微调过程体现了从通用的预测性
    AI 模型转向更聚焦、更有效的对话式 AI 模型的微妙艺术。


    ## 精炼任务


    想象你拥有 `ChatGPT` 的访问权限，但你希望对其进行定制，以更好地适应你的独特需求。计划是什么？你可以向它提供额外数据，即你喜欢的类型的问题和答案，引导模型产生更符合你个人偏好的响应。但这并像初看起来听起来那么简单。基本上，你是在向原始的
    `GPT` 训练示例中投出几颗“变化球球”，随着你添加更多示例，模型开始越来越向你的目标结果对齐。这些额外数据轻微地将模型的注意力从仅仅猜测下一个词，引导到以更准确匹配你预期响应的方式进行猜测。


    现在，考虑到策备专业领域数据集所需的精力，为什么最初还要大费力地创建一个巨大的词汇预测器的巨型任务呢？原因在于用于预测下一个词的数据量极其巨大，其数量远大于为机器人等特定任务所能收集的数据。此外，创建基础模型并不是一项单人任务——已经有小组向这项工作投入资源。即使所有用于预测下一个词的数据并不都直接与你的特定任务相关，它们也奠定了坚实的基础。通过精通预测下一个词，模型学会了输出语法正确的文本，这种技能需要大量的时间和数据才能习得。这为你提供了一个踏脚石，你可以通过它引导模型完成你的特定任务。这里的关键结论是：一大堆某种相关性的数据，配合一小部分高质量、任务特定的数据，其效果往往比单独的一小部分高质量数据要好。这一原理支撑了诸如
    `Harvey`（`OpenAI` 的法律分析工具）以及流行的 `ChatGPT` 等应用——它们都利用了微调的力量。


    混合这两种不同类型的数据是一项关键的平衡艺术——它关如何在通用与特定之间找到平衡点。这让你能够创建一个动态的、精炼的智能，可以应对各种情况。广泛知识库与严密精选的特定集合相结合，驱动了
    `Harvey` 和 `ChatGPT` 等技术的发展，允许它们不断表现出色。正是这种扩张与特定的汇，赋予了这些工具令人惊叹的技能。这种平衡真正体现了 AI
    令人兴奋的演变，将其从一个简单的文本预测器转变为见见对话的生成器。


    ## 在数字迷宫中寻找知识


    在当今复杂的数字格局中，我们经常发现自己处于一种奇特的左右为难地。我们沉浸在信息的海洋中，但在需要时尝试找到所需的确切片段，感觉就像大海捞针。这种状况凸显了一个共同的障碍——有效利用公司集体记忆的挑战。当这些模型吸收公司的通信内容时，它们基本上充当了一个活跃的、可搜索的档案。这可能导致花费大量时间重新发现解决方案，而信息往往会被遗忘。


    想象一个加入项目的新员工。她遇到了一个她认为以前遇到过的技术障碍。在通常情况下，她可能不得不翻阅一堆邮件线程或依赖同事。在海量文本上训练的语言模型可以产生针对用户查询的非常准确的响应。这允许她的
    AI 模型快速调出（比如）两年前关于相同技术问题的讨论。至关重要的是这些模型获取的是上下文，而不仅仅是关键词。它们可以提供比普通搜索工具更细致的响应，在提供精确答案的同时提供相关的对话。然而，部署这些模型带来了一些重要的考量。数据隐私和机密问题变得绝对至关重要。公司需要确保在对内部聊天进行模型训练之前，已经建立了强大的数据匿名化步骤和权限结构。


    使用语言模型提供了一种强大方法，可以解锁隐藏在公司内部通信中的信息。它将存档聊天转化为动态、可访问的知识库，有效地利用了公司的集体记忆。


    ## 关键结论


    • 生成式 AI 的魔力：像 `GPT` 这样的生成式 AI 模型通过预测序列中的下一个词来发挥魔法。这种技能是它们的秘诀，让它们能够创建连贯且有意义的文本。


