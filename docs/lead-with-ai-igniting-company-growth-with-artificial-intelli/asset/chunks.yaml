- fmt: '

    In the world of data collection, labeling errors can often serve as a major stumbling
    block. In the context of our framework, a labeling error transpires when the data
    you measure isn’t really the data you need. This kind of error crops up frequently,
    given that there’s often a gap between the data we are able to measure and the
    data we desire to measure. In essence, we often find ourselves measuring proxies
    for the things we want.


    Here’s the catch, though: machine learning isn’t a magic wand to correct this
    discrepancy. Contrary to what some might wish, machine learning doesn’t predict
    what we want it to predict, it predicts what we have measured. It’s an extremely
    literal tool, devoid of common sense. If your measurements are incorrect, your
    predictions will naturally follow suit.


    This mismatch between our desired measurements and the actual measurements surfaces
    quite often, especially on digital platforms. For instance, many online services
    aspire to gauge their performance based on user satisfaction. However, what they
    typically end up measuring are user activities, such as clicks or video views.
    It’s important to recognize that these metrics don’t necessarily correlate. Just
    because a user watched a video doesn’t mean they derived satisfaction from it.


    ### Understanding Nonrandom Data Sampling


    In practical scenarios, data sampling is often nonrandom and might consist of
    what is conveniently available, which introduces its inherent biases. Let’s take
    an example from social media advertising to understand this.


    Imagine you’re an advertiser looking to create a machine learning model that predicts
    the effectiveness of various ad creatives based on previous campaigns. You might
    rely on historical data from your company’s past social media advertising campaigns.
    However, this data would predominantly represent the kind of creatives your company
    has favored in the past and the audiences they have targeted, rather than a representative
    sample of all possible creatives and all potential audiences.


    Let’s say your company primarily uses static images for social media ads, and
    these images are overwhelmingly product-centric. If you train your model on this
    data, it might perform poorly when predicting the effectiveness of video ads or
    ads focusing on lifestyle or storytelling. Similarly, if your historical data
    primarily involves campaigns targeting a particular demographic, your model might
    struggle to accurately predict the effectiveness of campaigns aimed at a different
    demographic.


    This illustrates how our `convenient sample` can be biased. We end up with a view
    of ad effectiveness skewed by the preferences and strategies historically employed
    by our company.


    #### do these suboptimal samples occur?


    There are various reasons. One reason is underinvestment in data collection. For
    instance, companies might use readily available historical data without supplementing
    it with broader data sources. A large part of progress in machine learning has
    been driven by dedicated efforts to gather high-quality, representative data.


    Another reason is that deployment environments often differ significantly from
    those seen in the data collection phase. This is common in cases where companies
    expand their offerings to new markets or demographics.


    Yet another challenging scenario arises when it is fundamentally difficult to
    collect unbiased data. This often occurs when our observations are biased due
    to the actions we take. A situation like this is referred to as `selective labels`.
    For instance, if you’re using data to inform hiring decisions, you typically only
    have reliable data on individuals you hired, not on those you you rejected. Similarly,
    in lending, you only have repayment data on those to whom you granted loans, not
    on those you turned down. This type of selective labeling poses a significant
    challenge for obtaining representative samples, as the very nature of the problem
    limits the representativeness of the data you can collect.


    ### Addressing Sample Bias


    One approach for mitigation that some choose to follow is simply to deploy the
    model and cross their fingers. This tactic is based on the hope that the sample
    bias won’t critically impact the model’s performance in real-world scenarios.
    It’s worth noting, however, that this is often an unreliable and risky method.


    A more calculated strategy is to launch the model while also ensuring that a thorough
    monitoring framework is in place. This framework would allow for continual feedback
    and additional data collection. As an example, consider a recommendation system
    on a streaming platform like Netflix. Users can provide direct feedback if the
    recommended shows or movies don’t match their interests. This feedback helps the
    system understand where it’s going wrong and adjust its predictions accordingly.


    Another effective strategy is to assign levels of uncertainty to your model’s
    predictions. Instead of having your model produce a binary output, it can have
    a third option like `uncertain`. For instance, in weather forecasting, if a model
    cannot definitely predict if there will be rain or sunshine, it could predict
    `uncertain`. This would then warrant a human meteorologist to examine the data
    and make the final prediction. Similar systems can be seen in aviation autopilot
    systems, which hand back control to the human pilot when they encounter uncertain
    or risky situations.


    Finally, the most conservative strategy when dealing with unbalanced samples is
    to hold back on deploying the model. Instead, resources should be invested in
    collecting better, more representative data. For instance, in the field of market
    research, firms might insist on a minimum quality of data before they consider
    building a predictive model. If the quality isn’t up to the mark, the firm might
    advise their client to enhance their data collection strategies and come back
    when they have more robust data.


    ### Key Takeaways


    - **Decoding Models**: Understanding the nuts and bolts of machine learning models
    is important, but it doesn’t stop there. It’s just as crucial to predict and assess
    how these models perform when they step out from theory and into practice.

    - **Two Sides of the Coin**: When it comes to binary classification problems,
    don’t fall into the trap of judging a model’s performance by its accuracy alone.
    This narrow viewpoint overlooks the different impacts of errors. Always weigh
    the importance of false positives and false negatives, acknowledging that each
    carries its unique consequences.

    - **The True Cost of Errors**: In evaluating the cost of errors, it’s easy to
    focus on the impact on the decision maker. However, remember that individuals
    and society as a whole also bear the brunt of these errors.

