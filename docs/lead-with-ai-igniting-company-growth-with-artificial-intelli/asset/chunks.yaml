- fmt: '

    Fast forward to 2023, and some of our most crucial models have become so sophisticated
    that it’s not feasible to fully examine them. But this doesn’t mean these models
    are outdated or worthless. It’s quite the opposite. Despite their complexity,
    these models are still vital tools in our data-centric world. The answer isn’t
    to toss them aside because they’re tough to comprehend, but to adjust our approach
    to handling them.


    When we try to avoid unexpected problems that could cause harm, ensuring safety
    becomes our top priority. Let’s think about customer product review analysis as
    an example. Even though we can’t entirely comprehend the process, we can still
    examine the data and get a sense of which words are associated with positive or
    negative reviews. Occasionally, we might stumble upon surprises, like the term
    `sick`, which in some contexts, can have positive connotations.


    These unexpected outcomes show that our understanding of language and its nuances
    is far from perfect. For instance, we might not have initially thought of emojis
    as a helpful predictor in customer review analysis. But upon examining the data,
    it’s clear that emojis hold a lot of predictive power. Similarly, when we’re trying
    to tell different customers apart, specific phrases and language styles can significantly
    impact our predictions. This reminds us that our understanding of language and
    our ability to set rules might not be as complete as we believe.


    This raises an intriguing question: Do we need to understand what’s happening
    behind the scenes? In some scenarios, the answer might be no. But there might
    be situations where understanding the underlying process is vital for drawing
    meaningful conclusions or making trustworthy predictions.


    A crucial lesson we can take from these observations is that language analysis,
    like customer review analysis, can be treated like any other data. We can apply
    this approach to any language, even those we’re unfamiliar with, without needing
    to understand the language itself. It’s like the way an intelligent alien might
    analyze our languages: They wouldn’t have any preconceived notions about it but
    would nonetheless be able to detect patterns and rules.


    But that doesn’t mean all rules are irrelevant. Some areas, like algorithmic trading,
    still heavily rely on well-established rules. So, it’s vital to understand the
    difference between what we call `open-world` problems, where the rules are unclear
    or hard to nail down, and `closed-world` problems, where the rules are known and
    straightforward. Open-world problems include areas like finance, social media
    trends, climate change, certain aspects of physics, and sensor data. Closed-world
    problems are more about well-defined and controlled environments.


    In the constantly evolving world of AI, both algorithmic and data modeling continue
    to advance and shape our understanding. Both have their strengths and weaknesses,
    but together, they provide a comprehensive picture of the world and our role in
    it. As we continue exploring these two cultures, the fascinating interplay between
    rules, understanding, and data in intelligence keeps spinning an engaging tale.
    It’s a narrative that’s steering the course of AI and our journey toward a data-driven
    world.


    ## Key Takeaways


    - **AI’s Many Hats**: AI isn’t just about building machines that can think like
    humans. It’s a varied field that’s about creating systems that can boost our abilities,
    tackle complex problems, and make decisions on their own.

    - **AI’s Two Pillars**: AI is built on two basic principles. The first is about
    making rules based on our understanding of a problem and then programming these
    rules into a machine. The second approach, which is the main one, is data-driven.

    - **Moving to Data-Driven**: As AI models get more complex, the way we manage
    them needs to change. Ensuring everything is safe and protecting against unexpected
    problems become key.

    - **The Role of Statistics**: Machine learning, a term that keeps popping up in
    AI discussions, has played a big part in shaping the AI world we see.

    - **Two Sides of AI**: AI is divided into two camps—algorithmic, which is about
    rules, and data, which is about predictions.

    - **Open-World Versus Closed-World**: It’s important to understand the difference
    between `open-world` problems, where the rules are unclear or hard to nail down,
    and `closed-world` problems, where the rules are known and straightforward.

