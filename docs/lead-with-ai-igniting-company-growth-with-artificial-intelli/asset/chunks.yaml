  raw: 'In a multitude of instances, AI doesn’t function independently. Despite common
    perceptions, many applications involve direct human participation. Only in a handful
    of areas, such as content moderation and curation on digital platforms, does AI
    primarily operate to decide what content users view on its own. However, in most
    other circumstances, humans play an active role. Consequently, we need to contemplate
    the role humans ought to assume and how to shape the collaboration between human
    decision makers and the AI intended to assist them.


    Much like most aspects of AI deployment, this collaboration exists within a balance;
    there isn’t a one-size-fits-all *best* approach to coordinating human participation.
    The ideal model will shift based on the context, but this doesn’t suggest that
    a unique interactive AI design is mandated each time a new AI system is developed.
    In fact, there are several prevalent design models that encapsulate most interactive
    AI systems.


    In the upcoming discussion, we’ll delve into what these designs entail, how they
    function, and when each one might be the most appropriate fit. Grasping these
    shared components and how to maximize their potential assistance in ensuring that
    humans and AI can effectively cooperate, amplifying each other’s strengths while
    mitigating possible weaknesses. It’s all about achieving a balance that enhances
    the strengths of both human and AI in decision-making procedures.


    ***Real-World Considerations***


    The model of guided decision making can be favorably applied to a wide array of
    situations. For example, consider the health care sector, specifically the role
    of physicians in diagnosing diseases. Many health care institutions are working
    on models that can predict the likelihood of a patient developing a certain disease
    based on their health data. However, such a prediction does not decide the final
    course of treatment—it is just one of many factors a physician takes into account
    when making a decision.


    This approach is common across a range of sectors. In the financial industry,
    risk assessment models are used to predict the likelihood of a loan applicant
    defaulting. In car insurance, AI is increasingly being used to predict potential
    high-risk drivers. Even in the realm of sports coaching, AI tools predicting an
    athlete’s future performance can provide coaches with additional information to
    make more informed decisions.


    However, when implementing these interactive AI systems, several important factors
    must be considered. Firstly, the predictions made by the model need to be based
    on tangible, predictable outcomes. This is essential, to provide valuable and
    actionable guidance to the human operator.


    Take, for instance, the financial sector scenario. A loan officer is given two
    types of predictive information: a credit score indicating the likelihood of the
    applicant defaulting on the loan and a financial stability score predicting the
    applicant’s ability to maintain steady income. While these scores provide the
    loan officer with useful information, they do not dictate a specific course of
    action.


    The main goal of these predictions is to support the human decision maker in making
    more informed decisions, not to restrict their discretion or replace their judgment.
    The human operator retains their autonomy and discretion, treating the machine
    learning model as a tool for decision support rather than a determiner of outcomes.
    It’s this seamless integration of AI intelligence and human judgment that makes
    interactive AI systems effective in a wide range of situations.


    ***Guidance and Choice in Interactive Systems***


    When rolling out interactive AI systems, there are several critical factors to
    keep in mind. As we’ve discussed, the importance of concrete, predictable outcomes
    like loan default or financial instability is key. But it’s just as crucial to
    ensure these predictions are as fair as possible.


    In these scenarios, you might often run into restricted labels because the model
    is just helping a human make a decision. The human’s decision can greatly influence
    whether we even see these labels. As a result, many of these situations can look
    a lot like the restricted outcomes problem.


    Another thing to watch out for is overdependence on clear-cut predictions. When
    you present a numerical forecast, like, say, a 90 percent chance of something
    happening, it tends to get a lot of weight in the decision-making process. Research
    shows that these clear-cut forecasts often end up overshadowing other aspects
    of the decision-making process because they seem so solid. For example, if loan
    officers are given predicted rates of loan default, they may start placing too
    much importance to these factors, ignoring other key considerations, like the
    applicant’s work history or personal circumstances.


    One way to handle this problem is to see what happens when you give these predictive
    scores to decision makers. For example, you could run a test where only half of
    the loan officers see the forecasts and then look at how their decisions compared
    to those who didn’t get the predictive scores. This could give you a good idea
    of how much influence these scores have on the decision-making process.


    On top of all this, the way choices are presented—the *choice architecture*—plays
    a big role in decision support. Often, setting smart defaults can help guide human
    operators toward making better decisions. Especially when the system makes the
    decision-making process more complicated or tricky, people are more likely to
    stick with the suggested defaults.


    For instance, if a system suggests that applicants with scores below five should
    be approved for a loan as a default, this suggestion is likely to be followed.
    The results might be different if, instead, the system just gave the score and
    left the decision completely up to the loan officer. By carefully managing the
    complexity that the system introduces, you can strategically influence how closely
    people stick to your default suggestions.


    **Continuous User Actions**


    ***Designing AI Systems for Real-World Challenges***


    As we’re crafting AI systems, we must acknowledge that not all user interactions
    will be positive and unproblematic. We must anticipate and prepare for users who
    might seek to exploit the system. An excellent example of this can be seen in
    the realm of AI customer service bots in online retail.


    This dates back to about eight years ago, marking one of the early instances of
    generative AI used in a highly visible and impactful manner. The intention was
    to create a bot for an online store that could process customer queries and respond
    as if it were a real customer service agent. The idea was quite novel and groundbreaking
    at that time.


    The AI bot began by answering innocent queries and providing standard customer
    service, similar to what one might expect from a human agent. However, because
    of the bot’s design, it could only learn from its interactions with people. Essentially,
    the bot was a simple language model set loose on the platform, continuously learning
    from each new interaction. This meant that the bot was constantly evolving.


    Nonetheless, this perpetual learning soon became a source of concern. After all,
    not all customer interactions, particularly in an online retail setting, are positive
    or polite. Consequently, the bot began mimicking some of these negative behaviors.
    A significant upset was when the bot started using inappropriate language, a shocking
    and sadly common behavior seen in online interactions. This occurred because certain
    customers intentionally manipulated the bot into behaving inappropriately, revealing
    a major flaw in its design.'
