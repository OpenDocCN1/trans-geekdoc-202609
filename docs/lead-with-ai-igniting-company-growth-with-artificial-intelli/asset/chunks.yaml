- fmt: '

    Consider the threshold set for the alerts. As the one orchestrating the system,
    you have to decide: do you want the system to alert at the slightest hint of a
    flu outbreak, or should it hold off until the signs are undeniable? Let’s assume
    for now that you’ve struck the right balance.


    The core question, though, isn’t just about the accuracy of `FluSense`. It’s about
    how this tool will enhance decision making. Instead of just asking, “How good
    is this model?” we should be asking, “How will this system aid us in making better
    decisions?”


    Being able to articulate the impact of the system in this way allows us to compare
    it to other potential solutions. For instance, if we consider an altered version
    of `FluSense`, where an analyst verifies the alerts before they are sent to the
    health authorities, we can gauge the potential outcomes.


    Take the scenario where there’s no flu outbreak and the system correctly identifies
    that. Great! Business as usual. But what if there’s an outbreak and the system
    doesn’t detect it? Well, that’s a missed opportunity to intervene and control
    the spread. What about a false alarm? Instead of causing unnecessary panic, this
    now just eats up an analyst’s time.


    And when there is an outbreak and it’s correctly identified? Well, the analyst
    now has a chance to verify this before triggering an alert. But remember, analysts
    aren’t infallible. They might miss some genuine outbreaks or confirm false alarms,
    which will also affect the system’s impact.


    Expressing the system’s performance in terms of these real-world outcomes allows
    for clearer comparison with the initial, analyst-free `FluSense` model. It’s a
    more grounded assessment of the system, which health officials can use to make
    informed decisions about deployment. Rather than getting caught up in the technicalities
    of error rates, they can understand the practical consequences: How many outbreaks
    will be detected early? How many false alarms might there be? What is the cost
    in analyst time? And, inevitably, how many outbreaks might still be missed? These
    are the real-world metrics that matter.


    ### The Challenge of Chatbot Behavior


    Models like `ChatGPT` and others pose an interesting case. They generate text
    rather than delivering yes-or-no answers, making it tricky to definitively judge
    their outputs as right or wrong. For instance, how do we measure the propensity
    of a model like `ChatGPT` to generate inappropriate or harmful content, such as
    hate speech?


    Let’s say, you’re part of `OpenAI`’s team and you want to ensure your models don’t
    produce offensive content. A logical first step would be identifying certain words
    that shouldn’t be used. You could scour the model’s outputs for these words or
    even implement rules to exclude them entirely. It’s a good start, but as anyone
    who’s dabbled with sentiment analysis knows, it’s practically impossible to capture
    all instances of hate speech with a predefined set of rules. Here, you might find
    yourself stepping into the territory of machine learning again, trying to classify
    given text as hateful or not.


    So, let’s imagine you’re in the early stages of testing and you’re trying to assess
    the kind of text the model generates. You don’t want any hateful content, but
    how do you measure that effectively? A simplified approach could look something
    like the following.


    First, you create a classifier for hate speech. This is a separate machine learning
    model whose sole purpose is to identify whether a given text is hateful. Then
    you expose this classifier to the texts generated by `ChatGPT`, effectively using
    a machine learning model to assess another.


    Humans also play a vital role in this process. You’d generate a collection of
    model outputs, ask humans to review them, and rate whether they find them offensive
    or not. These labels help train your hate speech classifier.


    At this point, you’ve basically built a binary classification problem (is the
    output hateful, or not?) to evaluate the performance of an open-ended text generation
    model. Now you can apply similar evaluation techniques to the one that we’ve used
    for binary classification problems.


    The metrics from this process can tell you how frequently offensive content may
    pass undetected by your classifier and potentially reach an end-user. This method
    gives you a tangible way of assessing and refining the behavior of models like
    `ChatGPT`.


    To recap: We focused on evaluating AI machine learning models and how these models
    allow for tradeoffs. Sometimes, you might be okay with more false positives, and
    sometimes, you might be okay with more false negatives. These choices are based
    on real-world outcomes.


    Now, in some cases, these outcomes directly connect to the errors we can observe.
    But, sometimes, we need to put in a little extra effort to identify and measure
    these consequences. For instance, with `ChatGPT`, it’s not as simple as saying
    the answer is right or wrong. There are varying degrees of bad, and we have different
    criteria to evaluate. This requires us to create specific evaluation mechanisms
    ourselves.


    The overall idea is to evaluate your system based on the quality of decisions
    it enables. Metrics like true positives, false positives, and so on are handy,
    but they may not be of much use to someone who’s deciding whether to deploy this
    model or not. Our target should be to translate these model metrics into real-world
    consequences that anyone can understand and engage with. So, the question is,
    can we contemplate what the consequences of deploying the overall system will
    be, rather than just relying on metrics that describe model performance?


    ### Evaluating the Data Behind Machine Learning


    We’re going to assess the data that these machine learning systems are built on
    and delve into what it really means to have good data. How would you identify
    quality data? And what are the common mistakes people make when they’re attempting
    to curate datasets?


    Consider this: a really instructive way to grasp how data collection can falter
    is to think about product reviews. Consider online shopping platforms that were
    once plagued with fake reviews, thereby misleading customers and inflating product
    ratings.


    Now, you’d think the primary job of these platforms is to offer accurate product
    reviews to guide customers, right? It was frustrating for them when they realized
    their system was flawed and consistently fooled by fake reviews.


    This led to a ton of questions and the search for solutions. And the reasons behind
    these errors, these consistent inaccuracies in reviews, offer great insights into
    understanding why machine learning models, or the data we assemble for machine
    learning, can also be faulty. To frame this understanding, I’m going to depict
    two distinct types of errors.


    Firstly, there’s the issue of not enough genuine customers writing reviews, people
    not wanting to share their experiences, and platforms relying too much on easily
    manipulated rating systems. That’s one set of mistakes. The second set includes
    scenarios where people don’t feel comfortable sharing their honest opinions, people
    changing their reviews, and indecisive people.


    I’m going to label these as labeling errors and sampling errors. Sampling errors
    are when you pick the wrong people to survey or you’ve chosen the wrong distribution.
    Labeling errors come into play when you’re trying to assess the sentiments of
    reviewers. Did you accurately measure their opinions? What mistakes did you make
    there?


    So, there you have it. Two different ways data collection can be flawed. Both
    are commonly encountered in real life, and we’re going to need different strategies
    to tackle them, or to determine whether we’ve run into them.

    '
