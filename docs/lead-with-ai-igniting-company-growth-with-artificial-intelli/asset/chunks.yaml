  trans: '

    循环优化在在线评论领域的应用，凸显了它在处理历史数据匮乏或缺失的情况时的巨大潜力。它展示了创新型平台即使从零开始，也能如何有效地开发和精炼机器学习模型。Yelp
    上针对虚假评论检测的开发，就是循环优化力量以及持续学习、改进和增强过程的生光范例。


    ## 总结——章节回顾


    在前面的章节中，我们详细研究了如何为机器学习应用构建最理想的环境。我们探索了四种主要的设计蓝图：受限结果、交互式 AI 系统、持续用户行为和循环优化。每种蓝图都有其独特的风格、机会和挑战。对这些蓝图有坚实的理解，为我们提供了最大化机器学习价值并直面其挑战的工具箱。让我们停顿一下，重新回顾这些蓝图并真正理解它们的价值。


    **受限结果（Restricted outcomes）**是指那些你只能看到结果局部而非全貌的情况。这类似于通过只看预告片来试图理解电影剧情——你窥见一角，但大部分内容仍然是隐藏的。这里的挑战在于破解未见部分背后的含义。我们如何从有限的数据集中解读出更宏大的场景？我们如何确保从局部视角得出的见解真实反映了全貌？


    **交互式 AI 系统（Interactive AI systems）**关于将人类判断整合到方程式中。这些系统将人类的直觉与机器的准确性相结合，从而带来卓越的结果。然而，这种方法并非没有挑战。我们如何最好地将人类的专业知识融入机器学习系统中？自动化与人工干预之间的完美平衡是什么？我们又如何在扩展规模的需求与维持人类输入的质量之间取得平衡？


    当我们谈论**持续用户行为（Continuous user actions）**时，我们面对的是蓄意的干扰，或会导致错误结果的输入。这是某些人或某些故意干预训练数据或模型输入的情况。这就像下象棋，我们的机器学习应用必须不断领先于那些试图将其将的人。这里的主要问题是：我们如何创建能够抵御这些干扰的模型？我们又如何在不陷入无休的修改循环的情况下为这些挑战做好准备？


    最后，我们来到了**循环优化（Cyclical refinement）**。这是系统随时间成熟和演化的过程，从过去的经验中学习。这通常发生在我们从少量数据开始，系统必须在收集更多数据的同时不断学习和进步时。但是，这种方法论也带来了一些重要的考量。我们如何建立一个有益的反馈回路来引导系统的学习？我们如何在进行过多更改（这可能导致系统不稳定）与持续改进的需求之间取得平衡？


    记住，这些蓝图并没有涵盖所有内容。还有许多其他我们尚未深入研究的机器学习系统设计方法。然而，我们讨论的这四种蓝图在许多机器学习应用中经常出现。


    理解这些蓝图不仅能让你掌握有用的知识，它还改变了你对可能性的认知。它促使你重新机器学习应用在各种场景下可以做什么和不能做什么。意识到这些蓝图既可以作为一种现实的检查，也可以作为创新想法的源泉。


    此外，理解这些蓝图可以增强你设计解决我们所研究问题的系统的能力。这将帮助你做出明智的决策并构建稳健、可靠的系统。它还能揭示为什么其他人可能会做出某些设计选择。理解这些蓝图为你提供了一个视角，去审视并从他人的决策中学习，从而增强你理解机器学习系统的能力。


    当我们结束这次对机器学习设计蓝图的深度探讨时，反思它们提供的价值以及所提出的挑战将很有益。这些蓝图是我们的指南，引导我们穿过广大而复杂的机器学习世界。


    ## 负责性 AI 与隐私


    它可能很复杂，但并不困难。


    ### 性 AI


    #### 应对 AI 中的歧视、隐私与道德问题


    当我们开始接触负责性 AI 时，我们发现自己正站在一个非常有趣的十字路口。两个重大的问题——歧视和隐私——正直视着我们。现在，它们看起来可能是不同的问题，但当涉及到
    AI 以及我们收集的这些数据时，它们只是同一枚硬币的两面。当我们开始挖掘这些问题时，也会开始看到 AI 政策周围的宏大图景。


    将负责性 AI 想象成走钢丝的人。这关乎平衡以及试图预测接下来会发生什么。结果是好是坏？这是一个很难的判断，老实说，这很大程度上是一个主观问题。就像那个走钢丝的人，我们都只是努力保持直立，偶尔晃动也没关系。我的工作是帮助引导你穿过这个复杂的领域，或者充当安全网。但记住，我们并不总是对好坏达成共识。这没关系。这些意见的差异让我们的旅程变得有趣。


    旅程的第一站是棘手的歧视主题。让我们看看，尽管我们初衷良好，机器学习有时为何会在歧视方面引起一些动荡。当然，我们会尝试找到规避这种情况的方法。


    “歧视”一词引发了人们对过去和现在不公正现象的许多感触。从纽约到新德里，世界各地的人都在应对基于种族、性别、性取、族裔、宗教甚至种姓等因素的歧视。尽管法律试图消除歧视，但一个悲哀的事实是它仍然存在，给人们的生活带来了真实的差异。


    歧视随着时间的变化而改变。它已经从过去显而易见的偏见（例如那些针对特定群体的旧广告）转变为更难以察觉的微妙形式。当这种歧视隐藏在公司的重大决策中时，情况变得非常棘手。


    考虑一下：研究发现，当雇主收到内容相同但姓名不同的简历时，他们更有倾向于回复具有白人或男性名字的简历。

