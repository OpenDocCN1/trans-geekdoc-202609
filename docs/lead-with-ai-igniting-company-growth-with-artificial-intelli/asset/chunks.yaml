  trans: '

    这个问题具有特定的结构。问题在于：我们如何能将一个通用的输出“去形态化”，转化为我们实际上可以衡量的东西？如果我们尝试将这个问题翻译成机器可以理解的专业术语，可能会这样问：你的数据集标签（`Y`）与你想要的实际结果有什么区别？如果你想检测一个`qualified`（合格）的申请者，你实际上测量了什么？如果你想识别`scams`（诈骗），你实际上测量了什么？识别这些差异关重要，因为它们告诉我们我们在构建系统时忽略了哪些内容。


    ### 核心要点


    - **为决策树准备数据**：当流程涉及构建决策树时，你既需要考虑数据量，也要考虑质量。更多的数据允许你构建更复杂的模型，而更好、更相关的变量则能为你提供更详尽的洞察。

    - **拥有良好代表性的数据**：你需要确保用于模型的数据能够很好地反映你所要预测的情况。理解完美数据与你实际拥有的数据之间的任何差异都超级重要。

    - **增强数据的预测性**：在数据中添加更多具体的变量可以提高你的预测效果。你可能需要将宽泛的类别替换为精确的测量，或者引入可能改变结果的新变量。

    - **找到数据数量与质量的完美平衡**：增加数据是一件好事，但你需要确保这些额外数据是高质量且相关的。仅仅增加变量并不会让模型变得更好，除非这些变量提供了有用的、具有预测性的洞察。

    - **意识到你的数据并非完美**：当你将现实现象转化为数据时，可能会丢失一些信息。了解这一事实可以帮助你发现模型中可能的系统性错误，并引导你理解模型的预测结果。

    - **在机器学习系统中使用分层**：复杂任务通常取决于较小的任务或概念。将这些包含在机器学习模型中的方法主要两种：你可以为每个任务创建一个特定的模型，也可以创建能够自主学习这些任务的模型。

    - **在教授较小任务时选择灵活性或权衡**：在机器学习模型中包含较小任务的两种方式各有优劣。直接教授任务允许你检查模型的表现，但你可能会错过重要的任务。另一方面，让模型自主学习可以获得更灵活的模型，但它可能需要更多数据，并且更难观察模型的表现。

    - **让模型自主学习较小任务**：有时，当机器学习算法被允许学习自己的较小任务时，它们会变得更强大高效。这意味着它们可以识别并利用数据中人类可能没有特别指出的部分。


    ## 生成式 AI 与语言模型


    大语言模型所做的，是进一步使深度计算的获取民主化。


    ### 生成式 AI 及其变革力量


    如果你一直听到关于生成式 AI 的热议，并好奇这到底是什么，那么你来对地方了。在本章中，我们将解读生成式 AI。我们将从它的早期开始，观察它是如何成长的，并思考它可能向何处发展。


    要真正理解现在的 AI，我们需要回到过去，追踪它从开始的旅程，看看它的增长是如何与我们业务模式的演变并行的。我们所看到的 AI 热潮不仅仅是技术的进步，它也是我们社会成长的反映。


    我们将看看生成式 AI 为各个领域带来的巨大变化。我们将关注一些改变游戏规则的者，比如 `DALL·E`（一个正在改变设计世界的图像生成器）和 `ChatGPT`（一个可以像人类一样聊天的文本生成器）。这些超级酷炫的技术进步不仅将我们的创造力推向了新高度，还开启了一个我们以前无法想象的创新时代。


    当我们深入 AI 开发的细节时，我们将拆解从简单 AI 模型到真正理解语境的复杂系统的转变。你将看到 AI 如何从根据一组数据做出预测的基础设置，演变为能够学习、解释并产生新的、但仍然相关的结果的高级模型。


    在本章结束时，你将很好地掌握生成式 AI 从何处开始以及它现在是什么样的。这样，你就能准备好思考它未来可能向何方发展。有了这些工具，你已经准备好将生成式 AI
    引入你的工作生活，充分利用其原理，并探索其无尽的。带着这种全新的视角，你将准备好积极塑造这个快速变化领域的未来，并在我们快速发展的数字世界中提升你的做事方式。


    ### 强大的盟友点增长与创新


    想象你正在经营一家公司，正准备推出这款非常酷、极具创新的产品。做新事物令人兴奋，但诚实地说，内心也有细微的疑虑。你有一支出色的团队、一个稳健的计划，并将资源放在了它们需要的地方。但要准确预测会发生什么？这感觉就像试图穿透浓雾。那么，如果你有一个超级工具在你的身边——一个生成式
    AI 助手，它可以为你提供宝贵的洞察、发现趋势，甚至帮助你完成产品开发的创意部分，会怎样？


    这不是对未来的预告，而是正在发生的事情。生成式 AI 正在冲击各行业的创意流程，展示了它作为激发灵感伙伴的价值。像 `DALL·E` 和 `ChatGPT`
    这样突破性的模型告诉我们，生成式 AI 不仅仅是计算和预测，它是创意过程的一部分。

