    [**Preface**](#contents.xhtml#frontmatter-02)


    Just last year, I found myself walking through the famous halls of MIT. This place,
    soaked with ideas and exploding with brainpower, was my creative happy place when
    it came to writing this book. But let’s clear one thing up, I didn’t land here
    because of some well-thought-out grand plan. As much as I would like to think
    I did that, it was more like a mid-life crisis, turbo-charged by two years of
    living through a pandemic.


    Picture my situation—isolation, a bunch of deep thoughts, and too much time on
    my hands. With this self-destructive cocktail, it’s no wonder my life’s path got
    flipped upside down.


    Nonetheless, I decided not to wallow. I thought, “Why not use this mess to reinvent
    myself?” Remembering Stephen Covey’s advice to *sharpen* *the saw* from *The 7
    Habits of Highly Effective People*, which had influenced me deeply since I read
    it. That was the inspiration I needed. I pressed pause on my bustling career and
    took a year-long break—a mix of an intellectual journey, a spiritual recharge,
    and quality time with my family.


    My aim was to dive right back into the electrifying world of tech innovation.
    And where better to do that than Kendall Square, a hotspot for tech and biotech
    folks? Picture the tech scene as the Roman Empire; Kendall Square would be Rome
    at its prime. After 20 years in tech, I was ready to jump in and get my hands
    dirty.


    Trying to understand this scene was like riding a rollercoaster in overdrive.
    It felt like I was lost in a sea of fancy words and complex ideas—Web 3.0, Blockchain,
    Crypto Assets, Metaverse, AI, Quantum Computing, Sustainability—you name it. Even
    seasoned investors seemed like they were just treading water, trying to keep up.


    In the middle of all this, Mark Zuckerberg shook things up by turning Facebook
    into Meta and taking a leap into the Metaverse. However, the tech world didn’t
    miss a beat. With the *Year of Efficiency* on the horizon, there were layoffs
    left and right and a sudden swerve toward AI. That’s when I first heard about
    GPT. My buddy Andy introduced me to ChatGPT during a study group meeting one day
    at MIT—it seemed like a small thing, but boy, did it leave a mark. In less than
    five days, more than a million users had joined the service, and a couple of weeks
    later, I was at in a conference hosted at MIT with Sam Altman and Lex Fridman
    discussing the way AI was shaping the future right before my eyes.


    Meanwhile, cryptocurrency, once the darling of the tech world, was having a tough
    time. FTX, a big exchange handling about U.S.$1 billion of transactions a day,
    went belly up. And the fall of Silicon Valley Bank just added to the panic.


    This wild ride reshaped my view of things. I swapped my tech-heavy talk for a
    more down-to-earth, business-centric way of speaking. It was like learning a new
    language, or even picking up a musical instrument for the first time.


    With the digital world evolving at lightning speed, I saw business leaders trying
    their best to keep up. Everyone was talking about AI, but few really got what
    it was about or how it could be used. And, honestly, who could blame them? AI
    was changing so fast it was enough to make your head spin.


    On the other side, researchers were busy perfecting complicated models and working
    with piles of data. Ask them about it, and you’d get a vague *Black Box* answer,
    as if their work was some big mystery.


    But in this confusion, I saw an opening. My unique mix of skills could serve as
    a bridge between the complicated world of tech and the practical world of business.
    It was a big challenge—diving deep into the murky world of AI, figuring it out,
    and then putting it in simple business terms.


    It was a scary challenge, but the potential was huge. My goal was not just to
    understand AI but also to find practical ways of applying this fascinating technology,
    crack the code of how to methodologically spot business opportunities for AI-driven
    concepts, and share this knowledge as widely as I could. This book is my attempt
    to clear up the mystery of AI, shed some light on it, and share this knowledge
    with anyone who’s interested.


    **Why Me? Why Now?**'
