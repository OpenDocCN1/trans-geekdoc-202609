    这种成功数据组合的完美案例可以在`消费者行为画像`这一概念中看到。这涉及到将来自亚马逊等电商平台的数据与来自谷歌等公司的浏览历史相结合。结果是什么？更增强的客户偏好画像，帮助企业量身定制产品，从而提高客户满意度并提升销量。


    从本质上说，合并数据的行为可以挖掘出巨大的价值。尽管可能会出现法律、财务和运营方面的障碍，但潜在的回报往往超过这些挑战。因此，如果你是数据集的持有者，寻找拥有可以增强你现有数据的潜在伙伴可能是非常有价值的。这种互的合并可能会让你预测出以前难以捉摸的结果，从而从这一过程中提取巨大价值，并揭示通往新洞察和机会的路径。


    # 销售基础设施


    ## 提供工具


    我们探索的第三大支柱围绕着`为寻宝猎者提供工具`的理念。这一概念呼应了 19 世纪的淘金热时代。在疯狂的淘金热中，人们对金属探测器和淘金盘等设备有着巨大的需求。并不是每个人都有意愿或能力制造自己的工具，因此他们选择购买。如果我们将这一概念与人工智能和机器学习领域联系起来，它就演变为提供那些赋能企业探索并从数据中提取价值的“黄金仪器”。


    考虑一家当地咖啡店连锁 `Daily Brew` 以及他们对提供什么咖啡混合的决策。在他们的西雅图分店，你可能会发现深色烘焙的选择比其在迈阿密分店流行的浅色烘焙要多。这种库存决策需要关于不同地区客户偏好的持续数据流，不仅来自他们自己的门店，还来自竞争品牌。


    然而，这个数据宝库对 `Daily Brew` 来说可能是一个挑战。这正是 `MarketLens` 等公司大显身场的地方。他们是现代设备供应商，提供分析服务，收集全国范围内公司销售的各种咖啡混合及相关产品信息。他们整合这些数据并提供给企业。这项无价的服务使企业能够就提供什么咖啡混合做出数据驱动的决策。


    这里的关键洞察围绕成本套利。对于一家公司来说，收集所有数据可能是昂贵的，但如果一个机构收集所有数据并将其分配给许多人，它就会变成宝库。在这种情况下，`MarketLens`
    了`为寻宝猎者提供工具`的策略。


    各行业的公司都在利用这一机会。例如，考虑 `PhysioNet`，一个致力于保留生理数据集的平台。他们通过向感兴趣的方出售这些数据来产生收入。然后是 `PropertyRadar`，收集与房地产市场相关的数据并卖给最高出价者。对于单一物业管理公司来说，独立收集数据的成本可能难以合理。然而，从像
    `Property-Radar` 这样的第三方采购可能是一项战略性举措。


    所以，密切关注那些数据需求分布在许多人中，但个人收集成本可能高到无法接受的机会。这可能是你介入并提供这些必要的`寻宝工具`的黄金良机，使企业能够在它们充满数据的矿藏中大获丰收。


    ## 李维·斯特劳斯 (Levi Strauss)


    在加州淘金热的疯狂时期，一位名叫李维·斯特劳斯（Levi Strauss）的精明商人决定在快速增长的旧金山市碰碰运气。他开办了一家杂货店，为那些被黄金承诺所吸引而涌入的人提供服务。但对斯特劳斯来说，仅仅顺应已经发生的事情是不够的。他密切关注新邻居们的独特需求，特别是那些工作到手指骨断的矿工。


    发现他们对耐磨衣物的极度需求后，斯特劳斯与高技能裁缝雅各布·戴维斯（Jacob Davis）合作，在工作装设计上提出了一种改变规则的解决方案。1873 年，他们申请了他们的结晶：用实心铜钉加固的工作裤，即我们现在所知的蓝色牛仔裤。这些坚固如铁的长裤发布，带有加固的口袋和耐用的铆钉，为厌倦了工作服破损的矿工和工人提供了一个革命性的选择。


    李维·斯特劳斯的酷牛仔裤的消息像野火一样在矿区蔓延，跨越国界到达各行业的工人手中。每个人都对这些创新的裤子赞赞不已，赞扬它们无与伦比的舒适度和持久的耐用性。需求飙升，使其受欢迎程度远超斯特劳斯最初的旧金山矿工客户群。


    这种需求的激增标志着标志性 Levi''s 牛牛仔品牌的诞生，一个简单的想法成长成了一场全球性现象。今天，它是美国文化的永恒象征。它在淘金热中的根提醒着人们：仔细观察、针对性创新以及挖掘现有资源隐藏潜力的力量。无论你是在挖掘黄金还是挖掘数据，这个历史故事都强调了量身定制业务策略以满足特定群体未被满足需求的重要性。通过这种方式，你可以创造持久的价值，并留下受得起时间考验的遗产。


    ## 富国银行 (Wells Fargo)


    回到 19 世纪中叶，在淘金热期间，两个名叫亨利·韦尔斯（Henry Wells）和威廉·福特（William Fargo）的聪明人发现了一个其他人在疯狂抢夺黄金时忽视的需求。他们看到，由淘金热引发的加州繁荣社区正迫切需要安全的运输和金融服务，而这些在当时是无法提供的。


    1852 年，他们决定通过建立 `Wells Fargo & Company` 来利用这一机会。他们的目标是填补市场上的这一巨大空白，并为繁荣的社区提供急需的服务。起初，公司专注于快递，但他们迅速成为需要移动贵重物品的个人和企业的首选。富国银行是矿工们将珍贵金粉寄回家中或银行的安全可靠途径。


    富国银行的业务依赖于广泛的马车路线、战略性部署在关键位置的快递办事处，以及矿工们可以信任其辛苦换来的黄金是安全的极其安全的库。在一个充满不可预测和风险承担的时代，富国银行提供的可靠性和安全性就像一种令人安心的存在——在那样不稳定的时期，这种东西价值堪比金子。


    随着公司建立起声誉并赢得其所服务社区的信任，富国银行开始扩大其服务范围。他们在服务中增加了银行设施、汇款服务，甚至还有电报通信。他们在做所有这一切时，始终关注安全、可靠和高效运营——这些点真正引起了他们的客户的共鸣。


    在整个淘金热及以后，富国银行的增长在促进贸易和商业方面发挥了关键作用。该公司抓住了了淘金热带来的机会，但并不是通过加入混乱的黄金争夺。相反，他们专注于解决由此产生的需求。富国银行的这个故事是一个关于发现市场空白、抓住空白，并不断创新以满足客户不断变化需求的有力教训。


    # 新淘金热中的英伟达


    '
- fmt: '

    In today’s fast-paced tech world, we’re seeing a new kind of gold rush— one that’s
    powered by the endless possibilities of AI that can create new stuff (generative
    AI). Just as the miners in the California Gold Rush needed the right gear to find
    gold, today’s AI explorers need the right tools and setup to unlock all the cool
    things that generative AI can do. Nvidia, a leading company in cutting-edge tech,
    saw this growing need and smartly positioned itself as the go-to provider of the
    essential picks and shovels` for the AI gold rush.


    Just as folks like Levi Strauss and Wells Fargo cleverly cashed in on the Gold
    Rush by supplying much-needed tools to the miners, Nvidia did the same in the
    digital era. They didn’t just sit on the sidelines. They grabbed the chance to
    be a key player in supporting the growing community of AI researchers, developers,
    and fans.


    Nvidia provided essential hardware and software tools to these AI practitioners,
    making itself an integral part of the AI ecosystem. But they didn’t stop at just
    supplying the hardware. They knew that the expanding field of AI came with its
    own set of tricky challenges. So, Nvidia also supplied software development kits
    and platforms like `CUDA` for parallel computing, which made programming their
    GPUs for AI tasks a lot easier.


    Nvidia’s smart positioning shows how important it is to understand how new industries
    work and what specific demands they bring. By giving AI enthusiasts the tools
    and tech they needed, Nvidia became more than just a supplier; it became a key
    partner in the search for ground-breaking developments in generative AI. Basically,
    Nvidia is a shining example of a company that understands the value of giving
    others the tools they need to unlock the potential of a new frontier—just like
    the guys who supplied picks and shovels during the Gold Rush. Their approach shows
    how rewarding it can be when you spot and meet the crucial needs of an up-and-coming
    industry.


    ## The Lens of Innovation


    ### Learning From Others


    #### Some Inspiration From Success Stories


    Pivoting from our previous talks about tasks and data, we’re now going to focus
    on the fun stuff: innovation itself. Here’s a question that might pop up: how
    are folks applying machine learning in the real world? What success stories can
    we learn from, and how can we use those strategies to create our own path?


    There’s nothing wrong with borrowing ideas, especially when it comes to AI. Think
    about ongoing research where tech and cardiology meet. The goal here is to use
    machine learning to read ECGs and ultrasound images, which could shake things
    up for the better. While doing this kind of research might seem out of reach for
    us, the important point is that AI is getting really good at recognizing images.


    This idea kicked off with large-scale image recognition competitions. Around 2015,
    machine learning started to beat humans at this task. The possible uses of this
    improved skill are wonderfully exciting. Consider textile factories, where cloth
    is currently inspected for defects by workers. Why not automate this job, using
    machine learning to spot problems?


    Or let’s think about the farming industry. Given that machines can see as well
    as humans, how can we apply this in farming? The opportunities for change are
    huge, with each implementation being tweaked to meet the unique needs and challenges
    of a particular industry.


    The key thing to learn from these examples is that machines are getting really
    good at doing complex tasks that, until recently, were mostly done by people.
    Our job—and also our opportunity—is to find new uses where these advances can
    do the most good.


    There have been really cool recent development is in language processing. Machines
    are getting better and better at understanding and working with language. We see
    this every day, in the predictive text and automated responses we use in our chats
    and e-mails. The big question is, how can we use this growing ability in new ways?


    Looking at past successes can show us the potential in these new capabilities.
    By deliberately adopting this innovation-focused mindset, we can spot chances
    to use these technologies in new and exciting ways. This is what borrowing is
    all about in AI innovation. With this in mind, let’s keep exploring and move on
    to the next rule.


    ### Demystify Value


    #### Navigating the Hype to Create Real-World Value


    In the fast and ever-evolving world of AI, it’s critical to distinguish between
    buzz and real opportunities. In this section, we’ll see how to concentrate on
    the practical aspects of AI, and tune out the noise that often accompanies overblown
    claims.


    Sometimes, the appeal of future promises can make us undervalue the might and
    potential of what’s right in front of us. Consider the constant hype around completely
    automated drones, for instance. We’re perpetually told they’re just around the
    corner. But while these grand visions haven’t fully materialized yet, a more grounded
    view prompts us to ask: how can we create a simpler version that works and is
    handy today?


    Our ideas for automated drones are definitely big, but the practical obstacles—from
    societal and technological to legal—are massive. While we’re waiting, what can
    we conceive and actualize as simpler versions of this tech?


    One neat example is the use of small, automated drones to deliver books within
    libraries. This applies machine learning in a relatively controlled environment,
    where speeds are low and navigation is less unpredictable. Initial programs have
    shown promising results in this area.


    Shifting to warehouse management, automated tech can help move boxes from one
    part of the warehouse to another. It might not be flying through the open air,
    but in a controlled environment, it’s an ideal use of machine learning. The task
    is specific: moving goods around, not flying over a city.


    Or consider the automated lawn mower, an autonomous gardening tool. The job it
    performs in planning a route and navigating around a garden is somewhat similar
    to what we want from an automated drone, just on a smaller, more manageable scale.


    These simpler uses might lack the glamor or thrill of their fully developed counterparts,
    but they still pack a lot of value. And the cool thing is that they don’t require
    you to be at the absolute forefront of tech. Instead, you take the most ambitious
    current version of the innovation and brainstorm a more achievable, simplified
    version.


    A recent instance is the hype around AI chatbots. The concept of fully autonomous
    conversational AI is indeed fascinating, but the real value lies in more modest
    uses. An AI customer service assistant is a good example. It might not replace
    human customer service reps, but it can help answer frequently asked questions
    and guide users through a website. Or consider a model that sends out automated
    reminder e-mails—it might not be a chatbot capable of engaging in fully human-like
    conversations, but it’s handy and offers valuable assistance.


    The central idea behind the demystifying value approach is straightforward: identify
    the overhyped potential future use and develop a simpler, more practical version
    that offers genuine value now. It might not grab the same kind of headlines, but
    it is a reliable way to create valuable solutions while we’re waiting for our
    bigger dreams to come to life.


    ## The Lens of Product


    ### The Magic of Making Things Smart

