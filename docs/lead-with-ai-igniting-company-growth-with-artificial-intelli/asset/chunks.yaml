  trans: '


    在数据收集的世界中，标记错误往往是一个主要的障碍。在我们的框架背景下，当你测量的数据并不是你真正的数据时，就发生了标记错误。这种错误频繁出现，因为我们能够测量的数据与想要测量的数据之间往往存在差距。从本质上说，我们经常发现自己测量的是我们想要目标的替代指标。


    然而，问题在于：机器学习并不是纠正这种差异的魔棒。与某些人的主愿愿相反，机器学习并不会预测我们希望它去预测的内容，它预测的是我们测量到的内容。它是一个极其死板的工具，缺乏常识。如果你的测量是不正确的，你的预测自然也会随之出错。


    这种期望测量值与实际测量值之间的不匹配经常出现，特别是在数字平台上。例如，许多在线服务希望根据用户满意度来衡量其性能。然而，他们最终测量的通常是用户活动，例如点击或视频播放量。重要的是，这些指标并不一定具有相关性。仅仅因为用户看了视频并不意味着他们从中获得了满意度。


    ### 理解非随机数据采样


    在实际场景中，数据采样通常是非随机的，并且可能由方便获取的数据组成，这引入了其固有的偏见。让我们通过社交媒体广告的例子来理解这一点。


    想象你是一个广告商，想要创建一个机器学习模型，根据先前的活动来预测各种广告素材的效果。你可能会依赖于你公司过去社交媒体广告活动的历史数据。然而，这些数据主要代表了你公司过去青睐的素材以及他们针对的观众，而不是所有可能的素材和所有潜在受众的代表性样本。


    假设你的公司在社交媒体广告中主要使用静态图像，且这些图像绝大多数以产品为中心。如果你在这些数据上训练模型，它在预测视频广告或侧重生活方式或故事性的广告效果时，表现可能会很糟糕。同样，如果你的历史数据主要涉及针对特定人口统计的活动，那么你的模型可能难以准确预测针对不同人口统计的活动的效果。


    这说明了我们的 `convenient sample`（便利样本）是如何产生偏见的。我们得到的广告效果视图被公司历史上采用的偏好和策略所扭曲了。


    #### 为什么会出现这些次优样本？


    有很多原因。原因之一是对数据收集的投入不足。例如，公司可能会使用随手可的历史数据，而不用更广泛的数据源进行补充。机器学习取得的很大进展是由于了收集高质量、代表性数据的专门努力。


    另一个原因是，部署环境往往与数据收集阶段看到的环境显著不同。这在公司将其产品扩展到新市场或新人口群体时很常见。


    另一个具有挑战性的场景是，从根本上很难收集到无偏的数据。这通常发生在我们的观察由于我们所采取的而产生偏差时。这种情况被称为 `selective labels`（选择性标记）。例如，如果你使用数据来辅助招聘决策，你通常只有被雇佣的人的可靠数据，而没有被你拒绝的人的数据。同样，在贷款领域，你只有授予贷款的人的还款数据，而没有被拒绝的人的数据。这种选择性标记为获取代表性样本带来了严峻挑战，因为问题本身的性质限制了你能收集的数据的代表性。


    ### 处理样本偏见


    一些人选择遵循的缓解方法是直接部署模型并祈祷。这种策略基于希望样本偏见不会在现实世界场景中严重影响模型性能假设。然而，值得注意的是，这通常是一种不可靠且带有风险的方法。


    更具计算性的策略是在发布模型的同时，确保建立一个详尽的监控框架。该框架允许持续的反馈和额外的数据收集。例如，考虑 Netflix 等流媒体平台上的推荐系统。如果推荐的节目或电影不他们的兴趣，用户可以提供直接反馈。这种反馈帮助系统理解哪里出错并相应地调整其预测。


    另一个有效的策略是为模型的预测分配不确定性水平。与其让模型产生二分类输出，可以让它有一个第三选项，如 `uncertain`（不确定）。例如，在天气预报中，如果模型无法确定预测下雨还是晴天，它可以预测
    `uncertain`。这将需要人类气象学家检查数据并做出最终预测。类似的系统可以在航空自动驾驶系统中看到，它们在遇到不确定或风险情况下会将控制权交回人类飞行员。


    最后，处理不平衡样本时最保守的策略是延迟部署模型。相反，应该投入资源来收集更好、更具代表性的数据。例如，在市场研究领域，公司在考虑建立预测模型之前，可能会要求数据达到最低质量。如果质量达标，公司可能会建议客户增强其数据收集策略，并在拥有更稳健的数据后再回来。


    ### 核心要点


    - **解码模型**：理解机器学习模型的内部构造是重要的，但并不仅于此。预测和评估这些模型在离开理论进入实践时的表现也同样至关重要。

    - **硬币的两面**：在涉及二分类问题时，不要掉入仅通过准确率判断模型性能的陷阱。这种狭隘的观点忽略了错误的不同影响。始终要权衡假阳性和假阴性的权重，承认每种都有其独特的后果。

    - **错误的真实代价**：在评估错误成本时，很容易关注对决策者的影响。然而，请记住，个人和整个社会也承受着这些错误带来的。


