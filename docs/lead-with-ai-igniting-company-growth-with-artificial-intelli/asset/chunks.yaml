- fmt: '

    Looking at our big picture plan, our main concern lies in those moments when the
    model’s predictions don’t match up with our expected results. We’re on a journey
    to understand what these mismatches really mean in the grand scheme of things.


    To give you a clear idea of how we evaluate a model, let’s take a look at a day
    in the life of your machine learning engineer or data scientist. They usually
    start by feeding a dataset into a training algorithm to create a model that can
    make new predictions.


    However, the evaluation process goes a step further. The dataset is divided into
    two parts: about 70 percent becomes the training set, which is used to train the
    algorithm and create the model. The remaining 30 percent becomes a reserve or
    validation set.


    The engineer or scientist then feeds this reserve set into the already trained
    model, which makes its predictions. These predictions are compared to the actual
    outcomes, also known as the `ground truth`. This step creates a comparison between
    what actually happened and what the model predicted, giving us a statistical measure
    of how well the model works.


    So, when you hear someone say that their model is 90 percent accurate or something
    similar, it’s important to remember that this claim is about the data that wasn’t
    used during training but came from a reserve set. This is the nuts and bolts of
    evaluating machine learning models—an important aspect that often gets overlooked.


    ## A Pragmatic Approach to Evaluating Models


    As we journey further, a central query arises: How do we accurately compare predictions
    with actual outcomes? While traditional metrics faithfully assess the quality
    of predictions, the evaluation method may need refinement once the model is ready
    to be employed in a specific situation. The primary question in your evaluation
    process should be, “What action am I ready to undertake based on these predictions?”


    Consider scenarios of binary classification where `Y` can only assume two potential
    values. Envision employing machine learning for credit risk assessment using customer
    data. Here, `Y = 1` signifies that the customer is a credit risk, while `Y = 0`
    suggests they’re not. The evaluation in this context hinges on your intended use
    of the predictions.


    It’s crucial to note that even though `Y` is binary, predictions frequently aren’t.
    Most of the time, models yield a score between 0 and 1, which can be perceived
    as the probability of a customer being a credit risk. At times, this probability
    might suffice, but when you need to form firm decisions based on these odds, you
    might opt for a more simplistic approach.


    For instance, you could establish a threshold, say, `0.4`, and decide to decline
    a loan if the model’s prediction surpasses this limit. If the prediction falls
    below this threshold, you might choose to approve the loan. At this juncture,
    the way you utilize these predictions affects the evaluation of the model.


    In this context, two types of mistakes can transpire. These errors can be depicted
    using a 2 × 2 table, where columns represent the actual outcome (credit risk or
    not), and rows illustrate the decisions made (loan approved or declined).


    There are two instances where our decision aligns with reality: when the customer
    is not a credit risk and we approve the loan, or when the customer is a credit
    risk and we decline the loan. However, we must also contemplate two types of errors:
    false positives and false negatives. A false positive occurs when a customer isn’t
    a credit risk, but we decide to decline the loan. Conversely, a false negative
    happens when a customer is a credit risk, but we decide to approve the loan.


    These errors are not only distinct, but they also bear different consequences.
    So, when someone claims their model has 90 percent accuracy, a dash of skepticism
    is necessary. Such an assertion conflates these two error types together, and
    you might harbor more concern about one type than the other. For example, approving
    a loan to a credit risk is certainly a graver mistake than declining a loan to
    a customer who isn’t a credit risk.


    Our objective is to comprehend these different types of error and the potential
    impact each one carries. This understanding will aid you in deciding the significance
    you should accord to each type of error.


    The false negative rate and the false positive rate are defined as the fraction
    of customers who were credit risks but got their loans approved and the fraction
    of customers who were not credit risks but had their loans declined, respectively.
    These metrics can prove immensely valuable as they quantify the frequency of your
    mistakes for each group of customers.


    However, these definitions both come under the wider concept of prediction quality,
    indicating how often predictions are accurate or erroneous.


    Many decisions about the use of machine learning revolve around the costs of different
    error types and strategies to mitigate them. Mistakes are inevitable, but your
    aim should be to minimize the financial and operational impact of these errors
    and finetune your model to reduce the more costly ones. Let’s examine what this
    idea entails in real-world scenarios.


    ## Understanding the Tradeoffs


    In the sphere of investing, there’s an insightful concept known as the `margin
    of safety`. This idea originates from investment gurus like Benjamin Graham. They
    advocate the principle that it’s preferable to forego multiple good deals than
    to risk a substantial loss on a bad one. This perspective vividly illustrates
    the distinct costs associated with false positives and false negatives.


    Consider it in this light: bypassing a profitable investment is similar to a false
    negative—a missed opportunity for financial gain. Conversely, committing to a
    poor investment mirrors a false positive—mistakenly identifying a losing proposition
    as profitable. Consequently, Graham’s principle of the margin of safety implies
    that the cost incurred from one false positive (a bad investment) significantly
    outweighs the cost of numerous false negatives (missed good deals).


    Graham’s philosophy provides valuable insights into managing errors in the investment
    sector. If you perceive false positives as particularly detrimental (which they
    are, given their financial implications), you’d want your investment strategy
    to minimize these errors, even if that potentially means missing some profitable
    opportunities.


    So, what is the relevance of this to large language models? Language models, like
    `ChatGPT`, commonly predict or generate text, which is subsequently evaluated
    for its accuracy and usefulness. At this point, you establish a confidence threshold—how
    confident do you need to be about the validity of the generated text before choosing
    to display it instead of a neutral `uncertain` response?


    For instance, `ChatGPT` might respond with “Apologies, but this query is too complex
    for me to provide a definitive answer.” What’s happening is an assessment of the
    question’s complexity. If the model deems the question as exceeding a certain
    complexity threshold, it opts to withhold a response.


    Training these large language models involves two phases. The first phase sees
    the model consuming vast amounts of Internet text and primarily focusing on predicting
    the next word instead of performing as a chatbot. The second phase involves acquiring
    human feedback on diverse questions and responses, emphasizing the quality of
    the responses. It’s during this phase that factors like utility, safety, and accuracy
    get integrated. For example, statements that are initially factually incorrect
    may receive high scores. However, as the model aligns more with human preferences,
    it starts to adjust these scores.

