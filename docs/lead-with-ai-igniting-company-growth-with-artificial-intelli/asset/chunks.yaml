    接下来，为了让模型的预测更加准确，我们可以使用一种涉及多个模型的技巧。这种概念在 AI 领域被称为**集成学习**（ensemble learning），它为我们的测试结果增加了一次额外的检查。例如，如果我们正试图创建一个用于疾病诊断的
    AI 系统，我们不能仅仅依靠`X-rays` 来发现肺炎。最理想系统还会使用其他诊断数据，甚至是现有的患者健康记录。通过使用多个信息源来确认肺炎病例，我们使系统变得更加可靠，这有助于将误差控制在范围内。


    谈到我们开始时使用的训练数据，我们其实有一定的回旋余地。然而，在选择输入数据时，必须遵守的一条规则是：尽可能选择对手难以篡改的数据。这一原则是 `PubMed`
    原始搜索算法的核心，该算法根据医疗研究收到的显著引用次数对其实进行排名。其背后的逻辑非常简单：从像《柳叶刀》（`The Lancet`）这样的顶级来源获得引用绝非易事。如果这样一个知名的来源引用了某项研究，这就是该研究结果可靠的有力信号。因此，选择此类难以干预的输入数据可以在敌性环境中获得更具信誉的预测。


    除了这些预防性策略外，对抗对抗性、行为或误导性数据的另一个关键部分是使用**反馈**。反馈循环对于修复错误至关重要。例如，在 AI 诊断系统中，人类医生因为
    AI 漏掉了某个症状而覆盖了 AI 的诊断，这就是极具价值的反馈。这表明犯了错误，我们需要采取行动来修复它。这种反馈总是很有帮助，但在我们处理对抗性行为时，它的价值价值连城。


    最后，保持大局观是关键。对模型分类的一部分实例进行定期的人工检查——无论是肺炎诊断、被标记的异常还是任何其他标签——都能帮助我们观察模型的决策是否与人类的判断一致。我们需要警惕人类能察觉但模型可能会错过的新类型对抗花招。此外，密切关键性能指标（KPIs）也很重要——例如，正确诊断的总数。这个数字的下降可能意味着病例减少，也可能意味着我们的诊断效率受到了影响。弄清楚究竟是哪种情况，是保持我们系统精准且高效的关键。


    ## 循环优化 (Cyclical Refinement)


    ### 创新的路径


    在机器学习领域探索新领域，特别是当我们处理新行业或新应用时，往往感觉自己像是在绘制新领土地图的探险家。想象一下现代农业技术的世界。机器学习模型正越来越多地用于改进耕作方法，设备分析广泛的数据，如土壤质量、天气模式和作物生长等。


    但问题在于，在这些智能农用工具出现之前，我们并没有关于不同土壤类型或天气条件如何影响作物生长的详尽数据。所以，如果我们从几乎没有任何历史数据的情况下开始，我们该如何构建出可靠的机器学习模型呢？**


    这就是`循环优化`（cyclical refinement）派上用场的地方。这个概念承认开发机器学习模型并不是从 A 点到 B 点的直线过程。相反，它是一种循环——我们建立一个基础模型，将其投入使用，收集数据，从这些数据中学习，然后调整模型。这个循环可以不断进行，每一个循环都让模型变得越来越好。


    在智能农业的世界里，开发者可能从非常基础的模型开始。这些初始模型将根据他们手头的任何数据进行训练——也许是实验室控制实验或小型农场设置的数据。一旦这些早期模型运行，它们就开始从农场收集真实世界的数据，向现有的数据集中添加大量新数据点。


    有了这些新数据（它们比开发者最初拥有的数据多样和详细得多），他们随后会返回并精炼模型。随着模型经历每一个优化循环，它们在识别模式和基于更广泛、更具代表性的数据集进行预测方面变得越来越出色。


    从循环优化模式中需要记住的关键点是：从基础模型和有限数据开始是完全可以的。更重要的是为你的模型建立一种随时间推移而学习和改进的方法。循环优化的美之处在于它的演化——它关乎持续的学习和调整，就像我们人类学习的方式一样。通过这种方法，开发者可以不断改进他们的模型，使其随着时间的推移变得更加有效和可靠，即使他们开始时几乎没有任何数据。


    ## 从想法到迭代增强 (Idea to Iterative Enhancement)


    创建一个用于识别虚假评论的系统并非易事。它是机器学习中常见的“鸡生还是蛋”（`chicken or the egg`）困境的经典案例。你需要一个运行良好的系统来吸引用户，但你也需要用户来创建系统运行所需的数据。那么，像
    `Yelp` 这样的领域先驱是如何解决这个问题的？


    他们的技巧是首先创建一个提供并不一定与机器学习相关的平台。当 `Yelp` 首次发布时，它并没有检测虚假评论的系统。然而，它提供了许多其他实用功能，如允许用户查找和评价本地企业。这些功能吸引了用户，为数据收集奠定了基础。


    根据用户与 `Yelp` 交互的历史数据，建立了一个初始模型。这可以被称为初步尝试（`first attempt`）模型。该模型可以估计每个企业每天产生多少潜在虚假评论。但这些早期数据是没有标签的。尚清楚哪些评论是虚假的，哪些是真实的，只是日常活动。尽管如此，这是一个开始。


    这个第一阶段模型提供了一种测试虚假评论算法敏感度的方法。通过理解它标记评论的频率，开发者可以通过调整某些限制来微调模型。如果它每天标记了太多评论，意味着系统需要更严格的标准。


    有了基础模型以及对其敏感程度的了解，下一步是将其投入测试。通常，此类功能首先向一小部分用户推出。这些用户可能是员工、精通技术的测试者，甚至是一些大胆的早期用户。这一阶段的一个关键部分是提供一种让用户给出反馈的方式。这使得开发者能够收集有关模型运行良好程度的重要数据：真实评论被标记了多少次？漏掉了多少次虚假评论？


    调整标记评论的频率是反馈循环的关键部分。如果你将门槛设得太高，就会因为太多的假阳性而骚扰测试者。如果设得太低，可能会错过重要的真实虚假评论实例。取得正确的平衡至关重要，以防止用户因为过多的警报或对其功能缺乏信任而放弃平台。


    有了反馈系统后，开发者可以循环地调整和精炼模型。每一个循环都是改进模型性能的机会，利用用户提供的反馈和新数据。这种循环优化过程不仅限于识别虚假评论；类似的策略也用于平台上的其他应用，例如检测不当内容。


