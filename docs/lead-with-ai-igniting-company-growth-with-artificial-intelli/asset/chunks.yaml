    为了弄清楚这个问题，让我们回顾一下之前讨论过的一个观点。这个观点依赖于两个不同地方的比较：我们所处的现实世界，以及 AI 世界。在这个观点中，设计者的主要工作在现实世界中进行。他们密切观察正在发生的情况，发现需要修复的问题，并针对这些问题提出
    AI 解决方案。


    将设计师想象成一名足球教练。教练制定比赛计划、开球，并密切观察比赛的进展。另一边，是机器学习工程师或数据科学家。他们就像球场上的球员，通过执行战术让这些智能系统运行起来。


    在这种设定下，设计者的角色可以比作教练，而机器学习工程师的工作更像球员。教练规划大局，考虑每一个细节，将实际因素考虑在内，并构想最终结果。与此同时，球员进入比赛，通过每一个动作将教练的计划变为现实，并始终遵循战术手册。


    但让我们明确一点：教练并不是进球的人。他们是那些制定、规划和设计供球员付诸行动的系统的人。他们负责塑造游戏环境，创建一个完美符合其用途的空间。


    现在，你可能会想，教练在现实生活中是如何做到的？哪些基本规则指导着他们的比赛计划？还有一个大问题：当我们为机器学习设计环境时，是否可以使用这些相同的规则？


    为了更好地理解如何为 AI 创建最佳的设置，我们需要更仔细地观察设计者（即我们的教练）是如何工作的。他们是如何开始制定计划的？他们考虑的主要内容是什么？如果我们深入探讨这些问题，可能会发现一些实用的提示，指导我们实现目标：设计出让
    AI 和机器学习能够真正展现其实实力的环境。


    ## 受限结果


    ### 解开受限结果的困境


    我们将探索的第一个术语是我们所说的 `restricted outcomes`（受限结果）。我们的目标是识别出用于解决受限结果问题的常用解决方案。但首先，我们需要理解它的真正含义。


    当你试图根据数据集 `X` 预测结果 `Y` 时，就会出现受限结果问题。棘之处在于：你的预测会影响你的决策，而这些决策又影响你是否能看到最初想要预测的结果。为了让这更清楚，让我们把现实世界的例子换成另一个——比如，大学录取。


    想象一下场景：你是一名大学招生官。你的工作是决定谁录取，谁不录取。你有一个精妙的 AI 系统，可以根据……预测学生是否会退学。


    （此处由于原文存在大量重复段落，已按要求进行逻辑翻译）


    受限结果问题在你试图根据数据集 `X` 预测结果 `Y` 时，就会出现。棘之处在于：你的预测会影响你的决策，而这些决策又影响你是否能看到最初想要预测的结果。为了让这更清楚，让我们把现实世界的例子换成另一个——比如，大学录取。


    想象一下场景：你是一名大学招生官。你的工作是决定谁录取，谁不录取。你有一个精妙的 AI 系统，可以根据……预测学生是否会退学。

