- fmt: '

    Fast forward to 2023, and you might presume we would have learned from those initial
    missteps when developing new systems. However, an incident involving an AI chatbot
    in a popular online gaming platform mirrored the same old issues that tripped
    up the retail bot. Yet again, certain users bombarded the AI chatbot with inappropriate
    comments, and the AI began parroting this unacceptable behavior, resulting in
    a significant controversy.


    These instances indicate that the challenge of user misbehavior when engaging
    with public-facing AI has not been eliminated. It’s a significant concern that
    despite the passage of time and numerous high-profile cases, we continue to grapple
    with solutions. It raises questions as to why these AI models can be so easily
    manipulated and how quickly they can adopt negative behaviors. It also emphasizes
    the need to delve deeper into understanding these shortcomings to build more robust
    and resilient AI systems.


    ## Protecting Your Data in a Manipulative World


    The implications we’ve seen in those examples really underline the need to prudently
    consider who interacts with our datasets and the potential repercussions if they
    manipulate them. There’s a timeless saying that stands relevant here, “Garbage
    in, garbage out.” If our AI systems are fed tainted or doctored data, their outputs
    will invariably reflect that.


    Consider, for example, the challenges faced by an AI customer service system employed
    in an e-commerce company. Now, while there are users who offer genuine feedback
    and valuable input, there might also be a small subset of disgruntled users who
    deliberately provide misleading information. The tricky part is, the average user
    doesn’t have the time or inclination to correct false data or educate AI bots
    about the real circumstances. What’s more, these attempts to set the record straight
    probably don’t get as much attention as the false or sensational information they’re
    trying to rectify.


    The complexity further escalates considering the plethora of topics and products
    on the e-commerce platform. If a troublemaker zeroes in on a specific product
    and starts feeding twisted data into the AI system, the AI may end up propagating
    and amplifying incorrect information.


    This problem, known as `data poisoning`, especially applies when malevolent users
    intentionally infuse misleading data into a model’s training set, thereby manipulating
    the model’s behavior. An AI system that learns from user-generated data is particularly
    vulnerable to such data poisoning.


    And it’s not just customer service bots at risk. Many AI systems learn from user-generated
    data, and the repercussions can be far more serious than a bot spreading misinformation.
    For instance, let’s explore some scenarios where AI systems might be at a higher
    risk from this kind of malicious behavior.


    Consider AI in health care, which is a prime example of balancing different data
    sources. These AI systems learn from both private data gathered under controlled
    conditions and public data from patients’ real-world health records. Each type
    of data offers unique advantages but also brings along its own set of challenges.


    Private data can be better managed, thereby reducing the risk of tampering. However,
    real-world patient data provides a broader and more accurate picture of various
    health conditions and their patterns. Still, it’s more susceptible to manipulation.
    The task of striking the right balance between data sources for effective learning
    is a perpetual challenge.


    Another interesting example is a language learning app using AI, which learns
    from both public and private data. Public data is voluminous and forms the AI’s
    foundational knowledge. But it also brings the risks we’ve discussed—it could
    contain misleading or inappropriate language.


    To counterbalance this, a smaller amount of controlled private data is used to
    finetune the AI’s behavior, to correct any potential missteps learned from the
    extensive pool of public data. Despite being smaller in quantity, this supervised
    data plays a crucial role in ensuring the AI’s responses align with societal norms
    and adhere to the rules.


    Blending public and private data sources presents a significant challenge in AI
    design. The AI must navigate a complex environment, where it needs to learn from
    an extensive amount of public data but also be meticulously guided by controlled
    private data to keep its outputs credible. This turns the AI’s learning process
    into a nuanced, ongoing, and delicate task.


    ## The Pitfalls of Public Interaction With AI Systems


    As AI systems start to become a bigger part of our everyday lives, the chances
    for them to be misused also grow. Take `ChatGPT` as an example. The more people
    use it to find information or get stuff done, the more valuable it becomes to
    influence how it behaves. If you put `ChatGPT` on your own website, you might
    be able to control what it says.


    Think about websites that share information. If the AI model learns from these
    websites, the content can directly affect how the model behaves. This isn’t a
    new problem—search engines have been dealing with this for years. But it’s a new
    angle on the problem when we’re talking about models that generate text. The question
    of how to make sure these models aren’t getting tricked is complex and hard. The
    more important and widespread these AI systems get, the more tempting it becomes
    for people to mess with them.


    Autocomplete features, like the ones in `Google` search, are another example.
    These features, which suggest endings as you type, are hotly contested areas for
    different groups, including political ones and advertisers. Being able to influence
    these suggestions can be valuable—for example, imagine being the first suggestion
    that pops up when a user starts a search.


    Autocomplete can also be a way to spread wrong information and lies. For instance,
    if a person types “Does the COVID vaccine...” into a search bar, different groups
    might want to guide the following suggestions in different directions. The reasons
    could be anything from wanting to make money to trying to damage a rival, or even
    just for fun.


    Let’s picture a scenario where a competitor wants to spread bad rumors about a
    `MacBook`. They could potentially mess with autocomplete to make `MacBook crashes`
    the top suggestion, changing how people see it—even if just for a little while.


    All these examples underline the possible dangers of AI systems learning from
    public data. They show that we need to keep a close eye on things and take strong
    steps to block or fight against harmful manipulations. These are important things
    to think about for any AI design, especially ones that interact directly with
    the public and have a big impact on society.


    ## Tactics and Instruments


    So, how do we tackle this? The solution comes from a bunch of technical tools
    and methods that are designed to fight off mean tricks on AI systems. A word that
    often pops up in these chats is resilience. Instead of deving lost in the tricky
    technical details, let’s stick to the main point: we’re looking to strengthen
    the toughness and stability of our models.


    Imagine this: we want to create an AI model that can tell if someone has pneumonia
    from chest X-rays. Normally, we would train the model with lots of X-rays showing
    clear cases of pneumonia. But let’s be real, the world outside isn’t so simple.
    A patient’s X-ray could have other issues, be unclear, or even misunderstood.
    So, it’s super important to add such variations to our training data, not just
    clean-cut, perfectly understood pneumonia X-rays. By including blurry or overlapping
    images, we’re basically teaching the model to predict, understand, and deal with
    any misfeeds that might fool it. The goal here is to make models that are more
    resilient.

    '
