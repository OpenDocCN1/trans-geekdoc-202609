  trans: '

    在当今快速发展的科技世界中，我们正目睹一场新的金淘潮——这种热潮是由能够创造新事物的 AI（生成式 AI）无限可能所驱动的。正如加州淘金热中的矿工需要正确的装备来寻找黄金一样，今天的
    AI 探索者也需要正确的工具和配置来解锁生成式 AI 可以实现的所有酷炫功能。作为尖端技术的领先公司，Nvidia 看出了这种增长的需求，并聪明地将自己定位为
    AI 金淘潮中必备“镐子和铲子”的供应者。


    就像利维·斯特劳斯（Levi Strauss）和富国银行（Wells Fargo）这样的人通过向矿工提供急需工具巧妙地从淘金热中获利，Nvidia 在数字时代也做了同样的事情。他们并没有仅仅浅尝旁观，而是抓住机会，成为支持不断发展的
    AI 研究人员、开发者和粉丝社区的关键力量。


    Nvidia 为这些 AI 从业者提供了基本的硬件和软件工具，使自己成为 AI 生态系统中不可或缺的一部分。但他们并未止步于提供硬件。他们知道，不断发展的
    AI 领域伴随着自己一系列棘手的挑战。因此，Nvidia 还提供了软件开发包以及如 `CUDA` 这样的并行计算平台，这使得为其 GPU 进行 AI 任务编程变得简单得多。


    Nvidia 的明智定位展示了理解新行业运作方式以及它们带来的特定需求有多么重要。通过为 AI 爱好者提供他们所需的工具和技术，Nvidia 不仅仅是一个供应商；它成为了探索生成式
    AI 突破性进展的关键伙伴。基本上，Nvidia 是一家公司的优秀典范：它理解向他人提供解锁新前沿潜力所需工具的价值——就像淘金热期间提供镐子和铲子的人们一样。他们的方法表明，当你发现并满足新兴行业的关键需求时，会获得多么丰的回报。


    ## 创新的视角


    ### 向他人学习


    #### 从成功案例中获取灵感


    从我们之前关于任务和数据的讨论转过来，现在我们将关注更有趣的内容：创新本身。这里可能会出现这个问题：人们在现实世界是如何应用机器学习的？我们可以从哪些成功案例中学习？我们又如何利用这些策略来开辟属于自己的道路？


    借用想法并没有错，特别是在涉及 AI 的时候。考虑正在进行的科技与心脏病学的交叉研究。这里的目标是使用机器学习来读取心电图（ECG）和超声图像，这可能会带来积极向良的变革。虽然进行这类研究对我们来说似乎遥不可及，但重点是
    AI 正在变得越来越擅长识别图像。


    这个想法始于大规模图像识别竞赛。大约在 2015 年，机器学习在这项任务上开始击胜人类。这种技能提升带来的可能用途非常令人兴奋。考虑纺织厂，目前正由工人检查布料的缺陷。为什么不使用机器学习来发现问题，并将这项工作自动化呢？


    或者让我们考虑农业行业。鉴于机器能像人类一样看东西，我们如何将其应用于农业中呢？变革的机会是巨大的，每一次实现都会经过微调，以满足特定行业的独特需求和挑战。


    从这些例子中学习到的关键点是，机器正越来越擅长处理复杂的任务，而直到最近，这些任务主要由人类完成。我们的工作——也是我们的机会——是找到这些进步能够产生最大益处的新用途。


    最近在语言处理领域有一项非常酷的发展。机器在理解和处理语言方面变得越来越好。我们在每天聊天和邮件中使用的预测文本和自动回复中都能看到这一点。大问题是，我们如何以新的方式利用这种日益增长的能力？


    回顾过去的成功可以向我们展示这些新能力的潜力。通过有意识地采用这种以创新为中心的思维方式，我们可以发现以新颖且令人兴奋的方式使用这些技术的机会。这就是 AI
    创新中“借用”的意义所在。记住这一点，让我们继续探索，并进入下一个规则。


    ### 揭秘价值


    #### 在炒作中航行以创造现实价值


    在 AI 快速且不断演变的世界中，区分炒作和真正的机会至关重要。在本节中，我们将看到如何关注 AI 的实用方面，并过滤掉那些经常伴随夸大其词的噪音。


    有时，未来承诺的吸引力可能会让我们低估眼前事物的力量和潜力。例如考虑围绕全自动无人机的持续炒作。我们不断被告知它们近咫尺。但虽然这些宏大愿景尚未完全实现，但更务实的观点促使我们思考：我们如何创建一个今天就能运行且方便的简单版本呢？


    我们对自动无人机的想法确实很宏大，但实际的障碍——从社会、技术到法律——是巨大的。在我们等待时，可以构思并实现哪些这种技术的简化版本呢？


    一个巧妙的例子是使用小型自动无人机在图书馆内递送书籍。这在相对受控的环境中应用机器学习，那里的速度较低，导航的不可预测性也较小。初始计划在该领域显示了良好的成果。


    转向仓库管理，自动化技术可以帮助箱子从仓库的一个部分移动到另一个部分。它可能不是在开放空中飞行，但在受控环境中，它是机器学习的理想用途。任务是特定的：移动货物，而不是飞越整个城市。


    或者考虑自动割草机，这是一种自主园艺工具。它在规划路线和在花园周围导航时执行的任务，与我们对自动无人机的要求有些相似，只是在更小、更易管理的规模上。


    这些简单的用途可能缺乏其完全体对应品的华丽感或刺激感，但它们仍然充满了价值。很酷的一点是，不需要你处于技术的最前沿。相反，你只需采取当前创新中最雄心的版本，并构思出一个更可行的简化版本。


    最近的一个例子是对 AI 聊天机器人的炒作。全自动对话 AI 的概念确实迷人，但真正的价值在于更适宜的用途。AI 客户助手就是一个很好的例子。它可能无法取代人类客服人员，但它可以帮助回答常见问题并引导用户访问网站。或者考虑一个发送自动提醒邮件的模型——它可能不是能够进行完全人类化对话的聊天机器人，但它非常方便并提供了价值的帮助。


    揭秘价值方法的核心思想非常简单：识别被过度炒化的潜在未来用途，并开发出一个更简单、更实用、现在就能提供真实价值的版本。它可能不会获得同样的头条，但在我们等待更大的梦想实现时，它是创造有价值解决方案的可靠方法。


    ## 产品的视角


    ### 让事物变得智能的魔法


