- fmt: '

    Working with AI systems often means juggling some tradeoffs. In an ideal world,
    we’d be able to handle these tradeoffs, lining them up with our goals and ethical
    rules. In this chapter, we’ll dive into a strategy to find a balance between making
    the system work better and ensuring fairness for everyone.


    Imagine these tradeoffs as points on a graph. One axis shows the extra number
    of people who benefit from an AI tool (like seeing more people show up to court).
    The other axis shows how equitably the benefits are spread across different groups
    of people. Once you’ve got your AI model working, you can draw this graph to see
    the balance between these two important factors. Each point on the graph represents
    a specific policy choice—a delicate balance between making things work well and
    making things fair.


    This graph really brings out the need to make tough choices between things like
    efficiency, accuracy, influence, and fairness among different groups. AI lets
    us shine a light on these tradeoffs and tweak them. By using predictive models,
    we can build a system that clearly shows our preferred balance on the graph, matching
    up with policy goals.


    Remember, this isn’t just about ethics. It also has a big impact on how we make
    rules. People might not agree on where the best balance is on the graph. But,
    they should agree that the graph should exist, balancing key factors that can
    be measured. Understanding this leads to smarter policy choices.


    AI pushes us to put a number on tradeoffs, giving us a better picture of what
    our decisions lead to. For example, if a judge has to decide who gets certain
    benefits, the hidden tradeoffs in their choices might be unclear. But with the
    precise predictions offered by AI, we can put a number on these tradeoffs. As
    this approach spreads to policy making, we can handle these tradeoffs more fairly,
    avoiding having to rely on someone’s unclear decision-making process.


    A real-world example of these tradeoffs is the way ads are auctioned online. It’s
    really important to understand the predictive models being used and be aware of
    any potential unfair outcomes these models might lead to.


    ### Online Ad Auctions


    Online ad auctions work in a pretty simple way. When you visit an online platform,
    advertisers bid to show you their ads. The platform uses machine learning to guess
    how likely you are to click on each ad. It then shows you the ad that’s expected
    to bring in the most money—the product of the bid amount and the click chance.


    But where could unfairness sneak in? A well-known case at Facebook gives us a
    useful example. Different ads, ranging from shoes to job postings, targeted different
    groups of people. This led to a situation where women mainly saw ads for shoes,
    while men saw more job ads, accidentally creating an imbalance.


    In 2018, the U.S. Department of Housing and Urban Development took Facebook to
    court over these differences in ad distribution. Ads for housing, jobs, and credit
    are regulated by federal law, and a settlement required Facebook to make sure
    these types of ads were equally shown to all groups of people. This policy meant
    making a tradeoff—giving up some of Facebook’s revenue to ensure equal ad exposure
    across all groups.


    ### Understanding the Dollars and Cents Behind AI Algorithms


    To start wrapping our heads around the tangled web of AI algorithms and the economic
    theories they involve, let’s imagine a situation with an AI ad algorithm. Let’s
    call our user Sigal. Sigal could be shown a shoe ad that brings in U.S.$3. Or,
    she might see a job ad that makes a bit less—U.S.$2. At its core, the algorithm
    is built to get the most out of the bid value, and straying from this goal could
    mean losing money.


    But this calculation involves more than just the bid value. It also takes into
    account an estimate of how likely a user is to interact, usually measured by the
    click-through rate. An ad with less user interaction naturally makes less money.
    So, when companies tweak these algorithms to fight biases, they also need to think
    about the possible economic consequences.


    Regulators also play a key role in keeping balance in AI systems. While they might
    not know as much about AI as tech companies, their insights and decisions are
    really important. They don’t make decisions on their own; they’re backed up by
    technical consultations with a bunch of experts. Remember that these regulators
    often work within practical limits and duties, like avoiding collecting demographic
    data.


    So, any criticism of a regulator’s actions should be seen in light of the limits
    and the principles we’ve talked about in this chapter. While regulators are making
    headway in tackling the ethical issues of AI, the task is tough given the complex
    and multilayered nature of the technology.


    ### The Far-Reaching Impact of AI


    The impact of AI systems can be far-reaching. Predictions and actions for one
    person can start a chain reaction and potentially create imbalances for others.
    So, if you come across an AI product that claims to be `unbiased` or `fair`, approach
    it with a healthy dose of doubt. Ask for clarity around these buzzwords and question
    what concrete steps have been taken to reduce bias.


    For instance, an AI system might promise equal selection rates across different
    groups of people, but this brings up questions about potential impacts and legal
    issues. As AI gets more complex, companies have to take responsibility for any
    unfair practices that their AI models might lead to.


    Right now, U.S. discrimination law is reactive, meaning someone has to make a
    complaint before anything happens. While there haven’t been many successful cases
    where algorithmic discrimination was proven, it’s likely that a lot of models
    are close to breaking the law.


    To wrap up this part of the chapter, there are a few important points to keep
    in mind. First, AI models, based on historical data, can unintentionally reflect
    historical biases. They’re not a magic solution for societal issues; they just
    mirror existing imbalances. Second, the context in which a model is used is crucial
    and can greatly affect outcomes. Even models without bias can create imbalances
    if they’re launched into a biased system.


    Whenever possible, these tradeoffs should be made clear, fostering a culture of
    transparency and accountability. Lastly, always approach claims of `unbiased`
    or `fair` AI systems with a healthy dose of skepticism. Question the definitions,
    challenge the steps taken to fight bias, and never just take these claims at face
    value.


    ## Privacy in the Realm of AI


    ### Unraveling Privacy With an AI Impact


    When we say `privacy`, people think of all sorts of things. Some might think it
    means keeping their chats with friends secret. Others might think it means having
    the right to be left alone. Some might see it as controlling who gets to see their
    personal information. So, privacy isn’t just one thing; it’s a bunch of related
    ideas. As we talk about AI and machine learning, we’ll try to shed some light
    on these different parts of privacy and why the distinctions are so important.


    Why does privacy become a big deal when we talk about AI? The main issue is that
    AI needs data—lots of it. This data can tell a lot about our lives. Every time
    we use data to build AI or machine learning models, we might be giving away some
    of our secrets. This brings up a question: do we see this as a necessary tradeoff
    for the progress of AI? Is it hard to keep privacy intact while building high-performance
    AI systems?


    A good example is the Cambridge Analytica scandal. This company took user data
    from Facebook and used it to target political ads in 2016. They wanted to sway
    public opinion and election results. They tried to build accurate machine learning
    systems, but they stomped all over people’s privacy. Even though they clearly
    broke Facebook’s rules, the damage was done.

