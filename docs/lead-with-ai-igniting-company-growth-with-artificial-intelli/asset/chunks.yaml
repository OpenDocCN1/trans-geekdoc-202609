    But that doesn’t mean all rules are irrelevant. Some areas, like algorithmic trading,
    still heavily rely on well-established rules. So, it’s vital to understand the
    difference between what we call *open-world* problems, where the rules are unclear
    or hard to nail down, and *closed-world* problems, where the rules are known and
    straightforward. Open-world problems include areas like finance, social media
    trends, climate change, certain aspects of physics, and sensor data. Closed-world
    problems are more about well-defined and controlled environments.


    In the constantly evolving world of AI, both algorithmic and data modeling continue
    to advance and shape our understanding. Both have their strengths and weaknesses,
    but together, they provide a comprehensive picture of the world and our role in
    it. As we continue exploring these two cultures, the fascinating interplay between
    rules, understanding, and data in intelligence keeps spinning an engaging tale.
    It’s a narrative that’s steering the course of AI and our journey toward a data-driven
    world.


    **Key Takeaways**


    • AI’s Many Hats: AI isn’t just about building machines that can think like humans.
    It’s a varied field that’s about creating systems that can boost our abilities,
    tackle complex problems, and make decisions on their own.


    • AI’s Two Pillars: AI is built on two basic principles. The first is about making
    rules based on our understanding of a problem and then programming these rules
    into a machine. The second approach, which is the main one used in modern machine
    learning, is about creating rules straight from the data.


    • Moving to Data-Driven Models: There’s been a big shift from AI based on rules
    to models driven by data. We’re relying more and more on machine learning to find
    patterns and insights in huge amounts of data.


    • The Role of Statistics in AI: Statistics—the study of learning from data—plays
    a central part in AI. It helps us understand the world and makes it possible to
    create data-driven rules when the ones based on human understanding just don’t
    cut it.


    • Two Sides of Statistical Modeling: Data science is divided into two camps—data
    modeling, which aims to understand the causes and basic models, and algorithmic
    modeling (or machine learning), which is all about making accurate predictions,
    regardless of whether we understand the process involved.


    • Striking the Balance Between Predictions and Understanding: While the main goal
    is to make accurate predictions, there can be times when it is important to understand
    the causal process behind an event. The best approach might be to use the strengths
    of both algorithmic and data modeling.


    • Open-World Versus Closed-World Problems: It’s important to tell the difference
    between *open-world* problems, where the rules are hard to pin down or unclear,
    and *closed-world* problems, where the rules are clear and straightforward. Knowing
    what kind of problem we’re dealing with can help us figure out the best way to
    tackle it.


    • Dealing With Complex Models: As AI models get more and more complex, the way
    we manage them needs to change too. Making sure everything is safe and protecting
    against unexpected problems become the key, even when we can’t fully understand
    the model.


    [**Learning Machine Learning**](#contents.xhtml#chapter-02)


    *Success isn’t about data collection, it’s about data management and insight.*


    **You’ve Cracked the AI Code’s First Layers**


    Nice job! You’ve just taken your first steps into the world of AI, diving headfirst
    into its complexities, checking out potential bumps in the road, and poking around
    its limits. We’ve discovered that AI is less about brainy magic and more about
    the wonder of statistics. Now, as we dig deeper into this fascinating topic, let’s
    get to know the powerhouse behind modern AI—machine learning.


    Machine learning, a term that keeps popping up in AI discussions, has played a
    big part in shaping the AI world we see today. In this chapter, we’ll boil machine
    learning down to its core. We’ll tackle questions like:


    “What exactly is machine learning?”


    “How does it show up in everyday stuff?”


    “What kind of problems can it help solve?”


    To gain a deeper understanding of machine learning, it is helpful to compare it
    with something more familiar like traditional programming. You’ve probably used
    programs or apps that take some data (inputs) and spit out results (outputs).
    The secret sauce in these operations is a set of rules, cleverly crafted by programmers,
    that turn inputs into outputs.


    In the world of traditional programming, these rules are key. They’re carefully
    put together to guide the computer from inputs to the outputs you want. Like a
    hardworking assistant, the computer follows these instructions to the letter.
    If you tell it to square a number, it’ll do just that, without fail, day in and
    day out. But the world of machine learning is a whole different ballgame.


    Machine learning sets itself apart from traditional statistics by putting the
    spotlight on prediction instead of cause and effect. Let’s say you’re about to
    go outside, and you’re wondering whether to bring an umbrella. You’d probably
    check the weather forecast to make a smart decision. The forecast doesn’t need
    to explain how clouds form or how an umbrella works. And it can’t change the weather.
    All it does is give you a prediction, helping you make a better decision.


    In the same way, machine learning is great at making predictions. Think about
    personalized recommendations, which are basically predictions of what people will
    like, leading to custom-made suggestions. These recommendations might not explain
    why people like what they like or give ways to change their tastes. But they’re
    a top-notch tool for predicting what people might enjoy.'
