    随着我职业的进步，技术也随之发展。我的诺基亚手机被黑莓取代，接着又被 iPhone 3 取代。随着 Facebook 的出现和 WhatsApp 的即时通讯，社交媒体时代到来。今天，我的数字足迹非常庞大。人们可以通过电子邮件找到我，通过我的两台笔记本电脑中的任何一台，或者我的三个邮箱账户与我联系。你可以给我发短信、打电话、视频聊天、给我留言语音邮件，甚至可以查看我是否读了你的信息。但一个反复出现的问题依然存在——这些进步是提高了我的效率，还是降低了效率，还是让它保持在原来的水平？与我父亲相比如何，他竟然在技术匮乏的情况下取得了如此巨大的成就？


    这种视角让我重新审视了技术在我生活中的角色。当我深入探索人工智能（AI）时代时，这些问题变得更具意义。这种通过技术带来的工作和通信的变革是一把双刃剑——它开启了新的可能性，但也让我思考，它是否让我在工作中变得更加高效。


    经常，我发现自己只是在看着孩子们：我那活泼的九岁儿子丹尼尔（Daniel），和我充满活力的 13 岁少女卡梅尔（Carmel）。我不禁好奇他们即将踏入的未来。他们现在在学校学的知识，等他们步入大学时可能被视为过时新闻。而且谁能说他们选择的职业在他们向空中抛出毕业帽时是否还存在呢？这种感觉就像我正站在流沙上，写着一本关于
    AI 的书，深知在大约 10 年后，我们所知的世界可能完全不同。所以，大问题是——虽然 AI 在小规模上帮助我们完成更多工作方面表现出色，但当我们观察大局时，它真的能改变游戏规则吗？


    对我来说，答案取决于几点——我们希望 AI 为我们做什么，以及我们决定如何引导它的增长。在 AI 把我们变成机器之前，为其注入人性化至关重要。我们必须记住，我们是血肉之躯，而不是金属和电线。技术正以惊人的速度飞速发展，但我们呢？我们的设计初衷仍然是缓慢。我们每晚都需要六到八小时的睡眠。我们渴望与人的聊天和联系。不久前我看了一位哈佛教授极极精彩的
    TED 演讲，他展示了在生活中保持紧密的社交联系是帮助我们保持快乐和长寿的要要因素。我们仍然渴望生活中简单的喜悦——睡前故事的魔力、日落的美丽、无所事事度过懒散日的快乐。在检查电子邮件之前，醒来对身边的爱人说早上好，这依然很重要，并将永远如此。我们不是机器人。我们是充满情感的复杂生物，而不是一团电线和电路的集合。


    这并不是说 AI 没有什么可以提供的。它确实有很多贡献。它可以从我们肩上分担那些无聊、重复的任务，通过预测结果帮助我们做出更好的决策，并微调我们的偏好，以便我们能够过滤掉所有噪音，找到真正对我们重要的东西。但如果过度迷恋技术，让它分散我们对那些真正体现人性的人事的注意力，那是危险的。


    在技术与人类生活之间、在 AI 与我们自然的节奏之间找到平衡：这就像是一场我们仍在学习的舞蹈。这有点像在玩杂耍，但这是我们必须做的。采纳 AI 并不意味着我们应该让它接管。它是一个工具，一个非常强大的工具，但它的存在是为了帮助我们，而不是指使我们。


    当我们迈入充满 AI 的未来时，我们必须确保我们是掌握主动权的人，而不是相反。我们需要把人性带入科技中，记住我们自然人类节奏的重要性，并确保在利用 AI 构建未来的同时，不要忘记生活。


    当我还是青少年时，如果我想和朋友聊天，我只需凭记忆拨打他们的号码。我没在开玩笑，我当时背了大约 40 个电话号码——朋友、家人和重要联系人。但后来手机出现了，所有那些背过的号码都开始遗忘。


    我还有另一段 25 岁时的强烈记忆。当时我和我的女朋友（现在已是我那了不起的妻子艾因纳特，Einat）去巴塞罗纳旅行。我们决定在那儿租一辆车，我从租赁公司借了一张地图。我实际上背下了我们的整个路线——转弯处、街道名称、每个转弯之间的距离——一切。现在，我只需要在智能手机上点几次按钮，`Google
    Maps` 或 `Waze` 就会指路。多亏了技术，我的自然方向感似乎睡着了。


    我们世界的这种变化是真实的，它让我思考我的孩子们即将踏入的未来。他们能在不依赖监控他们每一次按键的 `Grammarly` 的情况下正确拼写单词吗？他们能体验到自己寻找并发现信息的快感吗，还是会完全依赖
    AI 和搜索引擎？我甚至不想提到字典和百科全书。即使像 `Wikipedia` 这样的在线资源可能很快就会变成历史。


    当我们构建 AI 时（我也参与其中），我们需要深思并并有强烈的责任感去执行。当我们与自然语言处理系统和大语言模型对话时，我们应该记得使用“请”和“谢谢”，因为这些
    AI 模型是从我们身上学习的。它们就像在我们的数字世界中长大的孩子，我们希望教它们礼貌和善良。我们需要确保不滥用 AI，利用它目前无法追踪数据来源的缺陷。我们不能让偏见进入我们的
    AI 系统并伤害某些群体，因为制衡机制仍在追赶。现在，你是负责任的人，我也是如此，我们都是。在这个尚未学会自我管理的混乱局面中，我们是成年人。正如我之前提到的，技术正在超越我们。但这并不意味着它需要夺走我们的控制权。


    我们欠自己、欠孩子、欠后代的，是构建负责任、公平且伦理的 AI。我们应该问自己的问题不仅是想要什么样的 AI，而是为了构建这种 AI 我们需要做什么。这不仅仅是关于制作精科技，更是关于塑造一个尊重人性的世界，一个
    AI 帮助我们而非定义我们的世界。我们需要将这种理解织入 AI 开发的每一个部分，确保我们在利用 AI 构建未来的同时，没有忘记生活。


    ## 直直向前


    ### 如果我不以 AI 主导呢？

