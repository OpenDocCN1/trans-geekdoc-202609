    一直令许多大型公司感到困扰的一个大问题是在线购物世界中的诈骗检测。随着在线购物变得日益常化，从日常必需品到大件家居用品，将欺诈交易与合法交易区分开来的挑战已显著增加。


    初看之下，你可能会想：“让我们用 AI 来解决这个问题吧。”这种方法看起来非常简单——收集大量的交易数据，识别出可疑交易，使用这些标记好的数据训练机器学习模型，然后，哒的一声，你就拥有了一个能够标记潜在诈骗的自动化系统。许多金融机构和数字支付平台确实在朝着这个方向努力，希望开发出基于机器学习的解决方案来降低在线诈骗的风险。


    但很快就会发现，这条路上充满了重重障碍。一个重大障碍是决定如何对交易进行标记。由谁来决定哪些交易可能是欺诈的？他们根据什么依据做出这种判断？他们是在对每笔交易进行详尽的调查，还是根据浅层次的模式做出快速决定？


    现在，考虑这种情况：如果负责识别诈骗的人员无法对什么构成诈骗达成共识，那么在这些不一致的数据上训练的机器学习模型也将同样不确定。这与预测明天是否下雨不同，因为大家对什么构成下雨是有共识的；潜在欺诈交易的标记具有高度的主观性，这使得构建一个普遍接受的模型变得极具挑战性。


    更复杂的是，诈骗在不断演变。诈骗者不断调整策略，变得越来越复杂且难以检测。在线诈骗的这种动态本质进一步复杂化了检测过程。


    尽管检测在线诈骗最初看起来可能只是简单的数据收集和处理问题，但其内在问题要复杂得多。它们涉及到识别哪些交易可能是欺诈的微妙任务，因为你必须跟上诈骗者策略快速变化的本质。总之，检测在线诈骗不仅仅是处理数字；它是一个需要敏锐且灵活解决方案的复杂谜。


    ### 过去数据的局限性


    想象一个在线诈骗，声称某个热门电子商务网站在未来一小时内提供 95% 的折扣。这可能是一个真实的限时促销活动，也可能是一次针对毫无防备的购物者的欺诈尝试。在过去数据上训练的
    AI 系统无法区分这两种场景——它没有对该电商网站当前促销活动的实时洞察。同样，如果诈骗者制造了一个关于新货运规定导致重大延误的虚假信息，AI 系统无法仅通过过去的数据来验证这一说法。


    这种对过去数据的依赖是 AI 的一个根本局限。基于历史数据的模式匹配无法为当前或未来事件提供有价值的见解。这并不是通过简单获取更多或更好的数据就能解决的局限性。它是
    AI 工作的一个基本方面，在对基于 AI 的解决方案设定预期时，这一点至关重要。


    关键点在于：将现实世界的事件转换为数据集可能会限制我们通过 AI 实现的目标。你可能会想：“我想要一个能够准确检测在线诈骗的 AI 系统”，这看起来很合理。毕竟，一个人类专家团队可以检查单笔交易并识别潜在的诈骗，那么为什么
    AI 系统不能做同样的事情呢？


    挑战在于训练 AI 系统所需的数据的性质。人类专家可以获取大量的上下文信息，而 AI 系统只能从提供给它的特定数据中学习。因此，对人类来说似乎很简单的任务，对
    AI 来说可能极其困难，甚至是不可能的。


    因此，当我们计划使用 AI 来解决某些任务时，即使任务看似可行且简单，也需要进行调整或重新定义。这并不是技术的缺陷，而是反映了机器学习的本质特性——它依赖历史数据来对现在或未来做出预测。


    ### 从揭露诈骗到暴露机器人


    让我们从另一个角度来看这个问题。许多平台并没有尝试孤立出数字宇宙中的每一个诈骗，而是决定退后一步，关注一个更广泛的目标：诈骗背后的机器人。事实证明，这项任务没那么复杂，因为关于什么账户符合机器人的定义，人们有更多的共识。


    想想：想象一个在线平台在创建账户时有一个特殊的筛选测试。假设它要求解决一个小谜题或回答一个需要类人类思考和反应的问题，这超出了机器人的能力。这种方法可以根据账户在这些测试中的表现，将账户标记为
    `bot`（机器人）或 `not a bot`（非机器人）。


    我们在这里所做的是一种转折。我们不再深陷于这是否为在线诈骗的问题，而是转向另一个更直接的问题：“这个账户是由机器人操作的吗？”与识别诈骗相比，收集有关机器人活动的可靠数据通常没那么棘手。


    然而，请记住，我们在这里处理的是稍有不同的问题。如果我们的目标是检测诈骗，我们的本能反应是在内容被标记为诈骗时立即将其删除。但对于机器人检测，反应可能会有所不同。也许我们会限制机器人账户的活动，也许限制其覆盖范围而不是完全删除。存在多种可能的反应，因为归根结底，我们解决的是一个不同的问题。


    所以，这就是黄金法则：你有一个想要解决的问题（诈骗检测），然后有一个相邻的、没那么复杂的问题（机器人检测）。游戏的关键在于识别这个相邻的问题，有效地解决它，并将其作为替代方案以实现你最初在原始问题中想要实现的目标。


    ### 总结


    AI 无法理顺我们人类之间混乱的争论。而且信你不信，有时它会让情况变得更糟。它可以用机器学习系统所谓的`公平性`来掩盖我们的争议。你可能不同于标记人员，但一旦任务交给了
    AI，还有谁来争论呢？你可能会认为机器学习是中立且正确的，但实际上它只是在重复你最初反对的标记。


    你可能会遇到的另一个问题是精确定义你想预测的内容非常困难。我们可能对理想输出有基本的了解，但将其转换为适应数据集的量化列……这是一个真正的挑战。这个问题不仅限于检测诈骗或识别机器人；它还延伸到了诸如信誉状况或资质等模糊的概念。当然，如果我们能让
    AI 预测谁是合格的申请人，那太棒了。但这与出现在你数据集中的实际变量并不完全相同。


