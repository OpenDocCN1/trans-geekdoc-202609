    To put it in simpler terms, think of GPT as an AI that enhances your phone’s suggested
    next word functionality but considers hundreds of previous words instead of just
    a couple. This text generation process is a series of individual predictions about
    the most likely next word, each contributing to a cohesive piece of text. So,
    we find ourselves back at our starting point: the captivating world of generative
    AI.


    However, it’s important to clear up a common misconception at this point. ChatGPT
    and GPT are not the same, and understanding the differences between them can shed
    light on how these models work. ChatGPT typically uses a GPT-3 model, or GPT-4,
    or any subsequent version. This model has been tweaked to give ChatGPT its conversational
    abilities, rather than just predicting the next word. But at its heart, it’s all
    about predicting what comes next.


    GPT, the cornerstone of language modeling, isn’t exclusive to a specific entity.
    Through certain modifications or *finetuning*, GPT has been adjusted to create
    ChatGPT, making it more suitable for everyday conversation. While the core concept
    has been around for a while, adapting a model for public use as a chatbot required
    extra work. But the principle remains: predicting the next character, step by
    step.


    This process starts with a sentence like “I’m having an awesome day.” Each subsequence
    becomes a data point for training. If *awesome* is the input, *day* is the output.
    Repeating this process generates countless training examples from a single sentence,
    each forming a unique input–output pair.


    GPT’s training data is sourced from various places, including Web texts, Wikipedia,
    and more. Transformed into machine-readable *tokens*, the model trains on hundreds
    of billions of words. But at its core, it’s all about predicting what comes next.


    **The Delicate Interplay of Chance and Skill in Generative AI**


    One important fact to understand about GPT is that it doesn’t just spit out the
    likeliest word. Instead, it assigns odds to a range of words, and its choice reflects
    these probabilities. For example, if there’s a 50-50 shot the next word is *essential*
    or *crucial*, it will make a toss-up pick based on these odds. This touch of unpredictability
    means that if it were asked to repeat the task, it might make a different choice
    each time, injecting a pinch of creativity into the mix.


    While these models are rooted in supervised machine learning, as we’ve touched
    on, they demand a hefty amount of engineering wizardry to be fully operational.
    We’ve advanced a great deal from Shannon’s original method, cooking up complex
    systems that handle sophistication in a far more efficient manner.


    Understanding how these models tick helps us critically evaluate claims about
    their deep comprehension or intelligence. While GPT might not genuinely understand
    text the way a human does, its predictive prowess is hard to question. It’s processed
    more text than any human could ever get through—but this doesn’t mean it boasts
    superior knowledge or understanding. We need to remember that human and machine
    intelligence function on fundamentally different scales. GPT might be a pro at
    predicting the next word in a sequence, but it doesn’t *know* more about a subject
    than a human does.


    **GPT to ChatGPT**'
