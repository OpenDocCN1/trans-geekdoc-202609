  raw: 'The main takeaway here is that restricted outcomes problems can take many
    forms, reflecting the wide range of contexts in which decisions sway the range
    of outcomes we can see. By understanding these variations, we can design machine
    learning systems to deal with these scenarios more effectively.


    ***The Importance of the Restricted Outcomes Problem***


    The real problem with restricted outcomes comes down to not having enough data—or
    to put it more precisely, missing labels for some parts of the population. This
    issue is similar to trying to find your way through a maze with half the map missing—you’re
    lacking key information that could radically change your decision making.


    Consider those we don’t have information on; folks who didn’t get a university
    admission, folks who weren’t given a job offer, or people who didn’t get the green
    light for a project proposal. At the heart of the matter is that we don’t know
    what might have unfolded if we’d chosen a different path. In other words, we never
    get a glimpse of the *what-if* scenarios—the alternative realities—for these folks.


    Let’s circle back to the university admission example. We never really find out
    whether those who didn’t get admission would have excelled in their studies or
    not. Even if your model was spot-on in figuring out who would and wouldn’t succeed,
    there’s no foolproof way of verifying that. What if the model’s off? If you’re
    denying admission to too many people who might’ve excelled, there’s no real way
    to spot these blunders. You never see the alternate outcomes—what might’ve happened
    if you’d chosen differently.


    This makes the restricted outcomes issue quite a sneaky problem, as it means missteps
    might go unnoticed. Without feedback, your models might keep straying off the
    right path, perpetuating the cycle of flawed decisions. If you’re not working
    with the full dataset, any model you whip up will naturally be a smidge off the
    mark, which can spell big trouble, especially in critical areas like education
    or business. So, wrapping our heads around and tackling the restricted outcomes
    problem is a crucial step in any decision-making process that uses predictive
    models.


    ***What Are Our Options?***


    When we start wrestling with the restricted outcomes problem, we need to think
    hard how we can best navigate this tricky situation. Let’s take a few strategies
    that people often employ in the field. We’ll explain each one, discuss how they’re
    utilized in real-world situations, and figure out where each shines the brightest.


    The most prevalent method, which seems to me like the least effective solution,
    is simply to do nothing. This can be called as the *launch and pray* method. The
    only solid reason to opt for this method is when there’s a good chunk of randomness
    in the way you make decisions.


    In other words, this strategy might work decently if your decisions don’t consistently
    leave out a large group of people from your label gathering. To clarify, let’s
    switch gears to the education system and the university admission predictions.
    In real life, the success of these systems is gauged based on how much admission
    directors’ decisions differ.


    Admission directors, being human, naturally have a touch of randomness in their
    decisions—they all have their unique way of evaluating applicants. If you deployed
    an admission prediction model for just one director, figuring out how well it’s
    performing would be quite challenging. But, if you had, let’s say, 10 directors,
    all interpreting the predictions in their own way—some might disregard the predictions,
    others might admit everyone—you’d see a nice variety in decision making. This
    natural diversity could be used to spot any missteps your model might be making.


    Getting into the nuts and bolts of how you’d put this into action is a bit beyond
    our scope right now, mainly because it’s tangled up with complex administrative
    issues. But the key takeaway here is that an officer doesn’t strictly follow your
    admission prediction. Their decision making isn’t as clear-cut as accepting someone
    if the prediction hits a certain threshold and rejecting them otherwise. Officers’
    decisions, even though they might be influenced by your predictions, have a random
    element, deviating from a straightforward high-risk reject system. This variety
    can be harnessed to check how well your predictions are faring.


    So, the launch and pray strategy could work reasonably well if there’s enough
    natural variation and experimentation happening, but it’s crucial to highlight
    the fact that just having that experimentation isn’t enough. You must actively
    engage with the data you’re collecting, take a thorough look at it, and figure
    out how well your model is performing. A significant part of the launch and pray
    strategy isn’t just the launch—it’s also the consistent, in-depth evaluation to
    ensure your model is on target.


    Other methods revolve around intentionally collecting a broader array of data.
    Essentially, this involves collecting data from a more diverse range of individuals
    before embarking on constructing your actual model. For instance, if you intended
    to make predictions about online course completion, you might want to look beyond
    just analyzing the characteristics of those who have completed courses before.
    You could partner with other online education platforms, acquire their data, or
    survey a larger group of students, all with the aim of gathering more data to
    strengthen your model.


    Let’s consider how this strategy could play out in a wellness context. One initial
    method could be to randomly offer a wellness program to a wide range of individuals
    and then monitor anyone who sticks with the program. This data could then be utilized
    to create your predictive model. While random enrollment might not be the most
    efficient strategy in the long run, it could provide some valuable data in the
    short term.


    The heart of this approach is the active collection of more diverse data. It’s
    crucial to realize, however, that data collection isn’t a one-time task—it’s an
    ongoing process. As the world evolves, your model needs to evolve with it to stay
    relevant, which means continually updating and gathering data.


    This strategy fundamentally involves deliberate experimenting. In fact, some experts
    have pushed this concept even further by incorporating randomness directly into
    the decision-making process from the outset. This is similar to A/B testing, where
    random responses are used to enhance and evaluate models. This method is often
    used in recommendation systems.


    Consider a music streaming platform: it doesn’t just play you the top 100 songs
    it believes you’ll enjoy the most. There’s a certain level of randomness mixed
    into your playlist. This intentional variation is designed to test the model’s
    assumptions—whether you skip a song as predicted or, conversely, enjoy something
    the model didn’t think you would. The feedback from these tests helps finetune
    the model. If a prediction turns out to be incorrect, the error is identified
    and can be learned from, which wouldn’t be possible if the system only played
    you what it assumed were the top 100 songs you’d enjoy. Therefore, this process
    of including deliberate randomness offers a more flexible and adaptive way to
    tackle the restricted outcomes issue.


    **Interactive AI Systems**


    ***Diving Into Interactive Systems***


    Now, let’s discuss a frequently observed setup in machine learning work-flows,
    referred to as interactive AI systems. This setup focuses on the various ways
    we can incorporate humans into machine learning procedures. The question we often
    grapple with is: what should human involvement resemble, and what alternatives
    can we employ?'
