    气象学家们承担着一项艰巨的工作，即决定天气将会如何。会下雨吗？会有风暴吗？天气会有多热？他们的决策依赖于大量的变量，如温度、`humidity`、`wind
    speed` 等。所以基本上，他们需要预测两件事：天气将如何（天气预报）以及它将如何影响日常生活（影响预测）。


    在我们深入探讨预测之前，让我们想象一下如何实现这一过程自动化。我们可以使用历史天气数据、当前大气状况和其他相关细节作为输入。输出即我们的目标 `Y`，将是气象学家的决策——预测下雨还是晴天。这种自动化模型的训练数据是过去的天气记录。


    但是，问题在于，这种自动化方法听起来很简单，但实际上充满了重重。天气预报取决于许多因素，这使得数据对于自动化系统来说变得不可预测且混乱。当事物保持稳定且可预测时，自动化是非常棒的，但这里的情况并非如此。此外，偏见会让这些预测变得更加复杂。即使是最好的气象学家也会受到各种因素的影响，从过去的经验到直觉。对天气预报的伦理担忧为使用自动化增加了了更多不确定性。


    鉴于这些挑战，自动化可能不是天气预报的最佳选择。因此，我们将重点转向预测。我们保持相同的输入变量不变，但将输出改为对天气状况及其潜在影响的预测。训练数据来自历史天气记录。这种向预测的转变为利用技术改进复杂的天气预报领域提供了一个很有前景的替代方案。


    但是，与自动化一样，这条道路并非一风顺。一个大问题是所谓的单方面或选择性标签问题。这意味着数据中存在内在偏见，因为只对以前出现过的天气条件观察结果。这意味着我们的训练数据是一个有偏的样本，这对于创建成功的预测模型来说是一个巨大的挑战。


    # 处理 AI 应用中的预测挑战


    现在我们已经为预测挑战做好了准备，让我们深入探讨在选择预测而非自动化时会出现的一些障碍。记住，如果我们选择自动化，我们只需要跟踪每位气象学家的天气预报即可。但通过预测，我们并不总是能看到实际的天气事件，因为它取决于气象学家的预报。所以，虽然预测具有巨大潜力，但它带来了一个我们在自动化中不会遇到的独特阻碍。


    当我们深陷预测任务时，经常会遇到一种常见的情况：有人根据某些因素不断猜测一个结果。困难之处在于弄清楚此人是如何做出猜测的。将此转化为自动化任务似乎是合逻辑的，因为我们可以看到猜测过程，这个过程看起来是可以自动化的。但当我们拥有坚实的数据时——不仅是关于因素和猜测的数据，还有关于实际结果的数据——就会切换到预测任务。


    如果一位气象学家正在猜测下雨的概率，我们可能希望将这个猜测过程自动化。但如果我们有关于实际雨日的坚实数据，我们就可以跳过对气象学家的猜测进行自动化，转而预测实际天气。这种从标签是对结果进行猜测的自动化任务，到拥有关于结果本身数据的预测任务的切换，是我们我们处理问题方式的一种重大转变。


    我们已经看到这种切换在许多情况下发挥了奇效。在天气预报中，我们预测降雨、晴天或降雪的结果。在农业中，我们经常利用收成数据、灌溉模式或虫害情况来预测作物产量。对于学校停课，预测任务可以是估计天气必须达到何种程度才会导致关课。


    但这些预测任务并非没有我们提到的选择性标签问题。例如，我们看到了采取某些灌溉模式的农场的作物产量数据，但没有看到未采取这些模式农场的数据。这个问题经常出现在预测任务中，因为虽然我们可以获得各种猜测的数据，但实际结果数据通常取决于最初的猜测。这一问题往往在我们从自动化问题切换到预测问题时出现。


    预测任务也出现在其他领域，例如预测自然灾害的预测（即我们预测确认的地震活动或飓风路径），或预测能源消耗（即我们预测用量高峰）。这些情况通常也会遇到选择性标签问题。因此，在决定是否使用预测作为工具来解决你的问题时，意识到这些挑战是关重要的。


    # 预测作为决策的伙伴


    当我们开始在现实生活中更多地关注预测而非自动化时，我们看到了一种整齐的模式。与旨在接管的自动化不同，预测通常被视为决策中的一个加分项，特别是在刑事司法等复杂系统中。法官经常将关于被告未出庭或再次犯罪的预测作为其判决的关键部分。


    预测工具的设计至关重要，并能真正影响它们运行得否。这不仅涉及获取用于预测的高质量数据，还需要以能够帮助人们的方式展示这些预测。它们引导用户理解预测的风险并比较不同的概率。


    '
- fmt: '

    Companies gather a lot of data as part of their everyday operations, especially
    in today’s digital age where most transactions are done online. Often, this data
    isn’t used to its max potential because its real value is hidden.


    Consider `Netflix`, the streaming service, for example. They have a ton of data.
    This includes information about what shows are trending or which ones get abandoned
    mid-season. The value of such data is clear, as it can be used to predict viewing
    trends or sold to advertisers for a profit. But `Netflix` also has access to less
    obvious data. By simply monitoring the speed at which different shows are streamed,
    `Netflix` could collect important information about Internet speeds in various
    locations, a valuable bit of information for Internet service providers. The main
    takeaway here is that even a small effort in collecting data can unlock a lot
    of extra value.


    The data you already have might be a goldmine that’s just waiting to be discovered.
    Gathering detailed viewing data, for example, might be expensive or even illegal
    for some organizations, but a company like `Netflix` can easily get it from their
    existing resources. It might not be worth it for a company to monitor Internet
    speeds across cities, but for `Netflix`, whose service relies on these speeds,
    this is an added perk.


    These uncharted opportunities exist whenever your position allows you to collect
    valuable data during your regular operations. For others, the cost of collecting
    this data might be too steep. The trick is to recognize these additional perks
    and use them to your advantage.


    Consider `Strava` as another example. As an online fitness tracking platform offering
    tracking of runs, bike rides, and workouts, they have access to a heap of fitness
    data that could provide insights into how people are working out. But they’re
    also collecting more than just fitness data. They might also be gathering useful
    information about users’ locations, their preferred workout times, or even how
    much they interact with others on the platform. This secondary data could be extremely
    valuable, and it’s being collected naturally as part of their main business operations.


    So, the first step in our data-focused adventure involves realizing and using
    the hidden potential of the data we’re already gathering. The untapped value in
    your existing data might surprise you, and finding it could kickstart a new era
    of growth and opportunity for your business.


    ## Leveraging Data for More Than Originally Intended


    `Starbucks` gives us a great illustration of this approach. They smartly repurposed
    customer order data into valuable tools for making predictions.


    The trick often isn’t just about using the existing data, but about subtly tweaking
    your product or service to gather specific data you’re interested in. The online
    streaming industry is a fantastic example of this. Streaming platforms are sitting
    on a treasure trove of data: patterns of shows often watched together, trends
    in the popularity of certain genres, or even signs of online trends like viral
    challenges.


    But how did streaming platforms manage to boost the value of their data so much?
    The answer is surprisingly simple: they introduced user profiles. Back when everyone
    was sharing a single profile, data was restricted to mixed, collective viewing
    habits. With the advent of user profiles, platforms were able to link views over
    time, effectively tracking the watching journey of individual viewers. This small
    adjustment significantly boosted the value of their data.


    This strategy of making slight changes to bump up data collection is also seen
    in decisions about product design and privacy. Products are often designed not
    just to serve their main function, but also to gather valuable data along the
    way. The trick is to find opportunities to tweak your product or service to improve
    the data you collect.


    Take `Spotify` as an example. They have a heap of data generated from a single
    service—music streaming—which they then use for a totally different, but highly
    profitable, goal—advertising. This shows how existing data can be repurposed for
    something else to generate a ton of revenue.


    The digital world is loaded with examples like this. `Spotify` uses listening
    data for ad targeting, `Uber` uses ride data for city planning recommendations,
    `Duolingo` uses language learning data to improve machine learning for translation,
    and online educational platforms could potentially use course completion data
    to promote relevant future courses. The common theme here is a system originally
    designed for one purpose, but for which, the extra data gathered can be used for
    other things.


    However, it’s crucial to tread this path carefully, always being aware of privacy
    regulations and other restrictions. The challenge isn’t just about gathering data
    but figuring out how to creatively and responsibly use it to inform product decisions.
    This could involve selling the data or using it to improve your own product or
    service—like optimizing the placement of ads based on listening habits.


    The job now is to carefully examine your data collection practices and figure
    out how you can profit from the existing data. Unearthing this hidden treasure
    could unlock potential you never knew existed, paving the way for new opportunities
    for growth and innovation.


    ## Combining Data for Deeper Insights


    ### Boosting Value by Bridging Data


    The power of data grows massively when we move past the idea of looking at each
    dataset on its own. Usually, the real magic pops up when we bring together datasets
    from different places. This approach can create something that’s worth way more
    than the sum of its separate parts. However, this process comes with its own unique
    challenges, especially when it’s about bringing together datasets with different
    structures, legal implications, and financial consequences.


    Let’s crack open a common problem that often pops up in the process of merging
    datasets. Let’s say you have two datasets, `A` and `B`, which come from two different
    places, and you want to combine them. One problem you might bump into is the lack
    of common identifiers. For example, merging two datasets based on `username` and
    `e-mail` might not be enough to create a unique identifier. Despite these possible
    roadblocks, getting past them can unlock a ton of value.


    Take, for example, the challenge of predicting movie box office success. This
    is a high-stakes problem, as effective marketing strategies can be planned once
    movies with the potential for big success are identified. The solution to this
    problem can be found in the data repositories of various places. Movie review
    aggregators like `IMDb` and `Rotten Tomatoes` have heaps of information about
    movies’ ratings. However, the actual box office numbers that track the movies
    which are big hits are kept by the movie studios themselves.


    Now, imagine a situation where we could bring together these data-sets—the movie
    studio’s box office data (`B`) and `IMDb`’s rating data (`A`)—to predict a movie’s
    likelihood of being a big hit and then plan smart marketing campaigns. `IMDb`
    turned this idea into reality by forming data alliances with several movie studios,
    merging their data with the studios’ box office records, and in doing so, uncovering
    insights.


    ### Pondering the Blend of Datasets


    When contemplating merging datasets, a few key questions pop up. First, how tough
    is the task? Are there financial implications, legal hurdles, or practical difficulties
    related to the process? Second, what’s the value proposition? What will the resulting
    terrain be once the datasets are put together, and how beneficial would that be?

