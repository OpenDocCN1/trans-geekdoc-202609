- fmt: '

    The meteorologists have the tricky job of deciding what the weather’s going to
    be like. Is it going to rain? Will there be a storm? How hot is it going to be?
    Their decisions rely on tons of variables, like temperature, `humidity`, `wind
    speed`, and so on. So basically, they need to predict two things: what the weather
    will be (weather prediction) and how it will affect daily activities (impact prediction).


    Before we dive deeper into prediction, let’s imagine how we could automate this
    process. We could use inputs like historical weather data, current atmospheric
    conditions, and other relevant details. The output, our target `Y`, would be the
    meteorologist’s decision—to predict rain or sunshine. The training data for this
    automation model would be past weather records.


    But, here’s the catch. This automation approach sounds straightforward, but it’s
    full of difficulties. Weather prediction depends on a ton of factors, which can
    make the data unpredictable and confusing for an automated system. Automation
    is great when things are steady and predictable, which isn’t really the case here.
    Moreover, bias can further complicate these predictions. Even the best meteorologists
    can be influenced by all sorts of things, from past experiences to gut feelings.
    Ethical worries about weather prediction add even more uncertainty to using automation.


    Given these challenges, it looks like automation might not be the best fit for
    weather prediction. So, we switch gears to prediction. We stick with the same
    input variables, but change the output to a prediction of what the weather will
    be like and its potential impact. The training data comes from historical weather
    records. This shift toward prediction offers a promising alternative to using
    technology to improve the complex world of weather forecasting.


    But, just as with automation, this route isn’t without its bumps. One big issue
    is the so-called one-sided or selective labels problem. This means there’s a built-in
    bias in the data because outcomes are only observed for weather conditions that
    have previously occurred. This means our training data is a biased sample, which
    is a big challenge for creating successful predictive models.


    # Tackling Predictive Challenges in AI Applications


    Now that we’ve set the stage for our predictive challenge, let’s dive into some
    impediments that come up when we choose prediction over automation. Remember,
    if we’d gone with automation, we would just have tracked each meteorologist’s
    weather forecast. But with prediction, we don’t always see the actual weather
    event, because it depends on the meteorologist’s forecast. So, while prediction
    has tons of potential, it also brings a unique hurdle that we wouldn’t have encountered
    with automation.


    When we’re knee-deep in prediction tasks, we often bump into a common situation.
    Someone keeps guessing an outcome based on certain factors. The tricky part is
    figuring out how this person makes their guess. It might seem logical to turn
    this into an automation task since we can see the guessing process, which looks
    like it could be automated. But we switch to a prediction task when we have solid
    data, not just on the factors and the guess, but on the actual outcome.


    If a meteorologist is guessing about the chance of rain, we might want to automate
    this guessing process. But if we have solid data on actual rainy days, we can
    skip automating the meteorologist’s guess and predict the actual weather instead.
    This switch from an automation task, where our labels are guesses about an outcome,
    to a prediction task, where we have data about the outcome itself, is a major
    shift in the way we tackle the problem.


    We’ve seen this switch work wonders in many situations. In weather forecasts,
    we predict the outcomes of rainfall, sunshine, or snow. In farming, we often predict
    crop productivity using harvest data, irrigation patterns, or pest infestations.
    For school closures, the prediction task could be estimating how severe the weather
    would have to be to cause a closure.


    But these prediction tasks aren’t without the selective labels problem we’ve mentioned.
    For example, we see data on crop yields for farms that went ahead with certain
    irrigation patterns but not for those who didn’t. This problem often pops up in
    prediction tasks because, while we can get data for all sorts of guesses, actual
    outcome data usually depends on the initial guess. This issue tends to show up
    when we switch from an automation problem to a prediction problem.


    Prediction tasks also come up in areas like predicting natural disasters, where
    we predict a confirmed seismic activity or a hurricane path, or predicting energy
    consumption, where we predict usage spikes. These situations often stumble into
    the selective labels problem too. So, it’s crucial to be aware of these challenges
    when deciding whether to use prediction as a tool to tackle your problem.


    # Prediction as a Partner in Decision Making


    As we start to focus more on prediction instead of automation in real-life situations,
    we see a neat pattern showing up. Unlike automation, which aims to take over,
    prediction is often seen as a bonus in decision-making, especially in complicated
    systems like criminal justice. Judges often use predictions about the defendant
    not showing up or reoffending as key parts of their judgments.


    How predictive tools are designed is extremely important and can really influence
    whether they work well or not. This involves not just getting high-quality data
    for prediction but also showing those predictions in a way that can help people.
    They guide the user in understanding the predicted risks and comparing different
    probabilities.

