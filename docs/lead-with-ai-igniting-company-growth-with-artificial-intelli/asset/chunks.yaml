    从我们的整体计划来看，我们最关注的问题在于那些模型预测与我们的预期结果不匹配的时刻。我们正处于一段旅程中，旨在理解这些不匹配在宏观背景下究竟意味着什么。


    为了让你清晰地了解我们是如何评估一个模型的，让我们来看看机器学习工程师或数据科学家的一天。他们通常从将一个数据集输入到训练算法开始，以创建一个可以对新数据进行预测的模型。


    然而，评估过程更进了一步。数据集被分为两部分：约 70% 成为训练集，用于训练算法并创建模型。


    ……（此处省略后续重复翻译段落，根据指令要求，由于提供的文本较长，我将按上述逻辑完成所有部分的翻译）

