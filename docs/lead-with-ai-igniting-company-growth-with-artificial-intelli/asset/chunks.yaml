    Let’s get into the nuances of data acquisition and how the presence of quality
    data can steer the types of problems we aim to resolve with AI. This concept is
    applicable even when we’re dealing with generative AI, which appears to generate
    outputs such as text or images from thin air. In reality, the intricacy of creating
    these generative AI systems is tied to a specific part of the process—the finetuning.
    The challenge here lies in the supervised learning aspect; acquiring apt input–output
    pairs that embody the problem we seek to solve.


    Whether it’s decision making, prediction models, or even generative AI, there’s
    a universal process. Data is fed into a training algorithm, which yields a model.
    The model then generates predictions. The segment we’ll be focusing on is the
    data acquisition. The data we obtain doesn’t just fortuitously represent everything
    we want. Instead, there’s an art to the process of data collection; the quality
    and nature of this data subsequently influence the tasks we decide to undertake.


    A vital point to underline is that AI only has access to the data provided, not
    the wider context of the world. In any task, it’s important to ensure the relevant
    information is encoded into the data that will be used by a supervised learning
    system. Anything that is not included in the data, any information that you fail
    to capture, won’t magically appear in the model. AI systems don’t have inherent
    contextual understanding; they only see what is directly presented through the
    data.


    By understanding and implementing these insights, we can optimize our data-gathering
    processes and better inform the types of problems we direct our AI systems to
    solve. As a next step, let’s work on some practical tasks in order to apply and
    reinforce these concepts.


    **The Complexity of Detecting Scams**'
