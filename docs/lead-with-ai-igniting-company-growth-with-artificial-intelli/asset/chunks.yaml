  trans: '


    - 数据隐私与伦理查询：数字数据的泛滥带来了自身的一系列挑战，包括监控、隐私和公平代表。在收集数据时，将这些问题置于首位至关重要。

    - 掌握输入、输出和数据源：理解输入和输出是什么，以及数据来源何，是理解模型的核心部分。这种理解能够让你有效地对模型进行调整和故障排除。


    ## 内部机理](#contents.xhtml#chapter-03)


    *我们正处于一个算法编写代码来改进算法算法的时代。*


    ### 快速回顾


    在深入探讨之前，让我们花一点时间回顾一下目前为止涵盖的内容。还记得我们开始的时候吗？我们识别了特定问题、输入与输出的组合，并将它们交给了我们所谓的“训练算法”。这个算法随后将演变成一个“模型”，它是一个可以承担排序或预测等任务的方便工具。它只需要一组输入就能做出预测。这就是机器学习的本质。


    这种技术很酷的地方在于，它能够适应我们在日常生活中遇到的各种任务。想象一下，能够预测某人是否会偿还贷款，或者学生是否可能考优异，甚至一个以前罪犯是否可能再次犯罪。可能性的范围是巨大且非常有趣的。


    然而，尽管对此很感兴趣，我们往往避免尝试理解`under the hood`（内部）的细节，以弄清楚它是如何工作的。我们控制它的主要方式倾向于提供给它的数据——即野兽的食物。还记得我们讨论过理解系统的输入和输出有多重要吗？如果你不能准确地确定它们，基本上就像是在盲目摸索。目标是根据工具允许的范围尽可能准确地映射你的输入。


    之前，我们还开始制作一份“备抄”——一组你应该能够对任何系统回答的关键问题。如果这些问题让你感到困惑，那么这是一个警告信号，说明是时候深入挖掘了，去理解系统内部运作的迷宫。这些问题围绕着输入和输出展开：输出是如何产生的，哪些现实世界的测量值让系统运行起来，数据来自何处以及维护得如何。


    值得重复的是，机器学习不像你通常的编程，在编程中代码是王道。相反，在机器学习的世界里，嵌套在训练算法中的代码几乎是标准化的。让系统执行你想要操作的秘密在于通过示例向它展示你想让它做什么。这看起来可能很复杂，但通常往往是与现代机器学习系统工作时最困难的部分。由专业人士巧妙塑造的训练算法对我们来说随处可用——存储在无数互联网库中。真正的挑战并不是寻找算法——而是找到正确的数据来解决你试图修复的问题。


    ## 通过案例研究剥开层层


    让我们看看在线购物的世界。想象一下：我们正试图根据客户以前购买的内容来猜测他们可能可能想买什么。听起来很直观，对吧？你输入客户过去的购买记录，砰的一声，弹出一个建议，比如`环保产品`或`奢侈品`。但一旦你开始挖掘这个系统真正进入和产出的东西，事情就变得有点复杂了。你考虑过这些产品推荐是从哪里来的吗？如果你不是购物专家，你可能需要使用额外信息，如客户评论或问卷，并将这些结果作为你的标签。


    你标签的准确性实际上取决于零售商对客户的了解程度。如果零售商错过了某些关于客户口味变化的线索，你的模型将处于一片黑暗之中。另一方面，客户评论可能会揭示出并不那么明显的趋势。这些微小的细节会对你的结果产生巨大影响。


    我们将更仔细地观察这些细节，特别是使用人类判断制作的标签与直接从数据中提取的标签之间的对比。到目前为止，我们对标签的态度相当随意——标记`环保意识强`或`奢侈品爱好者`，而没有真正思考这些信息来自哪里。但我们越深入，就越看出不同方法的局限性，以及它们如何塑造我们所能做的事情。


    考虑一下农业。在气候变化导致天气变幻莫测的地方，农民不得不改变他们的种植计划。出现的一个想法是根据天气模式和土壤状况预测作物产量。你在这里将如何映射输入和输出？你将从哪里获取数据？你到底在尝试猜测什么？


    假设你正试图猜测一个农民的作物产量。你需要哪些信息来这个猜测？你会只使用他们过去的产量和天气记录吗？


    为了构建模型，你会将这些 `X` 和 `Y` 配对（天气、土壤状况以及相关的产量）喂到你的训练算法中。这些数据取自作物记录和天气报告的数据库或电子表格，经过你的训练算法的计算，产出你需要的模型。


    考虑我们用于训练这些模型的数据所产生的影响至关重要。回想农业的例子，一个可能被忽略的大因素是农民获得现代农业技术的机会。这是一件大事，因为这通常显示了农民之间资源的差异，并告诉我们更多关于他们的耕作实践。资源较少的农民产量可能比根据他们使用的工具或方法预期的要低。忽视这个关键因素可能会破坏你的预测。


    这表明，即使我们不知道模型的内部细节，只要我们知道使用了什么数据，就可以发现潜在的问题。这自然地引出了我们的下一个大问题——我们应该如何使用这些预测？


    当然，我们可以创建一个预测产量的系统，但这是否符合伦理取决于我们如何使用它。如果这些预测被用于干预市场价格，可能会加剧现有的不平等。但如果这些预测被用于帮助需要支持的农民，可能会带来更公平的农业结果。因此，我们如何使用这些预测是判断此类系统是否合道德的关键因素。


    ### 内容审核案例


    现在让我们把注意力转向机器学习对快速发展的社交媒体世界的影响。随着数字格局不断扩大，社交媒体平台正转向机器学习来帮助处理巨大的内容管理工作。让我们看看 Facebook
    的历程。起初，该公司雇用了成千上万的人，他们的主要工作是管理海量内容。他们必须筛选源源不断的帖子，将每条标记为符合平台规则或违反规则。


    这些标记，即我们输入和输出中的 `Y`，为机器学习系统创建了宝库。这里的 `X` 将是帖子的文本、图像或视频，而 `Y` 是告诉我们内容是否违反平台规则的标签。这个系统是目前大多数在线内容管理流程的基础。


    重要的是，当一个平台自豪使用 AI 进行内容管理时，它只是在将以前由人类主导的过程自动化。AI 或机器学习模型并没有带来任何新东西；它只是在反映人类审核员提供的数据，只是在规模上大得多。


