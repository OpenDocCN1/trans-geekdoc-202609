    此类事件促使行业对隐私变得更加谨慎。这种变化归因于新法律（如《通用数据保护条例》`GDPR`）以及巨额罚款。看看 Facebook；他们因为早期对隐私的松懈态度而遭受了巨额罚款。他们的隐私政策发生了巨大变化，从
    2013 年的几乎不存在到 2018 年的变得非常谨慎。


    当我们探索隐私和机器学习时，我们需要重新思考旧有的观念。我们需要更多地思考这些隐私问题如何塑造我们对 AI 的看法，以及科技巨头如何改变它们的策略。


    理解隐私这个迷谜意味着要观察不同的解释及其运作的背景。这不仅仅关乎保持个人聊天私或保持匿名。隐私，特别是在 AI 领域，是在追求技术进步与我们控制个人信息的基本权利之间寻找平衡。这是一个伦理、社会和技术因素的复杂混合，我们需要仔细思考并处理。这不仅仅是学术界的问题；它是理解
    AI 在我们世界中所扮演的角色和责任的关键部分。


    ## 隐私中的灰色地带


    许多人认为信息不是私有的就是公开的，仅此而已。但事实并非如此简单。在现实中，信息的访问程度有一整种范围。例如，加密数据在技术上是公开的，但它不像你公共社交媒体页面上的内容那样容易获取。从这种方式看待信息有助于我们更好地理解隐私。


    让我们来看一个真实案例。一组研究人员曾从在线约会网站 `OkCupid` 收集数据进行研究。尽管这些简介是公开的，任何可以使用互联网的人都能看到，但当这些数据被收集并公开共享时，人们感到非常愤怒。这表明，即使信息在技术上是公开的，我们可能仍然对其希望某些隐私保护。


    我们如何理解什么是私有的或公开的是一个微妙的平衡动作。随着技术的不断进步，这种平衡可能会发生变化。想象一下，如果警察利用热感应技术从停在门外的警车里观察你的房屋内部——这会侵犯你的隐私吗？随着技术的完善，我们需要更新对隐私的定义和标准。


    保持在线隐私的一种有趣方法是 `no index` 请求。这是一种工具，允许网站告诉搜索引擎不要列出某些页面，使它们更难找到。虽然这可以保护敏感信息，但也可能被滥用。例如，`TurboTax`
    使用 `no index` 请求从 Google 搜索结果中隐藏其免费版本，使得用户难以找到。


    当我们思考如何保护数据集中的隐私时，我们经常想到的第一个解决方案是 `anonymization`（匿名化）。这个想法很简单——只需从数据集中删除姓名和地址等内容，然后它就可以安全地供公众。但正如我们从过去的事件中学到的那样，这种在
    20 世纪 90 年代中期流行的基础隐私处理方法并不总是奏效。


    匿名化没有考虑到隐私的所有复杂性。它假设通过移除个人身份识别信息，我们就完全保护了隐私。但在当今的大数据世界中，人们经常通过将 `anonymized` 数据集与其他公开信息交叉引用来重新识别身份。隐私不是一件一劳永逸的事，而是一个持续的过程。随着我们使用越来越多的数据，我们需要让隐私策略变得更加复杂和灵活。


    ## 隐私之网


    当 `AOL` 曾经共享他们认为是匿名搜索数据时，事情并没有如计划进行。他们给用户分配了唯一的数字，将其与搜索关联起来。但《纽约时报》在利用这些 `anonymous`
    数据时，通过分析一个女性的搜索历史并确定她的位置，找到了一位特定的女性。这一事件有力地向我们证明，仅仅使用匿名化并不能真正保护我们的隐私安全。


    `Netflix` 这家科技巨头也遇到了类似的问题。他们为了研究目的共享了他们认为是匿名的电影观看数据。然而，研究人员显示这些数据可以与 `IMDb` 数据交叉引用，以确定用户是谁。


    这些案例凸显了一个事实：仅仅对数据进行匿名不足以解决隐私担忧。要真正保护隐私，仅仅删除个人标识符是不够的。我们需要观察正在处理的数据类型，并使用其他策略，例如添加噪声使数据更难以追溯到个人。


    当我们结合隐私和机器学习时，我们面临着一系列全新的挑战。例如，我们能从机器学习模型本身获取个人细节或训练数据的特定信息吗？当 `Getty Images`
    和 AI 模型输出案例出现时，这是一个大问题。模型产生的结果与训练图像非常相似，这表明模型以某种方式 `memorized`（记忆）了训练数据。


    更糟糕的是，这会导致敏感数据的泄露。想想我们设备上的自动补全功能，它们是由学习我们打字习惯的机器学习模型驱动的。它们可能会意外学习并建议像信用卡号或密码之类的敏感细节。


    为了解决这个问题，我们在文本数据中加入噪声，并编写了特定规则以避免存储和建议敏感细节。这一步有助于确保隐私，但也凸显了潜在的陷阱。即使是意良好的机器学习模型，也可能暴露有关其训练数据的人的敏感细节。


    在医疗保健等隐私至关重要的领域，这些弱点可能会导致严重的问题。最近的研究显示，可能从预测正确剂量的模型中提取出患者的遗传标记，这是一个可怕的隐私风险。


    所以，这里的重大教训是什么？简单来说，模型可能会泄露信息。它们揭示了数据集中人的细节。虽然这部分是它们的设计初衷之一——它们本应该从数据学习学习——但如果泄露了人的细节，就会变成一个巨大的问题。


    ## 核心要点


    - **意外的结果**：AI 模型对社会有巨大影响，有时这会导致意料之外的结果。例如，算法可能会无意中加强现有的偏见。这表明开发者在制作这些模型时需要考虑潜在问题。

    - **AI 如何影响经济**：AI 算法会对经济产生严重影响。当我们试图微调这些算法以减少偏见时，我们需要考虑可能的经济副作用。

    - **为什么监管很重要**：监管机构在保持 AI 系统平衡方面起着关键作用。他们为 AI 引入了某种程度的知识，并在不同专家的技术输入下使决策更加明智。

    - **隐私的真正含义**：隐私是一个复杂的概念，人们可以以不同的方式解释它。它可以意味着保持匿名或对个人信息拥有控制权。由于 AI 技术高度依赖数据，因此考虑隐私至关重要。


