- fmt: '

    Think about a coffee shop. What chunk of customer orders could be met with a standard
    set of drink preparations? Given that coffee shops usually have a set menu and
    customers mostly order from that, the chances are a big part of the orders can
    be managed with a few standard recipes. There you have it, the Pareto principle
    at work. A small set of recipes covers most customer orders.


    Let’s dig a bit deeper with an example closer to AI: an automated coffee machine.
    Picture three customers, each with different orders of varying customization and
    complexity. Every order is unique, with customers choosing their unique blends.
    However, the automated machine responds the same way to all three, asking for
    the payment before preparing the order.


    This example captures the heart of the Pareto principle: a small number of settings
    and modes effectively handling most customer orders. But keep in mind, while a
    hefty chunk of service can be sorted using preset modes, there will always be
    orders that throw us a curveball.


    Imagine a fourth customer with a wacky request—they want a coffee blend that isn’t
    on the menu. This order doesn’t neatly fit into a preset mode. It calls for human
    action, pointing out an important fact; while automation is a whiz at taking care
    of most routine tasks, there’s always a ”long tail” of out-of-the-ordinary cases
    that need the flexibility and understanding that only humans can provide.


    So, the Pareto principle highlights the need to concentrate on automating certain
    tasks, instead of trying to automate a whole job. Automation and AI can pick up
    the slack for the repetitive and high-volume tasks, while humans tackle the complex,
    unexpected, and subtle cases, showing the awesome teamwork of human and AI.


    The Pareto principle is a handy guide for finding the areas where automation can
    make the most impact, but it’s got its limits: the long tail of events that don’t
    quite fit under our range of preset modes. Balancing automation and human interaction
    to deal with these special cases is the key to keeping a system nimble and effective.


    ## Crafting Strategy With the Pareto Principle and AI Triage


    The main takeaway from using the Pareto principle in AI is that while we might
    not be able to automate everything, we can take care of a good chunk of the simpler
    tasks. This can seriously boost how much we can get done and how efficiently we
    do it. The key idea here is understanding that not every job can or should be
    automated. However, a hefty chunk of them can be automated, leading to big improvements.


    This point gets us to a vital part of AI strategy: `AI triage`. In this approach,
    AI takes on most of the routine tasks, leaving the trickier or unexpected ones
    for humans to deal with. It’s like a great tag-team effort between artificial
    and human smarts, whereby AI tackles the boring, predictable work, and humans
    sort out the rest, making the best use of both.


    One of the main challenges with this approach is figuring out how to spot and
    send the more complex cases to human agents without messing up the customer’s
    experience. The way we set up this environment can make a big difference in how
    well it works.


    We can think about a few possible setups. The simplest one might be a system where
    every chat starts with an `AI chatbot`. The AI keeps the chat going until the
    customer asks to speak with a human or the chat starts to go off-track or goes
    haywire. At this point, the chat gets rerouted to a human agent. This setup puts
    AI in the driver’s seat, calling in human help only when needed.


    Another setup might involve a human agent who is always ready to step in, checking
    and okaying, tweaking, or even completely redoing AI-generated responses as required.
    In this case, the AI acts as a first shot at a response, with a human in the loop
    making sure the quality is up to scratch and dealing with more complex chats.


    These are just a couple of ways AI can be used in a triage role, using its strengths
    in dealing with repetitive, high-volume tasks while keeping the human touch where
    it’s most needed. We’ll dive deeper into the ins and outs of AI environments and
    how to design them best in future discussions. For now, though, it’s vital to
    see the game-changing potential AI has in reshaping how work is done, increasing
    productivity, and improving customer experiences, even when total automation isn’t
    the goal.


    ## Unfolding the Pareto Principle in AI Applications


    The `80/20 rule` is a really useful lens that we can use to understand how AI
    operates in all sorts of situations, helping us shape and finetune our AI strategies.


    Take the world of tech support, for example. The majority of support requests
    usually fit into a few common categories. So, wouldn’t it be smart to let a chatbot
    take care of these routine issues? That’s exactly what some savvy tech companies
    do. They deploy chatbots to handle most of these familiar requests, based on their
    experience with what customers usually need help with. This leaves the human tech
    support team free to deal with the more complex, oddball problems. It’s all about
    letting AI tackle the regular stuff and letting humans deal with the unique, one-of-a-kind
    cases.


    The same idea works well in areas like automated captioning and voice recognition.
    When we speak, we often use a bunch of common words again and again. AI is pretty
    nifty at spotting and transcribing these words. Sure, it might have a tough time
    with unusual slang or specialized jargon, but it handles the everyday language
    like a champ. And that’s what counts most of the time.


    But it’s not just about simple tasks like voice recognition and tech support queries.
    This principle is at play even in high-tech systems like an AI restaurant table
    booking service. You might think making a reservation could lead to all sorts
    of different chats, right? But in reality, most of these conversations stick to
    a few main details—how many diners, what date and time, and any specific seating
    needs. The AI booking service might trip up with rare requests, but it nails it
    for the majority.


    So what’s the key lesson here? The Pareto principle is like a superpower for AI.
    It tells us that we can achieve a lot by zooming in on a small set of common patterns
    and leaving the unique, out-of-the-ordinary stuff to humans. It’s like a `GPS`
    guiding us along the quickest route to automating the things that really matter.
    This helps us decide where to point our AI efforts, making our AI tools more efficient
    and helping them excel at what they do best.


    ## The Impact on AI


    The point we’re discussing in this section is that it tells us a tiny bit of something
    can often lead to a whole lot of something else. One of the main hurdles we face
    with perfecting AI is dealing with the `long tail`, or the rare or unique situations
    that don’t happen very often. This is one of the reasons why we don’t see self-driving
    cars everywhere yet. Sure, the AI that drives these cars can handle normal driving
    scenarios and most highways. But when it comes to driving, we need super high
    levels of accuracy because safety is at stake. The tricky part is coming up with
    a smooth system that lets a human driver take over when the AI encounters a strange
    or dangerous situation it can’t handle. And let’s face it, reaching 100 percent
    perfection is pretty much impossible, given all the different driving conditions
    and potential emergency situations.


    So, given this reality, it makes more sense to look for places where we can use
    AI, even if it’s not 100 percent perfect. In other words, we need to find situations
    where an 80 or 90 percent success rate is good enough.

