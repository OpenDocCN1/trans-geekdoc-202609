    公司在日常运营中会收集大量数据，尤其是在如今大多数交易都在网上完成的数字时代。通常，这些数据并没有被挖掘出最大潜力，因为它们的真实价值被隐藏了。


    以流媒体服务 `Netflix` 为例。他们拥有海量数据，这包括关于哪些节目正成为趋势、或者哪些节目在季中被弃弃的信息。这类数据的价值是显而易见的，因为它们可以用来预测观看趋势，或出售给广告商以获利。但
    `Netflix` 还能获取一些不那么明显的数据。通过简单监控不同节目的播放速度，`Netflix` 就可以收集有关不同地区互联网速度的重要信息，这对于互联网服务提供商来说非常有价值的信息。这里的核心观点是，即使在收集数据上付出微小的努力，也能解锁巨大的额外价值。


    你已经拥有的数据可能是一个等待发现的金矿。例如，收集详细的观看数据对某些组织来说可能昂贵甚至非法，但像 `Netflix` 这样的公司可以轻松地从现有资源中获取。对于一家公司来说，监控跨城市的互联网速度可能并不划算，但对于服务依赖这些速度的
    `Netflix` 来说，这是一个额外的福利。


    只要你的职位允许你在日常运营期间收集有价值的数据，这些未开发的机遇就会存在。对于其他人来说，收集这些数据的成本可能太高了。秘诀在于识别这些额外的福利并利用它们转化为你的优势。


    再以 `Strava` 为另一个例子。作为一个提供跑步、骑行和锻炼跟踪的在线健身平台，他们获取了大量的健身数据，这些数据可以提供关于人们锻炼方式的洞察。但他们收集的不只是健身数据。他们可能还在收集有关用户位置、偏好锻炼时间，甚至是他们在平台上与其他互动频率的有用信息。这些次要数据可能极其价值，而且它们是作为主要业务运营的一部分被自然收集的。


    所以，我们以数据为中心的冒险的第一步是意识到并利用我们已经收集的数据隐藏潜力。你现有数据中未被开发的价值可能会让你惊讶，而发现它可能会为你的业务开启增长和机会的新纪元。


    ## 利用数据实现超出初衷的目标


    `Starbucks` 为我们提供了这种方法的极佳例证。他们巧妙地将客户订单数据重新转化为用于预测的价值工具。


    秘诀往往不仅在于使用现有数据，而在于微妙地调整你的产品或服务，以收集你感兴趣的特定数据。在线流媒体行业就是一个绝佳的例子。流媒体平台坐拥一个数据宝库：经常被一起观看的节目模式、某些类型受欢迎的趋势，甚至是像病毒式挑战这样的在线趋势的迹象。


    但流媒体平台是如何如此大幅提升其数据价值的？答案简单得惊人：他们引入了用户配置（user profiles）。在过去每个人都共享同一个个人资料时，数据受限于混合的、集体观看习惯。随着用户配置的出现，平台能够将跨时间的观看行为关联起来，有效地跟踪单个观众的观看历程。这一微小的调整显著提升了他们数据的价值。


    这种通过微调来增加数据收集的策略也出现在产品设计和隐私决策中。产品的设计往往不仅是为了提供其主功能，还为了在这个过程中收集有价值的数据。秘诀是找到调整你的产品或服务的机会，以改进你所收集的数据。


    不，这展示了现有数据如何被重新用于其他领域以产生巨大的收入。


    数字世界充满了这类例子。`Spotify` 使用听歌数据进行广告投放，`Uber` 使用行车数据进行城市规划建议，`Duolingo` 使用语言学习数据来改进翻译的机器学习模型，而在线教育平台则可能使用课程完成数据来推广相关的未来课程。这里的共同主题是：一个最初为某个目的设计的系统，但对于该系统，收集到的额外数据可以用于其他事情。


    然而，谨慎走这条道路至关重要，始终意识到隐私法规和其他限制。挑战不仅在于收集数据，而在于如何创造性且负责任地使用数据来指导产品决策。这可能涉及出售数据，或使用这些数据来改进你自己的产品或服务——例如根据听歌习惯优化广告投放。


    现在的任务是仔细检查你的数据收集实践，并弄清楚如何从现有数据中获利。挖掘这些隐藏的宝藏可能会解锁你从未发现过的潜力，为增长和创新的新机会铺平道路。


    ## 整合数据获取更深层的洞察


    ### 通过桥接数据提升价值


    当我们超越单独查看每个数据集的想法时，数据的力量会产生巨大的增长。通常，当我们把来自不同地方的数据集一起时，真正的魔力出现了。这种方法可以创造出比其各个部分总和价值得多的东西。然而，这个过程带有其独特的挑战，特别是当涉及到整合不同结构、法律影响和财务后果的数据集时。


    让我们破解一个在合并数据集过程中经常出现的常见问题。假设你有两个数据集 `A` 和 `B`，它们来自两个不同的地方，你想将它们合并。你可能会遇到的问题之一是缺乏共同标识符。例如，基于
    `username` 和 `e-mail` 合并两个数据集可能不足以创建一个唯一标识符。尽管有这些可能的障碍，克服它们也可以解锁巨大的价值。


    以预测电影票房的成功挑战为例。这是一个高风险问题，因为一旦识别出具有大火潜力的电影，就可以制定有效的营销策略。这个问题的解决方案可以在各种地方的数据库中找到。像
    `IMDb` 和 `Rotten Tomatoes` 这样的电影评论网站拥有大量关于电影评分的信息。然而，热门电影的实际票房数字是由电影制厂自己掌握的。


    现在，想象一种情况，我们可以将这些数据集——电影厂的票房数据 `B` 和 `IMDb` 的评分数据 `A`——结合起来，以预测电影大热的可能性并计划智能营销活动。`IMDb`
    通过与几家电影制厂建立数据联盟，将其数据与工厂的票房记录合并，从而将这一想法变成了现实，并发现了洞察。


    ### 思考数据集的融合


    当我们考虑合并数据集时，会出现几个关键问题。首先，任务有多困难？该过程中是否涉及财务影响、法律障碍或实际困难？其次，价值主张是什么？一旦数据集放在一起，结果领域将会是怎样的，这有多大益处？

