    `artificial intelligence` 这个术语出现在 1956 年夏天。那时，有一项计划诞生，旨在邀请 10 位顶尖研究人员聚集在新罕什尔州汉诺威的达特茅斯学院进行夏季头脑风暴。首席组织者是
    `John McCarthy`，他设定了一个宏大的目标：在短短几个月内解决语言和抽象、问题解决以及自我改进等棘手课题。在巨大潜在收益的希望驱动下，教计算机像人类一样思考的目标是一项艰巨的任务。但这个小组充满了希望。贝尔电话实验室的
    `Claude Shannon` 是该研究集体的另一位关键人物。我们将在本书的后部分介绍他对生成式 AI 领域的巨大贡献。


    你可能会想，为什么他们会如此自信？为什么他们认为自己可以在 1956 年夏天实现如此惊不起的事情？答案在于当时的时代精神。20 世纪 50 年代中期，计算机开始在象棋中展现出真正的天赋——象棋在传统上被视为智力的测试。当时的逻辑非常简单：如果聪明的人擅长象棋，而计算机能够精通这项游戏，那么认为可以可以教计算机变得智能并不是什么巨大的跨越。


    但成为象棋冠军真的意味着你很智能吗？当时，计算机象棋的通常计划是预测未来 15 到 20 步，并选择能带来最佳棋面的走法。这一计划模仿了顶尖象棋选手的比赛方式，展示了发展智能的关键方法：观察人类行为，弄清楚这些行为背后的规则和决策过程，然后将这些规则程序化到机器。当计算机开始赢得象棋（一项被认为复杂的游戏）时，它燃起了人们的信念，即
    AI 可以处理许多人类认为挑战较小的任务。


    然而，随着 AI 故事的继续，我们发现现实往往会令我们惊讶，偏离我们的假设。我们将在接下来的章节中深入探讨这段迷人的旅程。现在，将 AI 视为一种灵活且强大的工具，不受人类生物学或行为的限制。这种更广阔的视角将为你提供坚实的基础，让你真正欣赏
    AI 的巨大潜力，为未来的深度探索做好准备。


    ## 扑克与标志


    让我们来看一个对比，以扑克游戏和日常营销任务为背景。乍看之下，许多日常营销任务可能比比扑克游戏不复杂。如果 AI 能够掌握扑克微妙的策略和无限的可能性，它难道不能以同样的效率管理其他可能可能更简单的任务吗？考虑识别公司标志（logo）这项任务。对我们来说，一眼标志通常就足够了。因此，合理的假设计算机程序在识别标志方面会异常精通，这项任务我们直觉上认为比扑克更具挑战性。


    带着这种最初的思维过程，在本世纪早些时候，曾尝试开发一种可以识别照片中的符号是否为标志的应用程序，但许多人预测这个应用需要开发团队花费半年时间才能设计。惊讶的是，这个预测非常准确；AI
    花了大约五的时间才可靠地识别标志。然而，至关的一点是，从最初提出这个想法起，这一成就花费了 50 多年。最初计划在 `McCarthy` 和朋友聚在一起的那个夏天进行的项目，最终跨越了五个世纪。那么，为什么这个看似简单的任务如此具有挑战性呢？


    扑克尽管复杂，但符合定义良好的规则。然而，现实世界的复杂性大得多。基于规则的方法依赖于显式定义每种可能性，在面对现实世界的细微差别时被证明是不够的。这导致了机器学习的兴起，算法从数据中学习，而不是被显式地编写规则。


