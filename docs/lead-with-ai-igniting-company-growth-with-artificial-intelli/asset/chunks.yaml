    crisis.” ELIZA was at its core a client-centered therapist and could engage in
    basic conversations by rephrasing the user’s statements as questions. Despite
    its simple design, users attributed a surprising level of intelligence to ELIZA—an
    aspect of AI that has increasingly become accepted as the standard over time.


