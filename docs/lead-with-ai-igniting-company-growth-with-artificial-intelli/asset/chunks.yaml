    要理解生成式人工智能和语言模型的开端，我们需要穿越回 20 世纪 40 年代。在那个时代，统计语言模型的理念与如今 AI 在某些领域的地位一样具有开创性。这一变革性概念背后的一个先驱大脑是才华的数学家克劳德·香农（Claude
    Shannon）。这位来自贝尔实验室的克劳德·香农，与其之前的章节讨论过的约翰·麦卡锡（John McCarthy）共同参与了具有里程碑意义的 1956 年达特会议。


    香农从一个基础但强大的概念开始了他的旅程，将英语想象成一个由 26 个字符和空格组成的随机生成的系统。这个想法就像一个商业想法的诞生——原始且有些混乱，但它标志着某种重大事件的开始。


    通过基于反馈的细致提炼和迭代调整，香农的模型开始展现出潜力。通过识别字符序列，他在创建看起来相当真实的文本方面取得了巨大进展。这类似于企业对其产品进行微调，以更好地满足市场需求。


    提炼模型、从字符转向单词的循环，就像企业扩大其运营规模。香农证明，通过根据上一个单词预测下一个单词，他可以组合出一系列英语单词。虽然这些句子缺乏逻辑连贯性，但它们看起来非常像英语。尽管受限于当时的计算能力，香农的远见为如今的语言模型铺平了道路。


    让我们深入探讨，了解像 AI 聊天机器人这样的语言模型是如何工作的。想象一张巨大的表格，宽度达 100,000 个单词，高度直达惊人的 `10²⁰`。每个单元格代表了潜在单词序列词海中的一个微小可能。这是一个令人难以置信的想法，对吧？


    然而，这种方法被证明是不可行的。想一下，追踪的不仅仅是三个，而是之前的 20 个单词。突然之间，潜在的组合超过了已知宇宙中原子的总数！这项严峻的挑战令人望而却畏。


    现在让我们深入探讨，以理解像 AI 聊天机器人这样的语言模型是如何工作的……（注：此处原文存在重复，已按要求不重复输出）。


    （此处原文重复：香农证明，通过根据上一个单词预测下一个单词，他可以组合出一系列英语单词……）


    （此处原文重复：……让`ChatGPT` 逐渐揭示自己。）


    （此处原文重复：……让我们回到香农的起点。）


    （此处原文重复：……`ELIZA` 是一个治疗师。）


    （此处原文重复：……`ELIZA` 是一个特定的智能体。）


    （此处原文重复：……`ELIZA` 是一个 AI 助手。）


    （注：由于您提供的原文中存在多处段落重复，根据“绝对不要重复输出原文”的指令，上述译文已仅保留了唯一的逻辑内容）。'
