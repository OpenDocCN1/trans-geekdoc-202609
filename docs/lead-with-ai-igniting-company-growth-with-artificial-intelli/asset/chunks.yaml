- fmt: "\nI’m not someone tucked away in a lab but more of a hands-on type of person.\
    \ I’ve got a deep respect for academia, and I regularly find myself sliding into\
    \ learner mode, because I’ve got a thirst for knowledge. But there’s something\
    \ about building and creating things that stirs up even more excitement in me.\
    \ I’m someone who lives and breathes technology; I’ve been curious about math,\
    \ science, and physics from the get-go. But it’s not just about the technology\
    \ for me; it’s about how we can use that technology in the real world.\n\nLooking\
    \ back at my career, it’s been quite an eclectic narrative. Not that I planned\
    \ it that way, but as Steve Jobs said in his famous Stanford University commencement\
    \ speech, “You can’t connect the dots looking forward; you can only connect them\
    \ looking backwards.” That seems to ring true for me. I can clearly connect all\
    \ the dots in my career now, but only now I’m looking in the rearview mirror.\
    \ \n\nThis variety of experiences has given me a unique view of different industries,\
    \ business environments, and regions around the world. I’ve worked in technical\
    \ and managerial positions in the semiconductor industry. I’ve found myself lying\
    \ on the floor of clean room fabs at `Intel` and `Samsung` while I was at `Applied\
    \ Materials`. I’ve deployed Fintech core systems and worked with demanding clients\
    \ in the high-pressure environment of banks like `HSBC`, `Citibank`, and `OCBC`,\
    \ when I was with companies like `D+H` and `Finastra`. I’ve taken leading roles\
    \ in the digital streaming revolution, developing and launching video streaming\
    \ products to millions of households during my time at `AT&T`. I’ve even worked\
    \ in the heart of Startup Nation at the most active venture capital firm in the\
    \ Middle East.\n\nBut there’s more to my story than the professional experience\
    \ since engineering school. In my 20s, I was an entrepreneur running my own pub-restaurant.\
    \ I’ve worked on a couple of cruise ships in the Mediterranean. I’ve been a bartender,\
    \ a gas station worker, a high-school physics teacher, a military soldier for\
    \ three years, and so much more.\n\nAll the examples, the business contexts, the\
    \ different views, and applications you’ll read about in this book come from this\
