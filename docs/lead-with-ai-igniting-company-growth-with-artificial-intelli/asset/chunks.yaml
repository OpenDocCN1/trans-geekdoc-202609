    **Poker and Logos**


    Let’s look at a comparison, using a poker game and routine marketing tasks as
    our backdrop. At first glance, many regular marketing tasks may seem less complex
    than a game of poker. If AI can grasp the nuanced strategies and countless possibilities
    of poker, couldn’t it manage other tasks, potentially simpler ones, with equal
    efficiency? Consider the task of recognizing a company’s logo. For us, a swift
    look at a logo is usually enough. Hence, it’s reasonable to assume that a computer
    program would be exceptionally proficient at recognizing logos, a task we instinctively
    find less challenging than poker.


    With that initial thought process in mind, earlier in our century, there was an
    attempt to develop an app that can identify if a symbol in a photo is a logo,
    but many predicted that this app would take a team of developers half a decade
    to devise. Surprisingly, this prediction was spot on; it took roughly five years
    for AI to reliably recognize logos. However, it’s critical to underscore that
    this accomplishment took over 50 years from when the idea was initially proposed.
    A project initially planned for the summer of which McCarthy and friends came
    together ended up spanning more than five decades. So, why was this seemingly
    simple task so challenging?


    Poker, despite its intricacy, conforms to well-defined rules. We can dissect the
    game, comprehend its rules, and translate these rules into algorithmic solutions.
    The initial approach to the logo recognition task adopted this logic. The theory
    was that logo recognition could be split into smaller problems, each solvable
    independently. And all that was left to be done was to identify the circle, the
    triangles, the lines, and voila— you’ve got a logo identifier!


    Regrettably, reality didn’t align with this hypothesis. The world doesn’t operate
    on neatly arranged rules, and AI demanded a novel approach. As humans, we do use
    rules to perform tasks. For example, when identifying a logo, we might subconsciously
    recognize its parts and combine them to form a complete image. Early AI strategies
    hypothesized that if we could explicitly outline these rules, we could instruct
    machines to do the same. This rule-based approach had done wonders with poker,
    so why not apply it elsewhere? Why couldn’t we simply document the rules we subconsciously
    follow?


    The problem is that life is filled with subtleties and variations. The same logo
    can appear vastly different from various angles or distances. The process of building
    AI and machine learning models has left us astounded by the exceptional capabilities
    of the human brain. Tasks we execute effortlessly turn out to be monumental challenges
    when you try to replicate them in AI.


    Take the task of handwriting recognition, a seemingly straightforward job, which
    is vital for tasks like sorting documents in a business setting. Given an image
    of handwriting, how would you formulate rules to correctly identify it? You might
    rely on various strategies, like identifying distinctive handwriting patterns
    or measuring the angles of certain strokes. Yet, when tested, these rule-based
    strategies performed inadequately on publicly available datasets. Once more, the
    task of formulating rules proved to be a daunting mountain to climb.


    These repeated failures led to periods known as *AI winters* in the 1970s and
    1980s. Interest dwindled, funding dried up, and progress seemed to stall. Rule-based
    AI appeared to be an unsolved riddle. But over 50 years later, we’ve made leaps
    in areas like vision and transaction analysis. So, how did we orchestrate this
    turnaround?


    The answer lies in the techniques we developed in response to the shortcomings
    of rule-based systems. We had to reassess our understanding of intelligence. While
    tasks like playing poker seemed formidable for humans and logo recognition a breeze,
    the situation was reversed for machines. This role reversal pushes us to rethink
    our concept of intelligence and our definition of what it means to be *smart*.


    Historically, machines functioned in ways that were based on rules. We provided
    clear instructions, and the machine adhered to them meticulously. But in the face
    of these sophisticated problems, rules seemed insufficient. A different approach
    began to emerge, driven by the widespread availability of data. When we realized
    that we couldn’t effectively document the rules, we turned to data. As we continued
    to generate massive volumes of information, perhaps the key to AI mastery in elusive
    tasks lay in feeding this vast ocean of data to machines.


    **A Fresh Take on Intelligence**


    As we continue to advance in AI, we’ve bumped into a considerable challenge. There
    are numerous complex AI problems where we understand the issue at hand, but converting
    that understanding into instructions a machine can read is another ball game.
    This leaves us with two potential options. We can go down the *rule-based* path,
    aiming to encode our knowledge into the machine, or we can take the *statistical*
    path, relying on data to provide insights when the rules aren’t so clear-cut.


    Imagine two pictures to illustrate these strategies. The first picture represents
    early attempts at AI, where individuals, who knew the rules, strived to translate
    these into a format that machines could comprehend. The second picture portrays
    the statistical perspective, by which humans learn from the patterns in the data.'
