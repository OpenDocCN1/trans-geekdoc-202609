- fmt: '

    In essence, this scenario showcases a tradeoff inherent not just to machine learning
    but also to many decision-making processes. If you elevate your thresholds or
    standards, false positives tend to decrease while false negatives increase. Conversely,
    lowering your standards generally increases false positives and reduces false
    negatives. This principle is prevalent in the decision theory, but it’s particularly
    prominent in machine learning.


    ## Adapting Decision Contexts in Machine Learning


    Up to now, we have mostly been looking through the lens of the decision makers,
    like an e-commerce company considering the cost of errors. But it’s essential
    to remember that the folks on the other side—let’s say, customers—also have costs
    to deal with. For example, if an e-commerce site makes a mistake and sends the
    wrong product, it’s the customer who has to deal with the hassle of returning
    it. And sadly, these types of costs, which impact the customers, are often forgotten
    by the decision makers.


    We tend to zoom in on the costs that the decision maker has to deal with, and
    that sets a certain boundary for making decisions. But if we considered the costs
    that both the customer and the e-commerce site have to bear, we might end up choosing
    a different boundary. Let’s not forget, incentives really do guide these decisions.


    We see something similar in the entertainment industry. Both the platform (like
    a streaming service) and the viewer bear costs. When deciding how to set boundaries
    and what costs to pass on to people, we’ve got to think about whose interests
    and costs we’re putting first.


    When it comes to checking out machine learning models, you’ll often run into the
    rates of false positives and false negatives, and that involves assessing the
    costs of mistakes. But these costs aren’t fixed. They can change based on the
    rules we set. Let’s say we have a model that’s designed to predict if a movie
    will be a hit or a flop based on the trailer. The real costs of making a mistake
    won’t be clear until we’ve figured out what actions we’ll take based on that prediction.


    Think about this: a model predicts a movie will be a hit, and based on that prediction,
    the studio decides to invest in a big marketing campaign. The cost of getting
    it wrong here is high: a false positive means money is wasted on marketing a flop,
    while a false negative means a missed opportunity to market a potential hit. Here,
    we might want to have a balanced threshold. But, if instead of launching a massive
    campaign, we only decided to adjust the release date based on the prediction,
    the costs of getting it wrong wouldn’t be as heavy. It’s the same model and data,
    but a different action changes how we see the costs of mistakes.


    So, instead of just deciding on thresholds, we should think about how we can shape
    the environment around the model to get better tradeoffs between different types
    of errors. By using a different action, like adjusting the release date, we could
    change our chosen thresholds. You get to decide what actions to take based on
    a model and how to build the environment around it.


    Usually, in machine learning and decision theory, we assume that the costs for
    false positives and false negatives are fixed, and then we just crunch the numbers
    to get your threshold. But really, we should be thinking about how we can tweak
    the decision environment to lower the costs of making mistakes.


    If the decision-making process forces you to choose between bad and worse errors,
    it might be a good idea to take a step back and rethink the whole situation. Like
    a movie studio planning a huge marketing campaign based on a model’s predictions
    might instead consider less expensive actions, or even involve human experts in
    the decision-making process.


    ## Shifting Focus From Predictions to Decisions


    So, we’ve spent a fair bit of time discussing how we can gauge the quality of
    our model’s predictions. Now, it’s time to turn the tables. Instead of zooming
    in on the accuracy of predictions, let’s think about the decisions these predictions
    enable us to make. After all, it’s not just about forecasting rain, but about
    whether we should carry an umbrella, isn’t it?


    In this next part of our journey, we’re going to find out how to pinpoint and
    measure the outcomes that truly matter to us. Then it’s all about putting these
    predictions to work and figuring out how they affect the decisions we make.


    And while we’ve been discussing models at length, we certainly can’t overlook
    the building blocks of these models—our data. Just like a great recipe needs top-notch
    ingredients, a solid model needs quality data. So, we’re going to delve into how
    to scrutinize our data to ensure it’s up to par before we even start developing
    our models.


    The big takeaway here is we’re not just interested in the predictions our model
    is making but also whether it helps in making sound decisions. It’s not simply
    about whether our model can pass a hypothetical test, but if it’s ready to graduate
    into the real world.


    The binary or yes–no situations are straightforward to evaluate, right? But real-world
    problems are seldom black and white. So, let’s start by brushing up on how we
    handle these simpler binary cases before we tackle more complex scenarios. Let’s
    shift gears


    ## Binary Predictions to Real-World Decisions


    Consider a real-life AI-powered solution known as `FluSense`. This system is designed
    to predict the spread of flu-like illnesses based on data inputs, such as the
    sound of coughs in public spaces. Similar to our previous example, we have two
    versions of this system to consider. In the first version, `FluSense` directly
    alerts the health authorities every time it detects the possibility of a flu outbreak.
    In the second version, it sends the detection data to a human analyst first, who
    then confirms whether it is indeed indicative of a flu outbreak before alerting
    the authorities.


    Now, let’s start evaluating the first version, where `FluSense` autonomously alerts
    health authorities when it detects a potential flu outbreak.


    In a situation where there’s no flu outbreak and `FluSense` correctly identifies
    that, everything runs smoothly. No unnecessary alerts are raised, saving both
    time and resources.


    However, if a flu outbreak is occurring and `FluSense` fails to detect it, this
    is a case of false negatives. In such an instance, a health crisis could escalate
    without any alerts being raised, leading to potentially harmful consequences.


    What about false positives, where `FluSense` predicts a flu outbreak when there’s
    none? In this case, health authorities could end up deploying resources unnecessarily,
    creating strain and leading to wasted efforts. If false positives persist, over
    time, it could result in a loss of trust in the system’s reliability.


    Finally, in the best-case scenario where a flu outbreak is in progress and `FluSense`
    correctly detects it, the health authorities get alerted sooner than they might
    have otherwise, potentially allowing them to respond more rapidly and effectively.


    This exercise of identifying the potential impacts of our system lets us understand
    the possible outcomes of deploying FluSense. The system could potentially raise
    early alerts about flu outbreaks, accelerating response times. However, it could
    also result in false alerts leading to a waste of resources and potential erosion
    of trust in the system. In addition, the system may fail to alert us about some
    actual outbreaks, another negative outcome. These outcomes are essential to consider
    before deciding on system deployment.


    ### Model Performance Outcomes


    Let’s convert those statistical metrics into tangible, real-life changes. After
    all, if you’re a city health official looking to adopt this system, you’re not
    necessarily interested in abstract error rates. Rather, you care about what will
    tangibly change once the system is deployed.

