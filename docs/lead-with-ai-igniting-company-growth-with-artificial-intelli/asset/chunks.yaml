- fmt: '

    One big issue that has been causing many large companies a lot of concern is the
    detection of scams in the world of online shopping. As online purchasing becomes
    increasingly commonplace everything from everyday essentials to major household
    items, the challenge of distinguishing fraudulent transactions from legitimate
    ones has grown significantly.


    At first glance, you might think, “Let’s use AI to solve this.” The approach seems
    quite straightforward—gather a vast amount of transaction data, identify the questionable
    transactions, train a machine learning model with this labeled data, and voila,
    you have an automated system capable of flagging potential scams. Many financial
    institutions and digital payment platforms are indeed moving in this direction,
    with hopes of developing a machine learning-based solution to mitigate the risk
    of online scams.


    But it quickly becomes apparent that there are numerous obstacles on this path.
    One significant hurdle is deciding how to label the transactions. Who determines
    which transactions are potentially fraudulent? On what basis are they making this
    judgment? Are they conducting an exhaustive investigation of each transaction,
    or are they making quick decisions based on superficial patterns?


    Now, consider this: if the individuals tasked with identifying scams cannot agree
    on what constitutes a scam, then the machine learning model trained on this inconsistent
    data will be equally uncertain. Unlike predicting whether it will rain tomorrow,
    where everyone can agree on what constitutes rain, labels for potentially fraudulent
    transactions are highly subjective, making it extremely challenging to build a
    universally accepted model.


    To add to the complexity, scams are constantly evolving. Fraudsters continually
    adapt their tactics, becoming ever more sophisticated and difficult to detect.
    This dynamic nature of online scams complicates the detection process even further.


    Although detecting online scams may initially seem like a simple matter of data
    collection and processing, the underlying issues are far more intricate. They
    involve the delicate task of identifying which transactions are potentially fraudulent,
    as keeping keeping up as the rapidly changing nature of scammer tactics. In summary,
    detecting online scams is about more than just crunching numbers; it’s a complex
    puzzle that requires astute and adaptable solutions.


    ### The Limitations of Past Data


    Imagine an online scam claiming that a popular e-commerce site is offering a 95
    percent discount for the next hour only. This could be a real, limited-time promotional
    event, or it could be a fraudulent attempt to ambush unsuspecting shoppers. An
    AI system trained on past data has no way of distinguishing between these two
    scenarios—it doesn’t have real-time insight into the e-commerce site’s current
    promotional activities. Similarly, if a scammer creates a false narrative about
    new shipping regulations causing major delays, the AI system cannot verify this
    claim using only past data.


    This reliance on past data is a fundamental limitation of AI. Pattern-matching
    based on historical data doesn’t provide valuable insight into current or future
    events. And this isn’t a limitation that can be addressed simply by obtaining
    more or better data. It’s a fundamental aspect of how AI works, and it’s important
    to recognize this when setting expectations for AI-based solutions.


    Here’s the key point: transforming real-world events into datasets can limit what
    we can achieve with AI. You might think, “I want an AI system that can accurately
    detect online scams,” and that seems reasonable. After all, a team of human experts
    could examine individual transactions and identify potential scams, so why couldn’t
    an AI system do the same?


    The challenge lies in the nature of the data required for training AI systems.
    While human experts have access to a vast array of contextual information, AI
    systems can only learn from the specific data they’re given. Therefore, the task
    that seems straightforward for humans may be extremely difficult, or even impossible,
    for AI.


    Therefore, even tasks that appear feasible and straightforward may need to be
    adjusted or redefined when we’re planning to use AI to tackle them. This isn’t
    a shortcoming of the technology, but a reflection of the fundamental nature of
    machine learning—its reliance on historical data to make predictions about the
    present or future.


    ### Unmasking Scams to Exposing Bots


    Let’s take another look at this from a different angle. Rather than trying to
    single out every scam in the digital universe, many platforms have decided to
    take a step back and focus on a broader target: the bots behind the scams. It
    turns out that this is a slightly less complicated mission because there’s more
    consensus on what qualifies an account as a bot.


    Think about it like this: imagine an online platform has a special screening test
    when creating an account. Let’s say it requires solving a small puzzle or answering
    a question that demands human-like thinking and response, something beyond a bot’s
    capabilities. This method can potentially be used to label accounts as `bot` or
    `not a bot` based on their performance in this test.


    What we’re doing here is a bit of a pivot. Instead of being knee-deep in the question
    of whether this an online scam or not, we’re shifting toward another, more straightforward
    question: “Is this account operated by a bot?” It’s usually less tricky to collect
    reliable data on bot activity, compared to identifying scams.


    However, remember, we’re tackling a slightly different issue here. If our goal
    was detecting scams, our instinctive response would be to take down the content
    as soon as it’s flagged as a scam. But, with bot detection, the response could
    be different. Perhaps we restrict the activities of the bot account, maybe we
    limit its reach instead of taking it down completely. There’s a range of responses
    possible because, at the end of the day, we’re solving a different problem.


    So here’s the golden rule: you’ve got a problem you want to solve (scam detection),
    and then there’s this adjacent, less complicated problem (bot detection). The
    game is all about identifying this adjacent problem, solving it effectively, and
    using it as a proxy to achieve what you wanted to achieve with the original problem.


    ### In Summary


    AI can’t untangle the messy debates we humans have. And believe it or not, sometimes
    it makes things even worse. It can blanket our disputes under the supposed `fairness`
    of a machine learning system. You might not agree with the person setting up the
    labels, but once the task is passed through the AI, who’s left to argue with?
    You might just assume that machine learning is neutral and correct, when in reality,
    it’s just echoing the labels you initially disagreed with.


    Another problem you might run into is the difficulty of precisely defining what
    you’re trying to predict. We may have a basic understanding of the output we desire,
    but turning that into a quantifiable column that fits into a dataset ... that’s
    a real challenge. This issue isn’t just limited to detecting scams or identifying
    bots; it also extends to somewhat nebulous notions like creditworthiness or qualifications.
    Sure, it’d be fantastic if we could get AI to predict who’s a qualified applicant.
    But that’s not exactly the same as the actual variable that’s going to pop up
    in your dataset. The idea of being `qualified` exists out there in the real world.
    The label `Y` in your dataset is just a piece of data. They’re not the same thing.

