  trans: '

    这里的关键点在于理解数据源在机器学习中所扮演的至关作用。数据主要来自平台本身，运营人员对每个项目进行标记。然而，这个系统可能会导致潜在的问题，特别是当原始的人工标记数据存在偏差或缺陷时。这可能导致机器学习模型产生倾斜的输出，并加剧现有的偏差。


    我们陷入了一个收集数据、将其输入训练算法以创建模型、然后使用该模型来预测或分类新数据的循环中。这个过程就像一场精细的舞蹈，每一步都会影响下一步。取决于我们如何使用和解释输出结果，这些步骤的影响可能从巨大的益处到潜在的危害。


    例如，想象一下经理对某些群体存在偏见的情况。如果这些偏差渗透到标签中，那么基于这些数据训练的机器学习模型在管理新内容时就会反映出这些偏差。这些步骤之间相互关联的性质也带来了积极影响的机会。如果管理团队经过良好培训并精心设计以避免不一致性，那么机器学习模型就可以帮助创建一个更安全、更平衡的空间。通过从准确的标签中学习，AI
    系统可以高效地处理大量内容，并帮助维护平台标准。


    这凸显了来源、输入数据质量、训练算法设计以及模型输出使用的性。机器学习旅程中的每一步都带有潜在的风险——但也提供了做出重大贡献的可能。这是一场困难的舞蹈，但必须掌握。


    ## 决策树及其实际应用


    到目前为止，你可能认为我们正在玩某种魔术。我们输入一些数据，获得输出，我们的训练算法以某种方式找到它们之间的模式。但当我们深入学习机器学习时，我们将开始揭示引擎盖下的魔力。回归只是故事的一部分。如果你现在不完全理解这些模型的方方面面，那没关系，但对它们的工作原理有一个基础的了解将会有许多益处。这可以满足你的好奇心，帮助你对使用什么数据做出更好的决策，甚至为进行更高水平的对话做好准备。


    考虑到这些益处，让我们来看看决策树，这是机器学习中常用的工具之一。让我们回到预测用户会喜欢哪种播放歌列表的例子。首先，我们需要收集一些数据。假设我们拥有关于用户的信息，包括他们喜欢的流派和播放次数最多的歌曲。我们可以使用回归来创建一个连接这些因素的线性方程，但有时回归并不是最佳选择，特别是当我们认为变量之间可能存在非线性连接时。


    假设回归感觉不太对劲，并且我们渴望尝试一些稍微复杂一点，让我介绍一下决策树。正如机器学习书籍所示，决策树看起来像一个流程图，通过提出一系列问题来引导预测。让我们尝试用我们的
    Spotify 数据创建一个。


    起初，我们可以创建一个简单的树，根据喜欢的流派对用户进行分类，预测他们喜欢的播放列表类型。这棵树可以根据音乐流派预测用户的播放列表偏好。或者我们可以根据他们播放次数最多的歌曲对用户进行分类，给我们另一棵树。每个分支预测的播放列表简单就是用户最喜欢的播放列表。但我们可以更进一步。我们可以通过首先找到喜欢的流派，然后在每个类别中找到他们播放次数最多的歌曲，建立一个更复杂的树。这棵双层树可以根据这些因素做出预测。记住，所有这些预测都是根据从数据中获得的平均值得出的。尽管我们只处理用户，但我们可以创建独特的模型为新用户做出预测。


    那么，训练算法的作用是什么？基本上，算法查看所有可能的决策树，并根据某些基准选择最好的。但在预测 Spotify 播放列表的语境下，“最好”意味着什么？显然，我们想要准确性，即你的预测与用户实际喜欢的播放列表之间的接近程度。


    考虑三种可能的树：

    - `Tree 1` 的平均错误率为 10%。

    - `Tree 2` 的错误率为 30%。

    - `Tree 3` 的错误率为 5%。


    你可能认为我们应该选择 `Tree 3`，因为它误差最少。然而，在机器学习世界中，我们对训练模型的数据和测试模型的数据之间有明确的区分。至关重要的是，如果我们在模型训练的相同数据上评估模型，它看起来可能非常准确。但并不意味着它在不同的数据上也会同样出色。如果我们把数据拟合到一个复杂模型中，这种情况是真实的，这种场景被称为“过拟合”。过拟合会导致预测结果像“巧克力茶壶”一样不可靠。


    这让我们想到了模型复杂程度与数据量之间寻求平衡的想法。更复杂的模型需要更多的数据，因为复杂性倾向于使数据稀疏，使其可靠性降低。这就是为什么无论从直觉和技术角度考虑，我们都倾向于保持简单。如果我们的模型变得太复杂，我们面临着学习数据中随机噪声的风险，而不是我们不可预测且充满噪音的世界中有意义的模式。回到我们的树，`Tree
    3` 可能具有最小的错误率，但它的数据比 `Tree 1` 更稀疏，而后者只多错了一点。最佳选择并不是一成不变的——它更像是一个判断。这就是训练算法大显身手的地方：它梳理所有可能的规则，并选择在准确性和简单之间取得最佳平衡的规则。这既是一门艺术，也是一门科学，这它变得如此有趣。如果
    Spotify 的目标仅仅是预测你的最热门单曲，它将不断地循环那首歌，可能会让你心烦。从设计上讲，它需要程度的不可预测性来识别模式，甚至偶尔引入一些它对你的偏好没有任何先验数据的曲目。


    所以，你看吧，决策树并没有初初看起来那么神秘。掌握它们的基础知识和构建方式，可以使你能够在工作中使用它们来做出预测并指导决策。记住，机器学习的魅力不仅在于复杂的模型和算法，还在于你从数据中提取的洞察。


    ## 决策树之外的旅程


    到为止，我们的机器学习引擎盖下之旅专注于决策树。但正如你可能猜到的那样，它们并不是我们工具箱中的唯一工具。我们的旅程还路过了回归分析和神经网络等其他流行方法，每种方法都按照自己的训练算法跳动，并提供不同程度的复杂性。


    '
- fmt: '

    Think about regression analysis as being like a skilled woodworker carefully shaping
    a piece of wood, slowly revealing the best straight line. Or picture a neural
    network as a bustling city of interconnected nodes, each connection needing its
    own numerical code. This step-by-step, refining process is what we call `gradient
    descent`.


    Despite their unique styles, all training algorithms have the same goal: to find
    the best model from the chosen category. So, when you’re looking for a particular
    type of model, your training algorithm is like a treasure hunter, searching the
    landscape to find the best model of that type.


    From experience, I can tell you what sitting in a beginners’ machine learning
    class looks like. A lot of the class will be about defining a set of rules or
    a model class—like `decision trees`—and then using a unique training algorithm
    to find the perfect model. This dance between accuracy, simplicity, and complexity,
    all under the watchful eye of the available data, is what makes machine learning
    so cool.


    But remember, these principles aren’t going solo. They’re part of a complex dance,
    constantly trying to balance accuracy and simplicity. The aim is to build a model
    strong enough to read data correctly, but not so complicated that it starts to
    see patterns that don’t exist. Every model, whether it’s based on `regression`,
    a `decision tree`, or a `neural network`, has its strengths, weaknesses, and quirks.
    Which model you choose depends on the problem you’re trying to solve and the data
    you have.


    The beauty of machine learning is this complex interaction of data, models, and
    algorithms. As we go deeper into the world of machine learning, remember that
    while it might seem overwhelming at times, it’s this very complexity that makes
    it so fascinating and fun to explore.


    From our journey so far, it’s clear that machine learning isn’t magic. It’s a
    tool, built on solid mathematical principles, which can solve specific problems
    by finding patterns in data. It’s a process where algorithms learn from data to
    make predictions or decisions, without needing a step-by-step guide. The exciting
    part is that, while we create the algorithms, it’s the same algorithms that create
    the models, which then produce the predictions. It’s quite a cycle, right?


    With that thought, I will wrap up this chapter—not ending, just taking a break,
    and catching our breath in this ongoing marathon. In the following chapters, we’ll
    dig deeper, learn more, and keep exploring many other facets of machine learning.


    ## Key Takeaways


    - **Machine Learning Basics**: Imagine machine learning as a super handy tool
    kit, helping us to see patterns in a bunch of data. This tool kit is backed up
    by some serious math techniques. It’s like training computer programs to learn
    from data and make guesses or decisions without having to manually code every
    little step.

    - **Getting to Know Inputs and Outputs**: In machine learning lingo, `X` and `Y`
    are our shorthand for inputs and outputs. The input data, or `X`, can be all sorts
    of things like words, pictures, videos … you name it. The output `Y` usually refers
    to the labels or values we’re aiming to predict.

    - **The Big Job of Training Algorithms**: The main job of a training algorithm
    is to build a model. This model’s task is to figure out the relationship between
    input `X` and output `Y`. Once it’s got that down, this model can be used to make
    predictions on new, unseen data.

    - **Good Data for the Win**: What is the real secret to a top-notch machine learning
    system? High-quality, relevant data. The data used for training is like the road
    map for the predictions made by the machine learning model. So, any glitches or
    biases in the original data can lead to off-base or skewed predictions.

    - **Playing With Decision Trees**: `decision trees` are a pretty straightforward
    pick in the machine learning model toolshed for making predictions. They’re a
    lot like a flowchart, guiding you down different paths through a bunch of questions
    until you reach an answer.

    - **Steering Clear of Overfitting**: In machine learning, it’s crucial to steer
    clear of overfitting. This happens when a model is so good at memorizing the training
    data, it doesn’t do so well with new data. The trick is finding that sweet spot
    between how complex the model is and how much data there is.

    - **Training Algorithms Across the Board**: The concept of setting up a model
    class and then using a training algorithm to find the best fit isn’t just true
    for one machine learning model. It applies to different models, including `regression
    analysis` and `neural networks`.


    ## [Programming Through Data](#contents.xhtml#chapter-04)


    *The competitive weapon of every organization in this era is data.*


    ## Working With Data


    This chapter’s big question is: how do we choose the right kind of data to make
    the best model? Is our data a treasure chest full of gold, or is it more like
    a Pandora’s box? How can we make sure our data is top-notch in order to build
    flawless models? It’s kind of like programming, but instead of code, we’re dealing
    with data.


    Our training algorithm is like a supersmart GPS, using the data we give it to
    make the best route. Remember those trees we made from our original data? Each
    one could give a different price for a new house.


    The training algorithm’s job was to check out all the possible trees, see how
    they did, and pick the best ones. The amount of data we have is crucial for this.
    If we don’t have enough data, we might lose confidence in our models—this is something
    we call `overfitting`. For example, one of our trees looked really promising,
    but it didn’t have enough data, so its predictions were a bit shaky.


    So, what can we do? One simple step could be to get more data. With this new data,
    we can make better trees and feel more confident in our predictions. Having more
    data might also change the way we think about errors. Previously, we liked the
    first tree because it was simple, and it had balanced data. But with all the new
    data, we might start to like the third tree more, even though it’s more complicated.


    This isn’t just about our trees. It’s a general rule for machine learning; if
    you have more data, you can make more complex rules. If you don’t have much data,
    you might have to stick to simple models, like `linear regression`, which only
    draws straight lines. But if you have lots of data, your models can get more complex
    and handle more complicated rules.


    This connection between how much data you have and how complex your models can
    be stays the same, no matter what kind of model you’re working with. So, we need
    to ask ourselves; does our data really reflect the thing we’re making predictions
    for?


    Both the amount and quality of your data are highly important when figuring out
    how relevant it is to what you’re trying to do. They both have a big effect on
    how strong your data is and, in turn, how reliable your model’s predictions are.


    ## The Significance of Data Diversity


    Let’s take a look at the importance of the way our data represents what we want
    to study. This is crucial because it changes how much we can rely on our model’s
    predictions. Before we even start putting our model together, we need to check
    if the data we’ve got can give us predictions we can trust. This really shows
    how important it is to have good, representative data.


    Aiming for perfect representation in a dataset might seem like a pipe-dream. What
    really matters, and needs some serious thought, is how big the gap is between
    the data we have and the data we wish we had. Figuring out these differences is
    essential, and, usually, it’s something we learn from real-world observations
    and a bit of trial and error. To make sure it’s worth the time and effort spent
    on building a model from a certain dataset, we need to have a rough idea of what
    the data might tell us, even if it’s not 100 percent perfect.

