    In a multitude of instances, `AI` doesn’t function independently. Despite common
    perceptions, many applications involve direct human participation. Only in a handful
    of areas, such as content moderation and curation on digital platforms, does `AI`
    primarily operate to decide what content users view on its own. However, in most
    other circumstances, humans play an active role. Consequently, we need to contemplate
    the role humans ought to assume and how to shape the collaboration between human
    decision makers and the `AI` intended to assist them.


    Much like most aspects of `AI` deployment, this collaboration exists within a
    balance; there isn’t a one-size-fits-all best approach to coordinating human participation.
    The ideal model will shift based on the context, but this doesn’t suggest that
    a unique interactive `AI` design is mandated each time a new `AI` system is developed.
    In fact, there are several prevalent design models that encapsulate most interactive
    `AI` systems.


    In the upcoming discussion, we’ll delve into what these designs entail, how they
    function, and when each one might be the most appropriate fit. Grasping these
    shared components and how to maximize their potential assistance in ensuring that
    humans and `AI` can effectively cooperate, amplifying each other’s strengths while
    mitigating possible weaknesses. It’s all about achieving a balance that enhances
    the strengths of both human and `AI` in decision-making procedures.


    ### Real-World Considerations


    The model of guided decision making can be favorably applied to a wide array of
    situations. For example, consider the health care sector, specifically the role
    of physicians in diagnosing diseases. Many health care institutions are working
    on models that can predict the likelihood of a patient developing a certain disease
    based on their health data. However, such a prediction does not decide the final
    course of treatment—it is just one of many factors a physician takes into account
    when making a decision.


    This approach is common across a range of sectors. In the financial industry,
    risk assessment models are used to predict the likelihood of a loan applicant
    defaulting. In car insurance, `AI` is increasingly being used to predict potential
    high-risk drivers. Even in the realm of sports coaching, `AI` tools predicting
    an athlete’s future performance can provide coaches with additional information
    to make more informed decisions.


    However, when implementing these interactive `AI` systems, several important factors
    must be considered. Firstly, the predictions made by the model need to be based
    on tangible, predictable outcomes. This is essential, to provide valuable and
    actionable guidance to the human operator.


    Take, for instance, the financial sector scenario. A loan officer is given two
    types of predictive information: a credit score indicating the likelihood of the
    applicant defaulting on the loan and a financial stability score predicting the
    applicant’s ability to maintain steady income. While these scores provide the
    loan officer with useful information, they do not dictate a specific course of
    action.


    The main goal of these predictions is to support the human decision maker in making
    more informed decisions, not to restrict their discretion or replace their judgment.
    The human operator retains their autonomy and discretion, treating the machine
    learning model as a tool for decision support rather than a determiner of outcomes.
    It’s this seamless integration of `AI` intelligence and human judgment that makes
    interactive `AI` systems effective in a wide range of situations.


    ### Guidance and Choice in Interactive Systems


    When rolling out interactive `AI` systems, there are several critical factors
    to keep in mind. As we’ve discussed, the importance of concrete, predictable outcomes
    like loan default or financial instability is key. But it’s just as crucial to
    ensure these predictions are as fair as possible.


    In these scenarios, you might often run into restricted labels because the model
    is just helping a human. In these scenarios, you might often run into restricted
    labels because the model is just helping a human. But it’s just as crucial to
    ensure these predictions are as fair as possible.


