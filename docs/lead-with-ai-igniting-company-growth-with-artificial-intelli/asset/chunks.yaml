    for growth and innovation.


    ***Combining Data for Deeper Insights***


    Boosting Value by Bridging Data


    The power of data grows massively when we move past the idea of looking at each
    dataset on its own. Usually, the real magic pops up when we bring together datasets
    from different places. This approach can create something that’s worth way more
    than the sum of its separate parts. However, this process comes with its own unique
    challenges, especially when it’s about bringing together datasets with different
    structures, legal implications, and financial consequences.


    Let’s crack open a common problem that often pops up in the process of merging
    datasets. Let’s say you have two datasets, A and B, which come from two different
    places, and you want to combine them. One problem you might bump into is the lack
    of common identifiers. For example, merging two datasets based on *username* and
    *e-mail* might not be enough to create a unique identifier. Despite these possible
    roadblocks, getting past them can unlock a ton of value.


    Take, for example, the challenge of predicting movie box office success. This
    is a high-stakes problem, as effective marketing strategies can be planned once
    movies with the potential for big success are identified. The solution to this
    problem can be found in the data repositories of various places. Movie review
    aggregators like IMDb and Rotten Tomatoes have heaps of information about movies’
    ratings. However, the actual box office numbers that track the movies which are
    big hits are kept by the movie studios themselves.


    Now, imagine a situation where we could bring together these data-sets—the movie
    studio’s box office data (B) and IMDb’s rating data (A)— to predict a movie’s
    likelihood of being a big hit and then plan smart marketing campaigns. IMDb turned
    this idea into reality by forming data alliances with several movie studios, merging
    their data with the studios’ box office records, and in doing so, uncovering valuable
    insights.


    Pondering the Blend of Datasets


    When contemplating merging datasets, a few key questions pop up. First, how tough
    is the task? Are there financial implications, legal hurdles, or practical difficulties
    related to the process? Second, what’s the value proposition? What will the resulting
    terrain be once the datasets are put together, and how beneficial would that be?'
