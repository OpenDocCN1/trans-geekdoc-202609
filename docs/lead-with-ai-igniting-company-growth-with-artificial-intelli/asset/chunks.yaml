  raw: 'To figure this out, let’s look back at an idea we talked about earlier. It’s
    an idea that relies on a comparison between two different places; the real world
    that we live in, and the world of AI. In this idea, the designer’s main job is
    in the real world. They closely watch what’s happening, find problems that need
    fixing, and come up with AI solutions to these problems.


    Think of the designer like a football coach. The coach comes up with the game
    plan, kicks it off, and closely watches how it plays out. On the other side, you’ve
    got the machine learning engineers or data scientists. They’re like the players
    on the field, running the plays to make these smart systems work.


    In this setup, the designer’s role could be compared to a coach’s, while the machine
    learning engineer’s job is more like a player’s. The coach plans out the big picture,
    thinking about each detail, taking practical things into account, and picturing
    the end game. The player, meanwhile, gets in the game and makes the coach’s plan
    a reality, move-by-move, always sticking to the playbook.


    But let’s make this clear: the coach isn’t the one scoring the goals. They’re
    the ones coming up with, planning, and designing the system that the players will
    put into action. They’re in charge of shaping the game environment, creating a
    space that’s perfectly suited to its purpose.


    Now, you might be wondering, how do coaches do this in real life? What basic rules
    guide their game plan? And the big question: can we use these same rules when
    we’re designing environments for machine learning?


    To get a better understanding of how to create the best setting for AI, we need
    to look more closely at how designers, or our coaches, work. How do they start
    their game plan? What are the main things they think about? If we dig into these
    questions, we might find some handy tips that can guide us in our goal of designing
    environments where AI and machine learning can really show us what they’ve got.


    **Restricted Outcomes**


    ***Unraveling the Restricted Outcomes Quandary***


    The first terminology we’re going to explore is what we call *restricted outcomes*.
    Our goal is to identify common solutions that have been used to address the restricted
    outcomes issue. But first, we need to grasp what this truly means.


    A restricted outcomes problem pops up when you’re trying to predict an outcome
    Y based on a dataset X. Here’s the tricky bit: your predictions influence your
    decisions, which then impact whether you see the outcome you were initially trying
    to predict. To make this a bit clearer, let’s switch up our real-world example
    to something different—say, university admissions.


    Picture this: You’re a university admissions officer. Your job is to decide who
    gets in and who doesn’t. You’ve got a nifty AI system that helps you predict if
    a student will drop out or not, based on a bunch of data like high school grades,
    extracurricular activities, personal essays, and so forth. This prediction is
    your right-hand man in deciding who gets the thumbs up for admission and who gets
    a polite “sorry, not this time.”


    Here’s the catch, though. We only get to see if someone actually drops out if
    they were admitted to the university in the first place, right? We don’t have
    any data on the folks who got turned down because, well, they didn’t get admitted
    to drop out. This is the classic *restricted outcome* issue. Our data is biased
    because it only includes outcomes for the students who were admitted, not the
    entire pool of applicants.


    So, here’s how it goes: You start with an application and feed the details into
    your AI system. It spits out a prediction, and you use that along with other factors
    to decide: admission granted or denied. If granted, we’ll eventually see if the
    student dropped out or not. But for those denied admission? Zip. No data. No clue
    if they might have dropped out or not. This situation is what we call *restricted
    outcomes*.


    The restricted outcomes problem is a real head-scratcher for AI and machine learning,
    as it affects the quality of the data we have for prediction and decision making.
    It’s a stark reminder of how using AI in the real world often means finding our
    way through tricky, less-than-ideal situations where the data is influenced by
    the very decisions it helps to shape.


    ***Deciphering the Puzzle of Restricted Outcomes Problems***


    Getting a firm handle on when and where this issue crops up is key. This typically
    happens when we’re knee-deep in prediction, not so much in automation. To fully
    grasp why this is the case, we need to sift through the unique traits of prediction
    problems that lead to restricted outcomes.


    First off, prediction problems rely on observing outcomes. Let’s draw up a scenario
    for automation to give us some context. Say we’re dealing with a problem of patient
    no-shows at doctor’s appointments. We might show a patient’s details to an expert
    and ask, “Do you reckon this person will show up for their appointment? What’s
    your take on whether they’ll be a no-show or not?” We could gather this kind of
    information for all patients because we can present all records to a medical professional
    and ask for their views on potential outcomes.


    However, when we switch gears from automation to prediction, things get a bit
    messy. We’re not just asking for opinions or judgments anymore—we’re trying to
    see actual outcomes and predict those outcomes. But our ability to see these outcomes
    is inherently tied to the processes that enable their observation in the first
    place. These processes are inevitably shaped by certain decisions, and this stops
    us from seeing outcomes for the entire population.


    So, restricted outcomes typically rear their heads in prediction problems and
    usually appear when there’s a binary decision to be made. One side of that binary
    decision leads to a complete inability to observe outcomes. For instance, in the
    patient no-show case, we only see whether people skip their appointments or not
    if they’ve made an appointment— not if they never booked one in the first place.


    It’s useful to ponder other situations that follow this pattern—other problems
    where outcomes are only visible if one of two decisions is made. Identifying and
    understanding these scenarios will gear us up to better spot and tackle the restricted
    outcomes issue in various real-world settings where AI and machine learning systems
    are put to use.


    It’s crucial to realize that this issue isn’t limited to health care—it’s a widespread
    problem that crops up across various fields and contexts. For example, think about
    job applications, especially the recruitment process. In this case, you can only
    see outcomes (job performance) for people who are hired. But this example also
    adds a little twist to the binary structure we’ve been discussing so far.


    In the realm of job recruitment, if someone doesn’t get the job, they might not
    be able to showcase their performance initially and hence not be hired, but they
    could impress in another job role later. This means that at some future point—let’s
    say, a year down the line—we might see outcomes that we couldn’t capture when
    we wanted to. This slight delay in observation differs structurally from the patient
    no-show problem, where, if a patient doesn’t book an appointment, we’ll simply
    never know whether they would have shown up or not.


    Being able to potentially see outcomes later, while not fully resolving the restricted
    outcomes issue, does bring a time factor into play that could be used to finetune
    predictions and, in some cases, lessen the impact of the issue. However, whether
    this is possible largely hinges on the specific context and the unique structure
    of the decisions and outcomes at hand.'
