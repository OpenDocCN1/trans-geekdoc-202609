- fmt: '

    You see, as human beings, we have a natural aversion to change. It’s a common
    trait among us all. Change pushes us out of our familiar comfort zones, making
    us exert energy on learning and adapting to new things. We invest substantial
    time and effort mastering a particular domain, hoping to sit back and enjoy the
    ride once we’ve reached a certain level of proficiency. But, as life would have
    it, a new trend emerges or a fresh-faced boss with innovative ideas takes control,
    and we’re forced back into learning mode. It’s a cycle that many of us don’t enjoy—but
    that’s only part of the story.


    On the other side of the coin, as humans, we crave relevance and a sense of purpose
    in what we do. That craving often supersedes our need for comfort. We want our
    contributions to matter, for our work to have significance. That’s a feeling we
    value highly—sometimes even more than staying within the cozy feeling of familiarity
    and ease.


    I will never forget a thought-provoking lecture delivered by the esteemed Professor
    Roberto Rigobon during my studies at MIT. I can’t quote him accurately, but the
    crux of his theory regarding this topic is etched in my memory. He painted a picture
    of a life trajectory that was typical in the times of our parents and grandparents.
    By and large, our lives were patterned similarly across generations: We were born,
    we grew into children, we attended school, acquired a professional skill set or
    learned a craft, then we joined the workforce, and finally, we retired. This cycle,
    this system of life, was quite linear and straightforward.


    During an era when the average lifespan was around 65 years, the pattern looked
    something like this: Spend six years transitioning from infancy to childhood,
    another decade in formal education, five years acquiring a professional skill,
    then work for three decades, and finally enjoy a lengthy retirement lasting around
    14 years. This model worked well in a slower-paced world, with localized workplaces
    and minimal technological disruptions. It was entirely reasonable to take care
    of grandchildren or embark on the trip around the world we’d always dreamed about
    at 51. It did not have to be at 41.


    However, the times have changed significantly, and the future holds an entirely
    different reality for us and our children. Two dominant forces are exerting immense
    pressure on our generation, challenging the conventional life strategy our parents
    and grandparents adhered to. The first is increased longevity—we’re now living
    to an average of 85 years. The second, and equally disruptive, is the rapidly
    evolving digital world powered by groundbreaking technologies such as AI, which
    penetrates every aspect of our work and personal lives.


    In the current era, we might spend six formative years growing from a baby to
    a child, followed by 12 years in school, and then about a decade more honing our
    professional skills, which typically includes an undergraduate degree, a graduate
    degree, and hands-on experience through an internship. If we plan to retire at
    70, that leaves a significant four-decadelong stretch to work.


    This modern timeline presents two substantial challenges. Firstly, assuming caretaking
    responsibilities for our grandchildren or fulfilling our lifelong travel dreams
    at 70 is considerably more difficult. Secondly, and more critically, given today’s
    rapidly-paced industrial and technological advancements, can we confidently assume
    that what we learn in university will remain relevant and valuable four decades
    later?


    These changes lead me to my core argument—the absolute necessity of learning to
    lead with AI. AI is permeating every aspect of our lives at an accelerated pace.
    It’s crucial for people of my generation, and those who came before and will come
    after, to grasp at least the fundamental principles behind AI, to stay relevant
    and continuously contribute value in the contemporary workplace. And when I say
    this, I’m not just referring to programmers or software engineers. It also applies
    to business leaders and enterprise managers, who risk letting the world pass them
    by if they fail to comprehend AI and feel comfortable navigating their business
    objectives with it at the forefront of their strategy.


    # Making Sense of AI


    AI is more than just a cool word we hear a lot these days. It’s a powerful tool
    changing our world, appearing more and more in the news, powering things like
    chatbots, and shaking up different industries. But there’s more to AI than what
    we first see; to truly understand it, we need to look beyond the initial excitement.
    This book aims to simplify AI—explaining what it does, showing its deep connection
    with society, and highlighting how it affects our daily lives.


    Everywhere we look, we hear about the amazing things AI is doing. It’s changing
    everything from health care to art, making our security systems better, and even
    guiding our daily Internet searches. With all this information, it can feel like
    trying to navigate a complicated maze.


    In the financial services industry, AI is now taking center stage. Firstly, financial
    institutions are using AI to better serve their customers, enhancing solutions
    for everyone from the customer-facing front office to the operational back office.
    Secondly, they’re leveraging AI to strengthen their position in the market, ensuring
    they remain ahead of their competitors. Thirdly, there’s the allure of cost-efficiency.
    AI offers the potential to streamline operations and reduce costs, making it an
    attractive proposition for any business.


    AI-driven applications are becoming increasingly popular among cloud service providers.
    Companies like `Google` and `Microsoft` are fervently promoting this approach.
    This strategy aims to initially gain a foothold and then expand their range of
    services. For financial institutions equipped with data know-how and technical
    expertise, the move toward AI goes hand in hand with a shift toward cloud services.
    As these entities become more entrenched in the world of AI, they’re also finding
    more reasons to integrate cloud solutions into their daily operations.


    People have different views on AI. Some see it as the start of a new era; others
    think it’s overhyped. My goal is to help you make sense of these different opinions,
    giving you a balanced understanding of what AI can and can’t.


    A lot of books and resources about AI get caught up in the technical details,
    diving deep into complex things like `neural networks` and `math models`. We’ll
    touch on these topics too, but we’re also interested in looking at how AI fits
    into society. We’ll explore how social norms and dynamics influence AI’s development,
    and how the growth of AI technology affects our societal structures.


    People often describe AI as the `new electricity`; I want to help you understand
    why this comparison makes sense. Focusing only on the technical parts of AI can
    satisfy tech enthusiasts, but it can make us lose sight of the bigger picture.
    Getting too caught up in the details can make us miss out on an understanding
    of how AI is reshaping society. So, we aim to answer not just the techy questions,
    but also the bigger, philosophical ones.


    This book is your partner on this journey of exploration, no matter what your
    experience has been with AI, computer science, or coding. Even if you already
    know a bit about these areas, you’ll probably find some new ideas and insights.
    I’m not just trying to explain `machine learning` or `statistics`; but also creating
    a unique path through the world of AI, one that emphasizes the philosophical and
    societal aspects.


    So why should you take the time to read this book? Maybe you’re about to work
    with AI, or you’re just curious about all the talk around this new technology.
    No matter why you’re here, this book will give you a complete understanding of
    AI’s role in the world; and it might even change the way you see things.

