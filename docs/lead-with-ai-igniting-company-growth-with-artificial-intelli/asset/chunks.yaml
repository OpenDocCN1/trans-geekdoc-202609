- fmt: '

    As my career progressed, so did technology. My Nokia was eventually replaced with
    a Blackberry, which was soon replaced with an iPhone 3. The era of social media
    arrived with Facebook and instant messaging through WhatsApp. Today, my digital
    presence is vast. I can be reached by e-mail, accessible through either of my
    two laptops, or any of my three e-mail accounts. You can text me, call me, video
    chat, leave me a voice-mail, even check if I’ve read your message or not. But
    a recurring question persists—have these advances increased my efficiency, reduced
    it, or kept it at the same level as before? How do I compare to my father, who
    managed to achieve so much with so little technology?


    This perspective makes me reevaluate the role of technology in my life. As I delve
    deeper into the age of artificial intelligence (AI), these questions become more
    relevant. This transformation of work and communication through technology is
    a double-edged sword—it has ushered in new possibilities, but it also makes me
    wonder if it has made me more effective at what I do.


    Often, I catch myself just watching my kids, my lively nine-year-old, Daniel,
    and my spirited teenager, Carmel, who’s already 13. I can’t help but wonder about
    the future they’re stepping into. The stuff they’re learning in school right now
    could be seen as old news by the time they’re heading off to college. And who
    can say if the careers they pick will even exist when they’re tossing their graduation
    caps into the air? It’s as if I’m standing on quicksand, writing a book about
    AI, knowing that in 10 years or so, the world as we know it might be totally different.
    So, the big question is—while AI is great at helping us get more done on a small
    scale, can it truly change the game when we look at the bigger picture?


    To me, the answer depends on a couple of things—what we’re hoping AI will do for
    us and how we decide to guide its growth. It’s crucial to add a human touch to
    AI before it turns us into machines. We’ve got to remember that we’re flesh and
    blood, not metal and wires. Technology is racing ahead at breakneck speed, but
    are we? We’re still designed to take things slower. We need our six to eight hours
    of sleep every night. We crave chit-chats and connections with others. Not too
    long ago, I watched an amazing TED talk by a Harvard professor who showed how
    keeping close social connections throughout our lives is the top thing that helps
    keep us happy and live longer. We still crave life’s simple joys—the magic of
    a bedtime story, the beauty of a sunset, the happiness of a lazy day doing nothing.
    It’s still important that we wake up and say good morning to our loved ones next
    to us before checking our e-mails, and it always will be. We’re not robots. We’re
    complex creatures full of feelings, not a tangle of wires and circuits.


    That’s not to say AI doesn’t have a lot to offer. It certainly does. It can take
    boring, repetitive tasks off our plates, help us make better decisions by predicting
    outcomes, and finetune our preferences so that we can cut through all the noise
    and find what really matters to us. But there’s a danger in falling too hard for
    technology and letting it distract us from the things that truly make us human.


    Figuring out the balance between technology and our human lives, between AI and
    our own natural rhythms: it’s like a dance we’re all still learning. It’s a bit
    of a juggling act, but it’s one we have to do. Adopting AI doesn’t mean we should
    let it take over. It’s a tool, a really powerful one, but it’s here to help us,
    not boss us around.


    As we stride into an AI-filled future, we’ve got to make sure we’re the ones calling
    the shots, not the other way around. We need to bring our humanity into our tech,
    to remember the importance of our natural human rhythms, and to make sure that
    while we’re building a future with AI, we’re not forgetting to live.


    Back when I was a teenager, if I wanted to chat with a friend, I’d just dial their
    number, from memory. I kid you not, I had about 40 phone numbers memorized—friends,
    family, and important contacts. But then came mobile phones, and all those memorized
    numbers started to slip away.


    I have another strong memory from when I was 25. With my girlfriend at the time,
    who’s now my amazing wife Einat, I took a trip to Barcelona. We decided to rent
    a car, and I borrowed a map from the rental company. I actually memorized our
    whole route—the turns, street names, how far apart each turn was—everything. Now,
    I just tap a few buttons on my smartphone, and `Google Maps` or `Waze` lead the
    way. It’s like my natural sense of direction has gone to sleep, thanks to technology.


    This shift in our world is real, and it makes me wonder about the future my kids
    are stepping into. Will they know how to spell words right without relying on
    `Grammarly`, which watches their every keystroke? Will they get to experience
    the thrill of hunting for and finding information themselves, or will they totally
    depend on AI and search engines? I’m not even going to mention dictionaries and
    encyclopedias. Even online resources like `Wikipedia` might soon be history.


    As we build AI, and I’m included in that, we need to do it thoughtfully and with
    a strong sense of responsibility. When we talk to natural language processing
    systems and big language models, we should remember to use `please` and `thank
    you`, because these AI models learn from us. They’re like children growing up
    in our digital world, and we want to teach them to be polite and kind. We need
    to make sure we don’t misuse AI, taking advantage of its current inability to
    track the origins of data in the huge sea of information. We can’t let biases
    creep into our AI systems and cause harm to certain groups just because the checks
    and balances are still trying to catch up. Right now, you’re the responsible one,
    and so am I; we all are. We’re the grownups in this somewhat chaotic scene that
    hasn’t figured out how to govern itself because, as I mentioned earlier, tech
    is outpacing us. But that doesn’t mean it needs to take control away from us.


    We owe it to ourselves, our kids, and the generations to come to build responsible,
    fair, and ethical AI. The question we should be asking ourselves isn’t just about
    what kind of AI we want, but what we need to do to build that AI. It’s not just
    about making fancy tech, but about shaping a world that respects our humanity,
    a world where AI assists us, but doesn’t define us. We need to weave this understanding
    into every part of AI development, to make sure that the world we pass onto our
    kids is a world they can navigate safely, ethically, and confidently.


    ## Jumping Head First


    ### And If I Won’t Lead With AI?


    Have you ever noticed that we all have distinct habits: little quirks that define
    our personalities and set us apart? One of mine that you might find intriguing
    involves reading the quotes or slogans that people choose to include in their
    e-mail signatures. These often range from safety admonitions such as “Don’t Text
    And Drive” to environmental pleas like “Save Trees, Save Our Planet,” along with
    a myriad of other thoughtful messages.


    During my time at AT&T, I noticed an e-mail signature from a colleague from the
    Chicago office that really stood out to me. It read, “If you don’t like change,
    you’ll hate irrelevance even more.” Initially, it elicited a chuckle, but on deeper
    reflection, it seemed almost profound. I found it insightful and, most importantly,
    universally applicable—it’s timeless wisdom for the digital age.

