- fmt: '

    This problem has a structure to it. The question is: how can we de-morph a generic
    output into something we can actually measure? And if we were to attempt to translate
    this question into professional machine-understandable jargon, we might attempt
    to ask it this way: How does your dataset label (`Y`) differ from the actual outcome
    you want? If you want to detect a `qualified` applicant, what did you actually
    measure? If you want to identify `scams`, what did you actually measure? Recognizing
    these discrepancies is vital because it shows us what we’re leaving out when we
    build a system.


    ### Key Takeaways


    - **Getting Data Ready for Decision Trees**: When a process will involve building
    decision trees, you need to think about both how much data you have and how good
    it is. More data lets you make more complex models, while having better and more
    relevant variables gives you more detailed insights.

    - **Having Data That’s a Good Representation**: You need to make sure the data
    you’re using for your model is a good reflection of the situation you’re making
    predictions for. Understanding any differences between the perfect data and the
    data you actually have is super important.

    - **Making Your Data More Predictive**: Adding more specific variables to your
    data can make your predictions better. You might need to swap out broad categories
    for exact measurements or bring in new variables that are likely to change the
    results.

    - **Finding the Right Mix of Data Quantity and Quality**: Adding more data can
    be a good thing, but you need to make sure this extra data is good quality and
    relevant. Simply adding more variables doesn’t make your model better, unless
    those variables give useful, predictive insights.

    - **Recognizing That Your Data Isn’t Perfect**: When you turn real-world phenomena
    into data, you can lose some information. Knowing this fact can help you spot
    possible systematic errors in your model and guide the way you understand your
    model’s predictions.

    - **Using Layers in Machine Learning Systems**: Complex tasks often depend on
    smaller tasks or concepts. There are two main ways to include these in machine
    learning models; you can make a specific model for each task or make models that
    learn these tasks on their own.

    - **Choosing Flexibility or Tradeoffs When Teaching Smaller Tasks**: Both ways
    of including smaller tasks in machine learning models have their pros and cons.
    Teaching tasks directly allows you to check how well the model is doing, but you
    might miss out on important tasks. On the other hand, letting the model learn
    on its own can result in more flexible models, but it might need more data and
    make it harder to see how well the model’s doing.

    - **Letting Models Learn Smaller Tasks on Their Own**: Sometimes, machine learning
    algorithms can be more powerful and efficient when they’re allowed to learn their
    own smaller tasks. This means they can spot and use different parts of the data
    that a human might not have specifically pointed out.


    ## Generative AI and Language Models


    What large language models have done, is further democratized access to deep computation.


    ### The Tale of Generative AI and Its Transformative Power


    If you’ve been hearing the buzz around generative AI and wondering what all the
    fuss is about, you’re in the right place. In this chapter, we’re going to unpack
    generative AI. We’ll start from its early days, look at how it’s grown, and think
    about where it might be headed.


    To really understand AI as it is now, we need to go back in time, follow its journey
    from the very start, and see how its growth has gone hand in hand with the evolution
    of the ways we do business. The boom we’re seeing in AI isn’t just about tech
    getting better; it’s also a reflection of us growing as a society.


    We’re going to look at the big changes generative AI is bringing to all sorts
    of sectors. We’ll shine a light on game-changers like `DALL·E`, an image generator
    that’s changing the world of design, and `ChatGPT`, a text generator that can
    chat like a human. These supercool tech advances aren’t just pushing our creativity
    to new levels; they’re kickstarting an era of innovation that we couldn’t have
    dreamed of before.


    As we get into the nitty-gritty of AI’s development, we’ll unpack the transformation
    from simple AI models to complex systems that really get the context. You’ll see
    how AI has gone from basic setups that made predictions from a set of data to
    advanced models that can learn, interpret, and come up with new, but still relevant,
    results.


    By the end of this chapter, you’ll have a good handle on where generative AI started,
    and what it’s like now. You will thus be ready to think about where it could go
    in the future. With this in your toolkit, you’ll be set to bring generative AI
    into your work life, make the most of its principles, and dive into its endless
    possibilities. With this fresh viewpoint, you’ll be ready to actively shape the
    future of this rapidly changing field and escalate how you do things in our fast-paced
    digital world.


    ### Igniting Growth and Innovation With a Powerful Ally


    Imagine you’re running a business and you’re about to roll out this really cool,
    innovative new product. There’s the excitement of doing something new, but let’s
    be honest, there’s also that little knot of doubt. You’ve got an amazing team,
    a solid plan, and you’ve put your resources where they need to be. But trying
    to predict exactly what’s going to happen? That can feel like trying to see through
    a dense fog. So what if you had a super tool on your side—a generative AI sidekick
    that can give you valuable insights, spot trends, and even help you with the creative
    part of your product development?


    This isn’t a sneak preview of the future; it’s what’s happening right now. Generative
    AI is shaking up creative processes in all kinds of industries, showing its worth
    as a partner in sparking ideas. Groundbreaking models like `DALL·E` and `ChatGPT`
    show us that generative AI isn’t just about number-crunching and predicting things;
    it’s about being a part of the creative process.

