  trans: '


    你看，作为人类，我们对变化有着天生的排斥。这是我们所有人共同的特质。变化将我们推出熟悉的舒适区，迫使我们为了学习和适应新事物而花费精力。我们投入大量的时间和精力精通某个领域，希望在达到某种熟练水平后就能坐下来享受丰成果。但，生活往往是如此，当一种新趋势出现，或者一个带着创新想法的新老板主导了局面时，我们又被迫回到学习模式。这是一个我们许多人都不喜欢的循环——但这只是故事的一角。


    硬币的另一面是，作为人类，我们渴望在所做的事情中找到相关的目标感。这种渴望往往超越了我们对舒适的需求。我们希望自己的贡献是有意义的，我们的工作具有价值。这是我们非常看重的感觉——有时甚至比留在熟悉和从容的舒适感更为重要。


    我永远不会忘记在麻省理工学院（MIT）学习期间，受尊敬的罗伯托·里戈本教授带来的一场发人深省的演讲。我无法准确地引用他的原话，但他关于这一主题的核心理论已刻在我的记忆中。他描绘了一幅我们父母和祖辈时代典型的生命轨迹图。总的来说，我们的生活在代际之间有着类似的模式：我们出生，成长为儿童，上学，获得职业技能或学习一门手艺，然后进入职场，最后退休。这个循环，这套生命系统是相当线性且直接的。


    在一个平均寿命约为 65 岁的时代，这种模式看起来像是这样：花费六年时间从婴儿过渡到儿童，再花十年接受正规教育，用五年获得专业技能，然后工作三十年，最后享受长达约
    14 年的漫长退休生活。这种模式在一个节奏较慢、工作场所本地化且技术干扰极少的世界里运作得很好。在 51 岁时照顾孙辈或开启我们梦寐以求的环球旅行是完全合理的。这并不非得要在
    41 岁时完成。


    然而，时代已经发生了巨大变化，未来为我们和孩子带来了完全不同的现实。两种主导力量对我们这一代人施加巨大的压力，挑战着我们父母祖辈所遵循的传统生活策略。第一是寿命的延长——我们现在平均活到
    85 岁。第二，同样具有破坏性，是由 AI 等突破性技术驱动的快速发展的数字世界，它渗透到我们工作和个人生活的每一个方面。


    在当今，我们可能会花费六年的成长期从婴儿成长为儿童，接着是 12 年的学校生活，然后再花大约十年时间磨练我们的专业技能，这通常包括本科学位、研究生学位以及实习获得的实践经验。如果我们计划在
    70 岁时退休，就留下了长达四十年的重要工作期。


    这个现代时间线提出了两个重大的挑战。首先，假设在 70 岁时承担孙辈的照顾责任或实现一生的旅行梦想要困难得多。其次，更关键点是，鉴于当今快速的工业和技术进步，我们能有心地假设在大学中学到的知识在四十年后仍然具有相关价值和价值吗？


    这些变化引出了我的核心观点——学习如何利用 AI 进行领导是绝对的性。AI 正以加速的速度渗透到我们生活的每一个方面。对于我这一代人，以及之前和之后的人来说，掌握
    AI 背后的基本原理至关重要，以便在当代职场中保持相关性并持续贡献价值。当我说这些时，我指的不只是程序员或软件工程师。它也适用于商业领袖和企业经理，如果他们未能理解
    AI，并不能习惯于将其置于战略的前沿来引导他们的业务目标，就会面临被世界抛弃的风险。


    # 理解 AI


    AI 不仅仅是我们最近经常听到的酷酷词汇。它是一个改变我们世界的强大工具，在新闻中出现得越来越多，驱动着聊天机器人等事物，并冲击着不同的行业。但 AI 远比我们最初看到的更多；要真正理解它，我们需要跳出最初的兴奋。这本书旨在简化
    AI——解释它能做什么，展示它与社会的深层联系，并强调它是如何影响我们的日常生活。


    无论我们望向哪里，都能听到 AI 正在做的惊人事情。它正在改变从医疗保健到艺术的一切，让我们的安全系统变得更好，甚至引导我们的日常互联网搜索。有了所有这些信息，感觉就像在试图穿越一个复杂的迷宫。


    在金融服务行业，AI 现在正处于中心位置。首先，金融机构正在利用 AI 更好地服务客户，增强从面向客户的前台到运营后台的每个人的解决方案。其次，他们正在利用
    AI 加强自己的市场地位，确保领先于竞争对手。第三，是成本效益的吸引力。AI 具有简化运营和降低成本的潜力，使其成为任何业务极具吸引力的选择。


    AI 驱动的应用在云服务提供商中变得越来越流行。`Google`和`Microsoft`等公司正热烈地推广这种方法。这种策略旨在最初获得立足点，扩展他们的服务范围。对于拥有数据知识和技术专业的金融机构来说，向
    AI 迈进与向云服务的转型并行。随着这些实体在 AI 世界越发根深，他们也发现了更多理由将云解决方案整合到日常运营中。


    人们对 AI 有不同的看法。有些人将其视为一个新时代的开始；另一些人认为它被过度炒作。我的目标是帮助你理解这些不同的观点，对 AI 能做什么和不能做什么有一个平衡的理解。


    '
- fmt: '

    This book is more than a guide; it’s an invitation to explore the multifaceted
    world of AI, and to wrestle with its potential, its challenges, and its deep influence
    on society and life as we know it. The journey might be a bit complex, but the
    reward is a thorough, nuanced understanding of one of today’s most influential
    technologies.


    ## Finding the Balance


    One significant hurdle with AI and machine learning lies in striking the right
    balance between the technical aspects and their practical, real-world applications.
    While numerous resources and courses concentrate heavily on the mathematical and
    computing side of things, this often creates a disconnection from their practical
    use. My professional journey has led me to an essential realization: you don’t
    need to comprehend every minor technical detail to make effective use of AI. The
    crucial thinking tool in bridging this gap is something we often utilize without
    even noticing—`conceptualization`.


    The concept of conceptualization often comes up in basic programming and computer
    science classes, but its significance extends beyond just programming. Conceptualization
    essentially entails omitting the minutiae to concentrate on broader, more generalized
    concepts. In coding, we regularly employ `APIs` and `modules` without worrying
    about their internal workings. These components are entrusted to perform their
    function, allowing us to focus on what truly matters—the application we are developing.
    The beauty of conceptualization lies in its ability to shift our attention from
    being solely technology-oriented to focusing on how we can leverage that technology.


    Applying conceptualization encourages us to pose the right queries and view matters
    from fresh perspectives. Instead of merely focusing on the functioning of a certain
    aspect—whether it’s a machine learning algorithm or the principles of wind energy,
    for instance—we can delve into more effective ways of understanding these subjects.
    Conceptualization enables us to handle sophisticated devices without needing to
    understand all their nitty-gritty details. Take a wind turbine as an example—it’s
    a network of blades, gears, and electrical systems. Despite its complexity, designers
    understand that users don’t need to comprehend every facet of its operation. They
    present us with a conceptual layer, a simplified interface with easy-to-follow
    instructions and minimal interaction points. This conceptualization allows us
    to operate a complex system without getting lost in the specifics.


    But conceptualization isn’t limited to wind turbines and other devices. It’s how
    we interact with everyday technology. When you use your laptop, scrolling through
    web pages, you might be oblivious to the sophisticated processes occurring behind
    the scenes. But when you click `Send` on an e-mail, you trust that it’ll reach
    the intended recipient, even if you don’t comprehend the Internet protocols making
    that possible. Conceptualization allows you to use these technologies without
    needing to grasp every technical detail.


    However, it’s worth noting that conceptualization isn’t flawless. It inherently
    involves losing some detail. The more we distance ourselves from the technical
    elements, the more we risk compromising our ability to use them effectively. For
    example, if my electric scooter’s battery drained and I lacked even a basic knowledge
    of recharging it, I’d be stranded. Hence, it’s vital to develop interfaces and
    conceptual layers that function well and are user-friendly in their intended contexts.


    In this book, we’ll go deeper into the ways that conceptualization can empower
    leaders to grasp and harness the power of AI. We’ll address practical applications,
    strategic considerations, and AI’s societal impact. By embracing conceptualization,
    and honing in on its key aspects, we can navigate the sophisticated realm of AI
    and tap into its potential for impactful changes. Through this process, we can
    view AI not as an intimidating web of complexities, but as a readily accessible
    tool, which is capable of fostering innovation and transformation.


    ## Becoming the Designer


    I want to talk about an important job in the world of AI. It’s a job that’s really
    needed right now, but there aren’t enough skilled people to fill it. We’ve talked
    about different AI uses before, but we didn’t get into the nitty-gritty details
    like collecting data, checking systems, or planning how to roll them out. However,
    these things are super important. Usually, it’s not the engineer’s job to handle
    these parts. If they get stuck dealing with these issues, the project is doomed
    before it even starts. The goal of this book is to help you think like a designer,
    not like a programmer.


    But as design thinkers, you’ll face different challenges. Your job is to figure
    out the complexities of the real world and propose systems that can handle them.
    This complexity isn’t something that can be easily automated. You need to be creative
    and good at problem-solving. In this book, we’ll spend a lot of time identifying
    opportunities for AI in a structured and systematic way. Once these opportunities
    are found, the rest is...


    ## What Is AI?


    *As AI becomes advanced there is a great advantage of being a generalist as opposed
    to being a specialist.*


    ### A Dance Between Human and Machine


    At its heart, artificial intelligence (AI) is an idea dreamed up by a pioneer,
    John McCarthy. He pictured it as the art and science of making smart machines,
    especially clever computer programs. It’s all about using computers to understand
    and maybe copy human smarts. But it’s crucial to remember that AI isn’t trying
    to exactly copy how the human brain works.


    In the early days of AI and machine learning, there was a lot of interest in building
    systems based on the human brain. The idea was simple; if you could copy a load
    of brain neurons, you might be able to make intelligence. While modern machine
    learning techniques might take some ideas from this, the modern AI field isn’t
    trying to make a perfect clone of the human brain.

    '
