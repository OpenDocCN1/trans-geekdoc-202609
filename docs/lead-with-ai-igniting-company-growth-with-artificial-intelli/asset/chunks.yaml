- fmt: '

    To understand the beginnings of generative AI and language models, we need to
    time travel back to the 1940s. In those days, the idea of statistical language
    modeling was as ground-breaking as AI is in some sectors today. One pioneering
    brain behind this transformative concept was the brilliant mathematician Claude
    Shannon. The same Claude Shannon of Bell Telephone Laboratories, who also contributed
    to the seminal 1956 Dart-mouth College research with John McCarthy, discussed
    in earlier chapters.


    Shannon started his journey with a basic but powerful concept, envisioning English
    as a system made up of 26 characters and spaces, generated randomly. This idea
    is similar to the birth of a business idea—raw and somewhat tangled, but signifying
    the start of something significant.


    Through careful refinement and iterative adjustments based on feedback, Shannon’s
    model started showing promise. Identifying the sequence of characters, he made
    considerable progress toward creating text that seemed somewhat realistic. This
    is similar to a business finetuning its product to better meet market demands.


    The cycle of refining the model, shifting from characters to words, is like a
    business scaling up its operations. Shannon showed that by predicting the next
    word based on the previous one, he could put together a sequence of English words.
    While these sentences lacked logical coherence, they still looked a lot like English.
    Despite the computational limitations of his time, Shannon’s foresight paved the
    way for today’s language models.


    Let’s dig deeper now to understand how language models, like AI chatbots, work.
    Picture a gigantic spreadsheet, spreading 100,000 words wide and shooting up to
    an astounding height of `10^(20)`. Each cell represents a tiny possibility within
    a vast sea of potential word sequences. It’s a mind-boggling idea, right?


    However, this method turns out to be impractical. Think about tracking not just
    three, but 20 previous words. All of a sudden, the potential combinations exceed
    the total number of atoms in the known universe! This daunting challenge underscores
    the limitations of Claude Shannon’s early methodology.


    So, are we missing something vital here? What if we could enrich raw data with
    our knowledge of English grammar rules? This suggestion sparks a long-standing
    debate within the AI community: should we rely mainly on data, or should we also
    incorporate our understanding of the underlying rules? Judging by the path of
    supervised machine learning, it appears the data-centric approach is winning the
    race. Generative AI seems to be following a similar route: let the data tell the
    tale, and the rules will gradually reveal themselves.


    To provide more context, let’s rewind to the 1960s and meet `ELIZA`, a basic program
    created at MIT under the guidance of Professor Joseph Weizenbaum (who ironically
    was a critic of AI, but that’s for another book). `ELIZA`, an early conversational
    agent, could respond to statements like, “I’m concerned about the global warming
    crisis,” with generic replies such as, “Tell me more about the global warming
    crisis.” `ELIZA` was at its core a client-centered therapist and could engage
    in basic conversations by rephrasing the user’s statements as questions. Despite
    its simple design, users attributed a surprising level of intelligence to `ELIZA`—an
    aspect of AI that has increasingly become accepted as the standard over time.


    ## The Leap to Sophisticated Models


    The creation of more complex language models has been possible due to the perfect
    blend of data-driven techniques and rule-based methods. This balance has given
    birth to intelligent assistants like `Siri` and `Google Duplex`. However, until
    recently, these models had limited reach and remained largely out of reach for
    the average user.


    Today, the landscape is changing at a rate we’ve never seen before, with models
    like OpenAI’s `GPT` pushing generative AI into the spotlight. Fundamentally, these
    contemporary generative models operate on the principle outlined by Shannon. They
    predict the next word based on a few preceding ones, much like your smartphone’s
    auto-complete feature.


    To put it in simpler terms, think of `GPT` as an AI that enhances your phone’s
    suggested next word functionality but considers hundreds of previous words instead
    of just a couple. This text generation process is a series of individual predictions
    about the most likely next word, each contributing to a cohesive piece of text.
    So, we find ourselves back at our starting point: the captivating world of generative
    AI.


    However, it’s important to clear up a common misconception at this point. `ChatGPT`
    and `GPT` are not the same, and understanding the differences between them can
    shed light on how these models work. `ChatGPT` typically uses a `GPT-3` model,
    or `GPT-4`, or any subsequent version. This model has been tweaked to give `ChatGPT`
    its conversational abilities, rather than just predicting the next word. But at
    its heart, it’s all about predicting what comes next.


    `GPT`, the cornerstone of language modeling, isn’t exclusive to a specific entity.
    Through certain modifications or `finetuning`, `GPT` has been adjusted to create
    `ChatGPT`, making it more suitable for everyday conversation. While the core concept
    has been around for a while, adapting a model for public use as a chatbot required
    extra work. But the principle remains: predicting the next character, step by
    step.


    This process starts with a sentence like “I’m having an awesome day.” Each subsequence
    becomes a data point for training. If `awesome` is the input, `day` is the output.
    Repeating this process generates countless training examples from a single sentence,
    each forming a unique input–output pair.


    `GPT`’s training data is sourced from various places, including Web texts, Wikipedia,
    and more. Transformed into machine-readable `tokens`, the model trains on hundreds
    of billions of words. But at its core, it’s all about predicting what comes next.


    ## The Delicate Interplay of Chance and Skill in Generative AI


    One important fact to understand about `GPT` is that it doesn’t just spit out
    the likeliest word. Instead, it assigns odds to a range of words, and its choice
    reflects these probabilities. For example, if there’s a 50-50 shot the next word
    is `essential` or `crucial`, it will make a toss-up pick based on these odds.
    This touch of unpredictability means that if it were asked to repeat the task,
    it might make a different choice each time, injecting a pinch of creativity into
    the mix.


    While these models are rooted in supervised machine learning, as we’ve touched
    on, they demand a hefty amount of engineering wizardry to be fully operational.
    We’ve advanced a great deal from Shannon’s original method, cooking up complex
    systems that handle sophistication in a far more efficient manner.

