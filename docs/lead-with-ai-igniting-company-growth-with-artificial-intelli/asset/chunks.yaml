  trans: '

    回到 2023 年，我们一些最关键的模型已经变得如此复杂，以至于无法完全审查。但这并不意味着这些模型已经过时或毫无价值。事实恰恰相反。尽管这些模型非常复杂，但它们在我们以数据为中心的世界中仍然是关重要的工具。答案并不是因为它们难以理解就将其抛弃，而是要调整我们处理它们的方法。


    当我们试图避免可能导致损害的意外问题时，确保安全性成为我们的首要任务。让我们以客户产品评论分析为例。尽管我们无法完全理解整个过程，但仍然仍然检查数据，并感知哪些词汇与正面或负面评价相关。偶尔，我们可能会发现一些惊喜，例如
    `sick` 这个词，在某些语境下它可以具有积极的含义。


    这些意料之外的结果表明，我们对语言及其细微差别的理解远非完美。例如，我们最初可能没有考虑到表情符号是客户评论分析中有帮助的预测指标。但在检查数据后，显而易见，表情符号具有巨大的预测能力。同样，当我们试图区分不同的客户时，特定的短语和语言风格会显著影响我们的预测。这提醒我们，我们对语言的理解以及制定规则的能力可能并没有我们想象中那么完整。


    这引发了一个引人入胜的问题：我们需要理解背后发生了什么吗？在某些情况下，答案是否定的。但在某些情况下，理解底层过程对于得出有意义的结论或做出可靠的预测至关重要。


    我们可以从这些观察中获得的一个重要教训是，语言分析就像客户评论分析一样，可以被视为任何其他数据。我们可以将这种方法应用于任何语言，即使是我们不熟悉的语言，而不需要理解语言本身。这就像一个智能外星人分析我们语言的方式：他们对此没有任何先入为主的想法，但仍然能够检测模式和规则。


    但这并不意味着所有的规则都是无关的。某些领域，例如算法交易，仍然严重依赖成熟的规则。因此，理解我们所谓的 `open-world` 问题（规则不明确或难以确定）与
    `closed-world` 问题（规则已知且直接）之间的区别至关重要。开放世界问题包括金融、社交媒体趋势、气候变化、物理某些领域和传感器数据等。闭环世界问题更多关于定义明确且受控的环境。


    在不断演变的 AI 世界中，算法建模和数据建模都在不断进步并塑造着我们的理解。两者都有各自的优缺点，但结合在一起，它们提供了关于世界以及我们在其中角色的全面图景。当我们继续探索这两种文化时，规则、理解和数据在智能领域之间迷人的互动不断讲述着一个引人入胜的故事。这一叙事正引导着
    AI 的进程以及我们走向数据驱动世界之旅。


    ## 核心要点


    - **AI 的多重身份**：AI 不仅仅关于构建能够像人类一样思考的机器。它是一个多样化的领域，旨在创建能够增强我们能力、解决复杂问题并自主决策的系统。

    - **AI 的两个支柱**：AI 基于两个基本原则构建。第一个是根据我们对问题的理解制定规则，并将这些规则编写到机器中。第二种方法（主要方法）是数据驱动的。

    - **转向数据驱动**：随着 AI 模型变得越来越复杂，管理它们的方式需要发生变化。确保一切安全并防止意外问题成为关键。

    - **统计学的作用**：机器学习是一个在 AI 讨论中不断出现的术语，它在塑造我们所所的 AI 世界方面发挥了巨大作用。

    - **AI 的两面**：AI 分为两个阵营——关于规则的算法派，以及关于预测的数据派。

    - **开放世界对阵 闭环世界**：理解 `open-world` 问题（规则不明确或难以确定）与 `closed-world` 问题（规则已知且直接）之间的区别至关重要。

    '
- fmt: '

    Seeing this shift in focus—from understanding why to predicting what—uncovers
    the real power of machine learning. As we understand its limits, we can better
    appreciate what it can do and use its capabilities more wisely and skillfully.


    ## Breathing Life Into Machine Learning With Music


    Let’s breathe some life into this concept with a completely new real-world example:
    Spotify, a popular online music streaming service known for its intelligent music
    recommendations. If you aren’t familiar with Spotify, it generates personalized
    playlists, offering listeners a curation of songs they might enjoy. Imagine asking
    Spotify, “Based on my taste, what songs would I enjoy?” In seconds, you receive
    a playlist filled with potential new favorites—a true spectacle of machine learning
    magic. Now, let’s peek behind the curtain and see how this all comes together.


    Spotify’s extensive database includes millions of songs, each with its own set
    of features like genre, tempo, key, and lyrics. It also considers your personal
    listening history and preferences. Somehow, all these data get transformed into
    a personalized music selection—your `Discover Weekly`. Converting raw information
    into a playlist might seem confusing, and you might be wondering how rules can
    be created to do this.


    Professional DJs and music curators do this kind of music matching all the time,
    right? They consider various characteristics of songs and create playlists that
    resonate with their audience’s taste. You might think they follow a fixed set
    of rules—pick a certain genre, match the tempo, choose the same key, and maybe
    sprinkle in a few surprise tracks for excitement. Sounds straightforward enough,
    doesn’t it? Unfortunately, it’s far from straightforward.


    The process we’re discussing—that turns inputs (song features and listener preferences)
    into outputs (playlists)—isn’t that simple to devise. It’s like a mysterious riddle
    box. Unlocking the secret of this box is the real challenge.


    ## Machine Learning in Our Everyday Lives


    You will be amazed at how frequently we encounter prediction problems— they’re
    an integral part of our daily lives. Let’s return to our music recommendation
    example. Sure, the concept of considering listener preferences (inputs) and coming
    up with a personalized playlist (output) seem straightforward. But in reality,
    it’s anything but. The rules guiding these predictions can be incredibly complex
    and committing them to code is a challenging task. This is a common theme we’ve
    encountered throughout our exploration of AI and machine learning.


    But here’s the silver lining. Despite these obstacles, machine learning can take
    on a broad range of problems: predicting someone’s preferred workout routine,
    determining whether a student will pass or fail a course, or forecasting shifts
    in fashion trends. Machine learning can handle it all. What connects these scenarios
    is our aim to predict an outcome (`Y`) based on certain inputs (`X`), even when
    the rulebook remains obscure.


    The best part is that we don’t have to devise these rules ourselves. We let the
    data do the heavy lifting and learn the rules for us. We’re swamped with data
    these days. The tricky part is figuring out how to use these data to find these
    rules when it’s impractical (or impossible) to write them down.


    Before we dive deeper, it’s crucial to understand what these data look like. With
    Spotify, we examined aspects like song genres, listener habits, and tempo and
    tried to predict music preferences. But what other historical data could be beneficial?
    What measurements might prove useful, and where can we find these data? These
    questions touch the core of the `X`s and `Y`s in our prediction problem.


    The concept of a machine learning problem might seem somewhat nebulous at this
    stage. But believe it or not, you’ve probably encountered it in your daily life.
    Let’s circle back to the Spotify example. Imagine being handed all these data
    and instructed to make predictions. One of the first strategies you’d probably
    deploy is regression—a statistical method you may already be familiar with.


    Regression, in its simplest form, means drawing a line through a cluster of data
    points on a graph. It might not seem like high-tech machine learning, but it’s
    one of the foundational elements of the field, and you’ll find it in any machine
    learning textbook. This tool allows us to make predictions based on the trend
    the line displays. For example, given a listener’s past playlist, you could use
    a regression line to guess their next favorite song.


    While this might sound overly simplistic, the fundamental problem that regression
    solves is the same one we’re aiming to solve with machine learning. It’s all about
    identifying patterns and making accurate predictions. This just goes to show that
    machine learning permeates our daily lives, whether we’re aware of it or not.


    ## The Gears Behind Machine Learning


    Regression gives us a sneak peek into what makes machine learning tick. The journey
    starts with you getting some inputs (`X`s) and outputs (`Y`s). You use regression,
    which draws a line, or as we call it, establishes `weights`. These are your ticket
    to making future predictions. This is like the mystery box we’ve been talking
    about: data go in one side, and predictions come out the other. We usually call
    these predictions `Y-hats`, to tell them apart from the real data points, or `Y`s.


    Looking at it this way, regression is doing exactly what machine learning aims
    to do: give me data, and I’ll hand you back this `mystery box` that can make predictions.


    What’s interesting is that there are two separate algorithms at work here. If
    the word `algorithm` feels a bit scary, think of it as just a techy word for a
    program that takes in inputs and spits out outputs. In this case, we’ve got two
    of these programs doing the heavy lifting.


    The first is the regression algorithm itself. This is the one that knows how to
    take data and turn it into weights or coefficients. The second is all about these
    weights or coefficients. This algorithm takes the inputs, multiplies them by the
    weights, and adds them all up, and you’ve got a predicted price. These are two
    separate programs working together. It’s important to see them as two different
    things. The first algorithm takes in some data and makes the rules. The second
    one uses these rules on inputs to make predictions.


    When it comes to regression, these are two separate steps. To make it easier to
    understand, let’s say we only have the destination of a wanted flight and we want
    to predict its price. What role does the regression algorithm play here? It looks
    at the data and thinks about the different lines it could draw. Maybe it considers
    one line and then another. Initially, all these lines are in the running.


    This thinking process is crucial for understanding machine learning. It not only
    lays out the basics but also pulls back the curtain on the process. It takes machine
    learning from being a mystery box to being an open book that we can read, understand,
    and eventually use to handle all sorts of tricky prediction problems. Getting
    the hang of and using these two algorithms—the one that turns data into weights
    and the other that uses weights to make predictions—are at the heart of machine
    learning.


    ## Regression and Beyond


    When you strip it all down, regression is an algorithm designed to find the line
    that best fits the data. That’s Step 1. Once this line (which we represent as
    weights or coefficients) is all set up, you’ve got a prediction tool ready to
    go. Let’s say a new house pops up for sale. You know its square footage, and you
    want to guess its price. You’d use the line you’ve drawn to make a prediction.


    So, we’ve got two distinct parts here:


    1. The regression algorithm figures out the line (or weights or coefficients).

    2. Once the weights are in place, you can make predictions about outputs based
    on inputs. These two parts are what regression is all about.

    '
