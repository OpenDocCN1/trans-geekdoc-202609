- fmt: '

    Sometimes, the opportunities to use AI might not be obvious in your current operating
    environment. They might not seem feasible or even relevant within the current
    setup. But if you’re open to making big changes and reshaping your operational
    strategy, you can create new opportunities for AI. These new opportunities could
    bring big benefits that wouldn’t have been possible by simply adding AI into an
    unchanged, traditional production process.


    This idea fits in with our earlier discussion about closed and open world problems.
    On-demand manufacturing is kind of a closed world problem, because it deals with
    a controlled environment with set parameters and limits. It’s also closely linked
    to operations research, which uses advanced analytical methods to help make better
    decisions. In this context, AI can be an incredibly powerful tool for improving
    operational efficiency and boosting productivity.


    # AI With Semiconductors


    One industry that has shown some hesitation in adopting AI, despite the immense
    potential benefits, is the semiconductor industry. The sophisticated nature of
    this industry, combined with its distinct challenges, often impedes the seamless
    integration of AI. Intriguingly, the hurdle is not the human factor, as one might
    presume, but the existing technological infrastructure and its limitations.


    There are multiple obstacles to converting the semiconductor industry into an
    AI-friendly environment. There are problems like system and data format compatibility,
    the intricacy of data entry and usage, and inconsistent practices in quality control
    and coding standards, which all act as considerable deterrents. In many ways,
    the current system in the semiconductor industry appears ill-adapted for the incorporation
    of AI technologies. If we were to engineer a semiconductor production system from
    scratch with the primary objective of AI integration, it would be significantly
    different.


    In a semiconductor system structured around AI, standardized protocols for data
    collection and reporting would become standard. Efficient methods of sharing data
    across different companies and transferring chip blueprints from one foundry to
    another would replace outmoded practices such as manually transferring detailed
    specifications.


    The extraordinary potential of AI in the semiconductor industry remains largely
    untapped, not due to a deficiency of technological progress, but because of a
    mismatch with the existing system. Current practices in the semiconductor industry
    are not designed for AI integration. We lack an infrastructure that gathers clean,
    representative datasets that can be utilized across different institutions. We
    grapple with the variety of equipment that produces wafer scans in different formats,
    rendering an AI system trained on one device ineffective on another. This lack
    of standardization and data sharing impedes the successful integration of AI into
    the industry.


    So, while the role of AI in the semiconductor industry undoubtedly appears promising,
    attaining success will necessitate a significant shift in how data is generated
    and handled. We need to reconfigure our systems and processes with the explicit
    goal of facilitating the deployment of AI. The amalgamation of AI technology and
    a newly adapted process could potentially yield substantial benefits.


    Nonetheless, such a transformation is not without its challenges. Overhauling
    the way data is managed within the semiconductor industry is an enormous undertaking,
    requiring substantial resources, time, and effort. It’s crucial to ponder whether
    such changes are essential for the success of AI and if they’re realistically
    achievable within the specific context of your organization.


    Opportunities for integrating AI might not initially seem directly tied to AI.
    However, under the right conditions and with a readiness to implement broader
    changes, these adjustments could foster an environment where AI can truly flourish.
    The advantages of this disruptive technology in the semiconductor industry could
    be immense, but its success is associated with our readiness to modify and overhaul
    the existing system.


    ## Key Takeaways


    - **Start With the Task**: Let AI take the burden! If you have duties that are
    monotonous, data-intensive, or simply impossible for humans, AI could become your
    go-to solution. Bear in mind, it doesn’t have to be all or nothing. AI can either
    independently resolve closed world problems or cooperate with other strategies
    to handle open world challenges.

    - **Data Comes First**: Consider AI as the ultimate investigator— it thrives on
    analyzing data. And the best part? It’s becoming more skilled at discerning patterns,
    even when the data isn’t labeled. Remember the 80/20 principle? It’s just as relevant
    to AI—a minor portion of your data could supply the majority of your insights.

    - **Spurring Innovation**: Picture AI as a highly efficient office administrator.
    It can manage routine tasks and refer complex queries to human specialists. If
    you’re unsure about how to begin with AI, identify areas where achieving accuracy
    80 to 90 percent of the time would be a significant victory.

    - **Transforming Production**: AI can do wonders in optimizing production processes,
    like transitioning from a just-in-case to a just-in-time model. However, it’s
    not as straightforward as installing a new software update. To truly unlock AI’s
    potential, you might need to substantially rearrange your production processes.


    ## Evaluating Machine Learning

    *Getting better and better at the wrong things.*


    ### Real-World Consequences of Machine Learning


    When you start practicing AI and machine learning, you’re probably backed up by
    a great team or an expert guide who’s really good at putting complex models together.
    But the tricky part isn’t just building the models; it’s figuring out how well
    they’re doing their job. You might find yourself asking, “Is the model doing what
    we want it to do? Are the results what we expected?”


    Evaluating machine learning models isn’t just a techy job given to your team of
    engineers. You might think you’re done once you’ve got a few metrics in front
    of you, but that’s just the tip of the iceberg. In this chapter, I want to stress
    that the real success of a model depends on its impact in the real world, in the
    field it’s designed to work in. It’s not just about finding out if one model is
    better than another, if it’s an improvement from your current methods, or even
    if it’s ready to launch. The key thing is understanding the potential impact this
    model could have in the real world.


    In all the talk about machine learning, you’ve probably heard about tons of metrics
    for measuring predictions—a bunch of stats that give insight into your model’s
    behavior. You’ve probably heard terms like `false positive rate`, `false negative
    rate`, or `AUC score` used to describe the model’s performance, giving you a sneak
    peek of its predictive power.


    However, it’s really important to look beyond these numbers and focus on what
    they mean in the real world. The big question is, can we turn these metrics into
    real, tangible outcomes? Your investors and board members aren’t just interested
    in the model’s statistical abilities. They’re eager to hear about the major changes
    the model could bring when it’s used in real-life situations.


    In this chapter, we’ll dig into the idea of prediction quality, but our main goal
    is to highlight the quality of the decisions it leads to. We’re on a mission to
    find out how machine learning can help us make smarter, more informed decisions,
    instead of just making statistically impressive predictions.

    '
