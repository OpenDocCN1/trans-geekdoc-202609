    But, it’s not just about making facial recognition work perfectly for everyone.
    We also need to think about whether it’s okay to use this tech in certain situations
    at all. Given the chance of mistakes, should we really be relying entirely on
    this tech for things like arrests? We should have a more thorough checking process,
    backed up with more evidence.


    This situation serves as a tough reminder of how important it is to check how
    well machine learning models work for all important social groups, especially
    when these models are used by the public. We need to understand how a model works
    for different ages, races, genders, and so on. This way, we can make sure it’s
    fair and cut down on bias. This hard lesson is now seen as a must-do in the world
    of machine learning.


    ***A Maze of Challenges and Uncomfortable Tradeoffs***


    The Internal Revenue Service (IRS) offers a powerful example of bias within AI.
    It was found that their system had a negative impact on Black Americans, predominantly
    those who used the Earned Income Tax Credit. This throws up a crucial question:
    How can we assess the effects of machine learning models on different racial groups,
    especially when explicit racial data isn’t easily available?


    Lots of companies are nervous about collecting and storing data related to their
    users’ race. There are concerns around misuse and trust issues. But at the same
    time, these companies need to ensure fairness across all racial groups. To navigate
    this tightrope, some have adopted predictive approaches based on other available
    data. For instance, LinkedIn estimates a user’s gender from their first name to
    balance gender in search results. In a similar vein, some groups employ Bayesian
    Improved Surname and Geocoding (BISG), a method that predicts race and ethnicity
    using users’ surnames and geographic locations.


    Another possible solution is to ask a subset of users to voluntarily provide their
    demographic data for auditing purposes. However, this requires a high level of
    trust. Companies like Airbnb and LinkedIn have started to explore this route.


    But tackling AI bias isn’t as simple as just dividing performance metrics by social
    groups, identifying disparities, and fixing them. The case of the COMPAS algorithm,
    used widely in the United States to predict reoffending likelihood and pretrial
    no-shows, highlights this complexity.


    ProPublica, a news outlet, decided to evaluate COMPAS, focusing on error rates
    among different racial groups. They found that the false- positive rate was roughly
    twice as high for African American defendants compared to white defendants. The
    false-negative rate was about half as much.


    At first, this may seem like an obvious case of bias. But, if you dig a bit deeper,
    it’s more complex. For one, the rearrest rate for African American defendants
    was higher than that for white defendants. This higher false-positive rate for
    African Americans might just be reflecting this higher rearrest rate.


    The case throws up a tough dilemma when dealing with different base rates across
    populations. Decision makers have a tricky choice. They can either accept varying
    error rates for different groups or set different thresholds for what counts as
    high risk for different racial groups. Neither choice is without issues, highlighting
    the complex and sensitive nature of dealing with bias in AI systems.


    ***A Dance Between Social Inequities, Predictive Models, and Policy Choices***


    Simply broadening our data collection doesn’t necessarily wipe out biases in machine
    learning models. If the data we’re drawing from—like arrest records—are skewed,
    machine learning models just mirror and reproduce these biases, no matter how
    well balanced the data appears. In essence, machine learning isn’t a magic pill
    for social inequalities; it only mirrors the biases present in its training data.
    Therefore, there’s no standard, one-size-fits-all solution to fix bias in machine
    learning. After all, these models, as sophisticated as they are, can’t remedy
    social issues with mathematical adjustments alone.


    In addition to checking for model bias, it’s equally crucial to see how these
    models operate within the context in which they’re deployed. Models should be
    analyzed as components of larger systems, not standalone entities. For instance,
    if models are used to allocate rides to minimize court no-shows, we need to understand
    how providing a ride influences someone’s likelihood of turning up in court. However,
    using these predictions also forces policy decisions into the mix, like how to
    prioritize ride allocation based on predicted impacts.


    In these scenarios, it’s the policy, not the model, that may inadvertently introduce
    bias. Take Santa Clara County, California, as an example. The relationship between
    race and residential location—and consequently, the cost of rides—led to racial
    disparities in ride allocation. The policy was set up to boost court appearances
    within a budget by ranking defendants based on the predicted impact per dollar
    spent. However, the overlap of racial distribution and ride costs unintentionally
    resulted in some racial groups benefiting more than others from the program. Even
    though the predictions of court appearance likelihood and the effect of offering
    a ride were accurate, the policy didn’t address the question of how to distribute
    a fixed budget in a fair, nondiscriminatory manner.


    There are various ways to handle such a situation. One could opt for a completely
    random ride allocation strategy, which effectively ignores the goal of maximizing
    court appearances. This approach ensures equal chances of receiving government
    aid, regardless of race. Santa Clara County initially employed this randomization
    strategy until they got a clearer picture of who needed rides the most. With this
    knowledge in hand, they faced the complex task of balancing factors like residential
    locations or ride costs within their fixed budget constraints. Ultimately, the
    difficult policy decisions about resource allocation unveiled the interplay of
    social inequities, predictive models, and policy execution, highlighting the sophisticated
    ballet between these components.


    ***Tradeoffs, Goals, and Ethics***'
