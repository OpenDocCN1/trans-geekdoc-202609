    看到这种关注点的转变——从理解“为什么”到预测“是什么”——揭示了机器学习的真正力量。当我们理解它的局限性时，就能更好地欣赏它能做什么，并更明智、更熟练地利用它的能力。


    ## 用音乐赋予机器学习生命


    让我们用一个全新的真实案例来为这个概念注入活力：Spotify，这是一款以智能音乐推荐而闻名的流行在线音乐流媒体服务。如果你熟悉 Spotify，它会生成个性化的播放歌列表，为听者提供他们可能喜欢的歌曲精选。想象一下，你问
    Spotify：“根据我的喜好，我会喜欢哪些歌曲？”在几秒钟内，你就会收到一个充满潜在新宠单的播放歌列表——这简直是机器学习魔力的视觉盛宴。现在，让我们揭开面纱，看看这一切是如何结合在一起的。


    Spotify 巨大的数据库包含数百万首歌曲，每首歌都有自己的一组特征，如流派、节奏、调性和歌词。它还会考虑你的个人收听历史和偏好。通过某种方式，所有这些数据都被转化为一个个性化的音乐选择——你的
    `Discover Weekly`（每周发现）。将原始信息转换为播放歌列表似乎可能令人困惑，你可能会想，如何创建规则来实现这一点。


    专业 DJ 和音乐策展人一直都在做这种音乐匹配，对吧？他们会考虑歌曲的各种特征，并创建出与听众口味产生共鸣的播放歌列表。你可能认为他们遵循着一套固定的规则——选择某个流派，匹配节奏，选择相同的调性，可能再点缀几首惊喜曲目以增加趣味性。听起来很简单，不是吗？遗憾的是，这远非易事。


    我们正在讨论的这个——将输入（歌曲特征和听者偏好）转换为输出（播放歌列表）的过程——并不是那么容易设计的。它就像一个神秘的谜题盒。破解这个盒子的秘密才是真正的挑战。


    ## 我们日常生活中的机器学习


    你会对我们遇到预测问题的频率之高而感到惊讶——它们是我们日常生活中不可或缺的一部分。让我们回到音乐推荐的例子。诚然，考虑听者偏好（输入）并生成个性化播放歌列表（输出）的概念似乎很直观。但在现实中，事实并非如此。引导这些预测的规则可能极其复杂，将它们编写成代码是一项具有挑战性的任务。这是我们在探索
    AI 和机器学习过程中遇到的一个共同主题。


    但也有一线希望。尽管有这些障碍，机器学习可以处理广泛的问题：预测某人的偏好运动计划、判断学生会通过还是不及某门课程，或预测时尚趋势的转变。机器学习可以处理一切。连接这些场景的共同点是，我们的目标是根据某些输入
    (`X`) 预测结果 (`Y`)，即使规则书仍然模糊。


    最棒的一点是，我们不需要自己设计这些规则。我们让数据完成繁重的工作，并为我们学习规则。如今我们被数据淹没。棘手之处在于，当写下这些规则变得实际（或不可能）时，如何利用这些数据来找到这些规则。


    在深入研究之前，理解这些数据是什么样的至关重要。对于 Spotify，我们检查了歌曲流派、听者习惯和节奏等方面，并尝试预测音乐偏好。但还有哪些历史数据是有益的？哪些衡量标准可能是有用的？我们在哪里可以找到这些数据？这些问题触及了预测问题中
    `X` 和 `Y` 的核心。


    机器学习问题的概念在这个阶段可能显得有些模糊。但信不信，你可能在日常生活中遇到过它。让我们回到 Spotify 的例子。想象一下，交给你所有这些数据并被指示进行预测。你可能可能部署的首要策略之一就是回归（regression）——这是一种可能已经熟悉的统计方法。


    回归最简单的形式意味着在图上的一簇数据点之间画一条线。这看起来可能不像高科技的机器学习，但它是该领域的基础元素之一，你会在任何机器学习教科书中找到它。这个工具允许我们根据线条所显示的趋势做出预测。例如，给定一个听者过去的播放歌列表，你可以使用回归线来猜测他们下一首喜爱的歌曲。


    虽然这听起来可能过于简单，但回归解决的基础问题与我们旨在通过机器学习解决的问题是相同的。这都关乎识别模式和做出准确的预测。这正说明机器学习渗透到了我们的生活中，无论我们是否意识到这一点。


    ## 机器学习背后的齿轮


    回归让我们窥见到机器学习是如何运作的。旅程始于你获取一些输入 (`X`s) 和输出 (`Y`s)。你使用回归，它画出一条线，或者正如我们所说的，建立起权重
    (`weights`)。这些权重是你做出未来预测的入场券。就像我们一直在谈论的盒子：数据从一侧进入，预测从另一侧出来。我们通常将这些预测称为 `Y-hats`，以便将其与真实数据点（即
    `Y`s）区分开来。


    这样来看，回归做的正是机器学习目标要做的：给我数据，我会交还给你这个可以做出预测的 `谜题盒`。


    有趣的是，这里有两个独立的算法在工作。如果 `algorithm`（算法）这个词听起来有点可怕，就把它看作一个技术术语，指的是一个接收输入并产生输出的程序。在这种情况下，我们有两个这样的程序在执行核心工作。


    第一个是回归算法本身。它是知道如何获取数据并将其转换为权重或系数的。第二个完全关于这些权重或系数。这个算法接收输入，将其乘以权重，并将它们全部相加，你就得到了预测。

