    在我们进入最后一个指导原则之前，让我们先停顿一下，回顾一下我们已经学过的策略。我们从关注任务的策略开始，指出了可以通过自动化或添加预测性元素来改进哪些任务。之后，我们查看了基于数据的策略，研究如何利用现有数据、整合来自不同来源的数据，甚至创建其他所需的基础设施——基本上是为我们的时代提供“**锄子和铲子**”（`picks
    and shovels`）。接着，我们转向了创新驱动的策略，研究人工智能和机器学习的现有用途，并思考如何借用并应用这些想法到新的语境中，或者剥离某些 AI
    用途的炒作，以寻找实际且可行的用途。


    现在，我们正转向最后一组策略，这些策略都关乎生产过程。这里的大问题是：我们如何才能让生产货物、提供服务和执行各项任务的方式变得更好、更高效？


    这个最后一个主题中的第一条黄金法则是让某物变得`smart`”的概念。想象一个智能闹钟，它能学习你的睡眠模式并据此调整唤来时间。但为什么这很有用呢？为了说明这一点，让我们仔细思考一个看似无关但富有见解的应用。


    如果你活跃在任何在线音乐社区，你很可能会看到很多人用错误的技巧弹奏吉他，这可能导致练习无效，或者更糟糕的是，导致重复性劳性损伤。专业的音乐老师理可以指导并纠正这些个人——但我们能让这个过程变得`smart`吗？


    我们如何在这种场景下应用我们“让某物变得智能”的黄金法则呢？我们如何能让吉他架或音乐练习变得智能？


    一个可能的答案是在吉他架上安装摄像头，以观察人们的手部位置并提供即时反馈。他们的和弦按得对吗？他们的拨弦技巧正确吗？他们正尝试弹哪首特定的歌？像 `RiffMaster`
    这样利用机器学习来实现这些目的的产品提供了一个令人鼓舞的解决方案。它识别你的三维手部动作，并在这种理解的基础上增加了价值的见解。


    通过这种方式，让某物变得智能不仅改进了过程，还确保了准确性和安全性，为这项古老的实践提供了新视角。人工智能和机器学习的出现，使我们能够以全新的光芒看待传统流程，揭示了无数创新和改进的机会。


    ## 将智能融入日常生活


    这条规则是开启想象力的绝佳方法。它的核心是抓住普通的物品或日常任务，并用一点 AI 为它们增色。让我们来看一些例子，来说明我在说什么。


    想一想门。当商场或电影院人满如患时，你经常会看到安保人员手动打开和关闭门——这通常是自动完成的。他们为什么要这样做？嗯，因为人类对人群流量变化的反应比自动化系统更快。他们可以管理从一个方向涌来的一群人而另一个方向没有，根据需要打开和关闭门。我们不能让安保人员一直做这件事，因为那样太贵了。但如果我们能让门拥有自己的思想呢？


    想象一下带有顶尖传感器和摄像头的门，它们比我们现在只能检测是否有人在那的基础传感器要好得多。这些`smart`门可以学习观察远处涌来的人群，并调整开关时间以减少拥堵。当然，安全在这里是至关重要的，任何疏忽都可能导致事故。但是，使用
    AI 让门更智能不是一个很酷的概念吗？很难相信 20 年后，我们仍在推着一扇贴着“拉”（`Pull`）标志的门。


    让我们换个思路，想想你每天使用的东西——你的鞋子。现在，你可能会质疑：“AI 到底如何融入到这种场景中？”嗯，人们对让我们的步行习惯变得智能的兴趣日益增长。通过
    AI，你的鞋子可以分析你的步态，以发现潜在足部问题的迹象或步态的变化。这听起来有点奇怪，但在这个领域投入了大量的资源。这种让某物变得智能的原则适用范围非常广。


    想象一把智能伞，它不仅在要下雨时提醒你，还能提供建议的预测。这种规则促使我们看到周围的`智能性`。拿一个常见的物品或日常任务，思考如何通过 AI 让它变得智能。你可以从中提取什么数据？你可以利用这些数据预测什么？通过提出这些问题并跳出框架思考，我们可以让世界变得更高效、更敏、智能。


    ## 寻找生产痛点


    ### 生产障碍的解决方案


    另一个关键领域是我们标记为`解决制造故障`的领域。核心在于识别和处理阻碍顺利生产的问题，这些问题正在消耗宝贵的资源。


    许多行业和制造单元都面临这类挑战。这可能是软件故障或设备故障。每当这些问题出现导致工作停滞时，财务损失可能是巨大的。这些意外可能会严重影响组织的底线。那么，人工智能和机器学习如何进入这种场景呢？归根结底是在问题发生之前进行预测的能力。


    以汽车行业为例。如果汽车生产线由于机器故障而停止，成本将是天文数字，不仅是在金钱方面，还考虑到生产延迟。目前，解决此问题的要策略是希望不出问题，在出现问题时管理机时间和维修费用，或者在每个生产周期后进行检查。虽然检查所有部件至关重要，但这是一个极其耗时且昂贵的程序。


    这就是人工智能和机器学习提供新方法的地方。这里的重点在于，你通常可以预测故障。在机器完全停止之前，它通常会表现出某些症状。如果我们监控这些迹象，就可以预测组件是否即将故障。


    这种方法通常被称为`预测性维护`（predictive maintenance）。我们不是由于问题立即关闭生产线，而是预测性维护使我们能够在需要维修之前进行预测。如果我们知道某个部件可能会在三天后故障，我们就有时间在空闲期安排维修或采购所需的替换零件。


