  trans: '

    为了这一目的采用人工智能和机器学习，意味着我们可以利用数据来发现可能预示设备即将发生故障的异常或特殊事件。通过检查这些模式，我们可以预测机器何时容易发生故障，并做出相应的准备。这种管理制造故障的主动方法将为各行业提供更高效、更具成本效益的解决方案，让他们在问题发生之前规避它们，并保持运行顺畅。


    ## 故障预测的多样应用


    识别故障早期迹象的概念可以显著提高效率。而且这不仅适用于机械。这种`预测性维护`的理念——在小问题演变成大问题之前及时干预——可以应用于广泛的领域，从维护员工生产力到确保软件安全。这种远见性可以允许我们在故障发生之前采取先发制人。


    想象一下你正在管理一个发电厂。你可能会将压力、湿度或用电量等传感器数据作为你预测模型中的 `X` 变量。如果这些数据开始表现异常，可能表明某个组件即将发生故障。因此，你可以主动进行维护、维修组件或将其更换为新部件。通过这种方式，你可以以最小的停机时间维持平顺运行。


    然而，这种策略不仅限于机械。它在人力资源等领域也可能证明异常有用。公司可以监控员工的绩效指标或反馈调查作为关键的 `X` 变量。通过分析这些指标的趋势，可能预测工作满意度的趋势，或预测公司是否即将面临大规模的人才流失。如果工作满意度下降，公司可以通过解决不满、修改其人力资源（HR）政策或改变工作文化来迅速采取行动。通过这种方式，可以避免损害员工士气并失去宝贵的人才。


    同样也适用于软件安全。通过检查系统日志中的模式，网络安全团队可能能够预测即将来临的网络攻击。如果他们预见了这一点，就可以通过修补漏洞、加固防火墙或增加监控来提前干预，防止泄露。


    在所有这些场景中，我们都在利用预测性分析来预测不利的结果，并根据我们所看到的实施预防措施。其中一个有趣的方面面是，如果我们的预防措施成功了，它就会改变我们模型正在预测的未来数据。例如，如果模型预测了安全泄露，而网络安全团队有效地进行了干预，泄露就不会发生。因此，模型的预测没有实现。这种数据的`污染`可能会增加训练未来机器学习模型的复杂性，因为我们的行动改变了预期的结果。


    这说明了设计能够考虑到此类干预并相应调整预测的人工智能和机器学习模型是多么重要。通过这样做，我们可以不断提高模型的精确性和有效性，使我们能够在许多领域领先于潜在问题。


    ## 运行中的预测模型


    预测模型（如我们讨论过的那些模型）可以成为游戏规则的改变者。尽管如此，它们也有自己的令人头的问题。但嘿，只要有正确的计划和行动，我们就能克服这些挑战，并获得真正有实效的模型。


    一个大障碍是需要随机控制或留存样本（holdout samples）。这是我们保留一部分数据，并且对这些数据的预测结果完全不采取任何行动。这为我们提供了一组干净的数据，其中我们预测的事情可以在我们不干预的情况下展开。这是观察我们的模型是否击中目标的好方法。但它也可能引发一些伦理困境，特别是在预测员工何时辞职或公司何时可能处于网络攻击边缘等领域。


    想象一下我们正在根据之前的系统弱点预测网络攻击。如果我们看到攻击即将到来，就可以加强安全措施来击退它。但随后就有了伦理问题：对于一组被预测为处于风险的系统样本，我们是否应该退后而不采取行动？


    预测模型也适用于诸如股票投资等工作，根据历史表现和市场趋势预测股票价值是否会暴跌。在这里，行动可能是卖出股票，甚至可能决定从根本不投资。再次，我们遇到了一个伦理问题：对于一组可能跳跌的股票，我们是否应该坐视不管而不采取行动？


    在所有这些情况下，我们都在尝试使用已有的数据来预测一个坏的结果（`problem`）。目标是通过特定行动来制止或改善坏结果。我们正看到大量的人工智能和机器学习系统被建立并用于这些目的。这是一项艰巨的任务，但老兄，它也非常有回报。


    需要记住的一点是，获得准确的预测至关重要，但我们还需要深思如何根据这些预测采取行动。我们必须考虑伦理问题，在保持数据清洁和需要时干预之间取得平衡，并根据我们看到的不断更新我们的模型。通过这样做，我们可以利用这些预测技术在各种情况下减少或避免坏结果的发生。

