  将 `GPT` 转换为像 `ChatGPT` 这样的对话式 AI 是通过微调实现的。在构建一个 AI 模型时，过程始于利用海量的互联网文本和我们拥有的强大计算能力，构建一个稳健的下一个词预测器（如
  `GPT`）。训练这些模型需要投入大量的资源和时间，像 `GPT` 这样的产品需要数年的计算工作和巨额资金。目前，只有少数机构有能力承担这项资源密型型任务，这导致了模型训练在某种程度上的集中。


  一旦 `GPT` 得到良好开发，下一步就是将其转化为更具专业性的形态，例如 `ChatGPT`。这里的秘诀在于针对你追求的目标精心设计一个特定任务的数据集。例如，如果你目标是创建一个机器人，你就会生成可能的机器人问题和答案，创建一个易于管理的数据集进行额外精炼。对于专业领域（如法律分析）的任务，基础
  `GPT` 模型可能并不够用。然而，通过精选的法律问题问答数据集，你可以对模型进行微调，以提升其在你所在领域的性能。


  这种微调过程涉及基于特定任务数据集对模型进行逐步精炼，在 `GPT` 坚实的基础上进行。该过程始于海量的互联网文本和原始的下一个词预测器。从这个庞大的主体中，提取出一个较小、更集中的数据集。然后将该数据集通过一个与初始训练算法相同的微调算法，得到一个专门针对当前任务精炼的模型。这种策略允许创建特定任务模型，与原始
  `GPT` 训练数据集相比，它们所需的数据少得多。


  在 `ChatGPT` 的情况下，使用了一个由交互式提示和回答组成的独特数据集。从 `GPT` 模型开始，模型经过几个阶段的微调，最终产生 `ChatGPT`。这一微调过程体现了从通用的预测性
  AI 模型转向更聚焦、更有效的对话式 AI 模型的微妙艺术。


  ## 精炼任务


  想象你拥有 `ChatGPT` 的访问权限，但你希望对其进行定制，以更好地适应你的独特需求。计划是什么？你可以向它提供额外数据，即你喜欢的类型的问题和答案，引导模型产生更符合你个人偏好的响应。但这并像初看起来听起来那么简单。基本上，你是在向原始的
  `GPT` 训练示例中投出几颗“变化球球”，随着你添加更多示例，模型开始越来越向你的目标结果对齐。这些额外数据轻微地将模型的注意力从仅仅猜测下一个词，引导到以更准确匹配你预期响应的方式进行猜测。


  现在，考虑到策备专业领域数据集所需的精力，为什么最初还要大费力地创建一个巨大的词汇预测器的巨型任务呢？原因在于用于预测下一个词的数据量极其巨大，其数量远大于为机器人等特定任务所能收集的数据。此外，创建基础模型并不是一项单人任务——已经有小组向这项工作投入资源。即使所有用于预测下一个词的数据并不都直接与你的特定任务相关，它们也奠定了坚实的基础。通过精通预测下一个词，模型学会了输出语法正确的文本，这种技能需要大量的时间和数据才能习得。这为你提供了一个踏脚石，你可以通过它引导模型完成你的特定任务。这里的关键结论是：一大堆某种相关性的数据，配合一小部分高质量、任务特定的数据，其效果往往比单独的一小部分高质量数据要好。这一原理支撑了诸如
  `Harvey`（`OpenAI` 的法律分析工具）以及流行的 `ChatGPT` 等应用——它们都利用了微调的力量。


  混合这两种不同类型的数据是一项关键的平衡艺术——它关如何在通用与特定之间找到平衡点。这让你能够创建一个动态的、精炼的智能，可以应对各种情况。广泛知识库与严密精选的特定集合相结合，驱动了
  `Harvey` 和 `ChatGPT` 等技术的发展，允许它们不断表现出色。正是这种扩张与特定的汇，赋予了这些工具令人惊叹的技能。这种平衡真正体现了 AI 令人兴奋的演变，将其从一个简单的文本预测器转变为见见对话的生成器。


  ## 在数字迷宫中寻找知识


  在当今复杂的数字格局中，我们经常发现自己处于一种奇特的左右为难地。我们沉浸在信息的海洋中，但在需要时尝试找到所需的确切片段，感觉就像大海捞针。这种状况凸显了一个共同的障碍——有效利用公司集体记忆的挑战。当这些模型吸收公司的通信内容时，它们基本上充当了一个活跃的、可搜索的档案。这可能导致花费大量时间重新发现解决方案，而信息往往会被遗忘。


  想象一个加入项目的新员工。她遇到了一个她认为以前遇到过的技术障碍。在通常情况下，她可能不得不翻阅一堆邮件线程或依赖同事。在海量文本上训练的语言模型可以产生针对用户查询的非常准确的响应。这允许她的
  AI 模型快速调出（比如）两年前关于相同技术问题的讨论。至关重要的是这些模型获取的是上下文，而不仅仅是关键词。它们可以提供比普通搜索工具更细致的响应，在提供精确答案的同时提供相关的对话。然而，部署这些模型带来了一些重要的考量。数据隐私和机密问题变得绝对至关重要。公司需要确保在对内部聊天进行模型训练之前，已经建立了强大的数据匿名化步骤和权限结构。


  使用语言模型提供了一种强大方法，可以解锁隐藏在公司内部通信中的信息。它将存档聊天转化为动态、可访问的知识库，有效地利用了公司的集体记忆。


  ## 关键结论


  • 生成式 AI 的魔力：像 `GPT` 这样的生成式 AI 模型通过预测序列中的下一个词来发挥魔法。这种技能是它们的秘诀，让它们能够创建连贯且有意义的文本。






  - **概率论是核心**：这些 AI 模型建立在概率论和机器学习的基础之上，而这些概念最初由克劳德·香农（Claude Shannon）提出。它们根据从海量训练数据中学到的概率来预测下一个单词。

  - **作为时间胶囊的语言模型**像像-3 这样的语言模型有点像是它们接受训练时互联网的浓缩时间胶囊。它们混合并整合现有数据，但并不会产生全新的信息。

  - **精炼之路**：从 GPT 这样通用的语言模型向 ChatGPT 这样更专业的模型演进的过程，是由一个被称为 `finetuning`（微调）的精炼过程引导的。这个过程使用特定任务的数据集对通用模型进行调整，以适应特定的用途。

  - **在通用数据与特定数据之间平衡**：`finetuning` 过程在大量部分相关的数据和少量高质量、任务特定的数据之间游走于微妙的平衡。这种平衡为可以适应不同场景的动态模型奠定了基础。

  - **解锁组织记忆**：语言模型可以通过学习公司的内部通信来挖掘公司的集体记忆，将其转化为一个活的、可访问的知识库。但这一策略的实施必须严格遵守数据隐私和保密标准。

  - **深入了解语言模型**：理解语言模型的工作原理让我们能够批判性地评估它们的优缺点。虽然它们在预测方面表现得惊人，但它们并不像人类那样真正地理解或认知事物。


  ## 利用 AI 识别机遇


  *提高企业效率将是未来一个巨大的机遇。*


  ### 目标视角


  #### 自动化


  #### 有一个良好的起点


  如果你是一个对行业内下一个大趋势始终充满好奇的人，你可能已经对真正的规则改变者 AI 所能做到的感到惊讶。显而易见，它在提高效率和将你的运营推向全新水平方面具有巨大潜力。但那个价值百万的问题是：你从哪里开始？你如何识别那些既准备好进行自动化，又处于
  AI 可以产生重大影响的目标？在本章中，我们将向你展示如何寻找这些黄金机会，指出那些迫切需要自动化的目标，并强调 AI 带来的巨大益处。


  让我们用一个例子来阐明这一点。想象音乐行业中的一个关键职位——星星挖掘（talent scout）。此人在唱片公司中扮演着至关重要的角色，负责发现和签约新艺人。他们需要筛选大量的演示带（demos）和现场表演视频，确保潜在艺人在获得唱片合同之前符合所有要求（tick
  all the boxes）。想象一下那堆演示带和演出录音，都在等待我们星星挖掘人的赞同。


  这里有一个魔力语句——“tick all the boxes”（符合所有要求）。这意味着什么？基本上，这些规则类似于拥有独特的风格或稳实的粉丝基础，它们决定了谁能获得唱片合同。现在，初看之下，你可能认为这项工作非常适合自动化。毕竟，这些规则看起来简单到完全可以转换为计算机程序。传统的编程方法通过列出这些规则，可以帮助判断潜在艺人是否符合所有要求。


  但有趣的地方在这里。有不同的方式来描述我们对这个系统的要求。一种方式可能是 `Y = 符合特定的人才需求`，传统编程可以很好地处理这种输出。然而，我们也可以描述为
  `Y = 星星挖掘人的签约决定`。这正是机器学习真正大显身手的地方。我们可以利用旧数据和星星挖掘人过去做出的决定来训练机器学习系统。为了让它更令人印象，我们可以将
  `Y` 定义为`艺人的歌曲变成了热门歌曲`——这正是机器学习擅长的任务类型。


  现在，让我们花一点考虑最后两种场景之间的细微差别。为了理解这一点，我们需要重新回顾之前关于预测和自动化的讨论。在预测中，情况决定了结果，例如一首歌是否会变成热门。结果是一个随时间推移而未来事件。相比之下，自动化允许我们这些人类操作员根据我们目前掌握的信息来控制结果。例如，星星挖掘人在仔细评估了艺人的潜力后决定签约。


  那么，什么种任务已经成熟到可以自动化了？它们通常涉及一个重复的过程，你通过查看一个 `X`（如演示带）来做出一个 `Y` 决定（如唱片合同）。理想情况下，这些任务应该有大量数据，自动化它们将带来真正的益处，例如节省时间或释放资源。例如，自动化星星挖掘人的工作可以释放出可以在其他地方得到更好利用的资源。


  要点是，`X`可以是任何东西，只要它是清晰定义且可衡量的。我们可以围绕它构建一个数据集，或者使用音频或视频等标准的数字格式。`Y` 的关键在于它是一种人类判断，就像星星挖掘人签约艺人的决定一样。症结在于，这种判断应该完全基于
  `X`，即输入数据。如果它取决于未包含在 `X` 中的额外信息，那么任务的那个部分可能自动化，因为我们无法访问这些外部数据。


  这不仅关乎星星挖掘；它关乎在你的运营中识别任何潜在的自动化领域。通过这种视角审视角色，你可以识别出 AI 可以产生巨大差异的目标，以及你的运营可以获得重大益处的地方。有了这种心态，你已经完全准备好启动
  AI 项目，激发团队内部的变革并颠覆你的行业。


  #### 指路之光


  当你准备好投入自动化大戏时，拥有一些帮助你判断哪些任务适合自动化的指南将非常有用。几年前，有一个非常不错的经验法则：如果一个普通人可以在一秒钟内完成一项任务，那么这项任务就准备好自动化了。虽然这个规则听起来很有用，但它并不是一成不变的。有很多耗时超过一秒的任务，其某些部分可以很好地自动化。让我们以放射科为例——这是一个人类参与通常需要超过一秒的领域，但某些工作可以很好地自动化。


  相反，一些耗时不到一秒的任务可能出奇地难以自动化。幽默就是这个问题的完美例子。对于我们人类来说，这可能是显而易见的，但自动化幽默是一个巨大的挑战。它需要对语境、文化差异甚至现实正在发生的事情有深度理解。幽默是一种复杂的人类体验，与我们对世界的个人和文化理解密切相连，使其成为自动化攻克的难题。


  但重要的是，AI 世界并不是静止的——它在不断变化。随着先进大语言模型的兴起，我们理解世界的优势正在被逐渐侵蚀。这些模型吞噬了互联网的大部分，现在拥有大量的上下文，使得自动化复杂功能变得不再那么可怕。


  主要原理是，对于一项任务准备好自动化，`X` 与 `Y` 之间的关系必须满足三个标准：稳定性、通用性和自包含性。这种关系需要是稳定的，意味着它不会随时间推移而发生剧变。这种稳定性允许了预测性。这种关系还应该是足够通用的，以便不同的人在不同情况下得出大致相同的结果。





  最后，任务必须是自成一体的。这意味着完成该任务所需的所有信息都包含在 `X` 中，而不需要依赖我们无法输入机器的外部信息。换句话说，任务可以完全根据现有的输入数据完成，而不需要范围之外的额外数据或背景。如果一个任务符合这些标准，它更有可能适用于成功的自动化。


  ## 自动化的两种类型


  我们需要区分两种适用于自动化的主要目标类型。每种目标都有独特的特征和潜力。理解它们之间的差异是识别贵组织内部成功自动化机会的关键。


  我们讨论的第一类目标涉及复制人类已经在做的工作。我们之前谈过的人才猎寻例子就是这一类别的绝佳范例。第二类目标则更具想象力——它提出了一个问题：如果我们愿意为之足够的报酬，人类会去做哪些任务？这要求我们跳出当前的角色，思考可能被自动化的潜在任务。


  例如，分析人类手写体并将其转换为字体的 AI 应用。虽然对于熟练的人类排字员来说，做到这一点在技术上是可行的，但支付数百美元让排字员将某人的手写体转变为一种独特的字体，在经济上是不划算的。但是，如果我们计划使用这些字体来训练机器学习系统，那么支付排字员创建大量此类字体可能是一项明智的投资，因为该系统可以以极低的成本（甚至免费）生成类似的字体。


  这个例子说明了一个核心观点：在考虑自动化任务时，我们不应将自己局限于于目前正在执行的任务。经济限制可能会防止人类执行某些任务，但 AI 自动化可以显著降低成本，使这些任务变得可行。


  属于这一类别的任务有不胜完例。排字员在技术上可以做到在线字体生成器做的事情，但这可能不值得他们花费时间。然而，我们可以支付排字员创建一个字体数据库，用它来训练
  AI 模型。考虑一下像在超市收结账时扫描条码这种普通琐事——虽然没有人会雇人手动输入每个物品的详情，但如果我们能收集到足够的条码读取训练示例，就可以训练 AI
  系统来轻松地管理这项任务。


  另一个例子可能是一种系统，它可以安排你的机器人扫地器，在你预计不在家时清洁房屋。雇佣人盯着你的日程并据此操作吸尘器并不符合成本效益，但自动化这项任务可能是实用且省钱的。


  这引出了关于自动化的第二个大启示：我们需要看向目前正在执行的任务之外。思考那些人类技术上可以做但没有做的任务，这通常是因为经济限制或其他后勤挑战。自动化具有潜力让这些任务在经济上可行，为提高效率和创新铺平道路。


  ## 自动化的潜力


  在通往完全自动化的道路上，一个担忧经常浮现：这会取代人的工作吗？这种担心让研究领域的人深入哪些工作更有或更不可能受到自动化的影响。有一种流行的观点认为，自动化主要影响从事低薪工作的人。为了验证这一点，研究人员在一条轴上绘制了工资，在另一轴上绘制了工作与机器学习的匹配程度，得分越高表示自动化的可能性越大。结果显示，薪资水平与工作被自动化的可能性之间没有强联系。在所有工资水平上都能找到适用于自动化的工作，这表明自动化可能会影响广泛的工作，而不仅仅是低薪工作。


  尽管大多数人所想的，但结果表明，定义工作与机器学习匹配程度的并不是薪资水平。而且，有趣的是，高薪工作者可能有更多需要担心的。这是因为自动化这些高薪工作可以带来更大的投资回报，从而加速这些角色的自动化进程。当你观察具体的工作时，很明显，某些工作尚未准备好进行自动化（如按摩师、兽医和考古学家），而另一些则更成熟（如门宾、机械制图员，甚至是葬礼服务师）。葬礼师的工作是一个迷人的例子，因为他们在自动化列表上排名靠前，主要是因为涉及文书工作，而这些是可以被自动化的。


  当你把工作看作一个单一、静态的整体时，很容易被误导。同一份工作的不同部分对自动化的准备程度可能高低不同。律师的工作提供了一个有趣的例子。虽然律师工作的某些部分是复杂且难以自动化的，但他们很大一部分工作是重复性的，可能已经准备好自动化。例如，取证过程（discovery
  process）涉及处理大量数据以寻找相关信息，这是一项艰巨、重复的工作，占了诉讼成本的 20% 到 25%。律师工作的这部分似乎已经准备好自动化，事实上，已经有公司在创建软件来使取证过程更高效。


  这带给了我们关于自动化的第三个大教训；我们需要停止考虑自动化整个工作，而开始关注自动化工作中的特定任务。大多数工作对于单一机器学习系统来说太复杂，无法完全自动化。然而，通过识别并自动化工作中的单个任务，我们可以看到生产力的巨大提升和成本节省。


  因此，我们寻找 AI 机会的第一条准则是就是关注可以自动化的任务。这些任务可以是人们目前正在执行的任务，也可以是他们可能执行的任务。你的目标是思考一个你认为与机器学习非常匹配的任务或某项工作。它可能是医疗保健的一项任务，可能是律师工作的一部分，或者是完全不同的内容。





  气象学家们承担着一项艰巨的工作，即决定天气将会如何。会下雨吗？会有风暴吗？天气会有多热？他们的决策依赖于大量的变量，如温度、`humidity`、`wind speed`
  等。所以基本上，他们需要预测两件事：天气将如何（天气预报）以及它将如何影响日常生活（影响预测）。


  在我们深入探讨预测之前，让我们想象一下如何实现这一过程自动化。我们可以使用历史天气数据、当前大气状况和其他相关细节作为输入。输出即我们的目标 `Y`，将是气象学家的决策——预测下雨还是晴天。这种自动化模型的训练数据是过去的天气记录。


  但是，问题在于，这种自动化方法听起来很简单，但实际上充满了重重。天气预报取决于许多因素，这使得数据对于自动化系统来说变得不可预测且混乱。当事物保持稳定且可预测时，自动化是非常棒的，但这里的情况并非如此。此外，偏见会让这些预测变得更加复杂。即使是最好的气象学家也会受到各种因素的影响，从过去的经验到直觉。对天气预报的伦理担忧为使用自动化增加了了更多不确定性。


  鉴于这些挑战，自动化可能不是天气预报的最佳选择。因此，我们将重点转向预测。我们保持相同的输入变量不变，但将输出改为对天气状况及其潜在影响的预测。训练数据来自历史天气记录。这种向预测的转变为利用技术改进复杂的天气预报领域提供了一个很有前景的替代方案。


  但是，与自动化一样，这条道路并非一风顺。一个大问题是所谓的单方面或选择性标签问题。这意味着数据中存在内在偏见，因为只对以前出现过的天气条件观察结果。这意味着我们的训练数据是一个有偏的样本，这对于创建成功的预测模型来说是一个巨大的挑战。


  # 处理 AI 应用中的预测挑战


  现在我们已经为预测挑战做好了准备，让我们深入探讨在选择预测而非自动化时会出现的一些障碍。记住，如果我们选择自动化，我们只需要跟踪每位气象学家的天气预报即可。但通过预测，我们并不总是能看到实际的天气事件，因为它取决于气象学家的预报。所以，虽然预测具有巨大潜力，但它带来了一个我们在自动化中不会遇到的独特阻碍。


  当我们深陷预测任务时，经常会遇到一种常见的情况：有人根据某些因素不断猜测一个结果。困难之处在于弄清楚此人是如何做出猜测的。将此转化为自动化任务似乎是合逻辑的，因为我们可以看到猜测过程，这个过程看起来是可以自动化的。但当我们拥有坚实的数据时——不仅是关于因素和猜测的数据，还有关于实际结果的数据——就会切换到预测任务。


  如果一位气象学家正在猜测下雨的概率，我们可能希望将这个猜测过程自动化。但如果我们有关于实际雨日的坚实数据，我们就可以跳过对气象学家的猜测进行自动化，转而预测实际天气。这种从标签是对结果进行猜测的自动化任务，到拥有关于结果本身数据的预测任务的切换，是我们我们处理问题方式的一种重大转变。


  我们已经看到这种切换在许多情况下发挥了奇效。在天气预报中，我们预测降雨、晴天或降雪的结果。在农业中，我们经常利用收成数据、灌溉模式或虫害情况来预测作物产量。对于学校停课，预测任务可以是估计天气必须达到何种程度才会导致关课。


  但这些预测任务并非没有我们提到的选择性标签问题。例如，我们看到了采取某些灌溉模式的农场的作物产量数据，但没有看到未采取这些模式农场的数据。这个问题经常出现在预测任务中，因为虽然我们可以获得各种猜测的数据，但实际结果数据通常取决于最初的猜测。这一问题往往在我们从自动化问题切换到预测问题时出现。


  预测任务也出现在其他领域，例如预测自然灾害的预测（即我们预测确认的地震活动或飓风路径），或预测能源消耗（即我们预测用量高峰）。这些情况通常也会遇到选择性标签问题。因此，在决定是否使用预测作为工具来解决你的问题时，意识到这些挑战是关重要的。


  # 预测作为决策的伙伴


  当我们开始在现实生活中更多地关注预测而非自动化时，我们看到了一种整齐的模式。与旨在接管的自动化不同，预测通常被视为决策中的一个加分项，特别是在刑事司法等复杂系统中。法官经常将关于被告未出庭或再次犯罪的预测作为其判决的关键部分。


  预测工具的设计至关重要，并能真正影响它们运行得否。这不仅涉及获取用于预测的高质量数据，还需要以能够帮助人们的方式展示这些预测。它们引导用户理解预测的风险并比较不同的概率。





  公司在日常运营中会收集大量数据，尤其是在如今大多数交易都在网上完成的数字时代。通常，这些数据并没有被挖掘出最大潜力，因为它们的真实价值被隐藏了。


  以流媒体服务 `Netflix` 为例。他们拥有海量数据，这包括关于哪些节目正成为趋势、或者哪些节目在季中被弃弃的信息。这类数据的价值是显而易见的，因为它们可以用来预测观看趋势，或出售给广告商以获利。但
  `Netflix` 还能获取一些不那么明显的数据。通过简单监控不同节目的播放速度，`Netflix` 就可以收集有关不同地区互联网速度的重要信息，这对于互联网服务提供商来说非常有价值的信息。这里的核心观点是，即使在收集数据上付出微小的努力，也能解锁巨大的额外价值。


  你已经拥有的数据可能是一个等待发现的金矿。例如，收集详细的观看数据对某些组织来说可能昂贵甚至非法，但像 `Netflix` 这样的公司可以轻松地从现有资源中获取。对于一家公司来说，监控跨城市的互联网速度可能并不划算，但对于服务依赖这些速度的
  `Netflix` 来说，这是一个额外的福利。


  只要你的职位允许你在日常运营期间收集有价值的数据，这些未开发的机遇就会存在。对于其他人来说，收集这些数据的成本可能太高了。秘诀在于识别这些额外的福利并利用它们转化为你的优势。


  再以 `Strava` 为另一个例子。作为一个提供跑步、骑行和锻炼跟踪的在线健身平台，他们获取了大量的健身数据，这些数据可以提供关于人们锻炼方式的洞察。但他们收集的不只是健身数据。他们可能还在收集有关用户位置、偏好锻炼时间，甚至是他们在平台上与其他互动频率的有用信息。这些次要数据可能极其价值，而且它们是作为主要业务运营的一部分被自然收集的。


  所以，我们以数据为中心的冒险的第一步是意识到并利用我们已经收集的数据隐藏潜力。你现有数据中未被开发的价值可能会让你惊讶，而发现它可能会为你的业务开启增长和机会的新纪元。


  ## 利用数据实现超出初衷的目标


  `Starbucks` 为我们提供了这种方法的极佳例证。他们巧妙地将客户订单数据重新转化为用于预测的价值工具。


  秘诀往往不仅在于使用现有数据，而在于微妙地调整你的产品或服务，以收集你感兴趣的特定数据。在线流媒体行业就是一个绝佳的例子。流媒体平台坐拥一个数据宝库：经常被一起观看的节目模式、某些类型受欢迎的趋势，甚至是像病毒式挑战这样的在线趋势的迹象。


  但流媒体平台是如何如此大幅提升其数据价值的？答案简单得惊人：他们引入了用户配置（user profiles）。在过去每个人都共享同一个个人资料时，数据受限于混合的、集体观看习惯。随着用户配置的出现，平台能够将跨时间的观看行为关联起来，有效地跟踪单个观众的观看历程。这一微小的调整显著提升了他们数据的价值。


  这种通过微调来增加数据收集的策略也出现在产品设计和隐私决策中。产品的设计往往不仅是为了提供其主功能，还为了在这个过程中收集有价值的数据。秘诀是找到调整你的产品或服务的机会，以改进你所收集的数据。


  不，这展示了现有数据如何被重新用于其他领域以产生巨大的收入。


  数字世界充满了这类例子。`Spotify` 使用听歌数据进行广告投放，`Uber` 使用行车数据进行城市规划建议，`Duolingo` 使用语言学习数据来改进翻译的机器学习模型，而在线教育平台则可能使用课程完成数据来推广相关的未来课程。这里的共同主题是：一个最初为某个目的设计的系统，但对于该系统，收集到的额外数据可以用于其他事情。


  然而，谨慎走这条道路至关重要，始终意识到隐私法规和其他限制。挑战不仅在于收集数据，而在于如何创造性且负责任地使用数据来指导产品决策。这可能涉及出售数据，或使用这些数据来改进你自己的产品或服务——例如根据听歌习惯优化广告投放。


  现在的任务是仔细检查你的数据收集实践，并弄清楚如何从现有数据中获利。挖掘这些隐藏的宝藏可能会解锁你从未发现过的潜力，为增长和创新的新机会铺平道路。


  ## 整合数据获取更深层的洞察


  ### 通过桥接数据提升价值


  当我们超越单独查看每个数据集的想法时，数据的力量会产生巨大的增长。通常，当我们把来自不同地方的数据集一起时，真正的魔力出现了。这种方法可以创造出比其各个部分总和价值得多的东西。然而，这个过程带有其独特的挑战，特别是当涉及到整合不同结构、法律影响和财务后果的数据集时。


  让我们破解一个在合并数据集过程中经常出现的常见问题。假设你有两个数据集 `A` 和 `B`，它们来自两个不同的地方，你想将它们合并。你可能会遇到的问题之一是缺乏共同标识符。例如，基于
  `username` 和 `e-mail` 合并两个数据集可能不足以创建一个唯一标识符。尽管有这些可能的障碍，克服它们也可以解锁巨大的价值。


  以预测电影票房的成功挑战为例。这是一个高风险问题，因为一旦识别出具有大火潜力的电影，就可以制定有效的营销策略。这个问题的解决方案可以在各种地方的数据库中找到。像
  `IMDb` 和 `Rotten Tomatoes` 这样的电影评论网站拥有大量关于电影评分的信息。然而，热门电影的实际票房数字是由电影制厂自己掌握的。


  现在，想象一种情况，我们可以将这些数据集——电影厂的票房数据 `B` 和 `IMDb` 的评分数据 `A`——结合起来，以预测电影大热的可能性并计划智能营销活动。`IMDb`
  通过与几家电影制厂建立数据联盟，将其数据与工厂的票房记录合并，从而将这一想法变成了现实，并发现了洞察。


  ### 思考数据集的融合


  当我们考虑合并数据集时，会出现几个关键问题。首先，任务有多困难？该过程中是否涉及财务影响、法律障碍或实际困难？其次，价值主张是什么？一旦数据集放在一起，结果领域将会是怎样的，这有多大益处？





  这种成功数据组合的完美案例可以在`消费者行为画像`这一概念中看到。这涉及到将来自亚马逊等电商平台的数据与来自谷歌等公司的浏览历史相结合。结果是什么？更增强的客户偏好画像，帮助企业量身定制产品，从而提高客户满意度并提升销量。


  从本质上说，合并数据的行为可以挖掘出巨大的价值。尽管可能会出现法律、财务和运营方面的障碍，但潜在的回报往往超过这些挑战。因此，如果你是数据集的持有者，寻找拥有可以增强你现有数据的潜在伙伴可能是非常有价值的。这种互的合并可能会让你预测出以前难以捉摸的结果，从而从这一过程中提取巨大价值，并揭示通往新洞察和机会的路径。


  # 销售基础设施


  ## 提供工具


  我们探索的第三大支柱围绕着`为寻宝猎者提供工具`的理念。这一概念呼应了 19 世纪的淘金热时代。在疯狂的淘金热中，人们对金属探测器和淘金盘等设备有着巨大的需求。并不是每个人都有意愿或能力制造自己的工具，因此他们选择购买。如果我们将这一概念与人工智能和机器学习领域联系起来，它就演变为提供那些赋能企业探索并从数据中提取价值的“黄金仪器”。


  考虑一家当地咖啡店连锁 `Daily Brew` 以及他们对提供什么咖啡混合的决策。在他们的西雅图分店，你可能会发现深色烘焙的选择比其在迈阿密分店流行的浅色烘焙要多。这种库存决策需要关于不同地区客户偏好的持续数据流，不仅来自他们自己的门店，还来自竞争品牌。


  然而，这个数据宝库对 `Daily Brew` 来说可能是一个挑战。这正是 `MarketLens` 等公司大显身场的地方。他们是现代设备供应商，提供分析服务，收集全国范围内公司销售的各种咖啡混合及相关产品信息。他们整合这些数据并提供给企业。这项无价的服务使企业能够就提供什么咖啡混合做出数据驱动的决策。


  这里的关键洞察围绕成本套利。对于一家公司来说，收集所有数据可能是昂贵的，但如果一个机构收集所有数据并将其分配给许多人，它就会变成宝库。在这种情况下，`MarketLens`
  了`为寻宝猎者提供工具`的策略。


  各行业的公司都在利用这一机会。例如，考虑 `PhysioNet`，一个致力于保留生理数据集的平台。他们通过向感兴趣的方出售这些数据来产生收入。然后是 `PropertyRadar`，收集与房地产市场相关的数据并卖给最高出价者。对于单一物业管理公司来说，独立收集数据的成本可能难以合理。然而，从像
  `Property-Radar` 这样的第三方采购可能是一项战略性举措。


  所以，密切关注那些数据需求分布在许多人中，但个人收集成本可能高到无法接受的机会。这可能是你介入并提供这些必要的`寻宝工具`的黄金良机，使企业能够在它们充满数据的矿藏中大获丰收。


  ## 李维·斯特劳斯 (Levi Strauss)


  在加州淘金热的疯狂时期，一位名叫李维·斯特劳斯（Levi Strauss）的精明商人决定在快速增长的旧金山市碰碰运气。他开办了一家杂货店，为那些被黄金承诺所吸引而涌入的人提供服务。但对斯特劳斯来说，仅仅顺应已经发生的事情是不够的。他密切关注新邻居们的独特需求，特别是那些工作到手指骨断的矿工。


  发现他们对耐磨衣物的极度需求后，斯特劳斯与高技能裁缝雅各布·戴维斯（Jacob Davis）合作，在工作装设计上提出了一种改变规则的解决方案。1873 年，他们申请了他们的结晶：用实心铜钉加固的工作裤，即我们现在所知的蓝色牛仔裤。这些坚固如铁的长裤发布，带有加固的口袋和耐用的铆钉，为厌倦了工作服破损的矿工和工人提供了一个革命性的选择。


  李维·斯特劳斯的酷牛仔裤的消息像野火一样在矿区蔓延，跨越国界到达各行业的工人手中。每个人都对这些创新的裤子赞赞不已，赞扬它们无与伦比的舒适度和持久的耐用性。需求飙升，使其受欢迎程度远超斯特劳斯最初的旧金山矿工客户群。


  这种需求的激增标志着标志性 Levi''s 牛牛仔品牌的诞生，一个简单的想法成长成了一场全球性现象。今天，它是美国文化的永恒象征。它在淘金热中的根提醒着人们：仔细观察、针对性创新以及挖掘现有资源隐藏潜力的力量。无论你是在挖掘黄金还是挖掘数据，这个历史故事都强调了量身定制业务策略以满足特定群体未被满足需求的重要性。通过这种方式，你可以创造持久的价值，并留下受得起时间考验的遗产。


  ## 富国银行 (Wells Fargo)


  回到 19 世纪中叶，在淘金热期间，两个名叫亨利·韦尔斯（Henry Wells）和威廉·福特（William Fargo）的聪明人发现了一个其他人在疯狂抢夺黄金时忽视的需求。他们看到，由淘金热引发的加州繁荣社区正迫切需要安全的运输和金融服务，而这些在当时是无法提供的。


  1852 年，他们决定通过建立 `Wells Fargo & Company` 来利用这一机会。他们的目标是填补市场上的这一巨大空白，并为繁荣的社区提供急需的服务。起初，公司专注于快递，但他们迅速成为需要移动贵重物品的个人和企业的首选。富国银行是矿工们将珍贵金粉寄回家中或银行的安全可靠途径。


  富国银行的业务依赖于广泛的马车路线、战略性部署在关键位置的快递办事处，以及矿工们可以信任其辛苦换来的黄金是安全的极其安全的库。在一个充满不可预测和风险承担的时代，富国银行提供的可靠性和安全性就像一种令人安心的存在——在那样不稳定的时期，这种东西价值堪比金子。


  随着公司建立起声誉并赢得其所服务社区的信任，富国银行开始扩大其服务范围。他们在服务中增加了银行设施、汇款服务，甚至还有电报通信。他们在做所有这一切时，始终关注安全、可靠和高效运营——这些点真正引起了他们的客户的共鸣。


  在整个淘金热及以后，富国银行的增长在促进贸易和商业方面发挥了关键作用。该公司抓住了了淘金热带来的机会，但并不是通过加入混乱的黄金争夺。相反，他们专注于解决由此产生的需求。富国银行的这个故事是一个关于发现市场空白、抓住空白，并不断创新以满足客户不断变化需求的有力教训。


  # 新淘金热中的英伟达





  在当今快速发展的科技世界中，我们正目睹一场新的金淘潮——这种热潮是由能够创造新事物的 AI（生成式 AI）无限可能所驱动的。正如加州淘金热中的矿工需要正确的装备来寻找黄金一样，今天的
  AI 探索者也需要正确的工具和配置来解锁生成式 AI 可以实现的所有酷炫功能。作为尖端技术的领先公司，Nvidia 看出了这种增长的需求，并聪明地将自己定位为
  AI 金淘潮中必备“镐子和铲子”的供应者。


  就像利维·斯特劳斯（Levi Strauss）和富国银行（Wells Fargo）这样的人通过向矿工提供急需工具巧妙地从淘金热中获利，Nvidia 在数字时代也做了同样的事情。他们并没有仅仅浅尝旁观，而是抓住机会，成为支持不断发展的
  AI 研究人员、开发者和粉丝社区的关键力量。


  Nvidia 为这些 AI 从业者提供了基本的硬件和软件工具，使自己成为 AI 生态系统中不可或缺的一部分。但他们并未止步于提供硬件。他们知道，不断发展的 AI
  领域伴随着自己一系列棘手的挑战。因此，Nvidia 还提供了软件开发包以及如 `CUDA` 这样的并行计算平台，这使得为其 GPU 进行 AI 任务编程变得简单得多。


  Nvidia 的明智定位展示了理解新行业运作方式以及它们带来的特定需求有多么重要。通过为 AI 爱好者提供他们所需的工具和技术，Nvidia 不仅仅是一个供应商；它成为了探索生成式
  AI 突破性进展的关键伙伴。基本上，Nvidia 是一家公司的优秀典范：它理解向他人提供解锁新前沿潜力所需工具的价值——就像淘金热期间提供镐子和铲子的人们一样。他们的方法表明，当你发现并满足新兴行业的关键需求时，会获得多么丰的回报。


  ## 创新的视角


  ### 向他人学习


  #### 从成功案例中获取灵感


  从我们之前关于任务和数据的讨论转过来，现在我们将关注更有趣的内容：创新本身。这里可能会出现这个问题：人们在现实世界是如何应用机器学习的？我们可以从哪些成功案例中学习？我们又如何利用这些策略来开辟属于自己的道路？


  借用想法并没有错，特别是在涉及 AI 的时候。考虑正在进行的科技与心脏病学的交叉研究。这里的目标是使用机器学习来读取心电图（ECG）和超声图像，这可能会带来积极向良的变革。虽然进行这类研究对我们来说似乎遥不可及，但重点是
  AI 正在变得越来越擅长识别图像。


  这个想法始于大规模图像识别竞赛。大约在 2015 年，机器学习在这项任务上开始击胜人类。这种技能提升带来的可能用途非常令人兴奋。考虑纺织厂，目前正由工人检查布料的缺陷。为什么不使用机器学习来发现问题，并将这项工作自动化呢？


  或者让我们考虑农业行业。鉴于机器能像人类一样看东西，我们如何将其应用于农业中呢？变革的机会是巨大的，每一次实现都会经过微调，以满足特定行业的独特需求和挑战。


  从这些例子中学习到的关键点是，机器正越来越擅长处理复杂的任务，而直到最近，这些任务主要由人类完成。我们的工作——也是我们的机会——是找到这些进步能够产生最大益处的新用途。


  最近在语言处理领域有一项非常酷的发展。机器在理解和处理语言方面变得越来越好。我们在每天聊天和邮件中使用的预测文本和自动回复中都能看到这一点。大问题是，我们如何以新的方式利用这种日益增长的能力？


  回顾过去的成功可以向我们展示这些新能力的潜力。通过有意识地采用这种以创新为中心的思维方式，我们可以发现以新颖且令人兴奋的方式使用这些技术的机会。这就是 AI 创新中“借用”的意义所在。记住这一点，让我们继续探索，并进入下一个规则。


  ### 揭秘价值


  #### 在炒作中航行以创造现实价值


  在 AI 快速且不断演变的世界中，区分炒作和真正的机会至关重要。在本节中，我们将看到如何关注 AI 的实用方面，并过滤掉那些经常伴随夸大其词的噪音。


  有时，未来承诺的吸引力可能会让我们低估眼前事物的力量和潜力。例如考虑围绕全自动无人机的持续炒作。我们不断被告知它们近咫尺。但虽然这些宏大愿景尚未完全实现，但更务实的观点促使我们思考：我们如何创建一个今天就能运行且方便的简单版本呢？


  我们对自动无人机的想法确实很宏大，但实际的障碍——从社会、技术到法律——是巨大的。在我们等待时，可以构思并实现哪些这种技术的简化版本呢？


  一个巧妙的例子是使用小型自动无人机在图书馆内递送书籍。这在相对受控的环境中应用机器学习，那里的速度较低，导航的不可预测性也较小。初始计划在该领域显示了良好的成果。


  转向仓库管理，自动化技术可以帮助箱子从仓库的一个部分移动到另一个部分。它可能不是在开放空中飞行，但在受控环境中，它是机器学习的理想用途。任务是特定的：移动货物，而不是飞越整个城市。


  或者考虑自动割草机，这是一种自主园艺工具。它在规划路线和在花园周围导航时执行的任务，与我们对自动无人机的要求有些相似，只是在更小、更易管理的规模上。


  这些简单的用途可能缺乏其完全体对应品的华丽感或刺激感，但它们仍然充满了价值。很酷的一点是，不需要你处于技术的最前沿。相反，你只需采取当前创新中最雄心的版本，并构思出一个更可行的简化版本。


  最近的一个例子是对 AI 聊天机器人的炒作。全自动对话 AI 的概念确实迷人，但真正的价值在于更适宜的用途。AI 客户助手就是一个很好的例子。它可能无法取代人类客服人员，但它可以帮助回答常见问题并引导用户访问网站。或者考虑一个发送自动提醒邮件的模型——它可能不是能够进行完全人类化对话的聊天机器人，但它非常方便并提供了价值的帮助。


  揭秘价值方法的核心思想非常简单：识别被过度炒化的潜在未来用途，并开发出一个更简单、更实用、现在就能提供真实价值的版本。它可能不会获得同样的头条，但在我们等待更大的梦想实现时，它是创造有价值解决方案的可靠方法。


  ## 产品的视角


  ### 让事物变得智能的魔法






  在我们进入最后一个指导原则之前，让我们先停顿一下，回顾一下我们已经学过的策略。我们从关注任务的策略开始，指出了可以通过自动化或添加预测性元素来改进哪些任务。之后，我们查看了基于数据的策略，研究如何利用现有数据、整合来自不同来源的数据，甚至创建其他所需的基础设施——基本上是为我们的时代提供“**锄子和铲子**”（`picks
  and shovels`）。接着，我们转向了创新驱动的策略，研究人工智能和机器学习的现有用途，并思考如何借用并应用这些想法到新的语境中，或者剥离某些 AI 用途的炒作，以寻找实际且可行的用途。


  现在，我们正转向最后一组策略，这些策略都关乎生产过程。这里的大问题是：我们如何才能让生产货物、提供服务和执行各项任务的方式变得更好、更高效？


  这个最后一个主题中的第一条黄金法则是让某物变得`smart`”的概念。想象一个智能闹钟，它能学习你的睡眠模式并据此调整唤来时间。但为什么这很有用呢？为了说明这一点，让我们仔细思考一个看似无关但富有见解的应用。


  如果你活跃在任何在线音乐社区，你很可能会看到很多人用错误的技巧弹奏吉他，这可能导致练习无效，或者更糟糕的是，导致重复性劳性损伤。专业的音乐老师理可以指导并纠正这些个人——但我们能让这个过程变得`smart`吗？


  我们如何在这种场景下应用我们“让某物变得智能”的黄金法则呢？我们如何能让吉他架或音乐练习变得智能？


  一个可能的答案是在吉他架上安装摄像头，以观察人们的手部位置并提供即时反馈。他们的和弦按得对吗？他们的拨弦技巧正确吗？他们正尝试弹哪首特定的歌？像 `RiffMaster`
  这样利用机器学习来实现这些目的的产品提供了一个令人鼓舞的解决方案。它识别你的三维手部动作，并在这种理解的基础上增加了价值的见解。


  通过这种方式，让某物变得智能不仅改进了过程，还确保了准确性和安全性，为这项古老的实践提供了新视角。人工智能和机器学习的出现，使我们能够以全新的光芒看待传统流程，揭示了无数创新和改进的机会。


  ## 将智能融入日常生活


  这条规则是开启想象力的绝佳方法。它的核心是抓住普通的物品或日常任务，并用一点 AI 为它们增色。让我们来看一些例子，来说明我在说什么。


  想一想门。当商场或电影院人满如患时，你经常会看到安保人员手动打开和关闭门——这通常是自动完成的。他们为什么要这样做？嗯，因为人类对人群流量变化的反应比自动化系统更快。他们可以管理从一个方向涌来的一群人而另一个方向没有，根据需要打开和关闭门。我们不能让安保人员一直做这件事，因为那样太贵了。但如果我们能让门拥有自己的思想呢？


  想象一下带有顶尖传感器和摄像头的门，它们比我们现在只能检测是否有人在那的基础传感器要好得多。这些`smart`门可以学习观察远处涌来的人群，并调整开关时间以减少拥堵。当然，安全在这里是至关重要的，任何疏忽都可能导致事故。但是，使用
  AI 让门更智能不是一个很酷的概念吗？很难相信 20 年后，我们仍在推着一扇贴着“拉”（`Pull`）标志的门。


  让我们换个思路，想想你每天使用的东西——你的鞋子。现在，你可能会质疑：“AI 到底如何融入到这种场景中？”嗯，人们对让我们的步行习惯变得智能的兴趣日益增长。通过
  AI，你的鞋子可以分析你的步态，以发现潜在足部问题的迹象或步态的变化。这听起来有点奇怪，但在这个领域投入了大量的资源。这种让某物变得智能的原则适用范围非常广。


  想象一把智能伞，它不仅在要下雨时提醒你，还能提供建议的预测。这种规则促使我们看到周围的`智能性`。拿一个常见的物品或日常任务，思考如何通过 AI 让它变得智能。你可以从中提取什么数据？你可以利用这些数据预测什么？通过提出这些问题并跳出框架思考，我们可以让世界变得更高效、更敏、智能。


  ## 寻找生产痛点


  ### 生产障碍的解决方案


  另一个关键领域是我们标记为`解决制造故障`的领域。核心在于识别和处理阻碍顺利生产的问题，这些问题正在消耗宝贵的资源。


  许多行业和制造单元都面临这类挑战。这可能是软件故障或设备故障。每当这些问题出现导致工作停滞时，财务损失可能是巨大的。这些意外可能会严重影响组织的底线。那么，人工智能和机器学习如何进入这种场景呢？归根结底是在问题发生之前进行预测的能力。


  以汽车行业为例。如果汽车生产线由于机器故障而停止，成本将是天文数字，不仅是在金钱方面，还考虑到生产延迟。目前，解决此问题的要策略是希望不出问题，在出现问题时管理机时间和维修费用，或者在每个生产周期后进行检查。虽然检查所有部件至关重要，但这是一个极其耗时且昂贵的程序。


  这就是人工智能和机器学习提供新方法的地方。这里的重点在于，你通常可以预测故障。在机器完全停止之前，它通常会表现出某些症状。如果我们监控这些迹象，就可以预测组件是否即将故障。


  这种方法通常被称为`预测性维护`（predictive maintenance）。我们不是由于问题立即关闭生产线，而是预测性维护使我们能够在需要维修之前进行预测。如果我们知道某个部件可能会在三天后故障，我们就有时间在空闲期安排维修或采购所需的替换零件。





  为了这一目的采用人工智能和机器学习，意味着我们可以利用数据来发现可能预示设备即将发生故障的异常或特殊事件。通过检查这些模式，我们可以预测机器何时容易发生故障，并做出相应的准备。这种管理制造故障的主动方法将为各行业提供更高效、更具成本效益的解决方案，让他们在问题发生之前规避它们，并保持运行顺畅。


  ## 故障预测的多样应用


  识别故障早期迹象的概念可以显著提高效率。而且这不仅适用于机械。这种`预测性维护`的理念——在小问题演变成大问题之前及时干预——可以应用于广泛的领域，从维护员工生产力到确保软件安全。这种远见性可以允许我们在故障发生之前采取先发制人。


  想象一下你正在管理一个发电厂。你可能会将压力、湿度或用电量等传感器数据作为你预测模型中的 `X` 变量。如果这些数据开始表现异常，可能表明某个组件即将发生故障。因此，你可以主动进行维护、维修组件或将其更换为新部件。通过这种方式，你可以以最小的停机时间维持平顺运行。


  然而，这种策略不仅限于机械。它在人力资源等领域也可能证明异常有用。公司可以监控员工的绩效指标或反馈调查作为关键的 `X` 变量。通过分析这些指标的趋势，可能预测工作满意度的趋势，或预测公司是否即将面临大规模的人才流失。如果工作满意度下降，公司可以通过解决不满、修改其人力资源（HR）政策或改变工作文化来迅速采取行动。通过这种方式，可以避免损害员工士气并失去宝贵的人才。


  同样也适用于软件安全。通过检查系统日志中的模式，网络安全团队可能能够预测即将来临的网络攻击。如果他们预见了这一点，就可以通过修补漏洞、加固防火墙或增加监控来提前干预，防止泄露。


  在所有这些场景中，我们都在利用预测性分析来预测不利的结果，并根据我们所看到的实施预防措施。其中一个有趣的方面面是，如果我们的预防措施成功了，它就会改变我们模型正在预测的未来数据。例如，如果模型预测了安全泄露，而网络安全团队有效地进行了干预，泄露就不会发生。因此，模型的预测没有实现。这种数据的`污染`可能会增加训练未来机器学习模型的复杂性，因为我们的行动改变了预期的结果。


  这说明了设计能够考虑到此类干预并相应调整预测的人工智能和机器学习模型是多么重要。通过这样做，我们可以不断提高模型的精确性和有效性，使我们能够在许多领域领先于潜在问题。


  ## 运行中的预测模型


  预测模型（如我们讨论过的那些模型）可以成为游戏规则的改变者。尽管如此，它们也有自己的令人头的问题。但嘿，只要有正确的计划和行动，我们就能克服这些挑战，并获得真正有实效的模型。


  一个大障碍是需要随机控制或留存样本（holdout samples）。这是我们保留一部分数据，并且对这些数据的预测结果完全不采取任何行动。这为我们提供了一组干净的数据，其中我们预测的事情可以在我们不干预的情况下展开。这是观察我们的模型是否击中目标的好方法。但它也可能引发一些伦理困境，特别是在预测员工何时辞职或公司何时可能处于网络攻击边缘等领域。


  想象一下我们正在根据之前的系统弱点预测网络攻击。如果我们看到攻击即将到来，就可以加强安全措施来击退它。但随后就有了伦理问题：对于一组被预测为处于风险的系统样本，我们是否应该退后而不采取行动？


  预测模型也适用于诸如股票投资等工作，根据历史表现和市场趋势预测股票价值是否会暴跌。在这里，行动可能是卖出股票，甚至可能决定从根本不投资。再次，我们遇到了一个伦理问题：对于一组可能跳跌的股票，我们是否应该坐视不管而不采取行动？


  在所有这些情况下，我们都在尝试使用已有的数据来预测一个坏的结果（`problem`）。目标是通过特定行动来制止或改善坏结果。我们正看到大量的人工智能和机器学习系统被建立并用于这些目的。这是一项艰巨的任务，但老兄，它也非常有回报。


  需要记住的一点是，获得准确的预测至关重要，但我们还需要深思如何根据这些预测采取行动。我们必须考虑伦理问题，在保持数据清洁和需要时干预之间取得平衡，并根据我们看到的不断更新我们的模型。通过这样做，我们可以利用这些预测技术在各种情况下减少或避免坏结果的发生。





  想象一下一家咖啡馆。标准的饮品制作流程可以满足多少比例的客户订单？鉴于咖啡馆通常有固定的菜单，而大多数客户都会根据菜单点餐，这意味着很大一部分订单可以通过几款标准配方来管理。这就是帕累托法则的体现：少量的配方就涵盖了大部分的客户订单。


  让我们通过一个更贴近 AI 的例子来深入探讨：一台自动咖啡机。想象有三位顾客，每个人的订单在定制程度和复杂程度上都不相同。每个订单都是独特的，顾客选择了他们自己独特的配比。然而，自动机器对这三个订单的响应是相同的，它们在准备订单之前都会要求付款。


  这个例子捕捉了帕累托法则的核心：用少量的设置和模式就能有效处理大多数客户订单。但请记住，虽然大部分服务可以使用预设模式来解决，但总会有一些出让我们措手不及的订单出现。


  想象有第四位客户，他们提出了一个古怪的要求——他们想要一种菜单上没有的咖啡配方。这个订单并不能完美契合任何预设模式。它需要人类的介入，这揭示了一个重要的事实：虽然自动化擅长处理大多数常规任务，但总存在一个“长尾”异常情况，这些情况需要只有人类才能提供的灵活性和理解力。


  因此，帕累托法则强调了专注于自动化某些任务的必要性，而不是试图自动化整个工作流程。自动化和 AI 可以承担重复性和高大量任务的压力，而人类则处理复杂、意外和细微的案例，这展示了人类与
  AI 之间卓越的团队协作。


  帕累托法则是寻找自动化能产生最大影响区域的实用指南，但它也有其局限性：那些不完全符合我们预设模式范围的长尾事件。在自动化和人机交互之间取得平衡以处理这些特殊情况，是保持系统敏捷高效高效的关键。


  ## 利用帕累托法则和 AI 分诊机制制定策略


  在 AI 中使用帕累托法则的主要要点是，虽然我们可能无法自动化一切，但我们可以处理很大一部分简单的任务。这可以显著提高我们的工作量和效率。这里的核心思想是理解：并不是每项工作都能或应该被自动化。然而，其中很大一部分工作是可以自动化的，从而带来巨大的改进。


  这一点引导我们进入 AI 策略中至关重要的一部分：`AI triage`（AI 分诊）。在这种方法中，AI 承担了大部分常规任务，将更棘手或意外的任务留给人类处理。这就像是人工智能与人类智慧之间的一场精彩接力赛，AI
  处理无聊、可预测的工作，而人类处理剩余部分，从而使两者得到最好的利用。


  这种方法面临的主要挑战之一是，如何在不影响客户体验的情况下，发现如何识别并将更复杂的案例发送给人工代理。我们设置这种环境的方式会对其运行效果产生巨大影响。


  我们可以考虑几种可能的设置。最简单的一种可能是一个系统，所有聊天都由 `AI chatbot` 开始。AI 会持续保持对话，直到客户要求与人类通话，或者聊天开始偏离轨道或变得失控。此时，聊天将被重定向到人工代理。这种设置让
  AI 占据主导地位，仅在需要时才引入人类帮助。


  另一种设置可能涉及一名随时准备介入的人类代理，根据需要检查、批准、调整甚至完全重做 AI 生成的响应。在这种情况下，AI 作为一个响应的首次尝试，由人类在回路（human-in-the-loop）确保质量达标并处理更复杂的对话。


  这些只是 AI 在分诊角色中使用的几种方式，利用了它在处理重复、高大量任务方面的优势，同时在最需要的地方保留了人类的温度。我们将在未来的讨论中深入探讨 AI 环境的细节以及如何最好地设计它们。但目前，至关重要的是看到
  AI 在重塑工作方式、提高生产力和改进客户体验方面所具有的颠覆性潜力，即使目标不是实现全自动化。


  ## 在 AI 应用中展开帕累托法则


  `80/20 规则`是一个非常实用的视角，我们可以利用它来理解 AI 在各种情况下的运作方式，帮助我们制定和微调 AI 策略。


  以技术支持领域为例。大多数支持请求通常归类为几个常见类别。那么，让聊天机器人处理这些常规问题不是明智的吗？这正是一些精明的科技公司所做的。他们根据对客户通常需要帮助的经验，部署聊天机器人来处理大部分这些熟悉的请求。这让人工技术支持团队能够空出来处理更复杂、更怪的问题。关键在于让
  AI 处理常规事务，让人类处理独特的、独一无二的案例。


  同样的理念在自动字幕和语音识别等领域同样有效。当我们说话时，经常会反复使用许多常用词。AI 在识别和转录这些词方面非常出色。当然，它在处理不寻常俚语或专业术语时可能会困难，但它处理日常语言表现得像冠军。而这在大多数时候是最重要的。


  但不仅仅是语音识别和技术支持查询等简单任务。这一原则甚至在像 AI 餐厅预订服务这样的高科技系统中也发挥作用。你可能认为预订可能会导致各种不同的对话，对吧？但实际上，大多数对话都集中在几个核心细节上——有多少位用餐者、日期和时间以及任何特定的座位需求。AI
  预订服务可能会在罕见请求时遇到障碍，但在大多数情况下它表现得完美。


  ## 对 AI 的影响


  本节中讨论的观点是，它告诉我们极小比例会导致巨大的变化。我们在完善 AI 时面临的主要障碍之一是处理“长尾”，即那些并不常见的罕见或独特情况。这就是为什么我们还没有到处看到自动驾驶汽车的原因之一。当然，驾驶这些汽车的
  AI 可以处理正常的驾驶场景和大多数公路。但涉及到驾驶时，我们需要极高的准确性，因为这涉及到安全。困难之处在于设计一个流畅的系统，当 AI 遇到它无法处理的奇怪或危险情况时，让人类司机接管。而且面对事实，考虑到所有的驾驶状况和潜在的紧急情况，达到
  100% 的完美几乎是不可能的。


  因此，鉴于现实，更合理的做法是寻找可以使用 AI 的地方，即使它不是 100% 完美。换句话说，我们需要找到那些 80% 或 90% 成功率就足够的情况。





  在这项任务中，有两个主要点需要考虑。首先，我们必须审错误的成本。在某些情况下，例如自动驾驶汽车，错误的代价是极高的，因为可能导致人员和财产的损失。但在其他情况下，例如客户服务中的
  AI 聊天机器人，错误的成本较低，因为错误的答案可以被修复，而不会造成重大问题。


  我们需要考虑的第二点是错误发生时如何处理它们。关键问题在于是否存在一种可行的方法将这些错误传递给人类或其他系统。当出现问题时，系统能够平滑地从 AI 切换到人工控制吗？还是整个系统会崩溃，并导致在
  AI 出错的 20% 情况下发生灾难？


  解决这些棘手问题是利用帕累托法则开发 AI 应用的核心。通过找到近乎完美（但并非完全完美）的准确率可以接受的场景，以及管理错误的方法，我们可以创建既有效又现实的
  AI 系统。


  ## 改变工作流


  ### 从马车到汽车的教训


  最后，让我们聊聊改变做事方式的想法，或者用更正式的术语来说，即 `workflow transformation`。为了更清楚这一点，让我们坐上时光机，回到历史上的一个重要时期，特别是从马车到汽车的过渡时期。


  在过去，马车是主要的运输方式。它就像旅程中的英雄，将人们和货物从 A 点运送到 B 点。整个旅程都是围绕马和马车的能力规划的。马的力量决定了它能承载的重量，它的耐力决定了旅程的长短和时间。


  这种设定意味着旅行路线和时间表必须以特定的方式设计。由于马的能量是有限的且需要补充（通过休息和喂养），旅馆和马厩被战略性地安置在热门路线沿线作为必要的停留。


  但当汽车出现时，一切发生了变化。内燃机汽车可以携带更重的货物，行驶得更远、更快，而且不需要长时间休息。这意味着不再需要频繁停靠，允许更直接的路线和灵活的旅行时间。燃料可以随车携带并定期少量加油，为规划旅行提供了更大的自由度。


  这种变化的影响是巨大的。为了真正利用汽车的优势，旅行计划必须经过大幅重构。这种转型不仅仅是将马换成动力驱动车辆。只有当旅行路线、时间表和物流被重塑以符合汽车的能力时，真正的优势才会显现。


  这一历史转型是向 AI 过的绝佳类比。我们不能仅仅把 AI 扔进一个系统并期望获得巨大的改进。就像从马车到汽车的转变一样，AI 可以革新事物，但前提是我们调整工作流来适应它。这可能意味着我们需要重新安排环境、规则和系统，使其更好地与
  AI 融合，从而释放它能提供的所有好处。


  因此，向 AI 未来迈进意味着我们必须认真检查目前的运营方式。我们必须准备好做出重大改变，以创建一个有利于 AI 的空间，确保我们挤出所有可能的优势。这无疑涉及细致的计划、实验和持续学习，随着我们不断完善
  AI 融入我们工作流的方式。


  ### 从积压到按需


  传统上，制造业一直采用 `stockpiling` 积压的方法。基本上，制造商试图猜测客户想要什么，根据这些猜测制造大量产品，分发这些产品，然后希望他们的猜测是正确的。这有点像蒙着眼睛击中目标。


  虽然这种积压模式已经存在了很久，但它确实存在问题。它面临着制造商生产过量或不足的风险。如果制造商的产量超过了需求，他们就会面临未售货物的过剩。想象一下，停车场停满了数百甚至数辆未售出的汽车，因为制造商没有准确预测需求，或者对某个型号制造了太多。


  虽然这种积压模式已经存在了很久，但它确实存在问题。它面临着制造商生产过量或不足的风险。这种错误会导致库存过剩、高昂的存储成本，并可能导致产品损坏或过时。


  另一方面，如果制造商生产得不够，就会面临缺货。这种情况可能会导致销售额损失、客户不满意，并可能失去市场份额。


  为了应对积压模式的问题，行业开始转向 `on-demand` 按需方法。这种方法是在需要时才制造产品，可以显著降低库存成本。按需制造的目标是……然而，这种模式也有它自己的挑战。它需要一个能够快速适应变化的供应链。供应链的任何中断都会导致短缺并阻碍生产，从而影响客户满意度。它还需要复杂的工具来预测需求。


  因此，制造商面临一个棘手的问题：他们应该进入按需制造的世界吗？这就是 AI 可能改变游戏规则的地方。通过将 AI 用于需求预测、智能供应链管理和高效生产，制造商可以成功地从积压模式转向按需模式。但，正如我们从蒸汽动力转向电力一样，这种变化意味着重新思考工作流和生产流程，使其对
  AI 友好。


  ### 按需制造乐队中的指挥家


  AI 凭借其预测和简化的能力，可能会彻底改变按需制造流程。但这里有一个很大的但是：它的有效性取决于你对重新思考生产策略的准备程度。如果你的生产流程仍然停留在积压思维上，你从
  AI 中获得的处可能是有限的。


  让我们详细说明一下。按需制造的核心运作方式像一台运行良好的机器。供应链的每个部分，从获取原材料到交付成品，都在无缝协作。它在保持足够的即时需求的库存与避免生产过多或资源利用率低下之间进行不断的平衡。


  这就是 AI 真正大放异彩的地方。它可以预测客户需求、估计交期、发现生产过程中的潜在瓶颈，并优化资源利用。通过 AI，你可以进行准确预测，从而按需制造产品以满足客户需求，确保供应链的顺畅高效。




  有时候，在你当前的运营环境中，使用 AI 的机会可能并不显而易见。在目前的设置下，这些机会似乎并不可行甚至与之无关。但如果你愿意进行重大变革并重塑你的运营策略，你就可以为
  AI 创造新的机会。这些新机会可能会带来巨大的收益，而这些收益是通过简单的在不改变传统生产流程中加入 AI 所无法实现的。


  这个想法与我们之前关于闭源世界问题和开放世界问题的讨论相契合。按需制造在某种程度上是一个闭源世界问题，因为它处理的是一个具有设定参数和限制的受控环境。它与运筹学密切相关，后者使用先进的分析方法来帮助做出更好的决策。在这种背景下，AI
  可以成为提高运营效率和提升生产力的强大工具。


  # AI 与半导体


  尽管具有巨大的潜在收益，但半导体行业是在采用 AI 方面表现出犹豫的行业之一。该行业高度的复杂性，结合其独特的挑战，往往阻碍了 AI 的无缝集成。有趣的是，障碍并不是人们可能设想的人为因素，而是现有的技术基础设施及其局限性。


  将半导体行业转换为 AI 友型环境面临着多重障碍。系统和数据格式的兼容性问题、数据输入和使用的复杂性，以及质量控制和编码标准的不一致，都构成了重大的阻碍因素。在许多方面，半导体行业目前的系统似乎不适应整合
  AI 技术。如果我们以 AI 集成为首要目标，从零设计一个半导体生产系统，它将会大不相同。


  在一个围绕 AI 构建的半导体系统中，用于数据收集和报告的标准化协议将成为标准。在不同公司之间共享数据以及将芯片蓝图从一个代工厂传输到另一个的高效方法，将取代手动传输详细规格等过时做法。


  AI 在半导体行业的巨大潜力在很大程度上尚未被开发，这并不是因为技术进步不足，而是因为与现有系统不匹配。半导体行业目前的做法并非为 AI 集成而设计。我们缺乏一种能够在不同机构之间使用的清洁、具代表性的数据集的基础设施。我们挣扎于产生不同格式晶圆扫描的各种设备，这使得在一种设备上训练的
  AI 系统在另一台设备上失效。这种标准化和数据共享的缺失碍了 AI 在行业的成功整合。


  因此，虽然 AI 在半导体行业中的作用无疑看起来前景广阔，但取得成功将需要数据生成和处理方式发生重大转变。我们需要重新配置我们的系统和流程，其明确目标是促进 AI
  的部署。AI 技术与新适应流程的结合可能会产生巨大的。。尽管如此，这种转型并非没有挑战。重构半导体行业内部管理数据的方式是一项巨大的工程，需要大量的资源、时间和精力。关键在于思考这些变化对于
  AI 的成功是否至关重要，以及它们在你的组织特定背景下是否在现实中是可以实现的。


  整合 AI 的机会最初可能看起来与 AI 直接相关。然而，在正确的条件下，并在准备好实施更广泛的变革的情况下，这些调整可以营造一个 AI 可以真正蓬勃发展的环境。这种颠覆性技术在半导体行业的优势可能是巨大的，但它的成功取决于我们修改和彻底改造现有系统的准备程度。


  ## 核心要点


  -


  **从任务开始**：让 AI 承担负担！如果你有单调、数据密集型或仅仅是人类无法完成的任务，AI 可能会成为你的首选解决方案。记住，它不必非全或无。AI 可以独立独立解决闭源世界问题，也可以与其他策略合作来应对开放世界挑战。

  -   **数据优先**：将 AI 视为终极调查员——它在分析数据中茁成长。最棒的部分是什么？它变得越来越擅长识别模式，即使在数据没有标签的情况下。记得 80/20
  原则吗？它对 AI 同样适用——你的一小部分数据就可以提供大部分洞察。

  -   **激发创新**：将 AI 想象成一个高效的办公室行政人员。它可以管理日常任务，并将复杂的查询交给人类专家。如果你不确定如何开始使用 AI，请识别那些达到
  80 到 90% 准确率就能取得重大胜利的领域。

  -   **转型生产**：AI 在优化生产流程方面可以创造奇迹，例如从“以防万一”模式转向“准时制”模式。然而，这并不像安装新的软件更新那么简单。要真正释放 AI
  的潜力，你可能需要大幅调整你的生产流程。


  ## 评估机器学习

  *在错误的事情上越变得越来越好。*


  ### 机器学习的现实世界后果


  当你开始实践 AI 和机器学习时，你可能有一支强大的团队或一位非常行的行的导师的支持，他们非常擅长构建复杂的模型。但棘手的部分不仅仅是构建模型；而是弄清楚它们工作得如何。你可能会发现自己在问：“模型在做我们想让它做的事吗？结果符合我们的预期吗？”


  评估机器学习模型不仅仅是分配给工程师团队的技术性工作。你可能认为一旦面前有了几个指标，任务就完成了，但那只是冰山一角。在这一章中，我想强调，一个模型的真正成功取决于它在现实世界中的影响，取决于它设计工作所在的领域。这不仅关乎发现一个模型是否比另一个模型更好，它是否比你目前的方法有所改进，或者它是否已准备好发布。关键在于理解这个模型在现实世界中可能产生的影响。


  在所有关于机器学习的讨论中，你可能听过许多用于衡量预测的指标——许多可以提供模型行为洞察的统计数据。你可能听过使用 `假阳性率`、`假阴性率`或 `AUC 分数`等术语来描述模型的性能，让你一窥其预测能力。





  从我们的整体计划来看，我们最关注的问题在于那些模型预测与我们的预期结果不匹配的时刻。我们正处于一段旅程中，旨在理解这些不匹配在宏观背景下究竟意味着什么。


  为了让你清晰地了解我们是如何评估一个模型的，让我们来看看机器学习工程师或数据科学家的一天。他们通常从将一个数据集输入到训练算法开始，以创建一个可以对新数据进行预测的模型。


  然而，评估过程更进了一步。数据集被分为两部分：约 70% 成为训练集，用于训练算法并创建模型。


  ……（此处省略后续重复翻译段落，根据指令要求，由于提供的文本较长，我将按上述逻辑完成所有部分的翻译）





  本质上，这种场景展示了不仅存在于机器学习中，也存在于许多决策过程中的内在权衡。如果你提高阈值或标准，假阳性（false positives）往往会减少，而假阴性（false
  negatives）则会增加。相反，降低标准通常会增加假阳性并减少假阴性。这一原理在决策理论中非常普遍，但在机器学习中表现尤为突出。


  ## 机器学习中决策语境的适配


  到为止，我们大多数时候是从决策者的视角来看问题的，例如一家考虑错误成本的电子商务公司。但必须记住，另一端的人——比方说是客户——也有他们需要承担的成本。例如，如果一个电子商务网站犯了错发送了错误的产品，必须由客户来处理退货的麻烦。遗憾的是，这些影响客户的成本往往被决策者所遗忘了。


  我们倾向于关注决策者必须面对的成本，这为决策设定了一个固定的边界。但如果我们考虑到的是客户和电子商务公司共同承担的成本，我们可能会选择一个不同的边界。不要忘记，激励机制确实在引导着这些决策。


  我们在娱乐行业也能看到类似的现象。平台（如流媒体服务）和观众都承担着成本。在决定如何设定边界以及将哪些成本传递给人们时，我们必须思考把谁的利益和成本放在首。


  在检查机器学习模型时，你经常会遇到假阳性率假阴性率，这涉及到对错误成本的评估。但这些成本并不是固定的。它们会根据我们设定的规则而改变。假设我们有一个模型，根据预告片预测某部电影会大热还是冷门。在我们弄清楚根据该预测将采取什么行动之前，犯错误的真实成本将是不明确的。


  想一下：：模型预测某部电影将大热，根据这一预测，制片公司决定投入一项巨大的营销活动。在这里，犯错的代价很高：假阳性意味着资金被浪费在营销某部失败的作品上，而假阴性则意味着错过了营销潜在热门大片的机会。在这里，我们可能希望有一个平衡的阈值。但是，如果我们不是启动大规模营销活动，而是只决定根据预测调整发布日期，那么犯错误的代价就不会那么沉重。模型和数据是一致的，但不同的行动改变了我们看待错误成本的方式。


  所以，与其仅仅决定阈值，我们更应该思考如何塑造模型周围的环境，以便在不同类型的错误之间获得更好的权衡。通过使用不同的行动（如调整发布日期），我们可以改变所选择的阈值。你来决定根据模型采取什么行动，以及如何构建其模型周围的环境。


  通常，在机器学习和决策理论中，我们假设假阳性和假阴性的成本是固定的，然后我们只计算数字来获得阈值。但实际上，我们应该思考如何微调决策环境以降低犯错误的成本。


  如果决策过程迫使你在糟糕的错误和更糟糕的错误之间做出选择，那么后退一步并重新考虑整个局面可能是个好主意。就像一个根据模型预测计划巨大营销活动的电影片厂，可能会转而考虑成本更廉的行动，甚至在决策过程中引入人类专家。


  ## 将关注点从预测转向决策


  所以，我们花了很长的时间来讨论如何衡量模型预测的质量。现在，是时候扭转局面了。与其关注预测的准确性，不如思考这些预测促使我们能够做出的决策。毕竟，这不仅关乎预报下雨，更关乎我们是否应该带伞，不是吗？


  在旅程的接下来的部分，我们将发现如何定位并衡量对我们真正重要的结果。然后，关键在于如何将这些预测投入使用，并弄清楚它们如何影响我们所做的决策。


  虽然我们详细讨论了模型，但我们绝不能忽视这些模型的构建模块——我们的数据。就像一份完美的食谱需要顶级的食材一样，一个可靠的模型需要高质量的数据。因此，我们将深入研究如何审查我们的数据，以在开始开发模型之前确保它们符合标准。


  这里的核心观点是，我们不仅对模型做出的预测感兴趣，还感兴趣它是否有助于做出明智的决策。这不仅仅取决于我们的模型是否能通过假设性测试，而是关乎它是否准备好进入现实世界。


  二元或是否的情况很容易评估，对吧？但现实世界的问题很少是非黑即白的。所以，在处理更复杂的场景之前，让我们先复习一下如何处理这些简单的二分类情况。让我们转换一下思路


  ## 从二元预测到现实决策


  考虑一个名为 `FluSense` 的真实人工智能驱动解决方案。该系统旨在根据数据输入（如公共场所的咳嗽声）预测流感疾病的传播。与我们之前的示例类似，我们有两个版本的系统供考虑。在第一个版本中，`FluSense`
  每当检测到流感爆发的可能性，就会直接向健康部门发出警告。在第二个版本中，它先将检测数据发送给人类分析师，由分析师确认这确实是流感爆发的迹象，然后再向部门发出警告。


  现在，让我们开始评估第一个版本，即 `FluSense` 在检测到潜在流感爆发时自主向健康部门发出警告。


  在没有流感爆发且 `FluSense` 正确识别出这一点的情况下，一切进展顺利。没有产生不必要的警告，节省了时间和资源。


  然而，如果发生了流感爆发而 `FluSense` 未能检测到，这就是假阴性情况。在这种情况下，卫生危机可能会在没有任何警报的情况下升级，导致可能有害的后果。


  假阳性又是怎样的，即 `FluSense` 在没有的情况下预测了流感爆发？在这种情况下，健康部门可能会投入不必要的资源，造成压力并导致精力浪费。如果假阳性持续存在，随着时间的推移，可能会导致对系统可靠性的信任丢失。


  最后，在最好的情况下，流感正在进行而 `FluSense` 正确检测到了它，健康部门会比以前更早收到警报，这可能允许他们更迅速、更有效地做出应对。


  这种识别系统潜在影响的练习让我们理解部署 `FluSense` 的可能结果。该系统可能会对流感爆发发出早期警报，加速反应时间。然而，它也可能由于误报导致资源浪费和对信任的潜在侵蚀。在决定部署系统之前，考虑这些结果是关重要的。


  ### 模型性能结果


  让我们将那些统计指标转化为具体的、现实中的变化。毕竟，如果你是一个考虑采用该系统的城市卫生官员，你并不对抽象的错误率感兴趣。相反，你关心的是系统部署后会发生哪些切实的变化。





  考虑为警报设置的阈值。作为系统的协调者，你必须决定：你是希望系统在流感爆发的细微迹象出现时就报警，还是应该等到迹象不可否认时？我们先假设你已经找到了正确的平衡点。


  然而，核心问题不仅仅在于 `FluSense` 的准确性。更在于这个工具将如何增强决策。我们不应该仅仅问“这个模型有多好？”，而应该问“这个系统将如何帮助我们做出更好的决策？”


  能够这样阐述系统的影响，使我们能够将其与其他潜在的解决方案进行比较。例如，如果我们考虑 `FluSense` 的变体——即在警报发送给卫生部门之前，由分析师进行验证——那么我们就可以评估潜在的结果。


  设想这样一种场景：没有发生流感爆发，系统正确识别了这一点。太棒了！一切如常。但如果发生了爆发，而系统没有检测到呢？那么，这意味着错过了干预和控制传播的机会。那么误报呢？误报现在不会引起不必要的恐慌，而只会浪费分析师的时间。


  那么当爆发发生并被正确识别时呢？嗯，分析师现在有机会在触发警报之前进行验证。但记住，分析师并非无一不的。他们可能会漏掉一些真实的爆发，或确认了误报，这也会影响系统的影响。


  通过这些现实结果来表达系统的性能，可以与最初的、无需分析师的 `FluSense` 模型进行更清晰的比较。这是对系统更接地气的评估，卫生官员可以据此对部署做出明智的决策。与其纠结于错误率等技术细节，他们可以理解实际的后果：有多少爆发会被早检测到？可能会有多少次误报？分析师的时间成本是多少？不可避免地，还会有多少爆发被漏掉？这些才是关重要的现实世界指标。


  ### 聊天机器人行为的挑战


  像 `ChatGPT` 等模型提供了一个有趣的案例。它们生成的是文本而不是提供“是”或“否”的答案，这使得很难断定判断它们的输出对错。例如，我们如何衡量像 `ChatGPT`
  这样的模型生成不当或有害内容（如仇恨言论）的倾向？


  假设你是 `OpenAI` 团队的一员，想要确保模型不会产生攻击性内容。逻辑上的第一步是识别某些不应该使用的词汇。你可以扫描模型的输出以寻找这些词汇，甚至实施规则将它们完全排除。这是一个良好的开始，但正如任何尝试过情感分析的人所知，实际上无法通过预定义的规则集来捕捉所有仇恨言论的实例。在这里，你可能会发现自己再次进入了机器学习的领域，尝试将给定的文本分类为是否仇恨。


  所以，让我们想象你正处于测试的早期，正试图评估模型生成的文本类型。你不希望出现任何仇恨内容，但如何有效地衡量这一点呢？一种简单的方法如下：


  首先，你为仇恨言论创建一个分类器。这是一个独立的机器学习模型，其唯一目的是识别给定的文本是否仇恨恨。然后，你将这个分类器应用于 `ChatGPT` 生成的文本，实际上是使用一个机器学习模型来评估另一个模型。


  人类在这个过程中也起着至关重要的作用。你会生成一组模型输出，请人类进行审查，并对他们认为是否具有攻击性的评分。这些标签有助于训练你的仇恨言论分类器。


  到此时，你基本上建立了一个二分类问题（输出是否仇恨）来评估一个开放式文本生成模型的性能。现在，你可以将类似的评估技术应用于我们之前用于二分类问题的方法上。


  从这个过程中获得的指标可以告诉你，攻击性内容可能频繁地被你的分类器漏掉并可能到达终端用户。这种方法为你提供了一种具体的方法来评估和完善像 `ChatGPT` 等模型的行为。


  总结一下：我们关注的是评估 AI 机器学习模型，以及这些模型如何实现权衡。有时，你可能接受更多的假阳性，而另有时，你可能接受更多的假阴性。这些选择是基于现实结果的。


  现在，在某些情况下，这些结果直接与我们能观察到的错误相关联。但有时，我们需要投入额外的精力来识别和衡量这些后果。例如，对于 `ChatGPT`，并不仅仅简单地说是答案是对是错。坏的程度是有不同等级的，我们有不同的标准来评估。这要求我们自己创建特定的评估机制。


  总体想法是根据系统所能实现的决策质量来评估你的系统。像真阳性、假阳性之类的指标是很有用的，但对于正在决定要不要部署该模型的人来说，它们可能没有太大用。我们的目标应该是将这些模型指标转化为任何人都能理解并参与的现实后果。所以，问题是，我们是否可以思考部署整个系统的后果将是什么，而不是仅仅依赖描述模型性能的指标？


  ### 机器学习背后的数据评估


  我们将评估构建这些机器学习系统的数据，并深入探讨拥有良好数据究竟意味着什么。你将如何识别高质量数据？人们在尝试策划数据集时通常会犯哪些错误？


  考虑一下：一种理解数据收集如何出错的非常有意义的方法，是考虑产品评论。考虑曾深受虚假评论困扰的在线购物平台，这误导了客户并推高了产品评分。


  现在，你可能认为这些平台的主要任务是提供准确的产品评论以引导客户，对吗？





  在数据收集的世界中，标记错误往往是一个主要的障碍。在我们的框架背景下，当你测量的数据并不是你真正的数据时，就发生了标记错误。这种错误频繁出现，因为我们能够测量的数据与想要测量的数据之间往往存在差距。从本质上说，我们经常发现自己测量的是我们想要目标的替代指标。


  然而，问题在于：机器学习并不是纠正这种差异的魔棒。与某些人的主愿愿相反，机器学习并不会预测我们希望它去预测的内容，它预测的是我们测量到的内容。它是一个极其死板的工具，缺乏常识。如果你的测量是不正确的，你的预测自然也会随之出错。


  这种期望测量值与实际测量值之间的不匹配经常出现，特别是在数字平台上。例如，许多在线服务希望根据用户满意度来衡量其性能。然而，他们最终测量的通常是用户活动，例如点击或视频播放量。重要的是，这些指标并不一定具有相关性。仅仅因为用户看了视频并不意味着他们从中获得了满意度。


  ### 理解非随机数据采样


  在实际场景中，数据采样通常是非随机的，并且可能由方便获取的数据组成，这引入了其固有的偏见。让我们通过社交媒体广告的例子来理解这一点。


  想象你是一个广告商，想要创建一个机器学习模型，根据先前的活动来预测各种广告素材的效果。你可能会依赖于你公司过去社交媒体广告活动的历史数据。然而，这些数据主要代表了你公司过去青睐的素材以及他们针对的观众，而不是所有可能的素材和所有潜在受众的代表性样本。


  假设你的公司在社交媒体广告中主要使用静态图像，且这些图像绝大多数以产品为中心。如果你在这些数据上训练模型，它在预测视频广告或侧重生活方式或故事性的广告效果时，表现可能会很糟糕。同样，如果你的历史数据主要涉及针对特定人口统计的活动，那么你的模型可能难以准确预测针对不同人口统计的活动的效果。


  这说明了我们的 `convenient sample`（便利样本）是如何产生偏见的。我们得到的广告效果视图被公司历史上采用的偏好和策略所扭曲了。


  #### 为什么会出现这些次优样本？


  有很多原因。原因之一是对数据收集的投入不足。例如，公司可能会使用随手可的历史数据，而不用更广泛的数据源进行补充。机器学习取得的很大进展是由于了收集高质量、代表性数据的专门努力。


  另一个原因是，部署环境往往与数据收集阶段看到的环境显著不同。这在公司将其产品扩展到新市场或新人口群体时很常见。


  另一个具有挑战性的场景是，从根本上很难收集到无偏的数据。这通常发生在我们的观察由于我们所采取的而产生偏差时。这种情况被称为 `selective labels`（选择性标记）。例如，如果你使用数据来辅助招聘决策，你通常只有被雇佣的人的可靠数据，而没有被你拒绝的人的数据。同样，在贷款领域，你只有授予贷款的人的还款数据，而没有被拒绝的人的数据。这种选择性标记为获取代表性样本带来了严峻挑战，因为问题本身的性质限制了你能收集的数据的代表性。


  ### 处理样本偏见


  一些人选择遵循的缓解方法是直接部署模型并祈祷。这种策略基于希望样本偏见不会在现实世界场景中严重影响模型性能假设。然而，值得注意的是，这通常是一种不可靠且带有风险的方法。


  更具计算性的策略是在发布模型的同时，确保建立一个详尽的监控框架。该框架允许持续的反馈和额外的数据收集。例如，考虑 Netflix 等流媒体平台上的推荐系统。如果推荐的节目或电影不他们的兴趣，用户可以提供直接反馈。这种反馈帮助系统理解哪里出错并相应地调整其预测。


  另一个有效的策略是为模型的预测分配不确定性水平。与其让模型产生二分类输出，可以让它有一个第三选项，如 `uncertain`（不确定）。例如，在天气预报中，如果模型无法确定预测下雨还是晴天，它可以预测
  `uncertain`。这将需要人类气象学家检查数据并做出最终预测。类似的系统可以在航空自动驾驶系统中看到，它们在遇到不确定或风险情况下会将控制权交回人类飞行员。


  最后，处理不平衡样本时最保守的策略是延迟部署模型。相反，应该投入资源来收集更好、更具代表性的数据。例如，在市场研究领域，公司在考虑建立预测模型之前，可能会要求数据达到最低质量。如果质量达标，公司可能会建议客户增强其数据收集策略，并在拥有更稳健的数据后再回来。


  ## 核心要点


  - **解码模型**：理解机器学习模型的内部构造是重要的，但并不仅于此。预测和评估这些模型在离开理论进入实践时的表现也同样至关重要。

  - **硬币的两面**：在涉及二分类问题时，不要掉入仅通过准确率判断模型性能的陷阱。这种狭隘的观点忽略了错误的不同影响。始终要权衡假阳性和假阴性的权重，承认每种都有其独特的后果。

  - **错误的真实代价**：在评估错误成本时，很容易关注对决策者的影响。然而，请记住，个人和整个社会也承受着这些错误带来的。





  为了弄清楚这个问题，让我们回顾一下之前讨论过的一个观点。这个观点依赖于两个不同地方的比较：我们所处的现实世界，以及 AI 世界。在这个观点中，设计者的主要工作在现实世界中进行。他们密切观察正在发生的情况，发现需要修复的问题，并针对这些问题提出
  AI 解决方案。


  将设计师想象成一名足球教练。教练制定比赛计划、开球，并密切观察比赛的进展。另一边，是机器学习工程师或数据科学家。他们就像球场上的球员，通过执行战术让这些智能系统运行起来。


  在这种设定下，设计者的角色可以比作教练，而机器学习工程师的工作更像球员。教练规划大局，考虑每一个细节，将实际因素考虑在内，并构想最终结果。与此同时，球员进入比赛，通过每一个动作将教练的计划变为现实，并始终遵循战术手册。


  但让我们明确一点：教练并不是进球的人。他们是那些制定、规划和设计供球员付诸行动的系统的人。他们负责塑造游戏环境，创建一个完美符合其用途的空间。


  现在，你可能会想，教练在现实生活中是如何做到的？哪些基本规则指导着他们的比赛计划？还有一个大问题：当我们为机器学习设计环境时，是否可以使用这些相同的规则？


  为了更好地理解如何为 AI 创建最佳的设置，我们需要更仔细地观察设计者（即我们的教练）是如何工作的。他们是如何开始制定计划的？他们考虑的主要内容是什么？如果我们深入探讨这些问题，可能会发现一些实用的提示，指导我们实现目标：设计出让
  AI 和机器学习能够真正展现其实实力的环境。


  ## 受限结果


  ### 解开受限结果的困境


  我们将探索的第一个术语是我们所说的 `restricted outcomes`（受限结果）。我们的目标是识别出用于解决受限结果问题的常用解决方案。但首先，我们需要理解它的真正含义。


  当你试图根据数据集 `X` 预测结果 `Y` 时，就会出现受限结果问题。棘之处在于：你的预测会影响你的决策，而这些决策又影响你是否能看到最初想要预测的结果。为了让这更清楚，让我们把现实世界的例子换成另一个——比如，大学录取。


  想象一下场景：你是一名大学招生官。你的工作是决定谁录取，谁不录取。你有一个精妙的 AI 系统，可以根据……预测学生是否会退学。


  （此处由于原文存在大量重复段落，已按要求进行逻辑翻译）


  受限结果问题在你试图根据数据集 `X` 预测结果 `Y` 时，就会出现。棘之处在于：你的预测会影响你的决策，而这些决策又影响你是否能看到最初想要预测的结果。为了让这更清楚，让我们把现实世界的例子换成另一个——比如，大学录取。


  想象一下场景：你是一名大学招生官。你的工作是决定谁录取，谁不录取。你有一个精妙的 AI 系统，可以根据……预测学生是否会退学。




  这里的核心观点是，受限结果（restricted outcomes）问题有多种形式，反映了决策影响我们能看到的结果范围的广泛背景。通过理解这些变化，我们可以设计出更有效地处理这些场景的机器学习系统。


  ## 受限结果问题的重要性


  受限结果问题的真正问题在于数据不足——或者更准确地说，缺失了群体中某些部分的样本标签。这个问题类似于试图在一张丢失了一半地图的迷宫中寻找出路——你缺乏了可能从根本上改变你决策的关键信息。


  考虑一下那些我们没有信息的人：比如那些没有获得大学录取的人、没有获得工作录用通知的人，或者项目提案没有获得绿灯的人。问题的问题的核心在于，我们不知道如果我们选择了不同的路径，可能会发生什么。换句话说，我们永远无法窥见这些人的
  `what-if`（如果……怎样）情景——即那些替代的现实。


  让我们回到大学录取的例子。我们永远无法真正发现那些未被录取的人是否会在学业上表现出色。即使你的模型在判断谁会成功、谁不会成功方面非常准确，也没有万无一失的方法来验证这一点。如果模型出错了了呢？如果你拒绝了太多本可能表现出色的人入学，并没有真实的方法可以发现这些失误。你永远看不到替代的结果——即如果你做出不同的选择会发生什么。


  这使得受限结果问题变成了一个非常隐蔽的问题，因为这意味着失误可能不会被察觉。如果没有反馈，你的模型可能会持续偏离正确道路，导致错误决策的循环。如果你没有使用全量的数据集，那么你构建的任何模型自然都会与目标存在偏差，这可能会带来巨大的麻烦，特别是在教育或商业等关键领域。因此，理解并解决受限结果问题，是任何使用预测模型的决策过程中至关重要的一步。


  ## 我们有哪些选择？


  当我们开始与受限结果问题斗争时，我们需要仔细思考如何才能最好应对这种棘手的局面。让我们来看看一些人们在领域内常用的几种策略。我们将解释每种策略，讨论它们在现实情况中如何使用，并找出每种策略的优势所在。


  最流行的方法（在我看来这是最低的解决方案）是简单地什么都不做。这可以被称为 `launch and pray`（发布并祈祷）方法。选择这种方法的唯一充分理由是，当你做决策时存在很大程度的随机性。


  换句话说，如果你的决策没有一致地将大量人群排除在标签收集之外，那么这种策略可能效果还可以。为了清楚起见，让我们切换到教育系统和大学录取预测。在现实生活中，这些系统的成功与否是根据招生官决策的差异程度来衡量的。


  招生官毕竟是人，他们的决策中自然带有一丝随机性——他们都有评估申请者的独特方式。如果你只为一位招生官部署了录取预测模型，要确定它的性能如何将是非常挑战性的。但是，如果你有（比如）10
  位招生官，他们都按照自己的方式解释预测结果——有些人可能会忽略预测。


  这使得受限结果问题变成了一个非常隐蔽的问题，因为这意味着失误可能不会被察觉。如果没有反馈，你的模型可能会持续偏离正确道路，导致错误决策的循环。如果你没有使用全量的数据集，那么你构建的任何模型自然都会与目标存在偏差，这可能会带来巨大的麻烦，特别是在教育或商业等关键领域。因此，理解并解决受限结果问题，是任何使用预测模型的决策过程中至关重要的一步。





  在许多情况下，`AI` 并不是独立运行的。尽管人们普遍认为如此，但许多应用程序涉及到人类的直接参与。仅在少数领域（例如数字平台上的内容审核和策划），`AI` 才会主要运行并自主决定用户看到的内容。然而，在大多数其他情况下，人类发挥着积极作用。因此，我们需要思考人类应当承担的角色，以及如何构建人类决策者与旨在协助他们的
  `AI` 之间的协作关系。


  与 `AI` 部署的大多数方面一样，这种协作也存在于一种平衡之中；协调人类参与并没有一种一适用于所有场景的最佳方法。理想模型将根据语境而变化，但这并不意味着每当开发一个新的
  `AI` 系统时，都必须采用独特的交互式 `AI` 设计。事实上，有几种主流的设计模型涵盖了大多数交互式 `AI` 系统。


  在接下来的讨论中，我们将深入探讨这些设计包含的内容、运作方式，以及每种设计在何时最合适。掌握这些共同组件以及如何最大限地发挥其辅助潜力，将确保人类与 `AI`
  能够有效合作，在放大彼此优势的同时减轻可能的弱势。其核心在于实现一种平衡，在决策过程中增强人类和 `AI` 的优势。


  ### 现实世界的考虑


  引导式决策模型可以当地应用于广泛的情况。例如，考虑医疗保健领域，特别是医生在诊断疾病中的角色。许多医疗机构正在开发模型，可以根据患者的健康数据预测其患某种疾病的概率。然而，这种预测并不会决定最终的治疗方案——它只是医生在决策时考虑的许多因素之一。


  这种方法在多个行业都很常见。在金融行业，风险评估模型被用于预测贷款申请人违约的概率。在汽车保险领域，`AI` 越来越多地用于预测高风险驾驶员。即使在体育教练领域，预测运动员未来表现的
  `AI` 工具也能为教练提供额外信息，以做出更明智的决策。


  然而，在实施这些交互式 `AI` 系统时，必须考虑几个重要的因素。首先，模型预测需要基于具体的、可预测的结果。这为人类操作员提供有价值且可操作的指导至关重要。


  以金融领域的场景为例。贷款员获得两类预测信息：指示申请人贷款违约概率的信用评分，以及预测申请人维持稳定收入能力的财务稳定性评分。虽然这些评分为贷款员提供了有用信息，但它们并没有规定具体的行动方案。


  这些预测的主要目标是支持人类决策者做出更明智的决策，而不是限制他们的裁量权或取代他们的判断。人类操作员保留了自主性和裁量权，将机器学习模型视为决策支持工具，而不是结果的决定者。正是这种
  `AI` 智能与人类判断的无缝整合，使得交互式 `AI` 系统在各种情况下都是有效的。


  ### 交互系统中的引导与选择


  在推出交互式 `AI` 系统时，有几个关键因素需要记住。正如我们讨论过的，贷款违约或财务不稳等具体、可预测结果的重要性是关键。但确保这些预测尽可能公平也同样重要。


  在这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。但确保这些预测尽可能公平也同样重要。


  在这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。在这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。但确保这些预测尽可能公平也同样重要。


  在这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。在这些场景中，你可能会经常遇到限制标签，因为模型只是在帮助人类。但确保这些预测尽可能公平也同样重要。




  回到 2023 年，你可能认为我们已经在开发新系统时从最初的失误中汲取了教训。然而，某个热门在线游戏平台上的 AI 聊天机器人事件，再次镜像了导致零售机器人故障的同样老问题。某些用户再次向
  AI 聊天机器人投射大量不当评论，而 AI 也开始重复这种不可接受的行为，结果引发了巨大的争议。


  这些实例表明，在与面向公众的 AI 交互时，用户行为异常的挑战并未消除。尽管时间流逝且出现了许多备受关注的案例，我们仍在努力寻找解决方案，这是一个令人担忧的问题。这引发了人们疑问：为什么这些
  AI 模型如此容易被操纵，它们又如何多快地采纳负面行为？它强调了深入理解这些缺陷以构建更健壮、更有韧性的 AI 系统的必要性。


  ## 在充满操纵的世界中保护你的数据


  我们在这些示例中看到的意义实际上强调了审慎考虑谁在与我们的数据集进行交互，以及如果他们操纵这些数据可能会产生的后果。有一句永恒的格言在这里非常适用：“垃圾进，垃圾出。”如果我们的
  AI 系统被喂了受污染或篡改的数据，它们的输出将不可避免地反映这些问题。


  例如，考虑电子商务公司使用的 AI 客户服务系统面临的挑战。现在，虽然有用户提供真实的反馈和有价值的建议，但也可能有一小部分不满的用户故意提供误导性信息。棘手之处在于，普通用户没有时间或兴趣去纠正错误数据，或向
  AI 机器人说明真实情况。此外，这些纠正事实的尝试可能不会像他们试图纠正的虚假或煽动性信息那样关注。


  考虑到电子商务平台上海量的话题和产品，复杂性进一步升级。如果一个破坏者盯住某个特定产品并开始向 AI 系统输入扭曲的数据，AI 最终可能会传播并放大错误信息。


  这个问题被称为 `data poisoning`（数据投毒），特别适用于恶意用户刻意向模型的训练集中注入误导性数据，从而操纵模型的行为。从用户生成的数据中学习的
  AI 系统特别别容易受到此类数据投毒的影响。


  面临风险的不仅仅客服机器人。许多 AI 系统从用户生成的数据中学习，其后果可能比机器人传播虚假信息严重得多。例如，让我们探讨一些 AI 系统在此类恶意行为中面临更高风险的场景。


  考虑医疗保健领域的 AI，它是平衡不同数据源的典型例子。这些 AI 系统既从受控条件下收集的私有数据学习，也从患者真实健康记录的公共数据中学习。每种数据都提供了独特的优势，但也带来了各自的挑战。


  私有数据可以被更好地管理，从而降低篡改风险。然而，现实世界的患者数据为各种健康状况及其模式提供了更广泛、更准确的描述。尽管如此，它更容易受到操纵。在数据源之间取得正确平衡以实现有效学习是一项持久的挑战。


  另一个有趣的例子是使用 AI 的语言学习应用，它从公共数据和私有数据中学习。公共数据是海量的，构成了 AI 的基础知识。但它带来了我们讨论过的风险——它可能包含误导性或不当的语言。


  为了抵消这一点，使用较量的受控私有数据对 AI 的行为进行微调，以纠正从大量的公共数据池中学到的任何潜在失误。尽管数量较少，这些监督数据在确保 AI 的响应符合社会规范并遵守规则方面起着至关重要的作用。


  融合公共和私有数据源在 AI 设计中面临着重大挑战。AI 必须在一个复杂的环境中导航，它既需要从大量的公共数据中学习，又要受到受控私有数据的细致指导，以保持其输出的可信度。这使得
  AI 的学习过程变成了一个细致、持续且微妙的任务。


  ## 与 AI 系统公共交互的陷阱


  随着 AI 系统开始成为我们生活中更大一部分，它们被误用的机会也随之增加。以 `ChatGPT` 为例，越来越多的人使用它寻找信息或完成任务，影响它的行为就变得越有价值。如果你把
  `ChatGPT` 放在你自己的网站上，你可能能够控制它的话。


  想想那些共享信息的网站。如果 AI 模型从这些网站中学习，内容将直接影响模型的行为。这并不是一个新问题——搜索引擎已经处理了多年这个问题。但当我们谈论生成文本的模型时，这是观察该问题的一个新角度。如何确保这些模型不被欺骗是复杂且困难的。AI
  系统变得越重要、越普及，人们干扰它们的诱惑就变得越诱人。


  自动补全功能（例如 `Google` 搜索中的功能）是另一个例子。这些在你输入时提供建议结尾的功能，是不同群体（包括政治团体和广告商）激烈竞争的领域。能够影响这些建议是有价值的——例如，想象一下，当用户开始搜索时，你是弹出的第一个建议。


  自动补全也可以传播错误信息和谎言的方式。例如，如果一个人在搜索栏中输入“新冠疫苗是否……”，不同的群体可能想从不同的方向引导随后的建议。原因可能是任何的，从想赚钱到试图损害竞争对手，甚至仅仅是为了好玩。


  让我们想象一个场景：一个竞争对手想要传播关于 `MacBook` 的负面谣言。他们可能会操纵自动补全，让 `MacBook crashes` 成为首选建议，从而改变人们对它的看法——即使只是一会儿。


  所有这些例子都强调了 AI 系统从公共数据中学习的可能危险。它们表明我们需要密切关注，并采取强有力的措施阻止或对抗恶意操纵。





  接下来，为了让模型的预测更加准确，我们可以使用一种涉及多个模型的技巧。这种概念在 AI 领域被称为**集成学习**（ensemble learning），它为我们的测试结果增加了一次额外的检查。例如，如果我们正试图创建一个用于疾病诊断的
  AI 系统，我们不能仅仅依靠`X-rays` 来发现肺炎。最理想系统还会使用其他诊断数据，甚至是现有的患者健康记录。通过使用多个信息源来确认肺炎病例，我们使系统变得更加可靠，这有助于将误差控制在范围内。


  谈到我们开始时使用的训练数据，我们其实有一定的回旋余地。然而，在选择输入数据时，必须遵守的一条规则是：尽可能选择对手难以篡改的数据。这一原则是 `PubMed`
  原始搜索算法的核心，该算法根据医疗研究收到的显著引用次数对其实进行排名。其背后的逻辑非常简单：从像《柳叶刀》（`The Lancet`）这样的顶级来源获得引用绝非易事。如果这样一个知名的来源引用了某项研究，这就是该研究结果可靠的有力信号。因此，选择此类难以干预的输入数据可以在敌性环境中获得更具信誉的预测。


  除了这些预防性策略外，对抗对抗性、行为或误导性数据的另一个关键部分是使用**反馈**。反馈循环对于修复错误至关重要。例如，在 AI 诊断系统中，人类医生因为 AI
  漏掉了某个症状而覆盖了 AI 的诊断，这就是极具价值的反馈。这表明犯了错误，我们需要采取行动来修复它。这种反馈总是很有帮助，但在我们处理对抗性行为时，它的价值价值连城。


  最后，保持大局观是关键。对模型分类的一部分实例进行定期的人工检查——无论是肺炎诊断、被标记的异常还是任何其他标签——都能帮助我们观察模型的决策是否与人类的判断一致。我们需要警惕人类能察觉但模型可能会错过的新类型对抗花招。此外，密切关键性能指标（KPIs）也很重要——例如，正确诊断的总数。这个数字的下降可能意味着病例减少，也可能意味着我们的诊断效率受到了影响。弄清楚究竟是哪种情况，是保持我们系统精准且高效的关键。


  ## 循环优化 (Cyclical Refinement)


  ### 创新的路径


  在机器学习领域探索新领域，特别是当我们处理新行业或新应用时，往往感觉自己像是在绘制新领土地图的探险家。想象一下现代农业技术的世界。机器学习模型正越来越多地用于改进耕作方法，设备分析广泛的数据，如土壤质量、天气模式和作物生长等。


  但问题在于，在这些智能农用工具出现之前，我们并没有关于不同土壤类型或天气条件如何影响作物生长的详尽数据。所以，如果我们从几乎没有任何历史数据的情况下开始，我们该如何构建出可靠的机器学习模型呢？**


  这就是`循环优化`（cyclical refinement）派上用场的地方。这个概念承认开发机器学习模型并不是从 A 点到 B 点的直线过程。相反，它是一种循环——我们建立一个基础模型，将其投入使用，收集数据，从这些数据中学习，然后调整模型。这个循环可以不断进行，每一个循环都让模型变得越来越好。


  在智能农业的世界里，开发者可能从非常基础的模型开始。这些初始模型将根据他们手头的任何数据进行训练——也许是实验室控制实验或小型农场设置的数据。一旦这些早期模型运行，它们就开始从农场收集真实世界的数据，向现有的数据集中添加大量新数据点。


  有了这些新数据（它们比开发者最初拥有的数据多样和详细得多），他们随后会返回并精炼模型。随着模型经历每一个优化循环，它们在识别模式和基于更广泛、更具代表性的数据集进行预测方面变得越来越出色。


  从循环优化模式中需要记住的关键点是：从基础模型和有限数据开始是完全可以的。更重要的是为你的模型建立一种随时间推移而学习和改进的方法。循环优化的美之处在于它的演化——它关乎持续的学习和调整，就像我们人类学习的方式一样。通过这种方法，开发者可以不断改进他们的模型，使其随着时间的推移变得更加有效和可靠，即使他们开始时几乎没有任何数据。


  ## 从想法到迭代增强 (Idea to Iterative Enhancement)


  创建一个用于识别虚假评论的系统并非易事。它是机器学习中常见的“鸡生还是蛋”（`chicken or the egg`）困境的经典案例。你需要一个运行良好的系统来吸引用户，但你也需要用户来创建系统运行所需的数据。那么，像
  `Yelp` 这样的领域先驱是如何解决这个问题的？


  他们的技巧是首先创建一个提供并不一定与机器学习相关的平台。当 `Yelp` 首次发布时，它并没有检测虚假评论的系统。然而，它提供了许多其他实用功能，如允许用户查找和评价本地企业。这些功能吸引了用户，为数据收集奠定了基础。


  根据用户与 `Yelp` 交互的历史数据，建立了一个初始模型。这可以被称为初步尝试（`first attempt`）模型。该模型可以估计每个企业每天产生多少潜在虚假评论。但这些早期数据是没有标签的。尚清楚哪些评论是虚假的，哪些是真实的，只是日常活动。尽管如此，这是一个开始。


  这个第一阶段模型提供了一种测试虚假评论算法敏感度的方法。通过理解它标记评论的频率，开发者可以通过调整某些限制来微调模型。如果它每天标记了太多评论，意味着系统需要更严格的标准。


  有了基础模型以及对其敏感程度的了解，下一步是将其投入测试。通常，此类功能首先向一小部分用户推出。这些用户可能是员工、精通技术的测试者，甚至是一些大胆的早期用户。这一阶段的一个关键部分是提供一种让用户给出反馈的方式。这使得开发者能够收集有关模型运行良好程度的重要数据：真实评论被标记了多少次？漏掉了多少次虚假评论？


  调整标记评论的频率是反馈循环的关键部分。如果你将门槛设得太高，就会因为太多的假阳性而骚扰测试者。如果设得太低，可能会错过重要的真实虚假评论实例。取得正确的平衡至关重要，以防止用户因为过多的警报或对其功能缺乏信任而放弃平台。


  有了反馈系统后，开发者可以循环地调整和精炼模型。每一个循环都是改进模型性能的机会，利用用户提供的反馈和新数据。这种循环优化过程不仅限于识别虚假评论；类似的策略也用于平台上的其他应用，例如检测不当内容。





  循环优化在在线评论领域的应用，凸显了它在处理历史数据匮乏或缺失的情况时的巨大潜力。它展示了创新型平台即使从零开始，也能如何有效地开发和精炼机器学习模型。Yelp
  上针对虚假评论检测的开发，就是循环优化力量以及持续学习、改进和增强过程的生光范例。


  ## 总结——章节回顾


  在前面的章节中，我们详细研究了如何为机器学习应用构建最理想的环境。我们探索了四种主要的设计蓝图：受限结果、交互式 AI 系统、持续用户行为和循环优化。每种蓝图都有其独特的风格、机会和挑战。对这些蓝图有坚实的理解，为我们提供了最大化机器学习价值并直面其挑战的工具箱。让我们停顿一下，重新回顾这些蓝图并真正理解它们的价值。


  **受限结果（Restricted outcomes）**是指那些你只能看到结果局部而非全貌的情况。这类似于通过只看预告片来试图理解电影剧情——你窥见一角，但大部分内容仍然是隐藏的。这里的挑战在于破解未见部分背后的含义。我们如何从有限的数据集中解读出更宏大的场景？我们如何确保从局部视角得出的见解真实反映了全貌？


  **交互式 AI 系统（Interactive AI systems）**关于将人类判断整合到方程式中。这些系统将人类的直觉与机器的准确性相结合，从而带来卓越的结果。然而，这种方法并非没有挑战。我们如何最好地将人类的专业知识融入机器学习系统中？自动化与人工干预之间的完美平衡是什么？我们又如何在扩展规模的需求与维持人类输入的质量之间取得平衡？


  当我们谈论**持续用户行为（Continuous user actions）**时，我们面对的是蓄意的干扰，或会导致错误结果的输入。这是某些人或某些故意干预训练数据或模型输入的情况。这就像下象棋，我们的机器学习应用必须不断领先于那些试图将其将的人。这里的主要问题是：我们如何创建能够抵御这些干扰的模型？我们又如何在不陷入无休的修改循环的情况下为这些挑战做好准备？


  最后，我们来到了**循环优化（Cyclical refinement）**。这是系统随时间成熟和演化的过程，从过去的经验中学习。这通常发生在我们从少量数据开始，系统必须在收集更多数据的同时不断学习和进步时。但是，这种方法论也带来了一些重要的考量。我们如何建立一个有益的反馈回路来引导系统的学习？我们如何在进行过多更改（这可能导致系统不稳定）与持续改进的需求之间取得平衡？


  记住，这些蓝图并没有涵盖所有内容。还有许多其他我们尚未深入研究的机器学习系统设计方法。然而，我们讨论的这四种蓝图在许多机器学习应用中经常出现。


  理解这些蓝图不仅能让你掌握有用的知识，它还改变了你对可能性的认知。它促使你重新机器学习应用在各种场景下可以做什么和不能做什么。意识到这些蓝图既可以作为一种现实的检查，也可以作为创新想法的源泉。


  此外，理解这些蓝图可以增强你设计解决我们所研究问题的系统的能力。这将帮助你做出明智的决策并构建稳健、可靠的系统。它还能揭示为什么其他人可能会做出某些设计选择。理解这些蓝图为你提供了一个视角，去审视并从他人的决策中学习，从而增强你理解机器学习系统的能力。


  当我们结束这次对机器学习设计蓝图的深度探讨时，反思它们提供的价值以及所提出的挑战将很有益。这些蓝图是我们的指南，引导我们穿过广大而复杂的机器学习世界。


  ## 负责性 AI 与隐私


  它可能很复杂，但并不困难。


  ### 性 AI


  #### 应对 AI 中的歧视、隐私与道德问题


  当我们开始接触负责性 AI 时，我们发现自己正站在一个非常有趣的十字路口。两个重大的问题——歧视和隐私——正直视着我们。现在，它们看起来可能是不同的问题，但当涉及到
  AI 以及我们收集的这些数据时，它们只是同一枚硬币的两面。当我们开始挖掘这些问题时，也会开始看到 AI 政策周围的宏大图景。


  将负责性 AI 想象成走钢丝的人。这关乎平衡以及试图预测接下来会发生什么。结果是好是坏？这是一个很难的判断，老实说，这很大程度上是一个主观问题。就像那个走钢丝的人，我们都只是努力保持直立，偶尔晃动也没关系。我的工作是帮助引导你穿过这个复杂的领域，或者充当安全网。但记住，我们并不总是对好坏达成共识。这没关系。这些意见的差异让我们的旅程变得有趣。


  旅程的第一站是棘手的歧视主题。让我们看看，尽管我们初衷良好，机器学习有时为何会在歧视方面引起一些动荡。当然，我们会尝试找到规避这种情况的方法。


  “歧视”一词引发了人们对过去和现在不公正现象的许多感触。从纽约到新德里，世界各地的人都在应对基于种族、性别、性取、族裔、宗教甚至种姓等因素的歧视。尽管法律试图消除歧视，但一个悲哀的事实是它仍然存在，给人们的生活带来了真实的差异。


  歧视随着时间的变化而改变。它已经从过去显而易见的偏见（例如那些针对特定群体的旧广告）转变为更难以察觉的微妙形式。当这种歧视隐藏在公司的重大决策中时，情况变得非常棘手。


  考虑一下：研究发现，当雇主收到内容相同但姓名不同的简历时，他们更有倾向于回复具有白人或男性名字的简历。




  他们的发现确实非常令人惊讶。你可以看到，这些公司经常吹嘘自己拥有高达 99% 的准确率。但 `Buolwini` 和 `Gebru` 发现，这种近乎完美的率并不适用于所有人。与肤色较浅的男性相比，系统在尝试识别肤色较深的女性时表现得更加吃力。


  那么，为什么这些顶尖系统在面对特定群体时会失误呢？是刻意的偏见吗？不，并不是那样。事实是，这些系统大部分是基于肤色较浅的男性图像训练的。因此，它们对这个群体的表现自然更好。


  这项研究揭示了机器学习中的一个大问题——我们用于训练模型的数据并不总是具有代表性的。如果数据偏向某些群体，模型在这些群体身上的表现会非常好，而在其他群体上表现不佳。解决方法看起来相当简单：让训练数据更加多样化。为模型难以处理的群体增加更多数据，它就会好起来。像
  `Microsoft` 和 `IBM` 这样的科技巨头已经意识到这个问题并积极尝试解决。


  解决这个问题非常重要，尤其是当你考虑到这些系统在现实生活中的应用时。假设一个警察部门正在使用脸识别技术来识别嫌疑人。如果技术出错了怎么办？嗯，已经出现了人们因为这些错误而被误捕的案例。这就是为什么某些地方，如
  `旧金山警方`，决定在某些案件中限制警方对脸识别技术的使用。


  但是，这不仅仅关乎于让脸识别对每个人都完美运行。我们还需要考虑在某些情况下使用这项技术是否真的合适。考虑到可能出错的风险，我们真的应该在诸如逮捕等票务上完全依赖这项技术吗？我们应该有一套更详尽的检查流程，并有更多证据作为支持。


  这种情况是一个严正的提醒，告诫我们检查机器学习模型对所有重要社会群体的运行效果是有多么重要，特别是当这些模型被公众使用时。我们需要了解模型在不同年龄、种族、性别等方面的表现。这样，我们就能确保它的公平性并减少偏见。这堂惨痛的教训现在被认为是机器学习世界的必修课。


  ## 挑战的迷宫与不妥的权衡


  美国国税局（`IRS`）提供了 AI 偏见的一个有力案例。据发现，他们的系统对黑裔美国人产生了负面影响，主要是那些使用`所得税抵免额（Earned Income
  Tax Credit）`的人。这提出了一个关键问题：我们如何评估机器学习模型对不同种族群体的影响，特别是当明确种族数据难以获取时？


  许多公司对收集和存储与其用户种族相关的数据感到紧张。这存在对滥用和信任问题的担忧。但同时，这些公司需要确保所有种族群体的公平性。为了走好这根钢丝，一些公司采用了基于其他可用数据的预测方法。例如，`LinkedIn`
  根据用户的名字估算其性别，以平衡搜索结果中的性别比例。类似的，某些小组采用贝叶斯改进姓氏与地理编码法（`BISG`），这种方法利用用户的姓氏和地理位置来预测种族和民族。


  另一个可能的解决方案是要求一部分用户自愿提供其人口统计数据用于审计。然而，这需要高水平的信任。像 `Airbnb` 和 `LinkedIn` 这样的公司已经开始探索这条路。


  但解决 AI 偏见并不像将性能指标按社会群体划分、识别差异并修复它们那么简单。`COMPAS` 算法由于在美国被广泛用于预测再犯概率和庭审前缺席情况，该案例凸显了这种复杂性。


  新闻媒体 `ProPublica` 决定评估 `COMPAS`，重点关注不同种族群体之间的错误率。他们发现，非洲裔美国人被告的假阳性率大约是白人被告的两倍。假阴性率则约为其的一半。


  起初，这看起来可能像是一个明显的偏见案例。但如果你深入挖掘，情况会更复杂。首先，非洲裔美国人被告的再捕率高于白人被告。非洲裔美国人这种较高的假阳性率可能只是反映了他们这种较高的再捕率。


  该案例在处理不同人群的不同基准率时提出了一个棘手的困境。决策者面临着一个艰难的选择：他们要么接受不同群体之间不同的错误率，要么为不同种族群体设定不同的高风险阈值。哪种选择都有其问题，这凸显了处理
  AI 系统偏见的复杂性和敏感性。





  与 AI 系统工作通常意味着要处理一些权衡。在理想的世界里，我们应该能够处理这些权衡，并将它们与我们的目标和伦理规则对齐。在本章中，我们将深入探讨一种策略，在让系统运行得更好与确保每个人的公平之间找到平衡。


  将这些权衡想象成图上的点。一个轴显示了从 AI 工具中受益的额外人数（例如看到更多人出庭）。另一个轴显示了这些利益在不同人群之间分配的公平程度。一旦你运行通了
  AI 模型，就可以画出这幅图，以观察这两个重要因素之间的平衡。图上的每一个点都代表一个特定的政策选择——在让事情运行良好和保持公平之间取得微妙的平衡。


  这幅图确实凸显了在效率、准确性、影响力和不同群体公平性之间做出艰难选择的必要性。AI 让我们能够看清这些权衡并对其进行微调。通过使用预测模型，我们可以构建出一个系统，在图上清晰地展示我们偏好的平衡点，并与政策目标相匹配。


  记住，这不仅仅关乎伦理。它对我们制定规则的方式也产生巨大影响。人们可能对于图上最佳平衡点在哪里达成共识。但他们应该同意这幅图应该是存在的，以平衡可以衡量的关键因素。理解这一点将带来更明智的政策选择。AIAI
  促使我们对权衡进行量化，让我们更清楚地看到我们的决定导致了什么结果。例如，如果一个法官必须决定由谁获得某些福利，他们选择中隐藏的权衡可能并不明确。但通过 AI
  提供的精确预测，我们可以为这些权衡赋值。随着这种方法扩展到政策制定中，我们就可以更公平地处理这些权衡，避免依赖某人不透明的决策过程。


  这些权衡的一个真实世界案例是线广告的拍卖方式。理解正在使用的预测模型，并意识到这些模型可能导致的任何潜在不公平结果是非常重要的。


  ### 在线广告拍卖


  在线广告拍卖运作非常简单。当你访问一个在线平台时，广告商会竞价向你展示他们的广告。平台使用机器学习来猜测你点击每条广告的概率。然后，它向你展示预期带来最多资金的广告——即竞价金额与点击概率的乘积。


  但不公平之处可能从哪里溜进来呢？Facebook 的一个知名案例为我们提供了一个有用的例子。从鞋子到招聘信息，不同的广告针对不同的人群。这导致了这样的情况：女性主要看到鞋子广告，而男性看到更多工作广告，在无意中制造了不平衡。


  2018 年，美国住房和城市发展部因广告分发的这些差异起诉 Facebook。住房、工作和信贷的广告受联邦法律监管，一份结算协议要求 Facebook 确保这些类型的广告被等量展示给所有群体。这项政策意味着一种权衡——放弃
  Facebook 的部分收入，以确保所有群体获得平等的广告曝光。


  ### 理解 AI 算法背后的金钱和细节


  为了开始理解 AI 算法错综复杂的网络以及它们涉及的经济理论，让我们想象一个涉及 AI 广告算法的情景。我们把用户命名为 Sigal。Sigal 可能会看到一条能带来
  3 美元的鞋子广告。或者，她可能会看到一条收益稍少一点的广告——2 美元的工作广告。从核心上说，该算法的构建目的是从竞价价值中获得最大收益，偏离这一目标可能意味着亏钱。


  但这种计算涉及不仅仅是竞价价值。它还考虑了对用户互动概率的估计，通常由点击率衡量。用户互动较少的广告自然挣钱较少。因此，当公司微调这些算法以对抗偏见时，他们也需要考虑可能的经济后果。


  监管机构在保持 AI 系统平衡方面也发挥着关键作用。虽然他们对 AI 的了解可能没有科技公司那么多，但他们的见解和决策非常重要。他们并不是独立做决策；他们的决策由许多专家提供的技术咨询支持。记住，这些监管机构通常在实际限制和职责范围内工作，例如避免收集人口统计数据。


  因此，对监管机构行为的任何批评都应该结合本章中讨论的限制和原则来看待。虽然监管机构在解决 AI 伦理问题方面取得了进展，但考虑到技术的复杂性和多层次性，这项任务是艰巨的。


  ### AI 的深远影响


  AI 系统的影响可能是深远的。对一个人的预测和行动可能会引发连锁反应，并可能为他人制造不平衡。所以，如果你遇到一个声称`无 own`或`公平`的 AI 产品，请带着健康的怀疑态度对待它。要求对这些流行术语给出明确解释，并质疑为了减少偏见采取了哪些具体步骤。


  例如，一个 AI 系统可能承诺不同人群之间的选拔率相等，但这引发了关于潜在影响和法律问题的问题。随着 AI 变得越来越复杂，公司必须对其 AI 模型可能导致的任何不公平行为负责。


  目前，美国的反歧视法是反应性的，这意味着在问题发生后才采取行动。虽然证明算法歧视的成功案例并不多，但可能有很多模型已经接近违法。


  在总结这部分内容时，有几点需要记住。首先，基于历史数据的 AI 模型可能会无意中反映历史偏见。它们并不是解决问题的灵丹，只是反映了现有的不平衡。其次，模型使用的语境至关重要，并会极大地影响结果。在可能的情况下，这些权衡应该被清晰地说明，以培养一种透明和问责的文化。最后，始终要对`无偏见`或`公平`的
  AI 系统保持健康的怀疑。


  ## AI 领域的隐私


  ### 通过 AI 的影响解析隐私


  当我们说`隐私`时，人们会想到各种事情。有些人可能认为这指的是保持与朋友聊天的秘密。另一些人可能认为这指的是不受扰的权利。有些人可能将其视为控制谁可以看到他们的个人信息。因此，隐私不仅仅是一件事；它是一系列相关的概念。在我们谈论
  AI 和机器学习时，我们将尝试阐明隐私的这些部分以及它们为何如此重要。


  当我们谈论 AI 时，隐私为什么变成了一件大事？主要问题是 AI 需要数据——大量的数据。这些数据可以提供关于我们生活的很多。每当我们使用数据构建 AI 或机器学习模型时，我们可能都在交出一些秘密。这引发了一个问题：我们是否将其视为
  AI 进步的必要权衡？在构建高性能 AI 系统的同时，保持隐私是否很难？


  一个很好的例子是 Cambridge Analytica 丑闻。这家公司从 Facebook 获取了用户数据，并将其用于在 2016 年投放政治广告。他们想要影响民意和选举结果。尽管他们显显然违反了
  Facebook 的规则，但损害已经造成。






  此类事件促使行业对隐私变得更加谨慎。这种变化归因于新法律（如《通用数据保护条例》`GDPR`）以及巨额罚款。看看 Facebook；他们因为早期对隐私的松懈态度而遭受了巨额罚款。他们的隐私政策发生了巨大变化，从
  2013 年的几乎不存在到 2018 年的变得非常谨慎。


  当我们探索隐私和机器学习时，我们需要重新思考旧有的观念。我们需要更多地思考这些隐私问题如何塑造我们对 AI 的看法，以及科技巨头如何改变它们的策略。


  理解隐私这个迷谜意味着要观察不同的解释及其运作的背景。这不仅仅关乎保持个人聊天私或保持匿名。隐私，特别是在 AI 领域，是在追求技术进步与我们控制个人信息的基本权利之间寻找平衡。这是一个伦理、社会和技术因素的复杂混合，我们需要仔细思考并处理。这不仅仅是学术界的问题；它是理解
  AI 在我们世界中所扮演的角色和责任的关键部分。


  ## 隐私中的灰色地带


  许多人认为信息不是私有的就是公开的，仅此而已。但事实并非如此简单。在现实中，信息的访问程度有一整种范围。例如，加密数据在技术上是公开的，但它不像你公共社交媒体页面上的内容那样容易获取。从这种方式看待信息有助于我们更好地理解隐私。


  让我们来看一个真实案例。一组研究人员曾从在线约会网站 `OkCupid` 收集数据进行研究。尽管这些简介是公开的，任何可以使用互联网的人都能看到，但当这些数据被收集并公开共享时，人们感到非常愤怒。这表明，即使信息在技术上是公开的，我们可能仍然对其希望某些隐私保护。


  我们如何理解什么是私有的或公开的是一个微妙的平衡动作。随着技术的不断进步，这种平衡可能会发生变化。想象一下，如果警察利用热感应技术从停在门外的警车里观察你的房屋内部——这会侵犯你的隐私吗？随着技术的完善，我们需要更新对隐私的定义和标准。


  保持在线隐私的一种有趣方法是 `no index` 请求。这是一种工具，允许网站告诉搜索引擎不要列出某些页面，使它们更难找到。虽然这可以保护敏感信息，但也可能被滥用。例如，`TurboTax`
  使用 `no index` 请求从 Google 搜索结果中隐藏其免费版本，使得用户难以找到。


  当我们思考如何保护数据集中的隐私时，我们经常想到的第一个解决方案是 `anonymization`（匿名化）。这个想法很简单——只需从数据集中删除姓名和地址等内容，然后它就可以安全地供公众。但正如我们从过去的事件中学到的那样，这种在
  20 世纪 90 年代中期流行的基础隐私处理方法并不总是奏效。


  匿名化没有考虑到隐私的所有复杂性。它假设通过移除个人身份识别信息，我们就完全保护了隐私。但在当今的大数据世界中，人们经常通过将 `anonymized` 数据集与其他公开信息交叉引用来重新识别身份。隐私不是一件一劳永逸的事，而是一个持续的过程。随着我们使用越来越多的数据，我们需要让隐私策略变得更加复杂和灵活。


  ## 隐私之网


  当 `AOL` 曾经共享他们认为是匿名搜索数据时，事情并没有如计划进行。他们给用户分配了唯一的数字，将其与搜索关联起来。但《纽约时报》在利用这些 `anonymous`
  数据时，通过分析一个女性的搜索历史并确定她的位置，找到了一位特定的女性。这一事件有力地向我们证明，仅仅使用匿名化并不能真正保护我们的隐私安全。


  `Netflix` 这家科技巨头也遇到了类似的问题。他们为了研究目的共享了他们认为是匿名的电影观看数据。然而，研究人员显示这些数据可以与 `IMDb` 数据交叉引用，以确定用户是谁。


  这些案例凸显了一个事实：仅仅对数据进行匿名不足以解决隐私担忧。要真正保护隐私，仅仅删除个人标识符是不够的。我们需要观察正在处理的数据类型，并使用其他策略，例如添加噪声使数据更难以追溯到个人。


  当我们结合隐私和机器学习时，我们面临着一系列全新的挑战。例如，我们能从机器学习模型本身获取个人细节或训练数据的特定信息吗？当 `Getty Images` 和
  AI 模型输出案例出现时，这是一个大问题。模型产生的结果与训练图像非常相似，这表明模型以某种方式 `memorized`（记忆）了训练数据。


  更糟糕的是，这会导致敏感数据的泄露。想想我们设备上的自动补全功能，它们是由学习我们打字习惯的机器学习模型驱动的。它们可能会意外学习并建议像信用卡号或密码之类的敏感细节。


  为了解决这个问题，我们在文本数据中加入噪声，并编写了特定规则以避免存储和建议敏感细节。这一步有助于确保隐私，但也凸显了潜在的陷阱。即使是意良好的机器学习模型，也可能暴露有关其训练数据的人的敏感细节。


  在医疗保健等隐私至关重要的领域，这些弱点可能会导致严重的问题。最近的研究显示，可能从预测正确剂量的模型中提取出患者的遗传标记，这是一个可怕的隐私风险。


  所以，这里的重大教训是什么？简单来说，模型可能会泄露信息。它们揭示了数据集中人的细节。虽然这部分是它们的设计初衷之一——它们本应该从数据学习学习——但如果泄露了人的细节，就会变成一个巨大的问题。


  ## 核心要点


  - **意外的结果**：AI 模型对社会有巨大影响，有时这会导致意料之外的结果。例如，算法可能会无意中加强现有的偏见。这表明开发者在制作这些模型时需要考虑潜在问题。

  - **AI 如何影响经济**：AI 算法会对经济产生严重影响。当我们试图微调这些算法以减少偏见时，我们需要考虑可能的经济副作用。

  - **为什么监管很重要**：监管机构在保持 AI 系统平衡方面起着关键作用。他们为 AI 引入了某种程度的知识，并在不同专家的技术输入下使决策更加明智。

  - **隐私的真正含义**：隐私是一个复杂的概念，人们可以以不同的方式解释它。它可以意味着保持匿名或对个人信息拥有控制权。由于 AI 技术高度依赖数据，因此考虑隐私至关重要。






  ## 信息隐私与 AI 的演进


  - **信息访问的光谱**：信息隐私存在于一个光谱上，一端是加密数据，另一端是公共数据。随着技术的不断演进，我们对隐私的观点也需要发生改变。

  - **为什么匿名化不足以保护隐私**：仅仅对数据进行匿名化并不能完全保护隐私。仅仅因为删除了个人身份信息，并不意味着该数据集就可以安全地与公众共享。

  - **模型信息信息的危险**：机器学习模型可能会无意中泄露与其训练数据相关的人的敏感细节。这意味着我们需要更好的技术来保护隐私。

  - **对透明度和问责制的需求**：当我们开发 AI 系统时，需要重点关注透明度和问责制。如果一个 AI 系统声称自己是`unbiased`或`fair`的，我们应该对其提出质疑。我们应该询问为了减少偏见已经采取了哪些实际步骤。

  - **隐私概念的变化**：随着 AI 和机器学习的不断进步，我们对隐私的理解也需要跟上。隐私不仅仅是一个关注点——它是一个必需品。保护隐私需要用复杂的解决方案来解决复杂的问题。


  ## 现在怎么办？


  嗯，预测未来最好的方式就是创造未来。这看起来既简单又深刻。如果你在想未来五年内 AI 会变成什么样，未来 10 年内我们的生活将如何与技术融合，或者我们的孩子是否仍需要在没有数字帮助的情况下学习读写，那么你真的需要认真考虑你对明天的计划。考虑一下你工作时会做什么工作，你每天最关注的事情是什么，以及你在会议上会做出的选择。我们今天所做的一切将塑造明天发生的一切。


  让我们明确关于 AI 的一点：它不是人类，永远也不会是。以幽默为例。人们说，如果你想让别人觉得你幽默，不要告诉他们你幽默；要给他们讲个笑话。现在的 AI 并不讲笑话——它只是告诉我们它可以创作笑话。但它真的能幽默吗？这就像试图自己挠自己的痒。你知道自己哪里最怕痒，你可能非常擅长挠你的孩子直到他们停不下来，但无论你技术多好，你都无法通过挠自己来让自己大笑。


  这是为什么呢？因为大笑，像许多其他人类体验一样，不仅仅关乎身体上。它关乎意料之外、惊喜以及与让你大笑的那个人之间的情感连接。这些是 AI 即使拥有所有的算法和计算能力也无法复制的。


  AI 是一个极其实用的工具，但至关重要的是记住，它仅仅是一个工具。它可以让我们的生活更轻松，自动化无聊的任务，甚至在某种程度上模仿人类行为。但它没有人类的触感，没有自发性，没有真正理解和感受人类体验的能力。这是一个特性，而不是漏洞。这并不是
  AI 的失败——这只是记住那些让我们之所以为人类的独特、无价特质的方法。


  让我给你们讲一个我青少年时期的故事。它是那种会在学校走廊里流传的故事，没人真正知道它是从哪里来的；也许它只是一个都市传说，但无论如何，那都是一个非常酷的故事。故事是关于给一组初中学生的一项英语作业，他们被要求就一个简单的话题写论文：`What
  is bravery?`


  当我开始写这本书时，我发现自己在思考，如果今天一个学生手里握着 AI 的力量，要求语言模型帮助他们完成这篇作业，会发生什么。我决定测试一下，让一个 `GPT`
  聊天机器人描述`bravery`。以下是它吐出的内容：


  ```

  Bravery is a basic human virtue defined by the ability to face fear, danger, uncertainty,
  or hardship with guts, willpower, and toughness. It is the quality that lets people
  take on challenges, take risks, and chase their dreams despite possible obstacles
  or bad outcomes. Bravery is not the lack of fear, but winning against it. It involves
  recognizing fear but deciding not to let it control

  ```


  虽然这个答案没有错误，也没有用处，但这个回答还是有些平淡，对吧？它缺少了创造性的火花、个人色彩，以及那种能将普通论文变成脱颖而出作品的人类视角。


  那个被要求写关于勇气的论文的孩子，交上了一张只有三个字的纸：“这就是勇气。”是的，你没听错。那就是整篇论文。“这就是勇气。”这个勇敢的孩子得到的得分取决于你问的是我家乡的谁——一些人说是满分，另一些人说零分。但分数并不是故事的核心。真正的关键在于创造力的火花，人类与众不同的思考能力，以及做出没有人预料到事情的这种能力。这种创新是
  AI（无论是现在的 AI 还是即使我们在不久的未来看到的 AI）都无法复制的。


  AI 可以做很多事情，但它还没有准备好提出真正新颖、有创意的想法。它是工具，而不是人类创造力和直觉的替代品。在我们不断将 AI 引入生活和工作的不同领域时，这是必须记住的关键区别。


  ## 天赋、认可与名声


  自从在开车去伊拉特（Eilat）和家人度假时，听到一个关于名声的精彩分析后，我就一直在思考天分、认可和名声之间复杂的互动。那段路长达六小时，经过是一条相当无味的沙漠公路，我们当时在听一个名为`The
  Obvious Thing`的播客。那一集的标题是`Why is the Mona Lisa so famous?`


  我认为，蒙娜丽莎的名声与金·卡戴珊的名声相比，与其说梅西或埃尔顿·约翰更有共同点。很有意思，对吧？让我解释一下。梅西之所以闻名是因为他是世界上最好的足球运动员之一。埃尔顿·约翰同样是一个音乐界的传奇人物，他的歌曲触动了世世代。他们的才华与名声之间的联系显而易见——他们在自己的领域极其出色，而名声正是他们才华的结果。


  现在的 AI 或许可以理解这种清晰的联系。它可以处理数据，理解优秀与成名之间的因果关系，并可能根据可见的天赋和技能预测未来谁会成名。AI 甚至可能发现非足球或音乐领域的后起之星，并预测他们的成名之路。


  但这正是事情变得复杂的地方。金·卡戴珊为什么出名？是什么具体的天赋或技能让她进入了焦点焦点？她变得小有名了，上了电视，变得更有名了，又上了更多电视节目，这种循环一直持续，直到她获得了疯狂的名声。但她的名声是因为她在某方面极其优秀吗，正如我们的逻辑模型暗示的那样？答案并不是简单的`是`或`否`，我不确定
  AI 是否能理解她名声中的微妙之处。


  然而，无论 AI 是否理解，金·卡戴珊的名声都是既定事实。它是人类社会不可预测、多面且往往令人困惑的性的标志，也提醒我们，尽管 AI 拥有所有的力量潜力，但在真正理解人类行为和社会事件方面，还有很长一段路要走。


  那么，我们该如何解释蒙娜丽莎的谜团呢？其他的画更大，有些人可能会说更美、更古老，而且由成就更高的画家创作。我们甚至有 AI 创作的艺术，在视觉上可能比达芬奇的杰作更悦目。但不知为何，蒙娜丽莎处于这座艺术山之巅，它是卓越和价值的象征，价值高到几乎无价。






  我们可以对《蒙娜丽莎》处于这一特殊位置进行推测。也许是因为它被盗后又发现的戏剧性故事，这一事件让它推向了风中心。也许是时间的流逝和被反复观看的影响，为它带上了一层光环，使其变得越来越有名，甚至到了近乎崇拜的。但事实是，对于《蒙娜丽莎》无伦比的名声，并没有简单的答案或最终的解释。如果我们作为人类都难以解释，那么以
  AI 目前的水平，它不太可能解决这个谜题。


  作为对《蒙娜丽莎》地位的一种幽默致敬，请想一下这个事儿：金·卡戴珊 ian（Kim Kardashian）尽管拥有巨大的全球知名度，也去卢浮宫与《蒙娜丽莎》拍了自拍。当然，《蒙娜丽莎》并不回礼。这种等级是显而易见的——即使是名人也想吸收这幅世界上最名画作的余光。


  虽然这个故事为我们的对话增添了幽默色彩，但它也强调了一个重要的点：在理解人类行为、社会现象以及我们有时重视并推崇的非逻辑事物方面，AI 是有其局限性的。这是对我们文化基础中的微妙性、非理性和情感复杂性的承认——这些事物在目前很大程度上超出了
  AI 的触及范围。


  那么，接下来要做什么？这很简单：投入工作构建一个不可思议的世界——不仅是为了我们，也是为了我们之后的世后代。利用你所拥有的每一个工具去努力吧：无论是 AI、机器学习、深度学习，还是未来出现的任何其他高科技。利用这些工具让你变得更高效，并提高你所做每事的效能。


  但不要忘记你应该一直提问的三个重要问题：


  1. AI 是如何工作的？

  2. AI 真正擅长什么？

  3. 哪些事情我们不应该交给 AI 处理？


  ## 它是如何工作的？它真正擅长什么？它不能做什么？


  请理解，AI 尽管很聪明，但还没有完全准备好讲一个精彩的笑话。请记住，你自己产生新想法的能力比目前任何 AI 都要好——而且在未来很长一段时间内可能都是如此。


  请接受，虽然 AI 在帮助你进行战略规划方面可以发挥重要作用（如果你希望利用更多能力或市场时），但在完全依赖它产生突破性的、改变游戏规则的想法之前，你可能需要三思一下。AI
  可以帮助引导你，提供基于数据的洞察，这可能帮助你做出决策。但当涉及到真正的创新——那些改变规则、震动行业的想法时——AI 与人脑之间仍然存在巨大的鸿沟。


  充分利用 AI 能做到的，但不要忘记它不能做到的。在追求成功的道路上，要在机器智能和人类创造力之间寻求平衡。这就是我们如何构建一个利用双方长处的未来，确保为后世后代留下创新和进步的遗产。


  ## 我对 AI 的观点


  在考虑如何最好利用 AI 时，我形成了一种能指导我决定的特定观点。是的，AI 能够处理复杂的任务，但在涉及需要人类触感的复杂、细微的工作时，我倾向于依靠我的团队。AI
  的优势在于它有处理重型计算负荷的能力，但对于需要更深层次理解、共情和判断的事物，人类的投入仍然是不可或缺的。


  这是我的另一个指导原则：让 AI 的战略性思维被战术任务所塑造，而不是相反。作为领导者，我的责任是决定我们的战略——我们在哪里投入时间和资源、我们针对哪些客户、我们关注哪些地理市场，以及我们的方法是灵活且伴生的，还是僵化且周密计划的。决定我们的优先级、对威胁和机会的回应，以及我们如何分配可用资源，是我的决策。


  所以，尽管我非常欣赏 AI 的潜力，但在战略方面，那是我的领域。我乐意让 AI 帮个忙，分担大量的战术性工作。通过承担更多的常规、复杂任务，AI 可以有效地释放出更多属于我和我团队的精力，使我们能够专注于定义我们未来道路的关键战略决策。


  通过这种方式，AI 变成了一种战略伙伴，执行它最擅长的任务，并给我们留出空间和时间来处理那些人类洞察和判断至关重要的方面。我们最终获得了一种共生关系，AI 和人类各展所长，从而在各方面获得更好的结果。


  ## 释放你的潜力


  手握这本书，你就拥有了一个超级工具，它可以在 AI 和商业世界中释放你的潜力。但要真正让这个工具发挥魔力，关键在于务要掌握前面提到的三个大问题的答案。


  掌握 AI 如何工作并不意味着你必须成为编程高手。它更多是关于 AI 真正擅长什么，以及哪些事情我们不应该交给 AI。当我们谈论 AI 擅长什么时，我们谈论的是它在数据分析、自动化等领域的强大，它可以发现人类可能需要几个月甚至几年才能发现的模式。


  另一方面，记住哪些不能交给 AI 至关重要。尽管 AI 非常聪明且先进，但它缺乏人类所拥深层理解、共力和判断。在需要这些人类特质的任务上，始终要把 AI 视为助手，而不是完全交给它。


  只要对这三个问题有了清晰的思路，你就准备好利用 AI 为你、你的团队以及世界创造一个美好的未来了。


  去努力吧，在世界上留下属于你的印记。


