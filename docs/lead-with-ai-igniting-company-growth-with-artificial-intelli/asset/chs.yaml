  ## 为什么要读这本书？


  本书将 AI 从一个热词变成了行业领导者的实用工具。通过掌握书中的见解，领导者、经理和专业人士将：


  • 将 AI 无缝整合到战略决策中

  • 识别公司范围内 AI 驱动的机会

  • 评估业务环境中的潜在陷阱和局限性

  • 通过 AI 驱动的策略提升组织绩效





  我不是那种躲在实验室里的人，而更像是一个实践型的人才。我对学术界深表敬意，并且经常发现自己进入了学习者模式，因为我对知识充满了渴求。但构建和创造事物总能激起我内心更大的兴奋。我是一个与技术共生的人；从一开始我就对数学、科学和物理感到好奇。但对我来说，这不仅关乎技术本身，更关乎我们如何在现实世界中使用这些技术。


  回顾我的职业生涯，这是一段相当多元的叙述。并不是我这样计划的，但正如史蒂夫·乔布在他著名的斯坦福大学毕业典辞中所说：“你无法向前连接这些点，只有回首过去才能将它们连接起来。”这对我来说是真理。现在我可以清楚地连接职业生涯中所有的点，但只有现在，我正通过后视镜观察。


  这些多样化的经历让我对全球不同的行业、业务环境和地区有了独特的视角。我曾在半导体行业担任过技术和管理职位。在 `Applied Materials` 工作期间，我曾自己躺在
  `Intel` 和 `Samsung` 的洁净室晶圆地板上。在 `D+H` 和 `Finastra` 等公司工作期间，我曾部署金融科技核心系统，并在 `HSBC`、`Citibank`
  和 `OCBC` 等银行的高压环境中与挑客户合作。在 `AT&T` 期间，我在数字流媒体革命中担任领导角色，开发并向数百万家庭推出了视频流媒体产品。我甚至在中东最活跃的风险投资公司工作过创业之国的核心。


  但我的故事不仅有工程学院之后的职业经历。在 20 多岁时，我曾是一个经营自己酒吧餐厅的企业家。我在地中海的几艘邮轮上工作过。我做过调酒师、加油站员工、高中物理老师、当过三年的士兵，以及等等。


  你在书中读到的所有案例、业务背景、不同观点和应用，都源于我的这段历程。直到我发现了一种我知道会影响我们每个人、每个地方的技术时，我才意识到这些经历是如何汇聚的。我很兴奋分享我所学到的知识，以及这一切是如何与
  AI 联系的。


  你会发现这本书的语言轻松且平易近人的。我就是这样的人。没有需要查字典的专业术语，没有复杂的计算，也没有为了显得高级而使用的华丽辞藻。我选择书籍就像我选择餐厅一样：为了在轻松舒适的环境中获得高质量的内容。这就是我希望在书中给你的。


  ## 为什么要读这本书？](#contents.xhtml#frontmatter-03)


  *许多企业都在询问，我们如何让 AI 消费者能力达到企业级标准。*


  我们都处于一个不断变化的世界，技术突破不断改变着景观。在所有这些变化中，有一个巨大的游戏规则改变者脱颖而出——人工智能（AI）。它不仅仅是一个让企业运行更顺畅的系统；它还是我们理解、互动和塑造这个世界的全新方式。


  （注：原文中存在大量重复句子 "The phrase game-changing only describes what AI has initiated in
  business." 已根据翻译逻辑进行整合处理。）




  随着我职业的进步，技术也随之发展。我的诺基亚手机被黑莓取代，接着又被 iPhone 3 取代。随着 Facebook 的出现和 WhatsApp 的即时通讯，社交媒体时代到来。今天，我的数字足迹非常庞大。人们可以通过电子邮件找到我，通过我的两台笔记本电脑中的任何一台，或者我的三个邮箱账户与我联系。你可以给我发短信、打电话、视频聊天、给我留言语音邮件，甚至可以查看我是否读了你的信息。但一个反复出现的问题依然存在——这些进步是提高了我的效率，还是降低了效率，还是让它保持在原来的水平？与我父亲相比如何，他竟然在技术匮乏的情况下取得了如此巨大的成就？


  这种视角让我重新审视了技术在我生活中的角色。当我深入探索人工智能（AI）时代时，这些问题变得更具意义。这种通过技术带来的工作和通信的变革是一把双刃剑——它开启了新的可能性，但也让我思考，它是否让我在工作中变得更加高效。


  经常，我发现自己只是在看着孩子们：我那活泼的九岁儿子丹尼尔（Daniel），和我充满活力的 13 岁少女卡梅尔（Carmel）。我不禁好奇他们即将踏入的未来。他们现在在学校学的知识，等他们步入大学时可能被视为过时新闻。而且谁能说他们选择的职业在他们向空中抛出毕业帽时是否还存在呢？这种感觉就像我正站在流沙上，写着一本关于
  AI 的书，深知在大约 10 年后，我们所知的世界可能完全不同。所以，大问题是——虽然 AI 在小规模上帮助我们完成更多工作方面表现出色，但当我们观察大局时，它真的能改变游戏规则吗？


  对我来说，答案取决于几点——我们希望 AI 为我们做什么，以及我们决定如何引导它的增长。在 AI 把我们变成机器之前，为其注入人性化至关重要。我们必须记住，我们是血肉之躯，而不是金属和电线。技术正以惊人的速度飞速发展，但我们呢？我们的设计初衷仍然是缓慢。我们每晚都需要六到八小时的睡眠。我们渴望与人的聊天和联系。不久前我看了一位哈佛教授极极精彩的
  TED 演讲，他展示了在生活中保持紧密的社交联系是帮助我们保持快乐和长寿的要要因素。我们仍然渴望生活中简单的喜悦——睡前故事的魔力、日落的美丽、无所事事度过懒散日的快乐。在检查电子邮件之前，醒来对身边的爱人说早上好，这依然很重要，并将永远如此。我们不是机器人。我们是充满情感的复杂生物，而不是一团电线和电路的集合。


  这并不是说 AI 没有什么可以提供的。它确实有很多贡献。它可以从我们肩上分担那些无聊、重复的任务，通过预测结果帮助我们做出更好的决策，并微调我们的偏好，以便我们能够过滤掉所有噪音，找到真正对我们重要的东西。但如果过度迷恋技术，让它分散我们对那些真正体现人性的人事的注意力，那是危险的。


  在技术与人类生活之间、在 AI 与我们自然的节奏之间找到平衡：这就像是一场我们仍在学习的舞蹈。这有点像在玩杂耍，但这是我们必须做的。采纳 AI 并不意味着我们应该让它接管。它是一个工具，一个非常强大的工具，但它的存在是为了帮助我们，而不是指使我们。


  当我们迈入充满 AI 的未来时，我们必须确保我们是掌握主动权的人，而不是相反。我们需要把人性带入科技中，记住我们自然人类节奏的重要性，并确保在利用 AI 构建未来的同时，不要忘记生活。


  当我还是青少年时，如果我想和朋友聊天，我只需凭记忆拨打他们的号码。我没在开玩笑，我当时背了大约 40 个电话号码——朋友、家人和重要联系人。但后来手机出现了，所有那些背过的号码都开始遗忘。


  我还有另一段 25 岁时的强烈记忆。当时我和我的女朋友（现在已是我那了不起的妻子艾因纳特，Einat）去巴塞罗纳旅行。我们决定在那儿租一辆车，我从租赁公司借了一张地图。我实际上背下了我们的整个路线——转弯处、街道名称、每个转弯之间的距离——一切。现在，我只需要在智能手机上点几次按钮，`Google
  Maps` 或 `Waze` 就会指路。多亏了技术，我的自然方向感似乎睡着了。


  我们世界的这种变化是真实的，它让我思考我的孩子们即将踏入的未来。他们能在不依赖监控他们每一次按键的 `Grammarly` 的情况下正确拼写单词吗？他们能体验到自己寻找并发现信息的快感吗，还是会完全依赖
  AI 和搜索引擎？我甚至不想提到字典和百科全书。即使像 `Wikipedia` 这样的在线资源可能很快就会变成历史。


  当我们构建 AI 时（我也参与其中），我们需要深思并并有强烈的责任感去执行。当我们与自然语言处理系统和大语言模型对话时，我们应该记得使用“请”和“谢谢”，因为这些
  AI 模型是从我们身上学习的。它们就像在我们的数字世界中长大的孩子，我们希望教它们礼貌和善良。我们需要确保不滥用 AI，利用它目前无法追踪数据来源的缺陷。我们不能让偏见进入我们的
  AI 系统并伤害某些群体，因为制衡机制仍在追赶。现在，你是负责任的人，我也是如此，我们都是。在这个尚未学会自我管理的混乱局面中，我们是成年人。正如我之前提到的，技术正在超越我们。但这并不意味着它需要夺走我们的控制权。


  我们欠自己、欠孩子、欠后代的，是构建负责任、公平且伦理的 AI。我们应该问自己的问题不仅是想要什么样的 AI，而是为了构建这种 AI 我们需要做什么。这不仅仅是关于制作精科技，更是关于塑造一个尊重人性的世界，一个
  AI 帮助我们而非定义我们的世界。我们需要将这种理解织入 AI 开发的每一个部分，确保我们在利用 AI 构建未来的同时，没有忘记生活。


  ## 直直向前


  ### 如果我不以 AI 主导呢？





  你看，作为人类，我们对变化有着天生的排斥。这是我们所有人共同的特质。变化将我们推出熟悉的舒适区，迫使我们为了学习和适应新事物而花费精力。我们投入大量的时间和精力精通某个领域，希望在达到某种熟练水平后就能坐下来享受丰成果。但，生活往往是如此，当一种新趋势出现，或者一个带着创新想法的新老板主导了局面时，我们又被迫回到学习模式。这是一个我们许多人都不喜欢的循环——但这只是故事的一角。


  硬币的另一面是，作为人类，我们渴望在所做的事情中找到相关的目标感。这种渴望往往超越了我们对舒适的需求。我们希望自己的贡献是有意义的，我们的工作具有价值。这是我们非常看重的感觉——有时甚至比留在熟悉和从容的舒适感更为重要。


  我永远不会忘记在麻省理工学院（MIT）学习期间，受尊敬的罗伯托·里戈本教授带来的一场发人深省的演讲。我无法准确地引用他的原话，但他关于这一主题的核心理论已刻在我的记忆中。他描绘了一幅我们父母和祖辈时代典型的生命轨迹图。总的来说，我们的生活在代际之间有着类似的模式：我们出生，成长为儿童，上学，获得职业技能或学习一门手艺，然后进入职场，最后退休。这个循环，这套生命系统是相当线性且直接的。


  在一个平均寿命约为 65 岁的时代，这种模式看起来像是这样：花费六年时间从婴儿过渡到儿童，再花十年接受正规教育，用五年获得专业技能，然后工作三十年，最后享受长达约
  14 年的漫长退休生活。这种模式在一个节奏较慢、工作场所本地化且技术干扰极少的世界里运作得很好。在 51 岁时照顾孙辈或开启我们梦寐以求的环球旅行是完全合理的。这并不非得要在
  41 岁时完成。


  然而，时代已经发生了巨大变化，未来为我们和孩子带来了完全不同的现实。两种主导力量对我们这一代人施加巨大的压力，挑战着我们父母祖辈所遵循的传统生活策略。第一是寿命的延长——我们现在平均活到
  85 岁。第二，同样具有破坏性，是由 AI 等突破性技术驱动的快速发展的数字世界，它渗透到我们工作和个人生活的每一个方面。


  在当今，我们可能会花费六年的成长期从婴儿成长为儿童，接着是 12 年的学校生活，然后再花大约十年时间磨练我们的专业技能，这通常包括本科学位、研究生学位以及实习获得的实践经验。如果我们计划在
  70 岁时退休，就留下了长达四十年的重要工作期。


  这个现代时间线提出了两个重大的挑战。首先，假设在 70 岁时承担孙辈的照顾责任或实现一生的旅行梦想要困难得多。其次，更关键点是，鉴于当今快速的工业和技术进步，我们能有心地假设在大学中学到的知识在四十年后仍然具有相关价值和价值吗？


  这些变化引出了我的核心观点——学习如何利用 AI 进行领导是绝对的性。AI 正以加速的速度渗透到我们生活的每一个方面。对于我这一代人，以及之前和之后的人来说，掌握
  AI 背后的基本原理至关重要，以便在当代职场中保持相关性并持续贡献价值。当我说这些时，我指的不只是程序员或软件工程师。它也适用于商业领袖和企业经理，如果他们未能理解
  AI，并不能习惯于将其置于战略的前沿来引导他们的业务目标，就会面临被世界抛弃的风险。


  # 理解 AI


  AI 不仅仅是我们最近经常听到的酷酷词汇。它是一个改变我们世界的强大工具，在新闻中出现得越来越多，驱动着聊天机器人等事物，并冲击着不同的行业。但 AI 远比我们最初看到的更多；要真正理解它，我们需要跳出最初的兴奋。这本书旨在简化
  AI——解释它能做什么，展示它与社会的深层联系，并强调它是如何影响我们的日常生活。


  无论我们望向哪里，都能听到 AI 正在做的惊人事情。它正在改变从医疗保健到艺术的一切，让我们的安全系统变得更好，甚至引导我们的日常互联网搜索。有了所有这些信息，感觉就像在试图穿越一个复杂的迷宫。


  在金融服务行业，AI 现在正处于中心位置。首先，金融机构正在利用 AI 更好地服务客户，增强从面向客户的前台到运营后台的每个人的解决方案。其次，他们正在利用 AI
  加强自己的市场地位，确保领先于竞争对手。第三，是成本效益的吸引力。AI 具有简化运营和降低成本的潜力，使其成为任何业务极具吸引力的选择。


  AI 驱动的应用在云服务提供商中变得越来越流行。`Google`和`Microsoft`等公司正热烈地推广这种方法。这种策略旨在最初获得立足点，扩展他们的服务范围。对于拥有数据知识和技术专业的金融机构来说，向
  AI 迈进与向云服务的转型并行。随着这些实体在 AI 世界越发根深，他们也发现了更多理由将云解决方案整合到日常运营中。


  人们对 AI 有不同的看法。有些人将其视为一个新时代的开始；另一些人认为它被过度炒作。我的目标是帮助你理解这些不同的观点，对 AI 能做什么和不能做什么有一个平衡的理解。





  这本书不仅是一份指南；它是一次邀请，邀请你探索 AI 多元化的世界，并对其潜力、挑战以及它对我们所知的社会和生活的深远影响进行思索。这段旅程可能会有些复杂，但回报是对当今最具影响的技术之一进行透彻且细致的理解。


  ## 寻找平衡


  AI 和机器学习面临的一个重大障碍在于，如何在技术层面与其实际的真实世界应用之间取得正确的平衡。虽然许多资源和课程高度侧重于数学和计算方面，但这往往会导致它们与实际用途之间产生脱节。我的职业经历让我产生了一个至重要的认知：你不需要理解每一个细微的技术细节就能有效使用
  AI。在弥合这一鸿沟的关键思维工具正是我们经常使用但甚至没有察觉到的东西——`conceptualization`（概念化）。


  “概念化”的概念经常出现在基础编程和计算机科学课程中，但它的意义远超编程范畴。概念化本质上意味着忽略细枝末节，而专注于关注更广泛、更具通用性的概念。在编码时，我们经常使用
  `APIs` 和 `modules`，而无需担心它们的内部工作原理。这些组件被托付执行其功能，让我们能够专注于真正重要的事情——我们正在开发的应用程序。概念化的美之处在于，它能够将我们的注意力从单纯的以技术为导向，转向关注我们如何利用这些技术。


  应用概念化鼓励我们提出正确的问题，并从全新的视角观察问题。我们不再仅仅关注某个特定方面的功能——例如，是一个机器学习算法还是风能原理——而是可以探索更有效的方法来理解这些主题。概念化使我们能够在不需要理解其所有细微细节的情况下，处理复杂的设备。以风力发电机为例——它是由叶片、齿轮和电气系统构成的网络。尽管它非常复杂，但设计者明白，用户并不需要理解其运行的每一个方面。他们为我们提供了一个概念层，即一个简化的界面，带有易于遵循的指令和极少数的交互点。这种概念化允许我们操作复杂的系统，而不会迷失在具体的细节中。


  但概念化并不局限于风力发电机和其他设备。它是我们与日常技术互动的方式。当你使用笔记本电脑滚动网页时，你可能没有察觉后台正在发生的复杂过程。但当你点击电子邮件的`发送`时，你信任它会到达预想的收件人手中，即使你并不理解实现这一点的互联网协议。概念化允许你在使用这些技术时，而无需掌握每一个技术细节。


  然而，值得注意的是，概念化并非完美。它本质上涉及遗失一些细节。我们与技术元素的距离越远，就越有损害有效使用它们能力的风险。例如，如果我的电动滑板车电池没电了，而我甚至连最基本的充电知识都没有，我就会被困在途中。因此，开发在预设语境下运行良好且用户的界面和概念层至关重要。


  在书中，我们将更深入地探讨概念化如何赋能领导者理解并驾驭 AI 的力量。我们将探讨实际应用、战略考虑以及 AI 的社会影响。通过拥抱概念化并专注于其关键方面，我们可以驾驭
  AI 复杂的领域，并挖掘其产生影响性变革的潜力。通过这个过程，我们可以将 AI 视为一个令人敬畏的复杂网络，而是一个触手可及的工具，它能够促进创新和变革。


  ## 成为设计者


  我想谈谈 AI 世界的一项重要工作。这项工作目前非常需要，但还没有足够的熟练人才来胜任。我们之前讨论过不同的 AI 用法，但我们没有深入到收集数据、检查系统或规划如何部署它们等细节。然而，这些事情超级重要。通常，处理这些部分并不是工程师的工作。如果他们在处理这些问题时卡住了，那么项目在开始之前就注定失败了。这本书的目标是帮助你像设计者一样思考，而不是像程序员一样。


  ## 什么是 AI？


  *随着 AI 变得先进，成为通才而非专家将具有巨大的优势。*


  ### 人与机器的舞蹈


  在本质上，人工智能（AI）是一个先驱约翰·麦卡锡（John McCarthy）构想的想法。他将其描述为智能机器的艺术与科学，即让计算机理解并可能模拟人类智能。但重要的是，AI
  并不是试图完全复制人类大脑的工作方式。





  `artificial intelligence` 这个术语出现在 1956 年夏天。那时，有一项计划诞生，旨在邀请 10 位顶尖研究人员聚集在新罕什尔州汉诺威的达特茅斯学院进行夏季头脑风暴。首席组织者是
  `John McCarthy`，他设定了一个宏大的目标：在短短几个月内解决语言和抽象、问题解决以及自我改进等棘手课题。在巨大潜在收益的希望驱动下，教计算机像人类一样思考的目标是一项艰巨的任务。但这个小组充满了希望。贝尔电话实验室的
  `Claude Shannon` 是该研究集体的另一位关键人物。我们将在本书的后部分介绍他对生成式 AI 领域的巨大贡献。


  你可能会想，为什么他们会如此自信？为什么他们认为自己可以在 1956 年夏天实现如此惊不起的事情？答案在于当时的时代精神。20 世纪 50 年代中期，计算机开始在象棋中展现出真正的天赋——象棋在传统上被视为智力的测试。当时的逻辑非常简单：如果聪明的人擅长象棋，而计算机能够精通这项游戏，那么认为可以可以教计算机变得智能并不是什么巨大的跨越。


  但成为象棋冠军真的意味着你很智能吗？当时，计算机象棋的通常计划是预测未来 15 到 20 步，并选择能带来最佳棋面的走法。这一计划模仿了顶尖象棋选手的比赛方式，展示了发展智能的关键方法：观察人类行为，弄清楚这些行为背后的规则和决策过程，然后将这些规则程序化到机器。当计算机开始赢得象棋（一项被认为复杂的游戏）时，它燃起了人们的信念，即
  AI 可以处理许多人类认为挑战较小的任务。


  然而，随着 AI 故事的继续，我们发现现实往往会令我们惊讶，偏离我们的假设。我们将在接下来的章节中深入探讨这段迷人的旅程。现在，将 AI 视为一种灵活且强大的工具，不受人类生物学或行为的限制。这种更广阔的视角将为你提供坚实的基础，让你真正欣赏
  AI 的巨大潜力，为未来的深度探索做好准备。


  ## 扑克与标志


  让我们来看一个对比，以扑克游戏和日常营销任务为背景。乍看之下，许多日常营销任务可能比比扑克游戏不复杂。如果 AI 能够掌握扑克微妙的策略和无限的可能性，它难道不能以同样的效率管理其他可能可能更简单的任务吗？考虑识别公司标志（logo）这项任务。对我们来说，一眼标志通常就足够了。因此，合理的假设计算机程序在识别标志方面会异常精通，这项任务我们直觉上认为比扑克更具挑战性。


  带着这种最初的思维过程，在本世纪早些时候，曾尝试开发一种可以识别照片中的符号是否为标志的应用程序，但许多人预测这个应用需要开发团队花费半年时间才能设计。惊讶的是，这个预测非常准确；AI
  花了大约五的时间才可靠地识别标志。然而，至关的一点是，从最初提出这个想法起，这一成就花费了 50 多年。最初计划在 `McCarthy` 和朋友聚在一起的那个夏天进行的项目，最终跨越了五个世纪。那么，为什么这个看似简单的任务如此具有挑战性呢？


  扑克尽管复杂，但符合定义良好的规则。然而，现实世界的复杂性大得多。基于规则的方法依赖于显式定义每种可能性，在面对现实世界的细微差别时被证明是不够的。这导致了机器学习的兴起，算法从数据中学习，而不是被显式地编写规则。





  每种方法都有其优点，但当我们面临如识别不同犬种之类的挑战时，它们都会陷入困境。我们挣扎于定义确切的规则，而且矛盾的是，检查成千上万张狗的照片并不会带来任何新的启示。因此，两种方法都无法准确提供我们所需的内容。


  这种困境将我们引向现代机器学习的核心。想象一下重新排列这两张图片以描述一个新过程：人类退后一步，直接利用数据来制定规则，而不需要人类的洞察。这种转变体现了当前机器学习的精髓。


  起初，将基于规则和统计方法结合起来似乎是合理的。你可能认为我们可以使用规则从数据中提取洞察，这反过来会扩展我们的理解并帮助我们制定更好的规则。然而，这个过程只强调了人类参与的冗余性。我们作为中介的角并没有做出任何实质性的贡献。事实上，最有效的学习发生在我们完全从过程中抽离时。我们允许从数据中得出的洞察直接塑造规则，而无需人工干预。我们变成了过程的观察者，从中获益。这种新方法展示了数据驱动规则形成的真正力量，这也是现代机器学习的基石。


  ## 算法建模与数据建模的鸿沟


  在数据科学领域，有两种主要的文化：算法建模和数据建模。理解其中的区别将帮助你明白为什么我们正在从仅仅理解数据转向使用算法进行预测。


  将传统的统计建模想象为一个过程，你从一些原始数据开始——我们称之为 `X`。这些数据经过业务运营、市场动态或经济因素的转换，导致一个我们可以看到的结果。长期以来，目标一直是预测这个结果，分析不同部分是如何结合在一起的，并确保模型符合逻辑。这有点像尝试拼图，其中的图片是由影响结果的变量组成的。


  然而，统计和机器学习领域的一些早期创新者对这种传统方法并不满意。他们认为它无法胜任我们今天面临的许多预测问题。他们建议转向一种更灵活的方法，将数据置于中心位置。这种新方法更关注做出准确的预测，而不是理解数据连接的每一个细节。


  让我们思考一些现实生活中的情况：根据经济指标预测股价、根据购买历史猜测客户行为、根据内容判断封邮件是否会被标记为垃圾邮件，甚至根据发布策略预测产品是否会成功。尽管这些问题各异，但它们都归结为同一点——使用输入来预测输出。这就是预测建模背的核心思想；无论输入是什么或如何变化，我们仍然可以对接下来将发生什么做出准确的预测。


  这种预测建模原理就像一把瑞士军刀。它可以应用于各种语境，证明了机器学习在当今预测分析中是多么重要。


  一方面，我们有数据建模文化。它像是一个侦探，总是试图理解业务世界的因果机制和底层模型。它想要知道从输入到输出转换的 `black box` 内部发生了什么。它关乎细节以及对系统内部运作的理解。


  另一方面，作为现代 AI 的算法建模文化不会为这个 `black box` 内部发生了什么而担心。它的主要工作是做出准确的预测，而无需过多担心涉及的规则。这种文化关乎近似世界现有的规则，而对理解或精确描述这些规则的关注较少。它就像是直指终点，而不太在意旅程。


  现在，这可能看起来有些令人沮丧，特别是因为它没有关注数据内部的因果关系。但它的主要目标非常明确——做出我们可以信赖的预测。


  这种方法可能并不是所有人都能接受，但它代表了一种务实的、结果为导向的心态，符合当今行业的节奏。它支持了这样一个观点：实用性比完全理解更重要，做出准确的预测比解释一切更有价值。归根结底，最重要的不是我们是如何获得结果的，而是结果本身。而且，在我们数据驱动的世界里，做出准确预测的能力变得越来越有价值。


  ## 算法对比数据建模


  让我们通过另一个不同的例子来深入探讨算法建模和数据建模文化之间的差异。假设我们正在尝试预测一家零售业务的销售额。这里有一个价值 10 万美元的问题：我们需要完全理解消费者行为的细微差别，还是说仅仅做出准确的预测就足够了？这就是算法建模的精髓。


  但不要忘记，数据建模方法绝对还有空间，特别是当我们试图预测销售额时。这些场景需要的不仅仅是预测；它们需要对因果关系的理解。在这些情况下，关注理解和清晰度的数据建模可能会胜出。


  然而，机器学习并不是什么魔幻解决方案。它可能会下简单的错误，因为它不具备人类拥有的自然理解力。机器学习模型可以根据它从数据中检测到的模式做出预测，但它并不总是理解这些模式背后的“为什么”。它就像一只会模仿词汇但不理解其含义的鹦鹉。


  机器学习的真正力量来自于它的程序化和算法本质。它具有令人印象的能力，可以从输入预测输出，而无需理解中间发生了什么。这使得它成为许多任务的强大工具，这些任务的主要目标并不一定是理解整个过程，而是准确预测结果。


  ## 在数据主导的世界中破解


  数据科学是一个令人兴奋的领域，充满了惊喜的转折。以 Netflix 的推荐算法为例。它并不遵循人类制定的规则，而是直接从数据中创建自己的规则。机器学习负责制定规则，然后我们可以回过来看这些规则，看看是否能学到新东西。但随着这些规则变得日益复杂且数量众多，我们检查每条规则的能力开始下降。




  回到 2023 年，我们一些最关键的模型已经变得如此复杂，以至于无法完全审查。但这并不意味着这些模型已经过时或毫无价值。事实恰恰相反。尽管这些模型非常复杂，但它们在我们以数据为中心的世界中仍然是关重要的工具。答案并不是因为它们难以理解就将其抛弃，而是要调整我们处理它们的方法。


  当我们试图避免可能导致损害的意外问题时，确保安全性成为我们的首要任务。让我们以客户产品评论分析为例。尽管我们无法完全理解整个过程，但仍然仍然检查数据，并感知哪些词汇与正面或负面评价相关。偶尔，我们可能会发现一些惊喜，例如
  `sick` 这个词，在某些语境下它可以具有积极的含义。


  这些意料之外的结果表明，我们对语言及其细微差别的理解远非完美。例如，我们最初可能没有考虑到表情符号是客户评论分析中有帮助的预测指标。但在检查数据后，显而易见，表情符号具有巨大的预测能力。同样，当我们试图区分不同的客户时，特定的短语和语言风格会显著影响我们的预测。这提醒我们，我们对语言的理解以及制定规则的能力可能并没有我们想象中那么完整。


  这引发了一个引人入胜的问题：我们需要理解背后发生了什么吗？在某些情况下，答案是否定的。但在某些情况下，理解底层过程对于得出有意义的结论或做出可靠的预测至关重要。


  我们可以从这些观察中获得的一个重要教训是，语言分析就像客户评论分析一样，可以被视为任何其他数据。我们可以将这种方法应用于任何语言，即使是我们不熟悉的语言，而不需要理解语言本身。这就像一个智能外星人分析我们语言的方式：他们对此没有任何先入为主的想法，但仍然能够检测模式和规则。


  但这并不意味着所有的规则都是无关的。某些领域，例如算法交易，仍然严重依赖成熟的规则。因此，理解我们所谓的 `open-world` 问题（规则不明确或难以确定）与
  `closed-world` 问题（规则已知且直接）之间的区别至关重要。开放世界问题包括金融、社交媒体趋势、气候变化、物理某些领域和传感器数据等。闭环世界问题更多关于定义明确且受控的环境。


  在不断演变的 AI 世界中，算法建模和数据建模都在不断进步并塑造着我们的理解。两者都有各自的优缺点，但结合在一起，它们提供了关于世界以及我们在其中角色的全面图景。当我们继续探索这两种文化时，规则、理解和数据在智能领域之间迷人的互动不断讲述着一个引人入胜的故事。这一叙事正引导着
  AI 的进程以及我们走向数据驱动世界之旅。


  ## 核心要点


  - **AI 的多重身份**：AI 不仅仅关于构建能够像人类一样思考的机器。它是一个多样化的领域，旨在创建能够增强我们能力、解决复杂问题并自主决策的系统。

  - **AI 的两个支柱**：AI 基于两个基本原则构建。第一个是根据我们对问题的理解制定规则，并将这些规则编写到机器中。第二种方法（主要方法）是数据驱动的。

  - **转向数据驱动**：随着 AI 模型变得越来越复杂，管理它们的方式需要发生变化。确保一切安全并防止意外问题成为关键。

  - **统计学的作用**：机器学习是一个在 AI 讨论中不断出现的术语，它在塑造我们所所的 AI 世界方面发挥了巨大作用。

  - **AI 的两面**：AI 分为两个阵营——关于规则的算法派，以及关于预测的数据派。

  - **开放世界对阵 闭环世界**：理解 `open-world` 问题（规则不明确或难以确定）与 `closed-world` 问题（规则已知且直接）之间的区别至关重要。




  看到这种关注点的转变——从理解“为什么”到预测“是什么”——揭示了机器学习的真正力量。当我们理解它的局限性时，就能更好地欣赏它能做什么，并更明智、更熟练地利用它的能力。


  ## 用音乐赋予机器学习生命


  让我们用一个全新的真实案例来为这个概念注入活力：Spotify，这是一款以智能音乐推荐而闻名的流行在线音乐流媒体服务。如果你熟悉 Spotify，它会生成个性化的播放歌列表，为听者提供他们可能喜欢的歌曲精选。想象一下，你问
  Spotify：“根据我的喜好，我会喜欢哪些歌曲？”在几秒钟内，你就会收到一个充满潜在新宠单的播放歌列表——这简直是机器学习魔力的视觉盛宴。现在，让我们揭开面纱，看看这一切是如何结合在一起的。


  Spotify 巨大的数据库包含数百万首歌曲，每首歌都有自己的一组特征，如流派、节奏、调性和歌词。它还会考虑你的个人收听历史和偏好。通过某种方式，所有这些数据都被转化为一个个性化的音乐选择——你的
  `Discover Weekly`（每周发现）。将原始信息转换为播放歌列表似乎可能令人困惑，你可能会想，如何创建规则来实现这一点。


  专业 DJ 和音乐策展人一直都在做这种音乐匹配，对吧？他们会考虑歌曲的各种特征，并创建出与听众口味产生共鸣的播放歌列表。你可能认为他们遵循着一套固定的规则——选择某个流派，匹配节奏，选择相同的调性，可能再点缀几首惊喜曲目以增加趣味性。听起来很简单，不是吗？遗憾的是，这远非易事。


  我们正在讨论的这个——将输入（歌曲特征和听者偏好）转换为输出（播放歌列表）的过程——并不是那么容易设计的。它就像一个神秘的谜题盒。破解这个盒子的秘密才是真正的挑战。


  ## 我们日常生活中的机器学习


  你会对我们遇到预测问题的频率之高而感到惊讶——它们是我们日常生活中不可或缺的一部分。让我们回到音乐推荐的例子。诚然，考虑听者偏好（输入）并生成个性化播放歌列表（输出）的概念似乎很直观。但在现实中，事实并非如此。引导这些预测的规则可能极其复杂，将它们编写成代码是一项具有挑战性的任务。这是我们在探索
  AI 和机器学习过程中遇到的一个共同主题。


  但也有一线希望。尽管有这些障碍，机器学习可以处理广泛的问题：预测某人的偏好运动计划、判断学生会通过还是不及某门课程，或预测时尚趋势的转变。机器学习可以处理一切。连接这些场景的共同点是，我们的目标是根据某些输入
  (`X`) 预测结果 (`Y`)，即使规则书仍然模糊。


  最棒的一点是，我们不需要自己设计这些规则。我们让数据完成繁重的工作，并为我们学习规则。如今我们被数据淹没。棘手之处在于，当写下这些规则变得实际（或不可能）时，如何利用这些数据来找到这些规则。


  在深入研究之前，理解这些数据是什么样的至关重要。对于 Spotify，我们检查了歌曲流派、听者习惯和节奏等方面，并尝试预测音乐偏好。但还有哪些历史数据是有益的？哪些衡量标准可能是有用的？我们在哪里可以找到这些数据？这些问题触及了预测问题中
  `X` 和 `Y` 的核心。


  机器学习问题的概念在这个阶段可能显得有些模糊。但信不信，你可能在日常生活中遇到过它。让我们回到 Spotify 的例子。想象一下，交给你所有这些数据并被指示进行预测。你可能可能部署的首要策略之一就是回归（regression）——这是一种可能已经熟悉的统计方法。


  回归最简单的形式意味着在图上的一簇数据点之间画一条线。这看起来可能不像高科技的机器学习，但它是该领域的基础元素之一，你会在任何机器学习教科书中找到它。这个工具允许我们根据线条所显示的趋势做出预测。例如，给定一个听者过去的播放歌列表，你可以使用回归线来猜测他们下一首喜爱的歌曲。


  虽然这听起来可能过于简单，但回归解决的基础问题与我们旨在通过机器学习解决的问题是相同的。这都关乎识别模式和做出准确的预测。这正说明机器学习渗透到了我们的生活中，无论我们是否意识到这一点。


  ## 机器学习背后的齿轮


  回归让我们窥见到机器学习是如何运作的。旅程始于你获取一些输入 (`X`s) 和输出 (`Y`s)。你使用回归，它画出一条线，或者正如我们所说的，建立起权重 (`weights`)。这些权重是你做出未来预测的入场券。就像我们一直在谈论的盒子：数据从一侧进入，预测从另一侧出来。我们通常将这些预测称为
  `Y-hats`，以便将其与真实数据点（即 `Y`s）区分开来。


  这样来看，回归做的正是机器学习目标要做的：给我数据，我会交还给你这个可以做出预测的 `谜题盒`。


  有趣的是，这里有两个独立的算法在工作。如果 `algorithm`（算法）这个词听起来有点可怕，就把它看作一个技术术语，指的是一个接收输入并产生输出的程序。在这种情况下，我们有两个这样的程序在执行核心工作。


  第一个是回归算法本身。它是知道如何获取数据并将其转换为权重或系数的。第二个完全关于这些权重或系数。这个算法接收输入，将其乘以权重，并将它们全部相加，你就得到了预测。




  但请记住，有很多进行回归的方法，你选择的方法取决于你的具体需求。一种常见的方法完全关注减少误差，但这并不是唯一实现的方法。


  如果我们把回归看作一种训练算法，把权重看作一个模型，这一切就变得更有意义了。通过这种新的思维方式，我们迈向了机器学习更广阔的世界。


  这一步意味着，我们正在从仅仅处理线条和权重，转向管理更复杂的函数和模型。例如，机器学习模型可能不仅是为数据拟合一条直线，而是发现复杂的非线性关系。


  总的来说，机器学习模型可以处理比线性回归更复杂的情况。这些模型可能是所有这些输入的某些复杂函数，让我们能够发现并利用数据中的复杂模式。随着复杂性的增加，我们需要更多的数据和更先进的训练算法。


  这种额外的复杂性带来了权衡。虽然简单的模型可能不需要多少数据，但复杂的函数通常需要更多数据。关于使用多少数据和复杂性的决定通常由人工智能工程师做出。


  此外，虽然回归通常预测连续数值（例如股票价格），但机器学习可以处理更广泛的输出。它可以处理离散输出，这一过程被称为分类，而不仅仅是回归。尽管看起来像是一个巨大的飞跃，但相同的机器学习框架可以解决各种问题。


  在这种双算法的视角下，我们基本上保持了相同的结构，但增加了更多的复杂性：


  1. 训练算法接收数据并产生模型。开发更好的训练算法方面投入了大量工作，而且我们对它们有很好的理解。

  2. 模型做出预测。它是一个将输入转换为输出的程序。虽然简单的模型可能很容易理解（如回归中的系数），但更复杂的模型往往像黑盒一样。我们可能并不确切知道内部发生了什么，但这并没有阻止我们有效地使用它们。


  总结一下，回归和机器学习都涉及一个两步骤的过程：从数据创建模型，然后使用该模型进行预测。主要的区别在于每种方法能够处理的复杂程度。虽然回归对于简单的线性关系非常棒，但机器学习的设计是为了为应对更复杂的模式和更广泛的预测任务而生的。


  ## 机器学习中的艺术与科学


  我们开始发现，创建模型是科学与艺术的结合。模型的塑造不仅取决于精炼算法，还取决于调整我们提供给它们的数据。让我们来看一个例子。


  假设我们正尝试预测用户最喜欢的歌曲。如果我们改变一下，尝试预测他们最喜欢的歌曲，但根据他们最近的听歌习惯进行调整会怎样？这样调整输出并调整输入（例如，包含用户播放频率最高的流派）会导致一个不同的模型。


  虽然我们的训练算法保持不变，但我们修改的数据导致了独特的模型。这种通过调整模型所利用的数据来改变模型的做法类似于对系统进行编程。


  然而，强调机器学习缺乏灵活性至关重要。在特定数据集上训练的模型不能任意应用到不同的数据集上。如果一个回归模型被设计为使用四个变量，它不能仅仅根据三个变量就产生预测。这种僵化性提醒了我们，系统并不具备自己的智能——它是极其呆头实脑的，遵循着我们建立的精确结构。


  作为系统的设计者，你拥有选择的自由——包含哪些数据，排除哪些数据，以及预测什么结果。这种灵活性允许根据你的直觉进行微调和调整。但，记住局限性是重要的。例如，如果你在预测用户最喜欢的歌曲，在模型中遗漏他们最常喜欢的歌手的数据可能会导致系统性错误。


  收集和策展驱动模型的数据本身可能是一项任务。在我们日益数字化的世界中，我们做的大部分工作留下了数字足迹，这些足迹可以用于机器学习。流媒体历史、流派偏好和在线行为都贡献了庞大的数据池，可以增强机器学习模型。然而，数据的易访问也带来了自身的挑战，引发了关于监控、隐私和数据公平表示的问题。


  为你的机器学习模型保护数据增加了额外的复杂性。必要的数据存在吗？它在预算范围内吗？是否存在法律或隐私限制阻止其使用？解决这些问题是构建模型这一多方面任务的重要部分。


  在机器学习世界中导航类似于学习提出正确的问题。输入是什么？输出是什么？数据来源哪里？掌握这些元素对于理解系统至关重要。如果没有这种理解，你就无法完全理解模型是如何运作的，因此无法有效地对其进行微调或故障排除。


  退一步来说，我们已经探索了机器学习的微妙和复杂之处，从预测问题到模型构建的艺术与科学。我们的旅程表明，虽然这个过程可能充满挑战，但机器学习做出准确预测的能力和潜力确实是革命性的。实验的机会、仔细策展数据的必要性，以及处理复杂模型的挑战，使得这个领域成为一个令人兴奋的创新新领域。这是一个充满奇和发现的旅程，每一步都揭示了数据与预测之间微妙平衡的更多信息。


  ## 核心要点


  - **精通预测**：机器学习真正发光的地方在于它处理预测问题的能力。无论是估计房价还是预判疾病结果，传统编程在机器学习胜过的地方往往会失手。这些问题通常涉及根据从学习得到的规则集对给定的输入
  (`X`) 预测输出 (`Y`)。






  - 数据隐私与伦理查询：数字数据的泛滥带来了自身的一系列挑战，包括监控、隐私和公平代表。在收集数据时，将这些问题置于首位至关重要。

  - 掌握输入、输出和数据源：理解输入和输出是什么，以及数据来源何，是理解模型的核心部分。这种理解能够让你有效地对模型进行调整和故障排除。


  ## 内部机理](#contents.xhtml#chapter-03)


  *我们正处于一个算法编写代码来改进算法算法的时代。*


  ### 快速回顾


  在深入探讨之前，让我们花一点时间回顾一下目前为止涵盖的内容。还记得我们开始的时候吗？我们识别了特定问题、输入与输出的组合，并将它们交给了我们所谓的“训练算法”。这个算法随后将演变成一个“模型”，它是一个可以承担排序或预测等任务的方便工具。它只需要一组输入就能做出预测。这就是机器学习的本质。


  这种技术很酷的地方在于，它能够适应我们在日常生活中遇到的各种任务。想象一下，能够预测某人是否会偿还贷款，或者学生是否可能考优异，甚至一个以前罪犯是否可能再次犯罪。可能性的范围是巨大且非常有趣的。


  然而，尽管对此很感兴趣，我们往往避免尝试理解`under the hood`（内部）的细节，以弄清楚它是如何工作的。我们控制它的主要方式倾向于提供给它的数据——即野兽的食物。还记得我们讨论过理解系统的输入和输出有多重要吗？如果你不能准确地确定它们，基本上就像是在盲目摸索。目标是根据工具允许的范围尽可能准确地映射你的输入。


  之前，我们还开始制作一份“备抄”——一组你应该能够对任何系统回答的关键问题。如果这些问题让你感到困惑，那么这是一个警告信号，说明是时候深入挖掘了，去理解系统内部运作的迷宫。这些问题围绕着输入和输出展开：输出是如何产生的，哪些现实世界的测量值让系统运行起来，数据来自何处以及维护得如何。


  值得重复的是，机器学习不像你通常的编程，在编程中代码是王道。相反，在机器学习的世界里，嵌套在训练算法中的代码几乎是标准化的。让系统执行你想要操作的秘密在于通过示例向它展示你想让它做什么。这看起来可能很复杂，但通常往往是与现代机器学习系统工作时最困难的部分。由专业人士巧妙塑造的训练算法对我们来说随处可用——存储在无数互联网库中。真正的挑战并不是寻找算法——而是找到正确的数据来解决你试图修复的问题。


  ## 通过案例研究剥开层层


  让我们看看在线购物的世界。想象一下：我们正试图根据客户以前购买的内容来猜测他们可能可能想买什么。听起来很直观，对吧？你输入客户过去的购买记录，砰的一声，弹出一个建议，比如`环保产品`或`奢侈品`。但一旦你开始挖掘这个系统真正进入和产出的东西，事情就变得有点复杂了。你考虑过这些产品推荐是从哪里来的吗？如果你不是购物专家，你可能需要使用额外信息，如客户评论或问卷，并将这些结果作为你的标签。


  你标签的准确性实际上取决于零售商对客户的了解程度。如果零售商错过了某些关于客户口味变化的线索，你的模型将处于一片黑暗之中。另一方面，客户评论可能会揭示出并不那么明显的趋势。这些微小的细节会对你的结果产生巨大影响。


  我们将更仔细地观察这些细节，特别是使用人类判断制作的标签与直接从数据中提取的标签之间的对比。到目前为止，我们对标签的态度相当随意——标记`环保意识强`或`奢侈品爱好者`，而没有真正思考这些信息来自哪里。但我们越深入，就越看出不同方法的局限性，以及它们如何塑造我们所能做的事情。


  考虑一下农业。在气候变化导致天气变幻莫测的地方，农民不得不改变他们的种植计划。出现的一个想法是根据天气模式和土壤状况预测作物产量。你在这里将如何映射输入和输出？你将从哪里获取数据？你到底在尝试猜测什么？


  假设你正试图猜测一个农民的作物产量。你需要哪些信息来这个猜测？你会只使用他们过去的产量和天气记录吗？


  为了构建模型，你会将这些 `X` 和 `Y` 配对（天气、土壤状况以及相关的产量）喂到你的训练算法中。这些数据取自作物记录和天气报告的数据库或电子表格，经过你的训练算法的计算，产出你需要的模型。


  考虑我们用于训练这些模型的数据所产生的影响至关重要。回想农业的例子，一个可能被忽略的大因素是农民获得现代农业技术的机会。这是一件大事，因为这通常显示了农民之间资源的差异，并告诉我们更多关于他们的耕作实践。资源较少的农民产量可能比根据他们使用的工具或方法预期的要低。忽视这个关键因素可能会破坏你的预测。


  这表明，即使我们不知道模型的内部细节，只要我们知道使用了什么数据，就可以发现潜在的问题。这自然地引出了我们的下一个大问题——我们应该如何使用这些预测？


  当然，我们可以创建一个预测产量的系统，但这是否符合伦理取决于我们如何使用它。如果这些预测被用于干预市场价格，可能会加剧现有的不平等。但如果这些预测被用于帮助需要支持的农民，可能会带来更公平的农业结果。因此，我们如何使用这些预测是判断此类系统是否合道德的关键因素。


  ### 内容审核案例


  现在让我们把注意力转向机器学习对快速发展的社交媒体世界的影响。随着数字格局不断扩大，社交媒体平台正转向机器学习来帮助处理巨大的内容管理工作。让我们看看 Facebook
  的历程。起初，该公司雇用了成千上万的人，他们的主要工作是管理海量内容。他们必须筛选源源不断的帖子，将每条标记为符合平台规则或违反规则。


  这些标记，即我们输入和输出中的 `Y`，为机器学习系统创建了宝库。这里的 `X` 将是帖子的文本、图像或视频，而 `Y` 是告诉我们内容是否违反平台规则的标签。这个系统是目前大多数在线内容管理流程的基础。


  重要的是，当一个平台自豪使用 AI 进行内容管理时，它只是在将以前由人类主导的过程自动化。AI 或机器学习模型并没有带来任何新东西；它只是在反映人类审核员提供的数据，只是在规模上大得多。





  这里的关键点在于理解数据源在机器学习中所扮演的至关作用。数据主要来自平台本身，运营人员对每个项目进行标记。然而，这个系统可能会导致潜在的问题，特别是当原始的人工标记数据存在偏差或缺陷时。这可能导致机器学习模型产生倾斜的输出，并加剧现有的偏差。


  我们陷入了一个收集数据、将其输入训练算法以创建模型、然后使用该模型来预测或分类新数据的循环中。这个过程就像一场精细的舞蹈，每一步都会影响下一步。取决于我们如何使用和解释输出结果，这些步骤的影响可能从巨大的益处到潜在的危害。


  例如，想象一下经理对某些群体存在偏见的情况。如果这些偏差渗透到标签中，那么基于这些数据训练的机器学习模型在管理新内容时就会反映出这些偏差。这些步骤之间相互关联的性质也带来了积极影响的机会。如果管理团队经过良好培训并精心设计以避免不一致性，那么机器学习模型就可以帮助创建一个更安全、更平衡的空间。通过从准确的标签中学习，AI
  系统可以高效地处理大量内容，并帮助维护平台标准。


  这凸显了来源、输入数据质量、训练算法设计以及模型输出使用的性。机器学习旅程中的每一步都带有潜在的风险——但也提供了做出重大贡献的可能。这是一场困难的舞蹈，但必须掌握。


  ## 决策树及其实际应用


  到目前为止，你可能认为我们正在玩某种魔术。我们输入一些数据，获得输出，我们的训练算法以某种方式找到它们之间的模式。但当我们深入学习机器学习时，我们将开始揭示引擎盖下的魔力。回归只是故事的一部分。如果你现在不完全理解这些模型的方方面面，那没关系，但对它们的工作原理有一个基础的了解将会有许多益处。这可以满足你的好奇心，帮助你对使用什么数据做出更好的决策，甚至为进行更高水平的对话做好准备。


  考虑到这些益处，让我们来看看决策树，这是机器学习中常用的工具之一。让我们回到预测用户会喜欢哪种播放歌列表的例子。首先，我们需要收集一些数据。假设我们拥有关于用户的信息，包括他们喜欢的流派和播放次数最多的歌曲。我们可以使用回归来创建一个连接这些因素的线性方程，但有时回归并不是最佳选择，特别是当我们认为变量之间可能存在非线性连接时。


  假设回归感觉不太对劲，并且我们渴望尝试一些稍微复杂一点，让我介绍一下决策树。正如机器学习书籍所示，决策树看起来像一个流程图，通过提出一系列问题来引导预测。让我们尝试用我们的
  Spotify 数据创建一个。


  起初，我们可以创建一个简单的树，根据喜欢的流派对用户进行分类，预测他们喜欢的播放列表类型。这棵树可以根据音乐流派预测用户的播放列表偏好。或者我们可以根据他们播放次数最多的歌曲对用户进行分类，给我们另一棵树。每个分支预测的播放列表简单就是用户最喜欢的播放列表。但我们可以更进一步。我们可以通过首先找到喜欢的流派，然后在每个类别中找到他们播放次数最多的歌曲，建立一个更复杂的树。这棵双层树可以根据这些因素做出预测。记住，所有这些预测都是根据从数据中获得的平均值得出的。尽管我们只处理用户，但我们可以创建独特的模型为新用户做出预测。


  那么，训练算法的作用是什么？基本上，算法查看所有可能的决策树，并根据某些基准选择最好的。但在预测 Spotify 播放列表的语境下，“最好”意味着什么？显然，我们想要准确性，即你的预测与用户实际喜欢的播放列表之间的接近程度。


  考虑三种可能的树：

  - `Tree 1` 的平均错误率为 10%。

  - `Tree 2` 的错误率为 30%。

  - `Tree 3` 的错误率为 5%。


  你可能认为我们应该选择 `Tree 3`，因为它误差最少。然而，在机器学习世界中，我们对训练模型的数据和测试模型的数据之间有明确的区分。至关重要的是，如果我们在模型训练的相同数据上评估模型，它看起来可能非常准确。但并不意味着它在不同的数据上也会同样出色。如果我们把数据拟合到一个复杂模型中，这种情况是真实的，这种场景被称为“过拟合”。过拟合会导致预测结果像“巧克力茶壶”一样不可靠。


  这让我们想到了模型复杂程度与数据量之间寻求平衡的想法。更复杂的模型需要更多的数据，因为复杂性倾向于使数据稀疏，使其可靠性降低。这就是为什么无论从直觉和技术角度考虑，我们都倾向于保持简单。如果我们的模型变得太复杂，我们面临着学习数据中随机噪声的风险，而不是我们不可预测且充满噪音的世界中有意义的模式。回到我们的树，`Tree
  3` 可能具有最小的错误率，但它的数据比 `Tree 1` 更稀疏，而后者只多错了一点。最佳选择并不是一成不变的——它更像是一个判断。这就是训练算法大显身手的地方：它梳理所有可能的规则，并选择在准确性和简单之间取得最佳平衡的规则。这既是一门艺术，也是一门科学，这它变得如此有趣。如果
  Spotify 的目标仅仅是预测你的最热门单曲，它将不断地循环那首歌，可能会让你心烦。从设计上讲，它需要程度的不可预测性来识别模式，甚至偶尔引入一些它对你的偏好没有任何先验数据的曲目。


  所以，你看吧，决策树并没有初初看起来那么神秘。掌握它们的基础知识和构建方式，可以使你能够在工作中使用它们来做出预测并指导决策。记住，机器学习的魅力不仅在于复杂的模型和算法，还在于你从数据中提取的洞察。


  ## 决策树之外的旅程


  到为止，我们的机器学习引擎盖下之旅专注于决策树。但正如你可能猜到的那样，它们并不是我们工具箱中的唯一工具。我们的旅程还路过了回归分析和神经网络等其他流行方法，每种方法都按照自己的训练算法跳动，并提供不同程度的复杂性。





  将回归分析想象成一位技艺精湛的木工仔细雕琢一块木头，缓慢地显现出那条最直的直线。或者把神经网络想象成一个由互连节点组成的繁忙城市，每条连接都需要它特有的数值代码。这种循序渐进、不断精炼的过程就是我们所说的`gradient
  descent`。


  尽管风格迥异，但所有训练算法的目标都是相同的：从所选类别中找到最好的模型。因此，当你寻找某种特定类型的模型时，你的训练算法就像一个寻宝猎人，在景观中搜寻以找到该类型的最佳模型。


  根据经验，我可以告诉你坐在初级机器学习教室里看起来是什么样子的。课程的大部分内容将是关于定义一组规则或一个模型类——比如`decision trees`——然后使用独特的训练算法来寻找完美模型。这种在准确性、简单性和复杂性之间的跳跃，一切都在可用数据的严密监控下进行，正是让机器学习如此酷炫的原因。


  但请记住，这些原则并不是孤立存在的。它们是一场复杂舞蹈的一部分，不断尝试在准确性和简单性之间取得平衡。目标是建立一个足够强大的模型来正确读取数据，但又不会复杂到开始看到并不存在的模式。每种模型，无论是基于`regression`、`decision
  tree`还是`neural network`，都有它们自己的优点、缺点和独特之处。你选择哪种模型取决于你试图解决的问题以及你拥有的数据。


  机器学习的魅力在于数据、模型和算法之间这种复杂的相互作用。当我们深入探索机器学习的世界时，请记住，虽然它有时看起来让人不知从措，但正是这种复杂性让它变得如此迷人且有趣。


  从我们目前为止的旅程来看，很明显机器学习并不是魔法。它是一种建立在坚实数学原理之上的工具，通过发现数据中的模式来解决特定问题。这是一个算法从数据中学习以做出预测或决策的过程，而不需要一步步的指南。令人兴奋的部分是，虽然我们创建了算法，但正是这些算法创建了模型，然后由模型产生预测。这是一个非常完整的循环，对吧？


  带着这个想法，我将结束这一章——不是结束，只是休息一下，在这场持续的马拉松中喘口气。在接下来的章节中，我们将挖掘得更深，学习更多，并继续探索机器学习的许多其他方面。


  ## 核心要点


  - **机器学习基础**：将机器学习想象成一个超级实用的工具箱，帮助我们从大量数据中发现模式。这个工具箱由严谨的数学技术支持。它就像训练计算机程序从数据中学习并做出猜测或决策，而不需要手动编写每一个微小的步骤。

  - **了解输入和输出**：在机器学习术语中，`X`和`Y`是我们输入和输出的缩写。输入数据或`X`可以是任何东西，如文字、图片、视频……任何你能想到的。输出`Y`通常指的是我们想要预测的标签或值。

  - **训练算法的主要任务**：训练算法的主要工作是构建模型。这个模型的任务是弄清楚输入`X`和输出`Y`之间的关系。一旦搞定了这一点，这个模型就可以用于对新的、未见过的数据进行预测。

  - **好数据胜一切**：顶级机器学习系统的真正秘密是什么？高质量、相关性的数据。用于训练的数据就像机器学习模型所做预测的路线图。因此，原始数据中的任何故障或偏差都可能导致偏离或倾斜的预测。

  - **玩决策树**：`decision trees`是机器学习模型工具箱中用于预测的一种非常直接的选择。它们非常像流程图，通过一系列问题引导你走不同的路径，直到找到答案。

  - **避开过拟合**：在机器学习中，要避开过拟合。当模型变得过于复杂，以至于开始看到并不存在的模式时，就会出现问题。每种模型，无论是基于`regression`、`decision
  tree`还是`neural network`，都有它们自己的优点、缺点和独特之处。你选择哪种模型取决于你试图解决的问题以及你拥有的数据。





  # 引言

  要做到这一点不仅仅是要成为数据大师；更多的是要清楚你试图做什么以及你的数据源于何处。因此，我们需要问自己：我们的训练数据在多大程度上代表了我们想要研究的内容。答案往往是“并不理想”，但关键在于弄清当前数据与理想数据之间有多大差距。


  但还有另一个需要考虑的大问题：你的数据质量以及你拥有的数据量。查看数据集中的`variables`（变量）或`columns`（列）与统计数据点或`rows`（行）同样重要。当然，拥有更多的数据点是一件好事，但数据质量如何？增加更多或更好的变量可以使我们的预测更准确吗？


  想象一下，我们不再仅仅说一首歌是`快`或`慢`，而是知道它准确的每分钟拍数（`BPM`）。并且还添加了其他信息，如歌曲发布时间或类型。在这里，我们正试图通过更具体的信息来增强数据，以增加创建更好模型的概率。


  那么，这对我们的模型意味着什么呢？首先，它让我们更容易区分热门作品和失败之作。其次，它让我们能够以更多的方式拆分数据，从而使我们模型的预测更加精确。


  然而，这引出了一个棘的问题：我们如何决定是需要更多数据还是更高质量的数据？虽然理解更多数据的好处可能更容易，但要弄清增加更多变量有多用可能更困难一些。预测一个我们尚未衡量的变量（例如歌曲的`genre`类型）的影响，需要一些猜测，并敏锐地察觉哪些因素可能会微调预测。


  ## 定制数据相关性与质量以实现精准预测

  在你的数据集中添加更多细节或`columns`（列）可以显著提升你的预测水平。但不要忘记——简单地投入更多数据并不是什么灵丹妙药。真正的威力在于所添加信息的质量和相关性。例如，知道用户的电子邮件提供商可能会扩充你的数据集，但它对预测他们的音乐偏好并没有真正帮助。因此，在数据集中充斥变量并不是创建杀手级模型的秘密。相反，你的目标是用有意义、相关的信息来丰富你的数据集，这更多是关于创意和直觉，而不仅仅是数据收集。


  现在，让我们思考如何将现实世界的特征转换为输入变量。这并不是万无一失的过程，你不可避免会漏掉一些。当然，你可能会记录下用户喜欢的艺术家或最常听的类型，但你可能会忽略其他重要的细节。如听歌时间、用于流媒体的设备类型甚至用户的位置都可能真正影响他们的歌单偏好，但它们可能无法进入你的数据集。


  无论你付出了多少努力，你的数据集总会有些不完整，因为将现实世界翻译成数据意味着丢失某些信息。识别这些差距并理解它们的影响至关重要。例如，如果你的模型没有考虑到用户通常听音乐的时间，那么它在尝试为夜猫型或早起鸟类预测歌单时可能会遇到困难。根据这些差距的大小，它们可能会影响你对模型预测的解释，甚至影响你是否认为这些预测是可靠的。


  所以，总而言之，当你构建模型时，你需要跳出识别输入之外的思考。你还应该考虑数据可能忽略了现实世界中的哪些相关部分。这种更广泛的视角将帮助你构建一个更全面的预测模型。


  ## 理解核心概念及其重要性

  当我们深入研究时，会遇到“分层系统”这一核心概念。它关关于一步步地学习较小的概念。这可能感觉像是我们突然改变了话题，但这是理解问题的关键概念。大多数时候，复杂任务实际上是一系列同时发生的较小任务。


  在机器学习模型中，包含这些较小任务的方法有两种主要方式。你可以为每个任务创建一个单独的模型，但那意味着你需要为每个任务都准备数据。或者，你可以设计模型让它们自己学会执行这些任务。


  这两种方法是解决较小任务的不同途径。第一种方法将责任放在系统设计者身上，让他们去识别并教授这些任务；而第二种方法则让模型自己学习并确定任务。


  每种方法都有优劣。直接教授小任务意味着你需要对任务有良好的理解并拥有正确的数据。你可以检查系统在每个阶段的表现，但你可能会错过你未察觉的重要任务。


  另一方面，让系统自己学习赋予它更大的灵活性，但它可能需要更多数据。这意味着你无法看到模型运行得如何，特别是对于像识别行人这样的任务。


  例如，像 Spotify 的 Discover Weekly 这样的音乐推荐系统使用了这种自学习方法。它没有预先定义音乐类型，而是学习并确定它自己的较小任务。通过这种方式，它成功地发现了歌曲的独特特征，例如颤音或低音鼓，这些是音频工程师可能没有特意指出的。


  这说明了当机器学习算法被允许学习自己的较小任务时，它们是多么强大且高效。理解这些较小任务以及如何在机器学习中使用它们，为充分利用数据开启了新机会，从而产生更准确、更先进的预测模型。它表明，在机器学习中，最终目标和达到该目标所需的步骤（或最终结果与较小任务）都是至关重要的。


  ## 高质量数据

  让我们进入数据获取的细微差别以及高质量数据的存在如何引导我们旨在解决的问题类型。这个概念即使在我们处理生成式 AI 时也适用，生成式 AI 似乎是从空产生文本或图像等输出。事实上，创建这些生成式
  AI 系统的复杂性与过程中的特定部分相关——微调（fintuning）。这里的挑战在于监督学习方面；获取体现我们寻求解决的问题的合适输入-输出对。


  需要强调的一点是，AI 只能访问提供的数据，而没有更广泛的世界背景。在任何任务中，确保将相关信息编码到供监督学习系统使用的数据中都是重要的。任何未包含在数据中的内容、你未能捕捉的信息，都不会魔迹地出现在模型中。


  通过理解并实施这些见解，我们可以优化数据收集过程，并更好地指导我们引导 AI 系统去解决的问题类型。下一步，让我们完成一些实践任务，以应用并强化这些概念。


  **检测诈骗的复杂性**






  一直令许多大型公司感到困扰的一个大问题是在线购物世界中的诈骗检测。随着在线购物变得日益常化，从日常必需品到大件家居用品，将欺诈交易与合法交易区分开来的挑战已显著增加。


  初看之下，你可能会想：“让我们用 AI 来解决这个问题吧。”这种方法看起来非常简单——收集大量的交易数据，识别出可疑交易，使用这些标记好的数据训练机器学习模型，然后，哒的一声，你就拥有了一个能够标记潜在诈骗的自动化系统。许多金融机构和数字支付平台确实在朝着这个方向努力，希望开发出基于机器学习的解决方案来降低在线诈骗的风险。


  但很快就会发现，这条路上充满了重重障碍。一个重大障碍是决定如何对交易进行标记。由谁来决定哪些交易可能是欺诈的？他们根据什么依据做出这种判断？他们是在对每笔交易进行详尽的调查，还是根据浅层次的模式做出快速决定？


  现在，考虑这种情况：如果负责识别诈骗的人员无法对什么构成诈骗达成共识，那么在这些不一致的数据上训练的机器学习模型也将同样不确定。这与预测明天是否下雨不同，因为大家对什么构成下雨是有共识的；潜在欺诈交易的标记具有高度的主观性，这使得构建一个普遍接受的模型变得极具挑战性。


  更复杂的是，诈骗在不断演变。诈骗者不断调整策略，变得越来越复杂且难以检测。在线诈骗的这种动态本质进一步复杂化了检测过程。


  尽管检测在线诈骗最初看起来可能只是简单的数据收集和处理问题，但其内在问题要复杂得多。它们涉及到识别哪些交易可能是欺诈的微妙任务，因为你必须跟上诈骗者策略快速变化的本质。总之，检测在线诈骗不仅仅是处理数字；它是一个需要敏锐且灵活解决方案的复杂谜。


  ### 过去数据的局限性


  想象一个在线诈骗，声称某个热门电子商务网站在未来一小时内提供 95% 的折扣。这可能是一个真实的限时促销活动，也可能是一次针对毫无防备的购物者的欺诈尝试。在过去数据上训练的
  AI 系统无法区分这两种场景——它没有对该电商网站当前促销活动的实时洞察。同样，如果诈骗者制造了一个关于新货运规定导致重大延误的虚假信息，AI 系统无法仅通过过去的数据来验证这一说法。


  这种对过去数据的依赖是 AI 的一个根本局限。基于历史数据的模式匹配无法为当前或未来事件提供有价值的见解。这并不是通过简单获取更多或更好的数据就能解决的局限性。它是
  AI 工作的一个基本方面，在对基于 AI 的解决方案设定预期时，这一点至关重要。


  关键点在于：将现实世界的事件转换为数据集可能会限制我们通过 AI 实现的目标。你可能会想：“我想要一个能够准确检测在线诈骗的 AI 系统”，这看起来很合理。毕竟，一个人类专家团队可以检查单笔交易并识别潜在的诈骗，那么为什么
  AI 系统不能做同样的事情呢？


  挑战在于训练 AI 系统所需的数据的性质。人类专家可以获取大量的上下文信息，而 AI 系统只能从提供给它的特定数据中学习。因此，对人类来说似乎很简单的任务，对
  AI 来说可能极其困难，甚至是不可能的。


  因此，当我们计划使用 AI 来解决某些任务时，即使任务看似可行且简单，也需要进行调整或重新定义。这并不是技术的缺陷，而是反映了机器学习的本质特性——它依赖历史数据来对现在或未来做出预测。


  ### 从揭露诈骗到暴露机器人


  让我们从另一个角度来看这个问题。许多平台并没有尝试孤立出数字宇宙中的每一个诈骗，而是决定退后一步，关注一个更广泛的目标：诈骗背后的机器人。事实证明，这项任务没那么复杂，因为关于什么账户符合机器人的定义，人们有更多的共识。


  想想：想象一个在线平台在创建账户时有一个特殊的筛选测试。假设它要求解决一个小谜题或回答一个需要类人类思考和反应的问题，这超出了机器人的能力。这种方法可以根据账户在这些测试中的表现，将账户标记为
  `bot`（机器人）或 `not a bot`（非机器人）。


  我们在这里所做的是一种转折。我们不再深陷于这是否为在线诈骗的问题，而是转向另一个更直接的问题：“这个账户是由机器人操作的吗？”与识别诈骗相比，收集有关机器人活动的可靠数据通常没那么棘手。


  然而，请记住，我们在这里处理的是稍有不同的问题。如果我们的目标是检测诈骗，我们的本能反应是在内容被标记为诈骗时立即将其删除。但对于机器人检测，反应可能会有所不同。也许我们会限制机器人账户的活动，也许限制其覆盖范围而不是完全删除。存在多种可能的反应，因为归根结底，我们解决的是一个不同的问题。


  所以，这就是黄金法则：你有一个想要解决的问题（诈骗检测），然后有一个相邻的、没那么复杂的问题（机器人检测）。游戏的关键在于识别这个相邻的问题，有效地解决它，并将其作为替代方案以实现你最初在原始问题中想要实现的目标。


  ### 总结


  AI 无法理顺我们人类之间混乱的争论。而且信你不信，有时它会让情况变得更糟。它可以用机器学习系统所谓的`公平性`来掩盖我们的争议。你可能不同于标记人员，但一旦任务交给了
  AI，还有谁来争论呢？你可能会认为机器学习是中立且正确的，但实际上它只是在重复你最初反对的标记。


  你可能会遇到的另一个问题是精确定义你想预测的内容非常困难。我们可能对理想输出有基本的了解，但将其转换为适应数据集的量化列……这是一个真正的挑战。这个问题不仅限于检测诈骗或识别机器人；它还延伸到了诸如信誉状况或资质等模糊的概念。当然，如果我们能让
  AI 预测谁是合格的申请人，那太棒了。但这与出现在你数据集中的实际变量并不完全相同。





  这个问题具有特定的结构。问题在于：我们如何能将一个通用的输出“去形态化”，转化为我们实际上可以衡量的东西？如果我们尝试将这个问题翻译成机器可以理解的专业术语，可能会这样问：你的数据集标签（`Y`）与你想要的实际结果有什么区别？如果你想检测一个`qualified`（合格）的申请者，你实际上测量了什么？如果你想识别`scams`（诈骗），你实际上测量了什么？识别这些差异关重要，因为它们告诉我们我们在构建系统时忽略了哪些内容。


  ## 核心要点


  - **为决策树准备数据**：当流程涉及构建决策树时，你既需要考虑数据量，也要考虑质量。更多的数据允许你构建更复杂的模型，而更好、更相关的变量则能为你提供更详尽的洞察。

  - **拥有良好代表性的数据**：你需要确保用于模型的数据能够很好地反映你所要预测的情况。理解完美数据与你实际拥有的数据之间的任何差异都超级重要。

  - **增强数据的预测性**：在数据中添加更多具体的变量可以提高你的预测效果。你可能需要将宽泛的类别替换为精确的测量，或者引入可能改变结果的新变量。

  - **找到数据数量与质量的完美平衡**：增加数据是一件好事，但你需要确保这些额外数据是高质量且相关的。仅仅增加变量并不会让模型变得更好，除非这些变量提供了有用的、具有预测性的洞察。

  - **意识到你的数据并非完美**：当你将现实现象转化为数据时，可能会丢失一些信息。了解这一事实可以帮助你发现模型中可能的系统性错误，并引导你理解模型的预测结果。

  - **在机器学习系统中使用分层**：复杂任务通常取决于较小的任务或概念。将这些包含在机器学习模型中的方法主要两种：你可以为每个任务创建一个特定的模型，也可以创建能够自主学习这些任务的模型。

  - **在教授较小任务时选择灵活性或权衡**：在机器学习模型中包含较小任务的两种方式各有优劣。直接教授任务允许你检查模型的表现，但你可能会错过重要的任务。另一方面，让模型自主学习可以获得更灵活的模型，但它可能需要更多数据，并且更难观察模型的表现。

  - **让模型自主学习较小任务**：有时，当机器学习算法被允许学习自己的较小任务时，它们会变得更强大高效。这意味着它们可以识别并利用数据中人类可能没有特别指出的部分。


  ## 生成式 AI 与语言模型


  大语言模型所做的，是进一步使深度计算的获取民主化。


  ### 生成式 AI 及其变革力量


  如果你一直听到关于生成式 AI 的热议，并好奇这到底是什么，那么你来对地方了。在本章中，我们将解读生成式 AI。我们将从它的早期开始，观察它是如何成长的，并思考它可能向何处发展。


  要真正理解现在的 AI，我们需要回到过去，追踪它从开始的旅程，看看它的增长是如何与我们业务模式的演变并行的。我们所看到的 AI 热潮不仅仅是技术的进步，它也是我们社会成长的反映。


  我们将看看生成式 AI 为各个领域带来的巨大变化。我们将关注一些改变游戏规则的者，比如 `DALL·E`（一个正在改变设计世界的图像生成器）和 `ChatGPT`（一个可以像人类一样聊天的文本生成器）。这些超级酷炫的技术进步不仅将我们的创造力推向了新高度，还开启了一个我们以前无法想象的创新时代。


  当我们深入 AI 开发的细节时，我们将拆解从简单 AI 模型到真正理解语境的复杂系统的转变。你将看到 AI 如何从根据一组数据做出预测的基础设置，演变为能够学习、解释并产生新的、但仍然相关的结果的高级模型。


  在本章结束时，你将很好地掌握生成式 AI 从何处开始以及它现在是什么样的。这样，你就能准备好思考它未来可能向何方发展。有了这些工具，你已经准备好将生成式 AI
  引入你的工作生活，充分利用其原理，并探索其无尽的。带着这种全新的视角，你将准备好积极塑造这个快速变化领域的未来，并在我们快速发展的数字世界中提升你的做事方式。


  ### 强大的盟友点增长与创新


  想象你正在经营一家公司，正准备推出这款非常酷、极具创新的产品。做新事物令人兴奋，但诚实地说，内心也有细微的疑虑。你有一支出色的团队、一个稳健的计划，并将资源放在了它们需要的地方。但要准确预测会发生什么？这感觉就像试图穿透浓雾。那么，如果你有一个超级工具在你的身边——一个生成式
  AI 助手，它可以为你提供宝贵的洞察、发现趋势，甚至帮助你完成产品开发的创意部分，会怎样？


  这不是对未来的预告，而是正在发生的事情。生成式 AI 正在冲击各行业的创意流程，展示了它作为激发灵感伙伴的价值。像 `DALL·E` 和 `ChatGPT` 这样突破性的模型告诉我们，生成式
  AI 不仅仅是计算和预测，它是创意过程的一部分。





  要理解生成式人工智能和语言模型的开端，我们需要穿越回 20 世纪 40 年代。在那个时代，统计语言模型的理念与如今 AI 在某些领域的地位一样具有开创性。这一变革性概念背后的一个先驱大脑是才华的数学家克劳德·香农（Claude
  Shannon）。这位来自贝尔实验室的克劳德·香农，与其之前的章节讨论过的约翰·麦卡锡（John McCarthy）共同参与了具有里程碑意义的 1956 年达特会议。


  香农从一个基础但强大的概念开始了他的旅程，将英语想象成一个由 26 个字符和空格组成的随机生成的系统。这个想法就像一个商业想法的诞生——原始且有些混乱，但它标志着某种重大事件的开始。


  通过基于反馈的细致提炼和迭代调整，香农的模型开始展现出潜力。通过识别字符序列，他在创建看起来相当真实的文本方面取得了巨大进展。这类似于企业对其产品进行微调，以更好地满足市场需求。


  提炼模型、从字符转向单词的循环，就像企业扩大其运营规模。香农证明，通过根据上一个单词预测下一个单词，他可以组合出一系列英语单词。虽然这些句子缺乏逻辑连贯性，但它们看起来非常像英语。尽管受限于当时的计算能力，香农的远见为如今的语言模型铺平了道路。


  让我们深入探讨，了解像 AI 聊天机器人这样的语言模型是如何工作的。想象一张巨大的表格，宽度达 100,000 个单词，高度直达惊人的 `10²⁰`。每个单元格代表了潜在单词序列词海中的一个微小可能。这是一个令人难以置信的想法，对吧？


  然而，这种方法被证明是不可行的。想一下，追踪的不仅仅是三个，而是之前的 20 个单词。突然之间，潜在的组合超过了已知宇宙中原子的总数！这项严峻的挑战令人望而却畏。


