    ## 55 General case of error attribution


    Here are the general steps for error attribution. Suppose the pipeline has three
    steps A, B and C, where A feeds directly into B, and B feeds directly into C.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_110_0.png)


    For each mistake the system makes on the dev set:


    - 1. Try manually modifying A’s output to be a “perfect” output (e.g., the “perfect”
    bounding box for the cat), and run the rest of the pipeline B, C on this output.
    If the algorithm now gives a correct output, then this shows that, if only A had
    given a better output, the overall algorithm’s output would have been correct;
    thus, you can attribute this error to component A. Otherwise, go on to Step 2.

    - 2. Try manually modifying B’s output to be the “perfect” output for B. If the
    algorithm now gives a correct output, then attribute the error to component B.
    Otherwise, go on to Step 3.

    - 3. Attribute the error to component C.


    Let''s look at a more complex example:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_110_1.png)


    Your self-driving car uses this pipeline. How do you use error analysis by parts
    to decide which component(s) to focus on?


    You can map the three components to A, B, C as follows:


    - A: Detect cars

    - B: Detect pedestrians

    - C: Plan path for car


    Following the procedure described above, suppose you test out your car on a closed
    track and find a case where the car chooses a more jarring steering direction
    than a skilled driver would. In the self-driving world, such a case is usually
    called a **scenario**. You would then:


    - 1. Try manually modifying A (detecting cars)’s output to be a “perfect” output
    (e.g., manually go in and tell it where the other cars are). Run the rest of the
    pipeline B, C as before, but allow C (plan path) to use A’s now perfect output.
    If the algorithm now plans a much better path for the car, then this shows that,
    if only A had given a better output, the overall algorithm’s output would have
    been better; Thus, you can attribute this error to component A. Otherwise, go
    on to Step 2.

    - 2. Try manually modifying B (detect pedestrians)’s output to be the “perfect”
    output for B. If the algorithm now gives a correct output, then attribute the
    error to component B. Otherwise, go on to Step 3.

    - 3. Attribute the error to component C.


    The components of an ML pipeline should be ordered according to a Directed Acyclic
    Graph (DAG), meaning that you should be able to compute them in some fixed left-to-right
    order, and later components should depend only on earlier components’ outputs.
    So long as the mapping of the components to the A->B->C order follows the DAG
    ordering, then the error analysis will be fine. You might get slightly different
    results if you swap A and B:


    - A: Detect pedestrians (was previously *Detect cars*)

    - B: Detect cars (was previously *Detect pedestrians*)

    - C: Plan path for car


    But the results of this analysis would still be valid and give good guidance for
    where to focus your attention.


    ## 56 Error analysis by parts and comparison to human-level performance


    Carrying out error analysis on a learning algorithm is like using data science
    to analyze an ML system’s mistakes in order to derive insights about what to do
    next. At its most basic, error analysis by parts tells us what component(s) performance
    is (are) worth the greatest effort to improve.


    Say you have a dataset about customers buying things on a website. A data scientist
    may have many different ways of analyzing the data. She may draw many different
    conclusions about whether the website should raise prices, about the lifetime
    value of customers acquired through different marketing campaigns, and so on.
    There is no one “right” way to analyze a dataset, and there are many possible
    useful insights one could draw. Similarly, there is no one “right” way to carry
    out error analysis. Through these chapters you have learned many of the most common
    design patterns for drawing useful insights about your ML system, but you should
    feel free to experiment with other ways of analyzing errors as well.


    Let''s return to the self-driving application, where a car detection algorithm
    outputs the location (and perhaps velocity) of the nearby cars, a pedestrian detection
    algorithm outputs the location of the nearby pedestrians, and these two outputs
    are finally used to plan a path for the car.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_112_0.png)


    To debug this pipeline, rather than rigorously following the procedure you saw
    in the previous chapter, you could more informally ask:


    - 1. How far is the Detect cars component from human-level performance at detecting
    cars?

    - 2. How far is the Detect pedestrians component from human-level performance?

    - 3. How far is the overall system’s performance from human-level performance?
    Here, human-level performance assumes the human has to plan a path for the car
    given only the outputs from the previous two pipeline components (rather than
    access to the camera images). In other words, how does the Plan path component’s
    performance compare to that of a human’s, when the human is given only the same
    input?


    If you find that one of the components is far from human-level performance, you
    now have a good case to focus on improving the performance of that component.


    Many error analysis processes work best when we are trying to automate something
    humans can do and can thus benchmark against human-level performance. Most of
    our preceding examples had this implicit assumption. If you are building an ML
    system where the final output or some of the intermediate components are doing
    things that even humans cannot do well, then some of these procedures will not
    apply.


    This is another advantage of working on problems that humans can solve--you have
    more powerful error analysis tools, and thus you can prioritize your team’s work
    more efficiently.


    ## 57 Spotting a flawed ML pipeline


    What if each individual component of your ML pipeline is performing at human-level
    performance or near-human-level performance, but the overall pipeline falls far
    short of human-level? This usually means that the pipeline is flawed and needs
    to be redesigned. Error analysis can also help you understand if you need to redesign
    your pipeline.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_114_0.png)


    In the previous chapter, we posed the question of whether each of the three components’
    performance is at human level. Suppose the answer to all three questions is yes.
    That is:


    - 1. The Detect cars component is at (roughly) human-level performance for detecting
    cars from the camera images.

    - 2. The Detect pedestrians component is at (roughly) human-level performance
    for detecting pedestrians from the camera images.

    - 3. Compared to a human that has to plan a path for the car given only the outputs
    from the previous two pipeline components (rather than access to the camera images),
    the Plan path component’s performance is at a similar level.


    However, your overall self-driving car is performing significantly below human-level
    performance. I.e., humans given access to the camera images can plan significantly
    better paths for the car. What conclusion can you draw?


    The only possible conclusion is that the ML pipeline is flawed. In this case,
    the Plan path component is doing as well as it can given its inputs, but the inputs
    do not contain enough information. You should ask yourself what other information,
    other than the outputs from the two earlier pipeline components, is needed to
    plan paths very well for a car to drive. In other words, what other information
    does a skilled human driver need?


    For example, suppose you realize that a human driver also needs to know the location
    of the lane markings. This suggests that you should redesign the pipeline as follows¹⁸:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_115_0.png)


    Ultimately, if you don’t think your pipeline as a whole will achieve human-level
    performance, even if every individual component has human-level performance (remember
    that you are comparing to a human who is given the same input as the component),
    then the pipeline is flawed and should be redesigned.


    ¹⁸ In the self-driving example above, in theory one could solve this problem by
    also feeding the raw camera image into the planning component. However, this would
    violate the design principle of “Task simplicity” described in Chapter 51, because
    the path planning module now needs to input a raw image and has a very complex
    task to solve. That’s why adding a Detect lane markings component is a better
    choice--it helps get the important and previously missing information about lane
    markings to the path planning module, but you avoid making any particular module
    overly complex to build/train.

