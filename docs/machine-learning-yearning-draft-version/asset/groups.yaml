    \n![](img/9e8f77e479d4500e7b1f65b2be9fce44_92_0.png)\n\nThe components work as\
    \ follows:\n\n+   1. Compute features: Extract hand-designed features, such as\
    \ MFCC (Mel-frequency cepstrum coefficients) features, which try to capture the\
    \ content of an utterance while disregarding less relevant properties, such as\
    \ the speaker’s pitch.\n+   \n+   2. Phoneme recognizer: Some linguists believe\
    \ that there are basic units of sound called “phonemes.” For example, the initial\
    \ “k” sound in “keep” is the same phoneme as the “c” sound in “cake.” This system\
    \ tries to recognize the phonemes in the audio clip.\n+   \n+   3. Final recognizer:\
    \ Take the sequence of recognized phonemes, and try to string them together into\
    \ an output transcript.\n\nIn contrast, an end-to-end system might input an audio\
    \ clip, and try to directly output the transcript:\n\n![](img/9e8f77e479d4500e7b1f65b2be9fce44_92_1.png)\n\
    \nSo far, we have only described machine learning “pipelines” that are completely\
    \ linear: the output is sequentially passed from one staged to the next. Pipelines\
    \ can be more complex. For example, here is a simple architecture for an autonomous\
    \ car:\n\n![](img/9e8f77e479d4500e7b1f65b2be9fce44_92_2.png)"
  - '[PAGE 93]


    It has three components: One detects other cars using the camera images; one detects
    pedestrians; then a final component plans a path for our own car that avoids the
    cars and pedestrians.


    Not every component in a pipeline has to be learned. For example, the literature
    on “robot motion planning” has numerous algorithms for the final path planning
    step for the car. Many of these algorithms do not involve learning.


    In contrast, and end-to-end approach might try to take in the sensor inputs and
    directly output the steering direction:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_93_0.png)


    Even though end-to-end learning has seen many successes, it is not always the
    best approach. For example, end-to-end speech recognition works well. But I’m
    skeptical about end-to-end learning for autonomous driving. The next few chapters
    explain why.'
  - '[PAGE 94]


    # 49 Pros and cons of end-to-end learning


    Consider the same speech pipeline from our earlier example:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_94_0.png)


    Many parts of this pipeline were “hand-engineered”:


    +   - MFCCs are a set of hand-designed audio features. Although they provide a
    reasonable summary of the audio input, they also simplify the input signal by
    throwing some information away.

    +   - Phonemes are an invention of linguists. They are an imperfect representation
    of speech sounds. To the extent that phonemes are a poor approximation of reality,
    forcing an algorithm to use a phoneme representation will limit the speech system’s
    performance.


    These hand-engineered components limit the potential performance of the speech
