    ## 43 人工数据合成


    你的语音系统需要更多听起来像是车内采集的数据。与其在开车时收集大量数据，也许有一种更简单的方法来获取这些数据：通过人工合成。


    假设你获得了大量汽车/道路噪音音频片段。你可以从多个网站下载这些数据。假设你还有一个大量的人在安静房间里说话的训练集。如果你取一段人说话的音频片段并“add”到一段汽车/道路噪音的音频片段上，你将得到一段听起来像是那个人在嘈杂的汽车里说话的音频片段。通过这个过程，你可以“synthesize”大量听起来像是车内采集的数据。


    更一般地说，在几种情况下，人工数据合成允许你创建一个与开发集相当匹配的庞大数据集。让我们以猫图像检测器作为第二个例子。你注意到开发集中的图像运动模糊更多，因为它们往往来自使用手机拍照时手机略有移动的手机用户。你可以从互联网图像的训练集中取非模糊图像，并为其添加模拟的运动模糊，从而使其更类似于开发集。


    请记住，人工数据合成有其挑战：有时创建对人来说看起来逼真的合成数据比创建对计算机来说看起来逼真的合成数据更容易。例如，假设你有 1,000 小时的语音训练数据，但只有
    1 小时的汽车噪音。如果你反复使用相同的 1 小时汽车噪音与原始 1,000 小时训练数据的不同部分，你将得到一个合成数据集，其中相同的汽车噪音一遍又一遍地重复。虽然听这段音频的人可能无法分辨——对我们大多数人来说所有的汽车噪音听起来都一样——但学习算法可能会“overfit”到这
    1 小时的汽车噪音上。因此，它可能无法很好地推广到汽车噪音听起来不同的新音频片段。


    或者，假设你有 1,000 小时的独特汽车噪音，但所有这些都只来自 10 辆不同的汽车。在这种情况下，算法可能会“overfit”到这 10 辆汽车，如果在不同汽车的音频上测试，性能会很差。不幸的是，这些问题很难发现。


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_82_0.png)


    再举一个例子，假设你正在构建一个计算机视觉系统来识别汽车。假设你与一家视频游戏公司合作，该公司拥有几辆汽车的计算机图形模型。为了训练你的算法，你使用这些模型生成汽车的合成图像。即使合成图像看起来非常逼真，这种方法（已被许多人独立提出）可能也不会工作得很好。视频游戏可能整个游戏只有
    ~20 种汽车设计。制作一辆汽车的 3D 汽车模型非常昂贵；如果你在玩游戏，你可能不会注意到你一次又一次看到相同的汽车，也许只是涂装不同。也就是说，这些数据对你来说看起来非常逼真。但与道路上所有汽车的集合——因此你在开发/测试集中可能看到的内容相比，这
    20 辆合成汽车只捕捉到世界汽车分布的极其微小的一部分。因此，如果你的 100,000 个训练示例都来自这 20 辆汽车，你的系统将“overfit”到这
    20 种特定的汽车设计上，并且无法很好地推广到包含其他汽车设计的开发/测试集。


    在合成数据时，请思考一下你是否真的在合成一组有代表性的示例。尽量避免给合成数据添加使学习算法能够区分合成与非合成示例的属性——例如，如果所有合成数据都来自
    20 种汽车设计中的一种，或者所有合成音频都只来自 1 小时的汽车噪音。这种建议很难遵循。


    在进行数据合成工作时，我的团队有时需要花几周时间才生产出细节足够接近实际分布的数据，以至于合成数据能产生显著效果。但如果你能把细节做对，你就可以突然访问到比以前大得多的训练集。


    ## 调试推理算法


    ## 44 优化验证测试


    假设你正在构建一个语音识别系统。你的系统通过输入音频片段 A，并为每个可能的输出句子 S 计算某个 Score_A(S)。例如，你可能尝试估计 Score_A(S)
    = P(S|A)，即在输入音频为 A 的情况下，正确输出转录为句子 S 的概率。


    给定一种计算 Score_A(S) 的方法，你仍然需要找到使之最大化的英文句子 S：


    Output = arg max_S Score_A(S)


    你如何计算上面的“arg max”？如果英语有 50,000 个词，那么长度为 N 的句子就有 (50,000)^N 种可能——太多而无法穷举。因此，你需要应用近似搜索算法，尝试找到使
    Score_A(S) 优化（最大化）的 S 值。一个示例搜索算法是“beam search”，它在搜索过程中只保留 K 个顶级候选。（就本章而言，你不需要理解
    beam search 的细节。）像这样的算法不能保证找到使 Score_A(S) 最大化的 S 值。


    假设音频片段 A 记录了有人说“I love machine learning”。但与输出正确的转录相反，你的系统输出了错误的“I love robots”。现在出错的原因有两种可能：


    - 1. **搜索算法问题。** 近似搜索算法（beam search）未能找到使 Score_A(S) 最大化的 S 值。

    - 2. **目标（评分函数）问题。** 我们对 Score_A(S) = P(S|A) 的估计不准确。特别是，我们选择的 Score_A(S) 未能识别出“I
    love machine learning”是正确的转录。


    根据哪一个是失败的原因，你应该非常不同地优先考虑你的工作。如果 #1 是问题，你应该致力于改进搜索算法。如果 #2 是问题，你应该致力于估计 Score_A(S)
    的学习算法。


    面对这种情况，一些研究人员会随机决定改进搜索算法；其他人会随机改进学习 Score_A(S) 值的更好方法。但除非你知道哪一个是错误的根本原因，否则你的努力可能会被浪费。如何更系统地决定要做什么？


    设 S_out 为输出转录（“I love robots”）。设 S* 为正确转录（“I love machine learning”）。为了了解 #1 还是
    #2 是问题，你可以执行 **优化验证测试**：首先，计算 Score_A(S*) 和 Score_A(S_out)。然后检查 Score_A(S*) >
    Score_A(S_out) 是否成立。有两种可能性：


    ### 情况 1：Score_A(S*) > Score_A(S_out)


    在这种情况下，你的学习算法已正确地给 S* 分了比 S_out 更高的分数。尽管如此，我们的近似搜索算法选择了 S_out 而不是 S*。这告诉你，你的近似搜索算法未能选择使
    Score_A(S) 最大化的 S 值。在这种情况下，优化验证测试告诉你你有一个搜索算法问题，应该专注于此。例如，你可以尝试增加 beam search 的
    beam 宽度。


    ### 情况 2：Score_A(S*) ≤ Score_A(S_out)


    在这种情况下，你知道计算 Score_A(.) 的方式有问题：它未能给正确的输出 S* 分出严格高于错误的 S_out 的分数。优化验证测试告诉你你有一个目标（评分）函数问题。因此，你应该专注于改进如何学习或近似不同句子
    S 的 Score_A(S)。


    我们的讨论集中在一个示例上。为了在实践中应用优化验证测试，你应该检查开发集中的错误。对于每个错误，你将测试 Score_A(S*) > Score_A(S_out)
    是否成立。对于该不等式成立的每个开发示例，将被标记为由优化算法引起的错误。对于该不等式不成立的每个示例（Score_A(S*) ≤ Score_A(S_out)）将被计为由于你计算
    Score_A(.) 的方式而导致的错误。


    例如，假设你发现 95% 的错误是由于评分函数 Score_A(.) 造成的，只有 5% 是由于优化算法造成的。现在你知道无论你如何改进优化程序，你现实中最多只能消除
    ~5% 的错误。因此，你应该转而专注于改进如何估计 Score_A(.)。

