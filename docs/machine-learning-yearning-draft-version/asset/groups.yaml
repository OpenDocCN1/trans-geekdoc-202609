    ## 43 Artificial data synthesis


    Your speech system needs more data that sounds as if it were taken from within
    a car. Rather than collecting a lot of data while driving around, there might
    be an easier way to get this data: By artificially synthesizing it.


    Suppose you obtain a large quantity of car/road noise audio clips. You can download
    this data from several websites. Suppose you also have a large training set of
    people speaking in a quiet room. If you take an audio clip of a person speaking
    and “add” that to an audio clip of car/road noise, you will obtain an audio clip
    that sounds as if that person was speaking in a noisy car. Using this process,
    you can “synthesize” huge amounts of data that sound as if it were collected inside
    a car.


    More generally, there are several circumstances where artificial data synthesis
    allows you to create a huge dataset that reasonably matches the dev set. Let’s
    use the cat image detector as a second example. You notice that dev set images
    have much more motion blur because they tend to come from cellphone users who
    are moving their phone slightly while taking the picture. You can take non-blurry
    images from the training set of internet images, and add simulated motion blur
    to them, thus making them more similar to the dev set.


    Keep in mind that artificial data synthesis has its challenges: it is sometimes
    easier to create synthetic data that appears realistic to a person than it is
    to create data that appears realistic to a computer. For example, suppose you
    have 1,000 hours of speech training data, but only 1 hour of car noise. If you
    repeatedly use the same 1 hour of car noise with different portions from the original
    1,000 hours of training data, you will end up with a synthetic dataset where the
    same car noise is repeated over and over. While a person listening to this audio
    probably would not be able to tell—all car noise sounds the same to most of us—it
    is possible that a learning algorithm would “overfit” to the 1 hour of car noise.
    Thus, it could generalize poorly to a new audio clip where the car noise happens
    to sound different.


    Alternatively, suppose you have 1,000 unique hours of car noise, but all of it
    was taken from just 10 different cars. In this case, it is possible for an algorithm
    to “overfit” to these 10 cars and perform poorly if tested on audio from a different
    car. Unfortunately, these problems can be hard to spot.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_82_0.png)


    To take one more example, suppose you are building a computer vision system to
    recognize cars. Suppose you partner with a video gaming company, which has computer
    graphics models of several cars. To train your algorithm, you use the models to
    generate synthetic images of cars. Even if the synthesized images look very realistic,
    this approach (which has been independently proposed by many people) will probably
    not work well. The video game might have ~20 car designs in the entire video game.
    It is very expensive to build a 3D car model of a car; if you were playing the
    game, you probably wouldn’t notice that you’re seeing the same cars over and over,
    perhaps only painted differently. I.e., this data looks very realistic to you.
    But compared to the set of all cars out on roads—and therefore what you’re likely
    to see in the dev/test sets—this set of 20 synthesized cars captures only a minuscule
    fraction of the world’s distribution of cars. Thus if your 100,000 training examples
    all come from these 20 cars, your system will “overfit” to these 20 specific car
    designs, and it will fail to generalize well to dev/test sets that include other
    car designs.


    When synthesizing data, put some thought into whether you’re really synthesizing
    a representative set of examples. Try to avoid giving the synthesized data properties
    that makes it possible for a learning algorithm to distinguish synthesized from
    non-synthesized examples—such as if all the synthesized data comes from one of
    20 car designs, or all the synthesized audio comes from only 1 hour of car noise.
    This advice can be hard to follow.


    When working on data synthesis, my teams have sometimes taken weeks before we
    produced data with details that are close enough to the actual distribution for
    the synthesized data to have a significant effect. But if you are able to get
    the details right, you can suddenly access a far larger training set than before.


    ## Debugging inference algorithms


    ## 44 The Optimization Verification test


    Suppose you are building a speech recognition system. Your system works by inputting
    an audio clip A, and computing some Score_A(S) for each possible output sentence
    S. For example, you might try to estimate Score_A(S) = P(S|A), the probability
    that the correct output transcription is the sentence S, given that the input
    audio was A.


    Given a way to compute Score_A(S), you still have to find the English sentence
    S that maximizes it:


    Output = arg max_S Score_A(S)


    How do you compute the “arg max” above? If the English language has 50,000 words,
    then there are (50,000)^N possible sentences of length N—far too many to exhaustively
    enumerate. So, you need to apply an approximate search algorithm, to try to find
    the value of S that optimizes (maximizes) Score_A(S). One example search algorithm
    is “beam search,” which keeps only K top candidates during the search process.
    (For the purposes of this chapter, you don’t need to understand the details of
    beam search.) Algorithms like this are not guaranteed to find the value of S that
    maximizes Score_A(S).


    Suppose that an audio clip A records someone saying “I love machine learning.”
    But instead of outputting the correct transcription, your system outputs the incorrect
    “I love robots.” There are now two possibilities for what went wrong:


    - 1. **Search algorithm problem.** The approximate search algorithm (beam search)
    failed to find the value of S that maximizes Score_A(S).

    - 2. **Objective (scoring function) problem.** Our estimates for Score_A(S) =
    P(S|A) were inaccurate. In particular, our choice of Score_A(S) failed to recognize
    that “I love machine learning” is the correct transcription.


    Depending on which of these was the cause of the failure, you should prioritize
    your efforts very differently. If #1 was the problem, you should work on improving
    the search algorithm. If #2 was the problem, you should work on the learning algorithm
    that estimates Score_A(S).


    Facing this situation, some researchers will randomly decide to work on the search
    algorithm; others will randomly work on a better way to learn values for Score_A(S).
    But unless you know which of these is the underlying cause of the error, your
    efforts could be wasted. How can you decide more systematically what to work on?


    Let S_out be the output transcription (“I love robots”). Let S* be the correct
    transcription (“I love machine learning”). In order to understand whether #1 or
    #2 above is the problem, you can perform the **Optimization Verification test**:
    First, compute Score_A(S*) and Score_A(S_out). Then check whether Score_A(S*)
    > Score_A(S_out). There are two possibilities:


    ### Case 1: Score_A(S*) > Score_A(S_out)


    In this case, your learning algorithm has correctly given S* a higher score than
    S_out. Nevertheless, our approximate search algorithm chose S_out rather than
    S*. This tells you that your approximate search algorithm is failing to choose
    the value of S that maximizes Score_A(S). In this case, the Optimization Verification
    test tells you that you have a search algorithm problem and should focus on that.
    For example, you could try increasing the beam width of beam search.


    ### Case 2: Score_A(S*) ≤ Score_A(S_out)


    In this case, you know that the way you’re computing Score_A(.) is at fault: It
    is failing to give a strictly higher score to the correct output S* than the incorrect
    S_out. The Optimization Verification test tells you that you have an objective
    (scoring) function problem. Thus, you should focus on improving how you learn
    or approximate Score_A(S) for different sentences S.


    Our discussion has focused on a single example. To apply the Optimization Verification
    test in practice, you should examine the errors in your dev set. For each error,
    you would test whether Score_A(S*) > Score_A(S_out). Each dev example for which
    this inequality holds will get marked as an error caused by the optimization algorithm.
    Each example for which this does not hold (Score_A(S*) ≤ Score_A(S_out)) gets
    counted as a mistake due to the way you’re computing Score_A(.).


    For example, suppose you find that 95% of the errors were due to the scoring function
    Score_A(.), and only 5% due to the optimization algorithm. Now you know that no
    matter how much you improve your optimization procedure, you would realistically
    eliminate only ~5% of our errors. Thus, you should instead focus on improving
    how you estimate Score_A(.).

