    If you are able to take a complex task, and break it down into simpler sub-tasks,
    then by coding in the steps of the sub-tasks explicitly, you are giving the algorithm
    prior knowledge that can help it learn a task more efficiently.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_99_0.png)


    Suppose you are building a Siamese cat detector. This is the pure end-to-end architecture:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_99_1.png)


    In contrast, you can alternatively use a pipeline with two steps:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_99_2.png)


    The first step (cat detector) detects all the cats in the image.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_100_0.png)


    The second step then passes cropped images of each of the detected cats (one at
    a time) to a cat species classifier, and finally outputs 1 if any of the cats
    detected is a Siamese cat.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_100_1.png)


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_100_2.png)


    Compared to training a purely end-to-end classifier using just labels 0/1, each
    of the two components in the pipeline--the cat detector and the cat breed classifier--seem
    much easier to learn and will require significantly less data.¹⁷


    ¹⁷ If you are familiar with practical object detection algorithms, you will recognize
    that they do not learn just with 0/1 image labels, but are instead trained with
    bounding boxes provided as part of the training data. A discussion of them is
    beyond the scope of this chapter. See the Deep Learning specialization on Coursera
    (http://deeplearning.ai) if you would like to learn more about such algorithms.


    As one final example, let’s revisit the autonomous driving pipeline.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_101_0.png)


    By using this pipeline, you are telling the algorithm that there are 3 key steps
    to driving: (1) Detect other cars, (2) Detect pedestrians, and (3) Plan a path
    for your car. Further, each of these is a relatively simpler function--and can
    thus be learned with less data--than the purely end-to-end approach.


    In summary, when deciding what should be the components of a pipeline, try to
    build a pipeline where each component is a relatively “simple” function that can
    therefore be learned from only a modest amount of data.


    ## 52 Directly learning rich outputs


    An image classification algorithm will input an image x, and output an integer
    indicating the object category. Can an algorithm instead output an entire sentence
    describing the image?


    For example:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_102_0.png)


    y = “A yellow bus driving down a road with green trees and green grass in the
    background.”


    Traditional applications of supervised learning learned a function h:X→Y, where
    the output y was usually an integer or a real number. For example:


    | Problem | X | Y |

    |---|---|---|

    | Spam classification | Email | Spam/Not spam (0/1) |

    | Image recognition | Image | Integer label |

    | Housing price prediction | Features of house | Price in dollars |

    | Product recommendation | Product & user features | Chance of purchase |


    One of the most exciting developments in end-to-end deep learning is that it is
    letting us directly learn y that are much more complex than a number. In the image-captioning
    example above, you can have a neural network input an image (x) and directly output
    a caption (y).


    Here are more examples:


    | Problem | X | Y | Example Citation |

    |---|---|---|---|

    | Image captioning | Image | Text | Mao et al., 2014 |

    | Machine translation | English text | French text | Sutskever et al., 2014 |

    | Question answering | (Text,Question) pair | Answer text | Bordes et al., 2015
    |

    | Speech recognition | Audio | Transcription | Hannun et al., 2015 |

    | TTS | Text features | Audio | van der Oord et al., 2016 |


    This is an accelerating trend in deep learning: When you have the right (input,output)
    labeled pairs, you can sometimes learn end-to-end even when the output is a sentence,
    an image, audio, or other outputs that are richer than a single number.


    ## Error analysis

    ### by parts


    ## 53 Error analysis by parts


    Suppose your system is built using a complex machine learning pipeline, and you
    would like to improve the system’s performance. Which part of the pipeline should
    you work on improving? By attributing errors to specific parts of the pipeline,
    you can decide how to prioritize your work.


    Let’s use our Siamese cat classifier example:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_105_0.png)


    The first part, the cat detector, detects cats and crops them out of the image.
    The second part, the cat breed classifier, decides if it is a Siamese cat. It
    is possible to spend years working on improving either of these two pipeline components.
    How do you decide which component(s) to focus on?


    By carrying out error analysis by parts, you can try to attribute each mistake
    the algorithm makes to one (or sometimes both) of the two parts of the pipeline.
    For example, the algorithm misclassifies this image as not containing a Siamese
    cat (y=0) even though the correct label is y=1.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_105_1.png)


    Let’s manually examine what the two steps of the algorithm did. Suppose the Siamese
    cat detector had detected a cat as follows:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_106_0.png)


    This means that the cat breed classifier is given the following image:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_106_1.png)


    The cat breed classifier then correctly classifies this image as not containing
    a Siamese cat. Thus, the cat breed classifier is blameless: It was given a pile
    of rocks and outputted a very reasonable label y=0. Indeed, a human classifying
    the cropped image above would also have predicted y=0. Thus, you can clearly attribute
    this error to the cat detector.


    If, on the other hand, the cat detector had outputted the following bounding box:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_106_2.png)


    then you would conclude that the cat detector had done its job, and that it was
    the cat breed classifier that is at fault.


    Say you go through 100 misclassified dev set images and find that 90 of the errors
    are attributable to the cat detector, and only 10 errors are attributable to the
    cat breed classifier. You can safely conclude that you should focus more attention
    on improving the cat detector.


    Further, you have now also conveniently found 90 examples where the cat detector
    outputted incorrect bounding boxes. You can use these 90 examples to carry out
    a deeper level of error analysis on the cat detector to see how to improve that.


    Our description of how you attribute error to one part of the pipeline has been
    informal so far: you look at the output of each of the parts and see if you can
    decide which one made a mistake. This informal method could be all you need. But
    in the next chapter, you’ll also see a more formal way of attributing error.


    ## 54 Attributing error to one part


    Let’s continue to use this example:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_108_0.png)


    Suppose the cat detector outputted this bounding box:


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_108_1.png)


    The cat breed classifier is thus given this cropped image, whereupon it incorrectly
    outputs y=0, or that there is no cat in the picture.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_108_2.png)


    The cat detector did its job poorly. However, a highly skilled human could arguably
    still recognize the Siamese cat from the poorly cropped image. So do we attribute
    this error to the cat detector, or the cat breed classifier, or both? It is ambiguous.


    If the number of ambiguous cases like these is small, you can make whatever decision
    you want and get a similar result. But here is a more formal test that lets you
    more definitively attribute the error to exactly one part:


    - 1. Replace the cat detector output with a hand-labeled bounding box.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_109_0.png)


    - 2. Run the corresponding cropped image through the cat breed classifier. If
    the cat breed classifier still misclassifies it, attribute the error to the cat
    breed classifier. Otherwise, attribute the error to the cat detector.


    In other words, run an experiment in which you give the cat breed classifier a
    “perfect” input. There are two cases:


    - Case 1: Even given a “perfect” bounding box, the cat breed classifier still
    incorrectly outputs y=0. In this case, clearly the cat breed classifier is at
    fault.

    - Case 2: Given a “perfect” bounding box, the breed classifier now correctly outputs
    y=1. This shows that if only the cat detector had given a more perfect bounding
    box, then the overall system’s output would have been correct. Thus, attribute
    the error to the cat detector.


    By carrying out this analysis on the misclassified dev set images, you can now
    unambiguously attribute each error to one component. This allows you to estimate
    the fraction of errors due to each component of the pipeline, and therefore decide
    where to focus your attention.

