    ## 18 How big should the Eyeball and Blackbox dev sets be?


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_37_0.png)


    Your Eyeball dev set should be large enough to give you a sense of your algorithm’s
    major error categories. If you are working on a task that humans do well (such
    as recognizing cats in images), here are some rough guidelines:


    - An eyeball dev set in which your classifier makes 10 mistakes would be considered
