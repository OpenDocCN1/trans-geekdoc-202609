    Given a reward function $R(T)$, the job of the reinforcement learning algorithm
    is to control the helicopter so that it achieves $\max_T R(T)$. However, reinforcement
    learning algorithms make many approximations and may not succeed in achieving
    this maximization.


    Suppose you have picked some reward $R(\cdot)$ and have run your learning algorithm.
    However, its performance appears far worse than your human pilot—the landings
    are bumpier and seem less safe than what a human pilot achieves. How can you tell
    if the fault is with the reinforcement learning algorithm—which is trying to carry
    out a trajectory that achieves $\max_T R(T)$—or if the fault is with the reward
    function—which is trying to measure as well as specify the ideal tradeoff between
    ride bumpiness and accuracy of landing spot?


    To apply the Optimization Verification test, let $T_{\text{human}}$ be the trajectory
    achieved by the human pilot, and let $T_{\text{out}}$ be the trajectory achieved
    by the algorithm. According to our description above, $T_{\text{human}}$ is a
    superior trajectory to $T_{\text{out}}$. Thus, the key test is the following:
    Does it hold true that $R(T_{\text{human}}) > R(T_{\text{out}})$?


    **Case 1:** If this inequality holds, then the reward function $R(\cdot)$ is correctly
    rating $T_{\text{human}}$ as superior to $T_{\text{out}}$. But our reinforcement
    learning algorithm is finding the inferior $T_{\text{out}}$. This suggests that
    working on improving our reinforcement learning algorithm is worthwhile.


    **Case 2:** The inequality does not hold: $R(T_{\text{human}}) \leq R(T_{\text{out}})$.
    This means $R(\cdot)$ assigns a worse score to $T_{\text{human}}$ even though
    it is the superior trajectory. You should work on improving $R(\cdot)$ to better
    capture the tradeoffs that correspond to a good landing.


    Many machine learning applications have this “pattern” of optimizing an approximate
    scoring function $\operatorname{Score}_x(\cdot)$ using an approximate search algorithm.
    Sometimes, there is no specified input $x$, so this reduces to just $\operatorname{Score}(\cdot)$.
    In our example above, the scoring function was the reward function $\operatorname{Score}(T)=R(T)$,
    and the optimization algorithm was the reinforcement learning algorithm trying
    to execute a good trajectory $T$.


    One difference between this and earlier examples is that, rather than comparing
    to an “optimal” output, you were instead comparing to human-level performance
    $T_{\text{human}}$. We assumed $T_{\text{human}}$ is pretty good, even if not
    optimal. In general, so long as you have some $y^*$ (in this example, $T_{\text{human}}$)
    that is a superior output to the performance of your current learning algorithm—even
    if it is not the “optimal” output—then the Optimization Verification test can
    indicate whether it is more promising to improve the optimization algorithm or
    the scoring function.'
