  mdcn: '

    -   **人类直觉更难依赖。** 例如，几乎没有人能预测股市。所以如果我们的股票预测算法表现不比随机猜测好，就很难弄清楚如何改进它。

    -   **很难知道最优错误率和合理的期望错误率是多少。** 假设你已经有一个表现相当不错的图书推荐系统。没有人类基准的情况下，你怎么知道它还能改进多少？


    ## 34 如何定义人类水平性能


    假设你正在开发一个医疗影像应用，该应用可自动根据 X 光图像做出诊断。一个除了接受过一些基础培训之外没有医学背景的普通人，在此任务上的错误率为 15%。初级医生错误率为
    10%。有经验的医生错误率为 5%。而一小队讨论并辩论每张图像的医生错误率为 2%。这些错误率中的哪一个定义了“人类水平性能”？


    在这种情况下，我会将 2% 用作我们最优错误率的人类水平性能代理。你也可以将 2% 设为期望性能水平，因为上一章中将性能与人类水平进行比较的全部三个原因都适用：


    -   **从人类标注者获取标注数据的便利性。** 你可以让一队医生为你提供标注，错误率为 2%。

    -   **错误分析可以借鉴人类直觉。** 通过与一队医生讨论图像，你可以借鉴他们的直觉。

    -   **利用人类水平性能来估计最优错误率并设定可实现的“期望错误率”。** 使用 2% 错误率作为我们对最优错误率的估计是合理的。最优错误率可能甚至低于
    2%，但不可能更高，因为医生团队能够达到 2% 错误率。相比之下，使用 5% 或 10% 作为最优错误率的估计是不合理的，因为我们知道这些估计必然过高。


    在获取标注数据时，你可能不希望让整个医生团队讨论每张图像，因为他们的时间很宝贵。也许你可以让一名初级医生标注绝大多数案例，只把更困难的案例带给更有经验的医生或医生团队。


    如果你的系统目前错误率为 40%，那么使用初级医生（错误率 10%）还是有经验的医生（错误率 5%）来标注数据并提供直觉差别不大。但如果你的系统已经达到 10%
    错误率，那么将人类水平参考定义为 2% 就能为你提供更好的工具来持续改进系统。


    ## 35 超越人类水平性能


    你正在从事语音识别工作，并且有一个音频片段数据集。假设你的数据集中有很多嘈杂的音频片段，以至于人类也有 10% 的错误率。假设你的系统已经达到 8% 的错误率。你还能使用第
    33 章中描述的三种技术中的任何一种来继续快速进步吗？


    如果你能识别出人类明显优于你的系统的子集数据，那么你仍然可以使用这些技术来推动快速进步。例如，假设你的系统在嘈杂音频中识别语音方面远胜于人类，但人类在转录非常快速的语音方面仍然更好。


    对于快速语音的子集数据：


    1.  你仍然可以从人类那里获得质量高于算法输出的转录文本。

    2.  你可以借鉴人类直觉来理解他们为何能正确听出快速语语音而你的系统却不能。

    3.  你可以将快速语音上的人类水平性能作为期望性能目标。


    更一般地说，只要在开发集中有人类正确而算法错误的情况，那么之前描述的许多技术仍然适用。这即使在整个开发/测试集上平均来看，你的性能已经超过人类水平性能，也成立。


    有许多重要的机器学习应用中机器超过了人类水平性能。例如，机器在预测电影评分、送货车前往某地所需时间、或是否批准贷款申请方面更好。一旦人类很难识别出算法明显出错的例子，只有部分技术适用。因此，在机器已经超过人类水平性能的问题上进展通常较慢，而在机器仍在努力追赶人类的情况下进展更快。


    ## 在不同分布上训练和测试


    ### 36 何时应在不同分布上训练和测试


    你的猫图应用的用户上传了 10,000 张图像，你已手动标注它们是否包含猫。你还有一个更大的 200,000 张从互联网下载的图像集。你应如何定义训练/开发/测试集？


    由于这 10,000 张用户图像密切反映了你希望表现良好的实际数据概率分布，你可能会将其用于开发集和测试集。如果你在训练一个数据饥渴的深度学习算法，你可能会为其提供额外的
    200,000 张互联网图像用于训练。因此，你的训练集和开发/测试集来自不同的概率分布。这如何影响你的工作？


    我们也可以不将数据划分为训练/开发/测试集，而是将我们拥有的全部 210,000 张图像随机打乱后划分为训练/开发/测试集。在这种情况下，所有数据都来自同一分布。但我不建议这种方法，因为大约
    205,000/210,000 ≈ 97.6% 的开发/测试数据将来自互联网图像，这并不反映你希望表现良好的实际分布。记住我们关于选择开发/测试集的建议：


    Choose dev and test sets to reflect data you expect to get in the future and want
    to do well on.


    机器学习学术文献的大部分假设训练集、开发集和测试集都来自同一分布。¹¹在机器学习早期，数据稀缺。我们通常只有一个从某个概率分布中抽取的数据集。因此我们会将该数据随机划分为训练/开发/测试集，并且所有数据来自同一来源的假设通常成立。


    ¹¹ 有一些学术研究涉及在不同分布上训练和测试。例如“domain adaptation”、“transfer learning” 和 “multitask
    learning”。但理论与实践之间仍存在巨大差距。如果你用数据集 A 训练并在完全不同类型的数据 B 上测试，运气可能会对算法表现产生巨大影响。（这里的“运气”包括研究人员为特定任务手工设计的特征，以及我们尚未理解的其他因素。）这使得对不同分布上训练和测试的学术研究难以系统地开展。


    但在大数据的时代，我们现在可以访问巨大的训练集，例如猫的互联网图像。即使训练集来自与开发/测试集不同的分布，我们仍然希望使用它进行学习，因为它可以提供大量信息。


    对于猫检测器示例，我们可以不把全部 10,000 张用户上传的图像都放入开发/测试集，而是把其中 5,000 张放入开发/测试集。我们可以将剩下的 5,000
    个用户上传示例放入训练集。这样，你的 205,000 个示例的训练集包含一些来自开发/测试分布的数据以及 200,000 张互联网图像。我们将在后面的章节讨论这种方法为何有帮助。


    让我们考虑第二个例子。假设你正在构建一个语音识别系统，用于为语音控制的移动地图/导航应用转录街道地址。你有 20,000 个用户说街道地址的示例。但你还有
    500,000 个其他音频片段示例，其中用户谈论其他主题。你可以取 10,000 个街道地址示例用于开发/测试集，并将剩下的 10,000 个加上额外的 500,000
    个示例用于训练。


    我们将继续假设你的开发数据和测试数据来自同一分布。但重要的是要理解，不同的训练和开发/测试分布会带来一些特殊挑战。

