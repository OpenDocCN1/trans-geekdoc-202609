    # 45 General form of Optimization Verification test


    You can apply the Optimization Verification test when, given some input x, you
    know how to compute Scoreₓ(y) that indicates how good a response y is to an input
    x. Furthermore, you are using an approximate algorithm to try to find arg max_y
    Scoreₓ(y), but suspect that the search algorithm is sometimes failing to find
    the maximum. In our previous speech recognition example, x=A was an audio clip,
    and y=S was the output transcript.


    Suppose y* is the “correct” output but the algorithm instead outputs y_out. Then
    the key test is to measure whether Scoreₓ(y*) > Scoreₓ(y_out). If this inequality
    holds, then we blame the optimization algorithm for the mistake. Refer to the
    previous chapter to make sure you understand the logic behind this. Otherwise,
    we blame the computation of Scoreₓ(y).


    Let’s look at one more example. Suppose you are building a Chinese-to-English
    machine translation system. Your system works by inputting a Chinese sentence
    C, and computing some Score_C(E) for each possible translation E. For example,
    you might use Score_C(E) = P(E|C), the probability of the translation being E
    given that the input sentence was C.


    Your algorithm translates sentences by trying to compute:


    Output = arg max_E Score_C(E)


    However, the set of all possible English sentences E is too large, so you rely
    on a heuristic search algorithm.


    Suppose your algorithm outputs an incorrect translation E_out rather than some
    correct translation E*. Then the Optimization Verification test would ask you
    to compute whether Score_C(E*) > Score_C(E_out). If this inequality holds, then
    the Score_C(.) correctly recognized E* as a superior output to E_out; thus, you
    would attribute this error to the approximate search algorithm. Otherwise, you
    attribute this error to the computation of Score_C(.).


    It is a very common “design pattern” in AI to first learn an approximate scoring
    function Scoreₓ(.), then use an approximate maximization algorithm. If you are
    able to spot this pattern, you will be able to use the Optimization Verification
    test to understand your source of errors.'
