    - 随着我们添加更多训练数据，训练误差只能变差。因此，蓝色训练误差曲线只能保持不变或升高，因此它只能离（绿色线）期望性能水平越来越远。

    - 红色开发误差曲线通常高于蓝色训练误差。因此，当训练误差甚至高于期望性能水平时，几乎没有办法通过添加更多数据使红色开发误差曲线下降到期望的性能水平。


    同时检查同一图表上的开发误差曲线和训练误差曲线，可以让我们更自信地外推开发误差曲线。


    假设为了讨论起见，期望性能是我们对最优误差率的估计。图上方的图就是学习曲线具有高可避免偏差时的标准“教科书”示例：在最大的训练集大小——大概对应于我们拥有的所有训练数据——训练误差与期望性能之间存在较大差距，表明存在较大的可避免偏差。此外，训练曲线与开发曲线之间的差距很小，表明方差很小。


    之前，我们只在该图的右侧点测量训练和开发集误差，这对应于使用所有可用的训练数据。绘制完整的学习曲线可以让我们更全面地了解算法在不同训练集大小下的性能。


    ## 31 解释学习曲线：其他情况


    考虑这个学习曲线：


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_61_0.png)


    该图表明高偏差、高方差还是两者兼有？


    蓝色训练误差曲线相对较低，而红色开发误差曲线比蓝色训练误差高得多。因此，偏差很小，但方差很大。添加更多训练数据可能会有助于缩小开发误差与训练误差之间的差距。


    现在，考虑这个：


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_61_1.png)


    这次，训练误差很大，因为它远高于期望的性能水平。开发误差也比训练误差大得多。因此，你的算法存在显著的偏差和显著的方差。你必须找到一种方法来同时减少算法的偏差和方差。


    ## 32 绘制学习曲线


    假设你有一个非常小的训练集，共 100 个示例。你使用随机选择的 10 个示例、然后 20 个示例、然后 30 个示例，直到 100 个示例来训练算法，每次增加
    10 个示例。然后你使用这 10 个数据点绘制学习曲线。你可能会发现曲线在较小的训练集大小时看起来有点嘈杂（意味着值高于/低于预期）。


    当仅使用 10 个随机选择的示例进行训练时，你可能运气不好，得到一个特别“差”的训练集，例如包含许多模糊/错误标记的示例。或者，你可能运气好，得到一个特别“好”的训练集。训练集很小意味着开发误差和训练误差可能会随机波动。


    如果你的机器学习应用严重偏向某一类（例如猫分类任务，其中负例的比例远大于正例），或者它具有大量的类别（例如识别 100 种不同的动物物种），那么选择一个特别“不具代表性”或差的训练集的几率也会更大。例如，如果
    80% 的示例是负例（y=0），只有 20% 是正例（y=1），那么 10 个示例的训练集可能只包含负例，从而使算法很难学习到有意义的东西。


    如果训练曲线中的噪声使很难看到真实趋势，这里有两个解决方案：


    - 不要只在 10 个示例上训练一个模型，而是从原始的 100 个示例中通过有放回采样¹⁰选择几个（比如 3-10 个）不同的随机选择的 10 个示例训练集。对每个训练集训练不同的模型，并计算每个所得模型的训练和开发集误差。计算并绘制平均训练误差和平均开发集误差。

    - 如果你的训练集偏向某一类，或者它有很多类别，选择一个“平衡”的子集，而不是从 100 个示例中随机选择 10 个训练示例。例如，你可以确保 2/10 的示例是正例，8/10
    是负例。更一般地说，你可以确保每个类别的示例比例尽可能接近原始训练集中的总体比例。


    ¹⁰ 这里是有放回采样意味着什么：你会从 100 个示例中随机挑选 10 个不同的示例来形成第一个训练集。然后为了形成第二个训练集，你会再次挑选 10 个示例，但不考虑第一次训练集中选择的内容。因此，一个特定示例可能同时出现在第一个和第二个训练集中。相比之下，如果是无放回采样，第二个训练集将从第一次未被选中的
    90 个示例中选择。实际上，有放回或无放回采样不会有巨大差异，但前者是常见做法。


    我不会在你已经尝试绘制学习曲线并得出曲线过于嘈杂而无法看到底层趋势之前费心使用这些技术。如果你的训练集很大——比如超过 10,000 个示例——并且类别分布不是很偏斜，你可能不需要这些技术。


    最后，绘制学习曲线可能在计算上很昂贵：例如，你可能需要训练十个模型，使用 1,000 个、然后 2,000 个，一直到 10,000 个示例。使用小数据集训练模型比使用大数据集训练模型快得多。因此，与其像上面那样在线性尺度上均匀间隔训练集大小，你可以训练使用
    1,000、2,000、4,000、6,000 和 10,000 个示例的模型。这仍然可以让你清楚地了解学习曲线的趋势。当然，只有当训练所有额外模型的计算成本显著时，该技术才相关。


    ## 与人类水平性能比较


    ## 33 为什么我们要与人类水平性能比较


    许多机器学习系统旨在自动化人类擅长的事情。示例包括图像识别、语音识别和电子邮件垃圾邮件分类。学习算法也改进了很多，以至于我们现在在越来越多的这些任务上超越了人类水平性能。


    此外，如果你尝试做人们能做好的任务，构建 ML 系统会更容易，有几个原因：


    - 1. **从人工标注者获取数据的便捷性。** 例如，由于人们能很好地识别猫图像，因此人们为你的学习算法提供高准确度标签是直接的。

    - 2. **误差分析可以利用人类直觉。** 假设语音识别算法的性能不如人类水平。假设它错误地将一段音频转写为“这份食谱需要一颗苹果的梨”，把“pair”误认为“pear”。你可以利用人类直觉并尝试理解一个人用来获得正确转写的信息，并利用这些知识修改学习算法。

    - 3. **利用人类水平性能来估计最优误差率并设定“期望误差率”。** 假设你的算法在某项任务上达到 10% 的误差，但一个人达到 2% 的误差。那么我们知道最优误差率是
    2% 或更低，可避免偏差至少为 8%。因此，你应该尝试降低偏差的技术。


    尽管第 3 项可能听起来不重要，但我发现拥有一个合理且可实现的目标误差率有助于加速团队的进展。知道你的算法具有高可避免偏差是非常有价值的，并打开了一系列可尝试的选项。


    有一些任务即使人类也不擅长。例如，为你推荐一本书；或为网站上的用户挑选广告；或预测股市。计算机在这些任务上已经超越了大多数人的表现。在这些应用中，我们会遇到以下问题：


    - **获取标签更困难。** 例如，让人工标注者为用户数据库标注“最优”图书推荐是困难的。如果你运营一个销售书籍的网站或应用，你可以通过向用户展示书籍并观察他们的购买行为来获取数据。如果你不运营此类网站，你需要找到更具创造性的方法来获取数据。

    '
