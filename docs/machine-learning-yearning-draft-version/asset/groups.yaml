    ## 32 Plotting learning curves


    Suppose you have a very small training set of 100 examples. You train your algorithm
    using a randomly chosen subset of 10 examples, then 20 examples, then 30, up to
    100, increasing the number of examples by intervals of ten. You then use these
    10 data points to plot your learning curve. You might find that the curve looks
    slightly noisy (meaning that the values are higher/lower than expected) at the
    smaller training set sizes.


    When training on just 10 randomly chosen examples, you might be unlucky and have
    a particularly “bad” training set, such as one with many ambiguous/mislabeled
    examples. Or, you might get lucky and get a particularly “good” training set.
    Having a small training set means that the dev and training errors may randomly
    fluctuate.


    If your machine learning application is heavily skewed toward one class (such
    as a cat classification task where the fraction of negative examples is much larger
    than positive examples), or if it has a huge number of classes (such as recognizing
    100 different animal species), then the chance of selecting an especially “unrepresentative”
    or bad training set is also larger. For example, if 80% of your examples are negative
    examples (y=0), and only 20% are positive examples (y=1), then there is a chance
    that a training set of 10 examples contains only negative examples, thus making
    it very difficult for the algorithm to learn something meaningful.


