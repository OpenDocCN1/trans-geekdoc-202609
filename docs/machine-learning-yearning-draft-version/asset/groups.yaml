    The process of how to accomplish (i) and (ii) is surprisingly complex. This book
    will discuss the details at length. We will start with general strategies that
    are useful for both traditional learning algorithms and neural networks, and build
    up to the most modern strategies for building deep learning systems.


    ## Setting up development and test sets


    ### 5 Your development and test sets


    Let’s return to our earlier cat pictures example: You run a mobile app, and users
    are uploading pictures of many different things to your app. You want to automatically
    find the cat pictures.


    Your team gets a large training set by downloading pictures of cats (positive
    examples) and non-cats (negative examples) off of different websites. They split
    the dataset 70%/30% into training and test sets. Using this data, they build a
    cat detector that works well on the training and test sets.


    But when you deploy this classifier into the mobile app, you find that the performance
    is really poor!


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_13_0.png)


    What happened?


    You figure out that the pictures users are uploading have a different look than
    the website images that make up your training set: Users are uploading pictures
    taken with mobile phones, which tend to be lower resolution, blurrier, and poorly
    lit. Since your training/test sets were made of website images, your algorithm
    did not generalize well to the actual distribution you care about: mobile phone
    pictures.


    Before the modern era of big data, it was a common rule in machine learning to
    use a random 70%/30% split to form your training and test sets. This practice
    can work, but it’s a bad idea in more and more applications where the training
    distribution (website images in our example above) is different from the distribution
    you ultimately care about (mobile phone images).


    We usually define:


    - **Training set** — Which you run your learning algorithm on.

    - **Dev (development) set** — Which you use to tune parameters, select features,
    and make other decisions regarding the learning algorithm. Sometimes also called
    the **hold-out cross validation set**.

    - **Test set** — which you use to evaluate the performance of the algorithm, but
    not to make any decisions regarding what learning algorithm or parameters to use.


    Once you define a dev set (development set) and test set, your team will try a
    lot of ideas, such as different learning algorithm parameters, to see what works
    best. The dev and test sets allow your team to quickly see how well your algorithm
    is doing.


    In other words, **the purpose of the dev and test sets is to direct your team
    toward the most important changes to make to the machine learning system.**


    So, you should do the following:


    Choose dev and test sets to reflect data you expect to get in the future and want
    to do well on.


    In other words, your test set should not simply be 30% of the available data,
    especially if you expect your future data (mobile phone images) to be different
    in nature from your training set (website images).


    If you have not yet launched your mobile app, you might not have any users yet,
    and thus might not be able to get data that accurately reflects what you have
    to do well on in the future. But you might still try to approximate this. For
    example, ask your friends to take mobile phone pictures of cats and send them
    to you. Once your app is launched, you can update your dev/test sets using actual
    user data.


    If you really don’t have any way of getting data that approximates what you expect
    to get in the future, perhaps you can start by using website images. But you should
    be aware of the risk of this leading to a system that doesn’t generalize well.


    It requires judgment to decide how much to invest in developing great dev and
    test sets. But don’t assume your training distribution is the same as your test
    distribution. Try to pick test examples that reflect what you ultimately want
    to perform well on, rather than whatever data you happen to have for training.


    ### 6 Your dev and test sets should come from the same distribution


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_16_0.png)


    You have your cat app image data segmented into four regions, based on your largest
    markets: (i) US, (ii) China, (iii) India, and (iv) Other. To come up with a dev
    set and a test set, say we put US and India in the dev set; China and Other in
    the test set. In other words, we can randomly assign two of these segments to
    the dev set, and the other two to the test set, right?


    Once you define the dev and test sets, your team will be focused on improving
    dev set performance. Thus, the dev set should reflect the task you want to improve
    on the most: To do well on all four geographies, and not only two.


    There is a second problem with having different dev and test set distributions:
    There is a chance that your team will build something that works well on the dev
    set, only to find that it does poorly on the test set. I''ve seen this result
    in much frustration and wasted effort. Avoid letting this happen to you.


    As an example, suppose your team develops a system that works well on the dev
    set but not the test set. If your dev and test sets had come from the same distribution,
    then you would have a very clear diagnosis of what went wrong: You have overfit
    the dev set. The obvious cure is to get more dev set data.


    But if the dev and test sets come from different distributions, then your options
    are less clear. Several things could have gone wrong:


    1. You had overfit to the dev set.

    2. The test set is harder than the dev set. So your algorithm might be doing as
    well as could be expected, and no further significant improvement is possible.

    3. The test set is not necessarily harder, but just different, from the dev set.
    So what works well on the dev set just does not work well on the test set. In
    this case, a lot of your work to improve dev set performance might be wasted effort.


    Working on machine learning applications is hard enough. Having mismatched dev
    and test sets introduces additional uncertainty about whether improving on the
    dev set distribution also improves test set performance. Having mismatched dev
    and test sets makes it harder to figure out what is and isn’t working, and thus
    makes it harder to prioritize what to work on.


    If you are working on a 3rd party benchmark problem, their creator might have
    specified dev and test sets that come from different distributions. Luck, rather
    than skill, will have a greater impact on your performance on such benchmarks
    compared to if the dev and test sets come from the same distribution. It is an
    important research problem to develop learning algorithms that are trained on
    one distribution and generalize well to another. But if your goal is to make progress
    on a specific machine learning application rather than make research progress,
    I recommend trying to choose dev and test sets that are drawn from the same distribution.
    This will make your team more efficient.


    ### 7 How large do the dev/test sets need to be?


    The dev set should be large enough to detect differences between algorithms that
    you are trying out. For example, if classifier A has an accuracy of 90.0% and
    classifier B has an accuracy of 90.1%, then a dev set of 100 examples would not
    be able to detect this 0.1% difference. Compared to other machine learning problems
    I’ve seen, a 100 example dev set is small. Dev sets with sizes from 1,000 to 10,000
    examples are common. With 10,000 examples, you will have a good chance of detecting
    an improvement of 0.1%.²


    For mature and important applications—for example, advertising, web search, and
    product recommendations—I have also seen teams that are highly motivated to eke
    out even a 0.01% improvement, since it has a direct impact on the company’s profits.
    In this case, the dev set could be much larger than 10,000, in order to detect
    even smaller improvements.


    How about the size of the test set? It should be large enough to give high confidence
    in the overall performance of your system. One popular heuristic had been to use
    30% of your data for your test set. This works well when you have a modest number
    of examples—say 100 to 10,000 examples. But in the era of big data where we now
    have machine learning problems with sometimes more than a billion examples, the
    fraction of data allocated to dev/test sets has been shrinking, even as the absolute
    number of examples in the dev/test sets has been growing. There is no need to
    have excessively large dev/test sets beyond what is needed to evaluate the performance
    of your algorithms.


    ² In theory, one could also test if a change to an algorithm makes a statistically
    significant difference on the dev set. In practice, most teams don’t bother with
    this (unless they are publishing academic research papers), and I usually do not
    find statistical significance tests useful for measuring interim progress.

