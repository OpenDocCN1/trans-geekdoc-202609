  mdcn: "\n## 45 优化验证测试的一般形式\n\n当给定某个输入 x，并且你知道如何计算 Scoreₓ(y)（它表示对于输入 x，响应 y 的好坏程度）时，你就可以运用优化验证测试。此外，你正在使用一种近似算法来尝试找到\
    \ arg max_y Scoreₓ(y)，但怀疑该搜索算法有时无法找到最大值。在我们之前的语音识别示例中，x=A 是一段音频片段，y=S 是输出的转录文本。\n\
    \n假设 y* 是“正确的”输出，但算法却输出了 y_out。那么关键的测试就是衡量 Scoreₓ(y*) > Scoreₓ(y_out) 是否成立。如果这个不等式成立，那么我们就把错误归咎于优化算法。请参阅前一章，确保你理解这背后的逻辑。否则，我们归咎于\
    \ Scoreₓ(y) 的计算。\n\n再看一个例子。假设你正在构建一个中译英机器翻译系统。你的系统通过输入中文句子 C，并为每个可能的译文 E 计算某个\
    \ Score_C(E) 来工作。例如，你可以使用 Score_C(E) = P(E|C)，即在输入句子为 C 的条件下译文是 E 的概率。\n\n你的算法通过尝试计算以下内容来翻译句子：\n\
    \nOutput = arg max_E Score_C(E)\n\n然而，所有可能的英语句子 E 的集合过于庞大，因此你依赖于一种启发式搜索算法。\n\n\
    假设你的算法输出的是不正确的译文 E_out，而不是某个正确的译文 E*。那么优化验证测试要求你计算 Score_C(E*) > Score_C(E_out)\
    \ 是否成立。如果这个不等式成立，那么 Score_C(.) 正确地将 E* 识别为优于 E_out 的输出；因此，你会将这个错误归因于近似搜索算法。否则，你将这个错误归因于\
    \ Score_C(.) 的计算。\n\n在人工智能领域，一种非常常见的“设计模式”是先学习一个近似的评分函数 Scoreₓ(.)，然后使用一个近似的最大化算法。如果你能够识别出这种模式，你就能利用优化验证测试来理解你的错误来源。\n\
    \n## 46 强化学习示例\n\n![](img/9e8f77e479d4500e7b1f65b2be9fce44_87_0.png)\n\n假设你正在使用机器学习来教一架直升机执行复杂的飞行动作。这是一张延时摄影照片，展示了一架由计算机控制的直升机在发动机关闭的情况下执行着陆。\n\
    \n这被称为“自转”机动。它使直升机即使发动机意外故障也能着陆。人类飞行员会在训练中练习这一机动。你的目标是使用学习算法让直升机沿着一条以安全着陆结束的轨迹\
    \ *T* 飞行。\n\n要应用强化学习，你必须设计一个“奖励函数” *R(.)*，它给出一个分数来衡量每个可能的轨迹 *T* 有多好。例如，如果 *T*\
    \ 导致直升机坠毁，那么奖励可能是 *R(T) = -1,000*——一个巨大的负奖励。导致安全着陆的轨迹 *T* 可能会获得正的 *R(T)*，其具体值取决于着陆的平稳程度。奖励函数\
    \ *R(.)* 通常由人工选择，以量化不同轨迹 *T* 的可取程度。它需要权衡着陆的颠簸程度、直升机是否精确降落在期望的位置、乘客在下降过程中感受到的颠簸程度等等。设计出好的奖励函数并不容易。\n\
    \n给定一个奖励函数 $R(T)$，强化学习算法的任务是控制直升机以实现 $\\max_T R(T)$。然而，强化学习算法会做出许多近似，可能无法成功实现这个最大化。\n\
    \n假设你选择了一个奖励函数 $R(\\cdot)$ 并运行了你的学习算法。然而，它的性能看起来比人类飞行员差得多——着陆更颠簸，似乎也比人类飞行员实现的结果更不安全。你如何判断问题出在强化学习算法（它试图执行一条能实现\
    \ $\\max_T R(T)$ 的轨迹）还是出在奖励函数（它试图衡量并指定乘坐颠簸程度与着陆点准确性之间的理想权衡）上？\n\n为了应用优化验证测试，令\
    \ $T_{\\text{human}}$ 表示人类飞行员实现的轨迹，令 $T_{\\text{out}}$ 表示算法实现的轨迹。根据我们上面的描述，$T_{\\\
    text{human}}$ 是优于 $T_{\\text{out}}$ 的轨迹。因此，关键的测试是：$R(T_{\\text{human}}) > R(T_{\\\
    text{out}})$ 是否成立？\n\n**情况 1：** 如果这个不等式成立，那么奖励函数 $R(\\cdot)$ 正确地将 $T_{\\text{human}}$\
    \ 评为优于 $T_{\\text{out}}$。但我们的强化学习算法找到的是较差的 $T_{\\text{out}}$。这表明花精力改进我们的强化学习算法是值得的。\n\
    \n**情况 2：** 这个不等式不成立：$R(T_{\\text{human}}) \\leq R(T_{\\text{out}})$。这意味着 $R(\\\
    cdot)$ 给 $T_{\\text{human}}$ 打出了更差的分数，尽管它是更优越的轨迹。你应该努力改进 $R(\\cdot)$，以更好地捕捉与良好着陆相对应的权衡。\n\
    \n许多机器学习应用都有这种“模式”：使用近似搜索算法来优化一个近似的评分函数 $\\operatorname{Score}_x(\\cdot)$。有时没有指定的输入\
    \ $x$，因此简化成 $\\operatorname{Score}(\\cdot)$。在我们上面的例子中，评分函数是奖励函数 $\\operatorname{Score}(T)=R(T)$，而优化算法是试图执行一条好轨迹\
    \ $T$ 的强化学习算法。\n\n这个例子与之前例子的一个区别是：你并不是与“最优”输出作比较，而是与人类水平的性能 $T_{\\text{human}}$\
    \ 作比较。我们假设 $T_{\\text{human}}$ 相当好，即使不是最优。一般来说，只要你有某个 $y^*$（在这个例子中是 $T_{\\text{human}}$）它优于当前学习算法的输出——即使它不是“最优”输出——那么优化验证测试就可以表明，改进优化算法还是改进评分函数哪个更有前景。\n\
    \n## 端到端深度学习\n\n### 47 端到端学习的兴起\n\n假设你想构建一个系统来检查在线产品评论，并自动判断作者是喜欢还是不喜欢该产品。例如，你希望将以下评论识别为高度正面：\n\
    \nThis is a great mop!\n\n以及将以下评论识别为高度负面：\n\nThis mop is low quality--I regret\
    \ buying it.\n\n识别正面与负面意见的问题被称为“情感分类”。要构建这个系统，你可能会构建一个包含两个组件的“流水线”：\n\n1. 解析器：一个用信息标注文本以识别最重要词汇的系统。¹⁵\
    \ 例如，你可以使用解析器来标注所有的形容词和名词。因此，你会得到以下带标注的文本：\n\n   This is a great<sub>Adjective</sub>\
    \ mop<sub>Noun</sub>!\n\n2. 情感分类器：一个以标注文本为输入并预测整体情感的学习算法。解析器的标注能极大地帮助这个学习算法：通过给形容词更高的权重，你的算法将能够迅速锁定像“great”这样的重要词汇，而忽略像“this”这样不那么重要的词汇。\n\
    \n我们可以将你的两个组件的“流水线”可视化如下：\n\n![](img/9e8f77e479d4500e7b1f65b2be9fce44_90_0.png)\n\
    \n近年来出现了一种趋势，即用单一学习算法替代流水线系统。针对这个任务的端到端学习算法会直接将原始文本“This is a great mop!”作为输入，并尝试直接识别情感：\n\
    \n¹⁵ 解析器对文本的标注比这丰富得多，但这个简化的描述足以解释端到端深度学习。\n"
