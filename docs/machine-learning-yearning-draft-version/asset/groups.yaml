    to minimize the false negative rate (optimizing metric), subject to there being
    no more than one false positive every 24 hours of operation (satisficing metric).


    Once your team is aligned on the evaluation metric to optimize, they will be able
    to make faster progress.'
  - '[PAGE 23]


    # 10 Having a dev set and metric speeds up iterations


    It is very difficult to know in advance what approach will work best for a new
    problem. Even experienced machine learning researchers will usually try out many
    dozens of ideas before they discover something satisfactory. When building a machine
    learning system, I will often:


    +   1. Start off with some **idea** on how to build the system.

    +   2. Implement the idea in **code**.

    +   3. Carry out an **experiment** which tells me how well the idea worked. (Usually
    my first few ideas don’t work!) Based on these learnings, go back to generate
    more ideas, and keep on iterating.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_23_0.png)


    This is an iterative process. The faster you can go round this loop, the faster
    you will make progress. This is why having dev/test sets and a metric are important:
    Each time you try an idea, measuring your idea’s performance on the dev set lets
    you quickly decide if you’re heading in the right direction.


    In contrast, suppose you don’t have a specific dev set and metric. So each time
    your team develops a new cat classifier, you have to incorporate it into your
    app, and play with the app for a few hours to get a sense of whether the new classifier
    is an improvement. This would be incredibly slow! Also, if your team improves
    the classifier’s accuracy from 95.0% to 95.1%, you might not be able to detect
    that 0.1% improvement from playing with the app. Yet a lot of progress in your
    system will be made by gradually accumulating dozens of these 0.1% improvements.
    Having a dev set and metric allows you to very quickly detect which ideas are
    successfully giving you small (or large) improvements, and therefore lets you
    quickly decide what ideas to keep refining, and which ones to discard.'
  - '[PAGE 24]


    # 11 When to change dev/test sets and metrics


    When starting out on a new project, I try to quickly choose dev/test sets, since
    this gives the team a well-defined target to aim for.


    I typically ask my teams to come up with an initial dev/test set and an initial
    metric in less than one week—rarely longer. It is better to come up with something
    imperfect and get going quickly, rather than overthink this. But this one week
    timeline does not apply to mature applications. For example, anti-spam is a mature
    deep learning application. I have seen teams working on already-mature systems
    spend months to acquire even better dev/test sets.


    If you later realize that your initial dev/test set or metric missed the mark,
    by all means change them quickly. For example, if your dev set + metric ranks
    classifier A above classifier B, but your team thinks that classifier B is actually
    superior for your product, then this might be a sign that you need to change your
    dev/test sets or your evaluation metric.


    There are three main possible causes of the dev set/metric incorrectly rating
    classifier A higher:


    +   1. The actual distribution you need to do well on is different from the dev/test
    sets.


    Suppose your initial dev/test set had mainly pictures of adult cats. You ship
    your cat app, and find that users are uploading a lot more kitten images than
    expected. So, the dev/test set distribution is not representative of the actual
    distribution you need to do well on. In this case, update your dev/test sets to
    be more representative.


