    +   - Choose dev and test sets from the same distribution if possible.

    +   - Choose a single-number evaluation metric for your team to optimize. If there
    are multiple goals that you care about, consider combining them into a single
    formula (such as averaging multiple error metrics) or defining satisficing and
    optimizing metrics.

    +   - Machine learning is a highly iterative process: You may try many dozens
    of ideas before finding one that you’re satisfied with.

    +   - Having dev/test sets and a single-number evaluation metric helps you quickly
    evaluate algorithms, and therefore iterate faster.

    +   - When starting out on a brand new application, try to establish dev/test
    sets and a metric quickly, say in less than a week. It might be okay to take longer
    on mature applications.

    +   - The old heuristic of a 70%/30% train/test split does not apply for problems
