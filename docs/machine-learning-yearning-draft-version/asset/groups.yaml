    examples in the Eyeball dev set, the Eyeball dev set would have to have about
    2,000 examples (since 0.05*2,000 = 100). The lower your classifier’s error rate,
    the larger your Eyeball dev set needs to be in order to get a large enough set
    of errors to analyze.


    If you are working on a task that even humans cannot do well, then the exercise
    of examining an Eyeball dev set will not be as helpful because it is harder to
    figure out why the algorithm didn’t classify an example correctly. In this case,
    you might omit having an Eyeball dev set. We discuss guidelines for such problems
    in a later chapter.


    ![](img/9e8f77e479d4500e7b1f65b2be9fce44_38_0.png)


    How about the Blackbox dev set? We previously said that dev sets of around 1,000–10,000
    examples are common. To refine that statement, a Blackbox dev set of 1,000–10,000
    examples will often give you enough data to tune hyperparameters and select among
    models, though there is little harm in having even more data. A Blackbox dev set
    of 100 would be small but still useful.


    If you have a small dev set, then you might not have enough data to split into
    Eyeball and Blackbox dev sets that are both large enough to serve their purposes.
    Instead, your entire dev set might have to be used as the Eyeball dev set—i.e.,
    you would manually examine all the dev set data.


    Between the Eyeball and Blackbox dev sets, I consider the Eyeball dev set more
    important (assuming that you are working on a problem that humans can solve well
    and that examining the examples helps you gain insight). If you only have an Eyeball
    dev set, you can perform error analyses, model selection and hyperparameter tuning
    all on that set. The downside of having only an Eyeball dev set is that the risk
    of overfitting the dev set is greater.


    If you have plentiful access to data, then the size of the Eyeball dev set would
    be determined mainly by how many examples you have time to manually analyze. For
    example, I’ve rarely seen anyone manually analyze more than 1,000 errors.


    ## 19 Takeaways: Basic error analysis


    - When you start a new project, especially if it is in an area in which you are
    not an expert, it is hard to correctly guess the most promising directions.

    - So don’t start off trying to design and build the perfect system. Instead build
    and train a basic system as quickly as possible—perhaps in a few days. Then use
    error analysis to help you identify the most promising directions and iteratively
    improve your algorithm from there.

    - Carry out error analysis by manually examining ~100 dev set examples the algorithm
    misclassifies and counting the major categories of errors. Use this information
    to prioritize what types of errors to work on fixing.

    - Consider splitting the dev set into an Eyeball dev set, which you will manually
    examine, and a Blackbox dev set, which you will not manually examine. If performance
    on the Eyeball dev set is much better than the Blackbox dev set, you have overfit
    the Eyeball dev set and should consider acquiring more data for it.

    - The Eyeball dev set should be big enough so that your algorithm misclassifies
    enough examples for you to analyze. A Blackbox dev set of 1,000–10,000 examples
    is sufficient for many applications.

    - If your dev set is not big enough to split this way, just use the entire dev
    set as an Eyeball dev set for manual error analysis, model selection, and hyperparameter
    tuning.


    ## Bias and Variance


    ## 20 Bias and Variance: The two big sources of error


    Suppose your training, dev and test sets all come from the same distribution.
    Then you should always try to get more training data, since that can only improve
    performance, right?


    Even though having more data can’t hurt, unfortunately it doesn’t always help
    as much as you might hope. It could be a waste of time to work on getting more
    data. So, how do you decide when to add data, and when not to bother?


    There are two major sources of error in machine learning: bias and variance. Understanding
    them will help you decide whether adding data, as well as other tactics to improve
    performance, are a good use of time.


    Suppose you hope to build a cat recognizer that has 5% error. Right now, your
    training set has an error rate of 15%, and your dev set has an error rate of 16%.
    In this case, adding training data probably won’t help much. You should focus
    on other changes. Indeed, adding more examples to your training set only makes
    it harder for your algorithm to do well on the training set. (We explain why in
    a later chapter.)


    If your error rate on the training set is 15% (or 85% accuracy), but your target
    is 5% error (95% accuracy), then the first problem to solve is to improve your
    algorithm’s performance on your training set. Your dev/test set performance is
    usually worse than your training set performance. So if you are getting 85% accuracy
    on the examples your algorithm has seen, there’s no way you’re getting 95% accuracy
    on examples your algorithm hasn’t even seen.


    Suppose as above that your algorithm has 16% error (84% accuracy) on the dev set.
    We break the 16% error into two components:


    - First, the algorithm’s error rate on the training set. In this example, it is
    15%. We think of this informally as the algorithm’s **bias**.

    - Second, how much worse the algorithm does on the dev (or test) set than the
    training set. In this example, it does 1% worse on the dev set than the training
    set. We think of this informally as the algorithm’s **variance**.


    [^6]: The field of statistics has more formal definitions of bias and variance
    that we won’t worry about. Roughly, the bias is the error rate of your algorithm
    on your training set when you have a very large training set. The variance is
    how much worse you do on the test set compared to the training set in this setting.
    When your error metric is mean squared error, you can write down formulas specifying
    these two quantities, and prove that Total Error = Bias + Variance. But for our
    purposes of deciding how to make progress on an ML problem, the more informal
    definition of bias and variance given here will suffice.


    Some changes to a learning algorithm can address the first component of error—**bias**—and
    improve its performance on the training set. Some changes address the second component—**variance**—and
    help it generalize better from the training set to the dev/test sets.⁷ To select
    the most promising changes, it is incredibly useful to understand which of these
    two components of error is more pressing to address.


    Developing good intuition about Bias and Variance will help you choose effective
    changes for your algorithm.


    ⁷ There are also some methods that can simultaneously reduce bias and variance,
    by making major changes to the system architecture. But these tend to be harder
    to identify and implement.

