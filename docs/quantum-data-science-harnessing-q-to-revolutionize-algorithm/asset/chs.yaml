  \ 量子风险的 Q# 程序\n\n# 教程：生成随机数\n\n在本教程中，你将学习 Q# 程序如何：\n- 创建一个 Q# 程序。\n- 定义一个 Q# 程序。\n\
  - 使用 Q# 程序。\n- 使用量子程序。\n- 对代码进行文档。\n\n## 前提条件\n\n要运行基础教程，你需要：\n- Azure 账户\n- Visual\
  \ Studio Code\n- VS Code Quantum Development Kit\n- VS Code Q# 扩展\n- Python 3.6\
  \ 或更高版本\n- Jupyter 3.6 或更高版本\n\n## 安装量子\n\n在终端中运行以下命令：\n\n```bash\npip qsharp\n\
  ```\n\n## 定义问题\n\n经典计算机基于确定性序列生成伪随机数。然而，量子计算机由于量子比特测量的概率性可以生成真随机数。通过对零态量子比特应用 Hadamard\
  \ 门，使其进入叠加态。\n\n## 随机数生成器\n\n1. 定义 `max` 为要生成的数值。\n2. 确定表示 `max` 所需的随机位数 (`nBits`)。\n\
  3. 生成长度为 `nBits` 的位字符串。\n4. 如果位字符串表示的数字大于 `max`，则重复该过程。\n5. 否则，返回生成的数字。\n\n## 写入随机位\n\
  \n第一步是编写一个生成随机位的 Q# 操作：\n\n```qsharp\noperation GenerateRandomBit() : Result {\n\
  \    // 分配一个量子比特\n    use q = Qubit();\n    // 使用 Hadamard 门将量子比特设置为 0 和 1 的叠加态\n\
  \    H(q);\n    // 测量量子比特值\n    let result = M(q);\n    // 将量子比特重置为 |0> \n    Reset(q);\n\
  \    // 返回测量结果\n    return result;\n}\n```\n\n## 使用布洛球可视化 Q# 代码\n\n在布洛球上，北极代表经典值\
  \ 0，南极代表经典值 1。任何叠加态都可以由球上的一点表示。对零态量子比特应用 Hadamard 门会使其进入等叠加态，导致测量为 0 或 1 的概率均为 50%。\n\
  \n## 编写完整的随机数生成器\n\n1. 添加所需的命名空间：包含以下 Q# 命名空间：\n\n```qsharp\nopen Microsoft.Quantum.Convert;\n\
  open Microsoft.Quantum.Intrinsic;\nopen Microsoft.Quantum.Math;\n```\n\n```qsharp\n\
  operation GenerateRandomNumberInRange(max : Int) : Int {\n    mutable bits = [];\n\
  \    let nBits = BitSizeI(max);\n```\n\n\n\n\n```qsharp\nfor idxBit in 1..nBits\
  \ {\n    set bits += [GenerateRandomBit()];\n}\n\nlet sample = ResultArrayAsInt(bits);\n\
  \nreturn sample > max ? GenerateRandomNumberInRange(max) | sample;\n}\n```\n\n###\
  \ 3. 添加入口\n\n```qsharp\n@EntryPoint()\noperation Main() : Int {\n    let max = 100;\n\
  \    Message($\"采样 0 到{max}之间的随机数:\");\n    return GenerateRandomNumberInRange(max);\n\
  }\n```\n\n### 随机数生成器的完整代码\n\n```qsharp\nnamespace QuantumNumberGenerator {\n   \
  \ open Microsoft.Quantum.Convert;\n    open Microsoft.Quantum.Intrinsic;\n    open\
  \ Microsoft.Quantum.Math;\n\n    @EntryPoint()\n    operation Main() : Int {\n \
  \       let max = 100;\n        Message($\"采样 0 到{max}之间的随机数:\");\n        return\
  \ GenerateRandomNumberInRange(max);\n    }\n\n    operation GenerateRandomNumberInRange(max\
  \ : Int) : Int {\n        mutable bits = [];\n        let nBits = BitSizeI(max);\n\
  \        for idxBit in 1..nBits {\n            set bits += [GenerateRandomBit()];\n\
  \        }\n        let sample = ResultArrayAsInt(bits);\n        return sample\
  \ > max ? GenerateRandomNumberInRange(max) | sample;\n    }\n\n    operation GenerateRandomBit()\
  \ : Result {\n        use q = Qubit();\n        H(q);\n        let result = M(q);\n\
  \        Reset(q);\n        return result;\n    }\n}\n```\n\n### 运行随机数生成器程序\n\n\
  可以在 Azure Quantum 的 Copilot 中运行该程序，也可以在 Visual Studio Code 中作为独立的 Q# 或使用 Python\
  \ 主程序运行。选择运行次数（shots），并点击“运行”。结果将显示在直方图和结果字段中。\n"
