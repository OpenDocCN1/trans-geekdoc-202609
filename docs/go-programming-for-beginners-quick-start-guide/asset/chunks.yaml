  trans: "\n\n## 示例 7.2\n\n```go\npackage main\ntype Flower struct {\n  // 定义一个结构类型\n\
    \  color string\n  // 结构成员\n  size string\n  number int\n}\nfunc main() {\n  var\
    \ Rose Flower   // 声明一个结构变量 Rose\n  Rose.color = \"Red\"    // 给结构成员赋值\n  Rose.size\
    \ = \"Large\"\n  Rose.number = 10\n  println(\"Rose color : \", Rose.color);\n\
    \  println(\"Rose size : \", Rose.size);\n  println(\"Rose number : \", Rose.number);\n\
    }\n```\n**输出：**\n```\nRose color: Red\nRose size: Large\nRose number: 10\n```\n\
    **解释：** `var Rose Flower` 声明了一个结构变量 `Rose`。`Rose.color = \"Red\"` 给结构成员 `Rose.color`\
    \ 赋值。\n\n## 切片 (Slice)\n\n`Slice` 是一种特殊的数组，但它的长度是可变的。(1) 创建 `Slice` 的种语法如下：\n\n\
    `slice_name := []type{val1, val2, … }`\n\n### 示例 7.3\n\n```go\npackage main\n\
    import \"fmt\"\nfunc main() {\n  s := []int{1,2,3,4,5}    // 创建一个切片\n  fmt.Println(s)\n\
    }\n```\n**输出：**\n```\n1 2 3 4 5\n```\n**解释：** `s := []int{1,2,3,4,5}` 创建了一个包含五个值的\
    \ `Slice`。(2) 创建 `Slice` 的第二种语法如下：\n\n`slice_name := make([]type, len, cap)`\n\
    \n`len` 表示切片的长度。`cap` 表示包含切片元素的容量。\n\n### 示例 7.4\n\n```go\npackage main\nimport\
    \ \"fmt\"\nfunc main() {\n  s := make([]int, 5, 8)\n  fmt.Printf(\"len=%d cap=%d\
    \ slice=%v\\n\",len(s),cap(s),s)\n}\n```\n**输出：**\n```\nlen=5   cap=8   slice=[00000]\n\
    ```\n**解释：** `len(s)` 获取切片的长度。`cap(s)` 获取包含所有元素的容量。由于 `Slice` 元素尚未分配任何值，因此这个 `Slice`\
    \ 的五个值均为零。(3) 从 `Slice` 元素中获取某些值：\n\n`slice_name[key1, key2]`\n\n获取从 `key1` 到\
    \ `key2-1` 的值。\n\n### 示例 7.5\n\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n  var s = []int{0, 1, 2, 3, 4, 5, 6, 7, 8}\n  mySlice:= s[2:6]  // 获取从 s[2]\
    \ 到 s[5] 的值\n  fmt.Println(mySlice)\n}\n```\n**输出：**\n```\n2 3 4 5\n```\n**解释：**\
    \ `s[2: 6]` 获取从 `s[2]` 到 `s[5]` 的值。(4) 给 `Slice` 元素赋值。\n\n`slice_name[key] = value`\n\
    \n### 示例 7.6\n\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var s =\
    \ []int{0, 1, 2, 3, 4, 5, 6, 7, 8}\n  s[3] = 10      // 给 s[3] 赋新值\n  s[6] = 100\
    \     // 给 s[6] 赋新值\n  fmt.Println(s)\n}\n```\n**输出：**\n```\n[0 1 2 10 4 5 100\
    \ 7 8]\n```\n**解释：** `s[3] = 10` // 给 `s[3]` 赋新值；`s[6] = 100` // 给 `s[6]` 赋新值。\n\
    \n## append() & copy()\n\n`append(slice_name, values)` // 向 `Slice` 中追加值\n`copy(new_slice,\
    \ old_slice)` // 将旧 `Slice` 拷贝到新的 `Slice`\n\n### 示例 7.7\n\n```go\npackage main\n\
    import \"fmt\"\nfunc main() {\n  mySlice := make([]int, 0, 0)\n  showSlice(mySlice)\n\
    \  mySlice = append(mySlice, 10,20,30)  // 追加\n  newSlice := make([]int, len(mySlice),\
    \ cap(mySlice)*2)\n  copy(newSlice,mySlice)  // 拷贝\n  showSlice(newSlice)\n}\n\
    func showSlice(x []int){\n  fmt.Printf(\"len=%d cap=%d slice=%v\\n\",len(x),cap(x),x)\n\
    }\n```\n**输出：**\n```\nlen=0 cap=0 slice=[]\nlen=3 cap=4 slice=[10 20 30]\n```\n\
    **解释：** `append(mySlice, 10,20,30)` 为 `mySlice` 添加了三个值。`newSlice := make([]int,\
    \ len(mySlice), cap(mySlice)*2)` 创建了一个新切片，容量是原来的倍。`copy(newSlice,mySlice)` 执行了拷贝。\n\
    \n## 总结\n\n`Slice` 是一个特殊的数组，但它的长度是可变的。\n(1) 定义结构体类型：\n```go\ntype structure_name\
    \ struct {\n  member1 type\n  member2 type\n  member3 type\n}\n```\n(2) 访问结构体成员：`structure_name.member1`\n\
    (3) 声明结构体变量：`var structure_name`\n(4) 给结构体成员赋值：`member = value`\n\n## 第 8 章 GORoutine\n\
    \n`goroutine` 用于运行多个任务，意味着通过 `go` 关键字同时执行多个线程。以下示例是定义 `goroutine` 函数并运行它：\n\n\
    ```go\ngo func(arguments) { // 定义 goroutine\n}(arguments) // 运行 goroutine\n```\n\
    \n### 示例 8.1\n\n```go\npackage main\nimport \"fmt\"\nfunc fn(s string) {\n  for\
    \ i := 0; i < 5; i++ {\n    fmt.Println(s)\n  }\n}\nfunc main() {\n  fn(\"Thread\
    \ A\")\n  go func() { // 定义 goroutine\n    fmt.Println(\"Thread B\")\n  }() //\
    \ 运行 goroutine\n  fmt.Scan() // 从键盘输入\n  fmt.Println(\"Complete!\")\n}\n```\n\
    **输出：**\n```\nThread A\nThread B\nComplete!\n```\n**解释：** `go func(string) { ...\
    \ }` 定义了 `goroutine` 函数。`(\"Thread B\")` 运行了该 `goroutine`。\n\n## Range\n\n`Range`\
    \ 是 Go 语言的内置函数，用于遍历数组、切片和映射。\n* 遍历数组、切片返回索引和值。\n* 遍历映射返回键和值。\n* 遍历通道返回值。\n\n(1)\
    \ 遍历数组/切片\n\n```go\nfor index, value := range array/slice {}\n```\n\n### 示例 8.2\n\
    \n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  for key, value := range\
    \ []int{10,11,12,13} {\n    fmt.Printf(\"key:%d value:%d\\n\", key, value)\n \
    \ }\n}\n```\n**输出：**\n```\nkey:0 value:10\nkey:1 value:11\nkey:2 value:12\nkey:3\
    \ value:13\n```\n**解释：** `range []int{10,11,12,13}` 遍历了切片并返回索引和值。\n\n(2) 遍历字符串\n\
    \n```go\nfor key, value := range str {}\n```\n\n### 示例 8.3\n\n```go\npackage main\n\
    import \"fmt\"\nfunc main() {\n  var str = \"hello\"\n  for key, value := range\
    \ str {\n    fmt.Printf(\"key:%d value:%0x\\n\", key, value)\n  }\n}\n```\n**输出：**\n\
    ```\nkey:0 value:0x68\nkey:1 value:0x65\nkey:2 value:0x6c\nkey:3 value:0x6c\n\
    key:4 value:0x6f\n```\n**解释：** `range str` 遍历字符串，返回其键（索引）和值（字符）。\n\n(3) 遍历通道\n\
    \n```go\nfor value := range channel {}\n```\n\n### 示例 8.4\n\n```go\npackage main\n\
    import \"fmt\"\nfunc main() {\n  c := make(chan int)\n  go func() { // 定义 goroutine\n\
    \    c <- 1 // 向通道发送数据\n    c <- 2\n    c <- 3\n    close(c) // 关闭通道\n  }() //\
    \ 调用 goroutine 函数\n  for v := range c { // 遍历通道\n    fmt.Println(\"Send data to\
    \ channel: \",v)\n  }\n}\n```\n**输出：**\n```\nSend data to channel: 1\nSend data\
    \ to channel: 2\nSend data to channel: 3\n```\n**解释：** `range c` 遍历通道。`go func(){}`\
    \ 定义了 `goroutine` 函数。`()` 调用了函数。\n\n## Map\n\n`Map` 是键值对的无序集合。`Map` 用于通过键快速检索数据，类似于索引并指向数据的值。定义\
    \ `map` 的两种语法如下：\n\n(1) `m1 := map[key_type]value_type{}`\n`m1` 是一个 map 变量。\n\
    (2) `m2 := make(map[key_type] value_type)`\n`m2` 是一个 map 变量。\n\n### 示例 8.5\n\n\
    ```go\npackage main\nimport \"fmt\"\nfunc main() {\n  m1 := map[int]int{}\n  m2\
    \ := make(map[int]int)\n  m1[1] = 10\n  m2[2] = 20\n  for key, value := range\
    \ m1 {\n    fmt.Println(\"Key: \", key, \"Value: \", value)\n  }\n  for key, value\
    \ := range m2 {\n    fmt.Println(\"Key: \", key, \"Value: \", value)\n  }\n}\n\
    ```\n**输出：**\n```\nKey: 1 Value: 10\nKey: 2 Value: 20\n```\n**解释：** `m1 := map[int]int{}`\
    \ 定义了 map `m1`。`m2 := make(map[int]int)` 定义了 map `m2`。\n\n## 类型转换\n\n类型转换意味着变量的一种数据类型转换为另一种数据类型。\n\
    \n`data_type (variables)`\n\n### 示例 8.6\n\n```go\npackage main\nimport \"fmt\"\
    \nfunc main() {\n  var num1 int = 100\n  var num2 int = 3\n  var result float32\n\
    \  result = float32(num1)/float32(num2) // 转换\n  fmt.Printf(\"The result is %f\\\
    n\", result)\n}\n```\n**输出：**\n```\nThe result is 33.333332\n```\n**解释：** `float32(num1)/float32(num2)`\
    \ 将数据类型从 `int` 转换为 `float32`。\n\n"
- fmt: "\n# Recursion\n\nRecursion means that the function calls itself.\n\n```go\n\
    func recursion() { \n    recursion() // call itself \n} \nfunc main() { \n   \
    \ recursion() \n}\n```\n\n### Example 8.7\n```go\npackage main\nimport \"fmt\"\
    \nfunc myRecur(n int) int { \n    if n == 0 { return 1 }\n    return n * myRecur(n-1)\
    \ // call itself \n}\nfunc main() { \n    fmt.Print(\"Factorial of 10 is \") \n\
    \    fmt.Print(myRecur(10)) \n}\n```\n**Output:** Factorial of 10 is 3628800 \
    \ \n**Explanation:** `myRecur(n-1)` calls itself. The recursion doesn't stop until\
    \ `myRecur(0)` occurs.\n\n# Summary\n\n- `goroutine` is used to run multiple tasks\
    \ simultaneously, which means that `goroutine` function can execute multiple threads\
    \ at the same time by using the `go` keyword.\n- `Range` is a built-in function\
    \ of the Go language, it is used to iterate over arrays, `slices`, `strings` and\
    \ `maps`.\n- `Map` is an unordered collection of key-value pairs. `Map` is used\
    \ to quickly retrieve data by key, which is similar to an index and points to\
    \ the value of the data.\n- Type conversion means the one data type of a variable\
    \ being converted into another data type.\n- `data_type` (variables)\n- Recursion\
    \ means that the function calls itself.\n\n```go\nfunc recursion() { \n    recursion()\
    \ // call itself \n} \nfunc main() { \n    recursion() \n}\n```\n\n# Appendix\
    \ 1\n\n## Concurrency\n\nGo language supports concurrency, we can use the `go`\
    \ keyword to call a function, start a new runtime thread `goroutine`. The syntax\
    \ to call a function with `go` keyword is as follows:\n\n`go function_name (arguments)`\n\
    \n### Example:\n```go\npackage main\nimport (\n    \"fmt\"\n    \"time\"\n)\n\
    func fn(s string) { \n    // define a function fn\n    for i := 0; i < 5; i++\
    \ { \n        time.Sleep(200 * time.Millisecond) // delay running\n        fmt.Println(s)\
    \ \n    } \n}\nfunc main() { \n    go fn(\"Thread A\") // call the function fn\
    \ \n    fn(\"Thread B\") // call the function fn \n    go func(msg string) { \n\
    \        // define a goroutine function\n        fmt.Println(msg) \n    }(\"Press\
    \ Enter to Stop!\") // run the goroutine function \n    fmt.Scanln() // accept\
    \ user input from keyboard \n    fmt.Println(\"Complete! \") \n}\n```\n**Output:**\
    \ Thread B Thread A Thread B Thread A Thread B Thread A Thread B Thread A Press\
    \ Enter to Stop! Thread A Complete!  \n**Explanation:** `go fn(\"Thread A\")`\
    \ calls the function `fn` with `go` keyword, start a new thread `goroutine`.\n\
