    \ a function\n  return num1 + num2\n  // pass the result to the caller\n}\n```\n\
    **Output:** The sum is 30\n**Explanation:** `add(a, b)` calls the function `add(a,\
    \ b)`, and pass the parameter values of `a` and `b` to `num1` and `num2`. `func\
    \ add(num1, num2 int) int` defines a function `add(…)`, `num1` and `num2` receive\
    \ the value from `a` and `b`. `return num1 + num2` passes the result value to\
    \ the caller `add(…)`.\n\n## Example 5.5\n```go\npackage main\nimport \"fmt\"\n\
    func swap (a, b string) (string, string) {\n  // define a function\n  return b,\
    \ a\n  // returns two values to the caller\n}\nfunc main() {\n  x, y := swap(\"\
    in 8 Hours\", \"JavaScript\")\n  //call the function\n  fmt.Println(x, y)\n}\n\
    ```\n**Output:** JavaScript in 8 Hours\n**Explanation:** `func swap(a, b string)\
    \ (string, string) {…}` defines a function. `swap(\"in 8 Hours\", \"JavaScript\"\
    )` call the function `swap(…)`, and pass the two parameters to the function `swap(…){…}`.\n\
    \n## Working Scope\nThe working scope in any coding is a range where a variable\
    \ can be accessed, and outside that working scope the variable cannot be accessed.\n\
    \n- Variables defined within a function are called **local variables**.\n- Variables\
    \ defined outside a function are called **global variables**.\n\n## Example 5.6\n\
    ```go\npackage main\nfunc main() {\n  var a, b, c int\n  // defines local variables\n\
    \  a = 100\n  b = 200\n  c = a + b\n  print(a, b, c)\n}\n```\n**Output:** 100\
    \ 200 300\n**Explanation:** `var a, b, c int` define three local variables inside\
    \ a function.\n\n## Example 5.7\n```go\npackage main\nvar v int = 100\n// define\
    \ a global variable\nfunc main(){\n  print (\"The value of the global variable\
    \ is \", v)\n}\n```\n**Output:** The value of the global variable is 100.\n**Explanation:**\
    \ `var v int = 100` defines a global variable.\n\n## Summary\n- The `break` statement\
    \ is used to terminate the loop. `break` statement also is used to terminate the\
    \ `case` in `switch` statement.\n- The `continue` statement skips the current\
    \ loop to execute the next one.\n- The `goto` statement can go to the specified\
    \ code and execute them unconditionally.\n1. The syntax to define a function is\
    \ as follows: `func function_name ( parameter type) type { …… return … }`\n2.\
    \ The syntax to call a function is as follows: `variable = function_name ( parameter\
    \ type )`\n- Variables defined within a function are called **local variables**.\
    \ Variables defined outside a function are called **global variables**.\n\n##\
    \ Hour 6\n### Array\nAn array is a collection of variables of the same type and\
    \ name.\n- **Array element**: each variable in an array.\n- **Array index**: also\
    \ called as key, the numbers on each element.\n- **Note**: the array index or\
    \ array key starts from zero.\n\nThere are several ways to define an array:\n\
    1. `var array_name[length] type` // define an array\n2. `array_name[key] = value`\
    \ // assign value to the element\n\n#### Example 6.1\n```go\npackage main\nfunc\
    \ main() {\n  var arr [3]int\n  // define an array with three elements\n  arr[0]\
    \ = 100\n  // assign a value to the element\n  arr[1] = 101\n  arr[2] = 102\n\
    \  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n**Explanation:**\
    \ `var arr [3]int` defines an array with three elements. `arr` is the array name.\
    \ `3` is length. The type is `int`. `arr[0]=100` assigns a value to the element.\
    \ `arr` is the array name, `0` is an index or key.\n\n#### Example 6.2\n```go\n\
    package main\nfunc main() {\n  var arr [3]int = make([int], 3)\n  // define an\
    \ array\n  arr[0] = 100\n  // assign a value to the element\n  arr[1] = 101\n\
    \  arr[2] = 102\n  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101\
    \ 102\n**Explanation:** `var arr [3]int = make([int], 3)` defines an array with\
    \ three elements.\n\n#### Example 6.3\n```go\npackage main\nfunc main() {\n  var\
    \ arr [3]int = {100, 101, 102}\n  // define an array with values\n  print(arr[0],\
    \ arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n**Explanation:** `var arr\
    \ [3]int = {100, 101, 102}` defines an array with values.\n\n#### Example 6.4\n\
    ```go\npackage main\nfunc main() {\n  var arr = [...]int{100, 101, 102}\n  //\
    \ defines an array\n  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101\
    \ 102\n**Explanation:** `var arr = [...]int{100, 101, 102}` defines an array with\
    \ values.\n\n### Pointers\nA pointer represents the value of a memory address.\n\
    1. `&variable` // get the memory address of a variable\n2. `var variable_name\
    \ *type` // declare a pointer; `*variable_name` // get the variable value in the\
    \ address\n\nFor example:\n- `var ipoint *int` // declare an int pointer\n- `var\
    \ fpoint *float32` // declare a float32 pointer\n- `*ipoint` // gets the ipoint\
    \ value in the memory address\n- `*fpoint` // gets the fpoint value in the memory\
    \ address\n\n#### Example 6.6\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n  var num int = 100\n  var pt *int\n  // declare a pointer\n  pt = &num\n\
    \  // &num get address and assign to pt\n  fmt.Printf(\"The address of num: %x\\\
    n\", &num)\n  fmt.Printf(\"The address in pt: %x\\n\", pt)\n  fmt.Printf(\"The\
    \ value of the *pt: %d\\n\", *pt)\n}\n```\n**Output:**\nThe address of num: C000044058\n\
    The address in pt: C000044058\nThe value of the *pt: 100\n**Explanation:** `&num`\
    \ gets the memory address from `num`. `pt = &num` assigns the memory address to\
    \ `pt`. `*pt` returns the `pt` value in the memory address.\n\n#### Example 6.7\n\
    ```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var a string = \"Hello\"\
    \n  var b *string\n  var c string\n  b = &a\n  // &a gets the memory address\n\
    \  c = *b\n  // *b gets the value in memory address\n  fmt.Println(a)\n  fmt.Println(b)\n\
    \  fmt.Println(c)\n}\n```\n**Output:**\nHello\n0xc000381c8\nHello\n**Explanation:**\
    \ `&a` returns the memory address of `a`. `*b` returns the value in memory address.\n\
    \n### Nil Pointer\nWhen a pointer is defined and not assigned to any variable\
    \ address, its value is `nil`.\n\n#### Example 6.8\n```go\npackage main\nimport\
    \ \"fmt\"\nfunc main() {\n  var npt *int\n  fmt.Printf(\"The address stored in\
    \ npt: %x\\n\", npt)\n}\n```\n**Output:** The address stored in npt: 0\n**Explanation:**\
    \ `npt` is a pointer, which has not yet assigned any address, so the value is\
    \ 0.\n\n## Hour 7\n### Structures\nA structure is a collection of data with the\
    \ same or different types of data.\n1. **Define Structure Type**: `type structure_name\
    \ struct { member1 type; member2 type; ... member3 type; }`\n2. **Access Structure\
    \ Members**: `structure_name{member1: value1, member2: value2, … }`\n\n#### Example\
    \ 7.1\n```go\npackage main\nimport \"fmt\"\ntype Flower struct {\n  // define\
    \ a structure type\n  color string\n  // structure member\n  size string\n  number\
    \ int\n}\nfunc main() {\n  fmt.Println(Flower{color:\"Red\", size:\"Large\", number:10\
    \ })\n}\n```\n**Output:** {Red Large 10}\n**Explanation:** `type Flower struct`\
    \ defines a structure type.\n"
