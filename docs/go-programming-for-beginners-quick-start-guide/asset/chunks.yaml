    - [Concurrency](#part0064.xhtml)\n- [Appendix 2](#part0065.xhtml)\n- [Tests](#part0066.xhtml)\n\
    - [Answers](#part0067.xhtml)\n- [Source Code Download](#part0068.xhtml)\n\n##\
    \ Hour 1\n\n### What is Go?\nGo is an open source programming language released\
    \ by Google in 2009. Go is a new language, a concurrent and fast compiled language\
    \ with garbage collection. It has a great characteristic: it can compile a large\
    \ Go program in a few seconds on a computer. Go provides a model for software\
    \ construction that makes dependency easier. Go is a statically typed language,\
    \ and its type definition has no hierarchy, so users don't have to spend time\
    \ defining relationships between types, which make users feel it is lighter than\
    \ a typical object-oriented language. Go can provide a way to construct system\
    \ software on a multicore machine. The Go language programming is optimized for\
    \ multiprocessor system applications that can be faster than `C++` and more securely\
    \ support parallel processes. The feature of the Go language:\n\n1. Simple, fast\
    \ and safe\n2. Parallel, open source\n3. Memory management, array security, fast\
    \ compilation\n\n### Install Go\nThis book uses Windows OS as examples to install\
    \ Go. Download Link: [https://golang.org/dl/](https://golang.org/dl/)\n1. Click\
    \ the link, go to the download web page. (image_rsrc2U0.jpg)\n2. Click the `go1.11.2\
    \ windows-amd64.msi`, download the Go Installer to the local computer.\n3. Click\
    \ the Go Installer, begin to install (image_rsrc2U1.jpg)\n4. Click the `Next`.\
    \ By default, MSI files will be installed in the `C:\\Go` directory.\n5. When\
    \ the installation is complete, please click the `Finish`. (image_rsrc2U2.jpg)\n\
    \n### Environment Variables\nAfter installing Go, you need to add `C:\\Go\\bin`\
    \ to the `PATH` of environment variables. Please configure the environment variables.\
    \ Go to “Control Panel” > `System` > `Advanced System Settings` > `Advanced` >\
    \ `Environment Variables` > `Path` > `Edit…` > `New`. Please add `C:\\Go\\bin`\
    \ to the end of the Path. (image_rsrc2U3.jpg)\nNote: The setting interface is\
    \ different in different Windows OS. Please restart the computer so that the setting\
    \ will take effect.\n\n### First Program of Go\nPlease create a working folder\
    \ `myGo` under `C:\\`, open the Notepad editor, and write the following code into\
    \ the editor.\n\nExample 1.1\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n    fmt.Println(\"Hello, World!\")\n}\n```\nSave the file as `hello.go` in\
    \ the `C:\\myGo`. Open the Command Line with `cmd`, enter the following commands:\
    \ (image_rsrc2U4.jpg)\nOutput: `Hello World!`\n\nExplanation: `package main` defines\
    \ the name of the package as `main`. Each Go application must include a package\
    \ called `main`. The imported package `fmt` contains I/O functions. `func main()`\
    \ is the first function to execute in the Go application. `fmt.Println(\"Hello,\
    \ World!\")` outputs the text `Hello, World!`. `C:\\Windows\\system32>cd\\` goes\
    \ back to C: root directory. `C:\\cd myGo` enters the `myGo` folder. `go run`\
    \ is a command to execute the Go program.\n\n### Comment\n```go\n//\n/* ... */\n\
    ```\n`//` is the symbol of single-line comment. `/*` and `*/` are the symbols\
    \ of multi-line comment. Comments will not be compiled. The Go compiler will ignore\
    \ all comments.\n\nExample 1.2\n```go\npackage main // package declaration\nimport\
    \ \"fmt\"\nfunc main() {\n    // define a main function\n    fmt.Println(\"Hello,\
    \ World!\")\n}\n/* The output of the above code is: Hello, World! */\n```\nPlease\
    \ use `go run` command to run this program, and check the result.\n"
