    \ \n    var e = true\n    println(a, b, c, e)\n}\n```\nA. `string` | B. `boolean`\
    \ | C. `bool` | D. `char`\n\n**(10)** \n**给定：** `a = 100`, `b = 2`  \n**计算：**\
    \ `a + b` 返回 `102`  \n`a - b` 返回 `98`  \n`a * b` 返回 `200`  \n`a / b` 返回 `50` \
    \ \n`a % b` 返回 fill in\nA. `0` | B. `1` | C. `2` | D. `3`\n\n**(11)** \n```go\n\
    package main \nimport \"fmt\" \nfunc main() { \n    c1:=make(chan int,10) // 创建\
