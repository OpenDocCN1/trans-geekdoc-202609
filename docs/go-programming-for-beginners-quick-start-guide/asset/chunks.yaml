  trans: "\n\n# 递归\n\n递归意味着函数调用自己。\n\n```go\nfunc recursion() { \n    recursion()\
    \ // 调用自己 \n} \nfunc main() { \n    recursion() \n}\n```\n\n### 示例 8.7\n```go\n\
    package main\nimport \"fmt\"\nfunc myRecur(n int) int { \n    if n == 0 { return\
    \ 1 }\n    return n * myRecur(n-1) // 调用自己 \n}\nfunc main() { \n    fmt.Print(\"\
    Factorial of 10 is \") \n    fmt.Print(myRecur(10)) \n}\n```\n**输出:** Factorial\
    \ of 10 is 3628800  \n**解释：** `myRecur(n-1)` 调用了自身。递归会一直进行，直到出现 `myRecur(0)`。\n\
    \n# 总结\n\n- `goroutine` 用于同时运行多个任务，这意味着 `goroutine` 函数可以通过使用 `go` 关键字同时执行多个线程。\n\
    - `Range` 是 Go 语言的内置函数，用于遍历数组、`slices`、`strings` 和 `maps`。\n- `Map` 是键值对的无序集合。`Map`\
    \ 用于通过键快速检索数据，类似于索引并指向数据的值。\n- 类型转换意味着将变量的一种数据类型转换为另一种数据类型。\n- `data_type`（变量）\n\
    - 递归意味着函数调用自己。\n\n```go\nfunc recursion() { \n    recursion() // 调用自己 \n} \nfunc\
    \ main() { \n    recursion() \n}\n```\n\n# 附录 1\n\n## 并发\n\nGo 语言支持并发，我们可以使用 `go`\
    \ 关键字来调用函数，启动一个新的运行时线程 `goroutine`。使用 `go` 关键字调用函数的语法如下：\n\n`go function_name\
    \ (arguments)`\n\n### 示例：\n```go\npackage main\nimport (\n    \"fmt\"\n    \"\
    time\"\n)\nfunc fn(s string) { \n    // 定义一个函数 fn\n    for i := 0; i < 5; i++\
    \ { \n        time.Sleep(200 * time.Millisecond) // 延迟运行\n        fmt.Println(s)\
    \ \n    } \n}\nfunc main() { \n    go fn(\"Thread A\") // 调用函数 fn \n    fn(\"\
    Thread B\") // 调用函数 fn \n    go func(msg string) { \n        // 定义一个 goroutine\
    \ 函数\n        fmt.Println(msg) \n    }(\"Press Enter to Stop!\") // 运行 goroutine\
    \ 函数\n    fmt.Scanln() // 从键盘接受用户输入 \n    fmt.Println(\"Complete! \") \n}\n```\n\
    **输出:** Thread B Thread A Thread B Thread A Thread B Thread A Thread B Thread\
    \ A Press Enter to Stop! Thread A Complete!  \n**解释：** `go fn(\"Thread A\")` 使用\
    \ `go` 关键字调用函数 `fn`，启动了一个新线程 `goroutine`。\n\n# 附录 2\n\n## 测试\n\n请选择正确答案。\n\n**(01)**\
    \ \n```go\npackage main \nimport \"fill in\" // 导入内置函数 \nfunc main() { \n    fmt.Println(\"\
    Hello, World! \") \n}\n```\nA. `iostream` | B. `math` | C. `i/o` | D. `fmt`\n\n\
    **(02)** \n```go\nfill in a int // 声明变量 \na = 100\n```\nA. `variable` | B. `variab`\
    \ | C. `var` | D. `va`\n\n**(03)** \n```go\npackage main \nfunc main() { \n  \
    \  const ( \n        x = fill in // 特殊常量 \n        y = fill in\n        z = fill\
    \ in \n    ) \n    print(x, y, z) \n}\n```\n**输出:** 0 1 2  \nA. `const` | B. `iota`\
    \ | C. `constant` | D. `iote`\n\n**(04)** \n```go\npackage main \nfunc main()\
    \ { \n    var number int=20 \n    fill in ( number ) { // 让 number 比较每个 case \n\
    \    case 10 : println (\"Running case 10\") \n    case 20 : println (\"Running\
    \ case 20\") \n    case 30 : println (\"Running case 30\") \n    default : println\
    \ (\"Running default code\") \n    } \n}\n```\nA. `If` | B. `While` | C. `Do`\
