    \ / y;` outputs 2 `x-=y;` // `x=x \\- y;` outputs 100 `x%=y;` // `x=x%y;` outputs\
    \ 0\n\n## Operators Precedence\nThe following table lists the operator precedence:\
    \ (From top to bottom means priority from high to low).\n\n| Priority |\n| ---\
    \ |\n| 7 |\n| 6 |\n| 5 |\n| 4 |\n| 3 |\n| 2 |\n| 1 |\n\n## Summary\nA constant\
    \ is an identifier whose value is not changed while the program is running. The\
    \ syntax to define a constant is: `const constant_name [type] = value` or `const\
    \ constant_name = value`. “iota” is a special constants. The value of the first\
    \ `iota` is equal to 0, and its value is automatically incremented by 1 whenever\
    \ `iota` is used in a new row. There are following operators: arithmetic operators,\
    \ relational operators, logical operators, assignment operators.\n\n## Hour 4\n\
    \n### If Statement\n\n| `if test-expression { // if true do this; }` |\n| ---\
    \ |\n\n“if statement” executes codes inside `{ … }` only if a specified condition\
    \ is true, does not execute any codes inside `{…}` if the condition is false.\n\
    \nExample 4.1\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    var num\
    \ int = 100\n    if num > 50 {\n        fmt.Printf(\"num is greater than 50\"\
    )\n    }\n}\n```\nOutput: num is greater than 50\nExplanation: Because the value\
    \ of `num` is greater than 50, the code inside the `{ }` has been executed.\n\n\
    ### if…else statement\n\n| `if test_expression{ // if true do this } else { //\
    \ if false do this }` |\n| --- |\n\n“if... else statement” runs some code if a\
    \ condition is true and runs another code if the condition is false.\n\nExample\
    \ 4.2\n```go\npackage main\nfunc main() {\n    var num int = 100\n    if num >\
    \ 200 {\n        println(\"num is greater than 200\")\n    } else {\n        println(\"\
    num is less than 200\")\n    } \n}\n```\nOutput: num is less than 200\nExplanation:\
    \ Because the value of `num` is less than 200, the `else { }` code has been executed.\n\
    \n### Switch Statement\n\n| `switch (variable ) { case 1: if equals this case,\
    \ do this case 2: if equals this case, do this case 3: if equals this case, do\
    \ this case default : if equals any case, run default }` |\n| --- |\n\nThe value\
    \ of the `variable` will compare each `case` first, if equals one of the `case`\
    \ value; it will execute that `case` code.\n\nExample 4.3\n```go\npackage main\n\
    func main() {\n    var number int=20\n    switch ( number ) {\n        case 10:\
    \ println (\"Running case 10\")\n        case 20: println (\"Running case 20\"\
    )\n        case 30: println (\"Running case 30\")\n        default: println (\"\
    Running default\")\n    }\n}\n```\nOutput: Running case 20\nExplanation: The `number`\
    \ value is 20; it will match `case 20`, so it will run the code in `case 20`.\n\
    \n### Select Statement\nSelect Statement is a bit like Switch Statement. Switch\
    \ Statement executes case code sequentially. Select Statement executes case code\
    \ randomly.\n\n1) `make(chan int, number)`\n“make(chan int, number)`” creates\
    \ a channel with buffer. `chan` means a channel. For example: `make(chan int,\
    \ 2)` creates a channel with 2 buffers; `make(chan int, 10)` creates a channel\
    \ with 10 buffers.\n\n2) `chan <- data`\n“chan <- data” sends data to a channel.\
    \ `data <- chan` receives data from a channel.\n\n3) `select { case receive or\
    \ send data : statement(s); default : optional statement(s); }`\nIf more than\
    \ one case can run, Select will randomly pick one to execute and the others not.\
    \ If no case can run, Select will execute `default` clause.\n\nExample 4.4\n```go\n\
    package main\nimport \"fmt\"\nfunc main() {\n    c1:=make(chan int,1024) // create\
    \ a channel\n    c2:=make(chan int,1024)\n    c3:=make(chan int,1024)\n    c1\
    \ <- 100 // send data to a channel\n    c2 <- 200\n    c3 <- 300\n    select {\n\
    \        case <-c1: fmt.Println(\"Receive data from c1\")\n        case <-c2:\
    \ fmt.Println(\"Receive data from c2\")\n        case <-c3: fmt.Println(\"Receive\
    \ data from c3\")\n        default: fmt.Println(\"Not receive data yet\")\n  \
    \  }\n}\n```\nOutput: Receive data from c2\nExplanation: The select statement\
    \ executes one of the case codes randomly.\n\n### For Loop\nFor Loop is a control\
    \ structure that can execute a specified number of loops.\n\n1) `for init; condition;\
    \ in/decrease { }`\n`init`: assign a first value to a variable.\n`condition`:\
    \ `a` test expression.\n`in/decrease`: increement or decreement.\n\nExample 4.5\n\
    ```go\npackage main\nfunc main() {\n    for a := 0; a <= 5; a++ {\n        print(a)\n\
    \    }\n}\n```\nOutput: 0 1 2 3 4 5\nExplanation: `a :=0` assigns 0 to `a`. `a<=5`\
    \ is a test expression. `a++` is an increement.\n\n2) `for test_expression { }`\n\
    `test_expression` checks if the condition is true or false.\n\nExample 4.6\n```go\n\
    package main\nfunc main() {\n    var a int =0\n    var b int = 5\n    for a <\
    \ b {\n        a++\n        print(a)\n    }\n}\n```\nOutput: 1 2 3 4 5\nExplanation:\
    \ `for a < b` checks if `a` is greater than `b`.\n\n## Summary\n“if statement”\
    \ executes codes inside `{ … }` only if a specified condition is true, does not\
    \ execute any codes inside `{…}` if the condition is false. In “switch statement”,\
    \ the value of the variable will compare each `case` first, if equals one of the\
    \ `case` value; it will execute that `case` code. Select Statement is a bit like\
    \ Switch Statement. Switch Statement executes case code sequentially. Select Statement\
    \ executes case code randomly. For Loop is a control structure that can execute\
    \ a specified number of loops.\n\n## Hour 5\n\n### Break\n| `break` |\n| --- |\n\
    The break statement is used to terminate the loop. Break statement also is used\
    \ to terminate the case in switch statement.\n\nExample 5.1\n```go\npackage main\n\
    func main() {\n    var num int = 20\n    for num < 30 {\n        print(num,\"\
    \ \");\n        num++;\n        if num > 25 {\n            break; // terminate\
    \ the for loop\n        }\n    }\n}\n```\nOutput: 20 21 22 23 24 25\nExplanation:\
    \ if `num > 25` is a test expression, if true, the `break` statement will terminate\
    \ the loop.\n\n### Continue\n| `continue` |\n| --- |\nThe continue statement skips\
    \ the current loop to execute the next one.\n\nExample 5.2\n```go\npackage main\n\
    func main() {\n    var num int = 20\n    for num < 30 {\n        if num == 25\
    \ {\n            num = num + 1;\n            continue; // skip the current loop\n\
    \        }\n        print(num, \" \")\n        num++;\n    }\n}\n```\nOutput:\
    \ 20 21 22 23 24 26 27 28 29\nExplanation: if `num == 25` is a test expression,\
    \ if true, the `continue` statement will skip the current loop, and execute the\
    \ next one. Note: there is no 25 in the result.\n\n### Goto\n| `goto label; ...\
    \ label: statement;` |\n| --- |\nThe goto statement can go to the specified code\
    \ and execute them unconditionally.\n\nExample 5.3\n```go\npackage main\nfunc\
    \ main() {\n    var num int = 10\n    if num > 10{ goto code01 }\n    if num ==\
    \ 10{ goto code02 }\n    code01: print(\"num > 10\")\n    code02: print(\"num\
    \ == 10\")\n}\n```\nOutput: num == 10\nExplanation: `goto code01` means to execute\
    \ the statement with label `code01`. `goto code02` means to execute the statement\
    \ with label `code02`.\n\n### Function\nA function is a block of code that is\
    \ reused to perform the same task.\n\n1) The syntax to define a function is: `func\
    \ function_name ( parameter type) type { …… return … }`\n`func`: define a function\n\
    `return`: pass the result to the caller.\n\n2) The syntax to call a function is:\
    \ `variable = function_name ( parameter type )`\n"
