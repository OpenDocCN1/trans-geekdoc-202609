  trans: "\n\n# 标识符\n标识符用于命名变量、函数、表达式等。标识符由一个或多个字母（A~Z 和 a~z）、数字（0~9）和下划线组成，但第一个字符必须是字母或下划线。标识符的第一个字符不能是数字。\n\
    \n以下标识符是有效的：`myVariable`、`_Variable`、`variable100`。\n以下标识符是无效的：\n- `continue`\
    \ // “continue”是 Go 语言的关键字\n- `100Variable` // 以数字开头\n\n## 总结\n`\"package main\"\
    ` 定义包名为 `main`。每个 Go 应用必须包含一个名为 `main` 的包。导入包 `\"fmt\"` 包含了 I/O 函数。`func main()`\
    \ 是 Go 应用中执行的第一个函数。`fmt.Println(\"Hello, World! \")` 输出文本 `\"Hello, World! \"\
    `。`//` 是单行注释的符号。`/*` 和 `*/` 是多行注释的符号。注释不会被编译。Go 编译器将忽略所有注释。\n\n# 第 2 小时\n\n##\
    \ 分隔符\n在 Go 语言中，每个语句不需要分号来结束行。例如：\n\n```go\nfmt.Println(\"Hi, My friend! \")\n\
    fmt.Println(\"Hi, Guy! \")\n```\n上述代码中有两行，其中一行代表一个语句的结束，每个语句都不需要分号来结束行。\n\n##\
    \ 关于 \"{\"\n`{` 不能放在单行上，因此以下代码会在运行时产生错误。例如：\n\n```go\nfunc main() {\n    // error\n\
    \    fmt.Println(\"Hello, World! \")\n}\n```\n\n以下代码是正确的：\n```go\nfunc main()\
    \ {\n    // { 放在这里，是正确的！\n    fmt.Println(\"Hello, World! \")\n}\n```\n\n## 关键字\n\
    Go 语言中有 25 个关键字。\n\n| break | default |\n| :--- | :--- |\n| case | defer |\n|\
    \ chan | else |\n| const | fallthrough |\n| continue | for |\n\n关键字不能作为变量、常量和函数等的名称。\n\
    \n## 数据类型\n在 Go 语言中，当我们定义变量或函数时，需要使用数据类型。数据类型的使用有利于 Go 编程。主要有 Go 语言中的四种数据类型，它们在\
    \ Go 代码中非常常用。\n\n### 1. 布尔类型\n布尔类型由两个定义常量组成：例如：(1) `true` (2) `false`\n\n### 2.\
    \ 数值类型\n数字类型包括整数 `int`、浮点数 `float32`、`float64` 和复数。例如：`100`、`200`、`88`、`168888`、`168`。\n\
    \n### 3. 字符串类型\n字符串类型是固定长度字符序列。字符串通过单个字节连接。Go 语言字符串使用 `utf-8` 编码识别 Unicode 文本。例如：`\"\
    jQuery in 8 Hours\"` 是字符串。\n\n### 4. 衍生类型\n衍生类型意味着 (1) 通道类型，(2) Map 类型，(3) 接口类型，(4)\
    \ 切片类型，(5) 函数类型，(6) 联合类型，(7) 结构体类型，(8) 数组类型，(9) 指针类型。例如：`var arr [10]int` // *\
    \ arr 是长度为 10 的数组 *\n\n## 变量\nGo 语言的变量名由字母、数字和下划线组成，其中第一个字符不能是数字。声明变量有三种方式。\n\n\
    (1) 声明变量的第一种语法是：\n```go\nvar variable_name type variable_name = value\n```\n例如：`var\
    \ a int = 100`\n\n(2) 声明变量的第二种语法是：\n```go\nvar variable_name = value\n```\n例如：`var\
    \ b = \"ruby\"`\n\n(3) 声明变量的第三种语法是：\n```go\nvariable_name := value\n```\n例如：`c\
    \ := 100`\n\n```go\npackage main\nfunc main(){\n    var a = \"C#\"\n    var b\
    \ string = \"is\"\n    var c bool = true\n    println(a, b, c)\n}\n```\n输出：`C#\
    \ is true`\n\n## 多变量声明\n有三种方式声明多个变量：\n\n(1) `var name1, name2, name3 type value1,\
    \ value2, value3`\n(2) `var name1, name2, name3 = value1, value2, value3`\n例如：`var\
    \ a, b, c int = 100, 200, 300`\n(3) `name1, name2, name3 := value1, value2, value3`\n\
    `:=` 运算符用于给变量赋值。注意：变量应该预先声明，否则会导致编译错误。\n\n```go\npackage main\nfunc main(){\n\
    \    var a, b, c int = 100, 200, 300\n    var d, e, f = 400, 500, 600\n    println(a,\
    \ b, c)\n    println(d, e, f)\n}\n```\n输出：`100 200 300 400 500 600`\n\n## 总结\n\
    在 Go 语言中，每个语句不需要分号来结束。`{` 不能放在单行上，所以以下代码产生错误。关键字不能作为变量、常量和函数的名称。变量名由字母、数字和下划线组成，第一个字符不能是数字。有三种方式声明多个变量：\n\
    1. `var name1, name2, name3 type value1, value2, value3`\n2. `var name1, name2,\
    \ name3 = value1, value2, value3`\n3. `name1, name2, name3 := value1, value2,\
    \ value3` `:=` 运算符用于给变量赋值。\n\n# 第 3 小时\n\n## 常量\n常量是在程序运行时不会改变的标识符。定义常量的语法是：\n\
    `const name [type] = value`\n或\n`const name = value`\n\n### 3.1\n```go\npackage\
    \ main\nfunc main() {\n    const x, y, z int = 10, 20, 30 // 定义三个常量\n    const\
    \ s = \"jQuery in 8 Hours!\"\n    const b bool = true\n    println(x, y, z)\n\
