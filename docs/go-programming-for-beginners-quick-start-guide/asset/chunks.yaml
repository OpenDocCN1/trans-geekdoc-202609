    \n# 初学者 Go 语言编程快速入门指南\nRay Yao\n\n## 前言\n\n“Go 语言编程”涵盖了 Go 语言的所有核心知识。你可以快速、轻松地学习\
    \ Go 编程的完整基础技能。\n\n本书包含了 60 多个针对初学者的实用示例，并包含了大学考试、工程师认证考试以及工作面试的测试题与答案。\n\n**注意：**\
    \ 本书仅适用于 Go 初学者，不适合有经验的 Go 程序员。\n\n### 源代码下载\n本书提供了源代码下载；你可以下载源代码以更好地学习，或者将源代码复制到你喜喜欢的编辑器中测试程序。\n\
    源代码下载链接：[`forms.aweber.com/form/34/1805492434.htm`](https://forms.aweber.com/form/34/1805492434.htm)\n\
    \n## 目录\n\n- 第 1 小\n- 什么是 Go?\n- 安装 Go\n- 环境变量\n- Go 的第一个程序\n- 注释\n- 标识符\n- 总结\n\
    - 第 2 小\n- 换行符\n- 关于“{”\n- 关键字\n- 数据类型\n- 变量\n- 多变量声明\n- := 赋值运算符\n- 总结\n- 第 3\
    \ 小\n- 常量\n- iota\n- 算术运算符\n- 关系运算符\n- 逻辑运算符\n- 赋值运算符\n- 运算符优先级\n- 总结\n- 第 4 小\n\
    - if 语句\n- if...else 语句\n- switch 语句\n- select 语句\n- for 循环\n- 总结\n- 第 5 小\n-\
    \ break\n- continue\n- goto\n- 函数\n- 作用域\n- 总结\n- 第 6 小\n- 数组\n- 指针\n- nil\n-\
    \ 总结\n- 第 7 小\n- 结构体\n- 切片\n- append()\n- 总结\n- 第 8 小\n- goroutine\n- range\n\
    - map\n- 类型转换\n- 递归\n- 总结\n- 附录 1\n- 并发\n- 附录 2\n- 测试\n- 答案\n- 源代码下载\n\n## 什么是\
    \ Go?\nGo 是一种由 Google 在 2009 年推出的开源、高效的编程语言。它具有强大的并发支持，并且易于学习。它具有许多现代特性。\n\n##\
    \ 安装 Go\n你可以从以下链接下载安装包：[`golang.org/dl/`](https://golang.org/dl/)\n1. 根据你的操作系统下载对应的安装程序（image_rsrc20）。\n\
    2. 运行安装程序并按照提示完成安装（image_rsrc21）。\n3. 默认情况下，Go 将安装在 `C:\\Go` 目录。\n4. 安装完成后，点击“完成”（image_rsrc22）。\n\
    5. 下载链接：[`forms.aweber.com/form/34/1805492434.htm`](https://forms.aweber.com/form/34/1805492434.htm)\n\
    \n## 环境变量\n安装 Go 后，你需要将 `C:\\Go\\bin` 添加到环境变量的 `PATH` 中。请前往“控制面板” > “系统” > “高级系统”\
    \ > “环境变量” > “Path” > “编辑” > “新建”。将 `C:\\Go\\bin` 添加到末尾。（image_rsrc23）\n注意：不同\
    \ Windows 版本的界面可能不同。请重启电脑使设置生效。\n\n## Go 的第一个程序\n请在 `C:\\` 下创建一个名为 `myGo` 的工作文件夹，打开记事本并将以下代码写入编辑器。\n\
    \n示例 1.1\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"\
    Hello, World!\")\n}\n```\n将文件保存为 `hello.go` 位于 `C:\\myGo` 中。打开命令行（cmd），输入以下命令：（image_rsrc24）\n\
    输出：`Hello World!`\n\n解释：`package main` 定义包名为 `main`。每个 Go 应用程序必须包含名为 `main` 的包。导入的\
    \ `fmt` 包包含了 I/O 函数。`func main()` 是程序中执行的第一个函数。`fmt.Println(\"Hello, World!\"\
    )` 输出文本 `Hello, World!`。`C:\\Windows\\system32>cd\\` 返回 C: 根目录。`C:\\cd myGo` 进入\
    \ `myGo` 文件夹。`go run` 是执行 Go 程序的命令。\n\n## 注释\n```go\n//\n/* ... */\n```\n`//`\
    \ 是单行注释的符号。`/*` 和 `*/` 是多行注释的符号。注释不会被编译。Go 编译器会忽略所有注释。\n\n示例 1.2\n```go\npackage\
    \ main // 包声明\n\nimport \"fmt\"\n\nfunc main() {\n    // 定义 main 函数\n    fmt.Println(\"\
    Hello, World!\")\n}\n/* 上述代码的输出是：Hello, World! */\n```\n请使用 `go run` 命令运行此程序并检查结果。\n\
    \n"
- fmt: "\n# Identifiers\nIdentifiers are used to name variables, functions, expressions,\
    \ and so on. An identifier consists of one or more letters (A~Z and a~z), numbers\
    \ (0~9) and an underscore, but the first character must be a letter or underscore.\
    \ The first character of identifier cannot be a number.\n\nThe following identifiers\
    \ are valid: `myVariable`, `_Variable`, `variable100`.\nThe following identifiers\
    \ are invalid:\n- `continue` // “continue” is a keyword of Go language\n- `100Variable`\
    \ // begin with a number\n\n## Summary\n`\"package main\"` defines the name of\
    \ the package as `main`. Each Go application must include a package called `main`.\
    \ The imported package `\"fmt\"` contains I/O functions. `func main()` is the\
    \ first function to execute in the Go application. `fmt.Println(\"Hello, World!\
    \ \")` outputs the text `\"Hello, World! \"`. `//` is the symbol of single-line\
    \ comment. `/*` and `*/` are the symbols of multi-line comment. Comments will\
    \ not be compiled. The Go compiler will ignore all comments.\n\n# Hour 2\n\n##\
    \ Line Separator\nIn a Go language, each statement does not need a semicolon to\
    \ end the line. For example:\n\n```go\nfmt.Println(\"Hi, My friend! \")\nfmt.Println(\"\
    Hi, Guy! \")\n```\nThere are two lines in the above code, one line represents\
    \ the end of a statement, each statement don’t need a semicolon to end the line.\n\
    \n## About \"{\"\n`{` cannot be placed on a single line, so the following code\
    \ produces an error at run time. For example:\n\n```go\nfunc main() {\n    //\
    \ error\n    fmt.Println(\"Hello, World! \")\n}\n```\n\nThe following code is\
    \ correct:\n```go\nfunc main() {\n    // { is placed in here, correct!\n    fmt.Println(\"\
    Hello, World! \")\n}\n```\n\n## Keywords\nThere are 25 keywords in Go language.\n\
    \n| break | default |\n| :--- | :--- |\n| case | defer |\n| chan | else |\n| const\
    \ | fallthrough |\n| continue | for |\n\nKeywords cannot work as a name of variable,\
    \ constant and and function, etc.\n\n## Data Type\nIn Go language, when we define\
    \ a variable or function, we need to use a data type. The use of data types is\
    \ conducive to Go programming. Chiefly, there are four kinds of data type in Go\
    \ language, they are very commonly used in Go coding.\n\n### 1. Boolean types\n\
    Boolean type consists of two predefined constants: For example: (1) `true` (2)\
    \ `false`\n\n### 2. Numeric types\nThe number types are integer `int`, floating-point\
    \ `float32`, `float64`, and complex number. For example: `100`, `200`, `88`, `168888`,\
    \ `168`.\n\n### 3. String types\nString types are a sequence joined together by\
    \ a fixed length of characters. A string is concatenated by a single byte. The\
    \ bytes of the Go language string identify Unicode text using `utf-8` encoding.\
    \ For example: `\"jQuery in 8 Hours\"` is a string.\n\n### 4. Derived types\n\
    Derived types mean (1) Channel types, (2) Map types, (3) Interface types, (4)\
    \ Slice types, (5) Function types, (6) Union types, (7) Structure types, (8) Array\
    \ types, (9) Pointer types. For example: `var arr [10]int` // * arr is an array\
    \ of length 10 *\n\n## Variables\nVariable names of Go language consist of letters,\
    \ numbers and underscores, where the first character cannot be a number. There\
    \ are three ways to declare a variable.\n\n(1) The first syntax to declare a variable\
    \ is:\n```go\nvar variable_name type variable_name = value\n```\nFor example:\
    \ `var a int = 100`\n\n(2) The second syntax to declare a variable is:\n```go\n\
    var variable_name = value\n```\nFor example: `var b = \"ruby in 8 hours\"`\n\n\
    (3) The third syntax to declare a variable is:\n```go\nvariable_name := value\n\
    ```\nFor example: `c := 100`\n\n```go\npackage main\nfunc main(){\n    var a =\
    \ \"C# in 8 Hours\"\n    var b string = \"is\"\n    var c bool = true\n    println(a,\
    \ b, c)\n}\n```\nOutput: `C# in 8 Hours is true`\n\n## Multiply Variables Declaration\n\
    There are three ways to declare the multi-variables:\n\n(1) `var name1, name2,\
    \ name3 type value1, value2, value3`\nFor example: `var a, b, c int = 100, 200,\
    \ 300`\n\n(2) `var name1, name2, name3 = value1, value2, value3`\nFor example:\
    \ `var a, b, c = 100, 200, 300`\n\n(3) `name1, name2, name3 := value1, value2,\
    \ value3`\n`:=` assignment operator is used to assign a value to a variable. Note:\
    \ the variable should not be declared previously, which would result in compilation\
    \ error. Namely, when `=` is used, the variable should be declared at time.\n\n\
    ```go\npackage main\nfunc main(){\n    var a, b, c int = 100, 200, 300\n    var\
    \ d, e, f = 400, 500, 600\n    s1, s2, s3 := \"R in 8 Hours\", \"is\", \"good\
    \ book.\"\n    println(a, b, c)\n    println(d, e, f)\n}\n```\nOutput: `100 200\
    \ 300 400 500 600`\n\n## Summary\nIn a Go language, each statement does not need\
    \ a semicolon to end the line. `{` cannot be placed on a single line, so the following\
    \ code produces an error. Keywords cannot work as a name of variable, constant\
    \ and function. Variable names of Go language consist of letters, numbers and\
    \ underscores, where the first character cannot be a number. There are three ways\
    \ to declare the multi-variables:\n1. `var name1, name2, name3 type value1, value2,\
    \ value3`\n2. `var name1, name2, name3 = value1, value2, value3`\n3. `name1, name2,\
    \ name3 := value1, value2, value3` `:=` assignment operator is used to assign\
    \ a value to a variable.\n\n# Hour 3\n\n## Constants\nA constant is an identifier\
    \ whose value is not changed while the program is running. The syntax to define\
    \ a constant is:\n`const name [type] = value`\nOr\n`const name = value`\n\n###\
    \ 3.1\n```go\npackage main\nfunc main() {\n    const x, y, z int = 10, 20, 30\
    \ // define three constants\n    const s = \"jQuery in 8 Hours!\"\n    const b\
    \ bool = true\n    println(x, y, z)\n    println(s)\n    println(b)\n}\n```\n\
    Output: `10 20 30 jQuery in 8 Hours! true`\nExplanation: `const` is used to define\
    \ a constant.\n\n### 3.2\n```go\npackage main\n// Define constants as enumerations\n\
    func main() {\n    const (\n        // enumeration\n        color1 = \"Blue\"\n\
    \        color2 = \"Pink\"\n        color3 = \"Gray\"\n    )\n    println(color1,\
    \ color2, color3)\n}\n```\nOutput: `Blue Pink Gray`\nExplanation: The constants\
    \ `color1`, `color2`, `color3` is defined in an enum mode.\n\n`iota` is a special\
    \ constants. The value of the first `iota` is equal to 0, and its value is automatically\
    \ incremented by 1 whenever `iota` is used in a new row.\n\n### 3.3\n```go\npackage\
    \ main\nfunc main() {\n    const (\n        x = iota // the first iota value is\
    \ 0\n        y = iota\n        z = iota\n    )\n    println(x)\n    println(y)\n\
    \    println(z)\n}\n```\nOutput: `0 1 2`\nExplanation: The first `iota` value\
    \ is 0, the second `iota` value is 1, the third `iota` value is 2.\n\n## Arithmetic\
    \ Operators\n| Operator |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%`\
    \ |\n| `++` |\n| `--` |\n\nFor example: Given: `a = 100`, `b = 2`.\nCalculation:\n\
    - `a + b` returns `102`\n- `a - b` returns `98`\n- `a * b` returns `200`\n- `a\
    \ / b` returns `50`\n- `a % b` returns `0`\n- `a ++` returns `101`\n- `a --` returns\
    \ `99`\n\n## Relational Operators\n| Operators |\n| :--- |\n| `>` |\n| `<` |\n\
    | `>=` |\n| `<=` |\n| `==` |\n| `!=` |\n\nFor example: Given: `a = 100`, `b =\
    \ 2`.\nCalculation:\n- `a > b` returns `true`\n- `b < b` returns `false`\n- `a\
    \ >= b` returns `true`\n- `a <= b` returns `false`\n- `a == b` returns `false`\n\
    - `a != b` returns `true`\n\n## Logical Operators\n| Operators |\n| :--- |\n|\
    \ `&&` |\n| `||` |\n| `!` |\n\nFor example: Given: `a = true`, `b = false`.\n\
    Calculation:\n- `a && b` returns `false`\n- `a || b` returns `true`\n- `! a` returns\
    \ `false`\n"
