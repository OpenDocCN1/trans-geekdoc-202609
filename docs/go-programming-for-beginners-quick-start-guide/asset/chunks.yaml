    \    case c1: fmt.Println(\"Receive data from c1\")\n    case c2: fmt.Println(\"\
    Receive data from c2\")\n    case c3: fmt.Println(\"Receive data from c3\")\n\
    \    default: fmt.Println(\"Not receive data yet\") \n    }\n}\n```\nA. `switch`\
    \ | B. `select` | C. `while` | D. `if`\n\n**(12)** \n```go\npackage main \nimport\
    \ \"fmt\" \nfill in (a, b string) (string, string) { // 定义函数\n    return b, a\
    \ // 返回两个值给调用者 . \n} \nfunc main() { \n    x, y := swap(\"in 8 Hours\", \"JavaScript\"\
    ) // 调用函数\n    fmt.Println(x, y) \n}\n```\nA. `function` | B. `def` | C. `void`\
    \ | D. `func`\n\n**(13)** \n```go\npackage main \nimport \"fmt\" \nfunc main()\
    \ { \n    var num int=100 \n    var pt *int // 声明指针\n    pt = fill in // 获取地址并赋值给\
    \ pt\n    fmt.Printf(\"The address of num: %x\\n\", &num) \n    fmt.Printf(\"\
    The address in pt: %x\\n\", pt) \n    fmt.Printf(\"The value of pt: %d\\n\", *pt)\
    \ \n}\n```\nA. `*num` | B. `$num` | C. `&num` | D. `#num`\n\n**(14)** \n```go\n\
    package main \nimport \"fmt\" \nfunc main(){ \n    s := fill in int{1,2,3,4,5}\
    \ // 创建 slice \n    fmt.Println(s) \n}\n```\nA. `[]` | B. `[0]` | C. `[1]`\n\n\
    **(15)** \n```go\npackage main \nimport \"fmt\" \nfunc main(){ \n    c := make(chan\
