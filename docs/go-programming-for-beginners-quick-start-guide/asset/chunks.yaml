    )\n    }\n}\n```\n输出: Running case 20\n解释：`number` 的值为 20；它匹配了 `case 20`。\n\n\
    ### Select 语句\nSelect 语句有点像 Switch 语句。Switch 语句顺序执行 case 代码，Select 语句随机执行 case\
    \ 代码。\n\n1) `make(chan int, number)`\n“make(chan int, number)`”创建一个具有 `number`\
    \ 个缓冲区的通道。例如：`make(chan int, 10)` 创建具有 10 个缓冲区的通道。\n\n2) `chan <- data`\n“chan\
    \ <- data”向通道发送数据。`data <- chan` 从通道接收数据。\n\n3) `select { case 接收或发送数据 : 语句; default\
    \ : 语句 }`\n如果多个 case 都可以运行，Select 将随机选择一个执行。如果没有 case 能够运行，Select 将执行 `default`\
    \ 子句。\n\n示例 4.4\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n    c1:=make(chan\
    \ int,24) // 创建通道\n    c2:=make(chan int,24)\n    c3:=make(chan int,24)\n    c1\
    \ <- 100 // 向通道发送数据\n    c2 <- 200\n    c3 <- 300\n    select {\n        case\
    \ <-c1: fmt.Println(\"Receive data from c1\")\n        case <-c2: fmt.Println(\"\
    Receive data from c2\")\n        case <-c3: fmt.Println(\"Receive data from c3\"\
    )\n        default: fmt.Println(\"Not receive yet\")\n    }\n}\n```\n输出: Receive\
    \ data from c2\n解释：select 语句随机执行了一个 case。\n\n### For 循环\nFor 循环是一种可以执行指定次数循环的控制结构。\n\
    \n1) `for init; condition; in/decrease { }`\n`init`：给变量赋初始值。\n`condition`：测试表达式。\n\
    `in/decrease`：递增或递减。\n\n示例 4.5\n```go\npackage main\nfunc main() {\n    for a\
    \ := 0; a <= 5; a++ {\n        print(a)\n    }\n}\n```\n输出: 0 1 2 3 4 5\n解释：`a\
    \ :=0` 给 `a` 赋值 0。`a<=5` 是测试表达式。`a++` 是递增。\n\n2) `for test_expression { }`\n`test_expression`\
    \ 检查条件为真为假。\n\n示例 4.6\n```go\npackage main\nfunc main() {\n    var a int =0\n\
    \    var b int = 5\n    for a < b {\n        a++\n        print(a)\n    }\n}\n\
    ```\n输出: 1 2 3 4 5\n解释：`for a < b` 检查 `a` 是否小于 `b`。\n\n## 总结\n“if 语句”仅在指定条件为真时执行\
    \ `{ … }` 内部的代码；如果条件为假，不执行 `{…}` 内部的任何代码。在“switch 语句”中，变量的值首先与每个 `case` 进行比较，如果等于其中一个\
    \ `case` 的值，将执行该 `case` 代码。Select 语句有点像 Switch 语句。Switch 语句顺序执行 case 代码。Select\
    \ 语句随机执行 case 代码。For 循环是一种可以执行指定次数循环的控制结构。\n\n## 第 5 小\n\n### Break\n| `break`\
    \ |\n| --- |\nbreak 语句用于终止循环。break 语句也用于终止 switch 语句中的 case。\n\n示例 5.1\n```go\n\
    package main\nfunc main() {\n    var num int = 20\n    for num < 30 {\n      \
    \  print(num,\" \");\n        num++;\n        if num > 25 {\n            break;\
    \ // 终止 for 循环\n        }\n    }\n}\n```\n输出: 20 21 22 23 24 25\n解释：如果 `num >\
    \ 25` 测试表达式为真，`break` 语句将终止循环。\n\n### Continue\n| `continue` |\n| --- |\ncontinue\
    \ 语句跳过当前循环执行下一次。\n\n示例 5.2\n```go\npackage main\nfunc main() {\n    var num int\
    \ = 20\n    for num < 30 {\n        if num == 25 {\n            num = num + 1;\n\
    \            continue; // 跳过当前循环\n        }\n        print(num, \" \")\n     \
    \   num++;\n    }\n}\n```\n输出: 20 21 22 23 24 26 27 28 29\n解释：如果 `num == 25` 测试表达式为真，`continue`\
    \ 语句将跳过当前循环并执行下一次。注意：结果中没有 25。\n\n### Goto\n| `goto label; ... label: statement;`\
    \ |\n| --- |\ngoto 语句可以跳转到指定的代码并无条件执行。\n\n示例 5.3\n```go\npackage main\nfunc main()\
    \ {\n    var num int = 10\n    if num > 10{ goto code01 }\n    if num == 10{ goto\
    \ code02 }\n    code01: print(\"num > 10\")\n    code02: print(\"num == 10\")\n\
    }\n```\n输出: num == 10\n解释：`goto code01` 意味着执行带有标签 `code01` 的语句。`goto code02` 意味着执行带有标签\
    \ `code02` 的语句。\n\n"
