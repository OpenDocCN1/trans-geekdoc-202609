  \n\n\n## 什么是 Go?\nGo 是一种由 Google 在 2009 年推出的开源、高效的编程语言。它具有强大的并发支持，并且易于学习。它具有许多现代特性。\n\
  \n## 安装 Go\n你可以从以下链接下载安装包：[`golang.org/dl/`](https://golang.org/dl/)\n1. 根据你的操作系统下载对应的安装程序（image_rsrc20）。\n\
  2. 运行安装程序并按照提示完成安装（image_rsrc21）。\n3. 默认情况下，Go 将安装在 `C:\\Go` 目录。\n4. 安装完成后，点击“完成”（image_rsrc22）。\n\
  5. 下载链接：[`forms.aweber.com/form/34/1805492434.htm`](https://forms.aweber.com/form/34/1805492434.htm)\n\
  \n## 环境变量\n安装 Go 后，你需要将 `C:\\Go\\bin` 添加到环境变量的 `PATH` 中。请前往“控制面板” > “系统” > “高级系统”\
  \ > “环境变量” > “Path” > “编辑” > “新建”。将 `C:\\Go\\bin` 添加到末尾。（image_rsrc23）\n注意：不同 Windows\
  \ 版本的界面可能不同。请重启电脑使设置生效。\n\n## Go 的第一个程序\n请在 `C:\\` 下创建一个名为 `myGo` 的工作文件夹，打开记事本并将以下代码写入编辑器。\n\
  \n示例 1.1\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"\
  Hello, World!\")\n}\n```\n将文件保存为 `hello.go` 位于 `C:\\myGo` 中。打开命令行（cmd），输入以下命令：（image_rsrc24）\n\
  输出：`Hello World!`\n\n解释：`package main` 定义包名为 `main`。每个 Go 应用程序必须包含名为 `main` 的包。导入的\
  \ `fmt` 包包含了 I/O 函数。`func main()` 是程序中执行的第一个函数。`fmt.Println(\"Hello, World!\")`\
  \ 输出文本 `Hello, World!`。`C:\\Windows\\system32>cd\\` 返回 C: 根目录。`C:\\cd myGo` 进入 `myGo`\
  \ 文件夹。`go run` 是执行 Go 程序的命令。\n\n## 注释\n```go\n//\n/* ... */\n```\n`//` 是单行注释的符号。`/*`\
  \ 和 `*/` 是多行注释的符号。注释不会被编译。Go 编译器会忽略所有注释。\n\n示例 1.2\n```go\npackage main // 包声明\n\
  \nimport \"fmt\"\n\nfunc main() {\n    // 定义 main 函数\n    fmt.Println(\"Hello, World!\"\
  )\n}\n/* 上述代码的输出是：Hello, World! */\n```\n请使用 `go run` 命令运行此程序并检查结果。\n\n\n\n\n\n\
  # 标识符\n标识符用于命名变量、函数、表达式等。标识符由一个或多个字母（A~Z 和 a~z）、数字（0~9）和下划线组成，但第一个字符必须是字母或下划线。标识符的第一个字符不能是数字。\n\
  \n以下标识符是有效的：`myVariable`、`_Variable`、`variable100`。\n以下标识符是无效的：\n- `continue` //\
  \ “continue”是 Go 语言的关键字\n- `100Variable` // 以数字开头\n\n# 总结\n`\"package main\"` 定义包名为\
  \ `main`。每个 Go 应用必须包含一个名为 `main` 的包。导入包 `\"fmt\"` 包含了 I/O 函数。`func main()` 是 Go\
  \ 应用中执行的第一个函数。`fmt.Println(\"Hello, World! \")` 输出文本 `\"Hello, World! \"`。`//` 是单行注释的符号。`/*`\
  \ 和 `*/` 是多行注释的符号。注释不会被编译。Go 编译器将忽略所有注释。\n\n# 第 2 小时\n\n## 分隔符\n在 Go 语言中，每个语句不需要分号来结束行。例如：\n\
  \n```go\nfmt.Println(\"Hi, My friend! \")\nfmt.Println(\"Hi, Guy! \")\n```\n上述代码中有两行，其中一行代表一个语句的结束，每个语句都不需要分号来结束行。\n\
  \n## 关于 \"{\"\n`{` 不能放在单行上，因此以下代码会在运行时产生错误。例如：\n\n```go\nfunc main() {\n    // error\n\
  \    fmt.Println(\"Hello, World! \")\n}\n```\n\n以下代码是正确的：\n```go\nfunc main() {\n\
  \    // { 放在这里，是正确的！\n    fmt.Println(\"Hello, World! \")\n}\n```\n\n## 关键字\nGo\
  \ 语言中有 25 个关键字。\n\n| break | default |\n| :--- | :--- |\n| case | defer |\n| chan\
  \ | else |\n| const | fallthrough |\n| continue | for |\n\n关键字不能作为变量、常量和函数等的名称。\n\
  \n## 数据类型\n在 Go 语言中，当我们定义变量或函数时，需要使用数据类型。数据类型的使用有利于 Go 编程。主要有 Go 语言中的四种数据类型，它们在\
  \ Go 代码中非常常用。\n\n### 1. 布尔类型\n布尔类型由两个定义常量组成：例如：(1) `true` (2) `false`\n\n### 2.\
  \ 数值类型\n数字类型包括整数 `int`、浮点数 `float32`、`float64` 和复数。例如：`100`、`200`、`88`、`168888`、`168`。\n\
  \n### 3. 字符串类型\n字符串类型是固定长度字符序列。字符串通过单个字节连接。Go 语言字符串使用 `utf-8` 编码识别 Unicode 文本。例如：`\"\
  jQuery in 8 Hours\"` 是字符串。\n\n### 4. 衍生类型\n衍生类型意味着 (1) 通道类型，(2) Map 类型，(3) 接口类型，(4)\
  \ 切片类型，(5) 函数类型，(6) 联合类型，(7) 结构体类型，(8) 数组类型，(9) 指针类型。例如：`var arr [10]int` // * arr\
  \ 是长度为 10 的数组 *\n\n## 变量\nGo 语言的变量名由字母、数字和下划线组成，其中第一个字符不能是数字。声明变量有三种方式。\n\n(1) 声明变量的第一种语法是：\n\
  ```go\nvar variable_name type variable_name = value\n```\n例如：`var a int = 100`\n\
  \n(2) 声明变量的第二种语法是：\n```go\nvar variable_name = value\n```\n例如：`var b = \"ruby\"\
  `\n\n(3) 声明变量的第三种语法是：\n```go\nvariable_name := value\n```\n例如：`c := 100`\n\n```go\n\
  package main\nfunc main(){\n    var a = \"C#\"\n    var b string = \"is\"\n    var\
  \ c bool = true\n    println(a, b, c)\n}\n```\n输出：`C# is true`\n\n## 多变量声明\n有三种方式声明多个变量：\n\
  \n(1) `var name1, name2, name3 type value1, value2, value3`\n(2) `var name1, name2,\
  \ name3 = value1, value2, value3`\n例如：`var a, b, c int = 100, 200, 300`\n(3) `name1,\
  \ name2, name3 := value1, value2, value3`\n`:=` 运算符用于给变量赋值。注意：变量应该预先声明，否则会导致编译错误。\n\
  \n```go\npackage main\nfunc main(){\n    var a, b, c int = 100, 200, 300\n    var\
  \ d, e, f = 400, 500, 600\n    println(a, b, c)\n    println(d, e, f)\n}\n```\n\
  输出：`100 200 300 400 500 600`\n\n# 总结\n在 Go 语言中，每个语句不需要分号来结束。`{` 不能放在单行上，所以以下代码产生错误。关键字不能作为变量、常量和函数的名称。变量名由字母、数字和下划线组成，第一个字符不能是数字。有三种方式声明多个变量：\n\
  1. `var name1, name2, name3 type value1, value2, value3`\n2. `var name1, name2,\
  \ name3 = value1, value2, value3`\n3. `name1, name2, name3 := value1, value2, value3`\
  \ `:=` 运算符用于给变量赋值。\n\n# 第 3 小时\n\n## 常量\n常量是在程序运行时不会改变的标识符。定义常量的语法是：\n`const name\
  \ [type] = value`\n或\n`const name = value`\n\n### 3.1\n```go\npackage main\nfunc\
  \ main() {\n    const x, y, z int = 10, 20, 30 // 定义三个常量\n    const s = \"jQuery\
  \ in 8 Hours!\"\n    const b bool = true\n    println(x, y, z)\n    println(s)\n\
  \    println(b)\n}\n```\n输出：`10 20 30 jQuery in 8 Hours! true`\n解释：`const` 用于定义常量。\n\
  \n### 3.2\n```go\npackage main\n// 定义枚举作为常量\nfunc main() {\n    const (\n      \
  \  // enumeration\n        color1 = \"Blue\"\n        color2 = \"Pink\"\n      \
  \  color3 = \"Gray\"\n    )\n    println(color1, color2, color3)\n}\n```\n输出：`Blue\
  \ Pink Gray`\n解释：常量 `color1`、`color2`、`color3` 在枚举模式下定义。\n\n`iota` 是一个特殊的常量。第一个\
  \ `iota` 的值为 0，每当在新行中使用 `iota` 时，它的值会自动加 1。\n\n### 3.3\n```go\npackage main\nfunc\
  \ main() {\n    const (\n        x = iota //第一个 iota 值为 0\n        y = iota\n  \
  \      z = iota\n    )\n    println(x)\n    println(y)\n    println(z)\n}\n```\n\
  输出：`0 1 2`\n解释：第一个 `iota` 的值为 0，第二个 `iota` 的值为 1，第三个 `iota` 的值为 2。\n\n## 算术运算符\n\
  | 运算符 |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%` |\n| `++` |\n| `--`\
  \ |\n\n例如：给定 `a = 100`, `b = 2`。\n计算：\n- `a + b` 返回 `102`\n- `a - b` 返回 `98`\n-\
  \ `a * b` 返回 `200`\n- `a / b` 返回 `50`\n- `a % b` 返回 `0`\n- `a ++` 返回 `101`\n- `a\
  \ --` 返回 `99`\n\n## 关系运算符\n| 运算符 |\n| :--- |\n| `>` |\n| `<` |\n| `>=` |\n| `<=`\
  \ |\n| `==` |\n| `!=` |\n\n例如：给定 `a = 100`, `b = 2`。\n计算：\n- `a > b` 返回 `true`\n\
  - `b < b` 返回 `false`\n- `a >= b` 返回 `true`\n- `a <= b` 返回 `false`\n- `a == b` 返回\
  \ `false`\n- `a != b` 返回 `true`\n\n\n\n\n\n| `true && true; returns true;` || `true\
  \ && false; returns false;` || `false && false; returns false;` |\n| --- | --- |\
  \ --- |\n| `true || true; returns true;` || `true || false; returns true;` || `false\
  \ || false; return false;` |\n| `! false; returns true;` || `! true; returns false;`\
  \ ||   |\n\n## 赋值运算符\n\n| 运算符 | 示例: |\n| --- | --- |\n| `+=` | `x+=y` |\n| `-=`\
  \ | `x-=y` |\n| `*=` | `x*=y` |\n| `/=` | `x/=y` |\n| `%=` | `x%=y` |\n\n例如：给定：`x=200;`\
  \ `y=100;` 解释：`x+=y;` // `x=x+y;` 输出 300 `x/=y;` // `x=x / y;` 输出 2 `x-=y;` // `x=x\
  \ \\- y;` 输出 100 `x%=y;` // `x=x%y;` 输出 0\n\n## 运算符优先级\n下表列出了运算符的优先级：（从上到下表示优先级从高到低）。\n\
  \n| 优先级 |\n| --- |\n| 7 |\n| 6 |\n| 5 |\n| 4 |\n| 3 |\n| 2 |\n| 1 |\n\n# 总结\n常量是在程序运行期间值不会改变的标识符。定义常量的语法为：`const\
  \ constant_name [type] = value` 或 `const constant_name = value`。“iota”是一个特殊的常量。第一个\
  \ `iota` 的值等于 0，每当在新的行中使用 `iota` 时候，它的值就会自动加 1。后续有以下运算符：算术运算符、关系运算符、逻辑运算符、赋值运算符。\n\
  \n## 第 4 小\n\n### If 语句\n\n| `if test-expression { // 如果为真执行此操作; }` |\n| --- |\n\
  \n“if 语句”仅在指定条件为真时执行 `{ … }` 内部的代码；如果条件为假，则不执行 `{…}` 内部的代码。\n\n示例 4.1\n```go\npackage\
  \ main\nimport \"fmt\"\nfunc main() {\n    var num int = 100\n    if num > 50 {\n\
  \        fmt.Printf(\"num is greater than 50\")\n    }\n}\n```\n输出: num is greater\
  \ than 50\n解释：因为 `num` 的值大于 50，所以执行了 `{ }` 内部的代码。\n\n### if…else 语句\n\n| `if test_expression{\
  \ // 如果为真执行此操作 } else { // 如果为假执行此操作 }` |\n| --- |\n\n“if... else 语句”在条件为真时运行某些代码，在条件为假时运行另一段代码。\n\
  \n示例 4.2\n```go\npackage main\nfunc main() {\n    var num int = 100\n    if num\
  \ > 200 {\n        println(\"num is greater than 200\")\n    } else {\n        println(\"\
  num is less than 200\")\n    } \n}\n```\n输出: num is less than 200\n解释：因为 `num` 的值小于\
  \ 200，所以执行了 `else { }` 代码。\n\n### Switch 语句\n\n| `switch (variable ) { case 1: 如果等于此\
  \ case，执行此 case case 2: 如果等于此 case，执行此 case case 3: 如果等于此 case，执行此 case default\
  \ : 如果等于任何 case，运行 default }` |\n| --- |\n\n`variable`（变量）的值将首先与每个 `case` 进行比较，如果等于其中一个\
  \ `case` 的值，它将执行该 `case` 代码。\n\n示例 4.3\n```go\npackage main\nfunc main() {\n   \
  \ var number int=20\n    switch ( number ) {\n        case 10: println (\"Running\
  \ case 10\")\n        case 20: println (\"Running case 20\")\n        case 30: println\
  \ (\"Running case 30\")\n        default: println (\"Running default\")\n    }\n\
  }\n```\n输出: Running case 20\n解释：`number` 的值为 20；它匹配了 `case 20`。\n\n### Select 语句\n\
  Select 语句有点像 Switch 语句。Switch 语句顺序执行 case 代码，Select 语句随机执行 case 代码。\n\n1) `make(chan\
  \ int, number)`\n“make(chan int, number)`”创建一个具有 `number` 个缓冲区的通道。例如：`make(chan\
  \ int, 10)` 创建具有 10 个缓冲区的通道。\n\n2) `chan <- data`\n“chan <- data”向通道发送数据。`data <-\
  \ chan` 从通道接收数据。\n\n3) `select { case 接收或发送数据 : 语句; default : 语句 }`\n如果多个 case 都可以运行，Select\
  \ 将随机选择一个执行。如果没有 case 能够运行，Select 将执行 `default` 子句。\n\n示例 4.4\n```go\npackage main\n\
  import \"fmt\"\nfunc main() {\n    c1:=make(chan int,24) // 创建通道\n    c2:=make(chan\
  \ int,24)\n    c3:=make(chan int,24)\n    c1 <- 100 // 向通道发送数据\n    c2 <- 200\n\
  \    c3 <- 300\n    select {\n        case <-c1: fmt.Println(\"Receive data from\
  \ c1\")\n        case <-c2: fmt.Println(\"Receive data from c2\")\n        case\
  \ <-c3: fmt.Println(\"Receive data from c3\")\n        default: fmt.Println(\"Not\
  \ receive yet\")\n    }\n}\n```\n输出: Receive data from c2\n解释：select 语句随机执行了一个 case。\n\
  \n### For 循环\nFor 循环是一种可以执行指定次数循环的控制结构。\n\n1) `for init; condition; in/decrease\
  \ { }`\n`init`：给变量赋初始值。\n`condition`：测试表达式。\n`in/decrease`：递增或递减。\n\n示例 4.5\n```go\n\
  package main\nfunc main() {\n    for a := 0; a <= 5; a++ {\n        print(a)\n \
  \   }\n}\n```\n输出: 0 1 2 3 4 5\n解释：`a :=0` 给 `a` 赋值 0。`a<=5` 是测试表达式。`a++` 是递增。\n\
  \n2) `for test_expression { }`\n`test_expression` 检查条件为真为假。\n\n示例 4.6\n```go\npackage\
  \ main\nfunc main() {\n    var a int =0\n    var b int = 5\n    for a < b {\n  \
  \      a++\n        print(a)\n    }\n}\n```\n输出: 1 2 3 4 5\n解释：`for a < b` 检查 `a`\
  \ 是否小于 `b`。\n\n# 总结\n“if 语句”仅在指定条件为真时执行 `{ … }` 内部的代码；如果条件为假，不执行 `{…}` 内部的任何代码。在“switch\
  \ 语句”中，变量的值首先与每个 `case` 进行比较，如果等于其中一个 `case` 的值，将执行该 `case` 代码。Select 语句有点像 Switch\
  \ 语句。Switch 语句顺序执行 case 代码。Select 语句随机执行 case 代码。For 循环是一种可以执行指定次数循环的控制结构。\n\n##\
  \ 第 5 小\n\n### Break\n| `break` |\n| --- |\nbreak 语句用于终止循环。break 语句也用于终止 switch\
  \ 语句中的 case。\n\n示例 5.1\n```go\npackage main\nfunc main() {\n    var num int = 20\n\
  \    for num < 30 {\n        print(num,\" \");\n        num++;\n        if num >\
  \ 25 {\n            break; // 终止 for 循环\n        }\n    }\n}\n```\n输出: 20 21 22\
  \ 23 24 25\n解释：如果 `num > 25` 测试表达式为真，`break` 语句将终止循环。\n\n### Continue\n| `continue`\
  \ |\n| --- |\ncontinue 语句跳过当前循环执行下一次。\n\n示例 5.2\n```go\npackage main\nfunc main()\
  \ {\n    var num int = 20\n    for num < 30 {\n        if num == 25 {\n        \
  \    num = num + 1;\n            continue; // 跳过当前循环\n        }\n        print(num,\
  \ \" \")\n        num++;\n    }\n}\n```\n输出: 20 21 22 23 24 26 27 28 29\n解释：如果 `num\
  \ == 25` 测试表达式为真，`continue` 语句将跳过当前循环并执行下一次。注意：结果中没有 25。\n\n### Goto\n| `goto label;\
  \ ... label: statement;` |\n| --- |\ngoto 语句可以跳转到指定的代码并无条件执行。\n\n示例 5.3\n```go\n\
  package main\nfunc main() {\n    var num int = 10\n    if num > 10{ goto code01\
  \ }\n    if num == 10{ goto code02 }\n    code01: print(\"num > 10\")\n    code02:\
  \ print(\"num == 10\")\n}\n```\n输出: num == 10\n解释：`goto code01` 意味着执行带有标签 `code01`\
  \ 的语句。`goto code02` 意味着执行带有标签 `code02` 的语句。\n\n\n\n\n\n## Example 5.4\n```go\npackage\
  \ main\nfunc main() {\n  var a int = 10\n  var b int = 20\n  var result int\n  result\
  \ = add(a, b)\n  // call the function\n  print(\"The sum is \", result)\n}\nfunc\
  \ add(num1, num2 int) int {\n  // define a function\n  return num1 + num2\n  //\
  \ pass the result to the caller\n}\n```\n**Output:** The sum is 30\n**Explanation:**\
  \ `add(a, b)` 调用了函数 `add(a, b)`，并将参数 `a` 和 `b` 的值传递给 `num1` 和 `num2`。`func add(num1,\
  \ num2 int) int` 定义了一个函数 `add(…)`，`num1` 和 `num2` 接收来自 `a` 和 `b` 的值。`return num1\
  \ + num2` 将结果值传递给调用者 `add(…)`。\n\n## Example 5.5\n```go\npackage main\nimport \"\
  fmt\"\nfunc swap (a, b string) (string, string) {\n  // define a function\n  return\
  \ b, a\n  // returns two values to the caller\n}\nfunc main() {\n  x, y := swap(\"\
  in 8 Hours\", \"JavaScript\")\n  //call the function\n  fmt.Println(x, y)\n}\n```\n\
  **Output:** JavaScript in 8 Hours\n**Explanation:** `func swap(a, b string) (string,\
  \ string){…}` 定义了一个函数。`swap(\"in 8 Hours\", \"JavaScript\")` 调用函数 `swap(…)`，并将两个参数传递给函数\
  \ `swap(…){…}`。\n\n## Working Scope\n任何编码中的工作作用域都是变量可以被访问的范围，在该作用域之外，变量无法被访问。\n\n\
  - 在函数内部定义的变量被称为**局部变量**。\n- 在函数外部定义的变量被称为**全局变量**。\n\n## Example 5.6\n```go\npackage\
  \ main\nfunc main() {\n  var a, b, c int\n  // defines local variables\n  a = 100\n\
  \  b = 200\n  c = a + b\n  print(a, b, c)\n}\n```\n**Output:** 100 200 300\n**Explanation:**\
  \ `var a, b, c int` 在函数内部定义了三个局部变量。\n\n## Example 5.7\n```go\npackage main\nvar\
  \ v int = 100\n// define a global variable\nfunc main(){\n  print (\"The value of\
  \ the global variable is \", v)\n}\n```\n**Output:** The value of the global variable\
  \ is 100.\n**Explanation:** `var v int = 100` 定义了一个全局变量。\n\n## Summary\n- `break`\
  \ 语句用于终止循环。`break` 语句也用于终止 `switch` 语句中的 `case`。\n- `continue` 语句跳过当前循环并执行下一个循环。\n\
  - `goto` 语句可以到指定的代码处并无条件执行。\n1. 定义函数的语法如下：`func function_name ( parameter type)\
  \ type { …… return … }`\n2. 调用函数的语法如下：`variable = function_name ( parameter type\
  \ )`\n- 在函数内部定义的变量被称为**局部变量**。在函数外部定义的变量被称为**全局变量**。\n\n## Hour 6\n### Array\n数组是相同类型和名称的变量的集合。\n\
  - **Array element**（数组元素）：数组中的每个变量。\n- **Array index**（数组索引）：也称为键，每个元素上的数字。\n- **Note**：数组索引或数组键从零开始。\n\
  \n定义数组有几种方法方法：\n1. `var array_name[length] type` // 定义数组\n2. `array_name[key] =\
  \ value` // 给元素赋值\n\n#### Example 6.1\n```go\npackage main\nfunc main() {\n  var\
  \ arr [3]int\n  // define an array\n  arr[0] = 100\n  arr[1] = 101\n  arr[2] = 102\n\
  \  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n**Explanation:**\
  \ `var arr [3]int` 定义了一个带有三个元素的数组。`arr` 是数组名，`3` 是长度，类型是 `int`。`arr[0]=100` 给元素赋值，`0`\
  \ 是索引或键。\n\n#### Example 6.2\n```go\npackage main\nfunc main() {\n  var arr [3]int\n\
  \  // define an array\n  arr[0] = 100\n  arr[1] = 101\n  arr[2] = 102\n  print(arr[0],\
  \ arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n**Explanation:** `var arr [3]int`\
  \ 定义了一个带有三个元素的数组。\n\n#### Example 6.3\n```go\npackage main\nfunc main() {\n  var\
  \ arr [3]int\n  // define an array\n  arr[0] = 100\n  arr[1] = 101\n  arr[2] = 102\n\
  \  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n**Explanation:**\
  \ `var arr [3]int` 定义了一个带有三个元素的数组。\n\n#### Example 6.4\n```go\npackage main\nfunc\
  \ main() {\n  var arr [3]int\n  // define an array\n  arr[0] = 100\n  arr[1] = 101\n\
  \  arr[2] = 102\n  print(arr[0], arr[1], arr[2])\n}\n```\n**Output:** 100 101 102\n\
  **Explanation:** `var arr [3]int` 定义了一个带有三个元素的数组。\n\n### Pointers\n指针代表内存地址的值。\n\
  1. `&variable` // 获取变量的地址\n2. `var variable_name *type` // 声明指针；`*variable_name`\
  \ 获取地址中的的值\n\n例如：\n- `var ipoint *int` // 声明 int 指针\n- `var fpoint *float32` //\
  \ 声明 float32 指针\n- `*ipoint` // 获取地址中的 ipoint 值\n- `*fpoint` // 获取地址中的 fpoint 值\n\
  \n#### Example 6.6\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var num\
  \ int = 100\n  var pt *int\n  // declare a pointer\n  pt = &num\n  // &num get address\
  \ and assign to pt\n  fmt.Printf(\"The address of num: %x\\n\", &num)\n  fmt.Printf(\"\
  The address in pt: %x\\n\", pt)\n  fmt.Printf(\"The value of the *pt: %d\\n\", *pt)\n\
  }\n```\n**Output:**\nThe address of num: C00004058\nThe address in pt: C00004058\n\
  The value of the *pt: 100\n**Explanation:** `&num` 从 `num` 获取地址。`pt = &num` 将地址赋值给\
  \ `pt`。`*pt` 返回地址中的 `pt` 值。\n\n#### Example 6.7\n```go\npackage main\nimport \"\
  fmt\"\nfunc main() {\n  var a string = \"Hello\"\n  var b *string\n  var c string\n\
  \  b = &a\n  // &a gets the memory address\n  c = *b\n  // *b gets the value in\
  \ memory address\n  fmt.Println(a)\n  fmt.Println(b)\n  fmt.Println(c)\n}\n```\n\
  **Output:**\nHello\n0xc000381c8\nHello\n**Explanation:** `&a` 返回 `a` 的内存地址。`*b`\
  \ 返回内存地址的值。\n\n### Nil Pointer\n当指针被定义且未分配任何变量地址时，它的值为 `nil`。\n\n#### Example 6.8\n\
  ```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var npt *int\n  fmt.Printf(\"\
  The address stored in npt: %x\\n\", npt)\n}\n```\n**Output:** The address stored\
  \ in npt: 0\n**Explanation:** `npt` 是一个指针，尚未分配任何地址，所以值为 0。\n\n## Hour 7\n### Structures\n\
  结构体是相同或不同类型数据的集合。\n1. **定义结构体类型**：`type structure_name struct { member1 type; member2\
  \ type; ... member3 type; }`\n2. **访问结构体成员**：`structure_name{member1: value1, member2:\
  \ value2, … }`\n\n#### Example 7.1\n```go\npackage main\nimport \"fmt\"\ntype Flower\
  \ struct {\n  // define a structure type\n  color string\n  // structure member\n\
  \  size string\n  number int\n}\nfunc main() {\n  fmt.Println(Flower{color:\"Red\"\
  , size:\"Large\", number:10 })\n}\n```\n**Output:** {Red Large 10}\n**Explanation:**\
  \ `type Flower struct` 定义了一个结构体类型。\n\n\n\n\n\n## 示例 7.2\n\n```go\npackage main\n\
  type Flower struct {\n  // 定义一个结构类型\n  color string\n  // 结构成员\n  size string\n\
  \  number int\n}\nfunc main() {\n  var Rose Flower   // 声明一个结构变量 Rose\n  Rose.color\
  \ = \"Red\"    // 给结构成员赋值\n  Rose.size = \"Large\"\n  Rose.number = 10\n  println(\"\
  Rose color : \", Rose.color);\n  println(\"Rose size : \", Rose.size);\n  println(\"\
  Rose number : \", Rose.number);\n}\n```\n**输出：**\n```\nRose color: Red\nRose size:\
  \ Large\nRose number: 10\n```\n**解释：** `var Rose Flower` 声明了一个结构变量 `Rose`。`Rose.color\
  \ = \"Red\"` 给结构成员 `Rose.color` 赋值。\n\n## 切片 (Slice)\n\n`Slice` 是一种特殊的数组，但它的长度是可变的。(1)\
  \ 创建 `Slice` 的种语法如下：\n\n`slice_name := []type{val1, val2, … }`\n\n### 示例 7.3\n\n\
  ```go\npackage main\nimport \"fmt\"\nfunc main() {\n  s := []int{1,2,3,4,5}    //\
  \ 创建一个切片\n  fmt.Println(s)\n}\n```\n**输出：**\n```\n1 2 3 4 5\n```\n**解释：** `s :=\
  \ []int{1,2,3,4,5}` 创建了一个包含五个值的 `Slice`。(2) 创建 `Slice` 的第二种语法如下：\n\n`slice_name\
  \ := make([]type, len, cap)`\n\n`len` 表示切片的长度。`cap` 表示包含切片元素的容量。\n\n### 示例 7.4\n\
  \n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  s := make([]int, 5, 8)\n\
  \  fmt.Printf(\"len=%d cap=%d slice=%v\\n\",len(s),cap(s),s)\n}\n```\n**输出：**\n\
  ```\nlen=5   cap=8   slice=[00000]\n```\n**解释：** `len(s)` 获取切片的长度。`cap(s)` 获取包含所有元素的容量。由于\
  \ `Slice` 元素尚未分配任何值，因此这个 `Slice` 的五个值均为零。(3) 从 `Slice` 元素中获取某些值：\n\n`slice_name[key1,\
  \ key2]`\n\n获取从 `key1` 到 `key2-1` 的值。\n\n### 示例 7.5\n\n```go\npackage main\nimport\
  \ \"fmt\"\nfunc main() {\n  var s = []int{0, 1, 2, 3, 4, 5, 6, 7, 8}\n  mySlice:=\
  \ s[2:6]  // 获取从 s[2] 到 s[5] 的值\n  fmt.Println(mySlice)\n}\n```\n**输出：**\n```\n\
  2 3 4 5\n```\n**解释：** `s[2: 6]` 获取从 `s[2]` 到 `s[5]` 的值。(4) 给 `Slice` 元素赋值。\n\n`slice_name[key]\
  \ = value`\n\n### 示例 7.6\n\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n\
  \  var s = []int{0, 1, 2, 3, 4, 5, 6, 7, 8}\n  s[3] = 10      // 给 s[3] 赋新值\n  s[6]\
  \ = 100     // 给 s[6] 赋新值\n  fmt.Println(s)\n}\n```\n**输出：**\n```\n[0 1 2 10 4 5\
  \ 100 7 8]\n```\n**解释：** `s[3] = 10` // 给 `s[3]` 赋新值；`s[6] = 100` // 给 `s[6]` 赋新值。\n\
  \n## append() & copy()\n\n`append(slice_name, values)` // 向 `Slice` 中追加值\n`copy(new_slice,\
  \ old_slice)` // 将旧 `Slice` 拷贝到新的 `Slice`\n\n### 示例 7.7\n\n```go\npackage main\n\
  import \"fmt\"\nfunc main() {\n  mySlice := make([]int, 0, 0)\n  showSlice(mySlice)\n\
  \  mySlice = append(mySlice, 10,20,30)  // 追加\n  newSlice := make([]int, len(mySlice),\
  \ cap(mySlice)*2)\n  copy(newSlice,mySlice)  // 拷贝\n  showSlice(newSlice)\n}\nfunc\
  \ showSlice(x []int){\n  fmt.Printf(\"len=%d cap=%d slice=%v\\n\",len(x),cap(x),x)\n\
  }\n```\n**输出：**\n```\nlen=0 cap=0 slice=[]\nlen=3 cap=4 slice=[10 20 30]\n```\n\
  **解释：** `append(mySlice, 10,20,30)` 为 `mySlice` 添加了三个值。`newSlice := make([]int,\
  \ len(mySlice), cap(mySlice)*2)` 创建了一个新切片，容量是原来的倍。`copy(newSlice,mySlice)` 执行了拷贝。\n\
  \n# 总结\n\n`Slice` 是一个特殊的数组，但它的长度是可变的。\n(1) 定义结构体类型：\n```go\ntype structure_name\
  \ struct {\n  member1 type\n  member2 type\n  member3 type\n}\n```\n(2) 访问结构体成员：`structure_name.member1`\n\
  (3) 声明结构体变量：`var structure_name`\n(4) 给结构体成员赋值：`member = value`\n\n# 第 8 章 GORoutine\n\
  \n`goroutine` 用于运行多个任务，意味着通过 `go` 关键字同时执行多个线程。以下示例是定义 `goroutine` 函数并运行它：\n\n```go\n\
  go func(arguments) { // 定义 goroutine\n}(arguments) // 运行 goroutine\n```\n\n### 示例\
  \ 8.1\n\n```go\npackage main\nimport \"fmt\"\nfunc fn(s string) {\n  for i := 0;\
  \ i < 5; i++ {\n    fmt.Println(s)\n  }\n}\nfunc main() {\n  fn(\"Thread A\")\n\
  \  go func() { // 定义 goroutine\n    fmt.Println(\"Thread B\")\n  }() // 运行 goroutine\n\
  \  fmt.Scan() // 从键盘输入\n  fmt.Println(\"Complete!\")\n}\n```\n**输出：**\n```\nThread\
  \ A\nThread B\nComplete!\n```\n**解释：** `go func(string) { ... }` 定义了 `goroutine`\
  \ 函数。`(\"Thread B\")` 运行了该 `goroutine`。\n\n## Range\n\n`Range` 是 Go 语言的内置函数，用于遍历数组、切片和映射。\n\
  * 遍历数组、切片返回索引和值。\n* 遍历映射返回键和值。\n* 遍历通道返回值。\n\n(1) 遍历数组/切片\n\n```go\nfor index, value\
  \ := range array/slice {}\n```\n\n### 示例 8.2\n\n```go\npackage main\nimport \"fmt\"\
  \nfunc main() {\n  for key, value := range []int{10,11,12,13} {\n    fmt.Printf(\"\
  key:%d value:%d\\n\", key, value)\n  }\n}\n```\n**输出：**\n```\nkey:0 value:10\nkey:1\
  \ value:11\nkey:2 value:12\nkey:3 value:13\n```\n**解释：** `range []int{10,11,12,13}`\
  \ 遍历了切片并返回索引和值。\n\n(2) 遍历字符串\n\n```go\nfor key, value := range str {}\n```\n\n###\
  \ 示例 8.3\n\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var str = \"hello\"\
  \n  for key, value := range str {\n    fmt.Printf(\"key:%d value:%0x\\n\", key,\
  \ value)\n  }\n}\n```\n**输出：**\n```\nkey:0 value:0x68\nkey:1 value:0x65\nkey:2 value:0x6c\n\
  key:3 value:0x6c\nkey:4 value:0x6f\n```\n**解释：** `range str` 遍历字符串，返回其键（索引）和值（字符）。\n\
  \n(3) 遍历通道\n\n```go\nfor value := range channel {}\n```\n\n### 示例 8.4\n\n```go\n\
  package main\nimport \"fmt\"\nfunc main() {\n  c := make(chan int)\n  go func()\
  \ { // 定义 goroutine\n    c <- 1 // 向通道发送数据\n    c <- 2\n    c <- 3\n    close(c)\
  \ // 关闭通道\n  }() // 调用 goroutine 函数\n  for v := range c { // 遍历通道\n    fmt.Println(\"\
  Send data to channel: \",v)\n  }\n}\n```\n**输出：**\n```\nSend data to channel: 1\n\
  Send data to channel: 2\nSend data to channel: 3\n```\n**解释：** `range c` 遍历通道。`go\
  \ func(){}` 定义了 `goroutine` 函数。`()` 调用了函数。\n\n## Map\n\n`Map` 是键值对的无序集合。`Map` 用于通过键快速检索数据，类似于索引并指向数据的值。定义\
  \ `map` 的两种语法如下：\n\n(1) `m1 := map[key_type]value_type{}`\n`m1` 是一个 map 变量。\n(2)\
  \ `m2 := make(map[key_type] value_type)`\n`m2` 是一个 map 变量。\n\n### 示例 8.5\n\n```go\n\
  package main\nimport \"fmt\"\nfunc main() {\n  m1 := map[int]int{}\n  m2 := make(map[int]int)\n\
  \  m1[1] = 10\n  m2[2] = 20\n  for key, value := range m1 {\n    fmt.Println(\"\
  Key: \", key, \"Value: \", value)\n  }\n  for key, value := range m2 {\n    fmt.Println(\"\
  Key: \", key, \"Value: \", value)\n  }\n}\n```\n**输出：**\n```\nKey: 1 Value: 10\n\
  Key: 2 Value: 20\n```\n**解释：** `m1 := map[int]int{}` 定义了 map `m1`。`m2 := make(map[int]int)`\
  \ 定义了 map `m2`。\n\n## 类型转换\n\n类型转换意味着变量的一种数据类型转换为另一种数据类型。\n\n`data_type (variables)`\n\
  \n### 示例 8.6\n\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n  var num1 int\
  \ = 100\n  var num2 int = 3\n  var result float32\n  result = float32(num1)/float32(num2)\
  \ // 转换\n  fmt.Printf(\"The result is %f\\n\", result)\n}\n```\n**输出：**\n```\nThe\
  \ result is 33.333332\n```\n**解释：** `float32(num1)/float32(num2)` 将数据类型从 `int` 转换为\
  \ `float32`。\n\n\n\n\n\n# 递归\n\n递归意味着函数调用自己。\n\n```go\nfunc recursion() { \n   \
  \ recursion() // 调用自己 \n} \nfunc main() { \n    recursion() \n}\n```\n\n### 示例 8.7\n\
  ```go\npackage main\nimport \"fmt\"\nfunc myRecur(n int) int { \n    if n == 0 {\
  \ return 1 }\n    return n * myRecur(n-1) // 调用自己 \n}\nfunc main() { \n    fmt.Print(\"\
  Factorial of 10 is \") \n    fmt.Print(myRecur(10)) \n}\n```\n**输出:** Factorial\
  \ of 10 is 3628800  \n**解释：** `myRecur(n-1)` 调用了自身。递归会一直进行，直到出现 `myRecur(0)`。\n\n\
  # 总结\n\n- `goroutine` 用于同时运行多个任务，这意味着 `goroutine` 函数可以通过使用 `go` 关键字同时执行多个线程。\n-\
  \ `Range` 是 Go 语言的内置函数，用于遍历数组、`slices`、`strings` 和 `maps`。\n- `Map` 是键值对的无序集合。`Map`\
  \ 用于通过键快速检索数据，类似于索引并指向数据的值。\n- 类型转换意味着将变量的一种数据类型转换为另一种数据类型。\n- `data_type`（变量）\n\
  - 递归意味着函数调用自己。\n\n```go\nfunc recursion() { \n    recursion() // 调用自己 \n} \nfunc\
  \ main() { \n    recursion() \n}\n```\n\n# 附录 1\n\n## 并发\n\nGo 语言支持并发，我们可以使用 `go`\
  \ 关键字来调用函数，启动一个新的运行时线程 `goroutine`。使用 `go` 关键字调用函数的语法如下：\n\n`go function_name (arguments)`\n\
  \n### 示例：\n```go\npackage main\nimport (\n    \"fmt\"\n    \"time\"\n)\nfunc fn(s\
  \ string) { \n    // 定义一个函数 fn\n    for i := 0; i < 5; i++ { \n        time.Sleep(200\
  \ * time.Millisecond) // 延迟运行\n        fmt.Println(s) \n    } \n}\nfunc main() {\
  \ \n    go fn(\"Thread A\") // 调用函数 fn \n    fn(\"Thread B\") // 调用函数 fn \n    go\
  \ func(msg string) { \n        // 定义一个 goroutine 函数\n        fmt.Println(msg) \n\
  \    }(\"Press Enter to Stop!\") // 运行 goroutine 函数\n    fmt.Scanln() // 从键盘接受用户输入\
  \ \n    fmt.Println(\"Complete! \") \n}\n```\n**输出:** Thread B Thread A Thread B\
  \ Thread A Thread B Thread A Thread B Thread A Press Enter to Stop! Thread A Complete!\
