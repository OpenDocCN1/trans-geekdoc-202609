    Dr. Liew is a sought-after Blockchain Architect by companies in the blockchain
    industry. He has played a lead role in designing and developing the native cryptocurrency
    of an incubation hub in Southeast Asia, as well as successfully getting it listed
    on a renowned exchange via an IEO campaign. He is also the Chief Strategy Officer
    of an Australian blockchain company that manages a crypto hedge fund.


    Dr. Liew is also a blockchain researcher and has developed several use cases such
    as blockchain-powered supply chain management for the automotive and textile industries,
    building a blockchain-powered digital government, event and ticketing DApps, and
    more. He is skilled in setting up blockchain networks such as private Ethereum
    networks, as well as writing smart contracts using Solidity and creating DApps.
    He has also created a blockchain blog titled Blockchain Guide for Everyone (http://www.blockchainguide.biz/).


    He is the head of the education subcommittee of the Access Blockchain Association
    of Malaysia, as well as a regular speaker in regional blockchain events and workshops.'
