    ## 14.3 设计区块链架构


    你需要决定是从零开始构建区块链网络，还是使用第三方区块链解决方案（如 Azure blockchain、Oracle 或 AWS blockchain）。前者耗时较，而后者最快可以在
    30 分钟内完成。


    每种企业级区块链都提供其独特的功能、特性以及成本优势。AWS 和 Azure 都为 Ethereum、Hyperledger Fabric、Corda 和
    Quorum 提供了解决方案，而 Oracle 仅支持 Hyperledger Fabric。我们可以在表 14.1 中比较它们的特性。


    表 14.1


    | 框架 | Azure | Oracle |

    |---|---|---|

    | Ethereum, Hyperledger Fabric and Quorum | Ethereum, Hyperledger Fabric, Corda
    and Chain | Hyperledger Fabric |

    | 价格 | 随方案而异，按需付费 | 随方案而异，按需付费 | $0.75 按需付费 |

    | 主要合作伙伴 | Cisco, BlockApps, GuildOne, Intel, Kaleido, Mainfold Technology, Corda
    | BlockApps, Corda 和 23 个合作伙伴 | |

    | 主要客户 | R3 及其他几个合作伙伴。T Mobile 和 Guideware | Xbox, 3M 和 Insurware | |


    设置 Azure Blockchain Workbench 的成本约为 400-500 美元，取决于你的地区和使用情况。主要成本是三台虚拟机和一个应用服务。两台虚拟机用于默认区块链网络，一台虚拟机用于
    Workbench 上的微服务。关于 AWS Blockchain 的定价，请参考：


    https://aws.amazon.com/managed-blockchain/pricing/


    ## 第 15 章在区块链上存储数据


    尽管备受推崇且前景广阔，但区块链仍有其短板；数据存储问题就是之一。基于 POW 共识机制的比特币、以太坊和其他加密货币的交易速度极慢，因此不适合存储大型数据。例如，dApp
    Cryptokitties 的部署几乎瘫痪了以太坊网络。


    在区块链上存储数据的主要问题是由于协议限制和高昂的交易成本导致我们可以存储的数据量有限。事实上，区块链中的区块可以存储从几 KB 到几 MB 的数据。例如，比特币的区块大小仅为
    1Mb。区块大小限制对大多数加密货币的可扩展性产生了严重影响，比特币社区正在讨论是否增加区块大小。


    另一个问题是高昂的交易成本。为什么在区块链上存储数据如此昂贵？因为数据必须由区块链网络上的每个全节点存储。在区块链上存储数据时，我们不仅要支付交易本身的基础费用，还要为想要存储的每个字节支付费用。当涉及智能合约时，我们还要为智能合约的执行时间付费。即使在区块链上存储几
    KB 的数据可能花费你一大巨款。


    因此，在区块链上存储图像和视频等大文件是不可行的。是否有解决存储问题的可能方案？有的，有很多解决方案，但最有前景的是 IPFS。


    ### 15.1 什么是 IPFS？


    IPFS 或星际文件系统是由 Protocol Labs 的开发者创建的一个创新的开源项目。它是一个点对点文件共享系统，旨在改变信息在广域网中的分发方式。IPFS
    创新了一些通信协议和分布式系统，并将它们结合起来产生了一个独特的文件共享系统。


    目前的 HTTP 客户端-服务器协议是基于位置的寻址，面临一些严重的缺点。首先，基于位置的寻址消耗大量的带宽，因此浪费了我们大量的资金。此外，HTTP 从单一服务器下载文件，如果文件很大，就会很慢。而且它面临单点故障。如果服务器关闭，你会遇到
    404 错误。


    相反，IPFS 是基于内容的寻址。在 IPFS 网络中，你可以从最近的节点获取文件。这样，就不会有单点故障。如果某个节点宕机，文件在其他节点上可用。IPFS
    通过其去中心化克服了 HTTP 的缺陷。此外，强大的实体几乎无法阻止文件的访问。


    ### 15.2 区块链与 IPFS


    IPFS 是区块链的完美结合。正如我提到的，由于所有哈希都需要计算和验证，区块链在存储大量数据方面效率低下。因此，我们不是在区块链上存储数据，而是仅存储文件的哈希值。这样，我们就可以享受
    IPFS 的去中心化点对点属性。


    区块链和 IPFS 的一个真实应用案例是 Nebulis。它是一个全新的项目，探索一种在压倒性请求下据称永远不会故障的分布式 DNS。Nebulis 使用以太坊区块链和星际文件系统（HTTP
    的分布式替代方案）来注册和解析域名。未来我们将看到更多区块链与 IPFS 的集成。


    ## 第 16 章 Plasma——安全性和可扩展性的解决方案


    ### 16.1 可扩展性问题


    区块链在安全性和扩展性之间始终面临权衡问题。尽管它们的 PoW 共识协议保证了近乎完美的安全性，但也显著降低了处理速度。目前，以太坊的处理速度为每秒 15
    次交易，而比特币为每秒 7 次。这两个平台的处理能力远低于 Visa 每秒 45000 次交易的速度。


    此外，以太坊主链上部署的 dApp 增加导致了拥堵并极大地减慢了交易。著名的案例之一是 Cryptokitties，它在部署后的几周内由于其前所未有的普及堵塞了以太坊网络。


    ### 16.2 Plasma


    Plasma 是由主链和从主链分支出来的“子链”（又称父链或根链）组成的系统。子链可以共存，但与父链以及彼此独立运行。


