    # 1.6 Block Height


    The block height of a block is defined as the number of blocks preceding it in
    the blockchain (Investopedia). It is calculated as the length of the blockchain
    minus one. Genesis block has a block height of zero as it does not have preceding
    blocks. For example, the height of block 631977 is 6319776.


    # 1.7 Nonce


    A nonce is a random number the miners use to solve a mathematical puzzle in the
    mining process, which is also known as proof of work. The nonce in the Bitcoin
    block is a 32-bit (4-byte) field whose value is adjusted by the miner to make
    the hash of the block smaller than or equal to the current target of the network.
    The concept of proof of work will be explained in a later chapter.'
  - '[PAGE 29]


    # 1.8 Difficulty


    Difficulty is a value that measures the degree of difficulty to find a hash value
    for a given target, which represents the difficulty of mining. The value of difficulty
    will be changed once every 2016 blocks. The value will usually increase.


    # 1.9 Timestamp


    A timestamp is a sequence of characters or encoded information identifying when
    a certain event occurred, usually giving date and time of day. The term derives
    from rubber stamps used in offices to stamp the current date, and sometimes time,
    in ink on paper documents, to record when the document was received, as shown
    in Figure 1.7.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_29_0.png)


    Figure 1.7 Timestamp (Image adapted from Wikipedia)


    In this digital age, the term has been expanded to refer to the date and time
    information attached to digital data. For example, computer files contain timestamps
    that tell when the file was created and when was it last updated. Digital cameras
    add timestamps to the pictures by recording the date and time the pictures were
    taken.


    The Unix timestamp is the number of seconds passed since midnight on January 1,
    1970 (UTC / GMT), ignoring leap seconds. When I wrote this book, the Unix timestamp
    was'
