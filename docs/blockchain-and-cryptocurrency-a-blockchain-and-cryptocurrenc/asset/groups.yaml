    \ running. We shall use Ganache, a personal blockchain for Ethereum development\
    \ you can use to deploy contracts, develop applications, and run tests. If you\
    \ have not already, download Ganache and double click the icon to launch the application.\
    \ This will generate a blockchain running locally on port 7545. Launch Ganache\
