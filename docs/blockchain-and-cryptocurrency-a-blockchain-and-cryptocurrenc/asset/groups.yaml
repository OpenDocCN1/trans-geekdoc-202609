    \ to you so you can leave the default settings if you wish. Press \"deploy\",\
    \ type your account password, and wait a few seconds for your transaction to be\
    \ picked up.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_237_0.png)\n\nNow click\
    \ the DEPLOY button to deploy the smart contract, the output dialog is as shown\
    \ in Figure 20.7\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_238_0.png)\n\nFigure\
    \ 20.7\n\nUpon entering the password for your account and click send transaction,\
    \ the contract is successfully deployed, as shown in Figure 20.8\n\n## 20.8\n\n\
    Now the new token Best Token is shown in your wallet, as shown in Figure 20.9\n\
    \n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_239_0.png)\n\n## 20.9\n\nTokens are\
    \ currencies and other fungibles built on the Ethereum platform. For accounts\
    \ to watch for tokens and send them, you\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_239_1.png)\n\
    \nmust add their address to this list. Proceed to add BestCoin to the list, as\
    \ shown in the following figure.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_240_0.png)\n\
    \nFigure 20.10\n\n## 20.11\n\nNow you can send some funds from BestCoin to a wallet,\
    \ as shown in Figure 20.12.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_241_0.png)\n\
    \nFigure 20.12.\n\n## Chapter 21 Setting up a Private Ethereum Blockchain Network\
    \ on Windows\n\nSetting up a private Ethereum blockchain network is not an extremely\
    \ difficult task for the coders. However, it may be a bit of a challenge for the\
    \ beginners. I will skip some technical details and avoid using some jargon so\
    \ that everyone can understand the basic concepts.\n\n## 21.1 Prerequisites\n\n\
    Before setting up the network, you need to install the following software:\n\n\
    - Visual Studio Code\n- git\n- NodeJs\n- Ethereum Wallet\n- Geth\n\nThe **go-ethereum**\
    \ client is commonly referred to as **geth**, which is the command line interface\
    \ for running a **full Ethereum node** implemented in Go. By installing and running\
    \ get, you can run a private network or participate in the Ethereum main network.\
    \ By running get, you can perform the following tasks:\n\n- mine real ether\n\
    - transfer funds between addresses\n- create smart contracts and send transactions\n\
    - explore block history\n- and much much more\n\n## 21.2 Creating the Genesis\
    \ Block\n\nTo set up the private network, we need to create the Genesis block,\
    \ the first block of the blockchain in our network. The code for the genesis block\
    \ is written in JSON format. JSON stores data as a name/value pair. For example:\n\
    \n- \"name\": \"John\"\n- \"age\": 30\n\nIt uses JavaScript syntax, but the format\
    \ is text only. Therefore, JSON can be read and used as a data format by any programming\
    \ language. You can use any editor to write the JSON code (JSON: JavaScript Object\
    \ Notation), I used Notepad++. The sample code for the genesis block is as follows\n\
    \n```json\n{\n  \"config\":{\n    \"chainId\": 45,\n    \"homesteadBlock\": 0,\n\
    \    \"eip155Block\": 0,\n    \"eip158Block\": 0,\n    \"byzantiumBlock\": 12\n\
    \  },\n  \"alloc\": {\n    \"coinbase\": \"0x00000000000000000000000000000000\"\
    ,\n    \"difficulty\": \"0x20000\",\n    \"extraData\": \"\",\n    \"gasLimit\"\
    : \"0x2fef8\",\n    \"nonce\": \"0x0000000000000000000000042\"\n  },\n  \"mixhash\"\
    : \"0x0000000000000000000000000000000000000000\",\n  \"parentHash\": \"0x0000000000000000000000000000000000000000\"\
    ,\n  \"timestamp\": \"0x00\"\n}\n```\n\nI will not discuss the contents of the\
    \ genesis block here. Copy the code in a text editor and save the file as `myGenesis.json`.\n\
    \nNow run the following command in the command prompt to initialize the genesis\
    \ block\n\n```bash\ngeth init myGenesis.json\n```\n\nThe output is as shown in\
    \ Figure 21.1\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_244_0.png)\n\nFigure\
    \ 21.1\n\nOnce the genesis block is successfully created, a folder named 'Ethereum'\
    \ will be created in the following path:\n\n`C:\\Users\\admin\\AppData\\Roaming\\\
    Ethereum`\n\nThis folder contains the details of the Private Blockchain.\n\n##\
    \ 21.3 Starting the Private Network\n\nOnce the genesis block is created, run\
    \ the following command to start the private network:\n\n```bash\ngeth --networkid=5\n\
    ```\n\n“networkid=1” stands for the main Ethereum network. So, any random number\
    \ apart from 1 can be given as the network id. Also, “console” is appended to\
    \ the command to enable us to write commands while the network is running.\n\n\
    The output is as shown in Figure 21.2\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_245_0.png)\n\
    \nFigure 21.2\n\n## 21.4 Launching the Smart Contract\n\nNow click the DEPLOY\
    \ button to deploy the smart contract, the output dialog is as shown in Figure\
    \ 20.7\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_238_0.png)\n\nFigure 20.7\n\
    \nUpon entering the password for your account and click send transaction, the\
    \ contract is successfully deployed, as shown in Figure 20.8\n\n## 20.8\n\nNow\
    \ the new token Best Token is shown in your wallet, as shown in Figure 20.9\n\n\
    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_239_0.png)\n\n## 20.9\n\nTokens are currencies\
    \ and other fungibles built on the Ethereum platform. For accounts to watch for\
    \ tokens and send them, you\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_239_1.png)\n\
    \nmust add their address to this list. Proceed to add BestCoin to the list, as\
    \ shown in the following figure.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_240_0.png)\n\
    \nFigure 20.10\n\n## 20.11\n\nNow you can send some funds from BestCoin to a wallet,\
    \ as shown in Figure 20.12.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_241_0.png)\n\
    \nFigure 20.12.\n\n## 21.5 Creating a New Account\n\nYou can create an address\
    \ in the Ethereum Wallet. In the 'Wallets' section, click 'Add Account'. To create\
    \ new account using the Geth Console, use the following command:\n\n```bash\n\
    geth> account new\nGenerating key pair...\n0x...\nPlease give a password.\nPassphrase:\
    \ \nRepeat passphrase: \nAddress: 0xabcdef1234567890\nNew account created.\n```\n\
    \n## 21.6 Start Mining\n\nTo start mining on the private network, Enter the geth\
    \ console with the following command\n\n```bash\ngeth> miner.start()\n```\n\n\
    The output is as shown in Figure 21.5\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_247_0.png)\n\
    \nFigure 21.5\n\nNow you can see that the mining process is generating Ethers,\
    \ as shown Figure 21.6. Bear in mind that these are fake Ethers and can only be\
    \ used for a private net.\n\n## 21.7 Stop Mining\n\nType Ctrl+C in the geth console\
    \ or enter the following command:\n\n```bash\ngeth> miner.stop()\n```\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_248_0.png)\n\
    \nFigure 21.6\n\n## Chapter 22 Deploying Smart Contracts on Ropsten Testnet through\
    \ Ethereum Remix\n\nYou have learned how to use the truffle framework in Visual\
    \ Studio Code and node.js to deploy the smart contracts within a local test environment.\
    \ The next step is to try different test environments available to us. This chapter\
    \ will guide you to deploy the same smart contract code on Ethereum remix IDE\
    \ (IDE—Integrated Development Environment) on the Ropsten test net.\n\nWe need\n\
    \n- MetaMask (Install as Google Extension)\n- Remix-Solidity IDE (https://remix.ethereum.org)\n\
    - Ropsten Test Network\n\nMetaMask is a bridge that allows you to access the decentralized\
    \ distributed web of blockchain in your browser today. It allows you to run Ethereum\
    \ dApps in your browser without running a full Ethereum node. This make Ethereum\
    \ as easy as use for as many people as possible.\n\n### Step 1\n\nInstall MetaMask\
    \ Extension\n\nCreate an Account\n\n### Step 2\n\nCopy your account address and\
    \ request free Ether from Ethereum Ropsten Faucet.\n\n(http://faucet.ropsten.be:3001/)\n\
    \n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_251_0.png)\n\nFigure 22.1\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_252_0.png)\n\
    \nFigure 22.2\n\nLaunch Remix in the browser and paste any solidity smart contract\
    \ file or write one your own, as shown in Figure 22.3.\n"
