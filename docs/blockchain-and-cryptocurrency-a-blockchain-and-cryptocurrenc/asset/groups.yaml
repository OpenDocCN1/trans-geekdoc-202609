  md: '

    new project that involves a drastic transformation process. The implementation
    of the blockchain technologies in a school curriculum qualifies for such transformation.
    Therefore, there is a need to understand the problems and try to find solutions
    before we proceed with the project implementation.


    ## C - Clients


    They are the users and stakeholders of a system. In this case, they are the students,
    teachers, parents, the management staff, the education department, and others.
    They will benefit if the change is positive and the problems are solved. However,
    they may stand to lose or suffer if the change is negative and new problems are
    created. Therefore, we need to find out whether the blockchain technologies can
    solve current problems and bring positive changes in the school system. If the
    outcome could be negative or even damaging, we need to abort the project.


    ## A - Actors


    They are usually the employees within an organization, in this case, teachers
    and support staff. They are responsible for carrying out work and involved with
    the implementation of the blockchain system. Therefore, we need to conduct an
    inventory analysis to know their qualities, capabilities, and interests to get
    a clear picture of their impact on the organization. We may need to hire new employees
    or retrain the current ones to ensure competency with respect to blockchain implementation.
    We also need to conduct training for the employees.


    ## T - Transformation Process


    Transformation is the change that a system or process leads to. It is the process
    in which input (including raw materials, man-hours, knowledge) is transformed
    by an organization into output (such as a final product or solution to a problem).


    To implement the blockchain system, we need to know in advance what kinds of input
    requires and forecast what the result (output) will be. Besides that, we must
    carefully consider the intermediate steps. In this case, the input is the blockchain
    technologies and the output could be a system that churns out an intelligent pool
    of young entrepreneurs that thrive on co-creating and co-sharing.


    ## W - Worldview


    Stakeholders often have different ideas and approaches to the same issue, with
    other conflicting interests. The goal of the CATWOE analysis is to make their
    different viewpoint explicit and to achieve a methodology stand. In this project,
    we need to achieve consensus among the stakeholders that involve the students
    themselves, we do not want to force the ideas on them. Besides that, some teachers
    might be afraid in carrying out the transformation as they must learn new technologies.
    Parents would be overly concerned about the implementation of the blockchain technologies
    because it will bring profound impacts on their children, either positively or
    negatively.


    In addition, the government might want to regulate the project to ensure it complies
    with the national education policies and philosophies. On the other hand, business
    leaders may want to look for financial gains by sponsoring the project or they
    may refuse to support the project at all. Therefore, there is an urgent need to
    conduct surveys and research to figure out how to secure agreement from most stakeholders
    to implement the project.


    ## O - Owners


    This usually refers to the owner, entrepreneur, or investor of an organization,
    who wants to make changes and who decides whether a project should start or stop.
    As decision makers, they have the highest authorities. Commitment and support
    from the parties are important to ensure successful implementation of the blockchain
    project and long-term sustainability of the project.


    ## E - Environmental Constraints


    This is the actual environmental elements that may influence the organization
    and can limit or restrict the implementation of the blockchain technologies in
    the school system. Examples include political influence, ethical boundaries, regulations
    from the government, financial constraints, and social factors. There is a need
    to work closely to overcome the constraints via negotiations and other means with
    the regulators and other parties.


    After conducted the CATWOE analysis, I have identified the following problems
    where most schools are facing.


    ## Problems


    - The Current school system is too structured and too rigid, inhibiting creativity

    - The Curriculum methodology too centered on academics and examinations

    - Teacher-centered, lack of peer learning

    - The Administration is centralized and autocratic

    - Does not prepare children for the future

    - Lack of participation from stakeholders


    ## The proposed solution


    - Create a self-perpetuating and self-sustaining ecosystem where students can
    create and share digital content. It can also include tangible things like arts
    and craft, scientific inventions, or intangible things like music, song, new ideas,
    games, and so on. These tangible assets can be digitized and shared among the
    students.


    - Not only they can share digital content, but they can also buy and sell them.
    It is akin to an autonomous economic system where students can self-fund their
    projects by trading their digital assets.


    The latest technology that can power this system is blockchain, a subset of decentralized
    ledger technologies.


    The ecosystem should be enlarged to include the actors of the system - teachers,
    coaches, supporting staff and the administrators.


    The ecosystem must also be connected to stakeholders, including the business owners
    (who can provide financial support and sponsorship), the government (who may want
    to regulate the activities in the system), parents (who are concerned with their
    children development), etc.


    The ecosystem can be extended to include students from around the world in the
    future.


    ## The Architecture


    - Create a permitted private blockchain platform for the students. The students
    can interact freely in their own close loop decentralized and distributed ecosystem.

    - Content or assets can be created and tokenized and shared among the students.
    They can trade their assets using the tokens, creating a token economic system.

    - Develop APIs so that the stakeholders can interact with the blockchain. Administrators
    and teachers should be allowed to monitor and delete certain contents that are
    inappropriate like pornographic materials via the API. On the other hand, parents
    can monitor their children progress but may not be allowed to delete the contents
    or add comments. In addition, business owners and investors can monitor the progress
    of the project and provide support and advice if necessary (for example the system
    crashed or stalled). In addition, regulators might want to monitor the blockchain
    for compliance.


    - Proposed using Ethereum Proof of Authority(PoA) protocol known as Clique. The
    benefits of using POA are as follows:


    - Saves electricity power

    - Eliminates the need to invest into large numbers of ''Miners'' servers

    - Increase the transaction speed tremendous compared to Proof-of-Work(PoW)

    - Better security since since only members can access the network

    - The ecosystem can be hosted on a cloud server like AWS and Microsoft Azure,
    but you can set up your own servers. The conceptual model is illustrated in the
    figure below:


    ## The Blockchain School


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_293_0.png)


    ## The Legal Framework


    Obviously transforming a school into a blockchain school needs to obtain approval
    from the Ministry of Education. It must comply with national education policies.
    Therefore, we need to design the blockchain platform as a new approach in teaching
    and learning, keeping content within the requirements of the curriculum imposed
    by the Ministry of Education.


