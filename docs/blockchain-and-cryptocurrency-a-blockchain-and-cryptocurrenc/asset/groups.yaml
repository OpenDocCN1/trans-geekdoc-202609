    The blockchain network is a peer-to-peer decentralized network. The peers, also
    known as nodes, are connected to this network in a synchronous way. The nodes
    can be a desktop, a laptop, a mobile phone, a mining rig, servers, or any other
    electronic devices. These nodes form the foundation of the blockchain network.
    They provide computing resources like disk storage space to keep the network alive
    and to maintain its integrity and security, and they do it voluntarily.


    The decentralized peer-to-peer network is different from the traditional centralized
    client-server network, as shown in Figure 1.1 and Figure 1.2.'
