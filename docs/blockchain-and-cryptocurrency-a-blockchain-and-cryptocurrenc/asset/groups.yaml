    # Chapter 18


    # Decentralized Applications (DApps)


    DApp is an abbreviation for decentralized application.


    A DApp has its backend code running on a decentralized peer-to-peer blockchain
    or DLT network. Contrast this with an app where the backend code is running on
    centralized servers.


    A DApp can have a frontend code and a user interface written in any language that
    can make calls to its backend. Furthermore, its frontend can be hosted on decentralized
    storage such as Swarm or IPFS.


    A DApp can be programmed using a smart contract that can be written in any language
    but for Ethereum platform it is preferable to use Solidity. A DApp is always a
    combination of a frontend and a smart contract.


    I will discuss a conceptual model on how to develop a DApp and a simple guide
    on how to develop a DApp in the following section.


    # 18.1 Event Management and Ticketing DApp


    The event management and ticketing industry is a huge market, particularly the
    event management software market. Markets Insider reported that the event management
    software market is projected to grow from 5.7 billion USD in 2019 to 11.4 billion
    USD by 2024, at a CAGR of 15% from 2019 to 2024.


    However, despite the great potential of the event and ticketing industry, there
    are numerous problems and issues plaguing the current centralized event ticketing
    industry. The main issues include ticket counterfeiting, ticket scalpers, instant
    sell-outs,'
  - '[PAGE 181]


    and overpriced resale tickets on secondary markets (EventChain,

    2017).


    The good news is that the blockchain could fix the issues. A blockchain is a distributed
    digital ledger that can be used to record transactions and other data across a
    decentralized peer-to-peer network made up of a cluster of computing devices.


    Using blockchain technology, every ticket sale can be publicly verified, and thus
    the authenticity of the ticket can be guaranteed. It is also able to prevent fraudulent
    sales and counterfeiting. It sets rules (using smart contracts) preventing secondary
    ticket websites from hoarding tickets and charging inflated prices for premium
    events. If the rules are broken, the fraudulent accounts are frozen, and the tickets
    are made invalid.


    In a nutshell, a blockchain-based event and ticketing system has the following
    benefits:


    +   * Elimination of ticket duplication and counterfeit tickets

    * Elimination of scalpers

    * Elimination of ticket touts and purchasing bots

    * Fully transparent ticketing aftermarket

    * Automatic refund at the time of cancelation


    # 18.2 Use Cases


    # 18.2.1 BitTicket


    The Edinburgh-based Citizen Ticket is an event ticketing platform backed by blockchain
    technology that uses the cryptocurrency Ethereum Classic. In May 2017, they deployed
    the blockchain-based ticketing system BitTicket and delivered the first live event
    using blockchain technology.


    BitTicket is a ticket delivery service that event organizers, venues, and artists
    can use to secure their tickets with'
