    没有批准者的交易被称为“提示点（tips）”。在上面的图中，节点 100 是一个提示点，因为还没有人批准它的交易。所有节点都必须选择提示点进行批准，而不是选择较旧的交易，因为这有助于网络向前发展。选择应该批准哪两个提示点的方法是
    IOTA 的核心创新之一。


    现在，让我们来看看提示点是如何被选择的。我们还将讨论交易速率和随机游走的的概念。在 IOTA 缠网中，交易并不是均匀发生的，而是随机发生的。在某一时期内，可能有
    $m$ 笔交易，而在另一时期内可能有 $n$ 笔交易，其中 $m>n$ 或 $n<m$。交易速率可以通过被称为“泊松点过程”（Poisson Point Process）的数学过程来确定。泊松点过程模型用于分析分布在时间上的随机事件，例如客户进入商店、呼叫中心接听或地震的发生。


    交易速率可以根据以下简化的泊松点过程公式进行计算：


    ```

    N = λ

    ```


    N 是交易数量，$t$ 是时间单位。$\lambda$ 是常数。例如，如果我们设置 $\lambda = 5$，且时间单位为 10（单位可以是毫秒或秒等），那么在
    10 个单位间隔内发生的交易数量为 $5 \times 10 = 50$。


    设置合适的 $\lambda$ 值对于维持缠网结构的相干性至关重要。如果我们设置 $\lambda$ 的值非常小，例如 0.1，而交易数量保持在 50，那么时间间隔将是
    $50 \div 0.1 = 500$。在这种情况下，这意味着交易来非常缓慢，以至于形成链而不是缠网，导致在任何给定时间内只能批准一个提示点，而不是批准两个之前的交易。该场景如图
    7.3 所示。


