    我们到为止讨论的提示点选择算法是一种随机选择过程。这种选择过程可能不再适用于实际场景。因此，我们需要选择一种更先进的提示点选择算法。其中一种算法被称为无权随机游走（unweighted
    random walk）。


    它是什么？在编程中，“游走者（walker）”是一个用于遍历数组或其他数据结构的变量，通常指向一个固定值并步进遍历数组中的元素。在缠网中，我们可以在创世交易上编写一个游走者，并让它向提示点移动。


    在每一步中，它都会移动到直接批准我们当前所在交易的其中一个交易上。它以相等的概率选择向哪个交易游走，因此被称为无权随机游走。


    虽然无权随机游走（URW）非常有用，但它有可能导致 IOTA 生态系统崩溃的缺点。幸运的是有一种更好的提示点选择方法被称为加权随机游走（weighted random
    walk, WRW）。


