    - 取消或转售时的自动退款程序\n- 手机识别意味着更短的排队时间\n- 票务供应商\n  - 对一级二级市场的票进行完全控制\n  - 轻松与现有的票务解决方案集成\n\
    \n## 18.2.3 LAVA\n\nLAVA 是一个基于区块链的票务系统，为音乐爱好者保证公平安全的智能票。该系统防止门票倒卖和欺骗破坏音乐爱好者的音乐节。\n\
    \nLAVA 生态系统具有以下特点：\n\n- 100% 安全\n  - 使用最新的区块链技术消除门票欺骗\n- 智能票\n  - 使用唯一的数字足迹防止音乐节门被滥用\n\
    - Lava Wallet——通过数字化生成票并直接将数字票发送到 Lava 钱包，完全消除打印\n- 无预订费\n\n## 18.2.4 PouchNATION\n\
    \nPouchNATION 是一种有效利用区块链技术的活动管理软件系统。PouchNATION 是第一个在活动管理所有垂直领域实施区块链和新型货币的平台。它的组件包括游客注册、无现金支付、访问控制、活动跟踪、社交参与和详细的分析报告。\n\
    \n这个创新平台可以解决票务行业目前在活动管理、出勤跟踪应用、消除重复票以及门口验证注册方面面临的问题。\n\n他们已经在印度尼西亚、菲律宾、越南、马来西亚、泰国和缅甸执行了超过100\
    \ 场活动，包括无现金活动。\n\n## 18.2.5 EventChain\n\nEventChain 是一个全球智能票务区块链项目，允许全球活动通过点对网络销售智能票，解决了中心化活动票务行业的问题。\n\
    \n它实现了用于活动管理的 EventChain 令牌网络，确保更快的交易、不可争议的票证、活动主办方的透明度以及完全灵活可编程的智能票。通过使用 EVC\
    \ 令牌、智能合约代码和以太坊区块链，EventChain 的交易网络增加了活动票务的责任、透明度和安全性。\n\n为了解决过高的票费，EventChain\
    \ 正在发放 EVC 令牌，这是一种为了在太坊分布式网络上购买、出售和编写智能票而创建的数字 ERC20 令牌。EventChain 声称其交易费用低得多，且交易确认速度接近秒级。\n\
    \n## 18.2.6 活动管理与票务平台 - 概念模型\n\n在检查了上述用例后，我提议使用类似的概念开发一个基于区块链的活动管理和票务平台。以下是活动管理和票务平台的简单概念模型：\n\
    \n## 区块链活动管理平台\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_185_0.png)\n\n图 18.1\n\
    \n该平台允许活动组织者创建一个活动并广播到网站以及移动钱包。活动应包含等细节，如活动标题、日期、时间、场馆和票务订单按钮。参与者可以通过支付 Token\
    \ X 来订购机票。一旦组织者收到 Token X，电子票将自动送达。\n\n## 18.3 开发 DApp - KittyChain Shop\n\n在本项目中，我们将使用\
    \ Ganache (https://truffleframework.com/ganache) 来开发 KittyChain DApp。\n\nGanache\
    \ 是一个用于以太坊开发的个人区块链，你可以用它部署合约、开发应用程序和运行测试。它既有桌面应用程序版本，也有命令行工具（以前称为 TestRPC）。\n\n\
    Truffle 是一个用于使用以太坊虚拟机 (EVM) 的区块链的世界级开发环境、测试框架和资产管道，旨在让开发者的生活变得简单。\n\nKittyChain\
    \ DApp 是一个宠物店的领养跟踪系统。\n\n### 18.3.1 构建 Dapp 的步骤\n\n1. 设置开发环境\n2. 使用 Truffle Box\
    \ 创建 Truffle 项目\n3. 编写智能合约\n4. 编译并迁移智能合约\n5. 测试智能合约\n6. 创建与智能合约交互的用户界面\n7. 在浏览器中与\
    \ DApp 交互\n\n###  步骤 1 设置开发环境\n\n安装以下内容：\n\n1. Node.js\n2. Git\n3. Truffle\n\n\
    安装完上述软件包后，我们将开始安装 Ganache。你可以通过访问 http://truffleframework.com/ganache 并点击“Download”按钮来下载\
    \ Ganache。\n\n### 步骤 2 使用 Truffle Box 创建项目\n\nTruffle 在当前目录初始化，因此首先在你选择的开发文件夹中创建一个目录，然后进入该目录。\n\
    \n```\nmkdir pet-shop-tutorial\ncd pet-shop-tutorial\n```\n\n现在你已经创建了一个名为 pet-shop\
    \ 的 Truffle Box，它包含了基础项目结构以及用户界面的代码。\n\n接下来，使用 `truffle unbox` 命令解压这个 Truffle\
    \ Box。\n```\ntruffle unbox pet-shop\n```\n\n# 输出\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_188_0.png)\n\
    \n图 18.2\n"
