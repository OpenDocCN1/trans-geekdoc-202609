    如果你基于 AMD64 或 EM64T 架构的电脑（例如 Athlon64, Opteron, EM64T Xeon, Core 2），请选择此项。如果你使用的是
    AMD 的非 64 位处理器，或者你需要对 32 位代码完全支持，请使用 i386 镜像。如果不确定，请选择此项。


    你可以在虚拟机中安装 Ubuntu，我使用了 Oracle Virtual Box。从 https://www.virtualbox.org/ 下载 Oracle
    Virtual Box。要成功安装 Hyperledger Fabric，你应该熟悉 Go 和 Node.js 编程语言，并在电脑上安装以下功能：cURL、Node.js、npm
    包管理器、Go 语言、Docker 和 Docker Compose。


    ## 24.2 安装 cURL


    打开终端窗口：CTRL+ALT+T。


    输入以下命令并输入密码：


    ```bash

    sudo apt install curl

    ```


    在终端中运行以下命令进行检查：


    ```bash

    curl -V

    ```


    ## 24.3 安装 Docker


    要安装 Docker CE，你需要以下 Ubuntu 版本之一的 64 位版本：


    - Cosmic 18.10

    - Bionic 18.04 (LTS)

    - Xenial 16.04 (LTS)


