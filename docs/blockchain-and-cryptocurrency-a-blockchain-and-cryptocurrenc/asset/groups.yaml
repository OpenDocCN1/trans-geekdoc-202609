    # Chapter 3


    # Ethereum - The Programmable Blockchain and DApps Platform


    Many alternative cryptocurrencies or simply altcoins have emerged since the successful
    launch of Bitcoin in 2009. There are more than a thousand at the time of writing
    this book. However, none of the cryptocurrencies came close to challenging Bitcoin
    until the invention of Ethereum by Vitalik Buterin.


    # 3.1 A Brief History of Ethereum


    Ethereum was first conceptualized by Vitalik Buterin in 2013. He is a young Russian
    Canadian programming genius (born 1994). In 2014, he cofounded the Ethereum platform
    with Mihai Alisie, Anthony Di Iorio and Charles Hoskinskinson.


    The Ethereum Foundation held an Ethereum crowdsale in July 2014 during which they
    sold 60 million tokens. A total of 12 million Ether (ETH) tokens were created
    so the Ethereum Foundation could expand its development and marketing efforts.
    The Ethereum Mainnet went live on 30 July 2015, with 72 million coins "premined".


    Ethereum broke into the mainstream in early 2017 when the price of ETH increased
    by 1000 percent over the course of a couple of months. This led to a similar rise
    in the price of alternative blockchain tokens, also known as altcoins. It is still
    ranked second behind Bitcoin on Coinmarketcap at the time of writing. Currently
    there are over 1600 altcoins, and this number is still growing.'
  - '[PAGE 49]


    # 3.1.1 What is Ethereum?


    Ethereum is an open-source blockchain-based decentralized platform featuring smart
    contracts. Besides that, Ethereum is a programmable blockchain that enables developers
    to build and deploy decentralized applications. Of course, it also offers Ether,
    an alternative cryptocurrency to Bitcoin. It is also a platform for running an
    Initial Coin Offering (ICO), which is a crypto crowdfunding initiative. I shall
    explain ICO in another chapter.


    Ethereum runs on a distributed public blockchain network. Every node connected
    to the Ethereum network helps to maintain and update the blockchain database.
    The nodes of the Ethereum network run the Ethereum Virtual Machine (EVM) and execute
    the instructions according to the smart contracts. Ethereum nodes run the EVM
    to maintain consensus across the blockchain.


    Ethereum Virtual Machine ("EVM") is the core engine that runs the Ethereum Platform.
    It is the runtime environment that executes all the smart contracts on the Ethereum
    network. The EVM can be considered a Turing complete virtual machine, which means
    it can perform any logical step of a computational function. Rather than providing
    users with a set of predefined applications like the Bitcoin protocol, Ethereum
    serves as a platform for users to create many different types of decentralized
    blockchain applications (dApps), including but not limited to cryptocurrencies.


    # 3.1.2 Gas, Gas Price and Gas Limit


    A term everyone must know about Ethereum is gas. In addition, you need to understand
    its associated terms: gas price and gas limit.'
  - '[PAGE 50]


    # 3.1.3 What is Gas?


    Gas is a unit that measures the amount of computational effort that it will take
    to execute certain operations on the Ethereum blockchain. The operations include
    sending tokens, deploying a smart contract, interacting with a contract, sending
    ETH, launching an ICO, or anything else on the blockchain. Gas is needed to power
    the Ethereum Ecosystem, just like fuel is needed to power a car.


    # 3.1.4 What is Gas Price?


    As I have mentioned earlier, we need to use gas for every operation made on Ethereum,
    regardless of whether your transaction succeeds or fails. Gas does not come free.
    We need to pay for it, just like paying for gasoline to drive our cars. The transaction
    fee depends on the gas price and the gas limit.


    Gas price is the amount of Ether you need to pay per unit of gas. It is measured
    in Gwei (1 Gwei = 0.000000001 ETH). Its value is determined by the miners, who
    can refuse to process the transaction with less than a certain gas price. The
    transaction fee is paid to the successful miner as a form of incentive that motivates
    the miners to maintain the nodes. Therefore, they have the controlling power over
    the gas price. We must have enough Ether in our wallet to pay for the gas fees.
    The transaction fee is calculated using the following formula:


    Transaction fee = Gas used x Gas price


    For example, for a certain transaction:


    Gas used = 21,000


    Gas price = 6 Gwei or 0.000000006 ETH


    Transaction fee = 21,000 x0.000000006 ETH = 0.000126 ETH'
