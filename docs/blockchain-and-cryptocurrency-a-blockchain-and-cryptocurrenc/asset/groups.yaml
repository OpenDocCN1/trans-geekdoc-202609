    of Work），又称 PoW。当一个区块被“解决”时，所有交易都被视为已验证，新区块被确认。这个新区块将附加到区块链上。对于比特币而言，确认一个新区块大约需要
    10 分钟，但对于其他币种则快得多。因此，如果你发送或接收比特币，交易大约需要 10 分钟才能被确认。


