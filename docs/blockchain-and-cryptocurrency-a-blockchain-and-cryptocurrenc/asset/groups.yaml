    # 廖文龙（Dr. Liew Voon Kiong）


    # 区块链与加密货币


    一本面向所有人的区块链与加密货币指南


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_1_0.png)


    https://archive.org/details/blockchaincrypto0000liew


    # 区块链与加密货币


    一本面向所有人的区块链与加密货币指南


    廖博士著


    版权所有 © 2019 廖文龙。

    未经作者书面许可，不得以任何形式或通过任何手段复制本书任何部分。


    # 关于作者


    廖文龙（Dr. Liew Voon Kiong）拥有数学学士学位、管理学硕士学位以及工商管理博士学位。


    廖博士是区块链行业公司争缺的区块链架构师。他曾在设计和开发东南亚某孵化中心的原生加密货币方面发挥了领导作用，并成功通过 IEO 活动将其在知名交易所上市。他还担任一家管理加密对冲基金的澳大利亚区块链公司的首席战略官。


    廖博士还是一名区块链研究员，开发了多个用例，例如用于汽车和纺织行业的区块链驱动供应链管理、构建基于区块链的数字政府、活动和票务 DApps 等。他擅长搭建区块链网络（如私有以太坊网络），并使用
    Solidity 编写智能合约以及创建 DApps。他还创建了一个题为《面向所有人的区块链指南》（http://www.blockchaiguide.biz/）的区块链博客。


    他是马来西亚访问区块链协会（Access Blockchain Association of Malaysia）教育小组主席，也是区域区块链活动和研讨会的常驻演讲者。


    # 前言


    区块链是过去十年中最热门的技术。尽管区块链技术在某种程度上被过度炒作，但它具有破坏许多现有行业的潜力。许多初创企业、跨国公司、政府、非营组织和个人已经开发并实施了基于区块链的应用。


    随着社交媒体、网络门户和广告对我们的轰炸，区块链已悄然进入了我们的日常生活。结果是，直到今天几乎所有人都没有谈论加密货币。然而，大多数人仍然不理解区块链——这项驱动加密货币的技术。因此，我撰写了这本书，希望能帮助大家更好地理解区块链技术和加密货币。


    本书是一份全面的指南，涵盖了基础和高级主题，例如：


    -   在加密钱包中安全地存储您的加密货币

    -   智能合约

    -   dApps

    -   如 Hyperledger 和 Corda 等企业级区块链框架

    - 如何进行 ICO 和 IEO

    - DeFi（去中心化金融）

    - 用于金融服务的区块链

    - 用于供应链管理的区块链

    - 使用区块链构建数字政府

    - 区块链驱动的人力资源转型


    书中还涵盖了技术主题，例如：


    -   通过 Plasma 提高可扩展性

    -   在 IPFS 上存储区块链数据

    -   使用 Solidity 编写智能合约

    - 开发 DApps

    -   开发 ERC-20 代币

    -   搭建私有以太坊区块链

    -   创建多签名钱包

    - 使用 Hyperledger Fabric 创建一个汽车供应链管理区块链平台


