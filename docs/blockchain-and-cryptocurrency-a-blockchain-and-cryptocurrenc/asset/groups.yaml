    # 12.4 Fraud prevention, cybersecurity, and data protection


    HR department usually needs to handle high-volume financial transactions and sensitive
    personal data; therefore, it is utmost important to prevent frauds as well as
    to safeguard the data. This is the area where blockchain could be extremely useful.
    Blockchain''s use of consensus to authenticate data can help to eliminate frauds.


    Another issue that blockchain can help to overcome is cyber threats. Many SMEs
    are ill-prepared for cyber-attacks and the results could be detrimental to their
    businesses. Blockchain could help ensure cybersecurity as the data are immutable
    and tamper-proof because it uses SHA-256 hashing cryptography.


    # 12.5 HR Blockchain Use Cases


    HR Blockchain use cases have started to emerge and have the potential to disrupt
    traditional HR systems. Among them are ChronoBank.io, PEACCOUNTS,and bitWAGE .Let
    us examine each one of them.


    # 12.5.1 ChronoBank.io


    This is an HR blockchain platform designed to improve the recruitment process
    as well as payroll. It claimed that it will disrupt the HR industry like Uber
    has disrupted the taxi industry.


    ChronoBank ecosystem comprises a hiring platform(LaborX), a decentralized exchange(TimeX),
    a multi-signature wallet(Chronowallet) and a cryptocurrency that is pegged to
    labor hours(Labor Hour token).


    LaborX is their flagship global hiring platform that connects candidates to the
    companies. It features an industry first immutable reputation system and a crypto
    payment system based on smart contract. The reputation system allows faster'
  - '[PAGE 148]


    screening of candidates therefore save time and cost in hiring the right candidates.
    In addition, the crypto payment system enables candidates to get paid on time.


    Furthermore, it plans to use a stable coin as the crypto payment to eliminate
    volatility in most cryptocurrencies. This Coin is known as Labour-Hour tokens.
    These tokens are linked to average hourly wages in the host country and are backed
    by a real labor force from big recruitment and labor-hire companies. Labor is
    considered a traceable resource so Chronobank will tokenize this resource into
    the LH-Tokens.


    # 12.5.2 PeaCounts


    PeaCounts is a blockchain-based payroll system. PeaCounts claimed that their payroll
    system will revolutionize the way employees are paid by using blockchain to remove
    the trust-based elements of the payroll process. It ensures the employees get
    paid as soon as the work is completed. On the other hand, the employer will pay
    just for the work completed.


    It features a smart contract that can track an employee location and time spent
    on certain tasks. It also holds the PEA Tokens and release them to the employee
    upon completion of the tasks. This system ensures that the employee gets paid
    efficiently and fairly.


    The PeaCount payroll system is a private blockchain created as a fork off the
    BitCoin. It also implements the zk-Snarks protocol and a multi-access wallet to
    ensure security in payroll transactions.


    # 12.5.3 bitWage


    bitWage is a payroll and HR services platform designed for the digital age. Basically,
    it is a global outsourcing platform that serves the freelancers who wish to seek
    jobs worldwide and employers who wish to hire remote workers.'
  - '[PAGE 149]


    The bitWage payroll system allows employers to pay their remote employees rapidly
    with low transactions. The employees have the option to receive their wages and
    salaries in any of twenty-four currencies, four cryptocurrencies , and four precious
    metals.


    # Chapter 13


    # Decentralized Finance


    Decentralized finance, popularly known as DeFi which means operating financial
    applications on a decentralized platform such as blockchain. It is the new financial
    architecture that leverages decentralized networks and decentralized technologies
    such as smart contracts to transform old financial products into trustless and
    transparent protocols that run without intermediaries.


    In contrast, centralized finance means a single organization like a bank controls
    and manages the funds of the clients. This kind of centralized control has many
    weaknesses, including the abuse of funds and manipulation of personal data, frauds,
    single point of failure due to hacking, and more.


    Decentralized finance has many advantages as it is aligned with the characteristics
    that blockchain technology possesses.


    # 13.1 The Advantages of DeFi


    # 13.1.1 Maintain Full Control of Your Own Digital Assets


    The digital assets that you own on a DeFi platform solely belong to you alone
    and have the freedom to use it in whatever ways you like, without the interference
    of an intermediary. There is no centralized authority, such as a bank, with the
    ability to'
  - '[PAGE 150]


    freeze your account, seize your assets, or block your transactions.


    # 13.1.2 Increased Accessibility


    According to the World Bank, globally there are still approximately 1.7 billion
    unbanked adults. These people are at a disadvantage when it comes to pursuing
    many financial opportunities that could improve their socioeconomic status and
    lift them out of poverty.


    Unfortunately, centralized financial institutions do not have an incentive to
    target this population. The revenue they would receive from providing services
    to the currently unbanked simply does not justify the costs of reaching them.
    In contrast, DeFi providers operate without intermediaries hence they are more
    willing to serve the underprivileged people. Furthermore, DeFi is borderless and
    ‘permissionless’ hence everyone on earth particularly the unbanked population
    can access this form of affordable financial services. Therefore, DeFi has the
    potential to reduce the world’s poverty.


    # 13.1.3 Opportunity to Own a Portion of An Expensive Asset


    Another DeFi application is tokenized assets. Tokenizing assets is creating digital
    tokens to represent the ownership of real assets that can be traded like securities
    such as shares. By creating tokenized assets that represent, say, a portion of
    a real estate investment, you open the investment for people who previously could
    not afford it, to having access from anywhere in the world. Almost anyone can
    trade tokenized assets as he or she is not required to commit to an entire high-value
    investment at once. Instead, he or she has the option to buy or sell just a portion
