    Upon the maturity of our index fund, we will eventually expand our blockchain
    we use into other areas such as payment systems. Our blockchain solution provides
    a new way for consumers, businesses, and banks to transact and is key to the company''s
    strategy to provide payment solutions that meet every need of financial institutions
    and their end-customers.


    We plan to implement the technology initially in the realm of business-to-business
    (B2B) transactions. We believe that blockchain technology will help to address
    challenges involving speed, transparency and costs associated with cross-border
    payments.


    Blockchain is the technology behind cryptocurrencies like Bitcoin and Ethereum.
    Through blockchain technology companies can create an irrevocable digital ledger
    of transactions. The technology can be integrated into many business processes
    today to improve security, transparency, trust and more. Besides, smart contracts
    can be created for literally any task, such as smart homes and property insurance,
    payment cards, logistics, healthcare, insurance, and many other industries. Additionally,
    blockchain technology removes the need for a central authority to manage transactions,
    making these transactions highly secure and impenetrable for hackers.


    Although the blockchain technology has yet to be widely adopted, it has already
    proven critical for businesses and even more so for the B2B realm since it often
    deals with large transactions that involve multiple trustless parties across the
    supply chain.


