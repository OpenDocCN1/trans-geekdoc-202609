    ## Case 2 Blockchain-Powered Smart Supply Chain Management - Textile Industry


    This case study examines the issues faced by the Bangladesh textile industry and
    provides a possible solution based on blockchain.


    The following figure outlines the complexity of the textile supply chain in Bangladesh.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_133_0.png)


    **Figure 10.5 Textile Supply Chain**


    The above supply chain shows the traceability of cotton from firm holder to retailer.
    Cotton is the key input to the apparel industry. For just one T-shirt made from
    conventional cotton, you need to use 2700 liters of water. Now, sustainability
    is becoming an important parameter and apparel brands do not have the time or
    resources to monitor all aspects of the supply chain, whether crop production
    or retail. But the problem is, they do not know where the cotton comes from.


    The textile supply chain from the raw product to the retailer trade remains overly
    complex. It is almost impossible to retrace a textile to its place of origin as
    supply structures in the textile and clothing industry are kept secret. Cotton
    traceability is becoming an important part for sustainability. Using technology
    for traceability, it is possible to retrace each production step at each level
    of the production chain.


    - **Cotton Producers**: Small firm holder cultivates and harvests the cotton crops,
    which are delivered to ginners. For traceability, cotton producers can give a
    unique code or tag to their raw cotton.

    - **Ginners**: Cotton bales are classed according to fiber strength, length, color,
    non-fiber content and fineness. Ginners sell cotton bale to various cotton traders.

    - **Traders**: Traders usually buy cotton bale from various sources and sell it
    to spinning mills all over the world. So, traceability, cotton bales need a bar
    code or tag.

    - **Spinners**: Spinning mills buy cotton bales from several traders. Using a
    traceability system, they can get information about their cotton bales.

    - **Fabric Mills**: Fabric mills buy yarn from various sources. Sometimes, it
    can come from foreign spinning mills. So, traceability can be more complex.

    - **Dyeing & Washing Unit**: Sometimes fulfils fabric demand. Fabric mills may
    have a subcontract with another unit or engage in outsourcing.

    - **Garment Manufacturers**: Every garment manufacturer buys fabric from various
    sources. And sometimes they have a hidden subcontract with other units.

    - **Retailers**: Retailers are the final seller to consumers. Due to sustainability
    issues, they want to trace their whole supply chain. Every product could have
    a unique code or barcode that gives customers all the information about that product,
    from cotton production to retailer.


    The traditional SCM is overly complex as the channel members are working in silos
    and do not have access to shared database. The SCM model is as shown in Figure
    10.6


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_135_0.png)


