    # Chapter 13


    # Decentralized Finance


    Decentralized finance, popularly known as DeFi which means operating financial
    applications on a decentralized platform such as blockchain. It is the new financial
    architecture that leverages decentralized networks and decentralized technologies
    such as smart contracts to transform old financial products into trustless and
    transparent protocols that run without intermediaries.


    In contrast, centralized finance means a single organization like a bank controls
    and manages the funds of the clients. This kind of centralized control has many
    weaknesses, including the abuse of funds and manipulation of personal data, frauds,
    single point of failure due to hacking, and more.


    Decentralized finance has many advantages as it is aligned with the characteristics
    that blockchain technology possesses.


    ## 13.1 The Advantages of DeFi


    ### 13.1.1 Maintain Full Control of Your Own Digital Assets


    The digital assets that you own on a DeFi platform solely belong to you alone
    and have the freedom to use it in whatever ways you like, without the interference
    of an intermediary. There is no centralized authority, such as a bank, with the
    ability to freeze your account, seize your assets, or block your transactions.


    ### 13.1.2 Increased Accessibility


    According to the World Bank, globally there are still approximately 1.7 billion
    unbanked adults. These people are at a disadvantage when it comes to pursuing
    many financial opportunities that could improve their socioeconomic status and
    lift them out of poverty.


    Unfortunately, centralized financial institutions do not have an incentive to
    target this population. The revenue they would receive from providing services
    to the currently unbanked simply does not justify the costs of reaching them.
    In contrast, DeFi providers operate without intermediaries hence they are more
    willing to serve the underprivileged people. Furthermore, DeFi is borderless and
    ‘permissionless’ hence everyone on earth particularly the unbanked population
    can access this form of affordable financial services. Therefore, DeFi has the
    potential to reduce the world’s poverty.


    ### 13.1.3 Opportunity to Own a Portion of An Expensive Asset


    Another DeFi application is tokenized assets. Tokenizing assets is creating digital
    tokens to represent the ownership of real assets that can be traded like securities
    such as shares. By creating tokenized assets that represent, say, a portion of
    a real estate investment, you open the investment for people who previously could
    not afford it, to having access from anywhere in the world. Almost anyone can
    trade tokenized assets as he or she is not required to commit to an entire high-value
    investment at once. Instead, he or she has the option to buy or sell just a portion
    of the.


    ### 13.1.4 Transparency


    DeFi data is an open-source project available, enabling you to keep service providers
    honest. For instance, you can easily check the reserves of a DeFi bank, shop around
    for loan rates, or even track the transactions of public figures. Let us examine
    a well-known use case of DeFi, the Maker DAO


    ## 13.2 Maker DAO


