    | 价值 | 109.6201869961092145 ETH ($25,796.77) |

    | 手续费 | 0.000126 ETH ($0.03) |

    | 交易使用的 Gas 限制 | 21000 |

    | Gas 价格 | 100,000.000000006 ETH (6 Gwi) |


    此外，你可以通过支付更高的 Gas 费来激励矿工优先处理你的工作。这样你就可以插到队列的最前面，让交易最先处理。


