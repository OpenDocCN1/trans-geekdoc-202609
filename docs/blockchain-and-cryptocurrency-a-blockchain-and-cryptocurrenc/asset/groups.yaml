    在过去的十年里，加密货币已成为一个新的资产类别。其惊人的增长吸引了许多从传统金融产品转向投资加密资产的投资者。报告显示，有大量资金流入加密市场。这种资金流动增加了加密市场对新金融产品的需求。事实上，加密货币正迅速获得公众关注。根据
