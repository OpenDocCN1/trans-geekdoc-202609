    ## 10.3 The Proposed Blockchain SSCM Model


    The proposed blockchain smart supply chain model is based on the Hyperledger Fabric
    Framework. The channel members will be more interconnected and have better access
    to shared common ledger. The model is illustrated in Figure 10.2


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_130_0.png)


    Figure 10.2


    The diagram above shows two channels, channel 1 and channel 2. Each channel has
    its own application, peers, ledger, and smart contract (chaincode). In this example,
    channel 1 has P1 and P2 and channel 2 also has two peers, P3 and P4. Ordering
    service is the same across any network and channel.


    Application 1 will send transaction proposals to channel 1. P1 and P2 will then
    simulate and commit transactions to ledger L1 based on chaincode S1. On the other
    hand, Application 2 will send transaction proposals to channel 2. P3 and P4 will
    simulate and commit transactions to ledger L2 based on chaincode S2. Further illustration
    of channels can be found in Figure 10.3


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_131_0.png)


