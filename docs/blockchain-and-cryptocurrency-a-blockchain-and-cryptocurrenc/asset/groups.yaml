    # 第 3 章


    # 以太坊 - 可编程区块链和 DApps 平台


    自 2009 年比特币成功发布以来，出现了许多替代加密货币或简单称为山寨币（altcoins）。当时有超过千种。


    # 3.1 以太坊简史


    以太坊于 2013 年由维特币·布特林（Vitalik Buterin）构思。2014 年，他与米哈伊·奥里奥（Mihai Iorio）以及查尔斯·霍斯金森（Charles
    Hoskins）共同创立了以太坊基金会。以太坊基金会在 2014 年举行首次代币发行（ICO）。以太坊主网于 2015 年 7 月 30 日上线。以太坊 2017
    年进入主流，其价格上涨了数百倍。在加密货币市场（Coinmarketcap）上排名第二。


    # 3.1.1 什么是以太坊？


    以太坊是一个基于区块链的、支持智能合约的开源平台。此外，它允许开发者构建去中心化应用（dApps）。以太坊虚拟机（EVM）是其核心。它是图完的。# 3.1.2
    Gas、Gas 价格和 Gas 限制


    之前提到的，你需要理解这些术语：gas 价格和 gas 限制。# 3.1.3 什么是 Gas？


    Gas 是衡量执行操作所需的计算量的单位。操作包括发送代币、部署智能合约等。Gas 并非免费，就像汽油费一样。# 3.1.4 什么是 Gas 价格？


    Gas 价格是你每个单位 Gas 需要支付的金额。它以 Gwei 为单位（1 Gwei = 0.000000001 ETH）。价值由矿工决定，他们可以拒绝低价格交易。手续费是支付给成功矿工的奖励。手续费通过以下公式计算：


    例如，对于某笔交易：


    使用的 Gas = 21000


    Gas 价格 = 6 Gwei 或 0.000000006 ETH


    手续费 = 21000 x 0.000000006 ETH = 0.000126 ETH


    你可以在 Etherscan 上看到智能合约的实际输出，如表 3.1 所示。


    # 表 3.1 区块 #1015194


