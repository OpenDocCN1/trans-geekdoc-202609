    # 第 14 章


    # 为业务构建区块链


    区块链是比特币、以太坊和其他加密货币的底层技术。然而，加密货币远非区块链在业务领域的唯一应用。区块链最受欢迎的业务应用之一是融资，尤其是对于初创公司而言。除了传统的融资方式，区块链还实现了如
    ICO 或 STO 等替代融资方法。


    在过去的几年里，许多公司通过 ICO 筹集了惊人的资金。一些最大且最成功的 ICO 项目包括 NEO（国链）、Ethereum（太坊）、Spectrecoin
    和 Lisk。关于 ICO 的更多信息可以在 Investopedia 网站上找到。


    尽管如此，我不会在本文中讨论 ICO。相反，我们将探讨区块链在业务中的应用。我们可以将区块链用于各种业务场景，但区块链是否适用于某业务取决于业务性质、业务模式、需求以及许多其他因素。


    在实施区块链之前，业务组织的 C 级管理团队应该进行可行性研究，以确定采用区块链技术是否必要且可行。你应该问以下问题：


    - 区块链能为当前业务增加价值吗？

    - 区块链能提高组织的竞争力吗？

    - 你需要与非信任方（trustless parties）打交道吗？

    - 你需要一个去中心化的分布式数据库系统吗？

    - 区块链能提高工作流效率吗？

    - 区块链能增加收入和利润吗？

    - 你有足够的资金资源来实现区块链吗？

    - 区块链技术能与现有系统集成吗？

    - 你有足够的人才管理区块链系统吗？


    一旦你决定实施区块链对你的公司有益，你需要执行以下步骤：


    1. 识别合适的用例（use case）。

    2. 组建你的团队。

    3. 设计区块链架构。


    ## 14.1 识别合适的用例


    要启动区块链项目，你需要为你的业务识别合适的用例。最好的方法是研究与你业务类似的行业中的用例。通常，区块链在三个领域表现非常出色。


    ### 14.1.1 数据认证与验证


    这包括不可篡存储、数字签名和加密。几乎任何格式的数据都可以存储在区块链中。区块链可以创建公私钥对，并用于生成和验证数字签名。因此，它可以用于数据认证与验证。


    最好的用途之一是防伪。例如，总部位于马来西亚的区块链公司 Luxtag 已获得了一种反伪技术的专利。该技术使企业及其客户能够通过区块链技术提供的数字化证书来保护其贵价值资产的真实性和所有权。他们已经推出了第一款产品——e-Scroll，供马来西亚公立大学联盟使用基于区块链的
    Web 应用程序来验证和确认证书。


    另一个与认证和验证相关的领域是数据来源（data provenance）。该领域最成功的公司之一是 Everledger。该公司构建了钻石时间序列协议（Diamond
    Time-Lapse Protocol），这是一项基于区块链平台的针对钻石和珠宝行业的可追溯倡议。该系统旨在确保钻石在整个生命周期过程中的透明度，增强消费者信心并推动行业增长。


    供应链管理是另一个区块链可以发挥作用的领域。最引人注目沃尔玛利用区块链技术确保食品安全。沃尔玛一直与 IBM 合作开发食品安全区块链解决方案，要求山姆会员商店（Sam''s）和沃尔玛的所有叶类蔬菜供应商在
    2019 年 9 月之前将其数据上传到区块链上。通过将供应链放在区块链上，使过程变得更具可追溯性、透明且完全数字化。


    其他业务应用可能包括医疗记录管理、保险、银行的 KYC（了解您的客户）管理等。


    ### 14.1.2 数字资产管理


    任何可以数字化的资产都被视为数字资产。数字资产包括电子书、数字艺术、图像、视频、音乐、期刊、音频书、在线课程、食谱等。随着区块链技术的发明，数字资产还包括加密资产。加密资产可以是比特币、以太坊等加密货币，也可以是现实资产的代币化版本，如黄金、银、石油、土地证、物业、绘画等。


    目前，大多数数字资产通过中心化的电子商务市场在互联网上交易。然而，数字资产可以在去中心化的点对点区块链平台上更高效地交易。


    区块链中数字资产管理的某些现实用例包括：


    - AlphaPoint。提供企业级软件，允许机构将资产转换为证券代币并在交易所交易这些资产。

    - Polymath。使数万亿美元的证券迁移到区块链。

    - Harbor。提供一个数字证券平台，用于合规融资、投资者管理和流动性管理。

    - Powerledger。提供一个点对点能源交易平台。


    ### 14.1.3 智能合约


    智能合约是一种可编程合约，能够在满足特定条款和条件时刻自动执行合约。它类似于自动售卖机——你通过投入一些硬币或钞票获得产品。


    根据 Investopedia 的说法，智能合约是：


    > “自动执行的合约，买方和卖方之间的协议条款直接写入代码行中。代码和其中包含的协议存在于分布式、去中心化的区块链网络中。智能合约允许不同、匿名双方之间进行信任的交易和协议，而无需中央机构、法律系统或外部执行机制。它们使交易变得可追溯、透明且不可逆转。”


    几乎任何区块链业务应用都涉及智能合约的使用。一个著名的用例是 Cryptokitties（加密猫）。当用户通过投标过程从 Cryptokitties 收藏市场获取独特的虚拟猫时，就会执行智能合约。最高出价者拥有该数字资产。其他
    dapp（去中心化应用）交易也使用了智能合约。


    基于区块链的供应链管理利用智能合约来处理制造商、供应商、批发商和零售商之间的交易。


    在保险行业，想要购买保险的客户可以通过智能合约向保险公司提供个人信息，包括医疗记录等敏感数据。在医疗行业，患者可以通过允许共享医疗记录的智能合约获得更快、更准确的诊断和治疗。


    ## 14.2 组建你的团队


    在构思了适用于你业务的业务用例后，你需要组建团队来启动区块链项目。获得合适的人才对于成功至关重要。你的团队应该由具有业务技能和技术技能的人组成。具有业务技能的人应该看到业务模式的整体，并知道如何执行。他们还必须具备良好的人际交往能力、战略思维、良好的人脉和财务知识。具有业务技能的人应担任
    CEO、CFO、营销经理、业务开发经理等职位。


    具备良好通用 IT 和区块链技能的人同样重要。CTO 必须在 IT 和软件行业拥有多年经验，并对区块链概念和知识有良好的掌握。他或她需要一个


    '
