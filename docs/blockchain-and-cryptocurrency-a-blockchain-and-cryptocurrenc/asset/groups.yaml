    [content]

    ## 6.6 Consensus Protocol


    One key difference between Hyperledger Fabric and other DLT platforms is its support
    for pluggable consensus protocols. It enables the platform to be more effectively
    customized to fit particular use cases and trust models.


    For example, when Hyperledger Fabric is implemented within a single enterprise
    or operated by a trusted authority, fully Byzantine fault tolerant consensus might
    be considered unnecessary excessive drag on performance and throughput. Instead,
    a crash fault tolerant (CFT) protocol is more than adequate. In a multi-party,
    decentralized platform, a more traditional Byzantine fault tolerant (BFT) consensus
    protocol might be more required.


    Another significant difference between Hyperledger Fabric and other DLT platforms
    is that it can implement consensus protocols that do not need a native cryptocurrency
    to incentivize costly mining or to fuel smart contract execution. The avoidance
    of a cryptocurrency reduces some significant risk due to hacking via attack vector.
    Besides, that, the absence of cryptographic mining operations means that the platform
    can be deployed with the same operational cost as other distributed platforms.


    The combination of the differentiating features makes Hyperledger Fabric one of
    the better performing DLT platforms available today both in terms of transaction
    processing and transaction confirmation latency. Besides, that, it enables privacy
    and confidentiality of transactions and the smart contracts (chaincode) that implement
    them.


    ## 6.7 Hyperledger Fabric Network


    Hyperledger Fabric is a permissioned blockchain network that provides ledger services
    to application clients and administrators. It allows multiple organizations to
    collaborate as a consortium to form the network. The permissions to join the network
    are determined by a set of policies that are agreed to by the consortium when
    the network is configured. The network policies may change over time, subject
    to the agreement of the organizations in the consortium.


    The Hyperledger Fabric network comprises the following components:


    - Ledger

    - Peers

    - Ordering service

    - Chaincode (aka smart contract)

    - Channels

    - Membership service provider


    The Hyperledger ecosystem also consists of the client applications that allow
    users to interact with the network. Moreover, the Hyperledger Fabric application
    SDK provides a powerful API for developers to program applications to interact
    with the blockchain network on-half of the users.


    ### 6.7.1 Peers


    The Fabric network is comprised primarily of a set of peers or nodes. Peers maintain
    the state of the network and a copy of the ledger. In addition, they also host
    smart contracts (chaincode).


    There are two different types of peers in Fabric, the endorsing peer, and the
    committing peer. The endorsing peers (aka endorsers) simulate and endorse transactions.
    On the other hand, the committing peers (aka committers) verify endorsements and
    validate transactions before committing transactions to the blockchain. On a separate
    note, the endorsing peers can also commit transactions to the blockchain. Indeed,
    the endorsers are a special kind of committer. However, committers cannot be the
    endorsers. All peers can commit blocks to the distributed ledger.


    ### 6.7.2 Ordering Service


    The ordering service is made up of a cluster of special nodes known as orderers.
    The ordering service accepts the endorsed transactions and specifies the order
    in which those transactions will be committed to the ledger. However, it does
    not process transactions, smart contracts, or maintain the shared ledger.


    ### 6.7.3 The Transaction Workflow


    Let us examine the transaction workflow that involves the client applications,
    the peers and the orderers. By examining the entire transaction workflow, we will
    learn how consensus is reached in the process.


    The transaction flow to reach consensus consists of three phases:


    1. Transaction endorsement

    2. Ordering

    3. Validation and commitment


    # Phase 1 Transaction Endorsement


    Transactions begin with client applications sending transaction proposals to the
    endorsing peers, as shown in the following diagram:


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_86_0.png)


    Figure 6.2 Transaction Flow


    # Phase 2 Transactions Simulation


    At this phase, the endorsers will simulate the proposed transactions, without
    updating the ledger. The endorsers must hold smart contracts to simulate the transaction
    proposals. In the simulation process, the endorsing peers will capture the set
    of Read and Written data, known as **RW Sets**.


    RW sets contain data that that was read from the current world state while simulating
    the transaction, as well as data that would have been written to the world state
    had the transaction been executed. The endorsing peers then sign these RW sets
    and send them back to the client application for use in the next phase of the
    transaction flow, as shown below:


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_87_0.png)


    Figure 6.3 RW Set


    # Phase 3 Ordering


    At this phase, the client application submits the endorsed transactions and the
    RW sets to the ordering service. The ordering service will take the endorsed transactions
    and RW sets, orders them into a block and delivers the block to all committing
    peers.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_88_0.png)


    Figure 6.4 Ordering


    The order of transactions needs to be established to ensure that the updates to
    the world state are valid when they are committed to the network. Unlike the Bitcoin
    blockchain or Ethereum, where ordering occurs through mining, Hyperledger Fabric
    allows organizations to choose the ordering mechanism that best suits that network.


    Hyperledger Fabric provides three ordering mechanisms i.e. SOLO, Kafka, and Simplified
    Byzantine Fault Tolerance (SBFT). However, SOLO is used only for experimentation
    purposes and SBFT has not yet been implemented. Therefore, Kafka is the default
    ordering mechanism for production use. The Kafka mechanism provides a crash tolerant
    solution to ordering.


    # Phase 4 Transaction Validation


    At this final phase, the committing peers validate the transactions by checking
    that the RW sets match the current world state. In addition, they need to ensure
    Read data that existed during the simulation process is identical to the current
    world state. After the committing peers validate the transactions, the transactions
    are then written to the ledger, and world state is updated. Lastly, the committing
    peers notify the client application the results.


    ### 6.7.4 Channels


    In permissionless blockchains like Bitcoin and Ethereum, all peers share and have
    access to the same ledger. However, this kind of blockchain may not be suitable
    for business applications. For example, a supplier may want to set different prices
    for different wholesalers, and he would not want everyone in the supply chain
    to view this information. In this scenario, he or she will prefer to deal with
    different wholesalers separately. To solve this issue, Hyperledger Fabric came
    out with the novel concept of channels that allow private transactions within
    the network.


    Channels partition the Fabric network in such a way that only the stakeholders
    can view the transactions. In this way, organizations can utilize the same network
    while maintaining separation between blockchains. Members of the channel can communicate
    and transact privately. Other members of the network cannot see the transactions
    on that channel. The concept is illustrated in the following diagram:


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_90_0.png)


    Figure 6.5 Fabric Network


    The diagram above shows two channels, channel 1 and channel 2. Each channel has
    its own application, peers, ledger, and smart contract (chaincode). In this example,
    channel 1 has two peers, P1 and P2, and channel 2 also has two peers, P3 and P4.
    Ordering service is the same across any network and channel.


    Application 1 will send transaction proposals to channel 1. P1 and P2 will simulate
    and commit transactions to ledger L1 based on chaincode S1. On the other hand,
    Application 2 will send transaction proposals to channel 2. P3 and P4 will simulate
    and commit transactions to ledger L2 based on chaincode S2.


    Though our example shows peers belonging to two distinct channels, in actual peers
    can belong to multiple networks or channels. Peers that participate in multiple
    channels simulate and commit transactions to different ledgers. In addition, the
    same chaincode can be applied to multiple channels.

    [/content]

