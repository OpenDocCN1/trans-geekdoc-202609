    \ to fulfill a particular task, such as updating the liquidation price. This strategy\
    \ enables risk-mitigating automation without having to store crucial private keys\
    \ online.\n\n## 4. Security\n\n## 4.1 Safe Storage of Crypto Assets\n\nChi will\
    \ implement security industry best practices for defense against cyberattacks\
    \ and bad actors. Strong identity verification and authentication procedures are\
    \ in place to ensure secure operations. Besides that, the vast majority of Chi\
    \ cryptoassets will be stored offline in cold wallets.\n\nChi will at any stage\
    \ hold varying amounts of the 20 coins that form the index it tracks. The majority\
    \ of each of these cryptocurrencies will be stored in cold wallets with a small\
    \ percentage of each currency stored in a wallet on our servers to facilitate\
    \ automatic rebalancing. If rebalancing necessitates moving more of the cryptocurrency\
    \ to these hot wallets will be done manually via interfacing with various cold\
    \ wallets – Chi's portfolio managers will be notified ahead of time to accommodate\
    \ this. The weekly rebalancing period affords more than sufficient time for this\
    \ purpose.\n\nLedger Nano S will be used for the storage of all cryptocurrencies\
    \ it supports. For all cryptocurrencies that are not supported, encrypted USB\
    \ drives will be utilized. These storage devices will be held in secure safe deposit\
    \ boxes with back-up paper wallets stored at separate secure locations. Locations\
    \ are undisclosed due to security considerations. A public audit will confirm\
    \ the presence and safe storage of the USB drives and paper wallets, to be accessible\
    \ for all members. Wallet interactions with Chi will be facilitated through light\
    \ clients.\n\n## 4.2 Multisig Wallet\n\nTo further improve security and increase\
    \ trust among the investors, the best solution is to store crypto assets in a\
    \ multisig wallet.\n\nThe multisig wallet is one where you need control over multiple\
    \ keys to spend from that wallet. The idea with multisig wallets is that multiple\
    \ people can cooperatively control the funds in the wallet. With multisig, it\
    \ allows users to have one Bitcoin address with multiple key holders sign off\
    \ on it\n\nIn the case of Chi, the multisig wallet will be entrusted to a council\
    \ comprising the management team and selected investors. Each member holds his\
    \ private key for signing the wallet. Nobody can withdraw or spend the funds in\
    \ the wallet unless all members agree to do so by using their private keys.\n\n\
    For steps on creating a multisig wallet, please refer our technical guide on multisig\
    \ wallet.\n\n## 5. Funds Allocation\n\nTo maximize profit and minimize risk for\
    \ our investors, 50% of the funds raised will be used to purchase Bitcoins (BTC)\
    \ at the current market value and deposit them in a secure multisig custodian\
    \ wallet to hedge the risk and volatility of the crypto market. Another 25% of\
    \ the funds will be used to invest in Chi Index Fund. The balance 25% will be\
    \ spent on marketing activities.\n\nBitcoin might be a volatile product on the\
    \ current market, but Bitcoin had shown a consistent increment on a yearly basis,\
    \ from the average of USD 144 back in 2013 up to the current average of USD 8000.\
    \ In the current volatility of the market which involves USD value, gold value\
    \ and Bitcoin value, the prices have gone up and down constantly, but Bitcoin\
    \ has shown an upwards trend since its creation back in 2008 (as shown in the\
    \ figure).\n\nThe value of Bitcoin may fluctuate from time to time, but in the\
    \ long run, Bitcoin price will increase in value. Hence, if Bitcoin is held, users\
    \ will earn substantial profit in the future, as shown in the figure below.\n"
  mdcn: "\n根据币安（Binance）的介绍，权威证明（PoA）是一种基于声誉的共识算法，为区块链网络（特别是私有区块链网络）提供实用且高效的解决方案。该术语由以太坊创始人兼前\
    \ CTO Gavin Wood 于 2017 年提出。\n\nPOA 共识算法利用身份的价值，这意味着区块验证者质押的不是代币，而是自己的声誉。因此，POA\
    \ 区块链由预先选定为信任实体的验证节点提供保护。\n\nChi PoA 区块网络采用有限数量的验证者，这使其具有高度的可扩展性。区块和交易由预先批准的验证者验证，他们充当系统的管理员。与\
    \ POW（工作量证明）不同，POA 不需要节点消耗大量的计算资源和电能来维护区块链网络。\n\n与 POW 或 POS 共识算法驱动的区块链网络相比，Chi\
    \ PoA 区块网络具有更高的交易率、更低的延迟以及对受损和恶意节点具有更高的容忍度。高效且安全的 POA 系统将确保加密资金和财务数据的安全。它也足够灵活，可以在\
    \ Chi PoA 区块平台上开发创新的业务应用。\n\n## 3.2 Chi 区块链平台\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_303_0.png)\n\
    \n## Chi 区块链网络\n\nChi 区块链网络由验证节点和对节点组成。只有验证节点有权验证交易并选举新验证者或移除行为错误的验证者。对节点需要帮助维护网络。\n\
    \n如果某些节点同意24/7 托管 Chi 区块链网络并承担额外职责，可以分配主节点（Master node）状态。主节点的作用是确保 Chi 区块链网络的安全和可靠。此外，所有节点将获得\
    \ Chi Token 的激励。\n\n所有节点都通过智能合约进行年度重选，以确保民主和透明。恶意节点将被投票剔除，而表现良好的节点将被重新当选，以保护 Chi\
    \ POA 区块网络的完整性。\n\nChi 区块链网络将托管在如 AWS 等安全企业云服务器上。我们依靠公钥加密、多因素身份验证和私钥的系统隔离来确保最高水平的安全可靠性。\n\
    \n## 3.4 使用 Parity Ethereum 设置 Chi 区块链网络\n\nChi 区块链网络将使用 Parity Ethereum 设置。Parity\
    \ Ethereum 是最快且最先进的以太坊客户端。\n\nParity Ethereum 为关键任务用途而构建：矿工、服务提供商和交易所需要快速同步和最大的运行时间。Parity\
    \ Ethereum 提供了快速且可靠服务的核心基础设施。\n\n- 纯洁、模块化的代码库，便于定制\n- 先进的基于 CLI 的客户端\n- 极小的内存和存储占用\n\
    - 通过 Warp Sync 在几小时而非数天完成同步\n- 模块化设计，便于集成到您的服务或产品中\n\nParity Ethereum 是使用复杂且尖端的\
    \ Rust 编程语言开发的。Parity Ethereum 采用 GPLv3 许可，可满足您所有的以太坊需求。\n\n有关安装 Parity Ethereum\
    \ 和设置 Chi POA 区块链网络的完整指南，请参考 Chi 技术白皮书。\n\n## 3.5 Chi Token 智能合约\n\nChi Token\
    \ 是基于 Solidity 编程语言的智能合约铸造的 ERC20 代币。此处显示的代码为 Chi Management Ltd 的知识产权。改编该代码需要预先同意。\n\
    \n```solidity\npragma solidity ^0.5.0;\ncontract ChiToken {\n  /* 这创建一个包含所有余额的数组\
    \ *\n  mapping(address => uint256) public balanceOf;\n  string public name;\n\
    \  string public symbol;\n  uint8 public decimals;\n\n  /* 使用初始供应代币初始化合约\n  分配给合约创建者\
    \ */\n  constructor(\n    uint256 initialSupply,\n    string tokenName,\n    string\
    \ tokenSymbol,\n    uint8 decimalUnits\n  ) public {\n    balanceOf[msg.sender]\
    \ = initialSupply; // 给创建者所有初始代币\n    name = tokenName; // 设置显示的名称\n    symbol\
    \ = tokenSymbol; // 设置显示的符号\n    decimals = decimalUnits; // 设置显示的小位数\n  }\n\n\
    \  /* 发送代币 */\n  function transfer(address _to, uint256 _value)\n  returns (bool\
    \ success) {\n    require(balanceOf[msg.sender] >= _value); // 检查发送者余额是否足够\n \
    \   require(balanceOf[_to] + _value >= balanceOf[_to]);\n\n    // 检查溢出\n    balanceOf[msg.sender]\
    \ -= _value;\n    // 从发送者处扣除\n    balanceOf[_to] += _value;\n    // 向接收者加上相同金额\n\
    \    return true;\n  }\n}\n```\n\n## 3.6 Chi Token 上市\n\nChi Token 将列在多个交易所。交易开始时，我们的网站将提供完整的交易所列表。随着时间的推移，还将增加交易所。交易将通过与交易所集成\
    \ API 实现自动化。\n\nChi Token 的清算价格将通过 Chi 开发的的服务确定。清算价格更新自动化是业务顺利运行的重要部分；然而，由于需要在线存储私钥，自动化也可能带来安全风险。我们通过实施两级权限系统来规避这一风险，通过多个地址仅为完成特定任务（如更新清算价）分配必要的权限。这种策略实现了降低风险的自动化，而无需在网上存储关键私钥。\n\
    \n## 4. 安全\n\n## 4.1 加密资产的安全存储\n\nChi 将实施安全行业的最佳实践来防御网络攻击和恶意行为。已建立强有力的身份验证和认证程序以确保操作安全。此外，绝大多数\
    \ Chi 加密资产将离线存储在冷钱包中。\n\nChi 在任何阶段持有构成其追踪索引的 20 种代币的不同数量。每种加密货币的大部分将存储在冷钱包中，每种货币的一小部分将存储在我们的服务器钱包中，以便于自动再平衡。如果重新平衡需要移动更多加密货币到这些热钱包，将通过与各种冷钱包交互手动完成——Chi\
    \ 的投资组合经理将提前通知以配合执行。每周再平衡期为该目的提供了充足的时间。\n\nLedger Nano S 将用于存储其支持的所有加密货币。对于所有不支持的加密货币，将使用加密\
    \ USB 盘。这些存储设备将存放在安全的保险箱中，备份的纸质钱包将储放在不同的安全地点。出于安全考虑，地点不公开。公开审计将确认 USB 盘和纸质钱包的存在及安全存储，供所有成员访问。钱包与\
    \ Chi 的交互将通过轻量客户端实现。\n\n## 4.2 多签名钱包\n\n为了进一步提高安全性并增加投资者之间的信任，最佳解决方案是将加密资产存储在多签名钱包（multisig\
    \ wallet）中。\n\n多签名钱包需要多个密钥控制才能从中花费资金。多签名钱包的理念是人员可以协作控制钱包中的资金。通过多签名，允许用户拥有一个由多个密钥持有者签署的比特币地址。\n\
    \n在 Chi 的情况下，多签名钱包将委托给由管理团队和选定投资者组成的委员会。每个成员持有一个签署钱包的私钥。除非所有成员都同意使用其私钥，否则无法提取或花费钱包中的资金。\n\
    \n有关创建多签名钱包的步骤，请参考我们的多签名钱包技术指南。\n\n## 5. 资金分配\n"
