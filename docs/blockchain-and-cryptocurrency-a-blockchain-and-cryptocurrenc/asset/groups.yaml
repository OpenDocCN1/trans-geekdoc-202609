    # 18.2.5 EventChain


    EventChain is a global Smart Ticketing blockchain project that will allow events
    worldwide to sell SmartTickets through a peer-to-peer network, solving the issues
    of the centralized event ticketing industry.


    It implements the EventChain token network for event management to ensure faster
    transactions, indisputable ticket vouchers, transparency from event hosts and
    fully flexible and programmable SmartTickets. With the use of the EVC token, smart
    contract code, and the Ethereum blockchain, EventChain’s transaction network brings
    increased accountability, transparency, and security to event ticketing.


    To fix excessive ticket fees, EventChain is distributing EVC tokens, a digital
    ERC20 token created for buying, selling, and programming SmartTickets on the Ethereum
    distributed network. EventChain claims that their transaction fees are much lower,
    and the transaction confirmation speed is near seconds.


    # 18.2.6 Event Management and Ticketing Platform - A Conceptual Model


    After examining the above use cases, I propose a conceptual model that utilizes
    a similar concept to develop a blockchain-based event management and ticketing
    platform. Below is a'
