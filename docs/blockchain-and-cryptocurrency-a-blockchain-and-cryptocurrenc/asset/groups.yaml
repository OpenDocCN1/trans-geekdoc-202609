    # 2.7 如何实现工作证明？


    挖矿涉及产生一个值小于目标值的哈希的过程。当找到这个哈希值时，它被称为有效哈希，因此就实现了工作证明。


    挖矿算法使用一种称为 nonce（随机数）的计数器，通过 SHA256 加密函数生成哈希。哈希算法在给定相同输入时，总是会产生相同长度的任意长度数据。通过两个不同的输入计算出相同的哈希是不可能的。同样无法提前预测任何给定数据的输出。


    nonce 的值初始化为 0。挖矿就是寻找 nonce，它是我们每次运行哈希函数时唯一变化的输入。目标是找到一个 nonce 值，使其生成的哈希值低于目标值。因此，挖矿节点可能需要尝试数十亿或万亿个
    nonce 值才能获得有效哈希。正如你所看到的，挖矿就像玩老虎机，无法预测你何时会中奖。


    证明找到的 nonce 确实产生了有效哈希是非常容易的。所有信息都是公开的，网络中的每个人都可以运行哈希函数并确认哈希是否有效。因为同样无法预测 nonce
    将是什么，所以它也证明了矿工确实实现了工作证明。


