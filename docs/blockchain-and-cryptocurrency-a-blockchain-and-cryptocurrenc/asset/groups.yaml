    # Chapter 19


    # Developing an Ethereum Cryptocurrency on Windows


    You can develop your very own cryptocurrency using your laptop that runs Windows
    operating system. This article a step by step guide for newbies to easily developing
    and deploying a token using the sample code provided by the Truffle framework.
    Truffle is a world-class development environment, testing framework and asset
    pipeline for blockchains using the Ethereum Virtual Machine (EVM).


    This is a step-by-step guide for developing an Ethereum-based cryptocurrency with
    the following requirements.


    To start the project, we need to set up a development environment with the following
    requirements:


    +   * A code editor

    * Source control

    * Unit tests

    * Debugging


    For code editor, we use Visual Studio code for the following reasons:


    +   * VS Code integrates very well with Git for source control. Git is currently
    the best choice for source control.

    * VS Code works well with Truffle framework that manages unit tests.

    * VS Code works well with Truffle for debugging'
  - '[PAGE 208]


    Besides that, Visual Studio code is a great tool for editing Solidity smart contracts
    and is available on Windows, Mac & Linux.


    # I. Installation of the Packages


    Step1: Install Chocolatey


    Launch PowerShell as administrator. In PowerShell, enter the following command:


    ```

    Set-ExecutionPolicy Bypass

    ```


    *The Set-ExecutionPolicy changes the user preference for the Windows PowerShell
    execution policy.


    *Bypass-Nothing is blocked and there are no warnings or prompts. This execution
    policy is designed for configurations in which a Windows PowerShell script is
    built in to a larger application or for configurations in which Windows PowerShell
    is the foundation for a program that has its own security model.


    * Why Chocolatey-You’ve never deployed software faster than you will with Chocolatey.”
    -Rob Reynolds. Chocolatey is a software management automation.


    Install Chocolatey by entering the following code:


    ```

    iex ((New-Object System.Net.WebClient).DownloadString(''https://chocolatey.org/install.ps1''))

    ```


    *https://chocolatey.org/docs/installation


    *iex-invoke expression-The Invoke-Expression cmdlet runs a specified string as
    a command and returns the results of the expression or command. Without Invoke-Expression,
    a string'
  - '[PAGE 209]


    submitted at the command line would be returned (echoed)

    unchanged.


    *A cmdlet (pronounced "command-let") is a lightweight Windows

    PowerShell script that performs a single function.


    +   * https://chocolatey.org/install.ps1 downloads the Chocolatey

    installation zip file, unzips it and continues the installation by

    running a scripts in the tools section of the package.


    After installation completed, close and reopen PowerShell as

    administrator again.


    # Step 2 Install Visual Studio Code, Git and Node.Js


    Enter the following code in PowerShell:


    ```

    choco install visualstudiocode -y

    choco install git -y

    choco install nodejs -y

    ```


    +   *Git(ga/at/[7]) is a version control system for tracking changes

    in computer files and coordinating work on those files among

    multiple people. It is primarily used for source code

    management in software development,[8] but it can be used to keep

    track of changes in any set of files. As a distributed revision

    control system, it is aimed at speed, data integrity] and support for

    distributed, non-linear workflows.


    +   *Node.js is a JavaScript runtime built on Chrome’s V8 JavaScript

    engine.


    +   *As an asynchronous event driven JavaScript runtime, Node is

    designed to build scalable network applications. In programming,

    asynchronous events are those occurring independently of the main

    program flow. Asynchronous actions are actions executed in a non-'
  - '[PAGE 210]


    blocking scheme, allowing the main program flow to continue

    processing


    Close and reopen PowerShell before proceeding to the next step


    # Step 3 Install Truffle Framework


    Truffle is a world class development environment, testing

    framework and asset pipeline for Ethereum, aiming to make life

    as an Ethereum developer easier. Truffle website is as follows:

    (https://truffleframework.com/docs)


    We use npm (Node Package Manager) to install Truffle

    Framework. Enter the following code:


    ```

    npm install -g truffle

    ```


    You can check the version of installed packages with the

    following code:


    ```

    node -v

    npm -v

    truffle --version

    ```


    The output is as shown in Figure 19.1.'
