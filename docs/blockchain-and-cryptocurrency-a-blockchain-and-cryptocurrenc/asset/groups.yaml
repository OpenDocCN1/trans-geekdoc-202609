  mdcn: "\n现在启动 Remix IDE。你可以点击 Remix IDE 最左侧的小 `+` 按钮来添加你自己的智能合约。将弹出一个新的对话框，你可以创建一个新的\
    \ Solidity 文件。\n\n创建新文件后，新窗口将在新标签页中出现并显示你的新文件。该文件也会显示在 IDE 浏览器下方的侧边栏中。\n\n现在，让我们在\
    \ Remix IDE 中输入以下代码创建一个新合约。\n\n```sol\npragma solidity >=0.4.22 <0.7.0;\ncontract\
    \ myContract {\n    string private name;\n    uint private age;\n}\n```\n\n合约内部的第一行声明了一个字符串类型的变量\
    \ `name` 和一个名为 `age` 的无符号整数变量。虽然我们已经创建了一个简单的智能合约，尽管它目前还没有执行任何功能。如果你愿意，可以编译并部署它。现在，让我们给智能合约添加一些函数。\n\
    \n```sol\npragma solidity >=0.4.22 <0.7.0;\ncontract myContract {\n    string\
    \ private name;\n    uint private age;\nfunction setName(string memory newName)\
    \ public {\n    name = newName;\n}\n```\n\n```sol\nfunction getName() public view\
    \ returns (string memory){\n    return name;\n}\n\nfunction setState(uint newAge)\
    \ public{\n    age=newAge;\n}\n\nfunction getAge() public view returns (uint){\n\
    \    return age;\n}\n```\n\n我们创建了 `setName` 函数以允许用户输入一个字符串值。将修饰符设置为 `public`，因为我们希望允许所有人看到它。否则，当你部署合约时，将无法在\
    \ Remix IDE 中看到该函数。\n\n为了返回用户输入的 `name` 值，我们创建了 `getName` 函数。\n\n`public view\
    \ returns` 中的 `view` 关键字是 `constant` 的替代方案。它表示该函数不会以任何方式更改存储状态。\n\n接下来，我们通过声明一个无符号整数类型的参数\
    \ `newAge` 来创建了 `setState` 函数。`setState` 函数将在你在部署合约时允许用户输入一个整数值。\n\n为了返回用户输入的\
    \ `age` 值，我们创建了 `getAge` 函数。\n\n现在编译并部署 Remix IDE，输出如图 17.1 所示。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_174_0.png)\n\
    \n图 17.1\n\n当你部署合约时，一笔交易将你的钱包地址执行到合约。在此过程中会收取 Gas 费（燃料费）。你可以在 Etherscan 上查看该交易，如下：\n\
    \n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_175_0.png)\n\n图 17.2\n\n当你点击 `setName`\
    \ 函数时，也会发生一次交易。在点击 `getName` 函数之前，你需要等待交易完成。你可以看到，无论在 `setName` 框中输入什么，都会出现在 `getName`\
    \ 框中。你可以对 `setAge` 和 `getAge` 函数执行同样的操作。输出如图 17.3 所示。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_176_0.png)\n\
    \n## 17.4 使用 Solidity 创建加密货币\n\n凭空创造硬币是完全可能的。此外，任何人都可以互相发送硬币，而无需通过用户名和密码注册——你只需要一个以太坊密钥对。\n\
    \n在本节中，我们将向你展示如何使用智能合约创建一个加密货币\n\n以下是代码：\n\n```sol\npragma solidity >=0.4.22 <0.7.0;\n\
    contract MyCurrency {\n    // \"public\" 关键字允许外部账户读取变量\n    address public minter;\n\
    ```\n\n```sol\nmapping (address => uint) public coinBalances;\n\n// 得益于事件，轻客户端可以高效地响应变化。\n\
    event Sent(address from, address to, uint sum);\n// 此构造函数的代码仅在合约创建时运行一次。\nfunction\
    \ myCoin() public {\n    minter = msg.sender;\n}\nfunction mint(address receiver,\
    \ uint sum) public{\n    if (msg.sender != minter) return;\n    coinBalances[receiver]\
    \ += sum;\n}\nfunction send(address receiver, uint sum) public {\n    if (coinBalances[msg.sender]\
    \ < sum) return;\n    coinBalances[msg.sender] -= sum;\n    coinBalances[receiver]\
    \ += sum;\n    emit Sent (msg.sender, receiver, sum);\n}\n```\n\n`address public\
    \ minter;` 这一行声明了一个公共可访问的 `address` 类型状态变量。`address` 类型是一个 160 位的数值，不允许任何算术操作。它适用于存储合约地址或属于外部人员的密钥对地址。`public`\
    \ 关键字会自动生成一个函数，允许你从合约外部访问状态变量的当前值。没有这个关键字，其他合约将无法访问该变量。\n\n下一行 `mapping (address\
    \ => uint) public coinBalances;` 也创建了一个公共状态变量，但它是一个更复杂的数据类型。`mapping` 类型将地址映射到无符号整数。`mappings`\
    \ 可以被看作哈希表，它们在逻辑上是虚拟初始化的，使得每个可能的键都存在，并映射到一个字节表示全为零的值上。不过，这个类比并不过分，因为既无法获取映射的所有键列表，也无法所有的值的列表。`mapping`\
    \ 类型用于将地址变量映射到无符号整数。\n\n`event Sent(address from, address to, uint amount);` 这一行声明了一个事件，该事件在\
    \ `user` 函数的最后一行被触发。用户界面（当然还有服务器应用程序）可以以很低的成本监听区块链上发出的这些事件。一旦触发，监听器也将收到来自 `from`、`to`\
    \ 和 `amount` 的参数，这使得追踪交易变得简单。\n\n特殊函数 `Coin` 是构造函数，它在合约创建期间执行，之后无法被调用。它永久存储了创建合约的人的地址：`msg`\
    \ 是一个魔法全局变量，包含了允许访问区块链的某些属性。`msg.sender` 始终是当前（外部）函数的来源地址。\n\n最后，与合约共存并可以被用户和合约共同调用的函数是\
    \ `mint` 和 `send`。如果 `mint` 被创建合约账户以外的任何人调用，则什么都不会发生。相反，`send` 可以被任何人（已经拥有一些这些硬币的人）用于向他人发送硬币。编译并运行合约，输出如图\
    \ 17.4 所示。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_179_0.png)\n\n图 17.4\n\n\
    # 第 18 章\n\n## 去中心化应用 (DApps)\n\nDApp 是去中心化应用的缩写。DApp 的后端运行在去中心化的点点网络或 DLT 网络上。与之对比的是后端运行在中心化服务器上的应用。DApp\
    \ 的前端可以使用去中心化存储（如 Swarm 或 IPFS）。DApp 可以使用任何语言编程，但对于以太坊平台建议使用 Solidity。DApp 始终是前端和智能合约的结合。我们将讨论一个关于如何\n\
    \n### 18.1 活动管理与票务 DApp\n\n活动管理和票务行业是一个巨大的市场，特别是活动管理软件市场。Markets Insider 报告，活动管理软件市场预计从\
    \ 2019 年的 57 亿美元增长到 2024 年的 114 亿美元，复合年增长率（CAGR）为 15%（2019-2024 年）。\n\n"
