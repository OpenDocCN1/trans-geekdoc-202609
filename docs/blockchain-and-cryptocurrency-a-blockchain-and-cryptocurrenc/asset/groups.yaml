    区块链是过去十年最受关注的技术。尽管区块链技术被过度营销，但它具有颠覆许多现有行业的潜力。此外，初创公司甚至政府已经在尝试基于区块链的应用。


    随着我们受到社交媒体、网络门户和广告的轰炸，区块链已悄悄进入我们的日常生活。结果是，今天几乎每个人都在谈论加密货币，但大多数人仍然不理解加密货币的技术——区块链。因此，我写了这本书，希望赋能每一个人。这本书是一份全面的指南，涵盖了基础和高级主题，例如：


    - 在加密钱包中安全地存储你的加密货币

    - 智能合约

    - dApps

    - 企业级区块链框架（如 Hyperledger 和 Corda）

    - 如何进行 ICO 和 IPO

    - 去中心化金融 (DeFi)

    - 用于金融服务的区块链

    - 用于供应链管理的区块链


    利用区块链构建数字政府还涵盖了技术主题，例如：

    - 使用 Plasma 可扩展性

    - 在 IPFS 上存储区块链数据

    - 使用 Solidity 编写智能合约

    - 开发 DApps

    - 开发 ERC-20 代币

    - 设置私有以太坊区块链

    - 创建多签名钱包

    - 使用 Hyperledger Fabric 创建汽车供应链管理区块链平台


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_327_0.png)


    Liew Voon Kiong 博士拥有数学学士学位、管理学硕士学位和工商管理博士学位。


    Liew 博士是区块链行业公司争抢的区块链架构师。他曾主导了东南亚某孵化器中心原生加密货币的设计与开发，并通过 IEO 活动成功让其在知名交易所上市。他还担任一家管理加密货币对冲基金的澳大利亚区块链公司的首席战略官。Liew
    博士是一位区块链研究员，他开发了多个应用用例，例如用于汽车和纺织行业的区块链供应链管理、构建区块链驱动的数字政府、活动和票务 DApps 等。他擅长搭建私有以太坊网络等区块链网络，使用
    Solidity 并创建 DApps。他还创建了一个名为《区块链：人人皆指南》（http://www.blockchainguide.biz/）的区块链博客。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_327_1.png)


