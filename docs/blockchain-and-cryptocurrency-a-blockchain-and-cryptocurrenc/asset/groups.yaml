    new financial products that cater to the needs of the crypto market.


    Indeed, cryptocurrencies are rapidly gaining traction with the public. According
    to CoinMarketCap, the total market cap for all cryptocurrencies reached an amazing
    $739 billion in January 2018. Though the market cap dropped to a low $113 billion
    in December 2018 due to the bear market, it rebounded strongly in 2019 to a figure
    between $250 billion to $350 billion. Though much of this value has been generated
    by individual traders, it is also largely the result of large investment funds.
