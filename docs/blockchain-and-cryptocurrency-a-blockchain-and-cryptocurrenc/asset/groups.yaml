    ## 第 4 章


    ## 存储您的加密货币


    自从中本 Nakamoto于2009年推出比特币以来，由于比特币价格的指数级增长，将比特币作为投资工具正变得越来越流行。以太坊和山寨币的出现进一步将加密货币投资的热潮推向新的高度。


    随着越来越多的人购买和交易加密货币，安全地存储数字货币已成为首要考虑的问题。交易所频繁发生黑客攻击导致数十亿美元加密资产损失，在加密货币持有者中引发了恐慌潮。因此，在投资加密货币之前，你必须采取的第一步是选择安全的钱包。


    然而，交易加密货币并不像交易法币那样简单。加密货币的技术难题对许多人来说可能是一场噩梦。由于加密货币由去中心化平台管理，不受任何第三方实体干扰，交易中的任何错误都可能导致你的加密资产永久丢失。相反，如果传统交易出现任何问题，你可以向银行或第三方实体寻求帮助以追回资金。


    此外，存储加密货币比存放法币更困难。你需要特殊的钱包来存储加密货币，并使用由 12 个或 24 个单词助记短语组成的密码，这很难记忆。更糟糕的是，如果你丢失了助记短语，你没有任何办法找回资金。另一方面，如果你忘记了银行账户密码，你可以点击“忘记密码”并通过电子邮件重置密码。


    为了缓解你的恐惧，我想讨论一下如何选择钱包来安全地存储你的加密货币。


    ### 4.1 加密钱包


    为了存储、发送和接收你的加密货币，你必须使用加密钱包。加密钱包是一种安全的数字钱包，用于存储、发送比特币以及其他数字货币。它是一种允许你监控和执行加密货币交易的软件。技术上讲，加密钱包通过节点连接到区块链，并使用称为简化支付验证（SPV）的方法来验证交易。大多数加密货币都有官方钱包，或者一些官方推荐的第三方钱包。


    加密钱包实际上并不在钱包中存储加密货币。它是一个用于存储加密货币公钥和私钥地址、加密货币结算以及加密货币交易的支持系统。有时该系统甚至包括整个区块链的会计和维护。实际金额基于区块链的最终记录结果。


    ### 4.2 加密钱包的类型


    由于加密货币的快速发展，已经出了不同类型的加密钱包以应对各种使用场景。


    根据去中心化程度，加密钱包可以分为全节点钱包、轻钱包和中心化钱包。


    在私钥存储方式方面，加密钱包可以分为冷钱包和热钱包。


    #### 4.2.1 全节点钱包


    这种钱包必须安装软件。安装后，它将与整个区块链同步并存储整个区块链，因此当新钱包开始同步时，它必须从第一条数据开始下载，这将花费几小时到几天的时间，并消耗大量的存储空间和流量。这种钱包也被称为全节点。以太坊钱包全节点钱包之一。


    #### 4.2.2 热钱包


    热钱包是指在线并通过节点连接到区块链的加密钱包。热钱包通常设计为网页。在网站生成私钥后，私钥由个人保管。当你以后想访问钱包时，必须输入私钥。网站不负责为用户保存私钥。


    热钱包的一大类被称为 SPV 钱包（简化支付验证钱包），也称为轻钱包。这种钱包只存储私钥和结算数据，不存储整个区块链，因此它占用的资源较少，更适合移动设备。最常用的
    SPV 钱包网页版是 MetaMask，它存储以太坊和 ERC20 代币。对于比特币，SPV 钱包的一个很好的例子是 Electrum，它是最好的比特币钱包之一。你可以轻松从
    Google Play 商店安装 Electrum 的移动版。它允许你创建标准钱包或多签名钱包。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_61_0.png)


    图 4.1


    #### 4.2.3 中心化钱包


    中心化钱包也称为托管钱包，分为两种类型：


    - **在线钱包**：通常设计为网页，同时保留你的私钥。此类钱包的风险较高，因为存储你的私钥等同于在你的私钥下存储加密货币资产。一个例子是 Coinbase。


    - **交易所钱包**：每个交易所都会提供与加密货币对应的钱包地址。这种钱包保留用户的私钥，资金只能通过交易所机制提取。示例包括币安（Binance）、火币（Huobi）、Luno
    等。


    #### 4.2.4 冷钱包


    钱包也被称为离线钱包。冷钱包通常依赖“冷”设备（非网络电脑、手机、硬件钱包、纸钱包等）来确保加密货币私钥的安全性。它使用二维码通信来防止私钥连接到网络，从而避免私钥被盗的风险。然而，冷钱包可能仍面临物理安全风险（如电脑丢失、损坏等）。


    硬件钱包是物理设备，在加密设备中离线存储加密货币的公地址和私钥。它是带有 OLED 屏幕的物理设备，可以连接到电脑或手机进行导航。硬件钱包的价格通常在 70-150
    美元之间，但与其价值相比仍然便宜。两个最流行的硬件钱包是 Ledger 和 Trezor。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_63_0.png)


    图 4.2 Trezor 钱包


    对于更便宜的选择，可以使用纸钱包。为了将公钥和私钥生成为二维码，可以使用在线生成器。最好的是 bitaddress.org。生成钱包非常，只需访问网站，选择你想创建的地址数量并点击生成按钮。地址就会生成。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_64_0.png)


    图 4.3


    要生成以太坊纸钱包，访问以下网站：

    https://generatepaperwallet.com/ethereum/index.html


    在页面上随机移动鼠标生成地址。


    ## 你的以太坊私钥


    安全保存不要与任何人共享


    0xa6bd830cf6913ceef4b8e110c3973bfe42ecbb1a8b9c3ee01ec4cb15ee678


    - cool panda anxiety sing

    - action wet merry capable

    - feel elk, fashion radar

    - puzzle unaware oxygen thrive

    - category shock veteran

    - tank street provide angry


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_65_0.png)


    0x9ca7b4fddb6469fae9df32d708d2cdef4f4b0b5a278


    图 4.4


    等等，基本上，你可以选择在交易所钱包、热钱包或冷钱包中存储你的加密货币。所有的钱包都有其优缺点。决定使用哪种钱包始终是便利性和安全性之间的权衡。


