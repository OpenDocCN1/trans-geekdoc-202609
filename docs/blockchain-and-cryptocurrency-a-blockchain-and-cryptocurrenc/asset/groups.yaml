    \ source files for our smart contracts. There is an important contract in here\
    \ called Migrations.sol, which we will discuss later.\n- migrations/: Truffle\
    \ uses a migration system to handle smart contract deployments. Migration is an\
    \ additional special smart contract that keeps track of changes.\n- test/: Contains\
    \ both JavaScript and Solidity tests for our contracts.\n- Truffle.Js: Truffle\
    \ Configuration File.\n\n# Step 3 writing the smart contract\n\nWe shall write\
    \ the smart contract that will act as the backend logic and storage.\n\nCreate\
    \ a new file named Adoption.sol in the contracts/ directory.\nTo save time, please\
    \ download the file from:\n\nhttp://javascript-tutor.net/blockchain/download/contracts/Adoption.sol\n\
    \nAdoption.sol\n\n```solidity\npragma solidity ^0.4.24;\ncontract Adoption {\n\
    \    //array of 16 addresses, 20 bytes\n    address[16] public adopters;\n// Adopting\
    \ a pet\n    function adopt(uint petId) public returns (uint) {\nrequire(petId\
    \ >= 0 && petId <= 15);\nadopters[petId] = msg.sender;\nreturn petId;\n}\n// Retrieving\
    \ the adopters\nfunction getAdopters() public view returns\n(address[16]) {\n\
    \  return adopters;\n}\n}\n```\n\n# Step 4 Compiling and Migrating the Smart Contract\n\
    \nNow that we have the smart contract, we shall proceed to compile and migrate\
    \ it.\n\nTruffle has a built-in developer console known as Truffle Develop, which\
    \ generates a development blockchain that we can use to test and deploy the smart\
    \ contract. It can also run Truffle commands directly from the console.\n\nWe\
    \ need to compile the smart contract written in Solidity bytecode for the Ethereum\
    \ Virtual Machine (EVM) to execute. Think of it as translating our human-readable\
    \ Solidity into something the EVM understands. In a terminal, make sure you are\
    \ in the root of the directory that contains the DApp and type:\n\ntruffle compile\n\
    \nThe Output\n\nCompiling ./contracts/Migrations.sol...\n\nCompiling ./contracts/Adoption.sol...\n\
    \nWriting artifacts to ./build/contracts\n\nNow that we have successfully compiled\
    \ our contracts, it's time to migrate them to the blockchain! Migration is the\
    \ deployment script meant to alter the state of the application's contracts, moving\
    \ it from one state to the next. For the first migration, you might just be deploying\
    \ new code, but over time, other migrations might move data around or replace\
    \ a contract with a new one. By the way, there is one JavaScript file already\
    \ in the migrations/ directory: **1_initial_migration.js**. This file handles\
    \ deploying the **Migrations.sol** contract to observe subsequent smart contract\
    \ migrations and ensures we do not double-migrate unchanged contracts in the future.\
    \ Now let us create our new migration script.\n\nCreate a new file 2_deploy_contracts.js\
    \ in the migrations/directory. To save time, download the file from the following\
    \ link:\n\nhttp://javascript-tutor.net/download/contracts/2_deploy_contracts.js\n\
