    Dai）和尼克·萨博（Nick Szabo）等倡导者提出的。实现去中心化数字货币面临的最大问题是双重花费（double spending）。双重花费是一个潜在问题，即同一数字货币可以被多次花费。


    众所周知，我们可以向任何人发送数字资产的任意电子副本。这包括发送电子邮件、文档、音乐文件、视频文件等。然而，我们无法对数字货币这样做。如果你用现金向某人付款，钱的价值就转移到了另一方，钱就不再属于你。但如果你向某人发送数字货币，你仍然可以保留相同的金额并将其发送给其他人。事实上，你可以发送数字货币副本的数量没有限制。


    戴健是一位计算机工程师和密码朋，他于 1998 年发表了一篇名为《b-money：一种匿名的、分布式电子现金系统》（b-money, an anonymous,
