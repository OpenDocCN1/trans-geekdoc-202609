    are instructions for the compiler about how to treat the source code.


    A contract in the sense of Solidity is a collection of code (its functions) and
    data (its state) that resides at a specific address on the Ethereum blockchain.
    The line uint storedData; declares a state variable called storedData of type
    uint (unsigned integer of 256 bits) can be queried and altered by calling functions
    of the code that manages the database. In the case of Ethereum, this is always
    the owning contract. And in this case, the functions set and get can be used to
    modify or retrieve the value of the variable.


    To access a state variable, you do not need to use the prefix that is commonly
    used in other programming languages. This is just a simple contract that does
    not do much yet apart from allowing anyone to store a single number. This number
    is accessible by anyone in the world without a feasible way to prevent you from
    publishing this number. Of course, anyone could just set again with a different
    value and overwrite your number. However, the number will still be stored in the
    history of the blockchain.


    # 3.2.5 Decentralized Applications (DApps)


    DApp is an abbreviation for decentralized application. A DApp has its backend
    code running on a decentralized peer-to-peer network such as the Ethereum blockchain
    network. On the contrary, an app''s backend code is running on centralized servers.


    A DApp can have frontend code and user interfaces written in any language that
    can make calls to its backend. Furthermore, its frontend can be hosted on decentralized
    storage such as Swarm or IPFS.'
