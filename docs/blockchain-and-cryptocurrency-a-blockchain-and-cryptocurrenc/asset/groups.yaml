    but rather randomly. At a certain period, there may be m transactions while another
    period there may be n transactions, where m>n or n<m. The transaction rate can
    be determined by a mathematical process known as the Poisson Point Process. The
    Poisson Point Process model is used to analyze random events, such as the arrival
    of customers at a store, phone calls at a call center or occurrence of earthquakes,
    distributed in time.


    The transaction rate may be calculated based on the simplified Poisson Point Process
    formula as follows:


    ```

    N = λ

    ```


    N is the number of transactions and t is the time unit. λ is a constant. For example,
    if we set λ = 5, and time unit = 10 (the unit could be in milliseconds or seconds
    etc.), the number of transactions occurring in a 10-unit interval is 5×10 = 50.


    Setting a suitable value of λ is crucial to maintaining the coherence of the Tangle
    structure. If we set the value of λ to be exceedingly small, let us say 0.1, and
    the number of transactions remains at 50, the time interval will be 50 ÷ 0.1 =
