    Therefore, it is not viable to store large data files like images and videos on
    the blockchain. Is there a possible solution to solve the storage issue? Yes,
    there are quite a few solutions but the most promising one is IPFS.


    ### 15.1 What is IPFS?


    IPFS or Interplanetary File System is an innovative open-source project created
    by the developers at Protocol Labs. It is a peer-to-peer filesharing system that
    aims to change the way information is distributed across a wide area network.
    IPFS has innovated some communication protocols and distributed systems and combine
    them to produce a unique file-sharing system.


    The current HTTP client-server protocol is location-based addressing which faces
    some serious drawbacks. First, location-based addressing consumes a huge amount
    of bandwidth, and thus costs us a lot of money and time. On top of that, HTTP
    downloads a file from a single server at a time, which can be slow if the file
    is big. In addition, it faces single point of failure. If the webserver is down
    or being hacked, you will encounter 404 Not Found error. Besides that, it also
    allows for powerful entities like the governments to block access to certain locations.


    On the contrary, IPFS is content-based addressing. In the IPFS network, you can
    get the file from the nearest node. This way, there is no single point of failure.
    If a node is down, the files are still available on other nodes. IPFS will overcome
    the HTTP weaknesses as it is decentralized. Furthermore, it is almost impossible
    for powerful entities to block access to the files.


    ### 15.2 Blockchain and IPFS


    IPFS is the perfect match for the blockchain. As I have mentioned, the blockchain
    is inefficient in storing large amounts of data because all the hashes need to
    be calculated and verified. Therefore, instead of storing data on the blockchain,
    we simply store the hash of the file. This way, we enjoy the decentralized peer-to-peer
    properties of IPFS.


    One of the real-world use cases of blockchain and IPFS is Nebulis. It is a new
    project exploring the concept of a distributed DNS that supposedly never fails
    under an overwhelming request. Nebulis uses the Ethereum blockchain and the Interplanetary
    File System (IPFS), a distributed alternative to HTTP, to register and resolve
    domain names. We shall see more integration of Blockchain and IPFS in the future.


    ## Chapter 16 Plasma-The Solution for Security and Scalability


    ### 16.1 The Scalability Issue


    Blockchain always faces the trade-off issue between security and scalability.
    Though their PoW consensus protocol guarantees near perfect security, it also
    slows down the processing speed significantly. Currently, the Ethereum processing
    speed is 15 transactions per second while Bitcoin is 7 transactions per second.
    Both platform’s processing capacities are nowhere near Visa’s processing speed
    of 45,000 transactions per second.


    Furthermore, the increase in the number of dApps deployed on the main Ethereum
    chain has caused congestion and slows down transactions tremendously. One of the
    most famous cases is Cryptokitties, it clogged up the Ethereum network in just
    a few weeks of deployment due to its unprecedented popularity.


    ### 16.2 Plasma


    Plasma is a system that comprises the main blockchain and the ‘child blockchains’
    that branch out from the main blockchain(aka parent blockchain or root blockchain).
    The child blockchains can co-exist but function independently from the parent
    chain and each other.

