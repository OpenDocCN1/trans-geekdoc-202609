    ```\n\nThe output is as shown in Figure 19.1.\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_211_0.png)\n\
    \nFigure 19.1\n\n## II. Configuring VS Code for Ethereum Blockchain Development\n\
    \n### Step 1 Choose the Folder for Your Project\n\nChoose a folder you prefer\
    \ for your project and enter the following code:\n\n```bash\nmkdir TruffleTest;\
    \ cd TruffleTest; code .\n```\n\nThe final command in the chain is \"Code .\"\
    , which opens an instance of Visual Studio Code in the folder from which the command\
    \ is executed.\n\n### Step 2 Install Solidity in The Vs Code IDE\n\nIn the VS\
    \ Code IDE, search for Solidity and install it\n\n### Step 3 Install Material\
    \ Icon Theme\n\nIn the VS Code , install Material Icon Theme.\n\nNow you have\
    \ the VS integrated with PowerShell IDE for Ethereum Blockchain development.\n"
  mdcn: "\n从那里，我们像上面一样获取部署后的合约，并将实例存储在 `adoptionInstance` 中。但这次，我们将发送一个交易（transaction）而不是调用（call）。交易需要一个“发送方”（from）地址并带有相关的费用。这种以\
    \ Ether 支付的费用称为 gas（燃料费）。gas 费用是在在智能合约中执行计算和/或存储数据的费用。我们通过执行 `adopt()` 函数来发送交易，并传入宠物的\
    \ ID 以及一个包含账户地址的对象（该地址我们之前存储在 `account` 中）。\n\n发送交易的结果是一个交易对象。如果没有错误，我们就继续调用 `markAdopted()`\
    \ 函数，使 UI 与我们新存储的数据同步。\n\n## 步骤 10 在浏览器中与 DApp 交互\n\n在浏览器中与我们的 DApp 交互最简单的方法是通过\
    \ MetaMask，这是一个适用于 Chrome 和 Firefox 的浏览器扩展。\n\n在你的浏览器中安装 MetaMask。安装完成后，你将在地址栏旁边看到\
    \ MetaMask 的狐狸图标。点击该图标，你将看到此屏幕：\n\n在 MetaMask 初始界面，点击“导入现有密语”（Import Existing\
    \ Secret Phrase）。在标记为“钱包种子”（Wallet Seed）的框中，输入 Ganache 中显示的助记词，如图 18.7 所示。\n\n\
    ## 图 18.7\n\n在下方输入密码并点击 OK。\n\n现在我们必须将 MetaMask 连接到 Ganache 创建的区块链。点击显示“主网络”（Main\
    \ Network）的菜单并选择“自定义 RPC”（Custom RPC）。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_199_0.png)\n\
    \n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_200_0.png)\n\n图 18.8\n\n在标题为“New RPC\
    \ URL”的框中，输入 `http://127.0.0.1:7545` 并点击保存（Save）。\n\n顶部的网络名称将切换为“私有网络”（Private\
    \ Network）。\n\nGanache 创建的每个账户都拥有 100 Ether。你会发现第一个账户的余额略少，因为在部署合约本身以及运行测试时使用了一些\
    \ gas。（确保你也在运行 Ganache。）\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_201_0.png)\n\
    \n图 18.9 安装和配置 Lite-Server\n\n## 步骤 11 安装和配置 Lite-Server\n\n现在我们可以启动本地 Web 服务器并使用该\
    \ DApp。我们使用 `lite-server` 库来提供静态文件。它是随 pet-shop Truffle Box 一带的，但让我们来看看它是如何工作的。\n\
    \n让我们检查 `bs-config.json`：\n\n```json\n{\n  \"port\": 3000,\n  \"server\": {\n\
    \    \"baseDir\": [\"./src\", \"./build/contracts\"],\n    \"open\": false\n \
    \ },\n  \"browser\": [\"chrome\"]\n}\n```\n\n这告诉 lite-server 在基础目录中包含哪些文件。我们添加\
    \ `./src` 目录用于网站文件，添加 `./build/contracts` 目录用于合约产物。\n\n我添加了 `\"browser\": [\"\
    chrome\"]`，以便 UI 在 Chrome 浏览器中打开。\n\n我们还在项目根目录下的 `package.json` 文件的 `scripts`\
    \ 对象中添加了一个 `dev` 命令。`scripts` 对象允许我们将控制台命令别名为单个的 npm 命令。\n\n要启动应用，在 VS Code 控制台中输入以下命令：\n\
    `npm run dev`\n\n## KittyChain 商店\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_203_0.png)\n\
    \n图 18.10 KittyChain 商店 UI\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_204_0.png)\n\
    \n图 18.11 点击 adopt 后出现 Metamask。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_205_0.png)\n\
    \n图 18.12 Metamask 上显示了交易。\n\nGanache 上显示的交易：\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_206_0.png)\n\
    \n图 18.13\n\n## 第 19 章\n\n## 在 Windows 上开发以坊加密货币\n\n你可以使用运行 Windows 系统的笔记本电脑开发你自己的加密货币。本文是为新手提供的分步指南，如何使用\
    \ Truffle 框架提供的示例代码轻松开发和部署代币（token）。Truffle 是一个用于使用以坊虚拟机（EVM）的区块链的世界级开发环境、测试框架和资产流水线。\n\
    \n这是一份根据以下要求开发基于以坊的加密货币的分步指南。\n\n要启动项目，我们需要设置符合以下要求的开发环境：\n\n- 代码编辑器\n- 源码控制\n\
    - 单元测试\n- 调试\n\n对于代码编辑器，我们使用 Visual Studio Code，原因如下：\n\n- VS Code 与用于源码控制的 Git\
    \ 集成非常好。Git 是目前源码控制的最佳选择。\n- VS Code 与管理单元测试的 Truffle 框架配合良好。\n- VS Code 与 Truffle\
    \ 的调试工作配合良好。\n\n此外，Visual Studio Code 是编辑 Solidity 智能合约的优秀工具，并支持 Windows、Mac 和\
    \ Linux。\n\n## I. 安装软件包\n\n### 步骤 1：安装 Chocolatey\n\n以管理员身份运行 PowerShell。在 PowerShell\
    \ 中，输入以下命令：\n\n```bash\nSet-ExecutionPolicy Bypass\n```\n\n- `Set-ExecutionPolicy`\
    \ 更改 Windows PowerShell 执行策略的用户偏好。\n- `Bypass` 没有任何阻止，也没有警告或提示。此执行策略适用于以下配置：Windows\
    \ PowerShell 脚本构建在更大的应用程序中，或者 Windows PowerShell 是具有自身安全模型的程序的体系。\n- 为什么用 Chocolatey：“你从未像使用\
    \ Chocolatey 那样快速地部署软件。”Rob Reynolds。Chocolatey 是一种软件管理自动化。\n\n通过输入以下安装 Chocolatey：\n\
    \n```powershell\niex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))\n\
    ```\n\n- `Invoke-Expression`（简写 ie）将指定的字符串作为命令执行并返回表达式的结果。\n- https://chocolatey.org/install\n\
    \n### 步骤 2：安装 Visual Studio Code、Git 和 Node.js\n\n安装完成后，关闭并重新打开 PowerShell。输入以下命令：\n\
    \n```bash\nchoco install visualudiocode -y\nchoco install git -y\nchoco install\
    \ node -y\n```\n\n### 步骤 3：安装 Truffle 框架\n\nTruffle 是一个用于以坊的世界级开发环境、测试框架和资产流水线，旨在让以坊开发者的生活更容易。Truffle\
    \ 官网如下：https://truffleframework.com/docs/\n\n我们使用 npm（Node 包管理器）安装 Truffle。输入以下命令：\n\
    \n```bash\nnpm install -g truffle\n```\n\n你可以通过以下代码检查已包的版本：\n\n```bash\nnode -v\n\
    npm -v\ntruffle --version\n```\n\n输出如图 19.1 所示。\n\n![](img/f2f9952d33ef3f083419e55bc6a6e2e1_211_0.png)\n\
    \n图 19.1\n\n## II. 配置 VS Code 进行以坊区块链开发\n\n### 步骤 1 选择项目文件夹\n\n为你的项目选择一个文件夹并输入以下命令：\n\
    \n```bash\nmkdir TruffleTest; cd TruffleTest; code .\n```\n\n链中的最后一个命令是 `code\
    \ .`，它会在执行命令的文件夹中打开 Visual Studio Code 实例。\n\n### 步骤 2 在 VS Code IDE 中安装 Solidity\n\
    \n在 VS Code IDE 中搜索 Solidity 并安装它\n\n### 步骤 3 安装 Material Icon Theme\n\n在 VS Code\
    \ 中安装 Material Icon Theme。\n\n现在你拥有了集成了 PowerShell IDE 的用于以坊区块链开发的 VS。\n"
