    # # Chapter 15 Storing Data on Blockchain


    Despite the hype and its promising future, blockchain still has its shortcomings,
    the issue of data storage is one of them. The transactions based on the POW consensus
    for bitcoin, Ethereum, and other cryptocurrencies are extremely slow and therefore
    not suitable for storage of large data. For example, the deployment of dApp Cryptokitties
    nearly crippled the Ethereum network


    The main problem of storing data on a blockchain is the limitation of the amount
    data we can store because of its protocol and the high transaction costs. As a
    matter of fact, a block in blockchain can store data from a few kilobytes to maybe
    a few megabytes. For example, the block size of the Bitcoin is only 1Mb. The block
    size limitation has a serious impact on the scalability of most cryptocurrencies
    and the bitcoin community is debating whether to increase the block size.


    Another issue is the high cost of the transactions. Why is storing data on the
    blockchain so expensive?? It is because the data must be stored by every full
    node on the blockchain network. When storing data on the blockchain, we do pay
    the base price for the transaction itself plus an amount per byte we want to store.
    When smart contracts are involved, we also pay for the execution time of the smart
    contract. Even storing kilobytes of data on the blockchain can cost you a fortune.


    Therefore, it is not viable to store large data files like images and videos on
    the blockchain. Is there a possible solution to solve the storage issue? Yes,
    there are quite a few solutions but the most promising one is IPFS.


    #  15.1 What is IPFS?


    IPFS or Interplanetary File System is an innovative open-source project created
    by the developers at Protocol Labs. It is a peer-to-'
  - '[PAGE 161]


    peer filesharing system that aims to change the way information is distributed
    across a wide area network. IPFS has innovated some communication protocols and
    distributed systems and combine them to produce a unique file-sharing system.


    The current HTTP client-server protocol is location-based addressing which faces
    some serious drawbacks. First, location-based addressing consumes a huge amount
    of bandwidth, and thus costs us a lot of money and time. On top of that, HTTP
    downloads a file from a single server at a time, which can be slow if the file
    is big. In addition, it faces single point of failure. If the webserver is down
    or being hacked, you will encounter 404 Not Found error. Besides that, it also
    allows for powerful entities like the governments to block access to certain locations.


    On the contrary, IPFS is a content-based addressing system. It is a decentralized
    way of storing files, like BitTorrent. In the IPFS network, every node stores
    a collection of hashed files. The user can refer to the files by their hashes.
    The process of storing a file in the working directory, generate a hash for the
    file and his file will be available on the IPFS network. A user who wants to retrieve
    any of those files by uploading the file to IPFS, store the file in the network
    simply needs to call the hash of the file he or she wants. IPFS then search all
    the nodes in the network and deliver the file to the user when it is found.


    IPFS will overcome the HTTP weaknesses. As files are stored on the decentralized
    IPFS network, if a node is down, the files are still available on other nodes,
    therefore there is no single point of failure. Data transfer will be cheaper and
    faster as you can get the files from the nearest node. On top of that, it is almost
    impossible for the powerful entities to block access to the files as the network
    is decentralized.'
  - '[PAGE 162]


    # 15.2 Blockchain and IPFS


    IPFS is the perfect match for the blockchain. As I have mentioned, the blockchain
    is inefficient in storing large amounts of data in a block because all the hashes
    need to be calculated and verified to preserve the integrity of the blockchain.
    Therefore, instead of storing data on the blockchain, we simply store the hash
    of the IPFS file. In this way, we only need to store a small amount of data that
    is required on the blockchain but get to enjoy the file storage and decentralized
    peer-to-peer properties of IPFS.


    One of the real-world use cases of blockchain and IPFS is Nebulis. It is a new
    project exploring the concept of a distributed DNS that supposedly never fails
    under an overwhelming access request. Nebulis uses the Ethereum blockchain and
    the Interplanetary File System (IPFS), a distributed alternative to HTTP, to register
    and resolve domain names. We shall see more integration of Blockchain and IPFS
    in the future.'
  - '[PAGE 163]


    # Chapter 16 Plasma-The Solution for Security and Scalability


    # 16.1 The Scalability Issue


    Blockchain always faces the trade-off issue between security and scalability.
    Though their PoW consensus protocol guarantees near perfect security, it also
    slows down the processing speed significantly. Currently, the Ethereum processing
    speed is 15 transactions per second while Bitcoin is 7 transactions per second.
    Both platform’s processing capacities are nowhere near Visa’s processing speed
    of 45,000 transactions per second.


    Furthermore, the increase in the number of dApps deployed on the main Ethereum
    chain has caused congestion and slows down transactions tremendously. One of the
    most famous cases is Cryptokitties, it clogged up the Ethereum network in just
    a few weeks of deployment due to its unprecedented popularity.


    In seeking a viable solution to the scalability issue, Vitalik Buterin and Joseph
    Poon have joined hands in conceptualizing and developing Plasma, a framework that
    can scale Ethereum processing power. Joseph is also the co-founder of the Lightning
    network, a framework that has greatly increase Bitcoin processing speed. Both
    plasma and Lightning network are trustworthiness multilayered blockchain networks.


    # 16.2 Plasma


    Plasma is a system that comprises the main blockchain and the ‘child blockchains’
    that branch out from the main blockchain(aka parent blockchain or root blockchain).
    The child blockchains can co-exist but function independently from the parent
    chain and each other.'
