    such as total tickets, collected funds, start time, etc. The code could be as
    follows:


    ```

    Contract Event {

    struct EventDetails {

    uint256 ticketAmount;

    uint256 SoldticketAmount;

    uint256 CollectedFunds;

    uint256 StartTime;

    }

    ```


    The event contract shall also include a create event function, as follows:


    ```

    function CreateEvent{

    uint256 _ticketAmount;

    uint256 _Startime

    }

    ```


    Apart from these, there are many more functions that can be included in smart
    contracts.


