    ## 1.11 Merkle 树


    Merkle 树是区块中的元数据之一。在计算机科学中，Merkle 树是一种分支数据结构，用于存储大型数据集中单个数据的哈希值。其目的是使数据集的验证既高效又快速。它是一种防篡改机制，用于确保大型数据集未被篡改。


    在区块链中，Merkle 树（也称为哈希树）以一种高效且安全的方式编码区块链数据。区块链网络上发生的每笔交易都会经过哈希算法产生哈希值，如图 1.9 所示。因此，每笔交易都有与其相关的哈希值。


    由于一个区块中存储了成千万笔交易，如果每个节点都必须处理跨区块链的数十万笔交易，将非常耗时，同步和挖掘将花费很长时间。为了解决这个问题，区块中所有的交易哈希值也会被哈希。如图所示，两个哈希值被哈成一个单个哈希值，如图
    1.10 所示。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_32_0.png)


    图 1.10


    这些哈希值在区块中并不是按顺序存储的，而是以树状结构的形式，使得每个哈希根据父子树状关系与其父节点链接。哈希过程一直持续，直到产生一个单一哈希，即 Merkle
    根（Merkle root）。该 Merkle 根是区块的哈希，并存储在区块头中。该过程如图 1.11 所示。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_33_0.png)


