    \ ETH。另一方面，如果你的交易在达到 gas 限制之前已完成，你会获得剩余的 ETH。Gas 限制防止你花费无限的 ETH，就像银行设置信用卡额度防止你过度消费一样。\n\
    \n## 3.2 智能合约\n\n智能合约是一种计算机代码，可以在不同且匿名的之间促进货币、内容、财产、股份、数字资产或任何有价值的交换，而无需中间实体。\n\
    \n当智能合约安装在区块链系统中时，它的行为就像一个自动运行的计算机程序，在满足特定条款和条件时会自动执行。因为智能合约运行在区块链上，它们会完全按照程序编写运行，不存在审查、停机、欺诈或第三方干扰的可能性。\n\
    \n在以太坊区块链平台上，用户可以向另一个用户发送某些 Ether 以交换某些有价值的物品，交易根据智能合约自动执行。在 Cryptokitties（加密猫）的中，当用户通过竞价过程从\
    \ Cryptokitties 收藏品市场获得独特的虚拟猫时，就会执行智能合约，最高出价者将拥有该数字资产。\n\n另一方面，交易可以在两个使用物联网技术和区块链集成系统的智能设备之间自动发生，例如智能手机\
    \ A 在接收到 B 的钱后可以为另一个智能手机 B 上传数据。交易完全在智能合约上发生，所有者无需察觉。\n\n与流行观点相反，智能合约并不是以太坊创始人维塔里克·布特林（Vitalik\
    \ Buterin）发明的。事实上，智能合约的概念是由计算机科学家、密码学家尼克·萨萨博（Nick Szabo）在 1993 年提出的，被视为一种数字自动售卖机。在他著名的例子中，他描述了用户如何输入数据或价值，并从机器中获得有限的物品（在这种情况下，是现实世界的零食或软饮料）。尼克·萨博非常聪明，以至于有些人认为他可能就是发明比特币的中本聪（Satoshi\
    \ Nakamoto）。\n\n此外，尽管以太坊是第一个采用智能合约技术的区块链系统，但它并不是唯一使用智能合约的系统。许多非以太坊区块链平台如 Tron、Hyperledger\
    \ Fabric、Hyperledger Sawtooth 和 Corda 都实现了它们版本的智能合约。Hyperledger Fabric 中的智能合约被称为\
    \ Chaincode，运行在名为 docker 的容器中。\n\n今天，大多数区块链平台运行在以太坊虚拟机（EVM）上并实现以太坊智能合约，而少数企业区块链平台实现了了自己的智能合约。然而，以太坊平台与企业平台之间可能存在互操作性。例如，在\
    \ Sawtooth-Ethereum 集成项目中，可以使用 Seth 交易族将 EVM（以太坊虚拟机）智能合约部署到 Sawtooth 中。Hyperledger\
    \ 技术将在另一章节介绍。\n\n### 3.2.1 Solidity\n\nSolidity 是一种高级编程语言，用于在以太坊平台上创建和实现智能合约。使用\
    \ Solidity 创建的智能合约可用于金融交易、众筹、投票、供应链管理、物联网实现、共享闲车自动化、智能城市管理等。此外，它还可以开发去中心化应用。\n\
    \nSolidity 受到 Python、C++ 和 JavaScript 的影响。因此，对于那些熟悉 Python、C++ 或 JavaScript 的人来说，它非常方便且易掌握。\n\
    \n### 3.2.2 编写和部署智能合约\n\n编写、编译、测试和部署智能合约的最佳工具是 Remix。Remix 是一个基于浏览器的 IDE，提供内置编译器作为运行时环境，无需服务器端组件。你可以通过以下链接访问\
    \ Remix：https://remix.ethereum.org。\n\n我们也可以使用其他代码编辑器编写 Solidity。我建议你使用 Visual\
    \ Studio Code 或 Visual Studio 的 Solidity 插件。你需要从 https://marketplace.visualstudio.com/items?itemName=Consensus.Solidity\
    \ 下载 Solidity 插件。\n\n此外，你需要安装 Visual Studio。\n\n### 3.2.3 智能合约\n\n在 Solidity 的意义上，合约是代码（函数）和数据（状态）的集合，位于区块链上的特定地址。行\
    \ `uint storedData;` 声明了一个类型为 `uint`（256 位无符号整数）的状态变量 `storedData`，可以通过调用管理数据库的代码函数来查询和修改。要访问状态变量，你不需要使用其他编程语言中常用的前缀。这只是一个简单的合约，除了允许任何人存储单个数字外没有做什么。让我们开始吧：\n\
    \n```solidity\npragma solidity ^0.5.0;\ncontract MyStorage {\n    uint storedData;\n\
    \    function set(uint x) public {\n        storedData = x;\n    }\n    function\
    \ get() public returns (uint) {\n        return storedData;\n    }\n}\n```\n\n\
    ### 3.2.4 理解代码\n\n第一行简单地说明源代码是为 Solidity 0.5.0 版本编写的。关键字 `pragma` 之所以这样命名，是因为通常\
    \ pragma 是给编译器关于如何处理代码的指令。\n\n### 3.2.5 去中心化应用 (DApps)\n\nDApp 是去中心化应用（decentralized\
    \ application）的缩写。DApp 的后端代码运行在去中心化的点对网络上，如以太坊区块链。相反，App 的后端代码运行在中心化服务器上。\n\n\
    DApp 可以有使用任何语言编写的前端代码和用户界面，这些语言可以调用其后端。此外，其前端可以托管在 Swarm 或 IPFS 等去中心化存储上。\n\n\
    最著名的基于以太坊的 DApp 之一 CryptoKitties (https://www.cryptokitties.co/)。CryptoKitties\
    \ 是一款以可繁殖、可收藏且可爱的生物中心的游戏。每只猫都是独特的，由所有者 100% 所有；它不能被复制、夺走或销毁。该游戏如此受欢迎，以至于 2017\
    \ 年 12 月拥塞了以太坊主网，导致交易量达到历史新高并显著减慢了网络。自以太坊诞生以来，已有许多 DApp 在该平台上开发。你可以通过此链接查看 DApp\
    \ 商店：https://www.dapp.com/。要了解更多关于智能合约和 DApp 的信息，请阅读我们的技术章节。\n\n"
