  - '[PAGE 302]


    According to Binance, Proof of Authority (PoA) is a reputation-based consensus
    algorithm that employs a practical and efficient solution for blockchain networks,
    particularly the private blockchain networks. The term was proposed in 2017 by
    Ethereum co-founder and former CTO Gavin Wood.


    The POA consensus algorithm leverages the value of identities, which means that
    block validators are not staking coins but their own reputation instead. Therefore,
    POA blockchains are secured by validator nodes that are preselected as trustworthy
    entities.


    The Chi PoA blockchain network employs a limited number of validators and this
    makes it highly scalable. Blocks and transactions are verified by pre-approved
    validators, who act as moderators of the system. In contrast to POW, POA does
    not require nodes to spend a huge amount of computational resources and electricity
    to maintain the blockchain network.


    The Chi PoA blockchain network has much higher transaction rate, low latency and
    higher tolerance for compromised and malicious nodes compared to blockchain networks
    that are powered by POW or POS consensus algorithms. The highly efficient and
    secure POA system will ensure the safety of crypto funds and financial data. It
    is also flexible enough to develop innovative business applications on Chi PoA
    blockchain platform.


    # 3.2 The Chi Blockchain Platform'
