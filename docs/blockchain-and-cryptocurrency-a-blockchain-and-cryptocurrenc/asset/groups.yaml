  - '[PAGE 327]


    Blockchain has been the most hyped technology in the last decade. Though blockchain
    technology is being overhyped, it has the potential to disrupt many existing industries.
    Start-ups, moreover, and even governments are already experimenting with blockchain-based
    applications.


    Blockchain has crept into our daily life as we are bombarded with social media,
    web portals and advertisements. As a result, nearly everyone is talking about
    cryptocurrency today, most people still do not understand blockchain, the technology
    that powers cryptocurrencies. Therefore, I have written this book with hope of
    empowering everyone. This book is a comprehensive guide covering fundamental and
    advanced topics such as:


    +   - Storing your cryptocurrencies security in crypto wallets

    - Smart contracts

    - dApps

    - Enterprise blockchain frameworks like Hyperledger and Corda

    - How to conduct ICO and IPO

    - DeFi

    - Blockchain for financial services

    - Blockchain for supply chain management


    Building a digital government with blockchain also covers technical topics such
    as:

    - Improving scalability with Plasma

    - Storing blockchain data on IPFS

    - Writing smart contracts with Solidity

    - Developing DApps

    -Developing ERC-20 tokens

    - Setting up a private Ethereum blockchain

    - Creating a multisig wallet

    - Creating an automotive supply chain management blockchain platform with Hyperledger
    Fabric


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_327_0.png)


    Dr. Liew Voon Kiong holds a bachelor''s degree in Mathematics, a master''s degree
    in Management and a doctorate in Business Administration.

    Dr. Liew is a sought-after Blockchain Architect by companies in the blockchain
    industry. He has played a lead in designing and developing the native cryptocurrency
    of an incubation hub in Southeast Asia, as well as successfully got listed on
    a renowned exchange via an IEO campaign. He is also the Chief Strategy Officer
    of an Australian blockchain company that manages a crypto hedge fund. Dr. Liew
    is a blockchain researcher and has developed several use cases such as blockchain-powered
    supply chain management for the automotive and textile industries, building a
    blockchain-powered digital government, event and ticketing DApps, and more. He
    is skilled in setting up blockchain networks as private Ethereum networks, using
    Solidity and creating DApps. He has also created a blockchain blog titled Blockchain:
    For Everyone (http://www.blockchainguide.biz/).


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_327_1.png)'
