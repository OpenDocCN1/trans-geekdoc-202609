    Organization created in 2014. It is one of the largest dApps on the Ethereum blockchain.
    MakerDAO is a decentralized credit platform on Ethereum that supports Dai, a decentralized,
    unbiased, collateral backed stablecoin whose value is pegged to USD. The Maker
    Protocol which is known as Multi collateral Dai (MSD) allows users to mint Dai
    by leveraging collateral approved by the Maker Governance. Maker Governance is
