    P2P lending models. Indeed, a dozen companies have started to deploy blockchain-based
    P2P lending platforms.


    Blockchain-based P2P businesses are broadly divided into two models, the hybrid
    model, and the pure cryptocurrency model. The hybrid model involves using cryptocurrency
    and fiat money while the pure cryptocurrency model uses only cryptocurrencies.


    ## 8.2.1 The Hybrid P2P Lending Model


    This model uses a combination of fiat currency and cryptocurrency to provide P2P
    lending services. Let us examine a few companies that implement this model.


    ### SALT


    SALT (Secure Automated Lending Technology) is a leader in the blockchain-based
    P2P lending industry. SALT''s model allows borrowers to use their crypto assets
    as collateral to secure loans from an extensive network of lenders on the platform.
    It means SALT does not have to check the credit score of borrowers, but grants
    eligibility based on the amount of crypto assets they are willing to put up as
    collateral. The main advantage for SALT borrowers is the ability to borrow fiat
    money against the security of their crypto assets, which is considered more practical
    to ordinary people than the pure cryptocurrency lending model.


    To sign up as a member of SALT, a borrower needs to purchase SALT tokens, the
    cryptocurrency of the SALT platform. SALT is minted using an ERC-20 smart contract.
    After signing up, borrowers must deposit a certain amount of crypto assets (cryptocurrency)
    as collateral into the platform''s unique, multi-signature wallet address created
    by SALT. After the terms of the loan are agreed and approved, the lender will
    make a deposit in fiat money into the borrower''s bank account. The borrower will
    be obligated to make repayments in fiat money or stable coins (currently accepting
    USDC, TUSD, and PAX) on a regular basis before the 15th of the month. In the event
    of a default, his or her crypto assets will be transferred to the lender.


    For an asset to qualify as collateral on the SALT Platform, it must meet certain
    eligibility requirements. First and foremost, it must be a blockchain asset. This
    means that the ownership of the asset must be recorded on a public or permissioned
    blockchain. Digital assets will be onboarded based on community demand.


    Examples of currently eligible collateral include Bitcoin (BTC), Bitcoin Cash
    (BCH), Ether (ETH), Litecoin (LTE), Dogecoin (DOGE), Dash (DASH), TUSD (TUSD),
    USD Coin (USDC), Paxos Standard Token (PAX), and PAX Gold (PKG).


    ### NEXO


    The NEXO P2P model is somewhat like the SALT model. It also possesses a cryptocurrency
    known as the NEXO Token, which is the world''s first SEC-compliant asset-backed
    token and is backed by the underlying assets of NEXO''s loan portfolio. It can
    be used for discounted interest rates and loan repayments, as well as collateral.
    One incentive for holding the NEXO token is that it pays dividends to holders.
    Thirty percent of the profits generated from NEXO loans go to a dividend pool
    that is then distributed to NEXO holders. Currently, dividend payments are being
    made in Ethereum (ETH), but there''s a good chance that this will expand to other
    cryptocurrencies in the future.


    The loan approval process is fully automated. A credit line becomes instantly
    available to the borrower once the application is approved and there is no credit
    check. The borrower can spend money instantly with a card or withdraw money to
    a bank account. Spending on the credit line will incur an APR of 5.9% of what
    the borrower uses. Some advantages of NEXO compared to SALT are that there is
    no minimum repayment, no hidden fees, and the interest is debited from the available
    limit. Besides that, the borrower can make repayments at any time. On top of that,
    the NEXO website states that it is the only insured account that lets you borrow
    instantly in 45+ fiat currencies and earn daily interest on your idle assets.
    Furthermore, NEXO makes its loans available worldwide. Anyone who holds cryptocurrency
    can take advantage of a NEXO loan. And since the loans are fully collateralized,
    there is no need for borrowers to worry about credit history or approvals.


    Though the use cases for NEXO loans will be somewhat limited since they''re collateral-backed,
    the use of cryptocurrencies as collateral makes for an attractive alternative
    for those who hold cryptocurrencies and don''t want to sell and give up future
    gains, but still need fiat currency for immediate use.


    Now, more than twenty cryptocurrencies including BTC, ETH, NEXO, XRP, TRON and
    others can be accepted as the collateral. Any loans taken can be repaid using
    cryptocurrency, fiat currency, or the NEXO token. They have made it as easy as
    possible to repay any loans. In contrast, SALT only accepts loan repayment in
    fiat currency.


    ## 8.2.2 The Pure Cryptocurrency Lending Model


    ### ETH Lend


    Lend is the world''s first decentralized lending protocol. Now, more than twenty
    cryptocurrencies including BTC, ETH, NEXO, XRP, TRON and others can be accepted
    as the collateral. Any loans taken can be repaid using cryptocurrency, fiat currency,
    or the NEXO token. They have made it as easy as possible to repay any loans. In
    contrast, SALT only accepts loan repayment in fiat currency.


    ### Elix


    Elix is a decentralized peer-to-peer lending platform that allows users to lend
    and borrow cryptocurrencies. The platform uses smart contracts to facilitate transactions
    and ensure transparency and security.

