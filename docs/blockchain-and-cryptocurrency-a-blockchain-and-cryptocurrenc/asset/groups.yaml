    Chi 指数基金和 Chi Token。未来还将开发更多产品和服务。


    # 2 Chi指数基金


    ###2.1 什么是Chi指数基金？


    Chi指数基金是一种利用量化交易策略的纯加密货币投资工具。量化交易包括基于量化分析的交易策略，依赖数学计算和数据处理来识别交易机会。价格和成交是量化分析中常用的两种数据输入。量化交易的优势在于它允许利用回测数据并消除交易中的情绪决策。


    Chi指数基金的创建是为了缓解加密货币交易中的问题，包括技术困难和加密货币的波动性。Chi 是全球首批纯加密货币代币基金之一，旨在简化加密市场的交易。Chi指数基金将维护一个由市值前二十加密货币组成的多元化组合。为了持续跟踪指数，组合将定期使用
    AI 驱动的再平衡技术。


    Chi指数基金的益处有很多：便利、极低的经纪人费用、完全透明、完全控制以及更低的价格限制。自动化允许Chi指数基金以仅每年 0.5% 的费用运行，而市场平均为每年
    3%。


    Chi指数基金将纳入 Chi 对冲策略中，旨在最大化利润并最小化加密投资的风险。Chi金融服务团队将采用对冲策略，为投资者实现利润最大化和风险最小化。募集资金的一半将按当前市场价值购买比特币（BTC），并将其存在安全的多签名托管钱包中，以应对加密市场的风险和波动。另一半资金的一部分将投资于
    Chi指数基金，该基金由一篮加密货币组成，将通过算法交易为投资者产生收益。剩余余额将用于营销活动。与传统的股票交易相比，Chi交易平台的费用低得多。


    ###2.2 交易策略


    Chi指数基金将采用类似于标普500指数基金等传统指数基金的交易策略。在加密交易中，任何抢跑者都需要预测币种进入 Coinmarketcap 排名的前二十，并且在交易所拥有足够的流动资金来影响市场价格。Chi指数基金将采取多种策略来降低这种风险：


    - 加密货币将在交易前12小时发送到交易所，以便交易者无法通过热钱包来确切知道何时进行买卖。每周的再平衡窗口为此留了足够的时间。

    - 交易将在多个交易所执行。

    - 交易将在再平衡窗口内的不同时间执行，以防止被预测。


    # 3 Chi Token


    ###3.1 什么是Chi Token？


    Chi 是一种为 Chi区块链平台提供支持的实用型令牌。Chi 是一个 ERC20 令牌，使用部署在 Chi POA 以区块链网络上的智能合约铸造。POA
    代表权威证明，是 Chi区块链网络用于验证 Chi 交易的共识协议。Chi区块链网络是一个私有链，允许 Chi 平台成员全球访问，并使他们能够24/7 进行
    Chi Token 的交易和结算，无需支付昂贵的中介费用。


    Chi区块链网络将使用基于权威证明（POA）共识协议的 Parity Ethereum Client 构建。Chi区块链网络将托管在虚拟私云服务器上。


