    STO 的成本远高于 ICO，尽管它比传统的 IPO 要便宜。


    启动 STO 的过程与 IEO 和 ICO 几乎相同，但在合格法律顾问的帮助下起草法律文件比后两者更为重要。根据你希望募集的资金金额以及不同国家的司法管辖区，你可能需要像进行
    IPO 一样提供招股说明书。尽管存在额外的法律限制和财务成本，STO 活动仍已取得成功。例如，区块链风险投资公司 Blockchain Capital 在
    2017 年通过其 STO 计划筹集了 1000 万美元。在全球范围内运营加密货币支持贷款的公司 NEXO 在 2018 年成功筹集了 52,500,000
    美元。


    Polymath 的成功甚至令人惊叹。它的 STO 活动在 2018 年总共筹集了 207,300,000 美元。Polymath 是金融证券与技术区块链之间的接口，帮助发行者克服与在区块链上发行受监管证券时相关的复杂技术和法律挑战。这一尖端区块链平台通过去中心化协议提供了全面的代币化流程。Polymath
    允许公司快速方便地募集资金并铸造证券代币。


    ## 第 6 章


    ## Hyperledger - 企业级区块链框架


    在之前的章节中，我们学习了加密货币的旗舰比特币区块链。随后，我们学习了以太坊，它在其加密货币 Ether 之上具有智能合约功能。智能合约允许在以太坊生态系统中创建去中心化应用程序（dApps）。


    比特币以太坊都是优秀的区块链平台。然而，它们都面临着极具挑战性的问题，之一就是扩展性。比特币网络的交易处理能力受到 10 分钟平均区块生成时间和区块大小限制限制。比特币的交易率为每秒
    3.3 到 7 次交易。


    以太坊的情况并不因此好，交易率为每秒 15 次交易。相比之下，VISA 的交易率为每秒 45,000 次。因此，这两个平台目前在开发实际的企业应用方面仍然不足。


    为了克服区块链技术在企业用途中的局限性，Hyperledger 的诞生目标是为行业和企业提供可行的区块链解决方案。Hyperledger 是由 Linux
    基金托管的一项开源项目，旨在推进跨行业区块链技术的发展。


    ### 6.1 Hyperledger 的使命


    Hyperledger 的哲学是：


    > “只有开源的、协作的软件开发方法，才能确保透明度、长久性、互操作性以及将区块链技术推向主流商业化应用所所需的支持。” - hyperledger.org


    事实上，Hyperledger 项目是来自技术、金融、银行、供应链管理、制造、物联网（IoT）等等多个行业和组织参与者的合作成果。自 2015 年 12 月成立以来，它已成功吸引了许多知名成员，包括
    IBM、Intel、NEC、Cisco、J.P Morgan、AMN AMRO、ANZ Bank、Wells Fargo、Accenture、SAP 等。


    Hyperledger 的使命包含了一些宏伟的目标：


    - 创建企业级、开源的、分布式账本框架和代码库，以支持业务交易。

    - 提供由技术和业务治理支持的中立、开放且社区驱动的基础设施。

    - 构建技术社区，开发区块链和共享账本的 POC（概念验证）、用例、现场测试和部署。

    - 推广我们的“社区的社区”——采用包含许多平台和框架的工具包方法。


    ### 6.2 Hyperledger 温室 (Greenhouse)


    Hyperledger 本身并不是一个平台。它是一个孵化并促进一系列业务区块链技术的伞体。这些技术包括分布式账本框架、智能合约引擎、客户端库、图形界面、实用库和示例应用程序。这种伞形策略通过鼓励重用公共构建块和组件，加速了
    DLT（分布式账本技术）组件的创新（hyperledger.org, 2019）。


    被称为“温室”的 Hyperledger 项目由六个分布式账本、五个工具、四个库和一个特定领域的平台组成：


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_80_0.png)


    **图 6.1** Hyperledger 温室（来源：hyperledger.org）


    每个 Hyperledger 框架的运行方式不同，但它们也允许之间存在某些互操作性。Hyperledger 框架通常是许可链（私有）区块链。这意味着各方需要验证和授权才能参与区块链。


    ### 6.3 开源与治理


    Hyperledger 的成功基于开源和治理。开源的概念意味着开源软件是免费提供的软件，并且可以重新分发和修改。换句话说，任何人都可以查看代码、使用代码、拷贝代码、修改代码并贡献更改（2019）。


    另一方面，治理意味着项目的技术决策由一组活跃参与者做出。这些决策包括诸如添加哪些功能、如何添加以及何时添加等。你可以通过此链接了解 Hyperledger
    的治理情况：https://www.hyperledger.org/blog/2017/09/abcs-of-governance


    ### 6.4 Hyperledger Fabric


    Hyperledger Fabric 是由 Linux 基金会开发并托管的首个区块链项目。它最初由 Digital Asset 和 IBM 贡献。它是一个企业级的许可分布式账本技术（DLT）平台，设计用于开发企业应用。相比之下，比特币和以太坊是公共无许可区块链，尽管以太坊可以配置使用权威证明（PoA）共识协议来作为私有链。


    与其他流行的分布式账本或区块链平台相比，Hyperledger Fabric 具有关键的差异化特性。Hyperledger Fabric 的一个特殊特性是允许共识和成员服务等组件即插即用。此外，Hyperledger
    Fabric 使用容器技术来托管称为链码（chaincode）的智能合约，链码包含了系统的应用程序逻辑。


    通道（Channels）是 Hyperledger Fabric 的另一个独特特性。它们允许交易在参与者之间保持隐私，同时仍被验证并提交到区块链。


    ### 6.5 Hyperledger Fabric 架构


    Hyperledger Fabric 具有高度模块化可配置的架构。因此，企业可以利用其多功能性开发创新的业务应用。此外，它还可以优化应用程序。事实上，Hyperledger
    Fabric 非常适用于开发广泛的行业案例，包括银行、金融、保险、医疗、人力资源、供应链甚至数字音乐传输。


    与以太坊一样，Hyperledger Fabric 也具有智能合约。然而，它在使用 Solidity 编程语言来编写智能合约。Hyperledger Fabric
    的智能合约使用 Java、Go 和 Node.js 等通用编程语言编写。这意味着大多数企业已经拥有了开发智能合约所需的技能，不需要额外的培训来学习新语言。

    '
