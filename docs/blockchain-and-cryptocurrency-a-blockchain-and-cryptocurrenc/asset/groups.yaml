    # # Step 5 Testing the smart contract


    Truffle is very flexible when it comes to smart contract testing, that tests can
    be written either in JavaScript or Solidity. In this tutorial, we will write our
    tests in Solidity.


    Create a new file TestAdoption.sol in the test/ directory. To save time, download
    a copy of the file from the following link:


    ```

    http://javascript-tutor.net/blockchain/download/test/TestAdoption.sol

    ```


    We start the craft off with three imports:


    +   - Assert.sol: Gives us various assertions to use in our tests. In testing,
    an assertion checks for things like equality, inequality, or emptiness to return
    a pass/fail from our test.

    - DeployedAddresses.sol: When running tests, Truffle will deploy a fresh instance
    of the contract being tested to the'
  - '[PAGE 195]


    blockchain. This smart contract gets the address of the deployed contract.


    +   Adoption.sol: The smart contract we want to test.


    To run the test, enter the following command:


    Truffle test


    The output is as shown in Figure 18.6.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_195_0.png)


    Figure 18.6


    # Step 6 Creating a User Interface to Interact with The Smart Contract


    Now we''ve created the smart contract, deployed it to our local test blockchain
    and confirmed we can interact with it via the console, it''s time to create a
    UI so that the user can interact with the pet shop!'
  - '[PAGE 196]


    Included with the pet-shop Truffle Box is the code for the app''s frontend. It
    is the JavaScript file app.js within the src/ directory. You can download the
    app.js file from the following link:


    http://javascript-tutor.net/blockchain/download/src/js/app.js


    We need to instantiate web3 to create the UI. The global App object is to manage
    our application, load in the pets data in init() and then call the function initWeb3.
    The web3 JavaScript library interacts with the Ethereum blockchain. It can retrieve
    user accounts, send transactions, interact with smart contracts, and more.


    First, we check if there is a web3 instance already active. (Ethereum browsers
    like Mist or Chrome with the MetaMask extension will inject their own web3 instances.)
    If an injected web3 instance is present, we get its provider and use it to create
    our web3 object.


    If no injected web3 instance is present, we create our web3 object based on our
    local provider. (Here we fallback on http://localhost:7545 which points to Ganache)


    # Step 7 Instantiating the Contract


    We need to instantiate our smart contract so web3 knows where to find it and how
    it works. Truffle has a library to help with this called truffle-contract. It
    keeps information about the contract in sync with migrations, so you do not need
    to change the contract''s deployed address manually.


    First, we retrieve the artifact file for our smart contract. Artifacts are information
    about our contract such as its deployed address and Application Binary Interface
    (ABI). The ABI is a JavaScript object defining how to interact with the contract
    including its variables, functions, and parameters.'
  - '[PAGE 197]


    Once we have the artifacts in our callback, we pass them to TruffleContract().
    This creates an instance of the contract we can interact with. With our contract
    instantiated, we set its web3 provider using the App.web3Provider value we stored
    earlier when setting up web3.


    We then call the app''s markAdopted() function in case any pets are already adopted
    from a previous visit. We have encapsulated this in a separate function since
    we need to update the UI any time, we make a change to the smart contract data.


    # Step 8 Getting the Adopted Pets and Updating The UI


    We shall access the deployed Adoption contract, then call getAdopters() on that
    instance.


    We first declare the variable adoptionInstance outside of the smart contract calls
    so we can access the instance after initially retrieving it.


    Using call() allows us to read data from the blockchain without having to send
    a full transaction, meaning we will not have to spend any Ether.


    After calling getAdopters(), we then loop through all of them, checking to see
    if an address is stored for each pet. Since the array contains address types,
    Ethereum initializes the array with 16 empty addresses. Therefore, we check for
    an empty address string rather than null or other false value.


    Once a petId with a corresponding address is found, we disable its adopt button
    and change the button text to “Success”, so the user gets some feedback. Any errors
    are logged to the console.


    # Step 9 Handling the Adopt() Function


    We use web3 to get the user''s accounts. In the callback after an error check,
    we select the first account.'
