    # Chapter 5 - Crypto Fundraising


    Fundraising is always the primary concern of start-ups as they need funds to kickstart
    their projects. However, traditional fundraising from the public via an IPO is
    a huge barrier for start-ups as they do not have the resources and expertise to
    initiate it. Therefore, they often opt for a much easier fundraising method known
    as crowdfunding, which is a project or venture funded typically by raising small
    amounts of money from a large community.


    With the growth of the Internet, many crowdfunding platforms have emerged to cater
    for the need of the start-ups who are hungry for funds. To protect investors''
    interests, if a project fails to reach its funding goal, it is usually dropped
    from the fundraising platform and the pledged funds are returned to the investors.
    One of the most successful ones is Kickstarter, which launched in 2009 and has
    received almost $4 billion in pledges from 15.5 million backers to date (Aitken,
    2019).


    With the invention of Bitcoin by Satoshi Nakamoto in 2009 and the subsequent emergence
    of numerous altcoins, cryptocurrencies have been utilized to conduct crowdfunding
    in recent years with great success, which has reached its peak in 2017 where an
    estimated $4.9 billion was raised through ICOs (Page, 2018). Though ICOs are an
    innovative way to raise funds for start-ups, unfortunately many projects have
    turned out to be scams. Therefore, you need to understand and study an ICO project
    carefully before you invest in it. Let us delve deeper into ICO to get a better
    picture of what it is about.


