    ## 5.1 首次代币发行 (ICO)


    根据 Investopedia 的说法，首次代币发行（ICO）类似于首次公募募（IPO）。然而，ICO 项目不是向公众发行股票，而是发行加密货币，通常以硬币或代币（tokens）的形式出现。ICO
    的目标是募集资金以创建一个新的代币、应用程序或服务。


    在 ICO 活动期间，感兴趣的投资者可以认购发行并收到由该货币发行的新型加密货币代币。因此，ICO 也被称为代币销售。大多数 ICO 将其代币设计为实用型代币（utility
    token），用于支持其原生平台和去中心化应用（DApps），而不是用于投资。因此，大多数 ICO 项目可以回避法律框架，不需要遵守监管机构的严格治理。投资者通常需要用法币或已有的加密货币（如比特币、ETH、USDT
    等）来支付代币。这种代币通常会在特定的上市价格列在加密货币交易所，投资者可以在那里进行交易，并希望在价值升值时获利。


    许多人可能认为维塔·布特林（Vitalik Buterin）是 ICO 概念的发明者，但事实并不是并不是提出这个想法的人，更不用启动它了。在极其成功的以太坊
    ICO 活动之前，还有五个先驱。根据 Merre（2019）的说法，J.R. Wil 在 2013 年构想了这一想法；他提出了 Mastercoin 协议，该协议在比特币协议之上增加了一层，并提供了额外的功能。他使用
    Kickstarter 众筹方法向投资者索要比特币，以换取他的 Mastertokens，以享受 Mastercoin 协议提供的功能。


    ICO 活动取得了巨大成功。该项目成功筹集了 4740 个比特币，在当时价值约 50 万美元。这并不是一个天文数字，但在编写此本书时，按市场价值计算，它的价值高达惊人的
    3300 万美元。虽然 Mastertoken 本身在今天并不特别有用，但 Mastertoken 协议被重新命名为 Omni Layer，并成为一项极其成功的发明。它现在是
    Tether Token（广为人知的 USDT）的底层协议，USDT 是 BTC 和 ETH 之外交易最频繁的加密货币。


    在 Mastertoken 成功的 ICO 活动之后，又启动了四个 ICO 项目：NextCoin (#NXT)、CounterParty (#XCP)、MaidSafeCoin
    (#MAID) 和 Swarm。然而，真正的游戏规则改变者是维塔·布特林发明的以太坊以及以太坊 ICO 的成功活动。维塔声称，以太坊虚拟机是世界上第一个零基础设施平台。以太坊的代币销售在
    12 小时内获得了 3700 个 BTC，当时价值约为 230 万美元。它在活动结束时又筹集了 1830 万美元。以太坊现在在 Coinmarketcap
    上排名第二，在编写此书时市值为 14,316,813,733 美元。


    当初创公司发起 ICO 活动时，创始人团队需要编写一份白皮书（whitepaper）。在 2017 年 ICO 活动的高峰，你会注意到许多白皮书写得很糟糕，特别是那些诈骗项目。白皮书应该概述项目内容、项目完成后将满足什么需求、需要多少资金、将铸造多少加密代币、接受何种货币（法币或加密货币）、ICO
    活动将运行多长时间等。


    有关如何进行 ICO 活动的更多详细信息，请参考“如何进行”章节。


    ## 5.2 首次交易所发行 (IEO)


    在 ICO 的热潮消退后，出现了两种新的众筹方法，即证券代币发行（STO）和首次交易所发行（IEO）。在这两者中，IEO 更受欢迎，因为 STO 的准入门槛更高、成本更昂贵，并且受到证券委员会更严格的监管。


    在最近的一篇文章中，路透社报道，IEO 在 2019 年至今已筹集了 15 亿美元，而 ICO 仅为 8.36 亿美元。数十个惊人成功的 IEO 案例促使更多项目主开启自己的
    IEO 之旅。著名的 IEO 案例包括在 Binance Launchpad 上销售 BitTorrent (BTT) 代币，在销售开启的前 14 分钟内就筹集了
    700 万美元。Veriblock 的表现更出色，在 Bittrex 交易所仅用 10 秒就通过 IEO 筹集了 700 万美元。这是一个令人惊叹的壮举！可以说，IEO
    已经取代 ICO 成为加密货币行业融资的首选方案。


    那些仍想着 ICO 黄金日期的投资者应该开始改变心态，转而投资 IEO 项目。另一方面，希望在加密行业筹资的初创公司或企业必须意识到 ICO 已经死去，IEO
    才是出路。最后，更多的交易所应该创建 IEO 启动平台（launchpads），以帮助希望通过 IEO 筹资金的项目，因为这是一个巨大的未开发利基市场。


    ### 5.2.1 什么是 IEO?


    根据币安介绍，首次交易所发行（IEO）是一种由加密货币交易所平台管理的融资活动。IEO 允许投资者购买新的加密货币（或代币），同时为其加密货币项目募集资金。


    '
