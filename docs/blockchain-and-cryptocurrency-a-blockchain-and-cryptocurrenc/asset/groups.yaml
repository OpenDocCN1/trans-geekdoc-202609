    trading. The remaining balance shall be utilised for marketing activities. The
    Chi trading platform offers significantly lower fees compared to traditional stock
    market trading.


    ### 2.2 Trading Strategy


    Chi Index Fund will employ trading strategy like that of traditional index funds
    such as the S&P 500 index fund. In crypto trading, any front runners would need
    to anticipate coins entering the top 20 in Coinmarketcap ranking and must have
    enough liquid capital on exchange to move market rates. Chi Index Fund shall employ
    several strategies to mitigate this risk:


    - Cryptocurrencies will be sent to the exchange 12 hrs in advance of the trade
    so that traders cannot follow the hot wallet to know exactly when a purchase or
    sale will be made. A weekly rebalancing window affords sufficient time to do this.

    - Trades will be executed over multiple exchanges.

    - Trades will be executed at varying times within the rebalancing window to prevent
    predictability.


