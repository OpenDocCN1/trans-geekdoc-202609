    图 7.3


    如果我们把 $\lambda$ 的值设太高会发生什么？例如，如果 $\lambda = 10000$ 且 $N = 50$，时间间隔 $t$ 为 0.0005。这意味着交易发生得非常快，它们唯一能看到的提示点就是创世节点，如图
    7.4 所示。


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_99_0.png)


    图 7.4


    在以上两种情况下，缠网结构都会崩塌。


