    # 第 13 章


    # 去中心化金融


    去中心化金融，通被称为 DeFi，意味着在区块链等去中心化平台上运行金融应用程序。这是一种新的金融架构，利用去中心化网络和智能合约等去中心化技术，将旧金融产品转化为无需中介即可运行的无信任且透明的协议。


    相比之下，中心化金融意味着由银行等单一机构控制和管理客户资金。这种中心化控制有许多缺点，包括资金滥用、个人数据被操纵、欺诈、黑客导致的单点故障等。


    去中心化金融具有许多优势，因为它与区块链技术具备的特征相一致。


    ## 13.1 DeFi 的优势


    ### 13.1.1 对自己数字资产的完全控制权


    你在 DeFi 平台上拥有的数字资产仅属于你个人，你可以自由以你喜欢的任何方式使用它们，而无需中介的干预。没有像银行这样的中心化机构能够冻结你的账户、没收你的资产或阻止你的交易。


    ### 13.1.2 提高可访问性


    根据世界银行的数据，全球仍有约 17 亿没有银行服务的成年人。这些人在追求许多可能改善其社会经济地位并帮助他们脱贫的金融机会时处于劣势地位。


    遗憾的是，中心化金融机构没有动力针对这一人群。他们为目前没有银行账户的人提供服务所获得的收入，无法覆盖触达他们的成本。相比之下，DeFi 提供者在没有中介的情况下运行，因此他们更愿意服务弱势群体。此外，DeFi
    是无国界且“无需许可”的，因此地球上的每个人（特别是没有银行服务的人群）都可以访问这种负担得起的金融服务。因此，DeFi 具有减少全球贫困的潜力。


    ### 13.1.3 拥有昂贵资产的机会


    另一个 DeFi 应用是资产代币化。资产代币化是创建数字代币来代表所有权。通过创建代表房地产等证券的代币化资产，为以前无法负担的人开放了高价值投资的渠道。任何人都可以从任何地方交易这些代币化资产，而无需投入整个高价值投资。相反，他们可以选择购买或卖出代币化资产。


    ### 13.1.4 透明性


    DeFi 数据是一个开源项目，能够让服务提供者保持诚实。例如，你可以轻松检查储备金、货比贷款利率，甚至跟踪公共人物的交易。让我们研究 DeFi 的一个知名用例：Maker
    DAO。


    ## 13.2 Maker DAO


    MakerDAO 是以坊上的开源平台，是 2014 年创建的去中心化组织。它是以坊上最大的 dApp 之一。MakerDAO 是以坊上的去中心化信贷平台，支持
    Dai——一种去中心化的、抵押的稳定币，其价值挂钩美元。Maker Protocol（称为多抵押 Dai）允许用户通过利用治理批准的抵押品来铸造 Dai。Maker
    Governance 是社区组织并运行的管理各种数字资产的过程。


    Maker Protocol 是第一个在加密社区中获得大规模应用的 DeFi 应用。自 2017 年发布单抵押 Dai以来，这种稳定币的用户采用量大幅增加。事实上，它已成为
    DeFi 运动的推动力量。Maker Protocol 由包括开发者、合作伙伴、个人和其他实体在多元小组设计。它由持有治理代币 MKR 的人员通过执行投票和治理调查的科学治理系统进行管理和治理。


    任何人都可以使用 Maker Protocol 开启 CDP，锁定 ETH 作为抵押，并生成 Dai 作为债务。Dai 债务产生稳定性费用（即持续产生的利息），并在还债时以
    MKR 支付。


    MKR 将被销毁，连同还款的 Dai。用户可以借入相当于抵押品价值 66% 的 Dai（150% 抵押率）。跌破该比例的 CDP 将面临 13% 的罚金并被清算（任何人都可以执行），以使
    CDP 离违约。清算的抵押品将在公开市场上以 3% 的折扣出售。


    Maker 其他代币（MKR）的持有者通过投票决定稳定性费用水平等风险参数来治理系统。MKR 持有者在发生黑天鹅事件时作为最后的防线。如果系统总抵押品价值下降过快，MKR
    将铸并在公开市场上出售以筹集更多抵押品，这将稀释 MKR 持有者的价值。


