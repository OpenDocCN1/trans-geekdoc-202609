    # # Chapter 21 Setting up a Private Ethereum Blockchain Network on Windows


    Setting up a private Ethereum blockchain network is not an extremely difficult
    task for the coders. However, it may be a bit of a challenge for the beginners.
    I will skip some technical details and avoid using some jargon so that everyone
    can understand the basic concepts.


    # ## 21.1 Prerequisites


    Before setting up the network, you need to install the following software:


    +   * Visual Studio Code

    * git

    * NodeJs

    * Ethereum Wallet

    * Geth


    The **go-ethereum** client is commonly referred to as **get**, which is the command
    line interface for running a **full Ethereum node** implemented in Go. By installing
    and running get, you can run a private network or participate in the Ethereum
    main network. By running get, you can perform the following tasks:


    +   * mine real ether

    * transfer funds between addresses

    * create smart contracts and send transactions

    * explore block history

    * and much much more'
