    # Chapter 3


    # Ethereum - The Programmable Blockchain and DApps Platform


    Many alternative cryptocurrencies or simply altcoins have emerged since the successful
    launch of Bitcoin in 2009. There are more than a thousand at the time of writing
    this book. However, none of the cryptocurrencies came close to challenging Bitcoin
    until the invention of Ethereum by Vitalik Buterin.


    # 3.1 A Brief History of Ethereum


    Ethereum was first conceptualized by Vitalik Buterin in 2013. He is a young Russian
    Canadian programming genius (born 1994). In 2014, he cofounded the Ethereum platform
    with Mihai Alisie, Anthony Di Iorio and Charles Hoskinskinson.


    The Ethereum Foundation held an Ethereum crowdsale in July 2014 during which they
    sold 60 million tokens. A total of 12 million Ether (ETH) tokens were created
    so the Ethereum Foundation could expand its development and marketing efforts.
    The Ethereum Mainnet went live on 30 July 2015, with 72 million coins "premined".


    Ethereum broke into the mainstream in early 2017 when the price of ETH increased
    by 1000 percent over the course of a couple of months. This led to a similar rise
    in the price of alternative blockchain tokens, also known as altcoins. It is still
    ranked second behind Bitcoin on Coinmarketcap at the time of writing. Currently
    there are over 1600 altcoins, and this number is still growing.


    # 3.1.1 What is Ethereum?


    Ethereum is an open-source blockchain-based decentralized platform featuring smart
    contracts. Besides that, Ethereum is a programmable blockchain that enables developers
    to build and deploy decentralized applications. Of course, it also offers Ether,
    an alternative cryptocurrency to Bitcoin. It is also a platform for running an
    Initial Coin Offering (ICO), which is a crypto crowdfunding initiative. I shall
    explain ICO in another chapter. Ethereum runs on distributed blockchain. Ethereum
    Virtual Machine (EVM) is the core engine. It is Turing complete machine which
    can perform any logical step. Ethereum serves as a platform for decentralized
    applications (dApps).


    # 3.1.2 Gas, Gas Price and Gas Limit


    As mentioned earlier, you need to understand its terms: gas price and gas limit.


    # 3.1.3 What is Gas?


    Gas is a unit that measures the amount of computational effort it will take to
    execute operations. Operations include sending tokens, deploying a smart contract,
    interacting with anything else. Gas does not come for free, just like paying for
    gasoline.


    # 3.1.4 What is Gas Price?


    Gas price is the amount of Ether you need to pay per unit of gas. It is measured
    in Gwei (1 Gwei = 0.000000001 ETH). Its value is determined by the miners, who
    can refuse to process the transaction with less gas price. The transaction fee
    is paid to the successful miner as a form of incentive. The transaction fee is
    calculated using the following formula:


    For example, for a certain transaction:


    Gas used = 21,000


    Gas price = 6 Gwei or 0.000000006 ETH


    Transaction fee = 21,000 x 0.000000006 ETH = 0.000126 ETH


    You can see the actual output in a smart contract on Etherscan, as shown in Table
    3.1.


    # Table 3.1 Block #1015194


    | Block | 1015194 |

    |---|---|

    | Timestamp | 18 mins ago (May-28-2020 01:01:20 AM +UTC) |

    | From | 0x5a0b54d5dc17e0aadc383d2db4b0a0d3e029c4c (Spark Pool) |

    | To | 0x8fd00f170fdf3772c5ebdcd90bf25731669ba45 |

    | Value | 109.6201869961092145 Ether ($25,796.77) |

    | Transaction Fee | 0.000126 Ether ($0.03) |

    | Gas Used by Transaction Limit | 21,000 |

    | Gas Price | 100,000.000000006 Ether (6 Gwi) |


    In addition, you can incentivize the miners to do your work first by paying more
    gas fees. In this way, you can jump to the front of the queue so that transaction
    can be processed first.

