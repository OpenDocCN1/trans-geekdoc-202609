    # 5.2 Initial Exchange Offering (IEO)


    After the craze of ICOs subsided, two new crypto crowdfunding methods emerged,
    namely Security Token Offering (STO) and Initial Exchange Offering (IEO). Among
    the two, IEO is more popular as STO poses a higher barrier of entry, is more expensive,
    and is subjected to more stringent regulations by the security commission.


    In a recent article, Reuters reported that IEOs have raised $1.5 billion so far
    in 2019, compared with just $836 million from ICOs. A dozen of amazingly successful
    cases of IEOs have driven more project owners to embark on their own IEO journeys.
    Famous IEO cases include the sale of the BitTorrent (BTT) token on the Binance
    Launchpad, raising $7 million in just the first 14 minutes of the sale opening.
    Veriblock did even better, raising $7 million through an IEO on the Bittrex exchange
    in just 10 seconds. An utterly amazing feat! It is safe to say that IEO has taken
    over ICO as the preferred choice of fundraising in the cryptocurrency industry.


    Investors who are still thinking of the good old days of ICO should start changing
    their mindset and focus on investing in IEO projects instead. On the other hand,
    start-ups or enterprises who wish to raise funds in the crypto industry must realize
    that ICO is already dead and IEO is the way to go. Lastly, more exchanges should
    create IEO launchpads to assist projects that wish to raise funds through IEO,
    as this is an untapped niche with immense potential.


    # 5.2.1 What is IEO?


    According to Binance, an Initial Exchange Offering (IEO) is a fundraising campaign
    that is administered by a crypto exchange platform. An IEO allows investors to
    purchase a new cryptocurrency (or token) while raising funds for its crypto project.'
