    Plasma 系统允许任何人创建自己的子链（又称为 plasma 链），这些子链拥有自己的智能合约。因此，Plasma 系统能够根据其智能合约中不同的业务逻辑，创建各种用例。为了确保安全，根链监控器会强制所有
    plasma 链的状态，并在发现欺诈证明时对恶劣行为者进行惩罚。通过这种方式，Plasma 系统使得离链交易成为可能，同时依赖以太坊主链来维护其安全性。


    ## 16.3 Plasma 结构


    Plasma 架构类似于一个树形结构，以以太坊主链为根。子链从根节点分支出来。每个子链反过来也可以生成新的子链，过程持续进行。因此，Plasma 结构构成了区块链的层级体系，如图
    16.1 所示。


    ![](img/2f9952d33ef08341955bca6e2e1_0.png) 图16.1


    ## 16.4 Plasma 是如何工作的？


    Plasma 可以极大提高以太坊区块链的处理速度和吞吐量，因为它允许离链交易，如闪电网络和其他离链技术。


    ## 16.5 状态通道


    Plasma 的概念源于状态通道，但对其进行了改进。状态通道通过创建离链通信通道（又称为状态通道）工作，交易不需要发送到以太坊主链上的智能合约。只有在所有交易完成后（例如，游戏结束），最终状态才会发送到以太坊主链上的智能合约。智能合约将检查交易的合法性并释放资产（如
    ETH）。


    状态通道技术可以提高可扩展性，因为它可以减少以太坊主链上的交易数量。例如，两个玩家之间的状态游戏可能涉及数百次操作。


    ## 16.6 实现 Plasma 的步骤


    Plasma 的工作方式与状态通道类似但又不同。它不是创建子链，而是以太坊主链上创建智能合约。换句话说，智能合约充当子链的根。子链可以使用自己的共识算法，例如权益证明。验证者会定期将子链的状态提交到根链。我们可以通过查看
    Solidity 代码来说明 Plasma 是如何工作的。


    ## 16.7 退出


    Plasma 退出是一种安全机制，允许用户从 Plasma 链中退出并将资金或资产移回根链。当用户希望退出子链时，他或她需要提交退出申请。如果没有欺诈证明，申请将立即通过。Plasma
    仍在演进，现在 Plasma 团队推出了改进版本的 Plasma，即 Cash。


    ## 技术章节


    在本节中，我减少了技术术语，以便非技术背景读者也能理解基础。对于技术人员，希望这些文章对你有所帮助，并激励你构建复杂的区块链内容。


    ## 第17 章 Solidity 与智能合约


    Solidity 是一种高级编程语言，用于在以太坊上创建和实现智能合约。使用 Solidity 创建的智能合约可以用于金融交易、众筹、投票、供应链管理、IoT
    工作流、共享自动化等。它受到了 Python、C++ 和 JavaScript 的影响，适用于以太坊虚拟机（EVM）。因此，对于熟悉 Python、C++
    或 JavaScript 的人来说非常方便且易理解。


    ### 17.1 选择开发智能合约的 IDE


    编写、编译、测试和部署智能合约的最佳工具是 Remix。Remix 是一个基于浏览器的 IDE，提供了内置编译器和运行时环境，无需服务器端组件。


    我们也可以使用其他编辑器编写 Solidity。我建议我们使用 Visual Studio Code 或 Visual Studio 的 Solidity
    插件。对于 Solidity 插件，你需要从以下地址下载：


    https://marketplace.visualstudio.com/items?itemName=Consensus.Solidity


    此外，你可能需要安装 Visual Studio 2019。


    ### 17.2 用 Solidity 编写你的第一个智能合约


    智能合约的数据（可以称为状态）和代码（可以称为函数）的集合，位于以太坊区块链上的特定地址。


    智能合约的第一行始终是：


    `pragma solidity >=0.4.22 <0.7.0;`


    **pragma** 是一个关键字，用于指示编译器如何处理源代码。在这个示例中，pragma 指定源代码是为 Solidity 库版本 0.4.22 或更高版本但不包括
    0.7.0 版本编写的。


    要定义一个合约，我们使用语句：


    ```solidity

    contract contractName {

    }

    ```


    你可以为合约使用任何名称，但有意义的名称更好。例如：


    ```solidity

    contract NewCoin{

    }

    ```


    表示你为一种新的加密货币创建一个合约。


    ### 17.2.1 赋值变量


    接下来，我们想在合约中引入一些变量。首先，让我们分配一些字符串变量和一些整数变量。


    分配字符串变量的语法是：


    ```solidity

    string myName;

    ```


    在 Solidity 中，整数有两种类型：**有符号整数**（signed integer）和**无符号整数**（unsigned integer）。


    有符号整数意味着它可以存储正值或负值，而无符号整数只能存储正值。


    要指定它为无符号整数，我们在新变量名之前使用 `uint` 关键字。


    分配无符号整数的语法如下：


    ```solidity

    uint MyAge;

    ```


    ### 17.2.2 访问修饰符


    你可能想为变量添加私有的或公开的访问修饰符（可见性修饰符）。大多数编程语言将其放在类型之前，例如 `private string`，但在 Solidity
    中，我们将访问修饰符放在数据类型和变量名之间，如下：


    ```solidity

    string private myName;

    string public myName

    uint private MyAge;

    uint public MyAge;

    ```


    '
