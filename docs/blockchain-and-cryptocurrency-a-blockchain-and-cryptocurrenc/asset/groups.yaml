    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_264_0.png)


    Figure 23.3


    Now, select legacy as the seed type, as in Figure 23.4.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_265_0.png)


    Figure 23.4


    Electrum will now display a seed which you must write down in your notebook/paper,
    as shown in Figure 23.5. Keep the seed secret and never share with anyone.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_267_0.png)


    Figure 23.5


    Electrum will now display your Master Public Key (MPK) which you can copy to the
    clipboard and email to your co-signers, as shown in Figure 23.6.


