    wrong in a traditional transaction, you could seek help from the bank or a third-party
    entity to recover your funds.


    On top of that, storing your cryptocurrencies is more difficult than keep your
    fiat currencies. You need special wallets to store your cryptocurrencies with
    a password constitutes of 12 or 24 words seed phrase which is difficult to remember.
    Worse if you lose the seed phrase, there is no way for you to recover your money.
