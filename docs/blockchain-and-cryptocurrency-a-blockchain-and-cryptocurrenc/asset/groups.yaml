    ## 6.7.6 成员服务提供 (MSP)


    Hyperledger Fabric 是一种许可链区块链。因此，每个用户都需要权限才能加入 Fabric 网络。为了获得加入 Fabric 区块链网络的权限，必须对每个用户的身份进行验证和认证。身份非常重要，因为它决定了用户在
    Fabric 网络中对资源的精确权限以及对信息的访问权限。


    为了验证身份，我们必须采用一个信任的权威。在 Hyperledger Fabric 中，这个信任的权威就是成员服务提供（MSP）。成员服务提供是一个定义了身份验证、认证以及允许访问网络规则的组件。MSP
    管理用户 ID 并验证想要加入网络的客户端。这包括为这些客户端提供提交交易的凭据，定义成员可能扮演的特定角色，以及定义网络和通道上下文下的访问权限。


    MSP 使用证书机构（Certificate Authority）在确认身份后对用户证书进行认证或撤销。在 Fabric 中，供 MSP 使用的默认证书机构接口是
    Fabric-CA API。然而，组织可以选择实现他们心仪的外部证书机构。Hyperledger Fabric 支持许多类型的外部证书机构接口。因此，单个
    Hyperledger Fabric 网络可以由多个 MSP 控制。


    ## 6.7.7 认证过程


    在认证过程中，Fabric-CA 识别并验证应用、节点、背书者和排序器的身份。接下来，使用签名算法和签名验证算法生成签名。签名算法利用与其各自身份相关的实体凭据，并输出一个背书（endorsement）。生成的签名是一个绑定到特定身份的字节数组。


    在接下来的步骤中，如果签名字节数组与输入背书的有效签名匹配，签名验证算法将接受该请求（加入网络），否则将拒绝该请求。如果用户被接受，他或她就可以查看网络中的交易并与网络中的其他参与者进行交易。相反，如果用户被拒绝，他或她将无法向网络提交交易或无法查看任何之前的交易。


    ## 第 7 章


    # 无区块分布式账本技术 (DLT)


    到目前为止，我们讨论了由区块组成的区块链平台。然而，区块链只是分布式账本技术（DLT）的一个子集。在本章中，我们将探索与比特币、以太坊和其他区块链及 DLT
    系统同步演化的两种无区块 DLT 平台。


    ## 7.1 IOTA


    从连接移动设备到可穿设备设备到智能家居，物联网开始渗透到我们生活的方方面面。物联网技术的采用正在培养一种由这些技术培育的新型经济。由于这种经济是由机器对机器（M2M）通信驱动的，它也被称为机器经济。预见到机器经济巨大的增长潜力，IOTA
    平台的开发旨在开发物联网行业。


    根据 IOTA 基金会的数据，预计到 2025 年连接设备的数量将达到 750 亿。物联网（IoT）包括道路、桥梁、铁路轨道上的微传感器、手机、智能洗衣机、智能无人机、智能手表等可穿戴电子设备。所有这些设备产生和消耗的数据量是天文数字。


    预计在未来五年内，到 2021 年，物联网网络全球 IP 流量将增长五倍，人均每月 IP 流量预计达到 31 GB。然而，在同一时期，宽带速度预计只会翻倍，全球数据管道将面临拥堵。


    那么，所有这些设备将无法 24/7 全天连接到中央化的云孤来处理它们将产生的所有数据。


    最近，“雾”（Fog）和“云”（Mist）计算的出现可能为该问题提供解决方案。然而，在这一新的机器经济中，如何跨物联网生态系统高效地分配资源仍然是一个巨大的挑战。因此，IOTA
    的概念化设计载着解决拥堵问题的使命。通过实施零手续费交易，这些设备可以在分布式网络中本地实时共享技术资源。通过这种方式，它可以避免中心单点故障，消除资源基础设施的瓶颈。


    ### 7.1.1 IOTA 的愿景


    IOTA 的愿景是通过真理验证和交易结算使所有连接设备设备能够运行，从而激励设备实时提供其属性和数据。此外，开发了 IOTA 货币以实现机器对机器（M2M）交易，从而创建了由
    IOTA 驱动的机器经济。


    IOTA 的主要目标是通过实现零费用 M2M 交易来服务机器经济。IOTA 通过提供高效、安全、轻量级、实时的无费用微交易，已确立了自己在物联网金融科技领域的领先地位。它是开源的，并专为物联网设计。其使用
