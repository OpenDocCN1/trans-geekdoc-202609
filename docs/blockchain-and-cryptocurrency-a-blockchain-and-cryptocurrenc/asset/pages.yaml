- pgno: 52
  md: 'Even if the transaction fails, you still need to pay for the transaction fee
    fee because the miners must validate and execute your transaction.


    # 3.1.5 Gas Limit


    The gas limit is an estimation of the total amount of work to perform a transaction.
    It is not easy to compute the gas limit. Fortunately, there are many apps that
    set the limit for us. Typically, 21,000 gas will satisfy most transactions. However,
    for more complex transactions such as sending ETH to an ICO smart contract, the
    gas limit will be much higher. The reason is because such a transaction requires
    much more computational power.


    If you set the limit too low, your transaction may take too long to process and
    even fail. As a result, you will lose ETH for nothing. On the other hand, if your
    transaction was completed before reaching the gas limit, you get back the balance
    ETH. The gas limit protects you from spending unlimited ETH, just like how banks
    set your credit card limit so that you will not overspend.


    # 3.2 Smart Contracts


    A smart contract is a computer code that can facilitate the exchange of money,
    content, property, shares, digital assets, or anything of value among disparate
    and anonymous parties without a middle entity.


    When a smart contract is installed in a blockchain system, it behaves like a self-operating
    computer program that automatically executes when specific terms and conditions
    are met. Because smart contracts run on the blockchain, they run exactly as programmed
    without any possibility of censorship, downtime, fraud, or third-party interference.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'On the Ethereum Blockchain Platform, a user can send some Ether to another
    user in exchange for something of value where the transaction is executed automatically
    based on a smart contract. In the case of Cryptokitties, a smart contract is executed
    when a user acquires a unique virtual kitty from the Cryptokitties collectible
    marketplace via a bidding process, where the highest bidder gets to own the digital
    asset.


    On the other hand, a transaction occurs automatically between two smart devices
    using an integrated system of IoT technology and blockchain, smartphone A can
    up data for another smartphone B after A receives money from B. The transaction
    occurs purely on a smart contract without the awareness of the owners.


    Contrary to popular belief, the smart contract was not invented by Vitalik Buterin,
    the founder of Ethereum. In fact, the idea of the smart contract was first conceived
    by computer scientist and cryptographer Nick Szabo in 1993 as a kind of digital
    vending machine. In his famous example, he described how users could input data
    or value, and receive a finite item from a machine, in this case, a real-world
    snack or a soft drink. Nick Szabo is so smart that some people believe he could
    be Satoshi Nakamoto, who invented Bitcoin.


    In addition, though Ethereum was the first blockchain system to adopt smart contract
    technology, it is not the only one using smart contracts. Many non-Ethereum blockchain
    platforms such as Tron, Hyperledger Fabric, Hyperledger Sawtooth and Corda implement
    their own versions of smart contracts. The smart contract in Hyperledger Fabric
    is called Chaincode that runs in a container known as docker.


    Today, most blockchain platforms run on the Ethereum Virtual Machine (EVM) and
    implement Ethereum smart contracts, while a few enterprise blockchain platforms
    implement their own version'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'of smart contracts. However, there could be interoperability between the Ethereum
    platform and the enterprise platforms. For instance, in the Sawtooth-Ethereum
    integration project, EVM (Ethereum Virtual Machine) smart contracts can be deployed
    to Sawtooth using the Seth transaction family. Hyperledger technologies in another
    chapter.


    # 3.2.1 Solidity


    Solidity is a high-level programming language that is used to create and implement
    smart contracts on the Ethereum platform. The smart contracts created using Solidity
    can be used for financial transactions, crowdfunding, voting, supply chain management,
    IoT implementation, ride sharing automation, smart city administration and more.
    Besides that, it can be used to develop decentralized applications.


    Solidity has Python, C++ and JavaScript influences. Therefore, it is convenient
    and easy to grasp for those that are already familiar with Python, C++ Or Javascript.


    # 3.2.2 Writing and Deploying the Smart Contract


    The best tool to write, compile, test and deploy smart contracts is Remix. Remix
    is a browser-based IDE that provides an inbuilt compiler as a run-time environment
    without server-side components. You can access Remix from the following link:
    https://remix.ethereum.org.


    We can also use other code editors for Solidity. I suggest you use Visual Studio
    Code or Solidity Plugin for Visual Studio. You need to download the Solidity Plugin
