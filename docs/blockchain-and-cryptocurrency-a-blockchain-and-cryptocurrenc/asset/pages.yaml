    # Spare Parts Liability Resolution


    In case a spare part needs to be replaced due to failure, liability needs to be
    established and this requires tracing the part back to the manufacturer. If parts
    are identified and digitally represented on the blockchain, it offers an accurate
    way to trace the origin. Liability is thus clearly established and is transparent
    to all parties in the blockchain. Any liability disputes can be resolved much
    faster and resources can be focused on customer engagement.


    # Vehicle Recall Optimization


    Many of the recalls involve product defects that are life-threatening, and automakers
    are exposed to a huge liability. With blockchain technology the car and the individual
    assembled parts can be uniquely represented on the blockchain. If automakers have
    accurate visibility on which defective parts were installed in which cars, then
    the scope of the recall can be precisely executed. This will result in massive
    cost savings for the manufacturer.


