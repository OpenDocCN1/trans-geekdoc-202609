    # # Creating Multisig Wallet


    Companies that are managing crypto assets for its investors need to keep their
    crypto assets in a safe and secure way. The best solution is to keep the crypto
    assets is to store them in a multisig wallet. Example of such companies are crypto
    exchanges, crypto custodial service companies, crypto index fund companies, crypto
    hedge fund companies and more.


    The multisig wallet is one where you need control over multiple private keys to
    spend from that wallet. The address in the multisig wallet has multiple private
    keys behind it. The idea with multisig wallets is that multiple people can cooperatively
    control the funds in the wallet. With multisig, it allows users to have one bitcoin
    address with multiple key holders, thus ensuring funds


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_259_0.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'from the address cannot be spent until all key holders sign off on it. It will
    add security and instill confidence in the investors.


    The multisig wallet can be entrusted to a committee or council where members can
    comprise the management team and selected investors. Each member holds his or
    her private key for signing the wallet. Nobody can withdraw or spend the funds
    unless all members agree to do so by using their private keys to sign the transaction.


    # 23.1 Steps in Creating a Multisig Wallet


    We will be using Electrum to create the multisig wallet. Electrum is a lightweight
    Bitcoin client, based on a client-server protocol. Electrum is known to be the
    safest Bitcoin wallet in the world.


    # Step 1 Installation of Electrum


    First, you must install Electrum on your PC, laptop, or mobile phone. For PC and
    laptop, you can download Electrum from the following link :


    https://electrum.org/#download


    After downloaded the file, click and install the Electrum based on your operating
    systems. For mobile phones, you can install it from Google Playstore. I prefer
    installing the mobile version because it is easier and has less issue. Our demos
    here will be based on the Mobile Version.


    # Step 2 Decide the number of co-signers


    The different individuals or devices that are involved in signing the multisig
    wallet are called co-signers . You can create a multisig wallet with 3 cosigners
    of which at least 2 must sign'
