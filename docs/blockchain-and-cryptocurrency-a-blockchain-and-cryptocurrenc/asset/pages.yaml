  md: "# Directory Structure\n\nThe default Truffle directory structure contains the\
    \ following\\folders and files:\n\n+   - contracts/: Contains the Solidity source\
    \ files for our smart\ncontracts. There is an important contract in here called\
    \ Migrations.sol, which we will discuss later.\n- migrations/: Truffle uses a\
    \ migration system to handle smart\ncontract deployments. Migration is an additional\
    \ special\\smart contract that keeps track of changes.\n- test/: Contains both\
    \ JavaScript and Solidity tests for our\ncontracts.\n- Truffle.Js: Truffle Configuration\
    \ File.\n\n# Step 3 writing the smart contract\n\nWe shall write the smart contract\
    \ that will act as the backend\nlogic and storage.\n\nCreate a new file named\
    \ Adoption.sol in the contracts/ directory.\nTo save time, please download the\
    \ file from:\n\nhttp://javascript-\ntutor.net/blockchain/download/contracts/Adoption.sol\n\
    \nAdoption.sol\n\n```\npragma solidity ^0.4.24;\ncontract Adoption {\n    //array\
    \ of 16 addresses, 20 bytes\n    address[16] public adopters;\n// Adopting a pet\n\
    \    function adopt(uint petId) public returns (uint) {\n```"
