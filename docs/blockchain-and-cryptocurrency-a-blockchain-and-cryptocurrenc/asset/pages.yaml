  md: 'Anyone can use the Maker Protocol to open a Collateralized Debt Position (CDP),
    lock ETH as collateral, and generate Dai as a debt against that collateral. Dai
    debt incurs a stability fee (i.e., continuously accruing interest), which is paid
    (in MKR) upon repayment of borrowed Dai.


    The MKR is burned, along with the repaid Dai. Users can borrow Dai up to 66% of
    their collateral value (150% collateralization ratio). CDPs that fall below that
    rate is subject to a 13% penalty and liquidation (by anyone) to bring the CDP
    out of default. Liquidated collateral is sold on an open market at a 3% discount.


    Holders of Maker''s other token (MKR) govern the system by voting on, e.g., risk
    parameters such as the stability fee level. MKR holders also act as the last line
    of defense in case of a black swan event. If the systemwide collateral value falls
    too low too fast, MKR is minted and sold on the open market to raise more collateral,
