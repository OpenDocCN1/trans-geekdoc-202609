  md: 'Cotton Producers: Small firm holder cultivates and harvests the cotton crops,
    which are delivered to ginners. For traceability, cotton producers can give a
    unique code or tag to their raw cotton.


    Giners: Cotton bales are classed according to fiber strength, length, color, non-fiber
    content and fineness. Ginners sell cotton bale to various cotton traders.


    Traders: Traders usually buy cotton bale from various sources and sell it to spinning
    mills all over the world. So, traceability, cotton bales need a bar code or tag.


    Spinners: Spinning mills buy cotton bales from several traders. Using a traceability
    system, they can get information about their cotton bales.


    Fabric Mills: Fabric mills buy yarn from various sources. Sometimes, it can come
    from foreign spinning mills. So, traceability can be more complex.


    Dyeing & Washing Unit: Sometimes fulfils fabric demand. Fabric mills may have
    a subcontract with another unit or engage in outsourcing.


    Garment Manufacturers: Every garment manufacturer buys fabric from various sources.
    And sometimes they have a hidden subcontract with other units.


    Retailers: Retailers are the final seller to consumers. Due to sustainability
    issues, they want to trace their whole supply chain. Every product could have
    a unique code or barcode that gives customers all the information about that product,
    from cotton production to retailer.'
