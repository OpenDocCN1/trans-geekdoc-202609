    # 7.2.1 Key Concepts of Corda


    Corda is an open source blockchain project, designed for business from the start.
    It allows businesses to build interoperable blockchain networks in strict privacy.
    Like Ethereum, Corda also features smart contracts that facilitate direct transactions
    among businesses. However, its smart contracts are written in Java and other JVM
    languages instead of Solidity. Also, it enables the development and deployment
    of distributed apps called CordDApps.


    In addition, the Corda platform implements the flow framework to manage communication
    and negotiation between participants in the network. The Corda network is made
    up of a peer-to-peer network of nodes. One of the key concepts of Corda is its
    network service known as the notary. The notary service provides uniqueness consensus
    for verification of transactions.


    # 7.2.2 The Corda Architecture


    Although we often refer to Corda as a blockchain platform, strictly speaking,
    it is not a blockchain-based ecosystem. It is a kind of decentralized ledger technology
    network system that is not built by blocks. Instead, it looks a bit like the Tangle
    system in IOTA.


    # 7.2.3 The Corda Network


    The Corda network is an authenticated peer-to-peer network of nodes. Each node
    is a JVM runtime environment hosting Corda services and executing applications
    known as CorDApps. We can visualize the Corda network as a fully connected graph.
    The'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'nodes on the graph can communicate with other nodes, as shown in figure 7.8.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_105_0.png)


    Figure 7.8


    # 7.2.4 How does Corda differ from other DLT Platforms?


    The Corda platform is different from other DLT platforms because the structure
    is blockless. Also, the way it propagates data is different. Other DLT platforms
    use global broadcast and gossip networks to propagate data. However, Corda does
    not employ the global broadcast method. Instead, it uses point to point messaging
    to transmit data.


    According to the Corda white paper, all communication between nodes is direct,
    with TLS-encrypted messages sent over the AMQP. This means that data is shared
    only on a need-to-know'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'basis. (TLS stands for Transport Layer Security. AMQP stands for Advanced Message
    Queuing Protocol, an open standard application layer protocol for message-oriented
    middleware.)


    Corda nodes discover each other via the Network Map Service. The network map service
    publishes the IP addresses through which every node on the network can be reached.
    Also, it broadcasts the identity certificates of those nodes and the services
    they provide. You can imagine the service as a phone book, which publishes a list
    of peer nodes containing information.


    # 7.2.5 The Doorman


    Corda networks are semi-private, which means it needs to impose a kind of gateway
    control before a node can join a network. This control is called doorman. Each
    network has a doorman service that enforces rules regarding the information that
    nodes must provide. These nodes need to go through the know-your-customer (KYC)
    process before being admitted to the network.


    To join the network, a node must contact the doorman and provide the required
    information. If the doorman is satisfied, the node will receive a root-authority-signed
    TLS certificate from the network''s provisioning service. This certificate certifies
    the node''s identity when communicating with other participants on the network.'
