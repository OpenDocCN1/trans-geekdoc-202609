  md: '# Chapter 22


    # Deploying Smart Contracts on Ropsten

    Testnet through Ethereum Remix


    You have learned how to use the truffle framework in Visual

    Studio Code and node.js to deploy the smart contracts within a

    local test environment.


    The next step is to try different test environments available to

    us. This chapter will guide you to deploy the same smart contract

    code on Ethereum remix IDE (IDE—Integrated Development

    Environment) on the Ropsten test net.


    We need


    +   - Metamask (Install as Google Extension)

    - Remix-Solidity IDE (https://remix.ethereum.org)

    - Ropsten Test Network


    MetaMask is a bridge that allows you to access the decentralized

    distributed web of blockchain in your browser today. It

