    # 2.7 How to achieve Proof of Work?


    Mining involves the process of producing a hash whose value is less than the target
    value. When this hash has been found, it is called a valid hash and hence proof
    of work is achieved.


    The mining algorithm uses a counter known as the nonce to generate the hash using
    the SHA256 cryptographic function. A hash algorithm always produces the same arbitrary
    length data given the same inputs. It is impossible to compute the same hash with
    two different inputs. It is also impossible to predict the output of any given
    data in advance.


    The value of nonce is initialized to 0. Mining is finding the nonce, the only
    input that changes every time we run the hash function. The goal is to find a
    value for the nonce that will result in a hash lower than the target. So, the
    mining node might need to try billions or trillions of nonce values before it
    gets a valid hash. As you can see, mining is like playing the slot machine, there
    is no way to predict when you strike a jackpot.


    It is quite easy to prove that the nonce found indeed produces a valid hash. All
    the information is available, everyone in the network can run the hash function
    and confirm if the hash is'
  merge: -1
  img_proc: true
