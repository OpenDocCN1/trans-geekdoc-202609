  md: '# Chapter 4


    # Storing your Cryptocurrencies


    Since the introduction of bitcoin by Satoshi Nakamoto in 2009, and the exponential
    price hike of bitcoin in recent years, using bitcoin as an investment instrument
    is becoming more and more popular.  The emergence of Ethereum and altcoins has
    further pushed the craze of investing in cryptocurrencies to new heights.


    As more and more people buy and trade cryptocurrencies, storing the digital currencies
    securely have become a topmost concern. The frequent incidents of exchange hacking
    causing the loss of billions of dollars in crypto assets have triggered a wave
    of fear among cryptocurrency holders. Therefore, choosing a secure wallet is the
    first step you must undertake before investing in cryptocurrencies.


    However, transacting cryptocurrencies is not as easy as transacting the fiat currencies.
    The technical difficulties in transferring cryptocurrencies could be a nightmare
    for many people. Since cryptocurrencies are managed by decentralized platform
    without interference from any third-party entity, anything goes wrong in the transaction
    can result losing your cryptoassets forever. In the contrary, if anything goes
    wrong in a traditional transaction, you could seek help from the bank or a third-party
    entity to recover your funds.


    On top of that, storing your cryptocurrencies is more difficult than keep your
    fiat currencies. You need special wallets to store your cryptocurrencies with
    a password constitutes of 12 or 24 words seed phrase which is difficult to remember.
    Worse if you lose the seed phrase, there is no way for you to recover your money.
    On the other hand, if you forgot your bank account password, you could click forget
    password and reset your password through an email.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'To alleviate your fear, I would like to discuss how to choose a wallet to store
    your cryptocurrencies securely.


    # 4.1 Crypto Wallet


    To store, send, and receive your cryptocurrencies, you must use a crypto wallet.
    Crypto wallet is a secure digital wallet used to store, send, bitcoin as well
    as other digital currencies. It is a software that allows you to monitor and conduct
    cryptocurrency transactions. Technically the crypto wallet is connected to the
    blockchain via a node and uses a method called simplified payment verification
    (SPV) to verify transactions. Most cryptocurrencies have official wallets, or
    some officially recommended third-party wallets.


    The crypto wallet does not actually store the cryptocurrency in the wallet. It
    is a support system for storing the addresses of public and private keys of cryptocurrencies,
    cryptocurrency settlement, and cryptocurrency transactions. Sometimes the system
    even includes the accounting and maintenance of the entire blockchain. The actual
    amount is based on the final recorded result of the blockchain.


    # 4.2 Types of Crypto Wallets


    Due to the rapid development of cryptocurrencies, different types of crypto wallets
    have been developed to cope with various usage scenarios.


    According to the degree of decentralization, crypto wallets can be divided into
    full-node wallet, light wallet, and centralized wallet.


    In terms of the private key storage method, the crypto wallet can be divided into
    cold wallet and hot wallet'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 4.2.1 Full Node Wallet


    This kind of wallet must be installed with a software. After installation, it
    will synchronize with the entire blockchain and store the entire blockchain, so
    when the new wallet starts to synchronize, it must be downloaded from the first
    data, which will take hours to days and takes a lot of storage space and online
    traffic. Such a wallet is also called a full node. Ethereum Wallet is one of the
    full-node wallets.


    # 4.2.2 Hot Wallet


    A hot wallet refers to a crypto wallet that is online and connected to the blockchain
    via a node . The hot wallet is generally designed as a web page. After the website
    generates the private key, it is kept by an individual. When you want to access
    the wallet in the future, you must enter the private key. The website is not responsible
    for saving it for the user.


    One class of hot wallet is known as SPV wallet (simplified payment verification)
    wallet, also known as light wallet. This kind of wallet only stores private keys
    and settlement, and does not store the entire blockchain, so it occupies few resources
    and is more suitable for mobile devices. One of the most used web versions of
    SPV wallet is MetaMask, which stores Ethereum and ERC20 tokens . For Bitcoin,
    a good example of the SPV wallet is Electrum, one of the best Bitcoin wallets.
    You can easily install the mobile version of Electrum from Google Play Store.
    It allows you to create a standard wallet or a multisig wallet.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_61_0.png)


    Figure 4.1


    # 4.2.3 Centralized Wallet


    Centralized wallets, also called escrow wallets, are divided into two types:


    +   - **Online wallet**: Generally designed as a web page, while keeping your
    private key. Such wallets have a higher risk, because storing your private key
    is equivalent to storing the cryptocurrency assets under your private key. One
    example is Coinbase.


    +   - **Exchange Wallet**: Each exchange will also provide the wallet address
    corresponding to the cryptocurrency. This type of wallet keeps the private keys
    of the users, funds can only be withdrawn by the exchange mechanism. Examples
    are Binance, Huobi, Luno and more.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 4.2.4 Cold Wallet


    Wallet is also known as offline wallet. Cold wallets usually rely on "cold" devices
    (non-networked computers, mobile phones, hardware wallets, paper wallets etc.)
    to ensure the security of the cryptocurrency private key. It uses QR code communication
    to keep the private key from connecting to the network, avoiding the risk of private
    key theft. However, cold wallets may still face physical security risks (such
    as computer loss, damage, etc.).


    Hardware wallets are physical devices that store public addresses and private
    keys for cryptocurrencies offline in an encrypted device. It is a USB-like device
    with an OLED screen and side buttons to navigate through the interface of the
    wallet and comes with native desktop apps for different cryptocurrencies. It can
    be connected to a PC or mobile device via USB when you need to transfer funds
    in and out of the wallet.


    A hardware USB wallet typically costs between $70-$150 but it is still cheap compared
    to the value of your cryptocurrencies stored in the hardware wallet. Two of the
    most popular hardware wallets that allow you to store more than 22 cryptocurrencies
    and 500 ERC-20 tokens are Ledger Nano S and Trezor.'
  merge: -1
