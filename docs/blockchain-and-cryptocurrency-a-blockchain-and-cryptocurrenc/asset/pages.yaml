- pgno: 191
  md: 'Now that we have successfully compiled our contracts, it''s time to migrate
    them to the blockchain! Migration is the deployment script meant to alter the
    state of the application''s contracts, moving it from one state to the next. For
    the first migration, you might just be deploying new code, but over time, other
    migrations might move data around or replace a contract with a new one. By the
    way, there is one JavaScript file already in the migrations/ directory: **1_initial_migration.js**.
    This file handles deploying the **Migrations.sol** contract to observe subsequent
    smart contract migrations and ensures we do not double-migrate unchanged contracts
    in the future. Now let us create our new migration script.


    Create a new file 2_deploy_contracts.js in the migrations/directory. To save time,
    download the file from the following link:


    http://javascript-tutor.net/download/contracts/2_deploy_contracts.js


    Before we can migrate our contract to the blockchain, we need to have a blockchain
    running. We shall use Ganache, a personal blockchain for Ethereum development
    you can use to deploy contracts, develop applications, and run tests. If you have
    not already, download Ganache and double click the icon to launch the application.
    This will generate a blockchain running locally on port 7545. Launch Ganache and
    you get the following output as shown in Figure 18.3'
