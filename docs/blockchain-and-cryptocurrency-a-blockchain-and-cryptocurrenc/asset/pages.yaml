  md: '# 8.2 Blockchain-Based P2P Lending


    Traditional P2P lending models are facing many issues. For example, the cost of
    onboarding customers remains high, so investors are wary of this kind of investment
    model. Besides that, this area is heavily regulated by the securities commission
    in most countries. While a handful of P2P companies have been approved to operate
    their businesses, many P2P operators who failed to obtain a license are facing
    the nightmare of shutting down.


    Conventional P2P lending cannot allow borrowers and investors to directly match
    financing, but rather needs to be handled as a credit intermediary through the
    P2P lending platform. The financing cost is increased because of the need to pay
    the agency fee. Other issues include the limited scalability of P2P lending services
    on an international scale. This is due to the problems of loan repayment guarantees,
    as well as regulatory issues (rules and regulations vary from country to country).
    There is also an urgent need to accelerate the process of granting loans.


    Although P2P lending platforms are supposed to be operating in a decentralized
    manner, they are still largely operating in a centralized model. Data is usually
    stored and maintained on a central database, which might lead to human errors
    and manipulation of data.


    On the contrary, data stored on a blockchain are stored on the decentralized and
    distributed network, where every stakeholder has access to a copy of the same
    ledger. Furthermore, data on the blockchain is immutable, so no party can alter
    or manipulate the stored data. These characteristics of the blockchain will greatly
    enhance data security, increase transparency, and instill trust amongst stakeholders.
    Therefore, blockchain is the perfect solution to solve the woes of current'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'P2P lending models. Indeed, a dozen companies have started to deploy blockchain-based
    P2P lending platforms.


    Blockchain-based P2P businesses are broadly divided into two models, the hybrid
    model, and the pure cryptocurrency model. The hybrid model involves using cryptocurrency
