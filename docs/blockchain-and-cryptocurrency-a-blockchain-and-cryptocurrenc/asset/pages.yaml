- pgno: 93
  md: '# Chapter 7


    # Blockless Distributed Ledger Technologies (DLT)


    So far, we have discussed blockchain platforms that are made up of blocks. However,
    blockchain is only a subset of distributed ledger technologies (DLT). In this
    chapter, we shall explore two blockless DLT platforms that have evolved alongside
    Bitcoin, Ethereum and other blockchain and DLT systems.


    # 7.1 IOTA


    From connected mobile devices to wearable devices to smart homes, the Internet
    of Things is beginning to permeate every aspect of our lives. The adoption of
    IoT technologies is fostering a new economy nurtured by these technologies. As
    this kind of economy is powered by machine to machine (M2M) communication, it
    is also known as the machine economy. Foreseeing the huge growth potential in
    machine economy, the IOTA platform was developed to tap into the IoT industry.


    According to the IOTA foundation, the number of connected devices is estimated
    to reach 75 billion by 2025. Internet of Things (IoT) includes tiny sensors on
    roads, bridges, railway tracks, mobile phones, smart washing machines, smart drones,
    wearable electronics like smartwatches and more. The amount of data being produced
    and consumed by all these devices is becoming astronomical.


    Over the next five years, it is predicted that the global IP traffic on the IoT
    network will increase five-fold by 2021, and monthly IP traffic is expected to
    reach 31 Gigabytes per capita. However, for the same period, broadband speeds
    are expected only to double, and the global data pipelines will experience congestion.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '92


    Then, it will will not be possible for all these devices to stay connected 24/7
    to the centralized cloud silos for all the data they will generate.


    Recently, the emergence of ''Fog'' and ''Mist'' computing might provide a solution
    to the issue. However, how to distribute resources efficiently across the IoT
    ecosystem remains a huge challenge in this new machine economy. Therefore, IOTA
    was conceptualized with the mission to tackle the congestion issue. By implementing
    zero fee transactions, these devices could share the technological resources in
    real-time locally in a distributed network. In this way, it can avoid the centralized
    points of failure, eliminating the resource infrastructure bottleneck.


    # 7.1.1 The Vision Of IOTA


    The vision of IOTA is to enable all connected devices through verification of
    truth and transactional settlements, which incentivize devices to make available
    its properties and data in real time. In addition, the IOTA cryptocurrency was
    developed to enable machine to machine (M2M) transactions, thus creating the machine
    economy powered by IOTA.


    The main objective of IOTA is to serve the machine economy by enabling zero fee
    M2M transactions. IOTA has established itself as the leader in the IoT fintech
    landscape by providing efficient, secure, lightweight, real-time microtransactions
    without fees. It is open source and engineered specifically for the Internet of
    Things. Its real-time microtransactions using the IOTA cryptocurrency has created
    an ecosystem that is ready and flexible for scale.


    # 7.1.2 The Tangle


    IOTA technology is like the blockchain technology, but it is not blockchain-based.
    In fact, it utilizes a kind of distributed ledger technology minus the blocks.
    IOTA is a permissionless'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'distributed ledger that utilizes a cutting-edge technology, known as Tangle.
    Tangle is a new data structure based on a Directed Acyclic Graph (DAG). As opposed
    to blockchain, it has no blocks, no chain, and no miners. This unique architecture
    enables IOTA to work differently compared to blockchains and other Distributed
    Ledger Technologies.


    # 7.1.3 The Core Principles


    IOTA uses a DAG instead of a blockchain to store its ledger. The main objective
    is to solve the scalability issue. As we all know, blockchain has an inherent
    transaction rate limit, due to the conflict between block sizes and block issuance
    rates. If blocks are issued too frequently, or are too large, forks will occur
    often. When a fork happens, new blocks are added to the chain simultaneously,
    and the network needs to decide between them, thus slowing down the validation
    process.


    In a DAG, forks can still occur but unlike in a blockchain, a fork is not final.
    In the DAG system, diverging branches can still be merged back together, if they
    are consistent with each other. The transaction rate is therefore bounded only
    by the latency between the nodes. A DAG favors availability over consistency.


    # 7.1.4 The Tangle Structure


    Tangle is a Directed Acyclic Graph (DAG). In computer science, a directed graph
    is a collection of vertices (squares), which are connected to each other by edges
    (arrows). In the IOTA Tangle data structure, the vertices represent transactions,
    and the edges represent approvals. It retains the blockchain features that include
    distributed ledgers, immutability, and secure transactions, but it does not utilize
    the blocks.


    The Tangle structure is shown in Figure 7.1.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Figure 7.1 The Tangle Structure


    With reference to Figure 7.2, if there is an edge (arrow) directing node (vertex)
    100 to node 99, it means that node 100 approves the transaction at node 99. When
    a node issues a new transaction, it must choose 2 previous ones to approve, thereby
    adding 2 new edges (arrows) to the graph. Notice that each node must be connected
    to two previous nodes.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_96_0.png)


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_96_1.png)


    # Figure 7.2


    The first transaction in the Tangle is referred to as the genesis. All the IOTA
    tokens were created in the genesis, and no new'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'will ever be be created. All transactions in the tangle reference the genesis
    directly or indirectly.


    Transactions with no approvers are called tips. In the figure above, node 100
    is a tip because no one has approved its transaction yet. All the nodes must choose
    tips to approve, rather than older transactions, because this helps move the network
    forwards. The method for choosing which two tips one should approve is one of
    the key innovations of IOTA.


    Now, let us examine how tips are selected. We shall also discuss transaction rates
    and the concept of random walk. In IOTA tangle, transactions do not occur uniformly
    but rather randomly. At a certain period, there may be m transactions while another
    period there may be n transactions, where m>n or n<m. The transaction rate can
    be determined by a mathematical process known as the Poisson Point Process. The
    Poisson Point Process model is used to analyze random events, such as the arrival
    of customers at a store, phone calls at a call center or occurrence of earthquakes,
    distributed in time


    The transaction rate may be calculated based on the simplified Poisson Point Process
    formula as follows:


    ```

    N = λ

    ```


    N is the number of transactions and t is the time unit. λ is a constant. For example,
    if we set λ = 5, and time unit = 10 (the unit could be in milliseconds or seconds
    etc.), the number of transactions occurring in a 10-unit interval is 5×10 = 50.


    Setting a suitable value of λ is crucial to maintaining the coherence of the Tangle
    structure. If we set the value of λ to be exceedingly small, let us say 0.1, and
    the number of transactions'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'remains at 50, the time interval will be 50 ÷ 0.1 = 500. In this case, it means
    that transactions will come in so slowly that it will form a chain instead of
    a Tangle, such that only one single tip can be approved at any given time, instead
    of approving two previous transactions. The scenario is illustrated in Figure
    7.3.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_98_0.png)


    Figure 7.3


    What will happen if we set the value of λ too high? For example, if λ = 10000
    and N = 50, the time interval t is 0.0005. It means that transactions will be
    occurring so fast that the only tip they can view is the genesis node, as illustrated
    in Figure 7.4.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_99_0.png)


    Figure 7.4


    In both cases, the Tangle structure will crumble.


    # 7.1.5 Unweighted Random Walk Algorithm


    The tips selection algorithm we have discussed so far is a random selection process.
    This kind of selection process might not be suitable for real use cases. Therefore,
    we need to choose a more advanced tip selection algorithm. One of the algorithms
    is known as the unweighted random walk.


    What is it? In programming, a walker is a variable used to move through an array
    or other data structure, often heading towards a fixed value and stepping through
    elements in an array. In Tangle, we can program a walker on the genesis transaction,
    and make it walk towards the tips.


    On each step, it walks to one of the transactions which directly approves the
    one we are currently on. It chooses which transaction to walk with equal equal
    probability, therefore it is called unweighted random walk.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '98


    Though unweighted random walk (URW) is quite useful, it has its weakness that
    could crash the IOTA ecosystem. Fortunately, there is a better tips selection
    method known as the weighted random walk (WRW).


    # 7.1.6 The Lazy Tips


    The main issue of using the URW algorithm is the occurrence of lazy tips. Lazy
    tips are tips that choose to approve some old transactions rather than actively
    looking to approve new transactions. We label them lazy tips because they could
    not be bothered to update the latest state of the IOTA Tangle network. Instead,
    they choose to broadcast its transactions based on old data. Let us examine figure
    7.5.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_100_0.png)


    Figure 7.5


    With reference to the diagram above, to transaction 17 and transaction 18 are
    lazy tips as they only approved some old transactions, as shown clearly in the
    diagram. If we employ the unweighted random walk selection method, these two tips
    have equal chances to get approved as other tips. Their behaviors would not even
    be penalized by the IOTA system. If too many'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'lazy tips exist in the system, the Tangle will become stagnant or simply fail,
    as illustrated in Figure 7.6.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_101_0.png)


    Figure 7.6


    In the diagram above, we notice that transactions 30 to 38 choose to approve incredibly
    old transactions, leaving transactions 25 to 29 unapproved or orphaned. In such
    a situation, the Tangle structure will just stop propagating and eventually crumble.


    # 7.1.7 Weighted Random Walk


    How should we overcome the ‘Lazy Tips’ phenomenon? We might impose a rule that
    requires all incoming transactions to approve recent transactions. However, this
    coercive way is against the principles of decentralization and democracy, the
    core of decentralized ledger technologies. Therefore, IOTA opted for the persuasion
    method. It implements a built-in incentives system that rewards the participants
    for approving recent transactions. This method is called the weighted random walk
    (WRW).


    Weighted random walk uses the bias strategy to select the path towards a tip.
    The bias strategy involves choosing a path that has the highest approved transactions
    over the path that has very few approved transactions. Here we introduce a term
    called'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'cumulative weight to denote the number of approvers of the transactions. It
    means that the higher the number of approvers, the higher the cumulative weight
    and vice versa. The approvers could both be direct or indirect approvers. Let
    us examine the following diagram.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_102_0.png)


    Figure 7.7


    To approve tip number 13, the walker needs to walk to transaction number 5. However,
    transaction 5 only has a cumulative weight of 1, therefore the walker will not
    continue this path. Instead, it will look for the path that has the highest cumulative
    weight. In our example, transaction 3 has a weight of 6, therefore the walker
    will choose this path and eventually reach transaction 14 and approve it.


    # 7.1.8 The Parameter Alpha


    However, even the weighted random walk method has its own weakness. If we insist
    that every approval of the transactions must follow the rule strictly, we will
    do away with randomness completely and many tips will be left unapproved. The
    Tangle system will end up having many unapproved transactions, or orphans. (I
    introduced my own term, orphan, which may not be in accordance with the IOTA concepts.
    You can read the IOTA'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'academic paper here. https://www.iota.org/research/academic-papers)


    To overcome those issues, IOTA introduced a parameter α to control the ''weight''
    of the weighted random walk. If α=0, it becomes unweighted random walk and creates
    the issue of approving too many lazy tips. On the other hand, if we set the value
    of α too high, it will end up as a super weighted random walk which will leave
    many orphans in the Tangle.


    Therefore, it is important to find a good balance between approving too many lazy
    tips and not leaving too many orphaned tips behind. To sum up, finding an ideal
    value for α is important to maintain the coherence of the Tangle ecosystem championed
    by IOTA.


    Therefore, it is important to find a good balance between approving too many lazy
    tips and not leaving too orphaned tips behind. To sum up, finding an ideal value
    for α is important to maintain the coherence of the Tangle ecosystem championed
    by IOTA.


    # 7.2 R3 Corda


    Corda is another enterprise-ready blockless DLT platform other than IOTA. It was
    developed and launched by R3 in 2016. R3 is an enterprise software firm which
    focuses on distributed ledger technology. Though Corda was only launched in 2016,
