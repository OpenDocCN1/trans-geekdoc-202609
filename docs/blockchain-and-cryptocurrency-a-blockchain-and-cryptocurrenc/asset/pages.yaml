  md: '# Chapter 11


    # Building a Digital Government Powered by Blockchain


    Digital government is a state-of-the-art concept from public administration science,
    a successor of the e-government paradigm. The former model simply indicated the
    digitalization of the public administration. Digital government refers to the
    creation of new public services and service delivery models that leverage digital
    public technologies as well as governmental and citizen information assets. The
    new paradigm focuses on the provision of user-centric, agile, and innovative public
    services. Blockchain is one of the most innovative digital technologies that must
    be considered under the new paradigm of governmental policy making and service
    delivery.


    Estonia started testing blockchain technology in 2008, even before the Bitcoin
    whitepaper first coined the term “blockchain” was published. Since 2012, blockchain
    has been in production use in Estonia to protect national data, e-services, and
    smart devices both in the public and private sectors. Estonia has built a decentralized
    network system known as the X-Road (Numa, 2019), as shown in Figure 11.1.


    The X-Road Public Internet helps store information in a distributed way while
    securely communicating through a data exchange layer. Besides that, the system
    ensures interoperability, confidentiality and integrity between institutions and
    platforms. The exchange authentication includes multi-level authorization and
    processing logs. Moreover, all data is encrypted and signed, and all the included
    parties are strongly identifiable.'
  merge: -1
  img_proc: true
