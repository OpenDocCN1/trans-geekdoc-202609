  md: '# 2 Chi Index Fund


    # 2.1 What is Chi Index Fund?


    Chi Index Fund is a cryptocurrency-only fund investment vehicle utilizing quantitative
    trading strategy. Quantitative trading consists of trading strategies based on
    quantitative analysis, which rely on mathematical computations and number crunching
    to identify trading opportunities. Price and volume are two of the more common
    data inputs used in quantitative analysis as the main inputs to mathematical models.
    The advantage of quantitative trading is that it allows for optimal use of back-tested
    data and eliminates emotional decision-making during trading.


    Chi Index Fund was created and designed to mitigate the problems in cryptocurrencies
    trading. The problems include technical difficulties and volatility of cryptocurrencies.
    Chi Index is among the world’s first cryptocurrency-only tokenized index fund
    that aims to ease trading in the crypto market. Chi Index Fund will maintain a
    diverse portfolio of selected cryptocurrencies, comprising the top twenty coins
    in terms of market capitalisation. To continuously track the index, the portfolio
    will be adjusted periodically using an AI powered rebalancing technique.


    The benefits of Chi Index Fund are many: convenience, minimal broker fees, full
    transparency, full control, and a lower price bound. Automation allows Chi Index
    Fund to operate with fees of only 0.5% p/a as opposed to the market average of
    3% p/a.


    Chi Index Fund will be incorporated into Chi hedging strategies with the aim to
    maximize profit and minimize risks in crypto fund investment. Chi financial service
    team will employ a hedging strategy to maximise profit and minimise risks for
    the'
