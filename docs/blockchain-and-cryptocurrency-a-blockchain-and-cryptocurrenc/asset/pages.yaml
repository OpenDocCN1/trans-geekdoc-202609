- pgno: 3
  md: '# About the Author


    Dr. Liew Voon Kiong holds a bachelor''s degree in Mathematics, a master''s degree
    in Management and a doctorate in Business Administration.


    Dr. Liew is a sought-after Blockchain Architect by companies in the blockchain
    industry. He has played a lead role in designing and developing the native cryptocurrency
    of an incubation hub in Southeast Asia, as well as successfully getting it listed
    on a renowned exchange via an IEO campaign. He is also the Chief Strategy Officer
    of an Australian blockchain company that manages a crypto hedge fund.


    Dr. Liew is also a blockchain researcher and has developed several use cases such
    as blockchain-powered supply chain management for the automotive and textile industries,
    building a blockchain-powered digital government, event and ticketing DApps, and
    more. He is skilled in setting up blockchain networks such as private Ethereum
    networks, as well as writing smart contracts using Solidity and creating DApps.
    He has also created a blockchain blog titled Blockchain Guide for Everyone (http://www.blockchainguide.biz/).


    He is the head of the education subcommittee of the Access Blockchain Association
    of Malaysia, as well as a regular speaker in regional blockchain events and workshops.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Preface


    Blockchain has been the most hyped technology in the last decade. Though blockchain
    technology is being overhyped somewhat, it has the potential to disrupt many existing
    industries. Many start-ups, MNCS, governments, non-profit organizations and individuals
    have developed and implemented blockchain-nbased applications.


    Blockchain has crept into our daily life as we are bombarded with news from social
    media, web portals and advertisements. As a result, nearly everyone still do not
    talking about cryptocurrency today. However, most people still do not understand
    blockchain, the technology that powers cryptocurrencies. Therefore, I have written
    this book with the hope to help everyone understand blockchain technology and
    cryptocurrencies better.


    This book is a comprehensive guide covering fundamental and advanced topics such
    as:


    +   * Storing your cryptocurrencies securely in crypto wallets

    * Smart contracts

    * dApps

    * Enterprise blockchain frameworks like Hyperledger and Corda

    * How to conduct ICO and IEO

    * DeFi

    * Blockchain for financial services

    * Blockchain for supply chain management

    * Building a digital government with blockchain

    * HR transformation powered by blockchain'
