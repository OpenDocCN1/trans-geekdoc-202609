    the event of a borrower''s default. Currently ETH, BTC, LEND and more than 150
    ERC20 tokens are accepted as collateral.


    There is no limit in the loan value, as the amount you can borrow depends on the
    value of your collateral. Borrowers can borrow up to 50% of their collateral value
    and up to 55% if LEND is used as collateral. This means the borrower needs to
    send to the smart contract 200% of the value of the loan in crypto assets.


    To become a lender, you will need to register on the platform and send to your
    in-app wallet some Ether or any of the currencies accepted in order to fund a
    loan or create a loan offer. The accepted currencies are ETH, LEND, DAI and TUSD.
    This also means borrowers will receive the cryptocurrencies as loans.


    The borrower needs to repay the loan in accordance with the contract, plus interest
    on the loan, and send them to a smart contract. The lender receives their ETH
    and interest from the smart contract, and the pledged tokens are unlocked and
    sent back to the borrower. If the borrower cannot repay the loan, the lender will
    get the payments plus a liquidation fee from the collateral.


    # Elix


    Elix is an Ethereum-based platform for lending, crowdfunding, and payments. The
    Elix team primarily focused on mobile platforms and usability to attract as large
    a user base as possible from the start. I will not discuss the payment and crowdfunding
    component of this platform, but rather concentrate only on its P2P lending component.


    The uniqueness of this system lies in the fact that Elix offers a peer-to-peer
    lending program based on mutual incentives for the'
  merge: -1
