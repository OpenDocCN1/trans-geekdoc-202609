- pgno: 19
  md: '# Chapter 1


    # Introduction to Blockchain


    Blockchain has been the most hyped technology in the last decade. A recent World
    Economic Forum report predicts that by 2025, 10% of GDP will be generated by blockchain.
    Though blockchain technology is being overhyped somewhat, it has the potential
    to disrupt many existing industries. Start-ups, MNCs, governments, non-profit
    organizations and even individuals have already developed and implemented blockchain-based
    applications. For example, Walmart has collaborated with IBM to implement blockchain
    for food traceability as part of its food safety initiative. Therefore everyone,
    particularly business owners and enterprises, should take notice of this trend.


    Blockchain has slowly crept into our daily life as we are bombarded with news
    from social media, web portals and advertisements. As a result, nearly everyone
    is talking about cryptocurrency today. In fact, many have invested in cryptocurrencies
    today such as Bitcoin, Ethereum and other altcoins. While many people have made
    lots of money, many others have experienced substantial losses too. However, many
    people still not understand blockchain, the technology that powers cryptocurrency.
    Therefore, I have written this book with the aim to help everyone understand blockchain
    technology and cryptocurrency better.


    # 1.1 A Short History of Blockchain


    To begin, with the first blockchain was invented by Satoshi Nakamoto in 2008 to
    serve as the public transaction ledger of the cryptocurrency Bitcoin. That year,
    he or she posted a paper called Bitcoin - A Peer to Peer Electronic Cash System
    to a mailing list discussion on cryptography. Therefore, we can say'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'that Satoshi Nakamoto invented Blockchain and Bitcoin as its application. However,
    Satoshi Nakamoto''s real identity remains a mystery to this day. In fact, Satoshi
    Nakamoto may not be a person, but a group of people.


    On the other hand, Satoshi Nakamoto might not be the first person to come up with
    the idea of blockchain technology. The idea behind blockchain technology can be
    traced back to 1991, when Stuart Haber and W. Scott Stornet (Scott-Briggs, 2018)
    conceived the idea of a cryptographically secured chain of blocks. In 1992, they
    incorporated Merkle trees into the design, allowing several documents to be collected
    into a block.


    In addition, there were also previous attempts at creating online currencies with
    ledgers secured by encryption, such as B-Money and Bit Gold. B-money was an early
    proposal created by Wei Dai for an "anonymous, distributed electronic cash system".
    His essay was published on the Cypherpun mailing list in November 1998. Even Satoshi
    Nakamoto referenced B-Money when he invented Bitcoin. Another precursor of Bitcoin
    is Bit Gold, invented by Nick Szabo in 1998. Bit Gold is a decentralized digital
    currency but was never implemented.


    However, blockchain technology did not gain traction until the emergence of Bitcoin.
    Since its debut in 2009, the price of Bitcoin has skyrocketed, though it turned
    south in the year 2018. Many people are actively involved in mining activities
    in the hopes of getting rich quick. From 2011 onwards, many alternative cryptocurrencies
    or altcoins have emerged, such as Ethereum, EOS, Ripple, Ethereum Classic (ETC),
    XRP, Litecoin and more. Currently, there are over 1,000 cryptocurrencies in circulation
    with new ones frequently appearing.


    None of the cryptocurrencies came close to challenging Bitcoin until the invention
    of Ethereum by Vitalik Buterin in 2013. The Ethereum platform introduced the concept
    of smart contracts'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'and the cryptocurrency Ether. It is also a platform for ICO, crypto crowd-dfunding.
    I shall elaborate on Ethereum and ICO in a later chapter.


    # 1.2 Blockchain in a Nutshell


    A blockchain is a distributed and decentralized digital ledger that can be used
    to record transactions and data across numerous computers in a decentralized peer-to-peer
    network. We can also define a blockchain as a distributed encrypted database,
    like a spreadsheet that is duplicated thousands of times across a network of computers.
    This network is designed to regularly update this spreadsheet. It is a subset
    of distributed ledger technologies (DLT).


    The main feature of blockchain is decentralization. To understand what decentralization
    is, we first need to understand the traditional centralized operation mode. For
    example, if you go to the supermarket to buy something, you pay with a credit
    card when you check out. This process requires the approval of a third party,
    the bank. The transaction is completed after the bank approves it. However, if
    you use the blockchain platform to you do not need a third party. The buyer and
    the seller can trade directly and seamlessly in a transparent and secure blockchain
    ecosystem.


    Another feature of the blockchain is that all participants in the network do not
    need to establish any trust relationships to perform transactions. It relies on
    cryptographic authentication technology, a decentralized network, and a consensus
    mechanism to ensure the security and integrity of funds and information. Therefore,
    information on the blockchain is highly transparent and not easily falsified.
    Thus, the blockchain system is particularly suitable for the financial industry.
    Indeed, blockchain is an incorruptible digital ledger of economic-'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'transactions that can record not only financial transactions but pretty much
    everything of value( Don Tapscott, 2017).


    In short, blockchain has the following advantages:


    +   * Transparent

    * Secure

    * Decentralized

    * Democratic

    * Efficient

    * Auditable

    * Immutable

    * Consensus


    # 1.3 The Blockchain Network


    The blockchain network is a peer-to-peer decentralized network. The peers, also
    known as nodes, are connected to this network in a synchronous way. The nodes
    can be a desktop, a laptop, a mobile phone, a mining rig, servers, or any other
    electronic devices. These nodes form the foundation of the blockchain network.
    They provide computing resources like disk storage space to keep the network alive
    and to maintain its integrity and security, and they do it voluntarily.


    The decentralized peer-to-peer network is different from the traditional centralized
    client-server network, as shown in Figure 1.1 and Figure 1.2.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_23_0.png)


    Figure 1.1 Centralized Client-Server Network'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_24_0.png)


    # Figure 1.2 Decentralized Peer-to-Peer Network


    A centralized network has an authoritative central point of control. All the clients
    are connected to this single point and all their data are stored in the central
    server. The client has not much control over how the central authority will use
    his or her data.


    A good example is your bank account. The bank keeps your money, manages your account,
    and records all your transactions. They can also lend your money to other clients.
