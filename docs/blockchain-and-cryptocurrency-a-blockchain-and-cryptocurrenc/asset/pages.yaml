  md: '# # Chapter 21 Setting up a Private Ethereum Blockchain Network on Windows


    Setting up a private Ethereum blockchain network is not an extremely difficult
    task for the coders. However, it may be a bit of a challenge for the beginners.
    I will skip some technical details and avoid using some jargon so that everyone
    can understand the basic concepts.


    # ## 21.1 Prerequisites


    Before setting up the network, you need to install the following software:


    +   * Visual Studio Code

    * git

    * NodeJs

    * Ethereum Wallet

    * Geth


    The **go-ethereum** client is commonly referred to as **get**, which is the command
    line interface for running a **full Ethereum node** implemented in Go. By installing
    and running get, you can run a private network or participate in the Ethereum
    main network. By running get, you can perform the following tasks:


    +   * mine real ether

    * transfer funds between addresses

    * create smart contracts and send transactions

    * explore block history

    * and much much more'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# 21.2 Creating the Genesis Block\n\nTo set up the private network, we need\
    \ to create the Genesis block, the first block of the blockchain in our network.\
    \ The code for the genesis block is written in JSON format. JSON stores data as\
    \ a name/value pair. For example:\n\n+   \"name\": \"John\" \n\"age\": 30\n\n\
    It uses JavaScript syntax, but the format is text only. Therefore, JSON can be\
    \ read and used as a data format by any programming language. You can use any\
    \ editor to write the JSON code(JSON: JavaScript Object Notation), I used Notepad++.\
    \ The sample code for the genesis block is as follows\n\n```\n{\n  \"config\"\
    :{\n    \"chainId\": 45,\n    \"homesteadBlock\": 0,\n    \"eip155Block\": 0,\n\
    \    \"eip158Block\": 0,\n    \"byzantiumBlock\": 12\n  },\n  \"alloc\": {\n \
    \   \"coinbase\": \"0x00000000000000000000000000000000\",\n    \"difficulty\"\
    : \"0x20000\",\n    \"extraData\": \"\",\n    \"gasLimit\": \"0x2fef8\",\n   \
    \ \"nonce\": \"0x0000000000000000000000042\"\n  }\n}\n```"
  merge: -1
  img_proc: true
