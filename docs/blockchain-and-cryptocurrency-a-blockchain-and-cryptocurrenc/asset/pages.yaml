- pgno: 70
  md: '# 5.2 Initial Exchange Offering (IEO)


    After the craze of ICOs subsided, two new crypto crowdfunding methods emerged,
    namely Security Token Offering (STO) and Initial Exchange Offering (IEO). Among
    the two, IEO is more popular as STO poses a higher barrier of entry, is more expensive,
    and is subjected to more stringent regulations by the security commission.


    In a recent article, Reuters reported that IEOs have raised $1.5 billion so far
    in 2019, compared with just $836 million from ICOs. A dozen of amazingly successful
    cases of IEOs have driven more project owners to embark on their own IEO journeys.
    Famous IEO cases include the sale of the BitTorrent (BTT) token on the Binance
    Launchpad, raising $7 million in just the first 14 minutes of the sale opening.
    Veriblock did even better, raising $7 million through an IEO on the Bittrex exchange
    in just 10 seconds. An utterly amazing feat! It is safe to say that IEO has taken
    over ICO as the preferred choice of fundraising in the cryptocurrency industry.


    Investors who are still thinking of the good old days of ICO should start changing
    their mindset and focus on investing in IEO projects instead. On the other hand,
    start-ups or enterprises who wish to raise funds in the crypto industry must realize
    that ICO is already dead and IEO is the way to go. Lastly, more exchanges should
    create IEO launchpads to assist projects that wish to raise funds through IEO,
    as this is an untapped niche with immense potential.


    # 5.2.1 What is IEO?


    According to Binance, an Initial Exchange Offering (IEO) is a fundraising campaign
    that is administered by a crypto exchange platform. An IEO allows investors to
    purchase a new cryptocurrency (or token) while raising funds for its crypto project.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Though ICOs and IEOs both raise funds through token sales, the way they sell
    tokens is different. For ICOs, the project team themselves conduct the fundraising
    campaign. Meanwhile, IEO fundraising is conducted on a crypto exchange platform,
    where the users of the exchange can buy tokens with funds directly from their
    own exchange wallet.


    # 5.2.2 Advantages and Disadvantages of IEO


    # Advantages


    # Increased Investor Confidence


    Investors are more confident in investing in IEO tokens as the project must undergo
    stringent KYC/AML checks by the exchange platform that handles the IEO projects.
    The exchange platform will also evaluate the business model of the project and
    audit its technical infrastructure, including its blockchain system and smart
    contracts. Therefore, many scam projects will be filtered and eliminated. The
    exchange platform acts as a trusted third party that can reduce considerable risk
    in crypto investment.


    # Win-Win for The Project Owner and The Exchange


    For the project owner, it is a cheaper and easier way to raise the necessary funds
    for the project, while not embarking on long marketing campaigns and roadshows.
    The token is also listed on the exchange immediately after the IEO campaign.


    For the exchange, conducting an IEO means more revenue for them. An exchange that
    hosts an IEO will typically charge a fee for the campaign and get a cut from the
    token sales. They also get fees when the token starts trading on their exchange.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Disadvantages of IEO


    # Ambiguous Regulations and Restrictions


    Many countries still ban or restrict fundraising activity in the cryptocurrency
    industry while some countries impose stringent regulations on crypto activities.
    Therefore, it is still uncertain whether IEO will be fully accepted and recognized
    as the legal way of fundraising in the crypto industry.


    # All Investors Subject to Stringent AML/KYC


    While a stringent KYC/AML check for the project can increase investor confidence,
    some individuals may be reluctant to expose their identities, so going through
    a stringent AML/KYC procedure may deter these people from investing in the IEO
    project.


    # Limited Number of Tokens


    There have been many complaints from investors that not everyone manages to purchase
    tokens during IEOs as the number of tokens available for sale is usually limited.


    # Botting Concerns


    Using bots for trading and investing is ubiquitous nowadays. In the crypto space,
    there are concerns about bots that can be programmed to participate in IEOs and
    beat out human investors. In this scenario, all parties lose out.


    # 5.2.2 How to Conduct an IEO?


    Although an IEO is a promising method for fundraising, especially for startups
    that do not have the resources and expertise to do an IPO, it is by no means an
    easy feat. The project owner needs to plan and make the necessary preparations
    before embarking on the IEO initiative. The'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'following are suggested steps that a project must follow before going IEO.


    # Step 1 Design the Business Model


    Before embarking on an IEO campaign, the founding members of the project must
    have a clear vision of what their business wants to achieve. They also must design
    a business model and draw up plans to attain the vision.


    For instance, the vision of a project is to build the world''s largest digital
    platform for global entrepreneurs, which has the potential to create a vibrant
    token economy for the closed-loop ecosystem. The business model is to create a
    blockchain-based utility token that will power the digital platform for entrepreneurs,
    enabling them to perform all forms of economic activities that will create huge
    economic value.


    # Step 2 Assemble a Formidable Team


    In this internet era where information is readily available, potential investors
    and exchanges can easily check the background of the project team members. If
    the project team is comprised of mostly inexperienced people, it will seriously
    affect the confidence of the investors and the exchanges. Therefore, the project
    owner needs to assemble a formidable team that includes experts in business, law,
    technology, marketing, and other related disciplines. As most IEO projects are
    blockchain-based, it is a must to hire blockchain experts.


    # Step 3 Preparing the Whitepaper and Other Documents


    The whitepaper is a document that contains a thorough description of the project,
    distribution of tokens, business model, tokenomics and more. It also includes
    information about the project team which usually comprises the board members,
    the marketing team, the technical team, the legal team, and the advisers.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Writing the whitepaper is an especially important step in the IEO campaign.
    It is an important document that showcases the project. Whether the investors
    will be impressed and looking forward to investing in the project depends on how
    well the paper is written.


    Besides the whitepaper, the project team should also prepare a one-pager, pitch
    decks, social media pages and more. These are the components that contain the
    primary source of knowledge about the project for potential investors and exchanges
    to evaluate the IEO project.


    # Step 4 Develop the Token


    The token is an integral part of the IEO project. Without a native token, what
    can you sell to the investors? Therefore, it is crucial to design the token from
    day 1 and start developing it as soon as possible.


    Most tokens for IEO projects are ERC20 tokens. The ERC20 standard is chosen because
    it can be easily designed and deployed to the Ethereum Mainnet. However, if you
    want a customized token and your team has the expertise and programming skills,
    you can develop a different protocol from the Ethereum Mainnet, or even develop
    your own blockchain system.


    To mint the ERC20 token, the blockchain developers must write a robust smart contract
    and have it tested and audited by a trusted third-party auditor to ensure the
    contract is secure and free of bugs. The audited token can then be deployed to
    the Ethereum Mainnet or a private network.


    # Step 5 Marketing


    The project team must carry out an aggressive marketing campaign for its IEO initiative
    to broadcast the news to as many investors as possible. The marketing campaign
    can be conducted'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'through websites, blogs, as well as social media platforms such as Facebook,
    Twitter, WhatsApp, WeChat and more. They should also organize events and conferences
    to promote their token, but they must check whether these activities can be conducted
    in certain countries. For example, you cannot do so in Malaysia and China.


    # Step 6 Engage a Crypto Exchange


    The project team must sign an agreement with a crypto exchange to start their
    IEO campaign. They must conduct due diligence in searching for a trusted exchange
    before deciding to engage one. A good guide is to look for exchanges that rank
    within the top 50 on Coinmarketcap. Besides, they also need to analyze reviews
    of the exchanges on various crypto platforms. IEO fees may also be another concern,
    as top rank exchanges may charge an extremely high fee. Therefore, there is always
    a trade-off between the fee and the reputation of the exchange.


    # 5.3 Security Token Offering (STO)


    Security Token Offering (STO) has emerged as a new option in fundraising in the
    blockchain/crypto space, since ICOs have been banned or heavily regulated in many
    countries. ICO projects were banned because many of the projects were scams and
    the coins or tokens issued by them had neither utility nor monetary value. In
    China, they also called them "Air Coins" and in the west they called them "S**t
    Coins".


    In contrast to ICO tokens which are most utility tokens, security tokens are backed
    by underlying tangible assets that have monetary value, like stocks, bonds, funds,
    bank reserves, properties, minerals and more. In fact, Security Token Offering
    (STO) can be considered a hybrid model between Initial Public Offering (IPO) and
    cryptocurrency ICOs.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Security tokens represent the ownership of the tokenized underlying assets
    that are stored on the blockchain. Security token holders are entitled to an array
    of rights including equity, dividends, profit sharing, voting rights and more.
    These rights are written in a smart contract and traded freely as a token. In
    blockchain, tokenization is a method that converts rights to an asset into a digital
    token. Thus, we can take an asset, tokenize it and create its digital representation
    that lives on the blockchain. Blockchain guarantees that the ownership information
    is immutable. The tokens created in this way are also known as crypto tokens or
    better still security tokens.


    For example, you can tokenize an asset such as a book that you authored. The book
    is kept somewhere while the book token is uploaded to the blockchain network.
    The crypto token is a representation of the book ownership. You can specify how
    many tokens must be transferred to your crypto wallet before you can transfer
    the book ownership to a buyer by means of a smart contract. CryptoKitties is a
    brilliant example of a crypto token that allows users to acquire an adorable collectible
    by transferring cryptocurrencies to the owner. The owner will then transfer the
    digital collectible to the buyer. The transaction occurs automatically via the
    smart contract.


    STOs are usually more acceptable to regulatory bodies as they are asset-backed
    and comply with regulatory governance. They are a more legitimate method of fundraising.
    Compared to ICO, it is much more difficult to launch an STO, as it is governed
    by strict securities laws. Therefore, STO projects will have to conduct diligence
    work of making sure they comply with the relevant regulations that are usually
    imposed by the security commission of a country. They would typically be able
    to raise funds from accredited investors who need to pass stringent whitelisting
    and KYC processes. In addition, the financial cost of launching an'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'STO is much higher compared to ICO, though it is cheaper than the traditional
    IPO.


    The process of launching an STO is nearly the same as IEO and ICO but drafting
    legal documents with the help of a qualified legal adviser is more important than
    the latter two. They may need to furnish a prospectus as you would with an IPO,
    depending on the amount of money you wish to raise and the jurisdiction of different
    countries. Despite the additional legal restrictions and financial cost, STO campaigns
    have been successful. For example, the blockchain venture capital firm Blockchain
    Capital was able to raise US $10 million via its STO initiative in 2017. NEXO,
    a company that operates crypto-backed loans worldwide, successfully raised US
    $52,500,000 in 2018.


    The success of Polymath was even more astounding. Its STO campaign managed to
    raise a total of US $207,300,000 in 2018. Polymath is an interface between financial
    securities and the technical blockchain, helping issuers to overcome the complex
    technical and legal challenges related to issuing regulated securities on the
    blockchain. This cutting-edge blockchain platform offers a comprehensive tokenization
    process with decentralized protocol. Polymath allows a company to raise capital
    and mint security tokens quickly and conveniently.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Chapter 6


    # Hyperledger - A Framework for Enterprise Blockchain


    In previous chapters, we have learned about the Bitcoin blockchain, the flagship
    of cryptocurrency. Subsequently, we learned about Ethereum, which features smart
    contracts on top of its cryptocurrency Ether. Smart contracts allow developers
    to create decentralized applications (dApps) on the Ethereum ecosystem.


    Both Bitcoin and Ethereum are amazing blockchain platforms. However, both are
    facing incredibly challenging issues, one of which is scalability. The transaction
    processing capacity of the Bitcoin network is limited by the average block creation
    time of 10 minutes and the block size limit. The transaction rate for Bitcoin
    is between 3.3 and 7 transactions per second.


    Ethereum does not fare better, with a transaction rate of 15 transactions per
    second. Comparatively, VISA''s transaction rate is 45,000 transactions per second.
    Therefore, both platforms fall short in developing practical enterprise applications
    now.


    To overcome the limitations of the blockchain technologies for enterprise usage,
    Hyperledger was created with the vision to provide viable blockchain solutions
    for industries and businesses. Hyperledger is an open source effort created to
    advance cross-industry blockchain technologies hosted by the Linux Foundation.


    # 6.1 The Mission of Hyperledger


    The philosophy of Hyperledger is:'
  merge: -1
  img_proc: true
- pgno: 79
  md: '> “Only an Open Source, collaborative software development approach can ensure
    the transparency, longevity, interoperability, and support required to bring blockchain
    technologies forward to mainstream commercial adoption.” - hyperledger.org


    Indeed, the Hyperledger project has been a collaboration of players from various
    industries and organizations in technology, finance, banking, supply chain management,
    manufacturing, IoT and more. Since its inception in December 2015, it has managed
    to enlist many prominent members that include IBM, Intel, NEC, Cisco, J.P Morgan,
    AMN AMRO, ANZ Bank, Wells Fargo, Accenture, SAP and more.


    The mission of Hyperledger comprises some ambitious goals:


    +   - Create enterprise grade, open source, distributed ledger frameworks and
    code bases to support business transactions.

    - Provide neutral, open, and community-driven infrastructures supported by technical
    and business governance.

    - Build technical communities to develop blockchain and shared ledger POCs, use
    cases, field trials and deployments.

    - Promote our community of communities - taking a toolkit approach with many platforms
    and frameworks.


    # 6.2 The Hyperledger Greenhouse


    Hyperledger itself is not a platform. It is an umbrella body that incubates and
    promotes a range of business blockchain technologies. The technologies include
    distributed ledger frameworks, smart contract engines, client libraries, graphical
    interfaces, utility libraries, and sample applications. The umbrella strategy
    was able to accelerate innovation of DLT components by encouraging the re-use
    of common building blocks and components (hyperledger.org, 2019).'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The Hyperledger projects known as The Hyperledger Greenhouse consists of six
    distributed ledgers, five tools, four libraries and a domain-specific platform:


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_80_0.png)


    **Figure 6.1** Hyperledger Greenhouse (Source: hyperledger.org)


    Each of the Hyperledger frameworks operates differently but they also allow certain
    interoperability among themselves. Hyperledger frameworks are generally permissioned
    (private) blockchains. It means that the parties need authentication and authorization
    to participate on the blockchain networks.


    # ## 6.3 Open Source and Open Governance


    The success of Hyperledger is based on the concepts of open source and open governance.
    The concept of open source means that an open source software is a software that
    is made freely available and can be redistributed and modified. In other words,
    anyone could view the code, use the code, copy the code, modify the code, and
    depending on the open source license, contribute back changes. (hyperledger.org,
    2019)'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'On the other hand, open governance means that technical decisions for an open
    source project are made by a group of community-elected developers voted in from
    a pool of active participants. These decisions include things such as features
    to add, how, and when to add them (hyperledger.org, 2019). Hyperledger has formed
    a Technical Steering Committee (TSC) to implement open governance pertaining to
    the Hyperledger projects. You can read about Hyperledger''s open governance by
    following this link:


    https://www.hyperledger.org/blog/2017/09/06/abcs-of-open-governance


    # 6.4 Hyperledger Fabric


    Hyperledger Fabric is the first blockchain project developed and hosted by the
    Linux Foundation. It was initially contributed to by Digital Asset and IBM, because
    of the first hackathon. According to the Linux Foundation, it was intended as
    a foundation for developing DLT applications or solutions with a modular architecture.


    Hyperledger Fabric is an open-source enterprise-grade permitted distributed ledger
    technology (DLT) platform, designed for use in developing enterprise applications.
    In contrast, Bitcoin protocol and Ethereum are public permissionless blockchain,
    though Ethereum can be configured to be a private permitted blockchain using a
    consensus protocol as proof of authority (PoA).


    Hyperledger Fabric features some key differentiating capabilities over other popular
    distributed ledger or blockchain platforms. One special feature of Hyperledger
    Fabric is that it allows components, such as consensus and membership services,
    to be plug-and-play. Besides that, Hyperledger Fabric uses container'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'technology to host smart contracts called chaincode that comprises the application
    logic of the system.


    Channels are another unique feature of Hyperledger Fabric. They allow transactions
    to be private between two actors, while still being verified and committed to
    the blockchain.


    # 6.5 The Hyperledger Fabric Architecture


    Hyperledger Fabric has a highly modular and configurable architecture. Therefore,
    enterprises can make use of its versatility to develop innovative business applications.
    Besides that, it can be used to optimize applications. Indeed, Hyperledger Fabric
    is well suited to develop a broad range of industry cases including banking, finance,
    insurance, healthcare, human resources, supply chain and even digital music delivery.


    Like Ethereum, Hyperledger Fabric also features smart contracts. However, it does
    not use Solidity as the programming language to code smart contracts. Hyperledger
    Fabric smart contracts are written in general-purpose programming languages such
    as Java, Go and Node.js. This means that most enterprises already have the skill
    set needed to develop smart contracts and no additional training to learn a new
    language is required.


    Unlike Ethereum and many other public blockchains or DLT platforms, Hyperledger
    Fabric is a permissioned platform. It means the participants are known to each
    other, rather than anonymous and fully untrusted. In the Hyperledger Fabric ecosystem,
    while the participants may not fully trust one another, it can be operated under
    a governance model that is built with trust between participants, such as a legal
    agreement or framework for handling disputes.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 6.6 Consensus Protocol


    One key difference between Hyperledger Fabric and other DLT platforms is its support
    for pluggable consensus protocols. It enables the platform to be more effectively
    customized to fit particular use cases and trust models.


    For example, when Hyperledger Fabric is implemented within a single enterprise
    or operated by a trusted authority, fully Byzantine fault tolerant consensus might
    be considered unnecessary excessive drag on performance and throughput. Instead,
    a crash fault tolerant (CFT) protocol is more than adequate. In a multi-party,
    decentralized platform, a more traditional Byzantine fault tolerant (BFT) consensus
    protocol might be more required.


    Another significant difference between Hyperledger Fabric and other DLT platforms
    is that it can implement consensus protocols that do not need a native cryptocurrency
    to incentivize costly mining or to fuel smart contract execution. The avoidance
    of a cryptocurrency reduces some significant risk due to hacking via attack vector.
    Besides, that, the absence of cryptographic mining operations means that the platform
    can be deployed with the same operational cost as other distributed platforms.


    The combination of the differentiating features makes Hyperledger Fabric one of
    the better performing DLT platforms available today both in terms of transaction
    processing and transaction confirmation latency. Besides, that, it enables privacy
    and confidentiality of transactions and the smart contracts (chaincode) that implement
    them.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 6.7 Hyperledger Fabric Network


    Hyperledger Fabric is a permissioned blockchain network that provides ledger services
    to application clients and administrators. It allows multiple organizations to
    collaborate as a consortium to form the network. The permissions to join the network
    are determined by a set of policies that are agreed to by the consortium when
    the network is configured. The network policies may change over time, subject
    to the agreement of the organizations in the consortium.


    The Hyperledger Fabric network comprises the following components:


    +   - Ledger

    - Peers

    - Ordering service

    - Chaincode (aka smart contract)

    - Channels

    - Membership service provider


    The Hyperledger ecosystem also consists of the client applications that allow
    users to interact with the network. Moreover, the Hyperledger Fabric application
    SDK provides a powerful API for developers to program applications to interact
    with the blockchain network on-half of the users.


    # 6.7.1 Peers


    The Fabric network is comprised primarily of a set of peers or nodes. Peers maintain
    the state of the network and a copy of the ledger. In addition, they also host
    smart contracts (chaincode).


    There are two different types of peers in Fabric, the endorsing peer, and the
    committing peer. The endorsing peers (aka endorsers) simulate and endorse transactions.
    On the other hand, the committing peers (aka committers) verify'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'endorsements and validate transactions before committing transactions to the
    blockchain. On a separate note, the endorsing peers can also commit transactions
    to the blockchain. Indeed, the endorsers are a special kind of committer. However,
    committers cannot be the endorsers. All peers can commit blocks to the distributed
    ledger.


    # 6.7.2 Ordering Service


    The ordering service is made up of a cluster of special nodes known as orderers.
    The ordering service accepts the endorsed transactions and specifies the order
    in which those transactions will be committed to the ledger. However, it does
    not process transactions, smart contracts, or maintain the shared ledger.


    # 6.7.3 The Transaction Workflow


    Let us examine the transaction workflow that involves the client applications,
    the peers and the orderers. By examining the entire transaction workflow, we will
    learn how consensus is reached in the process.


    The transaction flow to reach consensus consists of three phases:


    +   1. Transaction endorsement

    2. Ordering

    3. Validation and commitment


    # Phase 1 Transaction Endorsement


    Transactions begin with client applications sending transaction proposals to the
    endorsing peers, as shown in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_86_0.png)


    Figure 6.2 Transaction Flow


    # Phase 2 Transactions Simulation


    At this phase, the endorsers will simulate the proposed transactions, without
    updating the ledger. The endorsers must hold smart contracts to simulate the transaction
    proposals. In the simulation process, the endorsing peers will capture the set
    of Read and Written data, known as **RW Sets.


    RW sets contain data that that was read from the current world state while simulating
    the transaction, as well as data that would have been written to the world state
    had the transaction been executed. The endorsing peers then sign these RW sets
    and send them back to the client application for use in the next phase of the
    transaction flow, as shown below:'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_87_0.png)


    Figure 6.3 RW Set


    # Phase 3 Ordering


    At this phase, the client application submits the endorsed transactions and the
    RW sets to the ordering service. The ordering service will take the endorsed transactions
    and RW sets, orders them into a block and delivers the block to all committing
    peers.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/f2f9952d33ef3f083419e55bc6a6e2e1_88_0.png)


    Figure 6.4 Ordering


    The order of transactions needs to be established to ensure that the updates to
    the world state are valid when they are committed to the network. Unlike the Bitcoin
    blockchain or Ethereum, where ordering occurs through mining, Hyperledger Fabric
    allows organizations to choose the ordering mechanism that best suits that network.


    Hyperledger Fabric provides three ordering mechanisms i.e. SOLO, Kafka, and Simplified
    Byzantine Fault Tolerance (SBFT). However, SOLO is used only for experimentation
    purposes and SBFT has not yet been implemented. Therefore, Kafka is the default
    ordering mechanism for production use. The Kafka mechanism provides a crash fault
    tolerant solution to ordering.


    # Phase 4 Transaction Validation


    At this final phase, the committing peers validate the transactions by checking
    that the RW sets match the current world state. In addition, they need to ensure
    that Read data that'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'existed during the simulation process is identical to the current world state.


    After the committing peers validate the transactions, the transactions are then
    written to the ledger, and the world state is updated with the Write data from
    the RW Set. Committing peers are responsible for adding blocks of transactions
    to the blockchain and updating the world state. Lastly, the committing peers asynchronously
    notify the client application the results of the


    # 6.7.4 Channels


    In permissionless blockchains like Bitcoin and Ethereum, all peers share and have
    access to the same ledger. However, this kind of blockchain may not be suitable
    for business applications. For example, a supplier may want to set different prices
    for different wholesalers, and he would not want everyone in the supply chain
    to view this information. In this scenario, he or she will prefer to deal with
    the different wholesalers separately. To solve this issue, Hyperledger Fabric
    came out with the novel concept of channels that allow private transactions within
    the same network.


    Channels partition the Fabric network in such a way that only the stakeholders
    can view the transactions. In this way, organizations can utilize the same network
    while maintaining separation between multiple blockchains. The mechanism works
    by delegating transactions to different ledgers. Members of the channel can communicate
    and transact privately. Other members of the network cannot see the transactions
    on that channel. The concept is illustrated in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Fabric Network


    Application 2


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_90_0.png)


    Application 1


    Figure 6.5 Fabric Network


    The diagram above shows two channels, channel 1 and channel 2. Each channel has
    its own application, peers, ledger, and smart contract (chaincode). In this example,
    channel 1 has two peers, P1 and P2, and channel 2 also has two peers, P3 and P4.
    Ordering service is the same across any network and channel.


    Application 1 will send transaction proposals to channel 1. P1 and P2 will simulate
    and commit transactions to ledger L1 based on chaincode S1. On the other hand,
    Application 2 will send transaction proposals to channel 2. P3 and P4 will simulate
    and commit transactions to ledger L2 based on chaincode S2.


    Though our example shows peers belonging to two distinct channels, in actual peers
    can belong to multiple networks or channels. Peers that participate in multiple
    channels simulate and commit transactions to different ledgers. In addition, the
    same chaincode can be applied to multiple channels.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 6.7.6 Membership Service Provider (MSP)


    Hyperledger Fabric is a permissioned blockchain. Therefore, every user needs permission
    to join the Fabric network. To obtain permission to join the Fabric blockchain
    network, the identity of every user must be validated and authenticated. The identity
    is important because it determines the exact permissions over resources and access
    to information that the user has in the Fabric network.


    To verify an identity, we must employ a trusted authority. In Hyperledger Fabric,
    the trusted authority is the membership service provider (MSP). The membership
    service provider is a component that defines the rules in which identities are
    validated, authenticated, and allowed access to a network. The MSP manages user
    IDs and authenticates clients who want to join the network. This includes providing
    credentials for these clients to propose transactions, defining specific roles
    a member might play and defining access privileges in the context of a network
    and channel.


    The MSP uses a Certificate Authority to authenticate or revokes user certificates
    upon confirmed identity. In Fabric, the default Certificate Authority interface
    used for the MSP is the Fabric-CA API. However, organizations can choose to implement
    an External Certificate Authority of their choice. Hyperledger Fabric supports
    many types of External Certificate Authority interfaces. As a result, a single
    Hyperledger Fabric network can be controlled by multiple MSPs.


    # 6.7.7 The Authentication Process


    In the authentication process, the Fabric-CA identifies the application, peer,
    endorser and orderer identities, and verifies them. Next, a signature is generated
    using a Signing Algorithm and a Signature Verification Algorithm. The Signing
    Algorithm utilizes the credentials of the entities associated with their'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'respective identities and outputs an endorsement. The generated signature is
    a byte array that is bound to a specific identity.


