  md: '# 1.11 Merkle Tree


    Merkle tree is one of the metadata in a block of the blockchain. In computer science,
    the Merkle tree is a branching data structure that is used to store hashes of
    individual data in a large dataset. The purpose is to make the verification of
    the dataset efficient and fast. It is an anti-tamper mechanism to ensure that
    the large dataset has not been tampered with.


    In blockchain, the Merkle tree(also known as the hash tree) encodes the blockchain
    data in an efficient and secure manner. Every transaction occurring on the blockchain
    network is subjected to a hashing algorithm to produce a hash, as shown in Figure
    1.9. Therefore, every transaction has a hash associated with it.


    As there are thousands of transactions stored on a block, it will be very time
    consuming if every node must deal with hundreds of thousands of transactions across
    the blockchain, synchronization and mining will take a long time. To solve this
    issue, all the transactions hashes in the block are also hashed. As illustrated
    in the following figure, two hashes are hashed into a single hash, as shown in
    Figure 1.10


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_32_0.png)


    Figure 1.10'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'These hashes are not stored in a sequential order on the block, rather in the
    form of a tree-like structure such that each hash is linked to its parent following
    a parent-child tree-like relation. The hashing will go on until it produces a
    singular hash, the Merkle root. This Merkle root is the hash of the block and
    it is stored on the header of the block. The process is illustrated in Figure
    1.11.


    ![](img/f2f9952d33ef3f083419e55bc6a6e2e1_33_0.png)


    Figure 1.11


    The Merkle Tree structure will enable the quick verification of blockchain data
    and quick movement of large amounts of data from one computer node to the other
    on the peer-to-peer blockchain network.'
  merge: -1
