    is accessible by anyone in the world without a feasible way to prevent you from
    publishing this number. Of course, anyone could just set again with a different
    value and overwrite your number. However, the number will still be stored in the
    history of the blockchain.


    # 3.2.5 Decentralized Applications (DApps)


    DApp is an abbreviation for decentralized application. A DApp has its backend
    code running on a decentralized peer-to-peer network such as the Ethereum blockchain
    network. On the contrary, an app''s backend code is running on centralized servers.


    A DApp can have frontend code and user interfaces written in any language that
