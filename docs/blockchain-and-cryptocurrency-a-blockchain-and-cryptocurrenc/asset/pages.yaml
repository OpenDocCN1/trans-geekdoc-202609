    We start the craft off with three imports:


    +   - Assert.sol: Gives us various assertions to use in our tests. In testing,
    an assertion checks for things like equality, inequality, or emptiness to return
    a pass/fail from our test.

    - DeployedAddresses.sol: When running tests, Truffle will deploy a fresh instance
    of the contract being tested to the'
