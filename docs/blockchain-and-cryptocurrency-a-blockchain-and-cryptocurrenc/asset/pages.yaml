    # The Chi Blockchain Network


    The Chi blockchain network consists of validator nodes and peer nodes. Only validator
    nodes have the authority to verify transactions and to elect new validators or
    dismiss misbehaving validators. Peer nodes are required to help maintain the network.


    Some of the nodes can be assigned the status of a Master node if they agreed to
    host the Chi Blockchain Network 24/7 and carry additional duties. The role of
    Master nodes is to ensure the blockchain security and reliability of Chi Blockchain
    Network. In addition, all the nodes will be incentivized with Chi Tokens.


    All nodes are subjected to yearly re-election using smart contracts to ensure
    democracy and transparency. Malicious nodes will be voted out while the nodes
    who performed well will'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'be re-elected to protect the integrity of the Chi POA Blockchain network.


