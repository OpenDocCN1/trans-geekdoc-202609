    # 8.2.1 The Hybrid P2P Lending Model


    This model uses a combination of fiat currency and cryptocurrency to provide P2P
    lending services. Let us examine a few companies that implement this model.


    SALT


    SALT (Secure Automated Lending Technology) is a leader in the blockchain-based
    P2P lending industry. SALT''s model allows borrowers to use their crypto assets
    as collateral to secure loans from an extensive network of lenders on the platform.
    It means SALT does not to check the credit score of borrowers, but grants eligibility
    based on the amount of crypto assets they are willing to put up as collateral.
    The main advantage for SALT borrowers is the ability to borrow fiat money against
    the security of their crypto assets, which is considered more practical to ordinary
    people than the pure cryptocurrency lending model.


    To sign up as a member of SALT, a borrower needs to purchase SALT tokens, the
    cryptocurrency of the SALT platform. SALT is minted using an ERC220 smart contract.
    After signing up, borrowers must deposit a certain amount of crypto assets (cryptocurrency)
    as collateral into the platform''s unique, multi-signature wallet address created
    by SALT. After the terms of the loan are agreed and approved, the lender will
    make a deposit in fiat money into the borrower''s bank account. The borrower will
