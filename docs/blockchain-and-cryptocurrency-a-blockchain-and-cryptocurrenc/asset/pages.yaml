    smart contracts in Ethereum. The smart contracts created using Solidity can be
    used for financial transactions, crowdfunding, voting, intelligent supply chain
    management, improvement of IoT workflow, ride sharing automation, smart city administration
    and more.


    It has Python, C++ and JavaScript influences and is used for Ethereum Virtual
    Machine ( EVM ). As a result, it is convenient and easy to grasp for those that
    are already familiar with the Python, C++, or JavaScript.


    # 17.1 Choosing the IDE to Develop Smart Contracts


    The best tool to write, compile, test and deploy smart contracts is the Remix.
    Remix is a browser-based IDE that provides an inbuilt compiler as a well as run-time
    environment without server-side components.


    We can also use other code editors for Solidity . I suggest we use Visual Studio
    Code or Solidity Plugin for Visual Studio. For Solidity plugin, you need to download
    it from


