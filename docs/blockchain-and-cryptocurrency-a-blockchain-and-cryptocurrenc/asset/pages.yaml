- pgno: 207
  md: '# Chapter 19


    # Developing an Ethereum Cryptocurrency on Windows


    You can develop your very own cryptocurrency using your laptop that runs Windows
    operating system. This article a step by step guide for newbies to easily developing
    and deploying a token using the sample code provided by the Truffle framework.
    Truffle is a world-class development environment, testing framework and asset
    pipeline for blockchains using the Ethereum Virtual Machine (EVM).


    This is a step-by-step guide for developing an Ethereum-based cryptocurrency with
    the following requirements.


    To start the project, we need to set up a development environment with the following
    requirements:


    +   * A code editor

    * Source control

    * Unit tests

    * Debugging


    For code editor, we use Visual Studio code for the following reasons:


    +   * VS Code integrates very well with Git for source control. Git is currently
    the best choice for source control.

    * VS Code works well with Truffle framework that manages unit tests.

    * VS Code works well with Truffle for debugging'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Besides that, Visual Studio code is a great tool for editing Solidity smart
    contracts and is available on Windows, Mac & Linux.


    # I. Installation of the Packages


    Step1: Install Chocolatey


    Launch PowerShell as administrator. In PowerShell, enter the following command:


    ```

    Set-ExecutionPolicy Bypass

    ```


    *The Set-ExecutionPolicy changes the user preference for the Windows PowerShell
    execution policy.


    *Bypass-Nothing is blocked and there are no warnings or prompts. This execution
    policy is designed for configurations in which a Windows PowerShell script is
    built in to a larger application or for configurations in which Windows PowerShell
    is the foundation for a program that has its own security model.


    * Why Chocolatey-You’ve never deployed software faster than you will with Chocolatey.”
    -Rob Reynolds. Chocolatey is a software management automation.


    Install Chocolatey by entering the following code:


    ```

    iex ((New-Object System.Net.WebClient).DownloadString(''https://chocolatey.org/install.ps1''))

    ```


    *https://chocolatey.org/docs/installation


    *iex-invoke expression-The Invoke-Expression cmdlet runs a specified string as
    a command and returns the results of the expression or command. Without Invoke-Expression,
    a string'
