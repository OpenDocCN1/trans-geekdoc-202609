  md: '# Appendix


    # White Paper#1 Blockchain Based School Ecosystem


    # Abstract


    The current school system is too structured, rigid, and inhibits creativity. The
    current school curriculum inadequately prepares the students to survive the fast-changing
    world of the 21st century. While schools need to comply with the national education
    policy to teach designated subjects, schools should include other programs that
    could help to resolve the issue. Therefore, our school proposes building an ecosystem
    using blockchain technology where students can freely create and share their contents.
    We believe that the blockchain ecosystem will nurture young children in developing
    creative minds and entrepreneurial skills.


    I have written this white paper for a hypothetical blockchain project. This blockchain
    project is to build a private blockchain ecosystem for an international school.


    First, we need to conduct a feasibility study before we start planning any blockchain
    project. Here, I am using a methodology called the CATWOE analysis. It can be
    applied to any new project.


    # CATWOE Analysis of Building a Blockchain School


    CATWOE is an acronym that stands for Customers – Actors – Transformation process
    – Worldview – Owners – Environmental constraints. It is a simple analytical approach
    to find solutions to identify problem areas, look at what an organization wants
    to achieve, and which solutions can influence the stakeholders. The analysis uses
    thought methodology from multiple perspectives. It is especially useful for an
    organization that wants to implement a'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'new project that involves a drastic transformation process. The implementation
    of the blockchain technologies in a school curriculum qualifies for such transformation.
    Therefore, there is a need to understand the problems and try to find solutions
    before we proceed with the project implementation


    # C - Clients


    They are the users and stakeholders of a system. In this case, they are the students,
    teachers, parents, the management staff, the education department, and others.
    They will benefit if the change is positive and the problems are solved. However,
    they may stand to lose or suffer if the change is negative and new problems are
    created. Therefore, we need to find out whether the blockchain technologies can
    solve current problems and bring positive changes in the school system. If the
    outcome could be negative or even damaging, we need to abort the project.


    # A-Actors


    They are usually the employees within an organization, in this case, teachers
    and support staff. They are responsible for carrying out work and involved with
    the implementation of the blockchain system. Therefore, we need to conduct an
    inventory analysis to know their qualities, capabilities, and interests to get
    a clear picture of their impact on the organization. We may need to hire new employees
    or retrain the current ones to ensure competency with respect to blockchain implementation.
    We also need to conduct training for the employees.


    # T - Transformation Process


    Transformation is the change that a system or process leads to. It is the process
    in which input (including raw materials, man-hours, knowledge) is transformed
    by an organization into output (such as a final product or solution to a problem).'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'to implement the blockchain system, we need to know in advance what kinds of
    input requires and forecast what the result (output) will be. Besides that, we
    must carefully consider the intermediate steps. In this case, the input is the
    blockchain technologies and the output could be a system that churns out an intelligent
    pool of young entrepreneurs that thrive on co-creating and co-sharing.


    # W - Worldview


    Stakeholders often have different ideas and approaches to the same issue, with
    other conflicting interests. The goal of the CATWOE analysis is to make their
    different viewpoint explicit and to achieve a methodology stand. In this project,
    we need to achieve consensus among the stakeholders that involve the students
    themselves, we do not want to force the ideas on them. Besides that, some teachers
    might be afraid in carrying out the transformation as they must learn new technologies.
    Parents would be overly concerned about the implementation of the blockchain technologies
    because it will bring profound impacts on their children, either positively or
    negatively.


    In addition, the government might want to regulate the project to ensure it complies
    with the national education policies and philosophies. On the other hand, business
    leaders may want to look for financial gains by sponsoring the project or they
    may refuse to support the project at all. Therefore, there is an urgent need to
    conduct surveys and research to figure out how to secure agreement from most stakeholders
    to implement the project.


    # O - Owners


    This usually refers to the owner, entrepreneur, or investor of an organization,
    who wants to make changes and who decides whether a project should start or stop.
    As decision makers, they have the highest authorities. Commitment and support
    from the'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'parties are important to ensure successful implementation of the blockchain
    project and long-term sustainability of the project.


    # E - Environmental Constraints


    This is the actual environmental elements that may influence the organization
    and can limit or restrict the implementation of the blockchain technologies in
    the school system. Examples include political influence, ethical boundaries, regulations
    from the government, financial constraints, and social factors. There is a need
    to work closely to overcome the constraints via negotiations and other means with
    the regulators and other parties


    After conducted the CATWOE analysis, I have identified the following problems
    where most schools are facing.


    # Problems


    +   - The Current school system is too structured and too rigid, inhibiting creativity

    - The Curriculum methodology too centered on academics and examinations

