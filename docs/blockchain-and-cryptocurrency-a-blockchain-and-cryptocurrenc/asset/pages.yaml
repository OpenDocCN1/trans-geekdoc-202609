  md: '# # Chapter 9 Transaction and Provenance Tracking


    # ## 9.1 Transaction Tracking


    The blockchain has a reconciled tracking and record-keeping mechanism that makes
    it easier for individuals, organizations, enterprises, or governments to track
    and manage transaction or event information. Cross-border payment is a good use
    case. The blockchain can track and store transaction records throughout the process.
    Another use case is that the Ministry of Transport can use blockchain technology
    to record and track the complete data of road users "violations of traffic regulations,
    so that the offenders have nowhere to go and can easily process fines.


    Blockchain technology allows us to track all types of transactions throughout
    the supply chain more safely and transparently. Every time a product changes hands,
    it can record transactions and store permanent data from manufacturing to sales.
    This can greatly reduce the time delays, high costs and human errors that plague
    current transactions.


    Wal-Mart and nine other companies have partnered with IBM to release a blockchain
    through their supply chain to track global food to ensure food safety. The Food
    Trust ''s goal is to improve the company''s ability to identify issues related
    to food recalls, such as tracking outbreaks more quickly to reduce customer risk.
    Frank Yiannas, vice president of food safety at Wal-Mart, called the Food Trust
    blockchain "the equivalent of FedEx food tracking."


    # ## 9.2 Provenance tracking and record keeping


    Blockchain can be used in provenance tracking and record keeping. The Diamond
    Time-Lapse plan was formulated in 2017.'
