    # 2.3 What is Mining?


    According to Investopedia,


    “Bitcoin mining is the process by which transactions are verified and added to
    the public ledger, known as the blockchain, and the'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'means through which new bitcoins are released. Anyone with access to the internet
    and suitable hardware can participate in mining. The mining process involves compiling
    recent transactions into blocks and trying to solve a computationally difficult
    puzzle. The participant who first solves the puzzle gets to place the next block
    on the block chain and claim the rewards. The rewards, which incentivize mining,
    are both the transaction fees associated with the transactions compiled in the
    block as well as newly released bitcoin.


    As quoted in the Bitcoin whitepaper, the continuous addition of a constant amount
    of new coins is like gold miners expending resources to add gold to circulation,
    therefore the term mining.


    While Bitcoin is the first cryptocurrency generated using the mining process,
    it is certainly not the only platform that has adopted this algorithm. Most of
    the alternative coins (altcoins) are using the mining algorithm to generate their
    crypto money.


    # ## The Purpose of Mining


    Generally, people think of mining in blockchain to obtain bitcoins or other cryptocurrencies.
    While this is partially true, it is not the main purpose of mining. In fact, the
    main objective of mining is to ensure the perpetuity and security of the decentralized
    network. The network comprises nodes that store the distributed ledgers in the
    form of the blockchain. Bitcoins are awarded to the miners for their effort in
    maintaining the integrity of the blockchain by validating the transactions in
    the blockchain. Because of the reward system, miners (nodes) will stay on in the
    network and help to prevent network downtime. Just imagine: if there was no reward,
    nobody would want to connect to the network, and it would just cease to exist.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 2.5 How Does Mining Work?


    The mining process starts when miners are trying to validate new transactions
    and record them on the blockchain. The miners are competing to solve a difficult
    mathematical puzzle based on a cryptographic hash algorithm. The solution found
    is called the Proof of Work, a.k.a. PoW. When a block is ''solved'', all the transactions
    are considered validated, and the new block is confirmed. This new block will
    be appended to the blockchain. The time taken to confirm a new block is approximately
    10 minutes for Bitcoin, but for other coins it is much faster. So, if you send
    or receive bitcoins, it will take approximately 10 minutes for the transaction
    to be confirmed.


    Miners receive a reward when they solve the complex mathematical problem. There
    are two types of rewards: new bitcoins and transaction fees. The number of bitcoins
    created decreases every 4 years, or every 210,000 blocks to be issued. Today,
    a newly created block creates 6.25 bitcoins. This number will keep going down
    until no more bitcoin will be issued. This will happen around 2140, when 21 million
    bitcoins will have been created. After this date, miners can still receive rewards
    in the form of transaction fees. The winning miner can collect all the transaction
    fees in the block. As the amount of bitcoin created with each block diminishes,
    the transaction fees received by the miner will increase. After the year 2140,
    the winning miner will only receive transaction fees as their reward.


    # 2.6 Technical Explanation of Mining


    Let us examine the technical aspects of crypto mining. In the blockchain, every
    block has a previous block except the very first block or the genesis block. Miners
    are competing to validate a new block by solving a complex mathematical puzzle.
    Let us look'
