- pgno: 141
  md: '# 11.2 A Short History of POA


    The Rupsten test network that used PoW was brought down in February of 2017 by
    people taking advantage of the network''s low PoW by increasing the block gas
    limit by almost 2000% while sending huge transactions through the network. Rupsten
    has since disallowed super high gas limits, but the issue with low PoW remains
    for the next exploit. This next test network known as Rinkeby that uses a PoA
    (Proof of Authority) called Clique where authorized signers mint the blocks. The
    PoA protocol can also be implemented using Ethereum Parity.


    Proof of Authority (PoA) is a reputation-based consensus algorithm that introduces
    a practical and efficient solution for blockchain networks (especially the private
    ones). The term was proposed in 2017 by Ethereum co-founder and former CTO Gavin
    Wood.


    Proof-of-Authority (PoA) is a new consensus algorithms family that provides high
    performance and fault tolerance. In PoA, rights to generate new blocks are awarded
    to nodes that have proven their authority to do so. To gain this authority and
    a right to generate new blocks, a node must pass a preliminary authentication.


    # 11.3 Advantages of POA Consensus Protocol


    The POA consensus protocol has the following advantages:


    +   High-performance hardware is not required. Compared to PoW consensus, PoA
    consensus does not require nodes to spend computational resources for solving
    complex mathematical tasks.


    +   The interval of time at which new blocks are generated is predictable. For
    PoW and PoS consensuses, this time varies.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   High transaction rate. Blocks are generated in a sequence at an appointed
    time interval by authorized network nodes. This increases the speed at which transactions
    are validated.


    +   Tolerance to compromised and malicious nodes, if 51% of nodes are not compromised.
    POA implements a ban mechanism for nodes and means of revoking block generation
    right.


    # 11.4 The National Digital ID Blockchain Net Notary Nodes


    The first step in building the National Digital ID Blockchain Net is to select
    the Notary Nodes (Validator Nodes). They must be chosen from people who can be
    trusted and have high reputation. Examples: high level public servants like NRD
    director, chief judge, minister, lawyer, central bank governor, NGO president
    etc.


    # 11.5 The Role of Notary Nodes


    A notary node (validator) is an independent individual who stakes their identity
    and is entrusted to maintain a node on the network that validates transactions
    and commits new blocks to the blockchain. In the case of National Digital ID Blockchain
    Net, their role is to validate data submitted to them and send them back to the
    registration nodes to complete the application process and issue the ID, birth
    certificate, or other documents.


    # 11.6 Responsibilities of Notary Nodes


    A notary node (validator) has both technical and social responsibilities, both
    of which are important for the health, performance, and security of the network.


    Technical Responsibilities:


    +   Ensure node is secure by practicing safe key management


    +   Maintain node requisite software version'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   * Monitor node to ensure its availability and participation in consensus

    * Monitor network in general and communicate with other validators and network
    entities if problems arise


    # Social Responsibilities:


    +   * Participate in on-chain governance of the network

    * Adding new validators

    * Removing validators, i.e. for compromising security of network, malicious behavior,
    non-participation in governance

    * Monitor node to ensure its availability and participation in consensus

    * Changing the approve ballot threshold

    * Changing consensus contract


    # 11.7 The Role of Registration Nodes


    Registration nodes comprise directors of NRD branches throughout the country.
    Their role is to accept and process IDs, passports, birth certificates, and other
    documents and applications. They can only submit the data to the National Digital
    ID Blockchain Net to be validated by notary nodes.


    # 11.8 Government Agency Nodes


    The National Digital ID Blockchain Net should be connected to all the ministries,
    government departments, local councils, government agencies and institutions.
    They should be given permission to access certain data on the shared database,
    like tax records, health data, criminal records, financial status etc, without
    involving any paperwork, thus creating a paperless environmentally friendly e-government.'
  merge: -1
  img_proc: true
