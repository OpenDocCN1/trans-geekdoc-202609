  md: '# Chapter 2


    # Bitcoin- The First Application of Blockchain


    # 2.1 A Brief History of Bitcoin


    In contrary to popular belief, the idea of creating a digital money without a
    trusted third party was not conceived by Satoshi Nakamoto, but was proposed by
    advocates such as Wei Dai and Nick Szabo more than a decade before the successful
    launch of Bitcoin. The biggest issue surrounding the implementation of a decentralized
    digital currency is double spending. Doublespending is a potential problem in
    which the same digital currency can be spent more than once.


    As we know, we can send any number of an electronic copy of a digital asset to
    anyone. This includes sending emails, documents, music files, video files and
    more. However, we cannot do the same with digital money. If you pay someone using
    cash, the value of money is transferred to another party and the money no longer
    belongs to you. However, if you send someone digital money, you still can retain
    the same amount of money and can send it to someone else. In fact, there is no
    limit to how many copies of the digital money you can send.


    Wei Dai, a computer engineer and cypherpunk, tried to solve the double-spending
    issue by publishing a paper on cryptocurrency with the title "b-money, an anonymous,
    distributed electronic cash system" in 1998. In the paper, Dai outlines the basic
    properties of all modern-day cryptocurrency systems as "a scheme for a group of
    untraceable digital pseudonyms to pay each other with money and to enforce contracts
    amongst themselves without outside help". In the same year, Szabo designed a mechanism
    for a decentralized digital currency he'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'called "Bit Gold". Though Bit Gold was never implemented, it has been called
    a direct precursor to the Bitcoin architecture.


    Satoshi sent an email to Wei Dai in the year 2008 to announce that he had solved
    the double-spending issue and was ready to implement the first decentralized digital
    cash without the need of a trusted third party. His email (Branwen) is as follows:


    "From: "Satoshi Nakamoto" <satoshi@anonymousspeech.com>


    Sent: Friday, August 22, 2008 4:38 PM


    To: "Wei Dai" <weidai@ibiblio.org>


    Subject: Citation of your b-money page


    I was very interested to read your b-money page. I''m getting ready to release
    a paper that expands on ideas into a complete working system. Adam Back (hashcash.org)
    noticed the similarities and pointed me to your site.


    I need to find out the year of publication of your b-money page for the citation
    in my paper. It will look like:


    +   [1] W. Dai, "b-money," http://www.weidai.com/bmoney.txt, (2006).


    You can download a pre-release draft at


    http://www.upload.ae/file/6157/ecash-pdf.html Feel free to forward it to anyone
    else you think would be interested.


    # Title: Electronic Cash Without a Trusted Third Party


    Abstract: A purely peer-to-peer version of electronic cash would allow online
    payments to be sent directly from one party to another without the burdens of
    going through a financial institution. Digital signatures offer part of the solution,
    but the main benefits are lost if a trusted'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'party is still required to prevent double-spending. We propose a solution to
    the double-spending problem using a peer-to-peer network. The network timestamps
    transactions by hashing them into an ongoing chain of hash-based proof-of-work,
    forming a record that cannot be changed without redoing the proof-of-work. The
    longest chain not only serves as proof of the sequence of events witnessed, but
    proof that it came from the largest pool of CPU power.


    As long as honest nodes control the most CPU power on the network, they can generate
    the longest chain and outpace any attackers. The longest itself requires minimal
    structure. Messages are broadcasted on a best effort basis, and nodes can leave
    and rejoin the network at will, accepting the longest proof-of-work chain as proof
    of what happened while they were gone.


    Satoshi


    Later in the same year on 31 October 2008, he published the Bitcoin whitepaper
    titled "Bitcoin: A Peer-to-Peer Electronic Cash System". This whitepaper is now
    available for download from the link https://bitcoin.org/bitcoin.pdf.


    Bitcoin''s peer-to-peer electronic cash system allows a party to send payments
    to another party directly using digital signatures, without the need to go through
    a trusted third party such as a bank or a financial institution. However, digital
    signatures alone still cannot avoid the issue of double spending. Therefore, Satoshi
    proposed a solution to the double-spending problem using a peer-to-peer distributed
    timestamp server to generate computational proof of the chronological order of
    transactions (a.k.a. proof of work), in a process generally known as mining. The
    system is secure if honest nodes collectively control more CPU power than any
    cooperating group of attacker nodes. We shall describe digital signatures and
    mining in the following paragraphs.'
