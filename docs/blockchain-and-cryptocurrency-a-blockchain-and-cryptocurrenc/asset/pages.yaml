    # 4.3 How Should You Store your Cryptocurrencies?


    Basically, you can choose to store your cryptocurrencies in an exchange wallet,
    in a hot wallet or a cold wallet. All the wallets have their advantages and disadvantages.
    How to decide which wallet to use is always a tradeoff between convenience and
    security.


    Keeping your cryptocurrencies on an exchange is convenience but also subject to
    security issues. It is easy to trade and cash out your cryptocurrencies by storing
    your cryptocurrencies in an exchange wallet. However, exchanges are mostly hosted
    on centralized servers therefore prone to cyberattack and hacking. If an exchange
    lost a substantial amount of money, they may not be able to pay you back your
    money. In addition, since the exchange is controlling your private key, it may
    subject to misappropriation of your funds.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Another choice is to keep your cryptocurrencies in a hot wallet installed on
    your mobile devices , your laptop, or your PC. The advantage of storing your cryptocurrencies
    in a hot wallet is that you can control your own private key. However, as the
    hot wallet is always connected to the Internet once on your devices, it is also
    subject to hacking and cyberattack. To improve security, you may enable two factor
    encryptions.


    The third option is the cold wallet. The cold wallet is most secure since it is
    always offline therefore will avoid cyberattack and online theft. However, it
    is still prone to physical risks like natural disaster, robbery, coercion, carelessness
    and more. Moreover, it is not as easy to move the funds out as other kinds of
    wallets.


    So, what kinds of wallets should you use? The answer is using a combination of
    all three kinds of wallets. I would suggest keeping some of your funds , like
    20% of your funds in exchange wallets for short-term trading. Another portion
    of your funds perhaps like 30% in the hot wallet for quick access to the funds.
    Last, set aside 50% of your funds and keep them in a hardware wallet for long-term
    safe keeping of your funds.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Chapter 5 - Crypto Fundraising


    Fundraising is always the primary concern of start-ups as they need funds to kickstart
    their projects. However, traditional fundraising from the public via an IPO is
    a huge barrier for start-ups as they do not have the resources and expertise to
    initiate it. Therefore, they often opt for a much easier fundraising method known
    as crowdfunding, which is a project or venture funded typically by raising small
    amounts of money from a large community.


    With the growth of the Internet, many crowdfunding platforms have emerged to cater
    for the need of the start-ups who are hungry for funds. To protect investors''
    interests, if a project fails to reach its funding goal, it is usually dropped
    from the fundraising platform and the pledged funds are returned to the investors.
    One of the most successful ones is Kickstarter, which launched in 2009 and has
    received almost $4 billion in pledges from 15.5 million backers to date (Aitken,
    2019).


    With the invention of Bitcoin by Satoshi Nakamoto in 2009 and the subsequent emergence
    of numerous altcoins, cryptocurrencies have been utilized to conduct crowdfunding
    in recent years with great success, which has reached its peak in 2017 where an
    estimated $4.9 billion was raised through ICOs (Page, 2018). Though ICOs are an
    innovative way to raise funds for start-ups, unfortunately many projects have
    turned out to be scams. Therefore, you need to understand and study an ICO project
    carefully before you invest in it. Let us delve deeper into ICO to get a better
    picture of what it is about.


    # 5.1 Initial Coin Offering (ICO)


    According to Investopedia, an Initial Coin Offering (ICO) is akin to an Initial
    Public Offering (IPO). However, instead of issuing shares to the public, ICO projects
    issue cryptocurrencies, often in the'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'form of coins or tokens. The objective of an ICO is to raise funds to create
    a new coin, app, or service.


    During the ICO campaign, interested investors can buy into the offering and receive
    a new cryptocurrency token issued by the currency. Therefore, ICO is also known
    as a token sale. Most ICOs design their coins as a utility token that is used
    to power their native platforms and decentralized applications (DApps) rather
    than for investment. As a result, most ICO projects can evade legal frameworks
    and do not have to comply with the strict governance of regulatory bodies. Investors
    usually need to pay for the token with fiat money or established cryptocurrencies
    like Bitcoin, ETH, USDT and more. This token will usually be listed on crypto
    exchanges at a specific listing price where investors can trade and hopefully
    gain profit when its value appreciates.


    Many people would have thought Vitalik Buterin was the inventor of the concept
    of ICO, but the fact is that he was not the first to come out with this idea,
    let alone launch it. There were five predecessors before the massively successful
    Ethereum ICO campaign. According to Merre (2019), J.R. Wil conceived the idea
    in 2013 he proposed a Mastercoin protocol that adds a layer on top of the Bitcoin
    protocol and provides additional features. He used the Kickstarter crowdfunding
    method to solicit bitcoins from investors in exchange for his Mastertokens to
    enjoy the features provided by the Mastercoin protocol.


    The ICO campaign was largely successful. The project managed to raise 4740 bitcoins,
    which was worth around US $500K at the time. Not a crazy amount, but it is worth
    a whopping US $33 million at the market value at the time of writing this book.
    Although Mastertoken itself is not particularly useful today, the Mastertoken
    protocol was rebranded as the Omni Layer and went on to be an incredibly successful
    invention. It now serves as the'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'underlying protocol for the Tether Token, better known as USDT, which is the
    most traded cryptocurrency beside BTC and ETH.


    Following the successful ICO campaign of Mastertoken, for four more ICO projects
    were launched: NextCoin (#NXT), CounterParty (#XCP), MaidSafeCoin (#MAID) and
    Swarm. However, the real game changer was the invention of Ethereum by Vitalik
    Buterin and the successful campaign of the Ethereum ICO. Vitalik claimed that
    Ethereum Virtual Machine is the world''s first zero-infrastructure platform. Ethereum''s
    token sale managed to garner 3700 BTC in 12 hours, approximately US $2.3 million
    at that time. It went on raise US $18.3 million at the end of the campaign. Ethereum
    now ranks second on Coinmarketcap, with a market capitalization of US $14,316,813,733
    at the time of writing.


    When a start-up initiates an ICO campaign, the founder team needs to write a comprehensive
    whitepaper. During the height of ICO campaigns in 2017, you would have noticed
    that many whitepapers were badly written, especially whitepapers done by scam
    projects. The founders should avoid this pitfall.


    The whitepaper should outline what the project is about, the need the project
    will fulfil upon completion, how much fund is needed, how many of the crypto tokens
    are to be minted, how the tokens will be distributed, what type of money (fiat
    or cryptocurrency) will be accepted, how long the ICO campaign will run for and
    so forth.


    For more details on how to conduct an ICO campaign, please refer to the section
    on how to conduct an ICO campaign as the steps are largely the same.'
