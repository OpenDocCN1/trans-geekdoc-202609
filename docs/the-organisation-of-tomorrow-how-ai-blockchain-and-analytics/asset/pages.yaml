- pgno: 158
  md: 'extraction, analysis, and statistics. This, however, is too broad as data mining
    refers to the discovery of previously unknown patterns, unusual records or dependencies.
    When developing your big data analytics strategy, it is important to have a clear
    understanding of what data mining is and how it can help you. The term data mining
    first appeared in the 1990s while before that, statisticians used the terms “data
    fishing” or “data dredging” to refer to analysing data without an a priori hypothesis.
    The most important objective of any data mining process is to find useful information
    that can be easily understood in large data sets. There are a few important classes
    of tasks that are involved with data mining.


    # Anomaly or outlier detection


    Anomaly detection refers to the search for data items in a data set that do not
    match a projected pattern or expected behaviour. Anomalies are also called outliers,
    exceptions, surprises, or contaminants, and they often provide critical and actionable
    information. An outlier is an object that deviates significantly from the general
    average within a data set or a combination of data and they can be especially
    useful in detecting Black Swans. It is numerically distant from the rest of the
    data and, therefore, the outlier indicates that something is out of the ordinary
    and requires additional analysis. Anomaly detection is used to detect fraud or
    risks within critical systems. Anomalies have all the characteristics to be of
    interest to an analyst, who should further analyse it to find out what is really
    going on. It can help to find extraordinary occurrences that could indicate fraudulent
    actions, flawed procedures or areas where a certain theory is invalid. Important
    to note is that in large data sets, a few outliers are common. Outliers may indicate
    bad data, due to lack of data governance practices, but may also be due to random
    variation or they may indicate something scientifically interesting. In all cases,
    additional research is required.


    # Association rule learning


    Association rule learning enables the discovery of interesting relations (interdependencies)
    between different variables in large databases. Association rule learning uncovers
    hidden patterns in the data that can be used to identify variables within the
    data and the co-occurrences of different variables that appear with the greatest
    frequencies. Association rule learning is often used in the retail industry to
    find patterns in point-of-sales data. These patterns can be used when recommending
    new products to others based on what others have bought before or based on which
    products are bought together. If this is done correctly, it can help organisations
    increase their conversion rate. A well-known example is that of Walmart’s Strawberry
    Pop-tarts. Thanks to data mining, Walmart, already in 2004, discovered that Strawberry
    Pop-tarts sales increased by seven times before'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'a hurricane. Since this discovery, Walmart places the Strawberry Pop-tarts
    at the checkouts before a hurricane is about to happen.


    # Clustering analysis


    Clustering analysis is the process of identifying data sets that are similar to
    each other, to understand the differences as well as similarities within the data.
    Clusters have certain traits in common that can be used to improve targeting algorithms.
    For example, clusters of customers with similar buying behaviour can be targeted
    with similar products and services to increase the conversation rate. A result
    from a clustering analysis can be the creation of personas. Personas are fictional
    characters created to represent the different user types within a targeted demographic,
    attitude, and/or behaviour set that might use a site, brand, or product in a similar
    way. The programming language R has a large variety of functions to perform relevant
    cluster analysis and is therefore especially relevant for performing a clustering
    analysis.


    # Classification analysis


    Classification analysis is a systematic process for obtaining important and relevant
    information about data, and metadata – data about data. The classification analysis
    helps to identify the categories the data belongs to. Classification analysis
    is closely linked to cluster analysis as the classification can be used to cluster
    data. Your email provider performs a well-known example of classification analysis:
    they use algorithms that can classify your email as legitimate or mark it as spam.
    This is done based on data that is linked with the email or the information that
    is in the email, for example, certain words or attachments that indicate spam.


    # Regression analysis


    Regression analysis tries to define the dependency between variables. It assumes
    a one-way causal effect from one variable to the response of another variable.
    Independent variables can be affected by each other, but it does not mean that
    this dependency is both ways as is the case with correlation analysis. A regression
    analysis can show that one variable is dependent on another but not vice versa.
    Regression analysis is used to determine different levels of customer satisfaction,
    how they affect customer loyalty and how service levels can be affected by, for
    example, the weather. A more concrete example is that a regression analysis can
    help you find the love of your life on an online dating website.


    Organisations that apply business analytics tools will be better able to understand
    their organisation as well as their ambiguous and uncertain environment. It will
    improve the ability to make the right decisions at the right moment and as such
    seize the right opportunities to create competitive advantage. Descriptive analytics
    enable an organisation to use a variety of'
