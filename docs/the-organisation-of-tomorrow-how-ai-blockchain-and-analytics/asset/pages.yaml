    the more jobs will be taken over by AI and robots.126, 127 However, almost certainly,
    most of the existing organisations will never transform into complete DAOs, which
    are absent of management and employees and run completely by autonomous code.
    Consequently, there remains a human element to organisations and, as a result,
    *the social, the material, and the artificial* should exist in coherence and interact
    with each other without negatively affecting one another. This means the artificial
    adheres to the ethics valued by the social (which is a challenge in itself, as
    we will see in Chapter 6), the material is bound by the norms and principles of
    our society and the culture within an organisation, and the social is not subordinate
    to the material and the artificial. All three should exist in balance with each
    other, and organisations that ignore the human side of doing business are likely
    to face difficulties.


