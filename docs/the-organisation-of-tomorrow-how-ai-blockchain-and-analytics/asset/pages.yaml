    Let''s discuss each step briefly.


    # (1) Define the reason


    First of all, it is important to decide why you would need a chatbot. A chatbot
    should be a means to an end, but not an end itself. It should alleviate a pain
    point or increase your customer engagement. It cannot, yet, replace your entire
    customer support department. Understanding the objective of your chatbot will
    help define the conversation flow as well as determine the type of chatbot you
    need. There are different types of chatbots ranging from simple FAQ bots, so-called
    “on rails” bots, to chatbots that allow the input of free text. The more you allow
    the user to determine the direction of the conversation, the less the chatbot
    is in control. That determines how you can use the chatbot.


    # (2) Create the conversation flow


    Designing the conversation within a chatbot is challenging. Not only should you
    develop a persona that matches your brand personality, but the conversational
    interface should also be clean, and the chatbot should aim for a positive experience.
    Therefore, the conversation should not be developed by the developer, but by a
    copywriter in collaboration with the marketing or communication department. It
    is important to create the right conversation flow for the right objective. Especially,
    because an open question can get a lot of different responses. To ask a question
    in such a way where you get a narrow set of responses is challenging. Therefore,
    any text that is used within the chatbot should be written by copywriters, and
    not the developers. This will likely result in some sort of governance structure
    to be in place (especially in large organisations) around the content that is
    given as input to the chatbot. Especially, because for some conversations, people
    feel more comfortable with a chatbot than with a human and you would want to be
    prepared for that. For example, an Australian financial services company noticed
    that customers felt more comfortable cancelling with a machine than they do with
    a human. In such cases, sentiment analysis is an important aspect. It can be used
    to ensure that the bot has a positive attitude and customers have a positive experience.
    Unfortunately, people will also always try to break a chatbot by providing nasty
    comments. An Australian chatbot developer once had to block a 13- or 14-year-old
    kid because it threatened to kill the bot. Therefore, when developing a chatbot,
    you should pay attention to the'
