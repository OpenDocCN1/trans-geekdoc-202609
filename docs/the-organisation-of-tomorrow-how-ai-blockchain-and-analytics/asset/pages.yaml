    # 4.7.5 The content industry


    When the web was developed over 25 years ago, the technologies in place significantly
    lowered the cost of sharing content such as videos, music, and articles. Thanks
    to the internet, it has become possible to reach a large part of the global population
    simply from behind your computer. Those companies who first understood the power
    of the web, and managed to execute our vision correctly, are now the leading global
    monopolies we are so familiar with: we use Google for finding information, Facebook
    or WeChat for social activities, Spotify to listen to music, and YouTube to watch
    videos, etc. However, in recent years there has been an increase in fake news,
    clickbait, spam, and copyright infringements, enabled by these platforms. This
    book is also likely to appear on other websites, where it can be downloaded illegally
    without me, or my publisher, being able to do anything about it. Ripping videos
    off YouTube is extremely easy, and websites such as the Pirate Bay continue to
    exist, thereby damaging those who created the content. Even medical journals are
    now experiencing problems with fake news. The open-access system of allowing the
    internet to distribute high-quality research to a wider audience has allowed unreliable
    content into the mix.347 Spam also remains a problem, since people keep falling
    for it. Since spam is extremely cheap to send out, only a few individuals out
    of millions have to fall for it to make it worth sending. For the last few years,
    the best methods to fight spam have been to attempt to legally shut down spammers
    and create better spam filters.


    With media attention to these problems growing, people are increasingly becoming
    aware of the effects that emerging technologies have in the hands of such tech
    organisations; there is an increase in low-quality content, but more importantly,
    genuine content creators are no longer in control regarding distribution and compensation
    of the content they create. Instead, large (online) publishers and distributors
    own all the rights, and the original content creator only gets a small percentage
    (55 per cent on YouTube, 10–15 per cent with book publishers, and 0 per cent on
    any content on Facebook). This does not only count for user-generated content,
    but also large news publishers miss out; 62 per cent of Americans obtain their
    news on Facebook while publishers on Facebook only get paid US$100 a day.348,
    349


