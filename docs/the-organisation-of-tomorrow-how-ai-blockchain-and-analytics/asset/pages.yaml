    # 4.7.1 The financial services industry


    Traditionally, the financial services industry is known for its legacy systems
    and some banks have stacks of legacy systems, some of which are 30–40 years old.
    It is, therefore, not surprising that the financial services industry has embraced
    blockchain technology to improve many of their outdated systems and, along the
    way, save a lot of money (which, not surprisingly, might be the main reason for
    them to adopt blockchain). Using a distributed ledger, banks can trade faster
    and cheaper and become more efficient. Some of the benefits are as follows.


    # Instant settlements


    Transactions can be done in minutes or seconds, while currently, settlements can
    take up a week. With blockchain technology, settlements become user-optimised,
