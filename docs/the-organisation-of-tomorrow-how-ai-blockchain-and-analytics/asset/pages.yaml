  md: 'Blockchain, however, does have a bright future and some say that it is a bigger
    invention than the internet or the steam machine, with which I concur.

    A blockchain is a shared and decentralised public or private ledger

    describes a single version of the truth of ownership. It is a distributed ledger

    that uses database technology to record and indefinitely maintain an ever-

    growing list of data records, which are immutable, verifiable, and traceable.

    At first, these data records were bitcoin transactions. Today, applications

    have moved to any type of online transaction across any industry. Block-

    chain not only offers us a chance to fix many of the problems that exist due

    to the centralisation of the web but also enables us to take over where the

    internet has fallen short. But first, to understand the impact of blockchain

    on your organisation, let''s first discuss how organisations have changed so

    you will appreciate the impact blockchain can have. Then, I will discuss

    what blockchain actually is, because an understanding is important to see

    the enormous potential of it. For that, I will paraphrase parts of chapter 2

    of my latest book, co-authored with Dr Philippa Ryan, Blockchain: Trans-

    forming Your Business and Our World.²⁴² If you have read that book, you

    can skip sections 4.2.1–4.2.6. If you believe you want to learn more about

    blockchain after finishing this chapter, I would highly recommend reading

    that book as it will inform you how blockchain can be used for social good.

    How blockchain can contribute to solving some of the United Nations

    Sustainable Development Goals and solve wicked problems such as identity

    theft, poverty, climate change, fraud, censorship, democracy, and fair trade.

    After discussing what blockchain is, I will discuss the intricacies of crypto-

    currencies and tokenomics, the impact of blockchain on privacy and reputa-

    tion. I will conclude with discussing how blockchain will affect several

    industries.


    # 4.1 Introduction


    The earliest organisations of the twentieth century where seen as rational

    entities. They were evaluated based on their economic output and they had a

    strict hierarchy of authority. Power was distributed unevenly. Only a few

    people at the top of the organisation made all the decisions. These were so-

    called bureaucratic systems, where bureaucracy was deemed the most efficient

    way to create an organisation.²⁴³ Closed bureaucratic systems result in

    authoritative organisations, where authority and responsibility are owned by

    management.²⁴⁴ In the 1930s, this evolved to organisations that were seen as

    natural systems. Bureaucracy was no longer the leading paradigm, but

    humans were seen as the core of the organisation and deemed the most

    important resource. Within such organisations, the focus was on teamwork,

    cooperation, and motivation, and employees of such an organisation are

    pursuing multiple interests. The informal structure that develops among

    employees is more important than the official structure of the organisation.²⁴⁵'
