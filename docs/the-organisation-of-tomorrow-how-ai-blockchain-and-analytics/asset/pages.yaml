    from users but also reward consumers for usage of their data. This shift will
    become a significant but not impossible technical and cultural challenge for organisations
    to meet. And if you think that this is still far away, you are wrong. As of 2018,
    multiple organisations are already working on giving consumers back the control
    over their data. For example, the startup Blockstack is working on a new internet
