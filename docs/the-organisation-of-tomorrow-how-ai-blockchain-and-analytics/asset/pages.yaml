    # ## (3) Build the chatbot


    There are many different chatbot platforms, ranging from platforms that enable
    simple FAQ chatbots to more advanced chatbots that take into account the context.
    Once you have decided what platform to use, it is important to decide whether
    to outsource or not. There are plenty of chatbot developers out there that can
    help you, but not every developer might offer the right solution. It is important
    to investigate and ensure that you work with the right chatbot developer. In any
    case, it is important to provide the chatbot with as much context as possible.
    Context-aware chatbots can offer a lot of added value because they can offer a
    positive experience to the end user. Building a chatbot is the easy part, among
    others because of the many platforms and developers out there. Integrating the
    chatbot into your systems to incorporate the context is a lot more difficult.
    The most added value is achieved when, for example, the chatbot is connected to
    your CRM system and a customer wants to change an address and the chatbot can
    say: “sure, give me your new address, and I will update the system for you”. This
    is where you see operational efficiency, satisfaction, and the Net Promoter Score
    (NPS) going up. Context matters. For example, an American chatbot developer created
    a chatbot that is person-aware, meaning that the chatbot knows who the person
    is in the chat as the chatbot is linked to internal company systems. So, the moment
    an employee starts a conversation, the bot already knows the context. As a result,
    it is a lot smarter because it has a better understanding of the context, resulting
    in a better experience for the user.


    # ## (4) Train the chatbot


    With software and AI development come bugs. That is the nature of software development.
    Therefore, it is important to train and test the chatbot properly. When training
    the chatbot, the amount of data is important. A million transaction scripts may
    seem fine, but if the chatbot will handle ten million conversations, it is not
    enough. However, if your training data is 10–20 million conversations and you
    can only get 2–3 million conversations, your foundation is relatively set. It
    could take a lot of time before the bot will encounter unknown responses. When
    playing with unsupervised learning, the training data should always be significantly
    higher than the expected live data.


    The best approach is to have machine and person to work together until there is
    sufficient confidence around the decisions that are coming out of the system.
    With any training data for AI, it is important that the data is unbiased and of
    high-quality. If not, the AI will become biased as it does not know any better.
    Conversational utterances or linguistic statements are going'
