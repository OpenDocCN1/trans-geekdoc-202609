    concept, leaving the large majority of content creators with (near) empty hands
    and the revenue owned by said tech giants, distributors, or other middlemen. And
    that is a problem. It is time for change. It is time for the Imagination Age.


    The Imagination Age was first coined by designer and writer Charlie Magee in 1993.
    It is a theoretical period after the Information Age, when creativity and imagination
    become the primary drivers of economic value.350 Technologies such as blockchain
    and artificial intelligence will play a key role in enabling the Imagination Age.
    Not only will they empower content creators and enable them to earn a fair reward
    instantly, they will also enable creators to develop better content and earn higher
    revenues. For example, blockchain can enable us to return content ownership to
    the content creator. Recording metadata and copyright information on a blockchain
    is the first step to put content creators more in control as it establishes undeniably
    who created what content when. The company Proof of Existence is an online service
    that incorporates blockchain. It involves content being certified and timestamped
    into the bitcoin blockchain, providing a cryptographic record. It is a public
    record proving you own the content without actually revealing the information
    or yourself. When you add metadata of content on the blockchain as well, it becomes
    possible to verify at any time that you were the original creator. This information
    can be used to take back control if someone violates your copyright, but it is
    not yet sufficient to bring back control completely. In fact, in 2018, China’s
    Supreme Court ruled that blockchain evidence is legally binding evidence. The
    court ruled that internet courts in the country have to recognise “digital data
    that are submitted as evidence if relevant parties collected and stored these
    data via blockchain with digital signatures, reliable timestamps and hash value
    verification or via a digital deposition platform, and can prove the authenticity
    of such technology used”.351


    To achieve such a system on a global scale, we also need to establish a decentralised
    infrastructure where content creators know when their content is distributed across
    the web by whom. If that information is available in real time, the next step
    should be to allow content creators to deny the content distribution through certain
    channels, for whatever reason. The final stage of giving back control to creators
    is real-time payment when content is consumed, directly from consumer to creator,
    without intermediaries confiscating the revenue. Also, those helping to distribute
    the content in the correct manner should be rewarded for increasing the reach
    of the content. Multiple startups are working on this, including Akasha, Steem.it,
    and Decent. It requires a cryptocurrency and real-time payments and distribution
    of revenues using smart contracts. As such, blockchain offers content creators
    the possibility to take back control and be rewarded fairly and instantly.


    Without any one individual or organisation maintaining or controlling a database,
    blockchain will ultimately change the way content is created, shared,'
