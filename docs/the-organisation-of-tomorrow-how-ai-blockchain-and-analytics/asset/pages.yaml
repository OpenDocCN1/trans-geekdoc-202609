- pgno: 137
  md: 'to be biased and, unfortunately, unbiased data is hard to detect automatically.
    Thus, it requires a lot of manual work, such as pre-processing the data, removing
    synonyms, removing stop words to remove any bias. Finally, training your chatbot
    does not stop when the bot is launched. It is a continuous process, and you require
    analytics to do so.


    # **(5) Analyse the conversations**


    A conversation is by its nature data-driven and leads to more data. This data
    can be analysed, and the insights of the analytics can be used to improve the
    conversational flow of the chatbot as well as the responses. You need thorough
    testing processes in place to enable output text to be used to train the chatbot
    again. You do not want biased data to enter the AI. Since all conversations are
    data, it is possible to extract valuable information from the conversations. This
    can be done both actively and passively to capture and feed that data into the
    overall reporting mechanisms. It can be done on a micro level of an individual
    conversation for an individual user. It can also be done at a macro level for
    the questions that are being asked and answered by all users. This is called conversational
    analytics: what was said, how it was said, what was the intent, what is the sentiment,
    did we accomplish the goal, what was the goal? Where does it fit in the larger
    context? Without conversational analytics, it is impossible to develop an engaging
    and successful chatbot. It is also possible to add the capability to jump in and
    intervene in any conversation, but that sort of deceits the purpose. However,
    it can be useful because often machines still don’t understand the full context
    and then human intervention can be required.


    # **(6) Improve the chatbot**


    Of course, all analytics can offer valuable insights to improve the chatbot. Reviewing
    the transcripts and looking at places where the chatbot did not understand what
    people are asking can help to build up the data sets to improve the chatbot. Alternatively,
    you can look at places where the chatbot thinks it got it right, but actually
    got it wrong and rectify that information to improve the conversation. The objective
    should be to continuously improve the chatbot, make it increasingly context-aware
    and better at understanding the intent of the conversation. Such supervised learning
    will improve the chatbot. This can prevent problems such as Microsoft’s Tay that
    used unsupervised learning (meaning the data of the users were used to learn without
    this data being labelled by humans).


    On March 23, 2016, Microsoft launched an AI chatbot on Twitter, called Tay. Tay’s
    objective was to have conversations with Twitter users, learn from these interactions
    and improve its conversations. However, after only 16 hours and 96,000 tweets,
    Microsoft took Tay offline as it had tweeted inappropriate,'
