    # 6.3 The dangers of AI


    Artificial intelligence offers a lot of advantages for organisations by creating
    better and more efficient organisations, improving customer services with conversational
    AI and reducing a wide variety of risks in different industries. Although we are
    only at the beginning of the AI revolution that is upon us, we can already see
    that artificial intelligence will have a profound effect on our lives, both positively
    and negatively. In 2018, Elon Musk praised the work of OpenAI after a team of
    five neural networks had defeated five humans, who ranked in the top 99.95 percentile
    of players worldwide, in the popular game Dota 2. The five bots had learned the
    game by playing against itself at a rate of a staggering 180 years per day. In
    April 2019, the OpenAI team consisting of five improved bots, for the first time,
    beat a reigning world champion e-sports team. With 45,000 years of practice, the
    five bots successfully navigated difficult strategic decisions. The game requires
    strong teamwork among the five players and, therefore, the achievement is quite
    remarkable. It is more evidence that AI is rapidly becoming more advanced. However,
    directly after the five bots beat the five humans 2–1 in 2018, Musk cautioned
    for the power of AI by urging that OpenAI should focus on AI that works with humans,
    instead of against humans.421 His statement is in line with his previous warnings
    for AI, which Musk believes could result in a robot dictatorship or an AI-arms
    race amongst superpowers that could be the most plausible cause for the Third
    World War.422 Therefore, we need to focus on developing Responsible AI, where
    organisations exercise strict control, supervision, and monitoring on the performance
    and actions of AI.


    Failures in achieving Responsible AI can be divided into two, non-mutually exclusive
    categories: philosophical failure and technical failure.116 Developers can build
    the wrong thing, so that even if AGI or SAI is achieved, it will not be beneficial
    to mankind. Or developers can attempt to do the right thing, but fail because
    of a lack of technical expertise, which would prevent us from achieving AGI or
    SAI in the first place. The border between these two failures is thin, because
    “in theory, you ought first to say what you want, then figure out how to get it.
    In practice, it often takes a deep technical understanding to figure out what
    you want”.116 Not everyone believes in the existential risks of AI, simply because
    they say AGI or SAI will not cause any problems or because if existential risks
    do indeed exist, AI itself will solve these risks. Meaning that in both instances
    nothing happens.423 Nevertheless, SAI is likely to be extremely powerful and dangerous
    if not controlled properly, simply because AGI and SAI will be able to reshape
    the world according to its preferences. This may not be human-friendly. Not because
    it would hate humans, but because it would not care about humans. It is the same
    that you'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'might go “out of your way” to prevent on stepping on an ant when walking, but
    you would not care about a large ants’ nest if it happened to be at a location
    where you plan a new apartment building. In addition, SAI will be capable of resisting
    any human control.117, 424 As such, AGI and SAI offer different risks than any
    other known existential risk humans faced before, such as nuclear war, and requires
    a fundamentally different approach.


    To make matters worse, algorithms are extremely literal. They pursue their (ultimate)
    goal literally and do exactly what is told while ignoring any other, important,
    consideration. An algorithm only understands what it has been explicitly told.
    Algorithms are not yet, and perhaps never will be, smart enough to know what they
    do not know. As such, they might miss vital considerations that we humans might
    have thought of automatically. Therefore, it is important to tell an algorithm
    as much as possible when developing it. The more you tell, i.e. train, the algorithm,
    the more it considers. Next to that, when designing the algorithm, you must be
    crystal clear about what you want the algorithm to do and not to do. Algorithms
    focus on the data they have access to and often that data has a short-term focus.
    As a result, algorithms tend to focus on the short term. Humans, most of them
    anyway, understand the importance of a long-term approach. Algorithms do not,
    unless they are told to focus on the long term. Therefore, developers (and managers)
    should ensure algorithms are consistent with any long-term objectives that have
    been set within the area of focus. This can be achieved by offering a wider variety
    of data sources (the context) to incorporate into its decisions and focusing on
    so-called soft goals as well (which relates to behaviours and attitudes in others).
    Using a variety of long-term and short-term focused data sources, as well as offering
    algorithms soft goals and hard goals, will help to create a stable algorithm.62


    A mixed data approach can be used by the algorithm to calibrate the different
    data sources for their relative importance, resulting in better predictions and
    better algorithms. The more data sources and the more diverse these are, the better
    the predictions of the algorithms will become. As such, AI learns from its environment
    and improves over time due to deep learning and machine learning. AI is not limited
    by information overload, complex and dynamic situations, lack of complete understanding
    of the environment (due to unknown unknowns), or overconfidence in its own knowledge
    or influence. It can take into account all available data, information, and knowledge
