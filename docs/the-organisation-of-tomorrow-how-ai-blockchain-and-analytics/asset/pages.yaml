- pgno: 78
  md: 'The main advantage of a Ricardian contract is that if there is a dispute among
    parties involved, the case can be decided in court. This is not possible with
    smart contracts, which are only the instructions based on what is defined in an
    agreement. If something goes wrong, proving a scam or fraud in court is difficult
    since a smart contract is not a legally binding agreement. Another benefit of
    a Ricardian contract is that once a human-readable agreement is turned into a
    machine-readable agreement, it can be hashed. The hash can then be stored on a
    blockchain. This would ensure that each part of the document can be uniquely identified
    by its hash and it becomes impossible to change the original agreement without
    the other parties knowing. As a result, Ricardian contracts are extremely secure.


    It is important to note that there is no legal framework with smart contracts.
    As a result, if an unexpected event occurs, smart contracts lack the ability to
    evolve as there are no guidelines on how to proceed. Ricardian contracts, on the
    other hand, do come with a legal framework and this adds clarity for all stakeholders.
    This means that, contrary to smart contracts, you require lawyers to create and
    deploy a Ricardian contract.


    Smart contracts may seem revolutionary, but they are nothing new and have been
    around for a long time. Smart contracts are already in place in most modern office
    buildings. For example, access cards that determine whether you are allowed entry
    to a certain area are pre-defined by a piece of code and linked to a database.289
    As such, smart contracts have been around for a long time already. The only difference
    now is that when they are deployed on a blockchain, they remain accessible indefinitely
    and will carry out their pre-defined tasks whenever certain conditions are met.
    Smart contracts offer tremendous opportunities for organisations. Organisations
    that deploy smart contracts to facilitate inter-organisational transactions become
