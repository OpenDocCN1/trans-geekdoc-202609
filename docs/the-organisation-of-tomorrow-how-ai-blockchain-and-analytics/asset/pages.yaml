    # 3.5 Empowerment and open strategising


    Although big data refers to the creation, storage, and usage of large volumes
    of data, analytics offers insights from any type of data, regardless of the volume,
    velocity, variety, variability, or veracity (as long as the data is unbiased and
    of high quality of course).163, 164 The various types of analytics enable organisations
    to detect, anticipate, and respond strategically in an ambiguous and uncertain
    business environment.166, 173, 177, 210–212 By doing so, analytics changes how
    organisations are managed, how organisations are designed, their culture and identity,
    and how decisions are made.138, 139 Access to such knowledge and information not
    only results in a better understanding of the context and improved decision-making
    capabilities but also results in a shift in power within organisations.35, 52,
    55 Shifting the power balance within an organisation, however, requires a different
    way of working'
