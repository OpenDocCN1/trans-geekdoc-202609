    # 6.1 The algorithmic organisation


    Superintelligence is still (very) far away. At first, we face the challenge to
    develop an algorithmic organisation, which is an organisation built around smart
    algorithms. Within such organisation, algorithms define company processes, deliver
    customer services, act when necessary and as such define the way the world works.
    Algorithms will become the intellect, the interoperability, the connection and
    the exchange between consumers, things, processes, and information that define
    the value of businesses. Thanks to machine learning and deep learning, algorithms
    will be able to understand user and/or device behaviour, learn from users and/or
    devices and perform the right action accordingly. Algorithms will optimise your
    supply chain, they will drive our cars, they will monitor your robots, they will
    replace your call centre, they will determine the right marketing message, they
    will keep your company secure, and they will even become your boss. Algorithms
    will be able to do so, because they are able to consider the entire context. Context
    that is so important, and required, to truly understand what is going on within
    a particular process, business, device, or changing environment. With sufficient
    data sources, that each tells its side of the story, algorithms can better determine
    the right action based on a myriad of data points. This is why the datafication
    of your business is so important, as you need a large variety of data sources
    to become context aware.


    To understand the importance of context, let’s take the example of a self-driving
    car. A self-driving car that can navigate autonomously can be very useful, it
    can replace a human, and if it is good at detecting its environment, it can do
    so safely. However, when a self-driving car would be able to interact'
