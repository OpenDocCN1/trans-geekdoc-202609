- pgno: 59
  md: 'out in the past years. One of the reasons for this is that organisations have
    not yet adopted security analytics in their organisation but are still relying
    on near obsolete processes and technologies. Often, monitoring still depends on
    too many manual processes and tools that are not integrated with each other, resulting
    in an incomplete overall picture. As a result, organisations face a lot of false
    positives, due to the lack of intelligent analytics resulting in too much noise.
    Very few organisations correctly protect their business, let alone store their
    sensitive documents or passwords correctly. In the 2014 Sony hack, hackers found
    a folder on a server containing unencrypted passwords. To make matters worse,
    that folder was called passwords.237


    It is time that organisations face the facts and start protecting themselves,
    and their customers. Security analytics can help you handle the complex data landscape,
    especially for organisations that have large data centres, thousands of employees
    that use their own devices, and employees and customers that use vulnerable connected
    devices. With security analytics, you can gain the data and insights required
    to protect your IT resources. A few vendors operating in this area include NetSentries
    and Argyle Data. Security analytics can identify the red flags that often precede
    a breach or attack. You can find devices or hardware that are communicating with
    unauthorised systems or networks and lock them down before someone can use that
    device to get into your infrastructure. IT security specialists can use security
    analytics solutions to look beyond perimeter-based protection and determine whether
    they need to act based on the network traffic they are seeing. With security analytics
    in place, you will have the possibility of derailing zero-day attacks (software
    bugs discovered by hackers that are unknown to the developer) before they cripple
    your organisation or cause a costly data breach. Machine learning plays an important
    role in automating at least parts of this process. It will prevent your IT security
    staff from becoming overwhelmed by the sheer volume of information that they need
    to look at. As your organisation fends off attacks related to your hardware and
    connected devices and discover more markers for potential vulnerabilities, the
    security analytics solution can use this data to handle lower priority issues.
    Your IT security analysts can then focus their attention on complex exploits and
    other concerns that require a hands-on approach. Security analytics is becoming
    a prerequisite for the organisation of tomorrow, but security analytics alone
    is not enough. Especially in larger organisations, it is time to introduce the
    Chief Information Security Officer (CISO).


    # 3.6.2 The Chief Information Security Officer


    The Chief Information Security Officer is not only responsible for your security
    analytics but has the responsibility over anything data related. The CISO should
    be an important role within the board and should look at combatting persistent
    threats and mitigating exposure of the company’s IT'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'systems to (large) cyber-attacks. The CISO should focus on reducing the possibility
    of fraud on business processes, preventing hacktivism on company networks as well
    as identifying insider threats. The CISO should create a secure environment that
    is capable of dealing with large quantities of data. Security analytics involve
    terabytes or petabytes of data due to log information from monitoring your network,
    database information, identify information, and all kinds of other system data
    that needs to be analysed in real time to know what is going on. Within a true
    security analytics environment, an organisation should be able to combine security
    intelligence with business transactional data as well as unstructured company
    data such as emails to obtain a complete picture of what is going on. This will
    allow you to find all kinds of unique patterns and anomalies that actually might
    be, for example, a very slow-moving attack that in the end could do much harm.


    The introduction of the Chief Information Security Officer is just the beginning.
    The world of digital security is changing rapidly, and organisations should evolve
    as well. Cybercriminals are constantly changing their tactics, finding new ways
    to attack companies. If a company refuses to stay up-to-date, it is almost begging
    to be hacked. This new reality requires a new approach to security. Protecting
    your company should be focused on prevention, detection, and response. On the
    one hand, you should make it as difficult as possible for criminals to hack your
    systems and exploit your data. Encrypt your data, and especially your passwords,
    and use firewalls to protect your systems from outside intruders. On the other
    hand, focus on monitoring and detection to know what is going on within your network
    and company. Combine different, real-time, automatic tools to discover patterns
    and anomalies that could expose an intruder, identify offences as well as find
    security incidents that require your attention. Remove any manual activities and
    make use of automated intelligent processes that analyse deep internal and external
    security intelligence. Once a security threat is detected, you should focus on
    the response to minimise the possible damage.


    Security analytics is a difficult field, which involves large volumes of data,
    smart algorithms, and extensive encryptions. The brightest minds and/or smart
    software tools should be used. It should be on top of the agenda for every company.
    For many organisations, it will be an expensive investment to make, but not doing
    it could turn out to be a lot more expensive.


    # 3.7 Conclusion


    Big data has often been coined the next “management revolution”, the Fourth Industrial
    Revolution, or “the next frontier for innovation, competition, and productivity”.34,
    170, 238 While only a few years ago, organisations were still struggling to understand
    the impact of these trends on their business, big data has now emerged as the
    corporate standard.167 Big data analytics affects all organisations, big or small,
    has an impact on every industry'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'around the globe, and is a key characteristic of the organisation of tomorrow.⁶⁴
    Especially in these ambiguous and uncertain times, analytics enables organisations
    to sense opportunities. Using large amounts of structured and unstructured data
    and applying it to advanced analytics enables organisations to understand their
    environment and seize opportunities, which enables them to remain competitive.
    Data analytics, when conceptualised as dynamic capabilities, can help to interpret
    the business environment, enable managers to act, and result in sustained superior
    performance and competitive advantage. Therefore, the introduction of descriptive,
    predictive, and prescriptive analytics means that the traditional way of decision-making,
    based on experience and expertise, is exchanged for data-driven decision-making.
    When organisations provide more people with access to knowledge, power is distributed
    more equally, enabling employee empowerment within an organisation. This power
    shift is necessary to fully benefit from big data analytics.


    A great example of a company that became a data organisation is the company Kaeser
    Compressors. The company used to be a very traditional company that sold air compressors.
    A lot of them, in an industrial context. As David Judge, Vice President SAP Leonardo,
    explained to me, Kaiser Compressors managed to transform from a traditional product
    company, which has been around since 1919, to a service company providing Air-as-a-Service
    to its customers. In 2015, using sensors and smart IoT technology, it was able
    to change its product into a service, which ultimately became a platform. After
    all, when you can sell a product as a service, it means you can create data with
    it. When you have datafied a product, new possibilities arise such as selling
    a subscription to fresh air and offering a predictive maintenance programme and
    other analytics. In addition, you can then start to apply machine learning and
    AI to offer additional intelligence to your customers.


    In the past, Kaeser sold the air compressors to companies and servicing them was
    a revenue producer. Now, Kaeser sells air by the cubic meter. It remains the owner
    of the air compressors and maintenance is included in the price. It uses predictive
    analytics capabilities to reduce maintenance costs, while customers have a guaranteed
    supply of fresh air for their machines. Since then, Kaeser has extended its cloud-based
    solution with artificial intelligence and machine learning capabilities. This
    allows it to deal with real-time data and display the air compressors as a digital
    twin to ensure it is online and operational. The digital twin, including documentation
    and all historically important events, are visible to Kaeser, the customer, and
    relevant industry partners. A great example of how a traditional product company
    transformed into a data company that takes care of its customers.


    The development and application of big data analytics as a dynamic capability
    within your organisation takes time to mature. Especially, because a change in
    culture takes time. Organisations that want to achieve that, should first develop
    a shared understanding of what analytics means for their organisation to make
    initial investments in isolated environments, a.k.a. Proof of'
