    for free to a charity to help a cause he/she believes in, provides required data
    when booking a flight and requires payment for data when used in a marketing campaign.
    Within the organisation of tomorrow, the control will move from the organisation
    to the consumer. Consent moves away from a simple “I accept terms and conditions”
