    # 5.5 Data ownership


    Increasingly, consumers are concerned about who has access to their data. A 2016
    Pew Research survey showed that 74 per cent of consumers said it was “very important”
    to have control over who they could get information about them.388 The study also
    revealed that transparency of data collection is a concern. Often, consumers do
    not even realise that they provide companies with the permission to use their
    data.389 Websites and applications were one of the first collectors of large amounts
    of personal data.390 Centralised organisations, such as Facebook, Google, or Amazon,
    have too much control over consumer data and this system no longer works. Such
    centralised control of data ownership by large corporations is harmful to consumers,
    as it gives centralised organisations enormous power and puts consumers in a vulnerable
    position. It limits transparency and authenticity because users can only see their
    own interactions or transactions. It becomes problematic when a third-party vendor,
    or a partner of an application a user utilises, has access to this information.
    Especially because companies do not necessarily make it easy for users to know
    who their partners or affiliates are that purchase the right or have access to
    the personal data of their users.


    According to Craig Mundie, senior adviser to the CEO of Microsoft and the company’s
    former chief research and strategy officer, the focus should shift from data collection
    and retention to how personal data are used. He suggested annotating data at its
    point of origin and wrapping it with metadata that includes how the data can be
    used by whom and under what circumstances.391 Alex “Sandy” Pentland, author of
    the book Social Physics, adds to this that consumers should have right to full
    control over their data and that the protection of personal privacy ensures the
    future success of a society.392


    One approach to achieve this is by using the keyless signature infrastructure
    (KSI) approach as discussed earlier. This would enable consumers to add a “wrapper”
    with metadata and rules governing the use of personal data. This also could contribute
    to the protection of data when the wrapper is recorded on a blockchain and governed
    by smart contracts to ensure that organisations can not alter the rules without
    the consumer knowing. The result is data that consumers can control and own, instead
    of an organisation. Smart contracts can then be used to change rules securely,
    depending on certain pre-set conditions and parameters. Therefore, with blockchain,
    data governance can'
