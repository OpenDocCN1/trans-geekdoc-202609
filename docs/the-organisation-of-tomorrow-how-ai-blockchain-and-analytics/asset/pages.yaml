    or governments owning a person''s identity, the consumer is in full control and
    determines, for each interaction, who gets access to what data points. Attributes,
    reputation, and shadow reputation result in a unique identity of an individual,
    organisation, or thing.


    As discussed in Chapter 4, a self-sovereign identity can be defined by the 5P''s
