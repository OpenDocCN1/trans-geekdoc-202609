    Sydney (UTS) from 2016 to 2019. Undertaking a PhD is a journey and turning my
    academic thesis into a, hopefully, easily digestible book turned out to be a journey
    in itself. Doing a PhD and subsequently turning it into this business book would
    not have been possible without the help of multiple people, whom I would like
    to thank for their hard work, contributions, discussions, and reviews. Without
    them, this book would not have become the book it became.


    Therefore, first of all, I would like to thank Jochen Schweitzer, my principal
    supervisor at UTS, for challenging and stretching me intellectually. Thank you
    for your direct and critical feedback on the work I created, but also supporting
    me in the intellectual journey that I gave myself. Thanks to your valuable and
    tireless input, I have been able to write a thesis in the way I did, which subsequently
    I have been able to transform into this book. Without your input, that would not
    have been possible. I would also like to thank my other supervisors, Mary-Anne
    Williams and Danielle Logue, for your input and feedback on the work and papers
    I wrote. Your feedback helped me improve my work and see things differently when
    needed.


    Once the book was written, I was able to improve the initial version of the manuscript
    thanks to the great feedback provided by Christian R. Meier, Glen Hendriks, Maksym
    Koghut, Pieter Bos, Stephan Janssens, and my co-author of my second book, Philippa
    Ryan. Without your feedback, I would not have been able to improve the book. Thank
    you so much!'
