    time and space. In the coming years, we will likely see a wide variety of applications
    using smart contracts that will change how we work, how we do business, and how
    we run our daily lives. This will increasingly take away the middleman, managers,
    and employees.


    Organisations adopting blockchain technologies can be viewed as Human-Machine
    Networks (HMNs), where combinations of humans and machines interact with each
