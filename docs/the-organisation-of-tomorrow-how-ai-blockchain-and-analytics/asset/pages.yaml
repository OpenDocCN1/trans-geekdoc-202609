    analytics. It has become a prerequisite for a company facing uncertainty to use
    analytics to understand the environment and better grasp the context of their
    organisation. Therefore, the organisation of tomorrow cannot survive without comprehensive
    analytics. It is required to understand what is going on and how to respond to
    changes in the context of the organisation. However, where data become increasingly
    important, and knowledge is shared within the company, data shift the power structure
    within the business; moving it away from leaders with years of experience to those
    employees who have access to data and the power to analyse that data for insights
    to make (strategic) decisions and create new opportunities.55 Within the organisation
    of tomorrow, information has to be available to those capable of making sense
    of it and/or those facing the customer.


    Using analytics, there are multiple ways to retrieve insights from your data.
    Each type of analysis will have a different impact or result. The data mining
    technique you should use depends on the kind of business problem that you are
    trying to solve. One of the common ways to recover valuable insights is via the
    process of data mining. Data mining is a buzzword that is often used to describe
    the entire range of big data analytics, including collection,'
