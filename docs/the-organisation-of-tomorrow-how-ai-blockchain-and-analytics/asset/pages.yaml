    # 2.3 The introduction of the artificial


    With rapid advancements in AI, organisations are increasingly dealing with (intelligent)
    artificial actors. This requires a different approach, since AI is fundamentally
    different from human intelligence.¹¹⁴ Intelligence is “the complex expression
    of a complex set of principles”, consisting of various interdependent subsystems
    all linked together.¹¹⁵ Intelligence exists because of evolution, and it enables
    humans to model, predict, and manipulate reality. This unique ability allows us
    to reason backwards and forwards from a mental image and reason on possible (un)desired
    future outcomes. Evolution created our intelligence, but evolution is an inherently
    dumb process. It achieves its goal by trial and error and does not possess the
    foresight capabilities that we humans have. In fact, the unintelligent process
    of evolution has resulted in flaws in human intelligence.¹¹⁶ Due to various constraints,
    such as food availability, trade-offs with other organs and biological materials,
    it is possible that our brains have not evolved in the most optimised way.¹¹⁷
    Artificial intelligence, on the other hand, will be developed by (artificially)
    intelligent beings/things which do possess the foresight capabilities that evolution
    misses. As such, it is better capable of understanding which materials and what
    processes work best for intelligence. It can apply the knowledge of others to
    improve (initial) designs and as such improve its intelligence.¹¹⁷ Consequently,
    artificial intelligence will'
