    Ownership of physical products can also be transferred and stored on a blockchain
    when owners sell their assets (such as art) by transferring a private key attached
    to that asset.42 When this is done automatically using smart contracts, it is
    called smart property. Smart contracts are a special branch of transactions that
    can be stored on a blockchain, using, for example, the Ethereum or NEO blockchain.130
    Smart contracts can have a major effect on organisational design and decision-making.42,
