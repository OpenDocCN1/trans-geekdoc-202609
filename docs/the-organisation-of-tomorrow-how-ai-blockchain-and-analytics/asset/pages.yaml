    # 5.1 Data sharing


    For most organisations, the importance and advantages of data sharing are clear
    and have been clear for years.364 Combining various internal and external data,
    so-called mixed data, offers organisations additional insights that can significantly
    benefit the organisation.164 Sharing data across geographically dispersed business
    units can be challenging because of different standards, formats, or silos. Sharing
    data with the competition, however, is nearly impossible due to confidential data.
    After all, why would you share one of your organisation’s most valuable assets
    with your competitor? However, sharing this data with industry partners can greatly
    benefit all stakeholders. To do so, organisations require an accurate, reliable,
    and data-preserving technology. While existing companies such as DataStreamX or
    DataMarket offer novel solutions, none of them offers the benefits of sharing
    data that is trustable and private. Blockchain, however, enables organisations
    to keep control over their proprietary and confidential data if they want to share
    data with industry partners. The data will remain within the organisation, and
    simply provides industry partners with access to it under certain conditions.
    It enables organisations to segment data as they want, store each segment into
    a vault, and have full control over who has access to those vaults, governed by
    asymmetric cryptography and smart contracts. As a result, organisations “never
    make anything available that you can’t, or that you don’t want to”, according
    to Marciën Jenckes, advertising president at Comcast Cable, which will be releasing
    a data-sharing solution in 2019.365 Thanks to the usage of decentralised cryptography,
    the blockchain solution developed by Comcast is more secure than traditional solutions,
    which often enable reverse-engineering the data to obtain any missing information.
    Comcast is collaborating with several organisations, including NBC Universal,
    Disney, Altice USA, Cox Communications, TF1 Group in France, Channel 4 in the
    United Kingdom, and Mediaset Italia to figure out how the system should work.'
