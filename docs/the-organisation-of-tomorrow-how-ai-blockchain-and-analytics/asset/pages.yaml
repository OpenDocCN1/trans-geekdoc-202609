    Descriptive and diagnostic analytics are all about the past and the present. Descriptive
    analytics is about what happened and diagnostic analytics about why something
    happened. They enable organisations to sense, filter, shape, learn, and calibrate
    opportunities by providing insights into what has happened in their internal and
    external environment, from one second ago to decades ago.169, 170 Descriptive
    and diagnostic analytics are like looking into the rear-view mirror of your car.
    Using multiple structured data sources and statistical methods you can obtain
    insights about what has happened.171 Descriptive analytics is also known as business
    intelligence and it only offers insights into the past. It does not offer recommendations
    on how to move forward. A well-known example is Google Analytics that many organisations
    use to analyse their web traffic. It provides clear graphs to help you understand
    what happened to your website but does not provide recommendations on how to change
    your website to generate more traffic. Diagnostic analytics is about why did something
    happen, and it goes one step further than standard business intelligence. It is
    about asking the right questions to understand why something happened in the past,
