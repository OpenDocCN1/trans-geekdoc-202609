  md: 'Open strategising consists of two important principles: inclusiveness and transparency.221
    Inclusiveness is about involving previously excluded actors in the strategy-making
    process while transparency is about being transparent when communicating with
    those actors.215, 219, 221–224 Both principles are only possible because of the
    availability of data and analytics. It enables organisations to actively incorporate
    input from previously excluded actors during strategy making who must actively
    engage and interact with each other, since sensemaking “takes place in interactive
    talk”.23, 225 Within collaborative decision-making, transparency and inclusiveness
    are, therefore, important. Inclusiveness ensures actors can actively participate
    in decision-making processes, while transparency ensures all actors remain aligned.223
    Although open strategising changes collaboration within human-to-human networks
    by empowering employees and customers, it can also result in an extra burden of
    work due to the need to digest large amounts of information. This is where big
    data analytics comes in.226–230 Big data enables inclusiveness by collecting and
    aggregating ideas (of course, only with full consent of the stakeholder), while
    analytics enables transparency by summarising the conversations and detecting
    actionable ideas among the data, using Natural Language Processing and text analytics.
    This can result in new business lines or strategic directions for the organisation.220,
    231–234


    One of the first examples of a successful open strategy project was IBM’s Annual
    Innovation Jam, a concept developed in 2001 to unite the organisation and to understand
    what ideas reside in the organisation. Everyone in the organisation can contribute
    and, through game theory, the ten best ideas are selected that will receive funding
    to be developed further. After some time, those ten ideas are evaluated. Some
    will be developed further, while others will be stopped. The IBM Jamming Sessions
    show that many people within an organisation have important strategic ideas. Often,
    in a closed-strategy process these are not used as strategy-making is done near
    the top of the organisation. The Jam Sessions, however, bring many ideas together.
    It has resulted in many new big product lines or smaller ideas that contributed
    to bigger ideas. The IBM Jam Sessions also show that people want to be engaged.
    That they want to share their ideas with a wider audience, even if those ideas
    do not generate as much attention. Since 2001, IBM’s Innovation Jam has been developed
    into an IBM product, which is successfully applied by dozens of organisations
    to include their employees, customers, and even competitors in the strategy-making
    process.


    Therefore, not only does big data analytics offer the insights to better interpret
    a fast-changing environment and improve the decision-making capabilities, but
    it also changes how the social collaborates when organising activities, enabled
    by the material and the artificial. Though open strategising is one form of collaboration
    made possible due to data and data-related technologies, there are more forms
    of collaboration that organisations should be aware of in these changing times,
    especially when the social and the'
