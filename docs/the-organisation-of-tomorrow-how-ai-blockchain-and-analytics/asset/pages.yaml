- pgno: 92
  md: 'public blockchain accountable. Private blockchains offer more control and a
    place to point the finger, but erasing information is still tricky.


    Given the nature of blockchain, it seems clear that the GDPR as written will be
    incompatible with existing blockchain uses. That doesn’t mean that compromises
    aren’t available. While you can’t delete data from the blockchain and maintain
    the current level of security, you can segregate the types of data stored on the
    chain. For example, the blockchain could retain records of contracts and changes
    with hashes that reference information that contains personal identification.
    If you buy a song using, for example, Voise, a P2P platform for musicians that
    enables direct-to-consumer sales, the details of the transaction would be stored
    on the blockchain. Your personal information (payment details, name, address,
    etc.) would go through a third party. That third party would control your music
    access and library of songs. By separating the types of data and putting personal
    information on centralised systems, blockchain becomes compliant. That’s not how
    things work now, but segregating data is possible. Of course, with segregation,
    your data is suddenly much more accessible and secure, right? Well, not completely.
    The GDPR gives you more control over your data, but it doesn’t increase security.
    As discussed in Chapter 3, data security is vital in data-driven organisations,
    and blockchain does contribute to that because on the blockchain, information
    is highly encrypted, decentralised, and secure. Centralising personal data to
    enable erasure, and with that to comply with GDPR, removes that added security.
    So, how to make this work?


    One thing the GDPR does not do is define “erase”. While it might seem clear what
    it means to erase data, there is definitely some grey area. Even “erased” data
    is often recoverable. If data is inaccessible, even to the entity providing storage,
    does that count as erased? If yes, blockchain technology can rapidly rise to the
    challenge by simply destroying the cryptographic key associated with certain information.
    The data will still be there, but it will be unreadable. This solution preserves
    the integrity of the ledger and offers a greater level of personal control over
    what information you share publicly. However, it should be ensured that the cryptographic
    keys are quantum-proof. Data that is encrypted and where the cryptographic key
    has been deleted may be deemed “erased” now but might become visible again in
    the future. Therefore, erasing data on a blockchain by deleting the cryptographic
    key would only work if the encryption used is quantum-computing resistant.


    Although blockchain technology seems to be incompatible with GDPR in terms of
    erasing data using non-quantum-resistant encryption, it is a worthy trade-off;
    blockchains offer increased provenance, transparency, privacy, and security of
    data, offering better protection of consumers than existing centralised technologies.
    Therefore, hopefully regulators and developers will come to an understanding about
    how to blend privacy controls with transparent transactions and bring the spirit
    of GDPR to the blockchain and vice versa. GDPR is also very much linked to another
    important concept in doing business: trust.'
