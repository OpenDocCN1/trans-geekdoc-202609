- pgno: 58
  md: 'With that, you breach your customers’ privacy, and that could make you liable,
    especially under the GDPR.


    However, even if you have implemented encryption, you could still face problems
    with the advent of quantum computing. Most of the existing encryption will end
    up useless when we have working quantum computers. The problem with existing cryptography
    is that a sufficiently powerful quantum computer could easily solve the mathematical
    problems that are currently used by most encryption algorithms. If that happens,
    any data that is currently encrypted using those algorithms will become accessible
    to those with access to such quantum computing. As such, intelligence agencies
    are, most likely, already storing currently unbreakable intercepted data in the
    hopes that quantum computing will give them access. Once hackers gain access to
    quantum computing, your encrypted data is anything but safe. As such, despite
    offering enormous opportunities to solve some of the world’s biggest problems,
    quantum computing is also one of the biggest security risks.


    Therefore, organisations should adopt quantum-computing proof encryption, also
    known as post-quantum cryptography or quantum-resistant cryptography. Fortunately,
    it is gaining more attention from researchers as well as organisations. However,
    developing new quantum-resistant cryptography takes time while the developments
    around quantum computing are accelerating. In 2018, Google revealed a 72-qubit
    gate-based superconducting system, bringing us rapidly closer to quantum supremacy
    (meaning a quantum computer that outperforms the world’s fastest supercomputer).
    By the time you are reading this book, it might be that quantum supremacy has
    already been achieved.


    End-to-end encryption that is resistant to quantum computing will become very
    important in the near future. Therefore, the organisation of tomorrow that wants
    to protect its data, that wants to protect its customers’ data and as such to
    comply with regulations such as GDPR, should ensure that its data remains secure,
    now and in the upcoming era of the quantum computer. Fortunately, quantum-resistant
    encryption is not the only measure organisations can take to secure themselves.
    The other option is to start using security analytics.


    # 3.6.1 Security analytics


    Security analytics can help you understand what is happening within your company
    and can help you act when it is needed most. Protecting your organisations from
    (would-be) hackers is difficult. Many organisations believe that security management
    has become more difficult over the past years. There are several reasons why security
    management has become more difficult including more complex IT systems that are
    required and limited talent that is available to develop the security measures.
    In addition, the threat landscape has become a lot worse with more sophisticated
    and successful hacks carried'
  merge: -1
