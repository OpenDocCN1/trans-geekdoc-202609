    # 6.2 Conversational AI


    Since a few years, chatbots are here, and they will not go away any time soon.
    Facebook popularised the chatbot with Facebook Messenger Bots, but the first chatbot
    was already developed in the 1960s. MIT professor Joseph Weizenbaum developed
    a chatbot called ELIZA. The chatbot was developed to demonstrate the superficiality
    of communication between humans and machines. It used very simple Natural Language
    Processing (NLP). In 1972, the PARRY chatbot was developed to simulate a paranoid
    schizophrenic person and in 1995 A.L.I.C.E. was a popular online language-processing
    bot.


    Of course, since then we have progressed a lot and, nowadays, it is possible to
    have lengthy conversations with a computer. Conversational AI consists of an advanced
    technology that uses NLP so that computers can comprehend human language. The
    most well-known chatbots are actually personal assistants (PAs), that can help
    consumers with a variety of tasks. The virtual PAs include Apple''s Siri, Amazon''s
    Alexa, Google Assistant, or Baidu''s DuerOS.


    Chatbots are a very tangible example where humans and machines work together to
    achieve a goal. A chatbot is a communication interface that helps individuals
    and organisations have conversations, and many organisations have developed a
    chatbot. There are multiple reasons for organisations to develop a chatbot, including
    obtaining experience with AI, engaging with customers, reducing the number of
    employees required for customer support, disseminating information and content
    in a way that users are comfortable with and, of course, increasing sales. Chatbots
    offer a lot of opportunities for organisations. They are an easy way for organisations
    to become familiar with artificial intelligence.


    Especially, because conversational agents by itself do not necessarily have to
    be artificially intelligent, but AI can play into it. In addition, they can be
    a lot of fun to interact with if developed correctly. But how do you start with
    conversational AI and how do you build a good and engaging chatbot? Starting with
    a chatbot is not easy, as there are many different variables to consider:


    +   1 define the reason for a chatbot;

    +   2 create the conversation flow;'
