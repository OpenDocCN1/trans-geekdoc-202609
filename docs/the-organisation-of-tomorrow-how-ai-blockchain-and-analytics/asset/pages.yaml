    # 4.2.4 Smart contracts and Ricardian contracts


    The term smart contract was first coined as “a computerised protocol that executes
    the terms of a contract”.284 It can be seen as a traditional agreement which is
    automatically defined and executed by code, leaving no room for discretion.42
    Smart contracts are analogous to scripts for processing transactions and/or decisions.
    They run on a blockchain and are considered “the killer application for the cryptocurrency
    world”.285 With the arrival of smart contracts deployed on a blockchain, the concept
    of what defines an organisation and how organisations can achieve competitive
    advantage changed drastically.


    Smart contracts can be seen as If This Then That statements, compiled into code
    (although a lot more complicated). They are software programs that will execute
    certain transactions or decisions, which were agreed upon by two or more actors.133
    They are created by choosing events or preconditions and providing what needs
    to happen when those preconditions are met. The protocol is then recorded on a
    blockchain. Once deployed on the blockchain, these scripts can no longer be altered
    and will always execute once the preconditions are met.286'
