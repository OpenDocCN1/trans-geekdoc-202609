    # 6.3.1 Explainable AI


    Researchers and developers can only see the actions of AI and infer the strategy
    from this but cannot see the reasoning behind it. This is why researchers are
    working on developing explainable AI (XAI) to help us understand why a certain
    decision was made.62, 112–114, 119, 425–429 XAI is a new field of research that
    tries to make AI more understandable to humans.


    The term was first coined in 2004 as a way to offer users of AI an easily understood
    chain of reasoning on the decisions made by the AI, in this case especially for
    simulation games.119 XAI relates to explanatory capabilities within an algorithm
    to help understand why certain decisions were made.62


    The more sophisticated AI becomes, the less obvious its behaviour becomes to the
    user of AI. With machines getting more responsibilities, they should be held accountable
    for their actions.119, 400, 430 XAI should present the user with an easy to understand
    chain of reasoning for its decision.119, 426 When AI is capable of asking itself
    the right questions at the right moment to explain a certain action or situation,
    basically debugging its own code, it can create trust and improve the overall
    system. Especially if it is able to explain its actions in “human-understandable
    concepts and terms”, also known as plain English.427, 429 The objective of XAI
    is to ensure that an algorithm can explain its rationale behind certain decisions
    and explain the strengths or weaknesses of that decision.431 Explainable AI, therefore,
    can help to uncover what the algorithm does not know, although it is not able
    to know this itself. Consequently, XAI can help to understand which data sources
    are missing in the mathematical model, which can be used to improve the AI. In
    doing so, XAI can be useful for developers to create better, more trustworthy
    algorithms, which in the end could lead to Responsible AI.


    In addition, XAI can help prevent so-called self-reinforcing loops. Self-reinforcing
    loops are a result of feedback loops, which are important and required to constantly
    improve an algorithm. However, if the AI misses soft goals and only focuses on
    the short term, or if the AI is too biased because of the usage of limited historical
    and/or biased data, these feedback loops can'
