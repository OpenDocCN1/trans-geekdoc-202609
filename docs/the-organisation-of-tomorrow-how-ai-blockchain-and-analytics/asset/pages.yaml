- pgno: 63
  md: '# Blockchain to distribute the organisation


    When the web was developed over 25 years ago, the technologies in place significantly
    lowered the cost of building a global company. Thanks to the internet, it has
    become possible to reach a large part of the global population simply from behind
    your computer. Those companies who first understood the power of the web, and
    managed to execute their vision correctly, are now the leading global monopolies
    we are so familiar with: we use Google or Baidu for finding information, Facebook
    or WeChat for social activities, Amazon or Alibaba to shop, and Apple or Huawei
    for our hardware, etc. For years, these companies have understood that data is
    a goldmine. Since their beginning, these companies have rigorously been collecting
    and storing data. This has resulted not only in them becoming powerful monopolies
    but it also contributed to a centralisation of the world wide web. This centralisation
    is in stark contrast to Sir Tim Berners-Lee’s vision of a decentralised web in
    which everybody participates and has full control over their data and the content
    that he or she creates. For the past years, it seemed that centralisation of the
    web was a new reality and that there was not much we could do about it. But then
    things changed when in 2008 a paper was distributed among a small group of cryptography
    enthusiasts.239 The author, Satoshi Nakamoto – a pseudonym for an unknown person
    or group of persons – described the concept of a cryptocurrency called bitcoin
    that solved the long-standing problem of double spending of digital funds.240,
    241 At first, the impact of the paper did not become immediately clear, although
    those involved in the early years of bitcoin immediately saw the potential it
