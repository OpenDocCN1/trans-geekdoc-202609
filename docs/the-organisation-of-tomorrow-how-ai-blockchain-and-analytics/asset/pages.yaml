    cryptocurrencies, are used to make financial transactions, and the most well-known
    is of course Bitcoin. Others include ZCash, Bitcoin Cash, or Monero.


    +   7 Wallets: of course, all those cryptocurrencies need to be kept somewhere.
    Wallets are the bank accounts of the crypto world. You can have hot wallets (connected
