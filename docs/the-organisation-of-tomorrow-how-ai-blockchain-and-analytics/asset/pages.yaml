  md: 'Predictive analytics, on the other hand, is all about the future and predicting
    what will happen.\(^{171}\) It uses machine learning and algorithms to find patterns
    and capture relationships in multiple unstructured and structured data sources
    to create foresight.\(^{172}\) Predictive analytics allows you to make future
    projections based on historical and present data. There are many different providers
    who offer predictive analytics solutions, including KNIME, Sisense, GoodData,
    Dataiku, or TIBCO Spotfire. Predictive analytics enables you to use the known
    raw data and process it so that you can make predictions on the information you
    do not know.\(^{172}\) As such, predictive analytics contributes to improving
    decision-making processes across the organisation.\(^{173}\) It is about the future
    and predicting what will happen.\(^{171}\) It is like your car''s navigation system,
    directing you to the fastest route around a traffic jam. The assumption is that
    organisations that use predictive analytics will gain a competitive advantage
    since they can anticipate the future.\(^{174}\) However, insufficient data and
    flaws or biases in algorithms and data could significantly harm organisations
    and their customers, which is why data governance is so important.\(^{175}\) I
    will discuss data governance in detail in Chapter 5.


    The final stage in understanding your business is prescriptive analytics. It is
    about what to do (now) and why to do it, given a complex set of requirements,
    objectives, and constraints. It not only offers recommendations on how to act
    upon predictions to take advantage of those predictions and transform an organisation
    accordingly, but it can also make decisions autonomously based on those recommendations.
    It leverages predictive analytics and descriptive analytics to derive ideal outcomes
    or solutions. Prescriptive analytics helps you solve business problems based on
    foresight achieved from continuously analysing a wide variety of (un)structured
    data sources.\(^{176}\) Prescriptive analytics not only allows you to make sense
    of raw data but also allows you to determine the actions to take now. It leverages
    machine learning, simulations, mathematical formulae, as well as optimisation
    and data modelling techniques to help enterprise leaders make better-informed,
    data-driven decisions.\(^{177}\) It is the final stage in understanding your business
    and offers you a thorough understanding of the environment to improve business
    performance.\(^{177}\) When given several options to choose from, prescriptive
    analytics is helpful in identifying the best outcome or solution based on known
    limitations and scenarios.\(^{176}\) It is about scenario planning to determine
    the best option for (autonomous) decision-makers, which can reduce the amount
    of uncertainty.\(^{6}\) It takes predictive analytics a step further by not only
    helping you to decide what business decision to make, but even to make that decision
    on behalf of you, often autonomously. In continuation of the car metaphor, it
    is a self-driving, autonomous vehicle that can pick you up and take you to your
