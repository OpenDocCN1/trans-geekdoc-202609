  md: '![](img/15e89dc32c54c5740f0bb8f5eb276fdf_152_0.png)


    Figure 7.1 The D² + A² model


    This D² + A² model consists of several actions, stakeholders, and required technologies
    that will help you prepare your organisation for tomorrow. Let’s discuss each
    step in the D² + A² model to explain why it is important, how you can approach
    it and what technologies will enable it.


    # 7.1 Datafy


    Transforming your organisation into a data organisation requires data above all.
    In order to achieve that, the first step is to datafy your organisation. Datafication
    is the process of making a business data-driven, by transforming social action
    into quantified data. It involves collecting (new) data from various sources and
    processes using IoT devices and/or creating detailed customer profiles based on
    all (digital) customer touchpoints. Datafying your organisation starts by making
    your office, your workplace, your processes, and your products smart. This will
    make previously “invisible” processes traceable so that they can be monitored,
    analysed, and optimised. Thanks to the lowering costs of sensors, increasing low-cost
    bandwidth, cheap availability of cloud computing and processing capacity, as well
    as numerous connected devices it has become easier and cheaper to make these processes
    smart. It will enable you to capture data consistently and universally across
    different processes, products, and workplaces. The data can then be used to create
    insights using analytics or enable actions using smart contracts. Of course, data
    quality is of utmost importance when datafying your organisation. Low-quality
    and biased data will be useless and can even cause damage to your organisation
    and customers. When looking at your processes, look at it from a new angle. The
    datafication of your organisations opens a whole new line of possibilities, which
    you should approach from an out-of-the-box perspective. Only then will you be
    able to come up with real added value for your organisation.


    There is hardly any limit to the datafication of your processes and your workplaces,
    as long as you comply with regulations that protect your employees'
