- pgno: 77
  md: 'Smart contracts have three distinctive characteristics: they are autonomous
    (after deployment on a blockchain they can no longer be altered), they are self-sufficient
    (they can accumulate and spend value over time), and they are decentralised (they
    are distributed across multiple nodes within a network).42, 131


    Once a smart contract is on a blockchain, it is final and cannot be changed (technically
    this is not true; smart contracts can be altered if the majority of the network
    agrees to do so. Within public permissionless blockchains this is very difficult
    to achieve, within private blockchains this is easier since there are fewer participants).
    However, certain parameters can be altered only if the original code allows for
    this. Therefore, it is vital for organisations to ensure that the code is 100
    per cent correct and that no bugs or errors remain in the smart contract when
    it is recorded on the blockchain. Mistakes can be extremely costly, as we have
    seen with The DAO Hack which lost US$50 million due to a mistake in the smart
    contract.287 The only way to fix a bug in a deployed smart contract is through
    a hard fork on the blockchain. A hard fork is a radical change to the protocol
    and makes any previous transaction invalid. It basically creates a fork in the
    chain and it requires all nodes to start working on the new path. It is exactly
    what happened with The DAO. Nevertheless, do not expect blockchains to create
    a hard fork every time an organisation deploys a faulty smart contract.


    Smart contracts not only have an impact on contract law but, more broadly, also
    on social contracts within societies and organisations. This is because smart
    contracts are automatically and autonomously executed, thereby taking out the
    need for human judgement and minimising the need for trust.42 In addition, smart
    contracts remove the need for developing, implementing or evaluating decisions
    by management or employees. When multiple smart contracts are combined, together
    with artificial intelligence and analytics, it becomes possible to automate decision-making
    capabilities.42, 130 This will result in a completely new paradigm of organising
    activity, which can result in new organisational designs that are completely run
    by computer code, so-called Decentralised Autonomous Organisations (DAOs).42,
    58, 130 However, there is one problem with existing smart contracts, which is
    that they are not legally binding. As a result, in 2018, there has been a renewed
    interest in Ricardian Contracts. These types of contracts differed from smart
    contracts that they are legally binding, and it records the agreement between
    multiple parties in human-readable and machine-readable text (contrary to smart
    contracts, which only executes what is defined in an agreement).288 This means
    that it is a legal contract that is easy to read and understand by everyone, so
    not only your lawyer or developer.


    Ricardian contracts were first introduced by Ian Grigg, one of the earliest pioneers
    in financial cryptography, in 1995. Ricardian contracts use cryptographic signatures
    to bind different parties into a legal agreement. They will automatically execute
    when certain pre-conditions have been met. Ricardian contracts not only define
    intentions but also execute instructions automatically.'
