    # 4.7.2 The retail industry


    The retail industry has become increasingly complex in the past decades. Products
    are made in one part of the world, assembled in another, and sold in a third part
    of the world, whether it is food, clothing, or flowers. As a result of this complexity,
    transparency has become challenging. It is not always clear to consumers how and
