    it removes a significant part of the risk that the counterparty cannot meet its
    obligations, which could be a substantial expense for banks.


    # Improve capital optimisation


    One of the main features of blockchain is that it removes the need for a trusted
    intermediary and makes peer-to-peer transactions possible. When Blockchain is
    applied in the financial services industry, it could render useless the fee-charging
    intermediaries such as custodian banks (those that transfer money between different
    banks) or clearers (those vouching for counterparties’ credit positions). As such,
    Blockchain offers better capital optimisation, due to a significant reduction
    in operational costs for banks. In addition, when banks share a blockchain, the
    total costs of that blockchain and the surrounding ecosystem might be higher than
    individual costs of managing transactions at a bank. However, the costs are shared
    among all participating banks and as such there is a significant cost reduction.


