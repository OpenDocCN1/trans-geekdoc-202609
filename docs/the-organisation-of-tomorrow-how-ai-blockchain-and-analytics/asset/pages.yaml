    Monitoring an artificial agent can be done using analytics. Analytics, as we have
    discussed in Chapter 2, refers to using data sources and statistical methods to
    understand how a digital agent performs and obtains insights about what has happened.169-171
    There is a wide variety of analytics, ranging from conversation analytics to anomaly
    detection, that organisations can use to identify problems with AI. Analytics
    offer insights to improve AI and, using subsequent insights, the principal can
    monitor if the agent behaves as planned and can take action if required. As such,
    analytics is an important monitoring tool.454


    Supervising a digital agent can be done by feeding the insights from analytics
    back into the algorithm and using unbiased training data to train the AI. Such
    supervised learning, whereby a human agent controls the data that is used to train
    the AI, can help the AI learn. Unsupervised learning, whereby the AI learns using
    unfiltered input data, as was the case with Tay, can have unwanted consequences.
    At least, as long as the AI is not yet smart enough to detect and remove biased
    data by itself.455 Preventing unsupervised learning can therefore, contribute
    to solving the principal-agent problem as the input data is pre-processed, cleansed,
    and any bias removed,175 thereby steering the AI in the right direction.


    Bug-free code, unbiased data, and developing ethical and explainable AI are three
    enormous challenges that we need to overcome if we wish to minimise the risks
    of AI becoming a force for the bad. Nevertheless, controlling, monitoring, and
    supervising seem a suitable approach for developers, managers, or organisations
    to reduce the effects of the principal-agent problem when dealing with AI. It
    will be easier to steer AI in the right direction if the underlying code, assumptions,
    and objectives are correct. They will not likely solve the principal-agent problem,
    just like controlling, monitoring, and supervising does not solve the principal-agent
    problem when dealing with human agents. However, as software will always have
    bugs, problems with artificial agents can be reduced with the right governance
    practices. Therefore, if we wish to ensure AI remains benevolent in the future,
    we should start today to make sure that any AI developed incorporates human values,
    uses unbiased data, is understandable and bug-free. A huge challenge, but one
    we cannot ignore.


