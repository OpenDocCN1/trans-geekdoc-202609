    # 4.8 Conclusion


    We have nearly reached the end of this very long chapter, which shows how complex
    the technology is that is coined to be a bigger invention than the internet. Knowing
    what blockchain is and how it can contribute to improving your organisation and
    supply chain is one thing; knowing how to develop a blockchain strategy is another
    thing altogether. Therefore, I have tried to provide you with a variety of ways
    how blockchain can and will affect your organisation. Blockchain, particularly
    when used in concert with other technologies, offers organisations an opportunity
    to rethink their internal and external processes, remove inefficiencies, improve
    transparency and provenance, and build a better organisation overall, as I will
    show you in Chapter 7. However, within large process-oriented organisations, transforming
    a centralised business to a decentralised organisation, where cryptography is
    used to create trust, where smart contracts automate decision-making, and where
    governance is embedded in the code, can be a daunting task. Especially, because
    when data becomes immutable, verifiable, and traceable it affects other important
    concepts such as privacy, security, and ownership. Therefore, my advice is to
    start working together with your industry partners to see how blockchain can become
    part of your organisation. Blockchain differs from any other emerging technology
    as it often requires organisations to collaborate with industry partners, customers,
    and even competitors. Only through decentralised collaboration with your stakeholders,
    the benefits of blockchain technology become truly visible. However, it is also
    important to understand which problems within your organisation are best suited
    for a blockchain solution and which do not. Not all problems require a decentralised
    solution, a cryptocurrency, or smart contracts. Blockchain should be a means to
    an end, not the other way around as we will see in Chapter 7. When deciding to
    require a token, understand clearly why you need a token and what sort of token.
    Finally, make sure you comply with existing and future regulations, because although
    blockchain may help you improve your business significantly, it still requires
    compliance with regulation.'
