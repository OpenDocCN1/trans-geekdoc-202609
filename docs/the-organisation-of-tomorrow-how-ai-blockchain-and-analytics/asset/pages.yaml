    # **4.4 Blockchain and privacy regulation**


    In an era where data privacy is an increasing concern, blockchain technology is
    moving towards a more transparent and more verifiable security model. Blockchain
    is a decentralised database where any data stored is read and write and not editable.
    That puts blockchain in direct opposition to the General Data Protection Regulation
    (GDPR) that went into effect on May 25, 2018. With'
