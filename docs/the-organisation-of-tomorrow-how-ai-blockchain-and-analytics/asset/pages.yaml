  md: 'With a predicted US$19 trillion of added value to the global economy thanks
    to the Internet of Things, there are ample opportunities for CSPs to boost their
    revenue with decentralised IoT services. Australian telecom organisation Telstra
    is already exploring several of these opportunities.


    # Box 4.2 Telstra leverages blockchain to address technicalities


    According to Katherine Robins, principal security expert at Telstra, Telstra intends
    to use blockchain to secure the IoT ecosystems of smart homes.340 The company
    has tested its IoT smart home system on a variety of distributed ledgers such
    as Ripple, Apache Hyperledger, and Ethereum. It resulted in exploring the viability
    of applying blockchain technology to IoT as a security enhancement solution for
    devices that were limited to storing small quantities of data.341 Initially, these
    tests were exclusive to ADSL-T Gateway routers, but they were expanded to other
    home devices, including switches and cameras.342


    As the number of IoT devices expands, so will the number of transactions. Keeping
    up with these transactions increases computational requirements, which Telstra
    sees as a serious challenge. Moreover, too much traffic can leave IoT devices
    vulnerable to other security issues, such as (Distributed Denial of Service (DDoS)
    attacks. These attacks can bring down entire enterprise servers and halt the delivery
    of service to millions of customers. Telstra plans to mitigate these issues by
    incorporating blockchain technology to store a device firmware’s cryptographic
    hashes on private blockchains and reduce the time it takes to verify transactions.342


    Telstra extends the security provided by blockchain technology and combines it
    with biometric features, such as voice and facial recognition. These are stored
    encrypted on a blockchain, making it immutable, verifiable, and traceable.342,
    343 The usage of blockchain makes IoT security significantly more efficient and
    cost effective and this additional security helps to reduce fraudulent transactions
    and mitigates unauthorised users from accessing smart devices or networks. It
    will enhance the customer experience by providing peace of mind to consumers who
    will know that their data is safe and that they have control over who has access
    to their information.


    With the advent of blockchain technology, CSPs should transition from telecom
    organisations to digital services enablers. T-Mobile seems to understand this
    new paradigm as in 2018, it started to quietly build a decentralised enterprise
    blockchain solution to tokenise a user’s authority to perform transactions.344
    Also, in 2018, Huawei, the world’s third largest handset maker, started to develop
    a blockchain-enabled mobile phone in collaboration with Sirin Labs.345 The idea
    would be to include a cold storage wallet on the phone and a system that could
    automatically convert fiat money into crypto money. In addition, Huawei is building
    a blockchain-enabled platform for insurance solutions, thereby clearly showing
    a move towards a digital services enabler.346'
