    where transparency is a precondition, it is often difficult to verify if a Fair-Trade
    product is indeed fair. This lack of transparency is increasingly a source of
    discontent for consumers, who want to know what they buy, the materials sourced,
    and if regulations were followed. However, it is also necessary for retailers
    to understand how their products move through the supply chain. Not only for non-eatable
    goods but especially also for perishable goods it is important to be certain whether,
    for example, the temperature during transportation remained within certain limits.
    As such, the provenance of products is becoming increasingly important, and that
    is exactly where blockchain could contribute. The potential of blockchain technology
    for the retail industry is enormous as it can eliminate errors that generally
    happen with global, complex supply chains. There are several ways in which blockchain
    can help.


    # Creating transparency


    Blockchain enables anyone with access to check the provenance of whatever is recorded
