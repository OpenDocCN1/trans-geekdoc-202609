    for a data organisation. For years, organisations like Google, Facebook, and Amazon
    have been building extensive profiles of you about who you are, what you have
    bought/liked/read, and your preferences. In exchange for “free” services, these
    organisations use extensive profiles to generate revenue through advertising that
    follows you across the web. In the twenty-first century, privacy has taken a new
    meaning, but that does not mean that consumers will accept this. As the initiative
    of Sir Tim Berners-Lee shows, it is about time that consumer regains the control
    over their own data and that organisations start to respect the privacy of their
    customers. This can best be achieved by adhering to several ethical guidelines.164
    Organisations should be transparent, so that consumers know what will be done
    with the data that is collected, today and in the future. They should keep their
    communication simple and understandable, so that everyone, including digital immigrants,
    understands what''s being done with the data. This means simplifying the terms
    and conditions to make sure that it does not read like the constitution. All data
    should be well secured and encrypted. Although distributed ledger technology will
    enable highly secure data, non-decentralised data remains receptive for hackers.
    Where data is collected, hackers will be active, and any organisation should assume
    that they can and will be hacked. Organisations should ensure that hackers do
    not stand a chance and if they'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'do get access to the data, the data is useless. If your organisation has not
    yet been hacked, you are simply not important enough. If data is your most important
    asset, which is the case if you are a data organisation, it should require the
    utmost attention. Therefore, quantum-resistant encryption should be applied to
    your data to protect your organisation also in the era of the quantum computer.
    Next, the organisation of tomorrow should give back control of consumer data whenever
    possible. If the consumer created the data, the consumer owns it and should control
    it. Finally, privacy should be part of the DNA, so that all employees understand
    the importance of it. The development of a quality mark, to ensure that organisations
    adhere to these guidelines, could be imaginable/desirable.


    Of course, there is also a responsibility for consumers. It will certainly help
    consumers if they are aware of how to act in a data-driven society. Customers
    should understand what data they share and not absentmindedly accept policy statements
    or terms and conditions that result in sharing personal data. They should be cautious
    with what they share, for example on social networks. Everything on social networks
    is public information and accessible. So, sharing a picture of your credit card
    on Facebook is probably not a good idea. Even in a future where consumers will
    have their own Solid POD containing all their personal data, they should still
    remain careful with how they deal with that data and with whom they will share
    it. This also includes being careful when downloading a new app on your phone.
    Many of us simply download an app and, without paying any attention or reading
    the terms and conditions, accept all requests to access personal data ranging
    from location data to contact details. Dealing with this more consciously would
    be a good starting point for consumers. Finally, consumers should not simply accept
    the new deal and demand that companies will take care of their personal data,
    either through legislation or by boycotting reckless organisations. Fortunately,
    legislation such as the GDPR helps in better protecting consumer data.


    The organisation of tomorrow will not be able to survive very long when ignoring
    these ethical guidelines. The transition costs for consumers will only decrease,
    especially if they use solutions such as the Solid POD where they can easily take
    their data to a new service. Once we have reached a decentralised society, the
    power will lie with the consumer and organisations will have to focus on simply
    developing the best product and offering the best service.


    # 7.6 Conclusion


    Data collection can help every aspect of your business from developing new products
    to improving operational efficiency. Companies that use customer intelligence
    have better marketing results. Organisations that use data collected after a customer
    buys a product can make recommendations based on usage. Internally, data collection
    can improve your supply chain or help with recruiting talent. By collecting millions
    of data points, you provide your'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'business with the information needed to drive strategic thinking and overcome
    internal roadblocks. You can collect information on everything from the amount
    of time it takes to pull and ship an order to the best delivery routes and average
    wait time for customers. This information can also be used to assess employee
    performance (of course, with the right privacy measures in place). Data leads
    to knowledge which ultimately drives decision-making.


    The key message underlying this book is that data-driven organisations that incorporate
    big data analytics, blockchain, and AI will stand the best chance to remain competitive
    in the future. When these emerging information technologies converge, a gestalt
    shift will occur; all of a sudden, we can see the world through a different, more
    technologically advanced, lens. It is like the famous rabbit–duck illusion – an
    ambiguous image in which a rabbit or a duck can be seen – once you switch from
    seeing the duck to the rabbit (or the other way around), it becomes difficult
    to see the original animal again. Achieving a similar gestalt shift in your organisation
    opens up a completely new perspective, where we see the organisation, and the
    society, as a data organisation. The convergence of technologies will offer new
    possibilities and solutions to improve our lives and create better organisations
    and societies, with data at the heart of it.457 However, such data-driven organisations
    cannot function without humans in the loop as organisations remain social entities.126,
    127 Even when organisations are following the D2 + A2 model and move towards a
    decentralised and autonomous organisation, most organisations will never transform
    into a full DAO. Consequently, there remains a human element to organisations,
    and as such, the social, the material, and the artificial should exist in coherence
    and interact with each other without negatively affecting one another. This means
    the artificial adheres to the ethics valued by the social, the material is bound
    by the norms and principles of our society and the culture within an organisation,
    and the social is not subordinate to the material and the artificial. All three
    should exist in balance with each other, and organisations that ignore the human
    side of doing business are likely to face difficulties. Therefore, to turn your
    existing organisation into a data organisation, there is a lot of work to be done.
    It means that you should datafy your processes, distribute your data via the cloud
    or using distributed ledger technologies, analyse your data using analytics to
    sense and seize opportunities, and automate your decision-making using AI and
    smart contracts. In each of these steps, you should take into account ethical
    guidelines to ensure that you respect your employees’ and customers’ privacy and
    security. When doing so, you will become a data organisation that is ready for
    the fast-changing data-driven future ahead of us.


