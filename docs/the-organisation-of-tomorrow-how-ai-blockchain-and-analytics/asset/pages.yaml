  md: '# Big data analytics to understand the context


    Organisations face a constantly changing environment and those organisations wishing
    to remain competitive in such an ambiguous and uncertain environment should focus
    on detecting, anticipating, and responding to disruptive changes.136, 137 Adopting
    to these changes is a complex process including both technological and social
    dimensions. It involves a wide variety of stakeholders on different organisational
    levels.128 Organisations are integrated and dynamic entities where strategic choices
    related to technologies, structures, and processes determine how a company can
    respond to changes in the environment. Not only changes in the environment, but
    also these strategic choices determine the behaviour of an organisation.128 Therefore,
    an organisation needs to develop the right capabilities to understand the fast-changing
    environment and remain competitive. A deep understanding of the context, which
    can be achieved using the right analytics, is required for leaders that face increasing
    uncertainty. In this chapter, we will see how the material (data and analytics)
    can influence the social (organisations, management, and employees) and how the
    social can change because of that.


    Contemporary (business) environments are inherently ambiguous and uncertain. Ambiguity
    refers to unknown situations, where organisations face unidentified risks, which
    may be interpreted differently. Uncertainty refers to a changing environment in
    which the organisation lacks information to determine the reasons for change.7
    Organisations that have access to sufficient data and analytical tools can better
    understand the causes and effects of change and can anticipate environmental risks.
    Such organisations are better capable of dealing with an ambiguous and uncertain
    environment.138, 139 Often, these environments are characterised by startups that
    are able to create better products and services using fewer resources as they
    leverage emerging (information) technologies. They often originate in low-end
    markets that are ignored by the incumbents who focus on the most profitable customers.140
    Those startups that are able to get a foothold in the lower end of the market
    and can become profitable due to the application of more advanced technology often
    disrupt the incumbents. Since these startups are more agile and can respond faster
    to the ongoing change in the environment than incumbents,'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'they stand a better chance to remain relevant and competitive.³ For example,
    companies such as Borders, Blockbuster, and Kodak are well-known examples of once-successful
    organisations that lacked the agility to respond to technological changes in their
    environment, such as online book retailing, online film distribution, and digital
    photography.³⁷ On the other hand, start-ups such as Amazon, Netflix, and Instagram
    have been able to leverage and benefit from the emerging information technologies
    that were overlooked or ignored by the incumbents.³⁹ Therefore, to avoid a “Kodak
    moment” it is crucial for organisations to not only develop the capacity to quickly
    detect and anticipate changes in the environment, but more importantly also respond
    to market disruptions and competitive threats.¹⁴¹


    Detecting technological market disruption in a complex and fast-changing environment
    is difficult.¹⁴² Often, disruptive startups go undetected until it is too late.¹⁴³
    Nicholas Taleb, the well-known scholar and essayist, labelled such disruptions
    “Black Swans” – or unknown unknowns.¹⁴⁴ Black Swans are events that deviate from
    the expected, have an extreme impact, and, although they are difficult to predict,
    they have retrospective predictability. Moreover, they are unappreciated when
    they are first discovered and, therefore, often ignored and labelled as a fad
    or irrelevant. Unintended outcomes and unexpected events not only happen from
    environmental forces, but also from the unintended consequences of deliberate
    choices made by management. Choice, chance, and environmental circumstances interact,
    resulting in both positive and negative consequences that impact the organisation
    in the most unexpected ways. These events are what is meant with Black Swans;
    outliers that are unlikely to happen but have a major, long-lasting impact if
    they do. A well-known Black Swan was the Financial Crisis in 2007 and 2008. Those
    that discovered the biggest credit bubble of all time before it was about to burst
    made a killing, while millions of others lost tremendous amounts of money. This
    story has been turned into an award-winning movie – The Big Short – and clearly
    shows the impact a Black Swan can have on consumers, organisations, and societies.


    Black Swans that surprise an organisation are the result of many (unintended)
    consequences of a long string of decisions made, based on a constantly changing
