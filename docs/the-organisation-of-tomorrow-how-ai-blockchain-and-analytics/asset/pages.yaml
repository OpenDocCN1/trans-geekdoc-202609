    # 4.6 Blockchain and reputation


    When talking about trust, it is only a small step to move to reputation. Reputation,
    after all, is vital for successful collaboration. In the past, when you required
    some work done, you would ask a local craftsman to do so. You were confident that
    you could trust the craftsman as it was a small village. Any betrayal by him or
    her would result in loss of business. On the other hand, the craftsman knew he/she
    could trust you as when you would betray the craftsman it would mean that no one
    in the village wanted to work for you again. It was a system that worked very
    well. Unfortunately, with the internet turning the world into a small global village,
    that system pretty much disappeared. As a result, it has become increasingly difficult
    to trust someone you don’t know. To understand the challenges we face with reputation,
    it is important to understand what reputation is and how it is created. Reputation
    is a certain opinion about a person, company, or device. A reputation is created
    over time, based on a set of criteria. It is a mechanism of control within societies
    and increasingly also among connected devices. It is important to know that reputation
    exists on multiple levels, ranging from an individual, organisation, communities,
    to countries and cultures. Nowadays, even connected devices are developing a reputation,
    which provides insights on their trustworthiness.


    Reputation is not only developed by your behaviour, quality of work, and if you,
    or an entity, keep a promise, but also by a concept I call shadow reputation.
    Shadow reputation refers to the reputation of those you interact with (the people,
    companies, and machines in your network). Dealing with trustworthy entities will
    increase your reputation. The other way is also the case, dealing with untrustworthy
    entities, for example criminals or hacked devices, will negatively affect your
    reputation. You can compare this to “having the wrong friends”. When you become
    too closely linked to “the wrong friends”, it will directly affect how people
    view you and as such have an impact on your reputation. This shadow reputation
    is intricately linked to who you are and how others identify you.242 This leads
    us to the concept of a self-sovereign identity; an identity that is owned and
    controlled by the person or the device that created it. Within a self-sovereign
    identity, the user not only controls his/her reputation and shadow reputation,
    but also his/her attributes. After all, an identity consists of many different
    attributes, which are constantly changing and evolving in terms of priority and
    durability. Some attributes such as birthdates, place of birth, biological parents,
    and Social Security numbers will stay with a person for his or her entire life.
    Others, such as an employee number, student number, address, or telephone number
    could change periodically. Still, other attributes could be very short-lived,
    such as a username on a forum or'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'website. Each of these attributes has different, uniquely identifiable characteristics,
    and the combination of them constitutes a person''s or device''s identity (although
    the person might perceive that differently). A self-sovereign identity can be
    defined by the 5P''s as it is personal (it is about you), portable (meaning you
    can take your identity and data from one platform to another), private (you control
    your identity and data), persistent (it does not change without your consent),
    and protected (your identity cannot be stolen). In other words, a self-sovereign
    identity is a paradigm shift from today''s identity system, and it will drastically
    change how organisations are able to deal with customer data.


    Next to a self-sovereign identity, also reputation and shadow reputation are increasingly
    becoming important due to the global village we live in. However, trusting people,
    or devices, on the internet whom you don''t know has become notoriously difficult.
    And that is a shame, as it limits the opportunity to do business and to benefit
    from this global village that we have created. Therefore, we need a new system,
    and we have already seen the first examples of such a system; ratings and reviews.
    By now, most of us are familiar with ratings, whether it is your Uber rating,
    your Airbnb rating, your eBay rating, or your Amazon rating. In the past years,
    pretty much any large internet platform has introduced ratings and reviews, and
    the system gives us at least some confidence. However, there are also plenty of
