    # 2.1 The concept of sociomateriality


    Organisations are created by “material forms and spaces through which humans act
    and interact”.84 As people interact with each other, it influences technologies.
    Consequently, technologies influence how people interact with each other. They
    are constitutively entangled.84 This means that the social (management or employees,
    i.e. the organisation) and the material (technologies such as chairs or computers)
    are entangled and inextricably related. The social shapes the materiality of technology
    and materiality is present in every phenomenon considered social.27, 84 Basically,
    this means that technology influences people and organisations. How people use
    those technologies then influences the outcome of that technology, thereby influencing
    the organisation again, and so on. So, within the entanglement, the material influences
    the social and vice versa. All organisational aspects are bound by the material.
    This becomes visible when dealing with online (social) media where technology
    both facilitates and constrains the behaviour of media users.85 For example, initially,
    influencers on Instagram used the social media network to connect with their followers
    using photos only. The number of likes they received influenced their popularity
    and their popularity likely influenced how they would use Instagram. When Instagram
    introduced the possibility of uploading videos in 2013, thereby changing the technological
    affordances of the network, influencers immediately adjusted their behaviour and
    started to produce videos specifically for Instagram. However, these videos are
    only limited to 60 seconds, thereby constraining again the behaviour of the media
    users, etc.


    The concept of sociomateriality moves the analysis from the development of technology
    to the use of the material. The technology is not sociomaterial but the practice
    in which it is embedded is.86 Social and material agencies become interlocked
    and produce technologies and organisations. Some researchers even expand this
    notion with the concept of the inseparability of the social and the material.
    They stated that matter has no properties and only exists when it actively participates
    in a network.87 Sociomateriality sees the material and the social as intrinsic
    to organising activities, which is why some argue for the entanglement of the
    social and the material when dealing with information technologies.86 With organisations
    increasingly subject to multiple, emerging, changing, and interdependent (information)
    technologies, materiality becomes integral to everyday life.84 Just as how the
    internet has become so pervasive in today''s world that often we no longer notice
    that we use it and completely rely on it in our daily lives. When that happens,
