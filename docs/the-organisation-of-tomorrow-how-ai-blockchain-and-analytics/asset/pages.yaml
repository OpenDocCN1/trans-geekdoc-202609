  md: 'ethical questions of consequences, responsibility, and accountability.¹⁰⁶ This
    requires further discussion, especially when incorporating artificial intelligent
    agents. Artificial agency becomes increasingly important now that there is a continuous
    stream of AI breakthroughs, made possible through increased “computational capabilities,
    algorithm design and communication technology”.¹²⁵ Since technological artefacts
    can now be created by artificial intelligent actors, the important characteristic
    of sociomateriality, that technological artefacts are created by social action
    which in turn shapes human action, no longer applies. Thus, no longer are “all
    information technologies created by people and the result of social processes”.⁸¹
    Therefore, we need to add an additional, artificial, agent to the concept of sociomateriality.
    One that can become entangled with the social and material in action. Within this
    extended concept of sociomateriality, time becomes important in relation to the
    artificial. AI continuously changes over time and improves based on new input
    it continuously receives, thereby changing its materiality but not its social
    usages (its objective or goal). This brings us to a new approach to sociomateriality,
    whereby not only the social and the material become entangled by means of action
    but in which it seems the artificial also becomes entangled with the social and
    the material by means of action, as shown in Figure 2.1.


    Within this tripartite, the social, the material, and the artificial seem to imbricate
    over time and through an exercise of their agency. The social, the material, and
    the artificial are independent entities, becoming entangled when they are put
    into a relationship with one another through human, material, or artificial agency.
    Separating the artificial from the material is required because it combines characteristics
    of the material and the social but is none of those.


