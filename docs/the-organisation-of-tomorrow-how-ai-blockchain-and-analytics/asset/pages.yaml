    # Timestamp


    A consensus mechanism implements a timestamp service, which ensures that every
    block that is added to a blockchain is timestamped to prove temporal relations
    between different events.241, 277 The timestamp confirms that a certain transaction
    occurred on the blockchain at a certain time. If an actor tries to cheat the system
    and offer the same transaction again, nodes will check the transaction against
    the timestamp. If the transaction is found in a previous block, the nodes in the
    network will come to a consensus that the transaction is invalid. In addition,
    the timestamp feature, in combination with the hash, enables users to prove at
    any given moment that a certain document was owned by a particular user at a certain
    moment in time and that since then the document has not been altered. It makes
    data fully traceable.


    # 4.2.3 Transactions


    Blockchain enables intermediary-free transactions as it removes the need for trusted
    centralised third parties (who generally take a commission for verifying transactions).
    Taking out the middlemen completely changes how actors can interact with each
    other and how decisions are developed, implemented, and evaluated.275 Bitcoin
    transactions may have been the first transactions recorded on a blockchain, but
    since then many other transactions have become possible. Any financial transactions
    related to any digital currency, financial contracts, or hard and soft assets
    can be recorded on a blockchain.42 In fact, any type of transaction, whether related
    to digital or physical goods, can be recorded on a blockchain. This includes land
    registrations, tracking of goods throughout a supply chain, Internet of Things
    devices exchanging transactions, identity, reputation, natural resources, as well
    as peer-to-peer exchanges such as taxi rides or home sharing.14, 132, 265, 278,
    279 The list is endless, and a complete overview can be viewed at the website
    of Ledra Capital, which is collecting the wide range of potential uses of blockchain
