- pgno: 71
  md: '# 4.2.1 Cryptographic primitives


    Cryptography is a key component of any blockchain system. Among other things,
    it consists of two important features: the digital signature and the hash algorithm.


    # Digital signatures


    Digital signatures are based on public key cryptography, also known as asymmetric
    cryptography. Asymmetric cryptography means that two keys, a public and a private
    key, are mathematically related to each other. This relationship means that any
    data encrypted by one key (public key), can only be decrypted by the other (private
    key), and vice versa. It is impossible to encrypt data with a public key and use
    another public key to decrypt that data.266 As a result, you can use a key pair
    to identify the owner of a certain digital asset. Since the public key is publically
    available, any data encrypted with a related private key can only be decrypted
    by the corresponding public key. It works like a mailbox, where everyone has a
    key to deposit a letter to that mailbox, but only one person has the right key
    to open the mailbox and take the mail out of the mailbox. Public key infrastructure
    has since been widely deployed. Almost anything online uses the PKI, from sending
    emails to visiting websites (a website is encrypted using PKI if it has an SSL
    certificate and the website shows https). It means that we can be certain that
    the data that is sent between you and the server is not interrupted. PKI is also
    used to ensure the authenticity of a certain document, which is done using the
    hash algorithm.


    # Hash algorithms


    Each block of data on a blockchain receives a hash id, as a database key, calculated
    by a Secure Hash Algorithm. The block hash is fixed. In other words, the hash
    id allocated to the block never changes. Hash algorithms are used in a variety
    of components of blockchain technology. One of them being the hash id, which is
    a unique string of 64 numbers and letters that is linked to data in each block.
    The United States’ National Security Agency (NSA) has designed a second generation
    of cryptographic hash functions called Secure Hash Algorithms 2. It includes SHA-256,
    a highly efficient secure hash algorithm that creates a unique hash id for every
    piece of data. Hash algorithms create the same hash if the data is the same.267
    Altering only one bit in the data will result in a completely new hash id. The
    hash id of a block that is added to a blockchain is the starting data for the
    next block and as such the blocks are chained together. This means that if data
    in a block is changed, it will change the hash of that block, which in turn will
    change the hash in the subsequent block, etc. To tamper with the data, the blocks
    would have to be'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'revalidated by consensus. This will not happen because the other nodes in the
    network do not have an incentive to work on “old” blocks in the chain. Besides
    that, a blockchain keeps on growing, so it requires considerable computing power
    to revalidate old blocks, which simply makes it not worthwhile.268


    A hash algorithm is also used to check whether or not a certain document has been
    altered. If the hash of a document detailing the ownership of, for example, a
    piece of art is on the blockchain, you can always check if that document has been
    altered by simply running the hash algorithm on the document. If the hash matched
    the one on the blockchain, the document has not been altered. The hash makes data
    on a blockchain immutable and verifiable that it has not been changed over time.


    # 4.2.2 The consensus mechanism


    Consensus decision-making has been used by humans for many years.269 Although
    it began as a concept applied to politics and societies, it has become an important
    part of computer science.270 Consensus algorithms ensure that connected machines
    can collaborate independently without the need to trust each other and can continue
    working even if some members of the network fail.270, 271 There are many different
    consensus algorithms that take different approaches to authenticating and validating
    values and transactions on a blockchain. Consensus mechanisms are key to any blockchain.
    Thanks to the consensus algorithm, there is no longer the need to trust the other
    party. As a result, decisions can be created, implemented, and evaluated without
    the need for a central authority.42. 134. 271 The result is intermediary-free
    transactions, whether it is human-to-human, human-to-machine, or machine-to-machine.42


    With the lack of a trusted intermediary, participants in the network have to agree
    upon the rules that govern the blockchain and how these rules must be applied,
    before a blockchain is deployed. The nodes in the network execute the agreed-upon
    algorithm, and a pre-defined majority must agree on the outcome. Consensus algorithms
    use cryptography to validate transactions (and thus decisions) and it solves the
    long-standing problem of double spending. Double spending refers to actors who
    want to cheat the system by spending the same digital token more than once. With
    fiat money, this problem is solved through the usage of a central authority (a
    bank). In a decentralised system, without a central authority, it can be solved
    by consensus. To understand the issue, a thought experiment was proposed: The
    Byzantine Generals’ Problem.272 This thought experiment is about a group of generals
    who are each commanding a different part of the Byzantine army and need to agree
    upon a plan to attack and conquer an enemy city. The generals can communicate
    only via messenger, but the problem is that at least one general is a traitor.
    The question is how many traitors can the army have and still function as one
    force? Every consensus algorithm is a Byzantine Generals’ Problem solution. The
    first algorithm that solved the Byzantines Generals’'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Problem was the PBFT algorithm.273 Since then, many PBFT algorithms have been
    developed before bitcoin was introduced. PBFT algorithms can be applied in a decentralised,
    permissioned network. A central aspect to PBFT algorithms is that a membership
    is required, which has to be approved by a centralised authority. The Proof of
    Work (PoW) algorithm solved this problem.241. 271 This consensus algorithm operates
    in a decentralised network, without a central authority. It assumes that a majority
    of the actors are “honest” actors and reduces the risk of dishonest actors.


    # Proof of Work


    The PoW algorithm solved the requirement for a centralised authority. Normally,
    the centralised authority is the one that controls the state of a network. For
    example, a bank keeps track of who owns how much money. As a society, we have
    agreed to trust banks and usually this works fine. As a reward for this, banks
    receive a fee. The technical innovation of a PoW consensus algorithm is that a
    central authority is no longer required to control the state of a network. The
    PoW algorithm is used in public or permissionless blockchains, where actors do
    not have to know or trust each other. When there is no central authority, all
    the participants in the network have to come to a consensus about the state of
    the network. However, with millions of participants this is not viable. That is
    where consensus algorithms come into play. The PoW consensus algorithm requires
    participating actors to solve a difficult computational problem. The validation
    is done using cryptography, which means that the actor has to find the solution
    of an inequality, which requires considerable computing power (and energy). When
    a solution is presented, it is immediately clear that it is correct. This can
    be compared with a crossword puzzle, which can be difficult to solve, but once
    completed you immediately know that it is done correctly. The first node that
    solves the equation can determine the state of the network. The rest of the network
    agrees to the new state. The node who solved the equation first receives acknowledgement
    for the effort. In the case of the bitcoin blockchain for example, the actor receives
    a certain amount of bitcoin (which is also required to cover the costs for the
    energy required to run the computations).


    # Proof of Stake


    Proof of Stake (PoS) is another common consensus algorithm that takes a different
    approach. Within PoS, as within PoW, validators are selected randomly. However,
    where validators within PoW have a larger chance of being selected if they have
    more computing power, within PoS the amount of money (that is, the number of tokens
    or the amount of cryptocurrency) that a member holds determines the likelihood
    of being selected.274 Once a block is produced, a transaction fee is paid to that
    validator and signers commit the'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'block to the blockchain (i.e. the state of the network). These signers can
    all be nodes in the network or a randomly selected group of nodes that do the
    signing for the complete network. To “incentivise” nodes to hold a larger stake,
    the more stake a node has in the network, the less complex the puzzles the node
    has to solve. As a result, nodes that already have a large stake can easily become
    larger. PoS still requires a consensus agreement on the current state of the network,
    but the more tokens an actor owns, the higher the stake in the success of a blockchain.
    As a result, PoS requires far fewer computer processing unit computations and
    therefore is more energy efficient.275 The assumption underlying PoS is simple:
    if an actor has a higher stake in the system, they have a higher incentive to
    ensure that the network is secure and correct. After all, the pain felt when the
    price and reputation of the crypto-currency are damaged (due to attempts to game
    the system) increases with the number of tokens an actor has. It is expected that
    the Ethereum network will implement a PoS consensus mechanism in 2019.


    # Other consensus mechanisms


    Proof of Work and Proof of Stake are not the only consensus mechanisms. In recent
    years, the number of available consensus algorithms has exploded. It seems that
    every blockchain is developing its own consensus mechanism. Here is an overview
    of what is out there:276


    +   - Delegated Proof-of-Stake: same as Proof of Stake, but the number of tokens
    you own determines who gets to vote and elect witnesses.

    +   - Leased Proof-of-Stake: users can develop their own tokens, which they can
    use to improve their security on their server farms.

    +   - Proof of Elapsed Time: similar to a Proof of Work algorithm, but the difference
    is that this algorithm focuses more on the duration of the computation.

    +   - Simplified Byzantine Fault Tolerance: there is one validator that can bundle
    multiple transactions to create a new block.

    +   - Delegated Byzantine Fault Tolerance: this consensus mechanism uses game
    theory to verify blocks among professional miners.

    +   - Directed Acyclic Graphs: they do not have a blockchain structure, but often
    require users to validate two transactions if they wish to add one transaction.
    This verification can use a simplified Proof of Work algorithm.

