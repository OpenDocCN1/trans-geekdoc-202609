    # 4.7.4 The manufacturing industry


    In manufacturing, an immutable data trail can have value in a variety of functions
    ranging from supply chain management and logistics to production. With sensors
    becoming an integrated part of every manufacturing plant, collecting, understanding,
    manipulating, and leveraging that data holds tremendous potential value for those
    on the production side of the supply chain. Every sensor on the production floor
    gathers a tremendous amount of data, which contributes to the datafication of
    the organisation of tomorrow. However, until that data is collated and interpreted,
    it is just an added expense line for data storage. Sensors have enormous potential
    for the manufacturing industry but only if there is a platform ready and able
    to absorb that information and make it usable, reliable, traceable, and verifiable.


    That is where the blockchain comes in with services like Factom Iris and Super
    Computing Systems. Factom Iris individually identifies all of the devices connected,
    so you not only know what data is created but, often more importantly, where it
    is coming from. That doesn’t mean getting an instant notification that there is
    a shutdown on the line, it means that you don’t need to worry about false identifications.
    By building device profiles, the same way that companies do for individuals, Factom
    Iris verifies the identity of devices, ensuring that the data is coming from the
    stated source. The company Super Computing Systems adds another layer of verification
    that can help with physical problems within a factory and digital verification:
    when sensors dump data, it comes with a timestamp to show exactly what happened
    when. This can be critical when tracking down roadblocks that are slowing production
    or trying to find the cause of an accident.


    A transparent supply chain offers manufacturers some significant benefits, particularly
    in an era where some producers support guaranteed uptimes and subscription-based
    services. With sensors and a decentralised data collection system, businesses
    can draw information from shipped units around the world, use predictive analytics
    to determine likely points of failure, and take proactive steps to avoid any equipment
    downtime. When you can advertise a piece of construction equipment that never
    breaks down or a manufacturing plant that hands out its own repair requests before
    the line shuts down, you have a product that can change the face of manufacturing
    forever, which is exactly what Syncron, a blockchain startup, proposes for the
    future.


    By blending technologies like IoT and blockchain, manufacturers have new opportunities
    for cost savings and controls, along with the ability to offer better service
    to customers. As this technology matures and moves out of the'
