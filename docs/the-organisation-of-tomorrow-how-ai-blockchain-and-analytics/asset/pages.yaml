  md: '# # How technology changes organisations


    To understand how technology will affect the organisation of tomorrow, we first
    have to go back in time and see how technology affected organisations in the past.
    The lessons from how organisations responded to new technologies in the past can
    help in preparing your organisation for tomorrow. The next section might be a
    bit theoretical but bear with me as it will help you gain a better understanding
    of the forces that affect your organisation.


    How technology influences organisations has been researched for decades. The earliest
    studies date back to the 1950s when the challenges and implications of manufacturing
    technology for management and decision-making were examined.63 In a well-known
    study, the relationship between organisational structure and organisational performance
    was considered. The study showed that there are specific organisational designs
    linked to specific types of technologies. In other words, the type of manufacturing
    technology in use influenced the design of the organisation, resulting in superior
    performance if they were in sync.64 For example, mass production companies such
    as car manufacturers that produce standardised products based on standard routines
    reflect mechanistic structures, while organisations that use technology to produce
    one or several products simultaneously reflected organic structures. The emphasis
    of these early studies in the 1950s and 1960s was on how technology influenced
    organisational structures and production processes, especially in relation to
    manufacturing technology.64-67 Central to this earlier research was that the social
    – management, employees, and customers – and the technological – the machines
    and equipment – were equal parts in the organisational structures and both deemed
    as important to the success of an organisation.68, 69


    In those days, technology was perceived as having a predictable impact on organisations,
    where the design of the technology determined the impact.38, 70, 71 As technology
    evolved from traditional ''offline'' technologies, such as manufacturing equipment,
    to information technologies (IT), such as computers and spreadsheets, researchers
    started to view technologies as material elements of organisations to understand
    the impact of IT on organisations.12, 38, 72, 73 This resulted in the perspective
    that human stakeholders are the focus of attention to understand how individuals
    create social worlds'
