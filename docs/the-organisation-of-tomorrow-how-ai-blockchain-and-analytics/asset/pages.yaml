    collecting the data. As a consequence, organisations need to ensure data privacy
    and security, especially when related to individuals and things, and if they want
    to share data across organisations. Distributed ledger technology is vital to
    organisations if they wish to achieve this. Data sharing requires standards to
    ensure that organisations and consumers can easily share their data across borders
    and organisations, while remaining in control, keeping data private, and being
