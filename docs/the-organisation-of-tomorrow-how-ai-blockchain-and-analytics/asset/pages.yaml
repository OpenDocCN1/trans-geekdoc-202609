    all stakeholders can be confident that the data is correct and has not been tampered
    with. This transparency makes it easier to verify if products have been produced
    in the correct way, who was involved and how a product was treated. This becomes
    especially useful when something goes wrong with a product, as it allows regulators
    to quickly determine where it went wrong.'
