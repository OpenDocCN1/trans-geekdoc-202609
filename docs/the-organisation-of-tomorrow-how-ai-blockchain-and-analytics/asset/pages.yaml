    that makes it a lot more difficult to solve. In the end, if data is not managed
    correctly and the quality is not ensured, your data can become a risky liability
    instead of a valuable asset. Any organisation that takes itself seriously should
    take the quality of data very seriously. Not only because it becomes immutable
    on a blockchain, but also because data is nowadays used to develop, test, and
    train algorithms. Low-quality training data can result in significant problems,
    as we will see in the next chapter. The right high-quality data will result in
    better and smarter algorithms that will return better insights and results. So,
    within a data-driven, information-centric organisation everyone should be aware
    of the importance of high-quality data to ensure a positive contribution of the
    data at hand, especially when blockchain gets involved.


    # 5.3 Data security


    Despite the high market value, the bitcoin blockchain has not yet been hacked.
    Although it is likely that many hackers are trying, especially with a market capitalisation
    in the hundreds of billions of US dollars. Although a variety of cryptocurrency
    exchanges have been hacked, which are centralised platforms, blockchain technology
    itself offers security on several fronts that are very useful for organisations
    dealing with big data. Security is vital as we have seen in Chapter 3, and blockchain
    can contribute positively to it. There are three main areas where blockchain can
    have a positive effect when it comes to data security: confidentiality, integrity,
    and availability.379


    # 5.3.1 Data confidentiality


    According to the National Institute of Standards and Technology (NIST), confidentiality
    refers to “preserving authorised restrictions on information access and disclosure,
    including means for protecting personal privacy and proprietary information”.380
    Confidentiality is increasingly becoming important, especially in its ability
    to stop identity theft. Identity theft is especially known to harm consumers,
    although organisations can fall victim to commercial identity theft. This entails
    using fake identities to obtain information or to bill for services or products
    that have not been delivered. It happens to all types of organisations, and as
    recently as April 2017, Facebook and Google disclosed being the victims of a US$100
    million commercial phishing scam.381'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Although many organisations apply asymmetric cryptography or public key infrastructure
    (PKI) to secure communication, PKI relies on a trusted central authority to issue
    the certificates (key pairs), an authority that can be compromised by hackers
    using, for example, a man-in-the-middle attack. Blockchain, however, can prevent
    such attacks by creating public and auditable PKI, thereby decentralising the
    issuing of certificates. The keyless signature infrastructure (KSI) developed
    by Guardtime is one such decentralised approach. KSI differs from a PKI approach,
    which is the standard cryptographic tool-shed for authentication of data using
    a digital signature, as signatures can be reliably verified without assuming continued
    secrecy of the keys.382 As Mike Gault, co-founder and CEO of Guardtime – a technology
    company with decades of experience defending networks from nation-state attacks
    – explained, “signatures generated by KSI can be used as a wrapper (or stored
    as additional metadata depending on the data model) for any size and type of data
    such that the signature is cryptographically linked to the underlying data. The
    cryptographic link allows assertions to be made at a later date regarding the
    time, integrity and provenance of the data”.383 In 2016, using KSI the company
    managed to secure all one million e-health records of Estonia.384 Danube Tech
    is another tech firm that aims to develop a decentralised PKI and restore control
    of online identities to their rightful owners. A third company is CertCoin, developed
    by MIT, which used a distributed ledger to remove the central authority for issuing
    certification.385


    A common approach to identity theft is to obtain and exploit usernames or passwords
    of consumers illegally, sometimes by hacking centralised databases. Organisations
    are required to take the necessary security measures to prevent hackings. However,
    any security measure taken by organisations will be in vain if customers still
    use traditional usernames and passwords, such as 123456 or password. In such instances,
    a decentralised (certification) system can help. As Alex Momot, founder and CEO
    of Remme – a company that aims to eliminate passwords stated, blockchain can move
    the responsibility of strong authentication from the user to the organisation.384
    The full encryption of blockchain ensures that data cannot be accessed by unauthorised
    parties while in transit through untrusted networks. In addition, inherent to
    blockchain is the immutability of data, preventing parties to illegally adjust
    data for their own benefit. Therefore, for organisations to ensure confidentiality,
    blockchain has become key. Increasingly there are a variety of solutions, such
    as those offered by Guardtime, Danube Tech, and CertCoin.


    # 5.3.2 Data integrity


    The second contribution of blockchain in terms of data security is that it ensures
    integrity, which the NIST defines as “guarding against improper information modification
    or destruction, and includes ensuring information non-repudiation and authenticity”.380
    The combination of hashing and cryptography as well as'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'the decentralised nature of blockchain means that there is no central authority
    or actor that can adjust the data on the blockchain for its own benefit. Doing
    so would be known instantly to all other stakeholders with access to the blockchain.
    With blockchain, any asset can be retrieved or moved only with the corresponding
    cryptographic key. Therefore, the key becomes an asset that its owner can monetise
    since it is backed by the underlying asset.386 Protecting the private key is critical.
    Therefore, organisations should be aware of how to deal with the cryptographic
    keys and how to expect customers to deal with them. A lost private key can prevent
    data on a blockchain from being decrypted or, if it falls into the wrong hands,
    it can make the data public for those who have access to the private key. Therefore,
    to ensure integrity, organisations would require educating consumers on how to
    deal with private keys, as many consumers are not familiar with private and public
    keys and how they work. As David Treat, managing director financial services and
    blockchain lead for Accenture said, “leaving cryptographic keys in software sitting
    on a computer is the equivalent of leaving your house keys under the welcome mat”.386
    Although blockchain ensures integrity by making data immutable, there remains
    a responsibility for organisations and consumers.


    # 5.3.3 Data availability


    The third contribution of blockchain to data security is availability, which NIST
    defines as “ensuring timely and reliable access to and use of information”.380
    Distributed ledger technology does not have a single point of failure, which would
    make a DDoS attack exponentially more difficult. For a blockchain network to be
    brought down, all nodes within the network should be attacked, which would be
    the equivalent of robbing a million vaults at the same time, if we were to rob
    a bank. With some decentralised networks incorporating millions of computers,
    this becomes highly improbable to achieve. This is why a blockchain-based PKI
    is so valuable since it does not have a single point of failure (the central authority
    that issues the certificates). Since the technology is still so new, there must
    be a note of caution despite blockchain’s potential to improve data security.
    In the (near) future, currently unknown security issues might appear that could
    have an impact on how the technology is used and applied. In addition, many startups
    are experimenting with various new blockchain technologies or cryptographic practices,
    which, if done incorrectly, could result in potential security breaches. Therefore,
    as with any digital technology, security should be a key component of any digital
    strategy to protect consumers, customers, devices, and employees.


    # 5.4 Data privacy and identity


    Increasingly, big data is invading consumers’ lives and affecting their privacy
