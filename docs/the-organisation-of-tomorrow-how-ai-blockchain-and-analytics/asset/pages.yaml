    However, with AI there is an additional problem. Even when AI is created with
    the best intentions, it can still cause harm. I am sure that it was not Microsoft’s
    intention to create a racist chatbot. What we are dealing with here is the principal-agent
    problem. This dilemma is predominantly known in political sciences or economics
    but is increasingly becoming relevant for computer sciences as well. It means
    that the principal, in this case, the developer, researcher, or manager, has different
    intentions and objectives than the agent, in this case the AI agent. Solving the
    principal-agent problem with AI is difficult because with an advanced AI the objective
    might change over time or the AI might not sufficiently consider the objectives
    of the principal (if developed incorrectly). If that happens, AI can turn rogue
    and cause significant havoc. Since it is impossible for humans to describe all
    possible outcomes of an AI, not aiming to solve the principal-agent problem can
    easily result in AI turning bad.


    Traditionally, governance is focused on ensuring different stakeholders within
    an organisation are aligned. It focuses on the relationship and interactions between
    different groups. For example, the directors of an organisation, the board of
    an organisation, and the owners of an organisation, whom all may have different
    objectives and perspectives. Corporate governance can then be used to better align
    these objectives and perspectives, which is beneficial for an organisation. This
    tends to be done by the principal exercising control (using strategic and financial
    control methods such as budgets, and KPIs), monitoring the performance of the
    agent (such as monitoring the implementation of strategy or planning the succession
    of the CEO) and supervising the agent (through coaching or mentoring) to protect
    the principal’s interests.440 These existing corporate governance mechanisms of
    controlling, monitoring, and supervising work well when both agent and principal'
