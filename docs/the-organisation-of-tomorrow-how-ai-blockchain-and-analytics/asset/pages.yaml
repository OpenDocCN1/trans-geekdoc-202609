    # 3.6 Security and privacy


    In a world that increasingly revolves around data, security is key. Unfortunately,
    too often organisations do not take security seriously. As recently as December
    2018, the global hotel chain Marriott confirmed the Starwood data hack, where
    500 million customer profiles and credit card details were stolen. A few days
    later, Quora acknowledged that 100 million user profiles were hacked. In addition,
    even big tech giants like Facebook allow firms such as Cambridge Analytica to
    siphon away 87 million user profiles. Moreover, the average Internet of Things
    device is so easy to hack that a kid can do it, even if it is meant to be a highly
    secure crypto wallet.235 In the years to come, data will only increase in importance
    and as such in value. With that will come increased attention by hackers to steal
    data or hack your products, services, or servers. More than ever, data security
    is vital if we wish to benefit from data. It is a key requirement for the organisation
    of tomorrow, because one hack can ruin your organisation (in 2011, the Dutch company
    DigiNotar, a commercial certificate authority, was declared bankrupt after it
    was hacked). Data security comes in many flavours, which, roughly speaking, can
    be divided into three different streams:


    +   - processes and organisational solutions;

    +   - technical and hardware solutions;

    +   - data and software solutions.


    Let''s briefly discuss the first, which should be obvious for all of us by now,
    and take a deep dive in the second and third stream.


    # Processes and organisational solutions


    Security processes and organisational solutions are very straightforward, or at
    least should be. By now, every organisation should enforce a hard-to-guess password,
    preventing users and employees from using passwords such as 123456 or qwertyui,
    which, unfortunately, still happens. The best way to ensure difficult and different
    passwords for different services is to use a password manager such as 1Password
    or LastPass. These services can generate and store difficult passwords (which
    go beyond the outdated “at least 8 characters and a capital letter and a number”)
    to make your life easier and more secure. Other practical solutions include educating
    staff not to use a random USB stick that they found somewhere, enforce clean desk'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'policies as well as having and enforcing a security policy within your organisation.
    Processes and organisational solutions are so straightforward that every organisation
    should adhere to them. Unfortunately, that is still not the case.


    # Technical and hardware solutions


    To improve your security, you should have not only organisational solutions but
    also secure hardware solutions as well as secure connected devices. Connected
    devices are vulnerable, as seen in the DDoS attack on October 21, 2016, which
    took down the DNS provider Dyn. Large websites such as Etsy, Twitter, PayPal,
    Verizon, Comcast, and Reddit were among the many that were virtually unusable
    during this attack. The hackers turned to unsecured IoT devices to create an extensive
    botnet, so they could push enough traffic to take down Dyn. While this was the
    largest attack caused by IoT security issues, it certainly isn’t the first. The
    IoT market needs to find a way to properly secure these devices before more high-profile
    attacks completely negate the benefits of having this connected technology in
    your organisation. Especially, because IoT devices add countless potential attack
    surfaces to an organisation, whether you have an official policy or people are
    bringing in their own technology. Each connected device that is connected to your
    network has the potential of giving attackers a direct entry point to your infrastructure.


    Hardware-based security helps to prevent hackers from accessing your servers.
    Using, for example, dongles in combination with security tokens can be a requirement
    to access a certain service or server. The dongle can include biometric technology
    to prevent anyone being able to use it, except the owner. Without the required
    dongle and having the right biometrics, it is impossible for hackers to gain access
    to secure data. Of course, this does not count if the hardware itself contains
    a backdoor or has been tampered with before being installed. This is especially
    relevant for Internet of Things devices, which are often developed using many
    different products from many different suppliers. While there are several unified
    platforms emerging that cover IoT security standards, such as MIDAS, Unify IoT,
    and Universal Internet of Things Platform, you could be dealing with dozens of
    devices whose suppliers don’t have the same protection in place. Outdated firmware
    and software could also make it easy to exploit your IoT technology and use it
    as a point of attack. The sheer variety of form factors, operating systems, feature
    sets, and vendors introduce complications that your current IT security resources
    may be unable to cover. Therefore, when you are datafying your organisation and
    introducing connected devices in your organisation or you are developing connected
    devices for you customers, a complete re-evaluation of your IT security strategy
    and the personnel’s mindset is important. You do not want that your connected
    device is “responsible” for the next DDoS attack that will bring down the internet
    again. Thus, your staff needs to understand that every'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'connected device being developed or integrated into your organisation could
    represent a vulnerability point.


    Vulnerable IoT devices can have significant consequences and do much harm to your
    organisation and your customers, which could even lead to potentially life-threatening
    situations. Consider smart devices used in manufacturing applications. If an IoT
    safety sensor gets compromised, it could result in your employees or your customers
    ending up in unsafe situations that could cause injuries or death. This is especially
    the case in the medical field, which is adopting a wide range of speciality IoT
    devices to improve patient care. If a monitoring device reports the wrong sugar
    levels on a diabetic patient, they could end up in a coma. Alternatively, even
    something as simple as a thermostat could have long-term consequences for a company
    if compromised. If the heating or cooling is run at inefficient levels, the overhead
    costs could slowly start to eat into your budget. Data centres with cooling systems
    that are being maliciously controlled could lose their ability to regulate heat
    and even lead to hardware failure. This problem is only going to get worse as
    IoT continues its rapid expansion over the next few years. Unfortunately, many
    organisations are not prepared to deal with the security issues that they bring
    to the table. However, like any other technology, the Internet of Things is not
    going to stop because of this, therefore, organisations have to act to ensure
    safe connected devices.


    # Data and software solutions


    Even if you have the best security policies that everyone adheres to and you have
    implemented all the possible hardware security solutions, it is still possible
    that your organisation will be hacked. Every organisation can be hacked, and if
    you are not hacked, you are simply not, yet, important enough. Therefore, the
    starting point of your organisation should be that hackers will obtain access
    to your data. Even if you have implemented the right organisational procedures
    and hardware preventions.


    So, what measure should you take if you know that hackers will obtain your data?
    Of course: encryption! If hackers have access to your data but cannot read your
    data because they do not have the right encryption key, the stolen data remains
    useless to the hackers. However, unfortunately, many organisations don’t have
    encryption, and if they do, they don’t have end-to-end encryption. A 2015 survey
    showed that of those organisations researched, only 44 per cent made use of extensive
    data encryption technologies.²³⁶ The main barriers for organisations not to implement
    encryption is, according to the survey, a lack of budget (37 per cent), performance
    concerns (31 per cent), and lack of knowledge (28 per cent). One per cent of the
    respondents believe that encryption is not effective in protecting their data,
    which to me points to a lack of understanding encryption in the first place. Those
    companies that do not ensure encryption leave their data vulnerable in case of
    a data breach.'
