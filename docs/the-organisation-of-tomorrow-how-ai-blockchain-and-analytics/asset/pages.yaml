    # 4.7.3 The telecom industry


    The telecom industry is known for reinventing itself. In the early days of telecom,
    fixed landlines were the key product of Telco’s, while with the advent of the
    mobile phone this moved to mobile subscriptions and the massive cash cow SMS.
    However, in recent years, for many telecom organisations the main revenue is no
    longer call but data, which required another change in their business model. With
    every organisation turning into a data organisation, there are significant opportunities
    for the telecom industry to reinvent itself once again.


    Since telephony is so pervasive, the telecom industry is huge and often complex,
    with over 2,000 mobile network operators. Many different players and billions
    of consumers and devices that interchangeably use a variety of networks. In addition,
    the Internet of Things will add tens of billions of devices to the global telecom
    networks, providing a huge opportunity for the telecom industry. All these connections
    and billions of transactions have to be managed, and blockchain technology can
