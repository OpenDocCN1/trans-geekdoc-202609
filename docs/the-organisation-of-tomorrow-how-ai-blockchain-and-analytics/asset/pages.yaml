    # 5.2 Data governance


    With a growing amount of data playing an increasingly critical role within organisations,
    data governance has also grown in importance.368, 369 Although data governance
    can be seen as a new term, similar approaches, such as (total) data quality management
    (DQM) or master data management (MDM), have been around for quite some time. Especially
    when organisations see data as an asset, monetise it through secure data sharing,
    and include it on their balance sheet, data governance is very important.370 As
    a result, how you govern the data should play a critical role in the organisation.368
    In fact, data governance has become such a necessity for organisations that they
    no longer can get away with minimal efforts.371


    Data governance is all about creating guidelines and standards to achieve high-quality
    data, and ensuring compliance with the processes developed around the usage of
    data.372 It is growing in importance because decades of using and storing data
    in disparate stores and formats have resulted in many inconsistencies. This makes
    it difficult for companies to understand their data.373 Improper master data management
    processes could result in a variety of problems that could harm your business,
    including operational problems or incorrect customer profiles. Since a blockchain
    preserves data indefinitely, MDM will only become more important. Resilience and
    irreversibility are two key attributes of blockchain; once transaction data are
    added and accepted by the nodes, they become immutable.374 However, blockchain
    does not magically transform low-quality data into high-quality data in terms
    of consistency and correctness. Garbage in still means garbage out. If bad or
    low-quality data are presented in the right way, it will be appended to the blockchain.
    If a document contains false information but is presented in the right way, it
    will still end up on a blockchain.277


    To respond to the strategic and operational challenges involved with data that
    is added to a blockchain, organisations require a data-governance framework that
    combines the business and technical perspectives related to data.372 Such a data-governance
    framework contains five important domains: data principles, data quality, metadata,
    data access, and data lifecycle.375 Data principles define how business users
    can manage and deal with the data available. Data quality refers to the accuracy,
    timeliness, credibility, and completeness of the data. Metadata is defined as
    data about data and should provide a description of the data and facilitates the
    understanding and categorising of data.373, 375 Data access determines who has
    access to what data within the organisation. Data lifecycle is about how data
    is used, stored, and'
  merge: -1
  img_proc: true
- pgno: 118
