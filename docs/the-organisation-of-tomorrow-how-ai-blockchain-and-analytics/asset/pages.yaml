    # 3.4 Sensing, seizing, and transforming


    Developing the right capabilities for your organisation is vital in today’s competitive
    world. Instead of just focusing on ordinary capabilities, organisations should
    focus on dynamic capabilities. Ordinary capabilities are like best practices that
    are common across all organisations within one or multiple industries. They started
    in one or two companies and over time, are copied by other organisations. An example
    is Toyota’s efficient production system, which over time has been implemented
    by all car manufacturers. Ordinary capabilities can be taught by taking an engineering
    or management class. They are a minimum requirement to run a business nowadays.
    However, if your organisation wants to develop sustained competitive advantage,
    then you should not only focus on ordinary capabilities, but you should pay special
    attention to develop so-called dynamic capabilities. These are the capabilities
