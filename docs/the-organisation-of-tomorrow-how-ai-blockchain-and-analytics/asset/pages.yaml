    and the artificial, while the material and the artificial influence the social.
    The material creates the artificial, while the artificial influences, creates,
    or changes the material. The focus is on how the social, material, and artificial
    agency influence each other and how they acquire form, capabilities, and attributes
    through their interpenetration and how they interact with each other. Relations
    and boundaries between the social, the material, and the artificial are enacted
    in practice and are not fixed or pre-given; that is, the context matters. Since
