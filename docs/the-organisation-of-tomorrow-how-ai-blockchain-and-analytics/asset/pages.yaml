- pgno: 91
  md: 'regulations pushing for more consumer control of personal data, can blockchain
    technology work within this new framework? Absolutely, but not as it currently
    processes data. Of course, there are many different privacy regulations across
    the globe, but the next section is based on the, at the time of writing, globally
    thriving GDPR. The GDPR is designed to allow individuals greater control over
    their personally identifiable information. Specific to the EU, new rules require
    data storage to enforce consumer rights such as:


    +   - Erasing personal data when the need for its storage expires, e.g. when you
    withdraw consent for the storage or when it is no longer legal to continue processing
    that data.

    +   - Corrections for incorrect data.

    +   - Restricted processing when data is under contention, awaiting an amendment,
    or you withdraw permission.


    Erase is the word that goes directly up against the blockchain. Under these new
    rules, all companies storing personally identifiable data must offer the required
    levels of control. They must have an EU representative on staff to handle data
    deletion and control requests. Even if the company has no physical location within
    the EU, a local representative is required. Failure to follow these rules can
    lead to stiff fines on data controllers and processors. These fines are administered
    by individual countries. The amount of the fine depends on ten criteria, including
    the nature of the infringement, actions taken to mitigate any damage, or history
    of previous infringements. Whenever a firm infringes on multiple criteria, the
    fine will be according to the gravest infringement. As such, the organisation
    of tomorrow has to think carefully how to deal with all its data.


    While privacy protection is a laudable goal, regulatory changes continue to lag
    behind the realities of technology, the same applies to GDPR. The ability to trust
    blockchain systems comes from the knowledge that the information, once entered,
    is permanent. Deletion on demand is not compatible with the blockchain as it exists
    today. On a blockchain, all transactions are clearly visible and highly transparent
    for those with access to the blockchain. Therefore, following the GDPR rules becomes
    tricky when also using blockchain technology. While GDPR was designed to be platform
    agnostic, the requirements for data deletion and data editing seem to be a direct
    contradiction of the way the technology functions. In addition, GDPR is simply
    not applicable to a decentralised system. The regulation assumes that a single
    controlling entity can delete the stored data. The whole idea of a decentralised
    ecosystem is that there is no central entity to take control. No company or single
    individual can affect the entire ledger, making it impossible to delete data on
    these types of networks. Even the individual, organisation, or thing that added
    the data to the blockchain cannot delete or edit the data. Therefore, it becomes
    difficult, if not impossible, to hold the entity that added the data to a'
