    to note that distributed ledgers are not distributed to distribute data but to
    make the system resilient. The key is making data with high integrity accessible
    to multiple stakeholders. As such, the key for using blockchain is integrity not
    distribution and, currently, the decentralised ecosystem consists of multiple
    layers. It is still under development and new startups are constantly popping
    up and disappearing:¹


    +   1 Infrastructure layer: those applications that aim to create an infrastructure
    layer on which others can develop applications. Public blockchains include Ethereum,
    EOS, and Nxt, while private blockchains include Ripple, Hyperledger, MultiChain,
    and Chain.


    +   2 Consensus mechanisms: required to ensure the state of the network and determining
    which node can validate transactions. There are numerous consensus algorithms
    available, ranging from Proof of Work, Proof of Stake and many others.


    +   3 Distributed computing: using distributed ledger technology to distribute
    your computing requirements. Basically, cloud computing but then decentralized
    computing. Examples include Golem and Sonem.


    +   4 Distributed storage: distributed data storage is especially important when
    you want to be sure that data can always be accessed, regardless of restrictions
    some countries have. Examples include Storj, IFPD, and FileCoin.


    +   5 Privacy and identity: services that are focused on developing a self-sovereign
    identity and ensuring that data of internet users is kept private and personal.
    Examples include Sovrin, uPort, Civic, and Blockstack.


    +   6 Money transactions: as discussed in Chapter 4, there are three different
