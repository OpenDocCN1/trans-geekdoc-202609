    123 The behaviour of actors changes the state of the network, which is itself
    the product of previous actions.59 As a result, a self-reinforcing feedback loop
    can result in unexpected behaviour.113 The challenge is to understand how we can
    prevent AI agents behaving in ways that do not comply with the intention of the
    developers. To prevent this from happening, researchers, developers, and organisations
    should develop control methods. These can either be technical (adding a kill-switch
    to an AI that destroys the AI once it does something unexpectedly and harmful)
    or strategic control methods (having a board of advisors or trustees recommend
    in which area research is allowed or not allowed).


    That AI will show unexpected behaviour is almost a given. Humans have flaws, and
    consequently, algorithms will have flaws. Two of the lessons we should take away
