    Despite the advances made in technology, this definition still stands firm. Information
    technology consists of three aspects: mechanical systems (hardware), human systems
    (skills and human energy), and knowledge systems (abstract meanings and concepts).
    Technology is descriptive (the type and role of technology within organisations)
    and relational (the relation between technology and structure).105 Hence, as people
    use technology, it influences their behaviour, which influences how they use the
    technology. It is often observed as an external force that drives change within
    an organisation.28, 73 As such, technology is not neutral but an integral and
