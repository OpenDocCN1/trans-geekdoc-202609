    Developing a new way of dealing with the artificial in organisation studies is
    critical as increasingly the artificial is affecting organisations in multiple,
    unexpected ways. Until now, the artificial has been viewed as part of technologies
    (such as chairs, buildings, books, pens, data computers) that affect organisations.
    However, since AI is fundamentally different from human intelligence, with artificial
    agents operating independently of humans, the artificial is deeply changing organisations.
    Hence, it requires a new approach to deal with it in organisations, and a definition
    of an artificial agent as well as artificial agency is required. In the past,
    social agency has been defined as “coordinated human intentionality formed in
    partial response to perceptions of a technology’s material agency” and material
    agency as “ways in which a technology’s materiality acts. Material agency is activated
    as humans approach technology with particular intentions and decide which elements
    of its materiality to use at a given time”.91 Neither of these definitions is
    sufficient for the artificial. As such, I define artificial agents as “artificially
    intelligent actors that have the ability to act upon their own, apart from human
    intervention”. As artificial entities, they can exercise agency through their
    performativity; that is, by doing things that are out of the control of users
    or other artificial or human agents. As such, artificial agency is “coordinated
    artificially intelligible intentionality formed in partial response to perceptions
    of human agency and material agency”. Understanding what artificial agents are
    and how they perform agency helps to incorporate emerging information technologies
    in general and artificial intelligence in particular within the organisation of
    tomorrow.


