  md: '# Epilogue


    # Towards data-driven globalisation


    The organisation of tomorrow will look fundamentally different than the organisation
    of today. It will be an organisation with data at its heart and it will use technology
    to foster stronger relationships with other organisations and individuals. Organisations
    will employ robots and connected devices that will act autonomously and automatically,
    taking into consideration the complete context of the organisation, based on immutable,
    high-quality data. Consumers will be in full control over their data and privacy,
    at least in Western countries, increase again. In order to achieve that, we need
    to develop self-sovereign identities for individuals, organisations and things
    and we need to create immutable reputations that make anonymity accountable and
    enable trustless transactions among humans and machines. Within these organisations,
    _the artificial_ will become an important stakeholder that behaves differently
    than human stakeholders. To prevent any harm done by these artificial agents,
    whether intentionally or unintentionally, we need to step up our governance practices.
    If the social, material, and artificial will be able to interact seamlessly, it
    will foster an era of abundance where globalisation is the only sensible way forward.


    For many nationalists, this message might be counterintuitive. Nationalists fear
    globalisation and pursue their country’s interests above those of everyone else.
    Consequently, we live in a world where increasingly globalisation is under threat.
    The biggest threat comes from trade wars that could significantly harm the world
    economy. The problem with trade wars is that in the interconnected world that
    we live in, they affect everyone from small businesses to large conglomerates:
    it is a war with only losers.


    Fortunately, in the past decade, globalisation has gone digital and, as such,
    within this global collaboration, technology is increasingly becoming important.
    As a result, globalisation has become more about data and less about stuff.<sup>458</sup>
    While in the twentieth century, globalisation was all about trading physical goods
    across the globe, in the twenty-first century, globalisation is all about exchanging
    data. In the interconnected digital world that we live in, borders are disappearing,
    and national legislation is increasingly difficult to maintain. In today’s world,
    even a one-person company can be a multinational. In the past years, initial coin
    offerings enabled organisations to raise funds from anywhere'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'in the world and the upcoming security token offerings will bring raising funds
    to the next (regulated) level. Of course, globalisation is still also about trading
    goods and building physical connections such as the Belt and Road initiative developed
    by China, but globalisation is increasingly more about the digital infrastructure.
    Data and emerging information technologies are the driving force behind today’s
    globalisation. These technologies enable efficient, effective, and secure collaboration
    across borders; big data analytics provide insights in the constantly changing
    context and help find the right partners anywhere in the world. Blockchain ensures
    trust and enables peer-to-peer transactions among those globally dispersed partners
    or things. And artificial intelligence automates decision-making and improves
    cross-border partnerships, resulting in algorithmic businesses collaborating effortlessly
    with each other. Key to the new digital globalisation is trust. Therefore, when
    we want to collaborate across (digital) borders, we need more than believing someone’s
    words or blue eyes. Especially when one is not certain of the other’s intentions,
    as is with the Belt and Road initiative. An immutable, verifiable and traceable
    reputation can contribute positively to creating this trust required to build
    long-lasting relationships and collaboration. This is where digital technologies
    come into play. Blockchain can have a positive contribution to the nature of trust
    and, in addition, can ensure effective and efficient collaboration through the
    use of smart contracts. Big data analytics can provide insights into the soaring
    flows of data that generate more economic value than the global goods trade to
    help organisations understand the context in which they operate. Finally, artificial
    intelligence can give smaller businesses also a chance to go global, for example
    by proactively matching small companies with big contracts all over the world.459
    Consequently, in the twenty-first century you no longer have to be a large enterprise
    to do business across borders.


    As a global society, we need to embrace global collaboration, but we need to have
    the right means to do so since unknown makes unloved. We need the right digital
    tools and to move away from protectionism and nationalism. Instead, we need to
    employ and embrace emerging information technologies to not only develop the organisation
    of tomorrow but also build immutable reputations for individuals, organisations,
    societies, and, thanks to the Internet of Things, even connected devices. In a
    world where globalisation has gone digital, the convergence of big data analytics,
    blockchain, and artificial intelligence is becoming the holy grail to ensure trustworthy,
    effective, and efficient global collaboration among individuals, companies, and
    connected devices. It will change how globalisation functions, driving economic
    growth and job creation across the world. In a world where you can trust the other
    party and collaborate effortlessly, prosperity quickly follows. Therefore, let’s
    build the data-driven organisations of tomorrow that put customers at the centre
    of the organisation, embrace technology, and change how globalisation works, expanding
    it to the far corners of our world.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Glossary


    **Algorithm** A process or set of rules to be followed in calculations or other
    problem-solving operations, especially by a computer.


    **Analytics** The discovery of patterns in data that provide insights and turn
    data into information.


    **Artificial agency** Coordinated artificially intelligent intentionality formed
    in partial response to perceptions of human agency and material agency.


    **Artificial agent** Artificially intelligent actors that have the ability to
    act upon their own, apart from human intervention.


    **Artificial Intelligence (AI)** The process of constructing an intelligent artefact.
    Using computers to amplify our human intelligence with artificial intelligence
    has the potential of helping civilisation flourish like never before – as long
    as we manage to keep the technology beneficial and prevent AI from inflicting
    any damage.


    **Big data** A term that describes the large volume of data – both structured
    and unstructured – that inundates a business on a day-to-day basis. These data
    sets are so voluminous and complex that traditional data-processing application
    software are inadequate to deal with them.


    **Bitcoin** An innovative payment network and a new kind of money. It is a type
    of cryptocurrency. It is the first decentralised digital currency, as the system
    works without a central bank or single administrator.


    **Black Swans** Events that deviate from the expected, that have an extreme impact
    and although they are difficult to predict, they have retrospective predictability.


    **Blockchain** A digital ledger in which transactions made in bitcoin or another
    cryptocurrency are recorded chronologically. The cryptography underlying blockchain
    ensures a “trustless,” system, thereby removing the need for intermediaries to
    manage risk, making data on a blockchain immutable, traceable, and verifiable.


    **Consensus mechanism** A feature in decentralised networks to determine the preferences
    of the individual users (or nodes) and to manage decision-making of the whole
    network. The key to any blockchain; with a consensus algorithm, there is no longer
    the need for a trusted third party;'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'and, as a result, decisions can be created, implemented, and evaluated, without
    the need for a central authority.


    **Cryptocurrency** A digital asset designed to work as a medium of exchange that
    uses cryptography to secure its transactions, to control the creation of additional
    units, and to verify the transfer of assets.


    **Cryptocurrency mining** A race that rewards computer nodes for being first to
    solve cryptographic puzzles on public blockchain networks. By solving the puzzle,
    the miner verifies the block and creates a hash pointer to the next block. Once
    verified, each block in the chain becomes immutable.


    **Cryptography** Protects data from theft or alteration, and can also be used
    for user authentication. Earlier cryptography was effectively synonymous with
    encryption but nowadays cryptography is mainly based on mathematical theory and
    computer science practice.


    **Datatification** Turning analogue processes and customer touchpoints into digital
    processes and digital customer touchpoints.


    **Decentralised Autonomous Organisations** An organisation that is run through
    rules encoded as computer programs called smart contracts. A DAO''s financial
    transaction record and program rules are maintained on a blockchain. It is an
    organisation without management or employees, run completely by autonomous code.


    **Decentralised networks** A computing environment in which multiple parties (or
    nodes) make their own independent decisions. In such a system, there is no single
    centralised authority that makes decisions on behalf of all the parties.


    **Descriptive analytics** Analytics that enable organisations to sense, filter,
    shape, learn, and calibrate opportunities by providing insights into what has
    happened in their internal and external environment, from one second ago to decades
    ago.


    **Digital signatures** A digital code (generated and authenticated by public key
    encryption) which is attached to an electronically transmitted document to verify
    its contents and the sender''s identity. Digital signatures are based on public
    key cryptography, also known as asymmetric cryptography.


    **Digitalisation** The conversion of information into digital format.


    **Distributed Application (DAPP)** Blockchain-enabled products and services are
    commonly referred to as Decentralised Applications, or DApps. A DApp has at least
    two distinctive features: (1) any changes to the protocol of the DApp have to
    be approved by consensus; and (2) the application has to use a cryptographic token,
    or cryptocurrency, which is generated according to a set algorithm. Bitcoin is
    probably the best known DApp.


    **Distributed Ledger Technology (DLT)** A digital system for recording the transaction
    of assets in which the transactions and their details are recorded in multiple
    places at the same time. A blockchain is a distributed ledger.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '**Distributed networks** Distributed networking is a distributed computing
    network system, said to be distributed when the computer programming and the data
    to be worked on are spread out across more than one computer. Usually, this is
    implemented over a computer network. Participants in a distributed network are
    able to verify and authenticate other users’ transactions and exchanges. For this
    reason, the community values its own worth and reputation.


    **Double spending problem** Arises when a given set of crypto tokens is spent
    in more than one transaction. By solving the double spending problem, digital
    or cryptocurrency has now become viable.


    **Dynamic capabilities** Those capabilities that enable an organisation to develop
    new products and services depending on changing market circumstances.


    **Emerging information technologies** New advanced information technologies that
    use advanced computer programs to store, retrieve, manipulate, or transmit data.


    **Hash algorithm** Each block of data on a blockchain receives a hash id, as a
    database key, calculated by a Secure Hash Algorithm. This block hash is fixed.
    In other words, the hash id allocated to the block never changes. Hash algorithms
    are used in a variety of components of blockchain technology, one of them being
    the hash id, which is a unique string of 64 numbers and letters that is linked
    to data in each block.


    **Hash function** A hash function is any function that can be used to map data
    of arbitrary size to data of fixed size. The values returned by a hash function
    are called hash values, hash codes, digests, or simply hashes.


    **Immutability** Unchanging over time; and impossible to change.


    **Initial Coin Offering (ICO)** Crowd funding by issuing crypto tokens in exchange
    for fiat money. Also known as a Token Generation Event (TGE).


    **Internet of Things** A network of physical devices that are connected through
    the internet and where sensors enable advanced data collection to generate insights.


    **Machine learning** A method of data analysis that automates analytical model
    building. It is a branch of artificial intelligence based on the idea that systems
    can learn from data, identify patterns, and make decisions with minimal human
    intervention.


    **Material agency** The capacity of non-human actors to act without human intervention.


    **Nano technology** Science, engineering, and technology conducted at the molecular
    or nanoscale (which is about 1 to 100 nanometres).


    **Nodes** Computers confirming transactions occurring on the network and maintaining
    a decentralised consensus across the system.


    **Open strategy** Allowing previously excluded internal and external stakeholders,
    such as customers, suppliers, connected devices, employees, or'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'even competitors, to join in the strategy-making process to create increased
    value for the organisation.


    **Peer-to-peer transactions** Also referred to as person-to-person transactions
    (P2P transactions or P2P payments), electronic money transfers made from one person
    to another through an app.


    **Performativity** Performativity shows how relations and boundaries between technologies
    and humans are enacted in practice and, therefore, are not fixed or pre-given.
    Something is performative when it contributes to the constitution of the reality
    it describes.


    **Practical Byzantine Fault Tolerance (PBFT)** A process that relies on the sheer
    number of nodes in order to confirm trust. Assuming that a malicious attach on
    the network will occur, the PBFT provides a level of assurance and trust that
    would not otherwise be achievable.


    **Predictive analytics** Analytics that uses machine learning and algorithms to
    find patterns and capture relationships in multiple unstructured and structured
    data sources to create foresight.


    **Prescriptive analytics** The final stage of understanding your business. It
    is about what to do (now) and why to do it, given a complex set of requirements,
    objectives and constraints.


    **Private Key Infrastructure (PKI)** A set of roles, policies, and procedures
    needed to create, manage, distribute, use, store, and revoke digital certificates
    and manage public-key encryption.


    **Proof of Stake (PoS)** A way to validate transactions and to achieve a distributed
    consensus. It is an algorithm and its purpose to incentivise nodes to confirm
    transactions. PoS uses someone’s stake in a cryptocurrency to ensure good behaviour.


    **Proof of Work (PoW)** A requirement to define an expensive computer calculation,
    also called mining, that needs to be performed in order to create a new group
    of trustless transactions (the so-called block) on a distributed ledger or blockchain.


    **Quantum computing** Incredibly powerful machines that take a new approach to
    processing information. Built on the principles of quantum mechanics, they exploit
    complex laws of nature that are always there, but usually remain hidden from view.


    **Self-sovereign identity** The concept that people and businesses can store their
    own identity data on their own devices and provide it efficiently upon request.
    The key benefits of self-sovereign identity are the user only provides the information
    that is needed by the provider and the provider only receives and stores essential
    information (and with the identity-owner’s express permission).


    **Smart contracts** Programmable applications that can be automated to initiate
    upon satisfaction of certain conditions. Those conditions can include complex
    conditional logic. The smart contract verifies that parties to a transaction can
    meet their promises and then the technology manages the'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'exchange so that each promise is satisfied simultaneously, almost certainly
    eliminating risk for all parties to the transaction.


    **Social agency** How humans define and use technology and how people apply (new)
    technologies to achieve their goals.


    **Sociomateriality** The theoretical concept that helps researchers understand
    how technologies and organisations interact.


    **Timestamp** A sequence of characters or encoded information identifying when
    a certain event occurred, usually giving date and time of day, sometimes accurate
    to a small fraction of a second.


    **Trust protocol** A mechanism whereby trust is managed by technology in a decentralised
    network. Trust is established through verification or proof of work and is supported
    by immutability of that work and the consensus of all participants.'
  merge: -1
  img_proc: true
