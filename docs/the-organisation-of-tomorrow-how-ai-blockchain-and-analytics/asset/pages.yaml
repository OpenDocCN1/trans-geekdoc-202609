- pgno: 53
  md: 'and a change in company culture. Traditionally, the power to make (strategic)
    decisions within organisations resided with those leaders who had the most experience
    and were on top of the hierarchy. Leaders have the power to make decisions because
    they have access to limited, tangible resources and knowledge not available anywhere
    else in the organisation. After all, knowledge is a form of power and knowledge
    can be gained from power.<sup>51</sup> However, through observation, new knowledge
    can be created and, thus, when data and insights from data are widely accessible
    in real time, the locus of power changes. Within organisations that face disruption
    and where data becomes more and more important, data shifts the power structure
    within the business. Moving it away from leaders with years of experience to whoever
    has access to data and who has the power to analyse that data for understandable
    insights to make (strategic) decisions and create new opportunities.<sup>35, 52,
    55</sup> When more people have access to knowledge, empowerment is a possibility.<sup>51</sup>
    Organisations that empower their employees and customers, and partner with previously
    excluded actors, whether human or machine, are less likely to be surprised by
    changes in the environment.<sup>129, 187</sup> Therefore, increasingly organisations
    should adopt an open strategy approach, which is the decentralisation of strategy
    formulation across previously excluded, internal and external actors.<sup>213</sup>
    An open strategy is possible thanks to big data analytics, and it significantly
    changes how the social interact with each other.


    Traditionally, organisations focused on ownership and control of (in)tangible
    assets to achieve competitive advantage. However, ownership of resources is no
    longer vital for success.<sup>213</sup> Data is so widespread due to the rise
    of new technologies and it can be used to fuel innovation. Embracing external
    ideas and knowledge and combining it with internal research and development will
    enable organisations to create new business models and opportunities and remain
    competitive in the digital age.<sup>214</sup> Collaborating with new actors increasingly
    gains acceptance, thanks to the plummeting costs of communication, the availability
    of digital artefacts, and the possibility to safely share proprietary data, as
    we will see in Chapter 5. <sup>213, 215</sup> This enables organisations to use
    the intelligence of the crowd to create better solutions, improve innovation,
    and make better decisions.<sup>216, 217</sup>


    It is called open strategy and has been around for over 20 years. It is an extension
    of open innovation, which focuses on discovering, exploring, and exploiting innovation
    opportunities.<sup>218–220</sup> Open strategy embraces the advantages of an open
    approach to create value instead of raising barriers.<sup>213</sup> As such, it
    goes one step further than open innovation. It allows previously excluded stakeholders,
    such as employees, customers, suppliers, connected devices, or even competitors,
    to join in the strategy-making process and create increased value for the organisation.
    Open strategy allows organisations to better understand the fast-changing environment
    by offering new, internal and external, data sources, which, when analysed correctly,
