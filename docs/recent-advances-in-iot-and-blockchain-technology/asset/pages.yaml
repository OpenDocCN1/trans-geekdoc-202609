- pgno: 31
  md: 'file. Seeding is the process of uploading files to other nodes on the network
    once your copy of the file has finished downloading. However, quitting the swarm
    after your download is complete is called leeching. If every node leeches, BitTorrent
    would not work at all [12].


    # Types of P2P Network


    # Unstructured Network


    An unstructured network does not follow any specific structure. As shown in Fig.
    (3), nodes which are depicted by circles, are connected randomly to each other.
    A new peer who wants to join the network can copy existing links of another node
    and forms its links over time. It is easy to build an unstructured peer-to-peer
    network. However, not having a definite structure is its limitation. A peer floods
    the network with queries to find desired data. At times it becomes difficult for
    peers to find out the desired data. Flooding of queries does not always give desirable
    results and hence becomes a bottleneck for network traffic.


    ![](img/acd73a27093a44d669c4d9968aa1626b_31_0.png)


    Fig. (3). Unstructured peer-2-peer network layout.


    # Structured Network


    Structured peer-to-peer network overcomes the issue of unstructured networks by
    maintaining proper structure. The most common type of P2P network implements a
    distributed Hash table (DHT) [11]. It maintains the information in the network.
    A hash function is used by this network to assign values to all the content residing
    in a peer. Thus, hash table (Key, Value) determines which Peer is responsible
    for which content. Whenever a Peer wants to search for some data it uses the Hash
    table (Global Protocol) to determine the Peers responsible for the data and then
    directs the search towards the responsible Peers. Hence, we get good network traffic
    in this scenario [13].'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As we can see in Fig. (4), hash value is assigned to the content inside every
    node (circle) in a structured peer-2-peer network and stored in the Distributed
    Hash Table (DHT), used to locate the node and its resources.


    ![](img/acd73a27093a44d669c4d9968aa1626b_32_0.png)


    Fig. (4). Structured peer-2-peer network layout.


    # Hybrid P2P Network


    The hybrid model is a combination of pure P2P network and client-server model.
    The central server in this model keeps the information of peers helping peers
    to find each other. Currently, hybrid networks are better than both pure structured
    and unstructured P2P network in terms of performance [11].


    In the client-server model, the client would request data retrieval from the server
    via the internet. If the server accepts the request, then it sends data packets
    back to the concerned client. The client does not have to share any of its resources.
    For example, a user wants to download some files from a website. The computer
    of the user is the client. The server provides it with the required resources.


    Now consider a scenario where many users want to download the same file from the
    same website. The server would have to provide each client with a copy of the
    file so the working of the server becomes costly. Since all downloading is taking
    place at the same time, the server divides its power so that each client receives
    the file slowing the downloading speed. But in a P2P network, each node is a server
    and client when a client needs a lot of data than several other nodes collectively
    provide it. Therefore, the client can download data at a faster pace. A loss of
    connection between server and client in a centralized network would cause failure.'
