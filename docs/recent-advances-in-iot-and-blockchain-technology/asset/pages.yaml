  md: '# SUMMARY


    We started this chapter with an elaborate introduction to blockchain technology
    digging into its technicalities followed by a discussion on its vast applicability
    in areas other than Healthcare. Since one of the major applications of technology
    in Healthcare is medical records collection we also spoke about the current methods
    of storing medical information and its limitations.


    In the next section, we moved on to the various areas within Healthcare where
    blockchain technology will prove useful such as health record management and Internet
    of Medical Things (IoMT), a subset of IoT. Several areas of research interest
    and huge monetary value to pharmaceutical companies are brought up in this section
    such as Blockchain in Clinical Trial Management, Health Insurance, Invoicing,
    and Supply Chain Management.


    So far we had only focused on blockchain as a positive transformative force within
    the healthcare industry which begs the question of why has it not been globally
    implemented. Therefore, in the next section, we discussed the limitations of blockchain
    namely in terms of security and scalability. In the penultimate section, we took
    a look at several successful implementations of blockchain technology within the
    healthcare industry. Here, we discussed everything from the motivation behind
    the project to its design and loopholes.


    We wanted the reader to leave this chapter with an inquisitive mind and look up
    further information which is why in the next section we discussed upcoming areas
    of research that are of interest to healthcare, standardizations to transition
    from outdated technologies to blockchain, and how different blockchain in healthcare
    will be from blockchain in traditional private enterprises. In the end, we can
    safely conclude that blockchain is a truly disruptive technology in healthcare
    that still needs wider acceptance and more research to transform the industry.


