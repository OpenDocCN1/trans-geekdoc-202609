    # Swarm


    Swarm comes in the same category being a “decentralized storage and communication
    infrastructure” similar to Filecoin and implements very similar architecture.
    It operates on the Ethereum blockchain similar to Storj forming a native base
    layer service for web3. Since, Ethereum allows decentralized applications or Dapps
    to run on their blockchain, swarm also supports Dapps by providing a local HTTP
    proxy API which can be used by these Dapps to interact with swarm. Similar to
    instances seen so far, swarm also implements content hashing, with a 32-byte hash
    using Keccak 256 SHA3 used all over Ethereum, which is made mutable through Ethereum
    name service or ENS contrary to Filecoin which implements IPNS being based on
    IPFS. However, both ENS and IPNS have the same objective, which is to provide
    domain name resolution. Swarm inherits all its protocols from Ethereum implementing
    same incentive, networking and consensus layer. Swarm is an extensible and configurable
    infrastructure allowing clients to implement their own protocols and has its storage
    servers on the Linux OS making swarm highly scalable. It also uses devp2p rlpx
    suite by Ethereum as it transport layer instead of TCP, but may transition entirely
    to Libp2p in future updates. Content discovery is done using kademlia DHT similar
    to Filecoin for peer routing and discovery. Routing layer being the Distributed
    Preimage Archive (DPA).


    Like any other p2p network, swarm also provides economic incentives for its network
    participants by the contrivance of crypto economics to define its rules and protocols
    and reward its users accordingly. Its incentive system consists of accounting
    protocol (SWAP), file management and litigation. It has its native token called
    honey, and being implemented on Ethereum is ERC20 compatible. Users are rewarded
    based on their active participation on the network also called proof-of-participation
    which forms its incentive layer (Table 1) [25].


    # BLOCKCHAIN - PRIVACY


    Data, be it our social media details or a company’s stock details, is an incredibly
