  md: 'defining characteristics that makes it stand out from others and makes it an
    interesting prospective for organizations looking to organize their database making
    them secure. Blockchain has the following defining characteristics:.


    # Decentralized


    The most defining and key characteristic which forms the foundation of blockchain
    is its decentralized nature discarding any reliance on a central server/authority
    or any external untrusted third party which is in contrast to any traditional
    storage network. This makes it transparent, fault-tolerant and corruption-free
    by distributing control, eliminating third parties and reducing breakdown probability.


    # Immutability


    Any data once stored on the network is absolute and cannot be changed in any case.
    It is almost impossible to delete transactions or even undo them once they are
    added onto the chain. Each node containing the copy also makes sure that the data
    hasn’t been tampered with making blockchain persistent and auditable.


    # Security


    As mentioned earlier, blockchains have no central authority but all the nodes
    work together to maintain authenticity of the blockchain network. Moreover, each
    block is encrypted, having its own as well as its parent’s hash value making blockchain
    tamper-proof. More about blockchain security will be discussed later in this chapter.


    # Anonymity


    All users’ identities are kept strictly confidential and hence a system of anonymity
    is maintained. However, absolute privacy is not warranted. Each user can have
    multiple identities to influence the blockchain which is also considered one of
    the drawbacks.


    # Auditability


    Each transaction is time stamped and is also linked to its users and record is
    maintained for that particular user. This ensures authenticity of the block added
    and legitimacy of the chain. Linking transactions to users also makes the transaction
    traceable and improves its chances of verification. Public blockchains do not
    have any authority governing them and hence have the highest auditability compared
