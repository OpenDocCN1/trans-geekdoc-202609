    # Technicalities


    In August 2016, MedRec began its operations in the Beth Israel Deaconess Medical
    Centre in Boston, United States. This was the first implementation of MedRec also
    known as MedRec 1.0. Currently, MedRec 2.0 is under development and differs significantly
    in the way it is developed. MedRec 1.0 usscale small private blockchain and used
    the Proof of Work (PoW) consensus mechanism which is also used in the Bitcoin
    blockchain. MedRec uses PoW innovatively to incentivize its miners in two ways.
    The first way is to reward them with Ethers, the currency of Ethereum, and the
    second way is to provide them with anonymity medical data of users. Medical data
    is required to conduct medical research hence researchers will be incentivized
    to mine. MedRec does not technically store medical data on the blockchain. Instead,
    it contains the metadata required, like authentication and location, to retrieve
    the data. It employs three types of smart contracts for this.


    +   a. Registrar Contract (RC): MedRec caters to many medical stakeholders like
    patients, doctors, lab technicians, and insurance companies. They would need to
    have individual access to the patient’s medical records. Hence, they are'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'given Ethereum address identities which are equivalent to public keys. The
    RC maps individual IDs of the stakeholders to their respective Ethereum address
    identities.


    +   b. Patient-Provider Relationship Contract (PPRC): This is an implementation
    of pairwise data stewardship. In the case of MedRec, this refers to the interaction
    when the patient queries for some data and the provider return the required data
    from its database. This interaction is regulated by a predetermined protocol.
    The queries are in the form of SQL queries which allows users to have a high level
    of filtering and efficiency.


    +   c. Summary Contract (SC): This is essentially a database that contains all
    the interactions made by a user. For a patient, this may be reference to all their
    medical providers and for providers, this may be reference to all the patients
    that they have encountered. Hence this allows the stakeholders to have a complete
    record of all of their previous and ongoing interactions. Further, this acts as
    a backup in case any of the network participants drop out of the network and rejoin
    later. SC also enables notifications for all the participants whenever a new interaction
    is made. Each participant can approve exactly who they want to share their information
    with.


    # MedRec 2.0


    To improve security and scalability, Solidity and Go Ethereum are used to develop
    MedRec 2.0, unlike Pytheherum and Serpent libraries which were used in the development
    of MedRec 1.0. Also, the second version of MedRec does not use PoW as its consensus
    algorithm. Instead, it uses Proof of Authority (PoA), which saves the excess computation
    required in mining. This mechanism uses the healthcare providers themselves to
    provide consensus. This is because the healthcare providers are already trusted
    parties, hence it is logical to have them maintain the blockchain securely and
    efficiently [14, 43].


    # Guardtime


    The government of Estonia has been a global leader in blockchain technology. It
    partnered with a startup called “Guardtime” mere three years after the publication
    of Satoshi Nakamoto’s paper on distributed ledgers. In 2011, Estonia decided to
    protect their public records using blockchain, and then again in 2016, they declared
    their intention to secure over 1 million health records using blockchain in a
    GovTech partnership with Guardtime.


    The success of this venture will be a critical factor in deciding whether blockchain
    is successful in increasing the security of health records while also making them'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'widely available to millions of medical professionals with ease. This project
    has been supported by Estonia’s Health Information System Act of 2007 and the
    Government Regulatory Act of Health Information Exchange in 2008 [15]. Standardization
    of such health records remains a key concern with the government as their national
    blockchain encrypted data will require global acceptance and more discussion on
    protocols for digitally storing medical information. Even though shifting the
    entire healthcare infrastructure to a blockchain-based infrastructure will require
    more research, discussions, and capital investment, this innovative step taken
    by the Estonian government is concrete proof that it is certainly possible.


    # New Ventures


    We are already seeing the payoff as Guardtime has also partnered with 10 pharmaceutical
    companies to work on blockchain-based contracts with actual patients [44]. This
    project also led to the development of the MyPCR platform [45], jointly launched
    by Guardtime, Instant Access Medical and Healthcare Gateway. Medication non-adherence
    is a rampant problem in the industry that affects everyone from insurance companies
    to patients. This is where MyPCR comes in, electronically monitoring all patients
    and ensuring that they follow their own specific and specialized Personal Care
    Pathway(PCP). MyPCR will be available to 30 million UK NHS patients and is estimated
    to have potential savings of 290 billion USD in the US and 800 million GBP in
    the UK. This application will provide its users instant access to their medical
    information, PCPs, and online support through Medical Interoperability Gateway
    owned by Healthcare Gateway.


    # Medicalchain


    Founded in 2016, Medicalchain was conceptualized by Dr. Abdullah Albeyatti who
    is currently the CEO of the company. The initial developments of Medicalchain
    were in terms of discharge summaries which are detailed descriptions of a patient’s
    entire interactions with their hospital. The motivation behind Medicalchain was
    that these summaries have to be written by doctors with immense attention to detail.
    This ordeal is error-prone, and Johns Hopkins estimated medical errors to be the
    third leading cause of death in the USA after heart disease and cancer [46]. Medicalchain
    eventually expanded its horizons in the healthcare sector and has become a blockchain-based
    comprehensive healthcare ecosystem with diverse applications. To cater to its
    different use cases, it is built on a dual blockchain structure. For medical records
    management, Hyperledger Fabric is used and other services use the ERC-20 token
    of the'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Ethereum blockchain for smart contracts and token application. Medicalchain
    has its token by the name of MedToken which participants can use to conduct payments
    in the system.


    # Medicalchain Solutions


    # 4.4.1.1. Secure Decentralised Records


    As previously discussed, the primary concern of any healthcare framework is the
    prevalence of mutually incompatible siloed medical records. The Hyperledger blockchain
    used by Medicalchain is a closed permission-based network. It uses symmetric key
    cryptography with 2048 bit RSA keys. It manages identity and levels of authorization.
    For example, the patient would be allowed to create, update and read their medical
    records. But medical researchers would only be allowed read access to permissioned
    records. Further, patients can grant access to their doctors to view limited or
    all of their medical records. In case of emergencies, if the patient is not in
    the capacity to operate the Medicalchain platform, there is a provision of an
    emergency bracelet worn by the patient which can be scanned after following proper
    protocol. This would unlock parts of the medical records which were pre-determined
    by the patient.


    # Telehealth


    Globally, the digitization of medical treatments is on the rise. In 2019, the
    Telehealth market was valued at USD 61.4 Billion and by 2027, it is estimated
    to rise to USD 559.52 billion [47]. But the problem of siloed data persists even
    with telehealth treatments. Due to a lack of standardization in this field, many
    telehealth frameworks have not incorporated financial systems which makes the
    process inefficient. Medicalchain has provisions for remote consultations with
    real-time sharing of medical records securely with the consent of the patient.
    Further, patients can pay using MedTokens directly. This is more efficient than
    the traditional process of setting appointments, traveling to the healthcare facilities,
    and conducting transactions.


    # Research and Insurance Claims


    Since the process is entirely patient-centric, researchers will no longer have
    to approach hospitals and clinics for relevant medical data. They can directly
    interact with the patients who, for example, can consent to reveal medical data
    for some study. This can also be anonymized and patients can choose the amount
    of'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'medical data they wish to reveal.


    Patients can also allow their insurance agencies to access their medical records
    to verify claims. There can also be an integrated insurance system that makes
    use of MedTokens for transactions [48].


    # **OmniPHR**


    As we saw earlier, interoperability is a major issue in EHR and PHR maintenance.
    These records are created and maintained by specific organizations for their exclusive
    use with restricted access. Several organizations even maintain outdated records
    indefinitely and do not update their records because of an unwillingness to share
    this data with other practitioners. One of how omniPHR divides up data for efficiency
    is a logical division of health records such as imaging data, lab results, etc.
    with security features for personal data. The fundamental unit of this logical
    division will be referred to as a “data block”.


    # **Overview**


    When we talked about EHR and PHR in previous sections, we aimed to achieve a unified
    view of all health records scattered across different organizations and “wearables”
    and to do so in a scalable and efficient manner. This is the motive behind making
    omniPHR. The data blocks in omniPHR are distributed in a network composed of nodes,
    each of which belongs to a subnetwork. Each device that connects to this network
    can either provide medical data as a “provider” or obtain a unified view of existing
    data as a “consumer”.


    # **4.5.1.1. Superpeer node**


    In a P2P network, a superpower or ultrapeer will act as a server to clients and
    as a peer to other super peers [49]. OmniPHR proposes a model where such superpower
    nodes will serve a variety of functions in routing overlay such as maintaining
    system user registers, creating and updating data blocks, maintaining audit and
    access trails, etc. Such nodes are supposed to be horizontally scalable and elastic
    to make the network much more efficient.


    # **Design**


    As you can see in the diagram, all information is collected from trusted sources
    such as EHRs, EMRs, and health wearables which are then passed through the'
