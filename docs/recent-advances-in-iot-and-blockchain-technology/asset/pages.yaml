- pgno: 33
  md: 'However, in a decentralized P2P architecture, all connections among the nodes
    must be broken to prevent complete data sharing.


    The participation of peers in the network should be encouraged. Cooperation among
    them is vital for storage performance. The selfish behavior of any node would
    hamper the performance of the entire P2P network. It might be limited resources
    like storage and bandwidth that provoke such a self-centered attitude in peers.
    Data retrieval at any time is the prime goal for a P2P storage network [14]. Since
    there is no centralized server, all data should be available to peers present
    on the network even though some peers might be inactive. Availability of data
    can be made sure by various data redundancy processes.


    Even a P2P storage system is vulnerable to various attacks. Let us look into a
    few of them and try to understand different possible defense mechanisms:.


    # Denial-of-Service (DoS) Attacks


    DoS attacks can interfere with the storage application on the network leading
    to loss of services. It may use security measures such as verifications to carry
    out its attack. The attackers flood the target node with verification requests
    preventing sincere traffic on the network. Such is the most common form of DoS
    attack on a P2P network. DoS attacks are unquestionably hard to block as the number
    of computers the attacker involves is enormous, making it burdensome to trace
    back the attacker''s origin. “Pricing” is commonly used to curb DoS attacks. It
    requires its clients to solve a complex puzzle that usually requires expensive
    computation. If the system senses to be under attack, the difficulty of the puzzle
    should be increased. It would reduce the magnitude of the attack [15]. However,
    this is only useful for smaller attacks but would fail against a massive distributed
    attack. Also, honest clients would require more computation power to solve puzzles
    that are not economically feasible and will waste a lot of power.


    # Man-in-the-Middle Attacks


    In this attack, the attacker inserts himself in a network node and does not reveal
    itself. It spies and influences the communication among these nodes. It may be
    responsible for spoofing and transmit false data in the network. It can also farm
    some private data and leave the network unsuspected. In a P2P network, it is impossible
    to identify a man-in-the-middle attack as there is no central authority for the
    network. Fortunately, this attack is useless in a P2P network. Nodes have same
    logic for authentication and data is shared to every node on the network. Ultimately
    spoofing becomes useless. However, if the authentication logic varies in the network,
    the implication of this attack would depend on the logic itself [15].'
