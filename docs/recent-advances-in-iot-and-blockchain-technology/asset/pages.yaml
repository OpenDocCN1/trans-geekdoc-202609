  md: 'user interface to the middleware and then onto the repositories as shown in
    Fig. (3) [50].


    ![](img/acd73a27093a44d669c4d9968aa1626b_100_0.png)


    Fig. (3). Architecture of OmniPHR.


    # Datablock and Service Module


    This comprises 5 submodules:.


    +   a. **Translator**: if the source data block follows a different standard than
    omniPHR, this module translates the data block into an equivalent omniPHR standard
    ensuring interoperability.

    +   b. **Distributor**: essentially in charge of fetching and replication desired
    data blocks.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - c. Nodes Manager: every node has to go through this component to be added
    to the network.

    +   - d. Validator: ensure data integrity and consistency of the nodes.

    +   - e. Message Router: packages and routes messages to and from nodes.


    # Security and Privacy Module


    This module also comprises several submodules which work in tandem to maintain
    the privacy and security of each data block. It encrypts the data block as well
    as all its references, serves, or denies access requests based on access profiles,
    and registers and maintains access profiles.


    # MediBchain


    This framework was proposed to mitigate the recent rampant cyber-attacks on sensitive
    healthcare data. In current data preservation models, data is accountable to the
    system, i.e. data first needs to be accessible to the system which will then encrypt
    and store it on the blockchain. The system here acts as a gateway through which
    we must pass to store, access, or share data. MediBchain proposes (see Fig. 4)
    storing the encrypted data directly in the system eliminating its role as a gateway,
    therefore, making the user themselves accountable for their data [51].


    ![](img/acd73a27093a44d669c4d9968aa1626b_101_0.png)


    Fig. (4). Architecture of MediBChain.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'MediBchain promises pseudonymity, data integrity, and security to its users.
    Either a data sender or a data receiver can interact with the system. Its system
    only consists of the blockchain storing data and outside channels consist following
    crucial components.:


    **Registration Unit:** used to authenticate every user and map them to a unique
    ID.


    **Private Accessible Unit:** accessible only after proper authentication, can
    request services from the main system.


    # *Protocol for Sending Data to the System*


    The flowchart of MediBchain’s protocol is shown in Fig. (5).


    ![](img/acd73a27093a44d669c4d9968aa1626b_102_0.png)


    Fig. (5). Flowchart of MediBchain’s protocol.


    **Step I.** Data Sender provides its unique identifier and is authenticated to
    enter the system.


    **Step II.** Data Sender sends encrypted data to the blockchain. Each authenticated
    user has its key which can be used to encrypt and decrypt data through an encryption
    function. In this step, the user is directly communicating with the blockchain
    and this will be managed through a smart contract.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Step III. When the data is successfully stored on the blockchain, a unique
    ID will be returned to the sender which can be used in conjunction with the user
    ID to access this information again.


    # FURTHER DISCUSSION


    Blockchain technology has come a long way since its inception in cryptocurrency
    and finance. But being disruptive, there still are concerns regarding its standardization,
    regulation, and widespread adoption in the field of healthcare. Almost every traditional
    system in healthcare and other public or private sector enterprises is entirely
    backed by a central authority. Hence, the introduction of a decentralized framework
    in these fields is often inconvenient. To ease this transition and also incorporate
    the reliability that comes with a central authority, permissioned blockchain can
    be used in these fields. This partial decentralization can be achieved by making
    use of private blockchains where an organization will run its network. In healthcare,
    a more suitable type would be consortium blockchain, where multiple organizations
    run the network. This semi-private system would allow for different medical stakeholders
    to exchange information in real-time securely [52, 53].


    In the case of public blockchains, which mostly rely on consensus algorithms,
    suitable consensus algorithms need to be developed for healthcare-specific implementations.
    This is because a blockchain based healthcare framework will have a relatively
    smaller number of participating nodes as compared to bitcoin or other cryptocurrencies.
    Hence, using Proof of Work like consensus algorithms might be too computationally
    intensive for the network. We saw that Medicalchain worked around this issue by
    incentivizing medical professionals and researchers to act as miners in the network
    and be awarded precious medical information required for research [54 - 57].


    The amalgamation of IoT with blockchain has proved to be revolutionary too. In
    terms of medical innovation, the Internet of Medical Things is thriving on the
    previously done concrete research on IoT and blockchain too [58, 59].


    With systematic research and development, blockchain has the potential to transform
    the healthcare sector by making it patient-centric and robust at the same time.
    With its current rate of involvement and acceptance in healthcare, blockchain
    is expected to find even more use cases and implementations in the coming years
    [60 - 63].'
