    The full flow of the supply chain of our proposed solution (Fig. 2) looks like
    this:


    A Pharmaceutical Company discovers a drug (all the information regarding the drug
    will be looked at, such as the ingredients of the drug and the name of the pharmaceutical
    company) and generates a universal product code. The Medicine Verification Organization
    then approves the medicine corresponding to the Universal Product Code and creates
