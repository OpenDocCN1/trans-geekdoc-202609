  md: 'partitions the blockchain network into independent shards such that duplication
    of data storage can be avoided for each participating node, therefore distributing
    the workload among the nodes such that each node is only concerned about its shard
    data. Every node thereby has only part of the data and not the entire information.
    Since, blockchain now exists in smaller segments, transactions happen in a parallel
    manner rather than linear [9]. TPS (transaction per second) thus increases. It
    also removes the need for all the nodes on the network, making it faster and reducing
    latency. Information of each shard is allowed to be shared among the shards, making
    the blockchain decentralized and accessible by all users. Hence helping with the
    issue of scalability and improving the quality of service provided by blockchain.


    In Fig. (2), the blockchain is partitioned into three shards. Each Shard maintains
    its ledger, storing the records of transactions. A Cross-shard communication protocol
    is essential for synchronous communication among shards, like in the case of validating
    a cross-shard transaction.


    ![](img/acd73a27093a44d669c4d9968aa1626b_28_0.png)


    Fig. (2). cross-shard communication.


    The POW mechanism* is the most widely used consensus mechanism. However, it is
    not used with sharding because each participating node has the information of
    one shard. Proof of stake (POS)* is the consensus algorithm for sharded blockchain.
    For each shard, a miner is chosen to execute the transaction validation [6]. The
