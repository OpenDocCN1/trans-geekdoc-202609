  img_proc: true
- pgno: 34
  md: '# Disadvantages of P2P Network


    +   - Security in P2P architecture is very minimal. Viruses, spyware, and other
    malware can easily intrude into the network. They can move from one peer to another
    during file sharing.

    +   - Data recovery is demanding in such a network. The backup of the node has
    to be on separate devices. If something unfortunate happens to the workstation,
    all the files on it are lost. There is no retrieval of these files unless a backup
    is available on some other device.

    +   - It is difficult to retrieve an unpopular file from a P2P storage network.
    Such files may have been deleted or are not shared among peers.


    # Layered Structure


    Any distributed system such as a P2P network has a layered structure with each
    layer performing different roles. The layers of any distributed system must include:.


    # Identity Layer


    Content must have a unique identifier for its recognition and distribution which
    is enabled by hashing the public key. A unique id is generated for each node on
    the network which forms its identity.


    # Data Layer


    Organizes the data in the network most commonly using Merkle DAG which stores
    and links data.


    # Data-swap Layer


    Nodes maintain communication by swapping data among each other. Promotes nodes
    to contribute by sharing instead of only receives data. IPFS uses Bitswap which
    is based on BitTorrent protocol.


    # Network Layer


    Promotes connectivity among different nodes and enables file sharing/transport,
    most commonly using Libp2p.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Routing Layer


    Sharded data is distributed and maintained using DHT. This layer helps in location
    and accessibility of each piece of data in response to queries made by communicating
    with these DHTs.


    # Consensus Layer


    Ensures legitimacy of ledger and maintains consistency by providing a layer of
    security where all nodes in the network must consent to changes made.


    # Incentive layer


    Any decentralised network needs active participation for its survival. This layer
    encourages genuine nodes to participate by providing rewards for their work and
    punishment for faults via currency system [16].


    # Libp2p


    Libp2p is a network framework that has a modular system of protocols and libraries
    allowing us to write and develop peer-to-peer network applications. P2P certainly
    has more advantages than the client-server model although there exist certain
    challenges that need to be overcome by adopting apt practices. The transport layer
    of the network is responsible for receiving and sending data from one peer to
    another. It uses more than one type of transport protocol for the execution of
    applications at varying runtime and network environments. It promises a secure
    transport channel that supports numerous methods of encryption communication.
    Libp2p uses public-key cryptography for the identification of peers giving it
    a globally unique name called peerID [17]. Retrieval of public key is possible
    from peerID enabling secure communication among peers. Since it is needed to work
    on multiple networks, there should be an appropriate addressing scheme. Multi
    address is an encoded address for multiple networks. It is known as a “future
    proof” path structure.


    # INTERPLANETARY FILE SYSTEM (IPFS)


    To put it simply, IPFS is a distributed and decentralized P2P storage network
    for storing and accessing data. IPFS enables data storage at peer computers using
    sharding instead of being present only at one single location. So, when one user
    on the network asks for that particular data, instead of requesting the server
    to deliver it, the data can be retrieved from the nearest computer on the network
    which has a copy of that data. This enables load distribution on the central server
    preventing bottlenecks and also serves the request faster. For example, if there
    are'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'multiple requests from India to a server based in California, then the standard
    procedure will be to make all these requests and generate equal number of responses
    making the whole process time-consuming and wasteful. IPFS instead shares copies
    of already received response to each of these requests which makes the process
    much faster and the server does not have to work as much. For this very purpose
    big companies maintain CDNs or content distribution networks but IPFS enables
    it for everybody removing this financial constraint. This also makes sure that
    the data is not managed and manipulated by a single organization. It also shares
    all the benefits of any decentralized network discussed so far including fault-tolerance,
    tamper-proof, accessibility, data persistence and censor-proof [5, 18].


    # IPFS Functionality


    Being a P2P network, data is accessed through the peer network depending on user
    participation. Any peer located anywhere in the world can store and relay data
    forming well-connected network. Storage and access depends on the storage procedure
    of data, data linking and data discovery for its access. All of this wrapped together
    forms the IPFS ecosystem [19].


    # Content Addressing


    Normally while accessing data, searching for it is location-based and is called
    location addressing done using URLs following the Hypertext Transfer Protocol
    or HTTP. It finds the location based on IP address. If we do not know its location,
    the data is lost. However, the IPFS network identifies data based on its content
    rather than its address which is known as content addressing. Every fragment of
    data following IPFS protocol has a CID or a content identifier which contains
    its unique cryptographic hash obtained by passing data through SHA256 hash function
    and a codec which tells us how to interpret that data helping in its encoding
    and decoding. This hash is made by converting the content itself into alphanumeric
    hash making it unique. Identification and verification of this data is done by
    comparing CIDs of the sender and the receiver using multihash. This is a type
    of multiiform, which ensures that the data is accessible even if the hashing algorithm
    is compromised by allowing multiple versions of the CID generated by different
    hash functions to coexist, thus retaining security. Here, each CID is unique for
    its hashing function. This hash also facilitates data linkage. If any user has
    multiple copies of the same data, then all the copies have the same hash, helping
    avoid redundancy and conserving huge amounts of space. This is one of the special
    properties of IPFS called de-duplication [19, 20].'
