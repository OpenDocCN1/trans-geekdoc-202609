    # Block


    Any valid block in a blockchain consists of a block header and block body. The
    block header contains the following essential components:.


    +   **Block Version:** describes the structure of any block interior as well as
    the validation rules to follow to enable appropriate reading of the block contents
    by any node on the network.


    +   **Merkle tree root hash:** a hash tree or Merkle tree has a cryptographic
    hash of the block on each of its leaf nodes. The first node’s hash is the root
    hash. Subsequent non-leaf nodes have hashes of their child nodes. It allows secure
    and efficient verification of the data in these blocks to check for unadulterated
    blocks sent from other nodes. It is also used to counter degradation and maintain
    the integrity of data. This is primitively the transaction data that is converted
    in the form of an alphanumeric fingerprint.


    +   **Previous hash:** any block contains the hash of its previous block or parent
    block forming a link.


    +   **Timestamp:** stores date and time of transaction completion which is immutable.


    +   **Nonce:** hashing is done using the block header along with an extra number
    called “number once”. It is basically an arbitrary number used for cryptographic
    purposes. It is used only in proof-of-work systems.


    +   **Target:** a value based on the difficulty of the blockchain network, which
    tells miners how difficult it is to add a block to the blockchain. Block difficulty
    is a number value that tells us the time interval between adding two successive
    blocks to the blockchain. Higher the difficulty, harder it is to find a hash that
    works and hence lower the target.


    The components of the block header have been summarized in Fig. (1). Additionally,
    the block body consists of the transactions as well as a counter, which keeps
    a track of the number of transactions that are stored under the same block. The
    number of these transactions depends on their size as well as the size of the
    block [4].'
