  img_proc: true
- pgno: 62
  md: 'For the first time ever, users were able to transact on a digital currency
    that was not controlled or managed by any central authority. The inflation as
    well as transfer was handled by the users themselves, giving birth to the idea
    of true decentralisation. The true genius in handling this extremely precarious
    act of decentralisation revolved around generating incentives to run the whole
    systems in a consistent view and without any compromises. This was achieved through
    the introduction of miners and subsequent rewards. However, the impact of this
    invention was more widespread as the underlying technology that is blockchain
    was seen as a promising functionality that could be shaped and repurposed for
    a variety of different applications involving decentralisation. The features provided
    by blockchain include true decentralisation, immutable ledger, cryptographic security
    and anonymity. Thus, the dependence and trust on central organization are not
    required and the entire ecosystem operates together to keep the system consistent
    and up to date. This ensures that compromisation of few of the entities wouldn’t
    damage the entire system and it keeps operating normally.


    The rest of this paper is arranged into several sections. The next section illustrates
    the related works; Section 3 describes the motivation behind this work. The subsequent
    section presents an overview of Identity management for the healthcare system.
    Section 5 details the proposed solution ‘Oneld’ to address the problem statement
    using blockchain. Section 6 discusses the merits of the proposed solution. The
    paper is concluded in section 7 and outlines the future work.


    # BACKGROUND AND RELATED WORK


    Efficient management of patient record is important for providing effective treatment
    and care, studying diseases, and inventing drugs and vaccines. However, IoT-based
    applications face several security challenges [9 - 12]. Most healthcare applications
    follow client-server architecture where the server has ownership of the records
    and has access to them [13, 14]. This kind of architecture causes hindrance in
    providing proper research and subsequent treatment of diseases. To overcome this,
    several researchers have been working on cloud-based healthcare systems [15].
    However, the security of patient records is a challenge in cloud-based architectures.
    In this context, researchers are working on blockchain technology to overcome
    the potential problems of traditional blockchain systems. The blockchain enables
    the creation and simultaneous sharing of records among the other contributors
    of the blockchain. Several researchers have been working on blockchain enabled
    healthcare systems for better management of EHR (electronic healthcare record).
    Xia et al. [16] presented a cloud-based health care system coupled with blockchain
    technology. Few researchers-built healthcare systems did not allow the transfer
    of patient'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'medical records to the blockchain [17, 18]. In contrast, Yue et al. [19] presented
    a medical system that allowed medical care providers to access patient records
    to improve treatment facility. A distributed approach has been proposed [20] for
    improved and secured transfer of patient data among multiple organizations. A
    blockchain enabled medical system with improved performance is proposed by Gorenflo
    et al. [21]. Ethereum blockchain is being used [22, 23] for sharing medical records
    of patients. A secured pervasive social network-based healthcare system using
    authentication is proposed by Zhang et al. [24]. An on-chain and off-chain security
    method enabled blockchain technology is used for the exchange of patient records
    in [25]. Bio-sensors are being used to reduce patient record access time in the
    healthcare architecture proposed by Dey et al. [26]. Thakkar et al. [27] deploy
    belligerent caching and configuration authorization techniques to estimate the
    performance of the blockchain network. A secured patient data transfer mechanism
    using blockchain for better integrity and privacy is presented in a study [28].
    A mobile-based application was developed by Ichikawa et al. [29] to transfer insomnia
    patient information to private networks in a secured tamper-proof manner using
    blockchain.


    # MOTIVATION


    Despite recent advances in the digitisation of health services, a purely digital
    identity management system still remains an abstract concept. Given the lack of
    consensus among various stakeholders, the development of identity systems has
    been fractured and uneven. In the present day, a user is a bearer to multiple
    sets of identity documents spanning both digital and physical versions, requiring
    contact with multiple service providers to establish their identity. The problem
    is even more pervasive online wherein a user is supposed to remember a plethora
    of usernames and passwords. Moreover, such a diverse spread also vastly increases
    the risk to privacy and security as has been witnessed in past cases of breaches.
    Multiple people have tried at devising a solution but to no avail. One of the
    reasons why a successful deployment in this field is all the more difficult is
    the amount of coordination required between the process of designing and bootstrapping
    to make a system successful, which is nearly impossible to achieve. To this end,
    we devised a system split into two. The proposed solution intends to plug these
    gaps in implementation by considering real life scenarios.


    # IDENTITY MANAGEMENT: HEALTHCARE SYSTEM


    In order to understand how Identity Management Systems work, we need to gain an
    understanding of what exactly is Identity. Identity is a term that encompasses
    a wide variety of definitions [30] and can never be limited to a defined set given
    its changing definition with its varied perception. However, more important than'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'defining identity is defining the purpose that the identity carries. Any form
    of interaction and subsequent exchange of information between a given set of parties
    is based upon trust. Trust in the fact that a person or an entity is in reality
    who they claim to be. This establishment of the trust is built on what we call
    as an identity. Identity is that set of basic attributes that provides an individual,
    entity or asset a legal representation. Identification is the prerequisite that
    entails access to any kind of service. A lack of identity can result in denial
    of access to basic services such as education, financial services, healthcare,
    social welfare benefits, economic development, and the right to vote. The burden
    of providing primary forms of identification rests on the shoulders of the government
    of the country to which the citizen belongs. The advancements made in the technology
    sector have brought a drastic change in how we create and process identity. The
    introduction of the EHR and subsequently increased digitization poses several
    threats related to unwanted disclosure of patients records. Another significant
    change is the introduction of a person’s or organization’s online identity. The
    widespread use of the internet has led to the creation of multiple silos of user
    information owned and controlled by third parties. At the most basic level of
    understanding, identity is a sum of attributes belonging to the entity like ppatient-doctor
    hospital, insurance companies, and medical research institutes (funded by government/pharmaceuticals).
    We refer to a Third Party as being a separate entity, which can either be a single
    individual or a legal entity, for example, a government, organization or an institute.
    There are three categories attributes of Identity namely ‘inherent’ (consist of
    any set of information that is drawn directly from the entity in question), ‘assigned’
    (defined by third parties and are created with a specific purpose), and ‘accumulated’
    which are a function of time and hence change or modify with the progression of
    time. A digital identity can be expressed as a sum of its attributes that does
    not hold any value. The value of an Identity is a direct function of the perceived
    trust that the accepting entity has upon the issuer of an Identity.”


    The massive scale of digitization has allowed a majority of legacy identity systems
    to transition away from the physical methods of authentication toward digital
    ones. Instead of registering target populations manually and storing identity
    information in paper registers, electronic capture and storage of data provides
    a number of benefits, such as:


    +   i. *Unique Identifiers:* Digital Identity Systems provide significantly superior
    accuracy in capturing data. This allows for better deduplication procedures, hence
    ensuring the removal of ghost enrolments and thus bringing down the associated
    losses due to waste and fraud.


    +   ii. *Increased Scalability:* Digital Identity Systems are easier to expand
    and'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'accommodate to changing requirements. Moreover, they are much easier to integrate
    with other services and facilitate fast data processing and collection.


    +   iii. **Better Monitoring and Reporting:** The data records generated by such
    systems provide better accountability and monitoring of the services being dispatched
    by creating auditable transaction records. This prevents fraud and helps in aid
    development planning.


    In the next section, we propose a solution that revolves around the synchronous
    functioning of two independent systems. One of the systems is centralized and
    is intended for well-known identities. It is supposed to act as a central repository
    of identities and respective claims issued by well-known identities like hospitals,
    insurance, and pharmaceutical companies. The other system is decentralized and
    supposed to be primarily used by individuals like patients and medical practitioners.
    The reasoning behind this hybrid approach and how these two systems are supposed
    to work will be explained in the following section.


    # PROPOSED SOLUTION


    The ultimate goal of this work is to provide Self Sovereign Identity for every
    user in a IoT-based healthcare system. In constructing a system that truly achieves
    the objective, considerable issues are raised. In order for the system to be practical
    while staying true to its principle required distribution of services between
    a centralized and a decentralized system. As explained in the previous section,
    SkyNet is supposed to act as a trusted repository of identities for well-known
    entities. The real challenge exists for the individual patients or doctors to
    participate and make use of these features. Unless the users are provided with
    the ability to onboard the network, SkyNet would not be able to gain much functionality.
    The factors to be kept in mind for such a hybrid network include:


    +   1. The use of centralized service is suited for well-known entities, however,
    for individual users, it can present complications that come attached to any other
    centralized service. There will have to be a lot of trust riding on the service
    and the question of manipulation and self-sovereignty will be out of the equation.


    +   2. This central service can be forced by governments for surveillance or be
    susceptible to offers by interested third parties to reveal information about
    the patients. The trust of storing invaluable data in the hands of a single entity
    that transcends the boundaries of countries can be hard to achieve.


    +   3. The service needs to be free of cost, at least for some given basic set
    of functionalities. Identity is universal, it is the same for every rich or poor
    person. Placing a barrier to participation can severely hamper the adoption of
    the network.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'In order to fulfil these requirements, we propose a decentralized network,
    OneId. The ideology of OneId is to allow any user to join the network and be able
    to create and store their identity-related in a trusted, secure and privacy-preserving
    manner. This is achieved through the use of a permissioned ledger.


    The basic principles of OneId can be summarised as follows:


    +   i. Allow any entity (patient) to create and manage their identities in a decentralized
    manner.

    +   ii. Ensure the network is not subject to any form of censorship or centralization.

    +   iii. Stay true to the principles of Self-Sovereign Identity.

    +   iv. Allow any user to create and share records with any other user.

    +   v. Ensure security and privacy of the maximum order.


    The OneId system is supposed to be a permissioned ledger in order to ensure that
    it scales accordingly as the number of users and the subsequent number of requests
    on the network increase.


    In order for nodes to voluntarily participate in the permissioned ledger for others
    to use, the nodes will be rewarded with native currency. The mechanics of how
    the currency is generated, regulated, and distributed is yet to be dictated. However,
    there are various. A proposed method is to place a limit on the number of kids,
    claims, and overall storage for wallets a user will be exempted on the network.
    The storage services can charge users for any further added functionality or usage.
    The earnings from the storage services will have to be made through the native
    currency, and a cut will be taken from the earnings to fund the nodes running
    the permissioned ledger. The incentive mechanisms can work well here as the storage
    services cannot simply balloon their profits if the permissioned nodes are not
    paid their dues threatening the functioning of the network. In fact, it is highly
    likely that most storage services might operate a few nodes in the ledger. The
    overall benefits of using a Self Sovereign Identity system have already been covered
    in previous sections, which are expected to be received from the application of
    OneId.


    # Architecture


    The OneId ecosystem is represented in Fig. (3). Every user registered on the OneId
    network shall make use of the Storage Services to store their health records and
    be able to manage them remotely from any device. This is not a necessary requirement
    and users will be given the option to operate medical records on their own. Most
    of the claims to access medical records will be issued through SkyNet given the
    presence of well-known identities in its trusted network. Users of OneId'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'will be able to transact these access as both SkyNet and OneId are constructed
    to be highly interoperable. Ensuring standardization will be important for the
    success of both networks. The Identity Ecosystem of OneId will be making use of
    multiple independent blockchains to run the self-sovereign identity system. The
    reason for keeping separate blockchains is to ensure scalability and a clear demarcation
    between rules. The following section will explain how Identities in OneId will
    function and how their information will be stored.


    ![](img/acd73a27093a44d669c4d9968aa1626b_67_0.png)


    Fig. (3). SkyNet, OneId and Storage Services.


    # Creation of Records


    The record is the core functionality of OneId. All the health data belonging to
    a patient will be stored in the record. The Record Chain is shown in Fig. (4).
    The functioning of the record has been divided into two types which are described
    below:


    ![](img/acd73a27093a44d669c4d9968aa1626b_67_1.png)


    Fig. (4). Overview of the Record Chain.'
