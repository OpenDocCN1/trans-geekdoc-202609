    # CONCLUSION


    In this study, we explored the problem of medication tracking within supply chain
    networks, emphasizing its importance in combating fraudulent medicines. We created
    a blockchain-based system for tracking and tracing medicines in a decentralized
    manner for the pharma industry. The client cannot purchase excess medication since
    the supplier includes a maximum limit per patient. The medicine supply chain is
    adequately tracked thanks to smart contracts in blockchain. The suggested system
    is a proof-of-concept tool that enables blockchain technology to maintain track
    of individual medication data in a decentralized manner. Through continuous records,
