    # Sybil Attack


    A Sybil Attack is when a node uses multiple nodes to take control over the entire
    network; generally the number of nodes is greater than 51% of the total nodes
    in the network. Once the hacker has control over the network, they can compromise
    the data stored in the network by adding fraudulent blocks to the ledger, and
    gain access to all the private data in the network. Over time, the hacker can
    also vote out the honest nodes by creating enough fake nodes [26].


    # 51% Attack


    Similar to Sybil Attack, the hacker gains complete access to the blockchain by
    controlling more than 51% of the nodes in a network. In case of Bitcoin, they
    can reverse the previously completed transactions which can lead to ‘double spending’.
    To prevent these kinds of attack on the network, blockchain implements multiple
    techniques to its framework that leads to better security and privacy [27, 28].


    Data privacy refers to how a piece of information is handled to protect it from
    unauthorized access. In the past, this was achieved by storing the data in large
    filing cabinets and safety deposit boxes in banks. Businesses paid a very large
    amount every year to protect their sensitive data. Nowadays, the data is stored
    and monitored by large companies in centralized locations. This causes many problems:.


    +   1. There should be a regular upgrade to the framework and privacy policies
    due to the rapidly growing cyber security risks.


    +   2. The data is stored in a centralized location, which creates a single point
    where a small fault can lead to millions of lost or compromised data.'
