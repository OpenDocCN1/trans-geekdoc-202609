    # Method


    In our paper, we have developed a model using Convolution Neural Network and U-Net
    and it has been implemented in Tensor-Flow.


    CNN (Convolution Neural Network) automatically extracts useful features from an
    image by performing several pooling and convolution operations on the image, which
    is fed to the model as input. U-NET is a special case for CNN in which convolution
    and deconvolution are used simultaneously. It is a very powerful and precise model
    for image segmentation tasks and works on even a limited number of inputs [10
    - 12].


    TensorFlow is open-source software as it interacts with GPU to maintain data flow
    and differential programming for a range of tasks. Keras is also an open-source
    software that is written in python. It works over TensorFlow. It comes in handy
