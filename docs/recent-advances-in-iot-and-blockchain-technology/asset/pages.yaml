    # Centralized Database System


    A centralized database is a type of database where storage, management, and manipulation
    of data are done at a single central location. This center may be a server or
    even a mainframe computer, depending on the requirements of the network. All the
    data from each computer is stored at this single location which often runs around
    the clock and must be properly maintained. For example, a company implements a
    centralized database system, then all data processed or produced from its various
    branches and from each workstation is stored at this sole location.


    In a centralized system, users rely on a central authority that can alter or change
    the system by altering the database. These do not distribute authority and the
    legitimacy of the system depends solely on the accountability of this central
    authority.


    # Advantages


    +   • Data is easily portable and accessible since it is kept in a single location.

    +   • Maximum data integrity as data can be easily coordinated consistently and
    accurately.

    +   • Storing data in a single location reduces data redundancy and saves space.

    +   • Cost effective, suitable for small organizations and businesses.

    +   • Effortless debugging, simulation, and deployment for application development.


    # Disadvantages


    +   • Major disadvantage is the breakdown of the central location, which affects
    all the associated workstations.'
