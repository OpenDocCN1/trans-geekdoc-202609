  md: 'participating nodes must be attained before adjustments can be implemented.
    This guarantees that all blockchain ledger replicas are synchronized across the
    network. Users can always get the most up-to-date or, in other words, the most
    recent copy of a transaction when a transaction occurs, thanks to the blockchain’s
    build architecture (Fig. 1). Whenever a transaction occurs in the chain, the entire
    network is updated. This is possible as all other network participants are provided
    with a copy of the transaction. Blockchain has been used in several applications
    [2 - 4].


    ![](img/acd73a27093a44d669c4d9968aa1626b_162_0.png)


    Fig. (1). Blockchain Architecture.


    Public, private, and consortium are the three types of Blockchain. Each participant
    on the public blockchain can see and authenticate any transaction occurring on
    the network, as well as partake in the consensus mechanism. In the consortium
    blockchain, there must be an administrative node, which is initially chosen by
    network members based on the effective ways to accomplish their business objectives,
    such as in the case of a company. Except for one difference, a private blockchain
    is similar to the previous type where the public has no access to any of the data
    in such a distributed registry.


