    # LIMITATIONS & FUTURE WORK


    Very large computational power is required for training the model since the images
    captured are not of high resolution. Also, image segmentation depends on'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'the type of images sent as input. The accuracy of prediction using the model
    is directly proportional to the resolution of the image. This implies resolution
    can be further increased.


    Secondly, we can focus on detecting roads step by step, as some roads are wide
    and some roads are narrow. This classification has the potential to turn image
    segmentation for road detection upside-down as in the case of the wide road we
    will have freedom or flexibility to detect its boundary first, and detecting boundary
    is a fairly easy task as compared to the whole road.


    # CONCLUSION


    In this paper, we trained our model after masking images we received from the
    dataset. Dataset consists of 2-d images captured through satellite imaging and
    we developed our model using CNN architecture in association with U-NET. In addition,
    Keras libraries help to approach the problem of semantic segmentation of images
    or motion for that matter with efficiency. Keras working on top of TensorFlow
    created a robust environment, maybe not a new-fangled model but with reasonable
    accuracy.


    The lapses in scalability and accuracy still exist but they open new doors to
    future development in resolving the problem by greater understanding.


