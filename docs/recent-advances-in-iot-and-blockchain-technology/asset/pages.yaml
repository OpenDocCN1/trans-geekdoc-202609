- pgno: 160
  md: '# # Identification of Counterfeit Drugs Using Decentralized Supply Chain


    Koyel Datta Gupta^{1,*}, Aditya Gupta^1, Tanmay Sharma^1 and Aayush Bhatnagar^1


    ^1 Department of Computer Science & Engineering, Maharaja Surajmal Institute of
    Technology, New Delhi 110058, India


    **Abstract:** This research attempts to overcome the problems faced by the medical
    healthcare system by using the advancing technology of blockchains. Pharma companies
    that manufacture and sell medicines face difficulties in tracking drugs, which
    in turn allows the counterfeiters to exploit the system. The decentralized abilities
    of blockchain technology enable us to counter the problems in existing centralized
    systems. The blockchain helps us to make sure that the quality is maintained throughout
    the decentralized supply chain. The use of blockchains in the medicine supply
    chain solution entails tracking the validity of the medicine from the producer
    to the distributor to the pharmacy. It assures that the pharmacist receives the
    original medication and does not reach the grey market. In this paper, the decentralized
    application which we created works using Ethereum and is based on blockchain technology.
    The medicine discovered by a pharmaceutical company is to be validated by an officer
    in a decentralized manner using smart contracts over Ethereum transactions. The
    validated drugs can then be produced and sold on the platform, where the entire
    data and the stages of the drug/medicine are tracked and stored. Research and
    development of such a system are necessary to facilitate the proper supply and
    tracking of medicines and to avoid counterfeiting.


    **Keywords:** Blockchain, Ethereum, Amart contracts, Decentralized application
    (DApp).


    # ## INTRODUCTION


    According to recent findings, drug counterfeiting is one of the significant problems
    in second and third-world countries. Individuals and the general public are in
    danger due to the effects of this occurrence. They are especially common in countries
    where surveillance and regulation ought to be enhanced or are inadequate, as well
    as in nations where drugs are in great demand but remain'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'mostly expensive. They are also prevalent during disease outbreaks and epidemics
    when vital pharmaceuticals are in limited supply and counterfeiting is widespread.
    Unauthorized pharmaceutical companies employ their cunning minds and expertise
