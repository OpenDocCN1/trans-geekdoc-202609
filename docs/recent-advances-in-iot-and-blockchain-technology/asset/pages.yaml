  md: '![](img/acd73a27093a44d669c4d9968aa1626b_191_0.png)


    # Koyel Datta Gupta


    Dr. Koyel Datta Gupta is a professional with an experience of 17+ years in academics.
    She completed her B. Tech in Computer Science and Engineering from the University
    of Kalyani, West Bengal in 2003 and is a gold medalist in M.Tech (Computer Technology)
    from Jadavpur University, Kolkata (2007). She received her doctorate in 2015 from
    Jamia Milia Islamia, New Delhi. Her areas of research include network security,
    digital signal processing, pattern recognition and machine learning. Dr. Koyel
    Datta Gupta is currently working as an associate professor at the Maharaja Surajmal
    Institute of Technology (MSIT) (under the IP University), New Delhi. She is currently
    the head of the department of the Department of Computer Science and Engineering.
    She has held various other positions in MSIT for the past 12+ years. She has published
    more than 25 research papers in reputed journals and conference proceedings and
    has also authored books.


    ![](img/acd73a27093a44d669c4d9968aa1626b_191_1.png)


    # Rinky Dwivedi


    Dr. Rinky Dwivedi completed her B.Tech in Computer Science and Engineering from
    Guru Gobind Singh Indraprastha University, Delhi in 2004 and M.E. in Computer
    Technology and Application from Delhi College of Engineering, Delhi in 2008. She
    has received her doctorate in 2016 from the Delhi Technological University, New
    Delhi. Dr. Rinky has over 17 years of experience in Academics, currently working
    as an associate professor at the Maharaja Surajmal Institute of Technology, Delhi.
    She has published more than 20 research papers in reputed journals and conference
    proceedings and has also authored books.


    ![](img/acd73a27093a44d669c4d9968aa1626b_191_2.png)


    # Deepak Kumar Sharma


    Deepak Kumar Sharma is working as an associate professor at the Department of
    Information Technology, Indira Gandhi Delhi Technical University for Women (IGDTUW),
    Kashmere Gate, Delhi, India. Earlier, he worked as an assistant professor at the
    Netaji Subhas University of Technology (Formerly N.S.I.T.), Dwarka, Delhi. He
    obtained his Ph.D. in Computer Engineering from the University of Delhi, India
    in 2016. His research interests include opportunistic networks, wireless ad hoc
    and sensor networks, software defined networks and IoT networks. He has over 17
    years of experience in academics. He has published various research papers in
    reputed international journals like ETT Wiley, IEEE Systems Journal, IEEE IoT
    Journal, Computer Communication Elsevier, IJCS Wiley, etc. and conferences of
    repute like IEEE AINA, GLOBECOM, etc. He has also authored various book chapters
    in edited books of IET, Wiley, Springer, Elsevier, etc. He has served as session
    chair in many conferences and is also a reviewer of various reputed journals like
    ETT Wiley, AIHC Springer, IJCS Wiley, etc.


    ![](img/acd73a27093a44d669c4d9968aa1626b_191_3.png)


    # Fadi Al-Turjman


    Prof. Dr. Fadi Al-Turjman received his Ph.D. in computer science from Queen’s
    University, Canada, in 2011. He is the associate dean for research and the founding
    director of the International Research Center for AI and IoT at Near East University,
    Nicosia. Prof. Al-Turjman is the head of the Department of Artificial Intelligence
    Engineering and a leading authority in the areas of smart/intelligent IoT systems,
    wireless, and mobile networks’ architectures, protocols, deployments, and performance
    evaluation in Artificial Intelligence of Things (AIoT). His publication history
    spans over 400 SCI/E publications, in addition to numerous keynotes and plenary
    talks at flagship venues. He has authored and edited more than 40 books about
    cognition, security, and wireless sensor networks’ deployments in smart IoT environments,
    which have been published by well-reputed publishers such as Taylor and Francis,
    Elsevier, IET, and Springer.'
