- pgno: 128
  md: '# INTRODUCTION


    Anyone who has purchased or sold a car, or who has worked in the automobile manufacturing
    or distribution industry at any point, is familiar with the complication that
    is the Vehicle Registration process. Given the fact that all vehicles in the market
    have been sold and resold as they passed through multiple hands, it becomes a
    cumbersome task to maintain a legitimate record of the history of each vehicle
    and make it available when needed.


    But before one goes on to talk about the problems of the process of Vehicle Registration,
    one first needs to understand why Vehicle Registration is such an important aspect
    of automobile dealing. Car ownership changes as many times as you can imagine.


    Whether you look at it in terms of dealing in spare parts or in assembled vehicles,
    dealings by the middlemen or by the retailer who makes the final sale to a consumer,
    or in terms of the resale of a second-hand vehicle, some stakeholders are interested
    in learning everything there is to know about the car they are purchasing. Not
    to mention the insurance agencies, the police, and other authorities, and the
    government too needs to keep tabs on the automobiles for various reasons.


    The fact of the matter is that all these stakeholders need information about the
    vehicles, starting from its manufacturing story, covering its first sale, the
    accidents, if any, that it has been in, and any and all repairs and maintenance.
    This is crucial not just to maintain a track record of the vehicle in question
    to determine its market value but also for legal and insurance purposes.


    Vehicle Registration is a way to facilitate this record keeping by maintaining
    a link between the vehicle and its owner. It might be or not be compulsory, depending
    on the law of the land. This helps the authorities with regard to taxation, insurance,
    or crime detection purposes. Also, it is a way for automobile dealer to keep track
    of their vehicles [1 - 3].


    # Concept of Smart Cities


    The urban development has resulted in a change of archetype in the 21st century.
    Research activities for smarter cities became a priority task. The life was improved
    in the last century in terms of technologies and services. Smart City is the demanding
    solution to sustainability and urbanization. Smart Cities may lead to a dystopian
    world that is regulated by technocratic governments, which propel citizens to
    subaltern roles. However, the massive industrialization and the'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'increasing population in the big cities has been a big challenging for urban
    planner, architects, and administrators.


    The service platforms of smart cities are the Internet of Things (IoT), big data
    systems, and mobility. Connected automobile with their advanced technology reduces
    the chances of accident and help drivers save time and gasoline within their limits.
    An increase in population in urban areas often leads to the problem of parking
    spaces. Smart parking is one of the most important parts of smart city. Sensors
    are placed in smart cities with good internet connectivity. More urban our planet
    becomes, the smarter the cities have to be. The cities of tomorrow will be more
    prone to transformation embellishment than the cities of yesterday [4].


    # Problem of Car Registration and Motivation


    The process of registering a car has always been difficult. This is a lengthy
    process involving several parties, and there is also the risk of manipulating
    information, replicating data and various errors. In this case, critical information
    can be very vulnerable to fraud or data falsification, or even available for tracking.


    By bringing the power of Distributed Ledger Technology called Blockchain into
    the picture and moving the entire process of registering a car on to Blockchain,
    a lot of these vulnerabilities can easily be resolved [5].


    # Research Objectives


    Blockchain comes to the rescue by reducing the average response time. The Blockchain
    will allow parties to send data in the form of an intellectual contract or chain
    code, which will eventually become the single source of unchanged data for all
    parties. In addition, the Blockchain in the vehicle registration ecosystem will
    help reduce the risk of fraud and aggression, since only authorized personnel
    can use the data when updating the private key in the province.


    In fact, any attempt to track fake data can be easily done on the Blockchain.
    The best part is that Blockchain provides one single idea of the lifecycle of
    the car in one book, which is not currently available [6].


    # Scope of the Research Work


    This research experiment is a generalized project implemented using open source
    technologies developed by Linux Foundation called hyper ledger Fabric in a permission
    model. Anyone can use this project by taking the authorization and adding their
    stakeholders into the system.'
