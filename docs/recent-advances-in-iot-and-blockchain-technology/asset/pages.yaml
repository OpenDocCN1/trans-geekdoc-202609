- pgno: 68
  md: '# Master Record


    The master record is the main storage area for all related identifiers and data
    belonging to the controlling entity (patient). The first time a Master Wallet
    is created, three attributes will be generated,


    +   1. **Master Record Identifier**: This is stored in the Record Chain and is
    used to identify the record. The creation of a block on the Record Chain involves
    the subsequent creation of secured storage area in the Storage Service. The functioning
    of the storage service is explained in subsequent section.


    +   2. **Controlling Keys**: A public private key pair will be created to control
    the record. The private key will be destroyed after its creation. The public key
    will be used to encrypt the backups on the Storage Service. In case of loss of
    data stored in the Device Record, the only way to recover the encrypted data will
    be to reconstruct the private key to decrypt the data of the Master Record from
    the Storage Service. The public key is stored in each of the Device Record which
    is using this Master Record as the backup. The public key is not stored on the
    chain.


    # Device Record


    The device records are used to store the identity-related data locally on the
    machine. Any form of data created by an entity is stored within the record. The
    only other place where the data is transferred is to the Master Record linked
    with the given Device Record to provide backup, and that too is encrypted with
    the decrypting private key destroyed to ensure maximum security and privacy.


    Every Device Record on initiation will execute Proc_DeviceRecord


    Proc_DeviceRecord


    # Begin


    +   1. **Set up an Authentication Method**: The method of authentication for logging
    into the device record can vary, however, OneId will define some basic guidelines
    to ensure that device records do not prove to be the weak link their security.
    The most widely used and preferred medium will be a mobile phone. Using authentication
    methods such as fingerprint scanning along with password protection can provide
    extra security.


    +   2. **Device Record Identifier**: Create a unique identifier. The method of
    identification creation is not yet outlined, however using characteristics unique
    to the properties of the machine can prove to be useful.'
