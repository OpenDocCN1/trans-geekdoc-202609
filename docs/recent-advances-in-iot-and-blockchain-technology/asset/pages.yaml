    # Deeper analysis of IPFS: Networking


    Nodes in the IPFS network need to constantly communicate with each other. IPFS
    can utilize any transport protocol and implements ICE NAT traversal techniques
    for node connectivity. As we have seen, Libp2p is an important foundation in the
    development of peer-to-peer network applications. It is basically a collection
    protocols or a modular and extensible networking stack to solve many challenges
    of peer-to-peer applications like content discovery and movement. Being a modular
    system, the whole IPFS is made of Libp2p modules. It is a key to connect the network
    by helping in content routing, discovery and transport as well as peer routing.
    It is an example of process addressing that has developed a horizontal OSI model
    changing guidelines for communication. The conventional vertical model as described
    in ISO/IEC 7498 is implemented in multiple layers making data difficult to access
    due to lack of its visibility being tightly packed together. This makes network
    up gradation even harder and discourages its improvement. Libp2p changes this
    framework describing the networking system operability to spread out where all
    protocols co-exist. Libp2p is a crucial component of IPFS making its debut as
    part of the IPFS project which uses it as its networking layer. Its implementation
    can be done using JavaScript, NodeJS, Golang, rust and will also support Haskell,
    java and python in the coming days making it even more versatile. Growing out
    of IPFS, Libp2p can also be used in other projects as their networking layer and
    is not limited to IPFS [19, 20].'
