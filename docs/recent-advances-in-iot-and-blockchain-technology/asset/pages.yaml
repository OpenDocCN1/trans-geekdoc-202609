    # EMERGENCY ALERT


    In this busy world, everyone is occupied with their work. No one gets sufficient
    time to look after their loved ones who are suffering from a disease. Hiring a
    full-time nurse is very costly, not everyone can afford it. For old aged people
    whose health is always at stake and we never know what illness they can suffer
    from at any hour. In order to avoid this, we have made an emergency email alert.


    When the temperature sensor device is attached to the patient''s body it will
    be taking a reading of the body temperature, and whenever the body''s temperature
    goes above the threshold temperature it will send an emergency email to the person.


    This is how immediate action can be taken at the right time.


    Fig. (11) displays the alert message sent to the patient’s emergency email ID
    to minimize the patient''s health risk.


