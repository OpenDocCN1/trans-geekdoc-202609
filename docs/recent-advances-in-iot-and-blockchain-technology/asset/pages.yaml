    # Implementation of blockchain on IPFS: Filecoin


    After all is said and done, IPFS is only a framework and requires some sort of
    an incentive to truly implement it. Similar decentralized networks can be layered
    and function hand in hand. One example is the implementation of blockchain using
    an IPFS system. IPFS depends largely on participation which means more active
    users generate a better network. Therefore, implementation of IPFS on a large
    scale is necessary for it to revolutionize the internet as it is today.


    One trending example of blockchain over IPFS is Filecoin founded by the same group
    of people that founded IPFS, protocol labs. Filecoin is built on top of projects
    like IPFS, IPLD, Libp2p and multifrormats. It is a p2p file storage and distribution
    network with built-in economic incentives to guarantee efficient and reliable
    storage of files on its own blockchain. Being a peer-to-peer network it lays down
    a decentralized protocol to store files on space provided by storage miners. Basically,
    any peer participating on the Filecoin network can provide storage space on their
    computer and get paid for renting out disk space provided sufficient proof that
    the files haven''t changed. Similarly, peers can also buy storage space from other
    peers. Payment is made in the form a native Cryptocurrency introduced by Filecoin
    also known as Filecoin (FIL). One major elimination is the requirement for users
