    can find out the lung capacity of the host. This further can be used to determine
    the associated diseases corresponding to the lung capacity of the host. For example,
    depending on the lung capacity of the host it can be suggested whether one should
    go out during high levels of air pollution. Also, this lung capacity can be used
    to'
