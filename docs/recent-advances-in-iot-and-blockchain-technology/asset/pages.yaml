    # What is Blockchain?


    The concept was first introduced when a group of researchers wanted digital documents
    to be time stamped, so that they cannot be backdated or changed, in order to maintain
    legitimacy. Broadly, blockchain is a decentralized and distributed digital ledger
    of transactions that may be public or private/permissioned. Each transaction is
    stored as a block. Each block contains details regarding the transaction such
    as date, time, amount spent, product as well as information about who is participating
    in the transaction. After this block is created, it must be verified by the nodes
    present on the decentralized peer-to-peer network where the nodes either agree
    or disagree with each transaction which forms the basis for the consensus mechanism.
    Once, a majority of nodes have validated the transaction, it is time stamped and
    given a unique hash storing it onto the database as an immutable record. Then
    the ledger is updated and the block is added to the database which is the “chain”
    of blocks. There is no need for any administrator as the blockchain users are
    the administrators themselves. Each block or entry is linked to a specific user
    along with their previous entries to maintain a legitimacy record of each user
    on the network. Over the peer-to-peer network, along with all the users on it,
    a blockchain system can be controlled autonomously to manage information openly.


    As complex as it may sound, blockchain is actually a very simple concept. It consists
    of a number of blocks connected or linked together with their unique hash values
    assigned to them. Many transactions can be housed under a single block. This huge
    “chain” of blocks is the database containing information that is present on each
    and every node of the peer-to-peer network. The identity of the users is anonymous
    or pseudonymous [1, 3].


    # Blockchain Architecture


    Basically, as described before blockchain is a chain of blocks containing information
    forming a database. A copy of the chain is stored in each node of the peer-to-peer
    network making blockchain secure and original or authentic. All these nodes are
    linked together instead of a centralized server system making the network decentralized.
