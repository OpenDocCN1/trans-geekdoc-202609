  md: '# VERSION CONTROL SYSTEM


    Version control systems are software tools that record files onto directories
    and help track any changes or modifications done to them. They are generally used
    by software professionals to oversee alterations done to the code base. A separate
    database is maintained by this version control software to keep track of every
    modification providing a backup for the data stored. Advantages of using a version
    control system include:.


    +   • It maintains copies of different versions of the code which can later be
    used to compare the differences and look for further enhancements while also correcting
    previous mistakes.

    +   • All the developers can work on the code from different locations minimizing
    disruption to individual members.

    +   • Responsible for the security and privacy of the source code which forms
    the backbone of every project the team works on. It protects the code from human
    degradation intentionally or unintentionally.

    +   • Since version control tracks every change, it helps to keep record of individual
    contributions as well the current work of each individual ensuring that the work
    done by different developers does not overlap or conflict and thus all changes
    are compatible with one another enhancing the experience of working simultaneously.

    +   • Even if a person is working alone, he can access the project from multiple
    devices.


    In any version control system, the central database which contains the code, the
    versions and all related data is called a central repository. This central repository
    can be cloned by different users onto their systems to work individually on the
    project. Cloning a part of the repository to work on a particular feature is known
    as branching while cloning the entire repository to use the entire code as a base
    is known as forking. These individual copies of the data may not be same, as different
    developers keep working on and making changes to the code. This personal copy
    is also called as checkout. When all work is done, the changes made can be committed
    onto the local repository of that developer. These changes can be merged with
    the original repository by pushing the commits. It is the responsibility of all
    members of the team to maintain and work on the latest versions of the code. Getting
    updated to the latest version can be done simply by a pull request from the centralised
    repository.'
  merge: -1
  img_proc: true
