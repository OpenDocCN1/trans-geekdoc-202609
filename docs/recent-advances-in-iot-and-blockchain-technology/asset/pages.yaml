    # NOVELTY AND RECOMMENDATIONS


    If you have ever bought your own vehicle or have sold one, or have been a part
    of an automobile manufacturing or dealing at any stage of the cycle, you would
    be familiar with the complication that is Vehicle Registration. Given the fact
    that all vehicles in the market have been sold and resold as they passed through
    multiple hands, it becomes a cumbersome task to maintain a legitimate record of
    the history of each vehicle and make it available when needed.


    But before we go on to talk about the problems of the process of Vehicle Registration,
    we first need to understand why Vehicle Registration is such an important aspect
    of automobile dealing. Car ownership of changes as many times as you can imagine.
    Whether you look at it in the terms of dealing in spare parts or in assembled
    vehicles, dealings by the middlemen or by the retailer who makes the final sale
    to a consumer, or in terms of the resale of a second-hand vehicle, there are a
    number of stakeholders who would very much want to know about all the history
    of the vehicle they are buying. Not to mention the insurance agencies, the police
    and other authorities and well, the government too need to keep tabs on the automobiles
    for various reasons.


    The fact of the matter is that all these stakeholders need information about the
    vehicles, starting from its manufacturing story, covering its first sale, the
    accidents, if any, that it has been in, and any and all repairs and maintenance.
    This is crucial not just to maintain a track record of the vehicle in question
    to determine its market value, but also for legal and insurance purposes [14].


    Vehicle Registration is a way to facilitate this record keeping by maintaining
    a link between the vehicle and its owner. It might be or not be compulsory, depending
    on the law of the land. This helps the authorities with regard to'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'taxation, insurance, or crime detection purposes. Also, it is a way for automobile
    dealer to keep a track of their vehicles. Thanks to the inclusion of blockchain
    and the transition of the entire vehicle registration process to blockchain, many
    of these problems can be easily solved.


    The word automobile is derived from the Greek word auto which means “self” and
    the French word mobile which means ‘moving’. The significance of automobile are
    as follows:


    +   a. The increase in the demand for automobiles such as cars and other vehicles
    increase the income of driver of the automobile industry.

    +   b. In this foster age, people need to reach destinations rapidly. So, automobiles
    help one over here and thus have become popular. With the help of automobile,
    people from all over the world can travel anywhere. Automobiles play a vital role
    in the country''s socio-economic development.

    +   c. There is also a worldwide sharing in automotive industry of cars, vehicles,
    parts and accessories that ranges from 15% to 40% in US, South Korea, etc.

    +   d. The automotive industry provides development of the taxable base and revenues
    of the state budget.

    +   e. It also influences scientific and technical progress.


