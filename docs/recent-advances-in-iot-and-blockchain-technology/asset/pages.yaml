    # CHALLENGES


    Blockchain technology has some inherent technical problems and bottlenecks. In
    this section, we will discuss two of these problems in detail and why they need
    to be considered before implementing this technology in healthcare.


    # Security


    In the previous sections, we have discussed that medical information is not only
    crucial but also very confidential. Securing the privacy and integrity of this
    information is of utmost importance. This has incentivized hackers around the
    world to increasingly participate in the lucrative business of hacking medical
    data. In the USA, over 32 million healthcare records were breached in a duration
    of just 6 months (January 2019 to June 2019). This number is twice the total number
    of breaches in all of 2018 [35]. This alarming increase is a direct result of
    the widespread adoption of electronic means of storing medical records by hospitals.
    But as previously mentioned, the electronic frameworks used by hospitals are often
    incompetent in safeguarding medical information from hackers. They are mostly
    developed to make the process easy and efficient for the medical staff and the
    patients. Furthermore, this data has multiple points of exposure during the process.
    This can be when it is transferred from one medical stakeholder to the other,
    like transferring prescriptions to the pharmacy. Hackers can exploit these vulnerabilities
    to gain access to and sell these records on the black market [36].


    Hence security is a very compelling reason to incorporate blockchain in a healthcare
    facility. Blockchain technology indeed is much more robust than traditional frameworks
    as it uses cryptographic hashing, consensus algorithms, and immutability to ensure
    security. But like any other disruptive technology, blockchain also has some inherent
    security flaws. These security issues are mostly exclusive to the blockchain as
    they exploit its certain key aspects. The following are two security threats that
    can be a cause of concern in a blockchain-based healthcare framework.


    # 51% Attack


    Also known as the majority attack or the double-spend attack, this kind of attack
    exploits the 51% vulnerability of blockchain consensus mechanisms. If a miner,'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'or a pool of miners, gains control of over 50% of the computing power of the
    entire network, they can essentially control the entire blockchain. This will
    allow them to modify transaction data and reverse transactions which cause double-spending.
    Further, this will disrupt the normal functioning of other miners in the network.
    In 2018, the cryptocurrency Bitcoin Gold suffered a 51% attack for several days
    and the attackers double-spent at least USD 18 million [37]. In January 2014,
    GHash.io, the largest bitcoin mining pool at the time, gained control of 42% of
    the network’s computing power dangerously approaching the 50% mark. It had to
    voluntarily reduce its computational involvement and the pool operator released
    a statement declaring that the pool would not initiate a 51% attack on bitcoin.
    In a healthcare facility blockchain framework with consensus protocols where there
    won’t be many actors, to begin with, initiating a 51% attack would be relatively
    easy [38].


    # Criminal Smart Contracts


    We have discussed how smart contracts can be used in many ways to automate otherwise
    resource and time-intensive works. Smart contracts can be used to verify billing
    and also authenticate insurance claims. Further, new Turing complete programming
    languages are emerging for the sole purpose of developing smart contracts. A solidity
    is an object-oriented programming language for developing smart contracts for
    many blockchain networks like Ethereum. However, there are some critical risks
    involved with smart contracts. Those smart contracts capable of undertaking illicit
    activities are known as Criminal Smart Contracts (CSC). CSCs can be programmed
    for private key theft and exposing other private data. An example of a CSC can
    be a contract that rewards after the delivery of some private information. In
    a healthcare facility scenario, CSC can be used for fraudulent insurance claims
    or leaking private medical information. Technically, there is a scope for implementation
    of CSC in all the units which make use of smart contracts [38, 39].


    # Scalability


    One of the biggest concerns in the practical implementation of blockchain is scalability.
    Even in the case of bitcoin, a transaction speed depends on network congestion.
    If a network has a higher number of nodes then it will be greatly slowed down.
    From image-heavy and abundant health records to complex supply chains of drugs,
    we can easily expect a high number of nodes holding copious amounts of data making
    scalability a key concern for most practitioners. Scalability refers to the ability
    of applications, programs, networks, etc. to improve or at least retain their
    efficiency even when it serves an increasingly large'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'number of users. So far in most proof-of-concept implementations of blockchain
    in the healthcare industry, efficiency has not been much of a concern so it has
    not been dealt with properly and remains a key area for discussion and research.
    Even in bitcoin, the most popular application of blockchain, efficiency is much
    lower than its traditional centralized counterparts. Bitcoin handles maximum of
    7 transactions per second [40] whereas VISA handles 65 thousand transactions per
    second.


    # Why is Blockchain so Slow?


    As blockchain technology relies on peer-to-peer networking and a consensus algorithm,
    it has a much slower transaction processing time than centralized networks. A
    valid transaction has to satisfy proof-of-work which is a huge time-consuming
    process. So when requests for multiple transactions pile up on a network, it slows
    down the system greatly. The security of a network is dependent on the efficiency
    of the consensus and proof-of-work mechanism which is directly proportional to
    the size of a block in the chain. However, the time taken to append a block and
    thus, process a request is inversely proportional to the block size. Therefore,
    to have a security system, you will need to compromise transaction speed and vice
    versa. This issue becomes even graver when you couple blocks size with data-heavy
    health records. In bitcoin, the upper limit for a block size is 1MB whereas its
    2MB for Ethereum. Bitcoin handles 7 transactions per second and 15 transactions
    per second respectively. The Healthcare industry has large data needs and blockchain
    needs to find a way around them by providing both security and speed.


    # Managing Storage Capacity


    Blockchain is designed for systems that don''t need large storage but the healthcare
    industry doesn''t come under that scope. Health records, patient history, detailed
    audit trails, heavy image scanning, and test results mean that the storage capacity
    of each node needs to be humongous. Data heavy nodes in the chain also imply that
    the cost of querying and accessing data will be proportionally increased.


    # CASE STUDIES


    In this section, we will explore some successfully implemented and proposed blockchain-based
    healthcare frameworks in detail.'
