  md: '# Architecture of the Model


    In our model, we have inculcated the basic principles of U-Net [13]. U-Net is
    a pair of down-sampling and up-sampling. During contraction path, features of
    down-sampling activation function and max-pooling extracts and features from images
    and symmetric expanding path up-sample the result from the previous step and increase
    the resolution of the extracted feature. Along with expanding and contracting
    path skip connections are used, which provides context and localization. This
    architecture can be more clearly depicted in Fig. (3) below:


    ![](img/acd73a27093a44d669c4d9968aa1626b_176_0.png)


    # Model Summary


    The above architecture has been implemented using Keras and is depicted below
    using the snapshot of the involved portion of the script. Our model starts with
    taking input of dimension (256, 256, 3) after passing through various parts of
    U-Net it is reduced to (128,128,32) after batch normalizer 2.


    The similar layers perform the same function to new image input and successively
    reduce it to (64, 64, 64), (32, 32, 128), (16, 16, 256) after batch normalizer
    4, batch normalizer 6, and batch normalizer 8, respectively. This process is called
    contraction in which downsampling of features takes place and has been shown in
    Figs. (4 and 5) below.'
