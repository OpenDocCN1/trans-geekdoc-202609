- pgno: 70
  md: '# Creation of Identifiers


    Any entity that joins OneId can create native Identifiers. The exact nature and
    functioning of these identifiers are inspired from the Decentralised Identifiers
    Specification proposed by W3C as it shall allow users to generate identifiers
    in a decentralized manner. Every identifier will be added to this chain and hence
    will be able to refer to through a public endpoint as OneId/identity/identifier.
    Fig. (5) depicts the working of the Identifier Chain.


    ![](img/acd73a27093a44d669c4d9968aa1626b_70_0.png)


    Fig. (5). Overview of the Identifier Chain.


    For every identifier, we have the following set of properties:


    +   1. A public private key pair. The private key is stored in the wallet and
    the public key is visible on the ledger.


    +   2. A chain of blocks for authorisation records. The first block contains the
    record Id responsible for the creation of the given identifier. The same identifier
    can be controlled by multiple records or completely made to change ownership.
    The log makes sure the records are transparent.


    +   3. Any messages relating to an entity engaged with this identifier through
    claims will add blocks to the claim message chain. For example, when a claim is
    created, claim data is modified, or the claim is revoked, the changes would not
    be accepted until the block expressing the changes is added to this chain. This
    ensures nonrepudiation and a log of claim-related activities concerning a particular
    identifier.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The Record and Identifier Chain is sufficient for the general purpose of functioning
    and fulfill most of the requirements of an EHR. The only thing to be covered yet
    is how will a user make and exchange claims if any. This is dealt with in the
    next section.


    # Claim Chain


    The claims used in SkyNet are native to the system, and logs of changes to the
    claims is kept within the system. However, it might be the case that transparency
    regarding these changes in the claims be kept public. To solve this problem, if
    the issuer knows that the public records will be required, it simply uploads its
    claim id on the claim chain. Any changes thereof in the claim in SkyNet will have
    to be first uploaded as log on the claim chain in OneId before being implemented
    in SkyNet.


    # CONCLUSION


    This project had started with the purpose of studying decentralized systems and
    finding out solutions on how they can be modified to scale like their counterpart
    centralized versions. Halfway through the project, the team arrived at a conclusion
    that decentralized systems are incentive driven, and the incentive depends on
    the purpose the system is designed for, unlike centralized systems where the focus
    is on distributed characteristics such as consistency and scalability. The project
    then focussed on implementing identity and credential management through these
    decentralized systems. Various other implementations were studied and compared.
    Based on their analysis, we proposed a solution consisting of a combination of
    centralized and decentralized services. We highlight in detail why this approach
    presents a favorable outcome and present the mechanisms of its functioning. Workflows
    and data management are also presented to show real-life use cases.


    However, this current version of SkyNet and OneId has left a few of the functionalities
    incomplete. The most important being the implementation of wallet consistency
    and claims exchange on OneId. The incentive mechanisms for the permissioned ledger
    and storage nodes are also left for further exploration to ensure that the system
    is practical enough to be used in real life. Overall, the combination of SkyNet
    and OneId presents an exciting opportunity in the field of self sovereign identity.


    # CONSENT FOR PUBLICATION


    Not applicable.'
