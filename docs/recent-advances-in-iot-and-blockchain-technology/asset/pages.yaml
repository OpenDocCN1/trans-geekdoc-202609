  md: '# # 5-G Technology and Its Implications


    With an advanced access technology and with an increase in the demand of the users,
    4G will now be easily replaced with 5G. There are several reasons to switch to
    5G have higher capacity, increase data rate, lower end-to-end interruption, massive
    device connectivity, reduced cost and consistent quality of experience [7].


    5G consists of microcells, small cells, and relays and hence heterogeneous. Device
    to Device communicative (D2D) and Internet of Things (IoT) are major concerns.
    5G provides a good policy for future 5G standardization network MBB mobile broadband.
    5G will allow wireless networks to matter data rates and use cases that are currently
    handled by fiber access. One of the widely used technology in today’s era is IoT.
    IoT further consists of two technologies. These technologies are used to describe
    a key focus area for the ICT sector [8, 9].


    +   a. Cyber Physical System (CPS) - This system is used to describe a key focus
    area for the ICT section. It is basically defined as the unification of computation
    and physical processes.

    +   b. Machine to Machine (M2M) - It represents the way in which machines can
    communicate between themselves.


    5G validates IoT for new use cases and economic sectors. The objective of 5G is
    to meet projected mobile traffic demand and to heuristically address the communications
    needs of most sectors of the economy. Also, the aim of the group is to promote
    the development of 5G technologies in China. South Korea’s 5G forum is also a
    public private partnership program that is formed in May, 2013.


