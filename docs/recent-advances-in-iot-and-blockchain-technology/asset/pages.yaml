  md: '# Gem Health Network


    Founded in November 2013, Gem is a California, USA-based company that provides
    cryptocurrency and distributed ledger-based enterprise-levelopenterpris-level
    solutions. An established startup, it raised USD 7.1 Million in its Series A funding
    round. It had already raised USD 4.9 Million in its seed round. Conceptualized
    in the initial days of blockchain technology, Gem has been pioneering the use
    of blockchain technology for financial solutions since its advent. But in 2016,
    it entered the healthcare stage and launched Gem Health Network.


    The primary motivation behind the development of a healthcare framework was the
    glaring increase in medical data “silos”, which essentially are private databases
    maintained by medical institutions, professionals, and other stakeholders. Retrieval
    of data from one “silo” for it to be transferred to another is a resource-intensive
    and error-prone task. For example, consider a patient who is being treated by
    their local doctor. If the patient needs to travel to some other place, to continue
    their treatment they will either need to have an entire copy of their medical
    history, diagnosis, and treatment schedule or set up a way to quickly retrieve
    this data from their local doctor. This issue of interoperability can be life-threatening
    because of the lack of a data storage or transfer protocol. Further, this also
    involves an Information Security dilemma of the trade-off between data access
    and data protection which means that increasing data security compromises data
    availability and vice versa. Gem Healthcare uses blockchain to address this issue
    by incorporating identity schemes and decentralized data storage. It allows for
    a transparently shared infrastructure where each medical stakeholder has access
    to the same information and can trust each other reliably.


    The Gem Health Network was developed using the Ethereum blockchain, which provides
    the initiative with highly functional tools to build a stable, continuously evolving,
    and multi-faceted platform. The CEO of Gem, Micah Winkelspecht, aims to create
    a blockchain-enabled global repository where medical data integrity is maintained.
    In the ideation phase of Gem Health, the company was mostly approached by active
    physicians who were discontented with their present technologies and wanted a
    platform that allowed the different medical stakeholders to collaborate. Moreover,
    various healthcare companies also reached out to Gem Health including Philips
    Blockchain Labs, the research and development department of Philips healthcare.
    The support and partnership from a prominent healthcare operator ensured that
    the research for the use of blockchain in patient-centric healthcare would be
    extensive [41].'
