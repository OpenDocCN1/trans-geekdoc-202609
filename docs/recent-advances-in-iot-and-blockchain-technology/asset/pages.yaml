  md: 'To summarize, data is stored on a p2p network on peer computers instead of
    a centralized server. The IPFS stack uses or applies the stored data. The data
    is named and defined for access and security by standards like IPLD and IPNS.
    Data discovery mainly relies on distributed hash tables (DHT). Finally, Libp2p
