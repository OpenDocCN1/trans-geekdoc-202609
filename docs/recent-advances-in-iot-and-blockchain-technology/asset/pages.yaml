- pgno: 41
  md: '# # Structure of the Filecoin Network


    The basic structure contains 4 essential components:.


    # ## 1. Network


    It consists of p2p system using IPFS and implements blockchain where all transactions
    are stored. Peers on this network can audit storage offered by miners who can
    also create new blocks to get rewards.


    # ## 2. Storage Nodes


    These are storage miners which provide the spare storage space called sector on
    their computers and are rewarded in FIL. These sectors have unique ids for recognition
    and must be pledged to the Filecoin Blockchain before they can store any data.
    Storage miners are required to constantly provide proofs for storage of client
    outsourced data for a period of time which can be reviewed by everyone to build
    trust on the miner’s legitimacy. This is done by abiding to proof-o-spacetime
    (PoSt) mechanism which is submitted to the network before mining a block. Miners
    must also adhere to proof-of-replication (PoRep) to prove that they are storing
    the data mentioned and it is encoded in a unique way where no other miner can
    replicate it.


    # ## 3. Retrieval nodes


    These are off-chain miners responsible for data retrieval or fetching from the
    client or the storage miner. Client data can be divided into small pieces and
    stored by different storage miners. Retrieval miners receive payments from the
    client in the form of micropayments for each piece of data.


    # ## 4. Native token


    This is the native token system or Crypto currency developed by Filecoin also
    known as Filecoin (FIL). All transactions made between clients and miners are
    done using this [22, 23].


    # ## Data Storage and Retrieval Protocols


    Storage miners can pledge their sector on the blockchain by specifying their sector
    size and depositing a collateral for that particular pledge. This collateral is
    used when any storage proof is missing. These storage miners can then supply an
    ask order which specifies the cost of service. A client can encrypt his data before
    storage to maintain security and can choose any storage provider by submitting
    a'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'bid order specifying how much he/she intends to pay. All these orders are recorded
    on a separate Order book maintained by Filecoin to prevent bottlenecks on the
    blockchain. When both the orders match, a deal can be made between the client
    and the storage miner. This transaction is then recorded onto the blockchain.
    As the data pieces are stored, an allocation table keeps track of these pieces
    and its associated sectors. This allocation table is updated at every block and
    its hash is maintained on the newest block on the blockchain network. Data is
    then transferred from the client to the miner, the completion of which it is verified
    to make sure it matches the deal parameters. Once the data is recorded on-chain,
    the miner must generate a proof-of-replication and seal the sector to maintain
    security. Sealing is a set of operations to transform that sector into a unique
    replica of the original data which is associated with the Filecoin miner''s public
    key [24]. This sealing process is necessary for miners to submit continuous proofs.
    Clients can achieve fault-tolerance for their data by replicating the data they
    have stored causing redundancy. Data can then be retrieved by retrieval miners,
    before which the sector must be unsealed. Some Filecoin clients like lotus maintain
    unsealed copies along with the sealed ones for faster retrieval of data. However,
    this is not a verifiable part of the protocol although it is a useful feature.
    The data is then transferred back to the client. The payments for service are
    made off-chain through the order book and using the blockchain only when disputes
    arise [23].


    # Fault Tolerance


    Filecoin implements byzantine fault tolerance where faults can either be management
    or storage byzantine faults. Storage providers on the network need to provide
    constant proofs for the storage of the outsourced data which validated by a byzantine
    agreement (BA) used to audit these providers. This BA can tolerate up to f < n/2
    faulty nodes where f is the number of faults and n is the total number of nodes.
    These management faults are byzantine faults in the manage protocol and are (f,n)-tolerant.
    We can see that it has better fault tolerance than conventional byzantine agreement
    which can tolerate up to f < (n-1)/2. The violation of this agreement can get
    the miners slashed and the content redistributed.


    On the other hand, storage faults are byzantine faults in Put and Get protocols
    which prevent clients from retrieving data. If the BA can tolerate f faults and
    has m independent storage miners, then the put protocol is (f,m)-tolerant [23].'
