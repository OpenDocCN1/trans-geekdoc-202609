    Fig. (5). Summary of the Keras model implemented in the system.


    In between down sampling and up sampling dropout, maxpooling2d, convolution layers
    are being used whose functions are as followed:


    +   * Dropout: The dropout layer is simply used to avoid overfitting. It subsamples
    the output layer randomly thus avoiding reducing capacity or thinning of the network.

    +   * Maxpooling2d: It proved the feature map after scanning input by a fixed
    size filter containing the most prominent features. Its filter selects maximum
    elements from the region of the feature map.

    +   * Convolution: The convolution layer is the soul of any neural network. Its
    simple application of filter over input results in the activation of features.
    Moreover,'
  merge: -1
  img_proc: true
- pgno: 179
  md: "repeated activation results in a feature map which in turn is used by the maxpoolig2d\
    \ layer. Pseudocodes for Accuracy metric and loss function has been shown in Figs.\
    \ (6 and 7), respectively:\n\n```\n#accuracy Metric\nfrom keras import backend\
    \ as K\ndef iou_coef(y_true, y_pred, smooth=1):\n    intersection = K.sum(K.abs(y_true\
    \ * y_pred), axis=[1,2,3])\n    union = K.sum(y_true,[1,2,3])+K.sum(y_pred,[1,2,3])-intersection\n\
    \    iou = K.mean(((intersection + smooth) / (union + smooth)), axis=0)\n\n  \
    \  return iou\n```\n\nFig. (6). Accuracy Metric determined using accuracy and\
    \ loss metrics.\n\n```\n#loss function\ndef dice_coef(y_true, y_pred, smooth =\
    \ 1):\n    y_true_f = K.flatten(y_true)\n    y_pred_f = K.flatten(y_pred)\n  \
    \  intersection = K.sum(y_true_f * y_pred_f)\n    return (2. * intersection +\
    \ smooth) / (K.sum(y_true_f) + K.sum(y_pred_f) + smooth)\n\ndef soft_dice_loss(y_true,\
    \ y_pred):\n    return 1-dice_coef(y_true, y_pred)\n```\n\nFig. (7). Loss Function.\n\
    \nAfter the sample is downsampled and features are extracted, the model starts\
    \ upsampling. Also, an important point to note is that selectively downsampling\
    \ connections made to the mirror side of U-Net known as skip connection, which\
    \ helps in encoder and decoder type of architecture to retrieve fine details in\
    \ prediction might have been lost during processing through various layers.\n\n\
    # Splitting and Training\n\nAfter pre-processing the dataset and defining our\
    \ model we need to split our data into the train and test samples. Training data\
    \ consists of 80% images and the rest 20% of images correspond to testing data\
