    # P2P NETWORK


    Peer-to-peer network (P2P) is a network of computer systems that can exchange
    files and data directly with each other without storing it in a separate server
    (client-server model). P2P enables any two computer systems or more to interconnect
    with each other without any intervention of a third party. In such a network,
    each computer system is called a node or “peer” [11]. It can take the role of
    a client and a server as well. Privileges and the distribution of tasks among
    the nodes are equal. InterPlanetary File System (IPFS) is an example of P2P network
    used in blockchain.


    Let us understand file sharing on a P2P network with the help of BitTorrent. The
    BitTorrent platform is built on the P2P network. On BitTorrent, sharing and downloading
    files can be done efficiently. The computer that stores the data to be shared
    or downloaded is called seed. It then splits the file into a lot of pieces. Any
    node on the network who wants the file uses the BitTorrent client platform. This
    node would receive one part of the file. Over some time, it would receive the
    remaining chunks from other nodes. At a particular time, a peer would be downloading
    parts of the file that it does not have and simultaneously uploading other parts
    to some other peer on the same network. There is no sequential way for it. It
    is random in the process. Hence at any time, cooperation is required among the
    peers. Such a group of nodes is called a swarm. An enormous swarm means a popular
    file. The cooperation among peers makes the overall process faster. Eventually,
    every client on the network receives a complete copy of the'
