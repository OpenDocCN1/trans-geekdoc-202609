- pgno: 124
  md: '# CONCLUSION AND FUTURE SCOPE


    The main goal of this project was to successfully monitor the basic three health
    parameters namely temperature, pulse rate, lung capacity, and then respond during
    emergencies without any human intervention. The rise of IoT has added another
    dimension to this era of technology and to keep pace with these new technologies,
    this project has taken big strides towards advancement in general and in the health
    sector to be specific. We have rightfully leveraged the power of IoT in this project
    to increase the efficiency of the health sector. Though our model is tested and
    implemented, the continuation of this project without proper backing with funds
    will be difficult as the project requires a considerable amount of quality hardware
    support. The real potential of this work can only be realized when we can implement
    this project at scale using various big data frameworks.


    There is still scope for improvement and potential for future development in this
    project which can take this project to new heights.


    Our pulse rate sensor can be upgraded so that it can measure the heart rate when
    patients are in motion. Right now, the sensor is a little unstable when it comes
    to measuring heart rate when the patient is in motion. We can also measure other
    health parameters like blood pressure, EEG, etc. to make our system more robust.
    More sensors mean more data for doctors to identify diseases. Data stored in the
    database need protection from potential threats and that is why incorporating
    security measures in our system can add a level of abstraction for the patient’s
    data and earn their trust. We can also add a video conferencing functionality
    to our system which helps doctors to prescribe medicines to people in rural areas
    efficiently without having to travel large distances.


    We can use the lung capacity data combined with pollution measuring sensors to
    monitor whether an elderly person can be allowed to go out of the house in the
    current times of rising pollution. All these functionalities can make this model
    a household thing and can completely revolutionize the healthcare industry.


    Our project can be considered as a platform to develop in the field of IoT in
    the health sector. In developing countries like ours, this kind of innovative
    and cost-effective project can improve the future of technology. So, we are looking
    forward to implementing the project to make an impact in the new era of technology.


