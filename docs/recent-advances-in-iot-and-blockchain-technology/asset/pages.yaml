    # RESULTS


    The training and early stopping of our model yielded a loss of 24.462% and an
    accuracy of 60.62%.


    Following is the prediction obtained on a separate set of images that are not
    the part of train and test split. From predicted images, it can be seen that results
    are fairly good. It is visible in Figs. (10 and 11), that accuracy of prediction
    is greatly dependent on the input resolution of images.'
