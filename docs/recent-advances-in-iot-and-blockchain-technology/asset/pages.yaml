  md: 'is called the genesis block. This does not reference or point to any previous
    block and is hence a special case. It is often labeled as block 0 in modern versions
    of bitcoin. Its previous hash is set to 0. This genesis block has its own hash,
    which is added to every new block added to the blockchain creating a unique combination.
    The genesis block tells about the origin of that particular blockchain and forms
    a trust among the miners. Apart from instilling a trust for the authenticity of
