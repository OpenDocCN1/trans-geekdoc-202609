    # Blockchain


    Satoshi Nakamoto first created blockchain in the form of the popular cryptocurrency
    ‘Bitcoin’ [1]. In a peer-to-peer (P2P) network, each user is referred to as a
    node, and the transactions that take place are categorized as blocks. The blocks
    are then interconnected in an order. One pair of public-private keys is associated
    with each node. The public key is used to recognize the node as a sender or a
    recipient, while the associated private key is used by a sender to sign transactions
    and by a recipient to validate them. In addition to enabling the appropriate key
    to decrypt and collect the information, a deal among the'
