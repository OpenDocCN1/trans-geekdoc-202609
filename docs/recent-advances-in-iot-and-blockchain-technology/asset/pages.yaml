- pgno: 43
  md: '# Why the Hype Around Filecoin?


    We already know the advantages of decentralized system over a centralized one.
    Filecoin being decentralized shares all of those in addition to its specific advantages
    that set it apart from its competitors. These include:.


    # 1. Scalable and Economic


    Filecoin doesn’t need new protocols and standards but rather builds on existing
    ones allowing them to be easily integrated into modern systems. It also doesn’t
    require a different API for each provider. It also doesn’t require extra storage
    systems but makes use of existing ones.


    # 2. Low Cost


    Solves the biggest problem of current blockchain networks, expensive storage.
    Having millions of computers interconnected, pricing is not corporate but depends
    on demand and supply. More the number storage miners competing, cheaper is the
    storage.


    # 3. Security


    Overcomes uncertainty over storing files on an unknown computer by sharding. These
    pieces can later be accumulated by the retrieval miners. Clients can also encrypt
    their data for added security.


    # 4. Dynamic network


    Ensures proper storage of files. Constantly searches for faulty miners, on discovery
    of which slashes them and redistributes data to reliable miners at the same cost
    through process claimed as self-healing.


    # 5. No computation


    Miners don’t need to perform heavy computations as in the case of other blockchains
    implementing proof-of-work. Anyone with a computer and storage of any specification
    can participate without the requirement of expensive computational power.


    # 6. Expansion of existing blockchains


    Can provide storage to other blockchains as well which face storage issues. Blockchain
    will function as usual but data will be stored on the Filecoin network. May also
    support interoperability with other blockchain transactions in the future.'
  merge: -1
  img_proc: true
