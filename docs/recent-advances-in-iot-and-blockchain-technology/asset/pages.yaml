  md: '# Making Great Strides Towards Road Detection


    Vimal Gaur¹,*


    ¹ Maharaja Surajmal Institute of Technology, Computer Science and Engineering
    Department, Janakpuri, New Delhi 110058, India


    Abstract: A significant amount of research has been carried out in extracting
    land surface objects, but intelligent digital surface models for monitoring land
    surface objects are still an active research topic due to emerging technologies
    such as IoT and Blockchain. These technologies play an important role in quantifying
    the ecological and geographical properties of the land surface. About such technology
    of detecting buildings, roads, and terrain from satellite images offer a lot of
    potential for tracking the migration of large chunks of the population and helps
    in geographical analysis of the city. In this paper, we explore a Convolutional
    Neural Network method for extracting land surface objects from satellite imaging
    with the help of U-Net. As a known fact, the number of disasters occurring every
    year affects thousands of the population, so suitable mechanisms must be provided
    for rescue operations. To provide these rescue operations, predictions about the
    geographical location are of primary importance. Our model produces reasonable
    accuracy of 60.62% at a very minimal loss rate.


    Keywords: U-Net, Spatial Processing, Image Segmentation, Deep Learning, Computer
    Vision, Down and Up Sampling, Skip Connection.


    # INTRODUCTION


    The extensive process of mapping out the populated regions of a metropolitan city
    or even a remote town can be laborious and painstaking when done according to
    outdated methods. Population hotspots in metropolitan areas are rapidly changing
    the cause of bodily movement but also because of environmental alterations both
    induced naturally, like fluctuation in living conditions such as a change in weather,
    or human-induced like contamination of groundwater through drilling for oil. This
    indicates that mapping is difficult, especially in remote divisions where the
    attention of the authorities is minimum. Our paper focuses on addressing the wider
    aspect of image segmentation of satellite images by directing our classification
    at pixel level and checking whether pixels belong to road/path-'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'way or not. We have developed a model for dealing with affected areas that
    are under stress and finding the most efficient routes to provide aid in those
    areas as early as possible. As seen in the year 2020 and its harrowing outbreak
    all around us, the outbreak of COVID-19 tested the readiness of governments of
    many nations. The impact of the virus could have been made minimal in many countries
    just by simple mapping out hotspots and by also calculating the appropriate way
    of distributing the test kits. All this could have been a straightforward task
    by using a deep learning algorithm altogether like ours. The impact on third-world
    countries like India, where masses have to depend on a government instantly in
    a situation of a pandemic like this, needed to be calculated beforehand amidst
    the lockdown [1 - 3]. We have tried to extend this concept to the physical world
    rather than in the medical field. This paper addresses the issue of segmentation
    of images obtained by satellite imaging. It dissects the image pixel by pixel
    and classifies each pixel as part of the road. We have trained our model on a
    set of high-resolution images obtained from [4]. As we learned from another study
    [5] downsampling could help us in simplifying the problem we face with high-resolution
    and small-size lesion regions. Our images were correspondingly labeled with binary
    masks, i.e. given a satellite image as input, our program was then able to output
    a corresponding predicted binary mask, which was then further processed into more
    labeled and accurate data to aid us in our mission of mapping route enhancement
    using image segmentation [6].


    # RELATED WORK


    A few authors [5] extracted maximum accuracy when U-Nets are used in global and
