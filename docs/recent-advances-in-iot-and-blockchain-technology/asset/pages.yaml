- pgno: 58
  md: '# CHAPTER 2


    # Blockchain Based Hybrid Framework for Identity Management in Healthcare


    Deepak Kumar Sharma^{1*}, Arjun Khera^{2}, Koyel Datta Gupta^{3} and Rinky Dwivedi^{3}


    ^1 Department of Information Technology, Indira Gandhi Delhi Technical University
    for Women, Delhi, India

    ^2 Department of Information Technology, Netaji Subhas University of Technology,
    New Delhi 110078, India

    ^3 Department of Computer Science and Engineering, Maharaja Surajmal Institute
    of Technology, C-4 Janakpuri, New Delhi 100058, India


    Abstract: Healthcare systems face numerous impediments due to the unavailability
    of proper mechanisms to track the transactions related to patient’s medical records.
    The maintenance and privacy of patient records are one of the key requirements
    of the healthcare system. Blockchain can be the potential solution to these problems.
    Blockchains have made a tremendous impact ever since their invention barely a
    decade ago. This paper delves into how blockchain can be used to solve the problem
    of patient record management by constructing scalable decentralized key systems
    with inbuilt sharing of credentials in a safe, secure, and digitally verifiable
    way. The work presents a hybrid scalable system capable of managing personal identity
    in a decentralized manner with no dependence on central authorities along with
    a rapid and simplistic way of exchanging claims among the users. The system overcomes
    potentially all problems associated with SOVRIN and blockchains in general by
    splitting itself into two symbiotic versions, one centralised and the other, decentralised.


    Keywords: Blockchain, Healthcare, Identity management, Decentralized applications,
    IoT.


    # INTRODUCTION


    With the rapid growth in the field of information technology, the changes in the
    worldwide healthcare system are eminent. IoT based medical system [1, 2] is gaining
    popularity because of improved coordination between healthcare personnel and patients.
    The patient’s data recorded in the form of images, videos, text, and audio by
    IoT devices [3] needs to be processed and stored through'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'multimedia techniques. The devices are connected to the internet for subsequent
    storage of information at the cloud level, which can be accessed by different
    entities like doctors, insurance companies, research wings, and pharmaceutical
    companies (Fig. 1). However, healthcare record contains private information that
    may be viable to cyber-attacks. Hence, securing such large-scale multimedia data
    and maintaining the privacy of the patient records is important.


    ![](img/acd73a27093a44d669c4d9968aa1626b_59_0.png)


    Fig. (1). IoT enabled Healthcare System.


    The online transfer and storage of this sensitive record require a robust credential
    system. In this context, blockchain technology [4 - 7] can be used as a secure
    way to save and distribute information. The smallest unit of data that is linked
    with one another is called a block. The blockchain is a linear list of these blocks
    which are linked to one another using cryptographic hash functions, as depicted
    in Fig. (2). Evidently, the blockchain is nothing but an immutable ledger of records
    maintained across several computers which are linked together in peer-to-peer
    manner. Large number of participating entities maintain the ecosystem by storing,
    updating, and exchanging data among each other.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/acd73a27093a44d669c4d9968aa1626b_60_0.png)


    Fig. (2). List of Data Blocks.


    However, like any new invention, blockchain also had its flaws, the most pervasive
    being scalability. Decentralization and the associated benefits come at the cost
    of performance and scaling. When Bitcoin experienced a surge in popularity, the
    associated transaction fees shot through the roof as the system was capable of
    processing only a single every 10 minutes, which pales in comparison to other
    payment processing platforms such as Visa, which processes up to 2000 transactions
    per second. This was not the only problem. Bitcoin also consumed a lot of energy
    for mining, so much so that it has come under scrutiny for wastage of resources
    due to consumption charting more than even what cities draw. Many variations and
    changes to this structure, particularly to the consensus algorithms, have been
    introduced since then to overcome these shortcomings. Most of the implementations
    of blockchain to date have been around cryptocurrencies, and there is good reasoning
    behind that. Blockchain or decentralisation is a novel service, and running this
    service without any form of commitment by a central authority means other participants
    need something in return for operating the chain and its operations. Monetary
    rewards solve this problem better than'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'everything else, which is the reason why even the applications not concerning
    digital currency still build a native currency. However, other forms of reward
    systems are also present. For example, decentralized storage systems like DBChain
    or IPFS consider reward systems in the form of storage. On the other hand, most
    corporations, given the Adhoc participation rules in public blockchains, find
    them unsuitable for their purpose. Hence, the rise of permissioned blockchains
    consisting of known nodes in consensus opens a lot of new avenues in solving scalability
    and other issues. There will always be a compromise between the level of decentralization
    and scalability. In simple words, blockchains are not static protocols that can
    be suitably repurposed for any scenario. Unlike existing distributed system protocols
    that remain independent of the application they are for, blockchain design and
    associated consensus protocols are completely dependent on the use case. The reward
    system and the architecture for a currency would be completely different from
    one involving a database or medium publishing platform. This work contributes
    to the design of an Identity Management system for digital healthcare. Despite
    recent advances in the digitization of health services, a purely digital identity
    management system still remains an abstract concept. Given the lack of consensus
    among various stakeholders, the development of identity systems has been fractured
    and uneven. In the present day, a user is a bearer of multiple sets of identity
    documents spanning both digital and physical versions, requiring contact with
    multiple service providers to establish their identity. The problem is even more
    pervasive online, wherein a user is supposed to remember a plethora of usernames
    and passwords. Moreover, such a diverse spread also vastly increases the risk
    to privacy and security, as has been witnessed in past cases of breaches. Multiple
    people have taken a stab at devising a solution but to no avail. One of the reasons
    why a successful deployment in this field is all the more difficult is the amount
    of coordination that would be required to make a system successful making the
    process of both designing and bootstrapping such a system nearly impossible. To
    end this, we devised a system split into two. The proposed solution intends to
    plug these gaps in implementation by considering real life scenarios.


    The majority of the current applications are centralized meaning the operation
    is in a client-server manner. The client depends on the server to provide some
    data, or the server may store some of the user''s private data. This means that
    there''s a large dependence on central authorities, due to which there are inherent
    issues at the fundamental level of this design. The emergence and major growth
    in the development of decentralized applications occurred after the development
    of Bitcoin. Decentralized applications basically remove the factor of trust on
    one single authority and spreads it among all the participating entities. The
    entire responsibility of data management is transferred over to the users themselves.
    The invention of Bitcoin in 2009 by Satoshi Nakamoto [8] took the world by storm.'
