    protocol handles requirements for storage providers so that they don''t need to
    design API for their own storage or advertise themselves to invite potential customers.
    Filecoin holds a certain promise being the largest fundraising ICO to date where
    around $257 million were raised in both presale and ICO combined. It is very likely
    to make history as the fastest, newly live blockchain to reach a market capitalization
    of over $1 billion according to coin desk. Having its mainnet launched just recently
    on October 15, 2020, it is one of the fastest growing areas in decentralization.'
