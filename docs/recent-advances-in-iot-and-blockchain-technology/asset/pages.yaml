    So, we will analyze the trend of the health parameters using all of the three
    techniques and compare the results conveyed by each technique in the paper.


    Forecasting the trend of our health parameters using moving averages gives us
    the advantage of taking preventive measures for an alarming situation that may
    loom in the future. For this, we have integrated an email alert feature on our
    server wherein if the value of any health parameter goes above a set threshold
    then we will send an emergency alert to the concerned party to notify them of
    their patient conditions and take preventive measures to prevent future mishappenings.


