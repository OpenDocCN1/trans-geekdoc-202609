- pgno: 75
  md: '# CHAPTER 3


    # Blockchain in Smart Healthcare Facility


    Ayush Kumar Singh^1, Nipunika ^1 and Deepak Kumar Sharma^{2*}


    ^1 Department of Information Technology, Netaji Subhas University of Technology
    (Formerly known as Netaji Subhas Institute of Technology), New Delhi, India

    ^2 Department of Information Technology, Indira Gandhi Delhi Technical University
    for Women, Delhi, India


    Abstract: Healthcare is an indispensable system whose efficiency and robustness
    are reliable indicators of a nation''s prosperity. This sector has seen technological
    advancements not only in terms of medical equipment and drugs but also in varied
    fields such as Electronic Medical Records, wearable health monitoring devices,
    and telemedicine. In this chapter, we explore the aspects of utilising the disruptive
    technology of blockchain in healthcare. Ever since its initial use in cryptocurrency
    and finance, aiming to shift the industry from institute-centric to patient-centric,
    blockchain technology has found its use in healthcare. This chapter analyzes its
    use cases along with the limitations posed by traditional healthcare systems and
    how blockchain alleviates them. Furthermore, we will also walk through the roadblocks
    in implementing blockchain-based healthcare services and discuss a few implemented
    as well as proposed blockchain-based healthcare frameworks, highlighting their
    successes and failures.


    Keywords: Applications, Blockchain, Electronic medical records, Electronic health
    records, Healthcare, Services, Supply chain.


    # INTRODUCTION


    Blockchain technology came into existence in 2008 after Satoshi Nakamoto, a pseudonym
    for a developer or a group of developers, released a whitepaper with the title
    “Bitcoin: A Peer to Peer Electronic Cash System” [1]. Bitcoin became the first
    major cryptocurrency, with its peak market capitalization reaching 238 billion
    USD in the fourth quarter of 2017 [2]. Since its conception, Blockchain has been
    thoroughly researched for implementation in fields other than cryptocurrency and
    finance. The key features of blockchain include immutability, privacy, incorruptibility,
    and transparency, which makes it a suitable framework for implementing healthcare
    based applications. In this section, we will explore.


    * Correspondence author Deepak Kumar Sharma: Department of Information Technology,
    Indira Gandhi Delhi Technical University For Women, Delhi, India; Tel: 8743075567;
    E-mail: dk.sharma1982@yahoo.com'
