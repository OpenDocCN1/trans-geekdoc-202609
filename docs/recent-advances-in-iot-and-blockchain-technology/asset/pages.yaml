  md: '# DISCUSSION


    Blockchain, although is a relatively newer technology, it is no doubt revolutionary
    working towards changing the very foundation on the internet as we know it today.
    By the introduction of widespread use of decentralization of networks using P2P,
    blockchain makes the distributed data reliable depending on how regulations are
    standardized. The internet as we know it today has become an integral part of
    our lives and the absence of it cannot even be imagined. Changing the backbone
    of today’s network is definitely not going to be easy taking substantial amount
    of time and money along the way. One crucial aspect of this transition is the
    relocation of data onto these decentralized networks which makes data storage
    the most important field which may make or break the vision of how the internet
    will be visualized in the future. With many major blockchains like Ethereum struggling
    in this category, many solutions are being put forward. One ingenious idea was
    the proposal of storing data on borrowed spaces on the computer of each peer in
    the network as is implemented by Filecoin. This has massively reduced costs of
    storage, the Filecoin network being very compatible and adaptive with other blockchains
    as well. Having dealt with storage, data must also be easily retrieved. To tackle
    speed and latency problems, sharding was adopted. In any P2P network, apart from
    the use of storing data on each other, communication between nodes is also necessary
    in case an attack breaks out on the network so that others can be warned. But,
    no such inter-node communication protocol exists for industrial or practical purposes,
    whose existence will need further research and development to improve its security
    and scalability. However, technology is constantly evolving and will see further
    improvements in this field, which will be the target of future works [37].


    Blockchain technology initially gave more power to the ones having more computational
    power (POW) or financial backing (POS) allowing monopoly of the network by a selected
    few who can afford it. Also, the processing power of the general computer is increasing
    as technology advances and some of the consensus algorithms, considered very hard
    to solve, are getting solved faster and faster over time affecting the security
    of the ledger. However, with the inculcation of newer and more dynamic consensus
    algorithms, these irregularities are also being looked at allowing the network
    to be more autonomous and realizing the full meaning of decentralization. These
    algorithms must be robust and allow for upgrades because of the continuous technical
    advancement. In contrast to centralized systems where security must be ensured
    only at the central server, decentralized systems must maintain security at every
    node making its implementation very difficult. All the techniques are being researched
    and with due time, will definitely bring forth a framework that the users can
    trust their data with [38].'
