    # How Blockchain Implements Data Privacy


    Blockchain is a decentralized network of small nodes called block. Each and every
    user has access to the entire blockchain but each block is only accessible by
    a particular key only available to the owner of that data. Once the data has been
    added to the blockchain, it is very hard to update or change it. In addition,
    blockchain are stored in a P2P network where the complete Blockchain is stored
    on each user’s computer to remove the need of a middleman [28].


    # Blockchain Privacy Protection


    # Private and Public Keys


    Blockchain uses asymmetric cryptography to secure transactions between users using
    private and public keys. These keys contain a random string which is unique to
    the particular block of data. Only the users with these keys can access the data
    [28]. A private key consists of a series of 32 bytes. It can store a 256-length
    string in form of binary string, Base64 string, WIF Kay, mnemonic phrase, hex
    string, etc. these 32 bytes are used to create a public key is then converted
    to a Hash address which is used to access the data by other users. Blockchain
    uses a very complex algorithm used to convert the private key to public key. These
    algorithms prevent the conversion of a public key back to its original form, the
    private key [27].


    Blockchain also maintains user anonymity by representing each user by their blockchain
    address, this address does not reveal personal information. These addresses are
    calculated by a user’s past interaction with the blockchain.


    # Attribute Based Encryption


    It is a key encryption algorithm which generates a key based upon all the attributes
    of user such as address, type of data, etc. ABE has a very big disadvantage, whenever
    we want to add or remove a user from a particular block;'
