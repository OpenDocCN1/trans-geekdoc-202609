  md: '# Drawbacks of Sharding In Blockchain


    +   1. Sharding would result in separate blockchain networks. Users on a particular
    subdomain cannot access an application on another subdomain and vice-versa without
    a communication mechanism among the shards. It would make the system more complex
    [7].


    +   2. Hackers can take over control of shards. They can easily corrupt them.
    Also, they might store invalid or false data. This is known as a **single-shard
    takeover attack or a 1% attack**. Ethereum has proposed random sampling, meaning
    reassigning nodes to particular shards at random intervals of time. Corrupting
    the shard now becomes a lot harder.


    +   3. Sharding is commonly used in a privately owned network. Implementing it
    in a public blockchain is still a challenge.


    # Alternatives to Sharding


    +   1. **Increasing the block size** could be thought of as one alternative to
    sharding. But this is only a short-term solution. By increasing the size of the
    block, we can store more transactions hence number of TPS would be higher. As
    the size of the block increases, more computation power would be required by the
    node to verify the block. Computer equipment for such a requirement does not make
    it economically viable for nodes. Thereby the number of nodes on the network decreases
    and the network becomes more centralized and vulnerable to 51% attack.


    +   2. **Off-Chain Blockchain**: Blockchain does not store the contents. The miners
    provide their hard disk to save someone else data. They are rewarded with crypto
    tokens to motivate users to lay off their spare disk space.


    # Blockchains Using Sharding


    As we know, the biggest downfall of implementing sharding in a blockchain is no
    communication among individual shards. Also, there is no logic to split them in
    a random approach if the nodes have a general distribution and are geographically
    widely spread. Random sharding would require smooth communication among nodes
    for the successful implementation of sharding. As of now, there exists no definite
    protocol so the individual shards can communicate with each other. Ethereum blockchain
    developers are having complications resolving it.'
