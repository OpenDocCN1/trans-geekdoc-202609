  md: '# Algorithm 3.


    Time Series Forecasting Techniques.


    Step 1. Forecast using Naïve Bayes Moving Average.


    Step 1.1. Take the last recorded value from the. database and use this to forecast
    the. next value.


    yT+h|T = yT


    Step 2. Forecast using Simple Moving Average.


    Step 2.1. Take the average of the last 5. recorded values from the database. and
    use this to forecast the next to. value.


    yT+h|T = (y=(y1+[]+yT)/T.


    Step 3. Forecast using Weighted Moving Average.


    Step 3.1. Take a weighted average of the last 5 recorded values from the database
    assigned a higher weight to the value in the recent past.


    M = \frac{\sum_{t=1}^{n} w_t * v_t}{\sum_{t=1}^{n} w_t}


    # EQUIPMENT DETAILS


    Of all the ideas and models that are surveyed for this research, we differ with
    the use of lung capacity sensors which is a significant part of our research.
    Instead of using a typical spirometer we have used a dynamo wherein we need to
