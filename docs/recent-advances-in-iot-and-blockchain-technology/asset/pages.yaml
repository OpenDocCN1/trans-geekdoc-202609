  md: 'prevents data from being exposed or sold. Thus, a blockchain is a secure ledger
    which can store data on an open network and protect data effectively [32].


    # A Deeper Dive into Blockchain Security


    One of the most developed blockchain implementation is bitcoin, which is a Crypto
    currency transaction management framework. Bitcoin Blockchain implements three
    different techniques to protect the network from security breaches. These three
    techniques are Hash Chained Storage, Digital Signature and commitment consensus.


    # Hash Chained Storage


    In this technique, the blockchain employs hash pointers which is the hash value
    of the data generated by cryptographic methods and it point to the address where
    the data is stored [28]. We can check if the data has been tampered as it will
    change the hash value of the pointer. This pointer can be publicly verified by
    any user. If there is an attempt to tamper with the data, the person has to change
    the values of all the previous blocks, but will have to stop at the first block
    as it is generated by the computer when the blockchain was created with some default
    data.


    This method is further optimized by using a Merkle Tree, which is a binary search
    tree that stores the hash value of a parent-children pair, if the data is tampered,
    then the hash value also changes for its parent node, which can be verified effectively.


    # Digital Signature


    It is a technique used to verify the validity of the data using cryptographic
    methods. The process of creating and validating a digital signature has three
    different parts:.


    +   1. Key Generation: It is an algorithm used to create a private and public
    key.

    +   2. Signing Algorithm: It creates a signature using the private key for verification
    later.

    +   3. Verification Algorithm: It takes a signature, a public key and a message
    as input and verifies the message’s signature with the given block signature using
    the public key [28].


    This allows a user to share their data with others in a secure manner. Bitcoin
    implements Elliptical Curve Digital Signature Algorithm (ECDSA) which provides
    128 bits security. Whenever there is a transaction between two people,'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'the sender sends a message to the receiver using their private key; the recipient
    verifies the message using the public key of the sender. This prevents false or
    forged transactions from taking place.


    Another example is the Rivest-Shamir-Adleman (RSA) algorithm. In this algorithm
    [33], the public key is generated using two very large prime numbers and finding
    the modulus of a combination of these numbers. The algorithm is discussed below:.


    +   1. Take 2 distinct prime number x and y ad find n = xy.

    +   2. Using Carmichael''s totient function, find value of λ(n) = lcm(p-1, q-1).

    +   3. Choose a value e between 1 and λ(n) which is coprime to λ(n).

    +   4. Compute the modular multiplicative inverse of d = e(mod λ(n)).

    +   5. The public key is (n, e), the encryption equation for message M is M^e
    mod(n).

    +   6. The private key is (n, d), the decryption equation for value C is C^d mod(n).


    # Consensus


    When a block is broadcasted to all the nodes, each node has the option to add
    the block to their copy of Ledger or to ignore it; this can create discrepancies
    as some of the blocks could be missing for some nodes. To prevent this, Blockchain
    implements a consensus algorithm which check what the majority of the nodes want
    to do with the block. The algorithm should guarantee that either the block is
    accepted or denied, even if it takes some considerable time [34].


    # Types of Algorithm


    # Proof of Work (POW)


    Algorithm is based on the concept of validating information or a block by performing
    a high computational work. This process is known as mining and the nodes that
    participate in this process are called miners. The miners compete against each
    other to complete the work and the miner who completes the work the fastest earns
    some blockchain currency [28, 29].


    A Framework which implements the Proof of Work algorithm is Bitcoin. Bitcoin uses
    SHA-256 cryptographic hash functions to calculate a hash value from the transaction
    value. This hash has a fixed length and is unique to the block. To make the computation
    harder, Bitcoin chooses a difficulty level or a target for each hash calculation
    and the miners have to add numbers to the string to get the hash value lower than
    the target. The lower the target, the more difficult the computation process.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'For example, let us take a string “Bitcoin for storage”, it generates a hash
    value a5498d7cbf82e9b88e382107a96a9cb10a4fc258ecd5f0d931d2a3b287063e34 which has
    a value 2^461.712. Now let us take the target as 2^460. Then the final string
    becomes “Bitcoin for storage0” which has a value 2^458.46241887. This calculation
    was very easy and only took a few tries, in reality, bitcoin assigns a lower target
    to increase the computation cost for smaller data. This ensures that the work
    done is uniform for all data sizes.


    Proof of work has some disadvantages.


    +   1. The algorithm requires very high computational power and time. It also
    has a very low probability of generating a successful proof of work. For a framework
    where very large amounts of data are to be added at a particular time, the nodes
    will take a long time to add the block to the chain.

    +   2. The proof of work scheme works on the basis of rewarding the miners. This
    incentive should be alluring enough to attract a lot of miners for proof of work
    to be viable.


    # Proof of Stake (POS)


    Works on the principle that a node can mine blocks proportional to the amount
    of currency it holds. Only those miners who have contributed some capital as stakes
    can participate in the validation process. The network keeps a track of all these
    miners and their deposits. To validate a block, the entire miners place a bet,
    the chances of winning the bet are proportional to their deposits. The miner who
    wins the bet gets to verify the block. If the block is verified and appended to
    the ledger, then all the validators that placed the bet get a reward proportional
    to their deposit, if the validation process fails and the transaction is found
    to be false, the validators are penalized and they lose some of their deposit.
    This compels the validators to make genuine transactions [28, 29].


    This algorithm has some advantages over POW algorithm. POS requires lower computation
    power as the miners don’t have to solve a mathematical puzzle. This in turn reduces
    the amount of resources required. To control the ledger, a miner has to hold more
    than 51% of the total deposits whereas in POW, the miner has to hold more than
    51% of the computational power which is easier. It has some disadvantages as well.
    Rich miners can dominate the chain very easily by depositing more than 51% of
    all deposits.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Byzantine Fault Tolerance (BFT)


    Is a condition where, due to some system failure, the consensus decision is not
    broadcasted to all the nodes properly so that they cannot take their decision
    properly [34]. These nodes, instead of providing a valid decision, provide a random
    value that makes these nodes look like they are functioning correctly. To solve
    this problem, all the nodes should be allowed to discuss if the value provided
    by a particular node X is true. If X is true, all the other nodes must agree on
    the value provided by X. otherwise, all the nodes must agree on a different value.
    This rules out all the nodes which do not provide a value, provide a false value
    by mistake or provide a false value deliberately to change the final decision
    on the block. For this protocol to be implemented there should be at most (n-1)/3
    number of malicious nodes in a network out of a total number of n nodes. An implementation
    of BFT is Redundant Byzantine Fault Tolerance.


    Redundant Byzantine Fault Tolerance (RBFT) [35] is an asynchronous model where
    multiple instances of BFT protocol run in parallel and each instance has a primary
    instance. All these instances order the execution of BFT protocol, but only a
    selected few known as master instance execute the request, the rest of the instances
    known as backup instances are used to find if the master instance is malicious
    or not. If a master instance fails to deliver a result or does not deliver the
    result in time compared to the backup instance, the primary instance of the master
    is considered malicious and a new primary instance is chosen. This ensures that
    the masters executing the requests are harmless. The backup nodes check for the
    correct output of master nodes by checking all the different instances and deciding
    if there is a need to change the protocol.


    # Some Problems with Blockchain


    +   1. Since most of the frameworks for security work on some form of computation
    or influence, a person with majority influence can easily control the data in
    the ledger. The 51% attack and Sybil attack are some of the most common attacks
    on a blockchain network [36].

    +   2. With the increase in the computational power of computers, it is becoming
    easier to solve the puzzles for consensus. We need to keep upgrading the algorithms
    to keep up with these upgrades.

    +   3. Most of the mining power in blockchain is concentrated with companies in
    China, this power needs to be distributed to attain full decentralization [29].'
