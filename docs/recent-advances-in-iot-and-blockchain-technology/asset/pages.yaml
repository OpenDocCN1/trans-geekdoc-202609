    Sharding is a concept which has already been implemented to improve the efficiency
    of databases and to improve the scalability and reliability of blockchain.


    # Sharding


    Sharding is breaking down the database into smaller manageable chunks called logical
    Shards or simply shards. These shards are stored onto different nodes of a P2P
    network. Each shard is completely distinct and independent of other shards, though
    is some cases replication of data maybe required (referenced tables) [7, 8]. Sharding
    improves the scalability of an application. It makes the database capable of holding
    more data and can handle more queries resulted due to traffic surge. We are storing
    data on a database that is on one server. But when the maximum limit of the server
    is reached, there is no way to expand the database as it is not possible to combine
    the computational powers of multiple computers for a single operation. Sharding
    would increase the capacity of the database, as there would be room for more datasets
    by storing the data on multiple nodes. For an application having larger database,
    running a query would be quite costly because searching every row would be time-consuming.
    However, by sharding a database into multiple databases, the query only goes through
    only fewer rows hence speeding up the query responses. Moreover, maintaining a
    network of smaller servers would be more cost-efficient than a larger server,
    at least in the longer run [7]. Suppose if there is a power outage, an unsharded
    database will not be functional and the entire application will be unavailable.
    With a sharded database, only some parts of the application won’t be available
    to users as other sharded databases continue to operate with no issue.


    Sharding mainly divides the database horizontally. For example, one shard might
    be responsible for storing only transactions on a particular day. In horizontal
    sharding (horizontal scaling), we do not have to pre-plan on how to cut databases.
    We can scale dynamically and efficiently by adding more machines. Sharding'
  merge: -1
  img_proc: true
