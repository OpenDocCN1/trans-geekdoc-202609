  md: '# IoT Based Verified and Public Vehicle Registration through BlockChain: Future
    Smart Cities based Applications with Sustainable Approach


    Rohit Rastogi1*, Bhuvneshwar Sharma1, Pardeep Kumar2 and Muskan Gupta1


    1 Department of CSE, ABES Engineering College, Ghaziabad, U.P. 201009, India

    2 Department of Computer Systems and Engineering, QUEST University, Nawabshah,
    Pakistan


    Abstract: Blockchain technology replaces centralized applications with distributed
    computing. Modern economy is estimated by the place of motor transport in the
    infrastructure of the national economy. An automobile registration system is a
    unified information system. This information system takes care of every information
    about automobile registration. It is administrated by a national registry entity
    and has access to other government and non-government services that handle automobile
    information. Cyber Physical System (CPS) is defined as the combination of computation
    and physical process. It is mainly used in the ICT section. It is also focused
    on resolving the problems related to authors of the data regarding transparency,
    media, and storage problems by technical handling.


    The presented chapter uses all the above concepts in one place and integrates
    them to build a useful application. The presented frame allows car manufacturers,
    owners, repairing companies, and insurance agencies to register and add new car
    entries through a simple method. In addition, database technology has been leveraged
    to cache intermediate data. It efficiently uses the Industrial IoT and 5G technologies.


    Many researchers have called for rules and applications to draw old maps based
    on distributed applications into the blockchain. New protocols are available in
    this work for the International Automated Vehicle Management System, called DriveLoop,
    which were proposed and developed.


    Keywords: DriveLoop, Blockchain, Peer to Peer (P2P), Hashing Algorithms, Car Registration,
    Overlay Network.'
