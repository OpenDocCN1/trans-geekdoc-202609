- pgno: 11
  md: '# PREFACE


    It is of immense pleasure to launch our book entitled Recent Advancements In Iot
    And Block chain that explores the idea of the Internet of Things and Blockchain
    Technology.


    Recent advancements in the fields of block chaining for enterprises, block chaining
    in financial services, block chaining in supply chain, IoT in healthcare, and
    other industries and technologies have resulted in the integration of block chaining
    and the Internet of Things (IoT). Blockchain, whether public or private, is capable
    enough to maintain the integrity of transactions by decentralizing the records
    among involved users. Many IoT companies are using blockchain technology to make
    the world a better-connected place. Many companies are exploring how to make this
    technology more and more efficient service provider for IoT. Blockchain and IoT
    are certainly revolutionary technologies that are changing the world around us.
    Therefore, the major focus of this book is to present the recent advancements
    in these two technologies and how these technologies, when merged together, provide
    a transparent, reliable, and secure model for data processing by intelligent devices
    in various domains.


    The book chapters have been contributed by scholars, researchers, academicians,
    and engineering practitioners. The book received plenteous abstract-articles that
    were subjected to rigorous review procedures to ensure that the selected articles
    met the required quality standards.


    We would extend our gratitude to everyone who has contributed directly or indirectly
    to the book. We express our sincere gratitude to all the authors and reviewers
    who ve been committed to shaping this book even after facing hardships due to
    the current pandemic situation. Our earnest thanks to the publisher Bentham Science
    for accepting our book proposal.


    # ACKNOWLEDGEMENTS


    Our gratitude belongs to all the co-authors without whom these pages would be
    blank. We would also like to thank all the referees for their useful suggestions.


