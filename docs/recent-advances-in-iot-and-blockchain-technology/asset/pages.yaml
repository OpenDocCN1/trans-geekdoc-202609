  md: '# Types of Version Control Systems


    A version control system may also be of various types:..


    # Local Version Control System (LVCS)


    Does not have any generalized repository but all the files are maintained by the
    user on his own separate repository or database. It contains all versions or varieties
    of files known as patch sets in a special format.


    # Centralized Version Control System (CVCS)


    These contain a single central repository and each user works on their own copy
    of this repository. All changes are committed onto this repository and can be
    updated by other users on the network. These are easier to understand and work
    with. Examples of CVCS include Perforce, CVS and Subversion.


    # Distributed Version Control System (DVCS)


    These contain multiple repositories with each user having their own repository
    called the local repository. Committing changes will only update the local repository
    and must be pushed to be visible on the central one. All changes must be pulled
    onto the local repository. DVCS enables offline working as changes are only made
    locally. Examples of DVCS include Git, Mercurial, Veracity and Bazaar.


    One thing we can understand here is that along with blockchain the version control
    system used will obviously be a distributed one. Having similar characteristics
    allows blockchain to be implemented along with it. Most DVCS employ cryptographic
    hashing to secure data. Git uses the SHA-1 hashing algorithm producing digests
    160 bits in length and uses hashes for the contents of the file when a commit
    is made to the repository to ensure integrity of data at any point of time. It
    also uses hashes as database keys to find data as well as helps in DE duplication
    of data by comparing hashes of different files. So, files having same hashes are
    redundant and not stored again, thereby saving space. Therefore, it is essential
    to choose a good hashing function, one that does not generate the same hash for
    different data known as collision and the SHA-1 function has never generated a
    collision.


