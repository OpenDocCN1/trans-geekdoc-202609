  img_proc: true
- pgno: 37
  md: '# Content Linking


    Data on the IPFS system is stored in an object which can store up to 256kb of
    data. For bigger files, they are simply broken down into multiple objects and
    all of them are linked together using IPLD or interplanetary linked data. IPLD
    is a standard based on the Merkle DAG which is a decentralized data structure
    and links all the objects to the base CID. IPLD is a set of tools for creating
    links between content-addressed data including IPFS files, commits made in VCS
    or blocks on any Blockchain. It also permits data access irrespective of the protocol,
    so internet protocols don’t act as barriers for IPLD to function allowing cross-protocol
    operation of data. Each object consists of:


    +   - Data – unorganized binary data having max capacity of 256kb.

    +   - Links – structures linking all similar objects together. This further consists
    of:.

    +     - Name of link.

    +     - Hash of the linked object.

    +     - Total size of all linked objects.


    IPLD is protocol-independent, cross-format, easily upgradable and links all data
    together which brings out the true meaning of decentralization. As each object
    contains its own hash, it makes the data immutable similar to blockchain. The
    data can also be changed by versioning same as in the case of blockchain. However,
    changing data means a change in CID disabling users from accessing data using
    that CID. This means that the users will need a new CID each time some update
    or improvement is made making the link immutable. To overcome this problem, IPFS
    implements Interplanetary Naming System (IPNS), a universal namespace, which simply
    causes the old CID point to the new one by linking the new CID to the fixed IPNS
    link. Now, even if the users only know the old CID, they can still access it.
    Another problem solved by IPNS is making the link understandable by humans and
    easy to remember the same way DNS does in location-addressing by mapping IP addresses
    to a domain name. So you can search for the data either with its IP address or
    with its domain name. Main difference between the two is IPNS uses public hash
    key while DNS uses domain names although both have the same structure [19, 21].


    # Content Accessibility


    The data, being stored in organized objects, is structured making it capable of
    being interpreted by machines. Each object is encoded in triples and these entities
    are unified through relationships expressed via these triples using semantic web
    technologies like Linked Data. These basic units called triples are simply'
