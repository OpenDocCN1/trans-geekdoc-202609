- pgno: 48
  md: 'we have to re-encrypt the public keys since they are based on the attributes
    of all users [30].


    An example of ABE is Cipher text-policy attribute-based encryption (CP-ABE). It
    is a superior to traditional ABE because it allows the user to encrypt the data
    without exactly knowing the individual accessing the block. This results in the
    data being accessible publicly but only being decrypted by legitimate users.


    Another proposed technique is the blockchain-based distributed attribute-based
    encryption (BDABE) [31]. In this technique, an access authority decides which
    of the attributes are to be assigned to a particular user, the users can them
    combine multiple attributes from multiple access authorities for decryption of
    cipher-texts.


    A BDABE model has 5 different entities:


    +   1. Distributed Blockchain: A blockchain is used to store the data which can
    be accessed by the keys.

    +   2. Attribute authority: An AU is responsible of assigning attributes to users
    based on their particular domain.

    +   3. Root Authority: A RA is responsible for creating the secret keys using
    attributes of Attribute authorities.

    +   4. Data Reader: it is a user who intends to access the encrypted data in the
    blockchain.

    +   5. Data Owner: It is a user who owns data to be uploaded and shared.


    The AU plays the most important role because they get to decide all the attributes
    of each node, each AU is responsible for a group of nodes called a domain. An
    AU can assign an attribute to a node outside its domain also. The RA''s are responsible
    for creating the secret keys of AU and RA''s need to be fully trusted by the system.


    # BLOCKCHAIN - SECURITY


    To describe the overview of security in blockchain, we describe the basic blockchain
    architecture. A block of a blockchain contains three important parts, first, it
    contains the information or data to be stored, second, the hash value of the entire
    block, and third, the hash value of the previous block [28]. So, to tamper a block
    we have to tamper all the blocks that come before. This process requires very
    high computational power and a lot of time. Blockchain also implements a consensus
    procedure to ensure the legitimacy of the data being added to the network. This
    guarantees the integrity of the data. Blockchain is also based on a peer-to-peer
    network, so no third party is involved while storing your data, which'
