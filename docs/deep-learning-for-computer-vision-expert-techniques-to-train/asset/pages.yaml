- pgno: 227
  md: '# Generative Models


    # Chapter 8


    Creating new characters with different attributes could revolutionize the animation
    industry.


    # 3D models from photos


    We can create 3D models from 2D images by using generative models, as shown by
    Wu et al. (https://arxiv.org/pdf/1610.07584.pdf):


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_227_0.png)


    Reproduced from Wu et al.


    Creating 3D models from images is useful for robotics, augmented reality and in
    animation industries. We will learn the algorithms behind them in the following
    sections. In the next section, we will implement neural artistic style transfer.


    # Neural artistic style transfer


    The first application we will implement the **neural artistic style transfer**.
    Here, we will transfer the style of **Van Gogh** art onto an image. An image can
    be considered as a combination of style and content. The artistic style transfer
    technique transforms an image to look like a painting with a specific style. We
    will see how to code this idea up. The `loss` function will compare the generated
    image with the content of the photo and style of the painting. Hence, the optimization
    is carried out for the image pixel, rather than for the weights of the network.
    Two values are calculated by comparing the content of the photo with the generated
    image followed by the style of the painting and the generated image.


    [ 213 ]'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Content loss


    Pixels are not a good choice, we will use the CNN features of various layers,
    as they are a better representation of the content. The initial layers as seen
    in Chapter 3, Image Retrieval, have high-frequency such as edges, corners, and
    textures as the later layers represent objects, and hence are better for content.
    The latter layer can compare the object better than the pixel. But for this, we
    need to first import the required libraries, using the following code:


    ```

    import numpy as np

    from PIL import Image

    from scipy.optimize import fmin_l_bfgs_b

    from scipy.misc import imsave

    from vgg16_avg import VGG16_Avg

    from keras import metrics

    from keras.models import Model

    from keras import import backend as K

    ```


    Now, let''s load the required image, using the following command:

    content_image = Image.open(work_dir + ''bird_orig.png'')


    We will use the following image for this instance:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Generative Models\n\n# Chapter 8\n\nAs we are using the VGG architecture\
    \ for extracting the features, the mean of all the ImageNet has to be subtracted\
    \ from all the images, as shown in the following code:\n\n```\nimagenet_mean =\
    \ np.array([123.68, 116.779, 103.939], dtype=np.float32)\n```\n\n```\ndef subtract_imagenet_mean(image):\n\
    \    return (image - imagenet_mean) [:, :, :-1])\n```\n\nNote that the channels\
    \ are different. The preprocess function takes the generated image and subtracts\
    \ the mean and reverses the channel. The preprocess function reverses that effect\
    \ because of the preprocessing step, as shown in the following code:\n\n```\n\
    def add_imagenet_mean(image, s):\n    return np.clip(image.reshape(s) [:, :, :-1]\
    \ + imagenet_mean, 0, 255)\n```\n\nFirst, we will see how to create an image with\
    \ the content from another image. This is a process of creating an image from\
    \ random noise. The content used here is the sum of the activation in noise. We\
    \ minimize the loss of the content between the random and noise, which is termed\
    \ the content loss. This loss is similar to pixel-wise loss but applied on random\
    \ activations, will capture the content leaving out the noise. Any CNN architecture\
    \ can be used to do forward inference of content image and random noise. The activations\
    \ are taken and the mean squared error is calculated, comparing the activations\
    \ of these two outputs.\n\nThe pixel of the random image is updated while the\
    \ CNN weights are frozen. We will freeze the VGG network for this case. Now, the\
    \ VGG model can be loaded. Generative images are very sensitive to sampling techniques\
    \ such as max pooling. Getting back the pixel values from max pooling is not possible.\
    \ average pooling is a smoother method than max pooling. The function to convert\
    \ VGG model with average pooling is used for loading the model, as shown here:\n\
    \n```\nvgg_model = VGG16_Avg(input_top=False)\n```\n\nNote that the weights are\
    \ the same for this as the original, even though the pooling type has been changed.\
    \ The ResNet and Inception models are not suited for this because of their inability\
    \ to provide various abstractions. We will take the activations from the last\
    \ convolutional layer of the VGG model named block_conv1, while the model was\
    \ frozen. This is the last layer from the VGG, with a wide receptive field. The\
    \ code for the same is given here for your reference:\n\n```\ncontent_layer =\
    \ vgg_model.get_layer('block5_conv1').output\n```\n\n[ 215 ]"
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Generative Models\n\nNow, a new model is created with a truncated VGG, the\
    \ layer that was giving good features. Hence, the image can be loaded now and\
    \ can be used to carry out the forward inference, to get the actually activated\
    \ layers. A TensorFlow variable is created to capture the activation, using the\
    \ following code:\n\n```\ncontent_model = Model (vgg_model.input, content_layer)\n\
    content_image_array =\nubtract_imagenet_mean(np.expand_dims(np.array(content_image),\
    \ 0))\ncontent_image_shape = content_image_array.shape\ntarget = K.variable(content_model.predict(content_image_array))\n\
    ```\n\nLet's define an evaluator to compare the loss and gradients of the image.\
    \ The following class returns the loss and gradient values at any point of the\
    \ iteration:\n\n```\nclass ConvexOptimiser(object):\n    def __init__(self, cost_function,\
    \ tensor_shape):\n        self.cost_function = cost_function\n        self.tensor_shape\
    \ = tensor_shape\n        self.gradient_values = None\n\n    def loss(self, point):\n\
    \        loss_value, self.gradient_values =\n        self.cost_function([point.reshape(self.tensor_shape)])\n\
    \        return loss_value.astype(np.float64)\n\n    def gradients(self, point):\n\
    \        return self.gradient_values.flatten().astype(np.float64)\n```\n\nLoss\
    \ function can be defined as the mean squared error between the values of activations\
    \ at specific convolutional layers. The loss will be computed between the layers\
    \ of generated image and the original content photo, as shown here:\n\n```\nmse_loss\
    \ = metrics.mean_squared_error(content_layer, target)\n```\n\nThe gradients of\
    \ the loss can be computed by considering the input of the model, as shown as:\n\
    \n```\ngrads = K.gradients(mse_loss, vgg_model.input)\n```\n\nThe input to the\
    \ function is the input of the model and the output will be the array of gradient\
    \ values values as follows:\n\n```\ncost_function = K.function([vgg_model.input],\
    \ {mse_loss]+grads)\n```\n\nThis function is deterministic to optimize, and hence\
    \ SGD is not required:\n\n```\noptimiser = ConvexOptimiser(cost_function, content_image_shape)\n\
    ```\n\n[ 216 ]"
  merge: -1
  img_proc: true
- pgno: 231
  md: "This function can be optimized using a simple optimizer, as it is convex and\
    \ hence deterministic. We can also save the image at every step of the iteration.\
    \ We will define it in such a way that the gradients are accessible, as we are\
    \ using the scikit-learn's optimizer, for the final optimization. Note that this\
    \ loss function is convex and so, a simple optimizer is good enough for the computation.\
    \ The optimizer can be defined using the following code:\n\n```\ndef optimise(optimiser,\
    \ iterations, point, tensor_shape, file_name):\n    for i in range(iterations):\n\
    \        point, min_val, info = fmin_l_bfgs_b(optimiser.loss,\n        point.flatten())\n\
    \        fprime=optimiser.gradients, maxfun=20)\n        point = np.clip(point,\
    \ -127, 127)\n        print('Loss:', min_val)\n        imsave(work_dir + '_gen_'+file_name+'_{i}.png',\n\
    \        add_imagenet_mean(point.copy()), tensor_shape)[0])\n    return point\n\
    ```\n\nThe optimizer takes loss function, point, and gradients, and returns the\
    \ updates. A random image needs to be generated so that the content loss will\
