- pgno: 72
  md: '# The bigger deep learning models


    We will go through several model definitions that have achieved state-of-the-art
    results in the ImageNet competitions. We will look at them individually on the
    following topics.


    # The AlexNet model


    AlexNet is the first publication that showed a wide interest in deep learning
    for computer vision. Krizhevsky et al. (https://papers.nips.cc/paper/4824-imagenet-deep-convolutional-neural-networks.pdf)
    proposed AlexNet and it has been a pioneer and influential in this field. This
    model won the ImageNet 2013 challenge. The error rate was 15.4%, which was significantly
    better than the next. The model was relatively simple architecture with five convolution
    layers. The challenge was to classify 1,000 categories of objects. The image and
    data had 15 million annotated images with over 22,000 categories. Out of them,
    only 1,000 categories are used for the competition. AlexNet used ReLU as the activation
    function and found it training several times faster than other functions. The
    architecture of the model is shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_72_0.png)


    Reproduced with permission from Krizhevsky et al.


    The paper also used data augmentation techniques such as image translations, horizontal
    flips, and random cropping. The dropout layer prevents overfitting. The Stochastic
    Gradient Descent (SGD) for training. The parameters of SGD are carefully tuned.
    The learning rate changes over a fixed set of training iterations. The momentum
    and weight decay take fixed values for training. There is a concept Local Response
    Normalization (LRN) introduced in this paper. The LRN layers normalize every pixel
    across the filters to avoid huge activation in a particular filter.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# The VGG-16 model


    This layer is not used anymore as recent research suggests that there is not much
    improvement because of LRN. AlexNet has 60 million parameters in total.


    The VGG model stands for the Visual Geometry Group from Oxford. The model was
    very simple and had a greater depth than AlexNet. The paper had two models with
    16 and 19 layers depth. All the CNN layers were using 3 by 3 filters with stride
    and a pad of size 1 and a max pooling size of 2. This resulted in a decrease in
    the number of parameters. Though the size is decreasing because of max pooling,
    the number of filters increasing with layers. The architecture of the 16-layer
    deep model is as follows:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_73_0.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: "This model has 138 million parameters and is the largest of all the models\
    \ described here. But the uniformity of parameters is quite good. The characteristic\
    \ is such that, as deep as the network gets, the smaller the image is with an\
    \ increased number of filters. One of the data augmentation techniques used was\
    \ size jitter. Size jitter is an augmentation technique where a side with random\
    \ size is considered to vary the scales.\n\n# The Google Inception-V3 model\n\n\
    Inception-V3 was proposed by Szegedy et al. (https://arxiv.org/pdf/1409.4842.pdf)\
    \ and introduced the concept of inception that has a better way of generalization.\
    \ This was the architecture that won the ImageNet competition in 2014. It is geared\
    \ towards efficiency for speed and size. It has 12 times less parameters than\
    \ AlexNet. Inception is the microarchitecture on which a macro-architecture is\
    \ built. Each hidden layer has a higher-level representation of the image. At\
    \ each layer, we have an option of using pooling or other layers. Instead of using\
    \ one type of kernel, inception uses several kernels. An average pooling is followed\
    \ by various size convolutions and then they are concatenated.\n\nThe kernel parameters\
    \ can be learned based on the data. ... wait, re-reading text... \nThe kernel\
    \ parameters can be learned based on the data. Using several kernels, the model\
    \ can detect small features as well as higher abstractions. The 1 x 1 convolution\
    \ will reduce the feature and, hence, computations. This takes less RAM during\
    \ inference. The following is the inception module in its simplest form where\
    \ there are options of convolutions with various kernel sizes and pooling:\n\n\
    ![](img/48c861eac4dc634fbf2a09fdbe884beb_74_0.png)"
  merge: -1
  img_proc: true
