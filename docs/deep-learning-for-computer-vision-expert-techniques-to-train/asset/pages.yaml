- pgno: 171
  md: '# # Similarity Learning


    In this chapter, we will learn about similarity learning and learn various loss
    functions used in similarity learning. Similarity us useful when the dataset is
    small per class. We will understand different datasets available for face analysis
    and build a model for face recognition, landmark detection. We will cover the
    following topics in this chapter:


    +   - Different algorithms for similarity learning

    - Various loss functions used for similarity learning

    - A variety of scenarios in which such models are used

    - The complete process of face recognition


    # # Algorithms for similarity learning


    **Similarity learning** is the process of training a metric to compute the similarity
    between two entities. This could also be termed as metric learning, as the similarity
    is learned. A metric could be Euclidean or cosine or some other custom distance
    function. Entities could be any data such as an image, video, text or tables.
    To compute a metric, a vector representation of the image is required. This representation
    can be the features computed by a CNN as described in Chapter 3, Image Retrieval.
    The CNN that was learned for object classification could be used as the vector
    to compute the metric. The feature vector obtained for image classification would
    not be the best representation of the task at hand. In similarity learning, we
    find out CNNs that generate features trained for a similarity learning task. Some
    applications of similarity learning are given here:


    +   - Face verification for biometrics to compare two faces

    - Visual search of real-world objects to find similar products online

    - Visual recommendation of products that are similar in some attributes'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'In this chapter, we will learn about face verification in detail. So let''s
    start with the algorithms that are available for similarity learning.


    # Siamese networks


    A Siamese network, as the name suggests, is a neural model where the network is
    trained to distinguish between two inputs. A Siamese network can train a CNN to
    produced an embedding by two encoders. Each encoder is fed with the images in
    either a positive or a negative pair. A Siamese network requires less data than
    the deep learning algorithms. Siamese networks were originally introduced for
    comparing signatures. A Siamese network is shown in the following image; the weights
    are shared between the networks:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_172_0.png)


    The other use of Siamese networks is one-shot learning. **One-shot learning**
    is the technique of learning with just one example. In this case, an image can
    be shown and it can tell whether they are similar. For most of the similarity
    tasks, a pair of positive and negative pairs are required to train. These datasets
    can be formed with any dataset that is available for classification tasks, assuming
    that they are Euclidean distances. The main difference between these algorithms
    and algorithms in previous chapters is that the encoders differ from one from
    another.


    # Contrastive loss


    Contrastive loss differentiates by similarity. The feature or latent layer is
    compared using a similarity metric and trained with the target for a similarity
    score. In the case of a positive pair, the target would be 0, as both inputs are
    the same. For negative pairs, the distance between the pair of latent is a maximum
    of 0 in the case of cosine distance or regularised Euclidean distance. The loss
    can be defined by a `contrastive_loss`, which is explained in the following code:'
  merge: -1
  img_proc: true
