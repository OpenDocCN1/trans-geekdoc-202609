- pgno: 239
  md: '# Generative Models


    # Chapter 8


    We will now conclude the style transfer section. This operation is relatively
    slow but can work with any images. In the next section, we will see how to use
    a similar idea to create a super-resolution network. There are several ways to
    make this better, such as:


    +   - Adding a Gaussian filter to a random image

    - Adding different weights to the layers

    - Different layers and weights can be used to content

    - Initialization of image weights rather than random image

    - Color can be preserved

    - Masks can be used for specifying what is required

    - Any sketch can be converted to painting

    - Drawing a sketch and creating the image


    Any image can be converted to artistic style by training a CNN to output such
    an image.


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_239_0.png)


    # Generative Adversarial Networks


    Generative Adversarial Networks (GAN) were invented by Ian Goodfellow, in 2014.
    It is an unsupervised algorithm where two neural networks are trained as a discriminator
    and a generator, simultaneously. The technique can generate an image from random
    noise and a discriminator can evaluate whether is an original image. After further
    training, the generator network can generate photo-realistic images. The generator
    network is typically a deconvolutional neural network and the discriminator is
    a convolution neural network.


    An excellent analogy to understand this is to think of the generator as someone
    who prints fake money and the discriminator as a police officer who determines
    whether the money is fake or not. The generator keeps improving the quality of
    the fake money based on the feedback from the police till the police can''t differentiate
    between the original and fake money. Now, let''s start with the implementation.


    [ 225 ]'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Vanilla GAN\n\nThe original GAN is called a vanilla GAN. Before we construct\
    \ the model, let's define a few layers that will be useful for the rest of the\
    \ chapter. The following is the convolutional_layers with leaky activations and\
    \ regularization added:\n\n```\ndef convolution_layer(input_layer,\n    filters,\n\
    \    kernel_size=[4, 4],\n    activation=tf.nn.leaky_relu):\n    layer = tf.layers.conv2d(\n\
    \        inputs=input_layer,\n        filters=filters,\n        kernel_size=kernel_size,\n\
    \        activation=activation,\n        kernel_regularizer=tf.nn.l2_loss,\n \
    \       bias_regularizer=None\n    )\n    add_variable_summary(layer, 'convolution')\n\
    \    return layer\n```\n\nNext, we will define a transpose_convolution_layer that\
    \ is the opposite of a convolution_layer with regularization, using the following\
    \ code:\n\n```\ndef transpose_convolution_layer(input_layer,\n    filters,\n \
    \   kernel_size=[4, 4],\n    activation=tf.nn.relu,\n    strides=2):\n    layer\
    \ = tf.layers.conv2d_transpose(\n        inputs=input_layer,\n        filters=filters,\n\
    \        kernel_size=kernel_size,\n        activation=activation,\n        strides=strides,\n\
    \        kernel_regularizer=tf.nn.l2_loss,\n        bias_regularizer=None\n  \
    \  )\n    add_variable_summary(layer, 'convolution')\n    return layer\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "Next, we will define a dense layer with non-linear activations, using the following\
    \ code:\n\n```\ndef dense_layer(input_layer,\n    units,\n    activation=tf.nn.relu):\n\
    \    layer = tf.layers.dense(\n        inputs=input_layer,\n        units=units,\n\
    \        activation=activation\n    )\n    add_variable_summary(layer, 'dense')\n\
    \    return layer\n```\n\nNow, we will define a generator that takes noise as\
    \ an input and changes into an image. The generator consists of a couple fully\
    \ connected layers followed by transpose convolution layers to upsample the noise.\
    \ Finally, a convolution layer is presented to make the noise as a single channel.\
    \ There are batch normalization layers between every layer for gradients to flow\
    \ smoothly. We will use the following code to define the generator:\n\n```\ndef\
    \ get_generator(input_noise, is_training=True):\n    generator = dense_layer(input_noise,\
    \ 1024)\n    generator = tf.layers.batch_normalization(generator,\n        training=is_training)\n\
    \    generator = dense_layer(generator, 7 * 7 * 256)\n    generator = tf.layers.batch_normalization(generator,\n\
    \        training=is_training)\n    generator = tf.reshape(generator, [-1, 7,\
    \ 7, 256])\n    generator = transpose_convolution_layer(generator)\n    generator\
    \ = tf.layers.batch_normalization(generator,\n        training=is_training)\n\
    \    generator = transpose_convolution_layer(generator)\n    generator = tf.layers.batch_normalization(generator,\n\
    \        training=is_training)\n    generator = convolution_layer(generator, 3)\n\
    \    generator = convolution_layer(generator, 1, activation=tf.nn.tanh)\n    return\
    \ generator\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Generative Models\n\n# Chapter 8\n\nWe will now define the discriminator\
    \ part of the GAN that takes images and tries to distinguish fake from real images.\
    \ The discriminator is a regular convolutional net with a few convolutional_layers\
    \ followed by dense layers. Batch normalization layers are present in the layers.\
    \ We will use the following code to define the discriminator:\n\n```\ndef get_discriminator(image,\
    \ is_training=True):\n    x_input_reshape = tf.reshape(image, [-1, 28, 28, 1],\n\
    \                                name='input_reshape')\n    discriminator = convolution_layer(x_input_reshape,\
    \ 64)\n    discriminator = convolution_layer(discriminator, 128)\n    discriminator\
    \ = tf.layers.flatten(discriminator)\n    discriminator = dense_layer(discriminator,\
    \ 1024)\n    discriminator = tf.layers.batch_normalization(discriminator,\n  \
    \                              training=is_training)\n    discriminator = dense_layer(discriminator,\
    \ 2)\n    return discriminator\n```\n\nAfter the discriminator is created, we\
    \ will create a noise vector that will be the input to the generator, using the\
    \ following code:\n\n```\ninput_noise = tf.random_normal([batch_size, input_dimension])\n\
    ```\n\nThe GAN model can be created with the tf.contrib.gan module in TensorFlow.\
    \ It takes the generator and discriminator methods along with their corresponding\
    \ inputs, as shown here:\n\n```\ngan = tf.contrib.gan.gan_model(\n    get_generator,\n\
    \    get_discriminator,\n    real_images,\n    input_noise)\n```\n\nNow, the training\
    \ can be started with the gan_train method that takes the gan_train_ops method\
    \ with optimizers for the generator and discriminator, using the following code:\n\
    \n```\ntf.contrib.gan.gan_train(\n    tf.contrib.gan.gan_train_ops(\n        gan,\n\
    \        tf.contrib.gan.gan_loss(gan),\n        tf.train.AdamOptimizer(0.001),\n\
    \        tf.train.AdamOptimizer(0.0001)))\n```\n\n[ 228 ]"
  merge: -1
  img_proc: true
- pgno: 243
  md: 'By running this, a GAN model is created that can output images from random
    vectors. The generated images are unconstrained and can be from any label. In
    the next section, we will use a conditional GAN to produce the output we want.


    # Conditional GAN


    A conditional GAN generates images with a label that we want. For example, we
    can ask the model to produce the digit 8 and the model will produce an 8. To enable
    this, the labels are required along noise to train the model, as shown here:


    ```

    gan = tf.contrib.gan.gan_model(

    get_generator,

    get_discriminator,

    real_images,

    (input_noise, labels))

    ```


    The rest of the training is similar to that of the vanilla GAN. Next, we will
    use a GAN for compressing the images.


    # Adversarial loss


    An adversarial loss is a loss from the generator. This loss can be combined with
    a pixel-wise loss between the fake and real images to form a combined adversarial
    loss. The GAN model is to be supplied with real_images, to both the generator
    and discriminator, as shown here:


    ```

    gan = tf.contrib.gan.gan_model(

    get_autoencoder,

    get_discriminator,

    real_images,

    real_images)

    ```


    The generator is an autoencoder. The implementation can be found in Chapter 3,
    Image Retrieval. After this, we will define the losses, using the following code:


    ```

    loss = tf.contrib.gan.gan_loss(

    gan, gradient_penalty(norm=1.0)

    l1_pixel_loss = tf.norm(gan.real_data - gan.generated_data, ord=1)

    loss = tf.contrib.gan.losses.combine_adversarial_loss(

    loss, gan, l1_pixel_loss, weight_factor=1)

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The gradient of the GAN loss is penalized. Then, the pixel-wise loss is computed
    and added to the penalized loss. Training this model creates a powerful autoencoder,
    that can be used for image compression.


    # Image translation


    An image can be translated to another image, as we have already learned in the
    application''s section. The input images are given to the discriminator, whereas
    the target images are given to the generator while creating the GAN model as here:


    ```

    gan = tf.contrib.gan.gan_model(

    get_generator,

    get_discriminator,

    real_images,

    input_images)

    ```


    The least square loss is used for training, in addition to the pixel-wise loss
    to train the model. It can be calculated using the following code:


    ```

    loss = tf.contrib.gan.gan_loss(

    gan,

    tf.contrib.gan.losses.least_squares_generator_loss,

    tf.contrib.gan.losses.least_squares_discriminator_loss)

    ```


    ```

    l1_loss = tf.norm(gan.real_data - gan.generated_data, ord=1)

    gan_loss = tf.contrib.gan.losses.combine_adversarial_loss(

    loss, gan, l1_loss, weight_factor=1)

    ```


    Using this technique, an image can be translated to another image.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# InfoGAN


    InfoGAN can generate images of the required label without any explicit supervised
    training. The infogan_model takes unstructured and structured input, as shown
    in the following code:


    ```

    info_gan = tf.contrib.gan.infogan_model(

    get_generator,

    get_discriminator,

    real_images,

    unstructured_input,

    structured_input(

    loss = tf.contrib.gan.gan_loss(

    info_gan,

    gradient_penalty_weight=1,

    gradient_penalty_epsilon=1e-10,

    mutual_information_penalty_weight=1)

    ```


    The loss is defined with a penalty as the training is unstable. Adding the penalty
    provides more stability during the training.


    # Drawbacks of GAN


    The GAN generated images have some drawbacks such as counting, perspective, and
    global structures. This is currently being extensively researched to improve the
    models.


    # Visual dialogue model


    The visual dialogue model (VDM) enables chats based on images. VDM applies technologies
    from computer vision, Natural Language Processing (NLP) and chatbots. has found
    many applications such as explaining to blind people about images, to doctors
    about medical scans, virtual companions and so on. Next, we will see the algorithm
    to solve this challenge.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Algorithm for VDM


    The algorithm discussed here is proposed by Lu et al (https://research.fb.com/wp-content/uploads/2017/11/camera_ready_nips2017.pdf).
    Lu et al proposed a GAN-based VDM. The generator generates answers and the discriminator
    counts those answers. The following is a schematic representation of the process:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_246_0.png)


    The history of chat, the current question and image are fed as an input to the
    generator. Next, we will see how the generator works.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Generator


    The generator has an encoder and decoder. The encoder takes an image, question,
    and history as inputs. The encoder first attends to the history from LSTM and
    attends to the output from the image. The flow is shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_247_0.png)


    > Reproduced from Lu et al.


    The entire history is available and LSTM attends to the history of the chat. The
    output is attended by the image producing the embedding. The embedding generated
    by the encoder is used by the decoder to create an answer. The decoder is made
    of RNN. The encoder and decoder together form the generator producing the possible
    answers. Next, we will see how the discriminator works.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Discriminator


    The discriminator takes the generated sequences from the generator and ranks them.
    The ranking is done with the embedding learned with an n-pair loss. The n-pair
    loss is similar to triplet loss except that several pairs of positive and negatives
    are used for comparison. We are some of the results produced by the model.


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_248_0.png)


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_248_1.png)


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_248_2.png)


    Q: Is it a home or restaurant?

    A: I think restaurant.

    G-MLE: No, tell.

    Ours (x1): It looks like a restaurant.

    Ours (x2): I can''t tell it because it is too close.


    Q: Can you see his face?

    A: I am not sure.

    G-MLE: No.

    Ours (x1): I can only see the back of his body.

    Ours (x2): No.

    Ours (x3): He''s too far away.


    Q: How old does the man seem to be?

    A: 20s.

    G-MLE: Late teens.

    Ours (x1): On his 20s.

    Ours (x2): In his twenties.

    Ours (x3): Mid 20s.


    Q: Can you see broccoli?

    A: Yes, 3 larger pieces and small.

    G-MLE: No, just the broccoli.

    Ours (x1): I can see broccoli, slightly buried.

    Ours (x2): Yes, there is broccoli.

    Ours (x3): Yes, broccoli is green.


    Reproduced from Lu et al.


    The results are reasonable and better than the results produced by a simple discriminator.


    # Summary


    In this chapter, we have learned about generative models and the vast number of
    applications. We implemented them to transfer style from one to another while
    preserving the content. We saw the intuition behind GAN and trained models to
    do the same. In the end, we learned about the visual dialogue system.


    In the next chapter, we will learn about deep learning methods for video analysis.
    We will see how to access video content through cameras, files, and so on. We
    will implement video classification by applying classification on a frame level
    and on the video as a whole. Later, we will see how to track objects in a video.'
