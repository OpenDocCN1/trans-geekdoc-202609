    x_test = x_test.astype(''float32'')

    x_test -= mean

    x_test /= std


    y_test_pred = unet.predict(x_test, verbose=1)


    for image, image_id in zip(y_test_pred, y_test_mask):

    image = (image[:, :, :, 0] * 255).astype(np.uint8)

