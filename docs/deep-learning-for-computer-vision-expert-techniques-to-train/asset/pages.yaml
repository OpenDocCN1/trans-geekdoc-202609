  md: "# Image Classification\n\nThe summaries will be written to a folder that is\
    \ interpretable to TensorFlow. Let's define a\n to write the summaries so that\
    \ TensorFlow can be used to visualize them:\n\n```\ndef add_variable_summary(tf_variable,\
    \ summary_name):\n    with tf.name_scope(summary_name + '_summary_name'):\n  \
    \      mean = tf.reduce_mean(tf_variable)\n        tf.summary.scalar('Mean', mean)\n\
    \        with tf.name_scope('standard_deviation'):\n            standard_deviation\
    \ = tf.sqrt(tf.reduce_mean(\n                tf.square(tf_variable - mean)))\n\
    \        tf.summary.scalar('StandardDeviation', standard_deviation)\n        tf.summary.scalar('Maximum',\
    \ tf.reduce_max(tf_variable))\n        tf.summary.scalar('Minimum', tf.reduce_min(tf_variable))\n\
    \        tf.summary.histogram('Histogram', tf_variable)\n```\n\nThe variable function\
    \ writes the summaries for several variables. There are five statistics\nadded\
    \ to the summaries: mean, standard deviation, maximum, minimum and histogram.\n\
    Summaries can be either a scalar or a histogram. We will see how these values\
    \ are\nvisualized in TensorFlow when logged for several variables. Unlike the\
    \ previous model,\nwill resize the MNIST data into a square and use it like a\
    \ two-dimensional image.\nThe following is to reshape the image into 28 image\
    \ pixels by 28 image pixels:\n\n```\nx_input_reshape = tf.reshape(x_input, [-1,\
    \ 28, 28, 1],\nname='input_reshape')\n```\n\nThe dimension -1 denotes that the\
