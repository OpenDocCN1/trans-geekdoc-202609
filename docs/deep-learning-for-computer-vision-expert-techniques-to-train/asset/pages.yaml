- pgno: 53
  md: '# Loading the MNIST data


    Load the MNIST data directly from TensorFlow. Note that we specify one hot encoding
    as an argument while loading the data. The label is stored as integers but should
    be loaded as one-hot encoding in-order to train. It is assumed that the reader
    is running the code from an editor with TensorFlow tf from this point onward.
    The following is the code snippet to load MNIST_data:


    ```

    from tensorflow.examples.tutorials.mnist import input_data

    mnist_data = input_data.read_data_sets(''MNIST_data'', one_hot=True)

    ```


    For the first run, the data will be downloaded and may take some time. From the
    second run, the cached data will be utilized. In the next section, we will build
    a perceptron to classify the digits.


    # Building a perceptron


    A perceptron is a single-layer neural network. The concepts covered in this chapter,
    such as a fully connected layer, activation function, Stochastic Gradient Descent,
    logits, one hot encoding, softmax, and cross-entropy will be useful. You will
    learn how to define these components of neural networks in TensorFlow and use
    the network to train the MNIST data.


    # Defining placeholders for input data and targets


    A placeholder is a tensor where the data is passed. Placeholders are not specific
    values but will receive input during computation. The input size of the perceptron,
    number of classes, batch size, and the total number of iterations or batches are
    first declared. x_input is the input where the images will be fed later. y_input
    is the placeholder where the one-shot labels or targets will be supplied as follows:


    ```

    input_size = 784

    no_classes = 10

    batch_size = 100

    total_batches = 200

    ```


    ```

    x_input = tf.placeholder(tf.float32, shape=[None, input_size])

    y_input = tf.placeholder(tf.float32, shape=[None, no_classes])

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Image Classification


    # Chapter 2


    The None in the shape argument indicates that it can be of any size as we have
    not yet defined the batch size. The second argument is the size of the tensor
    for x_input and the number of classes for y_input. Based on the size of placeholder,
    we have sent the data as the floats. Next, we can define the perceptron.


    # Defining the variables for a fully connected layer


    Let''s define a simple linear classifier or percept by explaining the variables
    such as weights and bias. The values of these variables will be learned during
    computation. These are also referred to as parameters of the model. The weight
    variables are initialized with normal distribution with the shape of input and
    number of classes. The input size is 784 here as the image is reshaped into a
    single vector. The number of classes is 10 which is equal to the number of digits
    in the dataset. The bias variable is also initialized with normal distribution
    with the number of classes. The weights and bias are defined as follows:


    ```

    weights = tf.Variable(tf.random_normal([input_size, no_classes]))

    bias = tf.Variable(tf.random_normal([no_classes]))

    ```


    The initialization of the variables can be zeros but a random distribution gives
    a steady training. The inputs are then weighted and added with the bias to produce
    logits as shown next:


    ```

    logits = tf.matmul(x_input, weights) + bias

    ```


    The logits produced by the perceptron has to be compared against one-hot labels
    y_input. As learned in Chapter 1, Getting Started, it is better to use softmax
    coupled with cross-entropy for comparing logits and one-hot labels.


    The tf.nn.softmax_cross_entropy_with_logits API from TensorFlow does this for
    us. The loss can be computed by averaging the cross-entropies. Then the cross-entropy
    is fed through gradient descent optimization by tf.train.Gradient DescentOptimizer.
    The optimizer takes the loss and minimizes it with a learning rate of 0.5. The
    computation of softmax, cross-entropy, loss, optimization is shown next:


    ```

    softmax_cross_entropy = tf.nn.softmax_cross_entropy_with_logits(

    labels=y_input, logits=logits)

    loss_operation = tf.reduce_mean(softmax_cross_entropy)

    optimiser = tf.train.GradientDescentOptimizer(

    learning_rate=0.5).minimize(loss_operation)

    ```'
  merge: -1
  img_proc: true
