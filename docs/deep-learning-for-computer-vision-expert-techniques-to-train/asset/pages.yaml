- pgno: 261
  md: "# Using 3D convolution for temporal learning\n\nA video can be classified with\
    \ 3D convolution. 3D convolution operation takes a volume as input and outputs\
    \ the same, whereas a 2D convolution can take a 2D or volume output and outputs\
    \ a 2D image. The difference is shown as follows:\n\n![](img/48c861eac4dc634fbf2a09fdbe884beb_261_0.png)\n\
    \nThe first two images belong to 2D convolution. The output is always an image.\
    \ 3D convolution, meanwhile, outputs a volume. The difference is a convolution\
    \ operation in 3 directions with the kernel. Tran et al. (https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/Tran_Learning_Spatiotemporal_ICCV_2015_paper.pdf)\
    \ used 3D convolution for video classification. The classification model is shown\
    \ as follows:\n\n| Conv1a | Conv2a | Conv3a | Conv3b | Conv4a | Conv4b | Conv5a\
    \ | Conv5b | fc6 | fc7 |\n| --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- |\n| 64 | 128 | 256 | 256 | 512 | 512 | 512 | 512 | 4096 | 4096 |\n\n\
    The following is a code snippet of the model using 3D convolution:\n\n```\nnet\
    \ = tf.keras.models.Sequential()\nnet.add(tf.keras.layers.Conv3D(32,\n       \
    \                       kernel_size=(3, 3, 3),\n                             \
    \ input_shape=(input_shape)))\nnet.add(tf.keras.layers.Activation('relu'))\nnet.add(tf.keras.layers.Conv3D(32,\
    \ (3, 3, 3))\nnet.add(tf.keras.layers.Activation('softmax'))\nnet.add(tf.keras.layers.MaxPooling3D(0))\n\
    net.add(tf.keras.layers.Dropout(0.25))\n\nnet.add(tf.keras.layers.Conv3D(64, (3,\
    \ 3, 3)))\nnet.add(tf.keras.layers.Activation('relu'))\nnet.add(tf.keras.layers.Conv3D(64,\
    \ (3, 3, 3)))\nnet.add(tf.keras.layers.Activation('softmax'))\nnet.add(tf.keras.layers.MaxPooling3D(()))\n\
    ```"
  merge: -1
  img_proc: true
