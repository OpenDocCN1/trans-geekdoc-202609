- pgno: 34
  md: '![](img/48c861eac4dc634fbf2a09fdbe884beb_34_0.png)


    As shown in the preceding figure, the step is unfolded and trained each time.
    During backpropagation, the gradients can vanish over time. To overcome this problem,
    Long short-term memory can be used to remember over a longer time period.


    # # Long short-term memory (LSTM)


    Long short-term memory (LSTM) can store information for longer periods of time,
    and hence, it is efficient in capturing long-term efficiencies. The following
    figure illustrates how an LSTM cell is designed:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_34_1.png)'
