  md: '# Video Classification


    # Chapter 9


    The boosting mechanism is used to combine the predictions. **Boosting** is a mechanism
    that can combine several model prediction into a final prediction.


    # Attending regions for classification


    An attention mechanism can be used for classification. Attention mechanisms replicate
    the human behaviour of focusing on regions for recognition activities. Attention
    mechanisms give more weight to certain regions than others. The method of weight
    is learned from the data while training. Attention mechanisms are mainly of two
    types, namely:


    +   * **Soft attention**: Deterministic in character, this can hence be learned
    by back-propagation.

    * **Hard attention**: Stochastic in character, this needs complicated mechanisms
    to learn. It is also expensive because of the requirement of sampling data.


    Following is a visualization of soft attention:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_266_0.png)


    Reproduced from Sharma et al.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Video Classification


