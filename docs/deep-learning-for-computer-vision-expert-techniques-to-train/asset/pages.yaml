- pgno: 260
  md: '# Video Classification


    Optical flow measures the motion by quantifying the relative movement between
    the observer and scene. A detailed lecture on optical flow can be found at https://www.youtube.com/watch?v=CvyLAH8BChF8.
    The optical flow can be obtained by running the following command:


    ```

    p1, st, err = cv2.calcOpticalFlowPyrLK(old_gray, frame_gray, p0,

    **lk_params)

    ```


    One stream takes individual frames and predicts using a regular CNN. The other
    stream takes multiple frames and computes the optical flow. The optical flow is
    passed through a CNN for a prediction. Both the predictions are shown in the following
    image:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_260_0.png)


    Both predictions can be combined with the final prediction.'
  merge: -1
