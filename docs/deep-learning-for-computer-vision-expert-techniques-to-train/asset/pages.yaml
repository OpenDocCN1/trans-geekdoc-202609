- pgno: 143
  md: '# 5 Semantic Segmentation


    In this chapter, we will learn about various semantic segmentation techniques
    and train models for the same. Segmentation is a pixel-wise classification task.
    The ideas to solve segmentation problem is an extension to object detection problems.
    Segmentation is highly useful in applications such medical and satellite image
    understanding.


    The following topics will be covered in the chapter:


    +   - Learning the difference between semantic segmentation and instance segmentation

    - Segmentation datasets and metrics

    - Algorithms for semantic segmentation

    - Application of segmentation to medical and satellite images

    - Algorithms for instance segmentation


    # Predicting pixels


    Image classification is the task of predicting labels or categories. Object detection
    is the task of predicting a list of several deep learning-based algorithms with
    its corresponding bounding box. The bounding box may have objects other than the
    detected object inside it. In some applications, labeling every pixel to a label
    is important rather than bounding box which may have multiple objects. Semantic
    segmentation is the task of predicting pixel-wise labels.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Here is an example of an image and its corresponding semantic segmentation:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_144_0.png)


    As shown in the image, an input image is predicted with labels for every pixel.
    The labels could be the sky, tree, person, mountain, and bridge. Rather than assigning
    a label to the whole image, labels are assigned to each pixel. Semantic segmentation
    labels pixels independently. You will notice that every people is not distinguished.
    All the persons in the image are labeled in the same way.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Semantic Segmentation


    Chapter 5


    Here is an example where every instance of the same label is distinguished:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_145_0.png)


    This task of segmenting every instance with a pixel-wise label is called instance
    segmentation. Instance segmentation can be thought of as an extension of object
    detection with pixel-level labels. The applications of semantic segmentation and
    instance segmentation are enormous, and a few of the applications are provided
    in the next sections.


    # Diagnosing medical images


    A medical image can be diagnosed with segmentation techniques. Modern medical
    imaging techniques such as Magnetic Resonance Imaging (MRI), Computed Tomography
    (CT), and Retinopathy create high-quality images. The images generated by such
    techniques can be segmented into various regions to detect tumours from brain
    scans or spots from retina scans. Some devices provide volumetric images which
    can also be analyzed by segmentation. Segmenting the video for robot surgery enables
    the doctors to see the regions carefully in robot-assisted surgeries. We will
    see how to segment medical images later in the chapter.


    [ 131 ]'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Understanding the earth from satellite imagery


    Satellite images have become abundant recently. The images captured by satellite
    provide a high-resolution view of the total surface of the earth. By analyzing
    the satellite imagery, we can understand several things about earth such as:


    +   * Measuring the rate of construction in a country related to economic growth

    * Measuring the oil tanks

    * Planning and organizing the traffic

    * Calculating the deforestation and its effects

    * Helping wildlife preservation by counting animals and tracking their movements

    * Discovering archaeological sites

    * Mapping the damaged regions due to a natural disaster


    There are more applications possible with satellite imagery. For most of these
    problems mentioned, the solution starts with the segmentation of satellite images.
    We will see how to segment satellite images robots in the chapter.


    # Enabling robots to see


    Segmenting the scenes is crucial for robots to see and interact with the world
    around. Industrial and home robots have to handle the objects. The handling becomes
    possible once the vision to the objects is stridden according to the objects.
    There are a few more applications worth mentioning:


    +   * Industrial inspection of tools for segmenting the defects

    * Color diagnostics of the fashion industry; an image can be segmented with various
    fashion objects and use them for color parsing

    * Distinguished foreground from background to apply portrait effects


    In the next section, we will learn a few public datasets for evaluating segmentation
    algorithms.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Datasets


    The PASCAL COCO datasets that were mentioned in Chapter 4, Object Detection, be
    used for the segmentation task as well. The annotations are different as they
    are labelled pixel-wise. New algorithms are usually benchmarked against the COCO
    dataset. COCO also has stuff datasets such as grass, wall, and sky. The pixel
    accuracy property can be used as a metric for evaluating algorithms.


    Apart from those mentioned, there are several other datasets in the areas of medical
    imaging and satellite imagery. The links to a few of them are provided here for
    your reference:


