  md: '# Image Retrieval


    # Chapter 3


    Call the inference repeatedly to gauge the accuracy, latency, and throughput.
    The inference error rate should be around 90%, and the concurrency should be great.
    The export and client methods can be used for any model to obtain the results
    and features from the model. In the next section, we will build the retrieval
    pipeline.


    # Content-based image retrieval


    The technique of Content-based image Retrieval (CBIR) takes a query image as the
    input and ranks images from a database of target images, producing the output.
    CBIR is an image to search engine with a specific goal. A database of target images
    is required for retrieval. The target images with the minimum distance from the
    query image are returned. We can use the image directly for similarity, but the
    problems are follows:


    +   * The image is of huge dimensions

    * There is a list of redundancy in pixels

    * A pixel doesn''t carry the semantic information


    So, we train a model for object classification and use the features from the model
    for retrieval. Then we pass the query image and database of targets through the
    same model to get the features. The models can also be called encoders as they
    encode the information about the images for the particular task. Encoders should
    be able to capture global and local features. We can use the models that we studied
    in the image classification chapter, trained for a classification task. The searching
    of the image may take a lot of time, as a brute-force or linear scan is slow.
    Hence, we some methods for faster matching:


    +   * Locality sensitive hashing (LSH): LSH projects the features to their subspace
    and can give a candidate and a list and do fine-feature ranking. This is also
    a dimensionality reduction technique such as PCA and t-SNE which we covered earlier
    in the chapter. This has feature buckets in lower dimensions.

    * Multi-index hashing: This method hashes the features and it is like pigeonhole
    fitting it faster. It uses hamming distance to make the computation faster. Hamming
    distance is nothing but the number of location differences of the numbers expressed
    in binary.


    [ 94 ]'
