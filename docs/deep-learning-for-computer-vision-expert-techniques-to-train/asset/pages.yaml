    # # Using attention network for captioning


    Xu et al., in the paper, https://arxiv.org/pdf/1502.03044.pdf, proposed a method
    for image captioning using an **attention mechanism**. The attention mechanism
    gives more weight to certain regions of the image than others. Attention also
    enables visualization, showing us where the model is focusing when it generates
    the next word. The proposed model shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_210_1.png)


    Reproduced from Xu et al.'
