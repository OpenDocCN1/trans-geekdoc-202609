    \ Run the following script to rearrange the images and create the necessary folders:\n\
    \n```\nimport os\nimport shutil\n\nwork_dir = ' ' # give your correct directory\n\
    image_names = sorted(os.listdir(os.path.join(work_dir, 'train')))\n\ndef copy_files(prefix_str,\
