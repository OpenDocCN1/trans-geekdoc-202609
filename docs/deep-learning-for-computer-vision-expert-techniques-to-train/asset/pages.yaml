- pgno: 237
  md: '# Generative Models


    # Chapter 8


    Like before, we''re going to grab a sequence of layer outputs to compute the style
    loss. However, we will still need one layer output to compute the content loss.
    How do we know which layer to grab? As we discussed earlier, the lower the layer,
    the more exact the content reconstruction will be. In merging content reconstruction
    with style, we might expect that looser reconstruction of the content will allow
    more room for the style to affect (re: inspiration). Furthermore, a later layer
    ensures that the image looks like the same subject, even if it doesn''t have the
    details. The following code is used for this process:


    ```

    style_layers = [outputs[''block1_conv2''].format(o) for o in range(1,6)]

    content_name = ''block4_conv2''

    content_layer = outputs[content_name]

    ```


    Now, a separate model for style is created with required output layers, using
    the following code:


    ```

    style_model = Model(model.input, style_layers)

    style_targs = [K.variable(o) for o in style_model.predict(style_arr)]

    ```


    We will also create another model for the content with the content layer, using
    the following code:


    ```

    content_model = Model(model.input, content_layer)

    content_target = K.variable(content_model.predict(src))

    ```


    Now, the merging of the two approaches is as simple as merging their respective
    loss functions. Note that as opposed to our previous functions, this function
    is producing three separate types of outputs:


    +   * One for the original image

    * One for the image whose style we''re emulating

    * One for the random image whose pixels we are training


    One way for us to tune how the reconstructions is by changing the factor on the
    content loss, which we have here as 1/10. If we increase denominator, the style
    will have a larger effect on the image, and if it''s too large, the original content
    of the image will be obscured by an unstructured style. Likewise, if it is too
    small then the original image will not have enough style. We will use the following
    code for this process:


    ```

    style_wgts = [0.05,0.2,0.2,0.25,0.3]

    ```'
  merge: -1
  img_proc: true
