- pgno: 219
  md: '# # Super-resolution of images


    The **super-resolution** is the process of creating higher resolution images from
    a smaller image. Traditionally, interpolations were used to create such bigger
    images. But interpolation misses the high-frequency details by giving a smoothed
    effect. Generative models that are trained for this specific purpose of super-resolution
    create images with excellent details. The following is an example of such models
    as proposed by Ledig et al. (https://arxiv.org/pdf/1609.04802.pdf). The left side
    is generated with **4x scaling** and looks indistinguishable from the original
    on the right:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_219_0.png)


    > Reproduced from Ledig et al.


    Super-resolution is useful for rendering a low-resolution image on a high-quality
    display or print. Another application could be a reconstruction of compressed
    images with good quality.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# # Interactive image generation


    Generative models can be used to create images by interaction. A user can add
    edits and the images can be generated, reflecting the edits as shown here as proposed
    by Zhu et al. (https://arxiv.org/pdf/1609.03552v2.pdf).


    | User edits | Generated images | User edits | Generated images | User edits |
    Generated images |

    | --- | --- | --- | --- | --- | --- |

    | ![image](...) | ![image](...) | ![image](...) | ![image](...) | ![image](...)
    | ![image](...) |

    | ![image](...) | ![image](...) | ![image](...) | ![image](...) | ![image](...)
    | ![image](...) |

    | ![image](...) | ![image](...) | ![image](...) | ![image](...) | ![image](...)
    | ![image](...) |

    | Query | Nearest neighbor real photos | Query | Nearest neighbor real photos
    | Query | Nearest neighbor real photos |

    | ![image](...) | ![image](...) | ![image](...) | ![image](...) | ![image](...)
    | ![image](...) |

    | Church | | Church | | Natural Outdoor |


    As shown, the images are generated based on the shape and color of the edits.
    A green stroke at the bottom creates a grassland, a rectangle creates a skyscraper
    and so on. The images will be generated and fine-tuned with further inputs from
    the user. The generated image can also be used to retrieve the most similar real
    image that can be utilized. Interactive image generation provides an entirely
    new way of searching images intuitively.'
  merge: -1
  img_proc: true
