- pgno: 122
  md: '# Object Detection


    Image classification labels the image as a whole. Finding the position of the
    object in addition to labeling the object is called object localization. Typically,
    the position of the object is defined by rectangular coordinates. Finding multiple
    objects in the image with rectangular coordinates is called detection. Here is
    an example of object detection:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_122_0.png)


    The image shows four objects with bounding boxes. We will learn algorithms that
    can perform the task of finding the boxes. The applications are enormous in robot
    vision, as self-driving cars and industrial objects. We can summarize localization
    and detection tasks to the following points:


    +   * Localization detects one object in an image within a label

    * Detection finds all the objects within the image along with the labels


    The difference is the number of objects. In detection, there are a variable number
    of objects. This small difference makes a big difference when designing the architectures
    for the deep learning model concerning localization or detection. Next, we will
    see various datasets available for the tasks.


    # Exploring the datasets


    The datasets available for object localization and detection are many. In this
    section, we will explore the datasets that are used by the research community
    to evaluate the algorithms. There are datasets with a varying number of objects,
    ranging from 20 to 200 annotated in these datasets, which makes object detection
    hard. Some datasets have too many objects in one image compared to other datasets
    with just one object per image. Next, we will see the datasets in detail.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# ImageNet dataset


    ImageNet has data for evaluating classification, localization, and detection tasks.
