    \ can be passed as a parameter to the training script. The training data has to\
    \ be converted to TensorFlow records. TensorFlow records is a file format provided\
    \ by Google to make the reading of data faster than regular files. Now, we will\
    \ go through the steps of training.\n\n# Data preparation for the Pet dataset\n\
    \nThe Oxford-IIIT Pet dataset is used for this example. Download the image and\
    \ annotations with these commands from the Chapter04 directory.\n\n```\nwget http://www.robots.ox.ac.uk/~vgg/data/pets/images.tar.gz\n\
    wget http://www.robots.ox.ac.uk/~vgg/data/pets/annotations.tar.gz\n```\n\nExtract\
    \ the image and annotations as shown here:\n\n```\ntar -xvf images.tar.gz\ntar\
    \ -xvf annotations.tar.gz\n```\n\nCreate the pet_tf record to create the dataset\
    \ in the tf records, as they are required input for the object detection trainer.\
    \ The label_map for the Pet dataset can be found at object_detection/data/pet_label_map.pbtxt.\
    \ Move to the research folder and run the following command:\n\n```\npython object_detection/create_pet_tf.record_\
