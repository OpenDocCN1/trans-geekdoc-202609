  md: '# Foreword


    Deep learning is revolutionizing AI, and over the next several decades, it will
    change the world radically. AI powered by deep learning will be on par in scale
    with the industrial revolution. This, understandably, has created excitement and
    fear about the future. The reality is just like the industrial revolution and
    machinery, deep learning will improve industrial capacity and raise the standards
    of living dramatically for humankind. Rather replace jobs, it will create many
    more jobs of a higher stand. This is why this book is so important and timely.
    Readers of this book will be introduced to deep learning for the fundamentals
    of computer vision, its power, and many applications. This book will give readers
    a grounding in the fundamentals of an emerging industry that will grow exponentially
    over the next decade.


    Rajalingappaa Shanmugamani is a great researcher whom I have worked with previously
    on several projects in computer vision. He was the lead engineer in designing
    and delivering a complex computer vision and deep learning system for fashion
    search that was deployed in the real world with great success. Among his strengths
    is his ability to take up state-of-the-art research in complex problems and apply
    them to real-world situations. He can also break down complex ideas and explain
    them in simple terms as is demonstrated in this book. Raja is a very ambitious
    person with great work ethics, and in this book, he has given a great overview
    of the current state of computer vision using deep learning, a task not many can
    do in today''s industry. This book is a great achievement by Raja and I''m sure
    the reader will enjoy and benefit from it for many years to come.


    Dr. Stephen Moore


    Chief Technology Officer, EmotionReader, Singapore'
  merge: -1
  img_proc: true
