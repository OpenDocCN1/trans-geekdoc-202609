  md: '# The TensorFlow library


    The tensorflow is an open source library for the development and deployment of
    deep learning models. TensorFlow uses computational graphs for data flow and numerical
    computations. In other words, data, or tensor, flows through the graph, thus the
    name tensorflow. The graph has nodes that enable any numerical computation and,
    hence, are suitable for deep learning operations. TensorFlow provides a single
    API for all kinds of platforms and hardware. It was originally developed for research
    at Google. It is the most famous deep learning library, with a large community
    and comes with tools for visualization and deployment in production.


    # Installing TensorFlow


    Install tensorflow using pip3 for the CPU using the following command:


    ```

    sudo pip3 install tensorflow

    ```


    If you are using GPU hardware and have installed CUDA and CUDNN, install the GPU
    version of the tensorflow with the following command:


    ```

    sudo pip3 install tensorflow-gpu

    ```


    Now the tensorflow is installed and ready for use. We will try out a couple of
    examples to understand how TensorFlow works.


    # TensorFlow example to print Hello, TensorFlow


    We will do an example using TensorFlow directly in the Python shell. In this example,
    we will print Hello, TensorFlow using TensorFlow.


    +   1. Invoke Python from your shell by typing the following in the command prompt:


    ```

    python3

    ```


    +   2. Import the tensorflow library by entering the following command:


    ```

    >>> import tensorflow as tf

    ```'
