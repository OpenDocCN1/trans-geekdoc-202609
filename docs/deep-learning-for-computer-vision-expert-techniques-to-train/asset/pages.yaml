- pgno: 290
  md: "# Jetson TX2\n\nJetson TX2 is an embedding device supplied by NVIDIA specifically\
    \ efficient AI computing. Jetson TX2 is lightweight, compact and hence suitable\
    \ for deployment in drones, public places and so on. It also ships preinstalled\
    \ TensorRT which is a runtime for TensorFlow. You can use Jetson and install Ubuntu,\
    \ CUDA, CUDNN before installing TensorFlow. Clone https://github.com/jetsonhacks/installTensorFlowTX2\
    \ and enter the following commands at the command prompt.\n\n+   1. First, install\
    \ the prerequisites with the help of the following code:\n  ./installPrerequisites.sh\n\
    2. Now, clone the TensorFlow using the following code:\n  ./cloneTensorFlow\n\
    3. Next, set the required environment variables using the following code:\n  ./setTensorFlowEV\n\
    4. Now we will build the TensorFlow using the following code:\n  ./buildTensorFlow.sh\n\
    5. Now we will process the package into a wheel file using the following code:\n\
    \  ./packageTensorFlow.sh\n6. Now we will install the TensorFlow using the following\
    \ code:\n  pip install $HOME/tensorflow-1.0.1-cp27-cp27mu-linux_aarch64.whl\n\n\
    With the help of these steps, we can install TensorFlow in Jetson TX2."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Android\n\nAny app can use TensorFlow and the details to build can be found\
    \ in https://www.tensorflow.org/mobile/android_build. The official example regarding\
    \ the tree/ can be found in https://github.com/tensorflow/tensorflow/tree/master/tensorflow/examples/android.\
    \ The steps for implementing TensorFlow in Android devices are as follows assuming\
    \ the reader has experience in Android programming:\n\n+   - Export the TensorFlow\
    \ model to a .pb file using the steps covered in Chapter 3 Image Retrieval.\n\
    - Build .so and .jar files which are the binaries.\n- Edit gradle files to enable\
    \ loading of libraries.\n- Load and run the Android app file\n\n# iPhone\n\nApple\
    \ used CoreML framework to integrate machine learning in the applications of iPhone\
    \ Apple provides a standard list of models that can be integrated directly into\
    \ the application. You can train a custom deep learning models using TensorFlow\
    \ and use that in iPhone. In order to deploy custom models, you have to convert\
    \ the TensorFlow in CoreML framework model. Google released https://github.com/tf-coreml/tf-coreml\
    \ for converting TensorFlow models into CoreML models. TForeML can be installed\
    \ using the following code:\n\n```\npip install -U tf-coreml\n```\n\nThe model\
    \ can be exported using the following code:\n\n```\nimport tfcoreml as tf_converter\n\
    tf_converter.convert(tf_model_path='tf_model_path.pb',\n                    mlmodel_path='mlmodel_path.mlmodel',\n\
    \                    output_feature_names=['softmax:0'],\n                   \
    \ input_name_shape_dict={'input:0': [1, 227, 227, 3]})\n```\n\nThe exported model\
    \ can be used by iPhone for predictions."
