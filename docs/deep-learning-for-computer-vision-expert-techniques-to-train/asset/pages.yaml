    Deployment


    In this chapter, we will learn how to deploy the trained model in the various
    platforms for maximum throughput and minimum latency. We will understand performance
    on various hardware such as a GPU and a CPU. We will follow the steps of deploying
    TensorFlow in platforms such as Amazon Web Services, Google Cloud Platform, and
    mobile platforms such as Android, iOS, and Tegra.


    We will cover the following topics in this chapter:


    +   * Understanding the factors affecting the performance of the deep learning
    model training and inference

    * Improving the performance through various methods

    * Seeing the benchmarks of various hardware and learning the steps to tweak them
    for maximum performance

    * Using various cloud platforms for deployment

    * Using various mobile platforms for deployment


    # Performance of models


    Performance is important for both the training and the deployment of deep learning
    models. The training usually takes more time due to large data or big model architecture.
    The resultant models may be a bigger size and hence problematic to use in mobile
    devices where there is a constraint on RAM. More computing time results in more
    infrastructure cost. The inference time is critical in video applications. Due
    the previously mentioned importance of performance, in this section, we will look
    at techniques to improve the performance. Reducing the model complexity is an
    easy option but results in decreasing accuracy. Here, we will focus on methods
    to improve the performance with an insignificant drop in accuracy. In the next
    section, we will discuss the option of quantization.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Quantizing the models


    The weights of deep learning models have 32-bit float values. When the weights
    are quantized to 8-bit, the decrease in accuracy is small and hence cannot be
    noticed in deployment. The precision of weights on the results seems to have fewer
    effects on accuracy performance of deep learning models. This idea is interesting
    about deep learning and useful when the model size becomes critical. By replacing
    32-bit float values with 8-bit values, the model size can be significantly decreased
    and the inference speed can be increased. There are plenty of options when considering
    the quantization of models. The weights can be stored in 8-bit but inference operations
    can be performed in 32-bit float values. Every component of the architecture may
    behave differently for quantization size and so, depending on the layer, 32 or
    16 or 8-bit values can be chosen.


    The quantization works due to a number of reasons. Generally, the deep learning
    models are trained to tackle noise in the images and therefore can be considered
    as robust. The inference calculations have redundant information and that redundant
    information may be removed due to the quantization.


    The latest CPU and RAM hardware are tuned towards floating point calculation and
    so the effect of quantization may be less visible in such hardware. This scenario
    is changing as more and more hardware is introduced for this purpose. A significant
    difference in memory and speed can be noticed in GPUs as they are now adapted
    to the lower precise floating operations. There is other special hardware available
    for running less precise floating operations.


    # MobileNets


    Howard and others (https://arxiv.org/pdf/1704.04861.pdf) introduced a new class
    of models called MobileNets that can be used for mobile and embedded applications.
    MobileNets can be used for different applications such as object detection, landmark
    recognition, face attributes, fine-grain classification as shown here:'
