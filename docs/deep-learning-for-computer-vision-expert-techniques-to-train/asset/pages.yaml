    The convolution function layer is defined as:\n\n```\ndef convolution_layer(input_layer,\
    \ filters, kernel_size=[3, 3],\n    layer = tf.layers.conv2d(\n        inputs=input_layer,\n\
    \        filters=filters,\n        kernel_size=kernel_size,\n        activation=activation,\n\
