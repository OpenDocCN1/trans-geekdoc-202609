    # # Object Detection


    Object detection is the act of finding the location of an object in an image.
    In this chapter, we will learn the techniques of object detection and implement
    pedestrian detection by understanding the following topics:

    * Basics and the difference between localization and detection

    * Various datasets and their descriptions

    * Algorithms used for object localization and detection

    * TensorFlow API for object detection

    * Training new object detection models

    * Pedestrian detection on a moving car with YOLO algorithm


    # # Detecting objects in an image


    Object detection had an explosion concerning both applications and research in
    recent years. Object detection is a problem of importance in computer vision.
    Similar to image classification tasks, deeper networks have shown better performance
    in detection. At present, the accuracy of these techniques is excellent. Hence
    it used in many applications.'
