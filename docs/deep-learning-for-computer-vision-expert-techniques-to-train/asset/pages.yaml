    computational problems when using high-resolution pictures. Reid et al. (https://arxiv.org/pdf/1611.06612.pdf)
    proed a method called RefiNet to overcome this problem which is shown below:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_156_0.png)'
