- pgno: 268
  md: '# Extending image-based approaches to videos


    Images can be used for pose estimation, style transfer, image generation, segmentation,
    captioning, and so on. Similarly, these applications find a place in videos too.
    Using the temporal information may improve the predictions from images and vice
    versa. In this section, we will see how to extend these applications to videos.


    # Regressing the human pose


    Human pose estimation is an important application of video data and can improve
    other tasks such as action recognition. First, let''s see a description of the
    datasets available for pose estimation:


    +   - Poses in the wild dataset: Contains 30 videos annotated with the human pose.
    The dataset link is: https://lear.inialpes.fr/research/posesinthewild/. The dataset
    is annotated with human body joints.

    - Frames Labeled In Cinema (FLIC): A human pose dataset obtained from 30 movies,
    available at: https://bensapp.github.io/flic-dataset.html.


    Pfister et al. (https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/Pfister_Flowing_ConvNets_for_ICCV_2015_paper.pdf)
    proposed a method to predict the human pose in videos. The pipeline for regressing
    the human pose:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Video Classification


    # Chapter 9


    The frames from the video are taken and passed through a convolutional network.
    The layers are fused, and the pose heatmaps are obtained. The pose heatmaps are
    combined with optical flow to get the warped heatmaps. The warped heatmaps across
    a timeframe are pooled to produce the pooled heatmap, getting the final pose.


    # Tracking facial landmarks


    Face analysis in videos requires face detection, landmark detection, pose estimation,
    verification, and so on. Computing landmarks are especially crucial for capturing
    facial animation, human-computer interaction, and human activity recognition.
    Instead of computing over frames, it can be computed over video. Gu et al. (http://research.nvidia.com/sites/default/files/publs/2017-07_dynamic-Facial-Analysis/rnnface.pdf)
    proposed a method to use a joint estimation of detection and tracking of facial
    landmarks in videos using RNN. The results outperform frame wise predictions and
    other previous models. The landmarks are computed by CNN, and the temporal aspect
    is encoded in an RNN. Synthetic data was used for training.


    # Segmenting videos


    Videos can be segmented in a better way when temporal information is used. Gadde
    et al. (https://ps.is.tuebingen.de/uploads_file/attachment/386/gadde2017videocnns.pdf)
    proposed a method to combine temporal information by warping. The following image
    demonstrates the solution, which segments two frames and combines with the warping:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_269_0.png)


    > Reproduced from Gadde et al.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Video Classification


    # Chapter 9


    The warping net is not shown in the following image:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_270_0.png)


    Reproduced from Gadde et al.


    The optical flow is computed between two frames, which are combined with warping.
    The warping module takes the optical flow, transforms it, and combines it with
    the warped representations.


    # Captioning videos


    The Chapter 7, Image Captioning, illustrated several ways to combine text and
