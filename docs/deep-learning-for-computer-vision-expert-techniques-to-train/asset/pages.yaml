    # Guided backpropagation


    The visualization of features directly can be less informative. Hence, we use
    the training procedure of backpropagation to activate the filters for better visualization.
    Since we pick what neurons are to be activated for backpropagation, it is called
    guided backpropagation. In this section, we will implement the guided backpropagation
    to visualize the features.


    We define the size and load the VGG model, as shown here:


    ```

    image_width, image_height = 128, 128

    vgg_model = tf.keras.applications.VGG16(include_top=False)

    ```


    The layers are defined as a dictionary with layer names as keys, and the layer
    from the model with weights as the value for ease of access. Now we will take
    a first convolution layer from the fifth block, block5_conv1 for computing the
    visualization. The input and output are defined here:


    ```

    input_image = vgg_model.input

    vgg_layer_dict = dict((vgg_layer.name, vgg_layer) for vgg_layer in vgg_model.layers[1:]])

    vgg_layer_output = vgg_layer_dict[''block5_conv1''].output

    ```


    We define the loss function. The function will maximize the activation of a particular
    layer. This is a gradient ascent process rather than the usual gradient descent
    as we are trying to maximize the loss function. For gradient ascent, it is important
    to smooth the gradient. We smooth the gradient in this case by normalizing the
    pixel gradients. This loss function converges rather quickly.


    The output of the image should be normalized to visualize it back, gradient ascent
    is used in an optimization process to get the maximum of a function. Now we can
    start the gradient ascent optimization by defining the evaluator and gradients,
    as shown next. Now the loss function has to be defined and gradients to be computed.
    The iterator computes its loss and gradient values over iterations as:


    ```

    filters = []

    for filter_idx in range(20):

