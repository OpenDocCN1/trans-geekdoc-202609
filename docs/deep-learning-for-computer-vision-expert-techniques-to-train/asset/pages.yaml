- pgno: 280
  md: '# AWS


    The Amazon Web Services (AWS) extends support to the development and deployment
    of TensorFlow-based models. Sign up for AWS at https://aws.amazon.com/ and select
    one of the Amazon Machine Images (AMI). AMIs are images of machines with all the
    required software installed. You need not worry about installing the packages.
    AWS provides Deep Learning AMI (DLAMI) for training and deploying learning models.
    There are several options to choose from. Here, we will use Conda as it comes
    with several packages required for running TensorFlow. There are two options for
    Python: version 2 and 3. The following will activate TensorFlow with Keras 2 on
    Python 3 with CUDA 8:


    ```

    source activate tensorflow_p36

    ```


    The following code will activate TensorFlow with Keras 2 on Python 2 on CUDA 8:


    ```

    source activate tensorflow_p27

    ```


    > You can visit https://aws.amazon.com/tensorflow/ for more details and tutorials.


    A Virtual Machine (VM) can also be started by following the steps given here:


    +   1. Go to aws.amazon.com and login using your AWS account.

