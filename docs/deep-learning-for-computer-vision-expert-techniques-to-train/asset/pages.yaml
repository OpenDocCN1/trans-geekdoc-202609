  md: "# 1D – 4 regions 2D – 16 regions 3D – 64 regions\n\n![](img/48c861eac4dc634fbf2a09fdbe884beb_113_0.png)\n\
    \nWith every increasing dimension, complexity increases as the complexity from\
    \ two dimensions to three dimensions. The computation of the distance also becomes\
    \ slower. To make the distance search faster, we will discuss an approximate method\
    \ in the next section.\n\n# Matching faster using approximate nearest neighbour\n\
    \nApproximate nearest neighbour oh yeah (ANNOY) is a method for faster nearest\
    \ search. ANNOY builds trees by random projections. The tree structure makes it\
    \ easier to find the closest matches. You can create an AnnoyIndex for faster\
    \ retrieval as shown here:\n\n```\ndef create_annoy(target_features):\n    t =\
    \ AnnoyIndex(layer_dimension)\n    for idx, target_feature in enumerate(target_features):\n\
    \        t.add_item(idx, target_feature)\n    t.build(10)\n    t.save(os.path.join('work_dir',\
    \ 'annoy.ann'))\n```\n\ncreate_annoy(target_features)\n\nThe dimension of the\
    \ features is required for creating the index. The items are added to the index\
    \ and the tree is bigger. The bigger number of trees, the more accurate the results\
    \ will be with a trade-off of time and space complexity. The index can be created\
    \ and loaded into the memory. The ANNOY can be queried as shown here:\n\n```\n\
    annoy_index = AnnoyIndex(10)\nannoy_index.load(os.path.join(work_dir, 'annoy.ann'))\n\
    matches = annoy_index.get_n(query_feature, 20)\n```"
