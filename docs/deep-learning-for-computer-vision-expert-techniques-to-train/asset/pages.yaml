  md: "# Image Retrieval Chapter 3\n\nThe bottleneck layer is the middle layer with\
    \ a reduced dimension. The left side of the bottleneck layer is called encoder\
    \ and the right side is called decoder. An encoder typically reduces the dimension\
    \ of the data and a decoder increases the dimensions. This combination of encoder\
    \ and decoder is called autoencoder. The whole network is trained with reconstruction\
    \ error. Theoretically, the bottleneck layer can be stored and the original data\
    \ can be reconstructed by the decoder network. This reduces the dimensions and\
    \ can be programmed easily, as shown next. Define a convolution, deconvolution,\
    \ and fully connected layer, using the following code:\n\n```\ndef fully_connected_layer(input_layer,\
    \ units):\n    return tf.layers.dense(\n        input_layer,\n        units=units,\n\
    \        activation=tf.nn.relu\n    )\n```\n\n```\ndef convolution_layer(input_layer,\
    \ filter_size):\n    return tf.layers.conv2d(\n        input_layer,\n        filters=filter_size,\n\
    \        kernel_initializer=tf.contrib.layers.xavier_initializer_conv2d(),\n \
    \       kernel_size=3,\n        strides=2\n    )\n```\n\n```\ndef deconvolution_layer(input_layer,\
    \ filter_size, activation=tf.nn.relu):\n    return tf.layers.conv2d_transpose(\n\
    \        input_layer,\n        filters=filter_size,\n        kernel_initializer=tf.contrib.layers.xavier_initializer_conv2d(),\n\
    \        kernel_size=3,\n        activation=activation,\n        strides=2\n \
    \   )\n```\n\nThe merging encoder with five layers of convolution, as shown in\
    \ the following code:\n\n```\ninput_layer = tf.placeholder(tf.float32, [None,\
    \ 128, 128, 3])\nconvolution_layer_1 = convolution_layer(input_layer, 1024)\n\
    convolution_layer_2 = convolution_layer(convolution_layer_1, 512)\nconvolution_layer_3\
    \ = convolution_layer(convolution_layer_2, 256)\nconvolution_layer_4 = convolution_layer(convolution_layer_3,\
    \ 128)\nconvolution_layer_5 = convolution_layer(convolution_layer_4, 32)\n```"
