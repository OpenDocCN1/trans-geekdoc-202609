    the forms on the right side. For a human, the image with noise still looks the
    same. But the image with noise is predicted with a different label with 97% confidence.
    High confidence is assigned to a particular example, despite the image having
    a very different object. This is a problem with deep learning models and, you
    should understand where this is applicable:


    +   * The adversarial example can even be generated without the access to the
    models. You can train your own model, generate an adversarial example and can
    still fool a different model.


    +   * This occurs rarely in practice but it is true problem when someone tries
    to fool a system for spamming or crashing.


    +   * All machine learning models are susceptible to this problem, not just deep
    learning models.


    You should understand the consequences of deploying a deep learning model on a
