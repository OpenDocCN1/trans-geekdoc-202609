    \ that was trained on the ImageNet dataset with millions of classes.\n\n# Training\
    \ on bottleneck features\n\nThe models that are covered in the previous sections\
    \ are simple and hence, may yield less accuracy. Complex models should be built\
    \ from them. They cannot be built from scratch. Hence, bottleneck features are\
    \ extracted and the classifier is trained on them. Bottleneck features are the\
    \ features that are produced by complex architectures training several million\
    \ images. The images are done with a forward pass and the pre-final layer features\
    \ are stored. From these, a simple logistic classifier is trained for classification.\
    \ Extract the bottleneck features as:\n\n```\ngenerator = tf.keras.preprocessing.image.ImageDataGenerator(rescale=1\
