- pgno: 31
  md: '# Convolutional neural network


    Convolutional neural networks (CNN) are similar to the neural networks described
    in the previous sections. CNNs have weights, biases, and outputs through a nonlinear
    activation. Regular neural networks take inputs and the neurons fully connected
    to the next layers. Neurons within the same layer do not share any connections.
    If we use regular networks for images, they will be very large in size due a huge
    number of neurons, resulting in overfitting. We cannot use this for images, as
    images are large in size. Increase the model size as it requires a huge number
    of neurons. An image can be considered a volume with dimensions of height, width,
    and depth. Depth is the channel of an image, which is red, blue, and green. The
    neurons of a CNN are arranged in a volumetric fashion to take advantage of the
    volume. Each of the layers transforms the input volume to an output volume as
    shown in the following image:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_31_0.png)


    Convolution neural network filters encode by transformation. The learned filters
    detect features or patterns in images. The deeper the layer, the more abstract
    the pattern is. Some analyses have shown that these layers have the ability to
    detect edges, corners, and patterns. The learnable parameters in CNN layers are
    less than the dense layer described in the previous section.


    # Kernel


    Kernel is the parameter convolution layer used to convolve the image. The convolution
    operation is shown in the following figure:'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/48c861eac4dc634fbf2a09fdbe884beb_32_0.png)


    The kernel has two parameters, called stride and size. The size can be any dimension
    of a rectangle. Stride is the number of pixels moved every time. A stride of length
    1 produces an image of almost the same size, and a stride of length 2 produces
    half the size. Padding the image will help in achieving the same size of the input.


    # # Max pooling


    Pooling layers are placed between convolution layers. Pooling layers reduce the
    size of the image across layers by sampling. The sampling is done by selecting
    the maximum value in a window. Average pooling averages over the window. Pooling
    also acts as a regularization technique to avoid overfitting. Pooling is carried
    out on all the channels of features. Pooling can also be performed with various
    strides.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The size of the window is a measure of the receptive field of CNN. The following
    figure shows an example of max pooling:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_33_0.png)


    CNN is the single most important component of any deep learning model for computer
    vision. It won''t be an exaggeration to state that it will be impossible for any
    computer to have vision without a CNN. In the next sections, we will discuss a
    couple of advanced layers that can be used for a few applications.


    > Visit https://www.youtube.com/watch?v=jajksuQw4mc for a great visualization
    of a CNN and max-pooling operation.


    # # Recurrent neural networks (RNN)


    Recurrent neural networks (RNN) can model sequential information. They do not
    assume that the data points are intensive. They perform the same task from the
    output of the previous data of a series of sequence data. This can also be thought
    of as memory. RNN cannot remember from longer sequences or time. It is unfolded
    during the training process, as shown in the following image:'
