  md: '# # Inpainting


    Inpainting is the process of filling a gap within the image, as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_223_0.png)


    The image on the left is the normal image and the one on the right is the processed
    image. As you can see from the image, the unwanted things are removed from the
    picture. Inpainting is useful for removing unwanted objects from the image, and
    also for filling in the space of scanned artwork.


    # # Blending


    Blending is the process of pasting a part of an image over another image smoothly,
    without artefacts. The image a shown here shows a case where one image is placed
    on another, which gives a bad impression. The images b and c represent the conventional
    blending techniques such as the **modified Poisson method** and a **multi-spline
    method**, respectively.'
