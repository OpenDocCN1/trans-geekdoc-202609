    # Segmenting instances


    While analyzing an image, our interest will only be drawn to certain instances
    in the image. So, it was compelled to segment these instances from the remainder
    of the image. This process of separating the required information from the rest
    is widely known as **segmenting instances**. During this process, the input image
    is first taken, then the bounding box will be localized with the objects and at
    last, a pixel-wise mask will be predicted for each of them. For each of class,
    pixel-level accuracy is calculated. There are several algorithms for segmenting
    instances. One of the recent algorithms is the Mask RCNN algorithm proposed by
    He at al. (https://arxiv.org/pdf/1703.06870.pdf). The following figure portrays
    the architecture of Mask R-CNN:


