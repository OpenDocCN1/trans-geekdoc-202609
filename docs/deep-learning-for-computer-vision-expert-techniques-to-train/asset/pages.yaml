- pgno: 124
  md: "The average number of objects is 7.2 per image. These are the famous datasets\
    \ for the object detection challenge. Next, we will learn how to evaluate the\
    \ algorithms against these datasets.\n\n# Evaluating datasets using metrics\n\n\
    Metrics are essential for understanding in the context of a deep learning task.\
    \ The metrics of object detection and localization are peculiar because of human\
    \ annotation. The human may have annotated a box that is called ground-truth.\
    \ The ground-truth is not the absolute truth. Moreover, the boxes can be a few\
    \ pixels different from human to human. Hence it becomes harder for the algorithm\
    \ to detect the exact bounding box drawn by humans. Intersection over Union (IoU)\
    \ is used to evaluate the localization task. Mean Precision Average (mAP) is used\
    \ to evaluate the detection task. We will see the descriptions of the metrics\
    \ in the next sections.\n\n# Intersection over Union\n\nIoU is the ratio of the\
    \ overlapping area of ground-truth and predicted area to the total area. Here\
    \ is a visual explanation of the metric:\n\n![](img/48c861eac4dc634fbf2a09fdbe884beb_124_0.png)\n\
    \nThe two squares represent the bounding boxes of ground truth and predictions.\
    \ The IoU is calculated as a ratio of the area of overlap to the area of the union.\
    \ Here is the script to compute the IoU using ground truth and prediction bounding\
    \ boxes:\n\n```\ndef calculate_iou(gt_bb, pred_bb):\n    :param gt_bb: ground\
    \ truth bounding box\n    :param pred_bb: predicted bounding box\n    gt_bb =\
    \ stack([\n        gt_bb[:,:, :, 0] - gt_bb[:,:, :, 2] / 2.0,\n        gt_bb[:,:,\
    \ :, 1] - gt_bb[:,:, :, 3] / 2.0,\n        gt_bb[:,:, :, 0] + gt_bb[:,:, :, 2]\
    \ / 2.0,\n    ])\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "# Object Detection\n\n# Chapter 4\n\n```\ngt_bb[:, :, :, 1] + gt_bb[:, :, :,\
    \ 3] / 2.0)\ngt_bb = tf.transpose(gt_bb, [1, 2, 3, 0])\npred_bb = tf.stack(\n\
    pred_bb[:, :, :, 0] - pred_bb[:, :, :, 2] / 2.0,\npred_bb[:, :, :, 1] - pred_bb[:,\
    \ :, :, 3] / 2.0,\npred_bb[:, :, :, 0] + pred_bb[:, :, :, 2] / 2.0,\npred_bb[:,\
    \ :, :, 1] + pred_bb[:, :, :, 3] / 2.0)\npred_bb = tf.transpose(pred_bb, [1, 2,\
    \ 3, 0])\narea = tf.maximum(0.0,\ntf.minimum(gt_bb[:, :, :, 2], pred_bb[:, :,\
    \ :, 2]) - \ntf.maximum(gt_bb[:, :, :, 0], pred_bb[:, :, :, 0]), 0) * 1)\nintersection_area\
    \ = area[:] * \\\nggt_bb_area = (gt_bb[:, :, :, 2] - gt_bb[:, :, :, 0]) * \\\n\
    (gt_bb[:, :, :, 3] - gt_bb[:, :, :, 1]) / 2\npred_bb_area = (pred_bb[:, :, :,\
    \ 2] - pred_bb[:, :, :, 0]) * \\\n(pred_bb[:, :, :, 3] - pred_bb[:, :, :, 1])\
    \ / 2\nunion_area = tf.maximum(gt_bb_area + pred_bb_area - intersection_area,\
    \ 1e-10)\niou = tf.clip_by_value(intersection_area / union_area, 0.0, 1.0)\nreturn\
    \ iou\n```\n\nThe ground truth and predicted bounding boxes are stacked. Then\
    \ the area is calculated while handling the case of negative area. The negative\
    \ area could occur when bounding box coordinates are incorrect. The right side\
    \ coordinates of the box may occur left to the left coordinates. Since the structure\
    \ of the bounding box is not preserved, the negative area is bound to occur. The\
    \ union and intersection areas are followed by a final IoU calculation which is\
    \ the ratio of the overlapping area of ground truth and predicted area to the\
    \ total area. The IoU calculation can be computed with algorithms to train localization\
    \ problems.\n\n# The mean average precision\n\nThe mAP is for evaluating detection\
    \ algorithms. The mAP metric is the product of precision and recall of the detected\
    \ bounding boxes. The mAP value ranges from 0 to 100. The higher the number, the\
    \ better it is. The mAP can be computed by average precision (AP) separately for\
    \ each class, then average over the class. A detection is considered a true positive\
    \ only if mAP is above 0.5. All detections from the test images can be combined\
    \ by drawing a detection/recall curve for each class. The final area under the\
    \ curve can be used for the comparison of algorithms. The mAP is a good measure\
    \ of the sensitivity of the network without making many false alarms. We have\
    \ learned the evaluating algorithms for the datasets. Next, we will look at algorithms\
    \ for a localization task.\n\n[ 111 ]"
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Localizing algorithms


    Localization algorithms are an extension of the materials learned in Chapter 2,
    Image Classification and Chapter 3, Image Retrieval. In image classification,
    an image is passed through several layers of a CNN (convolutional neural network).
    The final layer of CNN outputs the probabilistic value, belonging to each of the
    labels. This can be extended to localize the objects. We will see these ideas
    in the following sections.


    # Localizing objects using sliding windows


    An intuitive way of localization is to predict several cropped portions of an
    image with an object. The cropping of the images can be done by moving a window
    across the image and predicting for every window. The method of moving a smaller
    window than the image and cropping the image according to window size is called
    a sliding window. A prediction can be made for every cropped window of the image
    which is called sliding window detection.


    The prediction can be done by the deep learning model trained for image classification
    problems with closely-cropped means that only one object will be found in the
    whole image. The movement of the window has to be uniform across the image. Each
    portion of the image is passed through the model to find the classification. There
    are two problems with this approach.


    +   - It can only find objects that are the same size as the window. The sliding
    window will miss an object if the object size is bigger than the window size.
    To overcome this, we will use the concept of scale space.

    - Another problem is that moving the window over pixels may lead to missing a
    few objects. Moving the window over every pixel will result in a lot of extra
    computation hence will slow down the system. To avoid this, we will incorporate
    a trick in the convolutional layers.


    We will cover both these techniques in the next section.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# The scale-space concept


    The scale-space is the concept of using images that are of various sizes. An image
    is reduced to smaller size, hence bigger objects can be detected with the same-sized
    window. An image can be resized to some sizes with decreasing sizes. The resizing
    of images by removing alternative pixels or interpolation may leave some artefacts.
    The image is smoothened and resized iteratively. The images that are obtained
    by smoothening and resizing are scale.


    The window is slide on every single scale for the localization of objects. Running
    multiple scales is equivalent to running the image with a bigger window. The computational
    complexity of running on multiple scales is high. Localization can be sped up
    by moving faster with a trade-off for accuracy. The complexity makes the solution
    not usable in production. The idea of the sliding window could be made efficient
    with a fully convolutional implementation of sliding windows.


    # Training a fully connected layer as a convolution layer


    The problem with the sliding window is the computational complexity. The complexity
    is because predictions are made for every window. Deep learning features have
    been computed for every window for overlapping regions. Computation of features
    for overlapping regions in cropped windows can be reduced. The solution is to
    use a fully convolutional net, let''s first see how to convert a fully connected
    layer to a convolution_layer. The kernel is changed to the same size, with the
    same number of filters as the window. This is an easy way to convert a fully connected
    layer to a convolution_layer:


    ```

    convolution_layer_1 = convolution_layer(x_input_reshape, 64)

    pool_layer_1 = pooling(convolution_layer_1)

    convolution_layer_2 = convolution_layer(pooling_layer_1, 128)

    pool_layer_2 = pooling(convolution_layer_2)

    dense_layer_bottleneck = convolution_layer(pooling_layer_2, 1024, [5, 5])

    logits = convolution_layer(dense_layer_bottleneck, no_classes, [1, 1])

    logits = tf.reshape(logits, [-1, 10])

    ```


    The dense layers are expressed as convolution layers. This idea is powerful and
    useful in various scenarios. We will extend this idea to express sliding window
    as a full convolution network.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Convolution implementation of sliding window


    In this technique, instead of sliding, the final target is made into some targets
    required as depth and a number of boxes as the window. Sermanet et al. (https://arxiv.org/pdf/1312.6229.pdf)
    used fully convolution implementation to overcome this problem of the sliding
    window. Here is an illustration of such convolution implementation,


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_128_0.png)


    In the upper part of the example, normal classification is represented as a fully
    convolutional layer. In the lower part of the illustration, the same kernel is
    applied to a bigger image producing 2x2 at the end instead of 1. The final layer
    denotes four of the output of those bounding boxes. Having a volume for prediction
    improves efficiency, but the boxes still have a problem with accurate positioning.
    So the sliding window is not necessary, here it solves the complexity. The aspect
    ratio is always changing and has to be seen at multiple scales. The bounding boxes
    produced by the fully convolutional method are not very accurate. The extra computations
    are done only for the extra region. As we can imagine, the boxes are further restricted
    to the number of boxes that are trained with. Next, we will see a method to detect
    the bounding box positions more accurately.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Thinking about localization as a regression problem


    One fundamental way to think about localization is modeling the problem as a regression
    problem. The bounding box is four numbers and hence can be predicted in a direct
    manner with a setting for regression. We will also need to predict the label,
    which is a classification problem.


    There are different parametriz available to define the bounding boxes. There are
    four numbers usually for the bounding box. One of the representations is the center
    of the coordinates with the height and width of the bounding box. A pre-trained
    model can be used by removing the fully connected layer and replacing it with
    a regression encoder. The regression has to be regularized with the L2 loss which
    performs poorly with an outlier. The L1 loss is better than L1. Swapping regression
    with a smoothened version of regularization gives only a marginal performance
    improvement. whereas training the whole network gives a good accuracy. It''s a
    trade-off between training time and accuracy. Next, we will see different applications
    of regression using convolutional networks.


    # Applying regression to other problems


    Regressing image coordinates is applicable to several other applications, such
    as pose detection and fiducial point detection. Pose detection is the act of finding
    joint joint locations in a human, as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_129_0.png)'
  merge: -1
  img_proc: true
