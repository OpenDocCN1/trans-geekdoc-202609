- pgno: 254
  md: '# Approaches for classifying videos


    Using this snippet, all of the preceding datasets can be converted to frames.
    Note that this will require a lot of hard disk space.


    Videos have to be classified for several applications. Since the video is a lot
    of data, training and inference computations must also be accounted for. All video
    classification approaches are inspired by image classification algorithms. The
    standard architectures such as VGG, Inception, and so on are used for feature
    computation at a frame level and processed further. Concepts such as CNN, attention,
    and LSTM learned in previous chapters will be useful here. Intuitively, the following
    approaches can be used for video classification:


    +   - Extract the features and use the models learned Chapter 2, Image Classification,
    for classification on a frame basis.

    - Extract the image features learned in Chapter 3, Image Retrieval, and the features
    can be train an RNN as described in Chapter 7, Image Captioning.

    - Train a 3D convolution network on the whole video. 3D convolution is an extension
    of 2D convolution; we will see the workings of 3D convolution in detail in the
    following sections.

    - Use the optical flow of the video to further improve the accuracy. Optical flow
    is the pattern of movement of objects, which we will see in detail in coming sections.


    We will see several algorithms that give good accuracy with various computational
    complexities. The dataset can be prepared by converting it into frames and subsampling
    it to the same length. Some preprocessing can help, as subtracting the mean of
    the Imagenet.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Fusing parallel CNN for video classification


    Frame-wise, the prediction of a video may not yield good results due to the downsampling
    of images, which loses fine details. Using a high-resolution CNN will increase
    the inference time. Hence, Karpathy et al. (https://static.usercontent.com/media/research.google.com/en/pubs/archive/42455.pdf)
    propose fusing two streams that are run in parallel for video classification.
    There are two problems with doing frame-wise predictions, namely:


    +   - Predictions may take a long time because of the larger CNN architecture

    - Independent predictions lose the information along the temporal dimension


    The architecture can be simplified with fewer parameters with two smaller encoders
    running in parallel. The video is passed simultaneously through two CNN encoders.
    One encoder takes a low resolution and processes high resolution. The encoder
    has alternating convolution, normalization, and pooling layers. The final layer
    of the two encoders are connected through the fully connected layer. The other
    encoder is of the same size, but takes only the central crop, as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_255_0.png)


    > Reproduced from Karpathy et al.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Video Classification


    Parallel processing of frames makes the runtime faster by downsampling the video.
    The CNN architecture is halved regard the parameter while maintaining the same
    accuracy. The two streams are called the fovea and context streams. The streams
    are shown in the following code snippet:


    ```

    high_resolution_input = tf.placeholder(tf.float32, shape=[None, input_size])

    low_resolution_input = tf.placeholder(tf.float32, shape=[None, input_size])

    y_input = tf.placeholder(tf.float32, shape=[None, no_classes])

    high_resolution_cnn = get_model(high_resolution_input)

    low_resolution_cnn = get_model(low_resolution_input)

    dense_layer_1 = tf.concat([high_resolution_cnn, low_resolution_cnn], 1)

    dense_layer_bottleneck = dense_layer(dense_layer_1, 1024)

    logits = dense_layer(dense_layer_bottleneck, no_classes)

    ```


    The frames for processing across temporal dimensions are shown in the following
    diagram:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_256_0.png)


    > Reproduced from Karpathy et al.


    Instead of using fixed size clips, the video can be at different times. Three
    ways of connecting the temporal information are presented in the preceding image.
    Late fusion requires a longer time frame while early fusion sees a few frames
    together. Slow fusion combines both late and early fusion to give good results.
    The model was trained on the Sports1 dataset, which has 487 classes and achieved
    an accuracy of 50%. The same model, when applied to UCF101, achieves an accuracy
    of 60%.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Classifying videos over long periods


    The fusion method works for short video snippets. Classifying longer videos is
    difficult as a lot of frames have to be computed and remembered. Ng et al. (https://www.cv-foundation.org/openaccess/content_cvpr_2015/papers/Ng_Beyond_Short_Snippets_2015_CVPR_paper.pdf)
    proposed two methods for classifying longer videos:


    +   - The first approach is to pool the convolutional features temporally. Max-pooling
    is used as a feature aggregation method.

    - The second approach has an LSTM connecting the convolutional features that handle
    the variable length of the video.


    Both approaches are shown in the following image:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_257_0.png)'
  merge: -1
  img_proc: true
