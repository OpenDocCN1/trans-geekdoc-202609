  md: "# Monitoring loss and accuracy using TensorBoard\n\nThe training loss and accuracy\
    \ can be monitored using TensorBoard. Run the TensorBoard\nusing the following\
    \ command:\n\n```\ntensorboard --logdir=/home/ubuntu/Chapter04\n```\n\nBoth training\
    \ and evaluation can be visualized in the TensorBoard.\n\n# Training a pedestrian\
    \ detection for a self-driving car\n\nThe dataset for training a pedestrian object\
    \ detection can be found at http://pascal.\ninralpes.fr/data/human/. The steps\
    \ to detecting pedestrians can be found at https://\ngithub.com/diegocalca/machine-learning/blob/supervised/object.\n\
    detection_tensorflow/simple.detection.ipynb. The dataset for training a Sign Detector\n\
    can be downloaded from http://vision.ee.ethz.ch/timofter/traffic_signs/\nand http://bitsd.ethz.ch/shareddata/.\
    \ In the case of a self-driving car, there would be\nclasses in an image for labeling:\
    \ pedestrian, car, motorcycle, and background. The\nbackground class has to be\
    \ detected when none of the classes is present. An assumption\ntraining a deep\
    \ learning classification model is at least one of the objects will be present\n\
    in the image. By adding the background class, we are overcoming the problem. The\
    \ neural\nnetwork can also produce a bounding box of the object from the label.\n\
    \n# The YOLO object detection algorithm\n\nA recent algorithm for object detection\
    \ is You look only once (YOLO). The image is divided\ninto multiple grids. Each\
    \ grid cell of the image runs the same algorithm. Let’s start the\nimplementation\
    \ by defining layers with initializers:\n\n```\ndef pooling_layer(input_layer,\
    \ pool_size=[2, 2], strides=2,\npadding='valid'):\n    layer = tf.layers.max_pooling2d(\n\
    \        inputs=input_layer,\n        pool_size=pool_size,\n        strides=strides,\n\
    \        padding=padding\n    )\n    add_variable_summary(layer, 'pooling')\n\
    \    return layer\n```"
