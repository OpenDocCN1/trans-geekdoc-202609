- pgno: 88
  md: '# Image Classification


    We can combine the augmentation techniques that were covered earlier with shear,
    zoom, and flip. The generator can be added with flow from the directory with both
    the train and validation datasets. Now the model can be fine-tune combined with
    data augmentation. This way of training gives a better accuracy than all the previous
    methods. The following is a guide for transfer learning:


    | Data Size | Similar Dataset | Different Dataset |

    | Smaller data | Fine-tune the output layers | Fine-tune the deeper layer |

    | Bigger data | Fine-tune the whole model | Train from scratch |


    Depending on the data size, the number of layers to fine-tune can be determined.
    The less data there is, the lesser of the layers to fine-tune. We have seen how
    to improve the accuracy of the model using transfer learning techniques.


    # Developing real-world applications


    Recognizing cats and dogs is a cool problem but less likely a problem of importance.
    Real-world applications of image classification in products may be different.
    You may have different data, targets, and so on. In this section, you will learn
    the tips and tricks to tackle different settings. The factors that should be considered
    when approaching a new problem are as follows:


    +   - The number of targets. Is it a 10 class problem or 10,000 class problem?

    - How is vast the intra-class variance? For example, does the different type of
    cats have to be identified under one class label?

    - How is vast the inter-class variance? For example, do the different cats have
    to be identified?

    - How big is the data?

    - How balanced is the data?

    - Is there already model that is trained with a lot of images?

    - What is the requisite for deployment inference time and model size? If it is
    50 milliseconds on an iPhone or 10 milliseconds on Google Cloud Platform? How
    much RAM can be consumed to store the model?


    To answer these questions when approaching an image classification problem. Based
    on the answers, you can design the training architecture and improve the accuracy
    as described in the next section.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Choosing the right model


    There are a lot of options for architectures. Based on the flexibility of deployment,
    you can choose the model. Remember that convolution is smaller and slower, dense
    layers are bigger and faster. There is a trade-off between size, runtime, and
    accuracy. It is advisable to test out all the architectures before the final decision.
    Some models work better than others, based on the application. You can reduce
    the input size to make the inference faster. Architectures can be selected based
    on the metrics as described in the following section.


    # Tackling the underfitting and overfitting scenarios


    The model may be sometimes too big or too small for the problem. This could be
    classified as underfitting or overfitting, respectively. Underfitting happens
    when the model is too small and can be measured when training accuracy is. Overfitting
    happens when the model is too big and there is a large gap between training and
    testing accuracies. Underfitting can be solved by the following methods:


    +   * Getting more data

    * Trying out a bigger model

    * If the data is small, transfer learning techniques or do data augmentation


    Overfitting can be solved by the following methods:


    +   * Regularizing using techniques such as dropout and batch normalization

    * Augmenting the dataset


    Always watch for loss. The loss should be decreasing over iterations. If the loss
    is decreasing, it signals that training has stopped. One solution is to try out
    a different optimizer. Class imbalance can be dealt with by weighting the loss
    function. Always use Tensor to watch the summaries. It is difficult to estimate
    how much data is needed. This section is the best lesson on training any deep
    learning models. Next, we will cover some application-specific guidance.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Gender and age detection from face


    Applications may require gender and age detection from a face. The face image
    can be obtained by face detectors. The cropped images of faces can be supplied
    as training data, and the similar cropped face should be given for inference.
    Based on the required inference time, OpenCV or CNN face detectors can be selected.
    For training, Inception or ResNet can be used. If the required inference time
    is less because it is a video, it''s better to use three convolutions followed
    by two fully connected layers. Note that there is usually a huge class imbalance
    in age datasets, hence using a different metric like precision and recall will
    be helpful.


    # Fine-tuning apparel models


    Fine-tuning of apparel models is a good choice. Having multiple softmax layers
    that classify attributes will be useful here. The attributes could be a pattern,
    color, and so on.


    # Brand safety


    Training bottleneck layers with Support Vector Machine (SVM) is a good option
    as the images can be quite different among classes. This is typically used for
    content moderation to help avoid images that are explicit. You have learned how
    to approach new problems in image classification.


    # Summary


    We have covered basic, yet useful models for classification tasks. We saw a simple
    model for MNIST dataset with both Keras and TensorFlow APIs. We also saw how to
    utilize TensorBoard for watching the training process. Then, we discussed state-of-the-art
    architectures with some specific applications. Several ways to increase the accuracy
    such as data augmentation, training on bottleneck layers, and fine-tuning a pre-trained
    model were also covered. Tips and tricks to train models for new models were also
    presented.


    In the next chapter, we will see how to visualize the deep learning models. We
    will also deploy the trained models in this chapter for inference. We will also
    see how to use the trained layers for the application of an image search through
    an application. Then, we will understand the concept of autoencoders and use it
    for the dimensionality of features.'
