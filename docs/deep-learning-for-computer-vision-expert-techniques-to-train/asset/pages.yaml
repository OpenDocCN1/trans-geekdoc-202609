- pgno: 148
  md: '# Algorithms for semantic segmentation


    There are several deep learning-based algorithms that were proposed to solve image
    segmentation tasks. A sliding window approach can be applied at a pixel level
    for segmentation. A sliding window approach takes an image and breaks the image
    into smaller crops. Every crop of the image is classified for a label. This approach
    is expensive and inefficient because it does not reuse the shared features between
    the overlapping patches. In the following sections, we will discuss a few algorithms
    that can overcome this problem.


    # The Fully Convolutional Network


    The Fully Convolutional Network (FCN) introduced the idea of an end-to-end convolutional
    network. Any standard CNN architecture can be used for FCN by removing the fully
    connected layers, and the implementation of the same was shown in Chapter 4, Object
    Detection. The fully connected layers are replaced by a convolution layer. The
    depth is higher in the final layers and the size is smaller. Hence, 1D convolution
    can be performed to reach the desired number of labels. But for segmentation,
    the spatial dimension has to be preserved. Hence, the full convolution network
    is constructed without a max pooling, as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_148_0.png)


    The loss for this network is computed by averaging the cross-entropy loss of every
    pixel and mini-batch. The final layer has a depth equal to the number of classes.
    FCN is similar to object detection except that the spatial dimension is preserved.
    The output produced by the architecture will be coarse as some pixels may be mispredicted.
    The computation and in the next section, we will see how to address this issue.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# The SegNet architecture


    The SegNet has an encoder and decoder approach. The encode has various convolution
    layers and decoder deconvolution layers. SegNet improved the coarse outputs produced
    by FCN. Because of this, it is less intensive on memory. When the features are
    reduced in dimensions, it is upsampled to the image size by deconvolution, reversing
    the convolution effects. Deconvolution learns the parameters for upsampling. The
    output of such architecture will be coarse due to the loss of information in pooling
    layers.


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_149_0.png)


    Now, let''s learn the few new concepts called upsampling, atrous convolution,
    and transpose convolution that will help us in understanding this network better.


    # Upsampling the layers by pooling


    In Chapter 1, Getting Started, we discussed max pooling. Max pooling is a sampling
    strategy that picks the maximum value from a window. This could be reversed for
    upsampling. Each value can be surrounded with zeros to upsample the layer, as
    shown here:


    | 1 | 0 | 2 | 0 |

    |---|---|---|---||

    | 1 | 2 | 0 | 0 |

    | 3 | 4 | 3 | 4 | 0 |

    | 0 | 0 | 0 | 0 |'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Semantic Segmentation


    # Chapter 5


    The zeros are added at the same locations which are the numbers that are upsampled.
    Unpooling can be improved by remembering the locations of downsampling and using
    it for upsampling, as shown here:


    | | 0 | 0 | 2 | 0 |

    |---|---|---|---|---|

    | 1 | 2 | 0 | 1 | 0 |

    | 3 | 4 | 0 | 0 | 0 |

    | | 3 | 0 | 0 | 4 |


    Index-wise, upsampling yields better results than appending zeros. This upsampling
    the layers by pooling is not learned and works as it is. Next, we will see how
    we can upsample and downsample with learnable parameters.


    # Sampling the layers by convolution


    The layers can be upsampled or downsampled directly using convolution. The stride
    used for convolution can be increased to cause downsampling as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_150_0.png)


    Downsampling by convolution is called atrous convolution or dilated convolution
    or strided convolution. Similarly, it can be reversed to upsample by learning
    a kernel as shown here:


    [ 136 ]'
