  md: '# Image Classification


    # Chapter 2


    Training a deep network on a small dataset results in overfitting. This kind of
    overfitting can also be avoided using the fine-tuning procedure. The model trained
    on a bigger dataset should be similar, as we are hoping that the activations and
    features are similar to the smaller dataset. You can start with the stored weights
    path as follows:


    ```

    top_model_weights_path = ''fc_model.h5''

    ```


    Load the Visual Geometry Group (VGG) model and set the initial layers to be non-trainable.
    The VGG model will be covered in detail in the following section. For now, consider
    VGG as a big deep learning model that works well on image data. Replace the fully
    connected layers with new trainable layers using the code given as:


    ```

    model = tf.keras.applications.VGG16(include_top=False)

    ```


    A small two-layer forward network can be built on top of the VGG model with usually
    hidden activations, and drop out as follows:


    ```

    model_fine_tune = tf.keras.models.Sequential()

    model_fine_tune.add(tf.keras.layers.Flatten(input_shape=model.output_shape))

    model_fine_tune.add(tf.keras.layers.Dense(256, activation=''relu''))

    model_fine_tune.add(tf.keras.layers.Dropout(0.5))

    model_fine_tune.add(tf.keras.layers.Dense(no_classes,

    activation=''softmax''))

    ```


    The top model also has to be loaded with weights that are already trained. The
    top model can then be added to the convolutional base:


    ```

    model_fine_tune.load_weights(top_model_weights_path)

    model.add(model_fine_tune)

    ```


    We can set the top 25 layers to be non-trainable up to the last convolution block
    so that their weights will not be updated. The rest of the layers will be updated:


    ```

    for vgg_layer in model.layers[:25]:

    vgg_layer.trainable = False

    ```


    Compile the model with the gradient descent optimizer at a slow learning rate
    with a magnitude of order of 4:


    ```

    model.compile(loss=''binary_crossentropy'',

    optimizer=tf.keras.optimizers.SGD(lr=1e-4, momentum=0.9),

    metrics=[''accuracy''])

    ```'
