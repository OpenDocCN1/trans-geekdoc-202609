    The dataset has 11,530 images for training and validations with 27,450 annotations
    for regions of interest. The following are the twenty classes present in the dataset:


    +   * Person

    * Animal: Bird, cat, cow, dog, horse, sheep

    * Vehicle: Airplane, bicycle, boat, bus, car, motorbike, train

    * Indoor: Bottle, chair, dining table, potted plant, sofa, tv/monitor


    You can download the dataset from http://host.robots.ox.ac.uk/pascal/VOC/voc2012/VOCtrain_11-May-2012.tar.
    There is an average of 2.4 objects per image.


    # COCO object detection challenge


    The Common Objects in Context (COCO) dataset has 200,000 images with more than
    500,000 object annotations in 80 categories. It is the most extensively publicly
    available object detection database. The following image has the list of objects
    present in the dataset:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_123_0.png)'
