  md: 'There are nine inception modules with a total of 100 layers and they achieve
    good performance.


    # # The Microsoft ResNet-50 model


    **ResNet** was proposed by He et al. (https://arxiv.org/pdf/1512.03385.pdf) and
    won the ImageNet competition in 2015. This method showed that deeper networks
    can be trained. The deeper the network, the more saturated the accuracy becomes.
    It''s not even due to overfitting or due to the presence of a high number of parameters,
    but due to a reduction in the training error. This is due to the inability to
    backpropagate the gradients. This can be overcome by sending the gradients directly
    to the deeper layers with a residual block as follows:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_77_0.png)


    Every two layers are connecting a residual block. You can see that the training
    passed between the layers. By this technique, the backpropagation can carry the
    error to earlier layers.


    +   - The model definitions can be used from https://github.com/tensorflow/tensorflow/tree/r1.4/tensorflow/python/keras/impl/keras/applications.
    Every layer in the model is defined and pre-trained weights on the ImageNet dataset
    are available.


    # # The SqueezeNet model


    The SqueezeNet model was introduced by Iandola et al. (https://arxiv.org/pdf/1602.07360.pdf),
    to reduce the model size and the number of parameters.'
