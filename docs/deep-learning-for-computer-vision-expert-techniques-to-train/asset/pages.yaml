- pgno: 249
  md: '# 9 Video Classification


    In this chapter, we will see how to train deep learning models for video data.
    We will start classifying videos on a frame basis. Then, we will use the temporal
    information for better accuracy. Later, we will extend the applications of images
    to videos, including pose estimation, captioning, and generating videos.


    We will cover the following topics in this chapter:


    +   - The datasets and the algorithms of video classification

    - Splitting a video into frames and classifying videos

    - Training a model for visual features on an individual frame level 0

    - Understanding 3D convolution and its use in videos

    - Incorporating motion vectors on video

    - Object tracking utilizing the temporal information

    - Applications such as human pose estimation and video captioning


    # Understanding and classifying videos


    A video is nothing but a series of images. Video brings a new dimension to the
    image along the temporal direction. The spatial features of the images and temporal
    features of the video can be put together, providing a better outcome than just
    the image. The extra dimension also results in a lot of space and hence increases
    the complexity of training and inference. The computational demands are extremely
    high for processing a video. Video also changes the architecture of deep learning
    models as we have to consider the temporal features.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Video Classification


    # Chapter 9


    Video classification is the task of labeling a video with a category. A category
    can be on the frame level or for the whole video. There could be actions or tasks
    performed in the video. Hence, a video classification may label the objects present
    in the video or label the actions happening in the video. In the next section,
    we will see the available datasets for video classification tasks.


    # Exploring video classification datasets


    Video classification is the major problem that is studied with video data. Several
    videos taken and labelled with various objects or actions that are associated
    with the data. The datasets vary according to size, quality, and the type of labels.
    Some even include multiple labels for video. The videos are rather usual in length.
    A long video may have various actions performed and hence can be segmented temporally,
    before classifying the cut video segments or snippets individually. Next, we will
    consider the details of some specific datasets.


    # UCF101


    The University of Central Florida (UCF101) is a dataset for action recognition.
    The videos are collected on YouTube and consist of realistic actions. There are
    101 action categories available in this dataset. There is another dataset called
    UCF50 which has 50 categories. There are 13,320 videos in this dataset across
    the actions. The videos have a diversified variation of background, scale, pose,
    occlusion, and illumination conditions. The action categories are grouped into
    25, which share similar variations such as the background, pose, viewpoint, illumination
    and so on.'
  merge: -1
  img_proc: true
