- pgno: 15
  md: '# Preface


    Deep Learning for Computer Vision is a book intended for readers who want to learn
    deep-learning-based computer vision techniques for various applications. This
    book will give the reader tools and techniques to develop computer-vision-based
    products. There are plenty of practical examples covered in the book to follow
    the theory.


    # Who this book is to for


    The reader wants to know how to apply deep learning to computer vision problems
    such as classification, detection, retrieval, segmentation, generation, captioning,
    and video classification. also wants to understand how to achieve good accuracy
    under various constraints such as less data, unbalanced classes and noise. Then
    the reader wants to know how to deploy trained models on various platforms (AWS,
    Google Cloud, Raspberry Pi, and mobile phones). After completing this book, the
    reader should be able to develop code for problems of person detection, face recognition,
    product search, medical image segmentation, image generation, image captioning,
    video classification, and so on.


    # What this book covers


    +   Chapter 1, Getting Started, introduces the basics of deep learning and makes
    the readers familiar with the vocabulary. The readers will install the software
    packages necessary to follow the rest of the chapters.


    +   Chapter 2, Image Classification, talks about the image classification problem,
    which is labeling an image as a whole. The readers will learn about image classification
    techniques and train a deep learning model for pet classification. They will also
    learn methods to improve accuracy and dive deep into variously advanced architectures.


    +   Chapter 3, Image Retrieval, covers deep features and image retrieval. The
    reader will learn about various methods of obtaining model visualization, visual
    features, inference using TensorFlow, and serving and using visual features for
    product retrieval.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Preface


    Chapter 4, Object Detection, talks about detecting objects in images. The reader
    will learn about various techniques of object detection and apply them for pedestrian
    detection. The TensorFlow API for object detection will be utilized in this chapter.


    Chapter 5, Semantic Segmentation, covers segmentation of images pixel-wise. The
    readers will earn about segmentation techniques and train a model for segmentation
    of medical images.


    Chapter 6, Similarity Learning, talks about similarity learning. The readers will
    learn about similarity matching and how to train models for face recognition.
    A model to train landmark is illustrated.


    Chapter 7, Image Captioning, is about generating or selecting captions for images.
    The readers will learn natural language processing techniques and how to generate
    captions for images using these techniques.


    Chapter 8, Generative Models, talks about generating synthetic images for various
    purposes. The readers will learn what generative models are and use them for image
    generation applications, such as style transfer, training data, and so on.


    Chapter 9, Video Classification, covers computer vision techniques for video data.
    The readers will understand the key differences between solving video versus image
    problems and implement video classification techniques.


    Chapter 10, Deployment, talks about the deployment steps for deep learning models.
    The reader will learn how to deploy trained models and optimize for speed on various
    platforms.


    # To get the most out of this book


    The examples covered in this book can be run with Windows, Ubuntu, or Mac. All
    the installation instructions are covered. Basic knowledge of Python and machine
    learning is required. It is preferable that the reader has GPU hardware but it''s
    not necessary.


