    +   * MPII Movie Description Corpus (MPII-MD) can be obtained from: https://www.mpi-inf.mpg.de/departments/computer-vision-and-multimodal-computing/research/vision-and-language/mpi-movie-description-dataset.
    It has 68,000 sentences with 94 movies.'
