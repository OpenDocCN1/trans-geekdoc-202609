    The face recognition or facial recognition is the process of identifying a personage
    from a digital image or a video. Let''s learn about the datasets available for
    face recognition in the next sections.


    # The labeled faces in the wild (LFW) dataset


    The LFW dataset contains 13,233 faces with 5,749 unique people and is considered
    as the standard dataset to evaluate face verification datasets. The dataset can
    be accessed in the link http://vis-www.cs.umass.edu/lfw/'
