- pgno: 234
  md: 'A new model is now created, that can output all the layers and assign the target
    variables,

    using the following code:


    ```

    layers_model = Model(model.input, layers)

    targs = [K.variable(o) for o in layers_model.predict(style_arr)]

    ```


    Style loss is calculated using the Gram matrix. The Gram matrix is the product
    of a matrix

    and its transpose. The activation values are simply transposed and multiplied.
    This matrix

    is used for computing the error between the style and random images. The Gram

    matrix loses the location information but will preserve the texture information.
    We will

    define the Gram matrix using the following code:


    ```

    gramian_matrix(matrix):

    flattened_matrix = K.batch_flatten(K.permute_dimensions(matrix, (2, 0, 1)))

    matrix_transpose_dot = K.dot(flattened_matrix,

    K.transpose(flattened_matrix))

    element_count = matrix.get_shape().num_elements()

    return matrix_transpose_dot / element_count

    ```


    As you might be aware now, it is a measure of the correlation between the pair
    of columns.

    The height and width dimensions are flattened out. This doesn''t include any local
    pieces of

    information, as the coordinate information is disregarded. Style loss computes
    the mean

    squ error between the Gram matrix of the input image and the target, as shown
    in the

    following code:


    ```

    style_mse_loss(x, y):

    return metrics.mse(gramian_matrix(x), gramian_matrix(y))

    ```


    Now, let''s compute the loss by summing up the activations from the various layers,

    using the following code:


    ```

    style_loss = sum(style_mse_loss(l1[0], l12[0]) for l11, l12 in

    zip(style_features, style_targets))

    grad = K.gradients(style_loss, vgg_model.input)

    style_fn = K.function([vgg_model.input], [style_loss]+style_image_shape)

    optimiser = ConvexOptimiser(style_fn, style_image_shape)

    ```


    We then solve it the same way we did before, by creating a random image. But this
    time,

    we will also apply a Gaussian filter, as shown in the following code:


    ```

    generated_image = generate_rand_img(style_image_shape)

    ```'
