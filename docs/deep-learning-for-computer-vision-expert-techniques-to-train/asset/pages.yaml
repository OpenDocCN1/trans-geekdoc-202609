- pgno: 154
  md: 'This algorithm is utilized for an example of satellite imagery in a later section.


    # ## Dilated convolutions


    The pixel-wise classification and image classification are structurally different.
    Hence, pooling layers that decrease information will produce coarse segmentation.
    Hence, remember, pooling is essential for having a wider view and allows sampling.
    A new idea called **dilated convolution** was introduced to solve this problem
    for less-lossy sampling while having a wider view. The dilated convolution is
    essentially convolution by skipping every pixel in the window as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_154_0.png)


    The dilation distance varies from layer to layer. The output of such a segmentation
    result is upscaled for a finer resolution. A separate network is trained for multi-scale
    aggregation.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# DeepLab


    DeepLab proposed by Chen et al. (https://arxiv.org/pdf/1606.00915.pdf) performs
    convolutions on multiple scales and uses the features from various scales to obtain
    a score map. The score map is then interpolated and passed through a conditional
    random field (CRF) for final segmentation. This scale processing of images can
    be either performed by processing images of various sizes with its own CNN or
    parallel convolutions with varying level of dilated convolutions.


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_155_0.png)


    Reproduced with permission from Chen et al.'
  merge: -1
  img_proc: true
