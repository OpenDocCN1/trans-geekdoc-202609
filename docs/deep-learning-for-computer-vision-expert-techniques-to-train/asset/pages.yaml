    # # Building the retrieval pipeline


    The sequence of steps to get the best matches from target images for a query image
    is called the **retrieval pipeline**. The retrieval pipeline has multiple steps
    or components. The features of the image database have to be extracted offline
    and stored in a database. For every query image, the feature has to be extracted
    and similarity has to be computed across all of the target images. Then the images
    can be ranked for final output. The retrieval pipeline is shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_109_0.png)'
