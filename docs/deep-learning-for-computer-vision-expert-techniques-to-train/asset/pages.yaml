- pgno: 84
  md: '# Augmentation techniques


    There are various ways to augment the images as described as follows:


    +   - **Flipping**: The image is mirrored or flipped in a horizontal or vertical
    direction

    - **Random Cropping**: Random portions are cropped, hence the model can deal with
    occlusions

    - **Shearing**: The images are deformed to affect the shape of the objects

    - **Zooming**: Zoomed portions of images are trained to deal with varying scales
    of images

    - **Rotation**: The objects are rotated to deal with various degrees of change
    in objects

    - **Whitening**: The whitening is done by a Principal Component Analysis that
    preserves only the important data

    - **Normalization**: Normalizes the pixels by standardizing the mean and variance

    - **Channel shifting**: The color channels are shifted to make the model robust
    to color changes caused by various artifacts


    All these techniques are implemented in ImageDataGenerator to increase the dataset
    size. The following is a modified version of generator_train with some augmentation
    techniques discussed previously


    ```

    generator_train = tf.keras.preprocessing.image.ImageDataGenerator(

    rescale=1. / 255,

    horizontal_flip=True,

    zoom_range=0.3,

    shear_range=0.3,)

    ```


    Replacing the generator_train in the preceding code will increase the accuracy
    to 90%. Change the parameters of augmentation and notice the changes. We will
    discuss a technique called transfer learning in the following section, which helps
    in training bigger models with fewer data.


    # Transfer learning or fine-tuning of a model


    Transfer learning is the process of learning from a pre-trained model that was
    trained on a larger dataset. Training a model with random initialization takes
    some time and energy to get the result. Initializing the model with a pre-trained
    model gives faster convergence, saving time and energy. These models that are
    pre-trained are often trained with carefully hyperparameters'
  merge: -1
  img_proc: true
