    The GCP has a Cloud Machine Learning Engine that helps us while using TensorFlow.
    There are three components of GCP that can be utilized for architecting training
    and deployment infrastructure:


    +   1. Cloud DataFlow for preprocessing the images

    2. Cloud Machine Learning Engine for both training and deploying a model

    3. Google Cloud Storage for storing training data, code and results


    > TIP An excellent tutorial to build a customized image classification model using
    the Cloud Machine Learning Engine can be found at https://cloud.google.com/ml-engine/docs/flowers-tutorial.


    # Deployment of models in devices


    TensorFlow models can be deployed in mobile devices. Mobile devices include smartphones,
    drones, home robots and so on. Billions of smartphones have applications of computer
    vision which use deep learning. One can take a photo and search, stream a video
    with scenes tagged and so on. Deploying in mobile devices means that the deep
    learning model is present on the device and inference happens on the device. Models
    deployed on the device helps in privacy issues. In the following topics, we will
    discuss how to deploy them across various mobile platforms.'
