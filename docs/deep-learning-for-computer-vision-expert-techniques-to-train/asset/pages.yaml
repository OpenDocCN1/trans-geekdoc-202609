- pgno: 195
  md: '# Image Captioning


    In this chapter, we will deal with the problem of captioning images. This involves
    detecting the objects and also coming up with a text caption for the image. Image
    captioning can also be called **Image to Text translation**. Once thought a very
    tough problem, we have reasonably good results on this now. For this chapter,
    a dataset of images with corresponding captions. In this chapter, we will discuss
    the techniques and applications of image captioning in detail.


    We will cover the following topics in this chapter:


    +   * Understand the different datasets and metrics used to evaluate them

    * Understand some techniques used for natural language processing problems

    * Different words for vector models

    * Several algorithms for image captioning

    * Adverse results and scope for improvement


    # Understanding the problem and datasets


    The process of automatically generating captions for images is a key deep learning
    task, as it combines the two worlds of language and vision. The uniqueness of
    the problem makes it one of the primary problems in computer vision. A deep learning
    model for image captioning should be able to identify the objects present in the
    image and also generate text in natural language expressing the relationship between
    the objects and actions. There are few datasets for this problem. The most famous
    of the datasets is an extension of the COCO dataset covered in object detection
    in Chapter 4, Object Detection.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Understanding natural language processing for image captioning


    As natural language has to be generated from the image, getting familiar with
    natural language processing NLP becomes important. The concept of NLP is a vast
    subject, and here we will limit our scope to topics that are relevant to image
    captioning. One form of natural language is text. The text is a sequence of words
    or characters. The atomic element of text is called token, which is a sequence
    of characters. A character is an atomic element of text.


    In order to process any natural language in the form of text, the text has to
    be preprocessed by removing punctuation, brackets and so on. Then, the words have
    to be tokenized into words by separating them into spaces. Next, we will see how
    this vector conversion can help.


    # Expressing words in vector form


    Words expressed in vector form can perform arithmetic operations on themselves.
    The vector has to be compact, with less dimension. Synonyms should have similar
    vectors and antonyms should have a different vector. Words can be converted to
    vectors so that relations can be compared as shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_196_0.png)


    This vector arithmetic enables comparison in semantic space between different
    entities. Next, we will see how to create a deep learning model that can convert
    words to a vector representation.'
  merge: -1
  img_proc: true
