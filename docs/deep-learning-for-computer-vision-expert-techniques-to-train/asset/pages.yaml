  md: '# Face detection


    Face detection is similar to the object detection, that we discussed in Chapter
    4, Object Detection. The locations of the faces have to be detected from an image.
    A dataset called Face Detection Data Set and Benchmark (FDDB) can be downloaded
    from http://vis-cs.umass.edu/f/. It has 2,845 images with 5,171 faces. Another
    dataset called wider face can be downloaded from http://mmlab.ie.cuhk.edu.hk/projects/WIDERFACE/
    proposed by Yang et al. It has 32,203 images with 393,703 faces. Here is a sample
    of images from the wider face dataset:


    | Scale | Pose | Occlusion | Expression | Makeup | Illumination |

    | --- | --- | --- | --- | --- | --- |

    | | | | | | |

    | | | | | | |

    | | | | | | |


    > Proposed by Yang et al. and reproduced from: http://mmlab.ie.cuhk.edu.hk/projects/WIDERFACE/support/intro.jpg


    +   * Face alignment: Transforming the face into a frontal face for further analysis

    * Attribute recognition: Finding attributes such as gender, smiling and so on

    * Emotion analysis: Analysing the emotions of persons

    * Face verification: Finding whether two images belong to the same person

    * Face recognition: Finding an identity for the face

    * Face clustering: Grouping the faces of the same person together


    Let''s learn about the datasets and implementation of these tasks in detail, the
    following sections.'
