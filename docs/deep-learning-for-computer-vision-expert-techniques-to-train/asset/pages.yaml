- pgno: 92
  md: '# Understanding visual features


    Deep learning models are often criticized for not being interpretable. A neural
    network-based model is often considered to be like a black box because it''s difficult
    for humans to reason out the working of a deep learning model. The transformations
    of an image over layers by deep learning models are non-linear due to activation
    functions, so cannot be easily visualized. There are methods that have been developed
    to tackle the criticism of the non-interpretation by visualizing the layers of
    the deep network. In this section, we will look at the attempts to visualize the
    deep layers in an effort to understand how a model works.


    Visualization can be done using the activation and gradient of the model. The
    activation can be visualized using the following techniques:


    +   * **Nearest neighbour**: A layer activation of an image can be taken and the
    nearest images of activation can be seen together.

    * **Dimensionality reduction**: The dimension of the activation can be reduced
    by principal component analysis (PCA) or t-Distributed Stochastic Neighbor Embedding
    (t-SNE) for visualizing in two or three dimensions. PCA reduces the dimension
    by projecting the values in the direction of maximum variance. t-SNE reduces the
    dimension by mapping the closest points to three dimensions. The use of dimensionality
    reduction and its techniques are out of the scope of this book. You are advised
    to refer to basic machine learning material to learn more about dimensionality
    reduction.


    Wikipedia is a good source for understanding dimensionality reduction techniques.
    Here are few links that you can refer to:


    +   * https://en.wikipedia.org/wiki/Dimensionality_reduction

    * https://en.wikipedia.org/wiki/Principal_component_analysis

    * https://en.wikipedia.org/wiki/T-distributed_stochastic_neighbor_embedding

    * https://en.wikipedia.org/wiki/Locality-sensitive_hashing


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_92_0.png)'
  merge: -1
  img_proc: true
