    or weights given to certain areas can be used for visualization. Sharma et al.
    (https://arxiv.org/pdf/1511.04119.pdf) used this idea to classify the videos.
    LSTM were used to take the convolution features. LSTM predicts the regions by
    using attention on following frames, as shown in the following image:


