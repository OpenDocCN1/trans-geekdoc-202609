- pgno: 35
  md: 'LSTM has several gates: forget, input, output. Forget gate maintains the information
    previous state. The input gate updates the current state using the input. The
    output gate decides the information be passed to the next state. The ability to
    forget and retain only the important things enables LSTM to remember over a longer
    time period. You have learned the deep learning vocabulary that will be used throughout
    the book. In the next section, we will see how deep learning can be used in the
    context of computer vision.


    # Deep learning for computer vision


    Computer vision enables the properties of human vision on a computer. A computer
    could be in the form of a smartphone, drones, CCTV, MRI scanner, and so on, with
    various sensors for perception. The sensor produces images in a digital format
    that has to be interpreted by the computer. The basic building block of such interpretation
    or intelligence is explained in the next section. The different problems that
    arise in computer vision can be effectively solved using deep learning techniques.


    # Classification


    Image classification is the task of labelling the whole image with an object or
    concept with confidence. The applications include gender classification given
    an image of a person’s face, identifying the type of pet, tagging photos, and
    so on. The following is an output of such a classification task:


    | Dog | 96% |

    | Cat | 29% |

    | Duck | 2% |

    | Bird | 0% |

    | Dog | 36% |

    | Cat | 94% |

    | Duck | 2% |

    | Bird | 1% |'
