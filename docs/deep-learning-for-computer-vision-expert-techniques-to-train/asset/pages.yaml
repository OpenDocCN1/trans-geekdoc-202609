- pgno: 132
  md: '# # Detecting objects


    There are several variants of object detection algorithms. A few algorithms that
    come with the object detection API are discussed here.


    # ## Regions of the convolutional neural network (R-CNN)


    The first work in this series was for CNNs proposed by Girshick et al. (https://arxiv.org/pdf/1311.2524.pdf).
    It proposes a few boxes and checks any of the boxes around the ground truth. **Selective
    search** was used for these region proposals. Selective search proposes the regions
    by grouping the color/texture of windows of various sizes. The selective search
    looks for blob-like structures. It starts with a pixel and produces a blob at
    a higher scale. It produces around 2,000 region proposals. This region proposal
    is less when compared to all the sliding windows possible.


    The proposals are resized and passed through a standard CNN architecture such
    as Alexnet/VGG/Inception/ResNet. The last layer of the CNN is trained with an
    SVM identifying the object with a no-class object. The boxes are further improved
    by tightening the boxes around the images. A linear regression model to predict
    a closer bounding box is trained with object region proposals. The architecture
    of R-CNN is shown here:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_132_0.png)


    The encoder can be a pre-trained model of a standard deep learning model. The
    features are computed for all the regions from the training data. The features
    are stored and then the SVM is trained. Next, the bounding boxes are trained with
    the normalized coordinates. There may be some proposals outside the image coordinates
    and hence it is normalized for training and inference.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The disadvantages of this method are:


    +   - Several proposals are formed by selective search and hence many inferences
    have to be computed, usually around 2,000

    - There are three classifiers that have to be trained, which increases the number
    of parameters

    - There is no end-to-end training


    # Fast R-CNN


    The Fast R-CNN proposed by Girshick et al. (https://arxiv.org/pdf/1504.08083.pdf)
    runs CNN inference only and hence reduces computations. The output of the CNN
    is used to propose the networks and select the bounding box. It introduced a technique
    called Region of Interest pooling. The Region of Interest pooling takes the CNN
    features and pools them together according to the regions. The features obtained
    after the inference using CNN is pooled and regions are selected, as shown in
    the following image:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_133_0.png)


    This way, an end-to-end training is performed, avoiding multiple classifiers.
    Note that the SVM is replaced by the softmax layer and the box regressor is replaced
    by bounding box regressors. The disadvantage that still remains is the selective
    search, which takes time.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Faster R-CNN


    Faster R-CNN is proposed by Ren et al. (https://arxiv.org/pdf/1506.01497.pdf).
    The difference between Faster R-CNN and the Fast R-CNN method is that Faster R-CNN
    uses CNN features of architecture such as VGG and Inception for proposals instead
    of selective search. The CNN features are further passed through the region proposal
    network. A sliding window is passed through features with potential bounding boxes
    and scores as the output, as well as a few aspect ratios that are intuitive, the
    model outputs bounding box and score:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_134_0.png)


    Faster R-CNN is faster than Fast R-CNN as it saves computation by computing the
    feature only once.


    # Single shot multi-box detector


    SSD (Single shot multi-box) is proposed by the fastest of all the methods. This
    method simultaneously predicts the object and finds the bounding box. During training,
    there be a lot of negatives and hence hard-negative mining the class imbalance.
    The output from CNN has various sizes of features. These are passed to a 3x3 convolutional
    filter to predict bounding box.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'This step predicts the object and bounding box:


    ![](img/48c861eac4dc634fbf2a09fdbe884beb_135_0.png)


    Reproduced with permission from Liu et al.


    These are the algorithms available for object detection and we will learn how
    to implement them in the following section.


    # Object detection API


    Google released pre-trained models with various algorithms trained on the COCO
    dataset for public use. The API is built on top of TensorFlow and intended for
    constructing, training, and deploying object detection models. The APIs support
    both object detection and localization tasks. The availability of pre-trained
    models enables the fine-tuning of new data and making the training faster. These
    different models have trade-offs between speed and accuracy.


    # Installation and setup


    Install the Protocol Buffers (protobuf) compiler with the following commands.
    Create a directory for protobuf and download the library directly:


    ```

    mkdir protoc_3.3

    cd protoc_3.3

    get https://github.com/google/protobuf/releases/download/v3.3.0/protoc-3.3.0-linux-x86_64.zip

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Change the permission of the folder and extract the contents, as shown here:


    ```

    chmod 775 protoc-3.3.0-linux-x86_64.zip

    unzip protoc-3.3.0-linux-x86_64.zip

    ```


    Protocol Buffers (protobuf) is Google''s language-neutral, platform-neutral, extensible
    mechanism for serializing data. It uses a variety of languages but the XML is
    much simpler and faster. The models are usually exported to this format in TensorFlow.
    One can define the data structure once but can be read or written in a variety
    of languages. Then run the following command to compile the protobufs. Move back
    to the working folder and clone the repo from https://github.com/tensorflow/models.git
    and move them to the following folder:


    ```

    git clone https://github.com/tensorflow/models.git

    ```


    Now, move the model to the research folder, using the following code:


    ```

    cd models/research/

    ~/protoc_3.3/bin/protoc object_detection/protos/*.proto --python-out.

    ```


    The TensorFlow object detection API uses protobufs for exporting model weights
    and the training parameters. The TensorFlow, models, research, and slim directories
    should be appended to PYTHONPATH by the following command:


    ```

    export PYTHONPATH=../slim/

    ```


    Adding to the python path with the preceding command works only one time. For
    the next, this command has to be run again. The installation can be tested by
    running the following code:


    ```

    python object_detection/builders/model_builder_test.py

    ```


    The output of this code is given here:


    Ran 7 tests in 0.022s


    OK


    > More information about the installation can be obtained from https://github.com/tensorflow/models/master/blob/research/object_detection/g3doc/installation.md.
    Now the installation is complete and tested.'
  merge: -1
  img_proc: true
