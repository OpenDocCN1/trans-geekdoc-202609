  md: '# Image Classification


    # Chapter 2


    The first argument of the run method can have an array for which the outputs of
    the values are requested. We use loss because printing tells us whether the model
    is trained or not. The loss is expected to decrease as we are minimizing the loss.
    The feed dict is a Python dictionary used to directly feed the input and target
    labels to the placeholders. Once this loop ends, the loss should be generally
    lower than 0.46. Next, we evaluate how well the model works by computing the accuracy,
    as shown here:


    ```

    predictions = tf.argmax(logits, 1)

    correct_predictions = tf.equal(predictions, tf.argmax(y_input, 1))

    accuracy_operation = tf.reduce_mean(tf.cast(correct_predictions, tf.float32))


    test_images, test_labels = mnist_data.test_images, mnist_data.test_labels

    accuracy_value = session.run(accuracy_operation, feed_dict={

    x_input: test_images,

    y_input: test_labels

    })

    print(''Accuracy : '', accuracy_value)

    session.close()

    ```


    The prediction should be the index of the maximum activation. It can be compared
    with the ground truth on MNIST labels for correct predictions. The accuracy of
