- pgno: 176
  md: "FaceNet takes a batch of face images and trains them. In that batch, there\
    \ will be a few positive pairs. While computing the loss, the positive pairs and\
    \ closest negative pairs are considered. Mining selective pairs enable smooth\
    \ training. If all the negatives are pushed away all time, the training is not\
    \ stable. Comparing three data points is called triplet loss. The images are considered\
    \ with a positive and negative match while computing the loss. The negatives are\
    \ pushed only by a certain margin. Triplet loss is explained in detail here.\n\
    \n# Triplet loss\n\nThe triplet loss learns the score vectors for the images.\
    \ The score vectors of face descriptors can be used to verify the faces in Euclidean\
    \ space. The triplet loss is similar to metric learning in the sense of learning\
    \ a projection that the inputs can be distinguished. projections or descriptors\
    \ or score vectors are a compact representation, hence can be considered as a\
    \ dimensionality reduction technique. A triplet consists of an anchor, a positive\
    \ and negative face. An anchor can be any face, and positive faces are the images\
    \ of the same person. The negative image may come from another person. It's obvious\
    \ that there will be a lot of negative faces for a given anchor. By selecting\
    \ negatives that are currently closer to the anchor, it's harder for the encoder\
    \ to distinguish the faces, making it learn better. This process is termed as\
    \ hard negative mining. The closer negatives can be obtained with a threshold\
    \ in Euclidean space. The following image depicts the triplet loss model:\n\n\
    ![](img/48c861eac4dc634fbf2a09fdbe884beb_176_0.png)\n\nThe loss computation in\
    \ TensorFlow is shown here:\n\n```\ndef triplet_loss(anchor_face, positive_face,\
    \ negative_face, margin):\n    def get_distance(x, y):\n        return tf.reduce_sum(tf.square(tf.subtract(x,\
    \ y)), 1)\n\n    positive_distance = get_distance(anchor_face, positive_face)\n\
    \    negative_distance = get_distance(anchor_face, negative_face)\n    total_distance\
    \ = tf.add(tf.subtract(positive_distance,\n    negative_distance), margin)\n \
    \   return tf.reduce_mean(tf.maximum(total_distance, 0.0), 0)\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Similarity Learning\n\n# Chapter 6\n\nThe mining of the triplets is a difficult\
    \ task. Every point has to be compared with others to get the proper anchor (anchor,\
    \ targets, positive pairs). The mining of the triplets is shown here:\n\n```\n\
    def mine_triplets(anchor, targets, negative_samples):\n    distances = cdist(anchor,\
    \ targets, 'cosine')\n    distances = cdist(anchor, targets, 'cosine').tolist()\n\
    \    Qn_duplicated = [\n        target_index for target_index, dist in enumerate(Qn_dist)\n\
    \        if dist == Qn_dist[query_index]\n        for query_dist, Qn_dist in enumerate(distances)]\n\
    for i, QnT_dist in enumerate(QnT_dists):\n    for j in Qn_duplicated[i]:\n   \
    \     QnT_dist.itemset(j, np.inf)\n```\n\n```\nQnT_dists_topk = QnT_dists.argsort(axis=1)[:,\
    \ :negative_samples]\ntop_k_index = np.array([np.insert(QnT_dist, 0, i) for i,\
    \ QnT_dist in\nenumerate(QnT_dists_topk)])\nreturn top_k_index\n```\n\nThis could\
    \ make the training slower on a GPU machine as the distance computation happens\
    \ in CPU. The FaceNet model is a state of the art method in training similarity\
    \ models for faces.\n\n# The DeepNet model\n\nThe DeepNet model is used for learning\
    \ the embedding of faces for face verification tasks such as FaceNet. This improves\
    \ on the method of FaceNet discussed in the previous section. It takes multiple\
    \ copies of the same face and passes through several encoders to get a better\
    \ embedding. This has achieved a better accuracy than FaceNet but takes more time\
    \ for processing. The face crops are made in the same regions and passed through\
    \ their respective encoders. Then all the layers are concatenated for training\
    \ against the triplet loss.\n\n[ 163 ]"
  merge: -1
  img_proc: true
