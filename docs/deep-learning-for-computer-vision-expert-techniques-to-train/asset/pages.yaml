    Fiducial points are landmarks on the face with respect to the location of the
    eyes, nose, and lips. Finding these landmarks are vital for face-based augmented
    reality applications. There are more landmarks available in the face and will
    be covered in detail in Chapter 6, Similarity Learning, in the context of face
    recognition.


    # Combining regression with the sliding window


    The classification score is computed for every window in the sliding window approach
    or the fully convolutional approach to know what object is present in that window.
    Instead of predicting the classification score for every window to detect an object,
    each window itself can be predicted with a classification score. Combining all
    the ideas as sliding window, scale-space, full convolution, and regression give
    superior results than any individual approach. The following are the top five
    localization error rates on the ImageNet dataset achieved by various networks
    using the regression approach:'
