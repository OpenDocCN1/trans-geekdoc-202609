    . The same techniques used in object detection can be applied for face detection
    as well.


    # # Face landmarks and attributes


    Face landmarks are the spatial points in a human face. The spatial points correspond
    to locations of various faces such as eyes, eyebrows, nose, mouth, and chin. The
    number of points may vary from 5 to 78 depending on the annotation. Face landmarks
    are also referred to as fiducial-points, facial key points, or face pose. The
    face landmarks have many applications as listed here:


    +   - Alignment of faces for better face verification or face recognition

    - To track faces in a video

    - Facial expressions or emotions can be measured

    - Helpful for diagnosis of medical conditions


    Next, we will see some databases that have the annotation for fiducial points.


    # # The Multi-Task Facial Landmark (MTFL) dataset


    The MTFL dataset is proposed by Zhang et al. and is annotated with five facial
    landmarks along with gender, smiling, glasses and head pose annotations. There
    are 12,995 faces present in the database. MTFL can be downloaded from http://mmlab.ie.cuhk.edu.hk/projects/TCDCN/data/MTFL.zip.'
