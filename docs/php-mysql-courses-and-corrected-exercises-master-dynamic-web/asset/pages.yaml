  md: '**name:** the name of the cookie.


    **value:** the value associated with the cookie.


    **expire** : optional, specifies the cookie expiry date as a Unix timestamp. If
    not specified, the cookie will expire at the end of the session.


    **path** : optional, specifies the path on the server for which the cookie is
    available. By default, it is available throughout the site.


    **domain** : optional, specifies the domain for which the cookie is available.
    By default, it is available for the current domain.


    **secure** : optional, specifies whether the cookie should be transmitted via
    HTTPS only. By default, it is set to false.


    **httponly:** optional, specifies whether the cookie is accessible via HTTP only
    and not via JavaScript. By default, it is set to false.


