- pgno: 97
  md: '```

    if (condition1) {

    Code to execute if condition1 is true;

    } elseif (condition2){

    Code to execute if condition2 is true;

    } else {

    Code to execute if none of the previous conditions are true

    }

    ```


    "if (condition1) { ... }": We first check whether condition1 is true. If so, we
    execute the code within this block of instructions. It''s like saying, "If this
    is true, do this.


    "elseif (condition2) { ... }": If condition1 is false, we go on to check condition2.
    If condition2 is true, we execute the code inside this block. It''s like saying,
    "If the first thing isn''t true, but this is, do this."


    "else { ... }": If neither condition1 nor condition2 are true, then we execute
    the code inside this block. It''s a kind of backup: we do it if none of the previous
    conditions are met.


    In short, it''s a bit like a cascade of decisions. First we check one condition,
    then another if the first is not met, and finally we have a last resort if none
    of the previous conditions is met.'
