  md: '# # Accessing the elements of a multidimensional array


    If we take the example of the multidimensional array $info_country, to access
    its elements, you can use numerical indexes, then their individual elements. For
    example, to access the capital of France, you can use the following syntax:


    ```

    ```php

    // Access to the capital of France

    $capital_france = $info_country[0][1];

    echo $capital_france; // Display "Paris".

    ```

    ```


    In this example, $info_country[0] returns the first sub-table corresponding to
    France, and $info_country[0][1] accesses the second element of this sub-table,
    which is the capital (Paris).


    For example, to access the number of inhabitants of Morocco, you can use the following
    syntax:


    ```

    ```php

    // Access to the number of inhabitants in Morocco

    $capital_france = $info_country[2][2];

    echo $capital_france; // Display 40

    ```

    ```


    In this example, $info_country[2] returns the third sub-table corresponding to
    Morocco, and $info_country[2][2] accesses the third element of this sub-table,
    which is the number of inhabitants of Morocco.'
