    # Cross-Site Request Forgery (CSRF)


    Cross-Site Request Forgery (CSRF) is a malicious attack that exploits the trust
    of an authenticated user to perform unauthorized actions without their knowledge.
    The attack works by exploiting the fact that web browsers automatically send authentication
    cookies with every request sent to a site, even if these requests were initiated
    from another site.


    # How CSRF attacks work


    The CSRF attack is usually carried out by inducing an authenticated user to visit
    a malicious site containing links or forms designed to perform specific actions
    on a target site. When the user visits the malicious site, requests generated
    by the latter are automatically sent to the target site, using the user''s authentication
    information, without the user being aware of the attack.'
  merge: -1
  img_proc: true
- pgno: 440
  md: "# Implementing anti-CSRF tokens\n\nThe main preventive measure against CSRF\
    \ attacks is the use of anti-CSRF tokens, also known as synchronous tokens or\
    \ anti-bounce tokens. These tokens are unique random values associated with each\
    \ user and each session. They are generated on the server side and included in\
    \ forms or POST requests sent by the user. When a request is submitted, the server\
    \ checks that the corresponding anti-CSRF token is valid for that specific session\
    \ and action. If the token is invalid or missing, the request is rejected.\n\n\
    # Example of anti-CSRF token implementation\n\nHere's a simple example of how\
    \ to generate and validate an anti-CSRF token in PHP :\n\n```\n<?php\n\nsession_start();\n\
    \n// Generate anti-CSRF token\nif (!isset($_SESSION['csrf_token'])) {\n    $_SESSION['csrf_token']\
    \ = bin2hex(random_bytes(32));\n}\n\n// Inclusion of anti-CSRF token in a form\n\
    echo '<form action=\"csrf_processing.php\" method=\"post\">';\necho '<input type=\"\
    hidden\" name=\"csrf_token\" value=\"\" . $_SESSION['csrf_token'] . \">'';\necho\
    \ '<input type=\"submit\" value=\"Submit\">';\necho '</form>';\n```"
  merge: -1
  img_proc: true
- pgno: 441
  md: "```\n// Server-side validation of anti-CSRF token\nif (isset($_POST['csrf_token'])\
    \ && $_POST['csrf_token'] == = $_SESSION['csrf_token']) {\n// Processing the request\n\
    \    echo \"Request processed successfully\";\n} else {\n// Reject request\n \
    \   echo \"Error: invalid CSRF request.\";\n}\n?>\n```\n\nThis PHP code illustrates\
    \ the use of anti-CSRF tokens to prevent CSRF attacks on a web form. Here is a\
    \ detailed explanation of each part of the code:\n\n**session_start():** This\
    \ function starts a new session or resumes an existing one. Sessions are used\
    \ to store session variables, such as the anti-CSRF token, which can be accessed\
    \ via different pages.\n\n**Anti-CSRF token generation:** The code checks whether\
    \ the anti-CSRF token is already present in the session. If not, a new token is\
    \ generated using the **random_bytes()** function to create a 32-byte random string,\
    \ then **bin2hex()** to convert this string to a hexadecimal representation.\n\
    \n**Inclusion of the anti-CSRF token in a form:** The anti-CSRF token is then\
    \ included in an HTML form as a hidden field (<input type=\"hidden\">). This ensures\
    \ that the token is submitted with the rest of the form data when it is sent to\
    \ the server."
  merge: -1
