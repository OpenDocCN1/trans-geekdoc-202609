  md: '# PHP interfaces


    Interfaces in PHP are powerful object-oriented programming tools for defining
    contracts that classes must respect. They offer a structured way of declaring
    the methods a class must implement, without providing details on how these methods
    are to be implemented. In other words, interfaces define what a class can do,
    but not how it does it.


