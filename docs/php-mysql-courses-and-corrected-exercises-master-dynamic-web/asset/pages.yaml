    # Abstract classes and behavior of derived classes


    In the scenario where we have, for example, an abstract class Person, this class
    acts as a common base model to represent the characteristics and behaviors shared
    by all types of people, but it cannot be instantiated directly. Specific classes
    such as Author, Teacher, Student, and Admin extend the abstract class Person,
    thereby inheriting its properties and methods, while also having the ability to
    define their own specific attributes and behaviors.


    For instance, the abstract class Person could define properties such as name,
    age, and email address, as well as methods like introduce() to allow each type
    of person to introduce themselves in a general manner. The child classes such
    as Author, Teacher, Student, and Admin would inherit these basic attributes and
    methods, but could also define their own methods specific to their role or responsibilities,
    such as publishBook() for an author or teachClass() for a teacher.'
