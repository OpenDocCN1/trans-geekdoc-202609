  md: '# Understand how functions with parameters by reference work:


    +   - When you call the function and pass a parameter by **reference**, PHP stores
    the memory addition of the original variable in an internal reference.

    +   - Inside the function, when you use this parameter, PHP uses this internal
    reference to directly access the original variable and make the necessary modifications.

    +   - Any modification made to the variable through this parameter directly affects
    the original variable, as PHP works with the memory addition of the variable itself,
    and not with a copy of its value.


    This allows the function to modify the original variable directly, and these modifications
    are retained even after the function has been exited. This is why parameters by
    reference are used when you need to modify the value of a variable and want this
    modification to be visible outside the function.


    # Understand how functions with parameters by value work:


    +   - When you call the function and pass a parameter by **value**, PHP creates
    a **copy** of the original variable value and assigns it to a **new memory location**
    for use within the function.

    +   - Inside the function, any modification made to this parameter by value affects
    only this **copy** of the value and does not modify the original variable outside
    the function.

    +   - When the function ends, the copy of the parameter value per value is **destroyed**
    and the original variable remains unchanged.


    This means that modifications made to a parameter by value inside a function remain
    local to that'
