- pgno: 285
  md: '![](img/caba2aa22f5409ba73dea47176330677_285_0.png)


    Please note that the content of your form has been transmitted via your browser''s
    URL address. In other words, the GET method sends the data as a query string in
    the URL, making it easy to view and share.


    However, it''s important to note that the GET method is not recommended for sending
    sensitive data, such as passwords, as this data is visible in the URL and can
    be intercepted by third parties. In such cases, the POST method is preferable,
    as it sends the data in the body of the HTTP request, making it less visible.


    In address, the GET method has several limitations compared to the POST method:


    +   - **Data size limit** : Data transmitted via the GET method is limited in
    size, as it is included in the URL. This can be a problem for large or sensitive
    data.


    +   - **Data security**: Since data is visible in the URL, it can easily be intercepted
    and read by third parties. This can compromise the security of sensitive data
    such as passwords or personal information.


    +   - **Special character restrictions**: Certain special characters must be encoded
    in the URL, which can lead to errors or data loss if not handled correctly.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '**Browser cache:** Data transmitted via the GET method may be cached by the
    browser, which can lead to confidentiality problems if the user shares the URL
    containing sensitive data.


    In summary, although the GET method is simple to use and suitable for small quantities
    of non-sensitive data, it has significant limitations in terms of security, data
    size and handling of special characters. For sensitive or voluminous data, we
    recommend using the POST method.'
  merge: -1
  img_proc: true
