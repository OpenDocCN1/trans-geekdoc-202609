- pgno: 27
  md: 'You can choose the text editor that best suits your web development needs and
    preferences. Once you''ve installed your preferred text editor, you can start
    creating and editing code files for your web project.


    # Creating a project in XAMPP


    In XAMPP, you don''t create projects directly, but rather create directories for
    your projects in the htdocs directory. Here''s how to do it:


    **Find the htdocs directory:** The htdocs directory is where you store your website
    files. By default, this directory is located in the XAMPP installation folder.
    On Windows, it''s usually located in C:\\xampp\\htdocs, and on Mac, it''s in /Applications/XAMPP/htdocs.


    **Create a new directory for your project:** In the htdocs directory, create a
    new directory for your project. You can give it any name you like, e.g. "ebookphp".


    Once you''ve created the directory for your project, you can place all your website
    files and folders in it. This can include HTML, CSS, PHP, JavaScript files, images,
    etc.


    **Accessing your project via the browser:** Once you''ve placed your project files
    in the directory you''ve created, you can access your website by opening a web
    browser and entering the following URL in the address bar: http://localhost/ebookphp.
    Be sure to replace "ebookphp" with the name of the directory you''ve created for
    your project.


    By following these steps, you can create and access your project in XAMPP. Make
    sure you start the Apache and MySQL services in XAMPP so that your website functions
    correctly.


    # Your first PHP script'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Here are the steps to create your first PHP script using XAMPP and the "ebookphp"
    directory created in the "htdocs" folder:


    Launch XAMPP as explained above and start Apache by clicking on the corresponding
    "Start" button. Make sure they are displayed in green, indicating that it is running.


    Open the text editor of your choice to write your PHP script.


    In your text editor, create a new file and save it in the "ebookphp" directory
    located in the "htdocs" folder of your XAMPP installation. Name this file "first_script.php".


    Write your First PHP Script: In your "first_script.php" file, write the following
    PHP code:


    ```

    <?php


    echo "Hello, world!";


    ?>

    ```


    Once you''ve written your PHP script, save the file.


    Launch your favorite web browser (e.g. Google Chrome, Mozilla Firefox, etc.).


    In your browser''s address bar, enter the following URL: http://localhost/ebookphp/premier_script.php
    and press "Enter".


    You should see the phrase "Hello, world!" displayed in your browser, indicating
    that your first PHP script'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'has been successfully executed.


    ![](img/caba2aa22f5409ba73dea47176330677_29_0.png)


    Congratulations! You''ve just created and executed your first PHP script using
    XAMPP. This simple example marks the start of your journey into the exciting world
    of web development with PHP.


    # Error display


    As you know, making errors, especially syntax errors, is quite common, and I can
    assure you that there isn''t a developer in the world who doesn''t make them.
    It''s therefore very useful to display indications of these errors.


    In fact, depending on the configuration of your server, errors may not be displayed
    at all! Many beginners find themselves puzzled when they run a PHP page in a browser
    and see absolutely nothing. There''s no error message, just a blank page, for
    example. This happens when errors are present in the code and our'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'PHP server is not configured to display errors.


    To solve this problem, simply make a few changes to XAMPP''s php.ini file.


    To find the location of this file, simply addition the code below to the previously
    created file first_script.php (or any other file in your project).


    ```

    <?php

    phpinfo();

    ?>

    ```


    This code is used to display detailed information on your server''s PHP configuration.
    When you execute this code in a PHP file and open it in a browser, a web page
    is generated with a wealth of information on the installed PHP version, activated
    modules, configuration directives, file paths, environment variables and much
    more.


    This phpinfo() page is often used to diagnose PHP configuration problems, check
    enabled features, or simply to obtain details about the PHP server in use. It
    provides a useful overview of the PHP environment, which can be particularly useful
    when developing or configuring web applications.


    The full path of the php.ini file is in the "Loaded Configuration File" line:


    | Loaded Configuration File | /Applications/XAMPP/xamppfiles/etc/php.ini |

    |---|---|


    Once you''ve located the php.ini file, open it in a text editor.


    Look for the **display_errors** directive. This directive controls whether PHP
    errors are displayed on screen.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'By default, this directive is generally set to Off.


    ```

    97  ; display_errors

    98  ; Default Value: On

    ```


    Change the value of the display_errors directive to On.


    You can also set the error_reporting directive to specify the level of errors
    to be displayed. For example, you can set error_reporting = E_ALL to display all
    errors, or error_reporting = E_ALL & ~E_NOTICE to display all errors except notifications.


    ```

    107  ; error_reporting

    108  ; Default Value: E_ALL

    ```


    Save your changes to php.ini.


    Restart your Apache server for the changes to take effect.


    Once configured, PHP errors will be displayed on screen when you run PHP scripts.
    This will help you diagnose and resolve errors more quickly as you develop your
    website.


    # Conclusion


    In this introductory chapter, we''ve taken several crucial steps towards setting
    up a development environment conducive to the creation of dynamic websites with
    PHP and MySQL.


    We began by installing XAMPP, a local web server that brings together the tools
    needed to run PHP'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'scripts and interact with MySQL databases. This step is essential as it enables
    us to simulate a production environment on our own computer, thus facilitating
    the development and testing process.


    Then we created our first PHP script, marking the start of our journey into the
    fascinating world of web development. Through this simple example, we explored
    the basic structure of a PHP script, including PHP tags, output statements and
    comments.


    Finally, we''ve configured PHP to display errors, which is a fundamental practice
    for effective debugging of our PHP scripts. By enabling error display, we''re
