    # Download and install a text editor


    After installing XAMPP, we recommend you download and install a text editor for
    writing and editing your code files. Here are a few examples of the most popular
    text editors suitable for web development:


    **Sublime Text**: Sublime Text is a lightweight, highly customizable text editor
    with many useful features for web development, such as syntax highlighting, auto-completion
    and project management. Download link: https://www.sublimetext.com/


    **Visual Studio Code**: Visual Studio Code (VS Code) is a source code editor developed
