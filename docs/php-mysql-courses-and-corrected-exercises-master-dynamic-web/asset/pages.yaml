    \ to be executed if the expression matches the corresponding value.\n\n+   default:\
    \ This is an optional option that specifies the code to be executed if none of\
    \ the values matches the expression. It's the equivalent of the \"default\" clause\
    \ in the switch structure.\n\nThe match structure evaluates the expression and\
    \ compares its result with each specified value. If a match is found, the corresponding\
    \ instructions are executed. If no match is found and a default clause is present,\
    \ the default instructions are executed."
