  md: '# **substr()** : This function returns a substring of a given string from the
    specified position and length.


    # **Example:**


    ```

    <?php

    $text = "Hello everyone";

    $substring = substr($text, 3, 10); // $substring is "lo evryon".

    echo $substring;

    ?>

    ```


    In this example, we have a string "$texte" containing the value " Hello everyone".
    The "substr()" function is used to extract a substring from "$text". The function''s
    parameters are as follows: the first parameter is the original string ("$text"),
    the second parameter is the starting position of the extraction (3 in our case,
    which means from the fourth character of the string $text, as indices start at
    zero), and the third parameter is the length of the substring to be extracted
    (10 characters in our case). Thus, the "substr()" function extracts a substring
    from "$text" starting from the third position with a length of ten characters,
    giving "lo evryon". Spaces are also characters to be taken into account.


