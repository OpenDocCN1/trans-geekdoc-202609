    and code maintenance.


    **Extension and customization**: Child classes can extend the behavior of their
    parent class by adding new features or redefining existing ones. This allows flexible
    customization of object behavior based on the specific needs of each child class.


    **Abstraction and polymorphism**: As we will see in subsequent chapters, inheritance
    promotes the creation of hierarchies of abstract classes that represent general
