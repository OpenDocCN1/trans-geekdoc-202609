- pgno: 268
  md: '# # Transferring and processing form data in PHP


    To retrieve data entered by a user in a form, there are two main approaches: The
    first method consists in creating two separate files: an HTML file containing
    the form and a PHP file responsible for processing the data submitted by this
    form.


    The second method consists in combining both the HTML form code and the PHP processing
    code in a single PHP file.


    Initially, we''ll concentrate on the first configuration, where two separate files
    are used. The first file, named "form.php" for example, will contain the form,
    while the second file, named "processingform.php" for example, will be responsible
    for processing the data transmitted by this form.


    ![](img/caba2aa22f5409ba73dea47176330677_268_0.png)'
  merge: -1
  img_proc: true
