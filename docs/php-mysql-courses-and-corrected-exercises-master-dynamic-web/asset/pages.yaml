  md: "```\nmatch (expression) {\n    value1 => instruction1;\n    value2 => instruction2;\n\
    \    ...\n    default => default_instruction;\n}\n```\n\nIn this syntax :\n\n\
    +   expression: This is the expression you wish to evaluate. It can be a variable,\
