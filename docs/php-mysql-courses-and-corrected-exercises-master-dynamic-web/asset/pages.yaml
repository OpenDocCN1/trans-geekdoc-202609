    Chapter 2: Encapsulation and data modeling: This chapter explores the notion of
    encapsulation in PHP and shows how to model data using classes.


    Chapter 3: Inheritance in PHP : This chapter explores inheritance in PHP, allowing
    you to create class hierarchies to reuse and extend code.


    Chapter 4: Interfaces and abstract classes : This chapter introduces interfaces
    and abstract classes in PHP. You''ll learn how to define contracts with interfaces
    and how to create abstract classes to define methods common to several classes.


    Chapter 5: Exception handling: This chapter covers exception handling in PHP,
    enabling you to handle errors and exceptional situations cleanly and efficiently
    in your applications.'
