    | 2 | Morocco | Rabat | 40 |

    | 3 | Spain | Madrid | 47 |


    To declare and initialize this array in PHP, we can use the bracket notation []
    or the array() function:


    # Method 1:


    ```

    $country_information = array(

    array("country" => "France", "capital" => "Paris", "inhabitants" => 67),

