    # **Different database management systems (DBMS)**


    Database Management Systems (DBMS) are software programs designed to manage databases,
    ensuring their creation, manipulation, storage and access. There are several types
    of DBMS, each with its own characteristics and functionalities. The main types
    of DBMS are :


    **Relational DBMS:** This type of DBMS is based on the relational model and uses
    the SQL language to manage data. Popular examples of relational DBMS are MySQL,
    PostgreSQL, Oracle Database and Microsoft SQL Server.


    **NoSQL DBMS :** NoSQL DBMSs take a different approach to data management than
    relational DBMSs. They are designed to manage unstructured or semi-structured
    data, and offer high scalability. Examples of NoSQL DBMS include MongoDB, Cassandra
    and Redis.


    **Object-oriented DBMS:** These DBMS are designed to store and manipulate objects
    rather than tabular data. They offer a more flexible approach to modeling complex
    data. Examples of object-oriented DBMS include db4o and ObjectDB.


    **In-Memory DBMS:** These DBMS store data entirely in memory, enabling data to
    be accessed very quickly.'
  merge: -1
  img_proc: true
- pgno: 352
