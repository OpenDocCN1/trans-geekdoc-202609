  md: "In short, a class is a model or blueprint that defines the structure and behavior\
    \ of a certain type of object, while an instance is a specific copy of that class,\
    \ with its own values for the properties defined in the class.\n\n# Class definition\n\
    \nIn PHP, a class is declared using the **class** keyword, followed by the class\
    \ name and its properties and methods enclosed in braces.\n\nThe class name must\
    \ begin with a letter or underscore (_), followed by letters, numbers or underscores.\n\
    \nNaming conventions recommend using **PascalCase** notation to name classes,\
    \ which means that every word in the class name begins with a capital letter,\
    \ with no spaces or special characters. In particular, the first letter of a class\
    \ name is capitalized.\n\nHere's the general syntax for defining a class:\n\n\
    ```\n```php\nclass ClassName {\n    // Class Content\n}\n```\n```"
