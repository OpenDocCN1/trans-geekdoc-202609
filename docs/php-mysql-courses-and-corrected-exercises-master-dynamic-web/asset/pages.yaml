- pgno: 271
  md: '"Last name", "First name", "Email address" and "Country".


    **Input** fields are form elements used to enter user data. The type attribute
    defines the type of field, such as "text" for text fields like "Last name" and
    "First name", and "email" for an e-mail address field. The id attribute is used
    to associate the corresponding label, while the name attribute is essential for
    identifying the field data when the form is submitted.


    The **select** and **option** elements are used for drop-down lists. The **select**
    tag creates a drop-down list, while the option tag defines each option in the
    list. The value attribute of each option is the value sent to the server upon
    selection.


    The "submit" input button allows the user to submit the form. The value attribute
    defines the text displayed on the button, in this case "Submit".


    The **form** tag frames all the elements of the form. The **action** attribute
    specifies the URL of the data processing script (in this example, " processingform.php"),
    while the **method** attribute defines the HTTP method used to send the data (here,
    POST).


    To retrieve data sent from an HTML form, PHP provides two methods: **GET** and
    **POST**, accessible via the superglobal variables $_GET and $_POST. These superglobals
    are used to retrieve the values of form fields, as we''ll see later.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/caba2aa22f5409ba73dea47176330677_272_0.png)


    # Data retrieval using the POST method in PHP


    Once the form has been created in the form.php file, the process of retrieving
    the transmitted data is as follows:


    When the user submits the form by clicking on the "Send" button, the data is sent
    to the server.


    The server receives the data and transmits it to the processing file specified
    in the form''s "action" attribute (in this case, "processingform.php").


    In the processingform.php file, we retrieve the data transmitted via the $_GET
    or $_POST superglobal variables, depending on the method used in the form (in
    this example, POST).


    We then process this data according to the needs of the application, such as validation,
    manipulation,'
  merge: -1
  img_proc: true
