- pgno: 461
  md: "To better understand these concepts, let's create a directory called \"phpfoo\"\
    \ on the server. If you're using XAMPP locally, you can create this directory\
    \ in the \"htdocs\" folder. In this directory, we'll put illustrative examples\
    \ of all the concepts covered in this section.\n\n# Class properties (attributes)\n\
    \nClass properties are variables declared inside the class.\nThey define the characteristics\
    \ or data associated with each instance of the class.\nNaming conventions generally\
    \ recommend the use of camelCase notation for naming properties, which means that\
    \ the first word begins with a lowercase letter and subsequent words begin with\
    \ an uppercase letter.\n\n# Example:\n\n```\nclass MyClass {\n    public $myProperty;\n\
    \    private $otherProperty;\n}\n```\n\nThis code defines a class named \"MyClass\"\
    \ in PHP. Inside the class, we declare two properties: \"$myProperty\" and \"\
    $otherProperty\". The \"$ myProperty\" property is declared as public, meaning\
    \ that it can be accessed from outside the class. On the other hand, the \"$otherProperty\"\
    \ property is declared as private, meaning that it can only be accessed inside\
    \ the class itself and cannot be accessed from outside. Private properties are\
    \ used to encapsulate data and guarantee its integrity by limiting direct access."
  merge: -1
  img_proc: true
- pgno: 462
  md: "# Class methods\n\nClass methods are functions declared inside the class.\n\
    They define the actions or behaviors associated with each instance of the class.\n\
    Naming conventions generally recommend the use of camelCase notation to name methods,\
    \ in the same way as for properties.\n\n# Example:\n\n```\nclass MaClasse {\n\
    \    public function myMethod() {\n    // Method body...\n    }\n\n    private\
    \ function otherMethod() {\n    // Body of method...\n    }\n}\n```\n\nThis code\
    \ defines a class named \"MyClass\" in PHP. Inside the class, we define two methods:\
    \ \"myMethod()\" and \"otherMethod()\". The \"myMethod()\" method is declared\
    \ as public, meaning it can be called from outside the class. On the other hand,\
    \ the \"otherMethod()\" method is declared as private, meaning that it can only\
    \ be called from within the class itself and is not accessible from outside. Private\
    \ methods are used to encapsulate the class's internal logic and are not intended\
    \ to be called directly from outside the class. This makes it possible to protect\
    \ and restrict access to certain class functionalities."
  merge: -1
  img_proc: true
