  md: '# # Key elements of a relational database


    In a relational database, data is organized into different entities such as tables,
    columns and records. Here are the main elements of a relational database:


    **Tables:** These represent linked data sets. Each table is made up of rows and
    columns.


    **Columns:** These define the various attributes or data fields that make up a
    table.


    **Records:** They represent the individual data stored in a table, each record
    corresponding to a row in the table.


    **Primary and foreign keys:** These are used to establish relationships between
    tables. The primary key is a unique identifier for each record in a table, while
    the foreign key is used to reference a primary key in another table.'
  merge: -1
  img_proc: true
