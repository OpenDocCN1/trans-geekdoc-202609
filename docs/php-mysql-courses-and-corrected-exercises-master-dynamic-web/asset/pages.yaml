    strpos(): This function returns the position of the first occurrence of a substring
    in a string.


    # Example:


    ```

    $text = "Good morning";

    $position = strpos($text, "mor"); // $position is 5

    ```


    In this example, we have a string "$texte" containing the value "Good morning".
    The "strpos()" function is used to find the position of the first occurrence of
    the substring "mor" in the string "$text". As "mor" starts at the five position
    in "Good morning", the "strpos()" function returns the value 5, which is the starting
    position of the sub-string "mor" in the string "$texte". Note that position indexing
    starts from zero. The letter "G" has index 0, the letter "o" has index 1, the
    second letter "o" has index 2, the letter "d" has index 3, the space has index
    4, and the letter "m" has index 5.'
