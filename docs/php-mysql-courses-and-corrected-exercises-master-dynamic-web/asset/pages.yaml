    # Write access to objects


    Write access to objects means that we can modify (or assign) the values of an
    object''s properties. This allows us to update the data stored in the object''s
    properties.


    In the context of the Users class, we can write access to the properties of the
    $user1 object as follows:


    ```

    $user1->name="Dupont" ;

    $user1->firstname="Eric" ;

    $user1->age= 30 ;

    $user1->email="dupont-eric@gmail.com" ;

    ```


    This code, to be integrated into the index.php file where a $user1 object is already
    instantiated from the Users class, is used to assign values to the properties
    of the $user1 object of the Users class. More precisely :


    +   - "$user1->name = "Dupont";" assigns the value "Dupont" to the "name" property
    of the "$user1" object.

    +   - "$user1->firstname = "Eric";" assigns the value "Eric" to the "firstname"
    property of the "$user1" object.

