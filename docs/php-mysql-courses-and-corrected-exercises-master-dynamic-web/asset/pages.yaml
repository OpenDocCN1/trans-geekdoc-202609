  md: "# numbers.\n\n```\n<?php\n// First even number generator\nfunction generate_even_numbers($max)\
    \ {\n    for ($i = 0; $i <= $max; $i += 2) {\n        yield $i;\n    }\n}\n\n\
    // Second odd number generator\nfunction generate_odd_numbers($max) {\n    for\
    \ ($i = 1; $i <= $max; $i += 2) {\n        yield $i;\n    }\n}\n\n// Third generator\
    \ calling the 2 previous generators\nfunction generate_even_odd_numbers($evenmax,\
    \ $oddmax) {\n    yield from generate_even_numbers($evenmax);\n    yield from\
    \ generate_odd_numbers($oddmax);\n}\n```"
