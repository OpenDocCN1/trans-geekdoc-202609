- pgno: 143
  md: 'translation but not to scale and rotation. In the studies by Wei et al. [25]
    and Qi et al. [26], other synthesized approaches to trademark retrieval are provided.


    Although the hybrid approaches presented by Wei et al. and Qi et al. [25, 26]
    provide good results, they suffer from some limitations. First, the curvature
    based local features suggested by Wei et al. [25] are prone to image noise as
    the second order derivative is required to compute curvature. Second, although
    the normalized histograms of the distances do not support association between
    adjacent edge points. This is an attractive proposition for representing adjacency
    between edge points. However, it suffers from high radius when two adjacent points
    are quite close to each other and the variation in radii is quite significant.
    This affects the correct formation of histograms that weakens the insightful of
    local features.


    The moment based global features are characterized by minimum information redundancy
    and robustness to noise due to summation operation in moment computation. Apart
    from being rotation invariant, they can be made translation invariant and scale
    invariant after some geometric transformations. Among the moment based invariants,
    the ZMs are found to be the best shape descriptors in many applications [27–31],
    as they have least information redundancy and possess best robustness to noise
    [17]. Inspired by these properties, Wei et al. [25] use ZMs as global features.
    However, the authors exploit only first four orders of moments with magnitude
    components without using the phase coefficients, which are inadequate to represent
    the full characteristics of an image. It is observed that ZMs phase coefficients
    are more effective than magnitude for shape description [32–36]. However, unlike
    magnitude coefficients, the phase coefficients of ZMs do not exhibit rotation
    invariance property. In order to make phase coefficients rotation invariant, various
    approaches have been proposed [33–36]. These approaches first compute the rotation
    angle between the test and train images then phase correction is performed for
    the purpose of matching. The similarity matching based on ZMs magnitude and phase
    coefficients has been found to produce good results in several applications.


    In this chapter, we provide an effective hybrid approach by combining the local
    and global features for image retrieval, which resolves the problems of existing
    hybrid approaches. The local features are based on the Hough transform of the
    edge points, which are obtained using Canny edge detector, and the global features
    are based on ZMs. Hough transform is a very robust method for detecting linear
    edges in an edge image. Based on summation operation, it is robust to noise. Linear
    edges provide adjacency property of the local feature points. All edge points
    falling on a line (having same slope and intercept) constitute a linear edge in
    the Hough transform. After detecting the linear edges, the histograms are computed.
    The histograms so obtained are invariant to rotation, translation, and scale.
    For representing global features, we use both ZMs magnitude and phase coefficients.
    A correction is made to phase coefficients of ZMs by estimating the rotation angle
    using the method proposed by Revaud et al. [35]. Although ZMs and Hough transform
    are computation intensive, we employ fast algorithms [37, 39] to overcome this
    limitation. ZMs and Hough transform together provide significantly improved results
    as both are robust to geometric as well as photometric transformations, which
    is demonstrated by widespread set of experiments on numerous image databases.
    The discriminative power of the proposed system is demonstrated in the later section
    of this chapter. To improve the performance of our system further, we use an operative
    comparison measure known as Sorensen’s distance [40, 41], also called Bray-Curtis
    distance.'
