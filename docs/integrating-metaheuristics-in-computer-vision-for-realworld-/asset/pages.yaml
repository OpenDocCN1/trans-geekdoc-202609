    # 2.8.1.1 Multiobject Tracking


    The process of tracking many objects in a video sequence over time is referred
    to as multi-object tracking. Multi-object tracking entails tracking numerous items
    at once, as opposed to single-object tracking, which focuses on following a single
    object of interest during the whole video sequence. Multi-object tracking is a
    tough process due to various issues, including occlusion, object appearance changes,
    and object interactions [15].

    There are various methods for multi-object tracking, such as:


    +   - Tracking by detection: In this method, objects are first identified in each
    frame using an object detector, and then associations between the identifications
    in different frames are made to create tracks. This method is frequently employed
    in multi-object tracking and has been demonstrated to produce cutting- edge outcomes
    on benchmark datasets.

    +   - Online tracking: This approach involves tracking objects in real-time as
    new frames arrive. Online tracking algorithms must be fast and efficient to operate
    in real-time applications.

    +   - Data association: Tracks are created by linking detections across frames
    using data association. Solving the data association problem, which is sometimes
    framed as an optimization problem, is a vital step in multi-object tracking.'
