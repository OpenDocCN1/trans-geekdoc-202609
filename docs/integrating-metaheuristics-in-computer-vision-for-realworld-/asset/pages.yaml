    # 6.4 Feature Learning


    Feature learning includes removing pertinent representations or features from
    the raw data in order to improve the performance of machine learning models. In
    traditional machine learning approaches, features are manually designed by experts
    in the field and are used as input to the model. However, with feature learning,
    the model learns these features from the raw data, thus automating the process
    of feature selection and design.


    There are various kinds of feature learning methodologies [16], including deep
    learning approaches, supervised and unsupervised learning, and others.


    # 6.4.1 Supervised Learning


    The process of extracting features from labelled data is known as supervised feature
    learning. A model must be trained in order to determine a mapping function between
    the input features and the output labels. The learned features can then be fed
    into a different prediction classifier model.


    Figure 6.3 serves as an illustration of supervised feature learning.


    The approach begins with a dataset including both input features and output labels.
    A training set and a testing set are created from the dataset. The testing set
    is used to evaluate the feature learning model''s performance after it has been
    trained using the training set.


    Examples of feature learning models that use input features as input include convolutional
    neural networks (CNNs), which are trained to learn a mapping function between
    the input features and the output labels [17]. A set of learnt features that capture
    the crucial information in the data is the result of the feature learning model.


    The taught features are then applied to a different classifier model, such as
    a support vector machine (SVM) [18], which is trained to forecast the output labels
    based on the learned characteristics. The output of the classifier model is the
    projected labels for the input data.'
