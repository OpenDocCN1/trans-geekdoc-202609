  md: '# 17.1 Introduction


    Image processing involves analyzing and manipulating digital images using mathematical
    algorithms and computer software. The image processing process usually includes
    several stages like image acquisition, processing, segmentation, enhancement,
    image compression, image visualization analysis and interpretation (refer to Figure
    17.1). In this work, we use segmentation and clustering techniques to enhance
    old manuscripts that has been damaged with the passage of time.


    Old photos and documents are important for preserving our history, culture or
    important events. Many documents created today, such as personal letters, photographs,
    contracts, newspapers, and medical records, are somehow considered historical
    documents. However, weak paper will usually disappear in the future due to adhesive
    swelling, noise, subsequent damage due to differences in size, storage, and other
    products. Protection of historical data is very important [9]. This is very beneficial
    not only for property but also for the status of the world.


    To ensure that these data are still accessible, they can be used as a reference
    in making further findings about the world and, most importantly, in the making
    of films necessary to ensure peace, equality and freedom everywhere. The primary
    purpose of data collection is for human research [5]. Imaging has an important
    role in developing this information. Basic steps in imaging involved are:


    # 17.1.1 Image Acquisition


    Image acquisition is the process of capturing digital images from an image sensor
    or other device. This can be done using a variety of imaging equipment such as
    cameras, scanners and microscopes. In digital cameras, images are captured by
    an image sensor and stored in a digital file. For scanners, images are captured
    by a detection device, such as contact image sensor (CIS) or charge-coupled device
    (CCD) and stored in digital data format [12].


