    **Keywords:** Exoplanet, machine learning, Kepler object of interest


    # 9.1 Introduction


    There is perhaps no greater question than “Are we alone”? The only way to answer
    this and many other questions, such as “How planetary systems are formed and evolved?”;
    “Is Earth the sole chapter in the tale of life?”; “How common is intelligent life
    in the universe?” and more, is to explore and study other worlds beyond our solar
    system [1]. These planets orbiting other stars, blackholes or just travelling
    across the space are known as Extrasolar planets or Exoplanets. Both scientists
    and the general public are fascinated with exoplanets, or planets that orbit stars
    outside of our solar system. Exoplanet discovery has a long history that dates
    back to the Greeks. But the first known search for exoplanet was by Christian
    huygens (1629-1695) in late 17th century [2]. However, the first exoplanet orbiting
    a sun-like star was not found until the second part of the 20th century. Michel
    Mayor and Didier Queloz predicted the presence of 51 Pegasi b (see Figure 9.1)
    using the radial-velocity technique, in 1995. The area of exoplanetary science
    has flourished since this discovery. With the development of advanced telescopes
    and methods for finding these far-off planets, the search for exoplanets has significantly
    increased over the last decade. Over 5,000 exoplanets have been verified as of
    December 2022, while many more candidates are currently awaiting confirmations
    [3]. The development of new telescopes and sensors made expressly for detecting
    exoplanets, including the Kepler spacecraft and the Transiting Exoplanet Survey
    Satellite (TESS), has aided in the hunt for exoplanets. These instruments have
    made it possible to


    ![](img/07f0bb0f402fd4e2f1880bf37d1ea963_177_0.png)


    **Figure 9.1** Comparison of 51 Pegasi.'
