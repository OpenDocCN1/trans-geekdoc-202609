  md: '# An Overview of Computational-Based Strategies for Drug Repositioning


    Shalu Verma<sup>1</sup>*, Nidhi Nainwal<sup>1</sup>, Alka Singh<sup>2</sup>, Gauree
    Kukreti<sup>2</sup> and Kiran Dobhal<sup>3</sup>


