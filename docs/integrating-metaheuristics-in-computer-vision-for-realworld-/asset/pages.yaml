    # Figure 6.1 Selection process for filter features.


    # 6.2.1.1.1 Pearson Correlation Coefficient


    The Pearson correlation coefficient is a statistical method for determining the
    linear relationship between two variables. A common stage in the process of choosing
    the filter feature is to calculate the relevance score for each feature. A value
    of –1 indicates a strong negative correlation, a value of 0 suggests there is
    no connection, and a value of 1 shows a strong positive correlation, according
    to the Pearson correlation coefficient. To calculate the Pearson correlation coefficient,
    use the formula below:


    ```

    r = \frac{n(\Sigma xy) - (\Sigma x)(\Sigma y)}{\sqrt{([n\Sigma x^2 - (\Sigma x)^2][n\Sigma
    y^2 - (\Sigma y)^2])}}

    ```


    In this formula, “xy” represents the total amount of the products of the respective
    values of X and Y, “x” represents the total of X values, and “y” represents the
    total of the Y values. The Pearson correlation coefficient is represented by “r.”


    # 6.2.1.1.2 Mutual Information


    This approach is founded on the idea of mutual information, which quantifies the
    information that two variables share with one another. The features in the dataset
    and the target variable, which is the variable we want to predict, are the two
    variables in the feature selection context. The formula below can be used to determine
    how much information there is between a feature and the target variable:'
