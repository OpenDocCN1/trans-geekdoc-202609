  md: '# 8.5 Conclusion and Future Scope


    The proposed work provided a brief overview of crypto currency, crypto mining
    and how to automate a hectic task of crypto trading with the help of freqtrade
    a python-based library. The work provides the whole framework of the project from
    the libraries used to the indicators used during the formation of the trading
    strategy. After analysing the data one can make changes to the strategy. Thus
    it is advised to test the strategy and working of the bot in dry run before using
    actual money trade. Automated crypto trading via programmed bots such as Freqtrade
    has the potential to significantly alter the future of cryptocurrency trading.
    These bots are intended to automate the purchasing and selling of bitcoin based
    on predefined rules and strategies. Traders can save time and effort while potentially
    making more educated and lucrative transactions by deploying automated trading
    bots. Using automated crypto trading bots has various potential advantages as
    it can help to decrease the impact of emotions on trading decisions since they
    adhere to a set of rules rather than being persuaded by emotions such as greed
    or fear. Furthermore, automated trading bots may examine market data and patterns
    in real time, potentially uncovering trading opportunities that a human trader
    would overlook. This is especially important for traders who do not have the time
    or resources to monitor the market on a continuous basis.


    It is crucial to remember, however, that automated crypto trading bots are not
    without hazards and limitations. They are susceptible to errors or malfunctions,
    and they may not always make the most profitable deals. Furthermore, they may
    be unable to respond to unforeseen market occurrences or changes in market conditions.
    As a result, in order to maximize their chances of success, traders must carefully
    assess the potential benefits and hazards of utilizing automated trading bots,
    and use them in conjunction with other methods and tools.


