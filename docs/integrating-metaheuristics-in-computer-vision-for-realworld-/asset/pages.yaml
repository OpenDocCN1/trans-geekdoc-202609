    # 1.8 Nanoparticles


    # 1.8.1 Carbon Nanotubes


    Graphite sheets tubes with nanoscale widths make to the class of nanomaterials
    known as carbon nanotubes [8, 94–99]. Their primary medicinal uses include medication
    delivery, tissue engineering, biosensors, gene therapy, and hormone production
    [100–104]. As passive diffusion cannot cross the BBB, conjugation of substances
    that encourage active transport to the brain is crucial for new uses in nanomedicine.
    Given the special characteristic of carbon nanotubes, they have attracted a lot
    of attention as nanocarrier systems over the past two decades [105]. Fluorescently
    tagged multiwalled carbon nanotubes have been discovered to pierce microvascular
    cerebral endothelium monolayers without significantly harming cerebral endothelial
    cells, which is a requirement for therapeutic application [106]. Using carbon
    nanotubes in nanofiber scaffolds has been demonstrated in a recent study to greatly
    increase neuronal development and differentiation, suggesting potential applications
    in the field of peripheral nerve rehabilitation [107] (Figure 1.3). Despite the
    many advantages of carbon nanotubes, there are drawbacks to their use, such as
    poor water solubility, limited biodegradability and dispersity, harmful drug-induced
    oxidative stress, and lung illness [108–110].'
