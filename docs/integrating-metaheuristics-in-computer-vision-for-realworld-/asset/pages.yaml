    # 15.3.2 Texture


    Texture is a term used to describe visual patterns that exhibit uniformity without
    being limited to a single hue or level of intensity. It is present on almost every
    surface in nature, including trees, brickwork, hair, fabrics and clouds. It holds
    vital data of structural makeup and surfaces. Figure 15.3 displays several different
    textures.


    # 15.3.2.1 Method of Depiction


    There are three types of texture representation techniques:


    +   • The grey level statistical properties of pixels that make up picture is
    used by statistical techniques to characterise texture. In photographs, various
    grey levels typically appear on occasion. Grayscale distribution in space is computed.

    +   • Texture is defined as being created via structural processes from texels
    (texture elements). These texels are set up in a predetermined pattern on a surface,
    following predetermined layout rules.

    +   • Spectral approaches, which are based on Fourier spectrum characteristics,
    high-energy peaks in Fourier spectrum to describe the worldwide periodicity of
    a surface’s grey levels is found. For texture classification, statistical approaches
    are crucial because it is through them that texture properties are computed. Tamura
    features, co-occurrence matrices, and filters with many


