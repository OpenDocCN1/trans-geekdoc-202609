  md: 'development process could have a significant positive impact on the biomedical
    and pharmaceutical industries because a new pharmaceutical product or drug requires
    a significantly longer and more expensive R&D period than a regular product does.


    Drug development is a sequential process that includes drug discovery, preclinical
    research, clinical testing, approval, and post-market surveillance [2]. The possibility
    to analyse the libraries of many compounds that already exist to locate a similar
    structure that fits with a certain target is another benefit of using computers
    in drug research. The use of computational approaches allows researchers to examine
    how a ligand—a substance that can be designated as an experimental drug—interacts
    with a target site (such as a protein or cellular receptor), change a ligand''s
    structure to improve its affinity, clarify action, or lessen toxicity. The most
    reliable replacement for paper-based recording systems, which can be very reliable
    and useful in various areas of medicine, is cloud technology. With the incorporation
