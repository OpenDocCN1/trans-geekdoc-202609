    in its application. So here we are going to see how we are going to take steps
    to take the technology in our home to next level.


    # 12.3.6.1 Image Processing


    What is image processing? Image processing is the process by which we can get
    a useful information from the image like finding a face in a picture. So, it''s
    like we are going to give one of our senses to our house. So let say some basics
    of it.


    Image is a nothing but orderly arrangement of pixels [4]. So we can consider image
    as a matrix where each pixel is an element in the matrix. So, we can perform matrix
    operation in the image so we can get some desired results, think of detecting
    an object.


    To take an outline of an image we use Sobel method through which we can get edge
    of an Image through which we can identify shape and moreover the object sometimes.


    | 100 | 100 | 200 | image matrix |

    | --- | --- | --- | --- |

    | 100 | 100 | 200 | |

    | 100 | 100 | 200 | |

    | -1 | 0 | 1 | mask matrix |

