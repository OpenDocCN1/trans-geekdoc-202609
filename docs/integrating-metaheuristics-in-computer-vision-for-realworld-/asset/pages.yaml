  md: '4) Dimensionality reduction: Unsupervised feature learning can also be used
    to minimise the dimensionality of the data, which can facilitate later tasks like
    classification or clustering. The models may become simpler to understand and
    more computationally efficient as a result.


    # 6.4.2.3 Disadvantages


    +   1) Lack of interpretability: The inability to comprehend the learnt features
    is one of the key drawbacks of unsupervised feature learning. It can be difficult
    to understand what the learned features represent, which can make it challenging
    to debug or improve the model.


    +   2) Overfitting: When the dimensionality of the latent space is sufficiently
    great, overfitting can occur in unsupervised feature learning. The model might
    then perform poorly in terms of generalization and be unable to handle brand-new,
    untested data.


    +   3) Computing complexity: When working with huge volumes of data, unsupervised
    feature learning can be computationally complex. Due to this, scaling the models
    to larger datasets may be difficult.


    +   4) Requires large amounts of data: Lots of unlabeled data are necessary for
    learning in order to learn useful characteristics. When labeled data is few or
    challenging to collect, this could be a drawback.


    # 6.4.3 Deep Learning


    Deep learning includes preparing a neural network to distinguish complex and abstract
    elements from incoming input automatically. Then, a range of tasks [21], such
    as speech recognition, object detection, picture classification, and natural language
    processing, can be performed using these recently discovered features.


    # 6.4.3.1 Neural Network Architecture


    Deep feature learning uses a neural network architecture that is built to automatically
    identify complicated and abstract features [16] from incoming data. It is composed
    of multiple interconnected layers of neurons that linearly transform input before
    activating it nonlinearly. In a hierarchical structure, the layers are organized
    with the lower layers learning straightforward traits and the upper layers learning
    more intricate and abstract features.


    We can see a deep neural network with numerous layers in Figure 6.6. A common
    neural network architecture for deep feature learning has an input layer, many
    hidden layers [22, 23], and an output layer. When receiving raw input data, such
    as photos, audio waves, or text, the input layer preprocesses it into a numerical
    form so that the following layers can process it. The final output, such as a
    classification label, a regression value, or a series of tokens, is created by
    the output layer.


    # 1) Hidden Layers


    ''The primary elements of the neural network architecture for deep feature learning
    are the hidden layers. They are in charge of mastering the intricate and ethereal
    aspects that'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_133_0.png)


    Figure 6.6 Deep neural network.


    characterize the input data. The number of hidden layers and the number of neurons
    in each layer are two hyperparameters that can be changed to improve the performance
    of the network.


    The fully connected layer, sometimes referred to as the dense layer, is the kind
    of hidden layer that is most frequently employed in deep feature learning. The
    weighted total of each neuron’s inputs, followed by a nonlinear activation function,
    determines each neuron’s output in a fully linked layer. Every neuron in a layer
    that is fully connected is connected to every other neuron in the layer above
    it. The training phase involves learning the weights and biases of the neurons
    using back propagation.


    Convolutional layers, which are utilized in deep feature learning, are another
    kind of hidden layer and are made to handle data having a grid-like layout [23],
    like photographs. Using a set of teachable filters to process the input data,
    convolutional layers are able to identify local patterns like edges, corners,
    and textures. A convolutional layer’s output is a collection of feature maps showing
    the presence of these patterns across various input regions.


    # 2) Pooling Layers


    Pooling layers are used to downsample [24] the feature maps produced by the convolutional
    layers. This reduces the dimensionality of the input and strengthens the network’s
    resistance to even the smallest changes in the input. The max pooling layer, which
    produces the greatest value in each local region of the input feature map, is
    the most widely used type of pooling layer. Additional types of pooling layers
    include average pooling and L2 pooling.


    # 3) Activation Functions


    For deep feature learning, activation functions are utilized to provide nonlinearity
    to the neural network architecture. The network can then learn complex, nonlinear
    correlations'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'between the input and output as a result. The rectified linear unit (ReLU),
    which outputs the input if it is positive and 0 otherwise, is the most often used
    activation function in deep feature learning. Additional subcategories of activation
    functions include the sigmoid function, hyperbolic tangent function, and softmax
    function.


    # 6.4.3.1.1 Convolutional Neural Network


    Convolutional neural networks (CNN) are the most popular type of neural network
    utilised for deep feature learning, which are designed to handle input having
    a grid-like structure [23], such as pictures.


    A pooling layer, multiple fully linked layers, and numerous convolutional layers
    make up the typical CNN design. The convolutional layers subject the input image
    to a set of teachable filters that identify regional patterns like edges, corners,
    and textures. By down sampling the feature maps produced by the convolutional
    layers, the pooling layer reduces the dimensionality of the input and enhances
    the network''s tolerance to slight changes in the input. The convolutional layers''
    features are combined by the fully connected layers to create a high-level representation
    of the input image that can be applied to classification and other tasks.


    # 6.4.3.2 Training Process


    During the deep feature learning training phase, a sizable dataset of labelled
    examples is input into the network, and the parameters of the neurons are then
    iteratively changed to minimize a loss function that assesses the discrepancy
    between the expected output and the actual output. The most popular loss function
    for classification issues is the cross-entropy loss, which calculates the difference
    between the expected probability distribution over the classes and the actual
    probability distribution.


    Forward propagation and backpropagation [25] are the two stages of the training
    process that are frequently involved. The input data is sent over the network
    during forward propagation, and the output is computed. In backpropagation, the
    gradients of the loss function with respect to the parameters of the neurons are
    computed using the chain rule of calculus, and stochastic gradient descent (SGD)
    is used to optimise the parameters.


    The optimisation procedure, which changes the parameters in the direction of the
    negative gradient of the loss function, reduces the loss over time. To prevent
    overfitting, the learning rate, a hyperparameter that regulates the magnitude
    of parameter updates, is frequently changed using a validation set. Other hyperparameters,
    such as the number of layers, the number of neurons per layer, and the dropout
    rate, can also be adjusted using a validation set.


    # 6.4.3.3 Advantages


    +   1) Automatic Feature Extraction: Deep feature learning enables the extraction
    of relevant and meaningful features automatically from unprocessed data. This
    eliminates the need for labor-intensive, arbitrary, and error-prone manual feature
    engineering.


    +   2) More Accuracy: Several machine learning applications, including speech
    recognition, image classification, and natural language processing, have shown'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'to benefit from deep feature learning in terms of improved performance and
    accuracy. The hierarchical structure of deep neural networks allows for ever more-complex
    and abstract properties to be inferred from the input data, leading to better
    representations of the underlying patterns and relationships.


    +   3) Transfer Learning: Deep feature learning supports transfer learning, which
    permits the application of knowledge gained from one task or topic to another.
    This can dramatically lower the quantity of labelled data needed for training,
    additionally improve the model''s capacity to generalise to new data.

    +   4) Robustness: Deep feature learning trains the model to disregard unimportant
    or noisy characteristics and concentrate on the most informative ones, increasing
    the model''s robustness to noisy or incomplete input.

    +   5) Scalability: Deep feature learning can be scaled up to handle big, complicated
    datasets since it makes use of distributed computing and parallel processing to
    train big models over a number of GPUs or CPUs.


    # 6.4.3.4 Disadvantages


    +   1) Cost of Computing: Deep feature learning can be costly to compute, particularly
    for big, deep neural networks with millions of parameters. Significant computational
    resources, such as high-performance GPUs or cloud computing services, may be needed
    for this.

    +   2) Data Dependency: A lot of labelled data is needed for deep feature learning
    in order to properly train the model. If getting labelled data is expensive or
    challenging, this could become a bottleneck.

    +   3) Black Box Nature: Deep feature learning models function as black boxes
    that translate input data to output predictions without explicit rules or explanations,
    making them challenging to read and comprehend. This may reduce their utility
    in situations where transparency and understandability are important.

    +   4) Overfitting: Deep feature learning methods are susceptible to overfitting,
    which happens when the model memorizes the training data instead of generalizing
    to new data. This can be reduced by monitoring the validation error during training
    and employing regularization approaches like weight decay and dropout.

    +   5) Vulnerability to Adversarial Attacks: Deep feature learning models are
    susceptible to adversarial assaults, which consist of intentionally created inputs
    intended to cause the model to predict the wrong things. In areas like driverless
    vehicles or medical diagnosis, this might have dire repercussions.


    # 6.4.4 Machine Learning and Deep Learning


    To draw inferences or make predictions based on data, deep learning [26, 27] and
    machine learning [26, 27] both include training algorithms. There are some clear
    differences between the two, though.


    Statistical techniques are generally used in machine learning to train algorithms
    using structured data, such as numerical or categorical data, in order to look
    for trends and'
