    # 7.6 Conclusions


    In this chapter, we suggested a synthesized approach to CBIR. We see that both
    contour and region based features of images are important for describing the outline
    as well as entire structure of the image. Therefore, we propose a local feature
    extractor based on Hough transform for linear edge detection, which gives the
    association among next to next edge points in the edge map of image. Being robust
    to noise and rotation, the linear edges derived using Hough transform are capable
    to effectively discriminating one class of images from the other, thus improving
    the retrieval accuracy significantly. We use ZMs’ magnitudes and phase coefficients
    for extracting the global features, as both are considerably proficient in representing
    the entire structure of an image. The use of Bray-Curtis similarity measure further
    enhances the results. The results of a large number of experiments over various
    databases representing a variety of geometric and photometric variations establish
    that the proposed synthesized solution outperforms and provide improved CBIR system.

    For future study, medical images will be considered and classification algorithms
    incorporated to further improve the accuracy.'
