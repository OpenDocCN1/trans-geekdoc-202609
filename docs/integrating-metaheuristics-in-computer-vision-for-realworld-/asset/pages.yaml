    an in Figure 9.2 which is a method for finding exoplanets that involves observing
    how much a star''s light dims as an exoplanet moves in front of it. This method
    continuously monitors a star''s brightness over time and searches for periodic
    dips, which are temporary decreases in a star''s brightness as an exoplanet passes
    right in front of it, in a star''s light curve, which is a graph showing a star''s
    brightness over time. These dips may indicate the presence of an exoplanet.


    But detecting these exoplanets is not so easy. It is the equivalent of “trying
    to differentiate a firefly next to a lighthouse,” as NASA Goddard scientist Mark
    Clampin puts it. For reference as in Figure 9.3 which shows the transit of Venus.
    The major challenge in exoplanet detection is to reliably forecast whether or
    not exoplanets exist in a star’s system given a dataset of observations of the
    star, including measurements of the star’s intensity and other properties [4].
    Due to the weak signals that these far-off planets emit, finding exoplanets is
    a difficult process. Other astronomical processes, such as noise from the star
    or other celestial objects in the field of view, frequently obliterate these signals.
    The kind of exoplanet, distance from the host star, and orientation of the planet’s
    orbit can all have a substantial impact on the signals that exoplanets emit.


    These problems can be addressed by using machine learning, a type of artificial
