    # 11.2.2.2.2 Prewitt Architecture


    In the control unit of the block diagram, buffer control register and pixel control
    register are processed in the finite state machine in which clock interrupt and
    reset is given as input to the output unit [10]. Input is stored in the memory
    unit of the external memory and computed to the buffer call and pixel registers
    and then to the arithmetic unit [12]. Finally 8 x 9 pixel input values are determined
    and edge pixels are detected as the output shown in Figure 11.6.


    # 11.2.2.3 Robert Cross Edge Detection Operator


    The Roberts cross operator, as a differential operator [3], is designed to approximate
    the gradient of an image using discrete differentiation by computing the sum of
    the squares of the differences between diagonally adjacent pixels. It was initially
    proposed by Lawrence Roberts in 1963.


    ![](img/07f0bb0f402fd4e2f1880bf37d1ea963_213_0.png)


