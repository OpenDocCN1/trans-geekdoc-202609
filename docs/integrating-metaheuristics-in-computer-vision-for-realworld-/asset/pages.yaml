    # 5.4 Conclusion


    In this study, we discuss the current status of IoT, AI, ML, cloud computing,
    big data, and digital twin in drug repositioning. There are many methods and strategies
    for predicting a drug''s accuracy, but because different parameters, algorithms,
    and programs apply to each software, a drug''s accuracy against a target in one
    software may not be the same in another. By stabilizing the programs and algorithms
    and reducing the mistakes, these variations can be overcome. With the enlargement
    of technology and data, AI performance has no horizon and is increasing quickly
    every day. The successful discovery of potentially repositioned drugs is possible
    using a variety of techniques. Newly developed computational drug repositioning
    sector would result from the successful fusion of various approaches and the data
    that is now accessible. Next-generation computational techniques like disease-disease
    association, molecular docking, MD simulation, network medicine, integrated biological
    network, AI, drug–drug interaction, and ML have recently been developed, making
    it possible to reposition drugs effectively. The pharmaceutical sector has mostly
    focused on ML- and AI-based techniques, which have significantly aided in target
    protein and novel chemical search, as well as property prediction. We can speed
    up the development of new drugs and significantly advance human health by creating
    machine-learning techniques. The methods created for big data integrate data from
    a variety of viewpoints, simplify the process of screening drug candidates, and
    enable the prediction of drug toxicity, considerably accelerating the development
    of novel treatments and improving their efficacy. With its flexible pricing structure
    and dynamic resource allocation, cloud computing is quickly becoming a top choice
    for repositioning pharmaceutical products. Digital twin instances and aggregates
    enhance reproducibility by lowering bias and promoting learning and the discovery
    of new knowledge (by ensuring target populations are accurately represented in
