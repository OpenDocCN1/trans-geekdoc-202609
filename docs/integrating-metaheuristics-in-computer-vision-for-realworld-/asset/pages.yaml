    # Abstract


    Edge detection plays a dominant part in image processing, image recognition and
    computer vision. This paper confers various edge detection algorithms such as
    Sobel, Robert, Canny and Prewitt detectors that exposes the complete performance
    of image information. Architecture, block diagram, accuracy parameters of edge
    detection prove in reducing the noise in the image and filter out unwanted information.
    Edge detection exactly lies on valid and definite number of contiguous data. Pixels
    are individually defined so as to improve the quality of edges and betterment
    of efficiency. Less exaggeration and noise reduction maintained completely. Finally,
    the output of the aforementioned edge detection techniques is shown in detail
    and compared with the experimental results using MATLAB.


    Keywords: Noise reduction, filtering, accuracy, PSNR, MSE, MATLAB


    # 11.1 Introduction


    Images consist of various figures about the entity, such as size, shape, color,
    and its orientation. The output of changes in light, color, shade and texture
    called edge. The edge detection methods is one of the major techniques in image
    processing. Its applications are broadly used in pattern recognition, medical
    image processing etc. There are two types that are Gaussian-based and Gradient-based
    edge detection techniques [9]. There are distinct variables influence edge detection
    similarly noise environment, edge structure, edge orientation, and luminance [10].
    Edge detection is helpful for data compressions, segmentation and image reconstruction
    [2]. Section 11.2 puts forth edge detection techniques. Section 11.3 presents
    the experimental results. Conclusion are given in section 11.4.'
