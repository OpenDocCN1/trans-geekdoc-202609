    # 3.4.2 Liver


    Liver fibrosis poses a significant medical challenge as it involves a complex
    and progressive interplay between hepatocytes and nonparenchymal cells (NPCs)
    over time. Replicating the complexity of the liver in both in vitro and in vivo
    models is challenging [25]. However, a liver tissue model was fabricated using
    primary human hepatocytes, endothelial cells, and hepatic stellate cells through
    bioprinting to mimic essential fibrogenic features, making it one of the earliest
    of its kind. This model demonstrated the precise and automated inclusion of these
    cells in the bioprinting process. In a newly released study, the same group altered
    the culture conditions, causing collagen to gradually build up in the tissues
    over a prolonged exposure period. When Kupffer cells were included in the experiment,
    the TGF-1 and methotrexate-induced fibrogenic response to cytokine and pharmacological
    stimuli improved [26].


    Another study team demonstrated a proof-of-concept for bioprinting a liver organ
    using a mixture of human stellate cells and HepaRG cells [26]. The expression
    of tight junctions and markers of general metabolism (glucose, lactate, and lactate
    dehydrogenase), as well as the expression of albumin and cytochrome P4503A4 was
    observed that they remained stable when cultivated under static conditions in
    the liver that was created using a stereolithographic printing method. In accordance
    with a previously released study, a team of researchers developed a hydrogel model
    of an air sac that mimics the lung and delivers'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'oxygen to the surrounding blood vessels [27]. These translucent lung air sac
    hydrogel model have a few minute manufacture time and an effective composition
    that includes intravascular 3D fluid mixers as two of their main advantages. A
    rodent model of chronic liver injury was also used to implant structured hydrogel
    constructions containing liver cells, demonstrating the potential practical significance
    of these cutting-edge biomaterials.


    # 3.4.3 Cartilage


    Because cartilage tissue lacks blood arteries and nerves (aneural), it differs
    from other tissues (avascular). They mostly get the nutrition from synovial fluid
    [28]. The attempts at cartilage healing are rarely particularly successful because
    of these usual variances. Additionally, cartilage lesions do not heal naturally,
    leading to persistent problems that might lower a patient''s quality of life.
    Similar to surgical techniques, tissue engineering techniques for cartilage repair
    also fell short of creating new tissue with characteristics and similarities to
    native cartilage. By using inkjet bioprinting, it is possible to produce tissues
    that closely resemble original tissues and heal cartilage without causing further
    harm. To fix cartilage abnormalities, a team of researchers 3D-printed human articular
    chondrocytes mixed with bioink. These chondrocytes had greater cell viability
    (up to 90%) and were equally dispersed throughout the hydrogel [29]. Furthermore,
    a stronger adhesion between the printed cartilage implant and the surrounding
    tissues as well as an increase in extracellular matrix production between the
    hydrogel scaffold and the host cartilage tissue were noted. The ear cartilage
    was successfully printed by another research team and implanted subcutaneously
    in naked mice. It is interesting to note that after 2 months, the build matured
    and developed new cartilage throughout the entire construct. The relevance of
    direct cartilage healing using bioprinting technology is illustrated by the aforementioned
    examples.


    The regeneration of cartilage uses a variety of scaffolds and printers. Using
    a multiprinter-head system, a chondrocyte-encapsulated alginate hydrogel and polycaprolactone
    was printed with excellent biocompatibility. Inkjet printing and an electro spinning
    device were also used in a method for creating cartilage [30]. It was discovered
    that rabbit chondrocyte inkjet printing and electrospun PCL fibers may be used
    to produce a five-layer tissue construct. It was discovered that the chondrocytes
    grew well inside the printed constructs. Studies have also mentioned printing
    auricular cartilage and meniscus constructions using alginate and nanocellulose.


    # 3.4.4 Muscle


    Common musculoskeletal injuries can leave a patient weak and severely impair their
    ability to carry out daily activities. If left untreated, significant muscle injuries
    can cause chronic disability in addition to the production of scars [31]. There
    are various benefits to 3D bio-printing for muscle restoration.


    In 2015, an integrated muscle-tendon unit was created by printing four separate
    components. The muscle component was formed using hydrogel-based bioink made of
    thermoplastic polyurethane and C2C12 myoblasts, while the tendon component was
    created using poly (-caprolactone) with NIH/3T3 cells. After being printed, this
    technique achieved high cell viability that was maintained for 7 days in vitro.
    Additionally, myoblasts have been'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'successfully printed using a thermal inkjet printer with excellent cell viability
    of over 90%. Fibronectin strips have also been printed on biomaterial films for
    cell seeding using the soft lithography technique, known as microcontact printing
    [32].


    Using the layer-by-layer stereolithography approach, a different group was able
    to print muscle at higher resolutions. However, these structures lack cell proof.
    The printed device, which is designed specifically for large actuation amplitudes,
    can mimic muscle activity.


    # 3.4.5 Bone


    Bone injuries can be caused by old age, infection, trauma, and malignancy. Allograft
    or xenograft is a common method of bone repair, but these procedures have their
    own drawbacks, such as a high likelihood of inadequate or no tissue supply, the
    need for additional surgery in most cases, and a constant risk of infection and
    immunological graft rejection [33]. The limits of conventional methods of bone
    restoration may be solved by tissue engineering techniques like 3D bone printing.


    The availability of suitable biomaterials and suitable cell types are two crucial
    components of any possible biomaterial for printing bone tissue. It has been discovered
    that hydrogels have promising promise for bone repair. The combination of acrylated
    RGD, poly ethylene glycol dimethacrylate (PEGDMA) hydrogel and matrix metalloproteinase
    (MMP) peptides was utilized to print bone tissue, resulting in strong bone growth
    after peptide activation. In addition, the osteogenic development of mesenchymal
    stem cells (MSCs) can be significantly enhanced by adding bioactive glass nanoparticles
    to specific hydrogels.


    Replacing hydrogel with a membrane consisting of a combination of PCL/PLGA/b-TCP
    has demonstrated the ability to stimulate bone regeneration and substantially
    enhance the process of osteogenic differentiation [34].


    # 3.4.6 Skin


    Skin is essential for protecting against the outside environment and for maintaining
    homeostasis in the body. Although there are numerous conventional skin substitutes
    that have been created and are already being utilized in clinical settings, these
    are not appropriate for individualized skin care. The need for frequent replacement
    of these commercial skin substitutes during therapy raises the total complexity
    and expense of wound care.


    Multicellular 3D constructions could be produced via laser-assisted 3D bioprinting.
    These structures have keratinocytes acting as bioink and fibroblasts embedded
    in a collagen matrix [35]. Skin tissue printing has frequently used the droplet-based
    bioprinting technique. The chitosan-based biomaterials were recently modified
    to be suitable for functional 3D skin bioprinting, alongside collagen-based biomaterials.
    Due to a shorter collagen cross linking time, the chitosan-based technique can
    overcome poor printability and accelerate the process.


    Vascularization, which is critical for tissue survival, remains a significant
    factor in the success of skin grafting. Using inkjet printing technology, cells
    can be printed on gels with high cell viability (>90%) [36]. According to researchers,
    the coprinting of keratinocytes, fibroblasts, and endothelial cells in the collagen
    matrix improved cell survival and wound contraction, thus enhancing the vascularization
    of skin implants. However, the production of new hair follicles or sweat gland
    growth in skin grafts remains a challenging task that'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'requires further investigation in the future. There are currently no known
    effective methods for producing human hair follicles. There is hope that dermal
    papillae and epidermal cells will work together to produce hair neogenesis, which
    is necessary for hair follicle formation [37]. In the near future, it might be
    feasible to create constructs that resemble skin and have veins, nerves, hair
    follicles, and sweat glands.


    # 3.4.7 Neutralization of Neurons


    Another clinical setting where 3D bioprinting has enormous potential is neuronal
    regeneration. Recently, scientists printed NG108-15 cells and pig Schwann cells
    for brain engineering using a piezoelectric inkjet printer [38]. Despite the high
    voltage in the printer, the cell viability remained high, and after 7 days of
    printing, a modest increase in vitality was seen.


    The effects of bioprinting on neuronal regeneration or reinnervation have been
    investigated in a number of in vivo investigations. One example of successful
    nerve restoration using 3D printing is the production of nerve guiding conduits
    using photocurable poly- ethylene glycol resin and microstereolithography. A recent
    investigation demonstrated the creation of conduits capable of encouraging reinnervation
    across a 3-mm gap in only 3 weeks, producing outcomes comparable to those of an
    autograft control. Another study described a new nerve guiding scaffold that combines
    fiber drawing with salt leaching to create microchannels, which allows for better
    control of microchannel cross-section and porosity, resulting in significant advantages
    for large-scale processes. In addition, a research team has developed a personalized
    nerve restoration technique using microextrusion printing [39].


    The printed materials used included Alginate/CaCl2/PLGA/PCL/silicone/gelatin.
    In another study, a semisynthetic hydrogel called Gelatinmethacryloyl containing
    glial cell line-derived neurotrophic factor (GDNF) or nerve growth factor (NGF)
    was utilized to facilitate effective nerve regeneration in printed scaffolds.
    Furthermore, a group of researchers produced a conduit that was biocompatible
    using Schwann cells, agarose, and mouse marrow-derived stem cells. The 3D-printed
    graft was strengthened by a collagen tube surrounding it and was inserted into
    a rat sciatic nerve injury model for 40 weeks, leading to the discovery of axon
    regeneration in the areas surrounding the agarose rods. These findings provide
    preclinical proof for the use of 3D bioprinting. Recently, a study created bioinks
    that are filler-free and bioinspired, by selectively blending natural and synthetic
    polymers to achieve predetermined rheological properties for the matrix. During
    in vivo experiments, the free-standing tissue constructs loaded with cells were
    found to be biocompatible and had a low cytotoxic response [40]. The fabrication
    of soft, autonomous 3D neuronal tissues could have potential advantages for the
    production of neural tissues for regenerative medicine.


    # 3.4.8 Pancreas


    Type 1 Diabetes Mellitus (T1DM) is currently treated through pancreas islet transplantation,
    which carries a significant risk of rejection by the immune system. However, the
    development of a bioprinted pancreas could provide a promising alternative therapy
    option with a lower rejection rate. This could not only reduce the financial burden
    and patient wait'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'times but also improve the effectiveness of transplants by combining islet
    cells with endothelial progenitor cells, regulatory T cells and other similar
    cells [41].


    A Polish research team has successfully created the first 3D-printed model of
    a vascularized bionic pancreas using a patient''s stem cells to derive beta and
    alpha cells. The pancreatic scaffold, which replicated the pancreatic vascular
    system, produced positive results in a flow-connected bioreactor.


    The internal vascular system of the bioprinted organ matches the prototype, as
    confirmed by MRI and CT scans. Animal research would be the next step in studying
    the functionality of a bioprinted pancreas in a living organism. The development
    of such a technology could benefit the process of producing neural tissues through
    biofabrication for the purpose of regenerative medicine as well [42].


    Recently, researchers successfully created 3D structures with macroporous hydrogel
    constructions and implanted islet cells using a combination of 3D extrusion bioprinting
    and islet encapsulation [43]. The construct remained viable and functional throughout
    the investigation, and insulin generation by the implanted islets continues to
    occur. This suggests the possibility of producing 3D bioprinted pancreases that
    could play a crucial role in the clinical management of T1DM.


    # 3.5 New Developments


    A noteworthy investigation involved the implantation of cocultured human umbilical
    vein endothelial cells (HUVECs) in porous scaffolds, which led to vascularization
    and ectopic bone growth. A recent study explored the effects of prevascularization
    of a calcium phosphate cement (CPC) scaffold on bone regeneration in vivo by coculturing
    human-induced pluripotent stem cell-derived (hiPSC-MSCs) with HUVECs for the first
    time. The findings demonstrated that coculturing HUVECs with hiPSC-MSCs significantly
    enhanced bone regeneration [44]. Therefore, the newly developed construct of cocultured
    HUVECs and hiPSC-MSCs, delivered through CPC scaffolds, holds promise for improving
    bone and vascular regeneration in orthopedic scenarios.


    Researchers conducted an interesting study where they utilized 3D-printed microporous
    scaffolds to create biological prosthetic ovaries that successfully restored ovarian
    function in sterile mice [45]. The scaffolds were first seeded with follicles
    and became highly vascularized. Upon implantation into medically sterilized animals,
    complete restoration of ovarian function was achieved. This innovative approach
    proved to be effective as puppies were even born through natural mating and thrived
    on their mothers’ milk.


    The meniscus, a C-shaped cartilage found in the knee joint, plays a crucial role
    in absorbing stress. However, meniscal tears are common due to degenerative arthritis.
    In a fascinating study, researchers were able to regenerate a functional knee
    meniscus in a large animal model (sheep) and followed up for three months [46].
    Anatomically accurate 3D-printed scaffolds were used to replace the sheep meniscus.
    The study emphasized that tissue defects can hinder the regeneration of complex
    tissues by impacting the survival and development of endogenous cells within the
    tissue.


    Several research teams are using human skin as a model to develop and enhance
    a 3D cell and protein printing platform on demand. A group of researchers aimed
    to create a skin model with a functional sheep meniscus regeneration by utilizing
    a novel 3D cell printing'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'technique [47]. The trans well system was emphasized in this study, indicating
    that the model maintained stratified epidermis layers and a stabilized fibroblast-stretched
    dermis even after 14 days. Furthermore, the approach was found to be more cost-effective
    and resource-efficient than traditional culture methods.


    In a separate study, researchers used a planar surface to print cells and proteins
    in nano or microliter droplets, which had minimal impact on cell survival and
    function [48]. They utilized constituent cells, such as keratinocytes and fibroblasts,
    as well as collagen to represent the dermal matrix of the skin, to create a biological
    representation of human skin tissue that was similar to 3D-printed skin.


    A bionic ear that closely resembles a human ear and is composed of a hydrogel
    matrix containing cells has been successfully 3D printed by another team of researchers.
    This remarkable ear is capable not only of perceiving stereo sound (different
    sounds received by the left and right ear) but also radio frequency signals that
    fall beyond the range of the typical human ear [49]. The ear is equipped with
    a conductive polymer embedded with silver nanoparticles, which enables it to detect
    inductive signals from electrodes by cultivating cartilage tissue around an inductive
    coil antenna.


    # 3.6 Progress in India


    The medical field has immense potential for 3D printing technology to revolutionize
    therapeutic care. Despite being in its early stages, some Indian companies are
    already offering 3D printing services to the medical community. One such company,
    Pandorum Technologies, has achieved remarkable success in producing artificial
    3D bioprinted liver tissues that closely resemble the human liver''s function
    [50]. These tissues can serve as a low-cost model for drug and vaccine research
    and can also be used to create full-scale 3D-printed organs. Additionally, Pandorum
    has successfully produced human corneas to help heal corneal lesions without scarring
    and aid in vision restoration through the bioregeneration process.


    Nova Beans, based in Gurugram, provides facial repair surgery and offers 3D-printed
    models for spinal cord injury surgery, brain aneurysm surgery, and digital dental
    solutions, with a focus on providing affordable and on-demand solutions for the
    Indian healthcare market [51]. Similarly, Mumbai-based Anatomis 3d is working
    on developing 3D-printed heart parts and has published articles on 3D-printed
    cardiac prototypes and models [52].


    In an effort to provide researchers with customizable 3D bioprinting services,
    Next Big Innovation Laboratories (NBIL) Pvt. Ltd. of Bangalore has created the
    first customizable 3D bioprinter in India, called “Trivima” [53]. Additionally,
    NBIL is in the process of developing “Innoskin,” a 3D bioprinted human skin product
    that uses patented 3D bioprinting technology. Innoskin offers two testing variations,
    human epidermis (HE) and FT (dermal and epidermal model), and is intended to be
    used for patients with burns, wounds, and other skin-related conditions.


    Finally, a team of researchers from the Indian Institute of Technology (IIT) in
    Delhi, specifically the Department of Textile Technology, has successfully produced
    3D bioprinted cartilage that closely resembles the ones naturally found in human
    knees [54]. This achievement marks the first instance of 3D bioprinted tissue
    being produced in an Indian laboratory, according to the research team.'
