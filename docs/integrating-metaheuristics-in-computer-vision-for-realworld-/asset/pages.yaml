    # 17.2.6 In Entertainment


    Image processing is used to create special effects for movies and video games.


    # 17.2.7 Object Recognition


    It can also be used for object recognition, motion detection, and face recognition.


    # 17.3 Enhancement of Handwritten Document


    The process of improving the visual quality and readability of scanned or digitized
    handwritten papers is referred to as the “problem of enhancing handwritten documents.”
    This is a crucial task in many fields, including document analysis, the preservation
    of historical documents, and digital archiving [26].


    The quality of the original document, the kind of ink or paper used, and the document’s
    age are just a few of the variables that might cause handwritten papers to deteriorate.
    The text might therefore become obscured, hazy, or unintelligible, making it challenging
    to read and comprehend. Enhancement techniques can be used to improve the quality
    of written documents by reducing noise, sharpening edges, improving contrast,
    and improving the overall appearance of text. These techniques may include image
    processing techniques, such as filtering, thresholding, and classification, and
    machine learning algorithms, such as deep learning and neural networks. In previous
    works, most commonly used technique is thresholding [24, 28].


    # 17.3.1 Local Thresholding Technique


    Local thresholding is a common technique used in image processing to binarize
    an image by segmenting it into foreground and background regions based on local
    properties, such as image intensity or texture [1, 3, 4, 7]. Figure 17.2 is the
    resultant image of the Figure 17.3. But there are number of issues with local
    thresholding when improving handwritten documents these are as follows:


    **Artifact and noise sensitivity:** Due to the sensitivity of local thresholding
    to noise and other image artefacts, the threshold values may differ dramatically'
