    # Abstract


    Angiogenesis is one of the hall-mark in cancer which is initiated in preneoplastic
    lesions, from the preexisting vessel. New vasculature supports the tumor growth,
    progression, invasion, and metastasis. Hypoxia is one of main mediator of angiogenesis,
    in addition to the vascular endothelial growth factor (VEGF), along with, basic
    fibroblast growth factor (bFGF), platelet-derived growth factor (PDGF) etc., which
    are secreted from tumor cells as well as from stromal cells. Ephrin EphRs, angiopoietin
    Tie, and Delta–Notch signalling pathways have crucial role in angiogenesis regulation.
    Food and Drug Administration (FDA) has been approved various VEGF inhibitors for
    treatment of advanced cancer. However, acquired therapy resistance limits the
    benefit of anti-angiogenic therapy. This therapy resistance proved the limited
    knowledge of angiogenesis in cancer, creating the idea for its further deep understanding.
    Machine learning or artificial intelligence is one of the recently technologies
    that involves analytical strategies, which are currently applied to biomarker
    discovery, gene expression, and image understanding in digital pathology. With
    the availability of deep learning techniques, researchers are able to easily and
    accurately quantify morphological structures and are freed up to focus on advancing
    science. The current review article describing the angiogenesis, its role in cancer,
    mechanism, in addition to the machine learning approaches in angiogenesis understanding.


    Keywords: Angiogenesis, cancer, resistance, deep learning, molecular mechanism


    # 16.1 Introduction


    Cancer, a pathological condition that resulted due to uncontrolled or unregulated
    huge cell divisions. The metabolic rate of cancer cells is usually very high compared
    to their normal healthy cells [1, 2]. Under such conditions microenvironment of
    the tumor faces


