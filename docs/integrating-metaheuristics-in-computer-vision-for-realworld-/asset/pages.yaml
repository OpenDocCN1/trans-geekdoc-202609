  md: '# # Printing Organs with 3D Technology


    **Shaik Aminabee**


    Department of Pharmacology, V. V. Institute of Pharmaceutical Sciences, Gudlavalleru,
    Krishna District, A.P, India


    **Abstract**

    The lack of organs is a well-known global health issue. The development of 3D
    printing has long been considered a potential remedy for the lack of organs. With
    the right bioink, 3D printers can create biological cells, tissues, and even organs.
    The technology used to print organs functions in a manner akin to that of standard
    2D desktop printers. Ink is applied in layers to accomplish this. Up until the
    desired shape is obtained, this is done. However, this machine prints with a bioink,
    not a 3D printer. Human cells that are still alive make up this bioink. Skin grafts
    and surgical models are two medical applications of this new 3D printing technology.
    Yet this is the first time they have managed to create an organ that can be used
    for transplant. Instead of using animal testing, which frequently yields unreliable
    results, this technology could aid in studying drug interactions on real humans.
    For people with liver or kidney disorders who now rely on donors or artificial
    implants, this technology holds considerable potential. For patients in need,
    3D printing technology is currently being used to manufacture transplants that
    work, and it will only get better in the years to come. The bladder is the only
    organ that has been 3D printed and implanted into a human being successfully.
    The tissue from the host''s bladder was used to create the bladder. According
    to some researchers, the capacity to customize organs to suit the recipient is
    a potential advantage of 3D-printed organs. However, opponents argue that the
    technology is still in its early stages and that 3D-printed organs are not as
    good as natural ones. They are also apprehensive about the ethical implications
    of cultivating organs in a laboratory.


    **Keywords:** 3D printers, transplants, complex products, critics


    # ## 3.1 Introduction


    The ability of the body to repair and replace damaged tissue is innate. Regeneration
    is constrained, though, and a variety of processes are at play (tissue type, or
    growth hormones). Beyond a certain size, significant tissue damage necessitates
    external support or organ transplantation. The availability of organ or tissue
    donors is crucial because of the ageing population, the risks associated with
    more diseases or accidents that can cause the loss of organs, and other factors.
    Although science has made great strides in closing this gap by'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'opening the door to tissue autografts and allografts, the lack of donors continues
    to be a major obstacle. Numerous patients worldwide pass away each year while
    waiting for a compatible donor. This is due to the fact that there are still much
    more recipients (people on the waiting list) than there are donors or transplants
    [1]. In 2017, UNOS and the U.S. Government Information on Organ Donation and Transplantation
    reported that around 20 people pass away daily due to the lack of available organs
    for transplantation. Organ donation is required in only 0.3% of fatalities. Despite
    finding a suitable donor, patients still face significant obstacles, such as high
    transplant costs and the risk of immunogenic rejections.


    The term “additive manufacturing” is another name for three-dimensional (3D) printing
    (AM). It is a method for creating 3D solid models of any shape from digital data.
    Medical 3D printing has long been a pipe dream in terms of science. Hull CW submitted
    the initial 3D printing patent in the 1980s. A 3D print of any object can be produced
    by adding successive layers of foundation material on top of one another [2].
    Since then, 3D printing has had an impact on a number of industries, including
    manufacturing, engineering, and medicine.


    In recent years, the idea of tissue regeneration, which was once regarded as a
    buzzword, has gained significant popularity. The emergence of new terminologies
    like tissue engineering (TE) and regenerative medicine (RM) can be attributed
    to this trend. Tissue engineering is a field that combines biological principles
    and engineering techniques, and it focuses on the replacement of damaged tissue.
    The scaffolds manufactured by the 3D bioprinting method are sturdy enough to physically
    support newly created tissue while also supporting cell contact [3]. It has been
    discovered that including stem cells in 3D bioprinted scaffolds has excellent
    potential for producing replacement tissues.


    The 3D printing technique typically makes use of powder, plastics, metals, liquids,
    or even living cells. This technique is highly adaptable to specific requirements
    because the components can be integrated or deposited onto a substrate. The procedure
    is precise, economical, and repeatable, allowing it to dependably enable the creation
    of customized tissues. Additionally, it offers the chance for academics, engineers,
    and physicians to work together to create a real product from a digital file that
    was downloaded and transferred over the internet [4].


    The use of 3D bioprinting has become indispensable in the medical field, it can
    be used to produce various types of tissues and organs for both humans and animals,
    as well as surgical implants and anatomical models that serve diagnostic and educational
    purposes. The objective of this study is to present a comprehensive review of
    the use of 3D printing technology in the field of medicine, including a discussion
    of current research trends and their impact on the healthcare industry.


    # ## 3.2 Bioprinting in Three Dimensions (3D)


    A printed model must be finished in five technical processes. Finding out the
    anatomy of the target area is the first step. Subsequently, the structural data
    is subjected to magnetic resonance imaging (MRI) or computed tomography (CT) scanning
    to generate the 3D geometry. The resulting file is prepared for actual printing.
    Next, the right 3D printer and components are carefully chosen. To build layered
    slices of the model, additional processing'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_72_0.png)


    Figure 3.1 Overview of organ 3D bioprinting workflow.


    is applied to the file. The printer is then fed these portions to print them.
    The initial layer is printed initially, followed by the addition of more layers
    until the entire model is formed. The process of 3D bioprinting is depicted in
    Figure 3.1. Initially, the anatomical structure of the targeted area is identified
    as the first step in the process. Afterward, the 3D geometry file undergoes refinement
    in preparation for physical printing. Careful selection of the appropriate 3D
    printer and components follows, and the scaffold is printed using the chosen equipment.


    # 3.3 3D Printing Types


    The printing industry has undergone significant advancements over time, resulting
    in the adoption of various 3D printing techniques in research and commercial applications
    [5]. Some of the well-known 3D printing techniques include fused deposition modeling
    (FDM), stereolithography, microextrusion, inkjet printing, selective laser sintering
    (SLS), laser beam melting, electron beam melting, digital laser printing (DLP),
    and polyjet printing [6]. Furthermore, bioprinting systems utilize various methods,
    such as radio/microwave, acoustic (ultrasound-based), pneumatic techniques, and
    electrohydrodynamic (EHD), to produce tissues and organs. Inkjet printing, laser-aided
    printing, extrusion printing, and stereolithography are some of the commonly used
    bioprinting techniques, and the subsequent sections provide brief explanations
    of each method.'
