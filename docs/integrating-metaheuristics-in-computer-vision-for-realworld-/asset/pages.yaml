    # ## 13.2.3 Gradient-Free Algorithm


    Even gradient calculations for large-scale problems can be expensive, and this
    is particularly true for deep learning problems [25]. In this case, a rough estimate
    or a partial evaluation of the gradient vector could be helpful. Stochastic gradient
    descent (SGD) is one of them. It assesses gradients over a small subset of data
    sparingly, and the selection of those data may be arbitrary. Optimization algorithms
    that take cues from nature can benefit from randomization because it improves
    the diversity and quality of solutions, increases exploration of the search space,
    and prevents getting stuck in local optima.


    # ## 13.2.4 Nature-Inspired Optimization Algorithms


    Alan Turing, the father of heuristic and metaheuristic algorithms, most likely
    invented them in the 1940s. Then, in the 1960s, evolutionary programming and genetic
    algorithms were devised [26]. In the 1980s, simulated annealing emerged first
    [27], followed by Fred Glover''s major research on tabu search and meta-heuristics
    [28, 29]. The 1990s represented a turning point for meta-heuristics and evolutionary
    computation. Both ACO [2] and PSO [30] were developed in 1995, the former by Marco
    Dorigo and the latter by James Kennedy and Russell C. Eberhart. After that, R.
    Storn and K. Price came up with differential evolution (DE) [31] in 1997. D.H.
    Wolpert and W.G. Macready developed the deep no-free-supper theorems at the same
    time [32].


    The harmony search [33], the bee algorithm [34], FA [35], CS [36], and BA [37]
    were all developed rapidly in the first decade of the twenty-first century. More
    algorithms, such as the flower pollination algorithm, have been published in the
    research [38], and the research advances continuously, like the grey wolf algorithm
    [39], arithmetic algorithm [6], Aquila algorithm [5].


    In general, nature-inspired algorithms are classified as heuristics or meta-heuristics,
    though the distinction is minor. In this context, “heuristic” refers to discovering
    or locating something through hit and trial, whereas “meta” refers to something
    beyond. Most literature studies will refer to nature-inspired algorithms as metaheuristics.


    Among the primary benefits of metaheuristic algorithms, is their ability to rapidly
    locate accurate and potentially optimal answers. The theory behind these methods
    is that they'
