    Kanyakumari, India


    # Abstract


    Content-based image retrieval (CBIR) enables users to retrieve photos based on
    their visual content rather than textual keywords or tags. Based on visual elements
    including color, texture, shape, and composition, it entails looking for digital
    photos in a sizable database. By various approaches, the visual characteristics
    of query image is compared with the photos in the database, including feature
    extraction, indexing, and similarity measurement. Large image collections are
    now possible through advancements in data storage and image capturing technology.
    In this case, it is essential to create the right communication system and manage
    those collections effectively. The utmost popular methods make use of that are
    known as CBIR technologies. These types of systems essentially look for photos
    that match a user-defined pattern or specification (such as a shape sketch or
    an example of an image). Their objective is to facilitate image retrieval based
    on content qualities, which are typically stored into feature vectors and include
    attributes like shape, color, and texture. The ability for automatic retrieval
    is one of the advantage of CBIR approach over the conventional keyword-based approach,
    that often requires time-intensive note of database images. Many applications,
    including surveillance, medical imaging, and e-commerce, can benefit from these
    systems. Many well-known information retrieval engines, including Google Images
    and Bing Images, are built on the CBIR platform. As computer vision and machine
    learning technologies have grown, it has become more complex and advanced. But
    it still has certain issues to work out, to cope with images of poor quality and
    strike a good balance between recall and precision.


    # Keywords:


    Similarity measures, content-based image retrieval, feature extraction, bag of
    visual words, euclidean distance'
