    # 13.2.9 Arithmetic Algorithm


    Abualigah _et al._ [6] proposed the arithmetic optimization algorithm (AOA); it
    employs straightforward arithmetic operators to find the optimal solution. As
    a first step, the algorithm is designed to produce a population of randomly generated
    solutions. During an operation, the operators calculate the ideal locations of
    adjacent optimal solutions. The best solution obtained thus far is used to update
    each solution. Typically, AOA algorithms involve searching the search space for
    the optimal solution. Exploration and exploitation are typically the two phases
    of this procedure. During the exploration phase, the algorithm generates a variety
    of solutions by randomly or heuristically traversing the search space. The objective
    of the exploration phase is to examine as much of the search space as feasible
    in order to identify potential areas where the optimal solution may exist while
    preventing local solutions. Equation 13.16 demonstrates that the search phase
    is influenced by Math Optimizer Accelerated (MOA) function. Following that, enhancement
    of the provided solution is carried out using Exploitation. Few of the works mentioned
    in literature can be found in Mahajan _et al._ [45, 46]. The configuration of
    both process parts is detailed in the subsections that follow.


    $$MOA(itr) = min + itr \times \left( \frac{max - min}{maxIt} \right)$$

    (13.16)'
