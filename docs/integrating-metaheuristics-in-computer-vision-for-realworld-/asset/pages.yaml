  md: 'The aim of the model is to target research groups who want to analyze the different
    conditions and their association with age and gender of a particular patient.


    The model will have two parts:


    +   1) The first part of the model will deal with real-time ECG data and detect
    the irregular heartbeats.


    +   2) The second part of the model will then further take in account the different
    factors like age, gender, weight and height and will aim to identify the further
    underlying conditions [6, 7].


    # 14.2 About the Dataset


    This dataset is composed of two collections of heartbeat signals derived from
    two famous datasets in heartbeat classification, the MIT-BIH arrhythmia dataset
    [15] and The PTB diagnostic ECG database [16]. The number of samples in both collections
    is large enough for training a deep neural network.


    The dataset considered for this case is cardiac arrhythmia database. The dataset
    consists of 549 instances and 290 associated subjects. The dataset classifies
    16 different heart conditions ranging from premature contraction to blockage which
    are directly associated with heart arrhythmia. The dataset also consists information
    regarding the gender of the patient along with other personal details like weight,
    height, age, etc. As shown in Figure 14.1 percentage of different beats present
    in the dataset.


    This dataset has been used in exploring heartbeat classification using deep neural
    network architectures, and observing some of the capabilities of transfer learning
    on it. The signals


