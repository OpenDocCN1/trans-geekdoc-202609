- pgno: 233
  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_233_0.png)


    Figure 12.9 Edge detection using sobels method.


    Let''s say about Sobel method, it is gradient-based method that looks for strong
    changes in the first derivative of an image. The Sobel edge detector uses a pair
    of 3 x 3 kernel matrix, one estimating in the x-direction and the other in the
    y-direction. That it takes a 3x3 image matrix which is multiplied with 3x3 mask
    matrix by element multiplication. Then they all added up which gives value of
    the centre element.


    The value 400 will be at the centre pixel now (Table 12.3).


    Here the Figure 12.9 is processed using OpenCV which is an open-source library.
    OpenCV is an open-source library for image processing and computer vision, originally
    developed by Intel. Here we used Sobel''s method to find the outline of the image
    with respect to x axis and y axis and combined both using Laplacian. So this is
    how we process image. And as like this we can find a human face using the curves
    in the human faces. As like we can detect eye in the image.


    So now we have some idea about how we can process an image now let see how we
    are going to use this method to automate the house.


