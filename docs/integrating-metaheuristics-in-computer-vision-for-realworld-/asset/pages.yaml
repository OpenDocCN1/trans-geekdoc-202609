    # 5.2.1.5.3 Pathway


    The pathway approach permits locating genes engaged in general signaling networks
    or biological pathways or in addition to GWAS-based single candidate genes, providing
    a list of proteins for therapeutic target development. Each pathway contains a
    variety of interactions between molecules, and specific functions, such as cell
    division, are triggered by signaling transmission from molecule to molecule. As
    a result, flaws in any one of the pathway''s steps may cause the pathway to malfunction
    and ultimately lead to disease [31]. The route method is useful for identifying
    the underlying connections between diseases. More efficient treatments for illnesses
    like chronic myelogenous leukaemia and multiple sclerosis have already been provided
    with the use of pathway techniques. Understanding all of the pathways and their
    functions inside of human cells might make it easier to cure some of the most
    challenging diseases. Overall, disease target selection and subsequent treatment
    development are greatly facilitated by pathway/network-based techniques [32, 33].


    # 5.2.1.5.4 PheWAS


    Because of the integration of EHRs for various illness types from various racial
    groups with genomic data, precision medicine is perceived from a new perspective.
    As a result, the phenome-wide association study (PheWAS), a cutting-edge paradigm
    that integrates data from both GWAS and EHRs from major cohort studies, has emerged
    [34]. The genotype-phenotype link was broadened by the PheWAS, which also enabled
    researchers to find new uses for drugs that had previously been given [35]. As
    an illustration, consider the study that merged the PheWAS and Drug Bank to evaluate
    possible drug candidates for the treatment of both uncommon and common illnesses.
    There were 52,966 drug-disease combos discovered in that research, with approximately
    a third of these pairings being supported by writings, ongoing clinical studies,
    and pre-existing drug-disease associations [36].


