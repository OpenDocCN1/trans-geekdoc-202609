    # 9.3 Proposed Framework


    In this project, machine learning algorithms will be used to predict the existence
    of exoplanets and to classify the type of exoplanets. Exoplanet prediction and
    classification are important areas of study, as they have the potential to significantly
    advance our understanding of these celestial bodies and their role in the universe.
    A variety of machine learning algorithms will be employed, including support vector
    machines, logistic regression, k-nearest neighbors, random forest, and extreme
    gradient boosting. The performance of these algorithms will be evaluated using
    a range of metrics, including accuracy, precision, and recall. A confusion matrix
    and a feature importance plot will also be used to provide a more detailed analysis
    of the performance of the algorithms and to understand which features or variables
    are most influential in making predictions. A detailed framework for dataset1
    is shown in Figure 9.4.


    The steps involved for predicting exoplanets using machine learning are:


    +   1. Data collection: In order to train your machine learning model, you must
    first collect a dataset of exoplanet observations. The mass, radius, and orbital
    properties of the exoplanets, as well as any other significant variables that
    could be helpful for prediction, should all be included in this dataset.


    +   2. Data preprocessing: Preparing the data for machine learning requires preprocessing
    the data after you get your dataset. This might involve addressing missing or
    incomplete values, scaling the features, and cleaning and formatting the data.


    +   3. Exploratory Data Analysis (EDA): Before creating a machine learning model,
    it is often beneficial to carry out EDA in order to comprehend the dataset''s
    properties and spot any trends or patterns that could be important for prediction.
    This might involve investigating the connections between various attributes and
    the target variable (exoplanet presence) as well as showing the distribution of
    various features and determining their correlations.


    +   4. Data balancing: If the classes in your dataset are imbalanced, you may
    want to use techniques such as SMOTE to balance the classes. This involves synthesizing
    new examples of the minority class to better match the distribution of the majority
    class.


    +   5. Model selection: Select a machine learning model to employ for prediction.
    Models come in a wide variety, with decision tree, support vector machine, neural
    networks and random forest among the options.


    +   6. Model training: Model training involves fitting the selected model to the
    dataset, then tuning the model''s parameters to maximize performance.'
