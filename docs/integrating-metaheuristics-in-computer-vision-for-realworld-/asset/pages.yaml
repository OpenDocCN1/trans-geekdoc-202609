    # 15.2 Related Works


    Images are shown together with related searches. The assumption in the literature
    is that there are two major groups into which CBIR approaches can be placed.


    # 15.2.1 Conventional-Indexing Techniques


    The primary category employs standard indexing techniques. To minimise the research
    path, the data structure''s main concept is to group related objects together.
    There have been numerous index tree models. Data partitioning techniques are one
    of them. Among them are the SS-Tree, SR-Tree, R-Tree, R+-Tree, and M-Tree [1–5].
    It uses Minimum Bounding Rectangles (MBRs) or Minimum Bounding Spheres (MBSSs)
    to cover neighbor vectors, and they are arranged in a hierarchical tree structure.
    These techniques might result in overlapping zones.


    Other approaches, such as Grid-File, K-D-B-Tree, and LSD-Tree [6–8] divide the
    data space along specified hyperplanes without respect to how the data is distributed.
    As a result, there exist two regions that are not connected to one another; their
    union is the entire space. The concept “optimistic techniques” is used to describe
    these methods. Despite the fact that various frequently access methods work effectively
    for low-dimensional areas, it’s generally termed as the number of dimensions increases,
    their performance will suffer. There are many other alternative approaches. These
    methods based on the approximation vector method seemed to be able to overcome
    the dimensionality curse. These are referred to as “pessimistic approaches.” A
    few examples include LPC-File, GC-Tree, and VA-File [9–11]. Bit strings are used
    to approximatively represent the data vectors that are included within the cells
    or regions of the data space after which the cells or regions are partitioned
    into. During k-NN search a relatively small approximation file for a particular
    query vector is systematically read rather than the complete data file. A limited
    amount of the entire database is viewed because only a portion of the original
    vectors will be used as they are filtered. Unfortunately, when the size of picture
    databases increases, the performances of the pessimistic approaches deteriorate,
    just like they do for optimistic ones. These methods incorporate complicated index
    structure, which is where the “curse of the size” phenomena originate.'
