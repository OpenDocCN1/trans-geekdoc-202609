    From the above experimental, the classification accuracy obtained using two levels
    and three-level decomposition is less valuable. The four-level decomposition with
    48 directional filters provides better classification accuracy. For this dataset,
    the MDC classifier gives a classification accuracy of 98.53% with a four-level
    decomposition with 48 directional filters. For the same dataset, the SVM classifier
    gives a classification accuracy of 99.26% with the same level of decomposition
    with the same number of directional filters. The CA provided by the SVM classifier
    is 0.73%.


    Further increasing the decomposition level, the increasing classification accuracy
    rate has the minimum. But the required number has been increased. From the above
    experiments, we conclude that four-level decomposition with 48 directional filters
    (8, 8, 16, and 16) has provided the relevant frequency information more than other
    levels and a higher number of directional filters. Hence, we consider four-level
    decomposition with 48 directional filters for the remaining work. The classification
    accuracy of the algorithm has been calculated with the MDC and SVM. The results
    are represented in Table 18.4.'
