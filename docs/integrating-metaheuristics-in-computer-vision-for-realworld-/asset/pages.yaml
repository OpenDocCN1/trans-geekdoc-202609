    Each of the most common approaches to texture classification suffers from the
    following disadvantages: Texture categorization uses mean, variance, and co-occurrence
    matrices. They are susceptible to textural pattern changes, making categorization
    results unreliable. Structural approaches analyze a texture’s edges and elements.
    They are computationally demanding and may not work for irregular or complicated
    textures. Model-based methods identify and characterize textures using arithmetic.
    Model-based techniques may fail for textures with many or overlapping features.
    Frequency-based approaches use texture frequency spectra to identify characteristics.
    These approaches are sensitive to scale and orientation, making categorize textures
    with complex or irregular patterns problematic. Wavelet transforms decomposing
    textures into their frequencies. Wavelet-based approaches can capture local and
    global texture information, but they are computationally demanding and may require
    specialized technology. Each standard texture classification method has problems.
    The application, texture data, and computational resources must be considered
    to overcome these restrictions [35, 38].


    The objectives of the proposed work are:


    +   • To use Shearlet Transform to perform texture classification for images.

    +   • To propose adaptive equalization based Shearlet Transform method to improve
    image texture classification accuracy.

    +   • Validate the performance of the proposed scheme against conventional schemes
    with various databases.


    In order to improve an image’s contrast, adaptive histogram equalization (AHE)
    balances out the histogram of the image. Images with low contrast or irregular
    lighting may benefit greatly from this method. On the other hand, Shearlet transforms
    are a multi-scale, multi-directional transform that can record both the image’s
    orientation and its scale. It has been proven that Shearlet transforms are effective
    at texture categorization because they capture both the local and global properties
    of textures. It is possible to extract robust and discriminative features from
    texture photos by integrating these two methods in an adaptive histogram equalized
    Shearlet transform-based texture classification system. Shearlet transforms preserve
    the textures’ directional and scaling characteristics, and AHE helps improve the
    distinction of the texture images.


