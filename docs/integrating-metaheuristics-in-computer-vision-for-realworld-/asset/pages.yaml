    # 1.8.2 Dendrimers


    A class of artificial macromolecules known as dendrimers exhibits a structure
    like a tree and unique encapsulating characteristics. Interesting structural characteristics
    of dendrimers include globular and layers of branched nanostructure, as well as
    a number of terminal functional groups on the outer layer. They may assemble complexes
    and enclose a variety of molecular entities [111]. Due to their capacity to cross
    the blood–brain barrier, dendritic macromolecules are commonly utilised in the
    treatment of illnesses of the central nervous system [112]. Because polyamidoamine,
    polypropyleneimine, and polyacryl ether are utilised in dendrimer formulations
    and may encapsulate both hydrophilic and hydrophobic compounds, these polymer-based
    nanostructures are frequently used as nanocarriers to transport different medicinal
    and imaging agents [113, 114]. The PEGylated dendrimers had the additional benefit
    of reducing blood clotting, which was helpful in the treatment of stroke. In a
    mouse model of permanent focal brain ischemia, the brain could also be found to
    contain the optimised PAMAM formulation 24 hours after injection. PEGylated PAMAM
    dendrimers extend the half-life of blood circulation and may be used in medication
    delivery systems [115].


