    # 13.5 Conclusion


    This chapter discussed in detail various swarm-based optimization algorithms.
    In spite of their widespread utility, there are numerous challenges to overcome
    in swarm intelligence algorithms. We hope this chapter will encourage further
    study in this area and highlight the recent advancements along with their pros
    and cons. Algorithms are described in greater depth, followed by the mathematical
    underpinnings employed in assessing optimization algorithms. This chapter seeks
    to review everything from classical optimization to the most recent optimization
    algorithms as discovered by multiple web-search engines. The meth- odologies used
    to improve swarm intelligence algorithms to make them compatible with dynamic
    changes, are organized and thoroughly explained. Furthermore, real-world challenges
    are also elaborated.


