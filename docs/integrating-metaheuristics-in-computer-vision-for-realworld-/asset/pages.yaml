  md: 'available (FMISO). Each approach has particular advantages and disadvantages.
    The penumbra is identified as tissue with “misery perfusion” (lower CBF but maintained
    CMRO2 due to higher OEF) by multitracer PET, which produces quantitative maps
    of CBF, cerebral blood volume (CBV), CMRO2, and CMRglu [44]. The issue with multitracer
    PET was the substantial variation in penumbral CBF values (from 4.8 to 14.1 in
    one analysis and from 7 ml/100 g/min to 22 ml/100 g/min in another). This illustrates
    how OEF is an unreliable indicator of tissue viability and how data from a single
    point in time can be perplexing when the overall trend is not known. Due to this,
    a marker that can recognize irreversibly damaged tissue independent of the length
    of time since the stroke began or changes in CBF over time is required [44]. PET
    with FMZ occurred as a result [45]. As it is diminished in all metabolically active
    tissue (except from the infarcted core), FMISO identifies the penumbra by designating
    hypoxic tissue. Oxygenated tissue is able to reoxidize the metabolite to its original
    form, but hypoxic tissue is unable to do so. The tissue at risk is then marked
    by the metabolite’s binding to intracellular molecules [46]. Since some tissue
    maintains oxygenation in regions of low CBF by raising OEF and since some tissue
    has a lower baseline CBF and metabolic rate, hypoxia may be a more accurate predictor
    of tissue at risk than CBF (such as white matter) [46]. Theoretically, the fact
    that animals have a considerably lower white to grey matter ratio than humans
    is one reason why neuroprotectants that are effective in animal models cannot
    be translated to humans. This method would enable testing of white matter neuroprotectants
    because FMISO can image ischemic white matter [46]. However, the utility of PET
    in clinics is constrained by technical requirements and the brief half-life of
    15O radiotracers [41].


    # 1.3 Artificial Intelligence–Based Diagnostic Tools


    There are numerous uses for artificial intelligence technologies in acute stroke
    imaging, with ischemic and hemorrhagic stroke types. Infarct or hemorrhage identification,
    segmentation, classification, major vascular occlusion detection, Alberta Stroke
    Program Early CT Score grading, prognostication, and other components of the stroke
    therapy paradigm can all be aided by artificial intelligence. Particularly, cutting-edge
    AI methods like convolutional neural networks hold promise for effectively and
    accurately carrying out these imaging-based activities [47]. An input, one or
    more hidden layers, and an output are the components of artificial neural networks
    (ANNs), a kind of deep learning (DL) that imitates biological neurons. An input,
    one or more hidden layers, and an output are the components of artificial neural
    networks (ANNs), a kind of deep learning (DL) that imitates biological neurons
    [47]. Due to the limited window of therapeutic efficacy, early diagnosis of ischemia
    infarction is crucial when considering patients as possible candidates for thrombolysis
    [47]. Identification of patients who might benefit from mechanical thrombectomy
    depends on the diagnosis of LVO. On NCCT, an SVM algorithm had a high sensitivity
    (97.5%) for detecting the MCA dot sign in patients with acute stroke [48]. AUC
    of 86.3% (95% CI, 0.83–0.90; P=0.001), intraclass correlation coefficient (ICC)
    of 84.1% (95% CI, 0.81–0.86; P=0.001), and accuracy of 86% were achieved by CNN-based
    commercial software, Viz-AI Algorithm v3.04 in detecting proximal LVO, and high
    sensitivity and specificity (82% and 94%, respectively) were achieved by Viz-AI
    [49, 50]. GoogLeNet with augmented data in a pretrained network was the most accurate
    (AUC 14 1.0; sensitivity and specificity 14 100%)'
