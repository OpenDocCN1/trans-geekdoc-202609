- pgno: 289
  md: '# 16.5 Molecular Mechanisms of Angiogenesis Formation


    Different multiple kinds of proteins have been identified and characterized as
    angiogenic activators, such as VEGF, bFGF, angiogenin, TGF-α/β, TNF-α, PDEGF,
    G-CSF, PGF, IL-8, hepatocyte growth factor (HGF), and epidermal growth factor
    (EGF) (Figure 16.1) [30]. The primary stimulator for angiogenesis is hypoxia that
    triggers hypoxia-inducible factor 1α (Hif-1α) [31]. Hif-1α operates in association
    with Hippel–Lindau (von VHL) protein that targets HiF-1α for ubiquitination under
    normoxic conditions (Figure 16.1) [32]. Paracrine or autocrine release of the
    above-mentioned factors stimulates endothelial progenitor cells for proliferation.
    Among all these, an important stimulating factor is a member of vascular endothelial
    growth factor family. There are different members of this family includes VEGF-A,
    B, C, and D, and their receptors VEGFR-1, 2, and 3. Because of their crucial role
    in angiogenesis, FDA has approved many VEGF inhibitors (for example, bevacizumab,
    sorafenib, dasatinib, regorafenib, and cabozantinib) to treatment the advanced
    stage cancer [33]. Further, the key role of MMPs (matrix metalloproteinase) has
    also been determined in angiogenesis, that degrade the ECM and form a way for
    endothelial cell migration, proliferation, and vessel formation. Cyclooxygenase
    (COX) catalyzes the formation of prostaglandin and thromboxane fromarachidonic
    acid. The role of COX-1 and COX-2 has been evaluated in angiogenesis induction
    in the co-culture of colon cancer cells and endothelial cells [34]. The activity
    of COX-1/2 enzyme helps in adherence of cells to ECM, and hence angiogenesis induction
    [35]. COX-2 also induces the synthesis of VEGF. Angiogenesis also involves Ang-1
    and Ang-2 and tyrosine kinase receptor Tie-2 system. Interaction of Ang-1 with
    their receptor maintain and stabilize mature blood vessels. However, Ang-2 works
    as an antagonist of Ang-1 stabilizing its action. During carcinogenesis Ang-1
    and Ang-2 has increased expression in tumor cells. Although, the expression of
    Ang-2 is highly overexpressed compared to Ang-1 and Tie2 [36]. In addition, endothelial-1
    (ET-1) and its receptors are also involved in cancer angiogenesis regulation.
    Endothelin-1 along with its receptors ETAR/ETBR showed overexpression in tumor
    that has been correlated with high levels of VEGF and higher amount of microvessel
    density [37]. The role of PDGF-β/PDGFR signalling axis has also been determined
    in establishment, development, and differentiation of blood vessels, which recruit
    the maturation of pericytes and maturation of microvasculature in the tumor tissue
    [38]. Moreover, The notch signaling pathway (Notch1 receptors, DLL4, and Jagged-1
    ligand) also has regulatory role in vasculature formation through endothelial
    cell maturation in [39, 40], renal cell carcinoma [41], bladder carcinoma [42],
    pancreatic carcinoma [43], and prostate carcinoma [44]. Multiple studies also
    determined the role of epigenetic regulation in angiogenesis. A wide range of
    angiogenesis initiation and regulation related miRNAs has been profiled in almost
    all types of human cancers [45]. For instant, miRNAs such as miR-17-92, let-7f,
    miR-27b, miR-222/221 etc. showed a significant role in the angiogenesis regulation
    [46].


    # 16.6 Angiogenesis as a Target in Cancer Therapy


    Folkman in 1971, proposed a hypothesis that tumor growth is dependent on angiogenesis
    and targeting the vessel formation in tumor can prevent its growth [47]. In February
    2004,'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'bevacizumab, a humanized anti-VEGF-A monoclonal antibody has been approved
    by FDA, for the treatment of metastatic colorectal cancer along with 5-fluorouracil.
    This is followed from a phase III study showing survival benefit [48]. In December
    2004, an aptamer namely Pegaptinib has been approved by FDA for the treatment
    of the wet (neovascular) form of age-related AMD (macular degeneration) [49].
    Furthermore, IMC-18F1 and ramucirumab monoclonal antibodies that target the VEGFR-1/2
    have also been tested [50]. Targeting different angiogenic signalling pathways,
    like bombinavariegeta peptide 8 (Bv8, also known as prokineticin-2), PDGF-C (platelet-derived
    growth factor-C), and VEGFR-3, is also important as it may increase the therapeutic
    response in anti-VEGF-resistant tumors [50]. Despite endogenous Notch regulation,
    the DLLA4/Notch signalling can be targeted as anti-cancer treatment. Its ubiquitous
    role in carcinogenesis and tumor angiogenesis makes it a challenging target [51].


    # 16.7 Machine Learning Approaches in Angiogenesis


    Over the last decades, several imaging techniques are emerged that allow researchers
    to investigate microstructures more thoroughly on smaller scales. Quantifying
    morphological features, however, was and still is often achieved only semi-quantitatively
    by analyzing contrast or fluorescence units of an image and remained somewhat
    elusive and time-consuming. The lack of reproducible morphological quantification
    techniques may also have led researchers to execute excessive staining and the
    use of advanced imaging techniques where phase contrast microscopy might have
    been a sufficient and inexpensive alternative. Advances in computer technology
    have made it possible to noninvasively quantify tumor angiogenesis [52]. Machine
    learning is one such technology that involves analytical strategies which are
    recently been applied to biomarker discovery in digital pathology images (Figure
    16.2) [53]. With the availability of deep learning techniques, researchers are
    able to easily and accurately quantify such morphological structures nowadays
    and are freed up to focus on advancing science. In an attempt involving deep learning,
    automatic recognition of cancerous tissue with millions of discrete parameters,
    hindering reasonable interpretation of discriminative features is carried out
    [54]. Algorithms are developed that can recognize the specific predefined angiogenesis
    features in images and also can measure their abundance with great accuracy [54].
    One study developed deep learning-based angiogenesis quantification software and
    done assessment of the angiogenesis of angiosarcomas in the in vivo CAM model.
    This method is part of the proprietary commercially available software-as-a-service
    solution IKOSA platform (KML Vision GmbH, Graz, Austria) [55]. Another used non-redundant
    dataset of anti-angiogenic and non-anti-angiogenic peptides and predicted the
    angiogenesis by employing effective machine learning based R package (AntAngioCOOL).
    This study suggested that AntAngioCOOL can effectively identify anti-angiogenic
    peptides, with sensitivity of 88%, specificity of 77% and accuracy of 75% [56].
    Further, a different study quantify the angiogenesis 2-step machine learning framework
    which utilized a set of 14 genes and correlated them with good and poor disease-free
    survival groups (14VF HR = 2.4, 14GT HR = 3.33) [57].'
