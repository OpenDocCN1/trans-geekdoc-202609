    is shown in Figure 9.18. The correlation matrix reveals that the planet-star radius
    ratio and transit depth, which measures the drop in brightness of a star caused
    by an exoplanet transiting it, have a strong positive link. This indicates that
    when the size of the planet rises in relation to the star, the depth of the transit
    signal likewise grows, indicating that the exoplanet is greater in size. This
    is consistent with the plots shown above.


    The feature importance plot for the exoplanet type prediction model indicates
    that the planetary radius is the most relevant feature (see Figure 9.19). With
    a relative importance of roughly 0.3, this variable is more influential than other
    features in predicting the model. With a relative importance of about 0.15, the
