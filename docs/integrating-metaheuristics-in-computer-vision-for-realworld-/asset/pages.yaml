    # ## 15.3.3 Shape


    Identifying an object’s shape can frequently be very challenging. People often
    describe shape verbally or visually, using words like “elongated”, “rounded,”
    etc. Even very complex shapes must be accurately described for computer-based
    shape processing, and while there are numerous useful methods for doing so, there
    is no widely acknowledged approach to doing so. Shape is a crucial visual element
    and one of the basic elements used to describe the content of images. When an
    object’s orientation or location are altered, all of its geometrical information
    is contained in the image and is often unaffected. The perimeter, area, eccentricity,
    symmetry, etc. are examples of basic shape characteristics. even when the object’s
    orientation or location is altered. The perimeter, area, eccentricity, symmetry,
    etc. are some basic shape characteristics.


    # ### 15.3.3.1 Methods of Representation


    The process of extracting form features consists of two main parts. These are
    form representation and object segmentation. The shape features of objects can
    be represented and indexed once they have been segmented. Boundary-based and region-based
    shape representations can be broadly categorised into two groups (Figure 15.4).
    Whereas the latter makes use of the full shape region, the former merely employs
    the shape’s outer perimeter. For example the 1st kind has Fourier descriptors,
    chain codes, and fundamental geometric border approach [33, 34] (such as curvature,
    bending energy, boundary length, and signature). Euler number, Area, Eccentricity,
    Elongated-ness, and compactness are examples of second category. The best approach
    for these two groups comes from moment variations and Fourier descriptors. Using
    Fourier converted border as the shape characteristic [35] is the underlying idea
    behind the Fourier Descriptor.


