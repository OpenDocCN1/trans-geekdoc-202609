  md: "# 13.2.11 Different Algorithms\n\nThe most popular algorithms are those mentioned\
    \ above, which may illustrate the key traits of swarm intelligence [47]. The reptile\
    \ search algorithm, the whalgorithm, gorilla troop optimization, gravitational\
    \ search, the krill herd algorithm, and others are among the more than 100 various\
    \ algorithms and versions that may be found in the present literature. More specialized\
    \ material, such as books and journal articles, is available to interested readers\
    \ [48]. We will now take a general look at nature-inspired algorithms and qualitatively\
    \ highlight their key traits.\n\n# 13.3 Algorithms and Self-Organization\n\nVarious\
    \ methods exist to assess algorithms, depending on the numerous available perspectives.\
    \ This section will primarily concentrate on algorithmic properties and self-organization.\n\
    \n# 13.3.1 Algorithmic Attributes\n\nOur focus is on the key steps involved in\
    \ how nature-inspired algorithms work, e.g. search motions and processes, exploration\
    \ and exploitation, and update of equations or dynamics [49, 50]. They can also\
    \ be thought of as self-organizing systems [51]. In summary, all algorithms are\
    \ as follows:\n\n+   - Every algorithm is population-based, with many agents constituting\
    \ the population. (e.g., wolves, aquilas, bees, particles, etc.). In any optimization\
    \ problem, the location of every agent within the design space is regarded as\
    \ a potential solution. The agents can then interact together based on a specific\
    \ set of rules, which are typically local laws.\n+   \n+   - By modifying the\
    \ current population’s operators (e.g., mutation, crossover), the population is\
    \ evolved iteratively. Any perturbation found in the solution of the population\
    \ is achieved by selecting a random solution, with a fitness-biased selection\
    \ process. All algorithms are capable of both local exploitation and global exploration.\n\
    +   \n+   - Various forms of elitism are combined with the “survival of the fittest”\
    \ principle to select the best candidate solutions. The fundamental objective\
    \ is to facilitate the transmission of superior ideas to future generations.\n\
    +   \n+   - The candidate’s diversity is higher in the early stages of iterations\
    \ with increased unpredictability. Diversity will eventually decrease as iterations\
    \ continue. When all candidates become similar, the system may reach a converged\
    \ state. A converged candidate contains few strong similarities and organization,\
    \ but its variety has been reduced to a bare minimum.\n\n# 13.3.2 Comparison With\
    \ Classical Optimization Techniques\n\nClassical optimization techniques tend\
    \ to converge to a single optimal solution, whereas nature-inspired optimization\
    \ algorithms frequently explore multiple solutions simultaneously."
