    # 2.3.3.2 Feature Extraction and Feature Selection Technique


    Feature Extraction and Feature Selection are two machine learning approaches that
    are often used to prepare data for model development. The process of translating
    raw data into a set of features that may be utilized for machine learning is known
    as feature extraction. In other terms, it is the extraction of the most relevant
    information from the supplied data. Typically, this is accomplished by applying
    different mathematical and statistical approaches to raw data in order to minimize
    its dimensionality and identify the most essential characteristics. In image processing,
    for example, feature extraction techniques may be used to extract picture edges,
    corners, and other critical characteristics that can be utilized for object recognition.
    The process of picking a subset of the most essential characteristics from the
    original collection of features, on the other hand, is known as feature selection.
    The purpose of feature selection is to reduce the quantity of input characteristics
    in order to increase the accuracy and efficiency of a machine learning model.
    This is often accomplished by assessing the significance of each characteristic
    using statistical measures such as correlation or by employing various algorithms
    to evaluate the significance of each feature. In general, feature extraction is
    used to generate a new collection of features from raw data, whereas feature selection
    is used to choose the most essential characteristics from the original set. Both
    strategies are significant in machine learning, and which one to utilize depends
    on the application and the type of data being studied.


