  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_186_0.png)


    Figure 9.9 Light curve of non-exoplanet star 103.


    The depth of this dip in the light curve and the length of the transit can be
    used to estimate the size and orbit of the exoplanet. For instance, a bigger exoplanet
    will block more of the star’s light, causing the light curve to fall more deeply.
    Similar to this, a longer orbital period for an exoplanet means that it will take
    longer to transit the star, lengthening the duration of the drop in the light
    curve. It is possible to estimate the exoplanet’s size and orbital period by examining
    the peculiarities of the light curve’s dips.


    Below are more insightful plots of the exoplanet-containing stars 0, 1, 2, and
    3 (see Figure 9.10). These curves show all of the flux values from 0 to 3187,
    measured at regular intervals of time. It can be seen that these light curves
    have regular dips that point to the existence of exoplanets. The light curve of
    star 0 resembles a sine curve with dips that are broader rather than deeper, suggesting
    that the exoplanet orbiting the star may be smaller and farther away from the
    star. And for star 1, the dips are deeper and narrower, suggesting that the exoplanet
    orbiting the star may be relatively larger and closer to the star.


    Below are detailed plots of the stars 230, 1090, 2247, and 3543, none of which
    have exoplanets (see Figure 9.11). It is evident that there are no periodic dips
    in these light curves. They may have occasional erratic dips as a result of other
    factors. As there are no periodic dips in any of the light curves, indicating
    that no exoplanets are orbiting around them.


    A confusion matrix is a helpful tool for assessing how well a machine learning
    model performs in prediction of exoplanet. Several machine learning models are
    used to categorize exoplanets and non-exoplanets, including SVM, LR, KNN, DTC,
    RFC, and XGB classifier. These models’ confusion matrices are shown in Figs. 9.12
    to 9.17. According to these confusion matrices, there are 3333 predictions in
    total. The SVM model has 1633 true positive predictions and 1699 true negative
    predictions. A total accuracy of 99% was the outcome. 1617 true positive predictions
    and 1654 true negative predictions are made by the logistic regression model with
    an accuracy 98%. The KNN model makes 1633 accurate predictions that are true positive,
    and 1637 accurate predictions that are true negative. And has an overall accuracy
    of 98%. Decision Tree classifier model also achieved an accuracy of 98% with 1625
    true positive predictions and 1402 true negative predictions. 1632 true positive
    predictions and 1700 true negative predictions were made with the RandomForest
    Classifer model. A total accuracy of 99% was the outcome. Finally, The XGB classifier
    model yields an accuracy of 99% with 1687 true negative predictions compared to
    1632 true positive predictions. These results reveal that all models are working
    effectively and can accurately anticipate the existence and characteristics of
    exoplanets.'
