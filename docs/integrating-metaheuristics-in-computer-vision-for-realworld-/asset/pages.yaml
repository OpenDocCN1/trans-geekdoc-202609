  md: '# # Advancement of ML in Smart House


    # ## Abstract


    The Internet of things is turning our houses into smart houses by automating our
    home appliances. The smart house system manages, secures and controls to have
    better management over the problems we face in our houses. The smart houses with
    IoT are still need Improvement for better efficiency. This can be achieved by
    the developing ML over house applications. Image processing gives intelligence
    to the house through which our smart house system can be improvised.


    **Keywords:** Smart house, IoT, machine learning


    # ## 12.1 Objective


    The objective of this paper to give an outline of the smart house system and some
    of its construction, how IoT plays a roll to automate the house appliances and
    how to improve the efficiency of smart house system with developing ML in use
    of image processing. And discuss the scope of this system.


    # ## 12.2 Introduction


    Smart houses, as name suggest it is smartening our houses that it can manage itself
    in some of the work that needs human intervention. Let’s see a daily scenario
    of a weekdays, in morning we wake up and hurry up to school, college or office.
    In the morning we use lights in bathroom, fan in our living room, we use some
    electrical appliances such as microwave oven in kitchen, we may use a charger
    to charge the phone, etc. And it is human nature to forget to switch off the appliances
    and we would remember it when we are in our office or college. That’s when we
    feel bad when we can’t remember it. So, it is likely to be automated. So how are
    we going? to automate it? Well, we can use IoT to automate our house. Internet
    of Things is nothing but the send and receive data via internet and using cloud
    computing'
  merge: -1
  img_proc: true
