  img_proc: true
- pgno: 73
  md: '# 3.3.1 Inkjet Bioprinting


    One of the first AM techniques was the introduction of inkjet printing [7]. In
    simpler terms, the ink passes through a compressed chamber, which then releases
    droplets from a pore (Figure 3.2a), the ink is being reacted. Inkjet droplet squeezing
    now uses three basic methods: thermal, piezoelectric, and electrostatic. The two
    that are used the most frequently for structure manufacturing are thermal and
    piezoelectric [8]. Because of the intense pressure of air bubbles that are created
    as a result of localized heating, thermal inkjet printers expel ink drops from
    the nozzles. The three main benefits of inkjet printing are its high speed, availability,
    and affordability. On the other hand, the main drawbacks are reliance on low viscosity
    bioink and lack of accuracy in droplet size and positioning. Thermal inkjet printers
    can clog easily as well.


    ![](img/07f0bb0f402fd4e2f1880bf37d1ea963_73_0.png)


    # 3.3.2 Microextrusion Bioprinting


    Extrusion bioprinting involves the extrusion of a viscous bioink through a small
    opening, resulting in a continuous cylindrical line that is printed onto a substrate.
    Extrusion bioprinting is classified into two types, namely mechanical or pneumatic,
    depending on the type of pneumatic or mechanical screw plungers employed to dispense
    the bioink (Figure 3.2b). Extrusion bioprinting systems can accommodate bioinks
    with different viscosities, and the extrusion speed, process, and deposit location
    can all be modified as needed [9]. Direct-writing systems or bioplotting are based
    on extrusion bioprinting, and they can use cells, cell-encapsulated matrices,
    and polymers as materials.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 3.3.3 Laser-Assisted Printing


    Laser-assisted bioprinters are based on the laser direct writing technique and
    primarily use photopolymerization technology for printing biomaterials. This method
    enables the printing of a diverse range of cells while preserving their viability
    [10]. A pulsed laser source directs a focus tool towards a metallic ribbon film
    that absorbs laser energy and a receiving substrate (see Figure 3.2c). While printing,
    the laser focuses on the top glass layer of the ribbon, which is coated with a
    thin layer of gold and titanium nanoparticles. As the layer evaporates, bubbles
    form at the bottom, which release the suspended bioink droplets onto the receiving
    substrate. Laser-assisted printing is not restricted by nozzles, making it suitable
    for use with a broad range of materials like hydrogels, ceramics, epoxy-based
    photoresist SU-8, cell-encapsulating materials, and cells [11]. The technique
    offers several advantages, including high precision, the ability to print high
    viscosity materials, and high cell densities. However, it is associated with high
    costs and a lengthy process.


    Extrusion bioprinting boasts several advantages, such as the capacity to handle
    high cell densities, accommodate multiple printer heads for intricate printing
    requirements using diverse bioinks, and process high viscosity bioinks with ease.
    On the other hand, one significant drawback of the extrusion bioprinting procedure
    is the breakdown of cell structure when passing through the tiny printer head.


    # 3.3.4 Stereolithography


    The process of bioprinting with laser assistance is comparable to stereolithography.
    By layer-by-layer selectively solidifying the photosensitive polymer with UV light,
    stereolithography printing creates intricate structures. The organ structure is
    converted into a stereolithography file that corresponds to MRI and CT scan images
    (Figure 3.2d). After being divided into thin layers, the structure can then be
    printed one layer at a time. To create a 3D-printed structure in stereolithography,
    the respective top layers are overlaid once the lower layer has solidified due
    to light [12].


    The two main benefits of stereolithography are improved fabrication precision
    and quick printing. On the other hand, some of the significant limitations of
    stereolithography include the use of intense UV light, the requirement of prolonged
    postprocessing procedures, and the limited availability of compatible materials
    [13].


    # 3.3.5 3D Bioprinting Materials and Cells


    To ensure that bioprinted materials do not require additional surgeries for implant
    removal, it is crucial that noncytotoxic, printable, and biodegradable biomaterials
    are used. Furthermore, the printed material must be strong enough to support and
    nurture the cells that are seeded. Additionally, the biomaterials used for printing
    should encourage cell adhesion, maturation, migration, proliferation, and differentiation
    [14].


    Three components of the biopolymers, biomaterials, factors, and cells/tissues,
    can be briefly separated out. In summary, biomaterial scaffolds can be made from
    natural or synthetic polymers. While natural polymers typically provide cells
    with a more stable'
