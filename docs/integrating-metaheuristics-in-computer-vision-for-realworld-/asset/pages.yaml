  md: '# 13.2.7 Ant Colony Optimization


    Ant Colony Optimization (ACO) is an optimization algorithm that is inspired by
    the food-searching habits of ants. It was proposed in 1992 by Marco Dorigo [2].
    An artificial ant colony (ACO) is utilized to find the optimal solution to an
    optimization problem. The ants find a solution by marching through the problem’s
    search area and leaving pheromones at the path’s boundaries. The pheromone signifies
    the quality of the solution discovered by the ant. Each ant determines its next
    move based on the pheromone trail and heuristic information, which evaluates the
    merits of moving from one location to another. Based on the quality of the solutions
    discovered by the ants, the pheromone trace is modified. The algorithm keeps on
    iterating until a stopping criterion, which can be a maximum number of allowed
    iterations or a minimum required fitness value.


    ACO is ideally adapted for discrete optimization problems. For instance, the answer
    to a routing problem can be encoded as a route or path. When ants explore diverse
    paths, they leave behind a pheromone trail that diminishes with time. The quality/fitness
    of the solution is directly linked to the concentration of the Pheromone. The
    probability of taking a certain path at a junction increases if that path has
    a higher concentration of pheromones. ACO, like GA, is a hybrid process with numerous
    versions and applications.


    # 13.2.8 Grey Wolf Algorithm


    Mirajalili et al. developed a population-based optimization method called Grey
    Wolf Optimization (GWO) [39]. GWO’s appealing aspect is its hierarchical structure,
    which distinguishes it from other population-based algorithms. The hierarchy’s
    supremacy is built with the use of a goal known as the objective function which
    is then subdivided into a fitness function and a cost function, both are needed
    to calculate the output [44]. The optimum solution is obtained among all the available
    candidates.


    The Grey Wolf algorithm is based on wolf hunting strategies that look for prey
    (food) collectively and as the name indicates that the algorithm imitates the
    foraging behavior of wolves. The search was initiated by three wolves: alpha (α),
    beta (β), and delta (δ). They are all members of the dominant rank and have precedence
