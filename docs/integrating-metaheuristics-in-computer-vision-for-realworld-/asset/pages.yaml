  md: '# 6.2.2.2 Advantages and Disadvantages


    The wrapper method''s consideration of the interplay between features is one of
    its key benefits. Since a validation set is used to assess the model''s performance,
    it can capture how integrating a new feature with existing features influences
    the model''s performance. Because of this, the wrapper method outperforms alternative
    feature selection techniques that depend on quantitative measurements of feature
    importance, such correlation or mutual information.


    The wrapper method needs training and assessing a model for each group of features,
    which makes it computationally expensive as well. When dealing with feature-rich
    datasets, this might be extremely difficult.


    The wrapper technique has undergone a lot of modifications, including the forward
    and backward selection methods, to get around this drawback.


    # 6.2.2.3 Forward Selection Algorithm


    The forward selection algorithm is a feature selection technique that iteratively
    adds one feature at a time to an empty set of features [11] based on how well
    it would enhance the performance of a model.


    The forward selection algorithm has the following steps:


    +   1) Initialization: Start with a feature set that is empty.

    +   2) Feature evaluation: Use each characteristic independently to assess the
    model''s efficacy. Any metric that is suitable for the task at hand, such as accuracy,
    F1 score, or mean squared error, can be used as the evaluation meter.

    +   3) Feature selection: It is best to select the feature that performs the best
    on the evaluation metric.

    +   4) Model training: Use the chosen feature along with the current collection
    of features to train a model.

    +   5) Feature addition: Use every conceivable combination of the previously chosen
    attributes and the remaining features to gauge the model''s performance. Add the
    feature to the current collection of features that produces the best performance
    on the evaluation criteria.

    +   6) Termination: Up until a stopping requirement is fulfilled, repeat steps
    4 and 5 as necessary. A maximum number of features, a minimum performance improvement,
    or a maximum number of iterations could all be included in this criterion.


    Every machine learning model that can handle a variable number of features can
    apply the forward selection technique. It can be applied, for instance, to decision
    trees, neural networks, logistic regression, and linear regression. Moreover,
    it can be adjusted to handle features that are continuous, categorical, and binary.


    The forward selection process could not always choose the best subset of features,
    which is a possible problem. It is possible that the forward selection method
    did not always select the best subset of features. However it frequently yields
    a decent approximation of the ideal subset of traits and is computationally effective.'
  merge: -1
  img_proc: true
