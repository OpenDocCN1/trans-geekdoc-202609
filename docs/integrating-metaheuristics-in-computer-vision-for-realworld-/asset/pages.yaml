    # ## 4.2 Proposed Framework


    The framework is divided out in three major phases [5]:


    +   1) Data Exploration: It involves processes like, loading the dataset, preprocessing
    on dataset, displaying the dataset and performing the graphing.

    +   2) Data Preprocessing: It involves processes like, loading the dataset and
    removing outliers, splitting the dataset for training and testing.


