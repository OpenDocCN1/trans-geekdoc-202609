    # 17.5 Performance Parameters


    Image enhancement is the process of modifying digital images to make them more
    aesthetically pleasing or to improve their accuracy for analysis. In this study,
    we compared the effectiveness of two segmentation algorithms using various factors.
    The following parameters were used: Peak Signal to Noise Ratio (PSNR), Mean Square
    Error (MSE), Root Mean Square Error (RMSE), Normalized Coefficient (NC), and Distance
    Reciprocal Distortion Metric (DRD) [11].


    # 17.5.1 Mean Square Error


    Mean square error (MSE) is a common metric used to estimate the quality of an
    image enhancement algorithm. It measures the average of the squared differences
    between the original image and the enhanced image. The formula for calculating
    MSE for image enhancement is as follows:


    ```

    MSE = \left(\frac{1}{N * M}\right) * \Sigma [I(x, y) E(x, y)]^2

    ```


    where I(x,y) is the pixel value of the original image at location (x,y), E(x,y)
    is the pixel value of the enhanced image at the same location, and N and M are
    the height and width of the image, respectively. To calculate MSE for image enhancement,
    you would first need to obtain the original image and the enhanced image. Then,
    for each pixel in both images, you would calculate the difference between the
    original and enhanced pixel values, square this difference, and sum up all these
    squared differences across all pixels in the image. Finally, you would divide
    this sum by the total number of pixels in the image (N*M) to obtain the MSE. A
    lower MSE value indicates a better quality enhancement, as it means that the enhanced
    image is closer to the original image. However, MSE alone may not always be'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'a sufficient metric for evaluating image enhancement algorithms, as it does
    not take into account human perception of image quality. Therefore, other metrics,
    such as peak signal-to-noise ratio (PSNR) and structural similarity index (SSIM),
    may also be used in conjunction with MSE to provide a more complete assessment
    of image quality [13].


    # 17.5.2 Root Mean Square Error


    Root mean square error (RMSE) is used to compare two images, usually an original
    image and a treated image. The square root of the average of the squared deviations
    between the corresponding pixels of the two pictures is used to calculate RMSE.
    The RMSE can be written mathematically as:


    ```

    RMSE = sqrt(1/n * sum((I1 (i, j) - I2(i, j))^2))   (17.2)

    ```


    # 17.5.3 Peak Signal to Noise Ratio


    Peak Signal to Noise Ratio (PSNR) is a commonly used metric in image processing
    for evaluating the quality of an image compared to its original version. It is
    a measure of the ratio of a signal''s maximal possible power to the power of corrupting
    noise that compromises the accuracy of image. PSNR in image enhancement is a quantitative
    indicator of the post-processing image quality improvement. The higher value of
    PSNR indicates better quality of enhanced image [14]. PSNR is calculated as follows:


    ```

    PSNR = 10 * log10[(MaxI)^2/MSE]   (17.3)

    ```


    where Max I is the maximum possible pixel value of the image (usually 255 for
    an 8-bit image), and MSE is the mean squared error between the original image
    and the enhanced image [15].


    # 17.5.4 Normalized Coefficient


    The normalized coefficient (NC), also known as the normalized cross-correlation
    coefficient, is a measure of the similarity between two images or image patches.
    The NC is often used to align two images, such as aligning a low-resolution image
    with a high-resolution image. It can also be used to identify similar regions
    within an image or between images, which can be useful in techniques, such as
    image segmentation and object recognition. The NC is calculated by taking the
    dot product of two image patches and dividing it by the product of their root
    mean square (RMS) values. The formula for calculating the NC is as follows:


    ```

    NC = \sum (I(a,b) - \mu I)(T(a,b) - \mu T)/(\sigma I \sigma T)   (17.4)

    ```


    where I and T are the two image patches being compared, \mu I and \mu T are their
    respective mean values, \sigma I and \sigma T are their respective standard deviations,
    and (a, b) represents'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'the pixel coordinates of the patch. The NC ranges from –1 to 1, where a value
    of 1 indicates a perfect match between the two patches, 0 indicates no correlation,
    and –1 indicates a perfect negative correlation.


    # 17.5.5 Distance Reciprocal Distortion Metric


    The Distance Reciprocal Distortion Metric (DRDM) is a metric used to quantify
    the quality of an image. The DRDM measures the degree of distortion between an
    input image and its corresponding output image. It takes into account the distortion
    caused by the image processing algorithm used for enhancement. The metric calculates
    the distance between the input and output images, and then computes the reciprocal
    of that distance [17]. The DRDM formula for enhancement of an image can be expressed
    as follows:


    $$DRDM = \frac{1}{D}$$ (17.5)


    where D is the distance measure between the input image I and its corresponding
    output image O after enhancement. The distance measure can be any standard measure
    of image distortion such as mean squared error (MSE), peak signal-to-noise ratio
    (PSNR), or Structural Similarity Index (SSIM). For example, if we use MSE as the
    distance measure, then the DRDM formula can be written as:


    $$DRDM = \frac{1}{MSE(I,O)}$$ (17.6)


    Similarly, if we use PSNR as the distance measure, then the DRDM formula can be
    written as:


    $$DRDM = \frac{1}{PSNR(I,O)}$$ (17.7)


    And if we use SSIM as the distance measure, then the DRDM formula can be written
    as:


    $$DRDM = \frac{1}{SSIM(I,O)}$$ (17.8)


    In all cases, a higher value of DRDM indicates a better quality enhancement, since
    it means that the distortion between the input and output images is lower.'
  merge: -1
  img_proc: true
