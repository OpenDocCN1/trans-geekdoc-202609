  md: '# 11.2 Edge Detection Techniques


    Edge:

    The points at which image brightness changes sharply organised into a set of curved
    line segments called as edges [4]. There are three types of Gaussian edge detection
    are of Sobel edge detector, Prewitt edge detector and Robert edge detector and
    Canny edge detector [15] and Laplacian edge detector are the two types of Gradient
    edge detection shown in Figure 11.1.


    # 11.2.1 Steps in Edge Detection


    It includes five steps namely,


    +   1. Remove noise

    +   2. Finding large magnitudes and mark the edges.

    +   3. Edge marking should only be done for local maxima

    +   4. Thresholding

    +   5. Hythersis edge tracking


    # 11.2.2 Gradient-Based Techniques


    # 11.2.2.1 Sobel Edge Detected Operator


    It is a precisely defined first order derivative. It is used to calculate luminance
    function. It is also called as the Sobel Feldman operator or Sobel filter used
    in image processing that reinforces edges [1]. Sobel operator performs 2-D spatial
    gradient on an image and emphasizes regions of high spatial frequency that corresponds
    to edges. It is used to find the approximate absolute gradient magnitude at each
    point in an input gray scale image as shown in Figure 11.2 [2].


    # 11.2.2.1.1 Block Diagram


