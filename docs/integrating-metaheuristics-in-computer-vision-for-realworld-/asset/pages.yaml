    # 15.3.2.1.1 Tamura Features


    The psychological research on how people perceive texture in their environment
    served as inspiration for investigations of a new angle [27] on texture representation.
    The aspects of the visual texture that psychological research has shown to be
    significant were approximated by computers. The six properties of visual texture
    are, directionality, coarseness, contrast, linelikeness, and roughness and regularity.
    These characteristics are highly valued in image retrieval systems because the
    texture properties have visual meaning. This allows for the representation of
    texture attributes in an interface that is user-friendly and allows the user to
    utilise a verbal description of the image. A few early retrieval systems used
    coarseness, contrast, and directionality. For example, the MPEG-7 standard [28]
    accepted directionality as a texture browsing description.


    # 15.3.2.1.2 Co-Occurrence Matrices


    Yalavarthi _et al_. [29] is credited with the invention of the co-occurrence matrix.
    According to the orientation and distance between the pixels, this method creates
    a co-occurrence matrix. To represent the texture, useful statistics are then taken
    from the matrix. The same approach was taken by numerous other researchers, who
    also put out improved versions. For instance, Hung C. _et al_. examined the statistics
    [30] first proposed in and discovered experimentally that inverse deference moment,
    contrast, and entropy had the greatest power of discriminatory [31].


    # 15.3.2.1.3 Gabor Filters


    The wavelets that make up a Gabor filters (GF) are all different-sized and oriented
    wavelets that capture energy. Hence, Gabor helps in identification of local energy
    among all signals or a picture. It is used to extract accurate texture features,
    rather than picture features [32]. Resolving vision and spatial frequency, is
    provided by Gabor filters. GF is used for a wide range of tasks due to their versatility,
    including retina identification, image coding, document analysis, target detection,
    texture segmentation, fractal dimension measurement, line characterization, image
    representation, edge detection, and others.


    # 15.3.2.1.4 Wavelet Transform


    Wavelet transforms, an alternative multi-resolution method, are most frequently
    utilised in various areas of image processing. In order to reduce picture noise,
    compress images, rebuild images, and retrieve images, a variety of wavelet-based
    techniques and concepts have been suggested and investigated. It has used the
    multi-resolution wavelet transform to extract images. A high level of retrieval
    accuracy is not attained using wavelet characteristics. To increase retrieval
    accuracy using wavelet transform, numerous techniques have been devised. The efficacy
    of CBIR is increased by giving weights to wavelet features calculated from discrete
    wavelet coefficients.'
