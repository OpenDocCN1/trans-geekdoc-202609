    # 1.9 Conclusion


    Although the diagnostic tools for ischemic stroke, which has been used from the
    past few decades and still in the use for the diagnosis for the same, such as
    CT, MRI, the new emerging technologies, like electromyography, electroencephalography,
    positron emission tomography, other blood-based biomarker as well as artificial
    intelligence–based diagnostic tools are in use for the rapid and cost-effective
    detection of particular damage in the brain. Moreover, rehabilitation and long-term
    recovery after an ischemic stroke continue to be a major issue for healthcare
    professionals and patients because there is no viable therapeutic strategy. Nanotechnology
    is the boon for the therapeutic advances in ischemic stroke treatment through
    nanomedicines; for controlling abnormalities, to provide oxygen to ischemic brain
    and nanomedicines that target downstream ischemic cascade events such as tissue
    healing, inflammatory response and oxidative stress may be more effective stroke
    treatments. As presented in this review, Carbon nanomaterials have a lot of potential
    for use in the treatment and diagnostic of ischemic stroke. CNT development is
    still in its infancy, and considerable work must be done before they can be used
    in real world application. When used in, in vivo and in vitro models to study
    the pathophysiological and biochemical pathways behind stroke, CNTs ARE thought
    to have the most ability as nanobiosensors.


    # Future Perspectives


    Gold standard imaging methods like CT and MRI are presently used extensively in
    the recognition and assessment of stroke and its subtypes. These imaging services
    are primarily found in economically underdeveloped areas, compact hospitals, and
    dispensaries. Deferring diagnosis and treatment of a stroke results in worse prognosis
    for a patient. Numerous stroke cases go undetected and many stroke patients go
    untreated because of high expense of CT and MRI, the low level of explosion to
    imaging facilities, and the lack of imaging specialists, especially in developing
    nations. The potential exists to shorten treatment times, lessen the severity
    of brain destruction, and greatly enhance the quality of life for stroke individual
    and their caregivers through the development of low cost and more accessible diagnostic
    tools to quickly identify Acute ischemic stroke. Other than the CT and MRI the
    cost and time effective diagnostic techniques EMG and EEG are introduced, Frequency–domain
    and time–domain analyses of surface EMG are most commonly used to measure muscle
    contraction velocity and examine motor neurons and innervation zones. An EEG instrument
    that is reasonably priced, easy to set up, and understandable is required.'
