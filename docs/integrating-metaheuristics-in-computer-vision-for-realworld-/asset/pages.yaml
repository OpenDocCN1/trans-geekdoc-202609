    may be used to identify objects in real time. The approach works by using a set
    of positive and negative pictures to train a classifier. The positive photo-graphs
    include the thing we are looking for, whilst the negative images do not. These
    attributes are then used by the algorithm to recognize the item in a fresh picture
    or video stream.


