  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_291_0.png)


    Figure 16.2 Machine learning approach in understanding of angiogenesis.


    # 16.8 Conclusion


    Angiogenesis can be assessing by measuring CD34 or CD31 marker using immunohistochemistry
    and gene expression profiling technique [58]. Tumor has unorganised or leaky angiogenesis
    structure. Malignant cells also form a tube-like vessel structure in the tumor
    mass, to fulfil their nutrient requirement. Angiogenesis supports the tumor growth
    through nutrient supply and waste material exchange. Hypoxia is a key player in
    angiogenesis activation in the preneoplastic lesion [59]. Subsequently, paracrine
    and autocrine modes of signalling within preneoplastic lesions initiate the neovessel
    formation which supports tumor growth and metastasis. Because of its key role
    in the carcinogenesis, a number of anti-angiogenic drugs have been developed.
    However, the efficacy of anti-angiogenic therapy is limited due to therapy resistance.
    Hence, therapy resistance proved the under knowledge of angiogenesis process,
    and enthusiasm for its further understanding. In addition to genetic factors,
    huge epigenetic regulation also works behind the angiogenesis. Taking all together,
    angiogenesis is a hallmark process, with comprehensive nature and requires deep
    understanding to control, as treatment strategies.


