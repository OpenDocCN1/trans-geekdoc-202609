    **The strategy.** We will use strategy to create a snowball effect, which means
    taking little profits for one week and limiting stop losses to a minimum. For
    example, for 2% profit we will risk 4% of our asset. Our strategy will primarily
    rely on a mix of TEMA, RSI, and Bollinger Bands to forecast market movement in
    our favor. As a result, profit is booked. If the Heikin-Ashi candle is above the
    TEMA, which signals the uptrend, and the chart has bounced off the lower BB with
    an RSI greater than 30, this is a buy signal (green candle) If the Heikin-Ashi
    candle is red and the momentum is downward, this indicates that the lower part
    of the red candle is hitting TEMA and the candle is in the top part of the Bollinger
    band, which is fifty to seventy, this is a sell signal.


