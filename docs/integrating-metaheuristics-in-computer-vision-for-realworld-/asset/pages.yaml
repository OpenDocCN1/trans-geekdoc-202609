  md: '# 15.3 Extraction of Features


    The feature retrieval with vision is the cornerstone of every system for CBIR.
    Features can broadly be classified as either text-based (keywords, annotations)
    or visual (color, shape, texture, etc.). In the domain of visual features, features
    can be separated into low and superior categories. Selecting the attributes to
    depict a picture be the main components of a CBIR system. The perspective subjectivity
    is the main cause to represent the picture in a best way. Figure 15.1 shows the
    Block diagram of content-based image retrieval system. Each of these visual traits
    has been characterised using a variety of methodologies, each of which takes a
    different angle.


    # 15.3.1 Color


    The perception of color is based on how human vision system reacted to light.
    Illuminant, surface spectral reflectance, and sensor sensitivity all contribute
    to it. In content-based picture extraction, color is employed vividness attributes.
    It is independent of image size and orientation and reasonably resistant to backdrop
    complexity. The color space, color quantization, and choice of similarity function
    are the main problems in color feature extraction. There have been several proposed
    studies on color perception and color spaces [21–23]. A point in a 3D color space
    can be used to represent each pixel of the image. The color space to utilise must
    be chosen before we can describe an image using its color characteristics. Several
    space models, including CIELAB, RGB, HSV, CIELUV, and opponent color, are available.
    The application''s unique requirements will determine the optimal depiction.


    # 15.3.1.1 Color Space


    Currently, a variety of distinct color spaces are employed in the digital world
    to represent images. For implementing a content-based picture retrieval system,
    selecting a suitable color space is crucial for both producing correct results
    and accurately representing color as the human visual system sees it. There are
    many different color spaces in use; most popular ones include:


    # 15.3.1.1.1 RGB


    Most widely used color space is called RGB, or RedGreenBlue. The primary colors
    of light Red, Green, and Blue make up this area. Any color in the visible spectrum
    can be created by combining different amounts of the three hues. This area is
    perceptually uneven and device dependent. This means that even while two colors
    are close to one another in the RGB space, the human eye may not always perceive
    them as being close. CRT monitors, scanners, television, and digitalized cameras
    typically employ RGB space. The additive primaries that make up the phosphor luminescence
    for a monitor allow us to easily parameterize all the colors using the coefficients
    such as C = n1R+n2G+n3B. Coefficients start from 0 to 1. According to this parameterization,
    the color coordinates are used to pour a cubic volume by the vertex black, three
    basic colors RGB, the three alternate mixes CMY, and white, in Figure 15.2, RGB
    in coloring space.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/07f0bb0f402fd4e2f1880bf37d1ea963_275_0.png)


    Figure 15.2 RGB color space.


    # 15.3.1.1.2 HSV


    The three elements of hue, saturation, and value are used to define colors in
    the HSV color system. Colors are classified according to their hue (red, blue,
    etc.), saturation (the more vibrant they are, the less grey is present), and value
    (brightness). Once more a representation that depends on the device, HSV is defined
    in relation to the RGB color space. A straightforward formula can be used to convert
    RGB values to HSV coordinates. Colors with similar values are viewed similarly
    by the human eye because HSV is perceptually homogeneous. Especially in application
    interfaces, user browse the color space to choose an example, HSV space is frequently
    utilised in computer graphics.


    # 15.3.1.1.3 Opponent Color Space


    To support the hypothesis that human color vision employs an opponentcolor model,
    wherein certain colors are never perceived to occur together. In contrast, it
    is simple to recognise mixture of green and yellow, red and blue, green and blue,
    and, red and yellow. For instance, a color perception is not described as bluish
    yellows or reddish-greens. It is suggested that the opponent color space be used
    for encoding the color to the opposite signal considering observations. Three
    parts—R-G, 2B-RG, and R+B+G—are distinguished from the RGB values. The benefit
    of this style of representation is that it isolates the brightness of data into
    the 3rd channel.


    # 15.3.1.1.4 CIELUV and CIELAB


    These are suitable models for image retrieval because CIELAB and CIELUV spaces
    satisfy the requirement for spatial homogeneity. They have perceptually homogenous
    color spaces and are completely independent of the type of device being utilised.
    The brightness (L) and 2 chromatic elements (A and B), which stand for the separations
    between magenta, green, yellow and blue, so far, make up the three components
    of the model. CIE LUV is created to improve the linearity of color perception.'
