    # 1.2.2.3 Electromyography


    The most often utilized method for learning about how muscles are controlled by
    their neuromuscular system is electromyography (EMG) [26, 27]. EMG is successfully
    used in clinics for surgical procedures and diagnostic support [28]. EMG has recently
    been investigated as an alternative brain–computer for detecting movement intention
    using brain–computer interaction (BCI) [29]. Additionally, investigations on the
    viability of using EMG for human and muscle–computer interfaces have been conducted
    [30, 31]. In order to quantify muscle contraction velocity and analyze motor neurons
    and innervation zones, frequency–domain and time–domain analysis are most frequently
    utilized for surface EMG analysis [39]. The ideal feature vector has been created
    using time–domain features such root mean square (RMS), waveform length (WL) and
    Willison amplitude (WAMP) and waveform length (WL) [32, 33]. The most useful and
    often utilised frequency–domain parameters for determining muscle fatigue are
    median frequency (MDF) and mean frequency (MNF) [33]. The frequency–domain power
    spectrum technique, however, demonstrated more accuracy in determining muscle
    wear and tear [34].


    # 1.2.2.4 Electroencephalography (EEG)


    EEG, which records the electrical activity of the brain, has been investigated
    as a stroke diagnostic and predictive tool [35, 36]. Within the first three months
    following a stroke, the power spectrum starts to return to normal, but quantitative
    EEG (qEEG) can still reveal abnormalities that last past the threshold of excellent
    motor recovery, such as poor symmetry [37]. First time the brain symmetry measure
    was used to reliably identify early brain ischemia was during carotid surgery
    [38]. There is a need for an EEG device that is affordable, straightforward to
    set up, and simple to understand. Consumer wireless EEG systems that satisfy these
    demands have been made possible by technological advancements. One sort of wearable
    consumer EEG system that is commercially available and has been contrasted with
    medical EEG devices is The Muse by InteraXon Inc [39]. In order to evaluate the
    value of employing EEG in the hyperacute phase of stroke, future research will
    screen patients sooner, such as in the emergency room or in the ambulance [40].


