    # ## 18.1.2 Texture Analysis Methods


    Many methods for altering the appearance of an image''s texture have been discussed.
    Statistics, geometry, models, and signal processing are the four primary types
    of texture analysis techniques. Statistical techniques are used to examine the
    spatial distribution of grayscale values. Each pixel''s local features have been
    calculated in this approach [5]. In geometrical schemes, the texture is measured
    as a composition of texture compositions. This method defines the primitives and
    the guidelines leading to their spatial association. The different approaches
    used for primitive''s extractions are edge recognition with Laplacian-of-Gaussian
    or edge detection with Difference-of-Gaussian filter by adaptive region extraction
    and by mathematical morphology [53]. Properties like area and average intensity
    of the texture primitive were used as texture features [44]. Model-based approaches
    build a parametric generative model to infer the mechanism responsible for the
    texture''s intensity distribution. This model''s Fractal dimension is important
    since it is scale-invariant [6].


    Techniques from the field of signal processing analyze the image''s frequency
    content. Spatial filters, such as Laws masks, local linear transformations, and
    edge detection masks (e.g., Roberts'' and Sobel''s operators), are the most straightforward
    method for obtaining frequency information [27]. When creating strategies for
    classifying textures on the basis of their primitives, keep this information in
    consideration.


    +   1. First, brightness (grayscale) invariance concerns how light or dark a picture
    appears depending on the context. This is especially crucial in industrial machine
    vision applications where illumination conditions are often inconsistent.

    +   2. The performance of an algorithm is measured by its ability to generalize
    to data that differs in geographic size from that of the training set.'
