    # 1.4 Blood-Based Protein Biomarker for Stroke


    The use of radiological pictures for stroke diagnosis and distinction has been
    hampered by advancements in the field of neuroimaging, as well as possible drawbacks
    such their time-consuming nature, high equipment costs, limited availability,
    and variability in the analysis of radiological images [54]. It is very difficult
    to find ideal biomarkers that are engaged in cellular processes specific to ischemic
    stroke. Protein concentrations that are typically found in large concentrations
    in the brain not in the blood are obvious individ- uals [139]. Blood biomarkers
    may provide a dependable, quick, and affordable technique to distinguish between
    IS and HS. The choice of the best therapy options for patients who have suffered
    an acute stroke may be aided by specific biomarker signatures. To effectively
    and efficiently identify IS from HS in acute settings for better treatment measures,
    a blood- based biomarker method with high sensitivity and specificity is needed
    [55].


    # 1.5 Markers for Endothelial Damage


    The probable function of the Apo C-I and Apo C-III proteins in detecting HS and
    IS was discussed in a study by Allard et al. (2004) [56]. The relative fluorescence
    units were used to express the levels of Apo C-I and Apo C-III (RFU). In order
    to discriminate between 15 IS and 16 HS patients, Apo C-I was found to have a
    susceptibility of 94% and specificity of 73% with the cutoff point at 60 RFU,
    whereas Apo C-III was reported to have a sensitivity of 94% and specificity of
    87% with a cutoff point at 36 RFU. Within 6 hours of the beginning of symptoms,
    both Apo C-I and Apo C-III levels were shown to be higher in IS than HS. A few
    years later, Lopez et al. (2012) [57] used a Selective Reaction Monitoring (SRM)-based
    test to evaluate nine apolipoproteins (Apo A-I, Apo A-II, Apo B, Apo C-I, Apo
    C-II, Apo C-III, Apo D, Apo E, Apo H) for detecting IS and HS patients within
    the first week of symp- tom onset. They discovered that Apo C-III (individually)
    identified between IS and HS with an area beneath the curve (AUC) of 0.85 out
    of the nine apolipoproteins assessed. Kim et al. (2010) examined a panel of four
    biomarkers (BNP, D-dimer, MMP-9, and S100B), but they only found one biomarker,
    namely BNP, whose levels were considerably higher in IS patients (90.8156.4) as
    compared to HS patients (16.310.8) and that characterized the two types of stroke
    with an AUC of 0.61 [58].'
