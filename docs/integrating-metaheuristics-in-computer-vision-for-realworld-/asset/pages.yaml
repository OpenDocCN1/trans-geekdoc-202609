- pgno: 114
  md: 'do not improve the model''s predictive ability. These characteristics have
    the potential to cause overfitting, where the model becomes overly complex and
    struggles to adapt well to new data. Feature selection is employed to address
    this issue.


    A dimensionality reduction technique called feature selection includes choosing
    a subset [16] of the most important characteristics from the initial collection
    of features. The goal of feature selection is to reduce the dimensionality of
    the data while retaining the essential information in order to improve the effectiveness
    of the learning algorithm and reduce the risk of overfitting. Filter methods,
    wrapper methods, and embedding methods are the three fundamental categories of
    feature selection techniques.


    # 6.2.1 Filter Methods


    The fundamental principle of supervised feature selection, which is widely used
    for classification issues, is the relationship or association between the feature
    and the class label.


    Selecting pertinent features from a dataset using a filter is a common technique.
    According to this method, each feature''s importance is assessed using a particular
    metric or criterion, such as correlation or mutual information, and features are
    sorted according to their scores. The best traits are then chosen for additional
    examination or modeling. We will go over the filter feature selection approach
    in detail, along with its benefits and drawbacks, in this part.


    Filter feature selection is a widely used method in data science and machine learning
    because it is simple, rapid, and computationally efficient. No matter the amount
    or complexity of the dataset, it can be used. The main principle underlying filter
    feature selection is to assess each feature''s importance independently of the
    others using its inherent qualities, such as its statistical distribution or its
    correlation with the target variable [8].


    Correlation and mutual information are the most often utilized metrics in the
    selection of filter features. While reciprocal information reflects the amount
    of knowledge one variable has about the other, correlation measures the linear
    link between two variables. Higher ratings in both instances suggest greater significance.
    The chi-square, ANOVA, and Gini index are additional metrics that can be employed
    in the filter feature selection process.


    # 6.2.1.1 Procedure


    The selection process for filter features is depicted in Figure 6.1.


    The steps listed below can be used to further the flowchart:


    # Step 1: Data Preprocessing


    The first stage in the process of choosing a filter feature is data preparation.
    In order to do this, the data must be cleaned, missing values must be handled,
    and categorical data may need to be converted to numerical data. The data that
    has been cleaned and processed is then utilized to choose features.


    # Step 2: Calculating Feature Relevance Scores


    The next step is to calculate the relevance score for each feature. Various statistical
    methods can be used to calculate these scores, such as correlation-based methods,
    mutual information, and chi-squared tests. The most common statistical methods
    used for filter feature selection are:'
