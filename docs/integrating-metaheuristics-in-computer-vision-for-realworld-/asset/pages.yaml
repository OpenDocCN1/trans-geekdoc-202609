    # 1.7.2 Nanomedicines That Provide Oxygen to Ischemic Brain Tissue


    Although hemoglobin (Hb) is a naturally occurring O2 carrier, its limited clinical
    use is due to its short half-life and hypertension response [71, 72]. In addition
    to extending the period that hemoglobin circulates _in vivo_, liposomal hemoglobin
    (LHb) can transport enough oxygen to go beyond microcirculation''s barriers and
    to the penumbra, where red blood cells (RBCs) are rarely able to reach [73, 74].
    When given right away after the middle cerebral artery is blocked, LHb can also
    greatly reduce the size of the infarction in a transient ischemia model (MCAO)
    [75, 76].


    # 1.7.3 Reducing Oxidative Stress With Nanomedicines


    Small molecule chemicals, antioxidants, and inorganics are the major types of
    antioxidants used in preclinical research. Antioxidants’ pharmacokinetic performance
    may be enhanced by nanomedicines, which may also help them pass through the BBB
    and store in the injured brain [77]. Many small molecule antioxidants, including
    bai-calin [78], luteolin [79], curcumin [80], resveratrol [81], tanshinone [82],
    and puerarin [83], are derived from plants and contain phenolic and keto components.
    For instance, hydrophobic curcumin is quickly broken down, ejected, and not effectively
    absorbed by cells _in vivo_. Because cells ingested NPs through endocytosis rather
    than passive diffusion, more absorption in neurons was seen in PLGA-NPs containing
    curcumin than in free drug. Additionally, NPs more effectively reduced oxidative
    stress in H<sub>2</sub>O<sub>2</sub>-treated neurons [80, 84, 85]. The ability
    of NPs to prolong curcumin’s half-life _in vivo_ improved the likelihood that
    the medication would enter the injured brain during the BBB’s opening window.
    In a different study, exosomes made from embryonic stem cells that had been loaded
    with curcumin increased the drug’s stability and solubility while also addressing
    the issue of low absorption [86]. Curcumin-loaded embryonic stem cell exosome
    therapy can therefore considerably lower the level of ROS in the injured brain,
    decrease the infarct size, and lessen the breakdown of neurovascular units. several
    manufactured small molecule antioxidants as edaravone [87] and the nitroxyl radicals
    2,2,6,6-tetramethylpiperidine-1-oxyl, there are natural antioxidants obtained
    from plants (TEMPO). The strategy of BBB modification may assist the edaravone
    micelles achieve more efficient storage in ischemic brain and rescue more neurons.
    To increase the duration of edaravone’s circulation, PEG-PLA micelles that have
    been treated with CGS21680 were created [88].


