- pgno: 276
  md: '# 15.3.1.2 Method of Representation


    The depictions of each feature can vary. The color feature of an image is represented,
    for instance, by color histograms, color moments [24], color or color correlograms
    [25], coherence vectors [26], etc. Moreover, a wide range of color histogram variations
    have been put out, each with a unique color quantization method. The mathematical
    operations carried out on pixel values represented in a particular color space
    are connected to the color descriptors. Most common adjectives include:


    # 15.3.1.2.1 Color Histogram


    In CBIR systems, color histograms are the primary tool for representing the color
    information of images. A type of bar graph known as a color histogram is one in
    which each and individual bars represent an actual color in e currently used color
    space. A color histogram is a rough illustration of the likelihood of the three
    color channels’ combined values. By dividing the data range into bins of equal
    sizes, the histogram’s most prevalent form can be derived. The likelihood that
    a pixel will fall into a certain bin is then determined for each bin by counting
    and normalising the number of colours of the pixel in a picture which fall into
    each bin to total points. The fact that the colour histogram does not account
    for the spatial data contained in pixels is one of its fundamental flaws.


    The fact that two quite diverse photos have a similar colour distribution allows
    us to compare them. The cumulated colour histogram, first forth by Stricker and
    Orengo, is an enhancement of the colour histogram approach. The benefits of the
    suggested approach over the traditional colour histogram approach were shown by
    their findings. Nevertheless, the approach has the drawback that there is no obvious
    way to organise bins when there are multiple-dimensional histograms.


    # 15.3.1.2.2 Color Moments


    Stricker and Orengo suggested employing the colour moments technique to get around
    the quantization issues. Color moments, are the statistical moments of colour
    probability distributions, are often employed in retrieval systems, particularly
    when a picture only contains the item itself. It has been shown that the mean,
    variance, and skewness color moments can be used to accurately represent the colour
    distributions of photographs. The issue with colour moments is that they have
    the same shortcomings as the colour histogram technique in that they do not encode
    any spatial information surrounding colour inside an image.


    # 15.3.1.2.3 Color Correlogram


    The color correlogram is a method for recording an image’s color information.
    Unlike to color histograms and moments, this approach adds spatial data in the
    encoded color information, which solves some of the issues with previous representations.
    The color correlogram has the advantages of being easy to compute, including color
    spatial correlation, and being able to describe the worldwide distribution of
    color spatial correlation.


    # 15.3.1.2.4 Color Coherence Vector


    In a split histogram, pixels are divided into color coherence vectors based on
    their spatial coherence. The image’s pixels are divided into two categories, coherent
    and incoherent,'
