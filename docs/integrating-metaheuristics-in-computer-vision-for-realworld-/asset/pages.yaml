  md: 'Further events include the release of proteolytic enzymes that degrade ECM
    (extracellular Matrix), migration of endothelial cells through degraded ECM, proliferation
    of endothelial cells, and eventually capillary tube formation [20]. Following
    this, endothelial cells get differentiated into tip, stalk and tube cells, in
    which on-proliferative tip cells expresses Delta-like ligand 4 (DLL4) and present
    at the front of new vessels. Highly proliferative stalk cells express Notch-1
    and form trunk of vessel [21]. Tube cells are non-proliferating cells and contains
    lumen that gives the final shape to vessel. In addition, pericytes cells, express
    platelet-derived growth factor receptor beta (PDGFR-β), and alpha-smooth muscle
    actin (α-SMA) and cover the vessel from outside [22].


    # 16.4 Angiogenesis in Carcinogenesis


    Several in vivo and in vitro experimental evidence supported the correlation of
    aggressive carcinogenesis with increased angiogenesis. For example, in breast
    carcinoma in situ (CIS), a severe form of dysplasia, an increase in angiogenic
    density was reported in invasive tumor mass [23]. Further, in the cervix cancer,
    a remarkable increase in Microvessel density was also seen [24]. Histopathologically,
    an increase in angiogenesis density was also confirmed in lung and breast metaplasia,
    dysplasia, and CIS [25, 26]. Moreover, overexpression of VEGF and PDEGF has been
    determined in breast, cervix, and oesophagus carcinoma [27]. Similarly, high levels
    of MMPs and TIMPs have been observed in tumor lesions as they progress from CIS
    to invasive carcinoma (Figure 16.1) [28, 29].


    ![](img/07f0bb0f402fd4e2f1880bf37d1ea963_288_0.png)


    Figure 16.1 Illustration of angiogenesis process initiation during carcinogenesis.
    New vessel formation in hypoxic conditions induces the expression and activation
    of VEGF. Subsequently, VEGF forms a gradient pattern that attracts endothelial
    cells and stimulates their proliferation. Proliferating endothelial cells get
    arranged in a tube-like structure and form a vasculature network inside tumor
    mass. MMP enzymes degrade ECM and facilitate the movement of endothelial cells.'
