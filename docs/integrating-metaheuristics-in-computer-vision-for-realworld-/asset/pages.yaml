- pgno: 257
  md: '# # Bidirectional LSTM for Heart Arrhythmia Detection


    Nikhil M. Agrawal¹, H. D. Bhanu Cheitanya¹, Abhishek Kumar Rai¹ and Shubham Mahajan¹,²,³*

    ¹School of Engineering, Ajeenkya D Y Patil University, Pune, India

    ²Hourani Center for Applied Scientific Research, Al-Ahiyya Amman University, Amman,
    Jordan

    ³University Center for Research & Development (UCRD), Chandigarh University, Mohali,
    India


    # ## Abstract


    The previous model (heart arrhythmia detection LSTM) concluded the detection of
    heart arrhythmia using unidirectional LSTM model from deep learning. The results
    were found to be great but there was some room for improvement, the model had
    a decent performance, which was suitable to make the predictions but as this was
    a medical scenario, the room for improvement should always be given importance
    over anything. Thus, the LSTM was introduced, this drastically improved the results
    and the accuracy was increased, although not much but it was significant. This
    recent approach has some of the updates which make it easier for the computation
    and adds another layer to the project which enables it to use the dataset in a
    particular fashion. As the case of the dataset is to be received can be in the
    format of CSV, “Comma Separated Values”, it does not need to go through the processing
    and computational power of the previous model (heart arrhythmia detection using
    LSTM) as this model did the conversion of “.dat,” “.hea” file format which was
    usually produced by the ECG/ EKG machines. Thus, reducing the time required for
    the processing of the dataset. Additional change is the introduction of back propagation
    with the help of batch size as it drastically decreases the computational and
    the runtime of the model from 7 to 8 hours to 2 to 3 hours, all this occurs at
    a faster rate for even bigger dataset and has the accuracy gaining at double the
    rate for much less epochs.


    **Keywords:** LSTM, heart arrhythmia, heartbeat, ECG, bidirectional, batch normalization,
    CSV, normal beat


    # ### 14.1 Introduction


    In the unidirectional approach, the model only remembers past data as it uses
    the previous data to make predictions. But in the bi-directional approach, the
    model learns in two ways. One model learns from past to future, and the other
    learns from future to past what this means is that the model at a time is able
    to travel back and make changes to the weights associated and change them according
    to the activation function used. Thus, a bi-directional LSTM [9] model is able
    to preserve data related to the future and the past. This in turn makes the model
    more accurate as it constantly keeps on learning from the past about the future
    and from future it is able to learn about the past [1, 2].'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'In the unidirectional model since the model was not able to go back and adjust
    the weights from the future the model was less accurate and also consumed a lot
    of time. But in the bidirectional approach, we simply took the processed data
    from the model at the output level and then as there is a threshold for results
    it recalculates at each level of the model, this produces an output which is far
    more accurate and better than the before results. Additionally, the entire will
    consist of some of the classification techniques which would be useful of the
    different classification of heart arrhythmia types, the different types of possible
    heart irregular rhythms or arrhythmias are separated into two classes, tachycardia
    and bradycardia, tachycardia is termed as fast heartbeat than the regular and
    bradycardia is termed as slower than usual heartbeat [3-5].


    # Tachycardia:


    There are several types of tachycardia, which are as follows:


    +   1) Atrial fibrillation: everything with atrial in it is related to a stroke
    and if left untreated it might cause some serious issues, it may be temporary
    most of the times but there are cases where it becomes chronic. It results in
    uncoordinated and unorganized heart rate.

    +   2) Atrial flutter: as this contains the word Atrial in it, it is also related
    to stroke but as compared with atrial fibrillation it is more organized and coordinated.

    +   3) Supraventricular tachycardia: As the name suggests it begins at the lower
    chamber of the heart where there are ventricles, unlike atrial which is upper
    chamber, this tachycardia begins and ends randomly based on the medical condition
    of the patient.

    +   4) Ventricular fibrillation: it occurs when a sudden change in the environment
    is noticed, usually it is due to any electrical impulse and it can disrupt the
    normal rhythm massively, if left untreated it can result in death of a person
    in minutes.

    +   5) Ventricular tachycardia: It is a medical condition where the ventricles
    are not fully filled with blood but the heart continues to beat early than expected
    which results in rhythm impairment, if not treated early this condition can be
    deadly.


    # Bradycardia:


    There are several types of bradycardias, two of which are-


    +   1) Sick sinus syndrome: There is a sinus node in the heart which is responsible
    for the rhythm of the heart, any damage in the form of trauma or tear in the sinus
    node can cause the heart to beat irregularly which can be in the form of too fast
    (tachycardia) or too slow (bradycardia). The sick sinus syndrome is usually resulted
    due to a trauma and hence it is known to block or boost the blood flow and hence
    messing up the rhythm. It might be also caused due to old age.

    +   2) Conduction block: this is the simple block which can be caused by many
    reasons, due to the blockage in the electrical impulse the heart cannot beat properly,
    although this can happen any time and the person might not even notice it as it
    might just feel like a skipped heartbeat.'
