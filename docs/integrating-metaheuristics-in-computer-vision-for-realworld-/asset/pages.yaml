  md: 'was used to construct this dataset (KOI) [8]. Exoplanets that have been confirmed
    together with a few key factors that characterise their kind are retrieved from
    KOI and downloaded as a csv file. A new column is then added to this dataset that
    indicates the type of a certain exoplanet, which is gathered from NASA''s exoplanet
