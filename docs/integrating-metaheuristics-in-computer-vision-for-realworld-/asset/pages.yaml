    # ### Abstract


    Bioinspired algorithms have progressed to a new level in the solution of engineering
    optimization challenges. They have recently piqued the interest of academics due
    to their ease of use and high performance. These algorithms are primarily employed
    as global optimization tools, and they have been utilized to solve a variety of
    optimization engineering challenges. In this regard, a number of algorithms have
    been formulated taking inspiration from swarm intelligence. Therefore, an effort
    has been made to highlight a few popular optimization algorithms established.
    The major goal of this chapter is to present an overview of the most recent advances
    in swarm intelligence and nature-inspired computation, with a focus on optimization
    algorithms. The chapter also highlights the strengths and limitations of swarm
    intelligence and computation. Probable future directions that can address the
    unresolved issues are made in the chapter for speedy reference for readers.


    *Keywords:* Swarm intelligence, optimization, gradient-based algorithms


    # ## 13.1 Introduction


    Applications for optimization range widely, from data mining and machine learning
    to corporate planning and engineering design. Optimization can maximize profit,
    outcomes, efficiency, effectiveness, and reliability, or minimize energy consumption,
    costs, journey time, and ecological effects. The real-world forces us to solve
    a wide variety of design issues with a finite amount of time, money, and other
    resources, so we have to find the best solutions to a wide range of design challenges
    while working within a number of difficult constraints.


    To adequately represent and define optimization problems, requires mathematical
    optimization or mathematical programming, encompassing multiple domains including
    manufacturing, production, supply chain management, inventory control, transportation,
    business management, artificial intelligence, finance, engineering, mechanics,
    economics,'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'control theory, and design engineering. Minimizing or maximizing a specified
    objective function is the primary goal of any optimization problem. The objective
    function is the quantity (profit, expense, etc.) that is to be optimized.


    Simple brute force methods are neither practicable nor desirable for finding optimal
    solutions, despite the ever-increasing computing capacity of today’s computers.
    Algorithm efficiency is essential to practically all applications. There are a
    wide variety of various optimization algorithms, including evolutionary algorithms
    like evolutionary strategy and genetic algorithm, as well as more conventional
    approaches like gradient-based algorithms, Tabu search, and the interior-point
    method [1]. New algorithms like the ant colony optimizer (ACO) [2], particle swarm
    optimizer (PSO) [3], bat algorithm (BA) [4], Aquila optimizer (AO) [5], and arithmetic
    optimizer (AO) [6] are all based on ideas from nature. A few other techniques
    in different fields are discussed in Sharma et al., Mahajan et al., and Singh
    et al. [7–9].


    Every optimization algorithm has some advantages and disadvantages. With the help
    of this biologically-inspired paradigm, researchers began to explore the cooperative
    systems in the natural world that they might use to develop nature-inspired algorithms.
    This collaborative approach has led to the investigation of these algorithms for
    their beneficial purpose by mitigating their drawbacks [10, 11]. For example:
    in the Gradient-Based method, the variations are represented by differential equations
    with space and time gradients. The downside of this method is its reliance on
    noise, occlusions, and discontinuities. Similarly, the gravitational algorithm
    (GA)-based method can be difficult to optimize and can be time-consuming to run.
    Additionally, they may not find the global optimum and can be stuck in local optima.
    Particle Swarm Optimization (PSO) has a slow speed of convergence. Grey Wolf Optimization
    algorithm (GWO) has the disadvantages of slow convergence speed, low solution
    accuracy, and easily falling into the local optimum. Ant Colony Optimization (ACO)
    has it has some shortcomings in the convergence speed and solution accuracy when
    dealing with a large amount of data. Similarly, arithmetic optimizer (AO) has
    an inconsistent convergence rate.


    # 13.1.1 Motivation


    Although swarm intelligence and nature-inspired computation have long been areas
    of interest to mankind, significant advancements have been achieved since the
    1990s. Recent years have seen advances in computationally effective and viable
    algorithms that are inspired by nature. Due to their immense intrinsic benefits,
    these algorithms are used to solve a wide variety of practical problems. The primary
    objective of this chapter is to offer readers a unified consortium containing
    a summarized view of these developments, with an emphasis on optimization techniques.


    # 13.2 Optimization Algorithms


    Numerous problems constitute optimization problems. For instance: scheduling problems,
    traveling salesman problems, control and manufacturing problems, and planning
    and design performance problems [12]. In computer science, optimization problems
    can be'
