  md: '# Advancement in Diagnostic and Therapeutic Techniques for Ischemic Stroke


    Mukul Jain 1,2, Divya Patil 1, Shubham Gupta 3 and Shubham Mahajan 4,5,6*


    1 Cell & Developmental Biology Lab, Research and Development Cell, Parul University,
    Vadodara, Gujarat, India 2 Department of Life Sciences, Parul Institute of Applied
    Sciences, Parul University, Vadodara, Gujarat, India 3 Department of Paramedical
    and Health Sciences, Faculty of Medicine, Parul University, Vadodara, Gujarat,
    India 4 School of Engineering, Ajeenkya D Y Patil University, Pune, Maharashtra,
    (iNurture Education Solutions Pvt. Ltd., Bangalore), Pune, Maharashtra, India
    5 University Center for Research & Development (UCRD), Chandigarh University,
    Mohali, India 6 Hourani Center for Applied Scientific Research, Al-Ahliyya Amman
    University, Amman, Jordan


    # Abstract


    Ischemic stroke is a cerebrovascular disease that is typically brought on by a
    disruption in the blood flow to the brain; it accounts for more than 80% of all
    strokes. 1.8 million neurons are thought to die per minute. The burden of stroke
    in people younger than 65 years has increased over the last decades, it has increased
    worldwide by 25% among adults aged 20 to 64 years. According to reports, both
    men and women can experience stroke symptoms, in this case women are more prone
    to have nontraditional symptoms of stroke like dizziness, lack of consciousness,
    slurred speech. In comparison to Western Europe, America, Australia, and similar
    to Eastern Europe, Asia has a higher stroke fatality rate. Acute management of
    stroke requires fast and efficient screening, imaging and modality. Better clinical
    outcomes can be attained through early detection and treatment of stroke. Stroke
    imaging techniques are computed tomography (CT) scans and magnetic resonance imaging
    (MRI). MRI is more preferred because it gives detailed and exact result of damage.
    Antithrombotic and neuroprotective therapies are the mainstays of conventional
    medicine, although their use is still constrained due to their poor safety. Utilizing
    nanomedicines is an additional option since they can boost therapeutic benefit
    and adverse effect reduction, achieve effective medicine collection at the target
    site, and improve pharmacokinetic behavior of pharmaceuticals in vivo. We have
    comprehensively described ischemic stroke, its epidemiology, advanced artificial
    intelligence–based diagnostic tools and its treatment therapies.


    **Keywords:** Ischemic stroke, computed tomography, MRI, artificial intelligence,
    diagnostic tools, PET, EEG, nanomedicine


    *Corresponding author: mahajanshubham2232579@gmail.com'
