  md: '# Trading Bot for Cryptocurrency Market Based on Smart Price Action Strategies


    Divneet Singh Kapoor¹,²*, Kiran Jot Singh¹,², Anshoom Jain³, Rhythm Chauhan³,
    Khushal Thakur¹,² and Anshul Sharma¹,²


    ¹Kalpana Chawla Centre for Research in Space Science & Technology, Chandigarh
    University, Mohali, Punjab, India ²Electronics and Communication Engineering Department,
    Chandigarh University, Mohali, Punjab, India ³Computer Science and Engineering
    Department, Chandigarh University, Mohali, Punjab, India


    # Abstract


    This paper focuses on design of a Python-based crypto currency trading bot to
    support all major exchanges and is managed through Telegram messenger application.
    The system offers a range of capabilities, including back-testing, mapping, and
    money management, as well as machine learning strategy optimization. This enables
    users to create their own trading strategies and tactics using Python and pandas.
    The strategies can be back-tested on historical data, which is widely and freely
    available on exchange platforms and in the market that the user wants to trade
    in. The system also allows for hyperoptimization of trading strategies based on
    the results of back-testing, which is achieved using machine learning algorithms
    to find the optimal parameters for the strategy. In addition, the bot enables
    users to select markets to trade in by creating a static list or using an automated
    one based on top traded volumes and/or prices. It also offers the ability to expressly
    ban marketplaces in which the user does not want to trade. The system allows users
    to test their strategies with simulated money in dry-run mode or to deploy them
    with real money in live-trade mode. To monitor trades, the bot can be integrated
    with the Telegram API. Users can display profit/loss, daily summaries, current
    open trade outcomes, and many more options. Overall, the bot offers a powerful
    and flexible platform for automating and optimizing crypto currency trading strategies.


    **Keywords:** Cryptocurrency, frequency trade, cryptocurrency trading, back-testing,
    machine learning


