    # ## 13.2.5 Genetic Algorithms


    GA is likely the most widely recognized example of a nature-inspired algorithm.
    John Holland [41] created GA, an evolutionary algorithm, which was motivated by
    the naturalistic Darwinian evolution of biological systems.


    An optimization problem''s solution vectors are represented as a binary sequence
    of 1s and 0s known as chromosomes. A pool of potential solutions, represented
    as chromosomes, serves as the starting point for the algorithm. Each chromosome
    includes a unique set of genes that serve as the parameters in the optimization
    problem. The fitness function is then evaluated for each chromosome to ascertain
    the degree to which the solution meets the problem''s objective. Following this,
    the program uses genetic operators like selection, crossover, and mutation to
    produce offspring chromosomes [42, 43]. Crossover and mutation introduce new genetic
    material into a population and create new populations/solutions, while natural
    selection favors chromosomes with greater fitness. Iterations of this procedure
    are continued until a stopping criterion is reached, which can be a maximum number
    of allowed iterations or attaining a sufficient level of fitness. With the aid
    of this generational repetition, the population evolves and progresses towards
    an optimal solution and identifies the fittest individuals.


    # ## 13.2.6 Particle Swarm Optimization


    Particle Swarm Optimization (PSO) is a metaheuristic optimization technique inspired
    by the collective intelligence of natural systems like the behavior of birds flocks
    and fish schools. The fitness function assists the PSO algorithm as it seeks the
    best possible solution to a problem. The particle population is denoted by $x$,
    and the fitness function is written as $f(x) = f(x_1, x_2, x_3, ... ... x_n)$.
    Each particle adjusts its velocity based on the collective and individual flying
    experiences of its peers. Each particle adjusts its location based on its current
    positions, speed, and the difference between its best personal best position ($Pbest$)
    and the swarm''s best position ($Gbest$).


    The following equation is used to adjust the velocity of each particle:


    ```

    $S_{t + 1} = wS_t + c_1 r_1(P_{best} - X_t) + c_2 r_2(G_{best} - X_t)$

    ```


    where $S_t$ = Particle''s velocity at a time ''t, $X_t$ = Particle''s current
    position at time ''t, $P_{best}$ = historical best position of an individual,
    $G_{best}$ = swarm best position. Both $r_1$ and $r_2$ are random numbers in the
    range from 0 to 1, while $c_1$ and $c_2$ are acceleration constant values.


    Where objective function $f(X)$ needs to be minimized.'
