    # 1.7 Therapeutic Advances in Ischemic Stroke


    Since well-developed nanomedicines have numerous remarkable benefits, many nanomedicines
    are developed to increase the effectiveness and decrease the negative effects
    of conventional cure approaches. Nanomedicine may boost the solubility of ineffectively
    soluble pharmaceuticals, enhance their steadiness, and lengthen their in vivo
    half-lives [67]. Targeted altered nanomedicine could help medications get around
    the blood–brain barrier (BBB), which prevents the majority medications from getting
    to the brain, and achieve collection at the intended spot to prevent unspecified
    dissemination. Targeted alteration may also make it easier for a given cell type,
    like damaged neurons, to absorb a nanomedicine. Thus, targeting-capable nanomedicines
    not only improve curing impact but lowers inserted dose and drug toxicity [68].
    The drug delivery systems (DDS), which include stimuli-responsive nanocarriers
    and targeted nanocarriers, could deliver drugs to desired sites like thrombus
    and the central nervous system (CNS) and specifically release drugs in those areas
    by reacting to stimuli that are internal or external, thereby enhancing their
    therapeutic effects [138]. Additionally, the release of pharmaceuticals might
    be controlled by nanomedicines made of various functional materials, and the functionalized
    carrier may be useful in the treatment of ischemic stroke [67].


    # 1.7.1 Ligand-Mediated Active Targeting


    Since fibrin is a significant part of thrombus, alteplase was delivered using
    polystyrene nanoparticles were changed by an antifibrin antibody by combining
    proteins on their surface. In the absence of an embolus, alteplase NPs displayed
    significantly lower activity than free enzyme. It would reduce the cleavage of
    plasminogen in an unspecified manner and raise the likelihood of bleeding less
    [69]. In addition to single-targeted ligand modification, there are some studies
    into dual ligand-modified nanomedicine that has superior targeting effectiveness.
    The contact between thrombocytes is mediated by the overexpressed P-selectin'
