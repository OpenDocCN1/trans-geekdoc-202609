- pgno: 15
  md: '# Preface


    Currently, the use of digital images and videos has extended to different fields,
    such as surveillance, manufacturing, medicine, agriculture, machine and robot
    vision, pattern recognition, etc. They are easy to obtain from various environments,
    and it is necessary to recognize the objects contained in the scenes. To achieve
    this goal, several computational approaches have been developed; however, considering
    the technological advances in problems, such as image size, noise, illumination
    and security, it is necessary to develop new methodologies and to improve the
    classical algorithms.


    On the other hand, computer vision and image processing systems should be able
    to automatically extract the desired features for a particular task. Computational
    Intelligence (CI) approaches are alternative solutions for automatic computer
    vision and image processing systems; they include the use of tools, such as machine
    learning and soft computing. Researchers from all over the world are working hard
    to create new algorithms that combine the methods provided by CI approaches to
    solve the problems of image processing and computer vision. This book provides
    high-quality research work that addresses broad challenges in both theoretical
    and application aspects of soft computing and machine learning in image processing
    and computer vision.


    This resource is useful for a variety of readers, with three specific audiences
    in mind. One of these target audiences is university students (undergraduate,
    graduate, or post-graduate) who are learning about communication, automation,
    and power engineering. The second group includes those who are beginning a career
    in research and innovation. The third target audience consists of researchers
    and practitioners who lack an in-depth background in automation and engineering
    but want to rapidly acquire one and begin using it in their product development
    or platform.


    This book comprises 19 chapters. Chapter 1 and Chapter 2 discuss the advancement
    in diagnostic and therapeutic techniques for ischemic stroke and object detection
    and tracking face detection and recognition. The third chapter discusses the future
    of medicine, namely 3D printing organs. Comparative evaluation of machine learning
    algorithms for bank fraud detection, an overview of computational-based strategies
    for drug repositioning and improving performance with feature selection, extraction,
    and learning are detailed in Chapters 4, 5, and 6. The proposed method is capable
    of retrieving transformed images as well, i.e., the proposed system is robust
    at photometric and geometric transformations, which is covered in detail in Chapter
    7.'
  merge: -1
