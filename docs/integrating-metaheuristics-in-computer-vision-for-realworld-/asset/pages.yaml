    # 9.5 Conclusion and Future Scope


    For many years, the quest for exoplanets, or worlds beyond of our solar system,
    has captured the interest of both scientists and the general public. With the
    development of advanced technology and sophisticated machine learning algorithm,
    it is more possible than ever to accurately predict the presence and characteristics
    of exoplanets. A variety of machine learning techniques have been employed in
    the exoplanet prediction model to examine data and make predictions about exoplanets
    with the goal of expanding our understanding of these enigmatic and intriguing
    celestial entities.


    Proposed exoplanet prediction model has demonstrated the power and potential of
    machine learning algorithms for identifying and classifying exoplanets. Using
    a variety of algorithms, including support vector machines, logistic regression,
    k-nearest neighbors, random forest, and extreme gradient boosting, very high accuracy
    was achieved in predicting the existence and characteristics of exoplanets, such
    as their type. Our results show that these algorithms are highly effective at
    finding patterns in the data and making accurate predictions, and they can provide
    valuable insights into the properties of exoplanets that'
