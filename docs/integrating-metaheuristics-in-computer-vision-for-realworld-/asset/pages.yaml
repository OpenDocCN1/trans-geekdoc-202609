    The algorithm for enabling the bot for cryptocurrency profit trading prediction
    is as follows:


    +   Step 1: Get the freqtrade image by downloading the dockercompose.yml file.

    +   Step 2: In the yml file, select the development image.

    +   Step 3: Create a configuration file with parameters such as whitelist, backlist,
    volume pair list, static pair list, maximum profit, maximum loss, maximum amount
    in wallet, maximum number of transactions, and so on.

    +   Step 4: Develop or establish a plan for the bot.

    +   Step 5: Use indicators [Bollinger bands, RSI (relative strength index), TEMA
    (triple exponential moving average), SMA (simple moving average)] to configure
    and set the desired strategy in the bot.

    +   Step 6: Connect to Binance with its API key.

    +   Step 7: Import historical data from the Binance exchange service.

    +   Step 8: Use this historical data to backtest your technique.

    +   Step 9: The bot will display you how your strategy would have performed if
    you had used it during that trade interval, and it will hyper optimize your strategy.


    And your bot is ready to use.


    The indicators used for the setting the desired outcome for the algorithm are:


    **TEMA.** The total average is calculated by using three different exponential
    moving averages of three different candle ranges. We are employing this indication
    since it reacts quickly to market momentum, which will help the bot reduce losses
    and increase profits [23].


    **Bollinger bands.** It is used to represent the standard deviation from the exponential
    moving average, which effectively shows us the market''s likely movement. This
    indicator is commonly configured with a standard deviation of two and an EMA set
    to the last 20 candles [24].


    **RSI.** This indicator is commonly used to determine market momentum in conjunction
    with other indicators. The market range for this indicator is thirty to seventy.
    If the RSI is less than thirty, the coin has been oversold and could be a good
    entry point to long the market. If the RSI is greater than seventy, the coin has
    been overbought, indicating that a bearish trend is about to begin [25].


    Figure 8.4 shows the Indicators that we used via visual representation on the
    chart (chart showing highs and lows in prices of a trade in real time).


    **Heikin-Ashi candle.** Heikin-Ashi being a candlestick pattern approach that
    tries to decrease market noise by producing a chart that indicates trend direction
    better than traditional candlestick charts. The drawback of Heikin-Ashi is that
    risk may be impacted by the loss of certain pricing data due to averaging. Long
    down candles with minimal upper'
