    # ## 7.5 Experimental Study and Performance Evaluation


    This section describes the analysis and observations carried out by our extensive
    set of experiments. It has been investigated by the recent studies that hybrid
    approaches to image retrieval system are being used for improving the retrieval
    accuracy. Therefore, we compare our system against two hybrid approaches given
    by Wei et al. and Qi et al. [25, 26], referred as TCS and QLS, respectively. We
    also compare our results with invariant Zernike moment descriptor (IZMD) [34],
    optimal similarity [35], and adjacent phase [36], where both ZMs magnitude and
    phase are used as features. In the studies by Revaud et al. [35] and Chen and
    Sun [36], the image matching performance is observed to be promising for geometric
    and photometric transformations; nevertheless, their performance degrades for
    subject database, where variations among sample intra-class samples exist. The
    algorithms are implemented in VC++ 9.0 for the proposed and the above mentioned
    approaches using the similar strategies as mentioned in their research papers.
    The following sub-sections describe the performance measure, database construction,
    and experiments results.


