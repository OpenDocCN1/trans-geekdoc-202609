    # 5.2.1.5.1 Genomics and Proteomics


    Biomarkers have the potential to make it possible to predict health outcomes from
    the viewpoints of physiological processes and symptoms. The rate of success for
    the development of biomarker-based cancer drugs has increased from just 3.4% to
    an overall oncology treatment approval rate of 8.3% for 2015. Biomarkers were
    preceded by genomics, mostly because it is relatively simple to collect gene expression
    profiling. Additionally, combinations of genomic biomarkers performed better as
    prognostic indicators than single genomic biomarkers [25]. A combination of 70
    genes that predict a bad prognosis with up to 83% accuracy can be shown in sporadic
    breast cancers as an illustrative case. Proteomics has the potential to be used
    as biomarkers in addition to genomics [26]. However, proteomics is less likely
    to be employed for advanced cancer diagnostics to achieve the necessary clinical
    accuracy due to the continued difficulty of rigorous validation and difficult
    decoding methods. As a result, relatively few multi-parametric tests have been
    approved by the FDA under 510(k) procedures to date [27].


    # 5.2.1.5.2 Genome-Wide Association Study


