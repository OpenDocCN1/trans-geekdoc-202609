    # 15.2.2.1 Parallel Architecture


    A parallel architecture is made up of independent nodes, each with a separate
    CPU; shared-nothing (SN) RAM and discs are designed to scale with the database’s
    size or its user base, respectively, and are used to divide the data into groups.
    To speed up query processing, groups are then indexed. This provides the capacity
    to scale up larger databases, I/O parallelism, and the ability to disperse the
    processing load across the available CPUs. Kim [11] and associates have created
    a method based on VA-FILE (Vector Approximation- FILE). The administration of
    two data sets forms the foundation of VA-FILE: a file containing all basic vectors
    with another file of “little” size holding geometric vectors. To choose the vectors
    that are included in the result set, a sequential scan of the approximate file
    is carried out during a query. The aim of it is to parallelize the search, with
    the downside where in response time depends on both latency time and execution
    time. Each machine executes a data partition, and the coordinator decides the
    overall query outcome. Other additional studies in the same field, as suggest
    techniques built on a shared nothing machine with data partitioning. With these
    techniques, parallelism is maximised, and the most effective processing nodes
    is determined to maximise data consumption. Simplicity of usage and scalability
    of these methods are two benefits. Limiting the number of processors and increasing
    cost and complexity are the main drawbacks.


