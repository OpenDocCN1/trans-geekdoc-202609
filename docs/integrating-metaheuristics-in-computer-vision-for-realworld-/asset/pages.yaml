    # 2.6.2 Algorithms Used in Object Detection


    In computer vision, the process of discovering and locating interesting objects
    in an image or video is referred to as object detection. Identifying numerous
    objects in the image with varying sizes, orientations, and locations is a more
    challenging task than object tracking.


    Following are some popular object identification techniques in computer vision:


    +   (1) Haar Cascades: This method uses a set of traits to identify objects in
    photos. It involves putting a classifier through its paces on a sizable number
    of positive and negative samples of the target object.

    +   (2) HOG: Using information about the gradient orientation of the pixel values,
    this approach extracts information from an image. It then uses a sizable dataset
    of both positive and negative samples to train a classifier to recognize objects
    using these properties.

    +   (3) Region-based Convolutional Neural Network (R-CNN): This method identifies
    objects in images by fusing deep neural networks and region suggestions. It involves
    locating regions of interest in a deep neural network is used to process images
    to determine whether or not they include an object.

    +   (4) You Only Look Once (YOLO): Using a single neural network, this approach
    predicts the item classes and bounding boxes of a picture in real-time.

    +   (5) Single-Shot Detector: This algorithm recognizes objects by mixing convolutional
    feature maps of various sizes. It is similar to YOLO but has a different architecture.'
