    Amman, Jordan


    # Abstract


    Exoplanet prediction using machine learning algorithms has the potential to significantly
    advance our understanding of these mysterious celestial bodies. In this project,
    a variety of machine learning algorithms were used, including support vector machines,
    logistic regression, k-nearest neighbours, random forest, and extreme gradient
    boosting, to make predictions about the existence of exoplanets and which their
    type. For this two datasets are used. With one dataset, a model that predicts
    the existence of an exoplanet was made and with other dataset, a model that predicts
    the type of an exoplanet was made. The goal was to identify patterns in the data
    and to make accurate predictions about the existence and characteristics of exoplanets.
    To evaluate the performance of the different algorithms, a range of metrics were
    used, including accuracy, precision, and recall. The results showed that these
    algorithms are highly effective at finding patterns in the data and making accurate
    predictions about the existence of an exoplanet around a star, with accuracies
    ranging from 98% to 99%. The second model which predicts the type of exoplanet
    whether it is a Gas-giant, Terrestrial or other also achieved as satisfying accuracy
    of 84%. In addition, confusion matrices of various algorithms and a feature importance
    plot were used to provide a more detailed analysis of the performance of the algorithms
    and to understand which features or variables were most influential in making
    predictions. Overall, this exoplanet prediction model has provided a compelling
    demonstration of the capabilities of machine learning algorithms and the potential
    for these methods to revolutionize our understanding of the cosmos. The findings
    from this project have the potential to inspire new discoveries and breakthroughs
    in exoplanet research, and they demonstrate the power and potential


    *Corresponding author: divneet.singh.kapoor@gmail.com'
