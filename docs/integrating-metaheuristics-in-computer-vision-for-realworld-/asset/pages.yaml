  md: 'oxygen deprivation, low pH, and accumulation of waste or gases [3], while fast-growing
    tumor requires constant nutrition supply and gaseous exchange to maintain continuous
    cell divisions [3–5]. It is observed that tumor mass beyond 2 mm in size cannot
    grow without nutritional support [3]. This requirement of cancer is fulfilled
    by neovasculariture (formation of new vessel). Cancer neovasculariture is the
    formation of new blood vessel from preexisting vessel. The formation of blood
    vasculature is a rate-limiting step and hence a hallmark step in carcinogenesis
    [6]. Blood vessel formation is a comprehensive process with multiple steps that
    involves large-scale interaction between stromal and epithelial cells [6]. Angiogenesis
    is initiated in the preneoplastic lesion and subsequently support the tumor progression,
    invasion, and metastasis. Angiogenesis is controlled by vascular endothelial growth
    factor (VEGF), along with, basic fibroblast growth factor (bFGF), platelet derived
    growth factor (PDGF), and several other chemokines/cytokines, which are secreted
    by tumor cells as well as stromal cells [7–9]. In addition, angiopietin (Ang)–Tie
    system, Ephrin–Eph pathway, and Delta–Notch signalling pathways have key role
    in angiogenesis regulation [10]. Based on this observation, various VEGF inhibitors
    for the treatment of advanced cancer has been approved by FDA [11]. However, due
    to the acquired resistance against these therapies, effectiveness of therapeutic
    drugs is limited, thus, creating the idea of further deep knowledge of angiogenesis.
    Moreover, machine learning or artificial intelligence is a recently developing
    approach in biomedical field. Various different machine learning or deep learning
    tolls are currently in use for angiogenesis observation, biomarker evaluation,
    and prognosis calculation [12]. The current review article describing the angiogenesis
    process, its role in cancer growth and progression, mechanism initiation/regulation,
    in addition use of machine learning approaches in angiogenesis evaluation and
    prognosis.


    # 16.2 History of Angiogenesis Discovery


    The term angiogenesis was first to come into existence in 1787 by a British surgeon
    John Hunter [13]. Further, a study reported the vascular structure of tumors in
    the 1860s [14]. In 1907, a vascularnet was visualized in human tumor specimens
    using bismuth oil injections, and intra-arterial injections [15]. Then from 1930
    to 1940, several investigations began to determine molecular events in neovascularization.
    Ide et al. and Algire et al. in the late 1930s and early 1940s observed new vasculature
    formation “angiogenesis” in the tumor mass [14–17]. Then in 1982, Ziche and Gullino
    analyzed neoplastic transformation in in vivo and in vitro cancer models [18].
    Further, Brem and colleagues noted the formation of leaky capillaries in rabbit
    iris after human breast neoplastic lesion implementation [19].


    # 16.3 Overview of Angiogenesis


    Neovascularization is a complex phenomenon that involves multiple interactions
    between tumor stromal cells and tumor epithelial cells. Angiogenic “switch” is
    caused by hypoxia which the primary event and subsequently involves the release
    of several proangiogenic mediator (e.g., growth factors, chemokines, and cytokines)
    that stimulate endothelial cell activation.'
