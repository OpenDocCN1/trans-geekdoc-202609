  md: '# Comparative Evaluation of Machine Learning Algorithms for Bank Fraud Detection


    Kiran Jot Singh$^{1,2}$, Divneet Singh Kapoor$^{1,2*}$, Kunal Ranjan Singh$^3$,
    Chirag Kalucha$^3$, Gatik Alagh$^3$, Khushal Thakur$^{1,2}$ and Anshul Sharma$^{1,2}$


    $^1$Kalpana Chawla Centre for Research in Space Science & Technology, Chandigarh
    University, Mohali, Punjab, India

    $^2$Electronics and Communication Engineering Department, Chandigarh University,
    Mohali, Punjab, India

    $^3$Computer Science and Engineering Department, Chandigarh University, Mohali,
    Punjab, India


    # Abstract


    Digital fraud is increasing globally with the rapid surge in digital transactions.
    This makes every transaction through digital mediums prone to fraud, creating
    a significant problem on a global scale. Online payment frauds are estimated to
    cause the world economy to lose about 48 billion US dollars of e-commerce by 2023,
    and approximately 1.7 million people worldwide are affected by malicious digital
    banking frauds annually. The previous approach of using suspicious activity reports
    (SARs) to detect banking frauds has proven to be less efficient. To address this
    issue, a proposed solution is based on a classification model trained on a dataset.
    This model enables the device to differentiate between a fraud and a valid transaction
    by analyzing their domains and training knowledge. The selection of the classification
    model was made after a comparative evaluation of several models, with the most
    accurate and precise one used for final testing after training the model with
    the dataset. This solution is efficient, credible, reliable, and has an advanced
    mechanism, making it a true solution to this problem. Additionally, it guarantees
    end-to-end privacy and secure transactions.


    **Keywords:** Data science, digital transactions, digital frauds, data analytics,
    machine learning, comparative evaluation, global issue


    # 4.1 Introduction


    "You are caught up with a fraud!" The most horrific display your digital device
    can set forth to your eyes. The world of arising “AI” nails a setback that leads
    mankind to be cautious of these Digital frauds. Data Science can be seen as an
    umbrella term because it encompasses data mining, data analytics, machine learning,
    and other related disciplines. The growing demand and popularity of e-commerce
    nowadays especially after COVID times have been a source of open invitation for
    frauds to commence at a high level [1]. The over dependency'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'over online transactions have encouraged the black hat hacker to set new cake
    holes with advanced malwares. The craft of deceiving through a digital platform
    in order to generate money by forging the loss of an individual is what we call
    “as digital transactional fraud”. Poor governance of banks along with less prominent
    checks on system transactions is the key contributor of rising digital frauds
    [2]. Breaching of security in banking industry is also an explanation to the question
    why banking frauds exist and perspire. These projects withhold the dare to bring
    a revolution in the thinking process to develop security-based transactional system.
    This projects works in accordance of the enrichments of data science and machine
    learning algorithms, based on datasets training to devise a program that would
    distinguish between a fraud and legit transaction.


    The dataset used for the said program consists of 2,84,807 transactions made in
    a span of 2 days. This dataset has a total of 31 columns out of which only three
    columns are known to us, i.e., time, amount, class. The other 28, namely V1–V28,
    are kept confidential, and so what these parameters are for actually is kept hidden
    from the internet. However, it can be assumed to have confidential details like,
    transaction ID, transaction location, customer details, etc. The need for this
    kind of data exploration has arisen due to inefficiency of banks to keep the customer
    data refrained from any sort of mass data leakage, which is a prime cause of any
    sort of frauds [3]. After seeing the significant rise in the number of active
    frauds through online banking channels and understanding the need of prevention
    of money loss due to these unethical interfaces, efforts and security program
    were created as an initiative toward digital banking privacy, as said by Prof.
    Vikas Palekar and his team [4]. At present, banks are undertaking certain measures
    to combat the issue of digital frauds which include:


    +   a) Keeping a check on the working of their employees as surveys has proven
    that more than 70% frauds take place due to leakage of information given by the
    bank officials.

    +   b) Transactional monitoring which includes the concept of suspicious activity
    reports (SAR).

    +   c) Use of real time data enrichment tools that enhances the KYC data of customer
    which is obtained from open source database, digital services, and social networks.


    According to Hyder John and Sameena Naaz for detecting frauds in credit card system,
    machine learning plays an important role [5]. Digital banking fraud detection
    requires various elements of the Python language, such as dataset collection,
    dataset training models, libraries, and more. Banks are now heading up toward
    application of a security framework, which include encryption of transactional
    channels, two-step authentication technology, and using data analysis to secure
    banks business information. According to the research paper filed by Iftikhar
    Ahmad and his team, the given chart (depicted in Figure 4.1) shows the proportion
    of various solutions adopted worldwide for the solution of digital banking frauds
    [6].


    Providing wider area of research to these plots, were the main objective of the
    researches as mentioned in various research papers published earlier like the
