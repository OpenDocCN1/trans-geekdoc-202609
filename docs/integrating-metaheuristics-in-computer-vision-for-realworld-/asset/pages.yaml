  md: '**Table 13.1** A comparison of the key characteristics of nature-inspired algorithms
    versus classic optimization techniques.


    | Attributes | Classical algorithms | Nature-inspired algorithms |

    |---|---|---|

    | Candidate size | Single agent | Multiple agents |

    | Gradient | Popularly implemented | Less implemented |

    | Hessian | Frequently | None |

    | Runs | Lesser runs | Many runs |

    | Randomness | No use | Popularly implemented |

    | Selection | Always | Always |

    | Hyper parameter | Mostly single | Oftenly single |


    Based on a study of classical and nature-inspired algorithms, Table 13.1 provides
    a comparison of their primary characteristics and features [52].


    # 13.3.3 Self-Organized Systems


    A fascinating alternative perspective is to view any method as a self-organized
    system. The similarities between algorithmic features and self-organizational
    behavior are significant. Table 13.2 provides a comparison of algorithmic components
    and self-organizing systems. The two are also very different from one another.
    The path to self-organization, for instance, might not always be evident and sequencing
    is not crucial. However, for algorithms,


    **Table 13.2** The function or characteristics of nature-inspired algorithms.


    | Components or features | Role or properties |

    |---|---|

    | Population | Diverse population to avoid premature convergence, parallel processing
    |

    | Derivatives | Exploitation or intensification |

    | Randomization | Assists in avoiding getting stuck in local optima |

    | Selection | To improve quality of population thus help in the convergence of
    algorithm |

    | Elitism | Preserve the best solutions and assists in avoiding getting stuck
    in local optima |

    | Mutation | Introduce diversity by modifying the population |

    | Crossover | Create new candidate solutions helps to avoid local |

    | Iteration | Improve the quality of the population |'
