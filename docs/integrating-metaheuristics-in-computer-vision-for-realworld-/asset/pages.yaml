  md: '# 6.2.2.4 Backward Selection Algorithm


    The backward selection algorithm is a feature selection method that starts with
    a whole collection of features before eliminating them one at a time, iteratively
    [11], based on how they affect a model''s performance.


    The steps in the backward selection method are as follows:


    +   1) Initialization: Start with a complete feature set.

    +   2) Feature evaluation: To evaluate the model''s effectiveness, consider all
    the components.

    +   3) Feature selection: Choose the feature that has the least impact on the
    performance of the model. This might be achieved by deleting each part separately
    and comparing the model''s performance with and without the features.

    +   4) Model training: Train a model using the remaining set of features.

    +   5) Feature removal: Take the chosen feature out of the current list of features.

    +   6) Termination: Up until a stopping requirement is satisfied, repeat steps
    3 to 5. This requirement could be a minimum improvement in performance, a minimum
    number of features, or a limited number of iterations.


    Every machine learning model that can handle a variable number of features can
    employ the backward selection approach. It can be applied, for instance, to decision
    trees, neural networks, logistic regression, and linear regression. Moreover,
    it can be adjusted to handle features that are continuous, categorical, and binary.


    A potential issue is that the backward selection technique did not always select
    the best subset of features. However it frequently yields a decent approximation
    of the ideal subset of traits and is computationally effective. Another problem
    is that it could be susceptible to the choice of stopping criterion, as the model''s
    performance might not always get better as features are eliminated. To ensure
    the reliability of the findings, it is crucial to carefully select the stopping
    criterion and do sensitivity analysis.


    # 6.2.3 Embedded Method


    A feature selection method called the embedded strategy incorporates the feature
    selection step into the machine learning algorithm''s training process [12]. In
    other words, the algorithm is trained while the features are chosen, and the chosen
    features are then applied to the final model. This is in contrast to other methods,
    such as the filter method, which performs feature selection before training the
    model.


    There are various types of embedded feature selection methods, but some of the
    most commonly used methods are:


    +   1) LASSO (Least Absolute Shrinkage and Selection Operator): It is a regularization
    technique that modifies the model''s loss function by adding a penalty term. The
    model is encouraged by this penalty term to set the coefficients of the less significant
    features to zero, so choosing just the most significant characteristics.'
