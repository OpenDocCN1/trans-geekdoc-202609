    # 2.3.3.1 Image Processing Technique


    Image processing is a method for modifying digital photos to raise its calibre
    or glean valuable information from them. It involves analysing, enhancing, and
    editing photos using a variety of mathematical techniques.


    Image filtering is one example of an image processing technique that is used to
    eliminate noise or other undesired elements from a picture. This is commonly accomplished
    by applying a filter, which is a mathematical function to the pixels in the image.
    Image filters are classified into three types: low-pass filters, high-pass filters,
    and median filters. Low-pass filters soften a picture by eliminating high-frequency
    noise or sharp edges, whereas high-pass filters increase edges and other high
    frequency characteristics. Salt-and-pepper noise, which appears as white or black
    pixels randomly spread throughout a picture, is removed using median filters.


    Image enhancement is another image processing approach that includes increasing
    the quality or clarity of a picture. Several approaches, such as contrast stretching,
    histogram equalization, and colour correction, can be used to accomplish this.
    Contrast stretching is the process of increasing the range of brightness levels
    in an image in order to make it more aesthetically attractive. Histogram equalization
    is a technique for adjusting visual contrast by dispersing pixel values throughout
    the whole brightness range. Color correction is the process of adjusting an image’s
    color balance to make it look more natural and realistic.


    Another major image processing approach is image segmentation, which involves
    splitting an image into areas or items of interest. This may be accomplished through
    the use of several approaches such as thresholding, edge detection, and region
    growth. Thresholding is the process of separating an image into two or more regions
    based on a threshold value, whereas edge detection is the process of determining
    the borders between image regions. The process of growing regions entails recognizing
    areas based on their resemblance to nearby pixels.


    Overall, image processing techniques have a wide range of applications, including
    medical imaging, remote sensing, computer vision, and photography. They are critical
