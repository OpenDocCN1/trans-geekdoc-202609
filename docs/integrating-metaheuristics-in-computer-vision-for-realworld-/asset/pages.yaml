    \ $h$, and $\\epsilon$ represents the step size which varies over the course of\
    \ an iteration. \n\nThe optimization problem's form is determined by the direction\
    \ of the increment vector $\\Delta x_k$. If the vector direction is along the\
    \ negative gradient ($-\\nabla h$) then it will be a minimization problem and\
    \ if the direction is along a positive gradient then it will be a maximization\
    \ problem. \n\nIn order to minimize $h(x)$, this technique uses an approximation\
