  md: '# Fusion of Phase and Local Features for CBIR


    Pooja Sharma


    Department of Computer Science & Engineering, I K Gujral Punjab Technical University,
    Jalandhar, Punjab, India


    # Abstract


    In this chapter, content-based image retrieval is carried out using global and
    local features of images. The complete process is based on concepts of amalgamation.
    The synthesized features of Zernike moments magnitude and phase coefficients are
    applied to designate the global features of images with local features, which
    are obtained through histograms by considering distance of centroid of image with
    linear edges fetched using Hough transform. The processing speed is increased
    by incorporating efficient algorithms for the calculation of Zernike moments and
    Hough transform. Overall similarity among training and test images is computed
    using Bray-Curtis similarity measure, which provides normalized distances and
    helps upgrade the retrieval rate. The proposed method is capable of retrieving
    transformed images as well, i.e., the proposed system is robust to photometric
    and geometric transformations. The results of our comprehensive experiments establish
    the dominance of the proposed synthesized methodology over other similar methods.


    Keywords: Zernike moments, Hough transform, rotation invariance, precision and
    recall


    # 7.1 Introduction


    With the progression in the use of images both in the industry and academic world,
    researchers are encouraged to develop accurate and efficient methods to retrieve
    relevant images from large databases. The retrieval of images is rather depends
    on their visual contents just as in Google Lens instead of labor-intensive manual
    explanations. In an image, the shape of an object is considered to be a very important
    visual content rather than color and texture. The color features do not provide
    tangible human perception [1–3]. If a similar object has different colors, for
    instance, a ball’s color in the first image is red and in another image the color
    is blue, then both images will suppose to be two dissimilar images, although they
    are similar in shape. The texture features do not provide semantic information
    of the image. Hence, shape is counted a significant pictorial feature in entity
    recognition and retrieval.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The significance of shape based retrieval can be viewed by referring [4–7].
    Accordingly, in our approach to an effective image retrieval system we pay attention
    to shape based image retrieval. The research for an effective shape descriptor
    and similarity measure is the primary issue in image retrieval applications and
    one of the crucial aspects of a shape descriptor is to be robust to geometric
    transformations (rotation, scale, and translation) and photometric transformations
    (noise, blur, and JPEG compression).


    Various shape representation and matching techniques have been proposed during
    the past two decades. The shape based representation techniques are usually categorized
    into two classes, namely, contour based descriptors (CBDs) and region based descriptors
    (RBDs). The CBDs are more popular as compared to RBDs due to the fact that human
    perception is primarily consistent with the contour/outline of the shape. Besides,
    in some shape associated applications, the outline or shape of the contour is
    the only key interest while the innermost details are not obligatory. The contour
    based methods include curvature scale space [8], Fourier descriptors [9], histograms
    of centroid distances [10], contour flexibility [11], elastic matching [12], etc.
    However, some limitations exist with contour based methods. The first one is that
    the CBDs extract information only from the boundary of the shape and neglect the
    essential information contained in the shape interior region, which is more important
    in some applications. Second, CBDs are more prone to noise and variations because
    they exploit small part of image information, i.e., contour only. Third, in some
    cases the image contour is not available for instance, it is tedious to extract
    contour from texture images unlike trademark images. These limitations can be
    addressed by RBDs. The RBDs are more robust as they utilize all the shape information
    hence, they can be applied to all types of images including distorted and defected
    shapes, which is a common problem in CBDs. The region based methods include grid
    descriptor [13], generic Fourier descriptor GFD [14], Moment invariants and functions
    of moments [15–18], Zernike moment descriptors (ZMDs) [19], etc. Although moment
    based RBDs provide attractive characteristics for image retrieval, they do suffer
    from high computational complexity. Other types of RBDs include scale invariant
    feature transform (SIFT) [20], Histograms of oriented gradients (HOG) [21], and
    speeded up robust features (SURF) [22], etc. SIFT is based on the difference of
    Gaussians (DOG) and utilizes a circular window to search for a possible location
    of a keypoint. However, the image content in a circular window is not robust to
    affine transformations [36]. The HOG descriptor is based on SIFT and edge orientation
    histograms. The participation of global features in images is elaborated by Oliva
    and Torralba [23]. Apart from that image classification using convolutional neural
    networks is described in Ong et al. and Pathak et al. [45–47].


    CBIR using the combination of CBDs and moments based RBDs is found to be very
    effective. CBDs provide information regarding the local change in the boundary
    of an image and do not provide interior details of the image content. On the other
    hand, RBDs provide interior details of image content while less emphasizing on
    local variations in an image. Therefore, CBDs and RBDs are assumed to be complementary
    to each other with their own advantages and disadvantages. Thus, if both descriptors
    are combined, the performance of the image retrieval system can be improved as
    observed by Jain and Vailaya, Wei et al., and Qi et al. [24–26]. In the study
    by Jain and Vailaya [24], a synthesized approach to trademark retrieval in which
    histograms of edge directions are used to extract local features of images and
    invariant moments are used to extract global features. The descriptor is invariant
    to'
