  md: 'exoplanets and discover more about them. This might perhaps even lead to the
    discovery of Earth-like planets that might host life and help us better comprehend
    the diversity of exoplanets in the cosmos. Random Forest Classifiers, neural networks,
    and Self-Organizing Maps have all been applied to Kepler archived data for exoplanet
    detection. The employment of several machine-learning models offers an effective
    framework that can be modified and used to a variety of different large-scale
    surveys, allowing to reduce the total time spent in the target recognition and
    ranking phase of exoplanet discovery. Combining the results of many machine-learning
    techniques may improve forecast accuracy. The fundamental ideas of machine learning
    were applied to forecast the existence of exoplanets in a report published by
    IOP science. The Kepler Space Telescope’s light curves were used to evaluate five
    deep learning models. All models have accuracy levels of more than 98%.


    A random forest classifier was selected as the optimal machine learning model
    to categorize objects of interest in the Kepler Object of Interest table in a
    paper published by Southern Methodist University. The Random Forest Classifier
    scored 98% on accuracy in cross-validation. A better than 95% chance exists that
    968 candidate observations are exoplanets [11]. In a research published in Digitala
    Vetenksapliga Arkivet, Support Vector Machine (SVM) and Convolutional Neural Network
    (CNN) performance on a labelled data set including time series of the intensity
    of light from extrasolar stars is compared. In comparison to SVM’s recall of 0.800,
    CNN’s recall of 1.000 proved to be the best performing approach for the selected
    setups. With a precision of 0.769 compared to SVM’s 0.571 when the second validation
    parameter is taken into account, CNN is likewise the top performing algorithm.
    And in a paper published in The Astronomical Journal, Anne Dattilo and colleagues
    updated a neural network that had previously been used to recognize exoplanets
    in the Kepler field in order to be able to recognize exoplanets in several K2
    campaigns that exist in a variety of galactic environments. To determine if a
    certain potential exoplanet signal is created by an exoplanet or a false positive,
    they developed a convolutional neural network named AstroNet-K2. AstroNet-K2 has
    a 98% accuracy on the test set for identifying exoplanets and false positives.
    All of the preceding researches demonstrate the necessity and benefits of using
    machine learning for astronomy data, particularly to find exoplanets. A brief
