    targets usually include genetic targets, with several examples supporting this
    claim coming from GWAS. Millions of single nucleotide polymorphisms (SNPs) across
    the genome can be examined simultaneously by GWAS employing a hypothesis-free
    methodology, enabling a systematic analysis of the impact of particular genetic
    variants on a given trait. Numerous SNPs, trait, common, and complicated disease
    correlations, have been discovered by the GWAS; these relationships can be used
    to rank genetic discoveries and further pinpoint'
