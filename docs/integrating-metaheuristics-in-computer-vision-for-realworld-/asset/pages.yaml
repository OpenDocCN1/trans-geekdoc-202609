    \ solving four linear equations. It is still feasible to evaluate the polynomial\
    \ coefficients if the value of the function and its derivatives are available\
    \ at two points. The minimum point can be calculated by utilizing the polynomial\
    \ coefficients after approximating the function with a polynomial. \n\nThis search\
    \ method begins by bracketing the minimum of the function between two points,\
