    # 3.4 Applications for 3D Printing in Cells


    The adaptability and remarkable tissue engineering resolution of 3D bioprinting
    has

    sparked high hopes among scientists. This technology has already been used to
    produce

    various tissue types, such as skin, cartilage, bone, cardiovascular, liver, and
