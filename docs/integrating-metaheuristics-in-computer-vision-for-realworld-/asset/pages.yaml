    Figure 14.2 Percentage of different beats after up-sampling and equalizing the
    number of samples for each class.


    correspond to electrocardiogram (ECG) shapes of heartbeats for the normal case
    and the cases affected by different arrhythmias and myocardial infarction. These
    signals are pre-processed and segmented, with each segment corresponding to a
    heartbeat as shown in Figure 14.2 percentage of different beats after up-sampling
    and equalizing the number of samples for each class [8–12].


    The dataset is in the form of .csv files, and contains data from two datasets-MIT-BIH
    arrhythmia dataset and The PTB diagnostic ECG database.


    The MIT-BIH arrhythmia dataset has 109,500 samples with five categories/classes.
    These classes are “N”: 0, “S”: 1, “V”: 2, “F”: 3, “Q”: 4 and these stand for-


    +   0: "normal beat,"

    +   1: "supraventricular premature beat" 2: "premature ventricular contraction,"

    +   3: "fusion beats,"

    +   4: "unclassifiable/unknown beats."


    The PTB diagnostic ECG database contains around 14,500 samples and two categories/
    classes. This dataset contains information related to height, weight, gender,
    and age of patients [13, 14].


