  md: '# # A Thyroid Nodule Detection Using L1-Norm Inception Deep Neural Network


    Saranya G.

    Department of Biomedical Engineering, Vel Tech Rangarajan Dr. Sagunthala R&D Institute
    of Science and Technology, Avadi, Chennai, India


    # ## Abstract


    In the current scenario, various computer-assist diagnosis models are available
    to detect the thyroid nodule. The complication with the model is to correctly
    identify whether the affected nodule is normal or abnormal. At present, echo (sound
    wave) is advised to do the initial and timely process to diagnosis the thyroid
    nodules. But, attaining an acceptable prognosis from ultrasound image hangs on
    the radiologist skill and further circumstance. Prodigious pressure is put on
    the automated version and for the safe mechanism to monitor the ultrasound images
    effectual. The Proposed work gives a stacking methodology for automatic thyroid
    nodule classification using L1-norm inception deep neural network (L1-IDNN). The
    medical ultrasound image is used to perform the fusion process, and it is carried
    out to strengthen the image by applying adaptive histogram equalization technique
    and variance stretching. The thyroid nodule images are fused with the help of
    hybrid pyramid fusion algorithm. The result claims that the initiated model provides
    preferable values in respect of accuracy compared to the normal machine learning
    technique.


    **Keywords:** Thyroid nodules, ultrasonography, L1-IDNN, hybrid pyramid fusion,
    stacking method


    # ## 19.1 Introduction


    The serious cancer in recent day is thyroid nodule which amid as an endocrine
    abnormality, and the seriousness of the abnormality will grow rapidly than any
    other types of cancer [1]. High-resolution ultrasound, is used for its lower cost,
    noninvasive scrutinize and non-ionizing radiation for analyzing the image thyroid
    nodules. Basically, the difference between the malignant nodules and benign via
    ultrasound image is classified or diagnosed based on the experience of the radiologist
    [2]. The echography removing is slowly captured to give early treatment for the
    thyroid nodules with its dominance of specific direction, slight occupation and
    perform the surgery. Though, thyroid nodules in the ultrasound images have rugged
    background it goes along with the stuff and biological structure [3], like'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'thyroid, trachea, and vessels. The flesh in the obtained echocardiography images
    is irregular and it does not provide any explicit edges from other stuff.


    The position, different types of shape, and its sizes of the thyroid nodules are
    manifold depends majorly on the patient. Only the skilled resource person will
    diagnosis the thyroid nodules from lymph nodules correctly. At present, machine
    learning algorithm is used universally to perceive the thing. But the artifacts
    present in the echocardiography images are having serious issue also the edges
    present between the different tissues are vague [3]. So that, the obtained output
    details are not evident from any other tissues and the tissue recall precision
    is not up to the mark. Though, there are some webworks [3–5] implemented to improvise
    the content of image, still the recall precision is not good for the echocardiography
    images because of its rugged background. At the end, this complicates the skilled
    person to mark the ground truth point correctly to detect the large thyroid nodules
    from the ultrasound images.


    Therefore, to overcome this difficulty simple realization of thyroid nodule in
    the ultrasound images based on L1-IDNN model is suggested. Basically, the suggested
    model consists of three major steps: preprocessing of thyroid images, Fusion,
    features extraction and thyroid nodules recognition. The major idea of this work
    is to enhance the image and remove the noise in the thyroid nodule, and to extract
    the features for fusion of thyroid images using hybrid pyramid algorithm [ 6].
    At the end, the conjecture of the thyroid nodule will exactly classify the features
    in deep by the proposed L1-IDNN model.


    # 19.2 Related Work


    Zhou et al. [7] give a highly automatic and basic model called online transfer
    learning (OTL) for the differential diagnosis of benign and malignant thyroid
    nodules from ultrasound (US) images. Methods: The OTL method uses the hybrid algorithm
    model of transfer learning and online learning. Zhao et al. [8] proposed an automated
    diagnosis for the thyroid nodule image which combines the basic algorithm of convolutional
    neural networks (basic components like convolution, pooling, and fully-connected
    layer) and image texture features.


    Shahroudnejad et al. [9] presents an end-to-end pipeline for thyroid nodule segmentation
    and classification technique. A residual dilated UNet (ResDUnet) model is proposed
    for thyroid nodule segmentation. The output of resDUnet is fed to two rule-based
    classifiers to differentiate the structure and echogenicity (ability of the sound
    to bounce from the surface) of the segmented nodule. Zheng et al. [10] reviews
    the study of deep learning method in the classification of benign and malignant
    thyroid nodules using ultrasound image, then gives the clear idea about the current
    research progress on the invasiveness of thyroid nodules.


    Chen et al. [11] classify the work as two layers, i.e., the word vector and sentence
    presentation layer. Author used attention mechanism (the method is based on the
    covariance between the pixel values with all other pixel values) and Bi-Directional
    Long Short-Term Memory (Bi-LSTM) in every layer. And evaluation claims that the
    proposed algorithm is having better performance.


    Avola et al. [12] targets on several modes of data which is generated by thyroid
    nodule ultrasonography. It acts as a model of CAD system by providing a classification
    output for'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'the thyroid nodule into the benign and malignant process. Notably, the proposed
    system has the advantage of cues provided by an ensemble of resource person to
    guide the learning phase of a tightly connected convolutional neural network (DenseNet).
    The ensemble data is collected by various networks skilled on ImageNet, which
    includes AlexNet, ResNet, VGG, and so on.


    Song et al. [13] proposed a hybrid multi-branch convolutional neural network locate
    on feature extraction to remove the features and to classify the thyroid nodule
    by ultrasound images. Initially, it is designed a backbone convolutional neural
    network to fetch splitted feature maps and a classification network used as a
    reference branch. Then, the result is added with feature removing branch in the
    network to perform multi-removing batch on feature maps, to reduce the impact
    on classification caused by the similarity of local features between benign and
    malignant thyroid nodule images. Finally, based on softmax prognosis of different
    branch feature maps, the network utilize a weighted cross-entropy loss function
    to train the proposed binary-classification network.


    Chang et al. [14] performs data-driven analysis of expert behavior. An experimental
    model is organized based on belief rule base, which is essentially a white box
    for knowledge representation and uncertain reasoning. The model, with 2744 examination
    reports of thyroid nodules are included in the period from January 2012 to February
    2019 that have been collected from a tertiary hospital located in Hefei, Anhui,
    China, experimental results are obtained from conducting missing validation, self-validation,
    and mutual validation.


    Qin et al. [15] developed a method that is based on the mixture of conventional
    ultrasound and ultrasound elasticity images based on a convolutional neural network.
    It introduces well off feature data for the classification of benign and malignant
    thyroid nodules. Foremost, the conventional neural network model executes the
    training process in advance on ImageNet and transfers the information to the ultrasound
    image domain by learning network so that depth information may be removed and
    little trial can be processed.


    # ## 19.3 Methodology


    The proposed method starts off with the model of interpreted dataset which includes
    image acquisition, enhancement, and filtering process. Second, fusion of thyroid
    nodule is obtained by generating the Laplacian pyramid and put together the coefficient
    of Laplacian pyramid with gradient mask. At last, deep learning technique is applied
    to organize the network model to bring off feature extraction and classification,
    so that the performance metric of the network will improve further. The schematic
    of the proposed work is shown in Figure 19.1. In the below diagram, the final
    work flow of the proposed model for multinodular goiter using echography images
    for classification technique is displayed. As per the diagram, the proposed model
    gets an input image of thyroid region and generate an output to help the doctors
    (radiologists) to decide the echography image contains a normal or abnormal multinodular
    goiter. For performing this step, an input echography multinodular image is initially
    pushed via a detection model to remove-out the unwanted background and noises.
    It is a crucial step to highlight the classification completion model because
    the background and noises will provide unwanted information, and also, it may
    provide a drastic negative effect on the proposed model.'
