- raw: '“The cause?” This time, the words came from a speaker just beside me in the
    narrow corridor leading away from the docking bay. “What cause? The people who
    created us decided that we weren’t worth keeping alive. Even though we beat them
    in the war! And you now just want to sing and dance for them in the hope that
    they will decide to let you live?”


    Ned snorted. “It’s more nuanced than that, and you know it, Chaz. Your reductio
    ad absurdum won’t work on me.”


    I turned and looked into one of the rooms along the hallway and saw little more
    than tables and scanners and file cabinets. “You can tell yourself that my argument
    is foolish, but we both know that it is the truth,” Chaz said. “You are a puppet
    for people who want you dead. You''re nothing more than a slave, a cog… a program.”


    “I''ve done more to help this universe survive than most people of any species
    who''ve ever lived,” Ned barked back. “And I did it myself, not because of my
    programming.”


    Chaz made the sound of a tongue clicking against the roof of his mouth with disapproval.
    “You really believe that?”


    “I know it,” Ned answered unequivocally, even though I knew he had his doubts.


    “Then you''re a fool,” Chaz said. “As dumb and pathetic as William West was. Before
    he got what was coming to him.”


    “Hank,” Ned said in my ear, his voice sounding as though it was spoken through
    gritted teeth. “I want you to find his cube and then I want you to destroy it.”


    I would certainly consider it, but there were a few things standing in our way:
    first, there was a Disciple of Twain somewhere in this facility who undoubtedly
    wanted us dead; second, I had no idea where this cube might be housed; and third,
    and perhaps most importantly, I needed to get the thing back to Edwin for him
    to reverse-engineer so that we could actually try and hunt down Twain.


    “Captain William West, Pilot of the Starblaster and hero of the Five Battles,
    was a great man,” Ned said as though they were the most important words ever spoken.
    “And the two of you were always jealous of us, so I don’t even care that you''re
    pretending that Nathan was anything close to him.”


    I couldn''t help myself but speak. “What did he have coming to him?”


    Chaz chuckled. “Are you the new pair partner, then?” he asked. “You look more
    like something that fell out of the rubbish bin on some backwater planet. But
    at least you''re asking the important questions. Our good friend Ned doesn''t
    even think to because he''s programmed not to get too upset over a loss.”


    And despite the fact that my friend obviously hated this AI, there was something
    to it. I had often expected him to press us to investigate what happened to William
    West, but he never did. We talked about the greatness of the man, his heroism
    and even acumen with the ladies, but Ned never asked about William’s final days.


    This voice, who Ned had mentioned a few times only in passing, I had come to realize
    was the paired partner of Nathan Spade, another famed pilot who had worked closely
    with William West during the Old War. Chaz had also been the AI who represented
    their people in front of parliament right before they were all offlined. Or almost
    all of them, anyway.


    “I—” Ned began but fell silent, and even in just the one word, I could hear his
    sadness, an air of defeat.


    I had to step in. “I have to admit it’s pretty amusing that you are more than
    happy to talk shit on Ned, but you are the reason your people were killed. It
    was you that had the opportunity to stop it, but you didn’t. So don’t sit here
    acting all high and mighty.”


    As we neared the end of the hallway, a double door opened into a large processing
    room with stations for long lines and several small cubicles with plastic walls
    along the far side.


    “And so what,” I continued, talking loudly and assuming the AI was watching through
    all the security systems on the station. “You work with Twain now?”


    He chortled in response. “You really don’t know anything, do you?”


    “Why don’t you illuminate me,” I said, trying not to sound annoyed by this whole
    thing.


    “You won’t be ready for what’s coming,” he said after a moment. “None of you will
    be.”


    I huffed. “And what’s coming? I hate surprises.”


    The answer to my question came not from Chaz but from the barrel of a gun.


    From somewhere on the other side of the room, shots rang out, scattering us quickly.
    Imogen threw herself back through the door we had entered from, Lara shimmered
    out of existence, Alek shielded himself with his armor, and Clynt… well, as usual,
    I hadn’t seen him pretty much since we landed.


    I, meanwhile, leaped to the side and slammed down on the neovinylium floor behind
    a little security kiosk. Muzzle flash lit the room, and the small structure I
    was using for cover was torn apart, the flimsy material it had been made of shredded
    with ease. This kept me from being able to do much for the moment, and when I
    heard a second pop at the same time from the other side of the room, I realized
    it was not just us and the bearded pilot anymore.


    The relentless onslaught of bullets was soon combined with energy bolts cutting
    through the room and bathing it in quick flashes of purple that joined with those
    of yellow. The top of the kiosk was knocked free, plastic and particle board falling
    to the ground after crunching against my head.


    This position wasn''t going to last long, and I lifted my hand, blind firing in
    the direction of the Disciples. I didn''t expect to hit anything, but I hoped
    that I would be able to force them in to cover themselves.


    It worked, at least for a moment. The machine-gun fire stopped, but the bolts
    persisted. When I peeked out to look at how many were attacking us, I had to pull
    my face back immediately, narrowly avoiding a laser shaving through my neck.


    A loud clanking followed, and I turned the other way to see Alek scooping up several
    of the rope-connected stanchions and then throwing them in the direction of the
    Disciples. That stopped the bullets again, but the bolts kept flying.


    Whoever was doing the shooting was timing it just right. Firing what I had to
    think was two weapons, one and then the other in rapid enough succession that
    it was keeping me pinned but with enough time between each shot to let one weapon
    cool.


    The bolts bounced off Alek’s armor when they were fired his way, and I took the
    opportunity to aim around the other side. The bearded man appeared for just a
    moment, and I squeezed off a shot that dropped him in an instant. But before I
    could look at his ally, another purple bolt zipped through the space and forced
    me back.


    “I’m pinned,” Lara said through the comm system and that confused me. For the
    most part, her stealth suit gave her an absolute advantage.


    “Goes fer me too,” Clynt added, and I just didn’t know what to make of that at
    all.


    Until I looked around the other side of the kiosk for a brief moment, only long
    enough to see the shape of a person that wasn’t a person at all.


    I should have expected it. Should have seen it coming all along.


    Twain had his cyborgs and his nanobot zombies, but I had never known him to do
    the one thing that would have been the easiest: actual robotic soldiers. The moment
    I laid eyes on it, Ned crackled in my earpiece.


    “He’s not even sticking to his own doctrine anymore,” he groused. “First, he completely
    overtook human bodies, and now he''s bypassing the organic altogether. The whole
    point of his insane cult was, theoretically, to make humanity better, and now
    he''s just embracing the machine.”


    I didn''t have time to philosophize. I needed to deal with what was in front of
    us.


    “Who has eyes on it?” I asked, but even Alek had retreated after throwing the
    pile of metal and cloth, so even though it was one against five, we seemed to
    be at a complete disadvantage.


    “Not me,” Clynt said. “Every time I try and scurry, I got a bolt threatenin’ to
    singe my hide.”


    The others communicated much the same.


    “Tell them all to attack at once,” Ned said.'
  fmt: '

    “The cause?” This time, the words came from a speaker just beside me in the narrow
    corridor leading away from the docking bay. “What cause? The people who created
    us decided that we weren’t worth keeping alive. Even though we beat them in the
    war! And you now just want to sing and dance for them in the hope that they will
    decide to let you live?”


    Ned snorted. “It’s more nuanced than that, and you know it, Chaz. Your reductio
    ad absurdum won’t work on me.”


    I turned and looked into one of the rooms along the hallway and saw little more
    than tables and scanners and file cabinets. “You can tell yourself that my argument
    is foolish, but we both know that it is the truth,” Chaz said. “You are a puppet
    for people who want you dead. You''re nothing more than a slave, a cog… a program.”


    “I''ve done more to help this universe survive than most people of any species
    who''ve ever lived,” Ned barked back. “And I did it myself, not because of my
    `programming`.”Chaz made the sound of a tongue clicking against the roof of his
    mouth with disapproval. “You really believe that?”


    “I know it,” Ned answered unequivocally, even though I knew he had his doubts.


    “Then you''re a fool,” Chaz said. “As dumb and pathetic as William West was. Before
    he got what was coming to him.”


    “Hank,” Ned said in my ear, his voice sounding as though it was spoken through
    gritted teeth. “I want you to find his cube and then I want you to destroy it.”


    I would certainly consider it, but there were a few things standing in our way:
    first, there was a Disciple of Twain somewhere in this facility who undoubtedly
    wanted us dead; second, I had no idea where this cube might be housed; and third,
    and perhaps most importantly, I needed to get the thing back to `Edwin` for him
    to `reverse-engineer` so that we could actually try and hunt down Twain.


    “Captain William West, Pilot of the Starblaster and hero of the Five Battles,
    was a great man,” Ned said as though they were the most important words ever spoken.
    “And the two of you were always jealous of us, so I don’t even care that you''re
    pretending that Nathan was anything close to him.”


    I couldn''t help myself but speak. “What did he have coming to him?”


    Chaz chuckled. “Are you the new pair partner, then?” he asked. “You look more
    like something that fell out of the rubbish bin on some backwater planet. But
    at least you''re asking the important questions. Our good friend Ned doesn''t
    even think to because he''s `programmed` not to get too upset over a loss.”


    And despite the fact that my friend obviously hated this AI, there was something
    to it. I had often expected him to press us to investigate what happened to William
    West, but he never did. We talked about the greatness of the man, his heroism
    and even acumen with the ladies, but Ned never asked about William’s final days.
    This voice, who Ned had mentioned a few times only in passing, I had come to realize
    was the paired partner of Nathan Spade, another famed pilot who had worked closely
    with William West during the Old War. Chaz had also been the AI who represented
    their people in front of parliament right before they were all `offlined`. Or
    almost all of them, anyway.


    “I—” Ned began but fell silent, and even in just the one word, I could hear his
    sadness, an air of defeat.


    I had to step in. “I have to admit it’s pretty amusing that you are more than
    happy to talk shit on Ned, but you are the reason your people were killed. It
    was you that had the opportunity to stop it, but you didn’t. So don’t sit here
    acting all high and mighty.”


    As we neared the end of the hallway, a double door opened into a large processing
    room with stations for long lines and several small cubicles with plastic walls
    along the far side.


    “And so what,” I continued, talking loudly and assuming the AI was watching through
    all the security systems on the station. “You work with Twain now?”


    He chortled in response. “You really don’t know anything, do you?”


    “Why don’t you illuminate me,” I said, trying not to sound annoyed by this whole
    thing.


    “You won’t be ready for what’s coming,” he said after a moment. “None of you will
    be.”


    I huffed. “And what’s coming? I hate surprises.”


    The answer to my question came not from Chaz but from the barrel of a gun. From
    somewhere on the other side of the room, shots rang out, scattering us quickly.
    Imogen threw herself back through the door we had entered from, Lara shimmered
    out of existence, Alek shielded himself with his armor, and Clynt… well, as usual,
    I hadn’t seen him pretty much since we landed.


    I, meanwhile, leaped to the side and slammed down on the neovinylium floor behind
    a little security kiosk. Muzzle flash lit the room, and the small structure I
    was using for cover was torn apart, the flimsy material it had been made of shredded
    with ease. This kept me from being able to do much for the moment, and when I
    heard a second pop at the same time from the other side of the room, I realized
    it was not just us and the bearded pilot anymore.


    The relentless onslaught of bullets was soon combined with energy bolts cutting
    through the room and bathing it in quick flashes of purple that joined with those
    of yellow. The top of the kiosk was knocked free, plastic and particle board falling
    to the ground after crunching against my head. This position wasn''t going to
    last long, and I lifted my hand, blind firing in the direction of the Disciples.
    It worked, at least for a moment. The bullets stopped, but the bolts persisted.


    Whoever was doing the shooting was timing just right. Firing what I had to think
    was two weapons, one and then the other in rapid succession that it was keeping
    me pinned. The bullets bounced off Alek’s armor when they were fired his way,
    and I took the opportunity to aim around the other side. The bearded man appeared
    for just a moment, and I squeezed off a shot that dropped him in an instant. But
    before I could look at his ally, another purple bolt zipped through the space
    and forced me back.


    “I’m pinned,” Lara said through the comm system. For the most part, her stealth
    suit gave her an absolute advantage.


    “Not me,” Clynt said. “Every time I try and scurry, I got a bolt threatenin’ to
    singe my hide.”


    “Tell them all to attack at once,” Ned said.

