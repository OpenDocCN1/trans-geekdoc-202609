- raw: '“You pictured it incorrectly,” he said, and as I always did, I reminded myself
    that there was no malice in his words. He just said things the way he saw them.


    I pocketed the device. “And you said you had a location?”


    “I am sorting through a lot of data,” he said but was interrupted by a theatrical
    cough from one of his assistants. “My team and I are sorting through a lot of
    data, and I believe we will have many locations shortly, but I''ve seen mention
    of one in several recent records and believe it will lead you to something.”


    “To what?” I asked, excited to have my first lead on taking down Twain in a long
    time.


    His brows lowered slightly. “I don''t know. That''s why I said ‘something.’”


    “Oh,” I said, my enthusiasm dampening somewhat. “Where''s the planet?”


    “It is as of yet unnamed and quite far from here in a nearly unexplored sector,”
    he answered. “This means quite a lot of travel time for you, and a lot of fuel
    expended, but I believe that Doctor Charles Forks will be able to help with that.”


    I smiled that the risk might have paid off. “You got a chance to meet him?”


    “I just stated that his research will be able to help, and you know that he was
    brought to this facility,” Edwin said. “Could you not extrapolate from the context
    that I met him?”


    Breathing in through my nose, I took a slow inhalation. “I could,” I said. “I
    guess what I meant to say was that you vetted his scientific method, and it seemed
    sound?”


    “Oh yes,” Edwin answered. “I had read one of his research papers in the course
    of my own work and knew him by reputation. Though I cannot imagine living the
    way he did.”


    As someone who had seen the rock he used to live on, I found that a bit laughable,
    but I didn''t say anything.


    “I’m happy to hear that you believe he will be able to contribute to our cause,”
    I said. “I take your opinion as gospel.”


    “As well you should,” he said. “I believe that given time and resources, Doctor
    Forks will be able to accomplish something rather remarkable. Naturally, I will
    aid him in his efforts.”


    I wanted to joke that it was probably just so that he could put his name on the
    discovery as well, but I knew better.


    “I suppose I should ready the crew and get some barrels on the Buzzard,” I said.


    Libby spoke for the first time in this conversation. “The Peacer maintenance crew
    is seeing to the Buzzard as we speak,” she said, and just as I was about to comment
    on the fact that she had said it so plainly, she added, “because I’m a boss ass
    bitch who anticipates your needs. Whoo woot!”


    The second part caught me so off guard that I couldn''t help but laugh. “There
    is just nobody else in the universe like you,” I said, and I really meant it.


    “I know it,” she answered. “Also, can you tell me something good?”


    I raised an eyebrow. “Something good?”


    “Yeah, like a fun anecdote or something?” she said. “Because Lara and Ned are
    both running for mayor of Bummertown, USA.”


    “What happened to Lara?” Ned asked.


    I looked down at his cube. “Zenobia was killed, probably by a trapper, and we
    believe that is also who knocked us out of the sky.”


    “And she believes there is a causal link between her actions and what happened
    to her friend?” Edwin asked.


    “Yes,” I said. “And she is just generally sad about it as well.”


    Though it felt like trying to explain emotions to a mung bean, I had to add that
    last part.


    “Sadness is an appropriate reaction to loss,” Edwin said.


    I didn’t have anything to say to that, but Ned spoke. “That’s so hard,” he said.
    “But I think that, at least, we have one another at a time like this.”


    “It’s true,” I said, no longer even thinking it weird that a person and a computer
    program could be feeling the same way about the same thing.


    It wasn’t even that long ago that I thought all AI was extinct, and here I was,
    just a short while later, equating the loss a person was experiencing with that
    of a computer program. Of course, that program also seemed to be going through
    an existential crisis at the moment, so it seemed like anything was possible.


    “Edwin,” I said, looking at him as I stood. “Great work as always.”


    He nodded.


    “And Ned,” I said. “I’m sorry, but Chaz is too valuable an asset to waste when
    we have literally no other leads.”


    “I understand,” Ned said. “But that doesn’t mean I have to like it.”


    “Of course it doesn’t,” Edwin said. “Comprehension and enjoyment are entirely
    unrelated.”


    I grabbed Ned’s cube and then excited the room, thrilled with all the work Edwin
    had done but also happy to be leaving his lab. The man exhausted me, and after
    everything in the last day, I was running on fumes.


    Though I had slept some the night before, I felt as though I could crawl into
    my bunk and sleep for several days.


    Of course, that was not possible, and I had to get a move on.


    Passing the mess, I saw Alek and Imogen sitting and chatting over some mugs of
    what looked like hot chocolate. I stopped in to tell them the news, both good
    and bad, and they stood, muttering something about how we had left like thieves
    in the night.


    “Sorry,” I said. “We had to get to the Conclave as quickly as possible and didn’t
    have time to check in.”


    “You don’t owe us anything,” Alek said, but Imogen was wearing a bit of a pout.


    I looked right at her. “We’ll let you know next time.”


    “Good,” she said. “I’ll be at the Buzzard soon.”


    Alek nodded, and the two made their way to gather their things. As I stepped out
    of the room, Clynt appeared in front of me, and I nearly jumped out of my skin.


    “Where we headed?” he asked.


    “The edge of the known universe, pretty much,” I said.


    A little grin appeared on his face. “Sounds like one helluva good time.”


    I shrugged. “Guess there’s only one way to find out,” I said, but he was gone
    by the time I next blinked.


    I made my way and knocked on Lara’s door. She opened it a moment later, and I
    let her know what was going on, but she just met me with a blank expression.


    “I think I’ll sit this one out,” she said, and I usually respected anyone’s decision
    in this kind of thing, but I blurted without thinking. “No.”


    “No?” she asked, not so much offended as surprised.


    Now I just had to stick with it. “You said that you wanted something to do,” I
    reminded her. “And this is something to do. Sitting around here and thinking about
    returning to the Conclave to get in people’s faces isn’t going to do anyone any
    good, but we need you out there. We have no idea what we are heading into, but
    I know that we will be a lot more prepared with you by our side.”


    She looked as though she was going to protest but then just said, “It sucks that
    you know me so well because I’m pretty sure that’s exactly what I would have done.”


    “I know,” I said with a little smile, and the two of us made our way right back
    to the docking bay where the mechanics were refueling and patching the ship.


    “Bet you wish you were with them,” she said, patting me on the back.


    I looked at them working and had to admit that just doing some repair work for
    a few hours did sound pretty good. But, instead, I just said, “I’m doing something
    just as fun.”


    “Liar,” she said with a laugh as we boarded the ship and made our way back to
    the cockpit.


    Once the mechanics were clear, we fired up the engines, and Ned set the course.


    “Lara,” he said as the placemags disengaged and the ship lifted off the dock.
    “I’m so sorry for your loss.”


    “We all are,” Alek said, and Imogen reached out to rest a hand on Lara’s shoulder.


    My old friend nodded, her eyes growing wet but refraining from crying. “Thank
    you all,” she said. “And, Ned, sorry that you had to find out what happened to”—she
    paused for just a moment—“Captain William West, Hero of the Five Battles and Captain
    of the Starblaster.”


    She said it in a respectful and dignified tone, and Ned just said, “Thank you.
    That really means a lot. Though it sucks that it happened and I really wish that
    I had a body so I could put some hurt on some Disciples of Twain.”'
