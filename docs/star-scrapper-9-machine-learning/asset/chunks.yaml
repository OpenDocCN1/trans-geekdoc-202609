    \ we now have reason to believe that it's where they take kidnapped civilians\
    \ to convert into Twain’s automatons. It would be absolutely unconscionable and\
    \ in violation of universal law to board a ship.”\n\n“Maybe I need to start going\
    \ out with you guys in the field. I could bring Armond, and we could be the sexy\
    \ sideicks.”\n\n“I would hardly qualify a metal cube and robot arm as ‘sexy sideicks,’”\
    \ Ned said with a chuckle.\n\n“Ugh, you could put some knee socks and pigtails\
    \ on the cube,” Libby said.\n"
