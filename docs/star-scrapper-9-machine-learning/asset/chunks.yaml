  toc: []
- raw: 'In addition to the fact that he could move much more quickly than we could
    and fight with brutal skill, we would also get tired. The three of us had been
    in several fights leading to this moment, and our bodies were exhausted and wounded.
    Meanwhile, we were fighting against an enemy made of machines. They would never
    wear out or slow down or make mistakes. They would, however, take advantage of
    any miscues.


    Lara and Imogen both swung in what looked like a simultaneous movement but that
    the Inquisitor was able to deflect back and forth.


    His movement was fluid and powerful, and both of them looked as though they might
    lose their grips on their weapons.


    He punched Lara when she tried to come at him, swung his blade at me to keep me
    back, and nearly kicked Imogen again, though she avoided the strike this time.


    As we continued to depress our attack, I realized that it was truly us who were
    on the defense.


    There was not going to be a way for us to win this fight, and that realization,
    albeit brief, gave me just enough pause for John Gregory to take the advantage
    and move with a stab toward my chest.


    The blade crackled against my armor but didn''t pierce it all the way through.
    Though the force of the hit sent me stumbling back, and the gravel under my feet
    gave out, causing me to crash to the ground.


    He pressed his advantage, shoulder charging Imogen, who took the red armor to
    the nose before being sent back into the grass again. The flames were now starting
    to grow all around us as a fire spread, black smoke mixing with the gray fog and
    darkening our world even further.


    Lara moved in quickly, but now that it was one-on-one, even she was no match for
    the mechanized monstrosity.


    She protected her body from the flurry of attacks but was being forced back.


    As I got to my feet, I heard Ned in my ear. “Do as I say. All of you.”


    I nodded, knowing that he could see through the camera mounted on the side of
    my head.


    Imogen pulled herself back onto the road just before the flames consumed the spot
    where she had been thrown. All around us, fire roared up, beginning to consume
    the trees as well.


    “Lara,” Ned said. “Overhand attack, now.”


    She did as she was instructed.


    “Imogen, cross body,” he commanded.


    “And Hank, thrust.”


    We followed his commands, and soon our attacks were actually doing something.
    With Ned controlling us like characters in a video game, Twain was not able to
    stop us. It was computer versus computer, with human bodies doing the actions.


    “Now,” Ned would shout, and one of us would move. Then the other would follow
    his command.


    Imogen was able to cut at his arm, Lara struck at his leg, and I impaled him in
    a gap just below his armor.


    The battle had become more even, but we were all beginning to tire, and I didn''t
    know how much of the damage we had done was actually slowing the Inquisitor down.
    The microscopic machines within him would have to distribute themselves differently,
    hurrying to deal with the wounds we were causing. But this was only deterring
    him slightly.


    Meanwhile, every counterattack and move that he was able to make on us was hard,
    and between moves, I found myself panting for air, sucking in smoke, and feeling
    embers burning against my flesh.


    “Thrust!” Ned commanded.


    I did, piercing him just under the arm in the gap of the armor.


    “Now, Imogen!” Ned shouted and she buried her mace in his chest.


    “Lara!” Ned screamed desperately.


    She swung her blue blade, cutting his hand clean off and sending his sword falling
    to the path.


    Ned’s voice was somehow hoarse as he bellowed, “Skewer him!”


    Lara sank her blade into the opening at his neck, forcing him to his knees.


    “Do it!” the AI shouted, but I forced a word from my mouth.


    “Wait.”


    24


    ![](OEBPS/image_rsrc3N4.jpg)


    I pulled out the little rectangle, walked over to the Inquisitor, and then pressed
    the button.


    I didn’t know what this would do, but I wanted to find out. I wanted to see if
    I could get information before destroying the body of John Gregory. I also wanted
    Twain to know that I could turn his people.


    It was petty perhaps, and possibly even foolish, but I was tired of him believing
    that we were idiots who he would be able to defeat with ease. I wanted him to
    respect us and understand that this fight was not going to be the cakewalk he
    might believe.


    After pressing the button, I watched John Gregory’s face contort and pull, strain,
    and twist. His eyes shifted around. The man had awoken from a nightmare, the likes
    of which no one had ever known. He was being kept some version of alive by the
    bots, but he had also been killed and then used.


    His eyes flashed to Imogen.


    “You,” he growled, the flames reflecting in his dark eyes. “I should have known
    you were behind this.”


    “You should have,” she answered, shifting the mace so that she could get closer.
    “You should have known that I would come and finish what I started. Again.”


    “I always knew you were rotten,” he said. “From the moment your parents thrust
    you upon me, I knew. The pathetic, whiny little thing that you were would never
    be strong enough for the work.”


    “I was strong enough to kill you,” she said. “Cut that head full of poison clean
    off.”


    He smiled at that, shifting a little but held in place by the weapons buried in
    him and his armor.


    “Any strength you had is a reflection of me,” he said with pride. “I took a pathetic
    little weakling and shaped you into something better. Something greater. Something
    worthy.”


    Imogen swallowed hard, the words seeming to hit her like a punch to the gut. “I
    was always worthy,” she said. “I was always more than any of you people thought.
    My parents never understood, the Inquisition never understood, but I have always
    been strong.”


    She spoke with such conviction that it left little note that she believed every
    word she said. After all this time, all the damage that had been done to her by
    everyone in her life, she seemed to finally believe that she was the powerful
    young woman that I had come to know.


    “Anything good that you are is because of me,” the Inquisitor stated.


    “No,” she said. “Everything that I am is in spite of you. In spite of those people
    who raised me. I had to survive all of you to become what I am. And now, this
    rotting carcass held together by machines will die at my hands.”


    Something about the words seemed to change John Gregory, and he shifted again,
    trying to get himself free. I speared him through the gut to keep him in place.
    Though I was certainly going to allow Imogen to have her moment, I did actually
    want to elicit information from the man.


    He looked down at himself as best he could, raising his one good hand to see the
    necrotic flesh. “What am I?”


    Imogen let out an evil cackle of pure delight. “You''re everything that you hate,”
    she hissed. “Your Mortal Coil was snuffed out, and the Enemy AI has taken you
    for a joy ride. Rather than letting you rest in pieces, Twain put you back together
    and made you the exact amalgamated abomination that you hated most. You are a
    monster worse than anything you could have conceptualized.”


    She was having fun now as he looked disgusted and mortified. “Twain used you—hacked
    your brain so that you would do his bidding. You led your own Inquisition to commit
    murder against pure organic beings at the behest of your machine master. You''ve
    done everything that you swore to defend the universe against and betrayed the
    very people you were supposed to protect. You are the confluence of man and machine
    made manifest.”


    The sound that came from the Inquisitor''s mouth then was like nothing I had ever
    heard before. It was an animalistic, horrible noise that I knew would haunt my
    dreams for the rest of my days.


    John Gregory was as miserable a creature as had ever existed. The evil within
    him had been turned back on him, and now he saw what he had become.'
