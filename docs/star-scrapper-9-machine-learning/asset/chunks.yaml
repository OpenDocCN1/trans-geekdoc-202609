    \ freeing her from the life of an Acolyte. With her help and some shipping manifests,\
    \ they might just be able to track down Extinction.\n\nRebel Intelligence:\n\n\
    Imogen offers to exchange information and political connections for Hank’s help\
    \ getting her family off of the Consortium capital planet of Emortium. Though\
    \ Lara doesn’t believe they can trust the former Inquisitorial Acolyte, Hank agrees\
    \ and after getting a ship from a Vekrass gangster, they sneak onto the planet\
    \ to help Imogen’s aunt.\n\nThe crew find Louise and her husband and get them\
