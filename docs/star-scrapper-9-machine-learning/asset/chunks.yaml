    “He didn’t say, but it sounds serious,” Libby said. “It’s honestly kinda cute
    how much he cares about you.”


    Before I could say anything, she added, “Sorry, Hank.”


    “It’s fine,” I said, mostly believing that. “I’m sure it’s work-related.”


    “You’re probably right,” Libby said. “The work in his pants!”


    It was so ridiculous that I couldn’t help but laugh.


    “See what I did there?” she asked excitedly. “I was talking about his penis.”


    “We got it, Libby,” Lara said as we stepped into the command center. “Put me through
    to Mane.”


    A moment later, the famed bounty hunter was on the screen at the center of the
    room.


    “Lara, I am thrilled to see that you are still alive,” he said excitedly, then
    his eyes seemed to move slowly up and down the screen. “Though you look a little
    worse for wear. Still hot though.”


    “Mane!” she snapped. “Why did you call me?”


    He raised an eyebrow suggestively. “What’s it worth to you?”


    Lara took a calming breath. “Mane, you called me to tell me something, and now
    I would like to know it without having to jump through hoops.”


    He seemed to consider his options before finally saying. “I was having dinner
    with my friend Carn to discuss my future and the likelihood of my joining the—”


    “Is any of this relevant to what we are discussing?” Lara asked impatiently.


    Mane laughed, a broad smile on his face. “I suppose not, but I do rather enjoy
    talking about it.”


    “What did you overhear?” Lara asked, though it sounded much more like a demand.


    “The trappers are after you,” he said.


    Lara leaned in close to the camera. “What do you know?” she asked. “And what do
    you mean they are after me? They are an official part of the Conclave. Are they
    playing at some politics? Trying to ruin my reputation?”


    “No,” he answered, voice growing heavy. “I believe they plan to do you harm.”


    Lara shook her head in astonishment. “That can’t be,” she said. “It goes against
    everything our code stands for. You have to report them.”


    “I considered that,” he said without any of his normal bravado. “But I decided
    against it.”


    “Why?” Lara demanded, all righteous indignation.


    He didn’t answer for a moment. “Because of the politics you were just discussing.”


    “This goes beyond politics,” she said. “This is a violation of our beliefs.”


    Mane chuckled pointedly. “Everything about the trappers flies in the face of how
    the Conclave is supposed to act,” he said. “But that doesn’t mean we rush in.
    We have to play this smart, or the people who are behind it all will wriggle away.”


