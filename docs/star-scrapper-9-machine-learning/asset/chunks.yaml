  trans: '


    “也许这能帮我们找到格雷高里，”我说。


    但伊莫根丝毫不动摇。“不，”她再次说道，“我不会让那种东西再靠近我半步。我甚至不想再回到那艘船上，但我会回去的。尽管如此，”她指了指地上一堆皱掉的审判者制服，“我再也不了。”


    “这就定了，”我说，示意我们登上`Mortal Coil`（凡尘缘）号。


    拉拉毫不犹豫地走了进来，但当她的一脚踏在跳板上时，我看到了伊莫根的脸色。我走上她身边，伸出手让她扶着我。


    “不，”她说，“我需要自己走。”


    “好吧，”我说。


    “这只是一艘船，”她低声说道，显然是在对自己说。“无非是一些零件和碎片而已。”


    我没有再说什么，只是站在那里提供精神支持。伊莫根在父母强制她加入审判院后，曾作为约翰·格雷高的追随者坐过这艘船，而在她试图攻击审判者失败后，她又是以囚犯的身份待在上面的。毫无疑问，她在这艘船上的回忆比宇宙中任何其他地方都要糟糕得多。


    “这只是一艘船，”她再次说道，向船内又走了几步。


    她的目光闪过一个小角落，那里似乎摆设了一个看起来像小祭坛的东西。


    “他以前让我在那里跪着，”她说。“好几个小时，我必须一直等在那里，膝盖抵着金属地板，要么在读某些文本，要么思考他的问题。这些都没有任何意义。这一切都不重要。那全都是他自私自利、自以为是的的废话。但我会跪在那里思考这些事。”


    “你真的会思考吗？”我问，试图把她从那段她似乎要沉迷其中的记忆中拉出来。


    她眨了眨眼，然后看着我。“你什么意思？”


    “你是真的在思考他的问题，还是坐在那里数着时间，想着你有多恨他或你的家人，或者只是在想某部老节目？”我问道，尽量让自己听起来很随意。


    她简短地看了那个角落。“显然是第二种。”


    “我早就知道了，”我说，按下激活跳板的按钮。


    声音让她畏缩了一下，我看着她看着跳板关闭，就像一扇牢门关上。


    “抱歉我们不得不这么做，”我说。


    她深吸了一口气。“没事的，”她说。“看来现在每个人都在与过去的幽灵作斗。”


    内德笑了起来。“她是对的。她怎么比你年轻这么多，却又明智这么多？”


    “我想只是运气好，”她说。我很惊讶他竟然向我们两个传达了这种想法，因为他平时似乎只对我一个人冷嘲热讽。


    我向前走了几步，等着伊莫根是否也这样做。她确实这么做了，一边走一边审视着一切。当我们到达牢室时，她停下脚步，透过栅栏看向里面的小长凳。


    “当他把我囚时，这并不是我第一次待在这里，”她说。


    “哎哟，”内德说，我不确定他是不是只对我说的。“这家哥在冰窖里坏透了。”


    她的手抚过栅栏。“他把我关在这里不仅是为了惩罚我，也是为了提醒我我还活着。‘痛苦是人的本性，”他总是这样对我说。他想表达的观点是，我们人类会痛苦，而机器不会。现在我见过了一些`AI`，我知道那是多么虚假。内德和卡西奥珀娅此刻的痛苦似乎和拉拉失去亲人的痛苦一样。


    “这是事实，”内德说。“并不是要削低拉拉的损失。”


    “甚至这种礼貌，”伊莫根说。“对你朋友的关怀。这是约翰·格雷高永远无法理解的东西。他不仅不懂程序可以做到，他自己也不懂如何做到。他太执迷于消灭`AI`，以至于失去了所有让他成为人类的特质。”


    我思考了片刻。“那是假设他曾经拥有过那些东西。也许他只是天生就是坏的。这些`AI`被程序化得像我们一样，连缺点也完备，但并不是所有人从那种意义上都是真正的‘人类’。有些人天生就带着那种邪恶。”


    “特恩呢？”伊莫根问。“他到底是什么？”


    这让我停顿了一下。我不知道答案。“内德，”我说，走进舱室，伊莫根慢地跟在我身后。


    内德叹了口气。“我不确定，”他回答道。“我的意思是，在战争期间我们甚至没被告诉他叫特恩，只说是‘敌人`AI`’。我们几乎没有关于真实敌人的任何信息。”


    “这看起来像是你们应该知道的事情，”伊莫根说。“应该去研究和学习。不仅是为了击败他，更是为了防止像他那样的`AI`再次出现。”


    “没有人从中中学任何东西，那根本算不上是什么教训，”我补充道。


    这种时刻，我希望内德有一张脸能让我观察他对我们话的反应。他们把他程序得很好，可以通过音效和语调来表达情感，但如果没有分析面部表情的能力，确实丢失了什么。


    “仅仅因为我没有获得这些信息，并不意味着信息没有被收集，”内德说。


    伊莫根走进房间，目光扫过里面的一切。“如果被收集了，我会知道的……可能吧。”


    “认为财团一直拥有`carte blanche`（特权）吗？”内德问道。


    她露出了不信的表情。“噢不，”她说。“但审判院被赋予了在宇宙中到处乱行的`carte blanche`。”


    “你们也是，”拉拉补充道。“当我们遵守宇宙法时，审判院被赋予了随心所欲的`carte blanche`。”


    “有趣的是，`carte blanche`这个词在成型之前有很多定义。它始于字面意思‘白纸’，是一个军事投降术语，类似于白旗，”他开始说道。


    “在这艘船上我已经受够教训了，”伊莫根打断道。只要我们还在`Mortal Coil`号上，她就会很痛苦，所以我认为越快离开越好。


    拉拉坐在副驾驶席上，所以我坐到了她身边。


    “我猜你更倾向于自己来驾驶？”我问伊莫根，但她已经坐在了从墙上折出的椅子上，并用一个眼神作为回答。


    我再次启动了，有些指示器显示`placemag`腿受损了。但正如我之前确认过的那样，她依然可以飞行。


    “这感觉就像在噩梦里，”当我让飞行器离开舱底时，伊莫根说道。“即使是声音也让我感到反胃。”


    “泽诺比亚总是说，痛苦的记忆是好的教训，”拉拉补充道。“这个地方对你来说可能是一个噩梦工厂，但它带领你来到了这一刻。”


    伊莫根看着我的老朋友。“她听起来是个聪明的女人，”她过了一会儿，“我很想见见她。”


    拉拉笑了。“她会喜欢你的，”她说。“你从不示弱，会刺死任何你认为坏的人……这正是她会回应的事。。”


    “谁知道呢，”伊莫根说，“也许如果我是由她这样的人带大的，我就不会这样了。也许我会变得更好。”


    拉拉看着那个盯着地面的年轻女性。“伊莫根，”她说，引起她的注意，“你现在的样子就很棒。这是我的观点。没有你，我们什么也做不到。”


