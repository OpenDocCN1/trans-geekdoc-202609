  trans: '

    “千万别告诉他是我告诉你的，”我说，“但他是我见过的最了不起的窃偷，如果他说他能办到，他就一定办得到。”


    那架飞行攻击载具越过了围墙，它前方的双装机枪在越过障碍物边缘时就开始开火。其中一辆探测车在密集的火力网下爆发了一熊火焰。


    但随着飞机继续升起，它以一种不自然的角度倾斜着，机头低垂并持续射击，但这些子弹落在了它们自己的防御火力上。墙上的卫兵尖叫着，挥着手，那只飞鸟不断向他们倾泻子弹。


    显然，这艘船被系住了，飞行员们以为只要加大力度就能挣脱，但实际上，他们是在射杀自己的人。三角形攻击载具的涡轮发动机对着 `Clynt` 所使用的某种东西剧烈轰鸣，最终挣脱了束缚，那东西逃之而去，冲向了前方激烈战斗的上空。


    “该蛋，”女孩低声抱怨道，但她的失望并没有持续多久。它一挣脱出来，也拉断了部分内部机械，那只飞鸟瞬间向地面坠落，在撞击地面的瞬间便炸成了碎片。


    年轻女子在消逝星光的光芒下，惊讶地转身看向我。


    “正如我所说，他很厉害。”我耸了耸肩。


    我们转身朝大门冲去。


    # 9


    ![](img/image_rsrc3N4.jpg)


    当我们靠近那堆冒烟的金属时，我们看到大门的大大部分被炸开并向后弯曲，我们我们可以挤过去。它并没有完全把大门从合页上炸掉并让它打开，让我们能像我们希望的那样开车通过，但这足够让我们开始对设施本身发动入侵了。


    更多的探测车绕过那架着火的飞机残骸，在门旁停下，与我们一起冲了进来。


    只有两名卫兵在检查大门的损坏情况，我们在进入时令他们措不及防。他们抬起头，看到我们后举起武器，随后被我能量武器射出的两击击毙。


    其他卫兵正在四处奔寻找位置，我看到更多从矿井内部匆忙冲出来的人并被递了武器。非常短暂地，我对自己射击他们产生了一丝怀疑，知道他们某种程度上只是在履行职责。但在他们开始向我开火的一秒，我便消除了这种顾虑。


    女孩和我躲在掩掩护，在一堆厚实的板岩后占据了位置，这些板岩与表面其他部分的区别在于它们似乎长出了植物根。我只有极短的时间看了一眼，但它看起来依然引人注目。这家公司正在竭尽全力地迫使这些人陷入一种无法自拔的境地。


    与此同时，上方城市的人永远不会接受他们或接纳他们。这里的人，这些“面具者”，实际上只有两个选择：留在这里饿死，或者在没有财力支持的情况下前往一个未知的世界。


    这是宇宙中一个微不足道的小问题，但它代表了 `Consortium`（联合财团）中发生的所有错误。这里没有问责机制，人们正在遭受伤害。鬼，我甚至不知道这个星球的
    `Sectoral Governor`是谁。


    我在想 `Ned` 会如何看待这一切。想他看到我们正在为这些人做正确的事，并试图帮助他们反击，他会有多高兴。


    我旁边的一堆板岩在被散弹枪击中时炸开，这抹除了我脑中所有的其他考虑。在真正处理掉这些防御者之前，我们无法帮助任何人。


    当我转头看向矿工们占据的位置时，一道紫色的电光击了我几秒钟前我头所在的位置。完全出于本能，我将武器指向射击来源的墙并还了击。


    那里只剩下少数防御者，由 `Lara` 进行清理，探测车向上射击，它们自己的飞机在坠毁前已经在它们的防御中撕开了一道缺口。但留下的人仍在顽战，我不知道我们自己的人幸存了多少，但看到进入矿井战斗的人寥寥无几，我不认为人很多。


    即使他们今天赢了，那也将是惨胜。


    两名女性拿着我下午刚刚修理过的步枪——尽管那感觉像是一辈子以前的事了——冲到了我们身边。


    “他们人多得要，”其中一个女人说，脸上满着泥土和血迹。


    我从岩堆上方看了一眼，看到矿工们在油桶、推车和托盘后就位。但我也能看到他们的恐惧。有些人很坚定，但大多数人很害怕，不想待在那儿。


    “先瞄准卫兵，”我指示道。


    再次快速向外看，我看到只剩下几个人，也许四个。


    “并且盯着任何朝你们射击的人，”我继续道，“如果你看到枪口闪，就知道该往哪射。如果没有看到，你可能就不必费心。”


    我当然在做推测，但我相信自己说的话，无论如何，先对付受过训练的卫兵是正确的行动方案。


    女性们看了我身边的女孩。她点了点头。“听他的。我们会度过这一关，一切都是值得的。”


    我再次对这个年轻人能够保持冷静感到印象深刻。


    我再次对这个年轻人能够保持冷静感到印象深刻。


