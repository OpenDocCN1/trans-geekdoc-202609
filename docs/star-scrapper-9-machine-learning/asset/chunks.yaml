    “她的舱室在`TR-141`，”他说道。她拍了拍阿莱克的手，然后走出了房间。


    “是我说了了什么吗？”莉比问道。


    “是，”，”拉拉带着一丝坏意回答道，“总是你说了了什么才对。”


    莉比吸了一口气。“你竟敢？”她假装被冒犯地问道，“那是你对内德说的话，不是对我说的！我可不是普通的 AI，我是很酷的 AI。”


    内德哼了一声。“你能不能别那样叫我了？”


    “没门儿，邻居小哥，”莉比说道，“这是我魅力的一部分。”


    “我们管那叫魅力吗？”内德问道。


    我清了清嗓子。“总之，”我说，“我们要怎么处理那个 thengar（能量源核心）？”


    “你不会惊讶地发现，福尔希勒对它有几个想法，”莉比说道。和平号的船长对我们应该如何做事有很多想法，并且喜欢在任何可能的情况下冲到我面前谈论这些。


    “这些是好主意吗？”我问。


    莉比发出了“嗯”的一声。“其实，我觉得是，”她回答道，“他想卖掉一部分，留下一部分用于研究，然后尝试调配出我们自己的无品牌 Hospi-gel（霍斯匹胶）。”


    “啊，所以，什么样都要一点，”我说。“告诉他我批准他的计划，我们可以推进。另外，联系一下中介人，让她利用她的人脉为 thengar 争取到最好的价格。”


    “没问题，”莉比说，我注意到拉拉正对我微笑。她总是喜欢我扮演领导者的角色，而现在对我来说这已经变得自然多了。起初并非如此。


    '
