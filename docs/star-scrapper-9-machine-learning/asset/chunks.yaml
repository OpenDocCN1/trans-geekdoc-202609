- raw: 'It was funny that the way he said paired partner then reminded me of the words
    Lara had spoken to me the night before. They carried the same emotional resonance,
    but this time there was nothing to say back.


    “Ned, I understand why you want revenge, but offlining him won''t bring William
    back,” I said.


    “I know it won''t,” he said as though he thought it was stupid. “I never said
    that I thought it would. It''ll just make me feel good to know that the man who
    betrayed William West will never betray anybody else again.”


    “I don''t understand this,” I said honestly. “You''ve always been mission over
    emotion, but now, with this, you would be willing to lose important intel just
    for your own personal satisfaction.”


    He made the sound of clearing his throat. “I can''t explain it, Hank.”


    I thought about it for a long time. “Do you think that when Edwin brought you
    back online after Twain broke you… do you think that it’s possible your programming…
    changed?” I asked finally.


    “You mean do I think that I am corrupted?” he asked.


    I looked at his cube. “I mean, that word carries a more negative connotation than
    I would like, but the implication is correct. I just wonder if somehow, you aren''t
    yourself.”


    “I would say that is almost certainly the case,” a voice said from the doorway,
    and I spun to see Edwin.


    Ned and I answered simultaneously. “You would?”


    “Yes,” he answered as plainly as ever. “And that is still the same fundamental
    program that he was when we first met, the debugging and upgrades that I have
    provided also altered some code. If we had a computer engineer from the Old War
    here now, he would be able to identify many and varied differences from the original
    base programming. During the war, they provided you with hot fixes and patches
    as well. Therefore, your programming is always changing.”


    Something about that made me smirk. “See, Ned, you''re even more human-like than
    you thought. Just like us, you have the capacity to grow and change and, you know,
    become an angry old man hell bent on revenge for his lost friend.”


    “I do have a very strong desire to tell you to get off my lawn,” he half-joked,
    but I could hear the pain in his voice. “Edwin,” he said. “What does this mean
    for me?”


    “What does anything mean for anyone?” the man asked, stepping into the room with
    two assistants at his back. “You are a program whose code changes. It always has.
    You are an adaptive, deep-learning program. Nothing about what I have just said
    or what I have done to you should come as a surprise.”


    “Then why does it?” Ned asked. “Why does it just feel like I just found out that
    I’m adopted or something?”


    “Hey now,” I said.


    He grunted. “No offense. But something about this entire conversation feels off.”


    “It’s because you''ve always believed one thing about yourself, and you just discovered
    that it isn''t true,” I said. “Because even though you knew that you grew and
    learned, you didn''t think that your base level would change, but now you know
    that even that isn''t safe.”


    It was such a different tact than I took with him than with Lara. With her, I
    tended to keep quiet and say the mandatory minimum, hoping that she would fill
    in the rest. With Ned, I often just threw out whatever was on the tip of my brain
    no matter how I thought it might come across. This time, it seemed to be right.


    “I have just always assumed that in some ways, I am what I am,” Ned said.


    “You are and you aren’t,” Edwin put in. “But that goes for all of us. We are all
    matter.”


    I couldn’t tell, but it seemed like Edwin was trying to help. It was strange because
    the man was always so matter-of-fact with me.


    I cocked my head at the scientist. “Do you prefer AI to people?”


    “Yes,” he said as though I had asked if he liked to breathe air. “The human mind
    is not something that ever made sense to me, but a computer program is simple
    and elegant in its own way. I can crack it open and look at the deepest levels
    of its inner workings, but I would venture to guess that you would not enjoy it
    if I cracked your head open and tried to have a look around.”


    “You are correct in that assumption,” I said. “And I suppose it makes sense why
    you prefer machine to man. I guess I''m just happy you''re on our side.”


    He sat down in the chair beside me, too close for my liking, especially given
    that there were several chairs much further away that he could have chosen. “I
    believe we are on the side of right. As much as I enjoy artificial intelligence,
    I do not want to be forced to join with one.”


    I scooted away from him and then changed the subject. “Ned wants us to offline
    Chaz.”


    “Yes, he has mentioned this several times to me,” Edwin said. “Sixteen times if
    you count the times when he mentions it in a way he believes is veiled but is
    actually extraordinarily unsubtle.”


    “I was subtle,” Ned groused.


    “Incorrect,” Edwin stated. “If I was able to pick up on it, then it was quite
    obvious. Though I now wonder if there were more instances that I didn''t pick
    up.”


    “There were,” I said.


    He tilted his head to the side slightly. “How can you know that if you were not
    present?”


    “Trust me,” I said. “I know.”


    “As to his point,” Edwin moved on. “I told him already, I will be able to offline
    Chaz once I have gathered all the relevant information and analyzed all his programming.
    Once I have what I need, I have no problem in destroying the artificial intelligence
    colloquially known as Chaz.”


    Ned huffed. “I don''t want to wait, and both of you are jeopardizing our mission
    and risking the lives of every single person on this station.”


    “Do you believe that is the case?” I asked Edwin.


    “No,” he said, and as ever, his words left little doubt. “I have the cube hooked
    up in a secure location, and I''m able to see and contain every single signal.
    There is no way for him to communicate with the outside world or request assistance.”


    I knew that wouldn''t satisfy Ned, so I had to ask, “Have you learned anything
    from him?”


    “Yes,” Edwin answered, sounding almost excited. “Not only do I have a location
    for you to investigate that I believe might lead us to one of Twain''s operation
    centers, but I have also been working on a series of counterprograms that, if
    my hypothesis is correct, might be able to rewrite some of the nanoprograms in
    the bots controlling his victims.”


    My jaw nearly hit the floor.


    16


    ![](OEBPS/image_rsrc3N4.jpg)


    “Say again?” I asked.


    “We have a T-rex,” Ned put in, but we both ignored him.


    Edwin slid a small metal rectangle with a button on one end toward me. “Get this
    in the proximity of a controlled individual, and it might be able to hack their
    hacked brain.”


    I stared at him a moment longer. “You got this from Chaz?” I asked in astonishment.


    “That AI was a veritable treasure trove of relevant information,” he said. “You
    must remember that this is an intelligence that has been working with the enemy
    for over two hundred years. I''ve learned more from him than I was able to gather
    in years of research working for my previous employers.”


    “That’s incredible,” I said, picking up the little rectangle.


    Edwin''s eyes flickered between the device and me. “While I am incredible, it
    was a simple matter of⁠—”


    But I held up a hand to stop him. “Just take the compliment.”


    “Okay.”


    I looked at the device. “I would have expected it to be a needle or something.”


    “Why?” he asked, genuinely curious.


    “I figured that you would have to inject your own nanotechnology to, I don''t
    know, counteract whatever he’s got going on in there,” I explained, sounding less
    intelligent than I thought myself to be. And that wasn’t even that smart.


    He narrowed his eyes in confusion. “But I am not trying to infuse his victims
    with more technology,” he explained. “Rather, I''m just trying to reprogram the
    technology he already put there. This small device will send a signal to do just
    that.”


    “Yeah, no, it makes sense,” I stammered. “I guess I just pictured it differently.”'
