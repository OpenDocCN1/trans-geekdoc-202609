- raw: 'Chester’s metal hand hit with such force that it dented the mask, nearly causing
    it to press against my nose. Then I was thrown back with such force that I felt
    like I had been hit by a car.


    My head was spinning. I couldn’t see much, and I couldn’t register much of what
    happened next.


    I saw the blur of energy bolts and the rush of eternal flamed weapons, and I heard
    the sound of pitch battle. A flash of blue filled my vision, and the mask was
    cut from my face.


    “I called Jackson,” Ned said, but his voice sounded distant, as though he was
    talking to me from underwater.


    More purple beams sliced across the field, and a hand entered my vision as an
    Inquisitor was helping me to my feet.


    Standing, I surveyed the scene. The soldiers were defending themselves against
    the attacking Acolytes, and Chester was nowhere to be seen.


    Some of the ships were taking off, and Francis was unmoving on the ground. I stared
    at his body, cursing that he couldn’t just play along for a moment longer.


    While some of the Disciples’ ships were taking off, the Buzzard appeared in the
    sky, opening fire from the front and both sides all at once. Many of the ships
    on the ground were destroyed, while Jackson brought her in for a landing, lowering
    the ramp as she did.


    Dirt sprayed all around under the force of the thrusters, and Lara and I ran as
    quickly as we could to the back of the ship.


    I turned to see if Clynt was anywhere, hoping that he would make his way back
    to us soon, but when I looked back inside the Buzzard, he was standing there with
    a small black circle in his hand.


    We had gotten what we had come for, but now we needed to stop Twain’s people from
    escaping and warning their master.


    “Keep shooting!” I shouted, but there was no one around to take that order as
    Jackson and the girls were all deeper in the ship.


    Lara helped me further in, and the ramp rose as we made our way to the cockpit.
    The ship was shaking as we moved, the force from the micromissile battery’s constant
    firing vibrating the entire place.


    It was strange walking through the Buzzard while it was so alive with activity
    and not being at all involved. Or maybe I was just concussed. Either way, when
    we reached the cockpit, Jackson was taking another pass on the ships from the
    ground. Two of which had taken off and were coming around on us.


    “Get in those seats!” she commanded, and we strapped in as quickly as possible
    so that she could turn the bird and get into the action.


    I wanted to shout suggestions, point out what I saw here or noticed there, but
    Jackson was a trained soldier who had spent her life at war and didn’t need me
    backseat driving.


    One of the ships from the Old War was streaking toward us, and both cannons opened
    up at once, the ship rattling again. But the missiles found their mark, and I
    could hear Imogen and Sophia cheering from their respective spots. That ship that
    Lutch would have loved so much to tear apart was reduced to nothing but pieces
    of scrap scattered over a field of barley.


    Jackson turned to look at me. “My men got you a ship to use,” she said. “I’ll
    drop you at the rendezvous”—she tilted the Buzzard, and my neck snapped as she
    brought us around to face the other light craft that had managed to take off—“after
    we deal with these.”


    She activated the controls, the forward-facing guns shooting missiles from the
    bow. The small Disciple ship avoided the shots, banking hard out of the way, but
    another burst caught it on the shields, only it tilted and zipped away.


    The short-range scanner showed the dot move away but circle back, taking a run
    at us. Jackson rolled the ship to avoid getting hit, and I remembered that I much
    preferred to be flying than in the passenger seat. Somehow, it was far easier
    when I was at the controls than sitting off to the side as the Buzzard ducked
    and dove and spun.


    But Jackson was doing an excellent job of keeping us alive and going, so I would
    just have to grin and bear it. Plus, I knew that I was heading straight into the
    next fight and could probably still use a few moments to get my wits about me.


    “Any word from Ammo?” I asked, and Jackson shook her head.


    I would just have to assume that she would be there when called from the Watson.


    The ship made one more pass, and I saw as the Mortal Coil lifted off the surface
    of the planet, another of the Inquisition ships following behind.


    One of the two broke off and joined our fight while the other lifted and left
    their companion behind. It didn’t surprise me. Inquisitors seemed to live by their
    own set of rules that only made sense to them.


    “Pin them,” I said quietly, almost to myself as the light craft took another pass,
    firing a quick burst that did nothing but reduce our shield slightly.


    Jackson must have heard me though and shouted into the comms, “Cross fire,” while
    she leveled the Buzzard. The girls tightened their shots, the streaks of missiles
    keeping the ship pinned between for just a moment until they pulled up.


    When they showed Jackson the underside of the ship, she blasted with another burst,
    and while it wasn’t enough to break their shield and destroy them, it was enough
    to make them vulnerable to the Inquisition ship that came up from behind and blasted
    them apart.


    I didn’t even have to say anything, and Jackson was pulling up, taking us out
    and away from the surface of the planet to Tidal away.


    “You okay over there?” Lara asked me as we flowed through the gyre tube.


    I looked at her and said, “Yeah.”


    “Not super convincing,” she replied, and I was sure that was true.


    I was still a little lightheaded from the punch Chester had given me and knew
    that I would have to get my head screwed on straight for what was coming next.


    The moment we landed back at the abandoned diner, I was up and moving off the
    ship to meet with the Peacer who had snagged us a small ship with a picture of
    a cat in a bathtub and wearing a shower cap painted on the exterior.


    “It’s a pet grooming company,” the Peacer informed me as though I couldn’t extrapolate,
    but I nodded gratefully.


    “Good work,” I told him and then turned to Jackson. “Same to you. As always.”


    She gave a quick salute. “I’ll be waiting on your word,” she said and returned
    to the Buzzard. We stepped over to the grooming craft and boarded, Clynt scampering
    past us wordlessly.


    “Get us going,” I said to Imogen while Lara and I stayed toward the back to change.


    Imogen grimaced and looked me over. “This is the stuff of nightmares,” she said,
    pointing to John Gregory’s chest plate.


    “Why do you think I want it off me?” I said. “But good shooting back there. Both
    of you.”


    Sophia smiled. “It was kinda fun.”


    “Come on,” Imogen said, and they made their way to the front of the ship, leaving
    Lara and me in the back, surrounded by shallow sinks, medium sized cages, and
    the stink of wet dog and shampoo.


    We changed quickly as Imogen lifted us off the planet and we Tidaled toward where
    we hoped the H.H. Watson would be waiting.


    “Can you imagine if it’s not there after all that?” I asked, putting words to
    my fear.


    Lara cocked an eyebrow at me. “That would suck.”


    “So eloquent,” Ned joked. “But she’s also right. It would totally suck.”


    Once we were changed, we made our way into the cockpit, where I saw that it was
    less than a minute left until we washed out.


    “I left that tracker but don’t think it’ll do no good,” Clynt said. “That all
    went down ’bout as bad as it could go.”


    “No kidding,” I agreed, lowering myself into the copilot’s chair that they had
    left open for me. “And I think that will pretty much end our partnership with
    the Inquisition.”


    “Grabbed this though,” Clynt said, holding up the box that Chester had delivered.


    I felt the smile pull my mouth. “Nice work.”


    “It’s ’cause you told ’em how good I were,” he said.


    I looked at the box. “Clynt, I said it because it’s true. No one else could have
    pulled this off.”


    “Damn straight,” he said.


    “So, what’s in there?” I asked.'
