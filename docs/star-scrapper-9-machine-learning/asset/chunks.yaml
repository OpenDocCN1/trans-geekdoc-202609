    suspect is being used by the Cult to kidnap new followers. Hank sees some of his
    remaining family there before Imogen allows herself to be captured so they can
    hunt down whoever is behind this.


    They follow Imogen’s signal to a nearby planet and the Peacers attack the front
    as Hank goes in the back. They rescue the children and Imogen but her aunt is
