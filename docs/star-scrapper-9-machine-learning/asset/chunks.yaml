  trans: '


    “好吧，事情发生了，”拉拉说，曼恩用手抓了抓头发，挤掉水。他若有所思地转脸面对洒在身上的阳光。


    过了一会儿，他看向拉拉。“你来对地方了。”


    ![](img/image_rsrc3N4.jpg)


    穿好衣服后，曼恩带领我们离开了他的庄园，沿着路又往前走了一段。他没有带我们走向我熟悉的回城方向，而是带我们上了一座俯瞰他社区的山丘。在这里，街道旁布满了大理石像和像细长泪滴的柏树。每隔几步就有一名守卫守在路旁，监视着一切，同时也让人感受到他们的存在。


    这里的空气闻起来更好闻，像新鲜的柑橘味。附近的恒星开始移动到它上午中午的位置，我们在道路分叉处转弯。顺着这条稍窄的路径，我们又走了一会儿，直到到达一堵顶部闪烁着激光尖刺的砖墙。


    还有两名守卫守在铁大门旁，他们背后都披着紫色的斗篷。他们互相了一眼，左边的那一个基洛格人（Kyrog）向前迈一步。


    “停，”他说。


    曼恩笑了起来。“你真的打算对我用这一招？”


    高大的守卫哼了一声。“我打算，因为我没有收到你要来的警告。议员女士在等你吗？”


    “她没有，”曼恩陈道，“但告诉她，我是为了急事来⁠”


    但他没能说完。从墙外高大的建筑和浅浅的装饰性水池旁，一个女人从阳台上用沙哑的声音喊道：“让他们进来吧，你这个大笨蛋。”


    他烦躁地哼了一声，但向后退一步为我们开了门。


    “谢谢你，大块，”曼恩说，我们通过大门进入打理得精美的院子。这里，那些长着闪闪绿色皮毛的小飞行类齿类动物到处飞舞，落在各种树木掉下的果实上。蝴蝶在花丛间穿梭，仿佛步入了某种幻境。甚至连星飞船的降陆平台也环绕着看似手工雕刻的华丽鸟槽，它们吸引了更多惊艳的小生物。


    刚才在阳台上叫叫的科内西亚人（Conecian）女人从沉重的正门走了出来。她紫色的皮肤在星光下闪烁，穿着一件流动的丝绸袍，走时在身后飘动。


    “曼恩·马利克，”她打了招呼，然后看向我们。“我不认识你们两位。”


    “Vex 猎人和 Spears 猎人，”拉拉说，边说边比着手。


    科内西亚人点了点头。“我是六人议会的阿拉娜·托尔甘。”


    “深感荣幸，”拉拉说，语气近乎卑微，“我们来这里是想和您谈一件棘手。”


    女人环顾四周。“请进里坐，”她说，转身走进别墅。从正面看，你可以穿过主房间——那里的沙发嵌在凹陷地板上方的水池旁，池子里有小鲨鱼在穿梭——看到另一个阳台。但这个阳台俯瞰着议会（Conclave），可以欣赏到美丽的建筑和宏伟纪念碑的绝佳景色。


    她引导我们通过房间侧面的扇门，进入一个摆满卷轴的书架房。在那里，她走到音乐播放器旁打开了一些悦听的古典音乐。尽管她显然是为了防止我们的话被听见，但这确实营造了很好的氛围。


    她坐在一张小办公桌后，桌上放着笔和一些纸，但没有电脑。墙壁底部涂成红色，中间是米白色，上面挂着几张阿拉娜年轻时穿着赏金猎人装束的照片。其中一张是她骑着某种神话生物，另一张是她站在一辆翻倒的坦克上，看起来像是单挑独斗击败了它。


    面对书桌的墙边有几张沙发，我们三个人坐了下来。


    “关于什么事？”女人直奔主题。


    “猎隼人泽诺比亚身受了重伤，”曼恩告诉她。


    女人看着他，嘴唇成一条直线。“她是你的猎隼人吗？”


    “不，您是，”他困惑道。


    “正如此，”她说，“那么让真正了解情况的猎人说话吧。”


    他的看起来像像个在朋友面前被训斥的孩子。“抱歉。”


    这话听起来像是从他嘴里生生拽出来的掉牙。


    阿拉娜挥手谢绝道歉。“你们中谁的等级更高？”


    “是我，”拉拉毫不犹豫地回答。


    科内西亚人手指交叠，看着我身边的女人。“请告诉我全部情况。”


    拉拉的眼睛看向曼恩一眼，然后又转回议员女士。


    “在这个房间里说的任何话都会留在这里，除非我请求许可分享，”阿拉娜说，“我不是通过胡言乱语升到这个级别的。现在，说你们要说的。”


    拉拉长舒了一口气。“陷阱者月光·法拉克克斯被一名基洛吉大使雇佣去杀死我们的一位朋友。我们成功阻止了他，我带回了他的猎隼人罗恩来接受领事质询。”


    “这还没有发生，”阿拉娜告知我们。


    她的语气很简练，此刻，我很欣赏这种处事。我很乐意直接告诉她发生的情况并听听她的看法。我不完全确定是否能信任她，但我们并没有别的选择。


    “明白了，”拉拉说，语气近乎虔畏。她如此尊重制度的方式也挺可爱的，让我知道我们至少引起了她的兴趣。


    “继续，”阿拉娜说。


    拉拉似乎再次字斟句酌。“而且最近，”拉拉继续道，“我们被某个毫无预警冲入太空的人发射了电磁脉冲（EMP）。我们没有确凿证据证明那是陷阱者，但根据我们现在的信息，我相信是。”


    “从你说的来看，听起来很有可能，”阿拉娜赞同。“你们认为泽诺比亚是被某个想伤害你们的人受伤的？”


    “是的，”拉拉说，“对于赏金猎人以外的人来说，要进入议会并做这种事似乎并不可能。”


    她托着下巴考虑着。“我推测你们有很多多样的敌人？”


    “确实有，”拉拉肯定道。“完全有可能是最近发生在我们身上的事情与之无关。”


    “尽管感觉这一切都是关联的，”阿拉娜说着，指尖轻扣。“你们认为我能为大家做些什么？”


    拉拉的眼中闪过一丝惊讶。显然，她没有考虑过这个问题。于是她诚实地回答道：“我不完全确定。”


    议员对此笑了。“我很欣赏你的诚实。大多数人来这里时都带着一份长过手臂的要求清单，”她并瞥了曼恩一眼。


    “既然我不是那种人，”拉拉宣布道，“我会先问问我能为您做些什么，然后请求任何指导。”


    “我希望有更多猎人像你一样，”阿拉娜说。“或者像你。”她指了指我，所以我疑惑地挑起一边眉。


    “我告诉过你我想和 Vex 猎人说话而不是你，之后我就没听到过一句话，”她说。“很好。这正是我们要找的。”


    “我以为我就是要找的，”曼恩插话道。


    她叹了口气。“在我刚说完那话之后，你偏偏在这个时候说这种话？”

