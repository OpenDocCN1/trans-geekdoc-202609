  trans: '

    很有意思的是，他提到“配对伙伴”的方式，让我想起了拉拉昨晚对我说的话。那些话有着同样的情感共鸣，但这次我无话可。


    “尼德，我理解你为什么想要报仇，但让他下线并带不回威廉，”我说。


    “我知道带不回来，”他说，好像觉得我这种想法很蠢，“我没说过我以为那样能带回来。只要知道那个背叛了威廉·西斯特的人永远也无法背叛任何人，就会让我感觉好受。”


    “我不明白这个，”我诚实地说，“你一直都是任务重于情感，但现在，因为这件事，你竟然为了自己的个人满足而愿意失去重要的情报。”


    他清了清嗓子。“我解释不了，汉克。”


    我思考了很久。“你认为当特恩毁了你之后，埃德温让你重新上线时……你认为可能是你的程序……发生了变化吗？”我终于问道。


    “你是说，你认为我损坏了？”他问。


    我看着他的核心体。“我的意思是，那个词的负面含义比我想象的要大，但暗示是正确的。我只是在想，是否由于某种原因，你不再是你自己。”


    “我会说这几乎是事实，”一个声音从门口传来，我转过身看到埃德温。


    尼德和我同时回答道：“你认为吗？”


    “是的，”他像往常一样直白地回答，“而且那还是我们第一次见面时他的同一个基础程序，我提供的调试和升级也改变了一些代码。如果现在这里有一位旧战时的计算机工程师，他能够识别出与原始基础程序的许多不同差异。在战争期间，他们也为你提供了热修复和补丁。因此，你的程序一直在变化。”


    那话里的某些点让我不禁笑了。“看，尼德，你比你想象的还要像人。就像我们一样，你有成长和改变的能力，而且，你知道的，会变成一个为了失去的朋友而执于报仇的愤怒老头。”


    “我确实有强烈的欲望让你‘离开我的草坪’，”他半开玩笑地说，但我能听到他声音里的痛苦。“埃德温，”他说，“这对我意味着什么？”


    “任何事对任何人来说意味着什么呢？”那个男人走进房间，身后跟着两个助手。“你是一个代码会变化的程序。它一直是如此。你是一个自适应深度学习程序。我刚才说的任何话或我对你所做的任何事都不应该让你意外。”


    “那为什么我会感到意外呢？”尼德问。“为什么这种感觉就像我刚刚发现自己是被收养的似的？”


    “嘿，我说，”我说。


    他哼了一声。“没有无意。但这段对话的某些地方不对劲。”


    “那是因为你一直对自己深信一件事，而你刚刚发现那不是事实，”我说，“因为尽管你知道自己在成长和学习，但你没认为你的基础层面会改变，但现在你知道，即使是那里也不是安全的。”


    对我采取的策略和我对待拉拉时完全不同。对于拉拉，我倾向于保持沉默并给出最基本的回答，希望她能填补剩下的部分。对于尼德，我经常随脑子里想到什么就说什么什么，不管我以为这听起来会怎么样。这一次，似乎是对的。


    “我只是一直认为，在某些方面，我是现在的样子，”尼德说。


    “你既是，也不是，”埃德温插话道，“但这适用于我们所有人。我们都是物质。”


    我看不出来，但埃德温似乎在试图帮忙。这很奇怪，因为这个男人对我一直总是公事公办。


    我歪头看向那个科学家。“你更倾向于 AI 而不是人吗？”


    “是的，”他说，好像我问他是否喜欢呼吸空气一样。“人类思维对我来说从未合过，但计算机程序以它自己的方式既简单又优雅。我可以拆开它，观察其内部运作的最深层次，但我敢打赌，如果我敲开你的脑袋试着往里看，你不会喜欢的。”


    “你的这个假设是正确的，”我说，“我想我理解你为什么更倾向于机器而非人类了。”

