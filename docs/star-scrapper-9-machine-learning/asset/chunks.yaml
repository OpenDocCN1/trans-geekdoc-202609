  trans: '

    她没有微笑，但微微点了点头，流露出感激之情。“谢谢，你们，”她说道，然后把脸埋在双手里。尽管我没看到她哭。“我觉得这是我在这艘船上第一次有人对我说过体贴的话。”


    我坏笑了一下问道：“你想去告诉约翰·格雷戈里，你对这事有什么感受吗？”


    她收回手，直直地看着我。“想去，”她说，“是的，我想去。”


    # 23


    ![](img/image_rsrc3N4.jpg)


    通过传输管前往潮汐驱动器上那个小行星的航程并不遥远。


    当我们冲出云层，那个小小的蓝点出现在我们面前时，内德向我们解释了情况。“这不过是战争期间的一个前哨站，用于扫描周围的空间。”


    “看来很多这类地方都被遗弃了，而吐恩正利用了这一点，”我观察到。


    内德哼哼了一声。“你必须理解我们当时有多措不从，”他辩解道，“整个宇宙都联合在了一起，但我们都在战争中遭受了毁灭性的打击。这样的地方被遗弃无疑是因为资源被其他地方需要。”


    “而且因为他们杀死了你所有的同，”伊莫金补充道。“所以他们不能直接让人工智能来管。”


    “正如我们在仙后座看到的那样，即使他们留了一个人工智能来管也没关系，”拉拉说，“只要联盟没有检查他们所有的设施，无论它们是被遗弃还是只留下一个守卫——无论人还是机器——这都不重要。”


    内德不喜欢这种谈话的语气。“联盟的男男女已经在根据他们拥有的资源尽所能了。战争中幸存的人在战后必须更加努力地工作，虽然某些事情可能被优先于其他事情，但这并不意味着联盟做了任何错。”


    我轻笑起来。“那段程序什么时候才会改变？你说你感觉自己正在变得不同？为联盟找借口又要什么时候结束？”


    “永远不会，”他回答道，毫无一丝怀疑，“因为那不仅仅是代码，而是热诚的信念。”


    “不，”伊莫金说，“那都是代码。”


    内德起初没有说话，直到他说道：“感觉并不是那样。或者也许我被程序设定为理解我是什么，但无法完全接受它？又也许我内部发生了什么变化？”


    我皱起眉头。“也许这并不重要，”我说，“你对联盟的爱，从根本上说，是你成就你的东西，尽管我很喜欢在这件事上取你的趣，但我真的不希望它改变。无论我们每个人如何成长，我们并没有真正、实际上地改变。”


    “凡人躯号”降落，进入了笼罩在行星面的浓雾中。我将她停在一个似乎由压实碎石制成的降陆场上，我感觉到飞船在落在地面时轻微地下沉了一下。


    透过厚厚的、深灰色的雾，很难看清什么。尽管我知道在这颗星球上是白天，但雾气太浓了，将世界笼罩在一种暗淡的伪黑暗中。


    真恰其合。


    从降陆场，我们可以看到附近的建筑。它看起来像是一个审判所建筑的副本。倾斜的屋顶在角落直插天空，有四个尖顶。正面有一圈粗糙的彩色玻璃和通往建筑内部的巨大木门。


    当我们走下飞船时，那些门被推开了，审判官约翰·格雷戈里从里面走了出来。


    他看起来正要下达命令，这时他看到了我们。他的脸扭曲了，痛苦的表情拉了他本就紧锁的眉头。


    “你们在这里做什么？”他用一种几乎不像他自己的声音质问道。


    路旁的高草和沿路长出的小伞树在微风中摇曳着。雾气在我们之间翻腾。


    “你们不能在这里，”他说。“你们不应该知道这件事。怎么做？”


    我向前迈了一步，感受着伊莫金在我身边散出的恐惧和决心。


    “我们知道很多事情，”我脸上带着自得意的微笑说道，“很多你希望我们不知道的实。”


    “处理掉它们，”他忍着扭曲的愤怒说道，“我会来对付你们。”


    听到这话证实了我的信念。“噢，嘿，吐恩，”我说道，动了动手指示意。

