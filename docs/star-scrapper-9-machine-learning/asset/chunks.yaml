    \ Government has outlawed any artificial intelligence, and anyone caught harboring\
    \ one is imprisoned or killed.\n\nPursued by Inquisitor John Gregory and his Acolyte\
    \ Imogen Hush, the two evade capture and discover a relay station in the far reaches\
    \ of space where another AI, Libby, has been hiding. With her help, they are able\
    \ to find the brother of Hank’s adoptive father.\n\nHe offers to help, and they\
