    \ the sky, opening fire from the front and both sides all at once. Many of the\
    \ ships on the ground were destroyed, while Jackson brought her in for a landing,\
    \ lowering the ramp as she did.\n\nDirt sprayed all around under the force of\
    \ the thrusters, and Lara and I ran as quickly as we could to the back of the\
    \ ship.\n\nI turned to see if Clynt was anywhere, hoping that he would make his\
    \ way back to us soon, but when I looked back inside the `Buzzard`, he was standing\
    \ there with a small black circle in his hand.\n\nWe had gotten what we had come\
    \ for, but now we needed to stop Twain’s people from escaping and warning their\
