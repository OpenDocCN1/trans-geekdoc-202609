- raw: 'I opened fire on one, turning the Buzzard into the oncoming assault.


    This left us open, and both the crafts attacked us with a volley of micromissiles
    that crashed against our shields and sent a spectacular light show spraying in
    front of our faces.


    Lara wheeled, turning her gun to intercept one of the crafts, but they were fast,
    and the shots went wide. Now was the time when Ned was so helpful. Against quick
    ships, his targeting systems were able to calculate exactly where to shoot in
    order to take down fast-moving enemies.


    Now, it was human against human, and we would have to find a way to deal with
    them. Of course, Lara’s anger over the loss of her friend and mentor made her
    a deadly opponent. She almost seemed to have embodied Ned’s abilities and fired
    off two more bursts of shots, and one erupted against their defenses.


    I started to wonder if the best thing I could do was try and make sure to get
    Lara into good firing positions rather than even trying to shoot with my own guns.
    But I didn''t have time to take that calculus into consideration because I saw
    the blip of one of the light fighters coming up from behind, and I barrel-rolled
    us out of the way. I watched as light trails of the missiles zipped by.


    As the last rocket passed under the Buzzard, Lara activated one of the mechanical
    arms used for scrapping and managed to pluck one of the missiles out of space,
    grabbing it by the tail and letting it go while facing a different direction from
    those being shot from her cannon.


    The separated missile went streaking one direction while the volley drove the
    ship away in another. The timing was immaculate. As the fighter fled the burst,
    they didn’t even notice the single micromissile coming up from another angle to
    strike their engine.


    Another explosion as fuel and oxygen combusted before being snuffed out by the
    vacuum of space.


    Now it was just us and the one last fighter.


    This pilot seemed to be better than the others and was evading all of our fire.
    Every time I thought I had him in the crosshairs, the ship would drop or move
    or somehow get out of my way. It was frustrating, and I could hear Lara cursing
    and swearing from where she was every time she would miss with a series of shots.


    Soon enough, the little fighter was doubling back and striking us with a series
    of shots. Slowly but surely, he was dropping our shields.


    “I’m going to Tidal,” I told Lara.


    “No,” she snapped. “I got this.”


    The shield kept dropping, and we kept missing. I wasn’t going to die out in space
    for her pride, but I also didn’t want to Tidal away while she felt like we could
    still be victorious. Plus, any Blood Dragon that we left alive would come back
    for us in the future.


    “One more pass,” I told her. “But if we get within ten percent shields, I’m getting
    us out of here.”


    I could hear Lara’s gritted teeth though the comm. “I’ll get him.”


    What followed was a spectacular showing from Lara.


    She began to pepper the space around us with small bursts, forcing the fighter
    to evade in exactly the way she wanted or flee. Part of me wondered if he might
    just get out of here. If he would rather just come back with more friends in the
    future. But then I thought about what I had learned when fighting against them.


    To the Blood Dragons, nothing was more precious than their face, their pride.
    I was sure that this pilot would rather die than return defeated. Lara must have
    known the same thing because she continued to pop off shots in small bursts. This
    way and that, the fighter had to evade as it tried to pursue us, and I held the
    Buzzard steady, letting him get close.


    Then, all at once, Lara laid down a barrage of fire, swinging the gun to all but
    coat the space behind us in a sheen of tiny rockets.


    He tried to pull an evasive maneuver, dropping the ship''s nose, but it was too
    late.


    A few of the missiles clipped his tail, causing the ship to careen out of control
    and disappear into space a moment later.


    “You can Tidal now,” Lara said in a satisfied tone.


    I was happy she got the small victory she wanted and that the Blood Dragons were
    now down a few more bodies, but it was also a reminder of how unsafe we were out
    in the world. So many factions were coming for us, and we needed to be on constant
    alert.


    But it turned out I had to be on high alert when back at the station too.


    The minute we landed, Ned’s voice crackled into the hangar.


    “Hank,” he said seriously. “I need to speak with you now.”


    Lara looked at me as she stepped in the direction of the cabins. “I’m going to
    take some time.”


    “Sure,” I said. “But don’t sneak out of here to do something stupid.”


    She rolled her eyes but marched away.


    Meanwhile, I made my way to Edwin’s lab, where Ned’s cube was waiting for me.
    One of Edwin’s assistants was in the room, but it was otherwise empty.


    “You mind if I talk to my friend?” I asked, gesturing to the cube.


    The assistant nodded. “Certainly,” she said. “The doctors are having a meeting
    over lunch and probably won’t be back for a bit. The two seem like old friends.”


    It took me a minute to realize who she was even referring to, but then I realized
    that Charlie and Edwin had undoubtedly met and were now discussing scientific
    principles that I could never even hope to understand.


    Once she had left, I sat down on one of the little lab chairs beside the cube,
    glancing around the now tidy workspace. When Edwin had first moved in, the place
    was a disaster, but with the help of some trainees who were working under him,
    it was now much cleaner. Though there was always the mess of whatever experiment
    they were working on.


    “What’s going on, Ned?” I asked.


    “You have to offline Chaz,” he said unequivocally. “You must.”


    I didn’t have enough context and immediately wished that I had gone to talk with
    Edwin first.


    “Why?” I asked. “What’s up, buddy?”


    Ned let out a long, pained sigh. “He is the reason Captain William West, hero
    of the Five Battles and Pilot of the Starblaster, is dead.”


    And there it was. The truth that Ned had been hiding in plain sight all this time.


    “How do you know?” I asked, and he must have known that was what was coming next
    because a computer screen nearby turned on, and I watched a security feed from
    inside a military hangar. One man was holding a weapon on another’s back, and
    then, right before my eyes, he fired.


    Watching a person be gunned down from behind, even hundreds of years later, was
    jarring and upsetting, and I understood why Ned was so mad.


    “Chaz was paired with that man?” I asked, knowing the answer.


    “Yes,” Ned stated. “He was a pair partner to Nathan Spade, who shot William in
    the back aboard the Pinafore before detonating an electromagnetic pulse.”


    As he said it, I watched the events unfold, watched as William struggled to get
    back to the Starblaster, to Ned, before the screen went white.


    It was almost too much, the timing of it all. What happened to Zenobia, seeing
    this, it was a lot to take on back-to-back. I had held it together pretty well
    with Lara, but something about seeing what fate befell William West seemed to
    sap all my strength.


    Perhaps it was because Ned spoke about him in such reverential terms that to see
    this poor man be gunned down like he was nothing made it sting all the more. Or
    maybe it was because it exemplified just how deep Twain''s tendrils went.


    He had been so powerful for so long, and the Consortium had been foolish to believe
    the fight was won.


    “Now,” I said quietly.


    But he got in before I could continue. “Hank, I know what you''re going to say.
    You''re going to tell me that he''s a strategic resource and that we can''t offline
    him while we can still get information from him. And I understand that. But I
    also understand that every second he exists on this station, he''s a threat to
    us. For all we know, he could be sending information back to Twain as we speak,
    and this could be your future. I''ll be damned if I let another one of my paired
    partners die on my watch.”'
