  trans: '

    “哇，”那个脏兮兮的店主说完，然后就在那里站了很久，仿佛他的大脑完全停止工作了。接着，他没再说一句话，匆忙穿梭在桌子之间，撞到了路过的每一张桌子，并将小摆件掉在地。


    他消失在帘子后面，我们等着，听到后屋传来了更多物体破碎的声音。没多久，他重新出现，拿着一个中等正方形箱，一侧有一个沉重的锁机制，另一侧有一些闪烁的灯光。


    “免费提供，布罗斯夫和神奇彩虹衣，”杜迪马尔说道，“如果真的像你说的那么糟，我可不想成为那个破坏宇宙氛围的人，你懂的吧？”


    “你真的是你种族的缩影，”阿列克说着，拿过了盒子。


    灯光再次闪烁。


    “打扰一下——杜迪马尔，是吗？”伊莫根说，“你觉得我们可以用一下你们的后屋吗？”


    “没问题，女孩妞，”他说，我们都匆忙进了后屋。等我们过去后，拉拉在我们身后拉上了帘子。


    在环顾四周寻找是否有摄像头或其他人后，我拿出了立方体，此时阿列克转动机制打开了盒子的的一侧。当他这样做时，我看到墙壁有多厚，并听到内部传出嗡嗡声。我把立方体塞进去，他打开得有多快，`Kyrog`
    就就有多快把它关上。


    “我没让他传输出去，但查斯想告诉你们，你们将——引用我的原话——为这件事终生后悔，”尼德告诉我。但我甚至还没来得及松一口气，就听到帘子另一侧传来了沉重的脚步声进了店里。


    “霍华，”一个严厉的声音说。


    “噢，伙计，你知道那不是我的称呼方式，”杜迪马尔说。


    另一个声音几乎没让他说完。“我会用我们妈妈给你的名字来称呼你。”


    “行吧，那我也不用你的名字叫你了，”杜迪马尔说，听起来像个任性的孩子，“我封你为‘屁股大王’。”


    杜迪马尔的兄弟叹了口气。“霍华，”他说，“我来这里只是因为收到报告说有些可疑人物进入了你的店。我必须假设他们在后屋吧？”


    听到这话，我们都面面顾四周，试图看看是否有什么秘密出口或隐藏的避难室之类的。当然，并没有。那里不过是一个被帘子简陋地掩盖的后屋。


    `Clynt` 拔出了他的左轮，但伊莫根摇了摇头。“我们不能因为调查我们就杀掉某个当地守卫，”她低声责道。


    “她是对的，”拉拉说，“我可以制服他。”她掏出电击枪并准备就绪。


    “你们不能回去，”杜迪马尔说，“宇宙的命运正关乎。”


    他的兄弟再次叹了口气，这次更具戏剧性了。“霍华，你到底什么时候才长大？”


    “抱歉，兄弟，我是一个小生意人，”杜迪马尔纠正道，“不是经营生意的小人。而是像经营小生意的男人。而你这该去——”

