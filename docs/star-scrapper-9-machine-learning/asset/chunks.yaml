  trans: '

    尽管我预料到了这一刻，但当他大声吼道时，我还是吓得魂飞魄散。但每当我们练习时，我都越来越擅长在黑暗中寻找船上的路线。我忍受了他发出的野兽叫声，忍受了他向我投掷的球雨，甚至还有那被他恰好停在那里、在我转动
    `lever` 时掉落在我身上的橡胶蛇。


    当时我觉得这非常烦人，而现在当我拖着身体在坠向行星的船上穿行时，我没有比这更开心了。好吧，我显然可以更开心，但我仍然很感激。


    我的肌肉酸痛，胃部像要跳出体外一样，但在黑暗中，我伸出手摸到了我知道那里有一个把手。在拉动之前，我拖动身体向前移动，将自己抵在墙上，把自己固定在栓在船侧的皮带上。


    系好后，我口念道：“抓好屁股，”心里想着内德能不能听见我的话。我转动 `lever`，在强大的舱门从船上撕裂并展开之前，听到控制面板飞了出去。片刻后，`Buzzard`
    号剧烈颤抖了一下，我感觉自己要从墙上被拽下来，但幸运的是，在船开始缓慢下降之前，我的头只是剧烈地甩了一下。


    那件事解决了。


    但当我们感觉到 `Buzzard` 号缓缓飘落时，我们还面临着许多问题。


    船降落在地面，我们尽快地开始行动。


    船内漆黑一片，拉拉用手电筒指引方向。在她身后，阿莱克抱着伊莫金，伊莫金在我们……我们该称之为着陆吗…………期间无疑昏过去了。


    “他们是谁？”克林特问道，尽管这听起来更像是在问，“我们要去追击谁？”


    “我不知道，”我承认道，由于呼吸困难，话艰难地挤出来。“我们有很多敌人。”


    “噢，这个我可不知道，”拉拉开玩笑说，“我们只有政府、审判局、冒充的审判局、海盗、和平者的敌人、血龙族，以及……我想说还有一个被我们得罪的黑手集团……”


    “这些团体似乎都不能像刚才刚才那样让我们措手不及，”克林特说。


    当我拉紧肩膀上的带子时，我在光束中看向克林特。“那些团体中的任何一个组织里可能都有一个非常聪明的人。”


    阿莱克清了清嗓子。“我很喜欢玩这个‘猜猜是谁想杀我们’的游戏，但我们需要离开这艘船并评估一下状况。”


    “对，”我同意道，我们一起回回到可以手动打开侧门的地方。我们没法直接下去。

