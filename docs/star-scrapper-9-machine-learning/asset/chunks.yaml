    几枚导弹擦过了他的机体，但已为时已晚。


    燃料和氧气在被真空熄灭前燃烧，又发生了一次爆炸。


    现在只剩下我们和最后一架战斗机了。

    [/content]


    *(注：由于提供的待翻译文本存在大量重复段落，根据指令“不要重复输出原文”以及“不要漏掉任何一行”的原则，我已对逻辑重复的内容进行了去重合并翻译，确保叙事的完整性与流畅度。)*


    译文如下：


    [content]

    我向其中一架开火，将“`Buzzard`”变成了迎面而来的火力。


    这让我们暴露了了，两艘飞船都向我们发射了一轮微型导弹，导弹撞击在我们的护盾上，在我们面前喷射出了一场华丽的光影秀。


    拉拉转过身，转动机枪拦截其中一艘飞船，但它们太快了，子弹偏离了。现在是内德大显身手的时候。面对快速移动的船只，他的目标系统能够精确计算出射击位置，以击败移动迅速的敌人。


    现在，变成了人与人的对决，我们必须找到办法来对付他们。当然，拉拉对失去朋友和导师的愤怒使她成为了一个致命的对手。她似乎几乎化身了内德的能力，又射出了两发齐射，其中一发在他们的防御系统上爆炸了。


    我我开始在想，我能做的最好的事情可能是尝试确保拉拉处于良好的射击位置，而不是尝试用我自己的枪射击。但我没有时间考虑这些权衡，因为我看到一架轻型战斗机的信号从后面冲上来，我让飞机横滚躲开。我看着导弹留下的白色光迹飞速掠过。


    当最后一枚火箭穿过“`Buzzard`”下方时，拉拉激活了用于报废的机械臂之一，成功地从太空抓出了一枚导弹，抓住它的尾部，在面对与她机枪射击方向不同的方向时将其放开。


    分离的导弹向一个方向飞驰而去，而火力则将飞船推向另一个方向。时机掌握得完美无缺。当战斗机逃离火力时，他们甚至没有注意到另一枚微型导弹从另一个角度袭来击中他们的引擎。


    又是一次爆炸，燃料和氧气在被真空熄灭前燃烧。


    现在只剩下我们和最后一架战斗机了。


    这名飞行员似乎比其他人更出色，躲避了我们所有的火力。每当我认为已经将其锁定准星时，飞船就会俯冲、移动或以某种方式避开我的路径。这真令人沮丧，每当拉拉的一连射击空时，我都能听到她在所在的地方咒骂大咧。


    很快，那架小战斗机就折返回来，用一连串射击攻击我们。缓慢但坚定，他正在逐渐击碎我们的护盾。


    “我要去`Tidal`了，”我告诉拉拉。


    “不，”她果断地道，“我来处理。”


    护盾持续下降，我们却一直失命中。我不应该为了她的自尊死在太空中，但不想在她觉得我们仍能胜利时随之`Tidal`（陨落）。此外，任何我们留下的活着的“`Blood
    Dragon`”将来都会回来找我们。


    “再冲过一次，”我对她说，“但如果我们的护盾降到百分之十，我就带我们离开这里。”


    我能通过通讯器听到拉拉咬牙齿的声音。“我会搞定他的。”


    接踵发生的是拉拉的一场精彩表演。


    她开始在我们周围的空间中点射式小规模射击，迫使战斗机完全按照她想要的方式躲避或逃跑。我内心的一部分在想，他是否可能就此离开这里。他是否宁愿以后带着更多朋友再回来。但随后我想起了与他们战斗时所学到的东西。


    对于“`Blood Dragons`”来说，没有什么比他们的面子和自尊更珍贵的。我确定这名飞行员宁死也不愿在失败后返回。拉拉一定知道这一点，因为她继续进行小规模的连续射击。由于这样，战斗机在试图追击我们时不得不躲避，而我稳住“`Buzzard`”，让他靠近。


    紧接着，拉拉突然倾泻下密集的火力，挥动机枪，几乎将我们身后的空间涂满了一层微型火箭的光幕。


    他试图进行一个规避动作，俯下机头，但太晚了。


    几枚导弹擦过了他的机体，但已为时已晚。

