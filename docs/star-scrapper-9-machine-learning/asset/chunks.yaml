- raw: '“Man, the man is nonstop,” Ned said through the speaker.


    Lara looked at me with a dubious expression.


    “You are the one who said you like to take the big risks,” I reminded her.


    She raised an eyebrow. “You should know better than to ever try and use a woman’s
    words against her.”


    “It literally never works out for you,” Libby added.


    I decided it was best just to not say anything, and a moment later Ammo’s voice
    cut into the room.


    “Hank, my friend, how’s it hanging?” she asked. “Guessing you aren’t calling to
    catch up so where do you need an army?”


    I laughed. “Always good to hear from you, Ammo,” I said. “And you are right. I’m
    going to need a fleet’s worth of backup to help blow up a stolen medical vessel
    that’s being used to convert people into drones for the enemy.”


    “Well, well, well,” she said with a grin. “Don’t you just always bring the best
    action.”


    I shrugged. “Trouble seems to follow me around.”


    “It sure as hell does,” she said. “And I’m guessing you need the big guns?”


    “Yes,” I answered quickly, knowing that we would need all the help we could get.


    She nodded. “I’ll speak with Admiral Huang. But I think you’ll need to go kiss
    his ass soon if you expect him to keep backing you up.”


    “Not really what I’m best at,” I said.


    She beamed. “You’ll have to get good at it if you want to keep moving up in the
    world. You are going to be dealing with more dignitaries and politicians by the
    day, and the more proficient you get at kissing rings, the better.”


    Ammo had made this point before, and I knew she was right. “Sure, I’ll practice
    kissing rings and asses as long as you guys bring some guns to the party tomorrow.”


    She nodded. “I think that can be arranged,” she said but then she leaned in close,
    and her voice got quieter. “But you also need to do something.”


    “What’s that?” I asked, starting to develop a headache from the pain and exhaustion
    my body was dealing with.


    “You need to start bringing a camera on missions like this,” she said.


    I shook my head. “What?”


    “Hank, you have a noble cause, but your PR sucks,” she said flatly. “The Peacers
    have always been good about getting our message out there, but now that there
    is this big bad enemy, no one in the universe believes it. Well, it’s time they
    saw. So, if you are going to take down some kind of factory for making robot soldiers,
    let’s show the people. Politicians will try to deny it, the media might try and
    sweep it under the rug, but if people start sharing it across the feltwork and
    talking, that’ll be progress.”


    I groaned. “I suppose you are right.”


    “I know I am,” she said.


    “I’ll try and get a camera here before the next time we do something like this,
    but I doubt I can get one here before tomorrow,” I said, really not wanting to
    be any kind of celebrity. It was bad enough that I had been thrust into this leadership
    position, but I especially didn’t want to be on camera.


    “You know what’s so funny?” Ammo asked, and I knew that whatever she was about
    to say definitely wasn’t going to tickle me. “I actually had my people leave a
    full slate of camera equipment there the last time I was on the station. So, I
    guess you can start with tomorrow’s mission.”


    Libby squeaked. “So cool,” she said. “I think I want to be her when I grow up.”


    “Okay, fine,” I said. “I’ll start filming.”


    Ammo huffed. “Don’t act like you are doing me a favor,” she said. “I am just trying
    to help you be the person you need to be to actually pull this war off. Whether
    you like it or not.”


    Lara leaned into the frame. “That’s what we are all trying to do.”


    I palmed Lara’s face and pushed her away gently but she stuck out her tongue to
    coat my palm with saliva.


    “Gross,” I said, wiping my hand on my pants. “You’ve been doing that same thing
    since we were kids.”


    “And you fall for it every time,” she said, sticking her tongue out at me and
    then leaving the room. “I’m going to bed.”


    “Maybe you should do the same,” Ammo said, squinting toward the screen and looking
    to examine me more closely. “You’ve also got something just there.”


    She pointed at first to my forehead but then gestured to my entire head.


    “I really should stick with you if I want the good fights,” she said.


    “See you tomorrow,” I said and killed the feed.


    I was so tired that I leaned back in my chair and nearly fell asleep.


    “I’d say you should hit the hay direct,” Clynt said, “but I reckon you should
    splash some water on your… all of you… first.”


    I got up, my body calling out for rest and made my way to my cabin where I passed
    out before even taking off a boot.


    I was awakened sometime later, though far too soon in my estimation, by a knock
    at my cabin door.


    26


    ![](OEBPS/image_rsrc3N4.jpg)


    I had to use the wall beside my cot to force my body up and then nearly fell forward
    toward the door. A few more hours, or maybe days worth of sleep, and I would have
    been right, but this was way too soon.


    Pressing the button, I opened my door and saw Imogen standing before me. She had
    obviously showered and changed and was now wearing the gray sweats we had uncovered
    with the Suniuo Relay Station name and logo printed on them.


    “What’s up?” I asked.


    She looked almost guilty. “I have a favor to ask you.”


    I rubbed the exhaustion from my eyes. “Unless you happen to have a coffee with
    you, I’m not certain that I can accommodate any requests.”


    From behind her back, she produced a mug with the steaming liquid filled nearly
    to the top.


    “Oh,” I said, taking it from her and then taking a quick sip. “Thank you.”


    “I know how to ask for things if I have to,” she said.


    I gestured for her to come in, and she stepped forward, then leaned on the little
    desk while I sat on the edge of my bed in my full armor. “What’s up?” I repeated.


    “This whole thing with John Gregory has me all stirred up,” she said. “Much as
    I hate to admit it.”


    I took another sip. “That makes sense,” I said, wishing the coffee would do a
    better job of washing the morning breath down. “And you want a little time off?”


    She looked at me in surprise. “Oh, hell no,” she said. “I want to keep going.”


    “Oh,” I said. “What can I do for you, then?”


    “You know Sophia?” she asked. “My friend from the village?”


    “Sure,” I said, not sure I liked where this was going.


    Imogen looked away then back at me. “She wants to come help, and I would like
    to give her the opportunity.”


    “Young people, amiright?” Ned said in the earpiece that I had fallen asleep with.
    “They are always so keen to rush right into the action.”


    “I just don’t—" I began, but Imogen’s face dropped.


    “It would really mean a lot to me,” she said, her face pulling down miserably.
    “After how horrible my parents were and that mean old Inquisitor…”


    But I held up a hand to stop her. “Okay, you can spare me the theatrics.”


    “Oh, come on,” she complained. “I think I could have mustered some tears there.”


    I shook my head. “No, you couldn’t have,” I told her. “But if it means that much
    to you, I actually have just the thing for her to do.”


    “Really?” she asked in total shock. “Just like that?”


    “Just like that,” I affirmed. “If it’s important to you, it’s important to me.”


    She stared at me for a long moment as though she didn’t know what to make of the
    things that I had just said. “Thank you,” she said, the words almost falling from
    her mouth.


    “Sure thing,” I said. “But you know what I am going to say next?”


    She shook her head no.


    “You have to look out for her,” I said. “I’ll do my best, but if you want her
    along for this ride, you have to help keep her safe. I’m sure her parents aren’t
    going to love that we are bringing her with us, so you better do your best to
    ensure she returns.”


    “I would have done all that, anyway,” she said, and I knew it was true. But it
    still bared repeating.


    I set the coffee down beside me. “Okay, and I want you two to be sure and let
    her parents know that she will be coming along but not in a combat position.”


    “Wait, what?” Imogen asked.'
