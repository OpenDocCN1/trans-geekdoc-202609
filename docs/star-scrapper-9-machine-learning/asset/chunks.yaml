  trans: '

    “杀了我！”他要求道。“无论我现在变成了什么，都是宇宙的祸害，必须被熄灭。我无法再呼吸一刻。无法再活过一天。不能再让任何人遭受这机器的痛苦了。”


    我向前迈了一步，长矛刺得更深了些。“只有在你告诉我关于`Twain''s operation`的真相后，我们才会好施恩地杀了你。”


    “我乐意告诉你关于那件恶心事的任何事，”他说，“但我对在那之前的事情没有任何记忆。”


    “试着看，”我说。“那些让你保持……嗯，确切地说，不是活着的……的机器人就在里面，你应该能够访问它们。”


    我不完全确定这是否属实，但我想要相信。他用凹陷、浑浊的眼睛直视着我。“如果我把这些信息给你，你承诺会从宇宙中抹除我吗？像拔地草一样，把我的污点拔掉？”


    “看来他那些混杂的比喻还是完好无损，”内德观察到。


    但我点了点头。“如果你能提供任何有帮助的信息，我会确保让你像你这条狗一样被处掉。”


    “我很高兴知道，`Hank Spears`，你身上还有点火气，”他说。“我一直以为你只是个跌跌撞撞陷入这种境地的倒霉笨蛋，但也许你不仅于此。又也许我只是看到了某种`AI`。”


    我摇了摇头。“你真的从没停过，”我观察道。“现在告诉我你还记得什么，如果还有的话。”


    ### 机器的记忆

    他闭上眼睛，过了一会儿再次睁开。“我能感觉到它们在脑子里。我能尝到嘴里的金属味。当我试图呼吸时，我能闻到它们。”


    “故事很酷，”我说。“现在告诉我些实际有用的东西。帮我们对抗机器。根结底，这就是你想要的，对吧？”


    他再次闭上眼睛，厌恶扭曲了他的脸。他深切地恨恶自己变成的样子，以至于宁死也不愿作为一个人类和机器再受一刻苦。


    “我负责过某些事情，”他毫无用处地说。“关于`thengar`的事。”


    “是的，”我兴奋地说。“你本该帮助运送一批货物。但运到哪里？”


    他舔了舔嘴唇，皱起鼻子，仿佛尝到了什么恶心的东西。“快杀了我！”他大声叫道，震得我后退了一步。“告诉我你们要去哪里！”我要求道。“只要你继续浪费时间，你就能活下去。”


    ### 审判者的陨落

    `Inquisitor`闭上眼睛，闪烁的火焰现在向他身后的建筑移动。“我把它记录在日志里！”他说道，仿佛刚刚发现了黄金。“建筑里面有一本有我笔记的书。”


    “谢谢，”我说着转身看向伊莫金。她咧笑着，从他胸口拔出柄流锤，然后将其举过头顶。`Inquisitor John Gregory`最后一次睁开眼睛，看到他曾经的`Acolyte`挥下流锤。虚弱的肉体在击击下崩塌，身体倒了下去。但伊莫金没有停。她不会让他再次回来。一次又一次，她挥下那件东西，直到几乎无所无存。


    我弯下腰，剪开了连接盔甲的带子，将其从他身上剥下。


    （文本继续是汉克、伊莫金和查理之间关于调查和机器本质的对话……）

