  trans: '


    “你打算让你有多少能量武器被毁掉？”内德问道，“这些东西可很值钱，你知道的。”


    “现在不是时候，”我咬着牙说道，身体横跨，用长矛向着隆刺去。`Inquisitor`（审判官）看到了到了攻击，并用快速的挥砍挡住了这一击。我正倒在地上，武器碰撞时产生的火花洒在我身上，在我的脸上烧出了一块块小点。


    我转动身体，左腿向上踢，击中了他的侧面。虽然没多大作用，但迫使他向侧面退了一步。


    还没等我做出下一个动作，我感到侧肋部传来一阵剧痛。我掉了半把手枪，用手指按住肋骨处盔甲的一处缺口，同时半心不在焉地挥舞着长矛。


    我必须站起来。


    但我从余光中看到手套上闪烁着血迹。


    我是怎么受伤的？


    接着，我想起了那个`Vekrass`。


    当这个`审判官`向我逼近时，另一个正从所谓的阴影中发动攻击。


    我再次用长矛刺去，但这一次，`审判官`抓住了尖端下方的矛杆并用力拉。


    他没能把武器从我手中夺走，但他迫使我用双手抓住它。


    侧腹又传来一阵疼痛。


    我环顾四周，看看能否发现攻击者。但在那短暂的瞬间，我上方的`审判官`挥剑向我袭。我滚身躲，剑划在我的护肩上发出滋滋声。接着他用刀刃劈砍，我缩了了一下，但头侧被削了一道新的口子。


    我踢出一脚扫中他的腿，力道刚好将他绊倒。


    就在他倒下的时候，我正站了起来，这一次我恰好捕捉到一个模糊的残影，意识到那是一把向我飞射来的飞刀。


    我俯身躲开，感觉自己快又要去平均“新发型”了。但当我朝我认为刀飞来的方向看去时，什么也没看到。


    我身边的`审判官`正站起来，我向他刺去，当他挡住我的攻击时，将他逼回了地面。我试图再次刺刺，但另一把刀向我呼啸飞来，击中了我的胸甲，甚至似乎削掉了一块碎片。


    我不禁再次寻找攻击者，但结果依然一无所获。


    这个`Vekrass`真的开始让我火大了。


    也许是我的耐心耗尽了，或者是因为我准备好转移注意力，但我意识到现在可以结束战斗了。我手越过腰部，用左手抓起侧间那把大威力手枪（stomper），对着倒在地上的`审判官`倾泻了几发子弹。


    “主意不错，印迪，”内德说道，但我已经把注意力转向了`Vekrass`所在的位置。或者说，至少是我认为他在那里。


    瞥向另一侧，我看到阿莱克（Alek）倒在地上，不确定他是否还好。我的脑海飞速运转，试图决定该怎么办，但知道自己并不知道那个掷刀手在哪里，于是我决定朝朋友的方向冲去。


    下一刀击中我大腿的刃导致我踉跄了一下，摔倒在`Kyrog`（克罗格）身上。但当我倒下时，我感觉到他还在呼吸。所以，这算是个好。


    没看到阿莱克有任何外伤迹象，我转过头试图感知攻击者的位置。


    我在余光中捕捉到一个模糊的残影，但无法确定那是什么。


    我举起手枪，朝着模糊的方向开了了两枪，但知道那里什么也没有。


    “你能看到视觉目标吗？”我问内德。


    “也许如果你朝一个方向看超过几分之一之秒的话，”他说，“我可以处理你提供我的所有数据，但面对几帧模糊的画面，我能做的事情有限。”


    我退后了一点，躲在一块被炸开、正竖立在地上的墙碎片后面。

