  trans: '


    拉拉拍了拍我的肩膀。“尽管我们经历了这一切，我有时还会忘记在这一切之前你只是个靠打生活的家伙。你没能像我当一名赏金猎人那样体验过这个宇宙。”


    “我也见过一些东西。”我耸了耸肩。“但仅仅是这些……我不知道。”


    她没有说话，给了我机会继续说下去。“这根本就不合逻辑。这事对他们来说是如此重要，关乎生死，但外面的世界还有那么多事情需要担心。”


    “但这个星球的人们并不知道这一点，”拉拉说道，“他们还不知道即将到来的威胁……即便他们知道了，可能也并不在乎。正如你所说，这对他们来说非常重要。对公司的人来说，这是养活家人的生计；对当地人来说，这是他们的家。对这两组人来说，这感觉都关乎生死，因为在非常真实的意义上，它确实如此。”


    “她只是白白把他们带进了这一切，”我喃喃道。


    她的手从我的肩膀移到了我的后颈。“那是他们的选择，”她向我保证道，“他们做了认为对自己和族人最好的选择，尽管我们警告过他们。老鬼，你甚至给了他们离开这块破石头的机会，而他们没有接受。别在这件事上纠结太多。”


    我对着她笑了一下。“我的工作不是大多数时候都在劝你冷静吗？”


    她捶了捶我的二头肌。“我很确定我一直在很冷静，”她说，事实确实如此。随着每一天的流逝，她那种发火或暴大霆的本能正在减弱。这并不是说这种情绪完全消失了，但感觉那根药引似乎变长了。


    “你还好吗？”我问。


    她前后摇了摇头。“我提到过有多么讨厌这里吗？”


    “噢，该死！”克林特说道，一掌拍在他支撑的横梁上，我开始减慢越野车。


    “怎么了？”我问，担心他是迷路了。


    他愤怒地用爪子敲横杆。“我真的很想看看那些小家伙。”


    “什么？”拉拉问。


    我翻了个白眼，他说道：“不管那些箱子里的大蜥蜴是什么。我想看一眼，但刚才的混乱把这从我脑子里完全抹掉了。”


    “那不重要，”拉拉叹了口气。


    但他哼了一声。“对我来说很重要。我喜欢看外星的小型生物。”


    “我们不回回去了，”我说，预判了我认为他接下来要问的问题。“我只想回到船上，赶紧离开这个鬼地方。”


    “但下次如果我们落在另一个外星星球，我们会尝试去逛逛动物园，”拉拉用讨好的语气提议道。


    我再次开车，克林特指着路，嘟着嘴。


    我们开了似乎像一永恒那么久，但最终我在远处看到了“秃鹫”号。


    尽管我们在这个星球上停留的时间很短，但回到船上是一个巨大的解脱，我们三个人几乎是跳下越野车，冲进了“秃鹫”号。


    “阿莱克！”我喊道，但我的声音在空间里回荡。“伊莫根！”


    船上什么看起来都不对劲，也没有东西看起来被偷了，但我知道船上有灵魂和没有灵魂时的区别。


    而现在，上面没有。


    10


    ![](img/image_rsrc3N4.jpg)


    “我们必须找到他们！”我大喊道。


    克林特看向我站在打开舱口的地方。“我可以休息一会儿，”他说。“我们可以一直等到早晨。”


    我想说，正是这种话才让伊莫根对他有很大意见，但拉拉从外面的灌木丛里向我们喊道。


    “这里有脚迹，”她喊道。


    尽管克林特在嘟着抱怨，但他也跟了上来。


    “没错，”当他落在地上，在我手电筒的光下观察脚迹时确认道，“那是阿莱克的脚迹。”


    “没鬼，”拉拉说。“还能告诉你什么？”


    他贴近地面，深吸了一气。“他们的同伴闻起来像我们刚离开的那些当地人。”


    我在黑暗中跑汽车，希望太阳早点升起，但记得领领告诉我这里的夜晚长得惊人。


    克林特跳回他的位置，我转动越野车，然后顺着脚迹走向无尽的荒原。


    这次我们谁都没有说话。没有笑话或之类的，只有我开车时的寂静，但没多久，克林特再次敲击横杆，示意我减速。


    “我们已经足够近了，”他说跳下车，“熄火，我们步行溜进去。”


    “我们？”拉拉怀疑地问，大拇指指着我的方向。


    我双手交叉抱在胸前。“需要我可以溜进去。”


    “你当然可以，”克林特用一种介于真诚和嘲讽之间的语气说道。“但你可以直接从这里靠近，让专业人士从其他侧溜进去。我们中任何一个人看到什么，就像猫头鹰一样叫两声。”


    “那会非常可疑，”拉拉指出。


    克林特耸耸肩。“那就一直刺，直到我们把朋友找回来。”


    “听起来像个计划，”她同意道。


    我想反抗一下，但我没力气了。


