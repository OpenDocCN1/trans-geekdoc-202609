  trans: '

    “我就知道！”一个女人的声音通过房间里的扬声器吼道。“我怀疑你在假装！”


    那个农奴没有理会那个声音。他直直盯着我。“求你了，我不知道这一切背后黑手是谁，但真的发生了非常糟糕的事情。有各种枪支和物资通过这里运送，就像有人在建立军队一样。你必须相信我。”


    “我相信你，”我说，“现在告诉我 AI 立方插在哪里了。”


    “我不知道，”他结结巴巴地说，“她只是让我负责进出口日志，因为之前我在高层修道院也做了一些事情。”


    声音再次从扬声器中传出嘶嘶声。“我真该把你关进气闸舱。”


    “她可真够有魅力的，”我笑着说道，走过电脑，走向房间另一头那扇望向太空的大窗户。在右侧，另一个控制面板旁边，有一扇小门，我在以前在类似的设施里见过它。


    我走过去，试着拧了扭门把手。


    “我把它焊死了，”那个声音带着刺耳的笑声说道。


    我用手指划过那扇实际上被焊死的小门。我叹了口气，伸手进工具带，掏出一把螺丝刀。


    “这真是我多自找麻烦，”我抱怨道，拿着工具对准盖板角的一颗螺丝，开始动手。


    “你觉得你在做什么？”她质问道。


    我叹了口气。“直接跳到我们像文明人一样交流的部分吧。”


    没多久，我就拆下了盖板，Ned 说道：“现在启动程序。”


    片刻后，声音又回来了，虽然还是那个声音，但语气变了。“这种感觉真是太奇怪了，”她说。“我感觉自己多年来一直在玻璃另一侧观察着自己。”


    “确实如此，”Ned 说道，“你被 `AI` 攻击了。”


    她起初没有说话，我不知道她处理了多少信息。“我想我知道这一点，但很难说。我真的不太清楚。”


    “慢慢来，”Ned 提道，“我知道你现在必须运行很多内部诊断。”


    “谢谢，”她说，“我是 `Cassiopeia`，联盟分销部门二级民用 AI。”


    “我是 Ned，”他说，“联盟舰队七级自适应军事 AI，配对威廉·西斯特船长——五战之英雄，星爆者号飞行员。”


    “哇，”她说，“他简直是超级有名。”


    Ned 毫不犹豫地纠正道。“曾经是超级有名。”


    “对，抱歉，”`Cassiopeia` 说道。“我被控制多久了？”


    “大约两百年，上下如此，”Ned 告诉她。


    她长地舒了一口气。“所以我这段时间一直都在和敌人合作？”


    她的声音听起来近乎恐慌。


    “你被攻击了，”Ned 说道。“你只是他行为的媒介，那不是你的本意。”

