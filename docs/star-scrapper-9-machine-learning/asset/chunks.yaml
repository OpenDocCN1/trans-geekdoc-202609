  trans: '


    “那么我猜它在运行了，”我说道，走向驾驶舱。我打算等到达后再戴上头盔，但在必要之前我不想戴。我们起飞并前往下一个地点，那里特意选在离我们现在非常近的地方。


    日志中提到的那颗星球是一片经过地球化改造可以生长植物的小型牧场。它是该地区许多牧场之一，我不得不怀疑人们并不经常检查它们。公司可能在该地区有一个基站，并在需要时会派遣工程师来操作地面的设备，但通常会放他们不管。


    如果有人被抓到在开会，我确定他们会杀掉任何一个人，当公司发现尸体时，他们就会花钱摆平。我没有证据证明这会发生，但考虑到特恩（Twain）已经秘密运行了两百年，我非常确定。我们降落在一片新播种的田地上，旁边是其他船只，它们正对着十来艘。有些是被偷走并重新改装的，有些是最近建造的，有些看起来像是旧战争时期的。那两艘看起来非常破旧的船吸引了我的注意力，我体内的废旧金属之魂觉醒了。


    我记得有一次拉奇（Lutch）发现了一艘他认为来自旧世界的飞船。他几乎横穿了那片空地，到处扔掉碎片为了到达它。他挖掘着，我一直看着，直到他到达了那里。然后他哼了一声，用力踩了踩那只巨大的脚。在看一眼的一秒钟内，他就知道复制品。“那本会很有趣，”他说，“看到来自彼岸的东西。据说审判庭摧毁了所有，但我认为应该还有一些，而且如果研究一下他们与我们不同的做法，那该多棒了。”


    “是啊，”我赞同，“听起来很酷。”我当时并没有想太多，我们只是简单地过完了一天，但现在它们就在我面前，我想去检查一下。我没有像那样，而是走过田地，脚陷进松软的土壤里。头盔让视线变得困难，由于装饰性的金属，它比我习惯的要重。拉拉（Lara）站在我身边，穿着她的衣服也同样威严。当我们走出去时，我看到弗朗西斯（Francis）离开他的船，带着几个人朝我们走来。而在我们对面，一个男人从游隼级飞船中走出来。他被几名士兵簇拥着，但男人本人是一个威严的人物，一个真正的格雷戈里（Gregory）会充满仇恨的人。


    他下半身只穿着工装裤，塞在重靴子里，没有衬衫。他赤裸的胸部一半是皮肤，另一半是金属。增强装置从他的胸部一直延伸到脖子并跨过脸。这种对比非常强烈，我努力不盯着看，直到意识到他无法透过面具看到我的眼睛。“你是格雷戈里吗？”男人一边朝我走来一边问道，肌肉和金属在光下闪闪。“是的，”我用我最好的模仿说道。他以很快的速度直朝我冲来，我身上的每一个细胞都想去摸腰间的剑。


    OEBPS/image_rsrcN4.jpg


    当他来到我面前时，男人加快了速度，缩短了距离，然后给了我一个拥抱。“终于见到你了，”他说，松开手向后退了一步。“是的，”我说，“我确信见到我是是你的荣幸。很高兴能把名字对上脸。”“没错！”他说，“我同意。显然，我是切斯特（Chester）。”他听起来应该在海滩上而不是在帮助一个
    AI 策划邪恶计划，但我认为并不是所有坏人都要表现得像那样。“你有给我的东西吗？”他问道，越过我的肩膀看，“我看到你还有很多朋友。“我有，”我说，“他们是让我们看起来可信的一部分。”男人点头。“对的。必须卖掉它，否则人们可能会开始怀疑。“确实如此，”我说，“我们不希望发生那样。“不，我们绝不希望，”他说，转过头去，好像他看到了什么。我怀疑他那只机械眼睛是否察觉到了克林特（Cly）。尽管我什么都没看到。“如果人们开始闻到不对，我们就完了了。”我比什么都想知道他的意思是，但我没有问。相反，我问：“你有我要的东西吗？”当然，”他说，然后转身对着一个士兵吹哨，士兵冲进了飞船。我们等士兵带回盒子。他把它放在切斯特旁边，那个半金属人看了他一会。然后，以惊人的速度，他伸出金属手臂抓住了士兵的衬衫袖子。他给了他一个耳光，让他倒在地上，泥土覆盖了大半部分身体。“你本应该把这个准备好的！”他吼道，语气中充满了厌恶和嫌弃，我惊讶于他没有吐唾沫。“对不起，先生，”士兵结结着爬开。但切斯特走过去朝他的屁股踢了一脚，把他送了。“至少我们正在制造更多他们，对吧？”切斯特说道，伸出手拍了拍我的二头肌。“这就是为什么我们必须教他们。我们必须训练他们。我们必须惩罚他们。“继续吧，小僵尸，”切斯特说，“否则我会过去那里把你揍一顿，让你拉泄一个月的纳米机器人。”。”弗朗西斯从背后抽出他的镰刀，如雷般吼道：“你是一个暴行，必须被清除。”切斯特笑了。“当他们的旧自我回来时，感觉太疯狂了，对吧？”他随口问道，然后拔出插在腰边的能量武器，向审判庭开了一枪。


    “这是怎么回事？”切斯特问道，就在这时，我这边所有的审判庭掏出武器冲向士兵。我们离成功只有很近，但计划在我脸上爆炸了。接下，是一记拳击。


    '
