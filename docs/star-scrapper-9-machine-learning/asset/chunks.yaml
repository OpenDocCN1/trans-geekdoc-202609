  trans: '

    与其他大多数地方不同，那里通常会立刻看到围观的人试图弄清楚发生了什么，但这里的每个人都很有礼貌，假装完全没有注意到那些推着担架、向街道冲过去的守卫和医护。


    “我是亨特·维克斯（Hunter Vex），这位是亨特·斯皮尔斯（Hunter Spears），”拉拉对紫色斗篷人说道，“我们刚来向我们的猎隼人报到，如你所见，她伤重了。”


    “她对发生的事情说些什么吗？”那个女人问道。


    拉拉摇了摇头。“她低声呢喃了一些，但和发生的事情无关。”


    “听到这个消息我很遗憾，”那位斗篷人说，“你知道她是否有任何敌人吗？”


    我看着拉拉在思考，她在考虑我们得罪了陷猎者这件事实，而他们正冲我们冲来。考虑我们虽然有针对某些人的口头证据，但不知道具体是谁，而且他们把我们从天空中击落了。


    但她这些一个都没提。


    相反，她耸了耸肩。“如果你认识泽诺比亚娅（Zenobia），你就知道她为人事非常谨慎。”


    女人的嘴唇紧了紧。“我不怎么熟悉她，只是面之交，”她说。“对于你们的遭遇我感到抱歉。如你们所知，议会（Conclave）严禁暴力，此事将得到积极调查。我们将不遗漏任何细节。”


    “谢谢，”拉拉说道，用手背拂过脸颊。


    “但让我提醒你们一下，”紫色斗篷人警告道，“我们是调查人员。我理解你们很愤怒，狩猎是你们的职业，但在议会，这是我们的工作，如果你们以任何方式阻碍我们的调查，也可能被起诉。”


    “我们明白，”我说，但她正盯着拉拉。


    “我们明白，”她重复道，那个女人点了点头。在她身后，泽诺比亚娅被带离了办公室。那个女人回头看了一眼，然后看向我们。“她会和医生在一起，等你们可以见她时他们会通知的。”


    拉拉点了点头，眼睛追随着泽诺比亚娅沿街道走远。她看起来很想冲过去追上担架，就像一个孩子追赶刚刚告别的父母。但她停留在原地。


    “谢谢，”她对紫色斗篷人说，“如果需要任何帮助，请务告诉我们。”


    “同样，如果你们想到了其他任何对我们的调查有帮助的事，请告诉我们，”那个女人简短地了点头，然后转身大步走而去。


    我转向拉拉。“我太——”


    但没等我说出下一个字，她就开始靠在我的胸口剧烈地抽泣起来。


    “都是我的错，”她呻吟着，我知道即使事实并非如此，她也会有这种感受。我本可以尝试说服她她没有责任，陷猎者这样做是为了报我们两个人的复，而且是因为他们违反了议会的规则采取了行动，但她很清楚这一切。


    她现在需要的是发泄自己的情绪。


    我抱了她很久，她的身体在我怀里颤抖，直到她宣泄完毕。当她抬头看向我时，她满脸泪水，双眼通红。


    “想回去——”

    '
