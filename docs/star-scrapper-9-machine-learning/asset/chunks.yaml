  trans: '

    我们都把武器指向空间远端的一扇大门，噪音似乎是从那里传来的。索菲亚也把相机对准那里。她的整个身体因恐惧而颤抖。


    伊莫格看到我的眼神，转向她的朋友。“你还好吗？我们会保护你安全的。”


    “不是那个问题，”索菲亚说，“是我们在所处的地方。”


    伊莫格困惑地看着她。“怎么了？”


    “我们在太空里，”她说，“如果万出了什么差错，或者你们开始开火，我们可能会被吸进那无尽的真空中，在那里死掉。我不想窒息或冻死。”


    伊莫格对她笑了笑。“你很快就会停止想这些的。”


    “我永远不会停止想这些的，”她说，我在想这是否是真的。这个女孩生长在开阔的陆地上，完全没有太空旅行的经验。她在空间站上表现得挺冷静，并生存了下来，但我猜，在太空中感到不安全的感觉终终是不一样的。就像被困在一条知道满是鲨鱼的水域中的木筏上。


    “这种地方有很多安全装置，”我说，试图安慰她，但我能看出她完全陷入了自己的思绪中。“我们继续移动。”


    但在我们到达房间另一侧之前，一个穿刷手服的男人走了出来，正掉手上的橡胶手套。当他抬头看向我们时，他愣住了，我们都保持着武器直指他。


    “你好，”我带着友善的微笑说，“为什么不过来和我们谈谈呢。”


    他的眼睛在在我们所有人的武器之间闪烁，我能看到他决定转身试图从门口跑回去的准确一刻。


    拉拉也看到了，在他迈出第一步之前，她就用一颗子弹贯穿了他的膝盖骨。


    他大叫起来，倒在地上。“你们为什么要那样做？”他一边哭一边抽着鼻涕问道。


    “你为什么要跑？”拉拉问，声音冰冷如霜。


    他看着我们，举起双手，表现得好像我们没法直接用子弹贯穿他的肉体一样。


    “任何清醒的人面对武装歹徒入侵自己的工作场所都会逃跑的，”他说。


    我笑了。“关于这一点你说得有道理，”我承认道，“但现在我得问你，这是一个什么样的工作场所。”


    他看着我，仿佛我是地球上最大的笨蛋。“这是一家医院。”


    我难以置信地盯着他。“你真的认为那是事实，对吧？”我问。


    “那是事实，”他陈述道，语气如此绝对，至于让人很难相信我们对付的是任何理智的人。当然，我们不是。我们对付的是一个已经被同化为“因恩信徒”的人。他显然不是那种尚未完善的遥控类型，而是那种原始的、半自主的类型。


    “那么带我们去你们存放病人的地方，”拉拉要求道。


    他摇了摇头。“我的职责是不伤害，”他说，“我不会带你们去可以伤害他们的地方。”


    “你才是那个伤害他们的人，”伊莫格咆哮道，语气中混合着激情与厌恶，“你才是伤害他们的人。”

    '
