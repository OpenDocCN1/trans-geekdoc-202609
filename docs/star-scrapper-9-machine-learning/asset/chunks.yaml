- raw: '“I had to in order to survive,” she said. “Out here, as the company has come
    and sapped the life from our world, I had to get smart or get dead.”


    “I guess it was the same for me,” Imogen said. “I was raised by wolves, and when
    they didn’t like who I was, they threw me to other wolves.”


    Sophia cleared her throat. “And now?”


    “And now I am doing something that matters,” she said with absolute certainty.
    “I feel as though I survived everything else so that I could be a part of this.”


    It was heartening to hear her say that. I believed it about her, but there was
    something especially moving about the confirmation.


    “What is this?” Sophia asked.


    Imogen wasted no time in answering. “Saving the universe.”


    The other girl giggled. “You’re serious?”


    “I am,” Imogen said. “There is a threat out there much bigger than anything we
    have known since the Old War.”


    I was keen to hear what Sophia would say next, to learn what people out here would
    think when they learned something like this. But her reply was not at all what
    I expected.


    “Do you ever think about trying to get your parents to help with this cause?”
    she asked.


    “No,” Imogen stated unequivocally. “Weren’t you listening to everything I told
    you about them?”


    “Of course I was,” Sophia answered immediately.


    I could hear the confusion in Imogen’s voice as she asked, “Then why ask me that?”


    “Before I answer, can I ask one more thing?”


    “Sure,” Imogen said, sounding a bit impatient.


    “Do you think that two politicians of your parent’s caliber could help your cause?”
    she asked.


    Imogen huffed. “Of course.”


    “And is that something you think about?”


    “Naturally,” Imogen answered.


    I could hear the satisfaction in Sophia’s voice as she said, “And that’s why I
    asked you. Not because I thought that you wanted to beg the people who destroyed
    you for help, but because I thought it might be something that you struggled with,
    and I wanted to give you space to open up about that.”


    Imogen was quiet, obviously contemplating what the other young woman had said.
    “I guess I never gave that bit much thought,” she said softly after a moment.
    “I consider the thing but don’t give any credence to what toll that consideration
    takes on me.”


    “Safe to assume that it’s a lot,” Sophia said. “Sometimes we don’t even realize
    the damage we are doing to ourselves by struggling with the superfluous stuff.”


    In my mind, I could see the face of wonderment Imogen wore. “Who are you?”


    “Just a girl from some backwater planet,” Sophia chuckled.


    “You are so much more than that,” Imogen announced. “You are too good for this
    place.”


    “On that,” Sophia said, “we agree.”


    Neither spoke, and the fire crackled in the near distance.


    “Do you think your boss would let us come with you?” Sophia asked finally.


    That question was loaded and a half. For a start, I didn’t think of myself as
    anyone’s “boss” in the way she used it, though I was undoubtedly the captain on
    the Buzzard and, now, a leader of what amounted to a Peacer sect… or maybe I was
    a boss?


    And the second consideration was the question itself. I had offered refuge to
    the last group of locals, and they had shot me in the chest, so my inclination
    was to say no right off the bat.


    “He’s not my boss,” Imogen said, mirroring my own thoughts. “Not like that. He’s
    just a guy trying to do right by the universe. It’s mad, honestly. I sometimes
    look at him and just see the scrapper who got sucked into something far beyond
    his ken, and other times I see this person who might honestly save us all from
    certain death.”


    “That’s one hell of a dichotomy,” Sophia said, and I could hear her smile.


    And she was right. Both of them, and everything that they were saying was right.
    Some moments I still felt like just some guy who should be repairing battery coils,
    and others I felt right at home leading a group of rebels against their corporate
    overlords.


    Not that this revelation mattered in the moment.


    What mattered was getting off this planet, getting the cubes back to Edwin, and
    then trying to figure out who was trying to kill us.


    “Reach for the sky,” I heard Clynt say, and I knew that the moment was about to
    change.


    My brain wanted my body to hop to my feet, but unfortunately, the best I could
    do was groan into a standing position and feel like I needed a breather. But I
    forced myself forward, pulling out my stomper but keeping it by my side.


    Imogen and Sophia stared up at me, their eyes going wide, looking like they had
    been caught sharing a cigarette by their dad. Sophia wore a well-stitched outfit
    that seemed perfect for the conditions on the planet. Brown hair framed a pretty,
    youthful face only slightly leathered by the environment of this place.


    They both stood, and Sophia lifted her hands in fear. She wore a gun on her hip
    that seemed to be in much better repair than the last tribes’ and some kind of
    scanner or reader on the other side. She stared at me in terror until Imogen reached
    up and pulled one of her hands down, drawing her attention.


    “You don’t have to worry,” she said. “This is the man I was telling you about.”


    “Oh,” Sophia said, confused but relieved.


    Imogen turned to Clynt, who was standing by the fire with his revolvers leveled
    at the group of locals. “And you, quit being an asshole!” she shouted. “These
    are my friends.”


    “It’s true,” Alek said, hunching to step from one of the tents.


    “How are you feeling?” I asked Imogen since she had been only half-conscious the
    last time I had seen her.


    She looked to Sophia and then to me. “Better.”


    “Good,” I said. “Ready to get out of here?”


    She paused longer than I had expected and then folded her arms across her chest.
    “Actually, there was something I wanted to ask you…”


    “You want to know if we can take these guys back to the station with us?” I posited.


    Rather than being happy that I had correctly guessed the question, she narrowed
    her eyes at me in an accusatory way that suggested she guessed that I had been
    listening in on their conversation.


    “That’s right,” she said.


    Sophia stepped forward, cutting the tension by extending a hand. “Hi, I’m Sophia,”
    she said.


    “Hank,” I said.


    “Why don’t you come meet my father?” She guided me to the fire, where everyone
    was still looking nervously at Clynt, though he had lowered his weapons.


    “Doctor Charles Forks, this is Mister Hank,” Sophia said.


    I smiled and nodded in his direction, then shook his hand as I said, “Hank is
    fine.”


    “You can call me Charlie,” he said. The man’s once-black hair was in a losing
    battle with white streaks, and his face was wrinkled and tired.


    “I’m impressed that you were able to get a doctorate out here,” I said, hoping
    it would come across as funny rather than dickish.


    He grinned. “I wasn’t always a ’facer,” he said.


    A woman stepped over and laced an arm through his. “Charlie went native.”


    I stared at the two of them. I felt like I understood what had happened. “You
    were some kind of scientist for the company and then fell in love with the locals,
    but due to the obvious... cultural divide... you had to pick sides?”


    “That''s it, exactly,” Charlie affirmed. “Somewhere up there is a fully furnished
    mansion that I was offered at the onset of my contract, but that I never once
    stepped foot in. Love will make you do some things you never thought you would.”


    I nodded knowingly. “It certainly will,” I agreed. “And so you''ve lived out here
    for quite some time as a result?”


    “I have,” he said, patting some dirt from his jacket. “And I was not one of those
    people who enjoyed adventure travel before I came here. If I''m honest, I fought
    tooth and nail to get any other assignment in the company, but I had pissed off
    the wrong manager and ended up getting sent here as a result.”


    “And now you can''t reckon livin’ anywhere else?” Clynt asked.'
