- raw: 'And now, they were obviously planning to repay her in kind.


    The fact that the assassin was here tonight meant that there were leaks amidst
    her contacts, and some of her little birds were, in fact, songbirds for her enemies.
    This was good to know. It was important to expose the enemies within your ranks
    before trying to move on to the enemies without.


    But in order to do that, she would have to survive whatever this was.


    The wind picked up, causing some leaves on the patio below to rustle. Again, whoever
    was in her room took another step, masked nearly entirely by the ambient noise.


    These trappers were so good. Their stealth was matched only by the most skilled
    Vekrass, and their ability to strike and escape was second to none.


    Even the fact that this person had reached her room without her knowing was a
    testament to their skill. Had she enjoyed one more glass of wine with dinner or
    been in a slightly deeper sleep, she would be descending the Conecio Steps right
    now to join her ancestors.


    But now that she had awakened, she had a choice to make.


    Would she say something and possibly give this assassin a chance to escape? Would
    she wait until they got close enough to attack and risk a nick from a poison blade?
    Or would she leap out of her bed and attack her attacker, trying to get the upper
    hand and hope for the best?


    Every option had risks, and every option had the possibility to succeed.


    But what had made Alana such an excellent hunter had been her decisiveness in
    the face of peril.


    She had once faced down a pack of Andashi vipers and only survived because she
    made the choice to grab the first one she saw by the throat. That choice would
    have ended the lives of any number of people before or after her, but it had contributed
    to her greatness by making her legendarily brave.


    Unfortunately, in later years, people had taken advantage of this fact, putting
    her in positions where she would have to be brave to keep up with her reputation
    and make choices that would otherwise not have benefited her. She wondered if
    this was one of those times. If this person was expecting her to leap out of bed
    and attack.


    Perhaps the only reason that she had heard them at all is because they wanted
    her to, wanted her to wake up just enough to make a mistake. But as she was making
    these calculations, she also knew that the person was getting closer to her. Every
    moment she lay awake, pondering what to do next, was another moment she was losing
    her advantage.


    Foolish or not, predictable or not, she leaned into her reputation and attacked.


    Throwing the light blanket she had draped over her in the direction of the noise
    as she sprang up, she pulled out the knife whose handle always stuck ever so slightly
    out from under her mattress.


    The shape under her blanket fell backward and thumped onto the ground.


    She sprang forward, holding the blade horizontally and readying it for a throat.


    The figure said something unintelligible at first before she realized it was her
    name. Pulling the blanket off, she saw… and smelled… Mane Malik.


    “What are you doing in my house?” she demanded. “Speak now or die.”


    He hiccupped, and she smelled all of the various concoctions he had imbibed throughout
    the evening before ending up on the floor in her room.


    “I will not ask again, Drinky,” she said.


    “I just came here to be safe,” he said, sounding sincerely frightened. “But when
    I saw your lights were off, I thought I would just lay on the floor so that I
    didn''t bother you.”


    She looked at his miserable face, seeing the bruising under his eye, the trickle
    of blood from his nose, and the fat lip.


    “Who did this to you?” she demanded.


    He shook his head, looking guilty and ashamed. “I didn''t get a good look at them,
    but there were three. There would have to be if they expected to get one up on
    me.”


    “Leave your measuring tape at home,” she snapped. “You know I''m never interested
    in that. What I am interested in is the facts.”


    “Well, it started with me shopping for a new codpiece and catching the eye of
    one of the lovely young⁠—”


    “Mane,” she seethed. “I will finish what they started if you don''t skip ahead
    to when you left the bar and were ambushed.”


    He pouted. “Well, that''s pretty much the long and short of it. I had a few too
    many, and as I made my way back to my estate, cloaked figures jumped out of the
    shadows and attacked me at once.”


    “Where was your apprentice?” Alana asked, though she knew it carried the tone
    of an accusation. “Shouldn''t she have been by your side to ensure this kind of
    thing doesn''t happen?”


    “I wasn’t going to have her come with me on a date,” Mane said. “I mean, she might
    like to watch, but I haven''t asked that yet.”


    She stared at him for a long time. He was one hell of a good bounty hunter, but
    she couldn''t tell if he was an actual idiot or stupid like a fox. Though, in
    a conversation like this, she tended to believe it was the former.


    “And did they say anything?” she asked.


    He shrugged. “They just told me that I should stick to bounty hunting. I know
    it’s because I have ambitions to sit on the Council of Six.”


    She knew that it had nothing to do with that, and the comment was a warning. A
    veiled threat. But this was a brazen act, even for the trappers. Attacking Zenobia
    in her office and then jumping a rank five in the street. These moves were unprecedented,
    and it made her think that there was far more to this story then she had initially
    thought.


    She was happy to have brought Syn Kel Kal’s old apprentice into the fold, knowing
    that the young woman would undoubtedly have more insight into what happened than
    she even realized.


    Alana knew that they were all connected, that there were threads here that she
    just couldn''t see yet but that she would need to uncover. That is, if she survived
    long enough to do so.


    They had killed a Falconer and attacked a hunter in one day. And she knew that
    they would stop at nothing until they finished whatever they were playing at.


    “You should call an emergency meeting of the Council,” Mane said.


    She shook her head, knowing better than that.


    Instead, she walked over to her balcony to watch the sunrise over the city that
    she loved. The city that had made her everything that she was.


    When she turned back to Mane, he had, in fact, fallen asleep on her floor. He
    was right about one thing: she would make sure he was safe here.


    After descending her steps and dressing herself, she called one of the Purple
    Cloaks to stand guard by her front door and beckoned the other one to join her
    as she marched into town.


    He did as instructed, falling into place just at her shoulder.


    This early in the day, hardly anybody was awake, and she was able to cut through
    the estates and across the city in no time. She strode right up to the tavern
    where the statue of a nude man wrestling a bull welcomed all its guests.


    “Purd!” she shouted the moment she stepped into the room. “Purd Pak!”


    The man looked up from behind the bar and smiled from under his moustache.


    “Alana Torg’an,” he said. “To what do I owe this unexpected pleasure?”


    The way he smiled, like a shark, made it obvious in just a few words that he knew
    everything the trappers were doing.


    She knew that she had to play this just right. In an instant, she had gone from
    wanting a fight to wanting to outmaneuver him. She had loved bounty hunting but
    enjoyed politics nearly as much.


    “I just wanted to remind you that we have our Consular Questioning later this
    morning,” she said with a false smile plastered on her face.


    He met her smile with one of his own. And then drained a shot glass of gold liquid
    down his throat. “I’m getting geared up for it as we speak,” he said. “Can I offer
    you some breakfast?”


    He pointed to more of the glasses arranged on the bar.'
  fmt: '

    And now, they were obviously planning to repay her in kind.


    The fact that the assassin was here tonight meant that there were leaks amidst
    her contacts, and some of her little birds were, in fact, songbirds for her enemies.
    This was good to know. It was important to expose the enemies within your ranks
    before trying to move on to the enemies without.


    But in order to do that, she would have to survive whatever this was.


    The wind picked up, causing some leaves on the patio below to rustle. Again, whoever
    was in her room took another step, masked nearly entirely by the ambient noise.


    These trappers were so good. Their stealth was matched only by the most skilled
    `Vekrass`, and their ability to strike and escape was second to none.


    Even the fact that this person had reached her room without her knowing was a
    testament to their skill. Had she enjoyed one more glass of wine with dinner or
    been in a slightly deeper sleep, she would be descending the `Conecio Steps` right
    now to join her ancestors.


    But now that she had awakened, she had a choice to make.


    Would she say something and possibly give this assassin a chance to escape? Would
    she wait until they got close enough to attack and risk a nick from a poison blade?
    Or would she leap out of her bed and attack her attacker, trying to get the upper
    hand and hope for the best?


    Every option had risks, and every option had the possibility to succeed.


    But what had made `Alana` such an excellent hunter had been her decisiveness in
    the face of peril.


    She had once faced down a pack of `Andashi` vipers and only survived because she
    made the choice to grab the first one she saw by the throat. That choice would
    have ended the lives of any number of people before or after her, but it had contributed
    to her greatness by making her legendarily brave.


    Unfortunately, in later years, people had taken advantage of this fact, putting
    her in positions where she would have to be brave to keep up with her reputation
    and make choices that would otherwise not have benefited her. She wondered if
    this was one of those times. If this person was expecting her to leap out of bed
    and attack.


    Perhaps the only reason that she had heard them at all is because they wanted
    her to, wanted her to wake up just enough to make a mistake. But as she was making
    these calculations, she also knew that the person was getting closer to her. Every
    moment she lay awake, pondering what to do next, was another moment she was losing
    her advantage.


    Foolish or not, predictable or not, she leaned into her reputation and attacked.


    Throwing the light blanket she had draped over her in the direction of the noise
    as she sprang up, she pulled out the knife whose handle always stuck ever so slightly
    out from under her mattress.


    The shape under her blanket fell backward and thumped onto the ground.


    She sprang forward, holding the blade horizontally and readying it for a throat.


    The figure said something unintelligible at first before she realized it was her
    name. Pulling the blanket off, she saw… and smelled… `Mane Malik`.


    “What are you doing in my house?” she demanded. “Speak now or die.”


    He hiccupped, and she smelled all of the various concoctions he had imbibed throughout
    the evening before ending up on the floor in her room.


    “I will not ask again, `Drinky`,” she said.


    “I just came here to be safe,” he said, sounding sincerely frightened. “But when
    I saw your lights were off...”


