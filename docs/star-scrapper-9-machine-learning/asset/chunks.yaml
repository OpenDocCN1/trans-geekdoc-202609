  trans: '

    在此期间，我一直在思考过滤系统，以及它可能出了什么问题。同时，我也在想它在故障时的效能如何。从理论上讲，只要指示灯还是绿色的，它就在工作，但我依然心存怀疑。尽管我试图提醒自己，一家公司不可能在生产出让佩戴者中毒时还闪烁绿灯的产品后逍遥脱法。


    我太关注阿莱克（Alek），以至于没有注意到那个橙色的盖子已经出现在近处的远处。


    “停下，”尼德（Ned）说，我滑行停了下来。


    其他人也这样做，我告诉他们我要快速去前面侦察，看看尼德能否为我们提供任何信息。


    他们都点头表示理解，当我转身向前爬行时，他们聚拢过来。我的脚踩在土地上发出咯吱声，朝着……我并不知道太清楚要去哪里。


    就在那时，我看到了它。


    # 18


    ![](img/image_rsrc3N4.jpg)


    我本以为会发现某个降落平台或天线阵列，或者至少是一个混凝土地堡，但我看到的只是地面上的一个舱门。周围长满了植物，没有任何近期有人在附近走过的迹象。如果我不知道它就在那里，我可能永远无法发现它。


    “我没看到任何摄像头或类似的东西，”我低声说。


    “扫描仪上什么也没捕捉到，”尼德说，“我觉得你只能去调查一下了。”


    但我已经在向前移动了。阿莱克的时间已经不多了，我不想浪费哪怕一秒钟。我只是快步冲向前，抓住了舱门的门把手。


    没有阻力，没有锁，什么都没有。


    它就那样开了，我向下看去，是一个光线良好的水泥楼梯。


    我去集合了其他人；我们所有人跑回舱门处，径直往下走去。好吧，几乎我们所有人都是这样做的。


    “我在这里等你们，”拉拉（Lara）说，“等你们知道情况了就通过`Comm`（通讯）联系，但我们不应该一起走进那条未知的黑暗通道。”


    她是对的，我迅速点头示意，然后先走下楼梯。


    楼梯似乎没完尽没了，我不断回头查看阿莱克，但在我们最终到达另一个气闸室之前，没有什么值得看的。这一次，它也是锁着的，看起来我们可以很容易激活它。


    我转向其他人：“让我先进去测试一下。以防万一。”


    “没门，”阿莱克说，然后推开了我。他径直进去，毫无疑问地激活了它。

