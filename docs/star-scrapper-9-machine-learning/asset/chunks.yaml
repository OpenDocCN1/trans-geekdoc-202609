  trans: '

    “你构想得不对，”他说，正如我一往常做的那样，我提醒自己他的话里并没有恶意。他只是按照他所看到的方式在陈述事实。


    我把设备收进兜里。“你说你有一个位置坐标？”


    “我正在处理大量数据，”他说，但被他的一位助手富有戏剧性的咳嗽声打断了。“我和我的团队正在处理大量数据，我相信我们很快就会发现很多位置，但在最近的几份记录中我提到了其中一个，我相信它会带你发现一些线索。”


    “发现什么？”我问道，对于长期以来第一次获得除掉 `Twain` 的线索，我感到非常兴奋。


    他的眉毛微微低了起。“我不知道。这就是为什么我说的是‘一些东西’。”


    “噢，”我说道，热情有些消减了，“行星在哪里？”


    “它目前还没有命名，而且离这里非常远，处于一个几乎未开发的扇区，”他回答道。“这意味着你将花费很长的旅行时间，并消耗大量的燃料，但我相信 `Doctor Charles
    Forks` 能够为此提供帮助。”


    我笑了，看来冒险可能没有白费。“你有机会见到他吗？”


    “我刚说了他的研究可以提供帮助，而且你知道他是被带到这个设施的，”`Edwin` 说。“难道你不能从语境中推断我见过他吗？”


    我用鼻子吸了一口气，缓慢地深吸了一下。“我可以推断出来，”我说。“我想表达的意思是，你审核了他的科学方法，而且它看起来很可靠？”


    “噢，是的，”`Edwin` 回答。“在我自己的工作期间读过他的其中一篇论文，对他他早有仰闻。虽然我无法想象像他那样的生活。”


    作为一个见见过他曾经居住的那块岩石的人，我觉得这有点可笑，但我什么没说。


    “我很高兴你相信他能为我们的事业做出贡献，”我说道。“我把你的意见视为金科玉律。”


    “你应该如此，”他说。“我相信只要给予时间和资源，`Doctor Forks` 将能够完成一些非常不起的成就。自然，我会协助他的工作。”


    我本想开个玩笑，说那可能只是为了让他也能在发现上签上自己的名字，但我很清楚。


    “我想我应该准备好船员，并在 `Buzzard` 号上备好一些桶，”我说。


    Libby 在这段对话中第一次开口。“`Peacer` 的维护小组现在正在处理 `Buzzard` 号，”她说，正当我要对她说得如此直白发表评论时，她又补充道，“因为我是个能预判你需求的霸气大姐。噢，万岁！”


    后半部分让我措手不及，我我不禁大笑了起来。“宇宙中真的没有第二个像你这样的人，”我说，我是发自真心的。


    “我知道，”她回答道。“另外，你能告诉我一些好事事吗？”


    我挑了挑眉。“好事事？”


    “是啊，比如什么趣趣的轶事之类的？”她说道。“因为 `Lara` 和 `Ned` 都在竞选 `USA, Bummertown` 的市长。”


    “`Lara` 怎么了？”`Ned` 问道。


    我看向他的立方体。`Zenobia` 被杀了，可能是被某个陷阱猎人杀的，而我们……

