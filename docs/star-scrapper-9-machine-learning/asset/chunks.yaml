- raw: 'She put her palm on my face and pushed me playfully down onto the bundle of
    furs. “Okay, you made your point. I guess I just wish that things could be a little
    more straightforward sometimes.”


    I took another sip of the coffee sludge. “At this point, I just always expect
    everything to be painfully complicated.”


    “But at least we have Chaz boxed up,” she said. “So we can start going after Twain
    once we get off this rock.”


    “Exactly,” I said. “I''m ready to take this fight to him, and maybe, in the meantime,
    deal with whoever knocked us out of commission.”


    She lay back down, resting her head on my bicep. “We really do have a lot of people
    trying to kill us,” she said with a little smile. “If you had told me when we
    were kids that little Hank Spears from Bussel would be one of the most wanted
    men in the universe, I would have laughed you right out of the room.”


    “You and me both,” I agreed. “When this is all said and done, hopefully I can
    go back to being one of the most forgotten men in the universe.”


    That drew a laugh from her. “I''m pretty sure that if we pull this off, your name
    will be right up there with Captain William West, hero of the Five Battles and
    pilot of the Starblaster.”


    I chuckled but then my face dropped. “I’m worried about Ned. He hasn’t come back
    online.”


    “Well, it took him over two hundred years the last time, so cut him some slack,”
    she said. “He’ll be back with us soon.”


    “I hope so,” I said. “We’ve come too far for this to be it. And it’s even more
    strange that he’s just a cube. With a person, it’s pretty easy to tell if they
    are alive or dead, but⁠—”


    She didn’t let me finish. “What’s John Gregory, then?”


    I let out a long sigh. “Okay, other than the occasional corpse reanimated by what
    I have to assume is nanotechnology, it''s pretty easy to tell if a person is alive
    or dead. But Ned’s cube being off could either just be him taking some time to
    reboot, or he could be broken, or he could be gone for good.”


    “Wouldn''t that be a hell of a thing,” she said quietly.


    “What?”


    “If that was how Ned went down,” she said, a little more casually than I was comfortable
    with. “If we met his rival, and then a little bit later he was just offlined forever
    by an EMP. Nothing poetic, nothing heroic, just a boring old tragic loss in the
    middle of our story.”


    I could tell that she was just thinking out loud, but the idea of it made me sick
    to my stomach. “That can''t be how it is. He might be a computer program in a
    cube, but he''s also one of the people I''m closest to in this entire universe.”


    “Oh, I know,” she said, hearing how seriously I was taking this. “I was just…”


    “Right,” I said. “But it''s just weird to realize that one of your best friends
    is lines of code.”


    She reached up and put a hand on my cheek, then drew my face to look at hers.
    “He''s going to be fine, Hank. His story is far from over.”


    I didn''t say anything and just thought about all that we had been through. “What
    do you think happened to William West?” I asked.


    “I was wondering that too,” she said. “After that whole conversation, it''s obvious
    that it was something more than him just being killed in the line of duty.”


    I nodded in agreement. “Also, it is one hell of a weird thing that Ned''s programming
    doesn''t allow him to be more curious about his paired partner.”


    “I know, right?” she said. “He does nothing but talk about how amazing William
    was, but then when it comes to his death, he doesn''t seem to care at all.”


    “Makes me wonder about the people who programmed him,” I said. “I’m really so
    curious about them in general, honestly. So many of the choices that they made,
    things that they decided to prioritize or disincentivize. It’s all so interesting.”


    “Well, that''s the problem with trying to mimic the human mind,” Lara said. “Everybody''s
    different, and there are so many facets to each and every person. They probably
    mapped the minds of as many people as they could, studied all the patterns, and
    designed from there. While, of course, adding their own personal flair.”


    I considered that for a moment. “The idea of adding your own personal flair to
    another’s personality is really quite a striking idea.”


    She smiled up at me as though I was an idiot.


    “What?” I asked.


    “What?” she repeated. “You just described parenting.”


    I opened my mouth to retort, but I realized she was right.


    “You think you would have found scrapping without Lutch?” she asked.


    I shook my head. “I mean, I might have ended up a scrapper because there were
    so few jobs on Bussel but…”


    “Exactly,” she said.


    “Ned and I have discussed the similarities between parents and programmers before,
    but I still think there''s something different in teaching a little kid to like
    Warhero cards or something and outright changing the code of an AI’s mind.”


    She stood, and I appreciated the view as she pulled on her stealth suit. “I think
    this is a conversation for people a lot smarter than us.”


    I waved the comment away. “A formal education doesn''t make you any more or less
    qualified to philosophize than anyone else,” I said. “Some of the deepest conversations
    I ever heard were between a couple of guys sitting on top of a scrap heap.”


    She looked at me incredulously.


    “You don''t have to believe it, but it''s true,” I said, thinking back to the
    two grizzled old-timers I had eavesdropped on as they sat and had lunch. I was
    still young and impressionable, and I pressed my back against an old refrigerator
    so that I could listen. The men talked about everything and nothing, their lives
    and wives, sports and the meaning of life all in the span of an hour before going
    back to pick apart the pile of rubble and try to find some small item of value.


    I hadn''t thought about that moment in a long time, and I almost didn''t care
    if Lara believed me because it was such a deep core memory. It helped me to understand
    that intelligence didn''t mean going to the finest universities on Emortium, but
    that it was something much deeper.


    Once Lara and I were both ready and we stepped from the tent, we saw that people
    were already ready for us. Two villagers approached with a meager but generous
    meal. A small piece of meat sat atop a bed of the chewiest eggs I had ever experienced.
    But Lara and I gulped them down with gratitude.


    The leader girl from the night before, whose name I didn’t know and felt that
    it was too late to ask, walked over from a group of her people.


    “You’ve decided to help us?” she asked.


    “We have,” I affirmed with a nod. “Please bring me as many weapons as you can
    and any tools you might possess for repairing them. I have some on me, but I could
    always use more.”


    She furrowed her brows at me.


    “I was a scrapper in a previous life, and you’ll need weapons that actually function
    if you want to take on that mine.”


    “You want us to surrender all of our weapons to you?” she asked, and the question
    made sense. Just the day before, I had been disinclined to hand over my own armaments,
    but I had done it.


    “You don’t have to,” I assured her. “But you send your people into the coming
    fight with nothing but these rusted-out peashooters, they’ll die. Plus, just in
    general, you should have your people focus on the upkeep of their tools as much
    as possible.”


    “My dad always said ‘it’s a poor craftsman who blames his tools’,” she told me.


    I nodded knowingly. “Mine used to love that one too, and while I appreciate the
    sentiment, I think it’s an equally poor craftsman who goes into a job without
    the right tools.”


    She seemed to consider this for a moment, then made a show of unslinging the rifle
    from her back and handing it over to me with great flourish. Everyone watched,
    stopping what they were doing as I took her weapon.


    “I want you to make it look as good as you can,” she said. “If we are to defeat
    our enemies, we must do everything we can to prepare ourselves.”'
