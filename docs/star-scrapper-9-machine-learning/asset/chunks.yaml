  trans: '

    “那是我最喜欢的一天之一，”她终于说道，“我们去了，我试了那些衣服，然后在她评判时为她当模特，但当我们发现这种风格时，我们都心领神会了。那种感觉很神奇、有趣又独特。和得到我的仪式武器完全不同。那仅仅是一段美好的时光……我想那是我记忆中最美好的时刻之一。”


    我笑了。“我知道她听到这些会是多高兴的，”我告诉她，回想起和拉奇（Lutch）度过的一些最美好的时光。


    “我想，在最爱他们的时刻记住深爱的人，是我们可以纪念他们最好的方式，”我说。


    她直视着我的眼睛。“我爱你，汉克（Hank），”她说，“以防万一我们死掉，我想至少说过过一次。”


    “我也爱你，”我告诉她，因为已经已经没什么可说的了。我是真的这么想，她也知道，我为我们说出这句话而感到幸福。更让我开心的是，我们选择了一个周围没有旁人的时刻。我真的不想知道旁边那些爱说风凉的人还会添些什么。


    “我知道你是真心的，”她说，“你一直迷恋我。”


    我脸上的表情垮了。“切，我只是赖在你身边，是因为我知道你会为我偷糖吃。”


    她笑了，拍了拍我的肩膀。


    接着，那一刻过去了，我看着她的眼神再次变得深远。“我真的很难过，汉克。”


    “我知道，”我说，“你确实应该难过。我也很难过。虽然我只认识她很短的时间，但泽诺比亚（Zenobia）一直对我很好，而且在完全没有理由的情况下把我带进了圈子。她是一个不可思议的女人……还帮助培养了另一个不可思议的女人。”


    她把手放在了我的手上。“谢谢你这么说，但我现在不需要奉承，”她说，“我需要做点什么。”


    我环顾了一下酒吧，看到没有她要战斗的陷阱者，松了一口气。


    “在你跑去做些事情之前，”我说，“我得问问，议会议员说了什么让你这么火气大？”


    拉拉（Lara）深吸了一口气。“现在我们要谈谈另一个抚养我的人的去世了。”


    “我一直试图保持尊重并从不问起，”我说，“甚至没有意识到这其中的由。”


    她拍了拍我的手。“我注意到了并表示感谢，我想是时候……”


    现在，我很清楚最好不要说什么，她继续说道。


    “我当时正住在辛（Syn）留下的公寓里睡觉，一个紫披斗（Purple Cloak）敲门告诉我他去世了，”她说道，悲伤再次弥罩在每一个字眼里。“我无法置信，也不明白。当我问泽诺比亚发生了什么时，她说是自然原因，但她说话时的那种语气听起来不太对劲。”


    这是她分享过的最多信息，但我已经能够拼凑出其中的一角。不过，我对整个全貌很感兴趣，并为终于能得知真相而感到高兴。


    “我试图打听更多消息，但每个猎人都对我闭口不言，直到最后我被传到议会面前，被明确地告知他是自然去世的，并且我将获得下一个职级，并在猎人殿堂中取代他的位置，”她解释道。


    “我感到非常荣幸。”她摇了摇头。“非常荣幸以至于我没有继续追问。与其问他之前正在处理什么案件、为谁工作，我只是对开始开启自己的赏金猎人生涯而感到兴奋。”


    显然，她从我的眼神中读出了什么，说道：“我并不是说放弃了对他的思考或类似的事情，我只是为自己感到高兴。你必须理解，我从小时候就开始训练了，从未想过这一天会到来。而且我那时还年轻。”


    她显然是在试图向自己为某种更深层次的事情找理由。


    “我本该花更多时间去挖掘，花更多时间去尝试整合我听到的那些事，”她说，声音忧伤且自责。“我本该为他做更多，而不仅仅是为终于成为一名赏金猎人而感到高兴。”


    “听起来，就像现在一样，你当时无论做什么都不可能对你产生向好的结果，”我告诉她。“如果他们说没有什么好担心的，即使那是谎言，新出炉的基拉·维克斯（Kilara
    Vex）也只会顺着线索陷入更多麻烦。”


    她用手指划过酒杯的边缘。“这只是，”她低声说道，“如果那件事和这件事是同一群人有关，而我本可以在年前就阻止他们……”


    她声音消失了，执心要归咎于自己。


    “听一个希望在爱的人去世前能为他们做点什么的人的话吧，”我说，想着在拉奇生命的最后几个月里我曾多少次尝试寻求帮助，“你不能责备自己，你只能寻找向前前进的方法。话虽如此，如果我们在调查过程中发现了什么，你知道的，我会陪你彻查到底。”


    “我知道，”她说。


    她喝光了我杯里剩下的啤酒，然后把杯子放回。“但我确实有些事……”

