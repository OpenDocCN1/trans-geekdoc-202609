    \ her, the purple beam disappearing into her flesh and dropping her dead.\n\n\
    I turned back to see the last of the civilians disappear down the hallway, but\
    \ Sophia was standing with her camera at the bottom of the escalator.\n\nWhen\
    \ I ran up beside her, I saw what she was staring at. There was a person at the\
    \ bottom of the staircase who had been trampled in the commotion. They lay there\
    \ lifeless, and the young woman just gawked at what she was seeing. She was a\
    \ survivor and had undoubtedly seen and done hard things throughout her life to\
    \ stay alive, but obviously there was something about the senseless brutality\
    \ of this that had frozen her.\n\n“We need to get going,” I said.\n\nShe looked\
    \ up at me as though she didn't even know who I was for a moment and then blinked\
    \ once and nodded. “Let's go.” But she didn't move.\n\nCassiopeia chirped in my\
    \ ear. “Coming in hot,” she informed me.\n\n“We got your back,” Ammo added, and\
    \ I stole one more look up out of the large window to see the cargo ship moving\
    \ quickly through space as it and the Boot of Justice came under fire. Smaller\
    \ crafts were dogfighting all around, and this battle was going to be close.\n\
    \nOne more chime. “Four minutes until Tidal departure.”\n\n30\n\n![](OEBPS/image_rsrc3N4.jpg)\n\
    \nOnce I got her moving, Sophia continued to film as we exited the area and continued\
    \ down the hallway to all the Port doors.\n\n“Port Cyan,” Ned informed me, and\
    \ I saw that Lara must have gotten the same message as she was hurrying people\
    \ through the door to the designated port.\n\nThe people were streaking away from\
    \ me and Sophia, but then I heard a sound behind me and turned just in time to\
    \ watch several more Disciples appear at the end of the hallway. I ducked inside\
    \ the frame of one of the massive port doors and squeezed off a few shots to stop\
    \ the soldiers from coming.\n\nAll I needed to do was hold them back long enough\
    \ for Cassiopeia to dock so that the civilians could get on the cargo ship and\
    \ get out of here. Taking a quick gander from around the edge of the wall, I saw\
    \ the world around me explode in gunfire as all of the approaching soldiers took\
    \ aim at my position and let me have it.\n\nI answered with a blind fire, sticking\
    \ my hand out from around the corner and just shooting. I could have sworn I heard\
    \ someone shout and then a thud, but it might have just been wishful thinking.\
    \ Not that it really mattered.\n\nI was holding them back, and that was what was\
    \ important. As long as I could keep them from continuing down the hallway, the\
    \ civilians would be safe.\n\n“Docked,” Cassiopeia cheered in my ear, and I pressed\
    \ the button beside me to open the door. Another quick blind fire, and then I\
    \ turned to look through the port and out to where the cargo ship was affixed\
    \ to the space beside.\n\nIt had obviously taken significant damage but it was\
    \ still working, and all it would need to do was hold out a little bit longer.\n\
    \nBehind it, the battle continued to rage on, and I saw micromissiles streaking\
    \ through space while the heavy ships blasted at another.\n"
  trans: '

    Lara 开始引导他们向港口移动，尽可能让更多人跟着她，同时也为了防止他们对其他人指手画点大大大叫。


    与此同时，我试图让大家冷静下来，但我的鼓励毫无作用。他们正处于恐慌之中，只想快点离开这艘船。


    “嘿，停下，”我听到电扶梯房间另一头传来一声大喊，看到两名信徒（Disciples）冲了出来，举着枪。我最不希望发生的事情恰恰发生了。


    两名信徒中的一个向试图逃跑的人群中开了火。这导致其他人开始奔跑、跳跃或尖叫，局面从一片混乱变成了一场疯狂且致命的灾难。如果不是伊莫根（Imogen）和索菲亚（Sophia）开始走上电扶梯来帮忙，情况就不会变成这样。


    在我对付那两个攻击者时，她们身上的某些特质有助于人们冷静下来。第一个人的胸口中了一道电弹，但当我对准第二个人开火时，她一个侧空翻躲开了，并呈劈字坐倒在地。


    “这到底又是什么鬼？”尼德（Ned）在我耳边问道，但片刻后，那个筋扭术演员用两把半自动手枪向我开火了。


    我躲开人群，蹲在一个垃圾桶后面，我知道我的护甲已经挡了几颗子弹。垃圾桶被密集的火力扫射得粉离破碎，但至少我将火力引开了那些几乎已经离开楼梯的人。


    枪声消息后，我从躲藏的地方快速瞥了一眼，保持武器就绪以防万一。那个拿枪的女孩再次在我面前横空翻滚，我尽可能快地对准了准星，但我还没来得及扣一次扳机，她就举起手臂，朝我的方向射出更多子弹。


    崔恩（Twain）创造的这些升级士兵速度快得几乎让人无法还手。一个老旧的财团（Consortium）需要将士兵与人工智能配对，以便他们能够生存下去，这完全合理。


    “尼德，有什么主意吗？”我看着垃圾桶碎片掉落时问道。


    “射了她，”他说。我不知道这算不算建议。但当我没有移动时，他用听起来像英国口音的声音喊道：“射了她！”


    所以就在她射击停止的瞬间，我尽可能少地露出身体，但又露出了足够的身体来，你知道的，为了射了她。当她左右穿跃跳动时，我射出了几道电弹，但其中一道电弹擦伤了她，就在她做出反应时，就在那短暂的一秒钟内，我再次射击。


    第二道电弹挡住了她，紫色的光束消失在她的肉里，让她当场身亡。


    我转身去看着最后一名平民消失在走廊尽头，但索菲亚正拿着相机站在电扶梯的底部。


    当我跑到她身边时，我看到了她在凝视什么。楼梯底部有一个人在混乱中被踩踏了。他们毫无生命地躺在那里，而那个年轻女性只是目呆地看着她所看到的一切。她是一个幸存者，为了活下去，她一生中无疑见过并经历过许多艰难的事情，但显然，这种毫无意义的残暴中某些东西让她僵在了了子里。


    “我们得得走了，”我说。


    她抬头看着我，仿佛一时间她甚至不知道我是谁，然后眨了眨眼睛并点点头。“走吧。”但她没有动。


    卡西奥佩娅（Cassiopeia）在我耳边轻啾道。“正高速接近，”她告诉我。


    “我们会撑你的，”弹药（Ammo）补充道，我又透过大窗向上看了一眼，看到货运船在太空中快速移动，而它和正义之靴（Boot of Justice）正遭受火力攻击。较小的船器在四周激烈缠斗，这场战斗将非常胶着。


    又是一声提示音。“距离潮汐（Tidal）出发还有四分钟。”


    30


    ![](img/image_rsrc3N4.jpg)


    等我让她动起来后，当我们离开区域并沿着走廊走向港口门时，索菲亚继续拍摄。


    “青港（Port Cyan），”尼德告诉我，我看到拉拉也收到了信息，她正催促人们通过大门进入指定的港口。

    '
