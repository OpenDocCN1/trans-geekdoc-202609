  trans: '

    他把东西转过来，给我看一个复杂的锁定机构。“我不确定，我需要花点时间捣鼓一下才能拆开它。”


    “好的，”我说，“嗯，如果我们能从接下来的危险中活下来，我很想知道那里面到底有什么。”


    “箱子里有什么？”内德大喊道，“箱子里有什么？”


    我们冲了出去，现在我面前的是“H.H. 沃特森号”，它看起来像是 `Vince` 提供的文件里那艘船的扭曲版本。


    正如我们警告过的那样，现在船体侧面安装了几门大大炮，看起来像是用金属触须连接在一起的。就好像侧面感染了某种病毒，长出了武器一样。


    还有几支中小型飞行器队在 `Watson` 号周围盘旋，看起来像是在等待尸体的秃鹫。我知道，只要有一半机会，它们会非常乐意把我们中的某一个变成尸体。


    “收到新消息，”伊莫根说，我艰难地吞了口唾水。


    `Clynt` 把 `fob` 给我。


    “希望这玩意儿管用，”我说，并伸手接听电话。


    28


    ![](img/image_rsrc3N4.jpg)


    “是谁？”一个声音通过 `comm` 传来。我没有开启视频。


    “我们有一批新货，”我说，“我们得偷了这艘宠物美容船，但我们在后舱准备了新鲜肉源，等他们进行……升级……”


    “明白，”那个声音说，“藏红花港。”


    船只收到了一张 `Watson` 号的图纸，标明了准确的降落位置。


    我皱起眉。“你们需要我们的 `access key` 吗？”


    “噢，嗯，如果你想提供的话，也可以的，”那个声音说，显然对这个问题感到惊讶。


    我只是垂下了头。“正在对接。”


    “收到，”那个声音说，“囚犯接收处已准备好迎接。”


    我切断了 `feed`，并确认它已完全关闭，才说道：“我真不敢相信。”


    “我信，”拉拉说，“我的意思是，我们付出了这么多努力，他们当然不在乎我们手里有没有它。”


    “没别的可能了，”内德通过他 `cube` 里的 `speaker` 说，让我们大家都能听到。


    索菲亚看着我们。“所以，这很正常？”


    “对我们来说，唯一正常的事就是没有事情按照我们的预期发展，”我说。


    伊莫根引导飞船向藏红花港驶去，当我们靠近时门打开了。内部，更多扭曲的层叠金属包裹着这座以前的研究设施。我不理解哪家公司会允许这样一艘船废弃或落入 `Twain`
    手中，但我知道他们的预算如此巨大，以至于像这种规模的船也可以被直接注销掉之类。


    当我们对接好时，没有人在等我们，我们什么也不需要做，比如假装这是某次囚犯转运之类的。


    “这种事这么简单，反而开始让我心烦了，”我抱怨道。


    伊莫根狠狠了我一眼。“别给我们冲不吉。”


    “我只是说，如果我们知道位置并营救人们，我们随时可以来这里，”我说。


    “我们当时没有位置，”拉拉说。


    伊莫根引导飞船向藏红花港驶去，当我们靠近时门打开了。内部，更多扭曲的层叠金属包裹着这座以前的研究设施。我不理解哪家公司会允许这样一艘船废弃或落入 `Twain`
    手中，但我知道他们的预算如此巨大，以至于像这种规模的船也可以被直接注销掉之类。


    当我们对接好时，没有人在等我们，我们什么也不需要做，比如假装这是某次囚犯转运之类的。

