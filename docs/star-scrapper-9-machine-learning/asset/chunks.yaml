  trans: '


    在我解释完 Ammo 的建议，以及我打算让 Sophia 担任我们的记录员的想法后，Imogen 离开去传达消息，而我洗了澡，换了衣服并吃了饭。


    这让我感觉焕然一新。嗯，此外，还有一些止痛药和 `Hospi-gel`。


    当我离开房间时，Foerschler 在走廊里找到了我（或者说他伏击了我），但这次是为了感谢我采纳了他的建议，并向我通报了空间站的状况。他基本上把自己任命为
    Suniuo 中继站的站长，但在他的指导下，一切进展非常顺利。


    他们建立了更多设施，为站内现在开始运行的农场进口了更多动植物，并开始组织和分类一个正式的军库，不仅为了帮助这里的人应对紧急情况，也为了给 Jackson 从基地领导的
    Peacer 突击队提供装备。


    我感谢他的辛勤工作和奉献，并批准了他对我提出的所有建议，尽管我知道这会耗掉我们从 thengar 赚来的大部分资金。他有权花掉这些钱，而且我相信他所做的一切将帮助这里的每一个人。


    当我走过整个设施时，这里现在充满了生机，运行处于近乎完美的水平，我不禁为我们招募的所有这些人以及他们所做的一切感到高兴。有来自宇宙各地的人们需要一个容身之地，并想成为某项重要事业的一部分。


    现在，他们在这里建立了一个社区。


    更令人惊讶的是，这很大程度上是因为我。我所做出的选择和一路走来的决定——有些感觉是对的，有些是错误的——导致我帮助在一个安静太空区域边缘建立了一个小殖民地。


    这是一件了不起的事。我希望在这里在这里待久一点。


    在 Buzzard 号，Lara、Clynt、Imogen 和 Sophia 正在等我。年轻的“和平卫”背背着一台巨大的相机，看起来既兴奋又紧张。


    “Alek 想来，但我把他劝回了，”Imogen 说。


    “很好，”我叹了口气。


    “但幸运的是，Sophia 在这里也玩《战争英雄》，”Lara 兴奋地说道。


    Imogen 平视了我一眼。“然后那里是一片欢腾，”她单调地说道。


    “这意味着我可以用我的牌组对阵机器人了，我已经很久没这么做过了，”Lara 说。


    在我还没告诉她我很看到看到对这事很高兴之前，Clynt 插话道：“我们不是和一位审判官有约吗？”


    这番话就让我们动行动了。


    我们登上飞船，很快就进入了环流管。意料之之中，在 Lara 和 Sophia 玩牌牌、Imogen 在旁看着时，我又直接睡着了。Clynt 像往常一样忙着自己的事，当我醒来时，指示器提醒我们已经到达了目的地。


    我起身走向其他人，告诉他们我们就要降陆了。Ned 接了我们，降落在那个被遗弃的小型休息站，那里是过去我们进行秘密会面的地方。


    令我惊讶的是，当我们准备降陆时，有四艘审判庭飞船在等着我们。


    “做好任何准备，”我告诉 Ned。


