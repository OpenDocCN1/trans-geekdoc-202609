- raw: '“How many energy weapons are you going to let get destroyed?” Ned asked. “These
    things cost money, you know.”


    “Not the time,” I said through gritted teeth, spearing with Ron from across my
    body. The Inquisitor saw the strike coming and blocked the blow with a quick slash.
    On the ground as I was, the sparks caused by the weapons meeting showered down
    on me and burned in little spots against my face.


    I turned my body, kicked up with my left leg, and struck him in the side. Not
    that it did much but force him to take one step to the side.


    Before I could make another move, I felt a searing pain in my flank. I dropped
    the half a gun and pressed my fingers to a gap in my armor at the ribs while I
    swung half-heartedly with my spear.


    I had to get to my feet.


    But I also saw the shimmer of blood on my glove out of the corner of my eye.


    How had I been injured?


    Then I remembered the Vekrass.


    While this Inquisitor was bearing down on me, the other was attacking from the
    proverbial shadows.


    I poked with my spear again, but this time, the Inquisitor grabbed the shaft below
    the tip and then pulled.


    He wasn’t able to loosen the weapon from my grip, but he was able to force me
    to grab it with both hands.


    Another pain in my side.


    I looked around to see if I could spot the attacker. But even in the brief moment,
    the Inquisitor above me struck out with their sword. I rolled, and it sizzled
    against my pauldron. Then he sliced up with the blade, and I recoiled but got
    a fresh shave on the side of my head.


    I kicked out and swept his leg, catching just enough to knock him down.


    Even as he was falling, I was getting to my feet, and this time I happened to
    catch a blur of what I realized was a throwing knife streaking toward me.


    I ducked out of the way, feeling like I was about to even out my new haircut.
    But when I looked in the direction that I thought the knife had come from, I saw
    nothing.


    The Inquisitor beside me was getting up, so I thrust at him, forcing him back
    to the ground when he parried my blow. I tried to stab again, but another knife
    whizzed toward me, struck my chest plate, and even appeared to chip it.


    I couldn’t help but look once more for the attacker and saw nothing again.


    This Vekrass was really starting to piss me off.


    Maybe it was my patience wearing thin or just the fact that I was ready to switch
    my attention, but I realized I could end this fight now. Reaching across my hip,
    I grabbed the stomper from my side with my left hand and unloaded several rounds
    into the Inquisitor on the ground.


    “Nice thinking, Indy,” Ned said, but I was already turning my attention to where
    the Vekrass was. Or where I thought he was, anyway.


    Glancing to my other side, I saw Alek on the ground and couldn’t tell if he was
    okay. My mind raced, trying to decide what to do but knowing that I didn’t actually
    have any idea where the knife-thrower was, I decided to rush in the direction
    of my friend.


    The blade that hit my thigh next caused me to stumble, and I fell down on top
    of the Kyrog. But when I did, I could feel that he was still breathing. So, that
    was something.


    Not seeing any outward signs of injury on Alek, I turned back to try and get a
    sense of where the attacker was.


    I caught a blur out of the corner of my eye but couldn’t tell if it was anything.


    I raised my stomper and fired twice in the vague direction but knew it wasn’t
    anything.


    “Can you get a visual?” I asked Ned.


    “Maybe if you looked in one direction for more than a fraction of a second,” he
    said. “I can process all the data you feed me, but I can only do so much with
    a few blurry frames.”


    I retreated a bit and ducked behind a piece of wall that had been blasted free
    and was now jutting out of the ground. As soon as I reached it, I pointed my face
    in the direction of the sideways ship where it looked as though the knives had
    been coming from.


    “Don’t see anything,” he said.


    Hearing that, the only thing that I could think to do was check behind me. There
    was nothing but a smoldering wall and chunks of burning insulation.


    When I looked back, Ned shouted, “Down!”


    This time, the knife clipped my forehead as I pulled away, and I ducked back down.


    This asshole had me thoroughly pinned, and there wasn’t much that I could do from
    here.


    “Let’s get you some backup,” Ned said. “Imogen, suppressing fire on the port leg,
    and Lara, move up along the side of the ship.”


    “What do I do?” I asked, worried about the answer.


    And I should have been.


    “Stick your head out just long enough to draw his attention,” Ned answered.


    “I’m bait,” I muttered and took a quick breath before sticking my bloody head
    out from behind cover. I didn’t wait as long as I should have and was happy that
    I hadn’t when another blade blurred by me and disappeared through a massive hole
    in the wall at my back.


    I heard Imogen’s rifle pop and assumed Lara was on the move.


    Then nothing.


    “Again,” Ned ordered, and I poked my head out a bit longer this time, trying to
    let the AI get a read of the room.


    But when I ducked, no knife came.


    So I looked back up to see Lara’s blue blade swinging at a small black robed figure
    who was holding two short, glowing blades. He moved quickly, jumping up and over
    her, darting around her side, and generally making it impossible to do much except
    counter his attacks.


    Seeing it, I grabbed Ron, then rushed forward and closed the space between us
    quickly.


    The Vekrass saw me coming, throwing a knife with his tail in my direction. Instinctively,
    I tried to block it with my spear, and to my surprise, I did. The blade sparked
    against my tip and then crashed to the ground.


    The moment I rushed in, the Vekrass had a blade waiting for me and deflected my
    attack, driving the tip of my spear off to the side.


    But that’s when Imogen showed up beside me.


    She swung her mace, and when he brought his other blade around to block his body,
    Lara struck out.


    He winced and jumped back, getting a sense of what he was up against.


    Then he lowered himself and sprang toward Imogen, apparently assessing her to
    be the weakest target.


    She did what she could, holding up her mace to block the onslaught.


    But then he twisted his body, and just before reaching her, he tucked in and rolled
    beside her.


    He sprung up with lighting speed to stab her in the back, but Lara was as fast
    as a human being could be and had her sword there in a flash, protecting the former
    Acolyte.


    When she did, I struck, stabbing the Vekrass in the side with my spear.


    Without even thinking, I lifted the entire weight of him over my head to get him
    away from the other two and slammed him down to the ground face-first. He threw
    up his claws to protect himself, but one of his own blades fell to the metal floor,
    and he was impaled upon it as well.


    “Fatality,” Ned rasped in my ear.


    I was hurt and saw that both Imogen and Lara had knicks and bruises as well. My
    whole body ached from pain upon pain and just pure exhaustion, but I turned to
    rush over to Alek’s side.


    “How you holding up?” I asked as I skidded up beside him.


    All his eyes fluttered open for just a moment. “I think that I’m dying.”


    22


    ![](OEBPS/image_rsrc3N4.jpg)


    “Is there a medbay here?” I heard Lara ask, presumably to Cassiopeia.


    “A small one, but there is no one there operating it,” she said.


    Alek looked at me for a moment. “I know what’s going on,” he said. “It has to
    be the spores.”


    Now that it was nearly silent in the hangar, I could hear a chirping sound from
    inside the Mortal Coil. But I ignored it for the time being.


    “What can we do for you?” I asked, feeling hopeless.


    “Spores, what spores?” Cassiopeia asked.


    We told her everything that had happened before we had arrived.


    “I’m doing a little research on the feltwork, and it looks as though the infection
    may be very slow, given his metabolism and the fact that there was some filtration,”
    she said.


    Alek snorted. “I’m definitely going to sue the company that made the environmental
    suit.”'
