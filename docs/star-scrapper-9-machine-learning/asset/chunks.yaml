    \ solution, she shoots Hank and runs.\n\nThe two rush back to Bussel to meet with\
    \ Alek, an old friend of Hank and former medic (and mob doctor). He patches Hank\
    \ up and asks to join the crew. They accept but are forced to flee the planet\
