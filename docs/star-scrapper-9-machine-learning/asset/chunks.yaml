- raw: 'Both Charlie and the woman at his side burst into laughter. “Is that some
    kind of joke?” he asked. “Of course I want to live somewhere else. But I irreconcilably
    angered the only people who can come and go from this place and don''t really
    have the means to get off.”


    “And just because I was born here, doesn''t mean I want to live here one moment
    longer than I have to,” his wife said. “It was a terrible place to live and has
    been made even worse by the company doing everything they can to starve us out.”


    I looked at them and the few other people listening with rapt attention from their
    places around the fire. “And you''d like safe passage off this planet?”


    “If you can provide it,” Charlie said, “we would be eternally grateful.”


    Imogen stepped forward. “I''d like to give them refuge at the station… at least
    until they are back on their feet.”


    “Last group of them kind that we came across tried to send Hank home with a lead
    reminder of their company,” Clynt said. “Don''t know if it''s such a wise idea
    to bring ’em into our midst.”


    Imogen stared daggers at the Vekrass. “It might surprise you to learn that not
    all people from the same place are exactly the same.”


    “I ain’t sayin’ they is, but I know that the one time we showed kindness on this
    rock, all we got was a six-barrel thank you,” Clynt said.


    Charlie raised his hands defensively. “I understand if your experience here has
    made you disinclined to help.”


    Imogen stared at me, and I wondered what was going through her mind, though I
    knew what she wanted me to say. Of course, both of them are right. Getting shot
    in the chest had made me understandably trepidatious about taking these folks
    on, but on the other hand, they seemed genuine in the few moments I had known
    them, and I liked the idea of helping some people who were in a bad spot. Additionally,
    I knew that Imogen would never forgive me if I turned my back on these people.


    Apparently, I was taking too long to decide because Charlie spoke again. “I will
    say this,” he began. “The company had me working on studying starship fuel conservation,
    and before I got a bit distracted, I felt that I was making some serious progress.
    I don''t know what kind of facilities you have, but I would be more than happy
    to earn my keep by saving you what I expect could be a fair bit of money.”


    Now, that was something.


    Everyone stared at me as I decided their fate. “Welcome aboard,” I said to the
    doctor, extending a hand.


    That’s when Lara shimmered into existence, startling those around her.


    Despite the fact that we didn’t know these people and had no reason to trust them
    other than the fact that we wanted to, I made the choice.


    When all was said and done, I needed people to rally to our cause and come together
    to fight against Twain. If this man could save us on fuel and provide even one
    more soldier for the war, I would take it.


    “Thank you,” Imogen whispered, stepping close to me as the locals immediately
    began packing up their things.


    What was funny was that I had labored over letting them come with me, but they
    seemed to be just blindly following. For all they knew, I could be an agent of
    Twain who was about to kidnap them and inject their brains with nanotechnology
    that would turn them into half-comatose zombie soldiers.


    But I supposed there was a mutual trust going, and hopefully it would pay off
    for both of us.


    “I think it was the right thing to do,” I told her.


    She nodded. “It was. And I hope you know that I truly appreciate that you''re
    governed by that sense of right and wrong.”


    I was about to say more, but Lara stepped over. “Can we finally get off this planet?”


    11


    ![](OEBPS/image_rsrc3N4.jpg)


    After finally getting off that planet, we Tidaled right back to the relay station.
    Imogen and Alek led the ’facers to clear out some rooms for themselves while Lara
    helped me bring the two AIs to Edwin.


    He looked up from his desk as we entered. “What have we here?”


    “Ned was offlined,” I said in a voice more shaky and worried than I expected to
    sound. “By an EMP.”


    “Yes,” the scientist said, reaching out a hand for the cube but keeping his eye
    on the cloak box until he pulled his gaze away. “What''s in there?”


    A sound filled the room like a deep gasp of somebody who had been holding their
    breath underwater as Edwin manipulated the box. “What the hell happened?” Ned
    asked.


    “EMP got you again,” Edwin stated and then glanced up at me. “There is a little
    button here to reset him if this happens for a third time.”


    “It won’t happen again!” Ned growled.


    Edwin looked down at the cube. “That is not something you are capable of controlling,”
    he stated. “Despite your declaration, you are not capable of choosing if you are
    hit with that kind of a pulse.”


    “I don’t care,” Ned said. “It isn’t happening again.”


    “Curious,” Edwin responded. But his eyes were glued to the large box that Lara
    was holding. “You will tell me what that is now?”


    Ned answered before I could. “An asshole.”


    “I do not believe that box holds any of the over sixty sphincters in the human
    body,” Edwin said. “I believe that there is some kind of artificial intelligence
    cube within that you do not want knowing the location of this station. Is this
    hypothesis correct.”


    “Yes,” I answered.


    “Like I said, an asshole,” Ned said.


    I grabbed the box from Lara and held it out toward Edwin, who set Ned down and
    then pulled it from my hands.


    Taking on a serious tone, I said, “This is the AI paired partner of Nathan Spade,
    who was a contemporary of William West.”


    “Hero of the Five Battles and Captain of the Starblaster,” Ned added while Lara
    mouthed it along as well, knowing he would say it.


    “Oh, no way!” Libby said through the speaker in the corner of the room. The station’s
    AI was always excited to be in on the drama. “No wonder Neddy keeps calling him
    an asshole. Spade is the one who shot William, right?”


    We all stood there in silence.


    “What?” Ned said finally, his voice a shadow of itself. “What did you just say?”


    “Ooh, right, you didn’t know…” she said as though it was something she was even
    capable of having forgotten.


    I had suspected something like this but had not known definitively. “What happened?”
    I demanded.


    “I have bits and pieces from the dark feltwork, but I am not totally sure,” Libby
    admitted, sounding more subdued than I had ever heard her.


    Edwin set down the box, looking at me. “Would you like me to investigate this
    matter?” he asked.


    “Yes,” I said, deciding it was time to know as much as we could once and for all.


    “When I access this cube, I will also find out what happened to Captain William
    West,” he said, “operating, as we are, under the assumption that he knows.”


    “Thank you,” I said. “It’s time we understood more about the Old War and how Twain
    operated back then.”


    “Correct,” Edwin said, and I tried not to let it show how surprised I was that
    he had agreed with me. “The more we can understand about the artificial and its
    interaction with the organic, the better we can know the universe.”


    He then just stared at Lara and me with a blank expression on his face. “I would
    like to begin understanding the universe better presently.”


    I turned to Lara. “He means he wants us out of here,” I said.


    “I got that.” She nodded, and the two of us stepped from the lab before I turned
    back to grab Ned.


    “No,” Edwin said. “I need his programming.”


    I didn’t like it since I had only just gotten Ned reactivated, but I understood
    that he was vital to the work Edwin was doing.


    I rejoined Lara, and the two of us had only taken a few steps when Libby butted
    back in. “Soooo,” she said, dragging out the word. “You’ve been getting some calls,
    Lara. They have been going to your open bounty line, and I have been intercepting
    them.”


    “What’s up?” Lara asked.


    “Mane Malik very much wishes to speak with you,” she said before adding a theatric,
    “ooh,” like an in-studio audience.


    Lara shook her head. “What does he want?”'
