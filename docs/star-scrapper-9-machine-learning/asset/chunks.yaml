    # PREVIOUSLY ON…


    ## Star Scrapper


    Hank Spears is living the life of a scrapper until he unearths an AI named `Ned`.
    This intelligence is a soldier from the Old War against a cult bent on making
    all organic life extinct. `Ned` warns of a superweapon that he had been investigating
    at the time he was offlined called `Codename: Extinction` and believes it might
    still be there. Before Hank can decide if he wants to help, he is caught with
    the AI and has to flee. Since the war, the universal Government has outlawed any
    artificial intelligence, and anyone caught harboring one is imprisoned or killed.


    Pursued by Inquisitor `John Gregory` and his Acolyte `Imogen Hush`, the two evade
    capture and discover a relay station in the far reaches of space where another
    AI, `Libby`, has been hiding. With her help, they are able to find the brother
    of Hank’s adoptive father. He offers to help and they think things are turning
    around, but Hank is discovered by two bounty hunters hired by his old employer.
    Luckily, one of the bounty hunters is his childhood friend, `Lara`, who helps
    them get off the station. Though conflicted at first, `Lara` decides to help Hank
    get out from under the thumb of his criminal boss.


    They earn some money collecting bounties but soon discover that `Lara`’s ship
    was destroyed by `John Gregory`—who also murdered Hank’s uncle. Rather than letting
    this defeat them, they team up and arrest Hank’s former employer. By doing so,
    Hank becomes a bounty hunter and earns a large bounty. With the money, the three
    can now begin to look into `Extinction`. They begin their hunt by seeking out
    an Old War space station called `Home`.


    ## Hunter’s Rise


    Hank, `Lara`, and `Ned` make their way to the Cult space station `Home`. While
    aboard, they are confronted by a mysterious voice who tries to kill them. `Ned`
    is able to fight back and get the humans to safety, but he is offlined in the
    process.


    Through `Lara`’s bounty hunting handler, `Zenobia`, they are given the name of
    a man who might be able to help. `Edwin Stern` is a researcher with the skills
    to repair `Ned`, but in order to do so he needs a favor. They fly to meet with
    the man’s rival, only to discover that she is his ex-wife. Before they can come
    up with a peaceable solution, she shoots Hank and runs.


    The two rush back to `Bussel` to meet with `Alek`, an old friend of Hank and former
    medic (and mob doctor). He patches Hank up and asks to join the crew. They accept
    but are forced to flee the planet when Inquisitorial Acolyte `Imogen Hush` appears.


    They return to `Edwin`, only to find that he has been taken. Following a lead,
    they track him down and find he is being held by his ex. After they rescue him,
    he repairs `Ned`, and they offer him safe haven, which he accepts.


    `Ned` wakes up and tells them that the voice they met at the space station was
    `Twain`, known during the Old War as the Enemy AI, the leader of the opposition.
    But `Ned` also has a lead on some new information.


    When they follow up on what `Ned` learned, they are ambushed by the Inquisition,
    but `Imogen` helps them escape in exchange for their aid in freeing her from the
    life of an Acolyte. With her help and some shipping manifests, they might just
    be able to track down `Extinction`.


    ## Rebel Intelligence


    `Imogen` offers to exchange information and political connections for Hank’s help
    getting her family off of the Consortium capital planet of `Emortium`. Though
    `Lara` doesn’t believe they can trust the former Acolyte, Hank agrees and after
    getting a ship from a `Vekrass` gangster, they sneak onto the planet.


    The crew find `Louise` and her husband and get off the planet with the Inquisition
    hot on their heels. She asks to be taken to a camp of the Peacer rebels and when
    they arrive, they meet the charismatic leader, `Shep`.


    While they are talking, a nearby village is attacked by pirates and Hank is asked
    to help. Rather than simply setting up defenses around the village, the crew take
    the fight to the pirates and manage to cripple the fleet and collect a bounty.


    `Shep` is grateful and they part ways with `Louise` to continue their hunt for
    `Extinction`. But when they find an Old War medical facility, they learn a dark
    truth: `Shep` is an ancient Cultist who appears to be helping the old Enemy AI
    begin to build his army anew.


    ## Deadly Ghosts


    Hank finally has the opportunity to use the political connections that `Imogen`
    promised. Despite her decision to kill `Shep`, he still believes she can be trusted
    in this endeavor and they travel to meet her “Uncle” `Vince`: Governor of Sector
    Three.


    They chat with him about getting him to present evidence of `Codename: Extinction`
    to Parliament but he needs solid proof. Before the meeting concludes, `Vince`
    is shot at by a mysterious assailant who disappears. That night at dinner, he
    is attacked again and Hank manages to kill the assassin. Doing so not only indebts
    `Vince` to him and also helps him rank up as a bounty hunter.


    With the money from the bounty and some… encouragement… from famed bounty hunter
    `Mane Malik`, Hank upgrades his armor before consecrating his spear.

