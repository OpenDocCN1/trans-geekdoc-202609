- raw: 'Clynt rushed over to hop on the ramp that Jackson had dropped only halfway,
    and I followed quickly. The best thing we could do now was clear a space so that
    the cargo ship could escape. Also, and not for nothing, we had to get off this
    ship before it exploded.


    I heaved myself up off the ground, gripping the ramp with my fingertips and then
    pulling myself aboard. As soon as I was, I felt the ramp beneath me activate and
    begin to settle back into the Buzzard.


    When we arrived at the cockpit, I threw myself in the copilot''s chair.


    “You guys mind if I fly?” Ned asked.


    I smirked. “I thought you''d never ask.”


    “Works better for me,” Jackson said, and the two of us pulled up on the releases,
    our chairs rocketing down the hallway and sliding us into the gun bays.


    “Woohoo,” Clynt cheered as Ned threw the Buzzard back out from the port and into
    the action.


    I gripped the controls for the micromissile cannon and started looking for enemies.


    They were everywhere.


    “Stay close to the cargo ship,” I said.


    Ned chuckled. “Way ahead of you.”


    He dropped the Buzzard under the cargo ship that was just starting to pull back
    from the H.H. Watson. As he hurdled around from the underbelly of the massive
    transport, one of the Cultist ships was right in front of us, but before either
    Jackson or I had a chance to open fire, he used the front cannons to tear it apart.


    Ned swept us around and rolled us in the direction of a medium-sized gunship.
    Their cannons turned to face us, but when the pulse blasted forward into space,
    Ned jumped right out of the way and then laid down a stream of missiles directly
    into its cockpit.


    Here and there, I would fire quick bursts at a craft coming in close to try and
    disable the cargo ship, but before I could do any serious damage, Ned would pull
    us around and blast them out of space.


    He was a man on a mission.


    The space around the Watson began to pull, and I felt Ned activate the secondary
    thrusters as the gigantic ship prepared to Tidal.


    Clynt spoke into the comms in a halting whisper. “And here we go.”


    At the last word, and before it could disappear into its gyre tube, the ship that
    Twain had been using to experiment on and create his horrifying zombies began
    to burst as its fuel ignited. Then the oxygen. And within a moment, the entire
    thing was completely torn apart.


    The only problem was that, when the Watson was destroyed, the ships that had been
    acting in its defense immediately all turned their attention to the cargo vessel.
    And, believing that they had accomplished their goal, Admiral Huang Tidaled the
    Boot of Justice away.


    The fight became a lot less fair.


    “Ned, any word from Cassiopeia?” I asked


    He answered right away. “The Tidal Drive is almost primed.”


    I swiveled and opened fire on a sparrow-class enemy ship that was coming up hot
    on my heels. “Almost primed is pretty vague,” I said, seeing three more ships
    coming at us in tight formation.


    Both Jackson and I sent several bursts into the three pursuers, but they dodged
    the shots with ease and returned fire. Ned was able to evade one of the streams,
    but a few exploded against our shields in a spectacular burst.


    “Try not to get us killed,” I said, but he didn’t have to retort. As he flipped
    the ship, I realized that the other burst had crashed against the cargo ship,
    and Ned had used our shields to block more hits against the civilian ship.


    Then, out of the corner of my eye, I saw a black ship highlighted with red streaking
    toward me.


    “The Mortal Coil?” I asked in astonishment.


    But before I even had time to realize that it was somehow back in the battle,
    it was opening fire. On me.


    Ned got us out of the way of several of the shots while some of the others diminished
    what was left of our shields.


    “Looks like your new pal Chester borrowed himself a ship,” Ned said, and I didn’t
    know which was worse: the enemy commander having commandeered the Inquisitorial
    ship, or if Francis, himself, had taken it. I had to think that either way, it
    wouldn''t be good for me.


    But the phoenix-class ship was coming back for another attack run, and I could
    tell from the angle that it was going to try and blast the cargo ship.


    “Ned!” I shouted, urging him to hurry up and close the distance between us and
    the attacking phoenix.


    All he answered was, “Watch this.”


    As the Inquisitorial ship let forth its salvo, so did Ned, and he did something
    that I had never seen before. For every missile that streaked out from the front
    of the phoenix, Ned had one so perfectly aimed from the front of our ship that
    it detonated it in space. One after another after another, they were destroyed
    before they could reach the civilian vessel.


    It was the most incredible show of marksmanship that I had ever seen and would
    only be possible for a computer.


    Then I heard a sound that I loathed more than just about any other: the missile
    battery jamming.


    The last few missiles streaked from the phoenix toward the fuel core of the cargo
    ship that already had a hole in its protective armoring.


    In horror, I watched as the rockets stretched toward the gap, knowing that when
    they detonated, not only would we lose all of the civilians, but Sophia, Imogen,
    and Lara as well. I had recently watched several of my friends grapple with loss,
    and the idea of watching all of those souls perish was almost too much to bear,
    but I couldn''t look away.


    It felt like it took a year, though I knew it was but a fraction of a second.


    My breath caught, and I watched the three projectiles… pass through space.


    The cargo ship disappeared into its gyre tube just before being destroyed.


    I spun my weapon immediately and opened fire in a constant stream on the phoenix
    ship. I wanted more than anything to see it destroyed, but it zipped away from
    me, and a moment later, I felt the Buzzard Tidal too.


    I blinked, staring at the swishing blue outside the ship.


    We had done it.


    By the skin of our teeth, we had managed to get the civilians off of the Watson
    before they were lobotomized and destroyed Twain''s ability to make more. We had
    killed John Gregory once and for all and crippled both the real and false Inquisitions.


    I leaned back in my chair, thinking about all that we had accomplished and realizing
    that, while it had taken all of us to accomplish, there was one man without whom
    it would have been entirely impossible.


    “Ned,” I said. “It doesn’t matter if it is your core programming or your new programming
    or your updates, you are one hell of a person, and I know that Captain William
    West, Hero of the Five Battles and Pilot of the Starblaster, would be proud of
    you. And so am I.”


    After a long moment, he croaked, “Thank you.”


    # EPILOGUE


    Alana Torg’an’s eyes shot open.


    The warmth of the nearby brazier was fading, its embers all but a memory.


    A light breeze caused the curtains to dance slowly beside her bed on the upper
    floor of the estate. Her Conecian eyes adjusted to the dark within a blink, allowing
    her to see in far more clarity at night than even a human who had spent their
    entire life in the mines.


    A night jay fluttered in the tree a few meters from beyond her balcony, and as
    it did, she heard whoever was trying to sneak into her home take a single step.


    They were good. Well-trained and well-practiced.


    But Alana had not become a member of the Council of Six on her family name alone.
    As Mane had correctly pointed out to his friends, she had been one of the greatest
    bounty hunters of her generation. Though, in her mind, it still was her generation,
    and all these up-and-coming greats were nothing but young pups.


    She didn''t move, waiting to see what this person would do next.


    Part of her wanted to believe that they were here to steal an heirloom or prove
    themselves to one of the guilds by taking one of her monogrammed pieces of paper
    off her desk, but she knew better than that.


    Alana had spent the day setting all the pieces in place to close the noose around
    the trappers.'
