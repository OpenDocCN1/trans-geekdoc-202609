  trans: '

    他的声音中没有丝毫疑问或质疑，他竟然能产生这种情绪，这让我很惊讶。为 AI 赋予情感是一回事，但让这些情感强烈到至于会危及任务，则是另一回事了。当然，这是一种非常人性化的特质，而这些性格的设计初衷就是模仿我们自己。


    “我不会这么做的，”我说，我很确定内德（Ned）正期待听到这句话。


    “汉克（Hank），”他用一种我听过的最严肃且克制的语气说道，“这个人背叛了我的族人。他是我这么多朋友被杀的凶手。他显然与敌人勾结，他不配再活一秒钟。”


    “你清楚我必须做什么，”我说，“我相信，最后，你会觉得我做出的这个选择比听你的更让你开心。你现在是透过愤怒的滤镜在看问题，我完全理解，但这就是为什么你有一个搭档。我在这里是为了帮助你恢复理智。或者，在你无法决定时替你做出艰难的决定。”


    查斯（Chaz）的声音再次通过扬声器传来。“刚才那是真温馨，但如果你觉得能从我这儿得到任何信息，那你就是个傻瓜。”


    伊莫根（Imogen）呻吟道。“你真烦人。这事儿真烦。”


    “那就杀了他，”内德说，“来吧，伊莫根，你最喜欢杀坏人了，而且没有比一个背叛联盟（Consortium）并导致族人灭顶的叛徒更坏的！”


    “我不喜欢这家伙对你所做的，内德，”红发女孩说道。


    我指了指秃鹫号（Buzzard）的方向。“我们带他回去。”


    “你不能那样，”内德在我耳边警告道，“如果他身上有任何追踪系统——我们知道他一定——我们会把特恩（Twain）直接引到我们这里。”


    当然，他是对的，我为没考虑到这一点而自责不已。“我们可以关掉他吗？”


    “你能被关掉吗？”内德反驳道，我不得不赞同伊莫根的观点：关于这件事，他真的很不悦人。


    我思考了一下，知道了答案。“我们可以路过当地的小商贩，买一个小型阻尼场发生器。”


    “或者一个隐形箱，”克林特（Clynt）建议道。当他看到所有人困惑的表情时，他补充道，“完全正如你们想的那样。”


    拉拉（Lara）看着我。“猜你在这个扇区知道某个地方？”


    但在我还没得及说出“可能知道”之前，阿莱克（Alek）说道：“我知道。”


    我们都看向他。“我曾为一个黑帮工作过，记得吗？”


    “对，”我说，“我们有一个计划。”


    “你们可以随心所欲地计划，但没——”查斯开始说，但我没让他说完。


    “我们受够了这种扭曲胡子式的戏码，”我说，“这太累了，所以除非你有什么有用的要补充的，否则你可以去房间后面坐着。”


    当我们离开并匆忙回到秃鹫号时，他没有再说其他话了。我不喜欢特恩追踪我们行迹的想法，更不想将他引到某个落后世界的市集，但我们必须把查斯带回埃德温（Edwin）那里检查。这可能是再次掌握主动局面并将战争带回敌人的关键。


    再次回到秃鹫号后，阿莱克输入了坐标。距离很近。我们起飞离开了空间站，我不禁想特恩接下来会发生什么。他一直在实验，一直在改变战术，我唯一能预测的是，我看不见接下来会发生什么。


    ### 帕姆（Parm）的进攻及后果


    对帕姆的攻击让我措手不及，我原以为他会尝试攻击联盟（`Emortium`）——宇宙的权力中心，但当他针对联盟出手时，即使是那样的也让我感到意外。使用一支被纳米机器人（`nanobot`）洗脑的审判者（`Inquisitors`）军队是一个巨大的冲击，并清楚地表明了他为了实现目标愿意做到何种程度。


    影响仍在持续。在整个宇宙，政治家们试图填补所有的空缺，尽管我们的朋友文斯·德尔菲纳（Vince Delfina）正努力号大家加入我们的事业，但大多数竞选职位的人似乎都有自己的算盘，对参与对抗特恩的战斗并不感兴趣。


    “他正试图入侵我们的系统，”内德告诉我，听起来很烦躁。“我能拦住他，但越快把他关进箱子里越好。”


    “谢谢提醒，”我说。


    内德哼哼了一声，他的声音通过驾驶舱的扬声器传出来。“他只会希望你的脑袋掉下来。”


    “这可不是你最好的表现，”拉拉评价道。


    伊莫根表示同。“没错，这家伙把你的脑子都搞乱了。”


    “你需要弄清楚威廉（William）发生了什么吗？”阿莱克严肃地问，“这能让你神经冷静下来吗？”


    “我的神经很冷静，”内德抗议道。


    伊莫根俯身靠近控制台，就像面对一个老朋友一样。“我们说这些是因为关心你。”


    “我心领了，但真的，我很好，”他说。

    '
