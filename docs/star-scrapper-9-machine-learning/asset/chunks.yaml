- raw: 'I knew she was lying, and I suspected that everyone else in the room did too,
    but Alana was a politician as well as a bounty hunter and played right along.
    “Good,” she said. “Now, if there isn’t anything else?”


    “No,” Lara said, standing. I did the same, but as Mane moved, the Conecian stopped
    him with a look. “Thank you so much for the opportunity you have presented us
    and for taking our concern seriously. I can’t tell you how grateful I am.”


    “You can show that gratitude out in the field when I send you bounties,” the woman
    said but in a kind and affable manner.


    “We will,” Lara assured her, and I simply nodded at her.


    The two of us excused ourselves from the room and made our way out into the courtyard
    without so much as a word shared between us. Whatever Lara was thinking, she knew
    better than to share it here and now, but as soon as we were well clear of the
    building and walking along the path, I had to ask what was going on.


    “Something about what she said piqued your interest, eh?” I inquired.


    She nodded. “Yes,” she answered without hesitation. “When Syn⁠—”


    But she stopped speaking when she saw the guard who had rang the bell earlier
    come running up the path. He seemed to be in a hurry and waved when he saw us.


    “Hunters Vex and Spears,” he said, panting when he stopped in front of us. “I
    have news.”


    14


    ![](OEBPS/image_rsrc3N4.jpg)


    Once the guard had told us the news, Lara punched the guard in the jaw, sending
    him crashing down to the street. Then she let out a scream like nothing I had
    ever heard before. I wanted to console her, to help her, but first I stepped forward
    to help the guard to his feet.


    “You okay?” I asked.


    He seemed to be in shock. “I think so,” he answered. “It’s been a day…”


    Lara was keeled over, looking as though she might throw up.


    “Get out of here,” I told the guard, and even though I had absolutely no business
    telling him what to do, he turned and rushed off.


    I threw an arm over Lara, who was heaving with misery.


    “Now should we go back to the station?” I asked.


    She gasped long enough to say, “No.”


    We stood there a moment longer, a warm breeze rustling the trees around us.


    “I need a fucking drink,” she said finally and began walking.


    She didn’t say another word until we reached the tavern. The man at the front
    didn’t try to stop us, and the hostess didn’t offer us a table. They saw Lara
    and knew she was heading right to the bar.


    “I’ll have a Bussel Brew,” I said, but Lara shook her head.


    “Two shots of Hunter’s Gold,” she said. “And one for him too.”


    He looked at me, and I just gave a quick jut of my chin. He turned and poured
    the drinks, and when he set them on the counter, Lara took both of them down in
    quick succession. Not to be outdone, I did the same.


    “I’m so sorry, Lara,” I said, and at the words, the tears welled up again.


    She reached over and had a sip of my beer too. “I don’t even know where to begin
    with this,” she said. “The sadness is so damned deep right now. My own flesh and
    blood mother died right in front of me, but this… this is so much worse.”


    “You didn’t really know your mother,” I said. “Zenobia helped raise you.”


    Lara nodded, tapping her empty shot glass on the bar by way of ordering another.


    “I think she knew it was coming,” Lara said, the words choking out of her. “When
    I saw her, she didn’t say anything about what had happened to her…”


    When she didn’t speak for a long time, I asked, “What did she say?”


    “How…” she began, but the words almost couldn’t come. “How proud she was of the
    hunter I had become.”


    Then she lost it again, folding her arms on the bar and sobbing some more.


    This was not what I was best at, but I wanted to be there for her as well as I
    could, so I offered what I could.


    “When Lutch died,” I said, “I didn’t think that I would be able to go on. I felt
    as though the world was coming to an end and I would never be able to fill the
    Lutch-shaped hole in my heart. But I did. And you will too. And even though it
    is sad to lose her, you should take solace in the fact that she was happy to see
    you grow into the hunter you have become.”


    Sadly, my words did not land the way I had wanted them to, and she looked at me
    with entirely crimson eyes. “Hank, I am not going to say aloud what happened,
    but you and I both know why she is dead and who is to blame. I’m not happy that
    she was proud of me, I’m enraged that it happened and miserable that I couldn’t
    do anything for her.”


    “You can now,” I said. “You are already. We just set wheels in motion that will
    help to solve this. And maybe in a permanent way.”


    “You sound like you are trying to talk me out of doing something,” she said, and
    I hadn’t thought I was.


    I leaned in close. “Do I have to?”


    She didn’t answer for so long that two more shots appeared in front of her. She
    took another one down, but before she could grab the fourth, I put my hand over
    it.


    “Lara,” I said in as serious a tone as I could muster. “You can’t do anything
    else now. There is not a single thing that you can do right now that won’t make
    everything worse. The matter is being dealt with, and you know it is being taken
    seriously by the right people. Don’t do anything foolish.”


    She nodded in a conciliatory way and then reached up toward my head slowly. Rather
    than resting it on my shoulder as I had suspected she might, Lara flicked my ear,
    and when I reached to grab it, she snatched the shot and drowned it.


    “I know you’re right, Hank,” she said. “But I have so many feelings slamming around
    inside me right now that I don’t know if I will be able to… something…”


    I looked at the bartender who was coming back and shook my head. He read the room
    and backed off.


    “Tell me about her,” I said.


    Lara blinked several times in quick succession. “What about her?”


    “Anything,” I said.


    She nodded slowly, tucking some loose strands of hair before her now bright red
    ear. “She was kind to me when Syn wasn’t and could put him in his place better
    than anyone,” she said, smiling ever so slightly at the memory. “I don’t think
    that they ever were, you know,” and made a circle with her thumb and forefinger
    with one hand and then stuck her pointer finger in with the other. “But they kinda
    completed each other.”


    I didn’t say anything, knowing that I should just let her speak. She rarely said
    anything about Syn, and I wasn’t going to derail this by putting my foot in my
    mouth.


    “Every time we would come back and spend a few days here, my life got lighter,”
    she said. “The training wouldn’t be as intense, and I would even get some time
    off every now and then. I think it was because Zenobia made him take it easy on
    me when I was here. Not to say that she didn’t also bust my balls and challenge
    me, but it was different with her.”


    She blinked hard, looking like she was half in her memory. “She would always take
    me out to dinner after a hunt and ask me to break down what I saw, what I did
    and to analyze what could have been better or different. Rather than Syn’s style
    of making me feel like crap for any little misstep, she was always trying to teach
    me. I mean, I know he was too, but I was young, and her style made it easier to
    want to learn.”


    She took another swig of my beer.


    “You know, she was the one who bought me this,” Lara said, tugging on the sleeve
    of her stealth suit. “When I turned eighteen, Zenobia pulled me into the room
    behind her office and said that at a certain age, every girl needs to get the
    dress of her dreams.”


    She laughed at the memory. “I must have looked at her like she had four heads
    because she got the biggest smile on her face and said that for a hunter who was
    good at sneaking, the only right dress would be a stealth suit. Then she took
    me shopping.”


    She paused as though she remembered that Zenobia had died. Her face pulled and
    she closed her eyes to try and stem the tears.'
