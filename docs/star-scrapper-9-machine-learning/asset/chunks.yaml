  trans: '

    “再敢说那样的俏皮话，我就拒绝你进入，并把你炸出天外，”他威胁道。


    我本想指出，他所提议的（至少是“把我们炸出天外”部分）违反了宇宙法则，并且预料内德（Ned）会乐于指出这在技术上并不是天空，但我很清楚他的想法。


    “抱歉，先生，”我改口道，“我的船上没有来自那个星球的人。”


    “左舷二号，”他说完就切断了连接。


    我转向阿列克（Alek）。“我们到底在这里是为了什么？”


    “我没说我对这事很了解背景，”他说道，此时内德引导我们进入一个巨大的停靠舱，外面喷涂着一个罗马数字“二。“但我知道当地人与住在上面的人之间存在某种紧张关系。”


    “你觉得呢？”拉拉（Lara）讽刺地问。


    “是的，”内德赞同道，“我想我们都能从背景中推断出来。”


    阿列克没再说话，当我们停稳时，我看到几个穿着制服、全带武装的人正向 `Buzzard` 走。


    当我们下船时，其中一名制服人员走上前来。他们都穿着紫色的工作服，留着染成红色的短发，与武器和腰带的颜色相匹配。中间的那个女人盯着我们所有人。


    “有野蛮人吗？”她问道。或者更准确地说，是在要求。


    “没有，女士，”我说。


    她越过我的肩膀看向我的船。“介意我们检查一下吗？”她问道，那种语气简直就像是，“我们要检查。”


    我退到一旁，手做了一个扫过的手势，她停留在原地，而周围其他人则登上了我的船。我不喜欢这样，但也知道自己没有选择。


    我们沉默地站了一会儿，最后我终于问道：“那么，我不是这儿的人；这一切是怎么回事？”


    她打量着我，仿佛我像个乡包似的。“情况是，我们必须确保没有那些‘面孔’（facers）在没有许可的情况下来到这里。”


    “为什么？”伊莫根（Imogen）问道，听起来已经有些不满了。我瞪了她一眼，希望这能提醒她我们在这里需要东西，并且表现得最好。


    “让我问你一个问题，”那个女人说道，盯着那位前审判庭执事（Inquisitorial Acolyte）。“你喜欢看到同事被杀死吗？你喜欢因为矿山被毁或航道被中断而导致食物短缺吗？你喜欢贸易伙伴因为你没有他们订购的东西而对你反面脸吗？”


    伊莫根眯起眼睛。“我不能说我经历过那种特定的经历。”


    “你因此更幸运，”那个女人说，“因为这一切都是不可接受的，而且这一切都让生活变得艰难。”


    “如果那些当地人是你们的眼中钉，为什么不直接把他们都带到柴房解决掉？”克林特（Clynt）问道。


    每个人都看向他，对这个提议感到厌恶和惊讶。


    “`Consortium`（联盟）不允许——”


    “种族灭绝，”伊莫根说道。“那是你想说的词。”


    “是的，”那个染着红头发的女人说，“就是。”


    伊莫根看起来还想多说些，但没必要了。


    *(注：所提供的文本剩余部分包含高度重复/无意义的短语，似乎是生成错误或数据损坏。我已根据您的规则对上述连贯叙述部分进行了格式化。)*

