- raw: 'One side of his face twisted for just a flash, and I wondered what he was
    thinking. Though, if I was being honest with myself, it probably wasn’t about
    this situation at all but butts or boobs or fast ships or something.


    “And you two,” she said. “You are presenting me with a unique opportunity.”


    I was about to ask how but decided that I should just keep my mouth shut since
    it seemed to have been working so far.


    “The trappers have been a blemish on the armor of the Conclave since its inception,”
    Alana said, pushing out from her chair so that she could pace the room while waxing
    philosophic. And she did.


    “If even part of what you are saying is true, this might be a real chance to change
    the way things work,” she said, obviously considering many moving parts. “But
    we will need to expose them, and that is going to be tricky. Since the days of
    the First Council, the trappers have been a wily bunch who worked within our codes
    on the surface while working well without just below.”


    Mane slammed a fist on the armrest of his chair. “We should out them and force
    them to step down from the Council.”


    “Don’t let your ambition lead you down a path you are not ready to travel, dolt,”
    she said. “This is going to take time and cunning.”


    She turned and strode slowly across the room, then stopped in front of one of
    the paintings. “Would the two of you be willing to work with me as we try to smoke
    this villain out?”


    “Of course,” Lara said. “I would do anything to find the person who hurt Zenobia.”


    “You have been with her a long time?” Alana asked.


    Lara nodded. “Since I was a girl,” she said. “I apprenticed under Syn Kel Kal.”


    The Councilwoman looked over to Lara. “I remember you.”


    Lara said nothing, but I could see that she had strong feelings about hearing
    that.


    “Syn came before the Council when he wanted to take you on,” she said.


    Lara swallowed hard. “I didn’t know that.”


    “It is not usual for hunters to take on apprentices of that age and in such a
    way,” Alana said. “But he believed it would be for the best to do so.”


    She didn’t say anything, but the Conecian studied her face. “You didn’t know?”
    the councilwoman asked. “He told you nothing of this?”


    Lara didn’t answer immediately. “He did not,” she said finally. “He was not… an
    open book…”


    Alana laughed. “He was not. I believe there is a picture of him in the dictionary
    next to stoic.”


    Lara smiled, her eyes distant. “I always thought it was the ‘strong silent type’
    myself,” she said. “But I think I might have learned that from him.”


    “Let me tell you what he never did, then,” the Councilwoman said, stepping closer
    to look right at Lara. “He came before us and fought tooth and nail to convince
    us to let him take you on. He showed more emotion in that room than he ever showed
    to me since or again. I am sure he never told you how much you meant to him, but
    it was crystal clear on that day.”


    Lara’s face pulled tight, and she tried as hard as she could to fight it. She
    wanted to be Kilara Vex in front of the councilwoman, but after finding Zenobia
    and then hearing that, it was obviously too much. She burst into tears, burying
    her face in her hands.


    “I’m sorry,” she murmured.


    The Conecian stepped over to put a hand on her back. “I never understood that
    about you humans,” she said. “You always apologize for crying publicly when the
    expression of emotion is one of the things that is most endearing about your species.”


    “I cry sometimes too,” Mane said, and I wondered if he just couldn’t help himself,
    if these things just bubbled up inside him and he had to let them out.


    It seemed like Alana was having the same moment that I was. “Mane,” she scolded.
    “For the remainder of this conversation, please only speak when spoken to.”


    “I don’t think that’s possible,” I joked despite myself, earning me a look from
    the councilwoman. Then I wondered if Mane and I actually had some similarities
    that I didn’t want to face.


    Lara had stopped and was now just looking at the woman with miserable and grateful
    eyes. “Someday, I will tell you more stories of Syn,” she said. “Perhaps when
    it is just the two of us.”


    “I would like that,” Lara said.


    “But for now, we should deal with the matter at hand,” Alana said.


    Lara croaked, “How?”


    The Conecian tapped a finger against her chin. “Let us make several moves at once.
    First, while Zenobia is recovering, I will act as Falconer for the two of you,
    if that is acceptable.”


    “Yes,” Lara and I both answered at once.


    “Second, I will put some of my little birds in position around the city, listening
    specifically for word about the trappers and their movements and plans,” she continued.
    “But I don’t have anyone within their ranks. That is something else that I will
    have to work on. In the meantime, I will also force Roan’s questioning to the
    top of the docket. I have to hear what she has to say and will be interested in
    the reaction from Councilman Purd Pak.”


    Lara raised an eyebrow.


    “That is the trapper representative,” she said as an answer to the unasked question.
    “Not that he is an open book either. He shows up to the meetings and disappears
    thereafter.”


    “Is there some kind of a trapper headquarter here in the city?” I asked.


    Alana nodded. “There is, but it is not open to just anyone, and it changes location
    regularly. If you are thinking of some kind of infiltration, it won’t work. The
    best thing that you two can do now is stay alive.”


    Lara chuckled, her hand going to her mouth a moment later. “That’s not a guarantee.”


    The councilwoman shot us a quizzical look. “How many enemies do you have?”


    “All of them,” I answered quickly.


    Her eyes shifted back and forth between the two of us. “I see,” she said in almost
    a whisper. “I will have to review your files before our next meeting. Something
    tells me that there is more here than meets the eye.”


    Oh, how right she was.


    “And third,” she said. “I will have some of my people join the investigation into
    what happened with Zenobia. She is a friend and a proud member of the Conclave,
    and it is important that we know exactly what happened. Especially if it turns
    out that trappers were involved again.”


    “Again?” Lara asked.


    Alana waved the comment away. “Just a figure of speech. Don’t read anything into
    it.”


    But Lara seemed to have keyed in on something and asked, “How well did you know
    Syn?”


    Once again, the Conecian flashed a reaction which she then hid away quickly. “I
    knew him better than some and not as well as others,” she answered with such aggressive
    evasion that it was almost comical.


    Lara’s eye twitched. “And do you mind if I ask for a little of your history? I’ll
    admit to being at a bit of a loss.”


    Alana turned to Mane. “You may speak, worm.”


    He nodded, obviously trying to ignore the name at the end. “Alana Torg’an was
    born to an illustrious line of bounty hunters. The family Torg’an has had a member
    representing them on the Six since the First Council.”


    She wasn’t smiling exactly as he said all this, but she certainly seemed to like
    what he was saying.


    “But Alana Torg’an did not rise to her position on name alone,” he continued.
    “Oh no. She has some of the most famed hunts in Conclave history and maintains
    the record for most bounties captured in a single day. She has forgotten more
    about hunting than I will ever hope to know, and she has been a proud member of
    the Council for over two decades.”


    “That was very good,” the woman praised, and Mane flushed.


    It was interesting to see him acting so differently than ever before. This woman
    with her position of power had a very noticeable effect on both him and Lara.
    But my friend was looking differently at her now. I could tell that she still
    respected the councilwoman and her position, but something about the comment surrounding
    Syn had changed things.


    “Thank you,” Lara said. “That was very helpful.”'
