  trans: '

    “我的意思是，”她继续说道，“你有时间带他去寻求帮助。”


    “我会带他回基地，”拉拉（Lara）提议道，“你应该继续调查。我们现在离目标太近了不能慢。”


    “不，”伊莫根（Imogen）说，“来来。”


    在我反驳之前，卡西佩娅（Cassiopeia）开口了。“让我来。”


    我们困惑地互相看着。


    “把我放到你带来的那艘货船上，我会带他去找你们的医生，”她提议道，“这样，你们就可以继续前进了。”


    这让我停顿了一下。“`Ned`，”我通过耳机上的敲击系统告诉他，他能听懂，“你相信 `Edwin` 的程序吗？”


    “你的意思是，你认为她可能在伪装，并引导西安（Twain）直接找到我们？”他问道。


    “是的，”我敲击了一下。


    他不需要思考。“我相信它，”他回答道，“没有什么是完美的，但我相信她的程序是‘干净’的。”


    “值得赌上我们所有生命去冒险吗？”我明确道。


    “是的，”他说，“我感染过一次，虽然我觉得还有遗留影响，但他从未能追踪到我。此外，我真的不相信如果她还在被入侵，她会建议我们让她下线。西安永远不会建议那种浪费资源本身的行为。”


    “好的，”我大声说道，“`Cassiopeia`，你可以带他回去。欢迎加入这项事业。”


    她发出了轻微的响声，我那认为那是兴奋。“谢谢你，”她说，“我真的想弥补我所做的一切。”


    “把我们的朋友带回安全地带确实能解决问题，”我说，“开始给货船加燃料。”


    “已经做好了，”她说，“当我以自己的身份重新上线的那一刻，我就开始了。”


    我看着我的朋友，仍然不确定是否应该这样做，但知道我们必须趁热打铁。


    “`Lara`，帮我搬搬他，”我说，“伊莫根，去拿卡西佩娅的立方体。”


    伊莫根毫不犹豫冲出了房间，但我本以为拉拉会来帮我。相反，她走向一辆 `packmule`，启动了它，开到我们面前。


    “即使我们大家在一起，也没法搬动他，”她说。


    阿列（Alek）咯笑道。“确实如此。”


    当我帮他把自己升到浮动平板上时，阿列将我拉近了。“别担心，”他说，“我会坚持的，我觉得这个 `AI` 真的想提供帮助。”


    “你总是第一个信任别人，”我带着虚弱的微笑说道。


    现在看着他，我意识到自己对他失去他完全没有做好准备。


    “我每一次都是对的，不是吗？”他说。


    我点点头。“你是的。”


    “但真的，”他在把自己升到平板上时假装我确实帮了忙似的，“去去做该做的事吧。”


    我转身回到 `Mortal Coil`，听到里面传出的细微响。


    “我会的，”我说，拍了拍他的肩膀。


    拉拉启动了 `packmule`，开始把阿列开向另一个舱口，他在那里可以上船。

