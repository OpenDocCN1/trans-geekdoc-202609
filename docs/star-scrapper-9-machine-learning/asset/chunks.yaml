- raw: 'And even though I knew it was coming, when he bellowed, I nearly leaped from
    my skin. But every time we practiced, I got a little better at finding my way
    through the ship in the dark. I withstood the animal noises he made one time,
    the barrage of balls he chucked at me another, and even the rubber snake that
    he had perched just right to fall on me when I cranked the lever.


    I had found it so irksome at the time, and now I couldn''t have been happier as
    I pulled my way across the ship as it was crashing to the planet. Well, I obviously
    could’ve been happier, but I was grateful nevertheless.


    My muscles ached and my stomach felt like it was going to jump out of my body,
    but in the dark, I reached out and felt the handle that I knew was there. Before
    I pulled it, I dragged my body forward and pressed myself against the wall to
    strap myself into the belts bolted to the side of the ship.


    Once I was strapped in, I quoted, “Hold onto your butts,” wondering if Ned could
    hear me. I cranked the lever and heard the panel go flying off just before the
    powerful chute ripped from the ship and expanded. A moment later, the Buzzard
    shuddered hard, and I felt as though I was going to be yanked from the wall, but
    thankfully, my head just snapped violently before the ship began to float slowly
    downward.


    That was one thing sorted.


    But as I felt the Buzzard waft gently down, we had a lot of problems.


    The ship settled to the ground, and we got going as quickly as we could.


    It was pitch black within the ship, and Lara guided the way with a flashlight.
    Behind her, Alek was holding Imogen, who had undoubtedly passed out while we were…
    would we call it landing…?


    “Who were that?” Clynt asked though it really sounded as though he was asking,
    “Who do we get to go after?”


    “I don''t know,” I admitted, the words struggling out as I was finding it difficult
    to breathe. “We all have a lot of enemies.”


    “Oh, I don''t know about that,” Lara joked. “We only have the government, the
    Inquisition, the fake Inquisition, the pirates, the enemies of the Peacers, the
    Blood Dragons, and… I want to say there was some cartel that we pissed off too…”


    “None of them groups seem capable of taking us unawares the way we just was,”
    Clynt said.


    As I pulled the straps on my shoulders, I looked at Clynt in the beam of the light.
    “Any one of those groups could have one really smart person in their organization.”


    Alek cleared his throat. “As much as I''m enjoying this game of guess-who''s-trying-to-kill-us,
    we need to get off this ship and assess this situation.”


    “Right,” I agreed, and we all made our way back up to where the side hatch could
    be opened manually. There was no way we were getting down the cargo ramp at the
    moment, so I manhandled the locking mechanism and swung open the creaking door,
    allowing the bright light from the nearby star to flood into the ship.


    Heat pierced into the ship, and the air felt heavy when you breathed it in. But
    it was breathable, so that was a victory. I clambered down first, making my way
    onto the hard-pack scrub surface of the planet.


    I blinked, trying to bring my eyes into focus as it was nothing but bright tan
    as far as the eye could see. I hated planets like this.


    “Why does it always have to be desolate wastelands that have some desirable resource?”
    I asked.


    As Lara jumped down, her boots crunching against the hard shale of the earth,
    she answered, “I feel like if Ned were online, he would either give us some logical
    explanation or insist that while it feels this way, it''s actually statistically
    untrue and that resource rich planets are just as likely to be like this as any
    other kind.”


    That reminded me. I reached into my satchel and pulled out Ned''s cube. Not that
    looking at it gave me any indication, but he obviously wasn''t speaking and was
    still offline.


    “Figured he would be right back on,” I said, flipping the cube over in my hand.
    “Meanwhile, I''m sure Jerk Cube is still finely protected in that cloak box.”


    Then I looked up at the ship as though he might have gotten loose on board like
    some alien menace. But as Alek hopped down, cracking the surface as he did, he
    bobbed his head in the direction of his back where he had strapped the box.


    I looked at Imogen in his arms. She was breathing shallowly.


    “If y’all are giving out free rides,” Clynt said as he appeared in the doorway,
    “I''m more than happy to saddle up.”


    He sprang from the door to the ship and onto Alek’s shoulder. The Kyrog just grinned.
    “Anybody else?”


    He looked at Lara and me. “Maybe each one of you could wrap yourselves around
    my legs and I could wear you like heavy shoes as I trudge through all of this.”


    “Doesn’t sound too bad,” Lara said with a little smile. “The real question is,
    which way do we go?”


    “Thattaways,” Clynt said, pointing a clawed finger in what appeared to be just
    some random direction.


    I cocked an eyebrow at him. “Why’s that?”


    “Ain’t ’cause I’m some kind of divining rod or nothing,” he said. “I can just
    smell human sweat on the air from that direction.”


    “How far?” Lara inquired.


    “It ain''t enough that I''m telling you which way to go, you need more?” he asked.
    “All I know is that somebody''s stinky pits are over yonder.”


    “I guess that’ll have to do,” I said, looking down at Ned’s cube and wondering
    when he would be back online. I tucked him away and then secured the Buzzard door
    closed. We trudged onto the planet of what looked like large pieces of cracked
    eggshell with little indigo plants sticking out here and there.


    The light beat down on us, and it wasn''t long before we were shedding layers
    and tying jackets around our waists, and I made a head wrap out of my undershirt.
    Dirt stuck to the sweat on our skin, and it felt as though we were going to be
    walking forever. Each time we crested another ridge, thinking that it might reveal
    a settlement or a mine or something, there was nothing.


    Just nothing.


    More of the same endless nothing.


    And there continued to be as the star began to sink low on the horizon, our shadows
    stretching into the vast distance.


    “Stink’s getting stronger,” Clynt informed us, and even just hearing it hurried
    our footsteps and got us moving just a little bit more quickly. As we crested
    the next little rise, we saw nothing, and Clynt clicked his tongue against the
    top of his mouth.


    “Shoot,” he said. “Thinkin’ someone just used that little plant there to have
    a piss.”


    Disappointment rose within me, but as soon as it did, I heard the unmistakable
    sound of an engine from somewhere just in front of me, though I couldn''t see
    anything. A moment later, a chunk of the little rise off to our right swung open
    as a secret panel was revealed and a buggy tore out into the scrub.


    Instinctively, we all reached for our weapons and raised them at the driver and
    two armed passengers who zipped through the space between us and skidded to a
    stop that sent a plume of dust into our faces.


    “Where you from?” one of the gunmen standing on the back of the buggy asked.


    I considered how to answer the question. The obvious solution would be to tell
    them the truth, that we were from off-world and that we needed help, but I was
    concerned that, hearing it, they would just take the buggy back to the Buzzard
    and strip it. That being said, I knew I couldn''t simply say that we were from
    the planet because, well, for a start, I didn''t even know the name of it nor
    any of the local customs. And I certainly couldn''t say that I was from the city,
    as the one thing I knew about this place was that they didn''t have a good relationship
    with those from the city above.


    Unfortunately, while I was considering all of these things, the people with guns
    were impatiently waiting for an answer.


    “Where you from?” he demanded again.


    “I am Hunter Spears with the Conclave,” I announced. “Here on official business.
    I have no quarrel with you and believe a conversation could be mutually beneficial.”'
