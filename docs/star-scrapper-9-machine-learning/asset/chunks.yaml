  trans: '

    我扫了一眼其中一个屏幕上显示的画面，看到了一个我认为“秃鹫号”（Buzzard）可能所在的地方，我希望能再次看到它。


    接着，还没等我反应过来，我们就被“潮汐”（Tidaled）带走了，几几钟后，我们正冲出外围。


    屏幕上是一个分配中心空间站，像我们这种的大型货物会在那里被分类，然后由更小的船只运往它们的最终目的地。


    “他那里仍然留有这么多基础设施，”拉拉（Lara）注释道。


    盯着屏幕，我也想着同样的事情。“我们以为我们已经击败了他，结果他一直都在这，就在我们的眼皮底下。”


    “我不认为这叫在眼皮底下，”尼德（Ned）纠正道，“我们离埃姆西姆（Emortium）比人类探索过的任何地方都要远。”


    “没错，”我说，“但这个观点依然有效。”


    尼德表示赞同。“是的，意识到他一直以来都是这样工作，真是令人愤怒。”


    通讯屏幕亮了，上面出现了一个闪烁的绿色指示器，让我们输入代码。当我们向前漂浮时，空间站上的几门大炮正对准了我们，由于这艘船离战斗舰远得多，如果他们想的话，可以把我们炸成粉末。


    尼德输入了代码，我们等待着。


    片刻后，屏幕闪烁起绿光，随后远处另一盏绿光在对接口上方亮起。


    我露出了微笑，对于渗透一个直接向特恩（Twain）活跃企业运货的设施感到很兴奋。“开始吧。”


    ## 20


    ![](img/image_rsrc3N4.jpg)


    尼德带我们进入了对接口。更准确地说，他拉动飞船的后部将其锁定在空间站侧面。由于它们是同一家制造商制造的，空间站和飞船的设计可以完美配合。一旦密封形成，两扇门都可以打开，让货物从一个地方移动到另一个地方。


    当它们汇合时，我们四个人准备好出发了。门开了，我们看到几个来自高级修道院（High Cloister）的奴隶在等待接收货物。


    在看到我们的一刻，他们都冲了上来，仅用空手进行攻击。这甚至称不上战斗，但我对朋友们大喊，让他们留一个活口。


    所以我们都避开了向右侧那个朝我们走来的老人的射击。相反，阿莱克（Alek）抓住了他，用双手捏住他，不让那个可怜虫移动。他在基罗格（Kyrog）的力量面前挣扎，但无能为力，很快我就到了他身旁。


    我按下那个小矩形物体上的按钮，眼睁睁看着……什么也没有发生。那个男人继续挣扎，试图像刚才那样推挤阿莱克。


    但接着他停下了。


    他困惑地眨了眨眼睛，仿佛从一个梦中醒来。


    “他们在这儿，”他说，“圣战开始了。”


    然后他看向我们。“你们！你们是谁？我在哪儿？谁胆敢骚扰审判庭（Inquisition）的成员？”


    “我不敢相信，”尼德在我的耳机里说，“他做到了。”


    “你被制服并架了，”我告诉那个男人，“高级修道院已被一个虚假的审判庭摧毁，现在一片废墟。你可以通过提供我们所需的信息来提供帮助。”


    他的眼睛因恐慌而睁大，在空间里疯狂地扫视。他的脸上渗出一层汗，开始过度呼吸。


    接着，一种诡异的宁静掠过他的脸。“我什么也不会告诉你们的，”他像个没脑的自动机器一样说道，“我什么也不知道。”


    在我能问他另一个问题之前，他的眼睛再次陷入了疯狂的恐慌中。“帮帮我，”他说，“我不知道我身上发生了什么，但我感觉自己正被撕碎。我的脑子里有什么东西吗？”


    悲哀的事实是，他的脑子里确实有东西，但我们对此无能为力。

