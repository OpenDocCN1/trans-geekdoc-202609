    And it was convenient because after some sleep and a coffee, my brain also wanted
    it to be early morning. So that worked out nicely.


    I landed in the lot near `Zenobia’s` office, and when we disembarked, the nearby
    star was just rising over the `Conclave`. It really was a beautiful place in the
    morning. All the statues glistening in the dew, the tall pillars casting long
    shadows, and the tiled roofs glinting.


    The two of us made our way quickly the way we had walked many times before, passing
    vendors just setting up for the day and a few drunk bounty hunters heading home.


    Rounding the corner, we saw the steps leading down to her office.


    But when we did, we both noticed that the heavy door was ajar.


    It was never open like that, and we both broke into a dead sprint.


    12


    ![](OEBPS/image_rsrc3N4.jpg)


    “Zenobia!” `Lara` wailed when we entered the room to find her lying on the floor,
    clutching her chest.


    Crimson seeped out from between her fingers, and she was breathing shallowly.


    I didn’t need to wait for `Lara` to say it—I turned and ran to get the nearest
    guard. The heavy-bronze-armor clad hunters were stationed all around the city.
    They had always seemed more for show than for any practical reason, fitting in
    like the statuary, but now I was so happy they were everywhere.


    I charged up to one, and his eyes only flickered to me for a moment, but they
    focused on me when I shouted, “Falconer Zenobia has been wounded!”

    '
  trans: '

    “此外，”我一边说，一边向周围了指，“这里现在到处都是人。填满了这处设施，它确实在按照设计初衷在发挥作用。你一定为此感到高兴吧。”


    “我是很高兴，”她有些不情愿地对我们说，“但也许下次你们能多留一会儿呢。”


    “我们会尽量的，”我说道，一边快步走上 `Buzzard` 号的斜坡，“顺便告诉其他人我们很快就会回来。”


    我知道朋友们会因为我们没有亲口告诉他们而感到失望，但现在没时间浪费了，而且他们只会拼命劝我们让他们也一起去。而且正如 `Lara` 所说，现在并不是我们需要他们的情况。


    于是，我们匆忙冲进驾驶舱，坐在了自己的座位上。


    “当我们熟悉的那些 AI 表现得那么粘人，或者说，真的那么人性化时，我不禁觉得好笑，”我一边启动引擎一边说道，“我的意思是，当我们第一次见到 `Libby`
    的时候，她愿意用我们需要的信息来换取一个朋友。现在，尽管她设施里的走廊已经挤满了，她仍然想要更多的陪伴。”


    `Lara` 看着我，然后又看向窗外。“是啊，这很奇怪。”


    “正如我之前说过的，”我继续道，“程序员做出的这个选择很有趣，让我想知道他们在创造这些智能体时在想什么。又也许是我对创造他们的人要求太高了。也许他们用了另一个程序来创建所有这些性格？”


    “谁知道呢？”`Lara` 说，并没有完全听进去。


    这并没有阻止住我。“我的意思是，他们必须为每一位士兵制作 AI 以配对，而且似乎对每个设施都要一个。这可能是每每一个都是由一个人制作的，那得花太长时间了。”


    `Lara` 抚平了隐身服腿上的一个褶皱。“也许是 `Twain` 创建了他们，他只是在等待合适的时机来激活他们。”


    我启动了 `Tidal Drive`，进入涡流管时，我思考着她说的话。“你为什么要把那个放进我的脑子里？”我问道，真心地希望她并没做过。


    “不是那样的，”她说道，完全否认了这一点，“如果他能做到这一点，他在战争期间就会做了。他甚至会在你离开 `Bussel` 之前就用 `Ned` 找到你，还有数百万其他理由证明这显然不是事实。”


    我想了想。“我想你是对的，但那将会是一个极其不可思议的转折。”


    “我们经历的转折已经够了，”她说，“他带回 `John Gregory` 来接管审判庭的一半并杀掉政府的一半，这已经足够了，谢谢。”


    “我想是吧，”我说道，仍在思考关于 AI 的那件事。


    “而且他已经通过那些他绑架和黑客攻击的人拥有了潜伏特工，”她补充道，“我们不需要别的了。”


    “我的意思是，我们还有那些陷阱者，”我说。


    她哼了一声。“别再提他们了。”


    “为什么这让你这么心困扰？”我问道。


    当管道在我们周围晃动时，她看着我。“你知道为什么。”


    “我明白，”我说，接着补充了一句我听 `Sophia` 对 `Imogen` 说过的话。“但我只是想给你留空间，如果你愿意的话，可以聊聊。”


    “我很感谢，”她说，“我是真的感谢。但我不想聊这个。我只想解决问题。”


    “我理解，”我告诉她。


    她看着我，锁住我的目光，似乎第一次全神贯注。“但我喜欢知道无论如何你都在这里。”


    我对她笑了笑。“我在。永远都在。”


    她的嘴角上扬，然后头部向后靠在椅子上，凝视着驾驶舱外。


    我低头看着自己的手，`Hospi-Gel` 已经开始了愈合过程，止痛药让我还能走路。但没有什么能抵御这种疲惫，直到 `Tidal Drive` 鸣响提醒我们很快就要洗澡了，我才醒来。


    `Lara` 离开了，但片刻后她出现了，头发还是半湿。“在船上洗的澡，因为我不知道下什么时候会有机会，”她解释道，就好像我问过一样，但当她递过一杯咖啡时，我笑了。


    “不冷吗？”我问道。


    她摇了摇头。“不，”她说，“这上面的洗澡间以前冷得让你喘不过气，然后我缠着你让你安装了一个新的加热器。”


    我喝了一口咖啡，对那段记忆点了点头。“没错，”我说，“那个下午花时间去修理它感觉真不错。”


    “而我竟然以为你那是为了我做的，”她说道。

