    “I know that I’m saying it in a jokey-joke sort of way, but it’s actually true,”
    I told her.


    She smiled at that. “And I guess it wasn’t too bad that you were able to keep
    their leader safe and blow the door,” Lara praised as though it was pulling teeth.
    “And you’re just sooo good looking.”


    She added the last part in a mocking tone.


    “See, now that’s a weird joke ’cause we all know you two have been knockin’ boots,”
    Clynt observed.


