  trans: '


    ## 闲谈


    Lara 笑了起来，拿起一些文件，然后又把它丢了回去。“你其实是说，我们应该记录一下你的成就。”


    Clynt 嘿嘿一笑。“提一下我有多有忙也没什么坏处吧。”


    我翻了个白眼，然后看着他。“你一如既往地非常有帮助，没有你，我们什么也做不了。”


    我转头离开他那张微笑的嘴脸，看到 Lara 正叉着腰，挑起了一边眉毛。


    “还有你，”我兴致地转向她，“如果不是因为你，我们根本到不了那堵墙。每一次射击都救了一条命，如果不是因为你出色的准头，这些人现在就不会在庆祝胜利了。”


    她继续盯着我。


    “我知道我说话带着开玩笑的语气，但这事实是真的，”我对她说。


    她听后笑了。“而且我想，你能够保护好他们的领袖并炸开大门，这也不算太糟，”Lara 赞美道，听起来却很费劲，“而且你还*超级好看*。”


    她用调侃的语气补充了最后一部分。


    “瞧，这可真是个奇怪的笑话，因为我们都知道你们俩一直在*同床共枕*，”Clynt 观察道。


    “没错，”我脸上满了童真的微笑表示同意。“你刚才也是用开玩笑的语气说话，但事实是真的。”


    “随你怎么这么说吧，”Lara 反驳道，但语气很无力很小。


    我拍了拍工具箱的侧面，它哐当一声掉在地上，引起两人轻笑，然后回了自己的工作。


    ## 营地


    我瞥了一眼，看到所有的当地人都在交谈和走动，寻找战利品或决定下一步做什么。他们以前从未做过这种事情，显然被这所困扰。而我们，似乎一直都在做这类事情，虽然我们很庆幸活了下来，但这事并不有趣到能让我们放下手头的工作。


    我穿过那块狭小的空间，知道线圈一定在某个地方。他们的飞行器也需要这些线圈，由于线圈会定期烧毁，这是几乎所有技师都会随身的物品。话虽如此，这里工作的人似乎并不太在意保持物品的整齐。并不是我认识的很多废品收集者有这种习惯。或者说，我也没有。


    但在帐篷的远端有一个大储物柜，我朝那里走去。


    “有什么值得偷的吗？”Lara 问那个 Vekrass 战士。


    他哼了一声作为回答。“光是抢劫可没意思。”


    “当然了，”Lara 同意道。“但我认为，如果我们发现了好东西，你会带走一些的。”


    “如果你发现了一箱金币，记得派人报信，”他笑着说道。


    ## 战利品


    打开柜子后，我打开光照环顾四周。那里有各种零件，还有宇宙中每个柜子里似乎都有的那盒小螺丝和垫圈，柜子底部还有一堆满是灰尘的工具，它们非常冷门，已经久没用过了。


