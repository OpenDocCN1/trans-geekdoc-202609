  trans: '


    除了他的动作比我们快得多且战斗技巧极其残忍外，我们也会疲倦。我们三个人在这一时刻之前已经经历了几场战斗，身体精疲力竭且满目疮伤。与此同时，我们面对的是由机器组成的敌人。他们永远不会磨损、不会减速或出错。然而，他们会利用任何失误。


    拉拉（Lara）和伊莫金（Imogen）两人看起来是同时发力，但审判官（The Inquisitor）却能左右挡开。


    他的动作流畅而有力，两人看起来像是快握不住武器了。


    当拉拉试图向他冲来时，他给了拉拉一拳，挥剑将我挡回，并几乎再次踢中了伊莫金，尽管这次她避开了那一击。


    当我们继续抑制进攻时，我意识到真正处于防守地位的是我们。


    我们没有办法赢得这场战斗，这种意识到虽然短暂，但给了我足够的时间让约翰·格雷高里（John Gregory）乘虚而入，向我的胸口刺来。


    刀刃撞在我的盔甲上发出刺刺声，但没有完全穿透。尽管撞击的力量使我踉跄后退，脚下的碎石崩塌，导致我重重地摔在地上。


    他乘追击，肩膀撞向伊莫金，后者被那红色盔甲撞中鼻部，再次被撞回草丛。火焰开始在我们四周蔓延，火势开始吞噬树木，黑烟与灰雾混合在一起，让我们的世界变得更加黑暗。


    拉拉迅速移动了过来，但现在是一一对一，即使是她也不是那个机械怪物的对手。她保护着身体躲避密集的攻击，但被逼退了。


    当我站起来时，听到耳机里传来内德（Ned）的声音。“听我的。你们所有人。”


    我点了点头，知道他能通过我头侧安装的摄像头看到一切。


    伊莫金在火焰吞噬她被摔落的位置之前，爬回了道路。在我们周围，火势熊熊，也开始吞噬树木。


    “拉拉，”内德说，“现在，上劈。”


    她按照指示做了。


    “伊莫金，横劈，”他命令道。


    “还有汉克（Hank），刺击。”


    我们遵循他的命令，很快我们的攻击确实开始奏效了。在内德像控制视频游戏角色一样控制我们的情况下，吐恩（Twain）无法阻止我们。这是电脑与电脑的对抗，由人类身体执行动作。


    “现在，”内德会大道，我们其中一个人移动。然后另一个人遵循他的命令。


    伊莫金砍中了他的手臂，拉拉击了他的腿部，而我刺穿了他盔甲正下方的一个缝隙。


    战斗变得更加均敌，但我们都开始疲劳，我不知道我们造成的伤害在多大程度上减慢了审判官的速度。他体内的微型机器必须重新分布，急于处理我们正在造成的伤口。但这只是略微地威慑了他。


    与此同时，他能对我们做出的每一次反击和动作都是致命的，在动作间隙，我发现自己喘着粗气，吸入着烟雾，感到火星在皮肤上灼烧。


    “刺！”内德命令道。


    我做到了，从他腋下盔甲的缝隙刺穿了他。


    “现在，伊莫金！”内德大道，她将狼锤深深插入在他的胸口。


    “拉拉！”内德绝望地尖叫。


    她挥动蓝色刀刃，直接切断了他的手，让他的剑掉落在小路上。


    内德的声音不知为何变得沙哑，他咆哮道：“捅死他！”


    拉拉将刀刃没入他颈部的缺口，迫使他跪下。


    “快动手！”AI 大道，但我从口里挤出一个词。


    “等一下。”


    24


    ![](img/image_rsrc3N4.jpg)


    我取出那个小矩形物体，走到审判官面前，按下了按钮。


    我不知道这会发生，但我想弄个究竟。我想看看在摧毁约翰·格雷高里的身体之前，是否能获取信息。我还想让吐恩知道，我可以转化他的人。


    这也许是小气行为，甚至可能是愚蠢的，但我厌倦了他认为我们是可以被他轻易击败的白痴。我想让他尊重我们，并理解这场战斗绝非易事。


