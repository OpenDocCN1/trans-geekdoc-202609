    tried to line up a shot. As you might imagine, tearing across an uneven surface
    on an ancient vehicle with nothing but metal bars for shock absorbers, aiming
    a handgun at an elevated target largely obscured by a protective wall was a rather
    difficult task.


    Nevertheless, I pointed my arm as best I could and squeezed off a shot. To say
    the shot went wide would be generous. Very, very generous. It was more like I
    was trying to start a race, the bolt disappearing straight up into the sky. But
    the guard on the wall flew back, the force of a shot sending him catapulting off
    the wall.


    “Girlfriend’s one hell of a shot,” the young leader shouted at me, turning the
    wheel just enough to avoid another bolt. I thought about correcting her, but I
    wouldn’t even know where to begin, so I kept my mouth shut.


    Anyway, we were approaching the wall and the large door at the front. Our primary
    target.


    8


    ![](OEBPS/image_rsrc3N4.jpg)


    We were close enough now, and the vehicle with Clynt sped up. Picked for being
    the fastest buggy in the fleet, it was able to get them out in front of the rest
    of us, bringing the thief closer to the wall quickly. Now our job was to distract
    and try to get in.


    The larger vehicle was strapped down with explosives hidden underneath a metal
    umbrella, theoretically encasing it well enough to give it time to get into position.
    Unfortunately, some of the guards on the walls had taken notice of it. While some
    were now paying attention to it, the car had shielding on the sides, meaning that
    energy beams crackled against the sides but did no damage. But if even a single
    one made through, we would all be trapped on this side of the wall. Turns out
    that a bunch of fish trying to get into the barrel are just as easy to shoot.


    The scream of each bike that flew off what I had to assume were ramps raised into
    position on the other side of the wall had a driver at the front and gunner at
    the back. They wore jumpsuits covered in light armor and helmets, and their weapons’
    magazines (which they carried many of) were large, allowing them to spray us with
    machine-gun fire. All of our drivers reacted at once, twisting and turning their
    vehicles to avoid the oncoming hail of bullets. That is, except the two that mattered
    most.


    ### The Crash


    If I had ever wondered what it was like to be in the spin cycle of a laundry machine,
    now I knew. The buggy clipped the ground at just the wrong angle, and the whole
    thing hurtled off the ground and spun through the air in a sidelong barrel roll.


    Sky.


    Ground.


    Sky.


    Ground.


    In a twirling whirl, I saw one, then the other, until the vehicle smashed against
    the wall. Then, for a moment, all I saw was white and heard a ringing in my head.
    But I was conscious. And that was something.


    I couldn’t say the same for the leader. She was hanging limp, strapped in her
    seat upside down.

    '
  trans: '

    这可能不是我听过最激昂的演讲，但村民们被触动了，开始欢呼、奔跑并举起武器。甚至有人向空中射击了一枪，我不确定他们是不小心走火还是故意的为之，但每个人似乎因此变得更加兴奋。


    很快，我们制定了计划，所有人骑着村民的越野车向矿山出发。我坐在领袖坐在一起，真希望后悔问问她叫什么名字。拉拉（Lara）坐在一辆从公司偷来并被村民改装过的旧货车里，而克林特（Clynt）则坐在一个年轻猎人的摩托车后座，那个人主动提出承担最危险的任务。


    “谢谢你们了，”她在引擎的轰鸣声和呼啸的风声中大喊道，“你们将改变我们的生活。”


    她没有看我，而是盯着前方那条崎岖的路。但我能听出她喊出的话中的真诚。我并不希望落到这种地步，我知道整个局面的表面上远比我所理解的要复杂得多，但能帮助这些人，我感到很高兴。


    当我们继续前进时，她偷看了我一眼。“你经常做这种事吗？”


    我纳闷她是指在这种情况下帮助像他们这样的人，还是更具体指在火力完全处于劣势的情况下试图攻破敌要塞。无论哪种，答案都是：“是的。”


    即使在颠颠簸簸中行进，她也点了点头，我不禁好奇她在想什么。尽管她很年轻，但似乎很有主见，她的族人尊重她。我无法真正想象在那个年纪拥有那种力量是什么感觉。当我那么年轻时，我做出的最艰难的决定仅仅是如果拉奇（Lutch）让我选晚餐，该吃什么。而与此同时，这个年轻女性正在决定一整个部落的命运。她所做出的选择影响着许多人。我想现在对我也是如此……但我比她老得多，而且从理论上来说，更有智慧。


    ### 接近


    我们行了很久，她才开始减速，所有车辆就到位。时机就是一切。


    当我们旁边的车停下时，拉拉跳下车，迅速在一个小土丘的顶端就位。我们和其他一样在山下怠速，等待时机的到来。


    她步枪的射击声在寂静的大地上回荡，紧接着是轮胎摩擦地面的声音和引擎的轰鸣。我们全部冲过小土丘的边缘，向前冲去，尘土在空气中飞扬。在不远处，灯光开始闪烁，警报声大作。随着守卫们开始奔跑并就位，墙体变得活跃起来。他们的生活改变得多么快。所有人在早晨时还以为这只是矿山里又一个单调的一天，结果一切都改变了。但对于醒来并对抗那些试图入侵他们矿山的人，他们并没有困难。


    从墙上，，紫色的闪电划破天空，灼烧着大地并刺穿了我们的攻击载具。在我们侧面，一道能量弹击穿了简陋的引擎，越野车爆发了巨大的火焰。我们自己的车辆剧烈地抖动。两个轮子离了地面，然后重重地砸回，差点导致我们甩尾。


    ### 战斗


    但那个女孩很厉害。她保持着冷静和坚定，眯起眼睛，正如俗话所说，将油门踩到底。另一道闪电擦着我的身体掠过，我想回击，但我的两把手持武器对这种远距离火力毫无用处。于是，我紧绷身体，在继续清理矮丘与墙壁之间的空间时等待。


    一名公司守卫似乎锁定了我们，即使隔着距离，我也能看到他步枪的枪口正跟着我们。我知道自己的光束会射偏，对他起不了任何作用，但也许足以迫使他躲进掩体后。我拼命抓着越野车的一根横梁，举起另一只手试图对准。正如你可以想象的，在一辆只有金属杆当避震器的古旧车辆上，不平整的表面穿行，用手枪对准被防护墙大部分遮挡的高处目标，是一项相当困难的任务。


    尽管如此，我尽力伸出手臂并扣动了扳机。说这一枪射偏了简直是客气了。非常，非常客气。那更像是我正试图启动一场赛跑，子弹直直冲进了云霄。但墙上的守卫却飞了回去，射击的冲击将他弹飞了墙头。


    “女朋友的射法真准，”年轻的领袖对我喊道，转动方向盘，恰好避开了另一道闪电。我想纠正她，但我甚至不知道从何说起，于是我闭了嘴。


    总之，我们正在接近墙壁和前方的大门。我们的首要目标。


    8


    ![](img/image_rsrc3N4.jpg)


    我们现在离得足够近，克林特的车加速了。由于被选为舰队中最快的越野车，它能够冲在我们所有人前面，让那个小偷迅速地靠近墙壁。现在我们的任务是吸引注意力并尝试进入。


    那辆较大的载具被固定住，金属伞下隐藏着爆炸物，理论上讲，这包裹得足够好，让他们有时间到位。遗憾的是，墙上的一些守卫注意到了它。虽然现在有些人在盯着它，但汽车侧面有护盾，这意味着能量束在侧面噼啪，但没有造成伤害。但如果有一道冲了进来，我们都会被困在墙的这一侧。事实证明，一群进入鱼桶的鱼同样容易被射。


    ### 坠毁


    如果我曾好奇过在洗衣机脱水循环中是什么感觉，现在我知道了。越野车以一个错误的角度撞击了地面，整个物体飞离地面，在空中进行侧向翻滚。


    天空。


    地面。


    天空。


    地面。


    在旋转的漩涡中，我看到天空又是地面，直到车辆撞在墙上。然后，在那一刻，我所看到的只有一片空白，脑袋里嗡嗡作响。但我清醒着。这算是个好。


    我不能像领袖那样。她软绵绵地挂在椅子上，倒挂着。

    '
