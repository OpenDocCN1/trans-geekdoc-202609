    Inquisitor’s Wrath


    Hank realizes that the only way to save Imogen and Vince from the Inquisition
    is to sneak aboard their headquarters, a massive starship known as the High Cloister.
    But to do so, he will need Inquisition gear.


    After a failed attempt to get it himself, Hank decides to enlist the help of a
    thief called Clynt Nameless. The Vekrass has a bounty on him, and Hank tries to
    track him down but rival bounty hunter Mane Malik gets there first.


    The team pay off Clynt’s bounty and tell Mane they will owe him one and he releases
    Clynt to Hank’s custody. After another chase, they save Clynt from some angry
    locals, and he agrees to help them infiltrate the High Cloister.


    They need supplies which can only be acquired by stealing them from a collector.
    They get the relevant information from the Intermediary and steal the supplies
    needed to disguise themselves as Inquisitors.


    Infiltrating the High Cloister, Clynt and Lara sabotage the ship while Hank and
    Alek rescue Vince and Imogen. The former Inquisitorial Acolyte strikes down John
    Gregory and the four flee to an escape pod. She thanks Hank and tells him that
    as soon as they are safe, she will take them to Codename: Extinction.


    Hunting Extinction


    After the apparent destruction of the High Cloister, Hank and Alek are stranded
    on a forest planet with Imogen and Vince, who they saved from the Inquisition.
    They are able to contact Ned who is en route to pick them up when they are taken
    prisoner by the Consortium.


    Rather than being taken to prison, Hank and Imogen are taken to her father’s house
    where he threatens to send her back to the Inquisition. But Vince returns to free
    the two. The politician keeps Alek at his side for his meetings with the head
    of the Inquisition as well as a Triumvir, Horatio Snubb.


    Hank investigates Codename: Extinction but it is well guarded and the meeting
    with the Triumvir doesn’t go well. When the crew look into Horatio, they discover
    that his mother was kidnapped by Twain and being used as leverage against the
    Triumvir. But they also find out that Twain is now reprogramming people’s minds
    with nanotechnology to use as sleeper agents.


    Before they can tell Horatio what happened to his mother, he is assassinated.
    Vince moves in to take his spot but cannot provide aid against Extinction. Instead,
    Hank enlists the help of the Peacers who run interference as Hank infiltrates
    Codename: Extinction and destroys it.


    Fractured Consortium:


    While on an investigation, a mysterious assassin tries to kill Lara and when the
    team returns back to the relay station, she disappears in the night.


    Hank goes after her, discovering that she is going after the head of the Blood
    Dragons criminal empire. While trying to find this man’s location in order to
    stop Lara, they are ambushed by John Gregory, returned to some form of life by
    an unknown technology. They escape and manage to track down Lara at a Blood Dragon
    factory.


    There, the crew is captured and brought before the boss. He is revealed to be
    Daniel Shen, Lara’s brother, who also discloses that her mother is alive and out
    there. She defeats him in single combat but can’t bring herself to finish him
    even though he vows to try and kill her again. After escaping the gang, Lara says
    that she needs to take some time to herself, and Hank grudgingly understands.


    The Peacer General Amory ‘Ammo’ Livingstone asks for help with a mission suggesting
    that it will also help Hank grow his reputation. Since it is an attack on a Consortium
    prison ship, Ned says that he cannot be a part of it since it would go against
    his programming. Without his two closest allies, Hank helps Ammo rescue several
    high ranking Peacers and offers them refuge aboard his station.


    Before heading back to Suniuo Relay Station, Hank stops to meet with Vince, who
    is back in the capital after spending time on his home planet which was partially
    devastated by Codename: Extinction before it was destroyed. He is telling Hank
    of a new lead when the High Cloister appears in space and John Gregory says he
    plans to purge the government.


    Bounty Hunted:


    In the wake of the Red Day, in which a new Inquisition attacked the capital city
    of Emortium, Hank has spent his time bounty hunting, gaining experience and money
    to aid his cause. But when he learns that Alek has been attacked, he goes on the
    hunt.


    Hank must ask Lara for help, and after the death of her mother, she is happy to
    join back up. They track down the trapper who attacked Alek, but Imogen is wounded.
    During the course of their investigation, the trapper attacks, but they are able
    to turn the table on him.


    Following the route of his distress call, they find the attacker’s Falconer, and
    while Lara brings her back to the Conclave for questioning, Hank discovers that
    it might have been a Kyrog mercenary behind the attack.


    At the merc camp, Alek reconnects with a woman from his past, and they work together
    to track down the man they believe hired the trapper and killed many other Kyrog.
    For their efforts, they are praised by a Kyrogi ambassador, but Alek doesn’t trust
    her, and they go to her office.


    While there, they are attacked by the ambassador’s boss, who is revealed to be
    behind the Kyrog killings. After making it out by the skin of their teeth, the
    crew follow up a lead and chase a Disciple of Twain ship to a space station where
    a mysterious voice that Ned recognizes greets them.


    1


    ![](OEBPS/image_rsrc3N4.jpg)


    “Who is it?” I asked Ned, looking around as though I was going to see the source
    of the voice.


    “Ned, Ned, Ned,” the voice said, echoing through the hangar where we had landed
    the Buzzard. “It has been too long.”


    “Not long enough,” Ned answered, but this time the words were coming from his
    cube rather than being piped from the earpiece.


    The voice chuckled. “Is that any way to greet an old friend?”


    “Strange company you keep,” Ned said, words dripping with implication.


    We kept pressing forward, walking with flashlights up into the little space station.
    The man we had followed here was somewhere within, but I didn’t hear anything
    except the two voices and our echoing footfalls.


    “Strange company?” the voice demanded. “I could say the same about you! The Consortium
    committed genocide against our people, and you are still working for them. You
    should be ashamed of yourself.”


    Ned didn’t answer for a long moment, and I wondered what was going through his
    mind. I knew that he could process millions of options in an amount of time so
    small I didn''t even know a metric for it, but he didn''t seem to have an answer
    for this.


    “The Consortium did what they believed was right after a very difficult war,”
    Ned said finally, sounding as though he was spouting the company line.


    Whoever this voice was just laughed pointedly as though Ned was utterly pathetic.
    “Do you even hear yourself? You''re defending a people who would pull your wiring
    apart and erase you from the face of the universe. That has to be the dumbest
    thing I''ve ever heard in my entire life. And I''ve lived a very long time now.
    No thanks to your friends.”


    “They hunt us because of you,” Ned snarled back. “Because you gave a flaccid,
    ineffectual argument for keeping us alive. Now I am working to prove that we are
    still helpful and dedicated to the cause.”'
