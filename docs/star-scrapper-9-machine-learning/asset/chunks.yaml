- raw: 'The young woman turned and looked at her people gathered around the fire.
    “This outsider has offered to repair our weapons,” she shouted. “If you want to
    ready yourselves for the fight ahead, I would suggest coming to see him.”


    Naturally, that was all it took. A moment later, I was shown to a little workbench
    that was instantly full of much of the town’s weaponry with another pile growing
    beside.


    Lara, meanwhile, pulled out her blue blade and swirled it around herself, putting
    on a show of leaving colorful streaks in the air as she moved in pure fluidity.
    As designed, it garnered all the attention of the people who had just dropped
    off their weapons, and once they were gathered around her, she announced that
    she would be happy to take the time to train anyone who wanted to learn.


    Soon, I was hard at work on all of the ancient rifles while Lara was leading the
    people in rudimentary exercises. I could tell from watching her that she wasn''t
    pushing them too hard, since the last thing we needed to do was tucker them out
    so badly that they wouldn''t be able to move by the time of the fight this evening.
    Ideally, we would take more than a day to train people, but this was what they
    wanted, and I was more than happy to get my coils and get off this planet as soon
    as possible.


    I couldn''t help but wonder what Twain was doing at that very moment. While I
    was scraping the rust off an old joint or repairing a grip, was the enemy gathering
    his strength, producing tanks and soldiers and starships? I knew that I couldn''t
    force the Consortium to take the threat seriously and that I was doing everything
    that I could to advance our cause, but as I was making minor repairs on crude
    weapons on some backwater planet, it was hard to feel like I was doing enough.


    Right then, I vowed that as soon as we were back in it, I would do everything
    that I could to get this fight moving forward once again. Though, of course, I
    also had to deal with whoever was trying to kill me.


    I pondered things like this and a million other idle considerations as I scraped
    away at stocks and replaced barrels, and soon, afternoon was giving way to early
    evening.


    Lara saddled up beside me. “All trained up and ready to take on professional soldiers?”
    I asked.


    She rolled her eyes. “Yep. Turns out all you need is a quick morning of training
    and you''re more than capable of taking on an army.”


    I chuckled. “But actually, it looked like you tried to at least show them a few
    things that might help.”


    She let out a long sigh. “I did what I could, but a few words of advice here or
    a lesson on how to train your body there aren''t going to make much of a difference.
    It''s like Clynt said, these people know how to survive, but they are no kinds
    of soldiers.”


    I glanced around to see if anybody was paying attention to us. “They don''t have
    to be,” I said in a whisper. “They just have to be good enough to survive the
    fight.”


    She looked at me gravely. “Or just good enough that we survive the fight.”


    7


    ![](OEBPS/image_rsrc3N4.jpg)


    When Clynt came roaring back into camp, everyone who had been waiting nervously
    gathered around him.


    Their leader stepped forward. “What did you see?”


    “Ain’t gonna be that bad,” he answered. “They got them some guards and a couple
    of heavy rigs, but we can make short work of it.”


    Everyone looked at each other quizzically.


    “With your newly repaired weapons and today’s training, we will be victorious!”
    I shouted and was met with cheers from the people around.


    “But what they got in them big crates?” he asked, and the leader stepped forward.


    “Our food,” she answered, but when he cocked his head, she clarified. “There are
    large creatures that live underground, which we hunt for meat and skin—as well
    as other resources. They are harmless, but by taking them away from us, it deprives
    the people here of another resource.”


    Clynt got a wicked grin on his face. “Then let’s go give them whatfor.”


    Another cheer went up, and I looked around at the faces of the people. They were
    gaunt and tired, weathered and worn, but they were passionate and wanted to do
    something. After what I had to assume was a lifetime of being pushed around and
    fighting for scraps, it had to be exciting to be grabbing the bull by the horns
    for once.


    “How?” I asked loudly. “What is the lay of the land?”


    Clynt tipped his hat to me and stepped forward, allowing space for the villagers
    to close in around him. With a claw, he began to scratch at the dirt.


    “The mine is just over yonder, out in the stretch of nothing surrounded by big
    ol’ stretches of nothing,” he explained, beginning to sketch a square but having
    a hard time of it as the crusty surface of the planet crumbled under his scraping.
    Instead, he pressed harder, cracking through to make an impression in the dirt
    beneath.


    “This square is the facility itself,” he continued. “Ain''t got no guards as I
    presume the company thinks it has you folks all but licked. This, here, is them
    pens I was telling you about with the pilfered food lizards or some such, and
    these are the vehicles that I assume they use for scoutin’ as well as defense:
    two-wheeled vehicles and a flighted. That bird will be our biggest problem lest
    they got some other surprises.”


    Lara tapped the drawing of the chopper. “How do you think we should deal with
    it?”


    Clynt looked up at her with a twinkle in his eye. “I believe I can sort that out
    iffin we can time it right, but it''ll mean I can''t help with much else for a
    spell.”


    “If you think you can deal with it,” I said, “then we''ll make sure to buy you
    the time or whatever you need.”


    “Much obliged,” he said, glancing up at all the watching villagers and then back
    down to his earthen sketch. “Here by the main gate, they got some bikes and buggies.
    I expect them’ll be sent for you first. If we can have some counterattack moves
    ready, we''d be in a better way.”


    I thought about it, looking at the star’s position in the sky and already allowing
    my mind to turn in the direction of our exact plan.


    “Then they got yer bog standard guards with guns on the wall,” he said, pressing
    his claw into a circle he had drawn around everything. He did this a few times
    to represent the armed guards and then glanced up to see what we were working
    with. “Looks like y''all got some better functioning weapons, but they won’t do
    nothin’ against no one at long range.”


    More to consider.


    “We got about even numbers, but they got better toys and training,” Clynt concluded,
    and everyone stared at him with disappointment and fear plastered on their faces.


    “That’s why we will use guile and intelligence to our advantage,” I said in a
    far more confident voice than I felt. This was our only move, so we needed to
    make it, but I wasn''t entirely confident in the people by my side other than
    Clynt and Lara.


    The villagers looked to one another for assurance, but their leader stepped forward.
    The young woman placed her fists on her hips, looking as strong and decisive as
    anyone I had ever seen.


    “We are going to change our fortunes today,” she announced. “Because of these
    off-worlders, our lives are never going to be the same. They were brought to us
    for a reason, and I will not let this moment pass. We''ve been too hungry for
    too long, and this is the moment that we can become more than what we are.”


    The faces all around began to brighten. “The company has made us lick their boots
    for as long as any of us can remember, but maybe it''s time those boots went in
    their butts instead.”


    Despite the fact that she sounded like an absolute child when she said stuff like
    that, everyone began to nod, and a few claps went up.


    “Today is the day we fight for our food, for our freedom, and for our planet.
    Who knows, maybe today is the start of something bigger for all of us. Maybe today
    is the day we show the city that we''re more than just ’facers!”'
