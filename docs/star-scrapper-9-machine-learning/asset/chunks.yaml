  trans: '

    我剧烈地眨着眼睛，从屋顶内侧的位置微微挪动了身体，那里屋顶现在正压在地上。我确认了我的四肢都在，一切似乎都运作正常。除了全身作痛，而且因为满身的淤青，我看起来可能比一只康涅斯柯猎犬还要紫之外，我还算没事。


    我向前爬，在领队者下方找了个位置，然后解开了她的安全带，好让我把她平放在躺在狭窄的空间里。这提供不了什么保护，但总比让她倒挂着吊在那里或者把她拖到开阔地上要好。


    越野车颠簸着、抖动着，机枪扫射我们侧面的砰砰声瞬间充斥了车舱。我用身体挡住女孩不让她被中弹，但我们很幸运，子弹似乎只击中了金属。问题是，我的移动引起了对方的注意，我知道现在能做的最好的事情就是离开这里。


    我拉下插销，推开其中扇门，整个人几乎掉了出去。我偷偷看了领队者一眼，她正闭着眼睛呼吸浅浅，但密集的枪火声立刻把我拉回了要做的事情。


    摩托车和越野车彼此间穿梭，光束和子弹交织在一起，泥土烟柱向昏暗的天空升起。看着这一幕，我看到那辆爆炸车辆停在离大门几米远。透过尘土眯起眼睛，我看到司机和备份操作员都瘫倒在地上，那姿态已经说明了我需要知道的一切。


    我抬头看向墙墙，看到几名守卫发现了我，然后调整武器朝向我的方向。就在我还没来得及拔出手枪时，拉拉就击中了其中一个，一团鲜血在空中喷溅，随后他消失在墙后。但另一个朝我脚下开火射击，子弹划过我的外套，迫使我跑得更快。


    我胡乱地回击了几发子弹，将子弹射回墙顶，但我没有听到任何反应。片刻后，我猛地撞在了那辆爆炸车辆上。我抓住门把手用力拉，感觉没有阻力，但门也没没开。


    一道光束击中了我旁边的一块焊接好的船体碎片，灼烧了金属，并在一阵热浪中扩散，震得我缩了缩。我再次拉动门手，什么都没发生。我低头看着，想起曾站在一个星球的一堆汽车上，那个星球对四轮车做的就像拉奇和我对星际大战做的一样：修理它们。


    “有个手动释放装置，”他说道，看着我对着一辆旧货车的门挣扎。我看到后部有一板桌游，想把它抓过来，希望废品场的老主能免费让我带走，但也知道我可能得讨价还价。


    我再次低头扫视了整扇门，手划过它的弧度和断裂处。


    “不，”他咯笑着，指着那里，但如果没必要就没爬上那堆废料，“从窗户伸进去。”


    我本能地向门上的缝隙伸去，手指撞在了紧闭的窗户上。


    随之而来的声音是我当时非常厌恶、但现在愿意付出任何代价再听一次的：我父亲的笑声。当我紧握手指并作痛时，他放声大笑。当我死死盯着他时，他继续沉浸在他小恶作带来的快乐中。


    为了弥补，他让我砸碎了窗户并拿回游戏，支付了汽车的损坏费和桌游的钱。尽管他总是对我耍这种花招，但他几乎从不提起，但每当我拿出那款游戏时，他都会想起那段记忆而露出一丝微笑。


    现在，那段记忆救了我的命。伸手进去后，我拉开了手动释放装置并打开了门，就在这时，另一道子弹朝我射来。就在我钻进去时，它撞在了门上，我向被我推开的男人低声道歉。

    '
