  trans: '

    听到这个名字，我转头看向伊莫根（Imogen），她的脸色白得像鬼。


    “你能把它击落吗？”拉拉（Lara）问卡西奥娅（Cassiopeia）。


    “不能，”她回答道，“我不控制空间站的武器，即使我可以，它移动得太快了。而且，火炮是为了对付更大的船只设计的。”


    “没关系，”我说，“是时候彻底解决他了。”


    伊莫根看着我。“你想在这里就对付他吗？”


    “是的，”我说，“无论如何，我们都需要面对约翰·格雷高里（John Gregory）。”


    “你可以再次把他的脑袋砍掉，”拉拉说着，握拳拍了拍伊莫根的肩膀。


    那位曾经的侍从听后笑了。


    “这个空间站上防御性最好的位置在哪里？”我问那两个 AI，觉得其中一个会给出一个好的答案。


    “这个空间站并不是为了那种事情设计的，”卡西奥娅回答道。


    德（Ned）补充道，“所以你可以任选地点。”


    “我们应该在机库里伏击他们，”拉拉建议道。


    没有进一步的讨论，我们回到了推车。然后我尽力推着它来到电梯，穿过底部的走廊。


    “我在拖延他们，”卡西奥娅告诉我们，“我正强迫他们在 `Bay 03` 停靠，因为那里有几辆运载车可以躲在后面部署位置。”


    “我们刚经历过那样的战斗，”拉拉笑着说，“所以我们会准备好的。”


    我不知道这话有多大真实。


    和特恩（Twain）的几个人战斗很困难，但每当我和格雷高里战斗时，我总是幸运地逃一条命。我叔叔就没有那么幸运了。这段记忆也激励着我。虽然那个降落的家伙并不是做过那事的同一个人。


    真正的审判官，真正的约翰·格雷高里已经死了。这个朝我们而来的东西是被特恩重新拼凑起来并让他为他战斗的。


    但看起来，那个老人的某些可能仍然被埋在里面，我知道他在接下来的战斗中会愤怒地反击。


    在把推车停稳后，我们迅速跳下车，通过门进入 `Bay 03`，那是另一个巨大的空间，但这个空间设计用于让飞船降落。


    我们都移动到各种机械后面，拿出武器并进入掩护位置。


    “我会告诉你们什么时候开火，”德说，“我可以挑选最准确的时机。除非我另有指示，每个人根据自己的位置从左到右攻击目标。阿列克（Alek），我让你听我口令准备冲锋。”


    我们都理解了，并在凤凰级飞船降落时等待。


    当磁力平台（placemags）启动的瞬间，我感到心跳开始加速。这就是我们一直等待的时刻。这个空间站不仅提供了海量信息，我们还让约翰·格雷高里措手不及。


    除非卡西奥娅一直都在假装，而埃德温（Edwin）的程序没有起。她可能一直在扮演一个自由奴隶，并告诉审判官来这里对付我们。


    当跳板落下，一整队奴隶下船时，在我看到任何红色盔甲或黑袍之前，这个理论证明是一个更大的可能性。但随着审判官们的跟上，我艰难地咽了口唾。


    他们似乎非常多。一个接一个，又又一个，后面跟着一个小得多的审判官，露着尾巴。我以前从未见过维克拉斯拉斯（Vekrass）审判官，但万事都有第一次。


    我本不想再派别人过来，但现在真希望我告诉克林特（Clynt）开着 `Buzzard` 跟上我们。


    说起来，他去哪儿了？我不记得自己告诉过他跟上我们。


    想想，他去哪儿了？我不记得告诉过他如何处理那艘船，除了停下来。


    “准备好了，”我低声说，看着所有人。

