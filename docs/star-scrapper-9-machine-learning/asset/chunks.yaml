  trans: '


    一阵铃声响起，紧接着是一条信息。“全体人员注意，”一个冷静的女性声音说道，“我们收到消息，恐怖分子已经获了我们的位置，并可能尝试进攻。因此，我们将在十分分钟后启动
    `Tidal Drive`。”


    “你现在满意了吗？”内德在我耳边问道，“我们确实遇到了你想要的那些困难。”


    “好，”我环顾四周房间说道，“我们需要现在让你们所有人离开这里，立刻！”


    索菲亚对我低声说：“我不认为他们所有人都能挤进那艘宠物美容船里。”


    正当拉拉和伊莫根出现在门口时，所有人都也开始同时站了起来。


    “该死，”拉拉说，“人也太多了。”


    “人多，但都是我们要救的人，”伊莫根纠正道。


    拉拉看着她，又看了看房间里所有人身上穿着肮脏且满是污渍的衣服，那显然是他们被带走时穿的衣服。


    一个老妇走到我面前。“那我的儿子呢？”她用浓重的口音问道。


    “他怎么了？”我询问道。


    她看向我身后的走廊尽头。“他被带走了。被那些医生带走了，再也没有回来过。”


    “什么时候？”伊莫根问。


    老妇人显得很困惑。“现在是几号？”她问道，“我在这里呆了多久了？”


    聚集在周围的一些人也听着对话。“那我的丈夫呢？”一个人大喊道。


    “我的妈妈呢？”一个小男孩喊道。


    “汉克，”拉拉说着，将我拉回门外低声说，“我们需要带这些人离开这里，并帮助他们面对现实：他们的亲人被当成了实验对象，而且永远不会回来了。”


    我严肃地看着她。“我们并不完全确定这一点。”


    “我很确定，”她说，指了指走廊另一一扇敞开的门。


    我给了她一个疑惑的眼神，知道不该在家属面前问这种问题。


    “那里和我们上次看到 `Twain` 进行研究的地方一样阴森，”她低声说。


    我看着所有那些失去了亲人但还不知情的人们。我可以告诉他们真相，告知他们 `Enemy AI` 试图将他们的家人变成僵尸但失败了，并在过程中杀了他们。但这样做只会让伤亡人数翻倍。我需要带这些人离开这里，去往安全的地方。


    我转身面对他们。“你们的家人在另一支救援队那里，”我喊道，“但为了见到他们，我们现在必须立刻离开这里。所有人，跟我们走，我们会带你们上另一艘能带你们去安全的船。”


    所有人都站了起来，开始朝我这边挪动，而我走出了门。伊莫根用审判的目光看着我。


    “你刚才说的话没有一句是真的，”她轻声说。


    我直视着她的眼睛。“你认为如果我告诉他们真相，他们会跟我走，还是会因为悲痛而彻底崩溃并死在这里？”我问道，“在将来，他们可能会因为我对他们撒谎而恨我，但他们至少能活着去行这种事。”


    她盯着我几秒钟，脸上露出了理解的神情。她显然不喜欢我的欺骗行为，但理解为什么要这么做。


    “快来，”我喊道。


    “距离 `Tidal` 出发还有八分钟，”扬声器里传出冷静的声音。


    人们开始陆续离开房间，拉拉在走廊聚集了他们。他们太害怕了，可能已经被威胁了太久，以至于没有一个人发出声音。每个人保持沉默，或者只是彼此低声耳语。


    “那是个很明智的决定，”当我帮助一些行动较慢的人出门时，内德说道。“我为你感到骄傲。”


    听到他这么说我很惊讶，但但真的非常感激。这些决定是我临时做出的，我一直希望它们是没问题的，但当我帮助那个被我撒过谎的老人离开他被囚禁的房间时，他的赞美正是我需要的。


    “你们两个守住最后方，”我对伊莫根和索菲亚说，“不要让任何人掉队。”


    他们点头表示理解，我穿过人群，空气中弥漫着浓重的绝望和囚禁的味道。


    当我到达前方时，我拍了拍耳机与内德无声通信。“你进入这里的任何一个系统了吗？还有其他我们可以乘坐的船吗？”


    “没有，”他回答道，“没有别的船了。”


    该死。


    我绞尽脑筋，试图寻找最佳方案。“叫上 `Peacers`。让他们现在过来，”我说，“如果 `Jackson` 能绕过火炮，也许我们可以把大家都挤进 `Buzzard`
    上。”


    “我们需要一艘更大的船，”内德说道，我才明白了了他的意思。“我已经和 `Libby` 通过气了，她会随货船一起把 `Cassiopeia` 过来。但我们需要希望
    `Peacers` 能拖住他们足够的时间，以防止货船被摧毁。”


    内德之前非常担心自己会因为 `Twain` 的程序对他造成的伤害而迷失自我，但在这一刻，他如往常一样清醒。在我们需要的时候呼叫确切的援，并预判我的需求，这正是伙伴型
    AI 的职责。


    而我们之所以能够击败 `John Gregory`，唯一的方法就是有了内德的帮助。他再次证明了，在人类创造的机器帮助下，人类依然优于 `Twain` 试图强加于宇宙的强制融合。


    '
