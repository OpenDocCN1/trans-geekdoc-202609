- raw: 'Unlike in most places where you would immediately expect to see rubberneckers
    trying to figure out what was happening, everyone here was respectful and pretended
    like they didn’t even notice the guards or medics with a stretcher who were charging
    up the street.


    “I am Hunter Vex, and this is Hunter Spears,” Lara stated to the Purple Cloak.
    “We just arrived to check in with our Falconer to find her gravely wounded as
    you saw.”


    “Did she say anything about what happened?” the woman asked.


    Lara shook her head. “She murmured something, but it wasn’t related to what happened.”


    “I’m sorry to hear that,” the Cloak stated. “Do you know if she has any enemies?”


    I watched as Lara’s mind worked, as she thought about the fact that we had angered
    the trappers, and they were coming for us. That we had hearsay evidence against
    some but didn’t know who, and that they had shot us out of the sky.


    But she said none of that.


    Instead, she shrugged. “If you know Zenobia, you know that she plays things pretty
    close to the vest.”


    The woman’s lips pulled tight. “I didn’t know her well, only in passing,” she
    said. “I am sorry for the two of you that this happened. As you know, violence
    in the Conclave is strictly forbidden, and this matter will be investigated aggressively.
    We will leave no stone unturned.”


    “Thank you,” Lara said, running the back of her hand across her cheek.


    “But let me remind you,” the Purple Cloak warned. “We are the ones doing the investigation.
    I understand that you are mad and that hunting people is your profession, but
    here in the Conclave it is our job, and if you hamper our investigation in any
    way, you can be brought up on charges as well.”


    “We understand,” I said, but she was staring at Lara.


    “We understand,” she repeated, and the woman nodded. Behind her, Zenobia was being
    taken away from her office. The woman glanced back and then to us. “She will be
    with the Doctor, and they will send word when you can see her.”


    Lara nodded, her eyes following Zenobia up the street. She looked as though she
    wanted to go running after the stretcher like a child chasing their parent who
    just said goodbye. But she stayed rooted to the spot.


    “Thank you,” she said to the Purple Cloak. “And please do let us know if you need
    any help.”


    “By the same measure, please let us know if you think of anything else that will
    help in our investigation,” the woman said with a curt little nod before turning
    on her heels and marching away.


    I turned to Lara. “I’m so⁠—”


    But I didn’t get out another word before she had began sobbing deeply into my
    chest.


    “I did this,” she moaned, and I knew that she had to feel this way even if it
    wasn’t true. I could have tried to convince her that she wasn’t responsible, that
    the trappers were doing this in response to both of us, and because they were
    taking action against the Conclave’s rules, but she knew all those things.


    What she needed now was to feel how she felt.


    I held her for a long time, her body shaking against mine until she was done.
    When she looked up at me, her face was soaked and her eyes bloodshot.


    “Want to go back to the station?” I offered, but I knew she wouldn’t.


    “No,” she said unequivocally. “I want to find the nearest trapper and beat them
    until they tell me who greenlit us or break into the prison where Roan is being
    held and⁠—”


    “Beat her until she tells us who greenlit us?” I finished.


    Lara’s jaw pulsed. “Yes.”


    “We can’t do any of those things,” I said. Looking over her shoulder and seeing
    all the guards buzzing around Zenobia’s, I also knew that we couldn’t just investigate
    on our own.


    “Well, I can’t leave, and I can’t just sit around either,” she said.


    Then I spoke words that I never expected to leave my mouth. “Let’s go speak with
    Mane.”


    Her face tightened. “Why?”


    “Because he is connected, and never repeat this, but he’s powerful here and probably
    knows people who can help us or might know where we should begin,” I said.


    Lara took a long, slow breath in and then released it even more slowly from her
    slightly parted lips. “You’re probably right.”


    “Trust me,” I said. “I want to chat with him as little as you do.”


    “Because you drunkenly crawled into bed with him one time, too?” she asked, the
    shame thick in her words.


    I felt my face react. “Ugh, no,” I said. “But I’ll never understand how that happened.”


    “You’ve never had a night you regretted?” she asked, arching an eyebrow on her
    still red and swollen face.


    We had danced around this before, and I knew better than to get too deep into
    it, especially now, so I hedged. “Of course I have,” I said honestly. “I guess
    that I’m just lucky I don’t have to see any of my regrets on a regular basis.”


    “Or go ask them for help when a loved one gets shot,” she said.


    “You think she was shot?” I asked.


    She shrugged. “Just something I said. It was hard to be sure.”


    “You said she muttered something to you when you got there,” I said. “What was
    it?”


    She looked at me for a long moment. “Let’s go see Mane.”


    We didn’t speak as I led us to his estate. Lara hadn’t been there, but I had and
    remembered the way, so we traversed the now bustling city to his large compound.


    When we reached the front and rang the bell, it wasn’t long before his apprentice
    appeared. Lara stifled a laugh when the young woman approached wearing an outfit
    in the style of a loin cloth. Though, to call it an outfit was being generous.
    It looked as though she had asked the designer to make her a garment with the
    absolute least amount of fabric while still technically covering the things that
    needed to be covered.


    “Is Mane in?” I asked when she stopped in front of us on the other side of the
    gate.


    “He’s doing his calisthenics,” she answered.


    When she didn’t say anything else, I spoke. “May we come in and wait?”


    “Is he expecting you?” she asked, sounding more like she just wanted to stand
    in our way than because she actually cared if we did.


    “He is,” Lara answered.


    The apprentice huffed. “Fine,” she said, stepping up to press a button and open
    the gate.


    “This way,” she said, starting to walk in the direction of the pool. If I had
    thought the outfit was light on material before, seeing it from the back was a
    whole other matter. But out of the corner of my eye, I watched Lara watch me to
    see if I was staring. So I was sure to not.


    Though she got her own opportunity to stare a moment later as Mane saw us approach
    and exited the pool. Unsurprisingly, he swam in the nude and was sure to get out
    slowly, taking his time with each step and running his hands through his blond
    hair as he did so.


    To my great chagrin, he was cut like one of the statues from the city beyond.
    I wondered if he even caught bounties anymore or if he spent the majority of his
    time just getting into shape. He even had muscles that seemed to point to the
    exact thing he wanted all of us staring at.


    Now it was my turn to see if Lara was looking, but she put on a show of shielding
    her eyes with her fingers.


    “Put on a damned towel, Malik!” she shouted.


    He laughed, stopping at the lip of the pool to put his hands on his hips. “This
    is my home, and if I choose to walk around in the buff, that’s tough titties to
    you.”


    I stared him right in the eyes. “You’re right, but it would be great if we could
    have a conversation without your little friend present.”


    He grimaced at my use of the word little and stomped over to a chair, where he
    grabbed a robe to throw on.


    “To what do I owe the pleasure?” he asked once he was somewhat covered.


    “Zenobia was shot,” Lara said with such severity that even Mane Malik took her
    seriously, and his face hardened.


    “A Falconer was attacked?” he asked in astonishment.


    “Yes,” Lara said, her voice tremulous with anger and misery.


    “This is appalling,” Mane said. “Nothing like this has happened since the Amchislavsky
    Incident. And that was a long time ago.”'
