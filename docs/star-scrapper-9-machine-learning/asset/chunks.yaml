    I heard Imogen say in a low voice from inside the tent. I stopped, listening and
    trying to get the situation.


    “You don’t have to feel any way about anyone,” another voice said, and it sounded
    like a young woman—older than me but younger than I was. “Just because they gave
    to you or raised you ‘the best they could’ or whatever doesn’t give anyone the
    right to treat you the way that you’re telling me have. So, don’t feel like you
    ‘should’ feel some way. You’re only hurting yourself.”


    “I guess…” Imogen answered. “It’s just…”


    “Just what?” the other girl pressed. “Are you going to give me some nonsense that’s
    actually your trauma manifesting as a justification for their behavior?”


    Imogen laughed. It was a sound that I had heard so few times that I almost didn’t
    recognize it. “Probably,” she allowed. “Sophia, how are you so smart?”


    “Oh, what?” Sophia asked. “Just because I grew up on some backwater shithole,
    I have to be bumpkin?”


    “I mean, kinda,” Imogen said with what sounded almost like a giggle.


    The other girl laughed heartily. “What a spoiled-little-rich-girl thing to say.”


    “I’m not that,” Imogen said seriously. “Not anymore. An Inquisitor flogged it
    out of me. Among other things.”


    There was a pause. “Oh, whoa, I’m sorry.”


    “It’s fine,” Imogen assured her. “You couldn’t have known. And I’m not even sure
    why I told you. We only just met.”


    “You told me because we’re kindred spirits,” Sophia said. “Because we somehow
    connected despite the fact that I am pretty sure we have nothing in common.”


    Imogen let out a little snort. “We have attitude in common.”


    “Attitude?”


    “Yes,” Imogen said. “We might not have the same references or experiences, but
    we see things the same. And I think that is more important than all the other
    stuff.”


    Sophia didn’t speak for a long moment. “How did you get so wise?” she asked finally.


    “How did you?” Imogen answered.

