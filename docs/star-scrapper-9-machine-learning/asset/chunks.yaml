  trans: '

    我知道她在撒谎，我怀疑房间里的其他人也一样，但阿拉娜（Alana）既是个政治家，也是一名赏金猎人，她顺从了这一切。“很好，”她说，“现在如果没有其他事了？”


    “没有了，”拉拉（Lara）站了起来。我也站了起来，但当曼（Mane）移动时，那个康西西亚人（Conecian）用一个眼神制止了他。“非常感谢你们提供的这个机会，并认真对待我们的顾虑。我无法言表我是多么感激。”


    “等我给你派任务时，你可以在外外表现出你的感激之情，”那个女人说道，但语气亲切和蔼。


    “我们会的，”拉拉向她保证，我只是向她点了点头。


    我们俩离开房间，走向院子，期间没有交谈一言。无论拉拉在想什么，她都很清楚此时此地不宜分享，但一旦我们完全离开建筑并沿着小路走起来，我不得不问问发生是怎么了。


    “她说的话里有什么引起了你的兴趣，是吧？”我问道。


    她点了点头。“是的，”她毫不犹豫地回答道，“当辛（Syn）——”


    但当她看到之前按响铃的守卫朝小路跑来时，她停止了说话。他看起来很匆忙，看到我们时挥了挥手。


    “维克斯（Vex）和斯皮尔（Spears）猎人，”他在我们面前停下，气喘吁吁道我有消息。”


    ![](img/image_rsrc3N4.jpg)


    等守卫告诉我们消息后，拉拉朝守卫脸上挥了一拳，将他重重地摔在街道上。接着，她发出了我从未听过的尖叫。我想安慰她，帮她，但首先我上前去扶起守卫站起来。


    “你还好吗？”我问。


    他似乎处于震惊中。“我想我没事，”他回答道，“这已经是一天了……”


    拉拉弯着腰，看起来像是要吐了了。


    “离开这儿，”我对守卫说，尽管我完全没有权利告诉他该做什么，但他转身冲了。


    我用一只手臂搂住拉拉，她正痛苦地抽泣着。


    “现在我们该回驿站吗？”我问道。


    她长长地喘了一口气，说道：“不。”


    我们在那里站了一会儿，温暖的微风吹动着周围的树木。


    “我需要喝该死的酒，”她终于说道并走了起来。


    直到到达酒馆之前，她没再说过一个字。台前的男人没有试图拦我们，女老板也没有为我们留位。他们看到了拉拉，知道她正直接走向吧台。


    “我要来杯巴塞尔酿造（Bussel Brew），”我说，但拉拉摇了摇头。


    “两份‘猎人金（Hunter’s Gold）’，”她说，“也给他来一份。”


    他看着我，我只是快速地扬了一下下巴。他转身倒了酒，当他把酒放在柜台上时，拉拉接连喝了两个杯。我不甘落后，也做了同样的动作。


    “我很抱歉，拉拉，”我说，听到这句话时，泪水再次涌了出来。


    她伸出手，也抿了一口我的啤酒。“我甚至不知道该从何说起，”她说，“现在的悲伤是该死的太深了。我的亲生母亲就死在我面前，但这个这个这要糟糕得多。”


    “你并没有真正了解你的母亲，”我说。“泽诺比亚（Zenobia）帮你抚养你。”


    拉拉点了点头，用她空空的小酒杯敲击着吧台，示意要再来一杯。


    “我想她预料到了这一切，”拉拉说道，话语是艰难地挤出来的，“当我看到她时，她没有提任何发生在她身上的事……”


    当她沉默了很久，我问：“她说了什么？”


    “她……”她开始说道，但话几乎说不出来。“对我变成现在的猎人感到自豪。”


    然后她又崩溃了，双手撑在吧台上，哭得更厉害了。

