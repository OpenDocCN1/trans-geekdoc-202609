    \ to ready yourselves for the fight ahead, I would suggest coming to see him.”\n\
    \nNaturally, that was all it took. A moment later, I was shown to a little workbench\
    \ that was instantly full of much of the town’s weaponry with another pile growing\
    \ beside. \n\nLara, meanwhile, pulled out her blue blade and swirled it around\
    \ herself, putting on a show of leaving colorful streaks in the air as she moved\
    \ in pure fluidity. As designed, it garnered all the attention of the people who\
    \ had just dropped off their weapons, and once they were gathered around her,\
    \ she announced that she would be happy to take the time to train anyone who wanted\
    \ to learn.\n\nSoon, I was hard at work on all of the ancient rifles while Lara\
    \ was leading the people in rudimentary exercises. I could tell from watching\
    \ her that she wasn't pushing them too hard, since the last thing we needed to\
    \ do was tucker them out so badly that they wouldn't be able to move by the time\
    \ of the fight this evening. Ideally, we would take more than a day to train people,\
    \ but this was what they wanted, and I was more than happy to get my coils and\
    \ get off this planet as soon as possible.\n\nI couldn't help but wonder what\
    \ Twain was doing at that very moment. While I was scraping the rust off an old\
