- raw: 'She smiled miserably. “I couldn''t have put it better myself. That''s exactly
    what happened. One of the minerals found here is used in the process to create
    Tidal Drive fuel. It''s not the primary ingredient or anything, but I guess it''s
    important for the refining process and not super common around the universe. So
    the company came and started building mines all around the surface.”


    “And pushed the locals out?” I asked.


    She tilted her hand from side to side. “Yes and no. At first, they tried to act
    all friendly and offer people jobs, but it didn’t take long for them to turn on
    us. Those who wouldn’t relocate or accept positions in the mines became the enemy.”


    This story was already sounding all-too familiar.


    “But the company couldn’t outright attack the natives, of course,” she continued.
    “So, they did the next best thing—sent their own hunters and foragers out in droves
    to strip the already barren land of its food and materials. Their trucks rumbled
    forth and guzzled up as much of the water from the subterranean wells as they
    could. Soon, there was almost nothing left.”


    “Have ta think them locals knew where to find more,” Clynt interjected.


    The young woman nodded slowly, worrying the end of one of her braids before realizing
    she was doing it and bringing her hands to her sides. “They did, but the company
    also hired some locals to let them in on their secrets. And anyway, it seems like
    they didn''t actually want to cause everybody to starve to death. Instead, wars
    began between different local tribes. Long friendships and even ancestral families
    fought with each other. Because when all is said and done, people will do anything
    and turn their backs on anyone if it means they can feed their starving child.”


    We all nodded gravely.


    “So, large battles were waged,” she explained. “But the company wasn''t done.
    Not yet. They backed the smaller tribes, giving them weapons and resources.”


    I knew there was probably a good reason for it, but I couldn''t figure it out.
    “Why not just back the larger tribes and let them wipe everybody out?”


    “Because that would leave one powerful group to contend with at the end,” Lara
    said in a thoughtful tone.


    “Yeah, that’s right.” The young woman bobbed her head. “By funding the smaller
    tribes, they were able to weaken everybody. Though the bigger groups ended up
    being victorious in the end, their numbers were so thinned that there was almost
    nobody left. Then, things got even worse. As the resources continue to become
    scarce, one man decided to lead everybody who remained against the company.”


    Lara bumped me with her shoulder. “Sounds like you.”


    “But that was a huge mistake,” the girl said, voice heavy with melancholy. “As
    soon as the united tribes began attacking the company, they retaliated in force.
    They declared us terrorists and fought back. Apparently, the Consortium wouldn’t
    let them hunt us or anything like that, but they were given permission to defend
    their interests. And they defended them aggressively. Now, all that’s left are
    some groups of us just trying to survive, the other tribes who would just as happily
    steal from their own, and the so-called terrorists.”


    “I get that this place is your ancestral homeland and all,” Clynt said, “but why
    not get off this rock? Plenty ’a planets out there for you to make a home.”


    “Even if we wanted to,” she answered, “we can’t. None of us have the money to
    leave, and even if the company would help us go, we shouldn''t have to.”


    “Sure as shit you shouldn’t, but the universe don''t work that way,” Clynt said.
    “Sometimes you just got to make a call because it''ll save your hide. Only get
    one go-around. I don''t know why you''d waste it nibblin’ on dirt and fighting
    every day just to survive. Do the hard thing and get out of this shithole. You’ll
    be all the happier for it.”


    Lara took a small step forward. “Clynt, we are guests here. Maybe we shouldn’t
    presume to tell them how to live?”


    “Or maybe I''m just the thing they need,” he said. “Make a big move and maybe,
    just maybe, you''ll be able to put together a better life. You''re still a youngin’,
    and I don''t know why you''d choose a life of nothing but suffering.”


    Lara opened her mouth to object again, but the young woman held up a hand. “I
    don''t mind,” she said. “I always allow everyone who wants to, a chance to speak.
    He''s right: I am young, so I know better than to think I know enough to lead.”


    “I wish more Parliamentarians thought like you,” I said with a little smile.


    She seemed to like that. “So, now you understand where you find yourselves. But
    I wonder what it is, exactly, I can do for you?”


    “You don''t happen to have any battery coils, do you?” I asked.


    At that, she let out a little giggle. “Sure, it''s just beside my big box of food.”


    I laughed even though it was a pretty lame joke. “I didn’t think you would.”


    “But I might be able to get you one,” she said, a mischievous smile playing across
    her lips.


    None of us spoke, though I had a guess as to how she planned to do it.


    6


    ![](OEBPS/image_rsrc3N4.jpg)


    Under the layers of furs and bundled up with Lara, it was actually pretty warm
    in the tent when I woke up. As soon as I shifted, Lara grumbled something, and
    her eyes opened slowly, then she glanced around the room.


    “What planet is this?” she asked.


    “One where they got strong coffee,” Clynt said, throwing open the flap of the
    tent. “So strong it may just cause your fur to curl, just the way I like it.”


    He had three metal mugs in his paws and handed two over to us. I took one sip
    and balked. “I’m not sure I would even call this coffee.”


    Clynt reached back out in my direction. “You don''t want it, you know I''ll have
    it.”


    “I didn''t say that,” I replied, holding the mug under my nose and sniffing at
    the sludge. “When all is said and done, any coffee is better than no coffee at
    all.”


    Lara took one sip and then shook her head. “I don''t know if I agree with that.”


    She handed the mug over to Clynt, who happily accepted it and began slurping.


    “What are we in for?” I asked him.


    His muzzle scrunched up. “They''re all survivors, but I''m not sure how good any
    of them will be in a fight. Spent a few minutes with the guards and took a gander
    at their guns, iffin you could even call ’em that.”


    “She said they wanted to attack the mine tonight,” Lara said as though we had
    forgotten. “And I expect some pretty staunch resistance.”


    I set the mug down beside the fur that I had been lying on top of and then rubbed
    my face. “So, we know our jobs, then.”


    She looked down at me quizzically.


    “I''ll gather all the weapons in the village and begin making repairs, cleaning
    them out and getting them in good working order,” I began. “Lara, you''ll teach
    them as much as you can as quickly as possible. It probably won''t be much, but
    it''ll be more than what they''re capable of now. And Clynt, you go scout out
    the mine and find out what we''re up against.”


    “Sounds like a plan,” he said. “Once I put this away.”


    He slurped down the rest of the coffee in one gulp and then exited the tent.


    “You really think we can do this?” Lara asked.


    I shrugged. “I really think that we have no choice. We crash-landed on a planet
    we know hardly anything about and have no real way of getting off unless we get
    the help of the people here.”


    “We might just be able to ask the miners,” she suggested. “The company would have
    to abide by universal law and aid official members of the Conclave.”


    I couldn''t help but laugh at that. “Lara, I''m pretty sure we wouldn''t make
    it within ten kilometers of that mine before we were gunned down. And even if
    the company is bound to universal law, that doesn''t mean that the people on the
    planet here would actually abide by it. You heard the way the people talked back
    at the city. They want nothing more than to see all the natives put down, and
    if we appear to be some…”'
