  trans: '


    “你觉得我们在找什么？”克林特（Clynt）问道，他的环境防护服看起来还是像从从酒吧走出来似的。


    “一栋建筑，”尼德（Ned）回答道，“它可能会从……你知道，到处都是真菌中脱颖而出。”


    克林特吐了吐舌头。“没必要耍聪明，”他说，“我只是问个问题。”


    阿莱克（Alek）落地，接着拉拉（Lara）在关上门后跟了。


    我指了橙色菌盖的方向，我们都开始移动。那里没有传统意义上的道路，我们发现自己不得不跳过障碍物，并推开柔软的真菌。


    “小心那些，”当我们太靠近一个看起来像在呼吸的菌盖时，尼德警告道。从树干向上望去，我们看到了看起来像一排排带刺牙齿的东西。


    还有其他我们必须留意的生物。有些侧面长满了刺，另一些如果你紧贴在它们身上，它们会吸收你的整个身体。


    我们继续移动，橙色菌盖越来越近，但它看起来似乎还有一段距离。克林特已经在唱他的第三首歌了，他自言自语得非常难听，但声音大我们可以我们可以，而我想待在除了他的大家园以外的任何地方。


    然后拉拉停了下来，我们也跟着停下了。


    她显然看到了什么，现在正试图识别那是什么。有很多微小的漂浮孢子和其他移动物体吸引着我们的注意力，但这一定是别些什么。


    “你看到了什么？”我轻声交流。


    她没有回答。


    “我的 `cam` 上没捕捉到任何东西，”尼德告诉我，“也许那只是某种漂浮物。”


    我不认为是对的。如果拉拉认为她看到了，我预想她可能真的看到了。但在等了几刻后，我们继续移动。现在我们每个人都警惕着四周。


    几刻后，我们又恢复了蹦蹦跳跳的状态，听着在真菌间回响的糟糕歌声。


    枪声取代了歌声，我们都转过头看到克林特正在开他的左轮枪。在他面前，一只四条腿的真菌兽在向他冲来时被炸成了碎片。它的肉体——如果可以被称为肉体的话——布满了斑点和斑块。每一射，那东西的碎片就会飞溅而出，但直到他把两个弹巢全部打空，它才停止进攻。


    他立即开始艰难地重新装弹，他戴着手套的爪子很难取出弹壳并装入子弹。


    接着我明白了为什么他如此匆忙。从克林特侧面的一簇菌盖中，更多的怪物冲了过来。它们移动得很快，在我们还在适应这种重力时就前进得毫无压力。


    我数不清有多少只，但它们冲着我们所有人来。拉拉拔出剑，伊莫根（Imogen）拿出了她的长锤。两者都闪烁着永恒的火焰。我及时激活了长矛，在一只兽向我咆哮冲来时挥出了一击。


    矛尖切断它的前腿，导致它头朝地向前撞倒，我迅速刺穿了它。但当我处理完那一个时，又有两只扑向我。一个从侧面袭来，我用 `Ron` 刺它，但它跳到空中，轻而易举地越过了长矛和我。


    接着另一只从一丛蘑菇下面窜出来，长着獠齿的嘴直对着我的腿。我拼尽全力挥动矛杆击向它的头部，将它撞到一边，但只坚持了一会儿。


    一秒后它又站起来了，但我利用这段时间弯身弹跃而起。


    那东西追着我跳，我想起了拉拉使用 `Buzzard’s arm`。当咆哮的牙齿直冲我来时，我丢掉长矛，伸手抓住了那只兽冒着泡的后颈，然后在开始回到表面时旋转身体。


    我将那个生物扔进一个致命菌盖的树干里，皮肤瞬间波动起来，将那东西吸入柄中吞噬。


    当我落地时，我捡起长矛环视了四周。拉拉正在轻松处理任何挡路的野兽，割开它们的动作如此轻易，看起来就像某种训练练习。伊莫根用她的长锤击中一个又一个，在它们靠近时击退它们。她长锤上发光的尖刺刺破了真菌怪物的脸，将它们冒着蒸汽送回表面。


    克林特在菌盖之间跳来跳跃，一边射击几只怪物，一边快速移动、射击和装弹。一旦他掌握了节奏，就能对怪物占据上风。


    与此同时，阿莱克似乎有些措手不及。他在战斗中通常非常可靠，但这些东西似乎困扰了他。他挥手击打它们，试图把它们逼退，但它们不断袭来，不断啃咬他。当他试图抓住一只时，另一只又钻出来咬了他的手臂。它的力量不足以穿破他的防护服，但他被包围并被咬的事让我感到紧张。


    我跳到他身边，直接跳过了两个正要被拉拉切碎的怪物，落在阿莱克身边，他转头面对我并举起拳头。直到他发现是我。


    我长矛刺向其中一个，然后在侧面刺穿了另一个。它们都发出咕咕的叫声并朝我冲来，吸引了其他人的注意力。我击打它们，挥动我发光的尖端来回切割，割着它们的脸颊，但没能阻止它们。


    有趣的是，阿莱克看到它们冲着我而不是自己时，似乎恢复了神智。他抓住其中一只的后腿，把它提离地面，并把它撞向另一只，两者在粘液的爆炸中爆裂。


    我继续攻击，刺向另一只跳到阿莱克背上的怪物，而 `Kyrog` 抓起另一只，直接将其撕成两半，把内脏喷溅在地上。


    这是一个惨状的景象，但也导致了所有剩余的生物逃离。一声号角响起，它们像出现时一样迅速消失在周围环境中。


    阿莱克喘着粗气，我走向他。


    “他的过滤器损坏了，”尼德告诉我，似乎对他的防护服进行了某种扫描。


    我把信息转达阿莱克，他转过身让我查看他背后的机器。我从外面看不到损坏在哪里，知道我不能开始拆解并冒着让他发生意外的风险。


    “我们必须移动，”我说。“留意你手腕上的信息面板。”


    他第一次看了看那里，好像才意识到那东西的存在。


