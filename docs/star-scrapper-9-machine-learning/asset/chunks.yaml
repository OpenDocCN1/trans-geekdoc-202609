- raw: '“He didn’t say, but it sounds serious,” Libby said. “It’s honestly kinda cute
    how much he cares about you.”


    Before I could say anything, she added, “Sorry, Hank.”


    “It’s fine,” I said, mostly believing that. “I’m sure it’s work-related.”


    “You’re probably right,” Libby said. “The work in his pants!”


    It was so ridiculous that I couldn’t help but laugh.


    “See what I did there?” she asked excitedly. “I was talking about his penis.”


    “We got it, Libby,” Lara said as we stepped into the command center. “Put me through
    to Mane.”


    A moment later, the famed bounty hunter was on the screen at the center of the
    room.


    “Lara, I am thrilled to see that you are still alive,” he said excitedly, then
    his eyes seemed to move slowly up and down the screen. “Though you look a little
    worse for wear. Still hot though.”


    “Mane!” she snapped. “Why did you call me?”


    He raised an eyebrow suggestively. “What’s it worth to you?”


    Lara took a calming breath. “Mane, you called me to tell me something, and now
    I would like to know it without having to jump through hoops.”


    He seemed to consider his options before finally saying. “I was having dinner
    with my friend Carn to discuss my future and the likelihood of my joining the⁠—”


    “Is any of this relevant to what we are discussing?” Lara asked impatiently.


    Mane laughed, a broad smile on his face. “I suppose not, but I do rather enjoy
    talking about it.”


    “What did you overhear?” Lara asked, though it sounded much more like a demand.


    “The trappers are after you,” he said.


    Lara leaned in close to the camera. “What do you know?” she asked. “And what do
    you mean they are after me? They are an official part of the Conclave. Are they
    playing at some politics? Trying to ruin my reputation?”


    “No,” he answered, voice growing heavy. “I believe they plan to do you harm.”


    Lara shook her head in astonishment. “That can’t be,” she said. “It goes against
    everything our code stands for. You have to report them.”


    “I considered that,” he said without any of his normal bravado. “But I decided
    against it.”


    “Why?” Lara demanded, all righteous indignation.


    He didn’t answer for a moment. “Because of the politics you were just discussing.”


    “This goes beyond politics,” she said. “This is a violation of our beliefs.”


    Mane chuckled pointedly. “Everything about the trappers flies in the face of how
    the Conclave is supposed to act,” he said. “But that doesn’t mean we rush in.
    We have to play this smart, or the people who are behind it all will wriggle away.”


    “He’s right,” I whispered despite myself.


    Lara swallowed all her anger and said, “Fine. Tell me what happened.”


    “I followed a trapper into an alleyway and heard her talking about how Moong Farrax
    was killed and Falconer Roan was brought in for questioning,” he explained.


    We had, in fact, killed Farrax, and Lara had been the one to bring Roan in, so
    this was all accurate information.


    “I tried to figure out who the other voice was, but they were talking through
    some kind of muffler so it was impossible to identify. The words were clear though,”
    he said and then put on an impression of a muffled voice. “Vex and that accomplice
    of hers will have to be extinguished.”


    The words took us both by surprise. “It’s one thing to threaten a fellow bounty
    hunter, but to attack us like this is an utter disgrace,” Lara said.


    “And to shoot an EMP at us and then leave us for dead on a war-torn planet is
    one hell of a smart way to do it without looking like you did it,” I noted.


    She had been so focused on the threat that she hadn’t even connected the dots.
    Her eyes narrowed with fury. “Mane, I’m almost certain a trapper tried to kill
    us.”


    “Almost certain isn’t going to hold up in court, beautiful,” he said. “We need
    to get some concrete evidence.”


    She tapped her finger against the console. “Have you heard anything about what
    Roan is saying? Are there any leaks from her investigation?”


    “Consular questionings are not the kind of things that get leaked,” Mane said
    before adding, “for cheap.”


    “You’re saying that you could find out what’s happening?” she pressed. “Perhaps
    the information would lead us to who is coming after us.”


    Mane cocked his head. “Maybe it would, but maybe it would end badly. Don’t forget,
    the trappers have a member on the Council too.”


    “It shouldn’t matter if they have representatives on the Council of Six—if the
    trappers are suggesting they kill other bounty hunters, they need to be brought
    to justice,” she stated.


    Mane laughed. “I know you take our code seriously, but you also need to look at
    what’s right in front of you. This is a dangerous game, and there are people at
    the highest level who might step in to stand in your way.”


    Libby added, “I think what he’s trying to say is don’t go all Lara on this and
    try to take matters into your own hands with a gun and a pencil.”


    Libby muted the feed to Mane so he didn’t hear the comment and continued. “You
    have to be clever and calculating now. Slow and cautious.”


    “Would you be?” she asked, and Mane seemed taken aback by the question.


    “Anyone who has ever come at me is dead,” he said.


    She nodded. “Exactly.”


    “But this is different,” he cautioned. “This is something bigger, with hunter
    factions involved.”


    Lara slammed a fist down. “These people accepted immoral contracts, attacked their
    own, then shot us down and tried to feed us to the wolves, but I am supposed to
    be slow and cautious?”


    “I think you know that I’m right,” Mane said. “Even though you want to put a hole
    in my head.”


    She let out a long, pained sigh. “No,” she said finally. “I want to put a hole
    in the head of the people trying to kill me. I just kinda want to kick you in
    the dick.”


    Libby squealed with delight. “I love you so much, girl.”


    “Anyway, thank you for the warning, Mane,” she said. “I genuinely appreciate it.”


    “No problem,” he said. “And if you need a real man to protect you rather than
    some scrap⁠—”


    She killed the line. “We have to go see Zenobia,” she said, turning to walk from
    the room.


    I sprang in beside her. “I think that the Conclave might be the most dangerous
    place for us right now.”


    “They can’t do anything there,” she said. “It’s probably the safest place in the
    universe for us. And, more than anything, we need to get her advice on this.”


    I knew that Zenobia was the closest thing Lara ever had to a mother, and that
    she respected her in all things, but there was no one who’s opinion she revered
    more than the woman’s.


    I also understood that with this kind of thing, Lara knew what was best far better
    than I did. Being a bounty hunter had been a good way for me to learn new skills
    and make money, but for her it was everything. It was more than just her profession;
    it was her identity.


    So naturally, I nodded. “Okay, let’s go to the Conclave.”


    “Not the others,” she said. “Can’t have them wandering around the Conclave causing
    trouble, and I can’t put them in harm''s way.”


    “Now you sound like Alek,” I said, thinking back to when he had wanted to shield
    the rest of us from the pursuit of Moong Farrax.


    She shook her head as she marched toward the Buzzard. “No, I just sound like someone
    who doesn’t want to get the people they care about hurt.”


    “I really wish you guys were staying longer,” Libby added. “I’m sure there is
    so much that I missed.”


    “Alek and Clynt can fill you in,” I told her.


    She groaned. “Oh, yar and then them rootin’ tootin’ jerks came a running with
    thems guns a blazing so I shot ’em all dead by myself, and everyone was a clappin’
    and a cheerin’,” she said in the worst impression of Clynt I had ever heard.


    I laughed, and even despite everything, Lara chuckled too.


    “My point is,” she said. “I like hearing it all from you, and it just feels like
    you only stop by really quickly these days.”


    “We usually have something rather pressing,” Lara noted.


    Libby groaned. “I know it, but that doesn’t mean I have to like it.”'
