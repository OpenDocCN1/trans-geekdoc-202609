  trans: '

    尘土正在散去，我看着独篷车上的那几个人穿着单薄破旧的衣服，面面相觑，试图评估该如何是。


    “我们这附近从没见过猎人，”其中一个人终于开口道，“我们怎么知道你说的是真话？”


    我缓慢地将我的震荡器（stomper）收回枪套，开始向口袋摸去。“我给你们看我的徽章。”


    “好吧，”另一名持枪者说，他们看着我把徽章掏出来。


    他们再次面视一眼并点了点头，于是我问：“你们愿意带我们去你们的家吗？”


    “我们可以去，”司机用严肃的声音语道，“但你们必须交出所有的武器。”


    ### 5


    ![](img/image_rsrc3N4.jpg)


    “我绝不可能把我的转轮枪交出去，”克林特（Clynt）低声说道。


    但我忽略了他。“那没问题，”我大喊道，我知道我们没有多少选择。我们要么利用这个机会尝试回到这些人的来处，要么冒着他们追踪我们的脚迹回到“秃鹫者号”（Buzzard）并将我们丢在这里等死的风险。我不知道这个星球的夜晚是什么样子的，但我猜并不愉快。


    于是，我先走了一步。我掏出我的震荡器和能量武器并向他们递过去，希望他们没注意到我腰间的长矛，因为矛杆此时是收缩状态的。


    拉拉（Lara）拔出入鞘的剑，从背上卸下步枪，克林特则递了一把武器。其中一个持枪者下了车，走过来拿着一条毯子，用它包裹好我们我们所有的货物，然后回到了车上。就在他一回车的瞬间，司机启动了引擎，他们全都欢呼着叫起来。


    但他们才开出大约一米，三声尖锐的枪响就刺破了空气，那是克林特转轮枪发射的声音。独篷车又向前滚了一小段，然后就顺着坡滑了回去。


    “如果你从一开始就听我的，我们就不用走这那么远的路去那里重新收集我们的东西了，”他说。


    “但那样我们就会杀掉一些没做过任何事、只是倒霉遇到我们的人了，”伊莫珍（Imogen）用昏沉的声音说道。她显然在某个时候醒了，然后目睹了局势的发展。


    克林特耸了耸肩。“他们反正也会死的。”


    “但现在他们死是有理由的，”我说着朝伊莫珍走过去，“你感觉怎么样？”


    她抬头看向我。“我猜我们是坠毁着陆了？”


    “是的，”我肯定道。“我们需要尝试弄到一些零件让‘秃鹫者号’重新运行。”


    “它发生什么事了？”她问，眨着眼睛。


    “电磁脉冲损坏了系统并烧掉了电池，”我告诉她。


    阿克（Alek）歪了歪头。“你知道那是怎么吗？”


    “偶尔会有一次，”我说，“而且，线圈在失效时会发出一种非常特定的声音。”


    拉拉笑了。“倒是挺会说话的。”


    “现在的计划是什么？”伊莫珍闭着眼睛问。


    我扫了一眼四周，又看了看独篷车。“我们上那辆车，尝试寻找文明社会。”


    大家都看着它，然后所有的目光都转向了阿克。


    “你说得对，”他似乎读穿了每个人的心思，“我们坐得下。”


    “你可以直接带我回飞船，”伊莫珍建议道。


    拉拉看向天空中的橙色圆球。“很快就黑了。”


    阿克发出一声低沉的闷笑。“你觉得我们一无所有吗？在你说我回飞船需要很长时间之前，你还没见过我全速奔跑并保持同速。”


    这就是我需要的全部理由。“走吧。”


