  trans: '

    切斯特的金属手击力之大，将面具撞出了凹陷，几乎压在了我的鼻梁上。接着，我被巨大的力量撞飞出去，感觉就像被车撞中了一样。


    我的头晕晕地胀。我看不清什么，也无法记住接下来的发生的事情。


    我看到能量弹束的残影和永恒火焰武器的涌动，听到了激战的声音。一道蓝光充斥了我的视线，面具从我脸上被割了下来。


    “我叫杰克逊了，”内德说，但他的声音听起来很远，仿佛是在水下对我说话。


    更多的紫色光划过战场，一只手进入了我的视野，一名审判官正扶着我起来。


    站稳后，我环顾了四周。士兵们正在抵御进攻的信徒，而切斯特已经无影无踪了。


    有些飞船正在起飞，弗朗西斯一动不动地倒在地上。我盯着他的身体，诅咒他为什么不能再配合我演一会儿。


    正当一些信徒的飞船准备起飞时，`Buzzard`号出现在天空中，同时从正面和侧面开火。地面上的许多飞船被摧毁，而杰克逊带着它降落，在降落的同时放下了舱道。


    在推进器的力量下，泥土四处飞扬，拉拉我和尽快向飞船后部跑去。


    我转头寻找克林特是否在那里，希望他能尽快回到我们身边，但当我看向`Buzzard`号内部时，他正站在那里，手里拿着一个小黑圆圈。


    我们拿到了想要的东西，但现在我们需要阻止特恩人的逃跑并警告他们的主子。


    “继续射！”我大喊道，但周围没有人执行这个命令，因为杰克逊和女孩们都在船舱深处。


    拉拉扶我继续走进去，当我们走向驾驶舱时，舱道升起。飞船在移动中震动，微型导弹电池持续发射产生的冲击力震动着整个空间。


    穿过充满活力的`Buzzard`号内部却完全不参与其中，这种感觉很奇怪。也许我只是脑震荡了。无论如何，当我们到达驾驶舱时，杰克逊正在对地面上的飞船进行另一轮攻击。其中两架已经起飞并正朝我们绕过来。


    “进那些座位！”她命令道，我们尽快系好安全带，以便她转动飞机并进入战斗。


    我想大声提出建议，指点我在这里或那里看到的，但杰克逊是一个受过训练的士兵，她的一生都在战争度过，不需要后座驾驶员。


    一架来自旧世界的飞船正朝着我们冲来，两门火炮同时开火，飞船再次剧烈抖动。导弹命中了目标，我能听到伊莫根和索菲亚在各自的位置上欢呼。那架我本想亲手撕成碎片的飞船，现在变成了散落在野上的碎片。


    杰克逊转头看向我。“我的人给你们找了一艘可以用的飞船，”她说，“我会把你们送到会合点”—她倾斜了`Buzzard`号，我的脖子随着她带我们转向另一架成功起飞的飞行器——“在我们处理完这些之后。”


    她激活了控制装置，前方机炮从船头发射导弹。短程扫描仪显示那个点移开又绕回来，向我们冲来。`Buzzard`号俯冲躲避以免被击中，但另一波火力击中了它的护盾，只是它倾斜着疾驰而去。


    我更喜欢自己飞而不是坐在乘客席。杰克逊在让我们生存并继续前进方面做得非常出色，所以当我直接面对下一场战斗并还能花几分钟清醒头脑时，要容易得多。“阿姆有消息吗？”我问，杰克逊摇了摇头。我只能假设当沃特森号召唤她时，她会在那里的。


    飞船又掠了一圈，我看到“凡人之枷”号从行星表面起飞，另外几架船紧随其后。其中一架分离加入我们的战斗，而另一架则起飞离开，这并没有让我惊讶。审判官们似乎遵循着一套只有他们自己才懂的规则。


    “钉住他们，”我轻声说，几乎自言自语，那架轻型飞行器又掠了一圈，发射出一道快速火力，除了略微减少我们的护盾外毫无作用。杰克逊一定听到了我的话，对着通讯大道：“交叉火力，”同时她平了`Buzzard`号。女孩们收紧火力，将飞船钉在中间片刻，直到它们拉升。当它们露出飞船的底部时，她又发射了一波火力，虽然不足以击它们的护盾并摧毁它们，但足以让它们暴露在后方冲出来的审判官飞船面前，并将其炸碎。甚至不需要说什么，杰克逊正在拉升，带我们离开行星表面，飞向泰德尔方向。


    “你还好吗？”拉拉在我们穿过螺旋滑管时问我。我看着她说：“还好。“听起来没怎么说服力，”她回答道，我确定那是事实。切斯特给我的那一拳仍让我感到有些头晕，而且知道接下来会发生什么。


    当我们降落在废弃的餐馆的那一刻，我就站起来离开飞船，去见和平者。和平者为我们弄来了一艘小飞船，外壳画着一只在浴缸里的猫，还戴着一顶喷绘的淋浴帽。“那是一家宠物美容公司，”和平者告诉我，就好像我推断不似的，但我感激地点了点头。


    “你们干得好，”我告诉他，然后转向杰克逊，“你也是。”


    她给了个快速的敬礼。“我会等你的指令，”她说，然后回到了`Buzzard`号。我们走向那艘美容船并登机，克林特无声地穿过我们。

