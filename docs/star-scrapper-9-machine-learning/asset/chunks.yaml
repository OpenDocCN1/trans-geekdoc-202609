- raw: '“Maybe it’s for the best that you don’t have a body, then,” Alek observed.


    “And let’s be real,” Imogen added. “You can still do a hell of a lot of damage
    as you are. Flying the Buzzard and hacking systems has come in pretty handy if
    you ask me.”


    Ned grunted. “I appreciate that, but I still don’t think that it is as satisfying
    as punching someone.”


    “It ain’t,” Clynt said. “Putting fist to jaw is right up there with makin’ a new
    litter, iffin’ you ask me.”


    “That brings up an interesting point,” Lara said, leaning back in her chair as
    the Buzzard entered the gyre tube. “Do you have a sex drive, Ned?”


    “Lara,” Alek scolded. “I really don’t know if that is the kind of thing we need
    to be discussing.”


    Imogen leaned into the center of the cockpit. “He does,” she said in a stage whisper.


    “Really?” I asked.


    “Now, what in the hell would be the point of that?” Clynt said. “Like programmin’
    him to have an itch he ain’t never gonna scratch.”


    We all turned to the console speaker, waiting for an answer.


    “Imogen is right,” he said after a long time. “We were programmed to have normal
    human desires in something that is akin to a sex drive, but we don’t satisfy it
    the way you do. More accurately, it comes in fits and spurts. Pun, unfortunately,
    intended.”


    “I was a doctor back on the homeworld,” Alek moaned, making it clear how much
    he would like for us to change the subject, but I was fascinated.


    “Is that why Edwin was able to essentially cheat on his wife with a program?”
    I asked. “Because there was already that instinct baked into the code?”


    Ned snorted. “I can’t speak to that specifically, but it sounds plausible, yes.”


    “Wild,” Lara said.


    “The Inquisitor said it was the very quintessence of abhorrence that the machine
    would want to procreate,” Imogen said. “He would go on rants for hours about it,
    preaching his disgust with every single aspect of it.”


    Lara chuckled. “See, I hear that, and I just think he’s talking about it so much
    because he’s kinda into it.”


    “The lady doth protest too much, methinks,” Ned added.


    “Isn’t that the thing with this kind of zealotry though?” I said. “John Gregory
    spent his life so obsessed with hating this thing that it really just became his
    entire personality. In the end, he was the one thinking about robo-fornication.”


    Something about that term seemed to amuse the others, and I was met with some
    laughs.


    “I would think about that sometimes too,” she said. “As he would be turning red
    in the face, screaming about all the abominations, all I could think was that
    he was more obsessed with them than they were themselves.”


    “I don’t know,” I said. “Libby is pretty obsessed with herself.”


    Imogen nodded. “Okay, well, aside from her.”


    “Anyway,” Lara said, standing. We all looked at her in surprise and she pointed
    to Alek. “Let’s play some Warhero.”


    “I thought you would never ask,” he said, and the two of them made their way from
    the room in an instant, heading back to the common space to play.


    Clynt stood too. “Looks like this is gon’ be one hell of a long ride, so I’m gonna
    get some shut-eye and practice my ventriloquism.”


    Once they were gone, Imogen looked at me. “I guess I’m lucky,” she said.


    “How’s that?” I asked.


    “I never had a mentor or partner whose death could hurt me the way these guys
    are feeling it,” she said.


    I was about to answer, but Ned spoke first. “To stay on a theme,” he said, “it
    is, in fact, better to have loved and lost.”


    “You sure about that?” she asked. “How are you feeling right about now?”


    “I take your point, but I can’t imagine my life without William,” he said.


    I bobbed my head. “Or mine without Lutch. The people we care about are the things
    that make life worth living. Even if we have to suffer through losing them too.”


    She nodded, but I could tell that she was thinking about something else. “I guess
    I’ve always just thought it was easier to keep people at arm’s length.”


    “That’s because literally everyone who you have ever trusted has betrayed you,”
    I half-joked. “But now you are surrounded by people who never will so you should
    embrace that.”


    She groaned. “Fine, I guess that’s something worth thinking about.”


    We sat in silence for a bit before she made a judgmental grunting sound. “Ugh,”
    she said. “I’ve been spending so much time with Alek that now I want to go watch
    them play. But I don’t like that I’m interested.”


    “Have fun,” I said with a little laugh.


    “I guess that means you''re next,” Ned joked.


    I shrugged. “I would love to have the time or mental capacity to play and care
    about Warhero cards,” I said. “And I mean that.”


    “I hear you,” he said before following up quickly. “How are you holding up? You
    haven’t stopped for a very long time.”


    “I got laid last night so I’m actually doing just fine,” I said with a little
    laugh.


    Ned snorted. “I think you are confusing me with Libby, and that answer might work
    on someone else, but it won’t work on me.”


    I knew he was right, so I took a moment to really think about the question: how
    was I doing?


    “I think that I’m okay,” I answered. “We do so much so fast, the stakes are so
    high and the pace so relentless that I think I have just turned off a lot of the
    normal human responses to make it possible to keep going. I am not sure I can
    even process what happened to Zenobia because I was too concerned with how Lara
    was.”


    “I knew a lot of servicemen who turned everything else off so they could focus
    entirely on the mission,” Ned said. “Doesn’t always work. I guess I would just
    say that you should check in with yourself from time to time. Don’t want to live
    long enough to see yourself become the villain.”


    I chuckled. “I won’t. But it’s a good reminder.”


    “I’m always looking out for you,” he said.


    I knew it was true.


    “Ned,” I said. “Don’t worry too much about what Edwin said. You have been you
    as long as I’ve known you.”


    “Thank you, Hank,” he said.


    “And don’t worry,” I added. “You’ll have your revenge on anyone who was involved
    in killing William.”


    17


    ![](OEBPS/image_rsrc3N4.jpg)


    We had been in the gyre tube for what felt like several days, and when Ned said
    we were approaching, all of us were relieved until he said to grab our environmental
    suits.


    Everyone complained as we pulled on the outfits, checked oxygen, and fitted our
    helmets in place.


    “Would you rather be a bit uncomfortable, or would you rather be dead?” Ned asked.


    “Too soon,” Lara said seriously.


    Imogen gasped.


    I could hear the guilt in Ned’s voice as he said, “I’m so sorry.”


    Lara laughed. “Nah, don’t worry about it, just messing with you.”


    But I wasn’t sure if she was.


    Rather than going out via the ramp at the aft as we normally did, we all made
    our way to the side so we could go out the airlock and try not to let any of the
    spores from this planet onto the Buzzard.


    One by one, we left the ship and climbed down to the squishy surface of the planet.
    We all moved slowly as there was lower gravity than many of the planets that humans
    or other species inhabited.


    Instead of climbing down the ladder along the side, I just jumped down and floated
    slowly to the surface. Then I looked about. The world was bright with huge fungal
    growths all around. They varied in size from tiny little mushrooms that coated
    the entire surface of the planet all the way up to some that appeared to be the
    size of a skyscraper, and everything in between.


    Some glowed and others had what looked like tentacles hanging from their caps.
    Some were monochromatic, while others shimmered different colors under the bright
    green sky.


    “If it weren’t all so poisonous, it would be really beautiful,” Imogen said as
    she landed beside me.


    “See that one orange cap in the distance?” Ned asked, so I glanced around until
    I spotted it. “That’s the direction you want to head. The spores in the air will
    make it nearly impossible for them to pick you up on scanners, and I’ll keep the
    Buzzard here unless you absolutely need it.”'
