- raw: '“My point is,” she continued, “you have time to get him medical help.”


    “I’ll take him back to base,” Lara offered. “You should keep investigating. We
    are too close now to slow down.”


    “No,” Imogen said. “I’ll do it.”


    Cassiopeia spoke before I could counter. “Let me.”


    We all looked at one another in confusion.


    “Slot me into that cargo ship you brought here, and I’ll take him to your doctor,”
    she offered. “That way, the rest of you can go on.”


    That gave me pause. “Ned,” I said using the system of taps on my earpiece that
    he could decipher. “Do you trust Edwin’s program?”


    “Do you mean, do I think that she could be faking and will lead Twain right to
    us?” he asked.


    “Yes,” I tapped.


    He didn’t have to think about it. “I trust it,” he answered. “Nothing is perfect,
    but I believe that her program is clean, so to speak.”


    “Enough to risk all our lives on?” I clarified.


    “Yes,” he said. “I was infected once, and while I think there are residual effects,
    he was never able to track me. Additionally, I truly don’t believe that she would
    have suggested that we offline her if she were still hacked. Twain would never
    suggest a resource waste itself like that.”


    “Okay,” I said aloud. “Cassiopeia, you can take him back. Welcome to the cause.”


    She made a little sound that I took to be excitement. “Thank you,” she said. “I
    really want to make up for everything that I have done.”


    “Getting our friend back to safety will certainly do the trick,” I said. “Start
    fueling the cargo ship.”


    “Already done,” she said. “I started it the moment I came back online as myself.”


    I looked down at my friend, still unsure if I should do this but knowing that
    we did have to strike while the iron was hot.


    “Lara, help me move him,” I said. “And Imogen, go get Cassiopeia’s cube.”


    Imogen rushed from the room without hesitation, but I thought Lara was going to
    come help me. Instead, she walked over to a packmule, fired it up, and drove it
    over to us.


    “Even together, we weren’t going to be able to move him,” she said.


    Alek chuckled. “It’s true.”


    As I went to help him lift himself onto the floating flatbed, Alek pulled me in
    close. “Don’t worry,” he said. “I’ll hang in there, and I think this AI really
    wants to help.”


    “You’re always the first to trust folks,” I said with a weak smile.


    Looking at him now, I realized just how not at all prepared I was to lose him.


    “I’ve been right every time, haven’t I?” he said.


    I nodded. “You have.”


    “But really,” he said, pretending like I was helping at all as he lifted himself
    onto the flatbed, “just go do what needs to be done.”


    I turned back to the Mortal Coil, hearing the faint sound coming from within.


    “I will,” I said, and patted him on the shoulder.


    Lara fired up the packmule and started driving Alek toward the other bay where
    he could get onto the cargo ship.


    “That thengar will fetch a pretty price too,” Ned noted. “To refill our coffers,
    or we could try to make use of it ourselves. Either way, the cargo ship will be
    useful too.”


    I was still worried but knew I had to get over it.


    “Reactivate the placemags,” I ordered, and after some more clunking, the legs
    of the Mortal Coil were starting to shift. Slowly at first, but then the ship
    flipped back onto its belly. The other legs were bent badly, but that didn’t matter.
    The thing would still fly.


    I hurried around to the back and up the ramp into the vessel that had plagued
    me for so long.


    “It’s exactly like how I thought it would look,” Ned said as I stepped inside
    the gothic ship with nothing but red and black furnishings all around. Papers
    and books were scattered throughout and candles burned in sconces. Or they had
    before we rolled the ship around a few times.


    Now, everything was a mess everywhere.


    What was strange was how even that was a small satisfaction to me. I was happy
    just to have made a mess on the Inquisitor’s ship.


    I moved past the small cabins and some holding cells up to the cockpit where the
    comm screen was flashing MESSAGE RECEIVED. Beside it and all along the console
    at the front, images and writings were etched into the metal, all of which seemed
    to be about their Inquisitorial mission.


    “A little on the nose, don’t you think?” Ned joked.


    I laughed. “The man was a cliché of himself.”


    Some blood dripped from my forehead in front of my eye, and I remembered that
    I had been wounded. At this point, my entire body was such a ball of pain that
    it would take a really big hurt to actually draw my attention.


    I reached out and played the message.


    “Once you have swapped the serfs, return here at once,” John Gregory’s voice commanded
    through the comm. “We have an urgent matter to attend to.”


    All it took was a quick glance at the Tidal Drive to see where this ship had originated,
    and now I knew that John Gregory would be waiting there. It was quite something
    and affirmed that we didn’t have any time to waste. Despite the fact that I really
    wanted some facetime with my bed.


    Instead, I ran a quick diagnostic on the ship, and when I saw it was in working
    order, I rushed off it to meet with the others. They were getting Alek and Cassiopeia
    all loaded into the ship and were preparing for departure.


    Alek was still lying on the packmule, resting and only half-conscious.


    I walked over, not allowing myself to think about the worst. “I’ll see you soon,”
    I told him.


    “You will,” he said. “This isn’t how I go.”


    But his words weren’t convincing, and I knelt beside him again, placing a hand
    on his massive chest.


    A torrent of emotions roared through my brain and threatened to come pouring out
    of me. But it was not the time. I would sort through it all soon, but for now
    the worry about my friend, the sadness over loss, and everything else would have
    to wait.


    I patted his chest, letting him know I was right there, then I stood and crossed
    the massive cargo space to where Lara and Imogen were standing in the cockpit.


    “We both think that we should go with him,” Lara informed me.


    I nodded. “I want to also, but John Gregory is waiting for us now. If we go, we
    can finally be done with this faux Inquisition.”


    “Shit, really?” Lara asked, sounding disappointed that there was something more
    urgent for us to tend to.


    “Yes,” I said. “You both know what Alek means to me, and that I want to be by
    his side, but this is an opportunity that we cannot pass up. We have all this
    information about the enemy, and now we can start to turn the tide in our favor.”


    They both looked like they wanted to do both things.


    “What do you think he would want us to do?” I said. “Should we go ask him?”


    “No,” they both muttered.


    Imogen swallowed once, and then her face turned determined. “Let’s go.”


    We both looked at Lara, who nodded slightly. I knew that she didn’t want to be
    away from another friend whose life was in peril, but I also knew that there was
    nothing that she could do by his side. There was, however, a lot she could do
    by my side.


    “Okay, let’s get to the ship,” I said, and we walked off, both of them saying
    their goodbyes on the way out, though Alek had fully fallen asleep by that point.


    “You take good care of him,” I said to Cassiopeia as she was closing the sets
    of doors. “The Consortium is counting on you.”


    “Yes, sir,” she said, and I could hear a determination in her voice that made
    me confident about the mission.


    Ned chuckled. “Well played,” he said. “That was a smart way to send her off.”


    “I’m not always an idiot,” I said.


    The girls beside me were both giving me a look like I had just thrown an easy
    one right over the plate. But neither spoke, and we hurried back to the other
    bay as the cargo ship pulled away. I took one last look at the sealed doors.


    “He’s going to be alright,” Ned assured me, but it was just something you said.


    When we reached Bay 03, Lara was standing over one of the dead Inquisitors. “Should
    we take their outfits? Sneak on again like we did with the High Cloister.”


    “No,” Imogen said. “I never want to put those things on again as long as I live.”'
