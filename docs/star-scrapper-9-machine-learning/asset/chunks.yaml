- raw: 'Lara patted me on the shoulder. “Even after all we have been through, I sometimes
    forget that you were a scrapper before all this. You didn’t get to experience
    the universe the way I did as a bounty hunter.”


    “I saw some things.” I shrugged. “But it’s just all this… I don’t know.”


    She didn’t say anything, giving me a chance to continue. “It just doesn’t even
    make sense. This was so important to them, it was life and death to them, but
    there is so much more out there to worry about.”


    “But the people of this planet don’t know it,” Lara said. “They still don’t know
    about the threat that’s coming… and even if they did, they might not have cared.
    As you said, this is so important to them. To the people of the company, it’s
    what feeds their family, and to the locals, it’s their home. For both groups,
    it feels like life or death because in a very real way, it is.”


    “She just led them into this for nothing,” I muttered.


    Her hand made its way from my shoulder to the nape of my neck. “That was their
    choice,” she assured me. “They did what they thought was best for themselves and
    their people, even though we warned them. Hell, you even offered them the chance
    to get them off this rock, and they didn’t take it. Can’t dwell too much on it.”


    I smiled at her for a moment. “Isn’t it my job to talk you down most of the time?”


    She punched my bicep. “Pretty sure I have been calming down,” she said, and it
    was true. With each passing day, her instinct to get pissed off or fly into a
    rage was diminishing. That wasn’t to say that it was gone entirely, but it felt
    like the fuse was growing longer.


    “You doing okay?” I asked.


    She rocked her head back and forth. “Have I mentioned how much I hate it here?”


    “Oh, damn!” Clynt said, slamming a palm on the beam he was using for support,
    and I began to slow the buggy.


    “What?” I asked, worried that he had lost his way.


    He tapped a claw angrily on the bar. “I really wanted to see them critters.”


    “What?” Lara asked.


    I rolled my eyes as he said, “Whatever them big lizards were in those crates.
    I wanted to take a gander, but all the action done erased it from my brain.”


    “That’s not important,” Lara sighed.


    But he huffed. “Were important to me. I like seein’ alien critters.”


    “We’re not going back,” I said, preempting the question I thought was coming next.
    “I just want to get back to the ship and get the hell out of here.”


    “But the next time we end up on an alien world, we’ll try and hit up the zoo,”
    Lara offered in a pandering tone.


    I began driving again, with Clynt pointing the way and pouting.


    We drove for what seemed like an eternity, but eventually I saw the Buzzard in
    the distance.


    Though we had only been on this planet a very short time, it was a massive relief
    to be back at the ship, and the three of us all but leaped off the buggy to hurry
    up into the Buzzard.


    “Alek!” I called, but my voice echoed around the space. “Imogen!”


    Nothing on the ship looked out of place, and nothing seemed to have been stolen,
    but I knew the difference between when there were souls aboard and when there
    weren’t.


    And right now, there weren’t.


    10


    ![](OEBPS/image_rsrc3N4.jpg)


    “We have to find them!” I shouted.


    Clynt looked to where I was standing by the open hatch. “I could rest a spell,”
    he said. “We could just wait ’til morning.”


    I wanted to say that stuff like that was why Imogen had such a problem with him,
    but Lara shouted up to us from where she was out in the scrub.


    “There are tracks here,” she called.


    Despite his groaning complaints, Clynt followed as well.


    “Yep,” he affirmed when he dropped to the ground and looked at the tracks in the
    beam of my flashlight. “Them’s Alek’s tracks.”


    “No shit,” Lara said. “What else can you tell?”


    He leaned close to the ground, sniffing deeply. “They got company what smell like
    them locals we just left.”


    I ran to the car in the dark, wishing the star was rising sooner but remembering
    that the leader had told me the nights here were incredibly long.


    Clynt hopped back into his position, and I wheeled the buggy around, then followed
    the tracks out into the endless tundra.


    None of us spoke this time. There were no jokes or anything, just silence as I
    drove, but it wasn’t long before Clynt was tapping the bar again, signaling for
    me to slow.


    “We’re close enough now,” he said, hopping down. “Kill that engine, and we’ll
    sneak in on foot.”


    “We?” Lara asked dubiously, hooking a thumb in my direction.


    I folded my arms across my chest. “I can sneak when I have to.”


    “Sure you can,” Clynt said in a tone somewhere between sincere and mocking. “But
    you can just approach straight from here and let the professionals sneak around
    from the other sides. Any one of us see’s anything, hoot twice like a barn owl.”


    “That will be incredibly suspicious,” Lara noted.


    Clynt shrugged. “Then just start stabbin’ til we have our friends back.”


    “Sounds like a plan,” she agreed.


    I wanted to put up a fight, but I was too tired and worried to try and come up
    with something, so I just nodded and killed the lights on the car.


    A moment later, the two of them were gone, and I was left in the pitch dark. Not
    that it stayed that way for long. As my eyes adjusted, the reflected light of
    the moons was enough to help me at least trudge forward in the direction of the
    footprints.


    Soon, I saw some company tents around a fire, and I got worried for a moment that
    it was people from the city rather than locals, before realizing that one wasn’t
    any better than the other. I continued to creep forward, seeing some people moving
    around, but there were no lookouts or armed guards and nothing to suggest that
    they had just taken some hostages.


    Dropping low, I kept moving toward the tents, staying in the cast shadow of one
    of them and wishing that my boots didn’t have to make so much noise while I cracked
    the earth underfoot.


    “I guess it’s hard knowing that I’ll never feel about them the way I should,”
    I heard Imogen say in a low voice from inside the tent. I stopped, listening and
    trying to get a sense of the situation.


    “You don’t have to feel any one way about anyone,” another voice said, and it
    sounded like a young woman—older than the leader but certainly younger than I
    was. “Just because they gave birth to you or raised you ‘the best they could’
    or whatever doesn’t give anyone the right to treat you the way that you’re telling
    me they have. So, don’t feel like you ‘should’ feel some way. You’re only hurting
    yourself.”


    “I guess…” Imogen answered. “It’s just…”


    “Just what?” the other girl pressed. “Are you going to give me some nonsense that’s
    actually just your trauma manifesting as a justification for their behavior?”


    Imogen laughed. It was a sound that I had heard so few times that I almost didn’t
    recognize it. “Probably,” she allowed. “Sophia, how are you so smart?”


    “Oh, what?” Sophia asked. “Just because I grew up on some backwater shithole,
    I have to be a bumpkin?”


    “I mean, kinda,” Imogen said with what sounded almost like a giggle.


    The other girl laughed heartily. “What a spoiled-little-rich-girl thing to say.”


    “I’m not that,” Imogen said seriously. “Not anymore. An Inquisitor flogged it
    out of me. Among other things.”


    There was a pause. “Oh, whoa, I’m sorry.”


    “It’s fine,” Imogen assured her. “You couldn’t have known. And I’m not even sure
    why I told you. We only just met.”


    “You told me because we’re kindred spirits,” Sophia said. “Because we somehow
    connected despite the fact that I am pretty sure we have nothing in common.”


    Imogen let out a little snort. “We have attitude in common.”


    “Attitude?”


    “Yes,” Imogen said. “We might not have the same references or experiences, but
    we see things the same. And I think that is more important than all the other
    stuff.”


    Sophia didn’t speak for a long moment. “How did you get so wise?” she asked finally.


    “How did you?” Imogen answered.'
