  trans: '

    莉比再次笑了起来。“他在说你以前很穷。”


    “我们确实穷过，”拉拉说。


    “不！”查理半心不打力地抗议道。


    “没关系的，医生，”我说，“再次感谢你帮助了阿列克。”


    他穿过房间回到我们刚才所在的地方。“我很乐意帮忙，”他说，我能听出他是认真的，“而且很高兴能来到这里。我生命中花了太长时间当一个公司的线人了，能做一些有意义的事情我感到非常兴奋。而且斯特恩博士也是个非常容易相处的人。”


    “真的吗？”我挑起一边眉毛问。


    他点了点头。“噢，是的，”他热烈地回答道，“他是个天才，能和他交流想法绝对是种享受。到目前为止已经是这种感觉了。”


    “听到你这么说我太高兴了，”我说。


    “噢，”莉比说，“我们应该在频道上开始拍我们自己的真人秀！起名叫什么‘反叛者……但为了正义’之类的的。”


    我看到拉拉再次露出了笑容，她看起来好像又要忍不住笑了。“那是我听过最糟糕的名字。”


    “什么？”莉比说，“那你来个好听的！”


    拉拉摇了摇头。“我不行，但我听出来就知道一个名字有多烂。”


    “噢，就好像‘基拉拉·维克斯（Kilara Vex）’很酷，”她反驳道，但这完全是玩笑。


    阿列克翻了个身，似乎又要睡着了。“基拉拉·维克斯是个很酷的名字，你心里清楚。”


    莉比发出一声没必要的长叹息。“是很酷，但我讨厌它这么酷。”


    “我们可以回到正题上吗？”尼德问。


    “呃，好了，爸爸，”莉比说。


    “你计划如何会接头人？”他忽略了另一个 AI 问道，“或者你打算带着凡胎之躯（Mortal Coil）在地点等，希望他们降落见你？”


    我思考了一下。我有约翰·格雷戈瑞的剑和盔甲，但其他东西都被烧毁了。


    “也许我们可以叫援兵……”我意味深长地说，然后转过身。


    我离开房间走向指挥中心，拉拉紧随其后。


    “问候审判官死亡，”我对莉比说，“或者，呃，应该说是，审判官弗朗斯。”


    “噢，好的，”她说，显然对这个请求感到很惊讶。


    连接花了一段时间，因为莉比采取了额外的预防措施，使用了更多的加密网络并寄生在其他系统以清除我们的数字足迹。


    当我们等待时，拉拉怀疑地看着我。“你确定吗？”


    “不，”我笑着承认道，“我几乎对任何事都不确定。我们做的每一个决定都可能产生可怕的后果，但我们必须采取行动，而且我想这可能是唯一的办法。”


    “我猜，”莉比说，“但请求审判官不是我的第一个建议，甚至是我的第十个。”


    “同意，”莉比说，“但他们想要我的命，所以我们必须做点什么，我想这可能是……”


    从身后传来一个声音。“你们在聊什么？”尼德问。


    “问候审判官，”我对莉比说，“或者，呃，应该说是，审判官弗朗斯。”


    “噢，好的，”莉比在在我开口之前回答道。


    “问候审判官，”我对莉比说道，她显然对这个请求感到惊讶。


    “噢，好吧，”她说，“你计划如何会见接头人？或者你打算带着凡胎之躯在地点等，希望他们降落见你？”


