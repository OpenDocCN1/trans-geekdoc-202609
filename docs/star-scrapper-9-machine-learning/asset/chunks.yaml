- raw: "“Certainly,” she said, studying his reaction. His face was deeply wrinkled,\
    \ and his five o’clock shadow was threatening to break out into a beard at any\
    \ moment. His wavy hair was slicked down against his scalp, and his scowl seemed\
    \ to underlie every look he gave.\n\nHe slid a glass to her, and she shot it back.\n\
    \n“Why does it seem like every time we have one of these inquiries, one of your\
    \ people is involved?” she asked, staring at his face and waiting for his reaction.\n\
    \nBut he just shrugged as though it was nothing. “The trappers are good at what\
    \ they do, and when that much money changes hands, people are bound to be jealous.\
    \ That’s where all of this stems from. Didn’t you take on the hunter who cried\
    \ to the Council about this?\n\nShe hated the way he characterized everything.\n\
    \n“I took on two new hunters today,” she answered evasively. “Since I didn’t make\
    \ all of that trapper money, I’m always happy for a little extra income.”\n\n\
    He snorted a laugh and then looked past her out the door where another Purple\
    \ Cloak was waiting. “I expect that’s for you,” he said, and she turned to see\
    \ the new guard beckoning to her.\n\n“See you in a bit,” she said, setting her\
    \ glass down and then marching from the bar more determined than ever.\n\n“What\
    \ is it?” she demanded of the Purple Cloak.\n\nThe guard looked her right in the\
    \ eye as he said, “The other Council members are being informed as well. Falconer\
    \ Roan was found dead in her cell of an apparent self-inflicted injury.”\n\nAlana\
    \ felt as though her head was going to burst off her shoulders, and when she turned\
    \ to look at Purd, he was raising a glass.\n\n![](OEBPS/image_rsrc3N5.jpg)\n\n\
