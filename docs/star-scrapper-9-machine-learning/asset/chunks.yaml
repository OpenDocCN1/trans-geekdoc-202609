  trans: "\n“当然，”她说道，观察着他的反应。他的脸上布满了深深的皱纹，青青的胡须茬看起来随时会长成大胡须。他波浪状头发油腻地贴在头皮上，紧锁似乎隐藏在他给出的每一个眼神中。\n\
    \n他向她推过玻璃杯，她仰口一饮了。\n\n“为什么似乎每次当我们进行这种调查时，你的人就会卷入其中？”她问道，盯着他的脸等待着他的反应。\n\n但他只是耸了耸肩，仿佛这没什么大不了。“捕猎者很长他们擅长的，当有那么多资金易手时，人们难免会产生嫉妒。这一切都源于此。你不是接洽了那个向委员会控诉这件事的猎人吗？”\n\
    \n她讨厌他这种刻画一切的方式。\n\n“我今天接洽了两个新猎人，”她回避地回答道，“既然我没有拿到那些捕猎人的钱，我总是乐意多赚点收入。”\n\n他轻蔑地笑了笑，然后越过她看向门外，另一名紫色披斗正等在那里。“我猜那是给你的，”他说，她转过身看到新守卫正向她招手。\n\
    \n“回头见，”她说道，放下杯子，比任何时候都更有决心地走出吧台。\n\n“什么事？”她对紫色披斗质问。\n\n守卫直视着她的眼睛说道：“其他委员会成员也会收到通知。猎隼人罗恩（Falconer\
    \ Roan）被发现死在牢房里，显然是自残。”\n\n阿拉娜感到头快要炸开了，当她转身看向普德（Purd）时，他正举起杯子。\n\n![](img/image_rsrc3N5.jpg)\n\
