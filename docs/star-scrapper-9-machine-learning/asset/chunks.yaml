    # 前情回顾……


    ## 星际碎片回收员


    汉克·斯皮尔（Hank Spears）过着废品收集者的生活，直到他挖掘出一个名为 `Ned` 的 AI。这个智能体是老战争期间的士兵，当时反对一个致力于消灭所有有机生命的邪教。`Ned`
    警告他他在离线前正在调查一种代号为“灭绝计划”（Codename: Extinction）的超级武器，并认为它可能还在那里。在汉克决定是否要帮助之前，他因携带该
    AI 被抓获并被迫逃亡。自从战争以来，全球政府禁止了任何人工智能，任何被发现藏匿 AI 的人都会被禁或处死。


    在审问者 `约翰·格雷古里`（John Gregory）和他的随从 `伊莫根·哈什`（Imogen Hush）的追踪下，两人躲避了抓捕，并在太空深处发现了一个中继站，另一个
    AI `Libby` 一直躲在在那里。在她的帮助下，他们找到了汉克养父的继兄弟。那人提议提供帮助，他们本以为情况正在好转，但汉克被他旧雇主雇用的两个赏金猎人发现了。幸运的是，其中一名赏金猎人是他的青梅竹马
    `拉拉`（Lara），帮助他们离开了空间站。尽管 `拉拉` 最初感到纠结，但她决定帮助汉克摆脱那个犯罪老板的控制。


    他们通过收集赏金赚了一些钱，但很快发现 `拉拉` 的飞船被 `约翰·格雷古里` 毁了——此他还杀杀了汉克的叔叔。他们没有让这次失败击垮自己，而是联手逮捕了汉克的旧雇主。由此，汉克成为了一名赏金猎人并获得了巨额赏金。有了这些钱，三人现在可以开始调查“灭绝计划”。他们从寻找名为“家园”（Home）的老战争空间站开始了搜寻。


    ## 猎人的崛起


    汉克、`拉拉` 和 `Ned` 前往邪教空间站“家园”。在船上期间，他们遇到了一个试图杀死他们的神秘声音。`Ned` 能够反击并让人类撤撤到安全地带，但他在此过程中离线了。


    通过 `拉拉` 的赏金猎人经纪 `泽诺比亚`（Zenobia），他们得到了一个可能可以提供帮助的人的名字。`埃德温·斯特恩`（Edwin Stern）是一个拥有修理
    `Ned` 技能的研究员，但为了这样做，他需要一个人情。他们飞去见这个人的竞争对手，却发现她是他的前妻。在他们想出和平解决方案之前，她向汉克开了枪。


    在还没有得出解决方案之前，他们前往 `布塞尔`（Bussel）寻找 `阿莱克`（Alek），他是汉克的老朋友兼医生。`阿莱克` 治好了汉克并请求加入他们。他们接受了，但在审判随从
    `伊莫根·哈什` 出现时，他们被迫逃离。


    他们回到 `埃德温`那里发现他被带走了。顺着线索，他们找到了他，并在救了他后修复了 `Ned`，并为他提供了避难港，他接受了。


    `Ned` 醒来告诉他们，他们在空间站遇到的那个声音是 `特恩`（Twain），老战争期间的反对派领袖 AI。但 `Ned` 也有了一些新线索。


    当他们追踪 `Ned` 学到的信息时，遭到了审判者的伏击，但 `伊莫根` 帮助他们逃脱，条件是帮助她从这种生活中解脱。有了她的帮助和一些货运清单，他们可能追踪到“灭绝计划”。


    ## 反抗军情报


    `伊莫根` 提议用情报和政治关系换取汉克帮助她的家人离开财团的首都星球 `Emortium`。尽管 `拉拉` 不相信可以信任这个前随从，但汉克同意了，在从一个
    `维克拉斯`（Vekrass）黑帮那里弄了飞船后，他们潜入了行星。


    船员找到了 `莉` 和她的丈夫，并在审判者的追踪下离开了行星。她请求去往反抗军的营地，当他们到达时，见到了富有魅力的领袖 `斯普`。


    他们聊天时，附近的村庄遭到了海盗袭击，汉克被请求帮助。他们没有仅仅为村庄建立防御，而是主动与海盗战斗，成功瘫痪了舰队并获得了赏金。


    `斯普` 感激万，他们与 `莉` 分别，继续寻找“灭绝计划”。但当他们发现一个老战争医疗设施时，他们得知了一个黑暗真相：`斯普`是一个古老的邪教徒，似乎正在帮助老敌人
    AI 重新建立他的军队。


    ## 致命幽灵


    汉克终于有机会利用 `伊莫根` 承诺的政治关系。尽管她决定杀死 `斯普`，但他仍然相信她在这一努力是可靠的，他们旅行去见她的“叔叔” `文斯`（Vince）：三区州长。


    他们与他讨论如何向议会提交“灭绝计划”的证据，但他需要确凿证据。在会议结束之前，`文斯` 遭到了神秘袭击者的射击，后者消失了。那天晚上晚餐，他再次遭到袭击，汉克成功杀杀了杀手。这样做不仅让
    `文斯` 欠他情，也帮助他提高了赏金猎人的等级。


    凭借赏金的钱以及来自著名赏金猎人 `曼·马利克`（Mane Malik）的一些……鼓励，汉克在升级他的盔甲之前对他的长矛进行了圣化。


