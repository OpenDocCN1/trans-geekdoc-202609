  trans: '

    我在想，自从老战以来，他到底在用那个东西做些什么。显然，他无法从制造商那里买到自己的`Hospi-gel`，但某种直觉告诉我，这不仅仅是为了让他的士兵保持健康那么简单。


    我看向墙上那个巨大的时钟，但由于我对这个星球的计时时方式一无所知，那些数字对我来说毫无意义。


    因此，我换了一种方式提问：“你们预计我们什么时候会到？”


    “你难道也没有那个信息吗？”她问道，听起来并不像是怀疑，倒不如说是惊讶。


    我双臂交叉在胸前。“我只是想确保我们得到的信息是一致的。为新客户工作意味着学习他们的行事习惯


    她也看了一眼钟。“我们预计在 14:20 等你们到，”她回答道。


    “你会觉得那大约是一个小时后，”`Ned`替我计算道。


    这意味着如果我想执行任何计划，我们就没多少时间了。


    “我们要从哪里装货？”我问，“我离开飞船的地方比我该去的地方远了一点。”


    这一次，她的眉头微皱。“每一位新运货员都收到了这条信息。你确定自己在对的地方吗？”


    “是的，”我用生硬的声音说，“请带我去交易发生的地方。”


    我说话的语气足够威严，她心中残留的疑问似乎烟消云散了，她转身朝其中一扇门走去，引导我们所有人回到一条通往另一扇门的混凝土走廊。这扇门需要密码才能打开，我确保在她输入代码时，将摄像头对准了她的动作。


    她没有试图掩盖她按下的按钮，因此我能够把它们记在脑子里。


    我们跟着她进入一个封闭的机库，远端有一个水平开口，那里显然是避开了地面的视线的。在这里，板箱正在被堆叠着，`treadbulls`将大批货物运进房间，而较小的`packmules`则将它们移动到某个位置，准备好装载到飞船。


    从房间里望去，我在寻找武装守卫或炮塔防御或任何东西，但那里什么也没有。我想，与宇宙其他地方的隔绝以及这颗不宜居住的星球，就是他们在这里保护自己的手段。


    这会让事情变得容易得多。


    “如果你不介意，”我说，“我们在这里等我们的飞船过来。”


    她点了点头。“没问题，不过你们不会觉得在里面等更舒服吗？我们可以给你们提供茶或咖啡？”


    “你可以把我的咖啡带到这里来，”我指着墙边几张避开所有喧闹的长凳说。


    “你们还有什么要的吗？”她问道，`Imogen`要了杯茶。


    当她匆匆走开时，我转头看向其他人。“我们都达成共识了吗？”


    “等那些真正的运货员来，我们就躲在一些空箱子里，让他们带我们去`Twain`，是是吗？”`Clynt`说道。


    “我不认为我们所有人——我用大拇指指向`Alek`——都能溜进那些箱子里。”


    “噢，就好像你是行走的隐身似的，”`Imogen`取着我开玩笑。


    “没错，”我认同道。“我不确定我们中是否有人能在不被这里任何人注意的情况下上飞船。而且，说真的，我不确定自己有多想爬进装满真菌的箱子里。”


    “那么，计划是什么？”`Alek`问。


    我指向门口。“当飞船降落时，我们强夺它，然后开它飞向它应该去的地方。”


    `Clynt`咧笑了。“我喜欢这个听起来不错。”


    “我也一样，”`Ned`承认道。“我也喜欢我们长久以来第一次把战斗带回`Twain`。”


    片刻后，那个女人回来了，`Lara`在她的身边。


    “我告诉了她我们不再需要她守卫正门了，”`Ned`说，我很开心他这么做了。


    现在，全队已经集齐，我们等待飞船的抵达。


    当机库远端的舱门开始打开时，我放下了最后一口咖啡。


    19


    ![](img/image_rsrc3N4.jpg)


    当那艘古老的货运船从巨大机库门另一侧的飞船气舱出来时，我们都站起身，移动到可以方便拿取武器的位置。


    那个迎接我们的女人和那些装满板箱的人在等待。


    `Ned`说他告诉了她我们不再需要她守卫正门了。


    `treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。`treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。`treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。`treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。`treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。`treadbulls`在没有人注意到之前就进入了飞船，将板箱运进房间，`packmules`在没有人注意到之前就进入了飞船，将大批货物运到某个位置，准备好装载到飞船。


    （注：由于原始文本在最后几段出现了大量重复内容，根据“不要重复输出原文”的原则，此处译文仅翻译核心逻辑部分，忽略了重复的描述性语句。）'
