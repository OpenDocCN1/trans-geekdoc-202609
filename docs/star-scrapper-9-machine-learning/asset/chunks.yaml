  trans: '


    “天呐，那家伙可真是没完没了，”内德通过扬声器说道。


    拉拉用一种怀疑的表情看着我。


    “是你说过你喜欢大大冒险的，”我提醒道。


    她挑了起眉毛。“你应该比谁都清楚，千万别试图用女人的话来对付她。”


    “这招对你来说从来没起过作用，”莉比补充道。


    我决定最好保持沉默，片刻后，`Ammo` 的声音切入了房间。


    “汉克，我的朋友，最近怎么样？”她问道，“我猜你打电话来可不是为了叙叙旧，那么你在哪儿需要军队？”


    我笑了笑。“听到你的消息总是这么好，`Ammo`，”我说，“你说得对。我需要一支舰队规模的后援，来帮忙炸毁一艘被盗的医疗飞船，它正被用来把人类转化成敌人的无人机。”


    “哟，哟，哟，”她笑着说道，“你可总是能带来最精彩的行动。”


    我耸了耸肩。“麻烦似乎总是围着我转。”


    “确实如此，”她说，“我猜你需要大杀器吧？”


    “是的，”我快速回答，我知道我们需要一切能帮到的帮助。


    她点了点头。“我会和`Admiral Huang` 谈谈。但我想，如果你希望他继续支持你，你很快就得去拍拍他的屁股了。”


    “那可不是我最擅长的，”我说。


    她绽放笑容。“如果你想在这个世界上不断晋升，你就得变得擅长这个。你接触的大员和政客会一天比多，你讨好这些人的技巧越熟练，就越好。”


    `Ammo` 以前就提到过这一点，我知道她是对的。“行吧，我会练习讨好那些头头和屁股的，只要你们明天带些武器来参加聚会就行。”


    她点了点头。“我觉得这可以安排，”她说，但她凑近了一些，声音低了，“但你还需要做些事情。”


    “什么？”我问道，身体的疼痛和疲惫让我开始感到头疼。


    “你需要开始在执行这类任务时带上摄像机，”她说道。


    我摇了摇头。“什么？”


    “汉克，你的事业很高尚，但你的公关做得太烂了，”她直白地说，“和平者一直很擅长传达我们的信息，但现在有了这个强大的敌人，宇宙中没有人相信它。好吧，是时候让他们见眼为实了。所以，如果你打算摧毁某种制造机器人士兵的工厂，我们就给人们看。政客们会试图否认，媒体可能会试图掩盖真相，但如果人们开始在整个织物网络中分享并讨论，那才是进步。”


    我呻吟道。“我想你是对的。”


    “我知道我是的，”她说。


    “我会尝试在下一次做这种事之前弄来台摄像机，但我怀疑在明天之前我弄不到那儿，”我说道，我真的不想成为任何身份的名人。被推上这个领导位置已经够糟糕了，我尤其不想出现在镜头里。


    “你知道最幽默的是什么吗？”`Ammo` 问道，我知道她接下来要说的话绝对不会让我感到开心。“其实我上次来空间站时，已经让我的人在那儿留了一整套摄像设备了。所以，我想你可以从明天的任务开始了。”


    莉比尖叫了一声。“太酷了，”她说，“我想以后长大变成她那样。”


    “好了，行，”我说，“我会开始拍摄的。”


    `Ammo` 哼了一声。“别表现得像是在帮我一样，”她说，“我只是在努力帮你成为那个真正能赢得这场战争的人。无论你喜不喜欢。”


    拉拉靠进画框。“那是我们所有人都在努力做的。”


    我手掌抵住 `Lara` 的脸并轻轻推开她，但她伸出舌头，用唾液涂了我的手心。


    “真恶心，”我说，在裤子上擦了擦手。“你从小就一直干这同一件事。”


    “而你每次都中招了，”她对我吐了吐舌头，然后离开了房间。“我去睡觉了。”


    “也许你也应该这样做，”`Ammo` 说，眯着眼睛盯着屏幕，更仔细地观察我，“你脸上还有东西。”


    她起初指指我的额头，然后比划了整个头。


    “如果我想打场好仗，我真的应该一直跟着你，”她说。


    “明天见，”我说切断了信号。


    我太累了，靠在椅子上几乎要睡着了。


    “我会说你直接去睡觉，”`Clynt` 说，“但我觉得你应该先往你身上……全身上下……泼点水。”


    我站起来，身体在渴求休息，走向我的房间，在还没脱掉靴子时就昏睡过去。


    稍后我被吵醒了，尽管在我看来还太早了，是房门外的敲门声。


    26


