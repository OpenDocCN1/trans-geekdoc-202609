    他脸的一侧肌肉只是抽动了一下，我在想他在想什么。不过，如果对我自己诚实的话，那可能根本不是在想这个局面，而是在想屁股、乳房，或者是快快船之类的。


    “还有你们两个，”她说，“你们正在为我提供一个独特的机会。”


    我正想问怎么做，但决定还是闭嘴为好，因为到目前为止，这样做似乎很管用。


    “那些叛徒者自议会成立以来，一直是议会盔甲上的污点，”阿拉娜（Alana）说道，她从椅子上站起来，一边在房间里踱步一边发表哲学见解。而她确实这么做了。


    “如果你所说的哪怕有一部分是真的，这可能是一个改变运作方式的真正机会，”她说，显然在考虑许多变动因素，“但我们需要揭露他们，这将非常棘手。从第一次会议时代起，叛徒者就是一群狡猾的家伙，他们在表面上遵循我们的规则，却在私下里运作随心所为。”


    曼（Mane）一拳砸在椅子的扶手上。“我们应该揭发他们，强迫他们下下议会。”


    “别让你的野心带你走上你还没准备好面对的道路，笨蛋，”她说，“这需要时间和狡计。”


    她转过身，缓慢地穿过房间，停在一幅画前。“你们两个愿意和我一起合作，试着把这个恶棍揪出来吗？”


    “当然了，”拉拉（Lara）说，“为了找到伤害了泽诺比亚（Zenobia）的人，我愿意做任何事情。”


    “和她在一起很长时间了？”阿拉娜问。


    拉拉点了点头。“从我还是个女孩起，”她说，“我在辛·凯尔·卡（Syn Kel Kal）那里当过学徒。”


    议员看向拉拉。“我记得你。”


    拉拉什么也没说，但我看出她听到这话时内心感触很大。


    “当辛想收你为徒时曾来过议会，”她说。


    拉拉艰难地吞了下唾水。“我不知道这件事。”


    “猎人通常不会以那种年龄和那种方式收徒弟，”阿拉娜说，“但他认为认为这样做是最好的。”


    她没有说什么，但那个康内西恩人（Conecian）审视着她的脸。“你不知道？”议员问道，“他什么都没告诉你关于这些吗？”


    拉拉没有立刻回答。“他没说，”她终于说道，“他不是……一本本透明如底的人……”


    阿拉娜笑了起来。“他确实不是。我相信字典里‘坚忍（stoic）’这个词旁边有他的照片。”


    拉拉笑了，眼神有些深远。“我自己一直觉得他是那种‘坚强且沉默的类型’，”她说，“但我想我可能是从他那里学到了这一点。”


    “那么让我告诉你们他从未做过什么事，”议员走近了一些，直视着拉拉，“他来到我们面前，拼尽全力说服我们收下你。在那个房间里，他表现出的情感比他此后或以后任何时候对我表现出的都要多。我确信他从未告诉过你对他意味着有多重要，但在那一天，清晰而易见。”


    拉拉的脸紧绷起来，她极力克制着情绪。她想在议员面前表现得像基拉·维克斯（Kilara Vex），但在找到泽诺比亚并听到这些之后，这显然太让她崩溃了。她夺眶而出，把脸埋在手里。


    “对不起，”她呢喃道。


    康内西恩人走过去，把一只手放在她的背上。“我从未理解过你们人类，”她说，“你们总是为公开场合哭泣道歉，而情感的表达正是你们物种最令人喜爱的特征之一。”


    “我有时也会哭，”曼说，我在想他是不是只是忍不住了，也许这些事情在他体内涌动，他必须把它们释放出来。


    阿拉娜似乎正经历着和我同样的心情。“曼，”她责道，“在接下来的对话中，请只在被提问时发言。”


    “我不认为那是可能的，”我不由自主地开玩笑道，引来了议员的一。。接着我在想，曼和我之间是否真的存在某些我不想面对的相似之处。


    拉拉停了下来，现在只是用一种痛苦又感激的眼神看着那个女人。“总有一天，我会给你讲更多关于辛的故事，”她说，“也许是在只有我们两个人的时候。”


    “我很愿意，”拉拉说。


    “但现在，我们应该处理眼下的事情，”阿拉娜说。


    拉拉沙哑着：“怎么做？”


    康内西恩人用指敲着下巴。“让我们同时采取几步。首先，在泽诺比亚恢复期间，如果可以的话，我将担任你们两个的猎隼（Falconer）。”


    “好的，”拉我和同时回答道。


    “第二，我会在城市周围布置一些我的‘小鸟’，专门听听关于叛徒者及其动向和计划的消息，”她继续道，“但在他们内部我还没有人。这是我将需要努力的方向。同时，我将把罗恩（Roan）的质询排在日程的首位。我必须听听她想说什么，并关注议员普德·帕克（Purd
    Pak）的反应。”


    拉拉挑了挑眉毛。


    “那是叛徒者的代表，”她回答了那个未提出的问题。“他也不是个透明如底的人。他出席会议，之后就消失无踪了。”


    “这里有某种叛徒者的首级吗？”我问。


    阿拉娜点了点头。“有，但它对并不是人都开放，而且经常变动。”


    她的眼神在我们之间来回移动。“我明白了，”她低声说道，“在下次会议之前，我将审阅你们的档案。我预感这绝非易事。”


    噢，她是对的。


    “还有第三，”她说，“我会派一些我的人加入对泽诺比亚事件的调查。她是议会的骄傲成员，我们需要确切知道发生了什么。特别是如果发现叛徒者再次参与其中。”


    “再次？”拉拉问。


    的离开。


    但拉拉似乎对了了什么，问道：“你对辛了解程度如何？”


    再次，康内西恩人闪过一丝表情，但很快隐藏起来。“我比某些人了解，但他不如另一些，”她用这种带有攻击性的回避回答，简直有些滑稽。


    拉拉的眼皮跳了一下。“你不介意我问问你的历史吗？我承认我有些迷茫。”

