- raw: 'He flipped it around to show me a complicated locking mechanism. “Don’t rightly
    know, and I’ll need some time to tinker before I can get up in it.”


    “Okay,” I said. “Well, if we survive what’s next, I’m excited to find out what''s
    in there.”


    “What’s in the box?” Ned cried. “What’s in the box?”


    We washed out, and there in front of me was the H.H. Watson, looking like some
    twisted version of the ship from the file Vince had provided.


    As we had been warned, there were now several large cannons along the side of
    the ship that looked like they were attached with metal tendrils. As though it
    was some kind of infection along the flanks that grew weapons.


    There were also several squads of small and medium craft circling the Watson,
    looking like vultures waiting for a carcass. Which I knew that they would be more
    than happy to make one of us, if given half a chance.


    “Incoming message,” Imogen said, and I swallowed hard.


    Clynt handed me the fob.


    “Here’s hoping this works,” I said and reached out to answer the call.


    28


    ![](OEBPS/image_rsrc3N4.jpg)


    “Who goes there?” a voice said through the comm. I didn’t activate the video.


    “We have a new shipment,” I said. “Had to steal this pet grooming ship, but we’ve
    got fresh meat in the back ready for their… upgrades…”


    “Understood,” the voice said. “Port Saffron.”


    The ship was sent a diagram of the Watson displaying exactly where to land.


    I furrowed my brows. “Do you need our access key?”


    “Oh, um, if you want to provide that, it would be fine,” the voice said, obviously
    surprised by the question.


    I just dropped my head. “Docking now.”


    “Copy that,” the voice said. “Prisoner receiving is ready for you.”


    I killed the feed and checked to make sure it was totally off before saying, “I
    can’t believe this.”


    “I can,” Lara said. “I mean, we put in all that work, of course they didn’t care
    if we had it.”


    “Couldn’t happen any other way,” Ned said through the speaker in his cube so we
    all could hear.


    Sophia looked at us. “So, this is normal?”


    “The only thing that’s normal for us is nothing going the way we expect,” I said.


    Imogen guided the ship toward Port Saffron, and the door opened at our approach.
    Inside, more of the twisted, layered metal encased the former research facility.
    I couldn’t understand how any company let a ship like this go derelict or fall
    into the hands of Twain, but I knew that they operated with such massive budgets
    that even things like a ship this size could just be written off or some such.


    When we docked, there was no one waiting for us and nothing that we had to do,
    like pretend this was some kind of prisoner transfer or anything.


    “It’s actually starting to annoy me that this is so easy,” I complained.


    Imogen shot me a withering look. “Don’t jinx us.”


    “I’m just saying that we could have come here at any time if we had the location
    and rescued people,” I said.


    “We didn’t have the location,” Lara said, her voice becoming more like that of
    Kilara Vex. “And she’s right that you shouldn’t complain. We’ve had enough resistance
    in the past that we don’t need any more now. Let’s just take the win.”


    She was right, so I just pocketed the useless fob and stood up. We moved to the
    stern of the ship, everyone getting ready to go while Sophia picked up the camera,
    turned it on, and stuck it in my face.


    “What are we doing?” she asked me, and I tried my level best not to groan and
    push the thing away.


    This footage might actually prove useful if we got it out to the right people,
    so I tried to play into it.


    “We are at a facility that the ancient Enemy AI has taken over,” I said. “We believe
    he is using it to convert innocent civilians into soldiers for his cause by infusing
    them with robotic technology.”


    Sophia’s face contorted. I assumed that Imogen had filled her in on what we were
    doing, but it seemed like hearing it put so bluntly was disturbing for her. And
    while it worried me in terms of taking her along for this ride, it was also good
    to see. Because if she was worried by what she heard, then maybe the people out
    there who saw this would be too.


    She followed us closely as we stepped off the ship, everyone readying their weapons.
    The hope was that we wouldn’t even have to use them, and we could get the people
    off without incident, but I wasn’t foolish enough to believe that I would get
    that lucky.


    “Any notion of how to blow this thing?” Clynt asked, looking at my satchel in
    a clear indication that he was asking Ned. “My plan were to head to the engine
    and start messin’ around.”


    “That should do,” Ned said. “Just stay on comm so we can time it right. Don’t
    want you getting caught down there.”


    “Well, ain’t you sweet as pecan pie,” the thief said, clutching his claws to his
    heart. “But I don’t plan to get caught in no explosions.”


    Then, as always, he just scampered off without another word, pulled the cover
    off a vent with a quick pop, and disappeared within.


    Four of us were left to make our way to find any civilians.


    The door at the back of the room opened as we stepped up, and we made our way
    into the hallway. Like the rest of the ship, it was covered in what really looked
    like a metal disease. It was bizarre and eerie and made me want to get out. I
    couldn’t even imagine what the people brought here against their will would have
    been feeling as they walked these halls.


    But I tried to shake the thought from my mind, and we moved forward in a direction
    that we weren''t sure about, waiting for any kind of indication. Every now and
    again, there were holes punched in the wall with new tunnels leading in different
    directions as though some machine wanted to take the most direct route and decided
    to go through a sheet of metal rather than waiting for the corner.


    Ned had tried to explain this logic to me in the past, and while I''m sure it
    made sense to a mechanized mind, I, personally, would have just waited till the
    end of the hall and turned. The one thing that I didn''t seem to see anywhere,
    was people. There were no cyborgs, automatons or remote controlled nanobot zombies.


    Instead, it just felt like an empty, cavernous facility. And even more so when
    we reached a bank of escalators that would ferry people in several different directions
    and to many differing heights. It appeared as though it would have been used by
    hundreds of people at a time, but now the stairs just rolled ever onward, carrying
    no one.


    “Where should we go?” Imogen asked me, but I had no idea.


    “Ned, do you have any generalized schematics for a ship like this?” I asked.


    “Interestingly,” he began, and I knew that he probably didn''t have any idea.
    “This barge was custom built and designed specifically upon order.”


    Lara and I shared a look. “You could have just said no,” she said, her voice echoing
    through the commodious space.


    “The entire place is a medical facility, so it''s hard to know exactly where they
    would take people,” he said. “I suppose General Surgery would be the most likely
    candidate as it could be easily converted for Twain’s purposes.”


    “That’ll have to do,” I said, feeling like we had to point ourselves in some direction.


    I gestured to a holographic map in the middle of the plaza surrounded by stairs.
    “Floor four,” I said.


    We all hurried to the specific escalator that appeared to take visitors to the
    floor we wanted and stood, letting the stairs lift us for a moment before getting
    impatient and hustling up to the 4th floor where a huge reception area had been
    filled with cots.


    It looked like the kind of thing you would see in an emergency situation where
    they needed to house huge swaths of people all at once, and I wondered what had
    happened here and where all the people had gone.


    There was something even more unnerving about how quiet it all was, but in the
    distance I heard a single shrill wail.'
  fmt: '

    He flipped it around to show me a complicated locking mechanism. “Don’t rightly
    know, and I’ll need some time to tinker before I can get up in it.”


    “Okay,” I said. “Well, if we survive what’s next, I’m excited to find out what''s
    in there.”


    “What’s in the box?” Ned cried. “What’s in the box?”


    We washed out, and there in front of me was the H.H. Watson, looking like some
    twisted version of the ship from the file `Vince` had provided.


    As we had been warned, there were now several large cannons along the side of
    the ship that looked like they were attached with metal tendrils. As though it
    was some kind of infection along the flanks that grew weapons.


    There were also several squads of small and medium craft circling the `Watson`,
    looking like vultures waiting for a carcass. Which I knew that they would be more
    than happy to make one of us, if given half a chance.


    “Incoming message,” Imogen said, and I swallowed hard.


    `Clynt` handed me the `fob`.


    “Here’s hoping this works,” I said and reached out to answer the call.


    28


    ![](OEBPS/image_rsrc3N4.jpg)


    “Who goes there?” a voice said through the `comm`. I didn’t activate the video.


    “We have a new shipment,” I said. “Had to steal this pet grooming ship, but we’ve
    got fresh meat in the back ready for their… upgrades…”


    “Understood,” the voice said. “Port Saffron.”


    The ship was sent a diagram of the `Watson` displaying exactly where to land.


    I furrowed my brows. “Do you need our `access key`?”


    “Oh, um, if you want to provide that, it would be fine,” the voice said, obviously
    surprised by the question.


    I just dropped my head. “Docking now.”


    “Copy that,” the voice said. “Prisoner receiving is ready for you.”


    I killed the `feed` and checked to make sure it was totally off before saying,
    “I can’t believe this.”


    “I can,” Lara said. “I mean, we put in all that work, of course they didn’t care
    if we had it.”


    “Couldn’t happen any other way,” Ned said through the `speaker` in his `cube`
    so we all could hear.


    Sophia looked at us. “So, this is normal?”


    “The only thing that’s normal for us is nothing going the way we expect,” I said.


    Imogen guided the ship toward Port Saffron, and the door opened at our approach.
    Inside, more of the twisted, layered metal encased the former research facility.
    I couldn’t understand how any company let a ship like this go derelict or fall
    into the hands of `Twain`, but I knew that they operated with such massive budgets
    that even things like a ship this size could just be written off or some such.


    When we docked, there was no one waiting for us and nothing that we had to do,
    like pretend this was some kind of prisoner transfer or anything.


    “It’s actually starting to annoy me that this is so easy,” I complained.


    Imogen shot me a withering look. “Don’t jinx us.”


    “I’m just saying that we could have come here at any time if we had the location
    and rescued people,” I said.


    “We didn’t have the location,” Lara said.


    Imogen guided the ship toward Port Saffron, and the door opened at our approach.
    Inside, more of the twisted, layered metal encased the former research facility.
    I couldn’t understand how any company let a ship like this go derelict or fall
    into the hands of `Twain`, but I knew that they operated with such massive budgets
    that even things like a ship this size could just be written off or some such.


    When we docked, there was no one waiting for us and nothing that we had to do,
    like pretend this was some kind of prisoner transfer or anything.

