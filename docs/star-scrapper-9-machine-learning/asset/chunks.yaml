- raw: 'It might not have been the most rousing speech I had ever heard, but the villagers
    were moved and began cheering, running, and raising their weapons. One even fired
    theirs in the air, and I wasn''t sure if they had accidentally discharged it or
    done it on purpose, but everybody seemed all the more excited by it.


    Soon, we had a plan in place, and we were all riding out on the villagers’ buggies
    toward the mine. I rode with the leader, really wishing that I had asked someone
    her name. Lara rode in a van that had been stolen from the company and recycled
    by the villagers, while Clynt rode on the back of a motorcycle with one of the
    young hunters who had offered to make the most risky play of all.


    “Thank you for this,” she shouted over the roar of the engine and whipping winds.
    “You are going to change our lives.”


    She wasn’t looking at me but watching the road, such as it was, ahead. But I could
    hear the sincerity in her yelled words.


    I hadn’t wanted to end up here, and I knew there was more nuance to the entire
    situation on the surface than I would ever understand, but I was happy to be helping
    these people.


    As we continued forward, she stole a glance up at me. “You do this kind of thing
    a lot?”


    I wondered whether she meant helping folks like them in situations like this,
    or more specifically trying to take down an enemy fortress while totally outgunned.
    Either way, the answer was, “Yes.”


    Even as we bounced along, she nodded her head, and I had to wonder what was going
    through her mind. Though she was young, she seemed to have a good head on her
    shoulders, and her people respected her.


    I couldn’t really imagine what it would be like to have that kind of power at
    her age. When I was that young, the hardest decision I ever had to make was what
    to pick for dinner if Lutch let me pick what we ordered. Meanwhile, this young
    woman was deciding the fate of an entire tribe of people. The choices she made
    had ramifications for so many.


    I supposed that was true for me now too… but I was much older and, theoretically,
    wiser.


    We rode for a long while before she began to slow, and all the vehicles pulled
    into position.


    Timing was going to be everything.


    As the car beside us pulled to a stop, Lara jumped out and positioned herself
    quickly at the crest of a small rise.


    We idled just down the hill, as did the others, waiting for the moment.


    The crack of her rifle’s discharge echoed through the quiet land and was immediately
    followed by the sound of tires crunching and engines revving.


    We all tore forward over the lip of the little hill, plumes of dust spewing into
    the air as we did. In the near distance, lights began to flash and sirens wailed.


    The walls came alive as guards broke into sprints, getting themselves into position.


    How quickly their lives changed. All these people who started their morning thinking
    it was about to be another monotonous day at the mine, only to have everything
    change. But they had no problem in waking up and taking on the people trying to
    invade their mine.


    From the walls, purple bolts cut the sky, searing the earth and puncturing holes
    in our attack vehicles. To our side, one of the energy bolts pierced the crude
    engine, and the buggy erupted in a torrent of flames. Our own vehicle shook violently.
    Two of the wheels lifted off the ground and then slammed back down, almost causing
    us to fishtail.


    But the girl was good.


    She kept her cool and stayed determined, narrowing her eyes and putting the pedal
    to metal, as they say.


    Another bolt streaked the air just beside me, and I wanted to return fire, but
    my two hand weapons were not going to be any good against this kind of distant
    fire. So, I held fast and waited as we continued to clear the space between the
    low rise and the wall.


    A corporate guard seemed to have us in his sights, and even from a distance, I
    could see the barrel of his rifle following us. I knew my own beam would go wide
    and do nothing to him, but maybe it would be enough to force him into cover.


    While gripping one of the beams of the buggy for dear life, I raised my other
    hand and tried to line up a shot. As you might imagine, tearing across an uneven
    surface on an ancient vehicle with nothing but metal bars for shock absorbers,
    aiming a handgun at an elevated target largely obscured by a protective wall was
    a rather difficult task.


    Nevertheless, I pointed my arm as best I could and squeezed off a shot.


    To say the shot went wide would be generous. Very, very generous.


    It was more like I was trying to start a race, the bolt disappearing straight
    up into the sky.


    But the guard on the wall flew back, the force of a shot sending him catapulting
    off the wall.


    “Girlfriend’s one hell of a shot,” the young leader shouted at me, turning the
    wheel just enough to avoid another bolt.


    I thought about correcting her, but I wouldn’t even know where to begin, so I
    kept my mouth shut.


    Anyway, we were approaching the wall and the large door at the front.


    Our primary target.


    8


    ![](OEBPS/image_rsrc3N4.jpg)


    We were close enough now, and the vehicle with Clynt sped up. Picked for being
    the fastest buggy in the fleet, it was able to get them out in front of the rest
    of us, bringing the thief closer to the wall quickly.


    Now our job was to distract and try to get in.


    The larger vehicle was strapped down with explosives hidden underneath a metal
    umbrella, theoretically encasing it well enough to give it time to get into position.
    Unfortunately, some of the guards on the walls had taken notice of it.


    While some were now paying attention to Clynt’s vehicle, correctly assuming that
    it was going to do something brazen, some of the others had noticed that another
    car had a suspicious amount of shielding on it. Bolts came pouring down like a
    purple rain, and the drivers did their best to stay on course.


    The explosive car had pieces of starship hull soldered to the tops and sides,
    meaning that the small energy beams crackled against the sides but did no damage.
    But if even a single one made it through any of the large gaps, we would all be
    trapped on this side of the wall and fired down on until there was nothing more
    of our attack than some smoldering vehicles. Turns out that a bunch of fish trying
    to get into the barrel are just as easy to shoot.


    A shadow shifted along the dirt, and the scream of motorcycle engines ripped through
    the air above our heads. We hardly had time to react as gunfire started immediately.
    Each bike that flew off what I had to assume were ramps raised into position on
    the other side of the wall had a driver at the front and gunner at the back.


    They wore jumpsuits covered in light armoring and helmets, and their weapons’
    magazines (which they carried many of) were large, allowing them to spray us with
    machine-gun fire.


    All of our drivers reacted at once, twisting and turning their vehicles to avoid
    the oncoming hail of bullets. That is, except the two that mattered most. The
    explosive car continued forward, nearing the large door at the center of the wall
    and Clynt’s car. I watched as the driver skidded right then left as he approached
    the base of the barrier, and a little blur flew from the top of the car and into
    the compound.


    But I didn’t have much time to look as the leader spun her wheel just slightly
    too hard. If I had ever wondered what it was like to be in the spin cycle of a
    laundry machine, now I knew. The buggy clipped the ground at just the wrong angle,
    and the whole thing hurtled off the ground and spun through the air in a sidelong
    barrel roll.


    Sky.


    Ground.


    Sky.


    Ground.


    In a twirling whirl, I saw one, then the other, until the vehicle smashed against
    the wall. Then, for a moment, all I saw was white and heard a ringing in my head.


    But I was conscious. And that was something.


    I couldn’t say the same for the leader.


    She was hanging limp, strapped in her seat upside down.'
