    # 5.1 INTRODUCTION


    Microwaves are electromagnetic radiations with frequency ranging from 300 MHz
    and 300 GHz. Due to their basic properties like penetration, absorption, reflection,
    high-frequency and short wavelength, they find applications in disease diagnosis
    (imaging process), therapy (treatment of cancer using hyperthermia) and prevention
    [1, 2]. Wireless transmission of signals over a distance allows patient health
    to be remotely monitored. This eliminates the need to keep the patient in the
    hospital for many days, which reduces the total cost incurred by the patient.
    This is already being used in glucose monitoring, endoscopy, insulin pumps and
    for testing other body fluids.


    Keeping in this view, the research on antennas and the signal propagation for
    body communication, an IEEE 802.15 standardization group was set up for standardizing
    applications focusing on off-, in- and on-body communication. The in-body equipment
    are used to communicate between the medical devices implanted in the body (for
    example, WCE) and the on-body nodes. Off-body communication is the link connecting
    body-worn devices and the receiver unit in the surrounding area [3]. Body-Centric
    Communication (BCC) occupies an important place in Body Area Networks (BANs) and
    Personal Area Networks (PANs).


    # 5.2 BIOMEDICAL TELEMETRY


    The use of implantable devices such as pacemakers, antennas, swallowable pills
    for monitoring different internal parameters of the body is increasing day-by-day.
    Such devices usually consist of an antenna system and power supply unit [4], so
    that after recording the signals, the information can be transmitted to the receiver
    unit outside the human body.


    Figure 5.1 illustrates an example of human healthcare monitoring system. The healthcare
    monitoring system consists of the following components: implantable/sensing antennas,
    electronics circuitry, biosensors and bio-actuators, insulations, characterization
    and experiments, human body, channel propagation, and base station.


    # 5.2.1 IMPLABLE/SENSING ANTENNAS


    Antennas are the main component of the implantable devices, which they help in
    the bidirectional communication (communication between implantable device and
    external receiver unit). Different types of antenna designs have been studied
    by the researchers, but the patch antennas are popularly used for implantable'
