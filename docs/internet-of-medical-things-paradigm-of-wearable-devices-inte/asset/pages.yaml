    then short-circuit may happen. To avoid any such incident, the antenna set-up
    can be covered with superstrate/layer of Macor, alumina ceramic, polytetrafluoroethylene
    (PTFE), etc. These materials act as a separating layer between the human tissues
    and the radiator in addition to providing the biocompatibility properties. Figure
    5.7 shows different uses of implantable antennas.


    The various design requirements of implantable antennas are:


    +   a. Characterization of the implanted antenna should be done.

    b. The antenna should be low profile, which matches with the environment of the
    body.

    c. Evaluation of radiation performance of the compact, low-profile antenna should
    be done by studies like radiation efficiency and return loss.

    d. The performance of the transmission link between the implanted antenna and
    the recipient unit should be assessed using various techniques.


    Table 5.1 gives the details of various implantable antennas being used by the
