  md: 'these different parameters. Likewise, identify when an event exists outside
    the typical pattern to help in the rehabilitation process and the performance
    of the activities [75]. However, these devices present certain limitations in
    terms of their sophisticated instrumentation, low adaptability in different environments,
    and their high cost [24].


    # 6.4.7 Inertial Sensors


    The most used ambulatory systems are the inertial sensors. Inertial sensors are
    gaining increasing popularity in human motion analysis as components of wearable
    sensors provide motion data directly, without the use of external sources or devices.


    The Inertial Measurement Unit (IMU) is essentially the combination of two components:
    accelerometers and gyroscopes; with this, device can measure gravitational force,
    speed, and orientation. Moreover, to make estimations of the motion analysis [16],
    gait phases [40], as well as temporal space parameters [2]. It is instrumental
    to assess the performance of some activity, and with this, it is possible to identify
    the fatigue of the person. It should be noted that IMUs can incorporate magnetometers
    to obtain a better estimate of orientation, using fusion sensor techniques.


    Accelerometers are the most widely used if an inpatient motion or gait analysis
    is required; these have certain advantages, such as miniaturization, mobility,
    cost, and power. However, they carry several factors, such as the need to perform
    gravity compensations to the acceleration. The more computational load is required
    in the post-processing stage, there is an occurrence of drift error in position
    data. It is necessary to calibrate the system to the required segment accurately
    [40].


    Gyroscopes are angular velocity sensors; this velocity is a factor whose signal
    is not influenced by the vibrations (e.g., the vibrations that occur at the moment
    of hitting the heel); additionally, this velocity is not affected by the force
    of gravity. In the output of a gyroscope are periodic results whose patterns are
    repeated during a periodic interval of exercise, such as the gait cycle, jumping,
    riding a bicycle, sitting down and standing [42].


    To provide 3D motion analysis, the inertial units usually incorporate three perpendicular
    accelerometers and three gyroscopes, represented as the x, y, and z axes of the
    unit. These sensors allow studying one movement regardless of its direction by
    estimating the magnitude of these measurements. This magnitude estimation can
    be seen in Equation 6.4, where MAG represents the magnitude of the signal.


    ```

    MAG = \sqrt{x^2 + y^2 + z^2}

    ```


    Taking into account the techniques presented, the next section describes the experimental
    studies that were carried out. Aiming to analyze and evaluate the fatigue in aerobic
    and anaerobic exercises.'
