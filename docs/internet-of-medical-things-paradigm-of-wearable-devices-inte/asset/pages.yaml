    #  2.6.2 Three Scenarios in Data Protection


    Healthcare centers also keep updated records of tests performed in their centers.
    This can cause three scenarios:


    +   1. **No consent or understanding on the part of the patient.**

    This situation implies that the patient does not consent or is unaware of the
    storage of this information, especially when this information may be public in
