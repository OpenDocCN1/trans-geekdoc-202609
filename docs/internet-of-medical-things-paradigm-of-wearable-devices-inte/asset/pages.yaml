    # 6.3.1 SUBJECTIVE SCALES


    The subjective scales of fatigue perception are ordinal numerical scales in which
    each represents a level of fatigue in such a way that the lower number represents
    a state of absence of fatigue, and the higher number represents a state of extreme
    fatigue. In extreme fatigue, the person does not feel able to carry out the physical
    exercise [80]. According to the environment where fatigue is estimated, different
    scales of perception are used and even modified according to their applications
    [52]. One of the most implemented is the Borg Rating of Perceived Exertion (RPE
    scale). Several studies have illustrated that perception scales present subjectivity
    and differences concerning other methods of estimation of fatigue, such as physiological
    parameters, thus leading to a decrease in the reliability of this method [62].


    # 6.3.2 PHYSIOLOGICAL PARAMETERS


    Physiological parameters determine a person''s physiological state, as they indicate
    the body''s internal functioning [5]. One of the applications is the indirect
    estimation of fatigue. The parameters most related are heart rate, oxygen consumption,
    blood pressure, respiratory rate, and blood lactate [36, 45, 50, 79]. According
    to the type of exercise performed, these parameters may present different behaviors,
    making it difficult to relate to the level of tiredness, and even some present
    difficulties when monitoring in real-time; therefore, researchers are looking
    for new estimation strategies [31].


    # 6.3.3 EXERCISE PERFORMANCE


    The decrease in exercise performance has a directly proportional relationship
    with the increase in fatigue [31]. Therefore, methods for monitoring fatigue through
    exercise performance have been implemented. However, their evaluation depends
    heavily on the type of exercise used [39]. The parameters and characteristics
    to be evaluated depend on each exercise and must be sure to avoid errors or uncertainties
    in measurements. For example, if exercise is performed on a treadmill, the commonly
    evaluated parameters are the cadence, the width, and length of step, the duration
    of each gait phase, among others [55]. The evaluation of exercise can be performed
    in different ways using ambulatory sensors (e.g., inertial sensors and electromyography)
    and non-ambulance sensors (e.g., motion analysis system).


    # 6.4 INSTRUMENTS FOR MEASURING FATIGUE


    This section presents the most commonly used fatigue measurement instruments based
    on the three different strategies explained above. It is important to note that
    so far, there is not a method established to measure fatigue. It is leading to
    a slow assessment of the reliability, validity, and usefulness of fatigue measures
    for the physician and the researcher, given few reviews from which to draw such
    information.'
