    # 7.1 INTRODUCTION


    In the 1950s, research in Artificial Intelligence (AI) was supported by a group
    of scientists and researchers who predicted that machines would be capable, in
    a few decades, of carrying out any task that humans could. Nevertheless, it was
    not until 60 years later that the Conversational Agents (CAs) were started with
    Siri (Apple, 2011) [51], which provided a speech interface for question answering.
    Following Apple, some companies, including Google, T&T, Nuance, have successfully
    participated in the market of smart CAS [25] creating awareness in millions of
    consumers that indeed smartphones could answer limited set of questions, execute
    simple tasks and, in some cases, be friendly.


    Since the creation of the first CAS, their common functionality was their capacity
    to interpret natural language via spoken interaction and to provide answers in
    the form of a running software program (e.g., making calls, sending text messages,
    setting reminders, etc.) or a spoken response (“What is the capital of Colombia?”,
    Which is the nearest Colombian restaurant?” [25]. Over time, interest in offering
    better services increased, and in response, the idea of personifying CAs was revolutionary
    [14] giving rise to the Embodied Conversational (ECAs).


    An example of every ECA is SimCoach (US Institute for Creative Technologies, 2013)
    [22], which was created to respond to healthcare challenges caused by the conflicts
    in Iraq and Afghanistan in the U.S. population. The SimProject developed different
    architectures of support agents to serve as online guides for assisting the military
    and their families initiate the healthcare process [53]. Despite its potential
    use, it was not considered to deliver diagnosis or treatment, or as a replacement
    for human providers and experts.


    Currently, ECAs are not the only name given to CAs, according to their characteristics
    they can also be called chatbot [32], avatar [64], virtual human [29], among others
    [25]. Despite the different names they receive, the definitions are rather similar
    with variations of character that demonstrates many of the same properties as
    humans or in a face-to-face situation.


    As CAs evolved, so wearable devices; advances as heart rate monitors, smartwatches,
    activity monitors, and other wearables, have mobile devices ideal for healthcare
    delivery [48,51] and with working together with CAs opened up a new world of possibilities.
    For example, there are currently a large number of applications that can track
    user activity, eating habits and analyze signals as blood pressure, heart rate,
    respiratory rate, skin temperature, etc., by interacting with various wearable
    devices as shown in Figure 7.1.


    The use of wearable devices has been emerging due to their potential to improve
    the level of healthcare delivery and reducing costs. For this reason, the possibility
    of innovation by means of using wearable devices with the intervention of CAs
    could allow in some cases immediate feedback, supplementing the shortage of staff
    in primary healthcare centers and thereby reducing the burden on providers.'
