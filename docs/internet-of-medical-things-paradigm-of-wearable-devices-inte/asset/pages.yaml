    # 5.4.3.3 Designing Wearable Antennas


    The performance parameters for a wearable antenna depends on the materials and
    fabrication methods. The material not influences performance but also radiation
    properties of the antenna. In fact, textile materials turn out to be better than
    non-textile ones.


    +   a. Conductive material

    Electro-textile fabrics are created by interpolating threads of ordinary fabric
    with threads of conductive metal/polymer. Such fabrics can be used for clothing
    owing their flexible, durable and wearable characteristics [44]. In [45], the
    authors highlighted the importance of conductive fabrics in the fabrication of
    antenna. The conductive fabric has low resistance(≤1 Ω/square) in order to reduce
    the losses. Flexibility is also desired in the textile material, for the deformation
    of the antenna. Aramid woven fabric [46] has also been used for antenna designing
    due to its flame-resistant property and thus can be integrated into a firefighter''s
    clothes. Metallic nylon fabric with high conductivity was employed as the conductor
    [47]. It consists of Ni/Cu/Ag layers that provide high conductivity. Additionally,
    this material is flexible and corrosion-resistant and thus found its application
    in highly corrosive surroundings.

    b. Fabrication methodnThe fabrication varies according the material selected for
    designing textile antennas and influence the overall cost of the antenna. In [48],
    different fabrication methods were reported to design the same microstrip patch
    antenna. The simplest technique identified after experiments is to use a copper
    tape, as it can be easily applied to the dielectric substates without any additional
    fabrication step. Conductive spray technique offers more flexibility and can be
    used for the fabrication of any textile material. The copper tape (conducting
    element) was used with felt fabric (used as substrate) to construct an E-shaped
    patch antenna [49].


    # 5.4.3.4 Analysis of Wearable Antennas


    Generally, conventional antennas are assessed on parameters like radiation pattern,
    return loss, efficiency and gain. Usually, the conventional antennas are planar
    structures due to which no bending characteristic is used. But, the study of bending
    characteristics and other factors is needed to test the performance of the wearable
    antenna in a body-worn environment. This section will give some details on the
    measurements that are necessary for examining the performance of the wear-able
    design.


    +   a. Specific absorption rate modeling

    Public concerns and legal requirements about the effects of radiation on human
    health worldwide researchers and engineers study the amount of power radiated
    by the antenna being absorbed by the human body. Specific Absorption Rate (SAR)
    limits are commonly used: IEEE 1.6 W/kg for'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'any 1 g of tissue [50]; International Commission on Non-Ionizing Radiation
    Protection (ICNIRP) 2 W/kg for any 10 g of tissue [51]. The SAR modeling was performed
    using a torso model [52], which was constructed using MRI and CT image of the
    human body.


    b. Measurement at different bending positions


    The performance of the antenna is evaluated by taking measurements at different
    bending positions. These measurements will help in assessing the behavior of the
    wearable antenna, especially when the antenna will be used at different places
    and bending positions on the body (such as the performance of the antenna when
    it is worn on the arm). Researchers have already performed S₁ measurements in
    different bending positions of the antenna [45]. The antenna was attached around
    a cylinder and measurements were performed to study the bending characteristics.
    It was analyzed that the bandwidth decreases and the resonance moves towards lower
    frequencies in the bending position. This can be overcome by designing an antenna
    with broad bandwidth that even if frequency alteration takes place due to bending,
    then the antenna will function in the desired spectrum.


    c. On-body measurements


    Besides the measurements, where the antenna measurements were taken in the absence
    of the human body, the on-body measurements need to be performed as well. The
    position of the antenna on the human body will differ based on its application.
    Wearable antennas are usually placed on the arm, chest, and back of the human
    body. The designed antenna in [48] was first placed away the human body (in free
    space), then measurements were carried out on the human arm and chest. The investigations
    carried out by various researchers, it is seen that the back of the human body
    is the most stable position for placing the antenna and taking measurements with
    least change in orientation as compared to other body parts.


    # 5.5 APPLICATION OF ANTENNAS FOR DISEASE TREATMENT


    Nowadays, antennas are not only playing a key role in the diagnosis of various
    diseases but in the treatment of diseases as well. For example, the antennas can
    be used in hyperthermia, which adds effectiveness to other therapies like chemotherapy
    and radiotherapy given to cancer patients [53]. Antennas can be used in various
    ways for the treatment of diseases, as shown below.


    # 5.5.1 HYPERTHERMIA


    In hyperthermia, the difference in the sensitivity of normal and tumor cells (to
    the heat) is exploited. The tumor cells are heated up by increasing temperature
    to the therapeutic range (42 to 45°C) and protecting the surrounding normal cells
    from heating at the same time. It is helpful, as it can increase the effectiveness
    of chemotherapy and radiotherapy given to cancer patients.'
