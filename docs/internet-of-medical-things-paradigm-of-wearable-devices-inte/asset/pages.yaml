    # 4.1 INTRODUCTION


    Recently, the pharmaceutical industry is faced with the need for changing the
    design of drug products. Upcoming medications shall possess novel characteristics,
    such as intrinsic personalized components coupled with information and tracking
    assets. Late advances in the genetics discipline opened a window to more personalized
    and customized management approaches. Mapping genes offers information for predicting
    health risks, and enhancing management approaches. Genomic medicine has been deployed
    in some marketed monoclonal antibody therapies [1]. Meanwhile, growing advances
    in point-of-care sensors make it possible to measure respiration, temperature,
    biomarkers from sweat, and emotions via the modern wearable sensors embedded into
    clothes [2]. Such health-related facets from the view of the IoT would produce
    a novel form of human–machine interaction'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 52 Internet of Medical Things


    regarding therapies [3]. However, the produced solutions for current dosage forms
    are challenging to be incorporated into the forthcoming IoT-derived health model
    [4].


    The current health model needs to be enhanced, to optimize personalized medicine,
    in all aspects from finding drug products to communicating with the consumer (patient).
    Delivering individualized care necessitates a breakthrough in the domain and a
    drastic modification in designing, producing, and distributing drug products.
    The existing fixed-dose pattern of mass-production for medical products does not
    offer adjustment or personalization of medicine to personal genes, metabolism,
    or the level of activity. Hence, the concepts of pharmaceutical product design
    should be shifted towards mass adaptation of information-based medical products
    [5]. The process of pharmaceutical product discovery and development needs improvement
    via enrolling patients in patient-centered clinical trials and applying the principle
    of the digitized patient into the needed handling framework, adhering to the existing
    data safeguards with no breaching of patent. Such a principle covers the domain
    of Big Data and machine learning-driven diagnosis [6–8].


    Nowadays, investing in the pharmaceutical industry is greatly devoted to finding
    drugs and, using the result produced is designed applying leeway; for example,
    the ancient composition technique for designing solid dosage forms (tablets) [9].
    Ultimately, the production process is universally conventional and unwilling to
    change, primarily for the legislative and regulating workload [10, 11]. Yet, the
    medication prices have risen drastically, adding to the fiscal burden of the community
    and having unsatisfactory levels. Here, a novel technique is highly needed to
    minimize the medication cost via reconstructing the drug product design guidelines,
    associated production interventions, and distribution patterns. Such a technique
    would secure access to affordable, safe, and effective medicines by switching
    from the batch manufacturing of fixed-dose products to producing-demand individualized
    products. Such products could be designed to include information models; for instance,
    rapid responding codes, facilitating monitoring of a single product from the production
    unit to the patient side [12].


    # 4.2 BLOCKCHAIN TECHNOLOGY IN HEALTHCARE


    Blockchain stands for a computational system of recording transactions conducted
    in cryptocurrency and maintaining them across several servers interconnected in
    a peer-to-peer network [13]. Although its origin can be traced back to finance
    because of its inherent features and the transaction-based model of operation
    that these fields have incorporated. As far as its features are concerned, blockchain
    comprises various features including distributed ledger, decentralized storage,
    authentication, security, and immutability. As far as the spread of a transaction-based
    operational model across disciplines is concerned, healthcare services are considered
    providers delivering care as a product. These transactions include an impressive
    deal of personal, confidential, and technical data with potential implications
    on individuals'' well-being and professional development, among others [14]. Violations
    of such data have led many voices to support a blockchain healthcare vision system,
    where practitioners gain more autonomy, and patients will not be afraid of having
    their data communicated with third parties [15].'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Blockchain-Based IoT for Personalized Pharmaceuticals


    Except for doctor–patient communication and individual patient records, other
    elements of healthcare need similar technical infrastructure. The pharmaceutical
    sector is probably one of the most crucial. A popular saying goes like, "All drugs
    can be a poison; the dosage makes them remedy or poison." Amid the 4th Industrial
    Revolution, quote could be recited in terms of pharmaceutical data [16]. There
    is a huge data flow concerning medicines, not only those that are already in use,
    but those that are currently developed and tested. Clinical trials, the process
    of testing novel medicines on humans, is based on the quality and the quantity
    of data testing for the efficacy and the safety of an agent compared to a placebo.
    Any information related to the participants is remain confidential by individual
    outcomes for the sake of randomization [17]. Emerging branches of pharmaceutical
    science, particularly pharmacovigilance and pharmacogenomics, require a significant
    amount of data to be safely stored and protected. Unauthorized access to such
    information can lead to falsified approval and allegation on medicines not only
    doctor–patient communication, but also the life and well-being of patients [18].


    Why can blockchain contribute to this? The biomedical applications of blockchain
    require stronger authentication, interoperability, and record sharing modalities.
    These require standing on ethical and legal grounds, taking into account the Health
    Insurance Portability and Accountability Act of 1996 (HIPAA) and the General Data
    Protection Regulation of 2018 (GDPR) [14, 19]. Adapting blockchain modalities
    to the context of healthcare has already led to considerable advantages and ever
    more. Such modalities include smart contracts, fraud detection, and sound systems
    of identification. In pharmaceuticals, the aforementioned can work as additional
    valves safeguarding integrity and confidentiality subsequently producing reliable
    data. There are still concerns regarding the inherent vulnerabilities of blockchain
    on the quality and the inadequate digital literacy of the users, let alone mining
    incentives, attacks, and key management [20].


    # 4.3 THE INTERNET OF THINGS IN HEALTHCARE


    The Internet of Things (IoT) is described as a network of physical devices that
    uses connectivity to enable the exchange of data. These devices can either be
    contemporary or cutting-edge technology. What is remarkable about the IoT is fast
    streamline processes that enable workers to complete tasks in a timely way. The
    IoT is expected to be supported by the 5G network infrastructure, which guarantees
    the safety of large datasets'' transfer and analysis [21]. In the last years,
    public or private entities specialized in healthcare or technology have developed
    their interest and investment in the IoT. Now, from the existing devices, smartphones
    with wearable-related apps and imaging machines, are manufactured with connectivity
    modalities such as infrared, Bluetooth, or Wireless Fidelity (Wi-Fi). This is
    a remarkable asset to form data-exchange networks where the provision of healthcare
    relies on the exchange of data, such as imaging and laboratory tests, patient
    records, and research results [21, 22].


    IoT-enabled medical devices provide critical data transfer and analysis services
    that assist healthcare practitioners and researchers in a wide range of tasks,
    from'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 54 Internet of Medical Things


    emergency to regular procedures. The benefit of incorporating IoT modalities in
    healthcare is twofold. Not only it facilitates a large load of work to improve
    and speed up biomedical research and clinical practice, but it also relieves burden
    of health practitioners allowing them to be more creative and more empathetic
    [14, 23]. The potential of the IoT infrastructure in remote patient monitoring,
    treatment and outcome, vaccines, and medicines has become obvious. In terms of
    cost, any similar IoT health platform can be owned and operated by a specialized
    center, providing services to patients all over a region or even a country. So
    far have been few IoT applications in healthcare finding their way to clinical
    practice [24].


    Beyond the collection and analysis of data, IoT data platforms such as Kaa (KaaIoT
    Technologies), MindSphere (Siemens) and Azure (Microsoft) have IoT-based data
    processing features leading to meaningful actionable. Such modalities are expected
    to be used widely as far as commercial benefit and concerns. Physical activity
    levels in combination with caloric burn and intake, nutritional medicines compliance
    data report, heart rate, and blood glucose monitoring have already valuable at
    an individual level and can make a difference if extrapolated in population research
    by IoT modalities. Human control is important, but if the collection and processing
    are semi-automated, or even automated, it can speed up the production of the results
    and their translation in clinical practice [25, 26].


    # 4.4 APPLICATIONS OF THE IOT AND BLOCKCHAIN IN THE PHARMACEUTICAL INDUSTRY


    As previously mentioned, blockchain is a developing set of ledgers (chunks) where
    the ledgers are linked by the hashing cryptographic technology. The highly famous
    application of this technology is the cryptocurrency bitcoin. An effort of large-scale
    blockchain integration in healthcare is currently taking place in countries like
    the United Kingdom. Starting from January 2016, the authorities have communicated
    relevant information. This stated the National Health Service as a potential beneficiary
    of blockchain modalities, to improve delivery of services and communicating patients''
    records and sensitive information in a confidential and secure manner, abiding
    by the existing regulations [27]. Philips with the Philips Blockchain Lab has
    partnered with blockchain record-keeping-start Tier to examine how blockchain
    technology could be used in the healthcare sector since 2018 [27]. Regarding the
    pharmaceutical setting, blockchain implies interesting potential such as investigating
    a lifelong medication history.


    # 4.4.1 THE SMART FRIDGE


    The Smart Fridge for vaccines by Weka is an interesting example of IoT in health.
    It addresses issues in vaccine management and storing such as maintaining the
    recommended temperature, ensuring the provision of stable electrical current,
    and tackling other inventory errors resulting in spoilage. The Weka Smart Fridge
    allows remote monitoring to ensure vaccines are stored at the correct temperature
    and automated inventory management services allow clinicians to feel at ease and
    and'
