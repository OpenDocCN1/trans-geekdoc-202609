  md: '# 4.5 DISCUSSIONS


    According to the Office for Science suggestions, patients'' records can be operated
    via a decentralized blockchain rather than being safeguarded in a central database.
    Blockchain decreases the risk of unauthorized access through protocols governing
    the methods and the people or entities allowed to access such data. For example,
    a secretary of a primary care facility might only access essential information
    about a patient, such as their name and address. A doctor would have complete
    access to all medical information [14, 27]. Patients could access their own records
    as well and interact with them in a moderated manner. Suggestions include patients
    to specify preferences of treatment or a list of members who could participate
    in decisions concerning their health. Consent can be moderated and documented
    easily in this manner. This applies to keeping track of their records regularly
    and also to people with a complicated medical history who need to decide on emergency
    conditions [38].


    The communication between the public and private healthcare facilities would be
    easier. So these facilities use their own owning systems. Access to each other
    is complicated and most requires arduous bureaucratic procedures and hand of data.
    Providing patients with the option to access to their records contained on a blockchain
    system to all healthcare providers, including private healthcare entities, has
    been regarded as a significant aspect [16]. This has already been implemented
    in Estonia, where a data security start-up, Guardian, was established. This collaboration
    deploys a blockchain-based safeguarding over one million healthcare records. With
    Guardian''s key signature infrastructure integrated into the Estonian eHealth
    Foundation''s database, patients and practitioners have real-time access to the
    records. Similarly, IBM Watson Health announced in 2017 a collaboration with the
    US FDA in defining a secure, efficient, and scalable exchange of health data via
    blockchain modalities [27].


    # 4.6 LIMITATIONS


    George Bernard Shaw has stated, “the single biggest problem with communication
    is the illusion that it is happening”. Similarly, the single biggest problem with
    blockchain modalities can be the fact that people who are not trained and familiarized
    with this technology expect and are expected to implement in their working conditions
    formidable results rapidly [39]. Blockchain literacy is an important obstacle.
    Not all governments have released policies regarding cryptocurrency in countries
    such as the United States (US), Russia, and France have probably cultivated such
    mistrust [40]. In terms of policymaking, the involvement of international institutions
    or political schemes such as the United Nations (UN), the World Health Organization
    (WHO), or the European Union (EU) can increase interest among national governments
    and healthcare systems. Policymaking carries inherent obstacles as well though.
    Blockchain addresses the need for security and confidentiality [41, 42].


    Apart from political institutions, academic institutions may also be associated
    with obstacles. Blockchain has a strong industrial or start-up profile, while
    in many'
