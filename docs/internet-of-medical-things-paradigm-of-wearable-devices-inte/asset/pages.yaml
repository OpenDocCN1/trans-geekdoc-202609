    # 2.1 INTRODUCTION


    Nowadays, all kinds of small devices, called “things”, have computing features.
    For this reason, the label “smart” is added to phones, clothes, cars, and home
    appliances. In addition, the Internet and the broadband and wireless networks
    make possible complex performing and very useful solutions in every field. In
    medicine, these advances and technologies are very important. The Internet of
    Medical Things (IoMT) establishes the necessary scenario to interconnect and manage
    these smart medical devices or things, like scanners, analyzers, wearables, sensors
    or operating material.


    Because of that, now we can store, manage huge amounts of data and images to perform
    better diagnostics, using Artificial Intelligence (AI) techniques, we can also
    predict epidemics. Using video surveillance, it is possible to improve the interaction
    with remote patients. In addition, with advanced robots, a surgeon can perform
    an operation in a much more precise and secure way. And, in some cases, these
    technologies are combined and related to design better solutions; e.g., a team
    of surgeons in different countries can use video surveillance to guide and perform
    an operation and remotely control the robot used in an operation, making medical
    decisions based on advanced image processing and Big Data.


    Taking all of this into account, in this chapter we will analyze most of the relevant
    current and future trends referred to as the IoMT. Specifically, we will address
    the following:


    +   1. Robotics. Robotics are becoming more and more important because they can
    improve on provide some key benefits such as high precision, lower risks, better
    prosthesis or faster recovery times after robotic surgery.


    +   2. Data-driven medicine. There are huge databases with medical information
    on millions of people. Due to this fact, it is possible to automate analysis that
    facilitates the forecasting of epidemics.


    +   3. Image analysis and video surveillance. Medical imaging assists a doctor
    in detecting the extent of a disease during any surgery. These technologies, are
    closely related to other topics like robotics, e.g., to register images in an
    automated scanner, wearables; to retrieve and visualize diagrams of personal measurement
    data or data-driven medicine; and to generate graphs with trends. The patients
    can be remotely monitored using video surveillance equipment [1, 2].'
