    # 2.5 FUTURE TRENDS IN CYBERSECURITY


    In general, a service that bases its main action on the analysis and treatment
    of data can bring failures or breaches if they are not properly organized. These
    failures or breaches can trigger protection programs. So, it is not surprising
    that as society advances, so advancing the regulation on protection. The problem
    could be divided into two parts: the vulnerability of the devices discussed, and
    knowledge about the relevant legislation. For the first part, the future trends
    in cybersecurity will, for sure, increase the protection of these devices. For
    the second part, in the next section we introduce the main concepts about current
    and future trends about legislation.


    # 2.6 LEGISLATION APPLIED TO IoMT IN MEDICINE


    Workers in the healthcare sector want to comply with the legislation, but they
    may not know of it or the adequate devices for its correct compliance. This can
    cause legal problems and trigger workers to fear possible consequences and be
    more cautious in their medical capabilities due to limited digital control.


    The main objective of the regulation is to create a culture of data protection
    in health matters. The main goal is to prevent non-compliance and stringent patient
    protection.


    # 2.6.1 LEGISLATION IN EUROPE


    In 2016, Regulation (EU) 2016/679, General Data Protection Regulation (GDPR) was
    approved, which aims to unify the regimes of all the member states of the European
    Parliament. From 2018, a series of mechanisms to protect the privacy and security
    of the citizen is mandatory. After a few months later, the Organic Law 3/2018
    of December 5, on Data Protection and Guarantee of Digital Rights was published
    in Spain. Among its outstanding articles, that can be directly linked to the IoMT
    in the healthcare field are:


    +   * General obligations of the person responsible for data processing. It is
    necessary that the healthcare centers have a figure that safeguards the treatment
    of data. Patients must be protected from situations that may generate discrimination,
    identity theft or fraud, financial losses, damage to their'
