    # Internet of Medical Things


    Wearable devices for medical applications, orable Health Devices (WHDs), such
    as sensing and actuating have become the basis of lots of revolutionary digital
    health fields. Examples are wearable electrocardiography (ECG) monitors, blood
    pressure sensors, They consist of, such as motion sensors, which include accelerometers
    to collect huge amounts of data for medical and fitness applications, record step
    rate, and motion acceleration and speed. Also, these sensors can help in collecting
    information on post-surgery, motor degradation measurement of patients, regulating
    sleep activity, REM sleep reduction, and post-traumatic stress disorders information
    [9–11].


    There are many technologies for power available for WHDs such as resonance-based
    charging, inductive coupling and microwave. They are all different in terms of
    working frequency, power level, transfer distance, forming factors and size. They
    are all preferred in different applications, as microwave systems are used over
    longer distances at low power, inductive coupling systems are used limited distances
    at tens of kilometers, and resonance systems in the megahertz band at tens of
    centimeters. The implantable devices are used over shorter distances; these wireless
    systems have many misalignment. With wearable devices, resonance-based charging
    systems are most beneficial compared to others due to their charging flexibility
    and misalignments of sender and receiver coils [12–14].


    In this chapter, after presenting an introduction in Section 3.1, Section 3.2
    gives a comprehensive literature review. wearable devices and their parameters
    for medical applications. Section 3.4 and 5 present the applications and key challenges
    respectively in wearable devices. Conclusion is drawn in Section 3.6.


    # 3.2 LITERATURE REVIEW


    The compact and precise antenna design having a novel Electromagnetic Bandgap
    (EBG) structure for medical application is presented at 2.4 GHz. It demonstrates
    a compact, robust and low-profile solution for wearable applications requirements.
    It is shown that the EBG structure minimizes the effect of frequency detuning
    and back-radiation of a large loss of human body. Also, the proposed design antenna
    46 × 46 × 2.4 mm³ dimension leads to 27(2.17–28.3) GHz bandwidth with 7.8 dBi
    gain. It is concluded that antenna is a potential solution for wearable devices
    in various domains [2].


    A human monitoring system is designed and analyze human body ailments. It is shown
    that smart WHDs may provide health data and alerts with various types of sensors,
    as well as notifying them using smartphones. This reduces the load of IoT-connected
    network and the overall cost of users. It is also shown that this proposed monitoring
    system can provide identical communication to various IoT devices [5].


    A U-networking framework based on ultrasonic communications for WHDs is presented
    here. The bit-error-rate achieved (BER) is less than 10⁻⁵ at 2 kHz bandwidth,
    20 mW power and 2.76 kbit/s rate. It is concluded that this proposed design can
    be implemented for reconfigurable data processing applications. It offers higher
    performance, higher data rates and lower energy consumption [9].'
