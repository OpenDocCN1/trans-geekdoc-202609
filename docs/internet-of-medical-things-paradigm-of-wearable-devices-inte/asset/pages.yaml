    # Benefits of Using MapReduce


    +   - **Parallel Computing**: MapReduce distributes the task amongst various systems.
    This is known as parallel computing which distributes the load among various systems
    and improves the performance of the overall system.

    - **Scalability**: Since the data is divided among multiple systems, it is capable
    of dealing with large amounts of data by increasing the number of nodes.

    - **Low Cost**: MapReduce does not require costly computers to process data. The
    jobs are executed on commodity hardware, the total cost of processing MapReduce
    is less.

    - **Faster Time**: The task is conducted simultaneously on multiple nodes, the
    total time required to complete a task is less than using other technologies.

    - **Recovery**: When the data is stored on HDFS, the framework stores data simultaneously
    in multiple locations. Hence, in the scenario of a system crash and subsequent
    loss of data, can be recovered from the remaining locations.

    - **Simple**: The users are not required to learn an additional language to process
    data using MapReduce. Languages like Java and Python can be used to write MapReduce
    code.

    - **Locality of Reference**: The Job Tracker and Name Node are responsible for
    assigning tasks to the nodes nodes that have data on the local disk. Hence, there
    is minimal movement of data from node to node.'
