    # 8.2.5 MapReduce


    MapReduce is defined as a software framework which is used to build applications
    and programs to process large amounts of data parallel on multiple machines. The
    name suggests, it consists of two major phases: Map and Reduce [42] in addition
    to the Splitting phase


    The Map phase considers raw data as an input and produces an intermediate data
    set of key/value pairs. The Reduce phase takes the intermediate set from all the
    mappers and produces a single set of key/value pairs as output. The Reduce step
    can itself be partitioned into three different phases, Shuffle Shuffle Sort phase
    and Reduce phase. All these phases have been discussed in detail with an example.
    It is basically a programming model for processing large data sets. In [8], the
    authors proposed a model which takes Map and Reduce functions to parallelize the
    computation (automatically) across large-scale clusters of machines. It also helps
    to handle failures of machines, and schedules communication between inter-machine
    to efficiently utilize the network and disks.'
