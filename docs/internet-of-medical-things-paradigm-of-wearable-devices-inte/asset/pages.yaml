    and fear, among others. Additionally, preliminary evidence favors the acceptance
    of CAs by patients and their ability to serve unlike humans.


    Finally, WHO emphasized that the burden of depression and other mental health
    conditions is on the rise globally [47] and it is important to continue to create
    alternatives for a comprehensive and coordinated response to mental disorders
    [4].


