    # 3.1 INTRODUCTION


    In today''s world, the interest in wearable computing devices has been increasing
    because of the potential applications in fields such as healthcare monitoring
    of patients. These devices help in observing a patient''s vital signs, emergency
    rescue systems, physical training, etc. [2-4].


    As it is well known, lots of diseases could be easily treated if they are detected
    in an early stage. This leads to saving patients'' lives earlier. Over around,
