    # 1.3 ARCHITECTURES for IoT


    The IoT architecture must ensure that data are transported, stored, processed
    and made available to the user [22]. Thus, the search for an IoT architecture
    that supports the different environments and contexts of the world is a challenge.
    It is important to have a modular and scalable architecture that allows the integration
    of new functionalities. In the literature, there are number of proposed architectures
    which are typically divided into three levels. The best known architectures are
    as follows:


    +   1. Three-layer architecture: This architecture contemplates the perception
    layer, network layer and application layer [8, 23], see Figure 1.1. Next, a description
    is made of the most important characteristics of each of these layers.


    The perception layer: This layer is also known as the terminal layer or the device
    layer. The perception layer is classified in two sections: the perception node
    (sensors, actuators, etc.) and the perception network that is responsible for
    interconnecting the network layer. Data are acquired and controlled by the perception
    node [24]. The main task of this level is to'
