    # 2.2.6 FUTURE TRENDS IN ROBOTICS


    We know that technology is in continuous progress. The capability of nanobots
    to perform surveillance is one of the most attractive future trends in robotics
    [5]. Since ancient times, scientists have been dreaming of small machines that
    could realize unimaginable worlds. The physicist Richard Feynman was the first
    one thought about the possibility of having these benefits from very small machines.
    The main characteristic of the nanorobots or nanobots is that size is less than
    one nanometer.


    Nowadays, the National Aeronautics and Space Administration (NASA) is the most
    advanced organization in the study of nanotechnology, the importance lies in the
    use that nanotechnology to improve the resistance of spacecraft.


    The need that man has to survive in zero gravity or the pressures of outer space
    makes NASA researchers and develop applications of nanotechnology in health. In
    addition, being small devices, they can enter a person''s body without hurting
    them to fight against bacteria, viruses, toxins and even specific cells.


    # 2.3 DATA-DRIVEN MEDICINE


    Nowadays medical services have huge databases with the longitudinal medical records
    of millions of people. The question that researchers are addressing is to what
    extent the automatic analysis of these databases facilitates the forecasting of
    epidemics [6]. This data-driven medicine will help the health authorities achieve
    better prevention, provision of resources and significant savings in hospitalization
    costs. Furthermore, this means an increase in the life expectancy of the population.
    In this section we will review the current status of these techniques.


    # 2.3.1 PURPOSE OF THE STUDIES


    Clinical epidemiology aims to demonstrate epidemiological causality based on medical
    studies. Epidemiology is used here in a broad sense, that it does not only address
    infectious diseases, but risk factors such as smoking, BMI, etc.


    The purpose of epidemiological studies can be divided into surveillance and prediction
    [7]. Surveillance monitors the state of the disease in the time, the place or
    the risk group, in order to orient the development of public health programs.
    Prediction aims to discover new associations (epidemiological hypothesis) between
    exposures and diseases.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 2.3.2 TYPES OF STUDIES


    The underlying studies have been traditionally classified into observational and
    experimental studies [8]. Observational studies do not expose participants to
    the risk factors; the most common observational types are:


    +   1. Case study** surveys the evolution of a particular individual suffering
    from a certain disease, within a particular situation or period of time.

    2. **Case-control study** is a retrospective survey of two groups: one with the
    disease (the case) and another without the disease (the control). Typically, the
    odds ratio between the exposure levels of both groups is aimed in determining
    the level of causality between the exposure and the disease.

    3. **Cohort study** is a longitudinal study that samples a cohort (group of individuals
    at risk of developing the disease) [9]. The study registers time the level of
    exposure of the individuals to the risk factors and those who developed the disease.


    In experimental studies, the researcher manipulates the level of exposure of the
    participants to a drug or a risk factor. The most common study is the clinical
    trial in which some participants are given a drug, and others a placebo. The objective
    is to conclude whether the effect of the drug is statistically significant.


    # 2.3.3 EXPOSURE MEASUREMENT


    Exposure measurement gauges the level of exposition of the participants by means
    of regular tests and questionnaires. The IoMT has given rise to a set of wearable
    devices that facilitate the monitoring of the vital signs. For instance, [10]
    describes its to monitor stress levels throughout the day. These measures allow
    determining the level of association between the exposure (explanatory factor)
    and the response. The more obvious difficulties are the bias (i.e., systematic
    error) and precision (i.e., random error) of the measurement. However, there are
    other difficulties that frequently cause misleading conclusions.


    +   1. **Confounders** are disregarded variables that modify the weight of the
    association between the exposure and the observed response, or spurious associations.
    For example, studying how the consumption of alcohol (exposure) affects the BMI
    (response), the researcher can be ignoring confounding variables such as whether
    the alcohol consumers are paying attention to their diet. The authors of [11]
    describe a number of techniques to decrease the occurrence of confounding.

    2. **Heterogeneity** occurs when different groups may have different levels of
    response to the exposure factor. For example, men have a significantly lower incidence
    of breast cancer than women. If we do not separate the participant by sex, what
    we will obtain obtain is a weighted average of the response. One approach to deal
    with heterogeneous responses is stratification, which'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# IoMT: Current and Future Trends


    partitions the cases whenever we think gender is altering the results. Stratification
    facilitates comparison, but it is important to ensure that all the subgroups are
    sufficiently represented in the sample.


    +   3. Interactions frequently occurring apply techniques as analysis of variance
    or regression analysis. In particular, they occur if there is an exposure to several
    risk factors, and the contribution of the risk factors is not additive, but multiplicative.
    For instance, gender interacts with other risk factors accentating or decreasing
    the occurrence of breast cancer.


    # 2.3.4 ETHICAL ISSUES


    Ethical issues arise when instead of using datasets to prevent diseases, they
    can also be used for other purposes; for instance, to choose or discard the clients
    of an insurer, or to decide on the granting of mortgages. To prevent abuses, we
    have to be vigilant for the purpose which the above-mentioned techniques are being
    used.


    # 2.3.5 FUTURE TRENDS IN DATA-DRIVEN MACHINE


    A challenge that is still unresolved is in data munging. Clinical records are
    very messy and include missing values, outliers, etc. Consequently, there must
    exist a preprocessing step that mixes and reorders the data before their injection
    into a classification or prediction algorithm. Unfortunately, this process is
    still done manually and is extremely tedious. A contribution to this area is the
    use of imputation techniques for handling missing data[6].


    A second area of improvement is the use of machine understanding to improve the
    prediction accuracy. We think that nowadays it is difficult to advance the (already
    highly developed) statistical techniques, without the ability of the machine to
    understand the implications of the data, in a similar way that humans develop
    intuitions from manual data inspection.


    # 2.4 IMAGE MANAGEMENT AND VIDEO SURVEILLANCE APPLIED IN MEDICINE


    When a doctor needs to know the status of a patient, a picture is worth a thousand
    words. Medical imaging allows the doctor to detect the state and extent of a disease
    without any surgery. In fact, the capture and processing of images of the human
    body nowadays ubiquitous in medicine.


    # 2.4.1 IMAGING MODALITIES


    Before analyzing a medical image, it is necessary to capture it. The most common
    techniques for capturing medical images of the body’s interior are described below:


    +   1. Sonography consists of emitting ultrasounds that are propagated by the
    body to be analyzed. Ultrasounds are well transmitted by water, but produce'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'echoes when finding bones, calcifications or fat. Although the images are not
    as clear as in other approaches, this technique has the advantage of not having
    risks.


    +   2. Magnetic Resonance Images (MRI) measures radio frequency signals emitted
    by hydrogen when it resonates with strong magnetic fields. This technique is very
    popular because it allows you to capture clear images without the to expose the
    body to radiation.


    +   3. Magnetic Resonance Imaging (fMRI) is a popular MRI application to measure
    the brain activity. Specifically, the technique detects increases in blood flow
    in areas of the brain that are activated. In this way, it is possible to know
    which parts of the brain are involved in each cognitive activity.


    +   4. Positron Emission Tomography (PET) uses amounts of radioactive material
    that the patient must swallow, and which acts as a tracer. The use of substances
    with biochemical reactions (for example glucose) allows concentrating the radioactive
    material in certain parts of the body. This technique is very precise and can
    be used to capture both macroscopic and microscopic images.


    +   5. Computed Tomography (CT). It is possible to create a set of virtually scanned
    images (typically PET or MRI) to obtain a 3D reconstruction of an organ.


    +   6. X-ray imaging is one of the oldest and most frequent techniques due to
    ease of use and the clarity of the captured images. It consists of circulating
    gamma radiations through the body. Solid structures as bones have a higher absorption
    rate than liquids. This contrast appears in the image collected on the other side
    of the emitter.


    # 2.4.2 CLASSICAL POSTPROCESSING TECHNIQUES


    Once the images have been captured, different image postprocessing techniques
    are used to enhance them. The most basic, classic and effective techniques are:


    +   1. Histogram equalization. This technique introduces the overall contrast
    of an image by redistributing the intensity levels of the histogram [12].


    +   2. Deblurring. We can use standard techniques of contrast enhancement to increase
    the clarity of the blurred areas of a medical image (see, for example, [13]).


    +   3. Thresholding. This technique converts a gray-level image into a binary
    image. For instance, [14] describes a method to select the optimum [14] describes
    a method to select the optimum threshold value for medical images.


    +   4. Combination of images. By combining different images, you can retrieve
    information lost in the individual images. For example, [15] proposes a method
    to combine PER and MRI images.'
