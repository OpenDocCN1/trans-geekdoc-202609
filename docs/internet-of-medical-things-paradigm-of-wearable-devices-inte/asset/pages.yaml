    in their anxiety state.


    On the other hand, 2018, Easton et al. [18] presented a virtual agent for supporting
    people with Chronic Obstructive Pulmonary Disease (COPD) by creating a therapeutic
    relationship with the agent and the user, in particular for crisis support. As
    a result, this study indicated that the benefits of this low-cost system increased
    self-confidence, less social isolation, and better patient awareness of the disease.
    Clinical gains include fewer acute exacerbations and a decrease in utilization
    of the conventional healthcare service.


    As shown above, intervention of CAs in this field may involve innumerable benefits
    and gains, always at improving the quality of life of patients and their families
    facing life-threatening diseases.


    # 7.4 FUTURE WORKS


    As highlighted in the previous section, due to a growing research interest in
    creating CAs that can attend to people, it is important that researchers and developers
    of CAs for healthcare delivery understand their limitations in order to improve
    and explore new features. In the same way, taking into account the studies analyzed
    and their results, a number of recommendations for future designs and work are
    presented below.


    # 7.4.1 LIMITATIONS


    In Section 7.3 it was proved that CAs are being tested and used to provide and
    collect information related to people''s health and, in some cases, provide treatment
    and counseling services. They are becoming more popular and sophisticated than
    ever, but their abilities, at least for now, have significant limitations.


    In the majority of cases, CAs are based on mood and have limited conversations
    [25], some of the others to work in the background providing information when
    and needed [51]. Nevertheless, the scope and adaptability of these strategies
    is limited by the variability of user preferences, context and noise in the user
    input. Most CA applications do not integrate wearable devices being a great limitation
    because the feedback, advice or assistance provided by the agent is not based
    on the state of the organism. And as a consequence, the reliability and security
    of the agent''s intervention are affected.


    The limitations mentioned above become challenges for CAs for medical applications
    directly impacting the quality of life and health of people by affecting the way
    healthcare services are provided. To this end, it would be ideal that CAs have'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'the following characteristics [51]: (i) having spoken, multimodal and multisensory
    understanding, (ii) understanding covert signals, (iii) being able to handle basic
    and complex emotions as empathy, (iv) being aware of the user''s current status,
    and finally (v) having the ability to carry out a dialogue with a human.


    On the other hand, it is important to consider that the intervention of CAs implies
    direct interaction with human beings, their widespread use; for example, the appearance
    and behavior of designed CAs are susceptible to design biases, such as preference
    for a particular racial or ethnic background. Consequently, their developers must
    consider data from target population and diverse communities within a population
    who could be affected by disparities in testing and implementation of these technologies.


    # 7.4.2 RECOMMENDATIONS


    Considering the limitations mentioned above, there were a number of recommendations
    and critical points for future research and designs, as shown below:


    +   - During the phase, the 24×7 availability of the CA must be taken into account
    and its potential to provide assistance at the exact right moment (e.g., just
    before or after a specific behavior) making it a potentially valuable tool.

    - Furthermore, during the data analysis of an evaluation, the outcomes would be
    linked to measures of effectiveness, usage, and user experience, to understand
    if the CA works and why. This is the only way such evaluation can be valuable.

    - Whenever possible, the use of wearable devices could be increased as sensors
    that measure values and the patient being restricted to a bed, in order to provide
    better healthcare services and greater certainty about the feedback that is being
    made.

    - Lastly, to fully understand the effect that the intervention of CAs may generate
    over time, longitudinal studies need to be performed. Most of the documents studied
    results and conclusions from pilot studies or cross-sectional studies, leaving
    poor evidence of the benefits of long-term intervention of CAs.


    # 7.5 CONCLUSIONS


    As an initial observation, one of the advantages of CAs is that they can be replicated
    easily and affordably and unlike humans, users can access them via Internet at
    any time and almost anywhere. Additionally, they could potentially be more reliable
    than humans because they are unaffected by fatigue, exhaustion and cognitive errors.
    However, despite the potential qualities mentioned above, these technologies have
    been and are developed to help health professionals in some specific process rather
    than replacing them. Therefore, it is essential that the developers of these technologies
    provide users with sufficient information on the scope, risks, limits and expectations
    in relation to the use of CAs.


    Also, CA developers can design them to have modifiable physical appearance, language
    and dialect, and other characteristics that match them to a user’s cultural background,
    including race and ethnicity or socioeconomic status. This can help build a relationship
    with users, contributing positively to adherence to treatments and better outcomes.'
