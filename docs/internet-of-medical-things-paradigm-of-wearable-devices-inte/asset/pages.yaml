    showed that the use of wearable sensors would measure and indicate the fatigue
    reflected in spatiotemporal parameters during the execution of aerobic- and anaerobic
    exercises.


    This chapter is organized in seven thematic sections, addressing relevant aspects
    regarding fatigue measure and essential aspects covering physical exercise in
    rehabilitationilitation settings.


    Section 6.2 addresses the importance of physical exercises and its modulation
    in rehabilitation programs, paying particular attention to anaerobic and aerobic
    exercise.


    Section 6.3 begins with the definition of fatigue, its classification, and a definition
    of muscle fatigue. This is followed by three strategies used in fatigue estimation.


    Section 6.4 details the most commonly measures used in the three strategies reported
    in Section 6.3 for fatigue estimation.


    Section 6.5 discusses two experimental studies in both aerobic and anaerobic exercises,
    which are based on measuring fatigue through performance decrease in physical
    exercises.


    Section 6.6 discusses the fatigue in the decrease of performance and the outcomes
    obtained from the studies carried out.


    Finally, Section 6.7 presents the conclusions, some recommendations for future
    works in this field and the challenges of fatigue estimation in the rehabilitation
    context.


    # 6.2 PHYSICAL EXERCISE IN REHABILATION


    Physical Exercise (PE) is understood as any activity that requires contracting
    muscles and more energy than a resting state [67]. Performing physical activity
    provides numerous benefits to people''s health, such as the improvement of the
    cardiovascular respiratory system and the development of muscular groups, which
    are essential for daily life tasks [61]. The World Health Organization (WHO) highly
    recommends PE to prevent and treat many chronic diseases, such as cardiovascular
    diseases, cancer, stroke, and diabetes [78].


    Several rehabilitation programs have incorporated PE in their therapies; for example,
    in (i) cardiac rehabilitation, to increase the cardiovascular performance [19,
    32, 54]; (ii) oncology rehabilitation, to ease the effects of pathological fatigue
    [18, 65], which is a symptom normally presented in patients with cancer [46];
    (iii) neuromuscular rehabilitation, to recover mobility of limbs, and by regaining
    the affected neural paths [15, 38, 68]; (iv) pulmonary rehabilitation, to raise
    the pulmonary capacity of the patients [26, 66]; and (v) musculoskeletal rehabilitation,
    to recover joint mobility and muscle strength after surgery [22, 23]. This information
    is summarized in Table 6.1.


    The inadequate use of PE can lead to extreme physical or physiological conditions
    that can result in health complications, especially if heart or pulmonary disease
    is present [41]. Therefore, some considerations need to be taken into account
    when implementing PE in rehabilitation and designing exercises according to each
    individual''s needs and conditions [53].'
