    These antennas are implanted inside the body for constant monitoring of different
    body parameters such as blood glucose level, brain activity, cardiac activity,
    etc. [13, 14]. These antennas must be designed by using some biocompatible material
    or should be enclosed in some biocompatible material to avoid any adverse reaction
    and its rejection by the body. If the metallization of the implantable antenna
    comes in direct contact with the human body fluids, which are conductive in nature,


