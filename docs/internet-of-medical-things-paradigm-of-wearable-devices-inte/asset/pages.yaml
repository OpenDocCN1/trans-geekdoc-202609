  md: '# Role of Big Data in e-Healthcare


    # 8.1.4 PRE-DETERMINED REPORTS


    In the early 1970s, Extract Programs were created to generate reports having a
    pre-determined template and required information. These programs extracted data
    from a pre-determined source and created the report as shown in Figure 8.1. These
    programs could be generated with the click of a button having information, but
    the template and the source of the information were fixed. Also, these reports
    could not predict patterns and future values.


    # 8.1.5 Excel FILES


    Excel provides various features for data analysis like sorting data, data filters,
    formatting data and many more. In addition to these features, using Excel to represent
    data graphically is very simple. All of these features make Excel an ideal choice
    for data analysis. However, Excel has various shortcomings:


    +   - Excel is unable to handle Big Data of petabyte.

    - Excel does not support unstructured data like media and image files.

    - Excel works with past data and is capable of creating graphs using that data.
    However, it cannot make future predictions.


    # 8.1.6 DATABASES


    A database is used to store data in the form of relational tables. Structured
    queries can be used to extract data from these databases. Features like Functions
    and Triggers allow the user to attach special functionality to the queries. Despite
    having all these advantages, databases are unable to properly process Big Data
    due to the following:


    +   - Databases allow only structured data to be stored and analysed and used
    for unstructured data.

    - Databases are Online Transaction Processing (OLTP) types. Hence, they are designed
    to store data that is less in volume and is updated regularly. On the other hand,
    data analysis deals with data which is abundant and updated sparsely.


    Now come modern-day technologies which have proved their existence in every domain
    providing up to the mark functionalities to users. These technologies are


