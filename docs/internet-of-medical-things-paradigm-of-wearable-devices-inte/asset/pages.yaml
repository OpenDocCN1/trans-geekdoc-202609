  md: '# Editors


    Dr. Manuel Cardona, Ph.D. received the B.S. degree in Electrical Engineering in
    El Salvador, in 2004 and the Master degree in Automation and Robotics from Universidad
    Politécnica de Madrid, Spain, 2008. From 2007 to 2008, and 2011, he was a research
    assistant with the Robotics and Intelligence Machines Research Group at Universidad
    Politécnica de Madrid, Spain. He has a Postgraduate Degree in Scientific Research
    and a Postgraduate Degree and Innovation Management. In 2020, he received the
    Ph.D. (Cum Laude) in Automation and Robotics from Universidad Politécnica de Madrid,
    Spain. Currently, he is the research director and the director of the Robotics
    and Intelligence Machines Research Group and Computer Vision Research Group at
    University Don Bosco (UDB), El Salvador. He has interests rehabilitation robotics,
    biomechanics, kinematic and dynamic of serial and parallel robots, embedded systems,
    vision and artificial intelligence, and applications of robotics systems. He has
    authored or co-authored more than 45 research articles that are published in various
    journals, books, and conference proceedings. He is an associate editor of International
    Journal of Machine Learning and Networked Collaborative Engineering (IJMLNCE),
    ISSN 2581-3242. He is an IEEE member and belongs to Robotics and Automation Society
    (RAS), Aerospace and Electronic Systems Society (AESS), and Education Society
    (EdSoc). RAS and AESS student branch chapter advisor and student mentor at University
    Don Bosco, and is vice chair at IEEE, El Salvador Section.


    Vijender Kumar Solanki, Ph.D., is an associate professor in Computer Science &
    Engineering, CMR Institute of Technology (Autonomous), Hyderabad, TS, India. He
    has more than 10 years of academic experience in network, IoT, Big Data, Smart
    City and IT. Prior to his current role, he was associated with Apeejay Institute
    of Technology, Greater Noida, UP, KSRCE (Autonomous) Institution, Tamil Nadu,
    India and Institute of Technology & Science, Ghaziabad, UP, India. He is a member
    of ACM and IEEE.


    He has an orientation program at UGC-Academic Staff College, University of Kerala,
    Thiruvananthanthapuram, Kerala and a refresher course at the Indian Institute
    of Information Technology, Allahabad, UP, India.

    Has authored or co-authored more than 50 research articles that are published
    in various journals, books and conference proceedings. He has edited or co-edited
    14 books and conference proceedings in the area of Soft Computing.


    He received a Ph.D. in Computer Science and Engineering from Anna University,
    Chennai, India in 2017 and ME, MCA from Maharishi Dayanand University, Rohtak,
    Haryana, India in 2007 and 2004, respectively, and a B.S. from JLN Government
    College, Faridabad, India in 2001.


    He is the book series editor of the following: Internet of Eternity (IoE): Security
    and Privacy Paradigm, CRC Press, Taylor & Francis Group, USA; Artificial Intelligence
    (AI): Elementary to Advanced Practices Series, CRC Press,'
