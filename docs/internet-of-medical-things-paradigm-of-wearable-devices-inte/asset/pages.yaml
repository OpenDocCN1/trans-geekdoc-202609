    across organizations and makes them available in required format for consumers.
    In Kafka, data is stored in the form of topics which is nothing but a stream of
    messages belong together. These topics are broken down into partitions, and each
    partition contains a subset of the original topic. Creation of partitions eases
    out the processing, and a larger amount of data can be handled using this approach.
    Kafka architecture has four core APIs:


    +   **Producer API**: Producers are the publishers who send data to Kafka brokers.
    When a producer sends a message to a broker, the simply appends the data at the
    end of the partition. Producer has a choice between either to send data to partition
    of its own choice or broker append to the last partition or any default one.


    +   **Consumer API**: Consumers consume data from brokers or in simple words they
    access the data from brokers. They subscribe the topics according to their requirements
    and pull the data from brokers for further processing. Data can be easily accessed
    in Kafka cluster due to its policy of partition creation.


    +   **Stream API**: Stream API takes input from various topics, processes them
    and generates outputs to be presented to one or more topics. These APIs are useful
    if data items need to be accessed from one topic to another.


    +   **Connector API**: Connector APIs connect the topics to applications. Also,
    they identify the reusable producers and consumers who can link the topics with
    applications. These APIs are necessary from both the user as well as system point
    of view.


    Because of its rich set of features, various companies hire Kafka experts. The
    salary trends for this domain have increased significantly over the years providing
    more and opportunities in this sector as well. Figure 8.14 shows the cluster diagram
    of a Kafka ecosystem.


