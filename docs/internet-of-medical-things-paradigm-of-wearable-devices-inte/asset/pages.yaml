    applications as they are low-profile, flexible and conformal [5–7]. These properties
    of the patch antenna lead to compactness and their easy integration into the implantable
    systems, as they can be molded according to the profile of the implantable appliance.


    # 5.2.2 ELECTRONICS CIRCUITRY


    The electrical/electronic components of a wireless implant system permit the operation
    and provide the signal processing and data transmission among the base station
    and the implanted device. The battery or the power supplying unit defines the
    lifetime of the implanted device. Research has been done on various approaches
    to increase the life span of the implantable system such as internal power supplies,
    harvesting of energy, wireless power transfer, etc. [8, 9].


    # 5.2.3 BIOSENSORS AND BIO-ACTUATORS


    The biosensors and bio-actuators contained in the implantable system may vary
    depending on the application for which the the implantable device is being designed.
    This also helps in deciding the position of the implant inside the human body.
    Various monitoring sensors for monitoring different physiological parameters such
    as pH, temperature, glucose, etc., or the active systems (which monitor some parameter
    and perform some action based on their reading things like drug delivery apparatus)
    are investigated and used.


    # 5.2.4 INSULATIONS


    The wireless implantable device should be properly insulated in a biocompatible
    material to prevent any adverse reaction and rejection of the implant by the body.
    The implant should be prevented from coming in direct contact with body fluids,
    which are conductive in nature; otherwise the device may short-circuit.'
