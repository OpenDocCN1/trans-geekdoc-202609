    radiator; whereas non-conductive textile elements like fleece, felt and silk can
    be used as dielectric substrates. The relative permittivity values for these materials
    are not freely available and need to be measured. The different types of wearable
    antennas are described below.


    # 5.4.3.1 Ordinary Wearable Designs


    Conventional designs such as planar monopoles, dipoles, microstrip patches, Planar
    Inverted-F Antennas (PIFAs), etc. have been explored and used for the designing
    of wearable antennas. Due to their low cost and easy fabrication advantages, they
    are one of the preferred choices for wearable systems. The authors in [35] investigated
    PIFA Purposes. In PIFA, the folded structure is placed parallel to its ground
    surface facing towards the human body. The same design concept was exploited to
    design a wearable flexible PIFA (FlexPIFA), which can be placed on the human arm
    and controlled by a Bluetooth operated system [36]. Figure 5.10 illustrates the
    possible placement of the PIFA antenna. The following factors are considered while
    selecting a wearable antenna [37]:


    +   a. Low profile

    b. The frequency range must be 100–500 MHz

    c. Omni-directional radiation coverage with minimal or no side lobes

    d. Vertical or circular polarization

    e. Wide return loss bandwidth


