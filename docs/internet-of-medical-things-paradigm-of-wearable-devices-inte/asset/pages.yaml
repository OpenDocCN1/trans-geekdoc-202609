    Preface


    experts in the errors, failures, and violations that may exist in their devices.
    And the solution to these errors can only be offered by technology.


    Chapter 3 titled, "An Overview on Wearable Devices for Medical Applications,"
    is contributed by Meet Kumari and Meenu Gupta where they state that the world
    is facing Corona virus diseases. For this, social distancing is a major solution
    to overcome this disease, and wearable medical devices are the most attractive
    solution to help. Wearable medical devices are the building block of modern healthcare
    systems having stringent restrictions for providing lightweight healthcare facilities.
    This chapter provides an overview of the significant research done on wearable
    devices for medical applications. It categorizes the work among the different
    types of wearable devices used for medical applications, the use of the medical
    devices and different applications of wearable devices for medical applications.
    It also presents the various medical devices parameters and their requirements
    in the current scenario. The potential open challenges faced by the current wearable
    devices and its future opportunities regarding its daily usage are also explained
    in this chapter.


    It is concluded that in spite of challenges, these wearable medical devices not
    only provide the numerous applications both socially and economically for realtime
    applications, but also they will be helpful in hazardous working environments
    to ensure safety in construction processes.


    Chapter 4 titled, "Blockchain-Based IoT for Personalized Pharmaceuticals," is
    contributed by Rehab A. Ryan and Tsagakis. The chapter highlights the future healthcare
    system that will continue to have several electronic components. For example,
    using IoT could enable the health-data both—center, at the healthcare system level,
    or locally, at the patient level such as a smartphone—to be critical components
    of selecting management approaches in health-related condition. Producing medications
    and associated logistics is lagging far behind. For instance, cybersecurity and
    the needed public infrastructure are among the significant challenges. The cryptocurrency,
    the promising application of the blockchain technology, could revolutionize life
    sciences and biotechnology. The blockchain technique allows critical but lacking
    functionalities that are highly guarded and ever provides lasting information
    housing, decentralizing and enhancing transaction transparency and incentivizing
    key stakeholders. A principal application of blockchain involves fighting medications
    with a focus on cryptopharmaceuticals technology, in which medications can be
    linked to a patient-specific blockchain of individual dosage units where every
    manufactured dosage unit has a de distinctive information-rich model using a smartphone
    application to visualize blockchain at all levels. These cover producing personalized
    dosage units and patients'' views for their individual blockchain, and embedding
    products into a healthy IoT system. Such a secured blockchain of medical history
    could novel logics. Hence, electronic ledgers could discover counterfeit drugs,
    facilitate virtual trials, and promote personalized medicine.


    In Chapter 5, "Wearable/Implantable Devices for Monitoring Systems," contributed
    by Pawan Kumar and Shabana Urooj, the focus is on use of antennas of biomedical
    applications which is increasing day-by-day. The antennas are very useful in diagnosing
    and detecting various diseases without hassle. A lot of'
