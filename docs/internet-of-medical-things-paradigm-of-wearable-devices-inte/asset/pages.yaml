    # 6.6 DISCUSSION


    Physical exercise is considered a fundamental part of the different rehabilitation
    processes in order to improve patients'' quality of life. However, the intensity
    of physical exercise should be regulated. Hence, it is required to implement methods
    that allow monitoring of rehabilitation therapies because high states of fatigue
    can harm the patient'' rehabilitation and health. Taking into account the context
    of this problematic, this chapter presented some strategies used to measure fatigue
    and the most commonly used instruments. With the realization of this work, it
    was expected to demonstrate the exercise performance strategy using inertial measurement
    units. The study was made in order to illustrate that muscular fatigue can be
    measured with the inertial measurement unit, and these results help to improve
    this field. Also, it is expected that on these results, these systems will be
    potentially used in rehabilitation settings to ensure proper monitoring and success
    in the therapy.


    Throughout the development of this chapter, the importance of physical training
    and the measure of fatigue was discussed. Similarly, in order to evaluate and
    analyze fatigue, two proposed experiments based on aerobic and anaerobic exercises
    were described and deployed. Regarding the results presented in the previous section,
    there are significant findings related to exercise performance.


    In both studies, the muscular activity registered a decrease in the activation
    of electrical activity when the participants started to present fatigue. The maximum'
  merge: -1
