    | Linear actuators | Used to enable object motion in a straight line |

    | Motors | Used to rotate mechanisms or objects with high position accuracy |

    | Relays | Electromagnet actuators used to power devices |

    | Solenoids | Widely used in home appliances (locking/triggering mechanisms and
    monitoring systems) |'
