    pathologies, and injuries). For example, patients who are overweight are advised
    to train with extracoreal loads (for the musculoskeletal group) or with an ergometer
    (for the aerobic and anaerobic groups), because it is easier and safer for them
    moving their body mass [34]. Furthermore, studies have shown that better results
    are obtained when elderly patients with osteoporosis use weight-bearing in their
    therapies these types of exercises allow them to reach the highest mechanical
    load on bones [63]. In contrast, it is suggested that patients with cancer and
    average weight, perform exercise that requires to move the body weight, such as
    climbing stairs, walking on a treadmill or standing up, because these motions
    reflect the daily activities that they cannot handle [51, 65, 76].


    # 6.2.2 EXERCISE RESTRAINT


    One technique used to regulate the exercise intensity in training is the Metabolic
    Equivalent (MET). This unit represents the relationship between the rate of energy
    spent on physical activity and the rate of energy spent at rest [3]. In other
    words, it is defined as the caloric consumption of an active individual compared
    to the resting basal metabolic rate. This information is useful for prescribing
    exercise, as well to identify the functional capacity of the patient. For that,
    this method requires to estimate the amount of energy that each person uses to
    perform a specific activity. Its requirement makes it complex to estimate the
    exact MET value, because depends on the subject''s characteristics (e.g., metabolism
    and weight) and requires complex instrumentation [61]. Therefore, several studies
    have been dedicated to generalize the MET values of different activities, based
    on measurements from health study projects [6]. This generalization allows the
    clinical staff to select the activities for the training plan [4] and provides
    a practical, easy way to quantify the exercise cost. However, this way measuring
    some people have different chronic diseases or have a higher level of fitness
    than others; therefore, it does not provide a real-time patient condition [60].


    Aims to solve this, one of the most explored methods consists of estimating the
    fatigue perceived by the patient [6].


    # 6.3 FATIGUE


    Fatigue has been considered as a subjective experience. Great efforts have been
    made to conceptualize it as a subjective state of sleepiness, tiredness, or exhaustion
    of normal activity capacity [1]. Fatigue is a term used to describe a performance
    decrease with an increase in the real/perceived difficulty of a task or exercise
    [55]. The level of human fatigue is correlated with performance indicators such
    as work productivity, performance, athletic injuries, mistakes, and accidents.


    There are many different fatigue classification methods. According to duration,
    fatigue can be classified into acute and chronic fatigue. Acute fatigue results
    from short-term sleep loss or short periods of substantial physical or mental
    work. The effects of acute fatigue are of short duration and usually can be reversed
    by sleep and relaxation [43]. Chronic fatigue syndrome is a constant, severe state
    of'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 88


    # Internet of Medical Things


    tiredness that is not relieved by rest. The symptoms of chronic fatigue syndrome
    are similar to the flu, longer than 6 months, and interfere with certain activities.
    The exact cause of this syndrome is still unknown. On the other hand, fatigue
    can also be classified as mental fatigue, which refers to the cognitive or perceptual
    aspects of fatigue, and physical fatigue, which refers to the performance of the
    motor system [10].


    Muscle fatigue is a transient and recoverable reduction in the body power due
    to contractile activity. It is a symptom that makes it harder to move as normal
    [69]. It can originate from different motor pathways and is usually divided into
    central and peripheral components. Peripheral fatigue refers to exercise-induced
    processes that lead to a reduction in force production occurring at distal the
    neuromuscular junction. Central fatigue refers to more centralized processes and
    can be defined as a progressive exercise-induced voluntary activation of the muscle,
    which is not associated with the same reduction of maximum force obtained by stimulation
    [70]. Muscle fatigue is a commonly experienced phenomenon where people always
    feel tired and lack, resulting in limited performance or prolonged daily activities.
    Also, some people experience a dull aching in the muscle. It also restricts daily
    life.


    Therefore, it is essential to understand the implications and consequences of
    fatigue. For instance, it can result in the deterioration of health in the long
    term, including working-musculoskeletal disorders, chronic fatigue syndrome, and
    compromised immune function [50]. Beside, fatigue is a common symptom associated
    with a wide range of chronic diseases such as diabetes, multiple sclerosis, cardiovascular,
    Parkinson, as well as fibromyalgia symptoms [7, 12, 48].


    In this context, fatigue plays an essential role in Physical Rehabilitation (PR).
    The WHO defines PR as an active process to achieve a full recovery, or if full
    recovery is not possible, to reach optimal physical, mental, and social potential
    to integrate people appropriately into society [78]. As a comprehensive strategy,
    PR has two approaches:


    +   1. Improve cognitive aspects related to the cognition processes that include
    perception, language, and motivation.

    2. Improve physical aspects of patients such as aerobic and anaerobic capabilities,
    cardiovascular functioning, gait patterns during physical activity and muscle.


    These approaches are important to assess the patient''s long-term performance
    and achieve a full recovery and a successful rehabilitative process. Notwithstanding
    this, fatigue is prevalent worrying among people who engage in physical activities
    based on rehabilitation [9]. Hence, to quantify fatigue allows a measure of severity
    and the subsequent identification of health and safety issues, enabling the regulation
    of the intensity of the physical exercise in the rehabilitation process and its
    subjective nature [1]. Regarding the importance of fatigue monitoring, different
    strategies have been developed in order to measure fatigue perception [9]. These
    strategies include subjective scales of fatigue perception, physiological parameters,
    and exercise performance.'
