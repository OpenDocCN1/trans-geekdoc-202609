    # 2.2 USE OF ROBOTICS IN MEDICINE


    Robotics is of great utility in medicine. Its automation and high precision give
    access to areas of risk or areas where any error might be fatal. Besides offering
    an improved intervention, this technology helps with faster recovery for patients.
    Robotics does not damage the healthy tissues that are near the operation; also
    avoids unwanted movements during surgery. In addition to being present during
    an operation, a robot can also assist a patient with alternatives to a prosthesis
    or distribution of drugs; which is required most in patients who do not react
    and are in critical situations. Therefore, healthcare robotics is classified into
    three assistance stages: (a) Robotic surgery, (b) robots for rehabilitation and
    prosthesis, and (c) robots for storage and distribution of drugs.


    # 2.2.1 ROBOTIC SURGERY


    This type of robots assists performing in complex interventions with very positive
    results (e.g., [3]). These interventions might be related to accuracy or strength;
    for example, surgery in the head or the cerebral area where precision and accuracy
    play a crucial role. On the other hand, an example of strength-related intervention
    is the case of cutting a bone in a way that healthy areas do not get damaged,
    as as tissues or the rest of the bone. Robotic surgery helps to obtain wound accuracy
    in the process, decrease time of operation, decrease time of healing and therefore
    recovery time. The robot can be guided by cameras and with the appropriate information
    about the patient, it can fulfill different functions; for example, this technology
    might change according to the need, ranging from a conventional mechanical arm
    up to elements of measurement. Also, advantages of remote surgery should be underscored,
    as it allows patients to receive a better treatment when any specialist across
    the globe can assist in surgery or in offering advice.


    # 2.2.2 ROBOTS FOR REHABILATION AND PROSTHESIS


    With this type of robots, the patient obtains therapy more adapted to rehabilitation
    (e.g., [4]) because this technology helps the therapist perform the right movements
    and with the appropriate strength according to the medical prognosis. Also it
    is a very useful tool for therapists, as a major concern nowadays is studying
    in deep'
