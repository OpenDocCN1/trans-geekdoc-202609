    According to the experts, there is no adequate design for all user groups, which
    makes the development of applications important based on the characteristics of
    the target group [32]. Therefore one can find studies taking into account certain
    psychological factors of users when developing GUIs [33]. For example, if [31]
    they designed an App for children with autism with the use of touch numbers the
    objective of this App is to help children learn, recognize and perform basic mathematical
    calculations. In [34] the development of an intuitive GUI to handle the Brain-Computer
    Interface (BCI) system, looking to reach classification and Information Transfer
    Rates (ITRs) are presented. Finally, in [35] the authors developed an investigation
    of the characteristics that a UI would have, which would allow older people suffering
    from dementia to have an intuitive interaction with the performance of Daily Activity
    Living (ADLs) as, for example, the handling of a microwave oven. In this case,
    the researchers found that for older people with dementia, simple designs were
    optimal.


    In short, according to [32], some of the principles that should be taken into
    account when designing UIs are: (a) reduce the amount of available functions,
    i.e., reduce the complexity of the software, (b) design interface that allows
    to easily find tools, (c) use larger icons to show key functions, (d) avoid using
    technical terms, (e) customize font, color and size, and (f) graphic objects like
    avatars or icons.


    Finally, another feature to consider when developing an App that should be given
    to each user. This feature gives a different view to data analytics according
    to the privileges given to the user. In these cases, when the user logs in, a
    service is run to obtain the user privileges and interface components that they
    will be able to see. This type of App is known as a cross-platform application
    [36]. In some cases, the user will be able to access and edit the information,
    while in other cases the user will only have permission to consult the data.


    # 1.7 IoT IN HEALTHCARE: BENEFITS, DEVELOPMENTS AND CHALLENGES


    The IoT has undoubtedly affected the healthcare industry. Its corporation has
    brought benefits that have improved the efficiency and quality of therapies, treatments,
    and follow- ups that have positively impacted the health and lives of patients.


    # 1.7.1 BENEFITS


    Among the palpable benefits of the IoT in healthcare we can identify:


    +   1. Remote medical assistance: IoT solutions allow physicians to assist patients
    who can be remotely monitored. Physicians can talk to the patients, check their
    vital signals using specialized Apps and Internet-connected devices, diagnose
    them, and prescribe the corresponding medicines. Besides the benefits to the patient,
    remote medical assistance impacts hospital costs as well; is moving medical appointments
    from hospitals (hospital-centric) to the patients'' homes (home-centric) optimizing
    infrastructure resources.'
