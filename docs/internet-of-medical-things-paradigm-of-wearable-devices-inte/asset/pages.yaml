    # 4.4.5 CRYPTOPHARMACEUTICALS


    Applying information-rich models sterilizing every dosage unit, check after production,
    and check-out of the product while the patient is administering the prescribed
    dosage unit. Such models will allow scanning the product by a smart-link to the
    IoT and to the health system, whereas AI is adding to the management and doses
    adjustments [3, 34]. Such digital products are specific and customized for every
    patient enabling the blockchain-based health system [35] (Figure 4.1).


    Cryptophaceuticals is a blockchain principle for pharmaceutical dosage units where
    every recent ledger includes the distinctive information for a certain product,
    revealed as a hash by the producer in the check-in and by the patient in the check-out;
    hence, every ledger includes a cryptographic hash of the preceding ledger cascading
    all the ledgers in a non-modifiable manner Norfeldt proposed incorporating pharmaceutical
    products into an IoT-based health system allowing a technological framework for
    merging ML-driven diagnosis with the patient’s data, involving point-of-care sensor
    data and health records, and eventually producing a safe chain of serialized individualized
    products. Programming platforms have been used to create an open-source code with
    the freely available Android and Apple MedBlockchain application where have been
    engineered so that every screen shows four distinct user views: manufacture, patient
    monitoring, and blockchain allowing information in every workflow level according
    to whether the user is a healthcare provider, patient, health system, or producer
    of the medicinal product. However, the latest data on the influences of data breaches
    suggests that cybersecurity will be among the highly significant challenges to
    the future health system [37].


