  img_proc: true
- pgno: 104
  md: '# 6.4.1 BORG SCALE


    The Borg Rating of Perceived Exertion (RPE) scale is a tool for measuring an individual''s
    effort and exertion, breathlessness and fatigue during physical work and is highly
    relevant for occupational health and safety practice.


    The scale is a simple numerical list. It starts with "no feeling of exertion",
    which rates a 6, and ends with "very, very hard", which rates 20. The scale takes
    to complete and can be done by a researcher or self-administered and used on a
    single occasion or multiple times.


    During the activity, participants are asked to rate their exertion on the scale,
    combining all sensation and feeling of stress and fatigue. They are told to disregard
    any one factor such as leg pain or shortness of breath but to focus on the whole
    feeling of exertion. This number indicates the intensity of activity, allowing
    the participant to speed or slow down movements [74].


    Borg also developed Borg CR10, a Category-Ratio (CR) scale anchored at the number
    10, representing an extreme intensity of activity. It is a general method for
    measuring most kinds of perceptions and experiences, including pain and perceived
    exertion. Figure 6.1 illustrates the representation of the RPE and Borg CR10.


    # 6.4.2 OXYGEN UPTAKE


    The oxygen uptake ($VO_2$), normally measured in mLO$_2$/min/kg), is considered
