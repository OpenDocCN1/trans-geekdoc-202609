    # 1.7.3 CHALLENGES


    Even IoT-based technology offers a wide number of advantages, it also poses several
    challenges. Among them, it is possible to identify:


    +   1. **Data security and patient privacy:** IoT devices collect and transmit
    data both synchronously and asynchronously. Data is stored in the cloud and from
    different locations. Data are undoubtedly too many points where security could
    be compromised. In addition, nowadays there is significant ambiguity regarding
    data ownership over time and regulations are still to be defined.


    +   2. **Multiple protocols:** IoT devices are based on a number of different
    protocols such as Wi-Fi, WiMAX, ZigBee, Bluetooth and LoRaWAN, among others. A
    comprehensive survey and performance evaluation between them can be found in [59].
    The integration of multiple devices exhibiting IoT protocols makes handling difficult,
    hinders their implementation, and slows down the communication capabilities reducing
    IoT scalability in healthcare.


    +   3. **Network availability:** IoT relies on a communication network (Internet)
    to work. The availability of Internet might be evident in developed countries,
    but it might not be the case for developing economies. To successfully implement
    IoT-based healthcare solutions, both public and private sectors must invest in
    an adequate infrastructure.


    # 1.8 CONCLUSIONS


    During the years, the IoT paradigm has taken hold especially due to its characteristics
    associated with improving people''s lives, easing decision making, and reducing
    the carbon footprint, among others.


    This chapter has presented a holistic vision of the fundamentals of the IoT with
    the aim of providing a comprehensive overview to readers interested in the topic.
    The chapter has addressed the most relevant concepts involved in the IoT such
    as architectures, sensors, actuators, storage, communication protocols, and user
    interfaces. Finally, some IoT-based development applications for healthcare were
    provided. In this sense, it can be concluded that IoT can be successfully used
    in services related to patient monitoring, risky detection, telemedicine, among
    other applications.'
