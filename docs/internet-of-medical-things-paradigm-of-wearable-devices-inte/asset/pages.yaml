    # 4.7 CONCLUSIONS


    The future of managing patients requires producing personalized medications per
    incorporating the IoT with blockchain for all produced and purchased pharmaceutical
    products to a central healthcare system. Blockchain techniques have a promising
    impact on investigating a lifelong medication history, minimizing drug counterfeiting,
    and promoting affordable clinical trials leading to an innovative era of individualized
    medicine. Cryptopharmaceuticals enables information-rich models of pharmaceuticals
    to be linked in a patient-specific blockchain for dosage units where is ideal
    for integrating novel pharmaceutical products into an IoT-based health system.
    The strong blockchain of individual medicine will facilitate preventing counterfeit
    products and allow logistic interventions in the drug industry with patient engagement.
    despite the additional values that blockchain brings as safeguarding integrity
    and confidentiality there are still concerns regarding the vulnerabilities of
    blockchain and the inadequate digital literacy of the users, with incentives,
    attacks, and management issues. Cybersecurity would be among the highly significant
    challenges to the future health system.


