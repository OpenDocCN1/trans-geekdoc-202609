    section. There are numerous limitations to Big Data [25]. One research focussed
    on variety [33] as opposed to velocity and volume. Further attention has been
    given to pre-analysis and post-analysis analysis itself. Storing a large amount
    of data is a key issue in one of the studies, the authors proposed [28] different
    methods for storing Big Data that is being generated every day from various resources.
    Starting from hard drives moving up to optical drives, storage devices are insufficient
    to hold such a large amount of data. Until now, Cloud services have been used
    to cope with this situation. Also, there is a trade-off between storage and performance
    as discussed:


    # 8.1.1 TABULATING MACHINE


    Dating back to the 1800s, the tabulating machine, built by Herman Hollerith, was
    one of the first devices used for summarizing data. The machine was capable of
    reading data from punched cards and summarizing the data stored on cards. However,
    since this machine required data to be punched onto cards, only a limited number
    of people used the machine. Furthermore, since punched cards are no longer used
    to store data, these machines are obsolete.


    # 8.1.2 MANUAL ANALYSIS


    Before the advent of Hadoop and R, developers had to manually run through the
    data to find patterns and analyse the data. This process was called Manual Analysis.
    It was one of the best methods for analysing data, since it did not require any
    special software or hardware for data analysis. However, it had various shortcomings:


    +   - Firstly, the developers had to fetch data from different formats. Fetching
    data can be a very tricky task when the data is stored on different systems having
    different formats for storing data.

    - Secondly, the data could be inconsistent. It was the task of the developer to
    go through the data, and find any inconsistencies in the data.

    - Thirdly, multiple passes were required to gain full insight into the system
    which allowed the users to properly analyze data.


    # 8.1.3 MATERIAL REQUIREMENT PLANNING SYSTEM


    The Material Requirement Planning (MRP) system performed a specific task and proved
    to be very complex for a novice user to operate. These systems were designed for
    three main tasks:


    +   - To ensure proper availability of items.

    - To maintain the main list of items in the inventory.

    - To plan various activities like manufacturing, delivery and purchasing.


    Also, they required structured, accurate data to work on which can be time consuming
    to generate.'
