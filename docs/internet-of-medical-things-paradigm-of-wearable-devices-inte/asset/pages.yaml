    # 1.5 COMMUNICATION PROTOCOLS


    Communication protocols are considered the backbone of IoT-based systems, as they
    enable network connectivity and data exchange over the network. They determine
    data encoding, data exchange formats, and package routing from source to destination.
    They are also used in sequence control, flow control, and retransmission of lost
    packets [30].


    The following protocols are most commonly used in IoT:


    +   1. IEEE 802.11 – WiFi WiFi is a collection of Wireless Local Area Network
    (WLAN) communication standards: 802.11a, 802.11b, 802.11ac, and 802.11ad operating
    in the band of 2.4 to 60 GHz. They provide data exchange rates from 1 Mb/s to
    6.5 Gb/s and a communication range in order of 20 m (meter) to 100 m (meter).


    +   2. IEEE 802.16 – WiMAX: WiMAX (Worldwide Interoperability for Microwave Access)
    provides data exchange rates from 1.5 Mb/s to 1 Gb/s. It provides an average data
    rate of 100 Mb/s for mobile stations and devices over a short range (8-10 m) for
    fixed stations.


    +   3. IEEE 802.15.1 – Bluetooth: Bluetooth is a low-power, low-cost wireless
    communication technology suitable for data transmission between mobile devices
    over a short range (8-10 m). It operates in the 2.4 GHz band.


    +   4. LoRaWAN – LoRa: LoRaWAN is a newly developed long-range communication protocol.
    Its aim is to guarantee interoperability between various operators in one open
    global standard. LoRaWAN data exchange rates from 0.3 kb/s to 50 kb/s. LoRa operates
    in 868 and 900 MHz bands. LoRa is capable of communicating nodes located 30 km
    apart.


    # 1.6 USER INTERFACE PROPERTIES


    As it was previously stated, the IoT can be successfully used to manage services
    in systems of diverse areas, including functions such as: signal monitoring, remote
    device activation, problem detection, service management, and access to resources,
    among others. These functions must be available to the user to interact with the
    information and the device in an application (App) through a User Interface (UI).
    This UI must allow the user to interact with the information and the device on
    which the App is hosted. According to [31], if the UI is well designed, the user
    will be able to view and receive the information quickly and intuitively; otherwise,
    the user will be frustrated. The most used UI for development are the Graphical
    User Interfaces (GUIs).'
