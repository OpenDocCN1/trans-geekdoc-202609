    the methods for a better patient recovery rather than the correct movement of
    the affected area. On the robotic prosthesis site, science keeps advancing. There
    are available prostheses that can respond to the patient''s wills sent by the
    patient''s brain to perform a movement through the prosthesis. These signals that
    the patient sends from the brain are called myoelectric signals.


    # 2.2.3 ROBOTS FOR STORAGE AND DISTRIBUTION OF DRUGS


    Doctors in hospitals and clinics are responsible for preparing a list of drugs
    to supply to their patients (e.g., [5]). However, it is hard to keep track of
    schedules and exact doses taking into account the number of patients that are
    in a care at one time. This explains the utility of robotics because of its accuracy;
    it provides higher control of the doses and the exact hours in every patient receives
    drugs, which will obviously help in the recovery of the patient. This is also
    necessary for patients with more severe illnesses, those who need accurate control,
    and for patients who are weak or immobile.


    # 2.2.4 BENEFITS OF ROBOTS IN HEALTHCARE


    We have seen that nowadays robotics is a very important tool; therefore, I will
    list advantages that we can obtain from this technology in the healthcare industry:


    +   a. Robots deliver major safety, accuracy, and precision when performing an
    intervention in a patient.

    b. With the robotics technology, operations are shorter and recovery time is cut
    greatly because the wominus diminishes due to the efficacy of the robots in operations.

    c. It is possible to perform interventions by teleoperation (telesurgery), reducing
    travel costs, increasing efficiency and improving the quality of surgical procedures.

    d. Surgeons using robotics can perform cuts without damaging the healthy parts.

    e. Unlike human beings, robots do not show fear, weariness or fatigue; therefore,
    they can operate indefinitely and always using the best way.

    f. Remote surgery results in an assisted or advised intervention by any specialist
    around the globe.

    g. Nowadays, the loss of extremity is not a handicap unless very high quality
    robotic prostheses can be supplied.

    h. Using robots for storage and distribution of drugs, we can have much more suitable
    and exact monitoring at the time of giving the medication.


    # 2.2.5 DISADVANTAGES OF ROBOTS IN HEALTHCARE


    Currently, there are very few disadvantages of using robots in healthcare, as
    follows:


    +   a. The intervention is much more expensive with robots than the conventional
    way.'
