    # 3.4 APPLICATIONS


    The various potential applications of WHDs are shown as follows:


    +   1. **Adaptive care provisioning**: Artificial Intelligence (AI) and Machine
    Learning (ML) based healthcare applications play an important role in revolutionizing
    the healthcare system by focusing on adaptive and automatic provisioning. Intelligent
    and statistical models are developed for presenting non-linear and linear models
    for neural networks [21,38,39].

    2. **Remote healthcare monitoring**: The WHD related to health monitoring systems
    provides the feature sharing and connectivity connection with wireless devices
    technologies for various continuous and discrete event management. It includes
    various platforms such as military operations, farms, fields, theaters, etc. [4]

    3. **Stroke restoration**: This is used for video conferencing transmission of
    medical information to various remote areas, increases the effectiveness, level
    of tele-rehabilitation recognition and viability for stroke victims [21,40,41].

    4. **Wearable portal endoscopy**: This is a part of tele-healthcare and tele-monitoring
    for vital sign users in a medical market. This is imperative to send all medical
    data like physiological signals, image signals and video. It is one of the paradigms
    in the medical market that provides patients and physicians commercial capabilities
    [21,42,43].'
