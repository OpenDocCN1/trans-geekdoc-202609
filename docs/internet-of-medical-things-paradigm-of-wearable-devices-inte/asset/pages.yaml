  md: 'IoMT: Current and Future Trends


    +   - **Edges and boundaries detection.** These techniques aim at identifying
    parts of an image in which color or brightness changes sharply. For instance,
    [16] describes a method to accurately detect prostate boundaries in an ultrasound
    image.


    Below we describe other advanced techniques, which frequently rely on basic ones.


    # 2.4.3 SEGMENTATION


    This technique aims to automatically label the regions of the image to ease the
    selection of object of interest in the image (e.g., [5, 6]). See [17] for a review
    of segmentation techniques in medicine. Segmentation can be divided into:


    +   - **Region-based segmentation**, which assumes that neighboring pixels have
    similar properties, in terms of intensity, color, texture, etc. For instance,
    [18] describes a method to segment the regions corresponding to melanoma skin
    cancer.

    - **Boundary-based segmentation**, which assumes that the properties of the pixels
    change abruptly at the boundaries of the object. This corresponds to the idea
    of membrane in biology.


    # 2.4.4 3D RECONSTRUCTION AND REGISTRATION


    Modern CT techniques are able to reconstruct a 3D image from multiple sliced images.
    For instance, in diagnosis, the area affected by a tumor can be reconstructed
    in 3D to guide surgical removal.


    Registration is the process of mapping a 3D object to a set of 2D captured images.
    For instance, [19] describes a method to delineate the 3D left ventricle from
    a set of MRI images. Usually, the registration involves identifying the translations,
    rotations and scaling necessary to match the 3D identified object. A well-known
    difficulty in medicine is that the organs are not rigid, but deformable. A set
    of posed consistency methods has been developed [20].


    # 2.4.5 MEDICAL VIDEO SURVEILLANCE


    Medical video surveillance is becoming a necessary service in the safety plans
    of health centers, the decision to use video surveillance can bring controversy.
    On the one hand, it can be used to protect the patient and to protect the equipment.
    On the other hand, the privacy of the patient may be under attack. Taking into
    account during a medical consultation, privacy must be a priority and video surveillance
    must be carefully treated.


    According to European law, health centers can capture images through video to
    preserve the safety of people and property. These images must be removed within
    a maximum period of one month, unless they must be made available to a competent
    authority within a maximum period of 72 hours [7]. If the'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'images were to be sent to the competent authority, IoMT is also needed, specifically
    used motion sensors, telephone consoles, panic buttons, magnetic contacts, alarm,
    etc. [13].


    The tendency is to find a balance between compliance with legislation and the
    protection of patient privacy by suggesting mechanisms that reassure authorities,
    professionals, and patients at the same time.


    # 2.4.6 FUTURE TRENDS IN IMAGE PROCESSING


    There are several unsolved challenges in medical imaging. The first challenge
    is that 3D reconstruction is an ill-posed problem. This means that we can get
    3D reconstructions from 2D images. To manage this, the so-called regularization
    techniques aim to limit or minimize the error.


    A second challenge is the use of a medical image, not just to diagnose, but also
    to accomplish automatic/semiautomatic robotic surgery. For example, by using miniaturized
    robots that move through the veins.


    A third challenge is virtual reality simulation, which facilitates training surgeons
    before conducting real interventions.


    # 2.5 CYBERSECURITY: THE NEED FOR SECURITY IN MEDICAL SYSTEMS


    It is relatively common for healthcare centers to use a network infrastructure.
    These devices are connected in both the rooms of the hospital and the homes of
    patients. From the healthcare center itself, many profiles can be connected to
    the same network, so it is not easy to do Network Access Control (NAC), and there
    may be a vulnerability in the service.


    However, there are new generation protocols that help protect data in IoT systems;
    for example, ZigBee. ZigBee is a set of wireless communication protocols aiming
    to connect applications with a low data rate. It is especially used in Wireless
    Sensor Networks (WSNs) for healthcare using medical radio bands (ISM band) [21];
    for example, to sample and reliably monitor devices, home nursing, glucose, oxygen,
    blood pressure, etc. It also helps create information management and visualization
    indicators [22]. ZigBee is a simple, economical and energy efficient technology
    the security systems offered secure in communication, key management, and cryptography
    through three types of keys to the network (master key, link key, and network
    key). Its weaknesses are limited in resources within the network, the low calculation
    capacity and the low memory they offer [21].


    Despite the existence of protocols, security is one of the aspects that most concern
    the field of IoMT. This is because the less human interaction exists in the integration
    of the physical and digital world, the greater the efficiency, but also the greater
    vulnerability to non-compliance with protection regulations (e.g., cryptography).
    Authentication can pose an additional difficulty in the field of telemedicine.
    Another problem that the IoMT can bring with is the saturation of data stored
    in a cloud. When this occurs, data exchange is impossible without infrequent prevention
    techniques in health contexts [24].'
