    # 5.4.3 Wearable Antennas


    Wearable antennas are one of the key research areas of body-centric communications.
    These types of antennas have low cost, lightweight, have simple installation with
    almost zero maintenance. These types of antennas are useful for people of all
    ages and occupations (such as firefighters, military personnel and paramedics)
    for monitoring purposes. Fabric-based antennas are mainly utilized for wearable
    applications. In the antenna configuration, the conductive textile elements like
    Flectron, Zelt and pure taffeta fabrics can be employed as the'
