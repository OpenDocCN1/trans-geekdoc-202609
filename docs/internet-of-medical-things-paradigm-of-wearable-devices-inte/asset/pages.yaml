    # Internet of Medical Things


    # 6.5 EXPERIMENTAL STUDIES


    This section presents, in the first place, the criteria implemented for recruiting
    volunteers; subsequently, it describes the experimental studies carried out for
    fatigue estimation in aerobic and anaerobic exercises. Both exercises were implemented
    due to differences in their performance and energy generation. Aerobic exercise
    produces a continuous supply of oxygen to sustain the current activity level without
    needing additional energy from another source. Whereas, anaerobic exercise prompts
    the body to demand more energy than the aerobic system can produce [27].


    # 6.5.1 RECRUITING CRITERIA


    Each subject voluntarily agreed to participate in these experiments and signed
    the corresponding informed consent. Volunteers were selected according to the
    inclusion and exclusion criteria described below.


    **Inclusion Criteria:** Healthy adult subjects between 18 to 30 years old who
    perform regular physical activity and have no contraindications for exercise.
    Besides, the subjects did not have any prosthetics or orthosis in their upper
    or lower limbs. Volunteers with visual, auditory, or cognitive impairments that
    prevent the correct understanding of the activity were not part of this study.
    Likewise, the volunteer must not present injuries, pain, or surgeries in the knee,
    ankle, or hip. On the other hand, the volunteer must not be pregnant. Finally,
    the volunteer must not present any fatigue that may affect performance, which
    was assessed by mean of the “multidimensional fatigue inventory”, which is a 20-item
    questionnaire to estimate five different types of fatigue: general fatigue, physical
    fatigue, mental fatigue, reduced motivation, and reduced activity [64].


    # 6.5.2 AEROBIC STUDY


    An aerobic study is conducted to assess if the fatigue can be measured with wearable
    sensors such as inertial measurement units. The study was executed on a male volunteer
    with the following characteristics: age: 22 years old, weight: 76.9 kg, and height:
    1.86 cm.


    # 6.5.2.1 Experimental Aerobic Procedure


    The volunteer was first instructed to perform 10 m at a self-selected speed to
    determine their average overload speed, which successfully set on a treadmill.
    The participant was equipped with five Shimmer3 (Shimmer, Ireland) IMU units,
    which are necessary to measure the spatiotemporal and kinematic parameters. Four
    units were configured to obtain EMG signals in four muscles (tibialis anterior,
    rectus femoris, biceps femoris, and gastrocnemius) with the lateral part of the
    thigh, and two on the calves'' outer side with elastic bands. The last unit was
    configured as an inertial measurement unit with a sampling rate of 128 Hz. The
    IMU was placed instead of the participant’s dominant foot (in this case, the left
    one) with an elastic band. The experimental setup described here is illustrated
    in Figure 6.2.'
