  md: amounts of data for managing their treatment plans and analyzing recovery rates
    of their patients. To examine tumor samples, biobanks linked up with their patient
    treatment records which may consist of a large amount of data. In old times, we
    were working on much less data. As time passes, every day grows. To manage this
    data was a critical issue for industries (or companies). This data can be defined
    in any form such as a phone log book, email or any other sources. Collecting data
    is very easy, but to manage it is very difficult. Then, cloud computing came into
    the picture to store huge amounts of data on a server. But, every day we are generating
    data in gigabytes, by Big Data expands and reduces this storage problem of data
    on a server. Big Data provides a framework called “Hadoop” which helps to store
    a large amount of data on a server. Managing data at a large scale was the motivation
    behind writing this chapter. This chapter discusses the technologies used in Hadoop
    and how they are beneficial for medical healthcare system. The principal aim of
    this chapter is to make people familiar with the role of Big Data Hadoop and how
    to deal with a large amount of data related to health-care. It is very important
    to understand generated data and overcome issues of this generated data by different
    health monitoring applications. In this chapter the most used technologies are
    discussed for handling Big Data starting from the old-school methods of manual
    analysis and moving on to advanced technologies like Spark, Kafka. Some of these
    technologies like manual analysis and MRP systems have been replaced by new technologies.
    However, a plethora of technologies still exist in the market. As a result, organizations
    dealing with Big Data have to choose the right technology to use for handling
    Big Data related to the healthcare industry. The main questions that arise while
    choosing the correct platform is what the requirements of the organization are
    and what outcome they expect if they deploy a certain scheme. In addition, managers
    have to take cost and storage factors into account as well. Selecting the right
    platform is tough as well as a complicated step. Furthermore, once an organization
    commits, adopting something different is difficult as as expensive. Every major
    company and organization is using Big Data nowadays to organize large amounts
    of health-related data. The use of Big Data has grown to encompass multiple industries
    and fields. Big Data facilitates healthcare in terms of predicting well-related
    issues. After analysis of Big Data, EHRs, EMRs and other medical data is continuously
    helping build a better prognostic framework. The companies providing service for
    healthcare analytics and clinical transformation are indeed contributing towards
    a better and effective outcome.
