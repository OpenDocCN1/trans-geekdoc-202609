    results. Also, when the muscle reached a fatigued state, the muscular activity
    remained almost constant, as shown in the anaerobic study. According to the results
    illustrated in the aerobic study, the spatiotemporal parameters such as cadence
    and the duration of the gait phases (stance and swing) are affected. Generally,
    the participant'' cadence decreases when they feel exhaustion. Fatigue also generates
    an increase in gait cycle duration, and consequently, the duration of the gait
    phases increases proportionally. The participant''s fatigue was corroborated by
    the lactate that provides a direct measurement of the subject''s exertion during
    the study. This physiological parameter increased during the session. This means
    that the fatigue was progressively increased during the study, and the participant
    felt exhausted at each stage.


    Regarding the anaerobic results, the angular velocity average and the magnitude
    decreased until the 5th interval. However, after the 6th interval, parameters
    started to increase. This suggests that the participant was in the over-training
    stage; therefore, the participant changed the technical execution and also incorporated
    more muscles to keep performing the activity. However this is not recommended
    because it requires more energy, which can be reflected in the continuous increase
    of the heart rate, leading the participant to reach risky physiological conditions
    (80% of the heart rate reserve) for rehabilitation scenarios.


    These findings hold potential in monitoring the physical performance exhibited
    by the participants. Finally, one aspect worth mentioning is that in both studies
    at the end of the last test, the Borg CR10 scale increased almost to its maximum
    value. This means that the perception of the participant''s effort represented
    an extreme intensity of the activity.


    # 6.7 CONCLUSIONS


    This chapter presented the design and application of a strategy corresponding
    to exercise performance for fatigue estimation. Two experimental studies based
    on aerobic and anaerobic exercises were carried out. Each system has a distinctive
    architecture using inertial measurement. It was conducted to illustrate that muscular
    fatigue can be measured with these systems. Both systems allowed the acquisition
    of relevant data from the participants, which were processed in order to analyze
    the participant''s performance during the session.


    As initial observations, we found the importance of detecting segments to represent
    exercise intervals, for example, the walking cycle in the case of aerobic exercise
    or the interval of the cycling cycle concerning anaerobic exercise. Through these
    segments, it is possible to find the corresponding fatigue estimation parameters.
    In the same way, essential results showed how it is possible to detect different
    fatigue-related parameters as spatiotemporal and kinematic in the inertial measurement
    unit.


    Although the results presented in this chapter are promising, this research is
    still at an early stage. Thus, the findings of this work will serve as the basis
    to extend our'
