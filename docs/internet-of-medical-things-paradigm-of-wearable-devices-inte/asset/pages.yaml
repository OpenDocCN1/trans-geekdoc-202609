    # 6.4.3 HEART RATE


    The heart rate is one of the most commonly used physiological parameters to control
    fatigue, owing to its facility of measuring and the linearity that it presents
    with $VO_{2}$ [17]. In general, this methodology consists of monitoring the heart
    rate reverse, which is the difference between the Maximum Heart Rate (MHR) and
    the Resting Heart Rate (RHR) [70]. The MHR can be estimated using a stress test,
    a clinical test that assesses the body''s physiological behavior during different
    exercises [37]. Nevertheless, there are more practical ways that consider some
    subject''s characteristics (e.g., age and gender) to get an approximation. One
    of the most implemented is Tanaka''s formula that uses the subject''s age (in
    years) and is shown in Equation 6.2 [14].


    ```

    $MHR = 206.9 - (0.67 * AGE) \quad (6.2)$

    ```


    In order to show example, it is possible a 21-year-old person (MHR = 193 approximately,
    using Equation 6.2) with an HRR of 80 BPM, which means that Heart Rate Reserve
    (HRR) is equal to 113 BPM. Therefore, if the subject presents a heart rate of
    150 BPM, this represents the 62% of his HRR. This process can be seen in Equation
    6.3, where HRR% is the percentage of the subject''s HRR and the current heart
    rate value.


    ```

    $HRR\% = \frac{100}{HRR} * (HR - HRR) \quad (6.3)$

    ```


    It is considered that physical training which requires a HRR% between 60 to 80%
    is high intensity, and depending on the rehabilitation goal and the patient conditions,
    this state should be avoided [70]. The heart rate gives a direct measurement of
    the subject. However, its interpretation requires assumptions about healthy people
    and does not consider other features that could affect the heart rate (e.g., medication
    and pathologies) [14]. Hence, this method has been criticized for fatigue management
    in physical rehabilitation.


    # 6.4.4 BLOOD LACTATE LEVEL


    Lactate is a biochemical indicator of decreased organ perfusion, decreased oxygen
    delivery or extraction, and end-organ anaerobic glycolysis [33]. The glycolysis
    is the metabolic pathway that uses glucose for creating pyruvate, which can be
    used by the'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'aerobic anaerobic metabolism to create energy. When the exercise is quite intense,
    all pyruvate cannot processed by the aerobic way. Therefore, it is converted into
    lactate and accumulated in blood by the anaerobic metabolism to get more energy
    and harness the amount of pyruvate produced [33]. The blood lactate provides a
    direct measurement of the subject exertion during the exercise. Therefore, the
    lactate threshold is a useful measure of determining exercise intensity for the
    training or rehabilitation cost. However, it requires to get a blood sample and
    a specialized instrument, which is not easy to use during physical therapies [59].
    It is a parameter highly dependent on aerobic or anaerobic metabolism and the
    user''s metabolism. Hence, it is required to constantly monitorize this parameter
    to get a good interpretation [33, 59].


    **Aerobic Threshold:** The aerobic threshold is defined as the intensity at which
    the blood lactate concentration rises above levels. It is the exercise intensity
    at which aerobic energy pathways start to operate, considered to be considered
    65–85% of an individual''s maximum heart rate [27].


    **Anaerobic Threshold:** The anaerobic threshold is defined as the exercise intensity
    at which the blood lactate concentration is no longer linearly related to exercise
    intensity, but increases with both exercise intensity and duration [25].


    # 6.4.5 Surface Electromyography


    Surface Electromyography (EMG) is an ambulatory system, which consists of measuring
    the electrical activity generated during muscle contraction and relaxation [47].
    The function is to attach electrodes to the muscles in order to register electrical
    potentials [56]. These potentials are directly related to muscle strength, which
    allows to estimate the effort and evaluate the performance of the exercise [77].
    Nevertheless, the electrical signals are affected by the intensity of the skin
    and the electrodes'' location. To avoid these problems leading to low adaptability
    [13, 44].


    In recent years, different studies have estimated EMGs as a non-invasive alternative
    for estimating muscle fatigue [1, 13]. The electrical activity signal changes
    in its frequency and morphology, i.e., it presents a decrease in its amplitude
    and an increase in its [8, 11, 13].


    # 6.4.6 Motion Analysis


    The motion analysis system is based on the use of infrared cameras to estimate
    the position of reflective markers in order to segment an object or an individual,
    and measure variables such as position and orientation [58]. These systems can
    measure a large number of kinematic parameters, according to the kinematic model,
    can implement specific characteristics of each movement or exercise, which has
    led to its high applicability in these areas [29].


    Motion analysis is widely used in fatigue estimation due to its accuracy and robustness
    in the measurement of kinematic parameters. Muscular fatigue affects movement
    and gait characteristics as impaired motor control and postural instability [45].
    The aim of using these devices is to quantify and measure'
