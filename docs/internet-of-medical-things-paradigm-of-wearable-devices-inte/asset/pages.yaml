    # 1.1 INTRODUCTION


    The term Internet of Things (IoT) was used in 1999 by the British technology Kevin
    Ashton, who worked at Procter & Gamble (P&G). This new paradigm emerged as the
    solution to the lack of information P&G had in order to determine when and where
    its most popular products sold out in stores. The solution proposed by Ashton
    was to include sensors in their products so they would be able to track and count
    everything in order to greatly reduce waste, losses and overall costs. This way,
    they would be able to know when a product was out of stock [2]. However,


