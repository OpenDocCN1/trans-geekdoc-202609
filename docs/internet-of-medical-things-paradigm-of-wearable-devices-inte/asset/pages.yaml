    # 2.7 CONCLUSIONS


    In this chapter we have analyzed some of the most important subjects of the Internet
    of Medical Things (IoMT): robotics, data-driven medicine, image analysis and video
    surveillance, cybersecurity, and legislation. In these IoMT fields, we have described
    current and future trends that could be the basis of a theoretical framework for
    new research lines.


    We have described how robotics has several benefits and alternatives; it has permitted
    human beings to have many different solutions to daily problems. Robotics has
    encouraged a lot of expectations in the medical field; as we have seen, there
    are many advantages as speed, accuracy, precision and above everything, more efficient
    work to improve our health and our iterations in it. With this technology, it
    has become possible in a way that gives specialists a higher success level in
    their work. Robotics also offers patients more confidence in accepting any type
    of intervention, be it complex or very risky.


    In field of data-driven medicine, the automatic processing of massive clinical
    data allows performing large-scale simulations, predicting how diseases could
    evolve, and understanding what interventions would be effective.


    In other areas, medical imaging techniques enable the visualization of the interior
    of the human body so that the surgeon can make decisions in a non-invasive way.
    These images are also useful to educate doctors in training and open the doors
    to automatic/semiautomatic robotic surgery.


    Finally, cybersecurity and legislation probation will be one of the most important
    subjects with regard IoMT. Security and data protection in IoT in healthcare involves
    legislation, technology, and health; it would be rewarding for the three fields
    to be unified.


    The legislation is fundamental to create a preventive culture on data protection,
    but applied to technology it can bring harm to the system. Healthcare must be
    up-to-date on matters related to digital protection, and its devices must include
    resources that promote digital maturity.'
