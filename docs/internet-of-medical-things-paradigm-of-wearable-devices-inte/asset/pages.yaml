    # 6.2.1 Health-Related Physical Components


    PE in rehabilitation is focused on developing health-related physical components,
    which are the necessary body elements for having a good quality of life. These
    physical components can be classified into four individual groups (Table 6.2)
    [49]; (i) body composition concerns the distribution of different tissues in the
    body (fats, water, muscle, and bone) and it is worked with diet and exercise [49];
    (ii) musculoskeletal elements to provide the power, flexibility, resistance and
    strength of the muscles and joints, trained by performing endurance and stretching
    activities with external loads or bodyguard [71]; (iii) aerobic capability is
    related to the ability of the cardiovascular and respiratory systems to create
    energy (also known as the respiratory group), and by means of long-duration activities
    (between 20 to 60 minutes) with low intensity [72]; and (iv) anaerobic capability
    is the body''s capacity to create energy without oxygen for short-duration movements
    with high intensity [71]. It is worth mentioning that anaerobic capability was
    not an essential skill for it is essential for sudden life in the beginning. Nevertheless,
    several studies have shown that it is essential for daily life movements, and
    now its development is included in the AHA manual [21, 70, 73].


    Due to the diversity of exercises, it is possible to generate a training plan
    that adapts to the patient''s unique conditions (e.g., age, weight, medication,
