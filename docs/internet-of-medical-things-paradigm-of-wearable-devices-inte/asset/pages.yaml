- pgno: 9
  md: '# Preface


    # ix


    research has been done on the design and use of the Wireless Capsule Endoscopy
    (WCE) which gives clear high-resolution images of the internal body organs (the
    highly convoluted small intestine), which otherwise was a very difficult task
    using classic endoscopic techniques. Antennas have also played a key role in the
    treatment of diseases like cancer using hyperthermia, where the tumor cells can
    be targeted and burned. This enhances the effectiveness of other therapies like
    chemotherapy and radiotherapy which are being given to patients.


    Chapter 6, "Wearable Sensors for Monitoring Exercise and Fatigue in Rehabilitation,"
    is contributed by Maria J. Pinto-Beral, Andres Aguirre, Carlos A. Cifuentes, and
    Marcela Munera. They stress that physical exercise has become a fundamental part
    of their rehabilitation environments. It is one of the main components of improving
    mobility and decreasing mortality levels through aerobic or anaerobic exercises.
    However, the intensity of these exercises must be controlled. Overtrained patients
    with high states of fatigue can affect their rehabilitation and health. In order
    to adjust these intensities, several methods have been explored to monitor the
    patients'' fatigue to supervise exercise intensity during therapies. Nevertheless,
    these methods often need to be adapted to the environment and the patients, making
    their implementation difficult. In this context, this chapter presents the importance
    of physical exercise in rehabilitation, traditional fatigue monitoring strategies,
    and strategies for monitoring based wearable sensors with massive potential for
    estimating fatigue levels. This chapter presents two experimental studies to estimate
    performance-related fatigue in aerobic and anaerobic exercise using wearable sensors.
    The preliminary results show that the use of wearable sensors would measure and
    indicate the fatigue reflected in spatial-temporal parameters and kinematic parameters
    during the execution of aerobic and anaerobic exercises.


    Chapter 7 is titled, "Conversational Agents for Healthcare Delivery: Potential
    Solutions to the Challenges of the Pandemic," and is submitted by Laura M. Bautista,
    Marcela Munera, and Carlos A. Cifuentes. In this chapter, the authors talk about
    the Conversational Agents (CAs) for healthcare delivery which have emerged rapidly
    due to potential to improve the quality of life of the patients and the level
    of healthcare and reduce costs. As C evolved, so wearable devices, as heart rate
    monitors, smartwatches, activity monitors, and wearable sensors, have made mobile
    devices ideal for healthcare delivery, working together with CAs, up a new and
    growing world of opportunities. The possibility of innovation through the use
    of wearable devices with the intervention of CAs could allow in some cases immediate
    feedback, supplementing the shortage of staff in primary healthcare centers thereby
    reducing the burden on service providers. In this chapter, the authors present
    a review of existing systems that use wearable devices in joint work with a conversational
    agent to create a new way of healthcare delivery which can be carried out in both
    hospital and home conditions. The results of the first experiments and pilot studies
    of these systems have demonstrated their acceptance and effectiveness.


    Chapter 8 titled, "Role of Big Data in e-Healthcare Application for Managing a
    Large Amount of Data," is contributed by Meenu Gupta, Rachna Jain, Rohit Singhal
    and Jaspreet Singh. It discusses the medical researchers'' work with huge'
