  md: '# 5.4.3.2 Textile Antenna Designs


    The researchers in [38] designed a wearable textile antenna with circular polarization,
    which accounts for the mobility of the user. In circular polarization, the antenna
    radiates in all the planes from vertical to horizontal direction [39]; even, if
    the body coordination changes, the receiver antenna can obtain signals. Polymide
    spacer fabric (thickness: 6 mm, permittivity: 1.5) was used as the substrate for
    the antenna design. The radiator and the ground surface were made from the nickel-plated
    woven textile material. A similar approach was used in [40], where a textile antenna
    with circular polarization was designed to excite two orthogonally polarized modes
    in order to improve the signal reception.


    One of the most rapidly advancing areas of electromagnetic research is Electromagnetic
    Band-Gap (EBG). The use of EBG structure as the ground plane helps in the efficient
    radiation of the electric current. In [41], the researchers used this concept
    to design a dual-band wearable structure. The EBG layer on the ground surface
    improves the radiation behavior of the antenna. Antenna textile antenna was designed
    [42] for providing a short-range wireless communication between the human body
    and the PAN. The bandwidth was high relative to other classic planar feed antennas
    [43] due to the use of aperture coupled feeding. Figure 5.11 illustrates the human
    model with a wearable antenna on woven textile material.


