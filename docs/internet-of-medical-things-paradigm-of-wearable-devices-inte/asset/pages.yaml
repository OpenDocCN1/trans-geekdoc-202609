    # 5.5.2 COAGULATION THERAPY


    This therapy also involves the heating of targeted cells as heating of hepatic
    cells present in the blood clot (for the treatment of hepatocellular carcinoma).
    Coaxial slot antennas were used for heating tumor cells in the human body. In
    [54], it was shown that a microwave coaxial slot antenna can be used for hyperthermia
    therapy of interstitial as well as intracellular tumor cells. The authors in [53]
    illustrated the use of antennas in thermal therapies of neck tumors and proved
    its effectiveness using clinical studies. Previous studies have proved that the
    coaxial slot antenna can be used to guide the heating effect to burn only the
    desired cancel cells.


    # 5.6 FUTURE TRENDS


    The antenna must have sufficient bandwidth to transmit high-definition images
    and other diagnosis like pressure, temperature, oxygen concentration, pH, etc.
    The antenna must be efficient and must consume less power to extend the lifetime
    of the battery.


    The antennas for WCE should be compactly and properly encapsulated in a bio-compatible
    material to prevent any adverse effects during their use in the human body. Further
    research is needed to have more control over the movement of the endoscopic capsule,
    improving the quality and transmission speed of the captured images obtained during
    the capsule movement. Studies for the development of complex capsule containing
    tools are also required. The development of such a device will help in detecting
    and treating the diseases of the GI tract (medical robot).


    The principle of magnetic induction can be used to transmit power wirelessly for
    ingestible antennas.


    # 5.7 CONCLUSION


    The use of antennas in various biomedical applications in increasing-day-day.
    The antennas are very useful in diagnosing and detecting various diseases without
    much hassle. A lot of research has been done in the designing and use of WCE which
    give clear high-resolution images of the internal body organs (like the highly
    convoluted small intestine), which otherwise were a very difficult task using
    classic endoscopic techniques. Antennas have also played a key role in the treatment
    of diseases like cancer using hyperthermia, where the tumor cells can be targeted
    and burned. This enhances the effectiveness of other therapies like chemotherapy
    and radiotherapy which are being given to cancer patients.


