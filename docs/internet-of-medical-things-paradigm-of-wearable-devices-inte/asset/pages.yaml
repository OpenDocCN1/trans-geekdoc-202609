    # TABLE 7.1

    Criteria for Methodological Evaluation


    | Criteria | Possible Outcomes | | |

    |---|---|---||

    | Was a clear statement of the aims of the research? | 1 | 0.5 | 0 |

    | Is a qualitative methodology appropriate? | 1 | 0.5 | 0 |

    | Is the sample/population identified and appropriate? | 1 | 0.5 | 0 |

    | Is there a clear statement of findings? | 1 | 0.5 | 0 |

    | Are the results accurate? | 1 | 0.5 | 0 |


    Note: 1 stands for Yes, 0 stands for No and 0.5 for Not Applicable or Cannot Tell


    # 7.2.3 ASSESSMENT OF REVIEW QUALITY


    The quality and scope of all studied documents varies widely. Nevertheless, when
    assessing the quality of the reviews, efforts should be made to avoid the influence
    of external variables such as authors, institutional affiliations, and journal
    names, among others.


    Given the nature of this review, the existing literature suggests a quality assessment
    called Critical Appraisal Skills Programme (CASP) Systematic Review Checklist
    [1], which is ideal to assess the quality of the included documents to help ensure
    the strength of the evidence. In particular, studied publications were subject
    to five criteria, as shown in Table 7.1.


    # 7.2.4 DATA EXTRACTION


    Firstly, an initial review of the articles was conducted on the information contained
    in their titles and abstracts. Subsequently, a full reading of the text was performed
    to identify which studies were included or excluded according to the criteria
    set above. Additionally, to ensure the strength of the evidence, the documents
    were assessed using the CASP checklist. Finally, the following data were extracted
    from the documents that were included in the review: first author, year of publication,
    domain area, target population, type of conversation, methodology, duration of
    the study, measures of evaluation and conclusion. With the information extracted,
    the document began to be written, separating studies according to the scenario
    for which they were used, and highlighting those studies that involved wearable
    devices.


    # 7.3 CLASSIFICATION OF CONVERSATIONAL AGENTS FOR HEALTHCARE


    Recent advancements in natural language recognition and synthesis have resulted
    in the adoption of CoAs in different areas of our daily life, such as in science,
    commerce, and service, among others [51]. Added to this, the rising popularity
    of these'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# CAs for Healthcare Delivery: Potential Pandemic Solutions


    technologies have been facilitated by a renaissance in AI [37], the development
    of powerful supporters supporting deep learning algorithms, and technological
    advancements that make a wealth of computational knowledge available within reach.


    Currently, an emerging area where CAs have potential to help some shortages and
    unmet needs in the health sector, especially in healthcare services delivery because
    of their abilities to (i) imitate conversation with humans through natural language,
    (ii) be available any time, anywhere and (iii) provide an almost immediate response
    [26]. This field is still a nascent period of investigation, and why most studied
    documents have been published since 2005 and rarely evaluate efficacy or safety.
    Nonetheless, CAs have been used with success in industry for dissemination of
    news, offers and promotions, and in the commerce for customer service [31, 51].


    Despite the fact that the literature on CAs for healthcare services delivery is
    scarce, most of the research in this area is on education and counseling, which
    are used to support patients and clinicians in specific processes. Moreover, some
    research evaluates CAs for rehabilitation, mental health, physical training and
    palliative care, according to the amount of information found. Overall, the published
    studies show that CAs can make interaction more engaging, although many all studies
    have measured user experience by linking the level of acceptance and comfort with
    the participation of CAs. In some studies, the Likert Scale was the methodology
    to measure people''s opinions and attitudes [54]. In other cases, Acceptability
    E-Scale (AES) was used for assessing the level of acceptability of the CAs from
    patients [49]. However, regardless of the scale used, participants expressed comfort
    in interacting with CAs and were very receptive to them [57].


    Although there is a good perception of CAs, their potential largely depends on
    whether these technologies are accessible to the populations that could benefit
    from them. Therefore, most CAs rely on types of technology including Apps delivered
    via mobile device [9], web [53], or computer [16, 21]. Short Message Service (SMS)
    [50] and telephone [77]. As shown in Figure 7.2, of the technologies mentioned
