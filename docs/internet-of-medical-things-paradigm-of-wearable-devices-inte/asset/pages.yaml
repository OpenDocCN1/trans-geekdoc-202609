    return to their original sign and release the energy gained in this process. The
    gained energy emitted in the form of a nuclear magnetic resonance signal is measured
    by the receiver antenna and converted into an image for further analysis by the
    doctor.


    # 5.3.1.2 Wireless Capsule Endoscopy


    As the name suggests, the Wireless Capsule Endoscopy (WCE) demonstrates the picture
    of whole gastrointestinal (GI) tract without any cable. This technique is useful
    and finds its application in the detection of various gastrointestinal diseases
    like GI tumors, cancers, Obsc Gastrointestinal Bleeding (OGIB), Celiac disease,
    Crohn’s disease [12]. The layout of a capsule endoscopy is represented in Figure
    5.2. WCE is a miniaturized pill with a camera, battery, light source and a transmitter,
    which transmits signals to the receiver. The patient swallows the miniaturized
    capsule, which then captures and sends images as it moves through the GI tract
    due to the natural movement of the tract. After moving through the GI tract, the
    capsule will automatically come out of the patient’s body and can be used to retrieve
    and interpret the information.


    # 5.3.2 THERAPY


    # 5.3.2.1 Cancer Treatment Using Hyperthermia


    This process involves the heating of tumors, which damages the membrane of the
    tumor cells and results in the death of the cells. The schematic of local hyperthermia
    system is illustrated Figure 5.3. Firstly, the site of the tumor cells should
    be located specifically. Once the position of cancerous tissue is known, the antenna
    is used to focus electromagnetic waves on the cancerous tissue and generate heat.
    The antenna emits microwaves, which enter the cancerous cells and make the water
    molecules of the cells vibrate with high speed. Due to the vibration in water
    molecules, heat is generated owing to friction between different water molecules,
    which kills the cancerous cells. This treatment can be used along with chemotherapy
    or X-ray irradiation. The block diagram in Figure 5.4 shows the details of hyperthermia
    therapy.


    # 5.3.2.2 Coagulation Therapy


    In this approach, the antenna is positioned at the center of the cancerous tissue
    and by using the heat produced from microwave radiations, the cancerous tissues
    are destroyed. In this process, when the temperature crosses 60°C, coagulation
    happens'
