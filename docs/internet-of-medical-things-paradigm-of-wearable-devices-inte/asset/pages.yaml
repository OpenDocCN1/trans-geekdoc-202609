    updated about storing vaccines [28]. It is accompanied by a kiosk allowing practitioners
    to schedule the use of vaccines, making single vials accessible without exposing
    the whole content to environmental conditions. Overall, the Smart Fridge is an
    IoT model capable of streamlining the handling of vaccines. Secondary analysis
    of data by large-scale use of such fridges can evaluate trends regarding the compliance
    of practitioners to vaccination programs [28, 29].


    # 4.4.2 Promoting Virtual Clinical Trials


    Clinical trials, a critical issue in the drug industry, are burdensome and costly
    seeks in developing novel medicines. Rising expenses are because of the challenges
    in ending and enrolling competent individuals, organizing and controlling personalized
    procedures for many subjects over a long time, and dealing with the rising levels
    of loss-to-follow-up. Organizing procedures is costly for the demand to enroll
    individuals from definite areas, having access to special clinical trials, and
    to recruit dedicated and competent clinical personnel. The regional limits restrict
    the patterns and numbers of the trial sample [30].


    Virtual clinical trials could simplify the sample, deliver a personalized experience,
    and minimize dedicated clinical personnel. The drug industry has adopted virtual
    techniques, especially with non-interventional clinical trials, and achieved variable
    outcomes for many factors influencing accuracy, protection, and confidentiality
    of data and problems of credibility, regulated adherence, and managing consents.
    The blockchain technique combined with the IoT-integrated sensors enables adequate
    credibility, protection, and confidentiality of data as demanded by regulating
    bodies [31].


    Blockchain technologies enable an intelligent technique of contracting to guarantee
    that the participants'' consent information is recorded, electronically signed,
    and sufficiently accountable. The incentives offered to the trial individuals
    would be token-based, instead of the present-day money-based ones, for growing
    participation, enhancing adherence, and developing more personalized experience.
    Finding and enrolling the trial individuals could be considerably simplified if
    the archived clinical data were accessible via ensuring data would be safeguarded
    jeopardizing privacy and security of confidential medical data of the participants.
    Widely implementing blockchain-derived PHRs enables pharmaceutical companies to
    search the global populations to rapidly spot the proper sample of varied participants
    worldwide. Ultimately, blockchain techniques could secure patient data, vastly
    growing data worldwide, and minimize clinical trials'' load, complexity, and expenses
    [30].


    # 4.4.3 Fighting Fake Medications


    The pharmaceutical industry devotes enormous sums of money and proceeds in an
    exhausting process to manufacture and market drug products. However, the counterfeit
    drug market is growing each year worldwide and is valued in billions of dollars.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 56 Internet of Medical Things


    In rising markets, 10–30% of prescription drugs are usually fake, ranging from
    wrong constituents to wrong quantities of constituents. Antibiotics are among
    the most frequently counterfeit drugs that are purchased online [32].


    Missing transparency in the supply chain and authenticity in drug products is
    the origin of pharmaceutical fraud worldwide where the lack of transparency makes
    it challenging to identify the root of the fraud, validate authenticity or determine
    the poor players who committed the offences. Therefore, the complete operation,
    from manufacturing to quality assurance to distribution, needs to be safeguarded
    in an unbiased dataset with every cryptographically signed and coded. Blockchain
    techniques supply such potential and transparency. Hence, pharmaceutical companies
    are obviously committed to fighting fake drugs beside lives threatened by these
    and adverse reactions. In 2017, stakeholders of reputable pharmaceutical companies
    started the Mediblockchain project that tracks and traceability to members of
    the pharmaceutical supply chain. Preliminary pilots are promising and show that
    a blockchain-driven intervention would allow compliance with the Drug Supply Chain
    Security Act (DCSA) while enhancing processes and minimizing the supply of fake
    drugs [19, 27].


    # 4.4.4 Enhancing 3-D PRINTING OF MEDICATIONS


    The US Food and Drug Administration (FDA) has issued directions in 2017 using
    3-D printing for personalized medications that may be printed by non-conventional
    producers such as in a healthcare facility. The data of patients should be managed
    properly before the 3-D medication printing could turn into an effective approach
    to produce personalized medications per request [33]. Delivering medications is
    associated with the volume and quality of accessible clinical information on patients.
    On a patient, particularly organics (like epigenetics, genomics, metabolomics,
    and proteomics), the microbiome, and allergy profile, are vital to finding the
    accurate kinds and doses of medicine health data is critical as well as the likely
    results from various medicines taking into account the patient''s age, sex, race,
    among other variables. Though, now accessing special kinds of data for a certain
    patient is challenging since data is disparate among multiple health caregivers.
    Central frameworks have not yet been reliable since data house with patient records
    is an obstacle and a playground for intruders.


    A blockchain-derived PHR enhanced with the biometrics of an individual may offer
    security via a blockchain ledger for logging transactions that reduce manipulating
    data. Likewise, blockchain techniques could facilitate exchanging prospective
    data, producing valuable databases between multiple population reservoirs. Hence,
    it would be practical to apply Machine Learning (ML) and Artificial Intelligence
    (AI) techniques on the data to identify quickly the optimum kinds of medications
    and the doses of active constituents tailored as required per patient. Combining
    outcomes from ML and AI with a 3-D medication printer printing a patient''s personalized
    medication at a physician clinic, a hospital, or a pharmacy [30].'
