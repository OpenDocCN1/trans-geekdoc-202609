- pgno: 80
  md: '# 5.2.5 CHARACTERIZATION AND EXPERIMENTS


    Every component which is planned to be used in the healthcare monitoring system
    should be characterized to validate its performance and to make sure it conforms
    to all the regulations. The system is tested in vitro and on animal models (in
    vivo testing) before using in real life [10].


    # 5.2.6 HUMAN BODY


    The implantable device is fixed in the human body to monitor various physiological
    parameters. The implantable device should be designed in keeping mind the complex,
    highly lossy nature of the human body and conductive nature of fluids. Proper
    characterization of the device properties should be performed in human tissue-mimicking
    models before its actual application in a real-time environment.


    # 5.2.7 CHANNEL PROPAGATION


    Channel propagation handles the propagation of signals from the wireless implanted
    system to the receiving terminals. The receiving system processes the received
    data and extracts useful information from it.


    # 5.2.8 BASE STATION


    The base station consists of numerous sub-systems:


    +   a. A control module to drive and control the functioning of the complete system.

    b. A receiver module containing antennas to receive the signal from the implanted
    system.

    c. An internet modulator/demodulator or apparatus to collect and transfer the
    information from the data collecting system.


    # 5.3 APPLICATION OF ANTENNAS IN THE MEDICAL FIELD


    Primarily, the antennas are used in medicine for two purposes [11]: diagnostics
    and therapy.


    # 5.3.1 DIAGNOSTICS


    In diagnostics, the electromagnetic energy is transmitted and received by the
    antenna to measure various physiological parameters in the human body.


    # 5.3.1.1 Magnetic Resonance Imaging


    The antenna is a key component of various medical instruments, which are used
    for diagnosis as Magnetic Resonance Imaging (MRI). The electromagnetic field formed
    by the antennas of the MRI machine is focused on the part of the human body to
    be diagnosed. The spin of the hydrogen nuclei of the water molecules in the body
    part to be diagnosed is aligned on the application of a strong field by the MRI
    machine. Upon discontinuing the field on the body part, the hydrogen nuclei will'
