- pgno: 128
  md: 'Considering the current situation, the COVID-19 pandemic is considered as the
    most crucial global health calamity of the century and the greatest challenge
    that humankind has faced since the Second World War [15]. According to the report
    of the World Health Organization (WHO), the current outbreak of COVID-19 has affected
    over 2,164,111 people and killed more than 146,198 people in 200 countries throughout
    the world [46]. Almost all nations are struggling to stop the transmission of
    the disease through testing, treatment of patients and social isolation [15].
    These preventive measures have generated enormous health, economic and social
    challenges for the entire human population. Accordingly, at this point in time,
    is indispensable to develop alternatives as mentioned in the previous paragraph
    to resume essential activities such as those in the area of health geared towards
    monitoring of chronic patients or rehabilitation processes.


    What makes this new of healthcare delivery ideal for supporting people in some
    processes is its capacity of establishing and maintaining an empathetic relationship
    [30]. In addition, it could be available anytime, anywhere offering when it matters
    most maximizes impact [51]. However, despite the promising role it can play in
    supporting people, literature discusses how to develop and demonstrates its long-term
    effectiveness is scarce [30]. Although in most of the literature, users report
    being fully satisfied with Cas, they do not necessarily translate into improvements
    in clinical outcome (e.g., a significant reduction in a clinical measure of depression).


    This chapter is organized into five sections, addressing a systematic review of
    the medical applications in which the integration of wearable devices and Cas
    creates a new way to healthcare delivery through interactive and personalized
    support that can be carried out in both hospital and home conditions. Also, it
    provides an overview of their efficacy and related-out issues like inclusion criteria,
    exclusion criteria and data extraction in early experiments or pilot studies.


    +   Section 7.2 presents the methodology used to conduct the systematic review
    considering aspects like sources, inclusion criteria, exclusion criteria and data
    extraction.


    +   Section 7.3 presents a review of studies related to Cas for medical applications
    paying particular attention to systems that integrate wearable devices, their
    classification according to the domain area and some characteristics.


    +   Section 7.4 discusses some recommendations for future works that were identified
    based on the results of this review.


    Finally, Section 7.5 presents the conclusions reached and the challenges of the
    use of wearable devices in joint work with CAs.


    # 7.2 METHODS


    The systematic review is focused on CAs that may or not work in conjunction with
    wearable devices for medical applications, given their growing availability and
    use. Based on the literature, there is no consensus on the definitions of CAs;
    as a consequence, different names are used to call them. According to their technical
    characteristics, some examples of names are: embodied conversational agent, animated
    character, virtual avatar, and chatbot, among others. That is why, in order to
    collect as much information as possible, all types of CAs will be included, regardless'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# CAs for Healthcare Delivery: Potential Pandemic Solutions 115


    of the type of communication (verbal, non-verbal, written and visual), as long
    as the purpose is geared towards the health sector.


    Although there is no consensus in the literature on definitions of CAs, there
    is an agreement in the literature on the methodology to be followed. Based on
    the above, adequate systematic review of scientific papers should consider the
    following aspects: sources and searching, inclusion and exclusion criteria, assessment
    of review quality, and data extraction [58].


    # 7.2.1 Sources and Searching


    An electronic search was conducted in April 2020 using Scopus, Science Direct,
    IEEE, ACM PubMed databases about CAs for healthcare delivery. Search terms included
    conversational agent, virtual agent, virtual human, virtual therapist, virtual
    dialogue, relational agent, chatbot and combinations with the word healthcare.
    Similarly, the reference lists of relevant articles were taken into account to
    be searched. In addition, wildcard symbols, such as hyphens or inverted commas,
    were used to consider all possible variations of root words.


    The key terms for the literature search are clearly described below:


    > “conversational agent* OR "virtual agent* OR "virtual human* OR "virtual therapist*
    OR "virtual coaching* OR "dialogue system* OR "relational agent* OR chatbot* AND
    "healthcare*


    # 7.2.2 Inclusion and Exclusion Criteria


    The review focuses on all type of CAs that use natural or non-natural language
    input, without any restrictions, given their increasing availability and use by
    consumers, caregivers or healthcare professionals. Some examples of the types
    of CAs that are considered (but are not limited to) chatbots; that have the ability
    to engage in a short and casual conversation; embodied conversational agents,
    which involve a computer-generated character (e.g., avatar, virtual agent) simulating
    face-to-face conversation with verbal and non-verbal communication; and smart
    conversational interfaces as Apple''s Siri, Google Now, Microsoft Cortana, or
    Amazon Alexa.


    According to the foregoing, articles obtained through these searches were evaluated
    using the title and abstract. The articles were included in this systematic review
    when they met the following criteria:


    The study must be focused on CAs for healthcare delivery.

    The study must include at least an experiment, a pilot study or a trial with at
    least one group of participants.

    The study must present the methodology and report the results of quantitative
    or qualitative assessments of human interaction with the CA.


    It should be noted that there is no restriction on year of publication or language.'
