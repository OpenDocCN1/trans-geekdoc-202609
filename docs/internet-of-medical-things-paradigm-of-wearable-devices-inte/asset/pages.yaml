    communicate anxiety, very acceptable to the AES scale. The level of acceptability
    suggests, elicit trust and reduce the feeling of being judged by a human [49].
    On the other hand, the validity of the depression diagnosed by the agent in comparison
    with the diagnosis of the psychiatrist was satisfactory. Its specificity was good
    regardless of the severity of the depressive symptoms, so the agent efficiently
    identified patients and without depression.


    For the treatment of these disorders, CAs act as an indispensable friend for providing
    a self-help program until the symptoms improve. Currently, three documents have
    been found that expose the use of CAs for treating mood disorders, especially
    for anxiety, depression and PTSD. The first was proposed in 2017 by Tielman et
    al. [60] who designed a virtual agent to inform and guide patients with PTSD to
    recall their memories in a digital diary regaining a sense of control over one
    life. In that same year, Fitzpatrick et al. [21] proposed a conversational agent
    to deliver a self-help program for college students who self-identified as having
    symptoms of anxiety and depression. Later, in 2018, Shakehi et al. [56] designed
    a virtual coach to alleviate symptoms related to pain, anxiety, and depression
