    # 6.1 INTRODUCTION


    Physical exercise has become a fundamental part of different rehabilitation environments,
    as it improves patients'' quality of life [67]. In this context, rehabilitation
    seeks to improve the physical capacity of the patient through aerobic or anaerobic
    exercises. However, the intensity of these exercises must be controlled. Overtrained
    patients experience states of fatigue that can affect their rehabilitation and
    health [15]. In order to adjust these intensities, measurement of physiological
    parameters, subjective scales, and exercise performance have been implemented.
    This chapter is focused on both, the importance of physical exercise in rehabilitation
    along with the exercise restriction to avoid fatigue, and monitoring based on
    wearable sensors with huge potential for estimating fatigue levels.


    According to the American Health Association (AHA), physical exercise is one of
    the main components of improving people''s health and decreasing morbidity and
    mortality levels [30]. Physical exercise seeks to improve the person''s physical
    capacity to age, weight, and patologies. Physical exercise and physical capacity
    have become a fundamental part of different areas of rehabilitation, such as cardiac
    rehabilitation, oncological rehabilitation, and neuromuscular rehabilitation.


    Several methods have been developed to monitor the patients'' fatigue state. Fatigue
    has been generally defined as a subjective state of tiredness or exhaustion and
    the reduction of capacity for muscle to maintain the required level of strength
    during exercises [1]. Additionally, fatigue is defined as the inability of muscles
    to maintain the required level of strength without deterioration of health in
    the long term, including Work-Related Musculoskeletal Disorders (WMSDs) [10],
    chronic syndrome [5] and compromised immune function [50]. Therefore, fatigue
    is a common concern among people who participate in physical activities based
    on training or rehabilitation [1].


    The human body exhibits physical fatigue in several ways. Thus, researchers have
    developed several methods to measure fatigue [1]. Current occupational fatigue
    assessments rely on subjective measurement scales, as questionnaires and self-perceived
    exertion scales [5, 52]. However, specific fatigue symptoms vary depending on
    existing pathologies, environmental factors, and physical condition. Therefore,
    subjective measurements of fatigue often need to be adapted to the environment
    and the patient. In order to overcome these limitations, measurements of physiological
    parameters and exercise performance have been considered.


    This chapter aims to present strategies for estimating performance-related fatigue
    in aerobic and anaerobic exercises using wearable sensors. In order to do so,
    it is necessary to understand the relevance of physical exercise, as well as the
    definition and importance of fatigue and its measurement strategies. The primary
    outcomes'
  merge: -1
  img_proc: true
- pgno: 99
