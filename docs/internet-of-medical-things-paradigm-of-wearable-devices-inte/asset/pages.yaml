    # 1.4 SENSORS, ACTUATORS, AND DATA STORAGE


    IoT sensors are regular sensors with the slight difference that their output signals
    are connected to the network. A recent survey of the literature on IoT-based applications
    [29] classifies the sensors summarized in Table 1.1.


    On the other hand, IoT actuators are regular actuators with the difference that
    their input signals come from the network. Table 1.2 summarizes the type of actuators
    commonly found in IoT-based applications.


    One of the key characteristics of the IoT architecture is that the cloud server
    centralizes all data collected from the set of sensors. Therefore, it is the module
    responsible for data storage.


    There are several cloud storage providers such as Microsoft Azure, Amazon Web
    Services (AWS), and Google Cloud. Cloud storage offers the following advantages:


    +   1. Equipment cost reduction: Cloud storage allows cutting expenses related
    to hardware such as servers and hard drives.


