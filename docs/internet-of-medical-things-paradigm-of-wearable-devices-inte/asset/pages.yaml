  md: 'Most mental disorders such as schizophrenia, depression, anxiety, Post-Traumatic
    Stress Disorder (PTSD), intellectual disabilities and disorders due to abuse can
    be successfully treated; however, more than half of those affected worldwide do
    not receive treatment. In some cases, stigma and neglect prevent care and treatment
    from reaching people with mental disorders, according to the WHO [41]. For these
    cases, CAs could be the ideal tool for the support in the diagnosis or treatment
    of these conditions, becoming the best alternative to address this problem because
    they can be applied all over the world at a very low cost.


    Based on current evidence, CAs can be used for the diagnosis of mental disorders
    and the treatment of these conditions. For the first application mentioned above,
    CAs act as a support to the health professional through the identification of
    specific symptoms. As is the case of Philip et al. [49], in 2017 presented an
    Embodied Conversational Agent (ECA) to identify symptoms related to depression
    in patients. According to experts, a face-to-face interview is the gold standard
    to identify mental disorders. That is, why the researchers developed an agent
    to conduct a face-to-face interview, identify specific symptoms and depression.
