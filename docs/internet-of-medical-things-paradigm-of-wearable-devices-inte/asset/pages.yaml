    # 3.5 KEY CHALLENGES


    Successful WHD development may enable the large applications ranging from single-person
    healthcare to multiple persons. All of these applications have many security concerns
    and challenges. Here, some major concerns and challenges are discussed for the
    various WHD applications as follows [16, 48, 49]:


    +   1. Information confidentiality: In WHDs, healthcare data should be confidential.
    In current healthcare monitoring systems, various WHD forward and accumulate medical
    information to a central location. A hacker can spy on this information. This
    leads to various challenges to the affected patients, hackers may utilize the
    accumulated and sensitive medical information for illegal purposes [21, 50, 51].

    . Information integrity: The confidentiality and integrity of healthcare data
    is a major factor for the WHD transmission. Hackers can modify the medical information
    by introducing false fragments within the data and delivering it to the receiver.
    Ensuring data integrity is the prominent solution from external attacks [21, 52].

    . Information availability: In terms of WHDs, it is very important that medical
    data and system resources information be accessible to all users [21, 53].


