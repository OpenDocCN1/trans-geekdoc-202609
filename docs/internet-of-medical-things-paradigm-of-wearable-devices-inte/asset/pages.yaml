    # 2. Patient access to your data.


    As indicated in the previous section, the medical tests carried data stored in
    healthcare centers generate data stored in these centers. Although the patient
    must trust that this data cannot put at risk the rights and freedoms of patients,
    according to art. [28], in many cases patients demand access to their records,
    but there is not any available access mechanism.


    With the new legislation, interested patients must have the right to access their
    data. If possible, the controller should be able to provide remote access to a
    secure system that offers the patients concerned direct access to their personal
    data, art. 63 [28].


    # 3. Data transfer.


    Sharing data not only helps the healthcare professional but can be useful for
    the healthcare community. This occurs when the information may be relevant for
    specific issues, such as a change in the patient’s residence. The automatic transfer
    of data allows the patients not to have to request such data and healthcare services
    can interchange the medical history of patients with other centers. The patient’s
    interest is protected if there is disagreement, as indicated in art. 112 [28].


    On the other hand, sharing data can boost scientific research. If the result of
    the investigation can benefit the patient, the objective of the TFEU reserved
    for this matter must be taken into account, art. 159 [28, 31].


    # 2.6.3 FUTURE TRENDS IN LEGISLATION


    Fulfilling these requirements and creating an environment of transparency generate
    state of trust between patients and healthcare centers. The current trend in the
    treatment, transfer, and storage of data could be the creation of a tool that
    helps healthcare centers to effectively use medical devices linked to the IoMT.
