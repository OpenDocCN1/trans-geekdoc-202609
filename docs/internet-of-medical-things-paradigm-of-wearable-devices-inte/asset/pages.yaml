  md: '# Preface


    In Chapter 1, “Fundamentals and Paradigms in the Internet of Things,” contributed
    by Claudia L. Garzón-Castro and Ramiro Velázquez, they discuss new technologies
    that have permeated all activities in daily life, leading to many objects being
    connected and communicated through a network in one way or another. This connection
    of multiple components and devices through the Internet is known as the Internet
    of Things (IoT). The IoT helps to collect data from devices in real time, devices
    with backend systems, ensure interoperability and operate diverse applications.
    Like most technological advancements, the aim of IoT is to offer the user comfort
    in various areas while being time and cost effective. IoT has been used in several
    applications including, but not limited to, remote monitoring and telemetry for
    predictive maintenance. This diversity of applications has allowed the use of
    IoT in various fields of action such as environmental and urban infrastructure
    control, mass production, health, transport systems, and the energy industry,
    among others. This chapter presents a holistic vision of the fundamentals of IoT
    with the aim of providing a comprehensive overview to readers interested in the
    topic. The chapter addresses the most relevant concepts involved in IoT such as
    architectures, sensors, actuators, communication protocols, and user interfaces.
    Finally, some IoT-based applications for healthcare were provided. In this sense,
    it can be concluded that IoT can be successfully used in services associated with
    patient monitoring, risky situations detection, and telemedicine, among other
    applications.


    Chapter 2 is titled, “Internet of Medical Things: Current and Future Trends.”
    Internet of Medical Things (IoMT) establishes the necessary scenario for medical
    devices and applications to evolve through information technology. In this chapter,
    the authors, Lucia Alonso Virgen, Miguel A. Sanchez Valdes, Fernando López Hernandez,
    and J. Javier Granados, analyze the most relevant and future trends, referred
    to as IoMT. The objective of IoMT is to offer a theoretical framework that allows
    to initiate new lines of research focused on offering methods and/or carefully
    analyzing the benefits, methods of implementation and the evaluation of each one
    of the existing systems. About robotics, we have described how it has several
    benefits and alternatives; it has permitted human beings encouraged a lot of positive
    expectations in the medical field; as we have seen, there are many advantages
    such as speed, accuracy, precision and above everything else, more efficient work
    to improve our health and our iterations in it. With technology, it becomes possible
    to reach places of anatomy that are very difficult to access in a way that gives
    specialists a higher success level in their work; the technology also offers deeper
    confidence in accepting any type of intervention de be complex or very risky.
    IoMT is still learning from its experience, but it is going in the right direction
    and will be able to contribute to the existence of a social context in which there
    is no lack of security. It is mutually beneficial to have health and technology
    working together, because the workers of the medical service field are the main'
