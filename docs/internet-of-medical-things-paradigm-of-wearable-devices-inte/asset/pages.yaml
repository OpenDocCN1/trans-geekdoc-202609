  md: '# 156


    # Internet of Medical Things


    There are four major components shown in this diagram:


    +   - **Brokers**: These are the load balancers of a Kafka cluster. There are
    multiple brokers inside a cluster to handle large amounts of data. Each broker
    can handle thousands of reads and writes per second which in turn contain terabytes
    of messages without any impact on performance. They are stateless and a leader
    is selected among all the brokers by ZooKeeper.

    - **ZooKeepers**: These are the managers of all the brokers present in the system.
    They provide information to producers and consumers if any new broker is added
    in the system or when there is failure of any present broker. All broker activities
    are coordinated by ZooKeeper. Depending upon the information provided by ZooKeeper
    to consumers and producers, necessary action is taken by them, whether to work
    with a new broker or any other thing.

    - **Producers**: As the data arrives to a Kafka cluster, producers seamlessly
    push the data to brokers irrespective of any acknowledgement. New data is appended
    at the end of brokers. From there on, processing of data takes place.

    - **Consumers**: Data stored inside brokers are used by consumers. They issue
    pull requests of push requests made by producers. Every partition has offset value
    attached to itself. An asynchronous request is made deciding how many bytes of
    data it has to consume according to requirement. ZooKeeper also plays an important
    role of notifying the consumer offset value. It totally depends on the consumer
    how many topics it has to subscribe, which message to be skipped, which to be
    escaped and many more.


    Offset values of a message are maintained by ZooKeeper. After the producer pushes
    the data into cluster, an offset value is assigned to every message by ZooKeeper.
    The Consumer issues the pull request to ZooKeeper, accesses the data, processes
    it and sends an acknowledgement to ZooKeeper after completion of task. Upon receiving
    the acknowledgement, the offset values of the accessed messages are updated with
    the new values. ZooKeeper can be thought of as a synchronization mechanism between
    consumers and brokers to provide smooth functionality across the system. In case
    of system failure, a new leader among all the brokers needs to be selected which
    is done by the ZooKeeper. From time to time, the ZooKeeper replicates the data
    stored inside Kafka brokers to handle the system failure which in turn is one
    of the major strengths of Kafka. Kafka can be set up in two configurations depending
    upon requirements. One is a single broker cluster and the other is a multi-broker
    cluster


    Figure 8.15 shows the setup of Apache Kafka with single node-broker and single
    ZooKeeper configuration. There are multiple producers and consumers present in
    the system. Figure 8.16 shows an overview of a Kafka system with single-multiple
    brokers and single ZooKeeper configuration. Here also there are multiple producers
    and consumers. Four major benefits of Kafka are Scalability, Reliability, Durability,
    and Performance.'
