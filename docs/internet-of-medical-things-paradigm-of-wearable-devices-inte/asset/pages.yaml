- pgno: 16
  md: '# Internet of Medical Things


    it was not until 2009 that this paradigm took off, turning into the third revolutionary
    wave in computing technology after the personal computer and Internet [3]. This
    was accomplished because the IoT has the capability to collect, analyze, and dispense
    data that we can transform into information and knowledge [4].


    In the literature, there are many definitions for the Internet of Things also
    known as the Internet of Objects [5–10] or Web 3.0 [11]. In general, it can be
    said that the IoT aims for world where everything, including houses, home appliances,
    urban furniture and industrial machinery are connected to the Internet at any
    time and place, creating real-time data that facilitates decision making, offering
    the user comfort while saving time and money.


    Because of the attributes that IoT has, in 2008, the US National Intelligence
    Council (NIC) included the IoT in its list of “Disruptive Civil Technologies”
    with potential impacts on US national power. In their report, the NIC says by
    2025, everyday objects like food containers could be nodes on the Internet. Furthermore,
    the NIC highlighted that the IoT could play a key role in the economic development
    and military capability of the United States of America. However, the NIC also
    mentioned that there will be security risks when people gain the ability to control,
    locate and monitor their devices remotely [12].


    The emergence of the IoT is an evolutionary result of a series of technologies
    like wireless sensor networks (WSNs), actuators, network communication and protocols
    [13, 14], storage and computing tools for data analysis and visualization tools
    which can be widely accessed on different platforms [11]. The IoT sets a significative
    interaction between people, machines and smart devices connecting to the quality
    of life, helping people make decisions and grow the world economy [13, 15]. In
    addition, the IoT is characterized by helping to reduce the carbon footprint.
    Without doubt, the paradigm has made a significant impact from the domestic field.
    This has allowed the range of IoT applications to include a wide spectrum of real-world
    applications as healthcare, agriculture, process management, mass production,
    environmental and urban infrastructure, intelligent transportation and logistics
    systems, the energy industry, and security and surveillance, among others [7,
    14–17]. All of these fields of action, it should be noted that the IoT is making
    a real difference in the healthcare sector.


    This chapter presents the fundamentals of the IoT. The rest of the chapter is
    organized as follows: Section 1.2 addresses the most relevant characteristics
    of the IoT. Section 1.3 oversees the layers of the three most popular architectures
    in IoT. In Section 1.4, the sensors, actuators, and storage used IoT-based applications
    are described. The most commonly used communication protocols for the IoT are
    given in Section 1.5. Section 1.6 points to the characteristics that should be
    taken into account for the development of user interfaces. Section 1.7 presents
    the benefits, some example applications, and challenges of the IoT in the healthcare
    industry. Finally, the conclusions are given in Section 1.8.


