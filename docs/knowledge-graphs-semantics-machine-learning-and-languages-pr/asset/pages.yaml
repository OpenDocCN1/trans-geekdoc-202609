    RQ2 raises the question what an appropriate dual-entity query dataset for pathfinding
    in Wikidata is. Considering the long-term goal of applying the algorithm for the
    knowledge panel generation in web search engines, such a query dataset has to
    be realistic in the sense that the queries have to be derived from queries issued
    to web search engines by actual users. However, no such query dataset (or benchmark)
    has been proposed so far.


    In information retrieval research, the TREC [21] datasets are particularly popular
    and have been used for the evaluation of various information retrieval systems.
    The datasets are designed to enable researchers to evaluate the performance of
    their information retrieval systems using a common set of test collections. TREC
    has produced many different datasets over the years, covering a range of domains
    and types of text. At first glance, the datasets from the Entity Track14 of TREC
    2009, 2010, and 2011 appear to be useful for deriving a dual-entity query dataset
    for pathfinding in Wikidata because they include collections of entities for the
    evaluation of entity-oriented search systems. However, the derivation of a dual-entity
    query dataset from these datasets would require the artificial pair-wise combination
    of the single entities within the collections, which clearly contradicts the realism
    requirement. Furthermore, the TREC datasets only provide ClueWeb0915 IRIs as identifiers
    for the entities, which would have to be expensively linked to Wikidata entities
    first.


    Hence, another approach was pursued. The dataset from the Million Query Track16
    of TREC 2007 consists of 10,000 realistic textual queries for web search engines.
    Using this as a starting point, the following procedure was applied to each query
    of the TREC dataset to derive a dual-entity query dataset for pathfinding in Wikidata:'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   1. GENRE¹⁷ [22], a state-of-the-art Wikidata entity linker, is employed
    to look for Wikidata entities in the query. If two or more entities are recognized,
    the next step is taken. Otherwise, the query is dropped.

    +   2. Since GENRE only provides the entity labels and not the necessary entity
    IDs, Wikidata is queried using SPARQL to retrieve them. To minimize incorrect
    matches¹⁸, only entities with the exact labels are retained. If two or more entities
    are identified, the next step is taken. Otherwise, the query is dropped.

    +   3. Finally, $\frac{n(n-1)}{2}$ pairs of entities are composed, where $n$ is
    the number of recognized and successfully identified entities. The two IDs of
    each entity pair represent one dual-entity query, which is finally stored.


    As an example, consider the query *children books on the effect of music on plants*
    with number 4480 from the TREC dataset. In the first step, GENRE recognizes three
    entities within this query, namely entities with the labels *book*, *music*, and
    *plant*. Querying Wikidata in the second step identifies the entities as Q571,
    Q638, and Q756, which are reasonable matches¹⁹. In the final step, $\frac{3(3-1)}{2}=3$
    dual-entity queries are composed, namely ⟨Q571, Q638⟩, ⟨Q571, Q756⟩, and finally
    ⟨Q638, Q756⟩. Note how the queries correctly reflect the order of occurrence of
    the entities in the original TREC query. In total, 1,196 dual-entity queries are
    derived using this procedure²⁰.


    # 3.3. Optimization of the Hyperparameters α, β, and γ


    The dual-entity query dataset not only allows for a proper evaluation of the pathfinding
    algorithm but also the optimization of its hyperparameters. For the reasons explained
    in Section 2, the Simple optimizer is leveraged to find an optimized hyperparameter
    configuration for the pathfinding algorithm, which represents the answer to RQ3.
    For this purpose, the optimizer requires an objective function that accepts a
    hyperparameter configuration and returns some objective value to assess the performance
    of this configuration. Depending on the use case, the optimizer’s task is then
    to either minimize or maximize the objective value by testing different configurations.


    Given the web search engine context, the goal is to find paths between entities
    in Wikidata fast, i.e., with few visited entities, such that the result can be
    displayed quickly. Hence, the number of visited entities is chosen as the objective
    value to be minimized. To account for the low-latency requirement of web search
    engines, the entity limit is set to 100. Furthermore, the pathfinding algorithm
    must be able to reliably find paths for unseen dual-entity queries because users
    are allowed to enter arbitrary queries. To evaluate this ability, the optimization
    operates on only 20% or 239 of the dual-entity queries while the remaining 80%
    or 957 queries serve as the test set for the evaluation in Section 5. Since the
    queries within the TREC 2007 Million Query Track dataset are ordered arbitrarily,
    the first 239 dual-entity queries are sampled for the optimization.'
