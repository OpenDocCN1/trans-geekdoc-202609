- pgno: 197
  md: '# Algorithm 1 DiscoverLinksAreaBased(Gₛ, Gₜ, r)


    ```

    1: Input: Source KG Gₛ, Target KG Gₜ, Topological relation r

    2: Output: Mapping : M = {(s,r,t) | s ∈ Gₛ, t ∈ Gₜ}

    3: tree ← buildRtree(Gₛ)

    4: Initialise M ← {}

    5: for each MBB(t) t ∈ Gₜ do

    6:   I ← queryRtree(tree, t)

    7:   if r is disjoint then

    8:     Add all pairs(s,r,t) ∀ s ∈ (Gₛ \ I) to M

    9:   end if

    10: for each MBB(s) s ∈ I do

    11:   X ← Fₐ(MBB(s),MBB(t))

    12:   Y ← Fₐ(MBB(t),MBB(s))

    13:   Z ← X + Y

    14:   if X,Y,Z match the respective values of the relation r in Table 1 then

    15:     Add (s,r,t) to M

    16:   end if

    17: end for

    18: end for

    19: return M

    ```


    # Algorithm 2 MatchTrees(sourceTree, targetTree)


    ```

    1: Result ← {}

    2: if area(sourceTree) < area(targetTree) then

    3:   swap sourceTree and targetTree

    4: end if

    5: for each child of sourceTree do

    6:   if child is leaf then

    7:     Result = Result ∪ queryRtree(targetTree, MBB(child))

    8:   else

    9:     Result = Result ∪ MatchTrees(child, targetTree)

    10:  end if

    11: end for

    12: return Result

    ```


    # Indexing both Datasets.


    In many cases swapping the source and target datasets results in different runtimes.
    In order to reduce the impact of dataset ordering on the runtime, we study the
    possibility of indexing both datasets instead of one. Instead of querying the
    R-tree for each target geometry, we use Algorithm 2 to match two R-trees to each
    other and recursively find all pairs that intersect. This approach removes the
    need to choose which dataset to index but comes with the price of increasing the
    memory footprint of our approach as we have to keep both datasets in memory.


