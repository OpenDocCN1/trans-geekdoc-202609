  md: '# # Native Execution of GraphQL Queries

    ## over RDF Graphs Using Multi-Way Joins


    Nikolaos KARALIS a,¹, Alexander BIGERL a and Axel-Cyrille NGONGA NGOMO a


    a DICE group, Department of Computer Science, Paderborn University


    ORCiD ID: Nikolaos Karalis https://orcid.org/0000-0002-0710-7180, Alexander Bigerl
    https://orcid.org/0000-0002-9617-1466, Axel-Cyrille Ngonga Ngomo https://orcid.org/0000-0001-7112-3516


    **Abstract.** *Purpose:* The query language GraphQL has gained significant traction
    in recent years. In particular, it has recently gained the attention of the semantic
    web and graph database communities and is now often used as a means to query knowledge
    graphs. Most of the storage solutions that support GraphQL rely on a translation
    layer to map the said language to another query language that they support natively,
    for example SPARQL. *Methodology:* Our main innovation is a multi-way left-join
    algorithm inspired by worst-case optimal multi-way join algorithms. This novel
    algorithm enables the native execution of GraphQL queries over RDF knowledge graphs.
    We evaluate our approach in two settings using the LinGBM benchmark generator.
    *Findings:* The experimental results suggest that our solution outperforms the
    state-of-the-art graph storage solution for GraphQL with respect to both query
    runtimes and scalability. *Value:* Our solution is implemented in an open-sourced
    triple store, and is intended to advance the development of representation-agnostic
    storage solutions for knowledge graphs.


    **Keywords.** graphql, knowledge graphs, multi-way joins


    # ## 1. Introduction


    Knowledge graphs serve as the data backbone of an increasing number of applications.
    Examples of such applications include search engines, recommendation systems,
    and question answering systems [1,2]. Consequently, efficient storage and querying
    solutions for knowledge graphs are imperative. Many triple stores [3,4,5,6,7,8,9,10]
    and graph databases [11,12] have hence been developed in recent decades. Used
    primarily by the semantic web community, triple stores process RDF knowledge graphs.
    A popular representation model among the graph database community is the property
    graph model [2,13]. While SPARQL is the designated query language for RDF, multiple
    languages have been developed to query property graphs (e.g., Cypher [14] and
    Gremlin [15]). Re-'
  merge: -1
