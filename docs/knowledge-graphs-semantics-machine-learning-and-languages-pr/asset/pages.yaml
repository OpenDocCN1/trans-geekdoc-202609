  md: '# Classification of Linking Problem Types

    for Linking Semantic Data


    Raphaël CONDE SALAZAR a,¹, Clément JONQUET a,b and Danai SYMEONIDOU a


    a MISTEA, University of Montpellier, INRAE & Institut Agro, France

    b LIRMM, University of Montpellier & CNRS, France


    ORCiD ID: Raphael Conde Salazar https://orcid.org/0000-0002-6926-5299, Clément
    Jonquet https://orcid.org/0000-0002-2404-1582, Danai Symeonidou https://orcid.org/0000-0003-1152-5200


    **Abstract.** As the number of RDF datasets published on the semantic web continues
    to grow, it becomes increasingly important to efficiently link similar entities
    between these datasets. However, the performance of existing data linking tools,
    often developed for general purposes, seems to have reached a plateau, suggesting
    the need for more modular and efficient solutions. In this paper, we propose—and
    formalize in OWL—a classification of different Linking Problem Types (LPTs) to
    help the linked data community identify upstream the problems and develop more
    efficient solutions. Our classification is based on the description of heterogeneity
    reported in the literature—especially five articles—and identifies five main types
    of linking problems: predicate value problems, predicate problems, class problems,
    subgraph problems, and graph problems. By classifying LPTs, we provide a framework
    for understanding and addressing the challenges associated with semantic data
    linking. It can be used to develop new solutions based on existing modularized
    tools addressing specific LPTs, thus improving the overall efficiency of data
    linking.


    **Keywords.** Data linking, Semantic web, Linking Problem Types, Classification


    # 1. Introduction


    For more than twenty years, important work has been going on for the development
    of the semantic web [1] with the aim of sharing data online and facilitating access
    by machines to human knowledge. In this approach, Linked Open Data (LOD) promotes
    the sharing and reuse of royalty-free datasets, based on the semantic web model
    and tools, such as the RDF and OWL representation languages. But while the number
    of datasets available as LOD is increasing every year, a new challenge must be
    met: data linking. Indeed, in order to maximize the knowledge from a resource,
    agents browsing these datasets must be able to link two resources designating
    the same thing but identified by distinct identifiers (URIs) within each of datasets.
    For example, a prominent actor might venture into politics, resulting in their
    inclusion and description within separate knowledge bases for cinema and politics.
    In order to write his biography, the two URIs, generally distinct, which identify
    this same person must be linked-back by an equivalence link such as the semantic
    relation `owl:sameAs` whose uses are described in [2,3,4,5].'
