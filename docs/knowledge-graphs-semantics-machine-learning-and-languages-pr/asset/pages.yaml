- pgno: 37
  md: 'have employed deep neural networks and language generation techniques to achieve
    this goal, often using a sequence-to-sequence (Seq2Seq) architecture with an attention
    mechanism or transformers. These methods can generate summaries that are more
    expressive and natural than extractive summaries, which simply select sentences
    from the original document. For example, See et al. [16] proposed the pointer-generator
    network, which combines the ability to generate new words with the ability to
    copy words from the input text. This hybrid approach allows for the generation
    of more fluent and accurate summaries as demonstrated by the evaluation results
    on the CNN/Daily Mail dataset, where it outperformed several baselines. Another
    example is the fine-tuning of pre-trained language models on large-scale summarization
    datasets, which can lead to substantial improvements in abstractive summarization
    and generate higher-quality summaries [17]. Pre-trained language models such as
    T5, BART, and GPT-2 have also achieved outstanding performance in generating high-quality
    summaries in terms of relevance, fluency, and semantic accuracy [18] Motivated
    by this success, we propose our approach for employing pre-trained language models
    to produce abstractive summaries of DBPEDIA abstracts. To the best of our knowledge,
    this is the first study to apply language models to this task. The existing method
    for creating summaries of DBPEDIA abstracts (i.e., short abstracts) simply selects
    the first few sentences from each entity’s description.


    # Evaluating LLM-generated summaries.


    Evaluating the quality of generated summaries by large language models is a challenging
    task [19]. One approach is to use manual evaluation, where human experts are asked
    to grade the summaries based on their understanding and perception of the content
    [20]. For example, Iskender et al. [21] compared crowdsourcing ratings with expert
    ratings and automatic metrics such as ROUGE, BLEU, or BERTScore on a German summarization
    dataset. They found that crowdsourcing can be used as a direct substitute for
    experts when measuring structure and coherence, but should be considered carefully
    when judging overall quality, grammaticality, clarity, and summary informativeness.
    On the other hand, researchers have proposed self-evaluation methods such as BERTScore
    [22] and Self-ROUGE [23, 24] that compare the quality of generated summaries with
    respect to the original text. Specifically, the BERTScore metric measures the
    semantic similarity between a generated summary and its corresponding original
    text using cosine distance between their contextualized BERT embeddings [22].
    For instance, Koroteev [25] demonstrated the use of semantic text-similarity metrics
    for evaluating the quality of abstractive summaries in Russian. The author argues
    that semantic text-similarity metrics are a valuable tool for a variety of natural
    language processing (NLP) tasks, such as machine translation, information retrieval,
    and text summarization. Due to the lack of gold-standard summaries for DBPEDIA
    abstracts, we follow the evaluation methods used by previous works [22, 23, 26]
    that employed BERTScore and Self-ROUGE as well as crowdsourcing evaluation to
    assess the quality of the generated summaries in our experiments. We provide more
    details about these evaluation metrics in Section 4.3.


    # 3. Approach


    This section explains the preprocessing steps for the input data (DBPEDIA abstracts),
    followed by the description of the pre-trained models used in our study. Figure
    2 depicts the complete pipeline of our approach, which generates abstractive summaries
    for DBPEDIA abstracts.'
  merge: -1
  img_proc: true
