- pgno: 36
  md: 'input. This allows the T5 model to be used across various tasks (e.g., text
    summarization, question answering, machine translation). To ensure the accessibility
    and affordability of our summarization approach, we chose these open-source models
    (BART and T5) over commercial models (e.g., GPT-3, GPT-4) which require API subscriptions
    (e.g., OpenAI API) or large computational resources. Moreover, open-source models
    offer high adaptability and can be readily fine-tuned on domain-specific datasets
    with minimal effort. Furthermore, previous studies have demonstrated that both
    BART and T5 can generate summaries of comparable quality to those produced by
    smaller GPT-3 models [9–11].


    We performed several experiments to identify the most suitable pre-trained LLM
    for generating abstractive summaries of DBPEDIA abstracts in six languages. We
    used DBPEDIA abstracts in English, German, French, Italian, Spanish, and Dutch
    as our evaluation dataset and produced summaries using various LLMs. We then evaluated
    the quality of the LLMs-generated summaries against the existing shortened abstracts
    using both human judgments and automated metrics. Furthermore, we investigated
    the correlation between the automated metrics and human assessments of the summaries’
    quality. Our evaluation results indicated that LLMs are effective tools for creating
    informative summaries for DBPEDIA abstracts. However, the choice of LLMs should
    be adapted to the specific language. We summarize the main contributions of our
    study as follows:


    +   - To the best of our knowledge, this is the first study to leverage LLMs to
    generate abstractive summaries of DBPEDIA abstracts compared to the existing method
    that automatically selects the first few sentences from the full abstracts.

    +   - We compared the performance of different LLMs for generating abstractive
    summaries in six languages (English, German, French, Italian, Spanish, and Dutch)
    using human and automated evaluation metrics

    +   - We analyzed the correlation between the automated metrics (BERTScore and
    self-ROUGE) and the human judgments of the quality of generated summaries.

    +   - We provide a resource of abstractive summaries of all DBPEDIA abstracts
    (v2022) in English and German.⁵


    # 2. Related Works


    **_LLMs for abstractive summarization._** Recent years have witnessed a growing
    interest in summarizing descriptions of real-world entities in knowledge graphs
    [12, 13]. This task, known as text summarization, requires selecting the most
    essential and salient concepts, entities, and relationships from the knowledge
    graph, and generating a brief and coherent summary of them. Text summarization
    can generally be divided into two categories: i) *extractive summarization* [14],
    which involves selecting the most salient and informative sentences from a document
    to create a summary, and ii) *abstractive summarization* [15], which involves
    generating a new summary that conveys the main ideas of the original document,
    potentially using new phrases and sentences that were not present in the original
    text. Our study focuses on the latter for generating abstractive summaries of
    DBPEDIA abstracts.


    Abstractive summarization is a text-generation process that aims to produce summaries
    that are fluent and coherent, as well as informative and concise. Previous works'
