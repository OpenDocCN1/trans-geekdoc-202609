  md: '# 5.3. Automated and Human evaluation results correlation


    To answer Q₂, we measured the correlation between the scores of automatic metrics
    and human judgments using two non-parametric rank correlation coefficients: Spearman’s
    rank and Kendall’s rank. Specifically, Spearman’s rank correlation coefficient,
    denoted by Spearman’s ρ, assesses the linear association between two variables
    based on their ranks [38]. Similarly, Kendall rank correlation coefficient, denoted
    by Kendall’s τ, evaluates the degree of agreement between two ranked variables
    [39]. We computed both coefficients for the single document task [40] and plotted
    them in Figure 7. These measures do not require any assumptions about the distribution
    of the variables or their joint distribution. Our correlation analysis indicates
    that BERTScore has the strongest relationship with human ratings of informativeness,
    with Spearman and Kendall coefficients of ρ ≤ 0.61 and τ ≤ 0.49, respectively.
    Furthermore, ROUGE-1 has the highest correlation with human assessment of coherence,
    with Spearman and Kendall coefficients of ρ ≤ 0.31 and τ ≤ 0.25, respectively.
    We also observe that conciseness has a negative correlation with human evaluation
    in all cases, with Spearman and Kendall coefficients of ρ ≥ −0.62 and τ ≥ −0.52,
    while fluency has a negligible correlation with values close to 0. Therefore,
    BERTScore is a recommended measure to assess the informativeness of generated
    summaries, while ROUGE-1 can effectively capture the coherence dimension. However,
    automatic and human scores for conciseness were negatively correlated, suggesting
    a potential direction for exploring this relationship in future work. Additionally,
    none of the metrics showed a strong correlation with human judgments of fluency,
    implying an open challenge.


    # 5.4. Supplemental Material Statement.


    Our implementation is open source and can be accessed on the GitHub project.⁸
    We used the transformer library v4.25.1 from the Huggingface hub to implement
    our approach. We recommend following the official guideline⁹ for setting up and
    loading the pre-trained language models (BART, BART_large-CNN and T5).


    # 6. Conclusion


    In this study, we explored using different language models for generating abstractive
    summaries of DBPEDIA abstracts. We observed that the existing shortened abstracts
    of DBPEDIA, which are obtained by truncating the full abstracts (i.e., selecting
    the first two-three sentences), may not cover all the relevant information. To
    overcome this limitation, we propose an abstractive summarization approach based
    on pre-trained language models such as BART and T5. We conducted various experiments
    on a multilingual dataset of DBPEDIA abstracts in six languages (English, Spanish,
    German, French, Italian, and Dutch). We employed automated metrics (Self-ROUGE,
    BERTScore) and human evaluation to investigate the best model for each language.
    Our results demonstrate that pre-trained language models can generate informative
    and concise summaries of DBPEDIA abstracts. However, selecting the most suitable
    model for each language is'
