  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_219_0.png)


    Figure 7. Part of the classification of LPTs: Predicate value problems.


    At the level of granularity, we notice that the final levels of the classification
    are only described by a few authors. For example, only Bergman describes in detail
    the heterogeneities associated with terminological synonymy, homonymy and acronymy.


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_219_1.png)


    Figure 8. Part of the classification of LPTs: Predicate problems.


    # 5.1.3. Class problems


    Class problems can be divided into class terminological problems on one side and
    specialization/generalization on the other (see Fig. 9). We find a clustering
    around terminological problemes, which seems normal, if one consider it is a special
    case of a predicate value problem. Another grouping appears around the specialization/generalization
    problem more specific to the class domain reported by Klein [21], Bergman [22]
    and Achichi et al. [25].


    For LPT 3.1.4 an example would be, a dataset pair in which there are variations
    in names for the same concept (e.g., Paper on one side and Article on the other).
    A example for LPT 3.2 would be, a dataset pair in which more general or specific
    concept are ised (e.g., Phone on one side and HomePhone or Smartphone on the other).'
