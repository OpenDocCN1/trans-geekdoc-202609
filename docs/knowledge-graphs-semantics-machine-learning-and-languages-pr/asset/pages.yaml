- pgno: 66
  md: '# 5. Conclusions


    KGQA systems provide access to knowledge graph information through natural language.
    However, the number of unique natural languages is not comparable to the number
    of languages covered by existing KGQA systems. This paper addresses the problem
    of providing multilingual tools to develop KGQA systems to increase the number
    of languages these systems cover. We focus on Spanish, a language spoken by more
    than 450 million people worldwide.


    Following a three-fold approach, we performed a qualitative analysis of the Spanish
    translations presented in QALD-9 and found that only 30.65% of the Spanish translations
    in QALD-9 properly represent the English questions. Then, we manually generate
    new translations for the questions that presented translation issues and review
    them manually with the help of native speakers. We integrate QALD-9-ES with QALD-9-plus,
    a QALD-9-based dataset made exclusively with native translations, so there is
    a complete source of high-quality translations for QALD-9 that can be used for
    the development of new datasets and KGQA systems.


    We compared the QALD-9-ES Spanish translations with the original translation included
    in QALD-9 using language-agnostic quantitative text analysis measures to confirm
    that the new translations use more words, each word is longer, and there are more
    meaningful words in each translation. The only downside is that there are fewer
    unique words. After some review, we hypothesize that this result is because the
    original QALD-9 translations often included unrelated words in the translations
    and several accentuation mistakes that are taken as unique words.


    Using the GERBIL QA framework, we also evaluate both datasets, i.e., QALD-9-ES
    vs QALD-9. We use the QAnswer annotator for Wikidata (the only annotator working
    in Spanish KGQA at the time of evaluation). The experiment results show minor
    improvements in the QA results. The system also showed slightly better results
    in identifying relevant relations (C2KB) for the testing set and slightly worse
    results for the training set. We also found that the annotator has lower performance
    in identifying the relevant properties for a given question (P2KB) with the new
    translations, but the annotator has better results in matching the expected triples
    for each question (RE2KB). These mixed results show the impact of the quality
    of the dataset and the KGQA system and components.


    Finally, we demonstrated how the QALD-9-ES dataset is useful for the development
    of Spanish KGQA pipelines. We expect that this new dataset will especially benefit
    KGQA systems that use Large-Scale Language Models in their pipeline. The resulting
    dataset of this work was merged into QALD-9-plus, a fully native translated dataset,
    this resource can also be used to compare native translations against translations
    generated using Machine Translation.


    **Acknowledgment:** This work is supported by the Research Partnership Grant RPG2106
    funded by the Swiss Leading House for Latin America, and by grants for the DFG
    project NFDI4DataScience project (DFG project no. 460234259) and by the Federal
    Ministry for Economics and Climate Action in the project CoyPu (project number
    01MK21007G).


