- pgno: 187
  md: 'the TRANSRAZ data model a modular modeling approach is developed and presented,
    that enables to benefit from the connection of data coming from different domains
    via domain-specific ontologies.


    # 3.3. *Evaluation of the TRANSRAZ Data Model*


    The competency questions introduced in Section 4.2 were developed to scope the
    data model, guide the modeling process, and, provide a way to evaluate the data
    model. The CQs were iteratively developed together with the domain experts – art
    historians and experts in digital art history. An evaluation of the data model
    is performed by examining if the CQs could be transformed into SPARQL queries
    and by verifying the appropriateness of the data model in delivering correct answers
    to the CQs.²³ ²⁴ The evaluation shows that the integration of the four main building
    blocks of the TRANSRAZ data model enables multifaceted queries. The use cases
    furthermore show that an interconnection between the building blocks is necessary
    and enables the most valuable findings. The presented contribution will not remain
    static and will be further enhanced and extended upon the integration of further
    resources in collaboration with domain experts.


    # 4. **Design Methodology and Use Cases**


    This section presents the methodology of data model development, discusses data
    sources and knowledge that serve as a basis of the data model and provides user-oriented
