  md: '+   * **Semiotic heterogeneity:** ontologies describe the same thing (e.g.,
    a sharp metal blade with a handle) that people/users will interpret differently
    depending on the context (a knife can be a weapon or a kitchen utensil).


    +   * Achichi et al. [25] pragmatically classify the heterogeneities encountered
    by the designers of data linking tools as:

    +     * **Value dimension:** for heterogeneity problems at the level of terminology,
    language used and distinction between datatype properties and object properties.

    +     * **Ontological dimension:** for the problems of heterogeneity of vocabularies,
    structures, property depth, description and key.

    +     * **Logical dimension:** for class and property heterogeneity problems.

    +     * **Data quality dimension:** for the problems of transgression of good
    practice, heterogeneity of value type or non-updated dataset.


    +   * Assi et al. [26] address the issue of IM. They introduce the scalability
    problem when it comes to IM on large datasets. Plus, they classify the heterogeneities
    as:

    +     * **Value heterogeneity:** gathering the notions of multilingualism, data
    format and data quality.

    +     * **Structural heterogeneity:** gathering the notions of vocabulary heterogeneity,
    predicate level and predicate granularity.

    +     * **Logical heterogeneity:** gathering the notions of hierarchical variation.


    We found many similarities between these different heterogeneities, both in terms
