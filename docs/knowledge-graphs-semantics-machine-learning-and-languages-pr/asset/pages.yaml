    # 4. The Implementation: BiPaSS


    Another point that needs to be addressed even though it is not directly related
    to the answering of the research questions is the implementation. Originally,
    the prototype implementing the pathfinding algorithm was written in Python²².
    For the present paper, a full re-implementation⁷ was produced. For future reference,
    we call the implementation Bidirectional Pathfinding System (BiPaSS). The new
    implementation uses Rust²³ for the pathfinding algorithm itself and leverages
    state-of-the-art data structures including a Fibonacci-heap-based priority queue.
    As shown in Figure 3, the implementation comprises four components. The first
    one is the *Query Factory* that implements the procedure from Section 3 for deriving
    the dual-entity query dataset from the TREC dataset. The resulting dual-entity
    queries are provided to the *Pathfinder* component, which contains the pathfinding
    algorithm as well as the code for running the hyperparameter optimization and
    the benchmark. For calculating the semantic distances using SBERT and all-mpnet-base-v2,
    it interacts with the *Wembed API* component via HTTP. For retrieving entity data
    from Wikidata, it interacts with the *Wikidata API* component, which is a wrapper
    for issuing SPARQL queries to the Wikidata Query Service, also via HTTP. The *Pathfinder*,
    the *Wikidata API*, and the *Wembed API* thus constitute the pathfinding system.
    For ease of use and reproducibility, all components are Docker-ized²⁴. Additionally,
    a significant number of the HTTP interactions are cached, allowing for rapid reproduction
    of the results despite the restrictive query limits of the Wikidata Query Service,
    which are responsible for the major portion of the pathfinding duration.


    ²² https://www.python.org (accessed 2023/05/26)

    ²³ https://www.rust-lang.org (accessed 2023/05/26)

    ²⁴ https://www.docker.com (accessed 2023/05/26)'
