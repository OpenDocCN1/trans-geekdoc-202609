  md: '# 5. Social and Cultural.


    To learn about the social life of the historical city over the years, users are
    able to explore touristic and culturally important areas.


    CQ5.1: What were the main cultural areas in the city, e.g. cultural and art institutions?


    CQ5.2: Which parts of the city did most artists live in?


    # 6. Historical Sources and Provenance.


    Researchers can verify findings presented in the VRE by directly exploring the
    connected historical source documents. Furthermore, document annotations and their
    origins can be reproduced.


    CQ6.1: What historical literature is available for a certain street, building,
    person?


    CQ6.2: Where can information about a certain street, building, person be found
    in the historical resource, e.g. page number or coordinates?


    CQ6.3: What types of documents are available that mention a certain concept, e.g.
    certificates, archival records?


    CQ6.4: How and when were the annotations of a certain concept created? Manually
    or automatically?


    # 5. Conclusion and Future Work


    Within the TRANSRAZ project the TRANSRAZ data model has been created, which enables
    semantic representation of agents, events, architectural objects, and historical
    documents of historical cities. This model enables scientifically accurate exploration
    of the Nuremberg’s history in a 3D virtual environment, and can be applied to
    other historical cities with similar aims. It is available publicly, it is planned
    to extend it by adding new vocabularies and controlled vocabularies for consistency
    in historical terms. Moreover, the TRANSRAZ Knowledge Graph integrated into TOPORAZ
    VRE will be extended with addition of further data resources. Exploring the knowledge
    extracted from the historical resources and their interconnection with a 3D VRE
    will allow users to obtain an impression of the hidden past and, hence, better
    understand the formation of today’s world, its society and oneself.


