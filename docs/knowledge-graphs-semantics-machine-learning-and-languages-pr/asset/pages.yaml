    In summary, the answer to RQ4 is as follows: The Uninformed configuration reaches
    a lower coverage than the configurations that consider semantic distances, thereby
    supporting their utility as part of the search heuristics. Given the web search
    engine context, the Optimized configuration represents the best option as it reaches
    the highest coverage of the test set with a low average of visited entities and
    a moderate average path length. Its high coverage also supports the assumption
    by [2] that limiting the algorithm to only consider outgoing edges is unproblematic.
    At first, the Semantics-Only configuration seems to be a competitive configuration,
    as well. However, the high average length of the paths found with this configuration
    raises doubts about their usefulness for users.


    To investigate the usefulness of entity relationships, a representative user study
    has to be conducted in the future. The goal of this study is to deepen the understanding
    of the meaningfulness of entity relationships in the web search engine context
    and to assess to what extent the cost function and hyperparameter configurations
    comply with the users’ perceived meaningfulness of entity relationships. Nevertheless,
    to give an idea of the paths found by the different configurations, Table 4 presents
