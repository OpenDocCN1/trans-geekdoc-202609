  md: '# 5. Related Work


    In last years many algorithms have been proposed to address both the efficiency
    and accuracy of link discovery in general and link discovery over geospatial RDF
    KGs in particular. For instance, Ngonga Ngomo [1] computes the distance between
    geographical items using the Hausdorff distance. Sherif et al. [23] provide a
    review of 10 point-set distance metrics for link discovery. SILK [24] computes
    topological relations in accordance with the DE-9IM standard based on the MultiBlock.
    To compute topological relations between geographical resources quickly and accurately,
    RADON [5] offers an indexing technique coupled with space tiling approach. While
    RADON computes the intersection matrix for each relation between a pair of geometries
    repeatedly, RADON2 [6] caches the computed intersection matrix and reuses it whenever
    it is possible. In GIA.NT [7], Papadakis et al. have adapted RADON’s indexing.
    In particular, instead of calculating the estimated total hypervolume to decide
    which dataset to index, the authors simply index the first dataset using a grid
    approach. In DORIC [8], Jin et al. the relation computation problem is optimized
    by using existing links to infer new links. For instance, in case A equals B and
    A equals C, DORIC infers that B equal C. Ahmed et al. [11] studied the effect
    of simplifying the resources’ geometries on the runtime and F-Measure of link
    discovery approaches over geospatial KGs. However, our approach computes topological
    relations using content measures as defined in [12] instead of computing the DE-9IM
    intersection matrix. Accuracy has received a considerable attention from the research
    society of link discovery. For instance, algorithms such as RADON [5], RADON2
    [6], GIA.NT [7], and DORIC [8] achieve an F-Measure of 1, while algorithm such
    as the ones in [11] and our presented algorithm here (COBALT) scarify the accuracy
    in favour of efficiency.


    # 6. Conclusion & Future Work


    In this paper, we propose COBALT, an approach for topological relation discovery.
    COBALT combines the R-tree indexing with the content-based measures in order to
    scale up the topological relations discovery process. Based on our experiments,
    COBALT is able to achieve a speed up of up to 1.47 × 10⁴ over state-of-the-art
    algorithms. On the other side, we also study the impact of applying our proposed
    approach on the accuracy of the generated links. In order to optimize COBALT,
    we propose two polygon splitting strategies. Without applying our splitting strategies,
    COBALT achieves an F-Measure between 70% and 90%. By applying our proposed splitting
    strategies, the F-Measure of COBALT is improved to up to 99%. In future work,
    we aim to improve the accuracy of COBALT by incorporating more non-spacial information
    into the linking process. In particular, we will consider information regarding
    the type, location, description, and name of the resources represented by the
    polygons in the linking process.


