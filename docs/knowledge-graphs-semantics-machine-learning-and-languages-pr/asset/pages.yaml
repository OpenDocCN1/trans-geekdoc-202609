- pgno: 111
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_111_0.png)


    **Figure 1.** KG ontology.


    The particularity of our ontology lies in the extension of the LOM description
    to consider the subjects treated in the learning objects with relevance scores.
    To do this, we use RDF statement-level reification. Reification allows making
    statements about statements in a generic manner. For us, it will allow to state
    that an ER treats a particular subject (in our case a DBpedia resource) *to some
    extent*. Concretely, it will allow to annotate the property dct:subject in a fact
    (unr:EducationalResource, dct:subject, dbr:Resource) with relevance scores. These
    scores are determined with a wikification process, which identifies pageRank and
    cosine similarity values in the range [0..1]. More information on this process
    is provided in the next section.


    Besides being reified, dct:subject is a multi-valued property, i.e., a subject-predicate
    pair having several objects. These objects are DBpedia resources which are instances
    of classes in DBpedia, Wikidata, and Yago ontologies. We consider also DBpedia
    categories, which are used in Wikipedia to organize articles and pages by subject
    matter. Since the goal of our KG is to identify ERs based on their subjects, DBpedia
    categories are essential. DBpedia resources are associated with their categories
    through the dct:subject property (dbr:Resource, dct:subject, dbr:Category).


    # 2.2. Wikification of educational resources


    Entity linking techniques that map named entities to Wikipedia entities are called
    wikification. Text wikification is the task of automatically extracting the most
    important words and phrases in a document, and identifying for each such keyword
    the appropriate link to a Wikipedia article [1]. The wikification process generally
