- pgno: 89
  md: 'tional entropy to indicate the degree perplexity, when a model’s prediction
    is compared with a data sample. For the calculation of entropy, we use Eq. 2:


    $$ H = - \sum_{w,c} q(w,c) \log_2 p(w|c) \tag{2} $$


    w denotes a linguistic unit and c its context. For the PoS-tags, each dataset
    is represented as a combined distribution of bi- to heptagrams, for the tokens,
    each dataset is represented as a combined distribution of the bi- and trigrams,
    and for the thematic roles a combined distribution of the bi- to tetragrams is
    used. PP expresses the divergences between these probabilities.


    # 4. Results


    Table 1 gives the perplexity between the reference data sets and the BNC data,
    i.e., four data sets with IE (Idioms 1–4) and one data set with exclusively literal
    expressions (Literals).


    | Reference dataset | Idioms 1 | Idioms 2 | Idioms 3 | Idioms 4 | Literals |

    |---|---|---|---|---|---|

    | Wikipedia | 6.06 | 6.11 | 6.11 | 6.18 | 6.06 |

    | News | 5.92 | 6.00 | 6.00 | 6.03 | 5.93 |


    Table 1. Perplexity based on PoS-tag probabilities between reference data sets,
    literals and idioms.


    Table 1 shows approximately the same perplexity for all IE and literals: for n-grams
    and POS tags, IE and literals are each distributed similarly to the reference
    data. Table 2 gives the perplexity between the reference data and the BNC data
    based on bi- and trigrams of tokens.


    | Reference dataset | Idioms 1 | Idioms 2 | Idioms 3 | Idioms 4 | Literals |

    |---|---|---|---|---|---|

    | Wikipedia | 19.30 | 18.63 | 18.63 | 17.74 | 18.27 |

    | News | 19.54 | 18.66 | 18.66 | 18.19 | 18.52 |


    Table 2. Perplexity based on bi- and trigram probabilities of tokens between reference
    data sets, literals and idioms.


    Again, there is hardly any difference in the perplexity caused by idioms and literals.
    We observe that the perplexity values are much higher here than for PoS-tags which
    is due to the fact that the set of PoS-tags is considerably smaller than that
    of the tokens. Recall Eq. 1: high average information due to low probabilities
    of signs causes high perplexity and vice versa. N-grams of tokens are more informative
    than n-grams of PoS tags. Table 3 shows the perplexity of semantic surprisal from
    thematic roles.


    Here, the same picture emerges as in the Tables 1 and 2: based on semantic surprisal
    of thematic roles, literals and idioms cannot be distinguished from each other
    by perplexity. We notice again that the amount of perplexity correlates with the
    number of linguistic units it is based on. The results in Table 3 are derived
    from (about) 2000 thematic roles, and thus the values are higher than those based
    on 15 PoS tags, but they are lower than the values derived from the large, entire
    set of tokens.'
