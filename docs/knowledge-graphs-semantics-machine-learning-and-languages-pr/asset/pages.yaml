    \ ← reachable_target ∪ {adjacentEntity}\n            end if\n        end for\n\
    \    end while\n    return ⊥, |visitedEntities|\nend procedure\n```\n```\n\nbetween\
    \ $e$ and $e'$ can be established through the currently visited entity, the algorithm\
    \ terminates, returning the found path and the number of visited entities. Otherwise,\
    \ the adjacent entities are retrieved and enqueued with respect to the costs of\
    \ the paths leading to them. The costs are calculated by means of a cost function\
    \ with the hyperparameters $\\alpha$, $\\beta$, and $\\gamma$. When the priority\
    \ queue becomes empty or the entity limit, i.e., the maximum number of entities\
    \ that are allowed to be visited before the search is aborted, is reached without\
    \ a path being found, the algorithm terminates unsuccessfully.\n\nBy providing\
    \ a measure for ranking the entities in the priority queue, the cost function\
    \ ($calculateCosts$ in Algorithm 1) guides the graph traversal and ultimately\
    \ determines the algorithm’s performance as well as the characteristics of the\
    \ found paths. What remains to be discussed is therefore what cost function can\
    \ meet the requirement that users desire meaningful entity relationships in the\
    \ knowledge panel context, as pointed out in"
