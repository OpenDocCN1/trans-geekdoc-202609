    |

    | 5.3(b), 5.3(c) | Processing environment | `dpv:ProcessingContext`, `dpv:hasLocation`,
    `dpv:WithinVirtualEnvironment`, `dpv:WithinPhysicalEnvironment` |

    | 5.5 | Technical and operational measures to prevent re-identification of data
    holders/subjects | `dpv:Deidentification` |

    | 5.9 | Third party recipients | `dpv:ThirdParty` |

    | 8.2 | Data format | `dcat:mediaType`, `dct:format` |

    | 8.2 | Data size | `dct:extent` |'
