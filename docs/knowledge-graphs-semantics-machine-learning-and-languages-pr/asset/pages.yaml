  img_proc: true
- pgno: 69
  md: 'Science has gained momentum and is being put into practice by more and more
    scientific communities.


    The availability of increasingly large amounts of data enables the exploration
    of new data-driven, interdisciplinary research questions. These approaches require
    integration and harmonization of machine-actionable data across disciplinary boundaries
    addressing Findability, Accessibility, Interoperability, and Reusability. The
    idea of having machine-actionable data is derived from the JDDCP [7] guideline
    that refers to making the data readable and modifiable by machines.


    Machine-actionable, FAIR research data is achieved by annotation with rich metadata.
    Furthermore, these metadata themselves also need to be FAIR, meaning metadata
    used for data annotation needs to be understandable and actionable by both humans
    and machines. Generic metadata schema like DataCite [8] or Dublin Core [9] cannot
    express rich discipline-specific descriptions of data. This often results in limiting
    the annotation to basic metadata such as title, author, date, and format and providing
    the domain-specific metadata in the form of long free text that decreases data
    FAIRness due to the lack of semantics [10].


    Here, terminologies play an important role in the creation of semantically rich,
    discipline-specific metadata. They further provide the basis for consensus definitions
    of entities, thereby ensuring conceptual alignment across domains, even when the
    nomenclature differs between domains. The use of metadata schemata implementing
    standardized terminologies promotes interoperability and data integration, as
    data described through common terminologies can be understood and used across
    different systems and disciplines.


    Terminology services like the Ontology Lookup Service [11], Bioportal, or Linked
    Open Vocabularies provide access to either general or discipline-specific collections
    of ontologies, terminologies, or vocabularies. They offer features like browsing,
    searching, filtering, and downloading ontologies. Terminology services, therefore,
    play a crucial role in the identification of relevant ontologies in the process
    of data annotation and the creation of FAIR data. Their relevance is reflected
    in the integration into various data annotation or data management tools. The
    CEDAR workbench supports data annotation with domain-specific metadata schema
    [12]. For the creation of metadata templates, the workbench integrates ontology
    terms from the Bioportal terminology service [13] which the user can select from.
    The Dataverse project enables the integration of customized metadata schema which
    can be populated with terms of linked terminology services [14] [15]. The electronic
    lab notebook Chemotion utilizes terminologies to annotate data of experiments
    [16].


    With the increasing use of terminologies for data annotation, errors and gaps
    in terminologies are inevitably uncovered not only by ontology engineers but also
    by domain experts annotating data. This opens up new application areas for terminology
    services. What could be more natural than using the services that are used for
    searching and analyzing ontologies for curation and development as well?


    In this paper, we discuss collaborative ontology development workflows and the
    requirements for a versatile Terminology Service to support these workflows. What
    are the best approaches and best practices to collaboratively design and curate
    ontologies in a team of ontology engineers, knowledge workers, and domain experts?
    What are the requirements for a Terminology Service to support the design and
    curation workflows of stakeholders with varying levels of expertise? How can a
    Terminology Service improve ontology development concerning harmonizing and aligning
    the application and reuse of terminologies across knowledge domains?'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'In the following section, we provide an overview of related work concerning
    terminology services and ontology development tools. In the subsequent section,
    we briefly describe the challenges when using terms from terminologies for data
    annotation or when reusing terms from existing terminologies in new ones. Section
    4 describes our approach to collaborative ontology development and lessons learned
    in the application of a terminology service for the derived workflows. In section
    5 we describe our terminology service and the enhancements we have developed based
    on the requirements derived from experiences and observations during the ontology
    development process. Section 6 summarizes and discusses insights and evaluation
    of user-driven development processes to extend the terminology service as a tool
    for ontology development and curation.


    # 2. Related Work


    Two types of services and tools aim to facilitate ontology access and development:
    Terminology Services (TS) and ontology development tools. In this section, we
    present the most prominent open-source tools and services and also discuss deficiencies
    and gaps in existing solutions concerning envisioning a well-integrated TS for
    both ontology development and data annotation.


    # 2.1 Terminology Services (TS)


    A number of mature terminology services and repositories are publicly available.
    Terminology registries such as the Basic Register of Thesauri, Ontologies & Classifications
    (BARTOC) represent the simplest form of such a service [17]. Registries usually
    list comprehensive metadata about vocabularies, terminologies, and ontologies
    and link to their original source while Terminology repositories provide access
    to the terminology data itself, often in combination with access to this data
    via APIs [18]. Well-used TS frameworks like OntoPortal [19] and Ontology Lookup
    Service (OLS) [20] provide extended features like searching and browsing within
    the indexed terminologies, tree views of concepts and properties, and visualization.
    OntoPortal is an ontology-supported portal architecture developed by the OntoPortal
    Alliance that can be customized to provide discipline-specific terminology services.
    It has emerged from BioPortal, which provides access to a collection of biomedical
    ontologies and terminologies [13]. The Ontology Lookup Service, developed and
    hosted at the EMBL European Bioinformatics Institute (EBI), provides ontology
    search and visualization services as well as data access and search through an
    API. Furthermore, there is Skosmos, an open-source web-based browser and publishing
    tool specialized for Simple Knowledge Organization System (SKOS) vocabularies
    [21]. It provides a user interface for browsing and searching the data as well
    as Linked Data access with APIs that support term-based searches. DBpedia Archivo
    archives and ontologies on a web-scale to offer access to their different versions
    over time. It also provides quality metrics [22]. The Linked Open Vocabularies
    (LOV) portal provides a comprehensive overview of vocabularies in the realm of
    the Semantic Web and Linked Data, which can also be accessed via a SPARQL endpoint
    [23].'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'All terminology services provide rich functionalities, yet they typically encompass
    ontologies from specific domains or disciplines alone. While this approach proves
    feasible in many instances where users want to focus on their respective domains,
    it does pose challenges for those seeking a comprehensive overview of available
    ontologies across diverse domains for interdisciplinary applications. Both use
    cases are legitimate and an ideal terminology service should possess the capability
    to cater to both of these requirements.


    # 2.2 Ontology development tools


    Open-source ontology editors like Protégé and its online version WebProtégé [24]
    or visualization tools like WebVowl [25] can be used to inspect and develop ontologies
    one at a time. Yet when it comes to researching terms in multiple ontologies or
    comparing multiple ontologies at once, these tools lack the flexibility a TS provides.
    At the same time, they are tailored to experienced users and can be quite overwhelming
    for the novice user, due to the broadness and complexity of the functionalities
    they provide.


    Such development tools are also not well suited for seeing changes between versions
    of the same ontology directly. To ensure applications will not break when implementing
    a new version of a reused ontology, it is however essential to enable ontology
    users to access and keep track of the changes between different ontology versions
    in a simple manner. This means all ontology versions should be explorable and
    comparable. If one wants to avoid loading different versions of the same ontology
    into multiple instances of one''s ontology editor, one would usually resort to
    a TS. Yet, when it comes to providing multiple versions of multiple ontologies,
    the sheer amount of data and often missing versioning information can pose quite
    a challenge. Efforts in this direction on the pure ontological level have been
    made in the DBpedia Archivo project. Integrating version differences into a TS
    that also allows for browsing the terms of an ontology thus requires either high
    computational resources or new approaches around displaying changes, like the
    efforts behind the planned Knowledge Graph Change Language [26].


    In addition to ontology archiving and versioning, there have been efforts to facilitate
    the ontology development and maintenance process. The main focus in facilitating
    ontology’s development process was automation and quality assurance standards.
    For instance, ROBOT [27] was developed based on the standards of software development
    to help ontology developers automate common tasks like file conversions, error
    checking, reasoning, metadata annotation, modularization, and release management.
    The Ontology Development Kit (ODK) [28] integrates templates, standards, and quality
    checks with tools like ROBOT or GitHub in a bundled way using Docker to make their
    use in common development workflows easier.


    As mentioned, ontology development tools are aimed at helping developers to have
    an optimal and precise development process. Also, they help the developer to have
    a better understanding of ontologies. However, they do not offer powerful ways
    to explore ontologies as much as TSs. On the other hand, TSs mainly focus on browsing
    and are not trying to provide further tools regarding the ontology development
    process. Considering these observations, an ideal TS should provide some tools
    to facilitate the development process to some extent, when it is used as a trusted
    main medium through which ontologies are perceived and understood.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 3. Prolog - Finding the right words


    A major challenge when using terminologies for data annotation or when importing
    parts of them in new terminologies is that one has to decide which terms to use
    from which terminology. In order to be able to make an appropriate decision, one
    must either already know which terminologies and terms are suitable for a specific
    scientific context and use case, or, more likely, one must be able to gather this
    knowledge by browsing the available terminologies. A terminology service with
    a graphical user interface (GUI) is such a resource, which renders terminologies
    comprehensible for humans, and should therefore be able to provide as much detailed
    information as possible on the terminologies themselves as well as on the terms
    they contain. This aspect is especially crucial when there is the need to compare
    multiple terminologies covering the same or overlapping knowledge domains. Terminology
    users need to be able to see the semantic differences and similarities as well
    as interdependencies between terminologies to make informed decisions. An intuitive
    way of browsing terminologies is thus key for evaluating the scope and use case
    applicability of terminology and for grasping its overall logical composition.
    It is important to be able to traverse the term hierarchy easily, similar to how
    we use file browsers or navigate publications in our document readers. In other
    cases, we need the ability to sort and filter the terms of terminology, like we
    are used to from working with spreadsheets. Such GUI functionalities are needed
    to keep focused when exploring the sometimes very complex semantics of terminology
    or to get to the desired information quickly in everyday workflows.


    # 4. Ontology Development


    To find out which features are required from a TS more concretely in collaborative
    ontology development workflows, we have analyzed the experiences made by domain
    and ontology experts in a still ongoing ontology development effort within the
    NFDI4Chem project [29]. The focus here was to benefit from a user-centered approach
    where we involve the ontology developers in our TS development process from the
    early stage to collect fine-grained user stories and requirements.


    # 4.1 Vibrational Spectroscopy Ontology (VIBSO)


    As the name implies, the intended domain covered by the Vibrational Spectroscopy
    Ontology is the discourse around a particular kind of spectroscopy that assays
    the vibrational modes of molecules and crystals. To be more precise, the ontology
    is meant to provide a formal representation of the technical terms used by domain
    experts to describe and share the research data output produced by such assays.
    It must thus contain terms that refer to the experimental setup, like the used
    devices, their relevant parts, and attributes, terms that refer to associated
    processes preceding and following the actual assay, like the preparation of the
    sample or the data transformation producing interpretable spectral images from
    raw signals, as well as terms that refer to relevant characteristics of these
    spectral images, like their dimensionality or analytical significance.


    Adhering to best practices in ontology development [30], VIBSO''s domain coverage
    depends heavily on reusing many terms from existing ontologies instead of defining
    them anew. First and foremost it depends on the Basic Formal Ontology [31] as
    a common'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'ground for the abstract upper-level classes such as material entity or process
    and on the Relation Ontology [32] for commonly used relations. The Ontology for
    Biomedical Investigations [33] is another important and more concrete dependency
    of VIBSO, as it provides many general classes and some specific relations within
    the domain of scientific investigations, such as assay, device, or protocol. Most
    importantly, VIBSO’s core depends on classes from the Chemical Methods Ontology
    [34], which already defines branches for the main chemical methods of interest
    - vibrational spectroscopy and Raman spectroscopy - as well as other general classes
    needed, such as spectrum or spectrometer. We are collaborating with the developers
    and maintainers of CHMO and due to the domain-specific overlap between it and
    VIBSO, there is the possibility to integrate VIBSO into CHMO in the future. At
    the moment, however, it seems best to keep the two separated to address the identified
    gaps and issues regarding VIBSO''s scope.


    # 4.1.1 Development Approach


    Since most of the ontologies VIBSO depends on are part of the OBO Foundry [35]
    and to thus ensure interoperability, VIBSO’s development also follows the best
    practices and principles [30] of this community. Furthermore, it is being developed
    in an iterative, version-controlled way that relies on continuous integration
    to make sure all changes are properly tracked and that the release files are quality
    controlled. For the technical implementation of this approach, we use the ODK,
    ROBOT, Protégé, GitHub, and the NFDI4Chem collection of our TS. The latter plays
    a central role in the development of VIBSO, as it is used to browse its most current
    version, to link to its terms in discussions, to search for requested terms in
    other domain-related ontologies, and to regularly look up the axiomatization patterns
    and term details of the reused ontologies. With regard to the conceptual aspect
    of our development approach, we rely on the collaboration with domain experts
    from chemistry and related scientific fields in which vibrational spectroscopies
    are being used, as they are the ones who know best what concepts are needed in
    this domain and how to label and define them. So far, we could benefit from the
    domain knowledge of scientists from the NFDI4Chem project, the CHARISMA project
    [36], BASF, and the Scuola Normale Superiore. These domain experts provided an
    initial list of terms from which a first ontology draft was created. Further term
    requests have since been filed and are being discussed with the domain experts
    mostly in regular open online calls and to a much lesser degree in the ontology’s
    source code repository on GitHub.


    As part of these development discussions, the domain experts are also asked to
    provide feedback on the used tools and workflows. This feedback is then used to
    find out how we can improve such a collaborative ontology development process
    more generally by enhancing the usability of the TS. The rationale behind this
    is not to turn the TS into yet another ontology editor that is just simpler to
    use. We also do not expect the domain experts to contribute to the source code
    of VIBSO directly, by having to learn the required specialized tooling. We rather
    want to develop simpler ways to communicate with them about the semantics of specific
    terms and terminologies. Making it easier in the TS to suggest new terms and changes
    to their metadata annotations (e.g. labels, definitions, or synonyms) or to discuss
    terminologies or terms in place, we believe that domain and ontology experts can
    benefit more from each other''s expertise. We thus'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'rather aim at making the TS a better tool to analyze and annotate the broad
    spectrum of available terminologies.


    # 4.2 Lessons Learned from the VIBSO Development


    Within the discussions between ontology engineers and domain experts, we have
    learned that tools to browse ontologies should be applicable in a simple and uncomplicated
    manner close to similar tools used by domain experts. Being still rather unfamiliar
    with the TS and its standard tree view for browsing an ontology, our domain experts
    requested to also have a tabular view that lists the available VIBSO terms to
    get a better overview. As a first step, we tried to address this need by switching
    from a pure Protégé based editing approach to one that uses spreadsheets and a
    TSV file as an input format for the definition of new VIBSO classes. Although
    this approach makes it easier for the domain experts to directly see, comment
    and edit the existing classes or create new ones by using common spreadsheet editors,
    it often seems to be too much of a hurdle to access and change this TSV via GitHub.
    In addition, the TSV defines only the classes from VIBSO and not the classes or
    relations imported from external ontologies. The domain experts thus have no direct
    way to understand the semantics of the latter. They would have to use the TS to
    look up why these terms are being used as parent classes or as part of VIBSO’s
    axiomatization in the TSV. Being able to list all of the classes of an ontology
    in a tabular view directly in the TS avoids these downsides. If such a tabular
    view could also be used to sort and filter the class list, it would be easier
    than in the tree view to grasp or analyze certain details more intuitively. Sorting
    or filtering by term identifier would allow, for example, a more direct differentiation
    between imported and native terms, which allows one to quickly grasp the magnitude
    of external dependencies of an ontology. We believe that such a class list view
    could also gradually improve the acceptance and use of the tree view if the switching
    between the two views is implemented in a way that enables the user to learn to
    appreciate their differences in rendering an ontology.


    When it comes to discussing term definitions and metadata or ontology-related
    questions as well as when one wants to request new terms, the most common approach
    in open-source development is to file issues in the Git-based repositories where
    the ontologies are maintained. Having to leave the TS to do so means an extra
    effort for the user. This has caused us to think about how we can use the TS as
    a medium to simplify such interactions. It would be more user-friendly to be able
    to at least list external issues and in the best case read, write, or comment
    on them directly from within the TS. Like some of VIBSO’s domain experts, ontology
    users who are unfamiliar with such external services would thus not need to learn
    a second platform to access more context information about an ontology, and to
    provide valuable feedback to its developers. At the same time also ontology users
    and developers who are familiar with the required Git workflows could benefit
    from this in their daily work by not having to switch contexts. Of course, such
    a feature should at best work with different version control platforms, like GitHub
    or GitLab. Fortunately, these two have suitable APIs and are very commonly used
    for open ontology development. So focusing on one of them can be considered already
    a great step forward.


    Another aspect we have identified as a useful enhancement of the TS is the ability
    to add another layer of context information intended for a special user group.
    Apart from'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'the metadata annotations provided on terms or the whole ontology, further documentation
    on design patterns and choices, which helps a user to better understand an ontology,
    is usually provided in scientific papers or discussions happening on mailing lists
    and development platforms. Well-curated ontologies contain links and notes to
    these sources. However, curating such links and notes is quite an effort, as the
    curators have to decide on their appropriateness to be included in the source
    code. Many use case or project-specific notes and discussions might thus be excluded
    or remain buried in the external sources. In addition, when following these links
    one usually has to leave the TS and thus runs the risk to get sidetracked. Especially
    when using multiple ontologies in a modular fashion, it can be quite challenging
    for less experienced users to understand why certain terms have to be imported,
    as they might seem unnecessary from a use case perspective but are needed from
    an ontological perspective to remain in line with their axiomatization. Having
    a functionality in the TS that allows its users to comment on the term and ontology
    level would be an alternative to sharing in-place insights.


    As an example, with a note on the imported OBI term assay in VIBSO, which is an
    important superclass for the needed specializations of vibrational spectroscopy
    assays, we could provide directly further context to our domain experts about
    how to interpret the asserted and inferred axiomatization to remain in line with
    OBI design patterns, when defining new such specialized assays, instead of having
    to provide this information in the development documentation in other places.
    By making such a note and its particular context visible also on the same class
    in other ontologies, other TS users might benefit from such insights as well.


    On the other hand, with notes on the ontology level, users can discuss their applicability
    in certain use cases. To remain in the VIBSO example, it would be quite helpful
    to add notes on CHMO that communicate to our domain experts the gaps and issues
    we have identified and need to address in VIBSO and link to their associated issues
    for further details. With such an additional layer, the CHMO developers as well
    as others could thus better keep track of our work without having to search multiple
    source code repositories for the related issues. For ontologies that are not maintained
    on an open platform that allows file issues, which unfortunately is still quite
    common, such a TS feature would be even more helpful. We believe that using a
    TS as such a medium could be a valuable way to keep a better overview of issues
    that span multiple ontologies and thereby better tackle complex issues of harmonization
    and mapping.


    The experiences made by the ontology experts with the TS in the development of
    VIBSO and other NFDI4Chem-related ontology work, also lead to improvement suggestions
    for the TS. One major advantage of the TS for this user group is that for browsing
    and looking things up quickly in many different ontologies, they do not have to
    load all of them into Protégé. Another advantage of a TS is the ability to link
    to individual terms directly, which is an important way to reference these in
    many different contexts. Doing the lookup tasks in a web-based TS and the development
    tasks locally in Protégé helps a lot to keep focused, and keeping your focus is
    very important when working with formal ontologies. Yet, this user group is used
    to certain, often small but convenient, features that ease their daily workflows.
    Making such features also available in the TS where it makes sense is preferred.
    One of such features our ontology experts have identified as useful to port to
    the TS is the ability to traverse the hierarchy tree quickly with the keyboard
    navigation keys. Another one is the ability to adjust the size of GUI panes containing
    the tree view and term details. To find out which other features are also good
    candidates for porting to the TS, we will have to do further user research.'
