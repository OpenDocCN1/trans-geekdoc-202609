    were then asked to read the abstract of the fragments and explore the distance
    to other fragments as a basis to find the relation between the different fragments.
    Finally, as a fourth task, they were asked to assess ‘how prominent the relation
    between the different fragments was’. We relied on the System Usability Scale
    (SUS) developed by Brooke [13] as a basis for a questionnaire administered to
    the participants, adapting the questions to the eTaRDiS setting. The participants
    assigned a score on a five-point scale from ‘not true at all’ to ‘fully agree’
    for each of the ten questions regarding aspects of the usability of eTaRDiS.


    # 4.2. Participants


    The participants were recruited through a seminar of historical studies and the
    digital humanities and received credits for their participation in the study.
    In total, 13 students participated in the user study. The age of the participants
    was between 24 and 42 years (average age 29.13). Six participants had a background
    in historical studies. Three participant even had an occupation related to history,
    e.g., as an archivist, or they were working in a project related to history. Five
    participants were interested in history and had a background in different research
    areas of social sciences (see Section 3.1). The interviews were transcribed and
    analyzed using qualitative content analysis. The total dataset comprises 2 hours
    48 minutes and 41 seconds of audio and video recording.


    # 4.3. Results


    For eleven out of 13 participants, eTaRDiS was the first VR experience. All participants
    were able to complete the given tasks and eleven participants found the relation
    easy to identify. In the first task, the participants needed between 8 and 84
    seconds (42.85 seconds on average) to find the three relevant fragments. One participant
    inferred from the names of persons on fragments coloured in blue that all blue
    fragments denote Agents and used this correct inference to find the (blue-coloured)
    fragment for Oppenheimer. Another participant used a sphere’s size to find the
    fragment WWII, assuming that the sphere for the event to be relatively large.
    Two other participants used the labels of the surrounding fragments to locate
    Oppenheimer and the Manhattan Project, assuming the fragments had to be in the
    proximity of the fragments of physicists. Four participants marked the corresponding
    spheres. The proximity of the fragments Manhattan Project and WWII represented
    a challenge to the exploration for some participants as the label of one of the
    fragments was partially occluded by the open detail window of other fragments.


    In the second task, the participants used three strategies to find the location
    and time of the fragments. The first strategy used by six participants was to
    open the characteristics in the detail windows of the fragments and read the information
    under location and time period. For WWII, no locations were given but the participants
    found the relevant information in the compilation of the place property. The second
    strategy used by five participants was to read the abstract of each fragment.
    The third strategy used by two participants was to read the characteristics and
    the abstracts. In all strategies, the participants zoomed in or moved the detail
    windows for a better view of the texts.


