    \ reuse and sharing of data, querying registries of activities and specifying\
    \ data altruism form terms. Section 5 discusses the impact of our approach on\
    \ compliance with DGA and its limitations and the last section presents conclusions\
    \ and future lines of work.\n\n# 2. Information Flows in the DGA\n\nAs the DGA\
    \ promotes the availability and regulates the sharing of data, a set of information\
    \ flows, related to the information that needs to be exchanged between"
