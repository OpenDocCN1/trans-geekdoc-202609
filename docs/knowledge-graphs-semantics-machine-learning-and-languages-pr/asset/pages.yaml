    # 3.3. Dataset Statistics


    The resulting dataset contains questions for DBpedia and Wikidata Knowledge Graphs.
    In Table 2, we show that the dataset contains 408 train questions for DBpedia,
    371 train questions for Wikidata, 150 test questions for DBpedia, and 136 test
    questions for Wikidata in Spanish. The rest of the languages are preserved as
    in QALD-9-plus [3].


    # 3.4. Quantitative Analysis between QALD-9 vs QALD-9-ES


    Inspired by the work of the QALD-9-plus team, we have used language-agnostic quantitative
    text analysis measures to observe the differences between the Spanish translations
    of QALD-9 and QALD-9-ES. To achieve this, we used the library “LinguaF”12.


    The results can be observed in Table 3. QALD-9-ES'' translations have more words;
    each word is longer and has more syllables. QALD-9-ES also improves the dataset’s
    lexical density, meaning that the dataset has more meaningful words (e.g., nouns,
    verbs, adjectives, and some adverbs). On the other hand, we have found that the
    new translations present a lower Type Token Ratio (TTR). That means there are
    fewer unique words in the new translations than in the old ones. After analyzing
    and comparing both translations, we hypothesized that this was because most questions
    that presented translation errors (like Case 1 and 3) tended to add incorrect
    and unrelated words. Questions related to Case 5 affect this measure too, as words
    that have errors related to accentuation in some questions are considered unique
    words by LinguaF.'
