    # 5. Terminology Service


    The development of our terminology service was initially motivated by the need
    to provide a robust service to search, browse, analyze, and access ontologies,
    terminologies, or vocabularies for various communities and scenarios like semantic
    annotation of research data or data generation. The TIB Terminology Service addresses
    these needs and provides overarching access to ontologies across multiple domains.
    Introducing the concept of collections, we can group ontologies by discipline,
    domain, or project providing customized views supporting communities not only
    to identify but also request new terminologies. The NFDI4Chem terminology service
    [37] is such a discipline-specific view for researchers interested in chemistry
    ontologies and has been used in VIBSO development. Table 2 summarizes available
    collections established so far.


    Table 2: Collections used to bundle terminologies by domain or projects in the
    TIB Terminology Service.


    | Collections | Terminologies | Classes | Properties | Individuals |

    |---|---|---|---|---|

    | NFDI4Ing | 53 | 483167 | 5840 | 3522 |

    | NFDI4Chem | 38 | 147788 | 5928 | 26937 |

    | CoyPu | 8 | 3767 | 2955 | 17289 |

    | NFDI4Culture | 5 | 234 | 785 | 10 |

    | FID Move | 9 | 121501 | 410 | 2439 |

    | FID BAU Digital | 11 | 12820 | 1465 | 14702 |

    | FAIR Data Spaces | 32 | 558036 | 4119 | 14068 |


    Collections like NFDI4Chem are curated by community-agreed quality criteria [38],
    [39] applying workflows for suggesting new terminologies. Besides collections,
    ontologies can also be assigned to subjects like chemistry, physics, or engineering
    sciences. This classification can be applied to narrow down the ontologies of
    the TS to work with a specific set that is related to their scientific domain.
    The Terminology Service periodically checks updates for the indexed terminologies
    at the original sources to ensure it provides the latest version available.'
