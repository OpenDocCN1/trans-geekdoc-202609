    \ can be assigned to questions with mistakes in the question keywords.\n\n+  \
    \ 1. The first case involves what we call “minor translation mistakes,” which\
    \ we define as translation errors that do not alter the question’s original meaning.\
    \ Some common errors, in this case, are the use of the incorrect genders (for\
    \ example, using the word “hermoso” for a female noun or subject), missing words\
    \ that do not contribute to the meaning of the question, the absence of opening\
    \ and closing question marks (‘¿?’), missing letters, the inappropriate use of\
    \ plural forms, the lack of capital letters in proper names, or using the wrong\
    \ tense. An example of these issues can be found within the question “Who developed\
    \ Skype?”, which got translated to “Quien desarrollado Skype?”; The verb “desarrollado”\
    \ is in its past participle form. To be a correct translation, the auxiliary verb\
    \ “ha” should accompany the main verb resulting in the translation “¿Quién ha\
    \ desarrollado Skype?”. Another correct alternative is to modify the main verb\
    \ by changing it to the simple past tense, resulting in “¿Quién desarrolló Skype?”.\n\
    +   \n+   2. The second case is about what we call “major translation errors”,\
    \ the main characteristic of these errors is that they result in the loss of meaningful\
    \ elements of the question, such as verbs, proper names, and other meaningful\
    \ words. One example of this case is found in the question “In which U.S. state\
    \ is Area 51 located?” which got translated to “En cual Nosotros estado es Zona\
    \ 51 ¿situado?”. If we reverse this translation, we would get “In which us state\
    \ is Zone 51 located?” As you can see, the entity “U.S.” was mistranslated to\
    \ the word “us” and the entity “Area 51” was transformed to “Zone 51”. In both\
    \ cases, the entities in question were lost, meaning that a KGQA system would\
    \ not be able to work properly with this translation. Another example of this\
    \ issue can be found in the question “Where did Abraham Lincoln die?” that gets\
    \ translated to “Dónde hizo Abraham Lincoln el?”. In this translation, the verb\
    \ “die” was completely lost, resulting in a question that just does not make sense.\
    \ In the original QALD-9 translations, we found some questions that lacked their\
    \ corresponding Spanish translation. Those questions were classified into this\
    \ case. This case can be triggered by mistakes both in the question and in the\
    \ question’s keywords.\n+   \n+   3. The third case relates to questions where\
    \ the question’s keywords require modifications due to some mistakes in the question’s\
    \ original translation that propagate into the question’s keywords. We can find\
    \ this case in the question “What is the last work of Dan Brown?”, which got translated\
    \ to “Qué es el último trabajo de Y Marrón?”. In this case, the entity Dan Brown\
    \ was mistranslated to “Y ¿Marrón?”, resulting in error propagation into the question\
    \ keywords “último trabajo, Y marrón”. The correct keywords for this question\
    \ are “último trabajo, Dan Brown”.\n+   \n+   4. The fourth case is similar to\
    \ the third case; the difference is that the errors found in the question’s keywords\
    \ are not related to errors in the question’s translation. For example, words\
    \ are correctly written in the question’s translation but wrongly written in the\
    \ question’s keywords. In the question “Which monarchs were married to a German?”,\
