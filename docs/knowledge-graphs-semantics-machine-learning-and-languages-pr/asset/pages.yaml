  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_252_0.png)


    Figure 2. Overview of the platform data integration into the knowledge graph.


    Exchange (SPDX) License List [7]. Figure 1 shows the core concepts of the PlanQK
    ontology, i.e., algorithms, implementations, use cases, data pools and services.
    Still the primary focus of the semantic annotations in PlanQK lies in describing
    quantum-related information, it nevertheless encompasses also knowledge related
    to the classical computing. The reason for this is twofold: Firstly, quantum concepts
    are often related to classical, e.g., quantum algorithms can be inspired by the
    idea of their classical counterparts, and, secondly, due to several limitations
    of the quantum devices in the Noisy Intermediate-Scale Quantum (NISQ) [8] era,
    quantum-enhanced applications are currently mostly developed in a hybrid manner,
    i.e., contains both quantum and classical parts [9], [10].


    The semantification process of the PlanQK platform is depicted on Figure 2. The
    frontend of the platform allows users to create, modify and delete knowledge.
    For example, an user can create a new entry that describes an algorithm with a
    specific name and computation design, i.e., quantum, classical, or hybrid. The
    user can further modify the entry by filling various textual attributes, e.g.,
    acronym, intent, and solution, and select annotations from the controlled vocabulary,
    e.g., problem class and application area. Once the data is submitted, the backend
    of the platform manages the information insertion into the relational database⁵
    and triggers a request to a cloud messaging service, which publishes the message
    regarding the data changes to the particular channel. To receive notifications
    from the channel, the knowledge service requires an active subscription. If this
    is the case, the service obtains a message in the JSON format. The conversion
    of new data from JSON into RDF is facilitated by Karma [11] integration tool.
    Karma provides a semi-automatic approach to define a mapping model between


    ⁵ In the context of the PlanQK platform, the decision to use both a relational
    database and a knowledge graph for data storage is driven by considerations of
    security and component decoupling. In addition to the explicit content of the
    platform, the relational database contains the information about user rights.
    The decoupling of data storage is beneficial to facilitate the future expansion
    of the knowledge service for an ecosystem of similar platforms.'
