- pgno: 105
  md: '# 4.4. Results


    The results of the first benchmark configuration are presented in Figures 1 and
    2. Figure 1 shows that both TentrisGQL and TentrisGQLBase outperform Neo4jC across
    all query templates in all datasets, with TentrisGQL achieving 1.5 (QT2 and QT13)
    to 7.4 (QT3) times higher pAvgQPS than Neo4jC in the largest dataset, namely LinGBM1000.
    In addition, both TentrisGQL and TentrisGQLBase achieve higher median QPS than
    Neo4jC in all datasets (Figure 2). Figure 3 summarizes the results reported in
    the second benchmark configuration. We removed the query instance corresponding
    to QT5 from the second configuration’s query list because Neo4j was running out
    of JVM memory when this query was issued by multiple clients. TentrisGQL and TentrisGQLBase
    did not face any memory-related issues. Figure 3 shows that Neo4jC scales better
    than TentrisGQL and TentrisGQLBase when queried by 4 and 8 concurrent clients
    in the smallest dataset (i.e., LinGBM100). However, TentrisGQL and TentrisGQLBase
    achieve higher pAvgQPS than Neo4jC in all cases and in particular, TentrisGQL
    achieves 3.5 higher pAvgQPS in the case of 16 clients in LinGBM1000. To measure
    the overhead introduced by the rewriting of Neo4j’s results to GraphQL responses,
    we used the second benchmark configuration with one concurrent user. Table 3 shows
    that rewriting process leads to TentrisGQL achieving up to 8.4 times higher pAvgQPS
    than Neo4jGQL


    # 4.5. Discussion


    The performance of the systems did not vary significantly across all datasets.
    In particular, they were not significantly affected by the increasing size of
    the datasets. The systems’ performance was mostly affected by the average result
    size (aRS) of the query templates (Table 2). In particular, all systems achieved
    their highest and lowest pAvgQPS in all datasets in QT3 and QT5, respectively.
    QT3 has the lowest aRS, whereas QT5 has the highest. The depth of the query templates
    also affects the systems’ performance. For example, the pAvgQPS of the systems
    in QT6 is lower than in QT7, even though the latter has a higher aRS. Queries
    with higher values of depth require more left-join operations in TentrisGQL and
    longer path traversals in Neo4j.


    Another factor that impacts the performance of our GraphQL service is the size
    of the operands corresponding to leaf fields, which are evaluated via left-join
    operations. This observation is grounded in the performance of TentrisGQLBase
    (Figure 1), which is always equivalent to, or worse than, TentrisGQL’s performance.
    Recall that TentrisGQLBase, unlike TentrisGQL, evaluates leaf fields and arguments
    of type ID via left-join and join operations, respectively. Neo4j employs the
    property graph model, which allows it to represent leaf fields as node properties.
    Hence, for evaluating leaf fields, Neo4j does not iterate over all of a particular
    property key’s properties. Despite these additional operations, both TentrisGQL
    and TentrisGQLBase outperform Neo4j. This suggests that our algorithm does not
    introduce much overhead to the computations.


    The results of Table 3 are in line with the results reported in [18] and demonstrate
    the importance of GraphQL services being able to directly construct GraphQL responses.
    Regarding the memory usage, we measured the memory used by the systems in LinGBM1000
    when queried by 16 concurrent clients using pmap10. The highest Resident Set Size
    (RSS) reported by TentrisGQL and Neo4jC was 41GB and 44GB, respectively.'
