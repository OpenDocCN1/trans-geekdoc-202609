  md: 'Another perspective on the SUS scores is gained by considering the participant’s
    digital media affinity (DMA), which users were asked to indicate in a self-assessment
    on a six-point scale, in addition to their prior VR experience. Our DMA scale
    ranges from ‘very bad’ to ‘extremely good’. Nine participants who stated that
    they had a ‘good’ to ‘extremely good’ DMA have a SUS score between 62.5 and 92.5
    (avg. 77.8) and four participants who rated themselves as ‘very bad’ to ‘not bad’
    at using digital media have a SUS score between 45.0 and 70.0 (avg. 58.8). An
    independent samples t-test between the groups yields a p-value of 0.039 and an
    absolute t-value of 2.70, which shows a high influence of the stated DMA on the
    SUS score. We observed a positive Pearson correlation between DMA and SUS scores,
    r = 0.75. Based on the threshold values of Cohen[37], these effect size can be
    considered large. Two participants stated that they are regularly using VR applications.
    Their SUS scores are 70.0 corresponding to a ‘satisfactory’ rating and 82.5 corresponding
    to an ‘excellent’ rating. Eleven participants had no VR experience and had SUS
    scores between 45.0 and 92.5 (avg. 71.1). The broad range of SUS scores indicates
    that the lack of VR experience might not be of relevance regarding perceived usability.
    The p-value of 0.57 in an independent samples t-test for the SUS scores in the
    two groups with or without VR experience shows that the difference in the two
    groups is not statistically significant. Therefore, the quite high results in
    the group with VR experience can be seen as informed trends but need to be validated
    in further studies.


    # 6. Conclusion and Future Work


    We presented eTaRDiS, a VR exploration tool to support access to knowledge graphs
    for historians. In the presented user study, our tool achieved an overall SUS
    score of 71.92, corresponding to a ‘satisfactory’ rating. While the mean score
    reached with laypersons interested in history was quite high with 76.0, corresponding
    to a rating of ‘satisfactory to excellent’, the score for historians was lower
    with 69.4, corresponding to a ‘sufficient to satisfactory’ rating. Further analysis
    showed that participants who rated themselves as ‘good’ to ‘extremely good’ at
    using digital media have a higher mean SUS score of 77.8 compared to the participants
    who rated themselves as ‘very bad’ to ‘not bad’ at using digital media (mean SUS
    score: 58.8). The findings of the usability evaluation and the qualitative analysis
    of exploration patterns show the system’s potential to be a valuable tool for
    allowing digital humanities researchers and laypersons to explore knowledge graphs.
    With eTaRDiS, such users are able to reflect on their prior knowledge as well
    as generate new knowledge by discovering new relationships between historical
    fragments.


    In future work, we aim to integrate other historical databases to allow more diverse
    data to be explored using eTaRDiS. In addition, the feedback of the participants
    in the user study provided insights that we aim to integrate into eTaRDiS via
    further features specific to research purposes in historical studies.


