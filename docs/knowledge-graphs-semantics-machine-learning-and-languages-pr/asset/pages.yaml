  md: '# BiPaSs: Further Investigation of Fast Pathfinding in Wikidata


    Leon MARTIN a,1


    a Media Informatics, University of Bamberg, An der Weberei 5, 96047 Bamberg.

    ORCiD ID: Leon Martin https://orcid.org/0000-0002-6747-5524


    Abstract. Purpose: A previous paper proposed a bidirectional A* search algorithm
    for quickly finding meaningful paths in Wikidata that leverages semantic distances
    between entities as part of the search heuristics. However, the work lacks an
    optimization of the algorithm’s hyperparameters and an evaluation on a large dataset
    among others. The purpose of the present paper is to address these open points.
    Methodology: Approaches aimed at enhancing the accuracy of the semantic distances
    are discussed. Furthermore, different options for constructing a dataset of dual-entity
    queries for pathfinding in Wikidata are explored. 20% of the compiled dataset
    are utilized to fine-tune the algorithm’s hyperparameters using the Simple optimizer.
    The optimized configuration is subsequently evaluated against alternative configurations,
    including a baseline, using the remaining 80% of the dataset. Findings: The additional
    consideration of entity descriptions increases the accuracy of the semantic distances.
    A dual-entity query dataset with 1,196 entity pairs is derived from the TREC 2007
    Million Query Track dataset. The optimization yields the values 0.699/0.109/0.823
    for the hyperparameters. This configuration achieves a higher coverage of the
    test set (79.2%) with few entity visits (24.7 on average) and moderate path lengths
    (4.4 on average). For reproducibility, the implementation called BiPaSs, the query
    dataset, and the benchmark results are provided. Value: Web search engines reliably
    generate knowledge panels with summarizing information only in response to queries
    mentioning a single entity. This paper shows that quickly finding paths between
    unseen entities in Wikidata is feasible. Based on these paths, knowledge panels
    for dual-entity queries can be generated that provide an explanation of the mentioned
    entities’ relationship, potentially satisfying the users’ information need.


    Keywords. knowledge graphs, pathfinding, hyperparameter optimization, Wikidata


    # 1. Introduction


    To satisfy the users’ information need more quickly, the result pages of modern
    web search engines such as Google², Bing³, and Startpage⁴ feature a variety of
    components in addition to the standard ranking of search results. One prominent
    example are knowledge panels, which are typically located in the top right corner
    of the result pages. These'
