  md: '# Semantifying the PlanQK Platform and Ecosystem for Quantum Applications


    Darya MARTYNIUK a, Naouel KARAM a, Michael FALKENTHAL b, Yufan DONG a and Adrian
    PASCHKE a,c


    a Data Analytics Center DANA, Fraunhofer FOKUS, Berlin, Germany

    b Anaqor AG, Berlin, Germany

    c Institute for Computer Science, Freie Universität Berlin, Germany


    Abstract. Quantum computing is currently experiencing rapid progress. Due to the
    complexity and continuous growth of knowledge in this field, it is essential to
    store information in a way that allows an easy access, analysis and navigation
    over reliable resources. Knowledge graphs (KGs) with machine-readable semantics
    offer a structural information representation and can enhance the capabilities
    of knowledge processing and information retrieval. In this paper, we extend the
    platform and ecosystem for quantum applications (PlanQK) for a KG. Specifically,
    we describe how the quantum computing knowledge, which is submitted on the platform
    by researchers and industry actors, is incorporated into the graph. Moreover,
    we outline the semantic search over the PlanQK KG.


    Keywords. Knowledge Graph, Ontology, Semantic Web, Semantic Search, Faceted Search,
    Ontology-based Search, Quantum Computing


    # 1. Introduction


    Quantum computing has experienced notable growth in recent years leading to a
    corresponding increase of knowledge in this field. Access to a wide spectrum of
    scientific and business information, including publications, programming code,
    software, and hardware documentations is without doubt highly beneficial for further
    research and development of new technologies. However, it also means that finding
    relevant knowledge in quantum computing related sources has become an increasingly
    tedious and time-consuming task even when employing search engines. Knowledge
    graphs (KGs) have grasped significant potential for enhancing capabilities of
    search systems, facilitating more efficient information retrieval (IR) [1]. Representing
    data as a graph allows to define formal semantics and improves flexibility for
    integrating data from heterogeneous sources [1], [2].


    In this paper, we introduce an approach for organizing and curating the information
    available on PlanQK¹ - a collaborative platform and an ecosystem centered on quantum-enhanced
    applications - in form of a knowledge graph. The mission of PlanQK is to make
    the research and industrial knowledge about quan-'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_251_0.png)


    **Figure 1.** Core knowledge artifacts of the PlanQK ontology.


    tum software and solutions easily accessible as well as to offer the capability
    to deploy, host, execute and monetize quantum services. We present a pipeline
    for a continuous semantification of the data submitted by user. Furthermore, we
    outline native semantic search and faceted semantic search, which leverage indexed
    parts of the PlanQK KG to improve the retrieval of relevant information.


    This paper is structured as follows. In Section 2, we briefly introduce the PlanQK
    KG along with the underlying ontology and provide an overview of the semantification
    process of the platform data, i.e., its integration into the graph. In Section
    3, we describe the realization of KG-based semantic search and semantic faceted
    search. We give an outlook on future work and a conclusion in Section 4.


    # 2. PlanQK Knowledge Graph


    PlanQK KG provides a structured machine-interpretable representation of the platform
    knowledge by organizing information into named nodes and directed edges that represent
    specific relations between these nodes². Following the Resource Description Framework
    (RDF)³ standard, each node and property is identified by a Uniform Resource Identifier
    (URI). To query the graph, we utilize SPARQL [3] query language, which is widely
    used in Semantic Web applications.


    The *PlanQK Ontology* [4] serves as a formal schema of the PlanQK KG by defining
    selected computing concepts and relations between them in the context of the PlanQK
    platform. The ontology is publicly accessible to the research community including
    documentation and usage examples⁴. During the creation of the PlanQK ontology,
    we reviewed existing vocabularies that already encompass definitions of relevant
    concepts and reused certain ontologies, e.g., ML Schema [5], Subject Resource
    Application Ontology (SRAO) [6], and Software Package Data


    ² Note that the term “knowledge graph” encompasses various definitions in the
    literature. For an overview and a comprehensive introduction of KGs we refer to
    [2]. In this paper, we denote a *knowledge graph* as an ontology, which defines
    domain knowledge along with application data integrated into the ontology, i.e.,
    incorporated with machine-readable semantics.


    ³ https://www.w3.org/TR/rdf12-concepts/


    ⁴ https://github.com/PlanQK/semantic-services'
