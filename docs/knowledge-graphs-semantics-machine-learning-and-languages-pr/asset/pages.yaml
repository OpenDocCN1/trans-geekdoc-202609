  md: 'In practice, GraphQL services are implemented on top of data sources that adopt
    different data models (e.g., relational databases and graph databases). To provide
    the semantics of GraphQL queries in a unified manner, Hartig and Pérez [22] introduced
    the notion of GraphQL graphs. GraphQL graphs are logical constructs that abstract
    the underlying data sources of GraphQL services.


    # Definition 2.2 (GraphQL graph [22]) A GraphQL graph over (F,A,T) is a tuple
    G = (N,E,τ,λ,ρ) with the following elements:


    +   - N is a set of nodes,

    +   - E is a set of edges of the form (u, f[a], v), where u, v ∈ N, f ∈ F, and
    a is a partial mapping from A to Vals,

    +   - τ : N → O_T is a function that assigns a type to every node,

    +   - λ is a partial function that assigns a scalar value v ∈ Vals or a sequence
    [v₁ ... vₙ] of scalar values (vᵢ ∈ Vals) to some pairs of the form (u, f[a]) where
    u ∈ N, f ∈ F and a is a partial function from A to Vals,

    +   - ρ ∈ N is a distinguished node called the root node.


    # Definition 2.3 (GraphQL query [22]) A GraphQL query over (F,A,T) is an expression
    φ constructed from the following grammar where [, ], {, }, : and on are terminal
    symbols, t ∈ O_T ∪ I_T ∪ U_T, f ∈ F, ℓ ∈ Fields, and α is a partial mapping from
    A to Vals:


    φ ::= f [α] | ℓ : f [α] | on {φ} | f [α]{φ} | ℓ : f [α]{φ} | φ ... φ .


    # Example 2.2 Examples of GraphQL queries conforming to the GraphQL schema S of
    Example 2.1 are the following:


    ```

    φ₁ = people(lname: "Doe") { fname email } and

    φ₂ = companies { name employees { id lname } } .

    ```


    Both queries demonstrate the hierarchical structure of GraphQL queries. For example,
    φ₂ accesses fields in the first level that belong to the object type Company.
    In the second level, it accesses fields of the object type Person, as type_S(employees)
    = [Person].


    GraphQL queries of particular interest are those that are non-redundant and in
    ground-typed normal form. According to [22, Theorem 3.8], every GraphQL query
    can be transformed into an equivalent query that is non-redundant and in ground-typed
    normal form. An important characteristic of such queries is that their response
    can be constructed without being subjected to field collection [25, Section 6.3.2].
    This allows non-redundant GraphQL queries in ground-typed normal form to be evaluated
    in time linear to the size of their response [22, Corollary 4.3].


    # Definition 2.4 (GraphQL semantics [22]) Let G = (N,E,τ,λ,ρ) be a GraphQL graph
    and φ a non-redundant GraphQL query in ground-typed normal form, both conforming
    to a GraphQL schema S over (F,A,T). The evaluation of φ over G from node u ∈ N,
    denoted by ⟦φ⟧_G^u, is captured by Equation 1. The evaluation of φ over G, denoted
    by ⟦φ⟧_G, is simply ⟦φ⟧_G^ρ.'
