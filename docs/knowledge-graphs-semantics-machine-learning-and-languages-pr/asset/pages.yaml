- pgno: 101
  md: 'Regarding the enumeration of GraphQL queries, in [22], the authors study the
    enumeration problem for GraphQL queries that are non-redundant and in ground-typed
    normal form. Recall that such queries can be computed in time linear to the size
    of their response (Section 2.1). Each solution mapping generated by our algorithm
    captures a unique path of the response corresponding to the provided query. As
    our left-join algorithm computes a solution mapping entirely, we are able to directly
    construct the path that corresponds to a particular solution mapping, once it
    is evaluated. In addition, due to the recursive nature of our algorithm, the solution
    mappings of the sub-trees of a particular node of a GraphQL response share common
    values (Example 3.3). Hence, we are able to avoid visiting the nodes of a response
    multiple times.


    # 3.4. Implementation


    We have implemented the proposed algorithm within the tensor-based triple store
    Tentris [3]. Tentris achieves state-of-the-art performance in the evaluation of
    basic graph patterns, which are evaluated by a worst-case optimal multi-way join
    algorithm [3,34]. Our implementation, namely TentrisGQL, uses Tentris’ multi-way
    join algorithm (Algorithm 1, line 22), and tensor slicing operations to generate
    the operands of GraphQL queries.


    To bridge the gap between GraphQL schemata and RDF graphs, we follow Neo4j’s example⁴
    and define several directives in our implementation. As per the GraphQL specification,
    “directives can be used to describe additional information for types, fields,
    fragments and operations” [25, Section 3.13]. We mentioned in Section 3.1 that
    GraphQL types and fields need to be mapped to RDF terms. To this end, we define
    in our implementation the directive @uri. For example, the type definition type
    Person @uri(value: "http://www.exmpl.org/Person") maps the type Person to the
    RDF term http://www.exmpl.org/Person. As the inverse of a property is not always
    available in RDF graphs, we also define the field directive @inverse, which denotes
    that the inverse direction of a field’s property should be used. Last, we introduce
    the field directive @filter, which denotes that the results of a particular field
    should be filtered using that field’s type. This directive should be used on fields
    that are mapped to properties having ranges consisting of multiple RDF classes
    (Section 3.1).


    # 4. Experimental Results


    In this section, we present the performance evaluation of TentrisGQL, which we
    evaluated using the Linköping GraphQL Benchmark (LinGBM) [24]. LinGBM is a synthetic
    benchmark generator that provides a GraphQL schema that captures the structure
    of the generated datasets, and a set of 16 GraphQL query templates. To the best
    of our knowledge, LinGBM is currently the only publicly available benchmark for
    evaluating GraphQL services. The experiments that are presented below were carried
    out on a Debian 10 server with an AMD EPYC 7742 64-Core Processor, 1TB RAM, and
    two 3 TB NVMe SSDs in RAID 0. All artifacts (e.g., datasets, GraphQL schemata,
    queries, and system configurations) are available online.⁵'
