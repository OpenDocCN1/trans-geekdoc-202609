- pgno: 53
  md: '# QALD-9-ES: A Spanish Dataset for Question Answering Systems


    Javier SORUCO a,1, Diego COLLARANA a,b,2, Andreas BOTH c,d,3 and Ricardo USBECK
    e,4


    a Universidad Privada Boliviana, Cochabamba, Bolivia

    b Fraunhofer FIT, Sankt Agustin, Germany

    c Leipzig University of Applied Sciences, Leipzig, Germany

    d DATEV eG, Nuremberg, Germany

    e Universität Hamburg, Hamburg, Germany


    Abstract. Knowledge Graph Question Answering (KGQA) systems enable access to semantic
    information for any user who can compose a question in natural language. KGQA
    systems are now a core component of many industrial applications, including chatbots
    and conversational search applications. Although distinct worldwide cultures speak
    different languages, the number of languages covered by KGQA systems and its resources
    is mainly limited to English. To implement KGQA systems worldwide, we need to
    expand the current KGQA resources to languages other than English. Taking into
    account the recent popularity that Large-Scale Language Models are receiving,
    we believe that providing quality resources is key to the development of future
    pipelines. One of these resources is the datasets used to train and test KGQA
    systems. Among the few multilingual KGQA datasets available, only one covers Spanish,
    i.e., QALD-9. We reviewed the Spanish translations in the QALD-9 dataset and confirmed
    several issues that may affect the KGQA system’s quality. Taking this into account,
    we created new Spanish translations for this dataset and reviewed them manually
    with the help of native speakers. This dataset provides newly created, high-quality
    translations for QALD-9; we call this extension QALD-9-ES. We merged these translations
    into the QALD-9-plus dataset, which provides trustworthy native translations for
    QALD-9 in nine languages, intending to create one complete source of high-quality
    translations. We compared the new translations with the QALD-9 original ones using
    language-agnostic quantitative text analysis measures and found improvements in
    the results of the new translations. Finally, we compared both translations using
    the GERBIL QA benchmark framework using a KGQA system that supports Spanish. Although
    the question-answering scores only improved slightly, we believe that improving
    the quality of the existing translations will result in better KGQA systems and
    therefore increase the applicability of KGQA w.r.t. the Spanish language domain.


    Keywords. Knowledge Graphs, Question Answering, Dataset'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 1. Introduction


    The main goal of question-answering systems (QA systems) is to provide access
    to knowledge graphs via natural language, saving users from learning a specific
    graph query language to retrieve information from KGs. To achieve this goal, researchers
    have created different components and tools to mature the KGQA systems. These
    tools include benchmarking datasets to measure the quality of KGQA systems and
    datasets such as LC-QuAD [1] or QALD-9 [2] to train different KGQA components.
    Although natural language is the perfect medium for a comfortable experience for
    the end user, it also restricts who can take advantage of these systems. Recent
    developments in KGQA systems have heightened the need for multilingual tools and
    components. Ideally, KGQA systems should be available in various languages, making
    them accessible to diverse cultures. However, most KGQA research has focused mainly
    on English, leaving aside a significant number of languages, some of which are
    spoken by millions of people, e.g., Spanish, which is spoken by approximately
    427 million people and is the world’s second-most spoken native language⁵.


    QALD-9 is one of the few multilingual datasets that facilitate the development
    of KGQA systems in 11 languages. At the moment of writing this paper, QALD-9 is
    the only multilingual dataset available that provides Spanish translations. Unfortunately,
    most of the translations in QALD-9 are grammatically incorrect and unnatural⁶.
    Spanish is not the exception; after our analysis, we have found that the quality
    of Spanish translations of QALD-9 that have existed so far is relatively low.
    These issues go from poorly written translations to cases where the meaning of
    the original question is lost.


    QALD-9-plus [3] has addressed this problem by improving the quality of these translations
    with the help of native speakers. QALD-9-plus adds translations in languages that
    were not included in the original benchmark, creating a dataset with high-quality
    translations available for nine different languages (en, de, fr, ru, uk, lt, be,
    ba, hy) and two knowledge graphs: Wikidata⁷ and DBpedia⁸.


    In order to develop reliable KGQA systems for Spanish, the availability of high-quality
    resources that allow for training and testing of the systems becomes essential.
    We hope that improving the quality of a Spanish dataset will result in improved
    KGQA system performance for the given language. In this work, we aim to extend
    QALD-9-plus to include one additional language – Spanish. To achieve this goal,
    we manually created new translations with the help of native Spanish speakers.
    We also evaluated the results using language-agnostic quantitative text analysis
    measures and the tool GERBIL QA [4] to compare the results of the original translations
    and the new translations; we named the new translations “QALD-9-ES”.


    We address the problem of providing KGQA tools in multiple languages and propose
    QALD-9-ES, a KGQA dataset based on QALD-9 that contains accurate Spanish translations.
    We integrate QALD-9-ES with QALD-9-plus, complementing this multilingual dataset
    containing accurate natural translations with Spanish. Extending the scope of
    trustful translations for a dataset is essential for creating multilingual systems
    that serve a diverse population. In summary, the contributions of this work are
    as follows:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - A three-fold process to analyze KGQA datasets, i.e., Qualitative Analysis,
    Translations Review, and Quantitative Analysis. We apply this process to analyze
    the quality of the Spanish language in the QALD-9 dataset.

    +   - A publicly available KGQA dataset with accurate Spanish translations. We
    integrate our work with QALD-9-plus to increase its adoption.

    +   - An evaluation of our QALD-9-ES dataset against KGQA systems using the GERBIL
    QA framework and showing improvements in most of the metrics compared to its predecessor.


    This article is organized into the following sections: (2) previous work, (3)
    dataset development and description, (4) baseline evaluation, and (5) conclusions.


    # 2. Previous Work


    For the elaboration of this work, we reviewed KGQA datasets and related tools
    to develop and compare KGQA datasets. Table 1 summarizes each dataset’s information
    showing the lack of accurate Spanish translations.


    Table 1. For existing KGQA datasets, we show the number of unique questions and
    available languages. QALD-9 is the only dataset available for the Spanish language,
    but it suffers from quality issues.


    | Dataset | Available for | No. of questions | Available languages |

    |---|---|---|---|

    | QALD-9 | DBpedia | 558 | en, it, de, ru, fr, pt, hi.IN,fa, ro, es, nl |

    | QALD-9-plus⁹ | DBpedia | 558 | en, lt, de, ru, fr, uk, be, ba, hy |

    | QALD-9-plus⁹ | Wikidata |  |  |

    | rewordQALD9 | DBpedia | 551 | en, it |

    | LC-QUAD | DBpedia | 5000 | en |

    | LC-QUAD 2.0 | DBpedia | 30000 | en |

    | LC-QUAD 2.0 | Wikidata |  |  |


    # 2.1. KGQA Datasets


    # 2.1.1. QALD-9, the 9th Challenge on Question Answering over Linked Data (QALD-9):


    QALD is a challenge with eleven years of history with the objective of providing
    up-to-date benchmarks for assessing and comparing state-of-the-art KGQA systems¹⁰.
    QALD-9 [2] is the 9th edition of the QALD challenge. This dataset provides 408
    training questions and 150 test questions for DBpedia, available in 11 different
    languages, making QALD-9 one of the few multilingual KGQA benchmarks available
    and the only one we are aware of that counts with Spanish translations. In the
    9th version of QALD, the questions were compiled and curated from previous versions
    and are accompanied by manually specified SPARQL queries and answers. The community
    reported multiple issues with the translations in the QALD-9 dataset; they were
    reported to be incorrect and of poor quality for different languages [3]. After
    reviewing the Spanish translations, we'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'found that Spanish was not the exception. We detail the issues found with the
    Spanish translations in Section 3.1. The QALD-9 dataset works with the QALD-JSON
    data format, which allows multiple languages, and it is used as a communication
    format with systems like GERBIL QA [4].


    # 2.1.2. QALD-9-plus, a Multilingual Dataset for Question Answering over DBpedia
    and Wikidata Translated by Native Speakers:


    QALD-9-plus [3] is an initiative to fight the lack of multilingual KGQA benchmarks
    and the translation issues of QALD-9. This dataset provides an extended version
    of QALD-9 with 4,930 new question translations for different languages. The translations
    were done via crowdsourcing. Each crowd worker was assigned a subset of QALD-9
    questions to translate into their mother tongue, resulting in at least two translations
    per question. Crowd workers were later given two translations and the original
    question, and they had to decide whether the first or second translation was correct
    or whether both or no translations were correct. The QALD-9-plus dataset also
    includes a version of the dataset for Wikidata that was generated manually by
    three experienced computer scientists with the help of semi-automatic scripts
    to speed up the process. The result is an extended version of the QALD-9 dataset
    available for nine languages (English included) with high-quality translations,
    adjusted to work with both DBpedia and Wikidata knowledge graphs.


    # 2.1.3. RewordQALD9, a Bilingual Benchmark with Alternative Rewordings of QALD
    Questions:


    rewordQALD9 [5] is an extended version of the QALD-9 dataset that brings forward
    high-quality Italian translations with multiple reformulations for the same question.
    Rewordings are available for both Italian and English; therefore, testing systems’
    robustness is available for both languages. The translations were manually curated
    by native speakers, including reformulations for both English and Italian. The
    resulting dataset consists of 551 questions in both English and Italian. In addition,
    multiple question reformulations are included, i.e., 1546 for English and 1707
    for Italian.


    # 2.1.4. LC-QuAD, a Corpus for Complex Question Answering over Knowledge Graphs:


    LC-QuAD [1] is the solution to the necessity of large datasets composed of various
    question templates and their logical forms for QA systems. LC-QuAD is generated
    based on an entity seed list and a predicate whitelist to obtain subgraphs from
    DBpedia. Then the graphs are used to generate a SPARQL from a template, which
    generates a natural language question from Normalized Natural Question Templates.
    Finally, the questions are manually reviewed and corrected. LC-QuAD is composed
    of 5000 questions, and the SPARQL queries are required to answer the questions
    on DBpedia. It was one of the most extensive datasets available for KGQA at the
    time of release. This dataset is only available in English; therefore, it is not
    multilingual.


    # 2.1.5. LC-QuAD 2.0, a Large Dataset for Complex Question Answering over Wikidata
    and DBpedia:


    LC-QuAD 2.0 [6] is the second version of LC-QUAD, providing 30,000 questions with
    their paraphrases and corresponding SPARQL queries. LC-QuAD 2.0 is compatible
    with Wikidata and DBpedia 2018 knowledge graphs. To generate the dataset, the
    authors gen-'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'erated SPARQL queries based on templates, which were then transformed into
    template questions. By using crowdsourcing, the template questions were verbalized
    into natural-language questions. This dataset, like its predecessor, is only available
    in English.


    # 2.2. *Tools Related to KGQA Systems and Benchmarks*


    # 2.2.1. *Benchmarking Question Answering Systems:*


    GERBIL QA [4] is an online benchmarking platform for question-answering systems
    (derived from the GERBIL tool for evaluating entity recognition approaches, cf.
    [7]). GERBIL QA follows the FAIR principles to provide a quality evaluation of
    QA systems. This platform allows users to benchmark their systems with relevant
    datasets such as QALD and LC-QuAD. GERBIL QA also allows its users to upload their
    datasets. The platform is connected to relevant KGQA solutions so that the users
    can compare their systems with the relevant systems available; these systems can
    work with any private dataset uploaded by the users only if this dataset uses
    the QALD-JSON format. GERBIL QA offers seven metrics for benchmarking QA systems
    and supports online and file-based systems.


    # 2.2.2. *Question Answering Benchmark Curators*


    QUANT [8] is a framework for creating or curating QA benchmarks, generating smart
    edit suggestions for questions-query pairs and their metadata, and providing predefined
    quality checks for queries. QUANT reduces the curation effort for QA benchmarks
    by up to 91%. QUANT is a suitable tool during the KGQA dataset development process,
    e.g., QALD-9 used QUANT.


    # 3. QALD-9-ES Dataset Development and Description


    # 3.1. *Qualitative Analysis of QALD-9*


    The QALD-9 dataset comprises 558 questions, of which 408 correspond to the training
    dataset and 150 to the testing dataset. Each question contains a list of question
    objects for every available language. A question object is composed of the question
    string and the question keywords. The question string is the question expressed
    in a given language (e.g., Spanish), and the question’s keywords are key elements
    of the question that the KGQA system can use as support to answer questions for
    the given language. These keywords are usually related (but not restricted) to
    proper entity names, verbs, nouns, and adjectives.


    As we mentioned before, QALD-9 already has Spanish translations; after an explorative
    review, we concluded that the quality of the Spanish translations is doubtful.
    Thus, we decided to review all the original translations, classifying each translation
    into seven cases.


    Cases 1 to 6 correspond to error cases, which can be split into cases with errors
    in the question string (cases 1, 2, 5, and 6), or cases with mistakes in the question
    keywords (cases 3, 4), while case 7 implies a correct translation.


    Each question can be assigned to multiple cases, with the only exception being
    case 7. If a sentence follows into Case 7, it implies a correct translation; therefore,
    it cannot be'
