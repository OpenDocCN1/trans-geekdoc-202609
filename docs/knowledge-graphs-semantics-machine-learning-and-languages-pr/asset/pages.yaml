  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_20_0.png)


    Figure 2. Knowledge Graph class (○) and instance (◇) entities (Gender, Sex, and
    Sexual Orientation [35]). (A) Matching “X-gender” to text. (B) Hierarchical entity
    expansion of “lesbian” and “fag”. Entities in bold are used to match or assign
