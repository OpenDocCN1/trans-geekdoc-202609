    # 3. Design and Implementation of eTaRDiS


    This section describes the design and implementation of eTaRDiS. First, we provide
    an overview of the types of users that the system is intended to support and how
    their needs differ. We then describe the actual implementation of the system,
    emphasizing our key design choices to meet the needs of our target users.


    # 3.1. *User Groups*


    Opening up the virtual space for the field of humanities and cultural studies
    also meant designing eTaRDiS to be intuitively usable and making it easily accessible
    to historians, laypersons interested in history, and people with an affinity for
    technology and an interest in VR. The eTaRDiS is intended for three stereotype
    users: Historians that are experts in a specific area of historical scholarship
    or that are academically active in that area, laypersons who are interested in
    history and cultural studies, and users who have no affinity for dealing with
    cultural or historical data. In our user study, we investigate the perspective
    of historians and laypersons.


    The user group of historians knows research discourses and their contexts. In
    the composition of the sub-dataset, this group is able to translate their research
    perspectives in a very fine-granular way into the filter options offered by eTaRDiS
    and thus operationalize their questions. Exploration in the Fragmentarium not
    only provides an overview but also encourages them to change their perspective
    on a topic. The user group of laypersons includes not only people who have a basic
    affinity for history but also those who are on their way to a degree in the field
    of cultural and historical studies. In their use of eTaRDiS and their choice of
    filters, they are clearly more open and less specific than described in the first
    user scenario because they go into eTaRDiS with a broader view. It can be assumed
    that they use the insular knowledge they have acquired over the years and select
    a topic for their exploration against this background. They are concerned with
    the controlled reduction and expansion of complex units of information. They use
    their time in the Fragmentarium to gain overviews and consume the (text and image)
    data deposited for the information much more intensively.


    # 3.2. *Implementation*


    The eTaRDiS system consists of a VR application and a backend database. The VR
    application has been implemented using the *Unity* game engine², so that it supports
    the visualization of and interaction with knowledge graphs in a *3D* immersive
    environment. The VR application consists of two virtual spaces: the *Hub* and
    the *Fragmentarium*. These spaces are clearly separated by different purposes
    and forms of interaction.


    ² Although we specialized our developments on the *HTC Vive*³, the underlying
    concepts are applicable to other VR hardware as well.

    ³ https://www.vive.com/de/product/vive-pro/'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 3.2.1. Hub


    The Hub serves as a central retreat within the virtual environment of eTaRDiS
    in which basic settings such as language, type of keyboard input, etc. can be
    edited. In addition, the Hub is the starting point for virtual data exploration.
    An appropriate interface enables the user to filter the data to create a sub-dataset
    adequately tailored for individual (research) interests (see Figure 1), which
    can then be subsequently visualized and explored in the subsequent room, the Fragmentarium.


    In order to allow users to get an overview of selected data, information about
    the filtered sub-dataset is dynamically displayed on a dashboard to allow a user
    to filter the dataset according to individual interests. In addition to a display
    of the total amount of nodes (fragments) in the created sub-dataset, temporal
    and spatial information is shown. Statistics are displayed for the entire sub-dataset,
    and the spatial distribution of the individual fragments becomes visible on a
    world map. Based on this information, initial considerations can already be made
    for selected filters.


    In addition to filtering, the Hub interface allows loading saved points and presets.
    Saved points allow a user to continue a session at a later point in time and thus
    to start at the same point in the Fragmentarium, while presets can be used to
    save and load defined filters. presets can also be edited later.


