- pgno: 106
  md: '# 5. Related Work


    Recently, several graph storage solutions have made efforts to allow users to
    access their data via GraphQL. Dgraph [16] is a distributed graph database that
    natively supports GraphQL. It also provides its own query language, namely DQL.
    In Dgraph, GraphQL operations are translated to DQL operations. However, response
    objects are constructed following the GraphQL specification. Hence, a rewriting
    of the results is not required. We did not include Dgraph in our experiments for
    two reasons. First, Dgraph does not fully support RDF, as it is not able to handle
    URIs. Additionally, Dgraph’s GraphQL service expects predicates to be prefixed
    with their subject’s type. Consequently, existing RDF graphs need to be substantially
    modified to be stored in a Dgraph instance. Second, Dgraph does not provide a
    bulk loader for its GraphQL service; hence it is not able to load large knowledge
    graphs efficiently.^{11} In addition to the translation tools used in Section
    4, Neo4j provides a library that serves as a middleware between applications and
    database instances. This library^{12} is responsible for the translation process
    of GraphQL queries to Cypher queries. Regarding triple stores, Stardog [37] and
    the commercial edition of GraphDB [9] provide GraphQL support by translating GraphQL
    to SPARQL. Virtuoso [8] introduced a GraphQL plugin^{13} that allows its users
    to query RDF graphs via GraphQL. To bridge the gap between GraphQL and SPARQL,
    this plugin relies on OWL ontologies to map the types and fields of GraphQL schemas
    to RDF terms. We did not include Virtuoso in our experiments as it does not perform
    type filtering in inner fields, which leads to queries returning incorrect results.^{14}


    # 6. Conclusion and Future Work


    We presented an approach for the native evaluation of GraphQL queries over RDF
    graphs. As GraphQL queries require left-join operations, we focused on the development
    of a novel mutually left-join algorithm that is inspired by worst-case optimal
    multi-way join algorithms. Similarly to worst-case optimal multi-way join algorithms,
    the proposed left-join algorithm recursively evaluates queries on a per variable
    basis, which allows for the incremental enumeration of GraphQL queries. By implementing
    our approach within the tensor-based triple store Tentris, we provide the first
    publicly available triple store that treats GraphQL as a first-class citizen.
    The performance evaluation of our implementation demonstrates the efficiency of
    the left-join algorithm, as our implementation outperforms a state-of-the-art
    graph database, namely Neo4j.


    Our implementation currently supports the features of the language that are required
    by its formal semantics (Equation 1). Our future work will focus on extending
    our GraphQL service with all features from the specification. To the best of our
    knowledge, there have not been any works that focus on evaluating SPARQL queries
    requiring left-join operations on a variable basis. To this end, we plan to use
    our approach for the evaluation of such SPARQL queries (i.e., queries containing
    optional graph patterns).


    ^{11} https://discuss.dgraph.io/t/graphql-vs-dql-dgraph-blog/14311; see paragraph
    “When not to use GraphQL”.

    ^{12} https://neo4j.com/docs/graphql-manual/current/

    ^{13} https://community.openlinksw.com/t/introducing-native-graphql-support-in-virtuoso/3378

    ^{14} https://github.com/openlink/virtuoso-opensource/issues/1115'
