- pgno: 93
  md: 'Recently, GraphQL, a query language for APIs, has attracted the attention of
    both the graph database [16,17] and the semantic web [18,19,20,21] communities.


    The focus of the semantic web community regarding GraphQL has been on the development
    of query translation tools [18,20,21]. These tools translate GraphQL queries into
    SPARQL queries, which are then issued to a triple store. A drawback of such solutions
    is that the results produced by triple stores need to be rewritten, since GraphQL
    dictates a strict response format. This process adds a significant overhead to
    the execution of queries [18, Table 3], especially in cases where the results
    are large. To the best of our knowledge, there are no publicly available triple
    stores that treat GraphQL as a first-class citizen.


    While most constructs for processing basic graph patterns can be exploited in
    a straightforward manner for GraphQL processing, the formal semantics of GraphQL
    [22] demand the use of left-join operations for the evaluation of GraphQL queries.
    However, conventional two-way left-join operations are not suitable for the evaluation
    of GraphQL queries, as the results of such queries can be constructed incrementally
    [22]. We hence focus on presenting a novel multi-way left-join algorithm inspired
    by worst-case optimal join algorithms [23], which can be used to enumerate GraphQL
    queries incrementally. By implementing our approach into a state-of-the-art triple
    store, we provide the first publicly available triple store that treats GraphQL
    queries as first-class citizens. We carried out an extensive evaluation using
    a synthetic benchmark generator, namely LinGBM [24], and the results suggest that
    our implementation is able to outperform a state-of-the-art graph storage solution
    providing GraphQL support, namely Neo4j.


    The rest of this paper is structured as follows. The preliminaries are provided
    in Section 2. In Section 3, we present our multi-way left-join algorithm and show
    how to natively evaluate GraphQL queries over RDF graphs. We evaluate our approach
    in Section 4. We discuss related works in Section 5 and conclude in Section 6.


    # 2. Preliminaries


    Here, we introduce the concepts and the semantics of GraphQL that we use throughout
    this work along with their formal definitions as per [22]. We also briefly introduce
    worst-case optimal multi-way join algorithms, which have inspired our proposed
    algorithm.


    # 2.1. GraphQL


    GraphQL is a query language that was designed to simplify communication between
    clients and application servers. One of the main characteristics of GraphQL is
    that it is strongly typed. GraphQL services—i.e., servers and data sources whose
    data can be accessed and modified via GraphQL operations—expose a GraphQL schema
    to their clients by which incoming requests must abide. This schema defines a
    type system that describes the structure of the underlying data of the GraphQL
    service and the operations the service supports. Another important aspect of GraphQL
    is the hierarchical structure of its operations and responses. GraphQL operations
    form a tree structure that specifies the traversal on top of the underlying graph
    and the information that should be extracted from the nodes at each step of the
    traversal. In turn, the responses should follow the hierarchy defined by their
    respective operation. The syntax and capabilities of GraphQL,'
  merge: -1
  img_proc: true
- pgno: 94
  md: "as well as the responsibilities of GraphQL services, are detailed in the language’s\
    \ official specification [25]. Even though the specification describes how services\
    \ should handle the requests they receive, it does not provide a formal specification\
    \ of the semantics of the language. Consequently, studying the expressiveness\
    \ and complexity of the language remained a challenge. To tackle the lack of formal\
    \ semantics and the consequences thereof, Hartig and Pérez [22] provide formal\
    \ semantics for GraphQL queries that consist of fields, field aliases and inline\
    \ fragments. The semantics rely on the formal definition of GraphQL schemata and\
    \ graphs as well as the formalized syntax of GraphQL queries. Here, we reintroduce\
    \ the definitions presented in [22].\n\nThe formal definitions presented below\
    \ rely on the following sets. Let Fields be an infinite set of field names and\
    \ F ⊂ Fields a finite subset of Fields. Let A and T be finite sets of argument\
    \ names and type names, respectively, where T is the disjoint union of O_T (object\
    \ type names), I_T (interface type names), U_T (union type names) and Scalars\
    \ (scalar type names). Last, let L_T = {[t] | t ∈ T} be the set of list types\
    \ constructed from T and Vals be a set of scalar values.\n\n# Definition 2.1 (GraphQL\
    \ schema [22]) A GraphQL schema S over (F,A,T) is composed of the following components:\n\
    \n+   - fields_S : (O_T ∪ I_T) → 2^F that assigns a set of fields to every object\
    \ type and every interface type,\n+   - args_S : F → 2^A that assigns a set of\
    \ arguments to every field,\n+   - type_S : F ∪ A → T ∪ L_T that assigns a type\
    \ or a list type to every field and argument, where arguments are assigned scalar\
    \ types,\n+   - union_S : U_T → 2^O_T that assigns a nonempty set of object types\
    \ to every union type,\n+   - impl_S : I_T → 2^O_T that assigns a set of object\
    \ types to every interface,\n+   - root_S ∈ O_T that represents the query root\
    \ type.\n\n# Example 2.1 Consider the following GraphQL schema S\n\n```\ninterface\
    \ Entity {\n  id:String\n  email:String\n}\ntype Person impl Entity {\n  id:String\n\
    \  fname:String\n  lname:String\n  email:String\n  age:Int\n}\ntype Company impl\
    \ Entity {\n  id:String\n  name:String\n  email:String\n  employees:[Person]\n\
    }\ntype Query {\n  people(lname:String):[Person]\n  companies:[Company]\n}\nschema\
    \ { query:Query }\n```\n\nLet F = { people, companies, employees, fname, age,\
    \ id, lname, email, name }, A = { lname }, O_T = { Query, Company, Person }, I_T\
    \ = { Entity }, U_T = {}, and Scalars = { String, Int }. The GraphQL schema S\
    \ is formalized over (F,A,T) as follows (we omit several assignments for brevity):\n\
    \nargs_S(people) = {lname}, fields_S(Entity) = {id, email}, type_S(id) = String,\
    \ fields_S(Person) = {id, fname, lname, email, age}, root_S = Query."
