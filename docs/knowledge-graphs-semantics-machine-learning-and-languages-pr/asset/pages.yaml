    altruism activity (as represented by the (O) arrow), which is sent annually to
    the national authority for verification of compliance (as represented by the (M)
    and (N) arrows). This record must log the activity of the data altruism organisation
    and provide information regarding the nature and categories of data that it works
    with. In addition, such records need to keep logs regarding the users of data,
    their contact details, the date and duration of the processing, the altruistic
    purpose for which the data was used, the fees paid by data users or any other
    sources of income, the technical means used for the processing, as well as a summary
    of the results of said processing.


    # 2.3. Use Case U3: Allowing Data Altruism


    DGA’s Article 25 discusses the implementation and development of a “European data
    altruism consent form”, which shall be developed by the European Commission (as
    represented by the (R) arrow in Figure 1), after consulting with GDPR’s watchdog
    European Data Protection Board, with the soon-to-be-created European Data Innovation
    Board and with other interested stakeholders. This form should be adopted by the
    data altruism organisations (as represented by the (S) arrow) to record both the
    consent given by data subjects to share their personal data and the permissions
    given by data holders to share their non-personal data. These forms should be
    kept in both a human and machine-readable format and, as such, are the focus of
    Use Case U3 as semantic technologies, such as ODRL and DPV, can be used to create
    an electronic rendition of these documents.


    # 3. Related Work


    Jurisdictional data-related laws, such as the DGA or the Data Act, specify obligations
    and requirements based on the context, purpose, and entities involved in how the
    data is obtained, used, and shared. For a system to conduct, document, and verify
    compliance-related activities, such as the maintenance of public registers and
    records of activities, different types of information need to be represented:
    (i) the obligations and requirements; (ii) the personal, non-personal and public'
