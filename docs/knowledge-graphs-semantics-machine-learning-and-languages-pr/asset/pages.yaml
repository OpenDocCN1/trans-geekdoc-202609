    computation is simplified to $x_i^T \cdot y_j$. Furthermore, Precision (P), Recall
    (R), and F₁ scores are computed based on BERTscores as follows:


    $$P_{\mathrm{BERT}}=\frac{1}{|x|}\sum_{x_i\in x}\max_{y_j\in y}x_i^T\cdot y_j
    \tag{1}$$


    $$R_{\mathrm{BERT}}=\frac{1}{|y|}\sum_{y_j\in y}\max_{x_i\in x}x_i^T\cdot y_j
    \tag{2}$$


    $$F_{1_{\mathrm{BERT}}}=2\times\frac{R_{\mathrm{BERT}}\cdot P_{\mathrm{BERT}}}{R_{\mathrm{BERT}}+P_{\mathrm{BERT}}}
    \tag{3}$$


    **Human Evaluation.** In the absence of reference summaries, crowdsourcing services
    have become an effective alternative to easily and quickly recruit users (i.e.,
    crowdworkers) in performing manual evaluations of DBpedia abstractive summarization.
    We used the *SurgeHQ*⁶ crowdsourcing platform to conduct our experiments, as illustrated
    in [Figure 3](#). We bounded the evaluation of generated summaries to crowdworkers
    who are fluent in the target languages. The evaluation procedure contained two
    main tasks: i) crowdworkers were instructed to select the most appropriate summary
    that best summarized the full DBpedia abstracts. In particular, they compared
    the summaries LLMs-generated summaries to the shortened DBpedia abstracts and
    ii) they rated each summary, including the shortened ones, using a 4-point *Likert
    scale*, according to the following criteria:


    +   - *Informativeness* measures how well a generated summary captures the essential
    information in the source text. A summary is informative if it accurately represents
    the main ideas and critical points of the original content.

    +   - *Coherence* relates to the logical flow and organization of the summary,
    ensuring that the ideas and concepts are clearly presented and connected. A summary
    is coherent if it is easily comprehensible and maintains a well-structured narrative
    that conveys the main points without confusion.

    +   - *Conciseness* assesses how effectively a summary expresses the essential
    information from the source text in a clear and succinct manner, without unnecessary
    repetition or wordiness. A summary is concise if it conveys the key points using
    the minimum number of words possible, making it an efficient representation of
    the original content.


