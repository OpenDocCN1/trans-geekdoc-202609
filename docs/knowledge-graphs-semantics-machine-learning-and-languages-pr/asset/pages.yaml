- pgno: 179
  md: 'described in [22]. Apart from urban spaces, several projects aim at a detailed
    reconstruction of distinguished architectural objects. For example, Florence4D¹⁰
    is an initiative to revive prominent buildings of the Renaissance Florence. Similarly,
    the project "Digital Reconstruction of the Breslau Synagogue"¹¹ aims at reconstructing
    the largest synagogue in Breslau. A semantic information model will be presented,
    connecting objects with the resources used for the reconstruction. Additionally,
    the synagogue will be put into the social context by linking it to persons, corporate
    bodies, historical events, etc. Furthermore, there are several projects that utilize
    open source HBIM (Historic Building Information Modeling) software¹²[7], including
    the HBIM Wiki Project¹³, which aims to create an open database of historical buildings,
    the OpenHeritage project¹⁴ that documents and conserves historic buildings across
    Europe, the H-BIM platform¹⁵ and the Arches-HBIM project¹⁶, which integrate HBIM
    with heritage management systems. In the context of these efforts, TRANSRAZ aims
    at not only 3D reconstructing of the entire urban environment of Nuremberg in
    1910, but at enhancing the VRE via connecting its architectural objects to knowledge
    from external resources. To enable the enrichment, interoperability and reuse,
    tangible (e.g., historical buildings, places, documents) and intangible (e.g.,
    festive events, traditions, life lines of persons) cultural heritage is meaningfully
    represented my means of ontologies.


    Cultural heritage objects vary significantly in media type and attributes, however,
    they still share semantic similarities and benefit from cross-connections. The
    last decades have shown that semantic interlinking and representation of heterogeneous
    cultural heritage data is of interest for many research projects. There have been
    attempts to semantically model the data of Korean [21], Italian [6] and Finnish
    [18] national heritage. As part of the Europeana Project, the European Data Model
    (EDM) [9] was developed to provide a shared ontology infrastructure for cultural
    data from European GLAM institutions. All these data models are similar in nature
    of modeling, since the main reference for the models is the Conceptual Model CIDOC-CRM
    [8], a domain ontology of cultural heritage. Recently German National Library
    (DDB) has launched an initiative to develop the DDB Knowledge Graph and, thus,
    to enhance the frontend of the DDB. This is due to the complicated modeling of
    the EDM that negatively influences the usability and exploration of the data [25].
    Despite CIDOC-CRM being also not fully sufficient for the user-oriented purposes
    of TRANSRAZ data model, for reasons of interoperability, the TRANSRAZ data model
    follows the best practices and provides a mapping to CIDOC-CRM.


    A challenge of the modeling of TRANSRAZ space is the heterogeneity of the cultural
    heritage data that is obtained from a great amount of various resources, and that
    has to be represented in a direct connection with each other. This challenge can
    be addressed by exploiting existing ontologies and vocabularies. Related work
    towards modeling specific building blocks and design choices is discussed in section
    3.2.'
