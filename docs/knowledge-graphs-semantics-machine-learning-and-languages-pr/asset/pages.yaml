  md: 'sertions made in a graph by the information providers [22]. In this case, a
    provenance researcher can identify a single source of knowledge containing various
    statements. It is up to information consumers to decide whether or not they can
    trust the information provider and how reliable the information is.


    **PROV-DM** [28] is a conceptual model for modelling provenance, with PROV-O being
    a mapping to RDF^12 with proven applicability in the cultural heritage domain
    [21,29]. In our model it is used for attaching data provenance to a named graph
    URI. A typical use case for PROV-DM is to achieve data quality, traceability and
    trustworthiness. The **Entity**, **Activity** and **Agent** classes are the building
    blocks for the model. According to the model, any physical, digital or conceptual
    things can be a **prov:Entity**, where an **prov:Activity** is any action that
    occurs over a time-period, and **prov:Agent** is any actor who is responsible
    for the action. Therefore, in our case, the named graph containing all triples
    from the provenance research is of type **prov:Entity**, the provenance research
    activity itself is of type **prov:Activity**, and the institution or the person
    who are involved with this research is a **prov:Agent**. Representing provenance
    research and derived statements is one example of how we modelled different statements
    generated from different resources and activities. In Figure 2, the named graph
    ex:story#1 includes all data triples associated with object RV-2584-169a, which
    were generated during the research activity ex:provenance_research#2. This activity
    is an instance of **prov:Activity** in accordance with the PROV-DM ontology, enabling
    data provenance tracing for the generated triples.


    # *4.4. Polyvocal Modelling*


    Data provenance modelling and named graphs can be used to group (CIDOC-CRM) triples
    that conform to a particular view of acquisition and distinguish them from other
    statements that conform to another view. Figure 2 shows how named graphs separate
    different (CIDOC-CRM) triples representing specific views of acquisition and how
    data provenance of such named graphs is specified using the PROV-DM ontology.
    When querying for a particular object provenance with SPARQL 1.1, triples stating
    object provenance can be returned without making any distinction in acquisition
    theory. By using the GRAPH keyword, information from only specified (provenance)
    graphs can be returned. This allows attaching a source, location and/or time period
    to that view and responsible agents/sources for a group of statements. Each named
    graph or triple collection is represented as a **prov:Entity**, typically derived
    from (*prov:wasDerivedFrom*) another **prov:Entity** (i.e., source) or generated
    by (*prov:wasGeneratedBy*) a **prov:Activity** (i.e., a domain research activity).


    # **5. Results and Validation**


    This section reflects on the RDF triples generated from converting object provenance
    reports using the proposed model. Six objects were initially used for modeling
    decisions, and five more were randomly selected from the Pilotproject Provenance
    Research on Objects of the Colonial Era (PPROCE)^13 project to test the model’s
    generalizability. The re-


