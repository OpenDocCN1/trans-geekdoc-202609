  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_38_0.png)


    Figure 2. The pipeline of abstractive summarization of DBPEDIA using language
    models.


    # 3.1. Preprocessing


    We note that advanced language models such as BART and T5 are pre-trained on large-scale
    text corpora and can handle variations in capitalization, stopwords, and word
    forms [27]. Thus, we do not need to preprocess the text with lowercase, stopword
    removal, and stemming or lemmatization before applying these models for text summarization.
    However, we need to format the input text according to the specific requirements
    of the language models [8, 28]


    +   - **Tokenization:** Tokenization is the process of breaking down text into
    smaller units, called tokens, that can be characters, subwords, or words. Language
    models require input text to be tokenized using their own tokenizers, which handle
    punctuation and special characters appropriately as well as maintain compatibility
    with the model''s preprocessing requirements.

    +   - **Truncating and Padding:** To ensure a uniform length of input sequences
    for language models, input text that is longer or shorter than a predefined maximum
    length needs to be padded or truncated. The padding process involves appending
    special tokens, such as ⟨pad⟩, to the end of shorter sequences, while truncation
    requires removing excess tokens from longer sequences.

    +   - **Formatting:** Language models require specific input formatting to distinguish
    between different tasks. For a text summarization task, a task prompt (e.g., "summarize")
    should be used to indicate the desired output.'
