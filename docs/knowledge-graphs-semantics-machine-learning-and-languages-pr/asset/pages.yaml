    of GraphQL queries.


    # 3.1. GraphQL Query Operands


    In the case of SPARQL, there are multiple features of the language that generate
    query operands, with the most common being the triple pattern. In the case of
    GraphQL, an operand needs to be generated for each field, argument and inline
    fragment of a query. Here, for simplicity, we use a notation that resembles SPARQL’s
    triple patterns and present how to generate the operands of GraphQL queries. Note
    that we do not actually translate GraphQL queries to SPARQL queries. Potential
    implementations are free to use any means available (e.g., indices) for generating
    these operands. For the generation of GraphQL query operands, we must also map
    the types and fields of the provided GraphQL schema to RDF terms. Our implementation
    computes this mapping using a GraphQL directive [25, Section 3.13]. In the following,
    we omit this mapping for brevity.


    In a GraphQL query, we distinguish three types of fields: i) root fields, ii)
    inner fields, and iii) leaf fields. The root field of a query is the starting
    point of the traversal. Its corresponding operand should only contain the entities
    of the underlying RDF graph that are instances of its type. The pattern (?var,
    rdf:type, type_S(f)) is used to extract these instances, with ?var being a variable
    that will be assigned the extracted instances. Inner and leaf fields represent
    edges between a source and a target vertex in the graph and their operands are
    created using patterns of the form (?var1, f, ?var2). Ultimately, ?var1 will be
    assigned the source vertices of the edge, whereas ?var2 will be assigned the target
    vertices. In the case of inner and leaf fields, we need to also consider the type
    of the target vertices. More specifically, in RDF, the objects of properties can
    vary in type, whereas in GraphQL, the target vertices of fields are of specific
    type. To restrict the type of target vertices, an additional operand is generated
    using the pattern of root fields presented above. In practice, this additional
    operand can be omitted, if the schema allows it (e.g., via a directive). Provided
    an expression f[α]{φ}, the operand of an argument-value pair a = (f'', v) ∈ α
    is created by (?var, f'', v). Last, the operand of an inline fragment on t{φ},
    whose sub-expression φ is executed only if the parent field is an instance of
    the type t, is created by (?var, rdf:type, t). The operands of the aliased fields
    ℓ : f[α]{φ} and ℓ : f[α] are generated using the patterns of f[α]{φ} and f[α],
    respectively.


    Two query operands participate in a (left-)join operation, if they share a variable.
    For assigning variables to operands, we take advantage of the hierarchical structure
    of GraphQL. More specifically, the target vertices of a field and the source vertices
    of its nested fields, share the same variable. The operands of inline fragments
    are also assigned the variable of the target vertices of their parent fields.
    In the case of arguments, their operands are assigned the variable that is already
    assigned to the operand of their field. Example 3.1 demonstrates the operand generation
    process of GraphQL queries.


    **Example 3.1** Consider the queries of Example 2.2. The operands of φ₁ are generated
    by the patterns: 1) ⟨?x, rdf:type, Person⟩, 2) ⟨?x, lname, "Doe"⟩, 3) ⟨?x, fname,
    ?y⟩, and 4) ⟨?x, email, ?z⟩. Note that the operands of the root field and its
    argument share the same variable. Consequently, vertices representing people whose
    last name is not "Doe" will be discarded. The inner fields are associated with
    the root field through the'
