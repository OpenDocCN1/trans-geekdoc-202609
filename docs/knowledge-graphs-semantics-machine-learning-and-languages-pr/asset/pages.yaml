    The F1 score is the harmonic mean between the system’s precision and recall presented
    in Eq. (1). This metric is applied over one class; in this case, we have several
    classes; therefore, the micro and macro average aggregation methods are applied.
    Macro F1 is the unweighted mean of the F1 scores obtained per class presented
    in Eq. (2). The Micro F1 method calculates the F1 score using the normal F1 equation
    but using the total number of True Positive (TP), False Positive (FP), and False
    Negative (FN) values instead of the values of a single class and it is presented
    in Eq. (3). The main difference between the micro and macro metrics is that Micro
    F1 gives equal importance to each observation; consequently, some classes will
    significantly impact the results for imbalanced datasets. On the other hand, Macro
    F1 gives equal importance to the class F1 score, allowing it to return objective
    results even on imbalanced datasets.


    $$F1 = \frac{TP}{TP + \frac{1}{2} \times (FP + FN)} \tag{1}$$


    $$Macro\ F1 = \frac{\sum F1\ scores}{Number\ of\ classes} \tag{2}$$


    $$Micro\ F1 = \frac{\sum TP}{\sum TP + \frac{1}{2} \times (\sum FP + \sum FN)}
    \tag{3}$$'
