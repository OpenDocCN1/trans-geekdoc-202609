  md: '# 2. Foundations & Related Work


    The Resource Description Framework (RDF) [7] represents a generic approach for
    expressing knowledge in the form of triples. In this framework, Internationalized
    Resource Identifiers (IRIs) are utilized as identifiers, which are a generalization
    of Uniform Resource Identifiers (URIs). Each triple consists of a subject, which
    can be an IRI or a blank node, a predicate, which is an IRI, and an object, which
    can be an IRI, a literal, or a blank node. The predicate denotes a property, which
    is a binary relation between the subject and the object expressing a statement.
    Although the definitions vary in the community [8], a set of RDF triples that
    signify real-world entities and their relationships based on a predefined ontology
    can be referred to as a KG. A KG can therefore be interpreted as a graph G = (V,E),
    where V (the nodes) is the combined set of subjects and objects, and E (the edges)
    the instances of predicates. Regarding the pathfinding problem, only IRI nodes
    qualify as entities between which paths can be searched. Accordingly, a path between
    a pair of entities e and e′ ∈ V is a subgraph of G, where e and e′ are IRIs and
    each node on the path is either another IRI or a blank node. KGs typically provide
    SPARQL Protocol and RDF Query Language (SPARQL) [9] interfaces for issuing queries.


    While there exist various domain-specific KGs like the Open Research Knowledge
    Graph (ORKG) [10] for the scientific domain, Wikidata represents a KG for the
    general domain. According to its statistics [11], Wikidata currently contains
    over 100 million entities that possess highly varied in- and outdegrees, where
    the indegree can exceed the outdegree by magnitudes. For example, issuing two
    simple SPARQL queries to the Wikidata Query Service⁸ reveals that there are over
    2,400 triples with the entity Q183 (Germany) as the subject and over 3.1 million
    with this entity as the object. Even though countries are entities with a particularly
    high in- and outdegree, there are numerous entities from other categories that
    have numbers in the thousands. The higher the indegree and outdegree of an entity,
    the higher the chances of encountering the entity when traversing the KG. As a
    result, uninformed search algorithms like breadth-first search do not suffice
    for fast pathfinding, in the worst case even if e and e′ are directly adjacent
    nodes. Another problem is that the Wikidata Query Service already struggles to
    return mere 100,000 triples. Retrieving all adjacent entities connected to an
    entity via its incoming and outgoing edges is therefore not always possible.


    # 2.1. An Algorithm for Fast Pathfinding in Wikidata


    To mitigate the problems described above, the bidirectional A* search algorithm
    proposed in [2] only considers outgoing edges when traversing the KG and performs
    two simultaneous searches, one from e to e′ and one from e′ to e. This way, only
    paths of the patterns shown in Figure 1 can be discovered by their algorithm.
    In [2], the authors assume that this limitation is not problematic, at least in
    the context of Wikidata, due to its dense connectivity. Section 5 will assess
    this assumption.


    Algorithm 1 shows a more verbose version of the strongly condensed algorithm as
    presented in [2]. The algorithm operates as follows: To keep track of the most
    promising entities to pursue during graph traversal, a priority queue is employed,
    which is initialized with e and e′. In each iteration, the first entity is taken
    from the queue. If a path'
