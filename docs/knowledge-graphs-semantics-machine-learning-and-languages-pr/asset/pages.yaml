  md: "# Algorithm 2 The algorithm for optimizing the hyperparameters α, β, and γ.\n\
    \nRequire: A list samples with 239 dual-entity queries, the pathfinding procedure\
    \ FIND PATH, the minimize function of the Simple optimizer\n\n```\nprocedure TESTCONF(α,\
    \ β, γ)\n  score ← 0 // lower is better\n  entityLimit ← 100\n  for ⟨e, e′⟩ ∈\
    \ samples do\n    path, numberOfVisitedEntities ← FIND PATH(e, e′, α, β, γ, entityLimit)\n\
    \    if path == ⊥ then\n      score ← score + numberOfVisitedEntities × 2\n  \
    \  else\n      score ← score + numberOfVisitedEntities\n    end if\n  end for\n\
    \  objectiveValue ← score / |samples|\n  return objectiveValue\nend procedure\n\
    ```\n\n```\nprocedure PERFORMOPTIMIZATION\n  interval ← [0.0;1.0]\n  iterations\
    \ ← 150\n  minValue, α, β, γ ← minimize(TESTCONF, interval, iterations)\n  return\
    \ minValue, α, β, γ\nend procedure\n```\n\nIn the literature on Bayesian optimization,\
    \ the recommendations for the number of iterations vary depending on factors like\
    \ the number of hyperparameters and the employed acquisition function (cf. [23]).\
    \ [20] reports that Simple approximates the global optimum of an objective function\
    \ with two hyperparameters at about 25 iterations. Thus, generous 150 iterations\
    \ are used for our problem with three hyperparameters. Since the hyperparameters\
    \ α, β, and γ represent weights of the cost function components, specifying that\
    \ each of them can assume a value in the interval [0.0;1.0] suffices. With respect\
    \ to these settings, Algorithm 2 presents the PERFORMOPTIMIZATION procedure for\
    \ optimizing the hyperparameters α, β, and γ. To this end, the procedure calls\
    \ the Simple optimizer’s minimize function to minimize the objectiveValue returned\
    \ by the TESTCONF procedure. Hence representing the objective function, TESTCONF\
    \ accepts a candidate hyperparameter configuration and returns the average number\
    \ of entities visited during pathfinding across all queries from samples using\
    \ this configuration as the objectiveValue. If no path is found before the entity\
    \ limit is reached, the number of visited entities is doubled as a penalty for\
    \ the particular query.\n\nFigure 2 shows the objectiveValue yielded in each iteration\
    \ of the optimization process as well as the minValue, i.e., the so far smallest\
    \ objectiveValue. As depicted, a good minValue is already found in the 17th iteration\
    \ and no major improvements are observed until the 150th iteration. Significant\
    \ improvements beyond 150 iterations are therefore not expected. The lowest minValue,\
    \ i.e., 59.347, was encountered in the 101st iteration using the hyperparameter\
    \ configuration\n\nα = 0.699, β = 0.109, γ = 0.823"
