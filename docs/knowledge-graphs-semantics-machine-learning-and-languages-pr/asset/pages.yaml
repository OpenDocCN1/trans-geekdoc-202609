    \ for the altruistic purpose of providing official statistics.\n\n+   - Trust\
    \ technologies certifying a data altruism consent expression provide legal certainty\
    \ and encourage data reuse, in the very spirit of the DGA.\n+   - Semantic Web\
    \ technologies excel at publishing policies on the Web, with JSON-LD serializations\
    \ easily consumed by Web developers. In addition, RDF can effectively act as a\
    \ bridge between future expression languages.\n+   - Data altruism may be rewarded\
    \ in non-economic forms, encouraging in turn further data sharing.\n\nHowever,\
    \ the following limitations can be identified:\n\n+   - Most of the conditions\
    \ declared in the policies will not be able to be automatically enforced and the\
    \ declarative nature of the policies will hopelessly lead to data misuse.\n+ \
    \  - The agreement may not be such if no ontology gains hegemonic spread, if it\
    \ is not sanctioned by a public authority, or if heavy discrepancies prevent reaching\
    \ a consensus.\n\n# 6. Conclusions and Future Work\n\nWhile powerful, the European\
    \ strategy for data brings many interoperability challenges that need to be surpassed\
    \ if we are to implement common spaces to share data between individuals, companies\
    \ and governments. As such, the effort we made in this work on analysing the requirements\
    \ of the DGA and providing a common semantic model to record the activities of\
    \ public sector bodies, data intermediation service providers and altruism organisations\
    \ are a first step towards conquering this interoperability challenge. As proposed,\
    \ we identified the stakeholders, information and requirements necessary to model\
    \ the activities of the new data-sharing entities brought by the DGA and provided\
    \ a semantic vocabulary, and examples of usage of such vocabulary, that can be\
    \ used to automate the documentation tasks of these new entities. As for future\
    \ work, the Data Act and Data Spaces proposals should be explored to improve the\
    \ quality of this work and promote the interoperability envisioned by the common\
    \ European data spaces."
