    +   - Image: P138i has representation (IRI)

    +   - Collective Name/ Group: P67i is referred to by (E33 Linguistic Object)


    Additional object information is best represented through events, i.e., E7 Activity,
    E8 Acquisition, E12 Production or E10 Transfer of Custody. Therefore, such information
    is connected with representative activities that are themselves connected to the
    artefact. For example, P14 carried out by, P7 took place at, and P4 has time-span
    are properties of the E12 Production event, where the object connects this activity
    with property P108i was produced by. On the other hand, properties such as P28
    custody surrendered by, P29 custody received by, and P30 transferred custody of
    are not mentioned due to the complexity of such information and are modelled as
    part of provenance information.


    # 4.2. Provenance Information


    In addition to representing basic object information, the domain experts desired
    representations of detailed provenance information with known actors, locations
    and events. An object’s provenance can be seen as a series of events where the
    custody of an object is transferred between different actors during time and places.
    The provenance of an object is mainly represented using two different entities
    in CIDOC-CRM. E8 Acquisition comprises the transfer of legal ownership from one
    or more instances of E39 Actor to another. In contrast, E8 Acquisition refers
    to legal ownership, thus the view that the change of owners is interpreted as
    a legal right, for example, object is purchased.


    Common to all six objects considered here, there is at least one transfer of custody
    in their biography that is not seen as a legal right, namely when it was looted
    during the military campaign, purchased from illegal authority or receiving questionable
    gift. Therefore, using E8 Acquisition for modelling unethical ways of acquisition
    where the legal right is questioned may not be a appropriate. CIDOC-CRM separates
    legal ownership and physical custody. E10 Transfer of custody can be used to represent
    non-legal ways of acquisition, where a specific type of acquisition, such as theft,
    loot or gift, can be declared.


    For the current modelling choice of selected objects, we used E10 Transfer of
    Custody to represent any illegal transfer of ownership and E8 Acquisition for
    legal cases. Any such activity (both E8 and E10) can further contain other activity(-ies)
    as the sub-activity(-ies) falls within the space-time volume of the main activity.
    This sub-activity is'
