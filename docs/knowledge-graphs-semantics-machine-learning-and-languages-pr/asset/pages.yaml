    # 4. Baseline Evaluation


    With the premise that better translations result in better QA systems, we used
    the GERBIL QA system to evaluate the QALD-9-ES dataset by comparing it to QALD-9.
    At the time of writing this paper, QAnswer [9] is the only working annotator available
    on GERBIL QA that supports Spanish QA. QAnswer is available in two versions, one
    that works with DBpedia KG and the other with Wikidata KG. While working with
    DBpedia, both QALD-9-ES and QALD-9 resulted in system errors; therefore, we only
    compared the datasets using QAnswer over Wikidata. QALD-9 does not include a version
    for Wikidata; hence, we created a version by replacing the QALD-9-plus translations
    with the original QALD-9 translations in the Wikidata set.


    When running the experiments on GERBIL QA, we received not only the QA results
    but the results of three sub-experiments that can measure the quality of a QA
    system; Resource to Knowledge Base (C2KB), Properties to Knowledge Base (P2KB)
    and Relation to Knowledge Base (RE2KB). The results for QALD-9-ES are shown in
    Table 5, and for QALD-9 in Table 4. For each sub-experiment, we present the F1
    score metric.'
