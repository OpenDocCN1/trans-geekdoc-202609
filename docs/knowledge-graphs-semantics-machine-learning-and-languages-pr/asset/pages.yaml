    # 5. Discussion


    Most of the participants were able to use the functionalities of the virtual environment
    without any problems. They used the existing features and tested the boundaries
    of the rules for the interaction with objects in the virtual environment, e.g.,
    when they tried to use the grab button to move the fragments or other fixed elements
    (e.g., the windows of the relation details). Some participants who used a VR application
    for the first time stated that they liked the playful approach to exploring historical
    data. Two participants who worked in an educational context suggested using eTaRDiS
    for knowledge transfer. Additionally, the participants stated that they learned
    something new. For example, one participant said “*didn’t know the topic before,
    but that the connection exists, you could actually find out pretty quickly by
    reading the abstract*”. Three participants even looked for information unrelated
    to the task. One participant stated regarding the information in the characteristics
    of the fragment WWII: “*Yes, that is also interesting. How many casualties have
    there been?*” (usability study 2023, P9). Another participant looked at the other
    fragments related to Albert Einstein and stated: “*See what else is around [the
    fragment WWII]. Physical review. Munich. Mozart is irritating me a bit. Why is
    Mozart there?*” (usability study 2023, P4). A general observation was that the
    participants tried to explain the proximity of fragments or why fragments were
    visualized in the Fragmentarium with their prior historical knowledge. Therefore,
    the VR environment stimulated the reflection of their prior knowledge and the
    potential generation of new knowledge by discovering new relationships between
    historical fragments.


    On the other hand, some participants commented after participating in the study
    they felt overwhelmed by the novel visual impressions in eTaRDiS due to their
    lack of VR experience. However, in the usability questionnaire, four participants
    gave five out of five points (corresponding to the answer ‘fully agree’) and six
    participants gave four out of five points for the question if they would like
    to use eTaRDiS more often. The other three participants gave three out of five
    points, corresponding to a neutral answer.


    eTaRDiS allows users to take different perspectives on a topic, and the results
    showed that the participants found the implemented features helpful for this.
    In particular, the participants explored the adjacency of individual fragments
    to put them into context. In addition, they combined different aspects like the
    arrangement of the fragments, their detail windows, and their relation details.


    The SUS scores of 76.0 (mean) for the group of laypersons corresponding to a ‘satisfactory
    to excellent’ rating and the mean score of historians of 69.4 corresponding to
    a ‘sufficient to satisfactory’ rating are a promising first rating for our prototype
    system.'
