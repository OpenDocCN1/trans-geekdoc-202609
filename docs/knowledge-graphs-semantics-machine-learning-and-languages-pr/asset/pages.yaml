  img_proc: true
- pgno: 77
  md: '# 5.1 Architecture


    The TIB Terminology Service was designed following the Frontend-Backend pattern,
    which positions an ontology lookup service as the data-providing backend for a
    frontend application developed using the React library. The backend service is
    built upon the Ontology Lookup Service (OLS) developed by EBI. This architectural
    structure embodies a tightly integrated design with dedicated modules for ingesting
    and indexing terminologies. Additionally, it incorporates graph libraries that
    facilitate the visualization of these terminologies and also defines API methods
    that enable the presentation of data on the front-end. This architecture allowed
    us to take advantage of not only the pre-existing API but also the ontology ingestion
    process, which streamlined our development efforts. However, to ensure the architecture
    adequately served the unique requirements of the envisioned Terminology Service,
    we introduced new methods into the adopted system.


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_77_0.png)


    Figure 1: Architecture Terminology Service


    The React frontend application addresses the need for flexible, autonomous implementation
    of features in the user interface, decoupled from the original approach of the
    OLS-web app.


    As the original OLS user interface is embedded into the OLS-web app which is tightly
    integrated into the OLS backend architecture, serving individual communities would
    require running multiple OLS backend instances. This is costly for individual
    projects and hard to maintain.


    We, therefore, decided for the TIB Terminology to ingest and index all ontologies
    in one backend while assigning the ontologies to one or more collections as we
    have described earlier. These collections are served to the respective communities
    by the front-end addressing their individual needs and preferences. Usually, collections
    can be'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'accessed by choosing the filtered view in the search or browsing interface
    in the TIB TS. If required by a community the collections can be offered as highly
    customized, individual frontend applications. Such instances are cloned from the
    original source code of the TIB Terminology Service and are further tailored via
    configuration settings during the deployment process. This approach led to the
    development of customized solutions such as the NFDI4Chem Terminology Service.
    Such instances can not only be customized concerning the collection of terminology
    but also be enriched with customized components only available for the selected
    community. These components are centrally maintained in the TIB Terminology Service
    source code repository and can be activated during the deployment process of the
    customized front-end.


    This architectural design ensures that the TIB Terminology Service is adaptable
    and responsive to the distinct needs of various user communities, providing them
    with customized interfaces and functionality while maintaining a centralized,
    coherent backend.


    # 5.2 User-driven Implementation


    The main motivation for implementation was to address the lesson learned and feedback
    that we observed through the VIBSO development process. As a result, we developed
    a new feature for each lesson learned in Table 1. Features under development can
    be accessed on the Terminology Service demo server (https://service.tib.eu/terminology).
    The source code is available via GitHub [40].


    # 5.2.1 List of Github Issues for an Ontology


    As highlighted in Section 4.2, an ideal Terminology Service (TS) should provide
    the necessary tools for facilitating the development and curation of high-quality,
    error-free ontologies. Moreover, many ontology developers leverage the GitHub
    version control system to optimize their development process, aligning it with
    established software development standards.


    In light of this, enabling TS users to interact with GitHub directly through the
    TS emerged as an essential requirement. This interaction can take both passive
    and active forms. Passive interaction might involve tracking the discussions surrounding
    specific ontologies, while active interaction could entail participating in these
    discussions or even reporting issues.


    As a result, we intended to provide a Terminology Service in such a way as to
    optimize the workflow for both the terminology developer and the end user. To
    achieve this, we developed a new feature that allows users to access the list
    of issues for a given ontology repository directly within the Terminology Service.


    The feature aids users in tracking the progress of an ontology and being aware
    of the items in the ontology, which are being worked on. Moreover, it is useful
    to evaluate the quality of an ontology based on the latest activities, number,
    and kind of open issues. It can prompt both users and developers to take further
    steps. Finally, it reduces the mental load associated with context-switching,
    as users do not have to leave the TS to get to the GitHub issues. Currently, this
    feature is only available to the ontologies hosted and maintained on GitHub.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 5.2.2  *Issue Report and Term Request*


    In addition to monitoring existing repository issues for TS users, we recognized
    the importance of enabling them to report their issues, a need highlighted by
    our observations of VIBSO. This feature not only alleviates the need for a context
    switch between the TS and the target ontology repository (such as GitHub) but
    also empowers less experienced users of Git-based systems to actively participate
    in the development process by providing valuable feedback. Furthermore, it offers
    ontology developers the opportunity to enhance their work quality through an accessible
    and constructive feedback stream.


    To address this need, we introduced a feature that allows TS users to create an
    issue on the target ontology repository hosted on GitHub. We added a button to
    the ontology homepage within the TS, which users can utilize to open an issue
    form, enter the issue content and title, and subsequently submit.


    We categorized these issues into two groups: Generic Issues and Term Requests.
    The distinction was made because certain repositories, such as VIBSO, employ a
    specific template for filing new term requests. To uphold the integrity of this
    format, when a user selects the Term Request option, the TS automatically populates
    the input area with the appropriate template, thus informing users of its existence
    and encouraging its use.


    # 5.2.3  *Notes on Ontologies*


    As previously discussed, the capability of the Terminology Service (TS) to facilitate
    users in making or reviewing notes on ontologies was identified as an essential
    feature during the development of VIBSO. Such notes create an additional layer
    of context information atop the ontology or ontology terms, thereby benefiting
    both ontology developers and users. These notes serve as a dynamic feedback system
    that can either be used in cases where another tracker system is missing or where
    opening an issue is not desired. At the same time, they foster a deeper understanding
    of the ontology, by functioning as another avenue for documentation.


    In pursuit of these advantages, we have developed a feature within TS that allows
    users to annotate ontologies with notes. To utilize this feature, a user navigates
    to the newly introduced "Note" tab in the ontology overview. Here, the user can
    add a new note, which requires a title, a body of text, and the Internationalized
    Resource Identifier (IRI) of the target artifact. The ability to specify target
    artifacts empowers users to apply notes to specific elements such as classes.
    At present, there are four possible target artifacts: Ontology, Class, Property,
    and Individual. Additionally, users can view a list of existing notes under the
    Note tab on the ontology page within TS.


    Currently, this feature is in its prototype stage on our demo server. For its
    first stable release, we intend to enhance its usability by introducing more functionalities.
    For instance, we will enable users to filter the note list based on the target
    artifact. Furthermore, we will provide users with the ability to comment on a
    note about an ontology, thus opening up possibilities for discussion.


    # 5.2.4  *List View For Classes*


    One of the insights we gleaned was the necessity for the class view as a list
    presentation, in addition to the traditional tree view for ontology terms. We
    observed that'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'the tree view could occasionally be perplexing for some novice users. Furthermore,
    certain operations, such as sorting based on the term ID, are not feasible within
    the tree view of classes.


    As a response to these findings, we developed a paginated list view that exists
    alongside the tree view. This provides users with a comprehensive, tabular perspective
    of all the classes within an ontology. The list view is highly detailed, incorporating
    expansive metadata about terms, such as descriptions, relationships, and author
    comments.


    Moreover, we have incorporated a ''jump-to'' functionality within the list view.
    This allows users to quickly navigate to a specific term in the list by searching
    for its name, thereby enhancing the usability and efficiency of the platform.


    # 5.2.5  UI enhancements


    The final aspect of our implementation, based on the lessons learned, involved
    refining various UI-related features within our front-end application. The most
    common feedback pertained to the tree view page, where we present the term tree
    view alongside the term detail table when a term is selected.


    The first concern addressed the challenge of navigating the tree solely using
    mouse clicks. To overcome this, we introduced keyboard arrow key functionality
    for navigation. Users can now use the right and left arrow keys to expand or collapse
    a node in the tree, while the up and down arrow keys allow movement between tree
    nodes.


    The second enhancement dealt with the size of the detail table. Feedback suggested
    it was rather small for terms with extensive metadata. To improve this, we made
    the view pane resizable. This allows users to adjust the sizes of the tree view
    and detail table as needed, enhancing the readability of metadata and overall
    user experience.


    # 6.  Discussion


    The topic of ontologies, with its abstract nature and philosophical undertones
    (ontology translates to ''doctrine of being''), often presents a challenging concept
    for domain experts to grasp. Understanding what terminologies or ontologies are,
    and why they are essential within their respective research areas, can be a complex
    process. The realization that a formal (i.e., not grounded in familiar classical/natural
    language) representation of knowledge (via ontologies) is necessary for machines
    to capture, comprehend, and interpret knowledge typically comes only after an
    extensive process of understanding. However, the importance and practicality of
    terminologies can be quite straightforward to demonstrate, especially in the context
    of the semantic description of research data through metadata annotation. In such
    a scenario, the Terminology Service (TS) can serve as an effective gateway tool,
    providing a swift and simple overview of the available ontologies. This tool can
    assist domain experts, for example, by providing domain-specific terminology collections
    that aid in the search and selection of suitable terms for their respective use
    cases. Further simplifying features, such as a list view, can provide even more
    support, enhancing the usability and efficiency of the service.


    In this work, we employed a user-centered approach to identify the challenges
    and requirements in the design and development of a Terminology Service aimed
    at enhancing ontology development. We incorporated our target user group into
    the TS'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'development process from its inception. In particular, we engaged in close
    contact with ontology development teams such as VIBSO, ensuring their perspectives
    and insights were woven into the fabric of the service from the earliest stages.


    This collaboration allowed us to gain a deeper understanding of the ontology development
    process and the requisite features for an effective Terminology Service. We greatly
    valued the continuous feedback received from the ontology engineers, which proved
    crucial in shaping our service. Additionally, we endeavored to incorporate data
    annotators, who are primary users of the ontology, into our development process,
    thereby ensuring we cater to their needs effectively.


    We facilitated numerous events and meetings, including conferences, workshops,
    and online sessions, with two primary objectives. Firstly, we sought to introduce
    our TS and demonstrate how it could be utilized for data annotation. Secondly,
    we aimed to gather feedback and user requirements to improve the quality of the
    ontologies and their presentation within the TS.


    These close interactions with our users were instrumental in helping us conceptualize
    the ideal TS and identify its essential features. The insights gleaned from these
    engagements were directly translated into the design and functionality of our
    service, ensuring it adequately meets user needs and expectations.


    Facilitating FAIR data annotation for researchers necessitates the provision of
    not just any ontologies, but those of high quality. Therefore, an ideal Terminology
    Service must cater to the needs of ontology developers, thereby enhancing the
    development process and ensuring quality. Our central finding was the necessity
    of integrating TS into the entire development process, from inception to conclusion.
    This implies the TS should address developer needs at various stages, such as
    artifact browsing and quality check, through discussion, feedback, and notes.


    The ability of TS to offer these features offers multiple benefits to ontology
    developers. Firstly, it facilitates continuous feedback via Git issues and TS
    notes, ensuring the quality of developed ontologies. Furthermore, having notes
    and Git issues allows other TS users and less experienced developers to stay current
    with the latest discussions and topics concerning ontologies. This adds a new
    layer of context around the target ontology, enhancing its comprehensibility.
    Moreover, incorporating these ontology development tools into TS reduces context
    switching between different systems and environments, which could negatively impact
    a developer''s performance.


    Finally, we noted that the usability of the TS user interface (UI) is critical
    for ontology developers. There''s a substantial demand for presenting a list view
    of classes alongside a tree view for an ontology. Given the high volume of terms
    in many ontologies, it is crucial for developers to swiftly navigate through the
    tree view using keyboard arrow keys. Additionally, due to the challenge of reading
    extensive metadata for a term in limited screen space, it is essential to allow
    TS users to resize different information box panes, thereby improving readability.


    # 7. Conclusion


    We have presented a user-centered development of our Terminology Service in the
    realm of research data annotation, where we actively engaged ontology developers,
    knowledge engineers, domain experts, and data annotators in the development process
    from its'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'inception. Their continuous feedback and insights during its usage in an ongoing
    ontology development process proved instrumental in identifying requirements for
    the TS.


    The added value of the TS by integrating it throughout the ontology development
    process is a central finding. The inclusion of features such as GitHub issue tracking,
    term requests, and ontology notes within the TS streamlines the development workflow,
    reduces context switching, and promotes collaboration among ontology developers
    and users.


    Usability improvements have been another key focus. The introduction of an enhanced
    list view alongside the traditional tree view provides users with a comprehensive
    overview of ontology classes, enhancing efficiency and ease of navigation. The
    incorporation of keyboard arrow functionality and resizable information panes
    further improves the user interface, allowing for more intuitive interaction.


    In conclusion, this work demonstrates the value of the TS for ontology developers
    and data annotators and proves its potential as an effective tool for ontology
    design and curation.


    The next steps will include enhancing GitHub interaction features and the TS Note
    system to incorporate ontology curation into the terminology service user interface
    to establish the TS as an integrated ontology curation tool. We will continue
    the user-driven development to further support curation workflows from the very
    beginning. As ontologies continue to play a vital role in knowledge representation
    and data interoperability, the development and refinement of effective Terminology
    Services will contribute to advancing scientific understanding and collaboration
    across diverse domains.


