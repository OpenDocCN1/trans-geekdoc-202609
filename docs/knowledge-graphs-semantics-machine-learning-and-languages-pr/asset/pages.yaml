    adheres to domain requirements. All relevant files can be found in the Zenodo
    repository[^14].


    # ### 5.1. *Statistics of Resulting knowledge graph*


    Following the modelling choices stated in the previous section and based on the
    information from the provenance reports, we first model the descriptions and provenance
    data of the six selected objects those were initially chosen to construct the
    model. For convenience, we are going to refer to these six objects as *construct
    object* in the rest of the paper. The resultant knowledge graph contains 1,786
    triples spread across 31 named graphs. These named graphs contain either entire
    object metadata triples or triples generated by a single source of information.
    Additional named graphs were created to represent different views of the same
    entity with their source of information. The statistics of the resultant graph
    is given in the second column of Table 3. More statistics can be found in the
    Zenodo repository(/construct/entity_stat.csv) where the knowledge graphs itself
    is also available as TriG files in the data folder.


    We also modeled the reports of 5 unseen objects from the PPROCE project, which
    we refer to as the “evaluation objects.” The resulting knowledge graph contained
    1,290 RDF triples spread across 27 named graphs, which is comparable to the construct
    objects set as we modeled only 5 objects’ provenance data. The number of instances
    of different classes, such as **crm:E8 Acquisition**, **crm:10 Transfer of Custody**,
    **crm:E39 Actor**, **prov:Agent**, and **prov:Entity**, were consistent with the
    construct objects set. All TriG files and detailed statistics for this object
    set can be found in the ”evaluation” folder of the Zotero repository.


    The conceptual model is converted to ShEx[^15] rules to maintain data consistency
    and shape. ShapeMap queries are used to validate each entity against the proposed
    ontology using the RDFShape[^16] web tool. ShEx rules and ShapeMap queries can
    be found in the repository.


    [^14]: https://doi.org/10.5281/zenodo.7437713

    [^15]: ShEx, shape expressions, see https://shex.io/

