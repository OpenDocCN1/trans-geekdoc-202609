  md: '# Studies on the Semantic Web


    Semantic Web has grown into a mature field of research. Its methods find innovative
    applications on and off the World Wide Web. Its underlying technologies have significant
    impact on adjacent fields of research and on industrial applications. This book
    series reports on the state of the art in foundations, methods, and applications
    of Semantic Web and its underlying technologies. It is a central forum for the
    communication of recent developments and comprises research monographs, textbooks
    and edited volumes on all topics related to the Semantic Web.


    Editor-in-Chief:

    Prof. Dr. Pascal Hitzler

    Department of Computer Science, Kansas State University, Manhattan, KS 66502,
    USA

    Email: hitzler@k-state.edu


    Editorial Board:

