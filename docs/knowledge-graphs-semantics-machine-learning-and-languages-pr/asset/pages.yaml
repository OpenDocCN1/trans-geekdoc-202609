  md: '```

    Algorithm 1 Multi-way Left-join Algorithm


    1: **function** MWLJ(Q)                                      ▷ Q: Input GraphQL
    query

    2:     O ← generate the operands of Q

    3:     G ← create the operand dependency graph of Q using O

    4:     X ← initialize solution mapping with domain equal to the set of labels
    appearing in G

    5:     MWLJ_REC(G, X)

    6: **function** MWLJ_REC(G, X)                                ▷ G: operand dependency
    graph, X: solution mapping

    7:     **if** G is disconnected **then**                     ▷ Evaluation of φ₁
    ... φₖ expressions

    8:         **for all** connected components Gᵢ of G **do**    ▷ Each Gᵢ corresponds
    to a φᵢ, 1 ≤ i ≤ k

    9:             MWLJ_REC(Gᵢ, X)

    10:    **else if** G is not strongly connected **then**        ▷ Left-join operation

    11:        U ← the set of labels appearing in the independent strong component
    of G

    12:        x ← select a label from U

    13:        **for all** values χ of x **do**

    14:            resolve x in all operands using χ                 ▷ Carries out
    join and left joins simultaneously

    15:            G′ ← prune vertices of empty operands and their transitively dependent
    vertices from G

    16:            **if** G′ is empty **then**

    17:                **continue**                                 ▷ All operands
    are pruned (unsuccessful join); continue with the next χ

    18:            update the value of x in X with χ                 ▷ Join operations
    were successful

    19:            remove x from G′; remove vertices without any labels from G′

    20:            MWLJ_REC(G′, X)

    21:    **else**                                                  ▷ G is strongly
    connected (no left-join operations)

    22:        MWJ(G, X)                                             ▷ Carry out multi-way
    join (no more left joins after this point)

    ```


    selecting a label x from U, the algorithm iterates over all possible values of
    x and carries out all join and left-join operations on x (line 14). The algorithm
    proceeds by removing any operands that were not successfully resolved along with
    their transitively dependent operands, which can be found by traversing the dependency
    graph (line 15). If the resulting graph G′ ends up being empty, a join operation
    was not successful and the algorithm continues with the next value of x (lines
    16–17). If G′ is not empty, the solution mapping X is updated with the current
    value of x, which is removed from G′ along with any fully resolved operands, and
    the algorithm proceeds with the next recursive step (lines 18–20). In case the
    provided graph G is strongly connected, the algorithm proceeds with a multi-way
    join algorithm, as there are no left-join operations left to be carried out. The
    active solution mapping X will be ultimately projected once the remaining join
    operations are carried out by the multi-way join algorithm.


    # **Example 3.3** Consider the query φ₁ of Example 2.2.


    ```

    <p1> rdf:type <Person>; <lname> "Doe"; <fname> "Jon"; <email> "e1".

    <p2> rdf:type <Person>; <lname> "Doe"; <fname> "Jan".

    ```


    the proposed algorithm will produce three solutions: {x:p1, y:"Jon"}, {x:p1, z:"e1"},
    and {x:p2, y:"Jan"}. The algorithm selects first the label corresponding to the
    variable x, which is assigned the identifiers of people in the graph. For the
    value p1 of x, the algorithm generates two solutions. The first one provides the
    first name (fname) of p1, which is assigned to y, whereas the second one provides
    its email, which is assigned to z. For the value p2, the algorithm generates only
    one solution, as p2 does not have an email in the example graph. Note that after
    selecting x and removing it from the operand dependency graph, the resulting dependency
    graph is disconnected. Variables that do not appear in a solution mapping are
    unbound in that particular mapping.'
