  md: 'Answer: Diese Redewendung bedeutet, dass man nicht dumm oder unerfahren ist,
    sondern dass man gut informiert und handlungsfähig ist. Es drückt auch die Zuversicht
    aus, dass man in einer bestimmten Situation erfolgreich sein wird. ''This idiom
