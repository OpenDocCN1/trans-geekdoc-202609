    details our resulting classification and its formalization in OWL. Finally, we
    discuss perspectives and conclude our work in Section 6.


    # 2. Related work


    Data linking has been defined for example as: “the task of establishing typed
    links between entities across different RDF datasets via the help of automatic
    link discovery systems.” [11]. In [12], the authors distinguish two approaches
    to data linking: “(i) A similarity-based approach in which the more similar two
    resources are, the more likely they are to be linked; (ii) A key-based approach
    in which a key determines the identity of a resource: two resources with the same
    key must be linked”. In this paper, we define data linking as the task of establishing
    similarity or hierarchical relationships between distinctly identified entities
    in two different semantic datasets.


    Here is a summary of some common data linking techniques:


    +   - *Deterministic linking* involves linking dataset records based on unique
    identifiers (such as the social security number in the previous example) or other
    unique identifiers that allow for a one-to-one match between entities in different
    datasets. This method is considered the most accurate and efficient but requires
    the use of common unique identifiers across datasets which may not exists or may
    be hard to identify.

    +   - *Probabilistic linking* involves matching entities based on non-unique identifier
    properties such as names, addresses, and dates of birth. The technique calculates
    the probability that two records refer to the same entity. However, determining
    a unique key on the basis of several pairs of properties and values remains an
    arduous task. Work has been carried out for the automated determination of these
    keys [13,14,15]. Probabilistic linking is useful when unique identifiers are not
    available, but it is less accurate than deterministic linking.

    +   - *Rule-based linking* involves defining rules that specify the conditions
    for linking records between datasets [16,17]. For example: two records match if
    they have the same name and address. Rule-based linking can be useful when there
    is a high degree of certainty about the conditions for linking records.

    +   - *Knowledge graph embedding* involves representing relationships as translations
    in the embedding space [18]. Graphs are transposed into vector spaces because
    the latter offer a wider range of tools for mathematical and statistical processing.
    This means that technologies such as machine learning can be applied more easily
    to these graphs. This is one of the most recent techniques in the field of data
    linking, but despite the many advantages it has over other, more traditional techniques,
    it still has limitations, such as the fact that this method does not hold up well
    when the relational paths are long or complex [19].


    # 3. What it is for two RDF resources to be similar?


    According to the Larousse French dictionary, similar things are defined as follows:
    “A set of things that can, in a certain way, be assimilated to each other”. In
    the following, we review how this definition may be applied to RDF resources belonging
    to different datasets by trying to clarify this notion “in a certain way”.


    Harispe et al. [20] say: “Similarity assessment must therefore not be understood
    as an attempt to compare object realisations through the evaluation of their properties,
    but rather as a process aiming to compare objects as they are understood by the
    agent which'
