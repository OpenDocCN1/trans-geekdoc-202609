    is not represented here for lack of space.


    # 6. Conclusion


    Data linking allows similar entities to be linked, so that semantic data spread
    over several heterogeneous datasets can be used more effectively. In this paper,
    we therefore propose a formalized classification of the different types of problems
    that can be encountered when linking RDF datasets. We hope that this classification
    will help the data linking community to better identify the problems that may
    arise when two RDF datasets with heterogeneous terminology, structure, and logic
    need to be linked. Establishing a precise profile, as close as possible to the
    RDF data to be processed, should allow a better choice of the algorithmic module(s)
    needed to solve a data linking task, in an attempt'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'to improve the performance of existing data linking tools, most of which use
    generic solutions.


    In the future, we plan to continue to develop our classification by continuing
    to provide, for example, for each LPT described, examples of real cases from pairs
    of datasets used during data linking competitions. The different techniques capable
    of solving these LPTs will also be attached. Ultimately we want to make an OWL
    ontology that we will of course make available online for all users in the field
    of data linking.


    This work is achieved in the context of the DACE-DL (Data-Centric AI-driven Data
    Linking) project 5 which proposes a paradigm shift in data linking by focusing
    on a bottom-up, data-centric methodology [11]. The objective of this research
    project is to use machine learning techniques and representation learning models
    to improve data linking by facilitating the application of the right linking tool
    to the relevant linking problem. Thus the need to formalize a classification of
    linking problem types. We therefore envision our classification to be used to
    determine, via learning processes, the relevant specific linking tool modules
    necessary for data linking according to the different problems exposed by a pair
    of datasets in order to provide a more specific solution to a linking task than
    current approaches.


    Another perspective of this work, is to experiment an unsupervised machine learning
    process to categorize different pairs of datasets for which we would have manually
    determined the different LPTs potentially exposed. The goal of such experimentation
    would be to verify our grouping operated via the LPT classification can be corroborated
    by a categorization performed via a machine learning process. These dataset pairs
    are taken from various datalinking benchmarks such as OAEI. Each pair is documented
    with the different LPTs they expose, an additional file containing the different
    alignments that should theoretically be obtained after running a linking tool
    and the linking tool that has been tested as the best performing.. Other information
    on these datasets is provided (i.e. description, year of creation, origin, type
    of alignment(T-Box/Schema matching, Instance matching or link discovery, Instance
    and schema matching and Tabular data to Knowledge Graph matching). In our next
    project, we aim to set up an automated software solution that would receive as
    input a pair of datasets that we are trying to link and as output the LPTs that
    they expose.


