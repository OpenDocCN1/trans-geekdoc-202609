    and the original polygon itself. In some cases, this leads to some splits not
    achieving any additional information as their parts of the grid are empty. For
    instance in Figure **3a**, any further splits of the top left corner cell (the
    blue highlighted cell) would not increase the accuracy of **CoBALT** as the original
    polygon does not have any points within this cell. **2) Fitting split**, where
    we divide the polygon into equally sized parts but using the MBB of the current
    polygon part for further splitting. Splitting the top left corner cell of the
    same polygon of the previous example using this strategy will result in the splitting
    presented in Figure **3b**, where further splitting of the blue highlighted cell
    results in more detailed splits that fit better to the shape of the polygon. After
    splitting the polygons we compute the MBBs for all parts. Now as we have multiple
    polygon parts, we change the way the relation of the original polygon is determined.
    Let *t* be the number of splits into four parts. Let $A_{(i,j)}$ be the split
    part of geometry *A* at column *i* and row *j* and $B_{(k,l)}$ be the split part
    of geometry *B* at column *k* and row *l* for $\{(i,j,k,l) \in \mathbb{N}^{4}
    \mid 0 \leq i,j,k,l < 2^{t}\}$. The newly defined relations can be found in Table
    2. In particular, every grid pattern $A_{(i,j)}$ must be equal to $B_{(k,l)}$
    for the equals relation to hold. For the intersects relation, at least one $A_{(i,j)}$
    has to intersect with at least one $B_{(k,l)}$. For the within relation, all $A_{(i,j)}$
    have to be contained in the MBB of the union of all $B_{(k,l)}$ it intersects.
    For the contains relation, we swap *A* and *B* and then compute our relation instead.
    For the overlaps relation, we three conditions must hold: 1) at least one $A_{(i,j)}$
    is not within *B*, 2) at least one $B_{(k,l)}$ is not within *A*, and 3) at least
    one $A_{(i,j)}$ intersects with at least one $B_{(k,l)}$. For the touches relation,
    at least one $A_{(i,j)}$ must touch any $B_{(k,l)}$ and every $B_{(i,j)}$ is related
    to every $B_{(k,l)}$ by either touches or disjoint relation.


