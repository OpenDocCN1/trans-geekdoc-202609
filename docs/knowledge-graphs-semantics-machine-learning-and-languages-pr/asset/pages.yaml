    # 5. Related Works


    Several works studied different reification methods and compared them according
    to several criteria. [13] focused on Wikidata and its representation in RDF using
    reification based on n-ary relations, standard reification, singleton properties
    and named graphs. Authors compared these models over five triplestores: 4store,
    Blazegraph, GraphDB, Jena, and Virtuoso. Their performance were measured based
    on 14 queries. Their results suggested that the singleton properties model was
    hardly supported but no other model was an outright winner. Concerning query performance,
    Virtuoso was the best followed by GraphDB and Blazegraph.


    [14] realized an analysis of standard reification, named graphs, n-ary relations,
    singleton properties, companion properties (proposed in that paper) and RDF-star
    in its early stages. Experiments used Wikidata and DBpedia datasets on the triplestores
    Blazegraph, Stardog and Virtuoso. As DBpedia does not have significant metadata,
    authors build a dataset with the Wikipedia revision history focusing on a company
    dataset. The experiments show that when the granularity of metadata is not by
    statement, companion properties and named graphs outperform. Concerning statement-level
    metadata, while standard reification results in the highest number of triples,
    it consumes the least storage in the database files and named graphs the most.
    This is because additional index structures for the graph identifiers are maintained.
    Concerning query performance, metadata characteristics have an impact on the reification
    models. Named graphs and RDF-star support queries against meta-metadata much better
    than the other models. In general, RDF-star can compete with named graphs if the
    metadata is on statement level. Moreover, both offer the best trade-off for mixed
    and data query workloads. In our experiments, queries do not contain data (i.e.,
    triples) and we do not test querying meta-metadata.


    [15] used three simple counting queries to analyse the internal representations
    of RDF-star in Stardog, Blazegraph and ExecuteSPARQLStar.¹⁹ Experiments showed
    the divergence of the implementations of RDF-star when dealing with nested RDF-star
    statements. Blazegraph and ExecuteSPARQLStar behave similarly but Stardog was
    not able to deal correctly with nested RDF-star statements. That is because Stardog
    flattens the nested statements.


    [16] proposed a data model called Labeled k-partite Graph (LKG) for storing and
    querying RDF triples with metadata. Authors compared experimentally LKG with Sin-


    ¹⁹ https://github.com/RDFstar/RDFstarTools'
