    box-shaped interface elements are populated with information from purpose-built
    knowledge bases, namely Knowledge Graphs (KGs) [1]. In a blog entry from 2012,
    Google unveiled their KG as a means of improving their search engine through three
    primary functions: the disambiguation of entities, the generation of summaries
    of entities, and the provision of links to associated entities. Especially the
    latter two functions contribute to the composition of the knowledge panel’s content.
    Using the example of two queries, Table 1 shows the variety of information that
    the knowledge panel variants of the three web search engines comprise when a query
    mentioning a single entity is issued. Note how the types of the queried entities,
    which are in this case a political union and a human being, affect the information
    presented in the knowledge panels. The reasons for this are twofold: First, the
    employed KGs use different properties to describe entities of different categories,
    and second, the search engines rank the entity information differently.


    The examples demonstrate that knowledge panels for single-entity queries, i.e.,
    queries mentioning exactly one entity, offer useful information. However, the
    quality of the knowledge panels decreases when dual-entity queries, i.e., queries
    mentioning exactly two entities, are issued. For instance, given the query *European
    Union Alan Turing*⁵, Google displays no knowledge panel at all while Bing presents
    the same knowledge panel as for the query *Alan Turing*. Startpage shows a knowledge
    panel with information about a UK student exchange program named after Turing.
    While Startpage’s result is a good attempt, the authors of [2] argue that knowledge
    panels for dual-entity queries could explain the relationship between the two
    mentioned entities, thereby potentially satisfying the users’ information need
    without requiring them to consult the ranked search entries. Especially when the
    two entities are semantically distant, the way they are connected via a path in
    a KG, can provide valuable information for the users. The task of entity relationship
    explanation, which is well-known in the knowledge discovery discipline [3], is
    defined in [4] as follows:


    > Given a pair of entities *e* and *e′*, provide an explanation, i.e., a textual
    description, supported by a KG, of how the pair of entities is related.'
