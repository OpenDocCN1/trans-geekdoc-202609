  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_114_0.png)


    will be annotated (rdf:subject, rdf:predicate, and rdf:object). The defined statement
    can be identified by a blank node or a URI. Figure 4(a) gives the representation
    in RDF triples. It displays two score values annotated on a statement.


    ***Named graphs.*** Carroll et al. [7] proposed an extension to the RDF data model
    that allows RDF graphs to be named by URIs, which are referred to as named graphs.
    In this approach, a named graph is represented as a pair (g, n), where g is an
    RDF graph and n is an IRI, a blank node, or a default graph. The statements to
    be annotated are defined in one RDF graph, while the annotations themselves are
    defined in another RDF graph. The annotations are directly linked to this graph.
    Figure 4(b) shows the syntax for this example.


    ***Singleton properties.*** The singleton property model [8] proposes creating
    a unique property for every triple that has associated metadata. In this model,
    a new node is created to represent the new property, which is connected directly
    to the original annotation property using the proposed property *singletonPropertyOf*.
    The same property is used for all metadata associated with a statement. An example
    of RDF triples using this model is shown in Figure 4(c).


    ***RDF-Star.*** [9][10] proposed RDF-star and SPARQL-star as extensions to RDF
    and SPARQL to enable graph nesting and simplify the representation of reified
    statements. RDF-star and SPARQL-star allow for the recursive nesting of graphs,
    eliminating the need for declaring edge identifiers that are linked with metadata.
    RDF-star enables the nesting of triples within other triples as subjects or objects
    by using double angle brackets << >>. As a result, every reified statement can
    be interpreted as a single RDF triple. An example of RDF-star reification is shown
    in Figure 4(d).


    # 3.2. Mapping JSON to RDF


    The aggregate of the JSON files used as input to generate the four versions of
    our KG can be seen in Figure 5. Each ER is described by an id, a title, a description,
    etc. It can have several authors and can be associated to several concepts.


    We define four mappings, one for each reification model. We use the RML language
    [10] to generate the RDF triples for standard reification, singleton property
    and named graph. To generate RDF-star we use the RML-star [5] language. Listing
    1 shows an excerpt of the RML-star mapping used to transform the JSON data into
    RDF-star. This


