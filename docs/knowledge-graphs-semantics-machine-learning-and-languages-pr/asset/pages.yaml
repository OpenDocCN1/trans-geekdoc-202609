  md: "class *transraz:Event* is defined as subclass of *crm:E2 Temporal Entity* to\
    \ represent cultural, political, military and further events that can be associated\
    \ with points in time. *transraz:Event* inherits all properties of *crm:E2 Temporal\
    \ Entity* to connect to other happenings, and additionally presents properties\
    \ to connect events with agents, e.g. *transraz:participant* (REQ1). Moreover,\
    \ the class *crm:E5 Event* is extended with two additional subclasses. The class\
    \ *transraz:Relabeling* comprises changes of names of the instances of agents\
    \ and objects. And the class *transraz:Refunction* addresses the changes on the\
    \ function level, e.g. a building changes it function from pharmacy to shop (REQ2).\n\
    \nIn order to address the uncertainty and incompleteness of time units in historical\
    \ data, time expressions of different levels of granularity have to be considered.\
    \ Thus, the new property *transraz:time* connects events with *time:TemporalEntity*\
    \ from OWL-Time [16]. In contrast to *crm:E52 Time-Span*, it provides a more granular\
    \ representation of time indications, it presents classes and relations for time\
    \ instants and intervals, together with information about durations, and temporal\
    \ position including date-time information. Additionally, the uncertainty and\
    \ incompleteness of time intervals is addressed via providing temporal relations\
    \ of the types interval-interval and interval-instant. Thus, the temporal relations\
    \ can be modeled even if the exact event time is unknown, e.g. *interval time:overlaps\
    \ interval2* (REQ4 and REQ5).\n\n# 3.2.4. *Representation and Annotation of Documents.*\n\
    \nIn the TRANSRAZ data model, the use of documents is two-fold:\n\n+   REQ1: Historical\
    \ documents are themselves considered cultural heritage objects and require a\
    \ semantic representation to enable the findability and interconnection of resources\
    \ (CQ6.1, CQ6.3).\n+   \n+   REQ2: The provenance is required to keep track of\
    \ the origin of statements and entities, the sources, they were derived from,\
    \ are used as contextual evidence (CQ6.1-4).\n\nFollowing the best practices,\
    \ historical documents and their hierarchy are modeled with the FRBR-Aligned Bibliographic\
    \ Ontology (FaBiO) [23]. FaBio provides rich semantics for recording and publishing\
    \ bibliographic records. It enables the representation of archival records (*fabio:ArchivalDocumentSet*\
    \ and *fabio:ArchivalDocument*), journals (*fabio:Journal*), their issues (*fabio:JournalIssue*)\
    \ and articles (*JournalArticle*), books *fabio:Book* and their chapters (*fabio:BookChapter*).\
    \ Partly making use of the DCMI Metadata Terms vocabulary historical documents\
    \ are annotated with the relevant metadata, e.g. *dcterms:creator*, *dcterms:publisher*.\
    \ The Web Annotation Ontology (OA) is used for providing annotations to the resources.\
    \ Annotations (*oa:Annotation*) connect information to the source that the information\
    \ was extracted from, for example a person mentioned in an address book or a fact\
