    Our contributions can be summarised as follows. We propose a conceptual framework
    to combine semantic knowledge in the form of a KG with an existing deep learning
    architecture (§3). Specifically, we propose a novel entity weighting scheme to
    effectively adapt a KG to text classification. We conduct a thorough quantitative
    and qualitative evaluation of our proposed hybrid learning framework (§4). Particularly,
    by comparing it against SOTA approaches on recognising language references to
    gender and sexual orientation in a variety of hate speech datasets. Our proposed
    semantically enriched approach displays equivalent performance to the use of language
    models, with transparency and higher generalisability to external datasets. The
    rest of the paper is structured as follows. (§2) summarises the related work,
    and (§5) our proposed approach, its strengths and limitations, and concludes the
    work. The instructions for accessing the data, code for training hybrid models
    in new domains, or applying them to new data, are published in a public repository².


    # 2. Related Work


    Content moderation systems generally focus on defining policies to protect any
    identity group or individual targeted [13]. Nevertheless, the specific sociolinguistic
    aspects of harmful expressions [14,15] make this phenomenon different for each
    target. A system focused on recognising hate directed to a specific group would
    not generalise to a different identity [2]. Similarly, linguistic nuances across
    group identities significantly impact the annotation of training datasets and
    lead to inconsistent labelling. Humans who labelled the data have different cultural
    backgrounds or beliefs [7], are exposed to language sensitive to groups with whom
    they may not self-identify [16,17], and their subjective interpretations of hate
    speech differ [18,19], especially when recognising identity groups that are frequent
    hate targets [20]. Lexical biases, where algorithms associate hate with any language
    that refers to a particular minority group [10,21], make it critical to analyse
    hate in terms of the identities targeted.


    Due to these issues, one stream of work (System B) has been based on the manual
    selection of terms or expressions to recognise language references to identity
    groups in hate speech data. To a greater extent, these consist of direct references
    to members of an identity group (so-called group identifiers, identity terms or
    identity mentions) [10,12,9], or expressions that comprise potentially offensive
    language depending on the context, including slurs and objectifying outdated terms,
    as well as reclaimed slurs [11]. However, these approaches have mainly been used
    in the development of techniques to mitigate lexical bias in hate speech [22,23],
    or to measure the effectiveness of such mitigation techniques [24,25,26,27]. Existing
    approaches based on structured knowledge can only partially cover the prejudice
    towards identity groups in hate speech training data.


    Another prominent line of work (System A) relies on supervised learning to more
    effectively recognise language references to identity groups [4,6,3,5]. These
    references may refer to broad groups based on sensitive attributes such as gender,
    race, sexual ori-'
