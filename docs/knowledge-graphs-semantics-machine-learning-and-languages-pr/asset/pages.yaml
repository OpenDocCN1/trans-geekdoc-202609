    # 4. Evaluation


    In this section, we present our evaluation setup (§4.1) as well as the quantitative
    results against SOTA approaches for recognising language sensitive to gender and
    sexual orientation in hate speech (§4.2). (§4.3) provides the results from our
    qualitative evaluation. Specifically, an error analysis of the best-performing
    hybrid model (§4.3.1) and a data and model prediction analysis guided by the KG
    (§4.3.2).


    # 4.1. Experimental Setup


    This section describes the datasets used for training and testing our proposed
    hybrid models, and the baselines and metrics used for evaluation.


    # 4.1.1. Data


    We consider five datasets for training and testing our models. See Table 2 for
    specific statistics and data descriptions.


    Jigsaw [45]: To the best of our knowledge, this is the largest public toxicity
    corpus containing annotations of identity groups, with 448k annotated posts from
    the Civil Comments platform. These texts are annotated with a binary indicator
    of toxicity (toxic/non-toxic) and with the identity groups mentioned in them.
    Group annotations are based on the following identities: gender, sexual orientation,
    race, religion, disability or no mention of an identity group.'
