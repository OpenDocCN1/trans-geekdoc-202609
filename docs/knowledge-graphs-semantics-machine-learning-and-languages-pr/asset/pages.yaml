- pgno: 16
  md: '# Knowledge-Grounded Target Group Language Recognition in Hate Speech


    Paula REYERO LOBO a,1, Enrico DAGA a Harith ALANI a and Miriam FERNANDEZ a


    a Knowledge Media Institute, The Open University, United Kingdom


    ORCiD ID: Paula Reyero Lobo https://orcid.org/0000-0001-5238-4550, Enrico Daga
    https://orcid.org/0000-0002-3184-5407, Harith Alani https://orcid.org/0000-0003-2784-349X,
    Miriam Fernandez https://orcid.org/0000-0001-5939-4321


    Abstract. Hate speech comes in different forms depending on the communities targeted,
    often based on factors like gender, sexuality, race, or religion. Detecting it
    online is challenging because existing systems are not accounting for the diversity
    of hate based on the identity of the target and may be biased towards certain
    groups, leading to inaccurate results. Current language models perform well in
    identifying target communities, but only provide a probability that a hate speech
    text contains references to a particular group. This lack of transparency is problematic
    because these models learn biases from data annotated by individuals who may not
    be familiar with the target group. To improve hate speech detection, particularly
    target group identification, we propose a new hybrid approach that incorporates
    explicit knowledge about the language used by specific identity groups. We leverage
    a Knowledge Graph (KG) and adapt it, considering an appropriate level of abstraction,
    to recognise hate speech-language related to gender and sexual orientation. A
    thorough quantitative and qualitative evaluation demonstrates that our approach
    is as effective as state-of-the-art language models while adjusting better to
    domain and data changes. By grounding the task in explicit knowledge, we can better
    contextualise the results generated by our proposed approach with the language
    of the groups most frequently impacted by these technologies. Semantic enrichment
    helps us examine model outcomes and the training data used for hate speech detection
    systems, and handle ambiguous cases in human annotations more effectively. Overall,
    infusing semantic knowledge in hate speech detection is crucial for enhancing
    understanding of model behaviors and addressing biases derived from training data.


    Keywords. hate speech, semantic enrichment, knowledge graphs, language models


    # 1. Introduction


    One of the challenges when addressing online hate speech is the extensive use
    of specialized language that is specific to the communities that are most frequently
    targeted. A motivating example is illustrated by Figure 1. We show two posts from
    a well-known'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_17_0.png)


    Figure 1. Hate speech recognisers based on language sensitive to gender and sexual
    orientation. Our approach (Our System) embeds a knowledge graph in a deep learning
    model to give a probability estimate that is competitive with state-of-the-art
    language models (System A), while providing more semantic information supporting
    the prediction than the existing linguistic approaches of lower accuracy (System
    B).


    hate speech corpus [1]. To make appropriate decisions about the hateful nature
    of these posts, it is crucial to be familiar with the language being used.


    Looking at it from the perspective of gender and sexual orientation, certain terms
    like “butch” and “bimbo” carry connotations related to a woman’s masculinity or
    physical appearance. Depending on the context, these terms can be used to insult
    or reinforce social stereotypes. These subtle differences in language make the
    task of recognising hate speech highly dependent on the specific identity groups
    involved and the context in which the language is used [2].


    There are two main approaches to recognise target group language in hate speech.
    The first, which we name System A, are supervised learning approaches [3,4,5]
    and the state-of-the-art (SOTA) are based on language models [6]. While they can
    achieve high performance, they only give probabilities of the posts containing
    references to particular identity groups. Only the second post in our example
    would contain sensitive language with high probability, but it leaves no further
    information as to why. This lack of supporting information is concerning due to
    the subjective interpretations and biases of human annotators. Judgement of hate
    speech varies significantly according to demographic characteristics [7,8], as
    it is to be expected that any human annotator will lack familiarity with the language
    of a particular target. Thus, integrating grounding knowledge may help to better
    understand predictions, but crucially to make the model more robust to biases
    in the training datasets. The second, which we name System B, are linguistic approaches
    displaying higher transparency [9,10,11]. They provide references using a list
    of terms (lexicon) or regular expression patterns and would identify, for example,
    relevant terminology in the first post [12]. However, they are less accurate as
    they only capture a sparse representation of the language sensitive to an identity
    group.


    In this work, we aim to integrate a Knowledge Graph (KG) to enrich state-of-the-art
    language model predictions with the entities supporting a decision, while preserving
    an optimal predictive performance (Our System). Following our motivating example,
    even if the model gives borderline probabilities for the particular posts, the
    additional semantic information helps to understand the prediction better. Representing
    terms as en-'
  merge: -1
  img_proc: true
