    whereby the expression lost its idiomatic character and is to be understood literally.
    ChatGPT/OpenAI however interpreted also this sentence as an idiomatic expression.


    In the present study, the identification of IE is unsupervised and as a first
    step will be based on n-grams of PoS-tags [10] which yields perplexity expressing
    grammatical surprisal. Secondly, we will consider n-grams of tokens as a representation
    of the respective data sets which yields perplexity expressing lexical surprisal.
    Thirdly, we will consider sequences of thematic roles, i.e., semantic types of
    entities, processes and events as defined by [11,12] which yield perplexity expressing
    semantic surprisal.⁴ In the due course of this paper, we will use the latter term.
    [15, p. 48] describes thematic roles as follows:


    > Thematic roles are generalisations among the arguments of a predicate in order
    to capture regularities between the semantic representation and the syntactic
    expression of that predicate.


    Very elementary thematic roles are, for example, agent and patient, i.e., the
    participants in transitive scenes in the world and transitive linguistic constructions
    that represent those scenes. A sentence like we eat a chocolate could be assigned
    the thematic roles Agent-Process-Patient.


    # 2. Previous work on automatic detection of idiomatic expressions


    To the best of our knowledge there is no work on identification of idioms within
    the framework of information theory. A recent study on the automatic classification
    of phraseologies by [16] reports a unsupervised, classification of IE based on
    topic detection. The authors assume that words that are highly relevant in the
    main topic of discourses are not very likely to occur in IE. In other words, IE
    are assumed to be semantically distinct from the main topic of the discourse,
    and, in addition, the study brings to light that IE are associated with a higher
    level of affectivity. This was proposed already in an earlier study [17], in which
    the authors state that IE are semantic ‘outliers’ in a given context and thus
    cause surprisal. Identification of IE in [17] is carried out by the Principal
    Component Analysis.


    The model in [18] first generates both static and contextualised word embeddings.
    Additional information such as PoS-tags is incorporated in the attention phase,
    and in the enriched static phase, embeddings are further combined with the contextualised
    embeddings. This is input to a BiLSTM-neural network: if the contextualised representation
    of a word is semantically compatible with its context, it is literal; if not,
    it is figurative.


    [19] propose a model that is characterised by syntagmatic and context features,
    and, in addition, by other features such as the number of words in a collocation.
    For the syntagmatic feature, both count-based and predictive models are proposed
    (for the two'
