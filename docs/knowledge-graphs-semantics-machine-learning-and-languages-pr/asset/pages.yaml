  md: 'In addition to these, to specify data users, public sector bodies, competent
    bodies and single information point providers, we added four new classes of entities
    (as subclasses of dpv:LegalEntity) to our vocabulary to represent these terms,
    DataUser, PublicSectorBody, DataReuseCompetentBody, and SingleInformationPointProvider,
    respectively. EU, national, regional, local and sectorial-level single information
    point providers are also modelled as subclasses of SingleInformationPointProviders,
    as depicted in DGA’s Article 8. To be able to classify the nature of the data
    held by public sector bodies, as specified in Article 3.1, we also added four
    new subclasses of dpv:Data, ConfidentialData, CommerciallyConfidentialData, StatisticallyConfidentialData
    and IntellectualProperty to represent data protected through CommercialConfidentialityAgreements
    or through StatisticalConfidentialityAgreements and data protected by intellectual
    property rights.


    Moreover, the following legal basis for the transfer of public sector body-held
    data, as specified in Article 5, are also included in our vocabulary, as subclasses
    of dpv:DataTransferLegalBasis: A5-9 for permissions to transfer, A5-11 for model
    contractual clauses, and A5-12 for adequacy decisions. DataReusePolicy, DataTransferNotice
    and ThirdCountryDataRequestNotice concepts were also added, as subclasses of DPV’s
    policy and notice concepts, to represent the conditions for reuse of data and
    the notice provided to the owners of said data. As there were no concepts identified
    to model the searchable asset list maintained by the SingleInformationPointProviders
    and the procedure to request datasets, both concepts were modelled as DataAssetList
    and as DataReuseRequestProcedure and as subclasses of dpv:OrganisationalMeasure.


    To showcase the usage of existing and newly created terms, an example DataReusePolicy
    for reusing the http://example.com/dataset_001 dataset, that can be used until
    the end of 2023 for the purpose of ScientificResearch, can be found in Listing
    1⁵. It is modelled as an ODRL offer as it proposes the terms of usage of the dataset,
    but does not grant any privileges to the data user. Said policy can be used by
    single information point providers to maintain an updated list of available assets
    and the conditions for their usage. Listing 2 provides an example of a DataAssetList
    published by a SingleInformationPointProvider, using the existing and newly created
    terms. This list contains the previously mentioned dataset, http://example.com/dataset_001,
    with additional metadata regarding the category of data it contains, the policy
    that governs its usage, http://example.com/policy_001, the format and size of
    the data and the fees charged by the publisher of the dataset.


