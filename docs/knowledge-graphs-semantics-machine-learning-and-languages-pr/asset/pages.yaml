- pgno: 160
  md: '# 1. Introduction


    Knowledge graphs have been shown to be useful in the cultural heritage (CH) domain
    to connect and access large collection databases originating from multiple sources
    [1]. Hyvonen et al. [2], for example, have developed the SAMPO data model which
    provided the basis for implementing multiple data portals to access information
    about cultural heritage. With this model, content can be made semantically interoperable
    to support access, search, and discovery, thus overcoming boundaries of data silos.
    While interoperability is an important dimension in providing access to CH data,
    investigating by which access paradigms digital humanities researchers can be
    supported in answering their genuine research questions using knowledge graphs
    is also an important research avenue.


    In this paper, we are in particular concerned with how to leverage knowledge graphs
    for the work of historians. Conceptions of history are widely shared as narratives
    that decisively depend on socio-cultural frames of reference and systems of representation
    [3]. Exploring and understanding these systems is a central task of the humanities
    and cultural studies, with the goal to communicate a spatio-temporal relationship,
    e.g. a historical moment, which equals the construction of meaning and ultimately
    knowledge. In history, agents, places, and events and their relationships play
    an important role. Events in particular can be regarded as 4D objects as they
    take place in a particular geographical location and have a temporal extension.
    Agents in turn can be located at different places at different times and places
    can undergo changes over time. It is thus key that tools that provide access to
    knowledge graphs to historians account for the 4D nature of relevant entities,
    allowing to explore the spatio-temporal relationships between entities.


    The idea of using virtual reality technology (VR) in the CH domain is not fundamentally
    new. VR has been applied to the visualization of historical artifacts or full
    museums to enable a more interactive exploration of such artifacts or museum collections
    [4,5,6]. Our approach differs from the virtual museum paradigm in that we do not
    follow the paradigm of ‘bringing history to life’ but aim to facilitate the exploration
    of historical data networks. Jósza et al. [7] create 4D spatio-temporal models
    of large dynamic urban scenes containing various moving and static objects. Although
    their work has not been carried out in the CH domain, it shows that VR is an adequate
    medium to visualize and explore spatio-temporal 4D data.


    Knowledge graphs built from Linked Open Data (LOD) such as DBpedia and Wikidata
    can provide a basis for the construction of different views on networks. From
    these knowledge graphs, the resources of historical events, persons, places, etc.,
    and related multimodal data can be retrieved and organized in a network for analysis
    in historical studies. Using the three-dimensional space in immersive scenarios
    makes it possible to explore new spatio-temporal relations of historical events,
    persons, etc. in virtual space. In this way, it becomes possible to observe the
    actions of people in a network of space and time that makes new connections visible
    [8, p. 8]. According to Ayers, the visualization of time happens through the visualization
    of the movement of events and people in space [8]. This perception is central
    to the construction of events [9, p. 193] and persons [10], which can also be
    interpreted as specific spatio-temporal relations.


    Towards the goal to leverage knowledge graphs for the work of historians, we present
    a new approach to the exploration of knowledge graphs that relies on VR to create
    an immersive space in which the spatio-temporal connections between entities can
    be explored. Our approach allows to explore the semantic neighborhood of entities
    from dif-'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'ferent perspectives: focusing on entities that are geographically close, temporally
    close, or semantically close, depending on the research question.


    Specifically, we present eTaRDiS, a VR application to enable novel spatio-temporal
    access to knowledge graphs that allows exploring the neighborhood of nodes by
    filtering according to different aspects: time, location, and semantic distance
    in particular. As a VR tool, eTaRDiS offers a new perspective on spatio-temporal
    relationships by deconstructing existing historical narratives, allowing the user
    to explore, compare, and (re)order abstract knowledge fragments, i.e. data from
    a knowledge graph. As a consequence, eTaRDiS can be framed as a “possibility space”
    [11], a sort of laboratory for data and an immersive exploration environment.
    An initial expert review of our approach gave us valuable insights into the use
    cases and requirements that guided our developments [12].


    The application consists of two main views: the Hub (see section 3.2.1) and the
    Fragmentarium (see section 3.2.2). The Hub allows a user to select a dataset to
    explore and a node to start the exploration. The Fragmentarium allows to explore
    the neighborhood of a given node; we call such neighborhoods that are defined
    according to some distance measure historical fragments. The neighborhoods are
    visualized in VR as labeled spheres floating around the user. Selecting one of
    the related data points, in turn, updates the visualization by showing those data
    points related to the newly selected one. This enables the exploration of the
    network of related agents, places, events, etc. according to one’s own individual
    interest.


    As a main contribution of this paper, we describe the design and implementation
    of the eTaRDiS system. We further present the results of a user study involving
    13 participants. As main result, the study showed that users generally found it
    easy to identify the relation between historical fragments using the features
    of the eTaRDiS VR application and by exploring the semantic neighborhood of fragments.
    A qualitative analysis of the interaction revealed that participants used different
    strategies to solve the tasks, tested the boundaries of the rules in our virtual
    environment, and liked the playful approach to exploring historical data. In the
    study, our tool achieved an overall System Usability Scale (SUS)[13] score of
    71.92, corresponding to a ‘satisfactory’ rating. Further analysis showed that
    the self-assessment of users regarding their usage of digital media had an influence
    on the SUS score. Participants who rated themselves as ‘good’ to ‘extremely good’
    at using digital media have a higher mean SUS score of 77.8 (a rating of ‘satisfactory
    to excellent’) compared to the participants who rated themselves as ‘very bad’
    to ‘not bad’ at using digital media (mean SUS score: 58.8).


    # 2. Related Work


    Virtual reality (VR) has been shown to be a valuable tool for interaction with
    networks in several areas, especially in the natural sciences. For example, Pirch
    et al. [14] developed the ‘VRNetzer platform’ for the interaction with large network
    structures of genes to identify genes indicating rare diseases (see also the work
    of Buphamalai et al. [15]). Some applications, namely HisVA [16], VaiRoma [17],
    and POLIS [18], have been implemented for the exploration and analysis of data
    from the Semantic Web through 2D visualizations. However, no VR applications have
    been developed in the CH domain and the digital humanities to explore existing
    knowledge graphs.'
