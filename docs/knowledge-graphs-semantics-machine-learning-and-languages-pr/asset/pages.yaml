  md: "The authors of [2] interpreted this task as a pathfinding problem, where a\
    \ path found between *e* and *e′* in a KG serves as a means of describing the\
    \ entity relationship. Web search engines like those mentioned before allow users\
    \ to issue arbitrary textual queries with entities from basically any domain.\
    \ Accordingly, they used Wikidata [5], a large general-domain KG, for their work\
    \ since more specialized KGs do not encompass this scope. Applied to the previous\
    \ example, one useful path between the entities *European Union* and *Alan Turing*\
    \ in Wikidata is⁶:\n\nQ458 (European Union) →P530 (diplomatic relation)→ Q145\
    \ (United Kingdom)  \n←P27 (country of citizenship)← Q7251 (Alan Turing)\n\nNote\
    \ that properties in a KG can be interpreted in both directions. Therefore, the\
    \ edges of a KG can be considered as bidirectional [3]. The vast size and generality\
    \ of KGs like Wikidata pose several concrete problems for pathfinding [2]:\n\n\
    +   - Uninformed search algorithms like breadth-first search might not suffice\
    \ for pathfinding.\n+   - KG interfaces struggle to deliver all edges of a queried\
    \ entity.\n+   - Users desire meaningful entity relationships.\n\nTo tackle these\
    \ problems, [2] proposes a bidirectional A* search algorithm [6] that considers\
    \ the semantic distance between entities estimated via word embeddings of their\
    \ labels to guide the search. The algorithm is parameterized with three hyperparameters\
    \ *α*, *β*, and *γ* that weight the individual components of the employed cost\
    \ function (s. Section 2). Despite the promising results, the paper leaves several\
    \ open points: The algorithm’s performance was evaluated based on only twelve\
    \ hand-selected dual-entity queries using hand-selected configurations of the\
    \ hyperparameters. Moreover, further tests (s. Section 3) with the original algorithm\
    \ indicated that the entity labels alone do not yield accurate word embeddings\
    \ and thus compromise the search. To tackle these open points, the present paper\
    \ investigates the following research questions:\n\n+   RQ1: How to estimate the\
    \ semantic distances between entities more accurately?\n+   RQ2: How to obtain\
    \ realistic dual-entity queries for pathfinding in Wikidata?\n+   RQ3: What is\
    \ an optimized hyperparameter configuration for the algorithm?\n+   RQ4: How does\
    \ the optimized hyperparameter configuration perform (against other configurations)\
    \ on a large dual-entity query dataset?\n\nThe remainder of the present paper\
    \ is organized as follows: Section 2 investigates foundations and related work,\
    \ including a thorough recapitulation of [2]. Building upon this, Section 3 focuses\
    \ on answering RQ1 through RQ3. Section 4 discusses the implementation developed\
    \ in the context of the present paper⁷, before RQ4 is addressed in Section 5.\
    \ Finally, Section 6 draws a conclusion and provides directions on future work.\n\
    \n⁶ In this notation, the properties within the arrows (edges) connect the surrounding\
    \ entities (nodes) in the respective direction. The strings with leading Q and\
    \ P are Wikidata’s proprietary IDs for entities and properties.\n\n⁷ The implementation\
    \ and all resources required to reproduce the results are available in the GitHub\
    \ repository at https://github.com/uniba-mi/bipass-wikidata-pathfinder, which\
    \ is also indexed in the Software Heritage Project’s archive (https://archive.softwareheritage.org;\
    \ accessed 2023/05/26)."
