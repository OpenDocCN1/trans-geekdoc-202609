  md: '# **Table 2.** The four configurations for the hyperparameters α, β, and γ
    used in [2].


    | Name | α | β | γ | Description |

    |---|---:|---:|---:|---|

    | Uninformed | 0 | 1 | 0 | Only considers the path length, similar to breadth-first
    search. |

    | Semantics-Only | 1 | 0 | 1 | Ignores the path length and only considers the
    semantic distances. |

    | Greedy | 0 | 0 | 1 | Estimates the total path costs as the semantic distance
    of the last entity on the path to *ele′* depending on the search direction. |

    | Balanced | 1 | 0.5 | 1 | Leverages all components of the cost function in a
    balanced setting. |


    In recent years, novel transformer-based approaches like BERT [15] yielded excellent
    results, thus replacing previous approaches including fastText as the state-of-the-art
    for various natural language processing tasks. There are numerous variants of
    BERT tailored to specific domains and tasks. One example is Sentence-BERT or SBERT
    [16], which is able to efficiently compute accurate vector representations of
    sentences. For SBERT, various pre-trained models are available, which are also
    tailored to specific tasks. Section 3 introduces how entity descriptions, which
    are often one or multiple sentences, can be leveraged in addition to entity labels
    to improve the accuracy of the semantic distances. One potent model fine-tuned
    for sentences as well as short paragraphs is all-mpnet-base-v2¹², which is based
    on Microsoft’s MPNet [17]. Due to the characteristics of the new input and its
    general performance, fastText is replaced by SBERT in combination with all-mpnet-base-v2
    for the implementation of the cost function.


    # 2.2. *Hyperparameter Optimization*


    In [2], the authors evaluated the performance of the pathfinding algorithm using
    only the four intuitively set hyperparameter configurations shown in Table 2,
    which leaves room for improvement. The recent attention on machine learning fueled
    the investigation of hyperparameter optimization techniques, i.e., methods for
    automatically setting hyperparameters of objective functions to optimize performance
    [18]. One example is Bayesian optimization, a state-of-the-art optimization framework
    for the global optimization of expensive blackbox functions that is applicable
    for a wide range of problems [19]. The Bayesian optimization framework can be
    broken down into two primary components [19,18]. Firstly, there is a probabilistic
    surrogate model that incorporates a prior distribution representing the beliefs
    about the unknown objective function’s behavior. Secondly, an acquisition function,
    that measures the optimality of a series of queries, is utilized. The goal is
    to minimize the anticipated loss to determine the optimal sequence of queries.
    Based on the output of each query, the prior is revised, resulting in an informative
    posterior distribution over the objective function’s space. Due to this incremental
    approach to optimization, it outperforms basic hyperparameter optimization techniques
    like grid search both in terms of the hyperparameter quality and efficiency.


    A related alternative is called Simple(x) or just Simple [20]. While Bayesian
    optimization uses computationally expensive Gaussian processes to model the objective
    function, Simple creates a model by dividing the optimization area into simplices.
    The algorithm iteratively tests points within each simplex to create a more precise
    model. Thereby, this approach converts the optimization task into a dynamic programming
    problem, allowing samples to be taken without updating the entire model. Hence,
    Simple is employed for the optimization of α, β, and γ in Section 3.


    ¹² https://huggingface.co/sentence-transformers (accessed 2023/05/26)'
