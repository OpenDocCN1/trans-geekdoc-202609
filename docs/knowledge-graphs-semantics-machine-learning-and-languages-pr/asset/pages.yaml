- pgno: 144
  md: '# 2. Related Work


    High-quality metadata is necessary to increase the accessibility and reusability
    of digital content. The metadata of a museum object must include detail about
    the object before it enters a museum, as well as details that are generated while
    the object is in the museum [10]. When modelling cultural heritage data, it must
    be represented in a usable way for non-technical users, such as cultural heritage
    experts, to query, review and reuse it. There has been extensive research done
    on modelling of cultural heritage metadata [1,3,11,12,13]. However, none of these
    works investigated how to model rich object provenance information, which typically
    ends up as textual reports only.


    Both object-centric and event-centric ontologies have been developed to represent
    cultural heritage metadata. Research, however, found that an event-centric approach
    provides advantages for representing provenance or other temporal data [1,14].
    The event-centric model represents knowledge through associated events, such as
    acquisition or production. An ISO standard since 2006, CIDOC-CRM [15,16] is an
    event-centric ontology which is designed for the cultural heritage sector to facilitate
    the integration and interchange. CIDOC-CRM can be used to model multiple instances
    of semantic information regarding a given reality by adding multiple information
    layers. However, research [17] has shown that by itself this is not an feasible
    solution for representing multi-perspective data as these multiple layers are
    simply information accumulation without mentioning data provenance. The authors
    argue that the data must be organised so researchers can easily find previous
    information and use it for new reasoning.


    Conversations around multiple perspectives are taking place in the cultural heritage
    domain [18,19]. Dijkshoorn et al. [1] present six requirements for cultural heritage
    ontologies, one of these supports capturing multiple sources with possibly conflicting
    views while describing the same artefact. In their research, it has been shown
    that the Europeana Data Model [20] allows multiple records for the same object
    by using proxies. Proxies in EDM can, however, only depict objects on a general
    level by connecting a proxy to the object resource and not to a specific statement
    about that resource. A similar approach is adopted by Ockeloen et al. [21], who
    propose a proxy solution for representing biographical descriptions from different
    perspectives and sources.


    Another solution for multi-perspective representation can be found using named
    graphs. Bizer et al. [22] state that information providers have different world
    views; therefore, a named graph allows different information providers to make
    different claims regarding the same entity. The advantage of named graphs is that
    it allows grouping a collection of triples to make statements on the whole set
    and can quickly be adopted when CIDOC-CRM is implemented in RDF. Having IRIs on
    the named graphs introduces the possibility of attaching data provenance to the
    graph itself.


    While the need for multi-perspective representations of cultural heritage data
    is identified, the practical application is still challenging. This research identifies
    a possible solution for representing multi-perspective interpretations of cultural
    heritage object provenance that is based on the domain standards discussed above.


    # 3. Requirement Analysis


    This section describes the requirement analysis for representing multi-perspective
    representations of cultural heritage provenance. A more detailed account of this
    analysis is'
