  md: 'We added the LPT 5.8, as we think it could be useful in the development of
    hybrid techniques mixing LM and OM where the absence of TBox would be perceived
    as a problem.


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_221_0.png)


    # 5.2. *Formalization of the LPT classification*


    We formalized the LPT classification, as illustrated in Figure 12. We use the
    lpt prefix as the namespace for our classification. The lpt:LPT class is the primary
    class in our model. To maximize reuse, we rely on established vocabularies as
    much as possible instead of creating new classes and properties. Especially, we
    used SKOS, RDF-S, Dublin Core and PROV-O [27] to describe the classes. Additionally,
    we used the DCAT vocabulary [28] to define datasets and their distributions. We
    introduced the class lpt:PairOfDatasets to represent a couple of dcat:Datasets
    that is or need to be linked. This class refers the pair into an object that can
    be described on its own, e.g., status of linking, date of linking, source of linking;
    we do not describe these here. The lpt:occursIn property is the key relation in
    our model: it encodes the fact that a certain linking problem type occurs/appears
    in a certain pair of datasets. To provide a detailed description of such a pair,
    instances of the lpt:PairOfDatasets class are linked to two separate individuals
    of the dcat:Dataset class using the lpt:hasSource and lpt:hasTarget properties.
    The property prov:wasInfluencedBy connects the lpt:LPT class to the underlying
    heterogeneities reported by various authors and encoded with the class lpt:Heterogeneity.
    The bibliographic sources from which we derived the descriptions of the heterogeneities
    that guided our classification are captured with the property prov:wasDerivedFrom
    to an object in the BIBO ontology [29].


    An example of instantiation of the LPT classification model is provided in Figure
    13. This example is in fact a real example of the appearance of the LPT 2.1.1
    problem called `Predicate terminological synonymy` in the lpt:datasetOAEI101 and
    lpt:datasetOAEI205 datasets accessible from https://oaei.ontologymatching.org/tests/101/onto.rdf
    and https://oaei.ontologymatching.org/tests/205/onto.rdf respectively. This pair
    of RDF datasets is made available by OAEI to allow future participants to test
    their tools.


    This classification is currently being made available on the web in OWL format.
    The choice of this representation language was made with a view to encoding a
    hierarchical classification for future use by software solutions exploiting the
    inference capabilities'
