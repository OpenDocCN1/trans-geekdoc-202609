- pgno: 130
  md: "Section 1. Particularly in Wikidata, numerous paths between two entities can\
    \ be found, thus posing the question which candidate path is the most meaningful.\
    \ Since meaningfulness is a highly complex and subjective concept, there are different\
    \ approaches tackling this problem from different directions. For example, [3]\
    \ investigated how informative subgraphs explaining the relationship between entities\
    \ can be mined from entity relationship graphs. To this end, the proposed approach\
    \ ranks candidate nodes according to their informativeness, which is computed\
    \ using edge weights that are based on co-occurrence statistics for entities and\
    \ relationships. While this statistical approach yields subgraphs that are structurally\
    \ important with respect to the query entities, it disregards available semantic\
    \ information like the entity labels. Thus, the found subgraphs might be prone\
    \ to concept drift [12], which occurs when the semantic focus of the query is\
    \ left.\n\nIn comparison, the authors of [2] argue that a path with minimal concept\
    \ drift is a meaningful path. Further, they propose to assess whether a certain\
    \ entity is out of a query’s semantic focus by means of the semantic distances\
    \ between entities. To calculate the semantic distance they use the cosine distance\
    \ between the fastText⁹ word embeddings [13] of the entities’ labels. fastText\
    \ is a well-known library by Facebook that produces static vector representations\
    \ for words, while being robust against misspelling. With respect to the general\
    \ cost function f(p) = g(p) + h(p) of the A* search algorithm [6], [2] introduces\
    \ a cost function that leverages semantic distances and the path length to calculate\
    \ the costs of a path p comprising n entities as follows¹⁰ [2]:\n\n```\ng(p) :=\
    \ α · \\bar{d}(p_{[..n-1]}, e') + β · n\n h(p) := γ · d(v_n, e')\n where p = ⟨e,\
    \ ..., v_n⟩\n and p_{[..f]} is the sub-path ⟨e, ..., v_f⟩ of p\n```\n\nRepresenting\
    \ the first part of formula g(p), the formula \\bar{d}(p_{[..n-1]}, e') calculates\
    \ the average of the semantic distances between all entities on the path except\
    \ the last and e'. The second part is supposed to add the path length to the costs¹¹.\
    \ The formula h(p) estimates the costs of the remaining path by means of formula\
    \ d(v_n, e') as the semantic distance between the last entity on the path and\
    \ e'. As shown, the cost function is parameterized with three hyperparameters\
    \ α, β, and γ that weight its components. To calculate the costs of a converse\
    \ path in the bidirectional search, i.e., a path that starts at e' with the goal\
    \ of finding a path to e, e and e' are simply interchanged in the cost function.\n\
    \nIn addition to preferring semantically meaningful paths, the usage of this cost\
    \ function as a search heuristics serves a second purpose. As explained in [2],\
    \ the semantic distance of an entity to other entities tends to positively correlate\
    \ with the minimal number of hops between the entities. For instance, entities\
    \ that are at least five hops apart typically have a higher semantic distance\
    \ than entities that are two hops apart. By prioritizing entities with a lower\
    \ semantic distance to a target entity, the chances of reaching the target entity\
    \ earlier are therefore higher compared to a breadth-first search."
