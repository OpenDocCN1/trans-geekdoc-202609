    id and lname are associated with the operand of their parent field, namely employees,
    through ?z. Last, note the additional operand that is generated for the field
    employees. Its goal is to discard vertices that are not of type Person. We assume
    that type filtering is not required for scalar types for brevity.


    # 3.2. Operand Dependency Graph


    The operand dependency graph is inspired by pattern trees [33] and captures the
    dependencies between the operands of a query. If an operand is not successfully
    resolved during the query evaluation, its dependent operands should not be evaluated.
    For example, provided a GraphQL query f [α]{φ}, the operands of φ should not be
    considered if the operands of f [α] do not produce any results. However, if the
    operands of φ do not produce any results, the results generated by f [α] should
    not be discarded. The operand dependency graph is formally defined as follows.


    **Definition 3.1 (Operand dependency graph)** _Let O be a list of query operands
    and Σ an alphabet. Furthermore, let Iₙ = {i ∈ ℕ | 1 ≤ i ≤ n}. An operand dependency
    graph is a directed vertex-edge-labelled graph G = (V, E), where V = |O| and E
    ⊆ V × Σ × V. An operand v ∈ V depends on operand u ∈ V, if and only if ∃e ∈ E
    such that e = (u, σ, v) and σ ∈ Σ._


    As per Definition 3.1, the vertices of an operand dependency graph correspond
    to the operands of its respective query. The variables appearing in query operands
    are assigned unique labels stemming from Σ and are used to label the vertices
    and edges of the dependency graph. The vertices of the dependency graph are assigned
    the labels of their respective operands’ variables. Two operands are connected
    via an edge only if they share a variable. The label of an edge is determined
    by the label shared by its incident vertices.


    For the construction of the operand dependency graph, we take advantage of the
    hierarchical structure of GraphQL queries. Provided an expression f [α]{φ} (ℓ
    : f [α]{φ}), the operands of f [α] comprise a strong component in the dependency
    graph, as they all depend on each other. This means that any vertex v of f [α]
    is reachable from any other vertex u of f [α], with v ≠ u, provided that f [α]
    generates multiple operands. As the operands of φ depend on the operands of f
    [α], the vertices of f [α] are not reachable from the vertices of φ. In the case
    of on t{φ} expressions, the operands of φ depend on the operand of t. This means
    that the vertex of t and the vertices of φ are connected with edges, whose source
    is the vertex corresponding to t. In the case of φ₁…φₖ expressions, there are
    not any edges between the vertices of any φᵢ and φⱼ, with 1 ≤ i, j ≤ k and i ≠
    j, as the evaluation of φᵢ does not affect the evaluation of φⱼ (Definition 2.4).
    Operands that depend on each other participate in join operations, whereas unidirectional
    edges denote left-join operations. Last, in the multi-way left-join algorithm,
    which is presented below, we make use of the root node of the directed acyclic
    graph connecting the strongly connected components of an operand dependency graph.
    Herein, we refer to this node as the independent strong component of the dependency
    graph.'
