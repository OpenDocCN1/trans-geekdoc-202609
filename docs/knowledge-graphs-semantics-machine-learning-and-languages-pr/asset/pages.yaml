  md: "over digital datasets, respectively. DPV is a W3C Community Group Report, which\
    \ has recently published a stable version 1, aimed at providing a complete, open-access\
    \ set of taxonomies to express machine-readable metadata about the use and processing\
    \ of personal data, such as taxonomies for legal entities, purposes, types of\
    \ processing activities, legal basis, types of data, rights or technical and organisational\
    \ measures. By combining the usage of these standards and specifications to automate\
    \ the discovery of datasets (Ch1), specify policies for the reuse and sharing\
    \ of data (Ch2), and comply with legal obligations (Ch3), such as sending notifications\
    \ to the competent authorities under the DGA, this work will enable organisations\
    \ to gradually move from completely manual processes to ones based on utilising\
    \ automation and technologies to assist in ensuring correctness and scalable architectures\
    \ on the data-sharing services ecosystem.\n\nIn order to address the identified\
    \ challenges, we determined what reuse conditions are necessary to specify *how*\
    \ to share data, *who* are the new involved stakeholders, and *what* documents\
    \ are required to comply with the new law. Therefore, the following research objectives\
    \ are presented as the basis of this work:\n\n+   RO1. Identify the stakeholders,\
    \ information items and information flows relevant for the sharing of data compliant\
    \ with the DGA.\n+   \n+   RO2. Identify terms missing from W3C’s specifications\
    \ for representing data-sharing policies and consent terms.\n+   \n+   RO3. Generate\
    \ registers of altruistic and data intermediary activities which can be queried\
    \ by the competent authorities.\n\nMoreover, the principal contributions of this\
    \ paper are summarised as follows:\n\n+   C1. Identification of DGA entities and\
    \ how data flows between them.\n+   \n+   C2. Identification of Use Cases where\
    \ the usage of semantic vocabularies will assist in the automation of tasks.\n\
    +   \n+   C3. Development of ad-hoc vocabulary for representing data-sharing policies,\
    \ consent and permission terms and registries of activities.\n+   \n+   C4. Demonstration\
    \ of representation of DGA-related information using the mentioned semantic web\
    \ technologies and the developed vocabulary.\n\nThis paper is organized as follows:\
    \ Section 2 describes the entities and flows of data between entities defined\
    \ by the DGA in which the usage of semantic technologies can promote the automation\
    \ of tasks, while Section 3 discusses the state of the art in semantic models\
    \ for data governance. Section 4 provides an identification of vocabulary terms\
