    by the identified entities. The direction of the arrows represents the direction
    of the information flow between entities. A simple description of each information
    flow is provided on the right side of the Figure.


    The identified entities can be classified as a data holder, data subject, data
    user, data intermediation service provider – or data intermediary –, data altruism
    organisation, legal representative, national, or competent, authority, single
    information point provider, public sector body, or competent body. Information
    flows including the soon-to-be-created European Data Innovation Board and European
    Commission are also displayed in Figure 1. Their definitions are presented below:


    +   - **Data Subject** Individual whose personal data is being processed

    +   - **Data Holder** An entity who has the right to grant access to or to share
    certain personal data or non-personal data

    +   - **Data User** An entity who has the right to use personal or non-personal
    data for commercial or non-commercial purposes

    +   - **Data Intermediation Service Provider** An entity who establishes commercial
    relationships for the data sharing between data subjects and data holders on the
    one hand and data users on the other'
