    dct:language ?language ;

    dct:publisher ?publisher .

    OPTIONAL { [ER] dct:creator ?creator }

    OPTIONAL { [ER] dct:created ?created }

    OPTIONAL { [ER] dct:description ?description }

    }

    ```


    ```

    Q6

