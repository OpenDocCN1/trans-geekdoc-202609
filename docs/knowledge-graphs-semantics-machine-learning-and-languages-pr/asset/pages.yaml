    correct translations. We also found 23 questions lacking Spanish translation;
    these were classified as major translation issues.


    # 3.2. Translation of Questions


    The translation process consisted of two agents, “the translator” and “the reviewer”,
    interacting within two stages: the translation stage and the review stage.


    The translator is a native Spanish speaker with the main objective of generating
    new translations while matching the old translations to one of the seven cases
    described before. This agent is also required to have a high level of understanding
    of SPARQL and the QALD-JSON format in order to be able to check the question information
    if required.


    The reviewer is a native Spanish speaker with the main objective of reviewing
    the new translation and providing feedback to the translator to improve the quality
    of the new translations.


    In the translation stage, the translator reviews each question by checking the
    original English question, its original QALD-9 translation, the English question
    keywords, and the QALD-9 translation keywords. The translator annotates the cases
    that describe the question translation (see above) and generates a translation
    for the English question. The translation is kept if the question’s translation
    is correct (case 7). The translator will always look for the Spanish version of
    proper names in order to keep the translation as natural as possible (cases like
    “Iraq”, which is spelled “Irak” in Spanish); this also implies not translating
    proper English names if the Spanish-speaking community knows the entity by the
    English name (like the TV show “Friends”). The translator’s goal is always to
    generate correct translations (avoid grammatical and accentuation mistakes) that
    fit in the natural Spanish dialect.


    In the review stage, the reviewer checks the original English question, the translation
    generated by the translator, and the keywords from the new translation, looking
    for possible mistakes. The mistakes are annotated and sent to the translator.
    The translator reviews the observations, and if the translator agrees with the
    correction, the question is modified; corrections that raise additional concerns
    about the translation are annotated and discussed with the reviewer. The reviewer
    explains why the corrections are necessary so the translator can make a choice;
    in some cases, the translator reviews the question’s SPARQL query and answers
    to make an appropriate choice. This process was executed over the original QALD-9
    dataset. Once the native translations were generated, they were merged into QALD_9_plus
    using the question’s id, generating what we call QALD-9-ES¹¹.'
