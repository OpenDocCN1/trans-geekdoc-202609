  md: '# Polyvocal Knowledge Modelling for Ethnographic Heritage Object Provenance


    Sarah Binta Alam SHOILEE a,1, Victor DE BOER a,2, and Jacco VAN OSSENBRUGGEN a,3


    a Vrije Universiteit Amsterdam, the Netherlands


    ORCiD ID: Sarah Binta Alam Shoilee https://orcid.org/0000-0001-9458-8105, Victor
    de Boer https://orcid.org/0000-0001-9079-039X, Jacco van Ossenbruggen https://orcid.org/0000-0002-7748-4715


    # Abstract.


    Purpose: Information about biographies of museum objects (object provenance) is
    often unavailable in machine-readable format. This limits findability and reusability
    of object provenance information for domain research. We address the challenges
    of defining a data model to represent ethnographic cultural heritage objects’
    provenance, which includes multiple interpretations (polyvocality) of, and theories
    for, the object biography, chains of custody and context of acquiring. Methodology:
    To develop a data model for representing the provenance of ethnographic objects,
    we conducted (semi-)structured interviews with five provenance experts to elicit
    a set of requirements. Based on these requirements and a careful examination of
    six diverse examples of ethnographic object provenance reports, we established
    a set of modelling choices that utilise existing ontologies such as CIDOC-CRM
    (a domain standard) and PROV-DM, as well as RDF-named graphs. Evaluation: Finally,
    we validate the model on provenance reports containing six seen and five unseen
    ethnographic cultural heritage object from three separate sources. The 11 reports
    are converted into RDF triples following the proposed data model. We also constructed
    SPARQL queries corresponding to nine competency questions elicited from domain
    experts in order to report on satisfiability. Findings: The results show that
    the adapted combined model allows us to express the heterogeneity and polyvocality
    of the object provenance information, trace data provenance and link with other
    data sources for further enrichment. Value: The proposed model from this paper
    allows publishing such knowledge in a machine-readable format, which will foster
    information contextualisation, findability and reusability.


    Keywords. Cultural Heritage, Provenance information, Polyvocality, Domain modelling,
    Knowledge Representation.


    # 1. Introduction


    More and more cultural heritage organisations are producing and publishing their
    data as Knowledge Graphs [1]. One of the reasons for adopting these technologies
    in this domain is that the graph structure allows to express heterogeneity of
    information [2], while facil-'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'itating interoperability. However, producing machine-readable knowledge graphs
    from existing structured data and unstructured sources is not a trivial operation
    [3]. At the same time, museum professionals and external researchers continuously
    acquire new information about collection objects and existing information is then
    cast in a new light. Especially in the context of post-colonial challenges to
    ”decolonise the database”, heritage institutions are seeking out how to incorporate
    previously underrepresented voices in their practice, collections and information
    systems (cf. [4]).


    Cultural heritage institutions, especially those with ethnographic collections,
    continuously (re)contextualise objects by learning new facts about objects’ biographies
    [5]. The traditional method is through dedicated research on individual objects,
    known as *provenance research*. Cultural heritage object provenance describes
    an object’s history of ownership and evidence of the legal status of an object
    [6]. It can also be used to form an assessment of the authenticity of an artefact
    and identify any unlawfully appropriated works [7]. In many cases, the details
    of this extensive research are not available as structured data but only reported
    in a narrative textual document, which limits the findability, reusability and
    interoperability of such information. Typically, the person who conducts the research
    or the institute they are representing reflects on object metadata [8]. Once the
    research is done, the researcher might update a limited amount of metadata in
    the collection management system. In this process, potentially multiple views
    are reduced to a single perspective of truth. For example, the same object can
    be annotated with term “war loot” or “legally owned property”, depending on the
    researcher’s interpretation of the documentation on the war. Such an interpretation
    can be affected by personal, cultural or political context and is likely to change
    over time. More importantly, when more than one annotation has equal merit to
    be valid, it is necessary to preserve both interpretations in the metadata. To
    allow future researchers and professionals to investigate these multiple perspectives,
    the institutions’ information systems needs to be able to preserve, maintain and
    deliver the different views of objects and their provenance data [9].


    The Semantic Web as an information architecture and Knowledge Graphs as the data
    model are promising technologies of such polyvocal knowledge representations [9].
    Its dispersed and networked nature makes it ideally suited to handle diverse opinions,
    while at the same time preserving competing views with the sources of their origin.
    We consider this research on representing multiple perspectives as an example
    of such polyvocal knowledge representation. We investigate to which extent existing
    Semantic Web solutions, such as named graphs and existing ontologies for provenance
    and heritage, are suitable to represent multiple perspectives in data.


    This paper’s contribution lies in examining how Semantic Web technologies, (i.e.,
    named-graphs, PROV-DM) and existing cultural heritage ontology (i.e., CIDOC-CRM)
    can be combined into a single model to meet the polyvocal provenance requirements
    specified by domain experts. We first identify these requirements for representing
    multi-perspective ethnographic object provenance information. We propose how such
    information can be modelled and apply this model to eleven ethnographic objects
    demonstrating the expression of complex chains of custody of the object biographies
    while preserving data provenance. The solution preserves the polyvocality of such
    information when multiple alternate theories are available. The resulting knowledge
    graph is validated against the Competency Questions constructed from the requirement
    analysis.'
