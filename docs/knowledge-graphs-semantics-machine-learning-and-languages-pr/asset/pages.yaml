- pgno: 156
  md: 'Especially when provenance reports may list and question information simultaneously.
    The model lacks the ability to assign weight to different statements, even if
    they contradict each other, due to the absence of an existential quantifier. Another
    important issue is that the current data model do not support information misrepresentation
    happened in the past. To preserve this information, the model places such statements
    under different named graphs and connects them with agents who made the statements.
    However, there is no means to indicate that this information is no longer considered
    valid. One solution is to use time-period information with named graphs to be
    able to refer to historical (event-based and provenance based) context.


    To simplify the management of a cultural heritage object’s chain of custody and
    to provide an abstraction over multiple objects, this study suggests using E8
    Acquisition for legally recognized acquisitions and E10 Transfer of Custody for
    all other transfers. These entities can be further specified with sub-activities
    to define the type of ownership transfer, enabling institutions to model their
    specific notions of accession and deaccession. The International Council of Museums’
    documentation standard emphasizes the importance of using controlled terms to
    ensure consistent documentation [6], but the domain-standard vocabulary, AAT,
    lacks terms for unethical acquisitions.


    # 7. Conclusion


    Previous research identified a need for extending the domain ontology CIDOC-CRM
    to provide effective solutions for modelling multiple interpretations of cultural
    heritage object [17]. This study identifies requirements for modelling multiple
    perspectives on biographies of cultural heritage objects. After analyzing six
    distinct examples of ethnographic object provenance reports and considering the
    requirements, this paper proposes a data model that utilizes existing ontologies,
    i.e., CIDOC-CRM and PROV-DM, along with RDF-named graphs. Validation on six seen
    and five unseen objects confirms that the proposed model addresses complex chain-of-custody,
    data provenance, and multi-perspective representation requirements. We therefore
    conclude that the proposed data model allows to express cultural heritage object
    provenance in an interoperable manner.


    In the field of heritage and humanities, and especially in the context of “decolonization”
    of the museums’ databases, it is crucial that multiple (temporal, cultural and
    geographical) views from researchers, source communities and others, can be represented
    in the data structures. Although we focus in this research on ethnographic heritage
    collection’s provenance information, the findings have implications on a more
    general provenance report to express such data polyvocality. Future work should
    incorporate information extraction tools to automate data conversion from textual
    reports of such knowledge that is inherently complex. The other possibility is
    facilitating the domain expert with easy tooling support to allow data modelling
    by themselves. Additionally, the provided model can be extended with methods to
    assign degrees of certainty to statements to allow data modellers to indicate
    the confidence levels of those statements.


    # Acknowledgements


    The authors would like to thank the domain experts for their invaluable contributions.
    This work is partially based on previous work conducted in collaboration with
    Anne Coos van der Tang Eliasson [23]. This work was carried out in the context
    of the NWA funded project Pressing Matter (NWA.1292.19.419).'
