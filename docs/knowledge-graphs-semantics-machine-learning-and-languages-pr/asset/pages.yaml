- pgno: 255
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_255_0.png)


    Figure 3. Generation of the facets tree.


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_255_1.png)


    Figure 4. Retrieval of results in the faceted search.


    Figure 4, we query the corresponding ES cluster to retrieve results, which holds
    only indexed search related information. In the post-processing step, the results
    from the faceted search (i) are merged with the result set from the semantic search
    (if it was executed first), and (ii) filtered to match user access rights for
    the content. Final results are displayed as snippets in the frontend.


    # 4. Conclusion and Outlook


    Curated KGs, which undergo a careful engineering and data integration, act as
    useful resources for various applications such as IR, decision support and recommendation
    systems. In this work, we presented the pipeline for an on-the-fly integration
    of the PlanQK platform data into a unified KG. The semanticification process can
    be further improved by extracting relevant concepts and relations from textual
    attributes through machine learning enhanced techniques, e.g., named entity recognition.
    To ease IR over the platform, we implemented the native semantic search as well
    as the faceted semantic search. Further work is required to evaluate the search
    functionality and refine the search capabilities. We plan to expose a part of
    PlanQK KG as Linked Open Data and establish connections with related external
    sources such as DBPedia [19], Wikidata [20] and graphs in the research domain,
    e.g., Open Research Knowledge Graph (ORKG) [21]. As the knowledge in the field
    of quantum computing is currently changing rapidly, the possibility of the controlled
    graph curation by the community should be established.


    # Acknowledgments


    This work was partially funded by the BMWK project PlanQK (01MK20005F /01MK20005A).'
