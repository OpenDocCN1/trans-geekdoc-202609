  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_35_0.png)


    Figure 1. An example of shortened abstract of "Marie Curie" entity in DBPEDIA.


    # 1. Introduction


    DBPEDIA is one of the most popular knowledge graphs in the Linked Open Data cloud
    (LOD) [1]. DBPEDIA has been widely used as a significant resource for accessing
    and linking knowledge on the web, particularly in the context of the semantic
    web and linked data. Entity abstracts (dbo:abstract) are an essential component
    of DBPEDIA, as they provide a concise summary of the Wikipedia page for each entity.
    Moreover, there are two types of DBPEDIA abstracts: 1) Full abstracts, which are
    extracted from first paragraphs of the corresponding WIKIPEDIA article for each
    entity. 2) Short abstracts² are automatically created by selecting the first few
    sentences (i.e., two-three sentences) from the full abstracts [2]. Short abstracts
    are used to provide users with a comprehensive overview of the most significant
    information about entities. For example, Google employs short abstracts of search
    concepts in the knowledge panel to offer users a concise summary of the searched
    entities [3]. However, the method of creating these short abstracts omits other
    relevant information in the remaining portion of the full abstract. Figure 1 shows
    an example of the shortened abstract of “Marie Curie” entity that is created by
    truncating³ the first sentences from its full abstract⁴. This shortened abstract
    ignores other essential information such as “The cause of her death was given
    as aplastic pernicious anaemia, a condition she developed after years of exposure
    to radiation through her work”, which is relevant for understanding Marie Curie’s
    life and achievements. It is important to note that some short abstracts of DBPEDIA
    are unavailable in specific languages.


    To address these challenges, we leverage pre-trained language models (LLMs) to
    generate abstractive summaries of DBPEDIA entities. Recently advances in pre-trained
    language models have led to impressive performance in text summarization tasks,
    achieving state-of-the-art performance on various benchmark datasets [4–7]. Inspired
    by this success, we employ two state-of-the-art LLMs in our comparative study:
    i) BART (short for Bidirectional Auto-Regressive transformers) model, which can
    generate more accurate and coherent summaries by considering the context of a
    text in both directions (left-to-right and right-to-left) [8], ii) T5 (short for
    Text-To-Text Transfer Transformer) model is based on a transformer architecture
    with a self-attention mechanism that uses a text-to-text approach, i.e., the T5
    model is trained to generate an output text based on an


    ² https://databus.dbpedia.org/dbpedia/text/short-abstracts/

    ³ full text of last sentence is "the first woman to become a professor at the
    University of Paris"

    ⁴ https://en.wikipedia.org/wiki/Marie_Curie'
