  md: 'tation of new obligations on the entities processing personal data, the European
    Commission published a document establishing its *strategy for data*, including
    a package of new regulation proposals to legislate the usage of non-personal and
    public data, the activity of digital services and digital markets and the development
    of *common European data spaces* [2]. While putting the data in the centre of
    this transformation, by making it available to all and facilitating its flow between
    sectors, the interests of data subjects and data holders will be kept by having
    clear data-sharing policies to govern the usage and access to data and trusted
    entities that enable said sharing while enforcing compliance with the new regulations.


    In particular, the Regulation of the European Parliament and of the Council on
    European data governance, the Data Governance Act (DGA), was proposed to improve
    the availability of public data, promote trust in data intermediation service
    providers and data altruism organisations as enablers of data-sharing between
    data holders and data users for purposes of general interest, and to establish
    a new supra-national authority charged with overseeing the activities of such
    entities, the European Data Innovation Board [3]. The DGA, along with the proposed
    visions for an European Health Data Space [4] and the Data Act [5], put an emphasis
    on the altruistic reuse of data – in the Health Data Spaces case to address the
    challenges of access and sharing to electronic health data – currently trapped
    within various institutions in the EU and unavailable to be used by all. The key
    challenges to be addressed to realise these visions are related to the:


    +   Ch1. *Availability / Discovery of datasets*: without the promotion and technical
    support for the development of common data spaces and trusted data sharing entities,
    data subjects and data holders will not have automated tools to share their data
    to be reused for common good purposes, nor solutions to support them in the exercising
    of their rights, and data users will not have tools to search for the data they
    seek.


    +   Ch2. *Establishment of conditions for usage and access to data*: without standards
    and metadata vocabularies to express interoperable, machine-readable policies,
    the establishment of conditions for usage and access to personal, non-personal
    and public-sector data, based not only on legal but also on ethical, organisational
    and social norms, will provoke interoperability issues between entities providing
    and seeking access to data.


    +   Ch3. *Production of Documentation*: without keeping records of their activities
    in a structured format, data intermediation service providers and data altruism
    organisations will rely on manual processes to produce documentation that demonstrates
    their accountable and responsible practices.


    Therefore, Semantic Web vocabularies, such as the W3C’s Data Privacy Vocabulary
    (DPV)¹, Open Digital Rights Language (ODRL)² or Data Catalog Vocabulary (DCAT)³,
    have an important role to play in these processes as they are interoperable and
    form common standards that enable machine-readable tools to be used for the automation
    of tasks. DCAT and ODRL are W3C Recommendations to describe data catalogues published
    on the Web and to express usage rules


    ¹ https://w3id.org/dpv

    ² https://www.w3.org/TR/odrl-model/, https://www.w3.org/TR/odrl-vocab/

    ³ https://www.w3.org/TR/vocab-dcat-2/'
  merge: -1
  img_proc: true
