- pgno: 68
  md: '# # Towards a Versatile Terminology Service

    ## for Empowering FAIR Research Data:

    ## Enabling Ontology Discovery, Design,

    ## Curation, and Utilization Across Scientific

    ## Communities


    Philip Strömertᵃ, [0000-0002-1595-3213], Vatsal Limbachiaᵃ[0000-0002-9535-6960],
    Pooya Oladazimiᵃ[0000-0002-5117-070X], Johannes Hunoldᵃ[0000-0002-4378-6061],
    and Oliver Koeplerᵃ[0000-0003-3385-4232]


    ᵃTIB - Leibniz Information Centre for Science and Technology, Hannover, Germany[04aj4c181]


    **Abstract.** To fully harness the potential of data, the creation of machine-readable
    data and utilization of the FAIR Data Principles is vital for successful data-driven
    science. Ontologies serve as the foundation for generating semantically rich,
    FAIR data that machines can understand, enabling seamless data integration and
    exchange across scientific disciplines. In this paper, we introduce a versatile
    Terminology Service that supports various tasks, including discovery, provision,
    as well as ontology design and curation. This service offers unified access to
    a vast array of ontologies across scientific disciplines, encouraging their reuse,
    improvement, and maturation. We present a user-driven service development approach,
    along with a use case involving a collaborative ontology design process, engaging
    domain experts, knowledge workers, and ontology engineers. This collaboration
    incorporates the application and evaluation of the Terminology Service, as well
    as supplementary tools, workflows, and collaboration models. We demonstrate the
    feasibility, prerequisites, and ongoing challenges related to developing Terminology
    Services that address numerous aspects of ontology utilization for producing FAIR,
    machine-actionable data.


    **Keywords.** FAIR Data, Ontology, Terminology Service, Research Data, Chemistry


    # 1. Introduction


    Resources like re3data [1] or FAIRsharing [2] provide comprehensive collections
    of data repositories, databases, data, and metadata standards and policies. Initiatives
    like the European Open Science Cloud (EOSC) [3], the German National Research
    Data Infrastructure (NFDI) [4], and the Physical Sciences Data Infrastructure
    (PSDI) in the United Kingdom [5] create and provide services and infrastructures
    to make research data publicly available, adapting the FAIR data principles [6].
    The vision of Open


    ¹ Corresponding Authors: Philip Strömert, philip.stroemert@tib.eu; Oliver Koepler,
    oliver.koepler@tib.eu.'
