- pgno: 24
  md: 'speech and are annotated considering the following identities: gender, sexual
    orientation, religion, race, and economic status.


    HateXplain [47]: One of the first datasets that included annotations for identity
    groups. The corpus provides 12,334 texts collected from Twitter and Gab, and those
    deemed hateful provide annotations for gender, sexual orientation, race, religion,
    and national origin identity groups.


    We use a subset of the Jigsaw dataset as pretraining data for the KG adaptation
    (see §3.2). The hybrid models (§3.3) and the RoBERTa_base baseline are trained
    using the Measuring Hate Speech corpus with the same data preparation used by
    [6], and evaluated using the HateXplain, XtremeSpeech English and Gab Hate Corpus.
    While soft labels are used for training the models (i.e., the proportion of annotations
    for each text), majority voting is considered in the validation datasets for consistency
    with the baseline evaluation.


    # 4.1.2. Baselines


    We select the most representative System A (supervised learning) and System B
    (linguistic) approaches as baselines. As System A, a RoBERTa_base [6] model sets
    the upper bound in terms of performance. However, this model does not provide
    any insights on why texts are associated with a particular identity group and
    only learns from the training data. As System B, Toxic Debias [11] is the list
    of terms and regular expressions most commonly used for the identification of
    texts containing sensitive language towards minoritized groups in hate speech.
    From the 53 potentially offensive and 26 non-offensive mentions to these groups,
    47 expressions refer to gender and sexual orientation. We highlight the 14 non-offensive
    and 33 possibly offensive mentions in our publicly available repository.


    # 4.1.3. Evaluation Metrics


    For comparability issues, we adopt the same evaluation as in the supervised learning
    baseline and consider Accuracy and F1 scores according to a 0.5 threshold, and
    two threshold-agnostic metrics: the Area under the ROC Curve (ROC AUC) and Area
    under the Precision-Recall Curve (PR AUC).


    # 4.2. Evaluation Results


    This section reports on the effectiveness of our hybrid approach for recognising
    language sensitive to gender and sexual orientation identities in hate speech
    datasets. First, we compare hybrid models against the best-performing baseline
    (System A) with a 5-fold cross-validation (Figure 3) for comparability with the
    original paper [6]. Second, we test the robustness of the linguistic, supervised,
    and hybrid learning approaches to different data contexts with a thorough evaluation
    on datasets external to training (Table 3). We include, to the best of our knowledge,
    all published datasets on hate speech that have consider identity groups in their
    annotation. We note that the linguistic baseline (System B) does not require training.
    For simplicity, we only include in the table the hybrid models with hierarchical
    entity expansion as they are the best-performing ones.


    Finding 1. Our proposed hybrid approach is simple and effective, displaying a
    comparable performance to the SOTA supervised learning (System A) approaches based
    on language models.'
