    Apart from the leads on future work mentioned above, one important point is the
    integration of the pathfinding algorithm in an end-to-end application where dual-entity
    queries can be entered, upon which the pathfinder is issued, such that a knowledge
    panel explaining the relationship between the query entities can be generated
    and finally be displayed. In this regard, it has to be investigated which kind
    of presentation yields the best user experience. For instance, an actual text
