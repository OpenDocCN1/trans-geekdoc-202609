    # 4.1. *Data and Data Sources as Basis of the TRANSRAZ Data Model*


    The TRANSRAZ data model aims at providing a semantic representation of the knowledge
    stored in historical resources, and, thus, is developed following a bottom-up
    approach. In this section, the selection of the currently processed data sources
    is introduced. The extraction and connection of the knowledge contained in these
    sources is analyzed and used to obtain modeling requirements of the data model.


    **TOPORAZ relational database** is an essential source of the TRANSRAZ data model
    presented in this work. The database was developed as an effort of the preceding
    TOPORAZ project²⁵ and is hosted by FIZ Karlsruhe. Based on historical resources,
    such as city plans, cadastral plans, photographs, maps etc., domain experts collected
    and provided a small biography for every building in Nuremberg’s main market square
    for four different time periods – 1620, 1811, 1910, and 2016. The data was then
    structured and manually inserted into subject-based tables. In particular, the
    database contains entities for architectural objects like streets and buildings,
