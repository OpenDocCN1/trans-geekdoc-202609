  md: '+   - **Data Altruism Organisation** An non-profit organisation that collects
    and shares data for altruistic purposes

    +   - **Public Sector Body** An entity or association of entities governed by
    public law formed by one or more State, regional or local authorities

    +   - **Legal Representative** A representative of a legal entity designated to
    act on behalf of a data intermediation service provider or altruism organisation

    +   - **Competent Body** An entity designated by a public sector body to provide
    legal and technical support on the access and reuse of public sector data

    +   - **Single Information Point Provider** An entity who is responsible for receiving
    and transmitting requests for the re-use of public data

    +   - **Competent Authorities** Authorities in charge of supervising the activity
    of data intermediation service providers and data altruism organisations and maintaining
    a public register of said entities

    +   - **European Data Innovation Board** An authority tasked with overseeing the
    activities of data intermediaries and data altruism organisations


    For instance, the data intermediary shares the conditions for data access under
    an open or commercial licence with the data user (flow represented in Figure 1
    with a red arrow) and keeps a record of its activities (flow represented in Figure
    1 with the (K) arrow). This diagram is derived from an analysis of Chapters II
    (‘Re-use of certain categories of protected data held by public sector bodies’),
