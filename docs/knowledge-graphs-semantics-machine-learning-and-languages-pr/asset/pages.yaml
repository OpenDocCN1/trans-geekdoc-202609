  md: '# # Preface


    Maribel ACOSTAᵃ [0000-0002-1209-2868], Silvio PERONIᵇ [0000-0003-0530-4305], Sahar
    VAHDATIᶜ [0000-0002-7171-169X], Anna-Lisa GENTILEᵈ [0000-0002-6401-4175], Tassilo
    PELLEGRINIᵉ [0000-0002-0002-5492-2292], Jan-Christoph KALOᶠ [0000-0002-5492-2292]


    ᵃ *Faculty of Computer Science, Ruhr University Bochum, Germany,*

    *maribel.acosta@rub.de*


    ᵇ *Department of Classical Philology and Italian Studies, University of Bologna,*

    *silvio.peroni@unibo.it*


    ᶜ *Institute for Applied Informatics, University of Leipzig, vahdati@infai.org*


    ᵈ *Intelligence Augmentation Group, IBM Research Almaden,*

    *annalisa.gentile@ibm.com*


    ᵉ *University of Applied Sciences St. Pölten, Austria, tassilo.pellegrini@fhstp.ac.at*


    ᶠ *University of Amsterdam, The Netherlands, j.c.kalo@uva.nl*


    **Abstract.** This volume encompasses the proceedings of SEMANTiCS 2023, the 19th
    International Conference on Semantic Systems, a pivotal event for professionals
    and researchers actively engaged in harnessing the power of semantic computing.
    At SEMANTiCS, attendees gain a profound understanding of its transformative potential,
    while also confronting the practical limitations it presents. Each year, the conference
    magnetizes information managers, IT architects, software engineers, and researchers
    from a broad spectrum of organizations, spanning research facilities, non-profit
    entities, public administrations, and the world''s largest corporations.


    **Keywords.** Semantic Systems, Knowledge Graphs, Artificial Intelligence, Semantic
    Web, Linked Data, Machine Learning, Knowledge Discovery


    SEMANTiCS serves as a vibrant platform facilitating the exchange of cutting-edge
    scientific findings in the realm of semantic systems. Furthermore, it extends
    its scope to encompass novel research challenges in areas such as data science,
    machine learning, logic programming, content engineering, social computing, and
    the Semantic Web. Having reached its 19th year, the conference has evolved into
    a distinguished international event that seamlessly bridges the gap between academia
    and industry.


    Participants and contributors of SEMANTiCS gain invaluable insights from esteemed
    researchers and industry experts, enabling them to stay abreast of emerging trends
    and themes within the vast field of semantic computing. The SEMANTiCS community
    thrives on its diverse composition, attracting professionals with multifaceted
    roles encompassing artificial intelligence, data science, knowledge discovery
    and management, big data analytics, e-commerce, enterprise search, technical documentation,
    document management, business intelligence, and enterprise vocabulary management.


    In 2023, the conference embraced the subtitle “Towards Decentralized Knowledge
    Eco-Systems” and particularly welcomed submissions pertaining to the following
    topics:'
