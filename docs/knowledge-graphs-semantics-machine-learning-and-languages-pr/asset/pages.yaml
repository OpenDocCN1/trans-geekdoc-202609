  md: '**Finding 4.** *A knowledge-grounded approach for understanding hate from the
    perspective of gender and sexual orientation identities helps to identify language
    relevant for their recognition in hate speech, as well as the terminology that
    may be associated with either model or annotation errors.*


    # 5. Conclusion


    We present a novel hybrid approach for grounding deep learning predictions in
    semantic knowledge relevant to the recognition of language references to gender
    and sexual orientation in hate speech. First, selecting a KG as semantic knowledge
    is a richer form of structured knowledge than existing linguistic approaches,
    providing novel semantically enriched predictions that are as effective to the
    use of black-box language models. Second, an adaptation phase based on machine
    learning allows finding an optimal representation level, which is a major challenge
    for applying semantic knowledge to downstream tasks. Finally, we propose a simple
    and effective feature-based approach to integrate the adapted KG to a neural network.
    Our evaluation on gender and sexual orientation demonstrates that a knowledge-grounded
    approach is key to enhance model transparency, robustness, and handling of annotation
    errors. Particularly, as it can highlight vocabulary for better understanding
    how training data captures identity group language, what are the type of errors
    in the model and, more interestingly, the ambiguities in human annotations.


    We acknowledge we only evaluate our approach on two particular groups and one
    KG. Further research on other target groups would underline the value of knowledge-based
    approaches to hate speech detection. Similarly, considering a variety of KG domains
    and sizes would provide valuable insights on how to integrate them more effectively.
    KGs are generally costly to generate and maintain, and sometimes their coverage
    may not be sufficient for the task [50]. Our work however shows that, when this
    knowledge is available, it can positive complement and enhance a standard deep
    learning approach. We acknowledge the limitations of hate speech evaluation using
    standard performance metrics and leave as future work settings specific to the
    task [51,52] tailored to these identities. In terms of annotation findings, our
    semantically enriched models uncover references in 97% false positive errors.
    A more exhaustive analysis is needed to investigate the reasons behind these disagreements
    and the extent to which these cases constitute difficult to classify training
    examples that could improve hate speech recognisers [53]. Nevertheless, analysing
    hate in terms of the groups targeted is critical due to the subtlety of this language,
    which makes the recognition of hate speech even more difficult for annotators
    to understand and perceive [20].


    To conclude, we particularly emphasise that this work does not aim to infer an
    individual’s sensitive attributes [54]. This work rather aims to attend to the
    sociolinguistic aspects in hate speech in the hope of better contextualising automatic
    recognition systems with the language use of the social realities they imply.


