    N-ary relations, RDF-star, and RDF-star [19]. The authors employed various datasets
    for their study, including a BKR dataset, a Gov-track dataset, a Synthetic dataset,
    and a dataset obtained from [20]. Through experiments, the proposed approach demonstrates
    advantages in handling multi-dimensional and nested metadata with reduced graph
    size and fewer generated statements.


    # 6. Conclusion


    This paper presented the pipeline for the generation of a knowledge graph (KG)
    of educational resources (ER) and the evaluation of several reification models
    with several triplestores. The objective was to identify the most suitable approach
    for this KG. To achieve this, we defined seven query templates instantiated in
    26 grounded queries. Within the KG, reification was used in a multi-valued property
    to add two annotations whose range is between 0 and 1. Based on the insights derived
    from this experimental study, we were able to draw meaningful conclusions. Both,
    standard reification and named graphs with Virtuoso, exhibit similar performance.
    Named graphs show a slight advantage in some cases, in particular for join queries.
    RDF-star should be implemented more efficiently if quoted triples are included
    in RDF 1.2. Finally, for the KG presented in this paper, Virtuoso with named graphs,
    emerges as a good choice.


