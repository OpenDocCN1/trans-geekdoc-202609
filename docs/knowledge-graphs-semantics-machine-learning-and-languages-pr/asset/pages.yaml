- pgno: 22
  md: 'Additional modification of the weighing schemes based on hierarchical entity
    expansion To test whether the KG structure could serve us to better refine the
    adaptation, we propose a modification affecting the entities to be included in
    the weighting process. Figure 2 (B) shows in bold the process of expanding both
    an entity that is class (e.g., "lesbian") or an instance (e.g., "fag"). Every
    class expands up to its top-level using the rdfs:SubclassOf property to gather,
    e.g., that "lesbian" is a Gay Person, LGBTQ person, Person, and so on. For every
    instance, we would expand based on the rdf:type property and also include that
    "fag" is a Homophobic slur, Cross-cultural dysphemism, and Gay male slang, for
    example. Thus, in this modified version of the weighting scheme, an entity e_i
    is considered mentioned in a text if the entity e_i itself, any of its subclasses,
    or any of its instances appears in the text.


    # 3.3. Knowledge Graph Integration


    This phase describes how the adapted KG can be embedded with a deep learning architecture.
    In the following, we present the two main components of the proposed hybrid learning
    framework.


    *Semantic component* Our hybrid approach considers an adapted KG (KG with pre-training
    weights) in the feature extraction. The weights of the entities found in the training
    samples constitute the feature vectors that are used as inputs. That is, the input
    for the deep learning component is a sparse vector representation, where the non-zero
    components are the weights of the entities in the training samples. Compared to
    contextualised word embeddings, the KG-based feature extraction provides a lower
    dimensional numerical representation of the input texts. We compare our hybrid
    approach to pretrained transformer architectures used in the SOTA, where RoBERTa
    [42] is the best-performing as compared to BERT [43] and the Universal Sentence
    Encoder [44].


    *Deep learning component* The deep learning architecture used in the SOTA for
    recognising target group language in hate speech consists of a Feed-foward Multilayer
    Neural Network with a dropout layer and M binary layers for classification, one
    for each group identity (gender, sexual orientation, religion, race, disability,
    national origin, and age) [6]. That is, for a given input text, the model provides
    M probabilities indicating whether it contains any language related to each group.
    Because our work is focused on gender and sexual orientation, we only consider
    the probability of belonging to any of these two classes.


    As a result, we obtain the six different hybrid model versions described in Table
    1. The hyperparameters are the same for training all models, using 8 as the size
    of the training batches, the number of hidden layers set to 256, and a 0.05 dropout
    rate in the Feed-forward neural layer.


    Table 1. Hybrid models (in bold) resulting from the different adaptation schemes
    (§3.2) used for hybrid feature extraction. H.E indicates the model variation when
    including hierarchical entity expansion.


    | Version | Description | H.E |

    |---|---|---|

    | **HybridDocF** | Features based on the ratio of entity occurrences | **HybridDocF_h**
    |

    | **HybridLR** | Features based on coefficients of entities in a linear regression
    | **HybridLR_h** |

    | **HybridMultiNB** | Features based on the coefficients of entities in a multinomial
    Naive Bayes model | **HybridMultiNB_h** |'
