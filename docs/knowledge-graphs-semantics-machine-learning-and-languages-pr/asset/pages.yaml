  md: 'meability of IE, i.e., grammatical transformations, extractions and insertions
    lead to ungrammaticality, as the sentences in (1) exemplify. (''*'' indicates
    ungrammaticality):


    +   - (1)a * The fan at our house was hit by the shit. (passive transformation:
    the object becomes the grammatical subject)

    +   - b * It was the fan that the shit has hit. (clefting)

    +   - c * The shit has hit the wanky fan at our house. (insertion)


    In this study, we investigate whether it is possible to distinguish IE from literal
    expressions by the divergence measure of perplexity which is close related to
    the information theoretic feature of surprisal [4,5,6,7]. So, we ask whether IE
    cause higher perplexity than literals given a reference data set. The amount of
    perplexity which is exactly defined in the Eqs. 1 and 2, represents the amount
    of surprisal which is contextualised information and is to be interpreted as the
    deviation from the expected. The higher the surprisal of a linguistic unit, and
    thus the higher the perplexity it causes, the greater the cognitive effort is
    to process it [5,7] which is an empirically proven claim (see amongst others [8,9]).


    In our study, we measure the divergence of IE and literals from reference texts,
    and the assumption is that these divergences should differ. In the data set of
    the study (see Section 3), the VNC can be understood both literally or as IE.


    We determine perplexity as the divergence between n-gram-probabilities of linguistic
    patterns in two sorts of data sets on the one hand, i.e., one that contains IE
    and another set that does not, and on the other hand two large reference data
    sets.


    What is the practical interest in dealing with the identification of IE? While
    some state-of-the-art translation programs and chat bots are able to recognise
    IE and provide correct translations and interpretations, some others do not. Google
    Translator for instance translates yesterday the shit has hit the fan at our house
    into German as gestern hat die Scheiße den Lüfter unseres Hauses getroffen which
    is literally correct, but does not make any sense at all. DeepL and in particular
    OpenAI/ChatGPT do a much better job in this respect. However, the latter shows
    slight weaknesses in interpreting the German IE nicht auf den Kopf gefallen sein
    which means to be clever and smart. We had a dialogue in with ChatGPT from Open
    AI.


    Question: Wir sind nicht auf den Kopf gefallen. Was heißt das? lit: ''We did not
    fall onto our heads. What does that mean?''


    Answer: Dieser Ausdruck bedeutet, dass man klug und clever ist und nicht dumm.
    Man ist in der Lage, kluge Entscheidungen zu treffen und ist nicht leicht hinters
    Licht zu führen. ''This expression means that one is smart and clever and not
    stupid. One is able to make wise decisions and is not easily fooled.''


    This is a really good answer, the chat bot recognises the IE and explains it well.
    Now consider the following dialogue:


    Question: Wir sind nicht vom Fahrrad auf den Kopf gefallen. Was heißt das? ''we
    did not fall off our bikes onto our heads. What does that mean?'''
