  md: 'Figure 1 shows the percentage of occurrence of each case, 15.05% of the question
    presented minor translation mistakes (Case 1), 18.28% of the questions had major
    translation issues (Case 2), 28.14% of the question’s keywords had mistakes that
    resulted from errors in the question’s translation (Case 3). 19.89% of the question
    keywords had errors that were not related to errors in the question’s translation
    (Case 4), 25.45% of the question presented accentuation errors in the question
