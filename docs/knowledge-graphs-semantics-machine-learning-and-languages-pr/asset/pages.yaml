- pgno: 181
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_181_0.png)


    **Figure 3.** From data sources to building blocks


    * **Events** represents events that can be associated with a point in time. On
    the one hand, this includes social, cultural, political, etc. activities of Nuremberg,
    such as Oktoberfest 1900. On the other hand, events that represent some duration
    and/or transformation, as e.g., deconstruction of a building, renaming of a street,
    etc.


    Goals, challenges, and the proposed workflow towards extracting entities from
    historical resources, linking and disambiguating them are described in [26,5].
    Subsequently, in [4], the first results to automatically obtain and model the
    information in the address books have been presented. Figure 3 schematically shows
    the workflow to populate the building blocks. However, the detailed discussion
    and results are out of the scope of this paper and will be addressed in the future
    work.


    # 3.2. Ontologies of the TRANSRAZ data model


    Following the guidelines of the ontology development, the TRANSRAZ data model
    aims at integrating, reusing, extending or mapping to established vocabularies
    and ontologies for the representation of the required classes and properties.
    This section presents concrete ontology engineering requirements that are derived
    from the CQs discussed in Section 4.2, taking into account the heterogeneity of
    data and concepts in the desired data model. Additionally, best practices for
    modeling of each building block are analyzed and compared against the requirements,
    and the design choices are presented.'
