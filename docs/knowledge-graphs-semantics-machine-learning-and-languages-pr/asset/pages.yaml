  md: '# ## 5. Results


    # ### 5.1. A classification for Linking Problem Types (LPTs)


    We present here the results of the classification process previously explained.
    At the first hierarchy level, we find the four intuitive groups of problems to
    which we have added another group (i.e., “Problem at graph level”) to capture
    problems related to the nature of the graphs (see Figure 6). In this Figure and
    the following ones, the colored pie charts represent the different distributions
    of heterogeneities described by each of the previously selected authors.


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_218_0.png)


    **Figure 6.** First level of the hierarchical classification of Linking Problem
    Types (LPTs).


    # ### 5.1.1. Predicate value problems


    Predicate value problems can be divided into terminological problems on one side
    and structural problems on the other (Figure 7). At the terminological level,
    the classification extends over three levels of granularity expressing at the
    finest level the problems of synonymy, homonymy or language reported in the literature
    mainly by Bergman [22] and Assi et al. [26].


    A problem that would fall within the scope of LPT 1.1.2.5 would be, for example,
    a pair of datasets in which the data would be inconsistent (e.g., New York City
    would be described with 8,804,190 inhabitants on one side and 8,800,000 inhabitants
    on the other). For LPT 1.1.3, an example would be, a dataset pair in which literals
    do not have language labels (e.g., , “barbecue” instead of “barbecue@en”), which
    would prevent automatic determination of the label language. For LPT 1.2.2, an
    example would be, a dataset pair in which the city of New York is represented
    as the object of a triple by the literal ”New York”@en on the one hand, and by
    its URI, https://www.wikidata.org/wiki/Q60 pointing to the corresponding Wikidata
    page on the other.


    # ### 5.1.2. Predicate problems


    Predicate problems can be divided into predicate terminological problems, predicate
    structural problems (as predicate value problems) and predicate vocabulary problems
    (see Fig. 8).


    An issue within the scope of LPT 2.1.5 would be, for example, a pair of datasets
    where the same predicate has a typing error (e.g., hasPopulation on one side and
    hasPupulation on the other). For LPT 2.2.3, an example would be, a dataset pair
    in which a extra node (which can be a blank node) must be inserted or deleted
    in order to retrieve the same information (e.g., New York hasNikeName Big Apple
    on one side and New York isCalled _b1 hasNikeName Big Apple ; New York isCalled
    _b1 hasAcronym NYC on the other). For LPT 2.3 an example would be, a dataset pair
    which would express the same information using predicates from different vocabularies
    (e.g., foaf:name on one side and rdfs:label on the other).'
