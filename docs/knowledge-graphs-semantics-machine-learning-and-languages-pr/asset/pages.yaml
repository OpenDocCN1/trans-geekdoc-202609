- pgno: 220
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_220_0.png)


    **Figure 9.** Part of the classification of LPTs: Class problems.


    # 5.1.4.  Subgraph problems


    Subgraph problems can be divided into subgraph descriptive heterogeneity problems
    on one side and subgraph no textual description problems on the other (see Fig.
    10). We make a distinction between the heterogeneity of description and the absence
    of description of certain characteristics of the entity.


    For LPT 4.1, an example would be a pair of datasets describing a resource with
    a different amount of information (e.g., the city of New York with its name, population
    and geographic location on one side and its name and location on the other).


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_220_1.png)


    **Figure 10.** Part of the classification of LPTs: Subgraph problems.


    # 5.1.5.  Graph problems


    Graph problems can be divided into eight levels (see Fig. 11). Graph problems
    level had to be explicitly added to the classification, because, we distinguish
    more general problems from those presented at the RDF triplet level. Problems
    like scalability and expressiveness of some languages compared to others concerning
    for example the expression of negation.


    For LPT 5.4.4, an example would be a pair of datasets that use distinct languages
    with differences in the representation of logical notions (e.g., a language that
    directly expresses class disjunctions (A disjoins B) on the one hand and a language
    requiring the use of negation (A subclass-of (NOT B) on the other). For LPT 5.4.6,
    an example would be a pair of datasets describing the population and dynamics
    of the same city but at different times. For LPT 5.6, an example would be a pair
    of datasets where at the level of the graphs the description patterns would be
    identical whereas they would be different descriptions (e.g., two sets of triples
    composed only of individuals of the class person but with on one side a single
    reflexive relation ”hasSister” and on the other a single reflexive relation ”hasBrother”).
    This type of problem will be especially useful for the embedding graph.


    Once again, we note some differences in the distribution of each problems by level
    as done by the authors, such as Achichi, who only reports heterogeneities related
    to the heterogeneity of graph conceptual keys and the timeliness of graph conceptual
    datasets.'
