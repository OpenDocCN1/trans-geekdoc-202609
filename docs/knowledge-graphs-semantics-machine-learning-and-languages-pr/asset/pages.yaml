    # 3.1. Approach


    To collect data requirements for multi-perspective representations of cultural
    heritage provenance, we conduct a problem analysis through focused interviews
    with domain experts, which is concerned with developing an understanding of the
    nature of the problem. Focused interviews are a basic requirement engineering
    tool, to investigate current problems and concerns. After identifying the requirements
    for the data model, we utilised them to construct the model (Section 4). Additionally,
    we elicited nine Competency Questions from the interview which we use to validate
    the model.


    For the focused interviews, we recruited five Museology professionals who are
    involved in the Pressing Matter project⁴ in different capacities (see Table 1
    for an overview of the interviewees. The index mentioned for participants in the
    table will be used in the rest of the paper to indicate corresponding respondent).
    Pressing Matter is a Dutch project which investigates artefacts collected during
    the colonial period to support societal reconciliation with the colonial past.
    The professionals were chosen based on their varied experience, background, and
    working methods. Although they work on different collections of ethnographic objects,
    they all have experience with the current museum information system and are responsible
    for updating object metadata with provenance information. These professionals
    can be considered the end-users of the data model developed in this research.


    Each participant completed a one-hour individual semi-structured interview, with
    all interviews following the same interview guide. The interview guide [24] is
    aligned with the objective of this research⁵. The interview addressed the proper
    representation of cultural heritage provenance data, covering (1) provenance research
    processes and challenges, (2) documentation of research, (3) representation of
    provenance information, and (4) the utility of such information. A pilot interview
    was conducted before the actual study, and its insights were incorporated in the
    next interviews. All interviews, except the pilot, were conducted via web conferencing.


    # 3.2. Findings


    We report on the main findings in three parts. First, how provenance research
    is conducted and documented. Second, the identified challenges and problems with
