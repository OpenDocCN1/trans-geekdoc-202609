    often used in combination with Machine Learning (ML) techniques, as they can help
    to improve model performance and interpretability in a variety of tasks including
    search, question answering and natural language understanding [29,36].


    To select the particular KG for the task, we explore a wide range of existing
    KGs that could have comprehensive information about language sensitive to a group,
    including well-known KGs such as wikidata, DBPedia, and YAGO [37,38,39]. While
    some of these KGs contain information related to many identities, we selected
    the Gender, Sex and Sexual Orientation Ontology [35] as a more specific source
    of knowledge to base hate predictions on the language of a target group. This
    KG aims to be an integrated vocabulary system to address the lack of standardised
    gender and sexual orientation terminology in healthcare and includes, to this
    date, over 16,000 entities and 292 properties. To the best of our knowledge, it
    is the most comprehensive and up to date to describe these two common hat targets
    that we can consider for assessing our approach.


    We show how we leverage this information following the examples in Figure 2. KG
    entities can capture semantic concepts (e.g., “gay male slang”) or their concrete
    examples (e.g., “fag”). Additionally, there are object properties to make connections
    between entities, and data properties to describe the specific values or attributes
    of entities. For example, the wikidata property Prop:P1813 indicates that the
    literal “GQ” can be a short name for the entity “Genderqueer”. We use this richer
    representation of terms as entities to facilitate the matching of the KG to the
    texts (A). We use properties like rdf:type (to link instances to their classes,
    such as “fag” to “homophobic slur”) and rdfs:SubClassOf (to make hierarchical
    connections between the classes, e.g., “lesbian” to “gay person”), to exploit
    the KG structure in our hybrid approach (B).


    # 3.2. Knowledge Graph Adaptation


    One major challenge when applying semantic knowledge in combination with ML to
    address particular tasks is the level of abstraction of its information [40].
    The existing entities can sometimes encapsulate information that is too abstract
    or too fine-grained for the task at hand. In this work, we propose an adaptation
    phase that allows us to weigh the KG entities based on pretraining data. The aim
    is to give more relevance to those entities that better encapsulate the group
    language and information, which adds an additional dimension to the factual and
    structural information of previous hybrid approaches [41].'
