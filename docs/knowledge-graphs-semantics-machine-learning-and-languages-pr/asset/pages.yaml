- pgno: 7
  md: '+   - Web Semantics & Linked (Open) Data

    +   - Enterprise Knowledge Graphs, Graph Data Management

    +   - Machine Learning Techniques for/using Knowledge Graphs (e.g. reinforcement
    learning, deep learning, data mining and knowledge discovery)

    +   - Knowledge Management (e.g. acquisition, capture, extraction, authoring,
    integration, publication)

    +   - Terminology, Thesaurus & Ontology Management

    +   - Reasoning, Rules, and Policies

    +   - Natural Language Processing for/using Knowledge Graphs (e.g. entity linking
    and resolution using target knowledge such as Wikidata and DBpedia, foundation
    models)

    +   - Crowdsourcing for/using Knowledge Graphs

    +   - Data Quality Management and Assurance

    +   - Mathematical Foundation of Knowledge-aware AI

    +   - Multimodal Knowledge Graphs

    +   - Semantics in Data Science

    +   - Semantics in Blockchain environments

    +   - Trust, Data Privacy, and Security with Semantic Technologies

    +   - Economics of Data, Data Services, and Data Ecosystems

    +   - IoT and Stream Processing

    +   - Conversational AI and Dialogue Systems

    +   - Provenance and Data Change Tracking

    +   - Semantic Interoperability (via mapping, crosswalks, standards, etc.)


    # Special Sub-Topics:


    +   - Digital Humanities and Cultural Heritage

    +   - LegalTech, AI Safety, Explainable and Interoperable AI

    +   - Decentralized and/or Federated Knowledge Graphs


    # Application of Semantically Enriched and AI-Based Approaches:


    +   - Knowledge Graphs in Bioinformatics and Medical AI

    +   - Clinical Use Case of AI-based Approaches

    +   - AI for Environmental Challenges

    +   - Semantics in Scholarly Communication and Open Research Knowledge Graphs

    +   - AI and LOD within GLAM (galleries, libraries, archives, and museums) institutions


    The Research and Innovation track garnered significant attention with 54 submissions
    after a call for papers was publicly announced. To ensure meticulous evaluations,
    an esteemed program committee comprising 85 members collaborated to identify the
    papers of utmost impact and scientific merit. Implementing a double-blind review
    process, wherein author identities and the reviewers were obscured to assure anonymity.
    A minimum of three independent reviews were conducted for each submission. Upon
    completion of all reviews, the program committee chairs meticulously compared
    and deliberated on the evaluations, addressing any disparities or differing viewpoints
    with the reviewers. This comprehensive approach facilitated a meta-review, enabling
    the committee to recommend acceptance or rejection of each paper. Ultimately,
    we were pleased to accept 16 papers, resulting in an acceptance rate of 29.6%.'
