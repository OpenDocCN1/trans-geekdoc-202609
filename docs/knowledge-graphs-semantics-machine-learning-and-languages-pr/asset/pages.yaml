  md: '# 3. Algorithm Improvements and a Query Dataset


    Based on the insights from Section 2, this section aims to answer the research
    questions RQ1 to RQ3. Since RQ4 is related to the evaluation, its discussion follows
    in Section 5.


    # 3.1. Accurate Semantic Distances between Entities


    As described in Section 2, [2] estimates the semantic distance between two entities
    as the cosine distance between the vector representations of the entity labels.
    However, the ambiguity of entity labels alone compromises the accuracy of the
    vector representations and therefore the resulting semantic distances. For example,
    Wikidata features numerous entities that share the label Paris, partly from very
    different categories: While the entity Q90 refers to the city in France, the entity
    Q167646 refers to the mythological son of Priam, king of Troy13. During pathfinding,
    it is important to pin down the exact entity that is currently examined. Otherwise,
    paths with concept drift might be pursued when entities with alleged low semantic
    distances are prioritized. Therefore, RQ1 asks how the semantic distances between
    entities can be estimated more accurately.


    We propose the two following changes to mitigate this problem. The first change
    is to feed entity descriptions, another resource that is available in Wikidata
    for most entities, in addition to entity labels to the word embedding model. For
    this purpose, the entity labels and entity descriptions are simply concatenated.
    The idea is that the additional information provided by the descriptions results
    in vector representations that capture the entities’ meaning more accurately.
    Secondly, fastText is replaced by SBERT in combination with all-mpnet-base-v2
    for efficiently computing high-quality vector representations of the new input
    type, i.e., strings composed of entity labels and descriptions. Also note that
    the data within Wikidata is curated. Hence, encountering misspelling is unlikely
    such that fastText’s robustness against them is not required.


    The examples in Table 3 show the positive impact of these changes on the semantic
    distances. In particular, the first example shows that the additional consideration
    of entity descriptions affirms the semantic distance in cases where the labels
    alone are expressive enough to compute accurate vector representations. In contrast,
    the pairs of examples two/three and four/five demonstrate how the entity descriptions
    help to disambiguate entities with identical or similar labels, yielding more
    accurate semantic distances.


    Further qualitative experiments with other entity pairs conform with these observations.
    Hence, we conclude that the additional consideration of entity descriptions improves
    the accuracy of the semantic distances, thereby answering RQ1. That being said,
    apart from entity descriptions, Wikidata provides even more entity-related information
    including alternative labels, labels in other languages etc. Furthermore, the
    (direct) neighborhood of an entity can also be seen as a description of its meaning.
    To retain the focus of this paper, though, these options are left open for future
    work as their exploration seems worthwhile to further improve the accuracy of
    the vector representations.


    # 3.2. A Dual-Entity Query Dataset for Pathfinding in Wikidata


    Even though the twelve dual-entity queries discussed in [2] suffice for showcasing
    the potential of the algorithm, their low number and artificial hand-selected
    nature does nei-'
