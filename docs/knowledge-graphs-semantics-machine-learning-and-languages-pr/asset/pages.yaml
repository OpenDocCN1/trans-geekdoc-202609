  md: 'viewed the articles dealing with heterogeneities compiled in the corpus explained
    above. These articles are either about Instance Matching (IM) where one consider
    assertions (notion of instance) or about Ontology Matching (OM) where one deal
    with the reconciliation of models (notion of classes). Although distinct, these
    two domains are complementary in the execution of data linking tasks. We have
    finally selected the following five articles for their relevance and their global
    vision on the subject of heterogeneity:


    +   - Klein [21] proposes a classification of different heterogeneities encountered
    in the combined use of independently constructed ontologies. This work identifies
    three main families of heterogeneities:

    +     * Heterogeneity related to practice (e.g., non application of language tags,
    input errors, duplicates).

    +     * Heterogeneity linked to the mismatch of languages used to express these
    ontologies. At this level, a distinction is made between heterogeneities related
    to the linguistic level (e.g.,syntax, representation, semantics and expressivity)
    and those related to the ontological level (e.g., paradigm, concept description,
    coverage of model, synonymy).

    +     * Heterogeneity related to the versioning of one or more of the ontologies
    involved.


    +   - Bergman [22] addresses the issue of resolving semantic heterogeneities in
    the context of using the semi-structured XML language (based largely on the work
    of Pluempi- tiwiriwawej and Hammer [23] ) and, by extension, RDF and ontology
    representation languages like OWL. He considers that even within an identical
    domain there will always be different “world views” as long as independent teams
    create ontologies due to the flexibility of semi-structured schemas. Moreover,
    during serialization, XML files and ontologies can be confronted with syntax or
    structure problems. This work identifies four categories of causes for these heterogeneities:

    +     * Heterogeneity related to structure. This occurs when the schemas of the
    sources that represent related or overlapping data do not match (e.g., first and
    last name aggregation).

    +     * Heterogeneity related to domain. This occurs when the semantics of the
    data sources are different (e.g., Different scales and units of measurement).

    +     * Heterogeneity related to data. This occurs when there are discrepancies
    between the values of similar or related data (e.g., spelling mistakes).

    +     * Heterogeneity related to language.This occurs when there are differences
    in the encoding and use of different languages (e.g., Use of French and English).

    +   Bergman estimates there are more than forty discrete categories of heterogeneity.
    As our work is focused on RDF datasets, some of the heterogeneities described
    in the context of the use of XML seemed irrelevant (e.g., the notion of element
    order which is non-existent in RDF). Of the forty or so heterogeneities presented,
    we have selected twenty-six which fall into the four main categories.


    +   - Euzenat and Shvaiko’s work [24] is related to OM rather than IM; but still
    bring in an interesting analysis of heterogeneities that we can apply to data
    linking. They consider the following four main types of heterogeneities:

    +     * Syntactic heterogeneity: ontologies are expressed in different representation
    languages.

    +     * Terminological heterogeneity: ontologies have variations in naming objects
    (car vs. automobile).

    +     * Conceptual heterogeneity: ontologies have differences in modeling choices
    for the same domain. They can be differences in coverage, granularity or perspective.'
