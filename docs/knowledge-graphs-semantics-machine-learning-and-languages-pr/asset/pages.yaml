- pgno: 19
  md: 'entation, disability or religion; or to the specific affected communities within
    an identity (e.g. women, transgender, male or other gender subgroups). To the
    best of our knowledge, these systems may display high performance, but only output
    a probability to indicate how much language sensitive to a group the post contains.
    However, in addition to the problems already discussed, language models also acquire
    biases from the large corpora used in pretraining [28]. Using additional sources
    of knowledge can produce models that are less flexible and more robust to specific
    annotation schemes, domain and contexts than deep learning models alone [29].


    Semantic knowledge integration has helped to address bias related to the data
    annotation [30], to generalise better to unseen data [31], and to explain model
    predictions [32]. These examples imply, on the one hand, that it should be plausible
    to better overcome the discussed training data specificities given an adequate
    source of knowledge representation of the language from these communities. On
    the other, additional knowledge could enrich probabilistic model predictions to
    better understand them. A common challenge for hybrid approaches remains in finding
    the correct level of abstraction when applying semantic knowledge to a downstream
    task [29]. In this work, we propose a novel hybrid approach for grounding deep
    learning predictions in relevant knowledge for the task (**Our System**). Prior
    adaptation to the language distribution of the downstream task enables to integrate
    a KG simply and effectively into the model, without sacrificing predictive performance.


    Particularly in hate speech, our approach allows focusing the detection from the
    target’s perspective, as it highlights the specific entities representing language
    references that influence the prediction. Attending only to the signals learned
    with standard supervised learning (System A) has shown to acquire annotation and
    lexical biases from the training data and, in the worst cases, has lead marginalization
    and censorship of communities at risk [33,34]. Linguistic approaches (System B)
    to probe these systems for fairness fall short in addressing the language that
    refers to these communities [25,24]. With the domain specific constraints set
    by a knowledge-grounded approach (Our System), we intend to bring more focus on
    the language sensitive to frequent target communities to better understand and
    prevent online hate.


    # 3. Hybrid Approach


    In this section, we present a conceptual framework for supporting text classification
    with semantic knowledge³. First, we present the rationale for selecting semantic
    knowledge and describe the information leveraged in our approach (§3.1). Second,
    we present an adaptation phase. The goal is to assign weights to the KG entities
    based on their relevance in a pretraining corpus from the task domain (§3.2).
    Finally, we describe the integration of the adapted KG with a deep learning architecture
    (§3.3). The resulting six hybrid model versions are described in Table 1.


    # 3.1. *Semantic Knowledge Selection*


    A Knowledge Graph is a structured representation of knowledge that captures relationships
    between entities in a particular domain. It is a type of knowledge representation


    ³Note that, while we have selected semantic knowledge to cover specifically language
    from gender and sexual orientation, this is not fixed in our approach, and the
    KG can be exchanged.'
