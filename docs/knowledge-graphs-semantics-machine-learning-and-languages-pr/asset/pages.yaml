    # 4.3.2. Auditing Training Datasets


    Motivated by our error analysis, we exploit our semantically enriched method to
    assess how hate speech training dataset captures identity group language. The
    result of this analysis can be seen in Table 5. We follow the same approach in
    (§4.3.1) and draw a 100-quartile sample of true predictions, which includes 286
    texts. We then use the elbow method [49] to filter those entities that are more
    relevant considering the weights provided by the HybridLR.h model. Within this
    category (True Positives) we show those relevant entities extracted from texts
    where both, the model and the human annotators, agreed that the text was related
    to these identities. We note that these lists are not intended to provide an exhaustive
    list of all the language related to gender and sexual orientation. Nevertheless,
    they provide the minimum set of KG entities required to identify language references
    to these identities, and gives valuable insights to better understand how common
    hate targets are captured by the hate speech training datasets.


    We conduct the same analysis in the samples with mismatches of annotation and
    model predictions. Within the category Missing in annotation, we display the relevant
    entities in texts indicated as related by the model, but not by the human annotators.
    Using the same data from the error analysis, the list includes language from 147
    texts, and highlights relevant entities that the annotators may have missed when
    assessing the texts.


    Within the category Missing in prediction, we display the relevant entities in
    texts indicated as related by the human annotators, but not by the model. The
    list highlights relevant entities that, while available within the KG, were not
    given enough relevance during the hybrid approach. Entities in italics correspond
    to those not included by the elbow point due to a lower weight, but required to
    identify related texts. Entities in bold are unique to the texts missed in the
    prediction. This important entities highlight the complexity of learning language,
    as some of these entities may only be related to the gender and sexual orientation
    identities in specific contexts (e.g. f*ck as a swear word, or being sexually
    explicit). The same is true for entities that appear in texts that are only sometimes
    annotated as related (e.g. woman, LGBT, gay).'
