  md: 'be opened with collapsable additional information like its *characteristics*
    (e.g., locations, time period, etc.), an image, and an abstract (see Figure 3).
    In that window, a space is reserved for annotation by allowing users to enter
    notes. The primitive *discovering* is addressed with the visualization and features
    in the Hub and the Fragmentarium as a whole. The user can apply filters or show
    statistics on datasets in the Hub. At the same time, this addresses the requirements
    of *sampling* because the filters in the Hub can be used to select data according
    to the user’s interests. Selecting a new node of interest with a ray pointer attached
    to the user’s controller in the Fragmentarium makes it the new *main fragment*
    and updates the visualization. Thus, the user is able to move from node to node
    while inspecting their properties and relations. A history shows the order of
    the main fragments visited so far (see Figure 3). Following the recommendations
    of Wagner et al. [26], we offer both the egocentric and exocentric perspective
    to the user, who is allowed to grab and transform the whole constellation of the
    related fragments (which includes translating, uniform scaling, and rotating).
    Thereby, the user may switch from the initial egocentric to an exocentric perspective.
    Finally, the application offers a help menu that explains all functionalities.


    # 3.3.1. *Backend*


    In order to implement the data backend, we rely on Neo4j⁶ as a graph database
    designed to manage and query large knowledge graphs. We rely on DBpedia as the
    main data source for several reasons. First, DBpedia, being built on top of Wikipedia,
    is the most widely [32] used online encyclopedia, and one of the most prominent
    examples of truly collaboratively created content. The Wikimedia Commons⁷ is part
    of the Wikipedia encyclopedia family that contains over twenty-five million audio,
    video, and image files [33], including scanned books, historically significant
    photographs, illustrative figures, and maps. Accessing historical data via several
    media plays an important role in their exploration and interpretation. Third,
    DBpedia is interlinked to other related information and also connected to other
    datasets [34] that allow us to explore historical data through semantic relatedness.
    In addition to DBpedia, we use Wikidata as it represents information on the time
    and location of a resource by a set of well-defined properties, which is crucial
    for historical data exploration.


    First, we extract resources from DBpedia including Wikipedia text, images, video,
    and audio files. For each resource, we extract its connections in the forward
    and backward directions. After that, we find the equivalent entry in Wikidata,
    provided via the property `owl:sameAs` in a DBpedia resource, and retrieve temporal
    and spatial information.


    In order to integrate data from DBpedia and Wikidata into a knowledge graph database
    in the context of historical studies, we have worked with historians in the eTaRDiS
    project to develop an appropriate database schema. We re-structured the classes
    of DBpedia into the seven categories: `Agent`, `Place`, `Event`, `Topical Concept`,
    `Material Object`, `Cultural Artifact` and `Miscellaneous`. The reason is that
    DBpedia classes were not designed for the context of historical data. For example,
