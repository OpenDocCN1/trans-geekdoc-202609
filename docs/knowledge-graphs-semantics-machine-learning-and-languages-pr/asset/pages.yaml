  md: '# Spatial distance:


    The spatial distance dist_s between two fragments is defined as the shortest distances
    of the corresponding locations. Since locations are represented in pairs of longitudes
    and latitudes (φ, θ), the distance dist_s between two locations (φ_i, θ_i) and
    (φ_j, θ_j) can be calculated via the great circle distance with r_earth ≈ 6371,009
    km being the earth’s radius:


    dist_s(i, j) = r_earth arccos( sin(θ_i) sin(θ_j) + cos(θ_i) cos(θ_j) cos(φ_i −
    φ_j) ).


    # Semantic distance:


    We make use of the Sentence Mover’s Distance by Clark et al. [28] which is an
    evaluation method for multi-sentence texts. As sentence vectors, we use a fine-tuned
    sBERT model [29] based on the pre-trained model ‘all-MiniLM-L12-v2’⁴. We applied
    the Sentence Mover’s Distance to the abstracts as textual descriptions of entities,
    and use uniform weights for the sentences in the calculation of the distance.


    # Categorical distance:


    The categorical distance is per definition a dissimilarity and estimates to 1
    if two fragments do not share the same category. Otherwise, it is set to 0. Given
    the categories of two fragments, c_i and c_j, the categorical distance dist_c
    is computed as:


    dist_c(i, j) = { 1 if c_i ≠ c_j, 0 otherwise. }


    The user can choose according to which dissimilarity the data should be arranged.
    In our scenario the distance measure that is used as the input metric for the
    UMAP algorithm takes the dissimilarity values of the categories of the related
    fragments among themselves into account while the second one makes use of the
    semantic dissimilarities between the related fragments and the main fragment.
    Thus, related fragments that share the same category appear in clusters around
    the user and related fragments that have a high semantic dissimilarity to the
    main fragment are spatially distant to the center. Therefore, the visualization
    gives clues regarding the relationship between the main fragment and its corresponding
    related fragments and regarding the interrelationships between related fragments
    at one glance.


    # 3.3. Design Principles


    The features in the Hub and the Fragmentarium were developed to meet the requirements
    for the scholarly primitives by Unsworth [30] comparing, annotating, discovering,
    and sampling. These primitives, among others, are common methods of humanities
    researchers, basic functions common to scholarly activity across disciplines,
    over time, and independent of theoretical orientation [30]⁵.


    The primitive of comparing is addressed by the so called relation details in the
    Fragmentarium, which show pairwise connectivity information for the nodes regarding
    space and time (see Figure 2). The annotation primitive is realized by allowing
    users to mark nodes to find them later again more quickly. If nodes are marked,
    their mark appears in the color of their respective category on the compass, which
    is a guidance line in the upper field of view (see Figure 3). Furthermore, for
    each node, a detail window can'
