    # 5. Discussion and Conclusion


    In our study, IE could not be identified by any type of perplexity. The observation
    that perplexity from PoS tags as grammatical surprisal fails is plausible because
    all IE in the corpus are verb-noun compounds (VNC). They structurally correspond
    to the VNC of the literals. We can interpret perplexity of grammatical surprisal
    as a baseline, and moreover, this shows that perplexity is a suitable measure
    for our aims: when perplexity is based on grammatical structures, VNC in IE and
    literals should not exhibit large differences. This is what we observe. However,
    there is also no perplexity with lexical surprisal, and this is not what we expected.
    That is, n-grams of tokens do not give the language processor any clue to distinguish
    IE from literals. This is actually a semantic distinction. This finding is surprising
    because in the common and influential distributional language model [25], it is
    assumed that the meaning of a linguistic unit is represented in its context. Prototypically,
    contexts in this model mean co-occurrences of a linguistic unit in a pre-defined
    context window. Similar contexts indicate a similar meaning of a linguistic unit,
    while different contexts indicate a different meaning. We attribute the problem
    with the n-grams of tokens in our study to the small context sizes. Contexts of
    bi- to tetragrams cannot represent a larger conversational context, let alone
    a discourse. So, for example, if the word ganache, i.e., a soft chocolate filling,
    occurs in the conversational context of, say, quantum mechanics, it is presumably
    not possible to derive from a bigram-context the high surprisal / perplexity that
    ganache in this special context causes. The same effect emerges with semantic
    surprisal, since n-grams of thematic roles within the sentence boundaries do not
    yield higher perplexity with IE than with literals.


    The restriction to local contexts within the sentence boundaries is due to our
    data basis, because literals and idioms are represented as isolated sentences
    here. However, this is a crucial shortcoming, since Levy’s definition of surprisal
    [7] provides for extra-sentential contexts. According to this definition, surprisal
    is the deviation from the expected based on co-occurrence, but also from a larger
    context which can be the discourse, an entire corpus, or a paragraph, in short,
    any linguistic material that exceeds sentence boundaries. The perplexity scores
    that we calculated for lexical and semantic surprisal underpin Levy’s definition,
    since we observed that inner-sentential contexts are not sufficient to distinguish
    IE from literals. A language processor needs thus a larger context to decide whether
    an expression can be understood literally or as IE. Derivation of surprisal /
    perplexity from extra-sentential contexts is thus a task of future work.


    Another problem in calculating semantic surprisal concerns the large number of
    thematic roles that LOME assigns which makes the possibility quite high, that
    a given context will appear only once and finally, this would lead to uniform
    perplexity values. In future work, we will consider a reduction to ‘basic’ thematic
    roles, as initially introduced by Fillmore [11] such as agent, patient, theme,
    instrument and source.'
