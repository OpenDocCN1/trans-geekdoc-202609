- pgno: 147
  md: '+   - *Digital Representation*: Provenance research is easier to conduct if
    cultural heritage data is digitally available.

    +   - *Event-centric representation*: It is easier to identify relations between
    actors, objects and places when they are represented in an event-centric way.

    +   - *Machine-readable*: Machine-readable representations are easier to access
    compared to when the provenance research is presented in a written report only.


    # Object provenance


    +   - *Object data*: Representation of object title, object number, object category,
    material, part of which collection and its origin.

    +   - *Object creation*: When, where, and by whom the object was created.

    +   - *Actors*: The network of actors involved in the object''s collection.

    +   - *Locations*: Object acquisition and creation places as well as travel route.

    +   - *Events and time periods*: Historical events or time-period, may provide
    context, including unethical acquisition of colonial objects.

    +   - *Multiple descriptions*: If multiple views on an acquisition exist they
    should be noted to keep nuance.

    +   - *Comments*: An event may need detailed comments and notes in natural language.


    # Data provenance


    +   - *Provenance statement source*: Users should be able to review the sources/author
    for provenance statements.

    +   - *Source*: Users should be able to find the source materials of object provenance.

    +   - *Traceability to previous research*: Each version of object provenance research
    should include data provenance information.


    # 3.3.1. Competency Questions


    Competency questions (CQs) are questions in natural language that outline the
    knowledge and specify the constraints for knowledge representation [25]. The concept
    of competency questions was explained during the interviews, and the respondents
    were requested to come up with specific questions based on their own requirements.
    The individual CQs were then aggregated in this study. All participants agreed
    that it is crucial to keep track of the *people* who were engaged in object acquisition
    (collectors, traders...) to identify networks of individuals involved in the acquisition
    of an object (**CQ1**, **CQ2**, **CQ3**). It is also important to convey information
    about *dates and events*; for example, the date or occation the object was obtained
    (**CQ4**). This enables identifying networks of connected objects through historical
    events, which may collectively project on an objects'' acquisition (**CQ5**).
    *Geographic locations* are important to determine which items were bought or sold
    in particular regions or countries (**CQ6**). The respondents also identified
    *data provenance* as a crucial part in their competency questions. The participants
    unanimously agreed that each claim about the objects'' provenance must be documented
    to track previous studies (**CQ7**, **CQ8**, and **CQ9**). They also mentioned
    the need to revisit earlier provenance versions to acquire a complete picture
    of all previous studies. The full list of aggregated competency questions from
    the text above is shown in the first two columns of Table 2. In Section 5.2, we
    describe how these are used for the purpose of validation.'
