    [19] conclude that the context feature contributes to detecting semantically dissimilar
    words, while the count-based measure contributes to assessing the fixedness of
    collocations.


    # 3. Dataset, concepts and technique of analysis


    The data on which this study is based have been extracted from the British National
    Corpus (BNC)⁵ and were already used in [16]⁶. The dataset comprises 1997 sentences
    with idioms and 535 literal expressions. To avoid any bias, we split the data
    into five data sets of almost even size: four sets with about 500 sentences each
    which contain idioms and one set with 535 sentences containing literal expressions.
    As in [16], only verb-noun constructions (VNC) are in the focus of the present
    study. For the labeling of VNC as IE or literal expression, [16] used the list
    in [21,22]. [16] treated idiomaticity as a binary property and explicitly not
    as a gradual property [23].


    In order to determine the perplexity of IE and literals, we use two types of reference
    data sets, namely a news corpus with 1M sentences from the Wortschatz Leipzig
    (eng_news_2020_1M) corpora collection⁷, and a Wikipedia corpus also with 1M sentences,
    taken from the same source (eng_wikipedia_2016_1M).


    For PoS-tagging, we employ the spaCy⁸ parser which assigns 15 PoS tags. Thematic
    roles are assigned by LOME, a system for multilingual information extraction [24].
    For entity-assigns makes use of about 2000 thematic roles⁹. Specifically, we used
    for the entity-type parsing the program span-finder¹⁰.


    # 3.1. Perplexity: Measure of surprisal


    Perplexity (PP) is a measure of how well a probability distribution in a statistical
    language model predicts a data sample¹¹. It is defined as an two to the power
    of the entropy H of a probability distribution as exponent, as given in Eq. 1;
    the lower the perplexity, the better the model.


    PP = 2^H (1)


    In this study, H is the conditional entropy: expressed in terms of information
    theory, the conditional entropy is a measure of the quality of a model for a probability
    distribution q, given a true distribution p. This is reminiscent of the idea behind
    the Kullback-Leibler divergence, and like this, conditional entropy is not symmetrical.
    PP uses condi-'
