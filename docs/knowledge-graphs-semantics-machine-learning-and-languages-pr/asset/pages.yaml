    conditions. As shown in **Table 2**, these datasets have a lower number of texts
    from the positive class. System B accuracy drops below both supervised and hybrid
    approaches when the proportion of true positives is higher (*HateXplain*), where
    a model predicting only one class would have a lower chance of obtaining high
    scores. We observe how performance is significantly higher for the hybrid models
    in all other evaluation metrics.


    In addition to outperforming the linguistic baseline, our hybrid approach provides
    a higher level of interpretability. While the lexicon only provides terms recognised
    in the text to categorise it as being associated with the group (e.g., the term
    “fag”), our hybrid methods provide entities, and with them, their semantic structure.
    In **Figure 2** we see that, in addition to the label, the KG structure informs
    about the fact that it is a Gay male slang, a Homophobic slur, and holds different
    meanings across cultures (i.e., a cross-cultural dysphism). Similarly, the properties
    in the KG would also inform that “faggot” is a related synonym, and that it can
    be replaced by “gay man”. KG properties and relations provide a much richer level
    of knowledge representation than simple terms. This richer source of semantic
    knowledge has helped to achieve a competitive hybrid baseline with the one based
    on language models.


    # 4.3. Exploiting Semantic Enrichment


    This section highlights that the KG is also instrumental to enhance the model’s
    transparency and robustness to problems in hate speech training datasets. We begin
    our qualitative evaluation with an in-depth error analysis (§4.3.1), and extend
    it to audit how the training datasets capture language related to these groups
    (§4.3.2).


    # 4.3.1. Error Analysis


    Using a thematic analysis approach [48], we identify emerging typologies of errors
    and group them into distinct categories (**Table 4**). We focus on LR-based hybrid
    model with hierarchical entity expansion (HybridLR_h) because it outperforms the
    MultiNB-based models in two of the three validation datasets (**Table 3**). We
    translate errors into distinct categories considering: (i) each text, (ii) its
    group identity annotation, (iii) the model predicted probability for the gender
    and sexual orientation identities and, (iv) the list of entities provided by the
    model ranked by their weight. Our analysis consists of a 100-quartile random error
    sample in the validation datasets, to cover equally errors in all ranges of predicted
    probabilities. Sampling in each of the 3 validation datasets results in 280 texts.'
