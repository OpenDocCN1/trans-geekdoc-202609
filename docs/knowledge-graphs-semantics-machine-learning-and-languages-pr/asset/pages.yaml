    # 2.2. Worst-case Optimal Multi-way Join Algorithms


    Worst-case optimal multi-way algorithms [26] have recently gained a lot of attention
    (e.g., [3,27,28,29]) and have demonstrated high performance in evaluating graph
    pattern queries [27,29,30]. Such algorithms satisfy the AGM bound [31] and their
    runtime matches the worst-case size of the result of the input query [23,27].
    Pair-wise join algorithm carry out join operations on two join operands at a time.
    Instead, worst-case optimal multi-way algorithms (e.g., Leapfrog Triejoin [32])
    are recursive and evaluate input queries on a per variable basis. This evaluation
    method does not store any intermediate results and allows for solution mappings
    to be directly written to the result.


    # 3. Evaluation of GraphQL Queries over RDF Graphs


    In this section, we introduce the multi-way left-join algorithm that we developed
    for the native execution of GraphQL queries over RDF graphs. Motivated by recent
    results on the evaluation of basic graph pattern queries presented in [3,27],
    the proposed left-join algorithm is inspired by worst-case optimal multi-way join
    algorithms and evaluates queries on a per variable basis. However, unlike join
    operations, the reordering of left-join operations is not allowed. Hence, we have
    to pay attention to the order in which the variables of a query are evaluated.
    In addition, left-join operations might produce partial solutions (i.e., solutions
    with null values in the context of GraphQL). To respect the or-'
