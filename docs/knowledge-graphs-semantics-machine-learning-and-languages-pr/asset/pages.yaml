    << ?er dct:subject [concept_1] >> uno:pageRank ?pr1 .

    << ?er dct:subject [concept_2] >> uno:pageRank ?pr2 .

    << ?er dct:subject [concept_3] >> uno:pageRank ?pr3 .

    }

