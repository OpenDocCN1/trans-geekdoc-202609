  md: 'representations are presented. Third, the respondents’ opinions on multi-perspective
    representations of cultural heritage provenance.


    # Provenance Research:


    Interview results suggest that there is no standard goal for provenance research.
    However, all respondents agreed that it helps in gaining a better understanding
    of where collections and objects come from, leading to better-documented collections.
    Respondents had different approaches to conducting research, with varying reliance
    on sources such as archives, libraries, and web searches. All respondents, however,
    begin their research from the museum’s collection management system (CMS)⁶. Important
    to note that, two mentioned that the system often contains missing information
    and observational bias. Respondents also shared that there are no guidelines on
    how to represent provenance information. Typically, when the information goes
    beyond the CMS, a separate report is written. However, there is no efficient way
    to trace or find such information within the system except for the unstructured
    text report.


    # Problem with current representations:


    Participants agreed that current information representation in the CMS is problematic
    due to faulty, incomplete or unreliable information. Lack of digitisation of archival
    material (R5) and decentralisation of available materials for information (R3)
    are identified as major challenges. Current representations of provenance in the
    CMS do not match the complexity of provenance research (R4), and important relations
    among people, places, objects and event cannot be represented in a machine-readable
    way (R3). Another problem identified by all the respondents is that the current
    management system does not contain any data provenance information, making it
    difficult to trace provenance of statements previously made about an object.


    # Opinions on multi-perspective representation cultural heritage data:


    Respondents agreed that keeping nuance in object provenance information is important,
    as changing times and perspectives lead to new ways of perceiving information.
    Museum database records can be influenced by the dominant perspective of their
    time, such as colonial representations and language use, which may not align with
    current views (R2, R4). Acknowledging how objects were seen before can tell us
    something about collections (R4). If multiple versions of provenance exist, all
    should be represented, as provenance is rarely fully proven (R5). On the other
    hands, some respondents (R1, R3) argue that it’s not practical to preserve all
    information, and it depends on the research goals. Another respondent (R2) notes
    the importance of distinguishing between information deemed more correct now versus
    prior research. They also agreed that their research is just one interpretation
    of an object’s history; it is impossible to say that their research is the final
    interpretation of the history of an object.


    # 3.3. Identified Requirements and Competency Questions


    The overall requirements reported by the domain experts for a representation are
    presented in the list below, divided into three types: overall representation,
    object provenance (information identified as important related to the chain of
    custody of an object) and data provenance (about the cultural heritage provenance
    statements, such as sources used during the research).


    # Overall representation


    Domain experts report that:'
