  img_proc: true
- pgno: 185
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_185_0.png)


    **Figure 6.** A part of the modeling of the TRANSRAZ agents block


    REQ4: Events and their attributes, e.g. temporal information, are often extracted
    from the historical resources, thus, may be uncertain, incomplete or even false.
    Thus, provenance annotation is required (CQ6.1, CQ6.2, CQ6.3, CQ6.4).


    REQ5: Events can be interconnected via temporal relations, as e.g., *overlaps*,
    *before* (CQ1.1, CQ2.1-2, CQ3.1-2, CQ4.2).


    The entity-based representation of temporal relations requires either additional
    extensions to RDF [14,27,15], or a great amount of additional statements [17],
    while an event-based approach addresses this gap and allows for direct representation.
    In [11], a temporal event-centric Knowledge Graph is presented. In the work, subclasses
    of Wikidata and DBpedia classes *wdt:Q1656682* (Event) and *dbo:Event* are identified.
    However, these ontologies model events that aim at representing certain activities,
    e.g. lecture, concert, festival, and do not cover events that represent temporal
    states and change (REQ1, REQ2). The EventKG enhances the Simple Event Model (SEM)
    [28] and provides a vocabulary for modeling temporal relations of the types entity-entity
    (e.g. marriage), entity-event (e.g. Margarete Haagen played the Girl in the ”Zapfenstreich”),
    but do not directly cover temporal relations between events, e.g. does reconstruction
    of the ”Frauenkirche” overlap with the reconstruction of the St. Lorenz Church?
    (REQ5).


    In contrast, CIDOC-CRM provides semantics for changes of state in cultural, social
    and physical systems, e.g. class *crm:E11 Modification* and its subclasses comprise
    a change of an object, class *crm:E8 Acquisition* comprises transfers of legal
    ownership from one agent to another (REQ1). Moreover, CIDOC-CRM’s events are represented
    through the time spans of their validity in form of abstract temporal extents
    (REQ3), e.g. duration of the Ming Dynasty, and are connected to each other via
    temporal relations (REQ5), e.g. *crm:P114 is equal in time to*, *crm:P117 occurs
    during*, etc.


    Since CIDOC-CRM does not fully suffice for the purposes of TRANSRAZ (REQ1 and
    REQ2), the model has been extended by adding further properties and classes. The'
