- pgno: 21
  md: '# 3.2.1. Search for Pretraining Data


    To learn the weights of the KG we selected a balanced subset of the Jigsaw Toxicity
    dataset. For a full description of the datasets used in this work for training
    and validation, including references, descriptions, and statistics, see (§4.1)
    and Table 2. To create the Jigsaw Sample we selected all the texts annotated with
    sexual orientation, a total of 12,713 texts, and a random same size set that includes
    16,850 texts annotated as related to gender. We then built a stratified sample
    of texts from all the remaining identities (i.e., religion, race, disability,
    and none) as the negative class. This provided us a balanced dataset of 50,852
    texts, with 50% of them related to the class, and 50% related to any other identities.


    # 3.2.2. Entity recognition


    To determine whether an entity appears or not in a given text (entity matching)
    we take into account, not just the entity’s label, but also its alternative names
    and existing synonyms. For example, in Figure 2 (A) we observe that “X-gender”
    is defined by “Male to X-gender”, “Female to X-gender”, “Genderqueer” and “Gender
    nonbinary”. In addition to these terms, we also consider stemming variations,
    such as “genderqu” and “gender nonbinari”. Any text that contains any of these
    expressions is considered a text where the entity appears. Specifically, the KG
    properties shown in Figure 2 (A) are used to derive the synonyms for the entity
    matching. We develop a search index based on the Whoosh 2.7.4 library (https://whoosh.readthedocs.io)
    to speed up the entity matching, and obtain the stemming variations with its Porter
    stemmer native function.


    # 3.2.3. Entity weighting


    Finally, we consider two types of entity weighting schemes: (i) based on the frequencies
    of entities in the pretraining data and (ii) based on the learned coefficients
    of a ML model used for the domain task, in this case the binary classification.


    *Entity weighting based on frequency (DocF)* The weight provided to the entities
    is based on the ratio of appearance of that entity within the positive sample
    (i.e., all the texts related to gender and sexual orientation) vs. the negative
    sample (i.e., all the text related to any other identity). Lets Dp be the set
    of all texts related to the class, and Dn be the set of all text related to any
    other identity. Given an entity ei, we consider the occurrences ei in Dp (Dp′),
    and the occurrences ei in Dn (Dn′). The weight of the entity w(ei) is then computed
    as w(ei)=Dp′/Dp−Dn′/Dn, such that w∈[−1,1].


    *Entity weighting based on ML coefficients (LR and MultiNB)* This approach provides
    weights to the different entities based on the coefficients defined by a machine
    learning model. The coefficients reflect how discriminative the entities are when
    predicting whether a particular text refers (or not) to the class. We use two
    different ML models for the task: Logistic Regression (LR) and Multinomial Naive
    Bayes (MultiNB). As input to train the ML models, we provide for each pretraining
    sample: (i) a class label (i.e., whether the text contains any language references
    to gender and sexual orientation) and (ii) the one-hot-encoding of the entities
    resulting from the entity matching explained above. That is, the ML models use
    entities as features for the classification. The resulting coefficients reflect
    the feature importance and how much each entity contributes to the prediction.'
