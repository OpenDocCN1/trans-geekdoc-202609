  md: "# # Perplexed by Idioms?\n\nJ. Nathanael PHILIPPᵃ,ᵇ,¹, Max KÖLBLᶜ, Erik DAASᵇ,\
    \ Yuki KYOGOKUᵇ and Michael RICHTERᵇ\n\nᵃ Serbski institut  \nᵇ Leipzig University\
    \  \nᶜ Osaka University\n\nORCID ID: J. Nathanael Philipp https://orcid.org/0000-0003-0577-7831,\
    \ Max Kölbl https://orcid.org/0000-0001-7460-4139, Erik Daas https://orcid.org/0009-0007-0879-0878,\
    \ Michael Richter https://orcid.org/0000-0001-7460-4139\n\n**Abstract.** The aim\
    \ of this study is to identify idiomatic expressions in English using the measure\
    \ *perplexity*. The assumption is that idiomatic expressions cause higher perplexity\
    \ than literal expressions given a reference text. Perplexity in our study is\
    \ calculated based on n-grams of (i) PoS tags, (ii) tokens, and (iii) thematic\
    \ roles within the boundaries of a sentence. In the setting of our study, we observed\
    \ that no perplexity in the contexts of (i), (ii) and (iii) manages to distinguish\
    \ idiomatic expressions from literals. We postulate that larger, extra-sentential\
    \ contexts should be used for the determination of perplexity. In addition, the\
    \ number of thematic roles in (iii) should be reduced to a smaller number of basic\
    \ roles in order to avoid an uniform distribution of n-grams.\n\n**Keywords.**\
    \ perplexity, idiomatic expressions, literal expressions, information theory\n\
    \n# ## 1. Introduction\n\nIdiomatic expressions, or phraseologies, (in the following\
    \ **IE**) such as the verb-noun compounds (**VNC**) *kick the bucket, hit the\
    \ fan, blow whistle, hit the sack* or *lose face* are ubiquitous in the English\
    \ language. The aim of this study is to automatically identify IE in English texts\
    \ using an information theoretic framework [1].\n\nIE are far less subject to\
    \ the principle of compositionality than literal expressions [2,3] since in most\
    \ cases, the meaning of an expression cannot straightforwardly be derived from\
    \ the meaning of its parts. The interpretation of idioms is not reductionist.\
    \ So, to unlock the meaning of the IE for instance in the sentence *the shit has\
    \ hit the fan at our house* it is not sufficient to know the meaning of *shit*,\
    \ *hit* and *fan* alone. Understanding an IE touches on conventionality in language,\
    \ since its meaning has evolved through specific language usage and convention.\
    \ [2] emphasise that *[t]he meaning of IE involves i.a. metaphors and hyperboles*,\
    \ and the meaning of the constituents of IE is overruled. IE are stable linguistic\
    \ constructions, mostly with specific syntax as in *lose face* or *blow whistle*,\
    \ a feature referred to as *(In)flexibility* [2,3]. This feature also means the\
    \ imper-\n\n¹ Corresponding Author: J. Nathanael Philipp, nathanael@philipp.land."
