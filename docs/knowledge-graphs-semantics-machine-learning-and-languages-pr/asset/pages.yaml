- pgno: 232
  md: 'data and (iii) the data use. Previous work has been performed and published
    within the general fields of ‘regulation compliance’ and ‘legal metadata expression
    using vocabularies’ [6], to specify how jurisdictional laws can be translated
    into semantic models for data governance. In the context of this work, we focus
    on the existing research and solutions, limited to addressing the requirements
    presented in the Use Cases specified in Section 2, and present the state of the
    art across the areas of (i) vocabularies to express policies and data activities-related
    metadata, and (ii) vocabularies to specify information about (personal) data and
    metadata processing, further described in the next two subsections.


    # 3.1. Vocabularies to Express Policies and Metadata


    A recent survey [7] has been published where a set of vocabularies and policy
    languages are analysed in terms of their capacity to represent the information
    required to comply with the obligations and rights of GDPR-related entities. In
    particular, this survey concludes that ODRL is a mature resource, ready to be
    used for representing policies related to data protection law requirements, which
    is open source, supported by good documentation and continues to be developed
    and maintained by a W3C Community Group. The ODRL Information Model [8] is a W3C
    Standard Recommendation that allows the expression of flexible and complex digital
    policies, including the possibility to represent permissions and prohibitions
    to perform certain actions over assets and further restrict said policies using
    constraints and duties. ODRL also supports the development of extensions, the
    so-called ODRL profiles⁴, that provide a way to add further terms for specific
    domains which are not present in the core ODRL vocabulary. Though other solutions,
    such as XACML [9] or LegalRuleML [10], provide a richer expressivity and formal
    semantics to utilise such resources, ODRL has a convenient extension mechanism
    and has been proven to work as a policy language to deal with GDPR requirements
    [11,12]. Other general vocabularies, such as the W3C DCAT Recommendation [13]
    or the DCMI Metadata Terms (DCT) specification [14], will also be used as they
    provide terms to describe metadata related with datasets including information
    about the entities who create and maintain data or temporal and spatial assertions
    regarding the usage and access to data.


    # 3.2. Legal Vocabularies to Specify Data and its Processing


    A vocabulary specifying legal concepts is required for expressing policies aligned
    with data-related regulations and, in the case of this work, one that can easily
    complement and be integrated with ODRL, and the other previously mentioned vocabularies,
    to express examples related to the Use Cases specified in Section 2. While no
    work within the state of the art provides concepts to deal with DGA requirements,
    several vocabularies have been developed to cover GDPR concepts that can be reused.
    In particular, and as confirmed by the previously cited survey on data protection
    vocabularies [7], DPV’s [15] set of taxonomies provides the most complete set
    of vocabularies to express information regarding data, entities, processing activities,
    purposes, legal basis, rights, risks and consequences, tech-'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'nical and organisational measures, rules or technologies. Moreover, there already
    exists published work that uses DPV to create a semantic model for the representation
    of information related to GDPR’s Register of Processing Activities [16]. As such,
    DPV will be the base vocabulary upon which this work will be developed.


    # 4. Extending W3C vocabularies to cover DGA requirements


    As covered by the previous sections, there is a gap in the representation of information
    brought by the DGA requirements, in particular, to specify conditions for the
    reuse of public data (further developed in Section 4.1), to populate public registers
    of data intermediation service providers and data altruism organisations and record
    their activities (further developed in Section 4.2) and to create a common data
    altruism form for data subjects’ consent and data holders’ permissions (further
    developed in Section 4.3). In the following subsections, we discuss terms of existing
    standards and specifications that can be used to represent some of the information
    items described in Section 2 and define the terms that are missing in an open-source
    ad-hoc vocabulary, to cover the identified Use Cases. In addition, for each Use
    Case, we also provide examples to demonstrate their applicability.


    # 4.1. Policies for the Reuse and Sharing of Public Data


    As described in Section 2.1, public sector bodies need to provide single information
    point providers information regarding the data resources they own and the conditions
    for their usage, so that these providers can make available and maintain a searchable
    asset list, which data users can use to search and request datasets for re-use.
    Table 2 contains the DPV, DCAT and DCT’s terms that can be reused to model some
    of the concepts identified in Table 1.


    Table 2. Information items that need to be modelled to express the conditions
    of re-use of public sector bodies datasets and respective terms from existing
    vocabularies that can be reused.


    | Article | Information items | Terms from existing vocabularies |

