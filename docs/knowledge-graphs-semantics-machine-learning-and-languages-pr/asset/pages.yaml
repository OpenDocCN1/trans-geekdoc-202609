  md: 'annotations, and buildings in a 3D research environment. The TRANSRAZ data
    model consists of four main building blocks which have to be integrated into the
    VRE.


    +   1. **Architectural Objects** are modeled as 3D elements within the VRE. The
    building parts are created as separate elements and have to be identifiable uniquely.
    2. **Historical documents** are retrieved from archives and museums and contain
    relevant historical information about cities inhabitants, events etc. By means
    of information extraction and semi-automated annotations, the documents are connected
    to the 3D architecture with respect to their specific location and time mentioned.
    3. **Agents** can be inhabitants of the historical city of Nuremberg and organizations.
    Entities, along with (family) relations, dates, addresses, and occupations are
    extracted from the existing TOPORAZ database as well as the historical document
    collections and connected to the 3D environment. 4. **Events** are extracted from
    the existing TOPORAZ database as well as the historical document collections.
    They include important city events and festivals as well as changes of state,
    e.g. architectural changes.


    Goal is to represent these four main building blocks in a semantically meaningful
    and efficient way to enable a scientifically correct and intuitive exploration
    of Nuremberg in the context of its inhabitants and important events on the foundation
    of historical documents. The generalization of this contribution is ensured as
    it can be applied to any project related to the semantic representation of historical
    entities in a location based exploration environment. This work is reusable and
    reproducible, the data model is publicly available on the Web⁶ including its documentation.


    The remainder of the paper is structured as follows. In section 2 works related
    to modeling architectural data, the representation of heterogeneous cultural heritage
    data and the alignment of archival documents are discussed. In section 4 the design
    methodology along with data ressources and competency questions is discribed.
    Section 3 contains the main contribution of the paper, followed by evaluation
    use cases to explore the TRANSRAZ data. Section 5 concludes this paper.


    # 2. Related Work


    Three-dimensional models have traditionally been the purview for manufactures
    of navigation systems, planners, pollution researchers and virtual tourists [2].
    However, in recent years the interest of connecting modern digital technologies
    with historical data from the past has raised immensely. Historians, museologists,
    architects and the general public are keen to research and curate heritage data,
    and basically to walk through the history hidden inside historical materials.
    Adding new dimensions to the past is a goal of the Time Machine projects⁷. Discovery,
    extraction, connection, reuse of historical data, and subsequently, the 3D reconstruction
    of European cities, e.g. Amsterdam⁸ or Venice⁹, is an ongoing goal to provide
    users with the ability to travel back in time. Meanwhile, a 4D browser for researching
    and communicating the history of the city of Dresden is'
