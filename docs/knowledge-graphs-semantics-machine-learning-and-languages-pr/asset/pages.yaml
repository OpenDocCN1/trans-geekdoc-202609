  md: '# ## 4. Data Model


    To further guide the modelling of object provenance information, we investigate
    this in the form of a case study concerning six ethnographic objects that are
    described in two different provenance reports “Provenance #1” [26] and “Provenance
    #2” [27], issued by the Dutch National Museum of World Cultures (NMVW)⁷ to embed
    provenance of artworks into its practice and policy. They describe objects with
    rich provenance information elicited by extensive provenance research on these
    objects.


    One object, RV-1148-1 is an elephant tusk that was part of the extensive provenance
    research on collections from Benin City. This provenance research aimed to assess
    the strength of connection to the military campaign led by British forces against
    Benin City in early February 1897; the research can be found in the report “Provenance
    #2” [27]. The rest of the objects (RV-2584-169a, RV-2334-1, RV-2334-2, RV-2334-3
    and RV-2334-1) are from “Provenance #1” [26], where two different types of provenance
    information are found. On one side, RV-2584-169a is an interesting case-study
    because of having different possible theories of the acquisition and/or origin
    of the object, which left the researcher incapable of concluding on one theory
    with a high degree of certainty. On the other hand, the objects with id RV-2334-*
    are insightful because of their complicated chain of custody and links to different
    archival material. Despite the diversity in information, what is common in all
    the objects is that there have been discovered possible links to important historical
    events or time-periods, which projects unethical acquisition in the objects’ chain
    of custody. The diversity in information, possible links to different historical
    events and time-periods, and available connections to different archival materials
    make these objects an ideal case study for the current research. These objects
    not only refer to the requirements identified by the previous section but also
    represent the complex nature of such knowledge. In the following subsection, we
    will describe our modelling choice for the proposed data model.


    The first step is to reconstruct the information of these objects to identify
    essential statements related to the object’s provenance from the textual report.
    This information is translated to provenance data that illustrates the key components
    considered necessary for representing the artefact’s provenance. For this research,
    we investigated the use of CIDOC-CRM to ensure reusability.


    # ### 4.1. Object


    Our requirements indicate there are various types of knowledge about the object
    to represent. First-level object information is essential even if detailed provenance
    is unknown. As one respondent (R1) mentioned, the origin can be identified by
    knowing the materials used or the creation or collection date. CIDOC-CRM allows
    an object- and event-centric approach to co-exist by connecting instances directly
    to an object and also without an intermediary event. The domain experts call for
    representations of objects’ inventory number, title, category or classification,
    material, collection and origin. Additionally, they request the possibility of
    attaching comments and descriptive notes.


    Based on the participants’ requirement of object description, this research reuses
    the specification mentioned for the function to express object collection information
