    # 4. User Study


    In this section, we present a user study that helped us to gain insights into
    how users interact with eTaRDiS. The user study was designed with two goals: 1)
    to evaluate if the user (a historian or a layperson with an interest in history)
    could retrieve relevant information regarding a certain historical question, 2)
    to assess the usability of the application.


    The participants started in the Hub and were asked to open a preset with the main
    fragment Hundred Years’ War (i.e., the resource `res:Hundred_Years''_War`) as
    the starting point in the Fragmentarium and got a brief tutorial on the main functionalities.
    After the introduction, they were instructed to choose a preset with the fragment
    Albert Einstein (i.e., the resource `res:Albert_Einstein`) as the starting point
    of four successive tasks and were asked to “think aloud” (method based on [35])
    in the Fragmentarium. In this section, we describe the tasks, participants, and
    results of the user study.


    # 4.1. Tasks


    The underlying question for the tasks was: ‘What is the relation between the fragments
    World War II (WWII), J. Robert Oppenheimer (Oppenheimer) and the Manhattan Project?’.
    In order to answer the question, the participants were first asked to find the
    three fragments in the Fragmentarium. As a second task, they had to retrieve'
