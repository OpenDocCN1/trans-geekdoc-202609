- pgno: 34
  md: '# Using Pre-Trained Language Models for Abstractive DBPEDIA Summarization:
    A Comparative Study


    Hamada M. ZAHERA ♣ a,1 , Fedor VITIUGIN ♣ b , Mohamed Ahmed SHERIF a , Carlos
    CASTILLO b,c and Axel-Cyrille NGONGA NGOMO a


    a Data Science Group, Department of Computer Science, Paderborn University

    b Web Science and Social Computing Research group, Universitat Pompeu Fabra, Spain

    c ICREA, Catalan Institution for Research and Advanced Studies, Spain


    ORCiD ID: Hamada M. Zahera https://orcid.org/0000-0003-0215-1278, Fedor Vitiugin
    https://orcid.org/0000-0003-4350-1828, Mohamed Ahmed Sherif https://orcid.org/0000-0002-9927-2203,
    Carlos Castillo https://orcid.org/0000-0003-4544-0416, Axel-Cyrille Ngonga Ngomo
    https://orcid.org/0000-0001-7112-3516


    Abstract.


    Purpose: This study addresses the limitations of current short abstracts of DBPEDIA
    entities, which often lack a comprehensive overview due to their creating method
    (i.e., selecting the first two-three sentences from the full DBPEDIA abstracts).


    Methodology: We leverage pre-trained language models to generate abstractive summaries
    of DBPEDIA abstracts in six languages (English, French, German, Italian, Spanish,
    and Dutch). We performed several experiments to assess the quality of generated
    summaries by language models. In particular, we evaluated the generated summaries
    using human judgments and automated metrics (Self-ROUGE and BERTScore). Additionally,
    we studied the correlation between human judgments and automated metrics in evaluating
    the generated summaries under different aspects: informativeness, coherence, conciseness,
    and fluency.


    Findings: Pre-trained language models generate summaries more concise and informative
    than existing short abstracts. Specifically, BART-based models effectively overcome
    the limitations of DBPEDIA short abstracts, especially for longer ones. Moreover,
    we show that BERTScore and ROUGE-1 are reliable metrics for assessing the informativeness
    and coherence of the generated summaries with respect to the full DBPEDIA abstracts.
    We also find a negative correlation between conciseness and human ratings. Furthermore,
    fluency evaluation remains challenging without human judgment.


    Value: This study has significant implications for various applications in machine
    learning and natural language processing that rely on DBPEDIA resources. By providing
    succinct and comprehensive summaries, our approach enhances the quality of DBPEDIA
    abstracts and contributes to the semantic web community.


    Keywords., Abstractive Summarization, Large Language Models, Knowledge Graphs.'
