- pgno: 180
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_180_0.png)


    Figure 2. Workflow


    # 3. TRANSRAZ Data Model


    This section presents the main contribution of this work, the TRANSRAZ data model,
    which integrates agents, architectural objects, events, and historical documents
    into a 3D VRE by means of ontologies. This task presents versatile data modeling
    challenges: (i) Within TOPORAZ [24], a relational database model and a first version
    of the VRE were created. A challenge in this ongoing project TRANSRAZ is the transformation
    of the existing model to a semantic data model with mappings to existing ontologies
    relevant for the cultural heritage domain, as e.g. CIDOC-CRM. (ii) The historical
    documents retrieved from archives and museums are analyzed, semi-automatically
    annotated and connected to the VRE. To allow for a scientifically correct exploration
    of the city, the document annotation process has to be made completely transparent,
    i.e. data provenance plays an important role in the modeling decisions. (iii)
    Within the VRE, users will be able to explore different time periods. That means
    entities change their names, houses are destroyed and rebuilt, organizations change
    their ownership etc., which has to be considered in the modeling process.


    The overall workflow is shown in figure 2. Architectural objects, agents, and
    events are represented based on ontologies on the foundation of the existing TOPORAZ
    relational database and the analyzed historical documents obtained by domain experts.
    They are then integrated into the TRANSRAZ data model and finally the 3D VRE.


    In the following, the building blocks of the TRANSRAZ data model, the modeling
    requirements for each building block as well as the resulting ontologies are described.
    Additionally, the evaluation of the data model with the CQs is provided.


    # 3.1. From Data Sources to Building Blocks


    Due to the complexity, diversity and heterogeneity of the data sources and the
    knowledge contained within, a modular modeling approach to construct the data
    model was adopted.


    Therefore, the modules are represented by four main building blocks that correspond
    to the different aspects of the data model. Accordingly, the TRANSRAZ data model
    is organized in the following blocks:


    +   * **Historical Documents** are used for the provenance annotation of statements,
    and also as a basis for automatic semantic annotation with references to other
    building blocks in the data model and classes in the ontologies.

    +   * **Architectural Objects** represents all structures in the urban space,
    such as streets, districts, buildings, facades, roofs, rooms, etc.

    +   * **Agents** refers to persons, clubs, organisations, associations, etc.,
    who lived, worked or owned properties in the city or are socially connected to
    them.'
