- pgno: 59
  md: '5. The fifth case is about Spanish accentuation. In Spanish, the character
    “´” is known as “orthographic accent”. This accent is used on some words’ vowels
    and can modify the word’s meaning. One example is the words “mas” and “más”. “mas”
    is an equivalent of the word “but”, while “más” is a quantity adverb. Some QALD-9
    translations lack orthographic accents, so the real meaning of some words is lost.
    This case can be triggered by mistakes both in the question and in the question
    keywords.


    6. The sixth case comprises questions with correct translations that were reformulated
    to be more natural. Modifications in the question’s keywords do not trigger this
    case. The question “How deep is Lake Placid?” was translated to “Cómo de hondo
    es el Lago Placid?”, which is technically a correct translation, but we consider
    that the literal translation “Cómo de hondo” is not the best way to express “How
    deep”; therefore, we modified the translation to “¿Qué tan profundo es el Lago
    Placid?”.


    7. Finally, the seventh case relates to questions that do not require modification.
    Modifications to the question’s keywords do not affect this case. The question
    “Which presidents were born in 1945?” was translated to “¿Qué presidentes nacieron
    en 1945?”. We consider this translation correct and natural; therefore, we classified
    it under Case 7.


    # QALD-9 translations analysis, most frequent cases


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_59_0.png)


    Figure 1. Plot showing the percentage of occurrence of each case in the QALD-9
    dataset. Case 1 is related to questions with minor translation issues, case 2
    to major translation issues resulting in the loss of the original meaning of the
    question, case 3 relates to errors on the question keywords propagated from the
    question translation, case 4 to mistakes in the question keywords that are not
    related to errors in the question translation, case 5 is about questions with
    accentuation errors, case 6 contains questions that were modified to be more natural,
    and finally, case 7 are questions with correct translations.'
