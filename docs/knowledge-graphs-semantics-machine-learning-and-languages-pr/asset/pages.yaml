- pgno: 192
  md: '# COBALT: A Content-Based Similarity Approach for Link Discovery over Geospatial
    Knowledge Graphs


    Alexander BECKER a, Abdullah AHMED a and Mohamed Ahmed SHERIF a

    Axel-Cyrille NGONGA NGOMO a


    a DICE group, Department of Computer Science, Paderborn University

    ORCiD ID: Alexander Becker https://orcid.org/0009-0000-8212-4647, Abdullah Ahmed
    https://orcid.org/0000-0002-0668-0735, Mohamed Ahmed Sherif https://orcid.org/0000-0002-9927-2203,
    Axel-Cyrille Ngonga Ngomo https://orcid.org/0000-0001-7112-3516


    Abstract. Purpose: Data integration and applications across knowledge graphs (KGs)
    rely heavily on the discovery of links between resources within these KGs. Geospatial
    link discovery algorithms have to deal with millions of point sets containing
    billions of points. Methodology: To speed up the discovery of geospatial links,
    we propose COBALT. COBALT combines the content measures with R-tree indexing.
    The content measures are based on the area, diagonal and distance of the minimum
    bounding boxes of the polygons which speeds up the process but is not perfectly
    accurate. We thus propose two polygon splitting approaches for improving the accuracy
    of COBALT. Findings: Our experiments on real-world datasets show that COBALT is
    able to speed up the topological relation discovery over geospatial KGs by up
    to 1.47 × 10⁴ times over state-of-the-art linking algorithms while maintaining
    an F-Measure between 0.7 and 0.9 depending on the relation. Furthermore, we were
    able to achieve an F-Measure of up to 0.99 by applying our polygon splitting approaches
    before applying the content measures. Value: The process of discovering links
    between geospatial resources can be significantly faster by sacrificing the optimality
    of the results. This is especially important for real-time data-driven applications
    such as emergency response, location-based services and traffic management. In
    future work, additional measures, like the location of polygons or the name of
    the entity represented by the polygon, could be integrated to further improve
    the accuracy of the results.


    Keywords. Knowledge graphs, Data Integration, Linked Data, Geospatial Knowledge
    graphs, Content Measure Similarity, Topological Relations


    # 1. Introduction


    The necessity for highly scalable methods for finding links between geospatial
    resources has arisen as a result of the rapid proliferation of linked geospatial
    data. Only 7.1% of the relationships between resources relate geographical elements,
    as was noted in earlier publications [1]. There are two basic causes for this:
    1) The vast quantity of geospatially represented resources on Linked Open Data
    (LOD) necessitates scalable techniques for'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'computing linkages between geospatial resources. For example LINKEDGEODATA
    [2] has over 20 billion triples describing millions of geographical things. II)
    The computation of certain relations, such as distance and topological links between
    geospatial resources, have to deal with the vector representation of geospatial
    data. For instance, for identifying the nearby points of interest within a certain
    radius.


    Discovering links among KGs in RDF is crucial for many data-driven applications,
    according to the Linked Data principles [3]. Nowadays dealing with geospatial
    resources is a fundamental in many real-time applications [4], such as emergency
    response, location-based services and real-time traffic management. However, generating
    links among such real-time geospatial KGs is challenging task in order to enable
    real-time decision making. Thus, both the efficiency and scalability of the link
    discovery process becomes more challenging.


    Recently, algorithms such as RADON [5], RADON2 [6], GIA.NT [7], and DORIC [8]
    have been developed. These algorithms compute topological relations between geographical
    resources quickly and effectively. In all of them, the Dimensionally Extended
    Nine-Intersection Model (DE-9IM) [9] is used. The DE-9IM defines topological relations
    between two-dimensional geometries by calculating the dimensions of the intersections
    between the interior, boundary and exterior of two geometries. The relations defined
    by the DE-9IM are the ones commonly used in natural language [10]: Equals, Disjoint,
    Intersects, Touches, Crosses, Within, Contains, Overlaps, Covers and Covered By.
    In an attempt to speedup the computation of geospatial relations, Ahmed et al.
    [11] have studied the effect of simplifying the resources’ geometries on the runtime
    and F-Measure of link discovery approaches. However, computing the DE-9IM is still
    very expensive in terms of runtime.


    In this paper, we propose COBALT, an approach based on the content measures combined
    with R-tree indexing to discover the topological relations defined in [9] and
    [10]. To the best of our knowledge, this is the first work that uses content-based
    measures integrated with R-tree indexing for discovering links among RDF geospatial
    resources. We summarize our contribution as follows:


    +   1. We present and formalize the problem of topological relation discovery
    for geospatial resources based on content measures and R-tree indexing.

    +   2. We study the effect of using different R-tree building algorithms, node
    capacities and the impact of indexing both datasets.

    +   3. We study the impact of using the content-based measures for topological
    relations discovery on both runtime and accuracy.

    +   4. In order to increase the accuracy of our approach, we propose two polygon
    splitting strategies and analyze the effect of them on both runtime and accuracy.


    The rest of the paper is structured as follows. We begin by introducing the link
    discovery problem over RDF KG in Section 2, where we also formally define the
    topological relations based on content measures. Then, we describe our approach
    in Section 3. In Section 4, we present our evaluation and results. We then discuss
    the state-of-the-art related work in Section 5. Finally, we conclude our paper
    and present some future work in Section 6. Our implementation of COBALT is open
    source and implemented into the LIMES framework.¹'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_194_0.png)


    Figure 1. The content measure relations.


    # 2. Preliminaries


    # Knowledge Graph.


    A Knowledge Graph (KG) G is a set of triples (s, p, o) ∈ (ℛ ∪ ℬ) × 𝒫 × (ℛ ∪ ℒ
    ∪ ℬ), where ℛ is the set of all resources, ℬ is the set of all blank nodes, 𝒫
    is the set of all predicates, and ℒ the set of all literals.


    # Link Discovery.


    Given a source knowledge graph Gs and a target knowledge graph Gt (for example,
    two KGs containing the geometric representation of national borders) and a relation
    r (e.g., :touches), the goal of the link discovery problem is to find all pairs
    (s, t) ∈ Gs × Gt such that r(s, t) holds. The result is produced as a set of links
    called a mapping: M = {(s, r, t) | s ∈ Gs, t ∈ Gt}.


    # Content Measures for Topological Relations.


    We use the content measures as defined Godoy et al. [12] for deciding if the relation
    r(s,t) exists. Godoy et al. have implemented three content measures to determine
    whether a topological relation between two polygons exists by comparing the area,
    the diagonal or the area and the diagonal of the polygon’s minimum bounding boxes.
    The relations distinguished by the content measures in Figure 1. The Minimum Bounding
    Box (MBB) of a polygon P with n ≥ 3 points ((x1,y1),..., (xn,yn)) is defined as
    the smallest rectangle which fully contains the polygon’s points. Formally, MBB(P)
    = ((Xmin, Ymax), (Xmax, Ymin)), where Xmin = min(x1,...,xn), Xmax = max(x1,...,xn),
    Ymin = min(y1,...,yn) and Ymax = max(y1,...,yn). The area of a MBB M is defined
    as area(M) = (Xmax − Xmin) · (Ymax − Ymin). The diagonal of a MBB M is formally
    defined as diagonal(M) = √((Xmax − Xmin)² + (Ymax − Ymin)²). We further use the
    same definitions of intersection, union and distance among MBBs from [12].


    # 3. Approach


    We start our approach by indexing the source dataset polygons using R-tree then
    we apply content measure on the indexed polygons.


    # R-tree Indexing.


    R-trees [13] are an enhanced variant of binary trees, where an R-tree stores the
    MBBs of the polygons instead of the polygons themselves. In COBALT, we use Guttman’s
    R-tree [14] to index the source dataset in order to filter out as many disconnected
    polygon pairs as possible to reduce the runtime of the linking process. Every
    node’s MBB contains all its children’s MBBs, so in case an MBB of a parent node
    does not intersect a query rectangle (a query rectangle is a MBB from target data),
    none of its descendants can [14]. The bottom layer of an R-tree stores the MBBs
    of source dataset polygons, and all layers above it match the criterion applied
    to indexing the bottom layer. One example of a handcrafted R-tree is depicted
    in Figure 2.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_195_0.png)


    Figure 2. A handcrafted R-tree, green is the bottom layer, blue is the middle,
    and red is the top layer.


    # Querying R-tree.


    R-trees are easy to query recursively. Let q be the target MBB of the polygon
    for which we want to find the intersected MBBs of the source polygons. Since the
    nodes of an R-tree nodes are R-trees, we utilize the same algorithm for each node.
    If the current node of the R-tree is at the bottom layer, (i.e., it contains no
    other R-trees but polygons), we then verify if q intersects each of the MBBs of
    the source polygons saved in this node and add such source polygons to the query
    result. In case the current node of the R-tree is not on the bottom layer, we
    check if each child node’s MBB has at least one common point with q and if that
    is the case, we recursively repeat the method for that node. In Figure 2 for instance,
    the MBBs of the left two blue nodes overlap. In case the query rectangle q lies
    in the area where two nodes’ MBBs overlap, we have to check the children of both
    nodes. Therefore, we need a fast building approach that minimizes overlapping
    parent nodes.


    # Building R-tree.


    There are two main ways for constructing R-trees: (i) Static building algorithms
    work by getting all data as the input and then constructing the tree with all
    data at once. (ii) Dynamic building algorithms work by inserting data one by one
    into the tree. As our datasets are not changing frequently, we focus on static
    algorithms as dynamic algorithms will require more run time for reinserting data
    to keep the R-tree balanced. Because we only query the R-tree once for every target
    geometry, the build quality (overlap) is not as important for an overall fast
    execution. To test the impact of different building algorithms, we use four static
    R-tree building algorithms (i.e., SmallestX, STR, OTM and PackedHilbertR-tree)
    and one dynamic algorithm (i.e., R*-Tree). The first static algorithm is SmallestX
    [15], which sorts the MBBs by the smallest x coordinate. The SortTileRecursive
    [16] algorithm (STR) builds the R-tree bottom-up and divides the MBBs into slices
    sorted by the x coordinate and then sorts them by the y coordinate, then recursively
    combines the parent nodes of the bottom layer. The OTM algorithm [17] works similar
    to STR, but recursively sorts the MBBs by alternating x and y coordinate with
    a top-down bulk loading approach. The last static building algorithm we use is
    the PackedHilbertR-tree [18] algorithm, which sorts the MBBs by their position
    on the Hilbert curve. On the other hand, we use the dynamic R-tree building algorithm
    R*-Tree [19], which supports inserting of new elements after creation and tries
    to minimize the area occupied by nodes. In our experiments, we insert the polygons
    one'
