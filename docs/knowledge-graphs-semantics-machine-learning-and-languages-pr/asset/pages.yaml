  md: '![](img/5368dd329bd72fa0bf97ac91d6cef632_182_0.png)


    # Figure 4. Ontologies of the TRANSRAZ Data Model


    ![](img/5368dd329bd72fa0bf97ac91d6cef632_182_1.png)


    # Figure 5. A part of the architectural object modeling within the TRANSRAZ Data
    Model


    # 3.2.1. Modeling of City Architecture


    The TOPORAZ relational database is the rich resource of the urban entities of
    the Main Market of Nuremberg. However, the representation of these entities and
    their relations is diverse and incomplete. In order to provide a comprehensive
    semantic representation of the tables in the TOPORAZ data model and further sources
    described in section 4.1, the following requirements have to be addressed:


    +   - REQ1: Architectural objects of a city are represented hierarchically. For
    example, a city consists of districts, a building consists of floors. This representation
    may include dozens of levels, describing every small part of a building (CQ4.1-2).

    +   - REQ2: Attributes of architectural objects rely on historical resources,
    thus, may be uncertain or incomplete. For example, for some buildings information
    about exact height, roof shapes, wall openings (windows, doors) and stylistic
    elements of the facade are provided, while for other buildings only the location
    area is known.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'REQ3: Architectural objects, their functions, names are highly dynamic and
    change over time, for example, buildings are destroyed, streets change their names,
    a house that used to be a pharmacy can become a store, etc (CQ3.2, CQ4.2-3).


    REQ4: Due to information dynamics, uncertainty and incompleteness of the data,
    facts require provenance annotation (CQ6.1-2, CQ6.4).


    REQ5: Architectural objects of old cities, such as Nuremberg, are also considered
    cultural heritage that can further be explored via interconnecting with other
    cultural heritage objects (CQ3.2, CQ4.3, CQ5.1).


    Research has been conducted towards the semantic representation of urban spaces
    [1,10,20], however, these ontologies are different from the architectural object
    block of the TRANSRAZ data model in their main goal – they are used to describe
    a modern city architecture. Moreover, these ontologies lack classes and properties
    to represent parts of the buildings (REQ1), and thus, are insufficient for modeling
    the level of detail required for TRANSRAZ buildings. Finally, the ontologies are
    not flexible and do not consider dynamics (REQ3), because they address urban spaces
    in real time only.


    Due to the lack of ontologies to describe historical cities, a derivation of CIDOC-CRM
    is provided with CIDOC-CRM being the core ontology of the block. CIDOC-CRM is
    event-based, which allows the representation of change (REQ3) through events.
    Also, it provides a vocabulary to represent interconnections among objects and
    events in a flexible way (REQ2). And finally, it is frequently used by GLAM institutions
    (galleries, libraries, archives, and museums) to represent diverse cultural heritage,
    which puts architectural heritage into context with the related cultural objects
    (REQ5).


    Since CIDOC-CRM does not provide an expressive semantic for modeling the structures
    of buildings and their parts, the model has been enhanced with the addition of
    self-defined classes, as e.g. transraz:BuildingPart. For readability, figure 5
    reports only part of the elements of the TRANSRAZ building block, the full modeling
    is provided on GitHub17. The information is organized around three main classes:


    +   * Class crm: E24 Physical Human Made-Man Thing allows to define subclasses
    of the architectural hierarchy and describe their components.

    +   * Class crm:E55 Type connects architectural objects and their parts with functions,
    e.g. library, bakery or sleeping room, or their types, e.g. front house, park,
    balcony. Both functions and types are completed by a set of controlled vocabularies
    developed by the domain experts during the TOPORAZ project.

    +   * Class crm:E5 Event and its subclasses, e.g. crm:E12 Production and crm:E11
    Modification, provide a description of building processes. For instance, when
    a building was built or transformed, who did it and what materials were used.


    TRANSRAZ classes are defined as subclasses of CIDOC-CRM and, thus, inherit all
    properties to specify the time of an event, the hierarchical nature of architectural
    objects, their types, functions, etc. Moreover, all architectural objects are
    associated with geographical coordinates and addresses that work as a bridge to
    connect them to the agents.


    # 3.2.2. Modeling of Historical Agents.


    One of the main goals of the TRANSRAZ project is to depict historical Nuremberg
    not only geographically, but also in its social context. Thus, the semantic representation
    of'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'its citizens and companies and their social networks is necessary. After the
    analysis of the complex and heterogeneous resources that contain information about
    persons and organizations of Nuremberg (see figure 3(a)), the following modeling
    requirements have been identified:


    +   - REQ1: Agents of a city are interconnected via different relations, which
    are of great interest to historic and genealogical research and have to be semantically
    represented (CQ1.1, CQ2.1, CQ2.3, CQ5.2).

    +   - REQ2: The descriptions of agents are often extracted from the historical
    resources, thus, may be uncertain, incomplete or even false. Thus, provenance
    annotation is required (CQ6.1-4).

    +   - REQ3: Attributes of agents, e.g. their addresses, names, occupations, etc.
    may change overtime (CQ1.1, CQ2.1-2, CQ3.1, CQ5.2).


    There exist several ontologies that specialize in description of agents from different
    perspectives. However, they are mostly focused on describing either their existence
    in the virtual world, e.g. their activities on the Web [12], or basic information
    required for postal delivery [19]. In this work, agents serve as linking points
    among the building blocks, hence, among different domain-specific ontologies.
    The DBpedia Ontology (DBO) benefits from linking to the most common ontologies,
    as e.g. SCHEMA.ORG, Wikidata, FOAF. Thus, the properties and classes from different
    vocabularies are interconnected and could simply be reused. Additionally, DBO
    contains a rich semantic representation and hierarchy of social relations, e.g.
    dbo:mother, dbo:sister, dbo:friend (REQ1). Mapping to CIDOC-CRM classes and properties,
    e.g. to CRM''s E21 Person, enables the direct use of the CIDOC-CRM''s events,
    that allow for the representation of change (REQ 3) (see figure 6).


    # 3.2.3. Modeling of Events and Changes.


    In historical research, when working with cultural data it is important to observe
    the development of entities and to keep track of changes that occur over time.
    That is why a proper semantic representation of temporal happenings is essential
    for the TRANSRAZ data model. Based on the data and data source analyses, the following
    requirements for modeling events have been established:


    +   - REQ1: Events in the TRANSRAZ model represent both social activities and
    changes of state. For example, the premier of the "Zapfenstreich" in 1907 and
    the change of address for a person or deconstruction of a building (CQ1.1, CQ2.4,
    CQ3.1-2, CQ4.2-3).

    +   - REQ2: Events of state change cover both semantic (occupation changes its
    function over time) and terminological (street is renamed) change of entities
    (CQ1.1, CQ2.2, CQ4.3).

    +   - REQ3: Events can be continuous and discreet, and thus, associated with time
    points or time intervals.'
