    executed 5 consecutive times and independently from each other, thus ensuring
    that the query instances were executed the same number of times. With the second
    configuration, we measured the performance of our system when queried by multiple
    clients. This configuration consisted of one stress test, which included one query
    instance from each template and the two non-parameterized queries (i.e., 13 queries).
