    All data statements are represented within one or more named-graph depending on
    source(s) and named graphs are connected to corresponding source(s) or responsible
    agent(s) acting on behalf of institution(s). The query for CQ7 retrieves both
    sources that directly connects to data statements and sources that are connected
    through the associated activity; hence (a|!a) expression is used. The alternative
    query to find out who/which institution makes this statement is given in the supplementary
    document.


    The answer to CQ8 is straightforward, as each research activity generating object
    provenance data is represented as an prov:Activity. Each prov:Activity is then
    connected to one or more prov:Agent, according to the PROV ontology, which can
    answer who/which institution is conducting the research.


    The query for CQ9 retrieves the associated named graph and prov:Activity responsible
    for any given statement. It lists all versions of these activities in descending
    order of execution time, and the latest version can be retrieved by specifying
    LIMIT 1.


    In conclusion, we demonstrate that the proposed model can answer all nine questions,
    although some of them are too broad and require further interpretation to be answered
    through SPARQL queries.


    # 6. Discussion


    The query results and the implementation of real-world object provenance (both
    from seen and unseen report) confirm that the combination of CIDOC-CRM, PROV-DM
    and named graphs can be used to model the representation of object and data provenance.
    Technologically, we did not observe particular obstacles in representing ethnographic
    cultural heritage objects’ provenance information in an interoperable manner.
    Nonetheless, it is essential to note that provenance research produces a mass
    of information; thus, unstructured data, i.e., written narrative report on a single
    object’s biography may contain richer information. Additionally, there will always
    be a trade-off between expressivity and efficiency in digital humanities. Therefore,
    the representation of object provenance in a Knowledge Graph might not contain
    all the information recorded in the textual format regarding the provenance of
    an object. However, because the model supports representations of complicated
    networks between objects, people, places, and events utilizing the model, it projects
    an valuable overview to contextualize objects.


    The provenance report summary can mostly be recorded using our model; however,
    we would like to highlight the interesting findings including the limitations
    and challenges encountered when modeling evaluation objects. Actor background
    and biography were not part of the ontology scope. The collection’s context was
    preserved through historical events, dates, places of collection, and form of
    acquisition. Nevertheless, the textual narrative may provide additional information.
    The model does not distinguish between current custodian and current possessor
    and does not address predecessor relationships between organizations, such as
    mergers or renaming. These issues are beyond the scope of this paper and would
    require a deeper understanding of domain needs.


    Polyvocality, observed through various theories of origin and acquisition, is
    crucial in determining the provenance of cultural heritage objects. Although the
    model supports polyvocal information representation, it does not prioritize one
    theory over another, es-'
