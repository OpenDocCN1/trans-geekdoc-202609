  md: 'Listing 3.18 displays the contents of the shell script multiple-delims.sh that
    transforms multiple-delims2.dat into the dataset multiple-delims2b.dat, where
    the latter dataset has only a comma \,” as a delimiter between columns in every
    row.


    # LISTING 3.18: multiple-delims2.dat


    ```

    inputfile="multiple-delims2.dat"

    cat $inputfile | sed -e ''s/,/,/'' -e ''s/|/|'' -e ''s\\/\\/g''

    ```


    Listing 3.18 specifies the name of a text file whose contents are “piped” to the
    Unix sed command that replaces all occurrences of the characters “,” and “^|”
    with a comma \“. The trailing g in the sed command ensures that the replacement
    is performed globally. The resulting output will contain only a “,” as a delimiter
    (shown in Listing 3.19).


    Open a command and navigate to the directory that contains the shell script in
    Listing 3.18 and execute the following pair of commands:


    ```

    chmod +x multiple-delims2.sh

    ./multiple-delims2.sh > multiple-delims2b.dat

    ```


    Listing 3.19 displays the contents of multiple-delims2b.dat that you created in
    the preceding step.


    # LISTING 3.19: multiple-delims2b.dat


    ```

    1000, Jane, Edwards, Sales

    2000, Tom, Smith, Development

    3000, Dave, Del Ray, Marketing

    4000, Steven, Andrews, Marketing

    ```'
