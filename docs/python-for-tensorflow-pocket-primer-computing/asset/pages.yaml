  md: 'Simple linear regression finds the best fitting line that “represents” a dataset,
    but what happens if the dataset does not fit a line in the plane? This is an important
    question. In such a scenario, we look for other curves to approximate the dataset,
    such as a quadratic, cubic, or higher-degree polynomials. However, these alternatives
    involve trade-offs, as we''ll discuss later.


    Another possibility is to use a continuous piecewise linear function, which is
    a function that comprises a set of line segments, where adjacent line segments
    are connected. If one or more pairs of adjacent segments are not connected, then
    it is a piecewise linear function (i.e., the function is discontinuous). In either
    case, line segments have degree one, which involves lower computational complexity
    than higher order polynomials.


    Thus, given a set of points in the plane, try to find the “best fitting” line
    that “represents” those points, after addressing the following questions:


    +   1. How do we know that a line “fits” the data?

    2. What if a different type of curve is a better fit?

    3. What does “best fit” mean?


    One way to check if a line fits the data well is through a simple visual check:
    display the data in a graph and if the data “conforms” to the shape of a line
    reasonably well, then a line might be a good fit. However, this is a subjective
    decision, and a sample dataset that does not fit a line is displayed in Figure
    2.7.


    Figure 2.7 displays a dataset containing four points that do not fit a line.'
