    # WHAT ARE LAMBDA EXPRESSIONS?


    In brief, a lambda expression is an anonymous function. Use lambda expressions
    to define local functions that can be passed as arguments or returned as the value
    of function calls.


    Informally, a lambda expression takes an input variable and performs some type
    of operation (specified by you) on that variable. For example, here is a "bare
    bones" lambda expression that adds the number 1 to an input variable x:


    ```

    lambda x: x + 1

    ```


    You can use the preceding lambda expression in a valid TensorFlow code snippet,
    as shown here (dx is a TensorFlow Dataset that is defined elsewhere):


    ```

    dx.map(lambda x: x + 1)

    ```


