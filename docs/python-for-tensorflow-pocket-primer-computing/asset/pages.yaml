- pgno: 319
  md: 'The tf.layers namespace contains an assortment of classes for the layers in
    Neural Networks, including DNNs (Dense Neural Networks) and CNNs (Convolutional
    Neural Networks). Some of the more common classes in the tf.layers namespace are
    listed below:


    +   - BatchNormalization: Batch Normalization layer

    - Conv2D: 2D convolution layer (e.g., spatial convolution images)

    - Dense: Dense-connected layer class

    - Dropout: Applies Dropout to the input

    - Flatten: Flattens an input tensor while preserving the batch axis (axis 0)

    - Layer: Base layer class

    - MaxPooling2D: Max pooling layer for 2D inputs (e.g., images)


    For example, a minimalistic CNN starts with a “triple” that consists of a Conv2D
    layer, followed by ReLU (Rectified Linear Unit) activation function, and then
    a MaxPooling2D layer. If you see this triple appear a second time, followed by
    two consecutive Dense layers and then a softmax activation function, it is known
    as “LeNet.”


    A bit of trivia: in the late 1990s, when people deposited checks at an automated
    bank machine, LeNet scanned the contents of those checks to determine the digits
    of the check amount (of course, customers had to confirm the number determined
    by LeNet was correct). LeNet had an accuracy rate around 90%, which is a very
    impressive result for such a simple Convolutional Neural Network!


