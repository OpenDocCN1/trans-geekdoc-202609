    # TRANSFORMING DATA WITH THE SED COMMAND (OPTIONAL)


    The preceding section contains an example of a data file with different delimiters,
    but there is a limitation: the first set of rows must have the same type and the
    second set of rows must also be of the same type.


    However, you might have a more heterogeneous dataset with a set of rows in random
    order, where each row contains multiple delimiters. The solution in this section
    involves three files: an initial randomized dataset multiple-delims2.dat, a shell
    script multiple-delims2b.sh for creating a “clean” dataset called multiple-delims2b.dat,
    and a Python script multiple-delims2b.py that reads the data in multiple-delims2b.dat
    into a Pandas DataFrame.


    Listing 3.17 displays the contents of multiple-delims2.dat that contains a mixture
    of delimiters in multiple rows (in random order).


    # LISTING 3.17: multiple-delims2.dat


