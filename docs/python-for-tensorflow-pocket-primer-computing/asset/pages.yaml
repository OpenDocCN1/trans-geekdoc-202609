- pgno: 19
  md: '# INTRODUCTION TO PYTHON


    This chapter provides a fast-paced introduction to Python, along with tools for
    installing Python modules, and examples of how to work with some data types in
    Python. This chapter does not contain any historical information about Python,
    nor topics such as creating Python class, inheritance, threads, or any other topics
    that are beyond introductory material. The reason is simple: the purpose of this
    chapter is to familiarize you with enough Python so that you can learn the material
    in subsequent chapters.


    The first part of this chapter covers the installation of Python, some Python
    environment variables, and how to use the Python interpreter. You will see Python
    code samples and also how to save Python code in text files that you can launch
    from the command line. The second part of this chapter shows you how to work with
    simple data types, such as numbers, fractions, and strings. The final part of
    this chapter discusses exceptions and how to use them in Python scripts.


    If you like to read documentation, one of the best third party documentation publications
    is pymotw (“Python Module of the Week”) by Doug Hellman, and his home page is:


    http://pymotw.com/2/


    > NOTE The Python scripts in this book are for Python 2.7.5 and although most
    of them are probably compatible with Python 2.6, these scripts require a modest
    degree of conversion (e.g., the syntax of the print() command) in order to be
    compatible with Python 3.


    # TOOLS FOR PYTHON'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The Anaconda Python distribution is available for Windows, Linux, and Mac,
    and it is downloadable here:

    http://continuum.io/downloads


    Anaconda is well suited for modules such as NumPy and SciPy (discussed in Chapter
    2 and Chapter 4), and if you are a Windows user, Anaconda appears to be a better
    alternative.


    # easy_install and pip


    Both easy_install and pip are very easy to use when you need to install Python
    modules.


    Whenever you need to install a Python module (and there are many in this book),
    use easy_install or pip with the following syntax:


    ```

    easy_install <module-name>

    pip install <module-name>

    ```


    > **NOTE** Python-based modules are easier to install, whereas modules with code
    written in C are usually faster but more difficult in terms of installation.


    # virtualenv


    The virtualenv tool enables you to create isolated Python environments, and its
    home page is here:

    http://virtualenv.org/en/latest/virtualenv.html

    virtualenv addresses the problem of preserving the correct dependencies and versions
    (and indirectly, permissions) for different applications. If you are a Python
    novice you might not need virtualenv right now, but keep this tool in mind.


    # IPython


    Another very good tool is IPython (which won a Jolt award), and its home page
    is here:'
  merge: -1
  img_proc: true
