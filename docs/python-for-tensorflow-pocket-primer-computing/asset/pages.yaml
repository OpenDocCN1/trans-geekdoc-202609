    # FIGURE 2.7 A Non-Linear Dataset.


    On the other hand, if a line does not appear to be a good fit for the data, then
    perhaps a quadratic or cubic (or even higher degree) polynomial has the potential
    of being a better fit. Let us defer the non-linear scenario and make the assumption
    that a line would be a good fit for the data. There is a well-known technique
    for finding the “best fitting” line for such a dataset, and it is called Mean
    Squared Error (MSE).


    # THE MSE (MEAN SQUARED ERROR) FORMULA


    Figure 2.8 displays the formula for the MSE. Translated into English: the MSE
    is the sum of the squares of the difference between an actual y value and the
    predicted y value (where the latter is the y value that each data point would
    have if that data point were actually on the best fitting line).'
