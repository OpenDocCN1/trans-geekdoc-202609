  md: 'The tf.estimator namespace contains an assortment of classes that implement
    various algorithms that are available in Machine Learning, such as boosted trees,
    DNN classifiers, DNN regressors, linear classifiers, and linear regressors.


    The estimator-related classes DNNRegressor, LinearRegressor, and DNNLinearCombinedRegressor
    are for regression tasks, whereas the classes DNNClassifier, LinearClassifier,
