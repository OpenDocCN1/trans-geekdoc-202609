  md: '# TENSORFLOW RAGGED CONSTANTS AND TENSORS

    (OPTIONAL)


    The section is marked “optional” because the code samples require TF 2. If you
    launch the code samples using TF 1.x, you will see the following error message:


    AttributeError: ''module'' object has no attribute ''RaggedTensor''


    As you probably know, every element in a multidimensional array has the same dimensions.
    For example, a 2x3 array contains two rows and three columns: each row is a 1x3
    vector. As another example, a 2x34 array contains two 3x4 arrays (and the same
    logic applies to each 3x4 array).


    On the other hand, a ragged constant is a set of elements that have different
    lengths. You can think of ragged constants as a generalization of “regular” datasets.


    Listing 6.2 displays the contents of tf-raggedtensors1.py that illustrates how
    to define a ragged dataset and then iterate through its contents.


    # LISTING 6.2: tf-raggedtensors1.py


    ```

    import tensorflow as tf

    digits = tf.ragged.constant([[3, 1, 4, 1], []], [5, 9, 2], [6], []])

    words = tf.ragged.constant(["Bye", "now"],

    ["thank", "you", "again", "sir\]])


    print(tf.add(digits, 3))

    print(tf.reduce_mean(digits, axis=1))

    print(tf.concat([digits, [[5, 3]]], axis=0))

    print(tf.tile(digits, [1, 2]))

    print(tf.strings.substr(words, 0, 2))

    ```'
