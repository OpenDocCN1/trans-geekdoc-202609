    # WHAT IS A TFRECORD?


    A TFRecord is a file that describes the data required during the training phase
    and the testing phase of a model. There are two protocol buffer message types
    available for a TFRecord: the SequenceExample Example message type. These protocol
    buffer message types enable you to arrange data as a map from string keys to values
    that are lists of integers, 32-bit floats, or bytes.


    The data in a TFRecord is “wrapped” inside a Feature class. In addition, each
    feature is stored in a key value pair, where the key'
  merge: -1
  img_proc: true
- pgno: 321
  md: "corresponds to the title that is allotted to each feature. These titles are\
    \ used later for extracting the data from TFRecord. The created dictionary is\
    \ passed as input to a Feature class. Finally, the features object is passed as\
    \ input to Example class that is appended into the TFRecord. The preceding process\
    \ is repeated for every type of data that is stored in TFRecord.\n\nThe TFRecord\
    \ file is a record-oriented binary format that you can use for training data.\
    \ In addition, the tf.data.TFRecordDataset class enables you to stream over the\
    \ contents of one or more TFRecord files as part of an input pipeline.\n\nYou\
    \ can store any type of data, including images, in the Example format. However,\
    \ you specify the mechanism for arranging the data into serialized bytes, as well\
    \ as reconstructing the original format.\n\n# A Simple TFRecord\n\nListing 6.29\
    \ displays the contents of tf-record1.py illustrates how to define a TFRecord.\n\
    \nLISTING 6.29: tf-record1.py\n\n```\nimport tensorflow as tf\n\nsimple1 = tf.train.Example(features=tf.train.Features(feature={\n\
    \  'my_ints':\n  tf.train.Feature(int64_list=tf.train.Int64List(value=[2, 5])),\n\
    \  'my_float':\n  tf.train.Feature(float_list=tf.train.FloatList(value=[3.6])),\n\
    \  'my_bytes':\n  tf.train.Feature(bytes_list=tf.train.BytesList(value=['data']))\n\
    })))))\n```"
