  md: '# WHAT IS JUPY?


    The Jupyter Notebook is an open-source Web application for creating and sharing
    documents. Moreover, such documents can contain a combination of code, equations,
    visualizations, and text. The Jupyter home page is here:


    http://jupyter.org/


    Jupyter is popular among data scientists, Python developers, and even physicists
    because it simplifies the sharing of code. Moreover, Google Colaboratory (later
    in this chapter) supports Jupyter notebooks, along with some extra functionality.


    First let us take a look at Jupyter features that are discussed in the next section.


    # Jupyter Features


    Jupyter has gained significant traction among various communities because of its
    ease of use and useful functionality. Some of the features of Jupyter include:


    +   - support for multiple programming languages

    - support for Python2 and Python3

    - sharing notebooks

    - importing notebooks

    - download notebooks

    - produce different types of output

    - big data integration

    - multi-user version

    - manage users and authentication


    In particular, the Jupyter Notebook supports more than 40 programming languages,
    including Python, R, Julia, and Scala. Notebooks can be easily shared via email,
    Dropbox, GitHub, and the Jupyter Notebook Viewer. Jupyter notebooks support interactive
    output that contains a combination of HTML, images, videos, LaTeX, and custom
    MIME types.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'In addition Jupyter notebooks support big data integration, such as Apache
    Spark, where the data has been generated from Python, R, and Scala. A multi-user
    version of the Jupyter notebook is also available, and it is designed for companies,
    classrooms, and research labs. You can also manage multiple users and authentication
    with OAuth, and easily deploy the Jupyter Notebook to all the users in your organization.


    # Launching Jupyter from the Command Line


    Launching Jupyter from the command line is straightforward. First open a command
    shell, then navigate to the directory that contains the Jupyter notebook basic-stuff.ipynb,
    and then launch Jupyter with this command:


    ```

    jupyter notebook

    ```


    After a few moments a new browser session is automatically opened and you will
    see a list of the files in the current directory.


    # JupyterLab


    JupyterLab is an interactive development environment for notebooks, code and data,
    that fully supports Jupyter notebooks. JupyterLab also enables you to use text
    editors, terminals, data file viewers, and custom components side by side with
    notebooks in a tabbed work area.


    JupyterLab provides a high level of integration between notebooks,-documents,
    and activities, including:


    +   - Drag-and-drop to reorder notebook cells and copy them between -notebooks.

    - Run code blocks interactively from text files (.py, .R, .md, .tex, etc.).

    - Link a code console to a notebook kernel to explore code interactively without
    cluttering up the notebook with'
