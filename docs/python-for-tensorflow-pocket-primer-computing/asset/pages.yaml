    # WHAT ARE ITERATORS?


    An iterator is similar to a “cursor” in other languages. You can think of an iterator
    as something that “points” to an item in a dataset. By way of analogy, if you
    have a linked list of items, an iterator is analogous to a pointer that “points”
    to the first element in the list, and each time you move the pointer to the next
    item in the list, you are “advancing” the iterator.

    Working with datasets and iterators involves the following steps:


    +   1. create a dataset

    2. create an iterator (see next section)

    3. “point” the iterator to the dataset

    4. print the contents of the current item

    5. “advance” the iterator to the next item

    6. go to step 4 if there are more items


    Notice that Step 6 specifies “if there are more items,” which you can handle via
    a try/except block (shown later in this chapter) when the iterator goes beyond
    the last item in the dataset. This technique is very useful because it obviates
    the need to know the number of items in a dataset. TensorFlow provides several
    types of iterators, as discussed in the next section.


    # TensorFlow Iterators'
