- pgno: 97
  md: '# $MSE = \frac{1}{n} \sum_{i=1}^{n}(Y_i - \hat{Y}_i)^2$.


    **Figure 2.8** The MSE Formula.


    Figure 2.8 displays the formula for MSE (Mean Squared Error) for calculating the
    best fitting line for a set of points in the plane.


    # Other Error Types


    Although we will only discuss MSE for linear regression in this book, there are
    other types of formulas that you can use for linear regression, some of which
    are listed here:


    +   - MSE

    - RMSE

    - RMSProp

    - MAE


    The MSE is the basis for the preceding error types. For example, RMSE is “Root
    Mean Squared Error,” which is the square root of MSE.


    On the other hand, MAE is “Mean Absolute Error,” which is the absolute value of
    the sum of the differences of the y terms (not the square of the differences of
    the y terms).


    The RMSProp optimizer utilizes the magnitude of recent gradients to normalize
    the gradients. Maintain a moving average over the RMSE (“root mean squared,” which
    is the square root of the (MSE) gradients, and then divide that term by the current
    gradient.


    Although it is easier to compute the derivative of MSE (because it is a differentiable
    function), it is also true that MSE is more susceptible to outliers, more than
    so MAE. The reason is simple: a squared term can be significantly larger than
    adding the absolute value of a term. For example, if a difference term is 10,
    then the squared term 100 is added to MSE, whereas only 10 is added to'
