- pgno: 22
  md: 'The next section shows you how to check whether or not Python is installed
    on your machine, and also where you can download Python.


    # PYTHON INSTALLATION


    Before you download anything, check if you have Python already installed on your
    machine (which is likely if you have a Macbook or a Linux machine) by typing the
    following command in a command shell:


    ```

    python -V

    ```


    The output for the Macbook used in this book is here:


    Python 2.7.5 :: Anaconda 1.6.1 (x86_64)


    > **NOTE** Install Python 2.7.5 (or as close as possible to this version) on your
    machine so that you will have the same version of Python that was used to test
    the Python scripts in this book.


    If you need to install Python on your machine, navigate to the Python home page
    and select the download link or navigate directly to this website:


    http://www.python.org/download/


    In addition, PythonWin is available for Windows, and its home page is here:


    http://www.cgl.ucsf.edu/Outreach/pc204/pythonwin.html


    Use any text editor to create, edit, and save Python scripts and save them as
    plain text files (don''t use Microsoft Word).


    After you have Python installed and configured on your machine, you are ready
    to work with the Python scripts in this book.


    # SETTING THE PATH ENVIRONMENT VARIABLE (WINDOWS ONLY)'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The PATH environment variable specifies a list of directories that are searched
    whenever you specify an executable program from the command line. A very good
    guide to setting up your environment so that the Python executable is always available
    in every command shell is in the following instructions:


    http://www.blog.pythonlibrary.org/2011/11/24/python-101-setting-up-python-on-windows/


    # LAUNCHING PYTHON ON YOUR MACHINE


    There are three different ways to launch Python:


    +   * Use the Python Interactive Interpreter

    * Launch Python scripts from the command line

    * Use an IDE


    The next section shows you how to launch the Python interpreter from the command
    line, and later in this chapter you will learn how to launch Python scripts from
    the command line and also about Python IDEs.


    > NOTE The emphasis in this book is to launch Python scripts from the command
    line or to enter code in the Python interpreter.


    # The Python Interactive Interpreter


    Launch the Python interactive interpreter from the command line by opening a command
    shell and typing the following command:


    ```

    python

    ```


    You will see the following prompt (or something similar):


    Python 2.7.5 |Anaconda 1.6.1 (x86_64)| (default, Jun 28 2013, 22:20:13)'
  merge: -1
  img_proc: true
