    A TensorFlow constant is an immutable value, and a simple example is shown here:


    ```

    aconst = tf.constant(3.0)

    ```


    A TensorFlow placeholder allocates space for data, and it’s somewhat analogous
    to a “buffer” in other languages as C. The really nice aspect of TF placeholders
    is that you do not need to specify their shape: they “automagically” assume the
    shape of the data that is assigned to them. A simple example of a TensorFlow placeholder
    is shown here:


    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    ```


    You can see in the preceding code block, c is defined as the product of a and
    b, which do not have a value. Use a feed_dict to assign values to placeholder,
    as shown here:


    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    ```


    ```

    # assign values to a and b:

    feed_dict = {a:2, b:3}

    ```


    The calculation of c itself is shown later in the section that discusses TF sessions.


    A TensorFlow variable is a “trainable value” in a TensorFlow graph. For example,
    the slope m and y-intercept b of a best-fitting'
