- pgno: 15
  md: '# PREFACE


    # WHAT IS THE GOAL?


    The goal of this book is to show advanced beginners code samples in various Python
    libraries that are useful for TensorFlow programs written in Python. The first
    four chapters contain Python-related material, and the fifth chapter gives you
    an introduction to TensorFlow. However, the fifth chapter does not contain any
    code samples that show you how to solve machine learning problems (such as linear
    regression, logistic regression, and so forth) in TensorFlow.


    The material in this book is primarily for those who have some programming experience,
    and not really suitable for “absolute beginners.\$ It is suitable as a fast-paced
    introduction to various “core” features. The purpose of the material in the chapters
    is to illustrate how to solve a variety of tasks, after which you can do further
    reading to deepen your knowledge.


    # THIS BOOK IS FOR ME AND WHAT I WILL LEARN?


    This book is intended for software developers who are advanced beginners (perhaps
    also intermediate-level developers). You need some familiarity with working from
    the command line in a Unix-like environment. However, there are subjective prerequisites,
    such as a strong desire to learn how to write TensorFlow programs, along with
    the motivation and discipline to read and understand the code samples.


    If you are adequately prepared and motivated, then in Chapter 5 you will learn
    how to write basic TensorFlow programs.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'This book saves you the time to search for relevant code samples, adapting
    them to your specific needs, which is a potentially time-consuming process. In
    any case, if you''re not sure whether or not you can absorb the material in this
    book, glance through the code samples to get a feel for the level of complexity.


    # HOW WERE THE CODE SAMPLES CREATED?


    The code samples in this book were created and tested using bash on a Macbook
    Pro with OS X 10.12.6 (MacOS Sierra). Regarding their content: the code samples
    are derived primarily from the author, and in some cases there are code samples
    that incorporate short sections of code from discussions in online forums. The
    key point to remember is that the overwhelming majority of the code samples follow
    the “Four Cs": they must be Clear, Concise, Complete, and Correct to the extent
    that it''s possible to do, given the size of this book.


    Companion files for this title are available by writing to the publisher at info@merclearning.com.


    # WHICH TOPICS ARE EXCLUDED?


    This book does not cover Python-related topics that are not helpful for learning
    the fundamentals of TensorFlow 1.x (and there are many such topics). However,
    there is a follow-up book that does contain code samples for machine learning
    in TensorFlow 1.x and Python, and the title of that book is the TensorFlow Pocket
    Primer.


    # DO I NEED EVERYTHING IN THIS BOOK TO LEARN TENSORFLOW?


    No. There are sections in Chapter 4 (such as the material pertaining to Seaborn)
    that you could skip and proceed to TensorFlow. However, the “extra” topics are
    included because you will probably encounter them in the future. So, even though
    this'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'book is primarily intended to prepare you for learning TensorFlow, there is
    some material that may be relevant if you decide to learn about machine learning
    with Python instead of TensorFlow.


    # HOW DO I SET UP A COMMAND SHELL?


    If you are a Mac user, there are three ways to do so. The first method is to use
    Finder to navigate to Applications > Utilities and then double click on the Utilities
    application. Next, if you already have a command shell available, you can launch
    a new command shell by typing the following command:

    open /Applications/Utilities/Terminal.app


    A second method for Mac users is to open a new command shell on a Macbook from
    a command shell that is already visible simply by clicking+n in that command shell,
    and your Mac will launch another command shell.


    If you are a PC user, you can install Cygwin (open source https://cygwin.com/)
    that simulates bash commands, or use another toolkit like MKS (a commercial product).
    Please read the online documentation that describes the download and installation
    process. Note that custom aliases are not automatically set if they are defined
    in a file other than the main start-up file (such as .bash_login).


    # WHAT ARE THE “NEXT STEPS” AFTER FINISHING THIS?


    The answer to this question varies widely, mainly because the answer depends heavily
    on your objectives. The best answer is to try out a new tool or technique from
    the book on a problem you care about, professionally or personally. Precisely
    what that might be depends on what you do, as the needs of a data scientist, manager,
    student, or developer are all different. In addition, keep what you learned in
    mind as you tackle a new data cleaning or manipulation challenges. Sometimes knowing
    that a technique is possible, finding a solution easier, even if you have to re-read
    the section to remember exactly how the syntax works.'
  merge: -1
  img_proc: true
