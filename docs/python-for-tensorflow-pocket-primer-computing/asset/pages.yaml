    In case you are wondering, the confusion matrix displays the number of predictions
    for a given class. For instance, the value in position (1,1) of the confusion
    matrix displays the number of items that were correctly predicted to be in class
    1. However, the value in position (1,2) displays the number of items that were
    incorrectly predicted to belong to class 1 in reality they belong to class 2.
    In general, if A is an nxn confusion matrix, the diagonal values display the number
    of correct predictions, whereas the number in a non diagonal entry (i, j) displays
    the number of items that belong to class i, but whose prediction is that they
    belong to class j.


