    on the value of x (which equals 2), and the value of the variable lm depends on
    the values of w, x, and b. Both z and lm are evaluated inside a TensorFlow "session"
    block, as shown in a later section.


    # TENSORFLOW GRAPHS


    Whenever you define TensorFlow code in a Python script, you will often use some
    combination of TF data types and other TF constructs. Before executing TensorFlow
    code, TensorFlow generates a graph structure that is based on the constants, placeholders,
    and variables that you have defined. A typical TensorFlow graph consists of the
    following:


    +   - Graph: graph of operations (DAG)

    - Sessions: contains Graph(s)

    - lazy execution (default)

    - operations in parallel (default)

    - Nodes: operators/variables/constants

    - Edges: tensors


    TensorFlow graphs are split into subgraphs and executed in parallel (or multiple
    CPUs)'
