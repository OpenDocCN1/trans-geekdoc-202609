    # TensorFlow Architecture (High View)


    TensorFlow consists of two main components: 1) a graph

    protocol buffer, and 2) a runtime to execute (distributed) graph that

    is analogous to Python code and the Python interpreter. TensorFlow

    is written in C++ and supports various graph-based operations

    involving primitive values and so-called tensors (discussed later).


    TensorFlow creates a “computation” graph for numerical

    computation and data flow, with the notion that “everything is a

    graph.” Graph and data visualization is handled via TensorBoard

    (discussed later). As you will

    see in the code samples in this book, TensorFlow APIs are available

    in Python and can therefore be embedded in Python scripts.


    The default execution mode for TF 1.x is deferred execution,

    whereas TF 2 uses eager execution (think “immediate mode”).

    Although TF 1.4 introduced eager execution, the vast majority of TF

    1.x code samples that you will find use deferred execution.

    TensorFlow supports arithmetic operations on tensors (i.e.,

    multidimensional arrays (with enhancements)) as well as conditional

    logic and while loops.


    TensorFlow provides a “checkpoint” API to save TensorFlow

    ggraphs and restore them at a later point. In addition, you can view'
