    # Non-Linear Least Squares


    When predicting housing prices, where the dataset contains a wide range of values,
    techniques such as linear regression or random forests can cause the model to
    “overfit” the samples with the highest values in order to reduce quantities such
    as mean absolute error.


    In this scenario, you probably want an error metric, such as relative error, which
    reduces the importance of fitting the samples with the largest values. This technique
    is called non-linear least squares, which may use a log-based transformation of
    labels and predicted values.


