- pgno: 283
  md: 'TensorFlow supports four types of iterators, as listed here:


    +   1. One-shot

    2. Initializable

    3. Reinitizable

    4. Feedable


    A one-shot iterator can iterate only once through a dataset. After we reach the
    end of the dataset, the iterator will no longer yield elements; instead, it will
    raise an Exception. For example, if dx is an instance of tf.data.Dataset, then
    the following code snippet defines a one-shot iterator:


    ```

    iterator = dx.make_one_shot_iterator()

    ```


    An initializable iterator can be dynamically updated: invoke its initializer operation
    and pass new data via the parameter feed_dict. If dx is an instance of tf.data.Dataset,
    then the following code snippet defines a reusable iterator:


    ```

    iterator = dx.make_initializable_iterator()

    ```


    A reinitializable iterator can be initialized from a different Dataset. This type
    of iterator is very useful when training datasets that require some additional
    transformation, such as shuffling its contents.


    A feedable iterator allows you to select from different iterators: this type of
    iterator is essentially a “selector” to select an iterator from a collection of
    iterators.


    The code samples in this chapter involve either one-shot iterators or initializable
    iterators. The next section contains a code sample that illustrates how to define
    a TF Dataset and a reusable iterator in TensorFlow.


    # TENSORFLOW REITERATORS'
