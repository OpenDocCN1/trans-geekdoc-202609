    # VARIABLES IN TENSORFLOW (REVISITED)


    In addition to constants and placeholders that are described earlier in this chapter,
    TensorFlow supports variables. Variables can be updated during backward error
    propagation (also called “backprop” that is discussed later). TF variables can
    also be saved in a graph and then restored at a later point in time.


    TensorFlow also provides the method tf.assign() in order to modify values of TF
    variables. The following list contains some properties of TensorFlow variables:


    +   * initial value is optional

    * must be initialized before graph execution

    * updated during training

    * constantly recomputed

    * they hold values for weights and biases

    * in-memory buffer (saved/restored from disk)


    Here are some examples of TensorFlow variables:


    ```

    b = tf.Variable(3, name=''b'')

    ```'
