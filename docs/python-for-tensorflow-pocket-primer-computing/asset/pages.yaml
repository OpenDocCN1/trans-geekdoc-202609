    # WHAT IS LINEAR REGRESSION?


    Linear regression finds the equation of the best fitting hyperplane that approximates
    a dataset, where a hyperplane has degree one less than the dimensionality of the
    dataset. In particular, if the dataset is in the Euclidean plane, the hyperplane
    is simply a line; if the dataset is in 3D the hyperplane is a “regular” plane.


    Linear regression is suitable when the points in a dataset are distributed in
    such a way that they can reasonably be approximated by a hyperplane. If not, then
    you can try to fit other types of surfaces to the points in the dataset.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Keep in mind two other details. First, the best fitting hyperplane does not
    necessarily intersect all (or even most of) the points in the dataset. In fact,
    the best fitting hyperplane might not intersect any points in the dataset. The
    purpose of a best fitting hyperplane is to approximate the points in a dataset
    as closely as possible. Second, linear regression is not the same as curve fitting,
    which attempts to find a polynomial that passes through a set of points.


    Some details about curve fitting: given n points in the plane (no two which have
    the same x value), there is a polynomial of degree less than or equal to n that
    passes through those points. Thus, a line (which has degree one) will pass through
    any pair of non-vertical points in the plane. For any triple of non-collinear
    points in the plane, there is a quadratic equation or a line that passes through
    those points.


    In some cases a lower degree polynomial is available. In instance, consider the
    set of 100 points in which the x value equals the y value: clearly the line y
    = x (a polynomial of degree one) passes through all of those points.


    However, keep in mind that the extent to which a line “represents” a set of points
    in the plane depends on how closely those points can be approximated by a line.


    # What is Multivariate Analysis?


    Multivariate analysis generalizes the equation of a line in the Euclidean plane,
    and it has the following form:


    ```

    y = w1*x1 + w2*x2 + ... + wn*xn + b

    ```


    As you can see, the preceding equation contains a linear combination of the variables
    x1, x2, ..., xn. In this book we will usually work with datasets that involve
    lines in the Euclidean plane.


    # What about Non-Linear Datasets?'
