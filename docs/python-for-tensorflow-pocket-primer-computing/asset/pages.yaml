    # TENSORFLOW DATASETS


    TensorFlow Datasets (accessible via the namespace tf.data.Dataset) are well suited
    for creating asynchronous and optimized data pipelines. In brief, the TF Dataset
    API loads data from the disk (both images and text), applies optimized transformations,
    creates batches, and sends the batches to the GPU. Hence, the TF Dataset API is
    good for better GPU utilization. In addition, use tf.functions in TF 2.0 to fully
    utilize dataset asynchronous prefetching/streaming features.


    A TF Dataset acts as a container-like “wrapper” around a dataset, somewhat analogous
    to a Pandas DataFrame. A very large dataset can also represent an input pipeline
    as a collection of elements (i.e., a nested structure of tensors), along with
    a “logical plan” of transformations that act on those elements. For example, you
    can define a TF Dataset that initially contains the lines of text in a text file,
    then extract the lines of text that start with a “#” character, and then display
    only the first three lines. Creating this pipeline is easy: create a TF Dataset
    and then chain the lazy operators filter() and take(), which is similar to an
    example you will see later in this chapter.


    # Basic Steps for TensorFlow Datasets


    Perform the following three steps to create and process the contents of a TF Dataset:


    +   1. Import Data'
