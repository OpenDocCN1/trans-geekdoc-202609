    month in which any service level has not been attained by Provider.


    These are obviously rough examples, but they demonstrate the relationship between
    the contract, the SLA, the cloud provider and the cloud customer. The book will
    continually refer to the contract and the SLA based on the relationship explained
    here.


    # Related and Emerging Technologies


    It is worth mentioning some emerging and related technologies. These technologies
    are explicitly listed in the (ISC)² Exam Outline, and therefore of concern to
    the CCSP candidate.


    +   - Machine learning and artificial intelligence (AI): Machine learning and
    AI both refer to the concepts of machines and beings being able to learn, process,
    correlate, and interpret information and apply that in various capabilities without
    needing direct input from users or programmers. A wide variety of IT and cloud
    products and services claim to have machine learning or AI capabilities. These
    include firewalls, intrusion detection/prevention systems (IDSs/IPSs), antivirus
    solutions, and so.


    +   - Blockchain: Blockchain is one method of conveying value using encryption
    techniques and algorithms. It is often referred to as "cryptocurrency." It is
    basically a transactional ledger, where all participants can view every transaction,
    making it extremely difficult to negate the integrity of transactions. Blockchain
    can be perceived as a cloud technology because each record ("block") is distributed
    among all participants, regardless of location, type of device, jurisdiction,
    and so in distributed, or cloud-based, manner.


    +   - Internet of Things (IoT): It is sometimes like every possible product now
    contains Internet connectivity: household appliances, cameras, toys, vehicles,
    and so. This is collectively referred to as the Internet of Things (IoT). The
    distributed nature of these devices (and their connection to networks) lends them
    some cloud characteristics. Perhaps the most security aspect of IoT is that devices
    without proper security can be subverted and used in attacks.


    +   - Containers: This refers to the logical segmentation of memory space in a
    device, creating two or more abstract areas that cannot interface directly. This
    is commonly seen in bring own device (BYOD) environments where employees use their
    personal devices for work. The containers distinguish two partitions—one for work
    functions/data and the other for personal functions/data. This gives the employer/data
    owner additional assurance that the data will not be accidentally or casually
    lost or stolen.'
