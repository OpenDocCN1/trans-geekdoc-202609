    # Cloud-Secure Software Development Lifecycle (SDLC)


    The cloud-secure software development lifecycle (SDLC) has the same foundational
    structure as the traditional SDLC, although there are some factors when dealing
    with the cloud that needs to be taken into account. Just like data, software has
    a useful lifecycle based on phases of development and use (see Figure 7.2). Although
    the name and number of stages can be debated, they generally include the following
    core stages (although some models forego secure operations and disposal use slightly
    different names for the stages):


    +   1. Defining

    2. Designing

    3. Development

    4. Testing

    5. Secure Operations

    6. Disposal


