- pgno: 169
  md: '# Chapter 6 ■ Responsibilities in the Cloud


    policy. This is particularly important for creating and maintaining a secure hypervisor
    configuration—a weak hypervisor could allow malicious actors to access and attack
    the virtual assets and a great deal of the production data.


    Secure Configuration of Various Virtualized Elements In addition to the tangible
    hardware used in the data center, any virtual elements must also be configured
    in a secure fashion to attenuate risks such as data leakage and malicious aggregation.
    This is not limited to virtual hosts and OSs, but it should also include any virtualized
    networking or storage assets.


    # Cloud Provider Responsibilities: Secure Networking


    Of course, in addition to securing the hardware and logical configurations, the
    provider will have to ensure that the networking architecture and components are
    secure. This will often involve many of the same tactics and methods used in the
    traditional (non-cloud) environment as well as some cloud-specific permutations.
    A brief overview of these areas follows.


    # Firewalls


    Firewalls are tools that limit communications based on some criteria. They can
    be either hardware or software, or a combination of both. Firewalls can be stand-alone
    devices or integrated into other network nodes as hosts and servers. The criteria
    for determining which traffic is allowed and which is not take the form of rules
    (such as which services or protocols are allowed, to be used, from whom and when
    traffic should be allowed, and so forth), or behavior-sensing algorithms (the
    firewall is taught which behavior is “normal”, for both the environment and the
    user, and deviations from the baseline are noted by the firewall, and stateful
    inspection (the firewall understands the expected pattern of conversation in a
    protocol and recognizes deviations), or even inspection of content.


    # IDS/IPS


    Intrusion detection systems (IDSs) and intrusion prevention systems (IPSs) are
    very similar to firewalls in they monitor network traffic. These can also use
    defined rules, behavior-based algorithms, content, or stateful inspection to detect
    anomalous activity. The explicit difference between an IDS and an IPS is that
    an IDS only reports suspicious activity, alerting responders (such as the security
    office), whereas the IPS can be set to take defensive action when suspicious activity
    is recognized (such as closing ports and services) in addition to sending alerts.
    In the modern environment, most of these serve both purposes.


    # Honeypots


    A honeypot is a tool used to detect, identify, isolate, and analyze attacks by
    distracting attackers. This is usually a dummy machine with useless data, partially
    secured and configured if it was a realistic portion of the production environment.
    When attackers penetrate and attempt nefarious activity (such as installing rootkits
    or other malware,'
