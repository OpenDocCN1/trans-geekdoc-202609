- pgno: 35
  md: '# Answers to Assessment Test


    +   1. Cloud backup solutions enable enterprises to store their data and computer
    files on the Internet using a storage service rather than storing data locally
    on a hard disk or tape backup. This has the added benefit of providing access
    to data should the primary business location be damaged in some way that prevents
    accessing or restoring data due to damaged infrastructure or equipment. Online
    backups and removable hard drives are other options but not by default the customer
    with ubiquitous access. Masking is a technology used to partially conceal sensitive
    data.


    +   2. In an IaS model, the customer must maintain licenses for operating systems
    (OSs) and applications used in the cloud environment. In PaaS models, the encryption
    for OSs is managed by the provider, but the customer is responsible for application
    licenses; in SaaS models, the customer does not need to manage a license library.


    +   3. Information rights management (IRM) (often referred to as digital rights
    management, or DRM) is designed to focus on security and encryption as a means
    of preventing unauthorized copying and distributing of content to only authorized
    personnel (usually, the purchasers). Masking specific fields or data in order
    for the production environment. Splitting is a method of hiding information across
    multiple geographical boundaries, and degaussing is a method of deleting data
    permanently from magnetic media.


    +   4. The only correct answer for this is: public, private, hybrid, and Joint,
    Internet, and are not cloud models.


    +   5. An encryption key is just: a key used to encrypt and decrypt information.
    It is mathematical code that supports either hardware- or software-based encryption,
    is used to decrypt or encrypt information, and is confidential for the parties
    involved in the communication. PKI is the arrangement for creating and distributing
    digital certificates. Public-private is the description of the key pairs used
    in asymmetric encryption (this answer is specific to the question; option B is
    preferable). Masking hiding specific fields or data in particular user views in
    order to limit data exposure in the environment.


    +   6. The letters in the acronym STRIDE representing spoofing of identity, tampering
    with data, reputation, information disclosure, denial of service, and elevation
    (or escalation) of privilege. The other options are simply mixed up or incorrect
    versions of the same.


    +   7. Nonrepudiation means that a party to a transaction cannot deny they took
    part in that transaction.


    +   8. The act of crypto-shredding destroying the key that was used to encrypt
    the data, making the data very difficult to recover.


    +   9. A identity provider maintains the identities and generates tokens for known
    users. The relying party (RP) is the service provider, which consumes tokens.
    All other answers are incorrect.'
