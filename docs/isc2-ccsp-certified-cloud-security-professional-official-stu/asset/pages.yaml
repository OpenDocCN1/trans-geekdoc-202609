- pgno: 269
  md: '# Chapter 9 ■ Operations Management


    Short-term contingency power can be provided by generators. For the cloud data
    center, sufficient generator power is necessary for all critical systems and infrastructure,
    including HVAC and emergency lighting as well as fire suppression systems. For
    the higher-tier centers, redundant power is necessary, duplicating the minimum
    power required to ensure uninterrupted critical operations.


    Generators that supply close to immediate power when electricity is interrupted
    have automatic transfer switches. Transfer switches sense when the utility provision
    fails, break the connection to the utility, start the generator, and provide generator
    power to the facility. An automatic transfer switch is not a viable replacement
    for a UPS, and the two should be used in conjunction, not in lieu of each other.
    Ideally, the generator and transfer switch should be rated to provide backup power
    within the duration of expected life of the UPS. Generally, generators with transfer
    switches are expected to provide power in less than a minute from loss of utility
    power.


    Generators need fuel; this usually gasoline, diesel, natural gas, or propane.
    Appropriate storage, supply, and maintenance of fuel should also be described
    and included in the BC/DR plan. As fuel is flammable, health and human safety
    concerns must be addressed in the storage and supply designs. For all data centers,
    the Uptime Institute recommends a minimum of 12 hours of fuel for all generators,
    powering all critical functions, be available. Availability of additional fuel
    should be scheduled and performed within those 12 hours. Supply contracts provisions
    for the supplier should be included in the BC/DR plan and procedure checklists.
    For BC/DR purposes, the plan should anticipate at least 72 hours of generator
    operation before other alternatives are available.


    Gasoline and diesel oil, even with conditions that extend useful fuel life. If
    you generators use these types of fuel, the plan must also include testing and
    contracts for regular resupply and refresh within the spoilage period. Some fuels,
    such as propane, do not spoil; you may want to consider this when considering
    backup power alternatives.


    ![](img/914e4f10ad3f2426a517172a28cd7161_269_0.png)


    All fuel storage should be in secure containers and locations. Fuel and generators
    should be far removed from the path of vehicles, ideally outside normal traffic
    areas (with a provision for secure vehicle access for resupply purposes).


    # Testing


    Much like having backups without trying to restore, or having logs without doing
    log review, having a BC/DR plan is close to useless unless it is tested on a regular
    basis. Because the BC/DR will necessarily cause interruption to production, different
    forms of testing can be utilized for different purposes, adjusting the operational
    impact while achieving specific goals. You should be familiar with the following
    testing methods:


    Tabletop Testing The essential participants (those who will take part in actual
    BC/DR activities and are formally tasked with such responsibilities) work together
    at a scheduled time (either together in a single room or remotely via some communication
    capability) to describe how they would perform their tasks in a given BC/DR scenario.
    This is the InfoSec'
  merge: -1
