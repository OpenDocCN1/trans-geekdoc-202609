    # Physical and Logical Isolation


    In this chapter, we''ve already discussed the need for both physical and logical
    isolation of personnel, the virtualized instances, and storage devices in a cluster.
    The same principles should be applied throughout the cloud data center to include
    other isolation techniques and technologies. These include restricted physical
    access to devices, secure interface devices, and restricted logical access to
    devices.


    # Restricted Physical Access to Devices


    Access to racks in the data center should be limited to those administrators and
    managers who absolutely need to reach the devices in order to perform their job
    functions. Entry and egress should be controlled, monitored, and logged. Racks
    should be locked, and keys for each respective rack should be checked out only
    for the duration of use. Likewise, KVMs have to be checked out by the administrator
    to use them for a specific task and checked in their return.


    # Secure KVMs


    The human interface devices such as keyboards, video displays, and mice (KVMs)
    used to access production devices—both processing and storage—should be hardened
    for security purposes. Secure KVMs differ from their mandate counterparts in that
    they are designed to deter and detect tampering. They are also, as may be expected,
    usually a bit more expensive.


    +   Secure KVMs have the following traits:

    * Secure Data Ports These reduce the likelihood of data leaking between computers
    that are connected through the KVM.

    * Tamper Labels These provide a clear indication if the unit housing has been
    breached. They might also be supported by warning lights that alert you when the
    exterior case is opened.

    * Fixed Firmware This cannot be flashed or reprogrammed.

    * Soldered Circuit Board Soldering is used instead of adhesive so that the board
    itself or chipsets or other components cannot be removed and replaced.

    * Reduced Buffer Data is not stored between the immediate needs of the device.

    * Air-Gapped Pushbuttons When switching between multiple devices connected to
    the unit, the current connection is physically broken before a new one is made.'
