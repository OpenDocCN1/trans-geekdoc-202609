  md: '# FIGURE **1.1** Rapid scalability allows the customer to dictate the volume
    of resource usage.


    ![](img/914e4f10ad3f2426a517172a28cd7161_46_0.png)


    Therefore, with deployment to a cloud environment, the organization realizes cost
    savings immediately (not paying for unused resources) and avoids a costly risk
    (the possibility of loss of service due to increased demand).


    # Reduction in Personnel Costs


    For most organizations (other than those that deliver IT services), managing data
    is not a core competency, much less a profitable line of business. Data management
    is also a specialized skill, and people with IT experience and training are relatively
    expensive (compared to employees in other departments). The personnel required
    to fulfill the needs of an internal IT environment represent a significant and
    disproportionally large investment for the organization. In moving to the cloud,
    the organization can largely divest itself of a large percentage, if not a majority,
    these personnel.


    # Reduction in Operational Costs


    Maintaining and administering an internal environment takes a great deal of effort
    and expense. When an organization moves to the cloud, the cost becomes the price
    of the service, as calculated by the cloud provider. Therefore, costs are lumped
    in with the flat-rate cost of the contract and will not increase in response to
    enhanced operations (scheduled updates, emergency response activities, and so
    on).


    # Transferring Some Regulatory Costs


    Some cloud providers may offer holistic, targeted regulatory compliance packages
    for their customers. For instance, the cloud provider might have a set of controls
    that can be applied to a given customer’s cloud environment to ensure the mandates
    of Payment Card Industry (PCI) are met. Any customer wanting that package can
    specify so in a'
  merge: -1
