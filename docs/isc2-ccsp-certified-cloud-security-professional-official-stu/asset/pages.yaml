- pgno: 165
  md: 'In this chapter, we will explore some of the ways that these relationships
    are currently taking form and what to expect in terms of what each party wants
    and how they will prefer to operate. We''re going to examine the roles involved
    in the arrangement, including three parties, and we''ll also cover some of the
    contractual elements and technologies that make the relationship work, particularly
    application programming interfaces (APIs).


    # # Foundations of Managed Services


    Some element of adversarial relationship exists between the cloud customer and
    cloud vendor because they have somewhat different goals. The cloud customer wants
    to maximize their computing capabilities and security of information while minimizing
    their costs. The cloud vendor wants to maximize its profits while minimizing what
    it has to provide (which is expressed in terms of computing capabilities and security
    of information).


    There is a great deal of obvious tension between these goals, which why negotiation
    of the contract and SLA is vital. Likewise, there is a great deal of overlap,
    which makes the relationship tenuous and profitable for both parties. It is in
    the vendor''s best interest not to allow security breaches. Repeated security
    failings would sour the market for their product/brand and expose them to continue
    losses, which reduces profits. It is in the vendor''s best interest to provide
    excellent service and exceed customer expectations because so attracts clients
    and increases market share.


    The ambiguous areas are where the risks exist and where both parties must establish
    strong delineation of duties and responsibilities in order to protect themselves
    and their stakeholders (see Figure 6.1). As I''ve mentioned throughout this book,
    the type of service/platform affects the nature and extent of each party''s rights
    and tasks.


    **FIGURE 6.1** Responsibilities by service model


