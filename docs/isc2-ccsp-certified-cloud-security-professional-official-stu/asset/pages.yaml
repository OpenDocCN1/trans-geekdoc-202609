  md: '![](img/914e4f10ad3f2426a517172a28cd7161_310_0.png)


    In this chapter, we continue our discussion of the legal and compliance challenges
    in cloud computing. The global, decentralized nature of cloud computing presents
    numerous issues that we are just now grappling with our endeavors to protect privacy
    rights, meet compliance demands, and maintain a secure computing environment.


    This chapter will cover effective risk management, risk metrics, and strategies
    for an effective risk management program. I will round it out with a discussion
    of outsourcing, contract management, and the all-important service-level agreement
    (SLA).


    # The Impact of Diverse Geographical Locations and Legal Jurisdictions


    As discussed in Chapter 10, “Legal and Compliance Part 1,” the impact of the decentralized,
    geographically, and geopolitically dispersed model of cloud computing presents
    numerous challenges, including these:


    +   - Data processing, storage, and computing, each occurring in different geographical
    realms

    - Difficulties in assessing data actors

    - Difficulties in locating data


    A great deal of the difficulty in managing the legal ramifications of cloud computing
    stems from the design of cloud assets. They are necessarily dispersed, often across
    municipalities, state, and international borders. Resources are constantly being
    allocated and reallocated on a moment-to-moment basis. Also, specific control
    and administration of particular assets can be to ascertain and establish.


    > Some jurisdictions, such as the EU, have rules about the “transparency” of Internet
    service providers (ISPs), where ISPs must refrain from giving preferential pricing
    or access to any particular customer or must publicly publish an explanation/specification
    when they do. If your organization negotiates a particularly beneficial pricing/service
    package with a cloud provider that also happens to be an ISP in the EU, the details
    of this pricing/service might be required, by law, to become public record. You
    can find the EU law here: https://lex-europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0619&r=2.'
