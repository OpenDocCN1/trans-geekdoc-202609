- pgno: 316
  md: '# The Impact of Diverse Geographical Locations and Legal Jurisdictions


    # Risk Avoidance


    Risk avoidance is not a method for handling risk but a response to the cost-benefit
    analysis posed with a specific risk. If an organization is faced with a risk where
    the potential costs outweigh the likely benefits, the organization may choose
    not to engage in the activity that would incur the risk at all. This is the only
    surely method for eliminating a specific risk: don''t undertake the risky activity.


    For instance, if the activity is, taking a package across the ocean, and the risk
    includes potential costs as drowning, soaking the package in seawater and rendering
    it worthless, losing both the package and the ship, and so on, and the potential
    benefit is being paid $5 to transport the package, the organization might (rightly)
    deem the risk not to be worth the reward and choose to stay out of the transoceanic
    delivery business. The organization can then be said to have engaged in risk avoidance.


    # Risk Acceptance


    The direct opposite of risk avoidance is risk acceptance. In examining the potential
    benefits and risks of a certain activity, if the organization determines that
    the risks are minimal and the reward is substantial, the organization might choose
    to accept the risks involved in the endeavor and proceed with the activity without
    any additional consideration.


    To use the example, if the organization determines that the risks of transporting
    a package across the ocean are so as to be negligible (say, if there is a sufficient
    historical record to indicate that nobody has drowned or lost a ship or package
    on similar journeys in the past 10 years) and the reward is significant (if the
    organization is offered $5,000 instead of consideration), then the organization
    make the job of moving the package without any other consideration. This is risk
    acceptance.


    To use some of the concepts of the prior discussion in this chapter, if the risk
    of the activity is estimated to be within the organization''s risk appetite, then
    the organization might choose risk acceptance.


    # Risk Transfer


    Risk transfer is a way to handle risk with an activity without accepting all the
    risk. With risk transfer, the organization finds someone else to incur the risk
    of an endeavor at a fraction of the potential cost the organization would incur
    if the risk was realized.


    Basically, when you think of risk transfer, think one word: insurance. The organization
    is going to pay a portion of what the worst outcome would be in order to insure
    against the cost of that worst outcome.


    Now return to the example from the previous sections: If the organization can
    buy insurance for the task of delivering the package, then the worst-case scenario
    (someone drowning, losing the ship, or losing the package, and therefore losing
    the payment for transporting it) can be offset by a proportional payout from the
    underwriter. Let''s say the organization gets paid $5,000 to ship the package
    and buys an insurance policy for $500. The terms of the insurance policy state
    that failure to deliver the package results in a'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Chapter 11 • Legal and Compliance Part 2


    payout significant enough to mollify the client (the sender of the package) as
    well as recoup the costs the organization faces in performance (the expenses incurred
    in performing the activity, such as renting a boat, hiring someone to carry the
    package, and so on). There might even be an extraordinary payout in the event
    of an extraordinary risk being realized (the boat is attacked by sharks and everyone
    on board is eaten along with the package). The reduced profit (reflecting the
    payment for shipping minus cost of policy, which is $4,500 of the full $5,000)
    might still be acceptable to the organization because senior management is assured
    that the risks are being addressed.


    The final option in managing risk is risk mitigation, and this is the option that
    comprises the daily workload of security practitioners. Risk mitigation is the
    practice of reducing risk to an acceptable level through the use of controls and
    countermeasures. That is to say that the organization implements controls in order
    to bring known risks to within that organization''s risk appetite.


    Using the same example in the previous sections, controls that might be implemented
    to reduce the risk with shipping a package across the sea might mean putting the
    package in a watertight container, affecting a tracking device to the package,
    equipping the ship conveying with anticollision sensors, and so on. When the organization
    has determined that the significant risks have been attenuated sufficiently with
    the proper controls, the organization may decide that the business activity—shipping
    the package—has a sufficient chance of success.


    There are two important things to note about risk mitigation: Never believe anyone
    says that something has “zero risk” or that a control offers “100 percent security.”
    Even with all possible controls placed on a business function, there will remain
    some level of risk; we call this residual risk. If the residual risk remains after
    controls have been implemented within the organization''s risk appetite, then
    the organization might choose to perform that function (that is, accept risk).
    If the remaining risk exceeds the risk appetite of the organization, the controls
    are insufficient or the business is just too risky to perform.


    +   - The cost of the controls must be less than the potential benefit of the
    business process or the process is not profitable or worthwhile. You should never
    put a $10 lock on a $5 bicycle.


    The organization should consider using different types of controls when choosing
    to mitigate risk. In the security field, we group controls into three general
    types: physical, technical, and administrative.


    Physical controls that limit physical access to assets or that operate in a manner
    that reduces the impact of a physical event. Examples of physical controls include
    locks on doors, fire suppression equipment in data centers, fences, and guards.


    Technical controls, also referred to as logical controls, are controls that enhance
    some facets of the CIA triad, usually operating within a system, in electronic
    fashion.'
