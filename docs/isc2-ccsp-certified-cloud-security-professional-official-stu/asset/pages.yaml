    on the Internet to remove content that may be infringing on copyright. | ** |
    ** |

    | Clarifying Lawful Overseas Use of Data (CLOUD Act) | Allows law enforcement
    and courts to compel Americans to delete data stored in foreign countries; designed
    specifically for cloud situations (hence the name). | US federal courts | US federal
    enforcement agencies |


    *The ECPA and its subordinate parts, including the SCA prevents the government
    from surveilling civilians. Ostensibly, the government would be the entity originating
    and administering this law, and government law enforcement agencies would be the
    entities most likely to violate the law in the course of their activities. The
    reader can see the issues that might arise from this circular construct


    **The DMCA allows for aggrieved parties to bring civil suits to protect their
