- pgno: 319
  md: 'Be a systematic, structured, and timely risk management program.


    Ensure the risk management program is based on the best available information.


    Be tailored to the organization''s business requirements and actual risks.


    Take human and cultural factors into account.


    Ensure the risk management program is transparent and unique.


    Create a risk management program that is dynamic, iterative, and responsive to
    change.


    Facilitate continuous improvement and enhancement of the organization.


    For more information please visit www.iso.org/iso/home/standards/iso31000.htm.


    # NIST SP 800-37 (Guide for Implementing the Risk Management Framework)


    NIST SP 800-37 is the Guide for Implementing the Risk Management Framework (RMF).
    This particular framework is a methodology for handling all organizational risk
    in a holistic, comprehensive, and continual manner. This RMF supersedes the old
    "Certification and Accreditation" of cyclical inspections that have a specific
    duration (widely in American military, intelligence, and federal communities).
    This RMF relies heavily on the use of automated controls, risk analysis and assessment,
    and implementing controls based on assessments, with continuous monitoring and
    improvement.


    NIST SP 800-37 is a guide organizations can use to implement the RMF. Although
    NIST standards are developed for the federal government, they have begun to be
    accepted in many non-governmental organizations and commercial practices. For
    instance, companies in the United States may use the NIST model and publications
    in developing not only their information security program, but also their risk
    management program and practices. NIST publications and standards have the dual
    benefit of being well acknowledged as expert and also free of charge (all NIST
    documents are in the public domain). It takes little effort to adopt and adapt
    the NIST materials from their intended use in the federal space into a private
    sector or nonprofit endeavor.


    Keep in mind that these documents are not accepted in international markets as
    are ISO/IEC standards. Therefore, if you conduct business outside the United States,
    you may want to investigate the other standards in some detail. Some overseas
    companies will not even do business with US companies unless they are certified
    and are under ISO standards.


    For a free copy of SP 800-37, as well as any other NIST documents, visit https://csrc.nist.org/publications/detail/sp/800-37/rev-2/final.


    # European Union Agency for Network and Information Security (ENISA)


    You could think of European Union Agency for Network and Information Security
    (ENISA) as a European counterpart to NIST. It is a standard and model developed
    in Europe. While it could be considered international because it is accepted throughout
    Europe, it is not as globally accepted as the ISO standards.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# The Impact of Diverse Geographical Locations and Legal Jurisdictions


    ENISA is responsible for producing Cloud Computing: Benefits, Risks, and Recommendations
    for Information Security. This guideline identifies 35 types of risks organizations
    should consider but goes further by identifying the top eight security risks based
    on likelihood and impact:


    +   - Loss of governance

    - Lock-in

    - Isolation failure

    - Compliance risk

    - Management interface failure

    - Data protection

    - Malicious insider

    - Insecure or incomplete data deletion


    For more information about ENISA, please visit www.enisa.europa.eu.


    # Risk Management Metrics


    To understand whether control mechanisms and policies are effective, it is important
    to identify risk management metrics that reflect the effectiveness of your program.
    To do this, you can use what is referred to as a risk scorecard. These cards help
    you derive relative value for risk of the activities in which you are engaged.
    They might, for instance, look like this:


    +   5. Critical

    4. High

    3. Moderate

    2. Low

    1. Minimal


    Each of these levels would need to be defined so that risks could be adequately
    described. For instance


    +   - Critical => $100,000 in damages

    - High => $50,000 but < $100,000


    # Contracts and Service-Level Agreements (SLAs)


    The most important documents establishing, defining, and enforcing the relationship
    between the cloud provider and cloud customer are the contract and the service-level'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Chapter 11 • Legal and Compliance Part 2


    agreement (SLA). The contract describes in detail exactly what both parties''
    responsibilities are; what services are being contracted; and what provisions
    are in place for the safety, security, integrity, and availability of those services.
    The SLA is the list of defined, numerical metrics that will be used to determine
    whether the provider is sufficiently-meeting the contract terms during each period
    of performance.


    Perhaps the most important relationship between the two documents is that the
    contract stipulates the penalty imposed on the cloud provider if any metric of
    the SLA is not met during a certain performance period. For instance, if the period
    of performance is one month and the SLA contains a metric that states, "Downtime
    will not exceed five (5) seconds per calendar month," and the cloud provider has
    six seconds of downtime in December, then the contract could allow the cloud customer
    to withhold payment for the cost that would otherwise be paid, without any interruption
    of the continued service that is scheduled for January. This is a penalty imposed
    on the provider for failing to meet the needs of the customer, as of guarantee
    built into the contract and enforced on a periodic basis.


    Let''s begin examining some of the essential components and activities that might
    be expressed in the contract between a provider and customer:


    +   - Availability

    - Performance

    - Security and privacy of data

    - Logging and reporting

    - Data location

    - Data format and structure

    - Portability

    - Identification and problem resolution

    - Change management

    - Dispute mediation

    - Exit strategy options

    - Components activity

    - Uptime guarantees (the five 9s principle, i.e., 99.999% uptime)

    - Penalties (for both consumer and provider)

    - Penalty exclusions (instances where penalties are not invoked)

    - Suspension of service

    - Provider liability

    - Data protection requirements

    - Disaster recovery

    - Security recommendations'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# The Impact of Diverse Geographical Locations and Legal Jurisdictions


    As you can see, this assortment of details about services can be quite comprehensive.
    And if the CCSP or the cloud customer does not complete their due diligence by
    carefully scrutinizing the contract, both parties could be dissatisfied with the
    eventual relationship. There are many considerations for what should be in the
    contract, depending on the needs of the organization.


    The SLA, on the other hand, will assign specific numerical values to the performance
    objectives outlined in the contract. Using a sampling from the list of possible
    contract elements, the related SLA might include details like this:


    +   - The customer will have full control, access to the customer''s accounts
    and data at all times, with an allowed exception of service interruption greater
    than 24 hours per calendar water (where service interruption is the fault of the
    provider).


    +   - Data moved to from provider''s resources and control at the defined price
    will not exceed 40 gigabytes per hour; data movement exceeding this rate will
    incur additional costs as defined in the standard rate included in the contract.


    +   - Customer service inquiries from the customer to the provider will be addressed
    via direct email or telephone contact within three hours of transmission.


    While both the contract and the SLA may contain numerical values, the SLA will
    explicitly include numerical metrics used to determine that recurring performance
    goals are met. It''s very important that the SLA covers various situations and
    risks associated with the customer''s business requirements when crafting and
    negotiating the contract and SLA. Suppose the provider promises availability that
    amounts to no more than 24 hours of downtime in any quarter. But what if the customer
    is an online retailer who does 30 percent of their annual business the day after
    Thanksgiving and that is the 24-hour period of an outage? It could devastate the
    customer''s business and yet still meet the terms of the SLA.


    It is also important to look at the quality of the items delivered as part of
    your SLA. For instance, being connected and available is one thing, but if the
    servers at the other end are sluggish, customer experience may lag. If bandwidth
    is sluggish or there is jitter, again, customer experience suffers. In your SLA
    you must also adequately address this quality of service (QoS) issues. Here are
    some more examples:


    +   - Availability

    - Outage duration

    - Capacity metrics

    - Performance metrics

    - Storage device metrics

    - Server capacity

    - Instance startup time metric

    - Response time metric

    - Completion time metric

    - Mean time to switchover

    - Storage capability

    - Server scalability'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Chapter 11 • Legal and Compliance Part 2


    The Cloud Security Alliance (CSA) has created an annual report on threats. In
    2013 the report was called The Notorious Nine, and in 2016 was named The Treacherous
    12. It is intended to let people know the nature of prevalent cloud threats, much
    like the OWASP (Open Web Application Security Project) Top Ten, which is a list
    of the top ten threats found or exposed in applications across the Internet.


    # Business Requirements


    Before entering into any type of contract for cloud computing services, the organization
    should evaluate a number of things. First, there should be some compelling reason
    for engaging the cloud provider. Decisions should be made to assist the business
    in reaching its long-term goals. Decisions should never be made because they seem
    attractive or based on what your competitors are doing. You have sound business
    reasons for deciding to use a cloud provider and for determining which one to.


    As part of the due diligence in cloud computing as a viable solution for the business,
    more items should be examined. Not all business units need to be involved in decision-making.
    Perhaps changes may have little or no impact on them, in which case they do not
    need to be involved. This is called scoping, which is used to refer to including
    only departments that are important to any cloud engagement.


    Another aspect of evaluating cloud computing solution is of regulatory compliance.
    It is vital that you investigate what regulators'' expectations are with regard
    to cloud computing solutions and the additional or differing risks that engaging
    in the cloud solution will bring to the organization.


    Lastly, you must look closely at the costs associated with any types of disaster
    recovery or outages and what you are able to withstand. Measurements such as time
    objective (RTO), recovery point objective (RPO), and maximum allowable downtime
    (MAD) are critical in making decisions about choosing cloud computing solutions.
    You must be able to withstand certain amounts of outages based on your risk profile
    as they are bound to occur at some time. Knowing how to handle them and how your
    cloud provider handle them is imperative.


    # Cloud Contract Design and Management for Outsourcing


    It is important that appropriate governance be involved in contract design and
    management of outsourcing. An in-depth understanding of contracts and contract
    management is important and is often managed by a specific department in large
    organizations. It is the CCSP’s responsibility to ensure that contract managers
    understand the details of what they are managing so that the organization does
    not incur risk.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Identifying Appropriate Supply Chain and Vendor Management Processes


    One example of adequate governance is how often contracts are renewed. This can
    and should be on at least an annual basis (if not sooner, if there are problems).
    Contracts should also specify how conflicts will be resolved.


    Two other vital aspects of contracts have to do with the notion of data portability
    and vendor lock-in. *Vendor lock-in* is getting stuck with a certain provider,
    either as a result of detrimental contract terms or technical limitations. *Data
    portability* is the trait customers seek in order to avoid lock-in. Data moving
    from one cloud provider to another (or away from the cloud provider and back to
    a legacy enterprise environment). The greater portability of the data, the less
    chance of vendor lock-in.


    If you choose to stop using your cloud vendor, what happens to your data? Is it
    transportable? Can you move it to another provider? Will the data be in one type
    of universal format so it is usable? Will you have a reasonable amount of time
    to move your data conflicts arise? And what will happen to your data once you
    leave the provider? Have you made arrangements for adequate deletion using such
    techniques as crypto-shredding? These questions are all important things to consider
    when managing outsourcing contracts.


    # Identifying Appropriate Supply Chain and Vendor Management Processes


    When discussing supply chain and vendor management in the realm of cloud computing,
    we are talking about operational aspects that entail risk. For instance, availability
    could be affected by the entirety of the cloud supply chain:


    +   - Cloud carriers (the ISPs) between the cloud customer and the cloud provider

    - Platform providers (the vendors supplying the systems used in the cloud service)

    - Application providers (the vendors supplying the software used in the cloud
    service)


    These can all be one of these become unavailable for some reason or problems in
    accessing resources, the customer faces an outage as well. These risks are associated
    with supply chain management and must be handled accordingly.


    To adequately understand your risk exposure, you must first and foremost understand
    your SLAs and vendors'' abilities to meet the SLA metrics.


    # Common Criteria Assurance Framework (ISO/IEC 15408-1:2009)


    Common Criteria Assurance Framework (ISO/IEC 15408-1:2009) is yet another international
    standard designed to provide assurances for security claims by vendors. It establishes
    a universal format for evaluating security functions included in IT products.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The primary goal is to provide customers with assurance that security products
    they purchase have been thoroughly tested by independent third-party testers and
    meet the requirements the customer has specified.


    One thing to keep in mind is that the Common Criteria certification only verifies
    the vendor''s claims regarding security functionality are true, not whether those
    security functions are appropriate, meet industry practices, or will be sufficient
    for a specific user/customer''s business needs or regulatory compliance. It is
    also important to note that the configuration of any product must match what was
    tested for the certification, otherwise the product may not meet the security
    needs of the organization.


    For more information about the Common Criteria and ISO/IEC 15408-1:2009, go to:
    www.iso.org/iso/catalogue_detail.html?csnumber=58341.


    # CSA Security, Trust, and Assurance Registry (STAR)


    The CSA STAR program, initiated in 2011, was created in response to market demand
    for a single consistent framework for evaluating cloud providers. The CSA STAR
    program was designed to provide an independent level of program assurance for
    cloud providers. It is based on three levels of assessment, covers four offerings,
    and provides a comprehensive set of cloud-centric, control objectives.


    The CSA STAR is a registry of security controls provided by public cloud computing
    offerings and is designed for users to assess cloud providers, security providers,
    and advisory and assessment services as part of their vendor management due diligence
    in choosing providers.


    The CSA STAR consists of the following components:


    **Cloud Controls Matrix (CCM)** A list of security controls and principles appropriate
    for the cloud environment, cross-referenced to other control frameworks such as
    COBIT, ISO standards, and NIST pubs. You can download a copy of the CCM from CSA
    at https://cloudsecurityalliance.org/artifacts/ccm-v3-0-0-1-11-12-2018-FINAL/.


    **Consensus Assessment Initiative Questionnaire (CAIQ)** A self-assessment performed
    by cloud providers, detailing the practice areas and control groups they use in
    providing their services. You can request a copy of the CAIQ from CSA at https://cloudsecurityalliance.org/download/consensus-assessments-initiative-questionnaire-v3-0-1/.
    You can also review completed CAIQs and certifications for various cloud providers
    in the CSA''s STAR registry online at https://cloudsecurityalliance.org/star/#registry.


    The CSA STAR program also consists of three levels based on the Open Certification
    Framework:


    **Level One: Self-Assessment** Requires the release and publication of diligence
    assessments against the CSA''s **Consensus Assessment Initiative Questionnaire**
    and/or Cloud Matrix (CCM)'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Identifying Appropriate Supply Chain and Vendor Management Processes


    Level Two: CSA STAR Attestation Requires the release and publication of available
    results of an assessment carried out by an independent third party by CSA CCM
    and ISO 27001:2013 or an AICPA SOC 2


    Level Three: CSA STAR Continuous Monitoring Requires the release and publication
    of continuous monitoring performed by a certified third party


    > There have been several iterations of the CCM, with the most recent and default
    being CCM V3.0.1, with updates effective November 2018.


    Much like the SOC reports in Chapter 10, these levels are representative of varying
    degrees of compliance with the framework. Involving independent third-party assessors
    can be quite expensive, and large providers can usually absorb the cost as they
    typically have a large investment in their security infrastructure.


    > I highly recommend reviewing the CSA CCM. Not only is it important for study
    purposes, but it may be useful in many actual IT environments.


    # Supply Chain Risk


    When evaluating supply chain risk, the customer should be thinking of disaster
    recovery and business continuity: What happens if something goes wrong with one
    or more of these vendors on which your business depends?

    The following supply chain risks are common:


    +   * Financial instability of provider

    * Single points of failure

    * Data breaches

    * Malware infestations

    * Data loss


    Even more common are natural disasters. What if the data center of your cloud
    provider is destroyed by an act of nature like a hurricane or earthquake?

    ISO 2800:2007 defines a set of security management requirements, including those
    that must be applied to all parties within a supply chain. However, ensuring the
    suitability of each vendor in the supply chain for meeting requirements and enforcing
    them up and down the supply chain is the responsibility of the contracting organization.
    In other words, if you pay someone else to perform a service that in any way might
    affect your customers, you are obligated to ensure that the entities you''ve paid
    are subject to governance equivalent to what you''ve promised your customers and
    that your subcontractors are'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'following that governance. ISO 28000:2007 also provides for a certification
    against certain elements that relate to supply chain risk:


    +   - Security management policy

    - Organizational objectives

    - Risk management practices

    - Documented practices and records

    - Supplier relationships

    - Roles, responsibilities, and authorities

    - Organizational procedures and processes


    As the standard grows in popularity with cloud providers, it will in all likelihood
    be more widely adopted in the future. Much like STAR, ISO certification gives
    the consumer some level of assurance that the appropriate controls are in secure
    data and privacy.


    # Manage Communication with Relevant Partners


    Both the cloud provider and cloud customers will have to establish durable, resilient
    lines of communication for business partners along the supply chain for a variety
    of reasons/purposes. Of particular interest are the following:


    +   - **Vendors and Partners:** Communication with vendors is necessary in order
    to ensure adequate quantities and types of resources/assets are available for
    operations. This can be especially true for emergency/contingency situations,
    where the immediacy/availability of resources is crucial (such as fuel for generators,
    replacement components for damaged systems, and so on).

    - **Customers:** *Customers* can mean either individual end users of a product/service
    or a business that requires products/services in a supply chain. Communication
    with customers is essential to manage expectations (in instance, alerting customers
    prior to an interruption of service), maintain brand awareness, and ensure logistics
    are being met. This is particularly true during disaster situations, where delivery
    may be delayed or interrupted. This may also be required by law, in situations
    involving privacy data, in jurisdictions affected by data breach notification
    laws.

    - **Regulators:** In regulated industries, a third party determines your ability
    to conduct business, maintaining communications with regulators is crucial. Regulations
    should be aware of any situation where the organization might become noncompliant
    with potential standards or regulation (such as during disasters or in the aftermath
    of a crisis). Should be kept apprised of developments, potential solutions considered
    by management, may stay measures or compensatory controls used in the interim,
    and the estimated duration until compliance resumes.


    For communications with all parties in the supply chain, secondary and even tertiary
    communications capabilities are highly recommended, especially for disaster situations.
    (Don''t rely on the telephone to be working during a disaster.)'
