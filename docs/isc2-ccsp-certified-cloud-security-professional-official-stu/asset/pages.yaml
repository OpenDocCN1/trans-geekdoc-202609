    predictive capability, which could provide a more timely response than a reactive
    way of handling threats. Threat intelligence services offer off this functionality.


    ![](img/914e4f10ad3f2426a517172a28cd7161_149_0.png)


    # Protection vs. Security


    In 2011, Sony sued a man named George Hotz after Hotz published an exploit that
    allowed PlayStation 3 users to subvert internal controls on the game console and
    take full control of the device. Sony''s actions are understandable. The company
    intended to protect its brand offering opportunities for PlayStation users to
    breach IRM solutions and infringe on software copyright. Hotz''s position is likewise
    reasonable. Hotz asserted that the owner of a device should be allowed to utilize
    it in any manner they see fit and preventing such capabilities on the premise
    that this ability might be abused by malicious actors should not restrict those
    who have no such intent.


    Sony''s legal right to defend its property notwithstanding, the action was seen
    by some as abusive. Sony, a multinational giant with vast resources, pursuing
    what was obviously a punitive course against a hacking group known as Anonymous
    considered Hotz a kindred spirit and took umbrage at Sony''s actions. A hacker
    claiming to act on behalf of Anonymous launched a three-day attack on PlayStation
    Network (PSN), resulting in a breach that exposed account information of 77 million
    users (arguably the largest known at that time) and an extended shutdown of the
    game service. The eventual cost of the attack, according to statements attributed
    to Sony in news reports, exceeded $171 million, including revenue, legal fees,
    and customer restitution.


    It''s difficult to imagine the loss of root control over PlayStation devices costing
    Sony more than the damages related to the hack. In no way suggests that the illegal
    attack on PSN is justifiable. However, Sony''s perception of its position and
    action exposed Sony to a much greater threat than the one the company was trying
    to prevent. In handling security matters, even when your organization is legally
    and ethically in the right, an objective, holistic view can be useful to attenuate
    unintentional escalation of risk.


    Sony and Hotz reached an out-of-court settlement, the full terms of which are
    not available.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Man-in-the-Middle (MitM) Attacks One to mitigate these attacks is to encrypt
    data in transit, including authentication activity. You can also use secure session
    technology and enforcement.


    Social Engineering Training, training, training. Use incentive programs (perhaps
    including spot bonuses and accolades) to identify personnel who resist social
    engineering attempts and alert the security officer.


    Data Loss from Theft/Loss of Devices Countermeasures include encryption of stored
    material to attenuate the efficacy of theft, strict physical access controls,
    limited or no USB functionality (up to including physically destroying USB ports),
    detailed and comprehensive inventory control and monitoring, and remote wipe or
    remote switch capability for portable devices.


    Regulatory Violations Hire knowledgeable, trained personnel with appropriate skills.
    Defer to general counsel in planning and managing your systems. Implement IMR
    solutions. Use encryption and obfuscation and managing as necessary.


    Natural Disasters The cloud provider should ensure multiple redundancies for all
    systems and services for the data center, including ISPs and utilities. The cloud
    customer can arrange for a backup with the another cloud provider, or offline.
    For further discussion of this topic, see the section "Disaster Recovery (DR)
    and Business Continuity (BC)” in this chapter.


    Loss of Policy Control Strong contractual terms should be employed to ensure the
    provider is adhering to a security program that is at least effective and thorough
    as what the customer would invest in an enterprise the customer owned and controlled.
    Detailed and extensive audits should be conducted by the customer or a trusted
    third party.


    Loss of Physical Control You can use all of the protections listed in the internal
    threats, theft/loss of devices, and loss of policy control entries in this list.


    Lack of Audit Access If the provider refuses to allow the customer to directly
    audit the facility, the customer must rely on a trusted third party. If the provider
    limits access to full third-party reports, the customer must insist on contractual
    protections to transfer as much of the financial liability for security failures
    to the provider as possible, including additional punitive damages.


    Rogue Administrator Countermeasures include all the controls listed in the internal
    threats entry in this list, with additional physical, logical, and administrative
    controls for all privileged accounts and personnel, including thorough and secure
    logging of all administrative activities, locked rooms, monitoring of physical
    access to devices in real time, implementation of video surveillance, and financial
    monitoring of privileged personnel (where legally allowed).


    Escalation of Privilege Extensive access control and authentication tools and
    techniques should be implemented. Countermeasures also include analysis and review
    of all log data by trained, skilled personnel on a frequent basis combined with
    automated tools such as SIEM/SIM/SEM solutions.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Contractual Failure To protect against vendor lock-in/lock-out, the customer
    might consider full off-site backups, secured and kept by the customer or a trusted
    third-party vendor, for reconstitution with another cloud provider in the event
    of severe contractual disagreement.


    Legal Seizure Legal action (either for prosecutorial or litigious purposes) might
    result in unannounced or unexpected loss or disclosure of the organization''s
    data. The organization may consider encryption of its data in the cloud or by
    employing data dispersion (spreading the data across multiple logical/physical
    locations). The revised BIA should take this possibility into account, and we
    need to consider the use of encryption for data in the cloud.


    Virtual machine introspection (VMI) is an agentless means of ensuring the VM''s
    security baseline does not change over time by examining things as physical address,
    network settings, and installed OS. These ensure that the baseline has not been
    inadvertently or maliciously tampered with.


    # Disaster Recovery (DR) and Business Continuity (BC)


    Entire books have been written about this topic. We''re not going to be able to
    address it completely in this one. Instead, we''ll focus on those areas of BC/DR
    most applicable to cloud computing, specifically with the CCPS CBK and exam in
    mind. In the following sections, we''ll go over BIA concerns specific to cloud
    platforms and the establishment of shared BC/DR planning and responsibilities
    between the cloud provider and customer.


    # Cloud-Specific BIA Concerns


    In migrating to a cloud service architecture, your organization will want to review
    its existing business impact analysis (BIA) and consider a new BIA, or at least
    a partial assessment, for cloud-specific concerns and the new risks and opportunities
    offered by the cloud. The potential impacts are things you have already included
    in your original BIA, but these may be more significant and take new forms in
    the cloud. For instance, the loss of an internet service provider (ISP) might
    have affected your organization in its previous (non-cloud) configuration, losing
    connectivity after migration might have a more detrimental effect. Unlike in a
    traditional IT environment, an organization conducting operations in the cloud
    will not be able to conduct scaled-back, local computing without connectivity
    to the provider.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Disaster Recovery (DR) and Business Continuity (BC)


    Potential emergent BIA concerns include, but are not limited to, the following:


    **New Dependencies** Your data and operations will be reliant on external parties
    in whole new ways after migration. Not only will you have to depend on the cloud
    provider to meet your organization''s needs, but all the downstream and upstream
    dependencies associated with the provider, including the provider''s vendors,
    suppliers, utilities, personnel, and so on. The BIA should take into account possibilities
    involving the provider''s inability to meet service requirements in addition to
    similar failings on the part of any of the provider''s requisite entities.


    **Regulatory Failure** The efficiency and ease of data distribution in the cloud
    enhances potential violations of regulations as users and administrators alike
    promote and disseminate in new ways. The cloud provider presents another point
    of failure for regulatory compliance as even if your organization is fully compliant
    internally, the provider might be unable or unwilling to adhere to your policies.
    Regulatory failures could include insufficient protection for PII/PHI data to
    comply with statutory requirements such as GDPR, GLBA, HIPAA, FERPA, or SOX, and
    may also take the form of contractual inadequacies, such as copyright licensing
    violations. The BIA needs to include discussion of possible impacts


    **Data Breach/Headless Disclosure** Cloud computing magnifies the likelihood and
    impact of two existing risks: legal liability for breaches of PII can be transferred
    to the provider, the cloud customer must reassess the potential impact and effect
    of an unauthorized disclosure, especially in terms of costs resulting from data
    breach notification legislative mandates. Other potential adverse results from
    breaches that should be addressed in the revised BIA include, but aren''t limited
    to, public disclosure of deleterious internal communication and reporting; loss
    of competitive advantage; negative effect on customer, supplier, and vendor goodwill;
    contractual obligations.


    Vendor Lock-In/Lock-Out The BIA should take these risks into account for any operations
    migrated to the cloud. Much of the data for this part of the report should be
    readily available and won''t have to be re-created for the BIA as it should have
    been performed as part of the cost-benefit analysis when the organization first
    considered migration.


    # Customer/Provider Shared BC/DR Responsibilities


    The negotiation between the customer and the provider will be extensive, addressing
    service needs, policy enforcement, audit capabilities, and so forth. One of the
    elements that definitely should be included in this discussion should be provisions
    for BC/DR, how and where it will be done, who is responsible for each part of
    the process, and so on. In the following sections, I will describe aspects of
    cloud BC/DR that should be considered in these negotiations.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Chapter 5 ■ Security in the Cloud


    # Logical Location of Backup Data/Systems


    There are three general means of using cloud backups for BC/DR. For discussion
    purposes in this section, we''ll be referring to replicated data and systems as
    “backups.” The basic ways of using cloud backups for BC/DR include the following:


    **Private Architecture, Cloud Service as Backup** If the organization maintains
    its own IT data center for the primary production environment, BC/DR plans can
    include the use of a cloud provider as the backup. Negotiations with providers
    will have to include upload bandwidth costs (which often have caps as the limiting
    factor); frequency of backups, whether the organization requires a full, incremental,
    or differential backup schedule; the security of the data and systems at the cloud
    data center; and costs. In this methodology, the customer should determine what
    constitutes an emergency situation and when normal (internal) operations will
    cease and when the backup will be utilized as the operational network. This may
    involve a formal declaration to include in the cloud service as notifying the
    provider and will will almost certainly require additional cost for the duration
    of the crisis. Failover might require the form of using the cloud service as a
    remote network (in IaaS, PaaS, or SaaS arrangements), or it might require downloading
    the backup data from the cloud to another production site for contingency operations.
    The negotiation between customer and provider should determine when and how that
    download occurs, how long it should take, and when data will be restored to normal
    operations location by the terms at the end of the crisis.


    **Cloud Operations, Cloud Provider as Backup** One of the attractive benefits
    of cloud operations is the resilience and redundancy offered by cloud data centers,
    especially from market leaders. Cloud providers offer a backup solution as a feature
    of their service—a backup located at another data center owned by the provider
    in case of disaster-level events. In this motif, the provider will have all the
    responsibility for determining the location and configuration of the backup and
    most of the responsibility for assessing and declaring events. The customer may
    have limited participation in the failover process, but that''s the exception
    to the rule. BC/DR priority, including failover, should also be transparent to
    the customer in this case. Moreover, if this feature is offered as part of the
    normal cloud operation, it will usually be at no or little additional cost.


    **Cloud Operations, Third-Party Cloud Provider** In this situation, regular operations
    are hosted by one cloud provider, but contingency operations require failover
    to another cloud provider. The customer may opt for this selection in order to
    distribute risk, enhance redundancy, and preemptively avoid vendor lockout. This
    may be the most complicated BC/DR arrangement to negotiate because it will have
    to involve preparations and coordination between all three parties and roles and
    responsibilities must be explicitly and thoroughly delineated. Under this arrangement,
    both the primary cloud provider and the cloud customer will take part in emergency
    assessment and declaration, and failover may require joint effort. This can impede
    the process, especially during crises when cooperation and clear communication
    is most difficult. The cloud customer will also have to negotiate all the terms
    in the first model in this list (private'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'architecture, cloud service as a backup), with both the primary and backup
    cloud providers. Usually, this will also be a relatively expensive methodology—the
    backup provider will not be a cost bundled with other features offered by the
    primary provider, and both failover and contingency operations will entail additional
    expenses. (However, some of the increased costs may be offset by payments from
    the primary provider if conditions of SLAs are not met because of the crisis event.)
    Also, data format/system interoperability will be a significant concern; the customer
    may need to perform additional activity when porting data from one cloud provider
    to another in order for the data to be used properly at destination.


    # Declaration


    The declaration of disaster events is a crucial step in the BC/DR process. The
    cloud customer and provider must decide, prior to the contingency, who specifically
    will authorize and the explicit process for communicating when it has been made.


    Within the organization, this authority should be basically assigned to a specific
    office or person, and there should be a deputy or backup named in case the primary
    is unavailable. Both the primary and backups should receive detailed emergency
    operations training that should include and thorough understanding of the organization''s
    BC/DR plan. The persons selected for this authority should be empowered by senior
    management to have the full capacity to declare the emergency and initiate failover
    procedures.


    The organization should have a warning system in place to assess impending disaster
    situations. This is not always possible with certain kinds of contingencies, but
    some may be anticipated with at slight notice. The organization should be prepared
    to fail over in advance of the actual crisis event in order to maintain continuity
    of operations. The customer and provider must agree on what will constitute formal
    notice so that failover occurs, but they may use a preliminary schedule of preparatory
    communications before declaration is finalized and announced.


    If the cloud provider has to undergo some failover activity, the contract should
    stipulate the time in which this is done after notice has been received (for example,
    within 10 minutes of declaration). If failover is automated and fully controlled
    by the customer, that should be explicitly detailed in the contract.


    Resumption of normal activities following a contingency event will likewise require
    formal notification. Early return to operations may cause an extension of the
    disaster or result in the loss of data or assets. As with emergency declaration,
    return to normal operations should be tasked to a specific entity within the customer''s
    organization, and the person making that decision should be fully aware of the
    risks and implications inherent in it. The process for doing so should also be
    enumerated within the contract.


    ![](img/914e4f10ad3f2426a517172a28cd7161_154_0.png)


    As all things related to security practices, but especially in disaster situations,
    health and human safety are the paramount concern of any plan or process.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Chapter 5 ■ Security in the Cloud


    # Testing


    Having backups is an admirable practice, fulfils statutory requirements, and satisfies
    some legal care obligations. However, merely creating a backup is not sufficient.
    If you never try to use your backups until an actual crisis event, you have no
    assurance that they will function as planned.


    Failover testing (and to normal operations) must be performed in order to demonstrate
    the efficacy of the plan and procedures. It also hones the skills of the personnel
    involved and for additional training opportunities. Of course, the testing constitutes
    an interruption in normal service and ought not be taken lightly. There is risk
    and cost with performing the test.


    Most industry guidance stipulates that such occur at least annually. This amount
    might be increased by the nature of the organization and its operations.

    BC/DR testing will have to be coordinated with the cloud provider. This should
    be planned well in advance of the scheduled testing. Care should be taken to determine
    and assign specific responsibilities to participants, and all liability for problems
    incurred during the failover or returning to normal operations should be detailed
    in the contract.


    # Summary


    In this chapter we have discussed the shared and distinct responsibilities of
    the cloud customer and provider in terms of managing risk as well as BC/DR activities.
    We explored the specific risks associated with each cloud computing platforms
    (private, community, public, hybrid, IaaS, PaaS, and SaaS) and detailed countermeasures
    for dealing with them. Finally, we discussed the potential threats and vulnerabilities
    that constitute the cloud attack surface.


    # Exam Essentials


    Know how responsibilities are shared between the customer and provider. Understand
    the notional charted in Figure 5.1 at the beginning of the chapter and how the
    level of responsibility for each party largely depends on the amount of service
    being provided.


    Know the risks associated with each type of cloud platform. Memorizing the list
    might not be necessary, but you should understand the material sufficiently to
    the point where you could determine which risks are relevant to that particular
    platform.


    Have a thorough understanding of countermeasures used in cloud computing. Again,
    rote memorization is probably not the best technique for familiarizing yourself
    with this important material, but you, as a practitioner as well as a student,
    should have a degree of comprehension of each potential risk and threat to match
    it to specific security controls for attenuation.'
  merge: -1
  img_proc: true
