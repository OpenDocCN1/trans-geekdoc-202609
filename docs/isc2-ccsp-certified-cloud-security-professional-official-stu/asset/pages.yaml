- pgno: 263
  md: '# Chapter 9 ■ Operations Management


    There is no total agreement within our industry on the exact definitions of the
    terms business continuity, disaster recovery, event, or simply disaster for that
    matter. For the purposes of this discussion and to create awareness of the (ISC)²
    perspective on the matter, I will use the following explanations:


    +   * Business continuity efforts are concerned with maintaining critical operations
    during interruption in service, whereas disaster recovery efforts are focused
    on the resumption of operations after an interruption due to disaster. The two
    are related and in many organizations rolled into one effort.

    * An event is any unscheduled adverse impact to the operating environment. An
    event is distinguished from a disaster by the duration of impact. When we consider
    an event to last three days or less, a disaster lasts longer. An event can become
    a disaster. Causes of either/or can be anthropogenic (caused by humans), natural
    forces, internal or external, malicious or accidental.


    Because they can be so similar, I''ll discuss BC/DR efforts for most of the coverage
    and only make distinctions when needed.


    # Primary Focus


    The paramount importance in BC/DR planning and efforts should be for wealth and
    human safety, in all security matters. There is no justification for prioritizing
    any asset to any degree higher than human, except in very limited cases. These
    are limited to organizations dealing with national security, and, even in those
    cases, are likewise limited to situations where human harm and loss of life might
    only be necessary to prevent greater losses (such as in the protection of assets
    that might result in devastation, such as nuclear, biological, or chemical products).


    With in mind, any BC/DR efforts should prioritize notification and evacuation
    as well as protection and egress.


    Notification should take redundant forms to ensure widest and most thorough disinfection.
    Suggestions for possible notification avenues include telephone call trees, website
    postings, and SMS blasts. Notification should include the organization''s personnel,
    the public, and regulatory and response agencies, depending on who might be affected
    by the circumstance.


    Evacuation, protection, and egress methods will depend on the particular physical
    layout of the campus and facility. Some aspects are generally included in addressing
    these needs include the following:


    **Getting the Out** There should be no obstruction or delay of personnel leaving
    the facility. All doors along the emergency path should fail safe (that is, they
    can be opened from the inside, allowing egress, even if they are still secure
    from the outside, preventing ingress). Sufficient lighting should be considered.


    **Getting the People Out Safely** Sprinkler systems along the egress route should
    be designed to inundate the area, and not be restricted to other considerations
    (such as property damage). Non-water fire-suppression systems (such as gas) cannot
    risk human life and must'
