- pgno: 250
  md: '![](img/914e4f10ad3f2426a517172a28cd7161_250_0.png)


    This chapter covers the essential aspects of operations monitoring, capacity,
    maintenance, change and configuration management, and BC/DR for cloud data centers.


    In other chapters, I often referred to the cloud customer as "your organization"
    or made other related associations (using your or we to indicate the cloud customer''s
    perspective in many matters). In this chapter, the focus is almost exclusively
    on the cloud provider, specifically the provider''s data center. I may refer to
    actions associated with the provider with the same pronouns used for the customer
    elsewhere (you, yours; or we); hopefully, context will prevent any misunderstanding.


    In this chapter, we will discuss the various practices cloud data center operators
    should use to optimize performance and enhance durability of their infrastructure
    and systems. This will include coverage of systems monitoring, the configuration
    and change management program and BC/DR from a vendor perspective.


    # # Monitoring, Capacity, and Maintenance


    It''s important for data center operators to know how their hardware, software,
    and network are utilized and what demand is being placed on all the relevant resources.
    This information helps data center operators know how to better apportion and
    allocate all those items in order to fulfill customer needs (and maintain compliance
    with SLAs).


    # # Monitoring


    Software, hardware, and network components need to be evaluated in real time to
    understand which systems may be nearing capacity and so the organization can respond
    as quickly as possible when problems arise. This can be done with several of the
    possible tools at the operator''s disposal:


    OS Logging Most operating systems have integral toolsets for monitoring performance
    and events. Aside from the security uses mentioned elsewhere in the book, the
    cloud vendor can set OS logs to alert administrators when usage approaches a level
    of capacity utilization or performance degradation that may affect SLA parameters.
    These can include CPU usage, memory usage, disk space (virtual or tangible), and
    disk I/O timing (an indicator of slow writing/reading to/from the disk).'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Chapter 9 ■ Operations Management


    Hardware Monitoring As with the OS, many vendors include performance-monitoring
    tools in common device builds. These can be used to measure performance indicators
    as CPU temperature, fan speed, voltages (consumption and throughput), CPU load
    and clock speed, and drive temperature. Commercial products are also available
    to collect and supply this data and provide alerts if this functionality is not
    integral to the devices from the manufacturer.


    Network Monitoring In addition to the OS and the devices, the various elements
    need to be monitored. These include not only the hardware and the software, but
    the distribution facets such as cabling and software-defined networking (SDN)
    control planes. The provider should ensure that current capacity meets customers
    needs and increased customer demand to assure that the flexibility and scalability
    of cloud traits are still provided. The provider should also ensure that the network
    is not overburdened or subjected to unacceptable latency.


    > As with all log data, the performance monitoring information can be fed into
    a SEIM, SEM, or SIM system for centralized analysis and review.


    In addition to the hardware and software, it is important to monitor ambient conditions
    within the data center. In particular, temperature and humidity are essential
    data points for optimizing operations and performance. It is important to capture
    a realistic portrayal of the temperature within the data center, perhaps by averaging
    measurements across several thermometric devices located throughout the airflow.
    For performance monitoring purposes, our target metrics will be the standards
    created by Technical Committee 9.9 of the American Society of Heat, Refrigerating
    and Air-Conditioning Engineers (ASHRAE), published in 2016. ASHRAE offers extremely
    detailed recommendations for a wide variety of aspects of the data center, including
    the equipment, power supply, and battery backups, all of which are quite free
    from ASHRAE: https://rc6089.ashraets.org/documents/ASHRAE_TC0909_Power_white_22_June_2016_REVISED.pdf.
    It is also a good read and worth investing some of your time investing.


    +   - Temperature: 64° to 81° F (18°C to 27°)


    +   - Humidity: 21° to 59° F (5°5 to 15° C), relative humidity of 60%


    While these ranges give a general level of condition of the ambient environment
    within a data center, ranges based on the type, age, and location of the environment.
    The operator should determine which guidance is most applicable to their facility.
    Moreover, ASHRAE offers this advice solely from a platform-agnostic perspective.
    Data center operators must also take into account any guidance and recommendations
    from device manufacturers regarding ambient ranges affecting performance parameters
    for their specific products.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Monitoring, Capacity, and Maintenance


    213


    # Effects of Ambient Temperature and Ambient Humidity


    What roles do temperature and humidity play, in terms of affecting equipment performance?


    An ambient temperature that is too high may allow equipment to overheat. High-capacity
    electrical components generate a great deal of waste heat, and the devices can
    be sensitive to conditions exceeding their operating parameters. An ambient temperature
    that is too low can be a risk to health and human safety; touching bare metal
    at the freezing point can burn or remove skin; moreover, people working in such
    conditions would simply be uncomfortable and unhappy, conditions that lead to
    dissatisfaction, which in turn lead to security risks.


    An ambient humidity that is too high can promote corrosion of metallic components
    as well as mold and other organisms. An ambient humidity that is too low can enhance
    the possibility of static discharge, which might affect both personnel and equipment
    as well as the potential for fires.


    # Maintenance


    Continual uptime requires maintaining the overall environment constantly. This
    also includes maintaining individual components both on a scheduled basis and
    at unscheduled times as necessary. In the following sections, we will discuss
    general maintenance matters, upgrades, and patch management.


    # General Maintenance Concepts


    The operational modes of data centers can be perceived as two categories: normal
    and maintenance mode. Realistically, the data center, taken holistically, will
    constantly be in maintenance mode, as ongoing maintenance of specific systems
    and components is necessary for continuous uptime. After, a cloud data center
    can be expected to be in constant normal mode, with various systems and devices
    continually in maintenance mode to ensure correctness. This is es true for Tier
    3 and 4 data centers, where redundant components, lines, and systems allow for
    maintenance to occur simultaneously with uninterrupted operations.


    Let''s look at systems and devices in terms of the normal and maintenance modes.
    When a system or device is put into the specific maintenance mode, the data center
    must ensure the following tasks are successful:


    All operational instances are removed from the system/device before entering maintenance
    mode. We don''t want to affect any transactions in a customer''s production environment.
    We therefore must migrate all virtualized instances off the specific systems and
    devices where they might be hosted before we begin maintenance activities.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Prevent all new logins. For the same reason as the previous task, we don''t
    want customers logging into the affected systems and devices.


    Ensure logging is continued, and begin enhanced logging. Administrator activities
    are much more powerful, and therefore rife with risk, than the actions of common
    users. It is therefore recommended that you log administrator actions at a greater
    rate and level of detail than those of users. Maintenance mode is an administrative
    function, so the increased logging is necessary.


    Before moving a system or device from maintenance mode to normal operation, it
    is important to test that it has all the original functionality necessary for
    customer purposes, that the maintenance was successful, and that proper documentation
    of all activity is complete.


    # Updates


    Industry practice includes ensuring we comply with all vendor guidance regarding
    specific products. In fact, failing to adhere to vendor specifications can be
    a sign that the operator has failed in providing due care, whereas documented
    adherence to vendor instructions can demonstrate diligence.


    In addition to configuration prior to deployment (Change and Configuration Management
    \[CM\] later in this chapter), vendors will issue ongoing maintenance instructions,
    often in the form of updates. This can be in the form of application packages
    for software and firmware installs for hardware. The former can also be in the
    form of patches, which we''ll discuss specifically in a later section.


    The update process should be formalized in the operator''s governance (as all
    processes, and they should all spawn from policy). It should include the following
    elements, at a minimum


    Document how, and why the update was initiated. If prompted by the vendor, annotate
    the details of the communication, including date, update code or number, explanation,
    and justification; some of this may be included in reference, as with a URL to
    the vendor''s page announcing the update instructions.


    Move the update through the change management (CM) process. All modifications
    to the facility should be through the CM methodology and documented as such. Details
    on the CM process are included later in this chapter, but it should be stressed
    that sandbox testing is included as part of CM before the update is applied.


    +   1. Put the systems and devices into maintenance mode. Observe the recommendations
    in the previous section of this chapter.


    +   2. Apply the update to the necessary systems and devices. Annotate the asset
    inventory to reflect the changes.


    +   3. Verify the update. Run tests on the production environment to ensure all
    necessary systems and devices have received the update. If any were missed, repeat
    the installation until it is complete.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '+   4. Validate the modifications. Ensure that the intended results of the
    update have taken effect and that the updated systems and devices interact appropriately
    with the rest of the production environment.


    +   5. Return to normal operations. Resume regular business.


    # Upgrades


    In this context, we distinguish updates from upgrades with this purpose: updates
    are applied to existing systems and components, whereas upgrades are the replacement
    of older ones with new elements. The upgrade process should largely map to the
    one for updates, including formalization in governance, CM methodology, testing,
    and so forth. Particular attention in upgrading risks to be placed on documenting
    the changes in the asset inventory, not only adding the new elements but annotating
    the removal and secure disposal of the old ones. This, of course, means that secure
    disposal is one element of the upgrade process that is not included in updates.


    # Patch Management


    Patches are a variety most commonly associated with software. We distinguish them
    by their need: software vendors issue patches both for immediate response to a
    need (such as a newfound vulnerability) and for routine purposes (fixing, adding,
    or enhancing functionality) on a regular basis.

    The patch management process must be formalized in the same manner as updates
    and upgrades, with their inclusion in policy and so forth. However, patches incur
    additional risks and challenges, so this discussion is set aside to deal with
    those specifically. The following relate suggestions and considerations to take
    into account when managing patches for a cloud data center.


    # Timing


    When a vendor issues a patch, there is a binary risk faced by all affected: if
    they fail to apply the patch, they may be failing in providing due care for those
    using the unpatched products; if the patch is applied in haste, it may adversely
    affect the production environment, harming the customer''s ability to operate.
    The latter case is especially true when patches are issued in response to a newfound
    vulnerability and the vendor was rushed to identify the flaw, find and create
    a solution, publish the fix, and issue the patch. In the rush to deal with the
    problem (even especially when the vulnerability is well publicized and gathers
    public attention), the patch may cause other vulnerabilities or affect other systems
    by reducing interoperability or interface capability.

    It is therefore difficult to know exactly when to apply patches relates to how
    soon after they were issued. It is contingent upon the operator to make this decision
    after weighing the merits of either choice.

    In some environments (and with some vendors), it may be desirable to schedule
    a patch-de-fecting day/time (per week or per month, for instance) so that it is
    a regular, anticipated occurrence. In this way, the various participants can coordinate
    the activity, the change control process can accommodate the required modifications,
    and specific types of patches can be prioritized and applied in a defined manner.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 9 ■ Operations Management


    Of course, sometimes the customer has little to control over when patches might
    take place, particularly with some platform or vendor updates. If the customer
    knows this might be an issue with a particular vendor or software, they can try
    to plan ahead about how they might deal with such situations.


    A data center operator may be tempted to allow others in the field to apply the
    patch first in order to determine its effect and outcome based on the experiences
    of competitors. The risk in that is that in the meantime, loss or harm might be
    caused by the vulnerability the patch was meant to remediate. This might lend
    strong support in a lawsuit to recover damages because those harmed by the loss
    can rightly claim that the provider knew of it, did not take the steps of due
    diligence made by others in the field, and allowed harm to come through negligence.
    This might even support claims for additional punitive damages. Again, while the
    tactic may be sound, it carries this additional risk.


    ![](img/914e4f10ad3f2426a517172a28cd7161_255_0.png)


    # Implementation: Automated or Manual


    Patches can be applied with mechanized tools or by personnel. There are obvious
    benefits and risks for both methods. The operator will have to decide which one
    to use on a general basis (by policy) and for each case when a patch is issued
    given the circumstances. The risks and benefits for each include the following:


    **Automated** A mechanized approach will allow for much faster delivery to more
    targets than a manual approach. Patch might include a reporting function that
    annotates which targets have received the patch, cross-referenced against the
    asset inventory, and have an alerting function to inform administrators which
    targets have been missed. Without a capable human observer, however, the tool
    might not function thoroughly or properly, the patches might be missed, or the
    reports might be untrustworthy or portray an inaccurate picture of completeness.


    **Manual** Trained and experienced personnel may be more trustworthy than a mechanized
    tool and understand what anomalous activity occurs. However, with the vast number
    of elements that will need to be patched in a cloud data center, the repetitiveness
    and boredom of the patch process may lead even a seasoned administrator to miss
    a number of targets. The process will be much, much slower than the automated
    option and not be as thorough.


    # Dates


    As the patch is pushed through the environment, the actual date/time stamp may
    become an important—and misleading—matter in acquiring and acknowledging receipt.
    For example, say that an automated tool requires an agent that is installed locally
    on each target. If certain targets are not running when the patch happens and
    won''t be operating until the next calendar day (according to the internal clock
    on the target), the local agent may not receive the patch but may check against
    the central controller for patches for the current day.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Change and Configuration Management (CM) 217


    This problem is compounded when patch agents are set to check for patches according
    to a time specified by the internal clock and different targets may have internal
    clocks set to differing times (in the case, of customers who are geographically
    dispersed).


    This problem is not limited to automated tools, either. If a manual method is
    used, the administrators may be applying a patch at a given time/date when not
    all customers and users have their targets operating, so such targets might not
    receive the patch, and administrators might not realize that targets don''t currently
    appear in scans may be patched at some later time/date. Moreover, if patches are
    being applied manually, the process will necessarily be extended so that administrators
    can be sure to reach all targets as they come online.


    All these possibilities are escalated in a cloud arrangement because of the use
    of virtualization. All virtualized saved images and not currently instantiated
    patch delivery will be receiving the patch only after they have rebooted. This
    means the process will endure until virtual machines have been made, which could
    represent a significant amount of time after the decides to implement the patch.
    The result is a relatively long delay between the time the operator decides to
    implement the patch and the time of 100 percent completion. This reflects poorly
    on the process and the operator, especially in the eyes of regulators and customers.


    Perhaps the optimum technique is to combine the benefits of each method, using
    both manual and automated approaches. Manual oversight is valuable in determining
    applicability of patches and testing for patches in the environment, while automated
    tools can be used to propagate patches and ensure uniform application.


    Regardless of the approach taken, patching (as with all forms of maintenance)
    should be mentioned in the SLA, and an agreed-upon schedule and threshold of patches
    is an important consideration.


    # Change and Configuration Management (CM)


    Data center operators, like anyone who owns an IT network, need to develop and
    maintain a realistic concept of what assets they control, the state of those assets,
    and explicit information about each asset. This goes beyond (but includes) the
    asset inventory—the hardware, software, and media also includes documented records
    of configuration for all these elements, including versioning, deviations, exceptions,
    and the rationale for each, as well as a formal process for determining how, when,
    and what modifications need to be made.


    There are two foundational and interrelated processes used to accomplish this:
    change management and configuration management. Configuration management entails
    documenting the approved settings for systems and software, which helps establish
    baseline within the organization. Change management is the process used to review,
    approve, and document any modifications to the environment. In one sense, configuration
    management is just the first change to a specific system/program; the two practices
    are linked.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Realistically, in many organizations both sets of functions are accomplished
    by a single process and body. For the purposes of our discussion of operational
    functions, I''m going to aggregate them and put them under one label: CM. I''ll
    do this to simplify the information, even though a cloud vendor should probably
    have the wherewithal and functional and personnel specialization sufficient to
    provide both as activities. The purposes of both are so similar in intent and
    procedure as to be understood as one concept.


    # Baselines


    CM, regardless of the flavor, begins with baselining, which is a way of taking
    account of the desired state state. For management, that''s a depiction of the
    network and systems, based on a comprehensive, detailed asset inventory. For configuration
    management, it''s a standard build for all systems, from the settings in the OS
    to the setup of each application.


    The baseline is a general-purpose map of the network and systems, based on the
    required functionality as well. Security controls should be incorporated in the
    baseline, with a thorough description of each one''s purpose, dependencies, and
    supporting rationale (that is, a statement explaining what we hope to accomplish
    with each). It is absolutely essential to include the controls so that we are
    fully informed about risk management as we consider allocations to the environment
    through the CM. If we''re changing the control set in any systems and functionality
    to the environment, we need to know if there will be any resultant increased risk
    and, therefore, we need to add compensatory controls to manage the new levels.


    While creating the baseline, it''s helpful to get input from all stakeholders:
    the IT department, the security office, management, and even users. The baseline
    should be an excellent reflection of the risk appetite of the organization and
    provide the optimum balance of security and operational functionality.


    Preferably, the baseline should suit the largest population of systems in the
    organization. If it''s going to be used as a template (particularly in configuration
    management), we''ll get the most value from it if it applies to the greatest number
    of covered systems. However, it may be useful or pragmatic to have a number of
    baselines that are based on each department''s office, or project''s needs, but
    it is essential to ensure that each distinct baseline supports necessary mandates
    and requirements. It would be infortunate to have an entire department fail a
    regulatory compliance audit because that department''s baseline lost category
    of security coverage.


    # Deviations and Exceptions


    It is important to continually test the baselines to determine that all assets
    are accounted for and to detect anything that differs from the baseline. Any deviations,
    intentional or unintentional, authorized or unauthorized, must be documented and
    reviewed, as deviations pose additional risks/vulnerabilities to the organization.
    These deviations might be the result of the faulty patch management processes,
    a rogue device set up by a particular office or user, an intrusion by external
    attackers, or poor versioning and administrative processes.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Change and Configuration Management (CM) 219


    It is the duty of those personnel who are assigned CM roles to determine the cause
    and any necessary follow-up activity. (CM roles are discussed in the next section)

    The baseline serves as the standard against which to compare and validate all
    systems in the organization, it is not best to use it as an absolute. There will
    be a significant number of requests for exceptions for particular users, offices,
    and projects that need functionality not covered by the general baseline.


    Make sure that the baseline is flexible and that the exception request process
    is timely and responsive to the needs of the organization and its users. A cumbersome,
    slow exception process will lead to frustrated users and managers, which can,
    in turn, lead to unauthorized workloads implemented without the permission of
    the CM authority.


    ![](img/914e4f10ad3f2426a517172a28cd7161_258_0.png)


    An adversarial, unresponsive exception process will undermine security efforts
    of the organization. Everyone will find a way to perform their job, regardless
    of whether their workarounds are approved or the most secure means of performing
    these functions. Uninformed personnel, acting out of desperation, are more likely
    to make rogue security countermeasures than would the trained, skilled professionals
    whose job is to secure the environment. It is much better to compromise the sanity
    of the baseline with full cooperation than to mandate that no exceptions will
    be allowed or to make the process burdensome and complicated for users and offices.
    Remember: It is the job of security practitioners to support operations, not to
    hinder those engaged in productivity.


    Tracking exceptions and deviations is useful for another essential purpose in
    addition to ensuring regulatory compliance and security control coverage: if enough
    exception requests are being made all ask for the same or similar functionality
    that deviates from the baseline, change the baseline. The baseline is not serving
    if it continually needs routine modification for repeated, equivalent requests.
    Moreover, addressing exception requests takes more time and effort than modifying
    the baseline to incorporate new, security controls to allow for the expected functionality.


    # Roles and Process


    The CM process (as with all processes) will be formalized in the organization’s
    governance. This policy should include provisions for creating processes and procedures
    that provide the following:


    +   - Composition of the CM board (CMB, or sometimes CCB, for change control board)

    - The process, in detail

    - Documentation requirements

    - Instructions for requesting exceptions

    - Assignment of CM tasks, such as validation scanning, analysis, and deviation
    notification

    - Procedures for addressing deviations, upon detection

    - Enforcement measures and responsibility'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The CMB should be composed of representatives from all stakeholders within
    the organization. Recommended representatives include personnel from the IT, security,
    legal, management, finance and acquisition, and HR departments/offices, in addition
    to general users. Other participants that the organization deems useful can certainly
    be included in the CMB.


    The CMB will be responsible for reviewing change and exception requests. The board
    will determine if the change will enhance functionality and productivity, whether
    the change is justified, what potential security impacts the change will incur,
    and what additional measures (in terms of funding, training, security controls,
    or staffing) may be necessary to make the change successful and reasonable.


    The CMB should meet often enough that change and exception requests are not delayed
    unduly so that users are not frustrated by the process. However, it should not
    meet so often that the time aside for the CMB becomes work; the personnel in the
    CMB have all other duties, and participation in the CMB will impact their productivity.
    In some cases, depending on the organization, the CMB meets on an ad hoc basis,
    requiring only when change and exception requests meet a threshold. This can entail
    some risk, as CMB might lose familiarity with the process in the interim, and
    scheduling a meeting of the CMB with many disparate offices might be awkward if
    a meeting of the CMB is not a regular, prioritized occurrence. With much of the
    material addressed in this book, this is a trade-off of risk and benefit, and
    the organization should decide accordingly.


    The process has two forms: one will occur and the other, which is repetitive.
    The former is the initial baseline; the latter is the normal operational mode.
    A baseline will be created for each type of system in the environment.

    The initial process should look like this (amended as necessary for each organization''s
    individual circumstances):


    +   1. **Full Asset Inventory**: In order to know what is being managed, it''s
    crucial to know what you have. This effort need not be independent of all other
    systems and may in fact be aided by information pulled from others, such as the
    business analysis (BIA). The systems affected by each baseline need to be determined.


    +   2. **Codification of the Baseline**: This should be a formal action, including
    all members of the CMB (and perhaps more, for the initial effort; each department
    and project may want to contribute and participate in the baseline which will
    affect all their future work). The baseline should be negotiated in terms of cost-benefit
    and risk analyses. Again, it is reasonable to use existing sources to inform this
    negotiation, including the organization''s risk management framework, enterprise
    and security architecture, and so on.


    +   3. **Secure Baseline**: Build of the baseline, as codified by the CMB, is
    constructed and stored for later use.


    +   4. **Deployment of New Assets**: When a new asset is acquired (a new host
    purchased for use by a new employee), the relevant baseline configuration configurations
    need to be installed on asset, in accordance with CM policy and procedures and
    CMB guidance.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Change and Configuration Management (CM)


    In the normal operation mode of the organization, the CMB process is slightly
    different:

    expected.


    +   1. CMB Meetings: The CMB meets to review and analyze change and exception
    requests. The CMB can authorize or disallow requests, and it can require additional
    effort before authorization. For instance, the CMB can task the security office
    to perform additional detailed security analysis of the potential impact resulting
    if the request were authorized, or the CMB might require the requester to budget
    additional funding for training, administration, and security controls compared
    to what the requester initially expected.

    2. CMB Testing: If the CMB authorizes a request, the new modification must be
    tested before deployment. Usually, such testing should take place in an isolated
    sandbox that mimics all the systems, components, infrastructure, traffic, and
    processing of the production network, without ever touching the production network.
    Testing should determine whether there is any undue impact on security, interoperability,
    and functionality as a result of the modification.

    3. Deployment: The modification is made in accordance with appropriate guidance
    and is reported to the CMB upon completion.

    4. Documentation: All modifications to the environment are documented and reflected
    in the asset inventory (and, as necessary, in the baseline).


    ![](img/914e4f10ad3f2426a517172a28cd7161_260_0.png)


    Secure disposal of an asset is also a modification to the IT environment and therefore
    needs to be reflected in the asset inventory and reported to the CMB.


    # Release Management


    As a supporting process to change management, release management (RM) is a software
    engineering process with arranging all required elements to successfully, repeatedly,
    and verifiably release new software versions. The scope of RM includes planning,
    scheduling, and deploying new software, and it encompasses all environments that
    code pass through, including development, QA/testing and staging—everything up
    to the production environment, at maintenance. The process of code and related
    activities (often called user stories) to coding, testing, and the pipeline is
    known from requirements.


    RM has grown along with the rise in popularity of Agile software development practices,
    which aim to deliver functional software quickly using short development cycles.
    Waterfall, or agile software development methodology, focused heavily on gathering
    all requirements and delivering them all at once, while Agile focuses on small
    units of work that can be achieved in a short amount of time, then iterated to
    deliver additional functionality.


    DevOps has also grown as organizations adopt Agile. More frequent software releases
    have the need for tighter coordination between engineers developing software,
    operations staff responsible for maintaining the software, and users who drive
    the requirements'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'for software. DevOps aims to create cross-functional teams to ensure smoother,
    more predictable software delivery by encouraging tighter collaboration and more
    feedback.


    While the increased speed of Agile software development has made users happy (no
    more waiting for a new system to go live), it has created some heads for security
    practitioners. There simply no time to do many traditional activities like testing
    when new software is going on a daily or sometimes every hourly. To compensate,
    security practitioners must make use of automation to decrease the time it takes
    to perform security functions.


    Continuous Integration/Continuous Delivery (CI/CD) incorporates heavy use of automation
    to dramatically shorten the software delivery pipeline. The ultimate goal is to
    have newly developed software run as quickly as possible after an engineer completes
    their work, within minutes of being written. To achieve this, automated testing
    is used extensively to ensure the newly written code will not introduce bugs into
    the production environment. Security testing needs to be reevaluated to identify
    how security checks can be integrated with the CI/CD pipeline.


    Security automation in CI/CD must include both administrative and technical controls.
    Examples of administrative controls include checking that new software has a verifiable
    set of requirements and approvals (i.e., a developer is delivering code that meets
    a defined user need rather than unwanted functionality) and that all processes
    have been followed (e.g., a peer review must conducted). Automated technical controls
    can include checks such as passing a static code analysis or successful completion
    of a vulnerability scan run against a live version of the new code in a staging
    environment.


    # IT Service Management and Continual Service Improvement


    ITIL (formerly the Information Technology Infrastructure Library) comprises a
    set of practices businesses can use in designing, maintaining, and improving their
    IT services. This is known as IT service management (ITSM), and the practices
    can be implemented for any IT function, such as delivering email capabilities
    to employees, designing customer-facing applications, or even the process of migrating
    from on-prem to cloud infrastructure.


    ISOIEC20000-1, Information technology — Service management, also defines a set
    of operational controls and standards that organizations can use to manage IT
    services. The ISO standard defines a service management system (SMS) designed
    to support the practices of ITSM, as well as suggested processes, procedures,
    and organizational capabilities required. Note this is very similar to the approach
    in ISO 27001, which describes an information security management system (ISMS)
    and needed support for enabling security. ISO 20000-1 can be used to manage ITSM
    with a variety of approaches, including ITIL and the ISACA COBIT framework.'
