- pgno: 311
  md: '# Chapter 11 • Legal and Compliance Part 2


    It is that transborder aspect that is most troublesome, in terms of allowing cloud
    customer to maintain compliance with legal and regulatory mandates. As we discussed
    in the previous chapter, each jurisdiction can have its own governance, which
    can vary wildly from jurisdiction to jurisdiction, and jurisdictions can overlap.
    A city is in a county or municipality, the latter is in a state, which is in a
    country, and all may have conflicting guidance and guidance is in flux, especially
    in our industry. Lawmakers and standards bodies are constantly trying to catch
    up with the requirements and questions posed by new technologies and how those
    technologies are used. Our vagaries of law affect not only the cloud provider
    in terms of how the customer must behave and respond to legal action, but also
    how the cloud provider must perform in response to the same stimuli.


    The governance used by both entities—the cloud customer and the cloud provider—must
    take all of this into account in order to operate reasonably with acknowledgment
    of legal risks and liabilities in the cloud.


    It is important not to confuse the concepts of "governance" and "corporate governance."
    Governance refers to the legal and regulatory mandates of regions and countries.
    Corporate governance is the relationship between shareholders and other stakeholders
    in the organization versus the senior management of the corporation.


    ![](img/914e4f10ad3f2426a517172a28cd7161_311_0.png)


    # Policies


    Policies are one of the foundational elements of a governance and risk management
    program. They guide the organization, based on standards and guidelines. Policies
    ensure that the organization is operating within its risk profile. Policies actually
    define, or are the expression of, the organization''s risk tolerance.


    Before the organization begins creating policies, it starts by identifying the
    stakeholders. This ensures that the right individuals are involved in creating
    the expression of risk tolerance. These can include the following:


    +   - Business unit leaders

    - The board of directors

    - Investors

    - Regulators


    The views, perceptions, and choices of these groups will influence the organization''s
    willingness and ability to accept risk, but most of these stakeholders will not
    be directly involved in creating organizational policy. For instance, the regulators
    won''t (or shouldn''t) help draft policy, but they enforce the regulations that
    establish what risks an organization takes and how it takes them. The takes them.
    The regulators, ostensibly acting on behalf of lawmakers and in turn working on
    behalf of the public (because they chose those lawmakers), are expressing the
    view of the public, vis-à-vis risk, on organizations.'
