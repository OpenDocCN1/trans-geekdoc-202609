- pgno: 147
  md: 'Internal Threats These can be the result of malicious or accidental activity
    on the part of employees or others who have been granted access (such as contractors
    and maintenance personnel).


    External Attackers Entities may want to attack the network for any number of reasons,
    including financial gain, hacktivism, political goals, perceived grievances, and
