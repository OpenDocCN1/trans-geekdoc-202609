- pgno: 178
  md: '# Lack of Physical Access


    are various types of audits (and therefore, auditors), using a variety of tools/techniques
    depending on the desired target/population (financial, IT, and/or security audits,
    and so forth):


    +   **Audit Results:** The auditors collect findings, report on gaps between the
    intended outcomes and the actual environment, and present these findings to the
    client/target. Auditors may note shortcomings or sort shortcomings into categories
    (for instance, "significant" findings that need immediate attention or "routine"
    findings that can be addressed in the normal course of the operational pace).
    Typically, auditors should not recommend solutions for shortcomings as this would
    put the auditor in the role of consultant/advisor, which is a conflict of interest
    (the auditor must remain impartial, especially to the eventual success of the
    target organization). An auditor reporting a flaw or shortcoming might only publish
    an audit report with "qualifications" or "reservations," noting that the auditor
    feels there is a material or fundamental problem with the organization’s approach
    to the audit itself or the process being audited


    In a traditional customer/provider relationship, the customer would prefer to
    perform an audit (or have an audited at the customer’s behest and supervision,
    by an auditor of the customer’s choosing) of the provider, at the provider’s location
    and using data/material directly from the provider.


    Unfortunately, the cloud provider’s unwillingness to allow physical access to
    the facility also applies to the customer’s auditors, and in most cases auditors
    probably won’t have access to data streams and documentary artifacts necessary
    to perform a reasonable audit with a suitable level of veracity. This is especially
    troubling for organizations that have regulatory requirements for performing audits
    and providing audit reports to their stakeholders (including regulators).


    ![](img/914e4f10ad3f2426a517172a28cd7161_178_0.png)


    > The lack of physical access to the cloud provider’s facility also means that
    the preferred means of attenuating data remanence risks and ensuring secure data
    disposal (such as physical destruction of the host devices, drives, and media)
    will not be available to the customer. We’ve discussed the current best alternatives
    in other chapters, so I won’t repeat them here.


    For auditing purposes, then, what the customer is likely to get is audit reports
    performed by licensed and chartered auditors on the provider’s behalf, made known
    to the customers and the people. it is, of the provider’s interest to publish
    these audits, in the hope of increasing public perception of the reliability and
    trustworthiness of the provider’s services and thus increasing customer satisfaction
    and market share. However, the provider does not want to share a detailed audit
    of security controls for the very same reason they don’t want to allow physical
    access: a security control audit that revealed specific aspects and configuration
    of controls would provide a roadmap of attack for malicious actors.'
