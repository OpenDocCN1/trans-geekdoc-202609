    at www.cs.pur.edu/homes/ninghui/readings/AccessControl/brewer_nash_89.pdf.) A
    cloud provider pursuing this might want to enact such a policy and test it for
    functionality.


    # Hypervisor Hardening


    Because the hypervisor is a prime target for attackers (controlling the hypervisor
    might allow access to the data in each instance), the hypervisor should receive
    all the security attention that would have been shown for a bastion host in the
    DMZ of a legacy network. The hypervisor should be updated and patched to vendor
    standards, there should be no default accounts on it should be monitored by automatic
    sensors as well as continual logging and log review analysis. If the cloud provider
    has to choose between types of hypervisors, the bare-metal (Type 1) hypervisor
    is preferable to the hypervisor that runs off the OS (Type 2) because it offer
    less attack surface.


    # Instance Isolation


    Each virtual machine (that is, each instance or guest) should be logically isolated
    from the others with strict logical controls. (They cannot be physically isolated,
    by nature of virtualization and automatic load balancing.) Not only raw data should
    be prevented from leaking from one instance to another, but all metadata as well.
    No instance should be able to tell if another instance is present on the same
    host, much of what instance is doing or how long it takes to do it.


    Whatever controls are in place to maintain this isolation should be tested and
    monitored, both in the sandbox test and in the virtual environment, on a continuous
    basis.


    Furthermore, the possibility of guest escape (a user escalating a privilege that
    the user can learn the virtual instance and access the host machine itself) should
    be attenuated as much as possible.


    # Host Isolation


    As guest escape, the cloud provider should be intrinsically concerned about the
    possibility of a user on a virtual instance elevating themselves to the point
    where they can leave the virtual machine, access the host, and reach the network
    that the host is connected to, even-reaching other host devices or assets on the
    network.'
