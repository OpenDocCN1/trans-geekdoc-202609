- pgno: 315
  md: '# Implications of the Cloud for Enterprise Risk Management


    Cloud computing as it exists today has commoditized compute, storage, and network-services.
    Enterprise risk management has shifted in response to this change. It is vitally
    important that both the customer and the provider focus on risk management and
    the challenges presented by cloud computing. The cloud customer (in the role of
    data owner) is ultimately responsible for ensuring control effectiveness, but
    stored data, security, and risk management require a partnership between the customer
    and provider. Before you explore the detailed discussion of risk management, you
    need to be familiar with some risk-related terms.


    **Key Risk Indicators (KRIs)** Key risk indicators are metrics used by an organization
    to inform management if there is negative impact on operations. KRIs typically
    involve algorithms and ratings systems ascribed to factors selected by analysts
    and management in order to create an early-warning system for increased risk to
    the organization.


    > KRIs are forward-looking; by contrast key performance indicators (KPIs) help
    an organization understand risks or events that have already occurred and impacted
    the business.


    **Risk Appetite/Tolerance** Risk tolerance and appetite are similar descriptors
    of the organization views risk. Senior management dicates the amount of risk an
    organization is willing to take, generally based on the amount of perceived benefit
    related to the risk. Regulators and other external factors (such as contracts)
    may affect the organization''s risk appetite as well.


    **Risk Profiles** The risk profile of the organization is a comprehensive analysis
    of the possible risks to the organization. The risk profile should include a survey
    of the various operations the organization is engaged in, public perception of
    the organization, pending legislation that might affect the organization, the
    stability of countries where the organization operates, and so forth.


    # Choices Involved in Managing Risk


    An organization has four choices when faced with risk:


    +   - Risk avoidance

    - Risk acceptance

    - Risk transference

    - Risk mitigation


    The following sections will explore each of these options further.'
