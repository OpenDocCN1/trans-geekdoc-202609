  md: 'These are some of the issues and challenges that developers and administrators
    face migrating to the cloud:


    **Multitenancy** This is the concept of sharing resources with other cloud customers
    simultaneously.


    **Third-Party Admins** Administrators in the cloud data center have physical access
    to the devices that contain customer data, but they are not under the control
    of the customers.


    **Deployment Models** (Public, Private, Community, Hybrid) In many cloud deployments,
    the customer will no longer have control of the physical hardware that contains
    their data; in the traditional environment, software developers did not have to
    consider or contend with the possibility that the programs would be running on
    hardware that was not owned and/or controlled by the organization using the software.


    **Service Models** (IaaS, PaaS, and SaaS) Developers may or may not have control
    over the particular infrastructure, platform, or even application stack that they
    must work with.


    Another area of complexity and concern for the CCSP is of understanding the appropriate
    use and design of encryption technologies in the cloud and with cloud applications.
    Encryption is one of the more effective control mechanisms for securing digital
    data and, in many cases, is the only viable option for the cloud customer for
    securing data because the customer won''t have administrative or physical control
    of the cloud resources and infrastructure.


    Not all applications will run effectively or securely in the cloud. They must
    be examined on a case-by-case basis based on these factors and characteristics
    in mind.


    # # Common Cloud Application Deployment Pitfalls


    Common pitfalls that developers face when deploying cloud applications include
    whether the same functionality will be available on-premises versus off-premises,
    poor documentation and training, tenancy separation, and the use of secure and
    validated APIs are all significant challenges developers face in deploying applications
    in the cloud environment. We will examine these issues in the following sections.


    # # On-Premises Apps Do Not Always Transfer (and Vice Vers)


    On-premises applications (or "on-prem" applications as they are often called)
    are designed to run in a traditional enterprise environment where data is accessed,
    processed, and stored locally. Moving them to the cloud is not always practical
    or possible.


    Traditional enterprise application developers often do not have to contend with
    speed or bandwidth issues due to running on a local area network (LAN). A lack
    of routing involvement and high-speed switches make these very quick and responsive
    even if code is sometimes not well written. One example be when the application
    makes numerous calls in order to assemble a single piece of data, as opposed to
    making a single call and collecting all at once. These design issues can slow
    a cloud application down to the point that it'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'simply does not function properly. These calls create numerous sessions and
    take up processor and memory resources, and eventually entire systems can slow
    to a crawl.


    Traditional on-premise applications are not typically asked to share resources
    such as CPU, RAM, and bandwidth, allowing poorly designed code to run adequately
    on a faster local network but failing to meet expectations when moved to the cloud.


    # Poor Documentation


    The lack of proper documentation is not a new risk introduced by cloud computing,
    but it is instead a harsh reality in our field. Developers are constantly being
    goaded to rush applications into production, while documentation is a slow, methodical
    process that does not add to functionality or performance. Moreover, the skills
    for software design don’t often overlap into the skillset for technical documentation,
    so the two efforts are largely performed by different people, which adds another
    layer of cognition and delay to the process.


    Moreover, in organizations that use custom, proprietary software in a traditional
    environment, it is very possible that no documentation exists for moving the application
    to the cloud because it has never been tried before. During migration, developers
    do not have any guidance to assist them in this situation.


    # Not All Apps Are Cloud Ready


    Some applications, specifically database applications, might run even better in
    the cloud. Typical storage is faster than older enterprise spinning disks, and
    the data usually has a much smaller distance to travel in order to compute and
    storage components because they are all stored in the same logic units.


    However, they are not all ready for the cloud. Encryption, code must be reevaluated
    and altered to run effectively in the cloud. Encryption may be needed that had
    not been used in the past, and a host of other issues exists. Even though some
    apps will eventually run successfully in the cloud, they are not immediately ready
    and may require code or configuration changes in order to work effectively.


    # Tenancy Separation


    In the traditional enterprise, where all infrastructure and resources are owned
    and controlled by the organization, there is no risk of other tenants accessing
    the organization’s data through “data bleed” between applications, OSs, images,
    and users. The exact opposite is true of the cloud environment: all possibilities
    exist, the risk of each must be addressed by significant use of countermeasures
    that ensure access control, process isolation, and denial of guest/host escape
    attempts...and all these countermeasures will be dependent on remote administration
    (and will likely require significant negotiation and cooperation with the provider).


    # Use of Secure, Validated APIs


    One feature that makes cloud-based operations so desirable is the flexibility
