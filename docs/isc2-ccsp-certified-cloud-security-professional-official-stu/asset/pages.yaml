- pgno: 283
  md: 'You may not have to have a detailed knowledge of each of these laws and regulations,
    but you should be able to easily identify them and give a brief explanation of
    what they are about and where they fit into the realm of cloud computing. This
    chapter will not explore ECPA, FERPA, and DMCA in more detail, but the following
    sections will take a closer look at HIPAA, GLBA, and SOX.


    # FedRAMP


    Although it''s not a law, it is helpful for you to know about FedRAMP. FedRAMP
    is a US federal program that mandates a standardized approach to security assessments,
    authorization, and continuous monitoring of cloud products and services. FedRAMP
    certification can be quite costly and difficult to achieve but is required for
    cloud hosting services provided to a US government agency or contractor.


    # Health Insurance Portability and Accountability Act of 1996 (HIPAA)


    The federal Health Insurance Portability and Accountability Act (HIPAA), enacted
    in 1996, is a set of federal laws governing the handling of electronic health
    information (PHI). The stated purpose of the law when it was enacted was to make
    it easier for patients to access their own medical data and move it between medical
    providers. However, after a decade of changes, it is more about the adoption of
    national standards for electronic medical transactions and national identifiers
    for providers, medical insurers, and employees.PHI can be stored and processed
    in the cloud but must have adequate security and protections in place.


    The Office of Civil Rights (OCR) is the federal enforcement arm of the Department
    of Health and Human Services (DHHS). They conduct audits, or subcontract to third
    party to perform such audits, and are responsible for reporting to DHHS negative
    audit findings, policy violations, unreported breaches, and questionable activity.
    DHHS has the authority to impose fines, restrictions, or remedial measures based
    on OCR findings.


    # HIPAA, the Privacy Rule, and the Security Rule


    When HIPAA first passed in the 1990s, privacy of patient information was the primary
    concern. The Internet was still in its infancy and no one had ever thought of
    a data breach of PHI, because it had never happened. The first primary regulation
    promulgated by the Department of Health and Human Services (DHHS) was the Privacy
    Rule. It contained language specific to maintaining the privacy of patient information
    as it was traditionally stored and used, on paper. It was also one of the first
    regulations in the United States to specifically address privacy.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    With the explosion of networking, digital storage, and the Internet came the Security
    Rule and the Breach Notification Rule, followed by the Health Information Technology
    for Economic and Clinical Health (HITECH) Act of 2009, which provided financial
    incentives for medical practices and hospitals to convert paper recordkeeping
    systems to digital formats. Data breaches began to happen more and more often,
    this was an attempt to address issues surrounding this explosion in electronic
    digital storage of medical information while cloud computing was still in its
    infancy.


    The Security Rule has attempted to address the problems encountered with explosion
    of patient data and medical records processing and storage. As a result, there
    are now both a Privacy Rule and a Security Rule associated with HIPAA. For more
    information, see www.hhs.gov/hipa/for-professionals.


    # Gramm-Leach-Bliley Act (GLBA)


    The Gramm-Leach-Bliley Act (GLBA), also known as the Financial Services Modernization
    Act of 1999, was created to worry concern customers that this type of consolidation
    might detract from individual privacy, so GLBA also includes great many provisions
    specifying the kinds of protections and controls that financial institutions are
    required to use for securing customers'' account information. For example, it
    requires all financial institutions to have a written information security officer
    named and given adequate resources in order to implement the plan.


    For more information on GLBA, visit www.fdic.gov/regulations/compliance/manual/8/VIII-1.pdf.


    # Sarbanes-Oxley Act (SOX)


    At the latter part of the last century, a large number of companies experienced
    total and unexpected financial collapse because of fraudulent accounting practices,
    poor audit practices, inadequate financial controls, and poor oversight by governing
    boards of directors. Some of the companies involved are now a distant memory (Enron,
    WorldCom, and Adelphia, for example). As a result, in 2002 the Sarbanes-Oxley
    Act (SOX) was enacted as an attempt to prevent these kinds of poor practices and
    fraudulent activities occurring in the future. It applies to all publicly traded
    corporations in the United States.


    The Securities and Exchange Commission (SEC) is the organization responsible for
    establishing SOX standards and guidelines and conducting audits and imposing subsequent
    fines should any be required.


    If you are interested in learning more about the Sarbanes-Oxley Act, visit www.sec.gov/about/laws/soa2002.pdf.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# International Laws


    International laws determine how to settle disputes and manage relationships between
    countries. These include the following:


    +   - Conventions establishing rules expressly recognized by member countries
    (like the Geneva Convention regarding laws of armed conflict)

    - Customs as they are practiced in a country and accepted as law

    - General principles of law recognized by civilized nations (such as the right
    to a trial of some if accused)

    - Judicial decisions or precedent as it has developed over time in particular
    instance

    - Trade regulations, including import agreements, tariff structures, and so forth

    - Treaties, which can be created to solve a dispute (such as a war) or to create
    alliances


    # Laws, Frameworks, and Standards Around the World


    Sovereign countries also have their own laws, applicable to their own jurisdictions.
    The effects of a country''s laws does not cease at its borders, though. If a citizen
    from another country, or one of the country''s citizens operating outside that
    country, breaks that country''s law, they can still be subject to prosecution
    and punishment by that country. For instance, a hacker who uses the Internet to
    attack a target in another country could be subject to that their own country''s
    security laws. The hacker might be extradited (forcibly apprehended) in their
    own country and transported to the country where the law was broken) Because there
    is no global uniformity in how these laws are written and applied, the practitioner
    is strongly advised to consult with counsel whenever legal matters arise.


    It''s important to understand the different distributions of laws and principles
    of various nations because cloud providers and customers may be operating in many
    different jurisdictions. The cloud is not limited to the borders of any given
    country.


    While many of the legal definitions and principles in the United States apply
    to other parts of the world, there are some significant differences. The European
    Union (EU) has for years taken a much stronger stance than the United States.
    In fact, the EU treats personal privacy protections for data in electronic format
    as a human right, while the United States has no formal, yet personal privacy
    law. Instead, the United States has certain laws (discussed in the previous section)
    that deal with personal privacy for people who engage in activities such as financial
    services, medical care, education, and so forth. The EU, on the other hand, is
    well known for its “opt-in arrangement in the United States [sic]. This means
    that, generally speaking, in order for someone to access or use an individual''s
    personal data or private information, that individual must first grant their permission,
    effectively opting in to that specific instance of sharing information. In the
    United States, the usual model is the opposite, wherein individuals must notify
    any party that the individual has'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    shared information with that the data cannot thereafter be shared outside the
    limits of that initial agreement.


    To clarify, let''s use the example of a bank account. When a person goes to the
    bank and opens an account, the bank asks for a set of personal information, such
    as the person''s name, Social Security number, home address, and so on. The person
    is granting the bank access to that voluntarily, sharing it with the bank in order
    to get a bank account. In the United States, the bank is required by (GLBA) to
    ask the person if they want to opt out of any voluntary information-sharing activity.
    If the person doesn''t want to share the data with any other entity (for instance,
    the bank might sell that information to other businesses), the person must give
    the bank a written declaration they are opting out. If the person prefers, the
    bank is free to share however they fit. GLBA requires that the bank ask the person,
    in hard copy, if they want to opt out of any data-sharing activity, at least once
    a year for every year that bank account stays. In the EU, on the other hand, if
    a person opens a bank account, the bank must ask the person if they would allow
    the bank to share the person''s personal data with any other entity. The bank
    would not be allowed, by law, to share any of that person''s data unless the person
    grants permission to the bank to do so.


    Another important concept to consider in dealing with various countries is their
    approach to PII. Information that can be used to identify an individual is often
    referred to in the industry as personally identifiable (PII). It can include the
    name and address of the individual. In the EU, PII also includes a person''s mobile
    phone number, IP address, and other elements. Although people often voluntarily
    disclose their PII to a variety of entities, this is done with the expectation
    that those entities will protect their PII in accordance with their respective
    countries'' regulations. In the EU, the GDPR regulates the distribution of PII.
    Many countries use the GDPR as a basic model for their own laws. Table 10.2 provides
    an overview of various countries and how their laws relate to the GDPR.


    # TABLE 10.2 Countries and their laws relating to the EU Data Directive and Privacy
    Regulation


    | Nation | Federal PII law that complies with the EU Regulation | Notes |

    |---|---|---|

    | The EU | Yes | The EU comprises 27 member states (countries). The EU treats
    PII as a human right, with severely stringent protections for individuals. |

    | United States | No | Personal privacy rights are often delineated in industry-
    and state-specific laws (such as GLBA for financial services and HIPAA for medicine),
    but there is no overarching federal law ensuring individual privacy. |'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# TABLE 10.2 Countries and their laws relating to the EU Data Directive and
    Privacy Regulation (continued)


    | Nation | Federal PII law that complies with the EU Privacy Regulation | Notes
    |

    |---|---|---|n| Australia and New Zealand | Yes | Laws in these countries conform
    to the EU policies. |

    | Argentina | Yes | Local law is specifically based on the EU guidance. |

    | EFTA | Yes | A four-member body that includes Switzerland, Norway, Iceland,
    and Liechtenstein. Swiss law, in particular, provides stringent privacy protections,
    particularly for banking information. |

    | Israel | Yes | |

    | Japan | Yes | |

    | Canada | Yes | The Personal Information Protection and Electronic Documents
    Act (PIPEDA) conforms to the EU Privacy Regulation. |


    > NOTE Israel and Japan won''t be discussed in more detail in this chapter, but
    for exam purposes it is important to remember that they also have personal laws
    that are accepted by the EU for purposes of compliance with the Privacy Regulation.


    The following sections sample some laws in nations that have developed in response
    to privacy and data security concerns over the past 30 years. This should give
    the CCSP candidate a broader view of how the world perceives privacy and in particular
    some of the legal, regulatory, and operational challenges that come with working
    in a global environment.


    # EU General Data Protection Regulation


    The EU General Data Protection Regulation (GDPR) is probably the most significant,
    powerful personal privacy law in the world. This overarching regulation describes
    the appropriate handling of personal and private information of all EU citizens.
    Any entity (be it a government agency, private company, or individual) gathering
    the PII of any citizen of the EU is subject to the GDPR.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    The GDPR addresses individual personal privacy by codifying these seven principles:

    Notice The individual must be informed that personal information about them is
    being gathered or created.


    Choice Every individual can choose whether to disclose their personal information.
    No entity can gather or collect personal information about an individual without
    individual''s explicit agreement.


    Purpose The individual must be told the specific use information will be put to.
    This includes whether the data will be shared with any other entity.


    Access The individual is allowed to get copies of any own information held by
    any entity.


    Integrity The individual must be allowed to correct any of their own information
    if it is inaccurate.


    Security Any entity holding an individual''s personal information is responsible
    for protecting that information and is ultimately liable for any unauthorized
    disclosure of that data.


    Enforcement All entities that have any personal data of any EU citizen understand
    that they are subject to enforcement actions by EU authorities.

    This list conforms to a set of principles created by the Organisation for Economic
    Cooperation and Development (OECD); The OECD is a standards organization made
    up of representatives from many countries, and it publishes policy suggestions.
    Its standards are not legally binding and do not affect the effect of a treaty
    or other law.


    ![](img/914e4f10ad3f2426a517172a28cd7161_288_0.png)


    > This is an important distinction to be made: although the OECD''s principles
    are not legally binding, the EU''s GDPR, which largely conforms to the OECD''s
    principles, is legally binding.


    In addition to these principles, the GDPR also resulted in a principle unique
    to the EU: the "right to be forgotten." Under this principle, any individual can
    notify any entity that has PII for and instruct that entity to delete and destroy
    all of individual''s PII in that entity''s control. This is a very sensitive and
    powerful individual right, which Google disputed when it was first proposed, claiming
    that the company would find it impossible to comply. The European Union High Court
    decided in favor of the right to be forgotten and against Google, and Google had
    to choose to accept compliance in order to operate in the EU.


    Another provision of the GDPR was to prohibit any entity collecting the PII of
    any EU citizen if that entity existed within the jurisdiction of a country that
    did not have a national law that explicitly supported all the provisions of the
    GDPR. This meant, for instance, that any company in the United States would not
    be allowed to do business with EU citizens. The United States does not have a
    federal law that directly maps to the GDPR.'
