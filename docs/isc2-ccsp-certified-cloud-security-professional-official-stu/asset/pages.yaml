    # Audit Processes, Methodologies, and Cloud Adaptations


    An audit is a review of an environment in order to determine if that environment
    is compliant with a standard, law, configuration, or other mandate. The audit
    process in cloud computing, while very much as in any other environment, does
    have some challenges, which we explore in more detail.


    # Virtualization


    Cloud computing requires virtualization; virtualization complicates auditing.
    The auditor is no longer looking at physical devices but software instances or
    abstractions of devices. Even the network layer, software-based virtual switches
    and routers are responsible for moving traffic around the cloud environment. That
    makes it hard for the auditor to identify all machines in the scope of the audit;
    the audit is not a simple matter of locating and enumerating devices in a room
    at best, the auditor will have access to a management console which allows to
    view the environment. This can at the very be confusing and difficult for those
    unaccustomed to cloud computing.

    There is also the need to understand the control mechanisms in a virtualized cloud
    environment. Virtualization requires a knowledge base that auditors unfamiliar
    with cloud technology will find confusing. One example is auditing access to the
    hypervisor. The auditor can view the accounts of the administrators but may not
    be able to speak to them as they may reside in a different country.


    # Scope


    Audit scope lists which elements, participants, and systems will be in the audit.
    Scoping must be performed before the audit begins so that everyone involved (the
    auditors, the organization being audited, users, etc.) understands the breadth
    and depth of the audit, how long it may take, and what resources will be utilized/affected.

    Defining the scope of an audit in a cloud-computing environment can also present
    challenges. You are conducting an audit on the infrastructure of the cloud provider,
    the'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Chapter 10 ■ Legal and Compliance Part 1


    platform, or the applications involved? Depending on the service model you are
    using, audit scope can take many different forms. For instance, if you are simply
    using the provider as a software as a service (SaaS) vendor, should your audit
    scope involve the underlying infrastructure? Many vendors provide third-party
    audits of those services to satisfy this need so that customers'' auditors can
    focus on the higher abstraction levels (that is, the providers'' auditors will
    review the hardware in the data center, and the customers'' auditors will review
    the application and usage).


    Additionally, the scope of the audit may or not be confined to geographical or
    political boundaries. The auditor may only be auditing infrastructure as a service
    (IaaS) within the confines of a certain country. Anything outside these boundaries
    may be out of scope, depending on the engagement.


    # Gap Analysis


    Once the audit has been, the audit results should show both where the organization
    is currently compliant and where it is not compliant. The gap analysis is a review
    of the differences, in areas where the organization is not compliant with the
    given standard/regulation. The purpose of gap analysis is to aid in determining
    how to reach the desired state (full compliance).


    Generally, best practice is that the auditors do not take part in providing specific
    recommendations on how to close gaps—auditors do not recommend particular technologies/systems/products
    for achieving compliance this may lead to a conflict of interest (where the auditors
    take part in business functions, diluting the auditors'' independence). Moreover,
    the affected departments within the organization should also not take part in
    the audit; instead, personnel from outside the target departments should review
    the report as they are more able to offer unbiased opinion and suggestions.


    # Restrictions of Audit Scope Statements


    If an auditor finds that the organization has not disclosed information/artifacts/access
    for the auditor to perform a successful and fair audit, the auditor may issue
    a “scope limitation” statement or otherwise qualify the audit report/results.
    This indicates to any recipient of the audit that the auditor did not professionally
    able to render judgement due to the target''s restriction to wherein elements
    to the audit.


    For example, an auditor may review Ostrich, for PCI compliance. The management
    of Ostrich creates an audit scope that does not allow the auditor to review the
    point-of-sale systems where customer credit cards are presented at the time of
    purchase. Because PCI DSS requires that cardholder data is protected from the
    time of collection, the auditor''s access to the point-of-sale systems is necessary
    to determine whether Ostrich is performing the data collection in a secure manner
    and whether compliant with the standard. When the auditor completes the audit
    report, the auditor, may issue a “qualified opinion,” stating that the report
    is not sufficient, in the auditor''s estimation, to fairly and completely render
    a sound judgement. The auditor may also issue a “disclaimer of opinion,” stating
    that the audit report is not complete and should not be taken as wholly accurate.'
