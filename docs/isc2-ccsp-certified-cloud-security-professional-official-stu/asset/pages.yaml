    Regulatory Violations Regulations affect almost all IT operations, by a private
    cloud adds risk that the organization will not be able to maintain compliance.
    The increased opportunity and efficiency for disseminating information also increases
    the likelihood-of violating applicable regulations.


    Natural Disasters All operations are prone to disruption from natural disasters,
    and no geographical region is free of risk from this threat. They only differ
    in location. (Location and climate dictate the types and frequencies of disasters,
    such as hurricanes, floods, wild-fires, tornadoes, earthquakes, volcanoes, and
