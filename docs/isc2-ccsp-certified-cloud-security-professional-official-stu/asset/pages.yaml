    # Cloud Provider Responsibilities: Mapping and Selection of Controls


    No matter what design and architecture options are employed in the cloud data
    center, the cloud provider (like any IT infrastructure owner or operator) must
    properly controls according to the relevant regulatory frameworks and the planned
    usage. This is especially true of, but not limited to, regulation concerning personally
    identifiable information (PII).


    Published governance should guide the selection of appropriate controls for every
    aspect of data center operation (physical, logical, administrative, personnel,
    intangible, and tangible assets). All security policy should be based on this
    guidance, and all controls should be justified according to the particular regulations
    and standards applicable to the data center and its customers.


    There are many types of regulation and appropriate standards, and they are discussed
    throughout this. The cloud provider must understand which are applicable to the
    data center (in terms of both location and operation) and to the customers (in
    terms of both location and locations). For instance, each physical location will
    be subject to the jurisdiction of relevant laws. The "physical location" includes
    both where the data center is physically situated and the location of each cloud
    center.


    For example, a cloud data center in Park City, with customers in Omaha and Edina,
    would be subject to not only the breach notification and privacy laws in Utah
    but also those of Nebraska and Minnesota, as well as any municipal codes regarding
    privacy and data protection for those particular cities.


    In addition to physical location, the type of operations taking place in the cloud
    data center will dictate which regulations are applicable (and therefore, which
    controls are'
