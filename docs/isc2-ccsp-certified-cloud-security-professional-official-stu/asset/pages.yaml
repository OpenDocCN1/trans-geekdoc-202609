- pgno: 312
  md: '# The Impact of Diverse Geographical Locations and Legal Jurisdictions 273


    For example, an organization offered a new product, but the risk of creating that
    product might result in an employee dying once per month. The organization might
    be willing to take on that risk if the potential profits were high, and the employees
    might be willing to take on that risk if the pay was high enough. However, regulators
    might have a dim view of offering such a product at the possible cost of human
    life, so the risk appetite of the organization necessarily be limited by regulation.


    The decision to risk human life is not necessarily unethical or immoral. Deep
    sea fishing has one of the most fatal professions in the United States for more
    than one hundred years, and consumers have not stopped buying seafood on masse
    out of protest and loathing at the potential human cost of acquiring their meals.
    People engaged in commercial fishing choose to risk their lives to make very good
    money and seem to enjoy their work, regulators mandate reasonable safety requirements
    for the industry, and consumers enjoy seafood.


    ![](img/914e4f10ad3f2426a517172a28cd7161_312_0.png)


    Once the stakeholders have been adequately identified, the organization can begin
    building the policies needed in order to operate safely.


    Identifying and engaging relevant stakeholders is vital to the success of any
    cloud computing discussions or projects. But there are also challenges that may
    need to be overcome to effectively engage them.


    For instance, policies must be malleable enough to reflect changing business opportunities,
    requirements, and operations. This may never been truer than in the example of
    an organization migrating from a legacy environment to the cloud. Almost surely,
    the organization had policies that acknowledged the risks and opportunities of
    that environment (the legacy, traditional IT environment) and dealt with them
    accordingly. However, the risks and benefits in the cloud are much different,
    so the policies must be revisited, the guidance and stakeholder input reexamined,
    and new policies generated, amended or appended to the cloud.


    The variety and vagaries of jurisdictional law may make the regulatory stakeholders
    and their input especially complicated for cloud services and management. Instead
    of one single regulatory framework when considering policy, the organization must
    take into account every jurisdiction where the cloud provider might be storing,
    transmitting, and processing the organization''s data as well as every jurisdiction
    where any of the organization''s customers might reside. This latter part is especially
    troublesome, because when an organization operates in the cloud, it is assumed
    that the potential customer base is the web, meaning that the jurisdiction of
    the organization''s customer is the entire planet.


    It would be impossible to satisfy all the needs and requirements of every jurisdiction
    in the world. Too many of them inherently conflict with others. So a significant
    portion of the effort that goes into promulgating policy is determining which
    jurisdictional mandates are most likely to bear on the organization''s operations,
    where most of the end clientele will reside, where most of the cloud functions
    will take place, and so forth. It''s a cost-benefit analysis of a lesser scale:
    instead of determining which organization'
