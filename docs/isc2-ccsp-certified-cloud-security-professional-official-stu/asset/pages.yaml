- pgno: 293
  md: '254 Chapter 10 ■ Legal and Compliance Part 1


    # The Difference between Laws, Regulations, and Standards


    So what is the difference between all of these laws, regulations, standards, and
    frameworks? Laws are legal rules that are created by government entities such
    as legislatures. Regulations are rules that are created by governmental agencies.
    Failure to properly follow laws and regulations can result in punitive measures
    that include fines and imprisonment.


    Standards dictate a reasonable level of performance; standards can be created
    by an organization for its own purposes (internal) or come from industry bodies/trade
    groups (external). An organization can choose to adhere to a standard selects
    in some cases, for some industries and jurisdictions, compliance with standards
    is imposed by law. A standard can reduce liability; demonstrating that compliance
    represents due.


    Laws, regulations, and standards can also inform the information security industry,
    often in similar or overlapping ways. For example, there are laws, regulations,
    and standards that dictate and describe what sorts of data should be considered
    sensitive and personal information.


    Rules related to the handling of sensitive data might come from another source,
    well as contractual agreements. For instance, Payment Card Industry (PCI) compliance
    is wholly voluntary, but it is a requirement for those who choose to participate
    in credit card processing (namely, merchants who accept credit card payments).
    Those participants agree to submit to PCI oversight, including audits and review
    of the participants'' adoption and implementation of applicable controls. Complete
    with enforcers. For more information about the PCI council and the PCI Data Security
    Standard, go to www.pcisystandards.org.


    Regardless of whether you''re dealing with laws, regulations, or standards, everyone
    expects a reasonable degree of transparency—in other words, making things clear
    for all types of regulators and interested parties, at least that degree is expected
    and possible.


    ![](img/914e4f10ad3f2426a517172a28cd7161_293_0.png)


    There are descriptions of the differences between laws and contracts at the beginning
    of this chapter; privacy data can be affected by both laws and contracts. Under
    a law, your organization has to answer to the government in the event of a PII
    breach/loss; under a contract, your organization will have to answer to the other
    party/parties of the contract.


    # Potential Personal and Data Privacy Issues in the Cloud Environment


    In the decentralized nature of cloud computing, geographic disparities make personal
    privacy and data privacy critical issues. In the following sections, we will discuss
    some of the challenges to protecting and managing personal privacy and data in
    such a decentralized, dispersed, and global environment.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Potential Personal and Data Privacy Issues in the Cloud Environment


    # eDiscovery


    Electronic discovery (eDiscovery) refers to the process of identifying and obtaining
    electronic evidence for either prosecutorial or litigation purposes. Determining
    which data in a set is pertinent to a specific legal case can be difficult. Regardless
    of whether information is stored in databases, records, email, or files, identifying
    and locating applicable data can be quite challenging in the cloud due to the
    decentralized nature of the technology. Moreover, because cloud storage so often
    takes the form of a multitenant environment, there is also complication in identifying
    which specific customer might be located in the same storage volume, the same
    drives, or the same machines. Trained professionals in the practice of eDiscovery
    are rare, and most organizations do not have these people in their employ. When
    faced with eDiscovery, an organization would probably be served by hiring a consultant
    who is expert and licensed for the purpose. Anyone performing this activity should
    be familiar with relevant industry standards and guidance, such as ISO 27050 (www.iso.org/standard/63881.html)
    and CSA guidance (https://cloudalliance.org/artifacts/csa-security-guidance-domain-legal-issues-contracts-and-electronic-discovery/).


    It is important for the cloud provider to understand the user''s data under various
    laws, SLAs, and other contractual agreements that could need arise. This is especially
    important if international boundaries are crossed in the process.


    As demand for eDiscovery increases, technology vendors have produced products
    to meet this need. Some cloud providers offer SaaS eDiscovery solutions; cloud-based
    applications that can perform search and collection of pertinent data (often the
    provider''s own customers). There are also host-based tools that can be used to
    locate applicable information on specific machines (both hardware and virtualized).


    # Chain of Custody and Nonrepudiation


    All evidence needs to be tracked and monitored from the time it is recognized
    as evidence and acquired for that purpose until it is delivered to a court or
    law enforcement agency. Clear documentation must record which people had access
    to the evidence, where the evidence was stored, what access controls were placed
    on the evidence, and what modifications or analysis was performed on the evidence.
    We call this record and the principles for creating it a chain of custody.


    Being able to demonstrate a chain of custody, where only specific, trusted personnel
    had access to the material and with no gaps in the timeline or loss of control,
    is very important for making an argument in court using. Any discrepancy in the
    chain of custody introduces doubt about the disposition and content of the evidence.
    Although this does not make the evidence inadmissible, it does allow an opportunity
    for opposing counsel to reduce the power of your narrative. Any doubt regarding
    a particular piece or set of evidence will make that evidence much weaker.


    When creating policies for maintaining a chain of custody and conducting activities
    requiring the preservation and monitoring of evidence, it is best to get input
    and guidance'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'from counsel and perhaps even to use specialized consultants who are trained
    and experienced in this practice area.


    The chain of custody provides nonrepudiation for the transactions detailed in
    the evidence. Nonrepudiation means no party to a transaction can later claim that
    they did not take part.


    # Forensic Requirements


    Conducting forensic activity in a cloud environment is challenging. The nature
    of decentralized, off-premises data and its movement, and processing across geopolitical
    boundaries all lead to a complex and perplexing environment when attempting to
    gather and analyze forensic data.


    The international nature of cloud forensics has created the demand for international
    standards that are applicable globally. Such standards help establish procedures
    across borders in effort to limit the challenges to scientific findings.


    ISO has developed a set of global forensics standards:


    +   - ISO/IEC 27037:2012: Guide for collecting, identifying, and preserving electronic
    evidence

    - ISO/IEC 27041:2015: Guide for incident investigations

    - ISO/IEC 27042:2015: Guide for digital evidence analysis

    - ISO/IEC 27043:2015: Incident investigation principles and processes

    - ISO/IEC 27050-1:2016: Overview and principles for eDiscovery


    # Conflicting International Legislation


    The Internet and cloud facilitate international commerce, allowing individuals
    and businesses to trade goods and services worldwide. This can lead to legal difficulties
    because jurisdictions might have conflicting laws for similar activity. For instance,
    online gambling is against the law in the United States, but is perfectly legal
    in many other parts of the world; providing services to American players may be
    subject to prosecution in the US (the "Online Gambling" case). Cloud providers
    may also have to comply with local laws that differ from the laws in the country
    where the service is headquartered or forced to deviate from their own internal
    policies as well; for example, in order for Google to provide services in China,
    Google is required to disclose user behavior to the Chinese government it is readily
    apparent that this reporting being used in Google''s home country (the US) but
    illegal in China (Chinese citizens engaged in "dissident" activity or participating
    in LGBT-oriented activities can face criminal charges.


    It is imperative that the CCSP be aware of the various laws affecting their organizations''
    activities and users in the jurisdictions in which they do their business, including
    the location of cloud data centers, providers, and end users. Contracts with cloud
    providers must be reviewed in detail for legal impacts in both the provider''s
    and customer''s jurisdictions.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Potential Personal and Data Privacy Issues in the Cloud Environment


    Finally, as practitioners in the field of information security, we should all
    be aware of legal developments that might cause conflicts to arise in our international
    operations, such as laws that might dictate behavior in one jurisdiction that
    is illegal in another. (The CLOUD Act requires companies in the US to disclose
    data to federal law enforcement, even if that data is located outside the US and
    the disclosure might be against the law in the jurisdiction where the data is
    located.)


    # ## Real World Scenario


    # ### Online Gambling


    Sometimes, what is against the law in one jurisdiction is not against the law
    in another. In those circumstances, extradition can be difficult. If the person''s
    actions are not illegal in their home nation and another nation wants arrest them
    and bring them to trial, the home nation might refuse any such requests.


    This was the case for David Carrutters, the CEO of a British-based online gambling
    company. In 2006, Carrutters was arrested by federal agents in the United States
    while he was changing planes in Dallas, between a flight from the UK and to Costa
    Rica. The US government charged Carrutters with “racketeering”, stemming from
    the use of his company''s services by US citizens engaging in online gambling.


    Online gambling, while illegal in the United States, is not illegal in the UK
    or Costa Rica, nor in other parts of the world. It would have been difficult for
    the United States to extradite Carrutters from either the UK or Costa Rica because
    of this difference in the laws of the various countries, so federal agents waited
    until he was in the jurisdiction of the United States—the moment his plane touched
    down.


    Carrutters served 30 months in prison.


    # ## Cloud Forensic Challenges


    The distributed model of cloud computing presents a number of challenges in the
    area of forensics. Data location, collection mechanisms, and international laws
    are all factors when dealing with situations involving forensic investigations.


    Do you know where your data is to start? Are some of it on-premises or off-premises,
    and in which case is the data located? Is it distributed across multiple data
    centers, and if so, are data centers across international boundaries? Do international
    laws hinder your abilities to collect forensic information? For example, does
    the law in a certain country/jurisdiction prevent you from capturing certain types
    of data (detailed user activity records, for instance)?


    Do you have a working relationship with your cloud computing vendors? Do your
    SLA or other contract delineate the rights and responsibilities for data collection
    and'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'maintenance between the customer and provider? Are you authorized, as a cloud
    customer, to retrieve forensic data from the cloud data center? What happens if
    you accidentally col-lect another customer''s data from a multitenant environment?
    Will your forensic tools be suitable for a virtualized environment? What level
    of cooperation is necessary on the part of the provider?


    # Direct and Indirect Identifiers


    Privacy information can take many forms. In some jurisdictions, under certain
    laws, a person''s name, birthdate, and home address are considered PII; in other
    countries/jurisdictions, the person''s mobile phone number and IP address are
    PII as well; entirely depends on the laws of those jurisdictions. These PII elements
    are sometimes referred to as direct identifiers. Indirect identifiers are data
    elements that immediately reveal a specific individual.


    There are also indirect identifiers, which should also be protected. Indirect
    identifiers are the characteristics and traits of an individual that, when aggregated,
    could reveal the identity of each person. Each identifier by itself is usually
    not sensitive, but if enough collected they provide sensitive information. For
    example, if we take a list of identifiers that are not sensitive, such as a man
    in Wisconsin and currently living in New Orleans who owns a dog and performs work
    in the information security field, we might reveal the identity of the author
    of this book and his identity from information elements that are not sensitive
    (location, workplace, pets, industry, and so on).


    The act of removing identifiers is known as anonymization; certain jurisdictions,
    laws, and standards require the anonymization of data, including both direct and
    indirect identifiers.


    # Forensic Data Collection Methodologies


    In traditional environments, forensic data collection is performed in a relatively
    contained environment (the organization''s enterprise) with a single owner (the
    organization itself). The collection process is challenging in a traditional environment;
    care must be taken to ensure data is modified as little as possible and captured
    in a manner that is consistent, exacting, and repeatable. Certain techniques,
    like forensic imaging, are used to reduce the possibility that captured data is
    not affected when copies are made.


    In the cloud, the practices and tools used in the traditional environment are
    not always feasible or usable. There are multiple owners of the resources; depending
    on the cloud service and deployment models, and the cloud provider or the customer
    might have possession/ownership/or administrative rights to certain systems/aspects
    of the environment. Moreover, the additional concern of third-party data (other
    cloud customers sharing the same underlying infrastructure) might be affected
    by forensic collection complicates the process.


    In many situations, forensic collection of cloud data will require the participation/involvement
    of the cloud provider; the customer will not be able (legally or technically'
