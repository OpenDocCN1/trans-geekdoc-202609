- pgno: 45
  md: '# Chapter 1 ■ Architectural Concepts


    Assets can be tangible or intangible. They can include hardware, software, intellectual
    property, personnel, processes, and so on. An example of tangible assets would
    be things like routers and servers, whereas intangible assets are generally something
    you cannot touch, such as software code, expressions of ideas, and business methodologies.


    # Quantifying Benefits and Opportunity Cost


    Once you have a clear picture of what your organization does in terms of lines
    of business and processes, you can get a better understanding of what benefits
    the organization might derive from cloud migration as well as the costs associated
    with the move.

    Obviously the clearest driver pushing organizations toward cloud migration at
    cost savings, and that is a significant and reasonable consideration. The next
    few sections describe some aspects of that consideration.


    # Reduction in Capital Expenditure


    If your organization buys a device for use in its internal environment, the capacity
    of that device either be fully utilized (or more likely) not. If the device is
    used at its fullest capacity, then it''s quite likely that the function for which
    it is needed may experience inefficiencies at some point. Even a small spike in
    demand for that device will overload its capacity. If the device is not fully
    utilized, then the organization has paid for something for which it is getting
    less full value. The unused or excess capacity goes to waste. In effect, the organization
    has overload for the device the organization uses the device to the point where
    it is dangerously close to overload—you cannot buy just part of a device.


    Moreover, tax benefits can be realized from the purchase of a device to have been
    accrued over years of operation, depreciation of that device/asset. With a paid
    service (such as cloud), an operational expenditure, the entire payment (per months
    or quarterly) is taxable as an expense.


    In the cloud, the organization is only paying for what it uses (regardless of
    the number of devices, or fractions of devices, to handle the load), and no more.
    This is the metered service aspect described earlier. As a result, the organization
    does not overpay these assets. However, cloud providers have excess capacity available
    to be apportioned to customers, so your organization is always in a position to
    experience increased demand without capital, and significant demand without being
    overwhelmed by this rapid elasticity aspect described.


    One way on using hosted cloud services during times of increased demand. We refer
    to this as cloud bursting. The organization might have data center assets it,
    but it can''t handle the increased demand during times of elevated need (crisis
    situations, heavy holiday shopping periods, and so on), so it rents the additional
    capacity as needed from an external cloud provider. See Figure 1.1.'
