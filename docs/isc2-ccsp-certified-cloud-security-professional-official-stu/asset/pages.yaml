    \n**TABLE 10.1** Important US laws and regulations\n\n| Name | Purpose | Administrators\
    \ | Enforcers |\n| --- | --- | --- | --- |\n| The Electronic Communication Privacy\
    \ Act (ECPA) | Enhance laws restricting the government from putting wiret on phone\
