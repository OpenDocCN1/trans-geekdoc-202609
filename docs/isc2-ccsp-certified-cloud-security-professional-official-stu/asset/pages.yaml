- pgno: 262
  md: '# Business Continuity and Disaster Recovery (BC/DR)


    The goal of ITSM is to identify user needs, design an IT service that meets needs,
    successfully deploy it, enter a cycle of continuous improvements. Continuous service
    improvement management aims to ensure that IT services provide ongoing business
    value, and that the services are updated as needed to respond to changing business
    requirements.

    Obviously, the shift to cloud computing is a major example of business requirements
    changing to IT services.

    Although ITIL was designed in an era when most infrastructure was maintained and
    used exclusively on-premise, the general principles are still quite useful when
    choosing or evaluating cloud services. Both ITIL and ISO 20000-1 place a heavy
    emphasis on ensuring that IT services always deliver better business value, but
    these are some key areas/questions to consider for continuous service improvement
    in cloud environments:


    +   - Which type of cloud service model best meets your organization''s needs?
    A vendor developed a SaaS platform that can reduce the resources your organization
    must expend to keep systems up and running?


    +   - Are your users mobile? A mobile workforce makes secure network design more
    challenging. Rather than a VPN from your office to the cloud environment, you
    may need to provide cloud access to users anywhere in the world.


    +   - The selected services meet your organization''s compliance needs? Expansion
    into new markets might bring new privacy or security requirements, which will
    drive changes in the cloud services your organization is using.


    +   - Are your goals being met? SLA metrics should be tied to requirements for
    the system, and a cloud provider''s inability to meet them might necessitate a
    change of provider.


    +   - Do new cloud services provide cost, time, or resource savings? For example,
    many cloud PaaS database offerings include automatic data replication and high
    availability, which removes the need for separate backup/recovery procedures and
    equipment. Rather than conduct BC/DR exercises yourself, your organization may
    rely on a provider''s SOC 2 Type II audit report for assurance of resilience.

    Continuous service improvement relies on metrics to identify improved measures
    and to measure the effectiveness of any changes implemented. For example, page
    load time for a web app might be a key metric. Choosing a new distributed cloud
    web service that significantly reduces page loads delivers an improvement in the
    user experience for web app.


    # Business Continuity and Disaster Recovery (BC/DR)


    Business continuity and disaster recovery (BC/DR) has been addressed in other
    chapters of this book, relative to specific topics. Here, we cover some of the
    general aspects and approaches, with some additional focus on continuity.'
