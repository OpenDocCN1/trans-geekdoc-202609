- pgno: 267
  md: '# Relocation


    Depending on the nature of the event and disaster and the specifics of the plan,
    the organization may choose to evacuate and relocate those personnel involved
    in critical operations to a specified alternate operating location. Prior to the
    existence of cloud capabilities for the purpose of backing up and restoring data
    at a secure, off-site location, hot warm and cold sites were used for this purpose,
    and a skeleton crew of critical personnel were assigned to travel to the recovery
    site for the duration of the contingency operations and recovery.


    With the advent of ubiquitous availability of cloud backup resources, the relocation
    site can be anywhere not affected by the event or disaster, as it has sufficient
    facilities for housing the personnel involved and bandwidth sufficient for the
    purpose. For instance, a hotel outside the area of effect could serve the purpose
    if it offers broadband capabilities and is additionally useful in that it fulfills
    the function of safe lodging for the critical personnel.


    If the organization considers relocation for BC/DR purposes, the plan may include
    these:


    +   - Tasking and activities should include representatives from the HR and finance
    department, as travel arrangements and payments will be necessary for all personnel
    involved in the relocation.


    +   - Sufficient support should be provided for relocating dependents and family
    members of the personnel involved in critical operations for the duration of the
    response. When a disaster affects a locality, everyone involved will rightfully
    concerned with their loved ones first and foremost. If this concern is not alleviated,
    their morale and focus on the tasks at hand will be diminished. It is better to
    assume the additional costs related to this option so to gain the full attention
    of the personnel involved in the response.


    +   - The distance of the relocation is, like all things related to the practice
    of security, a balance. You want the relocation site to be far enough away that
    it is not affected by ever caused interruption to standard operations but not
    so far that the hazard, risk, delay, and expense of travel makes its utility unfeasible
    or infeasible.


    +   - Joint operating agreements and memoranda of understanding can be used to
    establish cost-effective relocation sites at facilities belonging to other operations
    in the local area if the event or disaster only affects your organization’s campus
    (in the event of highly localized events and disasters, such as a building fire).


    | BC/DR Terminology |

    | There are several BC/DR concepts that you need to understand |

    | MAD (Maximum Allowable Downtime) How long it would take for an interruption
    in service to kill an organization, measured in time. For instance, if a company
    would fail because it had to halt operations for a week, then its MAD is one week.
    This is also'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Business Continuity and Disaster Recovery (BC/DR)


    sometimes referred to as maximum tolerable downtime (MTD). Related to this is
    the mean time to repair (MTTR), which is the average amount of time it takes to
    repair a damaged system or device that is down.


    **RTO (Recovery Time Objective)** The BC/DR goal for recovery of operational capability
    after an interruption in service, measured in time. This does not have to include
    full operations (recovery); the capability can be limited to critical functions
    for the duration of the contingency event. The RTO must be less than the MAD.
    For example, a company might have an MAD of one week, which the company’s BC/DR
    plan includes and supports an RTO of six days.


    **RPO (Recovery Point Objective)** The BC/DR goal for limiting the loss of data
    from an unplanned event. Confusing, this is often measured in time. For instance,
    if an organization is doing backups every day and is affected by some sort of
    disaster, that organization’s BC/DR plan might include a goal of restoring critical
    operations at another operating site with the last backup, which would be an RPO
    of 24 hours. The recovery point objective for that organization would be more
    than one day’s worth of data.


    **ALE (Annual Loss Expectation)** Annual loss expectation (ALE) describes the
    amount an organization should expect to lose on an annual basis due to any type
    of incident. ALE is calculated by multiplying the rate of occurrence (ARO) by
    the single loss expectancy (SLE). The rate of occurrence (ARO) is the rate of
    occurrence of a specific event or security incident one could expect in any given
    12-month period. A single loss expectancy (SLE) is the amount of expected damage
    or loss from any single specific security incident.


    # Power


    Interrupt to the normal power supply often result from events or disasters (or
    are themselves a response to an event or disaster), so BC/DR plans and activities
    must take emergency supply into account.


    Near-emergency power supply usually takes the form of battery backups, as uninterruptible
    power supply (UPS systems). These can be small units, feeding only particular
    devices or racks, or they can be large, supplying power to entire systems. Failover
    for these should be close to immediate, with appropriate line conditioning so
    that transitioning from utility power to UPS does not adversely affect the powered
    devices in any way. The line conditioner function in UPS often serves as an additional
    component of normal operations, damping surges and dips in utility power.


    ![](img/914e4f10ad3f2426a517172a28cd7161_268_0.png)


    If you ever see an exam question about the expected duration of UPS power, the
    answer will be, “UPS should stand long enough for graceful shutdown of affected
    systems.” Battery backup should only be relied to provide immediate and near-term
    power supply. Any power interruption for a longer period should be provided by
    other systems, such as generators.'
