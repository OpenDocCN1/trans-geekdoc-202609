- pgno: 278
  md: '![](img/914e4f10ad3f2426a517172a28cd7161_278_0.png)


    Domain 6, Legal, Risk, and Compliance can be bit as confusing and difficult to
    understand as some of the technology discussed throughout this book. International
    courts and tribunals weigh in laws and regulations concerning global networking.
    There is also no shortage of laws, regulations, and standards that require compliance.
    The combination of all these factors provides a rich arena for discussion.


    It is important to remember that the nature of cloud computing lends itself to
    resource sharing based on demand and access to location. Therefore, data centers
    located around the world store and run applications from multiple sources simultaneously.
    This presents challenges with security and privacy issues due to the complexity
    of local and international laws, regulations, and guidelines. In this chapter,
    I will attempt to provide a background and review of the important concepts, laws,
    regulations, and standards so that the CCSP candidate can provide solid advice
    and guidance when navigating these complex waters.


    # # Legal Requirements and Unique Risks in the Cloud Environment


    As one might imagine, the list of US and international laws, regulations, and
    standards is quite lengthy and complex. The global economy spans multiple continents,
    nation-states, and government entities. From the Asia-Pacific region to Australia
    and New Zealand, the European Union (EU), Eastern Bloc countries, and South America,
    a wide range of laws, regulations, and rules govern both data privacy and security
    safeguards. In the following sections, we will begin by exploring some fundamental
    legal concepts to help the CCSP candidate prepare for working in this complex
    global environment. To make matters even more concerning, there is no shortage
    of change and uncertainty.


    # ## Legal Concepts


    Let''s discuss using some basic legal concepts that can be applied both in the
    United States and internationally. These terms form the foundation of knowledge
    that allows us to operate cloud activities across international borders with some
    semblance of consistency and fairness. We''ll use US law as a template, but with
    the caveat that other legal systems may take very different approaches to similar
    concepts.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Chapter 10 ■ Legal and Compliance Part 1


    There are three general bodies of law in the United States: criminal law, civil
    law, and administrative law. There is another specific specialized body of law,
    unique to the military, known as the Uniform Code of Military Justice (UCMJ).
    If your organization is not involved directly in military work, the UCMJ does
    not usually affect you, so we won''t dwell on that topic, but we will address
    the other. We''re also going to examine the concept of intellectual property and
    the legal protections available for owners of this type of asset.


    # Criminal Law


    Criminal law involves all legal matters where the government is in conflict with
    any person, group, or organization that violates statutes. Statutes (state and
    federal) are legislated by lawmakers. They are rules that define conduct prohibited
    by the public and are designed for the safety and well-being of the public. One
    example is traffic laws, which when broken result in court appearance, fines and
    so on. More obvious examples are laws involving robbery, theft, and murder.


    Criminal includes the federal court system and the various state courts. Under
    criminal law, punishments can include monetary fines, imprisonment, and even death.
    Enforcement of criminal law is called prosecution. Only the government can conduct
    law enforcement activity and prosecutions.


    > NOTE


    For the security practitioner, it is important to keep in mind that privacy violations
    around the world are in some cases as criminal violations. For instance, certain
    privacy standards and procedures are not adequately followed—say, in the EU—you
    could be prosecuted for criminal violations, in addition to whatever damages result
    from the data breach.


    # State Laws


    State laws are that we typically think of on a day-to-day basis. Speed limits,
    state tax laws, the criminal code, and so are all examples of laws enacted by
    a state legislature as opposed to those enacted at the national or federal level.
    Federal laws, however, supersede state laws, particularly regarding the nature
    of interstate commerce. For instance, while many states have laws outlining how
    electronic medical records should be handled, federal legislation is usually more
    comprehensive and therefore follows. In some cases, such as California, the state
    law may be in fact more stringent, as it is followed.


    > NOTE


    The United States is divided into 50 member entities that are referred to as states,
    each with its own sovereignty, legislature, and regulatory bodies. Outside of
    the United States, most other countries use the word state as a synonym for country,
    and their member entities are known as counties, jurisdictions, zones, or a variety
    of other terms. It is important to keep this distinction in mind regarding the
    meaning of the word state when dealing with multiple nations. In the United States
    alone, there are over 300 various jurisdictions, each with its own capacity for
    making and enforcing laws or regulations.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    # Federal Laws


    Unlike state laws, federal laws affect the entire country. Generally, issues of
    jurisdiction and subsequent prosecution are negotiated between law enforcement
    and courts prior to prosecution of a particular case.


    ![](img/914e4f10ad3f2426a517172a28cd7161_280_0.png)


    As of 2005, the US Department of Justice clarified that anyone who "knowingly"
    violates HIPAA regulations can face fines but also up to one year in jail. Although
    not a testing requirement, it may be interesting for you to know that the Omnibus
    Rule of March 2013 states that a Tier 3 criminal violation carries a potential
    10-year imprisonment penalty. Specifically, it states "if the offense is committed
    with intent to sell, transfer, or use identifiable health information for commercial
    advantage, personal gain, or malicious harm, fined no more than $250,000; imprisoned
    no more than ten years, or both." www.law.cornell.edu/uscode/text/42/1320d-6.


    # Civil Law


    Civil law is the body of law, and so on that it deals with personal and community-based
    law such as marriage and divorce. It is the set of rules that govern private citizens
    and their disputes. As opposed to criminal law, the parties in civil law matters
    are strictly private entities, including individuals, groups, and organizations.


    Typical examples of civil law cases are disputes (in the United States) over property
    boundaries, contracts, mineral rights, and divorce. Punitive measures for civil
    cases can include restriction of monetary damages or requirement to perform actions
    (usually in response to a breach-of-contract case, which we will address later),
    but not imprisonment or death.


    # Contracts


    A contract is an agreement between parties to engage in some specified activity,
    usually for mutual benefit. The contract between the cloud customer and cloud
    provider is a perfect example: in that, the cloud provider agrees to give the
    cloud provider money, and in exchange, the cloud customer offers some services.
    The contract often includes a finite duration for which the contract is in effect,
    a list of parties involved, the means for dispute resolution, and the jurisdiction
    of the contract (a physical place or government, such as "the state of Wisconsin,"
    or "the city of Milwaukee, in the state of Wisconsin, in the United States").


    Disputes arise from failure to perform according to activity specified in the
    contract, which is called a breach. In the event of a breach, a party to the contract
    can sue the others in order to get court-ordered relief in the form of money or
    other considerations (such as property, or the court forcing the breaching party
    to perform the activity that both parties agreed to in the first place).'
  merge: -1
  img_proc: true
- pgno: 281
  md: "Contract law applies to contractual items the CCSP candidate should be familiar\
    \ with,\nsuch as the following items:\n\n+   - Service-level agreements (SLAs)\n\
    - Payment Card Industry Data Security Standards (PCI DSS) contracts\n\nA CCSP\
    \ should be prepared to deal with these types of contracts in a cloud environment\n\
    /or with customers. Furthermore, it is important to understand the distinctions\n\
    regarding consequences and ramifications for violations of such contracts.\n\n\
    > Common law is the existing set of rulings and decisions made by courts,\ninformed\
    \ by cultural mores and legislation. These create precedents,\neach party will\
