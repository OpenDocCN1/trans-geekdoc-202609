    # Platform as a Service (PaaS)


    The platform as a service (PaaS) model will have other risks in addition to those
    included in the IaaS model. These include the following:


    **Interoperability Issues** Because the OS will be administered and updated by
    the provider, the customer''s software may or may not function properly with any
    adjustment to the environment.


    **Persistent Backdoors** PaaS is often used for software development and development
    operations (DevOps) efforts because the customer can install any software (production
    or testing) over the infrastructure (hardware and OS) within the cloud environment.
