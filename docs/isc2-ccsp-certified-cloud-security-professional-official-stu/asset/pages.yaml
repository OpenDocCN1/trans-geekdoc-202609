    # # Summary


    In this chapter, we have discussed data management functions within the data lifecycle,
    including data retention, auditing, and disposal. The various roles, rights, and
    responsibilities associated with data ownership were described. We also reviewed
    intellectual property concepts and legality for intellectual property as well
    as IRM solution objectives and functionality. This chapter discussed inventorying
    data assets and the added value discovery offers the organization. We touched
    on some jurisdictional concerns for data, real-time analytics, and agile business
    intelligence. which we will cover in more detail in Chapter 11. For all these
    topics, we also covered some of the challenges risks cloud computing powers.


    # # Exam Essentials


    **Know the different forms of data analytics.** Be familiar with the descriptions
    of datamining, real-time analytics, and agile business intelligence.


    **Understand the various roles, rights, and responsibilities related to data ownership.**
    Know who the data subject, controller, processor, and custodian are. Understand
    the rights and responsibilities associated with each.


    **Understand the purpose and method of data categorization/classification.** Know
    why and how owners assign categories and classifications to specific datasets
    under their control.


    **Be familiar with data discovery methods.** Know how and when data is labeled,
    and by whom. Also be aware of content-based discovery and the use of metadata
    in discovery efforts.


    **Know the data lifecycle.** Know all the phases of the data lifecycle, in order.
    Know which phases include data labeling, content creation, IRM activities, data
    disposal, data retention, and data audits.


    **Be familiar with the various intellectual property protections.** Know the protections
    for copyrights, trademarks, patents, and trade secrets.'
