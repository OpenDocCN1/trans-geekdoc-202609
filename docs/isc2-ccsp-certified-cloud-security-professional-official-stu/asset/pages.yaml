    # Holistic Redundancy: The Uptime Institute Tiers


    Currently, (ISC)² looks to the Uptime Institute (UI) for standards related to
    data center redundancy in continuous operations. The Uptime Institute (https://uptimeinstitute.com)
    is an advisory organization for matters related to IT service, UI publishes a
    standard for data center design, and it also certifies data centers for compliance
    with this standard.


    The UI standard is split into four tiers, in ascending durability of the data
    center. The standard itself is available for download from the UI''s website,
    free of charge. We''ll discuss the pertinent aspects in the following sections.
    (All emphasis in the descriptions of the tiers is added by the author for the
    purpose of demonstrating the differences between them and not part of the original
    document.)


    # Tier 1


    A Tier 1 data center is simplistic, with little or no redundancy, and is labeled
    Basic Site Infrastructure. Tier 1 lists the minimum requirements for a data center,
    which must include the following:


    +   - Dedicated space for IT systems

    - An uninterruptible power supply (UPS) system for line conditioning and backup
    purposes

    - Sufficient cooling systems to serve all critical equipment

    - A power generator for extended electrical outages, with at least 12 hours of
    fuel to run the generator at sufficient load to power the IT systems'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Physical/Logical Operations 191


    Twelve hours also have the standard fuel requirement for all tiers.


    Tier 1 data centers all have these features:


    +   - Scheduled maintenance will require systems (including critical systems)
    to be taken offline.


    +   - Both planned and unplanned maintenance and response activity may take systems
    (including critical systems) offline.


    +   - Unoward personnel activity (both inadvertent and malicious) will result
    in downtime.


    +   - Annual maintenance is necessary to safely operate the data center and requires
    full shutdown (including critical systems). Without this maintenance, the data
    center is likely to suffer unexpected outages and disruptions.


    If the data center is it so sensitive to a wide array of risks, why is it even
    considered suitable for operation? Who would want to be a customer of service?
    Well, although the cost of running a facility of this type is going to be less
    expensive, and that cost is most likely reflected in the price the customer will
    be asked to pay. Also, this type of facility may be appealing to an organization
    that is using the cloud service as a backup for its own enterprise and (perhaps
    the organization''s private cloud), and it only needs to be occasionally available
    and very temporarily. From this perspective it could be suitable as a bowman for
    the organization, with data uploaded on an infrequent basis (perhaps weekly or
    monthly), or it might even serve as a cold site, where data is only uploaded at
    those times when the organization is experiencing an emergency situation and needs
    to enact contingency operations.


    So a Tier 1 data center might be the least expensive (if also the least functional)
    option for an organization that does not require constant uptime and access to
    resources and data.


    # Tier 2


    A Tier 2 data center is slightly more robust than Tier 1, and is named for its
    defining characteristics: Redundant Site Infrastructure Capacity Components. It
    features all the attributes of the Tier 1 design, with these additional elements:


    +   - Critical operations do not have to be interrupted for scheduled replacement
    and maintenance of the redundant components; however, there may be downtime for
    any disconnection of power distribution systems and lines.


    +   - Contrary to Tier 1, where unwanted personnel activity will cause downtime,
    in Tier 2 it may cause downtime.


    +   - Unplanned failures of components or systems might result in downtime.


    With the benefit of rudimentary redundancy, the Tier 2 data center is obviously
    more suited to cloud operations and is more appealing for that purpose. It may
    still be more affordable than the higher-tier offerings, but it is now viable
    as a dependable alternative for'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Chapter 8 ■ Operations Elements


    continuous use. This may be a good option for small organizations looking to operate
    in the public cloud environment while still maintaining a relatively low overhead.


    # Tier 3


    The Tier 3 design is known as a Concurrently Maintainable Site Infrastructure.
    As the name indicates, the facility features both the redundant capacity components
    of a Tier 2 build and the added benefit of multiple distribution paths (where
    only a sole path is needed to serve critical operations at any given time). Other
    characteristics that differentiate Tier 3 from the prior level include the following:


    +   - There are dual power supplies for all IT systems.


    +   - Critical operations can even if any single component or power element is
    out for scheduled maintenance or replacement.


    +   - Unplanned loss of a component may cause downtime; the loss of a single system,
    on the other hand, will cause downtime. while node in a multinode system will
    have redundant components, all systems are not redundant.


    +   - Planned maintenance (to include scheduled annual maintenance of the facility)
    will not necessarily result in downtime; however, the risk of downtime may be
    increased during this activity. Temporary elevated risk does not make the data
    center lose its Tier 3 rating for durability.


    Obviously, a cloud provider offering a Tier 3 data center is a candidate for organizations
    looking to migrate to the public cloud. Most organizations with regular operational
    needs might consider a Tier 3 option. Those organizations with specialized needs
    organizations with highly sensitive material, such as governmental agencies or
    entities that utilize a great deal of intellectual property or large-scale organizations
    with absolute uptime requirements) might instead consider a Tier 4 option, but
    the Tier 3 should serve the purpose for all others.


    # Tier 4


    The Fault-Tolerant Site Infrastructure is the premium data center offering. As
    the Uptime Institute repeats in the description of this tier, each and every element
    and system of the facility (for IT processing, the physical plant, power distribution,
    or anything else) has integral redundancy such that critical operations can survive
    both planned and unplanned downtime at loss of any component or system. Does this
    mean a Tier 4 data is indestructible, with permanent uptime? Of course. Anyone
    marketing such is viewed with suspicion. However, it is the most robust, resilient
    option available.


    In addition to all Tier 3 features, the Tier 4 data center will include these
    characteristics:


    +   - There is redundancy of both IT and electrical components, where the various
    multiple components are independent and physically separate from each other.


    +   - Even after the loss of any facility infrastructure element, there will be
    sufficient power and cooling for critical operations.'
