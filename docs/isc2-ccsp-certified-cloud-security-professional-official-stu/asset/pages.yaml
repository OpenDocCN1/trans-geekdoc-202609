  md: '# Summary


    suitability of cloud providers) and IT security practitioners. SOC 2 reports come
    in Type I and Type II flavors. The SOC 2 Type I report only reviews controls as
    designed, at a particular moment in time. That is, the audit examines the controls
    chosen by the target but not how those controls are implemented or how well those
    controls work. For a cloud customer, the SOC 2 Type I is interesting but, not
    too useful.


    The SOC 2 Type II, on the other hand, is a truly thorough review of the target''s
    controls, including how they have been implemented and their efficacy, over a
    period of time (several months). The SOC 2 Type II is a goldmine for the cloud
    customer. It gives the customer a realistic view of the provider''s security posture
    and overall program.


    Unfortunately, while the cloud customer will want to see the provider''s SOC 2
    Type II report, the provider shares limited, rightly so. The SOC 2 Type II is
    detailed and contains so much information about the actual security controls implemented
    within the provider''s environment that it would be a perfect attack map for a
    hostile actor. It is understandable that the cloud provider would not want to
    disseminate the SOC 2 Type II.


    Current trends in the industry have created a happy middle ground for the provider
    and the customer. Many cloud providers are offering the SOC 2 Type II reports
    to customers with the stipulation that the customer signs a nondisclosure agreement
    and that the customer is vetted by the provider for trustworthiness before the
    report. This assures the customer that the provider''s security posture is adequate,
    and it assures the provider that their security methods and techniques are not
    made available to anyone who would want to use that information for malicious
    agents.


    The SOC 3 report, on the other hand, is purely for public consumption and serves
    only as a seal of approval for public disclosure, without sharing any specific
    information regarding audit activity, control effectiveness, findings, and so
    on. It is literally just an attestation from the auditor that the audit has been
    conducted and that the target has successfully passed the audit. It contains no
    details and substance. More cloud providers will be willing to disclose the SOC
    3 report than either because that is what a SOC 3 is designed for. For an accurate
    reflection of trustworthiness or for due diligence purposes in selecting a provider,
    it is not a useful or reliable tool.


    # Summary


