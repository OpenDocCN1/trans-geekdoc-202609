  md: '# Chapter 6 ■ Responsibilities in the Cloud


    trust, and the more people who have knowledge of the physical location, security
    controls, and layout of the data center, the greater the risk to the data and
    operations.


    From the customer''s perspective, this is both beneficial and challenging. It
    is beneficial because it increases the customer''s trust in the provider (the
    customer has limited access, but all customers have limited access, including
    other customers who may be hostile to competitive with each other). It is challenging
    because the customer is forced to rely on the provider''s assertions of security
    without the customer having any means to reliably validate and verify those assertions
    for themselves.


    # Audits


    In a traditional environment, audits serve a valuable function, determining that
    controls were selected properly, the controls function properly, and the organization
    is in compliance with a standard or mandate. Here is a brief overview of auditing
    methodology and concepts:


    +   * **Internal Audit**: An audit (review of the environment) is performed by
    employees of the organization. The results of the audit (typically, an audit report)
    can be used by management to adjust control selection/implementation or as evidence
    of diligence (often required by customers/regulators).


    +   * **External Audit**: An external audit is performed by auditors outside the
    organization, typically licensed/chartered accounting (an accounting firm). The
    external audit offers benefits beyond what the internal audit yields. External
    auditors are perceived (often rightly so) as being independent from the target
    organization, not succumbing to internal pressures and politics, and having a
    more trustworthy or believable perspective. As with results may be used solely
    by management as part of the decision-making process, or they may be shared outside
    the organization for marketing/regulatory purposes. In the IT/InfoSec realm, external
    audits often take the form of vulnerability scans and penetration tests.


    +   * **Audit Preparation**: Typically, the parameters of an audit engagement
    (duration, physical/logical locations, and so on) are negotiated before the start
    of the audit. Limitations are placed on which offices, artifacts, systems, and
    so on are inspected as part of the audit. This is referred to as the scope of
    the audit. "Scoping is sometimes used as a verb, "determining which aspects of
    the organization will be included." This is a crucial part of the overall audit
    process as crafting the scope can determine the impact, price, and usefulness
    of the audit.


    +   * **Audit Process/Methods**: Auditors are not exhaustive; detailed inspections
    of every single aspect of the target would be impractical and expensive and entail
    more impact than the results would be worth. Auditors will review the overall
    population of the environment (described in the scoping statement), select a suitable
    sample size, and then verify the configuration/controls/utility of the performance/controls
    in the sample. If the sample is suitably representative of the population, the
    results of the audit are taken to be meaningful for the population as a whole.
    There'
