    For readers of this book, especially, the Netflix blog will hold a great deal
    of interest for its discussion of the company''s decision to move into the public
    cloud, what its approach was, and what pitfalls it faced.


    # Virtualization Operations


    From a cloud provider perspective, virtualization is an absolute necessity. It''s
    the only way to properly manage the cost of hosting multiple customers in a scalable
    manner and still provide them with near-constant uptime.


    Visualization poses specific risks, many of which have been described in previous
    chapters. In the next few sections, we''ll discuss what a cloud provider should
    be considering when planning virtualization operations.


    # Personnel Isolation


    Because administrators working for the cloud provider will have physical access
    to devices that may run instances belonging to several customers in the same field
    (that is, the cloud'
