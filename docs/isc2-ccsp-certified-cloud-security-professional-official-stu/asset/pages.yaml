- pgno: 65
  md: '![](img/914e4f10ad3f2426a517172a28cd7161_65_0.png)


    I mentioned the asset inventory and BIA in Chapter 1, "Architectural Concepts."
    It bears repeating: security decisions are driven by business requirements. This
    is neither nor unique to the cloud. In this chapter, we will discuss many of the
    inputs for those security decisions and the business activities we undertake to
    determine the requirements.


    # # Business Requirements Analysis


    Security does not happen in stasis; we need information in order to conduct security
    activities in a proper and efficient manner. There are certain things we need
    to know in order to decide how we handle risks within our organization. We include
    the following:


    +   * An inventory of all assets

    * A valuation of each asset

    * A determination of critical paths, processes, and assets

    * A clear understanding of risk appetite


    # # Inventory of Assets


    To protect our assets, we first have to know what they are. Everything owned or
    controlled by the organization can be considered an asset, and assets take many
    different forms. Assets can be tangible items, such as IT hardware, retail inventory,
    buildings, and vehicles. Assets can be intangible, such as intellectual property,
    public perception, and goodwill with business partners and vendors. Personnel
    can also be considered assets, because of the skills, training, and productivity
    they provide to the organization.


    In order to protect all our assets, we have to know what they are, and to a lesser
    extent, where they are and what they do. If we lose track something under our
    control, it becomes impossible to secure that thing.


    Therefore, the first step in creating a good security program would be to perform
    a thorough, comprehensive inventory. There are many methods and tools for doing
    so, such as'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'surveys, interviews, audits, and so forth. In performing an IT inventory, we
    can also incor-por automation into the process, enhancing our capabilities and
    efficiency.


    # Valuation of Assets


    While we are ascertaining the number, location, and type of assets, we also want
    to deter-mine the value of each. We need to be able to know which of the assets
    provide the intrinsic value of our organization and which support this value.


    We need to know the value of the assets we protect so we know how much time, money,
    and effort to expend on them. We do not put a $10 lock on a $5 bicycle.


    ![](img/914e4f10ad3f2426a517172a28cd7161_66_0.png)


    This is a process known as business impact analysis (BIA). We determine a value
    for every asset (usually in terms of money, but sometimes according to priority/rank,
    customer perception, or measures), what would cost the organization if we lost
    that asset, and any alternate methods for dealing with that cost.


    There are various ways to assign cost: we can use the insured value, the replacement
    cost, or some other method of making valuation. Usually, we allow the data owners—that
    is, individual line-of-business managers responsible for their respective data—to
    determine the value of the information under their control.


    Usually, the data owner for a given data set is the business manager in charge
    of that data. This is generally the head of the department that col-lected or
    created that data.


    ![](img/914e4f10ad3f2426a517172a28cd7161_66_1.png)


    There are some risks associated with letting the data owners assign value to their
    assets. The most significant of these is the tendency of data owners to overvalue
    assets that belong to them. Ask anyone in the organization which department is
    the most important, and they will say it is theirs.


    The data owner is also tasked with assigning a category and/or classification
    to their data, usually when it is created. We will discuss in Chapter 3, “Data
    Classification."


    # Determination of Criticality


    Once the inventory and valuation is complete, the BIA effect continues with a
    determina-tion by senior management regarding criticality. Criticality denotes
    those aspects of the organization without which the organization could not operate
    or exist. These could include tangible assets, intangible assets, specific business
    processes, data pathways, or even essential personnel.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Real World Scenario


    # Criticality


    Here are some examples of critical aspects in organizations:


    +   - Tangible Assets: The organization is a rental car company; cars are critical
    to its operations—if it has no cars to rent to customers, it can''t do business.

    - Intangible Assets: The organization is a music production firm; music is the
    intellectual property of the company—if the ownership of the music is compromised
    (for instance, the copyright is challenged and the company loses ownership, or
    the encryption protecting the music files is removed and the music can be copied
    without protection), the company has nothing of value and will not survive.

    - Processes: The organization is a fast-food restaurant noted for its speed; the
    process of taking orders, preparing and delivering food, and taking payment is
    critical to its operations—if the restaurant cannot complete the process for some
    reason (for instance, the registers fail so that the restaurant cannot accept
    payment), the restaurant cannot function.

    - Data Paths: The organization is an international shipping line; matching orders
    to cargo carriers is critical to its operations. If the company cannot complete
    its logistical coordination—assigning cargo to carriers with sufficient capacity—it
    cannot provide services and will not survive.

    - Personnel: The organization is a surgical provider; the surgeon is critical
    to the existence of the company—if the surgeon cannot operate, there is no company.


    Senior management has the proper perspective for making determinations of criticality.
    The security professional, however, should have a good understanding of the overall
    mission and function of the organization, in order to better serve and advise
    the organization in securing critical elements.

    Another function of the BIA process that can support the security effort is the
    identification of single points of failure (SPOFs). If there is any checkpoint
    in a process, or production chain—a place where entire workflow would halt because
    of the loss of a single element—that is a SPOF. SPOFs, especially in critical
    paths, pose a significant risk to the organization and ought be addressed as soon
    as they are identified. Like critical aspects, SPOFs can be caused by hardware,
    software, processes, or personnel.

    Methods for dealing with SPOFs include the following:


    +   - Adding redundancies so that if the SPOF goes out of service, a replacement
    is immediately available

    - Creating alternative processes to take the place of SPOFs in times of outage'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Business Requirements Analysis


    +   - Cross-training personnel so that they can fill many roles

    - Consistently and thoroughly backing up data in a manner from which it can be
    easily quickly restored

    - Load sharing/balancing for the IT assets


    In a cloud environment, customers should expect that the provider has no SPOFs
    within their facilities and architecture; part the benefit of moving to cloud
    is the ability of cloud providers to offer a robust and resilient service that
    is not susceptible to failures due to SPOFs. The customer can therefore focus
    on attenuating any SPOFs on their own side of the operation: assessing and using
    the data in the cloud. It is important to note that not all SPOFs are part of
    critical assets, and not all critical assets of an organization contain SPOFs.


    # Quantitative and Qualitative Risk Assessments


    Two similar different approaches for assessing risk are qualitative risk and quantitative
    risk assessments. Both methods typically employ a set of methods, principles,
    or rules for assessing risk. Qualitative risk assessments use nonnumerical categories
    that are relative in nature, as high, medium, and low. Quantitative assessments
    use specific numerical values as 1, 2, and 3.


    # Risk Appetite


    Again, this is not a new concept, and that the cloud services does not significantly
    change anything about it. It bears mentioning here because of the importance of
    the concept to the overall practice of security and its inclusion in the CCSP
    Common Body of Knowledge (CBK).


    Risk appetite is the level, type of risk that the organization finds acceptable.
    This varies widely from organization to organization, based on innumerable factors
    internal and external, and can change over time.


    +   Here''s a quick review of risk fundamentals:

    - Risk is the likelihood an impact will be realized.

    - Risk can be reduced but never eliminated.

    - Organizations accept a level of risk that allows operations to continue in a
    successful manner.

    - It is legal and defensible to accept risks higher than the norm, or greater
    than your competitors, except risks to health and human safety; these risks must
    be addressed to the industry standard or the regulatory scheme to which your organization
    adheres.'
  merge: -1
