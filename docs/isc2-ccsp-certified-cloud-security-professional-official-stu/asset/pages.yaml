    # Shared Policy


    In addition to the (most likely SOC 3) audit reports, the cloud customer will
    have to rely on the contract and the SLAs to ensure that the provider is securing
    the data to an extent and sufficient for the customer’s purposes, including compliance
    with regulatory structures. These tools (the contract and the SLAs) will not obviate
    the customer’s legal responsibilities in the event of a breach, which they will
    help the customer seek financial restitution for damages caused to the customer
    and their in a breach that occurred because of negligence.


    In pursuit of this effort, and as contractual elements, the customer and provider
    may agree to share doctrinal mechanisms in, such as industry standards, guidelines,
    vendor documentation, and other policy and procedural artifacts. This could be
    true whether the service is IaaS, PaaS, or SaaS. If the parties choose this type
    of arrangement, both must agree to the same version of each artifact and must
    involve the other in any change management process that affects the documents
    (even if that involvement is limited to notification). This process and limits
    must be modified in the contract from the outset of the relationship.


    # Shared Monitoring and Testing


    Another area where providers and customers may find common ground in sharing responsibility
    is security monitoring and testing. The provider may allow the customer access
    to data streams or administrative capabilities on devices in order for the customer
    to perform their monitoring and testing activities in conjunction with or (more
    likely) in addition to the provider’s own efforts.


    Again, because of the provider’s inherent requirements to ensure security throughout
    the cloud environment, this access is most probably going to be very limited.
    The customer will be granted access only to those specific aspects of expertise
    that will not affect or give any insight into the provider’s other customers residing
    in the cloud. The provider’s concern is twofold: not allowing any specific customer
    or user enough capability to cause significant harm to the enterprise through
    accidental or malicious intent and not disclosing any customer’s data or operation
    to any other customer.


    Even with this limit of transparency, though, it is possible for the customer
    to have a greater certainty and trust in the security controls and performance
    of the cloud provider. This assurance is gained by allowing the customer to monitor
    and test the data and behavior of the network and to ensure that the general set
    of security controls and protective measures available to all customers are sufficient
    and not problematic for the customer’s specific data set.


    For instance, the provider may allow the customer to access audit and performance
    logs or to even configure settings on resources limited to that customer’s use.
    Or the provider'
