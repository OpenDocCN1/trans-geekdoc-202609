    # # Cloud Application Architecture


    It is important that we examine the mechanisms that make application security
    and software development for the cloud work as well as the weaknesses and vulnerabilities
    associated with each. The CCSP candidate needs to understand how to evaluate and
    discover these, from the perspective of a cloud customer.


    Programming interfaces (APIs) are the coding components that allow applications
    to speak to one another, generally through a web interface of some kind and preferably
    in a safe and secure manner. The cloud professional should know how to determine
    risks and threats associated with the use of APIs.


    # # Application Programming Interfaces


    There are two common types of application programming interfaces (APIs) in use
    with cloud-based applications that the CCSP candidate must understand. The first
    is REST APIs. REST stands for Representational State Transfer. It is a software
    approach designed to scale the capabilities of web-based applications. It is based
    on guidelines and best practices for creating these scalable web applications.
    Other characteristics of the REST approach include the following:


    +   - Low processing/traffic overhead ("lightweight")

    - Use simple URLs/URIs

    - Not reliant on any single programming language

    - Scalable

    - Outputs in many formats (CSV, JSON, and so on)

    - Efficient, which means it uses smaller messages than alternative approaches,
    such as SOAP


    The following situations are those in which REST works well:


    +   - When bandwidth is limited

    - When stateless operations are used

    - When caching is needed


    SOAP is the other API approach you should be familiar with. Simple Object Access
    Protocol (SOAP) is a protocol specification providing for the exchange of structured
    information or data in web services. It also works over other protocols such as
    SMTP, FTP, and HTTP.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Some of the characteristics of SOAP include the following:


    +   - Standards-based

    - Reliant on XML

    - Highly intolerant of errors

    - Slower

    - Built-in error handling


    Here are some examples of where SOAP works or fits in better:


    +   - Asynchronous processing

    - Format contracts

    - Stateful operations


    Neither API format is necessarily better than the other. It is important to understand
    that regardless of what type of API you use to offer web services, you are granting
    another application access to the primary application and any data it may access
    to. This can present many security challenges for end users unable to evaluate
    the security of any specific API, or even which APIs they are using. This can
    lead to data leakage or other problems if the APIs in question have not been sufficiently
    vetted and validated to provide adequate security.


    # # Multitenancy Separation


    Multitenancy refers to the concept that multiple cloud customers may share the
    same host devices and underlying resources. It is vitally important that configurations
    are made in such a way to ensure logical isolation of the various tenants; otherwise,
    data leakage and corruption could occur.


    # # Cryptography


    Although we will not discussing the specifics of encryption here, the CCSP candidate
    must be familiar with the different types of encryption, the places where it is
    used, and the use case for each. Data is typically encrypted when it is at rest
    or when it is in transit, and both types of encryption can be effectively used
    for purpose of overall cloud security.


    Encryption of Data at Rest Data at rest, whether it is short-term or long-term,
    should be protected from unauthorized access and similar problems. Encrypting
    data at rest is a great way to prevent unauthorized access to data. Data stored
    in a multitenant environment poses a risk that did not exist in the traditional
    environment; a government/law enforcement/regulatory entity might seize a particular
    hardware component while investigating one tenant and end up with data belonging
    to various tenants. If each tenant applies its own cryptography, those tenants
    not under investigation remain protected from unauthorized disclosure in this
    type of situation.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 7 ■ Cloud Application Security


    **Encryption of Data in Transit** Encryption of data in transit is necessary to
    mitigate against intermediaries (often referred to as the man-in-the-middle attack).


    There are a number of encryption technologies that you should also know about:


    **Transport Layer Security (TLS)** TLS is a protocol designed to ensure privacy
    when communicating between applications. This can occur between two servers or
    between a web server.


    **Secure Sockets Layer (SSL)** Invented and for by Netscape in the mid-1990s,
    SSL was originally meant to encrypt data transmissions between two endpoints,
    such as two servers or a server and a user. SSL was deprecated in 2013 and replaced
    with TLS, which is still used in many enterprises since it was ubiquitous and
    upgrading or transitioning can be costly and time-consuming.


    **Whole-Instance Encryption** Also known as whole-disk encryption, this is the
    idea of encrypting all of a system''s data at rest in one instance. Rather than
    designated folders being used for encrypted material, the entire storage medium
    is encrypted. With the advent of stronger and faster processors, even-disk encryption
    protects data on the device in the event the device is lost or stolen.


    **Volume Encryption** Much like encrypting an entire device, volume encryption
    refers to only encrypting a partition on a hard drive as opposed to the entire
    disk. This is useful when the entire disk does not need to be encrypted only the
    protected sections have data of any value.


    Customers or users can add another layer of protection by encrypting specific
    files or folders. The customer holds the keys to unencrypt the disk or volume
    be breached in some manner.


    Keep in mind that the primary requirement for securing any encryption scheme is
    the safe storage and management of the keys used to encrypt and decrypt.


    # Sandboxing


    In context of computing, the sandbox can mean a couple of things.


    A physical sandbox is a test environment of isolated devices and cabling, completely
    distinct from the production environment. (In fact, there is often space, actual
    empty space, between the physical sandbox/testbed, so we refer to the two environments—production
    and test—as “airgapped”). The benefit of a physical sandbox is that errors/vulnerabilities
    introduced will not contaminate/affect the production environment.


    A logical sandbox is an isolated memory space where untrusted/untested code can
    be run in isolation from the underlying hardware so that detrimental effects of
    the program do not affect the machine/other programs.


    Either type of sandbox might be used during the SDLC for testing code in development
    or for security purposes such as performing forensics analysis on malware or experimenting
    with patches/updates before they are deployed in the production environment.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Application Virtualization


    Application virtualization is a somewhat misunderstood term. The idea of application
    virtualization has to do with running applications in a trusted virtual environment.
    It is like sandboxing, but instead of sandboxing a process, application virtualization
    allows you to run full applications in a protected space. In addition, you are
    doing this virtually, you can run applications that otherwise not run on the host
    system. An excellent example is the Linux wine WINE is itself an application virtualization
    platform that provides a Linux machine with the ability to run Windows-based applications.
    This also provides for a space where new apps can be tested, for instance with
    Windows, without allowing the application to touch what would normally be the
    external Windows machine. Microsoft App-V and XenApp also allow users to perform
    application virtualization.


    # Cloud Application Assurance and Validation


    To effectively test applications, we need to be familiar with a number of application
    security testing methods and tools. In the following sections, we explore a variety
    of common approaches.


    # Threat Modeling


    There are several threat modeling tools such as Trike, AS/NZS 4360, and CVSS.
    However, for the purposes of the CCSP exam, we will cover only the STRIDE model.


    Created by Microsoft some time ago, the STRIDE threat model has been widely adopted
    throughout the industry. The model can use this model to attempt to discover flaws
    and vulnerabilities in the software they''re creating.


    The STRIDE acronym stands for the:


    +   S (Spoofing) Can the identity of the entity using the application be obscured
    in some way? Does the user have the capability to appear as a different user?


    +   T (Tampering) Does the affect allow a user to make unauthorized modifications
    to actual data, affecting the integrity of information or communications?


    +   R (Repudiation) Is the user capable of denying they took part in a transaction,
    or does the application track and log the user''s actions?


    +   I (Information Disclosure) Does the application reveal information (either
    the data being processed, or information about the application''s function) while
    it runs?'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'D (Denial of Service) Is a way to shut down the application through unauthorized
    means? This might include crashing, overloading, or restarting the application.


    E (Elevation of Privilege) Can a user change their level of permissions in order
    to perform unauthorized action (such as gaining administrative control of the
    application)?


    The “user” in each of these categories is a legitimate employee who is granted
    access to the application or someone who has unauthorized access. The various
    threats may be the result of accidental input by a user or intentional effort
    to misuse the application.


    STRIDE is particularly useful as part of the SDLC in identifying vulnerabilities
    throughout the process. The STRIDE model enables us to do this. When we are evaluating
    cloud application security, these six concepts help in identifying and classifying
    threats or vulnerabilities and help form a common language used to describe them.
    That way, we can systematically address them through better coding techniques
    or other control mechanisms.


    # STRIDE Resources


    Microsoft has used the STRIDE model and suggestions for its implementation freely
    available on its website: https://msdn.microsoft.com/en-us/library/ee823878(v=cs).aspx


    An example of STRIDE might be used to evaluate the potential attacks on a web
    commerce server is provided as well: https://msdn.microsoft.com/en-us/library/ee798544(v=cs).aspx


    Microsoft also offers an automated tool designed to aid in applying the STRIDE
    model to any software. It is available, free of charge, from Microsoft’s website:
    https://.microsoft.com/en-us/azure/security/azure-security-threat-modeling-tool


    Threat modeling helps prepare for some of the more common application vulnerabilities
    developers will encounter when working with cloud applications, which include
    the following:


    Injection When a malicious user attempts to insert a string of some type into
    a field in order to manipulate the application’s actions or reveal unauthorized
    data. Examples include things as SQL, LDAP, and OS injections. If the injection
    is successful, either unauthorized data is seen or unauthorized actions are taken.


    Broken Authentication When a malicious user is able to break a session and steal
    items like tokens, passwords, or keys. This then allows the malicious user to
    hijack the system.


    Cross-Site Scripting (XSS) XSS is one of the most widely seen application flaws,
    next to injections. XSS occurs when an application allows untrusted data to be
    sent to a web'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'browser without proper validation or escaping. This allows the malicious user
    to execute code or hijack sessions in the user''s browser.


    Insecure Direct Object Access Involves a reference to an internal object, like
    a file, without access control checks or other controls to ensure attackers cannot
    manipulate data.


    Security Misconfigurations Security misconfigurations are often unintentional,
    caused by authorized entities, and a result of basic human error.


    Sensitive Data Exposure The disclosure of information such as PII, data card material,
    and so on. Without proper controls in place (such as encryption, data masking,
    tokenization, and so on), sensitive data can be leaked by an application or system.


    Missing Function-Level Access Control An application should always verify functionality
    before granting privileges of access to the user interface (UI). If this is not
    implemented, malicious users may be able to forge requests that will function
    without authorization.


    Cross-Site Request Forgery (CSRF) A CSRF manipulates a logged-on user''s browser
    to send a forged HTTP request with cookies and other authentication information
    in an effort to force the victim''s browser to generate a request that a vulnerable
    application thinks is a legitimate request from the user.


    Using Components with Known Vulnerabilities This can occur when developers use
    application/programming libraries of known components but do not need security
    components or fail to understand the context in which the component will eventually
    be used in production.


    Invalidated Redirects and Forwards Often developers will use redirects without
    validation, which may expose users to untrusted data or other applications. Without
    this validation, malicious users can alter the redirects to point the user to
    malicious sites such as phishing sites.


    This list largely comes from the Open Web Security Project''s (OWASP) Top Ten
    Critical Application Web Security Risks. OWASP updates the list almost every year;
    as of the time of publication of this book, the most current list is from 2017
    and can be found here: www.owasp.org/index.php/Category:OWASP_Top_Ten_Project.


    I highly recommend CCSP candidate review the source material available from OWASP.


    # Quality of Service


    There is always a trade-off between security and productivity; every control that
    offers a security benefit to an organization will also impede productivity, often
    by degrading quality of service (QoS).'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Encryption is an excellent example. Enabling encryption in most databases causes
    a slowdown in performance due to the processing power required for the encryption
    and decryption process to occur; it may also limit the ability to query the database
    because encrypted data cannot be catalogued or interrogated with may plaintext
    text. Another example is running host-based intrusion detection systems (HIDS)
    on a server. Usually this requires the viewing of all connections and data coming
    into and leaving the device, which can have a significant impact on performance.


    # # Software Security Testing


    Testing the security of software requires a specialized skillset. In this section,
    we review some of the methodologies, testing concepts, and tools used to verify
    and validate that we have the appropriate controls.


    We begin with penetration testing and vulnerability scanning. Both are quite useful
    and have their place in the realm of application testing, they serve very different
    purposes and are used in different ways.


    Vulnerability scanning involves searching the environment for known flaws, often
    with an automated tool. Vulnerability scanning does not necessarily identify configuration
    errors (although some may be encountered and discovered) but is more of a set
    of vulnerability definitions compared against the application or network being
    scanned. These types of scanners are also often used by hackers as part of ongoing
    reconnaissance for vulnerabilities to be used later in attacks. However, when
    we perform vulnerability scanning to test our system, no exploitation occurs,
    and as long as the scanners are properly performed, no damage should occur. Some
    errors occur, but at worst the system will need a reboot.


    The downside, of course, to vulnerability scanning is that it can only detect
    the vulnerabilities for which it has definitions—that is, known vulnerabilities.
    Any vulnerabilities not currently known and in the scanning tool can later become
    zero-day exploits if attackers figure out how to use them.


    Penetration testing is designed to find vulnerabilities and to exploit them to
    the point of potentially gaining unauthorized access to systems or data. These
    tests usually begin with a reconnaissance and/or vulnerability scanning to identify
    system weaknesses and then move on to the penetration phase. Penetration testing
    must be distinguished from vulnerability scanning as it includes an active component
    (the penetration of the environment), whereas scanning is almost exclusively passive.


    > It is extremely important to mention that under no circumstances should you
    attempt any type of vulnerability scanning or penetration testing against an application
    or system without full authorization to do so. You could be violating several
    laws and get into some very deep trouble. In addition, you might even jeopardize
    your ISP account if they do not allow such activity in your end-user license agreement
    (EULA). Get permission first.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Cloud Application Assurance and Validation


    In addition to testing the environment as a suitably secure place for the application
    function, we need to test the application itself to determine whether it has inherent
    weaknesses and flaws. There are two general approaches:


    **White-Box Testing (Static Application Testing [SAST])** SAST entails reviewing
    the source code. This requires a team with two kinds of skills and knowledge:
    how to read the code was written and with a deep understanding of security. Personnel
    with both capabilities are rare (and expensive). We also have to be careful not
    to use the same developers who wrote the code in performing the test; the testing
    team needs to be composed of people with entirely “fresh” and no inherent conflict
    of interest.


    **Black-Box Testing (Dynamic Application Testing [DAST])** DAST entails testing
    the program as in its functions. In black-box testing, the source code is not
    reviewed; instead, the testing team uses inputs and results from the application
    itself, as it''s running.


    Because white-box and black-box testing can reveal different security issues,
    it''s usually best to employ both in the testing regime. See Figure 7.3 for some
    of the testing issues of SAST and DAST.


    # FIGURE 7.3 Testing Issues


    ![](img/914e4f10ad3f2426a517172a28cd7161_210_0.png)


    Although SAST and DAST are completely different types of testing methodology,
    they are often used in conjunction to observe or test the applications from more
    than one perspective.


    ![](img/914e4f10ad3f2426a517172a28cd7161_210_1.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Approved APIs


    APIs are a large part of cloud application development because they allow other
    applications to consume web services from the application, expanding its capabilities.
    In addition, they provide for automation and integration with third-party tools,
    all aimed at extending the functionality of the application. However, this does
    not come without risk. There are both consumers and providers of web services
    provided by APIs, and each they present special considerations.


    When consuming APIs, the consumer is relying on the API vendor to have included
    appropriate security controls and conducted testing and validation to ensure the
    integrity and security of the application. However, there is little opportunity
    to ascertain this in advance. For instance, you are reliant on the vendor''s promise
    that data exchanges have been tested and validated.


    One of the most significant problems with using APIs is that not everyone creates
    them the same level of scrutiny. APIs are sometimes coddled with little or no
    security testing. Consumption of APIs without any type of validation can lead
    to data leakage, poor authentication, and authorization and application failure.
    In addition, manipulating an unsecured API could except the worst lead to a data
    breach. What''s more, when an application is updated or changed, the API may expose
    items that were not exposed before.


    One way to overcome these issues is to ensure that organizational processes are
    in place that allow for constant testing and review of APIs.


    # Software Supply Chain (API) Management


    Another issue that is becoming prominent is that of software supply chain management.
    Developers are finding ways to leverage APIs with third-party applications. This
    is the problem lies in third-party developers who build applications upstream
    APIs and adding their own to be consumed by another application, and so on. This
    deal of APIs can quickly spin out of control to the point that the end consumer
    has no way of knowing what APIs may or not be sending data update and vice versa.
    Often, the consumer will overlook the deficiencies if the functionality offered
    by the application is appealing enough.


    Suggested ways of dealing with these issues include auditing/contractual language
    for acquired applications as well as security reviews for developed apps to ensure
    they only use of authorized APIs.


    # Securing Open-Source Software


    There is a philosophical disagreement in the InfoSec community about whether proprietary
    software (where the source code is hidden from everyone except the vendor) is
    preferable and more secure than the open-source variety (where the source code
    is published and any-one can review it, make modifications, and publish derivative
    versions).'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Cloud Application Assurance and Validation 173


    Both offer some value. However, it is generally agreed that open-source programs
    are more flexible, provide largely the same protections, and have a greater range
    of functionality than their counterparts (think Mozilla Firefox versus Microsoft
    Internet Explorer).


    Perhaps one of the main points in favor of proprietary options is the possibility
    that liability will map back to the vendor—that breaches or failures in the program
    can be blamed on the vendor, who may be held accountable (although it''s difficult
    to point to examples where this has occurred). Another benefit might be the active
    and constant efforts of vendors to update and secure their proprietary applications.


    Conversely, the benefit of choosing open-source programs often includes a reduced
    price (or, indeed having free of charge) and the opportunity to review, for your
    code to test for security vulnerabilities. Open-source code also allows the user
    to make whatever modifications they choose in order to add or enhance functionality.


    # Agility


    Many software vendors are implementing something to quickly speed up the development
    of software so that it can be delivered in a more timely manner to the customer.
    In instances, open-source libraries are sometimes the most expedient and cost-effective
    way to accomplish this in short run. The customer gets the software quicker and
    cheaper with all the functionality they requested. The problem is that Agile focuses
    on timely delivery and not longevity or security of the application. These elements
    are sometimes overlooked, but they are not a core part of the Agile development
    process. This can easily lead to the situation where vulnerabilities are later
    discovered with no means to correct the issues of redesigning or rebuilding the
    application.


    # Application Orchestration


    When two or more applications interact in order to successfully complete a business
    process/transaction, there are two general approaches we can take:


    +   - Link elements of the applications directly, so that the output of one (or
    step of one) is the input of another.


    +   - Abstract the functions of the applications such that their inputs/outputs
    can be handled distinctly from the way they programs, with another set of code/software.


    The first option can lead to additional problems, such as creating unnecessary
    dependencies and increasing the difficulty of version control and testing. Therefore,
    the second option, referred to as application orchestration, is often preferable.


    Orchestration often requires that data from the various participating applications
    be converted to a new format (or formats) so that the information can work in
    the orchestration. It may also involve creating a new overlay/interface with the
    data/applications so that'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'the interaction can be managed. Finally, new or intermediary protocols might
    be necessary so that the processes are negotiated between the applications.


    # The Secure Network Environment


    Cloud applications will also need to run in a secure environment. CCSP should
    understand basic networking practices to appreciate/perceive the methods used
    inside cloud data centers. These include the following items:


    +   - VLAN: A virtual local network; a logical means of isolating particular portions
    or segments of a network, even though the machines may be physically connected.
    Member devices in a VLAN can only communicate with other members of the same VLAN,
    unless the traffic passes through a portal/gateway leading outside


    +   - DHCP: When assigning IP addresses to devices, we use a permanent, specific
    address for a given device; this is called static addressing. An alternative to
    static addressing is assigning an IP to a specific device for a certain duration,
    called this dynamic addressing. The method used for the latter is the Dynamic
    Host Configuration Protocol (DHCP). A DHCP in an environment selects an IP address
    from the allowed range (range of IP addresses owned by the organization), assigns
    it to a specific device, and keeps a record of devices which has which addresses;
    when the use of the address is terminated, the address goes back into the pool
    of allowed addresses, and the DHCP server can reassign it to another (or the same
    machine).


    +   - DNS: The Domain Name Service is how computers translate IP addresses to
    domain names, DNS functions through the use of hierarchical, distributed tables;
    when a change is made to how a domain name relates to a specific IP address, the
    change is registered at the top of DNS hierarchy and then filters down to all
    DNS servers. When a user wants to communicate with another machine, the user (or,
    the function on the user''s machine) queries a device with a DNS table (often
    at the user''s IP) to get the correct address. DNSSEC add security by providing
    origin authority, data integrity, and authenticated denial of service, reducing
    susceptibility to spoofing.


    +   - VPN: A remote user can be granted permissions to the IT environment even
    though the connection is over an untrusted network (such as the Internet). This
    is accomplished through the use of a virtual private network (VPN). The VPN is
    an encrypted tunnel between the remote user and the IT environment. A tunnel is
    an encapsulated communication; one protocol embedded inside another protocol.
    This connection is then encrypted to add protections against intermediaries/attackers
    observing the communication.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Summary


    This chapter discussed awareness of application training and deployment issues,
    the application software development lifecycle, how to verify software through
    testing, how to select trusted software, how to design and use identity and access
    management systems, appropriate cloud application architecture, and cloud software
    assurance and validation.


    # Exam Essentials


    Understand the differences between ANF and ONF. An ONF is the catalog of all security
    controls used in all the applications throughout an organization. It is composed
    of ANFs, subordinate lists of controls used in each individual application in
    the organization.


    Be able to articulate the components of the STRIDE threat model. The STRIDE threat
    model contains six threat categories:


    +   - Spoofing

    - Tampering

    - Repudiation

    - Information disclosure

    - Denial of service

    - Elevation of privilege


    Be able to describe the stages of the SDLC. Be sure to understand the stages in
    a common SDLC model. The SDLC consists of the following stages:


    +   - Defining

    - Designing

    - Developing

    - Testing

    - Secure Operations

    - Disposal


    Understand identity and access management and how it fits into the cloud environment.
    IAM plays a critical role in managing users with the advent of role-based access.
    Understand the importance of this and federated identities.


    Comprehend the specifics of cloud application architecture. Not all applications
    are designed to run in the cloud. Be sure to understand the differences in architecture
    when designing or attempting to move applications.'
