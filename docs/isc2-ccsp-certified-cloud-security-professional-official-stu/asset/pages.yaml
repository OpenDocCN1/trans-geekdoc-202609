- pgno: 301
  md: '# Auditor Independence


    The idea of auditor independence goes back further than SOX legislation, but SOX
    stringent reinforced that requirement. This has a very influential effect on auditors
    and organizations in the United States and somewhat internationally.


    It is imperative that auditors remain objective and not be swayed by either persuasion
    or vested interest; the auditors must be unbiased and reflect a true and accurate
    reporting of the target environment/organization. Auditors should not have a financial
    interest in the outcome of the audit, or in the success of the organization, nor
    auditors have personal interactions with client entities if those relationships
    could influence the auditors or their reports.


    # AICPA Reports and Standards


    The American Institute of Certified Public Accountants (AICPA) represents the
    accounting and auditing professions in the United States. It is a large organization
    that is responsible for most financial and information security audit practices.
    It sets the standards, creates guidelines and frameworks, and sets the bar for
    service organization audit and reporting practices. The AICPA creates and promulgates
    the Generally Accepted Accounting Principles (GAAP) and Accepted Auditing Standards
    (GAAS), which auditors and accountants adhere to in.


    The current AICPA audit standard, SSAE 18, outlines three families of audit reports:
    SOC 1, SOC 2, and SOC 3.


    These standards, guidelines, and reports serve as the foundation for evaluating
    the safety and soundness of an organization''s control framework and help to determine
    risk levels of doing business with the organization. They report on the effectiveness
    of proper separation and segmentation.


    As a CSPF, if your organization is considering cloud migration and you have to
    choose potential providers, you will always have to rely on third-party audit
    reports as a means to perform your due diligence (demonstrating that you''ve put
    the effort to choose a trustworthy provider). It is very unlikely that you will
    be allowed to perform your own audit visit/review of the provider''s controls
    as a customer. This is why (SOC) it is important for you to be familiar with the
    SOC reports and understand what they mean and how they are used.


    The first of these reports is the SOC 1. It is an audit engagement consisting
    solely of an examination of organizational financial reporting controls. For the
    purposes of a cloud customer trying to determine the suitability of a cloud provider,
    the SOC 1 is useless. It doesn''t tell us about data protections, configuration
    resiliency, or any other element the customer needs to know. The SOC 1 is instead
    designed to serve the needs of investors and regulators, the two sets of people
    interested in the financial well-being of the target. To restore and reinforce:
    the SOC 1 does not serve an information security or IT security.


    SOC 2 reports review controls relevant to security, availability, processing integrity,
    confidentiality, or privacy. This is the report of most to cloud used by customers
    (to determine the'
