- pgno: 69
  md: '# Real World Scenario


    # Health and Human Safety Risks


    An organization cannot accept risks to health and human safety that are beyond
    industry standards and known best practices: to do so would be unethical, and
    would also expose the organization to a great deal of liability (which creates
    its own risk, which must also be considered). There are a few exceptions to this
    rule; perhaps the military is one example, where loss of life and limb are an
    expected outcome from operations and an acceptable risk.


    However, individuals can accept risks on their own behalf. For instance, commercial
    fishing has been among the professions with the highest fatality rates in the
    United States for the past 100 years (in terms of hours worked per death), there
    is no shortage of people willing to engage in this industry. For the individual
    worker, the level of risk is both known and acceptable. From an organizational
    perspective, however, the relatively high possibility of fatal accidents does
    not obviate the need for ensuring adherence to best practices (perhaps life vests,
    tether lines, and so forth) and does not remove all liability.


    Organizations have four main ways to address risk:


    +   **Avoidance**: This isn''t really a method for handling risk; it means avoiding
    a business opportunity because the risk is simply too high and cannot be compensated
    with adequate control mechanisms—a risk that exceeds the organization''s appetite.


    +   **Acceptance**: The opposite of avoidance; the risk falls within the organization''s
    risk appetite, so the organization continues operations without any additional
    efforts regarding the risk.


    +   **Transference**: The organization pays someone else to accept the risk, at
    a lower cost than the potential impact that would result from the risk being realized;
    this is usually in the form of insurance. This type of risk is often associated
    with things that have a low probability of occurring but a high impact should
    they occur.


    +   **Mitigation**: The organization takes steps to decrease the likelihood or
    the impact of the risk (and often both); this can take the form of controls/countermeasures
    and is usually where security practitioners are involved.


    Risk is involved in every activity. We can manage risk, attenuate it, even minimize
    it, but there is always an element of risk in operations. When we choose to mitigate
    risk by applying countermeasures and the remaining, leftover risk is called *residual*
    risk. The task of the security program is to reduce residual risk until it falls
    within the acceptable level of risk according to the organization''s appetite.


    The risk appetite of an organization is set by senior management and is the guide
    for all risk-management activities in the organization. The security practitioner
    must have a'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Security Considerations for Different Cloud Categories


    thorough understanding of the risk appetite of the organization in order to perform
