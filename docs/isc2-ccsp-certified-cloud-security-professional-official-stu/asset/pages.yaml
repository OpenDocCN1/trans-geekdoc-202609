  img_proc: true
- pgno: 289
  md: 'The Europeans have a dim view of the ability of the United States to ensure
    the privacy of individuals. The GDPR is a direct reflection of this attitude.
    And, in all fairness, the Europeans seem quite justified in their opinion, as
    the US government has proven over a considerable period of time to be willing
    to collect information on all individuals (including citizens of the United States)
    without warrants or other legal justification. So the GDPR can be seen as a law
    that expressly limits US companies.


    To allow some US-based companies to operate legitimately in the EU, we created
    privacy rules designed to outline what companies must do in order to comply with
    EU laws. These rules outline the proper handling of storage and transmission of
    private information belonging to EU citizens. The program for American compliance
    with GDPR is called Privacy Shield in the United States.


    The Privacy Shield provisions are as follows:


    +   * Any US company that want to collect EU citizen data must voluntarily agree
    to comply with the GDPR.

    * These companies have sign up with a federal enforcement entity in the United
    States that administers the program. For most companies, the Privacy Shield program
    is administered by the Department of Commerce (DoC). For airlines and shipping
    companies, the program is administered by the Department of Transportation (DoT).

    * The companies have to allow auditing and enforcement by the program administrators.
    For the DoC, the enforcement arm is the Federal Trade Commission (FTC), and the
    DoT enforced its program. Enforcement can include fines assessed for violations.


    For more information about Privacy Shield, see www.privysield.gov/welcome. There
    is one final method that American companies can use if they want to have EU citizen
    PII and if they don''t want to subscribe to Privacy Shield. They can create internal
    policies called binding corporate standard contractual clauses that explicitly
    state full compliance with the GDPR. In this way the company that chooses to use
    this method is basing their full agreement to be bound by the applicable EU laws.
    If a company chooses to use this method, however, it must first approach every
    EU country where the company wants to operate and have the government office for
    oversight and enforcement of the GDPR accept and approve the company''s policy.


    The GDPR defines roles for entities in the collection and creation of PII. It
    is important for the CCSP candidate to be familiar with these roles and how they
    apply to the relationship between cloud customers and providers.


    **Data Subject** The individual to whom the PII refers. A specific human being.


    **Data Controller** Any entity collecting or creating PII. In the cloud, the data
    controller is the cloud customer.


    **Data Processor** Any entity acting on behalf or at the behest of the data controller,
    performing any manipulation, storage, or transmission of the PII. In the cloud,
    the data processor is the service provider.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    Under the GDPR, the data controller is ultimately responsible for any unauthorized
    disclosure of PII. That includes any malicious or negligent act on the part of
    the data processor. This is an extremely important point to understand. Legally,
    the data controller is responsible for all breaches, regardless of fault.


    To put this in perspective, let''s say a cloud provider, Ostrich Corporation,
    has two customers, Acme, Inc., and Bravo, LLC, who are competitors. An administrator
    at Ostrich knowing and wisely sells some Acme data and sells it to Bravo. For
    purposes of liability under privacy laws, Acme would still be responsible for
    the breach, even though Acme did nothing wrong. Acme might eventually be able
    to recover from Ostrich (and maybe Bravo) in a civil suit, but the legal liability
    for the privacy data breach, including any initial legal costs for settling the
    breach, would be Acme''s. Note that this is just for excuse under privacy laws;
    Ostrich and Bravo might be prosecuted for the theft of the data, which is a crime.


    > Under the GDPR, PII is not limited to electronic data. It also covers any data
    stored in hard-copy form.


    # Australian Privacy Act of 1988


    The Australian Privacy Act regulates the handling of personal information. It
    includes details regarding the collection, use, storage, disclosure to, or correction
    of personal information. It consists of fundamental privacy principles covering
    such issues as these:


    +   * Transparency in the handling of personal information

    * The rules on collecting information from solicitation

    * Correctness and integrity of collected data


    As you can see from the enactment date, Australia has been very proactive in the
    area of personal privacy rights for decades. It has also become to a number of
    global cloud providers, making this way even more important.


    Because the Australian Privacy Act meets all the requirements of the GDPR, Australian
    entities are allowed to collect and create PII for EU citizens.


    # Canada’s Personal Information Protection and Electronic Documents Act (PIPEDA)


    This Canadian law provides for the protection of personal information collected,
    used, or disclosed in certain circumstances providing for the use of electronic
    means to communicate or record information or transactions. It includes such specifics
    on filing complaints as how and with whom they are filed and the remedies and
    enforcements available to the government for redress of such grievances. As you
    might imagine, Canada has a view of personal privacy more like that of the EU
    and unlike the United States.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'The EU acknowledges PIPEDA as satisfactorily addressing the principles of the
    GDPR. Therefore, entities in Canada (like those in Australia) can handle EU citizen
    PII.


    # Argentina''s Personal Data Protection Act


    In 2000, Argentina passed the Data Protection Act with the explicit intent of
    ensuring adherence and compliance with the EU Data Directive (the precursor to
    the GDPR). Because of this, the EU treats entities in Argentina as if they were
    in the EU and allows them to collect and create PII for EU citizens. Many data
    centers in Argentina exist manage services for EU customers.


    # The EFTA and Switzerland


    Switzerland is not technically a member of the EU. Instead, it is a member of
    a four-nation smaller body known as the European Free Trade Association (EFTA).
    Swiss law has long been famous for protecting client privacy, specifically to
    support Switzerland''s international banking industry. The EU recognizes EFTA
    regulation as stringent enough to protect citizen data under the GDPR, so Switzerland
    is ostensibly considered part of the EU in regard to being allowed to process
    privacy information.


    # Asia-Pacific Economic Cooperation (APEC) Framework


    The Asia-Pacific Economic Cooperation (APEC) is a regional organization meant
    to work toward economic growth and cooperation of its member nations. APEC agreements
    are not legally binding and are followed only with voluntary compliance by those
    entities that choose to participate.


    Where the laws of other jurisdictions (such as the EU) are meant to provide governmental
    protections to individual citizens, the APEC intent is to enhance the function
    of free markets through common adherence to PII protection principles. APEC members
    understand that consumers will not trust if their PII is not protected during
    participation in those markets. Therefore, APEC principles offer assurance to
    consumers as an effort to increase faith in trading practices and thereby ensure
    mutual benefit for all involved.


    APEC framework privacy principles rest on the following core ideas:


    +   - Individuals know when their data is used, transmitted, or stored.


    +   - Limitations on usage are based on what is known to the individuals.


    +   - The entity collecting or creating PII has responsibilities toward maintaining
    data accuracy and integrity.


    # Information Security Management Systems (ISMSs)


    ISO created the concept of an information security management system (ISMS); a
    holistic overview of the entire security program within an organization. The ISMS
    is detailed in ISO 27001.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Legal Requirements and Unique Risks in the Cloud Environment


    The ISMS is intended to provide a standardized international model for the development
    and implementation of policies, procedures, and standards that take into account
    stakeholder identification and involvement in a top-down approach to addressing
    and managing risk in an organization. It is built on the premise that information
    should be adequately secured with practices accepted and recognized by the industry
    as a whole; it is platform/product agnostic and can be customized for any organization.


    ISO 27001 is probably the most well-recognized security standard globally and
    will be accepted by many regulators/jurisdictions as meeting care requirements
    for reducing liability. However, applying the standard, and being certified as
    having applied it, is not inexpensive; ISO compliance is a very costly prospect,
    which may make it unattractive for small and medium-sized organizations.


    For more information, see www.iso.org/iso/27001.


    > The management and oversight of security policies, devices, and tools, as well
    as business processes such as audit and security functions, constitute the ISO?
    CCSP Course Outline describes an "Information security controls system", which
    is a holistic program for security controls within an organization. Under the
    ISO perspective, the ISMS full-staff.


    > ISO documents are not free! They can range in price from hundred or several
    hundred, depending on the specific document, size, age, and so on. And there are
    literally hundreds of them. This is one of the ways in which the ISO organization
    generates revenue to continue developing its standards. They are developed primarily
    by subject matter experts from around the world, who are all volunteers with the
    exception of the ISO staff. For more information, go www.iso.org/iso/home.htm.


    # ISO/IEC 27017:2015


    The International Organization for Standardization (ISO) and International Electromechanical
    Commission (IEC) created ISO/IEC 27017:2015, a set of standards regarding the
    guidelines for information security controls applicable to the provision and use
    of cloud services and cloud customer services. In other words, it provides a set
    of standards for not providing cloud services but also for how cloud customer
    information and privacy should be protected. Although ISO standards are recognized
    internationally, they are not law, and they do not reflect regulation by governmental
    bodies such as the EU. However, in some jurisdictions, some industries are required
    by law to comply with ISO standards.


    > ISO/IEC 27018:2019 is also relevant to the CCSP. It focuses specifically on
    a code of practice and security techniques for processing Pii in cloud services.'
