- pgno: 170
  md: 'escalating their privileges, or disabling functionality), the security team
    can monitor and record the attackers'' behavior. This information can be used
    for defensive purposes in the actual production environment or as evidence in
    litigation and prosecution actions.


    # Vulnerability Assessments


    A vulnerability assessment is a scan of the network in order to detect known vulnerabilities.
    These can, of course, be automated so that they are scalable for networks of any
    appreciable size. The unfortunate flaw in vulnerability assessments is that they
    will only detect known vulnerabilities. Any extant vulnerabilities that are not
    part of the scan will prevent attackers from discovering previously unknown vulnerabilities
    in systems and attacking them. These forms of attacks are often referred to as
    zero-day exploits.


    # Communication Protection


    The connections between the various nodes and the data center and the rest of
    the world must be secured. Establishing access control and protection for remote
    access and in transit can be accomplished in several ways:


    Encryption Data can be encrypted across the network, reducing the possibility
    that someone who has not authorized access (an external attacker, perhaps, or
    a malicious insider) would be able to access it in plaintext. If network traffic
    is encrypted with a sufficient work factor (a measure of the time and/or resources
    an attacker would require to break), it would not reveal sensitive data if someone
    captured it. Remote connections can also be encrypted, providing the same kind
    of protection for user access. Of course, encryption comes with a cost: the processing
    overhead increases with the volume of encrypted data, some other security controls
    (such as IRM, egress monitoring tools, and IDS/IPS solutions) might not function
    in the same manner because they cannot recognize the content of, and key storage
    is always an issue.


    Private Networks (VPNs) Creating a secure tunnel across unt networks (such as
    the Internet) can aid in obviating man-in-the-middle attacks as eavesdropping
    and interception of sensitive data, particularly when combined with encryption.


    Strong Authentication With the other aspects of securing the cloud data center,
    authentication schema such as the use of robust tokens and requiring multifactor
    authentication can reduce the likelihood of unauthorized users gaining access
    and can be used to restrict authorized users to permitted activities.


    | Management Plane |


    Virtualization, cloud-specific logical configurations, and software-defined networking
    (SDN) are widely used. Consequently, cloud data center elements such as hardware,
    logical configuration, and networking elements will most likely be managed through
    a centralized management and control interface, often referred to as the management
    plane or'
