    # Security Considerations for Different Cloud Categories


    In traditional (non-cloud) environments, we had bright-line definitions of the
    organization''s IT perimeter: everything the perimeter belonged to the organization,
    including data, hardware, and risk; everything was someone else''s. We could point
    at a specific location, a given cable leaving the faculty or campus, and know
    that, there was the place where our control ended and someone else''s began. We
    armor our defenses at the interface between the internal environment and external
    factors, building up a demilitarized zone (DMZ).


    This is not readily case with cloud computing. In the cloud motif, our data resides
    inside an IT environment owned by someone else, riding on a hardware infrastructure
    that does not belong to us and is largely outside our control. We users operate
    programs and machines that have limited access to and knowledge of. It is therefore
    difficult to know exactly where the boundaries exist in cloud models, where our
    risks are, and how far they extend.


    In the following sections, I will apply a potential analysis of cloud computing
    boundaries. But it is extremely important to remember this currently: according
    to most of the world''s privacy laws and regulations, the cloud customer is always
    legally liable for any loss of data. This is true even if the cloud provider demonstrates
    negligence or malice.


    > The cloud customer can seek restitution if the cloud provider fails in some
    way, causing damage to the customer. For instance, if the cloud provider hires
    an administrator who then illegally sells access to data belonging to the cloud
    customer, the customer can use the provider for damages. However, the cloud customer
    is still legally responsible for all mandates applicable to the loss, such as
    complying with data breach notification laws in that jurisdiction. This requirement
    does not cease just because the cloud customer has outsourced operations to the
    cloud provider.


    What do these boundaries look like in the different cloud models?'
