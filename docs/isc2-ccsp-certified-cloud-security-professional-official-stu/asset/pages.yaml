    # Continuity of Operations


    We''ve seen to health and human safety concerns, our primary business focus should
    be continuity of critical operation.

    To begin with we need to determine what the organization''s critical operations
    are. In a cloud data center, which will usually be dictated by the customer contracts
    and SLAs. This simplification of those elements necessary to support critical
    needs. Other extant sources can be extremely useful in this portion of the effort,
    particularly by the BIA, which informs us which assets would cause the greatest
    impact if lost or interrupted. For instance, in a cloud data center, our main
    focus should be on connectivity, utilities, and processing capacity. These are,
    our critical operations. Other ancillary business functions, such as marketing,
    sales, finance, HR, and so on, which might be missed or greatly without lasting
    impact on the organization and can be considered noncritical.


    In formulating this inventory of critical assets, it is important to consider
    all elements that support critical functions, not limited to the hardware and
    tangible assets, but also specific personnel, software libraries, documentation,
    fundamental data, and so forth, with which we could not continue critical operations.


    # The BC/DR Plan


    As with all plans, the BC/DR plan should be formalized in and derive from the
    organization''s governance. Policy should dictate roles, terms of the plan, enforcement,
    and execution.


    The plan should include both a general, exhaustive, detailed description of all
    aspects of BC/DR efforts and also limited, simple, straightforward procedures
    for enacting the plan and all response activities. Because the two categories
    of documentation differ so widely in content and purpose, they can often be included
    in the plan as appendices or attachments and referenced for the purpose of describing
    how and when each will be used (the detailed content for planning and after-action
    purposes; the simple procedures for use during the reaction to the event and disaster
    itself).


    The plan should include the following:


    +   A List of the Items from the Asset Inventory Deemed Critical This should include
    necessary hardware, software, and media, including versioning data and applicable
    patches.'
