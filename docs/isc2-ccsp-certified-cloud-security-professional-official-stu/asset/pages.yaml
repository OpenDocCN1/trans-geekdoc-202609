  md: '![](img/914e4f10ad3f2426a517172a28cd7161_164_0.png)


    Contracted cloud computing is unlike other operational modes and also unlike other
    managed IT service arrangements. In the case of cloud computing, the data owner
    ostensibly owns the information being stored and processed but does not have control
    over how it is stored or processed who specifically handles the information (in
    terms of administration). Perhaps actually have physical access to the places
    and devices where that information is. The customer has all the responsibility
    and liability for protecting the information according to legal standards and
    regulation but often leads to a very complex situation with a number of unique
    considerations.


    It''s tough to think of an equivalent scenario. Perhaps one that comes is brokered
    financial investment, where you give your money to someone else who manages it,
    how they think best, and whatever security measures they determine are best to
    protect it. You don''t have control over the money or which particular security
    controls are implemented. You might shop between investments, trying to find one
    that offers good interest, but it''s probably unlikely you''ll find much, much
    less be to dictate the terms of the broker''s operations. Depending on what kind
    of investment vehicle is being used, you might have no assurances that the money
    is protected from malfeasance and negligence on the part of the brokermany types
    of investments are not subject to insurance.


    What about how the cloud customer is still liable for regulatory infractions and
    breaches that result in loss of PII, even if the root cause the cloud vendor''s
    wrongdoing? The financialinvestment analogy is a bit stretched, but it still holds
    true: if someone gives you their money for them, and you give it to a third party,
