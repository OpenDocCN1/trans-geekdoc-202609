  md: '# Chapter 6 ■ Responsibilities in the Cloud


    Instead, the provider is likely to publish an audit assurance statement: something
    from the auditor that finds the results, in formal terms, that an audit was performed
    and that the auditor finds the results suitable for the provider’s operations—a
    seal of approval, if that you will.


    Currently, this usually takes the form of the SOC 3 audit report. Let''s delve
    into the SOC reports and intended purpose, because this material is significant
    for both exam and practical purposes.


    The SOC reports are part of the SSAE report format created by the American Institute
    of Public Accountants (AICPA). These are uniformly recognized as being designed
    as mechanisms for ensuring compliance in many industries, although they were specifically
    designed for regulatory purposes which the Sarbanes-Oxley Act (colloquially referred
    to as SOX), governs publicly traded corporations.


    There are three report categories: SOC 1, SOC 2, and SOC 3. Each of them is meant
    for a specific purpose, and there are subclasses of reports as SOC 1

    SOC 1 reports are strictly for auditing the financial reporting instruments of
    a corporation, and therefore have little to do with our field. It''s worth noting
    that they exist (SOC 1 is mentioned in the CBK, and it''s important to know the
    distinction between SOC 1 reports and SOC 2 and SOC 3 reports) that there are
    two subclasses of SOC 1: Type 1 and Type 2.


    SOC 2 reports are the ones that are particular to our field. They are specifically
    identified to report audits of any organization''s security, availability, processing
    integrity, confidentiality, and privacy. Therefore, a cloud provider intending
    to prove its trustworthiness can demonstrate with a SOC 2 report.


    SOC 2 also comes in two subclasses: Type 1 and Type 2. The SOC 2 Type 1 is not
    extremely useful for determining the security and trust of an organization. The
    SOC 2 Type 1 reviews the design of controls, not how they are implemented and
    maintained or their function. The SOC 2 Type 2 report, however, does just. This
    is why the SOC 2 is the type of report that is extremely useful for getting a
    true assessment of an organization''s security posture.


    However, cloud vendors are reluctant to share the SOC 2 Type 2 report outside
    the provider’s organization. The SOC 2 report is extremely detailed and provides
    exactly the kind of description and configuration that the cloud provider is trying
    to restrict from dissemination. It''s basically a handbook for attacking that
    cloud provider.


    In recent years, many cloud providers have become willing to share the SOC 2 Type
    2 reports with some customers, but they will only share this information with
    customers that the provider has specifically vetted and has reason to trust, and
    then only if the customer is willing to sign a nondisclosure agreement or undergo
    additional security measures to protect the report. In some cases, the customer
    can only view the report material under certain conditions or in certain locations.


    Cloud customers are, however, welcome to view the SOC 3 report (as everyone is
    else; SOC 3 reports are designed to be shared with the public). The SOC 3 is the
    “seal of approval” mentioned earlier in this section. It contains no actual data
    about the security'
