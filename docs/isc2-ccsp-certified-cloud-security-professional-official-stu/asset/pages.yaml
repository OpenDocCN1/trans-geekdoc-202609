- pgno: 222
  md: 'Although IT and InfoSec practitioners will probably spend the majority of their
    time providing professional services to cloud customers, the CCSP CBK and exam
    also require the ability to understand the perspective of the cloud provider to
    some extent. In this chapter, we''ll continue our review of the internal working
    of a cloud provider (and the provider''s data center) in a bit more detail.


    # Physical/Logical Operations


    The cloud data center has to be robust and resilient to all types of threats,
    from natural disasters to hacking attacks to simple component failure. This strength
    and capability has to be comprehensive and exhaustive enough to provide close
    to continuous system operation and data access (referred as uptime) for multiple
    customers with a wide spectrum of service needs.


    Currently, the industry standard for uptime in cloud service provision is five
    nines, which means 99.999% uptime (in some cases, uptime offered by providers
    exceeds this boundary, to 99.999%). That''s a vast difference in the level of
    service expected just recently as a decade ago. At that time, managed services
    were often not based in the cloud and instead took the form of contractors leasing
    and maintaining IT devices and networking, often inside the customers'' own facilities.
    Back then, expected outages for regular maintenance, upgrades, and routine component
    less incurred scheduled downtime of up to five days each month. Five nines, over
    a calendar year, or other hand, means less than five minutes per year.


    In the following sections, we''ll review standards and methods created for the
    purpose of achieving an uptime of five nines (or more).


    # Uptime and Availability


    The CCSP CBK expressly differentiates between uptime and availability. In the
    most sense, this is true. A data center could be providing continuous uptime,
    but the cloud customer may encounter availability problems. For instance, the
    customer''s ability to connect to the data center may be limited by a failure
    within the customer''s ISP. This would be a lack of availability from the customer''s
    perspective but not a lack of uptime on the provider. The data center is up, but
    the customer can''t reach it.


    ![](img/914e4f10ad3f2426a517172a28cd7161_222_0.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'This may seem like splitting hairs, realistically, most professionals (or,
    for that matter, courts or regulators) already would not expect an entity to be
    responsible for agencies and externalities outside its control. Nobody would consider
    the cloud provider to be liable for the failure of the customer''s ISP in the
    first place. Certainly, the cloud provider could not be held liable for not meeting
    the terms of the SLA in such a circumstance.


    That aside, for practical purposes, the terms uptime and availability are usually
    meant to communicate the same notion: cloud provider''s ability to offer service
    within the parameters specified in the SLA, without undue interruption, with the
    implicit understanding that the provider is not responsible for the customer''s
    inability to access the data center for reasons outside the provider''s purview.


    However, for academic and testing purposes, in the strictest sense, they are not
    synonymous.


    # Facilities and Redundancy


    A vast majority of the effort to ensure continuous uptime will be spent redundancy
    of physical components and infrastructure. With sufficient replication of hardware
    and media, elements can be lost without impact on operations.


    When designing a data center, consider redundancy not only for the IT systems
    and infrastructure, but for all aspects of functionality that support the operation
    of the data center. These include utilities (electrical power receipt/distribution,
    water, communications connectivity), staff, emergency capacities (mostly power
    generation and fuel for the generator as well as egress paths for personnel),
    HVAC, and security controls.


    > Heating, ventilation, and air-conditioning (HVAC) systems sense the cool air
    from the heat caused by servers. They provide air management includes racks with
    built-in ventilation or alternate cold/hot aisles.


    # Power Redundancy


    IT systems operate without electricity. The data center will require a power sufficient
    to operate all the core processing and storage systems for all customers as well
    as those support systems necessary to run the data center (such as HVAC and lighting).
    The cloud provider will want to consider two major aspects of redundancy for primary
    power needs: energy utility providers and the actual physical connections from
    the providers to the data center campus. Furthermore, this replication of power
    should carry throughout the data center itself, down to the component level; each
    device should have both primary and backup power feeds to ensure availability.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Physical/Logical Operations 185


    # Power Provider Redundancy


    Finding multiple power utilities for a single physical plant might prove challenging.
    Most municipalities are usually served by no more than power provider, by legal
    construct. Power companies are usually granted some form of local monopoly, based
    on the premise that competing providers would hinder the community''s ability
    to receive power on a cost-effective basis. This is because of the costs of creating
    and maintaining multiple sets of infrastructure to generate and deliver power.
    Theoretically, every power provider would have to own its own building for all
    its customers. This could lead to an overabundance of cables and wires in the
    service area and decrease the opportunity to create economies of scale by limiting
    infrastructure to one. Regardless of whether this theory is true (and is questionable,
    telephone service provision was once limited based on the same reasoning, and
    that not not suffered the breakup of the telephone service monopoly but flourished,
    while consumers dropped considerably, without an overabundance of telephone infrastructure
    affecting neighborhoods, most metropolitan areas have more than one power provider.


    Moreover, the geographic locations often deemed most for data centers are even
    less to have multiple power providers for other reasons. Because data centers
    are costly to erect, require a large footprint, and need little in terms of external
    services (other than power and communications), remote rural areas are often seen
    to be optimal for building and is cheap, zoning limitations are generally reduced
    or nonexistent, and there is less chance of impact from certain types of threats
    (civil unrest, fire from neighboring buildings, basic crimes/vandalism, and so
    on). However, rural areas are it also served by only one power provider, but because
    it is not profitable for more than one vendor to offer services in areas with
    low population density. This, in turn, make it difficult for cloud providers to
    find multiple power utilities to serve their data center.


    # Power Line Redundancy


    There is a form of attack that almost everyone who worked in the IT field for
    any length of time has suffered: having your entire IT enterprise being DoSed
    by a backhoe. For some reasons, backhoes (and bulldozers, and teams that lead)
    seem to magically be able to locate and slice power and communication lines to
    buildings, even if the lines are buried underground or raised far enough into
    the air, and even if these locations are clearly marked by utility inspectors
    before construction activity begins. It''s like a natural law: if you, as a security
    professional, see construction equipment in the parking lot of your campus, prepare
    to lose power and communications.


    ![](img/914e4f10ad3f2426a517172a28cd7161_224_0.png)


    Also, I know more than one organization that has been DoSed by squirrels dining
    on the power and communication lines. In one case, it happened to the same organization
    more than once. This is not a joke, but it is kind of funny. It''s also an example
    of a natural environmental threat that must be taken into consideration when designing
    a data character.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'So it behooves the cloud provider to ensure that all power and communication
    lines that connect to each of the buildings on the campus are not only replicated,
    but that the connections are replicated on opposite sides of each building. We
    want to avoid the backhoe taking out both lines simultaneously, and the likelihood
    of construction scheduled on both sides of a facility at the same time is somewhat
    less than just one side at a time.


    # Power Conditioning and Distribution Redundancy


    Another aspect of power provisioning for the data center is the ancillary necessary
    infrastructure, including power conditioning apparatus and distribution mechanisms.


    Raw power from most mains is not suitable for commercial IT systems. The electricity
    must be adjusted so as to optimize its suitability for system performance. We
    call this conditioning naturally adjusts the voltage on the line. It also includes
    surge protectors, which attenuate the effects of power-spikes that might occur
    as result of natural forces (such as storms) or uncontrolled activity elsewhere
    in the grid.


    When designing a facility, it is a good practice to plan for redundancy in other
    power conditioners as well as the other aspects of the electrical system. Likewise,
    other aspects of the power system within the data center that should be similarly
    replicated include any distribution node, such as transformers or substations,
    as well as the conduit that actually carries power to each facility.


    > When discussing power and resilient design, it''s important to also address
    backup power systems, such as batteries and generators. We will cover that aspect
    in Chapter 9, "Operations Management," in the section "Business Continuity and
    Disaster Recovery (BC/DR)."


    # Communications Redundancy


    Many of the challenges associated with finding multiple power providers will affect
    plans for redundant communication providers. In geographically isolated areas,
    finding even one broadband ISP might be difficult, alone two or more. However,
    cloud data centers bringing enough demand and need for service for ISPs may build
    out their current infrastructure to serve those data centers.


    # Personnel Redundancy


    When considering redundancy and resiliency design for data centers, remember the
    personnel who administer and support the IT components and those that operate/maintain
    environmental support systems. Some of the techniques we can adopt to provide
    this increased level of robustness among personnel resources are as follows:


    Cross-Training Whenever possible, have personnel trained not only in their primary
    duties but in another employee''s duties (and vice versa). That way, they can
    serve as relief or backups for each other for crisis purposes or for ease of scheduling
    (this is'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Physical/Logical Operations 187


    particularly useful in data centers, where constant uptime often means shiftwork,
    which entails scheduling challenges). This technique, however, is very expensive.
    Having all personnel trained in multiple disciplines requires not only a significant
    training budget but also high salaries reflecting investment in top-flight personnel.
    High-quality employees have the discipline and ability to fulfill a range of functional
    tasks in areas other than their main duties. This methodology is utilized to create
    personnel redundancy, it''s important to ensure that all staff are engaged in
    tasks that exercise each of their skills on a recurring basis so that they maintain
    currency in each area and the training does not atrophy.


    Water redundancy is an important consideration for cloud data centers. Similar
    to power supply, water providers are another utility that could be overlooked
    in contingency planning. Water powers both systems and systems for drinking, cooling,
    and fire suppression. As electricity, finding multiple water providers in a given
    area may be difficult. Unlike electricity, however, water is not as dangerous
    or difficult to generate, transport, and store. In addition to the local water
    district, data center owners can acquire water from wells on their property, or
    contract with hauling companies who can bring water in rail or truck. Water can
    be stored for a long time in cisterns or cooling towers (and a well serves the
    dual purpose of provision and storage). When designing redundancy for water supply,
    it is also important to include multiple pumping facilities to ensure sufficient
    pressure and the power to run them.


    Egress is paramount-concern for all security efforts is health and human safety.
    The data center buildings—all of them—should have multiple points of escape in
    case of emergency. This does not have to make your one-way portals (such as doors
    with interior-facing push-bars, and no means to open them from the outside), and
    ingress can be severely limited and tightly controlled. Remember to design fire
    suppression systems over paths of egress.


    Lighting in continuous uptime may not seem like an essential element of operations.
    However, consider a data center without interior lighting or a lighting system
    without power. Most data centers not have windows (windows are both a safety and
    a security risk and are largely unnecessary in data centers), a lighting system
    failure would result in a facility that would be uncomfortable and hazardous for
    people to occupy, much less get work done. Emergency lights, particularly along
    egress routes, are important (and often required by building codes), is as ensuring
    that the lighting is connected to any backup power supply.


    # Security Redundancy


    In designing security for the physical plant and site layout, it is essential
    to bear mind one of the most fundamental concepts in our field: defense in depth.
    Defense in depth (or layered defense") entails multiple differing controls protecting
    the same assets, often with a variety of technological levels and an assortment
    of categories of controls (physical, administrative, and logical/technical).'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'For a cloud data center to meet sufficient diligence requirements (and attenuate
    the likelihood of potential threats and risks) pertaining to physical security,
    all the basic protective measures must be included, and redundancy should come
    in the form of layering as opposed to repetition. Layered physical defense does
    not mean having two or three concentric fence lines at the perimeter; it either
    mean including a guard patrol who monitors the fence line, a surveillance capability,
    and electronic monitoring of tampering attempts on the fence. This offers redundancy
    of protection (in the sense of the single control that is "perimeter security";
    other physical security measures are also necessary, course) as well as techniques
    to resist human attackers, who will need a variety of tools and techniques to
    breach the defenses as opposed to just one (the listed examples, a. wire cutter).
    Our goal is to make breaching complicated.


    In addition to the other physical security aspects that ought to be included in
    this design the following:


    +   - Vehicular approach/access, to include driveways that turn and curve/or include
    speed bumps as well as bollards, to prevent a vehicle from achieving sufficient
    speed to ram the building


    +   - Guest/visitor access through a controlled entry point, involving formal
    reception (perhaps a sign-in log, video surveillance, and specific staff tasked
    with that duty)


    +   - Proper placement of hazardous or vital resources (such as electrical supply,
    storage, and distribution components, particularly generators and fuel) such that
    they are not directly located near personnel or in the path of vehicles


    +   - Interior physical access controls, such as badging, keys, combinations,
    turnstiles, and so on


    +   - Specific physical protections for highly sensitive assets, such as safes
    and inventory tracking mechanisms (perhaps RFIDs)


    +   - Fire detection and suppression systems


    +   - Sufficient power for all these functions, in the event of a primary power
    disruption


