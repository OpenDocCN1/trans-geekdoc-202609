    # ISO/IEC 27034-1 Standards for Secure Application Development


    The International Organization for Standardization (ISO) has created an approsch
    org-anizations can use for tracking security controls used in their software.
    ISO/IEC 27034-1 provides an overview of application security that introduces definitive
    concepts, principles, and processes involved in application security. In doing
    so, it describes two documents an organization can use internally as inventories
    of controls.


    The Organizational Normative Framework (ONF) is the framework for all components
    of application security controls and best practices catalogued and leveraged by
    the organi-zation. The application normative frameworks (ANFs) are the subsets
    of the ONF for each specific application. The ANF shares the applicable parts
    of the ONF needed to achieve an application’s required level of security and the
    trust of desired.


    The ANF-to-ONF relationship is a one-to-one relationship; every application has
    an ANF that maps back to the ONE. However, the ONF-to-ANF relationship is one-to-many.
    The ONF has many ANFs, but the ANF has only one ONF. Make sure you understand
    this concept.


    | ONF/ANF Example |

    |---| Company X has three software applications, Programs A, B, and C. Each of
    the Programs has these controls:


    Program A

    * Password

    * Encryption

    * Process isolation

    * Input validation |'
