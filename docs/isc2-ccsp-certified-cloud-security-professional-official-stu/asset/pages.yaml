- pgno: 265
  md: '# Chapter 9 ■ Operations Management


    The Circumstances Under Which an Event or Disaster Is Declared Response comes
    with a cost. It is important to distinguish normal administration functions from
    event or disaster response because the response will obligate resources and affect
    productivity. Careful attention and explanation should be made for balancing the
    risks and benefits of overreaction and underreaction in terms of response: too
    frequently, and productivity will be needlessly ever affected; too rarely, and
    response activities will be hindered by delays for the sake of caution.


    Who Is Authorized to Make the Declaration An authority needs to be named (individual,
    role, or office) for the purpose of formal declaration of an event or disaster.
    We want to avoid the possibility of overreaction by allowing anyone to initiate
    a formal response (like an emergency brake line in public transit) and we want
    to ensure that initiation is instigated by someone who is informed, qualified,
    trained, and responsible for making such a determination.


    An authorized party must also formally declare a cessation of BC/DR activity and
    resumption of normal operations. This should only be done when there is a high
    degree of assurance that all safety and health hazards have been abated and operating
    conditions and risks have returned to normal. Resuming too soon can exacerbate
    the existing event or disaster or cause a new.


    Essential Points of Contact This should include the contact information of offices
    responsible for BC/DR activity and tasks as well as any external entities that
    may be involved (regulators, law enforcement, corporate authorities, press, vendors,
    customers, and so on). These should be as specific as possible to reduce difficulty
    in locating appropriate contacts during an actual response.


    Detailed Actions, Tasks, and Activities Checklists can be helpful for BC/DR procedures.
    They describe the specific actions necessary, they can be aligned in order of
    execution, and they can constitute a record, after the activity is complete, of
    actions taken, by and when (if each checklist is annotated with the time and initials
    of the person performing the action as it occurs). Checklists also serve several
    fundamental features of BC/DR plans used during a response; they allow for someone
    to conduct the appropriate actions even if that person has not had specific training
    or experience with that plan in organization. Course, it is always preferable
    to have the personnel assigned to BC/DR roles trained and practiced with the specific
    plan, but especially during disasters or events, the assigned personnel are not
    available.


    All these elements can be included by reference. That is, each piece can be split
    out as an attachment or appendix to the BC/DR policy proper. The basic elements
    of policies (explanation and rationale for the policy, enforcement authorities,
    relevant regulations, and so on) can make the body of the policy, as it will be
    less subject to continual changing and updating.'
