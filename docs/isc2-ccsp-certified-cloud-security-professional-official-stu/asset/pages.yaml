    with the other chunks/shards will also be encrypted. This also protects the data
    of a cloud customer if a device is seized/accessed by regulators/law enforcement
    for an investigation into another customer—the information of Customer A, if dispersed,
    is not revealed when the regulator accesses the device looking for Customer B''s
