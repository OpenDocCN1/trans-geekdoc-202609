- pgno: 145
  md: '# Software as a Service (SaaS)


    All risks inherent in the PaaS and IaaS models in the software as a service (SaaS)
    environment along with these additional risks:


    **Proprietary Formats** The provider may collect, storing, and displaying data
    in a format owned by and unique to that provider. This can lead to vendor lock-in
    and decrease portability.


    **Virtualization** The risks from virtualization are enhanced in the SaaS environment
    because even more resource sharing and simultaneous multitenancy is going to occur.
    For more information, refer to the next section, "Virtualization."


    **Web Application Security** Most SaaS offerings will rely on access through a
    browser, with some kind of application programming interface (API). Potential
    weaknesses within web apps pose a wide variety of risks and threats.


    # Virtualization


    We have discussed the importance of virtualization throughout the book. We''ll
    now discuss the risks related to the use of virtualization in the cloud. Many
    of these possibilities require attention use of controls that can be implemented
    by the cloud provider, so the cloud customer must rely on contractual provisions
    for implementation and enforcement.


    **Attacks on the Hypervisor** Instead of attacking a virtual instance, which might
    only result in successfully breaching the content of one (virtualized) workstation,
    malicious actors might attempt to penetrate the hypervisor, which is the system
    that acts as the interface and controller between the virtualized instances and
    the resources of the given host devices where they reside.


    There are two types of hypervisors, known as Type 1 and Type 2. *Type 1* is also
    called a bare-metal or hardware hypervisor. It resides directly on the host machine,
    often as bootable software. *Type 2* is a software hypervisor, and it runs on
    top of the OS that runs on a host device.


    Attackers prefer Type 2 hypervisors because of the larger surface area. They can
    attack the hypervisor itself, the underlying OS, and the machine directly, whereas
    Type 1 attacks are restricted to the hypervisor and the machine. OS are also more
    complex than hypervisors, creating the increased potential for included vulnerabilities.


    **Guest Escape** An improperly designed or poorly configured virtual machine or
    hypervisor might allow a user to leave the confines of their own virtualized instance.
    This is referred to as *guest escape* or *virtual machine (VM) escape*. A user
    who has successfully performed guest escape might be able to access other virtualized
    instances on the same host and view, copy, or modify data stored there. Worse,
    the user might be able to access the'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Virtualization


    host it and therefore be able to affect all the instances on the machine. And
    the worst potential situation is known as host escape, where a user can not leave
    their virtualized instance, they can even leave the host machine, accessing other
    devices on the network. This may be unlikely, as it would result from some rather
    egregious failures in hardware, software, policy, and person performance (or significant
    combinations thereof), it is a risk and must be considered.


    **Information Bleed** This is another risk stemming from malfunctions or failures.
    The possibility that processing on one virtualized instance may be detected, in
    whole or in part, by other instances on the same host. In order for this risk
    to be detrimental, the loss does not have to involve the raw data itself. It might
    instead be indicative of the proceeding occurring on the affected instance. For
    example, it may be possible to detect that a certain operation is happening on
    the affected instance and that the operation lasts for a specific duration. This
    kind of process-specific information can tell a malicious actor about the instance
    or what kind of operations are being conducted. This can provide the attacker
    with an advantage because they might be able to narrow down a list of possible
    attack vectors to those that will function in that circumstance, or they might
    gain an insight into what types of material might be acquired from a successful
    attack. This tactic is often referred to as a side channel or covert channel.


    **Data Seizure** Legal activity may result in a host machine being confiscated
    or inspected by law enforcement or plaintiffs'' attorneys, and the host machine
    might include virtualized instances belonging to your organization, even though
    your organization was not the target.


    Cloud data centers can be perceived as similar to DMZs in legacy enterprises.
    Because everything in the cloud can be accessed remotely, it can be considered
    exposed to the Internet, to a greater or lesser extent. Instead of the discrete
    perimeter of a private network, cloud configurations may be more porous or be
    considered to have no specific boundary at all.


    In the following sections, we will discuss threats to specific cloud platforms
    and countermeasures that may facilitate true cloud usage.


    # Threats


    Many of the threats to cloud computing are the same as those we faced in traditional
    IT operations, they may manifest in novel ways or pose a greater risk. In this
    section, we will examine the threats to the private, community, public, and hybrid
    cloud models. This coverage is by no means exhaustive or comprehensive and should
    only be taken as a means to inform the reader and stimulate consideration of possible
    security activity.


    **Malware** Malicious software downloaded from the Internet or uploaded to the
    internal network can cause a wide variety of problems, including data loss, loss
    of control of devices, interruption of operations, and so forth. This is less
    likely in a SaaS environment because the customer has no ability to install software.'
