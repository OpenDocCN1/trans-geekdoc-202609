- pgno: 71
  md: '# IaaS Considerations


    Infrastructure as a service (IaaS) is the cloud model in which the cloud customer
    has the most responsibility and authority. The provider is responsible for the
    data center''s buildings and land, connectivity and power, and the hardware assets
    the customer''s programs and data will reside on. The customer, however, is in
    charge of everything from the operating system and up; all software will be installed
    and managed by the customer, and the customer will supply and manage all the data.


    In terms of security, the customer is still losing the degree of authority they
    would have had in a traditional IT environment. For the instance, the customer
    does not get to select the IT assets used in the cloud, so the security of the
    acquisition process (during which many new vendors and suppliers) must be entrusted
    to the cloud provider. The customer may also lose some ability to monitor network
    traffic the data center—the provider might not be willing to allow the customer
    to place monitoring equipment or sensors on the provider''s infrastructure and
    authority


    This makes auditing, which also affects security policy and regulatory compliance.
    An organization migrating to the cloud will have these new constraints and will
    have to find some way to provide the requisite deliverables to regulators. This
    must be negotiated at the outset of migration, and early communication with regulators
    is highly advisable. For instance, if regulators insist on scheduled audits of
    the environment where data processing takes place, what will form those audits
    take if the organization cannot directly audit network traffic and event logs?


    In IaaS, though, the cloud customer may still collect and review event logs from
    the software, including the OS, which still lends a great deal of insight into
    the usage and security of the data.


    # PaaS Considerations


    With platform as a service (PaaS), the cloud customer loses more control of the
    environment, because the cloud provider is now responsible for installing, maintaining,
    and administering the OS as well as the underlying hardware. This will entail
    modification of the customer''s security policy and additional efforts to ensure
    regulatory compliance.


    The cloud customer still, however, gets to monitor and review software events,
    since the programs running on the OS will belong to the customer. The responsibilities
    for updating and maintaining the software will also be the customer''s. However,
    updates and administration of the OS now fall to the provider, which posing a
    loss of control for operational and security purposes on the customer''s part,
    may also represent a cost savings and increase of efficiency.


    # SaaS Considerations


    With software as a service (SaaS), of course, most of the control of the environment
    is ceded to the provider. The cloud customer will not have ownership of the hardware
    or the'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Design Principles for Protecting Sensitive Data


    software or the administration of either; the customer only supplies and processes
    data to and in the system.


    For all relevant intents and purposes, the cloud customer, as an organization,
    has taken the role and responsibilities of what a common user would have in a
    legacy environment: few administrative rights, few privileged accounts, and very
    permissions and responsibilities.


    The customer remains liable for all statutory and contractual obligations related
    to the safeguarding of the data but, in this case, has little control over how
    data is protected. The cloud provider is now exclusively responsible for all system
    maintenance, all security countermeasures, and the vast majority of policy (and
    implementation of that) affecting the data.


    # General Considerations


    In all models, the customer is giving up an essential form of control: physical
    access to the devices on which the data resides. This is a massive and increased
    risk of risk and loss of assurance; anyone who can physically access the location
    of the data can eventually take it, with or without permission.


    Can we implement measures to reduce the likelihood of breaches as a result of
    this risk? Course—and we need to do so, in order to demonstrate due care. Such
    measures include ensuring the cloud provider performs strict background checks
    and continuous monitoring of all personnel with access to the data center, extreme
    physical security measures at the data center location, encryption of data processed
    and stored in the cloud, assignment of contractual liability to the provider (bearing
    in mind that legal liability remains with the customer, however), and so forth.
    It is important to remember, though, the residual risk of losing physical access
    always remains, even when controls are utilized or other risk reduction methods
    are used. The following section will discuss these further.


    It is worth noting that there are no defined mandates or uniform solutions ubiquitous
    throughout the industry; each provider will be different, and each contract will
    be different, so each set of rights and responsibilities will vary according to
    what the customer and provider negotiate.


    # Design Principles for Protecting Sensitive Data


    The following sections review some secure architectural methods. Bear in mind
    that this is not an exhaustive list, and these techniques alone will not suffice
    to protect an organization and data, but they can serve as a guideline for IT
    infrastructure controls.


    # Hardening Devices


    In the traditional IT environment, devices in the DMZ (that notional area where
    the internal network is public-facing and connects to the outside world) were
    secured as a matter'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'of practice; we knew and understood that these boxes were more likely to suffer
    intrusion attempts, and we hardened them accordingly.


    For the cloud environment, it is probably best to adhere to this same practice,
    both from the cloud provider side of the equation and as cloud users. It is probably
    best to treat all resources in a cloud environment as if they are in the DMZ and
    harden them accordingly. In treating all cloud-related devices as they are in
    the DMZ, we are forming good habits and a conceptual way of viewing the cloud.


    The cloud provider should ensure that all devices in the data center are secured
    such that the following conditions are met:


    +   * All guest accounts are removed.

    * All unused ports are closed.

    * No default passwords remain.

    * Strong password policies are in effect.

    * Any admin accounts are significantly secured and logged.

    * All unnecessary services are disabled.

    * Physical access is severely limited and controlled.

    * Systems are patched, maintained, and updated according to vendor guidance and
    industry practices.


    These concepts should not be in any new to security practitioners, but they continue
    to have a significant value in the cloud motif.

    The cloud customer has a similar and, different, list of tasks. Customers must
    bear in mind the tasks related to how they access the cloud, which often takes
    the form of a bring your own device (BYOD) environment and always involves remote
    access. BYOD existed before the current ubiquity of cloud computing, and many
    of those known security practices can be employed for good effect in our current
    models.

    For instance, cloud customers ensure that all assets in their BYOD infrastructure
    access the cloud should:


    +   * be protected with some form of anti-malware/security software;

    * have remote/remove lock capability in the event of loss/theft, with the user
    granting permission to the organization to wipe via a signed authorized policy;

    * utilize some form of local encryption;

    * be secured with strong access controls (a password, or perhaps a biometric)
    in a multifactor configuration;

    * have and properly employ VPN solutions for cloud access;

    * have some sort of data loss, leak prevention, and protection (DLP) solution
    installed.


    The organization may also want to consider containerization software options for
    personally owned user devices as a means to isolate their personal data from the
    organization''s information.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Design Principles for Protecting Sensitive Data


    It''s not only physical devices that need to be hardened—we have to think of virtual
    devices in the same manner we''d consider their physical counterparts. Because
    cloud computing relies so heavily on virtualization for load balancing and scalability,
    it is important to remember that virtual instances will require strong protection
    both when being processed—can''t be detected by other instances/servers and while
    stored (as files, because they contain so much material attackers would like to
    acquire and they are portable). In terms of configuration, they also have to be
    hardened in all the same ways we secure physical machines.


    # Encryption


    I''ve mentioned encryption already, and you can expect to see more references
    throughout the book; it''s impossible to defeat modern security practices from
    various uses of encryption. This is true in the cloud as it was in the traditional
    IT environment.


    We will cover cloud data security, and the associated encryption mechanisms, in
    Chapter 4. For the purposes of this discussion (basic cloud design requirements),
    to suffice that encryption should be utilized as follows:


    +   In the data center for:

    - data at rest, which includes long-term storage/archiving/backups, protecting
    near-term stored files (such as snapshots of virtualized instances), preventing
    unauthorized access to specific datasets by authorized personnel (for instance,
    securing fields in databases so that database admins can manage without not modify
    content);

    - secure sanitization (cryptographic erasure/cryptoshredding)

    In communications between cloud providers and users for:

    - creating secure sessions,

    - ensuring the integrity and confidentiality of data transit


    > Eventually, we''d like to be able to process data in the cloud while it''s encrypted,
    having to decrypt it, so that it is never exposed, even temporarily, to anyone
    other than the authorized users. Although this capability is not currently available,
    ongoing research shows promise. This technology is known as homomorphic encryption,
    and it''s worth knowing the term and understanding the possibility, even though
    it''s still in the experimental stages.


    # Layered Defenses


    This another concept that is not new, but it''s one that carries over into the
    cloud. Also referred to as defense in depth, it is the practice of having overlapping
    means'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Chapter 2 ■ Design Requirements


    of securing the environment with a variety of methods. These should include a
    blend of

    administrative, logical, technical, and physical controls.


    From a cloud provider perspective, a layered defense should entail the following:


    +   - Strong personnel controls involving background checks and continual monitoring

    - Technological controls such as encryption, event logging, and access control
    enforcement

    - Physical controls related to both the overall campus, the various facilities,
    the areas

    within the data center where data is produced and stored, individual racks and
    par- ticular demands, and portable media entering and leaving the campus

    - Governance mechanisms and enforcement, such as strong policies and regular,
    thor- oud audits


    From a cloud customer perspective, similar efforts should include the following
    items:


    +   - Training programs for staff and users who need good coverage of security
    topics

    - Contractual enforcement of policy requirements

    - Use of encryption and isolation mechanisms on BYOD assets

    - Strong remote access control methods, perhaps including multifactor authentication


    > When considering secure architectures and designs, it is often helpful

    to refer to existing guidance; there is no reason to rediscover and reinvent

    very aspect of security for yourself when many publications and tools

    already exist. You might find useful:


    +   - The Cloud Security Alliance Cloud Controls Matrix (https://cloudsecurityalliance.org/group/cloud-controls-matrix/)

    - The National Institute of Standards and Technology (NIST''s) Risk

    Management Framework (SP 800-37) (http://nvpubs.nist.gov/nistppubs/SpecialPublications/NIST.SP.800-37r1.pdf)

    - ISACA''s COBIT


    # Summary


    In this chapter, we have gone into some depth discussing how an organization determines

    its business requirements and critical paths and what information is used for,
    in terms

    of security. We also covered the nominal boundaries of the various cloud service
    models

    and the rights and responsibilities related to each, both from the customer and
    provider

    perspectives. In addition, we touched on basic cloud architectural and design
    concepts for

    protecting sensitive data. In upcoming chapters, we will explore the latter topic
    in more

    detail.'
