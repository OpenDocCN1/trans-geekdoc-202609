  md: '# Answers to Assessment Test


    10. D. Replacing sensitive data with unique identification symbols is known as
    tokenization, a way of hiding or concealing sensitive data by representing it
    with unique identification symbols/addresses. While randomization and obfuscation
    are also means of concealing information, they are done differently.


    11. A. PaaS uses databases and big data storage types.


    12. B. Application virtualization abstracts software from the underlying operating
    system on which it is executed. SaaS is a cloud service model. A partition is
    an area of memory, usually on a drive. *Distributed* is a modifier usually suggesting
    multiple machines for a common purpose.


    13. C. The Sarbanes-Oxley Act (SOX) was enacted to respond to scandals in the
    late 1990s/early 2000s. SOX not only oversees accounting practices, it also holds
    them accountable for fraudulent/deceptive activity. HIPAA is a US law for medical
    information. PCI is an industry standard for credit/debit cards. GLBA is a US
    law for the banking and insurance industries.


    14. B. A hardware security module (HSM) is a device that can safely store and
    manage encryption keys. These can be used in servers, workstations, and so on.
    One common type is the Trusted Platform Module (TPM) and can be found on enterprise
    workstations and laptops. There is no term as a *trusted operating system module*,
    and public private keys are used with asymmetric encryption.


    15. B. This is the very definition of public cloud computing.


    16. A. In transparent encryption, the encryption key for a database is stored
    in the boot record of the database itself.


    17. B. A qualitative assessment is a set of methods or rules for assessing risk
    based on non-mathematical categories or levels. One that mathematical categories
    or levels is called a quantitative assessment. There is no such thing as a hybrid
    assessment, and SOC 2 is an audit report regarding control effectiveness.


    18. C. The CCM cross-references may industry standards, laws, and guidelines.


    19. B. Contracts between parties can establish the jurisdiction for resolving
    disputes; this takes primacy in jurisdiction (if not specified in the contract,
    other means will be used). Tort law refers to civil liability suits. Common law
    refers to laws regarding marriage, and criminal law refers to violations of state
    or federal criminal code.


    20. D. Of the answers given, option D is the most important. It is vital that
    any data center be close to resilient units, such as power, water, and connectivity.


    21. C. Encryption can be used in a cloud environment, by physical destruction,
    overwriting, and degausing may not be available due to access and physical separation
    factors.


    22. C. All of the rest of these options represent specific network attacks. Nmap
    is a relatively harmless scanning utility designed for network mapping. Although
    it can be used to gather information about a network as part of the process of
    developing an attack, it is not by itself an attack tool.'
