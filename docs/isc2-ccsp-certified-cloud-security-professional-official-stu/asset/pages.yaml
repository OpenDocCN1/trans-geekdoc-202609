  md: '# Audit Processes, Methodologies, and Cloud Adaptations 259


    both) to capture the necessary material in a manner or with the detail required
    for the satisfaction of a court (where evidence gathered and analyzed forensically
    ends up).

    The ISO standards mentioned earlier (specifically 27037 and 27042) are excellent
    guides for collecting, preserving, and analyzing forensic data. However, most
    custom-(and most CCSPs) do not have the skills and tools necessary for defensive
    evidence collection and analysis readily available. It is highly recommended that
    cloud customers undertaking a forensic investigation in the cloud enlist the services
