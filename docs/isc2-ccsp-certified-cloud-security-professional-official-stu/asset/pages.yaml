  md: '![](img/914e4f10ad3f2426a517172a28cd7161_190_0.png)


    In this chapter, we continue to explore cloud computing by learning about application
    design and architecture for the cloud as well as application testing and validation
    to ensure our cloud applications are secure. In the cloud context, applications
    are the main focus of the software as a service (SaaS) model. These web applications
    are the software that is consumed as part of the cloud offering. We will discuss
    and review their design, architecture, validation, processes, and lifecycle as
    well as the tools used to build and deploy successful cloud applications.


    We also examine the importance of training and awareness and issues involved with
    moving to building applications for the cloud environment. Finally, there is an
    in-depth look at the software development lifecycle, identity and access management,
    cloud application architecture, and software assurance validation.


    # Training and Awareness


    Training and awareness relates directly to application developers and how programmers
    need to have sufficient understanding of risks in the cloud environment to properly
    design secure software.


    Because applications manipulate data, we must determine the sensitivity of our
    data or data we may end up using it in such a way that we unnecessarily expose
    data. For instance, the data or results of its manipulation and processing contain
    personally identifiable information (PII) such as name, address, Social Security
    number, or health information? If so, the application, with the data to be stored
    and managed, may not be a good fit for a cloud solution. Moving an application
    to the cloud may not reduce risks, which is why it is so important to evaluate
    your situation and application before migration.


    It is also important to consider the responsibilities associated with using cloud
    data. When we begin discussing cloud applications, data concerns must be adequately
    addressed as it is vital that the data owner understand very clearly the responsibilities
    of each of the players in this endeavor. See Figure 7.1.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# FIGURE 7.1 Customer/provider responsibilities, Platform as a Service Software
    as a Service


    As you can see from Figure 7.1, there are differing responsibilities for each
    service and delivery model. However, under current laws, the data owner is always
    legally responsible for securing data. This is true even when the provider is
    tasked with financial liability according to the contract.


    On the other hand, if the nature and sensitivity of the data is such that it changes
    constantly or is of little value, moving the associated applications and related
    data to the cloud could make good sense, both from a computing and storage perspective
    and more importantly from the business perspective. An example of this is a wholesaler
    that uses images of catalogs with SKUs so that customers can order items online.
    As long as the actual purchase occurs in a different application, the catalog
    of items would be of little value to anyone other than the customer placing the
    order. In addition, as prices change rapidly, any associated prices would also
    be worth little. Therefore, the catalog application and its associated images
    and pricing could more than easily be moved to the cloud and secured with minimal
    effort and risk.


