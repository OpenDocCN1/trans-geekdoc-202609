- pgno: 84
  md: '![](img/914e4f10ad3f2426a517172a28cd7161_84_0.png)


    Data is an asset. As with all other assets, knowing what data you have, where
    it is (logically and physically), and its relative-value and need for protection
    is absolutely essential for proper-portioning security resources. In this chapter,
    we will discuss how data is categorized and classified, where the location of
    the data matters, intellectual property concepts and practices, and various aspects
    of data retention and deletion requirements.


    # # Data Inventory and Discovery


    In the previous chapter, we discussed the importance of creating an asset inventory;
    part of that effort will require identifying all the data owned by the organization.


    # Data Ownership


    When we talk about data, we must assign responsibilities according to who has
    possession and legal ownership of that data. In the cloud computing motif, we
    tend to assign roles to allocate those responsibilities.


    In most cases:


    +   - The data owner is the organization that has collected or created the data,
    in general terms. Within the organization, we often assign a specific data owner
    as being the individual with rights and responsibilities for that data; this is
    usually the department or business unit manager for the office that has created
    or collected a certain dataset. From a cloud perspective, the cloud customer is
    usually the data owner. Many international treaties and frameworks refer to the
    data owner as the data controller.


    +   - The data custodian is any person or entity that is tasked with the daily
    maintenance and administration of the data. The custodian also has the role of
    applying the proper security controls and processes as directed by the data owner.
    Within an organization, the custodian could be a database administrator.


    +   - Processing is anything that can be done to data: copying it, printing it,
    destroying it, utilizing it. The data processor is any organization or person
    who manipulates, stores, or moves the data on behalf of the data owner. From an
    international law perspective, the cloud provider is a data processor.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Here are essential points to remember about the rights and responsibilities
    of data ownership and custody.


    +   Data processors do not necessarily have all direct relationships with data
    owners; processors can be third parties, or even further removed down the supply
    chain.


    +   Data owners remain legally responsible for all data they own. This is true
    even if data is compromised by a data processor several times removed from the
    data owner.


    +   Ownership, custody, rights, responsibilities, and liability are all relative
    to the data in question and are only specific to that data in that circumstance.
    For instance, a cloud provider is usually the data processor for a cloud customer''s
    data, but the provider is the data owner for information that the provider collects
    and creates, such as the provider own customer list, asset inventory, and billing
    information.


    # The Data Lifecycle


    The data lifecycle is represented in Figure 3.1.


    FIGURE 3.1 Data lifecycle


    ![](img/914e4f10ad3f2426a517172a28cd7161_85_0.png)


    It is important to know the phases of the data lifecycle, in order, both for the
    CCSP exam and for your understanding of data security concepts. In this section
    of the chapter, we''re mostly concerned with the first phase: Create.


    The data owner will be identified in the Create phase. Many data security and
    management responsibilities require action on the part of the data owner at this
    point of the lifecycle.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Going with the Flow


    In order to apply controls in a sensible way throughout the lifecycle, taking
    into consideration which aspects are overseen by the cloud customer and by the
    provider, it is useful to diagram the way data moves through the various production
    processes. This can be done with traditional business-oriented flow charts and
    line diagrams, in order to visually portray the steps in a process, or with more
    system-oriented data flow diagrams (DFDs). A DFD is extremely useful in systems/software
    engineering in order to establish functional requirements before selection of
    the technology takes places; this obviates the likelihood that a choice of platform
    or component will drive the business process instead of the other way.


    In a cloud-based environment, diagramming allows the cloud customer to determine
    where specific controls need to be added and are already supported by the provider
    (as stated in the contract/terms of service) and can aid in the implementation
    of controls as.


    # Data Categorization


    The data owner will be in the best position to understand how the data is going
    to be used by the organization. This allows the data owner to appropriately categorize
    the data. The organization can have any number of categories or types of information;
    these might be clearly defined and reused throughout the organization, or they
    might be arbitrarily assigned by data owners during the Create phase.


    Here are some organization might categorize data:


    **Regulatory Compliance** Different business activities are governed by different
    regulations. The organization may want to create categories based on regulations
    which apply to a specific dataset. This might include the Graham-Leach-Biley Act
    (GLBA), Payment Card Industry (PCI), Sarbanes-Oxley (SOX), Health Insurance Portability
    and Accountability (HIPAA), General Data Protection Regulation (GDPR), and/or
    other forms of international, and local compliance.


    **Business Function** The organization might want to have specific categories
    for different uses of data. Perhaps the data is tagged based on its use in billing,
    marketing, or operations.


    **Functional Unit** Each department or office might have its own category and
    keep all data it controls within its own category.


    **By Project** Some organizations might define datasets by the projects they are
    associated with as a means of creating discrete, compartmentalized projects.


    There is literally no limit to how an organization might categorize data. Whether
    motif the organization uses, however, should be adopted and enforced uniformly
    throughout the organization. Ad hoc categorization is the same as having no categorization
    at all.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Data Classification


    Much like categorization, data classification is the responsibility of the data
    owner, takes place in the Create phase, and is assigned to an overall organizational
    policy based on a specific characteristic of the given dataset. The classification,
    like the categorization, can take any form defined by the organization and should
    be uniformly applied.


    Types of classification might include the following:


    **Sensitivity** — This is the classification model used by the US military. Data
    is assigned a classification according to the sensitivity of the data, based on
    the negative impact an unauthorized disclosure would cause. In models of this
    kind, classification must be assigned to all data, even in the negative, so material
    that is not deemed to be sensitive must be assigned the "unclassified" label.
    We will discuss labeling shortly.


    **Jurisdiction** The geophysical location of the source or storage point of the
    data might have significant bearing on how data is treated and handled. For instance,
    personally identifiable information (PII) data gathered from citizens of the European
    Union (EU) is subject to the EU privacy laws, which are much stricter and more
    comprehensive than privacy laws in the United States.


    > Personally identifiable information (PII) is one of many types of sensitive
    data. PII is discussed further in many chapters of this book.


    **Criticality** Data that is deemed critical to organizational survival must be
    classified in a manner distinct from trivial, basic operational data. As we know
    from previous chapters, the business impact analysis (BIA) helps us determine
    what material would be classified this way.


    > There are no de-identified, statutory-mandated definitions for "categorization"
    versus "classification" of data, except in those areas covered by specific regulations
    (for instance, the US military uses classification structures defined by federal
    law). The terms can often be used interchangeably. For the purposes of discussion
    in this book, I will try to adhere to this understanding of the terms: data is
    categorized by its use and classified by a certain trait. Again, this is not an
    industry standard, and IISC does not create a bright-line distinction between
    the terms.


    # Data Mapping


    Data between organizations (or sometimes even between departments) must be normalized
    and translated so that it conforms in a way meaningful to both parties. This is
    typically referred to as data mapping. When used in the context of classification
    efforts, mapping is necessary so that data that is known as sensitive (and in
    need of protection) in one system/'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Data Inventory and Discovery


    organization is recognized as such by the receiving system/organization so that
    those protections can continue. Without proper mapping efforts, data classified
    at a specific level might be exposed to undue risk or threats.


    # Data Labeling


    When the data owner creates, categorizes, and classifies the data, the data also
    needs to be labeled. The label should indicate who the data owner is, usually
    in terms of the office or instead of an individual name or identity (because,
    of course, personnel can change roles with an organization or leave for other
    organizations). The label should take whatever format is necessary for it to be
    enduring, understandable, and consistent; for instance, labels on data in hardcopy
    may be printed headers and footers, whereas labels on electronic files might be
    embedded in the filename and nomenclature. Labels should be evident and communicate
    the concepts without necessarily disclosing the data they describe. Depending
    on the needs of the organization and nature of its operations, labels might include
    the following kinds of information:


    +   - Date of creation

    - Date of scheduled destruction/disposal

    - Confidentiality level

    - Handling directions

    - Dissemination/distribution instructions

    - Access limitations

    - Source

    - Jurisdiction

    - Applicable regulation


    Real World Scenario

    Labels Work Both Ways

    Labels can aid in security efforts by readily identifying the nature of certain
    information and how it should be handled and protected. For instance, in the US
    military and federal government, classified data in hardcopy is labeled in a number
    of ways, including use of cover sheets. Cover sheets convey only one characteristic
    of the data: the sensitivity of the material (in military taxonomy, this is called
    "classification," with a somewhat different meaning than what is used in this
    book). Sensitivity is indicated in at least two ways: the title of the class (e.g.,
    Secret, Top Secret) in large, bold letters, and the color of the sheet and markings
    (blue for Confidential, red for Secret, and so forth). This reminds the user (the
    person carrying or reading the documents) in a very simple way how to secure the
    material when it is not in use or is unattended. It also informs anyone else how
    to react if they'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'come across such material unattended; a manager leaving the office at the end
    of the workday might do one last walk-through of the workspace, and a red cover
    sheet left on a desk would immediately catch the eye.


    Of course, this also has the same effect for malicious actors; the cover sheet
    lets someone with ill intent instantly know the potential value of specific material:
    the pages with a red cover sheet are more valuable than the ones with the blue
    cover sheet.


    # Data Discovery Methods


    To determine and accurately inventory the data under its control, the organization
    can employ various tools and techniques. Data discovery is a term that can be
    used to refer to several kinds of tasks: it might mean that the organization is
    attempting to create an initial inventory of data it owns or the organization
    is involved in electronic discovery (e-discovery), the legal term for electronic
    evidence as part of an investigation or lawsuit; we will discuss this in more
    depth in Chapter 11, “Legal and Compliance Part 2”), and it can also mean the
    use of longterm tools to discover trends and relations in the data already in
    the organization''s inventory.


    # Label-Based Discovery


    Obviously, the labels created by data owners in the Create phase of the lifecycle
    will greatly aid any data discovery effort. With accurate and sufficient labels,
    the organization can readily determine what data it controls and what amounts
    of each kind. This is another reason the habit and process of labeling is so important.


    Labels can be especially useful when the discovery effort is undertaken in response
    to a mandate with a specific purpose, such as a court order or a regulatory demand:
    if all data related to X is required, and all data is readily available, it is
    easy to collect and disclose all the appropriate data, and only the appropriate
    data.


    # Metadata-Based Discovery


    In addition, metadata can be useful for discovery purposes. Colloquially referred
    to as “data about data,” metadata is a listing of traits and characteristics about
    specific data elements or sets. Metadata is often automatically created at the
    same time as the data, often by the hardware or software used to create the parent
    data. For instance, most digital cameras create a vast amount of metadata every
    time a photograph is taken, such as date, time, and location where the photo was
    shot, and model of the camera, and so forth; all metadata is embedded in the picture
    file and is copied and transferred whenever the image itself is copied or moved.


    Data discovery can therefore use metadata in the same way labels might be used;
    specific fields of the metadata might be scanned for particular terms, and all
    matching data elements collected for a certain purpose.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Content-Based Discovery


    Even without labels or metadata, discovery tools can be used to locate and identify
    specific kinds of data by delving into the content of datasets. This technique
    can be as basic as term searches or can use sophisticated pattern-matching technology.


    ![](img/914e4f10ad3f2426a517172a28cd7161_90_0.png)


    Content analysis can also be used for more-specific security controls well as
    discovery; we will discuss egress monitoring solutions in Chapter 4, "Cloud Data
    Security."


    # Data Analytics


    Current technological options provide additional options for finding and assigning
    types to data. In many cases, modern tools create new data feeds from sets of
    data that already exist within the environment. These include the following:


    **Datamining** The term for the family of activities with which the other options
    on this list derive. This kind of data analytics is an outgrowth of the possibilities
    offered by regular use of the cloud, also known as "big data." When the organization
    has collected various data streams and run queries across these fields, the organization
    can detect and analyze previously unknown trends and patterns that can be extremely
    useful.


    **Real-Time Analytics** In some cases, tools can provide datamining functionality
    concurrent with data use. These tools use automation and require efficiency to
    perform properly.


    **Agile Business Intelligence** State-of-the-art datamining involves recursive,
    iterative tools and processes that can detect trends and identify even more oblique
    patterns in historical and recent data.


    # Structured vs. Unstructured Data


    Data that is sorted into meaningful, discrete types and attributes, such as data
    in a database, is said to be structured. Unsorted data (such as the content of
    various emails in a user''s Sender folder, which could include discussion of any
    topic or contain all types of content) is considered unstructured. It is typically
    much easier to perform data discovery actions on structured data because data
    is properly situated and arranged.


    ![](img/914e4f10ad3f2426a517172a28cd7161_90_1.png)


    It''s worth your time to understand data analytics options, both for purposes
    of the exam as well as possible security implications in your organization.


    # Jurisdictional Requirements


    Various legal constructs exist across the globe, and being in the cloud means
    your organization may be subject to many simultaneously. This can create additional
    risks for your organization and more complications as a security practitioner.
    It will be your duty to'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 52 Chapter 3 ■ Data Classification


    be aware of which laws affect the organization, and you must have a general idea
    of how to ensure your organization can comply with them all.


    Unfortunately, the use of cloud computing comes with some challenges in terms
    of awareness and compliance with specific jurisdictions. For instance, because
    of the way resources are dynamically assigned, the cloud user might not know exactly
    where in terms of both data centers and geographic locations, the organization''s
    data is physically located at any given moment; the data may cross city lines,
    state lines, or even national borders as the cloud provider manages virtualized
    images, stored data, and operational data. The cloud provider might not know even,
    moment by moment, which city, state, or country data is located in. depending
    on the level of automation and data center design,


    So for both the CSP and the organization, you should be familiar with several
    legal constructs that may significantly affect the data in your charge. The book
    addresses many of these in detail in Chapters 10 and 11; I''m going to list some
    of them here, with brief notes, to introduce the concepts.


    **The United States** The United States offers strong protections for intellectual
    property. There is no singular, overarching federal privacy statute; instead,
    the United States tends to address privacy with industry-specific legislation
    (GLBA for banking/insurance, HIPAA for medical care, and so forth) or with contractual
    obligations (PCI). Many strong, granular data breach laws that are enforced by
    states and locals (especially New York and California).


    **Europe** Europe provides good intellectual property protections. It has massive,
    exhaustive, comprehensive privacy protections, including the EU General Data Protection
    Regulation.


    **Asia** Asia has disparate levels of intellectual property protection. Data privacy
    levels differ greatly by country. With its Act on the Protection of Personal Information,
    Japan adheres to the EU model, and Singapore does the same. Other countries follow
    much-reduced guidance. China, for example, has legal requirement that is the opposite
    of privacy: all IT traffic and communications in China must be accessible by the
    Chinese government.


    **South/Central America** South America and Central America have various intellectual
    property mechanisms. Most countries lack privacy protection frameworks, with notable
    exception of Argentina, with its Personal Data Protection Act is in direct correlation
    with the EU legislation.


    **Australia/New Zealand** Australia and New Zealand provide strong intellectual
    property protections and very strong privacy protections, with the Australian
    Privacy Act mapping directly to the EU statutes.


    > The EU privacy laws will be a big driver for any organization wanting to do
    business in or with Europe. For exam purposes, you should be versed in the EU
    General Data Protection Regulation as well as the mechanisms used in the United
    States to comply with these laws (known as the Privacy Shield). These are addressed
    further in Chapters 10 and 11.


    ![](img/914e4f10ad3f2426a517172a28cd7161_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Information Rights Management (IRM)


    Managing IRM in accordance with who has rights to it is part of information rights
    management (IRM). The term DRM is often seen in our industry, sometimes taken
    to mean "digital rights management" or "data rights management." Other terms used
    to convey meanings include ERM (enterprise rights management) and offshoots such
    as E-DRM. There is no conclusive international or industry standard defining these
    terms or how they might be applied in a given process or tool.


    Suff to say, the concept of "rights management", regardless of the preceding modifier,
    entails the use of specific control mechanisms to protect types of assets, usually
    at the file level. For example, an organization might have an overall access control
    program that requires users to log in the systems that they for performing job
    functions. Beyond basic access, these users manipulate, such as sensitive documents,
    might have additional protections for "rights management" that prevent the users
    from deleting, modifying, or copying those files.


    For study purposes, bear mind that the ISC favors the term IRM to discuss this
    concept. This book will use IRM for this purpose.


    # Intellectual Property Protections


    Intellectual property is that class of valuable belongings that are intangible;
    literally, assets of the mind. In many countries, there are many legal protections
    for intellectual property and you should be familiar with them.


    # Copyright


    The legal protection for expressions of ideas is known as *copyright*. In the
    United States, copyright is granted to anyone who creates an expression of an
    idea. Usually, this involves literary works, films, music, software, and artistic
    works.


    > Oddly, copyright does not include titles of works. For instance, you cannot
    copy and sell the film Star Wars, you could, theoretically, produce, and sell
    a new movie that you call *Star Wars*, as long as it does not cover the same material
    as the other film with that name. I don''t, however, recommend it.


    Copyright does not cover ideas, specific words, slogans, recipes, or formulae.
    Those things can often be secured with other intellectual property protections;
    we will discuss this later in this section.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Copyright protects the tangible expression of an idea, not the form of an idea.
    For instance, copyright protects the content of a book, not the hard-copy version
    of a book itself; illegal copying of a book''s contents would be a copyright infringement,
    whereas stealing a physical book would be theft. The copyright belongs to the
    author or whoever the author sells or grants rights to, not to someone who holds
    the physical copy of the book.


    The duration of copyrights vary on the terms under which they were created, depending
    on if an individual created the work or if the work was created under contract
    (a “work-for-hire”). Typically, copyright lasts for either 70 years after the
    author’s death or 120 years after the first publication of a work for hire.


    Copyright gives exclusive use of the work to the creator, with some exceptions.
    The creator is the only entity legally allowed to do the following:


    +   * Perform the work publicly.

    * Profit from the work.

    * Make copies of the work.

    * Make derivative works from the original.

    * Import or export the work.

    * Broadcast the work.

    * Sell or otherwise assign these rights.


    This discussion goes beyond the scope of the CCSP, but there are exceptions to
    the exclusivity of copyright:


    +   * Fair Use: There is a family of exceptions to copyright exclusivity, known
    as “fair use.” Fair use includes the following scenarios:


    +   * Academic Fair Use: Instructors can make limited copies or presentations
    of copyrighted works for educational purposes.


    +   * Critique: Portions of the work may be used in critical reviews, discussing
    or assessing its merit.


    +   * News Reporting: Because an informed populace is essential to a free society,
    we have waived some intellectual property protections for reporting purposes.


    +   * Scholarly Research: Similar to academic fair use, but among researchers
    instead of teachers and students.


    +   * Satire: A mocking sendup of the work may be created using a significant
    portion of the original work.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Information Rights Management (IRM) 55


    +   - Library Preservation: Libraries and archives are allowed to make limited
    numbers of copies of original works in order to preserve the work itself.


    +   - Personal Backup: Someone who has legally purchased licensed work may make
    a single backup copy for themselves, if the original fails. This explicitly includes
    computer programs.


    +   - Versions for People with Physical Disabilities: It is legal to make specialized
    copies of licensed work for someone with a disability.,


    These exceptions are not unlimited. Anyone using a copyright exception has to
    consider many subjective factors, including the possible commercial market for
    the work and the size, scope, and nature of the original work.


    The fact that something is copyrighted is often communicated by attaching the
    copyright symbol to it, sometimes with additional text that emphasizes this fact.
    See Figure 3.2.


    # FIGURE 3.2 The copyright symbol


    ![](img/914e4f10ad3f2426a517172a28cd7161_94_0.png)


    > NOTE Copyright infringement is usually dealt with a civil case: the copyright
    owner has to bring a lawsuit against someone they believe has illegally copied
    or used their work. However, in some cases, demonstrated willful infringement
    can be investigated by the government as a criminal matter and referred to as
    *piracy*.


    Different countries view copyright in various ways. Although the creator automatically
    owns the copyright in the United States, in some jurisdictions the copyright belongs
    to the person who first registers the work in that jurisdiction.


    | Real World Scenario |

    | The DMCA |

    | The Digital Millennium Copyright Act (DMCA) is a notorious piece of legislation
    ostensibly created to provide additional protections to creative works in digital
    formats. It is generally viewed as both crafted for too specific purpose and also
    used in an overly broad |'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Chapter 3 ■ Data Classification


    manner. It also puts the burden of proof on accused of copyright infringement
    and requires preemptive action upon accusation.


    The details of how the DMCA came into being might be beyond the scope of the CCP
    exam, but they are interesting: The Hollywood film industry was using an electronic
    encryption mechanism known as CSS–the Content Scramble System–to protect content
    on DVDs from being illegally copied. A group of people created a program to remove
    this encryption from DVDs; this program was known as DeCSS. Lobbyists for content
    producers, under specific direction from the Motion Picture Association of America,
    and eventually with the participation of the Recording Industry Association of
    America, vowed Congress to pass the DMCA and programs like it illegal; this would
    include writing, distributing, and publishing anti-encryption software. The intent
    was to protect copyrighted material (movies and songs, for the most part) from
    piracy.


    In practice, however, the effect has been different. Certain provisions of the
    DMCA, namely the "takedown notice" process, have been abused as a matter of course.
    Under the takedown notice clause, any web hosting service must remove content
    from the Internet if one makes an accusation that it includes copyrighted material,
    and that material has remain off the web whoever prove either that the material
    is not copyrighted or that they own the copyright. This has led to significant
    use of the takedown notice for frivolous or malicious reasons. This is just one
    of many unintended consequences of the DMCA.


    # Trademarks


    Unlike copyrights, trademark protection is intended to be applied to specific
    words and graphics. Trademarks are representations of an organization–its brand.
    A trademark is meant to protect the esteem and goodwill that an organization has
    built over the market-place, especially in public perception.


    A trademark can be that of an organization, a logo, a phrase associated with an
    organization, even a specific color or sound, or some combination of these.


    In order to have a trademark protected by law, it must be registered within a
    jurisdiction. Commonly, this is the US Patent and Trademark Office (USPTO), the
    federal entity for registering trademarks. Trademarks registered with the USPTO
    can use the ® to signify registration. States also offer trademark registration,
    and trademarks registered with state offices often use the TM symbol.


    Trademarks last into perpetuity, as long as the trademark owner continues to use
    them for commercial purposes. Trademark infringement is actionable, and trademark
    owners can sue in court for remedy for infringement.


    # Patents


    The USPTO, as name indicates, is also responsible for registering patents. Patents
    are the legal mechanism for protecting intellectual property in the form of inventions,'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Information Rights Management (IRM) 57


    processes, materials, decorations, and plant life. Securing a patent, the patent
    owner gains exclusivity in the production, sale, and importation of the patented
    property.


    Patents typically last for 20 years from the time of the patent application. There
    is some provision for extension, since the process of getting a patent can take
    many months, or years. Patent infringement, as with the other intellectual property
    protections, is cause to sue for relief in federal court.


    Globally, prospective patent holders might apply to the World Intellectual Property
    Office (WIPO) for Patent Cooperation Treaty, which has 152 signatory member nations.
    If a patent is approved by the WIPO, the property protected by the patent will
    be recognized in each of the member countries.


    # Trade Secrets


    Trade secrets are intellectual property that involve many of the aspects as patented
    material: processes, formulas, chemical methods, and so forth. They can also include
    some things that are not patentable, as aggregations of information (this might
    include lists of clients or suppliers, for instance).


    Trade secrets are somewhat like copyrights in the United States, in that protections
    exist upon creation, without any additional requirement for registration.


    Unlike other intellectual property protections, material considered trade secrets
    must be secret: they cannot be disclosed to the public, and efforts must be made
    to maintain secrecy in order to receive protection.


    Trade secrets are provided legal protection from illicit acquisition; anyone who
    tries to acquire trade secrets by theft or misappropriation can be sued in civil
    court for this crime (similar to other forms of intellectual property), but they
    can also be prosecuted in federal court for this crime.


    Trade secret protection does not, however, confer the exclusivity granted by other
    intellectual property protections. Anyone other than the owner of the trade secret
    discovers or invents the same or similar methods, processes, and information through
    legal means is justified and free to use knowledge to their own benefit. In fact,
    whoever discovers someone''s trade secret through legitimate means is also free
    to patent it (assuming there is no patent on the material or content).


    Like a trademark, a trade secret lasts into perpetuity, as long as the owner is
    still using it in commercial activity.


    # IRM Tool Traits


    IRM can be implemented by manufacturers, vendors, or content creators. Usually,
    material protected by IRM solutions need some form of labeling or metadata associated
    with the material in order for the IRM tool to function properly.


    IRM implementations can vary in technological sophistication and technique. Here
    are some ways IRM has been or could be applied:


    Rudimentary Reference Checks The content itself can automatically check for proper
    usage or ownership. In many vintage computer games, the game would pause in operation
    until the player entered some information that could only have been acquired'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Chapter 3 · Data Classification


    with the purchase of a licensed copy of the game, like a word or a phrase from
    the manual that shipped with the game.


    **Online Reference Checks** Microsoft software packages, including Windows operating
    systems and Office programs, are locked in the same manner, requiring users to
    enter a product key at installation; the program would then check the product
    key against an online database when connected to the Internet.


    **Local Agent Checks** The user installs a reference tool that checks the protected
    content against the user''s license. Again, gaming engines work this way, with
    gamers having to download an agent of Steam or 600 con when installing any games
    purchased from those distributors; the agents check the user''s system against
    the online license database to ensure the games are not pirated.


    **Presence of Licensed Media** Some IRM tools require the presence of licensed
    media, such as disks, while the content is being used. The IRM engine is on the
    media, often installed with some cryptographic engine that identifies the unique
    disk and the licensed content and allows usage over that relationship.


    **Support-Based Licensing** Some IRM implementations are predicated on the need
    of continual support; this is particularly true of production software. Licensed
    software might be allowed reality access to updates and patches, which the vendor
    could prevent unlicensed versions from getting this type of support.


    IRM implementations usually include adding another layer of access control (beyond
    what the enterprise employs for its operational purposes) on files and objects
    containing protected material. IRM can also be used to implement localized information
    security policies; groups of users may have all content they create specially
    tagged and marked with appropriate restrictions, for instance,


    Employing IRM in the cloud poses some challenges. These include the following:


    **Replication Conflicts** Because IRM often involves preventing unauthorized duplication,
    and the cloud necessitates creating, closing, and replicating virtualized hosts
    including user-specific content stored on the virtual host, IRM may interfere
    with automatic resource allocation processes.


    **Jurisdictional Conflicts** The cloud extends across boundaries and borders,
    often in a manner or uncontrolled by the data owner, which can cause problems
    when intellectual property rights are restricted by locale.


    **Agent/Enterprise Conflicts** IRM solutions that require local installation of
    software agents for enforcement purposes might not always function properly in
    the cloud environment, with virtualization engines, or with the various platforms
    used in a bring your own (BYOD) enterprise.


    **Mapping Identity and Access Management (IAM) and IRM** Because of the extra
    layer of access control (often involving content-specific access control lists,
    or ACLs), the IRM processes may conflict or not work properly with the enterprise/cloud
    IAM. A conflict is even more possible when cloud IAM functions are outsourced
    to a third party, such as a cloud access security broker (CASB).'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'API Conflicts Because the IRM tool is often incorporated into the content,
    usage of the material might not offer the same level of performance across different
    applications, such as content readers or media players.


    In general terms, IRM should provide the following functions, regardless of type
    of content:


    Persistent Protection should follow the content it protects, regardless of where
    content is located, whether it is a duplicate copy or the original file, or how
    it is being utilized. This protection should not be easy to circumvent.


    Dynamic Policy Control The IRM tool should allow content creators and data owners
    to modify ACLs and permissions for the protected data under their control.


    Automatic Expiration Because of the nature of some legal protections of intellectual
    property (described in this chapter), a significant amount of content will not
    be protected in perpetuity. The IRM protections should cease when the legal protections
    cease. Conversely, licenses also expire; and permissions for protected content
    should likewise expire, no matter what content exists at the end of the license
    period.


    Continuous Auditing The IRM should allow for comprehensive monitoring of the content''s
    use and access history.


    Replication Restrictions Much of the purpose of IRM is to restrict illegal or
    unauthorized duplication of protected content. Therefore, IRM solutions should
    enforce these restrictions across the many forms of copying that exist, to include
    screen-scraping, printing, electronic duplication, email attachments, and so on.


    Remote Revocation The owner of the rights to specific intellectual property have
    the ability to revoke those rights at any time; this capability might be used
    as a result of litigation or infringement.


    # Data Control


    The organization also needs to protect data in lifecycle phases other than Create.
    You will need to make, use, and enforce a set of data management policies and
    practices that cover topics such as retention, audit, and disposal. The following
    sections will address each of those in.


    ![](img/914e4f10ad3f2426a517172a28cd7161_98_0.png)


    Each aspect of data management—retention, audit, and disposal—will need a specific
    policy addressing it. There is no reason, however, that you cannot include all
    three under one overarching policy, such as a data management policy. Just be
    sure each area is addressed thoroughly with sufficient granularity; don''t let
    any individual subpolicy inferior in quality or comprehensiveness simply because
    you''re aggregating your required governance.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Data Retention


    With all matters involving our profession, the organization''s data retention
    program should start with and be based on a strong, coherent policy. The data
    retention policy should include the following:


    Retention Periods The retention period is the length of time that the organization
    should keep data. This usually refers to data that is archived for long-term storage—that
    is, data not being used in the production environment. The retention period is
    often expressed in a number of years and is frequently set by regulation or legislation
    (see the next item). Data retention periods can also be mandated or modified by
    contractual agreements.


    Applicable Regulation As just mentioned, the retention period can be mandated
    by statute or contract; the retention policy should refer to all applicable regulatory
    guidance. This is especially true in cases where there is conflicting regulation;
    the policy should then highlight any disparity, and include mention of senior
    management''s decision for how to approach and resolve this conflict with the
    policy as an appropriate mechanism. For instance, laws may impose different retention
    periods for specific kinds of data, and the organization might operate in states
    with differing mandated periods; the policy should then explicitly explain the
    conflicting periods as well as the period management determined as the solution.


    Retention Forms The policy should contain a description of how the data is actually
    archived—that is, what type of media it is stored on and any handling specifications
    particular to the data. For example, some types of data are required by regulation
    to be encrypted while in storage. In these cases, the policy should include a
    description of the encryption engine, key storage and retrieval procedures, and
    reference to the applicable regulations.


    Data Classification Highly sensitive or regulated data may mandate specific retention
    periods, by mandate or contract or best practice. The organization can use the
    classification level of data to determine how long specific datasets or types
    of data need to be retained. Conversely, the retention period, if mandated, should
    be considered when the organization crafts the classification policy as a means
    to describe/create classification levels (e.g., the longer retention period, the
    higher classification).


    Archiving and Retrieval Procedures Having data in storage is useful; stored data
    can be used to correct production errors, can serve as business continuity and
    disaster recovery (BC/DR) backups, and can be damined for business intelligence
    purposes. But stored data is only useful if it can be retrieved and put back into
    storage in an efficient and cost-effective manner. The policy should mandate the
    creation of a detailed description of the processes for both sending data into
    storage and recovering it. The detailed processes might be included as an attachment
    to the policy or mentioned by reference to the actual documentation for the processes;
    the processes might require more frequent updates and editing than the policy
    and could be kept separate.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Monitoring, Maintenance, and Enforcement As with policies in the organization,
    the policy should list, in detail, how often it will be reviewed and amended,
    by whom, sequences for failure to adhere to the policy, and which entity within
    the organization is responsible for enforcement.


    Backups are great; a lot of organizations do regular, thorough backups. However,
    all too often, these same organizations don''t practice recovery from backup,
    so they unprepared for situations where recovery and recovery efforts are hampered
    or fail. It is useful, and in some cases required by regulation, to test your
    organization''s recovery in order to ensure this won''t happen to you.


    ![](img/914e4f10ad3f2426a517172a28cd7161_100_0.png)


    Managing data retention in the cloud can be tricky; it may be difficult to ensure,
    for instance, the cloud provider is not retaining the organization''s data beyond
    retention period (part of the appeal is how good cloud providers are at retaining
    data, and not losing it; purposefully getting rid of data is a whole other matter).
    When considering cloud migration, and during negotiations with potential cloud
    providers, the organization should make a point of ensuring the provider can support
    the organization''s retention policy.


    The data retention policy addresses the activities that take place in the Archive
    phase of the data lifecycle.


    ![](img/914e4f10ad3f2426a517172a28cd7161_100_1.png)


    # Legal Hold


    In some jurisdictions, the concept of a “legal hold” severely affects an organization''s
    data retention and destruction policies because it supersedes them. When an organization
    is notified that (a) a law enforcement/regulatory entity is commencing an investigation
    or (b) a private entity is commencing litigation against the organization, the
    organization must suspend all relevant data destruction activities until the investigation/lawsuit
    has been fully resolved. (All “relevant” data destruction activities are those
    related to the particular case in question. The organization may continue to destroy
    data/material that is not associated with the particular case.)


    This usually takes precedence over any other organizational policy, applicable
    law, contractual agreement, or motivation. For instance, in the United States,
    this concept is dictated by the Federal Rules of Evidence, which mandates that
    a legal hold has primacy, over federal laws (such as HIPAA) that would require
    data to be destroyed at the end of a retention period.


    Therefore, a legal hold can be considered a temporary paramount retention period.


    # Data Audit


    As with other assets, the organization needs to regularly review, inventory, and
    inspect the usage and condition of the data it owns. Data audit is a powerful
    tool for these purposes.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Chapter 3 ■ Data Classification


    As with the other elements of data management, the organization should have a
    policy for conducting audits of its data. The policy should include detailed descriptions
    of the following items:


    +   * Audit periods

    * Audit scope

    * Audit responsibilities (internal and/or external)

    * Audit processes and procedures

    * Applicable regulations

    * Monitoring, maintenance, and enforcement


    As with all types of audits, the organization should be particularly careful about
    ensuring that auditors do not report to anyone in the management structure that
    owns or is affected by the data audited; conflicts of interest must be avoided
    for the audits to have validity and utility.


    In most organizations and enterprises, audit is predicated on logging. Logging
    can happen in many forms: event logging, security logging, traffic logging, and
    so forth. Logs can be generated by applications, OS, and devices for general or
    specific purposes (e.g., devices that collect logs as a product of operations,
    such as servers, or devices that do logging as their main purpose, such as IDS
    (Intrusion detection systems) and SIEMs (security information and event management)).


    Log review is a specialized task for personnel with specific training and experience.
    Logging is fairly easy; most software and devices in modern enterprises can effectively
    log anything and everything the organization might want to capture. Reading and
    analyzing these logs, however, can prove challenging:


    **Log review and analysis is not a priority.** Most organizations do not have
    therewith to dedicate the personnel required to effectively analyze log data.
    Usually, log review becomes an additional duty for someone another office (the
    security department, for instance). And many duties do not get accomplished because
    the personnel assigned to them become task-saturated with their other, regular
    job tasks.


    **Log review is mundane and repetitive.** Reviewing logs takes a certain kind
    of person: someone who can sift through logs of data in order to spot the fractional
    portion that might vary from the norm. This is not exciting work, and even the
    best analyst can lose due to repetition.


    **Log review requires both field and experienced.** This can become a management
    quandary: the log reviewer must be someone junior enough that they can be assigned
    to perform log reviews without incurring much trade-off cost to the organization
    (that is, other functions they might be performing are not more expensive or valuable
    than the log reviews), yet the person needs to have sufficient experience and
    training to perform the activity in a worthwhile manner.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The reviewer needs to have an understanding of the operation. If the reviewer
    cannot distinguish between what is authorized activity and what is not, they are
    not adding security value to the process.


    ![](img/914e4f10ad3f2426a517172a28cd7161_102_0.png)


    It might serve the organization well for log reviews to be only a part-time function
    of a specific individual. If a person is only doing log analysis and has no other
    duties, repetition and boredom might lead to the person missing something in the
    review that would have otherwise been noticed. However, the person assigned to
    review logs must perform the task often enough that they recognize baseline activity,
    and therefore deviations from it; long periods between analysis sessions might
    lead to the analyst losing institutional knowledge and some atrophy of the skillset.


    Logs like data backups, though many organizations perform logging; logs are easy
    to set, acquire, and store. The challenge, then, is to determine how often will
    be reviewed or audited, by whom, the processes for doing so, and so forth. Having
    logs is one thing; reviewing the logs you have is something else.


    ![](img/914e4f10ad3f2426a517172a28cd7161_102_1.png)


    A natural inclination of a security practitioner might be to log everything; people
    in our field are notoriously loathe to part with data and want to know everything
    about everything. The problem with doing so everything creates additional risks
    and costs. Having so much data aggregated creates additional vulnerabilities and
    requires additional protections, and the storage required for logging everything
    will entail a wholesale duplication of storage systems and space.


    Data audit in the cloud can pose almost insurmountable challenges. The cloud provider
    may not want (or, even be able to, for contractual or recreational agreements)
    disclose data to the customer for security, liability, or competitive reasons.
    Therefore, the organization must consider, again, specific audit requirements
    when opting for cloud migration and include any specifications in the contract
    with the cloud provider.


    ![](img/914e4f10ad3f2426a517172a28cd7161_102_2.png)


    The data audit policy addresses activities that take place in all phases of the
    data lifecycle.


    # Data Destruction/Disposal


    In the traditional environment, where the organization has ownership and control
    of all the infrastructure, including the data, hardware, and software, data disposal
    options are direct and straightforward. In the cloud, data disposal is much more
    difficult and risky.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Chapter 3 · Data Classification


    First, a review of data disposal options in the traditional environment:


    **Physical Destruction of Media and Hardware** any hardware or portable media
    containing the data can be destroyed by burning, melting, impact (beating, drilling,
    grinding, and so forth), or industrial shredding. This is the preferred method
    of sanitization since the data is physically unrecoverable.


    **Degaussing** involves applying strong magnetic fields to the hardware and media
    where the data are erased, effectively making them blank. It does not work with
    solid-state drives.


    **Overwriting** multiple passes of random characters are written to the storage
    areas (particular disks) where the data are erased, with a final pass of all zeros
    or ones. This can be extremely time-consuming for large storage stores. This is
    also not an effective technique for solid-state drives, which are resistant to
    overwriting.


    **Crypto-Shredding (Cryptographic Erasure)** this involves encrypting the data
    with a strong encryption engine and then taking the keys generated in that process,
    encrypting them with a different encryption engine, and destroying the resulting
    keys of the second round of encryption.


    ![](img/914e4f10ad3f2426a517172a28cd7161_103_0.png)


    Hardware and media can never be sanitized by simple deleting the data.Deleting,
    as an operation, does not erase the data; it simply removes the logical pointers
    to the data for processing purposes.


    In the cloud, many of these options are unavailable or not feasible. Because the
    cloud provider, not the data owner, owns the hardware, physical destruction is
    usually out of the question. Moreover, because of the difficulty of knowing the
    actual physical locations of the data at any given moment (or historically), it
    would be next impossible to determine all the components and media that would
    need to be destroyed. Likewise, for some reason, overwriting is not a practical
    means of sanitizing data in the cloud. Moreover, in a multitenant environment
    (such as a public cloud), a customer cannot physically destroy or overwrite storage/media
    as that could affect other customers’ data.


    That leaves crypto-shredding as the sole pragmatic option for data disposal in
    the cloud. As with the other data management functions, the organization needs
    to create a policy for data disposal. This policy should include detailed descriptions
    of the following:


    +   - The process for data disposal

    - Applicable regulations

    - Clear direction of when data should be destroyed


    Of course, we are also concerned with data remanence—that is, any data left over
    after sanitization and disposal methods have been attempted. If crypto-shredding
    is performed correctly, there should be no remanence; however, material that is
    somehow not included'
  merge: -1
  img_proc: true
