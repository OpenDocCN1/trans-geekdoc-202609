- pgno: 196
  md: '# Cloud-Secure Software Development Lifecycle (SDLC)


    In the definition phase, we are focused on identifying the business requirements
    of the application, such as accounting, database, or customer relationship management.
    Regardless of the application''s purpose, it is vital that the definition phase
    describes aspects of the business needs. We try to refrain from choosing any specific
    tools or technologies at this point; the temptation to do so creates a situation
    where we have foregone conclusion (“We’re going to use Tech X”) instead of considering
    all possibilities that might best satisfy the business requirements.


    In the design phase, we begin to develop user stories (what the user will want
    to accomplish and how to go about it), the interface will look like, and whether
    it will require the use or development of APIs.


    The development phase is where the code is written. The code takes into account
    the previously established definition and design parameters. Some testing of code
    snippets will occur in this phase to determine whether the code is working as
    designed. However, major testing will occur later in the phase.


    In the testing phase of application development, activities such as penetration
    testing and vulnerability scanning against the application are performed. We will
    use techniques and tools for both static and dynamic application security (DAST)
    and application security testing (SAST). We will look at these testing methods
    in later chapter. Generally, at least one type of testing should ensure the software
    performs as it was intended, completely and accurately, in a manner resistant
    to loss/interruption. Security testing must ensure that controls included in the
    software are working effectively and accomplishing their purpose.


    Once all the stages are finished, the application would enter into what we call
    the *secure operations phase*. This is after thorough testing has been successfully
    completed and the application and its environment are deemed secure.


    The disposal phase is not in the CCSP CBK but is worth of mention. Once the software
    reached the end of its useful life or has been replaced by a new or different
    application, most software companies have a published software lifecycle as part
    of their customer-facing information. It includes life spans of the applications
    with which besides things like how long and kind of security patches will be available
    to the customer. Software that is no longer supported by the vendor poses a risk
    to the enterprise particularly because the vendor will no offer security patches
    for newly discovered vulnerabilities.


    Most web and cloud applications are a bit different than traditional applications
    in that they can be updated in place continuously and stay in service for a very
    long time. Throughout development, the process should be managed and inspected
    in such a way to reduce the possibility of introducing errors or harming the product.
    This management/inspection is referred to as *quality assurance (QA)*.


    # Configuration Management for the SDLC


    It is crucial to apply configuration/change management (CM) practices and processes
    to software in conjunction with the SDLC. Proper version control, documentation,
    and managerial/project oversight of the software package is necessary to ensure
    that requirements are'
