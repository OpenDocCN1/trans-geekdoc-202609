- pgno: 200
  md: '# Single Sign-On (SSO)


    When an organization has a variety of resources that require authentication, usage
    and utilization can become cumbersome for users, especially when they have to
    keep track of passwords and user IDs that have different requirements (length,
    complexity, and so forth). Single sign-on (SSO) is a way to address this and simplify
    the operational experience for the user.


    While there are several ways to implement SSO, the term generally refers to a
    situation where users sign in once, usually to an authentication server, and then,
    when the user wants to access the organization''s resources (say, on different
    servers throughout the environment), each resource will require the authentication
    server to determine if the user is logged in and properly authenticated; the authentication
    server then approves and the resource server grants the user access. All of this
    should be transparent to the user, streamlining the use of resources on the network.
    Theoretically, the user could log in once per day, when they sit down at their
    desk to work, and never have to reenter any additional sign-on credentials.


    This convenience does not, of course, without costs and risks: SSO solutions are
    difficult to implement and maintain; an attacker gaining a user''s single credential
    will have to multiple systems; and the impact of losing an SSO server will be
    much greater than an individual system.


    # Federated Identity Management


    Federated identity management (or federation, in general) is much the same as
    normal identity management except it is to manage identities across disparate
    organizations. You can think of it as single sign-on (SSO) for multiple organizations.


    Let''s look at an example. A group of research universities wants to share their
    data. They can create a federation that a scientist signing in at their own university,
    on their own system, can then access all resources of the other universities in
    the federation without having to present other, new identity and authentication
    credentials: the web-of-trust model and use of a third-party identifier.


    In the web of trust, each member of the federation (that is, each organization
    wants to share resources and users) has to review and approve each other member
    for inclusion in the federation. It''s a good method to be sure that everyone
    in the federation reaches a particular level of trust, but this can be costly
    and unwieldy once the federation reaches a significant number of member organizations—it
    doesn''t scale well.


    By using a third-party identity, organizations outsource their responsibilities
    to some external party (that each of them, of course) who will take on this responsibility
    on behalf of all the members. This is a popular model in the cloud environment,
    where the identifier role can often be combined with other functions (for instance,
    crypto key management) and outsourced to a cloud access security broker (CASB).'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Chapter 7 ■ Cloud Application Security


    When discussing federation, we apply the terms identity provider and relying parties.
    The identity provider is the entity that provisions and authenticates identity
    assertions (validating users, provisioning user IDs and passwords, managing both,
    deprovisioning them, and so forth), and the relying party is any member of the
    federation that shares resources based on authenticated identities.


    In the web-of-trust model, the identity provider is each member of the federation
    (provisioning identity assertions for each of their users, respectively) and they
    are also the relying parties (sharing resources with each other, based on those
    authenticated identities).


    In the trusted third-party model of federation, the identity provider is the trusted
    third party, and the relying parties are each member organization within the federation.


    # Federation Standards


    There are many federation standards, but the most widely used one is Security
    Assertion Markup Language (SAML). The latest version of SAML is SAML 2.0. It is
    XML-based and consists of a framework for communicating authentication, authorization
    or entitlement information, and attribute information across organizations. In
    other words, it is a means for users from outside organizations to be verified
    and validated as authorized users inside or with another organization without
    the user having to create identities in both locations.


    Some of the other standards in this area are as follows:


    **WS-Federation** uses this term realms in explaining its capabilities to allow
    organizations to trust each other''s identity information across organizations.


    OAuth Often used in authorization with mobile apps, the OAuth framework provides
    third-party applications limited to HTTP services.


    OpenID Connect This is an interoperable authentication protocol based on the OAuth
    2 specification. It allows developers to authenticate their users across websites
    and applications without having to manage usernames and passwords.


    # Multifactor Authentication


    Multifactor authentication has become more popular and widespread in recent years
    due to increased demand for authorization security and decreased costs of the
    technology. Many banks have used such technology since the early 2000s to facilitate
    secure wire.


    Multifactor authentication is composed of, at minimum two, of the following aspects:
    something you know, something you are, or something you have. Something you know
    can be a password, passphrase, and so on. Something you have can be something
    like a numbergenerating fob, a smartphone capable of receiving text messages,
    or even a verified phone number unique to an individual that can receive a number
    or key. Something you are is a biometric trait of yourself, as a living creature.
    This could be unique and specific as your DNA fingerprint or as curiously general
    as a photograph.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Identity and Access Management (IAM)


    The authentication solutions featuring the “know” and “have” aspects are especially
    useful with remote access security where presenting a biometric factor would be
    awkward because they help prevent an unauthorized user from accessing an account
    or data without both pieces of the authentication mechanism. It is one to steal
    or guess a password for an account, but it is much harder to obtain both a password
    and a key generated by a device to which only the user has access.


    # Supplemental Security Components


    There are a few additional security components the CCPP candidate should be familiar
    with. There are firewalls. The firewall is designed as the access point for traffic
    entering or leaving a perimeter of a network. Early versions were limited to simply
    using port or IP address blocking, with no ability to see the packets traversing
    the interface. Stateful inspection came into the picture, which allowed firewalls
    to prevent inbound traffic from entering unless the connection had been initiated
    from the network.


    Today’s application-firewalls are far superior to their predecessors. However,
    attackers and attacks are constantly evolving, which led to the web application
    firewall (WAF).


    These firewalls are deployed in addition to any network firewall and are designed
    to protect specific web-based applications. PCI DSS requires them as a way of
    protecting credit card data egress from a web application that may be handling
    online transactions. These firewalls are specific enough that they know how the
    application should be behaving and can detect the unusual activity and bring it
    to a stop. In addition, WAFs can provide protection against network-based attacks
    as Do or DDoS attacks. WAFs function at Layer 7 of the OSI


    Another form of protection is database monitoring (DAM). Again, with the web application,
    the ideal is to have a piece of software or a dedicated application watching databases
    for any type of unusual requests or activity and then be able to send alerts and
    take actions to stop malicious activity. These DAMs can be agent-based or network-based,
    meaning an agent resides on the machine or instance of the database or a network
    component monitors traffic to and from the database.


    API gateways are also an important part of a layered defense. They can be used
    to impose controls on API activity as these:


    +   - Acting as an API proxy so as not directly expose the API


    +   - Implementing connections so that bandwidth access control to the API


    +   - Limiting connections so that bandwidth is available for all applications,
    which can help in the event of an internal DoS attack


    +   - API logging


    +   - Gathering metrics from API access logs


    +   - Additional API security filtering'
  merge: -1
  img_proc: true
