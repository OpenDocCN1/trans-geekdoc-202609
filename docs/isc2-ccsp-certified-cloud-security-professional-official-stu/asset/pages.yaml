    Once the business requirements have been determined, the BIA has been completed,
    the information acquired and should be reused throughout many of the organization''s
    security-related efforts. For instance, the BIA results can be utilized in the
    risk assessment, the selection of specific security controls throughout the environment,
    and the business continuity/disaster recovery (BC/DR) plans; knowing the critical
    aspects of the organization and values of all assets is essential to accomplishing
