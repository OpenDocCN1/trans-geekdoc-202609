- pgno: 379
  md: '# # Comprehensive Online Learning Environment


    Register to gain one year of FREE to the online learning environment and test
    bank to help you study for your (ISC)² CCSP certification exam—included with your
    purchase of this book!


    The online test bank includes the following:


    +   - Assessment Test to help you focus your study to specific objectives

    - Chapter Tests to reinforce what you''ve learned

    - Practice Exams to test your knowledge of the material

    - Digital Flashcards to reinforce your learning and provide last-minute test prep
    before the exam

    - Searchable Glossary to define the key terms you''ll need to know for the exam


    # ## Register and Access the Online Test Bank


    To register your book and get access to the online test bank, follow these steps:


    +   1. Go to bit.ly/sybestTest.

    2. Select your book from the list.

    3. Complete the required registration information, including answering the security
    verification to prove book ownership. You will be emailed a pin code.

    4. Follow the directions in the email or go to www.wiley.com/go/sybestprep.

    5. Enter the pin code you received and click the “Activate PIN” button.

    6. On the Create Account or Login page, enter your username and password, and
    click Login. A “Thank for activating your PIN!” message will appear. If you don’t
    have an account already, create a new account.

    7. Click the “Go to My Account” button to add your new book to My Products page.


    Do you need more practice? Check out CCSP Official (ISC)² Practice Tests, 2nd
    Edition (ISBN: 978-1-119-60349-8, available February 2020). With nearly 1000 additional
    questions spread across the domains and two additional practice exams, it''s a
    great way to build your confidence and readiness for exam day.


