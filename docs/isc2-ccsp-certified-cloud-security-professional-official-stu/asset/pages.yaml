- pgno: 266
  md: '# Business Continuity and Disaster Recovery (BC/DR)


    Updating the BC/DR policy will be a continual process. Many of the listed elements,
    as you can see, will be in constant flux (the points of contact information, specific
    personnel assigned particular tasks, the list of the current state of critical
    assets), the relevant parts of the plan (the specific appendices and attachments)
    need to receive updates from the offices that have the pertinent data. The current
    state of critical assets might be updated by the CMB, as part of the CM process.
    The CMB will be in the best position to know all the current versions of systems
    and components. Often, required CM updates can be detected during regular tests
    of the plan (“Testing,” later in this chapter).


    # The BC/DR Kit


    There should be a container that holds all the necessary documentation and tools
    to conduct a BC/DR response action. This should be secure, durable, and compact.
    The container may be tangible or virtual. The contents might contain hard-copy
    versions of the appropriate documentation or electronic copies.


    The kit should have a duplicate at least one other location, depending on the
    plan. The plan calls for reconstitution of critical operations at an off-site
    location, there should be a mirrored kit in that location. Otherwise, having at
    least two identical kits on-site, in-different locations, aids in reducing the
    consequences of one being unreachable and destroyed. The kit should contain the
    following:


    +   - A current copy of the plan, with all appendices and addenda

    - Emergency and backup communication equipment. These can take whatever form suits
    the purpose, location and nature of the organization: cell phones, handheld radios,
    laptop with satellite modem, and so on.

    - Copies of all appropriate network and infrastructure diagrams and architecture

    - Copies of all appropriate software for creating a clean build of the critical
    systems, if necessary, with containing containing updates and patches for current
    versioning

    - Emergency contact information (not already included in the plan). This might
    include a full notification list.

    - Documentation tools and equipment. Again, these can take many forms: pens and
    paper, laptop and portable printer, voice recorder, and so on.

    - A small amount of emergency essentials (flashlight, water, rations, and so on)

    - Fresh batteries sufficient for operating all powered equipment in the kit for
    at least 24 hours


    Obviously, keeping the kit stocked and current requires a level of effort similar
    to that of maintaining the plan itself (and includes the plan itself, as it is
    updated).'
