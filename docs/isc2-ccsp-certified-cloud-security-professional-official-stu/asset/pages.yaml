    Be familiar with have a fundamental grasp of US security and privacy standards,
    regulations, and laws. This includes contractual and legal compliance regulations,
    standards, and frameworks as PCI DSS, HIPAA, SOX, and GLBA. You should know the
    differences. PCI DSS, for instance, is a standard and not a law. HIPAA, on the
    other hand, like GLBA, is a federal law, and audits in findings of noncompliance
    can result in fines, jail, and forced interruption of business activity.


    Have a clear understanding of issues surrounding and relating to eDiscovery. This
    includes forensic, chain of custody, and the challenges facing forensic collection
    in a cloud environment. Attempting eDiscovery in a cloud environment can be very
    challenging due to things such as geographical and geopolitical dispersion.


    Understand audit processes. Understand basic audit concepts such as internal external
    audits as well as the differences and the importance of independence in conduct-ing
    audits. Less reliable internal audits assist internal operations, whereas external
    audits, being more independent, ferret out thoroughly more sensitive issues that
    might cause risk to the organization.


    Be familiar with the basic definitions of personally identifiable information
    (PII). Be familiar with the basic definitions of PII, contractual regulated data,
    country-specific regulations, and the differences between the various kinds of
    PII. Also, understand the difference between sensitive and nonsensitive PII (using
    direct and indirect identifiers). In addition, be aware that even PII may be nonsensitive,
    when combined with other nonsensitive information, it can become sensitive.


