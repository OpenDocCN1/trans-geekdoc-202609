    comes with that industry: backdoors left by developers after the final product
    shifts. These are used for efficient editing and test cases so the developer doesn''t
    have to run the program all from the beginning to end. However, backdoors also
    serve as attack vectors if discovered and exploited by malicious parties. What
    was yesterday''s development tool is tomorrow''s zero-day exploit.


    **Virtualization** Because PaaS offers virtualization OS, the threats and risks
    associated with virtualization must be considered in this model. Please see the
    section “Virtualization” later in this chapter for more information about this.


    **Resource Sharing** Programs and instances run by the customer will operate on
    the same devices used by other customers, sometimes simultaneously. The possibility
    of information bleed side-channel attacks exists and must be considered.'
