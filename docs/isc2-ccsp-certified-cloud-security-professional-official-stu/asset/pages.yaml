    # Policies


    Policies provide a voice and expression of the strategic goals and objectives
    of senior management and play an integral role in forming the security posture
    of an organization.


    Organizational security policies take the form of those intended to reduce exposure
    and minimize risk of financial and data losses as well as other types of damages
    such as loss of reputation. Other typical policies include security policy, data
    classification and usage policies, acceptable use, and that of other policies
    relating to software, malware, and vendor management or outsourcing policies,
    disaster recovery and business continuity, and incident response and forensic
    policies. All these policies are an expression of management''s strategic goals
    and objectives with regard to managing and maintaining the risk profile of the
    organization.


    In cloud computing, more emphasis may be placed on policies regarding access controls,
    data storage recovery, and so on, where the cloud customer will have some semblance
    of control; many other policies that were applicable in the IT environment (such
    as hardware management, etc.) the customer does not have control over those aspects
    of the cloud. Instead, will be in the purview of the cloud provider. However,
    some policies that an organization may want to dedicate more time and resources
    to migrating to the cloud include remote access, password management, encryption,
    and how duties and responsibilities are separated and managed, specifically for
    administrators.


    # Different Types of Audit Reports


    Internal audits are performed by employees of an organization. Banks will often
    have an internal audit department and conduct periodic internal reviews in order
    to assess operational risks and determine whether employees are following policies.
    They may also conduct ongoing GLBA audits to ensure that they are meeting all
    FDIC regulations concerning their information security program.


    Here are several of the reasons internal audits are weaker than external audits:


    +   - They tend to get delayed in laying of activities that require operational
    needs.

    - The people doing audits may lack experience.

    - There may be reason to not disclose security issues for fear of retribution
    (internal political factors).


    External audits are performed almost as much as internal audits. External audits
    tend to be more independent because there is greater separation between the auditor
    and the organization. They also tend to be more thorough, since they typically
    encompass the entire audit universe as opposed to internal audits of individual
    departments of the organization.'
