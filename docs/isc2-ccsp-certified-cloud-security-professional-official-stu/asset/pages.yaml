    # Security Operations Center


    Most data centers will have a centralized facility for continuous monitoring of
    network performance and security controls. This is commonly known as the security
    operations center (or network operations center or similar terms). Typically,
    physical access will be limited to security personnel and administrators overseeing
    live and historic feeds from security devices and agents placed throughout the
    IT environment. Tools as DLP, anti-malware, SIEM/SESIM, firewalls, and IDS/IPS
    will present logs and reports to the security operations center for real-time
    analysis.


    For modern environments, the security operations center does not have to be physically
    located inside the data center itself or on the same campus. Security operations
    for an enterprise with many branches and offices may be located remotely, monitoring
    at a distance. In many cases, the security operations and continuous monitoring
    function might be performed by a contracted third-party vendor, or with the tools,
    knowledge, and personnel for providing security as a core competency.


    In a cloud-managed services arrangement, the provider will likely have a security
    operations center overseeing the various cloud data and underlying infrastructure
    and, depending on the service, deployed platforms and applications as well. The
    cloud customer, however, may also have a security operation monitoring its own
    users/cloud accounts and interactions. There may be shared responsibility and
    activity between the provider and customer for detection, reporting, investigation,
    and response actions. All of these need to be established in the contract.


    # Continuous Monitoring


    The security controls in the IT environment are not durable. A control can be
    purchased, implemented, and then considered complete (and the associated risk
    was'
