- pgno: 142
  md: '# Cloud Computing Risks by Deployment Model


    its ability to survive in the future. This may not be the most useful method for
    measuring the suitability of a vendor. Instead, knowing that a vendor has suffered
    through incidents may indicate that this is a vendor you should strongly consider
    handling your business. Simply put: Everyone and will be breached at some point,
    every system fails, and every organization experiences security issues. We should
    not be expecting a zero-fault environment. We should be looking for a fault-tolerant
    environment. How did the provider respond to the incidents? What did it do? What
    didn''t it do? How did the market (and its customers) respond to the provider''s
    handling of the matter? We can learn more from a provider that has dealt with
    past incidents (and how) than a provider that claims to never had any.


    # Multitenant Environments


    Going into a public cloud means entering a multitenant environment. There will
    be no providers who will host your organization as their sole customer. (Indeed,
    you should be wary of any provider who would want to be in that position. It doesn''t
    scale and wouldn''t be profitable.) There are therefore specific risks in the
    public cloud configuration that do not exist in other models, including these:


    **Conflict of Interest** Personnel who administer your data and systems should
    not be involved with any of your competitors who might also be the provider''s
    customers. The provider should be careful not to create these situations or even
    the perception that they may exist.


    **Escalation of Privilege** Authorized users may try to acquire unauthorized permissions.
    This might include users from organizations other than yours. A user who gains
    illicit administrative access may be gain control of devices that process other
    customers'' data.


    **Information Bleed** With multiple customers processing and storing data over
    the same infrastructure, there is the possibility that data belonging to one customer
    will be received by another. Moreover, even if this does not happen with raw data,
    it might be possible for one customer to detect telltale information about another
    customer''s activity, such as when the customer is processing data, how the procedure
    takes, and so on.


    **Legal Authority** Data and devices within a data center may be subpoenaed as
    evidence in a criminal investigation or as part of discovery for litigation purposes.
    This is of concern to any cloud customer because of the possibility that a particular
    asset might contain not only data that is the specific target of the investigation/litigation,
    it might also include data that belonging to the other customers. (In other words,
    your data might be seized because it''s on the same box as the data of another
    customer who is a target of law enforcement or plaintiffs.)'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# The Brewer-Nash Model


    Although the Brewer and Nash model is not part of the official material and you
    don''t need to know it for the exam, it''s useful to understand. Also known by
    the title of the paper in which it was proposed, “The Chinese Wall Security Policy”
    (https://://www-cs.purdue.edu/homes/ninhui/readings/AccessControl/brewer_nash_89.pdf),
    it is the concept of aligning separation of duties and least privilege with dataflows
    to prevent conflicts of interest.


    Brewer and Nash is perhaps the most relevant model for cloud computing because
    of the nature of cloud administrators–inside a cloud data center, administrators
    working for the cloud provider could have physical (perhaps logical) access to
    every cloud cluster served by that facility. This might include customers in direct
    competition in the same industry. This creates a conflict of interest for the
    cloud administrator as well as a potential avenue for corruption.


    Proper use of the Brewer and Nash model might address these issues by reducing
    their likelihood and creating a policy that supports and enhances the model.


    # Hybrid Cloud


    A hybrid cloud is simply a combination of two or more of the other models. Hybrid
    cloud configurations, of course, include all the risks of the various models they
    combine. An organization considering utilizing a hybrid cloud setup ought to be
    aware of all the risks discussed in each of the previous sections that are applicable
    to their particular choice of hybrid.


    # Cloud Computing Risks by Service Model


    Another consideration in cloud migration and contract negotiation is the risks
    inherent in each of the cloud service models. The most common service models include
    infrastructure as a service (IaaS), platform as a service (PaaS), and software
    as a service (SaaS). In addition to the concerns specific to each service model,
    the service models inherit the risks of whichever deployment model they are used
    with. This coverage is no means exhaustive or prescriptive and should only be
    taken as a means to inform the reader and stimulate consideration of possible
    security activity.


    # Infrastructure as a Service (IaaS)


    In the infrastructure as a service (IaaS) model, the customer will have the most
    control over their resources, which might alleviate some concerns about trusting
    the provider or lacking'
