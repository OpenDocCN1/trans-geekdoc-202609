  md: '# Physical/Logical Operations 195


    customers on the same host may be competitors), the cloud provider has to ensure
    that any impropriety, conflict of interest, or even perception of conflict of
    interest doesn''t affect the level of service the customers receive. For example,
    if competing customers are resident on a single host and some contingency forces
