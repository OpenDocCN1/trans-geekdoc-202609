- pgno: 235
  md: '# Chapter 8 ■ Operations Elements


    All hosts must be both physically and logically isolated from one another much
    as possible. They will obviously still be connected to the network and so will,
    in some fashion, all "touch" each other, so these connections should be minimized
    and secured as much as possible. Moreover, network monitoring should be thorough
    and detailed, such that any host activity would be immediately recognized and
    respond result.


    # Storage Operations


    In addition to hosts used to run virtualized instances for customer operations,
    the cloud data center will also include devices used for near-term and long-term
    storage of both data and instance images.


    # Clustered Storage and Coupling


    Most often, storage devices will be clustered in groups, providing increased performance,
    flexibility, and reliability. Clustered storage architectures can take one of
    two: tightly coupled or loosely coupled.


    In the tightly coupled architecture, all the storage devices are directly connected
    to a shared physical backplane, thus connecting all of them directly (the "tightly")
    aspect). Each component of the cluster is aware of and subscribes to the same
    policies and rules. A tightly coupled cluster is usually confined to more restrictive
    design parameters, often because the devices must be from the same vendor in order
    to function. Although this may be a limiting factor, a tightly coupled architecture
    will also enhance performance as it scales the overall performance of the cluster,
    allowing greater and greater power as it increases in size.


    A loosely coupled cluster, on the other hand, will allow for greater flexibility.
    Each node of the cluster is independent of the others, and new nodes can be added
    for any purpose or use as needed. They are only locally connected and do not share
    the same physical framework, they are only distantly connected through communication
    media (the "loosely" aspect). Performance does not necessarily scale, however,
    because the nodes do not build on one another. But this might not be an important
    factor of the storage architecture since storage commands and performance requirements
    are fairly simple.


    # Volume vs. Object


    Another way of viewing storage options is how the data is stored. Typically, two
    modes could be used: volume and object storage. In volume storage, disk space
    is apportioned to the customer and allocated to each of the guests the customer
    uses. The virtual OS of the guest can then utilize and manipulate the volume as
    necessary. This is sometimes referred to as block storage or raw disk storage.
    Volume/block storage in the cloud is analogous to a mounted drive in a traditional
    network. In volume/block storage, the user/administrator could install and run
    programs, or simply impose a filesystem for storage objects. Threats include the
    following:


    +   Because the volume is simply a drive space, all traditional data storage threats
    remain, such as malware, accidental deletion of data, and physical disk failure.'
