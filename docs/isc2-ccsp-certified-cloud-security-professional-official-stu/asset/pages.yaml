    # Identity and Access Management (IAM)


    IAM is about the people, processes, and procedures used to create, manage, and
    destroy identities of all. IAM systems typically consist of several components.
    First, they allow creation of identification mechanisms. IAM then allows the organization
    to verify or authenticate users'' identities prior to granting access to systems/assets.
    Once authenticated, the users are then authorized given access to resources. The
    user is generally managed through a central repository.


    IAM functionality is often divided into identity management and access management:


    **Identity Management** Identity management is the process whereby individuals
    are given access to system resources by associating user rights with a given identity.
    Provisioning is the first phase of identity management, where each subject is
    issued a unique identity assertion (something that serves as an identification,
    such as a user ID). During this process, the user is usually also issued a password
    for authenticating the identity assertion. The entity issuing the password and
    identity assertion will retain a record of each for use'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'in recognizing the user (when the user logs in to resources with that user
    ID/password combination). The generation, storage, and security controls of these
    passwords are collectively known as password management.


    **Access Management** Access management is the part of the process that controls
    access to resources once they have been granted. Access management identifies
    who a user is and what they are allowed to access each time they attempt to access
    a resource. This is accomplished by a combination of measures:


    +   * **Authentication** Establishes by asking who you are and determining whether
    you are a legitimate user (often by combining the use of an identity assertion
    and an authentication factor; for example, a user ID and password).


    +   * **Authorization** Evaluates what you have access after authentication occurs
    (in many cases, this meaning the identity assertion against an access control
    list [ACL]).


    +   * **Policy Management** Serves as the enforcement arm of authentication and
    authorization and is established based on business needs and senior management
    decisions.


    +   * **Federation** An association of organizations that facilitate the exchange
    of information as appropriate about users and access to resources, allowing them
    to share resources across multiple organizations.


    +   **Identity Repositories** The directory services for the administration of
    user accounts and their associated attributes.


    These components are stored in what is called an identity repository directory.
    The schema used is much more detailed and has many users, and it must be highly
    protected. A breach of this component would be devastating to the organization.


    Besides identity repositories and their directories, other facets of IAM include
    federated identity, federation standards, federated identity providers, various
    types of single sign-on (SSO), multifactor authentication, and supplementary security
    components. These concepts will be explored in the following sections.


    # Identity Repositories and Directory Services


    Identity repositories are the store of information or attributes of identities.
    Directory services are how these identities and attributes are managed. They allow
    the administrator to customize user roles, identities, and so on. All of this
    becomes more important when we deal with federation, as there must be a consistent
    means of accessing these identities and their associated attributes in order to
    work across disparate systems.


    Here are some of the most widely used directory services:


    +   * X.500 and LDAP


    +   * Microsoft Active Directory


    +   * Novell eDirectory


    +   * Metadata replication and synchronization'
