  md: 'equivalent of role-playing games, and it has the least impact on production
    of the testing

    alternatives.


    **Dry Run** The organization as a whole takes part in a scenario at a scheduled
    time, describing their responses during the test and performing some minimal actions
    (for instance, perhaps running the notification call to ensure all contact information
    is correct) but without performing the actual tasks. This has more impact on productivity
    than tabletop testing.


    **Full Test** The entire organization takes part in an unscheduled, unannounced
    practice scenario, performing their BC/DR activities. As this could include system
    failure and facility evacuation, this test is the most useful for detecting shortcomings
    in the plan, but it has the greatest impact (to the extent it can cause a full,
    genuine interruption of service) on productivity.


    ![](img/914e4f10ad3f2426a517172a28cd7161_270_0.png)


    In all forms of testing, it heeds the organization to use moderators. These personnel
    will act as guides and monitors of the response activity, provide scenarios to
    heighten realism and introduce some element of chaos (to simulate unplanned deviations
    from the procedures due to potential effects of unexpected and disaster), and
    document performance and any plan shortcomings. The moderators should not be tasked
    with BC/DR response activities for actual situations. Anyone with formal taking
    should be a participant in the test it might be useful to employ external consultants
    to serve as moderators so that all organizational personnel can take part in the
    exercise.


