- pgno: 55
  md: '# Foundational Concepts of Cloud Computing


    There are some aspects of cloud computing that are pervasive throughout all discussion
    of the topic. I''m introducing them here, and you should become familiar with
    them. These concepts will be included in various discussions throughout the book.


    # Sensitive Data


    Each organization will have its own risk appetite and desire for confidentiality.
    No matter how each cloud customer makes their own determination for these aspects
    of their data, the cloud provider must offer some way to the customer to categorize
    data according to its sensitivity and sufficient controls to ensure these categories
    are protected accordingly.


    # Virtualization


    Virtualization is one of the technologies that has made cloud services a financially
    viable business model. Cloud providers can purchase and deploy a sufficient number
    of host devices for a responsive number of customers and users without wasting
    capacity or letting resources go.


    In a virtual environment, a cloud user can access a synthetic computer. To the
    user, there is no appreciable difference between the virtual machine (VM) and
    a traditional computer. However, from the provider''s perspective, the VM offered
    to the user is just a piece of software, not an actual, dedicated piece of hardware
    being exclusively exclusively operated by the user. There may be several, or even
    dozens, of VMs operating on a single host in the cloud space. When the user logs
    off or shuts down, the cloud network takes a snapshot of the user''s VM, as a
    single file that can be stored somewhere in the cloud until the next user requests
    access, when the VM can be restored exactly as they left.


    In this way, a cloud provider can offer services to any number of customers and
    users and not be required to purchase a new hardware device for each user. This
    economy of scale allows the cloud provider to offer the same basic IT services
    that the users expect from traditional networks with much less cost and at an
    enhanced level of service.


    There are many virtualization product vendors, including VMware and Microsoft.
    There are also a variety of implementation strategies and two fundamental virtualization
    types (Type 1 and Type 2). These are described in the section “Virtualization”
    in Chapter 5.


    # Encryption


    As an IT professional, you should already be familiar with the basic concepts
    and tools of encryption. However, in terms of cloud services, encryption plays
    an enhanced role and presents some additional challenges.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Foundational Concepts of Cloud Computing


    Because your cloud data will be in an environment controlled and operated by personnel
    outside your organization, encryption offers a degree of assurance that nobody
    without will be able to access your data in a meaningful way. You can encrypt
    your data before it reaches the cloud and decrypt it as necessary.


    Another concern related to cloud operation is that it necessitates remote access.
    With any remote access, there will always be a risk (however great or slight)
    of interception of data, eavesdropping, and man-in-the-middle attacks. Encryption
    also assists in alleviating this concern by mitigating this to some degree; if
    data in motion is encrypted, it is much more difficult to access even if it is
    intercepted.


    # Auditing and Compliance


    Cloud services provide specific capabilities and opportunities for regulatory
    compliance and auditing.


    From a compliance perspective, service providers may be able to offer holistic
    solutions for organizations under particular regulatory schema. For instance,
    the cloud provider may have an extent, known control set and procedural outline
    for creating virtual machines that comply with PCI, HIPAA, or GLBA requirements.
    This could be extremely appealing to potential customers if the difficulty and
    effort expended in trying to stay compliant can be shifted out to the provider.


    Conversely, auditing becomes difficult. Cloud providers are extremely reluctant
    to allow access to their facilities or share network diagrams and lists of controls;
    maintaining confidentiality of these enhances the providers'' overall security.
    However, these are essential elements of an audit. Also, as you will see in upcoming
    chapters, it is difficult to determine exactly where (both physically and logically)
    in the cloud environment an organization''s data is located at any moment or which
    devices contain a customer''s data, making auditing even more difficult. Audits
    will require the cooperation of the cloud provider, and providers have far disallowed
    the requisite level of access for the purpose. Instead, cloud providers often
    offer an assertion of their own audit success (Service Organization Control (SOC)
    Type 3 reports, which are discussed in organization considering cloud migration
    should confer with regulators to determine if migration will be enabled and/or
    if additional means will be required to protect regulated data.


    # Cloud Service Provider Contracts


    The business arrangement between the cloud provider and the cloud customer will
    usually take the form of a contract, which will include a service-level agreement
    (SLA). The contract will spell out all of the terms: what each party is responsible
    for, what form the services will take, how issues will be resolved, and so on.
    The SLA will set specific, quantified goals for these services and their provision
    over a certain timeframe.


    For instance, the contract must stipulate that “the Provider will have constant,
    uninterrupted access to the Customer''s data storage resources." The SLA'
  merge: -1
