- pgno: 136
  md: 'Therefore, the customer will be seeking maximal control over their data, with
    all the administrative power and insight into the data center operations it can
    acquire. The customer will want to impose policy, get logging data, and audit
    the performance and security of the data center.


    The provider will be attempting to limit customer access as much as possible.
    The provider wants to refuse control, deny insight, and refrain from disclosing
    any information that might be used for malicious purposes, which includes the
    list of security controls used for protecting the data center, procedures, and
    live monitoring equipment data. In some cases, the provider might not want to
    disclose the physical location of the data, believing that secrecy can lend security.


    This creates an adversarial dynamic in the negotiation. Both parties must have
    a clear awareness of what they are seeking and the best means to get them. In
    many cases, the provider will have an advantage in this regard because the provider
    stands the function and design of the data center and therefore the known and
    expected outcomes of operation much better than most customers do. Organizations
    that are new to managed services in general and cloud computing specifically not
    be aware of what exactly, to ask for in the negotiation. It is therefore advisable
    that organizations without a clear technical competency and familiarity with cloud
    operations seek external consultation when initially considering cloud migration
    and entering negotiations with providers.


    # Cloud Customers, Providers, and Similar Terms


    In this chapter, we talk specifically about the cloud customer (the company, individual,
    or other entity that hires the cloud provider to take care of their data) and
    the cloud provider (the company that hired to provide services, platforms, and/or
    applications that manage the cloud customer''s data). In the real world, you might
    also see terms such as customer, data owner, data controller, data provider, data
    custodian, and data processor. These terms are all attempts at describing who
    owns the data and who handles the data, which generally fits out to being the
    cloud customer and the cloud provider, which are the terms we will use consistently
    for our discussion.


    # Cloud Computing Risks by Deployment Model


    To prepare for cloud migration and the requisite contract negotiation (and for
    familiarization with CCSP CBK content), it is useful to review the risks particular
    to each of the cloud deployment models. These include the private, community,
    public, and hybrid cloud models.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Private Cloud


    A private cloud is a distributed computing environment with only one customer
    (as opposed to the more common multitenant environment, typified by a public cloud).
    A private cloud can be implemented by an organization (running its own data center,
    and supplying cloud services to its employees, vendors, and clientele) or it can
    be hosted by a more provider.


    In some situations, the provider will own the hardware that contains the private
    cloud, hosted in the provider''s data center. The customer will be granted exclusive
    access to that particular set of hardware, and no other customers will have their
    cloud hosted on those same devices. In some cases, the customer owns the hardware,
    which is hosted, physically inside the provider''s data center (often referred
    to as a co-lo, or collocation center).


    A private cloud might be a more appropriate option for customer organizations
    that exist in highly regulated industries or that process a significant amount/degree
    of sensitive information; the private cloud allows the customer to dictate and
    specify a more detailed level of security controls and overall governance. This,
    of course, be more expensive (in terms of the amount paid to the provider) than
    the public cloud model and will impede the elasticity/scaling of the cloud (instead
    of having theoretically infinite capacity, the private cloud has a natural maximum
    of whatever components are dedicated to the customer''s environment).


    All private cloud operators face the following risks:


    **Personnel Threats** This includes both inadvertent and malicious threats. If
    a managed provider/data center is used, the provider''s administrators remain
    outside the customer''s control.


    **Natural Disasters** All the deployment and service models are still susceptible
    to natural disasters.


    **External Attacks** These attacks can take many forms, such as unauthorized access,
    eavesdropping, denial of service (DoS)/distributed denial of service (DDoS), and
    so on.


    **Regulatory Noncompliance** While the customer has much more control over the
    configuration and controls in a private cloud model (compared to a public cloud),
    regulators will still enforce mandates.


    **Malware** This can be considered an external or internal threat, depending on
    the source of the infection.


    None of these risks are unique to the private cloud, but having a greater degree
    of control and specificity may give the customer a greater level of assurance
    in combating them.


    # Community Cloud


    In a community cloud configuration, resources are shared and dispersed among an
    affinity group. Infrastructure can be owned and/or operated jointly, individually,
    centrally, across the community, or in any combination or mixture of options.'
