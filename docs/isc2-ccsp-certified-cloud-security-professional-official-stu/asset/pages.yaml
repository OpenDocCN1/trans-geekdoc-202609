  md: 'intended to address cannot be considered permanently mitigated. Instead, controls
    must be continually monitored to ensure that they are effective, operating as
    intended, and addressing the risks or vulnerabilities that they were supposed
    to mitigate. Moreover, the entire environment must be monitored continually to
    determine if new or emerging threats or risks are dealt with properly. Older paradigms
    require periodic risk reviews and might deem an IT environment protected for a
    certain duration if the review was successful or had no significant findings.
    Current guidance and industry best standards refute that model, instead the preferred
    approach of continuous monitoring. NIST (in the Risk Management Framework), ISO
    (in the 27000 series of IT security standards), and the CIS (formerly SANS Top
    20 security controls guidance) make all continuous monitoring a central tenet
    of protecting an IT environment.


    # # Incident Management


    When the security operations center detects or receives a report of anomalous
    or illicit activity, an incident response action may be initiated. Incident response
    might include the following purposes:


    +   - Minimizing the loss of value

    - Continuing service provision (availability)

    - Halting increase of the damage


    The intended outcome will significantly impact the course of action taken in the
    response, and it will be different for every industry or organization. For example,
    a large online retailer conducts thousands of transactions per hour might be concerned
    with availability—continuing the transactions. If the retailer discovers that
    a piece of malware is skimming money from the retailer so that the retailer is
    losing hundreds of dollars per hour, the retailer probably won''t want to shut
    down operations in order to address the malware issue. The retailer may continue
    allowing the loss to continue for an extended period because of the impact of
    shutting down the environment would be much more damaging than the effect of the
    malware. Another potential outcome might be a of legal recourse—either a lawsuit
    or prosecution.


    The organization should have an incident response policy. Both the provider and
    customer will have their approaches, goals, and methods for incident management.
    The two parties should coordinate and share these responsibilities and codify
    this arrangement in the contract.


    Moreover, incident response in a managed services arrangement creates additional
    challenges and risks. For instance, which party can declare an incident unilaterally?
    Do both parties have to concur that an incident has occurred? If the provider
    declares an incident, is the provider relieved of the requirement to meet certain
    SLA performance targets (say, availability) for the duration of the incident?
    If there are additional costs associated with incident response, such as downtime,
    personnel tasking, or reporting actions, which party is responsible for absorbing
    these costs?'
