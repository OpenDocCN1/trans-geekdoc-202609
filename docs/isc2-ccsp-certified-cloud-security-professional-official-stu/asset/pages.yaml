- pgno: 8
  md: '# About the Author


    Ben Malisow, CISSP, CISM, CCSP, SSCP, and Security+, is an instructor for (ISC)²,
    teaching prep classes for the CISSP, CCSP, and SSCP certifications. He has been
    in the information technology and information security field for almost 25 years.
    He wrote the internal IT security policy for DARPA, served as the information
    system security manager for the FBI''s most-classified counterterror intelligence-sharing
    network, and helped develop the IT security architecture for the Department of
    Homeland Security''s Transportation Security Administration. Ben has taught courses
    at many schools and universities, including Carnegie Mellon''s CERT/SEI, UTSA,
    the College of Southern Nevada, and grades 6–12 in the public school system in
    Las Vegas. He is widely published in the field, having written for SecurityFocus.com,
    ComputerWorld, and various other publications as well as several books. You can
    find his blog at Securityized.com.'
