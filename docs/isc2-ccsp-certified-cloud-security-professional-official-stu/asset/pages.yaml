- pgno: 112
  md: 'While cloud technology might be fairly new, the data security fundamentals
    remain the same: the CIA triad, regulatory constraints, layered defense, and so
    forth. In this chapter, we will examine the particular security challenges and
    techniques necessary for making a cloud both useful and trustworthy.


    # # Cloud Data Lifecycle


    Data in the cloud should be perceived, in the general case, to have the same needs
    and properties as data in the legacy environment. The data lifecycle still has
    a purpose; only the implementation will change. Figure 4.1 shows the common stages
    in the data lifecycle


    **FIGURE 4.1** Stages of the data lifecycle


    ![](img/914e4f10ad3f2426a517172a28cd7161_112_0.png)


    Data will still be created (Create phase)—both in the cloud itself and by remote
    users. It will be stored, in both the short term (Store phase) and long term (Archive
    phase), in the cloud. It will be manipulated and modified (Use phase) in the production
    environment hosted in the cloud. It will be transmitted to other users and made
    available for collaboration (Share phase) within the cloud; this is one of the
    significant benefits offered by cloud'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 4 ■ Cloud Data Security


    computing. In addition, we will still have a need to remove data from the production
    environment and sanitize the media afterward (Destroy phase).


    Obviously, the particulars for performing these activities, and doing them in
    a secure fashion, will evolve to match any new environmental challenges.


    In the cloud, each phase of the data lifecycle will require particular protections.
    Let''s review each of the phases in turn and examine some specific control mechanisms
    we may want to apply in.


    # Create


    Data will most be created by users accessing the cloud remotely. Depending on
    the use case, the data might be created locally by users at their remote workstation
    and uploaded to the cloud or it might be created in the cloud data center via
    remote manipulation of the data residing there.


    Data Created Remotely Created by the user should be encrypted before uploading
    to the cloud. We want to protect against obvious vulnerabilities, including man-in-the-middle
    attacks and insider threat at the cloud data center. The cryptystem for this purpose
    should have a high work factor and be listed on the FIPS 140-2 list of approved
    crypto solutions. We should also implement good key management practices, which
    we will cover in this chapter.


    > Sometimes when dealing with keys and managing them, the public key infrastructure
    (PKI) is used. PKI is a framework of programs, procedures, communication protocols,
    and public key cryptography that enables a diverse group of individuals to communicate
    securely.


    The connection used to upload the data should also be secure, preferably with
    an IPsec or TLS (1.2 or higher) VPN connection.


    > TLS replaces the SSL standard, but SSL is still utilized in many IT environments,
    and the practitioner may see both the SSL and the technology used.


    Data Created within the Cloud Likewise, data created within the cloud remote manipulation
    should be encrypted upon creation, to obviate unnecessary access or viewing by
    data center personnel. Again, key management should be performed according to
    best industry practices, as detailed later in this chapter.


    > Regardless of where, specifically, the data originates—in the cloud center via
    remote access or at the user’s location—necessitates all the activities described
    in Chapter 3. “Data Classification”:categorization and classification; labeling,
    tagging, and marking; assigning metadata, and so forth.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Store


    From the perspective of the lifecycle diagram, the Store phase takes place right
    after the Create phase and before the Use and Share phases. This indicates that
    Store is usually meant to refer to near-term storage (as opposed to the Archive
    phase, which is obviously long-term storage).


    For our purposes, we will consider the activity in the Store phase to occur much
    concurrently with the Create phase—that is, Store will happen as data is created.
    In that respect, the actions that should occur here have already been described:
    encryption at rest for mitigating exposure to threats within the cloud service
    provider and encryption in transit for mitigating exposure to threats while being
    moved to the cloud data center.


    # Use


    We need to utilize the same kind of mechanisms when performing activity in the
    Use phase as well. Operations in the cloud environment will necessitate remote
    access, so those connections will all have to be secured, with an encrypted tunnel.


    Data security in the Use phase will require considering other operational aspects
    as well. The platforms with which users connect to the cloud have also to be secured;
    in BYOD environment, this will need a holistic approach, since we can never be
    sure just with cloud computing and how they will be expected to use the technology
    (such as VPN, IRM, and/or DLP \u00d agents assigned to them) in a safe manner.
    Data owners should also be careful to restrict permissions for modifying and protecting
    their data; users should be limited to those functions that they absolutely require
    in order to perform their assigned tasks. And, in many circumstances in both the
    cloud and legacy environments, logging and audit trails are important when data
    is being manipulated in any fashion.


    On the provider side, some express strong concerns in the implementation of virtualization;
    the provider must ensure that data on a virtualized host cannot be read or detected
    by other hosts on that same device. Also, as has been stated several times (and
    will be repeated throughout the book), the provider will implement personnel and
    administrative controls so that data center personnel cannot access any raw customer
    data.


    # Share


    Although global collaboration is a powerful capability afforded by the cloud,
    it comes with risks. If users can be anywhere on the planet, so can threats.


    Many of the same security controls implemented in prior phases will be useful
    here: encrypted files and communications, IRM solutions, and so forth. We also
    have to craft sharing restrictions based on jurisdiction; we may need to limit
    or prevent data being sent to certain locations in accordance with regulatory
    mandates. These restrictions can take the form of either export controls or import
    controls, the security professional must be familiar with both all regions and
    where the organization''s data might be shared.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Real World Scenario


    # Export and Import Restrictions


    Here are export restrictions you should be familiar with:


    +   - International Traffic in Arms Regulations, ITAR (United States): State Department
    prohibitions on defense-related exports; can include cryptography systems.

    - Export Administration Regulations, or EAR (United States): Department of Commerce
    prohibitions on dual-use items (technologies that could be used for both commercial
    and military purposes).


    And here are import restrictions you should be familiar with:


    +   - Cryptography (Various): Many countries have restrictions on importing materials
    that have been encrypted. When doing business in or with a nation that has cryptography
    restrictions, it is the security professional''s responsibility to know and understand
    these local mandates.

    - The Wassenaar Arrangement: A group of 41 countries have agreed to mutually inform
    each other after conventional military shipments to nonmember countries. Not a
    treaty, and therefore not legally binding, but may require your organization to
    notify your government in order to stay in compliance.


    Cloud systems could consider implementing some form of egress monitoring on the
    Share phase; this will be discussed in the section “Egress Monitoring (DLP)” later
    in this chapter.


    # Archive


    This is phase for long-term storage, and we necessarily have to consider this
    timeframe when planning security controls for the data.

    Cryptography will be, like most data-related controls, an essential consideration.
    Key management is of utmost importance, because mismanaged keys can lead to additional
    exposure or total loss of the data. If the keys are properly stored (especially
    if they are stored alongside the data), there is an increased risk of loss; if
    keys are stored away from the data but not managed properly and lost, there will
    be no efficient means to recover the data.


    > One aspect of cryptography to be aware of is elliptic cryptography (ECC). This
    approach to public cryptography uses much smaller keys than traditional cryptography
    to provide the same level of security. ECC uses algebraic elliptical curves that
    result in much smaller keys that can provide the same level of safety as much
    larger ones used in traditional cryptography.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Cloud Data Lifecycle


    The physical security of the data in long-term storage is also important. In choosing
    a storage location, we need to weigh risks and benefits for these facets of physical
    security:


    Location Where is the data being stored? What environmental factors will pose
    risks in that location (natural disasters, climate, etc?) Jurisdictional aspects
    might bear consideration (local and national law?) How distant is the archive
    location? Will it be feasible to access the data during contingency operations
    (for instance, during a natural disaster?) Is it far enough to be safe from events
    that impact the production environment but enough for personnel to reach that
    data during these events?


    Format Is the data stored on some physical medium such as tape backup or magnetic
    storage? Is the media highly portable and in need of additional security controls
    against theft? Will that be affected by environmental factors? How long do we
    expect to retain this data? Will it be in a format accessible by production hardware
    when we need it?


    ![](img/914e4f10ad3f2426a517172a28cd7161_116_0.png)


    Think of all the archaic media formats used to store data in the past, the cost
    of those, and how complicated it would be to find hardware capable of accessing
    that data today. Jazz disks, Zip disks, Colorado backup tape systems, and so on.
    Today''s format will be outmoded soon, and we will have the hardware necessary
    to pull that data into a future format?


    Staff Are personnel at the storage location employed by our organization? If not,
    does the contractor implement a personnel control sufficient for our purposes
    (background checks, reliance checks, monitoring, and so on)?


    Procedure How is data recovered when needed? How is it ported to the archive on
    a regular basis? How often are we doing full backups (the frequency of incremental
    or differential backups)?


    Archive phases in the cloud will be largely driven by whether we are doing backups
    in the cloud, whether we are using the same cloud provider for backups and our
    production environment, or whether we are using a different cloud provider for
    each. We have to consider all the same factors we use in the traditional environment
    but also determine whether we could impose those decisions in the cloud environment,
    on the cloud provider, via contractual means. How will this be monitored? How
    will it be enforced?


    # Destroy


    We discussed destruction options for the traditional and cloud environments in
    Chapter 3. As we determined, cryptographic erasure (cryptoshredding) is the only
    feasible and thorough method currently available for this purpose in the cloud
    environment.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Cloud Storage Architectures


    There are various ways to store data in the cloud, each with attendant benefits
    and costs. These ways apply both to larger organizational needs and to personal
    cloud storage of a single user''s data.


    # Volume Storage: File-Based Storage and Block Storage


    With volume storage, the customer is allocated a storage space within the cloud;
    this storage space is represented as an attached drive to the user''s virtual
    machine. The virtual drive performs very well in the same manner as would a physical
    device attached to a tangible device; actual locations and memory addresses are
    transparent to the user.


    Volume storage architecture can take different forms; there is a great deal of
    discussion among cloud professionals about what type of volume might be preferable:
    file storage or block storage.


    File Storage (also File-Level Storage or File-Based) The data is stored and displayed
    just as a file structure in the traditional environment, as files and folders,
    with all the same hierarchical and naming functions. File storage architectures
    have become popular with big data analytical tools and processes.


    Block Storage Whereas file storage has a hierarchy of folders and files, block
    storage is a blank volume that the customer or user can put anything into. Block
    storage allows much more flexibility and higher performance, but it requires a
    greater amount of administration and mental install of an OS or other app to store,
    sort, and retrieve the data. Block storage might be better suited for a volume
    and purpose that includes multiple types and kinds.


    Storage architecture for volumes can include splitting and erasure coding, which
    is basically a means of implementing data protection solutions in the cloud similar
    to the way RAID protects data protection. Volume storage is much offered in the
    choice of cloud service models but is often associated with infrastructure as
    a service (IaaS).


    # Object-Based Storage


    Object storage is just as it sounds: data is stored as objects, not as files or
    blocks. Objects include not only the actual production content, but metadata describing
    the content and a unique address identifier for locating that specific object
    across an entire space.


    Object storage architectures allow for a significant level of description, including
    marking, labels, classification, and categorization. This also enhances the opportunity
    for indexing capabilities, data policy enforcement (such as IRM, described in
    Chapter 3, and DLP, discussed later in this chapter in the section "Egress Monitoring
    [DLP]"), and centralization of some data management functions.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Again, any of the cloud service models can include object storage architectures,
    but object storage is usually associated with IaaS.


    # Databases


    Like their traditional counterparts, databases in the cloud provide some sort
    of structure for stored data. Data will be arranged according to characteristics
    and elements in the data itself, including a specific trait required to file the
    data known as the primary key. In the cloud, the database is usually backing storage
    in the data center, accessed by users utilizing online apps or APIs through a
    browser.


    Databases can be implemented in any cloud service model, but they are most often
    configured with PaaS and SaaS.


    # Content Delivery Network (CDN)


    A content delivery network (CDN) is a form of data caching, usually near geographical
    locations of high use/demand, for copies of data requested by users. The best
    example of why an organization would want to use a CDN is online multimedia streaming
    services: instead of dragging data from a data center to users at virtual distances
    across a continent, the streaming service provider can place copies of the most
    requested media near metropolitan areas where these requests are likely to be
    made, thus improving bandwidth and delivery quality.


    # Cloud Data Security Foundational Strategies


    Just as certain technologies make cloud computing feasible as a whole, certain
    technologies and practices make data security possible in the cloud and therefore
    also make computing pragmatic and sensible.


    # Encryption


    It should come as no surprise that cloud computing has a massive dependency on
    encryption; you have probably noticed how many times, and in how many ways, encryption
    has been mentioned throughout the book so far.


    Encryption will be used to protect data at rest, in transit, and in use. Encryption
    will be used on the remote user endpoint to create the secure communication connection,
    within the cloud customer''s enterprise environment to protect their own data,
    and within the data center by the cloud provider to ensure virtual cloud customers
    don''t accidentally access other''s data.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Chapter 4 ■ Cloud Data Security


    Realistically, without encryption it would be impossible to use the cloud in any
    secure fashion.


    The book has included some details about encryption implementations already and
    will continue to do so as we discuss various aspects of cloud computing. In the
    following sections, we will focus on only two particular topics of encryption
    in the cloud: key management and an experimental encryption implementation that
    might create a whole new level of security and trust in the cloud.


    # Key Management


    As we have noted before, and where encryption keys are stored can affect the overall
    risk of the data significantly. Here are some things to remember and consider
    regarding key management for cloud computing:


    **Level of Protection** Encryption keys, which are the mathematical numeric stringcode
    that allows encryption and decryption to order, must be secured at the same level
    of control, or higher, as the data they protect. The sensitivity of this level
    of protection, according to the organization''s data security policies. We need
    to remember that the strength of the cryptosystem is only valid if keys are not
    disclosed (except for public keys, as part of asymmetric encryption).


    > Sometimes databases use transparent encryption, in which the encryption key
    is stored in the database itself.


    > A hardware security module (HSM) is a device that can safely store and manage
    encryption keys and is used in servers, data transmission, and log files. If implemented
    properly, it is far safer than storing and keys in software.


    **Key Recovery** For anyone other than a specific user, accessing that user''s
    key should be difficult; however, there are situations in which an organization
    needs to acquire a user''s key without the user''s cooperation. This might be
    because the user was fired from the organization, or lost their key. You need
    to have the technology and process for getting key to access that data. This entails
    a procedure that involves multiple people, each with access to only a portion
    of the key.


    **Key Distribution** Issuing keys for a cryptosystem can be difficult and fraught
    with risk. If the key management process requires a secure connection to initiate
    the key procedure, how do you establish secure session without a key? Often, passing
    keys out of band is preferable, yet cumbersome and expensive solution. Moreover,
    keys should never be passed in the clear.


    **Key Revocation** In situations where a user should no longer have access to
    sensitive material, or where a key has been inadvertently/illicitly disclosed,
    the organization needs a process for suspending the key or that user''s ability
    to use it.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Cloud Data Security Foundational Strategies


    **Key Escrow** In many cases, having copies of keys held by a trusted third party
    in a secure environment is highly desirable; this can aid in many of the other
    key management efforts listed in this section.


    **Outsourcing Key Management** Keys should not be stored with the data they are
    protecting, and we shouldn''t make physical access to keys readily available to
    anyone who doesn''t have authorization and need to know for that data; therefore
    in computing, it is preferable to have the keys stored elsewhere than the cloud
    provider''s data center. One solution is for the cloud provider to retain the
    keys, but that requires an expensive and complicated set of infrastructure and
    skilled personnel. This would attenuate some of the benefit (in reduced costs)
    we get from offloading our enterprise to the cloud provider. Another option is
    using a access security broker (CASB); CASBs are third-party providers that handle
    IAM and key management services for cloud customers; the cost of using a CASB
    should be much lower than trying to maintain keys within the organization, and
    the CASB will have better competencies most cloud customers won.


    ![](img/914e4f10ad3f2426a517172a28cd7161_120_0.png)


    Whether or not a cloud customer chooses to use a CASB or other means of key management,
    the preferred solution is *not to store* the crypto keys within the cloud provider.


    # Masking, Obfuscation, Anonymization, and Tokenization


    For certain uses in the cloud, we may find it necessary to obscure actual data
    and instead use a representation of that data. The *masking, obfuscation, anonymization,
    and tokenization* refer to methods to accomplish this.


    Here are some examples of reasons you''d want to do this:


    **Test Environments** New software should be tested in sandboxed environments
    before being deployed to the production environment. When this type of testing
    is performed, actual production data should *never* be used within the sandbox.
    However, in order to determine the actual functionality and performance of the
    system, it will be necessary to use data that closely approximates the same traits
    and characteristics of the production data.


    **Enforcing Privilege** We know that the concept of least privilege limits users
    to permissions and access absolutely to perform their duties. In some cases, that
    might mean allowing the user access to elements of a data without revealing its
    entirety. For instance a customer service representative might need to access
    a customer''s account information and be shown with that information, but that
    data might be an abridged version of the customer''s total account specifics (as
    not showing the customer''s full credit number).


    **Secure Remote Access** When a customer logs onto a web service, the customer''s
    account might have some data abridged in similar fashion to the least privilege
    example. The screen might display some of the customer''s preferences, but you
    might not want to display elements of the customer''s account data, such as payment
    or personal information, to avoid risks such as hijacked sessions, stolen credentials,
    or shoulder surfing.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Chapter 4 ■ Cloud Data Security


    So how are these activities performed? These are some techniques that you can
    use to obscure data for use in the cloud context:


    **Randomization** The replacement of the data (or part of the data) with random
    characters. Usually, and with most cases of obscuring data, you want to leave
    the other traits (aside from displaying the actual data) intact: length of the
    string, character set (whether it was alphabetical or numerical, whether it had
    special characters, whether there was upper/-lower-case, etc.), and so forth.


    **Hashing** Using a one-way cryptographic function to create a digit of the original
    data. Using a hash algorithm to obscure the data gives you the benefit of ensuring
    it is irrecoverable, and can also use it as an integrity check later. However,
    because hashing converts variable-length messages into fixed-length digits, you
    lose many of the properties of the original data.


    **Shuffling** Using different entries within the same data set to represent the
    data. This has the obvious drawback of using actual production data.


    **Masking** Hiding the data with useless characters; for example, showing only
    the last four digits of a Social Security number: XXX-XX-1234. This can be used
    where the customer service representative or the customer gets authorized access
    to the account you want to obscure a portion of the data for additional security.


    **Nulls** Deleting the raw data from the display before it is represented, or
    displaying null sets. Obviously, some of the functionality of the data set will
    be dramatically reduced with this method.


    The term *obfuscation* refers to the application of these techniques in order
    to make the data less meaningful, detailed, or readable in order to protect the
    data or the subject of the data. For instance, I can obfuscate data with masking
    or by anonymizing it, as will be discussed in this section.


    Obscuring can be done in either static or dynamic configurations. With the static
    technique, a new representative is created as a copy from the original data, and
    only the obscured copy is used. In the dynamic method, data is obscured as it
    is called, as with the examples I described: the customer service agent or the
    customer is granted authorized access, to the data as it is fed to them.


    We may want to add another layer of abstraction to the data to attenuate the possibility
    that sensitive information may be gleaned from otherwise mundane elements. For
    instance, even if it''s obscuring a person''s name in a given data set, if we
    allow other information, such as age, location, and employer, it is possible to
    determine the name without having direct access to that field.


    Removing the nonsensitive identifiers is called *anonymization* or sometimes *identification*.
    Anonymization is difficult, because sensitive data must be recognized and marked
    as sensitive when it is created; if the user inputs the data into open fields
    (free entry), determining sensitivity might not be simple. Moreover, the marking
    sensitivity creates metadata that may be valuable to an attacker.


    Tokenization is the practice of having two distinct databases: one with the live,
    actual sensitive data and one with nonrepresentational tokens mapped to each piece
    of data.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In this method, the user or program calling the data is authenticated by the
    token server, which pulls the appropriate token from the token database, then
    calls the actual data that maps to that token from the real database of production
    data, and finally presents it to the user or program. Tokenization adds significant
    overhead to the process but creates an extra degree of security and relieve the
    organization''s requirement or dependence on encryption (for instance, PCI DSS
    allows tokenization instead of encryption for sensitive cardholder data). For
    tokenization to function properly, the token server must have strong authentication
    protocols. To see how this works a little more clearly, review the following steps,
    also shown in Figure 4.2:


    +   1. A user creates a piece of data.

    2. The data is run through a DLP/discovery tool, as an aid to determine whether
    the data is sensitive to the organization''s rules (in this example, the data
    is deemed sensitive, the data is pushed to the tokenization database.

    3. The data is tokenized; the raw data is sent to the PII server, while a token
    representing the data is stored in the tokenization database. The token represents
    the raw data as a kind of logical address.

    4. Another user requests the data. This user must be authenticated so the systems
    can determine if the user should be granted access to the data.

    5. If the user authenticates, the request is pushed to the tokenization database.

    6. The tokenization database looks up the token of the requested data, then presents
    that token to the PII database. The raw data is not stored in the tokenization
    database.

    7. The PII database returns the raw data based on the token.

    8. The raw data is delivered to the requesting user.


    # FIGURE 4.2 Basic tokenization architecture


    ![](img/914e4f10ad3f2426a517172a28cd7161_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Security Information and Event Management


    We use monitoring tools to know how the systems and security controls in our IT
    environment are functioning, to detect anomalous activity, and to enforce policy.
    A large part of the monitoring effort comes in the form of logs: recording activity
    as it happens, sometimes from specialized devices that only conduct monitoring
    and other times from operational systems themselves (with their integrated logging
    functions).


    To better collect, manage, analyze, and display log data, a set of tools specifically
    created for that purpose has become popular. These are known by a variety of terms,
    since there is no accepted standard. Security information management, security
    event management, security information and event management, and permutations
    of these (including acronyms as SEM, SIM, and SIEM, perceived in various ways).
    We will refer to the entire family of tools as SIEM.


    Goals of SIEM implementation include the following:


    +   Centralized Collection of Log Data Because logs can be drawn from many sources
    (workstations, OS, servers, network devices, and so on), it can be useful to have
    a place to aggregate all for additional processing. If nothing else is, this simplifies
    the effort for the admins and analysts who will be tasked with monitoring the
    environment. This creates an additional risk; having all the log data in one location
    makes that location an attractive target for attackers, so any SIEM implementation
    will require additional layers of security controls.


    +   Enhanced Analysis Capabilities Logging is a mundane, repetitive task that
    requires a special skill and experience and is not suited for full-tasking (an
    analyst who stares at the same set data and feeds all day after day, will become
    in to the activity, an analyst who does not know the environment often won''t
    be as familiar with the baselines and won''t recognize anomalous behavior). One
    way to offset some of the problems with log analysis is to automate over the process.
    SIEM tools should have this capability, in addition to other functions such as
    advanced trend detection based on large data sets. One thing to remember, that
    most automated tools will not recognize a particular set of attacks—the "low and
    slow" of persistent threats, which may develop over months or months and do not
    have dramatic indicators and may be confused with background attack noise and
    go undetected by automated analysis.


    +   Dashboard Management often doesn''t understand IT functions, and understands
    even less about IT security. SIEMs often offer generic graphical output that is
    more intuitive and for managers to quickly grasp situations within the environment.


    +   Automated Response Some SIEMs have automated alert and response capabilities
    that can be programmed to suit your policies and environment.


    ![](img/914e4f10ad3f2426a517172a28cd7161_123_0.png)


    Like looking itself, SIEMs are only useful when someone is actually looking at
    what they produce; simply having the shiny box that performs security functions
    is nice, unless the information it provides is being harvested by someone who
    knows what they''re looking at, the SIEM can be another bandage in a damaged environment
    and won''t really offer benefit to the organization.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Egress Monitoring (DLP)


    Another set of popular tools are for the purpose of egress monitoring—that is,
    examining data as it leaves the production environment. These are often called
    DLP, which can stand for any combination of the terms data loss, leak prevention,
    and protection. I''m just going to refer to them as DLP.


    Like SIEM, DLP solutions have several major goals:


    +   **Additional Security** DLP can be used as another control in the layered
    defense strategy, one last mechanism for mitigating the possibility of inadvertent
    release or malicious disclosure.


    +   **Policy Enforcement** Users are alerted by the DLP when they are attempting
    to perform an action that would violate the organization''s policy (either accidentally
    or intentionally).


    +   **Enhanced Monitoring** The DLP tool can be set to provide one more log stream
    to the organization''s monitoring suite.


    +   **Regulatory Compliance** Specific types and kinds of data can be identified
    by the DLP solution, and dissemination of that data can be controlled accordingly,
    in order to better adhere to regulatory mandates.


    ![](img/914e4f10ad3f2426a517172a28cd7161_124_0.png)


    > DLP solutions can be linked to IRM tools, allowing extra functionality to the
    controls on intellectual property.


    DLP tools function in a variety of ways, but the general concept is that data
    is identified, activity is monitored, and policies are enforced.


    The identification task can be automated, manual, or a combination of both. The
    tool must search the organization''s entire storage volumes and production environment
    to match against known patterns; for instance, the DLP might search for strings
    containing characters to detect Social Security numbers. The DLP also might use
    categorization and classification labels, metadata assigned by the data owner
    during the Create phase of the data lifecycle. The DLP may use keyword searches
    for particular information known by the organization to be sensitive for its purposes.


    The monitoring task can be implemented at the points of network egress (in traditional
    systems at the DMZ (demilitarized zone), this would be one on all public-facing
    devices) or on all hosts that process data within the production environment.
    In the latter case, the DLP solution usually includes agents installed on user
    workstations/endpoint devices.


    The enforcement mechanism can take many forms. The DLP might be to alert management
    or security personnel when a user is conducting an activity that violates policy
    (say, sending an email attachment that contains data the organization has deemed
    sensitive). If what we''re trying to prevent is more accidental disclosures (as
    opposed to malicious activity), the DLP might just warn users that they''re sending
    sensitive sensitive'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Chapter 4 ■ Cloud Data Security


    data, and confirm that they really intended to send it. The DLP might be a bit
    more draconian and prevent the user from sending the attachment, locking the user
    out of the account, and notifying management and security. The organization can
    tailor DLP action to its own needs.


    DLP implementation in the clouds comes with related difficulties and costs, though.
    For one thing, the cloud provider may not allow the cloud customer sufficient
    access (in terms of both administrative permissions and installation of the requisite
    systems for implementation) to the data center environment, complicating successful
    configuration and usage. DLP utilization also incurs significant processing overhead;
    all monitoring and functionality comes with a processing cost.


    # Summary


    This chapter addressed the data lifecycle within the cloud environment as well
    as specific security challenges in each phase. We looked at different data storage
    architectures that might be implemented in the cloud, and which service model
    might best suited for each. We discussed cryptography, including the importance
    and difficulties with management and the possibility of using homomorphic encryption
    in the future. We discussed why we might want to observe raw data and only display
    selected portions during operations, and we talked about various methods for performing
    this task. We reviewed SIEM solutions, how and why they''re implemented, and some
    risks associated with their use. Finally, we addressed the topic of egress monitoring,
    how DLP tools work, and specific problems that might be encountered when trying
    to deploy DLP solutions in the cloud.


    # Exam Essentials


    Understand the risks and security controls associated with each phase of the cloud
    data lifecycle. Every phase has its own attendant, and those risks are usually
    associated with a particular set or type of security controls.


    Understand how import/export restrictions affect the field of information security.
    You should be familiar with the ITAR and the EAR and know what the Wassenaar Arrangement
    is.


    Understand the various cloud data storage architectures. Be able to differentiate
    file storage, block storage, databases, and CDN.


    Understand how and why encryption is implemented in the cloud. Know the elements
    of key management; in particular, know that encryption keys are not to be stored
    alongside the data they were used to encrypt. Know about the emerging technology
    known as homomorphic encryption and how it might be used in the future to process
    encrypted data without having to decrypt it first.'
