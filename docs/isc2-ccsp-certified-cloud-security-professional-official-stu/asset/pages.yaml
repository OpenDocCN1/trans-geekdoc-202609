    as a Service (SaaS) |

    |---|---|---|---|

    | Security Governance, Risk & Compliance (GRC) | | | |

    | Data Security | | | |

    | Application Security | | | |

    | Platform Security | | | |

    | Infrastructure Security | | | |

    | Physical Security | | | |'
