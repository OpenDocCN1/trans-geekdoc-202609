- pgno: 47
  md: 'service contract instead of trying to delineate individual controls à la carte.
    In this manner, the cloud customer can decrease some of the effort and expense
    they might otherwise-wise in trying to come up with a control framework for adhering
    to the relevant regulations.


    We will go into more detail about service-level agreements, or service contracts,
    in later chapters.


    It is however, crucial to note here (and I will repeat throughout the book) that
    under current laws, no cloud customer can transfer risk or liability associated
    with the inadvertent or malicious disclosure of *personally identifiable information*
    (PII). This is very, very important to understand: your organization, if it holds
    PII of any kind, is ultimately responsible for any breaches or releases of that
    data, even if you are using a cloud service and the breach/release results from
    negligence or attack on the part of the cloud provider. Legally and financially,
    in the eyes of the court, your organization is always responsible for any unreleased
    PII.


    PII is a major component of regulatory compliance, whether the regulation comes
    in the form of statutes or contractual obligation. Protection of PII will be a
    large part of your security concern in the cloud.


    # Reduction in Costs for Data Archival/Backup Services


    Off-site backups are standard practice for long-term data archival and disaster
    recovery purposes. Having a cloud-based service for this purpose is sensible and
    cost-efficient even if the organization does not conduct its regular operations
    in the cloud. However, moving operations into the cloud can create an economy
    of scale combined with the archiving/backup usage; this can lead to an overall
    cost savings for the organization. It can enhance the business continuity/disaster
    recovery (BC/DR) strategy for the organization as well.


    # Intended Impact


    All of these benefits can be enumerated in dollar value: each potential cost-saving
    measure can be quantified. Senior management—with input from subject matter experts—needs
    to balance the potential financial benefits against the risks of operating in
    the cloud. It is this cost-benefit calculation, driven by business needs informed
    by security concerns, that will allow senior management to decide whether a cloud
    migration of the organization’ operational environment makes sense.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Cloud Evolution, Vernacular, and Models


    > Return on investment (ROI) is a term related to cost-benefit measures. ROI is
    a term used to describe a profitability ratio. It is generally calculated by dividing
    net profit by net assets.


    > A great many risks are associated with cloud migration as well. I will be addressing
    these in detail throughout this book.


    # Cloud Evolution, Vernacular, and Models


    The arrival of the cloud and its related technology has provided a lot of advantages.
    To incorporate the cloud and these advantages, it is necessary to understand new
    terminology and how it relates to the terminology of traditional models. This
    new technology and its terminology is an integral part of understanding cloud
    computing service models and cloud deployment models.


    # New Technology, New Options


    Fifteen, or even ten, years ago, suggesting that organizations hand off their
    data and operations to a third party that is geographically distant and by people
    that most managers in the organization will never have met seemed as insurmountable,
    especially from a security perspective. The risk would have been seen as daunting,
    ceding that control to one vendor would been daunting. Today, a combination of
    technological capabilities and contractual trust make cloud computing not only
    appealing but almost a foregone conclusion, in terms of financial viability.

    nSeveral characteristics are emblematic of cloud computing:


    +   - Elasticity: Rather than constantly purchasing clouds, servers, data storage
    systems, and other resources and maintaining their infrastructure, an organization
    can contract with a cloud vendor. The provider uses virtualization to flexibly
    allocate only the needed usage of each resource to the organization, thus holding
    down costs while maintaining portability. This also allows users to access their
    data from diverse platforms and locations, increasing portability, accessibility,
    and availability.

    - Simplicity: Proper cloud implementations allow a user to seamlessly use the
    service without frequently interacting with the cloud provider.

    - Scalability: In general, increasing or reducing services can be more easily,
    quickly, and cost-effectively accomplished than in a non-cloud environment.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The Difference Between a Cloud Customer and a Cloud User


    A **cloud customer** is anyone purchasing a cloud service (which could be an individual
    or company), whereas a *cloud user* is someone using cloud services. It could
    be an employee of a company that is a cloud customer or a private individual.


    For instance, Company A purchases SaaS services from Cloud Provider X. Company
    A is a cloud customer. All employees of Company A are cloud users, because they’re
    using the cloud services their employer, a cloud customer, has purchased for their
    usage.


    # Cloud Computing Service Models


    Cloud services are often offered in terms of three general models, based on what
    the vendor offers the customer and the responsibilities of each according to the
    service contract. (ISC)² expects you to understand these three models for testing
    purposes. These models are *infrastructure as a service* (IaaS), *platform as
    a service* (PaaS), and *software as a service* (SaaS), as shown in Figure 1.2.
    In the following sections, we will review each of them in.


    # FIGURE 1.2 Cloud service models


    | | |

    |---|---|

    | SaaS | Applications CRM<br>Hosted HR Email |

    | PaaS | Operating Systems<br>- Windows<br>- Linux<br>- Unix<br>- Etc.

    | IaaS | Hardware<br>Blades<br>Connectivity Utilities

    Cloud Service Models |


    Some vendors and consultants demonstrate a lot of zeal in capitalizing the popularity
    of the "cloud" concept and incorporate the word into every term they can think
    of in to make their products more appealing. We see a broad proliferation of such
    labels as networking as a service (NaaS), compliance as a service (CaaS), and
    data science as a service (DaaS), but they’re mostly just marketing techniques.
    The only service models you’ll need to know for both the exam and your use as
    a practitioner are IaaS, PaaS, and SaaS.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Infrastructure as a Service (IaaS)


    The most basic of cloud service offerings, IaaS allows the customer to install
    all software, including operating systems (OSs), on hardware housed and connected
    to the cloud vendor. In this model, the cloud provider has a data center with
    racks, machines, cables, and utilities and administers all these things. However,
    all logical resources, such as software, are the responsibility of the customer.


    In traditional terms, we might think of what was used to be considered a "warm
    site" for BC/DR purposes: the physical space exists, the connectivity exists,
    and it is available for the customer organization to fill with any type of baseline
    configuration and populate with any data the customer requires.


    IaaS might be optimum for organizations that want enhanced control over the security
    of their data or are looking to the cloud for a limited purpose, such as BC/DR
    or archiving. It is usually the least expensive cloud option, in terms of what
    the customer pays the provider. However, the customer will retain capabilities
    and requirements, such as IT staffing, that may make it difficult to ascertain
    the true total cost.


    # Platform as a Service (PaaS)


    PaaS contains everything included in IaaS with the addition of OS. The cloud vendor
    usually offers a selection of OSs so that the customer can use any or all of the
    available choices. The vendor will be responsible for patching, administering,
    and updating the OS as necessary, and the customer can install any software they
    deem useful.


    This model is especially useful for customers involved in software development,
    as the without risk of damaging production capabilities and determine the viability
    of the software across a range of OS platforms.


    PaaS also includes cloud-database engines and services as well as "big data"-style
    services, such as data warehousing and datamining. The provider offers access
    to the backend-engine/functionality, which the customer can create/install various
    apps/APIs to access the backend.


    # Software as a Service (SaaS)


    SaaS includes everything in IaaS and PaaS with the addition of software programs.
    The cloud vendor becomes responsible for administering, patching, and updating
    this software as well. The cloud is basically involved in uploading and processing
    data on a full production environment hosted by the provider.


    There are many examples of SaaS configurations, ranging across a spectrum of functionality.
    Google Docs, Microsoft''s Office 365, and QuickBooks Online are all examples of
    SaaS products. The provider takes care of all the infrastructure, compute, and
    storage needs as well as providing the underlying operating systems and the application
    itself. Of this is completely transparent to the end user, who only sees the application
    they have purchased/accessed.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Cloud Deployment Models


    In addition to view cloud offerings in terms of what levels of service are involved,
    another perspective has to do with ownership. You''ll be expected to know the
    facets of both sets of models.


    # Public


    The public cloud is what we typically think of when discussing cloud providers.
    The resources (hardware, software, facilities, and staff) are owned and operated
    by a vendor and sold, leased, or rented to anyone (the public—hence the name).
    Public clouds are multitenant environments; multiple customers will share the
    underlying resources that are owned and operated by the provider. That means a
    customer in a public cloud might be using a virtual machine that actually resides
    on the same hardware that hosts another virtual machine operated by the customer''s
    direct competitor, and has no way of knowing what other entities are using the
    same resources.


    Examples of public clouds include Rackpace, Microsoft''s Azure, and Amazon Web
    Services (AWS).


    # Private


    A private cloud is dedicated to a single customer; no other customers will share
    the underlying resources (hardware and perhaps software). Therefore, private clouds
    are not multitenant environments.


    Private clouds can take various forms. A private cloud might be owned and maintained
    by the entity that is the sole customer. In other words, an organization might
    own and operate a data center that serves as the cloud environment for organization''s
    users. Or a private cloud might be a set of resources (racks, blades, software
    packages) owned by the single customer located and maintained at the cloud provider''s
    data center; the cloud provider might offer physical security, some basic administration
    services, and other utilities (power, Internet connectivity) for the customer''s
    resources. This is sometimes referred to as a co-lo (co-located) environment.


    Another private cloud option allows the customer to contract with a cloud provider
    such that the provider offers exclusive use of resources for that customer inside
    otherwise would be a public cloud. Basically, the provider carves out a physical
    and logical section of the overall data center so that the customer will not share
    any of the resources in that section with any other customers. Obviously, the
    customer must pay a premium for this type of service (more than what public cloud
    customers, in a multitenant environment, would pay).


    # Community


    A community cloud features infrastructure and processing owned and operated by
    (or for) an affinity group; disparate pieces might be owned or controlled by individuals
    or distinct organizations, but they come together in some fashion to perform joint
    tasks and functions.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Cloud Computing Roles and Responsibilities


    Gaming communities might be considered community clouds. For instance, the PlayStation
    network involves many different entities coming together to engage in online gaming:
    Sony hosts the identity and access management (IAM) tasks for the network, a particular
    game company might have a set of servers that run rights management (IRM) functions
    and processing for a specific game, and individuals conduct some of their own
    processing and storing locally on their own PlayStations. In this type of community
    cloud, ownership of the underlying technologies (hardware, software, and so on)
    is spread throughout the various members of the community.


    A community cloud can also be provided by a third party on behalf of the various
    members of the community. For instance, a cloud provider might offer a FedRAMP
    cloud service, for use by any number of federal agencies might subscribe to such
    cloud service (say, the Department of Agriculture, Health and Human Services,
    the Department of the Interior, and so on), and they will all use infrastructure
    that is dedicated strictly for their use. Any customer that is not a US federal
    agency will not be allowed to use this service as noncommutative entities are
    not part of this particular community. The cloud provider provides the underlying
    infrastructure, but it''s provisioned and made available solely for the use of
    the specific community.


    # Hybrid


    A hybrid cloud, of course, contains elements of the other models. For instance,
    an organization might want to retain some private cloud resources (say, their
    legacy production environment, but also lease some public cloud space as well
    (maybe a PaaS function for software development/testing, away from the production
    environment so that there is much less risk of crashing operational systems).


    # Cloud Computing Roles and Responsibilities


    Various entities are involved in cloud service arrangements:


    +   **Cloud Service Provider (CSP)**, or **Cloud Provider or Provider** The vendor
    offering cloud services. The CSP owns the data center, employ the staff, own and
    manage the resources (hardware and software), monitor service provision and security,
    and provide administrative assistance for the customer and the customer''s data
    and processing needs. Examples include Amazon Web Services, Rackspace, and Microsoft''s
    Azure.


    +   **Cloud Customer** The organization purchasing, leasing, or renting cloud
    services.


    +   **Cloud Broker** A company that purchases hosting services from a cloud provider
    who then resells them to their own customers.


    +   **Cloud Access Security Broker (CASB)** A third-party entity offering independent
    identity and access management (IAM) services to CSPs and cloud customers, often
    as an'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'intermediary. This can take the form of a variety of services, including single
    sign-on, certificate-management, and cryptographic key escrow.


    **Regulators.** The entities that ensure organizations are in compliance with
    the regulatory framework for which they''re responsible. These can be government
    agencies, certification bodies, or parties to a contract. Regulations include
    the Health Information Portability and Accountability Act (HIPAA), the Graham-Leach-Biley
    Act (GLBA), the Payment Card Industry Data Security Standard (PCI DSS), the International
    Organization for Standardization (ISO), the Sarbanes–Oxley Act (SOX), and so forth.
    Regulators include the Federal Trade Commission (FTC), the Securities and Exchange
    Commission (SEC), and auditors commissioned to review compliance with contracted
    or asserted standards (such as PCI DSS and ISO), and among many others.


    # # Cloud Computing Definitions


    Business cloud definitions are the heart of understanding the following chapters
    and applying security fundamentals for the Certified Cloud Security Professional
    (CCSP), I have included some of these definitions here.


    **Business Requirement** An operational driver used for decision-making and input
    for risk management.


    **Cloud App (Cloud Application)** The phrase used to describe a software application
    accessed via the Internet; may include an agent or app installed locally on the
    user''s device.


    **Cloud Architect** Subject matter expert for cloud computing infrastructure and
    deployment


    **Cloud Backup** Backing up data to a remote, cloud-based server. As a form of
    cloud storage, cloud backup data is stored in an accessible form from distributed
    resources that make up a cloud.


    **Cloud Computing** The use of computing, storage, and network resources with
    the capacity of rapid elasticity, metered service, broad network access, and pooled
    resources.


    **Cloud Migration** The process of transitioning all or part of a company''s data,
    applications, and services from on-premises to the cloud, where the information
    can be provided over the Internet on an on-demand basis.


    **Cloud Portability** The ability to move applications and associated data between
    one cloud provider and another without legacy or cloud environments.


    **Cost-Benefit Analysis** This is comparing the positive impact (such as profit,
    efficiency, market share, and so on) of a business decision to the potential negative
    impact (expense, detriment to production, risk, and so on) and weighing whether
    the two are equivalent or if the potential positive effect outweighs the potential
    negative. This is a business decision, not a security decision, and it is best
    made by managers or business analysts.'
