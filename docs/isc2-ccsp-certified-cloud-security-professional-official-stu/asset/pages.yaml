  md: '![](img/914e4f10ad3f2426a517172a28cd7161_41_0.png)


    This chapter is the foundation for all the other chapters in this study guide.
    You may find it useful to review this material before reading other chapters.


    The CCSP is not a certification of basic computer skills or training; it is a
    professional certification for practitioners with some background in the field.
    (ISC)² expects those who want to earn this particular certification already have
    experience in the industry; have have been employed in an Infosec in some professional
    capacity; and have a thorough understanding of many basic areas related to computers,
    security, business, risk, and networking. Many people taking the test already
    expect this certification to validate their knowledge and experience, such as
    the CISP. Therefore, this book will not contain any of the basics that, while
    testable, you are already expected to know. If you are not coming from a CISP
    background, it would be good to supplement your knowledge with CISP-focused materials
    as well.


    However, the CCSP Common Body of Knowledge (CBK) contains terminology and concepts
    that may be expressed in specific ways, to include perspectives and usages that
    may be unique to the CCSP and different from what you are used to dealing with
    in your current operations. This chapter is therefore intended as a guide, laying
    down the foundation for understanding the rest of the material and the CBK as
    a whole.


    # # Cloud Characteristics


    Cloud computing has come to mean many things, but the following characteristics
    have become part of the generally accepted definition:


    +   * Broad-network access

    * On-demand self-service

    * Resource pooling

    * Rapid elasticity

    * Measured or "metered" service'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Cloud Characteristics


    These traits are expressed succinctly in the NIST definition of cloud computing.


    # NIST 800-145 Cloud Computing Definition


    The official NIST definition of cloud computing says, “Cloud Computing is a model
    for enabling ubiquity, convenient, on-demand network access to a shared pool of
    configurable cloud resources (e.g., servers, storage, applications, and services)
    that can be rapidly provisioned and released with minimal management effort or
    service interaction.


    These characteristics are also similar to how cloud computing is defined in ISO
    17788 (www.iso.org/iso/catalogue/detail?id=68544).

    You can expect to see each of these throughout this book, the CBK, and the exam.


    Broad network access means services are consistently accessible by standard means,
    such as the use of a web browser to access a Software as a Service (SaaS) application
    regardless of the user''s needs with little or no intervention from or prior communication
    with the provider. The services happen in real time.


    On-demand self-service refers to the model that allows customers to scale their
    compute and/or needs with little or no intervention from prior communication with
    the provider.


    Resource pooling allows the cloud provider to meet various demands from customers
    while remaining financially viable. The cloud provider can make capital investments
    that exceed any single customer could provide on their own and can afford these
    resources so that the resources are not underutilized (which would mean a wasteful
    investment) or overtaxed (which would mean a decrease in level of service). This
    is often referred to as a multtenant environment; multiple customers share the
    same underlying hardware, software, and networking assets.


    Rapid elasticity allows the cloud to grow or shrink the IT footprint (number of
    users, number of machines, size of storage, and so on) to meet any operational
    needs without excess capacity. In the cloud, this can be done in moments, as opposed
    to the traditional environment, where acquisition and deployment of resources
    (or disposing old resources) can take weeks or months.


    Finally, measured or met service means that the customer is charged for only what
    they use and nothing more. This is much like a water or power company might charge
    you each month for the services used (with perhaps a minimum monthly charge for
    maintaining the connection).


    Rest assured—we will be going into even more detail regarding all of these concepts
    in the chapters to come.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Chapter 1 ■ Architectural Concepts


    ![](img/914e4f10ad3f2426a517172a28cd7161_43_0.png)


    # Online Shopping


    Think of retail demand during the pre-holiday crush towards the end of the year.
    The sheer volume of customers and transactions greatly exceeds all normal operations
    throughout the rest of the year. When this happens, retailers who offer online
    shopping can see great benefit from hosting their sales capabilities in the cloud.
    The cloud provider can apportion resources necessary to meet this increased demand
    and will charge for this increased usage at a negotiated rate, but when shopping
    drops off the holiday, the retailers will not continue to be charged at the higher
    rate.


    # Business Requirements


    The IT department is not a profit center; it provides a support function. This
    is even more accurate to describe the security department. Security activities
    actually hinder business efficiency (generally, the more secure it is, the be
    device or a process, the less efficient it will be). This is the business needs
    of the organization drive security decisions and not to be the other way around.


    A successful organization will gather as much information about operational business
    requirements as possible; this information can be used for many purposes, including
    several functions in the security realm (I''ll touch on this throughout the book,
    but a few examples include the business continuity/disaster recovery effort, the
    risk management plan, and data categorization). Likewise, the astute security
    professionals need to understand as much as possible aspects of the organization.
    Operational aspects of the organization can help security personnel perform their
    tasks no matter what level or role they have assigned to. Consider the following
    examples:


    +   - A network security administrator has to know what type of traffic to expect
    based on the business of the organization.

    - The intrusion detection analyst has to understand what the organization is doing,
    business activities occur, and where (geographically) the business is operating
    to understand the nature and intensity of potential external attacks and how to
    adjust baselines accordingly.

    - The security architect has to understand the various needs of the organizational
    departments to enhance their operation without compromising their security profile.


    functional requirements: Those performance aspects of a device, process, or employee
    that are necessary for the business task to be accomplished. Example: A salesperson
    in the field must be able to connect to the organization''s network remotely.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'nonfunctional requirements: Those aspects of a device, process, or employee
    that are not necessary for accomplishing a business task but are desired or expected.
    Example: The salesperson''s remote connection must be secure.


    Many organizations are currently considering moving their network operations to
    a cloud-based motif. This is not a decision made lightly, and the business requirements
    must be supported by this transition. There are also different cloud service and
    delivery models of cloud computing, and an organization must decide which one
    will optimize success.


    # Existing State


    A true evaluation and understanding of the business processes, assets, and requirements
    is essential. Failing to properly capture the full extent of the business needs
    could result in having an asset in the new environment after migration to the
    cloud.

    At the start of this effort, the intent is not to determine what will best fulfill
    the business requirements but to determine what those requirements are. A full
    inventory of assets, processes, and requirements is necessary, and there are various
    methods for collecting data. Typically, several methods are used jointly to reduce
    the possibility of missing something.


    +   * Here are some possible methods for gathering business requirements:

    * Interviewing functional managers

    * Interviewing users

    * Interviewing senior management

    * Surveying customers

    * Collecting network traffic

    * Inventorying assets

    * Collecting financial records

    * Collecting insurance records

    * Collecting marketing data

    * Collecting regulatory mandates


    After sufficient data has been collected, a detailed analysis is necessary. This
    is the point where a business impact analysis (BIA) takes place.

    The BIA is an assessment of the priorities given to each asset and process within
    the organization. A proper analysis should consider the effect (impact) any harm
    or loss of each asset might mean to the organization overall. During the BIA,
    special care should be paid to identify critical and single points of failure.
    You also need to determine the costs of compliance—that is, the legislative and
    contractual requirements mandated for your organization. Your organization''s
    regulatory restrictions will be based on many variables, the jurisdictions where
    your organization operates, the industry is in, the types and locations of your
    customers, and so on.'
  merge: -1
