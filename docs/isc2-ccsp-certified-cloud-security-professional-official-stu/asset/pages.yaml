- pgno: 358
  md: '# Chapter 11: Legal and Compliance Part 2


    +   1. The lowest level is Level 1, which is self-assessment. Level 2 is an external
    third-party attestation, and Level 3 is a continuous-monitoring program. Hybridization
    does not exist as part of the CSA program.


    +   2. KRI stands for key indicator. KRIs help the organization identify and recognize
    changes to risk.


    +   3. ISO 31000:2018 focuses on design implementation and management. HIPAA refers
    to health care regulations, NIST 800-92 is about log management, and ISO 27017
    is about cloud-specific security controls.


    +   4. ENISA specifically identifies the top eight security risks based on likelihood
    and impact.


    +   5. The SOC 2 report is not a part of the CSA Star program. It is a totally
    different audit reporting standard developed by the AICPA.


    +   6. ISO/IEC 28000:2007 specifically focuses on security controls in supply
    chains. The others address other matters.


    +   7. Key risk indicators are useful, but they are not a framework. ISO 31000:2018
    is an international standard that focuses on designing, implementing, and reviewing
    risk management processes and practices. NIST SP 800-37 is the Guide for Implementing
    the Risk Management Framework (RMF), a methodology for handling all organizational
    risk in a holistic, comprehensive continuous manner. The European Union Agency
    for Network and Information Security (ENISA) Cloud Computing: Benefits, Risks,
    and Recommendations for Information Security identifies the top eight cloud security
    risks.


    +   8. There is no such thing as zero risk. All the other answers are distractors.


    +   9. ENISA''s top security risks of cloud computing do not include availability,
    even though it is a risk that could be realized.


    +   10. Avoid halts the business process, mitigation entails using controls to
    reduce risk, acceptance taking on the risk, and transference usually ensures insurance.


    +   11. A cloud carrier is the intermediary that provides connectivity and transport
    of cloud services between cloud providers and cloud customers.


    +   12. Transference usually ensures insurance. Avoid taking on the risk, and
    mitigation entails using controls to reduce risk.


    +   13. The use of subcontractors can add risk to the supply chain and should
    be considered; determining how much you can trust the provider''s management of
    vendors and suppliers (including subcontractors) is important. Conversely, the
    customer is not likely to be allowed to review the physical design of the data
    center (or, indeed, even know the exact location of the data center) or the personnel
    security for the provider''s staff. Redundant uplinks gratis is a nonsense term
    used as a distractor.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '14. C. Key risk indicators (KRIs) try to predict future risk, while key performance
    indicators

    (KPIs) examine events that have already happened. The other answers are just distractors.


    15. A. Enveloping is a nonsense term, unrelated to risk management. The rest are
    valid ways to

    manage risk.


    16. A. Hex GBL is a reference to a computer part in Terry Pratchett’s fictional
    Discworld

    universe. The rest are risk management frameworks.


    17. B. Roles and responsibilities should be included in the contract, not the
    SLA; a good

    method to determine whether something belong in the SLA at all is figuring out

    whether a numerical value is associated with it—in this case, the element involves
    names

    of offices (roles), not numerical values, so it’s immediately recognizable as
    something that

    isn’t appropriate for the SLA. Options A, C, D are explicitly defined by exact
    numbers that

    describe recurring events/circumstances and are just the sort of elements that
    belong in the

    SLA.


    18. A. The CSA CCM is an inventory of cloud service security controls that are
    arranged into

    separate security domains, not a hierarchy.


    19. A. Transitional is not a term we associate with types of controls; the rest
    are.


    20. A. An IT analyst is generally not high enough of a position to be able to
    provide quality

    information to other stakeholders. However, the IT director would be in such a
    position, as

    would the others.'
