    \ investigates and\nenforces them with IRS agents, and decides outcomes in cases\
    \ tried by lawyers and adjudi-\ncated by judges both in the employ of the IRS.\n\
    \n# US Laws\n\nI will now describe and discuss US laws with the largest impact\
