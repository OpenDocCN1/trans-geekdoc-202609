    In object storage, all data is stored in a filesystem, and customers are given
    access to the parts of the hierarchy which they''re assigned. This is sometimes
    referred to as file storage. In object storage, the user/administrator is limited
    to uploading, storing, and manipulating files (objects) as to installing and running
    programs. Threats to object storage include the following:


    +   - Because object storage does not have a runtime environment, the risk of
    malware is greatly reduced may still exist for parasitical viruses, which may
    infect specific files.


    +   - Loss to physical disk failure remains.


    +   - The risk of ransomware attacks may also significantly threaten object storage.


    # Other Storage


    There are other forms of cloud data storage you should be familiar with:


    +   - Ephemeral Storage: Temporary resource that is used primarily for processing.
    Sometimes referred to as instance volumes, ephemeral storage is provided by devices
    directly connected to a host machine where the virtualized instance—somewhat analogous
    to RAM for the cloud virtual machine. Threats to ephemeral storage: data in ephemeral
    storage will be lost if the virtual machine is shut down or if the physical drive
    where it resides fails.


    +   - Long-Term Storage: Durable data storage capacity, offered at low cost and
    large amounts, typically used for archiving/backups. Usually, this type of storage
    is not suitable for production environments and is not conducive to installing
    and running programs, but at least some providers offer the capability to run
    queries and analyze data stored in long-term storage. Threats to long-term storage:
    insider threat (either users with malicious intent, or administrators at the cloud
    data storage center); intermediary/man-in-the-middle attack); ransomware; lock-in,
    as the data has a much more difficult to leave vendor.


    +   - Content-Delivery Network (CDN): Typically used for large amounts of data
    that require time-sensitive communication and low latency, such as multimedia
    content (games, videos, etc.). Instead of hosting an entire library of content
    at a single, centralized physical location and distributing content globally,
    content providers may use a CDN to replicate portions of the data at data centers
    physically located near users/consumers in order to reduce the potential for delay/disruption
    and decrease in quality of service. For example, a video content producer in Brussels,
    with worldwide viewership, may opt to lease services from a CDN service host,
    replicating copies'
