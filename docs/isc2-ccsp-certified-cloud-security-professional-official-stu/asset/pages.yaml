    DoS/DDoS, data breach, legal repercussions, sync flooding, brute force, and more.


    Man-in-the-Middle Attacks This is the colloquial term for any attack where attackers
    insert themselves between the sender and receiver. This can take the form of eaves-dropping
    to acquire data, or it can be a more advanced attack, as the attacker posing as
    one of the participants in order to gain further control/access or modifying data
    traffic to introduce false or damaging information into the communication. The
    remote access capability of a private cloud enhances the exposure to this type
    of threat, compared to legacy configurations where all network access was limited
    to internal users.


    Theft/of Devices Again, the convenience and enhanced capability of remote access
