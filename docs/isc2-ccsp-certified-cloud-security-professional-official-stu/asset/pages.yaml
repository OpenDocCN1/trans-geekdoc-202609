    responsibility will be for physical security of the facility and systems. Both
    parties will share the responsibility for securing the infrastructure. Admittedly,
    this will be to a lesser extent for the cloud provider because the customer will
    be installing the OS, which can significantly affect the security of the underlying
    systems, and the customer will be responsible for this aspect of infrastructure
    security. The customer will have sole responsibility for all other security aspects.


    # PaaS


    In a PaaS model, the cloud customer will be installing programs on top of operating
    systems loaded and managed by the cloud vendor. The vendor might offer a variety
    of OSs, allowing the customer to ensure interoperability on a number of platforms.
    This can be extremely useful if the customer ends users in a heterogeneous environment
    (for instance, a BYOD configuration, with users accessing systems through different
    web browsers on multiple of devices).


    Therefore, in PaaS, the cloud provider will still maintain physical security control
    of the facility and hardware but will now be responsible for securing and maintaining
    the OS. The cloud customer will remain obligated to provide all other security.


    # SaaS


    As you can expect, in SaaS modes, the cloud provider will have to maintain physical
