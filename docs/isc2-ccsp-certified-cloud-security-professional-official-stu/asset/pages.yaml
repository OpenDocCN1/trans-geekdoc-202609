- pgno: 138
  md: '# Cloud Computing Risks by Deployment Model


    The benefits of this deployment model each come with attendant risks:

    Resiliency through Shared Ownership Because the network ownership and operation
    is scattered among users, the environment is more likely to survive the loss of
    significant nodes without affecting the others. However, this introduces additional
    risks because each node is its own point of entry and a vulnerability in any one
    node can result in intrusion on the others. This, of course, means that unity
    of configuration management and baselines is almost impossible (and very difficult
    to enforce).

    With distributed cloud comes decision-making in terms of policy and administration.


    Shared Costs Overhead and cost of the infrastructure is shared among the members
    of the community, so so is access and control.


    No Need for Centralized Administration for Performance and Monitoring Although
    this removes many burdens of centralized administration, it also removes the reliability
    of centralized and homogenized standards for performance and security monitoring.


    # Real World Scenario


    # Online Gaming as a Community Cloud


    Online gaming is an excellent example of the community cloud model. Each individual
    gamer owns their own device (a console or a computer). The individual gamer is
    responsible for the purchase price of the device, maintaining the device, and
    establishing/maintaining a connection to the Internet. Each individual gamer can
    also disconnect their device voluntarily, whenever they feel it (or even destroy
    their device, if they choose, because they own the device completely).


    Then there is a centralized identification and access management (IAM) node involved
    in the setup. Some entity (such as Microsoft or Sony) acts as the validator of
    identity/permission for each individual; this entity has full control/ownership
    of the IAM function and must pay to create/maintain that node. Individual gamers
    log into the centralized IAM node in order to get access to the shared game environment.


    Finally, there is another, distinct entity that is the game host; they run the
    server that handles the online interactions between the verified players. This
    backend game machines are wholly owned and maintained by the game host (often
    the game manufacturer or distributor).


    Each entity is responsible for their own components and participation in the community;
    each takes part voluntarily and can leave at any time. Ownership, processing,
    and storage are shared among the participants, depending on their role in the
    interaction.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Public Cloud


    This is the deployment model that has the most focus in the CCSP CBK and is most
    likely to provide the greatest benefit to the largest number of cloud customers.
    In the public cloud, a company offers cloud services to any entity that wants
    to become a cloud customer, or to be an individual, company, government agency,
    or other organization.


    Many of the risks exist in the public cloud as in the private cloud: personnel
    inadvertent and malicious, external threats, natural disasters, and so forth.
    Some of them are obviated by the public cloud''s similarity to the community cloud,
    such as infrastructure, shared costs, and the need for competitive capability.
    However, it is these same benefits that entail the additional risks of the public
    cloud. The organization will lose control, oversight, audit, and enforcement capabilities—basically,
    all the assurance of maintaining a private cloud internal to the organization.


    There are some additional risks that are unique to the public cloud that also
    must be considered. We''ll discuss some of them in detail in the following sections.


    # Vendor Lock-in


    In ceding control of the production environment and data to an external party,
    the organization creates a dependency on that provider. The expense and trouble
    of moving out the provider''s data center could be crippling to the customer,
    especially if the customer chooses to do so before the end of the contract term.
    In a sense, this can make the customer a hostage of the provider and allow the
    provider to decrease service levels and/ increase prices as the provider sees
    fit. It''s important to stress that this is not a commonplace occurrence. It does
    not mean that cloud providers are maliciously luring customers into unfavorable
    arrangements.


    Vendor lock-in (also known as provider lock-in) can be caused by other circumstances
    as well. For instance, if the provider uses a proprietary data format or method
    to store information, the customer may not be able to easily migrate their data
    to another provider. The customer could be considered a form of lock-in, too,
    if it is restrictive and puts an onus on the customer if the customer chooses
    to go to another provider. Alternatively, vendor lock-in can be caused by some
    sort of regulatory constraint, where finding another provider that will meet the
    specific regulatory needs of the organization could be difficult.


    To avoid lock-in, the organization has to think in terms of portability considering
    migration. We use the term portability to describe the general level of ease or
    difficulty when transferring data out of a provider''s data center (regardless
    of whether it''s being moved to another provider or to a private cloud).


    Ensure favorable contract for portability. Make sure the organization considers
    an exit strategy, even while creating the initial agreement with the provider
    at the outset of cloud service acquisition. Is there a reduced-rate trial period
    in the cloud environment? What is the penalty for early transfer (severing the
    contract)? At the end of the contract term, will there be any difficulty, contractually
    or in terms of performance, in moving the data to another provider? (See the real-world
    example “Ambiguity Is Scary.")'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Cloud Computing Risks by Deployment Model 101


    **Avoid proprietary formats.** Don''t sign with a provider unless the raw data
    can be recovered in a format that can be used at another provider''s site. This
    might involve using some form of conversion before moving the data, and that conversion
    should be simple and inexpensive if the customer chooses to move.


    **Ensure there are no physical limitations to moving.** Make sure that the bandwidth
    leaving the old provider is sufficient for the purposes of moving your organization''s
    entire data set and that the new provider can handle that size of importation.


    **Check for regulatory constraints.** There should be more than one cloud provider
    that can handle your organization''s specific compliance needs. If your needs
    are bizarrely unique and restrictive (for instance, if your organization is a
    medical college that takes credit card payments, requiring you to simultaneously
    comply with FERPA, PCI, and HIPAA), that number of providers may be extremely
    limited.


    ![](img/914e4f10ad3f2426a517172a28cd7161_140_0.png)


    Real World Scenario


    Ambiguity Is Scary


    In the case of one public cloud provider, the contract stipulated a set of maximum
    upload/download parameters, with additional fees if these bounds were exceeded
    in any given month. This is commonplace and the usual cloud provider establish
    rates and for the appropriate level of resources to meet their customers'' regular
    needs and still allow for cloud bursting.


    Elsewhere in the contract, the terms for leaving at the end of any contract period
    were detailed to include a duration in which the customer could move their data
    away from the provider (it was 30 days).


    What the contract didn''t state whether the same monthly limits (and fees for
    exceeding limits) would be in effect during the long-month movement of data out
    of the provider''s space in the event the customer chose to leave.


    It seems obvious the limits wouldn''t be enforced during the transition period.
    Otherwise, would a customer reasonably leave the provider? Assuming the customer
    was maximal use of the service and uploading x bytes of data each month of a year-long
    contract term, there would be 12x bytes (12 times the established monthly limit)
    stored in the provider''s data center at the end of the contract. If the limits
    were still in place, the customer would be facing considerable penalties in fees
    to move 12x bytes in that final month. Can the customer assume that this reasonable
    conclusion was the intention of the contract?


    Of course not. We can never assume anything, especially when crafting contracts.
    Therefore, this is a question that would have to be resolved in writing and agreed
    to as an amendment or addition to the contract before both parties sign.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Vendor Lock-Out


    Another problem associated with ceding control of the organization''s data and
    production environment is referred to as vendor lock-out (also known as provider
    lock-out). Vendor lock-out can be caused when the cloud provider goes out of business,
    is acquired by another company, or ceases operation for any reason. In these circumstances,
    the concern is whether the customer can still readily access and recover their
    data.


    We cannot readily plan for all the possible reasons vendor lock-out might occur.
    We can, however, be aware that the possibility exists and make decisions accordingly.
    We may want to consider the following factors when selecting a cloud provider:


    **Longevity** How long has the provider been in business? Does it seem to be a
    market leader? It may be as difficult as others to assess, because IT is an extremely
    volatile field and new providers are constantly entering while stalwarts often
    leave with little warning. Cloud technology and services on a large scale, in
    particular, are a recent development and may be more prone to significant and
    unexpected turbulence.


    **Competency** Can this provider offer your organization what it needs? Is it
    capable of meeting all your service requirements? Does it have the staff, resources,
    and infrastructure to handle your organization''s demands, as well as those of
    its customers? One measure of the possible strength and suitability of a given
    provider is whether a cloud service is central to its offerings or is an additional
    function for its company.


    **Jurisdictional Suitability** What country is the provider in, and which state?
    This question must be asked in terms of both where the provider is chartered and
    where it operates. Where is the data center? Where is its long-term storage and
    backup capability? Will your organization''s data be crossing boundaries and borders?
    Can your organization use this provider and remain compliant with all applicable
    regulations?


    **Supply Dependencies** Does the provider rely on any other entity for its critical
    functions, both upstream and downstream? Are there essential suppliers, vendors,
    and utilities without which the provider could not perform? This aspect will be
    very difficult to investigate without considerable disclosure on the part of the
    provider.


    **Legislative Environment** What pending statutes might affect your organization''s
    ability to use that provider? This facet may carry the most potential impact for
    cloud customers and also be the most challenging to predict. For instance, almost
    nobody fores that Great Britain would leave the European Union in 2016, and the
    Brexit referendum entailed significant political and regulatory modifications
    for companies operating in both jurisdictions.


    # Not If, But When


    Some people might think that a provider''s record of incidents should be used
    as a discriminator when considering vendor lock-out and that if a given provider
    has proven susceptible to breaches or attacks or failures in the past, this should
    be a telling portent of'
