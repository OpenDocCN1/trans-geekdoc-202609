- pgno: 166
  md: '# Business Requirements


    The primary intent for the cloud customer is to meet these business requirements.
    This could involve increasing efficiency, meeting regulatory needs, and ensuring
    durability of capabilities during contingencies, but it should always involve
    reducing cost. Even if the cloud customer is a nonprofit entity and is not interested
    in maximizing profits, it is in the interest of all stakeholders to minimize expenses
    and maximize productivity.


    Other business requirements will vary, depending on the industry and particular
    organization. Business drives other considerations (including security) and is
    the primary focus of all decisions. In order to determine what is a business requirement,
    senior management can make use of the artifacts created in various processes,
    including business impact analysis, risk analysis, asset inventory, and so on.
    To translate these requirements into cloud contract elements, SLAs, and operational
    functions, managers in a cloud organization seek guidance and input from both
    internal and external sources.


    When the business requirements have been converted into functional needs, they
    can be calibrated by contract terms and SLAs. These elements of legal agreement
    will clarify particular requirements and expectations of each, and related pricing.


    # Business Requirements: The Cloud Provider Perspective


    What sort of business goals and operating requirements does the provider have,
    and how are they achieved? In a very simple way, this question can be answered
    with two responses: responsible and ensure all customers (in the form of contracts
    and SLAs) are being met. A more complex explanation should include a discussion
    of the physical establishment of the cloud provider''s data center and equipment,
    the security aspects involved in physical plant and architecture, and the logical
    design and security aspects of the data center.


    # Cloud Provider Responsibilities: The Physical Plant


    The cloud provider needs a data center to provide services to its customers. The
    physical plant of the data center will include the campus on which the data center
    facility is located, the physical components inside that facility, and the supports
    that support and connect them.


    One of the first decisions a cloud provider will have to make is whether to build
    or buy a facility to situate the data center. With all decisions, each option
    has benefits and risks.


    In purchasing property and building an entirely new data center, the cloud provider
    gets to dictate every aspect of the facility, ensuring it is absolutely suited
    to the purpose. The provider will have much more control of how the facilities
    are designed, which can lead to better control over physical access to the property
    and buildings as well as optimized performance of the systems within the data
    center. This, however, is often more expensive than purchasing or leasing an existing
    facility. It also requires a long-term plan for continued growth and development
    of the business, which often involves purchasing a larger piece of land than initially
    needed for the first data center, with the'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'understanding that data centers (or additional facilities) might be built on
    that same property in the future to increase capacity as the business grows.


    The alternative, of course, is to purchase or lease an existing facility and retrofit
    it to the needs of the cloud provider. Although this may be less costly, especially
    in the short term, it may limitations ownership would not. For instance, if the
    property is being leased, the owner may not approve of all changes (as a tenant)
    would like to make. Even if the property is owned by the provider, other forces
    may limit the extent and type of changes the provider desires. This is particularly
    true in metropolitan settings, where zoning limitations and municipal building
    codes could be strict and very specific.


    One method of avoiding the restrictions that often come with locating a physical
    plant in an urban setting is to locate the data center in a remote, rural setting.
    There are often less controls on development in these areas, and the itself itself
    always much cheaper. A factor that the provider must consider is the additional
    costs that are quite likely sitting in a business in remote areas, as creating
    robust, redundant utilities for connectivity and power services.


    Whichever method the provider selects, other aspects of the location itself must
    be taken into consideration, such as proximity to customers, ability to attract
    skilled personnel to staff that location, and the location''s propensity for natural
    disasters and civil unrest.


    Regardless of the bill or buy the decision the provider has made, the provider
    has to fill the facility with the physical devices that constitute a data center.
    While the specific vendors and manufacturers of the devices inside a cloud data
    center may differ from provider to provider, there are some general characteristics
    that will be common to most. These include the:


    **Secure Hardware Components** Because of the ubiquitous use of virtualization
    in the cloud environment, hardware devices will need to be configured to ensure
    secure implementation of hypervisors, virtual machines, and virtual OSs. This
    and should include configuring specific BIOS settings on each hardware component
    follow vendor and manufacturer guidance, initializing virtualization management
    toolets on each device, and if cryptoprocessing is used, ensuring the hardware
    has the proper sets for utilization of the Trusted Platform Module (TPM) standard.
    BIOS is the firmware flashed into the processor of a computer, and the TPM standard
    dictates how processors can be used specifically for cryptographic functions.


    The nominal perspective of cloud data center components usually divides the interior
    physical plant into three groups: compute, storage, and networking. Compute nodes
    are the physical devices where customers create virtual machines to process operational
    data. Storage nodes are where the data is securely stored, for either neither-term
    or long-term purposes. Networking is all the equipment used for connecting the
    other nodes—the hardware devices such as routers and switches and the cables that
    connect them.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Business Requirements


    Manage Hardware Configuration As OS baselining (we''ll discuss later in this chapter),
    a template for the secure configuration of each specific device should be constructed,
    and it should be replicated whenever a new device of that particular type is added
    to the environment. The baseline hardware configuration should be saved in a secure
    manner and kept current through the formal change management process (including
    any required patches and updates). This is true for each of the nodes, regardless
    of purpose, including the compute and storage nodes, networking devices, and anything
    used to connect and monitor each of the nodes.


    Set Hardware to Log Events While the granularity and specificity of which system
    events to capture differ from device to device or from customer to customer, the
    provider should ensure that sufficient data related to the activity on each machine
    is saved for possible future use (including incident investigation and forensics).
    The event data should be sufficient to determine exactly what occurred and the
    identity of the users involved in each event (which is known as attribution).


    Determine Compute Components by Customer Need Some customers might not be suited
    to a multtenant environment and would prefer to have their data processed and
    stored in on only devices specifically exclusively assigned to them (the customer).
    While use of stand-alone hosts is outside the norm for cloud data centers, most
    cloud providers will offer the option, at an increased service fee the provider
    will have to deploy and manage these devices and data separately from other customers
    within the same data center, which increases the cost of provision. Unlike stand-alone
    hosts assigned to specific customers, clustered hosts will provide scalable management
    benefits, allowing customers to realize significant cost savings. Both stand-alone
    and clustered hosts must be configured and supported in such a way as to maintain
    high availability. This includes ensuring redundancy of the components themselves
    and services them.


    Configure Remote Administrative Access It is very likely that the provider or
    the customer (or both) will have access to the hardware in order to perform administrative
    function. This access will quite often be from a remote connection and will require
    proper security controls to ensure only authorized users are permitted actions.
    Security enhancements for remote access control might include implementing encryption
    for the access connection, strong authentication for remote users and administrators,
    and enhanced logging on privileged accounts.


    # Cloud Provider Responsibilities: Secure Logical Framework


    In addition to securing the hardware components, the cloud provider must ensure
    that the logical elements are protected. This includes the following:


    Installation of Virtual OSs The provider must ensure that the virtual OSs installed
    in the data center (on virtual or hardware hosts) are configured and installed
    in a secure manner. In addition, as virtual OSs are deployed in the environment,
    virtualization management tools should be installed concurrently, to ensure the
    provider''s ability to monitor the virtual environment for both performance and
    security issues and to enforce configuration'
