- pgno: 237
  md: '# Chapter 8 ■ Operations Elements


    of popular videos in data centers located in Atlanta, London, Moscow, Beijing,
    and Bangalore; when users in those locations request those videos, the data is
    served from their local data center instead of traveling from Brussels. Threats
    to CDNs: DNS may be susceptible to intermediaries, insiders (mainly CDN provider
    administrators), and potentially malware.


    # Resiliency


    There are two general ways for creating data protection in a cloud storage server:
    RAID (redundant array of inexpensive disks) and data dispersion. These two ways
    of creating data protection are very similar and provide a level of resiliency—that
    is, a reasonable amount of assurance although the physical/or logical environment
    might be partially affected by detrimental occurrences (outages, attacks, and
    so), the overall bulk of data will not be lost permanently.


    In most RAID configurations, all data is stored across the various disks in a
    method known as striping. This allows data to be recovered in a more efficient
    manner if one of the drives fails, the missing data can be found by the other.
    In some RAID schemes (there are many, known as RAID 0-10, with different levels
    of performance, redundancy, and integrity), parity bits are added to the raw data
    to recover after a drive failure.


    Data dispersion is a similar technique, where data is sliced into "chunks" (sometimes
    referred to as "shards") that are encrypted with parity bits (called erasure coding
    in cloud dispersion) and then written to various drives in the cloud cluster.
    The parity bits allow recovery of partial data loss (stored on one "drive" or
    device or storage area) by re-creating the lost data from the remaining data plus
    the parity bits/eraser coding. Data dispersion can be seen as equivalent to creating
    a RAID array in a cloud environment. This technique is also referred to as bit
    splitting.


    > NOTE Secret shared hashing (SSMS) is a method of bit splitting that uses the
    three phases: encryption, using an informational dispersal algorithm, and splitting
    the encryption key using the secret sharing algorithm. The fragments are signed
    and distributed to different cloud storage services, making it difficult to decrypt
    without both authorized chosen data and encryption keys.


    Data dispersion provides multiple benefits. Depending on the encryption configuration,
    partial loss of data (one component in the storage cluster failing) will not result
    in total unavailability of the data set; the lost portion can be recovered from
    the remaining components in the cluster, using the parity bits/erasure coding.
    Another benefit is greater security from both physical and logical theft: if one
    device containing dispersed data is taken from the cloud center, or accessed through
    unauthorized means, the chunks/shards on that device will not be meaningful or
    useful to the thief as it will be unreadable of context'
