    what have become the de facto standards for information security and privacy for
    the vast majority of the international community outside the United States. Inside
    the United States, auditors still work primarily with standards and regulations
    such as GLBA, PCI-DSS, SSAE18, and HIPAA. Agencies and governmental bodies continue
    generate these standards and'
