    \n- 我需要在比较中显式转换一些值。\n- 我需要明确告诉 PHPStan 正在使用的一些类是什么，而不是假设存在魔法。\n\n好吧，我将做一些更改并解释为什么它们是必要的。以下是它抱怨的一行代码：\n\
    \n```php\nif (($result->home_score + $result->away_score) >= 13)\n```\n\nPHPStan\
    \ 正在审视这一行，并说：“我不完全确定 `$result->home_score` 或 `$result->away_score` 中可能包含什么，所以你能澄清一下吗？”\n\
    \n我认为这是一个合理的问题。修改后的行可能看起来像这样：\n\n```php\nif ((int)($result->home_score + $result->away_score)\
