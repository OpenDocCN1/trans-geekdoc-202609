    # # Chapter 3


    # ## Mutation Testing


    # ### What Is It?


    Have you ever wondered if there was a way to test the tests you’ve been writing?
    That is essentially what mutation testing is.


    My preferred tool for doing mutation testing in PHP is Infection $^{[1]}$, and
    it defines mutation testing as:


    > Mutation testing involves modifying a program in small ways. Each mutated version
    is called a Mutant. To assess the quality of a given test set, these mutants are
    executed against the input test set to see if the seeded faults can be detected.
    If mutated program produces failing tests, this is called a killed mutant. If
    tests are green with mutated code, then we have an escaped mutant.


    In the case of Infection, it works together with PHPUnit to make informed random
    changes to the code, and then execute the test.


    $^{[1]}$ [https://infection.github.io](https://infection.github.io)'
  - "[PAGE 28]\n\n# 3. MUTATION TESTING\n\n# Why Should I Use It?\n\nMy approach to\
    \ writing unit tests goes something like this:\n\n+   •  What is the scenario\
    \ I am writing a test for?\n•  What are my dependencies?\n•  How do I create those\
    \ dependencies?\n•  How do I give those dependencies to the code I am testing?\n\
    •  What assertions do I need to make?\n•  Does any code need to change to make\
    \ those assertions succeed?\n\nIf I come up with enough scenarios, I start to\
    \ take it for granted that I have both sufficient test coverage and that the tests\
    \ themselves are good.\n\nMutation testing sets about to challenge that second\
    \ assumption. If it mutates your code by doing something like switching `if` (`$foo\
    \ > $bar`) to `if` (`$foo < $bar`) and a test for that portion of code still passes,\
    \ there is a problem with your test.\n\nYes, sometimes tests succeed by accident!\
    \ If you are making heavy use of test doubles, you need a way to detect whether\
    \ the code you are creating doubles for behaves the way the test expects. Otherwise,\
    \ you end up with tests that pass but no longer reflect how the code actually\
    \ works.\n\n# How Do I Use It?\n\nIn our sample app, I wanted to create a test\
    \ for some code which verifies that the ordering of teams in our standings works\
    \ correctly. The test looks like this:\n\n```\n1.    public function it_sorts_standings_correctly():\
    \ void\n2.    {\n3.    \n4.        $unsortedStandings = unserialize(\n5.     \
    \       (string) file_get_contents(__DIR__ . '/../../Fixture/unSortedStandings.txt')\n\
    6.        );\n7.        $expectedStandings = unserialize(\n8.            (string)\
    \ file_get_contents(__DIR__ . '/../../Fixture/sortedStandings.txt')\n9.      \
    \  );\n10.   \n11.   $results = $this->component->sort($unsortedStandings);\n\
    12.   \n13.   self::assertSame($expectedStandings['AC1'], $results);\n14.   }\n\
    ```"
