  mdcn: "\n## 应用背景\n\n出于各种各样的原因，主要与“原型直接转正”这一概念有关，我们没有测试覆盖率。通常来说，对于任何人们频繁使用的网站，这都是一个巨大的问题。但我对于我们要解决的问题而言是一位“领域专家”。这让我可以非常省事地走捷径，并通过视觉验证来确保一切按预期工作。\n\
    \n很有可能，如果你加入一个项目并需要维护一个长期运行的遗留应用程序，你并不具备对应用程序代码及其所解决问题同等的认知深度。凭借我的专业知识，我可以跳过一整套将各种页面输出与基线进行比较的自动化测试。在做出小改动后手动重新加载页面并不是一种很好的实践。但即便如此，在此时，编写一系列自动化测试也不太可能给我们提供对所需部署的充分信心。也不太可能有其他开发者加入这个“团队”来处理它。我知道足够的知识，可以视觉确认事物是否按预期工作。\n\
    \n还是没有测试吗？是的，令我深感羞愧的是，这是一个现在必须纠正的巨大疏漏。每年当我们调整网站以适应即将到来的季节时，总有几处功能会损坏。因为我知道**一切**都应该如何工作，所以这些修复都是快速的改动。如果能到达这样一个阶段——所有损坏的地方都在我将更改推送到生产环境之前被发现——那就太好了。\n\
    \n鉴于某些类型的测试可能帮不上忙，我为什么要费心去添加自动化测试呢？正是因为领域知识常常让我忘记检查所有功能是否都正常工作，而只是通过视觉检查我更改的那一项。\n\
    \n通过添加覆盖那些在生产环境中部署更新代码时必须正常工作的功能的测试，我试图改变以下循环：\n\n- 在本地进行更改\n- 不完美地测试本地更改\n- 将更改推送到生产环境\n\
    - 收到人们发来的“某处坏了”的邮件\n\n在这里失败的代价相当低——这是一个支持爱好的网站。我感受到的任何紧迫感都是我自己制造的；很有可能你自己的情况大不相同。你网络应用程序中的错误或意外行为可能会导致金钱损失、失业，甚至损害其背后的业务。\n\
    \n我坚信让计算机为你执行可重复的任务。作为人类，我们会犯错。我们会跳过步骤。我们会假设事物的状态。计算机只会遵循我们给它的指令。希望这些指令符合我们认为事物应该如何表现的方式。\n\
    \n## 1. 入门\n\n### 我们的工具\n\n使用自动化工具通常就像团队里有另一个人不知疲倦地检查你的工作是否有错误，并建议更改什么。谁不想要这样的帮助呢？\n\
    \n截至本文撰写之时（2021 年春夏），我安装了以下工具；它们在本书中贯穿使用：\n\n- PHP 7.4 和 PHP 8.0\n- PHPStan 0.12.85\n\
    - Infection 0.21.0\n- PHPUnit 8.5.1\n- PostgreSQL 9.6\n\n我在 macOS Big Sur 11.3\
    \ 上进行这项工作，并使用 Homebrew¹ 安装了大部分我需要的依赖项。\n\n我还在使用 PhpStorm² 作为我的编辑器，它与所有三个以测试为中心的工具都有很好的集成，此外还安装了\
    \ PHP Extended Inspections³ 扩展，该扩展提供大量的重构建议以及关于未初始化变量等问题的提醒。\n\n在继续之前，我想提醒你，我选择工具只是我个人的选择。对于我正在使用的每一种工具，都有许多其他选项，而我坚信不要使用给你带来摩擦的工具。如果你想使用\
    \ PHPStan⁴ 进行静态代码分析，尽管去做！如果你想跳过变异测试，那也没问题。不喜欢 PHPUnit 的语法，想用类似 Pest⁵ 的东西？尽管去用。\n\
    \n重点在于开始整合使用那些与以测试为中心的实践互补的工具。你选择工具并不会改变你必须做的事情，但它会影响你对待这些事项的方式。\n\n¹ https://brew.sh/\
    \  \n² https://www.jetbrains.com/phpstorm  \n³ https://phpa.me/php-inspections-extended\
    \  \n⁴ https://phpstan.org  \n⁵ https://pestphp.com  \n\n### 初始设置\n\n本书还假设你正在使用我认为永远改变了\
    \ PHP 开发的工具：Composer⁶。如果你不熟悉它，它是一个用于安装 PHP 包的命令行接口工具。在 2021 年，你很难找到一个不使用 Composer\
    \ 的主要 PHP 库或框架。\n\n我正在使用的一些工具需要你在开始使用之前进行一些配置工作。\n\n⁶ https://getcomposer.org\n\
    \n### PHPStan\n\nPHPStan 的文档可以在 https://phpstan.org 找到。\n\nPHPStan 可以在没有默认配置文件的情况下使用——你只需要通过\
    \ CLI 传递信息给它。为了降低认知负荷，我将直接创建一个默认的 `phpstan.neon` 文件：\n\n```\nparameters:\n   \
    \ level: max\n    paths:\n        - src\n        - tests\n```\n\n### Infection\n\
    \nInfection 的文档可以在 https://infection.github.io 找到。\n\n我选择使用 PHIVE⁷ 安装 Infection，因为我遇到了一些无法妥善解决的\
    \ Composer 问题。\n\n⁷ https://phar.io/\n\n首次运行 CLI 工具时，你会收到类似的消息（部分输出已省略）。\n\n```\n\
    1. > infection.phar\n2.\n3.    Welcome to the Infection config generator\n4.\n\
    5.\n6.\n7.    We did not find a configuration file. The following questions will\
    \ help us\n    to generate it for you.\n8.\n9.\n10.    Which source directories\
    \ do you want to include (comma separated)? [src]:\n11.    [0] bin\n    [1] config\n\
    \    [2] lib\n    [3] logs\n    [4] plugins\n    [5] src\n    [6] templates\n\
    \    [7] tests\n    [8] tmp\n    [9] vendor\n    [10] webroot\n12.    > 6,7\n\
    13.\n14.    Configuration file \"infection.json.dist\" was created.\n```\n\n我针对此工具的配置文件采用与\
    \ PHPStan 相同的策略。这是默认配置文件。我将在书中第一次使用它时解释如何调整它。\n\n```\n{\n    \"source\": {\n \
    \       \"directories\": [\n            \"src\",\n            \"templates\"\n\
    \        ]\n    },\n    \"mutators\": {\n        \"@default\": true\n    }\n}\n\
    ```\n\n## 2. 静态代码分析工具\n\n### 它是什么？\n\n我喜欢通过分享来自可靠来源的定义来介绍编程概念。在这种情况下，来源是维基百科：\n\
    \n> 静态程序分析是对计算机软件在不实际执行程序的情况下进行的分析，这与动态分析相对，动态分析是在程序执行期间进行的分析。在大多数情况下，分析是对源代码的某个版本进行的，在其他情况下，则是针对目标代码的某种形式。\n\
    \n当我最初开始研究静态分析时，令我着迷的是“在不实际执行程序的情况下”这一部分。大约十年前，我尝试创建自己的工具，对 PHP 代码进行静态分析，以确定测试所需的依赖项和语言结构。这很快让我掉进了一个理解如何解析\
    \ PHP 标记和抽象语法树的兔子洞里。\n\n最终，我发现写书和做演讲来教人们做我的简陋工具试图自动完成的事情更容易。\n\n在这本书中，我使用 PHPStan⁸，但我也曾使用过\
    \ Psalm⁹ 达到相同的目的。我知道的其他选项包括 phan¹⁰ 和 exakat¹¹。然而，PHPStan 和 Psalm 绝对是 PHP 领域中“市场份额”最大的两个工具。\n\
    \n作为一个简短的总结，并将本章其余部分的焦点集中起来：静态代码分析提供了一种测试代码而无需运行它的方法。静态分析工具可以查看你的 PHP 代码，并根据与你的变量、函数和类相关的类型推断出它应该如何工作。它可以突出显示你是否可能传递了类型含糊的参数，你是否以意外方式调用函数，识别永远不会执行的代码区域，等等。随着\
    \ PHP 的成熟并添加了类型提示和严格模式等功能，静态分析工具可以帮你更好地理解应用程序代码并提供更有用的反馈。\n\n⁸ https://phpstan.org\
    \  \n⁹ https://psalm.dev  \n¹⁰ https://github.com/phan/phan  \n¹¹ https://exakat.io\n\
    \n### 我为什么要使用它？\n\n当我最初开始查看和使用这些工具时，我很快意识到它们的高层目的是准确确定我所写代码的意图。\n\n当参数类型和返回值类型被添加到语言中时，它以两种方式帮助了我。首先，它消除了一整类旨在回答诸如“你是否得到了一个数组？”等问题的测试。一旦你可以在语言层面上说“这个变量应该是一个整数”，那么\
    \ PHP 解释器就可以替我做那个测试。\n\n随着类型的使用，静态分析工具可以读取我的代码，解析它，然后开始查看调用它的代码。当我开始使用这些工具时，我开始欣赏到有某个东西在关注我做了什么并提出建议：\n\
    \n“我知道你接受一个数组作为这个参数，但看看在某个地方它被赋予了一个整数数组，而在其他地方它却是混合值的数组。你期望的是哪一个？”\n\n“我注意到你在这个对象上调用了这个方法，而你在几行代码之前生成了这个对象。由于背后有一些延迟加载，我无法确定它应该是哪种类型的对象。你能添加一个注解来帮助我弄清楚吗？”\n\
    \n"
