    \n## 第 4 章\n\n# 代码的 Lint 和格式化\n\n我第一次遇到一种“开箱即用”就带有代码格式化程序的编程语言，那是十多年前我刚开始折腾 Go[^1]\
    \ 的时候。令我同样震惊的是看到 Go 社区如此迅速地接受它。考虑到这些年来我在网上看到的关于诸如 JavaScript 中分号的使用以及 PHP 中开括号和闭括号位置等方面的种种争论，这感觉就像是一阵清新的微风。\n\
    \n多年来，我发现代码 Linter（检查器）和 Formatter（格式化器）能做的远不止告诉你“那个开括号位置不对”。它们可以强制执行许多在代码审查中经常出现的实践，并且也可以用于构建系统中为你应用这些更改。我曾经领导的一个\
    \ OSS 项目以令人惊讶的方式大量使用它们。\n\n[^1]: https://golang.org\n\n### 是什么\n\nLinter 和 Formatter\
    \ 通常是开发人员可以在本地运行的 CLI 工具。许多 IDE 也集成了使用它们的方案。充分了解你的 IDE 的里里外外！它可以帮助你自动化许多占编码工作很大比重的重复性工作。\n\
    \n这些工具分析你的代码，通常基于一组可自定义的规则，并识别未遵循这些规则的地方。Formatter 通常与 Linter 结合使用，并使用相同的可配置规则概念来识别然后修改代码。\n\
    \n它们可以通过 CLI 运行的优势在于，它们也可以用作任何持续集成或构建服务的一部分。\n\n### 为什么\n\n多年来，我试图向其他开发人员灌输的一个概念是，我们应该让计算机为我们执行任何重复性任务。这样（或者说根据我的理论），我们就不再需要担心那些任务，而可以将我们的脑力能量用于解决其他问题。\n\
    \n强制推行编码标准，甚至是特定语言结构的使用，意味着你拥有在整个应用程序中保持一致的代码。这种一致性反过来往往能加速理解和调试，并且通常允许你引入其他期望你的代码具有特定外观和行为的其他工具。\n\
    \n鉴于一些 Linter 和 Formatter 可以插入版权声明代码块，甚至告诉你某个代码缺少单元测试（是的，这是可以做到的），你为什么不想拥有一个基本上可以随时待命的同事，他不仅能指出（更重要的是）修复那些可能直到代码审查时才暴露的问题呢？\n\
    \n### 如何做\n\n与我对测试框架、编辑器、静态代码分析器和操作系统的建议类似——选择一个能完成你需要它完成的工作的工具，然后在此基础上发展。没有完美的工具！\n\
    \n对于我自己的项目，我提倡使用 Easy Coding Standard[^2]，因为它允许你使用其他工具创建的定义。在我写这本书时，我使用的是版本 9.3.12。\n\
    \n[^2]: https://github.com/symplify/easy-coding-standard\n\n我也曾使用 PHP_CodeSniffer[^3]\
    \ 和 PHP CS Fixer[^4] 以及其他语言的代码 Linter 和 Fixer；对于我在 Mozilla 编写的 Python 代码，我偏好使用\
    \ Black[^5]。再次强调，使用哪一个并不真正重要。\n\n我们实际该如何使用这些工具？我从另一个项目借用了一套 PHP CS Fixer 规则集，并让它与\
    \ ECS 良好地协作。ECS 项目有一些优秀的文档，指向其他博客文章，介绍其他人如何转换规则集。\n\n对于我的第一次尝试，我让它：\n\n- 强制使用短数组语法\n\
    - 强制使用 PSR-12[^6]\n- 仅应用于我的 src 和 tests 目录\n\n以下是 ecs.php 配置文件的样子：\n\n```php\n\
    <?php\n\ndeclare(strict_types=1);\n\nuse PhpCsFixer\\Fixer\\ArrayNotation\\ArraySyntaxFixer;\n\
    use Symfony\\Component\\DependencyInjection\\Loader\\Configurator\\ContainerConfigurator;\n\
    use Simplify\\EasyCodingStandard\\ValueObject\\Option;\nuse Simplify\\EasyCodingStandard\\\
    ValueObject\\Set\\SetList;\n\nreturn static function (ContainerConfigurator $containerConfigurator):\
    \ void {\n    $parameters = $containerConfigurator->parameters();\n    $parameters->set(Option::PATHS,\
