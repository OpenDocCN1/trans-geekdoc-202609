  md: "\n## Chapter 3: Mutation Testing\n\n### What Is It?\n\nHave you ever wondered\
    \ if there was a way to test the tests you’ve been writing? That is essentially\
    \ what mutation testing is.\n\nMy preferred tool for doing mutation testing in\
    \ PHP is Infection[^1], and it defines mutation testing as:\n\n> Mutation testing\
    \ involves modifying a program in small ways. Each mutated version is called a\
    \ Mutant. To assess the quality of a given test set, these mutants are executed\
    \ against the input test set to see if the seeded faults can be detected. If mutated\
    \ program produces failing tests, this is called a killed mutant. If tests are\
    \ green with mutated code, then we have an escaped mutant.\n\nIn the case of Infection,\
    \ it works together with PHPUnit to make informed random changes to the code,\
    \ and then execute the test.\n\n[^1]: [https://infection.github.io](https://infection.github.io)\n\
    \n### Why Should I Use It?\n\nMy approach to writing unit tests goes something\
    \ like this:\n\n- What is the scenario I am writing a test for?\n- What are my\
    \ dependencies?\n- How do I create those dependencies?\n- How do I give those\
    \ dependencies to the code I am testing?\n- What assertions do I need to make?\n\
    - Does any code need to change to make those assertions succeed?\n\nIf I come\
    \ up with enough scenarios, I start to take it for granted that I have both sufficient\
    \ test coverage and that the tests themselves are good.\n\nMutation testing sets\
    \ about to challenge that second assumption. If it mutates your code by doing\
    \ something like switching `if` (`$foo > $bar`) to `if` (`$foo < $bar`) and a\
    \ test for that portion of code still passes, there is a problem with your test.\n\
    \nYes, sometimes tests succeed by accident! If you are making heavy use of test\
    \ doubles, you need a way to detect whether the code you are creating doubles\
    \ for behaves the way the test expects. Otherwise, you end up with tests that\
    \ pass but no longer reflect how the code actually works.\n\n### How Do I Use\
    \ It?\n\nIn our sample app, I wanted to create a test for some code which verifies\
    \ that the ordering of teams in our standings works correctly. The test looks\
    \ like this:\n\n```php\npublic function it_sorts_standings_correctly(): void\n\
    {\n    $unsortedStandings = unserialize(\n        (string) file_get_contents(__DIR__\
    \ . '/../../Fixture/unSortedStandings.txt')\n    );\n    $expectedStandings =\
    \ unserialize(\n        (string) file_get_contents(__DIR__ . '/../../Fixture/sortedStandings.txt')\n\
    \    );\n\n    $results = $this->component->sort($unsortedStandings);\n\n    self::assertSame($expectedStandings['AC1'],\
    \ $results);\n}\n```\n\nThis seems like a straightforward test. Can mutation testing\
    \ reveal that our expectations are wrong?\n\nBefore we can get to that point,\
    \ there was some configuration work I had to do. First, I needed to create the\
    \ configuration file for Infection itself. It's named `infection.json` and stored\
    \ in the root directory for the project:\n\n```json\n{\n    \"source\": {\n  \
    \      \"directories\": [\n            \"src\",\n            \"templates\"\n \
    \       ]\n    },\n    \"logs\": {\n        \"text\": \"infection.log\"\n    },\n\
    \    \"mutators\": {\n        \"@default\": true\n    },\n    \"tmpDir\": \"tmp\"\
    ,\n    \"testFramework\": \"phpunit\"\n}\n```\n\nNext, I made sure I had my PHPUnit\
    \ configuration file set up the way I wanted it. It's named `phpunit.xml` and\
    \ it goes in the root directory for the project as well:\n\n```xml\n<phpunit bootstrap=\"\
    tests/bootstrap.php\">\n    <listeners>\n        <listener class=\"\\Cake\\TestSuite\\\
    Fixture\\FixtureInjector\">\n            <arguments>\n                <object\
    \ class=\"\\Cake\\TestSuite\\Fixture\\FixtureManager\" />\n            </arguments>\n\
    \        </listener>\n    </listeners>\n    <testsuites>\n        <testsuite name=\"\
    unit\">\n            <directory>tests</directory>\n        </testsuite>\n    </testsuites>\n\
    </phpunit>\n```\n\nThe framework I am using provided the `bootstrap.php` file\
    \ for me. Check the documentation for your framework for more details, or if you\
