    # # Chapter


    4


    # Linting and Formatting Your Code


    The first time I came across a programming language that came “out of the box”
    with a code formatter was when I first played around With Go$^{[1]}$ more than
    a decade ago. I was equally shocked to see how the Go community embraced it so
    quickly. Given all the online arguments I had seen over the years about things
    like semicolon usage in JavaScript and where to put opening and closing braces
    in PHP, it felt like a small breath of fresh air to see it.


    Over the years, I discovered code linters and formatters can do a lot more than
    tell you “that opening brace is in the wrong place.” They can enforce many practices
    that often come up in code reviews and can also be used in build systems to apply
    those changes for you. An OSS project I used to lead made heavy use of them in
    ways that would surprise you.


    [1] https://golang.org'
  - '[PAGE 38]


    # 4. LINTING AND FORMATTING YOUR CODE


    # What


    Linters and formatters are usually CLI tools that can be run locally by developers.
    Many IDEs also have integrations for using them. Learn your IDE inside and out!
    It can help automate a lot of the repetitive work that makes up so much of coding.


    These tools analyze your code, usually based on a customizable set of rules, and
    identify where these rules have not been followed. Formatters are often combined
    with a linter and use the same concept of configurable rules to identify and then
    modify the code.


    The strength of them being run via a CLI is that they can also be used as part
    of any continuous integration or build service.


    # Why


    A concept I have tried to instill in other developers over the years is that we
    should ask the computer to do any repetitive tasks for us. That way (or so my
    theory goes), we can stop worrying about those tasks and use our mental energy
    to solve other problems.


    The ability to enforce a coding standard or even the use of specific language
    constructs means you have code that is consistent across the entire application.
    That consistency, in turn, tends to speed up comprehension, debugging, and often
    allows you to introduce other tools that are expecting your code to look and behave
    in a specific way.


    Given that some linters and formatters can insert copyright documentation blocks
    or even tell you that you are missing a unit test for that code (yes, that is
    something that can be done), why would you not want to have what is essentially
    an on-call coworker who can point out (and more importantly) fix problems that
    might not have surfaced until code review time?


    # How


    Much like my recommendations for testing frameworks, editors, static code analyzers,
    and operating systems—pick one that does the job you need it to and go from there.
    There is no perfect tool for this!


    For my own projects, I advocate using Easy Coding Standard[2] as it allows you
    to use definitions created by other tools. As I write this book, I am using version
    9.3.12.


    [2] https://github.com/symplify/easy-coding-standard'
