    \    ->call('configure', [[\n        'style' => 'annotation'\n    ]]);\n```\n\n\
    ```\n1. 3) tests/TestCase/Model/Table/GamesTableTest.php\n2.\n3. ```diff begin\
    \ diff```\n4. --- Original\n5. +++ New\n6. @@ -15,7 +15,10 @@\n7. ```\n8. ```class\
    \ GamesTableTest extends TestCase\n9. ```{\n10. - ```public function testGetWeeklyResult():\
