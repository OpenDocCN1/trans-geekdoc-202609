    > Chris Hartjes has been helping people build PHP applications of all shapes and
    sizes since 1998 with a focus on testing them since 2005. In addition to writing
    about testing, he’s contributed to open-source projects and traveled to speak
    at conferences around the world.


    He currently works from home in the snowy wilds of Lucan-Biddulph, Ontario, Canada.


    # Learn how a Grumpy Programmer approaches improving his own codebase, including
    all of the tools used and why.


    I feel that testing, as a concept, is hard to explain to beginning programmers:
    “we are going to write code that is going to make sure your other code works as
    expected”. The assumption that underlies all this is that you already understand
    how to write computer programs in your chosen language! This makes it very difficult
    to teach to beginner or inexperienced programmers. When you combine this with
    how PHP does not force any particular structure on you, you have an environment
    where only the folks who are really motivated end up learning about testing.


    The Complementary PHP Testing Tools Cookbook is my way to try and provide additional
    tools to PHP programmers who already have experience writing tests but want to
    improve. I believe that by learning the skills (both technical and core) surrounding
    testing you will be able to write tests using almost any testing framework and
    almost any PHP application.


    Throughout this book, I am going to show you how I am adding targeted test coverage
    to my oldest, still-in-use PHP-based web application. It has been running since
    2004, with me updating the base framework, CakePHP, every few years.'
  md: '

    ## 6. What’s Next?


    ### Editor/IDE Integration


    As mentioned before, I tend to use PhpStorm when doing PHP coding work. Out-of-the-box,
    it comes with a lot of tooling that makes writing PHP code easier. But its real
    strength is a plugin system that allows third parties to extend functionality
    and integration points to allow the use of CLI tools from inside the IDE.


    If an external tool can be easily used within the IDE, spend the time to configure
    it. I like the ability to click a button to run a PHPUnit test case instead of
    always changing focus back to a terminal shell.


    Reducing friction in your tooling is critical. I am always looking at how other
    developers accomplish similar tasks. Video pairing sessions where I watch people
    really leverage their tools are a great way to re-examine and evaluate what I
    am doing.


    ### Containerized Development Environments


    In my evaluation of Visual Studio Code[^1] I was encouraged by long-time online
    friend Alvaro Videla[^2] to take a look at the Remote Containers[^3] extension,
    which provides the glue many other editors are missing to allow you to create
    and use containerized development environments using Docker[^4]. It took me less
    than 30 minutes from reading the first bits of documentation to having a working
    development environment that works hand-in-hand with Visual Studio.


    I also am aware you can do similar things with Docker and PhpStorm, but my own
    experiences were not as smooth as what Code provided. Making sure all developers
    on a project have a consistent, repeatable development environment can go a long
    way toward eliminating the “works for me” category of bugs.


    [^1]: https://code.visualstudio.com

    [^2]: https://twitter.com/old_sound

    [^3]: https://code.visualstudio.com/docs/remote/create-dev-container

    [^4]: https://docker.com


