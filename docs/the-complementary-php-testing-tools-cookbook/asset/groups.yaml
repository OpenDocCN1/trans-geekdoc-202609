    \n一旦有了某些测试就位，你就需要开始思考到达最终步骤“我的测试通过了吗？”所需的所有步骤。就本书中使用的示例项目而言，流程大致如下：\n\n- 从 GitHub\
    \ 拉取任何更改并将其应用到我的工作区。\n- 创建一个全新的测试数据库并填充数据。\n- 运行 `composer install` 以确保预期的依赖项到位。\n\
    - 运行我的测试。\n\n如果测试通过，我会在该应用程序的生产服务器上进行手动部署。\n\n如果我想要自动化这个过程怎么办？首先，我会创建一个可以在本地用一条命令完成这些操作的东西。对于使用\
    \ Composer 的项目，我可以在 `composer.json` 文件的 `scripts` 部分添加内容。\n\n但首先，我会创建一个包含所有所需步骤的\
    \ `bash`[^1] 脚本。对于自动合并主分支更改的步骤，我持谨慎态度，因为这可能需要我在运行测试之前修复冲突或解决其他与 Git 相关的问题。\n\n\
    ```bash\n#!/usr/bin/env bash\nPGPASSWORD=<redacted> psql -h 127.0.0.1 -U <redacted>\
    \ ibl_test < ibl_stats.dump\ncomposer install\nvendor/bin/phpunit tests/\n```\n\
    \n我已将此文件添加到项目中，命名为 `scripts/test-full.sh`。\n\n对于这个项目，我会频繁获取生产数据库的快照，并在本地使用它们，始终将测试数据库重置为已知状态。然后，我使用\
    \ Postgres 的 CLI 工具导入该快照。接下来，我安装项目的所有依赖项，随后运行测试。\n\n我已验证该脚本在本地可以运行，并且最终我的测试是通过的。\n\
    \n[^1]: https://www.gnu.org/software/bash\n\n### 5. 持续集成\n\n下一步是更新我们的 `composer.json`\
    \ 文件，以便通过命令 `composer test-full` 执行此脚本。我在文件中当前定义的最后一项之后添加了以下内容：\n\n```json\n\"\
    scripts\": {\n    \"test-full\": \"scripts/test-full.sh\"\n}\n```\n\n我已验证命令 `composer\
    \ test-full` 现在可以运行我创建的 bash 脚本。我现在只需一条命令就可以完成所有工作。\n\n#### 构建服务器\n\n理想情况下，我还希望有一个自动系统来遵循这些步骤。这类系统通常被称为“构建服务器”或“持续集成”服务器。无论叫什么名字，它都是一个根据事件或触发器执行一系列用户定义命令的系统。\n\
    \n我首次接触持续集成系统是通过学习如何使用 Jenkins[^2] 来运行一个幻想体育平台 Python 代码的测试，该代码负责生成所有参与者的积分。Jenkins\
    \ 仍然是那些希望围绕构建和部署流程实现自动化的用户的好选择。\n\n如今，我使用 GitHub Actions[^3] 来完成这类工作。由于我所有的编码项目都使用\
    \ GitHub，利用它们提供的集成功能是合乎逻辑的。\n\n由于 GitHub Actions 与语言无关，你必须告诉它去做很多配置工作和软件包安装，这些工作你为了启动本地开发环境已经做过了。\n\
    \n它们的文档非常好；我建议你阅读它以了解正在发生的事情。这是我项目的 GitHub Actions 配置文件。别担心，我会解释其中发生的事情：\n\n[^2]:\
    \ https://www.jenkins.io\n[^3]: https://github.com/features/actions\n\n```yaml\n\
    1. name: Grumpy CI\n2. on: [push, pull_request]\n3. jobs:\n4.   CI:\n5.     runs-on:\
    \ ubuntu-latest\n6.     services:\n7.       postgres:\n8.         image: postgres:10.8\n\
    9.         env:\n10.          POSTGRES_USER: <redacted>\n11.          POSTGRES_PASSWORD:\
    \ <redacted>\n12.          POSTGRES_DB: ibl_stats_test\n13.      ports:\n14. \
    \       - 5432:5432\n15.      options: --health-cmd pg_isready --health-interval\
    \ 10s --health-timeout 5s --health-retries 3\n16.      steps:\n17.        - name:\
    \ Checkout\n18.          uses: actions/checkout@v2\n19.          with:\n20.  \
    \          lfs: true\n21.        - name: Checkout LFS objects\n22.          run:\
    \ git lfs checkout\n23.        - name: Setup PHP\n24.          uses: shivammathur/setup-php@v2\n\
    25.          with:\n26.            php-version: 7.4\n27.            extensions:\
    \ mbstring, intl, pdo_pgsql\n28.        - name: Get composer cache directory\n\
    29.          id: composer-cache\n30.          run: echo \"::set-output name=dir::$(composer\
    \ config cache-files-dir)\"\n31.        - name: Cache composer dependencies\n\
    32.          uses: actions/cache@v2\n33.          with:\n34.            path:\
    \ ${{ steps.composer-cache.outputs.dir }}\n35.            key: ${{ runner.os }}-composer-${{\
    \ hashFiles('**/composer.lock') }}\n36.            restore-keys: ${{ runner.os\
    \ }}-composer-\n37.        - name: Install dependencies\n38.          run: composer\
    \ install --no-progress --prefer-dist --optimize-autoloader\n39.        - name:\
    \ Seed DB\n40.          run: PGPASSWORD=<redacted> psql -U <redacted> ibl_test\
    \ < ibl_stats.dump\n41.        - name: Run PHPUnit tests\n42.          run: vendor/bin/phpunit\
    \ tests\n```\n\n所有这些工作都在某种容器化环境中进行。\n\n从顶部开始，我赋予此流程一个名称，并告诉它我希望它响应任何与 GitHub 相关的推送事件或拉取请求。\n\
    \n接下来，我告诉它我要使用最新可用的 Ubuntu[^4] Linux 版本。GitHub 也会安装一组默认软件包。其他软件包的安装可以在后续步骤中进行。\n\
    \n定义好这些之后，我必须声明我想使用他们的一个 Postgres 容器，并指定我需要的某些配置值，同时添加一个健康检查选项，使整个流程暂停，直到 Postgres\
    \ 容器启动并运行且准备好接受连接。\n\n然后是一系列我希望遵循的步骤。第一步是检出正在推送的代码或拉取请求涉及的代码。\n\n下一步是针对此项目特有的，但你可能会有兴趣。你是否有一些大文件（例如，Postgres\
    \ 数据库转储文件）需要纳入版本控制？GitHub 不允许你添加那么大的文件。\n\n幸运的是，当 GitHub 拒绝接受包含我数据库转储的推送时，它指引我去查看\
    \ Git Large File Storage[^5] 项目并使用它替代。在进行了一些仓库重置和回溯工作后，我成功地将数据库转储文件添加到了仓库中。文件\
    \ tbl_stats.dump 实际上是一个文本文件，包含一些元数据和指向文件下载位置的指针。\n\n检出文件后，我要求安装 PHP，指定版本以及要安装的其他扩展。\n\
    \n接下来，我查找 Composer 的缓存位置，然后告诉 Composer，嗯，使用那个缓存！在那之后，我安装所有与 composer 相关的依赖项。\n\
    \n接着，我通过将该数据库转储的内容应用到我新创建的 Postgres 数据库来进行一些数据库种子填充。\n\n最后一步是让构建系统运行我的 PHPUnit\
    \ 测试。\n\n现在，GitHub 遵循我在本地执行的相同步骤，以便我可以继续集成代码，并希望减少进入生产环境的 bug 数量。\n\n我希望你可以将我提供的示例\
    \ GitHub Action 文件作为你自己构建系统的模板。基本上，几乎任何你为了到达可以运行测试的状态而需要做的事情，都可以在这里重复执行。\n\n[^4]:\
    \ https://ubuntu.com\n[^5]: https://git-lfs.github.com\n\n## 6\n# 接下来做什么？\n\n\
    就像几乎所有与你 PHP 代码的自动化测试编写相关的事情一样，这是一段不会停止的旅程。我总是在学习新事物！我所有工作的目标目标是：\n\n- 开发人员使用\
    \ TDD 创建或更新功能。\n- CI 系统获取他们的补丁，并针对补丁运行综合测试套件。\n- 如果所有测试通过，补丁将被合并并部署到生产环境。\n\n\
    达到这种状态可能需要大量工作；某些代码库和应用程序可能永远无法达到那里。然而，我们永远不应停止尝试使用那些鼓励代码中清晰意图、在用户看到问题之前提醒我们问题以及允许自信部署的工具。\n\
    \n在这一部分，我想简要谈谈我最近注意到的一些与测试互补的工具方面的事情。它们不需要整整一章的篇幅，但我认为花一点时间深入了解一下是值得的。\n\n"
