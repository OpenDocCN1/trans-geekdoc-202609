    \ diff```\n20.\n21. Applied checkers:\n22.\n23. * PhpCsFixer\\Fixer\\PhpUnit\\\
    PhpUnitTestAnnotationFixer\n```\n\n# 何时使用\n\n根据我的经验，使用代码 Linter 和格式化工具有三个合适的时机：\n\
    \n## 开发期间\n\n如果某个项目没有强制要求，最常见的做法是让开发者在工作期间使用 Linting 和格式化工具，并希望在提交和推送代码进行审查或合并之前使用它们。\n\
    \n我在那些未强制要求使用这些工具的项目中就是这么做的。\n\n## 使用版本控制之前\n\n如果你使用的版本控制系统具有“pre-commit hook”的概念，我强烈建议你阅读你的\
    \ VCS 文档，了解如何使用它们并设置一个。\n\n这样，如果你忘记运行 Linter，它会在你的 VCS 工具将代码推送到仓库之前自动执行。\n\n##\
    \ 构建或持续集成期间\n\n这是我最喜欢的让 Linting 工具运行的时机，Linter 报告的任何问题都会被视为构建失败。同样，这也依赖于你拥有一个可以定制以便从命令行运行任意命令的构建系统或持续集成系统。\n\
    \n如果你使用的是像 GitHub Actions^[7]^ 这样的东西，你可以找到如何操作示例。在本书稍后介绍如何使用持续集成系统的章节中，你大概可以猜出在哪里添加\
    \ Linting 步骤。\n\n^[7]^ GitHub Actions: https://github.com/features/actions\n\n\
    # 第 5 章\n\n## 持续集成\n\n我非常支持让计算机为我执行重复性的操作。这让我能腾出注意力去解决其他问题，而不是记住一系列步骤，其中漏掉任何一步都可能导致失败。\n\
    \n大多数编程项目面临的问题之一是找到一种方法，以最小的摩擦力集成代码更改。在开发端或工具创建端，没有任何无痛且无需努力的方法可以做到这一点。\n\n在我撰写本文时（2021\
    \ 年春天），有两种主流的代码集成方法。我称之为“带标志的主干集成”和“通过 Pull Request 集成”。\n\n### 通过 Pull Request\
    \ 集成\n\n由于大量开发者使用 GitHub（讽刺的是，这是一个用于分布式版本控制系统的集中式基于 Web 的工具集），阅读本文章的大多数人熟悉“Pull\
    \ Request”的使用。\n\n对于不熟悉的人来说，这里有一个高层级的解释：\n\n开发者创建受版本控制的代码的一个分支，并在该分支中进行一些工作。一旦准备好分享，他们使用工具创建“Pull\
    \ Request”，这是一种通知，表示有一些更改需要审查。通常来说，你是在将开发者在他们自己的分支上的工作与部署到生产环境的主分支进行比较。\n\n审查\
    \ Pull Request 的人可以看到更改内容并对这些更改发表评论。Pull Request 方法的一个缺点是，如果代码库本身变化迅速，长期进行的工作很容易过时。反过来，这迫使开发者做大量工作，不断合并其他开发者已应用到主分支的更改。\n\
    \n这种方法通过将压力施加在工具上，通过提供减少管理所有这些更改摩擦力的工具来实现平滑集成。\n\n### 通过标志集成\n\n随着更多人体验到以 Pull\
    \ Request 为核心的集成计划的一些痛苦和挫折，其他程序员一直倡导不为工作使用单独的分支。相反，他们在部署的主分支上工作，并使用“功能标志”或其他技术，确保新代码仅在特定条件下使用。\n\
    \n功能标志或其他配置用户可访问代码的方式，可以复杂到一个定义这些值的行政系统，或者像围绕代码块的简单条件语句。\n\n我在本书中使用的项目更多地采用“与主干集成”策略，通过几个标志来改变显示的内容。协助的其他开发者对他们的进行\
    \ Pull Request，因为他们对代码库的理解不如我深。\n\n这种方法将集成压力放在开发者身上，以确保代码应执行的条件是正确的。\n\n无论你选择哪种方法，执行任一方法的过程都是成熟的，并且有很多可用资源可以展示如何做。\n\
    \n### 自动化集成与测试\n\n### 本地自动化\n\n我强烈倡导对 Web 应用关键功能进行自动化测试的原因之一是，集成并部署的过程可能会非常有压力，尤其是在部署过程部分为手动操作的环境中。\n\
    \n"
