  mdcn: "\n\n## 谁应该使用它？\n\n开发人员在进行编码工作时应该使用静态代码分析工具，最好是在他们尝试将代码提交到版本控制系统之前。\n\n如果你有一些不太情愿使用工具的开发人员，你可以始终依赖版本控制系统的提交钩子（commit\
    \ hooks），并将其添加在那里。我自己的建议是将其创建为预提交钩子（pre-commit hook）——除非静态分析工具表示满意，否则不允许任何提交通过！\n\
    \n请记住，使用此类工具的任何场景都需要配合代码审查，以确保你可以用来让 PHPStan “满意”的一些技术被正确应用。\n\n## 我该如何操作？\n\n\
    PHPStan 的配置文件（名为 `phpstan.neon`）包含最少数量的选项：\n\n```yaml\nparameters:\n    bootstrapFiles:\n\
    \        - config/bootstrap.php\n    level: max\n    paths:\n        - src\n \
    \       - tests\n```\n\nPHPStan 的文档涵盖了这些选项以及更多内容，但我想谈谈我正在使用的选项。\n\n该应用程序的框架（CakePHP[6]）使用一个引导文件，因此我告诉\
    \ PHPStan 使用它，这样它就能看到框架相关的配置值以及我可能正在使用的任何自定义值。根据底层框架的不同，我可能根本不需要这个。\n\n[5] https://docs.phpdoc.org/latest/guide/guides/docblocks.html\n\
    \n[6] https://cakephp.org\n\n我还可以告诉它我想让它扫描哪些路径。我绝对不希望对通过 Composer 安装包创建的 `vendor`\
    \ 目录中的第三方代码进行任何分析。\n\nPHPStan 还使用了“分析级别”的概念。这告诉 PHPStan 在分析你的代码时应该有多严格。我选择了 `max`（这是\
    \ 7 的别名），范围是 0 到 7。默认情况下，它使用的是 0。如果我选择级别 0 会怎样？\n\n```\nNote: Using configuration\
