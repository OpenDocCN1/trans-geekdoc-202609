    ## 6. 接下来是什么？


    ### 编辑器/IDE 集成


    如前所述，在进行 PHP 编码工作时，我倾向于使用 PhpStorm。开箱即用的情况下，它自带了许多工具，使编写 PHP 代码变得更加容易。但其真正的优势在于其插件系统，该系统允许第三方扩展功能并集成集成点，以便在
    IDE 内部使用 CLI 工具。


    如果外部工具可以轻松地在 IDE 内使用，就花点时间去配置它。我更喜欢那种点击按钮即可运行 PHPUnit 测试用例的能力，而不必总是将焦点切换回终端 shell。


    减少工具使用中的摩擦至关重要。我总是观察其他开发者是如何完成类似任务的。视频结对会话——其中我观看他人如何充分利用他们的工具——是重新审视和评估我所做之事的绝佳方式。


    ### 容器化开发环境


    在我评估 [Visual Studio Code](https://code.visualstudio.com)[^1] 时，我受到长期在线好友 Alvaro
    Videla[^2] 的鼓励，去查看 [Remote Containers](https://code.visualstudio.com/docs/remote/create-dev-container)[^3]
    扩展，该扩展提供了许多其他编辑器所缺失的粘合剂，允许你使用 [Docker](https://docker.com)[^4] 创建和使用容器化开发环境。从阅读文档的第一部分到拥有一个与
    Visual Studio 协同工作的可用开发环境，我花了不到 30 分钟。


    我也知道你可以使用 Docker 和 PhpStorm 做类似的事情，但我自己的体验没有 Code 提供的那么顺畅。确保项目中的所有开发者拥有一致且可重复的开发环境，可以在消除“在我这里能运行”类
    bug 方面大有帮助。


    [^1]: https://code.visualstudio.com

    [^2]: https://twitter.com/old_sound

    [^3]: https://code.visualstudio.com/docs/remote/create-dev-container

    [^4]: https://docker.com


    ![](img/ca14a770dd3609a915e3031a0db42a46_53_0.png)


    > Chris Hartjes 自 1998 年起一直帮助人们构建各种大小和形状的 PHP 应用程序，自 2005 年起重点关注对其进行测试。除了撰写关于测试的文章外，他还参与了开源项目，并周游各地在会议上演讲。


    他目前住在加拿大安大略省 Lucan-Biddulph 的雪域荒野中的家中。


    # 了解一位愤世嫉俗的程序员如何改进他自己的代码库，包括使用的工具及其原因。


    我觉得“测试”这一概念很难向初级程序员解释：“我们将编写确保你其他代码按预期工作的代码”。所有这些背后的假设是你已经知道如何使用所选语言编写计算机程序！这使得向初学者或经验不足的程序员教授它变得非常困难。当你将此与
    PHP 不强制要求任何特定结构相结合时，你就拥有了一个只有真正有动力的人才会学习测试的环境。


    《互补的 PHP 测试工具烹饪书》是我试图为那些已经拥有编写测试经验但希望提升水平的 PHP 程序员提供额外工具的一种方式。我相信，通过学习测试相关的技能（无论是技术还是核心技能），你将能够使用几乎任何测试框架和几乎任何
    PHP 应用程序来编写测试。


    在整个书中，我将向你展示我如何为我最古老的、仍在使用基于 PHP 的 web 应用程序添加有针对性的测试覆盖。它自 2004 年以来一直在运行，而我每隔几年更新一次基础框架，CakePHP。


    '
