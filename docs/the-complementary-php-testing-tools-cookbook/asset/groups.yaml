  - "[PAGE 15]\n\n# ### Who Should Be Using It?\n\nDevelopers should be using static\
    \ code analysis tools while doing their coding work, hopefully before they attempt\
    \ to commit their code to their version control system.\n\nIf you have some reluctant\
    \ developers, you could always rely on the commit hooks for your version control\
    \ system and add it there. My own recommendation is to create it as a pre-commit\
    \ hook-no commit goes through unless the static analysis tool is happy!\n\nJust\
    \ remember that any use of a tool like this also needs to be accompanied by code\
    \ reviews to make sure that some of the techniques you can use to make PHPStan\
    \ “happy” are being correctly applied.\n\n# ## How Do I Do It?\n\nThe configuration\
    \ file for PHPStan (called phpstan.neon) contains the minimal amount of options:\n\
    \n```\n```yaml\nparameters:\n    bootstrapFiles:\n        - config/bootstrap.php\n\
    \    level: max\n    paths:\n        - src\n        - tests\n```\n```\n\nPHPStan’s\
    \ documentation covers these options and more, but I want to talk about the ones\
    \ I am using.\n\nThe framework for this application (CakePHP⁶) uses a bootstrap\
    \ file, so I tell PHPStan to use it so it can see things like framework-related\
    \ configuration values and any custom values I might be using. Depending on the\
    \ underlying framework, I might not need this at all.\n\n[5] [https://docs.phpdoc.org/latest/guide/guides/docblocks.html](https://docs.phpdoc.org/latest/guide/guides/docblocks.html)\n\
    \n[6] [https://cakephp.org](https://cakephp.org)"
