    # # Chapter


    ## 1


    # ## Getting Started


    **Audience**


    The topic of testing is tough to explain to people who are just learning to program.
    “I''m going to write code that tests other code I write? That seems really hard!”
    I have yet to see a tutorial that teaches programmers how to use a programming
    language from a test-centric position.


    With that in mind, I wrote this book for PHP programmers who already have experience
    writing tests but want to improve. I have been doing this since 2005 and still
    go through the process of learning new things and reinforcing older habits that
    can lead to better outcomes.


    My book “The Grumpy Programmer’s Guide To Testing PHP Applications” (available
    via LeanPub^[1] or php|architect^[2]) goes over the basic technical and core skills
    you need to learn, and hopefully master, to make your tests effective and turn
    writing tests into just something you do instead of a rare event.


    +   [1] https://leanpub.com/grumpy-guide

    [2] https://phpa.me/grumpy-testing-book'
  - '[PAGE 8]


    # ### 1. GETTING STARTED


    Throughout this book, I am going to show you how I am adding targeted test coverage
    to my oldest, still-in-use PHP-based web application. It has been running since
    2004, with me updating the base framework (CakePHP³) every few years.


    # ## Why Make All This Effort?


    The application began as a PHP 5 codebase and has been updated over the years.
    It now runs fine on PHP 7.4 and hopefully PHP 8.0 soon. It’s extremely rare in
    the current phase of the software industry to work on an application for so long.
    The skillset needed to build something from scratch, and the skillset needed to
    maintain an existing codebase are quite different! I believe that more and more
    developers understanding this has led to all these great tools available in multiple
    languages, making testing and code analysis easier.


    After all, if you’re going to build something and never touch it again after deployment,
    then you probably have no need for automated tests and code linting and static
    code analysis. However, if you are building something that is going to be the
    long-lived core of a business or project, it is worth exploring automated testing,
    code linting, and static code analysis to find out how they can help you.


    # ## The Application


    The application itself is a website for a league that uses a tabletop baseball
    simulation game to play out a full season using rosters made up of players from
    existing Major League Baseball teams. We make the game ourselves and distribute
    it to league members and other interested parties for free.


    When it comes to verifying the application is behaving as expected, some of the
    things that can be visually confirmed are:


    +   - league standings

    - scheduled games

    - pitching rotations teams will use

    - injuries


    To be perfectly clear–knowledge of the sport of baseball is not a requirement
    to under-stand the approach I am using in this book! It certainly helps, but the
    key point I want to emphasize is that without some domain knowledge of the problem
    you are trying to solve you might create tests that have no impact.


    > ³https://cakephp.org'
