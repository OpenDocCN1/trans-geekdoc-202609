- pgno: 50
  md: '# ### 5. CONTINUOUS INTEGRATION


    All this work happens inside some kind of containerized environment.


    Starting at the top, I give this process a name and tell it I want it to react
    to any GitHub-related push event or pull request.


    Next, I tell it that I want to use the latest available version of Ubuntu[⁴] Linux.
    GitHub installs some set of default packages as well. Adding other packages can
    be done in later steps.


    With that defined, I have to declare I want to use one of their Postgres containers
    and specify some configuration values I need, along with adding an option for
    a health check that causes the whole process to pause until the Postgres container
    is up and running and ready to accept connections.


    Then there are a series of steps I want to be followed. The first is to check
    out the code that is either being pushed or subject to a pull request.


    The next step is unique to this project but might be of interest to you. Do you
    have large files (like, for instance, a Postgres database dump) that needs to
    be under version control? GitHub doesn''t let you add files that large.


    Luckily for me, when GitHub refused to accept a push that contained my database
    dump, it directed me to take a look at the Git Large File Storage[⁵] project and
    use that instead. After doing some repository reset and rewind work, I successfully
    added the database dump file to the repo. The file tbl_stats.dump is actually
    a text file that contains some metadata and a pointer to where the file can be
    downloaded.


    With the files checked out, I ask for PHP to be installed, specifying the version
    and any other extensions to be installed.


    Next, I find out where Composer''s cache is, followed by telling Composer to,
    well, use that cache! After that, I install all of my composer-related dependencies.


    I follow that up by doing some database seeding by applying the contents of that
    database dump to my freshly-created Postgres database.


    The final step is to ask the build system to run my PHPUnit tests.


    Now, I have GitHub following the same steps I follow locally so I can continue
    to integrate my code and, hopefully, have fewer bugs making it into production.


    I hope you can use my sample GitHub Action file as a template for your own build
    systems. Basically, almost anything you find yourself doing just to get to the
    point where you can run your tests can be duplicated here.


    +   - [⁴] https://ubuntu.com

    - [⁵] https://git-lfs.github.com'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Chapter

    ## 6

    # What’s Next?


    Like with almost everything associated with writing automated tests for your PHP
    code, it''s a journey that won''t stop. I learn new things all the time! My target
    goal for all of my work is this:


    +   * Developers use TDD to create or update features.

    * CI systems take their patches and run a comprehensive test suite against them.

    * If all the tests pass, the patch is merged, and deployed to production.


    Getting to this state can take a lot of work; some code bases and applications
    may never get there. However, we should never stop trying to use tools that encourage
    clear intent in code, alert us of problems before the users see them, and allow
    for confident deployments.


    In this section, I wanted to talk briefly about some things I have noticed recently
    in regards to tools that complement testing. They don''t need an entire chapter,
