- pgno: 31
  md: 'To be completely transparent: the code I was asking it to look at has pretty
    much no automated tests other than the one that checks the sorting and some functional-style
    tests that check whether content shows up on the page where I expect.


    What information in that summary should we be worried about? Because we don’t
    have 100% code coverage for StandingsComponent.php, it’s hard to come up with
    a good answer. What answers the tool provides can lead us toward figuring out
    where to focus our attention.


    # Mutation Score Indicator (MSI)


    You want this value to be as high as possible. It represents the percentage of
    mutations that were caught by your tests. To understand what this means, the process
    is like this:


    +   - change something in the code you are analyzing

    - run the tests that “cover” that code

    - if the tests still pass, you have a mutant that was not caught


    13% is a very low number and represents that our existing tests did not find most
    of the mutations, meaning our tests happily passed despite changes that should’ve
    been found. Not great!


    # Mutation Code Coverage


    This value should be close to your existing code coverage. I have no idea what
    my current code coverage is, but seeing that it is 98% is very interesting. Given
    the spread between this value and the MSI, it means I need a lot more tests.


    # Covered Code Mutation Score Indicator


    This is the value to really look at – it shows what the MSI is for code that was
    actually covered by tests. Now, because I filtered things out and told Infection
    to only look at one file, this should map exactly to the MSI. Again, this number
    is really low.


    # Logging Of Mutants


    In my configuration file, I asked Infection to write what it was doing to a file
    called infection.log, which is being written into the root directory of our application.
    Because I only really have that one test for the sorting method, let me search
    for any mutations that were done to that code:'
