- pgno: 13
  md: '# Chapter


    2


    Static Code Analysis Tooling


    # What Is It?


    I like to introduce programming ideas by sharing a definition from a reliable
    source. In this case, Wikipedia:


    > Static program analysis is the analysis of computer software that is performed
    without actually executing programs, in contrast with dynamic analysis, which
    is analysis performed on programs while they are executing. In most cases the
    analysis is performed on some version of the source code, and in the other cases,
    some form of the object code.


    The part of this that intrigued me when I first started looking into it was the
    “without actually executing programs” part. About a decade ago, I tried creating
    my own tool that would perform static analysis of PHP code to figure out dependencies
    and language constructs you needed to test. It quickly led me down a rabbit hole
    of figuring out how to parse PHP tokens and abstract syntax trees.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 2. STATIC CODE ANALYSIS TOOLING


    In the end, I figured out it was easier to write books and give talks about teaching
    people to do what my poorly-built tool was trying to do in an automated fashion.


    In this book, I am using PHPStan${ }^{[1]}$ but I have also used Psalm${ }^{[2]}$
    for the same purposes. Other options I am aware of are phan${ }^{[3]}$ and exakat${
    }^{[4]}$. However, PHPStan and Psalm are definitely the ones with the most “market
    share” in PHP.


    As a quick summary and to focus the rest of this chapter: static code analysis
    provides a way of testing your code without having to run it. A static analysis
    tool can look at your PHP code and infer things about how it should work based
    on the types associated with your variables, functions, and classes. It can highlight
    whether you’re potentially passing a parameter with an ambiguous type, if you’re
    calling a function in an unexpected way, identify areas of code that will never
    be executed, and more. As PHP has matured and added features like type hints and
    strict mode, static analysis tools can give you a better understanding of application
    code and give more useful feedback.


    # Why Should I Use It?


    When I first started looking at and using these tools, I quickly realized that
    the high-level purpose was to accurately figure out the intent of the code I was
    writing.


    When parameter typing and return value typing were added to the language, it helped
    me out in two ways. First, it eliminated a whole category of tests designed to
    answer questions like, “Did you get an array back?” Once you could say, at the
    language level, “this variable is supposed to be an integer,” then the PHP interpreter
    could do that test for me.


    With the use of types, the static analysis tools could read in my code, parse
    it, and then start looking at code that is calling it. When I started using these
    tools, I began to appreciate that I had something looking at what I did and making
    suggestions:


    “I know you are accepting an array as this parameter, but look at how in one place
    it is given an array of integers, while elsewhere it is an array of mixed values.
    Which one are you expecting?”


    “I noticed that you are calling this method on this object you generated a few
    lines up. I can’t tell what type of object it is supposed to be due to some lazy
    loading behind the scenes. Can you add an annotation to help me figure it out?”


    +   [1] https://phpstan.org

    [2] https://psalm.dev

    [3] https://github.com/phan/phan

    [4] https://exakat.io'
  merge: -1
  img_proc: true
- pgno: 15
  md: "# ### Who Should Be Using It?\n\nDevelopers should be using static code analysis\
    \ tools while doing their coding work, hopefully before they attempt to commit\
    \ their code to their version control system.\n\nIf you have some reluctant developers,\
    \ you could always rely on the commit hooks for your version control system and\
    \ add it there. My own recommendation is to create it as a pre-commit hook-no\
    \ commit goes through unless the static analysis tool is happy!\n\nJust remember\
    \ that any use of a tool like this also needs to be accompanied by code reviews\
    \ to make sure that some of the techniques you can use to make PHPStan “happy”\
    \ are being correctly applied.\n\n# ## How Do I Do It?\n\nThe configuration file\
    \ for PHPStan (called phpstan.neon) contains the minimal amount of options:\n\n\
    ```\n```yaml\nparameters:\n    bootstrapFiles:\n        - config/bootstrap.php\n\
    \    level: max\n    paths:\n        - src\n        - tests\n```\n```\n\nPHPStan’s\
    \ documentation covers these options and more, but I want to talk about the ones\
    \ I am using.\n\nThe framework for this application (CakePHP⁶) uses a bootstrap\
    \ file, so I tell PHPStan to use it so it can see things like framework-related\
    \ configuration values and any custom values I might be using. Depending on the\
    \ underlying framework, I might not need this at all.\n\n[5] [https://docs.phpdoc.org/latest/guide/guides/docblocks.html](https://docs.phpdoc.org/latest/guide/guides/docblocks.html)\n\
    \n[6] [https://cakephp.org](https://cakephp.org)"
  merge: -1
  img_proc: true
