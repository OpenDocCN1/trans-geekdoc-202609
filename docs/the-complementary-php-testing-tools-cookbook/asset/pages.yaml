    "tmpDir": "tmp",

    "testFramework": "phpunit"

    }

    ```

    ```


    Next, I made sure I had my PHPUnit configuration file set up the way I wanted
    it. It''s named phpunit.xml and it goes in the root directory for the project
    as well:


    ```

    ```

    <phpunit bootstrap="tests/bootstrap.php">

    <listeners>

    <listener class="\Cake\TestSuite\Fixture\FixtureInjector">

    <arguments>

    <object class="\Cake\TestSuite\Fixture\FixtureManager" />

    </arguments>

    </listener>

    </listeners>

    <testsuites>

    <testsuite name="unit">

    <directory>tests</directory>

    </testsuite>

    </testsuites>

    </phpunit>

    ```

    ```'
