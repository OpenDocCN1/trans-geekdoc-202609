- pgno: 35
  md: '# **When Should I Use Mutation Testing?**


    As I showed in the section above, the best time to use mutation testing is during
    development. It can be used as a tool to guide you towards creating better tests
    by examining any "escape mutants" to see if there is anything that can be done.


    In my case, I had an invalid test to begin with. See, it even happens to to experienced
    developers! Taking a look at the mutants and applying the change myself sent me
    down the path towards fixing a broken test.


    I would not run mutation testing as part of any continuous integration build system.
    The fact that it can return false positives means it could cause a failing build
    for no reason.


    Much like static code analysis tools, it is an excellent tool for getting your
    testing to that "next level" status. Having tests is good; having effective tests
    is even better!'
