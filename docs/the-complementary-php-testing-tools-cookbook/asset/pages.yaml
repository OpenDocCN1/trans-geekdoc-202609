    \ directly to see whether the test fails as it should. The test still passes.\
    \ The next question to be asked is, “Does this actually matter?” Some mutants\
    \ are actually false positives.\n\nIn the case of Mutant 67, the answer to why\
    \ it is a false positive can be found in Mutant 68. If the condition comparing\
    \ $zVal to $leaderDiff is met, I overwrite what value goes into $leaderDiff, so\
    \ having that value start at -1 might be incorrect, but it does not cause the\
    \ test to fail.\n\nMutant 68 is a more interesting one. Under what circumstances\
    \ would it matter if that conditional statement changed? Given how I am calculating\
    \ the number of “games behind” for a team, I don’t think it really matters at\
    \ all. This one can be considered a false positive."
