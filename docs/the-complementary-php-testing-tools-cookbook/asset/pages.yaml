  md: "# # Initial Set Up\n\nThis book also assumes you are using the tool that I\
    \ feel changed PHP development forever, Composer [9] . If you are not familiar\
    \ with it, it is a command line interface tool for installing PHP packages. You\
    \ will be hard-pressed in 2021 to find a major PHP library or framework that is\
    \ not using Composer in some way.\n\nSome of the tools I’m using require you to\
    \ do some configuration work before you can use them.\n\n# PHPStan\n\nPHPStan’s\
    \ documentation can be found at https://phpstan.org.\n\nPHPStan can be used without\
    \ a default configuration file–you just need to pass it information via the CLI.\
    \ To reduce cognitive load, I’ll just create a default phpstan.neon file:\n\n\
    ```\n```\nparameters:\n    level: max\n    paths:\n        - src\n        - tests\n\
    ```\n```\n\n# Infection\n\nInfection’s documentation can be found at https://infection.github.io.\n\
    \nI chose to install Infection using PHIVE [10] .\n\nPHPStan can be used without\
    \ a default configuration file–you just need to pass it information via the CLI.\
    \ To reduce cognitive load, I’ll just create a default phpstan.neon file:\n\n\
    ```\n```\nparameters:\n    level: max\n    paths:\n        - src\n        - tests\n\
    ```\n```\n\n# Infection\n\nInfection’s documentation can be found at https://infection.github.io.\n\
    \n+   [9] https://getcomposer.org\n[10] https://phar.io/"
