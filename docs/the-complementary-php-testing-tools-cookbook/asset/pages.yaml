- pgno: 7
  md: '# # Chapter


    ## 1


    # ## Getting Started


    **Audience**


    The topic of testing is tough to explain to people who are just learning to program.
    “I''m going to write code that tests other code I write? That seems really hard!”
    I have yet to see a tutorial that teaches programmers how to use a programming
    language from a test-centric position.


    With that in mind, I wrote this book for PHP programmers who already have experience
    writing tests but want to improve. I have been doing this since 2005 and still
    go through the process of learning new things and reinforcing older habits that
    can lead to better outcomes.


    My book “The Grumpy Programmer’s Guide To Testing PHP Applications” (available
    via LeanPub^[1] or php|architect^[2]) goes over the basic technical and core skills
    you need to learn, and hopefully master, to make your tests effective and turn
    writing tests into just something you do instead of a rare event.


    +   [1] https://leanpub.com/grumpy-guide

    [2] https://phpa.me/grumpy-testing-book'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# ### 1. GETTING STARTED


    Throughout this book, I am going to show you how I am adding targeted test coverage
    to my oldest, still-in-use PHP-based web application. It has been running since
    2004, with me updating the base framework (CakePHP³) every few years.


    # ## Why Make All This Effort?


    The application began as a PHP 5 codebase and has been updated over the years.
    It now runs fine on PHP 7.4 and hopefully PHP 8.0 soon. It’s extremely rare in
    the current phase of the software industry to work on an application for so long.
    The skillset needed to build something from scratch, and the skillset needed to
    maintain an existing codebase are quite different! I believe that more and more
    developers understanding this has led to all these great tools available in multiple
    languages, making testing and code analysis easier.


    After all, if you’re going to build something and never touch it again after deployment,
    then you probably have no need for automated tests and code linting and static
    code analysis. However, if you are building something that is going to be the
    long-lived core of a business or project, it is worth exploring automated testing,
    code linting, and static code analysis to find out how they can help you.


    # ## The Application


    The application itself is a website for a league that uses a tabletop baseball
    simulation game to play out a full season using rosters made up of players from
    existing Major League Baseball teams. We make the game ourselves and distribute
    it to league members and other interested parties for free.


    When it comes to verifying the application is behaving as expected, some of the
    things that can be visually confirmed are:


    +   - league standings

    - scheduled games

    - pitching rotations teams will use

    - injuries


    To be perfectly clear–knowledge of the sport of baseball is not a requirement
    to under-stand the approach I am using in this book! It certainly helps, but the
    key point I want to emphasize is that without some domain knowledge of the problem
    you are trying to solve you might create tests that have no impact.


    > ³https://cakephp.org'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# ## The Application


    For a various reasons, mostly related to the concept of “the prototype becomes
    production,” we have no test coverage. Typically, this would be a massive problem
    for any website people frequently use, but I am a “domain expert” for the problem
    we are solving. This allows me to make very lazy shortcuts and visually verify
    things work as expected.


    Chances are, if you are joining a project and dealing with a long-lived legacy
    application it’s very likely you do not have the same level of knowledge of both
    the application’s code and the problem it’s solving. Because of my knowledge,
    I can skip a whole category of automated tests where the output of various pages
    is compared to a baseline. Manually reloading pages after making small changes
    is not a great practice. Still, at this point, it is highly unlikely that writing
    a series of automated tests will give us a sense of confidence about the deployments
    we need. No other developers are likely to join the “team” to work on it. I know
    enough to visually confirm if things are working as expected.


    Still, no tests? Yes, to my great personal shame, it is a huge oversight that
    now needs to be corrected. Every year when we tweak things and ready the website
    to cover the upcoming season, a few things break. Because I understand how EVERYTHING
    is supposed to work, these are quick changes. It would be nice to get to the point
    where all the things that break happen before I push the changes into production.


    So why am I bothering to add automated tests, given that some types of tests are
    likely not to help? That domain knowledge often leads me to forget to check that
    everything works instead of only visually checking the one thing I changed.


    By adding tests that cover the things that have to work whenever updated code
    is deployed into production I am trying to change the cycle of:


    +   - make local changes

    - imperfectly test local changes

    - push changes to production

    - get email from people that “something is broken”


    The price of failure here is pretty low–it’s a website supporting a hobby. Any
    urgency I feel is created by myself; chances are your own situation is much different.
    Bugs or unexpected behavior in your web applications can lead to losing money,
    losing jobs, or could even damage the business behind it.


    I am a firm believer in getting a computer to do repeatable tasks for you. As
    humans, we make mistakes. We skip steps. We assume the state of things. Computers
    only follow the instructions we give them. Hopefully, those instructions match
    how we believe things should behave.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 1. GETTING STARTED


    Using automated tools is often like having another person on your team tirelessly
    checking your work for mistakes and making suggestions on what to change. Who
    doesn''t want help like that?


    # Our Tools


    As of this writing (spring and summer 2021), I have the following tools installed;
    they are used throughout this book.


    +   • PHP 7.4 and PHP 8.0


    +   • PHPStan 0.12.85


    +   • Infection 0.21.0


    +   • PHPUnit 8.5.1


    +   • PostgreSQL 9.6


    I am doing this work on macOS Big Sur 11.3 and have used Homebrew⁴ to install
    most of the dependencies I need.


    I am also using PhpStorm⁵ as my editor, which has great integration with all three
    of the test-centric tools along with the PHP Extended Inspections⁶ extension,
    which makes lots of refactoring suggestions and reminders about things like uninitialized
    variables.


    Before I go any further, I want to remind you that my choice of tools is just
    that: my choice of tools. There are many other options for each type of tool I
    am using, and I am a strong believer in not using tools that cause you any friction.
    If you want to use PHPStan⁷ for static code analysis, go ahead! If you want to
    skip doing mutation testing, that''s cool too. Don''t like PHPUnit''s syntax and
    want to use something like Pest⁸? Go for it.


    The point is to start integrating the use of tools that complement test-centric
    practices. Your choice of tools won''t change what you have to do, but it does
    influence how you approach it.


    +   [4] https://brew.sh/


    +   [5] https://www.jetbrains.com/phpstorm


    +   [6] https://phpa.me/php-inspections-extended


    +   [7] https://phpstan.org


    +   [8] https://pestphp.com'
  merge: -1
  img_proc: true
