- pgno: 18
  md: "# ## 2. STATIC CODE ANALYSIS TOOLING\n\nThis error is because PHPStan cannot\
    \ understand where that orWhere() method comes from. Is this really an error?\
    \ No. The code clearly works, so I could tell PHPStan to ignore this problem.\
    \ According to the documentation I could add a PHPStan-specific annotation to\
    \ tell it to ignore the error coming from that line.\n\nLet's do that--some tools\
    \ can definitely report false positives and I feel like this is one of them. This\
    \ is what the updated code looks like now:\n\n```\nreturn $this->find()\n    ->where([\
    \ 'week <=' => $week ])\n    ->contain('HomeTeams, AwayTeams', function ( Query\
    \ $sq ) use ( $teams ) {\n        /** @phpstan-ignore-next-line */\n        return\
    \ $sq->where('HomeTeams in', $teams)\n            ->orWhere('AwayTeams in', $teams);\n\
    \    });\n```\n\nDown to just two errors. The next one is this:\n\n```\nLine \
    \ src/Util/Rosters.php\n15      Call to an undefined method Cake\\ORM\\Table::generateListByNicknameName().\n\
    ```\n\nHrm. I did a search of the codebase, and that method doesn't exist at all.\
    \ Is this dead code? An experiment I was doing and never finished? More searching\
    \ makes me believe that it is, in fact, code that is not being used. Manual testing\
    \ of the page that displays rosters verifies this is the case.\n\nOkay, down to\
    \ one last error:\n\n```\nLine  src/View/AjaxView.php\n48      Call to an undefined\
    \ method Cake\\Http\\Response::type().\n```\n\nI suspect this is code that older\
    \ versions of the framework used, but along the upgrade path, it's stuck around.\
    \ I could delete the file, but I do not have enough test coverage to feel comfortable\
    \ doing it. Instead, I am going to add some details to the phpstan.neon file that\
    \ tells it to ignore this file."
