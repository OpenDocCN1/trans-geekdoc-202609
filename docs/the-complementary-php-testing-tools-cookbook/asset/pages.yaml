- pgno: 17
  md: "# How Do I Do It?\n\nNow it seems like PHPStan is definitely getting stricter\
    \ and pointing out things in my code that, while it works, could potentially cause\
    \ problems down the road. A summary of its complaints could be:\n\n+   1. I need\
    \ to deliberately cast some values in comparisons.\n2. I need to specifically\
    \ tell PHPStan what some classes in use are rather than assume magic.\n\nOkay,\
    \ I'll make some changes and explain why they are necessary. Here's a line of\
    \ code it's complaining about:\n\n```\n`if (($result->home_score + $result->away_score)\
    \ >= 13)`\n```\n\nPHPStan is looking at this and saying, \"I'm not 100% sure what\
    \ could be in `$result->home_score` or `$result->away_score` so can you clear\
    \ things up?\"\n\nI think that is a fair question. A revised line could look like\
    \ this:\n\n```\n`if ((int)($result->home_score + $result->away_score) >= 13)`\n\
    ```\n\nAnother way to do it would be even stricter and cast both values to be\
    \ integers.\n\n```\n`if ((int)$result->home_score + (int)$result->away_score >=\
    \ 13)`\n```\n\nA developer friend of mine has said on more than one occasion that\
    \ code that uses static analysis tools \"no longer looks like PHP\" Which is to\
    \ say, \"It no longer looks like PHP code the way a lot of people write it.\"\
    \ PHP is incredibly forgiving in many cases due to its dynamic typing capabilities.\
    \ It tries to figure out what your intent is. Maybe those `home_score` and `away_score`\
    \ class attributes are always going to be integers. By deliberately casting them\
    \ as integers, I am 100% making sure that comparison does not cause a PHP-related\
    \ error. Hopefully, those two attributes never have incorrect values!\n\nSo at\
    \ level 2, it says there are four more errors. I'll fix the other math-related\
    \ one and then turn my attention to those other reported problems.\n\n| Line |\
    \ src/Model/Table/GamesTable.php | \n|:--|:--|\n| 143 | Call to an undefined method\
    \ Cake\\ORM\\Query::orWhere(). |"
  merge: -1
