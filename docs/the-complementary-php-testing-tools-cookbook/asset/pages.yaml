  md: '# ## Foreword by Marco Pivetta


    (Marco is a long-time and prolific contributor to Open Source PHP projects. I’ve
    been lucky enough to work with Marco for several years and I learn how to do something
    better almost every single time we go a code review or have a discussion surrounding
    software development. I asked him to take a look at this book and reflect on the
    changes he has seen in the PHP development community in the decade we’ve known
    each other.)


    I’ve known Chris, the “grumpy programmer”, since almost a decade now: he and I
    share most of our views around how teams should keep control over software complexity
    and stability.


    His long career around software testing, automation tooling and general betterment
    of developers that he managed to reach is showing its impact over our industry:
    a decade ago, testing was looked upon with skepticism within the PHP ecosystem,
    sometimes even frowned upon, “an expensive exercise.”


    Where there was skepticism, there is now clear interest in testing on many levels,
    and the discussion shifted from “should I write tests?” to “what are the best
    testing techniques?”.


    The community at large has clearly adopted software testing, and so probably have
    you, since you are reading this book.


    The next step lies in understanding whether our tests are good, are verifying
    all the important details of our projects, and whether we are writing code that
    is to the point. We want to avoid useless complexity, embracing brevity, and improve
    expressiveness of our work, to the benefit of ourselves and our peers.


    As a code-quality evangelist myself, I suggest you to try the tools and techniques
    presented in the next chapters, make them your own.


    You will learn about practices that I personally made part of my own daily engineering
    work, and they will have a deep impact on how you write software.


    By mixing and leveraging them, you may be able to find your level of comfort in
    code quality, as well as the knowledge needed to convince others about their value.'
