  md: '# How Do I Use It?


    This seems like a straightforward test. Can mutation testing reveal that our expectations
    are wrong?


    Before we can get to that point, there was some configuration work I had to do.
    First, I needed to create the configuration file for Infection itself. It''s named
    infection.json and stored in the root directory for the project:


