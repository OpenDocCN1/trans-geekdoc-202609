- pgno: 45
  md: '# # Chapter 5


    ## Continuous Integration


    I am a big fan of getting computers to do repetitive actions for me. It frees
    up my attention to focus on solving other problems instead of remembering a series
    of steps where missing one can result in failure.


    One of the issues most programming projects face is coming up with a way to integrate
    code changes with the least amount of friction. There is no way to do it without
    any kind of pain and effort either on the development side or the tool creation
    side.


    As I write this in the spring of 2021, there are two dominant methods of integrating
    your code. The first I call “integrate into main with flags” and “integrate via
    pull-request.”


    # ### Integrate Via Pull Request


    With a large percentage of developers making use of GitHub (ironically a set of
    centralized web-based tools for a distributed version control system) most of
    the folks reading this are familiar with the use of the “pull request.”


    For those not familiar, here’s a high-level explanation:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 5. CONTINUOUS INTEGRATION


    A developer creates a branch of the code under version control and does some work
    in that branch. Once they are ready to share, they use tooling to create a “pull
    request,” which is a notification that there are some changes to be reviewed.
    Generally speaking, you are comparing the developer’s work in their own branch
    with the main branch that gets deployed into a production environment.


    People reviewing the pull request can see what the changes are and make comments
    about those changes. One of the downsides of the pull request method is that long-running
    work can easily get out of date if the codebase itself is changing rapidly. This,
    in turn, forces the developer to do a lot of work, constantly merging in other
    changes from other developers that have been applied to the main branch.


    This method puts the pressure for smooth integrations onto the tooling by providing
    tools that reduce the friction involved in managing all these changes.


    # Integrate Via Flags


    As more people experience some of the pains and frustrations of a pull-request-centric
    integration plan, other programmers have been advocating not using separate branches
    for their work. Instead, they work in the main branch that is deployed and use
    “feature flags” or other techniques to make sure that the new code is only used
    under specific conditions.


    Feature flags or other ways of configuring what code is available to users can
    be as complicated as an admin system where you define these values or as straight-forward
    as a conditional statement around a block of code.


    The project I am using in this book does more of an “integrate with main” strategy,
    with a few flags to change what gets displayed. The other developer who helps
    out does pull requests for their work as they do not understand the codebase as
    well as I do.


    This method puts the integration pressure on the developers to make sure the conditions
    under which this code should be executed are correct.


    No matter what method you choose to use, the process for doing either method is
    well-established, and there are lots of resources available that can show how
    to do it.


    # Automating Integration and Testing


    # Local Automation


    One of the reasons I so strongly advocate for automated tests of critical features
    of web applications is that the integrate-and-then-deploy process can be very
    stressful, especially in environments where parts of the deployment process are
    manual.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Automating Integration and Testing


    The one common trait of places where every deployment-to-production was stressful
    was a lack of tests to act as that first line of defense against integrations
    that might have gone wrong. Yes, I know it can often be difficult to wrap tests
    around legacy applications. For me, it is worth it because it increases confidence
    that any given deployment is going to work as expected.


    Once there are some tests in place, you then need to start thinking about all
    the steps required to get to the final step of “did my tests pass?” In the case
    of the project being used in this book, it looks a little like this:


    +   Pull in any changes from GitHub and apply them to my work.

    Create a fresh test database and seed it with data.

    Run `composer install` to have expected dependencies in place.

    Run my tests.


    If the tests pass, then I do a manual deployment of the changes on the production
    server for the application.


    What if I wanted to automate this? First, I would create something that does it
    locally with one command. For projects using Composer, I can add things to a `scripts`
    section of the `composer.json` file.


    But first, I’ll create a `bash`[1] script with all the steps I need in it. I am
    leery of adding a step that automatically merges changes from the main branch
    because it might require me to fix conflicts or solve other Git-related issues
    before I can run my tests.


    ```

    #!/usr/bin/env bash

    PGPASSWORD=<redacted> psql -h 127.0.0.1 -U <redacted> ibl_test < ibl_stats.dump

    composer install

    vendor/bin/phpunit tests/

    ```


    I’ve added this file to my project as `scripts/test-full.sh`.


    For this project, I grab frequent snapshots of the production database and use
    them locally to always reset my test database to a known state. I then use Postgres’
    CLI tools to import that snapshot. Next, I install all my project dependencies,
    followed by running my tests.


    I’ve verified that it runs locally and that my tests currently pass at the end.


    +   https://www.gnu.org/software/bash'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# ## 5. CONTINUOUS INTEGRATION\n\nThe next step is to update our `composer.json`\
    \ file so this script can be executed with the command `composer test-full`. I've\
    \ added this after the last thing currently defined in there:\n\n```\n```json\n\
    \"scripts\": {\n    \"test-full\": \"scripts/test-full.sh\"\n}\n```\n```\n\nI've\
    \ verified that the command `composer test-full` now runs the bash script I created.\
    \ I can now do all this work with just one command.\n\n# ### Build Servers\n\n\
    Ideally, I want to also have these steps followed by an automated system. Systems\
    \ like this are often referred to as “build servers” or “continuous integration”\
    \ servers. Regardless of the name, it is a system that executes a series of user-defined\
    \ commands based on an event or trigger.\n\nMy first exposure to continuous integration\
    \ systems was via learning how to use Jenkins$^{[2]}$ to run tests for a fantasy\
    \ sports platform’s Python code that handled generating all the points for participants.\
    \ Jenkins is still a good choice for folks looking to get into automation surrounding\
    \ your build-and-deploy process.\n\nThese days, I use GitHub Actions$^{[3]}$ to\
    \ do this kind of work. With every single one of my coding projects using GitHub,\
    \ it makes sense to take advantage of the integrations they provide.\n\nBecause\
    \ GitHub Actions are language-agnostic, you have to tell it to do a lot of the\
    \ configuration work and package installation you’ve done already just to get\
    \ your local development environment up and running.\n\nTheir documentation is\
    \ really good; I encourage you to read it to understand what is going on. Here\
    \ is the GitHub Actions configuration file for my project. Don’t worry, I will\
    \ explain what is going on:\n\n> > $^{[2]}$ https://www.jenkins.io\n> $^{[3]}$\
    \ https://github.com/features/actions"
  merge: -1
