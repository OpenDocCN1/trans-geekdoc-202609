    The important part of LSTM is its cell state. The line passing through all LSTM
    units act as a memory to carry certain aspects of sentence [3] as we know plural
    words cause issues for basic RNN, LSTM doesn''t suffer from that.


    ```

    $i_t = \sigma(W_{ix}x_t + b_i h_{t-1} + b_i)$

    ```


    ```

    $f_t = \sigma(W_{fx}x_t + b_f h_{t-1} + b_f)$

    ```


    ```

