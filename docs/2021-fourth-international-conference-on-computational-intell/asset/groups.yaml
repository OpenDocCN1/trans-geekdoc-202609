    ```


    ```

    $o_t = \sigma(W_{ox}x_t + b_o h_{t-1} + b_o)$

    ```


    ```

    $c_t = f_t \odot c_{t-1} + i_t \odot g_t$

    ```


    ```

    $h_t = o_t \odot c_t$

    ```


    where $h_t$ is the hidden state at time $t$, $c_t$ is the cell state at time $t$,
    $x_t$ is the input at time $t$, $h_{t-1}$ is the hidden state of time $t-1$ or
    the initial state at time $t$, and $f_t, g_t, o_t$ are the input, forget and output
