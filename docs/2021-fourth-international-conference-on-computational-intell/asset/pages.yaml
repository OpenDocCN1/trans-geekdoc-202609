    # C. Short Long Term Memory


    Short-term, long-term memory is a type of recurrent neural network (RNN). LSTM
    (Sepp Hochreiter et al [4]) are designed for learning and classifying sequences.
    Networks aim to solve the problem of fading gradients by using gates to select
    the information to update and forget irrelevant details [3]. Sensitivity to time
    inputs makes LSTM networks better than RNN for data analysis tasks.


    Architecture: The architecture of the LSTM (Sepp Hochreiter et al [4]) is shown
    below. An LSTM unit has a cell state, input gate, exhale valve, and bypass valve
    in addition to the state of the RNN. The entry gates and offsets control how the
    new value in the cell enters. Likewise, the weights and offsets for the output
    gate control the extent to which the value remains in the cell and is used to
    calculate the output activation of the LSTM-Block [4].


    ![](img/d75975420a2b45cb26b95046322bec03_1_0.png)


    The important part of LSTM is its cell state. The line passing through all LSTM
    units act as a memory to carry certain aspects of sentence [3] as we know plural
    words cause issues for basic RNN, LSTM doesn''t suffer from that.


    ```

    $i_t = \sigma(W_{ix}x_t + b_i h_{t-1} + b_i)$

    ```


    ```

    $f_t = \sigma(W_{fx}x_t + b_f h_{t-1} + b_f)$

    ```


    ```

    $g_t = \tanh(W_{gx}x_t + b_{g} h_{t-1} + b_g)$

    ```


    ```

    $o_t = \sigma(W_{ox}x_t + b_o h_{t-1} + b_o)$

    ```


    ```

    $c_t = f_t \odot c_{t-1} + i_t \odot g_t$

    ```


    ```

    $h_t = o_t \odot c_t$

    ```


    where $h_t$ is the hidden state at time $t$, $c_t$ is the cell state at time $t$,
    $x_t$ is the input at time $t$, $h_{t-1}$ is the hidden state of time $t-1$ or
    the initial state at time $t$, and $f_t, g_t, o_t$ are the input, forget and output
    gates respectively [4]. $\sigma$ is the sigmoid function, and $\odot$ is the Hadamard
    product. In the layer LSTM, the input of the $l^{th}$ layer ($l$) is the hidden
    of the $(l-1)^{th}$ layer multiplied by $\delta^{(l-1)}$ where $\delta^{(l-1)}$
    is a Bernoulli random variable which is 0 with probability dropout


    # D. Gated Recurrent Unit


    The gated recurrent unit (GRU) is a gating mechanism in recurrent network (RNN),
    similar to the LSTM block without the output gate. Proposed (Jun Chung et al [5])
    to solve the problem of the vanishing gradient that can occur with such recurrent
    networks. It can be thought of as a type of LSTM block which is as similar and
    in some cases gives similar results.'
