    # III. PRELIMINARIES


    Here we will discuss some deep learning techniques for using embeddings.


    # A. Text Generation


    Text generation comes under the branch of Natural Language processing where we
    use different learning algorithms and methods like sequence-to-sequence model
    with recurrent networks, gated recurrent units and long short-term memory techniques
    [1]. We can also use deep learning techniques to categorize words and generate
    sentences like Naive Bayes.


    # B. Recurrent Neural Network


    Special Type of Neural Network designed for natural language processing. Here
    we use our embeddings or the bag of words model just as the recurrent network
    when they''ll produce an output model (for this case it is text generation). The
    architecture of such Networks seems so complex as it is not very good when we
