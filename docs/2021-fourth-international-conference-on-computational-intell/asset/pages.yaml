  md: '# Encoder Decoder Model with Attention layer


    GRU can solve the disappearing gradient problem with update and reset gate. The
    update gateway manages information flowing out of memory, and the reset gateway
    uses a useful mechanism to solve the problem of vanishing gradients in recurrent
    neural networks. The gradient problem occurs in machine learning when the gradient
    becomes vanishingly small, which prevents the weight from changing its value.


    +   1) Encoder: It is a Stack of recurrent unit (of whichever model being used
    like LSTM or GRU) which takes element of input sequence or sequence and passes
    on its information to further layers Encoder for hidden states [6, 17).


    ```

    $h_t = \sigma_g(W_{hh}h_{t-1} + W_{xh}x_t)$

    ```


    This equation defines final hidden vector by the encoder helps in combining all
    information from the input and then it to decoder for receive prediction or in
    this case vector. This vector is directly given as first input of the decoder,
    [6]; hidden memory and value of each is given to the attention layer [2].


    +   1) Architecture: The of GRU block is shown below. GRU unit has a forget, update
    and reset gate in addition to the state of the RNN it lacks the output. The update
    gateway and the reset valve are two vectors decide which information is transmitted
    to the output. We can train it remember information from the past or delete information
    unrelated to the forecast [5].


    ![](img/d75975420a2b45cb26b95046322bec03_2_0.png)


    +   2) Advantages:

    - GRU perform better than LSTM when working with small data.

    - GRU is computationally less expensive as compared to LSTM when we have fewer
    parameters to compare. It works with Smaller Datasets.


    +   2) Attention: Computes 4 elements which are soft of each encoder state, attention
    weights using Softmax over the attention scores, Context vector by multiplying
    hidden layer and attention weights and concatenate with previous time step and
    this to the decoder with last layer vector [2]. We have 2 types of attention models
    which as follows:


    +   3) Disadvantages:

    - Performs worse in larger datasets as compared to LSTM.

    - Leser better than LSTM.


    ![](img/d75975420a2b45cb26b95046322bec03_2_1.png)


    +   1) Global attention layer: Here all encoder states are considered for obtaining
    the context vector


    ![](img/d75975420a2b45cb26b95046322bec03_2_2.png)


    ```

    $z_t = \sigma_g(W_{zx}x_t + U_{hz}h_{t-1} + b_z)$ (7)

    $r_t = \sigma_g(W_{rx}x_t + U_{hr}h_{t-1} + b_r)$ (8)

    $\tilde{h}_t = \phi_h(W_{hx}x_t + U_{hr}(r_t \odot h_{t-1}) + b_h)$ (9)

    $h_t = (1 - z_t) \odot h_{t-1} + z_t \odot \tilde{h}_t$ (10)

    ```


    +   4) Equations:


    Fig. 4 Global attention layer - 1 at each time step t, the model refers a variable-length
    alignment vector vector based on the current state h, and all source states h.
    A global context c is then computed as the weighted, according to it, over all
    the source state (Minh-Thang Luong et al [2]).


    Fig. 2: GRU unit'
