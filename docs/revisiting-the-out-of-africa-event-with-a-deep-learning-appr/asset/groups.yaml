    100 Mb 参数优化的输出作为每个模型的先验，然后使用了之前提到的 DL 模型选择策略。换句话说，我们首先使用 100 Mb 的模拟序列对每个模型类进行了参数优化，然后相互比较不同的模型。我们发现，在大多数情况下，使用
    100 Mb 的总模拟序列已经足以区分模型，除了表 S7，其中我们使用了 500 Mb 区域进行优化。


    ### ABC-RF


    我们使用类似的 ABC 方法测试了真实 SFS 与三个模拟模型，但采用随机森林^61（以下简称 RF）作为推断工具，该工具在 abcrf R 包中实现。^43,62
    首先，我们使用 bagging 方法和 abcrf 函数训练了我们的模型，不进行线性判别分析，并使用每个待测试模型 1,000 次模拟构建了 2,000 棵决策树。然后，我们使用
    predict.abcrf 函数，通过由每个待测试模型 1,000 次模拟组成的交叉验证数据集评估了 ABC-RF 的性能。使用相同的函数和设置，根据上述真实数据获得的
    SFS 推断出最受支持的模型。我们对最受支持的情景使用 regAbcrf 模型中的 1,000 棵决策树应用回归进行了参数估计。每个参数均单独推断。与 DL
    和 DLS 方法类似，整个程序对模型选择重复了十次。


