    ## 结果


    ### ABC-DLS


    ABC-DLS（无论是模型选择还是参数估计）的一般工作流程包括以下步骤。首先，我们使用在先验范围内从均匀分布中采样的人口统计参数，为每个测试模型模拟了多个遗传数据集<sup>29</sup>（表
    1）。接着，我们从这些数据中计算了 SFS，并将数据分为训练子集和测试子集。然后，我们在前者数据集上训练了神经网络（NN，通过 TensorFlow 和 Keras
    后端实现<sup>42</sup>），以在人口统计模型之间进行选择或估计人口统计参数。所得神经网络应用于测试数据集以及观察到的汇总统计数据（更多细节见下文以及材料与方法部分）。接着，我们通过比较观察数据与测试数据集之间的神经网络预测结果，应用
    ABC 来估计观察数据上神经网络预测的支持度（见材料与方法、图 S2 以及我们之前的论文<sup>20</sup>）。最后，在使用 SMC 的情况下，我们基本上通过
    SMC 迭代参数估计步骤。我们保留了测试数据集中与观察数据最匹配的前 5%（等于容忍水平）的模拟结果。然后，我们使用这些模拟的参数更新先验范围，并将其送入下一次迭代，直到达到收敛（图
    S3 和 S4）。


    在对真实序列数据测试我们的主要假设之前，我们测试了我们的方法（DLS）是否可以复现已知结果。真实序列数据的预测参数（更多细节见下文）与文献中的先前工作一致<sup>17,19,71</sup>（表
    S7）。我们还在已知参数的模拟数据上测试了我们的方法，涵盖多种模型（模型 S、B 和 M，更多信息见下文；模拟参数来自表 2、S5 和 S6），并发现我们的方法与
    SMC 一起在所有测试案例中都正确预测了模型，表明它可以找到正确的模型。此外，当正确的参数值已知且来自模拟观察 SFS 时，我们的方法可以以高精度推断参数值（表
    S12）。


    ### 模型选择


    为了检验我们的假设，我们模拟了三个非洲外（OOA）模型：简单模型（模型 S）、回非洲模型（模型 B）和混合模型（模型 M），且所有模型均包含尼安德特向所有非洲外人群的基因内混入，<sup>63</sup>
    丹尼索瓦或未知来源向亚洲，<sup>20,47,64</sup> 非洲古老人种向非洲，<sup>16,67,68,72</sup> 以及欧洲新石器时代农民向非洲（NDXF）（更多细节见材料与方法、图
    1 和表 1）。我们使用了五个约鲁巴人（非洲）、五个拥有北欧和西欧血统的犹他州居民（欧洲人）和五个汉族人（东亚人）的 1000 基因组计划高覆盖度基因组<sup>44</sup>（更多细节见材料与方法）作为我们的真实数据集。接下来，我们使用三种不同的方法在竞争模型之间进行选择：

    - RF，即结合随机森林与 ABC 的方法；<sup>43</sup>

    - NN 与 ABC 结合（DL），是我们先前发表的 ABC-DL 方法的类似但改进版本；<sup>20</sup>

    - 本文引入的方法 DLS，它通过 SMC 扩展了 DL 方法。


    虽然所有三种方法都将回非洲模型识别为最可能的模型，但不同方法之间的预测确定性各不相同（表 3 和 4）。DL 和 DLS 对模型 B 的预测概率均大于 95%，尽管
    RF 给出的支持度较低。


