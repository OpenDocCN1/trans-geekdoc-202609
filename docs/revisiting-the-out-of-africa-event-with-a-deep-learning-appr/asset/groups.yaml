    ## 重新审视“走出非洲”事件：一种深度学习方法


    Francesco Montinaro,1,2,6 Vasili Pankratov,1,6 Burak Yelmen,1,3,4 Luca Pagani,1,5
    and Mayukh Mondal1,*


    1塔尔图大学基因组研究所，爱沙尼亚塔尔图51010；2意大利巴里大学生物学-遗传学系，巴里70124；3塔尔图大学分子与细胞生物学研究所，爱沙尼亚塔尔图51010；4巴黎-萨克雷大学，CNRS
    UMR 9015，INRIA，数字科学跨学科实验室，法国奥赛91400；5意大利帕多瓦大学生物学系，帕多瓦35121 6这些作者均等同贡献 *通信作者：mondal.mayukh@gmail.com
    https://doi.org/10.1016/j.ajhg.2021.09.006. © 2021 美国人类遗传学会。


    ### Summary


    解剖学上现代人类大约在30万年前在非洲进化而来。他们最早在10万年前在非洲以外的化石记录中出现，尽管其他古人类在欧亚大陆早已存在得早得多。最近，几项研究基于全基因组序列分析，支持现代人类单一“走出非洲”事件。然而，单一“走出非洲”模型与某些化石记录的发现相悖，化石记录支持两次“走出非洲”事件，以及单亲遗传数据提出的“返回非洲”运动。在此，我们采用结合近似贝叶斯计算和序列蒙特卡洛的深度学习方法，从全基因组序列的角度重新审视这些假设。我们的结果支持“返回非洲”模型优于其他替代方案。我们估计，非洲与非洲外种群之间存在两次连续分离，发生在约6-9万年前，且相隔13-15千年。较晚分裂产生的一个种群在很大程度上取代了较古老的西非种群，而另一个种群则奠定了非洲外种群的基础。


    ### Introduction


    最近的化石记录分析表明，智人大约在30万年前（kya）出现在非洲。1 这一假设得到遗传数据的印证，2 该数据估计现代人类种群之间最深的分叉发生在类似的时间点。尽管化石记录主张现代人类发生过多次走出非洲（OOA）事件，3
    但最近的遗传研究揭示，迄今测试的所有现代非非洲种群都符合一个模型，即单次OOA事件发生在不到10万年前。4–6 这一结论表明，考古记录所记载的早期OOA迁徙可能对现代人类种群没有留下显著贡献，巴布亚人种群提出的模型（两次走出非洲模型）可能是个例外。7  单倍群E在撒哈拉以南非洲种群中普遍存在。这两个单倍群在与OOA种群中任何其他单倍群合并之前先一起合并。10,11
    这一观察可能由涉及携带单倍群E的人群的返回非洲迁徙解释，10 或者简单的走出非洲，其中单倍群E留在非洲，而单倍群D和其他OOA单倍群一起走出非洲。12 此外，一些遗传分析表明，非洲与OOA种群之间的分离可能不是单一的分裂事件，而是由种群之间的结构和混合构成。13–16


    测试这些假设（单次走出非洲、返回非洲和两次走出非洲）具有挑战性，因为非非洲种群经历了严重的瓶颈效应，17–19 古代人类基因入侵的数量和来源存在差异，19,40,21
    以及非洲内部的多次迁徙。2,16 缺乏来自非洲早于1.5万年前的古代基因组数据，22 使得从古代DNA的角度解决这一问题变得困难。然而，神经网络（NN）已被证明在解开此类复杂情景方面极其强大。20


    在过去几十年中，高效且强大的计算基础设施的发展使我们在机器学习领域取得了实质性进展，尤其是对于计算需求高的算法，如NN23,24 和贝叶斯方法。25,26
    NN已被证明对于特定类型的任务（如分类或自然语言处理）是一个有用的工具。23–25,27 然而，NN需要大量数据作为训练集。在某些情况下，可以通过使用模拟数据来克服这一限制。鉴于现代工具允许高效模拟大规模合成遗传数据集，28,29
    NN已经在人群基因组学中被采用，用于从潜在种群历史的角度解释基因组数据，20,30,31 以及正选择。32,33


    然而，与经典方法不同，由于NN是一种“黑盒”方法，衡量NN所做预测的显著性仍然具有挑战性。近似贝叶斯计算（ABC）可以根据数据本身来衡量基于NN的预测的准确性，而无需知道最大似然函数。20,30,34
    然而，当使用高维输入数据或汇总统计量时，ABC可能面临“维度灾难”问题。35 当所利用的汇总统计量未能捕获足够信息时，其效率较低。在此，我们使用NN来降低原始汇总统计量的维度，并产生高度信息性的次级汇总统计量，这些统计量被ABC用作输入以进行统计分析。序列蒙特卡洛（SMC，也称为粒子滤波方法）36
    用于从先验递归预测后验分布。在每个步骤中，为每个先验样本计算似然权重。低似然样本被丢弃，新样本从连续分布中重新采样。在经典SMC中，较新样本在重新采样步骤中具有更高的权重，从而被赋予更高概率。对所有这些样本计算似然权重，循环重复直到达到收敛。SMC与遗传算法有强烈的相似性。37
    已证明，使用SMC可以进一步改进ABC估计，38–40 但迄今它们尚未与NN一起使用。


    在此，我们提出了一种改进的ABC-DL（结合深度学习的近似贝叶斯计算）20 版本，以及ABC-DLS（结合深度学习和序列蒙特卡洛方法的近似贝叶斯计算），这使我们能够在不同竞争的人口统计模型中推断最可能的情景，并以高精度估计其参数值。我们的方法依赖于在被测试模型下用模拟遗传数据训练的NN。然而，与其他类似方法相比，它有三个关键改进。首先，使用hdf541
    数据格式和TensorFlow42 允许极大的训练数据集。其次，常规NN方法通过ABC得到改进，这有助于为NN预测提供统计支持并获得模型参数值的后验分布。第三，受先前工作的启发，38
    我们应用了SMC36 方法的修改版本来迭代整个过程。与先前实现的方法相比，该算法显著提高了预测准确性。20,43 我们应用此方法来测试上述三种OOA模型。


