    T_DM 代前来自丹尼索瓦人或未知古代人群的基因内渗，比例为 DMix。尼安德特人在 T_N_D 代前与丹尼索瓦人或未知混合人群分离，尼安德特人-丹尼索瓦人谱系在
    T_H_A 代前与现代人类谱系分离。65,66 非洲人群也来自另一个未知古代人群的基因内渗，该事件发生在 T_XM 代前，比例为 XMix。16,67,68
    这个未知人群在 T_H_X 代前与现代人类谱系分离。我们观察到，我们的方法无法找到任何古代人群的有效种群大小（很可能是因为我们在真实数据中未使用任何古基因组）。因此，我们假设它们等于
