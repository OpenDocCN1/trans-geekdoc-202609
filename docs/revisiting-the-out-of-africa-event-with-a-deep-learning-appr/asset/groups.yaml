  mdcn: '

    与 Cole 等人（2020 年）[15] 所提出的模型不同。如果我们假设 Lipson 等人的模型为真，最简约的解释是，我们的回非洲人群代表了在 72.8
    千年前（T_Sep）与 OOA 人群分离的基础西非人群。我们的古代非洲人代表幽灵现代人，[16] 根据我们的预测，通过约在 61.9 千年前发生的混合，向现代西非人群贡献了约
    10%。另一方面，如果我们假设回非洲事件确实发生，那么 OOA 事件很可能发生在 90 千年前（T_B）之前。这表明，在非洲境外发现的大部分较古老的化石（>100
    千年前）[80–82] 不太可能对 OOA 人群有所贡献（假设现代人类的主系在此之前并未离开非洲）。回非洲与 OOA 分离的地理位置对该假说至关重要，但无法通过我们的方法进行估计。一旦来自这些地区该时期的古代基因组可用，利用它们来检验这一假说将尤为令人着迷。


