    ## 数据和代码可用性


    本研究期间生成的代码可在 https://github.com/mayukhmondal/ABC-DLS 获取。如需更多信息，请联系通讯作者。


    ## 补充信息


    补充信息可在线查阅：https://doi.org/10.1016/j.ajhg.2021.09.006。


    ## 致谢


    我们谨感谢纽约基因组中心的 Michael Zody 提供高覆盖度 1000 基因组数据的访问权限。这些数据在纽约基因组中心生成，由 NHGRI 资助 3UM1HG008901-03S1
    号拨款。本研究获得欧盟通过“视野 2020”研究和创新计划（拨款编号 810645）、欧洲区域发展基金项目 MOBEC008、2014-2020.4.01.16-0030
    和 2014-2020.4.01.16-0024 的支持。部分数据分析在塔尔图大学高性能计算中心进行。


    ## 利益声明


    作者声明不存在竞争性利益。


