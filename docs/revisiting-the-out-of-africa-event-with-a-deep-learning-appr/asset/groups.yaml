    ## ABC-DL


    我们使用 Python 中的最先进的机器学习包实现了 ABC-DL20 的改进版本（此后，我们称此实现为 DL，而另外使用 SMC [称为 DL5] 的实现将在下文描述）。我们使用带有
    Keras 后端的 TensorFlow42 来构建神经网络，并使用 abc 包来实现 ABC。58 使用 hdf5 格式41 使我们能够在不将数据加载到内存的情况下分析整个数据集。这使我们能够在极大的模拟数据集上训练神经网络。


    ## 使用 DL 进行参数估计


    在这里，我们描述了使用神经网络和 ABC 进行参数估计。我们运行了总共 60,000 次不同的模拟，每次模拟生成 3,000 个 1 Mb 区域（总共 3
    Gb [碱基对]，大约等于人类基因组的长度）。神经网络输入的每一行都是在给定人口统计学模型下进行的一次此类模拟，列代表 SFS 元素，而该模拟使用的参数用作已知输出。我们使用这些信息运行参数估计，并检索给定模型在观测数据上预测的参数。我们使用已知参数作为训练神经网络的输出（y），并将
    SFS 用作输入（x）。因此，我们可以将神经网络视为一个非线性模型，用于从 SFS 预测参数。我们保留了 10,000 行随机数据作为测试数据集和 ABC
    分析，其余用于训练神经网络。SFS 和参数值均按列使用 MinMax 标准化器（来自 scikit-learn）59 进行归一化，以便每个数据条目都在 0
    和 1 之间。


    我们使用了带有 relu 激活函数（来自 Keras 包）的四个全连接神经网络隐藏层（图 S1）。这些是神经网络的基本构建块。我们使用线性层（来自 Keras
    包）作为输出层，其单位数与参数数量相同。我们在开头使用了掩码层（来自 Keras 包）以从学习算法中移除零值单元。这样做是为了防止神经网络学习数据的缺失。然后我们使用了
    0.05 的高斯噪声注入（来自 Keras 包）来引入一些噪声（图 S1）以减少过拟合，因为这将迫使神经网络在 SFS 稍有失真（或带噪）的情况下仍学习真实参数。我们使用
    logcosh 作为损失函数，Nadam 作为优化器（两者均来自 Keras 包）。虽然我们使用过其他更经典的方法（例如，均方误差、随机梯度下降等），但我们发现这种组合更适合我们的方法。


    我们使用了带有 relu 激活函数的两个全连接神经网络隐藏层（图 S1）。我们使用了软最大化层（来自 Keras 包）作为输出层，其单位数与训练模型的数量相同。我们添加了掩码层和噪声注入层，如上所述。我们在每个全连接层中使用了
    1% 的丢弃层（来自 Keras 包）以使其更加稳健。我们使用了 categorical_crossentropy 作为损失函数，adam 作为优化器（两者均来自
    Keras 包）。


    神经网络多次遍历训练数据集（时代）以提高准确性。我们在验证数据集上的损失中使用了 EarlyStopping（来自 Keras 包），耐心值为 100。如果最后
    100 个时代没有改进，这将停止时代循环（意味着神经网络对当前数据达到了收敛）。我们使用了验证数据上的最低损失结果的 ModelCheckpoint（来自
    Keras 包），因为最后一个时代不一定在验证数据上具有最低损失。我们还使用了 ReduceLROnPlateau（来自 Keras 包），因子为 0.2，如果在多个时代（默认十个）后达到极小值，则降低学习率。起始时学习率过低会导致神经网络学习缓慢，但在后期，高学习率的表现不如低学习率。


    训练完成后，我们使用测试数据集从模拟 SFS 预测模型，然后使用 ABC 进行交叉验证测试，容忍度为 0.033（转换为 100 个样本）用于三种模型的情况，0.0066（转换为
    100 个样本）用于 15 种模型的情况，通过拒绝法（来自 abc 包）实现。我们将 abc-postpr（来自 abc 包）的模型选择应用于真实数据。示意图见图
    S2。


    训练完成后，我们使用测试数据集从 SFS 预测参数，然后将其用于交叉验证测试和通过 ABC 的 loclinear 进行参数预测，容忍度为 0.01。整个方法以流程图形式展示（图
    S2）。


    ## 使用 DL 进行模型选择


    ## ABC-DLS


    我们对 ABC-DL 方法的实现通过使用 SMC 方法^36 进行了进一步改进，这为类似案例的推断开辟了新途径（此后，我们称此实现为 DLS）。尽管 SMC
    有多种不同的实现并且可能相当复杂，但我们在此使用了一个更简单的 SMC 版本。在我们的实现中，我们只选择每次 ABC 循环中来自前 5% 的最佳样本并丢弃其余样本。参数值的范围从这些顶级样本中估计，新样本从这些新后验范围的均匀分布中抽取。为了在算法中引入突变，我们在每次循环中将后验范围增加
    1%。结果，作为神经网络输入的模拟 SFS 随着算法每次迭代变得越来越类似于真实或观测 SFS。


