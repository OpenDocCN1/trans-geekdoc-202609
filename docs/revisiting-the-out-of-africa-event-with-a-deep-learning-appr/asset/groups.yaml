    在此模型中，基本非洲外出模型仍然成立，并添加了回非洲迁移所需的额外变化（图 1B）。基本思路源自 Poznik et al.。10 在此情景中，基础非洲外出人群在
    T_Sep 代前分裂为回非洲人群和非洲外出人群，这发生在欧洲和亚洲人群分裂之前（因此 T_Sep 在 T_B [非洲与非洲外出人群之间的分离时间] 和 T_EU_AS
    [欧洲与亚洲人群之间的分离时间] 之间）。接下来，回非洲人群迁移到非洲，其有效种群大小为 N_BC，并在 T_Mix 代前以 mix 的比例（即被替换的祖先非洲血统比例）与祖先非洲人群混合。混合后，非洲人群的有效种群大小从
    N_AF0 变为 N_AF。


    ### 混合的非洲外出（模型 M）


    该模型（图 1C）与模型 S 类似，并有一个额外的人群 M，其在 T_Sep 代前（同样在 T_B 和 T_EU_AS 之间）从非洲人群分离出来，有效种群大小为
    N_MX。M 在 T_Mix 代前与非洲外出人群混合，mix 是被 M 替换的非洲外出血统比例。混合后，非洲外出人群的有效种群大小从 N_B0 变为 N_B。基本思路源自两个非洲外出假设。7


