    # Results


    # ABC-DLS


    The general workflow for ABC-DLS (both for model selection and parameters estimation)
    includes the following steps. First, we simulated<sup>29</sup> multiple genetic
    datasets for each tested model by using demographic parameters sampled from a
    uniform distribution within prior ranges (Table 1). Next, we computed the SFS
    from these data and split the data into a training and a testing subset. We then
    trained the NN (implemented via TensorFlow with Keras backended<sup>42</sup>)
    on the former dataset to either select between demographic models or to estimate
    the demographic parameters. The resulting NN is applied to the testing dataset
    as well as to the observed summary statistics data (see below as well as material
    and methods for more details). Next, we applied ABC to estimate support for the
    NN prediction on the observed data by comparing the NN prediction outcome between
    the observed data and the testing dataset (see material and methods, Figure S2,
    and also our previous paper<sup>20</sup>). Finally, in cases when SMC is used,
    we essentially iterated the parameter estimation step by SMC. We kept the top
    five percent (equal to the tolerance level) of simulations from the testing dataset
    that best match the observed data. We then used the parameters of those simulations
    to update our prior range and sent it for next iteration until convergence was
    reached (Figures S3 and S4).


    Before testing our primary hypothesis on real sequence data, we tested whether
    our approach (DLS) can reproduce the known results. The predicted parameters for
    real sequence data (see below for more details) are consistent with previous works
    from the literature<sup>17,19,71</sup> (Table S7). We also tested our method on
    simulated data with known parameters under various models (model S, B, and M,
    see below for more information; simulation parameters coming from Tables 2, S5,
    and S6; and found that our approach with SMC correctly predicted the model in
    all the cases tested, suggesting it can find the correct model. Also, our method
    can infer the parameter values with high accuracy when the correct parameter values
    are known and coming from a mock observed SFS (Table S12).


