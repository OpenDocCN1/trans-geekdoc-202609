    暗示了一个更加复杂的模型。由于我们的主要目标是研究OOA事件，并对所有古代人种群给予同样的待遇（因为非洲古代人种群尚未测序），它们在模拟中被视为幽灵种群。我们独立处理每个数据集，仅保留每个个体中都存在基因型呼叫的双等位单核苷酸多态性（SNPs），并使用Picard工具将基因组位置提升至GRCh37坐标。接下来，我们采用了两种替代过滤方法：（1）过滤掉基因和CpG岛（更多详情，请参见Mondal等人，201920）和（2）对1000
    Genomes数据集（表S2中）应用来自SNPable43 的可比对性掩模。当CpG岛和基因的信息可用时，过滤策略1优于策略2。在缺乏这些信息的情况下（例如非人类遗传数据），我们的方法仍可使用过滤策略2复制类似结果。所有过滤均使用vcftools和bcftools进行。48,49
