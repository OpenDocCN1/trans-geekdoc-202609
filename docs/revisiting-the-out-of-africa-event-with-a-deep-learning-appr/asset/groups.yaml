    作为一种替代假设，我们还模拟了非洲人群的近期混合模型。在非洲外出人群与非洲人群分离后，后者在 T_Sep 代前分裂为两个亚种群 AF1 和 AF2，其有效种群大小分别为
    N_AF1 和 N_AF2。在 T_Mix 代前，这两个亚种群相互混合，使得 AF1 中等于 mix 的一部分被 AF2 替换。混合后，非洲人群的有效种群大小变为非洲现代的有效种群大小。我们在此情景中未模拟来自欧洲的新石器时代农民迁移。


