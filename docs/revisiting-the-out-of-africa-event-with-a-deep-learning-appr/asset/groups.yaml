    model rather than what is suggested by Cole et al., 2020.15 If we assume the model
    from Lipson et al. to be true, the most parsimonious explanation would be that
    our back to Africa population represents the basal West African population that
    separated from OOA populations 72.8 kya (T_Sep). Our ancient African represents
    ghost modern,16 which contributed to modern West African population around 10%
    through admixture around 61.9 kya from our prediction. On the other hand, if we
    assume true the back to Africa event happened, then most likely the OOA event
    took place less than 90 kya (T_B). This suggests that most of the older fossils
    (>100 kya) found outside of Africa 80–82 are unlikely to have contributed to OOA
    populations (assuming the main lineage of modern humans has not left Africa before
    that). Geographical location where back to Africa separated from OOA is immensely
    important for this hypothesis but cannot be estimated from our approach. It will
    be especially fascinating to test this hypothesis with ancient genomes originating
    at those areas from that time point when they will be available.


