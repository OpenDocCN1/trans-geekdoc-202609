    # # Revisiting the out of Africa event with a deep-learning approach


    Francesco Montinaro,1,2,6 Vasili Pankratov,1,6 Burak Yelmen,1,3,4 Luca Pagani,1,5
    and Mayukh Mondal1,*


    # ## Summary


    Anatomically modern humans evolved around 300 thousand years ago in Africa. They
    started to appear in the fossil record outside of Africa as early as 100 thousand
    years ago, although other hominins existed throughout Eurasia much earlier. Recently,
    several studies argued in favor of a single out of Africa event for modern humans
    on the basis of whole-genome sequence analyses. However, the single out of Africa
    model is in contrast with some of the findings from fossil records, which support
    two out of Africa events, and uniparental data, which propose a back to Africa
    movement. Here, we used a deep-learning approach coupled with approximate Bayesian
    computation and sequential Monte Carlo to revisit these hypotheses from the whole-genome
    sequence perspective. Our results support the back to Africa model over other
    alternatives. We estimated that there are two sequential separations between Africa
    and out of African populations happening around 60-90 thousand years ago and separated
    by 13-15 thousand years. One of the populations resulting from the more recent
    split has replaced the older West African population to a large extent, while
    the other one has founded the out of Africa populations.


    # ## Introduction


    Recent fossil record analysis suggests that Homo sapiens appeared around 300 thousand
    years ago (kya) in Africa.1 This hypothesis is corroborated by genetic data,2
    which estimated the deepest split between modern human populations at a similar
    time point. Although fossil records advocate at the occurrence of multiple out
    of Africa (OOA) events for modern humans,3 recent genetic studies revealed that
    all modern non-African populations tested so far fit a model with a single OOA
    event that happened less than 100 kya.4–6 This conclusion indicates that earlier
    OOA migrations, documented by archaeological records, might have not left a substantial
    contribution to modern human populations, with a possible exception of this model
    suggested in Papuan populations (two out of Africa model).7 While the single OOA
    model is generally supported by both autosomal and uniparental data,8–10 some
    observations may reflect a more complex scenario. For example, uniparental data
    show that most of the haplogroups found in OOA populations have a younger time
    to the most recent common ancestor (tMRCA) than those found in Africa, with the
    notable exception of the sister Y haplogroups D and E. Haplogroup D can be found
    in isolated populations in Asia (i.e., Andamanese, Tibetans, Japanese, etc.),
    while haplogroup E is ubiquitous in sub-Saharan African populations. These two
    haplogroups coalesce together before coalescing with any other haplogroup found
    in OOA populations.10,11 This observation might be explained by a back to Africa
    migration involving a population harboring the haplogroup E10 or a simple out


    of Africa with haplogroup E remaining in Africa but haplogroup D and other OOA
    haplogroups coming out of Africa together.12 Furthermore, some genetic analyses
    suggest that the separation between Africa and OOA populations might not be a
    single split event but rather that it was constituted by structure and admixture
    between populations.13–16


    Testing these hypotheses (single out of Africa, back to Africa, and two out of
    Africa) is challenging because of the strong bottleneck of non-African populations,17–19
    differential amount and source of archaic introgression,19,40,21 and several migrations
    within Africa.2,16 The lack of ancient genomic data older than 15 kya22 from Africa
    makes it difficult to address this issue from an ancient DNA perspective. However,
    neural networks (NNs) have been shown to be extremely powerful to disentangle
    such complex scenarios.20


    In the last few decades, the development of efficient and powerful computing infrastructure
    allowed us to gain substantial progress in the machine learning field, especially
    for computationally demanding algorithms such as NN23,24 and Bayesian methods.25,26
    NN has been demonstrated to be a useful tool for specific types of tasks, such
    as classification or natural language processing.23–25,27 However, NN requires
    a large amount of data as a training set. In some cases, this limitation can be
    overcome via the use of simulated data. Given that the modern tools allow for
    efficient simulation of large sets of synthetic genetic data,28,29 NN is already
    adopted in population genomics for interpretation of the genomic data in terms
    of underlying demography20,30,31 and positive selection.32,33


