    as DLS (Tables S15 and S16). We further tested these two models (BNDX and BNDXF)
    with more precise priors by using more simulated data (see material and methods
    for more details via DLS and rejected European Neolithic migration to Africa (Table
    S10). This result not only demonstrated the robustness of our inference for back
    to Africa but also independently supported other assumptions (except Neolithic
    migration) that were reported before, but not all of them were confirmed together.<sup>16,20,47,63,64,68,69</sup>
    In addition to the 15 models described above, we also tested the recent admixture
    model (model R), which adds a split and follows admixture within Africa, both
    happening after the separation of the OOA population on top of the simple out
    of Africa model. Thus, both our best back to Africa (BNDX) and recent admixture
    models represent the modern African population as a result of admixture of two
    components and the main difference is those separations happened before or after
    OOA population separation. Based on our results model, back to Africa better fits
    the data compared to recent admixture (Table S17).


    To independently validate our results, we compared effective population size trajectories
    and cross-coalescent rates obtained by applying Relate<sup>32</sup> to real data
    as well as to data simulated under each of the three models with the mean posterior
    parameters (Tables 2, S5, and S6) predicted by DLS.<sup>14</sup> We observe a
    close match between the estimates for the real data and our best model (Figure
    3), which suggests our parameter estimation to be accurate. This similarity is
    particularly interesting given that we have not used any linkage disequilibrium
    (LD)-based summary statistics to optimize those parameters. On the other hand,
    neither the effective population size trajectory nor the cross-coalescent rate
    over time is informative enough to differentiate between these three models (data
    not shown). Specifically, the gradual separation between African and OOA populations,
    which was shown before with Relate and similar methods,<sup>13,14</sup> cannot
    be directly explained by the back to Africa or two out of Africa migration, as
    such gradual separation is also observed in our model S (Figure S6). However,
    the two-dimensional tMRCA distributions of mutations in population pairs (CEU-YRI
    and CHB-YRI) coming from Relate analysis best matches the distribution of the
    back to Africa model with lower RMSD value than other alternatives when comparing
    with real data (Figures S4 and S5).


    ### Parameter estimation


    After demonstrating that back to Africa (BNDX) best explains the real data, we
    used the three methods described above (RF, DL, and DLS) to estimate the model’s
    parameters. The confidence intervals (CIs) returned by DLS are much narrower than
    those of the alternative approaches (Tables 2, S18, and S19). Hence, all the results
    discussed below are the ones obtained with DLS (Figure 2).


    ## Discussion


    We here demonstrated that the ABC analysis can be substantially enhanced by using
    NN coupled with the SMC approach. Our methodology is suitable to test many hypotheses
    that can be simulated but cannot be extensively tested by other methods, especially
    for scenarios of admixture from ghost populations where the ancient genomes are
    unavailable and can accommodate any kind of summary statistics. Our model selection
    shows it can easily reach close to 100% accuracy in cross-validation steps with
    few simulations (2,000 samples), suggesting it can be used for testing much more
    complicated scenarios. We also found that our parameter estimation has high precision
    (most of the events have confidence interval width

