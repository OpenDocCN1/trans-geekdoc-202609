- pgno: 1
  md: 'However, unlike classical approaches, it is still challenging to measure the
    significance of a prediction performed by NN given that it is a black-box approach.
    Approximate Bayesian computation (ABC) can be used to weigh the accuracy of a
    NN-based prediction from the data itself without knowing the maximum likelihood
    function.\(^{20,30,34}\) However, ABC may face the “curse of dimensionality” problem
    when high dimensional input data or summary statistics are used.\(^{35}\) It performs
    less efficiently when the harnessed summary statistics do not capture enough information.
    Here, we used NN to reduce the dimensionality of the original summary statistics
    and to produce highly informative secondary summary statistics, which is used
    as input by ABC to perform statistical analysis. Sequential Monte Carlo (SMC,
    also known as the particle filter method)\(^{36}\) is used to recursively predict
    posterior distribution from a prior. In every step, likelihood weight is calculated
    for each prior sample. Low likelihood samples are discarded, and new samples are
    resampled from a continuous distribution. In classical SMC, higher probability
    was given to newer samples, which have higher weights in resampling steps. The
    likelihood weights are calculated for all these samples and the cycle repeats
    until convergence is reached. SMC has a strong resemblance to genetic algorithms.\(^{37}\)
    It has been shown that ABC estimation can be further improved by the use of SMC,\(^{38–40}\)
    but to date they have not been used together with NN.


    Here, we present an improved version of ABC-DL (approximate Bayesian computation
    with deep learning)\(^{20}\) along with ABC-DLS (approximate Bayesian computation
    with deep learning and sequential Monte Carlo method), which allows us to infer
    the most likely scenario among different competing demographic models as well
    as to estimate their parameter values with high precision. Our approach relies
    on an NN trained on simulated genetic data under the models being tested. However,
    it has three key improvements compared to other similar approaches. First, the
    use of the hdf5\(^{41}\) data format and tensor flow\(^{42}\) allows for extremely
    large training datasets. Second, the conventional NN approach is improved with
    ABC, which helps to provide statistical support for the NN prediction and to obtain
    posterior distribution for the model parameter values. Third, inspired by previous
    works,\(^{38}\) we applied a modification of the SMC\(^{36}\) approach to iterate
    the whole procedure. This algorithm improved the prediction accuracy substantially
    compared to previously implemented methods.\(^{20,43}\) We apply this method to
    test the three OOA models mentioned above.


    # # Material and methods


    # ## Real data


    We have downloaded the high-coverage 1000 Genomes\(^{44}\) vcf files produced
    by the Coriell Institute for Medical Research. We randomly selected five individuals
    to represent Africa, Europe, and East Asia originating at Yoruba from Ibadan,
    Nigeria (YRI), Utah residents with European origin (CEU), and Chinese Han from
    Beijing (CHB)


    populations (15 individuals in total). As an alternative dataset, we have also
    downloaded the high-coverage human Genome Diversity Project (HGDP) vcf files\(^{45}\)
    and randomly selected five Yoruba (YRI), five French (FRN), and five Han Chinese
    (HAN) individuals representing Africa, Europe, and East Asia (Table S1). Unless
    mentioned otherwise, the results presented here were obtained on the first data
    set. In order to avoid introducing any bias by the including only a subset of
    mixing archaic humans due to availability of such genomes and mixing ancient genome
    with the modern humans, we decided not to use any ancient genome. Moreover, it
    is suggested that both Neanderthal and Denisova sequences, which are available,
    are distantly related with the introgressed populations,\(^{46,47}\) suggesting
    an even more complicated model. As our primary objective is with the OOA event
    and to give all archaic populations the same treatment (because African archaic
    populations are not yet sequenced), they are treated as ghost populations in our
    simulations. We treated each dataset independently and kept only bi-allelic single-nucleotide
    polymorphisms (SNPs) with genotype calls present in every individual and lifted
    the genomic positions to GRCh37 coordinates by using Picard tools. Next, we used
    two alternative filtering approaches: (1) filtering out genes and CpG islands
    (for more details, please see Mondal et al., 2019\(^{20}\)) and (2) applying a
    mappability mask coming from SNPable\(^{43}\) for the 1000 Genomes dataset in
    Table S2. Filtering strategy 1 will be preferable to 2 in the case that the information
    of CpG islands and genes are available. In the absence of those information (for
    example non-human genetic data), our method can still reproduce similar result
    with filtering strategy 2. All the filtering was performed with vcftools and bcftools.\(^{48,49}\)
    The vcf file was converted to joint unfolded site frequency spectrum (SFS) via
    an in-house code with scikit allel.\(^{50}\) For unfolded SFS, we need to know
    ancestral allele and derived allele for the real data (for simulation, it is already
    known). We used 1000 Genome ancestral allele alignments of fasta files to polarize
    the alleles to ancestral and derived. When ancestral allele information is not
    present for a given SNP, we have removed that SNP from our analysis.


    # ## Genotype to site frequency spectrum


    The SFS from the three populations (Africa, Europe, and East Asia) was computed
    as a tridimensional tensor from the sequenced or simulated data and further transformed
    into an array to be used as input by the NN. SFS is the total number of segregating
    sites for a given derived allele count present in each population.


    \(\text{SFS}(i, j, k) = \sum_{m=1}^n \begin{cases} 1, & \text{if } s_1 = i \text{
    and } s_2 = j \text{ and } s_3 = k. \\ 0, & \text{otherwise.} \end{cases}\)


    Where i, j, and k are the numbers of derived alleles count per SNP in pop1, pop2,
    and pop3, respectively, and n is the total number of segregating SNPs. The whole
    SFS was represented as a row. We multiplied all the elements of the real SFS by
    a constant (frac) to make it comparable with the length of simulated regions if
    those do not match. For example, we multiplied the real SFS by 100/647 (or 0.1546)
    if we simulate a 100 megabase pair (Mb) region per simulation and the real data
    is coming from 647 Mb region (after filtering). In general, it is possible to
    use any summary statistics for our approach. We used SFS for our choice of summary
    statistics because it is straightforward to obtain and informative enough.\(^{17,51}\)


    # ## Simulations


    All the simulations were done in msprime.\(^{29}\) We simulated 100, 500, 1,500
    or 3,000 1 Mb genomic regions per run (depending'
