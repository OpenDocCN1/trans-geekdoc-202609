  md: '![](img/d8139985bcfa7a5c6e5bde789c7d9fed_5_0.png)


    Figure 1. The simplistic schema of the models (A–C) Simple out of Africa (model
    S) (A), back to Africa (model B) (B), and out of Africa mixed (model M) (C). Please
    consult Table 1 for more details of time parameters (in y axis) and Table S10
    for the interdependencies of those parameters. AFR is African, EUR is European,
    and ASN is East Asian. X is African archaic, N is Neanderthal, and D is Denisova.


    Simulations from every step were stored and re-used in subsequent cycles if their
    parameter values fell inside the new prior range. A flow chart of this strategy
    can be found in Figure S2C.


    We used 10,000 simulations as a training dataset and 10,000 simulations for testing.
    The NN model is exactly as before (as used in DL, Figure S1). To make it more
    efficient, we started with simulating a total length of 100 Mb (each simulated
    region being 1 Mb long), and then we increased the total length stepwise (i.e.,
    0.5, 1.5, and 3 Gb). The priors for 100 Mb regions are the same as presented in
    Table 1. The final posterior (after convergence reached) of the run with 100 Mb
    is used as a prior for 0.5 Gb simulation and so on. We multiplied the observed
    SFS by frac accordingly to scale it to the simulated region length.


