    unavailable and can accommodate any kind of summary statistics. Our model selection
    shows it can easily reach close to 100% accuracy in cross-validation steps with
    few simulations (2,000 samples), suggesting it can be used for testing much more
    complicated scenarios. We also found that our parameter estimation has high precision
