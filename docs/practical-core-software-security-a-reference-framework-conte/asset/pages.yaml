  md: '# Chapter 2


    # The Security Development Lifecycle


    # CHAPTER OVERVIEW


    We start this chapter by introducing the concept of overcoming the challenges
    of making software secure using a security development lifecycle (SDL). There
    will be further discussions of the models, methodologies, tools, human talent,
    and metrics for managing and overcoming these challenges. We will close with a
    discussion of the mapping of our SDL with its associated best practices to a generic
    software development life cycle (SDLC), which will be the subject of the next
    six chapters, followed by a chapter mapping our SDL best practices to several
    of the most popular software development methodologies.


    There is still a need for better static and dynamic testing tools and a formalized
    security methodology integrated into SDLCs that is within the reach of a majority
    of software development organizations. In the past decade or so, the predominant
    SDL models have been out of reach for all but the most resource-rich companies.
    Our goal in this book is to create an SDL based on leveraged minimal resources
    and best practices rather than requiring resources that are out of reach for a
    majority of software security teams.


    # CHAPTER TAKE-AWAYS


    +   - Explain the underlying challenges in creating secure software as they exist
    in processes, talent, and technology.

    +   - Distinguish between the industry maturity models used for measuring the
    progress of software security programs and the metrics needed for measuring progress.

    +   - Compare and contrast various industry standards, guidance, and best practices
    for secure software development programs.'
