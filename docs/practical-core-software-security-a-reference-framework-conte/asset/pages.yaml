    +   5. Auditing and logging is enabled across the tiers on multiple servers.


    After you have identified the software threats and associated mitigation strategies
    and ranked the risks, it is possible to identify a mitigation threat profile for
    each threat that has been identified through the threat modeling/architecture
    security analysis process. The following criteria are used to categorize your
    final list from this process:


    +   • **Fully mitigated threats:** Threats that have appropriate countermeasures
    in place and do not expose vulnerability or cause impact.

    +   • **Partially mitigated threats:** Threats partially mitigated by one or more
    countermeasures, which represent vulnerabilities that can only partially be exploited
    and cause a limited impact.

    +   • **Nonmitigated threats:** Threats that have no countermeasures and represent
    vulnerabilities that can be fully exploited and cause an impact.³²


    Now that you have categorized your threats in one of the three categories above,
    you have a choice to make concerning what strategy you are going to pursue. Your
    choices of action will likely fall under one of the following five options:


    +   1. Do nothing: for example, hope for the best.

    +   2. Inform about the risk: for example, warn your user population about the
    risk.

    +   3. Mitigate the risk: for example, by putting countermeasures in place.

    +   4. Accept the risk: for example, after evaluating the impact of the exploitation
    (business impact).

    +   5. Transfer the risk: for example, through contractual agreements and insurance.³³


    Your decision as to which of the strategies listed above will be used will depend
    on several factors:


    +   • The impact an exploitation of a threat can have

    +   • The likelihood of its occurrence

    +   • The costs for transferring (i.e., costs for insurance) or avoiding (i.e.,
    costs or losses due to redesign) it³⁴


    Risk in this sense is an identified threatening situation due to the potential
