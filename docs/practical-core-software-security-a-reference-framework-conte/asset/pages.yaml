- pgno: 29
  md: 'patching vulnerable software after release and can be a costly way of securing
    applications. Furthermore, patches are not always applied by owners/users of the
    vulnerable software; and patches can contain yet more vulnerabilities.\(^{14}\)
    We have seen patches that fix one security problem but can open (or re-open) other
    security issues. Companies are not always able to give each patch (fix) the attention
    it deserves, or it may not go through the regular software development life cycle,
    resulting in more security problems than the patch/fix is designed to mitigate.


    For a number of years, the information security industry has focused on network
    and application security, assuming that software is secure and their security
    controls are all that is needed, instead of actually protecting organizations
    against software security failures. As we review the security development lifecycle
    and its associated best practices in this book, it should be clear that the network
    and application should come later in a comprehensive and layered defense-in-depth
    security program, and that software security should be considered the first step
    in the information security lifecycle, not the last. In a nutshell, network and
    application security programs are more about compensating controls, but it is
    only through addressing security at the source that we can really address problems.


    # 1.2 Software Security and the Software Development Life Cycle


    One significant area of confusion in the security industry over the years has
    been a misunderstanding of the difference between software security and application
    security. Gary McGraw has provided an excellent description of the difference
    between the two:


    > On one hand, **software** security is about building secure software: designing
    software to be secure; making sure that software is secure; and educating software
    developers, architects, and users about how to build security in. On the other
    hand, **application** security is about protecting software and the systems that
    software runs in a post-facto, only after development is complete.\(^{15}\)


    Software security has come a long way since first attacks on a reasonably large
    scale started to materialize toward the end of the 1980s. Software back then was
    written without much thought for security (e.g., UNIX code, TCP/IP stack). After
    the advent of Microsoft Windows\(^\circledR\) and then the Web, attacks started
    increasing in sophistication and frequency, and thus it became necessary to look
    at software security. Industry started to look for short-term fixes through various
    “add-ons.” These resulted in anti-virus, firewalls, anti-spyware, and so on. However,
    the real issue—how code was being developed and written—was not addressed. This
    started to change only in the last decade when SDL practices started to be taken
    seriously. Many enterprises impacted by software security defects (e.g., Microsoft)
    started to look seriously at how to build security in software code by improving
    software development practices. This resulted in recommended SDL practices from
    academia and software giants such as Microsoft. We now had the theory and guidelines
    on how to build security into the code from the start and thus lessen the possibility
    of software loopholes that could be exploited by attackers.


    Confidentiality, integrity, and availability are the three primary goals that
    the industry considers to be of the utmost importance in any secure software development
    process. What the developers do to protect, enforce, and ensure these primary
    goals will equate to the “justifiably high confidence” part of the secure code
    definition. A developer can write very efficient'
