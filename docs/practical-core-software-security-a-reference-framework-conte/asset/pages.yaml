  img_proc: true
- pgno: 41
  md: 'development organizations outside of Microsoft. The model helps those responsible
    for integrating security and privacy in their organization''s software development
    life cycle to assess their current state and to gradually move their organizations
    toward adoption of the proven Microsoft program for producing more secure software.


    The SDL Optimization Model enables development managers and IT policy makers to
    assess the state of the security in development. They can then create a vision
    and roadmap for reducing customer risk by creating more secure and reliable software
    in a cost-effective, consistent, and gradual manner. As it moves through the maturity
    levels of the SDL Optimization Model, your organization''s executive commitment
    to the goals and results of SDL will increase from tentative acceptance to a strong
    mandate.⁶


    # ## 2.2 Software Security Maturity Models


    Over the years, two popular software security maturity models have been developed
    and continue to mature at a rapid rate. One is BSIMM,⁷ and the other is the OWASP
    Open SAMM.⁸ BSIMM is short for Building Security In Maturity Model. The BSIMM
    is a study of real-world software security initiatives organized so that you can
    determine where you stand with your software security initiative and how to evolve
    your efforts over time. It is a set of best practices developed by analyzing real-world
    data from nine leading software security initiatives and creating a framework
    based on common areas of success. There are 12 practices organized into four domains.
    These practices are used to organize the 122 BSIMM activities.


    By studying what the nine initiatives were doing, BSIMM''s creators were able
    to build a best practices model that is broken down into 12 categories that software
    makers can follow:


    +   1. Strategy and Metrics

    +   2. Compliance and Policy

    +   3. Training

    +   4. Attack Models

    +   5. Security Features and Design

    +   6. Standards and Requirements

    +   7. Architecture Analysis

    +   8. Code Review

    +   9. Security Testing

    +   10. Penetration Testing

    +   11. Software Environment

    +   12. Configuration and Vulnerability Management⁹


    The 12th release of BSSIM was published in 2021.¹⁰


    The OWASP Software Assurance Maturity Model (SAMM™) is a flexible and prescriptive
    framework for building security into a software development organization. Covering
    more than typical SDLC-based models for security, SAMM enables organizations to
    self-assess their security assurance program and then use recommended roadmaps
    to improve in a way that is aligned to the specific risks facing the organization.
    Beyond that, SAMM enables the creation of scorecards for an organization''s effectiveness
    at secure software development throughout the typical governance, development,
    and deployment business functions. Scorecards also enable'
