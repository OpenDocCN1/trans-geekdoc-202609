- pgno: 71
  md: '# Chapter 3


    # Security Assessment (A1): SDL Activities and Best Practices


    # CHAPTER OVERVIEW


    In Chapter 3, we introduce the first phase of our security development lifecycle
    (SDL). This phase (A1) is called Security Assessment. We will describe different
    activities within this phase, why it is important, and then walk the reader through
    key success factors, deliverables, and metrics from this phase.


    # CHAPTER TAKE-AWAYS


    +   - Explore the practices that compose the Security Assessment (Phase A1) of
    the security development lifecycle (SDL).

    +   - Document the key success factors for completion of Phase A1.

    +   - Create initial, draft deliverables for Phase A1 for the case study in Appendix
    A.

    +   - Prepare an initial Privacy Impact Assessment (PIA) plan for the case study
    in Appendix A.


    # 3.1 Software Security Team Is Looped in Early


    Security Assessment (A1) is the first phase of our SDL (see Figure 3.1). This
    is the phase in which the project team identifies the product risk profile and
    the needed SDL activities; in some SDLs, it is called the discovery phase. An
    initial project outline for security milestones and controls is developed and
    integrated into the development project schedule to allow proper planning as changes
    occur. Throughout this phase, four principal questions should be addressed to
    determine what is required to ensure the security of the software:'
  merge: -1
  img_proc: true
