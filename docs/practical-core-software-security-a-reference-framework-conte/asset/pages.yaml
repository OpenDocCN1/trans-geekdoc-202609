- pgno: 40
  md: '+   - Understand the need for specialized development team roles that enable
    secure software development success.

    +   - Explore the various implementations of software development life cycles
    and methodologies, along with the steps needed to convert them into a security
    development lifecycle.


    # ## 2.1 Overcoming Challenges in Making Software Secure


    As mentioned in Chapter 1, SDLs are the key step in the evolution of software
    security and have helped to bring attention to the need to build security into
    the software development life cycle. In the past, software product stakeholders
    did not view software security as a high priority. It was believed that a secure
    network infrastructure would provide the level of protection needed against malicious
    attacks. In recent history, however, network security alone has proved inadequate
    against such attacks. Users have been successful in penetrating valid channels
    of authentication through techniques such as Cross-Site Scripting (XSS), Structured
    Query Language (SQL) injection, and buffer overflow exploitation. In such cases
    system assets were compromised and both data and organizational integrity were
    damaged. The security industry has tried to solve software security problems through
    stopgap measures. First came platform security (OS security), then came network/perimeter
    security, and now application security. We do need defense-in-depth to protect
    our assets, but fundamentally it is a software security flaw and needs to be remediated
    through an SDL approach.


    The SDL has as its base components all of the activities and security controls
    needed to develop industry and government-compliant and best practices-hardened
    software. A knowledgeable staff as well as secure software policies and controls
    are required in order to truly prevent, identify, and mitigate exploitable vulnerabilities
    within developed systems.


    Not meeting the least of the activities found within the SDL provides an opportunity
    for misuse of system assets from both insider and outsider threats. Security is
    not simply a network requirement, it is now an information technology (IT) requirement,
    which includes the development of all software for the intent to distribute, store,
    and manipulate information. Organizations must implement the highest standards
    of development in order to ensure the highest quality of products for its customers
    and the lives of that they protect.


    Implementation of an SDL program ensures that security is inherent in good enterprise
    software design and development, not an afterthought included later in production.
    Taking an SDL approach yields tangible benefits such as ensuring that all software
    releases meet minimum security criteria, and that all stakeholders support and
    enforce security guidelines. The elimination of software risk early in the development
    cycle, when vulnerabilities are easier and less expensive to fix, provides a systematic
    approach for information security teams to collaborate with during the development
    process.


    The most well-known SDL model is the Trustworthy Computing Security Development
    Lifecycle (or SDL), a process that Microsoft® has adopted for the development
    of software that needs to withstand a malicious attack. Microsoft’s SDL¹ has been
    evolving for over a decade and is considered the most mature of the top three
    models. Other popular SDL models are the BSIMM SSDL Touchpoints,² the OWASP® Code
    Review Guide,³ and the Cisco® Secure Development Lifecycle (Cisco SDL).⁴


    The Microsoft SDL also has a Security Development Lifecycle (SDL) Optimization
    Model⁵ designed to facilitate gradual, consistent, and cost-effective implementation
    of the SDL by'
