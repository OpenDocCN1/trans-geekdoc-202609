    be of concern for those managing the SDL where open-source software is used as
    part of the product or solution are license compliance and security.


    The privacy requirements must be satisfied before the software can be released.
    Privacy requirement verification is typically verified concurrently with the final
    security review and, in many cases, is now considered part of the same process.


    # 7.1 A5 Policy Compliance Analysis


    As discussed for SDL Phases (A1)–(A4), SDL policy compliance covers all projects
    that have meaningful security and privacy risks and is analyzed in each phase
    and updated to cover new threats and practices. Specifically, activities and standards
    in the policy have been refreshed in each SDL phase, and they have incorporated
    lessons learned from root-cause analysis of security incidents, adapted to the
    changing threat environment, and will have resulted in tools and technique improvements.
    During the subsequent phases, SDL policy compliance has been tracked and, if needed,
    exceptions have been issued for high-risk projects. From the beginning of the
    SDL process, the SDL policy has formally defined which projects qualify for SDL
    mandates and what the requirements are for compliance. This policy has become
    a significant part in the governance of the SDL process in that it:


    +   - Standardizes the types of projects that fall under the SDL mandate and activities.

    +   - Defines the policy and processes that must happen at each phase of the SDL/SDLC
    for project compliance.

    +   - Sets the requirements for the quality gates that must be met before release.


    In the final policy compliance analysis, the policy will be reviewed to ensure
    that it provides specific requirements based on different development criteria,
    such as product type, code type, and platform.


    # 7.2 Vulnerability Scan


    Although there is no substitute for actual source-code review by a human, automated
    tools do have their advantages and can be used to save time and resources. They
    are particularly useful'
  merge: -1
