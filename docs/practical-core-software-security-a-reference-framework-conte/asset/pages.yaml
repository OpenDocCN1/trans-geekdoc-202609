    +   - If the cost of remediation is considered unacceptable by the business and
    there are no customer, industry, or regulatory requirements that require that
    security vulnerability or flaws be fixed, then the senior management for the business
    unit developing the software and possibly the head of the software engineering
    development organization and legal counsel will be required to sign off on accepting
    the risk for continued use of the legacy software.


    # ## 8.6.2 Mergers and Acquisitions (M&As)


    To be competitive, most companies want to develop new products and access new
    markets and will seek alternatives, such as a merger and acquisition (M&A), when
    they cannot do this with their current resources. M&As occur for many reasons
    but are typically driven by the desire to improve competitiveness, profitability,
    or other value to the company and its products. In the software world, this is
    typically a function that you need in your solution set or in the product itself.
    The talent that may come with acquisition will be a bonus if the primary focus
    of the M&A is the software of the target company. The activities of an M&A start
    when the initial discussions for the M&A begin and continue through the due diligence
    phase and on to the integration of the target company and/or the acquired technology
    into the parent company. The level of effort and scope of work in the process
    will depend on the size and complexity of the effort. It should be noted that
    M&As do not always include all of the resources of the target company. They may
    include the code for one software product, or multiple technologies or products
    that are attractive and of value to the acquiring company.


    The due-diligence phase of an M&A is critical, and security plays a vital role
    in helping make it successful. If software is included as part of the M&A, a security
    architectural review and use of automated tools will be required. This may be
    done either through the use of the potential acquirer’s software security staff
    or through a third party, depending on the restrictions that are imposed as part
    of the assessment and whether source code can be reviewed. Due to the proprietary
    nature of source code, most target companies with not allow a review of their
    source code during the M&A assessment process. Thus, an automated tool will be
    needed that can conduct comprehensive code review via static binary analysis.
    This is done by scanning compiled or “byte” code at the binary level rather than
    reviewing source code and typically includes static, dynamic, and manual techniques.


    Perhaps the best checklist for conducting a M&A software security assessment can
    be found in Table 1, “Software Assurance (SwA) Concern Categories,” and Table
    2, “Questions for GOTS'
