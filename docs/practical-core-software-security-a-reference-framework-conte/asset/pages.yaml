    # 7.5 Final Security Review


    During the final security review of software being developed, all of the security
    activities performed, including threat modeling, tools output, and performance
    against requirements defined early in the process, are assessed again to determine
    whether the software product is ready for release and shipping. This process will
    result in one of three outcomes:


    +   1. **The final security review is passed.** In this case, all final security
    review issues that have been identified have been corrected, the software is certified
    to have met all SDL requirements, and it is ready for release from a security
    perspective.


    +   2. **The final security review is passed with exceptions.** In this case,
    not all issues that have been identified have been corrected, but an acceptable
    compromise has been made for one or more exceptions that the SDL and development
    team were not able to resolve. As exceptions, the unresolved issues will not be
    resolved in the current release and will be addressed and corrected in the next
    patch or release.


    +   3. **The final security review is not passed and requires an escalation.**
    In this case, the SDL and development team cannot reach a compromise on a specific
    security vulnerability and its remediation, and so the software cannot be approved
    for release and shipment. There is typically a business justification identified
    earlier in the SDL process that prevents the identified issue from being compliant
    with an SDL security requirement. The SDL requirements that are blocking the release
    cannot be resolved by the two teams and must be escalated to higher management
    for a decision, which of course will take into account the risk and consequences
    identified if the software is released without meeting the requirement. The escalation
    to management should be a consolidated report composed by both the SDL and development
    teams that includes a description and rationale of the security risk.'
