- pgno: 254
  md: 'a step-by-step process for software security that is relevant to today’s technical,
    operational, business, and development environments. We have focused on what humans
    can do to control and manage a secure software development process in the form
    of best practices and metrics. Although security is not a natural component of
    the way industry has been building software in recent years, the authors believe
    that security improvements to development processes are possible, practical, and
    essential. We believe that the software security best practices and model presented
    in this book will make this clear to all who read the book, including executives,
    managers, practitioners, and students.


    When it comes to cyber security, we believe it is all about the software and whether
    it is secure or not. You can have the world’s best client, host, and network security,
    including encrypted transmission and storage of data, but if software application
    vulnerabilities exist and can be exploited, your defense-in-depth security approach
    has just become a speed bump to the inevitable. As the old adage goes, you are
    only as good as your weakest link, and in today’s world, that is still the software;
    and software permeates everything we do, from defense to medicine, industry, banking,
    agricultural, transportation, and how we manage and live our lives. This is a
    very serious and daunting vulnerability. You only have to look at how many years
    the same software vulnerabilities have remained on the CVE Top 25 or OWASP and
    SANS Top 25 to realize that organizations are still not taking software security
    seriously. Even worse, experienced and professional adversaries will target vulnerable
    software and don’t necessarily need it to be Internet-enabled to be at risk—that
    just makes the exploitation easier. But software is still the primary target because
    if you can own the software, you can own the data and the processes that it controls.
    In today’s world, this can result in life-threatening and serious local, regional,
    and global consequences. Throughout this book, we have described the SDL best
    practices and metrics to optimize the development, management, and growth of a
    secure software development life cycle (SDLC) and program to maximize the mitigation
    of this type of risk. Managing software security is an area that the authors live
    in on a daily basis, and this book is based on our real-world experiences. We
    have worked with Fortune 500 companies and have often seen examples of the breakdown
    of security development lifecycle (SDL) practices. In this book, we have taken
    an experience-based approach to applying components of the best available SDL
    models in dealing with the problems described above in the form of an SDL software
    security best practices model and framework. Most important, our SDL best practices
    model has been mapped to the standard model for an SDLC, explaining how you can
    use this to build and manage a mature SDL program. Although security issues will
    always exist, the purpose of this book has been to teach you how to maximize an
    organization’s ability to minimize vulnerabilities in your software products before
    they are released or deployed, by building security into the development process.
    We hope you enjoyed reading this book as much as we have writing it, as we are
    passionate about our efforts to help alleviate the risk of vulnerable software
    in the world at large and, specifically, in our our readers’ organizations.


