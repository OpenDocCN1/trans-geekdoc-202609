- pgno: 206
  md: '# 8.2.3 Optimizing Post-Release Third-Party Response


    Collaboration between different teams and stakeholders provides the best possible
    chance of success of post-release response. The collective of software security
    champions, software security evangelists, and an ongoing formal software security
    programmatic relationship with the software development product managers and quality
    team to support and collaborate with the centralized software security team as
    proposed in this book provides several distinct advantages over teams solely dedicated
    to handle post-release PSIRT and privacy support:


    +   - Direct PSIRT and privacy response ownership is achieved by embedding these
    functions into the engineering and development groups directly responsible for
    fixing the product directly affected by the discovered vulnerability or privacy
    issue.

    +   - Direct knowledge of the code, architecture, and overall software product
    design and functionality with a direct influence on the remediation process will
    result in increased efficiency, control, and response over an external organizational
    entity without direct knowledge of the product. Essentially, this removes the
    middleman and streamlines the process.

    +   - This process provides for better return on investment (ROI) for both the
    PSIRT and the privacy response function through the leverage of resources and
    direct knowledge of the software product at the source through the direct involvement
    and ownership by the development teams.

    +   - Direct empowerment of the development teams and project managers, their
    more direct ownership of the remediation process, and a centralized software security
    group embedded in the engineering/software development group provide single-organizational
    responsibility for the response.

    +   - Software security champions and software security evangelists operate locally
    with the software product manager and appropriate product development resources
    to directly drive the assessment and remediation (if needed) of the claimed vulnerability
    by an external discoverer.

    +   - All the above result in faster time to execution and response and, most
    important, help speed up the mitigation of negative press exposure and customer
    risk. We believe there is an advantage to our proposed organizational infrastructure
    in providing a cost-effective, minimal resource, and efficient way to respond
    to this type of incident while reducing the burden on resources dedicated to the
    development of the software itself.


    # 8.3 PRSA2: Third-Party Reviews


    Over the last few years, customers of software vendors have increasingly requested
    independent audits to verify the security and quality of software applications
    that they have either purchased or are evaluating for purchase. Software vulnerabilities
    have increasingly been tied to high-profile data breaches over the last few years
    and have resulted in more customers requiring independent and visible proof that
    the software they purchase is secure. This, of course, has helped put pressure
    on companies that develop software to ensure that the secure software development
    processes are built into the SDLC to avoid the very costly discovery of'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'vulnerabilities that are caught post-release—often a sign of an immature, ineffective,
    or non-existent software security program. Because of the preponderance of post-release
    code having security vulnerabilities and privacy issues that should have been
    caught during development, third-party assessment of post-release or near-release
    code has become the norm in the industry, whether the company producing the software
    has a reputation for producing secure code or not. In some cases, it is demanded
    by the prospective or current customer, and in other cases, it is conducted proactively
    by the company producing the code.


    Even for companies that have outstanding software security programs, software
    applications can alternate in and out of compliance with policies or regulatory
    requirements over long periods of time for a variety of reasons. For example,
    a new functionality or use case in a new version of the application may introduce
    new vulnerabilities or planes of attack, causing the application to drop out of
    compliance. Additionally, these requirements may change over time. Many companies
    use third-party code reviews to help identify these situations rather than spend
    the limited resources of their internal teams.


    Third-party testing should include testing the entire stack, not just your product.
    That means performing testing as outlined in earlier chapters as well as continuous
    post-release testing. At a minimum, post-release testing should include annual
    penetration testing (application and software stack). Any new code released after
    initial release should follow the SDL requirements outlined in previous chapters.


    The biggest challenge is to do this in a timely and cost-effective manner while
    also protecting the source code and other intellectual property during the process.
    Some of the choices for third-party testing include the following.


    +   1. Hand over source code to a third party for inspection. This is not a real
    option for those who want to protect the most precious intellectual property that
    a software development organization possesses—their source code.


    +   2. Contract manual penetration testing services that can also do deep-dive
    code and software architectural design reviews for each new release. To avoid
    the risk of source code leaving the control of the company that is developing
    it, contractors must be required to work on-site in a controlled environment,
    under special nondisclosure agreements and under specific guidelines. These typically
    include a source-code protection policy and IP protection guidelines. An alternative
    to this approach is to employ a company that uses tools that require the exposure
    of binary code only. In this case, the contractor inspects the application at
    the same level as it is attacked—the binaries—and can ensure that all threats
    are detected. This type of testing can be done on-site or remotely as a service.


    +   3. Purchase, install, and train development teams to use on-premise tools
    and function as lower-level software security architects as an extension of the
    software security group to conduct the “people side” of the software security
    architectural review. Then invite auditors into your organization to document
    your processes. Many mature software security organizations have done this. A
    mature software security program such as that described in this book will help
    scale and reduce the need for additional headcount to do this work. Building this
    into your SDL/SDLC process is a cost-effective, efficient, and manageable way
    to do this.


    +   4. Require third-party suppliers of code in your application to do the same.
    In today’s software development environments, a majority of software development
    organizations make use'
