- pgno: 44
  md: 'The Department of Homeland Security Software Assurance (SwA) Program seeks
    to reduce software vulnerabilities, minimize exploitation, and address ways to
    improve the routine development and deployment of trustworthy software products.
    Consistent with the Open Government Directive, the program enables public–private
    collaboration in developing, publishing, and promoting the use of practical guidance
    and tools, fostering investment in more secure and reliable software. The DHS
    Software Assurance Program collaborates with the private sector, academia, and
    other federal departments and agencies to enhance the security of software life
    cycle processes and technologies through activities such as the Software Assurance
    Forum that it co-sponsors with the Department of Defense (DoD) and the National
    Institute of Standards and Technology (NIST). A key initiative funded by the DHS
    and the National Security Agency (NSA) is the Common Weakness Enumeration (CWE™).
    CWE is a joint effort of the DHS with the NSA and the software community, including
