  img_proc: true
- pgno: 221
  md: '![](img/a54ed04827050a271316d34985425127_221_0.png)


    Figure 9.1 Agile/Scrum framework (Source: Neon Rain Interactive, licensed under
    CC BY-ND 3.0 NZ).


    Now, development teams and operations teams work together as partners for ongoing
    operations, enhancements, defect removal, and optimization of resources as they
    learn how their product operates in the real world.


    As AppSec professionals engage in the planning for continuous integration/continuous
    deployment (CI/CD), DevOps, and new models for data center operations, DevOps
    began to transform into what we''ll call DevSecOps.


    Figure 9.1 is a simple depiction of how Agile and DevOps work in unison.²


    Figure 9.2 shows what the marriage of Dev and Ops teams looks like when comprehensive
    security controls transform DevOps into DevSecOps.³


    # 9.1.3 Cloud


    As organizations migrated to new uses of cloud technology, such as Platform as
    a Service (PaaS), Infrastructure as a Service (IaaS), and containerization, it
    became obvious that a lift and shift strategy was not going to fly. Rather, these
    new ways of operating data centers required rethinking how applications are built,
    deployed, and used. Large, monolithic applications started undergoing a refactoring
    process to break up the applications. This activity involves isolating functions
    (services) around a central concept or entity—for example, one microservice might
    deal with all the functions needed to create a client entity, another microservice
    might represent the sales entity, yet another might represent order processing,
    and so on. These microservices are activated using an application programming
    interface (API) that describes what functions are available to access and what
    attributes are involved. These APIs are most often developed using the representational
    state transfer,⁴ or REST, architectural style.'
  merge: -1
  img_proc: true
