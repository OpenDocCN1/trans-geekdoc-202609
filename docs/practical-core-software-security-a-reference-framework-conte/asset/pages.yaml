  md: 'and simple back doors. A source code emitter can use the model to generate
    a human-readable source code representation of the program’s behavior, enabling
    manual code review for design-level security weaknesses and subtle back doors
    that cannot be found by automated scanners.


    +   • **Byte code analysis (black box).** Byte code scanners are used just like
    source-code security analyzers, but they detect vulnerabilities in the byte code.
    For example, the Java® language is compiled into a platform-independent byte code
    format that is executed in the runtime environment (Java Virtual Machine). Much
    of the information contained in the original Java source code is preserved in
    the compiled byte code, thus making de-compilation possible. Byte code scanners
    can be used in cases where the source code is not available for the software—for
    example, to evaluate the impact a third-party software component will have on
    the security posture of an application.


    +   • **Black-box debugging (black box).** Debuggers for low-level programming
    languages such as C or ASM are software tools that enable the tester to monitor
    the execution of a program, start and stop a program, set breakpoints, and modify
    values. Debuggers are typically used to debug an application when the source code
    or the compiler symbols are available. The source-code and compiler symbols allow
    information, the values of internal variables, to be tracked and discover some
    aspect of internal program behavior. However, sometimes only the binary is available,
    and the binary was compiled from code with no compiler symbols or debug flags
    set. This is typical in commercial software, legacy software, and software that
    implements protective measures, such as code obfuscation, to prevent reverse engineering.
    In this case, traditional debugging is not possible. It should be noted that if
    the focus of debugging effort is on the software interaction with an external
    component, the binary may be all that is needed.


    +   • **Vulnerability scanning (black box).** Automated vulnerability scanning
    of operating system and application-level software involves the use of commercial
    or open-source scanning tools that observe executing software systems for behaviors
    associated with attack patterns that target specific known vulnerabilities. Like
    virus scanners, vulnerability scanners rely on a repository of “signatures,” in
    this case indicating recognizable vulnerabilities. Like automated code review
    tools, although many vulnerability scanners attempt to provide some mechanism
    for aggregating vulnerabilities, they are still unable to detect complex vulnerabilities
    or vulnerabilities exposed only as a result of unpredictable (combinations of)
    attack patterns. In addition to signature-based scanning, most vulnerability scanners
    attempt to simulate the reconnaissance attack patterns used by attackers to “probe”
    software for exposed, exploitable vulnerabilities.


    +   • **Penetration testing (black box).** The portion of security testing in
    which the evaluators attempt to circumvent the security features of a system.
    The evaluators might be assumed to use all systems design and implementation documentation,
    which can include listings of system source code, manuals, and circuit diagrams.
    The evaluators work under the same conditions as are applied to ordinary users.9–12


    The test plan organizes the security testing process and outlines which components
    of the software system are to be tested and what test procedure is to be used
    on each one. The outline is more than just a list of high-level tasks to be completed;
    it should also include which artifacts are to be tested, what methodologies are
    to be used, and a general description of the tests'
