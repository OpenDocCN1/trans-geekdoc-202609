  md: '# # Appendix B


    # # Answers to Chapter Quick-Check Questions


    Appendix B provides the questions from each chapter''s Quick-Check with the correct
    answers shown in **bold** to help you check your own understanding.


    # ## Chapter 1


    +   1. The costs to remediate security flaws once a software product is released
    can run as much as ____ times the costs to remediate them while still in development:

    +      a. 50

    +      b. **100**

    +      c. 500

    +      d. 1500


    +   2. Defective software is:

    +      a. A network security problem

    +      b. An operating system security problem

    +      c. A user-caused problem

    +      d. **A software development and engineering problem**


    +   3. The three goals of the security development lifecycle are:

    +      a. Reliability, efficiency, and maintainability

    +      b. Speed, quality, and continuous releases

    +      c. **Confidentiality, integrity, and availability**

    +      d. Availability, reliability, and portability'
  merge: -1
  img_proc: true
- pgno: 260
  md: '4. Threat modeling and attack surface analysis is most effective when it''s
    conducted:


    +   a. Post-release

    +   b. **During product inception/product backlog development**

    +   c. During integration testing phase(s)

    +   d. Prior to code development/commitment


    # Chapter 2


    1. The paradigm of Building Security In begins with the:


    +   a. Analysis phase

    +   b. Design phase

    +   c. **Specification phase**

    +   d. Development phase


    2. The objectives of an SDL are to achieve all of the following except:


    +   a. To reduce the number of security vulnerabilities in software

    +   b. To reduce the severity of security vulnerabilities in software

    +   c. To eliminate threats to the software

    +   d. **To document a complete understanding of the vulnerabilities in software**


    3. The fundamental approach to security in which an object has only the necessary
    rights and privileges to perform its task with no additional permissions is a
    description of:


    +   a. Layered security

    +   b. **Least privilege**

    +   c. Role-based security

    +   d. Clark-Wilson model


    4. Which of the following statements best describes BSIMM?


    +   a. BSIMM is used to measure the maturity of a software assurance program by
    looking for evidence of security best practices in the SDLC.

    +   b. BSIMM is used to measure the maturity of a software assurance program by
    looking for evidence of security procedures in the SDLC.

    +   c. **BSIMM is used to measure the maturity of a software assurance program
    by looking for evidence of security activities in the SDLC.**

    +   d. BSIMM is used to measure the maturity of a software assurance program by
    looking for evidence of security requirements in the SDLC.


    # Chapter 3


    1. The purpose for the discovery meeting with stakeholders early in the development
    life cycle is to:


    +   a. Discover who is on the development team'
  merge: -1
  img_proc: true
- pgno: 261
  md: '+   b. Discover what budgets and resources are available to the initiative

    +   c. **Discover how security can be built into the development process from
    the start**

    +   d. Discover which platforms and languages will be used for development of
    the application


    +   2. A Privacy Impact Assessment (PIA) is needed to:

    +   a. Identify laws and regulations related to the controls needed for the application

    +   b. Identify the data elements and their sensitivity for proper selection of
    security controls

    +   c. Identify communications and platform controls to apply to data in acquisition,
    processing, and storage

    +   d. None of the above

    +   e. **All of the above**


    +   3. A threat profile developed in Phase A1 serves as input to which subsequent
    development activities?

    +   a. Requirements gathering

    +   b. **Threat modeling**

    +   c. Static analysis

    +   d. Post implementation sign-offs


    # Chapter 4


    +   1. Threats are identified using a process described by this mnemonic:

    +   a. THREATEXPOSE

    +   b. **STRIDE**

    +   c. DREAD

    +   d. CAPEC


    +   2. Risk is calculated for each identified threat to prioritize findings and
    needs for remediation using which technique?

    +   a. RISKCOMPUTE

    +   b. DANGER

    +   c. **DREAD**

    +   d. THREATORDER


    +   3. Which of the following is not a mitigation method for threats identified
    in threat modeling?

    +   a. Redesign to eliminate vulnerability

    +   b. Apply a standard mitigation

    +   c. **Change the security requirements to eliminate the threat**

    +   d. Accept the vulnerability'
  merge: -1
  img_proc: true
- pgno: 262
  md: '+   4. The preferred security mitigation to use during threat modeling is:

    +   a. A custom control created specifically for the threat

    +   b. Encryption from an approved library to prevent information disclosure

    +   c. Acceptance of the vulnerability

    +   d. Standard enterprise-level security controls in common use


    # Chapter 5


    +   1. The use of standardized design functions for similar or repeated functionality
    is referred to as:

    +   a. Psychological acceptability

    +   b. Complete mediation

    +   c. Open design

    +   d. Economy of mechanism


    +   2. Logging of errors and failure information should be designed to protect:

    +   a. Sensitive information

    +   b. Availability through resilient controls

    +   c. Separation of duties

    +   d. Fail-safe designs


    +   3. Designing a system so all parties can easily understand design objectives
    and maintaining a simple design embrace the principle of:

    +   a. Single point of failure

    +   b. Least common mechanism

    +   c. Fail-safe

    +   d. Open design


    +   4. The security principle of fail-safe is related to:

    +   a. Session management

    +   b. Exception management

    +   c. Complete mediation

    +   d. Single point of failure


    # Chapter 6


    +   1. The following are primary mitigation methods except:

    +   a. Locking down the environment

    +   b. Input validation

    +   c. Use of deprecated libraries for legacy code

    +   d. Output validation'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   2. Elements of defensive coding include all the following except:

    +    a. Custom cryptographic functions to avoid algorithm disclosure

    +    b. Exception handling to avoid program termination

    +    c. Interface coding efforts to avoid API-facing attacks

    +    d. Cryptographic agility to make cryptographic functions stronger


    +   3. Static analysis can be used to check for:

    +    a. Approved function/library calls, examining rules and semantics associated
    with logic, and thread performance management

    +    b. Syntax, approved function/library calls, and race conditions

    +    c. Syntax, approved function/library calls, and memory management

    +    d. Syntax, approved function/library calls, and examining rules and semantics
    associated with logic and calls


    +   4. Automated testing has the following advantages over manual code review
    except:

    +    a. Detection of unsafe or deprecated function calls

    +    b. Identification of obfuscated routines

    +    c. Speed of analysis

    +    d. Integration into the IDE


    # Chapter 7


    +   1. The post-release plan should have a policy to allow:

    +    a. Rules

    +    b. Deviations

    +    c. Procedures

    +    d. Practices


    +   2. Management reviews recommend:

    +    a. Best practices

    +    b. Roles

    +    c. Accountability

    +    d. Corrective or remedial action


    +   3. The aim of black-box testing is to confirm that a given input:

    +    a. Is correct

    +    b. Can be processed accurately

    +    c. Produces a predictable output

    +    d. Will not cause a defect


    +   4. Configuration management exercises:

    +    a. Rational control over the code'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   b. Rational control over the design

    +   c. Rational control over the change process

    +   d. Enforcement of the change process


    +   5. The management level authorized to approve changes must be:

    +   a. As high as possible

    +   b. As simple as possible

    +   c. Clearly defined

    +   d. Approved


    # Chapter 8


    +   1. Product deployment and post-release assurance requires:

    +   a. Secure coding

    +   b. Object-oriented management

    +   c. Problem resolution

    +   d. Configuration management


    +   2. Incident response processes should be:

    +   a. Routinely executed and tested

    +   b. Operationally complex

    +   c. Strategically planned

    +   d. Totally constrained


    +   3. The incident management team is:

    +   a. A strictly technical operation

    +   b. Composed of the best programmers

    +   c. Strictly composed of managers

    +   d. Often a diverse bunch of people representing all relevant disciplines


    +   4. The operations and management processes are lumped together into sustainment
    because:

    +   a. They are at the end of the life cycle.

    +   b. They are the major activities during the software use life cycle period.

    +   c. They are neither development nor acquisition.

    +   d. They are strictly control processes for sustaining assurance.'
  merge: -1
