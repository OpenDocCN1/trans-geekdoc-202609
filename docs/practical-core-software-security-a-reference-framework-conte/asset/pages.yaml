  md: 'themselves, including prerequisites, setup, execution, and what to look for
    in the test results. The risk analysis described previously is typically used
    to prioritize the tests, since it is usually not possible, given time and budget
    constraints, to test every component of the software. Security test planning is
    an ongoing process, and the details of the test process are fleshed out as additional
    information becomes available.


    The developing organization may modify software because problems have been uncovered
    and then send the software back to be retested. It is often more efficient that
    one component is tested while other components of the same system are still being
    developed than for it to be tested after development is complete. For larger projects,
    the test plan is typically broken down into test cycles. Given the examples above,
    test cycles may be created because of the need to retest software that was already
    tested once before; or test cycles may be created because the nature of the development
    effort requires that different modules be tested at different times.


    Intercomponent dependencies, including those elements or software components in
    an SaaS or cloud environment that may interact with the software being developed,
    must be taken into account so that the potential need for retesting is minimized.
    A development organization typically has a very regimented development process,
    so the security team needs to be involved from the beginning of the SDLC process.
    The security team needs to specify early the order in which components should
    be tested, to ensure that each module is tested before other modules that might
    depend on it are developed and tested. The concept of “building security in” should
    be used not just to promote the security program; it must be strictly adhered
    to if the SDL is to be successful. This means that the security team needs to
    be included in the general test plan discussions to ensure that the elements of
    security are included in the validation of the test environment and the test data,
    and how the test cases define the test condition. The test condition is what is
    going to be tested to see how the software is actually going to respond. Test
    cases are created during the test-execution process and include information about
    the test pre-conditions and post-conditions, how it will be set up and terminated,
    and how the results will be evaluated.


    Automation will be key to making the process run smoothly and, most importantly,
    repeatable, and it should be used wherever possible. As mentioned, previously,
    this will not always be possible, and the human element will be absolutely necessary,
    particularly the skills of senior software security architects. The test plan
    will be expected to provide as much guidance as possible to let the tester know
    precisely what they are looking for in each test and what the specific test preparations
    are.


    Michael and Radosevich, of Cigital, listed the following typical elements of a
