    # 9.4 The Building Security In Maturity Model (BSIMM)


    The Building Security In Maturity Model (BSIMM)7 is a study of existing software
    security initiatives. BSIMM is not a how-to guide, nor is it a one-size-fits-all
    prescription. The project’s primary objective was to build a maturity model based
    on actual data gathered from nine large-scale software development initiatives.
    Representatives from Cigital® and Fortify® conducted interviews and collected
    data from nine original companies, including Adobe®, Dell® EMC®, Google®, Microsoft,
    and five others. Using this data and conducting in-person executive interviews,
    the team developed a Software Security Framework (SSF) that creates buckets and
    three maturity levels for the 116 activities that they observed being performed
    in software development organizations. BSIMM has been updated over the course
    of its lifetime. Now, in its 11th edition, it includes new activities that have
    been added to clearly show that AppSec in the cloud is becoming mainstream and
    indicates that activities observed among independent software vendors, Internet
    of Things (IoT) companies, and cloud firms have begun to converge, suggesting
    that common cloud architectures require similar software security approaches.


    BSIMM is meant for use by anyone responsible for creating and executing a software
    security initiative (SSI). The authors of BSIMM observed that successful SSIs
    are typically run by a senior executive who reports to the highest levels in an
    organization. These executives lead an internal group that BSIMM refers to as
    the software security group (SSG), which is charged with directly executing or
    facilitating the activities described in the BSIMM. The BSIMM is written with
    the SSG and SSG leadership in mind.


    # 9.4.1 BSIMM Organization


    This model is divided into 12 practices, falling under four categories:


    +   - Governance

    +   - Intelligence

    +   - Software security development lifecycle (SSDL) touchpoints

    +   - Deployment'
