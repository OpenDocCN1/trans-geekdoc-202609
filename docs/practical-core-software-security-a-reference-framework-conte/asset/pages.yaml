  md: 'of code developed elsewhere, either commercial off-the-shelf (COTS) or open-source
    software. Just as with internally developed software, a third party should prepare
    an attestation report per the software application owner’s requirements, which
    may include an attack surface review, review of cryptography, architecture risk
    analysis, technology-specific security testing, binary analysis if source code
