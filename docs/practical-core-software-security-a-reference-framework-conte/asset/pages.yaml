- pgno: 185
  md: 'The final security review must be scheduled carefully in order to maximize
    the time needed to fully analyze and remediate both known and any security issues
    that may be discovered during the final review, in ample time to account for the
    software product release and ship dates.


    The final security review process should include the following:


    +   • **Scheduling.** The product security review must be scheduled so that all
    required information from the SDL to complete this step has been acquired and
    is available, and enough time has been allowed to minimize any delay in the release
    date. The start date cannot be set until all security review activities defined
    and agreed to at the beginning of the SDL process have been completed, including
    in-depth security vulnerability reviews, threat modeling, and appropriate static,
    dynamic, and fuzz testing tool analysis.


    +   • **Specific final security review tasks.**


    +   o The SDL and development team will meet to review and ensure that satisfactory
    responses have been made for all questions that have arisen and documented during
    the SDL process.


    +   o Threat models developed earlier in the process have been reviewed and updated
    as of the start date of the final security review to ensure that all known and
    suspected threats identified through the process have been mitigated.


    +   o All security vulnerabilities have been reviewed against the criteria established
    for release early in the process, and at least the minimum security standard has
    been enforced throughout the SDL. Any security vulnerabilities that were rejected
    or deferred for the current release of the software product must be reviewed as
    well. It is important to note that if the SDL and development team is not constantly
    evaluating the severity of security vulnerabilities against the standard that
    is used during the SDL process, then a large number of security vulnerabilities
    may re-appear or be discovered during the final security review and result in
    unnecessary and possibly significant use of resources and time, thus delaying
    the release of the product.


    +   o The static, dynamic, and fuzz testing tools should be run before final security
    review so that results can be fully evaluated before a decision is made for final
    release. In some cases, the tools may provide inaccurate or unacceptable results,
    in which case you may need to re-run the tools or find more acceptable alternatives
    to the ones used during the process.


    +   o You must review and ensure that all of the relevant internal security policies
    and external regulatory requirements have been followed and that software being
    reviewed is in compliance with the requirements for each.


    +   o If a specific SDL security requirement cannot be met and the overall security
    risk is tolerable, an exception must be requested, preferably well in advance
    of the final security review and as early as possible in the process.


    The final product security review can be described as a four-step process as outlined
    below and represented graphically in Figure 7.4.


    +   1. **Assess resource availability.** In this step, the resources that will
    be required and available in order to conduct the final security review are identified.
    The ability to enforce the quality gates required before the software can be released
    is also assessed. Minimum acceptable levels of security as it relates to quality
    are established through quality gates.'
