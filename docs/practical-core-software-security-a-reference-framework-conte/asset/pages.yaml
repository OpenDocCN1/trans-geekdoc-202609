    More sophisticated fuzzing techniques are used to improve and optimize coverage
    by using protocol specifications to target protocol areas most susceptible to
    vulnerabilities and to reduce the number of test cases needed without compromising
    test coverage. Static code analysis is used to ensure that secure coding policies
    are being followed, but protocol fuzzing tools are used to gain an attacker’s
    perspective to the threat and risk.


