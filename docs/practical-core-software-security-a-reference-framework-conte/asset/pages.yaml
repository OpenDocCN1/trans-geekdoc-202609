  md: '# Updated Policy Compliance Analysis


    Policy compliance analysis artifacts (see Chapters 4, 5, and 6) should be updated
    based on any new requirements or policies that may have come up during this phase
    of the SDL.


    # Security Testing Reports


    The findings summary (discussed in Chapter 6) should be updated to include vulnerability
    scans (external, internal, and authenticated) and penetration testing findings
    during this phase. A customer-facing report should also be prepared to share with
    enterprise customers.


    # Remediation Report


    In addition to updating security testing reports (or findings), the remediation
    report should also be updated to give a better idea of the product’s security
    posture going into the release. Any findings that have not been remediated by
    now (and are not to be remediated before the release date), should be discussed
    and put on a roadmap.


    # Open-Source Licensing Review Report


    A formal review report of open-source software used in the software stack should
    be prepared that outlines different licensing requirements (The MIT® License,
    GNU® General Public License, GNU® Lesser General Public License, BSD® License)
    and how they are being met. The security and privacy officers should review the
    report and sign off on it.


    # Final Security and Privacy Review Reports


    After a final review of compliance against security and privacy requirements,
    a formal sign-off by security and privacy officers should be required.


    # Customer Engagement Framework


    A formally documented process to share security information with customers should
    be delivered as part of this phase. The process should include types of information
    (and frequency) shared with customers, notification in case of security incidents,
    security findings, and remediation SLAs.


    # 7.9 Metrics


    The following metrics should be collected during this phase of the SDL:


    +   - Percent compliance with company policies (updated)

    +     - Percent of compliance in Phase 5 versus Phase 4

    +   - Number, type, and severity of security issues found through vulnerability
    scanning and penetration testing

    +     - Overlap of security issues found through different types of testing'
