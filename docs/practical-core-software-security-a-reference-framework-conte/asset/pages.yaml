    # 9.5.2 MITRE ATT&CK®10 and MITRE D3FEND®11


    MITRE ATT&CK is a globally accessible knowledge base of adversary tactics and
    techniques that is based on real-world observations and is developed and published
    by the MITRE Corporation. The ATT&CK knowledge base can save you countless hours
    of research time and effort to conducting threat intelligence and threat management
    practices in your own SDL. A companion MITRE project, MITRE D3FEND, is useful
    for protecting even the most targeted IT infrastructures and applications.


    The ATT&CK knowledge base is used as a foundation for the development of specific
    threat models and methodologies in the private sector, in government, and in the
    cybersecurity product and service community. ATT&CK is open and available to any
    person or organization for use at no charge. ATT&CK was created out of a need
    to systematically categorize adversary behavior as part of conducting structured
    adversary emulation exercises within MITRE’s FMX research environment.


    The first ATT&CK model was created in September 2013 and was primarily focused
    on the Windows enterprise environment. It was further refined through internal
    research and'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'development and subsequently publicly released in May 2015 with 96 techniques
    under 9 tactics. Since then, ATT&CK has experienced tremendous growth based on
    contributions from the cybersecurity community. MITRE has created several additional
    ATT&CK-based models that were created based on the methodology used to create
    the first ATT&CK.


    The knowledge base is a valuable resource for vulnerability managers with information
    and insights:


    +   **Detections and Analytics**

    +   ATT&CK can help cyber defenders develop analytics that detect the techniques
    used by an adversary.


    +   **Threat Intelligence**

    +   ATT&CK gives analysts a common language to structure, compare, and analyze
    threat intelligence.


    +   **Adversary Emulation and Red Teaming**

    +   ATT&CK provides a common language and framework that red teams can use to
    emulate specific threats and plan their operations.


    +   **Assessment and Engineering**

    +   ATT&CK can be used to assess your organization’s capabilities and drive engineering
    decisions, such as what tools or logging you should implement.


    The MITRE D3FEND knowledge base is a framework that provides defensive techniques
    that system administrators can apply to counter the practices detailed in the
    ATT&CK knowledge base.


    # 9.6 Pulling It All Together


    Cyber threats result from software flaws, which are weakness that can be exploited
    by a cyber attack or exploitation of a software application or system. In this
    book, we have covered strategies for implementing specific aspects of software
    security in the form of SDL best practices to assist software development organizations
    in avoiding and reducing software flaws as an essential element of effective core
    software security by providing security at the source.


    Although achieving a vulnerability-free product is exceedingly difficult, maybe
    even impossible, it should always be your goal. By applying the best practices
    in this book, the software you develop will be as free from security vulnerabilities
    as possible. The fewer the number of vulnerabilities, the harder it will be for
    an attacker to exploit a given application.


    By no means are we going to stop all threats through the use of software security
    best practices, but maximizing the reduction of the attack surface is our ultimate
    goal in that it makes our job as software security professionals easier and that
    of our adversaries more difficult. By implementing the practices outlined in this
    book, you will be able to mitigate threats coming from most threat actors.


    This section describes how to apply everything you have learned in this book to
    the real world through the use of a flexible, agile, and business-relevant SDL.'
