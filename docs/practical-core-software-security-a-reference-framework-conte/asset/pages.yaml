  md: '# 1.6 Summary


    Software is only as secure as the quality and relevance of the best practices
    that the software development team uses. Software security must be built in from
    the very start. It must be a critical part of the design from the very beginning
    and included in every subsequent development phase all the way through fielding
    a complete system. Correcting vulnerabilities as early as possible in the SDLC
    through the adoption of security-enhanced processes and practices is far more
    cost effective than attempting to diagnose and correct such problems after the
    system goes into production. This will greatly reduce the need to patch the software
    to fix security holes discovered by others after release of the product, which
    will degrade the reputation and credibility of the vendor and adversely impact
    it financially. Today, we are seeing an increased need for security in software
    development in that security requirements, design, and defensive principles have
    to be worked into the traditional SDLC and, most important, in choosing security
    development practices that embrace this need throughout all the activities of
    the SDLC.


    We have worked with Fortune 500 companies and have often seen examples of breakdowns
    in SDL practices. In this book, we take an experience-based approach to applying
    components of the best available SDLs models in dealing with the problems described
    above in the form of an SDL software security best practices model and framework.
    We shall begin by giving an overview of the security development lifecycle and
    then outline a model for mapping SDL best practices to the software development
    life cycle and how you can use this to build a mature SDL program. Although security
    is not a natural component of the way industry has been building software in recent
    years, we believe that security improvements to development processes are possible,
    practical, and essential, and we trust that the software security best practices
    and model presented in this book will make this clear to all who read this book,
    whether you are an executive, manager, or practitioner.


