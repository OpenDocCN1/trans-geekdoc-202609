    Meaningful security metrics allow an organization to determine the effectiveness
    of its security controls. To measure the security posture of an organization effectively,
    product security must first ensure that the proper framework is in place in order
    to derive meaningful metric data. This includes a product security governance
    model suited to the entity’s strategic and operational requirements. Such a model
    should support implementation of practical product security policies and procedures,
    consistent deployment of best practices and measures, and require strong executive
    management support across the organization. Best practices dictate a model under
    which security is managed as an enterprise issue—horizontal, vertically, and cross-functionally
    throughout the organization. This model is better suited to enable consistent
    monitoring, measurement, and reporting of an organization’s product-security posture.


    For security to be measured effectively, it must be managed effectively. As companies
    struggle to protect valuable information assets and justify risk-based decision
    making, a centralized metrics reporting mechanism is crucial for producing meaningful
    metrics and providing an ongoing assessment of the state of product security within
    a software development organization.


    Rather than include a separate chapter on metrics in this book, our approach will
    be to include metrics in each step of the SDL model presented. This will cumulate
    in a discussion of the use of SDL metrics in managing the overall corporate software
    security program.


