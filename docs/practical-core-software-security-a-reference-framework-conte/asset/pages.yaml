    # 4.4 Open-Source Selection


    There has been an increasing trend in the software industry over the last few
    years to draw on the strengths of both open-source and proprietary software to
    deliver the highest value at the lowest cost. The blend of both is called “mixed
    source” and is becoming a dominant practice in industry. Understanding and managing
    the licensing of your software assets will be critical as open source becomes
    an ever-greater part of the software development landscape, but this is beyond
    the scope of our discussion and will be handled by others on the software development
    team.


    There is an ongoing debate as to whether open-source software increases software
    security or is detrimental to it, but the bottom line is that you are importing
    software into your software application or solution that your company did not
    develop or have security oversight over. This will require an extensive review,
    typically called a third-party security assessment, which will be conducted by
    your software security architect, a third party, or a combination of both. Although
    it may be tempting to rely on tools and a cursory review of the open-source development
    processes, without the proper training and experience, it is easy to misinterpret
    results and difficult to create an actionable remediation strategy. That is why
    senior software security architects or a third-party equivalent must be involved
    in this review process. They have years of code security auditing experience,
    routinely review and mitigate highly complex and advanced software security and
    architectural challenges, know how to identify'
