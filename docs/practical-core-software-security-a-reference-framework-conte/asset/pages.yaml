  md: 'Manual code reviews by definition are human-driven, and although the highest
    value-add for their use is for architectural design reviews, these software security
    reviews are done with a holistic approach that includes people, policies, and
    processes. Assuming limited resources, manual code review is best performed on
    only the most critical components of an application. These reviews will also include
    manually reviewing the documentation, secure coding policies, security requirements,
    and architectural designs. There is also a mentoring aspect of manual reviews,
    in that the software security architects will be able to teach others on the development
    team about the art of testing, how to understand the security process, policy
    awareness, and the appropriate skills for designing or implementing a secure application.
    Even with seasoned and security-savvy development teams, software security architects
    should adopt a trust-but-verify model. This process is enhanced by the fact that
    the architects usually analyze documentation together with the stakeholders and
    appropriate development team members and also interview the designers or system
    owners for their input.


    It should be noted that if good software engineering processes are adhered to,
    they can alleviate many of the concerns that are being assessed by the code review
    team. In most cases, static and dynamic analysis or fuzz testing is more efficient
    at catching implementation bugs than code review, but if some of the security
    vulnerabilities that manual code review finds are rare, it is the only way they
    will be found. Once a type of security vulnerability has been found through manual
    code review, it should be incorporated into automatic code review tools. As mentioned
    previously, efficient and effective software security requires a holistic approach
    and includes not just manual software reviews but also mandatory software security
    training, security design reviews, threat modeling, fuzz testing, static and dynamic
    analysis, the identification of high-risk practices, and measurable criteria and
    requirements for each of the various phases in the software life cycle, including
    servicing and support.


    The following steps are typically used for manual software security reviews:


