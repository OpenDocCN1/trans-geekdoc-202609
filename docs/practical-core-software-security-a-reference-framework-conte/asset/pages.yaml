  md: '# ## 2.5.1 The Tools


    Three primary tools are basic to the SDL, which are categorized as fuzzing, static,
    and dynamic analysis tools. Although we will go over the details of the best practices
    for their use in the SDL later in the book, a high-level overview follows.


    # ### 2.5.1.1 Fuzzing


    Fuzz testing or fuzzing is a black-box software-testing technique that can be
    automated or semiautomated, which provides invalid, unexpected, or random data
    to the inputs of a computer software program. In other words, it finds implementation
    bugs or security flaws by using malformed/semi-malformed data injection in an
    automated fashion. Inputs to the software program are then monitored for exception
    returns such as crashes, failing built-in code assertions, and potential memory
    leaks. Fuzzing has become a key element in the testing for software or computer
    system security problems. Fuzz testing has a distinct advantage over other tools
    in that the test design is extremely simple and free of preconceptions about system
    behavior.


    Fuzzing is a key element of software security and must be embedded in the SDL.
    There are many vendors to choose from in this space, and some developers even
    develop their own tools. As you will see later on in the book, the timing at which
    the fuzzing tools are used in the SDL is critical. It should also be noted that
    fuzzing is used for both security and quality assurance testing.


    Fuzzing has recently been recognized as both a key element and a major deficiency
    in many software development programs, so much so that it is now a Department
    of Defense Information Assurance Certification and Accreditation Process (DIACAP)
    requirement.


    # ### 2.5.1.2 Static Analysis


    Static program analysis is the analysis of computer software that is performed
    without actually executing programs. It is predominantly used to perform analysis
    on a version of the source code; however, this kind of analysis may also be done
    on some form of the object code. In contrast, dynamic analysis is performed by
    actually executing software programs. Static analysis is performed by an automated
    software tool and should not be confused with human analysis or software security
    architectural reviews, which involve manual human code reviews, program understanding,
    and comprehension. When used properly, static analysis tools have a distinct advantage
    over human static analysis in that analysis can be performed much more frequently
    and with security knowledge generally superior to that of the standard software
    developer. It also frees up the time of seasoned software security architects
    or engineers so that they only need be brought in when absolutely necessary.


    Static analysis, also known as static application security testing (SAST), identifies
    vulnerabilities during the development or quality assurance phase of a project.
    It provides line-of-code level detection that enables development teams to remediate
    vulnerabilities quickly.


    The use of static analysis tools and your choice of the appropriate vendor for
    your environment is another technology factor key to your success. Any technology
    that beneficially automates any portion of the software development process should
    be welcome, but this software'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'has become “self-ware” in many organizations because the right people and right
    process were not used in selecting the tool or tools. Not all tools in this space
    are created equal, and some are better at some languages than others, whereas
    others have great governance/risk/compliance (GRC) and metric analysis front ends.
    In some cases, you may have to use up to three different tools to be effective.
    In the end, you need to choose tools that support your language, are scalable,
    can be embedded with your development processes, and have minimum false positives.


    Software development is a complex business, and anything you can do to make the
    process more repeatable, predictable, and reduce “friction” is a big win for most
    organizations. There are many benefits to using static analysis tools. The most
    important reasons include the following.


    +   - Static analysis tools can scale. They can review a great deal of code very
    quickly, something humans cannot do very well.

    +   - Static analysis tools don’t get tired. A static analysis tool running for
    four straight hours at 2:00 a.m. is just as effective as if it runs during business
    hours. You can’t say the same thing about human reviewers.

    +   - Static analysis tools help developers learn about security vulnerabilities.
    In many cases, you can use these tools and educational resources from the vendor
    to educate your development teams about software security.


    # 2.5.1.3 Dynamic Analysis


    Dynamic program analysis is the analysis of computer software that is performed
    by executing programs on a real or virtual processor in real time. The objective
    is to find security errors in a program while it is running, rather than by repeatedly
    examining the code offline. By debugging a program in all the scenarios for which
    it is designed, dynamic analysis eliminates the need to artificially create situations
    likely to produce errors. It has a distinct advantage of having the ability to
    identify vulnerabilities that might have been false negatives and to validate
    findings in the static code analysis.


    Dynamic analysis, also known as dynamic application security testing (DAST), identifies
    vulnerabilities within a production or production-ready application. These tools
    are used to quickly assess a system’s overall security and are used within both
    the SDL and SDLC. The same advantages and cautions about using static analysis
    tools apply to dynamic analysis tools.


    The timing of the use of SAST and DAST tools in the SDL is critical and takes
    place primarily in the design and development phase of the SDL we will be presenting
    later in this book, as shown in Figure 2.1.


