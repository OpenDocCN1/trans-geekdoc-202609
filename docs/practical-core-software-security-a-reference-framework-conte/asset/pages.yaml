  md: '+   • **Control flow analysis.** Control flow analysis is the mechanism used
    to step through logical conditions in the code. The process is as follows:

    +   1. Examine a function and determine each branch condition. These may include
    loops, switch statements, “if” statements, and “try/catch” blocks.

    +   2. Understand the conditions under which each block will execute.

    +   3. Move to the next function and repeat.


    +   • **Data flow analysis.** Data flow analysis is the mechanism used to trace
    data from the points of input to the points of output. Because there can be many
    data flows in an application, use your code review objectives and the flagged
    areas from Step 2 to focus your work. The process is as follows:

    +   1. For each input location, determine how much you trust the source of input.
    When in doubt, you should give it no trust.

    +   2. Trace the flow of data to each possible output. Note any attempts at data
    validation.

    +   3. Move to the next input and continue.³⁰


    While performing data flow analysis, review the list of inputs and outputs, and
    then match this to the code that you need to review. You must pay particular attention
    to prioritizing any areas where the code crosses trust boundaries and where the
    code changes trust levels, just as you did during the threat modeling process.
    A set of common validation routines that your software can call as soon as it
    receives any untrusted data should be available which will give your software
    product a central validation area that can be updated as new information is discovered.
    As the data flow analysis is performed, give special attention to areas where
    the data is parsed and may go to multiple output locations, to ensure that the
    data is traced back to its source and trust is assigned based on the weakest link.


    There are other lists of questions that should be considered. Some of these are
    organized into sets of key areas based on the implementation mistakes that result
    in the most common software vulnerabilities relevant to the software product or
    solution being developed, also called hotspots. These questions are typically
    developed by the software security architect and revolve around the last top 10
    to 20 CVE or OWASP “Top 10” lists described earlier in the book.


    A review for security issues unique to the architecture should also be conducted
    as part of the manual security review process. This step is particularly important
    if the software product uses a custom security mechanism or has features to mitigate
    known security threats. During this step, the list of code review objectives is
    also examined for anything that has not yet been reviewed. Here, too, a question-driven
    approach such as the following list will be useful, as the final code review step
    to verify that the security features and requirements that are unique to your
    software architecture have been met.


    +   • **Does your architecture include a custom security implementation?** A custom
    security implementation is a great place to look for security issues for these
    reasons:

    +     o It has already been recognized that a security problem exists, which is
    why the custom security code was written in the first place.

    +     o Unlike other areas of the product, a functional issue is very likely to
    result in security vulnerability.


    +   • **Are there known threats that have been specifically mitigated?** Code
    that mitigates known threats needs to be carefully reviewed for problems that
    could be used to circumvent the mitigation.'
