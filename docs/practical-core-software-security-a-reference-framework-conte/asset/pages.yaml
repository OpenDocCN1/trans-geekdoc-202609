- pgno: 149
  md: 'designed. Fuzz testing induces program failure by deliberately introducing
    malformed or random data to an application and can be used as an effective and
    low-cost way of finding potential security issues prior to release and potentially
    throughout the SDL process. Fuzz testing is a specialized form of dynamic analysis.
    By using the latest version of these automated tools, the latest known automated
    security analysis, vulnerabilities, and recommended protections will be identified.
    After these multiple automated tools have been used to quickly analyze the flaws
    and vulnerabilities in the software, the code is then reviewed manually, every
    issue validated, and the code inspected to overcome the limitations of automated
    tools and techniques. As part of this process, attack surface and threat model
    reviews will ensure that any new attack vectors that have been created by any
    design or implementation changes have been identified and mitigated. Finally,
    we discuss the need, value, and process for privacy validation and remediation
    to be conducted during this phase of the SDL.


    # 6.1 A4 Policy Compliance Analysis


    This is a continuation of the A3 policy compliance review described in the previous
    chapter. As you will see, we continue to perform policy compliance analysis during
    different phases and review it again and again. It is of paramount importance
    that you persist through this and not make an assumption that you have covered
    everything in previous iterations. You will be surprised how often things are
    missed during initial phases/iterations of this step.


    During this phase, any policy that exists outside the domain of the SDL policy
    is reviewed (or reviewed again). This may include policies from outside the development
    organization that carry security and privacy requirements and guidelines to be
    adhered to when developing software or applications anywhere within the organization.
    Often, too, policies are updated during the development process, and new requirements
    are added. Thus, it is best to obtain a list of updated policies and make sure
    you have incorporated any additional requirements.


    Corporate security and privacy policies will likely instruct designers and developers
    on what the security and privacy features need to be and how they must be implemented.
    Other policies may focus on the use of third-party and open-source software used
    as part of a software product or on the protections and control of source code
    and other intellectual property within and outside the organization. Assuming
    that the software security group is separate from the centralized information
    security group, it is important that the two groups collaborate on all policies
    and guidelines related to the development and post-release security support by
    the organization. It helps the information security group to fine-tune its policies
    not only for corporate security policies/practices but also for software development.
    It is also important to collaborate with the privacy function of your company,
    whether it be a centralized group or outside legal counsel. If the company identifies
    potential new markets, privacy policies and practices (for that particular market)
    may be updated.


    # 6.2 Security Test Case Execution


    Security testing is a time-consuming process that requires proper preparation,
    consistency, and coordination with all stakeholders, as well as a deep understanding
    of what you are actually'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'testing. It starts early and continues throughout the SDLC process. The approach
    for security testing is different from other forms of testing in that its purpose
    is to identify various vulnerabilities in a software design that are exposed and
    due to improper design or coding issues. The premise of this book is to secure
    at the source, and testing at this level will prevent many of the vulnerabilities
    that are typically found only when the software is exposed at the network level.
    Security, especially at the design level, can help us identify potential security
    problems and their impact before they are part of a larger system and network
    and perhaps cost-prohibitive to fix. Software security is a dynamic risk management
    exercise in that you are balancing the costs of potential assurance remedies against
    the skills and resources of adversaries—and there are always intelligent adversaries
    who are focused on breaking and exploiting your software. Thus, the security test
    itself must assess the probability of occurrence of an event based on exploiting
    a vulnerability and the risk associated with each potential occurrence.


    In a typical SDLC cycle, software goes through quality assurance (QA) testing
    that includes unit, performance, system, and regression testing. If the software
    passes through test criteria for this QA testing, it will be given a “Go” by the
    QA team. Basically, this means that the software has been tested for quality and
    is good to go. From the authors’ point of view, QA testing is not complete unless
    all security tests have been performed and the security test acceptance criteria
    are all met. Software cannot be a quality product unless it has been comprehensively
    tested for security issues. Treating security testing as an add-on is a mistake
    that many companies still make. Once QA testing is complete, the software goes
    to the security team for security testing. In our opinion, routine security testing
    should be part of the QA cycle. The QA team should treat security testing just
    like any other testing and should create test cases and perform both manual and
    automated testing just as they would any other testing. The QA team, however,
    often does not have the skills to execute security test cases, which therefore
    often means that the QA team relies on the security team to perform *all* testing.
    This approach is not very effective and takes time away from the security team,
    which has to perform basic security tests instead of looking at advanced threats/corner
    cases. QA security testing is not meant to replace security testing by the security
    team. Instead, it should be looked upon as enabling the security team to focus
    on advanced testing. Below are a few examples of issues that QA security testing
    should look for:


    +   - Plaintext passwords/weak passwords in configuration files

    +   - Default accounts on the stack (web servers, database servers, operating
    systems)

    +   - Sensitive information in log files

    +   - Input validation (XSS, SQLi)

    +   - Parameter tampering for web applications

    +   - Insecure services used by the software team (e.g., Telnet)

    +   - Security configurations for various services (e.g., NFS)


    The QA team should focus not just on application but also on the stack on which
    the software will run. This means testing various configurations of operating
    systems and related services, web servers, etc., from a security point of view.
    Before QA gives the “Go” for a product, the entire stack (application, operation
    system, web servers, storage) should have been tested for basic security issues.


    Security test case execution is carried out from two primary perspectives:'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   1. Security mechanisms are tested to ensure that their functionality is
    properly implemented; and

    +   2. Security testing is conducted in relation to understanding and simulating
    the attacker’s approach as identified during threat modeling and other associated
    risk-based analyses.


    Typically, three specific test type categories are performed on a software product
    and its associated system(s):


    +   1. **Benchmarks.** These tests are used to compare estimates to actual results.

    +   2. **Scheduled tests.** These tests include mandatory requirements to validate
    the security of the software and associated system(s) being tested, which must
    be conducted regardless of whether security issues or vulnerabilities are detected
    or tuning is required.

    +   3. **Exploratory tests.** Exploratory testing emphasizes the personal freedom
    and responsibility of the individual tester to continually optimize the quality
    of his or her work by treating test-related learning, test design, test execution,
    and test result interpretation as mutually supportive activities that run in parallel
    throughout the project.1 The tester actively controls the design of the tests,
    and those tests are performed while testing to design new and better tests.


    A successful security test execution plan assumes that:


    +   • You have done a detailed risk analysis to evaluate the software and the
    system(s) with which it will be associated. This process was detailed in Chapter
    5.

    +   • Test assets have been developed as part of the risk management plan and
    the development of a security engineering/development test strategy.


    Successful security test execution includes the following:


    +   • Baseline and benchmark tests have been performed to ensure that obvious
    security issues have been identified early in the testing cycle.

    +   • Automated test scripts have been validated as correct.

    +   • Re-benchmarking testing has been conducted after tuning.

    +   • A basis for future test comparison has been created.

    +   • The results of the security test case execution have been analyzed.

    +     o Test execution results have been evaluated. Your seasoned software security
    architects have a key role here, as they apply their skills and experience to
    compare the evaluation to previous tests, finding and analyzing patterns (including
    identification of obvious or potential security issues and/or the effects of the
    tuning effort), and apply their past experiences to the evaluation. Since this
    evaluation is more an art than a science, the software security architects should
    also involve the testers and developers in the analysis after the architects’
    initial review and evaluation to optimize the results of the analysis toward driving
    tuning efforts.

    +     o You have determined whether security test case execution acceptance criteria
    have been met. This is a result of comparing the results from the most recent
    test, or suite of tests, to the acceptance criteria. If all of the results meet
    or exceed the security test execution criteria, then the test is complete; if
    not, the team should continue to evaluate the results.'
