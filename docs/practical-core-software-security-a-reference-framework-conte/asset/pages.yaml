    through iterations of building a security assurance program.11


    # 2.3 ISO/IEC 27034—Information Technology—Security Techniques—Application Security


    In 2011, the International Organization for Standardization (ISO®)/International
    Electrotechnical Commission (IEC®) published Part 1 of 6 of the ISO/IEC 27034-1:2011
    standard for Application Security.12 The standard offers a concise, internationally
    recognized way to get transparency into a vendor/supplier’s software security
    management process. It was designed to be flexible enough to align with diverse
    engineering organizations but specific enough to address real-world risk. It has
    now been published and is similar to the ISO/IEC 27001 for IT Security in that
    both customers and partners will expect compliance. As a standard for software
    security from an international body and not a vendor, it is also not tied to specific
    technology. Parts 2–7 are composed of the following: Part 2, Organization Normative
    Framework; Part 3, Application Security Management Process; Part 4, Application
    Security Validation; Part 5, Protocols and Application Security Control Data Structure;
    Part 6, Security Guidance for Specific Applications; Part 7, Assurance Prediction
    Framework.13 Over the years, as organizations (and their customers) started paying
    attention to information security, the security and compliance industry came up
    with a plethora of attestations, certifications, and methodologies. These standards/attestations
    all claimed to be unique in the way they would measure the security posture of
    an organization. Competition and marketing hype drove confusion, with different
    organizations standardizing on different attestations. The authors have seen organizations
    pushing their customers (in most cases, other companies) to adopt their recommended
    attestation. For Fortune 500 companies this meant getting multiple attestations/certifications
    as a proof of security posture. It didn’t help that most of these attestations/certifications
    focused on “compliance controls” or “policy-based security.” The situation became
    worse with regulations such as SOX, GLBA, Safe Harbor, and HIPAA adding to the
    confusion. Companies often went for a set of certifications—one each for compliance,
    security, privacy, credit card, physical security, and so on.


    The ISO/IEC developed the ISO/IEC 27001 (incorporating ISO/IEC 17799, which had
    been the previous de facto ISO standard for information security). It is an information
    security management system (ISMS) standard that specifies a management system
    intended to bring information security under formal management control. It mandates
    specific requirements that need to be met when an organization adopts the standard.
    The standard addresses information security holistically and encompasses everything
    from physical security to compliance. Industry has enthusiastically adopted the
    practices, and ISO/IEC 27001 is the leading standard for an information security
    management system (ISMS) today. Most of the controls from other standards can
    be mapped back to ISO/IEC 27001. This has enabled organizations to consolidate
    multiple security efforts under one standard, pursue a single framework with holistic
    security in mind, and collect metrics in a consistent manner to measure and govern
    security in an organization.


    The authors see the landscape for software security (and SDL) as similar to what
    it was for information security as a whole a few years ago, before ISO/IEC 27001
    came along. There are multiple SDL methodologies (open and proprietary), each
    claiming to be better than the'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'next. Confusion prevails over the best way to accomplish software security
    in an organization. Applying any one framework to an organization either requires
    the organization to adopt different processes or to customize an SDL framework
    that will work in their environment. With the coming of ISO/IEC 27034, the authors
    see consolidation on a software security standards/framework as the ISO/IEC 27001
    has done for information security. Even in its infancy, there is awareness of
    the importance of ISO/IEC 27034. Microsoft declared its SDL methodology to be
    in conformance with ISO/IEC 27034-1 shortly after its release.14 We expect to
    see similar results for other frameworks in the near future.


    The ISO/IEC 27034 standard provides guidance to help organizations embed security
    within their processes that help secure applications running in the environment,
    including application life cycle processes. It is a risk-based framework to continuously
    improve security through process integrating/improvements in managing applications.
    It takes a process approach by design.


    The authors’ recommended SDL framework can be mapped to ISO/IEC 27034 frameworks.
    We will lay out relevant mapping with ISO/IEC 27034 in Chapter 9.


    # 2.4 Other Resources for SDL Best Practices


    There are other sources for SDL best practices, and some of the most popular are
    described below.


    # 2.4.1 SAFECode


    The Software Assurance Forum for Excellence in Code (SAFECode) is a nonprofit
    organization dedicated to increasing trust in information and communications technology
    products and services through the advancement of effective software assurance
    methods. SAFECode is a global, industry-led effort to identify and promote best
    practices for developing and delivering more secure and reliable software, hardware,
    and services. It is meant to provide a foundational set of secure development
    practices that have been effective in improving software security in real-world
    implementations by SAFECode members across their diverse development environments.
    These are the “practiced practices” employed by SAFECode members, which we identified
    through an ongoing analysis of members’ individual software security efforts.
    By bringing these methods together and sharing them with the larger community,
    SAFECode hopes to move the industry beyond defining theoretical best practices
    to describing sets of software engineering practices that have been shown to improve
    the security of software and are currently in use at leading software companies.15,16


    # 2.4.2 U.S. Department of Homeland Security Software Assurance Program


    Since 2004, the U.S. Department of Homeland Security (DHS) Software Assurance
    Program has been involved in the development and management of the Build Security
    In (BSI) website, along with the CERT® Division of the Software Engineering Institute
    (SEI) at Carnegie Mellon University.17 BSI content is based on the principle that
    software security is fundamentally a software engineering problem and must be
    managed in a systematic way throughout the SDLC.'
