- pgno: 120
  md: '# Success Factor 1: Identification of Business Requirements and Risks


    During this phase, key stakeholders, including the software security group, help
    write out business risks and requirements. Business requirements are defined through
    the CIA pillars of information security. A successful SDL cycle must identify
    and capture all requirements to the best extent possible.


    # Success Factor 2: Effective Threat Modeling


    Though it is a complex and challenging task, the entire risk mitigation plan rests
    on threat modeling. Any gaps in a threat model will result in ineffective secure
    development and deployment controls.


    # Success Factor 3: Effective Architectural Threat Analysis


    Architectural threat analysis enables the identification of threats and ranks
    them in order of priority. All threat vectors resulting in the risk must be identified
    and prioritized.


    # Success Factor 4: Effective Risk Mitigation Strategy


    A key outcome from threat modeling and analysis is risk acceptance and a mitigation
    plan. Business appetite for risk acceptance and tolerance must be thoroughly vetted,
    including legal and finance.


    # Success Factor 5: Accuracy of DFDs


    DFDs are used during threat modeling to identify various components/elements of
    interest. DFDs should be as detailed as possible. Any assumptions should be reviewed
    carefully. Specifically, trust boundaries (client/server, private/public infrastructure,
    tiered architecture) should be properly documented and reviewed.


    # 4.6.2 Deliverables


    Table 4.2 lists deliverables for this phase of the SDL.


    # Table 4.2 Deliverables for Phase A2


    | Deliverable | Goal |

    | :--- | :--- |

    | Business requirements | Software requirements, including CIA |

    | Threat modeling artifacts | Data flow diagrams, elements, threat listing |

    | Architecture threat analysis | Prioritization of threats and risks based on
    threat analysis |

    | Risk mitigation plan | Plan to mitigate, accept, or tolerate risk |

    | Policy compliance analysis | Analysis of adherence to company policies |'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Business Requirements


    A formal business requirement is an artifact that lists software requirements
    and business risks mapped to the three pillars of information security: confidentiality,
    integrity, and availability.


    # Threat Modeling Artifacts


    Key artifacts include DFDs, technical threat modeling reports, high-level executive
    threat modeling reports, threat lists, and recommendations for threat analysis.


    # Architecture Threat Analysis


    The key artifact from this step of the SDL is an artifact that outlines the risks
    of threat materializing. Another one that should be required from this step is
    threat ranking/priority.


    # Risk Mitigation Plan


    The risk mitigation plan outlines risks (and threats) to be mitigated, accepted,
    or tolerated. For each of these categories, it also outlines steps on mitigation
    risks. Finally, this report should be presented to the business for sign-off before
    actual work on the project begins.


    # Policy Compliance Analysis


    This artifact is a report on compliance with different security and nonsecurity
    policies within the company—for example, how software or its components comply
    with information security policy, data governance policy, data retention, cryptography
    policy, etc.


    # 4.6.3 Metrics


    The following metrics should be collected and recorded for this second phase of
    the SDL cycle:


    +   • List of business threats, technical threats (mapped to business threats),
    and threat actors

    +   • Number of security objectives unmet after this phase

    +   • Percent compliance with company policies (existing)

    +   • Number of entry points for software (using DFDs)

    +   • Percent of risk (and threats) accepted, mitigated, and tolerated

    +   • Percent of initial software requirements redefined

    +   • Number of planned software architectural changes (major and minor) in a
    product

    +   • Number of software architectural changes needed based on security requirements


    # 4.7 Summary


    The primary goal of the Architecture (A2) phase of our DSL model is to identify
    the overall requirements and structure for the software from a security perspective.
    The key elements of this phase are threat modeling, documentation of elements
    of the software attack surface from an architectural perspective; definition of
    security architecture and design guidelines;'
