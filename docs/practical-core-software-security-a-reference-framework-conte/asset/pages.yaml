- pgno: 34
  md: 'A U.S. Data and Analysis Center for Software (DACS) October 2008 report, “Enhancing
    the Development Lifecycle to Produce Secure Software: A Reference Guidebook on
    Software Assurance,” defines a threat to a software-intensive system as “any actor,
    agent, circumstance, or event that has the potential to cause harm to that system
    or to the data or resources to which the system has or enables access.”23 A threat
    can be categorized based on its intentionality. For example, a threat can be unintentional,
    intentional but non-malicious, or malicious; a malicious threat is assumed to
    be intentional. Although threats in all three categories have the potential to
    compromise the security of software, only malicious threats are realized by attacks.
    The DACS report also states:


    > The majority of attacks against software take advantage of, or exploit, some
    vulnerability or weakness in that software; for this reason, “attack” is often
    used interchangeably with “exploit,” though the Build Security In Attack Pattern
    Glossary makes a clear distinction between the two terms, with attack referring
    to the action against the targeted software and exploit referring to the mechanism
    (e.g., a technique or malicious code) by which that action is carried out.


    Modeling software is a way to envision the interactions of the proposed software
    within its intended environment. The better the model reflects the intended environment,
    the more useful the modeling approach becomes. Therefore, secure software design
    and development benefits from modeling that explicitly incorporates security threats.
    As described in the DACS 2007 Software Security Assurance State-of-the-Art Report
    (SOAR), “[T]he primary issues in modeling are doing it well; doing it thoroughly
    enough; and knowing what to do with the results (e.g., how to transform the analysis
    into a metric and/or otherwise usable decision point.” Combining the concepts
    of threats and modeling, the report defines threat modeling as “a methodical approach
    for assessing and documenting the weaknesses of security risks associated with
    an application. It allows a development team to identify the highest risk components
    by approaching security from the perspective of an adversary who has specific
    goals in attacking an application.”24


    Given the normal constraints of time and resources, it is not possible to test
    all code in an application. However, at a minimum, testing should cover the entry
    points and exit points of an application that may be accessible to an attacker,
    commonly referred to as the application’s attack surface. Accessibility increases
    the attack surface. For example, code that is restricted to local access by an
    administrator has a smaller attack surface than code exposed to remote access
    by an anonymous user.


    The attack surface should be fully tested by exercising all the code paths in
    an application that are part of the attack surface. The elements of the attack
    surface can be identified with the use of scanning tools, such as port scanning
    tools for open ports, and code analysis tools to locate the portions of the code
    that receive input and send output. It may even be necessary to develop custom
    tools, for example, to locate entry points specific to a custom application. The
    minimum attack surface is typically defined early in the software development
    life cycle and measured again through the later phases. It is often helpful to
    formally define and measure the attack surface before testing. As we will discuss
    later in the book, although tools will be useful at this stage of analysis, a
    human element is still required, and it will take the expertise of the seasoned
    software security architect described above.'
