  md: '+   - You have determined whether the security test case execution results
    are conclusive. If the results do not meet the acceptance criteria, then the test
    is likely inconclusive because the test results are not reproducible and you are
    unable to determine what is causing the security issue in the software. If results
    are inconclusive, an exploratory test will be needed.


    +   - You have determined whether tuning is required at this point. At this stage,
    either a security issue has been detected or more tests are needed to validate
    compliance with additional acceptance criteria. Either the last test will be executed
    again to see whether the results are reproducible, or you will move on to tuning,


    +   - There are some tests where no security issues are found and no tuning is
    required, but the software must be tested because there it is mandatory to validate
    the security of the software and its associated system(s) against specifically
    known software security issues and vulnerabilities.


    Successful security test case execution completion criteria include the following:


    +   - The specific target security requirements and goals of the software that
    has been tested have been met.


    +   - When a situation outside the control of the software security group or its
    equivalent cannot be resolved, the security testing may be deemed complete as
    a result of any one of the following situations, if the company stakeholders responsible
    for the development of the software accept the risk:


    +   - The situation preventing the software security group or its equivalent from
    achieving its security test case criteria is outside the group''s control or contractual
    obligations.


    +   - The predetermined engagement end date is reached and company stakeholders
    responsible for the development of the software accept the risk of not meeting
    the security criteria. In many cases, this is accepted if a commitment to fix
    the vulnerability is scheduled for the next update of the product and/or patch
    release.


    +   - The software security group or its equivalent and all other stakeholders
    agree that the application performs acceptably, even though some security requirements
    or goals have not been achieved. As with the previous situation, this is typically
    not accepted unless the commitment to fix the vulnerability is scheduled for the
    next update of the product and/or patch release.


    # ## 6.3 Code Review in the SDLC/SDL Process


    Code review can be especially productive for identifying security vulnerabilities
    during software development. A properly conducted code review can do more for
    the security of your code than nearly any other activity. A code review allows
    you to find and fix a large number of security issues before the code is tested
    or shipped. There are four basic techniques for analyzing the security of a software
    application: automated scanning, manual penetration testing, static analysis,
    and manual code review. All of these methodologies, of course, have strengths,
    weaknesses, sweet spots, and blind spots. Collectively, these four types of security
    code reviews are likely the fastest and most accurate way to find and diagnose
    many security problems while'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'being less expensive or time-consuming than they are warranted to be. If planned
    for and managed correctly, code reviews are very cost-effective, especially if
    they are built into the SDLC as part of the process, thereby avoiding the expensive
    process of handling, locating, and fixing security vulnerabilities during later
    stages of development or after software product release. Experienced and empowered
    security personnel who are knowledgeable about the four basic techniques of code
    review should be employed to ensure that the various techniques are mixed and
    matched as appropriate to create the most cost-effective and well-managed plan
    for identifying all potential and known significant security issues in the software
    being developed. The human element in the process will also help apply context
    to the security vulnerabilities found by the automated tools. This holistic approach
    will be able to find problems or potential issues, prove that they are exploitable,
    and verify them by examining the code. Another advantage of this approach is that
    it facilitates the experience and education of the development team in the use
    of security best practices, which will help prevent future security issues. The
    process can be broken down into four primary steps as shown graphically in Figure
    6.2 and described below.


    ![](img/a54ed04827050a271316d34985425127_153_0.png)


    Figure 6.2 Four-step code review cycle.


    # 1. Identify Security Code Review Objectives


    During this step, goals and constraints are established for the review as the
    bases for an overall plan. As with most projects, if there is no basis for a plan,
    there will likely be a failed project. This is particularly the case when large
    amounts of code and/or complex SaaS/cloud applications are involved. A focused
    code review is an effective code review. This is why it is important to review
    the code with specific goals, time limits, and knowledge of the issues you want
    to uncover. This will significantly increase your chances for success while reducing
    the amount of time required for review. Having a plan will allow the reviewers
    to focus on reviewing the code each time there is a meaningful change rather than
    trying to find all of the security issues at once, or waiting until the end of
    the project and reviewing everything at one time. For efficiency, you should also
    identify any stated security objectives that are already known prior'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'to review, so you can differentiate between vulnerability types that have elevated
    priority and others that may be out of scope based on your security objectives.


    Security code review is most successful if it is planned and executed in the context
    of other security-related efforts such as threat modeling, as described in the
    previous chapter. Threat modeling helps to identify a critical area of code that
    then becomes a subject of detailed review, and its results can likewise be used
    to validate or question security assumptions specified in a threat model and help
    to understand the application’s functionality, technical design, and existing
    security threats and countermeasures. A security code review should begin with
    a review of the threat models and design specifications, then move on to source
    code.


    The ideal flow of activities for code review success is perhaps best described
    by the steps identified by Chmielewski et al. in MSDN Magazine:


    +   (a) Threat Modeling: Understand code and data flows; identify high-risk areas
    and entry points.

    +   (b) Code Reviews: Document all findings in an appropriate way, as well as
    the process itself.

    +   (c) Resolve Problems: Cooperate with owners of code on applying fixes and
    further efforts.

    +   (d) Learn the Lesson: Update tools, educate development teams, improve processes,
    and plan future iterations.²


    For an effective security code review, set goals and constraints for the following.


    +   * Time: Set a time limit. This helps you to avoid spending too much time on
    a single issue. Performing multiple, smaller reviews is more effective than doing
    one long review.

    +   * Types of issues: Determine what types of issues you are looking for. For
    example, consider:

    +       * General issues that affect confidentiality, integrity, and availability

    +       * Issues related to your application’s security quality-of-service requirements

    +       * Issues related to your application’s compliance requirements

    +       * Issues related to the technologies your application uses

    +       * Issues related to the functionality your application exposes

    +       * Issues you found during threat modeling

    +   * Out-of-scope items: Identify what you will not be looking for. Explain why
    these things are out of scope.³


    # 2. Perform Preliminary Scan


    Static analysis is used to find an initial set of security issues and to improve
    your understanding of where you will be most likely to find security issues when
    you review the code more fully as well as to discover hot spots where additional
    security issues are likely to be found in later steps. This is typically done
    with automatic scans, manual scans, or a combination of both, depending on the
    review objectives and time limitations of the code review plan. Automated scans
    have an advantage in their ability to quickly identify “low-hanging fruit” across
    large sets of applications. The results from these scans are used in creating
    a prioritized list of potential security vulnerabilities and security mechanisms
    to review and investigate.


    An automatic scan can be used to supplement a manual review, as an extra check
    to go through large volumes of code that would be cost- and/or time-prohibitive
    to do manually,'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'to target areas to focus on for manual reviews, and to find security issues
    that may have been missed during a manual review. Automatic scanning tools are
    typically good at finding security issues that are a result of single lines of
    code and finding security issues that span multiple lines of code in a single
    function, and they may find problems that manual reviews will miss. Although automatic
    scanning can supplement a manual review, it should not be used to replace it because
    of the contextual problems and inability to find security issues over multiple
    functions, such as those found in SaaS/cloud applications. Another issue with
    automated tools is the number of false positives and negatives that are found,
    which may require significant efforts to tune down to a reasonable number. On
    the positive side, these types of results will force you to gain a better understanding
    of the code, including controls and data flow, by forcing you to review why a
    false positive is false. Another risk of using automated tools is the possible
    sense of security in believing there are no security issues in your software if
    no security issues are identified as a result of the scan. A significantly sized
    and complex software product should never be assumed to be free of security vulnerabilities.
    All possible steps should be taken to limit the number of coding errors and reduce
    their practical impact, but something is always missed. Automated security tools
    are able to identify more and more coding errors, but some vulnerabilities will
    still be missed and either not detected or hidden among large numbers of false
    positives. Manual source code analysis is not a replacement for these tools, but
    it helps maximize the identification of vulnerabilities when integrated with them.
    As mentioned throughout this book, it requires a holistic approach to security,
    including a human element, to ensure that both false positives are false and that
    the code is really free of security vulnerabilities in spite of being given what
    appears to be a clean bill of health by the automated tools. Using both methods
    together enables reviewers to identify more software security vulnerabilities
    both efficiently and cost-effectively. For these reasons, automated review combined
    with a manual review is the best approach.


    To catch the simpler issues, available security tools should be run against the
    code before manual review begins. To avoid finding known issues, all previously
    identified security vulnerabilities should be fixed. A manual scan is then conducted
    to gain a better understanding of the code and to recognize patterns; the results
    of the scan will identify areas that merit further analysis as the reviewers analyze
    the code for security issues in Step 3 below. This effort, however, should be
    a small percentage of the total code review time and should focus on answering
    the following questions:


    +   • **Input data validation**: Does the application have an input validation
    architecture? Is validation performed on the client, on the server, or both? Is
    there a centralized validation mechanism, or are validation routines spread throughout
    the code base?

    +   • **Code that authenticates and authorizes users**: Does the application authenticate
    users? What roles are allowed, and how do they interact? Is there custom authentication
    or authorization code?

    +   • **Error-handling code**: Is there a consistent error-handling architecture?
    Does the application catch and throw structured exceptions? Are there areas of
    the code with especially dense or sparse error handling?

    +   • **Complex code**: Are there areas of the code that appear especially complex?

    +   • **Cryptography**: Does the application use cryptography?

    +   • **Interop**: Does the application use interop to call into native code?⁴'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 3. Review Code for Security Issues


    The results from Step 2 are typically used to focus the analysis of the reviewer
    during Step 3.


    # 4. Review for Security Issues Unique to the Architecture


    This is where the software security architect or seasoned software security champion
    come into play. In some cases, a third party may be used if you don’t have the
    expertise in-house. This allows experts to apply their knowledge of the business
    logic, use and abuse cases, and prior experience to identify vulnerabilities while
    reducing the likelihood of false positives and false negatives. Static analysis
    tools are incapable of finding application flaws and business logic vulnerabilities
    and require the context and application understanding of a human analyst to identify.
    Having seasoned security professionals involved throughout the SDLC process will
    balance the developers’ tendency to overlook certain coding errors even though
    they wrote the specific fragments of code and usually understand them best. Seasoned
    security experts can also help in understanding the technological context of the
    code, including not only the specific technologies that are used in the software
    product but also operating-system and third-party dependencies as well as tools
    used in development. From a security perspective, these security experts can identify
    relationships between a product and other systems, applications, or services.
    In the context of security, it is possible for them to determine what components
    a product relies on, as well as what other software depends on the product, and
    how these relationships can be used to determine how a product affects the rest
    of the system and how it may be affected by it. Human errors are typically the
    cause of most security problems; given the current shortcomings of automated tools,
    humans should also be part of the solution. For example, a small coding error
    can result in a critical vulnerability that ends up compromising the security
    of an entire system or network or may result from a sequence of errors that occur
    during the course of the development cycle where a coding error is introduced
    and goes undetected during the testing phases, and available defense mechanisms
    do not stop a successful attack. This is just another example of why the human
    element is necessary in the process—to be able to assess these types of situations,
    which are currently beyond the capabilities of automated software security tools.


    The basic design of a product may also contain flaws, and it should be noted that
    some coding errors, although they may affect product reliability, are not actual
    vulnerabilities. Remember that the ultimate goal of security code reviews is to
    find code vulnerabilities that are accessible by an attacker and that may allow
    the attacker to bypass a security boundary.


    # 6.4 Security Analysis Tools


    The final goal of the security code review process is to improve the overall security
    of the product and to provide output that can be used by the development team
