    We would like to reiterate that it is not an either/or proposition between different
    types of security testing. For a product to be secure, it should go through all
    types of security testing—static analysis, dynamic analysis, manual code review,
    penetration testing, and fuzzing. Often, trade-offs are made during the development
    cycle due to time constraints or deadlines, and testing is skipped as a product
