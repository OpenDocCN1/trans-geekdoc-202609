    \ determined to be a P1 project, then the SDL team and privacy lead must review\
    \ the Microsoft® SDL Privacy Questionnaire (Appendix C)11 mentioned in the previous\
    \ chapter or its equivalent to determine whether a privacy disclosure is required.\
    \ If the privacy lead determines that a privacy disclosure is waived or covered,\
    \ then there is no need to meet this requirement. The privacy lead will give final\
    \ approval for release of the privacy disclosure statement.\n+   \n+   - If the\
    \ project has been determined to be a P2 project, then the privacy lead will determine\
    \ if a privacy design review is being requested, provide a confirmation that the\
