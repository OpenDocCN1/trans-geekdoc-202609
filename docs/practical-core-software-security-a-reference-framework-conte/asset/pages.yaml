    # ## 9.3.2.3.5 Costs


    The *costs* are qualitative statements about the expenses incurred by an organization
    attaining the given level. Although specific values will vary for each organization,
    these are meant to provide an idea of the one-time and ongoing costs associated
    with operating at a particular level.


    # ## 9.3.2.3.6 Personnel


    These properties of a level indicate the estimated ongoing overhead in terms of
    human resources for operating at the given level:


    +   - Developers—individuals performing detailed design and implementation of
    the software

    +   - Architects—individuals performing high-level design work and large-scale
    system engineering

    +   - Managers—individuals performing day-to-day management of development staff

    +   - QA testers—individuals performing quality assurance testing and prerelease
    verification of software

    +   - Security auditors—individuals with technical security knowledge related
    to software being produced

    +   - Business owners—individuals performing key decision making on software and
    its business requirements

    +   - Support operations—individuals performing customer support or direct technical
    operations support


    # ## 9.3.2.3.7 Related Levels


    The *related levels* are references to levels within other practices that have
    some potential overlaps, depending on the organization’s structure and progress
    in building an assurance program. Functionally, these indicate synergies or optimizations
    in activity implementation if the related level is also a goal or already in place.'
