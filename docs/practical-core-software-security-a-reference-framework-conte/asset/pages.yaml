  md: '# Chapter 8


    # Post-Release Support (PRSA1–5)


    # CHAPTER OVERVIEW


    Many of the functions and their associated activities and best practices described
    in this chapter are handled by groups other than the software security group that
    would have the principal oversight over SDL activities and best practices (A1–A5)
    described in the previous chapters. Here we’ll describe them as activities that
    are the responsibility of the centralized software security group in an organization.


    # CHAPTER TAKE-AWAYS


    +   - Explore the practices that compose the post-release support activities (PRSA)
    of the security development lifecycle (SDL).

    +   - Document the key success factors for implementing the PRSA deliverables.

    +   - Prepare plans and deliverables for the PRSA using the case study in Appendix
    A.


    Figure 8.1 illustrates the post-release support activities (PRSA) and best practices.

    Organizing the software security group with matrixed relationships enables the
    complete implementation and operation of the SDL. The authors have found that
    this is a much more cost-effective and efficient way to manage these activities
    with existing resources. This is precisely the reason we highly recommend that
    the core software security group be composed of senior software security architects
    who have hard “dotted-line” relationships with the software security champions,
    who in turn have the same relationships with the software security evangelists.
    There should also be a strong relationship between the software security architects
    in the centralized software security group and the product managers of each Tier
    1 software product, just as there is for the software security champions. It is
    also important that the software security group and function be in the right organization
    so they can be most successful.'
