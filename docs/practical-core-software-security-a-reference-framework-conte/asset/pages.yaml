- pgno: 246
  md: '# 9.7 Overcoming Organizational and Business Challenges with a Properly Designed,
    Managed, and Focused SDL


    We have outlined an organizational structure with associated roles and responsibilities
    specific to the tasks that are identified in our SDL model and that have been
    field-tested and optimized by the authors of this book. This previously described
    structure will serve you well to effectively and efficiently create, deliver,
    and manage the best practices described in this book. It will also assist in the
    successful buy-in and management of the tasks through A1–A5 in our SDL model.
    As an added benefit, by using the organizational structure suggested, you will
    be able to deliver the tasks described in Chapter 8 for post-release support (PRSA1–5),
    which are typically conducted by other organizations than your own. By using the
    metrics described in each section of the SDL model, you will not only be able
    to effectively manage and track your software security programs and SDL success
    but also provide a dashboard to your corporate management and internal customers
    as to the current state of your program. This dashboard can also be used to identify
    gaps, which can be used to justify headcount, funding, and other resources, when
    needed. Most important, by building security in, you will maximize the ability
    to avoid post-release discoveries of security vulnerabilities in your software
    and increase your ability to successfully manage these discoveries on the occasions
    when they do occur.


    # 9.8 Software Security Organizational Realities and Leverage


    Although an incremental headcount hire plan based on a progressive increase in
    workload is typically the norm for most organizations, incremental growth isn’t
    the right model for what has been proposed in this book and certainly isn’t a
    reality for those going through austerity realities within their organizations.
    Doing more with less is a reality we all face, regardless of the risks we are
    facing. To help solve this conundrum, we have proposed a model for a software
    security group that doesn’t depend on continual growth, linear or otherwise. The
    virtual team grows against linear growth, allowing a fully staffed, centralized
    software security group to remain relatively stable. We believe that a centralized
    group comprising one seasoned software security architect per main software product
    group and one for each software product within that group in your software engineering
    development organization will be sufficient to scale quite nicely as long as the
    software security champion program is adhered to, as proposed in this book. In
    addition, by sharing the responsibility for a typical product security incident
    response team (PSIRT) among the key software security champions for each software
    product in a development organization, a single PSIRT manager should suffice,
    given the shared responsibilities of the task throughout the organization. As
    described earlier in the book, excellence is not about increasing numbers; it
    is about the quality of the staff you hire. Each of these seasoned software security
    architects can coordinate and support the implementation of the SDL within each
    business unit and software product line and will:


    +   - Provide the associated software security champion with the centralized software
    security group process and governance.

    +   - Mentor the software security champions in security architecture and reviews.

    +   - Support the associated business unit software security champion in the mentorship
    of each software product line software security champion.

    +   - Coordinate with product management for early and timely security requirements.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - Help to calculate project security risk.

    +   - Help to ensure that software security champions institute appropriate and
    full security testing.

    +   - Ensure that appropriate security testing tools are available (static, dynamic,
    fuzzing) for use in the SDL, as appropriate.


    Although these tasks benefit greatly from senior experience and discretion, there
    is a significant opportunity in having these senior technical leaders’ mentor
    the software security champions and software security architects, as both a wonderful
    growth opportunity for the individuals involved and a cost savings to the company
    and the organization. Someone with the potential to grow into a leader through
    experience and mentorship is a perfect candidate for the software security champions
    in our model. We are the sum of everything we have ever done, which is constantly
    being revised and remembered. The same can be said of software security architects;
    it is a journey, not a point in time, and requires constant learning, mentoring,
    and collaboration with those who have been there before.


    In our model, there are multiple paths to appropriate “coverage.” Unlike a fully
    centralized function, a virtual team, handled with care, can be coalesced and
    led by a far smaller central team. The authors have made this model work, sometimes
    numerous times in a number of disparate organizations, and consider this a proven
    track record for a model that will constantly evolve with the ever-changing realities
    we are faced with in software security. Each member of the centralized software
    security group must be able to inspire, encourage, and lead a virtual team such
    that the virtual members contribute key subject matter expert (SME) tasks but
    at the same time do not become overloaded with additional or operational tasks.
    “Just enough,” such that the PSIRT function can reap huge benefits through having
    true SMEs contribute and enable, while at the same time making sure that no one
    person bears the entire brunt of a set of operational activities that can’t be
    dodged.


    Since our model for a centralized software security group makes use of an extended
    virtual team, the need for a large central PSIRT staff, as may be found in other
    organizations, is not needed. Tasks that can be managed in a decentralized manner
    are performed, such as technical investigations, release planning, and fix development.
    However, there is a coordination role that must be sophisticated enough to technically
    comprehend the implications and risks involved in various responses. Peer review
    is a powerful tool for avoiding missteps. Further, the central role within the
    engineering software development group itself provides coordination across teams,
    something that is lacking in most organizations. We must not respond individually
    to a vulnerability that affects many software products in unique and idiosyncratic
    ways. Further, it is essential to provide an interface between PR (and sometimes
    marketing) support and the technical teams who are involved in responding. You
    want your response to vulnerability reporters to be consistent and to avoid putting
    your company and your brand at risk, externally.


    # 9.9 Future Predictions for Software Security


    We have divided this section into to two parts. First, the bad news, which is
    the things that we see that will likely continue on in industry but that should
    be changed; and second, the good things we see with regard to software security
    in the future—the light at the end of the tunnel, if you will.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 9.9.1 The Bad News


    We’ll start with the bad news. For the most part, other than threat modeling and
    architectural security reviews, which are an art—not a science, software security
    isn’t that difficult, but it is an area that industry has known about for many
    years and yet has chosen to do almost nothing about. This is evident in the top
    software vulnerabilities in the Common Vulnerabilities and Exposures (CVE*) and
    the OWASP* and CWE™/SANS Top 25 vulnerability lists, which have remained essentially
    the same over the last 10 years. Although industry has started to take leadership
    in this area over the last few years, we see software security as an ongoing problem
    for the foreseeable future, and it will take time to finally steer industry in
    the right direction. As discussed throughout the book, building security into
    the software development process is more about an attitude change, management
    acceptance, and business/operational process changes than blazing new trails in
    new scientific or technical disciplines.


    The price of fixing vulnerabilities later in the cycle is very high. The effort
    required to tune and maintain current product security tools can be more expensive
    than buying new tools. Although much of the burden of making this change is on
    vendors, we have some thoughts that may help change this paradigm. We propose
    a paradigm shift away from vulnerabilities in software security. Not every vulnerability
    gets exploited, or is even exploitable. Often, mitigations that are not obvious
    to vanilla vulnerability scanners make even garden-variety vulnerabilities unattractive
    to attackers. We are not suggesting that we stop fixing bugs in code. Quite the
    opposite, as should be clear from the contents of this book. Still, delivering
    reports with thousands of vulnerabilities have not made software secure. However,
    as a collective whole, the security industry continues to focus on vulnerability:
    every new type of attack, every new variation, and every conceivable attack methodology.
    Instead, a focus on correct program behavior aligns well with how developers approach
    designing and creating code.


    Correctness goes to the heart of the software process. In our experience, developers
    are rewarded for correctness. And it should be obvious that vulnerabilities are
    errors, plain and simple. Focusing on correctness would, unfortunately, be a sea
    change in software security. Tools today often don’t report the one, single bug
    that will respond to multiple variations of a particular type of attack. Instead,
    too often, tools report each variation as a “vulnerability” that needs to be addressed
    by the developer. This is the way security people think about the situation. It’s
    an attacker’s view: Which attack methods will work on this particular system?
    That is the question that most vulnerability scanners address today (as of this
    writing).


    However, people who write code simply want to know what the coding error is, where
    it is in the code, and what the correct behavior is that must be programmed. Often,
    if the tool contains any programming hints, these tend to be buried in the tool’s
    user interface. Instead, we propose that a tool should be no more difficult to
    use than a compiler. The results could be a list of code errors, coupled to line
    numbers in the code, with a code snippet pointing out where the error lies. Of
    course, this is an oversimplification. Some kinds of security vulnerabilities
    lie across code snippets, or even across a whole system. Still, focus could be
    on what is the coding error and what is its solution. Logical errors could be
    described in terms of the design solution: things such as randomizing session
    IDs properly or including nonpredictable session identifiers with each web input
    (to prevent cross-site request forgery, for instance). In a world in which tens
    of millions of people are writing web code, and a great deal of that code contains
    exploitable vulnerabilities, we need an approach that simplifies the finding of
    the actual coding errors.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Massive counts of the millions of vulnerabilities have not reduced the attack
    surface. We like to suggest calling this new approach “developer-centric software
    security,” “Developer centric” means that security people should understand developers’
    focus and developers’ problems. The security industry must begin to address these
    in order to get security considered in its rightful place, right next to maintainability,
    correctness of algorithm, correctness of calculation, and all the other problems
    that a skilled programmer must face.


    # 9.9.2 The Good News


    As discussed throughout the book and in the previous section, industry knows what
    to do, that they should do it, and how to do it, but they don’t do it. Knowing
    what to do is a significant portion of the battle that needs to be won. And we
    believe that pressure resulting from ISO standards (27034, 29147, and 30111) and
    the recent increase in business and government community awareness and oversight
    for software security that is built into the software development process will
    finally make software security a priority and business enabler. Other good news
    is that the tools and training for software security continue to improve. We also
    see more and more mentoring of the next generation of software security architects,
    which will serve our industry well over time. Most important, new organizational
    and management SDL models based on real-life experiences and successes, such as
    the one described in this book, are being developed.


    # 9.10 Comprehensive SDL Review


    Earlier in this chapter, we summarized the Key Success Factors for each phase
    of the SDL (see Table 9.1). Here we include both the deliverables and metrics
    that should be included as regular artifacts of your specific SDL. Table 9.2 summarizes
    the deliverables from each phase, and Table 9.3 suggests some metrics that practitioners
    have found useful. With measurements of program maturity that you have seen in
    this chapter, you should be able to further customize the deliverables and metrics
    you need for operating the SDL and planning for its next evolution.


    # 9.11 Conclusion


    The criticality of software security as we move quickly toward this new age of
    tasks previously relegated to the human mind and now being replaced by software-driven
    machines cannot be underestimated. It is for this reason that we have written
    this book. In contrast and for the foreseeable future, humans will continue to
    write software programs. This also means that new software will keep building
    on legacy code or software that was written prior to security being taken seriously
    or before sophisticated attacks became prevalent. As long as humans write the
    programs, the key to successful software security is to make the software development
    program process more efficient and effective. Although the approach of this book
    includes people, process, and technology approaches to software security, the
    authors believe that the people element of software security is still the most
    important part to manage. This will remain true as long as software is developed,
    managed, and exploited by humans. This book has outlined'
