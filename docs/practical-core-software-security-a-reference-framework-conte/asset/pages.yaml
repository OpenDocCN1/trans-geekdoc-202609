  md: 'in that there will also ideally be one software security champion (SSC) per
    Tier 1 software product within each engineering software product development group.
    Another element of the talent is the software security evangelists (SSEs) for
    organizations that are large enough to have extra candidates for the software
    security champions’ (SSCs) role, who can be candidates for SSEs until there is
    a slot for them as SSCs. An SSE has two roles—as an SSC in training and as an
    evangelist for the overall software product security program promulgating policy,
    enforcing policy, and evangelizing the overall SDL process.


    # 8.1.3 The Right Process


    The right process comprises the core SDL activities and best practices described
    in this book so far and summarized in Figure 8.4. In addition to the core activities
    and best practices, we have added the activities and best practices highlighted
    in Figure 8.1. Given the continued pressure to do more with less, we don’t believe
    most organizations will have the luxury of having most of the elements of PRSAs
    1–5 as separate organizations but will need to provide for innovative ways to
    include them in their overall software security program to optimize the leverage
    of use of available resources. Sections 8.2–8.6 of this chapter will provide our
    approach to the activities and best practices required to make this a success
    in every organization in which it is appropriate.


    # 8.2 PRSA1: External Vulnerability Disclosure Response


    One of the key elements of our post-release methodology is that the typical Product
    Security Incident Response Team (PSIRT) function can be a shared responsibility
    within our proposed leveraged organizational structure for software security and
    privacy that covers responses to both post-release security vulnerability and
    privacy issue discoveries. No matter how good your software security program and
    associated SDL is, the fact is that something will be missed at some point, and
    you need a plan to respond to this. Most important, if discovery of software security
    vulnerabilities and privacy issues in post-release software products is a common
    occurrence, that is a clear sign that building security into the organization’s
    software development life cycle (SDLC) through an SDL-like process is weak or
    nonexistent. Such weakness can result in negative visibility due to publicly disclosed
    exploitation of vulnerabilities or security flaws inherent to the post-release
    software, subsequent loss of market share due to brand defamation, lawsuits or
    breach of contracts, and a resultant major target for further exploitation by
    adversarial opportunities.


    Based on our experiences, we cannot emphasize enough how important it is to have
    a single group that acts as a focal point for all communications with customers
    about security vulnerabilities. Often, we have seen at least three different groups
    communicating with customers: customer support, sales, and an information security
    group. PSIRT may or may not be part of the information security organization in
    a particular company, though this is certainly desirable. To summarize, a clearly
    defined chain of communications with customers is of critical importance to prevent
    disclosure of unintended information and to avoid panic and putting entire accounts
    at stake.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# 8.2.1 Post-Release PSIRT Response


    In relation to software security, a PSIRT is responsible for responding to software
    product security incidents involving external discoveries of post-release software
    product security vulnerabilities. As part of this role, the team manages the investigation
    of publicly discovered security vulnerabilities of their company’s software products
    and the systems they interact with. The external discoverers might be independent
    security researchers, consultants, industry organizations, other vendors, or benevolent
    or possibly even nefarious hackers who identify possible security issues with
    software products for which the PSIRT is responsible. Issues identified are prioritized
    based on the potential severity of the vulnerability, typically using the CVSS
    scoring system described earlier in the book as well as other environmental factors.
    The resolution of a reported incident may require upgrades to products that are
    under active support from the PSIRT’s parent company.


    Shortly after its identification and during the investigation of a claim of vulnerability,
    the PSIRT should work collaboratively with the discoverer to confirm the nature
    of the vulnerability, gather required technical information, and ascertain appropriate
    remedial action.


    When the initial investigation is complete, the results are delivered to the discoverer
    along with a plan for resolution and public disclosure. If the incident reporter
    disagrees with the conclusion, the PSIRT should attempt to address those concerns.


    The discoverer(s) will be asked to maintain strict confidentiality until complete
    resolutions are available for customers and have been published by the PSIRT on
    the company’s website through the appropriate coordinated public disclosure typically
    called a security bulletin (SB). During the investigation and pre-reporting process,
    the PSIRT coordinates communications with the discoverer, including status and
    documentation updates on the investigation of the incident. Further information
    may also be required from the discoverer to validate the claim and the methods
    used to exploit the vulnerability. Discoverers will also be notified that if they
    disclose the vulnerability before publication by the PSIRT, then the discoverers
    will not be given credit in the public disclosure by the company and the case
    will be treated as a “zero day,” no-notice discovery that has been reported publicly
    by an external source. In the case of a zero-day discovery, the PSIRT and development
    teams work together to remediate the vulnerability as soon as possible, according
    to the severity of the Common Vulnerability Scoring System (CVSS) (https://www.first.org/cvss/v3.1/specification-document)
    scoring for the particular vulnerability. In the case of a zero-day, highly scored
    vulnerability, the company’s PR team will work closely with the PSIRT to manage
    potential negative press and customer reaction.


    During the investigation of a reported vulnerability, the PSIRT coordinates and
    manages all sensitive information on a highly confidential basis. Internal distribution
    is limited to those individuals who have a legitimate need to know and can actively
    assist in the resolution of the vulnerability.


    The PSIRT will also work with third-party coordination centers, such as the CERT®
    Coordination Center (CERT/CC) (https://www.kb.cert.org/vuls/), and others to manage
    a coordinated industry disclosure for reported vulnerabilities affecting the software
    products they are responsible for. In some cases, multiple vendors will be affected
    and will be involved in the coordinated response with centers such as CERT. If
    a coordination center is involved, then, depending on the circumstances, the PSIRT
    may contact the center on the behalf of the discoverers, or assist them in doing
    it themselves.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'If a third-party component of the product is affected, this will complicate
    the remediation process because the PSIRT will be dependent on a third party for
    remediation. A further complication is that the PSIRT will have to coordinate
    and, in many cases, notify the vendor directly to ensure coordination with the
    third-party coordination center and, likely, direct involvement with the discoverer.
    Even though a third-party component has been used, the assumption is that the
    owner of the primary software product is ultimately responsible for all components
    of the software, whether they own them or not.


    As mentioned above, PSIRTs generally use the CVSS to assess the severity of a
    vulnerability as part of their standard process for evaluating reported potential
    vulnerabilities in their products and determining which vulnerabilities warrant
    external and internal reporting.


    The CVSS model uses three distinct measurements or scores that include base, temporal,
    and environmental calculations, and the sum of all three scores should be considered
    the final CVSS score. This score represents a single moment in time; it is tailored
    to a specific environment and is used to prioritize responses to a particular
    externally discovered vulnerability. In addition, most PSIRTs will consider modifying
    the final score to account for factors that are not properly captured in the CVSS
    score. PSIRTs typically use the following CVSS guidelines when determining the
    severity of a particular vulnerability and the need to report it:


    +   - Critical (C)— CVSS base score of 9.0–10.0

    +   - High (H)— CVSS base score of 7.0–8.9

    +   - Medium (M)—CVSS base score of 4.0–6.9

    +   - Low (L)—CVSS base score of 0.1–3.9²


    If there is a security issue involving a third-party software component in the
    product the PSIRT is responsible for, then, depending on the situation and whether
    the third party has a CVSS score, the PSIRT may use the CVSS score provided by
    the component creator and/or may adjust the score to reflect the impact on the
    overall software product.


    Public disclosure, including the relevant base and temporal CVSS scores and a
    CVE® ID³ report, is typically made for an external post-release discovery event
    when one or more of the following have occurred:


    +   - The incident response process has been completed and has determined that
    enough software patches or other remediations exist to address the vulnerability.
    Public disclosure of code fixes can be issued to address high-severity vulnerabilities.

    +   - Active exploitation of a vulnerability that could lead to increased risk
    for the PSIRT company’s customers has been observed that requires a published
    security vulnerability announcement. The announcement may or may not include a
    complete set of patches or other remediation steps. When possible, compensating
    controls are included in the public announcement to provide interim protection
    that will limit exposure until the permanent fix is announced.

    +   - A zero-day announcement or other potential for increased public awareness
    of a vulnerability affecting the PSIRT company’s product is probable, which could
    lead to increased risk for customers. In these cases, the PSIRT has worked closely
    with the company’s PR team to help assess public indicators and warnings, such
    as Twitter feeds and blogs, that this exposure is imminent, and it will have prepared
    a statement ahead of time. Again,'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'this accelerated public vulnerability announcement will not include a complete
    set of patches or other remediation steps, but, ideally, interim compensating
    controls to limit exposure can be identified.


    A typical step-by-step PSIRT case-handling process will include the following
    steps:


    +   1. Notification of vulnerability as assessed by an individual discoverer or
    organization is received.

    +   2. The responsible software product development group is identified, together
    with resources required for assessment of the discoverers'' vulnerability claim.

    +   3. If the claim is credible, an impact assessment is made and a timeline for
    a fix is determined. The level of effort needed and priority to develop a fix
    is balanced against the likelihood of public disclosure of the severity and risk
    of the vulnerability. In some cases, external resources may be required due to
    other critical tasks the development team is carrying out. If the claim is not
    credible, additional information is requested from the discoverer to ensure that
    the threat was properly recreated in the testing environment. If it is not credible
    after the testing environment has been confirmed, then the discoverer is notified
    of the company''s findings. If the discoverer has gone public claiming the vulnerability
    is credible even though the company has determined it is not, then the PSIRT typically
    works with the company''s PR team to publish the results of the company''s finding
    as a counter to the discoverer.

    +   4. The time frame for remediation, the resources needed to fix a confirmed
    vulnerability, and the reporting format (e.g., security bulletin, knowledge base
    article, or other form of public notification) are committed to.

    +   5. After patch or other remediation methods have been identified, all customers
    are notified simultaneously on the date of the availability of the fix through
    the reporting format determined in Step 4.


    # 8.2.1.1 ISO 29147 and ISO 30111


    Two International Organization for Standardization (ISO*) standards relate to
    the proper functioning of a vendor PSIRT:


    +   1. ISO/IEC 29147:2018 [ISO/IEC 29147:2018]—Information technology—Security
    techniques—Vulnerability disclosure


    This standard provides requirements and recommendations to vendors on the disclosure
    of vulnerabilities in products and services and is applicable to vendors who choose
    to practice vulnerability disclosure to reduce risk to users of vendors'' products
    and services.


    Vulnerability disclosure enables users to perform technical vulnerability management
    as specified in ISO/IEC 27002:2013, 12.6.1. Vulnerability disclosure helps users
    protect their systems and data, prioritize defensive investments, and better assess
    risk. The goal of vulnerability disclosure is to reduce the risk associated with
    exploiting vulnerabilities. Coordinated vulnerability disclosure is especially
    important when multiple vendors are affected. This standard provides:'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - Guidelines on receiving reports about potential vulnerabilities

    +   - Guidelines on disclosing vulnerability remediation information

    +   - Terms and definitions that are specific to vulnerability disclosure

    +   - An overview of vulnerability disclosure concepts

    +   - Techniques and policy considerations for vulnerability disclosure

    +   - Examples of techniques, policies (Annex A), and communications (Anne B)⁴


    2. ISO/IEC 30111:2019 [ISO/IEC 30111:2019]—Information technology—Security techniques—Vulnerability
    handling processes


    This standard provides requirements and recommendations for how to process and
    remediate reported potential vulnerabilities in a product or service and is applicable
    to vendors involved in handling vulnerabilities. Other related activities that
    take place between receiving and disclosing vulnerability reports are described
    in ISO/IEC 30111.⁵


    # 8.2.2 Post-Release Privacy Response


    In addition to post-release security issues that may be discovered and disclosed,
    potential privacy issues may also be discovered. In our experience, privacy-related
    issues do not get as much attention as security vulnerabilities, nor is a group
    charted specifically to deal with such issues. A software development company
    may have a chief privacy officer (CPO) or equivalent, such as a specialized counsel
    on retainer, but most do not have a staff and are likely limited to one privacy
    support expert, at best. This necessitates a close alignment and working relationship
    between the PSIRT function and the centralized software security group and the
    privacy function of the company, whether the latter is in-sourced or out-sourced.
    A post-release privacy response should be built into the PSIRT process just as
    security should be built into the SDLC. Given the potential legal nature of privacy
    issues or privacy control vulnerability exploitations, the privacy advisor should
    script basic talking points, response procedures, and legal escalation requirements
    for the response team to use to respond to any potential privacy issues discovered
    post-release. Some basic guidelines follow:


    +   - Privacy experts should be directly involved in all incidents that fall into
    the P1 and P2 categories described earlier in this book.

    +   - Additional development, quality assurance, and security resources appropriate
    for potential post-release privacy discovery issues should be identified during
    the SDL process so that can participate in post-release privacy incident responses.

    +   - Software development organizations should develop their own privacy response
    plans or modify the Microsoft® SDL Privacy Escalation Response Framework (Appendix
    K)⁶ for their own use. This should include risk assessment, detailed diagnosis,
    short-term and long-term action planning, and implementation of action plans.
    As with the PSIRT responses outlined above, the response might include creating
    a patch or other risk-remediation procedures, replying to media inquiries, and
    reaching out to the external discoverer.'
