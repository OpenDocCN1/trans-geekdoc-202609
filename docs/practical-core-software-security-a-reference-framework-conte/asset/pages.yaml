  md: '# 9.4.4 BSIMM''s 12 Practice Areas


    Under each BSIMM category, there are a number of objectives and associated activities
    that determine the current level of maturity for that category. As you work your
    way down the list, the evidence of additional activities moves the organization
    further along the maturity levels, so that those organizations that claim to conduct
    all the activities in a specific category wind up as the most mature, at Level
    3. The 12 practices are shown in Figure 9.6.


    # 9.4.5 Measuring Results with BSIMM


    Figure 9.7 shows a spider graph of the average maturity levels from the 130 organizations
