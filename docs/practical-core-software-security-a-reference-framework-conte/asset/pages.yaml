- pgno: 115
  md: '+   3. The system follows the principle of least privilege for user and service
    accounts.

    +   4. Privilege separation is correctly configured within the presentation, business,
    and data access layers.


    # Configuration management


    +   1. Least privileged processes are used and service accounts with no administration
    capability.

    +   2. Auditing and logging of all administration activities is enabled.

    +   3. Access to configuration files and administrator interfaces is restricted
    to administrators.


    # Data protection in storage and transit


    +   1. Standard encryption algorithms and correct key sizes are used.

    +   2. Hashed message authentication codes (HMACs) are used to protect data integrity.

    +   3. Secrets (e.g., keys, confidential data) are cryptographically protected,
    both in transport and in storage.

    +   4. Built-in secure storage is used for protecting keys.

    +   5. No credentials and sensitive data are sent in clear text over the wire.


    # Data validation/parameter validation


    +   1. Data type, format, length, and range checks are enforced.

    +   2. All data sent from the client is validated.

    +   3. No security decision is based on parameters—for example, URL parameters—that
    can be manipulated.

    +   4. Input filtering via white list validation is used.

    +   5. Output encoding is used.


    # Error handling and exception management


    +   1. All exceptions are handled in a structured manner.

    +   2. Privileges are restored to the appropriate level in case of errors and
    exceptions.

    +   3. Error messages are scrubbed so that no sensitive information is revealed
    to the attacker.


    # User and session management


    +   1. No sensitive information is stored in clear text in the cookies.

    +   2. The contents of the authentication cookies is encrypted.

    +   3. Cookies are configured to expire.

    +   4. Sessions are resistant to replay attacks.

    +   5. Secure communication channels are used to protect authentication cookies.

    +   6. User is forced to re-authenticate when performing critical functions.

    +   7. Sessions are expired at logout.


    # Auditing and logging


    +   1. Sensitive information (e.g., passwords, PII) is not logged.

    +   2. Access controls (e.g., ACLs) are enforced on log files to prevent unauthorized
    access.

    +   3. Integrity controls (e.g., signatures) are enforced on log files to provide
    nonrepudiation.'
