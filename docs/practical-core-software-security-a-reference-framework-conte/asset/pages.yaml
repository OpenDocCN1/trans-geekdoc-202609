- pgno: 30
  md: 'code that is easy to maintain and reusable; however, if that code allows an
    unauthorized user to access the application’s assets, then that code is either
    exposed or it is not, and there is no second chance for getting it right.


    SDLs should not be confused with the standard software development life cycle.
    SDL methodology, as the name suggests, is really aimed at developing secure software,
    not necessarily quality software. As defined in the IT Law Wiki, the “Security
    Development Lifecycle is a software development process used to reduce software
    maintenance costs and increase reliability of software concerning software security
    related bugs.”16 In January 2002, many Microsoft software development groups prompted
    “security pushes” to find ways to improve existing security code. Under this directive,
    the Trustworthy Computing (TwC) team formed the concepts that led to the Microsoft
    Security Development Lifecycle. Established as a mandatory policy in 2004, the
    Microsoft SDL was designed as an integral part of the software development process
    at Microsoft.17 The term SDL has been used by others since then—both for representing
    the Microsoft process and as a generic term for the process defined in the IT
    Law Wiki link above. Our use of the term SDL throughout this book will be to represent
    a secure development process composed of software security best practices based
    on comparative research on Microsoft’s SDL and alternative models developed since
    2004; the authors’ experience and research into what does and does not work in
    most current development organizations; and the business realities of today’s
    development austerity requirements coupled with the increasing demands for securing
    code at the source with relevant, cost-effective, and realistic software security
    practices.


    The goals of SDL are twofold: The first goal is to reduce the number of security
    vulnerabilities and privacy problems; the second goal is to reduce the severity
    of the vulnerabilities that remain. There are industry standards that define what
    needs to be done in software development, such as ISO®/IEEE™, which define the
    primary phases of a traditional software development approach to software engineering.
    The elements of an SDL are typically very adaptive and are incorporated into the
    standard development life cycle for an organization.


    Static analysis and threat modeling are among the tools used to develop secure
    code. Static analysis tools use a technique called “Taint Analysis” to look for
    unfiltered or unsanitized inputs (the scourge of software security) in application
    code. The greatest promise of static analysis tools derives from their ability
    to identify many common coding defects related to poor software development hygiene.
    Unfortunately, implementation bugs created by developer errors are often only
    part of the problem. Static analysis tools cannot evaluate design and architectural
    flaws. They cannot identify poorly designed cryptographic libraries or improperly
    selected algorithms, and they cannot point out design problems that might cause
    confusion between authentication and authorization. They also cannot identify
    passwords or magic numbers embedded in code. Static analysis tools can, however,
    peer into more of a program’s dark corners with less fuss than dynamic analysis,
    which requires actually running the code. Static analysis also has the potential
    to be applied before a program reaches a level of completion at which testing
    can be meaningfully performed. The earlier security risks are identified and managed
    in the software development life cycle, the better!


    Although these SDL practices have been good in theory, when applied to enterprises,
    results have been mixed. There are multiple reasons for this. Legacy code still
    forms a large codebase of our software industry, so going back in time and applying
    these practices is very difficult. Software outsourcing or off-shoring is another
    area where these practices are difficult'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'to implement efficiently. Software developers and companies often work under
    tight deadlines to put a product out before competition, and thus software security
    has typically taken a back seat. There is a lack of management commitment to effectively
    implement SDL practices in such a fast-moving environment in which software security
    is often done as an afterthought.


    Even though some security practices are common to both software and application
    security, such as penetration testing, source code scanning, security-oriented
    testing, and security education, there is no substitute for integrating security
    into the software development life cycle. The human element of the process is
    key to the success of any security development process and requires very seasoned
    software security architects and engineers to be successful. Threat modeling,
    applying principles such as least privilege and defense in depth, is perhaps the
    most understood, important, and needed element of the software development life
    cycle and requires human expertise and not tools to accomplish. One must also
    gather the real security requirements for a system and consider compliance, safety
    issues, contractual requirements, what data the application will process, and
    business risk.


    Training is another critical element of the SDL that requires the human element.
    Training helps to reduce the cost of security, and an effective training program
    will motivate your development team to produce more secure software, with fewer
    problems and with more efficiency and cost effectiveness. It should be emphasized
    that no point solutions will provide a single solution for software security;
    rather, a holistic defense-in-depth approach is required, including a blend of
    people, process, and technology with a heavy emphasis on people. Although tools
    can parse through large quantities of code rapidly, faster than a human could,
    they are no replacement for humans. For the foreseeable future, software security
    will still be considered an art, but the art can be augmented through process
    and technology, and contrary to myths perpetrated by some practitioners, the art
    can be taught through proper mentorship by seasoned software security architects
    and engineers. These are the team members who have the experience, can think like
    an adversary, and do it throughout the development process, which is a key element
    for the success of any SDL. Some authors differentiate between secure-coding best
    practices and secure-design principles; we will address both in the software security
    best practices presented in this book and leverage the experience of the seasoned
    architects and engineers identified above to accomplish this.


    Software security requires a focused effort to be successful and is not a natural
    outcome of conventional software development processes, even from development
    groups that have good traditional “quality” practices. Software security, however,
    should be a key of a mature quality program. As we will explain in this book,
    secure code does not necessarily mean quality code, and quality code does not
    necessarily mean secure code, but the foundation of software applications and
    the development processes that produce them should be based on common best practices
    of both quality code and secure code.


    # 1.3 Quality Versus Secure Code


    The foundation of software applications, and the development processes that produce
    them, is based on the common best principles of quality code and secure code.
    These principles are the driving force behind the concepts and design of industry
    best practices. To produce secure code that will stand the test of time, you must
    learn how to incorporate these principles into'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'the development process. Remember that secure code is not necessarily quality
    code, and quality code is not necessarily secure code.¹⁸


    Secure code does not mean quality code: You must know how to write quality code
    before you can write secure code. A developer can write very secure code that
    authorizes and authenticates every user transaction, logs the transaction, and
    denies all unauthorized requests; however, if the code does not return expected
    results, then even this very secure code may never see the light of day. Software
    quality characteristics are not the same as security. Quality is not measured
    in terms of confidentiality, integrity, and availability, but rather in terms
    of ease of use and whether it is reusable and maintainable.¹⁹


    Quality code does not mean secure code: A developer can write efficient code that
    is easy to maintain and reusable, but if that code allows an unauthorized user
    to access the application’s assets, then the code is of no use. Unlike software
    quality, software security is not subjective. Sensitive information is either
    exposed or it is not, and there is no second chance to get it right. Ultimately,
    quality, security, and maintainability are the three primary goals the industry
    considers to be of the utmost importance in any secure software development process.²⁰


    You cannot have quality without security or security without quality. These two
    attributes complement each other, and both enhance overall software product integrity
    and market value. Good developers should be able to identify what quality factors
    are in software and how to code them. Likewise, good developers should know how
    the software they develop can be attacked and what the weakest areas are in the
    software; if the code allows an unauthorized user to access the application’s
    assets, then that code is either exposed or it’s not, and there is no second chance
    to get it right.²¹


    # 1.4 The Three Most Important SDL Security Goals


    Any competent developer can write very efficient code that is maintainable and
    easy to reuse; however, if the code allows an unauthorized user to access the
    application’s assets, then that code is not secure. Unfortunately, security is
    still an area that is often either overlooked or minimally applied during the
    software development life cycle. There are three minimum goals that the information
    security industry considers of primary importance for an SDL:


    +   1. Confidentiality

    +   2. Integrity

    +   3. Availability


    These three goals are generally referred to collectively by the acronym C.I.A.
    It is generally accepted that if the developers ensure, enforce, and protect C.I.A.
    throughout the software development life cycle through generally accepted practices,
    this will justify high confidence that the code is secure.


    Information security, confidentiality, integrity, and availability are defined
    as follows in 44 U.S.C., Sec. 3542:


    **Information security:** The protection of information and information systems
    from unauthorized access, use, disclosure, disruption, modification, or destruction
    in order to provide confidentiality, integrity, and availability.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '**Confidentiality:** Preserving authorized restrictions on information access
    and disclosure, including means for protecting personal privacy and proprietary
    information.


    **Integrity:** Guarding against improper information modification or destruction,
    and includes ensuring information non-repudiation and authenticity.


    **Availability:** Ensuring timely and reliable access to and use of information.²²


    Confidentiality, availability and integrity combined provide information security.


    Confidentiality is achieved by keeping unauthorized users (human or software)
    from accessing confidential information. By maintaining confidentiality, the software
    will be considered trustworthy. Authorization and authentication are the two properties
    that support confidentiality in that *authorization* ensures that the user has
    the appropriate role and privilege to view data, and *authentication* ensures
    that the user is who he or she claims to be and that the data come from the appropriate
    place. The integrity of the application is defined by the way in which the application
    accepts, transmits, and stores data. The data must remain unchanged by unauthorized
    users and remain very reliable from the data entry point all the way to the database
    and back. Data encryption, digital signatures, and public keys are just some examples
    of how to maintain integrity and confidentiality. Excluding any scheduled downtimes,
    availability refers to the percentage of time a system or software is available
    during its normally scheduled hours of operations. As key components of software
    security, the lack of confidentiality, availability, and integrity will degrade
    the reputation of the product, resulting in both loss of reputation and loss of
    sales. In the end, software security is as much about a good business process
    as it is about quality.


    # 1.5 Threat Modeling and Attack Surface Validation


    Threat modeling and attack surface validation are perhaps the most time-consuming,
    misunderstood, and difficult parts of the SDL. They require the attention of the
    most seasoned and experienced person of the software security team: the software
    security architect. The idea behind threat modeling is simply to understand the
    potential security threats to the system, determine risk, and establish appropriate
    mitigations (What? How bad is it? How can it be fixed?). When it is performed
    correctly, threat modeling occurs early in the project lifecycle and can be used
    to find security design issues before code is committed. This can lead to significant
    cost savings because issues are resolved early in the development life cycle.
    Threat modeling also helps businesses manage software risk, creates awareness
    of security dependencies and assumptions, and provides the ability to translate
    technical risk into business impact. The bottom line is that the earlier security
    risks are identified and managed in the software life cycle, the better.


    The correct way of doing threat modeling requires getting into the mind of the
    hacker, and this takes a special breed of software security professional: one
    who can think like a hacker and imagine all the ways that an adversary could attack
    or exploit the software. It is thus a slightly different way to test applications.
    Although quality assurance professionals can do security testing and can typically
    discover some vulnerabilities, they usually have the customers’ thoughts in mind
    rather than those of the hacker. In many cases, companies do not have this talent
    internally and have to hire third-party contractors to do this work.'
