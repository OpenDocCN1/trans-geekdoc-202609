- pgno: 178
  md: 'to conduct regression testing at this stage of the process, as a double check
    that any possible vulnerabilities have not inadvertently been re-introduced into
    the code and that all previously identified vulnerabilities have been mitigated
    throughout the process. It is also possible that other products with similar functionality
    have had publicly disclosed vulnerabilities since the beginning of the SDL for
    a particular software product, and these can be checked during the final security
    review as well. Given that software products commonly include 500,000 lines or
    more of code, vulnerability scanners can be very useful as a cost-effective and
    time-limited final check of the SDL. These scanners can carry out complex and
    comprehensive data flow analysis to identify vulnerability points that might be
    missed in the course of manual human review. These products are a much quicker
    and more efficient way to analyze every possible path through a compiled code
    base to find the root-cause-level vulnerabilities than using the human approach.
    They are also good tools to “check the checker,” that is, the software security
    architect who has conducted manual reviews throughout the process.


    Vulnerability scanning tools explore applications and use databases of signatures
    to attempt to identify weaknesses. Vulnerability scans are not the same as penetration
    tests and should not be categorized as such; however, some of the same tools may
    be used in both processes. A vulnerability scan is actually an assessment and,
    as such, will look for known vulnerabilities in the software and associated systems.
    It is automated, it can typically be run by a technician, and it will report potential
    exposures. Having your own development staff conduct the vulnerability scans will
    help them not only build up a baseline of what is normal for software security
    but also to understand it. In contrast, a penetration test actually exploits weaknesses
    in the architecture of your systems and requires various levels of expertise within
    your scope of the software and associated systems you are testing. Such testing
    is typically conducted by a seasoned software security professional such as a
    software security architect or seasoned software security engineer.


    Vulnerability scanning is a necessary part of software security and the SDL. Given
    its automated nature and ease of performance, it should be run at various times
    through the SDL as a cost-effective, efficient, and minimally intrusive way to
    continually check your work. The results should be continually baselined to identify
    code or architectural changes that may have introduced new vulnerabilities during
    the process.


    Although every effort must be taken to remediate all discovered vulnerabilities,
    there are some cases in which the scanner may falsely identify a vulnerability
    or exceptions are made. False positives are vulnerabilities where the scanner
    has identified the software as being vulnerable when, in fact, it is not. Of course,
    once this is proven, the false positive can be discounted. Exceptions are made
    because the remediation will prevent optimal software performance, restrict a
    critical function in the product, or even require a complete architecture redesign.
    The risk is deemed acceptable because compensating controls are in place or can
    be put in place with minimal effort to mitigate the risk. Exceptions may be permanent
    or they may have an expiration date attached. The typical vulnerability scan process
    is diagrammed in Figure 7.2.


    Static or dynamic source-code vulnerability scanner tools, as discussed earlier
    in this book, can be used during this phase as appropriate. If the software is
    a web application, you must use tools designed specifically for web application
    vulnerability analysis. One mistake that should be avoided if you are using a
    web application vulnerability scanner is not to scan for just the OWASP “Top 10”
    vulnerabilities, but rather scan for all software application vulnerabilities.
    As with static or other dynamic vulnerability scanners, if critical, high, or
    severe application vulnerabilities are identified by scanning, those vulnerabilities
    must be fixed before the application is released to the production environment
    or shipped.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/a54ed04827050a271316d34985425127_179_0.png)


    Figure 7.2 Typical vulnerability scan process.


    You should use as many vulnerability scanners as possible across the stack. Web
    application scanning alone will not be sufficient, as the software stack (operating
    system, web servers, application servers, database servers) can also have vulnerabilities
    that need to be remediated. Vulnerability scanning should include external scans,
    internal scans and authenticated scans of the entire stack (especially in a cloud
    environment). External scans are primarily targeted at exploring security issues
    that can be found outside the firewall. Since a firewall often restricts ports,
    these scans may be of only limited utility at times; however, they can still be
    very valuable because findings from external scans are often also quite accessible
    to attackers. Internal scans are executed from inside firewalls, and, thus, findings
    are not restricted to ports everyone can see from outside firewalls. Internal
    scans allow us to identify security issues that an attacker or malicious insider
    can exploit if he or she gets inside the network (and is not outside restricted
    by firewalls). Authenticated scans are most comprehensive in that they not only
    identify issues covered by external and internal scans but also identify missing
    patches and reduce false positives. Authenticated scans require software to log
    on to a system to scan it, however, and thus are most intrusive.


    Earlier in the process, security architecture should have laid out configuration
    requirements for the software stack to harden the stack and remove attack surfaces.
    Configuration guidelines exist in various forms, including hardening standards
    for operating systems and other software on which the product will be deployed.
    For example, off-the-shelf operating systems will have many unnecessary services
    and configurations that increase the attack surface on the stack. Hardening guidelines
    can be instrumental in reducing risk from the default configuration.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'In addition to vulnerability scanning, the security configuration should also
    be validated to ensure that the stack itself is hardened. An ideal solution is
    to create a “hardened image” of the stack itself and stamp it with security approval.
    Any variances from this image should raise a red flag when the product is finally
    deployed in the operational environment.


    # 7.3 Code-Assisted Penetration Testing


    Code-assisted penetration testing is a white-box security analysis of a software
    system to simulate the actions of a hacker, with the objective of uncovering potential
    vulnerabilities resulting from coding errors, system configuration faults, or
    other operational deployment weaknesses. It is also used to validate whether code
    implementation follows the intended design, to validate implemented security functionality,
    and to uncover exploitable vulnerabilities. White-box testing requires knowledge
    of how the system is implemented in order to ensure the robustness of the software
    product and its associated systems against intended and unintended software behavior,
    including malicious attacks as well as regular software failures. The white-box
    test assessors must be skilled and seasoned security professionals who have the
    background and knowledge as to what makes software secure or insecure, how to
    think like an attacker, and how to use different testing tools and techniques
    to simulate the actions of a hacker. Penetration tests are typically performed
    in conjunction with automated and manual code reviews and require the analysis
    of data flow, control flow, information flow, coding practices, and exception
    and error handling within the software and its associated systems.


    To successfully conduct a white-box security test of the code being developed
    and the systems with which it will be interacting, three basic requirements must
    be satisfied holistically, not independent of each other. The assessor(s)/tester(s)
    must:


    +   1. Have access to and be able to comprehend and analyze available design documentation,
    source code, and other relevant development artifacts, and have the background
    and knowledge of what makes software secure

    +   2. Be able to think like an attacker and have the ability to create tests
    that exploit software

    +   3. Have knowledge and experience with the different tools and techniques available
    for white-box testing and the ability to think “outside the box” or unconventionally,
    as an adversary would use the same tools and techniques.


    Independence is a key element and requirement for penetration testing, which is
    why engaging a third-party external security firm to conduct a security review
    and/or penetration testing should always be considered. This provides the benefit
    of both an “outside set of eyes” and independence and should be mandatory for
    all projects that are considered to be a high business risk. An outside view and
    perspective will help identify the types of vulnerabilities that other processes
    are not preventing and make the current state of security maturity clear to all.
    The third party should be afforded access to the threat models and architectural
    diagrams created during the SDL to determine priorities, test, and attack the
    software as a hacker might. The level of scrutiny will always be predicated on
    the available budget, since these types of firms typically charge a premium for
    their services. Any security issues or vulnerabilities identified during penetration
    testing must be addressed and resolved before the project is approved for release
    and shipping.'
