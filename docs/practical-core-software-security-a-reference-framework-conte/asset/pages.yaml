    # 8.4 PRSA3: Post-Release Certifications


    There are numerous security-focused certifications that a software development
    team may face after the release of the product that are added on as a requirement
    rather than during the development process, for a variety of reasons. These reasons
    may include use of the software in industry or government sectors that were not
    planned for during design and development, new uses for the software, and new
    government, country, regional, business or industry sector, or regulatory requirements
    that did not exist prior to the release of the product. Post-release certification
    requirements that did not exist prior to the release of the product are a forgivable
    offense, but missing any that are currently required and were missed early in
    the SDL is not. Avoiding noncompliance to certifications required for the use
    of the software that is being developed requires either an internal resource in
    the company dedicated to following software-use certifications and other requirements,
    including privacy requirements, or an individual or organization that specializes
    in this area of experience. This becomes particularly challenging as the number
    of these types of certifications and requirements increases rapidly around the
    globe. Following is a short list of examples of security or privacy certifications
    or standards that could become necessary for a software product to comply with
    post-release requirements due to market or use-case changes:


    +   - The Federal Information Security Management Act (FISMA)^7

    +   - Federal Information Standard 140-2 (FIPS 140-2)—Security Requirements for
    Cryptographic Modules^8

    +   - The U.S. Department of Defense Information Assurance Certification and Accreditation
    Process (DIACAP)^9,10

    +   - The Health Insurance Portability and Accountability Act of 1996 (HIPAA)
    (privacy and security rules)^11

    +   - Safe Harbor (privacy)^12


    # 8.5 PRSA4: Internal Review for New Product Combinations or Cloud Deployments


    In our profession, we continue to encounter the misconception that once software
    has been through an SDL, you can reuse the software code any way you want. This
    presumption is false because any architectural changes that have occurred after
    release of a software product will likely introduce new attack vectors in the
    previously secure code. For this reason, software code must be put through the
    SDL process again when there is a new use of the software or an'
