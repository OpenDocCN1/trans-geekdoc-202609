- pgno: 17
  md: '# Preface


    The age of the software-driven machine has taken significant leaps over the last
    few years. Human tasks, such as those of fighter pilots, stock-exchange floor
    traders, surgeons, industrial production and power-plant operators that are critical
    to the operation of weapons systems, medical systems, and key elements of our
    national infrastructure, have been or are rapidly being taken over by software.
    This is a revolutionary step in the machine whose brain and nervous system is
    now controlled by software-driven programs taking the place of complex nonrepetitive
    tasks that formerly required the use of the human mind. This has resulted in a
    paradigm shift in the way the state, military, criminals, activists, and other
    adversaries can attempt to destroy, modify, or influence countries, infrastructures,
    societies, and cultures. This is true even for corporations, as we have seen increasing
    cases of cyber corporate espionage over the years. The previous use of large armies,
    expensive and devastating weapons systems and platforms, armed robbers, the physical
    stealing of information, violent protests, and armed insurrection are quickly
    being replaced by what is called cyber warfare, crime, and activism.


    In the end, the cyber approach may have just as profound effects as the techniques
    used before in that the potential exploit of software vulnerabilities could result
    in:


    +   • Entire or partial infrastructures being taken down, including power grids,
    nuclear power plants, communication media, and emergency response systems.

    +   • Chemical plants modified to create large-yield explosions and/or highly
    toxic clouds.

    +   • Remote control, modification, or disablement of critical weapon systems
    or platforms.

    +   • Disablement or modification of surveillance systems.

    +   • Criminal financial exploitation and blackmail.

    +   • Manipulation of financial markets and investments.

    +   • Murder or harm to humans through the modification of medical support systems
    or devices, surgery schedules, or pharmaceutical prescriptions.

    +   • Political insurrection and special-interest influence through the modification
    of voting software, blackmail, or brand degradation though website defacement
    or underlying web application takedown or destruction.


    A side effect of the cyber approach is that it has given us the ability to do
    the above at a scale, distance, and degree of anonymity previously unthought of
    from jurisdictionally protected locations through remote exploitation and attacks.
    This gives governments, criminal'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'groups, and activists the ability to proxy prime perpetuators to avoid responsibility,
    detection, and political fallout.


    Although there is much publicity regarding network security, the real Achilles
    heel is the (insecure) software that provides the potential ability for total
    control and/or modification of a target, as described above. The criticality of
    software security as we move quickly toward this new age of tasks previously relegated
    to the human mind being replaced by software-driven machines cannot be underestimated.
    It is for this reason that we have written this book. In contrast, and for the
    foreseeable future, software programs are and will be written by humans. This
    also means that new software will keep building on legacy code or software that
    was written prior to security being taken seriously, or before sophisticated attacks
    became prevalent. As long as humans write the programs, the key to successful
    security for these programs is in making the software development program process
    more efficient and effective. Although the approach of this book includes people,
    process, and technology approaches to software security, we believe that the people
    element of software security is still the most important part to manage as long
    as software is developed, controlled, and exploited by humans. What follows is
    a step-by-step process for software security that is relevant to today’s technical,
    operational, business, and development environments, with a focus on what humans
    can do to control and manage the process in the form of best practices and metrics.
    We will always have security issues, but this book should help in minimizing them
    when software is finally released or deployed. We hope you enjoy our book as much
    as we have enjoyed writing it.


    # About the Book


    This book outlines a step-by-step process for software security that is relevant
    to today’s technical, operational, business, and development environments. The
    authors focus on what humans can do to control and manage a secure software development
    process in the form of best practices and metrics. Although security issues will
    always exist, this book will teach you how to maximize your organization’s ability
    to minimize vulnerabilities in your software products before they are released
    or deployed, by building security into the development process. The authors have
    worked with Fortune 500 companies and have often seen examples of the breakdown
    of security development lifecycle (SDL) practices. In this book, we take an experience-based
    approach to applying components of the best available SDL models in dealing with
    the problems described above, in the form of an SDL software security best practices
    model and framework. Practical Core Software Security: A Reference Framework starts
    with an overview of the SDL and then outlines a model for mapping SDL best practices
    to the software development life cycle (SDLC), explaining how you can use this
    model to build and manage a mature SDL program.


    This is as much a book for your personal benefit as it is for your academic and
    organization’s benefit. Professionals who are skilled in secure software development
    and related tasks are in tremendous demand today, and we continue to see exponential
    demand that will continue to grow for the foreseeable future. As you integrate
    these ideas into your daily duties, your value increases to your company, your
    management, your community, and your industry.


    Although security is not a natural component of the way industry has been building
    software in recent years, the authors believe that security improvements to development
    processes are possible, practical, and essential. They trust that the software
    security best practices and model presented in this book will make this clear
    to all who read the book, including executives, managers, and practitioners.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # Audience


    This book is targeted toward students in higher education programs within the
    business or engineering discipline and anyone who is interested in learning about
    software security in an enterprise environment, including:


    +   - Product Security and Quality Executives

    +   - Software Security Architects

    +   - Security Consultants

    +   - Software Development Engineers

    +   - Enterprise SDLC Program Managers

    +   - Chief Information Security Officers

    +   - Chief Technology Officers

    +   - Chief Privacy Officers whose companies develop software


    If you want to learn about how software security should be implemented in developing
    enterprise software, this is a book you don’t want to skip.


    # # Support


    Errata and support for this book are available on the CRC Press website.


    # # Structure


    This book is divided into nine chapters. Chapter 1 provides an introduction to
    the topic of software security and why it is important that we get it right the
    first time. Chapter 2 introduces the challenges of making software secure and
    the SDL framework. Chapters 3 through 8 provide mapping of our SDL with its associated
    best practices to a generic SDLC framework. Chapter 9 describes how to adapt our
    reference framework to your environment successfully by applying solutions proposed
    in Chapters 3 through 8. Each chapter includes learning objectives, along with
    multiple choice questions and exercises to provide hands-on practice using a case
    study to develop a custom SDL. Answers to the multiple-choice questions are found
    in Appendix B. Each chapter logically builds on prior chapters to help you paint
    a complete set of practical steps that lead to secure application software and
    responsive, secure development practices that predictably and reliably produce
    high-quality and provably secure applications.


    # # Assumptions


    This book assumes that a reader is familiar with the basics of software development
    (and methodologies) and basic security concepts. Knowledge of the SDL, different
    types of security testing, and security architecture is recommended but not required.
    For most topics, we gently introduce readers to the topic before diving deep into
    that particular topic.'
