    Properly used, BSIMM can help you determine where your organization stands with
    respect to real-world software security initiatives, what peers in your industry
    are doing, and what steps you can take to make your approach more effective.


    A maturity model is appropriate because improving software security almost always
    means changing the way an organization works—something that never happens overnight.
    BSIMM provides a way to assess the state of an organization, prioritize changes,
    and demonstrate progress. Not all organizations need to reach the same security
    goals, but by applying BSIMM, all organizations can be measured with the same
    yardstick.


    # 9.4.2 BSIMM Software Security Framework


    The BSIMM Software Security Framework (SSF) is shown in Figure 9.5.


    # 9.4.2.1 Governance


    Governance includes those practices that help organize, manage, and measure a
    software security initiative. Staff development is also a central governance practice.
    In the governance domain, the strategy and metrics practice encompasses planning,
    assigning roles and responsibilities, identifying software security goals, determining
    budgets, and identifying metrics and gates. The compliance and policy practices
    focus on:


    +   - Identifying controls for compliance requirements such as PCI-DSS and HIPAA.

    +   - Developing contractual controls such as service-level agreements (SLAs)
    to help control commercial off-the-shelf (COTS) software risk.

    +   - Setting organizational software security policy and auditing against that
    policy.

    +   - Training, because it fills a critical role in software security—software
    developers and architects often start out with very little security knowledge.


    # 9.4.2.2 Intelligence


    Intelligence includes those practices that result in collections of corporate
    knowledge used in carrying out software security activities throughout the organization.
    Collections include both proactive security guidance and organizational threat
    modeling.


    The intelligence domain is meant to create organization-wide resources. Those
    resources are divided into three practices:


    +   - Attack models capture information used to think like an attacker: threat
    modeling, abuse-case development and refinement, data classification, and technology-specific
    attack patterns.'
