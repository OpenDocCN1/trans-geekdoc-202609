- pgno: 73
  md: '+   1. How critical is the software to meeting the customers’ mission?

    +   2. What security objectives are required by the software (e.g., confidentiality,
    integrity, and availability [CIA], as described in Chapter 1)?

    +   3. What regulations and policies are applicable in determining what is to
    be protected?

    +   4. What threats are possible in the environment in which the software will
    be operating?


    During the initial kick-off meeting, all key stakeholders should discuss, identify,
    and have a common understanding of the security and privacy implications, considerations,
    and requirements. The initial set of key security milestones, including time frames
    or development triggers that signal a security step is approaching, is also outlined
    in these discussions to enable the developers to plan to build security requirements
    and associated constraints into the project. It also reminds project leaders that
    many decisions being made have security implications that should be weighed appropriately
    as the project continues. These discussions should also include the identification
    of all sources of security requirements, including relevant laws, regulations,
    and standards.


    Privacy, often neglected as part of the SDL in the past, is assessed at this phase
    as well. The Privacy Impact Assessment (PIA) process evaluates issues and privacy
    impact rating related to the privacy of personally identifiable information (PII)
    in the software and will be initiated during this stage of the development process.


    Software development life cycles (SDLCs) typically have formalized kick-off meetings,
    and it is important that the software security team is included to ensure that
    security is a key element of the SDLC and is built into the process. An in-person
    or live web conference meeting will give attendees and stakeholders an important
    opportunity to gauge understanding and awareness. Bringing the security team into
    the development process early is the most cost-effective way to enable risk identification,
    planning, and mitigation. Early identification and mitigation of security vulnerabilities
    and misconfigurations will result in a lower cost of security control implementation
    and vulnerability mitigation, provide awareness of potential engineering challenges
    caused by mandatory security controls, and identify shared security services and
    reuse of security strategies and tools to reduce development costs while improving
    security posture through proven methods and techniques. The early involvement
    of the security team will enable the developers to plan security requirements
    and associated constraints into the project. It also reminds project leaders that
    many decisions being made have security implications that should be weighed appropriately
    as the project continues. Early planning and awareness will result in cost and
    time saving through proper risk management planning. Security discussions should
    be performed as part of, not separate from, the development project to ensure
    solid understandings among project personnel of business decisions and their risk
    implications to the overall development project.¹


    # ## 3.2 Software Security Hosts a Discovery Meeting


    The discovery meeting is essentially an SDL kick-off meeting where the key SDLC
    stakeholders get on the same page at the beginning of the process so that security
    is built in rather than bolted on post-release. Security planning in the discovery
    meeting should include preparations for the entire system life cycle, including
    the identification of key security milestones and deliverables, as well as tools
    and technologies. Special consideration should be given to'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'items that may need to be procured, such as software security testing and assessment
    tools and the potential use of third-party software security architects or engineers,
    if staff augmentation is needed or the customer requires third-party attestation.
    Other resource impacts such as active testing, accreditation, and required training
    must be considered as well. A series of milestones or security meetings should
    be planned to discuss each of the security considerations throughout the system
    development. The outcomes of the discovery meeting are typically in terms of decisions
    that are made for future activities, which are followed later in the SDL by actual
    security or privacy activities. A project schedule should integrate security activities
    to ensure proper planning of any future decisions associated with schedules and
    resources. All meeting participants and stakeholders should walk away from this
    meeting with a common understanding of the security implications, considerations,
    and requirements for the software.


    The following four questions should be addressed in this phase to determine the
    security controls that will be required for the software being developed:


    +   1. How critical is the system to meeting the organization’s mission?

    +   2. What are the security objectives required by the software in terms of confidentiality,
    integrity, and availability (CIA)?

    +   3. What regulations and policies are applicable in determining what is to
    be protected?

    +   4. What threats are possible in the environment where the system will be operating?


    Key tasks during the discovery meeting include the following:


    +   * Develop an initial project outline for security milestones, which will be
    integrated into the development project schedule and will allow proper planning
    as changes occur.

    +   * Identify the sources for the security requirements, such as relevant laws,
    regulations, standards, and customer requirements.

    +   * Identify any required certification and/or accreditation requirements and
    the resources required for them.

    +   * Identify any third-party or open-source software that will be required.

    +   * Identify the common security controls that will be used for the software
    being developed, including those that will be needed if the software is to be
    used in a SaaS/cloud environment or as part of a larger solution using multiple
    software products.

    +   * Identify any API security requirements.

    +   * Identify and define the required security reporting metrics in both tactical
    and strategic (business) terms.

    +   * Develop an initial framework of key security milestones, including time
    frames or development triggers that will signal a security step is approaching.

    +   * Define the security responsibilities of the core software security team,
    the software security champions, developers, privacy team, and any other stakeholders
    required to support security during the SDL/SDLC process.

    +   * Identify and document the software security design, architecture, and security
    coding practices to be used.

    +   * Identify security testing and assessment techniques that will be used.

    +   * Lay out a pre-privacy impact assessment process, including the determination
    of information categorization and identification of known special handling requirements
    to'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'transmit, store, or create information, such as personally identifiable information,
    and preliminary identification of any privacy requirements.


    +   • When possible, project artifacts such as meeting minutes, briefings, and
    role identifications should be standardized and provided to developers for proper
    level-of-effort planning. This should be an ongoing process throughout the SDL.


    # 3.3 Software Security Team Creates an SDL Project Plan


    This can actually be considered initial project planning because the formal plan
    will be finalized as an outcome of the design phase, which will be covered in
    the next chapter. At this stage, the SDL project plan should outline security
    milestones based on the information gained during the discovery phase in 3.1 and
    integrate them into the overall SDLC schedule to allow proper planning as changes
    occur. As in the discovery phase, activities may be more in terms of decisions
    translated into milestones that will be followed by security activities. This
    project plan integrates the common understanding of security expectations identified
    in the discovery phase reflecting the initial schedule of security and privacy
    activities or decisions.


    # 3.4 Privacy Impact Assessment (PIA) Plan Initiated


    There are a number of methods available that can be used to ensure privacy protection
    and for management. In the past, however, privacy tools have generally been applied
    in an ad hoc way, or in a piecemeal fashion to address immediate issues. As with
    security, these issues are typically addressed post-release. Just as with security,
    treating privacy as a secondary consideration or as an issue for future exploration
    during system design does not provide an effective level of privacy protection.
    Addressing components of privacy issues and not through a holistic design and
    implementation leads to further potential privacy issues. Privacy must be a fundamental
    design consideration that is integrated into every phase of the SDLC.


    There are a growing number of privacy regulatory requirements on a variety of
    levels—state, federal, and international—resulting in a patchwork of compliance
    requirements that have serious penalties for noncompliance. The cloud adds to
    the complexity of boundaries and requirements. Rather than devote an entire chapter
    to recent and upcoming privacy requirements and the potential ramifications of
    each, we will discuss the best practices needed to adequately cover a majority
    of what you will face in terms of privacy, regulatory, and policy compliance.
    Software programs are designed to integrate with the user''s computer and, therefore,
    may be able to access and store personal information. Software developers must
    adhere to the guidelines and privacy policies that relate to the operating systems
    and platforms for which their software is designed. The bottom line is that when
    customers entrust your company with sensitive information, every employee is obligated
    to protect that information. As with security, privacy violations have significant
    implications for the trust customers have in you, which in turn will affect your
    company''s reputation and the potential revenue from the software you develop.


    Before you can begin developing a PIA, you will need to evaluate what regulatory
    legislation or policies are applicable to the software you are developing. In
    some models, this is called the data sensitivity assessment. Since most developers
    do not have a background in law, and regulators generally do not have a background
    in software development, understanding the'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'issues surrounding regulatory compliance can be difficult and frustrating.
    It is often very difficult for developers to understand fully the language and
    requirements described by legislation, and it is often not easy to pin down explicit
    software requirements. To successfully translate regulations into requirements,
    it will be necessary to engage with your corporate legal counsel and any external
    legal privacy experts who may be on retainer. If you happen to have a chief privacy
    officer (CPO), this person can be an ideal partner who can offer you the resources
    and training you will need to meet the challenge of building privacy into the
    SDL and ultimately the SDLC.


    Microsoft’s “Privacy Guidelines for Developing Software Products and Services”
    and NIST Special Publication 800-64 Revision 2: “Security Considerations in the
    System Development Life Cycle” are among the most popular references for developing
    a PIA in your SDL: You can use either in its entirety or as a template to develop
    your own. Unfortunately, Microsoft’s “Privacy Guidelines for Developing Software
    Products and Services” is no longer available; however, its content is still relevant
    and of value. The key elements that you need from that document are included in
    the remainder of this section and are also covered in Chapter 5. No matter what
    methodology you use, the following should be included in your PIA:


    +   - **Summary of the Legislation:** Explains the act from a developer’s point
    of view, telling you what you need to know in order to understand its implications
    on your application development.

    +   - **Required Process Steps:** Explains in more depth which requirements are
    relevant to software developers. Generally speaking, this section describes what
    types of data are considered sensitive and how they need to be protected.

    +   - **Technologies and Techniques:** Explains strategies and techniques for
    meeting the legislative requirements. These are separated into five main categories:
    Confidentiality, Integrity, Availability, Auditing and Logging, and Authentication.

    +   - **Additional Resources:** Provides links where you can gather more information
    on the legislation in question.


    The primary task of the PIA process is the determination of need in the system,
    along with an initial definition of the problem to be solved. The PIA created
    at this phase is only a preliminary version for initial system specifications
    and requirements and is designed to guide developers in assessing privacy through
    the early stages of development. For simplicity, we have included only the privacy
    design principles requirements analysis and part of the initial PIA analysis.
    At its core, this stage of the PIA is the planning, documentation, and assessment
    of preliminary requirements for PII and personal information used by the software
    and includes or accesses the following:


    +   - **Education of stakeholders.** All stakeholders should be educated on the
    “four C’s” of privacy design (comprehension, consciousness, control, and consent)
    at the Security Assessment (A1) discovery and kick-off meeting. The architects
    and developers should be asking whether they need to collect the data and have
    a valid business need to do so, and whether the customer will support the software’s
    business purpose for collecting their PII.

    +   - **Additional software interaction.** External system processes, other systems
    interacting with the new software and their use of PII, personal information,
    and system users.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   * **Collection of PII.** The purposes and requirements for the collection
    of PII.


    +   * **PII storage retention.** Proposed personal information retention periods
    and reasons for the lengths of those periods.


    +   * **Access.** Determine what entities will have access to the PII and personal
    information and the preliminary design for the separation of duty/tasks/roles/data
    in the software.


    +   * **Privacy management tools.** Identification of privacy management tools
    and system processes that may be needed to manage personal information in the
    software and the solution it may be part of. This is particularly important if
    the software is going to be a component of an SaaS- or cloud-based solution.


    +   * **Security safeguards.** The setting of requirements for security safeguards
    that will be used to protect the PII and personal information.


    +   * **Integrity of the data.** Determine that PII and personal information is
    kept up to date and accurate.


    +   * **Assess whether there are any conflicts between security and privacy requirements.**
    If so, they need to be addressed and resolved at this stage of the development
    process. This step includes the categorization of the level of privacy and security
    protection that the software will require.


    +   * **Apply the principle of least privilege.** Essentially, this entails limiting
    access to “need to know.” Access to user data should be limited to those who have
    a legitimate business purpose for accessing the data. In addition, nonusers, such
    as administrators or database managers, should only be given access to the smallest
    amount of user data needed to achieve the specific business purpose. This must
    include third parties that have access to the data or to which it is transferred:
    They should only be given the specific data they need to fulfill their business
    purpose. Data protection provisions, including retention and destruction requirements,
    are typically required of third parties through contract agreements.


    +   * **Websites and web services.** All externally facing websites must have
    a link to a privacy statement on every page. This includes pop-ups that collect
    PII. Whenever possible, the same privacy statement should be used for all sites
    within a domain.


    +   * **The use of cookies.** PII and identifiers that facilitate tracking may
    be stored in cookies as small files that are stored on a user’s computer. They
    are designed to hold a modest amount of data specific to a particular client and
    website and can be accessed either by the web server or the client computer. Privacy
    guidelines for cookie usage apply to locally stored text files that allow a server-side
    connection to store and retrieve information, including HTTP cookies (e.g., web
    cookies) and Flash cookies (e.g., Flash Shared Objects). Persistent cookies must
    not be used where a session cookie would satisfy the purpose. Persistent cookies
    should expire within the shortest time frame that achieves the business purpose.
    PII stored in a persistent cookie must be encrypted.


    +   * **IP addresses.** The customer’s IP address is always sent with the data
    as part of the communication protocol when it is transferred over the network.
    As of the date of this writing, there is still a lot of debate and discussion
    as to whether or not an IP address is PII. The fact that privacy regulators are
    even discussing this is a warning sign that we may need to consider the possibility
    that this information will fall into the category of PII in the foreseeable future.
    Storing an IP address with PII should be avoided if anonymity is required in order
    to avoid correlation between the two. If possible, the IP address should be stripped
    from the payload to reduce its sensitivity by limiting the number of digits. The
    IP address can also be discarded after translating it to a less-precise location.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   * **Customer privacy notification.** Software that collects user data and
    transfers it must provide and give notice to the customer. These are also called
    disclosure notices and must inform users of the type of information that software
    will collect and how it will be used. Depending on the type of software, an opt-out
    clause may be required to allow users the ability to withhold certain types of
    personal information if they so choose. The type of notice and consent required
    depends on the type of user data being collected and how it will be used. Customers
    must also be presented with a choice of whether they want to share this information
    or not. All notices must be written in clear, easy-to-read language. There are
    two types of notification—prominent and discoverable. A “Prominent Notice” is
    one that is designed to catch the customer’s attention and invites customers to
    inspect the current privacy settings, learn more about their options, and make
    choices. A “Discoverable Notice” is one the customer has to find. This can be
    done by selecting a privacy statement link from a help menu in a software product
    or by locating and reading a privacy statement on a website. This notification
    typically includes the type of data that will be stored, how it will be used,
    with whom it will be shared, how it is protected, available user controls (including
    the update process, if the PII is stored and reusable), and the company’s contact
    information. If you are developing a product to be used by another company or
    as an original equipment manufacturer (OEM), the customer company typically has
    specific privacy statements that third-party software developers are required
    to include. Other companies may require that software that is designed to work
    with their products contain a privacy statement that informs users that their
    information will not be sold to other companies or displayed publicly. Software
    developers must inform users of the software’s method of safeguarding users’ personal
    information in the privacy policy and notification. As we will discuss later in
    the book, this can be done via a valid SSL certificate, or by using other security
    and encryption methods. As with other privacy-related areas, regulatory and other
    requirements are dynamic, and you should consult your privacy expert or legal
    counsel for the latest guidance for your software.


    +   * **Children’s privacy.** Care must be taken to consider children’s privacy,
    since they may lack the discretion to determine when disclosing their PII may
    put them at risk. This has become particularly important with the advent of collaboration
    and sharing features found in social software. Parental controls are typically
    added to products, websites, and web services to help protect the privacy of children.
    Special efforts must be made to ensure that parents retain control over whether
    their children can reveal PII. There are numerous privacy requirements for those
    offering websites and web services that target children and/or collect the age
    of their customers. There are numerous existing and forthcoming state, local,
    and international requirements for this area. Make sure you consult your privacy
    expert and/or corporate counsel (or equivalent) if you have software that will
    fall into this area.


    +   * **Third parties.** Two types of third parties must be considered when assessing
    your privacy requirements. One type of third party is authorized to act on the
    company’s behalf and uses data in accordance with the company’s privacy practices.
    An independent third party follows its own privacy practices and uses customer
    information for its own purposes, which require a contract specifying data protection
    requirements. This requires a software provision for the customer to provide opt-in
    consent. The customer must provide opt-in consent before PII is shared with an
    independent third party. Only a'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Discoverable Notice is required if PII is transferred via a third party authorized
    to act on the company''s behalf.


    +   * **User controls.** User controls give users the ability to manage and control
    the privacy of their data and change their settings. These controls should be
    intuitive and easy to find. The data may reside on a computer, within a web service,
    or on a mobile device. A webpage is used as the privacy site for web services.
    Privacy controls for mobile devices can be on the device itself or via a computer-based
    user interface or a website that links to the device.


    +   * **Privacy controls required for software used on shared computers.** It
    is common for software used in home or small office/home office (SOHO) environments
    to be shared by multiple users. Software designed for use in these environments
    that also collects or stores PII must provide controls over which users have access
    to the data. These controls may include strict computer/file/document access control
    and file permissions or encryption. Controls must also be a default setting and
    not opt-in. Shared folders must be clearly marked or highlighted.


    +   * **Collaboration, sharing, and social software privacy features.** This is
    an area with very complex challenges in that content can be shared among a community
    and, in some cases, linked community members and shared friends or contacts. Software
    that supports these types of applications should provide controls and notifications
    to help prevent inadvertent sharing of PII with unintended audiences.


    +   * **Security.** Security, of course, is the topic of this book, and a critical
    element of both privacy and quality. The security requirements will depend on
    the type of user data collected and whether it will be stored locally, transferred,
    and/or stored remotely. The end goal for security controls and measures is to
    protect PII from loss, misuse, unauthorized access, disclosure, alteration, and
    destruction. The controls and measures include not only software controls such
    as access controls and encryption in transfer and storage but also physical security,
    disaster recovery, and auditing. Compensating controls may be needed when standard
    protection is not possible due to business needs, such as the use of PII as a
    unique identifier or an IP address or e-mail address used for routing.


    +   * **Privacy Impact Ratings.** The Privacy Impact Rating (P1, P2, or P3) is
    a practice used in the Microsoft SDL. It measures the sensitivity of the data
    your software will process from a privacy point of view. Early awareness of all
    the required steps for deploying a project with high privacy risk may help you
    decide whether the costs are worth the business value gained. General definitions
    of privacy impact are as follows:

    +     * **P1 High Privacy Risk.** The feature, product, or service stores or transfers
    PII or error reports, monitors the user with an ongoing transfer of anonymous
    data, changes settings or file type associations, or installs software.

    +     * **P2 Moderate Privacy Risk.** The sole behavior that affects privacy in
    the feature, product, or service is a one-time, user-initiated, anonymous data
    transfer (e.g., the user clicks a link and goes out to a website).

    +     * **P3 Low Privacy Risk.** No behaviors exist within the feature, product,
    or service that affect privacy. No anonymous or personal data is transferred,
    no PII is stored on the machine, no settings are changed on the user''s behalf,
    and no software is installed.


    The risk assessment questionnaire and risk ranking system developed by Microsoft
    can be a great tool in assessing the risk and prioritizing the work to remediate
    those risks in the SDL.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'In summary, the purpose of the PIA is to provide details on where and to what
    degree privacy information is collected, stored, or created within the software
    that you are developing. The PIA should continue to be reviewed and updated as
    major decisions occur or the proposed use of the software and scope change significantly.


    # 3.5 Security Assessment (A1) Key Success Factors and Metrics


    # 3.5.1 Key Success Factors


    Setting success criteria for any SDL phase will make it more effective and will
    help in performing postmortem to understand what worked and what didn’t. Table
    3.1 outlines success criteria suggested by the authors. However, each environment
    is different, and security teams are in the best position to understand success
    criteria within their own environment.


    # Table 3.1 Key Success Factors


    | Key Success Factor | Description |

    |---|---|

    | 1. Accuracy of planned SDL activities | All SDL activities are accurately identified.
    |

    | 2. Product risk profile | Management understands the true cost of developing
    the product. |

    | 3. Accuracy of threat profile | Mitigating steps and countermeasures are in
    place for the product to be successful in its environment. |

    | 4. Coverage of relevant regulations, certifications, and compliance frameworks
    | All applicable legal and compliance aspects are covered. |

    | 5. Coverage of security objectives needed for software | “Must have” security
    objectives are met. |


    # Success Factor 1: Accuracy of Planned SDL Activities


    The Security Assessment (A1) phase is the first phase of our SDL and, therefore,
    is mostly discovery in nature. It sets the tone and direction of future SDL activities.
    During this phase, a rough outline of needed SDL activities is decided, as well
    as what emphasis should be placed on each SDL activity (code review, threat modeling,
    etc.). Though one can always course correct identified SDL activities and their
    importance later, a key measure of success of this phase is how many revisions
    are made to initial requirements and the direction of the SDL. Though this is
    not measurable at the start, once the SDL cycle is complete, one should go back
    to the initial planning documents to identify its deviations and why those variances
    happened. It should help in estimating future SDL activities more accurately.


    # Success Factor 2: Product Risk Profile


    Another key success factor is a product risk profile. A baseline product risk
    profile can be prepared based on software, its importance to customers (including
    its use in their environment), data processed through the software, relevant regulations,
    and target market/countries. The'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'profile should include risk arising out of customer expectations and use of
    the product, regulatory compliance, and security changes needed to cater to different
    markets. This will also help articulate actual costs to management.


    # Success Factor 3: Accuracy of Threat Profile


    Too often, the software is developed without a complete understanding of its intended
    use or the environment in which it will operate. Though a product may be designed
    for specific uses, customers often add enhancements and use them in ways that
    were not intended. Another example is APIs exposed to the public. In most cases,
    the number of APIs exposed increases over time (often after the software is released).
    However, the threat profile from exposure APIs is not always considered or done
    correctly. In other cases, the software depends on open-source (or closed-source)
    software that was not considered in defining the threat profile for the product.
    Thus, one of the critical success factors to take away from this phase is the
    accuracy of the threat profile. The profile should cover perceived use cases,
    research on customer integrations, and security exposure through dependency on
    other products or software.


    # Success Factor 4: Coverage of Relevant Regulations, Certifications, and Compliance
    Frameworks


    One key criterion for the success of this phase is whether all key regulations,
    compliance frameworks, and certifications for the product (or libraries) have
    been identified. This success factor depends on understanding product objectives
    and customer uses. One may think that specific regulations will not be applicable
    because their use cases are not considered valid. Customers, however, often have
    a different take on this. A cloud product that a customer uses to interact with
    other customers might not need to comply with HIPAA from a viewpoint. However,
    for a customer, it is crucial that this product, if not compliant with HIPAA,
    at least does not create issues that may result in noncompliance.


    Compliance frameworks are another thing to watch out for. Depending on how the
    product is used (in-house or in the cloud), different permutations are expected
    by customers. If customers require ISO® 27001 certification and use your product
    in a cloud environment, they will expect a demonstrable and verifiable operational
    and product security posture. If customers are paying for your service using credit
    cards, not only they but your environment may fall under the regulations applicable
    to the payment card industry. Though we are focusing on product security here,
    operational security is equally important.


    Finally, while covering regulations, compliance frameworks, and certifications,
    security and development teams fail to look closely at dependencies. For example,
    if the product needs to comply with the Federal Information Processing Standards
    (FIPS), how will using an open-source library affect compliance? If the product
    needs to obtain certification A, will dependent software make or break this certification?
    These questions need to be carefully considered to prevent future firefighting.


    # Success Factor 5: Coverage of Security Objectives Needed for Software


    Finally, one should look at how many of the security objectives were met at the
    conclusion of this phase. If some objectives were not met, why not? One may start
    with a laundry list of'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'security objectives, but they often compete with other product features and
    product management may shoot them down. An example might be logging. If one of
    the critical security objectives is to detect and respond to threats as they happen,
    logging and real-time visibility is crucial to the effort. However, the feasibility
    of logging relevant events (securely) may compete with other product requirements
    (operational efficiency, features). One could insist on logging events securely
    by encrypting them and transporting them safely to a central repository. However,
    depending on resources and other competing demands, such logging efforts might
    not make it to the final list.


    Before closing out the phase, it is good to see whether any security objectives
    were not met in their entirety; if not, were these important to have, or were
    they just “nice to have.” This knowledge should help future product SDL cycles.
    Having too many “nice to haves” may undermine the credibility of the security
    team.


    # 3.5.2 Deliverables


    In each of our SDL phases, we will outline a key set of deliverables for that
    phase. The idea is to make sure that all required activities have a tangible documented
    outcome. Often, we see only verbal or nonofficial documents created and kept by
    a project management team. In our opinion, formal documentation should be created
    and kept in a central repository with appropriate sign-offs and versioning.


    Key deliverables for Phase A1 are listed in Table 3.2 and discussed below.


    # Table 3.2 Deliverables for Phase A1


    | Deliverable | Goal |

    | :--- | :--- |

    | Product risk profile | Estimate actual cost of the product. |

    | SDL project outline | Map SDL activities to the development schedule. |

    | Applicable laws and regulations | Obtain formal sign-off from stakeholders on
    applicable laws. |

    | Threat profile | Guide SDL activities to mitigate threats. |

    | Certification requirements | List requirements for product and operations certifications.
    |

    | List of third-party software | Identify dependence on third-party software.
    |

    | Metrics template | Establish cadence for regular reporting to executives. |


    +   - **Product risk profile.** The product risk profile helps management see
    the actual cost of the product from different perspectives, including selling
    it in different markets and liabilities that might be incurred if it is a SaaS/cloud
    product.

    +   - **SDL project outline (for security milestones and mapping to development
    schedule).** An essential outcome of this phase is an SDL project outline or plan.
    The SDL plan should include security milestones that will be met during each phase
    and mapped to the development plan/schedule. Reporting should be set up to keep
    track of progress on the project.

    +   - **Applicable laws and regulations.** This deliverable is a comprehensive
    review of laws and regulations that may be applicable to the product. The legal
    department should be heavily involved in preparing this documentation and, for
    laws/regulations that are not applicable, clearly articulate our understanding
    as to why those were not applicable.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   - **Threat profile.** This deliverable articulates our assumptions about
    the environment in which the product will operate and potential threats in that
    environment. This will be helpful in later stages to focus our SDL activities
    to ensure the product is as secure as possible under the threat profile developed
    by the team. It will also be useful for post-mortem in case we missed a threat/scenario
    in the SDL phases.

    +   - **Certification requirements.** This deliverable should clearly articulate
    certifications needed for the product (e.g., FIPS) and resulting requirements.
    In the case of SaaS/cloud software, it should identify operational controls that
    will be needed for the software to be certified by various frameworks.

    +   - **List of third-party software.** The purpose of this list is to identify
    all third-party components to be used with our software and thereby incorporate
    them in our threat profile. It should also help us to finalize the list of changes/requirements
    required for certifications.

    +   - **Metrics template.** This deliverable is a template on metrics that we
    plan to report to management on a periodic basis.


    # 3.5.3 Metrics


    In the SDL model we propose, we outline metrics that should be measured in each
    and every phase. First, however, we would like to point out a few things we have
    learned in our professional careers.


    We should decide what to measure upfront and stick to those decisions as much
    as possible. Although we understand we may have to modify metrics as we go along,
    we should resist the temptation to overhaul metrics frequently. The metrics template
    should be put together with its audience in mind. However, there is a tendency
    among executives to ask for a slightly different set of metrics as the project
    moves along. We should educate and make executives aware of why the metrics were
    chosen and their importance to the SDL process. Often, that should take care of
    conflicting suggestions on metrics. In a nutshell, identify a set of appropriate
    metrics for your audience and stick to it. In the long term, metrics will guide
    your overall progress so that whatever set of metrics you choose consistently,
    it will serve you well.


    Here are our suggestions for metrics for this phase:


    +   - Time in weeks when the software security team was looped in

    +   - Percent of stakeholders participating in the SDL activities

    +   - Percent of SDL activities mapped to development activities

    +   - Percent of security objectives met


    # 3.6 Summary


    We have described the importance of and best practices for addressing security
    and privacy at the very beginning of the SDLC process. By now, it should be clear
    that security and privacy are fundamental aspects of quality required to have
    a secure software development process and that the optimal time to define the
    requirements for these two areas is during the initial planning stage described
    in this chapter. Defining and establishing these requirements allows the'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'team to identify key milestones and deliverables for the integration of security
    and privacy into the software in a manner that will minimize disruption to plans
    and schedules. Identification of the key stakeholders and security roles for the
    SDL/SDLC, assessment and specification of minimum security and privacy requirements
    for the software to run in its planned operational environment, the overall SDL
    plan, and an agreed-upon security vulnerability identification/ remediation work
    item tracking system are the key elements of the Security Assessment (A1) phase
    described in this chapter. It should be clear that both security and privacy risk
    assessments are mandatory components of an SDL. These are key elements in defining
    functional aspects of the software that will require a deeper review later in
    the development process.


    Toward the end of the chapter, we discussed key success factors and their importance,
    deliverables from this phase, and metrics that should be collected from this phase.


    The best practices discussed in this chapter will serve as the groundwork and
    baseline for the future phases of our SDL model. The next phase, Architecture
    (A2), will be discussed in Chapter 4.


    # Chapter Quick-Check


    +   1. The purpose for the discovery meeting with stakeholders early in the development
