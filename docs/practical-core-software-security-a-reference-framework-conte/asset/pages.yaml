  md: '# 8.1 Right-Sizing Your Software Security Group


    First, we will walk through each of the software security group relationships
    and the importance of putting everything into perspective in order to “right-size”
    the building of a successful software security program. Doing this means having


    +   - The right organizational location

    +   - The right people

    +   - The right process


    # 8.1.1 The Right Organizational Location


    Although there have been great advances in software security technology over the
    last few years, we believe that people are still the most important element of
    a successful software security program that includes the implementation and management
    of the activities and best practices. To facilitate the best use of the people
    responsible for software security, they must be part of the right organization
    (see Figure 8.2). Having been in seven Chief Security Officer (CSO)


    ![](img/a54ed04827050a271316d34985425127_197_0.png)


    Figure 8.2 The right organizational location.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'and Chief Information Security Officer (CISO) roles, James Ransome, one of
    the co-authors of this book, has had software security reporting to him in several
    of his roles. Based on both his experience and communication with his peers in
    the industry, it is clear that the software security function ideally should fall
    within the engineering (software development) function and, in particular, within
    the quality function. The general consensus is that the application security role
    typically reports to the centralized information security role CSO/CISO position
    and should not be confused with the software security function. Typically, those
    who are in an application security role within an IT security organization are
    great at running tools but do not have the software development background necessary
    to fully interpret the results. To make this point clear, it is important to differentiate
    between software and application security. Perhaps the best way to clarify this
    distinction is with a quote from Gary McGraw:


    > Software security is about building secure software: designing software to be
    secure; making sure making sure that software is secure; and educating software
    developers, architects, and users about how to build security in. On the other
    hand, application security is about protecting software and the systems that software
    runs in a post facto way, only after development is complete.1


    Another advantage of having the software security experts reporting to the engineering
    organization is that they are empowered by the fact that they are part of the
    same organization; are directly responsible for implementing the SDL policies
    and procedures and associated tools; and understand software development, its
    architecture, and the level of effort required to fix the same. Earlier in this
    book, we described the importance of software security as an element of quality
    and organization, and the same relationship should exist within the engineering
    organization.


    The authors believe that software security should be a group of its own within
    engineering/software development and should work very closely with the central
    security group; it may even have a “dotted-line” relationship to the CSO/CISO.


    A few reasons for our preference for the software security group to report to
    the software quality group include the following:


    +   1. Security vulnerabilities are, by definition, quality issues.

    +   2. Security features are architectural functions with a very close relationship
    to product management.

    +   3. Based on (1) and (2) above, security is both a feature and a quality function.

    +   4. Quality is best served when it is integral to the development process (engineering)
    and includes security.


    # 8.1.2 The Right People


    In Chapter 2, we discussed the talent required to make the SDL model we describe
    in this book a success. This will include a minimum of one principal software
    security architect, a mix of senior and general software security architects,
    and, ideally, one software security architect in the software product security
    group per software product security group in the organization. This relationship
    is represented in Figure 8.3. This talent pool provides the ability to scale'
  merge: -1
  img_proc: true
