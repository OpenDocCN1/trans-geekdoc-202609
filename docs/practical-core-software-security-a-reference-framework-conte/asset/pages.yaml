    # 7.4 Open-Source Licensing Review


    Although open-source software is free and it increases innovation, efficiency,
    and competitiveness for software product development, it must also be managed
    as an asset, the license obligations observed, and it must be as secure as internally
    developed software standards and requirements require. These sometimes unique
    and complex license and business risks can delay, and potentially prevent, software
    deployment or shipment if not properly managed. It is essential to be in compliance
    with applicable open-source requirements to avoid costly and time-consuming litigation.
    The two primary areas that need to be of concern for those managing an SDL in
    which open-source software is used as part of the product or solution are license
    compliance and security.


    +   1. Open-source software license compliance. Noncompliance with open-source
    software licensing requirements can result in costly and time-consuming litigation,
    court time, copyright infringement, public press exposure, bad publicity, and
    negative risk to the noncompliant organization’s reputation and business relationships.
    Mismanagement and noncompliance with open-source licenses may also result in the
    difficulty or inability to provide software product support, the delay of current
    release and ship dates, or the stop-page of orders currently scheduled to ship.


    +   2. Open-source software security. SDL and development teams, as well as their
    executive sponsors, need to be aware of and understand vulnerabilities associated
    with open-source software code to be used in their own software product. As with
    the software being developed in-house, all vulnerabilities known to the open-source
    and software security community must be identified, assessed, and mitigated throughout
    the SDL process and include the same threat modeling, architectural security and
    privacy review, and risk assessment rigor and as the code being developed in-house.


    To put this into perspective, a few examples of the consequences of not properly
    managing open-source software license or security are given below.'
