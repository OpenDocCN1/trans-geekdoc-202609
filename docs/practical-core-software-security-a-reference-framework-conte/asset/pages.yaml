- pgno: 209
  md: 'architectural change to the code post-release. Any new code must also be vetted
    through the various types of security testing outlined in earlier chapters.


    # 8.6 PRSA5: Security Architectural Reviews and Tool-Based Assessments of Current,
    Legacy, and M&A Products and Solutions


    # 8.6.1 Legacy Code


    Although they may have once been viewed as an unnecessary cost burden, the best
    activities and best practices we have outlined in our SDL are a consequence of
    the discovery that security was not always a key element of the software development
    process and sometimes led to security vulnerabilities and risk mitigation costs
    that rivaled the initial cost of the software to be developed. The acceptance
    of legacy code is based on an assumption of what is expected to happen, in that
    the software must be proven to be functionally correct and operationally viable.
    However, when it comes to software security, the unexpected is what typically
    causes the vulnerabilities. Not only are these security vulnerabilities financially
    unacceptable, they are also unacceptable from an operational, functional, and
    overall risk perspective. This is particularly true when the software supports
    embedded critical systems and applications such as those found in national and
    regional infrastructures, transportation, defense, medicine, and finance. In these
    applications, the liabilities, costs, mission, and business impacts associated
    with unexpected security software and system vulnerabilities are considered unacceptable.
    Unless the architecture of legacy software is correctly assessed and analyzed
    from a security perspective, the impact of changes cannot be predicted, nor can
    changes be applied effectively. This is why the same testing and review rigor
    that is followed during the SDL must be followed during legacy code reviews: as
    a means of mitigating the unexpected. If done with the proper process and rigor,
    this will go far in ensuring secure code implementation that is consistent between
    legacy and new code.


    A legacy software application is one that continues to be used because of the
    cost of replacing or redesigning it and often despite its poor competitiveness
    and compatibility with newer equivalents. The most significant issue in this regard
    is that the organization has likely been depending on this legacy software application
    for some time, and it predates software development management security activities
    such as those described in our SDL and the mandates that currently drive these
    practices. Further, a considerable amount of money and resources may be required
    to eliminate this security “technical debt.” Technical debt is the difference
    between what was delivered and what should have been delivered. The importance
    of working with legacy code and technical debt is critical for most companies
    that develop software.13


    Legacy code with technical debt can also exist because even though the product
    should have been put in “end-of-life” status, one or more customers do not or
    cannot upgrade to a newer version of the software, and that customer happens to
    be a critical customer who considers this product essential to its business. This
    “critical customer” status often leads to legacy code and products staying in
    service so that the relationship with the customer(s) still using the product
    is not jeopardized.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'It is not always necessary to pay your technical debt, as it is your financial
    debt. There may be parts of the code that should be fixed, but the software product
    still works as advertised; optimizing the code and removing known technical debt
    may not yield a worthwhile ROI. You may also decide to just take the code out
    of the program because it no longer serves a purpose. In cases like these, you
    may never need to pay off that technical debt.


    Most important to this discussion is that the technical debt in legacy software
    may contain security vulnerabilities. Over the course of a project, it is tempting
    for an organization to become lax regarding software quality and security. Most
    commonly, this results when teams are expected to complete too much functionality
    in a given time frame, or quality and security are simply not considered high-priority
    characteristics for the software.14 In these situations, there may be security
    vulnerabilities in the legacy code that exist as a result of the technical debt.
    From a software product security perspective, the key task when looking at legacy
    code is to balance the ROI of addressing the security technical debt against the
    risk of leaving it in. Two primary decisions must be considered:


    +   1. How much new code presumably scrubbed by the SDL are you writing to replace
    the existing old code? At what rate will the volume of old code be replaced, and
    what security risk is there for whatever remains?


    +   2. Reviewing old code is a slow and tedious process. Serious ROI decisions
    must be made. You must reserve resources for this work to reduce the technical
    security debt for current resources. The level of effort for this work will depend
    on whether the SDL existed at the time the code was developed. If there was no
    SDL at the time the legacy code was being developed, the level of effort will
    be high.


    This is the basic process for assessing the security of legacy software applications:


    +   • Assess the business criticality of the application. The software application
    has likely been successfully relied on for years, and this may be the first time
    it has been looked at from a security perspective. In fact, it is highly probable
    that this is the first time it has been examined with this level of scrutiny.
    If any security vulnerabilities or flaws are discovered, even though there may
    be only one or two, they will likely require a large-scale effort and significant
    resources to mitigate. It is important to identify business criticality in order
    to balance the business risk versus the security risk and ROI in these cases.


    +   • Identify someone who is very familiar with the code. Since the legacy code
    is “old” code, it most likely has not been updated recently, and there may be
    few if any people in the organization who understand the software anymore. Further,
    it may have been developed on top of an old language base and/or poorly documented
    or commented. If this is the case, then the next step will be to conduct a software
    security assessment very similar to what is done during the SDL process. If the
    original developers, documentation, and history exist for the legacy software,
    and some security was built into the software, then the security assessment process
    can be shortened to focus just on assessing the gaps in current knowledge.


    +   • Other basic questions should also be asked, such as:

    +     o Has this application previously been exploited because of a known security
    vulnerability or flaw?'
  merge: -1
  img_proc: true
