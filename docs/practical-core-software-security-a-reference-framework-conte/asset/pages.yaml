  md: "4. **Release and ship.** The product security review is completed after all\
    \ SDL requirements, such as fuzzing, vulnerability scans, secure coding policies\
    \ review, and other current security practices, as well as any exceptions to quality\
    \ gates or vulnerabilities, have been formally reviewed and approved. Functional\
    \ regression will have typically taken place during the final security review\
    \ as well. Regression testing is used to discover new software vulnerabilities\
    \ or regressions from what was already discovered, hence the term regression.\
    \ These regressions can be a result of changes in the existing functional and\
    \ nonfunctional areas of the software or the system after changes have been made.\
    \ In short, regression testing assesses whether a change in one part of the software\
    \ has resulted in a change in other parts of the software or system it interacts\
    \ with.\n\n# 7.6 Final Privacy Review\n\nTypically, privacy requirements must\
    \ be satisfied before the software can be released. Although the final security\
    \ review must be completed before release, security exceptions as discussed previously\
    \ highlight that not all security issues have to be satisfied before release.\
    \ Privacy requirement verification is typically verified concurrently with the\
    \ final security review and, in many cases, is now considered part of the same\
    \ process. This requires that significant changes that occurred after the completion\
    \ of the general privacy questionnaire, such as collecting different data types,\
    \ substantively changing the language of a notice or the style of consent, or\
    \ identification of new software behavior that negatively affects the protection\
    \ of privacy, are addressed. This entails reviewing the software for any relevant\
    \ changes or open issues that were identified during previous privacy reviews\
    \ or as part of the final security review. Specific privacy requirements for the\
