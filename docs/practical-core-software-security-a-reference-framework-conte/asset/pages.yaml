  md: '+   - **Code listening on a globally accessible network interface:** Code that
    listens by default on a network, especially uncontrolled networks such as the
    Internet, is open to substantial risk and must be reviewed in depth for security
    vulnerabilities.

    +   - **Code written in C/C++/assembly language:** Because these languages have
    direct access to memory, buffer manipulation vulnerabilities within the code can
    lead to buffer overflows, which often lead to malicious code execution. Code written
    in these languages should be analyzed in depth for buffer overflow vulnerabilities.

    +   - **Code with a history of vulnerabilities:** Code that has shown a number
    of security vulnerabilities in the past should be suspect, unless it can be demonstrated
    that those vulnerabilities have been effectively removed.

    +   - **Code that handles sensitive data:** Code that handles sensitive data should
    be analyzed to ensure that weaknesses in the code do not disclose such data to
    untrusted users.

    +   - **Complex code:** Complex code has a higher bug probability, is more difficult
    to understand, and may be likely to have more security vulnerabilities.

    +   - **Code that changes frequently:** Frequently changing code often results
    in new bugs being introduced. Not all of these bugs will be security vulnerabilities,
    but compared with a stable set of code that is updated only infrequently, code
    that is less stable will probably have more vulnerabilities.


