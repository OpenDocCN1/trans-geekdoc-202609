  md: '# # Chapter 6


    # # Design and Development (A4): SDL Activities and Best Practices


    # ## CHAPTER OVERVIEW


    In this chapter, we will describe the activities for the design and development
    (A4) phase of our security development lifecycle (SDL). This phase can be mapped
    to the “readiness” phase in a typical software development life cycle (SDLC).


    # ## CHAPTER TAKE-AWAYS


    +   - Explore the practices that compose the design and development (Phase A4)
    of the security development lifecycle (SDL).

    +   - Document the key success factors for completion of Phase A4.

    +   - Create initial, draft deliverables for Phase A4 for the case study in Appendix
    A.

    +   - Prepare security testing reports for the case study in Appendix A.


    Figure 6.1 illustrates the steps and activities found in Phase A4 of the SDL.


    In Phase A4, we start with the continuation of policy compliance analysis for
    this phase and then move on to describe the elements of security test case execution.
    Building on the proper process for security testing that should have already been
    created, documented, and tested, the analysis will continue until necessary tuning
    is identified in order to accomplish the required security level. We then describe
    the use of automated tools, such as static, dynamic, and fuzz test tools, to help
    automate and enforce security practices efficiently and effectively at a low cost.
    Static analysis analyzes the source code prior to compiling, provides a scalable
    method of security code review, and helps ensure that secure coding policies are
    being followed. Dynamic analysis monitors application behavior and ensures that
    the software functionality works as'
