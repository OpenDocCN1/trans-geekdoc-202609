  md: 'is an SDL activity and best practices model that the authors have developed
    and mapped to the typical SDLC phases. Each SDL activity and best practice is
    based on real-world experience and examples from the authors to showing the reader
    that security can be built into each of the SDLC phases—a mapping of security
    to the SDLC, if you will. If security is built into each SDLC phase, then the
    software has a higher probability of being secure by default, and later software
    changes are less likely to compromise overall security. Another benefit of this
    mapping is that you will have presumably worked with the owner(s) and stakeholders
    of the SDL, which will serve to build buy-in, efficiency, and achievable security
    in both the operational and business processes of the SDLC and will include the
    developers, product and program managers, business managers, and executives.


    Subsequent chapters will describe each phase of the SDL presented in Figure 2.4
    in detail. In addition, each phase is broken down individually in Figures 2.5
    to 2.10.


    Please note that, unlike some of the SDLs you may have seen before, we include
    post-release support activities and best practices in our SDL, as shown in Figure
    2.10. We have included this because most software security teams or their equivalent,
    especially those in mid-sized or small companies, do not have the luxury of having
    an independent Product Security Incident Response Team (PSIRT)—a team dedicated
    solely to conduct security M&A assessments, third-party reviews, post-release
    certifications, internal reviews for new product combinations of cloud deployments,
    or review for legacy software that is still in use or about to be re-used. It
    takes some outside-the-box thinking to manage all of this with a small team. Later
    in the book, we will discuss leveraging seasoned software security architects,
    software security champions, specialized software, and third-party contractors
    to accomplish SDL goals and activities.


    # 2.10 Software Development Methodologies


    Earlier in the chapter we discussed the various SDLC models and provided a visual
    overview of our mapping of our SDL model to a generic SDLC. It should be noted,
    however, that multiple software development methodologies are used within the
    various SDLC models. Every software development methodology approach acts as a
    basis for applying specific frameworks to develop and maintain software and is
    less concerned with the technical side but rather the organizational aspects of
    the process of creating software. Principal among these development methodologies
    are the Waterfall model and Agile together with its many variants and spin-offs.
    The Waterfall model is the oldest and most well-known software development methodology.
    The distinctive feature of the Waterfall model is its sequential step-by-step
    process from requirements. Agile methodologies are gaining popularity in the industry,
    although they comprise a mix of traditional and new software development practices.
    You may see Agile or traditional Waterfall or maybe a hybrid of the two. We have
    chosen to give a high-level description of the Waterfall and Agile development
    models and a variant or two of each as an introduction to software development
    methodologies. In this book, we are providing a detailed framework in a Waterfall-type
    format, with associated lists that you can pick and choose from to meet the needs
    of your environment for full or partial upgrade software-development needs. In
    Chapter 9, we will show you how you can “build your own” SDL, building security
    into a process that is appropriate for your specific needs and environment, whether
    it be Agile, DevOps, Cloud, or a combination of two or more of these.'
