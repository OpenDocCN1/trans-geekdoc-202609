  md: '(Proprietary & Open Source) and Custom Software,” in the Carnegie Mellon “US
    CERT Software Supply Chain Risk Management & Due-Diligence, Software Assurance
    Pocket Guide Series: Acquisition & Software, Volume 1.2,15” which can be accessed
    at https://osgug.ucaiug.org/utilisec/Shared%20Documents/Security%20Procurement%20Guidelines%20and%20Language/DHS%20-%20Building%20Security%20In%20-%20Software%20Supply%20Chain%20Risk%20Management%20and%20Due-Diligence.pdf.
    Another similar and useful resource is the Carnegie Mellon Software Engineering
    Institute Working Paper, “Adapting the SQUARE Method for Security Requirements
    Engineering to Acquisition,”16 which can be accessed at www.cert.org/.../SQUARE_for_Acquisition_Working_Paper_v2.pdf.
    SQUARE stands for Systems Quality Requirements Engineering and defined in ISO/IEC
    25010:2011 (https://www.iso.org/standard/35733.html). This particular paper describes
    the SQuARE for acquisition (A-SQuARE) process for security requirements engineering
    and is adapted for different acquisition situations.


    Some key items that a software security assessor should keep in mind during an
    M&A software security review include the following:


    +   1. The intent of the M&A software security review is not to focus on getting
    rid of elements of the target software but rather to assess any business risk
    that could result from any security risks identified.

    +   2. Highlight anything that may shift the nature of the deal or negatively
    affect the integration.

    +   3. Look for anything that may be a possible deal breaker.


    # 8.7 Key Success Factors


    # External Vulnerability Disclosure Response Process


    In this post-release phase of the SDL cycle, it is critical to have a well-defined
    and documented external vulnerability disclosure response process. Stakeholders
    should be clearly identified, and a responsibility assignment or responsibility
    assignment matrix (Responsible, Accountable, Consulted, and Informed [RACI] matrix)
    should be created. Most important, only one team should be responsible for interfacing
    with customers to discuss vulnerabilities and remediation. All other teams and
    stakeholders should work with that team and assure that there are no other channels
    of communication or any information leaked selectively to customers. It is often
    the case that large accounts or enterprise customers are given preferential treatment
    and are privy to information that small- and medium-sized businesses are not.
    This is not a good security practice. Vulnerability information should be disclosed
    to everyone or no one. Selective disclosure is not a good idea, plays favorites
    with customers, and, in some cases, may be illegal and counter what constitutes
    fair and equitable treatment of all customers.


    It is also important to define and formalize the internal vulnerability-handling
    process as part of overall vulnerability management and remediation programs.
    In addition to security teams and external researches, employees or internal customers
    of the products/services will often identify security problems and communicate
    them to the product or operations team. There needs to be a well-defined process
    to make sure all relevant security vulnerabilities are captured and put through
    the remediation queue.'
