- pgno: 98
  md: 'The DFD process requires not only that you think like an attacker but possibly
    like multiple attackers, particularly if your software product is going to be
    operating in the cloud or an SaaS environment. Once the DFD is completed, you
    should have an accurate overview of how data is processed by the software, including
    how it moves and what happens to it within the application and others that may
    be associated with it. The high levels of the DFD clarify the scope of the application,
    and the lower levels clarify processes involved when specific data is being processed.


    # 4.3.3 Architectural Threat Analysis and Ranking of Threats


    # 4.3.3.1 Threat Determination


    The first step in determining threats is to adopt a methodology by which you can
    categorize them. This provides the ability to systematically identify sets of
    threat categories within the software application in a structured and repeatable
    manner. STRIDE is a method of threat categorization that was popularized by Microsoft
    a number of years ago and will be used in this chapter as an example of a threat
    determination tool, but it is certainly not the only methodology that can be used.
    Each letter in the acronym STRIDE helps classify attacker goals:


    +   * Spoofing

    +   * Tampering

    +   * Repudiation

    +   * Information disclosure

    +   * Denial of service

    +   * Elevation of privilege⁷


    The first step in STRIDE is to decompose your system into relevant components,
    then analyze each component for susceptibility to the threats, and, finally, mitigate
    the threats. The process is then repeated until you are comfortable with any remaining
    threats. The system is then considered secure, since you have now broken your
    software application and system down into individual components and mitigated
    the threats to each. Of course, this methodology has its flaws in that the individual
    components of the software and system can be part of a larger system, and you
    are only as secure as your weakest link. Individual components of a software product
    and system may not be susceptible to a threat in isolation, but they may be, once
    they are part of a larger system. This is particularly true for software products
    that were not designed to be used on the Internet, in the cloud, or in an SaaS
    environment.


    General threats and the security controls they may affect within each of the STRIDE
    categories include the following:


    +   * Spoofing: A threat action that is designed to illegally access and use another
    user’s credentials, such as username and password—*Authentication*

    +   * Tampering: Threat action aimed to maliciously change/modify persistent data,
    such as persistent data in a database, and the alteration of data in transit between
    two computers over an open network, such as the Internet—*Integrity*

    +   * Repudiation: Threat action aimed to perform illegal operations in a system
    that lacks the ability to trace the prohibited operations—*Nonrepudiation*'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   - Information disclosure: Threat action to read a file that one was not
    granted access to, or to read data in transit—Confidentiality

    +   - Denial of service: Threat aimed to deny access to valid users, such as by
    making a web server temporarily unavailable—Availability

    +   - Elevation of privilege: Threat aimed to gain privileged access to resources
    for gaining unauthorized access to information or to compromise a system—Authorization⁸


    # ## 4.3.3.2 Threat Analysis


    After you have completed the DFD, you should identify the design and implementation
    approaches for input validation, authentication, authorization, configuration
    management, and the other areas where applications are most susceptible to vulnerabilities,
    creating what is called a security profile.


    A practical example of the kind of questions that are typically asked in analyzing
    each aspect of the design and implementation of your software application is the
    following.’ We divide these into broad categories of input validation, authentication,
    authorization, configuration management, sensitive data, session management, cryptography,
    exception management, parameter manipulation, and audit and logging.


    # ## Input Validation


    The rationale behind this is that all user input should be considered untrusted
    and should be validated before being used in software. Below are relevant questions
    to ask for input validation:


    +   1. Is all input data validated?

    +   2. Could an attacker inject commands or malicious data into the application?

    +   3. Is data validated as it is passed between separate trust boundaries (by
    the recipient entry point)?

    +   4. Can data in the database be trusted?

    +   5. Would you prefer whitelisting or blacklisting of user input?


    # ## Authentication


    All user (and software/API) interactions with the overall system should be thought
    through and validated through authentication. None of the services and functionality
    should be available without validating if the user/system/API/component is legitimate.
    Whether it can use the functionality takes us into authorization. Typical questions
    to ask for authentication are as follows:


    +   1. Are credentials secured if they are passed over the network?

    +   2. Are strong account policies used?

    +   3. Are strong passwords enforced?

    +   4. Are you using certificates? Are there any wild card certificates in use?

    +   5. Are password verifiers (using one-way hashes) used for user passwords?

    +   6. How do system components authenticate to each other (e.g., how does a service
    authenticate to a database)?'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   7. During the boot process for the service/application, how do system components
    authenticate to each other?

    +   8. Are keys used for authentication instead of passwords?


    # Authorization


    Many times, we would like to restrict users/systems/API/components from accessing
    certain functionality in a software system. Authorization enables us to do just
    that—that is, prevent certain operations to certain agents. Questions typically
    related to authorization are as follows:


    +   1. What gatekeepers are used at the entry points of the application?

    +   2. How is authorization enforced at the database?

    +   3. Is a defense-in-depth strategy used?

    +   4. Do you fail securely and only allow access upon successful confirmation
    of credentials?


    # Configuration Management


    Configuration management enables us to harden software, systems, services, and
    devices and lock them down, thus reducing risk to the environment. Components
    of configuration management include hardening standards and guidelines, reviewing
    application dependencies on services, looking at user and administrator interfaces,
    security change management, and so on. Questions are along the following lines:


    +   1. What administration interfaces does the application support?

    +   2. How are they secured?

    +   3. How is remote administration secured?

    +   4. What configuration stores are used and how are they secured?

    +   5. Have hardening standards been developed for the software stack (OS, DB,
    application)?

    +   6. Does the software system provide a way to detect variances from approved
    security configuration changes?

    +   7. Do all groups (IT, QA, Engineering, Operations) only use approved (golden
    master or hardened) software images for different components such as OS, DB, web,
    and application servers?

    +   8. Are approved images used across the entire life cycle, from development
    to deployment?


    # Sensitive Data


    This aspect deals with awareness around the type of data handled by the application
    and systems. In many cases, we have found that developers and operations teams
    are not aware or educated enough on the types of data their application will handle
    (either by design or mistake) and if the protection is enough for the data elements.


    +   1. What sensitive data is handled by the application?

    +   2. What regulatory/compliance requirements are applicable to data/data elements?

    +   3. How is it secured over the network and in persistent stores? Is this good
    enough, given legal/regulatory requirements?'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   4. What type of encryption is used and how are encryption keys secured?

    +   5. Are sensitive data elements present in logs, source code, or configuration
    (e.g., XML) files?


    # Session Management


    Securely establishing and mainlining the integrity of session is one of the key
    components of today’s applications—specifically, web applications. Once the user
    is authenticated, a session is established. This can result in multiple scenarios
    wherein a session can be abused. Session management focuses on preventing such
    abuses. Questions asked for this aspect are typically along the following lines:


    +   1. How are session cookies generated?

    +   2. How are they secured to prevent session hijacking?

    +   3. How is persistent session state secured?

    +   4. Where is session information stored? On the server or the client side?

    +   5. How is session state secured as it crosses the network?

    +   6. How does the application authenticate with the session store?

    +   7. Are credentials passed over the wire, and are they maintained by the application?
    If so, how are they secured?

    +   8. How are multiple sessions from a user/component handled?


    # Cryptography


    Everyone uses cryptography. Cryptography tends to provide a sense of security
    for most developers and users. However, proper use of cryptography is not that
    common in our experience. Using cryptography to solve the wrong problem can often
    cause frustration and even exposure. When dealing with cryptography, it is best
    to stick with well-tested, publicly available algorithms and libraries. Questions
    on cryptography can include the following:


    +   1. What is the problem cryptography is going to solve (confidentiality, integrity,
    or both)?

    +   2. What algorithms and cryptographic techniques are used?

    +   3. Are there any proprietary or in-house algorithms used?

    +   4. How long are encryption keys and how are they secured?

    +   5. Does the application put its own encryption into action?

    +   6. How often are keys recycled? Are certificates checked for their validity?
    Are certificates checked against revocation lists?


    # Parameter Manipulation


    Application often passes parameters to communicate with the other side. Parameters
    range from (not so important) iterators, variable names, and values to session
    tokens. Man-in-the-middle (MITM) attacks and deliberate parameter tampering makes
    it important for us to devise a mechanism to detect if parameters received are
    indeed safe and can be used as designed. Imperative here is on the receiver side—like
    input validation, do not blindly trust parameters.


    +   1. Does the application detect tampered parameters?

    +   2. Does the application rely on only client-side validation, or is there server-side
    validation as well?'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   3. Does it validate all parameters in form fields, view state, cookie data,
    and HTTP headers?

    +   4. Are parameters directly used in database queries?

    +   5. Are parameters directly reflected back to the browser?


    # Exception Management


    Gracefully handling error conditions and exceptions is critical to software applications.
    Often, developers miss such conditions or handle them incorrectly. Side effects
    from improper error handling/exception management range from denial of service
    or information leakage. Sample questions to probe this aspect are as follows:


    +   1. How does the application handle error conditions?

    +   2. Is there a default catch for exceptions?

    +   3. Are exceptions ever allowed to propagate back to the client?

    +   4. Are generic error messages used that do not contain exploitable information?

    +   5. Do exceptions log any sensitive information to logs?

    +   6. Are built-in capabilities from programming languages used for this purpose,
    or do developers rely on in-house modules?


    # Auditing and Logging


    Audit and logging are critical for security, operations, debugging, compliance,
    and legal reasons. Operations and debugging are often the drivers for audit/logging
    though security requirements are considered integral today. Below are sample questions
    that can be asked to understand audit and logging.


    +   1. Does your application audit activity across all tiers on all servers?

    +   2. How are log files secured?

    +   3. Does the application log any sensitive information (e.g., credentials,
    data elements, session tokens)?

    +   4. Are log files transported securely (e.g., TCP/TLS)?

    +   5. Is the retention period clearly defined for log files? Does it align with
    regulatory and legal requirements?

    +   6. How often are logs rotated?

    +   7. Are trigger levels defined for certain types of events?


    Now that you have a visual representation of the threat and have answered questions
    as above, the next step is to identify the threats that may affect your software
    application. This is also where you bring together elements of the software security
    group and the development team for a whiteboard meeting to brainstorm cost-effective
    and practical solutions to the vulnerabilities that have been identified in threat
    modeling. The goals of the attacker are addressed in relation to the threats and
    questions during the STRIDE assessment. This is done from a somewhat higher architectural
    and multifunctional perspective given the makeup of the brainstorming team. It
    is also common practice to use any available categorized threat list and apply
    it to any of the vulnerabilities identified earlier.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/a54ed04827050a271316d34985425127_103_0.png)


    Figure 4.7 Risk assessment process.


    The use of attack trees and attack patterns is a traditional approach to threat
    assessment that can help you identify additional potential threats. Although attack
    patterns represent commonly known attacks, their combination with attack trees
    can be used for a greater depth of analysis highlighting areas you may have missed
    in your initial analysis or through the use of categorized lists of known threats.
    Since attack trees are in a hierarchical, structured, and flow diagram style,
    they give a great visual representation of attacks and help focus efforts on potential
    additional approaches to avoiding or mitigating such attacks. They are also useful
    for the creation of test plans and the assessment of security costs. Since the
    primary focus of attack patterns, attacker techniques, and STRIDE is on the goals
    of the attacker, using them in combination with attack trees helps bring a holistic
    approach to this process, especially when used in face-to-face brainstorming sessions.


    Before you move on to the next stage of the threat modeling and architectural
    risk assessment process and start assigning values to the risk, it is important
    to be sure you have addressed risk with regard to the ease of exploitation, possibility,
    and impact. A visual representation of what knowledge you must have before moving
    on to the next step is given in Figure 4.7. If you don''t have the information
    required to address an area of risk, you will need to go back through the process
    and fill in the gaps in your knowledge and understanding.


    # 4.3.3.3 Ranking the Threats


    During the final stage of the threat modeling and architecture security analysis,
    the threats are ranked from a risk perspective. Given that it may not be economically
    feasible to mitigate'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'all of the identified threats, they are ranked from the highest to lowest risk.
    Some threats may also be ignored because of the very limited likelihood that they
    will occur, in addition to the limited harm the vulnerabilities would cause if
    they were exploited. A prioritized list of threats by risk will significantly
    help the priority and importance of mitigation. At a high level, these risks will
    typically be ranked as high, medium, and low. A typical risk probability formula
    used in industry shows the risk and consequence of a particular vulnerability
    as equal to the probability of the threat occurring multiplied by the damage potential.
    That is,


    # Risk = Probability × Damage Potential


    A 10-scale measurement is typically used in risk probability calculations, with
    the number 1 representing a threat or component of a threat that is least likely
    to occur and the number 10 representing that which is most likely to occur. The
    same 1-to-10 ranking system is used for assigning damage potential, with 1 indicating
    the least damage potential and 10 the most.


    As an example of the mechanics involved, a threat that is moderately likely to
    occur, with a probability risk score of 5, and a high damage potential of 10 has
    a risk equal to that of a threat having a probability risk score of 10 and a medium
    damage risk potential of 5. Mathematically,


    ```

    If Probability = 5 and Damage Potential = 10, then Risk = 5 × 10 = 50%

    If Probability = 10 and Damage Potential = 5, then Risk = 10 × 5 = 50%

    ```


    As you can see from this example, 100 can be divided into three ranges of numbers
    to indicate a high, medium, or low risk rating. Obviously, your level of priority
    to fix the vulnerabilities will start with the highest priority of risk, which
    likely means that immediate mitigation is required. Then you would tackle vulnerabilities
    of medium risk, which should be done shortly thereafter but with less priority.
    The priority of low risks, as noted previously, will depend on the level of effort,
    exposure, and financial or legal risk also associated with the risk.


    # 4.3.3.4 DREAD


    Although many different risk models can be used when assessing vulnerabilities
    during the software development process, the DREAD model used by Microsoft is
    one the most popular. The acronym DREAD stands for Damage potential, Reproducibility,
    Exploitability, Affected users, and Discoverability. Answers to questions used
    to establish a risk rating for each of these elements produces a number from 0
    to 10; the higher the number, the more serious is the risk. These numbers are
    used as a classification scheme for quantifying, comparing, and prioritizing the
    amount of risk presented by each evaluated threat and calculating the overall
    risk in numeric form so that threats can be ranked and sorted with any other risks
    found in the software application.


    The DREAD algorithm, shown below, is used to compute a risk value, which is an
    average of all five categories:


    ```

    Risk_DREAD = (DAMAGE + REPRODUCIBILITY + EXPLOITABILITY + AFFECTED USERS + DISCOVERABILITY)/5^10

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Here are some examples of how you arrive at the risk rating for a given threat
    by asking questions to quantify the DREAD categories:11


    # Damage Potential


    +   - If a threat exploit occurs, how much damage will be caused?

    +     - 0 = nothing

    +     - 5 = individual user data is compromised or affected

    +     - 10 = complete system or data destruction


    # Reproducibility


    +   - How easy is it to reproduce the threat exploit?

    +     - 0 = very hard or impossible, even for administrators of the application

    +     - 5 = one or two steps required; may need to be an authorized user

    +     - 10 = just a web browser, and the address bar is sufficient, without authentication


    # Exploitability


    +   - What is needed to exploit this threat?

    +     - 0 = advanced programming and networking knowledge, with custom or advanced
    attack tools

    +     - 5 = malware exists on the Internet, or an exploit is easily performed
    using available attack tools

    +     - 10 = just a web browser


    # Affected Users


    +   - How many users will be affected?

    +     - 0 = none

    +     - 5 = some users, but not all

    +     - 10 = all users


    # Discoverability


    +   - How easy is it to discover this threat?

    +     - 0 = very hard to impossible; requires source code or administrative access

    +     - 5 = can figure it out by guessing or by monitoring network traces

    +     - 9 = details of faults like this are already in the public domain and can
    be easily discovered using a search engine

    +     - 10 = the information is visible in the web browser address bar or in a
    form


    The next step is to classify your threat ratings as low (value = 1), medium (value
    = 2), or high (value = 3) for each category of DREAD based on your answers. Answers
    that would indicate a low, medium, or high risk for each DREAD category are shown
    below:12


    # Damage Potential


    +   - Low (value = 1): Leaking trivial information.

    +   - Medium (value = 2): Leaking sensitive information.

    +   - High (value = 3): The attacker can subvert the security system; get full
    trust authorization; run as administrator; upload content.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Reproducibility


    Low (value = 1): The attack is very difficult to reproduce, even with knowledge
    of the security hole.


    Medium (value = 2): The attack can be reproduced, but only with a timing window
    and a particular race situation.


    High (value = 3): The attack can be reproduced every time and does not require
    a timing window.


    # Exploitability


    Low (value = 1): The attack requires an extremely skilled person and in-depth
    knowledge every time to exploit.


    Medium (value = 2): A skilled programmer could make the attack, and then repeat
    the steps.


    High (value = 3): A novice programmer could make the attack in a short time.


    # Affected Users


    Low (value = 1): Very small percentage of users, obscure feature; affects anonymous
    users.


    Medium (value = 2): Some users, nondefault configuration.


    High (value = 3): All users, default configuration, key customers.


    # Discoverability


    Low (value = 1): The bug is obscure, and it is unlikely that users will work out
    damage potential.


    Medium (value = 2): The vulnerability is in a seldom-used part of the product,
    and only a few users should come across it. It would take some thinking to see
    malicious use.


    High (value = 3): Published information explains the attack. The vulnerability
    is found in the most commonly used feature and is very noticeable.


    | DREAD Category | Low Risk (1) | Medium Risk (2) | High Risk (3) | Subtotal Risk
    Scores |

    |---|---|---|---|---|

    | Damage Potential (D) | | | | |

    | Reproducibility (R) | | | | |

    | Exploitability (E) | | | | |

    | Affected Users (A) | | | | |

    | Discoverability (D) | | | | Total Risk Score |

    | | | | | |


    Figure 4.8 DREAD threat rating table.'
  merge: -1
  img_proc: true
