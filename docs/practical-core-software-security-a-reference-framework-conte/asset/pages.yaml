  md: 'requirements analysis. As discussed previously, the planning and awareness
    of security, privacy, and risk management early in the SDLC through the proper
    used of an SDL will result in significant cost and time savings.


    Perhaps the most important, complex, and difficult part of the SDL starts during
    this phase of the SDL. As discussed previously, threat modeling and architectural
    security analysis typically fall into the domain of the senior software security
    architects and require the most experience and expertise of any of the tasks within
    the SDL. Fortunately, tools are currently available and in the process of being
    developed that can assist in this phase and help leverage and scale a skill set
    that is typically a limited resource in a software security group.


    Additional security training that may be needed for key developers to understand
    the current threats and potential exploitations of their products, as well as
    training for secure design and coding techniques specific to the software being
    developed and for the systems with which the software will be interacting, are
    identified at this stage of the SDL. This enables the developers to work more
    efficiently with the software security architects and others from the software
    security group to create more secure designs and empower them to address key issues
    early in the development processes.


    # ## 4.1 A2 Policy Compliance Analysis


    The purpose of a software security policy is to define what needs to be protected
    and how it will be protected, including reviewing and incorporating policies from
    outside the SDL that may impact the development process. These might include policies
    governing software or applications developed or applied anywhere in the organization.
    During this phase, any policy that exists outside the domain of the SDL policy
    is reviewed. Corporate security and privacy policies will likely instruct designers
    and developers on what the security and privacy features need to be and how they
    must be implemented. Other policies may include those that govern the use of third-party
    and open-source software or the protections and control of source code and other
    intellectual property within and outside the organization. Assuming the software
    security group is separate from the centralized information security group, it
    is important that both groups collaborate on all policies and guidelines related
    to the development and post-release security support and response of software
    from that organization. It is also important to collaborate with the privacy function
    of the company, whether it is part of a centralized group or outside legal counsel.


    # ## 4.2 SDL Policy Assessment and Scoping


    The SDL also provides an invaluable guide for software developers setting a security
    standard for their organization and should offer a roadmap for implementation
    without disrupting the core business of producing quality software applications.
    Unless the senior leadership of the development organization and the management
    team support this model, the SDL will likely fail. It must be driven by a policy
    that is signed off, promulgated, and provides support by the software development
    management team and ideally by the CEO. An organization should have a documented
    and repeatable SDL policy and guideline that supports the SDLC, including its
    business needs, and as a complement to the engineering and development culture
    that'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'it supports. The culture and maturity of the organization are very important
    to consider in the development of the SDL policy so that you ensure it will be
    both feasible and practical to implement. The management style, complexity of
    people, process, and technology needs, including the overall architecture of the
    product, will help determine how granular or objective in focus the guidelines
    will be. The amount of outsourced development, if any, will need to be assessed
    as part of this process as well. An internal development team will require more
    detailed procedures, whereas an outsourced function will require more contractual
    objects, service levels, and detailed deliverables. The vulnerabilities and risk
    of using outsourced development resources will be covered later in the book.


    # 4.3 Threat Modeling/Architecture Security Analysis


    # 4.3.1 Threat Modeling


    As discussed previously, threat modeling requires a special set of skills, experience,
    and mindsets: The people on the team who do this must be able to think like an
    adversary. A senior software security architect or one of the more seasoned software
    security champions typically runs this aspect. The developers and team members
    who are pulled into this process must know not only how to develop or build software
    but also how to deconstruct or take apart the software and its architecture while
    thinking like an adversary.


    Microsoft® first documented its threat modeling methodology in 1999, and its method
    has evolved into an industry standard since that time.1 This was not the first
    time anyone threat modeled at Microsoft, of course, but rather the first time
    the methodology was formalized or considered as an abstracted engineering activity.
    The threat risk modeling process has five steps, enumerated below and shown graphically
    in Figure 4.2. They are as follows:


    +   1. Identify security objectives.

    +   2. Survey the application.

    +   3. Decompose it.

    +   4. Identify threats.

    +   5. Identify vulnerabilities.


    Following these five steps will help you understand what assets you need to protect,
    from whom you need to protect them, how you can protect them, what is the implementation
    priority, and what risk you will have to live with if a few of the threats are
    not included in the implementation scope.


    The focus of threat modeling should not be simply on the software product itself
    but also include the context of the business and the user. The implementation
    priorities can be limited to the software product itself after the threat modeling,
    analysis, and architectural security risk analysis are completed. Besides the
    cost savings achieved by building security in early in the process, another advantage
    is to take into account the business and user needs and requirements so you can
    balance out and make security decisions that are cost-efficient and relevant to
    the competitiveness of the product in addition to facilitating expected and required
    security and privacy controls.'
