    of minimal cryptographic design requirements. Design specifications should describe
    privacy features that will be directly exposed to users, such as those that require
    user authentication to access specific data or user consent before use of a high-risk
    privacy feature. In addition, all design specifications should describe how to
    securely implement all functionality provided by a given feature or function.
    It is good practice to validate design specifications against the application’s
    functional specification. The functional specification should include (1) an accurate
    and complete description of the intended use of a feature or function, and (2)
    a description of how to deploy the feature or function in a secure fashion.26


