  md: '![](img/a54ed04827050a271316d34985425127_186_0.png)


    # Figure 7.4 Four-step final security review process.


    Having the quality gates early in the SDLC process so that security risks are
    understood early in the SDL process helps ensure that vulnerabilities are identified
    and fixed early, which will avoid unnecessary work and delays later in the process.
    The SDL and development team must show compliance with the quality gates as part
    of the final security review. If security has truly been built into the SDLC process
    as a result of the SDL, the time required to complete the final security review
    will be minimal; if not, more time and resources will be required, which might
    delay the ability to release and ship on time.


    +   2. Identify feature eligibility. During this step, security tasks that are
    eligible for work in the final security review are identified. Feature eligibility
    should have been done earlier in the SDL process to avoid unfinished security
    work in the final security review. Scrutiny should have also been given to areas
    or sub-teams where vulnerabilities have not been reported yet during the SDL process
    but that have a history of vulnerabilities with high scores that could bring a
    surprise task to the teams during the final security review.


    +   3. Evaluate and plan for remediation. During this step, the stakeholders responsible
    for the tasks identified in the previous step are notified, and scheduling for
    the final security review is set.'
