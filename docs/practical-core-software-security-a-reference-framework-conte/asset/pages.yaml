    # 2.8 The Importance of Metrics


    In the words of Lord Kelvin, “If you cannot measure it, you cannot improve it.”⁴⁰
    This maxim holds true today as it applies to product security and the need to
    measure a software development organization’s security posture accurately. Meaningful
    security metrics are critical as corporations grapple with regulatory and risk
    management requirements, tightening security budgets require shrewd security investments,
    and customers demand proof that security and privacy is being built into their
    products rather than through the historical post-release fixes.


    Metrics tracking is like an insurance policy for your software projects and also
    assists in managing protection against vulnerabilities. As we have noted repeatedly,
    the cost of detecting a defect in successive stages of the SDLC is very high compared
    with detecting the same defect at the stage of the SDLC where the defect originated.
    Metrics can track these costs and provide significant help in various return-on-investment
    (ROI) calculations throughout the SDL/SDLC process. As shown in Figure 1.1, it
    costs little to avoid potential security defects early in development, especially
    compared to costing 10, 20, 50, or even 100 times that amount much later in development.
    A visual representation of the cost of fixing defects at different stages of the
    SDLC as part of the SDL process is given in Figure 2.2. It can be argued that
    the cost of preventing just one or two defects from going live is worth the cost
    of tracking metrics. The ability to foresee defects and remediate them is a good
    indicator of a healthy software security program, but quality metrics throughout
    the SDL/SDLC process can help in managing and often avoiding excessive remediation
    costs.


    One goal of the SDL is to catch defects throughout the process as a multistaged
    filtering process rather than through a single activity or point in time, thus
    minimizing the remaining defects that lead to vulnerabilities. Each defect-removal
    activity can be thought of as a filter that removes some percentage of defects
    that can lead to vulnerabilities from the software product.⁴¹ The more defect-removal
    filters there are in the software development life cycle, the fewer defects that
    can lead to vulnerabilities will remain in the software product when it is released.
    More important, early measurement of defects enables the organization to take
    corrective action early in the SDLC. Each time defects are removed, they are measured.
    Every defect-removal point becomes a measurement point. Defect measurement leads
    to something even more important than defect removal and prevention: It tells
    teams where they stand versus their goals, helps them decide whether to move to
    the next step or to stop and take corrective action, and indicates where to fix
    their process to meet their goals.⁴² The SDL model that we will present in this
    book will focus on filtering out defects throughout the SDLC, with a particular
    focus on phases S1–S3 of our model (see Figure 2.3).


    Security metrics can be an invaluable resource for assessing the effectiveness
    of an organization’s software security program. Meaningful metrics can be used
    to continually improve the product security program’s performance, substantiate
    regulatory compliance, raise the level of security awareness among management
    and stakeholders, and assist decision makers with funding requests. Without metrics,
    organizations are reduced to operating their product security programs under FUD:
    fear, uncertainty, and doubt.'
