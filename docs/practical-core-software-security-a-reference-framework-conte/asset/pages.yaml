    or white-box testing and does not require source code access. Like the dynamic
    analysis tools discussed in this chapter, this feature makes it a great tool for
    testing third-party software or software that has been outsourced for development.
    One drawback of fuzz testing, however, is that it is intrusive and may well crash
    the system, which will likely require initial testing to occur in a separate environment
    such as a testing lab or virtualized environment.


    There are two main types of fuzz testing: “smart” and “dumb.”


    +   - In “smart” (generational) fuzzing, the fuzzer pushes data to the program
    in a logical way, usually by waiting for responses and possibly altering the stack.
    This method requires in-depth knowledge of the target and specialized tools, but
    less crash analysis is required and also less duplication of findings than with
    dumb fuzzing.25,26

    +   - In “dumb” (mutational) fuzzing, the fuzzer systematically pushes data to
    the program without waiting for proper responses. This method is closely tied
    to denial-of-service (DoS) attacks. This method requires no knowledge of the target
    and uses existing tools. However, more crash analysis is required, and there is
    more duplication of findings than with “smart” fuzzing.27,28


    To carry out a fuzz test, the following steps are followed for each file or field
    that feeds into the application:


