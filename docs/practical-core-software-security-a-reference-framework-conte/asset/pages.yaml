  md: '+   - Has it been fixed? If not, what can be done about it now?


    +   - Have there been any changes in the software architecture, function, or use
    that may have added new security vulnerabilities or new planes of attack?


    +   - Assess the security of the software using the key software security assessment
    techniques of the SDL.


    +   - Create a proposal that will tell the business how to remediate the security
    vulnerabilities or flaws in the software (cost + time) or how quickly they should
