    # 7.10 Summary


    In this chapter, we have described the requirements for successful release and
    ship of the software product after it has finished the SDLC and associated SDL
    activities and best practices (see Figure 7.5). Now that we have made it through
    SDL Phase A5 and the product has been released, the next chapter will describe
    SDL Phase A6, which will outline the SDL post-release support activity (PRSA)
    phase of our SDL. After a software product is released and shipped, the software
    security, development, and privacy teams, with support from the corporate public
    relations, legal, and other groups, must be available to respond to any possible
    security vulnerabilities or privacy issues that warrant a response. In addition,
    a response plan detailing appropriate processes and procedures must be developed
    that includes preparations for potential post-release issues. In addition to external
    vulnerability disclosure responses, this phase should include internal review
    for new product combinations or cloud deployment, post-release certifications,
