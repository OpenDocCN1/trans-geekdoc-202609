- pgno: 223
  md: 'Application development using these microservices entails developing a series
    of API invocation processes that perform useful work without concern for how these
    services are implemented, while permitting enhancement and changes to occur without
    interface changes to isolate the need for rebuilding every application that needs
    those services.


    Traditional SDL mapping needs to be adapted to make it feasible to build and deploy
    code where the velocity of deployments can be 100s or 1000s of changes a day.
    It increases the need to make accurate threat models with a granular understanding
    of trust boundaries (e.g., between microservices).


    One should ask if every API update needs all SDL activities. For feasible SDL
    activities, triggers should be defined to kick off high-impact ones (e.g., dynamic
    security testing).


    # 9.1.4 Digital Enterprise


    A digital enterprise uses technology to enable and improve business activities
    to achieve a competitive advantage. This is why many start-ups have an advantage
    over established competitors. They are able to start out small with agile business
    practices that are fast, agile, innovative, and disruptive. Larger institutionalized
    companies must now move quickly to digitize all of their operations to compete.
    This typically involves rapid and dramatic change. The ability to respond to a
    changing marketplace is critical for their success. The principles used for Agile,
    DevOps, and the cloud described in Sections 9.1.1 to 9.1.3 are used to build and
    enhance the successful operations for a digital enterprise.


    The traditional Waterfall method for software development is not feasible or practical
    for the iterative product release cycle required for the digital enterprise. The
    elements of the Agile development process and CI/CD should use early user testing,
    customer analytics, and prioritization based on user feedback, thus providing
    a smoother path toward enhancing the business value chain. Agility is achieved
    by eliminating wasted effort, thereby speeding up the product release lifecycle.
    Automation, orchestration technology, and APIs are used to reduce or eliminate
    manual security processes and interactions to shorten development times and deliver
    new features, fixes, and updates aligned with the business. This will reduce the
    release times, raise quality levels, and increase the productivity of the team
    members, as well as facilitate security operating at speeds required in a cloud
    environment. Enterprise environments typically include employee productivity tools
    (Slack®, Office 365®, messaging, emails) and business systems such as CRM and
    HR (e.g., Workday®). Similar to the cloud, enterprise development needs can be
    quite different from traditional products. The technology stack is likely to be
    Microsoft®-based. Increasingly, on-prem business applications are being replaced
    by Software-as-a-Service (SaaS) applications.


    As more companies have moved to public cloud services due to the end-to-end digital
    transformation, from the customer interface through the back-office processes,
    security challenges have significantly increased with the ever-changing and increasing
    footprint and attack surfaces. Building security into the software development
    process as described in this book has never been more important, and it is core
    to the successful operation of a digital enterprise. Integrating third-party SaaS
    applications through APIs increases the attack surface and changes trust boundaries
    in many cases. This supply-chain integration risk is enhanced today; in all likelihood,
    the application stack is changing every day. SDL managers should pay special attention
    to location-specific regulatory and privacy requirements.'
