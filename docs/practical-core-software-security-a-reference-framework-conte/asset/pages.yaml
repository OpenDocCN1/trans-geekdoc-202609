    # ## 4.3.3.6 The Generic Risk Model


    Microsoft threat modeling processes such as STRIDE and DREAD may not be appropriate
    for your application, and you may want to use other threat risk models or modify
    the Microsoft processes for your own use, adopting the most appropriate threat
    modeling methodologies for your own organization. Using qualitative values such
    as high, medium, and low can also help avoid the ranking becoming too subjective,
    as with the numbering system used in DREAD.


    These examples help in the calculation of the overall risk values by assigning
    qualitative values such as high, medium, and low to likelihood and impact factors.
    Here, too, using qualitative values rather than numeric ones, as in the DREAD
    model, helps avoid the ranking becoming overly subjective.


    An example of a more subjective model is the Generic Risk Model, which takes into
    consideration the likelihood (e.g., the probability of an attack) and the impact
    (e.g., damage potential) and is represented mathematically as⁴


    # ## Risk = Likelihood × Impact


    The likelihood or probability is defined by the ease of exploitation, which depends
    mainly on the type of threat and the system characteristics, and by the possibility
    to realize a threat, which is determined by the existence of an appropriate countermeasure.
    The following is a set of considerations for determining ease of exploitation:


    +   1. Can an attacker exploit this remotely?

    +   2. Does the attacker need to be authenticated?

    +   3. Can the exploit be automated?


    The impact depends mainly on the damage potential and the extent of the impact,
    such as the number of components that are affected by a threat. Examples to determine
    the damage potential are as follows:


    +   1. Can an attacker completely take over and manipulate the system?

    +   2. Can an attacker gain administration access to the system?

    +   3. Can an attacker crash the system?

    +   4. Can the attacker obtain access to sensitive information such as secrets,
    PII?


    Examples to determine the number of components that are affected by a threat include:


    +   1. How many data sources and systems can be impacted?

    +   2. How “deep” into the infrastructure can the threat agent go?'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 4.3.3.7 Trike


    An alternative threat modeling methodology to STRIDE and DREAD is Trike. Trike
    is a unified conceptual framework for security auditing from a risk management
    perspective through the generation of threat models in a reliable, repeatable
    manner.¹⁵ Trike uses a threat modeling framework that is similar to the Microsoft
    threat modeling methodologies. However, Trike differs in that it uses a risk-based
    approach with distinct implementation, threat, and risk models, instead of using
    the STRIDE/DREAD aggregated threat model (attacks, threats, and weaknesses).¹⁶


    Trike is distinguished from other threat modeling methodologies by the high levels
    of automation possible within the system, the defensive perspective of the system,
    and the degree of formalism present in the methodology.¹⁷ The latest version of
    the Trike tool can be downloaded at the SourceForge® website at http://sourceforge.net/projects/trike/files/trike.


    A security auditing team can use it to describe the security characteristics of
    a system from its high-level architecture to its low-level implementation details.
    The goal of Trike is to automate the repetitive parts of threat modeling. Trike
    automatically generates threats (and some attacks) based on a description of the
    system, but this requires that the user describe the system to Trike and check
    whether these threats and attacks apply.¹⁸ A key element of Trike is the empowerment,
    involvement, and communications with the key stakeholders with complete progress
    and task status transparency so that they know the level of risk and can evaluate
    acceptance of the risk throughout the software development process.


    # 4.3.3.8 Process for Attack Simulation and Threat Analysis (PASTA)


    In 2011, a new application threat modeling methodology developed by Marco Morana
    and Tony Uceda Velez was presented. PASTA is a seven-step process that is applicable
    to most application development methodologies and is platform-agnostic. It not
    only aligns business objectives with technical requirements but also takes into
    account compliance requirements, business impact analysis, and a dynamic approach
    to threat management, enumeration, and scoring. The process begins with a clear
    definition of business objectives, security and compliance requirements, and business
    impact analysis. Similar to the Microsoft process, the application is decomposed
    into components, with use case diagrams and DFDs to illustrate the threat model
    with which threat and vulnerability analysis can be performed. The next step involves
    use of threat trees, abuse cases, scoring systems, and enumerations for further
    reference in analysis. Following this, the threat model is viewed from an attacker
    perspective by attack modeling in attack trees and attack surface analysis. In
    the final step, risk and business impact can be qualified and quantified, and
    necessary countermeasures identified. This process combines the best of various
    threat modeling approaches, with the attack trees serving as an attacker-centric
    means of viewing a threat, as well as, in combination with risk and impact analysis,
    helping to create an asset-centric means of planning a mitigation strategy. The
    threat trees, with mapping of threats to existing vulnerabilities, work in favor
    of easy and scalable threat management. Beyond the technical aspects, the risk
    and business impact analysis take threat modeling beyond just a software development
    exercise to involve participation of key decision makers in the vulnerability
    management process. What differentiates this methodology from Trike is that it
    focuses on involving risk management steps in the final stage of the process.
    This ensures that it is not limited to a specific risk estimation formula.¹⁹'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The seven-step PASTA Threat Modeling Methodology is as follows:20


    # 1. Define Objectives


    +   - Identify business objectives.

    +   - Identify security and compliance requirements.

    +   - Business impact analysis.


    # 2. Define Technical Scope


    +   - Capture the boundaries of the technical environment.

    +   - Capture infrastructure, application, and software dependencies.


    # 3. Application Decomposition


    +   - Identify uses cases and define application entry points and trust levels.

    +   - Indentify actors, assets, services, roles, and data sources.

    +   - Data flow diagramming and trust boundaries.


    # 4. Threat Analysis


    +   - Probabilistic attack scenarios analysis.

    +   - Regression analysis on security events.

    +   - Threat intelligence correlation and analytics.


    # 5. Vulnerability and Weakness Analysis


    +   - Queries of existing vulnerability reports and issues tracking.

    +   - Threat to existing vulnerability mapping using threat trees.

    +   - Design flaw analysis using use and abuse cases.

    +   - Scorings (CVSS/CWSS) and enumerations (CWE™/CVE®).


    # 6. Attack Modeling


    +   - Attack surface analysis.

    +   - Attack tree development and attack library management.

    +   - Attack to vulnerability and exploits analysis using attack trees.


    # 7. Risk and Impact Analysis


    +   - Qualify and quantify business impact.

    +   - Countermeasure identification and residual risk analysis.

    +   - ID risk mitigation strategies.


    There is threat-modeling tool called ThreatModeler® that supports the PASTA methodology.
    ThreatModeler is a threat modeling product that brings a mind mapping approach
    to threat modeling. It allows companies to scale their threat modeling initiative
    across thousands of applications easily and effortlessly. ThreatModeler automatically
    generates threats and classifies them under various risk categories. It provides
    a centralized threat management platform in which organizations can define threats
    related to network, host, applications, mobile, web services, etc., and associate
    attributes such as technical impacts, business impacts, and threat agents to better
    understand a threat and prioritize mitigation strategies.21,22


    Although its original focus was on banking malware threats, PASTA certainly has
    applicability across all software applications and will fit well into most SDLCs.
    It will be interesting to see how widely it is accepted in industry over the next
    few years.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 4.3.3.9 CVSS


    Another risk assessment methodology that is very popular and is used extensively
    by corporate product security incident response teams (PSIRTs) and internal software
    security groups to classify externally discovered software vulnerabilities is
    the U.S. government’s Common Vulnerability Scoring System (CVSS). The National
    Infrastructure Advisory Council (NIAC) commissioned CVSS to support the global
    Vulnerability Disclosure Framework. CVSS is currently maintained by the Forum
    of Incident Response and Security Teams (FIRST),23 and was a joint effort involving
    many companies, including CERT®/CC, Cisco Systems, DHS/ MITRE®, eBay®, IBM® Internet
    Security Systems (ISS®), Microsoft, Qualys,® and Symantec®. The CVSS model is
    designed to provide end users with an overall composite score representing the
    severity and risk of a vulnerability. It is derived from metrics and formulas.
    The metrics are in three distinct categories that can be quantitatively or qualitatively
    measured. Base metrics contain qualities that are intrinsic to any given vulnerability;
    these qualities do not change over time or in different environments. Temporal
    metrics contain characteristics of a vulnerability that evolve over the lifetime
    of the vulnerability. Environmental metrics contain characteristics of a vulnerability
    that are related to an implementation in a specific user’s environment. Scoring
    is the process of combining all metric values according to specific formulas and
    based on a series of measurements called metrics based on expert assessment, which
    is described below:24


    +   - Base scoring is computed by the vendor or originator with the intention
    of being published, and, once set, is not expected to change. Base scoring is
    also computed from confidentiality, integrity, and availability. This is the foundation
    that is modified by the temporal and environmental metrics. The base score has
    the largest bearing on the final score and represents vulnerability severity.

    +   - Temporal scoring is also computed by vendors and coordinators for publication
    and modifies the base score. It allows for the introduction of mitigating factors
    to reduce the score of a vulnerability and is designed to be reevaluated at specific
    intervals as a vulnerability ages. The temporal score represents vulnerability
    urgency at specific points in time.

    +   - Environment scoring is optionally computed by end-user organizations and
    adjusts the combined base-temporal score. This adjusted combined score should
    be considered the final score and represents a moment in time, tailored to a specific
    environment. User organizations should use this score to prioritize responses
    within their own environments.


    A useful tool is the Common Vulnerability Scoring System Version 3.1 Calculator,
    which can be found at https://www.first.org/cvss/calculator/3.1.


    The CVSS has become an industry standard for assessing the severity of computer
    system security vulnerabilities. It establishes a measure of how much concern
    vulnerability should warrant compared to other vulnerabilities so that mitigation
    efforts can be prioritized. As of the writing of this book, the current version
    of CVSS is version 3.1.


    The CVSS is typically used by an internal software security group researcher or
    other source that has notified you that your software product has a vulnerability.
    This provides the ability to keep your severity ratings normalized, consistent,
    and accurate. The scores are also used in the communication to the customers acknowledging
    that there is a vulnerability in the product that they have purchased, the severity
    of the vulnerability, and what your company is doing to mitigate that vulnerability,
    including any patch releases for the'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'vulnerability. In turn, a security researcher will likely use the CVSS ranking
    system to provide a risk rating to the company within whose software product they
    have found a vulnerability, so that the vendor has a good idea of the severity
    of the vulnerability that is being disclosed and the details of what to verify
    with its product development team.


    It should be noted that the CVSS is not a threat modeling methodology and is not
    used to find or reduce the attack surface or to help specify risks within a piece
    of code. It is, rather, a risk scoring system and it adds complexities that don’t
    exist in STRIDE and DREAD. It is used to calculate risks that are identified post-product
    release in addition to environmental factors.


    # 4.3.3.10 OCTAVE®


    Operationally Critical Threat, Asset, and Vulnerability Evaluation (OCTAVE) is
    a very complex risk methodology approach originating from Carnegie Mellon University’s
    Software Engineering Institute (SEI) in collaboration with the SEI Computer Emergency
    Response Team (CERT). OCTAVE focuses on organizational risk, not technical risk.
    It comprises a suite of tools, techniques, and methods for risk-based information
    security strategic assessment and planning. There are three OCTAVE methods: (1)
    the original OCTAVE method, which forms the basis for the OCTAVE body of knowledge;
    (2) OCTAVE-S, for smaller organizations; and (3) OCTAVE-Allegro, a streamlined
    approach for information security assessment and assurance. All of the methods
    have specific catalogs of practices, profiles, and worksheets to document the
    modeling outcomes. OCTAVE methods are founded on the OCTAVE criteria—a standard
    approach for a risk-driven and practice-based information security evaluation.
    The OCTAVE criteria establish the fundamental principles and attributes of risk
    management that are used by the OCTAVE methods.25


    OCTAVE is a valuable structured approach to documenting and measuring overall
    IT security risk, particularly as it relates to corporate IT and business risk
    management and when documenting risks surrounding complete systems becomes necessary.
    Although a software security professional may be involved in a portion of the
    assessment as a software or process for building software security into the development
    process may be within its scope, it is not valuable for modeling, defining, and
    ranking specific risks and vulnerabilities within the SDL process. As with CVSS
    scoring, OCTAVE does not include threat risk modeling and is used primarily to
    enumerate risk. It is also much more complex than most other risk assessment and
    scoring methodologies in that it consists of 18 volumes with many worksheets to
    work through. The comprehensive version of OCTAVE (unlike OCTAVE-S for small organizations)
    defines “likelihood” assuming that the threat will always occur, which is not
    applicable to many large organizations. For these reasons, it is not likely to
    be an approach that is used throughout the software development life cycle.


    # 4.3.3.11 AS/NZS ISO® 31000:2009


    The Australian/New Zealand Standard AS/NZS 4360, first issued in 1999 and revised
    in 2004, was the world’s first formal standard for documenting and managing risk
    and is still one of the few formal standards for managing it.26 AS/NZS ISO 31000:2009
    is a newer standard, published November 20, 2009, for managing risk and supersedes
    AS/NZS 4360:2004.27


    ISO 31000:2009 provides principles and generic guidelines on risk management and
    can be used by any public, private, or community enterprise, association, group,
    or individual. It is'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'not specific to any industry or sector. It can be applied throughout the life
    of an organization, and to a wide range of activities, including strategies and
    decisions, operations, processes, functions, projects, products, services, and
    assets. It can also be applied to any type of risk, whatever its nature, whether
    having positive or negative consequences. Although ISO 31000:2009 provides generic
    guidelines, it is not intended to promote uniformity of risk management across
    organizations. The design and implementation of risk management plans and frameworks
    will need to take into account the varying needs of a specific organization; its
    particular objectives, context, structure, operations, processes, functions, projects,
    products, services, or assets; and specific practices employed. It is intended
    that ISO 31000:2009 be utilized to harmonize risk management processes in existing
    and future standards. It provides a common approach in support of standards dealing
    with specific risks and/or sectors and does not replace those standards.28


    ISO 31000:2009 does not define the methodology to perform a structured threat
    risk modeling exercise or a structured approach to specify software application
    security risks, and it works best in evaluating business or systemic risks rather
    than for technical risks. As with OCTAVE, this methodology is likely to be used
    by a centralized corporate risk management team. Software security professionals
    may be involved in a portion of the assessment because their software or process
    for building software security into the development process may be in scope, but
    it is not likely that this methodology will be used in the SDL as a primary risk
    methodology because it is not valuable for modeling, defining, and ranking specific
    risks and vulnerabilities within the SDLC process.


    # 4.3.4 Risk Mitigation


    Before you move onto the risk mitigation phase you will need to make a master
    list of high-risk vulnerabilities during the threat modeling process, including
    STRIDE or an equivalent. This will give you a priority list from which to work
    as you follow through your mitigation plan.


    There are four ways you can plan mitigation and address threats:29


    +   1. Redesign the process to eliminate the threat.

    +   2. Apply a standard mitigation as per general recommendations.

    +   3. Invent a new mitigation strategy (risky and time-consuming).

    +   4. Accept vulnerabilities with low risk and high effort to fix them.


    Vulnerability threats that have no countermeasures in STRIDE or Application Security
    Frame (ASF) are categorized, and countermeasured for specific threats that are
    identified for each of the categories they fall into.


    # STRIDE Threat & Mitigation Techniques List30


    Spoofing identity


    +   • Appropriate authentication

    +   • Protect secret data

    +   • Don''t store secrets'
