- pgno: 127
  md: '# Chapter 5


    # Design and Development (A3): SDL Activities and Best Practices


    # CHAPTER OVERVIEW


    This chapter covers the design and development (A3) phase when the end user of
    your software is foremost in your mind. During this phase, you will do an analysis
    of policy compliance; create the test plan documentation; update your threat model,
    if necessary; conduct a design security analysis and review; and do a privacy
    implementation assessment so you can make informed decisions about how to deploy
    your software securely and establish development best practices to detect and
    remove security and privacy issues early in the development cycle.


    # CHAPTER TAKE-AWAYS


    +   - Explore the practices that compose the Architecture (Phase A3) of the security
    development lifecycle (SDL).

    +   - Document the key success factors for completion of Phase A3.

    +   - Create initial, draft deliverables for Phase A3 for the case study in Appendix
    A.

    +   - Prepare a testing plan for the case study in Appendix A.


    Figure 5.1 illustrates the steps and activities found in Phase A3 of the SDL.


    In Phase A3, you''ll perform a static analysis during both the design and development
    (A3) and the ship (A4) phases of your SDL. We will provide a detailed description
    of a static analysis in the next chapter. You will build the plan for how you
    will take your project through the rest of the SDL process, from implementation,
    to verification, to release. During the design and development (A3) phase, you
    establish best practices for this phase using functional and design specifications.'
  merge: -1
  img_proc: true
