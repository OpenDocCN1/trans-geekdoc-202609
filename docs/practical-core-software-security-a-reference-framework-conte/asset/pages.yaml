    One of the best ways to protect a customer’s privacy is not to collect his or
    her user data in the first place. The questions that should constantly be asked
    by architects, developers, and administrators of data collection systems include:


    +   • “Do I need to collect this data?”

    +   • “Do I have a valid business purpose?”

    +   • “Will customers support my business purpose?”24


    The development organization must keep in mind that for customers to have control
    over their personal information, they need to know what personal information will
    be collected, with whom it will be shared, and how it will be used. In addition:


    +   • Customers must provide consent before any personal information is transferred
    from their computer; and

    +   • If customers’ personal information is transferred over the Internet and
    stored remotely, they must be offered a mechanism for accessing and updating the
    information.25


