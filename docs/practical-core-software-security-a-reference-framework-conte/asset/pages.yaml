    # 4.5 Privacy Information Gathering and Analysis


    It is important to consider if the system will transmit, store, or create information
    that may be considered privacy information early in the SDLC. The gathering of
    information and identification and development of a plan for implementing proper
    safeguards and security controls, including processes to address privacy information
    incident handling and reporting requirements, are determined at this stage. This
    stage of the SDL is where the information gathering and analysis for the Privacy
    Impact Assessment (PIA) begins. The analysis phase determines how PII will be
    handled to ensure that it conforms to applicable legal, regulatory, and policy
    requirements regarding privacy and what the risks and effects are of collecting,
    maintaining, and disseminating privacy information in identifiable form in the
    software and overall system being developed or one that it potentially interfaces
    with in a cloud or SaaS environment, and it examines and evaluates protections
    and alternative processes for handling information to mitigate potential privacy
    risks.


    # 4.6 Key Success Factors and Metrics


    # 4.6.1 Key Success Factors


    The success of this second phase of the SDL depends on how well the SDLC identifies
    the threats, requirements, and constraints in functionality and integration and
    mitigates the risk. Key success factors for this second phase are listed in Table
    4.1.


    # Table 4.1 Key Success Factors


    | Key Success Factor | Description |

    |---|---|

    | 1. Identification of business requirements and risks | Mapping of business requirements
    and risks defined in terms of CIA |

    | 2. Effective threat modeling | Identifying threats for the software |

    | 3. Effective architectural threat analysis | Analysis of threats to the software
    and probability of threat materializing |

    | 4. Effective risk mitigation strategy | Risk acceptance, tolerance, and mitigation
    plan per business requirements |

    | 5. Accuracy of DFDs | Data flow diagrams used during threat modeling |'
