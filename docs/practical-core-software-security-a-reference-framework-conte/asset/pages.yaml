  md: '# Appendix A


    # Case Study for Chapters 3 Through 8 Exercises


    The followings case study forms the basis for the exercises you''ll find in Chapters
    3 through 8.


    Revvin'' Engines Auto Parts is a statewide retail and commercial supplier of auto
    parts throughout Illinois. They have a robust business from walk-in traffic and
    from their auto repair shops close to their retail locations. Six months ago,
    the owners decided it was time to open their catalog of items they sell to customers
    across the United States.


    They hired a local Schaumburg software development company to design an Internet
    E-commerce site, implement an online shopping cart, and permit credit card payments
    for online orders. They even slapped together a mobile app for both iOS® and Android®
    devices.


    Once the system was implemented, Revvin'' Engines decided it was time to bring
    in a new staff of development team members to take over the applications for enhancements
    and maintenance. They hired three local people and two remote employees for the
    new team:


    +   * 2 C# programmers for .NET Core

    +   * 1 tester

    +   * 1 designer

    +   * 1 lead engineer who handles the architecture and engineering of the application
    and the corresponding system.


    The team is relatively new, comprising people who have not worked together before
    and who had no direct experience beyond programming courses they completed and
    some freelance application development.


    Future plans for the applications include expansion of capabilities and rewriting
    the applications as cloud native, composed of a series of microservices and application
    programming interfaces (APIs) using web services based on representational state
    transfer (REST).'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The new site and mobile apps became wildly popular. Local customers appreciated
    the convenience of ordering from home or their place of business. In addition,
    the rare auto parts Revvin'' Engines often carries gained national attention,
    and new orders began coming in from across the United States. Management was ecstatic
    about the site and decided it was time to expand the catalog and the marketing
    of their business to areas never considered before.


    One morning, the owners and employees came into work at HQ and found a huge number
    of voice messages on their answering service and hundreds of email messages with
    complaints. People were outraged that right after a purchase on the Revvin'' Engines
    website, their credit card issuers began sending alerts of out-of-pattern purchases
    using their credit cards in other cities, states, and countries throughout Eastern
    Europe.


    Management was at a loss as to what to do and wound up calling NoMoreHacks Security
    Consultants to come in and perform a forensic analysis on the site and the databases
    and an analysis of how they''re protected. NoMoreHacks viewed web logs, server
    logs, application logs, and Windows Event logs to see what may have happened.
    They found several critical and high-level vulnerabilities in the web application
    and a severe lack of proper controls on SQL Server databases. Some of the critical
    vulnerabilities included SQL injection, wherein the attackers were able to learn
    about the structure of the database and all of its tables. They found a series
    of SQL statements that the application dynamically generated that located the
    database of credit card details, followed by an extract of all the credit card
    data. Since stolen credit card data has a short shelf life, the attackers began
    using it right away, before the cards could be reported stolen or compromised.


    A postmortem of the incident led management to temporarily shut down the site
    and the mobile applications while they took appropriate action to mitigate the
    damage and rebuild the application to stand up to hostile and malicious criminals
    on the Internet.


    One of these measures is to focus on how Revvin'' Engines develops or procures
    software, and you''ve been called in to advise them and help them to build a security
    consciousness for their development team and help them to establish a security
    development lifecycle (SDL) that''s culturally appropriate and effective in producing
    secure software that management trusts will stand up to attacks from malicious
    hackers on the Internet or by internal, knowledgeable insiders.'
  merge: -1
