- pgno: 226
  md: '# ## 9.2 Key Success Factors, Deliverables, and Metrics for Each Phase of Our
    SDL Reference Framework


    In Chapters 3 through 7, we have outlined key success factors, deliverables, and
    metrics that should be captured as part of our SDL model. In Chapter 8, the SDL
    post-release phase, we outline the key deliverables and metrics. The key success
    factors, deliverables, and metrics are not set in stone and may need to be tweaked
    as you map the SDL to your own SDLC. In Table 9.1, we have summarized the key
    success factors that are described in Chapters 3 through 8. The Deliverables and
    Metrics are found at the end of this chapter to help you adapt to your own SDL.


    # ## 9.3 Software Security Maturity Models and the SDL


    In this section, you will find a detailed examination of two measurement and metrics
    models intended to help you determine the baseline maturity of the secure development
    integration into your SDLC and the pathways to further improve the maturity of
    your program.


    We''ll take a look at the two leading software security maturity approaches:


    +   - OWASP''s Open Software Assurance Maturity Model (OpenSAMM)

    +   - Building Security In Maturity Model (BSIMM v11)


    # ### 9.3.1 Maturity Models for Security and Resilience


    Jeremy Epstein, a senior computer scientist at SRI International, wrote about
    the value of a software security maturity model⁵:


    > > So how do security maturity models like OpenSAMM and BSIMM fit into this picture?

    > > Both have done a great job cataloging, updating, and organizing many of the
    “rules of thumb” that have been used over the past few decades for investing in
    software assurance. By defining a common language to describe the techniques we
    use, these models will enable us to compare one organization to another and will
    help organizations understand areas where they may be more or less advanced than
    their peers.... Since these are process standards, not technical standards, moving
    in the direction of either BSIMM or OpenSAMM will help an organization advance—and
    waiting for the dust to settle just means it will take longer to catch up with
    other organizations.... [I]n short: do not let the perfect be the enemy of the
    good. For software assurance, it’s time to get moving now.


    # ## 9.3.2 Software Assurance Maturity Model—OpenSAMM


    OpenSAMM is an open framework developed by the Open Web Application Security Project
    (OWASP) to help organizations formulate and implement a strategy for software
    security that'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'is tailored to the specific risks facing the organization. OpenSAMM offers
    a roadmap and a well-defined maturity model for secure software development and
    deployment, along with useful tools for self-assessment and planning. OpenSAMM
    comes as a 96-page PDF file with detailed descriptions of each core activity and
    corresponding security processes.⁶


    The resources provided by OpenSAMM aid in:


    +   - Evaluating an organization’s existing software security practices.

    +   - Building a balanced software security program in well-defined iterations.

    +   - Demonstrating concrete improvements to a security assurance program.

    +   - Defining and measuring security-related activities within an organization.


    SAMM was defined with flexibility in mind so that it can be utilized by small,
    medium, and large organizations using any style of SDLC. The model can be applied
    organization-wide for a single line of business, or even on an individual project.


    OpenSAMM was beta released under a Creative Commons Attribution Share-Alike license.
    The original work was donated to OWASP and is currently being run as an OWASP
    project.


    OpenSAMM starts with the core activities that should be present in any organization
    that develops software:


    +   - Governance

    +   - Construction

    +   - Verification

    +   - Deployment


    In each of these core activities, three security practices are defined for 12
    practices that are used to determine the overall maturity of your program. The
    security practices cover all areas relevant to software security assurance, and
    each provides a “silo” for improvement. These three security practices for each
    level of core activities are shown in Figure 9.3.


    # 9.3.2.1 OpenSAMM Business Functions


    Each of these business functions is described below:


    +   - **Governance** is centered on the processes and activities related to how
    an organization manages overall software development activities. More specifically,
    this includes concerns confronting cross-cut groups involved in development as
    well as business processes that are established at the organization level.

    +   - **Construction** concerns the processes and activities related to how an
    organization defines goals and creates software within development projects. In
    general, this includes product management, requirements gathering, high-level
    architecture specifications, detailed design, and implementation.

    +   - **Verification** is focused on the processes and activities related to how
    an organization checks and tests artifacts produced throughout software development.
    This typically includes quality assurance (QA) work such as testing, but it can
    also include other review and evaluation activities.'
  merge: -1
  img_proc: true
