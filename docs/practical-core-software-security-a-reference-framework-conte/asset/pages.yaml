  md: '# Security Test Plans


    This is a formal security test schedule that maps different stages of the SDL
    process to different types of security testing (static analysis, fuzzing, vulnerability
    assessments, binary testing, etc.)


    # Updated Policy Compliance Analysis


    Policy compliance analysis artifacts (see Chapter 4) should be updated based on
    any new requirements or policies that might have come up during this phase of
    the SDL.


    # Privacy Implementation Assessment Results


    This is a roadmap to implement recommendations from the privacy implementation
    assessment. It should be based on privacy risk (high, medium, or low).


    # 5.6.3 Metrics


    Since some of the success factors and deliverables are similar to those for Phase
    2 of the SDL, the same metrics should be collected and recorded:


    +   - Threats, probability, and severity

    +   - Percent compliance with company policies (updated)

    +     - Percent of compliance in Phase 2 versus Phase 3

    +   - Entry points for software (using DFDs)

    +   - Percent of risk accepted versus mitigated

    +   - Percent of initial software requirements redefined

    +   - Percent of software architecture changes

    +   - Percent of SDLC phases without corresponding software security testing

    +   - Percent of software components with implementations related to privacy controls

    +   - Number of lines of code

    +   - Number of security defects found using static analysis tools

    +   - Number of high-risk defects found using static analysis tools

    +   - Defect density (security issues per 1000 lines of code)


    Note that if too many controls related to privacy need to be implemented in the
    software components, you might want to review the design of the components.


    # 5.7 Summary


    During our discussion of design and development (Phase A3), we described the importance
    of an analysis of policy compliance; creation of the test plan documentation;
    updates to the threat modeling discussed in the last chapter, if necessary; completion
    of a design security analysis and review; and a privacy implementation assessment.
    Out of all of this, best practices are created from the functional and design
    specifications that have been created that will be used throughout the remainder
    of the SDL process. Toward the end of the chapter, we discussed key success factors,
    deliverables, and metrics for this phase.'
