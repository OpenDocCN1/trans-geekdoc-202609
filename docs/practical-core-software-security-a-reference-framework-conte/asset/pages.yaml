    \ this ranking?\n\n# 5.4 Design Security Analysis and Review\n\nIn a 1974 paper,\
    \ Saltzer and Schroeder of the University of Virginia addressed the protection\
    \ of information stored in a computer system by focusing on hardware and software\
    \ issues that are necessary to support information protection.14 The paper presented\
    \ the following 11 security design principles:\n\n+   1. **Least privilege.**\
    \ The principle of least privilege maintains that an individual, process, or other\
    \ type of entity should be given the minimum privileges and resources for the\
    \ minimum period of time required to complete a task. This approach eliminates\
    \ the opportunity for unauthorized access to sensitive information.\n+   \n+ \
    \  2. **Separation of duties.** This principle requires that completion of a specified\
    \ sensitive activity or access to sensitive objects is dependent on the satisfaction\
    \ of multiple conditions. Separation of duties forces collusion among entities\
    \ in order to compromise the system.\n+   \n+   3. **Defense in depth.** This\
    \ is the application of multiple layers of protection, such that a subsequent\
    \ layer will provide protection if a previous layer is breached.\n+   \n+   4.\
    \ **Fail-safe.** This means that if a system fails, it should fail to a state\
    \ where the security of the system and its data are not compromised. In the situation\
    \ in which system recovery is not done automatically, the failed system should\
    \ permit access only by the system administrator and not by users, until security\
    \ controls are reestablished.\n+   \n+   5. **Economy of mechanism.** This promotes\
    \ simple and comprehensible design and implementation of protection mechanisms,\
    \ so that unintended access paths do not exist or can be readily identified and\
    \ eliminated.\n+   \n+   6. **Complete mediation.** This is where every request\
    \ by a subject to access an object in a computer system must undergo a valid and\
    \ effective authorization procedure. This mediation must not be suspended or become\
    \ capable of being bypassed, even when the information system is being initialized,\
    \ undergoing shutdown, being restarted, or is in maintenance mode. Complete mediation\
    \ entails: (a) identification of the entity making the access request; (b) verification\
    \ that the request has not changed since its initiation; (c) application of the\
    \ appropriate authorization procedures; and (d) reexamination of previously authorized\
    \ requests by the same entity.\n+   \n+   7. **Open design.** There has always\
    \ been discussion of the merits and strength of security of designs that are kept\
    \ secret versus designs that are open to scrutiny and evaluation by the community\
    \ at large. For most purposes, an open-access control system design"
