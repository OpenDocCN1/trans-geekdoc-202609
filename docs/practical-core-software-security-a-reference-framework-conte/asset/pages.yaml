    During the final phase of the SDL security review of the software being assessed,
    all of the security activities performed during the process, including threat
    models, tools outputs, and performance against requirements defined early in the
    process will be assessed to determine whether the software product is ready for
    release and shipping. We will discuss the three options that can occur as part
