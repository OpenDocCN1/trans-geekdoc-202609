    team which code to look at first and with the most scrutiny will also help the
    team to understand existing security threats in relation to the software’s functionality.


    +   - The various automated tools described above are used to assess the code
    for semantic and language security vulnerabilities and to optimize the search
    for the highest risk and the greatest effort to fix or mitigate.


