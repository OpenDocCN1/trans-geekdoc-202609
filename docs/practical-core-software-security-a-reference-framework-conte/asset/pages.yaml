    # 9.4.2.3 SDL Touchpoints


    SDL touchpoints include those practices associated with the analysis and assurance
    of particular software development artifacts and processes. All software security
    methodologies include these practices.


    The SDL touchpoints domain is probably the most familiar of the four domains.
    This domain includes essential software security best practices that are integrated
    into the SDLC. The two most important software security practices are architecture
    analysis and code review.


    Architecture analysis encompasses capturing software architecture in concise diagrams,
    applying lists of risks and threats, adopting a process for review (such as STRIDE
    or architectural risk analysis), and building an assessment and remediation plan
    for the organization.


    The code review practice includes the use of code review tools, development of
    customized rules, profiles for tool use by different roles (e.g., developers versus
    analysts), manual analysis, and tracking/measuring results. The security testing
    practice is concerned with prerelease testing, including integrating security
    into standard QA processes. This practice includes the use of black box security
    tools (including fuzz testing) as a smoke test in QA, risk-driven white box testing,
    application of the attack model, and code coverage analysis. Security testing
    focuses on vulnerabilities in construction.


    # 9.4.3 Deployment


    Deployment includes those practices that interface with traditional network security
    and software maintenance organizations. Software configuration, maintenance, and
    other environmental issues have direct impacts on software security.


    By contrast, in the deployment domain, the penetration testing practice involves
    more standard outside-in testing of the sort carried out by security specialists.
    Penetration testing focuses on vulnerabilities in the final configuration and
    provides direct feeds to defect management and mitigation. The software environment
    practice concerns itself with operating system and platform patching, web application
    firewalls, installation and configuration documentation, application monitoring,
    change management, and, ultimately, code signing. Finally, the configuration management
    and vulnerability management practice is concerned with patching and updating
    applications, version control, defect tracking and remediation, and incident handling.'
