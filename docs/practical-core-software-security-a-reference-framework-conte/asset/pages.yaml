- pgno: 229
  md: '+   - **Deployment** entails the processes and activities related to how an
    organization manages the release of software that has been created. This can involve
    shipping products to end users, deploying products to internal or external hosts,
    and normal operations of software in the runtime environment.


    Objectives under each of the 12 practice areas define how each practice can be
    improved over time and establish a maturity level for any given area. The four
    *maturity levels* for a practice correspond to:


    +   0: Implicit starting point with the practice unfulfilled

    +   1: Initial understanding and ad hoc provision of the practice

    +   2: Increase efficiency and/or effectiveness of the practice

    +   3: Comprehensive mastery of the practice at scale


    # ## 9.3.2.2 Core Practice Areas


    In this section, we''ll break down each of the practice areas into specific practices
    within it.


    # ### Governance Core Practice Areas


    +   - **Strategy and Metrics (SM)** involves the overall strategic direction of
    the software assurance program and the instrumentation of processes and activities
    to collect metrics about an organization''s security posture.


    +   - **Policy and Compliance (PC)** involves setting up a security and compliance
    control and audit framework throughout an organization to achieve increased assurance
    in software under construction and in operation.


    +   - **Education and Guidance (EG)** involves increasing security knowledge among
    personnel in software development through training and guidance on security topics
    relevant to individual job functions.


    # ### Construction Core Practice Areas


    +   - **Threat Assessment (TA)** involves accurately identifying and characterizing
    potential attacks on an organization''s software in order to better understand
    the risks and facilitate risk management.


    +   - **Security Requirements (SR)** involve promoting the inclusion of security-related
    requirements during the software development process in order to specify correct
    functionality from inception.


    +   - **Secure Architecture (SA)** involves bolstering the design process with
    activities to promote secure-by-default designs and control over technologies
    and frameworks on which software is built.


    # ### Verification Core Practice Areas


    +   - **Design Review (DR)** involves inspection of the artifacts created from
    the design process to ensure the provision of adequate security mechanisms and
    adherence to an organization''s expectations for security.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - **Code Review (CR)** involves the assessment of an organization’s source
    code to aid vulnerability discovery and related mitigation activities as well
    as establish a baseline for secure coding expectations.


    +   - **Security Testing (ST)** involves testing the organization’s software in
    its runtime environment in order to both discover vulnerabilities and establish
    a minimum standard for software releases.


    # Deployment Core Practice Areas


    +   - **Vulnerability Management (VM)** involves establishing consistent processes
    for managing internal and external vulnerability reports to limit exposure and
    gather data to enhance the security assurance program.


    +   - **Environment Hardening (EH)** involves implementing controls for the operating
    environment surrounding an organization’s software to bolster the security posture
    of applications that have been deployed.


    +   - **Operational Enablement (OE)** involves identifying and capturing security-relevant
    information needed by an operator to properly configure, deploy, and run an organization’s
    software.


    # 9.3.2.3 Levels of Maturity


    Each core practice area is further detailed with a defined level of maturity using
    the following structure:


    +   - Objective

    +   - Activities

    +   - Results

    +   - Success Metrics

    +   - Costs

    +   - Personnel

    +   - Related Levels


