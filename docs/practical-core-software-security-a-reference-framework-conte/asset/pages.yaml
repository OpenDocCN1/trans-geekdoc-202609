  md: '# 9.3.2.3.8 Assurance


    Because the 12 practices are each a maturity area, the successive objectives represent
    the “building blocks” for any assurance program. OpenSAMM is designed for use
    in improving an assurance program in phases by:


    +   - Selecting security practices to improve in the next phase of the assurance
    program.

    +   - Achieving the next objective in each practice by performing the corresponding
    activities at the specified success metrics.


    # 9.3.2.4 Using OpenSAMM to Assess Maturity Levels


    Each security practice also includes an assessment worksheet, with the answers
    indicating the current level of maturity for that practice. A sample assessment
    worksheet extract for the education and guidance (EG) activities is shown in Figure
    9.4.


    Based on the scores assigned to each security practice, an organization can create
    a scorecard to capture those values. Functionally, a scorecard can be the simple
    set of 12 scores for a particular time. However, selecting a time interval over
    which to generate a scorecard facilitates the understanding of overall changes
    in the assurance program during the time frame.


    Using interval scorecards is encouraged for several situations:


    +   - Gap analysis

    +     - Capturing scores from detailed assessments versus expected performance
    levels.

    +   - Demonstrating improvement

    +     - Capturing scores from before and after an iteration of assurance program
    build-out.

    +   - Ongoing measurement

    +     - Capturing scores over consistent time frames for an assurance program
    that is already in place.


    One of the main uses of OpenSAMM is to help organizations build software security
    assurance programs. That process is straightforward and generally begins with
    an assessment to determine if the organization is already performing some security
    assurance activities.


    Several roadmap templates for common types of organizations are provided. Thus,
    many organizations can choose an appropriate match and then tailor the roadmap
    template to their needs. For other types of organizations, it may be necessary
    to build a custom roadmap. Roadmap templates are provided for:


    +   - Independent software vendors

    +   - Online service providers

    +   - Financial services organizations

    +   - Government organizations


    These organization types were chosen because:


    +   - They represent common use cases.'
