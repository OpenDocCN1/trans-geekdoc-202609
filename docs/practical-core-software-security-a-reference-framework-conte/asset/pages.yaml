    been updated since the analysis was performed in Phase 3, updates should be reviewed,
    and changes to the product should be planned accordingly.


    # 6.6 Deliverables


    Table 6.2 lists deliverables for this phase of the SDL.


    # Table 6.2 Deliverables for Phase A4


    | Deliverable | Goal |

    |---|---|

    | Security test execution report | Review progress against identified security
    test cases |

    | Updated policy compliance analysis | Analysis of adherence to company policies
    |

    | Privacy compliance report | Validation that recommendations from privacy assessment
    have been implemented |

    | Security testing reports | Findings from different types of security testing
    |

    | Remediation report | Provide status on the security posture of product |


    # Security Test Execution Report


    The execution report should provide the status of the executed security tests
    and the frequency of tests. The report should also provide information on the
    number of retests performed to validate the remediation of issues.


    # Updated Policy Compliance Analysis


    Policy compliance analysis artifacts (see Chapters 4 and 5) should be updated
    based on any new requirements or policies that might have come up during this
    phase of the SDL.


    # Privacy Compliance Report


    The privacy compliance report should provide progress against privacy requirements
    provided in earlier phases. Any outstanding requirement should be implemented
    as soon as possible. It is also prudent to assess any changes in laws/regulations
    to identify (and put on a roadmap) any new requirements.


    # Security Testing Reports


    A findings summary should be prepared for each type of security testing: manual
    code review, static analysis, dynamic analysis, penetration testing, and fuzzing.
    The reports should provide the type and number of issues identified and any consistent
    theme that can be derived from the findings. For example, suppose there are far
    fewer XSS issues in one component of the'
