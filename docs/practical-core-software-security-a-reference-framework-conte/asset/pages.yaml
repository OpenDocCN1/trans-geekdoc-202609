  md: '# # Chapter 4


    # # Architecture (A2): SDL Activities and Best Practices


    # ## CHAPTER OVERVIEW


    During the second phase of the security development lifecycle (SDL), security
    considerations are brought into the software development life cycle (SDLC) to
    ensure that all threats, requirements, and potential constraints on functionality
    and integration are considered.


    # ## CHAPTER TAKE-AWAYS


    +   - Explore the practices that compose the Architecture (Phase A2) of the security
    development lifecycle (SDL).

    +   - Document the key success factors for completion of Phase A2.

    +   - Create initial, draft deliverables for Phase A2 for the case study in Appendix
    A.

    +   - Prepare a threat model for the case study in Appendix A.


    Figure 4.1 illustrates the Architecture (A2) phase of the SDL in preparation for
    planning future SDL activities. At this stage of the SDL, security is looked at
    more in terms of business risks, with inputs from the software security group
    and discussions with key stakeholders in the SDLC. Business requirements are defined
    in the security terms of confidentiality, integrity, and availability, and needed
    privacy controls are discussed for creation, transmission, and personally identifiable
    information (PII). SDL policy and other security or privacy compliance requirements
    are also identified at this stage of the SDL. This ensures that security and privacy
    discussions are performed as part of, rather than separate from, the SDLC, so
    that there are solid understandings among project personnel about business decisions
    and their risk implications for the overall development project. A cost analysis
    for development and support costs required for security and privacy consistent
    with business needs is also done as part of the'
