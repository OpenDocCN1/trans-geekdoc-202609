    # 9.4.6 The BSIMM Community


    The 130 firms participating in BSIMM form the community. A private online community
    platform with nearly 600 members provides software security personnel a forum
    to discuss solutions with others who face the same issues, refine strategy with
    someone who has already addressed an issue, seek out mentors from those further
    along a career path, and band together to solve hard problems. Community members
    also receive exclusive access to topical webinars and other curated content. The
    BSIMM community also hosts annual private conferences during which representatives
    from each firm gather in an off-the-record forum to discuss software security
    initiatives.


    # 9.4.7 Conducting a BSIMM Assessment


    The BSIMM document is published under the Creative Commons Attribution-Share Alike
    3.0 License, and you can use the documentation to conduct your own assessment
    for internal purposes. If you want your firm''s data and outcomes included in
    the BSIMM data pool that''s used for updating BSIMM, you''ll need a contract with
    Synopsys to conduct an official assessment and report.


    In preparation for that formal assessment, you''ll need to consider which application
    development teams to engage for the interviews. BSIMM assessments are conducted
    as a series of interviews with subject matter experts (SMEs) and knowledgeable
    people in your organization who are involved with your software security initiative.
    You can slice the potential assessment population into any cross sections that
