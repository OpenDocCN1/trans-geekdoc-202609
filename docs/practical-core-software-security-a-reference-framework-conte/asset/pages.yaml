- pgno: 219
  md: '# Chapter 9


    # Adapting Our Reference Framework to Your Environment


    # CHAPTER OVERVIEW


    Software is determined to be secure as a result of an analysis of how the program
    is to be used, under what conditions, and the security requirements it must meet
    in the environment in which it is to be deployed. The security development lifecycle
    (SDL) must also extend beyond the release of the product. Therefore, if the assumptions
    underlying the software and their previously implied requirements do not hold
    in an unplanned operational environment, the software may no longer be secure,
    and the SDL process may need to start over, in part or as a whole, if a complete
    product redesign is required. In this sense, we have established the need for
    accurate and meaningful security requirements and the metrics to govern them,
    as well as examples of how to develop them. It is also assumed that the security
    requirements are not all known prior to the development process, and we have described
    the process by which they are derived, analyzed, and validated.


    # CHAPTER TAKE-AWAYS


    +   - Adapt your SDL to include key deliverables, metrics, and measurement tools
    for sustaining growth and operation.

    +   - Examine the two leading SDL maturity models—OWASP’s Security Assurance Maturity
    Model (SAMM)™ and Synopsys’s Building Security In Maturity Model (BSIMM).

    +   - Apply a seven-step recipe for detailed threat modeling and design vulnerability
    remediation techniques.

    +   - Learn how to apply the MITRE ATT&CK® and D3FEND® knowledge bases to your
    threat management practices.

    +   - Determine how to adapt your SDL to future growth, expansion, and roadmaps
    for establishing maturity levels over time.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Software executives, leaders, and managers must support the robust coding practices
    and necessary security enhancements as required by a business-relevant SDL as
    well as supporting the staffing requirements, scheduling, budgeting, and resource
    allocations required for this type of work. We have described the process, requirements,
    and management of metrics for people in these roles so that they can accurately
    assess the impact and resources required for an SDL that is relevant to and will
    work best in their organization and environment. Our approach has been designed
    from real-life, on-the-ground challenges and experiences, and we have described
    how to think about issues in order to develop effective approaches and manage
    them as a business process.


    One style of SDL isn''t relevant to all environments. What we have done in this
    book is provide you with a detailed framework in a Waterfall-type format that
    provides lists from which you can pick and choose to meet the needs of your environment
    or for full or partial (upgrade) software development needs. We will start this
    chapter with an overview of the top four environments you are likely to deploy
    your SDL in; then, we will summarize the key elements of our SDL reference framework
    as well as the top maturity models you are likely to build your SDL around, some
    final thoughts on enhancing your threat modeling practice as part of the SDL,
    and, finally, guidance on pulling it all together.


    # 9.1 Overview of the Top Four Environments in Which You Are Likely to Deploy
    Your SDL


    You can “build your own” SDL to build security into a process that is appropriate
    for your specific needs and environment, whether it be Agile, DevOps, Cloud, Digital
    Enterprise, or a combination of two or more of these. Each environment is described
    below.


    # 9.1.1 Agile


    Agile software development refers to software development life cycle (SDLC) methodologies
    based on the idea of iterative development, in which requirements and solutions
    evolve through collaboration between self-organizing, cross-functional teams.
    Agile development is designed to enable teams to deliver value faster, with greater
    quality and predictability and greater abilities to respond to change.¹


    Scrum and Kanban are the dominant implementations of Agile, and Scrum is the one
    most often found in software development organizations. There’s Agile/Scrum as
    a formal, strict, tightly controlled process, and then there’s Agile/Scrum as
    it’s implemented in the real world. Implementation of Agile will vary from the
    fundamentalist and purist views to various elements that appear as Agile-like
    processes, and everything in between. It’s less important HOW it’s implemented
    in your environment than it is to understand WHAT your specific implementation
    means to your SDL.


    # 9.1.2 DevOps


    With the successful rise and proof of the viability of Scrum to speed up software
    development, further changes made to speed up HOW software is deployed came on
    the scene with the marriage of development and operations.'
