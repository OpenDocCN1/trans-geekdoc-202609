    # 7.7 Key Success Factors


    The success of this fifth phase of the SDL depends on the final review of policy
    compliance, comprehensive vulnerability scanning and penetration testing, and
    final security and privacy reviews. Table 7.1 lists key success factors for this
    phase, as discussed below.


    | Key Success Factor | Description |

    | :--- | :--- |

    | 1. Policy compliance analysis | Final review of security and compliance requirements
    during the development process |

    | 2. Vulnerability scanning | Scanning of the software stack for identifying security
    issues |

    | 3. Penetration testing | Exploiting any/all security issues on the software
    stack |

    | 4. Open-source licensing review | Final review of open-source software used
    in the stack |

    | 5. Final security review | Final review of compliance against all security requirements
    identified during the SDL cycle |

    | 6. Final privacy review | Final review of compliance against all privacy requirements
    identified during the SDL cycle |

    | 7. Customer engagement framework | The framework that defines the process for
    sharing security-related information with customers |


    # Success Factor 1: Policy Compliance Analysis


    If any new security requirements have been identified (based on threats or updates
    to policies), they need to be vetted for the feasibility of implementation so
    late in the development process. Some requirements may not make it into the product,
    whereas others might be important enough to delay the release date.


    # Success Factor 2: Vulnerability Scanning


    Vulnerability scanning and security configuration validation provide one final
    opportunity to identify and remediate security issues across the software stack.
    Vulnerability scanning and security configuration validation should include assessments
    from different vantage points (external, internal, and authenticated). It should
    also cover all layers in the stack, from the operating system to applications.


    # Success Factor 3: Penetration Testing


    Ensuring that there is no confusion between penetration testing and vulnerability
    scanning is essential. Vulnerability scanning provides a list of validated security
    findings. Penetration testing goes one step further and is more of an attack simulation
    on your target environment.'
