- pgno: 189
  md: 'The outcome often depends on the penetration testers’ skills, imagination,
    and experience. Vulnerability scanning feeds into penetration testing.


    # Success Factor 4: Open-Source Licensing Review


    Final review of open-source software that ensures all licensing requirements have
    been met is essential to mitigate legal liability. It also enables the identification
    of technologies that need to feed into a different type of security testing (vulnerability
    scanning and penetration testing).


    # Success Factor 5: Final Security Review


    It is critical that a final security review be performed before this phase of
    the SDL ends. If all requirements are met, then security can say “Go” without
    any exceptions. If there are exceptions to security requirements, they must be
    well documented and time-bound. An example is a “conditional go,” under which
    unmet requirements do not stop release but will be remediated by an agreed-upon
    date.


    # Success Factor 6: Final Privacy Review


    Similar to Factor 5, this step allows final review of the product against privacy
    requirements laid out at the start of the cycle and that have been updated or
    refined since then. If any requirements are unmet, they should be documented as
    time-bound exceptions and require remediation by a definite date.


    # Success Factor 7: Customer Engagement Framework


    As discussed earlier in the chapter, it is important that a framework be defined
    to engage customers in security-related discussions both during and after the
    sale process. This can limit ad hoc requests and escalations from customers and
    give them confidence that your company has a handle on security.


    # 7.8 Deliverables


    Table 7.2 lists deliverables for this phase of the SDL.


    # Table 7.2 Deliverables for Phase A5


    | Deliverable | Goal |

    |---|---|

    | Updated policy compliance analysis | Analysis of adherence to company policies
    |

    | Security testing reports | Findings from different types of security testing
    in this phase of the SDL |

    | Remediation report | Provide status on the security posture of product |

    | Open-source licensing review report | Review of compliance with licensing requirements
    if open-source software is used |

    | Final security and privacy review reports | Review of compliance with security
    and privacy requirements |

    | Customer engagement framework | Detailed framework to engage customers during
    different stages of the product life cycle |'
