- pgno: 129
  md: '# 5.1 A3 Policy Compliance Analysis


    A3 policy compliance analysis is a continuation of the A2 policy compliance review
    described in Chapter 4. During this phase, any policy that exists outside the
    domain of the SDL policy is reviewed. These might include policies from outside
    the development organization that set security and privacy requirements and guidelines
    to be adhered to when developing software or applications. Corporate security
    and privacy policies will likely instruct designers and developers on what the
    security and privacy features need to be and how they must be implemented. Other
    policies might focus on third-party and open-source software used as part of a
    software product, or on the protection and control of source code and other intellectual
    property within and outside the organization. Assuming the software security group
    is separate from the centralized information security group, it is important that
    both groups collaborate on all policies and guidelines related to the development
    and post-release security support and response of software from that organization.
    It is also important to collaborate with the privacy function of your company,
    whether it is a centralized group or outside legal counsel.


    # 5.2 Security Test Plan Composition


    Testing activities validate the secure implementation of a product, which reduces
    the likelihood of security bugs being released and discovered by customers and/or
    malicious users. Software assurance and competency from a security perspective
    is demonstrated by security testing and the use of artifacts, reports, and tools.
    The goal is not to test for insecurity but rather to validate the robustness and
    security of the software products before making the product available to customers.
    These security testing methods do find security bugs, especially in products that
    may not have undergone critical secure development process changes. The results
    of security testing and evaluation may also uncover deficiencies in the security
    controls used to protect the software that is under development. A detailed plan
    of action and milestone schedule are required to document the corrective measures
    planned to increase the effectiveness of the security controls and provide the
    requisite security for the software prior to its release.


    As with the risk analysis methodologies discussed in Chapter 4, a holistic approach
    is necessary for security testing to be effective. Security testing confirms that
    the software complies with security requirements through design and code analysis
    and software behavior investigation. In other words, security testing is conducted
    to demonstrate that the software functions as specified by the requirements, and
    every software requirement must be tested using at least one relevant test case.
    The number of requirements tested versus the total number of requirements can
    be traced from test cases to functional requirements; then the ratio of requirements
    tested to the total number of requirements will become a test requirement metric.


    Another element of security testing is to identify software weaknesses so that
    security violations and noncompliance with security requirements that could cause
    the software to fail or be out of compliance with any of software security requirements
    are avoided. As discussed in the risk analysis ranking section, due to resource
    limitations, security test plan efforts typically focus only on software requirement
    items that are considered to be critical. A master test plan is used to outline
    the entire test process and is augmented by detailed test plans for individual
    test stages and individual modules.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Although traditional requirements-based testing is important for the correctness
    and adequacy of security functions implemented by software, no amount of testing
    can fully demonstrate that software is free from vulnerabilities; any such testing
    can only provide a small-scale view of what is needed to verify the security of
    the software. Even the most robustly specified security requirements are not likely
    to address all possible conditions under which the software may be forced to operate
    in the real world, including the behavior of software under anomalous and hostile
    conditions.


    Generally, the shortcomings of requirements-based over risk-based software security
    testing can be summarized as follows:


    +   - The changing nature of threats to the software you have in development may
    result in new attack methodologies, both pre- and post-release.

    +   - Your software may change its position as a functional component of an SaaS-
    or cloud-based solution, which changes the attack surface, thus requiring new
    security fixes or mitigations.

    +   - In today''s competitive and rapidly changing environment, the design assumptions
    on which the requirements were based may be obsolete by the time the software
    is ready for testing.

    +   - Other factors change frequently and likely more rapidly than your specification
    can keep up.

    +   - If the software is going to use components acquired from a third party,
    the original architecture may not account for future versions that were not planned
    for in the initial implementation.

    +   - The original design assumptions may not account for vulnerability susceptibilities
    due to design changes or new external attacker capabilities or exploits that may
    occur during the time taken to develop later versions of the software.


    This list highlights why software risk-based security testing as described in
    this section should always augment traditional requirements-based testing.


    As mentioned previously and used as a continuing theme throughout this book, problems
    found early in the software life cycle by “building security in” are significantly
    easier and less costly to correct than problems discovered post-implementation
    or, worse, post-deployment. This is why it is imperative that a disciplined approach
    to security reviews and tests begin early in the software development life cycle
    (SDLC) process and continue post-release until the software reaches end of life.


    Software security testing takes the perspective that the tester is the attacker.
    Test scenarios should be based on misuse and abuse possibilities developed through
    the methodologies and threat modeling described in Chapter 4 and should incorporate
    both known attack patterns as well as anomalous interactions that seek to invalidate
    assumptions made by and about the software and its environment. Comprehensive
    test scenarios, test cases, and test oracles should be derived. Be sure that all
    that misuse cases developed in the previous stage are executed and thoroughly
    tested. The testing of each development iteration, use case, and misuse case will
    identify major design flaws early in the SDL and should catch up to 95 percent
    of defects well before the last phase.1


    The test environment should duplicate as closely as possible the anticipated execution
    environment in which the software will be deployed, and it should be kept entirely
    separate'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'from the development environment. It should also provide for strict configuration
    management control to prevent tampering or corruption of test data, testing tools,
    and the integrated test environment, as well as the test plan itself and both
    the raw and finalized test results. It is also important to ensure that each tool
    set and test technique is appropriate for the individual software vulnerabilities
    that are being tested.


    Testing for both functionality and security requires execution of the code and
    validation/verification of the results. It is also not always automated, because
    human intervention by experienced software security architects is typically needed.
    Because of the complexities and interactions of software ecosystems such as SaaS
    or cloud environments, the knowledge of such experts is required so that a wider
    range of scenarios can be tested.


    As mentioned previously, the test plan lays out what needs to be tested for functionality,
    protected for security, and how the application will react to specific attacks.
    The test plan is a joint effort by the project management, development, and security
    teams, among others, to specify the logistics of the test plan, including who
    will execute the testing and when testing will begin and end.


    The following are common steps that can be used to implement a test plan regardless
    of the strategy, framework, or standard being used:


    +   • **Define test scripts.** Scripts are very detailed, logical steps of instructions
    that tell a person or tool what to do during the testing. Functional testing scripts
    are step-by-step instructions that depict a specific scenario or situation that
    the use case will encounter as well as the expected results. Secure testing scripts
    are scripts created specifically to test the security of the application. The
    basis for these scripts comes from the threat models that were generated during
    the design phase. Misuse cases define what needs to be protected (assets) and
    what types of attacks can gain access to those assets. Secure test scripts define
    the acts of carrying out those attacks.


    +   • **Define the user community.** Defining the user community helps testers
    identify acceptable levels of failures and risk.


    +   • **Identify the showstoppers.** Defining the must-haves and the “what-if-available”
    scenarios should be in the use case. If not, a revisit to the requirements might
    be necessary so that these specifications can be documented.


    +   • **Identify internal resources.** Internal resources come from the company’s
    organization, including developers, analysts, software tools, and sometimes project
    managers.


    +   • **Identify external resources.** External resources are tools or people
    who are hired on a temporary basis to come into a project, test the application,
    and report findings. External resources are best suited for security testing because
    they typically come highly trained in secure programming techniques and they are
    far removed from the code and any internal politics. If external resources are
    needed, the test plan needs to answer the following questions: (1) What are they
    going to test? (2) To whom will they report? and (3) With whom will they be working?²


    Assessing the security properties and behaviors of software as it intersects with
    external entities such as human users, the environment, and other software and
    as its own components interact with each other is a primary objective of security
    testing. As such, it should verify that software exhibits the following properties
    and behaviors:'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   - Its behavior is predictable and secure.

    +   - It exposes no vulnerabilities or weaknesses.

    +   - Its error- and exception-handling routines enable it to maintain a secure
    state when confronted by attack patterns or intentional faults.

    +   - It satisfies all of its specified and implicit nonfunctional security requirements.

    +   - It does not violate any specified and implicit nonfunctional security requirements.

    +   - It does not violate any specified security constraints.

    +   - As much of its runtime interpretable source code and byte code as possible
    has been obscured or obfuscated to deter reverse engineering.3,4


    A security test plan should be included in the overall software test plan and
    should define all security-related testing activities, including the following:


    +   - Security test cases or scenarios (based on abuse cases)

    +   - Test data, including attack patterns

    +   - Test oracle (if one is to be used)

    +   - Test tools (white box, black box, static, and dynamic)

    +   - Analysis to be performed to interpret, correlate, and synthesize the results
    from the various tests and outputs from the various tools5,6


    Software security testing techniques can be categorized as white box, gray box,
    or black box:


    +   - **White box.** Testing from an internal perspective, that is, with full
    knowledge of the software internals; the source code, architecture and design
    documents, and configuration files are available for analysis.

    +   - **Gray box.** Analyzing the source code for the purpose of designing the
    test cases, but using black-box testing techniques; both the source code and executable
    binary are available for analysis.

    +   - **Black box.** Testing the software from an external perspective, that is,
    with no prior knowledge of the software; only binary executable or intermediate
    byte code is available for analysis.7,8


    The commonly used security testing techniques can be categorized using the above
    as follows:


    +   - **Source-code analysis (white box).** Source-code security analyzers examine
    source code to detect and report software weaknesses that can lead to security
    vulnerabilities. The principal advantage that source-code security analyzers have
    over the other types of static analysis tools is the availability of the source
    code. The source code contains more information than code that must be reverse
    engineered from byte code or binary. Therefore, it is easier to discover software
    weaknesses that can lead to security vulnerabilities. Additionally, if the source
    code is available in its original form, it will be easier to fix any security
    vulnerabilities that are found.

    +   - **Property-based (white box).** Property-based testing is a formal analysis
    technique developed by the University of California—Davis. Property-based testing
    validates that the software''s implemented functionality satisfies its specifications.
    It does this by examining'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'security-relevant properties revealed by the source code, such as the absence
    of insecure state changes. Then these security-relevant properties in the code
    are compared against the software’s specification to determine if the security
    assumptions have been met.


    +   - **Source-code fault injection (white box, gray box).** Fault injection is
    a technique used to improve code coverage by testing all code paths, especially
    error-handling code paths that may not be exercised during functional testing.
    In fault injection testing, errors are injected into the software to simulate
    unintentional attacks on the software through its environment, and attacks on
    the environment itself. In source-code fault injection, the tester decides when
    environment faults should be triggered. The tester then “instruments” the source
    code by non-intrusively inserting changes into the program that reflect the changed
    environment data that would result from those faults. The instrumental source
    code is then compiled and executed, and the tester observes the ways in which
    the executing software’s state changes when the instrumental portions of code
    are executed. This allows the tester to observe the secure and nonsecure state
    changes in the software resulting from changes in its environment. The tester
    can also analyze the ways in which the software’s state change results from a
    fault propagating through the source code. This type of analysis is typically
    referred to as fault propagation analysis and involves two techniques of source-code
    fault injection: extended propagation analysis and interface propagation analysis.


    +   - **Dynamic code analysis (gray box).** Dynamic code analysis examines the
    code as it executes in a running application, with the tester tracing the external
    interfaces in the source code to the corresponding interactions in the executing
    code, so that any vulnerabilities or anomalies that arise in the executing interfaces
    are simultaneously located in the source code, where they can be fixed. Unlike
    static analysis, dynamic analysis enables the tester to exercise the software
    in ways that expose vulnerabilities introduced by interactions with users and
    changes in the configuration or behavior of environmental components. Because
    the software is not fully linked and deployed in its actual target environment,
    the testing tool essentially simulates these interactions and their associated
    inputs and environment conditions.


    +   - **Binary fault injection (gray box, black box).** Binary fault injection
    is a runtime analysis technique whereby an executing application is monitored
    as faults are injected. By monitoring system call traces, a tester can identify
    the names of system calls, the parameters to each call, and the call’s return
    code. This allows the tester to discover the names and types of resources being
    accessed by the calling software, how the resources are being used, and the success
    or failure of each access attempt. In binary fault analysis, faults are injected
    into the environment resources that surround the application.


    +   - **Fuzz testing (black box).** Fuzzing is a technique that is used to detect
    faults and security-related bugs in software by providing random inputs (fuzz)
    to a program. As opposed to static analysis, where source code is reviewed line
    by line for bugs, fuzzing conducts dynamic analysis by generating a variety of
    valid and invalid inputs to a program and monitoring the results. In some instances,
    the result might be the program crashing.


    +   - **Binary code analysis (black box).** Binary code scanners analyze machine
    code to model a language-neutral representation of the program’s behaviors, control
    and data flows, call trees, and external function calls. Such a model may then
    be traversed by an automated vulnerability scanner in order to locate vulnerabilities
    caused by common coding errors'
