    # ## 5.6 Key Success Factors and Metrics


    # ### 5.6.1 Key Success Factors


    The success of this third phase of the SDL depends on a security test plan, design
    security analysis review, and privacy implementation assessment. It is during
    this phase that a plan for the rest of the SDL process, from implementation to
    testing, is built. Table 5.1 lists key success factors for this third phase.


    # ### Table 5.1 Key Success Factors


    | Key Success Factor | Description |

    |---|---|

    | 1. Comprehensive security test plan | Mapping types of security testing required
    at different stages of SDLC |

    | 2. Effective threat modeling | Identifying threats to the software |

    | 3. Design security analysis | Analysis of threats to various software components
    |

    | 4. Privacy implementation assessment | Efforts required for the implementation
    of privacy-related controls based on assessment |

    | 5. Policy compliance review (updates) | Updates for policy compliance as related
    to Phase 3 |


    # ### Success Factor 1: Comprehensive Security Test Plan


    During this phase, security architects and the assessment team define various
    aspects of the software that need to be tested and the types of testing that need
    to be scheduled and planned both before and after the release of the software.
    The security test plan should map code development phases to the type of testing.
    For example, with every check-in–associated static analysis, a comprehensive static
    analysis is a must after the final code commit. Once the software enters the pre-release
    cycle, vulnerability assessments, gray box testing, and binary testing should
    be scheduled. One of the most critical success factors of this phase and the overall
    SDL is that the security test plan can eliminate most security vulnerabilities
    before the product is deployed.


    # ### Success Factor 2: Effective Threat Modeling


    If a new threat or attack vectors are identified during this phase, the threat
    model and artifacts need to be updated to make sure the risk mitigation plan is
    comprehensive.


    # ### Success Factor 3: Design Security Analysis


    Along with the accuracy of security test plans, a software design review from
    a security viewpoint is perhaps the most crucial success factor during the first
    three phases of the SDL. It is'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'essential to minimize the attack surface and improve design principles to reduce
    the severity of any security flaws that may be missed in the code.


    # Success Factor 4: Privacy Implementation Assessment


    It is imperative that your estimate of work required in adhering to privacy policies
    and practices, both within the company and outside it, is as accurate as possible.
    This will enable significant cost savings down the road. For example, if privacy
    practices require that PII data be encrypted across the board, it is critical
    that this need be identified during the design phase. Once the software is in
    the execution and release stages, it is often cost-prohibitive. The authors have
    seen Fortune 500 companies where such decisions are taken during service pack
    release. By then, however, it is extremely difficult to fix the problem accurately.
    It is also very expensive. Another example of the problem is network segmentation.
    In a cloud/SaaS-based environment, this is an important decision to make. Often
    there will be multiple products hosted out from this shared environment. How to
    best protect one product from another is an important question for the design
    phase.


    # Success Factor 5: Policy Compliance Review (Updates)


    If existing policies are updated, or additional policies are identified, it is
    a good idea to review compliance against the new set of requirements. An example
    of an updated policy might be the inclusion of any remaining privacy-related policies
    or forward-looking strategies.


    # 5.6.2 Deliverables


    Table 5.2 lists deliverables for this phase of the SDL.


    # Table 5.2 Deliverables for Phase A3


    | Deliverable | Goal |

    |---|---|

    | Updated threat modeling artifacts | Data flow diagrams, elements, threat listing
    |

    | Design security review | Modifications to the design of software components
    based on security assessments |

    | Security test plans | Plan to mitigate, accept, or tolerate risk |

    | Updated policy compliance analysis | Analysis of adherence to company policies
    |

    | Privacy implementation assessment results | Recommendations from privacy assessments
    |


    # Updated Threat Modeling Artifacts


    Updated data flow diagrams (DFDs), a technical threat modeling report, a high-level
    executive threat modeling report, threat lists, and recommendations for threat
    analysis based on any new requirements/inputs to attack vectors that need to be
    created.


    # Design Security Review


    This is a formal specification that lists changes to software components and design
    based on a review from security architects and the assessments team.'
  merge: -1
  img_proc: true
