    are generally not well received by software development teams. The best place
    to introduce the security design and architecture review is when the team is engaged
    in the functional design and architecture review of the software.


    Learning to see your network through the eyes of your adversaries is an important
    part of the risk analysis and hardening process. Risk analysis involves identifying
    assets and the threats to these assets, and hardening is about how to protect
    your assets. A risk analysis and hardening process can range in character from
    overly rigorous to very casual and informal. Practical risk analysis and hardening
    lies somewhere in between these two extremes.


    What follows is a recipe to perform a practical risk analysis and get a hardening
    plan started. It’s not intended to be perfect or comprehensive—it’s intended to
    be practical.


    # 9.5.1 Practical Threat and Application Risk Modeling


    Threat modeling includes determining the attack surface of the software by examining
    its functionality for trust boundaries, entry points, data flow, and exit points.
    Threat models are only useful once the design documentation that represents the
    entire application’s architecture is'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'more or less finalized, so that the threat model is based on the intended,
    likely future of the software. Threat modeling is useful for ensuring that the
    design complements the security objectives, making trade-off and prioritization-of-effort
    decisions, and reducing the risk of security issues during development and operations.
    Risk assessments of software can be accomplished by ranking the threats as they
    pertain to your organization''s business objectives, compliance and regulatory
    requirements, and security exposures. Once understood and prioritized, those newly
    uncovered threats can then be sent into a phase of planning countermeasures and/or
    changing the design to remove defects.


    Threat modeling is performed during design work so that necessary security controls
    and countermeasures can be defined for the development phase of the software.


    SANS Institute Cyber Defense offers a handy seven-step recipe for conducting Threat
    Modeling and Application Risk Analysis. The recipe is as follows:


    +   Step 1: Make a List of What You''re Trying to Protect

    +   Step 2: Draw a Diagram and Add Notes

    +   Step 3: Make a List of Your Adversaries and What They Want

    +   Step 4: Brainstorm Threats from These Adversaries

    +   Step 5: Estimate Probability and Potential Damage (The Overall Risk)

    +   Step 6: Brainstorm Countermeasures and Their Issues

    +   Step 7: Plan, Test, Pilot, Monitor, Troubleshoot, and Repeat


    Detailed directions for each of these steps is provided at the site, along with
    a spreadsheet template you can use for data collection and analysis.


    # 9.5.1.1 Brainstorming Threats


    Step 4 of the recipe calls for brainstorming threats from your adversaries. One
    of the more popular brainstorming techniques was popularized by Microsoft and
    is called STRIDE. STRIDE is a mnemonic for:


    +   Spoofing

    +   Tampering

    +   Repudiation

    +   Information disclosure

    +   Denial of service

    +   Elevation of privilege


    Section 4.3.3 covers the details for each category of STRIDE. The central idea
    behind STRIDE is that you can classify all your threats according to one of these
    six STRIDE categories. Since each category has a specific set of potential mitigations,
    once you have analyzed the threats, categorized them, and prioritized them, you
    will know how to mitigate or eliminate the defect that could lead to an exploit.


    The STRIDE process is really a brainstorming activity conducted in person or via
    media-sharing channels (e.g., Zoom®, Microsoft Teams®, etc.). Participants use
    the documentation to'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'identify assets in the architecture, their purpose, and their relative value.
    These become the targets for would-be attackers. Next, they identify possible
    attackers and what they would want from the system:


    +   - Who are your actual or likely adversaries?

    +   - What do they want to achieve?

    +   - What are their skills and resources?

    +   - How determined are they?

    +   - What would they be willing to risk or give up to achieve their goals?

    +   - What about insiders?


    As you collect these across projects, you can also build a reusable catalog of
    attack profiles with enough details to make them suitable for anyone who wants
    to conduct threat modeling.


    Next, imagine that you are one of those adversaries and try to see your network
    *through their eyes*. You know what you want; how would you try to get at it by
    misusing the application?


    Just like the product backlog and user stories, a threat model is a living document—as
    you change the design, you need to go back and update your threat model to see
    if any new threats appear.


    # 9.5.1.2 Risk Analysis and Assessment


    For Step 5 of the recipe, we turn to another mnemonic from Microsoft, called DREAD,
    described in Section 4.3.3.4. It scores 5 categories, which are added together
    and divided by 5, yielding a result from 0 to 10, where 0 indicates little or
    no impact and 10 is the house-on-fire situation.


    Other risk analysis considerations include:


    +   - Threats and vulnerabilities that exist in the project’s environment or that
    result from interaction with other systems.

    +   - Code that was created by external development groups in either source or
    object form. It’s vitally important to carefully evaluate any code from sources
    external to your team, including purchased libraries and open-source components
    and libraries that may be present. Failing to do so might cause security vulnerabilities
    the team does not know about or learns about too late.

    +   - Threat models should include all legacy code if the project is a new release
    of an existing program. Such code could have been written before much was known
    about software security and, therefore, likely contains vulnerabilities.

    +   - A detailed privacy analysis to document your project’s key privacy aspects.
    Important issues to consider include:

    +     - What personal data is collected?

    +     - What is the compelling customer value proposition and business justification?

    +     - What notice and consent experiences are provided?

    +     - What controls are provided to both internal and external users of the
    application?

    +     - How is unauthorized access to personal information prevented?'
  merge: -1
  img_proc: true
