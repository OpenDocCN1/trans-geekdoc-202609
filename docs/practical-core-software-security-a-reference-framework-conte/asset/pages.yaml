    +   8. Least common mechanism. This principle states that a minimum number of
    protective mechanisms should be common to multiple users, as shared access paths
    can be sources of unauthorized information exchange. Shared access paths that
    provide unintentional data transfers are known as covert channels. The least common
    mechanism promotes the least possible sharing of common security mechanisms.


    +   9. Psychological acceptability. This refers to the ease of use and intuitiveness
    of the user interface that controls and interacts with the access control mechanisms.
    The user must be able to understand the user interface and use it without having
    to interpret complex instructions.


    +   10. Weakest link. As in the old saying, “A chain is only as strong as its
    weakest link,” the security of an information system is only as good as its weakest
    component. It is important to identify the weakest mechanisms in the security
    chain and layers of defense and improve them so that risks to the system are mitigated
    to an acceptable level.


    +   11. Leveraging existing components. In many instances, the security mechanisms
    of an information system are not configured properly or used to their maximum
    capability. Reviewing the state and settings of the extant security mechanisms
    and ensuring that they are operating at their optimum design points will greatly
    improve the security posture of an information system. Another approach that can
    be used to increase system security by leveraging existing components is to partition
    a system into defended subunits. Then, if a security mechanism is penetrated for
    one subunit, it will not affect the other subunits and damage to the computing
    resources will be minimized.15,16


    Designing good software isn''t easy, and building security in makes it even more
    difficult. Although some software flaws may not matter from a user perspective,
    from a security perspective they may matter because an attacker may be able induce
    failures by setting up the highly specific conditions necessary to trigger a flaw.
    Something that may have had a low probability of happening randomly and dismissed
    as irrelevant may be significant if an attacker can take advantage of it. In the
    summary of Saltzer and Schroeder’s design principles, the principles are stated
    clearly but they lack the success criteria for security. Fortunately, we have
    a general idea of what security looks like and can avoid failure in this area
    by incorporating the long-accepted properties of confidentiality, integrity, and
    availability into the design principles. There are, of course, different views
    of security—from that of a software developer, who may think of security primarily
    in terms of quality; to that of a network administrator, who may think of security
    in terms of firewalls, IDS/IPS systems, incident response, and system management;
    or even those of managers and academics, who may think of security mostly in terms
    of the classic design principles described above or in terms of various security
    models. All of these viewpoints are important in building secure systems and are
    relevant to modeling the overall threat to your software. You must stay focused
    on the ultimate prize when designing security in: the potential exploitation of
    the software you are developing.


    Detailed design artifacts are used to build each software component needed to
