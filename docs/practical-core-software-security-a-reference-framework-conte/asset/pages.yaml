  md: '# 2.10.1 Waterfall Development


    Waterfall development (see Figure 2.11) is another name for the more traditional
    approach to software development. This approach is typically higher risk, more
    costly, and less efficient than the Agile approach that will be discussed later
    in this chapter. The Waterfall approach uses requirements that are already known,
    each stage is signed off before the next commences, and it requires extensive
    documentation because this is the primary communication mechanism throughout the
    process. Although most development organizations are moving toward Agile methods
    of development, the Waterfall method may still be used when requirements are fully
    understood and not complex. Since the plan is not to revisit a phase using this
    methodology once it is completed, it is imperative that you do it right the first
    time: There is generally no second chance.


    Although Waterfall development methodologies vary, they tend to be similar in
    that practitioners try to keep to the initial plan, do not have working software
    until very late in the cycle, assume they know everything upfront, minimize changes
    through a change control board (i.e., assume that change is bad and can be controlled),
    put most responsibility on the project manager (PM), optimize conformance to schedule
    and budget, generally use weak controls, and allow realization of value only upon
    completion. They are driven by a PM-centric approach under the belief that if
    the processes in the plan are followed, then everything will work as planned.
    In today’s development environment, most of the above-mentioned items are considered
    negative attributes of the Waterfall methodology and are just a few of the reasons
    that industry is moving toward Agile development methodologies. The Waterfall
    approach may be looked on as an assembly-line approach, which may be excellent
    when applied properly to hardware but which has shortcomings in comparison to
    Agile when it comes to software development.


    ![](img/a54ed04827050a271316d34985425127_63_0.png)


    Figure 2.11 Waterfall software development methodology.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 2.10.1.1 Iterative Waterfall Development


    The iterative Waterfall development model (see Figure 2.12) is an improvement
    over the standard Waterfall model. This approach carries less risk than a traditional
    Waterfall approach but is more risky and less efficient than the Agile approach.
    In the iterative Waterfall method, the overall project is divided into various
    phases, each executed using the traditional Waterfall method. Dividing larger
    projects into smaller identifiable phases results in a smaller scope of work for
    each phase, and the end deliverable of each phase can be reviewed and improved
    if necessary before moving to the next phase. Overall risk is thus reduced. Although
    the iterative method is an improvement over the traditional Waterfall method,
    you are more likely to face an Agile approach to software development rather than
    either a standard or an iterative Waterfall methodology in today’s environment.


    ![](img/a54ed04827050a271316d34985425127_64_0.png)


    Figure 2.12 Iterative Waterfall software development methodology.


    # 2.10.2 Agile Development


    The Agile approach is based on both iterative and incremental development methods.
    Requirements and solutions evolve through collaboration among self-organizing,
    cross-functional teams, and a solution resulting from every iteration is reviewed
    and refined regularly throughout the process. The Agile method is a timeboxed
    iterative approach that facilitates a rapid and flexible response to change, which
    in turn encourages evolutionary development and delivery while promoting adaptive
    planning, development, teamwork, collaboration, and process adaptability throughout
    the life cycle of the project. Tasks are broken down'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'into small increments that require minimal planning. These iterations have
    short time frames called “timeboxes,” which can last from one to four weeks. Multiple
    iterations may be required to release a product or new features. A cross-functional
    team is responsible for all software development functions in each iteration,
    including planning, requirements analysis, design, coding, unit testing, and acceptance
    testing. An Agile project is typically cross-functional, and self-organizing teams
    operate independently from any corporate hierarchy or other corporate roles of
    individual team members, who themselves decide how to meet each iteration’s requirements.
    This allows the project to adapt to changes quickly and minimizes overall risk.
    The goal is to have an available release at the end of the iteration, and a working
    product is demonstrated to stakeholders at the end of each iteration.


    # 2.10.2.1 Scrum


    Scrum (see Figure 2.13) is an iterative and incremental Agile software development
    method for managing software projects and product or application development.
    Scrum adopts an empirical approach, accepting that the problem cannot be fully
    understood or defined and focusing instead on maximizing the team''s ability to
    deliver quickly and to respond to emerging requirements. This is accomplished
    through the use of co-located, self-organizing teams in which all disciplines
    can be represented. In contrast to traditional planned or predictive methodologies,
    this concept facilitates the ability to handle churn resulting from customers
    that change the requirements during project development. The basic unit of development
    for Scrum is called a “sprint,” and a sprint can last from one week to one month.
    Each sprint is timeboxed so that finished portions of a product are completed
    on time. A prioritized list of requirements is


    ![](img/a54ed04827050a271316d34985425127_65_0.png)


    Figure 2.13 Scrum software development methodology.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'derived from the product backlog, and if they are not completed during the
    sprint, they are left out and returned to the product backlog. The team demonstrates
    the software after each sprint is completed. Generally accepted value-added attributes
    of Scrum include its use of adaptive planning; that it requires feedback from
    working software early during the first sprint (typically two weeks) and often;
    that it stresses the maximization of good change, such as focusing on maximizing
    learning throughout the project; that it puts most responsibility on small, dedicated,
    tight-thinking, adaptive teams that plan and re-plan their own work; that it has
    strong and frequent controls; that it optimizes business value, time to market,
    and quality; and that it supports realization of value earlier, potentially after
    every sprint.


    # 2.10.2.2 Lean Development


    In our experience, for those of you who have recently moved from or are in the
    process of moving from a Waterfall methodology for software development, Scrum
    is the most likely variant of Agile that you will encounter. Lean (see Figure
    2.14) is another methodology that is gaining popularity and is thus worth mentioning.
    Unfortunately, there are many definitions of Lean, and it is a methodology that
    is evolving in many directions. Although Lean is similar to Scrum in that it focuses
    on features rather than groups of features, it takes this idea one step further
    in that, in its simplest form, you select, plan, develop, test, and deploy one
    feature before risk you select, plan, develop, test, and deploy the next feature.
    The objective is to further isolate risk to the level of an individual feature.
    This isolation has the advantage of focusing on eliminating “waste” when possible
    and doing nothing unless it is absolutely necessary or relevant. Lean development
    can be summarized by seven principles based on Lean manufacturing principle concepts:
    (1) eliminate waste, (2) amplify learning, (3) decide as late as possible, (4)
    deliver as fast as possible, (5) empower the team, (6) build integrity in, and
    (7) see the whole. One of the key elements of Lean development is to provide a
    model in which you can see the whole, even when your developers are scattered
    across multiple locations and contractors. Although still considered related to
    Agile by many in the community, Lean software development has evolved into a related
    discipline rather than a specific subset of Agile.


    ![](img/a54ed04827050a271316d34985425127_66_0.png)


    Figure 2.14 Lean software development methodology.'
  merge: -1
