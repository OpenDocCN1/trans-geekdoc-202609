- pgno: 92
  md: 'The user context influences not only the scope of threats and vulnerabilities,
    it may also strongly affect priorities for implementation. For example, if you
    are storing customers’ credit card data in your hosting environment, then the
    threat of data stealing by your internal support staff or employees will be much
    more critical to mitigate then an outside attack from an unknown community. To
    understand this from a practical threat modeling perspective, some of the scenarios
    that you should focus on with regard to this user-centric view include considering
    any possibility that an unauthorized user of your software product could gain
    access, whether there is any possibility that this same unauthorized user could
    escalate their privileges, and whether either an authorized or unauthorized user
    could gain access to admin functions or provide direct access to contents of back-end
    databases and then misuse the authority. One of the worst-case scenarios would
    be an unauthorized user who could compromise the web/front-end server and obtain
    escalated privileges on all resources available on the server; this would provide
    the ability to exploit the trust relation to obtain unauthorized access to critical
    information from access/event logs or configuration files. During the threat modeling
    process, you must always think like an attacker and assume that all inputs to
    your software product could be malicious and that all trust boundaries may be
    breached at the first level—the first interaction layer between the software product
    and the end user.²


    The goal of threat modeling is to gain an understanding of the software application
    by decomposing it and understanding how it interacts with external entities. This
    is achieved by information gathering and documentation into a clearly defined
    structure, which ensures that the correct information is collected. From a security
    perspective, the key goal in threat modeling is to gain an understanding of what
    success looks like, and in order to accomplish that, you need a baseline of security
    success criteria. A useful list of such items appeared in MSDN Magazine in 2006
    and is reproduced here:


    # ## Design Principles


    +   - Open design: Assume the attackers have the sources and the specs.

    +   - Fail-safe defaults: Fail closed; no single point of failure.

    +   - Least privilege: No more privileges than what is needed.

    +   - Economy of mechanism: Keep it simple, stupid.

    +   - Separation of privileges: Don''t permit an operation based on a single condition.

    +   - Total mediation: Check everything, every time.

    +   - Least common mechanism: Beware of shared resources.

    +   - Psychological acceptability: Will they use it?


    # ## Security Properties


    +   - Confidentiality: Data is only available to the people intended to access
    it.

    +   - Integrity: Data and system resources are only changed in appropriate ways
    by appropriate people.

    +   - Availability: Systems are ready when needed and perform acceptably.

    +   - Authentication: The identity of users is established (or you''re willing
    to accept anonymous users).

    +   - Authorization: Users are explicitly allowed or denied access to resources.

    +   - Nonrepudiation: Users can''t perform an action and later deny performing
    it.³'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The key steps involved in threat modeling are as follows:⁴


    +   1. Break down your product architecture using data flow diagrams

    +   2. Use STRIDE threat categories to identify what threats are applicable to
    each element of the data flow diagram.

    +   3. Map all threats with relevant vulnerabilities as applicable in the context
    of the usage scenario.

    +   4. Rank threats. Assign a risk rating to each threat and vulnerability to
    understand the impact; this will help define the priority for fixing. Use DREAD
    or other methodologies.

    +   5. Define the mitigation plan/countermeasures for each of the vulnerabilities
    identified.

    +   6. Fix the vulnerabilities that are not acceptable to the business in order
    of priority as decided in the preceding steps.


    # 4.3.2 Data Flow Diagrams


    The first step of the threat modeling process is to develop a visual representation
    of the threat flows in the form of a diagram typically drawn during a whiteboard
    session. It is important to provide a structure for this process. Providing structure
    helps avoid mistakes. Without a good diagram, you likely won’t have a good threat
    model. It is important to understand, first, that this exercise is about data
    flow and not code flow. This is a mistake often made by developers on the team
    because they live, breathe, and eat code development and are not typically focused
    on the data security of the code they are developing. It should be no surprise
    that the diagram produced in this stage of the threat modeling process is called
    a data flow diagram or DFD. The focus of the DFD is on how data moves through
    the software solution and what happens to the data as it moves, giving us a better
    understanding of how the software works and its underlying architecture by providing
    a visual representation of how the software processes data. The visual representation
    is hierarchical in structure, so it allows you to decompose the software architecture
    into subsystems and then lower-level subsystems. At a high level, this allows
    you to clarify the scope of the application being modeled; at the lower levels,
    it allows you to focus on the specific processes involved when processing specific
    data.


    Before you start developing your DFD, it is always a good idea to understand the
    element images you are going to use. The basic elements and symbols that are typically
    used in DFDs are shown in Figure 4.3. You build the DFD by connecting these various
    elements as data flows and applying boundaries between the elements where appropriate.


    Our first example of the use of a DFD is a data flow diagram for threat modeling
    of a web application, as shown in Figure 4.4. This data flow diagram represents
    the process by which customers and remote employees access corporate marketing
    data from a corporate website. The first and most obvious security control differentiates
    between file access by an employee of the company versus file access by a customer.
    The employee data might contain company IP information authorized only for company
    employees and, depending on their role, very sensitive competitive marketing and
    pricing data authorized only for employees who have a “need to know.”'
  merge: -1
  img_proc: true
- pgno: 94
  md: '| Element Type | Type Description | Element Symbol |

    | :--- | :--- | :--- |

    | External Element | An element outside your control and external to your software
    application but may be called to or interact with the software being modeled via
    an entry point. | [Rectangle] |

    | Process | This represents a task that handles data within the software. This
    task may process or perform a task based on the data. | [Circle] |

    | Multiple Processes | This is used to represent a collection of sub-processes
    for the data and typically indicates that another DFD will be involved in which
    case its sub-processes are broken down and extended into an additional DFD. |
    [Double Circle] |

    | Data Store | This represents where data is stored but not modified. | [Two parallel
    lines] |

    | Data Flow | This represents the movement of the data within the software and
    its direction of movement is represented by the arrow. | [Curved Arrow] |

    | Trust Boundary | A trust boundary occurs when one component doesn''t trust the
    component on the other side of the boundary. Trust boundaries always exist between
    elements running at different privilege levels. There can also be trust boundaries
    between different components running at the same privilege level. | [Dashed Curved
    Line] |'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Figure 4.4 Example data flow diagram for application threat modeling.


