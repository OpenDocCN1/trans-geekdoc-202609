    # 6.5 Key Success Factors


    The success of this fourth phase of the SDL depends on a review of policy compliance,
    security test case execution, completion of different types of security testing,
    and validation of privacy requirements. Table 6.1 lists key success factors for
    this phase.


    | Key Success Factor | Description |

    |---|---|

    | 1. Security test case execution | Coverage of all relevant test cases |

    | 2. Security testing | Completion of all types of security testing and remediation
    of problems found |

    | 3. Privacy validation and remediation | Effectiveness of privacy-related controls
    and remediation of any issues found |

    | 4. Policy compliance review | Updates for policy compliance as related to Phase
    4 |


    # Success Factor 1: Security Test Case Execution


    Refer to Section 6.2 for details on the success criteria for the security test
    execution plan.


    # Success Factor 2: Security Testing


    It is critical to complete all types of security testing—manual code review, static
    analysis, dynamic analysis, penetration testing, and fuzzing. Issues found during
    each type of testing should be evaluated for risk and prioritized. Any security
    defect with medium or higher severity should be remediated before releasing or
    deploying a product. Defects with low severity should not be ignored but should
    be put on a roadmap for remediation as soon as possible.


    # Success Factor 3: Privacy Validation and Remediation


    Validation of privacy issues should be part of security test plans and security
    testing. However, it is good to have a separate workstream to assess the effectiveness
