  img_proc: true
- pgno: 213
  md: '# Post-Release Certifications


    Relevant certifications needed after the product is released (or deployed in the
    cloud) should have been identified in one of the earlier phases of the SDL cycle.
    Requirements for certifications should have been included in security and privacy
    requirements. This will prevent any retrofitting or findings during compliance
    audits for certifications. Certifications often do require annual audits or surveillance
    audits. The security team should work with the security compliance team to ensure
    that all relevant controls requirements are met.


    # Third-Party Security Reviews


    As we have discussed, third-party reviews are often critical to demonstrate “security”
    to end users and customers. A preferred list of vendors should be created by the
    software team, and these vendors should be vetted for their skills as well as
    ability to handle sensitive information. Since these vendors will be handling
    sensitive security information, it is important to note if they use full disk
    encryption, communicate securely, dispose of any customer data as soon as testing
    ends, and so on. Any time there is a need for security testing, one of these vendors
    should be selected for the testing. Security testing of the entire software stack
    and product portfolio should be performed at least annually.


    # SDL Cycle for Any Architectural Changes or Code Reuses


    Any architectural or code changes or code/component reuses should trigger SDL
    activities (though not all may be needed, depending on the significance of the
    changes).


    # Security Strategy and Process for Legacy Code, M&A, and EOL Products


    Legacy code most likely will never be updated or modified. In addition, a legacy
    software stack will also never be patched or upgraded. Software running on old
    Apache web server will have severe dependencies on it as well as the operating
    system and thus will not be upgraded without the application itself being changed.
    Any security issues identified in legacy code will take a long time to remediate
    (if at all). The best way to deal with legacy code is to move away from it as
    soon as you can. Alternatives include defining a security process for managing
    security vulnerabilities in legacy code, monitoring legacy code closely (at least
    annually), and quarantining products running legacy code so that they pose minimal
    risk to the environment.


    M&A security assessment strategy is one of the key success factors in the post-release
    phase. As mentioned earlier, you may not have access to source code, so assessment
    strategies need to take this into account—that is, you may need to use binaries
    rather than source code. In the end, M&A security assessment should provide input
    into the overall quality of the software being acquired. If this assessment is
    not thought through carefully or done correctly, the software security group or
    the information security group may end up dealing with repercussions for a long
    time to come. A weakness in acquired software may weaken the software posture
    of other products deployed in the environment.


    In addition to a strategy for treating legacy code and products and M&A, it is
    important to define end-of-line plans for the current version of the product/release.
    An end-of-line roadmap can guide security strategy from this point on.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 8.8 Deliverables


    Key deliverables for this phase are listed in Table 8.1.


    # Table 8.1 Key Deliverables


    | Deliverable | Description |

    | :--- | :--- |

    | External vulnerability disclosure response process | The process to define evaluation
    and communication of security vulnerabilities |

    | Post-release certifications | Certifications from external parties to demonstrate
    the security posture of products/services |

    | Third-party security reviews | Security assessments performed by groups other
    than internal testing teams |

    | Security strategy and process for legacy code, M&A, and EOL plans | Strategy
    to mitigate security risk from legacy code and M&As |


    # External Vulnerability Disclosure Response Process


    This deliverable should clearly identify stakeholders in the process and create
    a RACI for their role in it. In addition, communication cadence with customers
    should be formalized and published so that everyone in the company is aware of
    it and can invoke it if needed. Most important, the process should be followed
    every time a security vulnerability comes from external channels or needs to be
    disclosed to customers.


    # Post-Release Certifications


    Post-release certifications may include multiple deliverables or certifications
    based on target markets, regulatory needs, and customer requests. Any one of these
    factors may drive a certification strategy. Certification should be renewed if
    drivers for these certifications are still present.


    # Third-Party Security Reviews


    This deliverable consists of multiple security assessments from independent third
    parties. At least two reports based on assessments should be created: one for
    internal consumption and one for external use. External reports should not list
    details of security vulnerabilities or expose critical information. Reports for
    internal consumption should be as detailed as possible and provide short- as well
    as long-term remediation recommendations.


    # Security Strategy for Legacy Code, M&A, and EOL Plans


    There are three different deliverables under this umbrella: security strategy
    for legacy code and products, security strategy for M&As, and end-of-life plans.
    Each of these should be vetted with relevant stakeholders and implemented in practice
    only once they have been signed off by everyone.'
  merge: -1
  img_proc: true
