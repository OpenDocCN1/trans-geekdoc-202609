- pgno: 241
  md: '![](img/a54ed04827050a271316d34985425127_241_0.png)


    Figure 9.8 BSIMM average maturity levels across financial services, insurance,
    and healthcare (Source: BSIMM 11 by Sammy Migues, John Steven, and Mike Ware is
