- pgno: 25
  md: '# Chapter 1


    # Introduction


    # CHAPTER OVERVIEW


    Welcome to our book about what we still believe to be the most important topic
    in information security for the foreseeable future: software security. In the
    following sections, we will cover five major topics that highlight the need, value,
    and challenges of software security. This will set the stage for the remainder
    of the book, where we describe our model for software security: building security
    into your software using an operationally relevant and manageable security development
    lifecycle (SDL) that is applicable to all software development life cycles (SDLCs).


    # CHAPTER TAKE-AWAYS


    +   - Describe the importance and need for software security.

    +   - Understand the role of security within the software development life cycle
    (SDLC).

    +   - Distinguish between quality and security attributes in code.

    +   - Describe the fundamental goals of the security development lifecycle (SDL).

    +   - Determine when and how to apply threat modeling and application risk analysis
    processes.


    The rationale and the principles needed to achieve an effective software security
    program include:


    +   1. The importance and relevance of software security. Software is critical
    to everything we do in the modern world and is behind our most critical systems.
    As such, it is imperative that it be secure by design. Most information technology
    (IT)-related security solutions have been developed to mitigate the risk caused
    by insecure software. To justify a software security program, the importance and
    relevance of the monetary costs and other risks for not building security into
    your software must be known, as well as the importance, relevance, and costs for
    building security in. At the end of the day, software security is as much a business
    decision as it is about avoiding security risks.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   2. **Software security and the software development life cycle.** It is
    important to know the difference between what are generally known in software
    development as *software security* and *application security*. Although these
    terms are often used interchangeably, we differentiate between them because we
    believe there is a distinct difference in managing programs for these two purposes.
    In our model, *software security* is about building security into the software
    through a SDL in an SDLC, whereas *application security* is about protecting the
    software and the systems on which it runs after release.


    +   3. **Quality versus secure code.** Although secure code is not necessarily
    quality code, and quality code is not necessarily secure code, the development
    process for producing software is based on the principles of both quality and
    secure code. You cannot have quality code without security or security without
    quality, and their attributes complement each other. At a minimum, quality and
    software security programs should be collaborating closely during the development
    process; ideally, they should be part of the same organization and both part of
    the software development engineering department. We will discuss this organizational
    and operational perspective later in the book.


    +   4. **The three most important SDL security goals.** At the core of all software
    security analysis and implementation are three core elements of security: *confidentiality,
    integrity,* and *availability*, also known as the C.I.A. model. To ensure high
    confidence that the software being developed is secure, these three attributes
    must be adhered to as key components throughout the SDL.


    +   5. **Threat modeling and attack surface validation.** The most time-consuming
    and misunderstood part of the SDL is threat modeling and attack surface validation.
    In today’s world of Agile development, you must get this right or you will likely
    fail to make your software secure. Threat modeling and attack surface validation
    throughout the SDL will maximize your potential to alleviate post-release discovery
    of security vulnerabilities in your software product. We believe this function
    to be so important that we have dedicated a SDL section and a separate chapter
    to this topic.


    # 1.1 The Importance and Relevance of Software Security


    Although dated, the following statements are still relevant and highlight the
    security challenges that still exist in many software development organizations
    today. The 2005 U.S. President’s Information Technology Advisory Committee (PITAC)
    report stated: “Commonly used software engineering practices permit dangerous
    errors, such as improper handling of buffer overflows, which enable hundreds of
    attack programs to compromise millions of computers every year.”¹ This happens
    mainly because “commercial software engineering today lacks the scientific underpinnings
    and rigorous controls needed to produce high-quality, secure products at acceptable
    cost.”²


    The Gartner® Group reports that more than 70 percent of current business security
    vulnerabilities are found within software applications rather than the network
    boundaries.³ A focus on application security has thus emerged to reduce the risk
    of poor software development, integration, and deployment. As a result, software
    assurance quickly became an information assurance (IA) focus area in the financial,
    government, and manufacturing sectors to reduce the risk of unsecure code: Security
    built into the software development life cycle makes good business sense.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'A U.S. Department of Homeland Security 2006 Draft, “Security in the Software
    Lifecycle,” states the following:


    The most critical difference between secure software and insecure software lies
    in the nature of the processes and practices used to specify, design, and develop
    the software ... correcting potential vulnerabilities as early as possible in
    the software development lifecycle, mainly through the adoption of security-enhanced
    process and practices, is far more cost-effective than the currently pervasive
    approach of developing and releasing frequent patches to operational software.⁴


    At the RSA® 2011 USA conference, cloud security issues were highlighted, but very
    little discussion was devoted to addressing the problem; however, at the 2012
    conference, it was all about addressing the security issues in the cloud that
    had been so aptly identified the year before. The same thing happened in 2012,
    starting with a few key conferences, and continued with a major focus on discussing
    solutions for software security in 2013. For example, in early 2012, Information
    Week identified “Code gets externally reviewed” as one of the 10 security trends
    to watch in 2012,⁵ and stated that “this business mandate is clear: Developers
    must take the time to code cleanly, and eradicate every possible security flaw
    before the code goes into production.” There was also a popular security article
    published on March 1, 2012, titled “To Get Help with Secure Software Development
    Issues, Find Your Own Flaws,” which highlighted panel discussions at RSA 2012
    in San Francisco.⁶ This panel did a great job of identifying some of the critical
    issues but did not address solving the software security challenges that it identified.
    However, things started to change mid-year 2012: The agenda for the Microsoft®
    inaugural Security Development Conference, held in May 2012,⁷ was less about Microsoft
    and more about bringing secure software development thought leadership together
    and in three separate tracks to include “security engineering,” “security development
    lifecycle (SDL) & business,” and “managing the process” to discuss solutions to
    the most important security issue in industry—secure software development. This
    trend continued with the blackhat® USA 2012 Conference,⁸ the RSA 2013 Conference,⁹
    and the 2013 Microsoft Security Development Conference.¹⁰


    Think about it: What really causes a majority of the information security problems
    we have today? What is the primary target of hackers, cybercriminals, and nation-state
    cyber warriors? It is insecure code. What has quickly become the highest unnecessary
    cost to software development? It is flaws arising from insecure code in software
    products that have already been released to the market. When these flaws are discovered
    and/or exploited, they cause interruptions in current product development cycles
    to fix something that should have been fixed during the development of the product
    that has the flaw; they cause delays in product release dates because individuals
    or teams working on current products are pulled off cycle to fix issues in a previously
    released product; and they result in vulnerability scope creep because vulnerabilities
    discovered in one product may affect the security of others in web, Software-as-a-Service
    (SaaS), and cloud applications. They also create legal issues, reputation degradation,
    and public relations nightmares, such as those experienced by Sony®, Symantec®,
    and RSA over several years. They can also result in significant liability to the
    company. In an age of extensive regulations governing privacy and exposure of
    data, this quickly adds up even for big corporations. The point here is that even
    as the high-tech world, its consumers, customers, regulators, and the media have
    started to realize that not only is it imperative to fix software security problems,'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'there is, in fact, a way to solve these issues in the form of a structured
    security software development life cycle or framework, such that all eyes will
    be on those who develop software code, particularly code that is used in critical
    and sensitive applications to see if the developers are adhering to this practice
    within their own environment—whether it be traditional/Waterfall, Scrum/Agile,
    or a blended development methodology.


    Every sector of the global economy, from energy to transportation, finance, and
    banking, telecommunications, public health, emergency services, water, chemical,
    defense, industrial, food, agriculture, right down to the postal and shipping
    sectors, relies on software. Anything that threatens that software, in effect,
    poses a threat to our lives. Because of all the potential harm that could occur
    from exploitation of coding defects, the product not only has to work right (_quality_),
    it also has to be secure (_security_). Hence, we believe the title and content
    of this book addresses perhaps the most critical challenge we face in information
    and cyber security over the next few years.


    Many believe that you can just fix software vulnerabilities after the product
    has been developed and be done with it. This is not that easy, however, because
    the cost to fix vulnerabilities increases over the SDLC, as shown in Figure 1.1,
    and most security activities happen post-release, including code audits, remediation,
    bug fixes, required patches, and also hacking. In a cloud environment, there may
    be multiple versions of an application running and it is often a challenge to
    fix security vulnerabilities across all of them. Exposure in one version of an
    application in a cloud environment can result in exploitation of all of them unless
    there are stringent network segmentation controls in place. Even these might prove
    to be insufficient in the event of sophisticated attacks.


    The cost associated with addressing software problems increases as the lifecycle
    of a project matures (see Figure 1.1). In 1988, Barry Boehm stated that defects
    found in the field cost 50–200 times as much to correct as those corrected earlier.11
    Years later, Boehm stated that this ratio was 5:1 for small noncritical systems.12
    Data presented by Fortify in 2008 indicate that the cost of correcting security
    flaws at the requirements level is up to 100 times less than the cost of correcting
    security flaws in fielded software.13 No matter what numbers are used, it is clear
    from the references above and others used in industry that there are substantial
    cost savings to fixing security flaws early in the development process rather
    than fixing them after software is fielded. For vendors, the cost is magnified
    by the expense of developing and


