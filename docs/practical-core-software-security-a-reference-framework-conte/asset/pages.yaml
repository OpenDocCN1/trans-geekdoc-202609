    Automation Protocol (SCAP). These data enable automation of vulnerability management,
    security measurement, and compliance. The NVD includes databases of security checklists,
    security-related software flaws, misconfigurations, product names, and impact
    metrics.22 The NVD Common Vulnerability Scoring System (CVSS) provides an open
    framework for communicating the risk characteristics and impacts of IT vulnerabilities.
    Its quantitative model ensures repeatable accurate measurement while enabling
    users to see the underlying vulnerability characteristics that were used to generate
