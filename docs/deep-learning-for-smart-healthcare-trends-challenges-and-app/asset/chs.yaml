  \ 概述\n\nSu 等人 (2022) 描述了三种类型的治疗性拮剂，包括多肽、非肽和单克隆抗体，它们能有效抑制病理性 apelin/APJ 信号激活，并已用于治疗多种疾病和状况，包括高血压、肾缺血、肺障碍、多囊卵巢综合征、内皮功能障碍、心脏肥大、慢性心力衰竭、肿瘤转移、中枢神经系统有害病毒入侵以及病理性视网膜早产（ROP，这是一种经常导致儿童失明的突出视网膜疾病，主要涉及异常的\
  \ apelin/APJ 信号）。因此，我们推测本研究回顾的所有三种针对 apelin 多肽和 APJ 受体的特异性拮剂，可能有助于减少与 ROP 相关的异常视网膜血管。这些针对病理性\
  \ apelin/APJ 信号活性的治疗性拮剂必须经过临床试验以证明其有效性 [7]。\n\nPark 等人 (2021) 发现三种类型的治疗性拮剂（包括多肽、非肽和单克隆抗体）能有效抑制病理性\
  \ apelin/APJ 信号激活，并已用于治疗多种疾病和状况，包括高血压、肾缺血、肺障碍、多囊卵巢综合征、内皮功能障碍、心脏肥大、慢性心力衰竭、肿瘤转移、中枢神经系统有害病毒入侵以及病理性视网膜。研究了\
  \ 85 名单胎早产儿（出生时胎龄 `GA` 为 24.5 周至 30 周），具有完整膜早产（`PTL`）或早产性羊膜提前破水，以研究其在没有 FGR（出生体重处于\
  \ `GA` 的第 5 百位数）和早产 PROM 的情况下 ROP 的发生率。胎外膜（`EPM`）、毛细血管（`CV`）和脐带的炎症进展用于对患者进行分类（`UC`）\
  \ [8]。图 15.7 显示了采用 `U-COSFIRE` 过滤 ROP 诊断方法的架构图。图 15.8 显示了使用自适应方法进行血管分割的流程图。图 15.9\
  \ 显示了带有区域边界的示意图中左右眼。\n\n![图 15.7 采用 U-COSFIRE 过滤 ROP 诊断方法的架构图](img/fig15_7.jpg)\n\
  图 15.7 采用 U-COSFIRE 过滤 ROP 诊断方法的架构图\n\n![图 15.8 使用自适应方法进行血管分割的流程图](img/fig15_8.jpg)\n\
  图 15.8 使用自适应方法进行血管分割的流程图\n\n![图 15.9 左右眼显示在带有区域边界和钟小时扇的示意图中，用以指示血管的存在位置和视网膜变的严重程度](img/fig15_9.jpg)\n\
  图 15.9 左右眼显示在带有区域边界和钟小时扇的示意图中，用以指示血管的存在位置和视网膜变的严重程度\n\n# 分类与标准\n\nChiang 等人 (2021)\
  \ 创建了一个名为“早产视网膜病国际分类”的共识协议，为 ROP 分类建立了统一的术语。它首次于 1984 年发布，随后进行了扩大，并于 2005 年重新出版。本文介绍了第三次修订版，即《早产视网膜病国际分类第三版》（`ICROP3`），由于以下问题，现在已变得必要：(1)\
  \ 对关键疾病分类组成部分主观性的担忧；(2) 眼科影像技术的进步；以及(3) 新型药物治疗（如抗血管内皮生长因子药物）与现有标准相比，治疗后具有独特的缓解和再激活特征\
  \ [9]。\n\nCampbell 等人 (2022) 是 `ICROP3` 委员会的成员，他们使用开源平台对两组各 30 张底片的不同数据集进行了分期（`0e5`）和疾病类型（plus、preplus、neither）标注。通过平均这些结果，为每张图像创建了\
  \ plus（`1e9`）和分期（`1e3`）的连续标签。此外，请专家评估每张图中 plus 疾病的相对严重程度。此外，ROP DL 系统为每张图像分配了血管严重程度评分，该评分与每位评分者的诊断标记以及通过眼底检查确定的疾病分期相关\
  \ [10]。图 15.10 显示了早产视网膜病国际分类（ICROP）委员会成员确定 plus 疾病和分期的示例图像。图 15.11 显示了 ROP 中 plus\
  \ 和分期的疾病严重程度谱。\n\n![图 15.10 早产视网膜病国际分类（ICROP）委员会成员确定 plus 疾病和分期的示例图像](img/fig15_10.jpg)\n\
  图 15.10 早产视网膜病国际分类（ICROP）委员会成员确定 plus 疾病和分期的示例图像\n\n![图 15.11 ROP 中 plus 和分期的疾病严重程度谱](img/fig15_11.jpg)\n\
  图 15.11 ROP 中 plus 和分期的疾病严重程度谱\n\n# 研究研究\n\nIwahashi 等人 (2021) 从病历中收集了以下信息：性别、胎龄、出生体重、ROP\
  \ 分期、`LSV` 时的胎龄、手术技术、抗 VEGF 注射、视网膜手术以及术后晶体切除 [11]。\n\nCoyner 等人 (2022) 讨论了开发分析医学图像所需的大量数据的人工智能（AI）模型，但由于隐私问题、疾病罕见性以及诊断标签的准确性，收集这些数据可能是困难的。可能导致失明的\
  \ ROP 数据收集正面临这些困难。由于可以生成极其真实的图像，渐进生成对抗网络（PGANs）可能对扩大数据集的数量和多样性有所帮助 [12]。\n\nPodraza\
  \ 等人 (2020) 发现该疾病包含两个不同的出生后阶段，第一个被认为是由高氧引起的。输血将“非生理性”成人血红蛋白（`HbA`）引入新生儿循环而非生理性血红蛋白（`HbF`），这是临床实践中\
  \ ROP 的最危险因素之一。由于 `HbA` 和 `HbF` 对氧的亲和力不同，`HbA` 释放的氧比 `HbF` 多。假设来自 `HbA` 的这种大量氧气会被相关的视网膜受体视为高氧。根据上述因素，我认为\
  \ ROP 的发生和发展受到贫血输血期间引入的供体 `HbA` 的显著影响。根据这一理论，`HbA` 存在一个阈值，会触发 ROP 发病机制中的一系列事件。我建议建立一个名为“新生输血医学”的新医学分支以预防\
  \ ROP。该技术不再使用成人血治疗具有 ROP 风险的早产儿，而是从健康新生儿的胎盘中收集并准备脐带血，其中含有约 100% 的 `HbF` [13]。\n\n\
  \n\n\nAl Amro 等人（2018）简要介绍，通过早期发现和适当治疗可以避免失明。该病症护理的基础是由经验丰富的眼科医生对患有婴儿性视网膜病（ROP）的早产儿进行有效及时的视网膜检查。所有治疗这些危险早产儿的新生科医生和儿科医生也应该了解这一节点。这一实用的指南旨在指导沙特阿拉伯的眼科医生、新生科医生和其他医疗专业人员\
  \ ROP 筛查和管理的最新指征，以避免或减少今后的困难。这项实用的建议由卫生部国家眼睛健康计划（NEHP）和新生儿科学服务改进计划制定。它还得到了沙特阿拉伯眼科协会（SOS）的支持[14]。\n\
  \nTu 等人（2020）在这项回顾性研究中讨论了 2009 年 1 月至 2017 年 11 月期间，出生体重小于 1500 克且接受至少七天全静脉营养（TPN）的早产儿数据。通过在两个不同时期使用各种脂质乳——时期\
  \ 1（豆油基脂质乳，2009 年 1 月至 2014 年 2 月）和时期 2（含鱼油脂质乳，2015 年 1 月至 2017 年 11 月），我们比较了临床结果。ROP\
  \ 的发病率和需要贝珠单抗治疗的 ROP 病例数评估的主要结果[15]。\n\nTao 等人（2020）研究了纳入研究的在经后胎龄 28 周（PMA）内出生的\
  \ 75 名新生儿。目标变量被评估为用于 ROP 的 PC 手术数量[16]。\n\nDesideri 等人（2022）讨论了人工智能（AI）和深度学习（DL）模型在眼科领域如何引起全球范围内日益增长关注。DL\
  \ 模型被认为是目前尖端的 AI 技术。事实上，DL 系统能够识别、表征和量化异常临床特征。包括青光眼在内的几种视网膜疾病目前正在与其早期诊断和管理的重要性方面进行研究。当\
  \ DL 模型应用于眼底照、视野和光学相干断层扫描（OCT）成像时，糖尿病视网膜病变（DR）、湿性年龄相关性黄斑变性（w-AMD）、ROP 和青光眼的早期诊断显示出鼓舞的结果。在不忽略目前采用\
  \ AI 和 DL 模型局限性和困难的情况下，我们在研究中分析了 AI 应用于眼疾病的可用证据。我们还考虑了未来的潜在进展和治疗意义[17]。\n\nChaves-Samaniego\
  \ 等人（2020）的一项观察性回顾性研究包含了 1999 年至 2019 年间接受评估的 233 名早产儿。对于出生后前四周体重增加、出生体重、胎龄、机械通风、输血、败血症的存在、动脉导管持续、坏死性性肠炎、脑内出血或脑周白质软化，发现\
  \ ROP 组之间存在显著差异。需要治疗的 ROP 组平均出生后体重增加每天 9.50 ± 5.45 g，而不需要治疗的 ROP 组平均出生后体重增加每天 12.75\
  \ ± 5.99 g[18]。\n\nNavarro-Blanco 等人（2020）讨论了欧洲每个提供新生儿护理的医院都缺乏专门治疗早产儿的眼科医生，特别是在西班牙，这在涉及\
  \ ROP 筛查时令人担忧。Moral Pumarega 等人对护理出生体重 ≤ 1500 克的新生儿的 99 家公立和私立医院进行了新生儿病室 ROP 筛查分析。根据他们的发现，调查的医院中只有\
  \ 39% 配有儿科眼科医生，而其他中心则允许任何在职眼科医生进行检查[19]。\n\nKhurram 等人（2021）发现，在一个患有双侧 ROP（一只眼治愈）的早产新生儿的一只眼睛发现了色素过度性雷状斑病病变，而另一只眼睛有小眼畸、先天性白内障和非特异性色素视网膜病变。实验室检查随后显示在\
  \ TORCH 筛查阴性后，毒虫引起的血浆 IgG 和 IgM 升高[20]。\n\nFleck 等人（2022）研究中的所有分析都是按眼睛进行的，而不是按个体进行。仅使用来自\
  \ 24 周核心研究的数据来确定疾病、3 期 ROP 和 AP-ROP 回归所需的时间。通过某些特征消失的首次观察来表征 Plus 病或其他 ROP 症状的消退。轻度、中度或严重疾病分类为发生在至少象限[21]。\n\
  \nZhou 等人（2022）发现 ROP 的进展进一步损害视网膜及其血管。根据最新研究，患有 ROP 的青少年持续受到其长期影响，如脉络膜变薄和黄窝发育不良。自\
  \ 20 世纪 80 年代以来，新生儿护理增加，更多早产儿存活并长大。目前关于早产成人视觉能力和眼睛结构的研究较少。这项研究的主要目标是描述一群早产年轻人的视觉能力。我们还试图确定\
  \ ROP 是否会导致早产成人出现长期的视觉障碍，考虑到 ROP 的隐匿性。所有参与者均签署了知情同意。伦理委员会和机构审查委员会批准了该研究。正如之前所述，我们根据较\
  \ BCVA 和较差的 BCVA 进行分类，同时检查矫正视力（BCVA）、屈光不正和对比度（CSs）[22]。\n\nChen 等人（2021）的一项研究中，从电子健康记录（EHR）中手动检索直到\
  \ 31 周胎后的每个婴儿的氧饱和度和吸入氧气百分比（FiO2）。每周计算 FiO2 的累积最小、最大和平均氧饱和。使用胎龄（GA）和 30 周胎后的累积最小\
  \ FiO2 通过五折交叉验证训练随机森林模型以识别 TR-ROP 婴儿。由于新生儿数量较少，进行了未经交叉验证的次级接收者操作特征（ROC）曲线分析[23]。\n\
  \nScruggs 等人（2022）发现，为了客观评估早期视网膜病理特征，应获取外周视网膜的平面成像和 B 扫描成像。这些特征包括前无血管和血管化视网膜之间的区分、早期脊形成的存在以及微小的新生血管簇[24]。\n\
  \n\n\n\n作为 ROP 影像与信息学（`i-ROP`）队列研究的一部分，Hanif 等人（2022）利用接受过 ROP 诊断检查的患者广角视网膜图像来训练深度学习神经网络。在两个数据集的\
  \ ROP 视网膜图像中，神经网络使用代表疾病严重程度的类别或比较标签进行训练。所有网络在训练和验证后，均使用不同的测试数据集在两个二分类任务之一中进行测试：正常对异常，或增型对非增型\
  \ [25]。\n\n在尼泊尔和蒙古，Cole 等人（2022）使用 `Forus 3nethra Neo`（`Forus Health`）和 `RetCam\
  \ Portable`（`Natus Medical, Inc.`）采集眼底图像。使用视网膜血管异常性国际分类（`ICROP`）分析病例并评估 ROP 的整体严重程度。通过参考诊断标准，分别识别每张图像中是否存在增型。在来自\
  \ `RetCam` 的图像上，训练了 `i-ROP` 深度学习算法来识别疾病并分配 1 到 9 之间的血管严重程度评分（`VSS`） [26,27]。图 15.12\
  \ 显示了早产组（A、C、E 和 H）与足月组（B、D、F 和 J）之间在最佳矫正视力（`BCVA`）、球屈散光、柱光散光和对比敏感度（`CS`）方面，无 ROP\
  \ 早产儿与患 ROP 早产儿组的比较。\n\n![图 15.12 早产组（A、C、E、G 和 I）与足月组（B、D、F、H 和 J）在最佳矫正视力（BCVA）、球屈散光、柱光散光和对比敏感度（CS）方面，无早产性视网膜病变（ROP）早产儿与患\
  \ ROP 早产儿组的比较。](img/fig15_12.jpg)\n\n图 15.12 早产组（A、C、E、G 和 I）与足月组（B、D、F、H 和 J）在最佳矫正视力（BCVA）、球屈散光、柱光散光和对比敏感度（CS）方面，无早产性视网膜病变（ROP）早产儿与患\
  \ ROP 早产儿组的比较。\n\n## 15.3 结论\n\n名为 ROP 的血管增生性视网疾病主要影响新生早产儿。它可以被避免成为儿童失明的因素之一。由于现在早产新生儿的寿命更长，ROP\
  \ 已成为全球范围内可预防儿童失明名单中的顶端。这种可以避免的失明可以通过眼科医生在出生后几周内进行快速筛查检查来避免。尽管富裕国家严格遵循筛查技术和建议，但在中国和印度等全球早产率最高的新兴经济体中，这些措施尚未建立。如果不采取采取行动解决这一问题，预计未来这些国家的这种失明负担将显著增加。当\
  \ ROP 最初出现时，它被称为晶状体后纤维增生。从那时起，已有大量研究针对这种疾病进行了开展。\n\n## 15.4 未来方向\n\n### 15.4.1 预测因子\n\
  \n早期发现 ROP 至关重要。然而，目前仅使用了两个最重要的因素——胎龄和出生体重。\n\n### 15.4.2 体重增长\n\n尽管这项技术在 ROP 中尚未广泛应用，但它已经为视网膜的正常发育、急性\
  \ ROP 过程及其在细胞和亚细胞水平上的长期影响提供了新的视角。\n\n### 15.4.3 远程筛查\n\nROP 筛查的金标准是儿科医生的及时转诊和熟练眼科医生的全面评估。数字视网膜图像的使用对\
  \ ROP 筛查变得越来越重要。\n\n### 15.4.4 OCT\n\n名为 `OCT`（光学相干断层）的成像技术提供视网膜的横截面图像，已广泛应用于患者。\n\
  \n\n\n\n\n首先，足够的“严重早产视网膜病（ROP）”病例无法保证临床测试的泛化性能。其次，目前的技术只能评估 ROP 的严重程度。在我们接后的研究中，我们希望收集更多信息，并按照“型型”、“阶段”和“分区”等更精确的分类对\
  \ ROP 进行评分。第三，与没有平台的临床测试相比，云平台的预测是否会影响眼科医生的诊断是一个尚未解决的问题。未来对平台的测试应该更多关注细节。\n\n##\
