  \ (LightGBM+KNN 模型) 的用户界面。\n\n## 13.6 结论\n\n本章的总体目标是利用机器学习技术改进糖尿病预测。首先，我们对关于使用机器学习预测糖尿病的各种研究论文进行了文献综述。我们尝试使用一个不涉及任何医疗诊断的问卷数据集在早期阶段检测糖尿病。随机森林算法获得了最高的准确率（0.97）。随后，我们尝试根据\
  \ `PIDD`（皮马印第安人糖尿病数据集）来预测糖尿病，该数据集包含各种特征和目标列。我们将目标列分类为二分类（糖尿病或非糖尿病）。在此过程中，应用了多种分类和集成算法。最后，混合算法\
  \ `LightGBM+KNN` (0.91) 提供了最高的准确率。对于这两个模型，我们都使用 `Python` 中的 `Streamlit` 库创建了用户界面。\n\
