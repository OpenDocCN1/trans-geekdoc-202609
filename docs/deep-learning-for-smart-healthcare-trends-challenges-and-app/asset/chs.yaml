  \ | --- |\n| `Darknet53` || 74.2% | |\n| `ResNet-50` || 76.1% | |\n\n## 7.9 结论\n\
  \n任意超大目标检测器版本 5 (`AX-YOLOV5`) 是 Yolo 家族中最好的目标检测变体之一。该版本在图像帧中有效检测超大物体方面表现更好。所提系统能够持续监测患者人体器官的不适，即使在数值不均匀的情况下也是如此，可以通过公式\
  \ 7.21 进行测量。基于 `VGGNET-19` 的 `AX-YOLOV5` 模型在检测患者不适方面显示出比其他神经网络更好的性能。\n\n## 参考文献\n\
