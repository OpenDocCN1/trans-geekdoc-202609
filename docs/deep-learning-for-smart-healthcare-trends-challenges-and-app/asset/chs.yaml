  9. 全层。\n10. 检测。\n\n**Deep CNN 算法**\n**输入**: 输入图像数量 `D[1]`，`D[2]`，`D[3]`，…… `D[n]`\n\
  **输出**: 提高准确率和更低复杂度\n\n1. 对每张乳腺图像。\n2. 分解子带。\n3. 对此类图像进行 `Deep CNN` 处理。\n4. 提取特征。\n\
