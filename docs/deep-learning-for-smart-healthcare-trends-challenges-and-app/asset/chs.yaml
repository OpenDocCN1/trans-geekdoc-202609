  \n\n\n在医疗保健领域，人工智能为人们提供更好的医疗设施发挥着重要作用。特别是深度学习（DL）在临床试验中起着至关重要的作用。医疗记录的数据收集、选择及其管理对于提取正确的数据至关重要，这一点同样适用于模型训练和调优。无论收集和训练了什么数据，都应该满足验证和流程改进的要求。否则，则必须重新进行数据收集以获取正确的数据。新的实时数据也可以包含在数据模型中，用于调优和去噪处理。深度学习可以简化这一流程，在各种医疗记录的帮助下，改进药物的生产和识别，并可能优化各种新模型的治疗水平和测试\
  \ [1]。\n\n临床试验管理首先确定目标患者和参与者留存。为了提高参与者留存率、减轻患者的试验负担并增强对模型准确预测的信心，可以通过数据相关的假设的形式来处理缺失数据。预期的分析方法——即深度学习模型——在预测临床试验结果方面存在一些限制。数据可以进行增强，也可以不进行增强，以便所有数据都得到改进，使去噪方法能够保持准确性。深度学习过程在临床试验中的各种角色如图图\
  \ 1.1\n\n图 1.1 深度学习过程在临床试验中的作用。\n\n### 1.1.1 深度学习的功能\n\n神经网络被称为层节点是因为人大脑是由神经元组成的。相邻的层节点之间相互连接。一个社区看起来有多深取决于它拥有的层数。人类思维中的单个神经元会接收来自不同神经元的大量指标。在合成神经社区中，指标在节点之间传输并遵循互补的权重。生物神经元如图图\
  \ 1.2\n\n图 1.2 生物神经元的结构。\n\n如果一个节点的权重较大，它对下方层内节点的影响可能会更强。最终层通过结合加权输入来提供输出。深度学习结构需要有效的硬件，因为这些系统处理了海量信息并执行许多复杂的数学计算。然而，即使使用这样先进的技术，训练神经网络可能需要几天甚至几周的时间\
  \ [2]。深度学习系统以巨大数据集的形式接收输入，因为它们需要大量数据来产生准确的结果。为了对数据进行分类，人工神经网络通过对关于极困难数学计算的一系列二进制“是/否”问题的回答来处理数据。例如，面部识别规则集首先学习理解面部的轮廓和外缘，这些是通过面部较大的特征观察到的，最终学习到人脸的通用表示。随着软件程序的学习，产生理想反应的几率会增加。在这种情况下，面部识别软件程序将很快擅长识别人脸。\n\
  \n最近发现的 SARS-CoV-2 病毒及其产生的疾病 COVID-19 改变了世界。目前的全球健康灾难与近期记忆中的任何事件都不同，被世界卫生组织称为“大流行”。这种病毒和疾病对全球科学界来说都是未解之谜。需要以前所未有的水平进行国际合作和工作，以确保整个大流行期间临床试验的完整性，开发和识别治疗方法，并确定它们安全有效的情况。深度学习模型被用于从胸部影像中高效识别肺感染区域、预测病情向重症阶段转换的可行分析、以及基于自然语言处理（NLP）的结合问卷、摘要和聊天机器疾病分类。\n\
  \n#### 1.1.1.1 深度学习工作：一个示例\n\n考虑目标之一是教神经网络识别狗的照片。贵宾犬和罗威犬是所有狗的外表有多不不同的两个实例。此外，图像还显示了在各种光照和视角设置下的狗。因此，有必要组合一个图片集，其中包含任何人都会归类为“犬类”的各种犬脸，以及不是狗但正如人们可能预期的那样被标记为“不再是犬类”的因素照片。输入的照片通过神经网络手段转换为事实。当这些事实在网络中传输时，许多节点为组件分配权重。“犬类”这个词通过最后的输出层产生，该层混合了最初看起来互不相关的事实（毛茸、有鼻子、有四条腿等）。\n\
  \n我们现在把神经网络的答案与人类的标签进行比较。如果匹配，则验证输出。否则，将调整权重，神经网络会注意到错误。为了提高识别狗的能力，神经网络会定期更新其模型中的权重。虽然没有明确提到什么“定义”了一只狗，但在这种训练过程中使用的神经网络（监督学习）仍然可以产生结果\
  \ [3]。它们必须缓慢开始识别数据中的模式，并学会学习新信息。\n\n#### 1.1.1.2 深度学习的兴起\n\n英国数学家艾兰·图灵（Alan Turing）在\
  \ 20 世纪 50 年代提出了他的人工智能“学习系统”，被归功于发明了机器学习。亚瑟·萨姆埃尔（Arthur Samuel）推进了主要的基于 PC 的指令程序。他的规则集随着\
  \ IBM PC 对其进行检查而向前发展。在随后的几十年里，不同的学习系统策略层出不穷。由于“局部最小值”问题，神经网络在很大程度上被研究人员忽视，因为在该问题中权重被错误地认为提供了最少的误差。计算机视觉、预测和面部识别都是卓越机器学习策略的示例。照片中的实时人脸识别得益于\
  \ 2001 年发明的提升算法（Ad boost），这是一种机器学习技术。它能够使用决策集过滤图像，例如“图像在深色区域之间是否有亮区，可能意味着鼻梁？”根据数据移动，无论数据是否与图像一起检查，为识别正确数据做出正确的决策\
  \ [4,5]。即使引入了竞争性的图形处理器，神经网络的流行在几年也没有再次上升。新设备允许研究人员使用台式计算机而不是超级计算机来运行、编辑和处理图像。神经网络的最重大进展源于\
  \ ImageNet 引入了大量的标注数据，这是一个从互联网收集的数百万注释照片集合。手动分类照片的任务被众包所取代，这为网络提供了近乎无尽的训练数据来源。以来，IT\
  \ 公司开放了它们的深度学习库。微软的 CNTK、亚马逊的 DSSTNE、Facebook 的开源 Torch 插件以及 Google TensorFlow 都是例子。\n\
  \n\n\n\n正如训练模型所提供的，流式节点为获取深度学习（DL）知识提供了正确的途径。事实证明，获取深度学习知识已包含在各种程序之中。任何使用 Facebook\
  \ 的人都会很快发现，当你添加新照片时，它会机械地识别并标记出你的朋友。像 `Siri`、`Cortana`、`Alexa` 和 `Google Now` 等数字助手利用自然语言并通过深度学习知识来识别语音。通过\
  \ `Skype`，对话可以实时翻译。许多电子邮件程序已经练就了技能，能够在邮件进入收件箱之前判断出垃圾邮件。`PayPal` 利用深度学习知识来阻止欺诈支付。通过使用\
  \ `Google`，深度学习知识被广泛应用，特别是为了提供有关移动搜索技术使用的答案。最近，Google Deep mind 的 `AlphaGo` PC 程序击败了当今的围棋冠军。DeepMind\
  \ 的 `WaveNet` 产生的语音比目前市场上不同的语音结构听起来更自然，更像人类。`Google Translate` 利用深度学习知识和图像识别来翻译口语和书面语言。`Google\
  \ Planet` 可用于确定任何照片的区域。Google 构建了 `TensorFlow` 深度框架，获取软件程序数据库知识以促进 AI 应用的引入 [6]。深度学习知识仍处于婴儿阶段；但在不远的未来，它将彻底改变社会。在全球范围内，自动驾驶汽车正处于测试阶段；极其先进的神经网络层正在训练，以识别需要避免的物品、注意访问者的灯光并识别何时切换速度。神经网络在所有领域都得到了增强，例如市场定价和气候预测。考虑虚拟助手的益处，它们可以在飓风发生前向买家建议卖出或促销股票。结构的深度学习知识甚至可能拯救生命，因为它们可以预测循证治疗帮助患者的潜力，并有助于肿瘤的早期诊断。\n\
  \n## 1.1.3 药物临床试验，而非新冠\n\n旅行限制、社会隔离甚至隔离都是全球社区应对 COVID-19 大流行反应的一部分。所有这些因素都会显著限制贡献者和人员前往医疗现场收集记录的潜力和意愿。数据分类技术也可能发生变化，某些记录可能会被忽略（例如，远程与仅在线）。此外，贡献者有可能将\
  \ COVID-19 传染给医疗保健人员，特别是考虑到少数感染者没有表现出任何体征症状，且病毒似乎在体征症状出现之前就具有传染性的现实。针对这些问题，美国食品药品监督管理局发布了在大流行期间医疗研究行为的修订建议\
  \ [7,8]。所有这些问题都可能导致影响记录查看的麻烦，并使医疗试验结果难以解释。这些困境的严重程度取决于当前 COVID-19 大流行的持续时间、受影响人数、所研究的疾病状况以及不同的试验设计因素，还可能给某些正在进行的医疗试验的终止增加压力。一旦医疗试验终止，可能会缺失记录，因此获取和报告发现可能变得困难，特别是当试验在早期阶段终止时。由于许多原因（有些是显而易见的，有些则不然），大流行之前收集的记录受影响可能比爆发后收集的记录更大。例如，医疗机构的日常可能会受到严重损害，可能会出现漏诊、方案违规增加、记录录入延迟、通过大量模态（以及广泛的分发）收集的记录以及随访缓慢。参与者可能在\
  \ COVID-19 首次出现后就停止提供数据、已经感染、被“封锁”、或从该地点转移到不同的国家、州、县、市和镇。感染 `SARS-CoV-2` 的个体可能表现出各种症状；少数患者在任何方面都没有表现症状，而另一些则去世。由于这种变异性，很难将结果归因于药物、观察方案违规，并因此预判试验的目的。此外，它可能影响每个试验的进行；然而，治疗的是更严重的疾病以及实验室警告的变更（例如，重大癌症）。这些和许多额外影响在大流行期间以及之后的一段时间内都会被感受到，因为全球医疗保健结构正在处理后果。当试验继续时，利用日益强大且可靠的技术来从记录中获取见解并增强对这种理解的信心，应对这些困境将至关重要。\n\
  \n在正在进行的试验中，医疗试验记录评估变得不常见，受影响的人在大流行期间在线签到，这将导致记录缺失。此外，在大流行之前、期间和之后频率的容量调整可能会阻碍在此前时期获取受影响人员记录的快照\
  \ [9]。目前的机器学习策略可能被用于解决这些问题。为了填补缺失记录留下的空白，可以使用专门为分配时间记录流中的缺失记录而设计的机器学习算法。当在线监控的范围不再那么广泛时，这些技术允许推断受影响人员的情况。在这个问题上，机器学习技术表现显著优于传统技术，结合结果优化、模式补全以及通过链式方程进行的几次插补\
  \ [10]。这些技术利用了多维循环神经网络和生成对抗插补网络 (`Yoon et al. from the UCI Machine Learning Repository)。所有这些技术主要基于记录是随机不完整的观点，即不完整的记录具有与患者未观察到的状况相互独立的特定目的。在大流行的背景下，这可能是一个合理的假设也可能不是；例如，影响访问是否取消的某些因素（例如，局部情况和受影响人员的体检状态）可能会被记录，而其他因素可能不会被记录。\n\
  \n\n\n\n如果用于归因或预测目的的记录不充分，估算过程将继续变得复杂。为了收集这些记录，可能需要将研究中受影响者的统计数据与位置唯一的运营统计数据建立超链接。其他机器学习模型的设计用于检查随机收集的时间记录。由于医学试验在整个疫情期间持续进行，疫情爆发前、持续期间和疫情之后实例之间的巨大差异可能会损害结果结果的有效性。由于在疫情期间所采取的措施，受试者贡献者的日常活动、他们接受的护理总量、基础治疗的提供方式，甚至是对照组设置，都可能发生变化。将这些结果与药物治疗结果区分来至关重要，以防止对医疗结果或治疗效果产生负面影响。这需要当今机器学习策略软件在预测治疗结果之外，还能预测有关疫情期间某地私有记录的变量（临床治疗的调整，以及营养、运动等调整，如果适用的话）。由于目前尚清楚除疫情爆发和治疗结果之外与某种情况的连接真实性质，由于其固有的灵活性和数据驱动的本质，机器学习算法优于传统的统计方法。如果试验在整个疫情期间持续，参与和注册人数可能会出现波动（甚至完全停止）。\n\
  \n如果在使用这些调整后特定的子小组受到不成比例的影响，受影响人群的组成将发生变化；如果研究中没有考虑这些混杂结果，预期的群体级治疗可能会产生偏差。因此，决定这些调整的量、它们对不同子小组治疗结果估计的影响，以及这些估计的置信程度将至关重要。在从早于预期目标停止的研究数据中得出推论之前，我们首先需要根据手头的记录决定哪些我们已经承认，哪些我们不再承认。机器学习算法可以通过估计多个几个治疗反应来解决这些问题。这些以及其他估计个体化治疗结果（`ITE`）的技术被用作实施子小组和估计各种治疗反应之前更早开始的起点。Hill\
  \ (2011)、Athey 和 Imbens (2016)、Alaa 和 van der Schaar (2017, 2018) 以及 Yoon 等人提供了许多估计\
  \ `ITE` 的精确技术 (2018a)。有关更多统计数据，请参阅 Bica 等人以及“在新试验设计中利用观测数据”（2020）中的早期阶段。这些模型在估计每个子小组的治疗反应之外，还可以决定子小组是否具有关联的特征和治疗反应。由于试验早于预期目标结束，记录将不可避免。此外，由于疫情对医疗保健的影响，获取和报告病例情况及结果的努力可能受到了阻碍。这可能导致治疗结果预测的准确性出现问题。\n\
  \n为了处理这些问题并在真实的估计和误导估计之间做出选择，评估这些估计的置信度至关重要。对于此类问题，开发了最新的机器学习方法，以全面表征估计的不确定性。在已被放弃的医学研究中，当试验贡献者的人口统计分布（通过年龄、性别、收入、地理区域等）与假设的人口和/或真实世界的人口差异很大时可能会变得复杂。这种失真可能会影响提取数据的可靠性和置信度。因此，需要考虑使用最佳方法；例如，参见\
  \ Akacha 等人 (2020) 及其参考文献。为了比较基础不确定性，协变量偏移机器学习方法也是解决此问题的最佳方式。\n\n## 1.2 深度学习框架\n\
  \n### 1.2.1 TensorFlow\n\n作为最著名的机器学习框架之一，它提供了一系列已经训练好的模型，帮助深度学习（DL）领域的工程师和专家创建 DL\
  \ 模型和算法。这一开源框架是 Google Brain 团队的脑力结晶。TensorFlow 允许深度学习开发者创建 DL 模型和算法。它在 CPU 和 GPU\
  \ 上均可运行，并支持大规模数据流。它通过图计算来构建深度学习模型。\n\n图 1.3 深度学习框架。\n\n#### 1.2.1.1 使用 TensorFlow\
  \ 的益处\n它运行良好，提供无缝性能，并因为 Google 支持而更新。\n\n#### 1.2.1.2 TensorFlow 的问题\nTensorFlow\
  \ 比竞争对手慢且不那么用户友好，并且不兼容 Windows 。\n\n### 1.2.2 Keras\n\nKeras 是构建在 TensorFlow 之上的开源框架。它是使用\
  \ Python 构建的，由 François Chollet 设计，旨在快速、用户友好且逻辑模块化。机器学习算法可以应用于医疗、企业分析、虚拟助手和销售预测等多个领域。一个名为\
  \ Keras 的高级 API 促进了跨平台和后端的连接。它被开发者用于快速原型设计，提供了一系列已经训练好的模型。\n\n#### 1.2.2.1 Keras\
  \ 的缺点\nKeras 框架难以处理底级计算，且发现其缺陷具有挑战性。\n\n### 1.2.3 MXNet\n\n深度学习开发者专门使用 MXNet。它支持编程语言和各种\
  \ GPU 以实现扩展性。长短期记忆网络、卷积神经网络和其他方法都可以由 MXNet 使用，它是多功能且移植的。它被应用于制造、医疗和交通等广泛领域。\n\n\
  #### 1.2.3.1 使用 MXNet 的益处\n支持的编程语言包括 R、Scala、Python、JavaScript、C++ 等。它是快速、有效且可扩展的。\n\
  \n#### 1.2.3.2 使用 MXNet 的缺点\n相对于 TensorFlow，它的开源社区支持较少，因此修复错误和功能更新需要更长时间。\n\n###\
  \ 1.2.4 Caffe\n\nCaffe（快速特征嵌入卷积架构）是一种用 C++ 构建的机器学习和 DL 框架。它适合分发前沿内容、分类照片和实验方法。学术界、中小型企业和初创公司经常使用\
  \ Caffe 执行视觉和语音识别任务。它提供了一个接口，允许软件人员在 CPU 和 GPU 之间切换。\n\n#### 1.2.4.1 使用 Caffe 的益处\n\
  它是开源且对开发者友好的。\n\n\n\n\n\n它对于计算资源有限的系统被广泛认可。\n\n#### 1.2.4.2 使用 Caffe 的缺点\n\n它的学习曲线非常陡峭。\n\
  \n不建议用于 `recurrent networks` 或序列建模。\n\n### 1.2.5 H2O\n\n它是另一个开源、面向业务的机器学习框架。它使得通过数学方法应用预测分析变得更容易，从而根据精确数据做出判断。利用数据洞察进行机器人训练得到了开源\
  \ Breed 技术的支持，该技术还支持数据库无关性。得益于 REST API，可以从任何其他源代码或脚本访问或嵌入 H2O 的 Java 核心。机器学习专家可以扩展\
  \ H2O 以与现代编程语言和技术配合。机器学习开发者除了分析保险、广告技术、风险、医疗保健和欺诈外，还将其应用于客户智能。\n\n#### 1.2.5.1 使用\
  \ H2O 的优点\n\nH2O 具有自适应性。\n\n使用 H2O 进行自动机器学习是高效的。对于具有各种编程经验的程序员来说，使用它非常简单。\n\n####\
  \ 1.2.5.2 使用 H2O 的缺点\n\nH2O 框架的扩展性太差。\n\n### 1.2.6 Theano\n\nTheano 是一个构建在 NumPy\
  \ 之上的机器学习库，是最快的库之一。它使用 CUDA 和 Python 开发，并根据 BSD 许可证发布。它允许用户优化机器学习应用中的数学表示，并被程序员用于处理多维数组。GPU\
  \ 和 CPU 平台都可以用于 Theano；然而，当使用后者时，它可以提供更快的结果。这种机器学习方法在 GPU 架构上使用时，执行任务的速度可以快 140\
  \ 倍。名为 Theano 的流行机器学习软件在物流和财务过程中有广泛用途。\n\nTheano 提供了单元测试和验证工具。支持指数函数和对数函数。可以自动避免缺陷。CPU\
  \ 和 GPU 架构都能处理数据密集型任务。\n\n#### 1.2.6.1 使用 Theano 的缺点\n\n它的编译时间明显长于 TensorFlow。\n\
  \n### 1.2.7 Shogun\n\n它是一个非常古久且老老的开源机器学习库。它集成了多种数据格式和机器学习方法。它用 C++ 编写，并与 C++ 实现了惊人的集成。由于它对\
  \ C++ 极其友好，因此在教育和学习领域很受欢迎。Shogun 还展示了与 Python、C#、Java、Lua、R 和 Ruby 等其他语言的兼容性。程序员利用\
  \ Shogun 为使用机器学习的应用程序处理海量数据。在广泛的系统上，开发者可以进行回归、分类或探索性分析活动。机器学习开发者在 NLP、教学和研究项目的工作中使用\
  \ Shogun。\n\nShogun 在快速原型设计中的适用性，以及其自适应和用户驱动的特性都是其优点。\n\n#### 1.2.7.1 使用 Shogun\
  \ 的缺点\n\n与 TensorFlow 或 Caffe 相比，Shogun 没有同等水平社区支持。\n\n## 1.3 基于深度学习的电子健康记录\n\n\
  电子健康记录（EHRs）和深度学习（DL）近年来都已成为主要的科技进展，并越来越多地应用于临床前药物发现领域。在这种背景下，EHR 在提供海量数据方面起着至关重要的作用。\n\
  \n## 1.4 深度学习在临床前药物发现中的作用\n\nDL 用于分析临床前药物发现中的 EHR 数据。DL 算法通过为分析 EHR 数据提供强大且高效的解决方案，正在改变临床前药物发现的领域。近年来，DL\
  \ 算法已成功应用于医疗保健行业的各种应用中，包括 NLP、图像分类和患者预后预测。\n\n### 1.4.1 卷积神经网络\n\n卷积神经网络（CNNs）是一种专门为图像分类任务设计的神经网络。它们被用于从\
  \ EHR 数据中提取和分析医学图像，例如 X 光、CT 扫描和 MRI 图像。CNNs 训练用于识别图像中的特定模式，这些模式可用于预测疾病、诊断状况和评估疗效。\n\
  \n### 1.4.2 循环神经网络\n\n循环神经网络（RNNs）是一种专门为序列数据设计的神经网络。它们被用于处理 EHR，EHR 通常包含大量的顺序数据点，例如实验室检测结果、患者生命体征和用药医嘱。RNNs\
  \ 可以分析顺序数据以预测未来事件，例如疾病进展或患者预后。\n\n### 1.4.3 长短期记忆网络\n\n长短期记忆网络（LSTM networks）是一种\
  \ RNN，专门设计用于处理序列数据中的长期依赖关系。它们被用于分析临床前药物发现中的 EHR 数据，以识别患者数据随时间变化的模式和关系。LSTM 还被用于预测患者预后，如再次入院医院或死亡。\n\
  \n\n\n\n\n# 生成对抗网络 (GANs)\n\nGANs 是一种神经网络，由两个部分组成：生成器和判别器。它们被用于生成合成电子健康记录（EHR）数据，这些数据可用于训练机器学习算法并评估它们的性能。GANs\
  \ 还可以用于填充 EHR 中的缺失数据，这是临床前药物发现中的一个常见问题。\n\n## 1.4.4 自动编码器\n\n自动编码器是一种神经网络，用于从复杂数据中识别并提取有意义的特征。它们被用于分析临床前药物发现中的\
  \ EHR 数据，以识别预测患者结果（如药效或毒性）的最重要特征。\n\n总之，在临床前药物发现中整合 EHR 和深度学习（DL）算法是一项具有前景的发展，有望改变药物的发现、开发和批准方式。深度学习算法通过为分析\
  \ EHR 数据提供强大高效的解决方案，在临床前药物发现领域发挥着至关的作用。这些算法已成功应用于医疗保健行业的各种领域，包括自然语言处理（NLP）、图像分类和患者结果预测。随着\
  \ EHR 和深度学习算法的不断进步，药物发现的未来是光明的，对改善人类健康具有巨大希望。\n\n## 1.5 数据收集与管理\n\n数据收集是关键过程，因为它是分析的基础。为了获得医疗保健行业的整体视图，应从所有方面提取数据，如医生详情、患者信息、健康记录、健康设备、医院、暴发地点、传播模式等\
  \ \\[15,16\\]。\n\n简而言之，医疗相关数据通过问卷调查、实验室观察和临床文档收集。在当前的数字时代，研究人员可以通过移动应用程序和网络论坛收集数据。\n\
  \n### 1.5.1 数据类型\n\n从医疗保健行业收集的数据分为两种：原始数据和次级数据。原始数据是直接从患者那里收集的原始数据。原始数据的关键来源包括显示疾病相关参数的\
  \ X 光图像、患者或医生的调查和问卷以及记录的健康数据。这些数据还包括关于患者的关键信息，如身高、体重、血压、血型等；次级数据是指从标准数据库中提取的数据，这些数据库由世界卫生组织等标准监管机构以及州和中央政府统计部门组成。\n\
  \n### 1.5.2 数据收集方法\n\n1. **数据众筹**\n   通过共享平台，可以从全球范围内各种贡献者处收集广泛的数据。这有助于实现数据多样性，这对更好地训练模型是所需的。但对收集的数据质量没有保证，而数量是可以满足的。数据收集方法见图\
  \ 1.5。\n\n2. **私有方式**\n   尽管这种方法非常传统，当我们需要从目标贡献者处获取敏感和隐私数据时，它是非常有效的。这仅适用于构建较小的数据。\n\
  \n3. **现有数据集**\n   当需要获取高质量的数据时，使用现有数据集是更好的选择。现有的标准数据集具有预处理和清洗的数据样本。这可能具有易实施和数据收集成本最低模式的优点。\n\
  \n4. **自动化工具**\n   使用开发的软件工具从在线数据源和社交媒体收集数据。当需要收集次级数据时，这是更好的数据收集选择。它是数据收集快速模式之一。\n\
  \n\n图 1.5 数据收集。\n\n随机数据收集并不是构建标准数据集。在收集数据时，质量至关重要。收集的样本数据必须是整个类型人群的适当代表。数据的完整性应当得到保护。收集的数据可能是各种类别，如连续数据、分类数据研究数据。在各种信息技术的帮助下，手动调查和问卷被基于软件的工具取代。基于移动和\
  \ Web 的应用程序广泛流行，并迅速覆盖大众。在这个数字时代，数据收集变得更容易，而定性数据的选择是关键。保持收集的原始数据不变是最佳实践。\n\n## 1.6\
  \ 临床研究中深度学习的操作障碍\n\n- 深度学习算法的准确性取决于用于训练模型的数据量。再次，对更多医疗数据有需求。\n- 尽管大多数医院记录现在都是电子记录，但获取医疗数据会违反隐私。\n\
  - 保持医疗数据安全至关重要。\n- 数据可视化是关键部分，因为大部分收集的健康数据具有多维特征。\n- 缺乏健康数据的适当文档。\n- 缺乏处理电子数据的熟练医疗人员。\n\
  - 全范围内缺乏系统和政策的整合。\n- 患者和护理人员犹豫于使用他们的健康数据进行实验分析。\n- 缺乏处理健康数据的强政策框架。\n- 人体行为是不可预测的，尽管预测取决于收集的数据。\n\
  - 用户和患者社区内部缺乏信任。\n- 基于机器学习的健康诊断会导致健康不平等。\n- 数据在患者数据来源的性别和国籍方面缺乏明确。\n\n## 1.7 深度学习算法的优点、缺点和应用\n\
  \n不同深度学习算法的比较见表 1.1。\n\n表 1.1 深度学习算法的优点、缺点和应用\n\n| 算法 | 监督/无监督 | 优点 | 缺点 | 应用 |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 反向传播 `[17]` | 监督 | 于实施。 | 仅对验证数据执行，而非训练数据。\
  \ | OCR，用于疾病检测语音分析 |\n| 自动编码器 | 无监督 | 对线性函数效果良好，但不适用于非线性变换。 | 对于数据图像的信息会出现数据特定的损失。\
  \ | 数据压缩，使用卡尔曼滤波去噪 |\n| 变分自动编码器 `[18]` | 无监督 | 对图像增强和图像训练模型很有帮助。 | 增强图像的数据准确性不好。\
  \ | 特殊组织和细胞检测 |\n| 受限玻尔兹机 | 无监督 | 可训练其他模型。可从查询发布的格式中提取数据。 | RBM 训练困难。你无法跟踪所需的损失（更不用说对其求导）。\
  \ | 应用于 PHR 模型，更好的医院管理 |\n| CNN `[19]` | 监督 | 图像分割易于进行微调分类。 | 去冗余像素值是一个巨大的挑战。 |\
  \ NLP 分类，图像处理 |\n| RNN | 无监督 | 可以处理任何长度的输入。 | 计算缓慢，训练困难。 | 临床试验队列选择 |\n\n\n\n\n\n\
  | LSTM | 无监督 | 它擅长对复杂的序列数据进行建模。 | 它不适用于序列数据。 | 疾病预测 |\n| --- | --- | --- | --- |\
  \ --- |\n\n## 1.8 药物递送中的临床试验\n\n临床试验是开发和将新药推向市场过程的关键步骤。它们被用于在受控环境中测试新药的安全性和有效性，并提供相关数据，向监管机构证明该药物在其预期用途上是安全有效的。药物递送是制药行业中一个快速发展的领域，其目标是通过开发新的创新方法将药物递送人体，以提高药物的有效安全性\
  \ [20,21]。这包括使用新类型的递送系统，如纳米颗粒、脂质体或微球，以及开发新的给药途径，如吸入或经皮给送。药物递送的临床试验旨在测试新递送系统或给药途径以及药物本身的安全性和有效性。这些试验通常涉及许多受试者，并分为几个阶段\
  \ [22]。\n\n### 第一阶段\n第一期试验通常是在人体上测试新药或递送系统的第一步。这些试验通常针对少数健康志愿者进行，旨在测试药物或递送系统的安全性，并确定最佳剂量。\n\
  \n### 第二阶段\n第二期试验通常在较多数量的受受试者中进行，旨在测试药物或递送系统在治疗特定疾病方面的有效性。这些试验还提供了关于安全性的额外信息，以及最佳给药剂量和给药方案的信息。\n\
  \n### 第三阶段\n第三期试验通常是大型、多中心的试验，在许多受试者中进行，旨在确认药物或递送系统的有效性和安全性。这些试验还提供了关于药物或递送系统长期安全性和有效性的重要信息。在三期临床试验之后，数据将发送给\
  \ `FDA` 进行审查，并决定是否批准该药物供一般使用。\n\n### 第四阶段\n还存在第四期临床试验，即上市后研究，在药物或递送系统被监管机构批准使用后进行。这些试验旨在提供关于药物或递送系统长期安全性和有效性的额外信息，并收集药物在真实世界环境中使用的数据。需要注意的是，药物在临床试验中的成功率很低。估计进入临床试验的药物中，只有约\
  \ 12% 最终获得了监管机构的批准。药物开发阶段如图 1.6（ch01.xhtml#fig1_6）所示。\n\n\n图 1.6 药物开发阶段。\n\n总的来说，药物递送中的临床试验是开发和将新药推向市场过程的关键步骤。这些试验旨在测试新递送系统、给药途径以及药物本身的安全性和有效性。这些试验产生的数据用于向监管机构证明该药物在其预期用途上是安全有效的。\n\
  \n## 1.9 深度学习在医疗保健中的应用\n\n`DL` 是一种使用多层神经网络来学习数据中复杂模式的机器学习。它已被应用于许多领域，包括医疗保健，并有望改变我们诊断和治疗疾病的方式。`DL`\
  \ 在医疗保健领域最有前景的应用之一是医学影像。`DL` 算法可以训练用于识别医学影像（如 `CT scans` 或 `MRIs`）中的模式，这些模式指示了特定的疾病或状况。例如，一个\
  \ `DL` 算法可以训练用于识别 `CT scans` 中的肿瘤，或在 `MRI` 中检测阿尔茨海默症的早期迹象。这可以导致更准确、更快速的诊断，以及更早发现疾病\
  \ [23]。\n\n`DL` 在医疗保健中应用的另一个领域是 `NLP`。`NLP` 是一种人工智能，允许计算机理解和处理人类语言 [24]。在医疗保健中，`NLP`\
  \ 可以从 `EHRs` 和其他医疗文档（如临床笔记和出院摘要）中提取信息。这可以用于改善患者护理和人口健康管理，并支持研究 [25]。`DL` 也被用于药物发现和开发。通过分析来自各种来源的大量数据（如基因组数据、药物药效数据和临床试验数据），`DL`\
  \ 算法可以帮助识别新的药物靶点并预测药物药效。这有助于加速药物开发过程，并发现新颖且更有效的药物 [26]。\n\n除了上述之外，`DL` 还用于医疗保健的其他领域，例如：\n\
  \n*   预测建模：`DL` 可用于预测患者结果，例如再住院的可能性或患特定疾病的风险 [27]。\n*   个性化医疗：`DL` 可以分析基因组数据和其他患者信息，以制定个性化治疗方案。\n\
  *   远程医疗：`DL` 可以分析远程医疗咨询的视频和音频数据，以改进对患者的远程诊断和治疗。医疗保健应用如图 1.7（ch01.xhtml#fig1_7）所示。\n\
  \n\n图 1.7 ML/DL 在医疗保健中的应用。\n\n尽管 `DL` 在医疗保健中有许多潜在益处，但也存在一些需要解决的挑战。主要挑战之一是需要大量高质量数据来训练\
  \ `DL` 算法 [28]。另一个挑战是 `DL` 模型缺乏可解释性，这使得难以理解模型为何做出某个特定决策。总的来说，`DL` 通过提高诊断的准确性和速度，以及支持研究和药物开发，具有彻底医疗保健的潜力。然而，还需要更多研究来解决深度\
  \ `DL` 在医疗保健中的挑战，并充分实现其潜力 [29,30]。\n\n## 1.10 结论\n\n在本章中，我们讨论了 `DL` 在药物递送中的重要性，以及用于改进药物递送和医疗管理的预测模型。`EHR`\
  \ 在健康信息技术中起着重要作用；基于早期记录的疾病预测和药物将赋予更大的价值。数据管理对于所有应用都关重要，而医疗保健更是，因为必须处理大量的混合数据集。在智能决策临床试验中，基于\
  \ `EHR`、个人健康记录和电子病记录，可以使用不同的 `DL` 和机器学习技术提取数据，以实施更好的药物递送系统。\n\n## 参考文献\n\n1.  Meinl,\
