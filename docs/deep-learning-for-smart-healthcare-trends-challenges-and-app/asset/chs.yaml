  \ \\ast 100 = 85\\%$\n\n让我们以 20 张乳腺图像为例。在 `CWFE-DL`、`Deep CNN` 和 `CNNI-BCC` 等所有比较技术中均计算了分类准确率。所提出的\
  \ `CWFE-DL` 技术正确分类了 18 张乳腺图像，其准确率为 90%。而 `Deep CNN` 和 `CNNI-BCC` 技术正确分类的乳腺图像数量分别为\
  \ 15 张和 17 张，其准确率分别为 75% 和 85%。乳腺癌的预测与 `CWFE-DL` 以及另外两种方法进行了比较，后者的结果以更高的准确水平计算。在\
  \ 图 2.4 中，报告了所有技术在不同数量乳腺图像下的准确率。\n\n\n图 2.4 分类准确率。\n\n**CWFE-DL 算法**\n**输入**: 输入图像数量\
