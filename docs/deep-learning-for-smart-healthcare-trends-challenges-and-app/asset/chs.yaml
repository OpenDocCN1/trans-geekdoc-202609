  \ 7 引言\n\n物联网（IoT）的发展改变了几乎所有领域，包括教育、交通和医疗领域，通过连接设备进行通信、共享和存储。物联网对医疗领域产生了重大影响，并通过智能网络提供了更可靠的结果[1][2]。\n\
  \n医疗物联网（IoMT）是指通过安全网络进行数据传输，并对疾病进行即时监测的医疗设备[3][4]。\n\n基于人体植入式功能，由于需要定期充电或更换电池，传统的远程监测系统[5][6][7]对患者来说是不舒适的。医疗物联网（IoMT）通过创建微型物联网设备和优化的通信通道解决了上述问题[8]。\n\
  \n在家里或救护车内的患者观察区域是远程医疗系统的重要组成部分[9][10][11]。患有慢性疾病的患者可以根据物联网进行监测，在紧急情况下可以提供及时的诊断。在医疗物联网中，传感器通过无线通信支持数据交换，并获取处理大量数据，为医疗专业人士提供见解[12][13][14]。\n\
  \n根据调查结果，一些老年人的依赖程度正在不断增加。独自居住的老人的孤独感大多归因于现代生活方式。在某些情况下，他们被忽视且无法获得及时的护理，这可能对他们的健康有害。现在，对抑郁、血压、睡眠、心脏功能和疼痛的监测通过各种基于计算机的患者监测技术进行[15][16][17]。\n\
  \n\n\n\n在患者监测系统的硬件方面，使用了传感器和专用硬件来 get 患者行为监测、姿态监测 \\[25\\]以及疼痛检测；而在软件端，则采用了机器学习和计算机视觉算法。为了监测健康状况，患者对在身上连接传感器并没有表现出任何兴趣。因此，面部表情被用作疼痛检测的方法。然而，只有当患者正对着摄像头时才能捕捉到面部情绪\
  \ \\[26,27]。与此类似，基于姿态的监测策略侧重于使用多个摄像头。\n\n所提出的基于 `AX-YOLOV5`（任意极大你只看一次第 5 版）算法的非侵入性不适检测\
  \ \\[28,29,30\\]可以克服这些缺点。所提模型不需要不同的传感器和视线设备。为了在视频输入中定位患者，应用 `AX-YOLOV5` 算法。此外，使用\
  \ `AlphaPose` 库检测人体的 17 个关键位置 \\[31,32\\]，并使用 `IP camera` 持续记录患者的动作。为了在实时照片中确定人体的位置，使用了\
  \ `AX-YOLOV5` 算法。通过关联挖掘规则，将关键点与人体五个最关键的关键点坐标相关联。利用这些区分特征来判断患者是坐着还是躺在床上。在时间阈值技术的帮助下，通过跟踪身体主要部位坐标随时间变化的频率，可以识别医疗健康问题。最后，根据重要位置之间的距离和时间阈值对患者身体的疾病进行分类。此外，可以获取关键点的坐标，以精确确定人体内的正确病变。\n\
  \n本章涵盖的研究安排如下：第 7.2 节 提供了详尽的文献综述回顾；患者的不适检测过程见第 7.3 节；机器学习训练过程的数据集和系统配置摘要见第 7.4 节；患者不适检测算法的实现描述在第\
  \ 7.5 节；`AX-YOLOV5` 模型训练阶段讨论在第 7.6 节；各种性能指标的计算表示在第 7.7 节；基于神经网络的各种性能指标的比较结果见第 7.8\
  \ 节；研究论文的结论讨论在第 7.9 节。参考文献位于最后。\n\n## 7.2 相关工作\n\n在医疗控制领域，近期已付出巨大努力。包括计算机视觉、机器学习和深度学习在内的多个领域已取得进展。本部分将简述最近开发的系统和方法。对于涉及患者监测的应用，研究人员提出了各种跌倒检测和监控系统\
  \ \\[33\\]。这也被认为是一项重要程序，因为它是许多致命伤口的关键阶段，特别是在追踪老年人方面。脑电图 \\[34\\]用于评估患者行走时的损伤，而支持向量机使用径向基函数核来分析数据。在这里，使用了一种非侵入性设备在患者移动时追踪其疼痛水平。该研究的主要目标是早期识别疼痛强度，以减轻疼痛带来的抑郁。提出支持向量机（`SVM`）通过患者疼痛的面部指标对疼痛与无疼痛表情进行分类\
  \ \\[35,36\\]。使用活跃外观模型对数字化面部图像的参数和形状进行解耦 \\[37\\]。\n\n睡眠追踪认为是患者健康的重要标志。在典型的睡眠监测系统中，会记录睡眠习惯，包括醒/睡时间、身体部位活动习惯、心率和呼吸频率的波动以及睡眠姿态。深度分析方法的开发\
  \ \\[38,39\\]允许在用户睡眠期间对其呼吸率、睡眠姿态和身体活动进行非接触监测。实验中要求八名志愿者每 15 次呼吸在床上切换仰卧和侧卧睡眠姿态。结果表明，所提技术可能成功检测处于各种睡眠位置和体型的头部和躯干。为了持续识别睡眠状态（包括床上活动、下床和呼吸阶段），`Sleep\
  \ Sense` \\[40\\]通过监测运动声音声音有效追踪睡眠状态，并根据多普勒效应捕捉睡眠运动和噪声，这包含了 `Sleep Sense` 的三个部分。对于睡眠识别框架，这项工作发布了许多\
  \ TD 和 FD 属性。对于医疗治疗、健康保健和健身行业，能够追踪关键体征之一呼吸率至关重要。提出使用一种新颖可靠的方法进行呼吸监测 \\[41\\]，该方法可以准确提取出心脏跳动次数和体温等极具动态性的属性，同时也考虑了氧摄入和持续身体运动，有助于有效保护患者健康。通过在高度热动力学环境中受控呼吸运动期间评估，确立了系统监测鼻部区域的卓越耐用性，并记录呼吸频率。\n\
  \n多信号分类（`MUSIC`）方法 \\[42\\]取决于基于子空间的方法，用于引入的射频系统帮助确定呼吸频率。该研究的作者使用红外视觉传感器监测呼吸。许多研究人员创建了与呼吸监测类似的睡眠监测方法。为了追踪呼吸率，他们追踪了胸部和腹部肌肉的活动，并对鼻部区域进行红外扫描。后续研究论文涵盖了创建和部署一种适应、可扩展且廉价的无线传感器医疗系统，用于远程监测多个关键生理参数。\n\
  \n\n\n\n脑电图（EEG）监测 [43] 可以通过无线 EEG 设备在临床环境之外进行，这允许患者不受限制地进行正常生活。然而，使用此类设备收集、加密并将\
  \ EEG 数据传输到后端会消耗大量能量。目前，EEG 有多种患者监测模型。\n\n基于面部的分析已用于疼痛检测和抑郁监测。这项工作 [44,45,46] 使用基于特征的方法，利用面部表情进行疼痛检测。使用\
  \ `Prkachin` 和 `Solomon` 疼痛强度指标来评估不同程度的疼痛强度，以便识别和研究疼痛。除了闭上眼睛外，该矩阵还考虑了许多与面部表情相关的方面，如抬眉、压眉和紧绷肌肉。研究人员始终关注每一个患者，正如前所述，所有系统和程序中都创建了各种医疗系统以高效地监控患者的健康。为了读取和记录各种指标，这些建立的系统需要在人的床上或身体上安装传感器或设备，这成本很高，且患者并不喜欢。很少有科学家实验过基于视觉的技术；相反，他们大多使用红外或深度摄像头来跟踪呼吸、识别跌倒和跟踪睡眠\
  \ [47,48,49]。也创建了基于面部表情的系统；然而，该系统需要一个睁着眼睛的摄像头。研究人员使用运动和姿态数据，来确定睡眠状态和身体部位的关键点。\n\n\
  在这项工作中，基于医疗健康物联网（IoHT），系统可以同时处理和监测多个患者，并可以在目前的病房布局中运行。我们的系统独立于专家设备、豪华床或除顶摄像头以外的可穿戴技术，这是其主要优势之一。缺点之一是，患者从未关注医疗治疗过程的所有步骤。\n\
  \n## 7.3 建议的系统\n\n`AX-YOLOV5` 是一种基于深度学习的算法，用于在实时图像中识别人体位置。涉及的分步过程见图 7.1。最初，`IP`\
  \ 摄像头持续捕捉医院中患者人体的运动，从视频中提取输入图像。在预处理阶段，患者图像作为输入保留，消除了输入图像中的噪声。图像数据集由医院的监控视频创建。该图像数据集被应用于\
  \ `AX-YOLOV5` 模型，以正确训练深度学习模型并避免过拟合。`Alpha pose` 库检测患者身体的 17 个关键点以及由关键点构成的器官，这是通过挖掘关联规则完成的。这有助于检测患者人体的重要器官。\n\
  \n![图 7.1 不适检测系统的分步过程。](img/fig7_1.jpg)\n\n图 7.1 不适检测系统的分步过程。\n\n两个连续图像帧之间关键点之间的欧几里得距离可以计算，然后用\
  \ `T` 值进行评估。如果距离大于阈值，则认为患者处于不适状态。否则，患者处于舒适阶段。图 7.2 图形化表示了基于 `AX-YOLOV5` 的患者不适方法。\n\
  \n![图 7.2 基于 AX-YOLOV5 的患者不适方法。](img/fig7_2.jpg)\n\n图 7.2 基于 AX-YOLOV5 的患者不适方法。\n\
  \n在这种方法中，输入图像从 `NTU RGB+D` 视频数据提取。这些图像被应用于 `AX-YOLOV5` 模型，以提取患者的特征区域以识别部位。彩色图像的处理降低了模型的性能和存储，因此系统需要使用\
  \ `Maxout` 技术减少输入图像的维度，从而最大限度地减少沉重处理时间和存储的负担。\n\n图像区域填充有边界框，我们需要从中选择正确的边界框进行患者器官监测。从患者图像中使用带有置信度评分的非极大抑制技术（`NMS`）选择正确的边界框是最佳选择。该技术根据交并比（`IoU`）的比较为每个边界框产生置信度评分，为大多数器官产生各种分辨率的边界框。`AX-YOLO\
  \ V5` 可以并行处理不同尺寸的边界框并从图像中提取特征。由于这种并发过程，在有效检测边界框时可能会发生一些损失。通过以下公式评估损失函数：\n\n```\n\
  B(l)  =  B(l)[cl]  +  B(l)[r]  +  B(l)[m] (7.1)\n```\n\n在公式 7.1 中，`B(l)` 代表从边界框评估的损失函数，`B(l)[cl]`\
  \ 表示分类过程中的分类损失，`B(l)[r]` 代表回归损失，`B(l)[m]` 是图像掩码损失函数。`B(l)[cl]` 可以通过公式计算：\n\n```\n\
  B(l)cl  = −  loglog prob[T] (7.2)\n```\n\n在公式 7.2 中，`T` 代表边界框检测的真实性，`prob` 表示各种边界框的概率值，表示为\
  \ `prob = (p[i], p[i+1], p[i+2],…p[i+n])`。回归损失可以计算为：\n\n```\nB(l)r  =  ∑[a] (7.3)\n\
  ```\n\n其中 `R={a,c,b,h}` 是实际框，`G^T` 是集合 `T` 的绿色框。\n\n在公式 7.3 中，`L1` 表示：\n\n```\n\
  L1  =  0.5x (7.4)\n```\n\n在公式 (7.1) 中，`B(l)[m]` 表示掩码过程的总体损失，输出为：\n\n```\nB(l)[m]\
  \ = 1/k² ∑_{xy} [S_{xy}logQ_{xy}^T + (1 - S_{xy}^T)] (7.5)\n```\n\n在公式 7.5 中，`S`\
  \ 代表实际掩码，用红色边界框 `{0,1}` 表示，`Q^T` 代表预测框，用绿色表示。\n\n深度学习模型掩码了 `MS-COCO` 数据集中患者身体的 17\
  \ 个关键点，即左右肩关节、膝盖关节、踝关节等，列于表 7.1。持续监测关键点位置，以从视频序列中检测患者的不适。在某些情况下，我们预定义了患者的一些动作被视为：\n\
  \n 表 7.1 关键点与部位 ID\n\n| 索引 | 关键点 | 部位 ID |\n| --- | --- | --- |\n| 0 | 鼻子 | 头(1)\
  \ |\n| 1 | 左眼 | |\n| 2 | 右眼 | |\n| 3 | 左耳 | |\n| 4 | 右耳 | |\n| 5 | 左肩 | 左臂(2) |\n\
  | 6 | 左肘 | |\n| 7 | 左腕 | |\n| 8 | 右肘 | 右臂(3) |\n| 9 | 右肩 | |\n| 10 | 右腕 | |\n| 11\
  \ | 左髋 | 左腿(4) |\n| 12 | 左膝 | |\n| 13 | 左踝 | |\n| 14 | 右髋 | 右腿(5) |\n| 15 | 右膝 |\
  \ |\n| 16 | 右踝 | |\n\n\n\n\n\n- 如果身体的任何部位出现皮疹或疼痛，且患者持续揉搓相应部位，这些情况可以进行持续监测。\n- 当患者由于疼痛而抖动两侧手脚，有时会因头痛而反复按摩头部。\n\
  \n上述约束将根据不同的疾病而变化。为了避免此类情况，创建了一个通用平台来识别不适感，这可以有效监测患者的身体运动。可以通过其关键点对身体部位进行分析和跟踪。为了检测图像帧中器官的运动，在图像帧中应用了欧里得距离公式。在等式\
  \ 7.6 中，使用欧里得距离公式检测预定义边界附近的最近端点。\n\n$E = \\\\sqrt{{({j\\_{xj} - j\\_{xj - 1}})}2\
  \ + (j\\_{xj} - j\\_{xj - 1})2}}$ (7.6)\n\n阈值设置为默认值，与距离关键点进行比较，以便于选择两个不同的图像帧。阈值\
  \ `T` 的条件通过以下等式 7.7 定期监控：\n\n`T` = {1, `D` > `d`[`p`] 0, `Otherwise` (7.7)\n\n等式\
  \ 7.8 识别两个连续图像帧之间的距离，以确保身体运动。通过各种数据集定期对患者身体进行分析。\n\n`Body` = {1, `if` `V`[`i` = 1]^(`n`)`) = 1\
  \ 0, `Otherwise` (7.8)\n\n通过等式 7.9 定期随访患者状况\n\n`Icon`[`Patient`]={`Discomfort`,`body`→`T`[`t`]\
  \ `Comfort`,`otherwise` (7.9)\n\n`Icon`[`Patient]` 代表患者的状况，它识别了舒适与不适之间的差异。一旦模型使用图像数据集完成训练，算法的预测率将大幅提高，达到约\
  \ 99.25% 的结果。\n\n## 7.4 数据集\n\nNTU RGB+D 125 数据集展示了所创建的方法如何在各个位置定位人体的关键点。重要元素被进一步组织成人体骨架和六个器官。找到关键点后，利用关键点的相关数据对成对距离进行检查。根据时间规定识别患者的困难程度。\n\
  \n建议的实验使用 Radeon RX 5500 XT 8GB GPU、32GB DDR3 内存和 Intel Core i7-7700 处理器进行。使用图形处理器可以缩短用于目标检测模型的训练时间。凭借数百万视频样本和\
  \ 62 个动作捕获，NTU RGB+D 125 是一个包含 RGB+D 人体动作识别的大型数据集。数据集中的每个样本都包含深度图序列、红外电影、RGB 视频和\
  \ 3D 骨骼数据。每个 RGB 视频帧的分辨率为 2560×1440 像素，而 IR 视频帧的分辨率为 640×480 像素。所提系统由数据集中的 3D 彩色图片确定患者的健康问题。\n\
  \n## 7.5 用于不适检测的 AX-YOLOv5 算法实现\n\n1. 从 NTU RGB+D 数据集获取输入。\n2. 应用 Maxout 技术对输入图像进行预处理以降低维度。\n\
  3. 提出有效区域（即使用 `AX-YOLOv5` 时输入图像中的 `ROI`）。\n4. 此步骤持续应用于非极大值抑制技术（`NMS`）以检测目标。\n5.\
  \ 通过 `IoU` 技术检测重叠物体的边界框。\n6. 步骤 3、4 重复以预测不适。\n7. 通过欧里得距离公式监测图像帧。\n8. 当欧里得距离大于阈值\
  \ `T` 时视为不适，否则为舒适。\n\n## 7.6 模型训练\n\n使用 Radeon RX 5500 XT 8GB GPU、32GB DDR3 内存和\
  \ Intel Core i7-7700 处理器。训练过程在隐藏层完成。我们使用 `TensorFlow` 框架进行 `YOLOv5` 训练，所提模型达到了 95%\
  \ 的平均精度。结合 `ADAM` 优化算法使用了 0.0003 的学习率。收敛率达到第 60 个 epoch。\n\n## 7.7 性能指标\n\n指标分为两类：回归指标和分类指标。回归指标通常处理连续值。同样，分类指标仅考虑离散值。这两种指标适用于监督学习模型。从这些指标中可以轻松识别不适误差。\n\
  \n### 7.7.1 回归指标\n\n#### 7.7.1.1 平均绝对误差 (MAE)\n\n该指标计算预测值与实际值之间的绝对误差。预测不适的情况通过等式\
  \ 7.10 测量。\n\n$MAE = \\\\frac{1}{M}\\sum\\limits_{j = 1}^{M}\\left| {x\\_{j} - \\\
  widehat{x}}\\_{j}} \\right|$ (7.10)\n\n#### 7.7.1.2 均方偏差 (MSD)\n\n该指标寻找实际值之间的关系。它通过平方函数自动消除负值。如果模型预测出现误差，结果将会显示误差。这是患者健康识别的另一种误差检测形式，通过等式\
  \ 7.11 测量。\n\n$MSD = \\frac{\\sum{({x\\_{j} - \\widehat{x}}\\_{j}})}^{2}}{M}$ (7.11)\n\
  \n#### 7.7.1.3 均方根误差 (RMSE)\n\n该指标使用欧里得距离预测误差，即均方偏差的平方根。器官的活动性可以通过欧里得距离公式进行监测。通过等式\
  \ 7.12 计算。\n\n$RMSE = \\sqrt{\\left( {MSD} \\right)}$ (7.12)\n\n### 7.7.2 分类指标\n\
  \n分类指标仅产生真或假形式的离散输出。分类下有多种指标可以评估模型性能。\n\n#### 7.7.2.1 准确率\n\n准确率 (`A`) 是分类下的一个指标，它能够准确预测不适的正确位置，通过从总观测值中预测真实预测来实现。这由等式\
  \ 7.13 表示。\n\n$A = \\\\frac{True\\\\mspace{9mu} Predictions}{Total\\\\mspace{9mu}\
  \ Observations}$ (7.13)\n\n其中真实预测= TN+TP，总观测值= TP+TN+FP+FN\n\n\n\n\n\n根据上述因素，衍生出了许多性能目标，包括\
  \ `TP`、`FP`、`accuracy`、`precision` 和 `recall`。图 7.3 和 图 7.4 显示了典型的 `TP`、`FP` 以及每个身体器官的损失率。\n\
  \n![图 7.3 不同身体器官的 TP 和错误率](img/fig7_3.jpg)\n图 7.3 不同身体器官的 TP 和错误率\n\n![图 7.4 不同身体器官的\
  \ FP 和错误率](img/fig7_4.jpg)\n图 7.4 不同身体器官的 FP 和错误率\n\n它能够以惊人的准确率识别姿势照片集中的多个身体器官。图\
  \ 7.3 和 图 7.4 中的 y 轴显示了所系统的平均 `TP` 和 `FP`，而 x 轴显示了各种身体部位。可以看出，各种身体器官的平均 `TP` 超过了\
  \ 92%。在此期间`FPR` 在 9% 到 7% 之间波动。我们还提供了各种身体器官的 `TP` 和 `FP` 错误率，如图 7.3 和图 7.4 所示。使用标准差法来确定错误率。如图\
  \ 7.3、图 7.4、图 7.5、图 7.6、图 7.7、图 7.8 所示，我们还确定了各种身体部位的典型精确率、`TPR`、`accuracy` 和 `PPV`。\n\
  \n![图 7.5 不同身体器官的平均精确率](img/fig7_5.jpg)\n图 7.5 不同身体器官的平均精确率\n\n![图 7.6 不同身体器官的召回率](img/fig7_6.jpg)\n\
  图 7.6 不同身体器官的召回率\n\n![图 7.7 不同身体器官的准确率](img/fig7_7.jpg)\n图 7.7 不同身体器官的准确率\n\n![图\
  \ 7.8 错误矩阵](img/fig7_8.jpg)\n图 7.8 错误矩阵\n\n### 7.7.2.2 交并比 (IoU)\n\n`IoU` 是一种用于衡量目标检测预测准确性的评估指标，它通过边界框的交集面积除以边界框的并集面积来计算。该方法在目标检测中被广泛使用。其计算方法见于公式\
  \ 7.14：\n\n$IoU = \\frac{Area\\\\mspace{9mu} of\\\\mspace{9mu} Intersection\\\\\
  mspace{9mu} of\\\\mspace{9mu} boxes}{Area\\\\mspace{9mu} of\\\\mspace{9mu} Union\\\
  \\mspace{9mu} Boxes}$ (7.14)\n\n阈值 (`T`) 设置为 0.5，`IoU =1` 为最大值。\n\n```\nif the value\
  \ of IoU>=T, then the prediction is correct\nor else the prediction is incorrect\
  \ (i.e., the patient is not identified efficiently).\n```\n\n图中 y 轴显示了所系统的 `AP`、`PPV`、`TPR`\
  \ 和 `accuracy` 值，而 x 轴显示了各种身体器官。精确率、召回率和准确率随每个身体和器官的运动而变化。通过检测患者运动、关键点和身体器官，可以看出该系统产生了准确的发现。所有测试视频序列的准确率都高于\
  \ 91%。同样，系统的 `PPV` 速率很高，这表明大多数检测到的关键点和身体器官运动值与真实值的坐标值匹配。在精确率约等于 70% 时产生相同的结果，并表征了大多数情况下的系统整体性能。\n\
  \n#### 7.7.2.3 预测正值 (PPV)\n\n通常，预测预测值可以通过错误矩阵确定，如图 7.8 所示。\n\n`PPV` 也称为精确率，用于仅分类数据集中的正性观测值。该指标有助于正确识别患者的健康问题，其计算方法见于公式\
  \ 7.15：\n\n$PPV = \\frac{True\\\\mspace{9mu} Positive}{Predicted\\\\mspace{9mu}\
  \ Positive}$ (7.15)\n\n其中 `True Positive` = `TP`，`Predicted Positive` = `TP+FP`\n\
  \n基于平均精确率 (`mAP`) 的性能评估显示，各种 `IoU` 值范围在 0.55 到 0.97 之间，固定步长为 0.06。在 95 小时的训练中，`AX-YOLOV5`\
  \ 在 15k 步长下针对各种 `IoU` 值进行了训练。\n\n模型的预测预测值具有各种尺寸的 `mAP`，形式为边界框的 `mAP(s)`、`mAP(m)`、`mAP(l)`\
  \ 和 `mAP(xl)`。这里，小、中、大特分类 `IoU` 值范围在 0.5 到 1.0 之间，如表 7.2 所示。\n\n表 7.2 基于 VGG NET-19\
  \ 的 AX-YOLOV5 各种 IoU PPV 值\n\n| S.No | 参数评估指标 | mAP Score |\n| --- | --- | --- |\n\
  | 1 | 边界框 PPV-mAP(s) | 0.6744125 |\n| 2 | 边界框 PPV-mAP(m) | 0.6744125 |\n| 3 | 边界框\
  \ PPV-mAP(l) | 1.0 |\n| 4 | 边界框 PPV-mAP(xl) | 0.8712448 |\n\n`mAP` 指标随步长的比较见表 7.3。\n\
  \n表 7.3 mAP 与 步长\n\n| Metrics | 520 | 2.5k | 5k | 7.5k | 10k | 12.5k | 15k |\n|\
  \ --- | --- | --- | --- | --- | --- | --- |\n| mAP(s) | 0.5015 | 0.5976 | 0.7256\
  \ | 0.7566 | 0.7587 | 0.7887 | 0.7987 |\n| mAP(m) | 0.5015 | 0.5977 | 0.6792 | 0.7092\
  \ | 0.7556 | 0.7890 | 0.7987 |\n| mAP(l) | 0.8915 | 0.8999 | 0.9204 | 0.9489 | 0.9845\
  \ | 0.9967 | 1.0 |\n| mAP(xl) | 0.4957 | 0.5967 | 0.8233 | 0.8345 | 0.8768 | 0.9180\
  \ | 0.9456 |\n\n`mAP` 指标迭代次数从 520 开始到 15k，步长为 0.06。该表清楚地显示 `IoU` 值产生的大参数范围从 0.8915\
  \ 到 1.0。表的结论是 `mAP(l)` 在 15k 处有效预测了区域。\n\n#### 7.7.2.4 患病率 (Prevalence)\n\n`Prevalence`\
  \ 是错误矩阵指标之一，它仅涵盖总结果中的正性部分。该指标仅取人体的预测预测，其计算方法见于公式 7.16：\n\n$P = \\frac{Actual\\\\\
  mspace{9mu} Positive}{Total\\\\mspace{9mu} Observations}$ (7.16)\n\n其中 `Actual Positive`\
  \ = `FN+TP`，`Total Observations` = `TP+TN+FP+FN`\n\n#### 7.7.2.5 敏感性 (Sensitivity)\n\
  \n`Sensitivity` 也称为真阳率或 `recall`。该指标适用于正确分析正性病例，使其能够完美预测器官诊断。其计算方法见于公式 7.17：\n\n\
  $S = \\frac{True\\\\mspace{9mu} Positives}{Actual\\\\mspace{9mu} True}$ (7.17)\n\
  \n其中 `True Positives` = `TP`，`Actual True` = `TP+FN`。\n\n在此，它仅关注不同像素尺寸的敏感区域，如小、中、大极大。迭代过程从\
  \ 520 步到 15k 步。模型的真阳率具有各种尺寸的 `mAP` 值，形式为边界框的 `mAP(s)`、`mAP(m)`、`mAP(l)` 和 `mAP(xl)`。这里，小、中、大、极分类\
  \ `IoU` 值范围在 0.5 到 1.0 之间，如表 7.4 所示。\n\n表 7.4 基于 VGG NET-19 的 AX-YOLOV5 各种 IoU TPR\
  \ 值\n\n| S.No | 参数评估指标 | mAP Score |\n| --- | --- | --- |\n| 1 | 边界框 TPR-mAP(s)\
  \ | 0.7991085 |\n| 2 | 边界框 TPR-mAP(m) | 0.7991085 |\n| 3 | 边界框 TPR-mAP(l) | 0.7991085\
  \ |\n| 4 | 边界框 TPR-mAP(xl) | 0.7991085 |\n\n`TPR` 指标值随步长的比较见表 7.5。\n\n表 7.5 TPR\
  \ 与 步长\n\n| Metrics | 520 | 2.5k | 5k | 7.5k | 10k | 12.5k | 15k |\n| --- | ---\
  \ | --- | --- | --- | --- | --- |\n| TPR(s) | 0.5015 | 0.5976 | 0.7256 | 0.7566\
  \ | 0.7587 | 0.7887 | 0.7987 |\n| TPR(m) | 0.5015 | 0.5977 | 0.6792 | 0.7092 | 0.7556\
  \ | 0.7890 | 0.7987 |\n\n\n\n\n\n| `TPR(l)` || 0.7838 || 0.7957 || 0.8230 || 0.8828\
  \ || 0.8891 || 0.8962 || 0.9228 |\n| `TPR(xl)` || 0.7838 || 0.7957 || 0.8230 ||\
  \ 0.8828 || 0.8768 || 0.8962 || 0.9228 |\n\n### 7.7.2.6 假阴性率 (False Negative Rate,\
  \ FNR)\n\n`FNR` 指标仅假阴性（即预测错误的案例）。通常，在人体器官诊断过程中，会发生一定比例的缺陷或错误，可以通过 `FNR` 进行识别，并由公式\
  \ 7.18 进行测量：\n\n$FNR = \\frac{False\\mspace{9mu} Negatives}{Actual\\mspace{9mu}\
  \ True}$ (7.18)\n\n其中 `False Negatives`=`FN`，`Actual True`=`TP` + `FN`\n\n### 7.7.2.7\
  \ 假阳性率 (False Positive Rate, FPR)\n\n`FPR` 指标也称为误诊率。它用于预测错误的结果（例如，将未怀孕预测为怀孕）。这将计算\
  \ `AX-YOLOV5` 模型的错误率，可以通过公式 7.19 进行计算：\n\n$FPR = \\frac{False\\mspace{9mu} Positive}{Actual\\\
  mspace{9mu} False}$ (7.19)\n\n其中 `False Positive`=`FP`，`Actual False`=`TN` + `FP`\n\
  \n#### 7.7.2.8 特异性 (Specificity)\n\n`Specificity` 是用于正确预测负性病例的指标。该指标在有效预测人体器官负面问题方面非常有用，可以通过公式\
  \ 7.20 进行测量：\n\n$SP = \\frac{True\\mspace{9mu} Negatives}{Actual\\mspace{9mu} False}$\
  \ (7.20)\n\n其中 `True Negatives`=`TN`，`Actual False`=`TN` + `FP`\n\n#### 7.7.2.9\
  \ F1 分数 (F1-Score)\n\n`F1-score` 指标是正预测值 (`PPV`）和敏感性 (`S`）的结合。当数据不均匀时，可以用此指标代替准确率。它由上述两个指标的调和平均数表示。即使在数值不均匀的情况下，在预测患者人体器官不适方面也有效，可以通过公式\
  \ 7.21 进行测量：\n\n$F1 - Score = \\frac{PPV \\ast S}{PPV + S}$ (7.21)\n\n基于 `VGGNET-19`\
  \ 的 `AX-YOLOV5` 模型在检测患者不适方面表现出比其他神经网络更好的性能。\n\n## 7.8 比较结果\n\n通过对各种研究论文中的各种深度学习模型的结果进行调查，汇总了如下结果，详见表\
  \ 7.6。\n\n表 7.6 CNN、PPV、TPR 和 F1 分数的比较\n\n| 模型 || 神经网络 || PPV || TPR | F1-Score\
  \ |\n| --- | --- | --- | --- | --- |\n| `AX-YOLOV5` || `VGG NET-19` || 84.1% ||\
  \ 89.2% || 89.7% |\n| --- | --- | --- | --- | --- |\n| `Darknet53` || 79.5% || 77.4%\
  \ || 79.82% | |\n| `ResNet-50` || 82.5% || 81.4% || 80.06% | |\n\n与各种神经网络的训练时间和及步数的比较在表\
