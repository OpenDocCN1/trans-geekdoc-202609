  \ Software, vol. 176, p. 103370, 2023.\n\n\n\n\n# 9. 受限玻尔兹曼机 (RBMs)\n\n# 10. 自动编码器\n\
  \n深度学习算法能够应用于几乎所有格式的数据中，并且不会消耗大量的计算能力。同时，它们拥有足够的信息来解决复杂的问题。在本章中，让我们深入探讨上述的深度学习算法。\n\
  \n## 12.3.1 卷积神经网络 (CNNs)\n\n卷积神经网络也称为 `ConvNets`，由多个层组成，主要用于图像处理技术和目标检测方法。1988\
  \ 年，Yann LeCun 开发了第一个 `CNN`。当时，它被命名为 `LeNet`。在该算法存在于研究市场的初始阶段，大多数研究人员在推导出实时目标以预处理算法执行方面正面临着挑战。在后期阶段，基于初始研究的试错结果，演化出了一种定义模拟实时场景的目标和问题定义方法的模式。\n\
  \n### 12.3.1.1 CNN 的工作原理\n\n`CNN` 在具有多层定义的目标识别方法框架上工作。这有时为新模式的识别铺平道路。\n\n### 12.3.1.2\
  \ 卷积层\n\n在一组不同模式数据上维持多级滤波器应用技术的设计，倾向于产生一个卷积 `[2]`。`CNN` 算法也有这样的卷积。\n\n### 12.3.1.3\
  \ 修正的线性单元 (ReLU)\n\n这是一层有助于获得输入数据以及处理步骤之间一致性的层。在 `CNN` 算法中，该层可以在识别模式后应用，并且输入数据已通过所有属性进行了预处理。通过迭代这一步骤，`CNN`\
  \ 算法在待考虑的输入参数的数据集中获得一个修正的线性单元。\n\n### 12.3.1.4 池化层\n\n在 `ReLU` 中获得的特征图被形成一个序列，然后作为输入数据集馈给下一层。由于数据集来自不同的环境并寻求不同的工作模型，这一阶段通常被称为池化层。\n\
  \n在这一层中，最显著的活动是数组数据的转换。大多数算法在多维数据集上工作。因此，在传递参数之前，有必要将数据集分类为二维数组 `[3]`。这一预处理步骤形成了一个一致的特征图数组。\n\
  \n### 12.3.1.5 全连接层\n\n上一层作为输入馈入数组的多层维度在处理后会独立地进入数据块。然而，`CNN` 算法的后续工作需要数据集之间存在连接，而这在上一步的结果数据中是缺失的。在这一层中，主要执行的活动是内部连接数据集以形成一个连接层。\n\
  \n### 12.3.2 长短期记忆网络 (LSTMs)\n\n长短期记忆网络通常称为 `LSTMs`，对称地属于循环神经网络 (`RNN`) 模型 `[4]`。这种类型的网络算法能够在一段时间内回忆（并保持）连接的对象，可能是从广泛的数据集中长时间地回忆过去信息的过程。\n\
  \n`LSTMs` 长期保留信息。大多数研究人员指出跨网络的连接对象，可能主要用于时间序列和预测，因为这些原因现在大多被记忆在之前的输入。`LSTMs` 是由四个相互作用的层组成的链式结构。大多数层通常独立通信。\n\
  \n### 12.3.2.1 LSTM 的工作原理\n\n1. 遗忘上一个状态中不相关的块开始。\n2. 选择性地更新每个块的单元状态值。\n3. 单元状态某些块的输出通过其通用参数进行识别。\n\
  \n### 12.3.3 循环神经网络 (RNNs)\n\n循环神经网络通常称为 `RNNs`。该算法的连接协调地形成了一个有向环。这种流式结构为研究学者，特别是初学者提供了额外的空间，让他们探索自己极端的思维过程，以实验不同的对象结构。有时这为在研究领域发明新发现铺平道路。\n\
  \n`LSTM` 算法的结果数据集和对象被作为输入馈给 `RNN` 的当前阶段，反过来可以扩展到记忆数据。`RNN` 算法经常被用于患者的模式识别，并帮助根据已经受癌症影响的先患者预测患癌的概率，这些记录根据当前阶段存储在内存中\
  \ `[5]`。这是这些算法根据过去的历史数据帮助医疗行业改进癌症预测的场景。\n\n### 12.3.3.1 RNN 的工作原理\n\n1. 将带有时间间隔和循环“n”的预处理数据集在一次时间“Dt”馈入问题定义对象中。\n\
  2. 迭代指示器设置为布尔类型，以便在定义的时间通过某些操作（`Dt+1`）终止循环。\n\n**显著行为**：`RNNs` 能够处理任何长度的输入。\n\n\
  我建议在本章 `RNN` 工作章节中强调的另一个显著观察是，该算法中涉及的历史信息的计算性质，以及算法的预期模型大小有助于识别每个数据集的结果。\n\nGoogle\
  \ 的自动完成功能是 `RNN` 工作的一个例子。\n\n### 12.3.4 生成对抗网络 (GANs)\n\n生成对抗网络称为 `GANs`，广泛用于定位定义为预期结果的对象的最相似物。该算法似乎最适合那些将医疗平台作为问题定义的研究人员。这是因为在医疗和健康导向的对象中，很难预测结果，这反过来成了研究人员定义输入数据集的挑战。也许，该算法本身的目标工作是识别最接近匹配；这有助于研究学者了解如果定义了问题，他们的结果数据集将如何。通过这种理解，他们现在能够绘制相关输入数据的轮廓，从而减少冗余过程的风险。\n\
  \n### 12.3.4.1 GANs 的工作原理\n\n为了使 `GANs` 算法工作，必须学会区分 `GANs` 伪数据与过去真实数据的差异。\n\n通常，该算法工作的第一步依赖于推导涉及问题定义的所有实体或组件的用例活动\
  \ `[6]`。\n\n随后将对相似的数据对象进行迭代，直到达到预处理数据定义的定义时间限制。\n\n结果，生成对抗网络算法的最后阶段或执行步骤是一个实用的生成器或动态判别器，帮助系统的用户或终端客户更新数据模型。\n\
  \n\n\n\n\n研究市场中最具挑战性和困难的事实发现技术之一依赖于径向基函数网络（RBFNs）算法。这些算法是不同类型的前馈神经网络。该算法模型使用径向基函数作为激活函数的关键因素。该算法包含三层：第一层是输入层，后续是隐藏层，最后是输出层。这三层主要用于分类、时间序列预测和回归。\n\
  \n### 12.3.5.1 RBFNs 的工作原理\n\nRBFNs 在分类层上运行。这是通过测量输入的稳定性、一致性和可靠性来实现的 7](#ch12.xhtml#ref12_7)]。这让我们理解相似性是源自训练集中的示例。\n\
  \nRBFNs 从动态参数的高级配置和定义静态变量集的空间开始。这一层有一组 RBF 神经元。这有助于原始数据免受离群值的影响。\n\n这一层往往会产生功能异常的隐藏层，其中数据对象中的每个节点倾向于引用与下一个数据对象输出的依赖关系。\n\
  \n位于每个数据对象中的神经元在网络层上形成了一个相关控制台。这与最初作为输入数据集处理的实际数据对象成反比。\n\n因此，RBFN 算法通常被视为全面的网络算法，用于发现隐藏层以及数据对象上成比例的模式，以便在给定的数据仓库中实现预测结果。\n\
  \n### 12.3.6 多层感知器 (MLPs)\n\n多层感知器（称为 MLPs）是学习深度学习技术最优秀且最好的起点之一，原因在于其准确性以及在执行和编译方法中的透明度。\n\
  \nMLPs 算法主要属于简化前馈神经网络类。该算法具有多层工作步骤，由包含激活函数的感知器层组成。MLPs 主要由一个基础输入层和一个输出层组成，后者通常是端到端连接的\
  \ 8](#ch12.xhtml#ref12_8)。该算法的结果似乎具有与输入层相同数量的输出层，但事实是它可能有多个隐藏层，这是结论性的，并取决于在软件中构建识别，例如阀门中的块或在患者自行报告症状之前扣除的任何异常。\n\
  \n### 12.3.6.1 MLPs 的工作原理\n\nMLPs 算法的工作从将数据馈到网络中的输入层开始。明显的神经元层以图模型的形式连接。这样做是因为信号以一个精细的方向传递。\n\
  \n算法然后使用存在强大的输入层和一致的隐藏层之间的权重来计算输入。\n\nMLPs 经常使用激活函数来确定可用节点中触发哪一个。激活函数开始包含 `ReLUs`\
  \ 的简化、`sigmoid` 函数以及偶尔的正切函数。\n\nMLPs 首先训练数据模型以阐明并理解它们之间的相关性，然后它学习从最小训练数据集中识别高度独立的特征变量与最接近的目标变量之间的依赖关系。\n\
  \n此图描绘了权重和偏置的计算，然后应用合适的激活函数来对不同对象的图像进行分类。\n\n### 12.3.7 自组织映射器 (SOMs)\n\n自组织映射（称为\
  \ SOMs）由 Teuvo Kohonen 教授发明。这种算法模型通常用于跨平台框架，以实现准确性并减少源程序漏洞。随着目前的源程序调试器或代码合并技术的出现，克服代码漏洞面临着巨大挑战。阅读这些时，每个人脑海中出现的第一个问题是，在深度学习算法中这种需求到底有多频繁。当然，当我们从必要性的角度来看并没有；但当我们通过源代码实现算法时，它不仅仅是实现算法的目标结果。任何算法实现的真正成功在于源程序逻辑是如何构建以实现该结果的。对于学者来说，实现范围并不随着结果而结束。源程序的构建方式说明了成功的质量和有效性。因此，在\
  \ SOM 的帮助下关注源程序的漏洞和微调。这种算法模型带有数据可视化方法，以减少源程序的漏洞。在 SOM 中，大部分执行发生在服务器和客户端环境的源程序编译期间\
  \ 9](#ch12.xhtml#ref12_9)。这也可以通过将多维数据集定义为 ANNs 来实现。\n\n### 12.3.7.1 SOMs 的工作原理\n\
  \n1. 使用“n”维数组初始化每个数据集的权重，与时间“t”成比例。使用具有顺序命名规范的训练数据集组织节点。（这有助于根据编译期间突出的漏洞定位调试节点。）\n\
  2. 针对每个源程序块或过程迭代执行 SOM 执行。\n3. 将源程序块中高亮显示的节点识别为高漏洞，并跟踪该源程序的先驱项和依赖项。\n4. 寻找程序逻辑的替代方法或易产生漏洞的方法。在编译块之外对其进行预处理，并在替换到实际源程序部分之前验证结果。\n\
  5. 插入一个循环，设置为重复步骤 2、3 和 4 直到 N 次迭代，其中“N”是为质量设置的目标漏洞百分比或发生次数。\n\n此数据集作为输入馈给 SOM 算法。然后将其转换为\
  \ 2D RGB 值。最后，该算法的结果用不同的颜色分离并分类。\n\n### 12.3.8 深度置信网络 (DBNs)\n\n当然，DBNs 主要被认为是迭代或增量模型。在多层隐变量上执行的算法在安全措施方面容易产生风险。这主要关注算法中使用的二值值和隐藏单元。\n\
  \n为了克服算法编译期间的网络安全挑战，已经考虑并研究了过去的学者及其方法。此外，我提出的方法是用堆叠数据集来增强每一层。每当整个层被审查（玻尔兹曼机）时，这些数据集通常会进行归一化。\n\
  \n### 12.3.8.1 DBNs 的工作原理\n\n1. 在每层声明需要归一化的训练数据集。\n2. 标记层中容易产生网络安全问题的节点或块。（这有助于在评估执行过程时进行双重确认。）\n\
  3. 使用实际数据集执行源程序。为每层建立最大连接 10](#ch12.xhtml#ref12_10)。层与层之间的数据传输量应与为每层声明的网络节点成比例。这将确保对网络和安全层的最大数据和连接吞吐量进行测试。\n\
  \n\n\n\n4. 随后，在第三步中，消除了 `DBNs` 以通知具有继承关系的隐藏层。该层中迭代次数节点接收了最大的吞吐量。这创建了一种统一的模型方法，用于钻取网络层中最少的节点并确保安全考量。\n\
  \n5. `DBNs` 的最终执行是对继承节点的学习。吞吐量最大的网络接收安全方面的高严重性值。最终，继承层相结合以有效地评估安全结果的结果。\n\n### 12.3.9\
  \ 受限玻尔兹曼机 (RBMs)\n\n受限玻尔兹曼机算法被称为 `RBM`。它最早由杰顿（Geoffrey Hinton）发现并开发。该算法在随机神经网络的功能上运行。其实际的工作原理在于概率分布的学习，这精细地管理着数据集的每个阶段\
  \ `[11]`。\n\n`RBMs` 算法的工作逻辑与我们在前面的章节中看到的 `DBNs` 的构建块相似。\n\n#### 12.3.9.1 RBMs 的工作原理\n\
  \n`RBMs` 算法分两个阶段工作：\n\n`RBM` 算法的基础工作是通过正向传播和反向传播。然而，在动态变量声明方面，两者都面临高风险。\n\n1. `RBMs`\
  \ 算法的基础工作通过接受输入并将其转换为一组定义的数字变量启动，这些变量完全编码了用于正向传播的输入。\n2. 在第二步中，每个单独的输入节点与网络或图中端节点的权重和深度相结合。\n\
  3. 这一步仅仅是增强网络中每个节点性能的迭代行为。\n4. 此时反向传播的执行进入了场景。实际执行从定义带有依赖关系的声明变量集开始。变量数字为反向传播进行翻译和加密，然后在执行正向传播时解密。\n\
  5. 在这一步中，`RBMs` 算法将每个激活节点与单独权重和整体偏置相结合。\n6. 这又是重建的一步，其中端节点被进一步分分，以便涉及其所有权重和深度的反向和正向传播进行执行。\n\
  7. 这是 `RBMs` 算法的最后一步。作为可见层，`RBM` 将算法中为反向传播声明的实际数据集与正向传播执行期间形成的预定义动态数据集进行比较。这种比较的结果将让我们更清楚地了解图中每个网络节点结果的准确性和一致性。\n\
  \n### 12.3.10 自动编码器\n\n深度学习中的最后一种算法模型是“自动编码器”。它由杰顿（Geoffrey Hinton）于 1980 年发明并设计。在这种算法模型中，大多数编译问题的定义和解决方案是相似的。设计这种算法的目标是解决无监督学习的挑战和问题。这些算法在药物发现领域被广泛应用和评估。\n\
  \n#### 自动编码器算法的工作原理：\n\n自动编码器算法包含三个主要组件：第一个是编码器部分，接着是代码编译，最后是解码器。\n\n1. 自动编码器的设计结构用于接收统一输入。这些输入数据随后被转换为所需的不同表示。\n\
  2. 算法随后尝试将增量值设置为动态属性并对其进行迭代。\n3. 这是一个试错机制的步骤。如果代表数字的图像不够清晰而可见，则算法被设计为将其馈入自动编码器神经网络。\n\
  4. 这里是自动编码器的核心功能。它首先编码给定的图片，然后以粒度形式的分块处理问题以最小化实际分辨率。\n5. 在最终过程中，自动编码器解密处理过的文件（步骤\
  \ 4 中），以获得重构和编译后的图片。\n\n## 12.4 深度学习算法中的复杂性\n\n深度学习算法通常需要大量数据集或标记数据进行训练。从另一种角度说，在开始分类感染肝脏和健康肝脏的过程之前，我们必须提供数千张感染肝脏扫描报告的实际图像作为输入参数。这取决于所用训练数据集的相对性。为了获得更好的结果或分类改进以及算法性能，建议使用更多的训练数据集。大多数医院和实验室都意识到维护相对较大数据集的这一需求。更重要的是，它们在多年里定期利用这些数据方面非常高效，并对患者的测试和扫描报告结果进行监控。这是其他中小型医疗研究和临床中心所缺乏的一个领域。也许，这正是他们通过为患者提供更好的服务而脱颖出的地方，并获得积极的反馈和成功率\
  \ `[12]`。从研究者的角度来看，我们在技术观察中预见这种方法是处理数据集的迭代方法，这导致了深度学习算法的必要性。\n\n尽管实施深度学习算法有很多益处，但为了成功实施，我们必须面对一些显著的挑战。\n\
  \n### 12.4.1 输入数据结构的完美性\n\n在不知道算法中使用的实时数据集公式上面临的挑战和复杂性的情况下，很难确定算法的输入类型。在这种情况下，人们可以分析并想象在为深度学习算法收集输入数据时未知因素的深度。然而，我们认为，当训练数据集对于算法中定义的每个问题通过泛化方法进行迭代时，可能性很高。在常见的数据处理方法中，当我们对分块数据集迭代每个问题定义时，异常值很容易被识别。这还涉及将样本值插值为输入以确定有效数据集的范围。事实上，真正的挑战在于，当需要传递给算法的输入数据应该是某种从未使用过的数据集时。\n\
  \n因此，这使得变得更有挑战性，每当我编译程序时，知道该数据集上一次作为深度学习算法的输入是什么时候非常有趣。也许它可能没有被使用过。当数据集第一次迭代并作为输入传递时，最好有这种假设，即算法在直接将数据集作为输入之前需要一个预处理步骤。事实上，预处理本身就是一种编译和执行步骤。在所有可能，如果我们经过了这样的预处理，我就无法满足“我的数据集以前在任何地方出现过”的标准。这是满足输入数据集完美性挑战的一个维度。第二个是来自研究和实验室提取的实时数据集中的依赖关系和准确性\
  \ `[13]`。\n\n\n\n\n我们无法要求或期望实验室共享准确的数据集，因为他们更关注自身的安全和隐私合规。因此，通过给定的数据集，我们确保其准确性符合算法目标的问题定义。另一个挑战随之而来：如何能够在使用不同算法发送数据集作为输入时，称其准确性是相同的？例如，如果我针对某个算法微调了一个数据集以使其准确，那么该算法的准确性决定因素可能与我倾向于编译的另一个算法不同。换句话说，当算法中涉及子过程时，这些程序/过程可能会被编译为依赖性执行，而不是直接调用。在这种情况下，子程序或过程的准确性水平可能不同，我符合某个算法准确性要求的数据集在单次执行或编译中可能无法满足另一个算法（图\
  \ 12.1）。\n\n![图 12.1 算法准确性复杂度。](img/fig12_1.jpg)\n\n图 12.1 算法准确性复杂度。\n\n### 12.4.2\
  \ 深度学习是浅层的\n\n研究人员经常面临的一个显著问题是无法在问题定义与其推导出的解决方案之间找到精确匹配。原因是这些算法旨在提供多种解决方案，因为存在不同范围的输入数据集。当我们从底向上的方法来看时，这是可以解决的。我们建议这种方法一次处理一个问题。专注于一个定义的特定问题，跟踪映射到该问题的数据集，然后追溯直到得出该数据集的解集。这并不意味着我们应该跳过推导出的其他解决方案。明智的决定是根据问题定义及其行为性质创建多个组，然后回溯每个组以追溯其解决方案。这在某种程度上证明并说服了我们去使用推导出的所有可能的解决方案\
  \ \\[14]。然而，当涉及到准确性矩阵时，我们被迫从多个解决方案中选择一个，这最终使我们变得浅薄。\n\n## 12.5 深度学习对肝脏健康的影响\n\n\
  如今，肝感染是 50 岁或 60 岁左右患者面临的广泛健康问题之一。通常，当我们开始观察有不同关注点的患者时，帮助我们对肝感染疑似进行分类的一个共同属性是他们的体重。在挑选此类患者并开始收集他们的测试报告、扫描结果和咨询历史记录时，我们可以更接近那些容易患肝感染的患者。\n\
  \n### 12.5.1 输入数据的特征\n\n在识别肝感染的实验性研究中，我们的研究从不同的医疗中心开始，通过观察接受扫描和手术的患者的治疗性质。在执行多次迭代过滤后，我们确定了一组患者并提取了他们的完整扫描报告，其中包括获取的超声图像（包括平均年龄为\
  \ 45 岁，25% 为男性，体重指数 (BMI) 接近 35）。患者可能因为不同的健康顾虑而入院。然而，他们有可能接受了扫描以观察与手术相关的对应影响。因此，这些扫描报告现在被收集起来，用于我们指向肝感染领域的观察。样本数据收集在手术前一到两天，以及手术后一周。我们的观察强调了术后获取的报告中的肝活检。尽管这是肝移植科和普通外科遵循的一项成熟方案，但对于某些患者来说，脂肪变程度似乎超过了推荐范围。这是我们研究观察中将其定义为聚类的饱和点。我们开始收集那些注意到这些异常情况的患者的医疗记录历史。这是专注于某些离群值和粒度级聚类的发现。实验室进行的大多数评估均来自知名且受认可的医疗人员或授权的高级医疗顾问。他们根据医疗研究机构和大学定义并推荐的方案进行评估。通过观察这些评估，注意到的异常情况主要是超过了患者在脂肪浸润方面面临的推荐和平均影响及衰退的百分比\
  \ \\[15,16]。参考作为算法输入传递的属性，对肝脏感染的预测被识别并标记为异常。这种异常比推荐范围高出约 7%。筛选出的患者被分为两大人群：倾向于患脂肪肝的人群（脂肪变读数约超过\
  \ 7%），以及一些患者看起来正常且健康（低于 7%）。图 12.2(a) 展示了从健康人身上拍摄的超声图像，另一幅是由于某种感染或疾病遭受并接受肝脏治疗的患者。以这些发现为基础，我们收集了连接心脏、肾脏和肺部等不同诊断的扫描图像样本，以评估相关性和预测百分比。作为最终收集，来自不同实验室和年龄在\
  \ 45 到 70 岁之间的患者的 550 张 B 型超声图像构建了最优解决方案方法，这些方法将进一步用于调查的阶段。当我们观察图 12.2(b)所示的图像时，显然直方图在患者一次呼呼吸阶段是相对分布的。根据这些扫描图像，我们可以得出一个具体的发现：这是特定数据采集技术的，该技术通常针对约\
  \ 50 名易患脂肪肝的患者和近 25 名正常患者进行。\n\n![图 12.2 (a) 正常肝脏。(b) 脂肪肝。](img/fig12_2.jpg)\n\n\
  图 12.2 (a) 正常肝脏。(b) 脂肪肝。\n\n在识别肝感染结果饱和性的下一步中，我们意识到应用预定义且充分训练的网络流作为输入。这可能是图像，也可能是数据。经常使用的某些网络将被考虑：`AlexNet`、`Inception-ResNetV2`、`ResNet101`\
  \ 和 `GoogleNet`。其中，我们选择的一个深层选项是 `Inception-ResNetv2` 神经网络。这是因为它经过预训练，并包含了广泛的数据集，涵盖了大约\
  \ 890 到近 900 层不同属性。它具有减少体积计算量的特性。该训练模型的一个独特特征是，输入数据之间的相关性在深度学习算法的每次迭代中被准确监控并单独关注。而其他实时模型由于缺乏数据量和吞吐量，并不符合此类特征。让我们在接下来的章节中考虑一个良好的例子来说明该算法输入的工作原理。\n\
  \n#### 12.5.1.1 算法工作示例说明\n\n考虑商业场所的保险范围涉及多个维度风险因素，例如在场所进行的工作性质、安装的安全措施类型、存储在场所的产品或货物材料以及建筑规格的物理结构，这些是风险和保费计算的一些高级决定因素。\n\
  \n\n\n\n此计算中的实际挑战在于评估细粒级的风险，这些风险会在基础保费的基础上施加加费率。加费应根据各种因素以及作为输入的采集进行实施。或许，推导出与实时场景一致的业务功能，可以为设定加费百分比组合创造更多可能性。\n\
  \n该保险范围的输入数据应分为若干阶段，例如个人详情、被保险房屋详情、安全措施、存储在其中的货物和材料等（图 12.3）。\n\n![图 12.3 被保险人信息采集插图](img/fig12_3.jpg)\n\
  \n图 12.3 被保险人信息采集插图\n\n这是我们算法的首个基础节点 `NP`，将被保险人详情视为与后续章节的依赖因素。这里的因素包括 `occupation`（在场所开展的业务性质）和\
  \ `construction class`（决定建筑的类别）。\n\n接下来是感兴趣条目的输入采集，即风险类别。算法在获取房屋输入后，从这一步开始实际运行（图\
  \ 12.4 和 12.5）。\n\n![图 12.4 房屋详情采集插图](img/fig12_4.jpg)\n\n图 12.4 房屋详情采集插图\n\n![图\
  \ 12.5 保费决定因素的对象定义点插图](img/fig12_5.jpg)\n\n图 12.5 保费决定因素的对象定义点插图\n\n并非所有的输入参数都作为算法第一阶段的输入；定义算法核心簇的基因素\
  \ `NP` 源自被保险人详情章节。紧随其的是房屋详情，其中包含了大量的变异数据或跨不同维度的分散数据。因此，让我们为每个因素建立方程，将具有相似决定性的其他输入归类为其核心组件的一部分。\n\
  \n设 `Max Discount` 为 `-30.00%`，`Max Loading` 为 `+30.00%`。\n\n`Trade_code_discount\
  \ = Lookup using trade code & Construction class at PIAM table setup`\n\n```\nIf\
  \ Trade_code_discount < Max Discount, then\n    {If Part II (S5) * (1+ Trade_code_discount)\
  \ > Part I (S5), then Part II (S5) * (1+ Trade_code_discount)\n    else Part I (S5)}\n\
  Else {\n    If Trade_code_discount > Max Loading, then\n        {If Part II (S5)\
  \ * (1+ Trade_code_discount) < Part I (S5), then Part II (S5) * (1+ Trade_code_discount)\n\
  \        else Part I (S5)}\nElse {\n    If Part I (S5) > Part II (S5) * (1+ Max\
  \ Loading), then Part II (S5) * (1+ Max Loading)\n    Else {\n        If Part I\
  \ (S5) < Part II (S5) * (1+ Max Discount), then Part II (S5) * (1+ Max Discount)\n\
  \        Else Part I (S5)\n    }\n}\n```\n\n（图 12.6 和 12.7）\n\n![图 12.6 被保险人信息采集插图](img/fig12_6.jpg)\n\
  \n图 12.6 被保险人信息采集插图\n\n![图 12.7 被保险人信息采集插图](img/fig12_7.jpg)\n\n图 12.7 被保险人信息采集插图\n\
  \n并非所有的输入参数都作为算法第一阶段的输入；定义算法核心簇的基因素 `NP` 源自被保险人详情章节。紧随其的是房屋详情，其中包含了大量的变异数据或跨不同维度的分散数据。因此，让我们为每个因素建立方程，将具有相似决定性的其他输入归类为其核心组件的一部分。\n\
