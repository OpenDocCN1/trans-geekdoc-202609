  \ || 0.00 |\n\n### 3.3.2 用于特征提取的改进型主成分分析 (IPCA)\n\n特征提取对于从大型数据集中检索数据属性的影响非常重要。PCA\
  \ 执行多变量数据分析以提取线性特征。它检测给定数据中特征（这些特征被称为观测变量）之间的相关性。在生成特征子集时，PCA 通常会忽略变化较少的的特征。因此，它最小化了特征空间的维度，并只提取相关的变量以构建空间极简的特征\
  \ [20,21]。\n\n在提出的方法中，引入了改进的 PCA 从大型数据集中产生特征向量。原始 PCA 的问题是它没有考虑特征之间变化细微的特征。这里的假设是，这些特征可能也包含有助于更好分类的重要信息。提出的\
  \ IPCA 通过影响向量的归一化来降低特征的值。考虑到 `x`[`i j`] 为第 `j` 个特征中的第 `x` 个元素，则将 SD $\\sqrt{\\lambda_{x}}$\
  \ 应用于特征向量。然后，公式 (3.2) 表示结果特征向量。\n\n$M_{j}^{\\prime} = \\left\\lbrack {\\frac{M_{iio}}{\\\
  lambda_{n}},\\mspace{9mu}\\frac{m_{j}}{\\lambda_{1}},\\ldots.\\frac{m_{i({n - 1})}}}{\\\
  lambda_{m - n}}} \\right\\rbrack$ (3.2)\n\n特征向量的最终归一化为特征创建了新的其他子空间。这项工作专注于通过其相应的特征值的平方对这些子空间特征进行归一化，然后通过计算用于训练和测试的特征之间的距离。线性\
  \ IPCA 修改由公式 (3.3) 表示。\n\n$M = T \\times N$ (3.3)\n\n在这里，`M` 代表变换矩阵，`T` 表示向量，`N`\
  \ 代表被变换的特征向量。矩阵 `M` 随后采用公式 (3.4) 所示的形式。\n\n$(\\lambda L-s)T=0$ (3.4)\n\n在上述方程中，由\
  \ `L` 表示矩阵平方具有对角单位矩阵，`s` 表示实际数据的协方差矩阵，`T` 表示特征值。特征值使用公式 (3.2) 计算，并可以表示为 `T[1]`、`T[2]`、……`T[n]`。\n\
  \n提出的 IPCA 变换了数据集，变换矩阵在公式 (3.5) 和公式 (3.6) 中表示。\n\n$M=T'N$ (3.5)\n\n$Q[Nm]=a[1]v[1]+a[2]v[2]+….+a[N]v[N]$\
  \ (3.6)\n\n对比公式 (3.3) 和 (3.5) 以检测源自协方差矩阵的变换矩阵，并形成完整文本。使用 IPCA 的重要优势是它有助于减少维度并最小程度地减少信息损失。尽管基于\
  \ PCA，但 IPCA 是一种数学方法，有助于将高维特征映射到线性空间，通过协方差矩阵的特征值实现更少的维度。因此，IPCA 由于也考虑了被忽略的特征，因此以更少的误差实现了特征提取。IPCA\
