  \ 与 SVM 的对比分析, 2019.\n\n\n\n自伦根于 1895 年发现 X 射线以来，医学成像已成为一个主要研究领域。医学图像分析利用临床图像来解决临床问题。其目标是高效地提取信息以实现更好的临床诊断。计算机断层（CT）、磁共振成像（MRI）、正电子发射层扫描（PET）、超声、乳腺靶检查和\
  \ X 射线等诊断成像技术，用于疾病的检测、诊断和治疗 [1]。为了利用这些不断增长的数据、对其进行研究并以符合医疗任务的方式展示，需要进行医学图像处理。医学图像处理的主要目标是改进内容的解释，而一般的图像处理则是增强图片的美感或创作艺术作品。可以对图像进行增强以突出某些元素，并手动或自动提取信息。医学成像传统上由医院和诊所的放射科医生进行解读。然而，由于病理差异和人类专家疲劳，研究人员和医生开始获得利用计算机辅助治疗的成果。随着人工智能（AI）方法的出现，计算医学图像处理正在追上医学成像技术的进步\
  \ [2]。\n\n由于生物医学工程的突破，医学图像分析成为一个关键研发课题。使用机器学习（ML）的医学图像分析是这种改进的原因之一。利用 ML 的医学图像分析严重依赖于特征的识别和获取，这些特征需要忠实地代表分析数据中的反复结构或模式。由于历史上，相关或任务相关的特征大多是由人类专家根据他们对目标领域的理解而生成的，非专家很难利用\
  \ ML 技术进行自己的研究 [3]。神经网络可以使用深度学习进行 ML 自动学习特征，这与使用手工设计特征的方法不同。这些特征难以选择和计算。深度卷积网络被用于医学图像分析。应用包括分割、异常检测、疾病分类、计算机辅助诊断和检索。海量数据、高性能\
  \ CPU 和 GPU 以及学习算法促成了深度学习的巨大成功。通过使用深层神经网络发现的层级特征表示，可以从低级特征生成更高级别的特征。深度学习的实现依赖于从数据中学习层级特征表示，使其在\
  \ AI 应用和重大问题中取得了前所未有的成功。分割、配准、融合、标注、用于诊断的显微图像检查（通过计算机辅助诊断）、预测（通过预后）；病变和标志点的检测（通过病变检测和标志点检测）；都是深度学习应用于医学成像行业的示例\
  \ [4]。\n\n医学图像分析帮助放射科医生和医生改进诊断治疗。医学图像分析对于计算机辅助检测（CADx）和诊断（CAD）至关重要，这直接影响临床诊断和治疗。医学成像提供人体图像。医学成像帮助放射科医生和医生改进诊断治疗。医学成像对于疾病的诊断治疗至关重要。这些包括\
  \ X 射线、CT、MRI、PET、超声和混合模态。这些方法有助于诊断和研究器官解剖和功能。\n\n图 4.1 显示了不同人体部位放射和实验室生成的医学成像模态分类。\n\
  \n![图 4.1 医学成像模态。](img/fig4_1.jpg)\n\n图 4.1 医学成像模态\n\n现代医疗需要医学成像。CADx 依赖 ML 进行肿瘤分割、癌症诊断、分类、图像引导治疗、医学图像标注和检索。\n\
  \n图像分析方法包括以下方面：\n\n- **图像增强：** 去除噪声、背景不均匀和其他畸变，并增强轮廓和其他特征。\n- **图像分割：** 识别部位（如器官）的形状。\n\
  - **获取图像配准：** 修改图像以在空间上匹配参考图像。对于 PET/CT 是如此。\n- **量化：** 对几何特征进行测量。\n- **构思：** 对多维数据和解剖结构进行建模。\n\
  - **检测：** 发现病变和标志点。\n\n图 4.2 显示了医学成像应用。\n\n![图 4.2 医学成像应用。](img/fig4_2.jpg)\n\n\
  图 4.2 医学成像应用\n\n现代医学分析由于电子医疗记录和诊断成像的兴起，CADx 依赖 ML 进行肿瘤分割、癌症诊断、分类、图像引导治疗、医学图像标注和检索。这些方法包括像素的低级处理、特征工程以及基于监督学习的分类器。基于深度学习的图像诊断、疾病预后和风险评估正在不断改进。随着深度学习的快速兴起，复杂的深度学习算法成为学术界和工业界的热点。因此，智能医疗有助于医生使用医学大数据\
  \ [5]。\n\n## 4.2 医学图像分析\n\n医学图像分析利用人体图像数据库（通常来自 CT 或 MRI 扫描仪）进行诊断、治疗计划（如手术）或研究的过程。放射科医生、工程师和医生处理医学图像以理解解剖。医学处理提供了非侵入性的内部研究。可以构建并研究所需的器官模型，以改进护理、医疗设备和药物递送系统。已成为主要的医疗进步工具\
  \ [6]。\n\n### 4.2.1 医学图像分析的核心领域\n\n图 4.3 显示了组织医学图像处理的一些原则和方法。这些领域影响图像形成、计算和管理。\n\
  \n![图 4.3 医学图像处理的主要流程。](img/fig4_3.jpg)\n\n图 4.3 医学图像处理的主要流程\n\n医学图像分析步骤在图 4.4 中进行了结构化分类。\n\
  \n![图 4.4 医学图像分析步骤的结构化分类](img/fig4_4.jpg)\n\n图 4.4 医学图像分析步骤的结构化分类\n\n图像生成通过数据采集和重建解决数学逆问题。图像计算增强图像解释并提取治疗数据。图像管理负责压缩、存档、检索和共享采集的图像和数据。\n\
  \n#### 4.2.1.1 图像形成\n\n数据采集和图像重建解决了图像生成中的数学逆问题。\n\n\n\n\n\n#### 4.2.1.1.1 数据采集\n\
  \n图像采集包含人体内部物理量的原始数据。利用这些数据，可以根据特定需求定制进一步的图像处理步骤。根据不同的物理原理，不同的成像模式能够检测到不同的物理量。超声波利用声学回波，而磁共振成像则利用受激原子产生的射频信号特性。数字射线（`DR`）和计算机断层（`CT`）利用入射光子能量。无论采用何种成像方法，数据采集都物理量的检测、电信号转换、预处理和数字化。\n\
  \n#### 4.2.1.1.2 图像重建\n\n数学图像重建是从零开始创建图像的过程。这种技术还结合了来自不同视角或时间步的多个数据集来实现维成像。医学图像处理的核心课题是反演问题。利用分析和迭代策略来解决这些困难。用于断层扫描、`MRI`和超声成像的分析方法包括滤波反投影（`FBP`）、傅里叶变换（`FT`）和延迟叠加（`DAS`）波形成。这些方法优雅且计算高效，但基于理想化模型，无法处理测量噪声、统计特性和成像系统物理等复杂因素。迭代方法克服了这些限制，增加了对噪声的不敏感性，并从不完整的原始数据重建理想图像。基于具有预期系数的物体模型，迭代方法使用系统和统计噪声模型构建投影。当预测的未来与实际数据之间存在差异时，需要向物体模型添加新系数。不断迭代此过程，直到在估计值和实际值之间找到最小代价函数，从而使重建过程收敛到最终图像。\n\
  \n#### 4.2.1.2 图像计算\n\n图像计算增强了图像解释并提取具有治疗价值的数据。图像计算利用计算机和数学方法从重建的成像数据中提取治疗相关信息。这些方法改进了成像、分析和可视化\
  \ [7]。\n\n#### 4.2.1.2.1 增强\n\n图像增强通过优化变换表示提高了信息解释。它使用了频域和空间域方法。空间域方法通过直接操作像素来优化对比度。这些技术利用对数、直方图和幂律变换。通过滤波器，可以使用频域方法对图像进行精炼和平滑。这些技术减少了噪声和不均匀性，优化了对比度，增强了边缘，消除了伪影，并改进了图像分析和解释的其他重要特征。\n\
  \n#### 4.2.1.2.2 分析\n\n图像分割、注册和定量化是图像分析的主要方法，这也是图像计算的核心。图像分割将图像分为解剖结构。图像注册对于分析时间变化或来自不同模式的图像至关重要。定量化建立了体积、直径、内容以及解剖或生理信息等结构属性。所有这些过程都会影响检查质量和医学结果。\n\
  \n#### 4.2.1.2.3 可视化\n\n通过可视化，解剖和生理成像数据可以以预定的维度进行视觉化显示。可视化有助于成像分析开始和结束时的分割、注册和结果显示。\n\
  \n### 4.2.1.3 图像管理\n\n最后，数据存储、检索和传输是医学图像处理的剩余步骤。有许多方法和协议用于管理图像。医学图像的存储和传输得到了图像存档通信系统（`PACS`）和医学数字成像通信（`DICOM`）标准的支持，两者都是医学成像技术的产物，而\
  \ `PACS` 还提供了对多种模式图像的廉价访问。这些过程通过图像压缩和流媒体技术得以加速。\n\n### 4.2.2 健康图像分析的主要挑战\n\n近期硬件的改进极大增强了视觉信息的准确性及其包含的信息量。扫描时间的缩短、图像质量的提高以及超声-乳腺-计算机断层-磁共振成像（`CT–MRI`）系统都是集成前端解决方案的优势。如今，使用快速迭代算法重建图像比分析方法更为常见。它们提升了\
  \ `PET` 图像质量，减少了 `CT` X 射线剂量，并压缩了 `MRI` 。数据驱动的信号模型比人工定义的模型更好地解决反演问题。随着成像技术收集更多数据以及算法变得越来越复杂，计算技术必须不断改进。由于更强大的图形处理器和多处理方法，现在可以进行更广泛的研究到应用的选择。图\
  \ 4.5 显示了这一图像计算和图像管理革命的一些重大趋势和问题。数据融合、计算机辅助检测与诊断、数据驱动图像分析、人工智能和云计算都是其例子 [8]。\n\n\
  ![图 4.5 医学图像分析的主要趋势。](img/fig4_5.jpg)\n\n图 4.5 医学图像分析的主要趋势。\n\n## 4.3 人工智能\n\n健康领域的\
  \ `AI` 主题正在迅速扩张，激发了乐观情绪，并引发了令人疑惑的问题。机器模拟人类认知能力被称为 `AI`。`AI` 是一类广泛的方法。其中与医学行业特别相关的是\
  \ `ML`。“大数据”的出现（或极大数据库的创建与分析），结合处理器计算能力的现象级增长以及新的深度学习技术，帮助了医学 `ML` 应用成功。这些技术发展使得算法处理图像和声音成为可能，并被纳入自动化专业工作流以及我们每天使用的数字工具中。医学领域原始数据的量、复杂性和变异目前都在剧增。高效且具有医学相关的大数据分析是公共卫生的一个重大问题。在这个领域，`AI`\
  \ 提供了三个光明前景：自动化医学图像分析；利用相关性分析进行风险预测；以及基因组分析和表型-基因型关联研究。\n\n### 4.3.1 监督学习\n\n\n\n\
  \n\n被称为监督学习的系统和程序组利用具有预定义输出的数据点来开发预测模型。该模型通过使用合适的学习方法（例如`neural networks`、`linear\
  \ regression`或`random forests`）进行训练来开发，这种方法通常采用某种优化程序来减小`loss or error function`。通常的监督学习机器学习配置如图图\
  \ 4.6 所示。分类和回归是监督学习的两种主要类型。\n\n![图 4.6 监督机器学习系统。](img/fig4_6.jpg)\n\n图 4.6 监督机器学习系统。\n\
  \n### 4.3.1.1 分类\n\n算法将测试数据划分为不同的类别。它们识别集合中的实体以确定它们的标签和描述。`Linear classifiers`、`SVM`、`decision\
  \ trees`、`k-nearest neighbor`、`random forest`等都是分类方法。\n\n### 4.3.1.2 回归\n\n回归分析依赖变量与自变量之间的关系。它通常被用于销售收入预测。回归方法预测连续值。回归可以根据尺寸、成本等预测房屋价值。\n\
  \n### 4.3.2 无监督学习\n\n无监督机器学习不使用训练数据集。相反，模型会发现数据模式和洞察。在大脑中学习新事物类似于[10]。图 4.7 展示了典型的无监督机器学习设置。聚类和关联属于无监督学习。\n\
  \n![图 4.7 无监督机器学习设置。](img/fig4_7.jpg)\n\n图 4.7 无监督机器学习设置。\n\n#### 4.3.2.1 聚类\n\n\
  为了分析和处理未标记数据，它涉及到寻找相似结构。在没有输入-输出映射的情况下，计算机学习聚类中的属性和趋势。聚类使用无监督机器学习是因为样本是未标记的。当实例被标记标签时，聚类就变成了分类。`Density-based`、`distribution-based`、`centroid-based`、`hierarchical-based`、`K-means`、`DBSCAN`和`Gaussian\
  \ mixture model`方法都是聚类技术。\n\n#### 4.3.2.2 关联\n\n寻找解释数据大部分部分的规则（例如购买 X 的客户也购买 Y），是应用关联规则学习技术可以解决的问题示例。大型公司利用基于市场的分析来展示产品关系。\n\
  \n### 4.3.3 强化学习\n\n强化学习通过做出一系列决策来训练模型寻找最佳解决方案。在这里对问题环境进行建模。在没有人工输入的情况下，模型在 във环境中解决问题。我们只需对朝着目标移动的动作给予奖励，或对使其远离目标的动作进行惩罚。图\
  \ 4.8 展示了强化学习。\n\n![图 4.8 强化学习设置。](img/fig4_8.jpg)\n\n图 4.8 强化学习设置。\n\n表 4.1 显示了监督、无监督和强化学习的区别因素。\n\
  \n表 4.1 监督学习、无监督学习和强化学习的区别\n\n| 监督学习 | 无监督学习 | 强化学习 |\n| --- | --- | --- |\n| 提供带有指定目标值的数据。\
  \ | 提供的数据是未标记数据，输出值未指定，机器自行做出预测 | 机器通过奖励和错误从其环境中学习 |\n| --- | --- | --- |\n| 用于解决连续值和基于类别的问题\
  \ | 用于解决一致性和分组问题 | 用于解决基于奖励的问题 |\n| 信息被归类 | 信息未被分类 | 不使用固定参数。 |\n| 外部权威监控 | 无外部权威监控\
  \ | 无外部权威监控（等一下，检查文本...）无外部权威监控 |\n| 将标记的输入转换为已知输出以解决问题。 | 通过理解模式和发现输出来解决问题 | 遵循试错法解决问题的方法\
  \ |\n\n### 4.3.4 神经网络\n\n神经网络指的是一种模仿动物大脑建模的人工神经元或节点网络。现代 AI 大部分基于此。我们介绍了重要的基础知识，以帮助理解神经网络、复制成功的医学成像神经网络，并激励进一步的神经网络开发。从单个神经元的理论模型开始，我们将解释几种类型的神经网络，并描述它们的架构、学习算法、运行原理和实际应用[11]。\n\
  \n#### 4.3.4.1 基础结构\n\n图 4.9 是神经元基本结构的理论表示，其中 `X`（`xi`, i = 1, 2, …, n）是输入，`Y`是输出。激活函数\
  \ `f` 作用于每个输入的权重 `wi` 与与每个神经元的偏置 `b` 之和。因此，可以使用以下方程 (4.1) 表示输入和输出之间的连接：\n\n![图 4.9\
  \ 神经元的模型。](img/fig4_9.jpg)\n\n图 4.9 神经元的模型。\n\n```\n$y = f\\left( {\\\\sum\\limits\\\
  _{i = 1}^{n}{\\quad w\\_{i}x_{i} + b}} \\right)$ (4.1)\n```\n\n到目前为止，研究人员尝试了 `step`、`sigmoid`、`tanh`、`ReLU`\
  \ 和 `leaky ReLU` 激活函数。\n\n#### 4.3.4.2 前馈网络\n\n前馈网络是医学成像应用中最常用的神经网络拓扑结构。这些模型的层通常包括输入层、一个或多个隐藏层以及输出层。前馈网络是指每层中的神经元只能与其直接上级通信的网络。由于这些连接的单向性，处理的信号或数据只能从输入层传输到隐藏层，然后到输出层。图\
  \ 4.10 描述了前馈系统的传统布局。\n\n![图 4.10 带反馈回路的神经网络。](img/fig4_10.jpg)\n\n图 4.10 带反馈回路的神经网络。\n\
  \n在训练前馈网络时，通常使用称为反传播的监督学习过程实时更新单个神经元的权重和偏置值。\n\n\n\n\n\n当涉及到前馈网络时，多层感知器（`MLPs`）是一种采用了许多层且其隐藏层具有非线性神经元传输的子类型。即使在数据不可线性分的情况下，`MLPs`\
  \ 也能将训练模式与输出相关起来。医学影像非常适合前馈网络，这是因为输入和输出都是数字，而且输入/输出向量对为监督学习提供了坚实的基础。\n\n### 4.3.4\
  \ 反馈网络\n\n通过在网络中进行循环反馈，隐藏层和输出层的值会被传回到反馈（或循环）神经网络中更早的阶段，从而允许信息的双向交换。它们处于一个向新的、稳定状态持续转换的过程中。在输入被改变并建立新的平衡之前，它们倾向于停留在平衡点上。它们具有极大的处理潜力，但也可能变得非常复杂。\n\
  \n## 4.4 用于分析健康图像的深度学习架构\n\n对于业内人士来说，“深度学习”是 `ML` 的一个分支，在该分支中使用复杂的多层神经网络来解决问题并从海量数据集中获取知识。通过使用预定义的框架反复分析数据，深度学习算法旨在得出与人类相同的结论。深度学习通过采用称为神经网络的复杂算法结构来实现这一点。分类、回归、聚类、重建具有较伪影的图像、检测和移除病变以及分割，只是深度学习设计用于完成的众多任务之一。在深度学习中，许多线性和非线性处理单元被组合在深度架构中，以对数据中包含的高级抽象进行建模。许多深度学习方法已经在使用，并且可以应用于大规模场景。深度学习模型可以分为两类：依赖人类输入训练数据的模型和不依赖人类输入数据的模型。\n\
  \n### 4.4.1 有监督深度学习模型\n\n#### 4.4.1.1 卷积神经网络 (CNN)\n\n在用于分析医学影像的 `ML` 技术方面，`CNNs`\
  \ 受到了最多的关注。这是因为与其他图像过滤方法不同，`CNNs` 能够保持像素之间重要的空间关系。解剖结构之间的空间关系在放射学中至关重要，无论是骨骼边缘从骨到肌肉的过渡，还是肺边缘从正常组织到恶性肺组织的过渡。`CNN`\
  \ 在深度神经网络中采用了整流线性单元（`RELUs`）、）、池化（`pooling`）和卷积（`convolutions`）层，将原始像素图像转换为更有用的表示，如图\
  \ 4.11\n\n图 4.11 CNN 的示意图。\n\n#### 4.4.1.2 循环神经网络 (RNN)\n\n`RNNs` 的传统用途涉及序列数据的分析。`RNNs`\
  \ 因为其生成文本的能力对文本分析有用，这导致它们被应用于自动语言处理、语言建模、文本预测和图像说明合成等各种领域。简单的 `RNN` 上下文“记忆”通过将每一层的输出添加到下一个输入中，然后将该信息传回该层来实现。`LSTM`\
  \ 网络和门控循环单元（`GRUs`）从标准的 `RNNs` 演变而来，以避免时间反向传播中的梯度消失问题。这些是对 `RNNs` 的改进，允许它们在保留长期依赖知识的同时选择性地忘记其他信息。从历史上看，`RNNs`\
  \ 主要被用于医学图像分析中的分割，作为一个研究课题。\n\n#### 4.4.1.3 基于 CNN 的迁移学习\n\n为了解决训练数据不足的问题，研究人员提出了一种名为迁移学习的技术，在这种技术中，算法使用与原始数据集非常松散的数据集和一个标记的训练数据集进行学习。其基本思想是利用训练对\
  \ `CNN` 一组权重的强调到另一个（可能无关的）数据集上，以便在标记的医学数据上训练第二个 `CNN`。只有 `CNN` 的最后一个全连接层是不允许调整权的。虽然\
  \ `CNNs` 常用于医学图像分析，但迁移学习技术可以通过任何标准的 `ML` 方法实现。通常情况下，与从零开始训练 `CNN` 相比，从另一个 `CNN`\
  \ 迁移更多的层时，结果会更好。与其他计算机视觉任务相比，医学图像处理需要对许多层进行精细的校准。\n\n### 4.4.2 无监督深度学习模型\n\n####\
  \ 4.4.2.1 自动编码器\n\n`Autoencoders` 能够在不需要标记数据的情况下，学习数据输入的无监督解释作为特征。所以，本质上，它是一个接收非结构化输入、处理以得出有意义的代码、然后将这些代码应用于新数据的重建的模型。自动编码器后的前提是编码输出应该类似于输入数据；因此，`autoencoder`\
  \ 模型通常包含一个代价函数，当两者不匹配时惩罚模型。`Autoencoders` 由于其许多内置优势而非常有帮助。首先，它们被用作特征检测器，可以自己发现编码，而无需提供任何遵循的标签。此外，由于编码通常存在于较低维度，它们简化并减少了模型的维度。第三，`autoencoder`\
  \ 的输出是原始信息高度相似的信息，因为它们必须重建输出。这些特征在分析健康图像这一挑战性领域特别有用，因为那里的标记数据非常稀缺。图 4.12 展示了网络架构的几个示例。\n\
  \n![图 4.12 A) RNN, B) 自动编码器, C) 受限玻尔兹曼机, D) 深度信念网络, E) 生成对抗网络。](img/fig4_12.jpg)\n\
  \n图 4.12 A) RNN, B) 自动编码器, C) 受限玻尔兹曼机, D) 深度信念网络, E) 生成对抗网络。\n\n`Autoencoders` 与其他神经网络架构的区别在于，输入层和输出层需要使用相似数量的神经元。`Autoencoders`\
  \ 和 `CNNs` 一样，使用可以层叠的底层深度来提高性能。在堆叠自动编码器（`SAE`）的中间层中通常有一条跨越隐藏层的思考路径，使得架构是对称的。诸如迁移学习、独立训练多个自动编码器子集以及逐层权重绑定等技术可以用于提高\
  \ `autoencoder’s` 性能。\n\n\n\n\n约束条件对于引导模型学习相关的表示是至关重要的。去噪自动编码器是一种利用高斯噪声隐藏层来提高准确性的方法示例。使用一种名为\
  \ `dropout` 的技术也可以实现类似的结果，它通过随机关闭大脑中某些早期埋藏的神经元层来实现。这迫使模型学习高效的编码，以便在输出层重建清洁的输入。其次，稀疏自动编码器是另一种编码方法，其中深层中的一定数量的神经元被刻意禁用。为了防止模型过度依赖少数激活的神经元，你可以实现一种代价函数，当激活神经元的数量达到特定值时对模型进行惩罚。一种日益流行且前沿的无监督学习架构是变分自动编码器（`VAE`）。随机梯度下降可用于训练\
  \ `VAEs`，它们由一个贝叶斯推理编码器网络和一个解码器网络组成，形成了一个生成式模型。编码器网络使用高斯分布来近似投影到输入数据的潜在空间变量的分布。\n\
  \n#### 4.4.2.2 受限玻尔兹曼机\n可见层和隐藏层构成了受限玻尔兹曼机（`RBMs`），这些是随机且概率性生成的双向图模型；它们基于 1985 年发明的原始玻尔兹曼机。这些层具有外部连接，但没有内部通信。RBMs\
  \ 利用输入数据的反向传播来重构和估计原始输入的概率分布。\n\n#### 4.4.2.3 深度信念网络 (DBNs)\n在深度信念网络（`DBNs`）中，一个\
  \ `RBM` 的隐藏层输出馈给下一个 `RBM` 的输出层输入，允许使用对比散度算法进行快速训练。对深度学习的新兴兴趣在很大程度上可以归功于 `DBNs`。可以以贪婪的、增量的方式训练\
  \ `DBNs`，其中低层负责学习基础特征，高层负责更复杂的特征，模拟了现实世界中数据的自然层次结构。作为替代方案，通过将 `DBNs` 与有监督的 `RBMs`\
  \ 层耦合，可以创建出一种半监督深度学习架构。\n\n#### 4.4.2.4 生成对抗网络 (GANs)\n如生成对抗网络（`GANs`）等无监督学习技术在医学图像分析等应用中显示了潜力。`GAN`\
  \ 是一种生成模型，与 `VAE` 类似。`GANs` 由两个同时训练的竞争模型组成。这些模型可以是多层感知器（如 `CNNs`），也可以是完全不同类型的模型。这些模型可以被视为一场没有胜负的竞赛中的对手。在卷积神经网络的背景下，生成器是创建伪造训练图像的东西。第二个\
  \ `CNN` 是判别器，它确定图片是否属于训练集或是否由生成器生成。这种对抗性设置的理想结果是判别器无法区分真实图像和生成的图像。\n\n## 4.5 基于深度学习的医学图像分析技术\n\
  深度学习优于传统的 `ML`。从那时起，计算医学图像研究人员研究了如何将深度学习应用于 CT、MRI、PET 和 X 射线图像。深度学习被应用于图像配准和定位、目标识别、器官分割以及计算机辅助的疾病预后和诊断。\n\
  \n### 4.5.1 用于图像配准的深度学习\n图像分析领域常见的健康图像配准涉及计算两幅医学图像之间的坐标变换，以便它们在空间上有更好的对齐。这种优化通常使用特定的（非）参数化变换和固定度量（如\
  \ `L2-norm`）迭代地进行。尽管深度学习通常应用于分割和病变识别等更突出的问题，但研究表明，使用深度网络获得了最佳的配准性能。最近的研究集中在两种方法上：深度学习网络可以直接预测变换参数，或者确定两幅图像之间的相似性度量以驱动迭代优化技术\
  \ `[12]`。\n\n### 4.5.2 用于图像定位的深度学习\n治疗计划和干预临床工作流的预处理分割活动包括解剖项目（如器官或标记点）在空间或时间中的定位。医学图像定位经常涉及\
  \ 3D 体分割。已经提出了多种使用深度学习算法解析 3D 数据的方法，但它们总是将空间简化为一系列 2D 正交平面。使用卷积神经网络对 2D 图像分类似乎是器官、区域和标记点定位最流行的方法。然而，较新的出版物在此基础上，通过调整学习过程来更加强调精确定位，并显示了前景。它们证明了深度学习策略可以被修改以用于许多定位应用。我们预计此类方法将得到进一步研究（例如，多个标记点）`[13]`。\n\
  \n### 4.5.3 用于目标检测的深度学习\n在诊断的许多密集型方面中，中的目标/病变识别至关重要。在大多数情况下，任务包括在整个图像中寻找并标记微小病变。自动病变检测系统的研究悠久，其双重目标是提高输出质量和提高速度。放射学工作流严重依赖医学图像中解剖组件的定位和插值。为了实现这些目标，放射科医生通常寻找“解剖特征”，即图像中唯一标识给定解剖结构的特征。计算机能自动学习这些解剖特征吗？通过计算程序可以恢复多少解剖特征对于此类方法的成功至关重要。不再像早期研究中那样使用自定义图像滤波器来分离解剖特征，基于深度学习的方法已成为常态，原因有两个：(a)\
  \ 基于 `DL` 的方法已经进步到可以应用于现实关注问题的程度；(b) 越来越多的医学图像数据集现在可以获取，为研究人员深入挖掘医学图像数据库铺平了道路 `[14]`。\n\
  \n### 4.5.4 用于器官分割的深度学习\n\n\n\n\n\n在心脏或大脑分析中，可以对医学图像进行分割以量化体积和形状等临床因素。分割被描述为选择组成物体边界或内部的体素组的过程。由于将深度学习（DL）应用于健康成像通常侧重于分割，因此在不同方法上的实验最为充分，例如创建基于\
  \ `CNNs` 的新型分割架构，以及 `RNNs` 的广泛使用。在医学图像分析方面，名为 `UNet` 的替代 `CNN` 架构是这些方法中最广为人知的。等数量的上采样层和下采样层是\
  \ U-Net 的创新架构特征之一。`UNet` 使用所谓的跳跃连接（skip connections）将对抗卷积反卷积层与学习的上采样层相结合。这结合了收缩路径和拓宽路径的特征。从训练的角度来看，这意味着\
  \ `UNet` 可以在单次前向通过中分析整个图像/扫描，立即生成分割图。因此，与基于块的 `CNNs` 不同，`UNet` 可以从考虑整个图像中获益。由于 `RNNs`\
  \ 的普及，现在可以使用 `RNNs` 对空间 H&E 组织理学图片中的周肌膜进行分割。该网络会记住当前块行和列中的前驱节点。通过在相反方向上应用四次 `RNN`\
  \ 然后将组合结果输入到全连接层，包含了来自左、右邻居的双向输入。深度学习及类似技术在健康图像分割中的应用大幅增加。现在已经有了针对分割问题的专门架构方法。在某些情况下，这些方法甚至优于\
  \ `fCNNs` 的结果；因此，它们显然处于正确的轨道上 [15]。\n\n### 4.5.5 应用深度学习帮助计算机预测和诊断疾病\n\n`CADe` 的目的是检测结构图像中的可疑区域并提高医生对这些区域的认识。`CADe`\
  \ 的开发是为了通过减少归于人为错误或疲劳导致的假阴性率来改进疾病检测。深度学习的进展使得 `CADe` 成为医学成像中一种可行的选择，尽管它已经存在一段时间，但这些进展使其在各种临床环境中变得更有用。标准的\
  \ `CADe` 包含以下步骤：特征（可能是形态学或统计数据）被用于表示候选区域，然后将其输入到如 `SVM` 等分类模型，然后由模型输出或对疾病的存在做出结论。深度学习可以使用人类创建的特征表示。有很多小组成功应用了自身的深度模型，其中包括\
  \ CT 图片中间质性肺疾病的分类、脑微出血的诊断，以及 MR 图像中与多发性硬化相关病变的诊断目的 [16]。\n\n### 4.5.6 使用深度学习辅助人工智能疾病诊断和分类\n\
  \n人们将分类称为“计算机辅助诊断”（`CADx`）并不稀奇。`CADx` 根据成像数据对疾病诊断提供第二种无偏的意见。单图像的恶性病变分类和疾病诊断是 `CADx`\
  \ 最重要的两个用途。历史上，`CADx` 系统是围绕整合人类设计、领域专家工程特征而构建的。最近，`CADx` 系统从深度学习技术的实施中受益 [17]。基于内容的图像检索、图像生成、增强以及将图像数据与报告合并是一些其他基于深度学习的医学成像应用。\n\
  \n## 4.6 基于深度学习的疾病早期诊断临床应用\n\n本节概述了深度学习帮助医学成像众多临床应用领域的方法。特别是，本节讨论了应用于某些常见疾病诊断医学照片分析的\
  \ AI 技术，例如影响大脑、心脏、眼睛、腹部、乳部和胸腔的疾病 [18]。\n\n### 4.6.1 大脑\n\n深度神经网络（`DNNs`）已广泛应用于许多不同领域的脑成像处理。大脑组织和架构组件的分割，以及阿尔茨海默症的分类是频繁的研究课题。此外，病变识别和分类的过程也是关重要的。许多与脑图像分析的问题现在已由\
  \ `DNNs` 完全解决。为止，表现最好的团队在 2014/2015 年脑瘤识别竞赛（BRATS）、2015 年纵 MS 病变分割挑战（ISLES）以及 2013\
  \ 年 MR 脑图像分割挑战（MR brains）中部署了 `CNNs`。这些方法中的大多数集中在分析大脑的 MR 扫描，深度学习不仅对统计分析有用，而且适用于\
  \ MRI；大脑的 CT 和 US 扫描也应该看到类似的改进 [19]。\n\n### 4.6.2 眼睛\n\n最近，高级 ML 算法已应用于眼睛图像的理解，尽管近年来眼科成像已取得了显著进展。大多数研究使用基础卷积神经网络分析彩色眼底图像（`CFI`）。解剖特征的分割、视网膜异常检测、眼病诊断和整体图像质量评估只是其涵盖的众多应用之一\
  \ [20]。Kaggle 2015 年糖尿病视网膜病变检测使用了 35,000 多张彩色眼底照片来训练算法，以评估 53,000 张测试照片中的疾病严重程度。61%\
  \ 的竞争团队使用了深度学习，其中四支团队在端到端卷积神经网络的帮助下超过了人类。最近，Gulshan 等 (2016)](ch04.xhtml#ref4_21))\
  \ 对 Google Inception v3 有效性进行了深入检查 [21]，得出了与七名高训练眼科医生小组相同的结论。\n\n### 4.6.3 胸部\n\n\
  放射学和 CT 胸部图像分析中最常见的讨论话题是结节的检测、描述和分类。许多研究要么通过从深度网络获取特征补充现有的特征集，要么将 `CNNs` 与利用手工特征的传统\
  \ ML 技术进行比较。多个研究小组发现胸部 X 光可以使用单一系统识别多种疾病。使用 CT 诊断间质性肺疾病是一个活跃的研究领域。多项工作利用胸部 X 光是最常进行的放射检查这一事实，来完善它们自己的\
  \ `CNN` 图像分析和 `RNN` 文本分析系统。预计近期该领域将更多研究。\n\n### 4.6.4 乳部\n\n\n\n\n\n乳腺成像是 `DNNs`\
  \ 早期应用的领域之一。随着近期兴趣的复兴，该领域在先进水平取得了显著改进，使得 `ROIs` 的性能能够达到人类读者的水平。由于大多数乳腺检查方法仅使用两个维度，因此在自然照片上被证明有效的程序可以相对容易地用于此处。除了这一例外，研究主要关注乳腺癌检测，而这本身又细分为三个子任务：乳腺组织成像、识别肿块病变、识别微钙化，以及根据潜力对图像进行排序。作为最常用的筛查方法，乳腺线摄影受到了最多的关注。断层扫描、超声和剪切波弹性成像，以及利用深度学习的乳腺\
  \ MRI 预计未来将获得进一步的研究。\n\n### 4.6.5 心脏\n\nAI 技术已应用于心脏图像解释的各个方面，例如超声检查、`CAT scanning`\
  \ 和 `MRI` 等成像技术。通过对上述模式的自动分析，医生可以更多地了解心肌形状和功能，确定患者心脏衰竭的原因，寻找组织损伤迹象等。尽管 `MRI` 是研究最充分的方法，且左心室分割是最常见的任务，但仍有广泛的应用场景。这些包括分割、跟踪、切片分类、图像质量评估、自动钙评分、冠状动脉中心线跟踪和超分辨率。\n\
  \n大多数研究依赖于简单的 `2D CNNs` 以及对 `3D`（在某些情况下为 `4D`）数据的逐切片评估；`DBNs` 仅在少数研究中使用。在复合分割框架中，`DBNs`\
  \ 专门用于提取特征。两项工作因对 `CNNs` 和 `RNNs` 的创新应用而脱颖：：在 `UNet` 框架内部建立了重复链接以分割左心室，另一项则使用 `CNN`\
  \ 来检测和标记血管；而另一项则使用 `RNNs` 来学习从上一次分割到下一次分割保留哪些信息。另一种架构使用带有长短期记忆单元的常规 `2D CNN` 执行时间回归，允许检测心脏序列中的单个帧。\n\
  \n### 4.6.6 腹部\n\n肝脏、肾脏、膀胱和胰腺是试图定位和划分这些器官的文章中最常讨论的腹部器官。分析前列腺的标准方法是磁共振成像 (`MRI`)，而对于所有其他器官，`CT`\
  \ 是金标准。仅结肠领域已有多种应用，但它们都采取了相当简单的方法，利用 `CNN` 进行特征提取，然后使用这些特征对数据进行分类。最近发现一种与 `UNet`\
  \ 非常相似的 `3D fCNNs` 脱颖而出。这项研究采取了有趣的策略，通过用求和操作替换 `U-concatenation` 网络的功能，创建了 `ResNet`\
  \ 和 `UNet` 架构的混合。\n\n## 4.7 结论与未来方向\n\n使用计算模型进行医学图像处理极大地改进了临床应用和基础研究。深度学习的最新进展为基于形态和/或纹理模式分析医学照片提供了新的可能性。在许多医学医学应用中，深度学习技术已经达到了技术先进的效率。在技术辅助的视觉感知中，海量的训练数据（例如\
  \ `ImageNet` 中超过一百万的标注照片）导致了性能的革命性进步；一个公众可以查看的大型医学图像集合也将提升性能。以数据驱动的方式表示的特征，特别是在以无监控方式应用时，提高了精密度；然而，建议结合领域专业知识构建新的方法论框架。为了避免需要训练专门针对特定扫描模式的深度模型，我们需要创建能够有效管理使用多种扫描协议收集图像的算法策略。最后，利用深度学习进行\
  \ `fMRI` 图像分析以发现以前未见的模式，但直观理解和解释生成的模型仍然很困难。\n\n深度学习模型在医学图像处理上非常成功；然而，该学科的主要局限是缺乏大规模医学数据集。领域迁移将在自然图像上学习的模型应用于医学图像应用，或将其转移到不同的图像模式，是受迁移学习概念启发的方法。联邦学习是另一种方法，允许在不同数据中心之间协同进行训练。近期在分析医学图像时出现了编制基准数据集的趋势。类别不平衡是医学图像分析人员遇到的另一个重大困难。针对新型损失函数的设计已有多种研究，包括\
  \ `focal loss`、`grading loss`、`contrastive loss` 和 `triplet loss`。\n\n得益于尖端深度学习技术的泛滥，医学图像分析在精度、效率、稳定性和扩展性等许多方面取得了巨大成功。本章涵盖了基于深度学习的方法在临床应用中的最新进展，如图像分类、目标发现、分割和配准。特别是深入研究了人类心血管、神经和胃肠系统诊断中成像分析的应用。文中还介绍了眼、心和脑等疾病在各自领域的前沿研究。\n\
