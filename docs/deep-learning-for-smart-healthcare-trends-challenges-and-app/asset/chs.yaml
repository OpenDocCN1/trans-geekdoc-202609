  \ 108838.\n\n## 5.1 引言\n\n深度学习 (DL) 和机器学习 (ML) 对医学图像分析产生了积极影响。由于 DL 和 ML 在诊断、去标识化等领域的日益普及，医学图像处理取得了快速进展。20\
  \ 世纪 70 年代初，医学图像分析开始演变；而到 90 年代，通过 DL、ML 与数学模型的结合，计算机辅助诊断（CAD）得到了发展。CAD 的流程遵循某些步骤：数据采集、数据预处理、目标检测与分割、特征工程和分类。\n\
  \nDL 技术可以应用于医学图像的分类、分割和诊断。已经开发出许多 DL 算法，如 ResidualNet、AlexNet、GoogleNet、DenseNet、VGG、CapsuleNet\
  \ 等。深度卷积神经网络 (CNN) 通过采用各种激活函数和丢弃函数，解决了模型训练和网络正则化问题，简化了检测、分割和分类任务。CAD 旨在实现灵活且精确的诊断模型，以便为患者提供更高质量的治疗。\n\
  \n本研究工作介绍了用于肺癌诊断和预测的不同 DL 技术。DL 使用了许多层，其中许多层为处理非线性信息提供了丰富的步骤，并存在用于模式分类和特征学习的分层模型。依赖于数据表示的模型可以通过表示学习来确定。最近的文献综述认为，基于\
  \ DL 的表示学习模型包含特征层次，这有助于从底层定义高层概念，反之亦然。一些研究人员表示，DL 是一种广泛的学习方法，能够解决各个领域的所有类型问题。目前，DL\
  \ 已几乎应用于所有领域。\n\n与其他认可的 ML 算法相比，DL 通常是首选，因为它在大型数据集上的性能很高。随着数据的增加，各种 ML 算法的性能会下降，例如朴素贝叶斯、随机森林\
  \ (RF)、支持向量机 (SVM)、决策树等。而 DL 算法即使在大型数据集上运行良好，并展现出最佳的性能指标。图 5.1 显示了 Andre Ng 的 DL\
  \ 与 ML 算法性能对比。\n\n\n\n\n\n![图 5.1 吴恩达关于深度学习算法与机器学习算法的性能对比。](img/fig5_1.jpg)\n\n\
  图 5.1 吴恩达关于深度学习算法与机器学习算法的性能对比\n\n## 5.2 深度学习\n\n与机器学习（ML）类似，深度学习（DL）技术被分为监督、半监督和强化/无监督，如图图\
  \ 5.2 所示。在此分类的基础上，还有一类深度学习方法，即强化学习（RL），它很可能被视为半监督学习的一部分，有时甚至被无监督学习。\n\n![图 5.2 深度学习分类。](img/fig5_2.jpg)\n\
  \n图 5.2 深度学习分类。\n\n1. **监督学习：** 一种使用标签数据来训练模型的学习技术。这类学习具有输入集和相应的输出。监督学习允许从以往经验中收集数据并产生输出，并利用这种技术优化性能。存在不同的监督学习方法，如\
  \ `CNN`、深度神经网络（`DNNs`）、循环神经网络（`RNNs`）、长短期记忆（`LSTM`）、`ResNet`（残差网络）和 `GRU`（门控循环单元）[8]。\n\
  \n2. **无监督学习：** 这些学习能够在不使用标签的情况下学习并训练模型。这些算法的重要特征用于识别输入数据中的未知关系。生成式学习和降维方法被称为无监督学习技术。`AE`、`RNN`、`LSTM`\
  \ 和受限玻尔兹曼机（`RBM`）是一些无监督学习算法。\n\n3. **半监督学习：** 一种同时处理标记和未标记数据的学习类型，即监督和无监督算法的结合（部分标记数据集）。在某些情况下，`RNN`\
  \ 和 `LSTM` 被用于半监督学习，深度强化学习（`DRL`）和 `GAN` 也被使用。\n\n4. **深度强化学习 (DRL)：** 一种用于匿名环境的学习方法[9]。这种技术在某些情况下被认为是半监督学习。基于\
  \ `DRL` 开发了若干种半监督和无监督算法。这类学习没有直接的损失函数；因此，与传统的监督方法相比，在这种环境中的学习更为困难。\n\n## 5.3 医学领域中的深度学习\n\
  \n根据文献综述，学者和分析师已经在医学影像领域开发了用于自动 CAD 诊断的各种应用。放射学中医学图像的主要任务是分类和识别疾病类别[10]。医学图像来源于各种成像技术，如\
  \ `CT`、`MRI`、`X-ray`、显微和超声。\n\nCAD 旨在获得快速且准确的诊断，以确保一组患者能够获得更好的治疗。此外，有效的无人工干预处理减少了人为导致的错误，甚至缩短了处理时间并降低。数据稀缺和类别不平衡是医学图像处理的局限性。在大型数据集的情况下，通常没有足够的标签来训练模型。在这种情况下，需要领域专家投入大量的精力和时间，而且这是一个昂贵的过程。为了消除这个问题，采用了数据增强和转换技术，如缩放、旋转、平移和数据清洗。类别不平衡问题通过基于补丁的方法来解决。\n\
  \n在 DL 创新之前，各种传统的 ML 和图像处理方法已用于医学图像的分割、分类和检测，例如随机森林（`RF`）、决策树、`SVM`、最近邻（`NN`）、贝叶斯分类器等。然而，DL\
  \ 并不局限于医学影像，不同的基于 DL 的技术已应用于不同的领域，包括数据采集、分割、分类、自动标记和描述、计算机辅助检测与诊断、阅读辅助和自动听写、高级电子健康记录（`EHR`）以及用于个性化医疗的精准成像[11,12,13,14,15]。\n\
  \n后续章节将详细讨论 DL 主题，在这些领域中 DL 技术已成功实施，并在医学影像的分割、分类和检测任务中展示了卓越的结果。\n\n## 5.4 用于分析医学图像的深度学习方法\n\
  \n### 5.4.1 卷积神经网络 (CNN)\n\n`CNN` 是一种设计用于处理数据的神经网络架构，数据形式为数组和图像（即结构化数据）。`CNN` 算法广泛应用于计算机视觉（`CV`）和图像处理；这些算法已成为图像分割和分类等各种应用的先进算法[16]。这类算法在定义输入图像的模式方面表现非常好，例如点、线、圆、梯度，甚至是脸部、皮肤和眼睛。与以前的\
  \ `CV` 算法不同，`CNN` 可以直接应用于未处理的图像，而无需进行任何预处理技术[17]。\n\n该网络包含层层堆叠的各种卷积层，每层都可以识别复杂的形状。`CNN`\
  \ 的能力源于被称为卷积层的特定层。卷积层在 `CNN` 中的应用反映了人类视觉皮层的工作方式，其中一系列层处理输入图像并识别。\n\n#### 5.4.1.1\
  \ 架构\n\n与神经网络类似，`CNN` 包含若干被称为卷积层的隐藏层；这里的线性函数决定了步长卷积以从图像中提取特征，如图图 5.3 所示。它甚至包含一个池化层，计算如最小池化、平均池化最大池化等函数以压缩图像尺寸，从而提高计算速度；这是通过特征提取方法完成的。更多的层被称为全连接层，类似于隐藏层；在这里，每个输出层的和被展平并作为下一层的输入，紧接着是激活函数。\n\
  \n#### 5.4.1.2 卷积层\n\n在 `CNN` 中使用线性函数的层被称为卷积层。隐藏层中的每个节点通过实施特征提取等图像处理技术提取各种特征。例如，第一层的第一个节点可以提取垂直边缘，而第二个节点可以提取水平边缘，依此类推。`kernel`\
  \ 用于提取这些特征。图 5.3 解释了步长卷积是如何工作的。输入图像在下方，应用卷积后的输出图像在上方。\n\n#### 5.4.1.3 池化层\n\n\n\n\
  \n\n该层随后被估计为卷积层。池化层的主要目的是降维。池化通常通过三种方式实现（即平均池化、最小池化和最大池化）。最大池化的功能是从特征尺度中提取最高范围的像素值，而平均池化的功能是计算已提取像素的平均值。图\
  \ 5.4 展示了最大池化和平均池化的工作原理。\n\n![图 5.4 池化层工作原理。](img/fig5_4.jpg)\n\n图 5.4 池化层工作原理。\n\
  \n### 5.4.2 循环卷积神经网络 (RCNN)\n\n循环卷积神经网络（RCNN）可以与不同的模型混合；例如，一些研究人员提出了循环卷积神经网络，另一些人将其称为基于区域的\
  \ CNN (region-based CNN)、递归 CNN 和循环 CNN。在混合 CNN 和 RNN 模型中，RNN 的正向特征被用于提高 CNN 的效率。RCNN\
  \ 的关键特征是循环卷积层（`RCL; 即在卷积层中引入了循环连接`）。这些连接帮助网络在输入是静态且每个单元都受到相邻单元影响的情况下随时间推演进。RCNN\
  \ 的这一特征合并了图像上下文信息，这是目标识别和检测的一个重要特征 [18]。\n\nRCNN 是一种神经网络，其中前一步的结果被作为输入馈给后续层，而在传统的神经网络中，每一层的输入和输出都是相互独立的。在某些网络中，需要以前一个层的输出来预测下一层的结果；因此，前层的输出在预测模型中非常重要。因此，实施了\
  \ RCNN 来解决传统网络问题。RCNN 保留之前信息的隐藏层有助于解决这个问题。RCNN 具有记忆功能，可以帮助记住之前之前信息和值。与传统神经网络不同，它利用相似的参数执行每层的输入和输出操作，减少了参数复杂度。\n\
  \n循环神经元与前馈神经元之间的主要区别如图 5.5](#ch05.xhtml#fig5_5) 所示。传统的前馈神经元在输入层和输出层之间仅有一个连接，而循环网络有两个连接（即一个从输入到输出，另一个从输出到输入，因此它包含三个权重）。这个额外的第三个连接被称为反馈连接，激活值可以沿着这个循环移动。当这种前馈连接和循环神经元串联时，就形成了一个\
  \ RCNN。\n\n![图 5.5 循环神经元的基本结构。](img/fig5_5.jpg)\n\n图 5.5 循环神经元的基本结构。\n\nRCNN 的主要优势是信息的存储和序列数据的学习。循环连接通常提供优势。每个单元都利用其上下文信息，特别是在图像识别任务中起着至关重要的作用。\n\
  \n### 5.4.3 UNet\n\n它是一种专门用于分割医学图像的特定 CNN 类型。它是基于 FCN（全卷积网络）开发的。FCN 架构经过修改和扩展，使其能够使用较少的训练图像运行并产生准确的分割。UNet\
  \ 和 FCN 之间的主要区别如下：\n\n1. UNet 模型是对称的，其架构分为三个部分：\n    * 收缩/下采样路径：获取并捕获输入图像的上下文。\n\
  \    * 瓶颈（Bottleneck）\n    * 扩展/上采样路径：通过转置卷积方法调整以验证准确的定位。\n\n2. 下采样和上采样之间的跳跃连接使用连接操作符代替了加法操作符。在上采样过程中，跳跃连接提供了网络局部到全局的知识。由于其对称性，在网络上采样期间提供了广泛的特征图，这种特征图有助于传输信息，而\
  \ FCN 模型在上采样期间包含的特征图很少。\n\n该系统由一个收缩路径和一个扩展路径组成，形成了“U”型网络。收缩路径通常是一个包含循环卷积层的卷积模型；唯一的每一层都伴随着\
  \ `ReLU`（修正线性单元单元）和一个最大池化层，如图 5.6](#ch05.xhtml#fig5_6) 所示。在收缩阶段，与空间（维度信息/数据）相关的数据减少，而特征信息被扩展。在扩展期间，空间和特征信息通过一系列上采样和连接（包括收缩路径特征）进行合并。\n\
  \n![图 5.6 UNet 架构。](img/fig5_6.jpg)\n\n图 5.6 UNet 架构。\n\n### 5.4.4 ResNet\n\n在基于\
  \ CNN 的 AlexNet 架构之后，所有后续架构在深度神经网络算法中都使用了大量的层来降低错误率。这类网络在层数较少时运行良好，但如果层数很多，就会出现一个常见问题，即梯度消失/爆炸问题，梯度变为零或非常大。层数的增加会增加测试和训练错误率。\n\
  \n在反向传播阶段，会计算错误率并定义梯度值。这些梯度值反向发送到隐藏层，并并行更新权重。这个过程一直持续到输入层。在此过程中，梯度值变得越来越小，直到通过反向传播方法到达输入层。因此，在某些情况下，主层的权重保持不变或更新非常缓慢，由于由于原因，主层无法高效学习。因此，训练深度网络显示出准确率较低，它可能会或会在特定值处饱和。\n\
  \n何恺（Kaiming He）[19] 开发了 ResNet，旨在开发超深架构以消除梯度消失问题。\n\n深度残差架构与网络非常相似，它拥有卷积层、激活函数、池化层、密集层和全连接层\
  \ [20]。这些层之间的恒等连接将简单网络转换为残差网络。在这个网络中，使用了跳跃连接技术，它跳过了少数几层的训练并直接连接到输出层。图 5.7 展示了在网络中实现的残差块。从输入指向块末的的箭头被称为恒等连接。\n\
  \n![图 5.7 RU-Net 架构。](img/fig5_7.jpg)\n\n图 5.7 RU-Net 架构。\n\n### 5.5 案例研究\n\n###\
  \ 5.5.1 预处理\n\n\n\n\n从所有类型的成像模式获取图像在训练模型之前需要进行预处理。根据图像的类型，可以采用多种图像预处理技术：背景移除、去噪、重采样、去模糊、归一化、配准和图像增强。所有成像模式最使用的预处理技术是归一化和伪影去除。伪影去除是预处理工作流的主要阶段。例如，考虑使用深度学习（DL）算法进行彩色视网膜病变分类。在训练分类算法之前，必须对原始数据进行预处理。例如，应该对彩色图像进行处理以提高可见性。使用分割操作（绿色通道提取器）移除红色和蓝色通道。然后，可以使用对比限制自适应直方图均衡化算法（`CLAHE`）增强图像强度\
  \ [21,22,23,24]]。\n\n### 5.5.2 目标检测\n\n目标检测是对图像中定位和识别多个对象的识别或过程。目标检测技术也应用于医学图像中，以识别和检测感兴趣区域（ROI），从而帮助医生进行更好、更准确的诊断。使用深度学习进行的目标检测根据检测方法分为两类：基于区域的检测和区域建议（region\
  \ proposal，也称为选择性搜索），后者通过提取 ROI 来工作。为了特别加速识别过程，创建了区域建议网络 [25,26]。目标检测通过采用单阶段网络和回归模型等其他方法实现。医学成像目标检测算法依赖于边界框值和像素标签。\n\
  \n### 5.5.3 分割\n\n文献综述表明，已经实现了一些深度学习应用，特别是用于医学图像分割的应用，因为这类图像面临数据不足的问题 [27]。在这些算法中，`UNet`\
  \ 是医学图像分割领域广泛使用的算法之一。随后，开发了各种版本的 `UNet`。例如，已经开发了用于医学图像分割的基于 `CNN` 的 `UNet` 模型 [28]。研究人员注意到性能有所提高，但他们得出结论认为，在测试阶段对特征分组并没有优势。但这一概念证明了特征求和会影响网络的性能。医学成像领域跳跃连接的优势已通过\
  \ `UNet` 和 `ResNet` 进行了实验评估 [29]。\n\n### 5.5.4 分类\n\n迁移学习作为一种深度学习方法被训练符合计算机视觉（CV）技术要求的模型，并且在数据集很大时运行良好，但在小数据集情况下失效。大多数研究人员出于多个原因使用迁移学习算法；其中两个主要原因是：使用预训练权重进行特征提取，这些权重也用于训练现有网络\
  \ [30]。例如，已经进行了多项研究将训练好的权重用于网络训练，许多研究人员认为迁移学习是分类医学图像的最佳方法并显示出最好的结果。另一项卓越工作是 Google\
  \ `Inception-v3` 技术结合迁移学习用于皮肤癌分类，它实现了与皮肤科医生检测皮肤癌相似的高性能。`DeepCNN` 技术、`2D` 和 `3D`\
  \ 卷积核被深度应用于神经图像和 MRI 扫描，用于脑肿瘤和阿尔茨海默症的分割与分类 [31,32,33,34,35]$。与其他现有方法相比，这些模型实现了最佳性能。深度学习技术也应用于胸部\
  \ X 光的 X 射线图像分析。与神经成像类似，有几种不同的深度 `CNN` 模型应用于肺结节的分割、分类和检测，并且与传统的 `ML` 模型相比，取得了卓越的性能。\n\
  \n## 5.6 挑战与问题\n\n尽管深度学习解决了医学图像分析中的某些特定问题（如自发信息提取），但医学成像中某些需要深度学习解决的挑战和问题，如处理高维数据、数据采集、数据平衡和类别不平衡数据。深度学习模型需要大量数据来训练和构建网络以产生准确的结果。通过获得在\
  \ `ImageNet` 数据集上训练的深度学习技术，这一点得到了增强。尽管如此，尚未证明深度学习方法是否可以在较小的数据集上成功并给出更好的结果。这种模糊性在医学图像中特别是由图像的特征或属性以及来源引起的，例如强度、颜色、纹理、边缘、角度等。因此，网络需要大量的训练参数和训练样本来学习和分析图像的有意义表示。当医学图像与正常图像相比时，医学图像中的差异明显较少。\n\
  \n深度学习网络以通过添加额外的层和参数来理解和分析复杂操作并解释复杂结构而闻名。当具有许多参数的网络利用海量数据训练时，这是可能的，因为使用有限数据训练模型时会发生过拟合问题。因此，深度学习网络与需要海量数据的模型不兼容。基准和公开的医学数据集还不足以高效训练模型；因此，这个问题通过数据增强或数据退化技术（例如深度生成式算法）来解决。\n\
  \n## 5.7 结论\n\n深度学习用于医学图像分析对医疗保健和学术研究产生了重大影响。深度学习的最新进展已扩展到医疗领域，特别是医学成像。临床图像数据通过识别图像中的形态和复杂模式来分析和诊断疾病。本章简要介绍了用于医学图像分析的各种深度学习方法。它强调了深度学习算法在医学图像分析中的挑战和问题。本研究还展示了医学图像分析过程的案例研究：预处理、目标检测、分割和分类。\n\
