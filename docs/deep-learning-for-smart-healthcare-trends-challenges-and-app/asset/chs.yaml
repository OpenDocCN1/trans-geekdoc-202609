  \ 1061–1066).\n\n\n\n\n近年来，利用流行的机器学习（ML）技术对乳腺癌进行准确分类引起了许多研究者的兴趣。机器学习包含了人工智能（AI）的子领域。许多研究人员应用机器学习来重新训练他们的模型，这有助于他们获得更好的性能。当数据量极小时，机器学习能产生出令人鼓舞的结果。但当数据量巨大时，事实证明它是不适用的。机器学习模型分为三类：监督学习模型、无监督学习模型和强化学习模型。监督模型从带标签的数据集（包含输入和类别值）中学习。无监督机器学习模型从未标记的数据中学习。强化学习模型根据准确计算的奖励和对不准确计算的惩罚进行调整。这些算法从先验知识中提取出最相关的数据用于回归/分类\
  \ `[5]`。\n\n深度学习（DL）是一种从图像数据集中积累知识的无监督方法。这些数据可能是未标记的，也可能是非结构化的。深度神经网络具有更多的隐藏层，而不是两层。从本质上，输入层是顶层，输出层是底层。神经网络作为输入层和输出层之外的中间层，即隐藏层。神经元是指层中存在的节点。卷积神经网络（CNN）被广泛用于乳腺图像的分类。乳腺癌图像输入数据集用于模型的训练和测试。图像作为输入提供给\
  \ `CNN`，并带有相应的权重 `[6,7]`。为了减少分类错误并提高模型性能，会对权重进行更新。按照惯例，CNN 模型包含卷积层、激活层、池化层和一个全连接（FC）层。卷积层通过参考滤波器或卷积核对输入图像进行卷积，旨在从源图像提取本质属性。这一过程极大地有助于降维。诸如\
  \ `ReLu` 等激活函数有助于将无边界的中间值限制在有界值内。池化层以分类、识别、检测等形式提取显著特征。分类任务由全连接层完成 `[8]`。\n\n在图像处理中使用机器学习模型可以成为识别和诊断的有用工具。在没有人工努力或协助的情况下，深度学习模型有更大的能力在更早期发现乳腺癌\
  \ `[9]`。深度学习模型的设计和性能取决于特定问题；因此，通过探索选取模型在乳腺癌检测中的性能来确认深度学习的适用性。。这项研究旨在分析预训练模型的性能，即\
  \ `VGG19`、`ResNet50V2`、`InceptionResNetV2`、`DenseNet201` 和 `EfficientNetB6`。这些迁移学习模型为图像分割、分类和分析提供了赞赞的解决方案。对每个深度学习模型的结果进行了比较分析。每个深度学习模型都通过调整其架构和优化超参数值，提供了充足的微调空间。预训练的深度学习模型（即迁移学习模型）被证明比机器学习模型能更好地处理复杂的实时问题。在研究中，`DenseNet201`\
  \ 模型被证明是性能最好的深度学习模型。用于定量性能分析的质量指标包括准确率、精确率、召回率和 `F1-score`。\n\n本章的目标是描述诊断乳腺癌并确定其是良性还是恶性的过程。实验分析中使用了\
  \ `DDSM` 和 `INbreast` 数据集。通过使用我们的乳腺 X 线摄影数据集重新训练最终层，同时冻结主要层的预训练权重，改进了每个模型。\n\n##\
  \ 14.2 相关工作\n\n开发一种能从乳腺 X 片中识别乳腺肿瘤的计算机系统已经过多次尝试。许多作者使用了各种机器学习方法，如特征提取、特征选择和图像预处理，以减少特征数量、加速计算并提高准确性。目前应用于医学领域最高效深度学习方法是\
  \ `CNN` 建模，它已被证明性能优于更传统的方法 `[10,11,12,13]`。\n\n已有许多尝试创建一个能从乳腺 X 片中识别乳腺癌的计算机系统。为了减少特征数量、减少计算时间并增加准确性，一些作者使用了多种机器学习方法，如图像预处理、特征提取、特征选择等。`CNN`\
  \ 模型被证明比传统技术更高效，目前是医学领域最常用的深度学习方法。Z. Hussain 等人 `[14]` 开发了一种基于迁移学习的 `CNN` 模型，用于检测\
  \ `DDSM` 乳腺 X 片数据集中乳腺异常的存在与否，并将肿瘤分类为良性或恶性。他们将基于迁移学习的 `VGG-16` 相结合。他们的技术获得了 88% 的准确率。\n\
  \nM. Alkhaleef 等人创建了一个双击迁移学习（DSTL）基础的模型，用于分类和增强。使用了一个与目标数据集相当的大数据集进行 `DSTL` 以微调预训练网络\
  \ `[15]`。\n\nA. Perre 等人提出了三种基于迁移学习的不同网络，即 `VGG-m`、`Caffe` 和 `VGG-f`。这些预训练的 `CNN`\
  \ 模型经过两次检查，一次带有图像归一化，一次没有，在整个微调过程中寻找乳腺异常。他们评估了给定 `CNN` 特征的 `SVM` 结果 `[16]`。A. Khamparial\
  \ 等人创建了移动网络、残差网络和改进的 `VGG` `[17]`。根据在 `DDSM` 数据集上的研究结果，建议的学习模型在 epoch 为 15 时产生了\
  \ 88.3% 的准确率并达到了 80.8% 的精确率。\n\nL. Falconi 等人引入了 `VGG`、`ResNet`、`Xception` 和 `ResNext`\
  \ 的混合模型。他们在 `CBIS-DDSM` 数据集上的微调试验显示 `VGG16` 的有效性增加，`AUC`  0.844。P. Kaur 等人使用 `mini-MIAS`\
  \ 数据集的新方法。在集成特征提取框架中使用 K-means 收敛来加速可靠特征（SURFs）。多分类 `SVM` 和深度神经网络（DNN）的结合接受了 70%\
  \ 的训练和 30% 的测试 `[18]`。K. Shaik 等人使用多种数据集（即 `DDSM`、`MIAS`、`LAPIMO` 和 `BancoWeb`）测试了一个\
  \ `CNN` 模型，其准确率为 87.5% `[19]`。为了分类有丝分裂，Wahab 等人利用迁移学习 `CNN` 和另一个带有学习参数的 `CNN`。他们方法得到的精确率、召回率和\
  \ F 分数分别为 0.50、0.80 和 0.621 `[20]`。\n\n\n\n\n\n在不调整源网络层的情况下，Cao 等人 \\[21\\] 通过随机森林差异性将不同的特征组结合（`ResNet125`）。使用“ICIAR2018”数据集，分类准确率提高到\
  \ 82.90%。Charan 等人 \\[22\\] 使用 224×224 像素的输入图像和 14 层卷积神经网络（CNN）进行训练。该网络在 MIAS 数据库上的准确率为\
  \ 65%。本章提出了一种基于预训练的 CNN 模型，用于乳腺摄影图像中乳腺癌的分类。\n\n## 14.3 材料与方法\n\n### 14.3.1 材料\n\n\
  本章的实验研究是在两个数字乳腺 X 光数据库上进行的，即 `DDSM` 和 `INbreast`。\n\n#### 14.3.1.1 DDSM\n\n该数据集包含超过\
  \ 2600 个病例，根据疾病的严重程度编译。在 `DDSM` 中，对每个患者从四个角度拍摄乳腺摄影。记录了患者的年龄、筛查日期以及由专业放射科医生利用美国放射学学院报告系统确定的乳腺密度\
  \ \\[23]。使用像素级地面真异常指标来识别具有可疑区域的病例。在这项研究中，将 641 名良性患者和 688 名恶性患者（共 5316 张图像）纳入评估的\
  \ 1329 个病例子组中。已证明该数据集与本研究相关，因为它专门关注将实例分类为良性或恶性。\n\n#### 14.3.1.2 INbreast\n\n取自葡萄牙大学医院乳腺中心（Centro\
  \ Hospitalar de S. Joao `CHSJ``, Porto）的数字乳腺摄影图像在获得医院伦理委员会和国家数据保护委员会批准后被整合到 `INbreast`\
  \ 数据库中。`INbreast` 数据集包含 115 名患者的双乳腺视角（`MLO` 和 `CC`）图像。受影响双乳腺的 90 名女性中的每位都进行了四次乳腺摄影，而接受乳腺切除术的\
  \ 25 名患者仅进行了两次乳腺摄影（即 50 次乳腺摄影）。因此，使用 115 名患者的 `MLO` 和 `CC` 图片共创建了 410 张乳腺摄影。这涵盖了良性和癌性实例\
  \ \\[[24]。\n\n### 14.3.2 卷积神经网络\n\n在本节中，描述了每个 `CNN` 架构的基本元素。`CNN` 是深度神经网络的一个子集，主要用于图像识别和分类。CNN\
  \ 最近已成为图像处理中的一种即用技术，特别是在人脸检测、文本处理和医学影像方面 \\[25,26]。自 1989 年创建以来，CNN 已有效用于图像分类、分割等许多应用。人类大脑的视觉处理过程设计得与\
  \ `CNNs` 相似。大脑中的神经元与其周围的环境相互联系。卷积层、池化层和 `FC` 层协作生成用于特征提取的图像。`CNN` 提取图像的拓扑特征，这些特征在空间上是不相关的。基础\
  \ `CNN` 架构如图图 14.1](#ch14.xhtml#fig14_1)所示。\n\n![图 14.1 CNN 架构。](img/fig14_1.jpg)\n\
  \n图 14.1 CNN 架构。\n\n#### 14.3.2.1 卷积层\n\n卷积层是 `CNN` 架构的核心元素。卷积层中的神经元与其局部周围相互相关。卷积层通过空间上的组织生成用于特征提取的图像。卷积层、池化层和\
  \ `FC` 层协作生成用于特征提取的图像。`CNN` 提取图像的拓扑特征，这些特征在空间上是不相关的。基础 `CNN` 架构如图图 14.1](#ch14.xhtml#fig14_1)所示。\n\
  \n#### 14.3.2.2 池化层\n\n池化层是卷积层之后的层，通过下采样技术从卷积层的输出中提取关键信息。最大池化和最小池化是该层执行两种主要操作 \\\
  [27]。\n\n#### 14.3.2.3 全连接层\n\n全连接层是 `CNN` 的最后一层，作为分类器，根据生成的特征图确定输入数据的类别。输出类别的数量等于\
  \ `FC` 层的单元数 \\[28]。\n\n\n\n\n一种名为 `ResNet50V2` 的庞大架构从 `ResNet50` 衍生而来，并在后期得到了改进，其性能优于早期的\
  \ `ResNet101` 等架构。`ResNet` 是一种现代卷积神经网络（CNN），它利用设计中的残差块来解决梯度消失问题。在残差网络中，多个残差块堆叠在一起。每个残差块由通过跳过一或多层来实现快捷连接的连接组成。`ResNet50V2`\
  \ 使用了权重层的预激活。在数据集上，`ResNet50V2` 产生了精确的预测。\n\n### 14.3.3.3 InceptionResNetV2\n\n\
  该网络将特定的 `ResNet` 设计与 `Inception-v3` 网络架构相结合。使用批次归一化作为标准层。通过使用剩余模块增加了网络的深度和 Inception\
  \ 块的数量。`Inception-ResNet-v2` 架构由一个主干块（stem block）和三组不同的 Inception 块组成。第一个块由五个 Inception\
  \ 模块组成，每个模块包含七个卷积块。第一个块中包含十个 Inception 模块，每个模块包含五个卷积块；第三个也是最后一个块中包含五个 Inception\
  \ 模块，每个模块包含四个卷积块。这两个块都包含两个带有大量卷积层、平均池化和全连接层的耗尽块（depletion blocks）。输出层使用了 `Softmax`\
  \ 激活函数。\n\n### 14.3.3.4 DenseNet201\n\n`DenseNet` 中的每一层除了接收自身的特征图外，还会接收来自所有之前层的额外输入。由于获取了所有之前层的特征图，该网络具有较少的通道，带有增长率\
  \ `k` 作为每层额外通道数的 `3×3` 卷积，以及批次归一化（`BN`）和 `ReLU`。\n\n神经网络的总层数由 `DenseNet-201` 中的\
  \ `201` 表示。各种层的组合是 `DenseNet201` 的常见构建方式。它由两个稠密块（`1×1` 和 `3×3` 卷积）、五个卷积和池化层、三个过渡层、一个分类层和三个过渡层组成。\n\
  \n### 14.3.3.5 EfficientNetB6\n\n2019 年开发了 `EfficientNet`。尽管它的学习率比 `ResNet` 稍慢，这是它的缺点，但认为它对于我们的应用具有足够的计算速度和准确性。CNN\
  \ 通常通过使用模型扩展来增强。性能随着网络深度的增加而提高。可以根据需要增加或减少节点数量来开发有效的模型。然而，这些调整需要手动进行，在多次尝试后，可以利用超参数构建更优的\
  \ CNN。\n\n## 14.4 方法论\n\n在神经网络中，神经元和突触连接到数学模型中以模拟人类大脑。本质上，`DL` 使用 `CNN` 层训练模型。本研究分析了五种不同\
  \ `DL` 模型区分典型和异常乳腺 X 光图像的能力。所提的研究比较了五种不同模型的性能，包括 `VGG19`、`ResNet50V2`、`InceptionResNetV2`、`DenseNet201`\
  \ 和 `EfficientNetB6`，并按照以下步骤实施。\n\n**第一阶段：** 数据预处理\n\n**第二阶段：** 使用 `DDSM` 和 `INbreast`\
  \ 数据集通过迁移学习训练五种不同类型的模型（`VGG19`、`ResNet50V2`、`InceptionResNetV2`、`DenseNet201`、`EfficientNetB6`）\n\
  \n**第三阶段：** 测试并预测良性或恶性图像\n\n**第四阶段：** 使用标准指标比较这五种模型的性能\n\n### 14.4.1 第一阶段：数据预处理\n\
  \n数据库中的乳腺 X 光图像包含各种不良的视觉特征、噪声和伪影，使它们成为会降低分类准确性的低质量图像。为了从 `DL` 模型获得准确的结果，数据集中的输入图像经过了伪影去除、图像缩放和数据增强的预处理。在这项研究中，使用阈值技术\
  \ `[30]` 去除伪影并将原始图像缩小为 `224×224` 像素。\n\n数据分类的关键要素，也是 `ML` 和 `DL` 模型最重要的方面是特征提取。特征描述了与各种疾病相关的模式。在\
  \ `DL/ML` 模型的训练阶段，这些特征提取组件对于确定数据样本的类别标签至关重要。因此，为了精确预测，训练数据集应该包含大量代表良性和恶性乳腺 X 光检测的数据集。带有和不带数据增强的图像总数如表\
  \ 14.2]所示。对于所有实验，传统的数据增强通过重缩、剪切范围、缩放范围、验证划分和水平翻转完成。数据增强用于提高模型在训练和测试数据集上的性能。此外，`DL`\
  \ 模型需要大量信息以便在训练测试期间获得更好的理解。\n\n表 14.2 原始图像与增强图像的数量\n\n| | **图像总数（原始）** | **图像总数（增强）**\
  \ |\n| --- | --- | --- |\n| **数据集** | **良性** | **恶性** | **总计** | **良性** | **恶性**\
  \ | **总计** |\n| `DDSM` | 2600 | 2716 | 5316 | 5970 | 7161 | 13131 |\n| `INbreast`\
  \ | 36 | 76 | 112 | 5112 | 2520 | 7632 |\n\n### 14.4.2 第二阶段：训练五种类型的模型\n\n此阶段目标是使用迁移学习和全局池化层训练预训练模型，即\
  \ `VGG19`、`ResNet50V2`、`InceptionResNetV2`、`DenseNet201` 和 `EfficientNetB6`。激活函数是\
  \ AI 模型的核心。这项研究工作探索了两种激活函数，即卷积层中的 `ReLU` 和全连接层中的 `Softmax`。在全连接层之前使用 `Dropout(0.2)`\
  \ 以消除无关节点进行网络正则化。在编译开发模型时使用了 `Adam` 优化器。图 14.2 显示了所选模型的微调方法。\n\n![图 14.2 所选模型的方法](img/fig14_2.jpg)\n\
  \n### 14.4.3 第三阶段：测试并预测良性或恶性图像\n\n一旦完成了所提模型的训练，就可以使用测试集测试模型以预测良性或恶性乳腺。模型测试结果显示，在这五种模型中，`DenseNet201`\
  \ 几乎达到了最高预测。\n\n### 14.4.4 第四阶段：性能分析\n\n使用标准性能参数来检查和比较五种模型的实验结果。\n\n这些测量参数定义如下：\n\
  \n${Accuracy} = \\frac{TP + TN}{TP + TN + FP + FN} \\times 100$ (14.1)\n\n${Precision}\
  \ = \\frac{TP}{TP + FP}$ (14.2)\n\n${Recall} = \\frac{TP}{TP + FN} \\times 100$\
  \ (14.3)\n\n$F1 - {Score} = 2 \\times \\frac{precion \\ast recall}{precion + recall}$\
  \ (14.4)\n\n\n\n这些模型是在 Google colaboratory (Colab) 上使用配备 8 GB RAM 的联想设备执行的。Colab\
  \ 笔记本基于 Jupyter notebook，运行在 Google 文档对象上。笔记本配置了必要的深度学习（DL）和机器学习（ML）库文件，如 `Tensorflow`、`Keras`、`matplotlib`\
  \ 和 `NumPy`。通过微调适用于乳腺图像正常和异常检测的超参数，还实验了模型的效率。\n\n开发的模型通过 `Adam` 优化器进行训练。对于 `DDSM`\
  \ 和 `INbreast` 数据集，选择了 32 的固定批量大小（batch size）。此处考虑的批量大小经过了缩小，因为它可以提高模型的测试准确率并加速网络学习。`Adam`\
  \ 优化器的学习率为设置为 0.01。模型使用 `Adam` 进行训练，它根据训练数据集迭代地调整网络权重。`Adam` 源自自适应动量估计。数据集包含训练集和测试子集。\n\
