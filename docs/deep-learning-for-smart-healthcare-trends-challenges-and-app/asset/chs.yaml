  \n# 基于深度学习的听障人士势识别\n\nM. Maratharajan, 计算科学与工程学院, VIT 大学, Bhopal, Madhya Pradesh,\
  \ 印度\n\nS. Balakannan, 信息技术系, Kalasalingam 研究与教育学院, Tamil Nadu, 印度\n\nC. Balasubramanian,\
  \ 计算机科学与工程系, Kalasalingam 研究与教育学院, Tamil Nadu, 印度\n\nP. Naveen, 电气与电子工程系, KPR 工程技术学院,\
  \ Coimbatore, Tamil Nadu, DOI: `10.1201/978100346905-8`\n\n## 8.1 引言\n\n根据世界卫生组织（`WHO`）发布的报告估计，全球残障人数可能超过\
  \ 10 亿。报告进一步提到，在该群体中有 3.6 亿人受听力障碍影响。受此类听障影响的人在日常生活中经历了许多不愉快的经历。他们在教育、工作、职业和个人生活中面临着挑战，因此无法过上舒适幸福的生活\
  \ [1]。\n\n现在是时候为听障群体的这类困扰提供技术解决方案了。因此，可以努力为他们提供先进的辅助技术并满足他们的需求。然而，这些技术应该是负担得起的并符合他们的核心需求的。这项工作聚焦于一种帮助他们过上相对正常生活的辅助技术概念，以满足他们的需求\
  \ [2,3]。此外，他们将摆脱听力损失带来的困难。在分析了所有因素后，本工作制定了首要目标：为哑聋人士开发一种成本且易于获取的通信手段 [4]。预计这种方法将使他们无需使用手语或其他非语言交流。在研究分析中发现，这一类哑聋人士在使用手语外还使用一些视觉媒体。因此，这项工作的主要目标是开发一个哑聋人士可以轻松使用的改进通信平台。\n\
  \n根据美国语言听力协会的说法，听声音和单词有助于学习、交流和理解。听力障碍者无法听到这些声音。这可能导致说话、阅读、学业成就和社交技巧方面的困难。如果你怀疑某人听力有问题，对他们进行测试是关重要的。听力损失可能导致语言发育延迟、学习困难等。\n\
  \n从背景噪声中识别言语是听力障碍者的一个共同问题。尽管在开发听力技术方面付出了巨大努力，这个问题仍然具有相当大的障碍性。起源蜗神经性听力损失的特征是听力阈值增加随后的听力下降。由于他们通常在普通音量下就能检测到强音，这些听者在信号强度增加时，音量迅速增大，限制了他们的动态范围。听力下降是听障听力者面临的挑战之一。在环境下的语音识别对许多听障人士来说是可以接受的，因为目前的助听器能够很好地以适合每个耳朵的方式放大声音。由于这些限制，听障听者在嘈杂环境中难以理解言语，解决这个问题也同样困难。现代听力技术使用麦克风阵列来提高嘈杂环境下的语音理解。波束成形（也称为空间滤波）可以在抑制一个方向声音的同时增强另一个方向的声音。最基础的方法（`delay-and-sum`）假设噪声产生在别处，感兴趣信号位于零方位。在自适应波束成形中，利用一个同时接收目标语音和噪声的主麦克风从目标语音中减去噪声以消除噪声源。\n\
  \n在实践中，如前所述，哑聋人士在交流中使用常用手语外，还使用多种视觉参考。近年来，关于手势的研究数量巨大 [5]。根据文献综述，观察到的手势的基本步骤如下：\n\
  \n*   数据采集\n*   数据预处理\n*   特征提取\n*   手势分类\n\n论文的其余部分结构如下：第二节介绍现有工作，第三节介绍拟议工作。第四节讨论结论。\n\
  \n## 8.2 现有工作\n\n\n\n\n\n这项工作涉及利用普通摄像机，并借助机器学习算法执行的任务这一基本思想。该算法不仅可以识别手部出现的模式，还能提供实时文本输出\
  \ [6]。整个工作计划分布在单一系统的多个过程之中：一项关于使用深度学习和 TensorFlow 进行图像分类的研究 [7]，以及基于计算机视觉的手势识别方法。Zhuohuang\
  \ Zhang 等人在多种语音语音数据集上测试了多种语音增强算法，重点关注了听力障碍模拟设置 [8]。对于听力正常的听者者，基于循环神经网络（`RNN`）的技术产生了显著更高的\
  \ PESQ 和 HASQI 分数。`BLSTM` 技术对所有年龄和性别的听力障碍听者都提供了最佳结果。他们还发现，对于基于 `DNN` 和基于 `RNN` 的技术，梅尔频率域处理通常会导致更高的\
  \ PESQ 分数较低的 HASQI 分数。Eric W. Healy 等人证明了当有其他说话者存在时，听力障碍听者无法理解言语，他们还展示了听力正常的听者在此方面的良好表现\
  \ [9]。在研究了其可能的原因后，创建了一种基于深度神经网络（`DNN`）的算法来解决这个问题。利用从语音信号中捕取的一组特殊属性来训练 `DNN`。所提方法的优势使得非聋聋的年轻听者在相同的背景噪声干扰设置下（在没有算法的情况下），功能能够达到与听力障碍听者同等的水平。据我们所知，这是首种单声道（单麦风）算法，能够显著提高听力障碍听者在与其他言语竞争时对言语的理解能力。\n\
  \n### 8.2.1 数据采集\n\n收集手势数据的常用方法列如所示 [10]：\n\n1. **感应仪器：** 采用机电仪器精确地提供手部配置和定位。或者，有各种基于手套的方法可以提取任何类型的信息。\n\
  2. **基于视觉的方法：** 该方法利用计算机摄像机形式的输入设备来观察和记录手部或手指的信息。基于视觉的方法仅需一个摄像头，即可促进人机之间的自然交互。在这种方法中，通信不需要其他设备。\n\
  \n然而，基于视觉的手部检测中的挑战性任务是管理和应对人类手部外观中增加的变量。这主要是由于各种动作的发生以及不同肤色在人体身上的反射造成的。视角、比例和摄像头捕捉速率的差异也导致了这一挑战。我们构建了专属数据集，以得出该算法性能效率的比较元素。根据文献综述，已有若干算法投入实践，这使我们选择了最好的。因此，我们的研究对与所提概念相关的几个值得的算法进行了性能分析。\n\
  \n### 8.2.2 数据预处理\n\n在这项研究工作中，通过借助分割技术利用图像对手部进行分割试验。然而，如前文所述，试验中输入的输出结果并未达到理想标准。这是由于在分割过程中肤色、光照条件和缩放的变化。此外，该任务涉及大量具有相似性的符号的应用，这给手势的训练带来了挑战，例如字母“V”和数字“2”。基于这一观察，我们计划了该方法为大量的输入符号获得更高的准确率。结果，手部分割被稳定的肤色手部背景所取代。这节省了基于肤色的手部分割。\n\
  \n### 8.2.3 特征提取\n\n特征提取是手部检测的理想过程，其中将基于阈值的颜色检测与背景减法相结合。通过 Ad Boost 脸部检测器根据肤色区分脸部和手部。此外，可以通过应用高斯模糊滤波器提取出训练所需的图像。使用开源计算机视觉（也称为\
  \ `OpenCV`）很容易应用该滤波器，并在图 8.1 中描述，该图显示了手势的灰度图像。应用高斯算法后，图像的灰色将消失，结果图像如图 8.2 所示所示。\n\
  \n![图 8.1 灰度图。](img/fig8_1.jpg)\n\n图 8.1 灰度图。\n\n![图 8.2 应用高斯算法后。](img/fig8_2.jpg)\n\
  \n图 8.2 应用高斯算法后。\n\n### 8.2.4 手势分类\n\n使用隐马尔可夫模型（`HMMs`）对动作进行分类，允许对手势的许多特征进行评估。手势通常从一组视频图像中检索。在这种情况下，手部的肤色斑块映射到用户脸部的身体脸空间。该技术的主要目标是区分指示性动作和符号性动作。为了在该操作中过滤照片，使用了用于快速查找的索引数据库。肤色像素在后过滤期间组合形成斑块。\n\
  \n斑块通常被认为是用于识别均匀区域的统计对象。利用肤色像素的位置 `(x,y)` 和颜色顶点 `(Y,U,V)` 来做出此判断。在所提的研究中使用了 `Naive\
  \ Bayes` 分类器，以实现在静态手部识别中提供有效且快速的方法。当分割完成后，根据从视觉输入中提取的几何不变性对各种动作进行分类。这种方法不受个人肤色的影响。通过使用静态背景，可以从电影的每一帧中获取手势。在检索的初始阶段，完成了对感兴趣对象的分割、标记和几何不变性的提取\
  \ [11]。\n\n该过程的序列由构建用于提取图像手部的皮肤模型组成，随后对整个图像应用二值阈值 [12]。一旦获得阈值图像，就会进行关于主轴的校准以使图像中心。该图像作为输入送卷积神经网络模型进行训练和预测输出。模型针对七种手势进行了训练，使用该模型对这七种手势的准确率约为\
  \ 95%。\n\n## 8.3 提议的工作\n\n\n\n\n在所提的工作中，研究方法包括通过摄像头初步捕捉手部手势。这些图像以帧的形式提取，且数量越大，结果越好。然而，不可否的是，提取许多帧可能会消耗额外的时间。这些帧由处理单元收集，处理单元反过来会检查每一帧的精确推理。在这方面，该过程很大程度上得益图像处理和深度学习的支持。尽管该方法看起来简单，但在实际应用中涉及的限制有多种形式，包括分析处理器的配置、手势的规范以及针对单个帧的专用算法的应用。所有这些任务都被证明是具有挑战性且复杂的。尽管有多种算法可以实现此目的，但选择最符合建议目标的算法是首要任务。由于许多算法针对特定应用已获得专利，这种选择需要更多的时间和精力。基于这些保留和限制，我们确定了两种特定的算法，即\
  \ `Canny edge Detection`（Canny 边缘检测）和 `SURF`（加速快速鲁棒特征）。\n\n### 8.3.1 深度学习算法\n\n\
  机器学习在解决各种日常问题方面具有巨大的前景。它经常执行分类、命名、检测和预测等任务。数据驱动程序的自动化也极其高效。其核心思想是使用数据创建一个可以产生结果的模型。如果提供了新的输入，结果可能会提供适当的响应，或者对以前可访问的数据提供预测。\n\
  \n本文的目标是训练一个深度学习系统，该系统能够识别各种手部动作的照片，包括拳头、掌、竖大拇指等。例如，手势导航可以从解决这一特定的分类挑战中获益。过程中将使用借助深度学习支持并基于\
  \ `TensorFlow` 和 `Kera` 构建的卷积神经网络。\n\n深度学习建立在利用层的基础上，这些层处理输入数据，从中提取特征并创建数学模型。\n\n\
  这利用了由 `Kaggle` 托管的手势识别数据库。它包含 20,000 张各种手和手势的照片。该数据集总共包含 10 个不同人员的 10 种手部动作。共有 5\
  \ 名男性和 5 名女性参与者。使用 `Leap Motion` 手部设备拍摄了照片。\n\n之后，我们需要为算法训练准备好照片。标签和照片必须分别加载到独立的数组\
  \ `X` 和 `Y` 中。\n\n我们将采用线性回归的思想，使模型的构建概念更易于理解。我们可以建立一个简单的模型并使用方程来描述它。这被称为“线性回归”。\n\
  \n在方程 `y = axe + b` 中，其中 `a` 和 `b` 分别是斜率和截距，我们可以通过确定任何给定 `x` 值的最佳参数来预测 `y`。卷积神经网络的使用相同相同变得复杂得多。\n\
  \n卷积神经网络（`ConvNet` 或 `CNN`）是一种深度学习技术，能够接收输入图像，为图像中的各种特征和对象分配权重（学习权重和偏差），并对它们进行区分。与其他分类方法相比，`ConvNet`\
  \ 需要的预处理要少得多。\n\n结合图 8.3 和我们讨论的线性回归模型方程，我们可以假设输入层由 `x` 表示，输出层由 `y` 表示。不同模型有不同的隐藏层，但它们都用于“学习”我们模型的参数。尽管它们各自有不同的用途，但它们都致力于获得最佳的“斜率和截距”。\n\
  \n![图 8.3 卷积神经网络示例。](img/fig8_3.jpg)\n\n图 8.3 卷积神经网络示例。\n\n为了从图像的原始像素数据中提取并学习高级属性，`CNNs`\
  \ 应用了一系列滤波器。模型可以使用这些属性进行分类。`CNN` 由三部分组成。\n\n*   卷积层：对图像应用预设数量的卷积滤波器。每个子区域都经过层的系列计算，从而产生输出特征图的单个值。卷积层经常对输出使用\
  \ `ReLU` 激活函数，以向模型注入非线性。\n*   池化层：降低特征图的维度，以对卷积层生成的图像数据进行下采样并加速处理。“最大池化”过程获取特征图的区域（例如\
  \ 2×2 像素块），保留这些部分的最大值并丢弃所有其他值。\n*   密集层（全连接层）：对卷积层和池化层采样的特征进行分类。\n\n我们可以从上一节的发现推断出，我们的系统基于深度学习模型以足够的置度正确分类了各种手势照片。\n\
  \n我们情况的几个因素直接影响我们模型的准确性。显示的手势相当明显，且视觉上没有背景。此外，照片数量相当多，这加强了我们的模型。缺点是，对于各种挑战，我们可能需要额外的数据来引导模型参数向正确的方向移动。深度学习模型的抽象性使其极难理解。尽管这种方法消除了考虑特征工程的必要性，但它让开始处理实际问题变得简单得多。这意味着\
  \ `CNN` 自动从照片中提取关键特征，而不需要我们使用边缘或斑点检测器对其进行预处理。此外，它整体表现良好，并可以快速修改以解决新问题。\n\n### 8.3.2\
  \ Canny 边缘检测算法 (CEDA)\n\n`canny edge detection`算法使用的多阶段边缘检测技术可以识别许多不同类型的图像边缘。带滞后的边缘跟踪、噪声检测、梯度计算、非极大值抑制、双阈值和最大抑制是该方法的主要部分\
  \ [13]。\n\n边缘检测的结果对图像噪声非常敏感，因为数学主要依赖于导数。通过高斯模糊平滑图像是一种消除图像噪声的方法。使用高斯核（3×3, 5×5, 7×7\
  \ 等）的图像卷积方法用于此。所需的模糊效果决定了核的大小。通常情况下，随着核的大小减小，模糊变得不那么明显。本示例将使用 5 × 5 高斯核。给出的是大小为\
  \ (2k+1) 的高斯滤波器核方程 [14]。\n\n```\n$H\\_{ij} = \\frac{1}{2\\pi\\sigma^{2}}\\left(\
  \ {- \\frac{\\left( {i - \\left( {k + 1} \\right)} \\right)² + \\left( {j - \\left(\
  \ {k + 1} \\right)} \\right)²}{2\\sigma^{2}}} \\right);1 \\leq i,j \\leq \\left(\
  \ {2k + 1} \\right)$ (8.1)\n```\n\n在计算梯度的步骤中，使用边缘检测算子识别边缘的强度和方向以确定图像的梯度。像素强度的变化反映在边缘上。检测它的最简单方法是使用在两个方向强调这种强度变化的滤波器。梯度强度级的分布（范围从\
  \ 0 到 255）也是不均匀的。产品的边缘需要在整个过程中保持相同的强度。\n\n\n\n锐利的边缘在最终图像中是理想的。必须通过非极大值抑制来减少边缘。该算法遍历梯度强度矩阵中的每个点，并寻找边缘上具有最大值的像素。\n\
  \n两个阈值步骤旨在将三类像素区分开：强像素、弱像素和无关像素。强像素是指那些强度大到足以保证它们形成边缘的像素。强度值既不够高到被分类为强像素，又不够低到被认为与边缘检测无关的像素被称为“弱像素”。其余像素被省略，因为它们与边缘没有关系。阈值结果显示，只有当存在至少一个强相邻邻域像素时，才会发生滞后（hysteresis），并且只有这样，才会将弱像素转换为强像素。\n\
  \n### 8.3.3 加速鲁棒特征算法 (SURF)\n\n计算机视觉中的局部特征检测器和描述符 `SURF` 已获得专利。物体识别、图像配准、分类和 3D\
  \ 重建仅是众多应用中的几个 [14]。它与 `SIFT`（尺度不变特征变换）描述符相关。根据 `SURF` 开发者的说法，基本版本比 `SIFT` 快得多，并且能够处理更多的图像变化。\n\
  \n`SURF` 可以产生 Hessian 斑点检测器行列式的近似整数表示，该检测器利用之前计算的积分图和三次整数运算来发现感兴趣的内容。局部 Haar 小波响应之和作为感兴趣区域的区分特征。这些也可以使用积分图像进行计算。`SURF`\
  \ 描述符已用于定位和识别物体、个人和脸部，用于生成 3D 场景、跟踪物体以及识别感兴趣点。\n\n为了生成相同大小但带宽更低的图像，将图像转换为坐标，然后使用多分辨率金字塔技术通过高斯金字塔或拉普拉斯金字塔形状重建。结果是原始图像获得了一种被称为\
  \ `Scale-Space`（尺度空间）的独特模糊效果，确保了感兴趣点独立于尺度。该策略的三个主要部分是匹配、定位感兴趣区域以及定位邻近邻域。\n\n`SURF`\
  \ 使用方形滤波器来近似高斯平滑。使用积分图像对平方后的图像进行过滤要快得多。\n\n```\n$S\\left( {x,y} \\right) = \\sum\\\
  limits\\_{i = 0}^{x}{\\sum\\limits\\_{j = 0}^{y}{I\\left( {i,j} \\right)}}$ (8.2)\n\
  ```\n\n积分图像允许通过仅四次评估来快速计算矩形框内的整个原始图像。`SURF` 使用基于 Hessian 理论的斑点检测器来寻找感兴趣的位置。Hessian\
  \ 矩阵的行列式揭示了位置周围区域的变化程度，通过最大化该值来选择点。\n\n由于你必须比较不同尺寸下看到的图像以寻找关系，因此可以在不同尺寸下找到感兴趣点。其他特征识别技术通常将\
  \ `scale space` 描述为金字塔型图像。金字塔的下一层是通过对经过高斯滤波器滤波的图像进行下采样构建的。结果是创建了许多具有不同掩码比例的层或阶梯。\n\
  \n```\n$\\sigma\\_{approx} = current\\mspace{9mu} filter\\mspace{9mu} size\\mspace{9mu}\
  \ X\\mspace{9mu}\\frac{base\\mspace{9mu} filter\\mspace{9mu} scale}{base\\mspace{9mu}\
  \ filter\\mspace{9mu} size}$ (8.3)\n```\n\n尺度空间的每个八八度（代表尺度的倍增）都由一组响应图组成。`SURF` 中\
  \ 99 个滤波器的输出决定了尺度空间的最低层。与以前的方法相比，`SURF` 通过采用各种尺寸的框形滤波器来缩放空间。它不是不断降低图像尺寸，而是通过增大滤波器尺寸来检查尺度。根据前面的说明，99\
  \ 滤波器输出是尺度 `s = 1.2` 的初始尺度层，这与尺度 `s = 1.2` 的高斯尺度相当。为了创建后续层，使用逐渐增大的掩码对图像进行滤波。结果生成了尺寸为\
  \ 99、155、212、272 等滤波器。在 333 邻域内，采用非极大值抑制来定位图像中的感兴趣点。\n\n### 8.3.4 实验设置与结果\n\n所提方法的实验模型如图图\
  \ 8.4 所示。\n\n![图 8.4 方法论](img/fig8_4.jpg)\n\n图 8.4 方法论.\n\n手势将转换为帧。我们必须对帧应用算法以使其可识别。本研究采用了所提算法来辩护和证明其性能水平，并进行了一些改进以产生更好的结果。我们关注的是产生优秀的输出。通过使用该算法，所提方法的性能分析以循环的形式给出。性能循环非常准确，并产生了预期的结果。在这里我们将研究\
  \ `CEDA` 和 `SURF` 算法的性能。我们选取了一个实时数据集（手语），并测试了这些算法。我们还对 2000 和 5000 次循环进行了实验。当前算法为听力受损听者产生的清晰度优于这些听者暴露在噪声刺激时获得的清晰度，这非常令人鼓舞，并表明当前方法可以通过多种方式进行简化，在减少处理负担的同时提供适当水平的益处。\n\
  \n\n\n\n处理后的手势首先经过边缘检测算法。正如我们已经解释过的，`SURF` 和 `CEDA` 是用于检测手势边缘的两种算法。然后应用了深度学习算法。我们采用了\
  \ `CNN` 算法来检测手势图像。我们强调，目前的方法尚未准备好实施，这是一个长期目标。然而，该技术具有意味着其潜在实现可能行的属性。首先，该算法的单声道特性（相对于麦克风阵列方法）使得实现变得更加容易。其次，基于分类的架构将大量工作转移到了训练阶段。算法的运行阶段仅需使用训练好的分类器进行特征提取和二值标记，两者都可以快速完成。\n\
  \n### 8.3.5 关于数据集\n\n动态手势识别有多种应用，包括游戏、自动化、AR & VR 等。该数据集是从真正有言语听力障碍的学生中收集的。我们清晰地观察了为听障学生捕获的视频，确保没有普通的视频。每个动作都执行了\
  \ 3 次。因此，我们收集了 204120 帧高清 视频帧。所有帧的起始帧时间、结束帧时间、总平均时间和标准差时间均已通过验证（图 8.5）。\n\n![图 8.5\
  \ 准确率与使用数据集 (2000 次)。](img/fig8_5.jpg)\n\n图 8.5 准确率与使用数据集 (2000 次)。\n\n在过程中，循环倍增以从数据得出最大准确率。发现循环增加产生了更好的结果，并证明了本拟议研究的目标。此外，`CEDA`\
  \ 和 `SURF` 算法有助于数据集的平均估计，因为准确率取决于数据集的数量。输出也取决于数据集 [15] (图 8.6)。\n\n![图 8.6 准确率与使用数据集\
  \ (5000 次)。](img/fig8_6.jpg)\n\n图 8.6 准确率与使用数据集 (5000 次)。\n\n上述图表显示了当循环增加到 5,000\
  \ 次时的结果，产生了巨大的输出。这导致了性能水平的假设，并最终对 `CEDA` 和 `SURF` 得出的准确率得确定的结论。\n\n从图中显然看出，性能水平根据数据集的数量而存在差异。在\
  \ 10 个数据集以及 2000 和 5000 次循环下，观察到了具有显著准确率的理想结果。当这些特征被插入拟议模型时，所得得分提高了了约 20%。这是我们预期的水平，并为未来获得更好的结果以及证明所提议模型的效率铺平了道路。\n\
  \n## 8.4 结论\n\n性能的对比分析得出以下结论：本研究采用了一组五个数据集来训练和测试模型。从最初的五组中，分配了 2000 次循环，得出 15 分的结果分。接下来的五个数据集总共有\
  \ 5000 次循环，由此可以得出 25 分的结果分。当数据集数量和循环次数分别增加到 10 和 5,000 次时，得分提升了 15%。基于这些变量，假设如果数据集增加到\
  \ 50 个，且循环次数为 80000–1000000 次，得分可以达到 85 分或以上。因此，再次强调手势识别的准确性将与数据集数量和循环次数的增加成比例。因此，本研究检查了性能水平，以证明所提算法和模型的效率。在各个方面，算法和随后的模型都证明了它们的价值。本研究通过采用多种背景减除算法，扩大了在复杂环境中获得更高准确率水平的范围。同样，提议尝试增强低光照条件下手势检测的预处理阶段，从而提取最大的准确率。此外，该算法适用于多种听力障碍，包括传导性听力损失、神经感觉性听力损失、混合性听力损失和中枢性听力损失。\n\
