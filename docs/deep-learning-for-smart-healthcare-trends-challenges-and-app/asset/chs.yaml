  \nK.E. Hemapriya\n\n印度哥尔巴塔尔，Sri Krishna 艺术与科学信息技术系\n\nS. Saraswathi\n\n印度哥尔巴塔尔，Nehru\
  \ 艺术与学院学术事务院长\n\nDOI: [10.1201/9781003469605-9](https://doi.org/10.1201/9781003469605-9)\n\
  \n## 9.1 引言\n\n使用云计算进行数据存储至关重要的。主要的关注点是分类文档以及已经放入云存储中的数据类型。数据安全和隐私是额外的问题。在消费的所有方面，云计算资源和服务的利用都是至关重要的。在决定保护系统数据的可行方法时，可以在理解数据安全需求之前和之后都采用精确的分布式计算数据保护计划。\n\
  \n云计算的概念允许了一个共享的可编程计算机资源池，这些资源可以以最少的行政劳动或与服务提供者的接触来快速构建和释放 [1]。云计算基础设施包括正确实现云计算架构所需的硬件和软件组件。云计算的其他名称还包括公用计算和按需计算。为了展示云计算的工作原理，客户端设备可以通过网络从远程物理服务器、数据库和工作站访问数据和云应用。\n\
  \n## 9.2 云计算\n\n云计算是一项不断发展的技术，既是技术现实也是社会现实。目前人们只能推测为新范式开发基础设施以及哪些应用可以转换。对于用户的这种技术转型取决于通过海量存储数据提供的服务、收集数据以及他们没有权限的系统上的软件，预计将产生重大的经济、社会、伦理和法律影响\
  \ [2]。\n\n客户端可以在网络和应用程序服务器的帮助下后端存储数据。资源复用使得云计算变得廉价。结果是云消费者为服务提供者支付得更少。应用程序数据以特定且独立设备的方式保留在需要它们的地方附近；这种数据存储策略可能会提高安全可靠性，同时降低传输成本。\n\
  \n云计算是一种广泛的、实用的、按需的网络访问可配置计算资源池（例如连接、数据中心、采集系统）的模型，这些资源可以根据较少的管理工作或服务提供商交互快速配置和释放。这种云计算模型由三种服务模型、四种部署方法和五个关键标准组成，它促进了可用性\
  \ [3]。\n\n### 9.2.1 云计算面临的挑战\n\n*   在其他基础设施上安装和运行当前云平台的应用可能会导致维护挑战、设置困难和更多的支出 [4]。\n\
  *   在云中消耗大量信息的应用程序需要大量的网络容量，这是高昂的。低吞吐量远低于云应用程序预期的计算性能。\n*   在云环境中工作时，数据安全是一个基本的考虑因素。云服务最关注的问题之一是客户必须对自己的数据负责，而并不是所有的云计算服务提供商都能确保完全的数据隐私。透明度和控制方法的丧失、身份管理的丢失、数据滥用和云配置错误都是常见原因。\n\
  *   当你将负载移动到云端时，云服务与本地基础设施之间可能会出现兼容性。\n*   终端用户应该期望良好的质量，这是他们的首要任务之一。由于整个云生态系统都在虚拟环境中显示，云服务供应商（CSP）必须履行其承诺。\n\
  *   云计算的可靠性并不总是 24 小时提供。在某些情况下，云服务发生过中断 [5]。\n\n### 9.2.2 深度学习\n\n监督学习是机器学习的一种，使计算机能够以概念层次的角度理解环境，并通过经验获取知识。由于计算机通过经验获取，因此计算机交互操作员不需要显式地提供计算机所需的所有信息。概念层次允许机器通过从简单概念构建大概念来学习大概念；描述这些结构的图将有多个层\
  \ [6]。\n\n深度学习利用了模仿人类大脑的复杂算法集合。这能够处理文本、图像和文档等非结构化数据。机器学习是人工智能（`AI`）的一个子集。深度学习是机器学习中特别困难的元素。\n\
  \n### 9.2.3 医疗保健\n\n机器学习正在迅速成为各种疾病关键的诊断和预后工具。深度学习基于机器学习方法，处理复杂的输入-输出映射。深度神经网络是一种处理和分析医疗数据的流行技术，因为其有效性以及与人类大脑运作方式的相似性。除了诊断，深度学习还用于跟踪疾病的发展、创建个性化治疗方案以及管理患者。保存特定患者海量数据的能力正在彻底改变医疗行业，但收集的数据量太大，人类无法进行分析。精准医疗（涉及为患者提供个体化护理）使机器学习成为可能，机器学习赋予了计算机从数据中自动识别模式并进行推理的能力。\n\
  \n\n\n\n机器学习被应用于许多行业，包括汽车、制造业和零售业。深度学习和机器学习算法的进步使得许多实用的预测成为可能，特别是对股票价格、房屋价值和贷款违约的估算。此外，还有各种格式的数据可用于机器学习的预测。随着数据量的增加，机器学习有很大的进步空间，未来的预测也将因此变得越来越准确。\n\
  \n*   处理医疗数据面临着许多困难，其中之一是数据对机器学习模型可能具有因果关系。当数据中的一个特征导致了另一个特征的发生时，这种关系被认为具有高因果性。这就是“因果关系（causation）”一词的含义。\n\
  *   大多数机器学习算法都假设每个特征与其他相互独立，互不导致对方的发生，反之亦然。当特征之间存在强烈的因果关系时，这一前提就会受到挑战。\n*   尽管机器学习算法潜力巨大，但医学领域仍然需要大量数据才能从中充分获益。医学照片形式的数据量相当少，使得难以对其进行广泛检查。\n\
  *   此外，可用数据并未以适用于机器学习的方式进行标记。要为机器学习对海量数据分类，实际上需要花费时间。\n\n### 9.2.5 机器学习在健康关注中的应用\n\
  \n*   个性化治疗是医疗行业中学习算法最重要的用途之一。它通过评估患者的病历、症状和检查结果，帮助医疗机构提供定制化的患者护理。在医疗和医学研究中使用机器学习，医生可以开发专门的疗法，并针对患者的特定疾病提供药物。\n\
  *   机器学习的使用可以提高医疗效率，可能导致成本节约。例如，医疗保健中的机器学习可能用于开发更好的编程或临床记录管理算法。结果，浪费在医疗系统内部重复性任务的时间和资金可能会减少。\n\
  *   深度学习和机器学习都实现了计算机视觉这一突破性领域。这得到了微软内部眼睛计划（Microsoft Inner Eye Initiative）的认可，该计划创建了用于图像分析的评估方法。\n\
  *   如果个人健康与预测分析相结合，个性化治疗不仅可能更加成功，而且有利于进一步的研究和增强疾病评估。\n\n## 9.2.6 患者数据维护\n\n鉴于信息的快速发展，许多医院除了存档外，正转向永久数据的数值化存储。外科医生时间有限、复杂、模糊且高风险的判断对患者结果有重大影响。启发式方法、个人偏好和假设演绎推理通常主导着临床判断。传统的决策支持系统和预测分析面临各种挑战，导致准确性不理想且需要耗时的人工信息处理\
  \ [8]。\n\n这可能导致本可以避免的偏差、错误或伤害。利用机器学习的 AI 驱动模型（远程医疗设备的输出可以作为临床信息的另一种解释输入云端医疗记录）可以克服传统方法的局限性。这些系统中的决策包含了人类直觉、基准判断的保留、彻底的控制和操作、模型的可解释性、数据一致性以及算法偏差和错误核算等道德考量。\n\
  \n## 9.2.7 云计算技术\n\n云计算是通过互联网而不是硬盘来保留和接收数据及应用程序的能力。任何类型的组织都可以利用强大的开发和信息技术来发展、变得更加精简和灵活，并与规模大得多的组织竞争。与传统的硬件和软件相比，云技术允许企业在设备采购、维护和服务方面无需进行大量财务投资的情况下，处于技术进步的前沿。\n\
  \n云计算技术最基本的功能是为用户提供特定软件、数据和程序的在线访问。在使用云计算技术时，数据保存在远程服务器上，与用户无关，而不是保存在本地网络或设备的实际硬盘上。个人只需使用合法凭据登录网站或门户网站，即可通过互联网访问其数据、付费应用程序和云存储。\n\
  \n## 9.2.8 基于云的计算架构\n\n在图 9.1 中，作为前端的客户端基础设施通过应用层与后端通信。客户端可以在云端安装并运行它们的软件程序。\n\n\
  为了保持这种云计算优势，用户必须确定基础设施即服务（IaaS）是否可以根据应用程序的需求快速更改分配给的资源种类和数量 [9]。\n\n云的弹性正是提供这种属性的关键。`Microsoft\
  \ Azure` 理想情况下应该是弹性的，确保提供给应用程序的资源与需求匹配。这种分配应在站点工作负载增加时发生，且不损害平台的系统性能，用户应仅为应用程序实际利用的能力付费。\n\
  \n## 9.2.9 基准云计算架构\n\n云计算作为今天最受欢迎的技术之一，正通过提供虚拟化服务以及按需资产为每家公司提供新的面貌。从从小到大，每家企业都采用使用云计算的服务来传输数据，并在任何时间从任何地方通过互联网访问数据。在本文中，我们将更多关于云计算的结构组织知识。\n\
  \n在图 9.2 中，基准是用于云存储负载均衡的 `DNS` 技术。透明度代表了任何云架构应面临的最重要限制之一。容量、机密性和认知监控也是重要的限制。对其他重要限制的持续研究正在支持使用云计算的系统开发新功能和方法，这些方法有潜力提供更复杂的云解决方案\
  \ [10]。\n\n\n\n\n事件驱动架构（EDA）和服务面向服务的架构（SOA）在云计算架构中得以结合。对于组织而言，程序、函数、实时云、内存、容量、治理和隐私都是云计算计算架构的组件。\n\
  \n## 9.3 机器学习\n\n机器学习是快速发展的数据科学研究中一个非常重要的组成部分。在数据挖掘项目中，算法使用统计学方法进行开发，以提供分类或建议，并揭示关键洞察。基于这些观察结果做出的决策应该对应用和公司的关键增长指标产生影响。随着大数据的不断出现和繁荣，对数据科学的需求将日益增加。他们被要求帮助确定最重要的客户查询以及回答这些查询所需的信息。\n\
  \n机器学习是一个用于描述执行 AI 相关任务的系统所发生变化的术语。预测、规划、工厂自动化、分析和检测都是此类操作的示例。这种“升级”可能是对现有系统的调整，也可能是从零开始新系统\
  \ [11]。\n\n### 9.3.1 机器学习中的数据分类\n\n分类是机器学习中的一种监督算法，它要求模型为特定的输入数据估计合适的标签。在进行分类时，算法完全使用训练数据进行开发，使用测试数据进行测试，但随后仅对新的、未使用的数据生成预测。给定的数据集合可能需要分为两个或多个类别以进行机器学习分类。结果是它会创建一个概率分数，将数据分类为垃圾邮件或否、是或否、疾病或无疾病、红色或蓝色、男性或女性等。例如，算法可以被训练用于判断特定电子邮件是否为垃圾邮件。\n\
  \n### 9.3.2 网络\n\n数据中心也被称为通信系统，由相互依赖的节点组成这些节点可以传输、接收和交换数据、音频和视频流量。网络节点包括服务器和调制解调器等。终端用户广泛使用计算机网络进行区域协作和通信。家庭、公司和政府组织等地区很常见。通过计算机网络的应用可以消除地理障碍并使信息交换可行。\n\
  \n网络由两个（可能更多）通过电缆（在某些情况下是无线网络）连接的计算机组成，以便它们可以相互作用并交换信息 [12]。我们大多数人都利用过电脑极客所谓的“运动鞋网络”（sneaker\
  \ net）。它涉及在将文件拷贝到磁盘之前，先将磁盘带复制到另一个人的计算机上。\n\n### 9.3.3 网络安全\n\n网络安全是指任何公司或组织使用软件硬件技术来保护其电子网络和数据。这旨在确保网络和数据的机密性和可用性。所有处理大量数据的业务组织都建立了某种形式的网络防御。\n\
  \n由网络用户自行选择的密码保护是最基本的网络安全。\n\n计算机网络并不比它们连接的机器更安全，因为网络的核心是将计算机连接在一起。单个易漏洞的主机可能会给你的整个网络带来巨大问题，因为如果它落入敌人手中，可能会成为强大的攻击基点或侦察工具。如果你的服务器提供的服务易受攻击，那么像防火墙、入侵检测系统和其他类似工具的高级解决方案将是毫无用处的。在关注网络安全部分之前，请确保你负责的机器尽可能安全\
  \ [13]。\n\n### 9.3.4 网络维护\n\n网络维护意味着尽一切努力保持网络正常运行，并包括以下任务：排除网络故障、安装和配置软件硬件、监控和改进网络性能、为未来的网络增长做计划等。开发和监控网络文档、确保遵守业务规定、确保符合法律标准以及保护网络免受任何风险。\n\
  \n### 9.3.5 路由\n\n“路由器”一词是对这些设备现代迭代功能最准确的描述。信息通过路由器沿着路由——路径——在两个网络之间发送。这条路由可能会通过一个或多个路由器。现代路由器还利用一组程序在存在多条通目的地路径的网络中寻找并使用最佳路由。如果特定路由不再理想或完全不适用，路由器将选择次优方案。\n\
  \n网络路由是跨两个或多个网络选择路径的过程。路由概念可以任何网络，包括公共交通和电话网络。在像互联网这样的分组交换网络中，路由规定了单个互联网协议（IP）单元从源到目的地的旅行路径。路由器是管理互联网路由的专用网络设备。链路路由协议指的是路由器为了确定和选择最佳路由，以及与其他路由器通信网络可达性和状态所采取的步骤\
  \ [14]。\n\n### 9.3.6 聚类\n\n聚类将人群或一组数据元素划分为若干单元，以确保每个簇中的数据集彼此之间更加接近，并且与组成其他组的信息片段更加不同。这简单来说是根据项目之间的相关性和差异性进行的分类。图像分割、知识发现、模式识别、分类技术、分析方法以及其他系统学习和数据挖掘活动都受益于聚类。它可以被视为准备阶段或探索性任务。如果目标是研究并揭示数据中隐藏的模式，那么聚类本身将成为一项独立的探索性工作。如果产生的簇被用于支持进一步的数据分析或高级分析活动，那么聚类将构成一个预处理步骤\
  \ [15]。\n\n#### 9.3.6.1 聚类方法类型\n\n聚类方法被广泛分为硬聚类（每个数据点仅属于一个类别）和软聚类（数据点可能属于另一个类别）；然而，还存在更多聚类方法。以下是机器学习中最常用的聚类方法：\n\
  \n1. **划分聚类（Partitioning Clustering）：** 一种从数据中创建非层次结构分组的方法。它也被称为基于质心的方法。K-means\
  \ 聚类方法是划分聚类最流行的例子。在这种情况下，数据集被划分为 K 个预定义的组，其中 K 代表组的数量。簇中心的设计使得一个簇中的信息点与另一个簇中心之间的距离最小。\n\
  \n\n\n\n\n## 2. 基于密度的聚类\n只要稠密区域能够连接，基于密度的聚类方法就会将极密集区域合并为类，从而产生任何形状的分布。该程序通过在信息集中寻找若干类，并将人口密集的区域合并为类来实现这一目标。数据空间中稀疏的部分将密集区域隔离开来。如果数据集很大且包含许多维度，这些技术在分组数据点时可能会遇到困难。\n\
  \n## 3. 基于分布模型的聚类\n基于分布模型的分类方法根据数据集对应于特定分布的概率来划分数据。这种分组是通过假设特定的分布来实现的，最著名的是高斯分布。\n\
  \n## 4. 期望最大化聚类方法\n高斯混合模型（`GMM`）是此类方法的一个示例。\n\n## 5. 层次聚类\n由于不需要指定要创建的聚类数量，层次聚类可以作为划分聚类的替代方案。在这种方法中，数据集被分成若干类，形成一种称为树图（dendrogram）的树状结构。通过在适当的水平对树进行剪剪，可以选择观测值或任意数量的类。`凝聚层次算法`是该策略最典型的例子。\n\
  \n## 6. 模糊聚类\n模糊聚类是一种软方法，其中数据点可以被分配给多个而非单个类别或类。每组数据都有一组成员系数，这些系数与某个类的成员程度成正比。`模糊\
  \ C-means 方法`是这种形式聚类的一个示例；它有时也被称为`模糊 k-means 方法`。\n\n### 9.3.6.2 聚类算法\n根据之前描述的模型，可以将聚类方法分为几类。目前有多种聚类方法可用，但只有少数几种被广泛使用。聚类技术取决于所使用的数据类型。例如，某些算法必须预测提供的数据集的类数量，而另一些算法必须发现数据集观测值之间的最短距离。\n\
  \n### 1. K-Means 算法\n常用的聚类技术之一是 `k-means`。它通过将样本分组为具有相似方差的若干类来对数据集进行分类。在该算法中，必须指定类的数量。具有\
  \ `O(n)` 线性复杂度，它运行速度快且计算量少。\n\n### 2. 均值偏移算法\n`mean-shift` 技术在数据点的平滑分布中寻找密集区域。它作为基于质心的方法的示例，该方法通过更新潜在的质心候选来作为特定区域内点的几何中心。\n\
  \n### 3. DBSCAN 算法\n该算法代表了基于带噪声程序的密度的空间聚类。它是基于密度的范式的示例，与 `mean-shift` 类似，但具有几个显著优势。该算法将低密度区域划分为高密度区域。因此，可以产生任意形状的类。\n\
  \n### 4. 使用 GMM 的期望最大化聚类\n这种方法可以用于 `K-means` 算法失败的情况或作为其替代方案。假设 `GMM` 中的数据点符合高斯分布。\n\
  \n### 5. 凝聚层次算法\n自下而上的层次聚类通过`凝聚层次方法`执行。在这种方法中，每个数据点首先被视为一个单独的类，随后进行合并。可以使用树结构来阐述类的层次结构。\n\
  \n### 6. 亲性传播\n这种方法与之前的聚类方法不同之处在于，它不需要指定特定的类数量。每个数据点与其他之间进行通信，直到信息点对收敛。这种方法的根本缺陷是耗时较长——`O(N2T)`。\n\
  \n## 9.4 区块链\n区块链网络是一个不可更改的数据库，简化了业务网络中的资产跟踪和交易记录。区块链是一个去中心、不可更改的网络，简化了业务网络中的资源管理和数据处理。一个特定的优势是它可以管理任何可以触及的物品，例如房屋、车辆、现金或土地。它还可以管理无形资产，包括专利、版权和品牌意识等知识产权。几乎所有有价值的东西都可以在区块链网络上记录和销售，从而最大限度地降低风险并提高所有方的效率\
  \ [16,17]。\n\n### 9.4.1 基于区块链的云计算\n云服务凭借其各种优势席卷了软件业务。全球企业都利用云计算进行数据备份和存储、软件开发和评估以及其他用途。区块链技术因其可用性、安全性和自主性，被应用于医疗、汽车和零售等众多领域。\n\
  \n![图 9.3 基于区块链的云计算的优势。](img/fig9_3.jpg)\n\n`图 9.3` 显示了区块链技术在云计算中的若干优势。\n\n尽管区块链增强了网络安全、数据机密性和去中心化，但云计算提供了更高的扩展性和适应性。因此，云与区块链的结合有望产生独特的解决方案，特别是在使用像\
  \ `Ridge Cloud` 这样的去中心化云时。\n\n### 9.4.2 区块云的需求\n云技术和物联网（CoT）基础设施存在各种威胁局限，区块链可以协助缓解。威胁和局限如下：\n\
  \n*   一旦上传到云服务器，用户对其信息、操作和代码的控制有限。\n*   客户不熟悉云解决方案的底层原理，这意味着他们必须依赖云提供商进行信息提取，这可能会导致安全和隐私问题。\n\
  *   由于 `CoT` 使用中心化的通信模型，扩展帮助台和将物联网（IoT）网络扩大到更大的部署具有挑战性。\n\n\n\n\n\n在图 9.4 中定义了中心化和去中心化节点。在中心化访问中，数据将组织在中心点。然而，智能合约分布式云计算可以克服这些困难。通过基于区块链的去中心化云计算，相同数据的多个副本存储在不同的计算机节点上。\n\
  \n![图 9.4 中心化与去中心化](img/fig9_4.jpg)\n\n图 9.4 中心化与去中心化\n\n正如此，如果一个服务器故障，整个系统也不会崩溃。由区块链驱动的分布式云计算降低了数据丢失的风险。鉴于，基于云的区块链服务提供了更快的灾难管理。\n\
  \n改进物品和设施的追踪是去中心化云计算区块链网络的另一个优势。经常追踪库存、车辆和其他物品的物流行业将从中受益良浅。\n\n### 9.4.5 改进的云服务与安全\n\
  \n在数据库中保留 `CoT` 文件的问题非常相关，因为这些数据通常包含个人身份信息，如视频和音频录制。此类数据泄露可能非常有害。然而，一些区块链云存储服务提供了极安全的加密云存储选择。\n\
  \n去中心化云存储区块链解决方案可以将数据用户分为许多加密分段，这些分段通过哈希操作连接。每个分段存储在独立的地方。这些分段分布在网络中，并得益于云存储区块链解决方案提供的额外安全层。\n\
  \n只有通过加密的操纵者才能使用云存储中的区块链接触或读取统计数据。分布式云存储区块链的稳健安全特性确保黑客无法解释数据中的信息。云计算中的区块链防护增加了云解决方案的可靠性。\n\
  \n用于云存储的区块链技术也能防止数据篡改。为了避免数据篡改，加密货币存储云解决方案可以追踪备份和存储历史。区块链驱动的云存储系统也更快、成本更低且效率更高。\n\
  \n正如你所看到的，`Ethereum` 技术与云存储的融合提供了具有无限空间的安全的有效存储空间。\n\n### 9.4.6 数据库管理\n\n医疗数据正变得更加数字化，在速度、数量和价值方面的数据正在增长，与其他大多数行业一样。健康数据管理是产生此类信息并对其进行管理，以造医疗服务提供者的利益，理想情况下是患者的福祉和健康的实践。\n\
  \n必须调查健康数据管理中维护的许多数据形式，以便更好地理解管理医疗数据的复杂性和微妙之处。电子健康记录 (`EHRs`)、患者生成的健康数据 (`PGHD`)、理赔数据、临床研究数据和基因组数据都是这些示例。每种形式的数据都面临着自己的障碍，包括互操作性和数据标准问题、隐私担忧，以及确保数据的质量和完整性。\n\
  \n通过增强决策和提高患者护理效率为患者提供更佳护理的潜力，是卓越医疗数据管理的关键益处之一。然而，这涉及了确保信息隐私和安全的义务。医疗数据对攻击者来说非常有价值且敏感，使其成为隐私违反的潜在目标。因此，必须实施强有的安全措施以防止对患者数据的访问、盗取或破坏。\n\
  \n在源头和传输过程中对数据进行加密、详细集成的用户访问和访问控制、定期监控以及独立的审计查看日志，并确保您符合适用的监管要求（包括《健康保险流动性与责任法案》`HIPAA`），都是在存储健康信息时避免数据泄露的举措。此外，医疗机构应该经常进行风险评估，以识别漏洞并实施必要的控制以限制潜在危害。\n\
  \n总而言之，医疗数据管理是一个复杂且不断变化的领域，需要对数据安全问题和解决方案有深入理解。成功管理医疗数据的组织可以改善患者结果、提高运营效率并维护患者信息的机密性和安全性。\n\
  \n健康数据管理是指以数字形式对健康数据进行系统的结构化。这可以包括从就诊期间创建的电子医疗记录 (`EMR`) 到电子健康记录 (`EHR`) 或转化为数字存储库的手写医院记录。健康数据管理不仅承担安排医疗数据的责任，还承担在其过程中整合并支持分析，以增强患者护理并获得可能促进医疗结果的见解，同时维护数据的隐私和安全。\n\
  \n根据安森哲的一项调查：\n\n- 大多数医疗机构采集 `EMR` 摘要、理赔数据、注册和医疗计划信息，只有最复杂的组织也会收集计算机化的 `EMR` 输入和疾病管理计划数据。\n\
  - 极少数机构用非健康数据源补充官方医疗数据，例如消费者生活方式信息、远程监控和可穿戴技术以及关于患者体验的调查数据。\n\n### 9.4.7 健康数据存储的优势\n\
  \n健康数据管理可能造福医疗机构、医务人员和患者：\n\n- **提供患者、家庭和患者群的全面画像：** 提供进度报告并允许预测的复合评分。\n- **增加患者参与度：**\
  \ 使用预测模型针对目标患者提供适当的警告和护理建议。\n- **改善健康结果：** 监控特定位置或人群的健康相关行为，预测未来趋势，并对日益增长的健康问题提供预防性措施。\n\
  - **做出商业决策：** 帮助医疗从业人员做出高质量的数据驱动判断，例如招聘哪种类型的医人员，参与哪些技术，或销售何种心理社会干预措施。\n- **监控医生行为：**\
  \ 分析医生表现的数据，包括他们的成功率、在各种治疗和医疗选择上花费的时间，以及他们与组织目标的契合程度。\n\n### 9.4.8 健康数据管理挑战\n\n\
  - **数据不稳定**\n  医疗数据可以存储在工作表中或数据库中、图片或流视频、数字论文、扫描的纸质文档或用于 MRI 扫描的专用格式（如 `DICOM` 标准）。医疗人员、全球健康机构、医疗保险公司、药店和个人经常重复数据、多次收集数据并以多种形式存储。关于患者福祉的信息没有可靠的来源。\n\
  \n- **数据篡改**\n\n\n\n\n\n在图 9.5 中，安全架构设计旨在保护数据免受外部威胁和风险管理。医疗信息以及患者和医生的姓名、职业、地点和疾病不断变化。患者随着时间的推移会接受各种检查和治疗，疗法和药物本身也会发生变化。新兴的医疗必要方法（如远程医疗计划）会产生新类型的数据。\n\
  \n### 合规性与标准\n\n医疗数据具有敏感性，必须遵守 `HIPAA` 等政府法律。数据发现问题和数据质量差使得执行强制性审计和满足监管标准变得异常困难，同时也限制了医疗从业人员利用数据造福患者的范围。\n\
  \n![图 9.5 健康数据管理安全架构设计。](img/fig9_5.jpg)\n\n图 9.5 健康数据管理安全架构设计。\n\n### 9.4.9 医疗数据存储考虑因素\n\
  \n根据 IDC 的研究，患者数据和影像系统产生的数据量预计将从 2013 年的 153 拍字节（petabytes）增加到 2020 年的 2,300 拍字节。\n\
  \n除了上述问题外，医疗从业人员必须决定如何保存所有数据：\n\n*   **可扩展性**：医疗数据增长最快的领域是非结构化数据，包括 MRI 扫描、计算机断层扫描、X\
  \ 射线和 PET 扫描。当这些数据扩展到拍字节级时，医疗机构寻求可扩展、低成本的存储解决方案。\n*   **遵循性**：存储项目时必须遵守法规。根据 `HIPAA`\
  \ 和其他医疗行业法律，数据必须通过基于角色的访问控制 (`RBAC`)、独立审计员记录以及静态和传输中的加密密钥进行保护，并经过充分的密钥管理方法。\n* \
  \  **厂商中立归档 (VNA)**：厂商中立归档 (`VNA`) 是越来越多医疗信息系统的接入。它能够将多种形式的患者数据整合到一个枢纽，从而产生一个能够分类患者记录的系统。存储平台应支持\
  \ `VNA` 集成。\n*   **数据健壮性与保护**：健康数据是黑客频繁攻击的目标，如果意外丢失或删除，将对提供者构成极大危险。为了将数据碎片分布在多个节点上，存储系统应提供弹性、镜像、增量备份和纠删编码。\n\
  \n## 9.5 云化提供安全、低成本的健康数据托管\n\nCloudian 提供 `Hyperstore`，这是一种为医疗机构提供的艾字节级、低成本本地存储解决方案。它允许医疗公司在各地存储、传输和保护信息，成本比基于磁盘的存储降低高达\
  \ 70%。\n\n以下 `Hyperstore` 特性有助于医疗机构：\n\n*   **云适应性**：部署可以从小规模开始并根据需要进行构建，范围从三个节点到数十万个节点不等。每个节点可以代表一个运行在标准硬件上的虚拟或物理设备。\n\
  *   **多种集成**：`Hyperstore` 与多种医疗应用程序和归档服务连接，使其能够作为具有患者信息全视图的数据库运行。\n*   **合规性与网络安全**：符合\
  \ `HIPAA` 标准的加密过程和透明访问协议、针对存储数据的 `AES-256` 虚拟机加密、用于传输信息的 `SSL`、具有预定义访问权限的 `RBAC`、审计追踪记录，以及通过启用\
  \ `WORM`（一次写入多次读取）实现永久数据存储，都是 `Hyperstore` 的功能。\n*   **广泛的元数据**：数据科学家可以使用 `HyperStore`\
  \ 的高级元数据标记工具来识别医疗数据中的新见解和趋势。\n*   **数据安全**：`HyperStore` 通过复制或纠删编码扩展数据提供 99.99% 的数据持久性。副本数量和纠删编码技术可以自定义以满足\
  \ `SLA`。\n\n### 9.5.1 医疗记录的保留\n\n医疗记录对于住院治疗以及医疗信息管理的日常活动至关重要。它们包含了患者状况的完整时间线，包括诊断、治疗、处方和其他相关信息。多项标准、规则和法律控制着医疗记录，以保护客户隐私和可访问性。\n\
  \n图 9.6 显示了数据如何在 Cloudian 中存储。美国的《健康保险流动性与责任法案》(`HIPAA`) 要求医疗提供者将医疗记录至少保存六年，而其他州可能有更长的保留期。此外，某些医学学科（如产科和儿科）由于未来出现医疗并发症的可能性，可能会延长保留期。\n\
  \n![图 9.6 使用 Cloudian 进行存储。](img/fig9_6.jpg)\n\n图 9.6 使用 Cloudian 进行存储。\n\n维护医疗记录可能是困难的，特别是当必须保存多年甚至几十年时。为了高效地维护和存储医疗记录，必须建立详尽且结构化的系统。这涉及确保医疗记录得到适当索引、标记和跟踪，并采取适当的安全措施来遵守隐私法并防止非法访问。\n\
  \n电子健康记录 (`EHRs`) 通过允许医疗从业人员数字化地存储和检索患者信息，改变了医疗记录管理。与传统的纸质健康记录相比，`EHRs` 提供了各种优势，包括更快速的信息访问、更高的准确性以及医疗从业人员之间更的信息交换。\n\
  \n最后，医疗记录是医疗管理和患者护理的重要组成部分。理解医疗记录的标准、法律和规则至关重要，实施成功的处理和保存记录的程序同样关键。`EHRs` 具有显著改进医疗记录管理的潜力，但确保已采取适当措施以保护患者隐私并防止未经授权的访问至关重要。\n\
  \n### 9.5.2 医疗记录究竟是什么？\n\n事实上，工业化世界的几乎每个人都有医疗记录，其中包含许多关于其健康、医疗问题和治疗的有用且敏感的信息。医疗记录提供了患者状况的详细历史，允许医疗从业人员就诊断、治疗和随访做出明智的决策。\n\
  \n医疗记录可能包括参考编号、出生日期、社会安全号码、联系信息和医疗记录等数据，以及心理健康、传染病和生殖健康等敏感材料。为了保护患者安全并防止个人信息的非法访问或暴露，医疗记录必须保持保密安全。\n\
  \n除了对个人患者护理有利外，医疗记录在社区健康管理和医学研究中也起着重要作用。医疗记录可用于疾病爆发、确定健康趋势以及评估医疗干预和疗法的效效。\n\n\n\n\
  \n随着技术的进步，人们越来越关注如何利用电子健康记录（EHRs）来存储和管理医疗信息。与传统的期刊文章系统相比，EHR 提供了多种优势，例如信息访问速度更快、准确性更高，以及医疗执业人员之间的信息交换更加简单。但是，与任何技术一样，必须采取适当的安全措施来保护患者隐私并避免数据泄露。\n\
  \n归根结底，医疗记录是医疗保健的重要部分，因为它们为医疗专业人员、研究人员和政策制定者提供了关键信息。为了保护患者隐私并提供最佳可行的患者护理，必须保持医疗记录的谨慎、安全和准确。\n\
  \n### 9.5.3 个人身份信息\n\n`PII` 通常被称为私人健康信息或 `PHI`，是指如社会安全号码、居住地址和医疗保健提供者标识等信息。\n\n\
  - **医疗背景**\n即使患者本人不知情，系统也会保留医疗记录。例如，如果某人最近没有接种疫苗，其医疗记录可能会显示这一点。病史包括任何诊断、既往和现有的健康问题，以及潜在的重要生命数据，如过敏性或对药物的不耐受。\n\
  \n- **家族病史**\n近亲属的医疗记录可能也包含遗传性的或以某种方式对其亲属产生影响的重要医疗问题。\n\n- **药物日志**\n一个人摄入的化学物质，例如处方药、非处方药、草药疗法，甚至是非法药物。\n\
  \n- **病史**\n客户接受的医疗程序以及他们处理问题的方式。\n\n- **医疗指示**\n健康记录可能还包括“生前遗嘱”，或者个人在某人无法言语时打算传达给医疗人员的建议。\n\
  \n### 9.5.4 三种不同的数字医疗记录\n\n三十年前，关于患者历史的几乎所有内容都写在纸上，并存储在执业人员的书架或医院的档案室里。仍有几家医疗机构维护着纸质患者记录。另一方面，医疗记录正在逐步计算机化，医疗行业现在控制着三种关键的数字健康记录形式。\n\
  \n- **电子病历**\n简单来说，电子病历（`EMRs`）是一种能够让执业人员跟踪其患者预约地点的设备。`EMR` 包含了大量关于患者疾病或投诉、他们接受的疗法以及所有药物的后果，以及所执行医疗服务的账户账单。\n\
  \n- **电子健康记录**\n`EHR` 代表了一个整合了来自多个医疗机构数据的更完整系统。它用来自可穿戴技术、可获取的临床科学、心理健康资源以及社会经济或调查数据补充了\
  \ `EMRs`，这些数据可以对患者健康状况提供洞察。`EHR` 旨在让患者参与并帮助他们提供有关其行为和情况的额外信息，从而为自己和其他有类似情况的人提供更好的治疗。\n\
  \n- **个人健康记录**\n个人健康记录（`PHR`）是一个让人们能够监测其健康信息的系统，通常由保险公司管理和提供。它通常以应用程序的形式存在，用户可以通过它来保存和利用医疗数据。这包括通过可穿戴技术获取或用户信息输入的个人数据、用户提供的医疗论文，以及人员从\
  \ `EMR` 系统输入的信息。\n\n### 9.5.5 医疗记录在文件中保留多久？\n\n法律规定，医疗提供者以及特定的执业人员必须将医疗记录保存一段时间。例如，\n\
  \n- **在美国**\n`HIPAA` 要求医疗机构和其他覆盖实体自记录产生之日或最后执行之日起（以较晚者为准）保留医疗记录六年。\n\n- **在英国**\n\
  根据 2016 年《医疗和社会保健部门记录保存标准》，任何想要与或通过国家医疗服务体系（`NHS`）开展工作的人都有义务在与患者最后一次互动后保存健康史最长 20\
  \ 年，在自身去世后最多 8 年，或在患者去世后最多长达 25 年。\n\n### 9.5.6 影响医疗记录保留的其它因素\n\n法律规定医疗提供者以及特定的执业人员必须保留医疗记录。美国其他许多因素可能影响保留期限：\n\
  \n- **就诊频率**\n不经常看诊的患者可能有义务保留更久。\n\n- **医疗计划**\n第三方支付方可能根据合同保留医疗记录。例如，保险公司和政府医疗计划可能在报销过程中需要记录，以确保仅报销所涵盖的服务。\n\
  \n- **责任限制**\n美国的一项法律规定了个人可以提起诉讼的日期，记录必须保留到那时。具体的日期取决于州以及诉讼的类型。例如，医疗过失诉讼的限制期可能与人身伤害诉讼的截止日期不同。\n\
  \n- **州法律**\n在不同州执业可能适用一个或多个州的保留法规。\n\n### 9.5.7 医疗记录管理\n\n在许多现代医疗机构，持续监控医疗记录是一项需要投入经验的专业工作。医疗记录管理涉及以下任务：\n\
  \n- 提高医疗记录的可访问性和安全性\n- 管理数字化活动并确保符合组织目标、相关行业标准和监管要求\n- 通过多样化、复制和灾难恢复提供医疗记录的韧性\n\
  - 管理信息技术系统，例如 `EMR` 系统\n\n## 9.6 结论\n\n许多人使用基础设施作为计算服务的一部分。第三方云服务供应商通过互联网分配存储、虚拟化服务器和网络资源。\n\
  \n服务用户对数据负责，因此如果丢失任何信息，他们必须找到替换。用户还负责下载、安装和更新操作系统以及应用程序。`IaaS` 服务也称为云基础设施。\n\n区块链\
  \ `IaaS` 是云范式提供的一种服务，与 `IaaS` 相似但增加了安全去中心化。仅需基础设施即服务的区块链云存储服务，计算服务提供商就可以利用分布式平台上\
  \ `CPU` 和 `GPU` 的空闲资源，为每个用户提供额外的计算资源，从而在云端安全高效地存储患者数据。\n\n## 参考文献\n\n\n\n1. Peter\
