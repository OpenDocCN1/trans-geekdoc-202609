  \ 2021, 2021。\n\n9. V. Sathiyamoorthi, A.K. Ilavarasi, K. Murugeswari, S. Thouheed\
  \ Ahmed, B. Aruna Devi, M. Kalipindi, “基于深度卷积神经网络的 MRI 图像阿尔茨海默病预测计算机辅助诊断系统”，Measurement,\
  \ 171, 2021, 108838, ISSN 0263-2241, [10.1016/j.measurement.2020.108838](https://doi.org/10.1016/j.measurement.2020.108838)。\n\
  \n10. M.A.N. Bikas, A. Alourani, M. Grechanik, “计算机进展”，第 103 卷，芝加哥伊利诺伊大学，芝加哥，伊利诺伊州，美国。\n\
  \n11. “机器学习介绍”, Nils J. Nilsson，斯坦福大学计算机科学系机器人实验室，斯坦福。\n\n12. “傻瓜走网络”, Doug Lowe\
  \ 第 7 版，Wiley 出版公司，印第安纳州，印第纳波利。\n\n13. “网络安全攻击”, Andrew Lockhart 第 2 版，O’Reilly\
  \ Media, Inc., 西巴斯托波尔 Gravenstein 高路北 1005 号。\n\n14. “TCP/IP 路由”, 标题属于电子书包：De Gruyter\
