  \n### 3.3.3 用于分类的改进卷积神经网络 (CNN)\n\n提出的 MCNN 有助于分类为 YES 和 NO 的数据集。该 CNN 由输入、输出和多个执行池化和卷积的隐藏层组成。架构在图\
  \ 3.3 中所示。\n\n![图 3.3 架构图](img/fig_3.jpg)\n\n图 3.3 架构图\n\n提出的 CNN 继承了局部或全局池化层。聚类平均负责池化，而全连接层负责映射前一层神经元。与传统的\
  \ CNN [22,23,24,25] 不同，提出的 MCNN 具有不同特定目的层，可以分析高维数据。共享参数有助于减少需要考虑的参数。MCNN 获取其输入，这些输入是来自数据集的推文，随后转换为后续层。该层还定义了初始参数，如尺度和滤波器，用于生成特征图，这有助于提取关键特征，从而减少计算复杂度。激活在卷积层进行，映射到定的输入集合，从而创建一个非线性框架。反向传播用于分配和更新特征值。提出的方法使用梯度法激活给定的神经网络。权重随后添加到值中形成输出，由公式\
  \ (3.7) 和 (3.8) 定义。\n\n$F(m) = f\\left( {\\sum\\limits\\_{i = 1}^{j = m}{k_{i}\\\
  left( m \\right)y\\left( m \\right)}} \\right.$ (3.7)\n\n其中\n\n$F(m) = \\{+1 \\\
  text{ 如果 } \\ge 0, -1 \\text{ 如果 } < 0\\}$ (3.8)\n\n其中 `m` 表示迭代索引。\n\n公式 (3.9) 表示连接权重的更新。\n\
  \n$ji = ji + \\eta(e(m)-x(m)xi, i=1, 2..N$ (3.9)\n\n这些加权特征随后被输入提出的 MCNN 以获得更好的分类准确率。引入了一个函数以确保分析的数据是相同的。通过卷积生成的所有特征图随后再次采样。为\
  \ MCNN 提出了一个适应度值，通过遗传适应度量将推文分类为 HATE 或 NONHATE。\n\n\n\n\n随后为遗传算子选取若干样本，这些样本将演化为未来的染色体。此过程不断迭代，直到确定最佳适应度。选择算子的定义如公式\
  \ (3.10) 所示\n\n$Q\\left( m\\_{i} \\right) = \\frac{f\\left( m\\_{i} \\right)}{\\\
  sum\\_{i = 1}^{j}{f\\left( m \\right)}}$ (3.10)\n\n这里 `Q(`c`[`i`])` 表示给定染色体位于群体\
  \ `m` 中的概率。这确保了适应度大的染色体会被选中，使得后代在交叉后具有更高的适应度。\n\n**算法 2:** MCNN 的步骤\n\n输入：数据、种群、训练数据和测试数据\n\
  \n目标函数：适应度的准确率\n\n输出：仇恨（HATE）或非仇恨（NONHATE）\n\n1. 开始\n2. 激活 Twitter 数据程序\n3. 执行 –\
  \ 种群初始化\n4. 当 `M <= MAX`，执行\n5. 将输入转换为子层\n6. 使用 (10) 分类为仇恨和非仇恨\n7. 使用 (11) 计算适应度\n\
  8. 如果最佳，跳转到 11，否则\n9. 识别更多相关特征\n10. `M = M + 1`\n11. 执行训练和测试\n12. 返回高准确率的特征\n13.\
  \ 为所有特征复制分类标签\n14. 结束\n\n在所有 MCNN 的适应度评估期间，由于遗传操作会产生新的后代，同时计数加一，一旦达到最大代数，过程停止。完整的工作流如图图\
  \ 3.4 所示。\n\n![图 3.4 所提方法的工作流。](img/fig3_4.jpg)\n\n图 3.4 所提方法的工作流。\n\n## 3.4 性能评估\n\
  \n研究数据取自公开的推文 [26]。样本量约为 14500 条推文，被分为三类（仇恨、非仇恨和正常）。研究显示，16% 的推文包含仇恨文本，33% 为非仇恨，其余为正常推文。随后将所提工作的性能与\
  \ SVM 和 RNN 等传统方法进行比较。精确率、召回率和 F 分数的性能衡量指标。\n\n### 3.4.1 精确率 (Precision)\n\n它是模型总正例预测占总正例实例的比例。通常在假阳性（FP）成本较高时使用。精确率的计算为：\n\
  \n`Precision = TP / (TP + FP)` (3.11)\n\n### 3.4.2 召回率 (Recall)\n\n它是真正例与真正例加真负例之和的比例。假阴性（FN）成本较高时广泛使用。\n\
  \n`Recall = TP / (TP + FN)` (3.12)\n\n### 3.4.3 F1 分\n\n它是准确率的衡量，表示为：\n\n$F = \\\
  frac{1}{\\frac{1}{2\\left( \\frac{1}{RECALL} \\right)} + 1/Precision}$ (3.13)\n\n\
  ### 3.4.4 准确率 (Accuracy)\n\n它是任何算法正确分类的测试元组的百分比。\n\n`Accuracy = (No of TP + No of\
  \ TN) / (No of TP + FN + FP + TN)`\n\n## 3.5 结果与讨论\n\n下表提供了所提方法 IPCA+MCNN 与 SVM、RNN\
