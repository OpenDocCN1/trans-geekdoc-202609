  \n在我们当前所处的时代，医疗保健信息现象自 21 世纪初以来一直是新闻的焦点。多种形式的医疗保健大数据正被用于知识发现和决策制定、先进机器学习（ML）和深度学习（DL）以及神经网络方法。随着新计算技术的发展，医疗保健行业产生了大量数据，开启了多个研究课题。这些海量数据必须进行管理，但当今的重点是用于决策的信息提取。学者们正在研究大数据分析、深度学习（高级机器学习，即深度神经网络）、预测性分析以及其他多种方法以实现医疗保健的创新\
  \ [1]。鉴于这些成就，可以断言带有治愈预期的疾病预测不再是不切实际的。`医疗保健分析分类`如图图 6.1\n\n图 6.1 医疗保健分析分类。\n\n从登革热（DF）到后\
  \ COVID-19 是近期爆发的致命传染性疾病，降低死亡率需要对所有这些感染进行早期诊断。临床医生和专家在准确诊断糖尿病以及计算潜在并发症发生的概率方面面临着困难。本研究使用了一种名为`Louvain\
  \ Mani-Hierarchical Fold Learning`的混合深度学习技术，该技术建议用于医学诊断。通过巴基斯坦圣家医院提供的 44 例登革热病例实时数据集，以及关于\
  \ COVID-19、SARS、ARDS、肺孢菌、链球菌、衣原体和克雷伯菌等传染性疾病预后的 84 例病例进行了评估和验证，并对`Louvain Mani-Hierarchical\
  \ Fold Learning`医疗保健分析应用了从共症诊断中提取的 240 个实例。拉普拉斯率对导出规则的准确率评估分别为 41、18 和 24 条规则的 0.727、0.701\
  \ 和 0.203。位于巴基斯坦伊斯兰堡的 Shifa 国际医院提供了内分泌诊断信息。我们的研究结果表明，该方法未来可以用于大规模医疗保健数据的诊断评估。\n\n\
  数字设备已变得随处可见，特别是与无线传感器和移动设备结合时。大数据日益流行。需要技术来处理日益庞大且日益多样化的异构健康信息，例如传感器数据和电子健康记录。为了更好地支持现代健康数据的数量和多样性，必须修改传统的医疗保健软硬件范式。此外，必须在这些范式中加入新的“大数据”处理和分析技能。在医疗保健分析的帮助下，降低成本、民主化获取途径并保护不可替代的人类生命是可能的，它为研究人员提供了分析这些海量数据、发现模式和趋势并提供支持\
  \ [2] 的可能性。在这项工作中，我们对几种集成大数据分析的医疗保健系统进行了全面研究，并描述了可能应用于无线、云和物联网背景的许多数据分析工具、技术和算法。最后但同样重要的是，作为贡献，为所有平台构建了一个智能健康收敛点，这有助于未来标准学习医疗保健系统的开发。医疗保健数据分析是另一种减少未来开支的方法。\n\
  \n预测性方法提出，通过获取和回顾过去患者的事实、信息和记录，分析所有潜在的健康风险并在提前诊断中预测未来的医疗治疗是可行的。预测技术可以通过数据库预测进行搜索，节省金钱。通过采用一种提供算法以辅助相互疾病医疗治疗的模型，可以实现医疗保健行业医疗服务的成功，这可以反映在对患者行为和交互的收集中。传统与先进分析、商业智能、运营研究和数据挖掘的比较是分析关注的重点。然而，高级分析关注数据的描述、预测和优化。深度学习需要优化作为关键组件\
  \ [3]。我们认为，神经网络优化的理论研究在许多方面都是很有意义的\n\n首先，关于在非凸情况下是否可以解决问题的有趣问题，具有极大扩展我们对可处理问题知识的潜力。其次，传统的优化理论无法充分描述许多情况。因此，我们希望调查该领域的现有研究，并获得对机会和困难的理论理解。在深入研究谨慎初始化、归一化方法和跳跃连接等实际解决方案之前，我们必须首先调查梯度爆炸/消失问题以及更广泛的不频谱问题。第二部分查看了神经网络训练的遗传优化策略，例如随机梯度下降和自适应梯度。\n\
  \n\n\n\n\n由于预测系统的结果允许在早期检测到所有威胁时采取治疗和行动，预测分析有助于医疗行业实现高水平的有效整体护理和预防性护理，这有助于降低成本。Conley\
  \ 和同事（2008）以及 Boneshaking（2004）指出，人们通过跟进和更新其医疗状况可以为医疗保健做出贡献，以便在适当的时间接受必要的治疗。由于医疗保健部门的决策系统可以通过关注患者诊断、行为和预防来加强，以实现高水平的护理并改善医疗经济，技术时代为医疗决策支持系统增添了巨大的价值（Cannon\
  \ & Tanner 2007）。\n\n## 6.2 案例研究 1：深度学习在评估给药影响中的作用\n\n深度学习（DL）赋予了医疗行业在保持准确性的同时以极快的速度评估数据的能力。它既不是机器学习（ML）也不是人工智能（AI），而是两者的完美结合，使用分层算法架构以惊人的速度筛选数据。制药公司正在利用\
  \ AI 加速新药发现。给药次数意味着每天废水进入吸收系统或砂过滤器的次数 [4]。计量罐是指一个接收来自粪池或其他处理设备废水的封闭水罐，配备了用于抽取废水的虹吸管或泵。ML\
  \ 模型可以在几分钟内生成具有特定属性的新分子，这些分子可以对抗特定疾病，而人类手动完成可能需要几个月。手动完成需要几个月才能完成的 DL 技术正在成为一个蓬勃的研究领域。DL\
  \ 常用于医学影像，用以确定疾病的存在与否。\n\n随着医疗程序被用于早期检测、监测、诊断和治疗，医学影像在许多临床应用中发挥着重要作用。各种医疗疾病正根据治疗目的进行评估。计算机视觉中对医学图像分析的基础性理解需要对人工神经网络和\
  \ DL 的理念及应用的知识。选项选择问题通过 DL 方法得到解决。ML 结合了 DL，它可以自动从原始输入数据中提取所需的特征。AI 可以帮助应对这些挑战。ML\
  \ 是 AI 的一种应用。在没有经过显式编程的情况下，ML 从数据中学习并根据先验数据做出预测或结论。ML 中使用了三种类型的学习策略：监督学习、无监督学习和半监督学习。对于针对特定问题结合特征提取和特征选择的\
  \ ML 方法，需要领域专家。\n\n检索了四个电子数据库以寻找相关研究。前瞻性研究设计是选择标准之一，还包括稳定的慢性疾病。患者群体在每个治疗组中接受药物干预至少持续\
  \ 6 周，并使用 MEMS 测量依从性。提取了有关慢性疾病治疗和给药频率的数据。使用天数与精确剂量数之比，系统地回顾了关于药物事件监测系统（MEMS）确定的每日给药频率对慢性疾病状态下药物依从性的正确数据。有二十项研究符合选择标准。所有试验发现，接受较低剂量药物的患者依从率较高，且这些差异在统计学上具有显著性。（P\
  \ 0.05）在 20 项研究中的 15 项中达到 75% (P 0.05) [5]。在比较每日一次和每日三次给药的 6 项试验中，每日一次给药的患者依从天数比每日三次的患者多\
  \ 22% 到 41%。在比较两种方案的试验中，每日一次给药的患者依从天数比每日两次的患者多出 2% 到 44%，其中大多数研究占比约 13%，频率为 26%。\n\
  \n“机器证明的智能”一语俗称为 AI，是指机器表现出人类认知能力（如学习和解决问题）的能力。AI 改变了所有领域，包括学术和商业学科。近年来，间歇性给药药物变得日益流行，假设不频繁的用药可以提高依从性和药物有效性。然而，对间歇性给药的影响尚待研究。\n\
  \n药物靶标作用是指化学化合物与人体双分子靶标之间的相互，这对药物发现和开发至关重要。基于湿实验的药物靶标作用（DTI）知识有限，已知与未知药物对之间存在巨大空白，这增加了开发有效\
  \ DTI 方法的兴趣。传统的 DTI 方法面临财务和技术限制，而计算策略在预测 DTI 取得了成功。\n\n目前，用于 DTI 预测的主要计算方法包括配体方法、对接模拟、基因验证、文本挖掘和基于\
  \ ML 的方法。DTI 预测方法和药物靶亲和力（DTBA）预测方法广泛分为计算预测方法。基于结构和非基于结构的 DTBA 方法进一步分类。经典评分函数方法和\
  \ ML-SF 方法进一步归类为基于结构的方法，其中 DL-SF 和经典评分函数方法细分为基于知识的方法和基于 SF 力场的方法。\n\n## 6.3 案例研究\
  \ 2：基于深度学习的患者不适智能医疗系统\n\n为了节省整体医疗成本并优化工作流和流程，医院和家庭都需要远程健康监测。识别疾病和缓解患者不适的最远程监测指标之一是疼痛。某些远程医疗项目通过电话、在线或移动应用程序进行的调查使用了患者报告结局。使用远程疼痛监测反馈系统监测每日疼痛状况是实用且高效的。\n\
  \n自动疼痛评估一直是尝试的重点，无论是通过生理信号融合还是视频中的面部表情检测。然而，将远程健康监测系统与自动疼痛评估的尝试较少。对于远程患者监测系统，本研究提出了一种结合云和物联网（IoT）技术的自动疼痛评估工具。\n\
  \n本文建议的疼痛强度检测技术监测面部表面肌电来检测和评估面部表情疼痛（sEMG）。带有传感器的面罩用于检查肌肉运动，可以转换为可穿戴设备并连接到远程监测系统\
  \ [6]。建议的系统能够进行信号处理、无线数据传输、多通道生物电位数据采集和远程数据显示。\n\n### 6.3.1 远程不适监测系统\n\n开发了一种基于物联网的远程不适监测应用架构，以实现医院内住院患者和监护患者的实时中央监测，如图\
  \ 6.2 所示。\n\n\n\n\n\n![图 6.2 不适监测系统。](img/fig6_2.jpg)\n\n图 6.2 不适监测系统。\n\n### 6.3.1.1\
  \ 可穿戴传感器模式\n\n被动式 `sEMG` 传感器面罩和 `sEMG` 检测与处理模块构成了传感器节点。面罩采用的材料柔软且具有柔活性。使用后需要更换 [7]。负责数字化、无线数据传输和生物信号调理的硬件模块是可重复使用的。目标面部肌肉决定了电极放置的位置。由于采用的面罩是软的，可以根据个人面部特征对电极位置和面具形状进行一定的修改。\n\
  \n### 6.3.1.2 网关\n\n网关作为连接传感器节点与云端之间的媒介，可以是标准路由器、手机个人热点或支持异构性、可扩展性和可靠性等额外特智能网关。智能网关可以为系统提供帮助，特别是当整个远程医疗监控系统使用了多种数据和通信技术时。\n\
  \n### 6.3.1.3 云服务器\n\n云服务器使用 `UDP` 或 `TCP` 协议从传感器节点获取数据 [8]。接收数据后，将其传输到数据流通道，该通道可以连接到支持\
  \ `HTML5` 的门户以及另一个用于的数据库服务器。这种服务器范式支持多种云计算模型，如软件即服务 (`SaaS`) 和平台即服务 (`PaaS`)。这一特性在开发信号处理技术和数据挖掘技术时可能具有优势，同时能够适应不断变化的数据隐私法。\n\
  \n### 6.3.1.4 移动 Web 应用程序\n\n该设计通过移动 `HTML5` 提供了系统与护理人员之间的多媒体界面。它具有绘制实时波形、运行简单算法、将信息保存到存储在浏览器内的数据库中以及与外部数据库服务器同步的能力。这种基于\
  \ Web 浏览器作为用户界面的 Web 应用程序是一种客户端/服务器程序。Web 应用在各种终端设备上广泛使用的能力是其优点之一。通常情况下，该程序是跨平台的，可以在\
  \ `Microsoft Windows`、`Mac OS` 和 `Android` 等著名操作系统上运行。任何具有门户的终端设备（包括固定终端和移动设备）都能运行已实现的\
  \ Web 应用。\n\n### 6.3.2 用于不适检测的设备\n\n#### 6.3.2.1 用于不适检测的可穿戴传感器设计\n\n创建可穿戴传感器节点最初是为了满足数据采集和传输的需求，同时考虑了\
  \ `sEMG` 数据速率。随后将整个传感器节点（包括工作模块、电池电源和亲肤设备包装）组合在一起。设计中还包含一个佩戴被动电极的面罩。监测面部 `sEMG`\
  \ 的可穿戴传感器监测由面罩和传感器节点组成 [9]。\n\n#### 6.3.2.2 可穿戴生物传感面罩\n\n在“面部动作编码系统”(Facial Action\
  \ Coding System) 中，疼痛行为主要由涉及一个或多个面部动作单元 (`AU`) 的肌肉表示。根据`Fridlund and Cacioppo 指南`，被动电极被放置在脸的一个部位以追踪活动。监测面部\
  \ `sEMG` 的可穿戴传感器监测由面罩和传感器节点组成。不适检测系统见于图 6.3。该不适检测系统使用软性聚二甲基硅烷 (`PDMS`) 基底来制造面罩。\n\
  \n\n\n\n它继续了所有文档的机密性和完整性，并为极端情况提供了医疗数据的备份和恢复策略。任何区域的患者医疗记录访问都可以加速诊断过程、实现最佳治疗、避免并发症并提高生活质量，14]。医疗中心无疑被认为是涵盖诊断、药房和实验室服务的医疗提供者之一。医疗中心产生了对医疗数据的需求。\n\
  \n许多医院拥有有限的费用、时间和资源来连接到所有诊所的当前数据；因此，医疗数据的云计算应用是必要的。云计算确保了患者医疗数据的机密性和完整性，并允许发布在网页上的高级医疗应用程序，以便支持医疗数据。研究和开发了云计算中的数据结构和互操作性以增强医疗服务的应用。云计算已应用于中小企业（SMEs）和培训机构。\n\
  \n根据前前的研究，医疗设备的开发使用了快速应用开发方法，但很少有关于云计算应用的研究。在这方面，研究人员实施并改进了医疗设备的开发，主要基于快速应用开发（RAD）方法和云计算采用方案（ROCCA）。ROCCA\
  \ 被用作云计算实施路线图和框架。开发该设备所使用的语言是 `PHP`、`JavaScript`、`HTML` 和层叠样式表 (`CSS`)，`MySQL` 被用作数据库工具。\n\
  \n本研究的目的是设计一种用于云计算应用的医疗设备，以高速度创建诊断策略并改进医疗中心。在研究结束时，产生了一个用于医疗中心的医疗设备，包括患者管理设备、护理服务、医生记录或实验室服务，以及在每个部门使用的医疗药物。因此，预计数据集成将高速度增强医疗服务。ROCCA\
  \ 应用版本是根据设备设计需求和云计算实施而选择的。\n\n### 6.4.1 方法\n\n在设备开发期间，采用了 `RAD`，它包含四个阶段：规划、分析、设计和实施。然而，从设计到实施的转换中整合了\
  \ `ROCCA` 作为协助云计算应用的路线图。医疗设施的数据系统使用了平台即服务 (`PaaS`) 服务模型和私有云部署模型。ROCCA 模型根据设备的设计需求和其云计算实施被选择。\n\
  \n#### 6.4.1.1 规划阶段\n\n机构的广泛描述是主要的学习阶段和机构的典型视图，例如概况、每个想象和预测、任务、结构和挑战启动。机构内的挑战启动总结了通过诊所所需的选择设备。\n\
  \n#### 6.4.1.2 分析阶段\n\n评估阶段是回答测试问题的阶段。例如，利益相关者、使用设备的人员以及实施设备的时间和区域详细信息。在此阶段，研究人员识别了用户的需求、现有文化以及机构承担云计算技术的准备情况[15]。\n\
  \n它还产生了一项承诺需求，提供了设备设计方法的需求、潜在缺点和威胁。使用 SWOT 分析来调查基于云计算的医疗数据实施的力量、缺点、机会和障碍。\n\n####\
  \ 6.4.1.3 设计阶段\n\n前一个阶段的结果产生了建议设备的需求和规范。这些数据通过使用统一建模语言 (`UML`) 图表参考来定义业务方法和目的建模。设计部分还产生了作为数据库布局的数据库结构以及记录规范，并产生了设备的界面图。\n\
  \n#### 6.4.1.4 实施阶段\n\n此阶段产生了设备构建、云基础设施的需求以及采用和迁移计划。在设备构建阶段，在开发方法过程中使用黑盒测试方法检查代码。云基础设施的需求在本节中与迁移的支持和规划一起使用。软件和信息集成部分构建了通过集成和适配要传输的程序和信息到云计算的方法，目标是云平台和基础设施。本节的最后一步是设备用户评估，涉及用户软件测试和通过用户进行的满意度评估。评估以问卷的形式呈现，由研究人员发布，其中响应分析了使用百分比计算来获取评估结果。\n\
  \n## 6.5 案例研究：深度学习在临床试验进展中的挑战与优势\n\n深度学习 也称为分层学习或深度结构化学习，是 `ML` 的子集，它利用多层算法架构来分析数据。在\
  \ `DL` 模型中，数据通过一系列连续层进行处理，每层利用前一层的输出来告知其结果。这种方法在访问重要数据以及改进未来使用的连接和关联方面更加彻底。\n\n\n\
  \n\n根据来自 Meta、Google、多伦多大学和蒙特利尔大学工程师撰写的一篇 2015 年《自然》文章，深度学习（DL）是一种表示学习方法，由多个层级的表示组成。简单但非性的模块构成了每一层表示，每个模块将一个描述层（最初从原始键入开始）转换为稍微抽象的插图层。通过组合这些层级，可以学习复杂的函数，并且高层次的表示可以增强输入的显著性，同时限制无关的变异。DL\
  \ 模型的层层结构使其能够执行分类任务，例如识别医学图像中的异常、将具有相似特征的患者分入基于风险的队列，或在大量的非结构化数据中突出症状与结果之间的关系。与其他机器学习（ML）方法不同，DL\
  \ 不需要人类训练者进行过多干预来做出决策，因为模型的多层结构允许程序员能够自己评估答案的正确性。基础机器学习方法仅指示输出是正确还是错误，而 DL 的多层结构赋予了程序员确定正确性的能力。\n\
  \n根据《自然》杂志的一篇文章，DL 技术对数据的预处理要求较少，因为网络可以处理许多人类程序员在使用其他机器学习方法时必须执行的归一化和筛选任务。传统的机器学习技术在处理原始自然数据方面存在局限性，几十年来，设计特征提取器将原始数据转换为特征向量以供适当的内部表示或学习子系统是非常必要的。这一过程需要专业知识和精细的工程支持，只有这样，组织才能识别或分类输入中的模式。然而，DL\
  \ “自动发现检测或分类所需的表示”，减少了对监督的需求，并加速了从海量、未处理数据中挖掘有价值见解的过程。\n\n### 6.5.1 深度学习用例\n\n虽然今天\
  \ DL 行业的许多头条新闻关于前商业阶段的小型试点或实验，但 DL 正在进入在真实世界临床环境中具有高价值应用的创新工具中。这项技术对于以患者为中心的应用以及提高医疗健康\
  \ IT 的易用性特别有用。虽然目前的试点和项目令人兴奋，但它们仅仅是 DL 在健康分析和患者护理中潜力的开始。国家协调员办公室对 DL 的未来持乐观态度，并对开发人员的卓越成果给予了认可。根据最近关于医疗保健\
  \ AI 状态的报告，某些 DL 算法已经取得了“革命性”的成果。\n\n临床试验参与者的管理包括患者或受影响人群的偏好、患者招募和参与者留存。遗憾的是，患者的退出和不合规通常会导致研究变得不可接受，尽管在管理参与者方面通常投入了大量的资源，包括研究协调员的时间、规划和精力。这往往超过了时间和成本，或者未能产生可用的数据。事实上，33.6%\
  \ 到 52.4% 的 1-3 期临床药物在开发过程中没有进入下一阶段，而且 1 期研究药物总体有 13.8% 的概率获得批准。机器学习方法允许我们更高效、公平地识别、招募和留存参与者\
  \ [16]。\n\n科学领域机器学习的使用可以改变事实系列和所需的评估策略。因此，机器学习策略可以帮助解决许多与缺乏事实和积累全球事实相关的问题。来自可穿戴设备和不同手机/数字设备的患者生成的健身事实在某些情况下可以补充或可能更新对访问及其相关的传统现实事实系列的观察。可穿戴设备和不同设备可能还允许使用新的、关注患者的扩展。通过借助使用手机设备的多个传感器（包括摄像头、音频录音机、加速度计和光电脉搏波记录法）收集的事实来扩展新的“虚拟生物标志物”，经常需要\
  \ ML 处理以获得相关的见解，因为来自这些设备的事实可能稀疏，并且在质量、易访问性和同时性方面存在差异。\n\n通过使用极大且复杂的数据，借助可穿戴设备和不同设备进行研究的功能因此需要专门的事实系列、存储、验证和评估策略。例如，深度神经网络用于单导联电图平台，随机森林版本用于帕金森病患者的音频输出，循环神经网络用于特应性皮炎患者的加速度计事实。\n\
  \n\n\n\n\n神经影像是一种用于分析神经系统结构和功能的成像技术，包括大脑 [21]。随着神经系统疾病的发病率不断提高，对神经影像技术及后续数据分析的需求日益增长。已开发出各种成像技术和基于深度学习（DL）的分析方法，用于神经系统疾病的早期检测和适当的治疗策略\
  \ [22]。\n\n近年来，`DL` 算法已应用于多个领域，包括图像分析、异常检测、疾病检测和自然语言处理。神经影像研究人员尝试使用深度结构化学习方法（如 `CNNs`）从\
  \ MRI 扫描中检测神经系统疾病。跨媒体方法（如数据融合）也被应用于各个领域，包括个性化服务和神经系统疾病诊断。在 `DL` 的各种架构中，研究人员主要基于\
  \ `CNN` 的方法来提取 MRI 数据。\n\n这种 NLD（神经系统疾病）由深度神经网络（`DNN`）和自动编码器（`AE`）生成。此外，在 2015 年至\
  \ 2019 年，发表的文献中，与 `AD` 相比，`PD` 或 `SZ` 的诊断引起了更多关注 [23]。\n\n由于该领域的关注度日益增加，且分析 MRI\
  \ 扫描的方法报告不断增多，我们总结认为已有文章可以从针对特定任务和数据集的不同视角出发，加速适用技术的筛选过程。有几篇综述文章总结了各种方法的进展。其中一个目标是将大数据和\
  \ `ML` 的应用整合到心理健康研究中 [24]。研究人员正在研究各种基于 `ML` 的任务，以提高神经系统疾病的诊断。他们还研究了 `DL` 在更更好地理解和诊断\
  \ `PD` 方面的应用。\n\n已有关于结合多种医学图像（如神经、病理和肺部图像）分析的 `DL` 详尽综述 [25]。然而，任何现有的综述文章都没有很好地解释数据选择和预处理。为了填补这一空白，本工作重点关注提供\
  \ `DL` 在通过 MRI 扫描检测 `NLDs`（即阿尔茨海默病 `AD`、帕金森病 `PD`、精神分裂症 `SZ`）方面的应用概览，并进一步结合常用的开放数据集和预处理方法进行\
  \ [26]。\n\n因此，本工作的主要目的是：\n\n*   内容描述了用于分析 MRI 扫描以检测神经系统疾病（`NLDs`）的 `DL` 方法的几个方面。它包含引言，引用了用于从\
  \ MRI 扫描中识别异常的各种 `DL` 架构和预处理技术。该引言目的是帮助初学者理解框架并为未来提供参考。\n*   内容还包括对现有研究的详细综述，这些研究在\
  \ MRI 中 `DL` 对三种主要 `NLD` 变体（`AD`、`PD` 和 `SZ`）进行诊断和分类。综述试图验证适用于这三种疾病的基于 `DL` 的分类方法。\n\
  *   此外，内容回顾了热门的开放数据集，并提供了有关受体的信息，包括年龄、性别和 MRI 扫描模态。这有助于使用开放基准数据集对新方法进行验证和比较。\n*\
  \   最后，内容对当前面临的研究问题和可以帮助学者有效开发的未来研究想法进行了重点讨论。它简要描述了目前用于分析 MRI 扫描以检测 `AD`、`PD` 和\
  \ `SZ` 的不同 `DL` 架构。该部分还描述了常见的预处理技术，并提供了对这 `NLDs` 检测的详细报告。\n\n本节提供了可供探索的现有开放数据集。该节包含对综述技术的性能评估。它在几秒钟提供了完成工作的挑战和未来展望。\n\
  \n## 6.7 结论\n\n`DL` 的主要目标是通过每份数据进行增强。这包括调整其底层结构以准确评估数据的能力。一旦使用测试数据完全构建，该网络将通过客户分析实现更易于使用。\n\
  \n类似于流媒体服务推荐你应该看的内容，你观看过的节目数据会被处理，并做出决策以推荐你可能感兴趣的内容。`DL` 模型侧重于认知计算和模拟人类的思维结构。\n\n\
  作为 `ML` 的一部分，`DL` 与神经网络一起工作，模拟大脑对输入做出反应并做出决策。神经网络的节点从输入连接到网络的隐藏层，然后连接到输出。`DL` 尝试增强决策过程；模型运行得越久，就越精确、越有表现。后来，`AI`\
  \ 采用 `DL` 来增强其分析过程。因此，随着突破，`AI` 在准确性和速度方面变得智能。随着 `DL` 驱动我们的未来，大数据已使这种模型变得直观。\n\n\
