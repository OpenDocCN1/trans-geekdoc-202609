  \ template) |\n``` \n\n运行后，您将看到：\n\n![images/LearningToSee/CNNWithPooling.png](img/CNNWithPooling.png)\n\
  \n再次观察模型的变化。图中增加了一个最大池化层，输出的高度和宽度均减半。您可以重复此过程，添加更多卷积阶段，并观察模型的变化：\n\n``` \n| ​  ||\
  \ cnn_model = |\n``` \n\n| --- | --- |\n\n| ​  || cnn_model |\n| ​  || |> Axon.conv(64,\
  \ ​*kernel_size:*​ {3, 3}, ​*activation:*​ ​*:relu*​, ​*padding:*​ ​*:same*​) |\n\
  | ​  || |> Axon.max_pool(​*kernel_size:*​ {2, 2}, ​*strides:*​ \\[2, 2\\]) |\n|\
  \ ​  || |> Axon.conv(128, ​*kernel_size:*​ {3, 3}, ​*activation:*​ ​*:relu*​, ​*padding:*​\
  \ ​*:same*​) |\n| ​  || |> Axon.max_pool(​*kernel_size:*​ {2, 2}, ​*strides:*​ \\\
