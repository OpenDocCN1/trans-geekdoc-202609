  \ Neural Network）。你构建并训练了一个卷积神经网络，用于准确分类猫和狗的图片。在应用了几个额外的模型训练技巧，如数据增强（data augmentation）和丢弃层（dropout），你能够训练一个模型，将图片分类为猫或狗，准确率达到\
