  \ |\n| || Batch: 23, accuracy: 0.9752605 loss: 0.0922253 |\n| || Epoch: 9, Batch:\
  \ 700, accuracy: 0.9777576 loss: 0.1030978 |\n| || Batch: 23, accuracy: 0.9709822\
  \ loss: 0.1120541 |\n\n你的模型在上一次训练迭代后已经取得了令人印象深刻的表现，这在训练日志中已经显而易见。模型在训练和验证数据上略有提升，但你需要确认微调是否提升了其在测试集上的性能：\n\
  \n| || eval_model = model |> Axon.sigmoid() |\n| --- |\n| ||  |\n| || eval_model\
  \ |\n| || |> Axon.Loop.evaluator() |\n| || |> Axon.Loop.metric(​*:accuracy*​) |\n\
  | || |> Axon.Loop.run(test_pipeline, trained_model_state, ​*compiler:*​ EXLA) |\n\
  \n运行该单元后，你会看到以下结果：\n\n| || Batch: 23, accuracy: 0.9709823 |\n| --- |\n|  |\n\n就在你开始怀疑自己在这一问题上无法再有所提升时，你能够从模型中进一步挤压出性能。通过微调预训练模型的顶层，你能够使模型的性能提升了几个百分点。\n\
  \n现在你已经看到了传递学习和微调的强大效果，可能会好奇它们为何如此有效，以及是否应在每种情境下使用它们。在下一节中，你将更深入地理解传递学习的直觉，并进一步了解何时应使用它。\n\
  \n## 理解传递学习\n\n传递学习是一种将预训练模型重新用于相关任务的技术。你在上一节中已经在深度学习问题——具体来说是计算机视觉问题——的语境下看到过传递学习。虽然可以将传递学习应用于其他机器学习技术和其他领域，但它在计算机视觉问题中尤为常见。\n\
  \n传递学习的强大之处应当能够让人产生直观的理解。与其为每个问题从零开始训练，你通过注入一些过去对问题的了解，可以加速训练过程。在第 6 章 *Go Deep\
  \ with Axon* 中，你了解到深度学习的核心在于学习数据的有用表示。如果你拥有一个已经学习到与你的数据相似输入数据的有用表示的预训练模型，那么让它帮助你更快、取得更好最终性能是合理的。\n\
  \n在这一节中，你将更深入地探讨传递学习的原因，以及何时使用它。\n\n### 为何传递学习有效\n\n回顾第 7 章 *Learn to See*，卷积神经网络的早期层往往学习通用特征，例如图像中的边缘。这些通用特征适用于任何图像识别任务。边缘特征无论模型的目标是识别猫和狗，还是检测街头标志上的字母，其本质保持不变。这意味着你可以将预训练模型的部分作为通用特征探测器，并将其应用于特定任务。\n\
  \n\n\n\n预训练模型通常是在像 ImageNet 这样的大型数据集上训练的，这意味着它们会接触到广泛的输入数据。换句话说，它们能够将知识推广到许多不同的使用场景，因为它们在大量、多样的数据上进行了训练。从某种意义上说，你可以认为这些模型学到的表示是视觉数据的通用表示。但说这些模型能够适用于所有类别的视觉数据可能有点牵强。使用已经具备一些有用视觉数据表示的模型的意义在于，你的模型不必花费时间去学习自己的表示，而是可以直接利用这些表示来进行预测。\n\
  \n考虑你在上一章节中从零开始训练的模型。它在大约 25,000 张猫和狗的图片上进行了训练。如果你将你在上一章节中训练的模型的特征与 MobileNet 学到的特征进行比较——MobileNet\
  \ 在 1400 万张来自 1,000 个不同图像类别的图片上进行了训练——你觉得哪个模型学到了视觉数据最强健、最通用的特征？你从零开始训练的模型不仅要从少量输入数据中学习视觉数据的表示，还要利用这些表示来进行预测。而你在本章节中训练的模型任务更为简单——仅需基于强健的表示进行预测。你可以把它看作是给你的模型在竞赛中提供了显著的先手优势。\n\
  \n理解为什么迁移学习效果如此显著，可能会让你想知道是否应该在你遇到的每一个问题中都使用预训练模型。在下一节中，你将进一步了解何时使用迁移学习是合理的，何时则不应使用。\n\
  \n### 了解何时使用迁移学习\n\n像机器学习中的大多数问题一样，关于何时使用迁移学习没有 definitive（决定性的）答案，答案是 “it depends”（这取决于）。它取决于许多因素，例如你拥有的数据类型、数据量、可用资源以及你的目标。\n\
  \n在计算机视觉和自然语言处理等领域，迁移学习是训练新模型用于专门应用的标准做法。这主要是因为通用模型的丰富以及它们在各种问题上带来的显著性能提升——即使数据量不多。\n\
  \n总体而言，如果你数据量不足，你很可能会从使用预训练模型中受益。即使你拥有大量数据，仍可能从中受益。但某些领域需要全新的方法。有些领域根本没有可用的预训练模型。\n\
  \n还需要注意，你不能随意选择任何预训练模型并期望它能在你的输入数据上工作。例如，在 ImageNet 上训练的 MobileNet 作为生物医学图像模型的卷积基础是一个糟糕的选择。ImageNet\
  \ 中没有生物医学图像，生物医学图像与其他类型图像的相似性也不高。要让迁移学习成功，你需要确保选择的模型在与你的使用场景足够相似的数据上被训练——你不会指望一个在葡萄牙语上训练的模型对英文语言有有用的表示。\n\
  \n在选择预训练模型时，你需要考虑你所面对的问题以及成功的标准。虽然你可以选择在某些通用机器学习基准上指标最好的模型，但这不一定是最佳选择。例如，如果你计划在移动设备或边缘设备上部署模型，通常最好的模型也会更大、计算更密集，导致运行变慢。你需要在选择预训练模型时综合考虑所有性能目标。\n\
  \n好在预训练模型在机器学习生态系统中非常丰富。但你可能会疑惑，在如此新颖的 Elixir 机器学习生态系统中，如何使用这些模型？大多数预训练模型都是使用 Python\
  \ 特定的机器学习框架构建的。如何在你的项目中利用这些模型？在下一节中，你将使用 Python 生态系统中可用的工具和仓库，将模型导入到你的 Elixir 项目中。\n\
  \n### 利用机器学习生态系统\n\n你可能注意到，本章的标题在《Machine Learning in Elixir》这本书中显得有点讽刺。毕竟，Nx 生态系统是否不是\
  \ Python 机器学习生态系统的 Elixir 版本？在很多方面，像 Axon 这样的 Elixir Nx 项目本身就模仿了 Python 生态中的对应项目——在设计上有合理的偏差，并在必要时做出完全不同的选择。这些与\
  \ Python 的偏离是有意为之的，但这并不意味着 Elixir Nx 完全回避 Python 环境。从一开始，Nx 就被设计为灵活。它并不完全依赖于像 TensorFlow\
  \ 或 PyTorch 这样流行的 Python 前端项目，而是采用模块化的方式，能够利用任何张量操作库。\n\n这种灵活性的哲学也延伸到 Axon 等库。Axon\
  \ 的核心特性是 Axon 数据结构，它以类似图的结构表示神经网络。你可以直接在 Elixir 中操作和构建这个数据结构。其魅力在于，如果你知道如何遍历 Axon\
  \ 图，就知道如何将其转换为外部格式。同样，如果你拥有来自外部框架（如 ONNX 或 TensorFlow）的序列化格式，也可以轻松将其转换为 Axon 图以在\
  \ Elixir 中直接使用。Axon 不绑定到任何特定的运行时，因此你无需担心被特定的模型格式所束缚。\n\nPython 环境庞大，就像在语言间选择大量的\
  \ Web 框架和栈一样，在 Python 机器学习领域也有大量的框架和栈可供选择。Axon 及其相关项目的明确目标是：无需实现 Port 或绑定到特定运行时，即可无缝导入\
  \ Python 生态中的任何模型并用于 Elixir。\n\n你可能在想如何在自己的项目中使用已有的模型。在本节的其余部分，你将把从流行框架导出的模型转换为\
  \ ONNX 格式，以便在 Elixir 中使用。\n\n### 导出 TensorFlow 模型\n\nTensorFlow 的主要序列化模型格式是 Saved\
  \ Model，^([\\[19\\]](#f_0059.xhtml#FOOTNOTE-19)) 虽然较早的 TensorFlow Keras 版本也支持多种模型和权重的序列化格式。本节专门讨论\
  \ Saved Model 格式。\n\n#### 使用 tf2onnx\n\ntf2onnx^([\\[20\\]](#f_0059.xhtml#FOOTNOTE-20))\
  \ 是一个用于将 TensorFlow 模型转换为 ONNX 格式的 Python 库。tf2onnx 支持 TensorFlow Saved Model、TensorFlow.js\
  \ 模型以及 TensorFlow Lite 模型。使用 tf2onnx 最简便的方式是通过命令行工具。例如，如果你有一个保存在目录中的 TensorFlow\
  \ Saved Model，可以运行以下命令进行转换：\n\n| ​  || $ python3 -m tf2onnx.convert ​*​*​ |\n\n\
  | --- | --- |\n\n| ​  || \\--saved-model path-to-model ​*​*​ |\n\n| ​  || \\--output\
  \ model.onnx |\n\n为了看到 tf2onnx 的实际效果，请新建一个名为 save_tensorflow_model.py 的 Python 文件，并将以下代码复制进去：\n\
  \n| ​  || ​**import**​ ​**tensorflow**​ ​**as**​ ​**tf**​ |\n\n| --- | --- |\n\n\
  | ​  ||  |\n\n| ​  || model = tf.keras.applications.ResNet50(weights=​*\"imagenet\"\
  *​) |\n\n| ​  ||  |\n\n| ​  || model.save(​*\"resnet\"*​) |\n\n将复制的代码保存为 save_tensorflow_model.py\
  \ 文件后，运行以下命令：\n\n| ​  || $ python3 save_tensorflow_model.py |\n\n\n\n-   [脚本导入预训练的\
  \ ResNet50 模型，使用 tf.keras.applications 子模块。你可以在 Keras Applications^([\\[21\\]](#f_0059.xhtml#FOOTNOTE-21))\
  \ 模块下找到其他多种预训练模型。导入 ResNet50 后，脚本会使用保存模型格式将模型保存到 resnet 目录。运行脚本后，你会在工作目录中看到 resnet\
  \ 目录。\n\n1.  运行以下命令将模型转换为 ONNX：\n\n| ​  || $ python3 -m tf2onnx.convert ​*​*​ |\n\
  \n| --- | --- |\n\n| ​  || --saved-model resnet/​*​​* |\n\n| ​  || --output resnet_tensorflow.onnx\
  \ |\n\n2.  运行脚本后，你会在当前工作目录中看到 resnet_tensorflow.onnx 文件出现。\n\n3.  创建一个名为 resnet.exs\
  \ 的新 Elixir 脚本，并将以下代码复制进去：\n\n| ​  || Mix.install(​[​ |\n\n| --- | --- |\n\n| ​ \
  \ || {​*:axon_onx*​, ​*\"*​​*~> 0.4*​},​ |\n\n| ​  || {​*:axon*​, ​*\"*​​*~> 0.5*​}​\
  \ |\n\n| ​  || ]​ |\n\n| ​  ||  |\n\n| ​  || {model, params} = AxonOnnx.​**import**​(​*\"\
  *​​*resnet_tensorflow.onnx*​)​ |\n\n| ​  ||  |\n\n| ​  || IO.inspect model​ |\n\n\
  4.  在终端运行：\n\n| ​  || $ elixir resnet.exs​ |\n\n| --- | --- |\n\n运行后，你会看到类似以下输出：\n\
  \n| ​  || 09:36:43.537 \\[warning\\] unk​\\_\\_613 has no specified dimension, assuming\
  \ nil​ |\n\n| --- | --- |\n\n| ​  ||  |\n\n| ​  || #Axon<​ |\n\n| ​  || inputs:\
  \ [\"input_1\"]​ |\n\n| ​  || >​ |\n\n5.  该输出表明模型已准备好在 Elixir 中使用。warning 表示有一个未指定尺寸的维度，Axon\
  \ 将其设为 nil。这里的 unk​\\_\\_613 是模型的 batch 维度。如果出现此类 warning 并出现导入错误，通常可以通过在导入时提供显式尺寸来消除：\n\
  \n| ​  || {model, params} = AxonOnnx.​**import**​(​*\"*​​*resnet_tensorflow.onnx*​,\
  \ ​*unk​\\_\\_613:*​ 32)​ |\n\n6.  一旦为维度提供显式值，就必须始终使用相同数值的尺寸。\n\n#### 查找预训练的 TensorFlow\
  \ 模型\n\n虽然本例使用了 tf.keras.applications，但你也可以在其他位置找到 TensorFlow 保存的模型。TensorFlow Hub^([\\\
  [22\\]](#f_0059.xhtml#FOOTNOTE-22)) 是专门用于保存预训练模型的 TensorFlow 仓库，支持多种任务和多种格式。大多数模型均可由\
  \ tf2onnx 支持，但若要确保从 TensorFlow Hub 的各种格式中正确导出，可能需要查阅 tf2onnx 文档。\n\n如在 ​*Exporting\
  \ Models from HuggingFace*​，你也可以从高层应用库（如 HuggingFace transformers）自行导出模型。\n\n###\
  \ 从 PyTorch 导出模型\n\nONNX 是微软与 Meta 合作的开放项目，而 PyTorch 是 Meta AI 实验室的产品，PyTorch 拥有首屈一指的\
  \ ONNX 导出支持。torch.onnx^([\\[23\\]](#f_0059.xhtml#FOOTNOTE-23)) 模块提供导出函数。文档详细说明导出过程以及常见的陷阱。给定一个预训练的\
  \ PyTorch 模块，通常可以直接使用 torch.onnx.export 完成导出：\n\n| ​  || ​**import**​ ​**torch**​\
  \ |\n\n| --- | --- |\n\n| ​  ||  |\n\n| ​  || dummy_input = torch.randn(10, 3, 224,\
  \ 224) |\n\n| ​  ||  |\n\n| ​  || torch.onnx.export(model, dummy_input, ​*\"model.onnx\"\
  *​) |\n\n只需提供一个明确的输入张量供 PyTorch 用于构建 ONNX 图。\n\n#### 示例：保存 PyTorch ResNet 模型\n\n\
  1.  创建名为 save_pytorch_model.py 的新 Python 脚本，粘贴以下代码：\n\n| ​  || ​**import**​ ​**torch**​\
  \ |\n\n| --- | --- |\n\n| ​  || ​**import**​ ​**torchvision**​ |\n\n| ​  ||  |\n\
  \n| ​  || dummy_input = torch.randn(10, 3, 224, 224) |\n\n| ​  ||  |\n\n| ​  ||\
  \ model = torchvision.models.resnet50(pretrained=True) |\n\n| ​  ||  |\n\n| ​  ||\
  \ torch.onnx.export(model, dummy_input, ​*\"resnet_pytorch.onnx\"*​) |\n\n2.  运行脚本：\n\
  \n| ​  || $ python3 save_pytorch_model.py​ |\n\n运行后，你会在当前工作目录看到 resnet_pytorch.onnx\
  \ 文件。\n\n3.  修改 resnet.exs，改为导入 PyTorch 版本的 ResNet ONNX 模型：\n\n| ​  || Mix.install(​[​\
  \ |\n\n| --- | --- |\n\n| ​  || {​*:axon_onx*​, ​*\"*​​*~> 0.4*​},​ |\n\n| ​  ||\
  \ {​*:axon*​, ​*\"*​​*~> 0.5*​}​ |\n\n| ​  || ]​ |\n\n| ​  ||  |\n\n| ​  || {model,\
  \ params} = AxonOnnx.​**import**​(​*\"*​​*resnet_pytorch.onnx*​)​ |\n\n| ​  || \
  \ |\n\n| ​  || IO.inspect model​ |\n\n4.  再次运行：\n\n| ​  || $ elixir resnet.exs​\
  \ |\n\n| --- | --- |\n\n输出示例：\n\n| ​  || #Axon<​ |\n\n| --- | --- |\n\n| ​  || inputs:\
  \ [\"input.1\"]​ |\n\n| ​  || >​ |\n\n这表明已成功从 PyTorch 导入并使用预训练模型在 Elixir 中。\n\n\
  #### 查找预训练的 PyTorch 模型\n\n与 TensorFlow 类似，PyTorch 也有多个渠道提供预训练模型。如 TorchVision^([\\\
  [25\\]](#f_0059.xhtml#FOOTNOTE-25))、TorchText^([\\[26\\]](#f_0059.xhtml#FOOTNOTE-26))、TorchAudio^([\\\
  [27\\]](#f_0059.xhtml#FOOTNOTE-27)) 等库中包含可导出的模型。\n\n如果在 GitHub 上找到 PyTorch 实现的预训练模型，通常可以将其导出为\
  \ ONNX 格式。正如文档所述，导出时需要注意一些细节，并可能需要对模型进行小幅修改，但 ONNX 覆盖了大多数感兴趣的模型。\n\n### 从 HuggingFace\
  \ 导出模型\n\n目前最流行的机器学习库是 HuggingFace Transformers^([\\[28\\]](#f_0059.xhtml#FOOTNOTE-28))，它提供\
  \ transformer 模型的便利和预训练实现。你将在第 11 章 ​*Model Everything with Transformers*​ 中使用这些模型。HuggingFace\
  \ 也提供一个模型中心，汇集了众多组织和个人的模型。Elixir 有专门的库 Bumblebee^([\\[29\\]](#f_0059.xhtml#FOOTNOTE-29))\
  \ 直接与 HuggingFace Hub 交互，提供原生 Elixir 实现，比通过 ONNX 自动导入的版本更简洁、更健壮。如果想使用 Bumblebee\
  \ 中没有的模型，可以通过 transformers.onnx Python 模块导出部分 transformer 模型。\n\n假设已安装 transformers\
  \ 库，只需在终端执行类似命令即可导出 HuggingFace 模型的 ONNX 版本：\n\n| ​  || $ python3 -m transformers.onnx\
  \ --model=org/model path​ |\n\n| --- | --- |\n\norg/model 指向目标模型。并非所有模型都官方支持。^([\\\
  [30\\]](#f_0059.xhtml#FOOTNOTE-30)) 为了直观了解导出过程，可运行以下命令导出微软的预训练 ResNet：\n\n| ​  ||\
  \ $ python3 -m transformers.onnx --model=microsoft/resnet-50 resnet/ |\n\n\n\n\n\
  ## 9 理解文本\n\n在过去的几章节，你解决的神经网络问题仅限于图像数据。虽然深度学习对计算机视觉产生了显著影响，但它同样适用于多种其他领域。作为一名有志成为机器学习工程师的人，理解如何在不同领域使用深度学习来解决不同问题至关重要。\n\
  \n自然语言处理（NLP）是受益于深度学习兴起的重要领域之一。作为人工智能和计算机科学的分支，NLP 处理人类语言。如果你的问题是关于文本的，你大概率需要进行自然语言处理。\n\
  \n神经网络在每个语言理解任务中都取得了重大突破，从文本分类到问答系统到机器翻译。虽然大多数突破都源于规模更大的 Transformer 模型，但理解一些序列处理的基础方法——即循环神经网络（RNN）——仍然很重要。RNN\
  \ 是专门用于处理序列的深度学习模型类别。本章你将了解 RNN 是什么，为什么它优于传统的前馈网络来处理序列，以及导致 Transformer 兴起的常见陷阱。\n\
  \n### Classifying Movie Reviews\n\n想象你在一家电影院工作，任务是根据专家对电影的评论决定放映哪些电影。虽然你可以花时间浏览所有评论，但这既耗时又乏味。相反，你决定创建一个算法来分类电影评论为正面或负面，然后只放映评分最高的正面电影。这正是情感分析的经典应用场景。\n\
  \n情感分析的目标是从自然语言中提取情感。情感是文本所表达的态度。换句话说，情感分析关注从给定文本中提取整体态度或观点。通常，情感分析处理离散标签，如正面、负面或中性，以及文本的整体情感，而不是针对特定主题的情感。更高级的情感分析任务可能关注文本的积极或消极程度，以及情感的对象。\n\
  \n对于本例，你关注的是给定评论对某部电影的情感。这是理想的情感分析问题——情感对象明确，评论明确旨在传达对主题的观点。训练模型时，你将使用 IMDB Movie\
  \ Reviews 数据集。^([\\[31\\]](#f_0064.xhtml#FOOTNOTE-31)) IMDB Movie Reviews 数据集包含\
  \ 25,000 条训练评论和 25,000 条测试评论。每条记录包含一段英文评论和一个情感标签，例如：\n\n| ​  || review = \"The Departed\
  \ is Martin Scorsese's best work, and anybody |\n\n| --- | --- |\n\n| ​  || who\
  \ disagrees is wrong. This movie is amazing.\" |\n\n| ​  ||  |\n\n| ​  || sentiment\
  \ = 1 |\n\n要开始，请在 Livebook 中添加以下依赖：\n\n| ​  || Mix.install(​ |\n\n| --- | --- |\n\
  \n| ​  || {​*:scidata*​, ​*\"*​​*~> 0.1\"*​}, |\n\n| ​  || {​*:axon*​, ​*\"*​​*~>\
  \ 0.5\"*​}, |\n\n| ​  || {​*:exla*​, ​*\"*​​*~> 0.6\"*​}, |\n\n| ​  || {​*:nx*​,\
  \ ​*\"*​​*~> 0.6\"*​}, |\n\n| ​  || {​*:table_rex*​, ​*\"*​​*~> 3.1.1\"*​}, |\n\n\
  | ​  || {​*:kino*​, ​*\"*​​*~> 0.7\"*​} |\n\n| ​  || \\]) |\n\n\n\n\nNothing unexpected\
  \ here. You’re using SciData to download the IMDB dataset, Axon to create and train\
  \ your neural network, EXLA to accelerate your computations, and Nx for some basic\
  \ numerical computation and preprocessing. As a final bit of set up, run the following\
  \ code to set EXLA as your default Nx backend:\n\n``` \n| Nx.default_backend(EXLA.Backend)\
  \ |\n``` \n\nYou know the drill. With your setup complete, it’s time to move on\
  \ to the data.\n\n### Getting the Data\n\nThe IMDB Review Dataset is available as\
  \ a module in SciData. Download the data by running the following code:\n\n``` \n\
  | data = Scidata.IMDBReviews.download() |\n``` \n\nAfter running that code, you’ll\
  \ see the following output:\n\n``` \n| %{ |\n| review: [ |\n| \"The story centers\
  \ around Barry McKenzie who must go to England..., | \n| \"'The Adventures Of Barry\
  \ McKenzie' started life as a satirical..., | \n| ... | \n| ], |\n| sentiment: [1,\
  \ 1, 1, 1, 1, 1, 1, 1, 1, ...] | \n} |\n``` \n\nBefore continuing, you’ll want to\
  \ split the dataset into a training and test set:\n\n``` \n| {train_data, test_data}\
  \ = |\n| data.review |> Enum.zip(data.sentiment) |> Enum.shuffle() |> Enum.split(23_000)\
  \ |\n``` \n\nThe dataset is a map of reviews and sentiment, with corresponding entries\
  \ mapping to the same review. At this point, it might be unclear how you can map\
  \ this raw text to numeric data. Extracting an informative numerical representation\
  \ of text is a key challenge in natural language processing. There are many approaches.\
  \ Perhaps the most common approach in deep learning is to tokenize and then vectorize\
  \ the text.\n\nTokenization is the process of splitting text into discrete units\
  \ known as tokens. You might be familiar with tokenization in the context of programming\
  \ languages. Compilers generally tokenize a program into a sequence of tokens. The\
  \ tokenization process is generally much easier because the rules of a programming\
  \ language are well-defined. On the other hand, natural language is unstructured\
  \ and differs in significant ways between languages. This implies that there are\
  \ no universally superior tokenization strategies, but there are a few common ones.\n\
  \n#### Tokenizing on Whitespace\n\nOne of the most common tokenization strategies\
  \ is to split text at each whitespace character. This is especially common in languages\
  \ like English where whitespace is a semantically meaningful separator. This natural\
  \ separation makes it easy to identify distinct tokens. Tokenizing on whitespace\
  \ is not necessarily a good option for all types of text though. For example, Chinese\
  \ doesn’t give any significance to whitespace characters, so tokenizing on whitespace\
  \ doesn’t make any sense. An additional drawback is that whitespace tokenization\
  \ leads to a large vocabulary of tokens. Depending on the corpus, the potential\
  \ vocabulary size is unbounded.\n\n#### Tokenizing on Characters\n\nAnother common\
  \ strategy is to tokenize at the character level. In other words, each character,\
  \ including whitespace, represents a distinct token. This is useful in a multilingual\
  \ context, as you are able to capture distinct tokens across languages. Tokenizing\
  \ at the character level also limits the size of your vocabulary, though tokens\
  \ from character-based languages will end up representing a significant portion\
  \ of your final vocabulary. One drawback of tokenizing at the character level, especially\
  \ for languages like English, is that the length of your sequence increases significantly,\
  \ which has significant disadvantages during training and inference. You’ll learn\
  \ more about these disadvantages later in *Understanding Recurrent Neural Networks*.\n\
  \n#### Tokenizing on Bytes\n\nPerhaps the simplest tokenization strategy is to treat\
  \ each byte in a text sequence as an individual token. Similar to character-level\
  \ tokenization strategies, this strategy is great for multilingual contexts. Additionally,\
  \ the size of your vocabulary is fixed to 255. A lot of modern natural language\
  \ algorithms tokenize at the byte level. Another advantage is that tokenization\
  \ is simple—you only need to treat the raw text as a byte-string. Of course, this\
  \ approach has the same shortcomings as tokenizing at the character level. The sequence\
  \ length balloons and presents problems during training and inference.\n\n#### Tokenizing\
  \ on Pieces\n\nModern tokenization algorithms take a probabilistic approach and\
  \ tokenize on pieces of sentences and words. Most modern algorithms employ a strategy\
  \ based on byte-pair encoding (BPE). They typically employ a pretokenization strategy,\
  \ which may utilize one of the naive approaches presented in this chapter, to build\
  \ a frequency map of words or tokens. Then, the algorithm splits each word in the\
  \ frequency map into pieces and extracts the most likely pieces or chunks from the\
  \ frequency maps. You’ll see these more advanced tokenizers in action in Chapter\
  \ 11, *Model Everything with Transformers*.\n\n#### Tokenizing and Vectorizing in\
  \ Elixir\n\nGiven that all of your reviews are in English, it makes sense to tokenize\
  \ on whitespace. If you’re familiar with Elixir’s String module, you know this can\
  \ be accomplished with a simple String.split/2. Before you can go about splitting\
  \ strings, you need to do some text normalization. If you were to split the text\
  \ as is, you would end up with tokens that treat punctuation and casing as significant.\
  \ In some problems, this makes sense. But in this problem, it doesn’t. Notice that\
  \ the following sentences have the same sentiment, regardless of punctuation and\
  \ casing:\n\n``` \n| i didnt like this movie it was so bad nobody should ever watch\
  \ it | \n| I didn't like this movie. It was so bad; nobody should ever watch it.\
  \ | \n``` \n\nIn terms of sentiment, these sentences have identical meanings, and\
  \ you want your model to understand that. If you went about splitting this sentence\
  \ on whitespace, you’d end up with the following tokens:\n\n``` \n| [\"i\", \"didnt\"\
  , \"like\", \"this\", \"movie\", \"it\", \"was\", \"so\", \"bad\", | \n| \"nobody\"\
  , \"should\", \"ever\", \"watch\", \"it\"] | \n``` \n\n``` \n| [\"I\", \"didn't\"\
  , \"like\", \"this\", \"movie.\", \"It\", \"was\", \"so\", \"bad;\", | \n| \"nobody\"\
  , \"should\", \"ever\", \"watch\", \"it.\"] | \n``` \n```\n\nNotice how many of\
  \ the tokens in your sentence, which you know have the same meaning, end up getting\
  \ treated differently by your model. Also, words with different casing get treated\
  \ as different words. To fix these problems, you need to convert every character\
  \ in the sentence to lowercase and remove the punctuation from each review. Fortunately,\
  \ you can do this using String.downcase/1 and String.replace/3:\n\n``` \n| review\
  \ = \"I didn't like this movie.\" | \n| It was so bad; nobody should ever watch\
  \ it.\" | \n| review |> String.downcase() |> String.replace(~r/\\[\\\\p{P}\\\\p{S}\\\
  ]/*, \"\") | \n``` \n\nRunning this code will first downcase all of the characters\
  \ in the given binary and then replace all of the punctuation in the string with\
  \ an empty string, effectively removing it from the sequence. If you inspect the\
  \ output now, you’ll see the following:\n\n``` \n| i didnt like this movie it was\
  \ so bad nobody should ever watch it | \n``` \n\nPunctuation Matters\n\n![images/aside-icons/warning.png]\
  \ English teachers are probably cringing at the assertion that punctuation means\
  \ nothing to a machine learning engineer. You also can probably come up with any\
  \ number of counterexamples where punctuation is significant to the sentiment of\
  \ a piece of text. But in most cases it won’t make a difference. You’re not trying\
  \ to design a model to catch every edge case here; you want something that handles\
  \ only the common case.\n\n\n\n-   [根据你所学的内容，你可以实现一种类似下面的 tokenization 策略：]\n\n\
  | ​  || review |\n| --- | --- |\n| ​  || |> String.downcase() |\n| ​  || |> String.replace(~r/\\\
  [\\\\p{P}\\\\p{S}\\]/,*\"*\") |\n| ​  || |> String.split() |\n\nBut, if you run\
  \ this code, you will end up with only a list of tokens—the individual tokens don’t\
  \ map naturally to entries in a tensor. Instead, you need to apply a vectorization\
  \ strategy. In this context, vectorization is any technique that converts the tokens\
  \ you have into a vector. For example, you can replace each token with a vector\
  \ from a pre-trained word embedding. Word embeddings map tokens to dense vector\
  \ representations and give mathematical meaning to natural language. The quintessential\
  \ example of mathematical relationships in word embeddings is that if you were to\
  \ add the vector representations of the tokens “king” and “girl,” the resulting\
  \ vector would be very close to the vector for the word “queen.”\n\nAnother approach\
  \ is to convert each token to a sparse representation using one-hot encoding or\
  \ as a simple index in a lookup table. The advantage of this approach over a pre-trained\
  \ embedding is that you’re able to learn a smaller specialized vocabulary and embedding.\n\
  \nSo how can you turn your tokens into a sparse representation? All you need to\
  \ do is map each unique token in your input to a unique integer index. But remember\
  \ that one of the drawbacks of your tokenization strategy is that the vocabulary\
  \ can grow incredibly large, so you’ll want to limit the vocabulary to a certain\
  \ size. You can do this by keeping the most frequent tokens in the corpus and discarding\
  \ the rest. You can use the following code to get the frequencies of each token\
  \ in the corpus:\n\n| ​  || frequencies = |\n| --- | --- |\n| ​  || Enum.reduce(train_data,\
  \ %{}, **fn** review, _ -> |\n| ​  || review |\n| ​  || |> String.downcase() |\n\
  | ​  || |> String.replace(~r/\\[\\\\p{P}\\\\p{S}\\]/,*\"*\") |\n| ​  || |> String.split()\
  \ |\n| ​  || |> Enum.reduce(tokens, &Map.update(&2, &1, 1, **fn** x -> x + 1 **end**))\
  \ |\n| ​  || **end**) |\n\nNotice that you tokenize each document and then accumulate\
  \ token counts in a frequency map. If you run this code, you’ll see something like\
  \ this:\n\n| ​  || %{ |\n| --- | --- |\n| ​  || \"diplomaswho\" => 1, |\n| ​  ||\
  \ \"egyptologists\" => 1, |\n| ​  || \"characther\" => 1, |\n| ​  || \"nearlyempty\"\
  \ => 1, |\n| ​  || \"blobs\" => 4, |\n| ​  || \"doubletwist\" => 1, |\n| ​  || \"\
  thingshe\" => 1, |\n| ​  || \"loleralacartelort7890\" => 1, |\n| ​  || \"placebo\"\
  \ => 1, |\n| ​  || \"betterif\" => 1, |\n| ​  || \"smarttalk\" => 1, |\n| ​  ||\
  \ \"sorcererin\" => 1, |\n| ​  || \"celies\" => 6, |\n| ​  || \"tenancier\" => 1,\
  \ |\n| ​  || \"ladies\" => 284, |\n| ​  || ... |\n| ​  || } |\n\nYou can now create\
  \ a vocabulary that only keeps the top tokens in your frequency map by sorting the\
  \ inputs and keeping the top N most frequent tokens:\n\n| ​  || num_tokens = 1024\
  \ |\n| --- | --- |\n| ​  || |\n| ​  || tokens = frequencies |\n| ​  || |> Enum.sort_by(&elem(&1,\
  \ 1), *:desc*) |\n| ​  || |> Enum.take(num_tokens) |\n\nThe number of tokens in\
  \ your vocabulary is arbitrary. This example uses 1024 to limit the size of the\
  \ final model. You still need to map each of the tokens in your vocabulary to a\
  \ unique integer. The value of a single token represents a categorical variable\
  \ without any significance in order or magnitude. In other words, you can assign\
  \ any token to any integer as long as each unique token gets a unique integer. The\
  \ easiest way to do this is to assign the index of each token in the vocabulary\
  \ as its value:\n\n| ​  || tokens = frequencies |\n| --- | --- |\n| ​  || |> Enum.sort_by(&elem(&1,\
  \ 1), *:desc*) |\n| ​  || |> Enum.take(num_tokens) |\n| ​  || |> Enum.with_index(**fn**\
  \ {token, _}, i -> {token, i} **end**) |\n| ​  || |> Map.new() |\n\nYou can combine\
  \ this vocabulary with your tokenization strategy to map each review to a list of\
  \ integers:\n\n| ​  || review = *\"The Departed is Martin Scorsese's best work,\
  \ and anybody who disagrees is wrong. This movie is amazing.\"* |\n| --- | --- |\n\
  | ​  || |\n| ​  || tokenize = **fn** review -> |\n| ​  || review |\n| ​  || |> String.downcase()\
  \ |\n| ​  || |> String.replace(~r/\\[\\\\p{P}\\\\p{S}\\]/,*\"*\") |\n| ​  || |>\
  \ String.split() |\n| ​  || |> Enum.map(&Map.get(tokens, &1)) |\n| ​  || **end**\
  \ |\n| ​  || |\n| ​  || tokenize.(review) |\n\nThis code tokenizes the inputs and\
  \ then looks up each token in the token map you’ve prebuilt. If you run this code,\
  \ you’ll see the following output:\n\n| ​  || [1, nil, 6, nil, nil, 111, 159, 2,\
  \ nil, 36, nil, 6, 361, 10, 18, 6, 465] |\n| --- | --- |\n| ​  || |\n\nBut wait,\
  \ there are a bunch of nil values. You can’t turn this into a tensor.\n\nThe issue,\
  \ here, is by limiting the size of your vocabulary, you’ve created the possibility\
  \ of encountering out-of-vocab (OOV) tokens. This is a common outcome when dealing\
  \ with text and is easily solved by introducing a special value to represent OOV\
  \ tokens. It’s common for these special tokens to occupy the beginning of your vocabulary,\
  \ so you need to slightly adjust your tokens and vectorization strategy:\n\n| ​ \
  \ || review = *\"The Departed is Martin Scorsese's best work, and anybody who disagrees\
  \ is wrong. This movie is amazing.\"* |\n| --- | --- |\n| ​  || |\n| ​  || unknown_token\
  \ = 0 |\n| ​  || |\n| ​  || tokens = frequencies |\n| ​  || |> Enum.sort_by(&elem(&1,\
  \ 1), *:desc*) |\n| ​  || |> Enum.take(num_tokens) |\n| ​  || |> Enum.with_index(**fn**\
  \ {token, _}, i -> {token, i + 1} **end**) |\n| ​  || |> Map.new() |\n| ​  || |\n\
  | ​  || tokenize = **fn** review -> |\n| ​  || review |\n| ​  || |> String.downcase()\
  \ |\n| ​  || |> String.replace(~r/\\[\\\\p{P}\\\\p{S}\\]/,*\"*\") |\n| ​  || |>\
  \ String.split() |\n| ​  || |> Enum.map(&Map.get(tokens, &1, unknown_token)) |\n\
  | ​  || |> Nx.tensor() |\n| ​  || **end** |\n| ​  || |\n| ​  || tokenize.(review)\
  \ |\n\nHere, you shift your vocabulary values to the right by one and provide a\
  \ default value to Map.get/3. You also wrap the final tokenized list into an Nx\
  \ tensor. After running this code, you’ll see this:\n\n| ​  || #Nx.Tensor< |\n|\
  \ --- | --- |\n| ​  || s64[17] |\n| ​  || EXLA.Backend<host:0, 0.2532065982.2520645648.98884>\
  \ |\n| ​  || [1, 0, 6, 0, 0, 114, 160, 2, 0, 36, 0, 6, 358, 10, 17, 6, 472] |\n\
  | ​  || > |\n\nPerfect! Now you can create an input pipeline that you can pass to\
  \ Axon for training a model. To implement your input pipeline, copy the following\
  \ code:\n\n| ​  || batch_size = 64 |\n| --- | --- |\n| ​  || |\n| ​  || train_pipeline\
  \ = |\n| ​  || train_data |\n| ​  || |> Stream.map(**fn** {review, label} -> |\n\
  | ​  || {tokenize.(review), Nx.tensor(label)} |\n| ​  || **end**) |\n| ​  || |>\
  \ Stream.chunk_every(batch_size, batch_size, *:discard*) |\n| ​  || |> Stream.map(**fn**\
  \ reviews_and_labels -> |\n| ​  || {review, label} = Enum.unzip(reviews_and_labels)\
  \ |\n| ​  || {Nx.stack(review), Nx.stack(label) |> Nx.new_axis(-1)} |\n| ​  || **end**)\
  \ |\n| ​  || |\n| ​  || test_pipeline = |\n| ​  || test_data |\n| ​  || |> Stream.map(**fn**\
  \ {review, label} -> |\n| ​  || {tokenize.(review), Nx.tensor(label)} |\n| ​  ||\
  \ **end**) |\n| ​  || |> Stream.chunk_every(batch_size, batch_size, *:discard*)\
  \ |\n| ​  || |> Stream.map(**fn** reviews_and_labels -> |\n| ​  || {review, label}\
  \ = Enum.unzip(reviews_and_labels) |\n| ​  || {Nx.stack(review), Nx.stack(label)\
  \ |> Nx.new_axis(-1)} |\n| ​  || **end**) |\n| ​  || |\n\nThis code should feel\
  \ similar to your input pipeline from the past few chapters. First, you zip reviews\
  \ and sentiments, and then you do some preprocessing to convert reviews and sentiments\
  \ to tensors. Next, you chunk adjacent entries in the Stream and stack them together\
  \ to create batches of sequence and sentiment pairs. Now, you can run the following\
  \ code to grab one batch from your input stream:\n\n\n\n\n| | 取出训练管道中的第一个元素 | |\n\
  | --- | --- | --- |\n| --- | --- | --- |\n| | (ArgumentError) 在连接轴 0 时，维度不匹配，得到\
  \ 127 和 304 | |\n| --- | --- | --- |\n| | 正在在轴 0 上连接 | |\n| 发生了什么？  | 如果你在处理不同的评论时进行实验，你可能注意到每条评论的输入长度各不相同。\
  \ 调用 Nx.stack/1 会导致所谓的 ragged tensor（一个在给定维度中，不同条目具有非统一大小的张量）。 这个问题在处理序列时经常出现，因为序列通常具有可变的输入长度。\
  \ |\n| 你在处理图像时遇到过类似的问题，这很容易通过将图像调整到统一形状来解决。 在图像的上下文中，调整形状稍微自然一些，因为你可以下采样、上采样、裁剪或填充输入图像，而这不会显著改变原始图像的内容。\
  \ 序列则更难处理，因为截断序列可能会丢失大量原始序列的意义，所以需要谨慎选择合适的序列长度。 |\n| 有些框架支持处理 ragged tensors，但 Nx\
  \ 要求静态形状，不支持 ragged tensors，因此你需要一个策略来将所有输入评论转换为统一形状。 将所有输入评论转换为统一形状的最常用方法是填充或截断每个序列到固定长度。\
  \ 填充通常通过引入填充 token（另一个词汇表中的特殊 token）来实现，并在每个序列后面添加所需的填充 token 数量，以达到期望的序列长度。 |\n\
  | **填充输入序列** |\n| 要引入填充，你需要修改原始的 tokenization 代码： |\n| | pad_token = 0 | |\n| ---\
  \ | --- | --- |\n| | unknown_token = 1 | |\n| | | |\n| | max_seq_len = 64 | |\n\
  | | | |\n| | tokens = | |\n| | frequencies | |\n| | |> Enum.sort_by(&elem(&1, 1),\
  \ *:desc*) | |\n| | |> Enum.take(num_tokens) | |\n| | |> Enum.with_index(**fn**\
  \ {token, _}, i -> {token, i + 2} **end**) | |\n| | |> Map.new() | |\n| | | |\n\
  | | tokenize = **fn** review -> | |\n| | review | |\n| | |> String.downcase() |\
  \ |\n| | |> String.replace(*~r/\\[\\\\p{P}\\\\p{S}\\]/*​, *\"*​​*\"*​) | |\n| |\
  \ |> String.split() | |\n| | |> Enum.map(&Map.get(tokens, &1, unknown_token)) |\
  \ |\n| | |> Nx.tensor() | |\n| | |> then(&Nx.pad(&1, pad_token, \\[{0, max_seq_len\
  \ - Nx.size(&1), 0}\\])) | |\n| | **end** | |\n| 在这段代码中，请注意添加填充 token 以及如何将每个 token\
  \ 索引向右移动一位。但真正的魔法发生在这行代码中： |\n| | |> then(&Nx.pad(&1, pad_token, \\[{0, max_seq_len\
  \ - Nx.size(&1), 0}\\])) | |\n| | --- | --- |\n| 这行代码在序列末尾使用 pad_token 对序列进行填充。\
  \ 填充的数量由 max_seq_len - Nx.size(sequence) 决定，这意味着它会在原始输入序列长度不足 max_seq_len 时添加足够的填充，使序列长度达到\
  \ max_seq_len。 你可能会想知道，如果原始输入序列的长度大于 max_seq_len，会发生什么情况。 在这种情况下，序列末尾的填充会是负数，Nx.pad/3\
  \ 的语义规定，输入张量会被负填充的数量裁剪（即截断）。 这一行代码的作用是无论输入大小如何，都能将序列填充或截断到固定长度。 |\n| 通过引入填充，你可以重新实现并运行你的训练管道：\
  \ |\n| | batch_size = 64 | |\n| --- | --- | --- |\n| | | |\n| | train_pipeline =\
  \ | |\n| | train_data | |\n| | |> Stream.map(**fn** {review, label} -> | |\n| |\
  \ | {tokenize.(review), Nx.tensor(label)} | |\n| | | **end**) | |\n| | |> Stream.chunk_every(batch_size,\
  \ batch_size, *:discard*) | |\n| | |> Stream.map(**fn** reviews_and_labels -> |\
  \ |\n| | | {review, label} = Enum.unzip(reviews_and_labels) | |\n| | | {Nx.stack(review),\
  \ Nx.stack(label) |> Nx.new_axis(-1)} | |\n| | | **end**) | |\n| | | |\n| | test_pipeline\
  \ = | |\n| | test_data | |\n| | |> Stream.map(**fn** {review, label} -> | |\n| |\
  \ | {tokenize.(review), Nx.tensor(label)} | |\n| | | **end**) | |\n| | |> Stream.chunk_every(batch_size,\
  \ batch_size, *:discard*) | |\n| | |> Stream.map(**fn** reviews_and_labels -> |\
  \ |\n| | | {review, label} = Enum.unzip(reviews_and_labels) | |\n| | | {Nx.stack(review),\
  \ Nx.stack(label) |> Nx.new_axis(-1)} | |\n| | | **end**) | |\n| | | |\n| | Enum.take(train_pipeline,\
  \ 1) | |\n| 你可以看到，你已经成功构建了一个用简单的 tokenization 和 vectorization 策略处理变长序列的输入管道。 现在，你只需要一个模型来进行训练。\
  \ |\n| **尝试使用 MLP 进行阅读** |\n| 在深入研究循环神经网络等复杂的序列处理领域之前，你应该先从简单的前馈神经网络开始： |\n| | model\
  \ = | |\n| --- | --- | --- |\n| | Axon.input(*\"review\"*) | |\n| | |> Axon.embedding(num_tokens\
  \ + 2, 64) | |\n| | |> Axon.flatten() | |\n| | |> Axon.dense(64, *activation:* *:relu*)\
  \ | |\n| | |> Axon.dense(1) | |\n| 这里唯一不熟悉的层是 Axon.embedding/3。 该层接收像你每个序列中拥有的那样的稀疏\
  \ token 集合，并将它们映射到稠密向量表示。 嵌入操作是一个相对简单的查找，如下图所示： |\n| ![images/UnderstandingText/EmbeddingOp.png](img/EmbeddingOp.png)\
  \ |\n| 嵌入会学习文本在你的数据集中的稠密向量表示。 嵌入之后，你会得到一个序列的向量或三维输入，因此需要在将嵌入矩阵传递给下一个全连接层之前先将其展平。\
  \ 由于你的目标是预测二元标签，输出层是一个包含一个输出单元的全连接层。 |\n| 你可以通过以下代码将模型视为表格来进行检查： |\n| | input_template\
  \ = Nx.template({64, 64}, *:s64*​) | |\n| --- | --- | --- |\n| | Axon.Display.as_graph(model,\
  \ input_template) | |\n| 如果你运行上述代码，你将看到： |\n| ![images/UnderstandingText/MLPModel.png](img/MLPModel.png)\
  \ |\n| 现在，你可以使用 Axon.Loop API 来训练你的模型。 复制并运行以下代码，实现使用你的模型和输入管道的受监督训练循环： |\n| | loss\
  \ = &Axon.Losses.binary_cross_entropy(&1, &2, | |\n| --- | --- | --- |\n| | *from_logits:*\
  \ true, | |\n| | *reduction:* *:mean*​ | |\n| | ) | |\n| | optimizer = Axon.Optimizers.adam(1.0e-4)\
  \ | |\n| | | |\n| | trained_model_state = | |\n| | model | |\n| | |> Axon.Loop.trainer(loss,\
  \ optimizer) | |\n| | |> Axon.Loop.metric(*:accuracy*​) | |\n| | |> Axon.Loop.run(train_pipeline,\
  \ %{}, *epochs:* 10, *compiler:* EXLA) | |\n\n\n\n在这段示例中，你传入的是 `Axon.Losses.binary_cross_entropy/3`\
  \ 的参数化形式。你之前使用过二元交叉熵，因此需要指定 `from_logits: true`。你可能已经注意到，你的输出 dense 层没有激活函数。以前，在二元分类问题中，你使用了\
  \ sigmoid 激活函数，以确保层输出的概率在 0 到 1 之间。在此实例中，你的输出层将学习输出 logits 或 log‑probabilities。这一措施本质上仅表示\
  \ `log(p)`，其中 `p` 为输出概率。\n\n在训练时，是否使用 logits 通常没有差别。某些 loss 实现使用输出 logits 会比使用概率更稳定，但\
  \ Axon 的实现采用一种优化方式，始终利用稳定路径，因此是否使用 logits 更多是个人偏好。\n\n训练完成后，你将看到以下输出：\n\n| || Epoch:\
  \ 0, Batch: 350, accuracy: 0.5002229 loss: 0.6860522 |\n| --- |\n| || Epoch: 1,\
  \ Batch: 350, accuracy: 0.6894144 loss: 0.6168785 |\n| you: 2, Batch: 350, accuracy:\
  \ 0.7786677 loss: 0.5573396 |\n| || Epoch: 3, Batch: 350, accuracy: 0.8037750 loss:\
  \ 0.5174768 |\n| || Epoch: 4, Batch: 350, accuracy: 0.8238515 loss: 0.4877387 |\n\
  | || Epoch: 5, Batch: 350, accuracy: 0.8453078 loss: 0.4631703 |\n| || Epoch: 6,\
  \ Batch: 350, accuracy: 0.8648504 loss: 0.4411991 |\n| || Epoch: 7, Batch: 350,\
  \ accuracy: 0.8850605 loss: 0.4204423 |\n| || Epoch: 8, Batch: 350, accuracy: 0.9082086\
  \ loss: 0.4002065 |\n| || Epoch: 9, Batch: 350, accuracy: 0.9299769 loss: 0.3802384\
  \ |\n\n总体而言，你的模型表现尚可，但在实现超过 90% 的训练准确率方面仍有不足。你可以通过运行以下代码查看该结果在测试集上的表现：\n\n| || model\
  \ |\n| --- |\n| |> Axon.Loop.evaluator() |\n| |> Axon.Loop.metric(*:accuracy*​)\
  \ |\n| |> Axon.Loop.run(test_pipeline, trained_model_state, *compiler:* EXLA) |\n\
  \n运行代码后，你将看到：\n\n| || Batch: 30, accuracy: 0.7676411 |\n| --- |\n| 总体而言，你的模型在测试集上实现了\
  \ 76% 的准确率。这不算差，但如果使用专门用于处理序列的模型，你可以进一步提升。进入循环神经网络（RNN）。 |\n\n## 介绍循环神经网络（Recurrent\
  \ Neural Networks）\n\n你可能会好奇，为什么单独的前馈网络并不适合处理序列数据。原因在于前馈网络没有任何方式来考虑时间依赖性。\n\n时间依赖性即对时间维度的依赖。在处理序列时，常把序列中的每个元素称为一个时间步（timestep），哪怕它并不真正对应时间。时间依赖意味着未来的事件依赖于过去或当前的事件。以自然语言为例，这很容易理解。\n\
  \n在自然语言的单词序列中，顺序至关重要。句子中词语的顺序会极大改变句子的含义。前馈网络无法捕捉这一点——它只能根据某些关键词的出现来判断情感，而不考虑这些词在句子中的位置。虽然这种策略并非完全无效，但它无法捕捉句子中词语之间的复杂顺序关系。例如，考虑下面这段评论：\n\
  \n| || This movie was awfully good. I hated everything about it (not). |\n| ---\
  \ |\n\n这段评论利用了英语中的一些语言技巧，普通母语者能轻松理解，但可能会误导那些缺乏 temporal 关系建模的天真情感分析模型。首先，“awfully\
  \ good”是一个矛盾修辞（oxymoron）。此外，第二句使用了讽刺式的 “not” 笑话。人类能明白这是一条正面的评论，但一个不考虑序列中词语位置的模型会难以正确分类这一序列。你的模型需要理解修饰词的意义，而如果不考虑它们的位置，就会难以正确分类此例。\n\
  \n正是在这里，循环神经网络（RNN）发挥作用。循环神经网络是能够对序列数据进行变换的神经网络，它们维护一个内部状态或记忆体，根据前序输入修改输出。循环一词来源于\
  \ RNN 实现的递归关系——在时间步 t，RNN 的输出取决于序列中所有在 t 之前的输入。\n\nRNN 是专门为序列设计的。正如第 3 章 ​*Harness\
  \ the Power of Math*​ 所述，某些模型之所以强大，往往是因为它们对输入结构的假设。正如卷积神经网络（CNN）适合网格状输入结构，RNN 适合序列结构。输入结构的假设使得\
  \ CNN 与 RNN 在特定类别的输入上表现显著更好。相反，前馈网络更像万能刀具——它是通用的函数逼近器，但对输入结构没有显著假设，可能在某些数据上学习困难。\n\
  \n学术界有许多种类的 RNN，但本书主要介绍两种最常见的：长短期记忆（LSTM）和门控循环单元（GRU）。这两者都是 RNN 的变体，能够克服基础或简易 RNN\
  \ 的局限性。Axon 提供即插即用的 LSTM 与 GRU 实现，你可以轻松将它们集成到自己的神经网络中。\n\n为了观察 Axon 的 RNN 实现，你将从零开始构建一个模型并了解每个输出的含义。首先，创建一个表示电影评论输入序列的\
  \ Axon 输入：\n\n| || sequence = `Axon.input(*\"*\"* review*\"*\") |\n| --- |\n\n每个输入序列的形状为\
  \ `{batch_size, sequence_length}`，序列中的每个元素是从词表中抽取的整数 token。在前馈网络中，你将这些稀疏表示转换为稠密向量，使用嵌入层。Axon\
  \ 的 RNN 实现同样需要嵌入输入，但不需要将其展平，因为 RNN 设计用于处理整个序列。因此，你需要添加一个嵌入层：\n\n| || embedded =\
  \ `sequence` |> `Axon.embedding(num_tokens + 2, 64)` |\n\n此时，你的网络形状为 `{batch_size,\
  \ sequence_length, 64}`，即每个 token 对应一个长度为 64 的向量表示。接下来，你需要使用 `Axon.mask/2` 创建一个掩码张量：\n\
  \n| || mask = `Axon.mask(sequence, 0)` |\n\n`Axon.mask/2` 用于让模型忽略特定的 token，常用于忽略填充（padding）\
  \ token，防止它们对模型输出产生影响。由于在输入管道中需要对序列进行填充以保持相同长度，前馈网络会受到这些 padding token 的干扰。通过 `Axon.mask/2`\
  \ 完全忽略这些 token，可以帮助网络更稳健。\n\n现在，有了嵌入序列和掩码，你可以使用 `Axon.lstm/3` 添加一个 LSTM 层：\n\n|\
  \ || {rnn_sequence, _state} = `Axon.lstm(embedded, 64, *mask:* mask, *unroll:* *static*)\
  \ |\n| --- |\n\n\n\n\nRNN 的输出形式与您之前遇到的任何层都不同。这是因为 RNN 与您之前看到的其他层不同。RNN 会维护来自序列中之前条目（历史）的状态，这会影响未来的输出。RNN\
  \ 执行的操作在功能编程中有时被称为“扫描”（scan）。该操作类似于 Elixir 的 `Enum.map_reduce` 操作。`Enum.map_reduce`\
  \ 执行一个 map 操作，它会转换 Enumerable 中的值，同时累积并最终返回最终状态。\n\n前一个元组中的状态输出代表 LSTM 的最终“记忆”。`rnn_sequence`\
  \ 变量是通过在整个输入序列上使用累积状态对循环操作进行映射后得到的转换序列。此时，`rnn_sequence` 的形状为 `{batch_size, sequence_length,\
  \ 64}`。也就是说，`rnn_sequence` 将您的嵌入式 token 序列转换为另一个嵌入式 token 序列。那么，这有什么大不了的？\n\n考虑一下：您的嵌入层仅查找与每个单独\
  \ token 关联的向量。它不考虑相邻的 token。但您的循环神经网络（RNN）维护一个内部状态，这意味着它可以考虑输入中之前的 token。到达序列的最后一个\
  \ token 时，您的 RNN 可以将其转换，从而编码整个输入序列的信息。为了更好地理解这一点，可以考虑一个更简单的问题。您有一个字符串列表，想要修改该列表，使得列表中的每个条目对应于在列表中到该点为止该特定字符串出现的次数。例如，以下神奇词和输入列表：\n\
  \n| ​  || magic_word = \"sixers\" |\n| --- | --- |\n| ​  || input = [\"rockets\"\
  , \"mavericks\", \"sixers\", \"sixers\", \"magic\", \"nets\", \"sixers\"] |\n\n\
  输出应该是：\n\n| ​  || [0, 0, 1, 2, 2, 2, 3] |\n| --- | --- |\n\n那么，如何在 Elixir 中解决这个问题？最简单的方法是使用\
  \ `Enum.map_reduce`：\n\n| ​  || {output, _} = Enum.map_reduce(input, 0, fn entry,\
  \ count -> |\n| --- | --- |\n| ​  || if entry == magic_word do |\n| ​  || {count\
  \ + 1, count + 1} |\n| ​  || else |\n| ​  || {count, count} |\n| ​  || end |\n|\
  \ ​  || end) |\n\n在某种程度上，这正是您的 RNN 所做的事。输出序列的最后一个 token 编码了前面所有 token 的信息。但与计数特定\
  \ token 的出现次数不同，您的 RNN 学习输出一个对后续层有用的有意义的表示。\n\n这意味着要使用 `rnn_sequence`，您需要从转换后的序列中提取最后一个\
  \ token。可以使用 `Axon.nx/3` 实现：\n\n| ​  || final_token = Axon.nx(rnn_sequence, fn seq\
  \ -> |\n| --- | --- |\n| ​  || Nx.squeeze(seq[[-1//1, -1, 0//1]]) |\n| ​  || end)\
  \ |\n\n`Axon.nx/3` 允许您利用 `Nx` 的通用函数作为 `Axon` 层。在此代码中，您使用 `Nx.slice_along_axis/4`\
  \ 从时间轴（axis 1）的索引 `max_seq_len - 1` 处获取最后一个 token。此时，您应该拥有对输入序列的良好表示。与卷积神经网络（CNN）一样，循环神经网络（RNN）通常会随后跟一个专门用于解决您所面对的任务的全连接（fully-connected）头。换句话说，您使用循环神经网络来提取特征，而全连接部分用于基于这些特征进行推理：\n\
  \n| ​  || model = |\n| --- | --- |\n| ​  || final_token |\n| ​  || |> Axon.dense(64,\
  \ *activation:* :relu) |\n| ​  || |> Axon.dense(1) |\n\n请记住，最终 token 包含整个序列的提取表示，因此它在下游任务（如分类）中理论上是有用的。\n\
  \n整体而言，您的最终模型如下：\n\n| ​  || input_template = Nx.template({64, 64}, :s64) |\n| ---\
  \ | --- |\n| ​  || Axon.Display.as_graph(model, input_template) |\n\n您会在 这里 看到模型：\n\
  \n![images/UnderstandingText/RNNModel.png](img/RNNModel.png)\n\n此时，您已拥有模型和输入管道，可以开始实现训练循环。即使您使用的是新架构，也不必担心调整训练循环。事实上，您可以直接复制\
  \ MLP 情感分析模型的训练循环：\n\n| ​  || loss = &Axon.Losses.binary_cross_entropy(&1, &2, |\n\
  | --- | --- |\n| ​  || *from_logits:* true, |\n| ​  || *reduction:* :mean |\n| ​ \
  \ || ) |\n| ​  || optimizer = Axon.Optimizers.adam(1.0e-4) |\n| ​  || |\n| ​  ||\
  \ trained_model_state = |\n| ​  || model |\n| ​  || |> Axon.Loop.trainer(loss, optimizer)\
  \ |\n| ​  || |> Axon.Loop.metric(:accuracy) |\n| ​  || |> Axon.Loop.run(train_pipeline,\
  \ %{}, *epochs:* 10, *compiler:* EXLA) |\n\n运行代码后，您将看到以下输出：\n\n| ​  || Epoch: 0,\
  \ Batch: 358, accuracy: 0.5121433 loss: 0.6840463 |\n| --- | --- |\n| ​  || Epoch:\
  \ 1, Batch: 358, accuracy: 0.7060410 loss: 0.6094189 |\n| ​  || Epoch: 2, Batch:\
  \ 358, accuracy: 0.7469098 loss: 0.5683411 |\n| ​  || Epoch: 3, Batch: 358, accuracy:\
  \ 0.7578339 loss: 0.5442138 |\n| ​  || Epoch: 4, Batch: 358, accuracy: 0.7610549\
  \ loss: 0.5284106 |\n| ​  || Epoch: 5, Batch: 358, accuracy: 0.7636232 loss: 0.5172608\
  \ |\n| ​  || Epoch: 6, Batch: 358, accuracy: 0.7654946 loss: 0.5089468 |\n| ​  ||\
  \ Epoch: 7, Batch: 358, accuracy: 0.7667568 loss: 0.5024669 |\n| ​  || Epoch: 8,\
  \ Batch: 358, accuracy: 0.7686281 loss: 0.4972335 |\n| ​  || Epoch: 9, Batch: 358,\
  \ accuracy: 0.7695855 loss: 0.4928872 |\n\n这比简单的前馈模型有了明显的改进。现在，只需复制并运行 MLP 模型中的评估代码：\n\
  \n| ​  || model |\n| --- | --- |\n| --- | --- |\n| ​  || |> Axon.Loop.evaluator()\
  \ |\n| ​  || |> Axon.Loop.metric(:accuracy) |\n| ​  || |> Axon.Loop.run(test_pipeline,\
  \ trained_model_state, *compiler:* EXLA) |\n\n运行后，您将看到：\n\n| ​  || Batch: 30, accuracy:\
  \ 0.7510081 |\n| --- | --- |\n\n总体而言，您成功使用循环神经网络改进了情感分析模型。您的最终模型性能良好，但正如您所知，总是可以做得更好。\n\
  \n### 双向发展\n\n当前实现使用的是简单的 LSTM。正如您所知，LSTM 通过在时间轴上向前传播（积累历史）来提取输入序列的表示。直观地，这很合理。人类通常是从前向后理解序列的，因此自然会在神经网络中强制这种约束。但神经网络不是人类，可以从那些看似不自然的修改中显著受益。一个例子是双向循环神经网络（bidirectional\
  \ RNN）。\n\n双向 RNN 使用与传统 RNN 相同的技术，但方向相反。您的前一个神经网络仅在时间轴上单向（向前）展开。双向 RNN 则在时间轴上双向展开（向前和向后）。这可能看起来不太合理。毕竟，逆转一条影评并不会增加您的理解。它如何能帮助神经网络？\n\
  \n\n\n\n-   [双向转换为那些没有明确因果关系的序列提供了循环神经网络的额外上下文信息。它们在正向和逆向两个方向学习序列关系，因此在本质上更具鲁棒性。需要注意的是，双向\
  \ RNN 并不对所有序列数据都有效。例如，你不应该在模型中使用双向 RNN 处理时间序列数据，因为你正在尝试建模一种明确的因果关系。对于文本，双向处理可以帮助提升模型的泛化能力。\n\
  \n双向 RNN 从零开始实现非常直接，使用 Axon API 即可实现。下面是一个从零开始实现的双向 LSTM：\n\n```\n| ​  || backward_sequence\
  \ = Axon.nx(forward_sequence, &Nx.reverse(&1, *axes:*) \\[1\\]) |\n| --- | --- |\n\
  | ​  ||  |\n| ​  || {forward_state, forward_out} = Axon.lstm(forward_sequence, 64)\
  \ |\n| ​  || {backward_state, backward_out} = Axon.lstm(backward_sequence, 64) |\n\
  | ​  ||  |\n| ​  || out_state = Axon.concatenate( |\n| ​  || forward_state, |\n\
  | ​  || Axon.nx(backward_state, &Nx.reverse(&1, *axes:*) \\[1\\]) |\n| ​  || ) |\n\
  | ​  || out_sequence = Axon.concatenate( |\n| ​  || forward_out, |\n| ​  || Axon.nx(backward_out,\
  \ &Nx.reverse(&1, *axes:*) \\[1\\]) |\n| ​  || ) |\n```\n\n请注意，你只需要反转输入序列并分别在两个方向上应用\
  \ LSTM 转换。然后，你将得到的状态和序列合并，以获得最终的输出状态和序列。你也可以选择其他操作，例如 `Axon.add/2` 来合并前向和逆向的输出，但连接（concatenation）是最常用的。这里的含义是，如果你想要一个包含\
  \ 64 个单元的双向 LSTM，那么由于连接，你的输出序列将会有 128 个单元。\n\nAxon API 提供了 `Axon.bidirectional/3`\
  \ 的便利功能，用于处理双向 RNN。使用它，你可以重新实现前面章节中的 RNN：\n\n```\n| ​  || sequence = Axon.input(*\"\
  *​​*​review\"*​) |\n| --- | --- |\n| ​  || mask = Axon.mask(sequence, 0) |\n| ​ \
  \ || embedded = Axon.embedding(sequence, num_tokens + 2, 64) |\n| ​  ||  |\n| ​ \
  \ || {rnn_sequence, _state} = |\n| ​  || Axon.bidirectional( |\n| ​  || embedded,\
  \ |\n| ​  || &Axon.lstm(&1, 64, *mask:* mask, *unroll:* :static), |\n| ​  || &Axon.concatenate/2\
  \ |\n| ​  || ) |\n| ​  ||  |\n| ​  || final_token = Axon.nx(rnn_sequence, fn seq\
  \ -> |\n| ​  || Nx.squeeze(seq\\[\\[0..-1//1, -1, 0..-1//1\\]\\]) |\n| ​  || ​end​)\
  \ |\n| ​  ||  |\n| ​  || model = |\n| ​  || final_token |\n| ​  || |> Axon.dense(64,\
  \ *activation:* :relu) |\n| ​  || |> Axon.dense(1) |\n```\n\n现在，你可以使用以下代码运行原始训练循环，使用这个新模型：\n\
  \n```\n| ​  || loss = &Axon.Losses.binary_cross_entropy(&1, &2, |\n| --- | --- |\n\
  | ​  || *from_logits:* true, |\n| ​  || *reduction:* :mean |\n| ​  || ) |\n| ​ \
  \ || optimizer = Axon.Optimizers.adam(1.0e-4) |\n| ​  || trained_model_state = |\n\
  | --- | --- |\n| ​  || model |\n| ​  || |> Axon.Loop.trainer(loss, optimizer) |\n\
  | ​  || |> Axon.Loop.metric(:accuracy) |\n| ​  || |> Axon.Loop.run(train_pipeline,\
  \ %{}, *epochs:* 10, *compiler:* EXLA) |\n```\n\n运行代码后，你会看到：\n\n```\n| ​  || Epoch:\
  \ 0, Batch: 350, accuracy: 0.5190082 loss: 0.6815987 |\n| --- | --- |\n| ​  || Epoch:\
  \ 1, Batch: 341, accuracy: 0.7035355 loss: 0.6067376 |\n| ​  || Epoch: 2, Batch:\
  \ 332, accuracy: 0.7509853 loss: 0.5645106 |\n| ​  || Epoch: 3, Batch: 323, accuracy:\
  \ 0.7610434 loss: 0.5400541 |\n| ​  || Epoch: 4, Batch: 314, accuracy: 0.7647320\
  \ loss: 0.5240928 |\n| ​  || Epoch: 5, Batch: 355, accuracy: 0.7672051 loss: 0.5114447\
  \ |\n| ​  || Epoch: 6, Batch: 346, accuracy: 0.7690023 loss: 0.5031880 |\n| ​  ||\
  \ Epoch: 7, Batch: 337, accuracy: 0.7696466 loss: 0.4966677 |\n| ​  || Epoch: 8,\
  \ Batch: 328, accuracy: 0.7717992 loss: 0.4912724 |\n| ​  || Epoch: 9, Batch: 319,\
  \ accuracy: 0.7726074 loss: 0.4866871 |\n```\n\n你会注意到模型的表现略有提升，但训练时间稍长，这很合理，因为你在网络中添加了一个双向\
  \ LSTM 层。现在，你可以使用以下代码测试你的模型：\n\n```\n| ​  || model |\n| --- | --- |\n| ​  || |>\
  \ Axon.Loop.evaluator() |\n| ​  || |> Axon.Loop.metric(:accuracy) |\n| ​  || |>\
  \ Axon.Loop.run(test_pipeline, trained_model_state, *compiler:* EXLA) |\n```\n\n\
  你会看到：\n\n```\n| ​  || Batch: 30, accuracy: 0.7641129 |\n| --- | --- |\n```\n\n通过简单的双向转换，你从模型中获得了一些额外的准确率提升。此时，你已经对如何在\
  \ Axon 中实现循环神经网络有了相当扎实的理解，接下来需要了解循环神经网络内部是如何工作的。在下一节中，你将深入探讨循环神经网络的实际运作机制，并讨论它们的优势和劣势。\n\
  \n\n\nThe scalability issues and computational complexity of recurrent neural networks\
  \ are part of the reason they’ve fallen out of favor in recent years. RNNs operate\
  \ in an inherently sequential manner—this is part of what makes them so powerful.\
  \ But it also makes them inefficient. You can only vectorize/parallelize RNNs along\
  \ the batch dimension.\n\n## Wrapping Up\n\nIn this chapter, you were introduced\
  \ to natural language processing with recurrent neural networks. You learned how\
  \ to implement some basic text featurization and preprocessing with Elixir and how\
  \ to implement and train recurrent neural networks in Axon. You also learned about\
  \ some of the intuition behind recurrent neural networks and some of the fundamental\
  \ shortcomings of recurrent neural networks, which have allowed them to be usurped\
  \ by transformer models.\n\nIf you’re familiar with the current state of natural\
  \ language processing, you might have questioned the need to cover recurrent neural\
  \ networks at all. However, to better understand the current state of the art, it’s\
  \ important to understand the previous state of the art—and why it ended up failing.\
  \ While recurrent neural networks are no longer common in natural language processing,\
  \ they still have some practical use in certain domains. Additionally, understanding\
  \ how RNNs work and where they fail is important to better understand the rise of\
  \ transformers.\n\nBefore completely closing the door on RNNs in favor of transformers,\
  \ you’ll explore one additional application of RNNs known as time-series data. In\
  \ the next chapter, you’ll dive deep into time-series analysis with neural networks.\n\
  \n#### Footnotes\n\n[\\[31\\]](#f_0061.xhtml#FNPTR-31)\n\n: \n\n[`www.kaggle.com/datasets/lakshmi25npathi/imdb-dataset-of-50k-movie-reviews`](https://www.kaggle.com/datasets/lakshmi25npathi/imdb-dataset-of-50k-movie-reviews)\n\
  \nCopyright © 2024, The Pragmatic Bookshelf.\n\n# Chapter 10  \n\nForecast the Future\n\
  \nIn the previous chapter, you were introduced to the concept of recurrent neural\
  \ networks for learning on sequential data. Specifically, you created and trained\
  \ recurrent neural networks on text data using Elixir and Axon. You saw how recurrent\
  \ neural networks are capable of learning relationships in natural language far\
  \ easier than traditional feed-forward networks due to their built-in memory and\
  \ inherent sequential operation.\n\nRecurrent neural networks are well-suited for\
  \ processing text. However, that’s not the only thing they’re good for. Anything\
  \ with a temporal nature presents challenges for traditional feed-forward networks\
  \ and is better suited for recurrent neural networks. One example of such data is\
  \ time-series data. Time-series data is any collection of data indexed in time order.\
  \ At each timestep, there are one or many observations. You can see how time-series\
  \ data lends itself naturally to working with recurrent neural networks.\n\nIn this\
  \ chapter, you’ll work with time-series data in Elixir, Nx, and Axon. You’ll learn\
  \ about some of the challenges of working with time-series data and a bit about\
  \ why neural networks struggle so much with this data compared to other approaches.\
  \ You’ll also train both a convolutional and recurrent neural network on a time-series\
  \ analysis problem, comparing the results and learning the benefits and drawbacks\
  \ of each strategy.\n\n## Predicting Stock Prices\n\nPerhaps one of the most obvious\
  \ applications of time-series analysis is forecasting the direction of markets.\
  \ Given enough historical data, you should be able to predict the future performance\
  \ of a given equity or market, right? As you’ll find out later in this chapter,\
  \ the problem of forecasting markets is exceptionally difficult. If it were as easy\
  \ as throwing a neural network at the problem, everybody would be doing it. Despite\
  \ the challenges, attempting to forecast stock prices is a good exercise in time-series\
  \ analysis and a good demonstration of the pitfalls of putting too much faith in\
  \ a model.\n\nIn this example, you’ll be working with the historical stock data\
  \ for 30 companies in the Dow Jones Industrial Average between 2006 and 2018. The\
  \ data is available for download on Kaggle.^([\\[32\\]](#f_0070.xhtml#FOOTNOTE-32))\
  \ After you download the data, you’ll see a collection of CSVs that contain information\
  \ for the prices of individual stocks and for all of the stocks. To simplify the\
  \ problem, you’ll create a model that predicts the future stock prices for a single\
  \ stock, in this case, AAPL.\n\nStart by firing up a new Livebook and adding the\
  \ following dependencies:\n\n| ​  || Mix.install(​ | \n| --- | \n| ​  || {​*:explorer*​,\
  \ ​*\"*​​*~> 0.5.0\"*​}, | \n| ​  || {​*:nx*​, ​*\"*​​*~> 0.6\"*​}, | \n| ​  ||\
  \ {​*:exla*​, ​*\"*​​*~> 0.6\"*​}, | \n| ​  || {​*:axon*​, ​*\"*​​*~> 0.5\"*​},\
  \ | \n| ​  || {​*:vega_lite*​, ​*\"*​​*~> 0.1.6\"*​}, | \n| ​  || {​*:kino*​, ​*\"\
  *​​*~> 0.8.0\"*​}, | \n| ​  || {​*:kino_vega_lite*​, ​*\"*​​*~> 0.1.7\"*​} | \n\
