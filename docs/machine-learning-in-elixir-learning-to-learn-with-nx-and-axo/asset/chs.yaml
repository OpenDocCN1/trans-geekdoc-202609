  \ |\n\n\n\n在添加卷积基的命名空间的同时，你还需要冻结卷积基。使用预训练模型时，通常会冻结或停止训练模型的预训练部分，以避免在训练早期出现灾难性遗忘。换句话说，预训练模型在训练初期保持完全静态，因此不会丢失其已习得的知识。训练初期通常是最不稳定的阶段，这意味着你的预训练模型面临丢失部分价值的风险。\n\
  \n冻结层会让 Axon 为层的参数包裹 `stop_grad`。这意味着在梯度下降更新模型时，冻结参数的梯度为 0，因此不会被更新。在 Axon 中，冻结是相对于模型而非训练循环或参数进行的。你可以使用\
  \ `Axon.freeze/2` 函数标记某些层为冻结。默认情况下，`Axon.freeze/2` 会冻结所有后续层，但它提供了更细粒度冻结的 API。对于本例，你可以这样冻结卷积基：\n\
  \n``` \n| ​  || cnn_base = cnn_base |> Axon.freeze() \n``` \n\n| --- | --- |\n\n\
  现在，你拥有了一个带有可识别命名空间的冻结、预训练的卷积基。此时模型的输出形状为 `{batch_size, 1280, 1, 1}`，因此在传递到分类头之前需要将特征展平。你可以使用\
  \ `Axon.flatten/2` 来展平特征，或者使用全局池化层。由于该模型的输出特征数量相对较大，全局池化层更合适，因为它能减少传递给分类头的输入特征数量。此外，在全局平均池化层和分类头之间添加一个脱落层（dropout\
  \ layer）以增加正则化。对于二分类问题，你的分类头需要一个单位：\n\n``` \n| ​  || model = \n``` \n\n| --- | ---\
  \ |\n\n| ​  || cnn_base |\n| ​  || |> Axon.global_avg_pool(channels: :first) |\n\
  | ​  || |> Axon.dropout(rate: 0.2) |\n| ​  || |> Axon.dense(1) \n``` \n\n注意，你需要为本例指定\
  \ `channels: :first`，因为所使用的模型默认采用通道优先（channels first）的表示方式。将这些步骤组合在一起，模型构建代码应如下所示：\n\
  \n``` \n| ​  || {cnn_base, cnn_base_params} = AxonOnnx.import(\"mobilenetv2-7.onnx\"\
  ) \n``` \n\n| --- | --- |\n\n| ​  || {_popped, cnn_base} = Axon.pop_node(cnn_base)\
  \ |\n| ​  || {_popped, cnn_base} = Axon.pop_node(cnn_base) |\n| ​  ||  |\n| ​  ||\
  \ model = \n| ​  || cnn_base |\n| ​  || |> Axon.namespace(\"feature_extractor\"\
  ) |\n| ​  || |> Axon.freeze() |\n| ​  || |> Axon.global_avg_pool(channels: :first)\
  \ |\n| ​  || |> Axon.dropout(rate: 0.2) |\n| ​  || |> Axon.dense(1) \n``` \n\n在输入管道和模型就位后，你可以开始构建训练循环。到此为止，你应该已经对如何创建和操作\
  \ Axon 训练循环有了相当好的理解。对于本例，请按照之前在 Early Stopping and Validation 中实现的训练循环进行，并做一些小调整：\n\
  \n``` \n| ​  || loss = &Axon.Losses.binary_cross_entropy(&1, &2, \n| --- | --- |\
  \ \n| ​  || reduction: :mean, \n| ​  || from_logits: true \n| ​  || ) \n``` \n\n\
  | ​  || optimizer = Axon.Optimizers.adam(1.0e-4) | \n| ​  ||  |\n| ​  || trained_model_state\
  \ = \n| ​  || model |\n| ​  || |> Axon.Loop.trainer(loss, optimizer) |\n| ​  ||\
  \ |> Axon.Loop.metric(:accuracy) |\n| ​  || |> Axon.Loop.validate(model, val_pipeline)\
  \ |\n| ​  || |> Axon.Loop.early_stop(\"validation_loss\", mode: :min, patience:\
  \ 5) |\n| ​  || |> Axon.Loop.run( \n| ​  || train_pipeline, \n| ​  || %{ \"feature_extractor\"\
  \ => cnn_base_params}, \n| ​  || epochs: 100, \n| ​  || compiler: EXLA \n| ​  ||\
  \ ) \n``` \n\n与之前的训练循环相比，这段代码有几个差异。\n\n首先，你使用了 `Axon.Losses.binary_cross_entropy/3`\
  \ 的参数化版本作为损失函数。你可能注意到，输出的全连接层没有使用 sigmoid 激活函数——它不将输出压缩到 0 到 1 之间的概率范围。该全连接层的输出被称为\
  \ logits（对数几率）或 log-probabilities。当你不指定最终的 sigmoid 激活函数（多类分类问题中使用 softmax）时，需要向损失函数传递\
  \ `from_logits: true` 以表明你传入的是 logits 而非概率。使用 logits 形式和概率形式没有本质区别，除了可以省去额外的 sigmoid\
  \ 激活。Axon 内部实际上总是使用 logits 来计算交叉熵损失。当你使用 logits 时，需要记得在计算概率时对预测值应用 sigmoid 或 softmax。\n\
  \n另一个差异是使用 `Axon.Optimizers` 的函数式声明来定义优化器。这仅是为了使用不同于 Adam 优化器默认的学习率。\n\n最后的差异是，在\
  \ `train_pipeline` 后面的空 map 被一个包含特征提取器参数的 map 替换。这个 map 表示训练循环的初始状态。\n\n在之前的所有章节中，你都是从零训练模型，因此不需要初始状态。现在你想利用预训练模型，需要告诉\
  \ Axon 使用哪些预训练参数。Axon 会在训练循环内部使用这些初始状态参数来初始化模型，固定特征提取器的参数。虽然你也可以手动提供所有模型的初始参数，但从根本上讲，Axon\
  \ 会自动为未在初始状态中提供的参数进行初始化。初始状态参数相当于 Axon 训练循环的累加器。显式初始化模型参数和将参数提供给训练循环让 Axon 初始化之间没有本质区别，后者只能节省少量样板代码。\n\
  \n理解这一点很重要：在预训练模型之上构建模型并不一定需要大幅改变训练流程。除了模型构建过程中的几个小调整、在训练循环中加入初始状态，以及对损失函数和优化器的微调外，其核心流程与从零训练的章节几乎相同。许多在训练从零时适用的原则和策略同样适用于在预训练模型上进行训练。你可以在不做大改动的情况下，利用他人的经验成果。\n\
  \n与任何机器学习算法一样，你需要考虑一些限制和注意事项，这些将在 Knowing When to Use Transfer Learning 中进一步了解。不过，迁移学习是一个极其强大的工具。在许多情况下，直接使用预训练模型比从零训练更合理。\n\
  \n经过一段时间运行训练循环后，你会看到以下输出：\n\n``` \n| ​  || ... | \n| --- | --- | \n| ​  || Batch:\
  \ 23, accuracy: 0.9348959 loss: 0.1361023 | \n| ​  || Epoch: 15, Batch: 700, accuracy:\
  \ 0.9220337 loss: 0.2185298 | \n| ​  || Batch: 23, accuracy: 0.9414064 loss: 0.1326849\
  \ | \n| ​  || Epoch: 16, Batch: 700, accuracy: 0.9208744 loss: 0.2164259 | \n| ​ \
  \ || Batch: 23, accuracy: 0.9361981 loss: 0.1386008 | \n| ​  || Epoch: 17, Batch:\
  \ 700, accuracy: 0.9210071 loss: 0.2145825 | \n| ​  || Batch: 23, accuracy: 0.9375002\
  \ loss: 0.1397082 | \n| ​  || Epoch: 18, Batch: 700, accuracy: 0.9189568 loss: 0.2129661\
  \ | \n| ​  || Batch: 23, accuracy: 0.9388022 loss: 0.1403071 | \n``` \n\n\n\n\n\
  你的模型在训练和验证集上达到了 93-94% 的准确率，但它在测试集上表现如何呢？运行以下评估循环来查看：\n\n| || eval_model = model\
  \ |> Axon.sigmoid() |\n| --- |\n| ||  |\n| || eval_model |\n| || |> Axon.Loop.evaluator()\
  \ |\n| || |> Axon.Loop.metric(​*:accuracy*​) |\n| || |> Axon.Loop.run(test_pipeline,\
  \ trained_model_state, ​*compiler:*​ EXLA) |\n\n在本例中，你通过在原始模型上应用 sigmoid 函数来调整模型，以输出概率而非\
  \ logits。\n\n运行代码后，你会看到以下结果：\n\n| || Batch: 23, accuracy: 0.9449407 |\n| --- |\n\
