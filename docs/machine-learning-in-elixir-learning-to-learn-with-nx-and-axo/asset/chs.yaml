  \ [`pragprog.com`](http://pragprog.com)。\n\n我们的电子书不包含任何数字版权管理（DRM），一直以来都是 DRM‑free\
  \ 的。我们率先推出了“beta 书”概念，即你可以在书籍编写期间购买并阅读，并向作者提供反馈，以帮助改进最终版本。所有购买者的免费资源包括源码下载（如适用）、误差列表和讨论论坛，均可在书籍的主页\
  \ pragprog.com 上获取。我们致力于简化你的生活。\n\n\n\n谢谢你的持续支持，\n\n\n这本书的制作团队包括：Dave Thomas（出版商）Janet\
  \ Furlow（首席运营官）Susannah Davidson（首席编辑）Tammy Coron（开发编辑）Corina Lebegioara（校对编辑）Potomac\
  \ Indexing, LLC（索引）Gilson Graphics（排版）\n\n如需客户支持，请联系 support@pragprog.com。\n\n如需国际版权，请联系\
  \ rights@pragprog.com。\n\n献给 Riley、Weston 和 Indy。\n\n\n#   \n\n\nCopyright © 2024,\
  \ The Pragmatic Bookshelf. \n#   \n机器学习，特别是深度学习，不断推动我们曾认为不可能的事物的边界——并且在每个行业中不断实现。\n\
  \n看似每天都有公司或研究小组发布新模型，进一步推动技术的前沿。近年来，ChatGPT、Stable Diffusion 等模型屡屡登上新闻版面，将人工智能推向前台，并重新定义可能的应用类型。\n\
  \n在其大部分历史时期，Elixir 及 BEAM 并不是机器学习工具的可行选择。但 Nx 生态系统改变了这一局面。在该生态系统中，你可以直接用 Elixir\
  \ 编写机器学习和数值计算代码，并实现与 Python 或 Julia 等同等或更优的性能。Nx 为 Elixir 开发者提供了新的能力，同时也为希望探索其他生态系统、构建无\
  \ Python 依赖的应用的机器学习工程师和研究人员提供了离开 Python 的捷径。\n\n本书的目标是成为 Elixir 程序员探索机器学习的权威资源。虽然大量机器学习知识可在网络上获取，但没有一份现有资源是专门为\
  \ Elixir 编写的。本书旨在以功能化、务实且富有乐趣的 Elixir 方式教你机器学习。\n\n你将从机器学习和 Nx 的基础知识开始，逐步掌握部署经过预训练模型的强大功能到\
  \ Phoenix 应用的能力。本书贯穿使用 Livebook——Elixir 的交互式代码笔记本——进行数据处理和模型训练的实践。到书末，你将掌握 Nx、Axon、Scholar、Bumblebee、Explorer、VegaLite\
  \ 等众多 Elixir 机器学习生态系统库的使用经验。\n\n我们终于达到了那备受期待却长期未实现的“人工智能驱动产品黄金时代”。因此，如果你想构建强大、智能、结合机器学习模型的应用，Elixir\
  \ 是实现这一目标的最佳语言之一。\n\n## 为什么选择 Elixir 进行机器学习？\n\nElixir 是一种动态、功能化、通用的编程语言，针对 BEAM\
  \ 虚拟机进行优化。它已被证明是构建和维护可扩展应用的有力语言。但 Elixir 并非为机器学习而设计。在 Nx^([\\[1\\]](#f_0011.xhtml#FOOTNOTE-1))\
  \ 项目出现之前，Elixir 中的机器学习工作，至少可以说是不被建议的。BEAM 虚拟机并未针对机器学习所需的大量计算任务进行优化。然而，Nx 及其周边生态系统正是为了让\
  \ Elixir 程序员能够胜任机器学习应用所需的计算密集型工作而构建的。\n\nElixir 和 Nx 是机器学习领域的新秀。尽管 Nx 生态系统并不旨在取代成熟的\
  \ Python 机器学习生态系统，但理解在 Elixir 中进行机器学习的优势显而易见。\n\n\n\n\n-   Elixir 是一种函数式编程语言。虽然这可能看起来是机器学习工作负载所需的大量计算的缺点，但它实际上是一个优势。在函数式世界中，一切都是不可变的。这意味着在处理大量数据时，你需要在每个单独操作后返回数据的新副本。幸运的是，由于深度学习的兴起，计算会在实际执行任何操作之前先在硬件加速器（如\
  \ GPU）上进行排队处理。这些计算使用即时编译（JIT）编译器进行，通常实现一个用于构建计算图的函数式接口。如你在后续章节中将看到，你可以使用 Elixir\
  \ 的函数式风格进行编写，而无需担心大量的中间副本。\n\n-   第二，Elixir 是为并发设计的。当训练机器学习算法时，性能瓶颈通常在于为硬件加速器上的训练步骤加载和准备数据。这种并发数据处理在\
  \ Elixir 中是自然的，因为 Elixir 是专门为并发设计的。你只需阅读 `*Concurrent Data Processing in Elixir*\
  \ [Gos21]` 即可看到 Elixir 非常适合这类应用。\n\n-   第三，Elixir 及其 Web 框架 Phoenix 在构建和扩展实时、容错的应用方面表现出色。越来越多的机器学习系统被部署在对延迟和可用性至关重要的场景中。例如，信用卡欺诈检测系统理想情况下应实时工作，立即在欺诈交易发生时向客户端发出警报。此外，由于每天发生大量欺诈交易，这些系统不能宕机。Elixir\
  \ 和 Phoenix 已被证明能够构建低延迟且容错的系统。但直到现在，将机器学习集成到 Elixir 应用中仍需要将安全性从 BEAM 移至外部服务。\n\n\
  -   最后，Elixir 非常有趣，使用起来是一种绝对的享受。正如你在本书中将看到的，大多数机器学习算法都自然地以函数式构造来表达，这与 Elixir 编程语言的优雅和周到相得益彰。\n\
  \n## Who This Book Is For\n\n本书面向希望在 Elixir 中学习机器学习的程序员，以及具有 Elixir 或机器学习经验的程序员。\n\
  \nElixir 程序员可以在没有机器学习、数学或数值计算先验知识的情况下阅读本书，因为本书将从基础开始教你所需的全部知识。\n\n具有机器学习经验但没有 Elixir\
  \ 经验的程序员也能跟上本书的步伐，但某些语法细节和函数式概念可能会显得 unfamiliar。如果你属于这一类，建议随手查阅 Elixir 文档，参考本书未涵盖的语言细节。\n\
  \n如果你既没有机器学习也没有 Elixir 经验，那么同时学习两者会是一项困难的任务。因此，我建议你先熟悉 Elixir，然后再回到本书学习 Elixir 中的机器学习。\n\
  \n| ​  || Nx.bitcast(a, {​*:f*​, 64}) |\n\n| --- | --- |\n\n运行后结果如下：\n\n| ​  ||\
  \ #Nx.Tensor< |\n\n| --- | --- |\n\n| ​  || f64\\[3\\] |\n\n| ​  || \\[5.0e-324,\
  \ 1.0e-323, 1.5e-323\\] |\n\n| ​  || \\> |\n\n这说明将 64 位整数字节解释为 64 位浮点字节会导致数值发生巨大变化。\n\
  \n### 元素级单元操作\n\n元素级单元操作类似于在列表上调用 Enum.map/2 并对每个元素应用数学操作。例如，计算列表中每个元素的绝对值：\n\n\
  | ​  || a = \\[-1, -2, -3, 0, 1, 2, 3\\] |\n\n| --- | --- |\n\n| ​  || Enum.map(a,\
  \ &abs/1) |\n\n这将返回：\n\n| ​  || \\[1, 2, 3, 0, 1, 2, 3\\] |\n\n\n\n\n## 重新划分标题层级\n\
  \n## 代表世界的表示\n\n代码对列表中每个元素应用 `&abs/1`。现在，假设你被给予了一个嵌套列表的列表。计算列表中每个值的绝对值需要嵌套使用 `Enum.map/2`。随着嵌套程度的增加，问题的难度也随之提升。\n\
  \n如果你被要求用与 `Enum.map/2` 类似的方式处理张量（tensor），可能会倾向于使用类似的解决方案。但 `Nx` 实现了一系列元素级操作，这些操作可以在不考虑嵌套程度的情况下，对张量数据进行逐元素处理。这些操作作用于张量数据的展开表示，同时保持张量的形状。下面通过示例说明这一点：\n\
  \n```elixir\na = Nx.tensor([[[-1, -2, -3], [-4, -5, -6]], [[1, 2, 3], [4, 5, 6]]])\n\
  ```\n\n计算该张量中每个值的绝对值：\n\n```elixir\nNx.abs(a)\n```\n\n输出结果如下：\n\n```elixir\n#Nx.Tensor<\n\
  s64[2][2][3]\n[1, 2, 3]\n[4, 5, 6]\n]\n```\n\n你不需要嵌套的 `map`、循环或递归。只需一个 `Nx` 库函数调用即可。`Nx`\
  \ 拥有多种函数，它们的工作方式相同，用于计算元素级的平方根、指数、对数等。如果需要对张量中每个元素应用函数，应当使用已有的单元操作进行组合，而不是手动遍历每个值。因为\
  \ `Nx` 的后端和编译器很可能已经实现了针对 `Nx` 操作的高效例程，这些例程的效率显著优于手写的循环或 `map`。\n\n### 元素级二元操作\n\n\
  你最终会想对数据进行加、减、乘、除等二元运算。在 Elixir 中，你可能会尝试使用 `Enum.zip_with/3` 来实现。例如，若要计算两个列表中对应元素的和，你可能会这样做：\n\
  \n```elixir\na = [1, 2, 3]\nb = [4, 5, 6]\nEnum.zip_with(a, b, fn x, y -> x + y\
  \ end)\n```\n\n这将返回：\n\n```elixir\n[5, 7, 9]\n```\n\n随着嵌套层级的增多，问题的复杂度也随之上升。幸运的是，`Nx`\
  \ 提供了处理此类 zip-map 操作的库函数。首先，创建以下两个张量：\n\n```elixir\na = Nx.tensor([[1, 2, 3], [4,\
  \ 5, 6]])\nb = Nx.tensor([[6, 7, 8], [9, 10, 11]])\n```\n\n将它们相加：\n\n```elixir\n\
  Nx.add(a, b)\n```\n\n返回结果如下：\n\n```elixir\n#Nx.Tensor<\ns64[2][3]\n[7, 9, 11]\n\
  [13, 15, 17]\n]\n```\n\n你还可以尝试其他二元操作，例如乘法：\n\n```elixir\nNx.multiply(a, b)\n```\n\
  \n输出为：\n\n```elixir\n#Nx.Tensor<\ns64[2][3]\n[6, 14, 24]\n[36, 50, 66]\n]\n```\n\
  \n二元操作作用于两个张量中对应的元素。但如果张量形状不一致呢？当尝试对形状不同的张量执行二元操作时，`Nx` 会尝试对它们进行广播（broadcast）。广播是指为了使两个张量的形状兼容，对较小的张量的维度进行重复，从而执行元素级运算。例如，若要将标量张量与形状为\
  \ `{3}` 的张量相加，标量会被广播到形状为 `{3}` 的张量的每个元素上。两个形状可以广播的条件满足以下任一：\n\n1. 其中一个形状是标量。\n2.\
  \ 对应维度的大小相同，或其中一个维度的大小为 1。\n\n例如，形状为 `{1, 3, 3, 2}` 与 `{4, 1, 3, 2}` 可以广播，因为每个维度要么相同，要么非相同的维度大小为\
  \ 1。而形状为 `{1, 3, 3, 2}` 与 `{4, 2, 3, 2}` 不能广播，因为第二维度大小不匹配（3 无法广播到 2）。\n\n如果形状的阶数（rank）不一致，`Nx`\
  \ 会在较低阶形状的前面预置大小为 1 的维度，以便进行广播。例如，若尝试广播形状 `{3}` 与 `{2, 3}`，`Nx` 会在 `{3}` 前预置一个大小为\
  \ 1 的维度，得到 `{1, 3}`，此时 `{1, 3}` 与 `{2, 3}` 可根据广播规则进行广播。\n\n运行以下代码，感受广播的效果：\n\n```elixir\n\
  Nx.add(5, Nx.tensor([1, 2, 3]))\n```\n\n输出如下：\n\n```elixir\n#Nx.Tensor<\ns64[3]\n\
  [6, 7, 8]\n>\n```\n\n可以看到，5 被添加到张量的每个元素。通过以下示例进一步观察广播的影响：\n\n```elixir\nNx.add(Nx.tensor([1,\
  \ 2, 3]), Nx.tensor([[4, 5, 6], [7, 8, 9]]))\n```\n\n输出为：\n\n```elixir\n#Nx.Tensor<\n\
  s64[2][3]\n[5, 7, 9]\n[8, 10, 12]\n>\n```\n\n可以看出，第一个张量的值被应用到第二个张量的每一行。\n\n### 减值操作\n\
  \n最后，你应熟悉 `Nx` 中的减值（reduction）操作。想象一张张量表示过去 12 个月的收入：\n\n```elixir\nrevs = Nx.tensor([85,\
  \ 76, 42, 34, 46, 23, 52, 99, 22, 32, 85, 51])\n```\n\n若数据在列表中，你可能会使用 `Enum.reduce/3`\
  \ 计算总收入。`Nx` 提供了多种现成的减值操作，可在整个张量或特定轴上计算聚合。计算总收入：\n\n```elixir\nNx.sum(revs)\n```\n\
  \n返回：\n\n```elixir\n#Nx.Tensor<\ns64\n647\n>\n```\n\n减值操作也可针对单个轴进行。例如，若有四年的收入数据：\n\
  \n```elixir\nrevs = Nx.tensor(\n  [\n    [21, 64, 86, 26, 74, 81, 38, 79, 70, 48,\
  \ 85, 33],\n    [64, 82, 48, 39, 70, 71, 81, 53, 50, 67, 36, 50],\n    [68, 74,\
  \ 39, 78, 95, 62, 53, 21, 43, 59, 51, 88],\n    [47, 74, 97, 51, 98, 47, 61, 36,\
  \ 83, 55, 74, 43]\n  ],\n  names: [:year, :month]\n)\n```\n\n若想计算每个月的总收入，可对 `:year`\
  \ 维度求和：\n\n```elixir\nNx.sum(revs, axes: [:year])\n```\n\n返回：\n\n```elixir\n#Nx.Tensor<\n\
  s64[month: 12]\n[200, 294, 270, 194, 337, 261, 233, 189, 246, 229, 246, 214]\n>\n\
  ```\n\n若想计算每年的总收入，可对 `:month` 维度求和：\n\n```elixir\nNx.sum(revs, axes: [:month])\n\
  ```\n\n返回：\n\n```elixir\n#Nx.Tensor<\ns64[year: 4]\n[705, 711, 731, 766]\n>\n```\n\
  \n`Nx` 库提供了多种减值函数，可用于计算平均值、总和、最小值、最大值等。\n\n\n\nThe purpose of the Nx tensor abstraction\
  \ is to give you a flexible data structure for representing the real world. Machine\
  \ learning is applicable to nearly every field. To use machine learning for your\
  \ applications, you need to choose an appropriate numerical representation for your\
  \ data. Depending on the type of data you have, there’s likely already a common\
  \ or natural way to represent the data as a tensor.\n\n## Tabular Data\n\nTabular\
  \ data or structured data is data with a structure similar to what you would find\
  \ in a relational database or CSV file. Each column represents a feature of the\
  \ data, such as petal length in the iris example from Chapter 1, *Make Machines\
  \ That Learn*. You’ll often see tabular data represented in a two-dimensional tensor\
  \ with the shape {num_examples, num_features}.\n\nnum_examples corresponds to the\
  \ total number of examples in your dataset. num_features corresponds to the total\
  \ number of features in the tabular data. Encoding information in this way loses\
  \ some semantic information about what the values in the tensor represent, which\
  \ needs to be considered when using structured data in a machine learning algorithm.\
  \ For example, if you have a field that represents home price and another field\
  \ that represents interest rate, you’d end up with a tensor that contains values\
  \ with drastically different orders of magnitudes.\n\n## Images\n\nIf you consider\
  \ an image as just a collection of pixels, it maps naturally to a tensor. In reality,\
  \ images are represented as a four-dimensional tensor with the shape {num_examples,\
  \ height, width, channels}, where num_examples is the number of examples in your\
  \ dataset, height is the pixel height of the image, width is the pixel width of\
  \ the image, and channels is the number of color channels in the image. For an RGB\
  \ image, channels is equal to 3 because for each pixel, there are three color values:\
  \ red, green, and blue.\n\nYou might also see images with the following shape: {num_examples,\
  \ channels, height, width}. This is a channels first representation of an image,\
  \ whereas the {num_examples, height, width, channels} is a channels last representation.\
  \ The position of the channels dimension differs from framework to framework. Historically,\
  \ PyTorch—a Python machine learning framework—used channels first configurations\
  \ for images while TensorFlow used channels last. From a performance perspective,\
  \ representing an image with the channels last format is a bit faster when performing\
  \ operations such as convolutions. You’ll learn more about working with images in\
  \ Chapter 7, *Learn to See*.\n\n## Video\n\nIf you consider a video as a collection\
  \ of images, then you can easily extend your image representation to represent a\
  \ video as well. A video is simply a sequence of images where each frame of the\
  \ video is a tensor representation of an image.\n\nIt’s common to represent videos\
  \ with a tensor shape of {num_examples, frames, height, width, channels} where num_examples\
  \ is the number of examples in your dataset, frames is the number of frames per\
  \ video example, height is the pixel height of each frame, width is the pixel width\
  \ of each frame, and channels is the number of color channels in the video. For\
  \ example, one video filmed at 15 frames per second for four seconds at a resolution\
  \ of 224x224 with three color channels would have a shape of {1, 60, 224, 224, 3}.\n\
  \n## Audio\n\nAudio is represented as a sequence of samples where each sample represents\
  \ an amplitude or strength of the audio signal at a specific time. The number of\
  \ samples depends on the audio sampling rate and the total length of a recording.\
  \ You can also have multiple audio channels. For example, in a stereo audio file,\
  \ you have samples for left and right speakers. You can represent audio with a shape\
  \ of {num_examples, samples, channels} where num_examples is the number of examples\
  \ in the dataset, samples is the number of audio samples in each example, and channels\
  \ is the number of audio channels in each example.\n\n## Text\n\nThere are many\
  \ ways to extract numerical representations of text. You’ll use a few common ways\
  \ to model text throughout this book. In models that make use of deep learning,\
  \ text is usually tokenized in some way.\n\nTokenization is the process of splitting\
  \ text into smaller units of representation. For example, you can tokenize text\
  \ at the character level and then assign a numeric value to each character. You\
  \ can represent each token with a one-hot encoding or with a numeric value. Remember\
  \ from *Preparing Data for Training*, one-hot encoding is essentially a binary representation\
  \ where each index represents the presence of a value. If you have a one-hot encoded\
  \ representation of the value 0 for a variable with three possible values, the one-hot\
  \ representation will look like this:\n\n| ​  || #Nx.Tensor< |\n| --- | --- |\n\
  | ​  || u8\\[3\\] |\n| ​  || \\[1, 0, 0\\] |\n| ​  || \\> |\n\nAfter tokenization,\
  \ you’re left with a sequence of numeric values, which means the shape of a numeric\
  \ representation of text would be {num_examples, sequence_length, token_features}\
  \ where num_examples is the number of examples in your dataset, sequence_length\
  \ is the length of each text sequence, and token_features is the size of the feature\
  \ space for each token. For example, imagine you had 32 text examples, each 255\
  \ characters long and tokenized at the character level, and one-hot encoded with\
  \ 100 possible characters. The shape of your dataset would be {32, 255, 100}.\n\n\
  You can also tokenize text into a sequence of integers such that the shape will\
  \ end up being {num_examples, sequence_length}. For example, imagine you have these\
  \ sentences: [\"My name is Sean\", \"I love Elixir\"]. Assuming each word in those\
  \ sentences represents a unique token, your tensor might look something like this:\n\
  \n| ​  || #Nx.Tensor< |\n| --- | --- |\n| ​  || s64\\[2\\]\\[4\\] |\n| ​  || \\\
  [ |\n| ​  || \\[32, 49, 27, 5\\], |\n| ​  || \\[68, 34, 55, 0\\] |\n| ​  || \\]\
  \ |\n| ​  || \\> |\n\nNote that the sequence \"I love Elixir\" has an additional\
  \ token at the end called a padding token such that its sequence length matches\
  \ the length of all the sequences in the dataset. You’ll learn about padding more\
  \ in Chapter 9, *Understand Text*.\n\n## Going from def to defn\n\nSo far in this\
  \ chapter, you’ve learned about what a tensor is, how to create and manipulate tensors\
  \ in Nx, and how to model the real world with tensors. This is all great, but you\
  \ still haven’t learned how to unlock the true power of Nx just yet.\n\nIf you’ve\
  \ been working with Elixir for a while, you’ve probably heard the argument Elixir\
  \ and the Erlang Virtual Machine aren’t designed for the type of computations required\
  \ in machine learning and scientific computing. All the examples you’ve seen in\
  \ this chapter run in pure Elixir without any acceleration. The lack of acceleration\
  \ is fine for the examples in this chapter, but for the computations required in\
  \ machine learning, you’ll need acceleration. Enter the magic of defn.\n\nTypical\
  \ function definitions in Elixir look something like this:\n\n| ​  || ​**defmodule**​\
  \ MyModule ​**do**​ |\n| --- | --- |\n| ​  ||  |\n| ​  || ​**def**​ adds_one(x)\
  \ ​**do**​ |\n| ​  || Nx.add(x, 1) |\n| ​  || ​**end**​ |\n| ​  ||  |\n| ​  || ​**end**​\
  \ |\n\nThe code you just saw creates a module named MyModule with a function adds_one,\
  \ which uses Nx.add/2 to add 1 to the parameter x. When you execute MyModule.adds_one/1,\
  \ your code will run in pure Elixir without any acceleration. Now, tweak your module\
  \ to look like this:\n\n| ​  || ​**defmodule**​ MyModule ​**do**​ |\n| --- | ---\
  \ |\n| ​  ||  |\n| ​  || ​**import**​ Nx.Defn |\n| ​  ||  |\n| ​  || defn adds_one(x)\
  \ ​**do**​ |\n| ​  || Nx.add(x, 1) |\n| ​  || ​**end**​ |\n| ​  || ​**end**​ |\n\
  \n\n\n\n你在这里做了两个小但重要的更改。首先，你添加了 import Nx.Defn，这会导入 Nx 数值定义的定义。数值定义是一个 Elixir 函数，它会使用有效的\
  \ Nx 编译器进行即时 (JIT) 编译。即时编译意味着在函数调用时会编译一个特殊版本的函数。编译出的函数取决于函数的输入类型和形状。其次，你应该注意到从 def\
  \ 变为 defn adds_one。这个更改实际上创建了一个数值定义，可以 JIT 编译到 CPU 或 GPU。\n\n数值定义使用多阶段编程模型。在函数调用时，而不是直接执行函数，Nx\
  \ 会计算程序的表达式表示，然后将其交给 Nx 编译器（如 EXLA）。EXLA 会遍历该表达式，并从给定的表达式中生成优化的程序，该程序可以在 CPU 或 GPU\
  \ 上执行。要看到这点，请修改 adds_one/1 函数：\n\n| ​  || defn adds_one(x) ​**do**​ |\n| --- | ---\
  \ |\n| ​  || Nx.add(x, 1) |> print_expr() |\n| ​  || ​**end**​ |\n\n额外的 print_expr/1\
  \ 会输出你函数的 Nx 表达式表示。现在，运行你的函数：\n\n| ​  || MyModule.adds_one(Nx.tensor([1, 2, 3]))\
  \ |\n| --- | --- |\n| ​  || #Nx.Tensor< |\n| --- | --- |\n| ​  || s64[3] |\n| ​ \
  \ || |\n| ​  || Nx.Defn.Expr |\n| ​  || parameter a:0 s64[3] |\n| ​  || b = add\
  \ 1, a s64[3] |\n| ​  || > |\n你可以把 Nx 表达式看作是 Nx 函数的数值汇编。像 EXLA 这样的编译器知道如何解释和处理这种汇编，以创建优化的数值程序。\n\
  \nNx 编译器和数值定义是 Nx 绕过不可变性限制的方法。与其 eagerly 执行包含大量中间数据复制的程序，Nx 会将计算排程到外部编译器（如 EXLA），该编译器生成看起来像单个函数调用的优化程序。要亲自看到\
  \ Nx 编译器带来的性能提升，请创建以下模块：\n\n| ​  || ​**defmodule**​ Softmax ​**do**​ |\n| --- |\
  \ --- |\n| ​  || ​**import**​ Nx.Defn |\n| ​  ||  |\n| ​  || defn softmax(n), ​**do**​:\
  \ Nx.exp(n) / Nx.sum(Nx.exp(n)) |\n| ​  || ​**end**​ |\n这段代码创建了一个包含单个数值定义的 softmax\
  \ 函数模块。softmax 函数在机器学习算法中很常见，你会在本书中看到它。\n\nSoftmax 根据输入权重计算归一化概率分布。也就是说，它为每个输入权重分配一个在\
  \ 0 到 1 之间的概率，且所有权重的总和为 1。需要注意的一点是，这个实现是不稳定的——对于大的 n 值会发生溢出。为了简化，你现在不需要担心这个问题。接下来，执行以下代码：\n\
  \n| ​  || key = Nx.Random.key(42) |\n| --- | --- |\n| ​  || {tensor, \\_key} = Nx.Random.uniform(key,\
  \ ​*shape:*​ {1\\_000\\_000}) |\n| ​  ||  |\n| ​  || Benchee.run( |\n| ​  || %{\
  \ |\n| ​  || ​*\"*​​*JIT with EXLA\"*​ => ​**fn**​ -> |\n| ​  || apply(EXLA.jit(&Softmax.softmax/1),\
  \ \\[tensor\\]) |\n| ​  || ​**end**​, |\n| ​  || ​*\"*​​*Regular Elixir\"*​ => ​**fn**​\
  \ -> |\n| ​  || Softmax.softmax(tensor) |\n| ​  || ​**end**​ |\n| ​  || }, |\n|\
  \ ​  || ​*time:*​ 10 |\n| ​  || ) |\n这段代码创建了一个包含一百万个元素的随机张量，然后运行两个基准测试。第一个基准使用 JIT\
  \ 编译执行 softmax 函数。第二个基准使用\n\n\n\n|​  || config​*:nx*​,​ *:default_options*​,​ \\\
  [*compiler:*​ EXLA\\] |\n| --- | --- |\n|​  || Mix.install(​ |\n|​  || {​*:nx*​,​\
  \ *\"*​​*~> 0.5\"*​},​ |\n|​  || {​*:exla*​,​ *\"*​​*~> 0.5\"*​},​ |\n|​  || {​*:kino*​,​\
  \ *\"*​​*~> 0.8\"*​},​ |\n|​  || {​*:stb_image*​,​ *\"*​​*~> 0.6\"*​},​ |\n|​  ||\
  \ {​*:vega_lite*​,​ *\"*​​*~> 0.1\"*​},​ |\n|​  || {​*:kino_vega_lite*​,​ *\"*​​*~>\
  \ 0.1\"*​}​ |\n|​  || \\]) |\n|​  || Nx.default_backend(EXLA.Backend) |\n|​  ||\
  \ Linear Algebra Routines |\n|​  || ![images/aside-icons/info.png](img/info.png)\
  \ || Libraries that implement linear algebra routines and manipulations are the\
  \ foundations of numerical computing. Growing access to computing resources in the\
  \ early 1970s and the development of standardized implementations of high-level\
  \ programming languages like ALGOL and FORTRAN made it possible to implement standardized\
  \ routines for numerical analysis. [*Handbook for Automatic Computation* [WR74]](#f_0098.xhtml#d1806e1808)\
  \ by Wilkinson and Reinsch was a first attempt at implementing common numerical\
  \ procedures. Published in 1971, it outlines algorithms for solving matrix linear\
  \ equation and eigenvalue problems in ALGOL60 and served as inspiration for the\
  \ development of EISPACK and LINPACK—two early attempts at creating and disseminating\
  \ high-quality mathematical software. EISPACK and LINPACK inspired the development\
  \ of MATLAB and were later combined into a single package, LAPACK, which is still\
  \ maintained and in use today. |\n|​  || The Building Blocks of Linear Algebra |\n\
  |​  || The fundamental object in linear algebra is the vector. You can think of\
  \ a vector as a collection of numbers that map to some real-world properties. There\
  \ are different, but somewhat complementary meanings for vectors in computer science,\
  \ physics, and math. Nx doesn’t explicitly differentiate between scalars, vectors,\
  \ and matrices. Everything in Nx is a tensor. Vectors are represented as Nx tensors\
  \ with a rank of 1, or a single-dimensional tensor. In this book, when something\
  \ is referred to as a vector, it means it’s a rank-1 tensor. To help visualize this\
  \ concept, run the following cell to create a vector with Nx: |\n\n\n\n|​  || a\
  \ = Nx.tensor([1, 2, 3]) |\n| --- | --- |\n|​  || b = Nx.tensor([4.0, 5.0, 6.0])\
  \ |\n|​  || c = Nx.tensor([1, 0, 1], *type:* {*:u*​, 8}) |\n|​  || IO.inspect a,\
  \ *label:* *:a*​ |\n|​  || IO.inspect b, *label:* *:b*​ |\n|​  || IO.inspect c,\
  \ *label:* *:c*​ |\n|​  ||  |\n|​  ||  |\n|​  ||  |\nThis returns the following\
  \ tensors:\n|​  || a: #Nx.Tensor< |\n| --- | --- |\n|​  || s64[3] |\n|​  || [1,\
  \ 2, 3] |\n|​  || > |\n|​  || b: #Nx.Tensor< |\n| --- | --- |\n|​  || f32[3] |\n\
  |​  || [4.0, 5.0, 6.0] |\n|​  || > |\n|​  || c: #Nx.Tensor< |\n| --- | --- |\n|​ \
  \ || u8[3] |\n|​  || [1, 0, 1] |\n|​  || > |\nNotice how each tensor has a single\
  \ dimension with a size of 3 and is represented as a list of values. Often in machine\
  \ learning, these values map to real-world properties. For example, if you were\
  \ trying to predict whether a stock will move up or down, you might choose to represent\
  \ stocks as a vector of stock properties such as current price, price-to-earnings,\
  \ market cap, and so on. You could then represent individual stocks as vectors:\n\
  |​  || goog_current_price = 2677.32 |\n| --- | --- |\n|​  || goog_pe = 23.86 |\n\
  |​  || goog_mkt_cap = 1760 |\n|​  || goog = Nx.tensor([goog_current_price, goog_pe,\
  \ goog_mkt_cap]) |\nAnother object in linear algebra is the scalar. Scalars are\
  \ just numbers.\nIn the previous chapter, you learned that scalars are represented\
  \ as zero-dimensional tensors, for example, tensors with no shape. Most of the time\
  \ in machine learning and linear algebra, you’re concerned with a collection of\
  \ numbers, rather than individual numbers. But understanding scalars and how to\
  \ create them is important.\nWith Nx, you can either represent scalars as tensors\
  \ or leave them as regular numbers:\n|​  || i_am_a_scalar = Nx.tensor(5) |\n| ---\
  \ | --- |\n|​  || i_am_also_a_scalar = 5 |\nNx will interpret both variables as\
  \ scalars when performing operations. For readability, it’s typically best not to\
  \ wrap scalars in the tensor constructor. Scalars are useful for encoding things\
  \ such as discount rates or factors.\nWhen modeling multiple real-world objects\
  \ as vectors, you’ll probably find a need to represent the objects as a collection\
  \ in two dimensions. A two-dimensional array of numbers, or a package of vectors,\
  \ is known as a matrix. For example, if you have information regarding multiple\
  \ stocks, you can encode the entire collection of data as a matrix. In Nx, you can\
  \ think of a matrix as a tensor with rank-2, for example, a tensor with two dimensions.\
  \ Run the following code to see what a matrix looks like in Nx:\n|​  || goog_current_price\
  \ = 2677.32 |\n| --- | --- |\n|​  || goog_pe = 23.86 |\n|​  || goog_mkt_cap = 1760\
  \ |\n|​  ||  |\n|​  || meta_current_price = 133.93 |\n|​  || meta_pe = 11.10 |\n\
  |​  || meta_mkt_cap = 360 |\n|​  ||  |\n|​  ||  |\n|​  || stocks_matrix = Nx.tensor([\
  \ |\n|​  || [goog_current_price, goog_pe, goog_mkt_cap], |\n|​  || [meta_current_price,\
  \ meta_pe, meta_mkt_cap] |\n|​  || ]) |\n|​  ||  |\n|​  || IO.inspect stocks_matrix\
  \ |\nThe snippet returns the following output:\n|​  || #Nx.Tensor< |\n| --- | ---\
  \ |\n|​  || f32[2][3] |\n|​  || [ |\n|​  || [2677.320068359375, 23.860000610351562,\
  \ 1760.0], |\n|​  || [133.92999267578125, 11.100000381469727, 360.0] |\n|​  || ]\
  \ |\n|​  || > |\nNotice that a matrix is represented as a two-dimensional grid of\
  \ numbers. The concept of matrices arises often in linear algebra as they can be\
  \ conveniently used to represent linear transformations. You’ll learn more about\
  \ linear transformations in *Linear Transformations*​.\n\n### Important Operations\
  \ in Linear Algebra\n\nNow that you understand the basic building blocks of linear\
  \ algebra and how they map to Nx data structures, your next task is to learn about\
  \ some of the most common operations in linear algebra and how they map to Nx. This\
  \ discussion isn’t meant to be a comprehensive introduction to linear algebra and\
  \ the mechanics of linear algebra operations, but it’ll get you started. If you\
  \ want to know more, read [*The Matrix Cookbook* [PP08]​](#f_0098.xhtml#d1806e1298).\n\
  \n#### Vector Addition\n\nMaintaining the property of vector addition is a fundamental\
  \ characteristic of a vector. For Nx vectors, vector addition computes an element-wise\
  \ sum that adds individual components of vectors to obtain a new vector. An element-wise\
  \ sum adds individual elements along a tensor. Vector addition is an element-wise\
  \ sum of rank-1 tensors. For example, imagine you have two vectors encoded as Nx\
  \ tensors which represent sales of multiple different products in a catalog across\
  \ two different days:\n|​  || sales_day_1 = Nx.tensor([32, 10, 14]) |\n| --- | ---\
  \ |\n|​  || sales_day_2 = Nx.tensor([10, 24, 21]) |\nIf you wanted to draw conclusions\
  \ about sales in the aggregate, you could simply sum the two vectors together using\
  \ vector addition:\n|​  || total_sales = Nx.add(sales_day_1, sales_day_2) |\n| ---\
  \ | --- |\nThis returns the following:\n|​  || #Nx.Tensor< |\n| --- | --- |\n|​ \
  \ || s64[3] |\n|​  || [42, 34, 35] |\n|​  || > |\nVector addition adds the individual\
  \ components of a vector to obtain a new vector. Intuitively, total sales represent\
  \ the sales per-product across both days. This definition of addition also extends\
  \ to matrices and other higher-dimensional tensors in Nx. Recall from the previous\
  \ chapter that Nx tensors also obey specific broadcasting rules. With broadcasting,\
  \ you can conveniently add vectors to scalars, vectors to matrices, scalars to matrices,\
  \ and so on.\n\n#### Scalar Multiplication\n\nThe other fundamental property of\
  \ a vector is scalar multiplication. In Nx, scalar multiplication is a broadcasted\
  \ multiplication of a scalar and a vector. Imagine you’re trying to draw more conclusions\
  \ about the sales data discussed in *Vector Addition*​. For example, you want to\
  \ determine how your given sales volume will translate to revenue. You assume about\
  \ 10% of sales will result in an item being returned, which means that only about\
  \ 90% of each product’s sales will count toward revenue. You can represent this\
  \ discounting with scalar multiplication:\n|​  || sales_day_1 = Nx.tensor([32, 10,\
  \ 14]) |\n| --- | --- |\n|​  || sales_day_2 = Nx.tensor([10, 24, 21]) |\n|​  ||\
  \ total_sales = Nx.add(sales_day_1, sales_day_2) |\n|​  ||  |\n|​  || keep_rate\
  \ = 0.9 |\n|​  || unreturned_sales = Nx.multiply(keep_rate, total_sales) |\nThis\
  \ returns the following:\n|​  || #Nx.Tensor< |\n| --- | --- |\n|​  || f32[3] |\n\
  |​  || [37.79999923706055, 30.599998474121094, 31.5] |\n|​  || > |\nOf course, you\
  \ can’t sell a percentage of an item. But scalar multiplication is still useful\
  \ for making a projection into the future. Element-wise multiplication also generalizes\
  \ out to higher-dimensional tensors in Nx. But it wouldn’t be correct to call the\
  \ element-wise multiplication of two N-dimensional tensors a scalar multiplication.\
  \ Instead, you’ll commonly see element-wise multiplication referred to as a Hadamard\
  \ product—a binary operation that multiplies matrices of the same size, element-wise.\n\
  \n| The Hadamard Product |\n| --- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ || The Hadamard product is named after mathematician Jacques Hadamard, who is\
  \ recognized as one of the mathematicians who originally described the properties\
  \ of the operation. |\n| --- | --- |\nYou can use element-wise multiplication to\
  \ convert sales totals to revenue. Imagine you have another vector that represents\
  \ the price of each product. You can multiply price by unreturned sales to get revenue\
  \ per product:\n|​  || price_per_product = Nx.tensor([9.95, 10.95, 5.99]) |\n| ---\
  \ | --- |\n|​  || revenue_per_product = Nx.multiply(unreturned_sales, price_per_product)\
  \ |\nThis returns the following:\n|​  || #Nx.Tensor< |\n| --- | --- |\n|​  || f32[3]\
  \ |\n\n\n\n| ​  || \\[376.1099853515625, 335.0699768066406, 188.68499755859375\\\
  ] |\n\n| ​  || \\> |\n\n#### Transpose\n\nThe transpose of a matrix is accomplished\
  \ by flipping it along its diagonal, where the rows and columns of the matrix are\
  \ swapped. In Nx, you can take the transpose of a matrix using Nx.transpose/2.\n\
  \nImagine you’ve decided to encode your sales data into a matrix. Each row of the\
  \ matrix represents a day of sales while each column represents the sales data for\
  \ a given product. You might want to flip this relationship, such that each column\
  \ represents a day of sales and each row represents a product:\n\n| ​  || sales_matrix\
  \ = Nx.tensor(\\[ \\]\n\n| --- | --- |\n\n| ​  || \\[32, 10, 14\\], \\]\n\n| ​ \
  \ || \\[10, 24, 21\\] \\]\n\n| ​  || \\]) |\n\n| ​  || Nx.transpose(sales_matrix)\
  \ |\n\nThis returns the following:\n\n| ​  || #Nx.Tensor< |\n\n| --- | --- |\n\n\
  | ​  || s64\\[3\\]\\[2\\] |\n\n| ​  || \\[ \\]\n\n| ​  || \\[32, 10\\], \\]\n\n\
  | ​  || \\[10, 24\\], \\]\n\n| ​  || \\[14, 21\\] |\n\n| ​  || \\] |\n\n| ​  ||\
  \ \\> |\n\nNotice the rows and columns switch places. The transpose operation also\
  \ generalizes to higher dimensions. Rather than simply fixing rows and columns,\
  \ you can permute the dimensions of a tensor. For vectors or one-dimensional tensors\
  \ in Nx, the transpose operation is an identity operation, returning the tensor\
  \ identical to the input tensor because Nx doesn’t differentiate between row vectors\
  \ and column vectors. You can see the difference by running the following code:\n\
  \n| ​  || vector = Nx.tensor(\\[1, 2, 3\\])\n\n| --- | --- |\n\n| ​  || Nx.transpose(vector)\n\
  \nThis code returns the following output:\n\n| ​  || #Nx.Tensor< |\n\n| --- | ---\
  \ |\n\n| ​  || s64\\[3\\] |\n\n| ​  || \\[1, 2, 3\\] |\n\n| ​  || \\> |\n\n| Row\
  \ Vectors and Column Vectors |\n\n| --- |\n\n| ![images/aside-icons/info.png](img/info.png)\
  \ || In linear algebra, it’s common to represent vectors as a column of scalar entries.\
  \ You can distinguish between vectors with a single column and vectors with a single\
  \ row by referring to them as row vectors and column vectors respectively. Nx doesn’t\
  \ truly distinguish between row vectors and column vectors. However, languages such\
  \ as MatLab do. If the distinction is important in your calculations, you can create\
  \ a rank-2 tensor where one of the dimensions is 1. |\n\n| --- | --- |\n\n#### Linear\
  \ Transformations\n\nIn machine learning, you’ll often see mentions of linear transformations.\
  \ A linear transformation, also known as a linear map, is a function that maps inputs\
  \ to outputs. Linear transformations are special because they preserve linearity.\
  \ What this means is that they produce a different representation of an input, while\
  \ still preserving its fundamental properties. This type of function is useful,\
  \ for example, when you need to get a different or more convenient representation\
  \ of the input.\n\nImagine you have the following image of a cat, and you want to\
  \ invert the colors.\n\n![images/HarnessingThePowerOfMath/Cat.png](img/Cat.png)\n\
  \nYou can achieve this task using a linear transformation:\n\n| ​  || invert_color_channels\
  \ = Nx.tensor(\\[ \\]\n\n| --- | --- |\n\n| ​  || \\[-1, 0, 0\\], \\]\n\n| ​  ||\
  \ \\[0, -1, 0\\], \\]\n\n| ​  || \\[0, 0, -1\\] \\]\n\n| ​  || \\]) |\n\n| ​  ||\
  \  |\n\n| ​  || ​*\"*​​*Cat.jpg\"*​ |\n\n| ​  || |> StbImage.read_file!() |\n\n\
  | ​  || |> StbImage.resize(256, 256) |\n\n| ​  || |> StbImage.to_nx() |\n\n| ​ \
  \ || |> Nx.dot(invert_color_channels) |\n\n| ​  || |> Nx.as_type({​*:u*​, 8}) |\n\
  \n| ​  || |> Kino.Image.new() |\n\nAfter doing so, you’ll have a newly color-inverted\
  \ image:\n\n![images/HarnessingThePowerOfMath/InvertedCat.png](img/InvertedCat.png)\n\
  \nMost visual transformations map directly to linear transformations. You can use\
  \ linear transformations to reverse images, rotate images, shear images, and more.\
  \ Every linear transformation is associated with a matrix and can be thought of\
  \ as applying matrix multiplication between the input matrix and the transformation\
  \ matrix.\n\nIn Nx, matrix multiplications are done via the Nx.dot/2 operator. Dot\
  \ products between vectors are treated as normal dot products would be—taking an\
  \ element-wise product between each vector and then computing the sum. Vector-matrix\
  \ and matrix-matrix dot products are computed according to the rules of matrix multiplication,\
  \ meaning that the last dimension of the left-hand side of the operation contracts\
  \ along the first dimension of the right-hand side of the operation. You can see\
  \ the semantics of the Nx dot product in action in the following code snippet:\n\
  \n| ​  || vector = Nx.dot(Nx.tensor(\\[1, 2, 3\\]), Nx.tensor(\\[1, 2, 3\\])) |\n\
  \n| --- | --- |\n\n| ​  || vector_matrix = Nx.dot(Nx.tensor(\\[1, 2\\]), Nx.tensor(\\\
  [\\[1\\], \\[2\\]\\])) |\n\n| ​  || matrix_matrix = Nx.dot(Nx.tensor(\\[\\[1, 2\\\
  ]\\]), Nx.tensor(\\[\\[3\\], \\[4\\]\\])) |\n\n| ​  ||  |\n\n| ​  || vector |> IO.inspect(​*label:*​\
  \ ​*:vector*​) |\n\n| ​  || vector_matrix |> IO.inspect(​*label:*​ ​*:vector_matrix*​)\
  \ |\n\n| ​  || matrix_matrix |> IO.inspect(​*label:*​ ​*:matrix_matrix*​) |\n\n\
  This code returns the following output:\n\n| ​  || vector: #Nx.Tensor< |\n\n| ---\
  \ | --- |\n\n| ​  || s64 |\n\n| ​  || 14 |\n\n| ​  || \\> |\n\n| ​  || vector_matrix:\
  \ #Nx.Tensor< |\n\n| ​  || s64\\[1\\] |\n\n| ​  || \\[5\\] |\n\n| ​  || \\> |\n\n\
  | ​  || matrix_matrix: #Nx.Tensor< |\n\n| ​  || s64\\[1\\]\\[1\\] |\n\n| ​  || \\\
  [ \\]\n\n| ​  || \\[11\\] |\n\n| ​  || \\] |\n\n| ​  || \\> |\n\nDon’t worry too\
  \ much if the semantics of the dot product doesn’t make much sense. You’ll get plenty\
  \ of practice working with them throughout this book.\n\n## Thinking Probabilistically\n\
  \nNow that you understand how linear algebra helps you model data, you’re ready\
  \ to learn how probability helps you think about data and make predictions from\
  \ it.\n\nA crucial aspect of modern approaches to artificial intelligence is the\
  \ acceptance of probabilistic methods over logic-based approaches. Earlier generations\
  \ of researchers believed the secret to creating artificial intelligence was finding\
  \ enough good formal rules to capture patterns in language, speech, and other areas.\
  \ Unfortunately, logic-based systems grow exponentially with the difficulty of the\
  \ problem, and they don’t adapt well to chaotic systems. Modern approaches succeed\
  \ because they embrace uncertainty as a rule.\n\nThere are three primary tools used\
  \ in machine learning to reason about data and make predictions: probability theory,\
  \ decision theory, and information theory. In this section, you’ll learn about all\
  \ three and how they lay the foundation for modern machine learning algorithms.\
  \ Once again, this isn’t a comprehensive discussion. If you want to dive deeper\
  \ into the topic, read [*Pattern Recognition and Machine Learning* [Bis06]](#f_0098.xhtml#d1806e2)\
  \ or [*Probabilistic Machine Learning* [Mur22]](#f_0098.xhtml#d1806e1265).\n\n###\
  \ Reasoning About Uncertainty\n\nProbability theory is a framework for understanding\
  \ uncertainty. Recall that earlier approaches to artificial intelligence relied\
  \ on enumerating formal logic-based rules to come to conclusions about data. With\
  \ perfect information and infinite computing power, logic-based approaches would\
  \ yield perfect results. In this context, “perfect information” means you have access\
  \ to every scenario your algorithm will be exposed to in practice.\n\nImagine you\
  \ were given the task of designing a machine that sorts coins. You were guaranteed\
  \ your machine will only ever be given US denominations—specifically quarters, dimes,\
  \ nickels, and pennies. You have access to “perfect information,” and you can design\
  \ a system that handles all four cases correctly. For example, because you know\
  \ the specifications of each case ahead of time, you can design a machine that sorts\
  \ coins based on their size. Unfortunately, this “perfect information” scenario\
  \ requires strong assumptions that break down in real-world contexts:\n\n1.  You\
  \ assume your machine will only ever encounter four coins in US denominations. What\
  \ if somebody accidentally gives your machine a half-dollar or a gold-dollar? What\
  \ happens if somebody gives your machine a non-US coin?\n\n\n\n2. 你假设你机器接收到的所有硬币都完美符合你预期的四种场景中的一种规格。如果有些硬币损坏了呢？如果有些硬币粘在一起了呢？如果美国铸币厂错误地铸造了一个比一角币还小的四分之一美元硬币呢？\n\
  \n3. 以大小排序是否是一个完美的方法？有没有可能你机器组装得不完美，偶尔一个一角币会混在便士里面？\n\n你会发现不确定性是生活的常态，而在某些应用中，忽略不确定性是合理的，而在其他应用中，则最好完全接受它。例如，如果你想设计一个能够检测图像中是否包含鸟类的算法，你不可能枚举所有鸟类物种、它们在图像中的可能姿态、拍摄环境等等。机器学习在充满不确定性的情境中表现出色，因为不确定性是内建的假设。\n\
  \n绝大多数应用都是绝对不确定的。在[*Deep Learning Book* [GBC16]](#f_0098.xhtml#d1806e648)一书中，作者指出三种将在每个问题中出现的不确定性来源：\n\
  \n1. 固有随机性。某些问题本质上是随机的，这意味着不确定性或随机性是内建的。无论如何，结果都不是确定性的。\n\n2. 信息不完整。如果你不知道决定系统行为的所有变量，系统总会带有一定的不确定性。在机器学习中，你永远无法获得决定结果的所有变量。\n\
  \n3. 模型不完整。一些模型有意有意地丢弃信息。例如，为了加快处理速度，通常会对图像进行下采样。下采样有意丢弃了一部分信息，因此你无法完整地建模问题。\n\n\
  鉴于你在创建模型时必然会遇到不确定性的来源，你需要理解如何量化不确定性、如何解读不确定的数值，以及如何利用不确定性来为自己服务。\n\n在数学和机器学习中，概率是对不确定性的度量或量化。你可能已经熟悉概率的传统意义。毫无疑问，你在学习时被介绍过概率，即事件在长期中出现的可能性。你对概率的理解使你能够回答诸如：如果你有一顶帽子里有两个红球和三个蓝球，你抽到红球的概率是多少？这与前文所呈现的频率主义概率观相符，即事件的长期频率。频率主义的概率解释强调重复试验。例如，在\
  \ Livebook 单元中，运行以下代码：\n\n| ​  || simulation = ​**fn**​ key -> |\n\n| --- | ---\
  \ |\n\n| ​  || {value, key} = Nx.Random.uniform(key) |\n\n| ​  || ​**if**​ Nx.to_number(value)\
  \ < 0.5, ​**do**​: {0, key}, ​**else**​: {1, key} |\n\n| ​  || ​**end**​ |\n\n这段函数使用\
  \ Nx.Random 模块创建一个标量随机变量，并将其转换为普通 Elixir 数字。请注意，Nx 使用状态无关的伪随机数生成器（PRNG），这意味着每次你想要一个随机数，都需要显式传递一个\
  \ key。Nx.Random.uniform/1 和类似函数会返回一个更新后的 key，你可以将其传递给后续的随机函数以获得不同的结果。将相同的 key 传递给\
  \ Nx 的随机函数且参数相同，会产生可重复的行为。\n\n在创建随机数后，模拟检查该变量。如果变量小于 0.5，则返回 0；如果变量大于或等于 0.5，则返回\
  \ 1。模拟还会返回更新后的 key，以便在后续的模拟运行中使用。\n\n假设随机数生成器是完美的随机，那么如果你运行该函数 10 次，1 出现的次数大约是多少？100\
  \ 次？1,000 次？10,000 次？运行以下代码查看结果：\n\n| ​  || key = Nx.Random.key(42) |\n\n| --- |\
  \ --- |\n\n| ​  ||  |\n\n| ​  || for n <- \\[10, 100, 1000, 10000\\] ​**do**​ |\n\
  \n| ​  || Enum.map_reduce(1..n, key, ​**fn**​ \\_, key -> simulation.(key) ​**end**​)\
  \ |\n\n| ​  || |> elem(0) |\n\n| ​  || |> Enum.sum() |\n\n| ​  || |> IO.inspect()\
  \ |\n\n| ​  || ​**end**​ |\n\n大约两分钟后，你会看到以下结果：\n\n| ​  || 6 |\n\n| --- | --- |\n\
  \n| ​  || 49 |\n\n| ​  || 501 |\n\n| ​  || 5025 |\n\n注意到，随着试验次数的增加，出现 1 的频率开始趋近于大约一半的时间。这意味着如果你运行这个模拟无限次，一半的时间里，事件会是\
  \ 1。\n\n在这个例子中，你可以说模拟返回 1 的概率是 0.5。从频率主义的角度看，0.5 的概率意味着在无限多次试验中，该事件恰好每两次试验中有一次会发生。概率在无限时间框架下帮助你讨论单次模拟的预期结果。单次模拟的结果本身带有内建的不确定性。你无法用基于逻辑的规则来评估单次运行的结果。相反，你可以用概率来量化单次模拟的结果，从而表达事件的不确定性。\n\
  \n| Not So Random |\n\n| --- |\n\n| ![images/aside-icons/warning.png](img/warning.png)\
  \ || 事实上，计算机上的随机数生成器并不产生真正的随机数，因此抽到 1 的真实概率可能会略微偏向一侧——尽管这通常在很小的精度范围内。计算机上的随机数生成器通常是伪随机数生成器，具有非常大的周期。这意味着在有限的抽样次数后，它们会重复相同的序列。在无限尺度上，伪随机数生成器（PRNG）抽到\
  \ 1 的概率等于它在一个完整周期内观察到的抽到 1 的频率。\n\n#### All About Bayes\n\n频率主义的概率解释在易于重复的场景中有用且易于理解，但有些应用并不关注可重复的试验。例如，如果医生说病人患某病的概率是\
  \ 60%，他们到底是什么意思？医生并不是在谈论病人在无限多个试验（或无限多个宇宙）中患病的概率。相反，医生是在基于他们手头的信息，量化病人患病的不确定性。贝叶斯视角根本上与可用信息有关，随着更多信息的出现，概率会被更新。\n\
  \n一个著名的贝叶斯解释在实践中的例子是“蒙提·霍尔问题”（Monty Hall problem）。这个问题取名自“让我们谈谈交易”（Let’s Make a\
  \ Deal）的主持人蒙提·霍尔。在节目中，参赛者被给予在三扇门中选择一个的机会。其中一扇门后有一个奖品，比如一辆运动汽车，而另外两扇门则有“Zonks”，即不想要的奖品。参赛者选定一扇门后，主持人蒙提·霍尔会打开一扇未选中的、包含“Zonk”的门。随后，蒙提给参赛者一个机会，让他们在原始门和剩余未打开的那扇门之间进行选择。\n\
  \n\n\n\n问题是关于在被告知其中一扇门后，是选择换门还是保持原门的最优策略。数学上，你应该始终选择换门，因为未打开的那扇门中奖品的概率是 2/3，远高于你最初选择的那扇门的概率。起初这可能看起来不太合理。每扇门中奖品的初始概率都是\
  \ 1/3。但请记住，你需要根据可用的信息更新你的评估。你选择的那扇门中奖品的概率是 1/3，而你选择的那扇门不含奖品的概率是 2/3。当蒙蒂·霍尔（Monty\
  \ Hall）打开其中一扇门并揭示一辆“佐恩车”（Zonk）后，奖品不在你门中这一概率就“集中”在剩余的未选门上。\n\n蒙蒂·霍尔问题（Monty Hall\
  \ problem）是贝叶斯定理（Bayes’ Theorem）的经典体现。贝叶斯定理描述了基于现有信息或另一事件发生而对事件的条件概率。贝叶斯定理是描述在新证据出现时，如何更新概率的规则。\n\
  \n你可以在以下链接中看到该结果的可视化：table。\n\n| Door with car || I chose || If stay || If switch\
  \ |\n| --- | --- | --- | --- |\n| A || A || Win car || Win goat |\n| --- | --- |\
  \ --- | --- |\n| A || B || Win goat || Win car |\n| A || C || Win goat || Win car\
  \ |\n| B || A || Win goat || Win car |\n| B || B || Win car || Win goat |\n| B ||\
  \ C || Win goat || Win car |\n| C || A || Win goat || Win car |\n| C || B || Win\
  \ goat || Win car |\n| C || C || Win car || Win goat |\n\n请注意，在六种你选择换门的情形中，你赢得了汽车。\n\
  \n当你阅读这本书时，你会更深刻地感受到概率操作的机制。此外，你会看到贝叶斯概率视角与机器学习非常契合。人类天生就是贝叶斯概率的实践者。随着你在生活中获得新信息，你会更新你的估计。你在对周围环境进行推断或预测。机器学习模型也做同样的事。但预测之后你会做什么？你会做出决策。\n\
  \n### 做决策\n\n想象你被告知你最喜欢的运动队在下一场比赛中有 60% 的获胜概率。随后你被要求在这场比赛上下注。你该如何决定？你会运用决策理论。决策理论提供了在不确定性存在时最优行动的框架。\n\
  \n在不确定性下做决策时，你首先需要考虑你的目标。在下注的例子中，你的目标是赚钱，所以可能不太合理去下注获胜概率为 60% 的队伍，因为潜在回报可能太低。这种逻辑同样适用于机器学习模型。你需要考虑模型的目标，以便在推断后做出决策。\n\
  \n通常，推断后的决策更为容易。例如，如果你有一个模型预测图像是苹果还是橙子的概率，而你的目标是最大化准确率，那么当你认为它是苹果的概率大于 0.5 时，你会将图像分类为苹果；否则分类为橙子。基于推断概率的这一规则构成了决策边界。想象一条空间中的线：如果你的预测落在一边，你采取一种行动；如果落在另一边，则采取另一种行动。\n\
  \n当然，机器学习中也存在更复杂的决策场景。例如，你不只是最大化准确率，还可能希望最大化回报或最小化成本。再回到下注例子，即使你对某支队伍获胜的可能性大于失利的可能性，选择下注该队伍可能仍不是最佳选择，因为该行动伴随相应的成本或风险。\n\
  \n最后一种需要考虑的决策场景是完全不做决策。根据具体应用，根据给定的概率采取不作为可能是合理的。例如，假设你的苹果和橘子分类器收到一张香蕉的图片，并且它输出的概率让你觉得模型对图片所属类别不确定。在这种情况下，正确的做法是不将图片分类为苹果或橘子。\n\
  \n### 从观察中学习\n\n概率机器学习的最后一个工具是信息论。信息论提供了关于系统中信息进行推理的框架。信息论由数学家克劳德·香农在其 [*Mathematical\
  \ Theory of Communication* [Sha48]](#f_0098.xhtml#d1806e1526) 中开创。\n\n信息论是研究如何在序列和符号中编码信息，以及研究这些\
  \ medium 中可以存储和传输多少信息的数学学科。通常，信息论被认为是在通信和信号处理的背景下，但信息论为机器学习算法的发展提供了强大的基础。\n\n为了理解信息论的作用，让我们考虑一个例子。假设你总是看到邻居在同一时间每天经过你家。日复一日，邻居总是以相同的时间经过。从看到邻居每天经过这一事实，你能获得什么新信息？除了你立即观察到的，你很难获取其他信息。邻居的走动是一种必然。但如果有一天你看不到邻居经过，你会学到什么？发生了什么事？你有多惊讶？在信息论中，我们关注的是特定观察的惊讶程度。看到邻居每天经过并不惊讶。不看到邻居经过则是惊讶的。\n\
  \n## 追踪变化\n\n如果你在机器学习领域稍有涉猎，你大概率已经听说过导数、梯度和自动微分等术语。这些术语都源于向量微积分。\n\n向量微积分关注的是对向量场或函数进行微分和积分。如果你不是数学方面的人，这些概念可能听起来有些令人望而却步。幸运的是，你不需要深入理解这些概念；你只需要熟悉它们。如果你对“可微函数”这一说法不感到困惑，你大概率已经具备机器学习所需的微积分知识。在这一节中，你将了解一些术语，并看到向量微积分与机器学习的关系。然后你会看到\
  \ Nx 是如何为你承担大部分繁重工作的。\n\n### 理解微分\n\n在机器学习（以及即使在微积分本身）中最重要的概念是导数。导数是函数在某一点的瞬时变化率的度量。经典的导数例子是位置和速度。假设你有一个函数，用来绘制你在固定轴上的位置随时间变化的情况。位置函数的导数给出了你的速度，即你的位置在给定时间点上变化的快慢。例如，如果你在绘制火箭的高度随时间变化的情况，它的位置对应高度，而速度对应火箭的移动速度（即位置随时间的变化速率）。\n\
  \n你可以将函数在给定点的导数可视化为经过该点的切线，或者仅仅是与该点相切的直线：\n\n![images/HarnessingThePowerOfMath/TangentLine.png](img/TangentLine.png)\n\
  \n\n\n-   为什么你要在意导数这么多？如果你上过微积分课，可能记得用导数手动求函数的局部（以及全局）最大值和最小值。直观上，你可以看到下面所示区间中该函数的最大值和最小值处的导数为\
  \ 0：\n\n![images/HarnessingThePowerOfMath/MaxAndMin.png](img/MaxAndMin.png)\n\n\
  给定一个函数，你可以手动计算其导数来确定哪个输入会使函数最大或最小。例如，假设你经营了一家莓果农场，并且拥有一个分析工具，它可以根据一年中种植的莓果树数量来预测利润。为了在该年最大化利润，你可以计算利润函数的导数，从而确定能够最大化利润的莓果树数量。Nx\
  \ 使求导过程变得简单。例如，考虑以下模型利润的函数，输入变量 x 表示一年内种植的莓果树数量：\n\n| ​  || ​**defmodule**​ BerryFarm\
  \ ​**do**​ |\n| --- | --- |\n| ​  || ​**import**​ Nx.Defn |\n| ​  || ​ |\n| ​  ||\
  \ defn profits(trees) ​**do**​ |\n| ​  || trees |\n| ​  || |> Nx.subtract(1) |\n\
  | ​  || |> Nx.pow(4) |\n| ​  || |> Nx.negate() |\n| ​  || |> Nx.add(Nx.pow(trees,\
  \ 3)) |\n| ​  || |> Nx.add(Nx.pow(trees, 2)) |\n| ​  || ​**end**​ |\n| ​  || ​**end**​\
  \ |\n\n你可以使用 VegaLite（Elixir 对 Vega 绘图库的绑定）通过以下代码来可视化该函数：\n\n| ​  || trees = Nx.linspace(0,\
  \ 4, ​*n:*​ 100) |\n| --- | --- |\n| ​  || profits = BerryFarm.profits(trees) |\n\
  | ​  || |\n| ​  || alias VegaLite, ​*as:*​ Vl |\n| ​  || |\n| ​  || Vl.new(​*title:*​\
  \ ​*\"*​​*Berry Profits\"*​, ​*width:*​ 1440, ​*height:*​ 1080) |\n| ​  || |> Vl.data\\\
  _from\\_values(%{ |\n| ​  || ​*trees:*​ Nx.to\\_flat\\_list(trees), |\n| ​  || ​*profits:*​\
  \ Nx.to\\_flat\\_list(profits) |\n| ​  || }) |\n| ​  || |> Vl.mark(​*:line*​, ​*interpolate:*​\
  \ ​*:basis*​) |\n| ​  || |> Vl.encode\\_field(​*:x*​, ​*\"*​​*trees\"*​, ​*type:*​\
  \ ​*:quantitative*​) |\n| ​  || |> Vl.encode\\_field(​*:y*​, ​*\"*​​*profits\"*​,\
  \ ​*type:*​ ​*:quantitative*​) |\n\n运行后，你会看到以下图表：\n\n![images/HarnessingThePowerOfMath/BerryProfits.png](img/BerryProfits.png)\n\
  \n使用 Nx，你可以计算并可视化利润函数的导数，或者通过以下函数在 BerryFarm 模块中添加来观察利润随树木数量的变化：\n\n| ​  || ​**defmodule**​\
  \ BerryFarm ​**do**​ |\n| --- | --- |\n| ​  || ​**import**​ Nx.Defn |\n| ​  || ​\
  \ |\n| ​  || defn profits(trees) ​**do**​ |\n| ​  || \\-((trees - 1) \\*\\* 4) +\
  \ (trees \\*\\* 3) + trees \\*\\* 2 |\n| ​  || ​**end**​ |\n| ​  || |\n| ​  || defn\
  \ profits\\_derivative(trees) ​**do**​ |\n| ​  || grad(trees, &profits/1) |\n| ​ \
  \ || ​**end**​ |\n| ​  || ​**end**​ |\n\n现在，运行以下代码即可在同一张图中绘制利润函数及其导数：\n\n| ​  ||\
  \ trees = Nx.linspace(0, 3, ​*n:*​ 100) |\n| --- | --- |\n| ​  || profits = BerryFarm.profits(trees)\
  \ |\n| ​  || profits\\_derivative = BerryFarm.profits\\_derivative(trees) |\n| ​ \
  \ || |\n| ​  || alias VegaLite, ​*as:*​ Vl |\n| ​  || |\n| ​  || title = ​*\"*​​*Berry\
  \ Profits and Profits Rate of Change\"*​ |\n| ​  || Vl.new(​*title:*​ title, ​*width:*​\
  \ 1440, ​*height:*​ 1080) |\n| ​  || |> Vl.data\\_from\\_values(%{ |\n| ​  || ​*trees:*​\
  \ Nx.to\\_flat\\_list(trees), |\n| ​  || ​*profits:*​ Nx.to\\_flat\\_list(profits),\
  \ |\n| ​  || ​*profits\\_derivative:*​ Nx.to\\_flat\\_list(profits\\_derivative)\
  \ |\n| ​  || }) |\n| ​  || |> Vl.layers([ |\n| ​  || Vl.new() |\n| ​  || |> Vl.mark(​*:line*​,\
  \ ​*interpolate:*​ ​*:basis*​) |\n| ​  || |> Vl.encode\\_field(​*:x*​, ​*\"*​​*trees\"\
  *​, ​*type:*​ ​*:quantitative*​) |\n| ​  || |> Vl.encode\\_field(​*:y*​, ​*\"*​​*profits\"\
  *​, ​*type:*​ ​*:quantitative*​), |\n| ​  || |\n| ​  || Vl.new() |\n| ​  || |> Vl.mark(​*:line*​,\
  \ ​*interpolate:*​ ​*:basis*​) |\n| ​  || |> Vl.encode\\_field(​*:x*​, ​*\"*​​*trees\"\
  *​, ​*type:*​ ​*:quantitative*​) |\n| ​  || |> Vl.encode\\_field(​*:y*​, ​*\"*​​*profits\\\
  _derivative\"*​, ​*type:*​ ​*:quantitative*​) |\n| ​  || |> Vl.encode(​*:color*​,\
  \ ​*value:*​ ​*\"*​​**#**​​*ff0000\"*​) |\n| ​  || \\]) |\n| ​  || |\n| ​  || |\n\
  随后，你会看到以下图表：\n\n![images/HarnessingThePowerOfMath/BerryDerivative.png](img/BerryDerivative.png)\n\
  \n需要注意的是，利润函数的导数恰好在函数达到最大值的同时为 0。通过追踪导数直到它为 0，你可以找到原函数的极值点。\n\n在本例中，你使用了 grad/2\
  \ 函数来计算导数。但 grad/2 为什么叫 grad/2 而不是 derivative 呢？grad/2 是 Nx 提供的一个函数，用于计算标量函数的梯度。\n\
  \n梯度是标量函数变化最快的方向。你可以把标量函数看作是一个接受 rank‑N 张量作为输入并返回标量张量作为输出的 Nx 函数。梯度就像一枚热追导弹，会自动指向变化的方向。对于高维输入，计算梯度可以帮助你找到极值点。考虑下面的例子：假设你在一艘船上漂浮在湖中，需要尽快找到湖中最深的位置，只能使用深度测量仪。你被扔在湖的中间，没有时间逐点测量深度。你可以计算每个方向的深度变化，并始终沿着变化最剧烈的方向前进，这样就能保证快速到达更深的点。如果湖底像山谷一样，你就能沿着最陡峭的路径找到最深处。\n\
  \n使用最陡降方向寻找湖中最深点的过程与在机器学习中使用梯度下降来优化目标函数的过程相同。梯度下降之所以有用，是因为你通常无法获得目标函数的完整梯度——就像在湖中无法直接得到每个点的深度变化。相反，你只能观察少量样本并据此调整方向。\n\
  \n在这本书的整个过程中，你会使用梯度来优化模型参数，以在各类机器学习任务中提升性能。许多本书中的示例会抽象化 grad/2 的使用，但仍会在几处显式展开。那么，grad/2\
  \ 是什么，它是如何工作的？\n\n### 自动微分与 defn\n\nNx 的一个关键特性是能够进行自动微分。自动微分是从程序中计算导数的过程，它比数值逼近梯度更精确，也比符号微分更高效。自动微分是一个研究丰富的领域。\n\
  \n在本节中，你将看到如何使用 Nx 计算一个简单函数的梯度，为后续使用 Nx 优化更复杂模型奠定基础。更深入的自动微分处理请参阅 [*Evaluating Derivatives* [GW08]](#f_0098.xhtml#d1806e759)。\n\
  \nNx 的 defn 允许你通过 grad 函数计算标量函数的导数。首先，在新模块中创建以下标量函数：\n\n| ​  || ​**defmodule**​\
  \ GradFun ​**do**​ |\n| --- | --- |\n| ​  || ​**import**​ Nx.Defn |\n| ​  || ​ |\n\
  | ​  || defn my\\_function(x) ​**do**​ |\n| ​  || x |\n| ​  || |> Nx.cos() |\n|\
  \ ​  || |> Nx.exp() |\n| ​  || |> Nx.sum() |\n| ​  || |> print\\_expr() |\n| ​ \
  \ || ​**end**​ |\n| ​  || ​**end**​ |\n\n\n\n\nThis function takes the element-wise\
  \ cosine, followed by the element-wise exponential of an input tensor, before taking\
  \ the sum of the entire tensor. Both the element-wise cosine and element-wise exponential\
  \ apply mathematical functions to each element in the input. The element-wise cosine\
  \ applies the cosine function, while the element-wise exponential applies the exponential\
  \ function. Remember, gradients are the direction of steepest change for scalar\
  \ functions, so your function must return a scalar tensor. Additionally, gradients\
  \ are only valid for continuous value functions, so your function must return a\
  \ floating-point type.\n\nNext, add the following function to your module:\n\n|\
  \ ​  || defn grad_my_function(x) ​**do**​ |\n\n| --- | --- |\n\n| ​  || grad(x,\
  \ &my_function/1) |> print_expr() |\n\n| ​  || ​**end**​ |\n\nHere, you take the\
  \ gradient of my_function and return its value. You also inspect the gradient expression\
  \ for my_function. The complete module looks like this:\n\n| ​  || ​**defmodule**​\
  \ GradFun ​**do**​ |\n\n| --- | --- |\n\n| ​  || ​**import**​ Nx.Defn |\n\n| ​ \
  \ ||  |\n\n| ​  || defn my_function(x) ​**do**​ |\n\n| ​  || x |\n\n| ​  || |> Nx.cos()\
  \ |\n\n| ​  || |> Nx.exp() |\n\n| ​  || |> Nx.sum() |\n\n| ​  || |> print_expr()\
  \ |\n\n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || defn grad_my_function(x) ​**do**​\
  \ |\n\n| ​  || grad(x, &my_function/1) |> print_expr() |\n\n| ​  || ​**end**​ |\n\
  \n| ​  || ​**end**​ |\n\nNow, run the following cell to obtain the gradient of a\
  \ given input tensor:\n\n| ​  || GradFun.grad_my_function(Nx.tensor([1.0, 2.0, 3.0]))\
  \ |\n\n| --- | --- |\n\nYou’ll see these outputs:\n\n| ​  || #Nx.Tensor< |\n\n|\
  \ --- | --- |\n\n| ​  || f32 |\n\n| ​  ||  |\n\n| ​  || Nx.Defn.Expr |\n\n| ​  ||\
  \ parameter a:0 f32[3] |\n\n| ​  || b = cos a f32[3] |\n\n| ​  || c = exp b f32[3]\
  \ |\n\n| ​  || d = sum c, axes: nil, keep_axes: false f32 |\n\n| ​  || > |\n\n|\
  \ ​  || #Nx.Tensor< |\n\n| ​  || f32[3] |\n\n| ​  ||  |\n\n| ​  || Nx.Defn.Expr\
  \ |\n\n| ​  || parameter a:0 f32[3] |\n\n| ​  || b = cos a f32[3] |\n\n| ​  || c\
  \ = exp b f32[3] |\n\n| ​  || d = sin a f32[3] |\n\n| ​  || e = negate d f32[3]\
  \ |\n\n| ​  || f = multiply c, e f32[3] |\n\n| ​  || > |\n\n| ​  || #Nx.Tensor<\
  \ |\n\n| ​  || f32[3] |\n\n| ​  || [-1.444406509399414, -0.5997574925422668, -0.05243729427456856]\
  \ |\n\n| ​  || > |\n\nFirst, take note of the two expression outputs. The first\
  \ expression is the original function, but you never invoked the original function.\
  \ So how is this possible? Under the hood, Nx is actually executing a forward pass\
  \ or evaluation trace of the original function given your inputs. Nx computes the\
  \ forward expression, and then recursively applies the chain-rule backwards through\
  \ the forward trace to obtain the gradient of the original function. This backwards\
  \ evaluation of the chain-rule is called backpropagation or reverse-mode automatic\
  \ differentiation. If you’re familiar with the differentiation rules for the functions\
  \ used in my_function/1, the connection between the first and second expressions\
  \ should be obvious. The derivative of cos(x) is negate(sin(x)), and the derivative\
  \ of exp(x) is exp(x). You can see Nx computed both of those derivatives for you,\
  \ and correctly applied the chain-rule by composing the derivatives of the decomposed\
  \ function. You can more easily visualize it here, where d indicates the derivative\
  \ of an expression:\n\n| ​  || parameter a:0 -> da = a |\n\n| --- | --- |\n\n| ​ \
  \ || b = cos a -> db = negate(sin(a)) |\n\n| ​  || c = exp b -> dc = multiply(exp(b),\
  \ db) |\n\nNotice that computing the derivative of the original function is essentially\
  \ as easy as recursively computing derivatives of intermediate functions. You transform\
  \ your original function into a new one by transforming the intermediate expressions\
  \ with established gradient rules. If you’re interested in a deeper dive, the Nx\
  \ source code is a great place to look and understand what’s going on under the\
  \ hood.\n\n## Wrapping Up\n\nIn this chapter, you learned about the high-level mathematical\
  \ concepts used in machine learning algorithms. You now have a better understanding\
  \ of the foundations your future models will build on and the resources and tools\
  \ you’ll need to study the math further. In the next chapter, you’ll see some of\
  \ this math tie together, and you’ll see how to frame machine learning problems\
  \ as optimization problems.\n\n#### Footnotes\n\n[\\[6\\]](#f_0025.xhtml#FNPTR-6)\n\
  \n: \n\n[`hexdocs.pm/vega_lite/VegaLite.html`](https://hexdocs.pm/vega_lite/VegaLite.html)\n\
  \nCopyright © 2024, The Pragmatic Bookshelf.\n\n\n\n在这张散点图中，请注意输入 X 和输出 Y 之间的关系。你会如何画一条直线，以最小化该散点图中每个示例与直线之间的总距离？然后，利用你刚刚画出的直线，如何对新的\
  \ X 输入预测 Y 的值？后退一步，你会发现你画的这条直线是 `do_something` 函数在 `predict` 中的可视化表示。\n\n当给出一个未见的输入\
  \ X 时，你可以通过沿着这条直线预测其预期输出 Y。如果你能回想起小学数学课，你会记得直线不过是两个参数的可视化：m，即直线的斜率，以及 b，即直线的截距。当你把你画的这条直线视为\
  \ `predict` 函数中正在进行的转换的可视化表示时，你会发现该函数更像这样：\n\n| ​  || ​**def**​ `predict`(input,\
  \ m, b) ​**do**​ |\n\n| --- | --- |\n\n| ​  || label = m * input + b |\n\n| ​  ||\
  \ label |\n\n| ​  || ​**end**​ |\n\n在这里，`input` 等同于 X；`label` 等同于 Y；而 m 和 b 是你画的直线的参数。\n\
  \n所有这些说明机器学习在实践中主要关注寻找最佳参数，以将输入转换为标签。但这些参数的形式不一定像 m 和 b 那样简单。这个演示是二维线性回归的简化例子——更多关于线性回归的内容见第\
  \ 5 章 ​*Traditional Machine Learning*​。\n\n在实践中，机器学习算法的转换形式和参数会因问题而异，并且通常维度要高得多。因此，与其固定在\
  \ m 和 b 上，不如更实际、更通用地说 `predict` 看起来更像这样：\n\n| ​  || ​**def**​ `predict`(input) ​**do**​\
  \ |\n\n| --- | --- |\n\n| ​  || label = f(input, params) |\n\n| ​  || label |\n\n\
  | ​  || ​**end**​ |\n\n这里，f 表示你所选择的机器学习算法执行的转换，params 表示该算法学习到的参数。目标是找到能够最好地映射输入到标签的参数。理想情况下，你希望找到\
  \ params 使得 f 在任务上表现最佳。你希望优化 params 以在你的任务上实现最佳性能。\n\n### 最小化风险以最大化性能\n\n机器学习的核心是寻找模型的最佳参数。请回顾第\
  \ 1 章 ​*Make Machines That Learn*​，机器学习系统的性能是通过不可见的测试集来衡量的。你在第 1 节中也看到了这一点。\n\n\
  如果目标是得到一个 `predict` 函数，其参数经过优化，能够正确为未见输入分配标签，你可能会想：如何优化一个你无法直接观察的东西？\n\n与其直接为不可见的测试集优化性能，你实际上是为可用的训练集优化性能。通过这样做，你希望训练集能够捕捉到不可见测试集的足够特征，使得模型的参数能够最佳地为未见输入分配标签。\n\
  \n在训练过程中，你定义一个损失函数（loss function）或成本函数，然后尝试根据模型的参数对其进行优化。参数化的损失函数是你的整体目标函数。机器学习问题中模型、参数、损失函数和目标函数之间的关系如下\
  \ Elixir 代码所示：\n\n| ​  || ​**def**​ `model`(params, inputs) ​**do**​ |\n\n| ---\
  \ | --- |\n\n| ​  || labels = f(params, inputs) |\n\n| ​  || labels |\n\n| ​  ||\
  \ ​**end**​ |\n\n| ​  ||  |\n\n| ​  || ​**def**​ `loss`(actual_labels, predicted_labels)\
  \ ​**do**​ |\n\n| ​  || loss_value = measure_difference(actual_labels, predicted_labels)\
  \ |\n\n| ​  || loss_value |\n\n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || ​**def**​\
  \ `objective`(params, actual_inputs, actual_labels) ​**do**​ |\n\n| ​  || predicted_labels\
  \ = model(params, actual_inputs) |\n\n| ​  || loss(actual_labels, predicted_labels)\
  \ |\n\n| ​  || ​**end**​ |\n\n`model` 是一个函数，它使用 params 将 inputs 转换为 labels。`loss`\
  \ 是一个函数，用于衡量实际标签与预测标签之间的差异。损失函数应提供某种正确性的指示或度量。\n\n假设你想训练一个模型来预测 NBA 比赛中两支球队的总得分。你可以将损失定义为实际得分与模型预测得分之间的平方差（即平方误差）。如果模型预测总得分为\
  \ 242，实际总得分为 245，则该比赛的损失为 9。你将在第 ​*Defining Objectives*​ 章节中看到许多不同类型的损失函数。\n\n请注意，目标函数是基于损失函数、模型和参数的参数化函数。目标函数衡量模型在真实训练示例上的损失。机器学习中的学习过程本质上是对目标函数进行优化。\n\
  \n你可以使用已知的各种优化技术或求解器来优化目标函数。有些目标函数可以 analytically（解析地）求解，而其他则需要数值优化来找到近似解。\n\n正如你所知道的，机器学习在很大程度上依赖于优化——这可能让人难以看出机器学习与纯粹优化或曲线拟合的区别。考虑这一点：机器学习关注未见输入的性能。更具体地说，它关注降低未见输入上的泛化误差。\n\
  \n在统计学习理论中，泛化误差也称为风险，你的目标是最小化风险。然而，当你无法获得整个可能输入分布时，无法直接对风险进行优化。因此，你会优化经验风险，即模型在经验分布（即训练集）上的表现。\n\
  \n理论上，经验分布与真实输入分布在某些意义上是等价的，因此最小化经验风险等价于最小化真实风险。但在实践中，由于数据有限以及计算能力有限，总存在捕捉无限分布的错误。\n\
  \n最小化经验风险的过程称为经验风险最小化（ERM），是纯粹优化与机器学习的关键区别。当你拥有整个分布时，你可以直接用优化来最小化风险。当你没有整个分布时，你可以通过最小化经验风险间接地最小化风险。前者是一个优化问题；后者是一个机器学习问题。\n\
  \n### 定义目标\n\n模型最佳参数的定义受你在定义机器学习任务时所设定的约束和目标的制约。请回顾第 1 章 ​*Make Machines That Learn*​，在设计机器学习系统时，你需要定义\
  \ SMART 任务。这一需求在机器学习的训练过程中的重要性显而易见。\n\n此外，机器学习算法几乎从不直接优化你真正关心的性能指标。例如，你不会在机器学习算法中直接优化模型的准确率或分类错误。相反，机器学习算法使用替代损失函数。\n\
  \n\n\n\n-   [替代损失函数](https://example.org) 作为真实目标的代理。这些损失函数通常更容易优化，优化它们也间接优化了你关心的性能目标。例如，使用平方误差作为绝对误差的替代更为常见，因为平方误差函数具有使优化更容易的性质。替代损失函数的选择通常取决于机器学习任务和模型类型。\n\
  \n*   研究机器学习中使用的两种最常见的损失函数。\n\n*   了解它们的使用原因和适用时机。\n\n*   了解它们与上一章节所学习的概率课程之间的关系。\n\
  \n#### 可能性估计\n\n此时，你可能在想损失函数实际上测量的是什么。为了回答这个问题，你首先需要理解可能性。\n\n在统计学中，可能性函数（或简称“可能性”）描述了观测数据作为其参数的概率函数。可以将可能性视为一种“真相仪”。统计学学习理论假设存在某个真实函数生成数据，可能是这样的：\n\
  \n| ​  || ​**def**​ datagen(true\\_params) ​**do**​ |\n| --- | --- |\n| ​  || true\\\
  _f(true\\_params) |\n| ​  || ​**end**​ |\n\n在这个例子中，datagen 是一个带有真模型 true\\_f 和真参数\
  \ true\\_params 的数据生成函数。datagen/1 函数可以表示任何数据分布。\n\n假设 datagen/1 是生成一系列彩票中奖号码的数据生成函数。你有一系列彩票号码，想知道它们是中奖号码的可能性。如果你可以获取\
  \ true\\_params 和 true\\_f，你可以通过测量你的彩票号码与 datagen/1 生成的多个中奖号码样本之间的差异来测量可能性。\n\n\
  这个场景有点不现实，因为你很少能获得关于数据生成函数和参数的完美信息。更可能的情形是，你拥有若干中奖彩票，想要恢复生成中奖彩票的真实函数。你首先创建对原始 true\\\
  _f 和 true\\_params 的估计：\n\n| ​  || ​**def**​ estimate\\_datagen(estimate\\_params)\
  \ ​**do**​ |\n| --- | --- |\n| --- | --- |\n| ​  || estimate\\_f(estimate\\_params)\
  \ |\n| ​  || ​**end**​ |\n\n现在，你可以测量 estimate\\_params 生成你的中奖彩票的可能性，这本质上是测量你估计的数据生成函数与真实数据生成函数之间的相似性或距离。\n\
  \n在测量出估计数据生成器与真实数据生成器之间的相似性后，你会使用某种优化算法更新 estimate\\_params，然后再次测量。你通过优化 estimate\\\
  _params 来最大化其能够生成中奖彩票的可能性，即最大化 estimate\\_params 是生成中奖彩票的真实参数。在统计学学习理论中，这个优化过程称为最大似然估计（MLE）。使用最大似然估计器时，你的损失函数是函数之间的相似度度量。\n\
  \n#### 跨熵\n\n在机器学习中，你经常会在分类任务的上下文中看到“跨熵”一词。下面给出的函数定义了二分类任务中跨熵的含义：\n\n| ​  || defn\
  \ binary\\_cross\\_entropy(y\\_true, y\\_pred) ​**do**​ |\n| --- | --- |\n| ​  ||\
  \ y\\_true \\* Nx.log(y\\_pred) - (1 - y\\_true) \\* Nx.log(1 - y\\_pred) |\n| ​ \
  \ || ​**end**​ |\n\n该函数假设 y\\_true 是 0 或 1 的标签，表示二分类；y\\_pred 是介于 0 与 1 之间的概率，用于预测真实标签\
  \ y\\_true。\n\n跨熵也可以作为分类任务的损失函数，其中可能的类别数量可以无限大。虽然其在学术意义上不一定适用于所有分类任务，但在机器学习框架的分类问题中，跨熵的使用是惯例。\n\
  \n| **数值稳定性** |\n\n| --- |\n\n| ![images/aside-icons/warning.png](img/warning.png)\
  \ || 给出的二分类交叉熵实现在某些情况下可能不具备数值稳定性。你应该使用 Nx 生态系统中的 Axon 和 Scholar 实现。\n\n| --- | ---\
  \ |\n\n#### 均方误差\n\n均方误差（Mean Squared Error, MSE）衡量每个示例的损失为真实标签与预测标签之间的平均平方差。你可以在\
  \ Nx 中使用以下代码实现均方误差：\n\n| ​  || defn mean\\_squared\\_error(y\\_true, y\\_pred) ​**do**​\
  \ |\n| --- | --- |\n| ​  || y\\_true |\n| ​  || |> Nx.subtract(y\\_pred) |\n| ​ \
  \ || |> Nx.pow(2) |\n| ​  || |> Nx.mean(​*axes:*​ \\[-1\\]) |\n| ​  || ​**end**​\
  \ |\n\n均方误差常用于回归任务的优化目标，以取代绝对误差。绝对误差是真实标签与预测标签之间的绝对差值，计算方式为 Nx.abs(Nx.subtract(y\\\
  _true, y\\_pred))。均方误差总是非负的（假设只处理实数），因为差值被平方后消除了负号。\n\n### 收敛到解\n\n随着你继续深造机器学习，需要留意的概念之一是优化与机器学习中“收敛”的概念。大多数机器学习中使用的优化算法并不保证能找到最优解。这意味着它们不保证能够找到最佳的模型参数集合。\n\
  \n最佳的模型参数集合是整个参数空间的全局最优。在参数空间无限且函数无法解析优化的情况下，找到全局最优是不可能的。相反，优化算法是机械性的，设计为循环直到达到某个期望的性能阈值。\n\
  \n虽然在高参数空间中几乎不可能找到全局最优，但模型可以在局部最优上收敛。局部最优是参数空间中局部的、比邻近点更好的区域。\n\n把你的模型参数空间想象成大海：全局最优是马里亚纳海沟，而局部最优则是海中的小海沟和山谷。好在你不必担心模型无法收敛到全局最优。记住，训练机器学习系统的目标是实现真实任务的性能。即使不收敛到全局最优，甚至不收敛到任何最优，你的模型在任务上仍能表现良好。\n\
  \n#### 正则化以泛化\n\n正如你在上一节中学到的，机器学习与优化的区别在于机器学习关注未见数据的表现。在第 1 章 ​*Make Machines That\
  \ Learn*​，你学习到这一概念称为泛化。你的目标是训练能够泛化的模型——训练数据的表现不一定重要。\n\n想象你有两个模型。模型 A 在训练集上表现明显差，而模型\
  \ B 在训练集上表现更好。然而，模型 B 在测试集上表现明显优于模型 A。在这种情况下，你会倾向于选择哪个模型？\n\n基于你的主要目标是未见数据（例如测试集）的表现，你很可能会倾向于选择模型\
  \ B。但如何才能拥有一个在训练集上表现明显更差、在测试集上表现明显更好 的模型？\n\n答案是正则化。在深入正则化之前，需要了解模型容量以及过拟合和欠拟合的概念。\n\
  \n##### 过拟合、欠拟合与容量\n\n\n\n\n在本章中，你发现了两种用于解决学习问题的优化问题的学习框架：经验风险最小化（ERM）和最大似然估计（MLE）。ERM\
  \ 和 MLE 都会在训练集上的错误上优化模型参数，这意味着它们明确地拟合函数以匹配训练数据。这两种技术都容易出现过拟合。\n\n过拟合是指训练得到的模型在训练数据上错误很低，但在泛化到新数据时错误很高的情况。如果你用图形方式表示过拟合，它会看起来像下面的图：\n\
  \n![images/OptimizingEverything/Overfitting.png](img/Overfitting.png)\n\n注意观察，这条线完美地穿过了原始数据的每一个点。拟合函数完美匹配当前数据，但很可能对新数据泛化得不好。\n\
  \n模型也可能倾向于欠拟合。欠拟合是指模型在训练数据上错误本身就很高的情况。下面的图展示了过拟合和欠拟合的对比：\n\n![images/OptimizingEverything/OverfittingUnderfitting.png](img/OverfittingUnderfitting.png)\n\
  \n过拟合和欠拟合通常取决于模型的容量。模型的容量是指它拟合多种不同函数的能力。在设计机器学习模型时，你需要选择一个函数的假设空间。例如，线性回归假设你想拟合的真实模型是关于观测数据的线性模型。这意味着线性回归的假设空间仅限于线性函数。假设你使用一个形式为直线方程的模型：\n\
  \n| ​  || ​**def**​ model(x, params) ​**do**​ |\n| --- | --- |\n| ​  || {m, b} =\
  \ params |\n| ​  || m \\* x + b |\n| ​  || ​**end**​ |\n\n这个模型只有足够的容量来拟合直线。你可以通过添加另一项来增加其容量，从而包含二次函数：\n\
  \n| ​  || ​**def**​ model(x, params) ​**do**​ |\n| --- | --- |\n| ​  || {w0, w1,\
  \ w2} = params |\n| ​  || w0 + w1 \\* x + w2 \\* x \\*\\* 2 |\n| ​  || ​**end**​\
  \ |\n\n注意，这个过程可以一直进行下去——你可以不断添加多项式项和参数，以增加模型拟合 n 级多项式的能力。\n\n容量更高的模型比容量更低的模型更容易出现过拟合，因为高容量模型能拟合更广泛的复杂函数。例如，你可以用立方函数拟合所有二次函数，但不能用二次函数拟合所有立方函数。设计良好的模型意味着在过拟合和欠拟合之间找到平衡。\n\
  \n### 定义正则化\n\n在机器学习中，正则化是任何用于对抗过拟合，或者更广泛地说，用于降低泛化错误的技术，例如，在不一定降低训练错误的情况下，降低测试集上的错误。\n\
  \nERM 和 MLE 都容易出现过拟合。因此，正则化是许多机器学习算法的必要步骤。你在本书中会使用许多种类的正则化。本节将介绍两种对几乎所有机器学习算法都通用的正则化方法。\n\
  \n#### 复杂度惩罚\n\n复杂度惩罚是训练能够很好泛化的机器学习模型时常用的正则化器。复杂度惩罚在模型评估时通过添加一个带有惩罚系数的惩罚项来施加成本。惩罚项通常是模型参数的函数。例如，重量衰减是一种常见的正则化惩罚，它引入一个等于模型参数的\
  \ L2-范数的惩罚项。\n\nL2-范数是一个你可以理解为“距离原点的距离”的概念。例如，在二维空间中，点 {3, 4} 的 L2-范数是 5，由距离公式给出：\n\
  \n| ​  || defn distance(x, y) ​**do**​ |\n| --- | --- |\n| ​  || x |\n| ​  || |>\
  \ Nx.pow(2) |\n| ​  || |> Nx.add(Nx.pow(y, 2)) |\n| ​  || |> Nx.sqrt() |\n| ​  ||\
  \ ​**end**​ |\n\n假设你使用均方误差损失和重量衰减，你的完整目标函数可能如下：\n\n| ​  || ​**def**​ objective(params,\
  \ actual_inputs, actual_labels) ​**do**​ |\n| --- | --- |\n| ​  || lambda = 0.5\
  \ |\n| ​  || predicted_labels = model(params, actual_inputs) |\n| ​  || loss = mean_squared_error(actual_labels,\
  \ actual_inputs) |\n| ​  || penalty = l2_norm(params) |\n| ​  || |\n| ​  || loss\
  \ + lambda * penalty |\n| ​  || ​**end**​ |\n\nlambda 控制重量衰减惩罚的强度，lambda 越大，对模型训练的影响越大。重量衰减表达了倾向于更小模型权重的偏好。数学上，它将模型的可行参数空间约束到更靠近原点的那些。直观上，你可以把重量衰减看作是惩罚模型对特定权重过于自信。\n\
  \n#### 早停\n\n早停是另一种常用的机器学习模型训练正则化器，它在检测到过拟合时停止训练过程。由于无法完全检测到过拟合，通常的做法是使用验证集来监控过拟合。\n\
  \n验证集或保留集是原始训练数据中不用于训练而用于定期监控模型性能的部分数据。通常，如果训练错误继续下降而验证错误开始上升，说明模型正在开始过拟合。早停在模型有机会过拟合训练集之前就停止训练过程。你在本书的深度学习部分会看到早停的多个实际例子。\n\
  \n## 下降梯度\n\n现在你已经了解了一些关于优化以及它在机器学习中的应用，是时候看看如何在真实问题的背景下实现机器学习的优化。在这一节中，你将实现随机梯度下降来估计真正的参数，这些参数用于生成一些训练数据。\n\
  \n梯度下降是一种用于\n\n\n\n| || {train_x, new_key} = Nx.Random.uniform(new_key, *shape:*\
  \ {10000, 32}) |\n| || train_y = true_function.(true_params, train_x) |\n| || train_data\
  \ = Enum.zip(Nx.to_batched(train_x, 1), Nx.to_batched(train_y, 1)) |\n| || |\n|\
  \ || {test_x, _new_key} = Nx.Random.uniform(new_key, *shape:* {10000, 32}) |\n|\
  \ || test_y = true_function.(true_params, test_x) |\n| || test_data = Enum.zip(Nx.to_batched(test_x,\
  \ 1), Nx.to_batched(test_y, 1)) |\n[/content]\n\n[content]\n每个示例都是一个元组 {input, label}，其中\
  \ input 是均匀随机向量，label 则是通过评估 true_function（真实数据生成函数）获得的。\n\n接下来，在新建的单元格中创建一个名为 SGD\
  \ 的模块。正如上一章节所示，你需要使用 defn 来获取 Nx 自动微分的能力，因此需要导入 Nx.Defn：\n\n```\ndefmodule SGD do\n\
  \  import Nx.Defn\nend\n```\n\n### 获取良好的初始化\n\n随机梯度下降通常从随机参数集开始。请记住，机器学习中的优化目标是为特定函数找到最佳的参数化。\n\
  \n不幸的是，当你不知道最佳参数应该是什么时，就无法明智地选择起始点。对于某些学习算法（例如深度学习），有研究表明不同的初始化方式可以更好地收敛。但目前，你可以用随机均匀向量初始化参数，该向量的大小为\
  \ 32。为此，在 SGD 模块中添加以下函数：\n\n```\ndefn init_random_params(key) do\n  Nx.Random.uniform(key,\
  \ *shape:* {32, 1})\nend\n```\n\n### 实现模型\n\n接下来，你需要实现模型，它用于模拟 true_function。将以下函数添加到\
  \ SGD 模块，表示你的模型：\n\n```\ndefn model(params, inputs) do\n  labels = Nx.dot(inputs,\
  \ params)\n  labels\nend\n```\n\n在这个例子中，你已经知道 true_function 的原始形式，因此可以使用相同的形式来实现\
  \ model。在真实的机器学习问题中，你并没有直接获得相同的信息，所以 model 的形式会依赖于你对数据的直觉。这里，你知道原始函数通过输入与真实参数之间的点积来转换输入——你只需要找出真实参数是什么。\n\
  \n### 定义目标函数\n\n现在，你需要实现损失函数。请记住，目标是最小化评估集上的均方误差，因此可以直接使用均方误差作为损失函数。你在本章节前面已经看到如何实现均方误差，因此可以在此复用：\n\
  \n```\ndefn mean_squared_error(y_true, y_pred) do\n  y_true\n  |> Nx.subtract(y_pred)\n\
  \  |> Nx.pow(2)\n  |> Nx.mean(*axes:* [-1])\nend\n\ndefn loss(actual_label, predicted_label)\
  \ do\n  loss_value = mean_squared_error(actual_label, predicted_label)\n  loss_value\n\
  end\n```\n\n你的损失函数提供了预测分布与实际分布之间的距离度量。直观地，你可以把梯度下降看作是在水体中寻找最深点的任务。\n\n随机初始化 init_random_params\
  \ 将你抛入水体中的随机位置。你测量深度（即 loss）在当前参数化下的值，并计算深度在所有方向的变化率。然后，你沿着梯度最陡的下降方向更新位置。要计算当前参数化下的\
  \ loss，需要定义目标函数。为此，在 SGD 模块中添加以下代码：\n\n```\ndefn objective(params, actual_inputs,\
  \ actual_labels) do\n  predicted_labels = model(params, actual_inputs)\n  loss(actual_labels,\
  \ predicted_labels)\nend\n```\n\nobjective/3 在 actual_inputs 上进行预测，并返回 loss/2，即预测标签与实际标签之间的差值。它反映了你在前面描述的“船只”例子中，当前位置相对于深度的变化。\n\
  \n### 向正确方向迈进\n\n实现随机梯度下降算法的最后一步是步函数，它会将参数朝正确的方向移动——即找到梯度最陡下降的方向。\n\n回顾第 3 章 *Harness\
  \ the Power of Math*，你可以通过计算函数相对于参数的梯度来找到函数的最陡下降方向。使用 Nx 的自动微分能力可以轻松实现这一点。在 SGD\
  \ 模块中添加以下代码，实现步函数：\n\n```\ndefn step(params, actual_inputs, actual_labels) do\n\
  \  {loss, params_grad} = value_and_grad(params, fn params -> objective(params, actual_inputs,\
  \ actual_labels) end)\n  new_params = params - 1.0e-2 * params_grad\n  {loss, new_params}\n\
  end\n```\n\n该函数利用 Nx 的特殊 kernel 函数 value_and_grad，它同时返回函数的值和相对于参数的梯度。与单独使用 grad\
  \ 相比，value_and_grad 更适合在需要同时获取函数值和梯度时使用。它会对 objective/3 关于 params 的梯度进行计算，这衡量了 loss\
  \ 函数相对于模型参数的变化率。随后，new_params 被设置为 params 减去 scaled version of params_grad（即学习率\
  \ 1.0e-2）。\n\n在机器学习语境中，这个缩放因子 1.0e-2 被称为学习率。它控制了每个示例之间参数变化的步幅大小。学习率通常是一个小于 1 的值，因为你只对一小部分点的\
  \ loss 函数梯度进行测量。对小样本的梯度不能过度自信。正是因为只使用数据集的子样本，随机梯度下降才真正具有“随机性”。如果你能获得“真实梯度”（即整个数据集的梯度），则可能不需要缩放\
  \ params_grad；但计算真实梯度往往不可行。\n\n### 整合所有组件\n\n最后，你需要一个能够把 SGD 实现的各个部分组合在一起的功能，同时还需要一个用于评估优化过程最终性能的评估函数。在模块中添加以下代码，实现\
  \ train 和 evaluate：\n\n```\ndef evaluate(trained_params, test_data) do\n  test_data\n\
  \  |> Enum.map(fn {x, y} ->\n    prediction = model(trained_params, x)\n    loss(y,\
  \ prediction)\n  end)\n  |> Enum.reduce(0, &Nx.add/2)\nend\n\ndef train(data, iterations,\
  \ key) do\n  {params, _key} = init_random_params(key)\n  loss = Nx.tensor(0.0)\n\
  \  # 训练循环在此处实现\nend\n\n\n\n|  | trained_params = Nx.init_random(key, shape) |\n\
  | --- | --- |\n|  | for i <- 1..1000, reduce: {loss, params} do |\n|  |   {loss,\
  \ params} = step(params, batch) |\n|  |   IO.puts(\"Epoch #{i}: loss = #{loss}\"\
  ) |\n|  | end |\n|  | trained_params |\n\n\n\nEvolutionary algorithms 是一类基于人工选择原理的优化算法。在进化算法中，你会生成一个问题的解决方案群体（例如，一组超参数），对群体中的每个解决方案进行评估，然后结合最佳的解决方案来构建更好的解决方案。进化算法甚至可以与神经网络结合使用，这种方式称为神经演化（neuroevolution），即通过多个世代演化神经网络的参数和结构，以获得更好的网络。进化算法在机器学习之外也很流行，已被用于无线天线的智能设计^([\\\
  [7\\]](#f_0034.xhtml#FOOTNOTE-7)) 和 [*scenario generation for game design* [SFF19]](#f_0098.xhtml#d1806e1480)。\n\
  \n进化算法很容易并行化，并能从 Nx 通过 JIT 编译加速到 CPU/GPU 的并行化和加速的优势中受益。遗憾的是，本文的范围不包括对遗传算法的详细描述。如果你想进一步了解，可以参考\
  \ [*Genetic Algorithms in Elixir* [Mor21]](#f_0098.xhtml#d1806e1231)，以及 MEOW 库。^([\\\
  [8\\]](#f_0034.xhtml#FOOTNOTE-8))\n\n### Grid Search\n\nGrid search 与黑盒优化的不同之处在于，它实际上是对参数的离散网格进行的\
  \ exhaustive search。Grid search 是机器学习中最常用的超参数优化方法。在 grid search 中，你需要定义想要优化的参数以及每个参数的测试值。例如，你可能会指定\
  \ 1.0e-4、1.0e-3 和 1.0e-2 作为学习率的取值。Grid search 会尝试所有超参数的组合，并返回表现最好的那一个组合。\n\n## Wrapping\
  \ Up\n\n在这一章中，你将机器学习框架化为优化问题，以了解机器学习与优化之间的关系。同时，你还学习了正则化，并了解到优化与机器学习的关键区别在于机器学习更强调泛化。你通过实现自己的随机梯度下降（stochastic\
  \ gradient descent）来应用优化到机器学习问题上。最后，你还了解了一些关于黑盒优化和超参数优化在机器学习背景下的知识。\n\n在掌握机器学习的基础和\
  \ Nx 之后，你已经准备好使用 Elixir 和 Nx 生态开始解决现实世界的机器学习问题。下一章，你将直接进入传统的机器学习算法，如线性回归、逻辑回归、最近邻学习和决策树。\n\
  \n#### Footnotes\n\n[\\[7\\]](#f_0033.xhtml#FNPTR-7)\n\n: \n\n[`www.jpl.nasa.gov/nmp/st5/TECHNOLOGY/antenna.html`](https://www.jpl.nasa.gov/nmp/st5/TECHNOLOGY/antenna.html)\n\
  \n[\\[8\\]](#f_0033.xhtml#FNPTR-8)\n\n: \n\n[`github.com/jonathanklosko/meow`](https://github.com/jonathanklosko/meow)\n\
  \nCopyright © 2024, The Pragmatic Bookshelf. \n\n# Chapter 5  \n\nTraditional Machine\
  \ Learning\n\nIn the previous chapters, you’ve become more grounded in the foundations\
  \ of machine learning. At this point, you should feel more comfortable working with\
  \ Nx, and it’s okay if you don’t grasp everything. Part of the beauty of the tooling\
  \ in the Nx ecosystem is that it greatly reduces the complexity of common machine\
  \ learning tasks. You don’t need to be a math expert to train a machine learning\
  \ model in Elixir. You need only to understand a bit of Elixir, and a bit of Nx.\n\
  \nIn Chapter 4, ​*Optimize Everything*​, you wrote a linear regression model from\
  \ scratch using Nx. While following along, you might have noticed the task was a\
  \ bit verbose to write from scratch. Nx offers a lot of flexibility, but you don’t\
  \ want to have to write every algorithm from scratch. Thankfully, Elixir has a library\
  \ for performing common machine learning tasks in a few lines of code. Scholar^([\\\
  [9\\]](#f_0040.xhtml#FOOTNOTE-9)) is a set of machine learning tools built on top\
  \ of Elixir and Nx. In this chapter, you’ll implement some traditional machine learning\
  \ algorithms using Scholar, and you’ll start to unlock the potential of the Elixir\
  \ Nx ecosystem.\n\n## Learning Linearly\n\nRecent advances in machine learning have\
  \ largely been attributed to deep learning. The popularity of deep learning—thanks\
  \ to impressive feats in natural language processing, computer vision, and generative\
  \ modeling—has made it almost synonymous with machine learning. However, the field\
  \ of machine learning is vast. Deep learning refers to a subset of machine learning\
  \ that uses neural networks. You’ll learn more about deep learning in Chapter 6,\
  \ ​*Go Deep with Axon*​. But first, you’ll focus on shallow machine learning algorithms.\n\
  \nShallow machine learning refers to non-deep-learning-based algorithms. But the\
  \ term is a bit of a misnomer. In a deep-learning-centric world, it’s easy to classify\
  \ algorithms into one of two classes: deep learning and everything else. In reality,\
  \ the “everything else” covers a vast amount of algorithms. Many of these algorithms\
  \ find significant use in the real world today.\n\nWhen tackling a problem using\
  \ machine learning, it’s easy to immediately reach for a complex solution such as\
  \ deep learning. However, many times you can do just as well with a much simpler\
  \ and more interpretable machine learning algorithm. You can get a lot of value\
  \ out of a simple linear regression model.\n\nPerhaps the simplest class of traditional\
  \ machine learning algorithms is linear models. They assume linearity in the underlying\
  \ relationship between inputs and outputs. To think about it simply, linear models\
  \ assume that input data can be modeled with a line. While this might seem like\
  \ an overly simplistic assumption, it turns out that you can create pretty accurate\
  \ models in this way. Remember, there’s no such thing as a perfect model. A lot\
  \ of times all we care about is having a model that’s good enough for the task at\
  \ hand. Reality is almost never linear, but linear models are still powerful at\
  \ modeling the real world.\n\n### Linear Regression with Scholar\n\nYou’re already\
  \ familiar with one type of linear model—linear regression—from ​*Descending Gradients*​.\
  \ Linear regression is an approach for modeling the relationship between some scalar\
  \ target variable and one or more input variables. If you dust off your primary\
  \ school mathematics lessons, you might remember the infamous equation for a line:\n\
  \n| ​  || y = mx + b |\n\n| --- | --- |\n\nThis equation represents a linear relationship\
  \ between the target variable y and the input variable x. m and b represent the\
  \ slope and intercept of the line, respectively. Given an m and a b, you can predict\
  \ any y from any x. For example, if you know m is 3.0 and b is 2.0, you can create\
  \ a function such as the following:\n\n| ​  || ​**def**​ model(x) ​**do**​ |\n\n\
  | --- | --- |\n\n| ​  || 3.0 \\* x + 2.0 |\n\n| ​  || ​**end**​ |\n\nYou can then\
  \ use your model to get the correct value of y at different values of x:\n\n| ​ \
  \ || IO.inspect model(2) ​*\\# prints 8*​ |\n\n| --- | --- |\n\n| ​  || IO.inspect\
  \ model(3) ​*\\# prints 11*​ |\n\n| ​  || IO.inspect model(4) ​*\\# prints 14*​\
  \ |\n\nIn the real world, you often don’t have access to the parameters m and b,\
  \ which drive the relationship between your target and input variables. Instead,\
  \ you need to infer or learn these parameters using machine learning. For example,\
  \ consider this scatterplot from ​*Learning with Optimization*​:\n\n![images/OptimizingEverything/ScatterPlot1.png](img/ScatterPlot1.png)\n\
  \n\n\n你会注意到图中的点大致沿一条直线分布。使用线性回归的目标是绘制一条直线，使得该直线与数据集中每个点之间的总距离最小。最终得到的直线通常被称为最佳拟合线，可用于预测输入与输出之间的关系。在\
  \ Descending Gradients 中，你通过手动实现随机梯度下降来寻找最佳拟合线，走了一条曲折的路。现在，你将使用 Scholar 完成同样的任务。\n\
  \n首先，在新建的 Livebook 中安装以下依赖：\n\n``` \n| ​  || Mix.install( \\[ \n | --- | --- | \n\
  \ | ​  || {​*:scholar*​, ​*\"*​​*~> 0.2\"*​}, \n | ​  || {​*:nx*​, ​*\"*​​*~> 0.5\"\
  *​}, \n | ​  || {​*:exla*​, ​*\"*​​*~> 0.5\"*​}, \n | ​  || {​*:vega_lite*​, ​*\"\
  *​​*~> 0.1.6\"*​}, \n | ​  || {​*:kino_vega_lite*​, ​*\"*​​*~> 0.1.6\"*​}, \n |\
  \ ​  || {​*:scidata*​, ​*\"*​​*~> 0.1\"*​} \n] \n``` \n\n你将使用 Scholar 访问一系列传统机器学习算法和工具：Nx\
  \ 用于操作张量，EXLA 用于 JIT 编译和加速，VegaLite/KinoVegaLite 用于创建数据可视化。后续还需要 SciData 来下载数据集。\n\
  \n接下来，将默认后端设置为 EXLA，默认 defn 编译器设置为 EXLA，运行以下代码：\n\n``` \n| ​  || Nx.default_backend(EXLA.Backend)\
  \ \n| --- | --- \n| ​  || Nx.Defn.default_options(​*compiler:*​ EXLA) \n``` \n\n\
  然后，生成训练数据：\n\n``` \n| ​  || m = ​*:rand*​.uniform() * 10 \n| --- | --- \n| ​  ||\
  \ b = ​*:random*​.uniform() * 10 \n| ​  || \n| ​  || key = Nx.Random.key(42) \n\
  | ​  || size = 100 \n| ​  || {x, new_key} = Nx.Random.normal(key, 0.0, 1.0, ​*shape:*​\
  \ {size, 1}) \n| ​  || {noise_x, new_key} = Nx.Random.normal(new_key, 0.0, 1.0,\
  \ ​*shape:*​ {size, 1}) \n| ​  || \n| ​  || y = \n| ​  || m \n| ​  || |> Nx.multiply(Nx.add(x,\
  \ noise_x)) \n| ​  || |> Nx.add(b) \n``` \n\n在这段代码中，你首先声明目标参数 `m` 和 `b` 为随机标量。然后使用\
  \ Nx 的随机模块创建一个新的随机种子键。请注意，Nx 的随机数生成模块是无状态的，因此每次生成随机数时都需要传入 key。接着，你创建两个高斯分布的张量：`x`\
  \ 和 `noise_x`。`x` 是输入变量的随机分布，`noise_x` 是高斯噪声，用于模拟真实世界数据的不完美性。\n\n接下来，运行以下代码生成散点图：\n\
  \n``` \n| ​  || alias VegaLite, ​*as:*​ Vl \n| --- | --- \n| ​  || \n| ​  || Vl.new(​*title:*​\
  \ *\"*​​*Scatterplot\"*​, ​*width:*​ 720, ​*height:*​ 480) \n| ​  || |> Vl.data_from_values(%{\
  \ \n| ​  || ​*x:*​ Nx.to_flat_list(x), \n| ​  || ​*y:*​ Nx.to_flat_list(y) \n})\
  \ \n| ​  || |> Vl.mark(​*:point*​) \n| ​  || |> Vl.encode_field(​*:x*​, *\"*​​*x\"\
  *​, ​*type:*​ ​*:quantitative*​) \n| ​  || |> Vl.encode_field(​*:y*​, *\"*​​*y\"\
  *​, ​*type:*​ ​*:quantitative*​) \n``` \n\n你将在这里看到图表。\n\n![images/TraditionalMachineLearning/ScatterPlot.png](img/ScatterPlot.png)\n\
  \n观察到数据大致沿一条直线分布，但由于高斯噪声，这条直线并不完美。\n\n接下来，你将在输入变量 `x` 和输出变量 `y` 上拟合线性回归模型。使用 Scholar，只需一行代码：\n\
  \n``` \n| ​  || model = Scholar.Linear.LinearRegression.fit(x, y) \n| --- | ---\
  \ \n``` \n\n运行此代码后，你会看到以下输出：\n\n``` \n| ​  || %Scholar.Linear.LinearRegression{\
  \ \n| --- | --- \n| ​  || coefficients: #Nx.Tensor< \n| ​  || f32\\[1\\]\\[1\\]\
  \ \n| ​  || \\[ \n| ​  || \\[3.4556338787078857\\] \n| ​  || \\] \n| ​  || \\>,\
  \ \n| ​  || intercept: #Nx.Tensor< \n| ​  || f32\\[1\\] \n| ​  || \\[9.695785522460938\\\
  ] \n| ​  || \\> \n| ​  || } \n``` \n\n`Scholar.Linear.LinearRegression.fit/3` 返回一个\
  \ `%LinearRegression{}` 结构体，包含 `coefficients` 和 `intercept` 两个属性，它们分别代表 `m` 和 `b`。\n\
  \n如果你检查 `m` 和 `b`，会发现它们与预测的系数和截距非常接近。由于随机化，你的 `m` 和 `b` 会与示例值不同。\n\n在内部，Scholar\
  \ 的 `Scholar.Linear.LinearRegression.fit/3` 使用普通最小二乘法（ordinary least-squares regression）求解最佳拟合线。不过，你无需理解其原理，因为\
  \ Scholar 将复杂性封装到简洁易用的 API 中。你现在可以使用返回的模型对新数据进行预测。例如：\n\n``` \n| ​  || Scholar.Linear.LinearRegression.predict(model,\
  \ Nx.iota({3, 1})) \n| --- | --- \n``` \n\n输出为：\n\n``` \n| ​  || #Nx.Tensor< \n\
  | --- | --- \n| ​  || f32\\[3\\]\\[1\\] \n| ​  || \\[ \n| ​  || \\[9.695785522460938\\\
  ], \n| ​  || \\[13.151419639587402\\], \n| ​  || \\[16.607053756713867\\] \n| ​ \
  \ || \\] \n| ​  || \\> \n``` \n\n为了验证模型，你可以将预测的直线叠加到原始散点图上。为此，先运行以下代码生成与训练数据相同区间的预测值：\n\
  \n``` \n| ​  || pred_xs = Nx.linspace(-3.0, 3.0, ​*n:*​ 100) |> Nx.new_axis(-1)\
  \ \n| --- | --- \n| ​  || pred_ys = Scholar.Linear.LinearRegression.predict(model,\
  \ pred_xs) \n``` \n\n第一行代码创建一个包含 100 个元素的向量，值从 -3.0 线性增加到 3.0。第二行代码在整个区间上使用 `Scholar.Linear.LinearRegression.predict/2`\
  \ 进行预测。\n\n然后，使用以下代码绘制预测直线并叠加到原始散点图上：\n\n``` \n| ​  || title = *\"*​​*Scatterplot\
  \ Distribution and Fit Curve\"*​ \n| --- | --- \n| ​  || Vl.new(​*title:*​ title,\
  \ ​*width:*​ 720, ​*height:*​ 480) \n| ​  || |> Vl.data_from_values(%{ \n| ​  ||\
  \ ​*x:*​ Nx.to_flat_list(x), \n| ​  || ​*y:*​ Nx.to_flat_list(y), \n| ​  || ​*pred_x:*​\
  \ Nx.to_flat_list(pred_xs), \n| ​  || ​*pred_y:*​ Nx.to_flat_list(pred_ys) \n})\
  \ \n| ​  || |> Vl.layers( [ \n| ​  || Vl.new() \n| ​  || |> Vl.mark(​*:point*​)\
  \ \n| ​  || |> Vl.encode_field(​*:x*​, *\"*​​*x\"*​, ​*type:*​ ​*:quantitative*​)\
  \ \n| ​  || |> Vl.encode_field(​*:y*​, *\"*​​*y\"*​, ​*type:*​ ​*:quantitative*​),\
  \ \n| ​  || Vl.new() \n| ​  || |> Vl.mark(​*:line*​) \n| ​  || |> Vl.encode_field(​*:x*​,\
  \ *\"*​​*pred_x\"*​, ​*type:*​ ​*:quantitative*​) \n| ​  || |> Vl.encode_field(​*:y*​,\
  \ *\"*​​*pred_y\"*​, ​*type:*​ ​*:quantitative*​) \n] \n``` \n\n运行后，你会看到这张图。\n\n\
  ![images/TraditionalMachineLearning/LineOverScatterPlot.png](img/LineOverScatterPlot.png)\n\
  \n你可能会注意到，这条直线甚至不与训练数据中的任何点相交。记住，这条直线是最佳拟合线，旨在代表训练数据中观察到的模式的一般化趋势。它不过是训练数据中模式的平均值。\n\
  \n在这个例子中，你对单变量进行了线性回归。但你可以将线性回归扩展到任意数量的特征。例如，如果你想预测一场 NBA 比赛中某支球队的得分，可以使用多个特征：每场比赛平均三分球命中数、每场比赛平均得分、裁判是否为\
  \ Tim Donaghy 等。只要输入变量与目标变量之间的关系可以合理地用直线表示，你就可以使用线性回归来解决该问题。\n\n### 使用 Scholar 的\
  \ Logistic Regression\n\n\n\n\n一种常用于分类问题的线性回归的变体是逻辑回归。逻辑回归几乎与线性回归完全相同。但是，在对输入变量进行线性变换后，你还需要应用一个逻辑函数，该函数将输出压缩在\
  \ 0 到 1 之间。通常，输出表示二分类问题的概率。但它也可以扩展用于处理多类分类问题。例如，假设你是一名侍酒师，正在开发一个模型，根据每瓶葡萄酒的化学分析来预测其类型。你有一个包含测量值的数据集，以及一个标签，表示三种葡萄酒中的一种。这是应用逻辑回归的完美场景。\n\
  \n首先，使用 SciData 下载葡萄酒数据集：\n\n```\n| ​  || {inputs, targets} = Scidata.Wine.download()\
  \ | \n```\n\n| --- | --- |\n\n接下来，将数据集划分为训练集和测试集，以便验证模型的性能：\n\n```\n| ​  || {train,\
  \ test} = | \n```\n\n| --- | --- |\n\n| ​  || inputs | \n| ​  || |> Enum.zip(targets)\
  \ | \n| ​  || |> Enum.shuffle() | \n| ​  || |> Enum.split(floor(length(inputs) *\
  \ 0.8)) | \n| ​  ||  | \n| ​  || {train_inputs, train_targets} = Enum.unzip(train)\
  \ | \n| ​  || train_inputs = Nx.tensor(train_inputs) | \n| ​  || train_targets =\
  \ Nx.tensor(train_targets) | \n| ​  ||  | \n| ​  || {test_inputs, test_targets}\
  \ = Enum.unzip(test) | \n| ​  || test_inputs = Nx.tensor(test_inputs) | \n| ​  ||\
  \ test_targets = Nx.tensor(test_targets) | \n```\n\n第一部分代码会对原始输入数据集进行打乱，使得类别在训练集和测试集之间均匀分布。然后，它将数据集划分为\
  \ 80/20 的训练集和测试集。最后，它将训练集和测试集转换为张量。\n\n现在，你可以在继续之前对数据进行一些预处理。大多数时候，你希望将输入特征缩放到某个尺度上。这通常使得模型更容易从输入数据中学习模式。例如，通常将输入特征压缩在\
  \ 0 到 1 之间。你可以使用 Scholar 的预处理方法来完成此操作：\n\n```\n| ​  || train_inputs = Scholar.Preprocessing.min_max_scale(train_inputs)\
  \ | \n```\n\n| --- | --- |\n\n| ​  || test_inputs = Scholar.Preprocessing.min_max_scale(test_inputs)\
  \ | \n```\n\n这段代码通过根据输入数据的最小值和最大值对 train 和 test 输入进行缩放，将它们都缩放到 0 到 1 之间。\n\n接下来，你可以使用\
  \ Scholar.Linear.LogisticRegression.fit/3 训练一个逻辑回归模型：\n\n```\n| ​  || model = Scholar.Linear.LogisticRegression.fit(\
  \ | \n| --- | --- | \n| ​  || train_inputs, | \n| ​  || train_targets, | \n| ​ \
  \ || *num_classes:* 3 | \n| ​  || ) | \n```\n\n请注意，必须指定 `num_classes`: 3，因为原始数据集包含三个类别。这段代码会将原始问题视为多类分类问题。运行一段时间后，你会看到以下输出：\n\
  \n```\n| ​  || %Scholar.Linear.LogisticRegression{ | \n| --- | --- | \n| ​  || *coefficients:*\
  \ #Nx.Tensor<* | \n| ​  || f32[13][3] | \n| ​  || [ | \n| ​  || [57.30550765991211,\
  \ 40.04463577270508, 21.67230796813965], | \n| ​  || [9.130376815795898, 6.3609209060668945,\
  \ 5.055447101593018], | \n| ​  || [9.905561447143555, 7.361076831817627, 3.8778562545776367],\
  \ | \n| ​  || [70.83293914794922, 67.13773345947266, 35.777008056640625], | \n|\
  \ ​  || [457.4987487792969, 298.3395080566406, 170.00132751464844], | \n| ​  ||\
  \ [11.34200668334961, 6.753108978271484, 2.0085954666137695], | \n| ​  || [11.833603858947754,\
  \ 6.091976165771484, 0.4948000907897949], | \n| ​  || [1.158339500427246, 1.3611177206039429,\
  \ 0.7777756452560425], | \n| ​  || [7.858388900756836, 4.755614280700684, 1.6751126050949097],\
  \ | \n| ​  || [21.37252426147461, 9.511534690856934, 12.442154884338379], | \n|\
  \ ​  || [4.333345890045166, 3.347238063812256, 1.008358359336853], | \n| ​  || [13.530704498291016,\
  \ 8.850102424621582, 2.6361520290374756], | \n| ​  || [4223.81689453125, 1395.7369384765625,\
  \ 934.896240234375] | \n| ​  || ] | \n| ​  || \\>, | \n| ​  || *bias:* #Nx.Tensor<*\
  \ | \n| ​  || f32 | \n| ​  || 0.0 | \n| ​  || \\>, | \n| ​  || *mode:* *:multinomial*\
  \ | \n| ​  || } | \n```\n\n与线性回归模型类似，Scholar 生成一个特定于逻辑回归的结构体，可以用于后续预测。你会注意到系数张量的形状是\
  \ {13, 3}，这表示每个类别有 13 个特征。在多类逻辑回归模型中，你实际上是在训练多个二分类概率预测模型。对于每个类别，你预测该输入是否属于该类别的概率（在\
  \ 0 到 1 之间），然后对所有类别进行归一化。\n\n你现在可以使用该模型在测试集上进行预测：\n\n```\n| ​  || test_preds = Scholar.Linear.LogisticRegression.predict(model,\
  \ test_inputs) | \n```\n\n| --- | --- |\n\n除了实现多种机器学习算法外，Scholar 还提供了用于评估模型的例程。例如，你可以计算模型的准确率：\n\
  \n```\n| ​  || Scholar.Metrics.Classification.accuracy(test_targets, test_preds)\
  \ | \n```\n\n| --- | --- |\n\n运行该单元后，你会看到以下输出：\n\n```\n| ​  || #Nx.Tensor< | \n\
  | --- | --- | \n| ​  || f32 | \n| ​  || 0.75 | \n| ​  || \\> | \n```\n\n另一个分类问题的常用指标是混淆矩阵。混淆矩阵是一个表格，展示了模型在分类问题中对每个类别的表现。表格是二维的，列代表预测类别，行代表实际类别。你可以把表格中的每个单元格看作一个元组，例如\
  \ {0, 0}、{0, 1} 等。{0, 0} 单元格的值表示模型正确预测输入属于类别 0 时，实际属于类别 0 的次数。{0, 1} 单元格的值表示模型预测输入属于类别\
  \ 0 时，实际属于类别 1 的次数。这种模式会在数据集的每个类别中重复出现。你可以使用以下代码计算混淆矩阵：\n\n```\n| ​  || Scholar.Metrics.Classification.confusion_matrix(\
  \ | \n| --- | --- | \n| ​  || test_targets, | \n| ​  || test_preds, | \n| ​  ||\
  \ *num_classes:* 3 | \n| ​  || ) | \n```\n\n运行此代码后，你会看到以下输出：\n\n```\n| ​  || #Nx.Tensor<\
  \ | \n| --- | --- | \n| ​  || s64[3][3] | \n| ​  || [ | \n| ​  || [9, 0, 0], | \n\
  | ​  || [19, 0, 0], | \n| ​  || [8, 0, 0] | \n| ​  || ] | \n| ​  || \\> | \n```\n\
  \n你也可以通过运行以下代码将混淆矩阵转换为图表：\n\n```\n| ​  || Vl.new( *title:* \"Confusion Matrix\"\
  , *width:* 1440, *height:* 1080 ) | \n| --- | --- | \n| ​  || |> Vl.data_from_values(\
  \ %{ | \n| ​  || *predicted:* Nx.to_flat_list(test_preds), | \n| ​  || *actual:*\
  \ Nx.to_flat_list(test_targets), | \n| ​  || } ) | \n| ​  || |> Vl.mark( *:rect*\
  \ ) | \n| ​  || |> Vl.encode_field( *:x* , \"predicted\" ) | \n| ​  || |> Vl.encode_field(\
  \ *:y* , \"actual\" ) | \n| ​  || |> Vl.encode( *:color* , *aggregate:* *count*\
  \ ) | \n```\n\n运行此代码后，你会看到以下图片：\n\n![images/TraditionalMachineLearning/ConfusionMatrix.png](img/ConfusionMatrix.png)\n\
  \n混淆矩阵是可视化模型分类性能的良好方式。\n\n### 处理非线性数据\n\n很多真实世界数据是非线性的。这意味着线性模型往往没有足够的容量或建模能力来表示真实世界的关系。有几种方法可以解决这个问题。\n\
  \n\n\n-   简单处理即可。事实上，没有任何模型是完美的。如果你有一个线性模型，例如线性回归模型，能够很好地预测数据中的数值，那么没有理由对其进行修改。正如人们所说，“如果它没坏，就不要修理它”。线性模型简单、快速且可解释，使其成为商业应用的极佳候选。很多时候，你可以部署一个比替代模型更简单、更快速的线性回归模型，并获得使用更昂贵或复杂模型的\
  \ 90% 的价值。\n\n-   另一种处理非线性数据的方法是对数据进行变换，直到出现线性关系。这在某种意义上是特征工程。\n\n-   特征工程是手动操作特征以提供给模型更好信息的过程。如果你是体育爱好者，可能熟悉高级统计分析。例如，在篮球中，常用球员的真实投篮百分比来替代其投篮百分比，以判断其投射价值。随着时间推移，球队发现高级统计数据\
  \ —  — 这些数据通常结合了多个表层指标 —  — 比表层指标本身更能反映球员的表现。高级统计数据是基于对篮球运动的专业知识而工程化的特征。\n\n-  \
  \ 对于线性模型，如线性回归和逻辑回归模型，如果你知道输入数据更适合功率模型或对数模型的表示，则可以将输入进行相应的变换。请查看以下图表：\n\n```\n![images/TraditionalMachineLearning/Transformations.png\n\
  ```\n\n-   注意到，之前无法以线性方式表示的数据，现在通过简单的变换就可以实现线性表示。例如，与其观察第一张图中的 y vs. x，你可以观察 log(y)\
  \ vs. x。这种变换是机器学习中著名的“核技巧”（kernel trick）的一种简化版。\n\n-   核技巧通常与支持向量机（SVM）相提及，而 SVM\
  \ 是一种线性模型，超出本书范围。通过核技巧，你会对原始数据应用高维变换，使其在特征空间中线性可分。核技巧使得能够使用线性模型来建模非线性数据成为可能。\n\n\
  -   事实证明，并非所有数据都能通过这种方式实现线性可分。线性可分的字面意思是数据可以通过一条直线将其分割。在某些情况下，线性模型根本不够，需要寻找其他解决方案。在本章的其余部分，你将简要了解几种此类方法，然后转向深度学习，离开传统机器学习方法。\n\
  \n## 从周围环境中学习\n\n线性模型是 Scholar 中许多传统机器学习模型之一。你在野外还会遇到的另一种常见模型是 K‑Nearest Neighbors（KNN）模型。KNN\
  \ 模型的核心思想很简单：你很可能与最近的事物相似。直观上这很合理。比如，如果你随机从费城街头挑起一个人并询问其最喜欢的足球队，他们大概率会说费城老鹰队。这是因为老鹰队是当地球队，且离费城球场很近。随着你远离费城，不同\
  \ NFL 球队的喜好分布会发生变化。\n\nKNN 通过将新点归类为其 K 个最近邻中最常见的类别来工作。它可以用于回归和分类两种任务。无论哪种情况，K 个最近邻都决定新数据点的类别或最终值。KNN\
  \ 简单而强大。你可以在 Scholar 中快速训练和评估 KNN 模型，并与酒厂数据集中的 Logistic Regression 模型进行比较。\n\n运行以下代码以拟合一个新的\
  \ KNN 分类器：\n\n```\n| ​  || model = Scholar.Neighbors.KNearestNeighbors.fit( |\n\
  | --- | --- |\n| | ​  || train_inputs, train_targets, *num_classes:* 3 |\n| | )\
  \ |\n```\n\n运行代码后，你会看到以下输出：\n\n```\n| ​  || %Scholar.Neighbors.KNearestNeighbors{\
  \ |\n| --- | --- |\n| | ​  || *data:* ​*#Nx.Tensor<*​ |\n| | f32[142][13] |\n| |\
  \ [ |\n| | [0.00769107136875391, 9.762659901753068e-4, ...] |\n| | [ |\n| | [0.00769107136875391,\
  \ 9.762659901753068e-4, ...] |\n| | ] |\n| | ] |\n| ​  || > |\n| ​  || *labels:*\
  \ ​*#Nx.Tensor<*​ |\n| | s64[142] |\n| | [0, 0, 2, 2, 2, 2, 1, ...] |\n| | > |\n\
  | ​  || *default_num_neighbors:* 5, |\n| | *weights:* *:uniform*​, |\n| | *num_classes:*\
  \ 3, |\n| | *p:* nil, |\n| | *task:* *:classification*​, |\n| | *metric:* {*:minkowski*​,\
  \ 2} |\n| | } |\n```\n\n请注意，运行 KNN 的 fit 方法实际上并不会进行训练。KNN 不需要训练，因为它在推断时仅从现有数据中采样。模型仅保留训练集中的点，用于在测试集上进行预测。\n\
  \n现在开始对测试数据进行预测并评估模型。首先预测测试输入的类别：\n\n```\n| ​  || test_preds = Scholar.Neighbors.KNearestNeighbors.predict(model,\
  \ test_inputs) |\n| --- | --- |\n```\n\n随后可以计算模型的准确率：\n\n```\n| ​  || Scholar.Metrics.accuracy(test_targets,\
  \ test_preds) |\n| --- | --- |\n```\n\n运行代码后，你会看到以下输出：\n\n```\n| ​  || #Nx.Tensor<\
  \ |\n| --- | --- |\n| | f32 |\n| | 0.75 |\n| | > |\n```\n\n你还可以计算混淆矩阵，方式如下：\n\n\
  ```\n| ​  || Scholar.Metrics.confusion_matrix(test_targets, test_preds, *num_classes:*\
  \ 3) |\n| --- | --- |\n```\n\n运行代码后，你会看到以下输出：\n\n```\n| ​  || #Nx.Tensor< |\n| ---\
  \ | --- |\n| | s64[3][3] |\n| | [ |\n| | [9, 0, 0], |\n| | [2, 11, 6], |\n| | [0,\
  \ 1, 7] |\n| | ] |\n| | > |\n```\n\n请注意，你的最近邻模型的表现基本上与逻辑回归模型完全相同。你可以继续调试超参数，或选择部署其中一个模型。你会发现\
  \ Scholar 让你轻松原型化多种分类器，然后评估每个模型以确定哪个最适合生产部署。\n\n你可以看到，Scholar 是创建监督学习方法的极佳工具，但它并不局限于此。Scholar\
  \ 还提供了许多用于无监督学习和数据分析的工具。\n\n## 使用聚类\n\n除了监督方法，Scholar 还提供了用于无监督学习和分析的多种工具。回顾第 1\
  \ 章 *Making Machines That Learn*，无监督学习是一种只有从输入中学习、没有目标信息的机器学习类型。也许最常见的无监督学习方式是聚类。聚类是识别数据集中相似数据点群组的过程。聚类有许多方法，如\
  \ K‑Means 聚类、层次聚类、光谱聚类等。\n\n在实际中，你最常见的聚类方式是 K‑Means 聚类，它会随机为 K 个质心点指定在数据集中的随机点，并迭代更新每个质心，直到达到最优配置。\n\
  \n聚类可以帮助你从数据组内部识别普遍模式。例如，如果你拥有一个来自在线商店购物者行为的数据集，你可以对购物者行为进行聚类，从而了解访问你店铺的一般类型的购物者。一个聚类可能代表重度消费者，另一个则代表不确定的浏览者。\n\
  \n\n\n\n# 一个集群的核心挑战是确定合适的簇数量。\n\n通常，你需要可视化你的数据集并进行某种高层次的分析，以确定合适的簇数量。真实数据不总是能很好地聚类。真实数据总是很混乱。\n\
  \n你也可以使用 K-Means 作为无监督分类方法。例如，你可以通过运行以下代码，将 K-Means 聚类应用于你的酒类问题：\n\n``` \n| ​  ||\
  \ model = Scholar.Cluster.KMeans.fit(train_inputs, num_clusters: 3) |\n``` \n\n\
  注意，这里你只需要传入训练输入，因为 K-Means 是无监督方法。它仅依赖输入数据，而不访问目标。运行代码后，你会看到类似以下输出：\n\n``` \n| ​ \
  \ || %Scholar.Cluster.KMeans{ |\n| ​  || num_iterations: #Nx.Tensor< |\n| ​  ||\
  \ s64 |\n| ​  || 4 |\n| ​  || >, |\n| ​  || clusters: #Nx.Tensor< |\n| ​  || f32[3][13]\
  \ |\n| ​  || [ |\n| ​  || 0.008120134472846985, 0.001020378083921969, ... |\n| ​ \
  \ || ] |\n| ​  || ... |\n| ​  || ] |\n| ​  || > |\n| ​  || } |\n``` \n\n这个结构包含算法的元数据，以及训练数据集中每个成员的聚类中心和聚类标签。K-Means\
  \ 为每个聚类找到中心，并将数据点分配到最近的中心。你可以将中心与数据集的特征进行可视化。酒类数据集有十三个维度，因此我们需要将其降维到两个或三个维度以便可视化。你可以运行以下代码生成中心相对于每个点的可视化：\n\
  \n``` \n| ​  || wine_features = %{ |\n| --- | --- |\n| ​  || ​*\"*​​*feature_1\"\
  *​ => train_inputs[[.., 1]] |> Nx.to_flat_list(), |\n| ​  || ​*\"*​​*feature_2\"\
  *​ => train_inputs[[.., 2]] |> Nx.to_flat_list(), |\n| ​  || ​*\"*​​*class\"*​ =>\
  \ train_targets |> Nx.to_flat_list() |\n| ​  || } |\n| ​  || |\n| ​  || coords =\
  \ [ |\n| ​  || ​*cluster_feature_1:*​ model.clusters[[.., 1]] |> Nx.to_flat_list(),\
  \ |\n| ​  || ​*cluster_feature_2:*​ model.clusters[[.., 2]] |> Nx.to_flat_list()\
  \ |\n| ​  || ] |\n| ​  || |\n| ​  || title = |\n| ​  || ​*\"*​​*Scatterplot of data\
  \ samples pojected on plane wine\"*​ |\n| ​  || <> ​*\"*​​ *feature 1 x wine feature\
  \ 2\"*​ |\n| ​  || |\n| ​  || Vl.new( |\n| ​  || ​*width:*​ 1440, |\n| ​  || ​*height:*​\
  \ 1080, |\n| ​  || ​*title:*​ [ |\n| ​  || ​*text:*​ title, |\n| ​  || ​*offset:*​\
  \ 25 |\n| ​  || ] |\n| ​  || ) |\n| ​  || |> Vl.layers([ |\n| ​  || Vl.new() |\n\
  | ​  || |> Vl.data_from_values(wine_features) |\n| ​  || |> Vl.mark(:circle) |\n\
  | ​  || |> Vl.encode_field(:x, *\"feature_1\"*, *type:* *:quantitative*) |\n| ​ \
  \ || |> Vl.encode_field(:y, *\"feature_2\"*, *type:* *:quantitative*) |\n| ​  ||\
  \ |> Vl.encode_field(:color, *\"class\"*, *type:* *:categorical*) |\n| ​  || Vl.new()\
  \ |\n| ​  || |> Vl.data_from_values(coords) |\n| ​  || |> Vl.mark(:circle, *color:*\
  \ *:green*, *size:* 100) |\n| ​  || |> Vl.encode_field(:x, *\"cluster_feature_1\"\
  *, *type:* *:quantitative*) |\n| ​  || |> Vl.encode_field(:y, *\"cluster_feature_2\"\
  *, *type:* *:quantitative*) |\n| ​  || \\]) |\n``` \n\n这将生成一个散点图，显示酒类特征 1 和 2，绿色圆点表示中心在两个特征上的位置。运行代码后，你会看到以下图：\n\
  \n![images/TraditionalMachineLearning/ClusterPlot.png](img/ClusterPlot.png)\n\n\
  注意，这张图并不美观，且簇不易辨认。这是因为你的簇是基于十三个特征创建的——虽然这两个特征本身的数据不易区分，但使用全部十三个特征时数据可能更易分离。\n\n\
  现在，你可以通过以下代码将测试输入分配到前一步创建的簇中：\n\n``` \n| ​  || test_preds = Scholar.Cluster.KMeans.predict(model,\
  \ test_inputs) |\n``` \n\n这段代码将测试输入分配到前一步创建的簇之一。运行代码后，你可以使用以下代码评估簇的准确性：\n\n``` \n\
  | ​  || Scholar.Metrics.accuracy(test_targets, test_preds) |\n``` \n\n运行代码后，你会看到以下输出：\n\
  \n``` \n| ​  || #Nx.Tensor< |\n| --- | --- |\n| ​  || f32 |\n| ​  || 0.8333333134651184\
  \ |\n| ​  || > |\n``` \n\n令人惊讶的是，你的无监督方法的表现优于监督方法。\n\n## 决策\n\n也许目前最流行的非深度学习算法是决策树及其集合变体，如梯度提升。\n\
  \n决策树的行为正如其名称所暗示：它们基于输入特征构建嵌套树。决策树构建一个层次化的决策流，将输入特征分区为一个或多个类别。例如，假设你想创建一个模型来预测患者是否有心脏病风险。决策树会构建一个树，通过分析数据以可解释的方式进行判断：患者是否吸烟？患者是否有高血压？患者是否身体活跃？\n\
  \n决策树之所以非常流行，是因为它们可解释，并且在特定类别的数据上表现非常好。决策树是少数几类能够在表格数据和时间序列数据上超越深度学习模型的算法类别。表格数据包含了大多数业务智能数据，因此决策树在商业应用中被广泛使用。\n\
  \n梯度提升是一种集合方法，它通过迭代构建许多弱分类器来覆盖前一个分类器的弱点。集合方法是一类机器学习方法，它们构建一个模型，该模型是许多模型的聚合。你可以以多种方式构建集合。你可以把集合看作是对同一主题获得多个不同观点。每个模型带来自己的优势和劣势，因此最终决策通常更可靠。梯度提升是一种集合技术，常用决策树作为基础分类器。\n\
  \nElixir 有一个新的决策树库 EXGBoost。^([\\[10\\]](#f_0040.xhtml#FOOTNOTE-10)) EXGBoost 直接集成到\
  \ Nx 张量中，使用相对简单。决策树超出了本书的范围，但作为一名正在成长的机器学习工程师，你需要了解并探索它们。\n\n### 总结\n\n在这一章中，你实现了一些传统的机器学习算法——监督和非监督——使用\
  \ Scholar。你用线性回归对线性数据进行建模。你通过逻辑回归、KNN 和 K-Means 三种方式预测酒类。\n\n你还了解了一些关于决策树和提升的知识。这一章是对\
  \ Scholar 功能以及传统机器学习算法力量的简短介绍。随着你继续你的机器学习之旅，尝试 Scholar 中提供的其他算法，并将它们与本书后续章节中创建的模型进行比较。\n\
  \n此时，你已经完成了机器学习基础的入门，现在可以更深入地探索 Axon。在下一章，你将开始揭开像 ChatGPT、DALL-E 2 和 Stable Diffusion\
  \ 这样的技术背后的奥秘：深度学习。\n\n#### Footnotes\n\n[\\[9\\]](#f_0035.xhtml#FNPTR-9)\n\n: \n\
  \n[`github.com/elixir-nx/scholar`](https://github.com/elixir-nx/scholar)\n\n[\\\
  [10\\]](#f_0039.xhtml#FNPTR-10)\n\n: \n\n[`hex.pm/packages/exgboost`](https://hex.pm/packages/exgboost)\n\
  \n\n\nCopyright © 2024，The Pragmatic Bookshelf。\n\n# Part 2  \n\nDeep Learning \
  \ \n\n# Chapter 6  \n\nGo Deep with Axon  \n\n在上一章节，你的重点主要是理解“传统”或“浅层”机器学习方法。你使用的方法，如线性回归、逻辑回归、集成方法和决策树，能够很好地为你在生产中遇到的许多机器学习问题创建有价值且表现良好的解决方案。然而，过去十年来深度学习的兴起推动了人工智能和机器学习领域取得了重大进展。\
  \  \n\n如今，深度学习模型的变体在计算机视觉、自然语言处理、增强学习等无数任务上展现出最先进的结果。深度学习的快速采用以及它为机器学习带来的进展意味着，掌握如何创建、训练和部署神经网络已成为任何有志成为机器学习实践者的必备技能。本章，你将深入\
  \ Elixir 中的深度学习，为即将到来的章节做铺垫，在那里你将学习如何将深度学习应用于不同的数据模态。你将先从在 Nx 中拆解神经网络，然后转向 Axon，进一步了解\
  \ Axon 以及它提供的便利。\n\n## 理解深度学习的必要性  \n\n想象你被要求创建一个算法，能够自动从纸质表单的手写电话号码字段中抓取。你的团队已经将表单中提取的单个数字自动转换为\
  \ 28x28 灰度图像。你将如何使用本书前几章的方法来解决这个问题？\n\n你的初步想法可能是，只需把这个问题交给逻辑回归模型或决策树即可。但你的模型的特征空间会是什么？是否要把每个单独的像素值都视为特征？\n\
  \n你可以把图像划分为网格（如下图所示）。\n\n![images/GettingDeepWithAxon/MNISTGrid.png](img/MNISTGrid.png)\n\
  \n从而，你可以把每个格子压缩为标量指标，并将这些标量指标的向量作为特征空间。然而，这种方法可能会丢失图像中关键信息。\n\n你在上一章节使用的算法需要程序员进行深入的特征工程。传统机器学习算法需要在学习过程之前，投入大量精力发现能够充分代表数据的丰富特征——手动发现这些特征可能很困难。\n\
  \n信息丰富且包含看似复杂、非结构化关系的领域，往往是最具挑战性的。对于图像、文本和音频等数据类型，手动提取特征很难。虽然你可以花数小时编写代码来提取图像信息（如角点和轮廓），但过程仍不完美，易受分布变化影响，并且本质上是有损的。\n\
  \n更好的做法是将提取有意义表示的任务交给机器学习算法。通过这种方式，你的算法不仅能根据特征进行预测，还能从高维输入中学习如何提取特征。从高维输入中提取表示并据此进行预测的能力，正是深度学习的吸引力所在。\n\
  \n| Deep Learning’s Kodak Moment |  \n\n| --- |  \n\n| ![images/aside-icons/info.png](img/info.png)\
  \ || 深度学习历来存在，但在过去十年之前，它在机器学习社区中只是一个后起之秀。深度学习研究者和实践者只占机器学习社区的极小一部分。整个机器学习社区曾认为深度学习是个荒唐的想法，不可能解决任何有价值的问题。这一切在\
  \ 2012 年发生了改变，当研究生 Alex Krizhevsky 和 Ilya Sutskever，以及他们的导师 Geoffrey E. Hinton 赢得了“ImageNet”竞赛，他们的模型被命名为\
  \ *AlexNet* [KSH12]，并且在竞赛中以巨大优势击败了竞争对手。此后，业界和学术界开始关注到深度学习的强大潜力。 |\n\n| --- | ---\
  \ |  \n\n### 维度诅咒  \n\n像图像、音频和文本等复杂输入通常以高维空间表示。回顾第 2 章 *Get Comfortable with Nx*，这些输入常被编码为张量。例如，图像通常是形状为\
  \ {height, width, channels} 的三阶张量。将图像展平为向量后，输入维度为 height \\* width \\* channels。以\
  \ 28x28 灰度图像为例，单张图像有 784 个像素，即 784 个特征（28 \\* 28 \\* 1）。\n\n输入维度的增加会显著提升机器学习问题的复杂度。对于只有一个特征的输入，模型只需捕捉该特征变化如何映射到输出变化即可。随着特征数量的增多，模型必须捕捉多个特征（它们可能相关也可能不相关）如何映射到输出变化。\n\
  \n在机器学习中，输入空间维度越高，模型的质量通常也越好。但到了一定程度，维度过高会导致模型质量下降，这正是所谓的“维度诅咒”。  \n\n为了更好地理解这一概念，把你的模型想象成一个乐队指挥。当乐队只有一种乐器时，指挥的工作相对简单。加入更多乐器可能提升音乐质量，但指挥的工作也会随之变得更复杂。当乐器数量达到一定程度，收益递减——指挥的任务变得过于艰巨，整体音质下降。这与机器学习中的维度诅咒相类比。\
  \  \n\n深度学习与你在前几章学习的算法的区别在于，深度学习能够克服维度诅咒。但它是如何做到的？\n\n### 层级表示  \n\n理解深度学习为何如此有效仍是活跃的研究课题。一个理论认为，深度学习能够克服维度诅咒的原因在于神经网络通过组合线性和非线性变换，将输入数据转换为层级表示。神经网络由一系列层组成，每层以前一层的表示为输入并将其转换为自己的表示，最终输出预测。你将在\
  \ *Breaking Down a Neural Network* 中拆解层的结构。为此，你只需了解层本质上是一个函数即可。  \n\n回到指挥/乐队的类比，深度学习通过增加额外的指挥来解决“乐器太多”的问题。一个指挥负责小提琴，另一个负责号角，还有一个负责长笛。每位指挥只需关注自己的乐段，整体音效比由单一指挥负责全部乐手的情况要好得多。\n\
  \n\n\n\n更具体地说，深度学习之所以运行得如此出色，是因为深度模型能够学习输入数据的逐层、层级表示。例如，如果你训练一个模型来识别猫的图像，第一层可能学会提取颜色，第二层可能学会提取角和边缘，以此类推。前几层从输入数据中提取简单的关系，而后期层则从这些简单的关系中提取更复杂的关系。后期层可能学会识别耳朵或爪子。通过组合简单的表示，神经网络能够学习更复杂的表示，从而对复杂输入进行预测。\n\
  \n从某种意义上说，神经网络通过将特征提取作为学习过程的一部分，消除了对系统性特征工程的需求。但这并不意味着训练神经网络不需要高质量的数据，也不是说发现新特征是训练更好神经网络所必需的。它只是说明，神经网络在处理复杂、高维的输入时表现出色，并且消除了对这些输入进行复杂的维度缩减或特征提取的需要。\n\
  \n### 表示任意函数\n\n理论上，神经网络被认为是通用函数逼近器。通用逼近器是指在给定正确参数的情况下，能够逼近任何复杂函数的模型。起初，这个想法似乎有点荒谬。你并不关心逼近函数；你关心的是构建能够进行预测的模型。但如果你考虑到你想要进行预测的数据来自某个黑盒函数，那么通用逼近就显得更具吸引力。理论上，当神经网络拥有正确的配置时，它可以逼近你想要学习的任何函数。\n\
  \n实际上，是否通用逼近真的有用，仍需讨论。深度学习的理论仍远落后于该领域的经验结果，因此理论主张缺乏足够的数学严谨性。\n\n另一种思考方式是将神经网络视为“学习的计算机程序”。想象神经网络的每一层就像是一个指令，而输入到每一层的数据则是该指令执行时的程序状态。你可能熟悉这样一种讽刺性的话：人工智能在生产环境中不过是一堆\
  \ if-else 语句的集合。把神经网络看作学习的程序，可能支持这一观点——神经网络可能只是学到了合适的 if-else 配置，从而成为有效的模型。\n\n\
  ### 分解神经网络\n\n在了解了神经网络为何必要且强大之后，现在是深入探讨“什么是神经网络”的时机。在这一节中，你将拆解深度学习相关的术语、神经网络的解剖结构，以及神经网络在\
  \ Elixir 中的具体样子。理解神经网络的基础构件将帮助你在开始使用 Axon 时建立直觉。\n\n#### 正确掌握术语\n\n深度模型、神经网络、人工神经网络（ANNs）、多层感知器（MLPs）——如果你在深度学习领域花过一些时间，你大概率已经看到过这些术语几乎被交替使用。深度学习的术语可能比实现模型本身更让人望而却步。\n\
  \n深度学习是机器学习的一个子集，它使用深度模型，即人工神经网络。这些模型之所以被称为“深”，是相对于其他层数较少的模型而言，它们的计算图（即一系列连续的运算）更为深入（例如，包含大量运算步骤）。你也可以从层数的角度来考虑深度：每一层递进都会增加模型的深度。\n\
  \n人工神经网络（ANNs）是深度模型的另一种称呼。该术语可能让人联想到类似下面的图像：\n\n![images/GettingDeepWithAxon/ANN.png](img/ANN.png)\n\
  \nANN 的命名源自其与大脑的启发式设计。ANN 中输入的转换旨在模拟神经元在大脑中传递信息时的放电过程。使用 ANN 这个术语可能是一种误导，因为缺乏证据表明大脑的运作方式与神经网络完全相同。\n\
  \n多层感知器（MLPs）是一种利用全连接层（或密集连接层）的深度学习模型类别。你将在 ​*The Anatomy of a Neural Network*​\
  \ 中看到具体含义。只需知道 MLPs 是神经网络的一个特定架构类别即可。它们也常被称为前向网络，因为信息从前向后、从前层流向输出层。你将在本书中实现多种其他架构，包括第\
  \ 7 章的卷积神经网络（CNN），​*Learn to See*​；第 9 章的循环神经网络（RNN），​*Understand Text*​；第 12 章的生成对抗网络（GANs），​*Learn\
  \ Without Supervision*​。\n\n| The Rebranding |\n\n| --- |\n\n| ![images/aside-icons/info.png](img/info.png)\
  \ || 在深度学习迎来 2012 年爆发式增长之前，该领域由少数研究者主导。大多数顶级机器学习会议每年只接受一两篇深度学习论文——如果有的话。当时，从层与层之间的连接可以直观看到深度模型，研究深度学习的学者被称为“连接主义者”。深度学习是连接主义者为克服当时对神经网络的偏见而进行的战略性重新品牌。\
  \ |\n\n| --- | --- |\n\n### 神经网络的解剖结构\n\n大多数神经网络可以简化为几个关键组件。计算或工作单元的最常用抽象是“层”。通常，层表示对输入进行的转换，并将其转发给下一层。模型的层数通常被称为“深度”。一般来说，层数越多，模型的容量也越大；但过深的模型也可能阻碍学习过程。\n\
  \n本书后续章节将使用多种类型的层。在神经网络中，通常有三类层：输入层、隐藏层和输出层。\n\n#### 输入层\n\n输入层充当模型输入的占位符。某些神经网络操作需要明确的输入形状。你可以回到第\
  \ 2 章，​*Get Comfortable with Nx*​，更好地理解现实数据如何映射到张量输入。\n\n#### 隐藏层\n\n隐藏层是神经网络中“魔法”发生的地方。它们是中间的计算层，负责将输入转换为输出层可用的有用表示。它们就像交响乐团中的额外指挥，使高维输入能够被输出层所管理。\n\
  \n\n\n\nThe most common hidden layer is the densely connected, fully connected,\
  \ or simply dense layer. The dense layer is named for the dense connections it creates\
  \ between two layers—in other words, every input to a dense layer maps to an output\
  \ in the dense layer. Dense layers have a number of output units, which represent\
  \ the dimensionality of the dense layer. If you like the analogy of neural networks\
  \ to the brain, you can think of an individual unit as a neuron. A dense layer with\
  \ 128 units has 128 neurons.\n\nThe number of units in a dense layer is referred\
  \ to as the width of the layer. Wider dense layers have more representational capacity.\
  \ However, there’s also a point of diminishing returns. It’s common to use hidden\
  \ widths that are multiples of two. This is because of how memory layouts work on\
  \ modern accelerators.\n\nMathematically, dense layers are matrix multiplications\
  \ or linear transformations. Dense layers learn to project inputs in such a way\
  \ that extracts a useful representation for successive layers.\n\n#### Activations\n\
  \nHidden layers often have an activation function that applies a nonlinear function\
  \ to the output. The introduction of nonlinearities into the neural network is what\
  \ makes it a universal approximator. It’s common to use activation functions that\
  \ scale or squeeze inputs into some useful output range. For example, the sigmoid\
  \ function is often used as an activation because it squeezes outputs between 0\
  \ and 1. Because neural networks are trained with gradient descent, it’s important\
  \ that activation functions be differentiable.\n\nYou can think of activation functions\
  \ as a means of signaling certain input features. For example, your neural network\
  \ might learn to only have certain neurons firing on certain input features. A neuron’s\
  \ activation can be interpreted as its importance to the final output. Some neurons\
  \ that aren’t important will be entirely “turned off.”\n\nYou can use a number of\
  \ activation functions in a neural network. Finding better activation functions\
  \ is a popular area of research. The activation functions you should be familiar\
  \ with are ReLU, sigmoid, and softmax.\n\n**ReLU**\n\nThe Rectified Linear Unit\
  \ (ReLU) activation function is a popular intermediate activation that computes\
  \ the function:\n\n| ​  || defn relu(x) ​**do**​ |\n\n| --- | --- |\n\n| ​  || Nx.max(0,\
  \ x) |\n\n| ​  || ​**end**​ |\n\nReLU takes all negative inputs to 0 and maps positive\
  \ inputs to the same value.\n\n**Sigmoid**\n\nThe sigmoid activation function is\
  \ a popular output activation because it squeezes outputs to the range 0-1. It computes\
  \ the logistic sigmoid function:\n\n| ​  || defn sigmoid(x) ​**do**​ |\n\n| ---\
  \ | --- |\n\n| ​  || 1 / (1 + Nx.exp(-x)) |\n\n| ​  || ​**end**​ |\n\nThe sigmoid\
  \ function is especially useful when you’re trying to compute an output probability\
  \ between 0 and 1.\n\n**Softmax**\n\nThe softmax function is a popular output activation\
  \ for multi-class classification problems. It outputs a categorical probability\
  \ distribution.\n\n#### Output Layers\n\nFrom an implementation perspective, output\
  \ layers are no different than input layers. Output layers are the final result\
  \ of your neural network. After transforming your inputs into useful representations\
  \ with hidden layers, output layers transform those representations into something\
  \ you can meaningfully use or interpret, such as a probability.\n\nFor classification\
  \ problems, it’s common to use a dense layer with a sigmoid or softmax activation\
  \ as the final output layer. For binary classification problems, the final layer\
  \ will usually be a dense layer with one output unit and sigmoid activation. For\
  \ multi-class classification problems, the final layer will usually be a dense layer\
  \ with N output units and softmax activation, where N is the number of possible\
  \ classes.\n\nFor scalar regression problems, it’s common to use a dense layer with\
  \ one output unit and no activation—so the output neuron just maps to a scalar.\n\
  \nThe form of an output layer is problem-dependent. You’ll see lots of different\
  \ output layers throughout the rest of this book.\n\n## Using Nx to Create a Simple\
  \ Neural Network\n\nWhile neural networks might seem conceptually challenging to\
  \ understand, they’re actually surprisingly easy to implement. To illustrate this\
  \ point, you’ll implement a simple neural network using Nx. Open a Livebook and\
  \ add the following dependencies:\n\n| ​  || Mix.install(​ |\n\n| --- | --- |\n\n\
  | ​  || {​*:nx*​, *\"*​​*~> 0.5\"*​} |\n\n| ​  || \\]) |\n\nRemember from the previous\
  \ section that a neural network consists only of inputs, hidden layers, intermediate\
  \ activations, and output layers. Start by creating a new module named NeuralNetwork:\n\
  \n| ​  || ​**defmodule**​ NeuralNetwork ​**do**​ |\n\n| --- | --- |\n\n| ​  || ​**import**​\
  \ Nx.Defn |\n\n| ​  || ​**end**​ |\n\nNext, you need to implement a hidden layer.\
  \ Your hidden layer will be a densely connected or a dense layer that performs a\
  \ matrix multiplication of two dense matrices followed by a bias add. A bias add\
  \ is just a shift in the original input. The dense layer takes two parameters—weight\
  \ and bias—and transforms the input using both weight and bias. Implement the dense\
  \ layer like so:\n\n| ​  || defn dense(input, weight, bias) ​**do**​ |\n\n| ---\
  \ | --- |\n\n| ​  || input |\n\n| ​  || |> Nx.dot(weight) |\n\n| ​  || |> Nx.add(bias)\
  \ |\n\n| ​  || ​**end**​ |\n\nHidden layers are followed by intermediate activation\
  \ functions. To keep things simple, you’ll implement only the sigmoid activation\
  \ function using Nx. Implement your activation function like this:\n\n| ​  || defn\
  \ activation(input) ​**do**​ |\n\n| --- | --- |\n\n| ​  || Nx.sigmoid(input) |\n\
  \n| ​  || ​**end**​ |\n\nYou can combine both dense and activation into a single\
  \ hidden layer like this:\n\n| ​  || defn hidden(input, weight, bias) ​**do**​ |\n\
  \n| --- | --- |\n\n| ​  || input |\n\n| ​  || |> dense(weight, bias) |\n\n| ​  ||\
  \ |> activation() |\n\n| ​  || ​**end**​ |\n\nFinally, you need an output layer.\
  \ Your output layer will simply be another dense layer, followed by your activation\
  \ function. The implementation is identical to hidden, but you should be explicit\
  \ here to get an idea of what’s going on:\n\n| ​  || defn output(input, weight,\
  \ bias) ​**do**​ |\n\n| --- | --- |\n\n| ​  || input |\n\n| ​  || |> dense(weight,\
  \ bias) |\n\n| ​  || |> activation() |\n\n| ​  || ​**end**​ |\n\nNow, add a predict\
  \ function to your NeuralNetwork module:\n\n| ​  || defn predict(input, w1, b1,\
  \ w2, b2) ​**do**​ |\n\n| --- | --- |\n\n| ​  || input |\n\n| ​  || |> hidden(w1,\
  \ b1) |\n\n| ​  || |> output(w2, b2) |\n\n| ​  || ​**end**​ |\n\nThe predict function\
  \ shown here actually implements a simple neural network. It takes an input and\
  \ some trainable parameters and produces a transformed output. Notice that the neural\
  \ network is simply a composition of functions. You can add additional hidden layers\
  \ by adding some additional parameters and additional calls to the hidden function.\n\
  \nYour final NeuralNetwork module will look like this:\n\n| ​  || ​**defmodule**​\
  \ NeuralNetwork ​**do**​ |\n\n| --- | --- |\n\n| ​  || ​**import**​ Nx.Defn |\n\n\
  | ​  ||  |\n\n| ​  || defn dense(input, weight, bias) ​**do**​ |\n\n| ​  || input\
  \ |\n\n| ​  || |> Nx.dot(weight) |\n\n| ​  || |> Nx.add(bias) |\n\n| ​  || ​**end**​\
  \ |\n\n| ​  ||  |\n\n| ​  || defn activation(input) ​**do**​ |\n\n| ​  || Nx.sigmoid(input)\
  \ |\n\n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || defn hidden(input, weight, bias)\
  \ ​**do**​ |\n\n| ​  || input |\n\n| ​  || |> dense(weight, bias) |\n\n| ​  || |>\
  \ activation() |\n\n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || defn output(input,\
  \ weight, bias) ​**do**​ |\n\n| ​  || input |\n\n| ​  || |> dense(weight, bias)\
  \ |\n\n| ​  || |> activation() |\n\n| ​  || ​**end**​ |\n\n| ​  || ​**end**​ |\n\
  \nThe next step is to generate the intermediate parameters w1, b1, w2, and b2 for\
  \ your hidden and output layers. To keep things simple, you’ll only input scalar\
  \ shapes to your neural network, so your parameters can all be scalars as well:\n\
  \n\n\n# 生成模型\n\nAxon 是一个用于在 Elixir 中创建和训练神经网络的库，是 Elixir 生态系统中深度学习的主要工具。在本书的其余部分，你将深入研究\
  \ Axon API，并使用 Axon 在复杂问题上创建和训练神经网络。正如上一节所示，创建神经网络在 Nx 中通常涉及大量样板代码。Axon 抽象了所有样板代码，并提供了简化的\
  \ API 来构建和训练神经网络。\n\n作为 Elixir 中深度学习的入门，你将训练一个算法来解决手写数字分类问题，如在 *Understanding the\
  \ Need for Deep Learning* 中描述。跟随的最佳方式是启动另一个 Livebook 并安装以下依赖：\n\n```\n| Mix.install(\
  \ [\n|   {:axon, \"~> 0.5\"},\n|   {:nx, \"~> 0.5\"},\n|   {:exla, \"~> 0.5\"},\n\
  |   {:scidata, \"~> 0.1\"},\n|   {:kino, \"~> 0.8\"},\n|   {:table_rex, \"~> 3.1.1\"\
  }\n| ] )\n```\n\n大多数这些依赖你已经在本书中熟悉，因为你已经大量使用了 Nx、EXLA 和 Scidata。Nx 作为数值数据的核心库，EXLA\
  \ 用于加速你的代码。Scidata 包含用于训练的数据集，而 Axon 是你用来创建和训练模型的工具。Kino 和 TableRex 都可用于在 Livebooks\
  \ 和控制台中直接可视化 Axon 模型。\n\n在继续之前，你需要设置笔记本选项：\n\n```\nNx.default_backend(EXLA.Backend)\n\
  ```\n\n这确保所有通过 defn 编译的代码都使用 EXLA 后端。虽然普通 CPU 足以完成此问题，但 GPU 加速永远不会有害。\n\n## 使用数据\n\
  \n完成所有行政工作后，是时候为训练准备数据了。本节使用的数据集是 MNIST，包含 60,000 张 28x28 灰度手写数字图像（0 到 9）。MNIST\
  \ 是机器学习领域中极其流行的数据集，常被视为深度学习的“Hello world”示例。\n\nScidata 提供内置功能下载 MNIST。你可以像下面这样获取\
  \ MNIST 图像和标签：\n\n```\n{images, labels} = Scidata.MNIST.download()\n```\n\n请记住，Scidata\
  \ 并不是 Nx-aware 的。图像和标签均以 {data, type, shape} 形式呈现，可以与 Nx 函数一起使用以将原始数据转换为 Nx 函数。若检查\
  \ image_type，你会发现它是 {:u, 8}，即无符号 8 位整数。MNIST 图像为灰度，每个像素值在 0 到 255 之间。你在本书中学到，在将数据传递给模型前必须对其进行归一化。同样的概念适用于深度学习，因此你需要将像素值缩放到\
  \ 0 到 1 之间。可以通过将整个图像张量除以 255 实现这一点。\n\n此外，image_shape 是一个元组 {60000, 1, 28, 28}。你可以设计神经网络处理这种图像表示，但在此示例中，你将把每张图像展平为向量。\n\
  \n最后，你可能会发现标签是 60,000 个从 0 到 9 的标签。这本身并不算坏，但在 Axon 中使用一热编码标签更方便，因此你需要将它们转换为一热标签。\n\
  \n在拥有预处理后的数据后，你需要将数据划分为训练集和测试集。具体做法是取数据集的前 50,000 张图像作为训练集，取最后 10,000 张作为测试集。你可以使用\
  \ Nx 的切片语法实现此划分：\n\n```\ntrain_range = 0..49_999//1\ntest_range = 50_000..-1//1\n\
  train_images = images[train_range]\ntrain_labels = labels[train_range]\ntest_images\
  \ = images[test_range]\ntest_labels = labels[test_range]\n```\n\n如前所述，Axon 提供了一个训练\
  \ API，执行小批量随机梯度下降。正如第 4 章 *Optimize Everything* 中所解释，机器学习算法通常通过在训练集上迭代更新模型来使用优化技术（如梯度下降）。要在小批量上执行梯度下降，你还需要将数据转换为小批量：\n\
  \n```\nbatch_size = 64\ntrain_data = train_images |> Nx.to_batched(batch_size) |>\
  \ Stream.zip(Nx.to_batched(train_labels, batch_size))\ntest_data = test_images |>\
  \ Nx.to_batched(batch_size) |> Stream.zip(Nx.to_batched(test_labels, batch_size))\n\
  ```\n\n这段代码创建了 train 和 test 数据集，它们由 {input, target} 小批量元组组成，符合 Axon 的期望格式。\n\n现在，你已经完成了数据预处理，接下来是创建模型的时机。\n\
  \n\nAxon 的核心功能是其模型创建 API。该 API 允许您通过组合 Axon 层来构建复杂模型。所有模型都以输入层开始，输入层指定 Axon 应期望输入的形状。随后，您将输入层依次传递通过变换层，直到获得所需的输出。先实现一个基本的\
  \ Axon 模型，如下：\n\n``` \n| ​  || model = |\n| --- | --- |\n| ​  || Axon.input(*\"\
  images\"*, *shape:* {nil, 784}) |\n| ​  || |> Axon.dense(128, *activation:* :relu)\
  \ |\n| ​  || |> Axon.dense(10, *activation:* :softmax) |\n```\n\n执行该单元后，您会看到模型的摘要信息：\n\
  \n``` \n| ​  || #Axon< |\n| --- | --- |\n| ​  || inputs: %{\"images\" => {nil, 784}}\
  \ |\n| ​  || outputs: \"softmax_0\" |\n| ​  || nodes: 5 |\n| ​  || > |\n```\n\n\
  ### 设计模型\n\n您需要指定一个模型，输入形状为 `{nil, 784}`。Axon 允许您使用 `nil` 作为占位符，以便在推理时填充实际值。输入层会先经过一个包含\
  \ 128 个单元且使用 `:relu` 激活的隐藏全连接层，再经过另一个包含 10 个单元且使用 `:softmax` 激活的全连接层。\n\n使用 Axon\
  \ 创建模型相对简单——难点在于理解如何组合层以构建最佳模型。\n\n为此示例，输入层形状 `{nil, 784}` 直接对应批量图像，每个图像为 784 维的向量。Axon\
  \ 需要在推理前知道输入形状，因为这会影响后续层的构建方式。若传入的形状不符合预期，Axon 会报错。\n\n包含 128 个单元且使用 `:relu` 激活的中间全连接层是一种随意选择。您可以随意更改输入单元数、激活函数，甚至添加额外的隐藏层。理论上，更多的隐藏单元和层会提升模型的表达能力，但也会导致模型过宽或过深，难以学习。通常需要尝试多种配置，找到在数据上表现最佳的模型。\n\
  \n输出层包含 10 个单元且使用 `:softmax` 激活。目标是将输入图像映射到 0 到 9 之间的标签。该层会在每个索引处输出概率，表示输入是该数字的概率。例如，索引\
  \ 0 处的概率表示输入是数字 0 的概率，索引 1 处的概率表示输入是数字 1 的概率，以此类推。\n\n设计神经网络往往更多是艺术而非科学。您需要记住适用于特定问题类型的若干原则和架构。但构建有效模型往往只需直觉和实验。本书余下部分将教您在不同情境下适合使用的模型类型，但不会提供针对特定问题的“魔法”配方。\n\
  \n### 模型表示内部\n\n假设您在 Livebook 中运行了上述代码，可以使用 Kino 与 Axon 的 `Axon.Display` 模块可视化 Axon\
  \ 模型：\n\n``` \n| ​  || template = Nx.template({1, 784}, *:f32*) |\n| --- | --- |\n\
  | ​  || |\n| ​  || Axon.Display.as_graph(model, template) |\n```\n\n`Axon.Display.as_graph/2`\
  \ 会追踪模型的执行路径，并输出 Mermaid 图，便于直观查看执行流程。您将看到如下输出：\n\n![images/GettingDeepWithAxon/AxonModel.png](img/AxonModel.png)\n\
  \n您也可以使用 `Axon.Display.as_table/2` 以表格形式展示模型：\n\n``` \n| ​  || Axon.Display.as_table(model,\
  \ template) |\n| --- | --- |\n| ​  || |> IO.puts |\n```\n\n运行代码后，会看到：\n\n![images/GettingDeepWithAxon/AxonAsTable.png](img/AxonAsTable.png)\n\
  \n该表格描述了层名称和输入、层形状、可训练参数以及每层的选项。若想了解模型对象的具体内容，可再次检查并传入 `structs: false`：\n\n```\
  \ \n| ​  || IO.inspect model, *structs:* false |\n| --- | --- |\n```\n\n您将看到更详细的结构：\n\
  \n``` \n| ​  || %{ |\n| --- | --- |\n| ​  || *\\_\\_struct\\_\\_:* Axon, |\n| ​ \
  \ || *nodes:* %{ |\n| ​  || 12 => %{ |\n| ​  || *\\_\\_struct\\_\\_:* Axon.Node,\
  \ |\n| ​  || *args:* [], |\n| ​  || *hooks:* [], |\n| ​  || *id:* 12, |\n| ​  ||\
  \ *name:* *#Function<90.106397181/2 in Axon.unique_identifiers/2>,* |\n| ​  || *op:*\
  \ *:input*, |\n| ​  || *op_name:* *:input*, |\n| ​  || *opts:* [ *shape:* {nil,\
  \ 784}, *optional:* false ], |\n| ​  || *parameters:* [], |\n| ​  || *parent:* [],\
  \ |\n| ​  || *policy:* %{ |\n| ​  || *\\_\\_struct\\_\\_:* Axon.MixedPrecision.Policy,\
  \ |\n| ​  || *compute:* {:f*, 32}, |\n| ​  || *output:* {:f*, 32}, |\n| ​  || *params:*\
  \ {:f*, 32} |\n| ​  || }, |\n| ​  || *stacktrace:* ... |\n| ​  || }, |\n| ​  ||\
  \ *output:* 20 |\n| ​  || } |\n```\n\n模型实际上是普通的 Elixir struct。Axon 模型仅是计算图的抽象表示，您可以在调用实际执行和训练\
  \ API 前对其进行操作和组合。您在构建图时是懒惰的，真正需要时才会执行。\n\n这种中间表示的有用之处在于，它使 Axon 能够实现各种看似“魔法”的功能。本书后续章节将进一步揭示这些魔法。它还允许\
  \ Axon 将模型转换为其他神经网络表示，如 ONNX。^([\\[13\\]](#f_0047.xhtml#FOOTNOTE-13)) 这对于部署模型以及利用\
  \ Python 生态中的模型非常便利，您将在第 8 章 ​*Stop Reinventing the Wheel*​ 中看到。\n\n### 训练模型\n\n\
  现在您已拥有数据和模型。接下来的步骤是使用训练数据对模型进行训练。虽然可以从零编写梯度下降实现，但这既繁琐又易出错。好在 Axon 提供了训练神经网络的便捷功能。\n\
  \nAxon 的训练抽象位于 `Axon.Loop` 模块。`Axon.Loop` 包含构建 `%Axon.Loop{}` 数据结构的函数，您可以通过 `Axon.Loop.run/3`\
  \ 将其用于输入数据。`Axon.Loop` 的 API 功能丰富，但大多数情况下只需实现一个简单的监督训练循环：\n\n``` \n| ​  || trained_model_state\
  \ = |\n| --- | --- |\n| ​  || model |\n| ​  || |> Axon.Loop.trainer(*:categorical_cross_entropy*,\
  \ *:sgd*) |\n| ​  || |> Axon.Loop.metric(*:accuracy*) |\n| ​  || |> Axon.Loop.run(train_data,\
  \ %{}, *epochs:* 10, *compiler:* EXLA) |\n```\n\n`Axon.Loop.trainer/3` 是一个工厂函数，用于创建监督训练循环，接受模型、损失函数和优化器作为输入。这里的“监督”指的是机器学习意义上的监督，而非\
  \ OTP 语境。该训练器会通过优化器最小化损失，例如传入的 `:categorical_cross_entropy` 损失函数用于多类分类问题，`:sgd`\
  \ 优化器则使用随机梯度下降。\n\n`Axon.Loop.metric/2` 用于在监督训练循环中附加监控指标。该函数告诉 Axon 在训练过程中监测并计算特定指标。对于分类问题，您主要关注预测的准确性。\n\
  \n\n\n\nFinally，`Axon.Loop.run/3` 告诉 `Axon` 在给定数据和给定选项下执行指定的训练循环。`Axon` 会遍历 `train_data`\
  \ 十个时代，最后输出一个训练好的模型状态。传递 `compiler: EXLA` 确保 `Axon` 会使用 `EXLA` 对中间训练步骤进行 JIT 编译。这将显著加速训练。当你执行该单元时，你会看到以下模型：\n\
  \n```\n| ​  || Epoch: 0, Batch: 750, accuracy: 0.9439270 loss: 0.9746160 |\n| ---\
  \ | --- |\n| ​  || Epoch: 1, Batch: 750, accuracy: 0.9759654 loss: 0.7108651 |\n\
  | ​  || Epoch: 2, Batch: 750, accuracy: 0.9799850 loss: 0.5978507 |\n| ​  || Epoch:\
  \ 3, Batch: 750, accuracy: 0.9817263 loss: 0.5321623 |\n| ​  || Epoch: 4, Batch:\
  \ 750, accuracy: 0.9830977 loss: 0.4878981 |\n| ​  || Epoch: 5, Batch: 750, accuracy:\
  \ 0.9840345 loss: 0.4553202 |\n| ​  || Epoch: 6, Batch: 750, accuracy: 0.9849032\
  \ loss: 0.4299005 |\n| ​  || Epoch: 7, Batch: 750, accuracy: 0.9856064 loss: 0.4092346\
  \ |\n| --- | --- |\n| ​  || Epoch: 8, Batch: 750, accuracy: 0.9862743 loss: 0.3919075\
  \ |\n| ​  || Epoch: 9, Batch: 750, accuracy: 0.9868216 loss: 0.3770282 |\n```\n\n\
  注意到模型遍历了你的数据集十次，每次迭代都导致更高的准确率和更低的损失。你可能还注意到训练循环返回的内容类似于：\n\n```\n| ​  || %{ |\n\
  | --- | --- |\n| ​  || \"dense_0\" => %{ |\n| ​  || \"bias\" => #Nx.Tensor< |\n\
  | ​  || f32[128] |\n| ​  || EXLA.Backend<host:0, 0.2489291390.1016463368.89685>\
  \ |\n| ​  || [ ... ] |\n| ​  || \\>, |\n| ​  || \"kernel\" => #Nx.Tensor< |\n| ​ \
  \ || f32[784][128] |\n| ​  || EXLA.Backend<host:0, 0.2489291390.1016463368.89686>\
  \ |\n| ​  || [ |\n| ​  || [ ... ], |\n| ​  || ... |\n| ​  || ] |\n| ​  || \\>, |\n\
  | ​  || } |\n| ​  || \"dense_1\" => %{ ... } |\n| ​  || } |\n```\n\n这就是 `trained_model_state`。`Axon`\
  \ 结构体是神经网络的无状态表示，它不内部保存任何模型参数或状态。这意味着在进行推理和评估时，你始终需要同时获得模型和与给定模型兼容的模型状态。`Axon` 的监督训练循环始终会输出一个与正在训练的模型兼容的模型状态。\n\
  \n模型状态是嵌套的命名空间和参数映射。每个顶层映射键代表一个 `Axon` 命名空间。大多数模型通过层来命名空间。在这个示例中，你会看到每个层 `dense_0`\
  \ 和 `dense_1` 都有一个键，而在每个命名空间内，每个层参数 `kernel` 和 `bias` 也有一个键。\n\n### 模型评估\n\n记住，在机器学习中，你只关心模型在未见测试集上的表现。训练集上\
  \ 98% 的准确率并不代表模型的真实性能。幸运的是，`Axon` 还提供了便利的功能来对测试数据进行模型评估。要评估你的模型，实施以下受监督的评估循环：\n\n\
  ```\n| ​  || model |\n| --- | --- |\n| ​  || |> Axon.Loop.evaluator() |\n| ​  ||\
  \ |> Axon.Loop.metric(​*:accuracy*​) |\n| ​  || |> Axon.Loop.run(test_data, trained_model_state,\
  \ ​*compiler:*​ EXLA) |\n```\n\n`Axon.Loop.evaluator/2` 是一个工厂函数，它使用 `Axon` 模型和模型状态创建受监督的评估循环。评估器告诉\
  \ `Axon` 在状态 `trained_model_state` 处对模型进行评估。你还需要告诉 `Axon` 想要使用哪些指标来评估模型。在此例中，你附加了\
  \ `accuracy`，所以 `Axon` 知道在循环中跟踪 `accuracy`。最后，你需要告诉 `Axon` 在 `test_data` 上执行循环。\n\
  \n运行代码后，你会看到：\n\n```\n| ​  || Batch: 156, accuracy: 0.9881768 |\n| --- | --- |\n\
  ```\n\n这表明你的模型在测试数据中正确预测了约 99% 的数字。这已经很不错了。当然，模型的目的是在新数据上进行预测，那么如何使用 `Axon` 来实现呢？\n\
  \n### 使用 `Axon` 执行模型\n\n`Axon` 提供了编译和运行 `Axon` 模型的执行 API。首先，从 `test_data` 中获取一个单独的图像批次：\n\
  \n```\n| ​  || {test_batch, \\_} = Enum.at(test_data, 0) |\n| --- | --- |\n```\n\
  \n为了简化，取出单张图像：\n\n```\n| ​  || test_image = test_batch[0] |\n| --- | --- |\n```\n\
  \n你可以使用 `Nx.to_heatmap` 来可视化图像：\n\n```\n| ​  || test_image |\n| --- | --- |\n| ​ \
  \ || |> Nx.reshape({28, 28}) |\n| ​  || |> Nx.to_heatmap() |\n```\n\n你会看到类似于 图像\
  \ 的内容。\n\n![images/GettingDeepWithAxon/TestImage.png](img/TestImage.png)\n\n在这个示例中，测试图像是\
  \ 3，模型应该将 3 作为最可能的标签预测。\n\n现在，你拥有所有需要的东西来对模型进行预测：一个模型、一个与模型兼容的模型状态以及一个输入。最简单的查询方式是先使用\
  \ `Axon.build/2` 构建模型，然后调用返回的 `predict_fn`。`Axon.build/2` 将模型转换为一个包含 `{init_fn,\
  \ predict_fn}` 的元组。`init_fn` 是一个二元函数，用于初始化模型的参数。`predict_fn` 是一个二元函数，接受模型参数和输入张量或张量集合，并返回运行完整模型的结果。\n\
  \n运行以下代码尝试查询模型的预测：\n\n```\n| ​  || {\\_, predict_fn} = Axon.build(model, ​*compiler:*​\
  \ EXLA) |\n| --- | --- |\n| ​  || predict_fn.(trained_model_state, test_image) |\n\
  ```\n\n你会看到以下错误信息：\n\n```\n| ​  || \\*\\* (Axon.CompileError) exception found ​**when**​\
  \ compiling layer |\n| --- | --- |\n| ​  || Axon.Layers.dense/4 named ​*dense_0:*​\
  \ |\n| ​  ||  |\n| ​  || \\*\\* (ArgumentError) Axon.Layers.​*dense:*​ expected\
  \ input shape to have at |\n| ​  || least rank 2, got rank 1 |\n| ​  || (axon 0.5.1)\
  \ lib/axon/shared.​*ex:*​92: Axon.Shared.assert_min_rank!/4 |\n| ​  || (nx 0.5.1)\
  \ lib/nx/defn/compiler.​*ex:*​203: Nx.Defn.Compiler.\\_\\_remote\\_\\_/4 |\n| ​ \
  \ || (axon 0.5.1) lib/axon/layers.​*ex:*​125: Axon.Layers.​*\"*​​*​_\\_\\_defn:dense_impl__*\"\
  *​/4 |\n```\n\n发生了什么？请记住 `Axon` 要求输入形状相对静态并符合模型创建时指定的形式。在此例中，你的 `test_image` 缺少一个额外的维度，可以使用\
  \ `Nx.new_axis` 在维度 0 上添加一个维度：\n\n```\n| ​  || probabilities = |\n| --- | --- |\n\
  | ​  || test_image |\n| ​  || |> Nx.new_axis(0) |\n| ​  || |> then(&predict_fn.(trained_model_state,\
  \ &1)) |\n```\n\n你会看到类似的输出：\n\n```\n| ​  || ​*#Nx.Tensor<*​ |\n| --- | --- |\n|\
  \ ​  || f32[1][10] |\n| ​  || EXLA.Backend<​*host:*​0, 0.4078460682.4224843782.56655>\
  \ |\n| ​  || [ |\n| ​  || [6.16645411355421e-5, 0.011110336519777775, 0.07432620227336884,\
  \ ...] |\n| ​  || ] |\n| ​  || \\> |\n```\n\n请记住，你的模型会输出十个与标签 0 到 9 对应的概率。你可以通过计算\
  \ `Nx.argmax` 来获取离散标签：\n\n```\n| ​  || probabilities |> Nx.argmax() |\n| --- | ---\
  \ |\n```\n\n这将给出以下输出：\n\n```\n| ​  || ​*#Nx.Tensor<*​ |\n| --- | --- |\n| ​  ||\
  \ s64 |\n| ​  || EXLA.Backend<​*host:*​0, 0.4078460682.4224843782.56658> |\n| ​ \
  \ || 3 |\n| ​  || \\> |\n```\n\n你看到的正是你所期待的结果。恭喜，你现在拥有一个模型、一个训练好的模型状态以及使用任何输入查询训练模型的能力。\n\
  \n### 总结\n\n在这一章中，你被介绍了深度学习以及为什么它对于某些类别的问题比其他方法更有效。你拆解了神经网络的结构，并实现了一种最常见的神经网络类型：基本的前馈或密集网络。你使用\
  \ `Axon` 创建、训练和评估神经网络。\n\n\n\n\n虽然 feed-forward 网络可以用于解决一系列复杂问题，但在某些类别的问题中，feed-forward\
  \ 网络是不够的。在接下来的章节中，你将在不同领域解决 feed-forward 网络不足的问题，并实现不同类型的神经网络，以克服基础 feed-forward\
  \ 网络在特定输入类别上的局限性。\n\n#### Footnotes\n\n[\\[11\\]](#f_0045.xhtml#FNPTR-11)\n\n: \n\
