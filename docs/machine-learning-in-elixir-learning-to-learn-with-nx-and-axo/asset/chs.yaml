  \n## Integrating Nx with Phoenix\n\n-   [现在，运行 mix deps.get 以获取依赖：]\n\n| mix deps.get\
  \ |\n\n-   [创建新文件 book_search/model.ex，该文件用于加载、服务和执行推理：]\n\n\n\n\n|​  || ​`defp`​\
  \ `load()`​ `do`​ |\n| --- | --- |\n|​  || {​*:ok*​, `model_info`} = `Bumblebee.load_model`({​*:hf*​,\
  \ `@hf_model_repo`}) |\n|​  || {​*:ok*​, `tokenizer`} = `Bumblebee.load_tokenizer`({​*:hf*​,\
  \ `@hf_model_repo`}) |\n|​  || |\n|​  || {`model_info`, `tokenizer`} |\n|​  || ​`end`​\
  \ |\n\n此函数利用 Elixir 的 `Bumblebee` 库从 HuggingFace 加载模型。你应当在第 11 章中已经熟悉 `Bumblebee`，​*Model\
  \ Everything with Transformers*​。\n\n`Bumblebee` 是用于使用预训练模型和任务的库，适用于常见的应用场景，如图像分类、文本生成等，同时还能导入专为相似度搜索设计的预训练模型。例如，你正在使用的模型来自\
  \ HuggingFace^([\\[44\\]](#f_0090.xhtml#FOOTNOTE-44))，专为句子相似度设计，意味着它是专门用于搜索和聚类任务进行训练的。\n\
  \n`load/0` 函数会返回一个元组，包含模型和分词器。模型是一个包含 `{model, params}` 的元组，分词器是一个 `Bumblebee` 分词器结构体。你稍后会使用这两者来构建推理管道。\n\
  \n接下来，创建一个名为 `serving/1` 的函数：\n\n|​  || ​`def`​ `serving(opts \\\\\\\\ [])​`​ `do`​\
  \ |\n| --- | --- |\n|​  || `opts` = `Keyword.validate!`(`opts`, \\[ |\n|​  || ​`:defn_options*​`,\
  \ ​*sequence_length:*​ 64, ​*batch_size:*​ 16 |\n|​  || \\]) |\n|​  || |\n|​  ||\
  \ {`model_info`, `tokenizer`} = `load()` |\n|​  || |\n|​  || `Bumblebee.Text.TextEmbedding.text_embedding`(`model_info`,\
  \ `tokenizer`, \\[ |\n|​  || ​*defn_options:*​ `opts`​[:defn_options*​\\], |\n|​ \
  \ || ​*compile:*​ \\[ |\n|​  || ​*sequence_length:*​ `opts`​[:sequence_length*​\\\
  ], |\n|​  || ​*batch_size:*​ `opts`​[:batch_size*​\\] |\n|​  || \\] |\n|​  || \\\
  ]) |\n|​  || |\n|​  || ​`end`​ |\n\n此函数使用 `Bumblebee` 提供的预构建服务管道来执行文本嵌入。\n\n在机器学习领域，你会经常听到“serving”这个词。在\
  \ Nx 中，serving 是构建推理管道的简单抽象，包含预处理、推理和后处理。如果你从零开始编写这个 serving，它可能会像下面这样：\n\n|​  ||\
  \ ​`def`​ `serving(opts \\\\\\\\ [])​`​ `do`​ |\n| --- | --- |\n|​  || `opts` =\
  \ `Keyword.validate!`(`opts`, \\[ |\n|​  || ​`:defn_options*​`, ​*sequence_length:*​\
  \ 64, ​*batch_size:*​ 16 |\n|​  || \\]) |\n|​  || |\n|​  || {`model_info`, `tokenizer`}\
  \ = `load()` |\n|​  || {%\\_, `predict_fn`} = `Axon.build`(`model`) |\n|​  || |\n\
  |​  || `Nx.Serving.jit`​(**`fn`​ `input` -> |\n|​  || ​pad_size = `opts`​[:sequence_length*​\\\
  ] - `Nx.axis_size`(`input`, 1) |\n|​  || `predict_fn`​`(params, Nx.Batch.pad`​(`input`,\
  \ pad_size)) |\n|​  || ​**end**​) |\n|​  || |> `Nx.Serving.client_preprocessing`​(**`fn`​\
  \ `text` -> |\n|​  || ​tokenized = `Bumblebee.apply_tokenizer`​(`tokenizer`, `text`)\
  \ |\n|​  || {`Nx.Batch.stack`​(`tokenized`), ​*:meta*​} |\n|​  || ​**end**​) |\n\
  |​  || |> `Nx.Serving.client_postprocessing`​(& elem(&1, 0)) |\n|​  || ​**end**​\
  \ |\n\n此函数之所以被称为 `serving/1`，是因为它返回了你的 `Nx.Serving` 管道。`Nx.Serving` 模块包含构建 servings\
  \ 的函数，如这里所示，包括 `Nx.Serving.jit/1` 和 `Nx.Serving.client_preprocessing/1`。但为什么需要专门的\
  \ serving 管道？为何不能直接调用模型的 `predict_fn`？\n\n有几个原因，但最重要的原因是，servings 通过动态批处理最大化研究利用率。深度学习模型昂贵，但它们也能利用批量推理。推理延迟并不随批量大小线性增长，事实上，某些加速器（如\
  \ TPU）要求批量大小至少为 128，并在执行推理前会对输入进行填充。如果不使用最大可能的批量大小执行每一次推理，就是浪费资源。\n\n动态批处理是利用可用资源的一种方式。当你启动一个\
  \ `Nx.Serving` 进程时，它会在后台启动一个队列。随着你向 serving 进程发起推理请求，`Nx.Serving` 会自动将重叠的请求批量处理，然后再分发回调用进程。这意味着，如果你在同一时间与另一个人发起推理请求，两者的请求会在同一批次中被执行，然后分别返回，仿佛是单独执行的。动态批处理对于在生产环境中有效扩展机器学习推理至关重要。\n\
  \n如 `serving/1` 中所示，每个 `Nx.Serving` 都以对 `Nx.Serving.jit/1` 或 `Nx.Serving.new/1`\
  \ 的调用开始。`Nx.Serving.jit/1` 接收一个一陆位的创建函数，该函数返回一个即时编译的推理函数。在这个例子中，`Nx.Serving.jit/1`\
  \ 创建了一个编译后的编码函数。你的实际推理函数接受 serving 输入并返回编码后的输出。在调用 `encoding_fun/2` 之前，需要先调用 `Nx.Batch.pad/2`。`Nx.Batch.pad/2`\
  \ 是一个帮助函数，用于将输入填充到由编译函数指定的所需批量大小。如果动态批处理队列无法达到所需批量大小，`Nx.Batch.pad/2` 会将输入填充到所需尺寸。\n\
  \n除了在 `Nx.Serving.jit/1` 中指定的推理函数外，你还可以使用 `Nx.Serving` 函数指定客户端预处理和后处理函数。在这个简单示例中，你只需调用\
  \ `Bumblebee.apply_tokenizer/2` 即可。\n\n预处理是指在输入到达推理步骤之前，你想执行的任何工作。通常，它会将原始数据转换为清理后的张量。预处理，就像推理一样，也在后台以批量方式执行。虽然在服务器端进行预处理很常见，但对于某些应用，在客户端进行预处理也很合理，以避免服务器被过多工作饱和。例如，你可以使用\
  \ JavaScript canvas API 调整图片大小，以节省服务器资源。\n\n每个客户端预处理函数接受原始输入并返回一个元组 `{processed,\
  \ meta}`。额外的元数据会转发给后处理，因为在某些任务中，需要访问原始输入以进行后处理。\n\n`Bumblebee` 已经为你实现了许多常见的机器学习管道，从而免除你关注内部细节的复杂性。对于特定应用，你可能需要或需要实现自己的自定义\
  \ serving 管道，因此理解其工作原理很重要。\n\n在实现完 serving 后，你可以将以下代码添加到你的应用监督树中：\n\n|​  || {`Nx.Serving`,\
  \ |\n| --- | --- |\n|​  || ​*serving:*​ `BookSearch.Model.serving`​(`defn_options:`​\
  \ \\[​`compiler:`​ `EXLA`\\]), |\n|​  || ​*batch_size:*​ 16, |\n|​  || ​*batch_timeout:*​\
  \ 100, |\n|​  || ​*name:*​ `BookSearchModel`} |\n\n这段代码将使用你在 `BookSearch.Model.serving/1`\
  \ 中定义的 serving 启动一个新的 `Nx.Serving` 进程。该进程名为 `BookSearchModel`，因此你可以在稍后通过名称进行推理。其他两个选项，`batch_size`\
  \ 和 `batch_timeout`，控制 `Nx.Serving` 中使用的批处理队列。\n\n`batch_size` 指的是队列在向预测派发前能接受的最大批量大小。`batch_timeout`\
  \ 指的是队列在收到第一个推理请求后等待填充到最大批量大小所需的时间。在此示例中，你的模型在达到批量大小 16 或自接收第一个推理请求后 100ms 之内（取先发生者）进行推理。根据你的应用、模型和资源，你可能需要调整这些配置选项以最大化性能。\n\
  \n\n\n-   [在应用中运行了 Nx.Serving 进程后，你可以使用它来进行推理。为此，在 BookSearch.Model 模块中添加 predict/1\
  \ 方法：]\n\n| ​  || ​**def**​ predict(text) ​**do**​ |\n| --- | --- |\n| ​  || Nx.Serving.batched_run(BookSearchModel,\
  \ text) |\n| ​  || ​**end**​ |\n\n| ​  || Nx.Serving.batched_run(BookSearchModel,\
  \ text) |\n| --- | --- |\n| ​  || ​**end**​ |\n\n-   该函数仅是对 Nx.Serving.batched_run/2\
  \ 方法的包装。Nx.Serving.batched_run/2 使用给定的进程和输入执行动态批量推理。在此情况下，BookSearch.Model.predict/1\
  \ 调用会返回以 text 参数提供的输入文本的嵌入式表示。\n\n-   为了验证模型已正确启动，请重启 Phoenix 服务器：\n\n| ​  || iex\
  \ -S mix phx.server |\n| --- | --- |\n| ​  || iex -S mix phx.server |\n\n-   你可能会在应用启动时注意到轻微的延迟——这实际上是\
  \ EXLA 在后台编译并加载模型。\n\n-   接下来，在 IEx 中运行以下代码：\n\n| ​  || iex(1)> BookSearch.Model.predict(*\"\
  a good book on machine learning\"*​) |\n| --- | --- |\n| ​  || iex(1)> BookSearch.Model.predict(*\"\
  a good book on machine learning\"*​) |\n\n-   几乎即时会看到以下输出：\n\n| ​  || %{embedding:\
  \ #Nx.Tensor< |\n| --- | --- |\n| ​  || f32\\[1\\]\\[384\\] |\n| ​  || EXLA.Backend<host:0,\
  \ 0.2486389031.1855586325.245579> |\n| ​  || \\[ \\] |\n| ​  || \\[-0.01250604260712862,\
  \ 0.027123818174004555, ...\\] |\n| ​  || \\] |\n| ​  || \\>} |\n| ​  || \\>} |\n\
  \n-   成功！你已在 Phoenix 应用中运行一个可工作的机器学习模型。现在你可以将文档和查询进行嵌入，但目前仍无法进行搜索。在实现搜索功能之前，你需要一些种子数据。\n\
  \n## 为数据库添加种子数据\n\n在模型就绪后，是时候用图书馆的书籍对数据库进行种子化。在此之前，需要对生成的书籍资源代码进行一些微调。\n\n首先，修改\
  \ BookSearch.Book.changeset/2 以匹配以下内容：\n\n| ​  || @doc false |\n| --- | --- |\n\
  | ​  || ​**def**​ changeset(book, attrs) ​**do**​ |\n| ​  || book |\n| ​  || |>\
  \ cast(attrs, [:author, :title, :description, :embedding]) |\n| ​  || |> validate_required([:author,\
  \ :title, :description]) |\n| ​  || ​**end**​ |\n\n-   注意已将 :embedding 从 attrs 的必填参数中移除。由于你会根据书籍属性计算嵌入式，不想在前期就必须手动传入它。\n\
  \n-   接下来，在 BookSearch.Book 中添加 put_embedding/1 函数：\n\n| ​  || @doc false |\n| ---\
  \ | --- |\n| ​  || ​**def**​ put_embedding(%{​*changes:*​ %{​*description:*​ desc}}\
  \ = book_changeset) ​**do**​ |\n| ​  || %{​*embedding:*​ embedding} = BookSearch.Model.predict(desc)\
  \ |\n| ​  || put_change(book_changeset, :embedding, embedding) |\n| ​  || ​**end**​\
  \ |\n\n-   这段代码根据描述对书籍进行嵌入，并将嵌入式加入 changeset。可以直接在 changeset 中使用 Nx 张量类型；Elixir\
  \ pgvector 扩展能够直接将 Nx 张量序列化为 PostgreSQL 的 pgvector 类型。\n\n-   最后，在 BookSearch.Library\
  \ 中修改 create_book/1 方法以匹配以下实现：\n\n| ​  || ​**def**​ create_book(attrs \\\\\\\\ %{})\
  \ ​**do**​ |\n| --- | --- |\n| ​  || book = |\n| ​  || %Book{} |\n| ​  || |> Book.changeset(attrs)\
  \ |\n| ​  || |> Book.put_embedding() |\n| ​  || |\n| ​  || Repo.insert(book) |\n\
  | ​  || ​**end**​ |\n\n-   该方法根据给定的书籍属性创建 changeset，嵌入书籍，然后将其插入数据库。\n\n-   在对库进行种子化之前，需要更新\
  \ HTML 视图，移除对嵌入式的引用。因为嵌入式内部以原始二进制表示，在网页上渲染效果不佳，且用户无需编辑它们，所以不应在表单中包含它们。\n\n-   移除以下代码在各文件中的引用：\n\
  \n| ​  || ​*\\# book_form.html.heex*​ |\n| --- | --- |\n| ​  || <.input field={{f,\
  \ :embedding}} type=​*\"*​​*text\"*​ label=​*\"*​​*Embedding\"*​ /> |\n| ​  || \
  \ |\n| ​  || ​*\\# show.html.heex*​ |\n| ​  || <​*:item*​ title=​*\"*​​*Embedding\"\
  *​​**\\>**​<%= @book.embedding %​**\\>**​</​*:item*​> |\n| ​  ||  |\n| ​  || ​*\\\
  # index.html.heex*​ |\n| ​  || <​*:col*​ ​*:let=*​{book} label=​*\"*​​*Embedding\"\
  *​​**\\>**​<%= book.embedding %​**\\>**​</​*:col*​> |\n\n-   现在，你已准备好使用真实数据。用于表示你图书馆的数据集来自\
  \ David Bamman 的书籍摘要数据库。^([\\[45\\]](#f_0090.xhtml#FOOTNOTE-45)) 运行以下命令下载并解压数据库：\n\
  \n| ​  || cd priv/repo |\n| --- | --- |\n| --- | --- |\n| ​  || wget https://www.cs.cmu.edu/~dbamman/data/booksummaries.tar.gz\
  \ |\n| ​  || tar -xvf booksummaries.tar.gz |\n| ​  || rm booksummaries.tar.gz |\n\
  \n-   该数据库以制表符分隔的每行记录形式存储书籍信息。为了将此文件解析为可用于种子数据库的格式，可以使用 Explorer。具体需要用 Explorer\
  \ 解析输入文件，提取作者、标题和描述，然后将每本书添加到数据库。为此，在 priv/repo/seeds.exs 文件中添加以下代码：\n\n| ​  ||\
  \ path = ​*\"*​​*priv/repo/booksummaries/booksummaries.txt\"*​ |\n| --- | --- |\n\
  | ​  ||  |\n| ​  || df = Explorer.DataFrame.from_csv!(path, ​*delimiter:*​ *\"\\\
  t\"*, ​*header:*​ false) |\n| ​  || df = df[[​*\"*​​*column_3\"*​, ​*\"*​​*column_4\"\
  *​, ​*\"*​​*column_7\"*​\\]​ |\n| ​  || df = Explorer.DataFrame.rename(df, [​*\"\
  *​​*author\"*​, ​*\"*​​*title\"*​, ​*\"*​​*description\"*​]) |\n| ​  ||  |\n| ​ \
  \ || df |\n| ​  || |> Explorer.DataFrame.to_rows() |\n| ​  || |> Enum.each(&BookSearch.Library.create_book/1)\
