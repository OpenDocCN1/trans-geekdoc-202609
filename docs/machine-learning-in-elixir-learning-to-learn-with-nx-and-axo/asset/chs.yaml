  \nCopyright © 2024, The Pragmatic Bookshelf. \n\n# Chapter 14  \n\nThat’s a Wrap\n\
  \nThroughout this book, you’ve implemented a number of different machine learning\
  \ models in `Nx`, `Axon`, `Bumblebee`, and `Scholar`. You learned how to manipulate\
  \ data with `Nx`, train models with `Axon`, and integrate them into your Phoenix\
  \ applications. You discovered how to take advantage of the vast ecosystem of pre-trained\
  \ models with `Bumblebee`. You know everything you need to know to create your own\
  \ models on your own data and integrate them into your own applications. You’re\
  \ ready to take on the challenges of machine learning in the real world.\n\nWhile\
  \ this book covered a breadth of topics, it’s by no means comprehensive. Machine\
  \ learning is a vast field. You can’t possibly learn everything about machine learning\
  \ from a single book. In this chapter, you’ll get up to speed with the current trends\
  \ in machine learning and discover some of the interesting machine learning topics\
  \ this book wasn’t able to cover.\n\n## Learning from Experience\n\nOne of the largest\
  \ subfields in machine learning this book didn’t cover is `reinforcement learning`.\
  \ `Reinforcement learning` is concerned with creating agents capable of making intelligent\
  \ actions and learning from reward signals in an environment. `Reinforcement learning`\
  \ is fundamentally different from both supervised and unsupervised learning. In\
  \ a `reinforcement learning` problem, there’s no concept of labeled or unlabeled\
  \ data. Instead, the learning process is entirely online as an agent interacts with\
  \ its environment.\n\nThe most common training ground for `reinforcement learning`\
  \ agents is video games. For example, the Arcade Learning Environment^([\\[48\\\
  ]](#f_0096.xhtml#FOOTNOTE-48)) is an environment designed to allow researchers and\
  \ hobbyists to create AI agents capable of interacting with Atari 2600 games. `Reinforcement\
  \ learning` can be credited with some of the superhuman demonstrations of artificial\
  \ intelligence in the last decade. For example, AlphaGo, the model from Deep Mind\
  \ which is capable of playing Go at superhuman levels, was trained with `reinforcement\
  \ learning`.\n\nIn addition to video games, `reinforcement learning` has proven\
  \ to be a fruitful paradigm in robotics. As it’s difficult to collect data and train\
  \ robots on performing proper locomotion in a supervised manner, researchers often\
  \ train locomotion via `reinforcement learning`. The success of `reinforcement learning`\
  \ has dramatically increased with a turn toward methods that combine `reinforcement\
  \ learning` with deep learning. Most state-of-the-art `reinforcement learning` algorithms\
  \ today rely on deep models.\n\n`Reinforcement learning` is a rich field of research.\
  \ If you’re interested in exploring `reinforcement learning` more, I recommend reading\
  \ [*Reinforcement Learning* [SB92\\]](#f_0098.xhtml#d1806e1437) by Richard S. Sutton\
  \ and Andrew G. Barto.\n\nAt the time of this writing, the hottest model in machine\
  \ learning is ChatGPT.^([\\[49\\]](#f_0096.xhtml#FOOTNOTE-49)) ChatGPT is a large\
  \ language model from OpenAI optimized for chat dialogue. ChatGPT is part of a growing\
  \ trend of large language models trained with `reinforcement learning` on human\
  \ feedback (RLHF). RLHF combines `reinforcement learning` with human ratings to\
  \ optimize the parameters of the model. With lots of human feedback, you end up\
  \ with a model capable of outputting text that aligns with what humans prefer.\n\
  \nLarge language models are already great at modeling text. As you learned in Chapter\
  \ 11, ​*Model Everything with Transformers*​, large language models pre-trained\
  \ on a causal language modeling task are great at predicting the next word in a\
  \ sequence. Some [*research* [HBDF19\\]](#f_0098.xhtml#d1806e802) has shown that\
  \ as large language models approach the optimal likelihood for a text generation\
  \ task, they tend to devolve into repetition. What that means is that large language\
  \ models are great at probabilistically modeling language. But being good at modeling\
  \ language doesn’t mean you’re convincing to humans. ChatGPT and related RLHF models\
  \ are fine-tuned for human preference.\n\nThe promise of RLHF is that we can collect\
  \ enough human feedback so that these models are perfectly aligned with our preferences\
  \ and capable of performing a wide range of tasks at the human level. Another promise\
  \ of RLHF is that large language models eventually become powerful enough to give\
  \ feedback to themselves. This trend is already emerging out of research labs such\
  \ as Anthropic. Recent works from Anthropic on [*Constitutional AI* [BKKA19\\]](#f_0098.xhtml#d1806e36)\
  \ have shown that large language models are capable of criticizing and correcting\
  \ themselves to align with a set of dictated preferences. The trend towards reinforcement\
  \ learning on artificial intelligence feedback (RLAIF) could eliminate much of the\
  \ intensive work of collecting human annotations and rapidly accelerate AI research.\n\
  \n## Diffusing Innovation\n\nAnother recent innovation this book hasn’t completely\
  \ covered is the success of diffusion models in generative applications. As you\
  \ briefly learned in ​*What Is the State of the Art?*​, latent diffusion is the\
  \ process of progressively denoising over long time series. This process can be\
  \ used to start from an image of random noise to generate incredibly realistic images.\n\
  \nAt their core, diffusion models are based on a process of iterative refinement.\
  \ Initially, they start with a pattern of random noise. Over successive iterations,\
  \ this noise is gradually shaped into a coherent output, whether that be an image,\
  \ text, or another form of data. While their most popular application is in generative\
  \ art, diffusion models have been used with great success in video and speech generation.\
  \ Recent work also shows it’s possible to use diffusion models in text generation\
  \ tasks, such as machine translation and code generation.\n\nFor a more comprehensive\
  \ introduction to the world of diffusion models, check out Introduction to Diffusion\
  \ Models for Machine Learning^([\\[50\\]](#f_0096.xhtml#FOOTNOTE-50)) by AssemblyAI.\n\
  \n## Talking to Large Language Models\n\n\n\n\n-   随着大语言模型的普及，机器学习和人工智能领域中出现的一个新兴方向是通过提示工程在推理时提升大语言模型的性能。提示工程是战略性地构建输入提示的过程，以有效引导大语言模型生成所需的输出。大语言模型擅长理解文本，但需要具体指令才能执行任务。\n\
  \n-   链式思考提示（chain-of-thought prompting）是最流行的提示工程技术之一。它要求大语言模型将问题分解为子任务，并将它们串联成输出。换句话说，你引导模型在生成最终结果前展示其思维链。实验表明，链式思考提示在特定基准上提升了大语言模型的推理能力。\n\
  \n-   通过检索增强生成（retrieval augmented generation, RAG）实现的上下文学习是另一种流行的引导大语言模型提供准确回答的方法。RAG（检索增强生成）是通过检索相关事实和上下文，供模型在回答时使用的过程。检索过程通常涉及语义搜索，将问题与相关事实匹配。RAG\
  \ 有效，但需要强大的检索管道。对于某些应用，构建能够提供足够上下文的健壮检索管道很困难。\n\n-   大语言模型的一个持久挑战是可靠部署并将其集成到传统软件应用中。虽然最流行的应用通过聊天界面使用大语言模型，但它们在许多其他场景下也十分有用。\n\
  \n-   让大语言模型可靠地与传统的确定性软件交互很困难。最近的结构化提示（structured prompting）研究旨在解决这一问题。结构化提示依赖于大语言模型生成符合\
  \ JSON Schema 规范的输出。例如，OpenAI 推出了函数调用 API，允许你指定结构化 Schema，供模型在生成时遵循。开源库通过受限生成实现类似功能，确保模型输出符合\
  \ JSON 格式，供应用直接使用。\n\n-   结构化提示利用大语言模型生成结构化输出的能力。基本上，你定义想要模型遵循的 Schema，提示模型，并从其生成中直接获得应用能理解的数据结构。像\
  \ instructor_ex^(`instructor_ex^([\\[51\\]](#f_0096.xhtml#FOOTNOTE-51))`) 这样的库让你可以定义\
  \ Ecto Schemas，提示模型完成任务，并获得符合定义 Schema 的有效数据结构。该库基于 Python 生态中的原始 Instructor^(`Instructor^([\\\
  [52\\]](#f_0096.xhtml#FOOTNOTE-52))`) 库。\n\n-   结构化提示为 Software 1.0 与 Software 2.0\
  \ 之间提供了可靠的桥梁。它使你能在应用中可靠地与大语言模型交互，而无需解析模型原始非结构化结果，而是直接获得有用的数据结构。\n\n## Compressing\
  \ Knowledge\n\n-   随着大语言模型热潮，在训练和推理阶段进行模型压缩技术方面取得了显著创新。最显著的两个例子是：\n\n```\nif (condVar\
  \ > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n虽然 Python 确实拥有先发优势，并且拥有大量研究人员和创新者的生态系统支持，但\
  \ Elixir 的前景对希望基于已验证技术构建并扩展的小团队具有吸引力。此外，能够与 Python 互操作并利用已训练好的模型，使得从 Python 转向 Elixir\
  \ 的决定变得更加容易。\n\n机器学习的未来光明——你在机器学习领域的未来也光明。不要止步于此。\n\n#### Footnotes\n\n[\\[48\\\
