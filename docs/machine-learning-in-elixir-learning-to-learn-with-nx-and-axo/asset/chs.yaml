  \ \\[ |\n\n| || \\[ |\n\n| || \\[0.9999999403953552, 0.9999999403953552, ...\\],\
  \ |\n\n| || ... |\n\n| || \\[ |\n\n| || \\[ |\n\n| || \\[ |\n\n| || \\[0.9999999403953552,\
  \ 0.9999999403953552, ...\\], |\n\n| || ... |\n\n| || \\[ \\]\n\n| || \\[ \\]\n\n\
  | || \\[ \\]\n\n| || ... |\n\n| || \\[ \\]\n\n| || ... |\n\n| || \\[ \\]\n\n| ||\
  \ ... |\n\n| || \\[ \\]\n\n| || ... |\n\n| || \\[ \\]\n\n| --- | --- |\n\n| || \\\
  [0\\], |\n\n| || ... |\n\n| || \\[ \\]\n\n| || \\>} |\n\n| || \\[ \\]\n\n| || \\\
  ] |\n\n| || \\]\n\n| || #Nx.Tensor< |\n\n| || s64\\[128\\]\\[1\\] |\n\n| || EXLA.Backend<cuda:0,\
  \ 0.3445614888.3462266912.105719> |\n\n| || \\[ |\n\n| || \\[1\\], |\n\n| || \\\
  [0\\], |\n\n| || \\[0\\], |\n\n| || \\[1\\], |\n\n| || \\[0\\], |\n\n| || \\[0\\\
  ], |\n\n| || ... |\n\n| --- | --- |\n\n| || \\[0\\], |\n\n| || ... |\n\n| || \\\
  [ \\]\n\n| || \\>} |\n\n| || \\[ \\]\n\n| || \\] |\n\n| || \\]\n\nFinally, you’ll\
  \ need to create a test set to test your results on. You can do this by shuffling\
  \ the input paths and then splitting the train set:\n\n| || {test_paths, train_paths}\
  \ = |\n\n| --- | --- |\n\n| || Path.wildcard(*\"train/*.jpg\"*) |\n\n| || |> Enum.shuffle()\
  \ |\n\n| || |> Enum.split(1000) |\n\n| ||  |\n\n| || batch_size = 128 |\n\n| ||\
  \ target_height = 96 |\n\n| || target_width = 96 |\n\n| ||  |\n\n| || train_pipeline\
  \ = CatsAndDogs.pipeline( |\n\n| || train_paths, batch_size, target_height, target_width\
  \ |\n\n| || ) |\n\n| || test_pipeline = CatsAndDogs.pipeline( |\n\n| || test_paths,\
  \ batch_size, target_height, target_width |\n\n| || ) |\n\n| ||  |\n\n| || Enum.take(train_pipeline,\
  \ 1) |\n\nCongratulations, the hardest part is over! You’ve successfully created\
  \ an image input pipeline, and you’re ready to start training a neural network.\n\
  \n### Trying to See with MLPs\n\nIn *Building the Model*, you created the simplest\
  \ kind of neural network to recognize handwritten digits—a multi-layer perceptron\
  \ (MLP) or dense feed-forward network. Your first instinct might be to try to apply\
  \ an MLP to this problem—after all, it’s just another image classification task,\
  \ right?\n\nAs you’ll see in this chapter, MLPs are not always the best choice for\
  \ dealing with image data—but you’ll still train one anyway so that you can establish\
  \ a baseline level of performance.\n\nStart by running the following code to create\
  \ a new MLP model:\n\n| || mlp_model = |\n\n| --- | --- |\n\n| || Axon.input(*\"\
  images\"*, shape: {nil, target_height, target_width, 3}) |\n\n| || |> Axon.flatten()\
  \ |\n\n| || |> Axon.dense(256, activation: :relu) |\n\n| || |> Axon.dense(128, activation:\
  \ :relu) |\n\n| || |> Axon.dense(1, activation: :sigmoid) |\n\n| Forking Cells |\n\
  \n| --- |\n\n| ![images/aside-icons/info.png](img/info.png) || The models you’ll\
  \ create and train in the next few sections are independent. To avoid adding an\
  \ unnecessary dependency between individual training runs, you can tell Livebook\
  \ that these sections only depend on the data section you defined previously. To\
  \ do so, simply create a new Livebook section, and then specify that the section\
  \ is forked from the section that contains your training pipeline. |\n\n| --- |\
  \ --- |\n\nYou’re welcome to add more hidden layers, adjust the hyperparameters\
  \ of the hidden layers, and change the hidden activation. However, don’t change\
  \ the input or output layers.\n\nNotice the input shape in this case is a tensor\
  \ of {nil, target_height, target_width, 3}, where nil is the batch size and 3 is\
  \ the number of color channels. The output layer is a dense layer with one unit\
  \ and a :sigmoid activation function. Determining whether an image is a cat or a\
  \ dog is a binary classification problem, which means you’re trying to map inputs\
  \ to one of two classes. Your output layer will return a single probability between\
  \ 0 and 1, where probabilities closer to 0 map to the label cat and probabilities\
  \ closer to 1 map to the label dog.\n\nYou should also notice the new layer Axon.flatten,\
  \ which takes a two- or more-dimensional input and flattens the trailing dimensions\
  \ into a single dimension. In this case, you want to pass a two-dimensional tensor\
  \ to a dense layer so the flatten layer combines the channel, height, and width\
  \ dimensions into a single dimension.\n\nNow that you have data and a model, you\
  \ need to implement the loop. The training loop for this problem should look similar\
  \ to the one from Chapter 6, *Go Deep with Axon*. Copy the following code to create\
  \ and run a training loop for your MLP model:\n\n| || mlp_trained_model_state =\
  \ |\n\n| --- | --- |\n\n| || mlp_model |\n\n| || |> Axon.Loop.trainer(:binary_cross_entropy,\
  \ :adam) |\n\n| || |> Axon.Loop.metric(:accuracy) |\n\n| || |> Axon.Loop.run(train_pipeline,\
  \ %{}, epochs: 5, compiler: EXLA) |\n\nIf you compare this training loop to the\
  \ one from Chapter 6, *Go Deep with Axon*, you’ll notice two slight differences:\n\
  \n*   This training loop uses :binary_cross_entropy rather than :categorical_cross_entropy.\
  \ Because this is a binary classification problem, :binary_cross_entropy is the\
  \ appropriate loss function to use here.\n\n*   This training loop uses :adam as\
  \ an optimizer rather than :sgd. :adam is a shortcut to tell Axon to use the Adam\
  \ optimizer. Adam is a gradient-descent-based algorithm that makes slight adaptations\
  \ to traditional gradient descent to improve convergence. Adam is an algorithm that\
  \ may improve the training time of your neural network when compared to other optimizers.\n\
  \nThe rest of this loop is identical to the one from Chapter 6, *Go Deep with Axon*.\
  \ You track :accuracy during training, pass your pipeline as input data, and train\
  \ for five epochs—JIT-compiling train steps with the EXLA compiler.\n\nAfter some\
  \ time, you’ll see this:\n\n| || Epoch: 0, Batch: 150, accuracy: 0.5474960 loss:\
  \ 1.0835106 |\n\n| --- | --- |\n\n| || Epoch: 1, Batch: 150, accuracy: 0.5723824\
  \ loss: 0.8659902 |\n\n| || Epoch: 2, Batch: 150, accuracy: 0.6005284 loss: 0.7973230\
  \ |\n\n| || Epoch: 3, Batch: 150, accuracy: 0.6123245 loss: 0.7604570 |\n\n| ||\
  \ Epoch: 4, Batch: 150, accuracy: 0.6156876 loss: 0.7374102 |\n\nAlthough your model\
  \ improved after every epoch, it quickly plateaued at around 60% training accuracy.\
  \ You may not care about training accuracy, but the inability of a model to perform\
  \ well on training data is a tell-tale sign of underfitting, as you learned in *Overfitting,\
  \ Underfitting, and Capacity*. To see how well (or poorly), your model did, run\
  \ the following code:\n\n| || mlp_model |\n\n| --- | --- |\n\n| || |> Axon.Loop.evaluator()\
  \ |\n\n| || |> Axon.Loop.metric(:accuracy) |\n\n| || |> Axon.Loop.run(test_pipeline,\
  \ mlp_trained_model_state, compiler: EXLA) |\n\nEventually, you’ll see this:\n\n\
  | || Batch: 0, accuracy: 0.5333334 |\n\n| --- | --- |\n\nWhat’s going on here? Your\
  \ model is barely doing better than random guessing. You might be tempted to go\
  \ back and increase the capacity of your model by adding more layers or increasing\
  \ the size of the existing hidden layers. You could spend hours on hyperparameter\
  \ tuning, adding more layers and increasing the capacity of your model. While that\
  \ might improve performance, increasing the size of the model isn’t always the answer.\
  \ Sometimes you need to change your approach or (in this case) change your model.\n\
  \n| Scaling Laws |\n\n| --- |\n\n\n\n\n| ![images/aside-icons/info.png](img/info.png)\
  \ || 最近的深度学习进展表明，向模型添加更多容量可能与模型性能有直接的正相关关系。谷歌、OpenAI 和 Facebook 推出的部分大型语言模型拥有数千亿个参数。这是否意味着对任何旧模型进行缩放都会带来更好的性能？不，这意味着对正确的模型进行缩放会带来更好的性能。\
  \ |\n| --- |\n## 介绍卷积神经网络\n\nMLP 能够在许多不同的问题上表现出色，但不总是最佳选择。在前一节中，你了解到基本的 MLP 在识别猫和狗图像时难以战胜随机猜测。在这一节中，你将看到如何通过引入一种新的神经网络类型——卷积神经网络（CNN）来显著超越\
  \ MLP 的表现。\n\n卷积神经网络是将卷积操作替代密集层中的传统矩阵乘法的神经网络。如果你有工程背景，你很可能熟悉卷积操作。虽然神经网络中使用的卷积操作与纯数学家或信号工程师定义的卷积相似，但它在某些方面略有不同。\n\
  \n想象你有一个二维输入，例如一张没有颜色深度的图像。你可以将这张图像表示为一个网格，其中每个网格方格是一个像素：\n\n![images/LearningToSee/InputGrid.png](img/InputGrid.png)\n\
  \n现在，假设你还有一个二维核（更小的网格）：\n\n![images/LearningToSee/KernelGrid.png](img/KernelGrid.png)\n\
  \n你可以将这个核在输入网格的每个有效窗口上滑动，并使用相对简单的加权求和操作将输入映射到特征图。特征图中的一个网格方格等于输入网格和核网格之间重叠部分的加权求和：\n\
  \n![images/LearningToSee/FeatureMapGrid.png](img/FeatureMapGrid.png)\n\n你可以对输入网格的每个有效（完整）窗口重复此过程。为了遍历网格，你会在\
  \ X 方向移动一个网格方格直到到达末端，然后在 Y 方向移动一个网格方格，重复此过程直到遍历完整个图像。你每次移动的步长通常被称为卷积的步幅（stride）。最终，你会得到一个完全转换的特征图。\n\
  \n那么，这么做的意义是什么呢？如果本书的任何内容值得记住，那就是几个看似简单的矩阵操作可以产生神奇的结果。你可以把核看作是一个滤波器。通过一些巧妙的数学，你可以手动设计出能够从输入图像中提取有用表示的滤波器。例如，尝试运行以下代码：\n\
  \n| ​  || path = *\"*train/dog.5.jpg\"* |\n| --- | --- |\n| ​  ||  |\n| ​  || img\
  \ = |\n| ​  || path |\n| ​  || |> StbImage.read_file!() |\n| ​  || |> StbImage.to_nx()\
  \ |\n| ​  || |> Nx.transpose(axes: [:channels, :height, :width]) |\n| ​  || |> Nx.new_axis(0)\
  \ |\n| ​  ||  |\n| ​  || kernel = Nx.tensor([ |\n| ​  || \\[-1, 0, 1\\], |\n| ​ \
  \ || \\[-1, 0, 1\\], |\n| ​  || \\[-1, 0, 1\\] |\n| ​  || \\]) |\n| ​  || kernel\
  \ = kernel |> Nx.reshape({1, 1, 3, 3}) |> Nx.broadcast({3, 3, 3, 3}) |\n| ​  ||\
  \  |\n| ​  || img |\n| ​  || |> Nx.conv(kernel) |\n| ​  || |> Nx.as_type({:u, 8})\
  \ |\n| ​  || |> Nx.squeeze(axes: [0]) |\n| ​  || |> Nx.transpose(axes: [:height,\
  \ :width, :channels]) |\n| ​  || |> Kino.Image.new() |\n\n你会看到以下输出：\n\n![images/LearningToSee/DogEdges.png](img/DogEdges.png)\n\
  \n这段代码使用 `Nx.conv` 实现了一个基本的边缘检测器。在这里，你可以看到边缘可能是模型需要了解的有用特征集合。你可能会花时间手动设计多种特征检测器，但这将违背机器学习过程的初衷。\n\
  \n记住，深度学习的力量在于它能够自动学习有用的表示。在卷积层中，你首先使用随机初始化的核，训练过程中核会逐渐收敛到能够从输入中提取有用特征的参数化。关键的洞察是，你可以学习滤波器，而不是手动工程它们。\n\
  \n用于图像数据的真实卷积核会有四个维度。它包含两个空间维度，直接对应输入图像的 X 和 Y 坐标。它还包含一个深度或输入通道维度，对应输入图像的色深度。此外，它还包含输出滤波器的数量。与学习每个核仅对应一个滤波器不同，学习多个滤波器或多种输入图像的变换更为有用。一个滤波器可以学习提取边缘，另一个可以学习提取角点，以此类推。通常，输出深度被视为卷积层的维度。\n\
  \n卷积层是强大的特征提取器，尤其在具有自然网格结构的数据（如图像）上。卷积层是 CNN 的基础计算单元，但还有其他几个关键组件能够提升 CNN 的表达能力。\n\
  \n### CNN 的解剖结构\n\n从技术上说，卷积神经网络是任何包含一个或多个卷积层的神经网络。然而，大多数 CNN 都有相似的结构。它们由一个或多个包含卷积层、激活函数和池化操作的块或阶段组成。这些块构成了卷积基（convolutional\
  \ base）。卷积基通常随后是一个全连接网络，它接收卷积基中学到的特征并将其映射到输出标签。让我们更仔细地看这三个部分及其作用。\n\n#### 卷积层\n\n\
  你已经了解了卷积操作及其在神经网络中的扩展。一个卷积基中的典型块从卷积层开始，该层执行线性操作并将激活传递给非线性激活函数。\n\n#### 激活函数\n\n\
  与前馈网络一样，在卷积层之后需要应用非线性函数，以释放深度学习的真正潜力。在 CNN 的语境中，激活函数可以被视为[*detectors* [GBC16]](#f_0098.xhtml#d1806e648)——它们在特定特征上“发火”。例如，一个\
  \ CNN 层的激活可能在图像中检测到边缘的存在时显著激活，而另一层的激活可能在特定颜色的存在时激活。\n\n#### 池化层\n\n池化层使用某种聚合操作在空间窗口中聚合输入张量的信息。类似于卷积，池化层会在输入张量上滑动网格，并为每个有效的空间窗口计算输出张量的结果。池化层的超参数与卷积核的大小和遍历方式相同，包括核大小、填充和步幅。不同之处在于，池化层不包含可学习的核。池化层的意图是降低输入张量的维度，同时保留一些有用的信息，供后续层使用。\n\
  \n最大池化（max pooling）和平均池化（average pooling）是 CNN 中最常用的两种池化操作。最大池化将输入张量映射到输出张量，通过在每个空间窗口中计算最大值。平均池化则通过在每个空间窗口中计算平均值来实现映射。\n\
  \n#### 全连接头（Fully-Connected Head）\n\n\n\n\nCNNs 常用作特征提取器。请记住，深度学习的强项在于其学习输入的有用表示的能力。卷积基础在从某些类型的数据（如图像）中提取特征方面表现出色。然而，要利用这些特征解决实际问题，通常需要某种全连接的头部来将特征映射到标签。模型的头部仅是模型的最后一层。大多数\
  \ CNN 包含一个 flatten 或全局池化层，用于将已学习的卷积特征聚合为适合密集网络的形式。如您将在第 8 章中看到，​*Stop Reinventing\
  \ the Wheel*​，特征提取器与全连接分类器之间的区别使您能够工程化神经网络，从而充分利用更强大模型的知识。\n\n### 使用 Axon 实现 CNNs\n\
  \n此时，您可能对卷积、填充和池化等概念感到有些不知所措。如果您尚未完全理解这些概念，这没关系——您不需要深入理解它们才能在 Axon 中使用它们。\n\nAxon\
  \ 中卷积概念的映射对应相对简单的 API。要了解不同 CNN 操作如何与输入交互，请先声明一个变量 `cnn_model`，其包含单个 Axon 输入层：\n\
  \n``` \n| ​  || cnn_model = Axon.input(​*\"*​​*images\"*​, ​*shape:*​ {nil, 96,\
  \ 96, 3}) |\n``` \n\n| --- | --- |\n\n| ​  ||  |\n\n| ​  || Axon.Display.as_graph(cnn_model,\
  \ template) |\n``` \n\n| --- | --- |\n\n| ​  ||  |\n\n| ​  || Axon.Display.as_graph(cnn_model,\
  \ template) |\n``` \n\n运行代码后，您将看到：\n\n![images/LearningToSee/CNNInputGraph.png](img/CNNInputGraph.png)\n\
  \n`Axon.conv/3` 是 Axon 用于向神经网络添加卷积层的 API。该 API 接收输入 Axon 图，输出通道数以及一个选项列表来控制卷积。要观察其运行情况，请重新绑定变量\
  \ `cnn_model` 为以下内容：\n\n``` \n| ​  || cnn_model = |\n``` \n\n| --- | --- |\n\n|\
  \ ​  || cnn_model |\n| ​  || |> Axon.conv(32, |\n| ​  || ​*kernel_size:*​ {3, 3},\
  \ |\n| ​  || ​*padding:*​ ​*:same*​, |\n| ​  || ​*activation:*​ ​*:relu*​ |\n| ​ \
  \ || ) |\n``` \n\n`Axon.conv/3` 的参数直接对应卷积操作如何转换输入张量。第一个参数（在输入图之后）表示该层应学习的输出通道数，这里是\
  \ 32。`:kernel_size` 选项控制核的空间大小。如果您将输入的空间维度视为矩阵，输入张量是 96x96 的矩阵，而核是 3x3 的矩阵。\n\n\
  填充控制在卷积前如何修改输入。在有效或完全卷积中，输出特征图仅在输入张量中有效窗口上产生输出。输出特征图的空间尺寸小于输入。使用 :same 填充可确保卷积的输出尺寸与输入相同。\n\
  \nSame 填充指示卷积在输入张量的空间维度上进行填充，使得空间尺寸保持不变。填充在输入网格周围添加新的网格区域，使输出尺寸与原始输入相同。\n\n现在，显示新模型：\n\
  \n``` \n| ​  || Axon.Display.as_graph(cnn_model, template) |\n``` \n\n| --- | ---\
  \ |\n\n| ​  ||  |\n\n| ​  || Axon.Display.as_graph(cnn_model, template) |\n``` \n\
  \n| --- | --- |\n\n| ​  ||  |\n\n| ​  || Axon.Display.as_graph(cnn_model, template)\
  \ |\n``` \n\n运行后，您将看到：\n\n![images/LearningToSee/CNNSingleLayerGraph.png](img/CNNSingleLayerGraph.png)\n\
  \n您是否注意到模型发生了变化？图现在包含输入、卷积层和激活函数。尺寸如何？请注意，输入张量的通道数（即深度）从 3 变为 32。同时，空间尺寸保持不变。\n\n\
  接下来，重新绑定变量 `cnn_model` 为以下内容：\n\n``` \n| ​  || cnn_model = |\n``` \n\n| --- | ---\
  \ |\n\n| ​  || cnn_model |\n| ​  || |> Axon.max_pool(​*kernel_size:*​ {2, 2}, ​*strides:*​\
  \ \\[2, 2\\]) |\n``` \n\n| --- | --- |\n\n| ​  ||  |\n\n| ​  || Axon.Display.as_graph(cnn_model,\
