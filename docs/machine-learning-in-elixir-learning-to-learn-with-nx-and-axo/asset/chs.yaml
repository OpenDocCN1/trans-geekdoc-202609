  \ result.title %>*​ |\n\n| ​  || ​ *</a>*​ |\n\n| ​  || ​ *</h3>*​ |\n\n| ​  ||\
  \ ​ *<p class=\"mt-1 text-sm text-gray-600 line-clamp-2\">*​ |\n\n| ​  || ​ *<%=\
  \ result.author %>*​ |\n\n| ​  || ​ *</p>*​ |\n\n| ​  || ​ *</div>*​ |\n\n| ​  ||\
  \ ​ *</li>*​ |\n\n| ​  || ​ *<% end %>*​ |\n\n| ​  || ​ *</ul>*​ |\n\n| ​  || ​\
  \ *</div>*​ |\n\n| ​  || ​ *\"\"*​ |\n\n| ​  || ​**end**​ |\n\nsearch_form 是一个相对简单的表单，包含一个输入框和提交按钮。提交时，它会触发\
  \ `search_for_books` 事件。`search_for_books` 事件会将补丁推送到 URL，你可以在 `handle_params` 中处理该补丁以根据输入查询实际搜索书籍。search_results\
  \ 是一个列表，用于渲染 `results` 赋值中每个元素的列表项。如你所想象，`search_for_books` 会更新 `results` 赋值，而 `search_results`\
  \ 会在每次查询后重新渲染新的结果。\n\n现在，实现 LiveView 的事件处理器来处理表单事件：\n\n| ​  || @impl true |\n\n\
  | --- | --- |\n\n| ​  || ​**def**​ handle_event(​*\"*​​*validate_search\"*​, %{​*\"\
  *​​*search\"*​ => \\_query}, socket) ​**do**​ |\n\n| ​  || {​*:noreply*​, socket}\
  \ |\n\n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || ​**def**​ handle_event(​*\"\
  *​​*search_for_books\"*​, %{​*\"*​​*search\"*​ => query}, socket) ​**do**​ |\n\n\
  | ​  || {​*:noreply*​, push_patch(socket, ​*to:*​ ​**~**​p​*\"*​​*/search?q=*​​*#{*​query​*}*​​*\"\
  *​)} |\n\n| ​  || ​**end**​ |\n\n为了简化，`validate_search` 是一个无操作函数。但你可以实现任何验证逻辑。`search_for_books`\
  \ 会将查询参数推送到 URL。\n\n接下来，实现 `handle_params/3`，如下所示：\n\n| ​  || @impl true |\n\n|\
  \ --- | --- |\n\n| ​  || ​**def**​ handle_params(%{​*\"*​​*q\"*​ => query}, \\_uri,\
  \ socket) ​**do**​ |\n\n| ​  || results = Library.search(query) |\n\n| ​  ||  |\n\
  \n| ​  || socket = |\n\n| ​  || |> assign(​*:results*​, results) |\n\n| ​  || |>\
  \ assign(​*:query*​, query) |\n\n| ​  ||  |\n\n| ​  || {​*:noreply*​, socket} |\n\
  \n| ​  || ​**end**​ |\n\n| ​  ||  |\n\n| ​  || ​**def**​ handle_params(\\_params,\
  \ \\_uri, socket) ​**do**​ |\n\n| --- | --- |\n\n| ​  || {​*:noreply*​, assign(socket,\
  \ ​*:query*​, nil)} |\n\n| ​  || ​**end**​ |\n\n`handle_params/3` 会执行搜索并将结果赋值给 `:results`\
  \ 和查询赋值给 `:query`，这两个变量将在 LiveView 中渲染。`handle_params/3` 会分发到 `Library.search`，你仍需实现该函数。为此，打开\
  \ `book_search/library.ex` 并添加以下 `search/1` 方法：\n\n| ​  || @doc ​*\"\"\"*​ |\n\n\
  | --- | --- |\n\n| ​  || ​*Searches for books.*​ |\n\n| ​  || ​*\"\"\"*​ |\n\n|\
  \ ​  || ​**def**​ search(query) ​**do**​ |\n\n| ​  || %{​*embedding:*​ embedding}\
  \ = BookSearch.Model.predict(query) |\n\n| ​  ||  |\n\n| ​  || Book |\n\n| ​  ||\
  \ |> order_by(\\[b\\], l2_distance(b.embedding, ^embedding)) |\n\n| ​  || |> limit(5)\
  \ |\n\n| ​  || |> Repo.all() |\n\n| ​  || ​**end**​ |\n\n该函数利用模型对查询进行嵌入，然后在搜索索引中查找与查询嵌入最接近的五个向量。注意，你可以在\
  \ Ecto 查询中直接使用 pgvector 查询函数，如 `l2_distance`，它会计算查询嵌入与数据库中每个嵌入的距离，并按距离升序排序。距离越小，查询嵌入与书籍嵌入越相似。我们只返回前五本书籍并将其返回给应用前端。\n\
  \n完成后，你可以访问 http://localhost:4000/search 并查找特定书籍。运行搜索后，你会看到以下页面：\n\n![images/PuttingMLIntoPractice/SearchResults.png](img/SearchResults.png)\n\
  \n祝贺！你已成功使用 Phoenix、Bumblebee 和 pgvector 从零开始实现了一个语义搜索应用。\n\n## 结束语\n\n在这一章中，你从头到尾实现了一个语义搜索应用，使用了\
  \ Phoenix、Bumblebee 和 Elixir。你经历了决定在应用中何时以及何时不使用机器学习的过程。你学习了一些在设计机器学习应用时需要提出的重要问题。你使用\
  \ Nx.Serving 将机器学习管道封装为高性能、容错的推理管道。你了解了动态批量对机器学习性能的重要性，并看到 Nx.Serving 如何帮助你实现动态批量。\n\
  \n\n\n\n此外，你使用 `pgvector` 实现了自己的向量索引和搜索功能，从而学习了一些关于向量搜索的知识。\n\n最后，你将所有的机器学习组件集成到普通的\
  \ Phoenix 应用中。正如你可能所见，将机器学习集成到 Phoenix 应用中并不需要特殊的依赖或技巧。你只需将 Elixir 的机器学习库添加到应用中，它就能直接工作。\n\
  \n借助本章，你已经作为 Elixir 机器学习工程师完成了全程。你现在知道如何使用 Elixir 机器学习生态系统中的许多库来解决各种数据模态上的挑战性问题，并且知道如何将模型部署到使用\
  \ Phoenix 的生产应用中。\n\n在下一章中，你将结束你的旅程，并发现在机器学习旅程中可以采取的进一步步骤。\n\n#### Footnotes\n\n\
