- "# \nNx 和 Axon 实践指南：机器学习入门\n\n\n\n\n\n\n### by Sean Moriarity\n\n\n\n\n\n## About\
  \ the Pragmatic Bookshelf\n\nThe Pragmatic Bookshelf 是一家敏捷出版公司。我们存在是因为我们希望改善开发者的生活。我们通过创作及时、实用的书籍来实现这一点，这些书籍由程序员为程序员编写。\n\
