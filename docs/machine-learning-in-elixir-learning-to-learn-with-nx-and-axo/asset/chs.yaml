  \nCopyright © 2024, The Pragmatic Bookshelf. \n\n# Chapter 7  \n\nLearn to See\n\
  \n在上一章中，你使用 Axon 在 Elixir 中创建并训练神经网络，包括一个能够识别手写数字的网络。你还学习了神经网络擅长处理的问题类型，以及它们在许多方面上为何优于浅层机器学习方法。更具体地说，你实现了一种称为多层感知器（MLP）或深度前馈网络的神经网络架构。\n\
  \n虽然 MLPs 能够学习和建模任何种类的数据，但其他深度学习架构在特定问题类型上更为强大。本章中，你将实现一种面向特定领域的卷积神经网络（CNN），并了解它在计算机视觉方面优于传统\
  \ MLPs。\n\n## Identifying Cats and Dogs\n\n想象你运营一个社交媒体网站，用户可以发布和查看动物图片。为了尽可能简化站点，你不希望用户在图片时附加额外信息，例如图片是否为狗或猫。但你希望用户能够根据这些标准过滤自己的信息流。因此，你如何在不要求用户为图片标记特定类别的情况下实现这一点呢？答案是：机器学习。\n\
  \n在本例中，你将训练一个模型对图片进行分类，分为两类：猫或狗。虽然你可以轻松将模型扩展以区分任何种类的动物，但将类别数减少到两个可以降低训练所需的数据量，从而缩短训练时间。\n\
  \n在深入之前，前往 Kaggle^([\\[14\\]](#f_0053.xhtml#FOOTNOTE-14)) 并下载 Cats vs. Dogs 训练数据集。该数据集包含\
  \ 25,000 张图片——12,500 张猫和 12,500 张狗——打包在一个压缩文件中。下载后，将其解压到你选择的工作目录下的 train 目录中。\n\n\
  数据集下载并解压后，你即可启动 Livebook 并开始训练模型。\n\n### Installing Dependencies\n\n首先，你需要在笔记本环境中安装创建图像分类模型所需的依赖。运行以下代码来安装依赖：\n\
  \n| ​  || Mix.install(\\[ |\n\n| --- | --- |\n\n| ​  || {​*:axon*​, ​*\"*​​*~> 0.5\"\
  *​}, |\n\n| ​  || {​*:nx*​, ​*\"*​​*~> 0.5\"*​}, |\n\n| ​  || {​*:exla*​, ​*\"*​​*~>\
  \ 0.5\"*​}, |\n\n| ​  || {​*:stb_image*​, ​*\"*​​*~> 0.6\"*​}, |\n\n| ​  || {​*:kino*​,\
  \ ​*\"*​​*~> 0.8\"*​} |\n\n| ​  || \\]) |\n\n到此为止，你应该已经熟悉列表中的所有依赖。\n\n依赖安装完成后，需要为\
  \ Nx 设置默认后端为 EXLA。运行以下代码配置 EXLA 为默认 Nx 后端：\n\n| ​  || Nx.global_default_backend(EXLA.Backend)\
  \ |\n\n完成配置后，你只需创建一个加载目录中图片的输入流水线即可。\n\n### Building an Input Pipeline\n\n如前面在 *Training\
  \ the Model*​ 中所见，要训练 Axon 模型，你需要为 Axon 创建输入数据流。虽然 Axon 可以遍历任何可枚举结构（如列表），但使用懒数据结构（如流）通常具有显著优势。流是懒惰的可枚举结构，按需生成元素。与\
  \ eagerly 的数据结构（例如列表）相比，流在训练输入管道中更具性能优势，尤其是在使用加速器（如 GPU）时。流相较于列表在训练管道中的优势包括：内存效率和并发执行。\n\
  \n#### Memory Efficiency\n\n神经网络极度依赖数据。实际数据集往往过大，无法全部装入内存。例如，流行的 ImageNet^([\\[15\\\
  ]](#f_0053.xhtml#FOOTNOTE-15)) 数据集超过 150GB。如果使用列表作为训练管道，你需要一次性将 150GB 的数据加载到内存中，这既不实际也不高效。流只在请求时生成结果，因此你可以按批次逐一消费图片，避免一次性加载整个数据集。\n\
  \n#### Overlapping Execution\n\n在使用外部加速器（如 GPU）进行训练时，CPU 常常会因为只负责向 GPU 供给数据而闲置较长时间。此外，GPU\
  \ 运行极快，数据传输往往是最昂贵的操作。因此，建议让训练和数据加载并发，以避免 GPU 等待数据（即输入 pipeline 成为 IO 瓶颈而非计算瓶颈）。GPU\
  \ 等待数据是主要瓶颈，而非实际训练计算。\n\n幸运的是，你可以结合 Elixir 的并发原语与流来创建能够最大化 CPU 与 GPU 利用率的管道。例如，使用\
  \ Elixir 的 Task.async_stream/3 创建一个并行处理输入的流。当执行文件 IO 等操作时，这种并发尤为有用。你可以通过流操作构建预处理管道，Axon\
  \ 会在批次准备好时消费流，实现输入 IO、预处理与计算的重叠，从而最大化可用计算能力。\n\n在本例中，你将创建一个懒加载、并行的输入流。首先，在 CatsAndDogs\
  \ 模块中定义一个名为 pipeline/1 的函<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\n\
  \n\n\n| ​  || ​**def**​ to_tensors({​*:ok*​, {img, label}}, target_height, target_width)\
  \ ​**do**​ |\n| --- | --- |\n| ​  || img_tensor = |\n| ​  || img |\n| ​  || |> StbImage.resize(target_height,\
  \ target_width) |\n| ​  || |> StbImage.to_nx() |\n| --- | --- |\n| ​  || |> Nx.divide(255)\
  \ |\n| ​  || |\n| ​  || label_tensor = Nx.tensor([label]) |\n| ​  || |\n| ​  ||\
  \ {img_tensor, label_tensor} |\n| ​  || ​**end**​ |\n| \n| ​  || ​**def**​ pipeline(paths,\
  \ batch_size, target_height, target_width) ​**do**​ |\n| --- | --- |\n| ​  || paths\
  \ |\n| ​  || |> Enum.shuffle() |\n| ​  || |> Task.async_stream(&parse_image/1) |\n\
  | ​  || |> Stream.filter(fn |\n| ​  || {​*:ok*​, {%StbImage{}, _}} -> true |\n|\
  \ ​  || \\_ -> false |\n| ​  || ​**end**​) |\n| ​  || |> Stream.map(&to_tensors(&1,\
  \ target_height, target_width)) |\n| ​  || |> Stream.chunk_every(batch_size, batch_size,\
  \ :discard) |\n| ​  || |> Stream.map(fn chunks -> |\n| ​  || {img_chunk, label_chunk}\
  \ = Enum.unzip(chunks) |\n| ​  || {Nx.stack(img_chunk), Nx.stack(label_chunk)} |\n\
  | ​  || ​**end**​) |\n| ​  || ​**end**​ |\n| \n| ​  || train_path = Path.wildcard(​*\"\
  *​​*train/\\*.jpg\"*​) |\n| --- | --- |\n| ​  || |> Enum.shuffle() |\n| \n| ​  ||\
  \ train_pipeline = CatsAndDogs.pipeline(\n| ​  || train_path, 5, 96, 96\n| ​  ||\
  \ ) |\n| ​  || \n| ​  || Enum.take(train_pipeline, 5) |\n\n\n\n| || | | | | |\n\n\
  | || batch_size = 128 |\n\n| || target_height = 96 |\n\n| || target_width = 96 |\n\
  \n| || |\n\n| || train_pipeline = CatsAndDogs.pipeline( |\n\n| || train_path, batch_size,\
  \ target_height, target_width |\n\n| || ) |\n\n| || |\n\n| || Enum.take(train_pipeline,\
  \ 1) |\n\nAnd you’ll see this:\n\n| || \\[ |\n\n| --- | --- |\n\n| || {#Nx.Tensor<\
  \ |\n\n| || f32\\[128\\]\\[channels: 3\\]\\[height: 96\\]\\[width: 96\\] |\n\n|\
