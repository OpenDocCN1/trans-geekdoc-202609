  \ |\n| 出发延迟（分钟） | `1.006` |\n\n\n\n\n\n## 总结\n\n回归算法因其实现简单且结果易于解释，被认为是最流行的机器学习算法之一。回归方法允许我们根据多个预测变量来预测目标变量的值。线性回归是一种具有连续目标变量的相关模型，而逻辑回归是一种具有二分类目标变量的分类模型。回归方法的关键特征是线性关系。线性回归方程展示了目标变量与预测变量之间的线性关系。逻辑回归方程则表示目标变量的对数几（logit\
  \ value）与预测变量之间的线性关系。回归分析被广泛应用于经济、金融、医疗保健、航空和社会科学等多个领域，用于进行预测并从数据中获取洞察。\n\n本章涵盖了回归方法的基础知识和概念、方程、估计方法、模型选择方法、假设、模型拟合指标以及输出。我们还学习了如何使用\
  \ SAS Enterprise Miner 对实际数据集执行线性回归和逻辑回归。通过实操示例，详细描述了模型训练、结果展示、模型比较、选择冠军模型以及解释回归方程的全过程。\n\
  \n\n\n回归方法既有优势也有局限性。优点方面，当变量之间的关系定义良好时，它提供了一种简单直接的预测方法。它还具有可解释性，允许用户理解每个预测变量对目标变量的影响。然而，回归假设变量之间存在线性关系，如果违反了这一假设，可能会导致预测不准确。此外，回归方法对离群值和缺失值敏感，这可能会影响模型的拟合效果。总而言之，回归是数据挖掘中用于理解和预测变量间数值关系的一种价值工具，但为了获得可靠的运行结果，仔细评估其假设和局限性至关重要。\n\
  \n## 章节讨论题\n\n1. 定义回归。回归方法的主要特征是什么？\n2. 比较线性回归和逻辑回归。逻辑回归能检测非线性模式吗？请解释。\n3. 提供现实生活中中使用线性回归和逻辑回归的实际案例。\n\
