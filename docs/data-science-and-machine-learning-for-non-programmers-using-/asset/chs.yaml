  \ | 15.68 |  6.32 | 27.22 |  2.60 |  4.88 |\n| `ZonePr` | 0 |  0.00 | 100.00 | 13.30\
  \ |  0.00 | 23.05 |  2.07 |  3.63 |\n| `NiOxSQ` | 0 |  0.39 |   7.31 |  1.10 |  0.54\
  \ |  1.65 |  2.65 |  5.29 |\n| `LogDistance` | 0 |  1.13 |  24.00 |  6.17 |  3.92\
  \ |  6.48 |  2.14 |  3.26 |\n| `IndustPr` | 0 |  0.00 |  27.74 |  9.21 |  6.96 |\
  \  7.17 |  0.59 | −0.79 |\n| `AgePre40` | 0 |  1.14 | 100.00 | 58.74 | 65.20 | 33.10\
  \ | −0.39 | −1.22 |\n| `Tax` | 0 | 20.20 | 711.00 | 339.32  | 307.00 | 180.67  |\
  \  0.37 | −0.07 |\n| `Lstat` | 0 |  1.73 |  34.41 | 11.54 | 10.36 |  6.06 |  0.90\
  \ | 0.65 |\n| `B` | 0 |  0.32 | 396.90 | 332.79 | 390.64 | 125.32 | −1.95 | 2.04\
  \ |\n| `Imv` | 54 |  6.30 | 50.00 | 23.75 | 21.90 | 8.81 | 1.30 | |\n\n如所示，目标变量\
  \ `Imv` 有 54 个缺失值，我们需要对这些缺失值进行插补，因为线性回归需要完整的数据集。我们注意到大多数变量没有正态分布（根据偏度和峰度，这些值在 -0.5\
  \ 到 0.5 之间才被视为正态）。我们将查看直方图进行确认。为了一次性获取所有变量的直方图，我们使用数据的 `Explore` 而不是而不是 `Graph`节点。按照以下步骤操作：\n\
  \n1. 点击 `BOSTON` 数据节点，左侧将显示属性面板。\n2. 在 `Columns` 选项卡下，点击 `Variables` 对应的省略号按钮。\n\
  3. 打开 `Variables` 窗口。\n4. 点击 `Explore`。\n5. SAS Enterprise Miner 将生成所有变量的直方图。\n\n\
  为了方便查看，我重新排列了直方图，如图 7.5 所示。我们可以看到某些变量偏态，包括 `Imv`、`Lstat` 和 `Tax`，而其他变量高度偏态。我们也注意到目标变量\
  \ `Imv` 有一些缺失值，如之前所述，它们需要插补。\n\n为了这些这些变量构建更多图表，请参考第 3 章，该章节介绍了可视化工具。\n\n### 修改\n\
  \n如上述，由于大多数变量呈现非正态分布且目标变量存在缺失值，我们在这一步中执行插补和规范化。\n\n### 插补\n按照以下步骤插补缺失值：\n\n1. 从\
  \ `Modify` 选项卡拖入一个 `Impute` 节点到工作区，并连接到 `Data Partition` 节点。\n   ufig7_13.jpg\n\
  2. 在 `Impute` 节点的 `Train` 属性中，在 `Interval` 选项卡下将 `Default Method` 设置为 `Mean`。\n\
  3. 运行 `Impute` 节点。输出显示训练样本中有 28 个缺失值，它们使用平均值 23.31 进行插补。\n\n### 规范化\n按照以下步骤规范化数据：\n\
  \n1. 从 `Modify` 选项卡拖入一个 `Transform` 节点到工作区，并连接到 `Impute` 节点。\n   ufig7_14.jpg\n\
  2. 在 `Train` 属性中，在 `Default Methods` 下将 `Interval Inputs` 设置为 `Maximum Normal`。提醒一下，`Maximum\
  \ Normal` 使用 `Maximize Normality Power` 转换方法来规范化数据，因为它足够正态。由于我们只有区间变量，所以不需要担心输入。\n\
  3. 运行 `Transform` 节点。\n\n结果显示了转换前后的转换公式、偏度和峰度（表 7.11）。为了比较，我将结果从 SAS Enterprise\
  \ Miner 复制并粘贴到了 Excel 中。可以看到，虽然转换没有完全规范化所有变量，但这些值有所改进。因此，我们下一步步骤中使用转换后的值进行回归分析。注意这里没有显示\
  \ `Tax` 变量，因为它已经分布均匀，表明它不需要规范化。\n\n#### 表 7.11 转换结果与比较\n\n| 变量 | 转换公式 | 转换后 | 转换前\
  \ |\n| --- | --- | --- | --- |\n| 偏度 | 峰度 | 偏度 | 峰度 |\n| `AgePre40` | `exp(max(AgePre40-1.137,\
  \ 0.0)/98.863)` | −0.12902 | −1.36828 | −0.44752 | −1.09681 |\n| `B` | `(max(B-2.52,\
  \ 0.0)/394.38)**4` | −1.56234 | 0.814982 | −2.05444 | 2.454467 |\n| `Charles River`\
  \ | `log(max(Charles_River-0, 0.0) + 1)` | 1.92926 | 1.921266 | 2.005914 | 2.341274\
  \ |\n| `CrimePC` | `log(max(CrimePC-1, 0.0) + 1)` | 1.89155 | 2.26201 | 2.09322\
  \ |\n| `IndustPr` | `sqrt(max(IndustPr-0, 0.0)/27.74)` | −0.39259 | −0.44335 | 0.551\
  \ |\n| `LogAccess` | `log(max(LogAccess-1, 0.0)/665 + 1)` | 2.81911 | 3.02158 |\
  \ 2.82744 |\n| `LogDistance` | `log(max(LogDistance-1.1296, 0.0)/28.87 + 1)` | 2.11648\
  \ | 3.55906 | 2.37711 |\n| `Lstat` | `sqrt(max(Lstat-2.47, 0.0)/28.34)` | 0.01377\
  \ | −0.30221 | 0.38316 | 0.48698 |\n| `NiOxSQ` | `log(max(NiOxSQ-0.385, 0.0)/6.583\
  \ + 1)` | 2.86382 | 3.50711 | 2.93330 | 2.96952 |\n| `PtRatio` | `log(max(PtRatio-7.68,\
  \ 0.0)/389.22 + 1)` | 3.72914 | 4.30244 | 3.80159 | 4.28777 |\n| `RmSQ` | `log(max(RmSQ-3.561,\
  \ 0.0)/96.439 + 1)` | 2.84128 | 3.15151 | 2.85256 | 3.22537 |\n| `ZonePr` | `log(max(ZonePr-0,\
  \ 0.0)/100 + 1)` | 1.78093 | 2.31669 | 2.09190 | 3.67193 |\n\n### 模型\n\n在这一步中，我们构建线性回归模型。按照以下步骤操作：\n\
  \n1. 从 `Model` 选项卡拖入一个 `Regression` 节点到工作区，并连接到 `Transform Variables` 节点（见下文）。\n\
  \   ufig7_15.jpg\n2. 在 `Train` 属性中，进行以下更改：\n   * 在 `Class Targets` 选项卡下，将 `Regression\
  \ Type` 设置为 `Linear Regression`。\n   * 在 `Model Selection` 选项卡下，将 `Selection Model`\
  \ 设置为 `Stepwise`。\n   * 将 `Selection Criterion` 设置为 `Default`。\n3. 运行 `Regression`\
  \ 节点并打开结果窗口。\n\n### 评估\n\n\n\n\n在最后一步中，我们评估回归模型的性能。SAS Enterprise Miner 提供了许多输出。正如第\
  \ 6 章所讨论的，我们关注模型性能的两个主要输出：(1) 模型拟合度；(2) 显著预测变量。如图 7.6 所示，逐步过程识别了七个步骤。最后，有七个预测变量进入模型，它们都是显著的预测变量（它们与目标变量具有显著相关性）。图\
  \ 7.7 展示了逐步步骤的迭代过程以及相应的 `RMSE`。我们可以看到，随着预测变量的增加，`RMSE` 会减小。对于训练集，步骤 7 的 `RMSE` 最；对于验证集，步骤\
  \ 6 的 `RMSE`最低。但逐步建模是由训练样本决定的。训练和验证集之间的结果并不相同，但足够接近。\n\n![图 7.6 逐步选择摘要。](img/fig7_6.jpg)\n\
