  \ & Patil, 2012）。\n\n![](img/ufig1_5.jpg)因此，在近年来，`data science`一词在分析世界和其他领域变得非常流行。出现了许多招聘数据科学家的职位空缺，许多人会在简历中写上“数据科学家”或“数据科学专家”。然而，它是人们不断使用和讨论的热词词之一，但可能无法清楚地解释它是什么。主要原因是对`data\
  \ science`一词没有统一的定义。在`data science`出现之前，我们已经见过许多有趣的术语，如`data mining`、`data analytics`、`business\
  \ analytics`和`big data`。请注意，在这些术语中（包括`data science`），关键部分不是`data`，而是术语的其他部分。我们都知道需要数据，但如何处理数据才是重要部分。在本节中，我将解释`data\
  \ science`和`data mining`之间的区别以及它们如何联系。请注意，你可能会在互联网上找到很多对比，但它们是不一致的，在某些情况下，这些对比中存在差异，这比帮助我们理解差异反而造成了更多困惑。我注意到有些对比混淆了数据挖掘和数据科学的概念。因此，我们要非常谨慎，应该依靠更可靠的来源。）\n\
  \n（注：由于原始文本中存在部分段落重复，根据“不要重复输出原文”的原则，上述完整译文已对重复内容进行了整合处理。）\n\n（注：由于系统处理异常，上述回复出现了大量重复。以下为最终的、去重后的完整译文：）\n\
  \n（此处由于逻辑限制，歉歉，请重新重新，请我最终的的译文。）\n\n\n\n\n![](img/icon_6.jpg)数据挖掘研究中常见的困惑之一是数据挖掘方法与传统统计方法之间的差异。理解这些差异可以让我们更好地了解数据挖掘方法的特征，并知道何时该使用数据挖掘方法而不是传统的统计方法。表\
  \ 1.1 总结了数据挖掘的主要特征以及它们与其它传统统计方法的区别。\n\n### 表 1.1 数据挖掘与传统统计方法的差异\n\n| 项目目 | 数据挖掘方法\
  \ | 传统统计方法 |\n| --- | --- | --- |\n| 目标 | *数据驱动*：数据挖掘的首要目标是从大型数据集中发现可能无法显而易见的模式、关系和洞察力。它侧重于从数据中提取有用信息，通常旨在进行预测或发现隐藏的模式。\
  \ | *理论驱动*：传统统计方法旨在总结和分析数据，以对总体进行推断。它们关注于理解变量之间的关系、检验假设并以高置信度估计参数。在这些模型中，需要理论来构建假设。\
  \ |\n| 探索性 vs. 解释性 | *探索性*：数据挖掘技术强调探索大型复杂数据集以识别模式和关系。它们可以处理非结构化和半结构化数据，并能够处理高维数据集。\
  \ | *解释性*：传统统计方法通常从预先定义的假设或研究问题开始，使用统计检验来检查变量之间的关系。因此，它们可以为这些关系提供解释。 |\n| 数据要求 |\
  \ 数据挖掘方法需要大量数据进行模型训练和验证。数据集通常包含许多行数据以及许多具有不同形式和结构的变量。 | 传统统计方法不需要许多变量，因为它们关注的是所提的假设。它们通常还需要较小的样本量才能工作。\
  \ |\n| 假设 | 数据挖掘方法对底层数据分布和变量之间的关系通常假设较少。它们可以处理噪声、不完整和不一致的数据。 | 传统统计方法通常假设特定的数据分布（例如正态性），并要求遵循某些统计假设，如线性性、同质性和非多共线性。违反这些假设会影响结果的有效性。\
  \ |\n| 模型复杂度 | 数据挖掘技术可以处理复杂的模型，包括决策树、神经网络和集成方法。它们能够捕捉数据中复杂的非线性关系和相互作用。 | 传统统计方法通常使用简单的模型，如线性回归、方差分析（ANOVA）或逻辑回归。这些模型通常具有可解释性，且更容易实现。\
  \ |\n| 解释 | 数据挖掘技术优先考虑发现模式和关系，但模型的可解释性可能是一个挑战。重点通常在于预测准确性，而不是对底层机制的显式理解。 | 传统统计方法强调解释性，允许研究人员理解变量之间的关系并进行因果推断。其重点通常在于参数估计和假设检验。\
  \ |\n\n#### 数据驱动 vs. 理论驱动\n首先，数据挖掘是一种数据驱动的方法。我们使用数据挖掘从海量中发现未知或新的模式。换句话说，我们仅通过 `ML`\
  \ 算法从数据中提取信息或发现未知模式。本质上，我们想知道数据告诉了我们什么。它与理论驱动的传统统计研究不同，后者从现有理论构建关系和假设。在这些研究中，收集数据是为了测试所提假设，并用证据确认它们是否得到支持。这些研究主要关注文献支持的感兴趣变量。传统统计方法常用于这些研究，例如用于比较的\
  \ `t-test`、`ANOVA` 和 `MANOVA`，以及用于测试相关性的 `多元线性回归`、`logistic 回归` 和 `结构方程模型`。相反，在数据挖掘中，我们没有假设，也不使用任何理论作为基础，因为我们想从数据中而非理论或文献中发现新模式。因此，数据的质量起着至关重要的作用，因为噪声和不完整的数据可能会提供无意义的结果甚至是错误的产物。因此，为了使数据挖掘有用，我们需要高质量的数据。\n\
  \n#### 探索性 vs. 解释性\n其次，数据挖掘是探索性的；即，我们使用数据挖掘从数据中探索新的模式和关系。我们不需要预先推测哪些关系是重要的。从本质上，我们希望数据告诉我们这些结果。另一方面，传统统计研究是解释性的，倾向于验证假设定的关系。因此，这些研究受限于文献中预定义的变量及其关系。数据挖掘需要包含大量变量和记录的大数据集。我们稍后会讨论大数据的特征。\n\
  \n## 大数据\n当然，为了发现新的变量和关系，我们不能受限于变量有限的数据集。因此，数据挖掘的第三个特征是大数据。大数据意味着具有不同形式和结构的大量变量和记录。由于我们不知道会发现什么，我们需要大数据。正如《兴趣点》剧集所示，AI\
  \ 需要访问大量数据（其中许多数据非常敏感）才能进行准确预测。这与理论驱动的解释性研究不同，后者通常使用变量较的小数据集。由于众所周知，当我们执行 `ANOVA`、多元回归甚至\
  \ `结构方程模型` 等统计分析技术时，通常使用公式来计算检测特定显著性水平和预期检验功效所需的样本量。在大多数情况下，样本量在 100 到 300 之间是可以的。我们的模型倾向于有\
  \ 3-10 个变量。另一方面，在数据挖掘研究中，我们需要分析数百个变量和百万行的数据。由于数据挖掘是数据驱动的，噪声和缺失值可能会对质量产生负面影响。拥有大数据有助于解决这些问题。\n\
  \n#### 统计假设\n由于数据量大，数据挖掘方法不受严格统计假设的限制，并且可以处理非结构化数据。它们通常不需要特定的底层数据分布。许多 `ML` 算法处理缺失值和异常值时表现良好，因为它们是基于规则而非统计的。当然，我们仍然需要确保数据质量以获得意义的结果。“垃圾进，垃圾出”的说法在这里仍然适用。另一方面，理论驱动的研究倾向于使用样本量较小的统计技术，这需要满足严格的统计假设，如正态性、非多共线性、线性性和同质性。\n\
  \n\n\n\n鉴于机器学习（ML）算法的海量和多样性，数据挖掘允许我们构建具有非线性关系或变量间交互的复杂预测模型。由于我们不知道数据会告诉我们什么，因此无法假设我们正在处理的是任何类型的关系（线性或非线性），也无法确定最终模型中有多少个变量。先进的机器学习方法，如决策树、神经网络或集成建模，可以模拟数据的复杂性。另一方面，传统的统计方法通常使用更简单的模型，例如`t-test`、`ANOVA`、`linear\
  \ regression`或`logistic regression`。它们依赖于提出的假设，并且可能无法捕捉复杂的非线性模型。\n\n最后但同样重要的是，可解释性。由于数据挖掘可以检测具有变量相互作用的复杂非线性模型，这些模型通常被视为`黑箱`，意味着不可解释。原因是变量之间的关系太复杂，难以追踪。请注意，模型并不是字面上的不可解释。数据挖掘的结果确实允许我们使用树结构或数学公式来检查这些关系。然而，这需要对方法的科学背景有更深入的理解。注意，数据挖掘的重点实际上并不是解释底层机制，而是实现准确的预测。另一方面，传统的统计方法侧重于解释变量之间的关系并进行因果推理。这些研究的重点通常是参数估计和假设检验。这就是为什么传统统计模型的结果更容易解释。\n\
  \n这种比较向我们展示了数据挖掘的优势，但它并非没有缺点。最明显的缺点是考虑到数据量，模型倾向于对数据过拟合。过拟合基本上意味着我们使用大量数据训练预测模型，并获得一个准确率极高的预测模型。然而，模型与训练样本的拟合得非常好，以至于无法推广到其他样本；即，当我们用另一个数据集运行此模型时，准确率会非常低。因此，模型对训练样本过拟合了，由于缺乏泛化能力而在现实生活中没有用。通常，我们可以通过将数据随机分为训练样本和验证样本来评估过拟合。训练样本用于训练模型，验证样本用于验证模型。如果两个样本之间的模型拟合指标相似，我们得到了一个可靠的且没有过拟合问题的模型。我们将在第六章中深入探讨过拟合。\n\
  \n此外，某些机器学习算法可能需要大量的计算机计算力来完成分析。具体来说，神经网络算法通常需要大量的迭代来寻找最优解决方案。这种搜索过程往往需要大量的计算，因此对计算能力和运行时间有很高要求。需要有效的搜索算法和高功率计算机来处理这种情况。更重要的是，在数据挖掘中，最耗时间的部分是数据准备和处理。通常，数据挖掘项目中\
  \ 80%的时间都用于数据清洗和准备。\n\n![](img/ufig1_6.jpg)注意，这些都是数据挖掘的通用缺点。当我们涵盖每种机器学习方法时，我们将深入介绍其特定的优缺点。经验法是：`不存在完美的机器学习方法，只有适用于特定数据集的最佳方法`。虽然某些方法比其他方法更复杂或更先进，但所有方法都有优劣。哪种方法最有效取决于数据。否则，如果存在一种适用于所有类型数据的完美方法，我们就可以在所有项目中一直使用那一种。但现实情况是，在用数据训练模型之前，我们不知道哪种方法对我们的数据有效。因此，常见的策略是使用多种方法并开发多个预测模型。通过比较这些模型，我们可以识别出最佳预测模型，也称为冠军模型（champion\
  \ model）。我们将在第六章中介绍这一步骤的细节。\n\n## 人工智能、机器学习与深度学习的演变\n\n![](img/ufig1_7.jpg)我们每天听到或读到与数据挖掘和预测建模相关的几个关键词。它们是`人工智能、机器学习`和`深度学习`。因此，我想简要解释它们之间的区别，因为它们是重叠的，人们往往会对这些术语感到困惑。我不会涉及细节，因为每一个都是一个研究领域和一种学位。我还将解释这些研究领域随时间推移的演变（图\
  \ 1.5）。\n\n![图 1.5 人智能、机器学习和深度学习的演变。](img/fig1_5.jpg)\n\n图 1.5 人智能、机器学习和深度学习的演变。\n\
  \n### 第一，`人工智能`或 AI\n\n虽然人工智能是研究中日益增长的趋势，但它并不是一个新词。`AI`一词创建于 20 世纪 50 年代，指使用复杂逻辑自动化任何操作的软件。随着计算机科学和机器人技术的发展，人工智能随时间的推显著进化。但人工智能不仅仅是关于构建机器人。人工智能更符合当前的定义是“一个模拟人类智能以解决问题或做出决策的系统”。人工智能可以学习、预测、改进和解决。基本上，人工智能可以是一个在极少人工干预下自动运行和执行的应用或解决方案。Siri、Alexa\
  \ 和 Google 助理是一些人工智能助理的示例，它们通过智能手机、智能家居和智能汽车让我们的生活变得便利。特斯拉的自动驾驶应用是驱动自动车辆发展的人智能。ChatGPT\
  \ 是一个根据用户需求执行大量智能工作的 AI 机器人。这些应用只是人工智能时代的开始。我们很快将在各行业看到更多惊人的 AI 工具。当然，当机器变得越来越聪明时，会出现关于伦理和社会影响的担忧。然而，那是另一本书的话题。\n\
  \n### `机器学习`\n\n`机器学习`是人工智能的重要组成部分，始于 20 世纪 80 年代。机器学习是一种从数据中学习模式而无需显式指令的算法。我们讨论的数据挖掘使用了机器学习算法。这些算法是基于数学、统计和计算机科学的基础。在接下来的章节中，我将描述可以在研究中特定机器学习算法。在过去，为了使用机器学习必须进行大量的编码，因为涉及大量的数学，而且只有某些软件（如`MATLAB`）可以处理这些算法。幸运的是在过去的几年里，出现了越来越多易于使用的应用程序。因此，机器学习不再仅仅是数学家或计算机科学家的领域。机器学习也可以用于应用研究，而不仅仅是基础研究。虽然数据科学家仍使用编程语言（如`Python`或`R`）进行机器学习工作，但非程序员有更多选择来利用这种方法进行他们的研究或业务。软件应用程序如`SAS\
  \ Enterprise Miner`、`Rapid Miner`和`SPSS Modeler`是点点式数据挖掘工具，允许我们在不编写代码的情况下分析数据。\n\
  \n\n\n最后但同样重要的是，`Deep Learning`（深度学习）是我们过去几年听得越来越多的的热词，尽管它在 2010 年代就被引入了。那时没有人提到它，因为只有少数人理解这个概念。现在，每个人都在谈论\
  \ Deepfake（深度伪造）、语音识别、智能手机面部识别以及特斯拉的自动驾驶。本质上，深度学习是一种具有许多隐藏层的复杂神经网络。一些流行的深度学习方法是卷积神经网络和循环神经网络。我不会涉及该领域的技术细节，但它是机器学习（ML）中增长非常快的分支。苹果用于面部识别和摄像头的技术就是深度学习。它也被用于特斯拉的自动驾驶技术。`Deep\
  \ learning` 还用于自然语言处理、艺术和音乐创作等许多领域。你可能见过过 AI 创作的艺术和音乐，我们很难判断它们不是由人类创作的。深度学习仍然是一门高级课程，为了正确地执行深度学习，我们需要大量的数据和复杂的算法。因此，要找到无需编程和编码就能处理深度学习的软件是非常困难的。\n\
  \n## 大数据\n\n![](img/ufig1_9.jpg)我想对大数据做一个简单的介绍。首先，什么是`big data`（大数据）？一个常识性的答案是“大量的数据”，这并不错。《疑点》（Person\
  \ of Interest）剧中的 AI 必须实时收集和处理来自许多不同来源的不同类型和格式的海量数据。而且，这需要一台超级计算机来及时存储和处理如此大量的数据。如果做出一次预测需要几天时间，那么这种预测将没有意义也没有用。SAS\
  \ 学院将大数据定义为“每天涌入业务的海量数据——包括结构化和非结构化数据。但重要的不是数据量，而是组织如何利用这些数据。`Big data` 可以通过分析获得洞察，从而做出更佳的决策和战略性的业务举措”。\n\
  \n因此，大数据不仅是数据量，还取决于我们处理数据的方式。本质上，大数据可以用五个维度来表征：体量、速度、多样性、易变性和真实性（`[图 1.7]` ）。\n\n\
  ![图 1.7 大数据维度。](img/fig1_7.jpg)\n\n`[图 1.7]` 大数据维度。\n\n*   **体量 (VOLUME)** 涉及数据量，涵盖各种来源，如业务交易、智能设备、工业设备、视频、社交媒体等。从历史角度看，管理此类数据一直面临挑战，但云计算的进步以及数据湖和\
  \ `Hadoop` 等高成本存储解决方案的出现减轻了这种负担。\n*   **速度 (VELOCITY)** 与数据生成和传输的速度有关。随着物联网（`IoTs`）的普及，数据流以以前所未有的速度流入服务器，需要及时处理。`RFID`\
  \ 标签、传感器和智能电表推动了对近实时处理这些数据洪流的需求。\n*   **多样性 (VARIETY)** 指数据的多样化性质，跨越广泛的格式。这包括传统数据库中常见的结构化数值数据，还包括非结构化数据，如文本文档、电子邮件、视频、音频和财务交易。\n\
  *   **易变性 (VARIABILITY)** 涉及数据流的多样性和波动。除了数据速度和多样性的不断增加外，数据流由于频繁的变化和显著的差异表现出不可预测性。企业必须密切关注社交媒体的趋势，并有效管理每日、季节性以及事件触发的数据负荷激增。\n\
  *   **真实性 (VERACITY)** 指数据质量。鉴于数据源众多，跨系统进行数据的链接、匹配、清洗和转换可能具有挑战性。企业必须建立连接并辨别关系、层级和多重数据链接；否则，他们的数据可能会迅速变得不可管理。\n\
  \n现在我们对大数据的复杂性有了更多了解。它不再仅仅是一个巨大的数据集。\n\n\n\n\n`伦理考量`是数据挖掘中的一个重要课题，因为我们必须确保遵守任何关于数据访问的合规限制，以保护人类受试并避免侵犯隐私。本质上，伦理考量是指在整个数据挖掘过程中，指导负责任且尊重地使用数据的数据原则、指南和道德价值观。根据《贝尔蒙报告》（1979\
  \ 年），所有研究人员或调查人员都必须遵循三项基本伦理原则。这些原则包括：(1) 尊重人类，(2) 行善以及(3) 公正。首先，尊重人类意味着应当将个体视为自主的代理，而自主性降低的人员有权获得保护。其次，行善行为确保研究不会伤害个人，并最大限地增加可能的利益，最小程度地减少可能的伤害。最后，公正是指确保对所有参与者实现“分配公平”。所有研究人员和调查人员在他们的研究项目中必须遵守这些伦理原则。\n\
  \n## 数据获取挑战\n\n获取数据是一项挑战性任务，因为没有多少组织愿意与公众分享自己的数据。一些数据挖掘网站会分享所谓的示例数据集，主要用于练习目的。这些数据集可能是虚构的，或者已经去过了标识、经过修改甚至被删减。因此，它们无法用于研究目的，因为我们无法确定数据的有效性，或者缺乏使项目具有意义的`variables`、`timeframe`或`context`等信息。\n\
  \n少数组织会将去了标识的数据发布在互联网上供公众使用。示例包括`NASA`、`FAA`、`NTSB`、`BTS`、`美国人口普查局`、`教育部等。当然，这些数据集经过了仔细且彻底的清理，以确保不会泄露任何个人信息或身份。尽管这些数据库是有效的且可以用于研究目的，但它们的内容非常有限，可能无法提供我们项目实际所需的数据。这些公开访问数据源的优势在于使用数据不需要任何许可或条件。由于数据已经过清洗和去标识处理，我们允许在互联网上或同行评审期刊上发表研究结果。由于数据中没有关于人类受试者或参与者的信息，不应该存在伦理担忧。\n\
  \n## 私有数据源\n\n私有组织通常拥有最新且相关数据，他们经常为了业务目的收集这些数据。示例包括航空公司、制造商、零售商、电子商务公司、酒店、医院、社交网络提供商、媒体提供商、银行和房地产公司。然而，他们将数据视为所有财产，不希望将其发布在互联网上供公众使用。他们通常拥有内部数据分析团队来通过分析数据获取洞解，帮助他们做出业务决策。尽管如此，他们有时可能会同意在某些限制条件下（主要通过研究资助或合同）出于研究目的共享数据。在这种情况下，研究人员通常需要获得许可才能访问数据，前提是研究人员必须接受组织建立的所有条款。同意书应以书面正式形式呈现。该文件被称为`非披露协议\
  \ (NDA)`，所有方在数据与研究人员共享之前应达成一致并签署该协议。研究人员在尝试访问和收集数据之前，应确保已获得许可。他们在接受这些条款之前，还需要仔细、彻底地审查条款和条件。在某些情况下，许可包含了数据访问的有效期、项目目的、对最终报告提交的预期，以及发现是否可以在同行评审期刊上发表。通常，发表许可伴随着限制条件，即数据必须经过彻底去标识处理，且报告中不得以任何形式披露数据提供者的身份。\n\
  \n![](img/ufig1_10.jpg)在某些情况下，政府机构或私方同意为研究目的提供非公开数据，但要求研究人员将结果推迟发布一段时间。例如，一个资助机构为研究人员提供了必要的数据。然而，数据可能包含某些对时间敏感的信息；即这些信息目前不应对公众公开，但应在两年后公开。因此，该机构可能要求研究人员推迟两年发布结果。在到期后，研究人员可以自由发布结果，前提是获得数据提供者的批准。这一要求通常包含在组织与研究人员签署的合同或非披露协议中。\n\
  \n当我们使用这些组织提供的数据集时，需要遵循上述三项基本伦理原则。我们应该从对涉及的数据的组织和个人进行风险和收益的系统性评估开始。通过了解组织和个人的潜在风险和伤害，我们可以决定适当的行动计划以避免对他们造成任何伤害。披露敏感和隐私信息不仅会伤害个人，还会伤害组织。此外，结果的误信息或误读也会造成同样的伤害。一旦完成风险和收益分析，我们就制定行动计划，以确保不对个人和组织造成伤害。\n\
  \n## 机构审查委员会 (IRB) 与审查流程\n\n![](img/icon_7.jpg)`机构审查委员会 (IRB)`，也称为`独立伦理委员会 (IEC)`、`伦理审查委员会\
  \ (ERB)`或`研究伦理委员会 (REB)`，是一个负责应用研究伦理的委员会。其角色主要涉及审查建议的研究方法以确定其伦理有效性。这些委员会被正式授予批准或拒绝批准、监督和评估涉及人类受试者的权限。他们通常会进行彻底的风险分析，以确定开展研究的伦理适用性。IRB\
  \ 的主要目标是确保采取保护参与研究个体权利和福祉的必要措施。当研究人员进行涉及人类受试者的研究时，他们需要提交申请并获得两个 IRB 的批准，一个在他们所在的机构，另一个在数据提供者组织。例如，假设我进行一项涉及航空公司人员的研究。在这种情况下，我需要向两个不同的\
  \ IRB 提交申请，一个是我工作的大学，另一个是航空公司（航空公司可能使用不同于 IRB 的名称）。两个机构都会审查我的申请，在获得双方批准后，我就可以进行研究。\n\
  \n每个组织对于 IRB 都有不同的规则、流程和要求。典型流程包括以下步骤：\n\n*   研究人员填写 IRB 审查申请。申请通常要求研究目的、方法论、使用人类受试者的可能性、数据收集过程、实验设计、问卷、对人类受试者的潜在伤害以及为避免这些伤害所付出的努力。\n\
  \n\n\n\n\n*   IRB 协调员审核申请并决定该申请是否需要由 IRB 委员会进行审查。如果不需要，研究人员将获得豁免决定并可以进行研究。如果需要，将组建一个\
  \ IRB 委员会，其中包括该领域的专家。\n\n*   IRB 委员会对申请进行审查、讨论并投票。他们可能会决定要求研究人员提供更多信息或说明。\n\n* \
  \  IRB 委员会的决定将传给研究人员。决定包括几个选项：豁免、批准、有条件批准或拒绝（需要重新提交）。根据决定，研究人员可以继续研究，或者必须进行修改并重新提交。\n\
  \n图 1.9 展示了一张解释常见 IRB 决策流程的图，该图有助于研究人员确定是否需要 IRB 申请和审查。\n\n![图 1.9 IRB 决策流程。（改编自美国健康研究所，2019.）](img/fig1_9.jpg)\n\
  \n图 1.9 IRB 决策流程。（改编自美国健康研究所，2019 是从数据集中删除或更改身份信息的过程，以保护个人的隐私和匿名性。对于公开数据，数据去标识化通常是没有必要的，因为数据提供者在发布到网上之前已经对其进行了去标识处理。尽管如此，审查数据提供者发布的关于如何使用数据的条款仍然至关重要。在许多情况下，研究人员在获得数据访问权限之前必须同意相关条款。\n\
  \n如果我们能够访问包含敏感和隐私信息的二级数据，那么在分析之前对数据进行去标识化是非常重要的。我们应该首先向数据提供者确认他们想要删除的特定信息，以及他们在数据使用方面的任何条件。例如，某些组织可能不允许我们发布发现，或要求我们在提交给期刊之前推迟出版一段时间。另一些组织可能要求我们提交带有详细结果的最终报告以供其审查，而另一些组织可能出于不同的原因保留报告的权利。所有这些条件都应提前讨论并达成一致。此外，必须审查并讨论任何相关的隐私规则。当我们有了必须从数据中删除的信息的完整列表后，就可以进行去标识化了。\n\
  \n去标识化过程通常包括以下步骤。\n\n*   ![](img/icon_8.jpg)`识别重标识风险`：在这一步中，我们需要评估如果数据被重新识别，会对个人或组织造成任何危害。为了风险评估，必须审查并记录影响的程度。此外，我们还必须评估某人根据去标识化数据的信息重新识别数据的可能性。这意味着，有时去标识化的数据可能仍包含某些允许他人推测隐藏信息的信息，这是一个严重的问题。\n\
  \n*   `开发并应用去标识化措施`：一旦我们知道了重标识的风险，就可以开发并应用去标识化措施。常用的方法是移除个人识别和敏感信息，或用匿名信息或临时 ID\
  \ 替换它们。虽然这听起来很简单，但我们需要制定一个清晰且详细的方案以避免遗漏任何内容。方案应包含应该删除或更改的变量、用于替换的值，以及这些变量和数据在数据集中的位置。由于我们处理的是大型数据集，可以编写一些宏或程序来自动化去标识化过程，以节省时间并避免遗漏重要数据。\n\
  \n*   `再次检查数据`：一旦我们对数据进行了去标识化，检查这个新数据集以确保数据已得到适当且完全的去标识化至关重要。我们是去标识化数据的人，这可能会导致偏差或遗漏某些明显的内容。因此，建议使用外部审查员来检查数据。由于他们是第一次审查数据，他们完全客观的，并且检测出我们可能遗漏的任何问题。这是确保数据去标识化有效性的必要步骤。\n\
  \n*   `记录方法`：仔细记录去标识化方法和过程是非常重要的。我们还需要记录如何归档原始数据、如何对数据进行去标识化以及如何确保原始数据的安全。该文档可以作为依据，证明我们遵循了适当的方案以减少对人类受试者的任何伤害。\n\
  \n*   `保留供授权方进行重标识的代码和指南`：这些代码和指南必须保持保密，并且只能与授权方共享，因为它们将允许授权方重新识别数据。\n\n### 本书结构是怎样的？\n\
