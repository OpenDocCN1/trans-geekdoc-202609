  \ || 0.823 |\n| 基尼系数 || 0.66 || |\n\n\n\n\n\n我们对这两个模型进行了比较。通过 `Model Comparison`\
  \ 节点的 `Results`，我们能够提取出均方误差 `(MSE)` 和均方根误差 `(RMSE)`，并使用这两个指标进行模型比较。表 8.7 显示了这些验证样本的模型拟合度指标。如你所见，`CART`\
  \ 树的 `MSE` 和 `RMSE` 均低于 `CHAID` 树。这意味着 `CART` 树可以产生更准确的预测。为了进一步证实这一发现，我们计算了额外的模型拟合指标，包括\
  \ `MAPE`、`RSE` 和 `EP`（关于这些指标的更多细节请参见第 6 章）。\n\nTable 8.7 模型拟合度对比\n\n| 模型拟合度指标 ||\
  \ CART 树 | CHAID 树 |\n| --- | --- | --- |\n| 平均平方误差 || 21.23 || 23.81 |\n| --- |\
  \ --- | --- |\n| 均方根误差 || 4.608 || 4.879 |\n\n正如第 7 章中提到的，`SAS Enterprise Miner`\
  \ 并不产生这些指标，我们需要使用预测数据进行计算。为了实现这一点，我们使用 `Save Data` 节点将预测数据导出到 Excel 文件。\n\n按照以下步骤操作：\n\
  \n1. 从 `Utility` 选项卡中，拖入 `Save Data` 节点到工作区，并将其连接到 `CART` 树。\n2. 拖入另一个 `Save Data`\
  \ 节点到工作区，并将其连接到 `CHAID` 树。\n3. 在 `Train` 属性的 `Output Format` 下，进行以下更改：\n    * 将\
  \ `File Format` 设置为 `Excel Spreadsheet`。\n    * 在 `Directory` 中输入文件夹路径。所有文件将保存到所选文件夹中。\n\
