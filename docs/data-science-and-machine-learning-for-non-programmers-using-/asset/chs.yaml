  \ || 0.002 |\n| shopping\\_amount\\_at\\_airport || 0.001 || 0.738 |\n| departure\\\
  _delay\\_in\\_minutes || 0.000 || −0.044 |\n| eating\\_and\\_drinking\\_at\\_airport\
  \ || 0.000 || 0.671 |\n| arrival\\_delay\\_in\\_minutes || 0.000 || −0.044 |\n|\
  \ age || 0.000 || 0.019 |\n| percent\\_of\\_flight\\_with\\_other\\_air || 0.000\
  \ || 0.000 |\n| number\\_of\\_years\\_flying || 0.000 || 0.001 |\n| no\\_of\\_flights\\\
  _per\\_year || 0.000 || −0.033 |\n| REP\\_price\\_sensitivity || 0.000 || −0.001\
  \ |\n| no\\_of\\_other\\_loyalty\\_cards || 0.000 || 0.000 |\n\n### 降维\n\n那么，这两个主成分对数据维度削减意味着什么？基本上，这些结果告诉我们`flight\
  \ distance` 和 `flight time` 可以合并为一个新变量（`PC1`），而 `shopping amount at the airport`\
  \ 和 `eating and drinking spending at the airport` 可以合并另一个变量（`PC2`）。因此，`PC1` 和 `PC2`\
  \ 取替了这四个原始变量作为建模步骤中的新预测变量。其他输入变量仍作为潜在预测变量使用。低系数并不意味着我们应该删除它们，而是意味着这些变量是排他的，它们无法被还原为主成分。表\
  \ 12.4 显示了我们用于预测建模的输入变量。`PC1` 和 `PC2` 是 PCA 结果产生的新变量。我们将 `PC1` 命名为 `flight duration`（飞行时长），因为它捕捉了飞行时间和距离；并将\
  \ `PC2` 命名为 `spending at airport`（机场支出），因为它捕捉了在机场购买食物、饮料和购物的金额。如你所见，最初我们使用了 19 个输入变量进行预测建模。通过使用\
  \ PCA 合某些变量，我们可以将预测变量的数量减少到 17 个。在这种情况下，这种小幅的降维只是一个例子。如果我们拥有具有许多相关变量的大型数据集，我们能够进一步减少数据维度。\n\
