- "# 非程序员人员的数据科学与机器学习：SAS Enterprise Miner 使用指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n关于本系列的更多信息，请访问：[`www.routledge.com/Chapman-Hall-Mining-and-Discovery-Series`](https://www.routledge.com/Chapman-Hall-Mining-and-Discovery-Series)\n\
  \n\n\n\n\n\n\n# 献言\n\n献给我爱的父母 Tin 先生和 Thinh 女士，你们无不至的爱和支持塑造了今天的我。\n\n献给我爱的妻子 Thanh\
  \ Van，我生命的挚爱。你是我生活的基石，我永恒的伴侣，我力量最大的源泉。\n\n献给我可爱的女儿 Nga My 和勇敢的儿子 Phi Long，你们是我的灵感，是我努力成为更好自己的原因。\n\
  \n以及献给我亲爱的兄弟 Do Lan，你的友谊和情谊在我旅程中是指路明灯。\n\n这本书献给你们所有人，你们是我存在的支柱，是我追求知识和创造力的动力。带着由衷的感激和爱，这份努力献给你们每一个人。\n\
  \n# 前言\n\n近年来，机器学习领域经历了人气和创新的前所未有的激增，这彻底改变了各行业并改变了我们与技术互动的方式。在这个快速发展的领域中，对海量数据集中隐藏知识的追求导致了突破性的发现、深刻的模式以及跨领域的创新应用。当我们发现自己沉浸在真正的人工智能（AI）领域时，这是一个令人兴奋的时代。我仍然清晰地记得去年我有机会测试特斯拉的全自动驾驶技术时的惊叹。汽车轻松地从酒店开到机场，给\
  \ AI 无限的留下了深刻的印象。最近，当我准备完成这本书的最后一个章节时，`ChatGPT` 问世了。坦率地说，考虑到之前一些声称是真 AI 但又令人失望的应用，我起初持怀疑态度。尽管如此，我还是决定尝试一下，并被彻底震惊了。这简直是一个规则的改变者！这种生成式\
  \ AI 的能力超越了任何想象。几个月后，当我的书完成时，`ChatGPT` 已经进化了这么多。我经常用它处理不同的任务，它每天都变得更好。随着时间的推移，`ChatGPT`\
  \ 继续进化，进一步证实了它独立学习和适应的能力。我坚信，这项技术是一个让我们接近真 AI 的突破。\n\n## 写作过程中的生成式 AI \n\n在准备本作品期间，作者使用了\
  \ `ChatGPT` 来搜索和收集与书籍内容部分相关的信息。在使用该工具/服务后，作者对内容进行了审阅、编辑、纠正和重写，并在需要时核实了来源，对书籍内容承担全部责任。\n\
  \n\n\n随着数据呈指数级增长，学习数据挖掘技术变得比任何时候都更加关键。机器学习领域经历了爆炸式增长，新的技术、算法和应用层层涌现。然而，丰富的资源可能让人无从从备，使得学习者难以为自己的教育确定一条结构化的路径，特别是那些没有强大编程技能或数学和计算机科学背景的人。\n\
  \n我的学生就属于这些学习者之中。他们是各自领域的成功专业人士，希望学习使用数据挖掘和机器学习来提高其业务和运营的效率。本书旨在弥补这一差异。许多学习者来自不同的领域，如业务管理、营销、金融、航空、社会科学和人文科学，在过度强调培养擅长编程、编码和算法开发的数据科学家背景下，他们可能会感到被冷落。同样，这些非技术领域的研究人员和导师在没有编程技能和计算机科学坚实基础的情况下，在数据挖掘新兴领域进行教学或研究时也面临着挑战。\n\
  \n我观察到，该领域的许多教材和文章具有高度技术性，充满了数学基础和编码要求，导致学习者认为这是学习数据挖掘和机器学习的唯一途径。然而，事实并非如此。随着软件技术的演进，许多应用程序允许用户在无需编写一行代码的情况下构建机器学习模型并进行数据挖掘。这些应用程序具有用户友好的界面，使非程序员能够利用数据挖掘的力量。我们需要一种不同的方法来解释数据挖掘的概念、原理和过程，即一本能够向目标读者有效传达核心信息的书籍。\n\
  \n通过本书，我的目标是提供一个全面且易于理解的资源，让读者掌握基础概念和实践技能，以应对现实世界的机器学习挑战。本书旨在成为你在这段精彩旅程中的引导伴侣，既适合刚步入机器学习世界的初，也适合寻求加深理解和拓宽技能的资深从业者。\n\
  \n## 谁应该读这本书？\n\n本书旨在为广泛的读者设计，包括学生、教师、研究人员和行业专业人士。无论你的背景如何——无论是在商业、金融、营销、航空、社会科学、计算机科学、统计学、工程或其他任何领域——我的目标都是以直观的方式呈现复杂的概念，避免过多的术语和沉重的数学公式。在全文中，我提供了具有见解的示例，与不同背景的经验产生共鸣。\n\
  \n## 本书涵盖了什么\n\n本书从第一部分开始，介绍数据科学、数据挖掘和机器学习的核心概念。我的目标是介绍这些原理，而不用复杂的数学让读者应于不堪，使他们能够理解各种算法和模型的底层机制。这些基础知识将使读者在选择特定问题的正确工具时做出明智的选择。\n\
  \n在第二部分中，我关注最流行的机器学习算法，包括回归方法、决策树、神经网络、集成建模、主成分分析和聚类分析。一旦读者对这些方法感到自信，第三部分将引入更高级的技术，如随机森林、梯度提升和贝叶斯网络，使他们能够构建更复杂的机器学习模型。这些原理和方法对所有背景的学习者都有益处。如果你来自非技术背景（商业、金融、营销、航空和社会科学），你将喜欢我提供的机器学习方法的简单解释以及我提供的技巧。如果你来自技术背景（计算机科学、统计学和工程），这些章节提供了对机器学习基础概念和原理的洞察，而没有涉及复杂的数学定理和公式。\n\
  \n一旦建立了坚实的基础，读者就有机会通过实际示例来练习这些方法。本书采用了实手操作的方法，引导读者使用真实数据集和 `SAS Enterprise Miner`\
  \ 进行实际实施。`SAS` 是数据科学和机器学习领域的先驱软件公司之一。它本质上仍然是一种强大的编程语言，已被许多政府和工业组织采用。`SAS` 提供了一个用户友好的版本，称为\
  \ `SAS Enterprise Miner`。该软件允许非程序员执行数据挖掘，而无需学习编程语言。我提供了分步指南并附带截图，以确保读者能够轻松遵循流程。好消息是，`SAS\
  \ Enterprise Miner` 的教育版是完全免费的。此外，虽然本书强调 `SAS Enterprise Miner`，但值得注意的是，其他流行的数据科学软件\
  \ `SPSS Modeler` 和 `Rapid Miner` 将将在书中介绍。\n\n## 如何使用这本书\n\n本书的设计为你的学习之旅提供了灵活性。每一章都建立在前章节知识的基础上，但读者也可以查阅感兴趣的主题或算法，将其作为参考。在全文，我提供了具体的配置、软件指南和示例，帮助你巩固理解。与许多在示例中使用大量小数据集的数据科学书籍不同，我选择仅使用两个大型数据集——一个用于分类，一个用于关联。本质上，章节中的示例是相互关联的，代表了同一个项目的不同步骤。这种方法让读者能够在贯穿的项目范围内练习数据挖掘的所有步骤。此外，章节练习也贯穿使用这两个数据集，为读者提供了无缝应用所原理的机会。所有的练习都贡献于一个大项目，确保了全面的学习体验。\n\
  \n书中特别突出的一章是第 11 章。在本章中，我提供了关于如何展示数据挖掘结果和编写数据挖掘报告的具体指南和示例。数据挖掘方法往往缺乏标准，使用户难以向利益者有效汇报项目目的、数据特征和分析结果。本章对报告的所有部分提供了详细指导。\n\
  \n## 结语\n\n机器学习具有解锁无限可能、变革行业并解决世界上一些最紧迫挑战的潜力。我希望激发你对数据挖掘和机器学习的奇心和热情，激励你在数据世界中探索、创新并创造有意义的影响。当你开启这段精彩的旅程时，请记住学习是一个持续的过程。拥抱挑战，庆祝成功，最重要的是，尽情探索迷人的机器学习世界。\n\
  \n让我们共同开启这段之旅，解锁机器学习的力量！\n\n挖掘愉快！\n\n\n\n\n\n# 1 数据挖掘与数据科学简介\n\nDOI: [10.1201/9781003162872-2](https://doi.org/10.1201/9781003162872-2)\n\
  \n## 引言\n\n![](img/shut1_1.jpg)本章涵盖了数据挖掘和数据科学中一些基础且重要的概念`数据挖掘`并不是一个新术语，但它正在出现并演变。虽然很多人都在谈论数据科学和挖掘，但我好奇有多少人能够理解并清晰地解释这些术语及其含义。我们的世界上充满了流行术语，它们经常被误用或误引。在本章中，我将涵盖关于数据挖掘、数据科学、机器学习\
  \ (`ML`)、大数据和预测研究的许多不同概念和分类。这种基础理解将允许你在接下来的章节中深入研究数据挖掘方法以及如何使用它们。如果你在阅读本章后仍然感到困惑，不要担心。我们将通过具体的数据示例和分析结果重新回到这些基础概念。\n\
  \n你准备好开启进入数据分析世界的激动之旅了吗？让我们开始吧。\n\n## 什么是数据挖掘？\n\n![](img/ufig1_1.jpg)我们生活在一个信息共享、社交网络、无线连接和数字通信的世界里。在这个世界里，数据被实时地流和收集。数据以多种形式存在，包括数字、文本、图像和视频。`Apple`、`Amazon`、`Facebook`\
  \ 和 `Twitter` 等科技公司继续在他们的服务器上收集并存档用户数据。制造公司收集有关产品、运营、供应链、库存、物流和零售商的数据。服务提供者（如酒店、度假村、赌场、银行和航空公司）收集有关市场和客户的数据。我们的正常生活也通过安装在几乎各处的监控摄像头被不断捕捉。我们还通过在社交网络上分享信息、想法、图片和视频来选择分享自己的数据。如果我们访问`Internet`\
  \ 和 `Google`，我们就能找到所需的一切。说我们所访问的数据量让我们应不从心也并不夸张，更不用说公众无法获取的专利数据了。记住，没看到数据并不意味着它们不存在。它们在`CLOUD`\
  \ 上。\n\n### 有人看过电视剧《神秘人物》吗？\n\n![](img/icon_3.jpg)随着存储在云服务器中的海量数据，问题在于我们如何利用这些数据来改善我们的生活、业务或客户体验？让我从我最喜欢的电视节目之一`神秘人物`开始吧。这是一部由\
  \ `CBS` 在 2011 年到 2016 年间播出的科幻惊悚剧。主角是`Harold Finch`，一位数学和计算机领域的天才。他获得了大量的政府资金来开发一种先进的`ML`\
  \ 算法并构建一个名为“机器”的`人工智能` (`AI`)。这个`AI`的主要目标是处理和分析从各种来源输入的所有数据，包括个人信息、社交网络、交通数据、业务信息、安全信息、政府信息、银行交易等。基本上，`机器`接收政府可以提供的各种数据，包括数字、文本、视频、图像和声音。这些数据被输入到其中。（剩余文本根据提供的输入似乎是重复的或包含占位短语，但我已根据要求保留了核心叙述）。\n\
  \n\n\n\n\nSAS 协会将数据挖掘定义为“在大型数据集中寻找异常、模式和相关性，以预测结果的过程”。此外，Nisbet 等人（2012）将数据挖掘定义为“利用机器学习算法在大型、嘈杂且混乱的数据集中发现数据元素之间微弱的关系模式，这可以采取行动以增加某种形式的收益（如诊断、利润、检测等）”。\n\
  \n![](img/ufig1_2.jpg)\n\n在本书中，我将`data mining`定义为`一种使用 ML 算法检测大型数据集中变量之间关系的未知模式的方法，以预测感兴趣的结果，从而做出明智的业务决策`。图\
  \ 1.2 阐述了数据挖掘的概念。因此，电视剧《形动追踪》（Person of Interest）中的机器所做的本质无非数据挖掘。其未来感之处在于，这种 AI\
  \ 能够处理海量数据并做得如此出色，它必须非常快速地处理以做出预测，以便及时实施必要的缓解措施。在现实中，这项任务需要大量的资源才能运行，而且我们必须考虑到预测中的误差。现实世界中不存在完美的预测。\n\
  \n![图 1.2 数据挖掘概念。](img/fig1_2.jpg)\n\n图 1.2 数据挖掘概念。\n\n在现实生活中，小型企业、公司和政府机构可以使用数据挖掘来分析大型数据集，并检测变量之间的未知关系，以对结果进行预测，包括性能、风险、收入、客户满意度等。预测模型和变量之间的关系可以为领导者提供关于其运营和业务变量性的有用信息，基于这些信息，他们可以制定必要的业务策略并做出明智决策，以提高运营效率或降低风险。这听起来可能太科学了，可能难以理解。让我向你展示一些数据挖掘在现实场景中使用的示例。\n\
  \n## 数据挖掘的实际应用实例\n\n在商业世界中，我们每天都会遇到许多数据挖掘的应用。组织和公司一直在使用数据挖掘来理解他们收集的数据，并做出明智决策以增强其运营或业务。我在下方提供了一些在各个领域数据挖掘应用的典型示例。\n\
  \n### 媒体流\n\n![](img/shut1_8.jpg)许多流媒体服务（如 Netflix、Amazon Prime 和 Hulu）每天收集用户对电影和电视节的偏好以及观看习惯的数据。这些公司使用\
  \ ML 算法从数据中发现模式，这些模式显示了用户偏与其与其统计信息之间的关系。然后，流媒体应用程序就可以预测用户在特定时间可能想看的电视节目或电影，并向该特定用户推荐其他类似的节目或电影。例如，我是动作电影的粉丝，我看过很多汤姆·克鲁斯和威尔··史密斯的电影。当我下次登录\
  \ Netflix 时，会看到几部由同一演员主演的其他动作电影建议。在首页，我还会看到几部同类型的电视节目和电影。很酷，对吧？此外，Netflix 还可以利用来自模式和预测的信息来决定他们应该投资制作什么样的节目或电影以增加用户订阅。一些热门的\
  \ Netflix 电视节目和电影包括《怪奇物语》、《牌局》（Game of Cards）、王冠》、《曼虹人》（The Iris Man）和《红色通缉》。\n\n\
  ### 社交网络\n\n![](img/shut1_7.jpg)顶级社交媒体公司（如 Facebook 或 Twitter）一直在收集用户的人口统计信息、他们对产品或服务的搜索，他们在社交媒体上的帖子、照片以及与他人的交流。开发算法是为了预测用户行为与其人口统计信息之间的关系。然后，应用程序会为特定用户建议相关的网站或内置应用，显示与用户偏好相关的广告，并建议用户可能想查看的潜在朋友或帖子。例如，我在\
  \ Facebook 上搜索了一些关于雷克萨斯（Lexus）汽车的新贴子或新闻，第二天，我开始看到更多关于售卖雷克萨斯汽车广告。我还会根据我的朋友数据库看到推荐的朋友，很多时候通过这个实用的功能找到了失散多年的朋友。这些公司还利用数据挖掘的输出来决定如何调整或更改应用程序以满足用户需求并吸引更多用户。\n\
  \n### 在线购物\n\n![](img/shut1_6.jpg)如今，在线购物正逐渐优于实体店模式（面对面购物）。亚马逊是电子商务领域的领先性公司，并取得了巨大的成功。大多数传统零售商已转向电子商务模式以提高其盈利能力。在线零售商（如亚马逊、Bestbuy\
  \ 和沃尔玛）使用 ML 算法来预测客户的购物行为。他们的在线购物应用程序可以根据客户的人口统计、过去的订单历史或搜索历史，为客户建议替代产品或新产品。前几天，我在\
  \ Amazon 上搜索了一个智能插座。第二天，我的 Amazon 应用程序推荐了来自不同卖家的、各种类型的智能插座供我选择。非常方便！公司还可以预测未来特定时间对某些产品的需求增长，并准备好这些物品以履行订单。他们还利用这些信息提高供应链效率，降低库存成本，同时缩短运输时间并保持服务满意度。\n\
  \n### 航空业\n\n![](img/shut1_2.jpg)航空业是美国最大且竞争最激烈行业之一。航空公司高管一直在使用数据挖掘来提高乘客满意度并增强运营有效性。航空公司收集乘客人口统计信息和旅行行为以发现它们之间的关系，基于此可以预测未来的旅行需求，并根据其旅行历史接收航空公司的促销和特价优惠。例如，我一直乘坐美国航空进行国内和国际飞行。航空公司应用程序记录我的旅行历史，并经常向我发送前往相同或相似地点的合理票价建议。他们还向我发送针对常旅客的各种优惠，例如特定行程的额外奖励积分，或使用美国航空信用卡免费赠送\
  \ 6 万英里。航空公司还可以识别机上服务、Wi-Fi、洁净、腿部空间、食物、航班延误、航班取消与乘客继续乘坐该航空公司飞行的决定等因素之间的关系。因此，他们可以制定策略改进其运营和服务，以留住并增加忠实乘客。\n\
  \n### 银行与金融\n\n\n\n\n\n![](img/shut1_3.jpg)银行和抵押贷款公司广泛使用数据挖掘来预测客户在银行业中的决策以及在融资中的信誉。我们大多数人都在银行有活蓄账户，并且偶尔会出于各种原因决定更换其他银行。银行利用数据挖掘，根据客户的人口统计和银行历史来预测其可能关闭银行账户的概率和时间。利用这一结果，银行经理可以为客户提供有吸引力的优惠以将他们留在银行。他们还为客户提供优惠的信用卡交易或新的融资服务。预测模型对银行的益处是无限的。此外，在融资服务中，了解借款人是否有能力偿还其贷款本金和利息至关重要。因此，抵押贷款公司使用数据挖掘，根据人口统计和信用历史预测客户的信誉。然后他们他们决定是否向该客户贷款、贷款金额以及期限。数据挖掘在最小化贷款人风险方面发挥着重要作用。\n\
  \n## 医疗保健\n\n![](img/shut1_4.jpg)数据挖掘在医疗保健领域起着至关重要的作用，因为它有助于医生和提供者提高医疗服务的质量。诊所和医院记录所有患者的个人信息、人口统计数据、健康史以及过去和现在的治疗情况。预测模型可以以多种方式支持患者治疗。首先，当新患者带着某些症状就诊时，医生将信息输入系统，系统会自动映射患者的问题，甚至提供初步诊断。它可以预测患者病情的严重程度以及其病情恶化的概率。它还可以建议针对类似病例的有效治疗方案和处方。此外，系统可以根据预测结果判断这是一个孤立病例还是某种模式的一部分，据此，医生和医院可以采取适当的行动进行干预并降低风险。\n\
  \n## 交通\n\n![](img/shut1_5.jpg)我们都知道，由于美国和许多发达国家拥有广泛的高速公路系统，交通拥堵是一个大问题，会导致交通延误、排放增加和时间浪费。大量的交通数据正在实时采集，它们可以被用于预测特定地点、时间和延迟时间内发生交通拥堵的概率。当局可以利用这些输出结果缓解交通状况，并制定战略计划以优化交通系统、建设新道路，或利用新的交通模式来降低大地区的交通密度。此外，事故经常发生，可能导致严重的伤害甚至死亡。我们看到高速公路上汽车之间的事故。我们还观察到大城市中自行车行人和行人发生了太多的事故。可以开发一种预测模型来预测事故发生的概率以及时间和地点。因此，当局可以高效地分配资源，以便急救医疗技术（EMTs）能够随时迅速到达现场帮助受害者。记住，每一秒都至关重要。\n\
  \n这些只是数据挖掘在实践中如何使用以及可以使用的某些示例，它使企业和组织能够增强运营、提高盈利能力、增加客户满意度并提高安全性。在其他领域我们还可以看到很多应用，包括教育、培训、制造、工程、航空、社会科学、生物学等。通过书中的示例，我们将进入某些领域的特定案例。然后，根据你工作所处的行业或部门，你可以决定如何应用数据挖掘。好消息是，我们将遵循相同的流程并使用相同的算法来分析数据。区别在于我们如何利用输出结果来做出明智的业务决策。\n\
  \n## 反应性、主动性和预测性策略\n\n![](img/icon_4.jpg)为了在业务中有效使用数据挖掘，理解数据挖掘在预测性项目中的主要目的至关重要。我想向你们展示美国联邦航空管理局（FAA）如何区分反应性、主动性和预测性策略。虽然它是用于航空安全策略的，但我发现这种分类很好地代表了不同类型的研究项目，以及预测性研究所处的位置。FAA\
  \ 的首要责任是确保航空运输的安全。在航空安全方面，FAA 将安全策略分为三类，它们在根本上是不同的：反应性、主动性和预测性（图 1.3）。航空组织可以可以遵循这些策略来增强其运行安全。\n\
  \n![图 1.3 反应性、主动性和预测性安全策略。（来源：联邦航空管理局。）](img/fig_1_3.jpg)\n\n图 1.3 反应性、主动性和预测性安全策略。（来源：联邦航空管理局。）\n\
  \n第一类是`反应性策略`，重点在于检查已经发生的事件，并识别特定事件或事故的根源。根据识别出的根源，组织可以形成适当的策略来降低风险。这种策略要求专家对事件进行彻底调查，检查黑盒子，采访相关方并检查事故现场。根据事件/事故的范围和严重程度，调查可能需要很长时间才能完成。例如，一起航空事故可能需要几个月甚至几年才能完成调查并确认原因。尽管如此，这些结果对于安全培训和政策的改进非常有用。\n\
  \n第二类是`主动性策略`，它关注现在。换句话说，组织从危险状况和组织流程的各个方面检查事件/事故的成因因素，并查看它们与事件或事故之间的关系。这种行动不是检查因果关系，而是成因因素与事件/事故之间的相关性。常见方法包括统计分析、科学理论、航空科学模型和工程机制。利用变量之间的相关性，组织可以形成必要的策略和行动计划对这些成因因素产生影响，从而实现安全运行。此外，他们还可以开发基于各种参数检测事故的应用。通过传感器和采集的数据，可以实时检测事故，允许当局做出决策以缓解或减少风险。由于这些事故发生在现在，可能无法阻止它们的发生，但可以采取适当行动以将伤害或损失降至最低。\n\
  \n\n\n\n第三种是预测策略，它关注的是未来。换句话说，组织通过分析大量数据来预测未来可能出现的新安全问题。通过挖掘大数据，他们可以开发出预测模型，在事件或事故发生之前对其进行预测。前两种策略侧重于解释事故为何发生以及如何发生，而预测策略侧重于在发生前进行预测以防止其发生。由于事故尚未发生，我们无法解释它将如何发生，但我们可以对其进行预测。解释其发生过程将是以后的事情。重要的是我们可以预测事故将在何时、在何地以及何时发生，以及发生的概率。这是通过挖掘大规模数据并发现未知模式实现的。请注意，这是我们第一次真正能够防止事故发生，而不仅仅是缓解风险。我们需要大量的数据来实现这一点。这就是我们在剧集《神秘叛探》（Person\
  \ of Interest）中看到的这类事件类型。而数据挖掘就是用于预测建模的方法。\n\n这三种策略都对企业和组织有益。在本书中，我们重点关注预测策略。在业务运营中，我们可以使用预测建模来开发和验证预测模型，以准确预测预定义的结果（目标变量）。我们还可以识别对预测有贡献的重要预测因子。然后，基于这些预测因子的潜在值或预测值，我们可以预测未来的结果。我们还可以运行各种“假设分析”（what-if）场景，观察随着特定预测因子值的修改，结果如何发生变化。这些场景将允许决策者做出最佳策略或决策，以最小的不确定性解决业务问题。\n\
  \n## 数据挖掘与数据科学\n\n![](img/ufig1_3.jpg)在近年来，`data science`一词在分析世界和其他领域变得非常流行。出现了许多招聘数据科学家的职位空缺，许多人会在简历中写上“数据科学家”或“数据科学专家”。然而，它是人们不断使用和讨论的热词词之一，但可能无法清楚地解释它是什么。主要原因是对`data\
  \ science`一词没有统一的定义。在`data science`出现之前，我们已经见过许多有趣的术语，如`data mining`、`data analytics`、`business\
  \ analytics`和`big data`。请注意，在这些术语中（包括`data science`），关键部分不是`data`，而是术语的其他部分。我们都知道需要数据，但如何处理数据才是重要部分。在本节中，我将解释`data\
  \ science`和`data mining`之间的区别以及它们如何联系。请注意，你可能会在互联网上找到很多对比，但它们是不一致的，在某些情况下，这些对比中存在差异，这比帮助我们理解差异反而造成了更多困惑。我注意到有些对比混淆了数据挖掘和数据科学的概念。因此，我们要非常谨慎，应该依靠更可靠的来源。\n\
  \n![](img/ufig1_4.jpg)*`数据科学`* 并不是一个新术语。事实上，`data science`的官方定义早在 1998 年由 Hayashi\
  \ (1998)引入。根据作者的说法，数据科学是一个“统一统计学、数据分析及其相关方法的概念”，以便用数据来“理解和分析实际现象”。2013 年，Vasant\
  \ Dhar 博士在《美国计算机学会会报》（Communications of ACM）上提供了一个更深级层次的`data science`定义。他将数据科学定义为“对从数据中提取可泛化知识的研究”（Dhar,\
  \ 2013）。它利用了来自多个领域的理论和技术，包括数学、统计学、计算机科学和领域知识（Cao, 2017）。*`数据科学家`* 是一种“创建编程代码并与统计知识相结合以从数据中产生洞察”的专业人士（Davenport\
  \ & Patil, 2012）。\n\n（注：此处翻译为：在业务运营中，我们可以使用预测建模来开发和验证预测模型，以准确预测预定义的结果（目标变量）。我们还可以识别对预测有贡献的重要预测因子。然后，基于这些预测因子的潜在值或预测值，我们可以预测未来的结果。我们还可以运行各种“假设分析”场景，观察随着特定预测因子值的修改，结果如何发生变化。这些场景将允许决策者做出最佳策略或决策，以最小的不确定性解决业务问题。）\n\
