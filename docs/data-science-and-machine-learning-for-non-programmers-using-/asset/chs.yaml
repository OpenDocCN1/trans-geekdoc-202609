  * `em_save_VALIDATE.xlsx`:验证样本的预测数据。\n\n![](img/ufig8_12.jpg)我们使用验证数据文件来计算 `CART`\
  \ 和 `CHAID` 树的模型拟合指标（详细说明请参见第 6 章和第 7 章）。结果，我们得到了如表 8.8 所示的模型拟合指标。我还包含了我们在第 7 章中构建的逻辑回归模型的指标作为参考。如你所见，`CART`\
