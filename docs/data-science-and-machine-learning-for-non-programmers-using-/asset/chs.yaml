  4. 决策树的层级结构使我们更容易理解通过将节点拆分为分支来做出预测的逻辑。这种方法是非参数的，能够检测非线性关系。\n5. 它也不受任何假设或限制。更好的是，缺失值对树的有效性没有任何影响，因为该方法有处理缺失值的特定方法。\n\
  6. 所有这些原因使得这种方法成为最流行的机器学习方法之一。为了避免构建难以理解且容易过拟合的巨树，我们需要通过删除冗余分支来修剪树。\n7. 推荐使用自动剪枝，因为我们可以为子树设置标准，算法将继续构建树直到满足标准。这更有效且能最大限度地减少人为错误。\n\
