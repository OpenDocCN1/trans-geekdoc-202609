  \ 推荐。\n\n正如你所看到的，如果我们确保符号列表层级与树形层级匹配，这并不太困难。通常，在数据挖掘报告中，我们只需要展示树图并解释一些关键节点和分支。不需要涵盖所有的节点和分支，因为那可能会导致大量的细节页。尽管如此，我在这里提供了一份完整的解释作为演示，以便你可以回过此页面学习如何解释树图。\n\
  \n你还可以注意到某些节点（例如年龄、旅行目的或目的地州）在树中出现了多次。这种选择是由分裂算法决定的，以实现模型拟合程度的最大化。在年龄案例中，该节点需要被分裂多次，因为\
  \ `CART` 只使用二分法。\n\n### 如何解释叶子节点？\n\n上述是解释树图的方法，更具体地说是树的层级结构。我们还需要理解并解释叶子节点，它们代表了决策。幸运的是，SAS\
  \ Enterprise Miner 通过 `Node Rules` 提供了此类输出。这些规则解释了树模型中叶子节点的输出。\n\n要获取节点规则：\n\n*\
  \ 在结果窗口中：`View -> Model -> Node Rules`\n\n下面是节点规则的快照，以叶子节点 4、10 和 12 为例。我没有展示所有的规则，因为它们非常长。由于我们知道树有\
  \ 17 个叶子，因此我们有 17 个叶子节点的规则。\n\n#### 叶子节点解释\n\n### 变量重要性\n\n决策树模型的另一个重要输出是变量重要性表（参见表\
  \ 8.4）。本质上，变量重要性表展示了预测目标变量的变量重要性。它是通过误差平方和计算的。分数越接近 1，该预测变量越重要。该表告诉我们训练和验证样本的结果是一致的。\n\
  \n表 8.4 CART 变量重要性\n\n| 变量 | 训练重要性 | 验证重要性 |\n| --- | --- | --- |\n| 旅行目的 | | |\n\
  | 年龄 | | |\n| 飞行次数 | | |\n| 航空公司状态 | | |\n| 飞行距离（英里） | | |\n| 到达延迟（分钟） | | |\n|\
  \ 出发延迟（分钟） | | |\n| 飞行时间（分钟） | | |\n| 目的地州 | | |\n| 起始州 | | |\n| 机场购物 | | |\n| 机场饮酒\
  \ | | |\n| 性别 | | |\n| 忠诚卡数量 | | |\n| 飞行多年 | | |\n| 显著性水平 | | |\n| 机场停留时间 | | |\n\
  | 目的地州 | | |\n| 缺失值 | | |\n| 替代规则 | | |\n| 叶子 ID | | |\n| 树 ID | | |\n| 节点 ID |\
  \ | |\n| 父节点 ID | | |\n| 深度 | | |\n| 概率 | | |\n| 计数 | | |\n| 误差 | | |\n\n### CHAID\
  \ 树\n\n1. 点击 CHAID 节点。在训练中进行以下更改：\n\n    在分裂规则下：\n    * 将分类标准设置为 `PROCHISQ`。\n \
  \   * 将显著性水平设置为 `0.05`。\n    * 将缺失值设置为`使用`。\n\n    在节点下：\n    * 将最大分支设置为 `20`。\n\
  \    * 将叶子大小设置为 `2`。\n\n    在分裂搜索下：\n    * 将穷尽式设置为 `0` 以强制进行启发式搜索。\n\n    在子树（自动剪枝）下：\n\
  \    * 将方法设置为`评估`。\n    * 将评估指标设置为`误分类率`。\n\n    在 p 值调整下：\n    * 将 Bonferroni 调整设置为`是`。\n\
  \    * 将 Bonferroni 时间设置为`之后`。\n\n2. 运行 CHAID 节点。\n\n3. 打开结果窗口。\n\n通过 `View -> Model\
  \ -> Subtree plot` 获取图表。图 8.10 显示了剪枝后 CHAID 树的子树图。记住我们对这棵树使用了自动剪枝。如图所示，该树有 23 个具有最小\
  \ MR 的叶子。为了比较，如果我们构建完整的 CHAID 树，将会有 165 个叶子，这是一个规模大得多的树（我不会展示这棵完整树的细节）。在本示例中，我们使用剪枝后的\
  \ CHAID 树，因为它更小，更易理解和解释。\n\n\n\n\n\n我在这里将不再解释 `CHAID` 树图。你可以使用上述相同的方法来解释此树的分层结构。同样，我们也可以使用\
  \ `Node Rules` 来解释叶子节点的信息。\n\n此 `CHAID` 树的变量重要性见表 8.5。结果显示，旅行目的是是最重要的预测因子，其次是航空公司状态、到达延误和年龄。这一变量重要性与图\
  \ 8.11 中的树图契合得非常好，与图 8.8 中的`CART` 树也基本一致。你还会注意到 `CHAID` 树的特征是短而宽。其原因是 `CHAID` 允许多重分裂，因此每个节点可以分裂为两个以上的分支。这就是为什么树可以在不需要反复将节点分裂为两个分支的情况下对数据进行建模。\n\
  \nTable 8.5 CHAID 树的变量重要性\n\n| 变量 || 训练重要性 || 验证重要性 |\n| --- | --- | --- |\n| 旅行目的\
  \ || 1.000 || 1.000 |\n| --- | --- | --- |\n| 航空公司状态 || 0.375 || 0.320 |\n| 到达延误（分钟）\
  \ || 0.308 || 0.286 |\n| 年龄 || 0.302 || 0.270 |\n\n### 模型比较\n\n我们构建了两棵树：一个 `CART`\
  \ 树和一个 `CHAID` 树。哪种模型的性能更好？为了回答这个问题，我们使用 `Model Comparison` 节点来比较这些模型。\n\n按照以下步骤设置模型比较。\n\
  \n1. 从 `Assess` 选项卡中将 `Model Comparison` 节点拖入工作区，并将其同时连接到 `CART` 树节点和 `CHAID` 树节点。\n\
  2. 将 `Selection Statistic` 设置为 `Misclassification rate`。\n3. 将 `Selection Table`\
  \ 设置为 `Validation`。\n4. 运行 `Model Comparison` 节点。\n5. 打开 `Results` 窗口。\n\n我们使用在\
  \ `CART` 树中相同的步骤，为这两个模型提取并计算模型拟合指标（参见表 8.6）。再次，某些指标是从 `Model Comparison` 节点的 `Results`\
  \ 窗口中提取的，而另一些需要使用混淆矩阵进行计算。为了避免信息重复，我在这里不再展示详细的计算过程。请参阅第 6 章获取详细公式和示例。\n\nTable 8.6\
  \ CART 树与 CHAID 树的模型拟合指标比较\n\n| 模型拟合指标 || 剪枝后的 CART 树 || 剪枝后的 CHAID 树 |\n| --- |\
