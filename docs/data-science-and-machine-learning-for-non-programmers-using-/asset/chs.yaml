  \n### CART 树解释\n\n让我们深入研究 `CART` 树。图 8.14 显示了子树图，告知了我们剪枝的结果。如你所见，最终树有 `22` 个节点（由\
  \ `ASE` 决定）。当我们查看 `CHAID` 树的相同图表时，发现它有 `58` 个节点，这使得它大得多。\n\n![](img/ufig8_14.jpg)\
  \ [图 8.14]  `CART` 树的子树评估图。\n\n我们还可以注意到，随着节点数量的增加，训练样本和验证样本之间的 `ASE` 差异也在增大。这个问题可能暗示模型可靠性不佳。但请记住\
  \ `ASE` 是平均平方误差，与 `MSE` 相同。数值取决于尺度，因此很难判断这种差异是否可以。通过查看 `RMSE`，我们看到训练的 `RMSE` 为 `3.19`，而验证的\
  \ `RMSE` 为 `4.61`。这两个值并不远。我们还查看了两个样本的预测值和目标值的评分分布（图 8.15）。两个样本的分布非常接近。\n\n![](img/ufig815.jpg)\
  \ 图 8.15 训练和验证样本的评分分布。\n\n为了进一步审查 `CART` 树的性能，我们还查看了实际值对比和残差对比图进行最终确认。这些图是使用之前下载的\
  \ Excel 文件构建的。图 8.16 显示实际值对比图，而图 8.17 显示残差对比图。\n\n![](img/ufig816.jpg) 图 8.16 实际值对比图。\n\
  \n![](img/ufig817.jpg) 图 8.17 残差对比图。\n\n如图 8.16 所示，数据点非常接近对角线，只有少数离群点。此外，图 8.17\
  \ 显示残差系统地分布在零线之间。尽管注意到一些小的离群点，但我们没有检测到任何非随机模式。总体而言，这些图表显示模型拟合没有问题。\n\n### CART 树图和节点解释\n\
  \n图 8.18 显示了完整的 `CART` 树图。树太大，无法显示所有节点细节。但根据层级结构，你可以看到 `RmSQ` 是根节点，树中的每个节点都分为两个分支。我们使用之前描述的方法来解释树图。\n\
  \n![](img/fig818.jpg) 图 8.18 完整的 CART 树。\n\n如之前所述，我们还可以使用节点规则来显示节点的细节。以下是前四个节点的节点规则，解释了在每个节点处预测\
  \ `Imv`（房屋中位数）。\n\n### 变量重要性\n\n通常，最后的结果是变量重要性。表 8.9 显示训练样本和验证样本之间的相对重要性结果是一致的。结果表明\
  \ `RmSQ` 是最重要的预测变量，其次是 `Lstat`、`IndustPr` 和 `NiOxSQ`。另一方面，`LogAccess`、`Tax` 和 `Charles\
  \ River` 是预测 `Imv` 时最不重要的变量。这一发现将允许决策者评估波士地区的住房市场，并制定适当策略提高房屋价值。\n\nTable 8.9 变量重要性\n\
  \n| 变量 || 训练重要性 | 验证重要性 |\n| --- | --- | --- |\n| RmSQ || 1 || 1 |\n| --- | ---\
  \ | --- |\n| Lstat || 0.967 || 0.982 |\n| IndustPr || 0.8846 || 0.9216 |\n| NiOxSQ\
  \ || 0.8459 || 0.8951 |\n\n\n\n\n\n| AgePre40 || 0.4852 || 0.4584 |\n| B || 0.3664\
  \ || 0.296 |\n| LogDistance || 0.3435 || 0.2348 |\n| Charles River || 0.3397 ||\
  \ 0.2517 |\n| Tax || 0.3326 || 0.2587 |\n| LogAccess || 0.1399 || 0.0755 |\n\n##\
  \ 示例：使用 SAS Enterprise Miner 进行 CSL\n\n![](img/icon_10.jpg)如第 3 章和第 6 章所示，`CSL`\
  \ 是一种是一种流行的方法，允许我们根据误分类的成本而非误分类率来评估和选择模型。该假设是每次误分类可能导致不同的成本，我们的目标不是最小化误分类率，而是最小化误分类的总成本。\n\
  \n我将演示如何使用航空公司推荐数据集执行 `CSL`。目标变量是一个具有两个水平的二分类变量：YES – 推荐航空公司，NO – 不推荐航空公司。`Decision\
  \ node` 用于执行 `CSL`，这两个水平代表了 `CSL` 中的决策。我将演示两种两种场景下如何执行 `CSL`。\n\n1. `Objective`：最小化误分类的总成本。\n\
  2. `Objective`：最大化准确分类的总利润。\n\n### 以成本最小化为目标的 CSL\n\n在构建图表之前，为该场景制定决策矩阵至关重要。表 8.10\
  \ 展示了该场景的假设矩阵。在这种情况下，目标是预测航空公司的乘客推荐情况，据此航空公司可以建立适当策略来满足需求。假设假阳性（预测为推荐但实际为不推荐）可能导致航空公司的成本比假阴性（预测为不推荐但实际为推荐）更高。其原因是假阳性可能导致对需求增长的误判，从而决定增加航班次数和飞机数量。基于此误分类的决策将增加航空公司的运营成本，而收入不会提高。另一方面，假阴性会给航空公司带来一些机会成本，因为他们错过了满足不断增长需求的黄金机会。然而，这一成本低于假阳性的成本。我们使用一个假设场景，即假阳性的成本乘以假阴性的成本。我没有使用并不具备的实际金额，而是使用了假阳性单位成本\
  \ 200 单位，假阴性单位成本 20 单位（表 8.10）。我们的目标是找到最小化误分类总成本的预测模型。\n\nTable 8.10 决策矩阵 – 误分类成本\n\
  \n|  || 预测 YES || 预测 NO |\n| --- | --- | --- |\n|  YES || True PositiveCost = 0\
  \ || False NegativeCost = 20 |\n| --- | --- | --- |\n|  NO || False PositiveCost\
  \ = 200 || True NegativeCost = 0 |\n\n按照之前的步骤操作，但在 Decision Processing – Decisions\
  \ 窗口中，我们需要如下所示更改 Decision 选项页的配置：\n\n1. 在 `Train` 属性中：\n   - 选择 `Minimize`。\n  \
  \ - 添加假阳性和假阴性的成本单位（images/ufig8_13.jpg）。\n\n2. 点击 `Decision node`：\n   - 选择 `Yes`。\n\
  \n3. 在 `Decision Weights` 选项页中：\n   - 选择 `Maximize`。\n   - 添加真阳性和真负性的利润单位（images/ufig8_14.jpg）。\n\
  \n4. 一旦运行 `Model Comparison` 节点，输出结果（表 8.11）显示 `Pruned CHAID Tree` 是成本较低的模型。\n\n\
  Table 8.11 CSL 结果 – 成本最小化\n\n| 模型描述 || 有效：推荐平均损失 || 有效：误分类率 |\n| --- | --- | ---\
  \ |\n| Pruned CHAID Tree || 10.719 || 0.211 |\n| Pruned CART Tree || 10.928 || 0.208\
  \ |\n\n### 以利润最大化为目标的 CSL\n\n在这种场景下，我们关注准确分类的利润。我们假设航空公司正在经历下滑，他们需要在航班和飞机方面做出运营决策。如果航空公司知道不推荐乘客的正确数量，他们就可以建立正确的策略。表\
  \ 8.12 展示了该场景的决策矩阵，其中真负性的单位利润为 1000，而真阳性的单位利润为 100。我们的目标是找到最大化误分类总成本的预测模型。\n\nTable\
  \ 8.12 决策矩阵 – 准确分类利润\n\n|  || 预测 YES || 预测 NO |\n| --- | --- | --- |\n|  YES ||\
  \ True PositiveCost = 100 || False NegativeCost = 0 |\n| --- | --- | --- |\n|  NO\
  \ || False PositiveCost = 0 || True NegativeCost = 1000 |\n\n按照之前的步骤操作，但在 Decision\
  \ Processing – Decisions 窗口中，我们需要如下所示更改 Decision 选项页的配置：\n\n1. 在 `Train` 属性中：\n\
  \   - 选择 `Maximize`。\n   - 添加真阳性和真负性的利润单位（images/ufig8_15.jpg）。\n\n2. 点击 `Decision\
  \ node`：\n   - 选择 `Yes`。\n\n3. 在 `Decision Weights` 选项页中：\n   - 选择 `Minimize`。\n\
  \   - 添加假阳性和假阴性的成本单位。\n\n一一旦运行 `Model Comparison` 节点，输出结果（表 8.13）显示 `Pruned CHAID\
  \ Tree` 是总利润更高的模型。\n\nTable 8.13 CSL 结果 – 利润最大化\n\n| 模型描述 || 有效：推荐平均损失 || 有效：误分类率\
  \ |\n| --- | --- | --- |\n| Pruned CHAID Tree || 478.57 || 0.153 |\n| Pruned CART\
  \ Tree || 477.46 || 0.150 |\n\n\n\n\n正如你所看到的，通过使用 `Decisions` 节点，我们可以轻松地执行成本敏感学习（CSL），并在模型比较过程中考虑误分类的成本或准确分类的利润，并使用成本最小化或利润最大化来选择冠军模型。在本书书中，为了确保的一致性，我将在后续章节中继续使用误分类率作为选择统计量。尽管如此，如果你的项目需要使用成本或利润作为决策因素，你也可以返回本章，按照相同的步骤在你的图中引入\
  \ `Decisions` 节点。\n\n## 总结\n\n本章重点关注决策树，这是一种在你阅读此本书之前并不熟悉的新型机器学习方法。我们涵盖了关于决策树的一些基础信息，特别是它们是如何构建的以及如何解释树的分层结构。决策树的层级结构使我们更容易理解通过将节点拆分为分支来做出预测的逻辑。这种方法是非参数的，能够检测非线性关系。它也不受任何假设或限制。更好的是，缺失值对树的有效性没有任何影响，因为该方法有处理缺失值的特定方法。所有这些原因使得这种方法成为最流行的机器学习方法之一。为了避免构建难以理解且容易过拟合的巨树，我们需要通过删除冗余分支来修剪树。推荐使用自动剪枝，因为我们可以为子树设置标准，算法将继续构建树直到满足标准。这更有效且能最大限度地减少人为错误。\n\
  \n我们还学习了两种不同类型的树，`CART` 树和 `CHAID` 树，它们根据划分规则进行确定。简单来说，`CART` 使用二分划分，一个节点仅拆分为两个分支，而\
  \ `CHAID` 使用多分划分，一个节点可以被拆分为两个以上的分支。这两种树各有优缺点。需要注意的是，它们可以用于构建关联模型或分类模型。它们也可以适用于连续型或分类型预测变量。基本上，决策树是非常多能的。SAS\
  \ Enterprise Miner 没有针对 `CART` 和 `CHAID` 的专用节点；它仅有一个 `Decision Tree` 节点。尽管如此，我们可以通过特定的配置配置\
  \ `CART` 树或 `CHAID` 树。决策树的输出包括显示完整树层级结构的树图，以及解释每个叶子节点如何做出预测的叶节点规则。最后，变量重要性表格为我们提供了。\n\
