  \n\n\n\n你可能会问：为什么我们不对 `airline recommendation` 数据集中的区间变量进行归一化呢？这是一个很好的问题。让我解释一下。对于基于顺序最小二乘法（`OLS`）的方法如线性回归），正态分布是一个常见的要求。这些算法在处理归一化数据时效果最好，因为这有助于我们实现良好的模型拟合。`boston`\
  \ 数据集具有区间目标变量，因此线性回归是合适的选择。这就是为什么建议对数据进行归一化的。然而，逻辑回归、决策树或随机森林等方法基于不同的基础，正态分布并不是必要要求。因此，归一化数据对这些算法可能产生产生优势。在\
  \ `airline recommendation` 数据集中，我们有一个二分类目标变量，这使得逻辑回归成为预测建模的正确选择。在高级机器学习方法中，神经网络也不要求正态分布的数据，但可能需要数据标准化来帮助实现更好的模型拟合。`SAS\
  \ Enterprise Miner` 中的神经网络工具具有内置的数据标准化选项，允许我们以更具动态的方式尝试不同的方法。这就是为什么我们不需要对此数据集中的区间变量进行归一化。\n\
  \n### 波士顿房价的离散化示例\n\n为了向你展示变量离散化的示例，让我们考虑一个假设的场景。假设我们想将区间目标变量（`IMP_Imv`）转换为用于预测的分类变量。为了实现这一目标，我们需要进行变量离散化。我们使用\
  \ `Transform Variables` 节点完成此任务。\n\n继续之前完成的 `Transform Variables` 节点。为了执行离散化，从 `Modify`\
  \ 选项将另一个 `Transform Variables` 节点拖入工作区，将其命名为“Discretization”，并连接到 `Impute` 节点（见下方）。\n\
  \n![](img/ufig5_17.jpg)按照以下步骤配置 `Discretization` 节点。\n\n1. 在 `Train` 属性下：\n    *\
  \ 对于 `Default Methods`：将 `Interval Targets` 设置为 `Quantile`（即根据日期划分为频率大致相同的组）。\n\n\
  2. 运行 `Discretization` 节点并打开 `Results` 窗口。\n\n结果输出显示原始变量（`IMP_Imv`）、角色（`target`）、原始级别（`interval`）、新名称（`PCTL_IMP_Imv`）、新级别（`nominal`）以及离散化方法（`quantile\
  \ with four levels`）（表 5.13）。\n\n表 5.13 离散化结果\n\n| Name | Role | Level | Name |\
  \ Level | Formula |\n| --- | --- | --- | --- | --- | --- |\n| IMP_Imv | TARGET |\
  \ INTERVAL | PCTL_IMP_Imv | NOMINAL | Quantile(4) |\n| --- | --- | --- | --- | ---\
  \ | --- |\n\n为了查看离散化后 `IMP_Imv` 的新级别，从 `Explore` 选项卡将 `Graph Explore` 节点拖入工作区并连接到\
  \ `Discretization` 节点（见下方）。运行 `Graph Explore` 节点并打开 `Results` 窗口。\n\n图 5.5 显示我们有一个新的四级分类目标变量，该变量由分位数公式决定，如下。\n\
  \n![图 5.5 离散化结果 – 分位数方法。](img/fig5_5.jpg)\n\n图 5.5 离散化结果 – 分位数方法。\n\n* Level 1:\
  \ <19\n* Level 2: 19–22.45\n* Level 3: 22.45–25\n* Level 4: > 25\n\n如你所见，分位数公式将数据分为频率大致相同的四个级别（每个约\
  \ 25%）。现在我们可以将这个新的目标变量作为分类变量用于预测建模。\n\n如果我们把离散化方法改为 `Bucket`（它根据最大值和最小值之间的差将数据划分为等距间隔）并重复该过程，我们将得到一个新的四级分类目标变量，但频率不同（见\
  \ 图 5.6）。\n\n![图 5.6 离散化结果 – 桶方法。](img/fig5_6.jpg)\n\n图 5.6 离散化结果 – 桶方法。\n\n如果我们为了分析目的而将区间变量转换为分类变量，那么离散化是数据挖掘中一种非常有用的方法。SAS\
  \ Enterprise Miner 在 `Transform Variables` 节点中提供了这一工具，使我们能够轻松执行离散化任务而无需任何技术挑战。\n\
  \n## 总结\n\n数据修改是数据挖掘中的一个过程，涉及更改原始数据集以提高其用于预测建模的质量、完整或兼容性。它包含多种技术，如数据清洗、数据转换和数据压缩。在本章中，我们涵盖了三种主要的数据修改技术，包括替换、插补和转换。替换允许我们对数据集进行重新编码、纠正和赋值，通常用于清理和提高数据质量。插补用估计值填充数据集中的缺失值，它为我们提供了完整的数据集并避免了信息丢失。转换是创建现有变量转换的新变量的过程。它可以用于标准化和归一化数据、转换数据或聚合数据。\n\
  \n在本章中，我介绍了多种插补、归一化和离散化方法。正确方法的选择取决于数据集的特定特征、机器学习方法以及数据挖掘项目的目的。这需要仔细考虑对数据产生的潜在影响，例如在插补过程中引入偏差。\n\
  \n\n\n\n\n![](img/shut6_1.jpg)\n在数据挖掘过程中，评估预测模型的性能是非常关重要的。正如之前提到的，并不存在完美的预测模型，任何预测建模都存在存在误差范围。如果我们知道一个模型预测目标变量的效果有多好，就可以决定是否将其用于实际预测，以及我们能够接受的预测误差水平。数据挖掘中的`Model\
  \ performance`(#gloss1.xhtml#d123) 是一直是一项具有挑战性的任务，因为其中涉及许多不同的概念、流程和指标。此外，这些内容在书籍或在线资源中的呈现方式并不一致，这往往会让读者产生困惑。如果我们遵循了错误的流程或使用了不恰的指标，最终可能会得到一个无效的预测模型。这就是为什么我想在开始学习机器学习方法之前，仔细地介绍这个主题。\n\
  \n在本章中，我们重点关注模型性能评估的一些核心概念、评估流程，以及我们应该用于评估模型拟合度的关键指标。如第 2 章 所示，数据挖掘中的常用做法是使用不同的机器学习方法构建多个模型，然后比较它们的性能以选出冠军模型（champion\
  \ model）。在比较模型之前，我们需要确定模型拟合的指标。在这个主题中，有一些可以互换的术语，可能会引起混淆。因此，我为这些术语提供了标准的定义和解释，以及何时使用它们。这种基础性的理解对于选择正确的评估指标和遵循流程至关重要。你需要注意，我们在本章中用于模型评估的指标仅适用于监督学习；即存在预定义的目标变量，而我们的目的是预测这个目标变量。这些指标不适用于无监督学习，因为后者不涉及预测。此外，关联模型（具有连续目标变量）的模型拟合指标与分类模型（具有类别目标变量）的指标是不同的。因此，我们需要注意目标变量的尺度，以便能够选择正确的指标。\n\
  \n## 基本概念\n\n![](img/shut3_2.jpg)在我们深入研究模型评估主题之前，我将在表 6.1 中列出该主题的关键基础概念及其描述。这些概念将帮助你理解在本章中使用的术语。请参考该表。我将详细地描述和解释这些概念，当你需要查阅某个概念的定义时，可以随时返回此表。\n\
  \n表 6.1 模型性能评估的基本概念\n\n| 术语 | 描述 |\n| --- | --- |\n| 模型拟合 (Model fit) | 模型拟合衡量的是模型与数据的拟合程度。\
  \ |\n| 预测能力 (Predictive power) | 预测能力是指模型准确捕捉并代表数据中潜在模式、关系或趋势，并将结果推广到其他数据集的能力。 |\n\
  | 过拟合 (Overfitting) | 过拟合是指模型对训练样本过度训练，而无法泛化到其他数据集。因此，模型是无效且不可用的。 |\n| 模型可靠性 (Model\
  \ reliability) | 模型可靠性是指模型的内部一致性。这意味着模型在使用不同数据集的多次运行时会产生一致的结果。 |\n| 模型有效性 (Model\
  \ validity) | 模型有效性是指模型的准确性。这意味着模型能够一致地产生结果。 |\n| 冠军模型 (Champion model) | 冠军模型是指性能最好的模型。\
  \ |\n| 预测误差 (Prediction errors) | 预测误差是实际值与预测值之间的差异。 |\n| 误差平方和 (SSE) | SSE 衡量未解释的方差。\
  \ |\n| 回归平方和 (SSR) | SSR 衡量已解释的方差。 |\n| 总平方和 (SST) | SST 衡量总方差。 |\n| 均方根误差 (RMSE)\
  \ | RMSE 是实际值与预测值之间的平均差异。 |\n| 平均绝对百分比误差 (MAPE) | MAPE 是百分比差异。 |\n| 相对均方误差 (RSE)\
  \ | RSE 是模型的相对改进程度。 |\n| 解释能力 (EP) | EP 指模型解释变异的能力。 |\n| 实际预测值对比图 (Actual by predicted\
  \ chart) | 实际预测值图对比了实际值与预测值。 |\n| 残差 (Residuals) | 残差是实际值与预测值之间的差异。 |\n| 残差预测值对比图\
  \ (Residual by predicted chart) | 残差预测值图显示了实际值与预测值的接近程度。 |\n| 混淆矩阵 (Confusion matrix)\
  \ | 混淆矩阵也称为分类矩阵，汇总分类算法性能的表格。 |\n| 真正例 (TP) | TP 是正确指示事件存在的预测。 |\n| 真负例 (TN) | TN\
  \ 是正确指示事件不存在的预测。 |\n| 假正 (FP) | FP 是错误指示事件存在的预测。 |\n| 假负 (FN) | FN 是错误指示事件不存在的预测。\
  \ |\n| 误分类率 (MR) | MR 衡量模型误分类预测的频率。 |\n| 预测准确率 (ACC) | ACC 衡量模型预测目标变量的准确程度。 |\n\
  | 灵敏度、召回率或真正率 (TPR) | 灵敏度是正结果出现的概率，或是模型预测真正例的能力。 |\n| 特异性、选择性或真负率 (TNR) | 特异性是负结果出现的概率，或是模型预测真负例的能力。\
  \ |\n| F1 分 (F1-score) | F1 分是灵敏度（召回率）和精确率的调和平均数。 |\n| 受试者工作特征曲线 (ROC) | ROC 图的纵轴显示真正例比例值，横轴显示假正例比例值。\
  \ |\n\n\n\n\n\n| 提升图 (Lift chart) | 提升是预测模型有效性的衡量，计算方法为使用预测模型和不使用预测模型获得的结果之间的比率。提升图或提升曲线（Lift\
  \ curve）展示了提升值与响应率之间的图形化表示。 |\n| 基尼系数 (Gini coefficient) | 基尼系数是模型判别能力的衡量，即模型在区分正负样本方面的有效性。基尼系数衡量了特征不同属性之间正样本率的相等程度。\
  \ |\n| 成本敏感学习 (Cost-sensitive learning) | 成本敏感学习是一种根据误分类成本来评估和选择模型的方法。 |\n| 决策矩阵\
  \ | 决策矩阵是展示误分类成本的表格，包括假阳性成本和假阴性成本。 |\n\n## 模型拟合度与预测能力\n\n![](img/ufig6_1.jpg)首先，让我们澄清一些术语。*模型拟合度*（Model\
  \ fit）和*预测能力*（predictive power）是数据挖掘中常用的两个术语，但它们之间的区别从未被清晰地解释和解决。你可能会注意到，在许多书籍或在线材料中，作者将它们作为互换使用。这些术语确实存在重叠，这可能会引起很大的困惑。模型拟合度更多地用于传统的统计分析，而预测能力则专门用于预测建模语境。预测能力的精确性显然不如模型拟合度，但它是数据挖掘中的一个重要概念。我将根据它们的用途而非度量方式来区分这些术语，因为从这个角度来看存在重叠。\n\
  \n### 模型拟合度\n\n![](img/ufig6_2.jpg)什么是模型拟合度？假设我们有一个模型，用数学表达式、逻辑或规则表示，它展示了目标变量与预测变量之间的关系。因此，该模型可以用来预测目标变量的值。它可以基于理论基础开发，也可以从机器学习算法中得出。我们需要知道这个模型与实际数据的拟合程度；这被称为模型拟合度。模型与实际数据之间的差异在关联模型中被称为残差（residuals），在分类模型中被称为误分类（misclassification）。残差或误分类越低，模型拟合越良好。\n\
  \n模型拟合度通过拟合优指数（goodness-of-fit indices）来衡量，这些指数估计了我们的模型根据预测变量预测目标变量的良好程度。有通用的拟合优指数，适用于所有模型；也有仅适用于特定机器学习方法的独特拟合优指数。例如，我们可以对所有分类模型使用预测准确率、误分类率、敏感性、特异性、提升图和\
  \ ROC 曲线。此外，我们可以对所有关联模型使用均方根误差、平均绝对百分误差和预测值残差图。然而，我们只能使用 F 检验和`R²`来衡量线性回归模型的模型拟合度，并使用\
  \ -2LL 差值和伪 `R²`来衡量逻辑回归模型的模型拟合度。因此，我们需要同时记住通用的模型拟合度指标和特定的模型拟合度指标。当然，通用的模型拟合度指标更常见、使用更广泛，因为并不是所有的机器学习方法都有其特定的指标。\n\
  \n![](img/ufig6_3.jpg)请注意，*拟合优*（goodness-of-fit）一词在其他统计书籍和材料中也会使用。我知道新术语可能会给读者带来进一步的困惑。本质上，拟合优指数是我们用来根据预测变量预测目标变量的特定指标。有通用的拟合优指数，适用于所有模型；也有仅适用于特定机器学习方法的独特拟合优指数。例如，我们可以对所有分类模型使用预测准确率、误分类率、敏感性、特异性、提升图和\
  \ ROC 曲线。此外，我们可以对所有关联模型使用均方根误差、平均绝对百分误差和预测值残差图。然而，我们只能使用 F 检验和`R²`来衡量线性回归模型的模型拟合度，并使用\
  \ -2LL 差值和伪 `R²`来衡量逻辑回归模型的模型拟合度。因此，我们需要同时记住通用的模型拟合度指标和特定的模型拟合度指标。当然，通用的模型拟合度指标更常见、使用更广泛，因为并不是所有的机器学习方法都有其特定的指标。\n\
