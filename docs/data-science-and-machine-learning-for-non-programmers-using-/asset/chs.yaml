  \n### 卡方图和变量价值图\n\n`StatExplore` 窗口还会产生两个对于探索非常有用的图表：\n\n- 卡方图，根据衡量与目标变量关联性的卡方统计对顶级分类变量进行排序（图\
  \ 4.19）。\n- 变量价值图，根据预测目标变量的价值对顶级变量进行排序（图 4.20）。\n\n![图 4.19 卡方图。](img/fig4_19.jpg)\n\
  \n图 4.19 卡方图。\n\n![图 4.20 变量价值图。](img/fig4_20.jpg)\n\n图 4.20 变量价值图。\n\n注意，卡方图仅分类变量，而变量价值图包含了所有变量。SAS\
  \ Enterprise Miner 使用基于决策树方法的价值统计量来计算变量价值。我们将在第 [8 章](#chapter8.xhtml）详细介绍决策树方法。\n\
  \n这两个图都为理解哪些变量可能在预测目标变量（航空公司推荐）中起重要作用提供了初步思路。卡方图显示 `travel purpose`、`airline status`\
  \ 和 `gender` 是重要变量。变量价值图显示 `travel purpose`、`age`、`airline status`、`平均飞行次数` 和 `其他忠诚卡数量`\
  \ 是重要的预测因子之一。我们注意到 `travel purpose` 和 `airline status` 在两个图表中都处于前列位置，因此它们应该被认为是初步的核心预测因子。尽管如此，我们现在不应尝试得出任何结论，因为这些只是初步结果，而且这一步主要是为了探索数据。为了构建一个良好的预测模型，还有很多工作要做，我将在后面的章节中介绍。\n\
  \n\n\n\n数据探索是数据挖掘过程中的一个重要步骤，因为在分析数据之前，我们需要先了解这些数据。数据探索为我们提供了有关变量、模式和趋势的信息，帮助我们决定在建模步骤中使用\
  \ string 哪些变量和哪些方法。我们涵盖了两种数据探索方法：可视化和描述性统计。可视化是探索大数据的流行方法，因为其输出结果易于理解和遵循。我们可以使用多种图表来创建数据可视化，包括条形图、直方图、箱线、饼图、折线图、密度图、散点图和多图。SAS\
  \ Enterprise Miner 具有动态视觉功能，允许我们从不同的角度移动和查看图表。`MultiPlot` 工具为所有变量创建图表，并允许用户在图表之间移动或启动幻灯片。除了可视化，我们还需要查看描述性统计，它们向我们展示所有变量的统计信息，如频率、缺失值、最小值、最大值、标准差、偏度和峰度。此外，`Chi-Square`\
  \ 和变量价值图可以识别潜在的重要预测因子。这些统计结果帮助我们决定数据挖掘过程的下一步，特别是我们是否需要对缺失值进行填充或对数据进行转换。\n\n## 章节讨论问题\n\
  \n1. 什么是数据探索？为什么它在数据挖掘过程中如此重要？\n2. 区分分类变量和间隔变量。\n3. 讨论数据可视化的优势。搜索并描述为大数据提供可视化工具的主要软件应用。\n\
  4. 条形图和直方图的主要区别是什么？我们什么时候应该使用直方图？\n5. 描述箱线图的作用。给出一些例子。\n6. 举例饼图和折线图如何探索数据趋势和模式。\n\
  7. 什么是 `MultiPlot`？`MultiPlot` 功能在工业中的应用有哪些？\n8. 描述间隔变量的主要描述性统计方法。我们如何使用描述性统计来改进数据挖掘？\n\
  \n## 练习\n\n# 5 数据修改\n\nDOI: [10.1201/9781003162872-6](https://doi.org/10.1201/9781003162872-6)\n\
  \n## 引言\n\n![](img/shut5_1.jpg)在上章节中，我们讨论了如何使用数据可视化来展示数据的模式和趋势。此外，描述性统计结果还为我们提供了每个变量的详细特征。因此，我们能够评估数据中已有的信息以及缺失的信息。我们还可以识别任何错误信息、数据中的噪声以及任何可能影响建模过程的其他疑虑。如果我们发现数据存在问题怎么办？简单的答案是，在建模步骤之前，必须解决数据质量的任何疑虑。\n\
  \n本章侧重于 SEMMA 过程的下一步：`Modify`（修改）。具体来说，我们将涵盖数据修改之所以重要的原因，以及我们可以用来准备和修改数据的技术。主要主题包括替换、填充和转换。我将向你展示如何如何使用\
  \ SAS Enterprise Miner 进行数据修改。请记住，我们的预测模型的好坏取决于我们用于训练它们的数据质量。准备和转换数据使我们能够解决任何数据质量问题，并产生有效且准确的预测模型。\n\
  \n## 数据修改的重要性\n\n![](img/ufig5_1.jpg)数据修改（也称为数据预处理）是机器学习中的一个关键步骤，它涉及对原始数据进行准备和转换，使其适用于训练我们的预测模型。数据修改的目标是提高数据的质量和相关性，从而使我们能够进行更稳健的模型训练。结果是我们可以获得更准确、实用的预测模型。\n\
  \n数据修改在数据挖掘中重要的原因有很多。以下是一些关键点：\n\n1. **提高数据质量**：数据修改技术（如数据清洗和替换）有助于提高数据集的质量。通过识别和纠正错误、不一致和缺失值，我们可以增强数据质量。高质量的数据对于有效可靠的预测建模至关重要，因为它减少了误导或无效结果的风险。记住，“垃圾进，垃圾出”。\n\
  2. **减少噪声**：原始数据通常包含噪声或无关信息，这些会对预测模型的准确性产生负面影响。通过使用异常值检测和数据替换等技术，我们可以有效减少噪声数据点的影响，产生可靠有效的模型。\n\
  3. **处理缺失数据**：在现实世界的数据集中，由于数据收集的原因，缺失数据是一个常见问题。填充技术通过用估计值填补空白来帮助处理缺失数据。妥善处理缺失数据可确保分析过程中不会丢失价值信息。\n\
  4. **变量选择和降维**：这些技术有助于识别用于分析的相关变量。移除无关或冗余变量可以降低数据的复杂性，提高计算效率并改进模型性能。\n5. 归一化和标准化：这些技术确保不同变量处于可比较的范围内。在应用对数据尺度敏感的算法时，这尤为有用。对数据进行归一化和标准化可以实现公平比较并防止某些特征主导分析。对于某些机器学习算法，标准化数据可以提高模型拟合度。\n\
  6. **处理异构数据**：在许多情况下，来自不同来源或不同格式的数据需要合并分析。数据整合和聚合等数据修改技术允许统一异构数据。这种整合提供了更全面的视角，有助于发现隐藏在单个数据集中的价值模式。\n\
  7. **为特定算法准备数据**：不同的机器学习算法对输入数据有特定的要求和假设。数据修改有助于准备符合这些要求的数据。例如，对于分类输入的算法，可能需要离散化，而归一化是多元回归方法的一个重要假设。\n\
  \n总体，数据修改在数据挖掘中至关重要，因为它有助于确保预测建模的准确性、可靠的效率。通过增强数据质量、减少噪声、处理缺失数据、选择相关特征以及为特定算法准备数据，数据修改技术使我们能够产生有效且准确的预测模型。\n\
  \n## 数据修改技术\n\n![](img/icon_4.jpg)有许多不同的技术可以修改数据。它们可以分为三大类，如下：\n\n* **数据清洗**：数据清洗是识别并纠正数据错误的过程。可以通过识别并删除重复数据、纠正拼写错误和填充缺失数据来实现。\n\
  * **数据转换**：数据转换是更改数据格式或结构的过程。我们可以进行的若干转换实践包括将分类数据转换为数值数据、归一化数据以及聚合数据。\n\n\n\n\n\
  - **数据削减**：数据削减涉及在不丢失重要信息的情况下缩小数据规模。我们可以使用降维、变量选择和采样等任务的技巧。\n\n数据修改是数据挖掘的一个重要组成部分。这是一个需要仔细规划和执行的复杂过程。然而，数据修改带来的收益是非常显著的，包括提高数据挖掘结果的准确性、效率和可解释性。当我们执行数据修改时，有几个重要的点需要考虑，如下所示：\n\
  \n- **使用多种技术**：没有一种单一的技术能够适用于所有数据集。使用多种技术来确保数据得到适当修改是非常重要的。\n- **注意不要过拟合数据**：当数据修改过程过于激进，导致数据不再代表目标总体时，就会发生过拟合。这会导致数据挖掘结果不准确。\n\
  - **测试结果**：对数据修改过程的结果进行测试以确保其准确性和有用性。交叉验证是实现此目的的一种有效技术。\n\n![](img/ufig5_2.jpg)\n\
  在本章中，我并没有涵盖所有的数据修改技术。采样和重采样技术已在第 3 章中深入介绍。此外，降维方法将在后面的第 12 章和第 13 章中介绍，届我们将讨论包括主成分分析和聚类分析在内的无监督方法。本章专注于数据修改中的常用技术，包括数据清洗和转换。具体而言，我们涵盖了三种主要技术：替换、填充和转换。这将解释它们的区别以及我们何时使用哪种技术。我认为这些技术易于使用，在大多数项目中非常有用。这些技术在\
  \ SAS Enterprise Miner 中可用，因此我们将介绍一些使用该软件实现这些技术的具体示例。\n\n## 替换、填充和转换\n\n![](img/icon_5.jpg)如上所述，在本书中，我们涵盖了\
  \ SAS Enterprise Miner 中提供的三种主要数据修改技术：替换、填充和转换。这些技术作为“修改（Modify）”组中的独立节点提供。表 5.1\
  \ 总结了它们之间的区别以及使用时机。\n\n表 5.1 替换、填充和转换\n\n| || | 替换 | 填充 | 转换 |\n| --- | --- | ---\
  \ | --- |\n| 作用是什么？ | 对数据中的分类或区间变量进行重新编码、纠正或重新赋值。 | 用估计值替换数据集中的缺失值。 | 创建数据集中现有变量转换的新变量，或创建交互变量。它可以用于标准化和归一化数据、转换数据或聚合数据。\
  \ |\n| --- | --- | --- | --- |\n| 何时使用此工具？ | 替换节点应在填充节点之前。 | 填充节点应在转换节点之前。 | 转换节点应在模型（Model）步骤中的中的机器学习算法节点之前。\
  \ |\n\n- **替换节点 (Replacement node)**：替换技术允许我们通过重新编码或纠正数据来清洗数据，以确保分析的准确性。在数据挖掘领域，替换通常被认为是数据转换的一部分。在本书中，我们将替换与转换分开以避免混淆，因为我们需要在处理缺失值和转换变量之前，使用替换来清洗数据或重新赋值。`Replacement\
  \ node` 应该在 `Impute node` 之前，以便我们拥有缺失值的正确信息和代码。\n- **填充节点 (Impute node)**：填充是处理缺失值的常用技术。当我们有缺失值时，第一直觉是删除它们。然而，删除缺失值可能会导致重要信息的丢失，甚至可能增加数据中的偏差。因此，研究人员倾向于用估计值来填充缺失值。挑战在于确定合适的填充方法以确保数据质量并避免产生偏差。`Imputation\
  \ node` 应该在 `Transformation node` 之前，以便转换时拥有所有的数据点。\n- **转换节点 (Transformation node)**：这种技术允许我们更改数据的格式或结构以满足数据分析的要求。我们可以用它转换数据、归一化数据或聚合数据。某些机器学习算法在标准化和归一化的数据上运行得，例如线性回归。在这种情况下，当某个变量的数据分布不呈正态时，可以使用这种技术将数据转换为正态分布数据。此外，在其他情况下，我们可能希望将连续变量转换为分类变量，或者为了分析目的将两个变量合并为一个。`Transformation\
  \ node` 允许我们毫不困难地完成这些任务。`Transformation node` 应该在模型步骤中的机器学习算法节点之前，以确保我们有训练模型所需的数据。\n\
  \n## 数据修改的优缺点\n\n![](img/icon_8.jpg)数据修改是数据挖掘过程中的重要步骤，具有许多益处。然而，在应用这些技术时，我们可能面临一些挑战。在本节中，我们将讨论数据修改的主要优缺点。\n\
  \n### 优点\n\n1. **提高数据质量**：数据清洗增强了数据集的质量和可靠性。它们通过处理错误、不性和缺失值来提高数据质量，从而获得更准确、可靠的结果。\n\
  2. **增强模型性能**：降维和数据转换是识别模型训练中最相关且信息丰富的变量的有用技术。这些技术允许我们减少无关或冗余的特征，并创建新的意义变量，从而提高模型性能，获得更好的预测准确性和泛化能力。\n\
  3. **处理缺失数据**：数据填充确保分析过程中不会丢失价值信息，减少潜在偏差，并提高数据的代表性。\n4. **高效计算**：降维和数据采样等技术可以显著减少分析的计算复杂度。它们有助于减少变量数量或数据集大小，从而缩短机器学习模型的训练时间。\n\
  5. **解决数据不平衡**：数据采样技术（包括过采样和欠采样）有助于解决某一类别显著不足的数据不平衡问题。通过重新平衡类别分布，可以提高模型在少数类上的性能，获得更准确的预测。\n\
  \n### 缺点\n\n1. **信息丢失**：更改数据可能会导致信息丢失，因为删除某些变量或降低数据维度可能会丢弃对分析有用的价值信息。\n2. **过拟合风险**：过采样可能会引入合成或重复的实例，导致过拟合。过拟合发生于模型在训练数据上表现良好但无法泛化到新的未见数据上。\n\
  3. **主观性与偏差**：数据修改通常涉及在处理缺失值、离群值或特征选择时做出主观决策。如果处理不当，这些决策可能会为分析引入偏差，可能影响结果的有效性。\n\
  \n\n\n\n\n### 4. 复杂性增加\n数据修改技术为数据预处理阶段增加了复杂性，需要额外的时间和精力。选择合适的技术并优化其参数可能具有挑战性，特别是对于大型复杂数据集而言。\n\
  \n### 5. 对假设的敏感性\n某些数据修改技术（如 `imputation` 或 `transformation`）依赖于对数据分布或关系的某些假设。如果违反了这些假设，修改后的数据可能无法准确表示底层模式，导致结果产生偏差。\n\
  \n在特定项目和数据集的背景下，仔细考虑数据修改技术的优缺点至关重要。技术的选择应该根据研究目的、分析的要求和局限性，以及对对数据特征的深入理解来指导。\n\n\
  ## 替换 (Replacement)\n\n![](img/icon_9.jpg)如前所述，替换是一种数据清洗的有用数据修改技术。我们可以通过为某些变量重新分配值，来移除数据集中的错误信息或纠正错误，从而确保数据的准确性。SAS\
  \ Enterprise Miner 有一个用于此工具的专用节点。我在下面列出了一些我们必须使用 `Replacement` 节点来清理数据的典型场景。\n\n\
  *   ![](img/ufig5_3.jpg) **删除错误信息**：我们倾向于假设收集到的数据总是正确的。然而，你可能会惊讶地发现，由于数据采集工具的缺陷、数据采集过程或参与者的输入错误，数据集往往包含错误。我们可以在探索步骤中，通过使用变量的可视化和描述性统计来检查数据，从而检测这些错误，如第\
  \ 4 章所示。例如，当在使用直方图探索年龄数据时，我们注意到有一些年龄为零的情况。显然，这些是错误信息，因为年龄不能为零。同样，尽管数据描述明确指出只调查了成年人，我们仍可能看到年龄小于\
  \ 18 岁的情况。出现这种情况有几个原因：首先，参与者错误输入的年龄信息，导致其无法用于分析；其次，这是一个缺失值（参与者决定留白），被软件或问卷工具编码为零。无论何种情况，我们都应该将这些值视为缺失值而非零，以避免误读数据。使用\
  \ `Replacement` 节点，我们可以移除错误信息，软件将把这些值视为缺失数据。\n\n*   **纠正错误**：在某些情况下，当错误信息非常明显时，我们可以对数据集进行纠正。例如，在使用直方图探索收入信息时，我们发现了几个薪资为负的情况。假设在检查问卷后，我们发现薪资在本应为正数时被错误地输入为负值。这种错误信息会导致建模步骤出现错误的预测。在这种情况下，我们可以使用\
  \ `Replacement` 节点通过删除负号来纠正错误。另一个例子是分类变量中出现的拼写错误，这创建了几个新级别并导致了误导信息。例如，由于拼写错误，职位名称“Manaer”应该与“Manager”视为相同，但软件认为它们是两个类别。使用\
  \ `Replacement` 节点，我们可以对此类数据进行纠正。\n\n*   **重新分配值**：`Replacement` 节点的一个常见应用是重新分配缺失值。你可能会惊讶地发现，数据提供者对缺失值的编码方式非常不同，取决于他们收集数据的方式或用于存档数据的标准。我见过缺失值被编码为空白、零或\
  \ 9。这些都是可以使用 `Replacement` 节点清理数据的典型场景。\n\n## 缺失值插补 (Imputation for Missing Values)\n\
  \n![](img/icon_9.jpg)在数据挖掘中，缺失值是指某些变量数据的缺失或缺乏。缺失值可能由于多种原因产生，例如数据错误、数据不完整。根据数据集的不同，缺失值可以用不同的方式表示：\n\
  \n*   空白单元格：在大多数数据集中，缺失值通常由空白单元格表示。这些单元格对于相应的变量没有值或信息。\n\n*   Null 或 NA 值：某些数据集使用特定的代码或标记（如\
  \ `null` 或 `NA`）来指示缺失值。这些代码通常被分配用于数据的缺失。\n\n*   占位符值：在某些情况下，缺失值可能使用与有效值不同的占位符值表示。例如，使用\
  \ `-1` 或 `9999` 来表示数值变量中的缺失值。SAS Enterprise Miner 使用 `.` 来表示缺失值。\n\n\n\n\n为了缓解这些问题，必须应用适当的技术来处理缺失值，例如插补（用估计值替换缺失值）或排除（删除缺失率过高的观测值或变量）。技术的选择取决于特定数据集、缺失数据的性质以及项目目的。可以使用\
  \ `Replacement` 节点来删除缺失值。挑战在于决定删除操作是否会导致预测建模中出现任何服务器端问题。我将重点介绍插补，这是处理缺失值最常用的策略。\n\
  \n![](img/ufig5_6.jpg)\n\n基本上，插补是一个使用估计值对数据集中的缺失值进行估计或填充的过程。这是一种用于处理具有缺失值数据的技术，确保数据集在进行进一步分析之前是完整的。插补方法有很多种。当我们决定用用（或选择）插补方法时，有以下几个重要的考虑因素。\n\
  \n- 插补方法的选择应由数据集的特征、缺失数据的性质和分析目的来指导。不同的方法有不同的假设，并可能导致不同的结果。\n- 插补会给数据集引入不确定性，因为填充的值是基于可用数据估算的。在执行后续建模时，考虑到这种不确定性至关重要。\n\
  - 实施插补时应谨慎，因为如果缺失数据不是完全随机的，可能会引入偏倚。这意味着数据数据背后可能有某些特定原因，使其成为系统性缺失而非随机缺失。理解数据缺失的原因并考虑插补值中的潜在偏倚至关重要。\n\
  - 记录插补过程是一个良好的做法，包括所使用的方法和所做的任何假设，以确保分析的透明和可重复性。\n\n![](img/ufig5_7.jpg)总体而言，插补是数据修改中广泛使用的技术，用于处理缺失值并确保数据集的完整性。插补方法的选择应该根据缺失数据的特征和分析目的进行仔细考虑。理解与插补相关的局限性和潜在偏倚非常重要。表\
  \ 5.2 显示了一些常见的插补方法及其特征。对于每种方法，我包含了简要描述、假设、插补值是如何计算的以及我们何时可以使用这种方法。你不需要担心计算这些值，因为软件会自动完成这项任务。但我们需要知道何时使用哪种方法。注意，这些方法主要用于区间尺度变量，因为它们需要定量计算。由于分类变量的非度量性质，分类变量的插补方法非常有限。\n\
  \n### 表 5.2 常见插补方法\n\n| 插补方法 | 描述 | 使用时机 |\n| --- | --- | --- |\n| 均值 (Mean) | 用可用值的平均值替换缺失值。假设缺失值与观测值的平均值相似。`Imputed\
  \ value = Mean (available data)` | `用于区间变量。“对于正态分布且包含少量缺失值的数据集，这是一个很好的选择。 |\n| 中位数\
  \ (Median) | 用可用值的位数替换缺失值。与均值插补相比，它对离群值不敏感。`Imputed value = Median (available data)`\
  \ | `用于区间和顺序变量。“对于非正态分布（偏态）且包含少量缺失值的数据集，这是一个很好的选择。对于顺序数据也是一个很好的选择。 |\n| 全差范围 (Mid-range)\
  \ | 用该变量可用数据的最小值和最大值的中点替换缺失值。全差范围是中心趋势的一种粗略测量。`Imputed value = (max + min)/2` |\
  \ `用于区间变量。“对于正态分布的数据集，这是一个很好的选择。 |\n| 分布 (Distribution) | 使用数据的分布来填充缺失值。这种方法基于这样一个假设：缺失值是随机分布的，并且可以从观测数据的值中估计。估计值根据非缺失观测值的概率分布来确定。\
  \ | `用于区间和分类变量。“如果缺失值是随机分布的，这是一个很好的选择。这种方法通常不会显著改变数据的分布。 |\n| 基于树的方法 (Tree-based)\
  \ | 也称为预测均值匹配，使用决策树来插补数据集中的缺失值。它对于插补同时具有连续和分类数据类型的变量中的缺失值特别有用。由于每个输入变量的插补值依赖于其他输入变量的值，与直接用变量的均值或中位数替换缺失值相比，这种插补方法可能提供更高的准确性。\
  \ | `用于区间和分类变量。“这种方法应用于非线性关系或多次插补（当创建多个插补数据集时）。` |\n| 带有代理分裂的树插补 (Tree imputation\
  \ with surrogate split) | 是基于树插补的扩展，在插补缺失值时结合代理变量。代理分裂是在决策树中创建的额外划分规则，用于处理预测变量中的缺失值。\
  \ | `用于区间和分类变量。“如果我们具有高缺失率、预测变量之间存在复杂的依赖关系或交互作用，这种方法是一个很好的选择。` |\n| 中最小间距 (Mid-minimum\
  \ spacing) | 使用观测数据的中位数和最小值来插补缺失值。它指定了包含在间距的数据比例。它假设缺失值将落在相邻最小值定义的范围内。计算此统计量有两个步骤：(1)\
  \ 使用 `N` 百比的数据（例如 10%）修剪数据；(2) 中最小间距值的计算方法为修剪后数据的最大值加最小值除以二。`Imputed value = [max(trimmed\
  \ data) + min(trimmed data)]/2` ![](img/tab5_2a.jpg) | `用于区间变量。“当时间序列中的最小值具有实际意义或代表某种下限时，它是很有用的。`\
  \ |\n| 稳健 M 估计器 (Robust M-estimators of location) | 稳健 M 估计器是用于估计 a 中心位置或位置参数的统计估计量。它们对离群值不敏感。主要的\
  \ M 估计器有：(1) 土耳双权重 (Turkey's Biweight)；(2) 鲁伯 (Huber)；(3) 安德鲁斯波 (Andrew's Wave)。![](img/tab5_2b.jpg)\
  \ | `用于区间变量。“在处理包含离群值或与大多数数据显著偏离的数据时，它们非常有用。` |\n\n## 归一化 (Normalization)\n\n\n\n\
  \n\n![](img/ufig5_9.jpg)数据归一化，也称为变量缩放，是机器学习中的预处理步骤，将数据集的变量转换为相似的范围。它是最流行的转换技术之一。首先，让我们讨论未归一化数据与归一化数据之间的区别，以及为什么在某些情况下对数据进行归一化。表\
  \ 5.3 展示了未归一化数据与归一化数据之间的差异。图 5.1 利用散点图和直方图说明了这些差异。\n\n### 表 5.3 归一化数据与未归一化数据\n\n\
  | 项目 | 未归一化数据 | 归一化数据 |\n| --- | --- | --- |\n| 范围 | 未归一化的数据在不同变量之间可能有不同的范围。值的跨度很大，使得难以直接进行比较或解释。\
  \ | 归一化数据被转换为具有一致的范围。它们通常落在一个预定义的范围内，例如 `[0, 1]` 或 `[−1, 1]`，使得更容易跨特征比较值。 |\n| 偏偏差\
  \ | 未归一化的数据可能会因为范围的固有差异而表现出偏差。值较大的变量可能会主导分析或对模型产生不成比例的影响。 | 归一化有助于消除由不同范围引起的偏差。通过缩放数据，所有变量对建模过程的贡献更加均衡。\
  \ |\n| 离群值 | 未归一化数据中的离群值会对整个建模过程产生显著影响。 | 根据所使用的归一化方法，离群值对整体数据表示的影响较小。某些归一化技术（如\
  \ `robust scaling`）可以更有效地处理离群值。 |\n| 解释 | 解释未归一化数据的幅度可能具有挑战，因为每个变量的范围不同。 | 归一化数据允许更直观的解释和比较。值被转换为标准范围，能够根据相对大小进行比较和评估。\
  \ |\n\n![图 5.1 未归一化数据和归一化数据。](img/fig5_1.jpg)\n\n### 图 5.1 未归一化数据和归一化数据。\n\n![](img/icon_8.jpg)数据归一化在数据挖掘中提供了巨大的收益，但也带来了一些挑战。以下是数据归一化的的一些主要优缺点。\n\
  \n### 优点\n*   提高机器学习算法的性能：通过将数据带入一致的范围，归一化防止某些变量主导其他变量，并确保所有变量对学习过程的贡献相等。\n*   减轻离群值的影响：数据归一化可以通过缩放数据来减少离群值的影响，使其对极端值不敏感。\n\
  *   简化解释和可视化：数据归一化允许对数据进行更更容易的解释和可视化。当数据被缩放到公共范围时，模式和趋势会变得更加明显，比较和理解不同变量也变得更简单。\n\
  *   加速优化算法的收敛：某些机器学习方法需要搜索优化。优化算法在处理归一化后的数据时可以收敛得更快。\n\n### 缺点\n*   丢失原始数据分布：归一化改变了数据的原始分布，将其压缩或拉伸以适应特定的范围。这可能会导致某些关于数据分布的信息丢失，而这些信息在某些分析场景中可能是相关的。\n\
  *   增加解释的复杂性：虽然归一化在某些情况下可以简化解释，但也可能引入复杂性。转换后的值需要转换回原始比例以便有意义的解释，这可能是挑战性的，特别是当处理多种归一化技术或复杂的数据转换时。\n\
  *   归一化过程中对离群值的敏感性：尽管归一化有助于减轻离群值的影响，但某些归一化技术（如 `min-max normalization`）对极端值敏感。离群值会不成比例地影响归一化数据，导致潜在的失真或信息丢失。\n\
  *   特定特定的考量：数据归一化的适用性取决于特定的数据和机器学习方法。在某些情况下，为了有意义的解释或与某些算法兼容，可能需要保持数据的原始比例。应该根据数据的需求、特征以及预期的建模技术来仔细评估归一化。\n\
  \n表 5.4 给出了常见的数据归一化方法。在选择归一化方法时，我们必须考虑几个因素。\n\n### 表 5.4 常见的数据归一化方法及使用场景\n\n| 归一化方法\
  \ | 描述 | 使用场景 |\n| --- | --- | --- |\n| Min-Max 归一化（也称为重缩放） | 公式:$X' = \\frac{X\
  \ - X_{min}}{X_{max} - X_{min}}$范围：`[0, 1]` | 当你想将数据缩放到特定范围时，特别是当已知分布是有边界的。 |\n\
  | Z-score 归一化（也称为标准化）： | 公式:$X^{'} = \\frac{X - X_{mean}}{SD}$ | 当你想将数据标准化为均值为 0、标准差\
  \ (SD) 为 1 时。这种方法通常用于分布未知或不符合正态分布的数据。 |\n| 稳健缩放（也称为位数和 MAD 缩放）： | 公式:$X^{'} = \\\
  frac{X - X_{median}}{MAD}$ | 当你有具有离群值或偏态分布的数据，并且你想根据位数和中位绝对偏差 (MAD)而不是平均值和标准差来缩放数据时。\
  \ |\n| 对数转换： | 公式:$X^′ = log(X)$ | 当数据高度偏斜或包含指数增长时，应用对数转换有助于规范分布。 |\n| 幂转换： | 公式:$X^′ = X^n$\
  \ | 当数据具有特定的幂律关系时，幂转换有助于规范分布。常见的幂值包括：`n = 0.5`（平方根）、`n = 2`（平方）和 `n = −1`（倒数）。 |\n\
  \n*   归一化的目的：你是为了提高机器学习模型的性能而对数据进行归一化吗？还是为了更容易可视化或解释？\n*   你处理的数据类型：你处理的是数值数据还是类别数据？注意，归一化仅适用于间隔变量。\n\
  *   数据集的大小：如果你有一个大型数据集，可能需要使用更高效的归一化方法。\n*   你使用的算法：某些算法（如 K 近邻和人工神经网络）对数据的尺度敏感度比其他算法更高。此外，线性回归对于正态分布的数据效果最好。如果你正在使用这些算法，那么你应该使用归一化来确保所有变量都在同一尺度上。\n\
  \n![](img/ufig5_10.jpg)\n\n## 变量离散化\n\n\n\n\n\n![](img/ufig5_11.jpg)`变量离散化`(#gloss1.xhtml#d227)是将连续变量转换为分类变量的过程。在数据挖掘中，当你想要将一个具有连续刻度的变量转换为离散类别时，这是一个常见的预处理步骤。如前，为了确保一致性，我将使用`间隔变量`（interval\
  \ variable）这一术语。这种转换在某些场景下非常有用，例如当你想捕捉非线性关系，或者当特定的数据挖掘算法需要将原始变量视为分类变量时。图 5.2 说明了离散化的概念。输入是连续变量，输出是具有离散层级的分类变量。\n\
  \n![图 5.2 数据离散化。](img/fig5_2.jpg)\n\n图 5.2 数据离散化。\n\n将间隔变量转换为分类变量通用方法描述如下：\n\n1.\
  \ **确定类别的数量和范围**：决定你想要为新变量创建的类别或组的数量。这个数字代表了分类变量所需的层级。这一决策可能取决于特定数据集、变量的性质以及分析目的。你也可以考虑使用领域知识或统计技术来指导你的决策。\n\
  2. **划分数值范围**：将间隔变量的值范围划分为不同的区间或箱（bins）。每个箱代表一个类别或层级。区间的定义方式应当能够捕捉数据中有意义的区别，同时在类别数量与每个类别包含的信息之间保持平衡。\n\
  3. **为数据点分配类别**：根据数据值落在定义的区间，将原始间隔变量的每个数据点映射到其对应的类别。这种映射可以通过 `if-else` 语句、数学函数或数据挖掘软件中的专用函数来实现。\n\
  4. **将类别编码为新的分类变量**：一旦数据点被分配到类别，将每个类别表示为新分类变量的一个独立层级。这一步可以根据软件的不同有不同的方式。\n\n例如，考虑将间隔变量\
  \ `age`（年龄）转换为分类变量。我们根据特定的年龄范围定义如 `young`（年轻）、`middle-aged`（中年）和 `elderly`（老年）等类别。根据预定义的这些箱范围创建三个不同的箱。然后，将连续的年龄值相应分配给这些箱。最后，创建新的分类变量（我们称之为\
  \ `r_age`），并编码为三个级别：`young`、`middle-aged` 和 `elderly`。\n\n需要注意的是，将间隔变量转换为分类变量会通过数据的离散化导致某些信息的丢失。此外，选择的具体方法和类别数量可能会影响数据挖掘的结果。我强烈建议尝试不同的分类方案，并评估它们对模型性能的影响。\n\
  \n表 5.5 描述了变量离散化的常用方法。方法的选择取决于数据的特征和分析目的。我了何时使用何种方法以供参考。\n\n表 5.5 变量离散化方法及适用场景\n\
  \n| 离散化方法 || 说明 || 适用场景 |\n| --- | --- | --- |\n| 等宽/分箱（等宽分箱） | 该方法将间隔变量的范围划分为预定数量的箱，并根据值所在的箱分配标签。\
  \ | 当你想在不考虑分布的情况下进行简单的离散化时。这种方法对异常值不敏感。 |\n| 分位数/分箱（等频分箱） | 该方法将数据划分为大小相同的子集，以确保每个箱包含相同数量的数据点。\
  \ | 当你想让数据代表均匀时。这种方法对倾斜数据很有帮助，但可能导致大小不一。 |\n| 聚类 | 该方法应用如 `k-means` 等算法将相似的值归类，然后根据相似性分配标签。\
  \ | 当你想让数据自己决定边界时。 |\n| 领域特定阈值 | 该方法根据领域知识或特定需求定义阈值，并根据这些阈值分配标签。 | 当领域已有成熟的阈值或标准时。\
  \ |\n\n## 使用 SAS Miner 修改数据的示例\n\n### 航空公司推荐数据集\n\n![](img/icon_10.jpg)第一个示例是`airline\
  \ recommendation`（航空公司推荐）数据集。对于该数据集，我们使用 SAS Miner 中的两个修改工具：`Replace node`（替换节点）和\
  \ `Impute node`（插补节点）。\n\n在执行这些修改任务之前，探索数据查看存在什么问题是非常重要的。通过使用第四章所述的 `Explore node`（探索节点），我们可以获取变量所需的描述性统计。由于该数据集包含两组变量（间隔变量和分类变量），我分别在表\
  \ 5.6 和 5.7 中展示它们的描述性统计。注意，我没有提供像第四章那样的完整描述性统计，因为在这一步中，我们关注的是缺失值和数据的任何问题。结果显示分类变量没有缺失值（表\
  \ 5.6）。因此，这些变量没有问题。然而 5.7 显示三个间隔变量存在缺失：`arrival delay time`（到达延迟）、`departure delay\
  \ time`（出发延迟）和 `flight time`（飞行时间）。此外，我们还注意到 `price sensitivity`（价格敏感度）存在问题。如第四章所示，该变量使用范围从\
  \ 1 到 5 的 Likert 量表。但统计结果显示该变量最小值为 0，这不符合逻辑。该问题的有效原因是 0 被用于编码缺失值。由于 SAS Enterprise\
  \ Miner 使用空格或点来表示缺失值，它可能会将该变量的零误判为实际零值。这种错误信息将导致无效的预测建模结果。因此，我们需要使用 `Replacement\
  \ node` 正确编码这些缺失值进行纠正。之后，我们使用 `Impute node` 处理该数据集的缺失值。\n\n表 5.6 分类变量简要描述性统计\n\n\
