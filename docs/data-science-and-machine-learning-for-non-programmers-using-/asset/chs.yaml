  \ `CHAID` 使用多分划分，一个节点可以被拆分为两个以上的分支。\n10. 这两种树各有优缺点。需要注意的是，它们可以用于构建关联模型或分类模型。它们也可以适用于连续型或分类型预测变量。\n\
