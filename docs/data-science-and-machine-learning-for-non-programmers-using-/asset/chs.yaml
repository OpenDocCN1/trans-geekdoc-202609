  \ TICKETS | gender | MALE | 0.43362832 |\n\n再次，`CPT` 的目的是编码贝叶斯网络中变量之间的条件依赖和概率，从而能够在网络结构内进行概率推理、推断和预测。与每个节点关联的表格指定了变量在其父节点各种状态的条件下，取不同值的概率。\n\
  \n例如，如果我们想解释目标变量 `recommendation`（推荐），我们需要关注其两个父节点 `airline status`（航空公司状态）和 `travel\
  \ purpose`（旅行目的）的影响。根据 `CPT`，我们可以得出以下结论：\n\n- 如果 `airline status` = `BLUE`，那么概率\
  \ (`recommendation` = `YES`) = `0.6518`。\n- 如果 `airline status` = `GOLD`，那么概率 (`recommendation`\
  \ = `YES`) = `0.6420`。\n- 如果 `travel purpose` = `BUSINESS TRAVEL`，那么概率 (`recommendation`\
  \ = `YES`) = `0.6518`。\n- 如果 `travel purpose` = `PERSONAL TRAVEL`，那么概率 (`recommendation`\
  \ = `YES`) = `0.1218`。\n- 等此类推。\n\n我们使用相同的过程来解释其他变量的关系。\n\n## 贝叶斯网络中的变量重要性\n\n![](img/ufig16_7.jpg)\
  \ 贝叶斯网络中的变量重要性通常通过检查与网络中每个节点相关的条件概率分布来确定。对于给定的目标变量，条件概率较高的节点可能被认为更重要，因为它们对预测目标变量的影响。此外，可以将敏感性分析和概率推断技术应用于贝叶斯网络，以评估预测变量概率的变化如何传播并影响最终结果，进一步有助于理解变量重要性。\n\
  \n由于 `SAS Enterprise Miner` 中的 `HP BN Classifier` 节点不产生变量重要性表或图表，我们可以使用第 9 章中引入的方法来实现变量重要性图。基本上，通过使用\
  \ `Score` 节点和 `Reporter` 节点，软件可以生成预测，模拟变量对目标变量的影响并产生变量重要性图。\n\n按照以下步骤操作：\n\n1. 从\
  \ `Assess` 选项卡将 `Score` 节点拖到工作区，并将其连接到 `HP BN Classifier – Default` 节点。\n2. 从 `Utility`\
  \ 选项卡将 `Reporter` 节点拖到工作区，并将其连接到 `Score` 节点。\n3. 保留 `Score` 节点的所有默认设置。\n4. 在 `Reporter\
  \ Train` 属性中：\n    - 将 `Nodes` 设置为 `Summary`。\n    - 将 `Show All` 设置为 `Yes`。\n \
  \   - 在 `Summary Report Options` 下，将所有选项都设置为 `Yes`。\n5. 运行 `Reporter` 节点并打开 `Results`（结果）。\n\
  \n此节点创建一个 PDF 格式的报告。点击 `View` 打开报告。变量重要性图包含在此报告中。图 16.9 显示了我从报告中提取的 `HP BN Classifier\
  \ – Default` 重要性表。结果显示 `travel purpose` 是最重要的预测变量，其次是 `age, airline status` 和 `gender`。你可以看到，前三个因素的排名与我们在其他模型中得到的相同。\n\
  \n![图 16.9 变量重要性图](img/fig16_9.jpg)\n\n图 16.9 变量重要性图。\n\n## 总结\n\n贝叶斯网络方法是建模不确定复杂系统的一种强大且广泛的方法。它是一种概率图形模型，使用有向无环图（DAG）表示变量之间的依赖关系。每个节点代表随机变量，节点之间的有向边表示因果关系。该方法利用贝叶斯定理进行概率推断，根据观测数据计算变量的后验概率。在数据挖掘中，贝叶斯网络被应用于多个领域，包括医疗保健、金融、生物和工程。它们在处理缺失数据和噪声特征方面非常有效，使其在现实场景中具有稳健性。\n\
  \n构建贝叶斯网络的过程涉及从数据学习学习结构和估计 `CPTs`。结构学习涉及使用基于评分或基于约束的算法探索可能的网络结构空间，以识别变量之间的条件独立性。获得网络结构后，使用极大似然或贝叶斯参数估计进行参数估计。\n\
  \n## 章节讨论\n\n1. 区分相关性和因果关系。给出具体的真实世界例子。\n2. 什么是贝叶斯网络方法？解释贝叶斯网络的原理。\n3. 与其它机器学习方法相比，贝叶斯网络的主要优势有哪些？\n\
  4. 贝叶斯网络中引入概率推理和不确定性建模如何有利于决策和预测任务？\n5. 解释从数据学习贝叶斯网络结构和参数的过程。\n6. 学习网络结构的不同算法有哪些？解释它们的相同点和不同点。\n\
  7. 讨论贝叶斯网络方法的挑战或局限性。\n8. 贝叶斯网络结构的四种主要类型是什么？解释它们的相同点和不同点。\n9. 什么是频率派统计？比较贝叶斯方法和频率派方法。\n\
  10. 什么是因果推断？我们可以使用贝叶斯网络推断因果关系吗？为什么？\n11. 定义因果数据挖掘。提供因果数据挖掘项目的实例。\n12. 描述 USELEI\
  \ 过程。与 SEMMA 和 CRISP-DM 进行比较。何时使用 USELEI？\n\n## 练习\n\n# 术语定义\n\n激活函数：\n\n: 激活函数根据输入的加权和确定神经元的输出。常见的激活函数包括\
  \ `sigmoid`、`ReLU`（修正线性单元）和 `tanh`（双曲正切）。\n\n实际预测图：\n\n: 实际预测图通过比较实际值和预测值，向我们展示训练模型对数据的拟合程度。\n\
  \n自适应逐步：\n\n: 自适应逐步法是一种前向逐步法，允许移除当前模型中但不再显著的变量。它是自适应的。\n\n聚合方法：\n\n: 集成模型使用聚合方法结合基学习器的预测。常见的聚合方法包括平均、投票和加权投票。聚合结果通常比单个模型的预测更准确、更可靠。\n\
  \n人工智能 (AI):\n\n\n\n\n\n# AI\nAI 是一种模拟人类智能以解决问题或做出决策的系统。AI 可以学习、预测、改进和解决。基本上，AI\
  \ 可以是一种在极少人工干预下自动运行和采取的应用程序或解决方案。\n\n## 关联模型\n具有区间目标变量的预测模型。\n\n## 反向传播 (Backpropagation)\n\
  反向传播是根据预测误差调整网络中权重和偏置的过程。它涉及计算损失函数的梯度并调整参数以使误差最小化。\n\n## 后向逐步 (Backward stepwise)\n\
  后向逐步是一种方法，模型从所有预测变量开始，在每一步中移除对模型性能贡献最小的变量，直到无法进一步改进或达到预定义的停止标准为止。\n\n## 集成学习 (Bagging)\n\
  Bagging 是一种集成方法，涉及在训练数据的不同随机子集（有放回采样）上独立训练多个基学习器。最终预测通常是所有基学习器预测结果的平均值或投票。\n\n###\
  \ 柱状图\n柱状图是分类数据的图形表示，它使用不同长度的矩形条来可视化每个类别的频率或计数。\n\n## 基学习器（个体模型）\n基学习器是构成集集的个体模型。基学习器可以是任何机器学习算法，例如决策树、支持向量机、神经网络等。\n\
  \n## 贝叶斯定理\n贝叶斯定理是贝叶斯网络中使用的基本方程，用于根据新证据更新概率。它计算在给定先验知识和观测证据的情况下，事件的后验概率。\n\n## 贝叶斯网络\n\
  贝叶斯网络也称为贝叶斯信念网络或概率图模型，是一种用于表示和推理变量之间不确定性及概率关系的强大且流行的方法。它是一种通过有向无环图表示一组变量及其条件依赖关系的图形模型。\n\
  \n## 偏置 (Bias)\n偏置项被添加到每个神经元输入的加权和中。它允许网络学习对某些值的偏置，并提高模型的准确性。\n\n## 大数据\n大数据是一个描述每天涌入业务的海量数据（包括结构化和非结构化数据）的术语。\n\
  \n## 提升 (Boosting)\nBoosting 是一种迭代集成方法，基学习器按顺序训练，每个学习器都专注于纠正前一个学习器所犯的错误。Boosting\
  \ 为分类错误的实例分配更高的权重，从而对挑战性样本给予更多关注。\n\n## 箱线图\n箱线图（箱须图）是数值数据分布的图形总结，显示了中位数、四位数和潜在的离群值，提供了数据中心趋势和离散性的简洁视图。\n\
  \n## 分支或子树\n分支或子树是决策树的一个部分。\n\n## 类别\n见 `Class`。\n\n## 因果数据挖掘\n因果数据挖掘是一种利用因果机器学习算法的方法，通过从数据检测因果网络中涉及变量及其相互关系的未知模式，以预测结果。\n\
  \n## 质心\n质心是类中对象属性的平均值。它们被用于表示类，并经常作为将新对象分配到某个类中的依据。\n\n## 冠军模型 (Champion model)\n\
  冠军模型是数据挖掘项目中比较模型中性能最好的预测模型。它是一个相对最优模型。\n\n## 卡方自动交互检测 (CHAID)\nCHAID 是一种非参数方法，用于通过根据分类预测变量递归地将数据划分为同质子组来创建决策树，使用卡方检验来评估变量之间的独立性并寻找显著的划分点。\n\
  \n## 类别 (Class)\n类别指的是一个不同的类别或标签，代表数据集中特定的一组或一类数据实例，这通常是目标。\n\n## 分类回归树 (CART)\n\
  CART 是一种二叉树，它使用算法反复地将父节点拆分为两个子节点。CART 可用于分类模型和关联模型。\n\n## 分类模型\n具有二分类或名目标变量的预测模型。\n\
  \n## 聚类分配\n聚类分配根据对象与其类质心的相似性将每个对象分配到特定类的过程。分配通常通过比较对象与质心之间的距离或相似性来完成。\n\n## 类或分段\
  \ (Cluster or segment)\n类（也称为分段）是指根据某些特征或属性相互相似的数据点或对象组。\n\n## 聚类分析\n聚类分析涉及分析每个类的特征，例如属性的平均值或类内对象的分布。\n\
  \n## 聚类采样\n聚类采样是一种采样方法，将总体划分为若干类或组，随机选择整个类，然后从所选类中的所有成员中收集数据。\n\n## 聚类验证\n聚类验证是评估所得类的质量和可靠性的过程。它涉及评估类的内部凝聚力和分离程度，以及它们的稳定性和意义。\n\
  \n## 聚类 (Clustering)\n根据相似性或接近性将对象或观测值分组为类（分段）的过程。目标是创建内部同质（同一类中的对象相似）且外部异质（不同类之间的对象不同）的类。\n\
  \n## 聚类算法\n聚类算法确定类的数量并将观测值分配到类中。聚类算法可以分为层次聚类和划分聚类。\n\n## 因子旋转\n成分旋转用于转换主成分以使这些成分与原始变量对齐，从而实现数据更具可解释性和意义的表示。\n\
  \n## 条件概率表 (CPTs)\n贝叶斯网络中的每个节点都有关联的 CPT，它定义了在给定父节点状态的情况下节点的条件概率分布。CPT 量化了变量之间的概率关系。\n\
  \n## 置信水平\n置信水平代表了我们从样本获得的估计值的确定程度或置信程度。\n\n## 混淆矩阵\n混淆矩阵也称为分类矩阵，是总结分类算法性能的表格。\n\
  \n## 连接（边)（在神经网络中）\n连接连接神经元。每个连接都有一个关联的权重，决定了连接神经元之间的影响程度。\n\n## 基于约束的算法\n基于约束的算法是一种方法，通过发现变量之间的概率依赖关系从数据中学习网络结构，而不是直接优化评分指标。它迭代地测试和评估变量之间的条件独立关系，以确定网络结构。\n\
  \n## 便利采样\n便利采样是一种非概率采样方法，研究人员选择最容易获取的个体作为样本的一部分，这导致缺乏随机性并可能产生偏倚。\n\n### 成本敏感学习\n\
  成本敏感学习是一种根据分类错误成本来评估和选择模型的方法。\n\n## 协方差\n\n\n\n\n\n两个变量之间的协方差衡量了它们共同变化的程度。如果两个变量具有高协方差，意味着它们是正相关的，而低协方差则表示没有相关性。在\
  \ `PCA` 中，我们选择主成分是期望它们是不相关的。\n\n### CRISP-DM 流程\n数据挖掘跨行业标准过程。\n\n### 数据去标识化\n数据去标识化是从数据集中移除或更改身份信息的过程，以保护个人的隐私和匿名性。\n\
  \n### 数据挖掘\n数据挖掘是一种利用机器学习算法来检测大型数据集中变量之间关系的未知模式的方法，以预测感兴趣的结果，从而做出明智的业务决策。\n\n###\
  \ 数据挖掘模型\n参见 预测模型。\n\n## 数据挖掘过程\n数据挖掘过程指的是使用各种技术和算法从大型集中集中有意义的模式、关系和见解的步骤。\n\n###\
  \ 数据修改\n数据修改涉及准备和转换原始数据，使其适用于训练我们的预测模型。\n\n### 数据科学\n数据科学是一个更大且多学科的领域，侧重于从数据中捕、提取知识并传播结果。数据科学包含作为数据分析核心部分的数据挖掘，以及其他组件，如数据收集与管理、数据处理、数据可视化、计算机编程和人工智能应用。\n\
  \n### 数据科学家\n数据科学家是从事分析、数据收集与处理、数据挖掘、机器学习和编程等任务或组合任务的专业人士。\n\n### 数据可视化\n数据可视化是通过图表、图形和其他视觉元素对数据和信息进行图形化表示，以更直观易懂的方式理解模式、趋势和见解。\n\
  \n### 决策矩阵\n决策矩阵是展示分类成本的表格，包括误报成本和漏报成本。\n\n### 决策节点\n当一个子节点被进一步分为额外的子节点时，被称为决策节点。\n\
  \n### 决策树\n决策树是一种基于逻辑规则的方法，呈现了变量的分层结构，包括根节点、父节点和子节点。\n\n### 深度学习\n深度学习是一种具有许多隐藏层的复杂神经网络。深度学习的突破了人工智能的热潮。\n\
  \n### 聚类树\n聚类树是一种树状图，显示了层次聚类中类之间的层次关系。每个分支的高度代表该层级类之间的距离。\n\n### 密度图\n密度图是连续数据分布的图形化表示，提供对底层概率密度函数的估计，通常使用平滑曲线。\n\
  \n### 因变量\n参见 目标变量。\n\n### 描述性统计\n描述性统计是统计学分支，涉及对数据的总结和呈现，以对其主要特征提供清晰简洁的理解，例如集中趋势测量、离散程度和分布。\n\
  \n### 降维\n一旦确定了主成分，就可以使用 `PCA` 将高维数据转换为低维数据，同时尽可能保留原始数据的原始变异性。保留的主成分数量决定了新数据的维度。\n\
  \n### 有向无环图 (DAG)\n贝叶斯网络的图形结构由 `DAG` 表示，它是一种没有环的图（没有起点和终点相同的节点路径）。环的缺失确保了网络不包含反馈并在并允许高效的概率推理。\n\
  \n### 距离或相似性量\n距离（也称为相似性量）量化了对象对之间的相似或差异。这些度量用于确定对象之间的距离，并形成聚类算法的基础。常见的距离量包括欧式距离、曼顿距离和余弦相似度。\n\
  \n### 多样性\n集成模型的主要优势在于其个体模型样性。通过使用不同的学习算法或在不同的数据子集上进行训练，集成可以捕获各种模式并降低过拟合的风险。\n\n\
  ### 边（贝叶斯网络中）\n边表示节点之间的概率依赖关系。有向边表示变量之间的因果或直接影响。\n\n### 特征向量和特征值\n`PCA` 旨在识别数据中变异最大的方向。特征向量是数据中不受线性变换影响的方向，而特征值指示每个特征向量捕获了多少方差。在\
  \ `PCA` 中，主成分是协方差矩阵的特征向量，按相应的特征值排序。\n\n### 集成\n集成是一种机器学习方法，涉及结合多个模型的预测以产生更准确、更稳健的预测。\n\
  \n### 集成规模\n集成中基学习器的数量是一个重要的考虑因素。增加集成规模在一定范围内可以提高性能，此之后收益递减，且模型可能会变得计算成本很高。\n\n\
  ### 误差项\n误差项（也称为残差项）代表目标变量观测值与从线性回归模型获得的预测值之间的差异。它捕获了目标变量无法通过与预测器的线性关系解释的部分。\n\n\
  ### 伦理考虑\n伦理考虑是指在整个数据挖掘过程中负责任和尊重地使用数据的原则、指南和价值观。这是为了确保我们遵守任何关于数据访问的要求和限制，以保护人类主体并避免违反隐私。\n\
  \n### 评估标准\n参见 模型拟合指标。\n\n### 评估指标\n参见 模型拟合指标。\n\n### 证据\n证据是指贝叶斯网络某些变量的观测值或状态。它用于更新网络中其他变量的概率。\n\
  \n### 解释方差\n每个主成分解释的方差比例对于理解每个成分在数据中的重要性至关重要。它帮助我们决定为了降维为了保留多少个主成分。\n\n### 解释能力\
  \ (EP)\n`EP` 指预测模型（特别是关联模型）解释或预测数据中所观察变异的能力。它衡量模型捕捉输入变量（预测器）与目标变量之间底层关系的程度。\n\n\
  ### F 检验\n`F-test`是对整体模型显著性的检验。换句话说，显著的 `F-test` 表示我们的回归模型比没有任何预测器的模型更拟数据。\n\n###\
  \ F1 分\n`F1 score` 是敏感性（召回率）和精确率（正预测值）的调和平均数；高 `F1 score` 意味着低误报 (`FP`) 和低漏报 (`FN`)。\n\
  \n### 因子分析\n参见 主成分分析。\n\n### 漏报 (FN)\n`FN` 是错误地指示事件不存在的预测。\n\n### 误报 (FP)\n`FP`\
  \ 是错误地指示事件存在的预测。\n\n### 特征重要性\n参见 变量重要性。\n\n### 特征\n参见 预测器。\n\n### 前向传播\n\n\n\n\n\
  \n# 前向传播\n正向传播是输入信号通过网络逐层传输以产生输出的过程。层中的每个神经元都接收来自上一层的输入，使用其激活函数进行计算，并将输出传递到下一层。\n\
  \n## 前向逐步法\n前向逐步法是一种模型从不包含预测变量开始，每次迭代添加一个变量的方法。在每一步中，将对模型性能提升最大的变量加入模型中，直到无法获得进一步改进或达到预定义的停止准则。\n\
  \n## 频率派统计\n频率派派学（也称为频率派推断）是一种统计框架和数据分析方法，它关注重复抽样和事件的长期频率的概念。\n\n## 基尼系数\n基尼系数是衡量模型判别能力的指标，即模型区分正样本和负样本的有效性。基尼系数衡量了特征属性之间正样本率的均衡程度。\n\
  \n## 拟合优\n参见 `Model fit`。\n\n## 拟合优指数\n参见 `Model fit metrics`。\n\n## 梯度提升\n梯度提升是一种机器学习集成方法，它通过梯度下降法最小化误差，顺序组合弱学习器来创建一个强大的预测模型。\n\
  \n## 梯度提升加法模型\n梯度提升加法模型 (`GBAM`) 是梯度提升的一种变体，将传统算法扩展到处理加法模型。加法模型是由单个输入变量函数之和组成的模型，每个函数仅依赖于单个输入变量。\n\
  \n## 梯度下降\n梯度提升通过梯度下降优化来最小化指定的损失函数。它计算损失函数的梯度，并调整随后的弱学习器以纠正之前学习器产生的错误。学习过程旨在迭代减少损失并提高整体模型性能。\n\
  \n## 层次聚类\n层次聚类构建聚簇的层次结构，形成一种称为树图（dendrogram）的树状结构。\n\n## 直方图\n直方图是连续数据的图形表示，使用相邻的矩形显示指定区间（箱）内数据的分布和频率。\n\
  \n## 不平衡数据集\n不平衡数据集是指不同类别的样本数量差异巨大的数据集，导致类别表示不均。在不平衡数据集中，一个类别（少数类）的实例通常远少于其他类别（多数类）。\n\
  \n## 填补\n填补是一个使用估计值来估计或填充数据集中缺失值的过程。\n\n## 自变量\n参见 `Predictors`。\n\n## 输入变量\n参见\
  \ `Predictors`。\n\n## 机构审查委员会 (IRB)\n机构审查委员会 (`IRB`) 是一种类型的委员会，通过审查建议的研究方法来应用研究伦理，以确保其符合伦理。\n\
  \n## 截距\n截距是回归方程中的常数项，代表所有预测变量为零时 `Y`（目标变量）的预测值。\n\n## K 均值聚类\nK-means 是一种划分聚类算法，通过迭代更新簇质并将数据点分配给最近的质心，将数据划分为\
  \ `K` 个不同的簇。其目标是最小化数据点与其各自簇心之间的距离平方和。\n\n## 标签\n参见 `Class`。\n\n## 层\n神经网络中的神经元组织成层。输入层接收输入数据，输出层产生最终输出，之间可以有一个或多个隐藏层。\n\
  \n## 叶节点\n不进行分裂的节点被称为叶节点。它们代表到达该节点的特定数据子集的输出或预测值/类别。\n\n## 学习（在贝叶斯网络中）\n贝叶斯网络学习涉及从数据中估计网络结构和参数。可以使用基于约束的方法或基于评分的方法来实现。\n\
  \n## 学习率\n学习率是控制梯度下降中步长的超参数。它决定了每个弱学习器的贡献对最终集成的影响有多大。较低的学习率使算法收敛缓慢，但可以提高泛化能力；而较高的学习率会导致快速收敛，但可能会增加过拟合风险。\n\
  \n## 水平\n参见 `Class`。\n\n## 测量尺度\n参见 `Variable scale`。\n\n## 提升图\n提升度是预测模型有效性的衡量标准，计算为使用预测模型和不使用预测模型的结果之比。提升图或提升曲线展示了响应率之间的图形表示。\n\
  \n## 似然\n贝叶斯网络中的似然表示给定变量值观测到特定证据的概率。它源自条件概率表。\n\n## 折线图\n折线图是用直线连接数据点的图表，通常用于可视化随时间的趋势或变化。\n\
  \n## 线性回归\n线性回归是一种目标变量为间隔数据的回归方法。线性回归是一种关联模型。\n\n## 逻辑回归\n逻辑回归是一种目标变量为分类（二分类或分类）的回归方法。它是一种分类模型。\n\
  \n## 损失函数\n损失函数衡量神经网络预测输出与实际值之间的差异。它量化了误差并引导训练过程中参数的调整。\n\n## 机器学习\n机器学习是一种数据分析方法，通过从大量数据中检测未知模式来预测感兴趣的结果。\n\
  \n## 机器学习模型\n参见 `Predictive model`。\n\n## 机器学习过程\n参见 `Predictive modeling`。\n\n\
  ## 误差范围\n误差范围是从样本获得的估计值的不确定性或变异性的衡量。\n\n### 平均百分比误差 (MAPE)\nMAPE 是关联模型的一种常用指标。它衡量了数据集中预测值与实际值之间的百分比差异。\n\
  \n## 变量测量\n参见 `Variable scale`。\n\n## 测量尺度\n参见 `Variable scale`。\n\n## 误分类率 (MR)\n\
  误分类率衡量模型错误分类目标变量（包括实际正样本和实际负样本）的频率。\n\n## 模型拟合\n模型拟合衡量模型与数据的拟合程度。\n\n## 模型拟合指标\n\
  用于评估模型拟合优劣的标准。\n\n## 模型性能\n参见 `Model fit`。\n\n### 模型可靠性\n模型可靠性是指模型的内部一致性。这意味着模型在使用不同数据集进行不同运行时会产生一致的结果。\n\
  \n## 模型选择与调优\n集成模型需要对基学习器和配置进行仔细的选择和调优。模型与配置的不同组合会显著影响模型的性能。\n\n## 模型有效性\n模型有效性是指预测的准确性。这意味着模型能够一致地准确预测目标变量。\n\
  \n## 神经元（节点）（在神经网络中）\n神经元称为节点或单元，是神经网络的基本单元。它接收输入，使用激活函数进行处理，并产生输出。\n\n## 节点（在贝叶斯网络中）\n\
  节点代表所建模领域中的随机变量或事件。每个节点对应于特定的感兴趣的数量或属性。\n\n\n\n\n\n### 非概率采样\n`Non-probability sampling`\
  \ 是基于非随机标准选择个体的方法，采样框中的每个个体都有机会被纳入。\n\n## 归一化\n`Data normalization`（数据归一化），称为变量缩放，是机器学习中的预处理步骤，将数据集的变量转换为相似的范围。\n\
  \n### 斜交法\n`Oblimin` 是一种斜交旋转方法，允许旋转分量之间存在相关性。`Oblimin` 的主要目标是通过减少高载荷变量的数量来获得更简单的结构。\n\
  \n### 斜交旋转\n`Oblique rotation` 是允许旋转后的分量之间相互相关的旋转方法。\n\n### 优势比\n`Odds ratio`（优势比）代表了一组与另一组相比，事件发生概率的比率。在逻辑回归中，它衡量了在保持所有其他预测变量不变的情况下，优势比随预测变量变化一个单位而的变化。\n\
  \n### 优化算法\n在训练期间根据计算出的梯度调整网络参数的算法。`Gradient descent`（梯度下降）是一种用于此目的常用优化算法。\n\n###\
  \ 正交旋转\n`Orthogonal rotation` 是一种旋转方法，其中旋转后的分量被限制为相互正交，这意味着它们是独立且不相关的。\n\n### 袋外评估\n\
  `Random forest`（随机森林）利用袋外（`OOB`）评估技术。由于每棵决策树都是在不同的子集上训练的，未包含在其中的样本可以用于评估。这提供了模型性能的无偏估计，而无需单独的验证集。\n\
  \n### 过拟合\n`Overfitting`（过拟合）是指模型对训练样本过度训练而无法泛化到其他数据集的情况。因此，模型是无效且不可用的。\n\n### 过采样\n\
  `Oversampling`（过采样）是一种通过增加少数类（稀有事件）的大小到与多数类相同来平衡数据的技术。\n\n### 父节点与子节点（决策树中）\n任何位于另一个节点下方的节点通常被称为\
  \ `child node`（子节点），而其之前的节点通常被称为 `parent node`（父节点）。\n\n### 父子关系（贝叶斯网络中）\n在贝叶斯网络中，节点的\
  \ `parents`（父节点）是直接影响它的节点。节点的 `children`（子节点）是受它直接影响的节点。\n\n### 划分聚聚类\n`Partitioning\
  \ clustering`（划分聚类）将数据划分为不重叠的划分或类。它直接将每个数据点分配给特定的类。\n\n## 饼图\n`pie chart`（饼图）是一种圆形图表，表示整体中不同类别的比例，每个类别由饼的一个切片表示。\n\
  \n### 总体\n`Population`（总体）是我们希望从中研究数据模式并得出结论的主要受众。\n\n### 后验概率\n`posterior probability`（后验概率）代表在观测到证据或数据的情况下变量的更新概率。它是通过使用\
  \ `Bayes' theorem`（贝叶斯定理）将 `prior probability`（先验概率）与观测数据的似然性结合起来得出的。\n\n### 预测\n\
  `Prediction` 是预测行为的通术。\n\n### 预测准确率\n`Prediction accuracy`（预测准确率）衡量模型预测目标变量（包括实际正性和实际负性）准确程度的指标。\n\
  \n### 预测误差\n误差衡量了训练模型与数据的不拟合程度。误差越低，模型越准确。\n\n### 预测模型\n参见 `Predictive model`。\n\
  \n### 预测模型\n预测连续或分类 `target variable`（目标变量）的模型。\n\n### 预测建模\n一个使用机器学习算法开发模型的过程，根据数据预测未来或未见的事件或结果。\n\
  \n### 预测能力\n`Predictive power`（预测能力）是指模型准确捕获并表征数据中存在的底层模式、关系或趋势，并将结果泛化到其他数据集的能力。\n\
  \n### 预测性研究\n`Predictive strategy`（预测策略）关注未来。换句话之，组织通过分析大量数据来预测未来潜在的新安全问题。通过挖掘大数据，他们可以开发出在事故或意外发生之前进行预测的模型。\n\
  \n### 预测变量\n用于预测输出的输入。\n\n### 主成分\n`Principal components`（主成分）是对应于协方差矩阵特征值的特征向量。它们根据重要性排序，第一个\
  \ `principal component` 解释了最大的差，依此类推。\n\n### 先验概率\n`prior probability`（先验概率）代表在观测到证据或数据之前对变量的初始信念或知识。它通常作为贝叶斯网络建模的一部分被指定。\n\
  \n### 主动研究\n`Proactive research`（主动研究）研究现状。换句话之，组织从各种方面检查危险状况和组织流程，并研究它们与事故/意外的关系。\n\
  \n### 概率推断\n贝叶斯网络允许 `probabilistic inference`（概率推断），即根据网络中其他变量的证据（观测值）计算特定事件的概率。推断基于\
  \ `Bayes' theorem`。\n\n### 概率关系\n`probabilistic relationship`（概率关系）是指两个或多个变量之间存在连接或关联，这种关系通过概率来描述。\n\
  \n### 概率采样\n`Probability sampling`（概率采样）是一种随机选择个体的方法，采样框中的每个个体被中的概率相等。\n\n### Promax\n\
  `Promax` 是一种斜交旋转方法，扩展了 `Varimax` 旋转的优点，同时考虑了分量之间可能的相关性。它被认为是正交旋转和斜交旋转之间的折中。\n\n\
  ### 剪枝\n移除父节点的子节点被称为 `pruning`（剪枝）。这通过移除不显著提高验证集性能的节点来简化决策树的技术。树通过分裂生长并通过 `pruning`\
  \ 缩小。\n\n### 伪 R 方\n`Pseudo R-squared`（伪 R 方）是逻辑回归中用于评估模型拟合的指标。与线性回归中使用的传统 `R-squared`（衡量模型解释的方差比例）不同，`pseudo\
  \ R-squared` 衡量模型解释的偏差比例。\n\n### 目的采样\n`Purposive sampling`（目的采样）是一种非概率采样方法，研究人员根据预定义的标准有目的地选择特定的个体或单位，以最好地代表感兴趣的特征或属性。\n\
  \n### R 方或决定系数\n`R-squared`（R 方）衡量预测变量方差解释目标变量方差的百分比。\n\n## 随机森林\n`Random forest`（随机森林）是一种机器学习算法，通过结合多个决策树的预测来做出更准确、更稳健的预测。它属于集成学习类别，通过组合多个模型形成一个更强大的预测模型。\n\
  \n### 随机子集选择\n\n\n\n\n\n-   随机森林中的每棵决策树都是使用训练数据的随机子集构建的。这一过程被称为自助聚合或“bagging”，它涉及通过放回法对数据点进行随机采样，以为每棵树创建创建多样化的子集。\n\
  \n-   随机变量选择：\n-   随机森林算法为每棵决策树选择输入变量的随机子集。这种技术被称为变量袋或变量子采样，它引入了额外的随机性，并有助于减少单个变量在集成中的主导地位。\n\
  \n-   反应性研究：\n-   反应性研究专注于检查已经发生的事件，并识别特定事件或事故的根源。根据识别出的根源，组织可以形成适当策略策略降低风险。\n\n\
  -   接收者工作特征（ROC）图：\n-   ROC 图的纵轴显示真正性率的值，横轴显示假正性率。它反映了灵敏度和特异性之间的权衡。\n\n-   重建：\n\
  -   `PCA` 允许将低维数据逆转换回原始的高维空间。尽管在降维过程中丢失了一些信息，但重建对于解释或其他下游任务仍然很有用。\n\n-   递归划分：\n\
  -   递归划分表示一种迭代过程，涉及将数据划分为若干部分，然后沿着每个分支进一步拆分。\n\n-   回归系数：\n-   回归系数是分配给每个预测变量（`Xi`）的系数，表示它们对目标变量的影响幅和方向。正系数意味着预测变量增加会导致目标变量的增加，负系数则反之。\n\
  \n-   回归方法：\n-   回归是一种流行的方法，用于估计一个因变量（目标变量）与多个自变量（预测变量）之间的关系。\n\n-   回归模型：\n-  \
  \ 见 关联模型。\n\n-   相对平方误差（RSE）：\n-   `RSE` 是关联模型的常用指标。它衡量了模型预测与始终预测实际值平均值的简单基准模型相比的相对改进。\n\
  \n-   替换：\n-   替换是一种数据修改技术，用于纠正错误、重新分配值或移除数据中的错误信息。\n\n-   代表性样本：\n-   代表性样本是准确反映总体特征和多样性的样本。\n\
  \n-   残差预测值图：\n-   残差预测值图不仅展示了实际值与预测值的接近程度。\n\n-   残差：\n-   `Residuals` 衡量实际值与预测值之间的差异。\n\
  \n-   稳健性：\n-   稳健性是处理噪声或异常值的能力。\n\n-   均方根误差（RMSE）：\n-   `RMSE` 是评估回归模型的常用指标。\n\
  \n-   根节点：\n-   根节点是树的起点。\n\n-   样本：\n-   一个 `sample` 是总体的子集。\n\n-   样本量：\n-   `Sample\
  \ size` 指样本中的个体数量。\n\n-   采样偏差：\n-   当样本不能代表总体时，就会发生采样偏差。\n\n-   抽样框架：\n-   抽样框架用于抽样的列表。\n\
  \n-   采样方法：\n-   采样方法是选择参与者使用的技术。\n\n-   有回采样：\n-   当一个单元被放回总体中时，就会发生有回采样。\n\n-\
  \   可扩展性：\n-   可扩展性是指处理大型数据集的能力。\n\n-   测量尺度：\n-   见 尺度。\n\n-   散点图：\n-   散点图是二维平面上成对数据点的图形表示。\n\
  \n-   基于评分的算法：\n-   基于评分的算法是一种最大化评分指标的结构学习方法。\n\n-   碎石图：\n-   碎石图是 `PCA` 中可视化特征值的图形工具。\n\
  \n-   SEMMA 过程：\n-   采样-探索-建模-评估。\n\n-   灵敏度、召回率或真正率（TPR）：\n-   灵敏度是正结果的概率。\n\n\
  -   显著性水平（alpha）：\n-   显著性水平（`alpha`）是指用于假设检验的阈值。\n\n-   显著性值（p 值）：\n-   显著性值（`p-value`）是评估估计系数显著性的统计量。\n\
  \n-   简单随机采样：\n-   简单随机采样是一种采样方法，每个成员都有相同的选择概率。\n\n-   雪球采样：\n-   雪球采样是非概率采样方法，要求初始参与者推荐他人。\n\
  \n-   特异性、选择性或真负率（TNR）：\n-   特异性是负结果的概率。\n\n-   分裂：\n-   分裂是将节点分为两个或多个子节点的过程。\n\n\
  -   分裂标准：\n-   分裂标准是用于评估和选择用于划分数据的最佳预测变量的指标。\n\n-   叠加（Stacking）：\n-   叠加是一种集成技术，使用元模型结合多个基学习器的预测结果。\n\
  \n-   标准化回归系数（beta）：\n\n\n\n\n\n### 标准化回归系数\n标准化回归系数是线性回归中的一种指标，用于在将两个变量标准化到相同尺度后，量化预测变量与目标变量之间的关系。标准化系数范围介于\
  \ 0 到 1 之间，在所有情况下都通过标准差在相同的尺度上进行测量。\n\n### 逐步法\n逐步法是一种迭代的变量选择方法，用于数据挖掘中，旨在为预测模型识别最相关的变量子集。\n\
  \n### 随机梯度提升\n随机梯度提升（SGB）是传统梯度提升算法的一种变体，它在训练过程中引入了随机性。它结合了梯度提升和随机学习的概念，以增强模型的泛化能力并降低过拟合风险。\n\
  \n### 分层抽样\n分层抽样是一种抽样方法，将总体分为不同的子群体或层，并从每个层中抽取随机样本，以确保总体中不同特征的代表性。\n\n### 残差平方和\
  \ (SSE)\nSSE 衡量未被解释的方差，即数据与模型预测值之间的距离。\n\n### 回归平方和 (SSR)\nSSR 衡量已解释的方差，即平均值与模型预测值之间的距离。\n\
  \n### 总平方和 (SST)\nSST 衡量总方差，即数据与平均值之间的距离。\n\n### 监督学习\n一种用于结构化数据的机器学习方法，通过从标记数据中训练模型，以对预定义的目标变量进行预测。\n\
  \n### 系统随机抽样\n系统抽样是一种抽样方法，在随机选择起始点后，从总体中选取第 n 个成员，确保所选样本之间有等距且一致的间隔。\n\n### 目标\n\
  参见目标变量。\n\n### 目标变量\n被预测的输出。\n\n### 测试样本\n用于对模型进行最终测试的数据样本。\n\n### 训练\n神经网络训练涉及使用训练数据集迭代调整权重和偏置。其目标是最小化误差或损失函数，并提高网络的预测准确性。\n\
  \n### 训练样本\n用于训练模型的数据样本。\n\n### 树深度和树的数量\n这些是控制单个决策树复杂性和大小的超参数。树深度影响模型捕捉数据中复杂关系的能力，而树的数量决定了提升的迭代次数和整体模型的复杂度。\n\
  \n### 真阴性 (TN)\nTN 是正确指示事件不存在的预测。\n\n### 真阳性 (TP)\nTP 是正确指示事件存在的预测。\n\n### 欠采样\n\
  欠采样是一种通过减少多数类的大小，使其与少数类的大小相同，来平衡数据的技术。\n\n### 非标准化回归系数 (B)\n非标准化回归系数是线性回归中的一种指标，用于在变量原始测量单位上量化预测变量与目标变量之间的关系。\n\
  \n### 无监督学习\n一种用于非结构化数据的机器学习方法，通过从未标记数据中训练模型，没有特定的目标变量。\n\n### USELEI 过程\n理解-抽样-探索-学习-评估-推理。\n\
  \n### 验证样本\n用于验证模型的数据样本。\n\n## 变量离散化\n变量离散化是将连续尺度变量（间隔变量）转换为离散类别（分类变量）的过程。\n\n###\
  \ 变量重要性\n衡量变量重要性的指标，指示每个输入变量在做出预测时的相对贡献。它允许用户识别影响最大的预测因子，并获得对底层数据模式的洞解。\n\n### 变量尺度\n\
  描述变量性质和属性的特征；它指示了变量可以取的值类型以及可以对其执行的操作。\n\n### 方差\n变量的方差衡量该变量的值偏离其平均值的程度。在主成分分析（PCA）中，目标是找到数据中方差最大的方向，因为这些方向包含了关于数据的最多信息。\n\
  \n### 方差法\nVarimax 是一种交旋转方法，旨在最大化每个成分载荷平方的方差，从而产生一种简单且稀疏的结构，使得每个变量在一个组件上有高载荷，而在其他组件上的载荷接近于零。\n\
  \n### 自愿响应抽样\n自愿响应抽样是一种非概率抽样方法，参与者自选择成为样本（通常是响应调查或研究邀请），由于参与的自愿性，可能会导致结果产生偏差。\n\n\
  ### 投票/平均\n在预测期间，每棵决策树独立地生成一个预测，随机森林的最终预测通过投票（针对分类模型）或平均（针对关联模型）单个树的预测来确定。这种集成方法有助于减少建模中的偏差和方差，并提高模型的整体准确性和稳健性。\n\
  \n### 弱学习器\n在梯度提升的语境下，弱学习器是指性能略好于随机猜测但本身并不准确的单个模型。决策树常被用作梯度提升中的弱学习器，也可以使用其他模型。\n\
  \n### 权重\n神经元之间的每个连接都被分配一个权重，代表了该连接的强度或重要性。这些权重决定了一个神经元的输入对另一个神经元的输出有多大的影响。\n\n\
