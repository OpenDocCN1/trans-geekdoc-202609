  \ | 需要代码 | 需要代码 |\n| 性能评估 | | 在输出窗口中 | 需要额外步骤 | 在输出窗口中 | 需要代码 | 需要代码 |\n| 价格 | |\
  \ 免费教育版 | 免费教育版 | 昂贵 | 开源；免费 | 开源；免费 |\n| 挑战 | | 云端；速度慢；文件文件夹管理混乱；并非为数据准备设计 | 混乱的图表和模型对比；术语混乱\
  \ | 学习曲线陡峭；可视化不便 | 学习曲线陡峭；可视化不便 |\n\n\n\n\n在本书，我涵盖了五种主要的数据挖掘软件：`SAS Enterprise Miner`、`Rapid\
  \ Miner`、`SPSS Modeler`、`R` 和 `Python`。这些都是市场上顶尖的数据挖掘软件。`SAS Enterprise Miner` 和\
  \ `Python` 在工业界和学术界都得到了高度认可，但它们在工业界似乎占据主地位。许多组织目前使用 `SAS` 和 `Python` 进行应用，且分析员工通常需要持有证书来证明自己的技能。`SAS`\
  \ 和 `Python` 拥有非常大的认证计划，被不同行业的许多公司接受。另一方面，`Rapid Miner`、`SPSS Modeler` 和 `R` 在学术界更受欢迎。教师和研究人员在教学或研究中使用这些软件应用。这就是为什么我们看到更多期刊出版使用了这些软件应用。\n\
  \n我将介绍主要的标准并对它们进行比较。\n\n## 用户界面\n\n对于这些软件，一个重要的标准是用户界面。目前我们看到 `SAS Enterprise Miner`、`Rapid\
  \ Miner` 和 `SPSS Modeler` 具有可视化的界面，这对于学生、教师和研究人员来说非常友好。`SAS` 和 `Python` 则更依赖于代码，这对于数学和工程领域的人来说可能是一个挑战。此外，`Rapid\
  \ Miner` 和 `R` 具有一定的学习曲线，需要大量的练习。但是，对于管理和社会科学领域的用户，这些软件提供的灵活性是必不可少的。我们通常通过拖放节点来创建工作图，从而构建预测模型。`R`\
  \ 和 `Python` 也被工业界广泛接受，是数据科学家的必备技能。此外，`Python` 提供了丰富的库，用户可以访问并使用。\n\n## 工作空间\n\n\
  下一项是工作空间。基本上，数据挖掘过程涉及许多步骤和模型，因此工作图可以帮助我们跟踪这些过程。通常，我们通过将节点拖入工作空间并连接它们来创建这样的工作图。导入数据文件、分区、探索、转换数据、建模和评估等步骤都可以图中轻松完成。我通常使用不同的算法构建模型。\n\
  \n## 机器学习算法\n\n关于这些软件提供的机器学习算法，我发现 `SAS Enterprise Miner`、`Rapid Miner` 和 `Python`\
  \ 拥有更强大的算法，允许我们进行更复杂的建模。无论如何，`SPSS Modeler` 和 `R` 正在改进它们的算法，我们已经在这些应用中看到了更多功能。我想指出，所有软件都提供文本分析工具，但当处理文本数据时，`Text\
  \ Miner` 更易用。文本解析、文本过滤、文本主题和文本聚类等步骤组织良好且连接紧。另一方面，`Python` 提供了多功能的自然语言处理（NLP）工具和库，允许开发者处理不同的\
  \ NLP 任务，包括情感分析、词性标记、词建模、向量等。\n\n## 价格\n\n现在我们进入价格敏感的话题。在这些应用中，`R` 和 `Python` 是完全开源的，因此是免费的。`Rapid\
  \ Miner` 也是一个开源应用，对学术界免费。但对企业来说不是免费，用于商业用途的开发者必须支付许可。`SPSS Modeler` 也不免费。对企业来说相当贵，对学术界来说仍然昂贵。我相信\
  \ IBM 终于将为教育目的免费 `SPSS Modeler`，这对我们来说是一个很好的选择。最后，`SAS Enterprise Miner` 对企业也很贵。对于大学，它包含在\
  \ SAS 校园软件包中，如果你的大学是 SAS 校园，它是免费的。如果不是，他们提供一个免费的云端版本 `SAS On Demand for Academics`。请注意，目前该版本仅在\
  \ Windows 操作系统上运行。\n\n\n\n我还想总结一下这些应用程序的一些主要缺点。如上所述，`R` 和 `Python` 是编程语言，因此对新用户来说会有陡峭的学习曲线。它们都缺乏工作区视图，而且这些应用程序的可视化操作非常麻烦。`SPSS\
  \ Modeler` 和 `Rapid Miner` 都有混乱的工作区设计、难以执行模型比较，以及节点和操作符名称令人困惑。在 `SPSS Modeler` 和\
  \ `Rapid Miner` 中，为了查看输出图形，我们必须经过额外的步骤，特别是 `SPSS Modeler`。`SAS Enterprise Miner`\
  \ 在方面具有优势，因为所有结果（无论是表格还是图形）都可以在同一个节点中。\n\n此外，`SAS Enterprise Miner`（尤其是免费的云版）也有缺点。第一个缺点是\
  \ `SAS` 处理文件夹和文件的方式。与 `SPSS` 和 `Excel` 等软件不同，`SAS` 通过 `libraries` 管理文件夹。这意味着包含文件的文件夹必须连接到一个\
  \ `library`，且 `SAS Enterprise Miner` 必须连接到同一个 `library` 才能让我们访问该文件夹中的文件。打开文件确实很繁琐且需要几个步骤，但这就是\
  \ `SAS` 始终管理文件夹的方式，因为对于 `SAS` 项目来说这是一种高效的方法，特别是当你有很多包含大量文件的不同文件夹时。请注意，`SAS Enterprise\
  \ Miner` 并不是为了上传文件、更改文件名或在文件夹之间移动文件的。这些操作必须使用免费的 `SAS Studio` 完成。这需要一些时间来适应，一旦我们理解了流程，就会变得更容易。\n\
  \n如果我们在学术上使用免费的云版，软件速度也将受到限制，因为它取决于网络连接和服务器性能。由于它对所有教师、研究人员和学生都是免费的，因此会有许多人同时访问服务器，这可能会导致处理时间变慢。此外，如前提到的，此时的学术云版仅支持\
  \ `Windows OS`。此外，国际学生和研究人员如果从其他国家登录，可能会在访问共享文件夹时遇到困难。根据我使用 `SAS Enterprise Miner`\
  \ 的经验，一切运行得很顺畅，我很少在运行模型时遇到延迟。注意，云版 `SAS Enterprise Miner` 拥有与企业版完全相同的功能，包括 `High-Performance`\
  \ 节点和 `Text Miner`。\n\n最后，重要的是数据挖掘软件并不是为了方便进行数据准备或修改而设计的。它们是数据挖掘软件应用，专门用于该任务。像 `Rapid\
  \ Miner` 和 `SAS Enterprise Miner` 这样的软件应用甚至不允许我们更改数据。这是因为我们正在处理大量数据集，此类功能可能会在在我们不知情的情况下意外更改数据。这将是一场灾难，因为输出将变得无效，而且我们无法找到错误所在的地方。因此，如果你发现自己无法在这些应用程序中更改数据甚至更改变量名，请不要惊讶。相应地，数据准备应该在使用数据挖掘软件之前完成。那么，我们该如何准备数据集呢？通常，每个供应商都有其他工具用于此目的。然而，如果你想避免学习另一个软件，我发现\
  \ `MS Excel` 是一个编码、合并和清洗数据的良好工具。在下载原始数据集后，我们可以使用 `Excel` 对数据进行编码、合并来自各种来源的数据并清洗数据。`Excel`\
  \ 为这些任务有许多实用的功能，而且我们都熟悉这个应用程序。一旦我们有了清洗的数据集，只需要将其转换为 `SAS` 或 `SPSS` 格式，就可以使用我们的数据挖掘软件进行建模了。\n\
  \n总之，没有完美的数据挖掘软件，因为它们都有优缺点，并且服务于不同的群体。我们应该根据自己的需求、背景和项目目的来选择软件。由于通用性和适应性，像 `Python`\
  \ 和 `R` 等编程软件受到这些领域理工科学生和研究人员的欢迎。它们也是某些数据科学家职位所需技能之一。另一方面，这并不意味着如果我们没有编程技能就不能进行数据挖掘。像\
  \ `SAS Enterprise Miner`、`SPSS Modeler` 和 `Rapid Miner` 这样的软件可以在不需要代码的情况下完成工作。随着数据挖掘市场的不断进步，商业管理和社会科学领域的学生应该利用这些技术。通过这些应用程序获得的技能让我们能够在没有编程背景的情况下很好地完成数据挖掘项目。在本书，我选择\
  \ `SAS Enterprise Miner` 是因为它的健壮性和易于使用的图表。它的云版也是免费且功能全的。我计划在其他书籍中使用 `SPSS Modeler`\
  \ 和 `Rapid Miner`，所以请关注。\n\n\n\n![](img/shut3_1.jpg)在本章中，我们将介绍 SEMMA 过程的第一步：抽样（sampling）。从完整数据集中选择子集是一个必要的步骤，以便我们对其进行分析。必须正确进行采样以最大限度地减少采样偏差。如提到的，模型的优坏取决于数据的质量。我们需要高质量的数据来产生有效的预测模型。我们还涵盖了数据分区（data\
  \ partitioning），这是一个即将数据集拆分为若干个子样本的过程。训练样本用于训练模型，验证样本用于验证模型。此外，测试样本用于在模型用于实际预测之前对模型完成最终的测试。本章包含了数据抽样中的众多概念和术语，这些概念对于理解各种采样方法非常重要。我们需要区分总体（population）、采样框（sampling\
  \ frame）和样本（sample）。我们采样的目标是确保样本具有总体的代表性。由于我们的预测模型是使用训练样本训练的，我们希望确保模型能够泛化到其他数据集。换句话之，模型可以对任何新数据集做出良好的预测，这表明了模型的可用性。\n\
  \n## 数据抽样\n\n![](img/ufig3_1.jpg)本质上，抽样是为了分析目的从整个数据集中选择一个子集（样本）的过程。抽样的目标是从总体中收集具有代表性和可靠的信息，特别是当从该总体中的每个个体或元素收集数据是不可行或不可能时。抽样是任何研究项目中非常重要的一步，以确保数据是充分且具有代表性的。适当的抽样让我们拥有一个规模足够且具有目标总体代表性的高质量数据集，使我们能够产生有效且具泛化性的模型。为了更好地理解抽样过程以及如何抽样，我将从数据挖掘的角度描述总体、采样框、采样策略和样本量的概念。这些概念在调查、实验和访谈设计的研究方法论书中被深入描述和讨论，这些是收集原始数据的常用方法。在数据挖掘研究中，我们以略不同的方式应用这些概念，因为在数据挖掘中，我们使用的是项目之前已经收集的二次数据。因此，我们假设数据是由营销公司、工业组织或政府机构收集的。由于这些数据库通常非常大，分析整个数据集是不现实的。我们需要一种策略从大型数据集中正确采样出一个子集并将其用于分析。\n\
  \n图 3.1 展示了总体、采样框和样本之间的区别。我们将详细介绍它们的细节、它们之间的关系以及我们可以选择的采样方法。\n\n![图 3.1 总体、采样框和样本。](img/fig3_1.jpg)\n\
  \n图 3.1 总体、采样框和样本。\n\n### 总体\n\n![](img/ufig3_2.jpg)`Population`（总体）是我们想要检查数据模式并得出结论的主要目标受众。我们研究的总体可以是个人、物体、案例或特定的行业部门。目标总体应该足够大，以确保我们发现的贡献性，但也应该足够集中，以确保研究的可行性。\n\
  \n例如，我们的项目旨在预测乘客的航空公司推荐。美国航空公司乘客是一个合适的目标总体，它涵盖了使用航空交通进行旅行的美国居民。如果我们的目标是全球居民，那么将很难收集到能够捕捉这一庞大总体的数据。此外，当我们关注所有国家的居民时，就会涉及到混杂变量（confounding\
  \ variables）的问题，这些变量是特定于国家的，对目标变量有影响，但我们没有这些变量的数据。例如，文化、政治、教育或经济变量都是潜在的混杂变量。忽视这些变量的影响可能会对我们发现的有效性产生。通过关注美国市场，我们可以找到数据，并对美国航空旅行者的决策做出有效的结论。我们可以根据研究范围接受所有年龄段的居民，或关注\
  \ 18 岁及以上的居民。在书中，我使用了一个侧重于预测航空公司推荐的乘客调查数据集。我选择只关注成年乘客，因为他们是能够购买机票的人。\n\n总体的另一个例子是加拿大所有的公路交通事故。通过关注这个总体，我们可以建立预测模型来预测该国交通事故中的受伤风险。对于这个项目，我们不想结合不同的交通模式（例如航空、陆路和水路运输），因为这些交通模式的事故具有非常不同的特征和影响因素。我们可能会得到噪声数据，导致无效的预测模型。通过关注公路运输，我们应该能够建立一个有效且实用的模型来准确预测公路事故。\n\
  \n### 采样框\n\n一旦我们确定了研究的合适总体，就需要确定采样框。请注意，对总体中的所有个人进行调查或收集数据是不现实的，也不建议的。明显的原因是无法从所有个体那里获得回复，因为很难联系到所有人，而且某些个人可能会拒绝提供信息或回答调查。这种参与是自愿的，个人有权拒绝数据收集机构的此类请求。其次，没有关于整个总体的数据也可以对他们做出有效结论。从统计学的角度来说，我们只需要研究总体的一个样本，如果我们执行了恰当的抽样，那么来自该样本的分析结果就可以推广到整个总体。关键在于我们应该拥有具有足够样本量的代表性样本。为了获得具有代表性的样本，我们需要正确的采样框。简单来说，`sampling\
  \ frame`（采样框）是提取样本的实际单元列表或来源。采样框的特征应与总体相似，以确保具有代表性。\n\n例如，在航空公司推荐项目中，由于我们的总体是乘坐航空的美国成年居民，我们可以从六个州的居民收集数据：纽约州、明尼苏达州、佛罗里达州、德克萨斯州、加利福尼亚州和华盛顿州。这些州是我们的采样框，它们代表了东北部、南部、中部、南部和西北部，从而确保样本的代表性。假设我们只收集加利福尼亚州（西部的一个州）居民的数据；那么我们的样本很可能代表性不足，因为该州的居民具有西部地区独特的特征和行为，不能代表我们的总体。因此，采样框与总体之间的这种差异会导致采样偏差，我们的分析结果将无法为总体提供足够的证据。这就是为什么我们在数据抽样之前需要仔细识别采样框的原因。\n\
  \n### 样本\n\n\n\n\n`Sample` 是总体的一个小子集。我们使用样本进行数据分析，并对总体做出推断。为了确保我们对总体的结论是有效的，样本必须具有代表性。为了做到这一点，我们需要一个良好的抽样框，然后从抽样框中抽取样本。例如，在航空公司推荐项目中，我们选择了一个包含六个州（纽约州、明尼苏达州、佛罗里达州、德克萨斯州、加州和华盛顿州）的抽样框。然后，我们从这些州的符合条件的居民中收集数据。要求这些居民年龄\
  \ 18 岁以上且过去使用过航空交通。这是为了确保我们涵盖了乘坐过飞机且能够购买机票的人员。因此，他们对航空公司的推荐将有利于航空公司预测旅行需求。如果一个样本与总体具有相同的属性和特征，则认为该样本具有代表性。因此，基于该样本的分析结果可以用于对总体进行推断。\n\
  \n## 抽样方法\n\n即使有了良好的抽样框，如果没有采用适当的抽样策略，我们仍然可能得到偏差样本。`Sampling` 方法指的是我们用于选择参与者和收集数据的程序。例如，如果一个机构开展调查，他们会向抽样框内的居民（上述六个州）发送邀请并要求他们回复。然而，他们如何选择这些参与者是确保样本代表性的关键。在数据挖掘中，假设完整数据已由另一个机构（如航空公司或政府机构）收集，而我们作为数据科学家，需要决定如何从该完整数据集中选择个体作为样本。我们称之为抽样方法。选择正确的抽样方法是确保数据质量的关键。我将在下一节详细描述常见的抽样方法。\n\
  \n## 数据抽样的基本概念\n\n![](img/shut3_2.jpg)数据抽样是统计学和数据挖掘中常用的一种基本技术，用于根据较小的数据子集（即样本）对更大的总体进行推断。样本经过仔细选择，以确保它准确地代表总体的特征和多样性。通过研究样本，数据分析师可以对整个总体得出结论或做出预测。表\
  \ 3.1 展示了数据抽样的基本概念，这些概念对于准确理解和执行抽样方法至关重要。\n\n表 3.1 数据抽样的基本概念\n\n| 术语 |  |\n| ---\
  \ | --- |\n| 总体 (Population) | 我们想要研究数据模式并得出结论的主要目标受众。 |\n| 抽样框 | 抽样框是提取样本的单元或来源的实际列表。\
  \ |\n| 样本 (Sample) | 样本是总体的子集。我们使用样本进行数据分析并对总体做出推断。 |\n| 抽样方法 | 抽样方法是我们用于选择参与者和收集数据的程序。\
  \ |\n| 样本量 (Sample size) | 样本量是指包含在样本中的个体或主体数量。应该根据统计考虑来决定。 |\n| 代表性样本 | 准确反映总体特征和多样性的样本。\
  \ |\n| 抽样偏差 | 当所选样本不能准确代表总体时就会发生抽样偏差，导致结果偏斜或不准确。 |\n| 概率抽样 | 概率抽样是一种随机选择个体的方法，使得抽样框中的每个个体都有被选中的相等概率。\
  \ |\n| 非概率抽样 | 非概率抽样是基于非随机标准选择个体的方法，抽样框中的每个个体都有机会被包含。 |\n| 误差范围 | 误差范围是衡量从样本获得的估计值中不确定性或变异性的量。\
  \ |\n| 置信水平 | 置信水平代表了我们对从样本获得的估计所具有的确定程度或信心程度。 |\n| 不平衡数据集 | 不平衡数据集是指不同类别中样本数量差异显著的数据集，导致类别的表示不均。在不平衡数据集中，一个类别（少数类）的实例通常远少于其他类别（多数类）。\
  \ |\n| 过采样 (Oversampling | 过采样是一种通过增加少数类（稀有事件）的大小到与多数类相同来平衡数据的技术。 |\n| 欠采样 (Undersampling\
  \ | 欠采样是一种通过减少多数类的大小到与少数类相同来平衡数据的技术。 |\n\n## 抽样方法\n\n![](img/ufig3_3.jpg)有许多不同的抽样方法，但通常它们分为两个主要类型：概率抽样和非概率抽样。\n\
  \n- `Probability sampling` 是对参与者的随机选择。这种方法允许我们对整个总体做出强有统计推断。\n- `Non-probability\
  \ sampling` 是基于便利或其他标准对参与者的非随机选择。这种方法为我们提供了更简单、更廉价的数据收集方式，但存在抽样偏差的问题。\n\n![](img/ufig3_4.jpg)在我们讨论这些类型的抽样方法之前，理解什么是抽样偏差以及为什么我们需要最小化它非常重要。`Sampling\
  \ bias` 是以某种方式收集样本，导致总体中的某些成员比其他成员更容易被选中。如果发生抽样偏差，我们基于该样本分析的发现无法推广到整个总体。也就是说，这对外部效性构成了威胁，限制了结果的可推广性。在这种情况下，我们只能对特定的样本得出结论，而不是对针对的总体。在大多数情况下，完全消除抽样偏差是困难的，但我们应该尽量减少它。某些抽样方法在减少抽样偏差方面比其他方法更好。\n\
  \n### 概率抽样\n\n![](img/ufig3_5.jpg)概率抽样是推荐的方法，因为它允许我们确保数据质量并最小化抽样偏差。基本上，我们随机选择抽样框中的个体。因此，抽样框中的每个个体都有被选中的相等概率。这种方法能够产生总体的无偏代表。研究中有四种常用的概率抽样方法。我将用示例简要描述它们。图\
  \ 3.2 直观地展示了这些抽样方法。\n\n![图 3.2 概率抽样方法。](img/fig3_2.jpg)\n\n图 3.2 概率抽样方法。\n\n1. `随机抽样`：这种方法允许总体中的每个成员都有等的机会。常用的方法是为抽样框中的每个个体分配一个数字，然后使用随机数生成工具（例如\
  \ Excel 中的 `RAND()` 函数）来选择我们需要的参与者数量。因此，选择完全基于随机，没有抽样偏差。\n\n\n\n\n例如，我们想要从某县的 5,000\
  \ 名高中生中抽取一个简单的随机样本。为此，我们为学生数据库中的每位学生分配一个从 1 到 5,000 的编号。然后，我们使用随机数生成器生成 500 个随机数。编号与此匹配的\
  \ 500 名学生将被选中。\n\n### 2. 系统抽样\n系统抽样是随机抽样的一种形式，但它并不使用随机生成器。相反，我们为每个个体分配一个编号，并按照一致的间隔选取这些数字。至关重要的是，我们必须确保列表中不存在任何可能导致样本产生偏差的隐藏模式（hidden\
  \ patterns）。例如，如果数据库按年级排列学生并按测试成绩升序列出，那么可能存在一种风险，即我们选择的间隔可能会无意中遗漏分数较低的学生，导致样本向高分个体倾斜。\n\
  \n让我们继续使用高中生的例子。该县总共有 5,000 名学生。首先，我们按照字母顺序对这些学生进行列表。然后，我们从列表中每隔 10 个人选取一个，这将给我们一个包含\
  \ 500 个个体的样本。\n\n### 3. 分层抽样\n这种方法要求我们根据相关特征（例如性别、年龄范围、年级、分数范围）将人口分为若干小组，称为层。根据所需的样本量，我们计算每个小组应该选取多少个个体。然后，我们使用上述的系统抽样方法从每个小组中选取个体。这种方法允许我们通过确保每个小组在样本中都得到充分代表，从而得出更精确的结论。\n\
  \n例如，该县的高中有 2,000 名女学生和 3,000 名男学生。我们希望样本能反映学校的性别平衡，因此我们根据性别将学生群体分为层。然后，我们对每个小组进行随机抽样，选取\
  \ 200 名女学生和 300 名男学生，从而得到一个包含 500 名学生的代表性样本。\n\n### 4. 聚类抽样\n![](img/ufig3_6.jpg)\n\
  聚类抽样涉及将人口分为若干子小组，每个小组应具有与整个人口相似的特征。这些子小组被称为聚类。我们不是从每个聚类中抽取个体，而是随机选择几个聚类，并使用这些聚类中的所有个体。在处理规模较大的聚类时，可以使用上述任一技术对每个聚类进行采样，这种方法被称为多阶段抽样。聚类抽样在处理大量且分散的人口时证明是有效的。然而，确保抽取的聚类真实代表整个人口可能具有挑战性。\n\
  \n我们将以高中生作为聚类抽样的例子。例如，全州有 20 所高中，我们没有能力访问每所学校来收集数据。假设这些学校具有相似的人口统计特征和属性，因此我们可以使用随机抽样选取八所学校，这些学校就是我们的聚类。如你所见，如果这些学校的人口统计特征和属性不同，某些学校可能无法代表总体，我们可能无法获得良好的样本。这是聚类抽样的主要缺点。\n\
  \n## 非概率抽样方法\n\n![](img/ufig3_7.jpg)\n在非概率抽样中，个体的选取是基于非随机标准的，抽样框架中的每个个体都有机会被纳入。非概率抽样的执行更容易、成本更低，但我们面临着更高的抽样偏差风险，导致样本代表性较差。因此，我们对人口的推断比概率抽样得出的推断更弱、更有限。因此，如果我们出于某种原因选择使用非概率样本，我们仍应努力使其尽可能地代表总体。非概率抽样方法通常用于探索性和定性研究，其样本量较小并采用访谈。由于很难为访谈目的随机选取一个大样本，研究人员需要使用非概率抽样和更小的样本量。在这类研究中，目标不是对大部分人口得出结论，而是对一个较小或研究不足的人口建立初步理解。另一种可能使用这种方法的研究类型是实验研究。实验的重点是检查处理对感兴趣的结果的因果影响，而不是研究大部分人口。实验通常要求参与者在实验室或受控环境中花费长时间，例如一个学期的课程。因此，很难招募大量样本。研究人员需要依靠志愿者作为实验参与者，所以他们必须使用非概率抽样。\n\
  \n对于数据挖掘研究，我们处理大量数据并打算产生一个可以推广到其他数据集的预测模型，我不建议使用非概率抽样。根据我们拥有的数据量，我们应该选取大样本并使用概率抽样。尽管如此，我将简要描述一些典型的非概率抽样方法，让你了解它们是什么以及如何运作。\n\
  \n#### 1. 方便抽样\n方便抽样涉及选取研究人员易于获取的个体。虽然它提供了一种收集初始数据的直接且具成本效益的方法，但在产生可以推广到更广泛人口的结果方面表现不足。例如，在我们在研究组织内员工服务的意见的情景中，仅要求同一层级的同事完成问卷是一种方便的方法。然而，这限制了样本的代表性，因为它没有涵盖组织内所有级别的员工。\n\
  \n#### 2. 自愿响应抽样\n自愿响应抽样主要依赖于便利性。在这种语境下，个体是自愿参与的，而不是由研究人员主动选取和联系。要注意，自愿响应样本往往带有某种程度的偏差，因为某些个体比其他人更倾向于自愿，可能导致非代表性的结果。例如，我们向组织的所有员工发送了一份关于医疗保险福利的问卷，他们中的许多决定完成。虽然这种方法可以让我们获得有关该主题的一些见解，但值得注意的是，受访者可能对服务持有强烈的意见。因此，我们无法断定他们的观点准确反映了所有员工的观点。\n\
  \n\n\n\n### 3. ![](img/ufig3_8.jpg) **目的抽样：** 目的抽样，也称为判断抽样，要求我们利用专业知识来选择对研究目的最有用的样本。它经常被用于定性研究，特别是当研究者寻求对特定现象的深度洞察，而非进行统计意义上的概括时。在处理小规模且特定的群体时，这种方法特别有用。为了确保目的抽样的有效性，建立清晰的纳入标准和合理的选取依据至关重要。例如，如果我们的目标是深入了解组织内残障员工的意见和经验，我们会刻意地选择几位具有不同支持需求的员工。这种有意的选择使我们能够收集有关他们对员工服务体验的广泛数据。\n\
  \n### 4. **雪球抽样**：** 雪球抽样可以通过其他参与者来招募参与者。基本上，我们联系一些认识的人，并让他们联系他们认识的人。随着我们接触的人越来越多，参与者的数量就会像“雪球”一样不断增长；因此被称为“雪球”抽样。例如，我们正在研究本市\
  \ LGBTQ+ 群体的经历。由于城市中没有所有 LGBTQ+ 人的名单，因此概率抽样是不可能的。所以，我们遇到一个同意参与研究的人，由他们向我们介绍他们在该地区认识的其他其他人。\n\
  \n如你所见，所有这些非概率抽样方法执行起来更容易、成本更低，但抽样偏差的风险更高，且样本可能不具有总体代表性。因此，我们无法将发现推广到更大的群体中。在数据挖掘研究中，我们处理的数据比其他类型的研究要大，因此应该使用概率抽样来确保数据的代表性。结果，是我们开发的预测模型可以具有更强的通用性，并应用于来自同一群体的其他数据集。\n\
  \n## 二次数据与样本代表性\n\n当我们自己是数据收集者时，我们可以选择抽样框并使用上述任一种抽样方法来确保样本的代表性。然而，在许多数据挖掘项目中，我们使用的是由其他机构或人员收集的数据——二次数据。在这种情况下，我们将整个数据集视为抽样框，并使用这些抽样方法之一从整个数据集中抽取。由于我们不知道数据提供者是如何抽样和收集数据的，我们如何知道自己是否拥有具有代表性的样本呢？\n\
  \n![](img/ufig3_9.jpg)为了回答这个问题，我推荐一种有效的方法，即分析样本的人口统计信息并将其与总体进行比较。本质上，我们证明了样本与总体具有相似的人口统计属性和特征。在这种情况下，即使我们不知道数据是如何收集的，也可以得出我们拥有具有代表性的结论。这种方法即使在我们自己收集数据时也适用。原因是，即使我们选择了抽样框并使用了概率抽样，数据收集过程中可能存在我们无法控制的不确定性，这可能仍然导致抽样偏差。例如，我们从这里收集数据的个体可能并不像我们想象的那样具有代表性。情况下，为了确保起见，我们仍然应该比较样本与总体的人口统计信息。\n\
  \n表 3.2 我们证明了样本与总体具有相似的人口统计属性和特征。在这种情况下，即使我们不知道数据是如何收集的，也可以得出我们拥有具有代表性的结论。这种方法即使在我们自己收集数据时也适用。原因是，即使我们选择了抽样框并使用了概率抽样，数据收集过程中可能存在我们无法控制的不确定性，这可能仍然导致抽样偏差。例如，我们从这里收集数据的个体可能并不像我们想象的那样具有代表性。在这种，为了确保起见，我们仍然应该比较样本与总体的人口统计信息。\n\
  \n（注：原文中存在大量重复段落，根据指令要求已在翻译中避免重复输出）\n\n表 3.2 | 样本 | 总体 |\n| :--- | :--- | :--- |\n\
  | 人口统计属性 | 特征 | |\n| | | |\n| 在这种情况下，即使我们不知道数据是如何收集的，也可以得出我们拥有具有代表性的结论。这种方法即使在我们自己收集数据时也适用。原因是，即使我们选择了抽样框并使用了概率抽样，数据收集过程中可能存在我们无法控制的不确定性，这可能仍然导致抽样偏差。例如，我们从这里收集数据的个体可能并不像我们想象的那样具有代表性。在这种，为了确保起见，我们仍然应该比较样本与总体的人口统计信息。\
