  \n## 练习\n\n# 10 集成建模\n\nDothang Truong\n\nDOI: [10.1201/9781003162872-12](https://doi.org/10.1201/9781003162872-12)\n\
  \n## 引言\n\n![](img/shut10_1.jpg)在本章中学习集成建模，这是机器学习中一种强大的方法，它可以帮助提高模型的准确性、稳健性和可解释性，同时为理解数据中的底层模式提供见解。集成建模的基本思想是，如果我们对给定的数据集有多个不同准确率或误差水平的模型，我们可以结合它们的预测来减少整体误差并增强预测能力。集成建模可以应用于多种机器学习模型，包括分类模型和关联模型。对于大型且复杂数据集，单个模型可能难以捕捉数据中所有的模式和关系，这种方法尤为有用。\n\
  \n集成建模还可以通过提供对数据底层模式的见解来提高机器学习模型的可解释性。通过结合多个模型的预测，我们可以识别哪些预测变量对做出准确预测最重要，并对模型的工作原理有更好的理解。在本章中，我们将练习在数据挖掘项目中构建集成模型。\n\
  \n## 什么是集成建模？\n\n![](img/ufig10_1.jpg)集成建模围绕这样一个核心理念展开：结合多个多样化模型的预测可以比任何孤立模型都产生更好的整体性能。简单来说，集成建模是一种机器学习方法，它涉及结合多个个体模型（称为基学习器）的预测，以产生更准确、更稳健的预测。\n\
  \n## 多样性概念\n\n![](img/icon_4.jpg)多样性是集成建模中的一个关键概念，指的是构成集集的个体基学习器之间的差异。它是贡献集成模型有效性的关键因素之一。主要目标是确保基学习者的优点和缺点互补，从而提高整体性能和稳健性。以下是集成建模中多样性的某些方面。\n\
  \n*   **数据多样性**：数据多样性指的是使用训练数据的不同子集来训练每个基学习器。例如，在基于 Bagging 的 `Random Forest` 方法中，通过随机放回选取训练数据的子集来训练单个决策树。这种多样性有助于减少过拟合，并允许集成捕捉数据分布的不同方面。\n\
  *   **算法多样性**：使用不同的机器学习算法作为基学习器是引入多样性的另一种方式。集成模型通常由具有不同底层原理的分类器或回归器组合组成。例如，梯度提升机（GBM）可以与支持向量机（SVM）和神经网络结合，为集成提供多样化的视角。\n\
  *   **变量多样性**：集成模型受益于变量多样性，这涉及使用不同的变量子集来训练基学习器。这种方法常用于随机子空间方法（Random Subspace Method）和随机补丁（Random\
  \ Patches）等集成技术。\n*   **配置多样性**：每个基学习器可以使用不同的配置进行训练，例如逐步法、隐藏单元数量或树的深度。集成模型随后利用一系列超参数配置，从而对模型的参数空间进行更全面的探索。\n\
  *   **模型架构多样性**：在深度学习集成中，通过使用具有不同深度、宽度或跳跃连接的各种架构或网络结构来实现多样性。每种架构捕捉不同的层次特征，从而增强集集的性能。\n\
  *   **训练多样性**：可以在训练过程中通过为每个基学习器使用不同的随机种子或初始化方法来引入多样性。这确保每个模型都从参数空间中的不同点开始，并在优化过程中探索不同的区域。\n\
  *   **领域多样性**：在某些情况下，可以将特定领域的模型或在不同数据集上训练的模型组合成集成模型。这在迁移学习场景中特别有用，其中从一个领域的知识被用来提高另一个相关领域的性能。\n\
  \n通过通过具有多样化的基学习器，集成模型可以共同处理数据挖掘过程的不同方面并减少单个模型的偏差。多样性对于避免“群体思维”问题至关重要，即多个模型由于相似的偏差或局限性而产生相似的错误。相反，多样化的集成培养了更稳健、更准确的决策过程，使集成建模成为应对复杂现实挑战的强大工具。\n\
  \n## 集成建模的基础概念\n\n![](img/shut3_2.jpg)集成建模是一种强大的机器学习技术，它通过结合多个个体模型的预测来提高整体性能和稳健性。表\
  \ 10.1 总结了集成建模的基础概念。\n\n| 术语 | 描述 |\n| --- | --- |\n| 集成 (Ensemble) | 集成是一种机器学习方法，涉及结合多个模型的预测以产生更准确、更稳健的预测。\
  \ |\n\n\n\n\n| 多样性 | 集成模型的主要优势在于其个体模型的多样性。通过使用不同的学习算法或在数据的不同子集上进行训练，集成可以捕捉各种模式并降低过拟合的风险。\
  \ |\n| 基学习器（个体模型） | 基学习器是构成集成模型的个别单体模型。基学习器可以是任何机器学习算法，例如决策树、支持向量机、神经网络等。 |\n| 聚合方法\
  \ | 集成模型使用聚合方法结合基学习器的预测结果。常见的聚合方法包括平均法、投票和加权投票。聚合后的结果通常比单个模型的预测更准确、更可靠。 |\n| Bagging\
  \ | Bagging（自助聚合法）是一种集成方法，涉及在训练数据的不同随机子集（有放回采样）上独立地训练多个基学习器。最终预测通常是所有基学习器预测的平均值或投票结果。\
  \ |\n| Boosting | Boosting（提升法）是一种迭代集成方法，按顺序训练基学习器，每个学习器都专注于纠正前一个学习器所犯的错误。Boosting\
  \ 为分类错误的实例分配更高的权重，有效地对挑战性样本给予更多关注。 |\n| Stacking | Stacking（堆叠泛化）是一种更复杂的集成技术，通过在多个基学习器的输出上训练一个元模型来结合它们的预测。元模型学习如何有效地对各个模型的预测加权。\
  \ |\n| 集成规模 | 集成中基学习器的数量是一个重要的考虑因素。增加集成规模可以在一定范围内提高性能，但此后收益会递减，模型可能会变得计算开销巨大。 |\n\
  | 模型选择与调优 | 集成模型需要对基学习器和配置进行仔细的选择和调优。模型和配置的不同组合会影响模型的性能。 |\n\n## 集成方法\n\n![](img/icon_8.jpg)\
  \ 现在，我们理解了集成建模的目的。但是，我们如何结合多个模型创建的预测呢？构建集成模型主要三种方法：bagging、boosting 和 stacking。\n\
  \n### Bagging\n\nBagging 是 bootstrap aggregating（自助聚合）的缩写。Bootstrapping 是一种采样技术，通过有放回程序从整个数据集中提取样本，而聚合则结合所有可能的预测结果并使其随机化。在\
  \ bagging 中，我们通过在训练数据的不同子集上训练每个模型来创建多个模型。这些子集是通过对数据进行有放回随机采样创建的。然后通过对这些模型的预测取平均值来产生最终预测。\n\
  \nBagging 特别适用于减少模型的方差。由于集成模型中的模型模型是在数据的不同子集上训练的，它们可能具有不同的偏差和方差。通过结合它们的预测，集成模型可以产生一个比任何单个模型方差更低的预测。图\
  \ 10.1 显示了 bagging 的工作原理。\n\n![图 10.1 Bagging 方法。](img/fig10_1.jpg)\n\n图 10.1 Bagging\
  \ 方法。\n\n### Boosting\n\nBoosting 是一种集成技术，通过从之前的预测器错误中学习，以便在未来做出更好的预测。在 boosting\
  \ 中，我们按顺序训练多个模型。序列中的每个模型都是在上一个模型的残差误差上训练的。这种方法有助于纠正上一个模型的错误并产生更准确的预测。然后将这些模型的预测结合起来产生最终预测。\n\
  \nBoosting 对于减少模型的偏差非常有用。由于序列中的每个模型都是在上一个模型的残差误差上训练的，它有助于纠正上一个模型的任何偏差。这种方法可以带来更准确的预测，特别是在分类问题中。Boosting\
  \ 在图 10.2 中进行了解释。\n\n![图 10.2 Boosting 方法。](img/fig10_2.jpg)\n\n图 10.2 Boosting\
  \ 方法。\n\n### Stacking\n\nStacking 经常被称为堆叠泛化。在 stacking 中，我们训练多个基学习器，并通过在它们的输出上训练一个元模型来结合它们的预测。元模型学习如何有效地对各个模型的预测加权（图\
  \ 10.3）。\n\n![图 10.3 Stacking 方法。](img/fig10_3.jpg)\n\n图 10.3 Stacking 方法。\n\n当集成中的个体模型具有不同的优点和缺点时，stacking\
  \ 是非常有用的。通过以最小化缺点的方式结合它们的预测，集成模型可以产生更准确的预测。\n\n## 聚合方法\n\n![](img/icon_8.jpg) 集成建模涉及结合基学习器的预测以获得更准确、更稳健的最终预测。在此过程中，使用聚合方法来计算或确定最终集成预测。常用的聚合方法包括平均法、投票和加权投票。\n\
  \n### 平均法\n\n- 在平均法中，通过取平均值（回归）或加权平均值（分类）来结合基学习器的预测。\n- 对于回归任务，集成预测是各个预测的平均值，产生更平滑、更稳定的最终预测。\n\
  - 在概率分类中，对不同基学习器的类别概率取平均有助于获得更有信心的事件概率估计。\n- 它非常容易实现且计算高效。\n\n### 投票\n\n- 投票用于分类任务，每个基学习器预测类别，并选择最频繁的预测作为最终集成预测。\n\
  - 这种技术适用于非概率分类器，如决策树或支持向量机。\n- 在二分类中，投票也称为多数投票，即获得基学习器最多票类别被选为集成预测。\n- 它可以使用多数投票或加权投票方案处理平局或冲突的预测。\n\
  \n### 加权投票\n\n- 加权投票是投票技术的扩展，根据性能为每个基学习器的预测分配一个 `权重`。\n- 最终集成预测是各个基学习器预测的加权组合，性能更好的模型具有更大的影响力。\n\
  \n\n\n\n\n*   加权投票允许集成模型强调更强模型的预测，从而可能提高整体准确率。\n\n## 最大值\n\n*   在最大值技术中，最终的集成预测是通过从各个模型中选择最大预测值来获得的。\n\
  *   当集成模型是非概率关联（例如决策树或神经网络）时，通常使用该方法。\n*   对于分类模型，使用后验概率（针对分类目标）的最大值作为最终的集成预测。\n\
  * 对于关联模型，使用来自不同模型的预测值（针对区间目标）的最大值作为最终的集成预测。\n*   最大值技术适用于最终预测应该更加保守，并倾向于选择单个模型中置信度最高预测的问题。\n\
  \n这些聚合方法可以应用于各种类型的问题和基学习器。每种方法在集成建模中都有其优势和应用场景。选择合适的方法取决于数据的特征、单个模型的性质以及对集成模型属性的期望。\n\
  \n## 集成建模的优缺点\n\n![](img/icon_8.jpg)集成建模是一种流行的机器学习技术，通过结合多个模型来产生更准确的预测。虽然集成建模有许多优点，但也存在一些需要考虑的缺点。在本节中，我们将讨论集成建模的优缺点。\n\
  \n### 集成建模的优点\n\n* 提高准确率：集成建模通过结合多个模型的预测可以提高模型的整体预测准确率。通过利用每个单个模型的优势同时尽可能地减少它们的弱点，集成建模可以产生比任何单个模型都更准确的预测。\n\
  * 提高泛化能力：通过使用集成建模，我们可以通过减少过拟合提高模型的泛化能力。由于集成模型是由多个模型组成的，它不太可能偏于特定类型的数据，使其适用于数据可能变化的真实世界应用。\n\
  * `稳健性`】：集成建模增强了模型的稳健性，因为它减少了噪声数据的影响。由于集成中的模型是在不同的数据子集上训练的，它们可能不受数据中相同噪声的影响。这有助于在数据存在噪声时产生更准确的预测。\n\
  * 多功能性：集成建模可以应用于各种机器学习任务，包括关联模型和分类模型。\n\n### 集成建模的缺点\n\n* 增加复杂度：集成建模可能比训练单个模型更复杂。由于集成模型涉及多个模型，它们可能需要更多的计算时间来训练。\n\
  * 过拟合：虽然集成建模可以减少过拟合，但如果操作不当，也可能导致过拟合。如果集成中的单个模型过于相似，或者集成过于复杂，它可能容易产生过拟合。\n* 可解释性：集成建模可能比单个模型更难解释。由于集成模型是由多个模型组成的，要解释每个单个模型对最终预测的贡献更加困难。\n\
  * 数据需求：集成建模可能比单个模型需要更多数据。由于多个模型的组合，我们可能需要更多数据来训练每个单个模型，这增加了整体模型的数据需求。\n\n总体而言，集成建模是一种强大的技术，可以提高机器学习模型的准确率和泛化能力。虽然集成建模有一些缺点，但其优点往往大于缺点，使其成为许多机器学习应用的热门选择。\n\
  \n## SAS Enterprise Miner – 集成节点\n\n![SAS Enterprise Miner 有一个 `Ensemble Node`（集成节点），它允许我们聚合多个模型的结果。请注意，SAS\
  \ Enterprise Miner 中的 `Ensemble Node` 实际上并不包含我们之前描述的三种特定集成方法（bagging、boosting 和\
  \ stacking）。然而，它提供了三种聚合多个模型结果的方法：平均、最大值和投票。在解释这些方法之前，我想指出，分类模型（分类目标变量）与关联模型（区间目标变量）的预测结果是不同的。具体来说，\n\
  \n* [`分类模型`]：预测结果是目标变量的后验概率。\n* [`关联模型`]：预测结果是目标变量的预测值。\n\n![](img/ufig10_2.jpg)因此，SAS\
  \ Enterprise Miner 提供了以下三种聚合方法。\n\n* `Average`（平均）：在该方法中，`Ensemble node` 的预测通过对不同模型的后验概率（针对分类目标）或预测值（针对区间目标）取平均值确定。该计算与目标事件水平无关。\n\
  * `Maximum`（最大）：`Maximum` 方法从不同模型中选择最高的后验概率（针对分类目标）或预测值（针对区间目标）作为 `Ensemble node`\
  \ 的预测。\n* `Voting`（投票）：该方法专门为分类目标设计。在使用 `Voting` 方法计算后验概率时，有两种子方法可用：`Average` 和\
  \ `Proportion`（比例）。\n    * `Average`：在使用 `Average` 方法对后验概率投票时，`Ensemble node` 根据预测相同目标事件的模型计算后验概率。例如，如果模型\
  \ `M1`、`M2` 和 `M3` 预测事件水平 `J1`，而模型 `M4` 预测事件水平 `J2`，则 `Ensemble node` 中 `J1` 的后验概率将通过对模型\
  \ `M1`、`M2` 和 `M3` 的 `J1` 后验概率取平均计算，而不考虑模型 `M4`。\n    * `Proportion`：在后验概率投票的 `Proportion`\
  \ 方法中，忽略单个模型生成的后验概率。相反，`Ensemble node` 根据预测相同事件水平的单个模型的比例计算特定目标值（例如 `J1`）的后验概率。例如，如果模型\
  \ `M1`、`M2` 和 `M3` 预测目标值 `J1`，而模型 `M4` 预测 `J2`，则 `Ensemble node` 中 `J1` 的后验概率将计算为\
  \ 3/4。\n\n## 示例：使用集成节点的分类模型\n\n\n\n\n\n![](img/icon_10.jpg)在本例中，我们将使用 `Ensemble`\
  \ 节点为 `airline recommendation` 数据集构建一个集成模型。\n\n1. **数据集**：`AirlineRecommendation.sas7bdat`\n\
  2. **目标变量**：`Recommendation`（二分类）：1 – 推荐该航空公司；0 – 不推荐该航空公司。\n3. **采样-探索-修改**：参考前面的章节。\n\
  \n### 模型\n\n在这一步中，我们使用 `Ensemble` 节点将之前配置的三个模型组合，包括 `Regression model`（第 7 章）、`Pruned\
  \ CART Tree`（第 8 章）和 `HP Neural 1`（第 9 章）。然后我们还将此集成模型与这些单个模型进行比较，以查看哪种模型的性能更好。\n\
  \n按照以下步骤创建集成模型。\n\n*   将之前的三个模型添加到同一张图中：`Regression model`（第 7 章）、`Pruned CART Tree`（第\
  \ 8 章）和 `HP Neural 1`（第 9 章）。\n    ![](img/ufig10.jpg)\n*   使用之前章节中的配置这些模型。\n* \
  \  从 `Model` 标签页将 `Ensemble` 节点拖入工作区，并连接到 `HP Neural 1`、`Regression` 和 `Pruned CART\
  \ Tree`。\n*   在 `Ensemble Train` 属性中：\n    *   在 `Class Target` 下：\n        *  \
  \ 将 `Posterior Probabilities` 设置为 `Voting`。\n        *   将 `Voting Probabilities`\
  \ 设置为 `Proportion`。\n*   从 `Assess` 标签页将 `Model Comparison` 节点拖入工作区，并连接到 `HP Neural\
  \ 1`、`Regression` 和 `Pruned CART Tree`。\n*   在 `Model Comparison Train` 属性中：\n \
  \   *   在 `Model Selection` 下：\n        *   将 `Selection Statistic` 设置为 `Misclassification\
  \ Rate`。\n        *   将 `Selection Table` 设置为 `Validation`。\n*   运行 `Model Comparison`\
  \ 节点并打开结果窗口。\n\n首先，我们比较这些模型的性能。比较结果如 表 10.2 所示，包含四种模型的指标：`misclassification rate`、`gini\
  \ coefficient`、`roc index` 以及验证样本的 `lift value`。图 10.3 和 10.4 分别展示了 ROC 图和 Lift\
  \ 图。`Pruned CART Tree` 的误分类率最低（0.2889），其次是 `Ensemble model` 和 `Regression`。如果我们检查其他指标，`HP\
  \ Neural 1` 在 `gini coefficient`、`roc index` 和 `lift value` 方面表现更好。图 10.4 和 10.5\
  \ 也包含了结果，显示 `HP Neural 1` 具有更好的 ROC 曲线和更高的 `Lift`。因此，在本例中，使用 `voting` 聚合方法的 `Ensemble\
  \ model` 性能并不优于单个模型。一种解释是该节点通过 `voting` 选项组合了三个模型，结果可能受到 `Regression model` 糟糕性能的影响。注意，此集成模型未使用\
  \ `bagging`、`boosting` 和 `stacking` 等集成方法。\n\n表 10.2 模型比较结果\n\n| Model Description\
