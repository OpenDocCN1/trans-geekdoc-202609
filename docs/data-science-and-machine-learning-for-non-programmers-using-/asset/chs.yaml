  9. 撰写报告每个部分的关键策略是什么？\n\n## 练习\n# 12 主成分分析\nDOI: [10.1201/9781003162872-14](https://doi.org/10.1201/9781003162872-14)\n\
  \n## 引言\n![](img/shut12_1.jpg)当我们处理大数据时，经常会面对一个包含大量变量的数据集，例如数百个变量。这被称为高维数据集。为了构建预测模型，研究人员倾向于将所有变量都纳入分析。这种做法有时有效，有时则不然。正如前面的章节所述，模型中包含的变量数量会影响其解释能力。模型中的变量越多，解释能力越低，因为算法必须考虑模型中所有变量的方差。大量的变量还会增加计算时间。\n\
  \n那么，如何在不影响模型有效性的情况下减少数据的数量呢？本质上取决于数据的特征。假设在探索步骤，我们发现某些变量与目标变量无关，这意味着它们对预测没有贡献。在这种情况下，我们可以使用变量选择工具选择最重要的变量，并将它们作为建模步骤的预测因子。在其他情况下，如果我们的变量是相关的，但某些变量之间高度相关呢？这意味着数据中存在相关变量子集。如果我们只保留最重要的变量而拒绝其他变量，可能会丢失信息。在这种情况下，解决方案是将这些相关变量合并为较少的新变量。简单来说，我们用一组新变量替换原始变量；每个新变量都是相关原始变量的复合。因此，我们最终得到一个变量少得的数据集。这种做法被称为降维。挑战在于这个过程会改变原始数据。因此，问题在于如何在保留原始变量信息的同时降低数据维度？\n\
  \n主成分分析（PCA）是机器学习中常用的降维技术。本质上，PCA 是一种统计技术，通过识别最重要的变量或变量组合（称为主成分）来总结高维数据集的变异。PCA\
  \ 广泛应用于计算机视觉、图像处理、数据挖掘、生物信息学等许多领域。在本章中，我们将涵盖 PCA 的基本概念、应用以及在机器学习中实现 PCA 的步骤。\n\n\
  ## 维度灾难\n\n\n\n\n![](img/icon_6.jpg)在深入讨论降维和 PCA 细节之前，我想先描述数据挖掘中的一个常见问题，*维数诅咒*。这个术语用于描述当我们在处理高维数据（即具有大量变量的数据集）时出现的问题。该术语由理查德·贝尔曼（Richard\
  \ Bellman）在优化和动态规划的背景下引入。通常情况下，随着数据集维度的增加，为了确保数据具有代表性和信息量所需的数据量会呈指数级增长。简单来说，当数据集中包含许多变量时，我们需要非常大的样本量。这种要求使得数据进行建模或分析变得日益困难，许多在低维空间表现良好的技术在高维空间中变得不可行或效果变差。\n\
  \n高维数据的主要问题之一是，随着维度的增加，数据会变得越来越稀疏。这意味着可用数据对整体分布的代表性越来越差，导致难以进行准确建模或预测。此外，高维数据通常包含冗余或无关的特征，这会进一步增加建模复杂度并降低模型性能。\n\
  \n维数诅咒对计算效率也会产生显著影响。许多机器学习算法需要大量的计算，随着维度的增加，所需的计算量可能会迅速变得无法处理。这可能导致训练时间过长、内存占用增加以及可扩展性降低。\n\
  \n为了缓解维数诅咒，可以使用降维、变量选择和正则化等技术。这些技术旨在保留重要信息的同时减少数据的维度，从而使建模和分析变得更加容易。在本章中，我们将关注最流行的降维技术之一——PCA（主成分分析）。它允许我们在降低数据维度的同时，保留原始数据中的信息。\n\
  \n## 主成分分析的基本概念\n\n![](img/ufig12_1.jpg)PCA 是一种通过在保留数据中最重要的信息的同时，降低数据维度，来探寻并识别高维数据中模式和结构的方法。换句话说，这种方法允许我们在不丢失信息的情况下，将大量变量合并为较少数的变量。这是通过将原始变量转换为一组新的变量（称为主成分）来实现的，这些变量是线性不相关的，并且能够捕获数据中最大的方差。换句话说，主成分是独特的变量，能够很好地解释数据中的方差。图\
  \ 12.1 展示了这一降维过程的插图。\n\n![图 12.1 降维插图](img/fig12_1.jpg)\n\n图 12.1 降维插图。\n\n### 主成分\n\
  \n![](img/ufig12_2.jpg)主成分是原始变量的线性组合，每个主成分代表了降维空间中的一个新维度。第一主成分捕获数据中最大的方差，随后的每个成分捕获下一个最大的方差，前提是它与之前的成分不相关。\n\
  \n### 特征值\n\n每个主成分重要性可以通过其特征值来衡量，特征值代表了该成分所捕获的数据方差量。每个主成分的特征值等于其对应特征向量长度的平方，特征向量是定义成分方向的向量。我将不再涉及特征值计算的数学细节。关键点在于，特征值允许我们确定数据集中合适的成分数量。PCA\
  \ 中有几个基本概念。表 12.1 展示了这些关键概念以及详细描述。\n\n![](img/shut3_2.jpg)\n\n表 12.1 PCA 的基本概念及描述\n\
  \n| 概念 || 描述 |\n| --- | --- |\n| 方差 || 变量的方差衡量了变量偏离均值的程度。在 PCA 中，目标是找到数据中方差最大的方向，这些方向包含了最多的信息。\
  \ |\n| --- | --- |\n| 协差 || 两个变量之间的协差衡量了它们共同变化的程度。如果两个变量的协差很高，说明它们正相关；在 PCA 中，我们期望成分是不相关的。\
  \ |\n| 特征向量和特征值 || PCA 寻找数据中具有变异性的方向。特征向量是受线性变换影响的方向，而特征值指示了每个特征向量捕获了多少方差。在 PCA\
  \ 中，主成分是协方差矩阵的特征向量，按其对应的特征值排序。 |\n| 主成分 || 主成分是对应最大特征值的特征向量。它们按重要性排序，第一主成分解释数据集中的方差，其次是第二主成分，依此类推。\
  \ |\n| 解释方差 || 每个主成分解释的方差比例对于理解数据中每个成分的重要性至关重要。它帮助我们决定在保留显著信息时保留多少个主成分。 |\n| 碎石图\
  \ || 碎石图是 PCA 中的一种可视化工具，用于展示每个主成分相关的特征值。它是一个简单的折线图，显示了每个独立主成分的特征值。碎石图根据成分解释的方差帮助确定成分的数量。\
  \ |\n| 成分旋转 || 成分旋转用于转换主成分，使成分与原始变量对齐，从而获得更具可解释性和意义的数据表示。 |\n| 正交旋转 || 正交旋转是一种旋转方法，其中旋转后的成分被限制相互正交，这意味着它们是独立且不相关的。\
  \ |\n| 斜旋转 || 斜旋转是一种旋转方法，其中允许旋转后的成分之间存在相关性。 |\n| Varimax || Varimax 是一种正交旋转方法，旨在最大化每个成分载荷平方的方差，从而产生简单且稀疏的结构，使得每个变量在一个成分上有高载荷，而在其他成分上的载荷接近零。\
  \ |\n| Oblimin || Oblimin 是一种斜旋转方法，允许旋转后的成分之间存在相关性或倾斜。Oblimin 旋转的主要目标是通过减少具有高载荷的变量数量来实现获得更简单的结构。\
  \ |\n\n\n\n\n\n| 术语 | 描述 |\n| :--- | :--- |\n| Promax | Promax 是一种斜旋转方法，它在扩展 Varimax\
  \ 旋转优势的同时，也考虑了旋转分量之间可能的相关性。它被认为是正交旋转的简单性与斜旋转的灵活性之间的折中。 |\n| 降维 | 一旦确定了主成分，就可以使用\
  \ PCA 将高维数据转换为低维数据，同时尽可能保留原始数据的变异性。保留的主成分数量决定了新数据的维度。 |\n| 重构 | PCA 允许将低维数据逆向转换回原始的高维空间。虽然在降维过程中丢失了一些信息，但重构对于解释或其他下游任务仍然是有用的。\
  \ |\n\n## PCA 在行业中的实际应用\n\n![](img/icon_4.jpg)\nPCA 在各个领域均有许多实际应用。以下是一些 PCA 应用的示例。\n\
  \n- **图像压缩**：PCA 可以通过减少图像数据的维度同时保留其核心特征来压缩图像。例如，在人脸识别系统中，PCA 可用于减少图像数据的维度以提高识别准确率。\n\
  - **金融**：在金融领域，PCA 可用于识别驱动资产收益相关性结构的底层因素。通过将资产收益的协方差矩阵分解为主成分，投资组合经理可以更好地理解组合中风险和收益的来源。\n\
  - **遗传学**：在遗传学中，PCA 可用于识别导致个体差异的遗传变异。通过分析遗传数据的主成分，研究人员可以识别具有相似遗传特征的人群，并对疾病的遗传基础产生见。\n\
  - **自然语言处理**：在自然语言处理中，PCA 可以通过提取信息量特征来减少文本数据的维度。例如，在情感分析中，PCA 可用于识别与正向或负面情感关联最强的关键词和短语。\n\
  - **营销**：在营销领域，PCA 可用于识别驱动消费者偏好行为的关键因素。通过分析客户数据的主成分，营销人员可以识别出最相似的客户群体并据此调整他们的营销策略。\n\
  \n这些只是 PCA 众多应用中的少数几例。PCA 是一种多功能且广泛使用的技术，可以帮助简化复杂数据集并揭示数据中的底层结构和模式。\n\n## PCA 在数据挖掘中的应用\n\
  \n在数据挖掘和预测建模的背景下，PCA 可用于以下两个目的：\n\n- 在监督学习的 `Modify` 步骤中，PCA 使用主成分将大量的预测变量转换为较少的预测变量。这些成分在\
  \ `Model` 步骤中被用作新的预测变量用于开发预测目标变量的预测模型。\n- 在无监督学习中，PCA 用于从数据中探索和检测底层的理论因素。主成分代表这些底层因素，这些因素可以用于构建理论研究模型，以检查它们之间的关系。\n\
  \n## 优点与缺点\n\n![](img/icon_8.jpg)\nPCA 是机器学习中用于降维的一种流行技术。它有许多重要优势，但也面临挑战。理解 PCA\
  \ 的优缺点可以帮助数据科学家在决定是否在数据挖掘项目中使用该技术时做出明智的决策。\n\n### PCA 的优点\n\n- **减少维度**：PCA 的主要优势之一是减少了数据集的维度，这使得数据更容易进行分析和可视化。\n\
  - **保留最大信息**：PCA 在减少维度的同时，保留了原始数据集中的大部分信息。它有助于最小化降维过程中的信息损失。\n- **消除相关特征**：PCA 识别出最重要的变量或变量组合（称为主成分），它们捕捉了数据中最大的变异。这些主成分之间是不相关的，这意味着它们消除了相关变量中存在的冗余信息。\n\
  - **提高准确性**：PCA 通过从数据集中移除噪声和无关变量来提高机器学习模型的准确性。\n- **加速计算**：PCA 减少了数据中的变量数量，从而可以短机器学习算法的计算时间。\n\
  \n### PCA 的缺点\n\n- **可解释性**：PCA 将原始变量转换为一组新的主成分，这很难被解释。要理解驱动数据变异的底层因素可能具有挑战性。\n\
  - **信息损失**：虽然 PCA 保留了大部分信息，但在降维过程中仍然存在信息损失。信息损失的程度取决于主成分的数量。\n- **离群值敏感性**：PCA 对数据中的离群值敏感。离群值会显著影响主成分的计算，导致结果不准确。\n\
  - **假设线性关系**：PCA 的一个关键假设是变量之间存在线性相关。如果数据存在非线性关系，PCA 可能不是降维的最佳技术。\n- **可扩展性**：PCA\
  \ 可能不适用于大规模数据集。计算时间和内存需求会随着数据集的增大而增加，这在某些情况下可能难以实现。\n\n## 主成分分析的步骤\n\n![](img/icon_7.jpg)\n\
  执行 PCA 的一般步骤描述如下。\n\n1. **数据标准化**：PCA 的第一步是对数据集进行标准化，将变量围绕零中心化并缩放为单位方差。这是为了确保方差较大的变量不会主导分析。\n\
  2. **计算协方差矩阵**：数据标准化后，计算协方差矩阵。该矩阵捕捉了数据集中变量之间的关系。\n3. **计算特征向量和特征值**：下一步是计算协方差矩阵的特征向量和特征值。特征向量代表数据变异最大的方向，而特征值代表每个特征向量所解释的变异量。\n\
  4. **按特征值对特征向量排序**：根据相应的特征值对特征向量进行排序。特征值最大的特征向量是第一个主成分。\n5. **选择主成分**：在这一步确定主成分的数量。通常基于解释方差的阈值。解释方差没有标准阈值，但通常接受\
  \ 70% 或更多。Scree plot 也是用于选择成分数量的常用方法。\n6. **转换数据**：使用选定的主成分将数据转换为低维空间。产生了一组捕捉了原始数据大部分变异的新变量。\n\
  7. **解释结果**：最后，可以分析转换后的数据以理解数据中底层的模式和结构。\n\n\n\n\n\n在 SAS Enterprise Miner 中，大多数步骤都由软件处理，我们只需要设置正确的配置。然而，有一个步骤需要我们对其有良好的理解以便做出正确的决策，那就是组件数量的选择。通常，我们选择的组件数量应该捕获总方差的高百分比，同时避免使用过多的组件，因为过多的组件会违背降维的初衷。经验法是，当增加额外的组件不再能显著降低特征值时，我们就应该停止，这意味着它不再能帮助我们更好地解释数据中的方差。这种情况下常用的方法是碎方图（scree\
  \ plot）。我将在下一节中讨论这种方法。\n\n## 碎方图与组件数量\n\n![](img/ufig12_3.jpg)碎方图是 PCA 中用于的一种图形工具，用于视觉化与每个主成分相关的特征值。碎方图有助于根据主成分解释的方差量来确定主成分的数量。\n\
  \n碎方图是一种简单的线段图，显示了每个单独主成分的特征值。它在 y 轴显示特征值，在 x 轴显示组件数量（图 12.2）。它始终显示出下降曲线，因为添加额外的组件会降低特征值。碎方图的通常外观显示出一种共同模式：左侧起点较高，随后迅速下降，最后趋于平缓。这种趋势出现是因为初始组件通常占据了方差的大部分，而随后的几个组件贡献中等，而后期的组件只解释了整体数据变异的一小部分。经验法是寻找曲线中的`肘部`（elbow），并在线条变平之前选择所有组件。例如，在本例中，我们注意到一个具有三个组件的肘部。因此，我们为\
  \ PCA 选择了三个组件。\n\n![图 12.2 碎方图示例。](img/fig12_2.jpg)\n\n图 12.2 碎方图的示例。\n\n## PCA\
  \ 中的组件旋转方法\n\n![](img/icon_8.jpg)PCA 提取的主成分是原始变量的线性组合。它们按方差从大到小的顺序排列，并且彼此正交，这意味着它们是互不相关的。然而，从\
  \ PCA 获取的主成分并不总是与原始变量对齐，它们的解释可能并不直观。PCA 旋转用于转换主成分，以实现数据更具解释性且更有意义的表示。旋转的目标是获得变量之间更简单、更有结构化的表示。\n\
  \n![](img/ufig12_4.jpg)PCA 中两种常用的旋转方法是正交旋转和倾斜旋转。这些方法旨在最大化方差、最小化组件上具有高载荷的变量数量或允许组件之间存在相关方面实现不同的目标。图\
  \ 12.3 说明了这两种方法之间的差异。\n\n![图 12.3 正交旋转与倾斜旋转。](img/fig12_3.jpg)\n\n图 12.3 正交旋转与倾斜旋转。\n\
  \n正交旋转是一种旋转方法，旋转后的组件被限制相互正交，这意味着它们是独立的且不相关的。当假设组件互不相关时，正交旋转特别有用，因为它提供了更简单、更具解释性的解决方案。\n\
  \n另一方面，倾斜旋转是一种旋转方法，允许旋转后的组件相互相关。这意味着组件可以具有共享方差，它们不再是独立的。当假设因子是相关的，或者有理论理由允许因子之间存在这种相关性时，倾斜旋转是合适的。\n\
  \n通过应用旋转方法，主成分被转换为具有更具解释性的结构，这使我们能够识别数据中的潜在因子或模式。旋转后的组件可能与原始变量更对齐，从而更容易理解变量之间的关系并解释结果。\n\
  \n需要注意的是，PCA 旋转是 PCA 分析中的一个可选步骤，并不总是必要的。执行旋转的决定取决于分析的具体目标和数据的复杂性。如果从 PCA 获取的主成分已经具有可解释性并与原始变量对齐，则可能不需要旋转。然而，如果组件复杂且难以解释，那么旋转就会很有用处。\n\
  \n### 通用旋转方法\n\nVarimax、Oblimin 和 Promax 是 PCA 中常用的旋转方法，用于实现组件更具解释性且更有意义的表示。以下是这些旋转方法的描述。\n\
  \n#### 变差最大化旋转（正交）\n\nVarimax 旋转是一种广泛使用的正交旋转方法。它的目标是最大化每个组件上载荷平方的方差，导致一种简单且稀疏的结构，其中每个变量在一个组件上具有高载荷，而在其他组件上的载荷接近于零。这种旋转方法通过减少交叉载荷并强调变量与组件之间清晰的关系，有助于实现组件的可解释性。\n\
  \n#### Oblimin 旋转（倾斜）\n\nOblimin 旋转是一种流行的倾斜旋转方法。与 Varimax 不同，Oblimin 允许旋转组件之间存在相关性或倾斜。Oblimin\
  \ 旋转的主要目标是通过最小化组件上具有高载荷的变量数量来获得更简单的结构。它允许组件之间存在相关性，这在潜在因子并非完全独立时非常有用。Oblimin 旋转通过允许组件相关提供了一种更灵活的方法，并可能对数据的更真实的表示。\n\
  \n#### Promax 旋转（倾斜）\n\nPromax 旋转是一种倾斜旋转方法，它扩展了 Varimax 旋转的优点，同时也考虑旋转组件之间可能的相关性。它被认为是正交旋转的简单性和倾斜旋转的灵活性之间的折中。Promax\
  \ 旋转包含一个控制正交的参数 `kappa`，允许组件之间存在不同程度的相关性。通过调整 `kappa` 值，可以调整 Promax 旋转以强调正交性（类似于\
  \ Varimax）或允许更多相关性（类似于 Oblimin）。这些这些旋转方法为实现从 PCA 获取的组件更具解释性且结构化的表示提供了不同的途径。旋转方法的选择取决于分析的具体目标、关于变量关系的底层假设，以及对组件所需解释性的要求。\n\
  \n## SAS Enterprise Miner 中的主成分分析\n\n![](img/icon_9.jpg)在 SAS Enterprise Miner 中，PCA\
  \ 被列在修改（Modify）组，而不是模型（Model）组。这是因为在数据挖掘中，PCA 通常用于为预测建模目的降低数据维度。也就是说，当我们有大量的变量时，可以使用\
  \ PCA 将这些变量合并为较小的组件集，然后使用这些组件作为预测建模的预测变量。\n\n\n\n\nSAS Enterprise Miner 预配置了 `PCA`\
  \ 步骤，因此我们不需要像使用 `SPSS` 等其他统计软件那样手动执行 `PCA` 过程中的每一个步骤。这使得运行 `PCA` 的过程变得更加简单，但也降低了我们在分析过程中的控制能力。然而，我们应该记住，在数据挖掘中，由于我们处理的是大量数据，我们需要自动化过程以减少分析时间。SAS\
  \ Enterprise Miner 仍然允许我们对 `PCA` 配置进行某些更改，这使我们能够生成良好的主成分用于降维。我将向你展示 SAS Enterprise\
  \ Miner 中可以更改的一些关键配置。\n\n## 示例：主成分分析\n\n![](img/icon_10.jpg)在此示例中，我们为航空公司推荐数据集构建了一个\
  \ `PCA` 模型。\n\n1. **数据集**：`AirlineRecommendation.sas7bdat`\n2. **目标变量**：`recommendation`（二分类）：1\
  \ – 推荐航空公司；0 – 不推荐航空公司。\n3. **PCA 变量**：表 12.2 显示了用于 `PCA` 的变量。注意，由于 `PCA` 是无监督学习，因此分析仅使用输入变量。目标变量\
  \ `recommend` 将在分析过程中被省略。我们还拒绝了二分类或名类型标度的输入变量，因为它们不太可能代表相关变量的子集。\n\nTable12.2 航空公司推荐数据描述\
  \ – 用于 PCA 的输入变量\n\n| 变量名称 | 标签/描述 | 标度 | 角色 |\n| --- | --- | --- | --- |\n| recommend\
  \ | 向他人推荐航空公司 | 二分类 (是/否) | 目标 |\n| airline\\_st | 航空公司状态 | 名类型 | 拒绝（剔除） |\n| age\
  \ | 年龄 | 间距 | 输入 |\n| gender | 性别 | 二分类 (男/女) | 拒绝（剔除） |\n| price\\_sensitivity\
  \ * | 价格敏感度 | 间距 | 输入 |\n| no\\_years\\_flying | 飞行年数 | 间距 | 输入 |\n| no\\_flt\\\
  _pa | 平均飞行次数 | 间距 | 输入 |\n| pct\\_ flt\\_other\\_airline | 其他航空公司的飞行占比 | 间距 | 输入\
  \ |\n| type\\_of\\_travel | 旅行目的 | 名类型 | 拒绝（剔除） |\n| no\\_other\\_lty\\_cards |\
  \ 其他忠诚卡数量 | 间距 | 输入 |\n| shopping\\_amt\\_airpt | 机场购物金额 | 间距 | 输入 |\n| eat\\_drink\\\
  _airpt | 机场餐饮花费 | 间距 | 输入 |\n| class | 乘客等级 | 名类型 | 拒绝（剔除） |\n| origin\\_state |\
  \ 出发地州 | 名类型 | 拒绝（剔除） |\n| destin\\_state | 目的地州 | 名类型 | 拒绝（剔除） |\n| depart\\_delay\
  \ | 起飞延误（分钟） | 间距 | 输入 |\n| arrival\\_delay | 到达延误（分钟） | 间距 | 输入 |\n| flt\\_cancel\
  \ | 航班取消 | 二分类 (是/否) | 拒绝（剔除） |\n| flt\\_time | 飞行时间（分钟） | 间距 | 输入 |\n| flt\\_distance\
  \ | 飞行距离（英里） | 间距 | 输入 |\n\n* **采样-探索-修改**：参考前面的章节。由于我们的间距变量存在缺失值，我们使用平均值对其进行填充。\n\
  \n### 主成分节点\n\n按照以下步骤配置 `Principal Components`（主成分）节点。\n\n1. 从 `Modify` 选项卡将 `Principal\
  \ Components` 节点拖入工作区，并将其与 `Impute` 节点连接。\n2. 在 `Principal Components Training`\
  \ 属性中，将 `Eigenvalue Source` 设置为 `Covariance`。\n3. 将其他设置保持默认值。\n4. 运行 `Principal\
  \ Components` 节点并打开 `Results` 窗口。\n\n![](img/ufig12_5.jpg)\n\n### 主成分的数量\n\n首先，查看软件确定的主成分数量，然后进行必要的调整以产生更有意义的结果。查看此结果最简单的方法是使用\
  \ `scree plot`（在 SAS Enterprise Miner 中，它被称为 `eigen plot`）。初始结果显示我们有三个成分（图 12.4）。然而，我们可以看到三成分的点并不是该图的“肘部”。这意味着使用三个成分并不能显著提高解释方差，这可能会导致无关成分。使用上述的肘部法，我们可以看到肘部出现在图中两个成分点处。\n\
  \n![图 12.4 特征值图（碎石图）。](img/fig12_4.jpg)\n\nFigure12.4 特征值图（碎石图）。\n\n因此，两个成分似乎是捕捉数据方差更好的选择，而使用三个成分可能会导致无关成分。根据这一观察，我们需要将成分数量改为\
  \ 2。\n\n为了实现这一点，请按照以下步骤操作。\n\n1. 关闭 `Results` 窗口并返回 `PCA` 图表。\n2. 在 `Principal Components\
  \ Train` 属性中，点击 `Interactive Selection` 的省略号按钮（三个点）打开 `Interactive Principal Components\
  \ Selection` 窗口（参见图 12.5）。此窗口允许我们根据评估选择成分的数量。\n3. 将导出的 `Number of Components` 改为\
  \ 2，我们将看到 `eigenvalue plot` 调整为选择三个成分。\n4. 点击 `OK`。\n5. 再次运行 `Principal Components`\
  \ 节点。\n6. 运行完成后，打开 `Results` 窗口。\n\n![图 12.5 交互主成分选择。](img/fig12_5.jpg)\n\nFigure12.5\
  \ 交互主成分选择。\n\n在 `Results` 窗口中，我们清楚看到根据上述选择从数据派出的三个成分。让我们回顾一些关键的 PCA 输出。\n\n### 主成分矩阵图\n\
  \n此可视化显示了指定主成分所有可能对的散点图。默认情况下，初始矩阵图呈现了具有第一主成分的散点图。每个数据点都被分配了对应于目标变量值的特定颜色。\n\n图\
  \ 12.6 和 12.7 显示了我们的双成分 `PCA` 模型在两个目标变量水平下的 `Principal Components Matrix` 图：`Yes\
  \ = recommend=` 和 `No = not recommend`。我们可以看到这两种情况下两个主成分之间的关系。这些图显然并不容易理解。我们不应该尝试解释图表的所有细节，而应该关注每对主成分之间的两对散点图。如你所示，我们有两个主成分，产生了两个两对图：`PC1-PC2`\
  \ 和 `PC2-PC1`。它们特别相似，只是方向不同。关键结论是这些散点图是随机的，没有显示任何模式，这意味着这些主成分是不相关的。其他输出将为我们提供关于这些成分的信息。\n\
  \n![图 12.6 主成分矩阵图（目标 = Yes）。](img/fig12_6.jpg)\n\nFigure12.6 主成分矩阵图（目标 = Yes）。\n\
  \n![图 12.7 主成分矩阵图（目标 = No）。](img/fig12_7.jpg)\n\nFigure12.7 主成分矩阵图（目标 = No）。\n\n\
  \n\n\n我们接下来查看的输出是这两个成分的主成分系数。图 12.8 和 12.9 分别显示了成分 1 和成分 2 的系数。我使用 `0.1` 作为截断值来识别每个成分的相关变量。图\
  \ 12.8 中的结果显示，成分 1 由两个主要变量组成：`flight distance` 和 `flight time`。我们可以看到这两个变量是相关的，因为它们衡量的都是飞行时长。此外，图\
  \ 12.9 显示成分 2 由两个变量组成：`shopping amount at airports` 和 `eating and drinking spending\
  \ at airports`。它们都指的是乘客在机场的支出。对于这个成分，我们不考虑 `departure delay time` 和 `arrival delay\
  \ time`，因为它们的系数低于 `0.1`，而且它们与其他两个变量明显不相关。\n\n![图 12.8 主成分系数 – 组 1.](img/fig12_8.jpg)\n\
  \n图 12.8 主成分系数 – 组 1。\n\n![图 12.9 主成分系数 – 组 2.](img/fig12_9.jpg)\n\n图 12.9 主成分系数\
  \ – 组 2。\n\n基于这些成分系数，我们可以得出结论：这两个成分是该数据的一个良好选择，因为它们捕捉了数据的方差，并为降维目的产生了有意义的主成分。这些主成分在\
  \ 表 12.3 中也可以清楚地看到。在表中，我们展示了两个成分的系数，并标记了系数为 `0.1` 或更高的变量。结果显示与我们上面观察到的成分结构相同。\n\n\
