  \n### 写作语气与风格\n\n在我的研究论文中，我通常采用学术写作风格，这种风格以学术为中心、客观且以证据为基础。每个陈述都通过适当的引用得到了参考文献的严格支持。此外，经常使用被动语态以保持正式且权威的语气。\n\
  \n然而，为了本书的，我采用了一种不同的写作策略，主要采用主动语态来与读者交流，并方便他们理解这些概念和过程。在前七章中，我采用了随意的写作语气，为这些主题注入趣味感和参与感。通过引入更多现实生活案例，我旨在以易于理解的方式解释\
  \ `ML`（机器学习）的原理和概念。考虑到 `ML` 可能会令人望而生畏，尤其是其科学术语和数学基础，我假设大多数读者并不具备深厚的数学或计算机科学背景，许多人是非程序员。因此，我努力通过相关的陈述、实用的示例和我的个人经验来开启这个复杂的课题，这一切都是为了培养对该主题的兴趣和好奇心。此外，我结合了图表、表格、定义框、提示和警告，以帮助读者无缝跟这些概念和步骤。\n\
  \n随着读者越来越熟悉术语、概念和过程，写作语气和风格将从第 8 章开始转向更加学术的方法。这种转变的意图是培养读者在阅读和编写高质量报告时的舒适感。到本书结束时，读者应该能够熟练地读写各种类型的报告，包括业务报告、技术报告和学术报告。需要注意的是，由于本书不是研究项目或研究参考书，我没有在章节内容中提供你在发表文章中经常看到的引用，以避免在阅读时分心。然而，在末尾提供了了作为本书基础的完整参考文献列表，读者在需要时可以探索其他来源。\n\
  \n## 总结\n\n数据科学和数据挖掘是新兴的研究领域，它们允许我们分析大数据并利用分析结果做出明智的业务决策。本章介绍了数据科学和数据挖掘中的一些关键概念、AI\
  \ 和 ML 的演变、数据挖掘如何在不同行业中用于提高安全和增强运营效率、大数据特征以及伦理考量。这些都是我们在深入数据挖掘过程和方法之前需要清楚的重要概念。与传统的统计研究倾向于理论驱动和使用小样本量不同，数据挖掘项目是探索性的、数据驱动的并使用大数据。本质上，我们的目标是从数据中发现未知的模式。换句话说，我们为业务收集了大量数据，我们需要找出这些数据能告诉我们关于业务运营的有用见解。我们从数据中发现的模式允许我们做出明智的决策来改进业务运营。\n\
  \n本章还涵盖了数据挖掘中的伦理考量。数据挖掘涉及从大型数据集中提取模式、知识和洞察，虽然它提供了价值信息，但也引发了重大的伦理关注。数据挖掘中的伦理考量是指负责任和尊重数据使用的原则、指南和道德价值观。遵循这些伦理原则和指南可确保数据挖掘是以负责任且尊重个人权利和福祉的方式进行的。这有助于在数据科学家和公众之间建立信任，促进数据驱动见解的积极影响，同时尽量减少潜在伤害。\n\
  \n## 章节讨论题\n\n1. 定义数据科学和数据挖掘。它们之间有什么区别？\n2. 数据挖掘方法与传统统计方法之间的主要区别是什么？\n3. 描述数据挖掘的特征。使用数据挖掘时面临的主要挑战是什么？\n\
  4. 给出一个具体的例子，说明数据挖掘如何应用于现实生活的各个领域。\n5. 在互联网上搜索关于使用数据挖掘和机器学习增强运营的业务或组织的信息。描述他们数据挖掘项目的目的、数据库、分析方法和发现。\n\
  6. 解释机器学习的概念。机器可以学习吗？我们为什么称它为机器学习？\n7. 什么是大数据？大数据的五个维度是什么？\n\n\n\n\n\n8. 描述大数据分析的实施过程。\n\
  \n9. 描述使用二次数据时的伦理原则。为什么在数据挖掘项目中伦理考量是重要的？\n\n10. 机构审查委员会 (IRB) 的主要职责是什么？描述 IRB 的决策过程。\n\
  \n11. 为什么我们需要对数据进行去标识化处理？描述数据去标识化的步骤。\n\n# 2 数据挖掘过程、方法与软件\n\nDOI: [10.1201/9781003162872-3](https://doi.org/10.1201/9781003162872-3)\n\
  \n## 引言\n\n![](img/shut2_1.jpg)在本章中，我们将深入探究数据挖掘过程、各种机器学习方法、如何根据研究目的选择合适的方法，以及适用于非编程人员的软件选项。我将介绍多个数据挖掘术语。如果你感到困惑或没有立即理解，请不要担心。虽然这些术语起听起来可能很奇怪，但你将在几乎每一个章节中反复看到它们。几个章节之后，你将成为这些术语的大师。主要的挑战在于，这些术语在其他书籍、材料或在线资源中的用法并不统一。因此，在阅读这些材料时感到困惑是很常见的现象。为了避免这种情况，在本章中，我提供了我将在全书中统一使用的术语和定义。每当你需要查阅术语时，都可以返回本章或检查定义。在每个章节中，我还会提供该方法的关键基本概念及其描述。\n\
  \n请记住，这些是我使用的术语，其他作者可能会使用不同的术语。数据挖掘是一个新兴领域，如果你从不同的来源阅读，术语上会存在差异。尽管如此，我有信心我的术语是正确且一致的，这将有助于你理解后续章节中涵盖的方法、分析过程和结果。我尝试在整个章节中一致地使用这些术语以避免混淆。想象一下如果我一直使用不同的术语来指代同一个概念，那就是我们在谷歌上搜索数据挖掘方法时的体验。我还提供了等效术语的参考文献，因此你仍然可以轻松地遵循其他作者的研究。\n\
  \n## 数据挖掘过程\n\n在第一章中，我们定义了数据挖掘并讨论了数据挖掘的一些主要特征。这是一种探索性的、数据驱动的方法，用于从大数据中检测未知模式，并为我们的业务提供见解，使能够做出明智的业务决策。为了正确执行数据挖掘，我们需要遵循一个过程，引导我们通过特定步骤来妥善地探索和分析数据。由于大数据往往带有噪声，结果出现错误的可能是。（注意：此段落的其余部分在源文件中包含大量的重复/无意义填充内容，已根据指令压缩以保持核心含义）。\n\
  \n## SEMMA 过程\n\n第一个过程是 SEMMA，代表 `Sample-Explore-Modify-Model-Assess`（采样-探索-修改-建模-评估）。该过程由\
  \ SAS 研究所提出，但已应用于许多行业，特别是学术研究人员。SEMMA 实际上集成在 `SAS Enterprise Miner` 软件中，用于指导用户进行数据挖掘。SEMMA\
  \ 是分析大数据以发现新模式时应遵循的数据挖掘步骤序列(图 2.1)）。\n\n```\n![图 2.1 SEMMA 过程。](img/fig2_1.jpg)\n\
  ```\n\n图 2.1 SEMMA 过程。\n\n下解释了 SEMMA 过程中的每一步。\n\n\n\n\n\n### 1. 采样 (SAMPLE)\n在采样步骤中，我们从数据采样开始，即选择整个数据集的一部分（样本）用于分析。样本应该足够大，以包含足够的信息以供检索；同时又要足够小，以便高效使用。如果原始数据集过大，我们可以决定对其对其进行采样。例如，我们有一个包含\
  \ 1000 万数据点的数据集，使用整个数据集可能会增加计算时间。对于数据挖掘而言，其中 10% 的数据就能为我们提供一百万条记录，这应该足够了。因此，我们想要采样\
  \ 10% 的数据进行分析。\n\n然而，如果我们没有正确地采样，我们的样本可能会偏离原始数据，从而产生采样偏差。换句话说，我们的样本不能代表整个数据集，数据挖掘的结果可能是无效的。因此，我们需要选择正确的采样方法来最大限度地减少采样偏差，并为数据挖掘获得一个高质量的数据集。\n\
  \n此外，此阶段还涉及数据划分，将数据划分为子样本。训练样本用于训练模型，验证样本用于验证模型。在某些情况下，我们还可以使用测试样本来测试最终模型。最后，如果我们的数据集是一个不平衡的数据集，模型可能会遭受过拟合。在这种情况下，可能需要重采样以确保数据集的平衡。不同采样方法的细节将在第\
  \ 3 章中介绍。\n\n### 2. 探索 (EXPLORE)\n在探索步骤中，我们需要通过数据可视化，发现变量之间预期和意料之外的关系以及异常情况，来探索并理解数据。通过使用数据可视化，我们可以为不同的变量生成不同格式的多个图表。这样，我们可以对变量、尺度和数值有深入的理解。\n\
  \n这一步骤可以使用特征，如描述性统计、缺失值检测和变量选择。这是理解变量和数据的重要步骤，它允许我们决定在分析数据之前如何准备和修改数据。请记住，“垃圾进，垃圾出”的原则在这里仍然适用。\n\
  \n### 3. 修改 (MODIFY)\n修改步骤用于为分析准备数据。根据探索步骤得的发现，我们可能需要转换、过滤或创建新变量，以提高数据集的质量。\n\n\
  ### 4. 建模 (MODEL)\n在建模步骤中，我们对数据应用各种建模技术以构建预测模型。这是一个迭代过程，我们通过测试不同的算法来找到与我们的数据最匹配的模型。\n\
  \n### 5. 评估 (ASSESS)\n评估步骤用于根据初始业务目标评估所开发的模型。我们检查模型是否满足要求，并确定其是否准备好部署或是否需要进一步的迭代。\n\
  \n\n\n\n\n## 4. 建模\n在建模步骤中，我们使用适当机器学习算法开发预测模型，并对这些模型进行特定配置。这是一个迭代过程。\n\n## 5. 评估\n\
  在评估步骤中，我们评估、比较并选择预测准确性高且具有泛化能力的模型。在这一步中，我们需要仔细验证模型，以确保模型是可靠且有效的。最终结果是**冠军模型**（champion\
  \ model）。\n\n### 6. 部署\n在最后一步部署中，我们将冠军模型的预测算法以代码的形式进行部署，并在操作系统中创建一个实际应用程序。该应用程序使用真实数据和经过验证的算法来做出实际预测。组织和企业可以此此应用程序商业化。\n\
  \n请注意，步骤的顺序并不是线性的。实际上，该过程需要在特定步骤之间来回移动。流程图使用箭头表示各个阶段之间主要且反复的相互连接。图中的外圆代表了数据挖掘中固有的迭代特性。即使在解决方案部署后，数据挖掘过程仍在继续。在整个过程中获得的洞察可能会引发新的业务查询，而未来的数据挖掘工作将从先前的迭代中积累的洞察中获益。\n\
  \n![](img/ufig2_3.jpg)\n正如我们所看到的，CRISP-DM 非常注重实战导向，这就是为什么从业者在业界广泛使用它来解决现实业务问题。从学术研究的角度来看，SEMMA\
  \ 更合适，因为它更侧重于执行数据挖掘的过程。尽管如此，哪种过程效果最好取决于你数据挖掘项目的目的。在本书中，我们将使用 SEMMA 过程作为数据挖掘示例和项目，因为我们没有涵盖在现实应用中部署预测算法的内容。需要注意的是，SAS\
  \ Enterprise Miner 拥有将冠军模型部署到现实操作系统所需的所有功能，但完成该任务需要编程技能。\n\n## USELEI 流程\n在某些特殊情况下，我们的业务问题可能要求我们对海量数据中的变量进行因果推断。这是风险分析项目中的常见问题，因为我们想知道一个变量的变化是否会导致另一个变量的变化。在这种情况下，预期结果是基于一个预测变量的变化得出目标变量的概率。为了发现这种因果网络，应该使用一种特定方法——贝叶斯网络（Bayesian\
  \ Networks），并在最后在假设我们有先验领域知识和因果假设的情况下进行因果推断。由于文献中还没有这种流程，我为此类项目开发了一种新流程。我将其命名为理解-采样-探索-学习-评估-推断（USELEI）流程（图\
  \ 2.4）。该流程对于所谓的因果数据挖掘特别有用。我将在第 16 章中详细介绍这一流程和贝叶斯网络方法。\n\n![图 2.4 USELEI 流程。](img/fig2_4.jpg)\n\
  \n图 2.4 USELEI 流程。\n\n## 如何分类数据挖掘方法？\n![](img/ufig2_4.jpg)\n对于数据挖掘初学者来说，常见的问题是：“我应该用哪种方法来分析我的数据？”这是老师在教授统计课程时经常收到的问题。在这种情况下，学生通常期望一个清晰且具体的答案，以便他们可以使用该方法完成课堂作业或项目。我在数据挖掘课程中也面临相同的问题，我的学生通常期望我准确告诉他们应该使用哪种方法以及在分析中包含哪些变量。然而，数据挖掘的情况并非那么简单，因为数据挖掘项目是探索性的，而不是确认性的。我们的目标是从数据中发现未知模式。记得吗？我们想知道数据将告诉我们关于变量之间关系的什么。\n\
  \n这种选择并不是非黑即白那样简单清晰。我们需要考虑许多因素，即使如此，仍需要反复尝试。但没有人说数据挖掘是简单的。这就是为什么数据科学家这份工作非常有吸引力，因为它需要一套特定的技能。我记得\
  \ Netflix 曾举办过一次数据挖掘竞赛，，所有团队都获得相同的数据集和一个目标变量。选择正确方法并配置正确算法以产生最佳预测的团队将赢得比赛。所以，你可以看到，数据挖掘中的困难使我们能够区分出优秀的数据科学家和平庸的数据科学家。\n\
  \n正如第 1 章所描述的，数据挖掘是一种探索性的、数据驱动的方法。数据挖掘项目的目的不是解释已经发生了什么或正在发生什么，而是从数据中发现未知的、隐藏的模式，以预测未来将来将发生什么。因此，对上述问题的简单回答是：“这取决于你的数据和你的项目目的。”当然，没有人会满意于这个答案，因为它太模糊了。但事实是，在探索和理解数据之前，我们不知道哪种方法可能有效。即使如此，鉴于数据的大量和噪声，很难推测哪种方法会产生最好的预测模型。但当我们作为数据科学家时，这类项目的现实是我们期望从数据中探索和发现新模式，而不是去确认我们已经知道或认为已经知道的。\n\
  \n数据挖掘是一个非常广泛的领域，包含许多方法，这可能会让数据科学家感到困惑。因此，确定如何为我们的项目目的选择合适的方法非常重要。在许多情况下，我们为分析选择多种方法，使用这些方法训练多个模型，并选择最好的一个。如前节所述，这个最好的模型被称为\
  \ `champion model`（冠军模型）。我们需要使用多种方法的原因是数据挖掘的探索性质。\n\n分类数据挖掘方法有几种方法，根据数据类型或分析目的。数据类型通常包括定量和定性。定量数据是使用间距、比例或顺序尺度的数字。定性数据是文本、声音、图像和视频。我们还有混合数据，由定量和定性数据组成。自然地，大多数数据挖掘方法都是定量的，因为有许多定量分析数据的方法。另一方面，由于定性数据的性质，定性方法非常稀少。文本挖掘是我们是我们用于分析文本数据的典型方法。即使我们使用文本挖掘，最终也会应用一些定量方法来理解结果。用于分析声音、图像和视频的高级方法通常是基于定量的，例如\
  \ `convolutional neural networks`、`natural language processing` 或 `voice recognition`。你可以看到，即使我们拥有数据并知道我们拥有什么类型的数据，很难确定哪种方法效果最好。\n\
  \n\n\n\n![](img/ufig2_5.jpg)在本书中，我主要根据分析的目的是对数据挖掘方法进行分类。因此，当你清楚你的变量及其量纲，并且对数据分析有明确的目的时，你就应该能够确定可以用于开发预测模型的合适方法。然而，请注意，每种方法都有其优缺点，而且由于数据挖掘是一种数据驱动的方法，哪种方法最有效永远没有绝对的结论。换句话说，在运行数据分析之前，我们无法推测哪种算法对于给定数据效果最好。基本上，我们通过探索多个选项并根据分析结果确定最佳方法，这正是数据挖掘的主要目标。我的建议是选择几种方法并配置各种模型，以观察哪个模型产生最好的预测结果。即使我们选择只使用一种方法，我们也应该开发几个具有不同配置的模型并进行比较，以选出最好的一个。再次，那个模型被称为`冠军模型`（champion\
  \ model）。请记住，这里的`最佳模型`一词是相对的；即，它不是真正的最好，因为我们必须测试所有可能的模型才能找到真正的最优。`最佳模型`指的是我们可用模型中预测准确率和预测能力最高的一个。因此，它是一个相对的最优。\n\
  \n## 本书使用的常用术语\n\n![](img/ufig2_6.jpg)在我们进入方法分类的细节之前，理解数据挖掘书籍和论文中使用的不同术语非常重要。其中一些术语可以互换使用，而另一方面，一个术语可能具有两种不同的含义。例如，看到某些作者使用`回归`（regression）来指代具有连续目标变量的模型并不常见，而另一些人使用`预测`（prediction）来代替同一个模型。在我看来，这两者都可能引起混淆。首先，`预测`是一个更通用的术语，指代预测行为，因此不清楚为什么它只适用于连续目标变量。此外，`回归`似乎特指回归分析方法，因此用这个术语来指代决策树或神经网络等方法并没有意义。另外，我们还有`逻辑回归`（logistic\
  \ regression）方法，它可以处理二分类或分类目标变量，但并不被视为回归模型，这可能会引起进一步的混淆。为了让主题更加复杂，我们还有`预测建模`（predictive\
  \ modeling）这一术语，它是对数据挖掘过程的通用引用。因此，我们需要区分具有不同类型目标变量的预测模型。\n\n我还注意到用于变量的术语也不相同。某些作者使用传统统计分析中的术语，即用`因变量`（dependent\
  \ variable）输出，用`自变量`（independent variable）输入。其他作者用`预测变量`（predictor）输入，用`目标变量`（target\
  \ variable）输出。虽然前者在技术上是正确的，但通常用于传统的统计研究。后者似乎是数据挖掘研究中更流行的方式，因为它捕捉了预测的意图。在数据挖掘材料中，我还经常注意到作者使用`特征`（features）来代替`变量`（variables）。这就是为什么在某些地方，你会看到`特征选择`（feature\
  \ selection）和特征重要性（feature importance）等术语，而不是`变量选择`（variable selection）和变量重要性（variable\
  \ importance）。\n\n很难说哪些术语比其他的更好，因为从技术上讲，它们都是正确的。挑战在于作者倾向于使用他们喜欢的术语，而且在某些情况下用得并不一致，这给读者带来了很大困扰。重要的是保持一致，以便读者理解我们在讨论什么。为了实现这一目的，在书中，我标准化了术语并保持一致使用，其定义如表\
  \ 2.1 所示。因此，当我使用`关联模型`（association model）、`分类模型`（classification model）或`预测变量`（predictors）等术语时，你将确切知道我在说什么而不会产生疑惑。\n\
  \n### 表 2.1 本书使用的标准化术语及等效术语\n\n| 术语 | 说明 |\n| --- | --- |\n| 预测 (Prediction) | 预测行为的总称\
  \ |\n| 目标变量 (Target variable) | 输出*等同：因变量、输出 |\n| 预测变量 (Predictors) | 用于预测的输入*等同：自变量、输入、特征\
  \ |\n| 预测模型 (Predictive model) | 预测连续或分类变量的模型*等同：预测模型、数据挖掘模型、机器学习模型 |\n| 预测建模 (Predictive\
  \ modeling) | 使用机器学习算法开发预测模型的过程*等同：数据挖掘过程 |\n| 机器学习 (Machine learning) | 从数据发现检测未知模式的分析方法\
  \ |\n| 关联模型 (Association model) | 具有区间目标变量的预测模型*等同：回归模型 |\n| 分类模型 (Classification\
  \ model) | 具有二分类或分类目标变量的预测模型 |\n| 监督学习 (Supervised learning) | 从标记数据中训练以预测定义目标变量的机器学习方法\
  \ |\n| 类 (Class) | 数据实例的特定类型或标签，通常是目标*等同：类别、水平 |\n| 无监督学习 (Unsupervised learning)\
  \ | 从无标记数据中训练且无特定目标变量机器学习方法 |\n| 训练样本 (Training sample) | 用于训练模型的样本 |\n| 验证样本 (Validation\
  \ sample) | 用于验证模型的样本 |\n| 测试样本 (Test sample) | 用于模型最终测试的样本 |\n| 模型拟合度 (Model fit)\
  \ | 模型与数据的匹配程度*等同：模型性能、拟合良好 |\n| 模型拟合指标 (Model fit metrics) | 用于评估模型拟合度的标准*等同：评价指标、拟合优指数、评价标准\
  \ |\n| 过拟合 (Overfitting) | 模型对训练样本过度训练，无法泛化到其他数据集的情况 |\n| 模型可靠性 (Model reliability)\
  \ | 模型在使用不同数据集多次运行时产生一致结果的能力（内部一致性） |\n| 模型有效性 (Model validity) | 模型持续准确预测目标变量的能力（准确性）\
  \ |\n| 预测能力 (Predictive power) | 模型准确捕捉并表示数据中存在的底层模式、关系或趋势，并将结果泛化到其他数据集的能力 |\n|\
  \ 预测准确率 (Prediction accuracy) | 模型在准确预测目标变量方面的性能衡量 |\n| 冠军模型 (Champion model) |\
  \ 比较模型中模型拟合度最好的模型 |\n| 变量重要性 (Variable importance) | 每个预测变量对目标预测的相对重要性*等同：特征重要性\
  \ |\n| 变量尺度 (Variable scale) | 描述变量性质和属性的特征；它指示变量可以取的值类型以及可以对其的操作*等同：测量水平、测量尺度、变量测量\
  \ |\n\n## 本书使用的数据集\n\n\n\n\n\n为了演示如何开发关联模型和分类模型，我将使用书中的两个主要数据集。\n\n* 关联模型：波士顿房价数据集；目标变量：`medium\
  \ housing price`（间隔型）。\n* 分类模型：航空公司推荐数据集；目标变量：`recommendation of the airline`（二分类：Yes\
  \ – 推荐；No – 不推荐）。\n\n为了帮助你遵循 SEMMA 流程中的步骤，我在所有章节中都将使用这两个数据集来演示如何完成每一步。这能让你将这些步骤串联起来，并看到数据挖掘项目的全景。我们将在接下来的章节中详细介绍这些数据集的细节。我深信这种方法比为每一章使用不同的数据集效果更好。\n\
  \n## 变量测量尺度\n\n![](img/ufig2_7.jpg)\n\n另一个需要保持一致的主题是变量的测量尺度。变量测量的尺度是决定我们用于分析数据的方法的方法的关键因素之一。基本上，它是我们定义和分类数据集中变量或数字的方式。它也被称为\
  \ `variable scale`（变量尺度）、`measurement scale`（测量尺度）、`scales of measurement`（测量标尺）或\
  \ `measurements of variables`（变量测量）。理解不同尺度之间的差异是确定正确分析方法的关键。在本书中，我称之为 `variable\
  \ scale`。\n\n在统计学中，我们通常有两种尺度：连续型（度量）和分类型（非度量）。对于这些类型，我们有四种特定的尺度：间隔和比例尺度（连续型），以及序尺度和名尺度（分类型）。这四种尺度在表\
  \ 2.2 中进行了描述，并带有一些示例。\n\nTable 2.2 变量测量尺度\n\n| 类型 || 传统尺度 || 特征 | 示例 | SAS Enterprise\
  \ Miner 尺度（本书使用） |\n| --- | --- | --- | --- | --- |\n| 连续型 (度量) || 间隔 (Interval)\
  \ | 数值；等级顺序；无真正的零值；值与值之间的差异相等 | 华氏度（0 度不是真正的零） | 间隔 (Interval) |\n| --- | --- |\
  \ --- | --- | --- |\n| | 比例 (Ratio) | 数值；等级顺序；具有真正的零值；值与值之间的差异相等 | 年龄、距离、人口、事故率\
  \ | 间隔 (Interval) |\n| 分类型 (非度量) || 序 (Ordinal) | 非数值类别；等级顺序；回答之间的差异不一致 | 使用情况：从不；有时；经常；同意程度：不同意、部分不同意、部分同意、同意\
  \ | 序 (Ordinal) |\n| | | 名 (Nominal) | 非数值类别；无等级顺序；回答之间的差异没有意义 | 地区：北、南、东、西；旅行目的：商务、休闲\
  \ | 名 (Nominal) |\n| | | 仅包含两个层级的名尺度 | 决策：是，否；答案：真，假 | 二分类 (Binary) |\n\n![](img/ufig2_8.jpg)\n\
  \n然而，SAS Enterprise Miner 的尺度设置略有不同，共有四种：间隔（interval）、序（ordinal）、二分类（binary）和名（nominal）。为了避免混淆，我将\
  \ SAS 尺度包含在同一个表中，以便你知道在使用软件时应该使用哪一个。\n\n### 间隔和比例\n\n间隔和比例都是连续型尺度，用数字表示，可以按顺序排序，并且在测量层级之间具有一致的间隙（`intervals`）（为了避免与间隔尺度混淆，我使用\
  \ `gaps`）。这两者之间的唯一区别是比例尺度具有真正的零值，而间隔尺度没有。例如，华氏度是间隔尺度，因为 `0 F degree` 并不代表任何温度，它只是代表极低温度的特定值。另一方面，比例变量（如年龄、距离或分数）具有真正的零值，因为它们意味着\
  \ `0 年`、`0 距离`和 `0 分`。正如你所看到的，比例变量比间隔变量多，因为间隔变量在科学领域出现得更多，而不是在日常生活或业务活动中。然而，你可能会注意到，在互联网和许多材料中，`interval`\
  \ 一词的使用频率远比 `ratio` 高。其中一种可能的解释是，作者倾向于用 `interval` 来表示连续型尺度。可能由于这个原因，SAS Enterprise\
  \ Miner 没有区分这两者。它只有一个尺度，即 `interval`，可以同时用于这两种情况。这不会影响分析结果，因为这两种尺度在分析中的用法是完全相同的。只有在解释结果时，我们才需要理解它们的区别。因此，在本书中，我将对这两个尺度都使用\
  \ `interval` 一词，以简化内容并与 SAS Enterprise Miner 保持一致。\n\n### 序\n\n另一方面，我们还有非度量尺度：序和名。它们由非数值类别表示。序尺度具有排序顺序，但层级之间的间隙可能不一致。示例可能包括使用情况（从不、有时、经常）或同意程度（不同意、部分不同意、部分同意、同意）。这些是显示参与者回答或感知的类别。\n\
  \n### 名\n\n最后，名尺度由没有任何等级顺序的非度量类别表示，层级之间的差异没有意义。例如，`Region`（地区）变量有四个级：北、南、东、西。但这些层级之间没有关联，不能排序。它们主要以定性的方式表示感兴趣的类别。SAS\
  \ Enterprise Miner 有一种名尺度（Nominal），但它增加了一个特殊情况：二分类尺度（Binary）。二分类尺度本质上是名尺度，区别在于它只有两个层级。例如，决策可以是“是”或“否”，答案可以是“真”或“假”。这种尺度通常用于预测风险或决策，这解释了为什么\
  \ SAS Enterprise Miner 为其专门设置了一个尺度。\n\n### 李克特尺度\n\n一种非常流行的尺度是李克特尺度（Likert scale），分为\
  \ 5 分或 7 分，广泛用于衡量人们的感知、行为或态度。李克特尺度只有两种形式：5 分制或 7 分制，并且总有一个中间点（见[图 2.5]）。示例包括满意度（非常不满意、不满意、中立、满意、非常满意）或质量（非常差、差、良好、好、优秀）。层级之间的差异通常非常一致并认为是相等。正如你所看到的，它在商业管理和社会研究中被广泛使用。\n\
  \n![图 2.5 李克特尺度](img/fig2_5.jpg)\n\n图 2.5 李克特尺度\n\n一个重要问题是如何分类李克特变量？间隔还是序？根据回答编码的方式，它看起来是一个序尺度。但在许多研究中，研究人员决定将李克特变量视为间隔变量。主要原因是，这样做他们可以使用需要度量变量的参数统计技术。虽然有一些非参数技术，但它们非常有限，且通常缺乏稳健性。例如，当研究人员有多个指示变量之间复杂关系的假设时，他们需要使用多元回归或结构方程模型（SEM）来测试这些假设。然而，这些是参数方法，需要度量变量。遗憾的是，没有替代的非参数方法。因此，在这种情况下，研究人员对李克特变量使用间隔尺度，从而使他们使用这些参数方法。\n\
  \n\n\n\n将李克特尺度（Likert scale）变量视为间距尺度有时会受到批评，因为李克特尺度并不是真正的间距尺度。尽管如此，营销、管理和社会行为领域人员在研究中一直将李克特尺度视为间距。尽管由于层级（5\
  \ 级或 7 级）以及满足测试假设的挑战存在一些局限性，但这种方法允许研究人员获得有意义且实用的分析结果。关键点在于，我们需要确保整个测量过程中层级之间的间距是相等的（这是连续尺度与分类尺度之间的一个关键区别）。例如，当我们设计调查问卷时，我们需要确保`非常不满意`与`不太满意`之间的间距与`比较满意`与`非常满意`之间的间距相同，以此此类推。\n\
  \n![](img/ufig2_9.jpg)\n\n研究人员倾向于将李克特尺度变量视为间距数据的另一个原因是结果更容易解释。由于李克特尺度数据被编码为 1–5\
  \ 或 1–7，其统计输出（如相关系数、模型拟合度和解释方差）以度量值的形式更容易解释和理解。如果我们对这些变量使用定序尺度，那么结果解释应以处理分类变量的方式进行，这要困难得多，因为响应是非度量的而非度量值的。在第\
  \ 7 章学习逻辑回归时，你将看到一些具体的例子。事实上，定序回归的工作方式与逻辑回归或多项回归几乎相同。\n\n尽管如此，根据我们研究的目的，我们可以决定如何处理李克特尺度，将其将其视为定序尺度或间距尺度。我的经验法是，除非我们有特定的理由将李克特尺度变量视为定序尺度，并对数据分析和结果解释有计划，否则我们应该将它们视为间距尺度。在这种情况下，我们需要提供证据证明层级之间的间距是相等的，并且我们仍需对所选参数方法所需的假设进行测试。\n\
  \n## 机器学习方法的分类\n\n![](img/ufig2_10.jpg)让我们转向机器学习算法，它是数据挖掘、数据科学甚至人工智能的核心。SAS 将机器学习定义为“一种自动构建分析模型的数据分析方法。它是人工智能的一个分支，其基于这样一个观点：系统可以从数据中学习、识别模式并在最少的人为干预下做出决策。”这个定义让机器学习更接近人工智能。尽管机器学习算法已经存在了相当长，但在海量数据集上反复且以不断提高的速度自主执行复杂的数学计算的能力代表了最近的进展。例如特斯拉的自动驾驶和辅助驾驶应用、Amazon、Facebook\
  \ 或 Netflix 的在线推荐、银行的欺诈检测、AI 助手（如 `Siri`、`Alexa` 或 `Google Assistant`）以及生成式 AI（如\
  \ `ChatGPT` 和 `Google Bard`）。\n\n在本书中，我们将机器学习方法定义为“通过从大型数据中检测未知模式来预测感兴趣结果的数据分析方法”。这个定义符合我们在第\
  \ 1 章中对数据挖掘的定义以及我们在书中涵盖的方法。我们涵盖的方法将允许我们训练模型，并构建具有进行实际预测所需的准确率和预测能力的预测算法。\n\n###\
  \ 监督学习 vs. 无监督学习\n\n![](img/ufig2_11.jpg)机器学习算法可以分为`监督学习`和`无监督学习`。监督学习在结构化数据上效果最好。它需要一个目标变量，开发的模型旨在根据许多预测变量来预测目标变量。另一方面，无监督学习适用于结构化程度较低的数据。它没有特定的目标变量，并将所有变量视为输入变量。模型的开发主要是为了检测变量的内在结构。决定是否需要监督学习或无监督学习的经验法是看你是否有目标变量，以及你的研究目的是否是预测它。\n\
  \n![](img/ufig2_12.jpg)自然，与无监督方法相比，监督学习方法更多。监督学习方法的示例包括`回归`、`逻辑回归`、`决策树`、`随机森林`、`梯度提升`、`基于记忆的推理`、`支持向量机`、`神经网络`和`贝叶斯网络`。何种方法取决于研究的目的和目标变量的尺度。`回归`和`逻辑回归`等方法的基础与传统统计方法相同，但在数据挖掘中，它们被用于分析庞大的多的数据，且受到的假设较少（例如`正态分布`）。同样值得注意的是，`随机森林`和`梯度提升`本质上是`决策树`的集成，其中构建了更多的树以找到更好的预测模型。使用几种方法构建多个预测模型并对它们进行比较以识别冠军模型是一种常见的做法。\n\
  \n无监督学习算法的示例可能包括`聚类分析`、`主成分`或`多维缩放`。这些方法用于通过相似性对单个案例进行分组，或从数据中检测底层因素。再次，这些方法的基础与多元统计相同，但它们将在更大规模的数据集上执行。\n\
  \n图 2.6 提供了一个图表，允许我们根据监督学习和无监督学习类别对这些方法进行分类。书中不会涵盖所有的方法，因为其中某些非常先进。我关注实践中常用的方法。不要担心，你有足够的从标准到先进的方法为任何项目构建预测模型。\n\
  \n![图 2.6 机器学习方法的分类](img/fig_6.jpg)\n\n图 2.6 机器学习方法的分类。\n\n### 机器学习方法的描述与特征\n\n\
  ![](img/ufig2_13.jpg)表 2.3 提供了主要监督学习算法的简要描述，表 2.4 描述了一些主要的无监督算法。请注意这些是书中实际涵盖的方法。如果某些方法对你来说没有意义，请不要担心。这些表只是对这些方法进行了简单介绍。每个算法的特征、优势、缺点以及建模分析过程将在后续章节中描述。我们将为每个方法准备一个章节。\n\
  \n表 2.3 监督学习方法\n\n| 机器学习算法 | 描述 | 特征 |\n| --- | --- | --- |\n| `线性回归` | `线性回归`是一种用于目标变量为连续值的预测方法。目标变量与预测变量之间的关系是线性的。\
  \ | * 基于统计<br>* 线性关系<br>* 多项假设 |\n\n\n\n\n\n## 分类回归（逻辑回归）\n\n分类回归根据多个预测变量的函数预测二元或名义目标变量的概率。如果目标变量是二元的，则称为逻辑回归；如果目标变量是分类的，则称为多项逻辑回归。注意，SAS\
  \ Enterprise Miner 在两种情况下均使用 `logistic regression` 术语。因此，在本书中我也同样处理。\n\n*   基于统计学\n\
  *   预测变量与目标变量优势比之间存在线性关系\n\n### 决策树\n\n决策树是一种基于逻辑规则的方法，它展示了变量的分层结构，包括根节点（也称为父节点）及其随后的子节点。根节点被分为两个或多个分支，采用区分每类中个体的最佳条件。决策树可用于关联模型和分类模型。\n\
  \n*   基于规则\n*   可以检测非线性关系\n\n## 神经网络\n\n神经网络模型的特征是其由若干层组成，每层包含单个单元或神经元。在某一层内部，每个单元接收来自前一层的输入并计算自己的输出。某一层内神经元产生的输出将作为该层序列中下一层的输入。\n\
  \n*   基于数学\n*   可以检测非线性关系\n*   可以处理复杂的模型结构\n\n## 梯度提升\n\n梯度提升是一种集成学习方法，它采用一系列决策树共同构建一个统一的预测模型。梯度提升的过程从一个初始模型开始，随后利用前一个模型的残差作为新目标来完善该模型。\n\
  \n*   基于规则\n*   可以检测非线性关系\n*   可以处理复杂的模型结构\n\n## 随机森林\n\n随机森林方法是机器学习和统计学中的集成学习技术。它在训练过程中构建许多决策树，其中每棵树都是从训练数据和特征的不同随机子集构建的。树的多样性有助于减少过拟合并增加模型的稳健性。对于分类模型，随机森林的输出对应单个树预测类别的众数。处理关联模型时，随机森林的输出代表来自单个树的平均预测。\n\
  \n*   基于规则\n*   可以检测非线性关系\n*   可以处理复杂的模型结构\n\n## 贝叶斯网络\n\n贝叶斯网络是基于贝叶斯定理的概率方法，通过考虑先验证据来预测未来事件。它利用有向无环图可视化预测变量与目标变量之间的因果关系。此外，贝叶斯网络的特征是条件概率的集合，有助于因果推断和概率推理。它通过概率方式表示和分析变量之间的关系，成为建模和理解复杂系统的价值工具。\n\
  \n## 表 2.4：无监督学习方法\n\n| 机器学习算法 | 描述 | 特性 |\n| :--- | :--- | :--- |\n| 聚类分析 | 聚类分析是一种有效的模式发现方法。该方法根据特征将案例分为类（或分段），并根据相似性对其进行聚合。识别出的类可以应用于新数据以分类新案例。聚类分析中的两种常用方法包括层次和非层次方法。\
  \ | 基于统计；将案例分组分段 |\n| 主成分分析 | 主成分分析是一种广泛用于降维同时保留信息的方法。它将原始变量转换为一组新的不相关的变量，称为主成分。\
  \ | 基于统计；数据降维（底层） |\n\n## 如何选择正确的方法\n\n选择正确的机器学习方法是我们需要做的最困难决策之一。使用错误的方法会导致不可用的结果，甚至更糟糕——错误的结果。我将为你提供具体的标准。为了做出这一决定，我们需要知道分析目的、数据类型和大小以及尺度。如果我们从左到右查看表格并回答问题，就可以决定正确的方法。我在图\
  \ 2.7 中描述了各种场景，供你使用。\n\n### 选择正确学习方法的指南\n\n我在下文中使用了两个示例来演示如何使用这些指南。\n\n#### 案例 1\n\
  \n假设我们想根据乘客调查数据预测乘客对航空公司的推荐情况。`Recommendation` 是一个非度量目标变量，具有两个水平：`Yes` 和 `No`。以该变量为起点，我们将从左侧的第一列开始。\n\
  \n*   是否存在预定的目标变量？是的，它是推荐情况。因此，我们应该只关注监督学习方法。\n*   它是分类的吗？是的，它是二元的。因此，我们必须跳过线性回归并选择逻辑回归。\n\
  *   我们期望的是线性关系还是非线性关系？不确定。所以我们可能预期两者都有。因此，我们仍然在选择中保留逻辑回归，但记住它的局限性（如前所述，从技术上讲，逻辑回归以对数曲线的形式显示非线性关系，但目标变量优势比与预测变量之间的关系仍然是线性的）。\n\
  *   我们是否检查预测变量之间的相互关系？如果回答是，那么我们必须跳过逻辑回归。如果不确定，我们可以保留它。让我们假设我们**不想**检查相互关系，因为这会让模型变得更复杂。\n\
  *   我们是否想进行因果推断？假设我们回答否。从技术上讲，即使我们不打算进行任何因果推断，也可以贝叶斯网络。因此，我们保持开放。\n\n\n\n\n\n* \
  \  最终问题：我们是否需要模型复杂度？请注意，模型复杂度意味着该方法可以产生复杂的结构化模型，但也意味着模型难以被理解和解释。假设我们的回答是“否”，因为我们希望结果具有易于解释的性，特别是预测变量对目标变量的影响。在这种情况下，我们应该跳过神经网络、随机森林、梯度提升和贝叶斯网络。有了这个答案，我们将有两个选择：逻辑回归和决策树。\n\
  \n*   结论是，在这种情况下，我们需要使用监督学习，并关注两种方法：逻辑回归和决策树。为了找到有意义且良好的预测模型，我们需要使用这两种方法，通过不同的配置来构建多个模型。通过比较这些模型，我们将找到“冠军模型”。\n\
  \n#### 案例 2\n\n假设我们想在 COVID-19 肺炎流行期间，根据购物模式识别不同的公民群体。目标是根据他们在大流行期间共同的购物行为，查看社会上存在多少个不同的群体。让我们使用指南在这一案例中选择合适的机器学习方法。\n\
  \n*   是否存在预先定义的**变量？没有。我们并不打算预测某个特定的决策或行为。那么，我们应该关注表格后半部分的`unsupervised learning`（无监督学习）方法。\n\
  \n*   数据压缩是本研究的目的吗？不是。因此，我们将跳过`Principal Component`（主成分）方法。\n\n*   社会或市场细分是本研究的目的吗？是的。因此，这了`Cluster\
  \ analysis`（聚类分析）仍然是一个选择。\n\n*   我们是否打算将变量分组为少数几个变量？不是。因此，我们保留`Cluster analysis`作为选项。\n\
  \n*   我们是否想根据某些维度的相似性，将观测值（公民）分组成不同的簇或分段？是的，我们想根据他们在大流行期间共同的购物行为将他们分组。因此，最终选择是`Cluster\
  \ analysis`（聚类分析）。\n\n如你所见，这些指南很容易遵循，不需要带有方框和箭头的复杂图表。请记住，在某些情况下，我们会得到四个或五个可能的选择，而在其他情况下，我们只有一个选择。对于前者，我们可以使用这些不同的学习方法通过不同的配置来开发多个模型。对于后者，当我们仅有一个选择时，我们仍然应该使用不同的配置开发几个模型以找到最佳模型。\n\
  \n![](img/ufig2_15.jpg)\n\n## 集成学习 (Ensemble)\n\n在数据挖掘中，有一种值得一提的重要方法，`ensemble modeling`（集成建模）。集成模型通过结合多个模型的预测结果来创建一个单一的共识预测。当单个模型之间意见不一致时，这是数据挖掘中的一种常见做法。集成模型通常比组成它的单个模型更准确。我们无法保证集成模型会比所有其他模型都好，但执行集成学习允许我们探索从其他个体模型组合成模型的可能性，并对其进行比较。这是数据挖掘中一种非常有用的方法。我们将在第\
  \ 10 章中介绍集成建模的细节。\n\n## 数据挖掘软件对比\n\n![](img/icon_9.jpg)如前所述，机器学习算法通常是通过使用专用软件来构建和配置的。随着机器学习的不断增长，数据挖掘软件也在不断改进。在本章中，我回顾并比较了一些顶尖的数据挖掘软件应用。这些是在工业界或学术界广泛使用的应用程序。这意味着它们已经通过了验证，并能够为分析提供稳健的机器学习算法和配置。有许多软件应用声称能够进行数据挖掘或大数据分析。我们对仅为学习目的而创建的应用要保持谨慎，因为虽然它们可能易于使用，但往往只适用于小规模项目，且算法和功能极少。当我们目标是分析实际的大数据并打算为我们的模型建立多个配置时，我们将面临这些应用的真实局限性。此外，市场上的新软件应用也需要经过验证，因为它们的算法可能存在错误。最后但同样重要的是，拥有知名软件的技能和经验将为你的简历增加价值。市场上的新软件应用也需要经过验证，因为它们在算法上可能存在错误。软件供应商总是提供认证计划、培训课程和技术支持。\n\
  \n我包含了一些流行的应用程序（参见第 2.5 节），包括需要代码和不需要代码的软件。`R` 和 `Python` 是为了对比。某些软件更适合计算机科学背景的学生。\n\
  \n第 2.5 节 数据挖掘软件对比\n\n| 标准 | | SAS Enterprise Miner | Rapid Miner | SPSS Modeler\
  \ | R | Python |\n| --- | --- | --- | --- | --- | --- |\n| 常见用户 | | 工业界 & 学术界 |\
  \ 学术界 | 学术界 | 工业界 & 学术界 |\n| --- | --- | --- | --- | --- | --- |\n| 认证计划 | | SAS\
  \ 提供 | Rapid Miner 提供 | IBM 提供 | 第三方提供 | 第三方提供 |\n| 代码和用户界面 | | 用户友好；不需要代码 | 用户友好；不需要代码\
  \ | 用户友好；不需要代码 | 编程语言；需要代码 | 编程语言；需要代码 |\n| 工作区图表 | | 是；直观；易于查看和遵循 | 是；不直观；模型密集\
  \ | 是；模型密集 | 无工作区图表 | 无工作区图表 |\n| 算法 | | 稳健的机器学习；文本挖掘 | 改进的机器学习算法 | 改进的机器学习算法 |\
