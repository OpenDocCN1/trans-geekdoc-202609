  \ |\n\n### 波士顿房价数据集的插补示例\n\n由于缺失值仅占数据的约 11%，我们选择使用均值插补法。打开波士顿房价项目。我们从第 3 章和第 4 章中完成的数据划分和探索步骤继续。要使用\
