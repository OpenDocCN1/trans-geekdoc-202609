  14. 最后，变量重要性表格为我们提供了。\n\n## 练习题\n\n# 9 神经网络\n\nDothang Truong\n\nDOI: [10.1201/9781003162872-11](https://doi.org/10.1201/9781003162872-11)\n\
  \n## 引言\n\n在本章中，我们关注神经网络。神经网络是机器学习和人工智能时代非常流行的方法，但它是一个相当复杂的概念，理解并实现它是具有挑战性的。寻找资源并不困难，包括视频、博客或书籍。书籍通常提供高级水平的内容，需要深厚的数学背景。我们开始看到更多用简单方式解释神经网络概念的视频，帮助观众获得基础理解。在书中，我打算用简单的方式解释神经网络方法，而不展示数学表达式，但并不是为了让它变得有趣。我希望它是实用的，这样你就可以进行真正的神经网络研究。\n\
  \n## 什么是神经网络？\n\n\n\n\n\n![](img/ufig9_1.jpg)简单来说，神经网络（`NN`）模仿了人类大脑的生物神经网络。这解释了“神经网络”这一术语的由来，也表明了这一概念的复杂性，因为我们都知道人类大脑是最极其复杂的网络。随着我们继续探索这种方法，它变得越来越复杂。这就像我们来到一个交叉路口，看到前方有更多的道路，走得越深，网络就越大。图\
  \ 9.1 显示了一些典型的神经网络架构类型。节点（也称为`细胞或神经元`）代表了网络中的一个变量或单元。这些节点可以向前、向后、回溯移动，或者与其他节点进行交互。这就是网络可能达到的复杂程度。神经网络是基于数学的，因此每种神经网络都由多个数学表达式组成，用于捕捉这些节点之间的连接。\n\
  \n![图 9.1 各种神经网络架构类型。](img/fig9_1.jpg)\n\n图 9.1 各种神经网络架构类型。\n\nSAS Institute 将神经网络定义为“具有互连节点的计算系统，其工作方式类似于人类大脑中的神经元。通过算法，它们可以识别原始数据中的隐藏模式和相关性，对其进行聚类和分类，并随着时间的推移不断地学习和改进。”这完全并不理解，对吧？\n\
  \n![](img/ufig9_2.jpg) 图 9.2 中的图表展示了神经网络的典型结构。简单来说，神经网络由输入层、隐藏层和输出层组成。输入层包含了模型中的预测器，输出层包含了我们想要预测的目标变量。隐藏层包含多个隐藏节点，它们以不同的方式将输入层连接到输出层。隐藏层在检测数据中的模式方面起着重要作用。因此，神经网络建模中的关键决策之一是我们需要多少隐藏层以及每层中的节点数量。我们稍后会讨论这一点。\n\
  \n![图 9.2 神经网络的简单示意。](img/fig9_2.jpg)\n\n图 9.2 神经网络的简单示意。\n\n让我们来看图 9.3 中的两个真实的神经网络图表。左侧，我们有一个带有一个隐藏层的典型神经网络模型。再次，这些节点被称为“细胞”或“神经元”。当我们拥有超过一个隐藏层时，该网络被称为`人工神经网络`（`ANN`）。你通过一个更常见的名称来认识它，即深度学习。当然，一个真正的深度学习网络拥有的隐藏层远不止两个或三个。\n\
  \n![图 9.3 神经网络和人工神经网络。](img/fig9_3.jpg)\n\n图 9.3 神经网络和人工神经网络。\n\n绿色节点代表输入节点，即我们模型中的预测器。蓝色节点表示输出节点，即我们模型中的目标变量。神经网络可以用于分类和连续型目标变量，因此它们非常多能。黄色节点代表隐藏节点，它们连接了输入节点和输出节点。这些连接代表了`神经网络架构或模型`。\n\
  \n![](img/shut9_4.jpg)\n\n## 神经网络的实际应用\n\n由于能够从数据中学习复杂模式并做出准确预测，神经网络在各个领域都有广泛的应用。以下是神经网络的一些实际应用。\n\
  \n*   **图像识别与计算机视觉：** 神经网络，尤其是卷积神经网络，在图像识别任务中表现出色。它们可以识别图像中的物体、人脸和场景，实现人脸识别、目标检测和自动驾驶汽车等应用。\n\
  *   **自然语言处理**（`NLP`）： 循环神经网络和 Transformer 网络彻底改变了 NLP 任务。\n*   **医疗健康：** 神经网络用于医学影像分析，如\
  \ X 光和 MRI 扫描。它们还协助诊断疾病并预测患者结果。\n*   **金融：** 神经网络用于信用风险评估、欺诈检测、股票市场预测和算法交易。\n* \
  \  **媒体与产品推荐：** 推荐引擎为流媒体平台、电子商务网站和社交媒体提供个性化内容。\n*   **飞行控制系统：** 飞行控制系统使用神经网络来优化性能并提高稳定性。它们能够适应变化状况并应对关键情况。\n\
  *   **自动驾驶车辆：** 神经网络是自动驾驶汽车的关键组件，使其解释传感器数据并安全导航。\n*   **游戏与虚拟环境：** 游戏和虚拟环境中的智能体可以通过神经网络来适应玩家行为。\n\
  *   **飞行路径预测：** 神经网络可以预测飞行路径，以提高燃油效率并减少排放。天气状况、风模式和空中交通拥堵通常包含在预测中。\n*   **航空公司行为分析：**\
  \ 航空公司可以使用神经网络分析乘客数据以理解行为模式、偏好和满意度。这些信息可以用于个性化服务并增强体验。\n*   **机器人：** 神经网络用于机器人感知、物体识别、抓取和运动控制。\n\
  *   **音乐与艺术生成：** 艺术家可以使用神经网络生成音乐、创作艺术并根据学习到的模式和风格制作视觉内容。\n\n这些只是神经网络多样实际应用的示例。它们的灵活性处理复杂数据的能力使其成为现代机器学习和人工智能领域的关键工具，影响着各个行业。\n\
  \n## 常见神经网络类型\n\n神经网络有各种架构和设计，每种都为处理特定类型的数据和项目目的而定制。常见的神经网络类型包括`前馈神经网络`（`FNN`）、`卷积神经网络`（`CNN`）、`循环神经网络`（`RNN`）、长短期记忆（`LSTM`）网络和径基函数网络（`RBFN`）。表\
  \ 9.1 描述了这些类型的网络及其优缺点。\n\n![](img/ufig9_3.jpg)\n\n表 9.1 常见神经网络类型\n\n| NN 类型 | 描述\
  \ | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| 前馈神经网络 (`FNN`) | 最简单的神经网络类型。数据从输入层到输出层单向流动。\
  \ | - 容易理解和实现。<br>- 适用于广泛的任务。 | 在复杂任务上的准确性低于其他类型的 NN。<br>- 训练速度慢。 |\n| 卷积神经网络 (`CNN`)\
  \ | 一种专门为图像处理设计的 `FNN` 类型。它使用卷积操作从图像中提取特征。 | - 非常擅长图像处理任务。<br>- 准确性高。 | - 理解和实现较为复杂。<br>-\
  \ 需要大量数据进行训练。 |\n\n\n\n\n\n### 循环神经网络 (RNN) | 一种可以处理序列数据的神经网络。它具有反馈循环，允许它记住过去的输入，并使用这些信息来处理未来的输入。\n\
  \n* 擅长涉及序列数据的任务。\n* 适用于长期依赖问题。\n\n* 理解和实现较为复杂。\n* 需要大量数据进行训练。\n\n### 长短期记忆 (LSTM)\
  \ 网络\n| `RNN` 的一种变体，专门设计用于处理序列数据中的长期依赖关系。\n\n* 非常擅长处理涉及长期依赖关系的任务。\n* 准确率高。\n\n*\
  \ 理解和实现较为复杂。\n* 需要大量数据进行训练。\n\n### 径向基函数网络 (RBFN)\n| 一种使用径向基函数计算网络输出的神经网络。\n\n*\
  \ 擅长回归任务。\n* 准确率高。\n\n* 理解和实现较为复杂。\n* 需要大量数据进行训练。\n\n## 神经网络训练\n\n![](img/ufig9_4.jpg)`前向传播`\
  \ 和 `反向传播` 是训练 `FNNs` 的两个基本过程。它们共同工作，使网络能够从数据中学习并改进其预测。`前向传播`是用于处理数据并对给定输入做出预测的基本机制。它将输入数据通过神经网络以生成预测或输出。`反向传播`也称为\
  \ `backpropagation`，是一种用于训练 `FNNs` 的学习算法。它评估预测输出与实际目标值之间的差异（误差），然后调整网络的 `weights`（权重）和\
  \ `biases`（偏置），以在训练过程中使误差最小。\n\n1. `前向传播`：\n\n   * 输入数据被馈入神经网络，它从输入层到输出层正向通过各层。\n\
  \   * 在每一层，输入数据与层的 `weights` 和 `biases` 相乘，然后对结果应用激活函数以引入非线性。\n   * 每一层的输出成为下一层的输入，此过程一直持续到在输出层生成最终输出。\n\
  \   * `前向传播` 本质上是根据神经网络当前的 `weights` 和 `biases` 进行预测的过程，而不考虑实际目标值。\n\n2. `反向传播`：\n\
  \n   * `反向传播` 是一种根据前向传播期间预测误差来更新神经网络 `weights` 和 `biases` 的学习算法。\n   * 在 `前向传播`\
  \ 和预测之后，使用 `loss function` 计算预测误差，该函数量化了预测与真实值之间的偏差，并作为网络性能的衡量。\n   * `反向传播` 通过计算\
  \ `loss function` 的 `gradients` 来工作。`gradients` 代表了 `loss` 对网络参数（`weights` 和 `biases`）变化的敏感性，指示了为了减少误差应该以什么方向和程度调整每个参数。\n\
  \   * 使用计算出的 `gradients`，通过优化算法调整 `weights` 和 `biases`，以使 `loss` 最小并提高网络性能。\n\n\
  总之，`forward propagation` 是将输入数据通过神经网络以生成预测的过程，而 `backward propagation` 是计算 `loss\
  \ function` 的 `gradients` 并使用它们在训练期间更新网络参数的过程。这些过程共同构成了训练 `FNNs` 的基础，对于使网络从数据中学习并提高其预测能力至关重要。\n\
  \n## 神经网络的优缺点\n\n![](img/icon_8.jpg)神经网络是一种非常强大的机器学习算法。这种方法已用于许多领域，并在人工智能的研究中起着至关重要的作用。尽管如此，神经网络并非完美，仍然面临挑战。对我们来说，理解这种方法的优缺点很重要，这样我们就可以决定何时是使用神经网络进行数据挖掘项目的正确时机。\n\
  \n### 神经网络的优点\n\n* `非线性`：神经网络可以很好地捕捉数据中的非线性关系，使得这种方法适用于传统线性模型可能会失败的复杂问题。\n* `适应学习`：它们可以实时学习并适应新数据。因此，它们对于数据不断变化的动态环境建模非常有效。\n\
  * `无限信息`：这种方法不仅限于输入数据，因为它使用了许多隐藏层来创建层与层之间的连接。在训练过程中会产生更多信息来生成良好的模型。\n* `并行处理`：神经网络可以同时处理多个输入。因此，它们可以用于需要高效率的任务，如图像识别和自然语言处理。\n\
  * `容错性`：这种方法对数据中的噪声和错误具有韧性。当某些数据缺失或损坏时，网络仍然可以良好运行，因为信息存储在网络中而不是数据库中。\n* `特征提取`：可以从原始数据中自动提取相关变量，消除了手动选择的需要。\n\
  \n### 神经网络的缺点\n\n* `黑箱`：神经网络通常被视为 `black box`，因为很难理解模型如何工作以及变量之间如何关联。换句话说，我们将输入数据馈给模型，它预测输出变量的值。但我们并不真正理解黑箱内部发生了什么。这种解释性的缺失可能使得该方法不适用于需要透明度的应用。\n\
  * `过拟合`：神经网络很容易产生 `overfitting`，特别是当我们使用大量数据时。这意味着它们在训练数据上表现良好，但在新的、未见过的数据上表现不佳。换句话说，模型不具泛化性。\n\
  * `数据需求`：这种方法需要大量的标注数据进行有效训练，这在某些应用中可能是一个重大的瓶颈。\n* `计算密集型`：训练过程可能是计算密集型的，需要很高的计算能力更长的训练时间。\n\
  * `超参数配置`：为神经网络设置超参数具有挑战性，并且必须仔细进行以获得最佳性能。由于确定网络架构的配置没有直接的规则，建模过程需要实验来获得最佳性能。\n\n\
  尽管有这些缺点，神经网络仍然是一种强大的机器学习方法，其应用也在迅速增长，特别是深度学习方法。通过理解其优势和劣势，我们可以为我们的研究使用这种方法制定良好的策略。再次，本书的目的是为实现神经网络（一种复杂的机器学习算法）提供简单的介绍和指南。因此，我们不会深入探讨神经网络建模中的复杂方法。\n\
  \n## 神经网络的基础概念\n\n![](img/shut3_2.jpg)如前所述，神经网络方法是一种复杂的机器学习方法。即使我们关注最简单的神经网络形式，理解模型如何工作仍然是一个挑战。以下基础概念构成了神经网络的基础，帮助你理解神经网络的架构和训练过程（表\
  \ 9.2）。\n\n### 表 9.2 神经网络的基础概念\n\n| 术语 | 描述 |\n\n| --- | --- |\n\n\n\n\n\n| 神经元\
  \ (节点) | 神经元也称为节点或单元，是神经网络的基础构建模块。它接收输入，使用激活函数对其进行处理，并产生输出。 |\n| --- | --- |\n|\
  \ [连接 (边)] | 连接连接神经元。每个连接都有一个关联的权重，该权重决定了所连神经元之间的影响程度。 |\n| [激活函数] | 激活函数是一种根据输入的加权之和来确定神经元输出的函数。常见的激活函数包括\
  \ sigmoid、`ReLU`（修正线性单元单元）和 `tanh`（双曲正切）。 |\n| 权重 | 神经元之间的每个连接都分配有一个权重，代表了该连接的强度或重要性。这些权重决定了一个神经元的输入对另一个神经元输出的影响程度。\
  \ |\n| 偏置 | 在每个神经元的输入加权和上会加上一个偏置项。它允许网络学习对某些值的偏置，并提高模型的准确性。 |\n| [层] | 神经元在神经网络中按层组织。输入层接收输入数据，输出层产生最终输出，中间可以有一个或多个隐藏层。\
  \ |\n| 前向传播 | 前向传播是输入信号逐层通过网络传输以产生输出的过程。层中的每个神经元接收来自上一层的输入，使用其激活函数进行计算，并将输出传递到下一层。\
  \ |\n| [反向传播 (或后向传播)] | 反向传播是根据预测误差调整网络中权重和偏置的过程。它涉及计算损失函数的梯度并调整参数以最小化误差。 |\n| 训练\
  \ | 训练神经网络涉及使用训练数据集迭代地调整权重和偏置。目标是最小化误差或损失函数，并提高网络的预测准确性。 |\n| 损失函数 | 损失函数衡量神经网络的预测输出与实际目标值之间的差异。它量化了误差，并指导训练期间参数的调整。\
  \ |\n| 优化算法 | 优化算法在训练期间用于根据计算出的梯度调整网络参数。梯度下降是用于此目的的常用优化算法。 |\n\n## 神经网络模型连接\n\n\
  现在，我们对神经网络有了一些基本的了解。如之前的 [图 9.3] 所示，神经网络模型由输入节点、隐藏节点和输出节点之间的连接组成。那么，我们如何在不涉及复杂数学的情况下表达这些连接呢？为了演示这一点，我使用了一个带有一个隐藏层的神经网络架构。[图\
  \ 9.4] 以简单的方式展示了节点之间的连接。\n\n![图 9.4 神经网络模型中节点之间的连接。](img/fig9_4.jpg)\n\n[图 9.4]\
  \ 神经网络模型中节点之间的连接。\n\n### 网络连接\n\n基本上，输出节点是连接到该节点的隐藏节点及其对应权重的函数。本质上，从隐藏节点到输出节点的每条路径都有一个权重，类似于回归权重。权重捕捉了该关系在模型中的重要性。同样，隐藏节点是连接到该节点的输入节点及其对应权重的函数。在每个方程中，我们还有一个偏置节点。偏置是与每个节点关联的可学习参数。偏置节点允许我们将函数向左或向右移动，这对于训练模型至关重要。我们一直提到的函数被称为\
  \ `激活函数`。这些连接的数学表达式要复杂得多，但请相信我，它们的意思仅于此。我们将很快进入一些常用激活函数的细节。\n\n所以你可能会奇怪，为什么我不将这些方程表示为带有截距加上回归权重乘以输入变量加上误差的线性回归方程。原因是\
  \ `激活函数` 可能是线性的，也可能是非线性的。这是神经网络的优势，因为它可以捕捉复杂网络架构中输入节点、隐藏节点和输出节点之间的非线性关系。\n\n## 激活函数\n\
  \n![](img/ufig9_5.jpg) 再次，`激活函数` 是一种根据输入节点或一组输入节点来确定输出节点的函数。`激活函数` 是网络的重要组成部分，因为它引入了非线性，并使网络能够模拟复杂的非线性关系。如之前解释，`激活函数`接收节点输入的加权之和，加上偏置项，然后应用非线性变换以产生节点的输出。此输出随后被传递到网络的下一层。网络可以使用许多不同类型的激活函数，每种函数都有自己的优缺点。[表\
  \ 9.3] 显示了 SAS Miner 中提供的激活函数。\n\n### 表 9.3: 激活函数（SAS Miner 可用）\n\n| 函数名称 | 范围 |\
  \ 关于 x 的表达式 | 图表 |\n| :--- | :--- | :--- | :--- |\n| 恒等 (Identity) | (-∞, ∞) | `x`\
  \ | 线性 | images/tab9_a.jpg |\n| Logistic (或 Sigmoid) | (0, 1) | `1/(1+exp(-x))`\
  \ | 二分类分类模型 | images/tab9_b.jpg |\n| 双曲正切 (或 Tanh) | (-1, 1) | `tanh(x)=[2/(1+exp(-2x))]`\
  \ | 带有负目标值的分类模型 | images/tab9_c.jpg |\n| Softmax | (0, 1) | `exp(x)/Sum(exp(x))`\
  \ | 多分类问题。 | images/tab9_d.jpg |\n| 指数 (Exponential) | (0, ∞) | `exp(x)` | | images/tab9_e.jpg\
  \ |\n| 倒数 (Reciprocal) | (0, ∞) | `1/x` | | images/tab9_f.jpg |\n| 正弦 (Sine) | [-1,\
  \ 1] | `sin(x)` | | images/tab9_g.jpg |\n| 平方 (Square) | (0, ∞) | `x²` | | images/tab9_h.jpg\
  \ |\n| 正态 (Normal) | (0, ∞) | | | images/tab9_i.jpg |\n\n**恒等 (线性)**：恒等函数是一种在神经网络中常用的简单非线性函数。它原样返回输入值，这使得它在某些目标是从输出重建输入的类型神经网络架构中非常有用。该函数还被用作回归模型输出层的默认激活函数，其目标是预测连续值。在这种情况下，神经网络的输出是输入的线性组合，可以解释为回归函数。虽然恒等激活函数既简单又易于计算，但它没有在神经网络中引入任何非线性。这种限制限制了网络的能力，并使其在建模复杂函数时效果较差。\n\
  \n\n\n\n## Multilayer Perceptron Feedforward (MLP) Architecture\n\nAs mentioned\
  \ at the beginning of the chapter, neural networks have many types. `Figure 9.5`\
  \ presents four primary architectures that SAS Enterprise Miner provides for use.\n\
  \n![Figure 9.5 MLP network architectures](img/fig9_5.jpg)\n\n`Figure 9.5` MLP network\
  \ architectures. Below are brief descriptions of each:\n\n- `single layer`: This\
  \ architecture consists of only an input layer and an output layer.\n- `funnel`:\
  \ This architecture has multiple hidden layers with a decreasing number of neurons.\n\
  - `block`: This architecture has hidden layers with the same number of neurons.\n\
  - `cascade`: This architecture has hidden layers with an increasing number of neurons.\n\
  \n## Neural Network Searching\n\n![](img/icon_4.jpg)\n\nIn neural network training\
  \ process, sometimes we may face the so-called local optimum. This situation describes\
  \ a local optimum which is the optimal solution within a specific neighborhood of\
  \ candidate solutions. It differs from a global optimum, which represents the optimal\
  \ solution among all potential solutions, rather than being limited to a particular\
  \ subset. `Figure 9.6` illustrates the local optimum vs. global optimum. As you\
  \ can see, point A shows the global optimum in terms of the lowest error. The training\
  \ process may result in two local optimums, which are point B and point C, which\
  \ appear to be the network with the lowest error only within a local set of solutions.\
  \ In other words, the training process may mistake point B or point C as the optimum\
  \ due to the flaw in the learning algorithm.\n\n![Figure 9.6 Global optimum and\
  \ local optimum](img/fig9_6.jpg)\n\n`Figure 9.6` Global optimum and local optimum.\n\
  \nOf course, we want a global optimum since the local optimum is not the actual\
  \ optimal solution and may lead to a poor fit model. Overcoming local optimum problems\
  \ in neural networks is not an easy task since we must build a very good optimization\
  \ model, which is not in the scope of this book. However, a local optimum is not\
  \ always the worst thing. In some cases, when we build larger neural networks, the\
  \ local optimum with reasonably low error is acceptable.\n\n![](img/ufig9_7.jpg)\n\
  \n### SAS Enterpriser Miner's Network Searching Methods\n\n\n\n\nSAS Enterprise\
  \ Miner 在 `AutoNeural` 节点下提供了三种方法，如下：\n\n- `Train`：所有选定的函数都将进行训练，直到满足停止条件。\n- `Increment`：一次添加一个节点，且不重复使用激活函数。如果某一层降低了平均误差，则保留该层；否则将其从模型中移除。\n\
  - `Search`（`Default`）：根据预设的架构添加节点，性能最好的网络将成为最终模型。\n\n作为训练过程的一部分，利用 `AutoNeural`\
  \ 节点的 `Termination` 属性来指定终止方法。当超过最大运行时间时，训练将总是结束，并保留选择标准最佳的模型。\n\n共有三种终止方法，如下：\n\
  \n- `Overfitting`（`Default`）：当检测到过拟合时，训练终止。\n- `Training Error`（训练误差）：当训练数据集误差减少小于\
  \ 0.001 时，训练终止。\n- `Time Limit`（时间限制）：当超过 `Total Time` 属性指定的时间时，训练停止。\n\n## 归一化\n\
  \n![](img/icon_8.jpg)在我们开始构建和训练神经网络模型之前，还有最后一样我们需要了解的，那就是归一化。归一化的主要目的是将输入和输出变量转换为相同的尺度，这将有助于提高模型训练效率和结果解释。许多变量处于不同的尺度上；有时差异非常显著，这可能会导致更长的训练时间和不准确的预测。此外，解释输出也会变得更加困难。通过归一化这些变量，我们可以提高训练效率并解释结果，因为现在所有变量都在相同的尺度上。\n\
  \n有三种常用的归一化方法。不要被我下面展示的公式吓到，它们非常简单。但我关注的不是公式，而是数值范围。第一种是使用 z-score，这是统计学中的常用方法。从技术上说，z-score\
  \ 可以任意数字。但实际上，它们通常范围在 −4 到 +4 之间。z-score 更常见的范围是 −3 到 +3 之间。第二，归一化使用 `max` 和 `min`\
  \ 值，产生 0 到 1 范围的值。这种方法通常与 `sigmoid` 激活函数配合使用。第三，调整归一化也使用 `max` 和 `min` 值但经过了某些调整，产生\
  \ −1 到 +1 范围的值。这种方法通常与 `hyperbolic tangent` 激活函数配合使用。我用简单的语言提供了这三种方法的公式如下：\n\nZ-score\
  \ 方法\n\n$$new~value = \\frac{actual~value - mean~value}{standard~deviation}$$\n\n\
  使用 max 和 min 值的归一化方法\n\n$$new~value = \\frac{actual~value - min~value}{\\\\max{value\
  \ - {\\\\min{value}}}}$$\n\n调整归一化方法\n\n$$new~value = \\frac{2*\\\\left( actual~value\
  \ - {\\\\min{value}} \\right)}{\\max{value - {\\\\min{value}}}}~ - 1$$\n\n![](img/ufig9_8.jpg)\n\
  \n## SAS Enterprise Miner – DMNeural 节点\n\n![](img/icon_9.jpg)SAS Enterprise Miner\
  \ 有一个专门用于神经网络节点 `DMNeural`。基本上，该节点对训练数据集进行主成分分析以获得一组主成分，然后使用一小部分主成分进行建模。你可以在下方看到\
  \ SAS Enterprise Miner  `DMNeural` 训练过程的详细描述。我不会详细介绍。记住的重点是，该节点会自动为我们配置所有超参数并找到最好的网络。我们不需要决定这些参数使用什么。运行时间也更短。当然，由于它几乎是全自动配置，无法保证它提供的模型比其他节点更好。尽管如此，将此节点添加到我们的建模过程中仍然是的，因为它不需要任何特殊配置。我们将在示例中使用此节点。\n\
  \n## 示例：使用神经网络的分类模型\n\n![](img/icon_10.jpg)在这个示例中，我们将为*航空公司推荐*数据集构建神经网络模型。\n\n1.\
  \ `Dataset`：`airlinerecommendation.sas7bdat`\n2. `Target variable`：`recommendation`（二进制）：1\
  \ – 推荐航空公司；0 – 不推荐航空公司。\n3. `Sample-Explore-Modify`：参考前面的章节。\n\n### 模型\n\n为了演示 SAS\
  \ Enterprise Miner 提供的不同功能，我们使用 `AutoNeural`、`HP Neural` 和 `DMNeural` 节点构建了几个神经网络模型：\n\
  \n- 来自 `AutoNeural`、`HP Neural` 和 `DMNeural` 节点。\n\n#### 模型 1 (AutoNeural) – 使用块层\
  \ (Block Layers)\n\n在 `AutoNeural` 1 Train 属性中：\n\n1. 在 `Model Options` 选项卡下，将 `Architecture`\
  \ 设置为 `Block Layers`。\n2. 将 `Termination` 设置为 `Overfitting`。\n3. 因为我们有目标变量，所以使用了验证集的误分类率。\n\
  4. 将 `Tolerance` 设置为 `Medium`。\n5. 将 `Number of Hidden Units` 设置为 8。\n6. 将 `Maximum\
  \ Iteration` 设置为 20。\n7. 在 `Activation Functions` 选项卡下，将 `Direct`、`Normal` 和 `Tanh`\
  \ 属性设置为 Yes。将剩余的激活函数设置为 No。\n\n#### 模型 2 (AutoNeural) – 使用漏斗层 (Funnel Layers)\n\n\
  在 `AutoNeural` 2 Train 属性中：\n\n1. 在 `Model Options` 选项卡下，将 `Architecture` 设置为 `Funnel\
  \ Layers`。\n2. 将其他属性与模型 1 (`AutoNeural` 1) 相同。\n\n#### 模型 3 (HP Neural 1) – 使用单层\
  \ (One Layer)\n\n在 `HP Neural` 1 Train 属性中：\n\n1. 在 `Network Options` 下，将 `Number\
  \ of Hidden Neurons` 设置为 10。\n2. 将 `Architecture` 设置为 `One Layer` 并使用 `Direct`。\n\
  3. 将 `Input Standardization` 设置为 `Z-score`。\n4. 将 `Output Standardization` 设置为 `Z-score`。\n\
  5. 将 `Target Activation Function` 设置为 `Identity`。\n6. 将 `Target Error Function`\
  \ 设置为 `Normal`。\n7. 将 `Number of Tries` 设置为 10。\n8. 将 `Maximum Iterations` 属性设置为\
  \ 50。\n\n#### 模型 4 (HP Neural 2) – 使用双层 (Two Layers)\n\n在 `HP Neural 2 Train 属性中：\n\
  \n1. 在 `Network Options` 下，将 `Architecture` 设置为 `Two Layers` 并使用 `Direct`。\n2. 将其他属性与模型\
  \ 3 (`HP Neural` 1) 相同。\n\n#### 模型 5 (HP Neural 3) – 使用不同归一化方法的双层\n\n在 `HP Neural`\
  \ 3 Train 属性中（注：此处原文为 HP Neural 2，根据上下文应为 3）：\n\n1. 在 `Network Options` 下，将 `Architecture`\
  \ 设置为 `Two Layers` 并使用 `Direct`。\n2. 将 `Input Standardization` 设置为 `Range`。\n3.\
  \ 将 `Output Standardization` 设置为 `Range`。\n4. 将其他属性与模型 4 (`HP Neural` 2) 相同。\n\n\
  #### 模型 6 (DMNeural 模型)\n\n在 `DMNeural` Train 属性中：\n\n1. 在 `Model Criteria` 组下，将\
  \ `Selection` 设置为 `ACC`。\n2. 将 `Optimization` 设置为 `ACC`。\n3. 保持所有其他属性为默认。\n\n###\
  \ 评估 (Assess)\n\n从 `Assess` 标签拖入 `Model Comparison` 节点到工作区，并连接到所有神经网络模型。目的是比较这些模型并找到冠军模型。\n\
  \n在 `Model Comparison` Train 属性中：\n\n1. 在 `Model Selection` 下，将 `Selection Statistics`\
  \ 设置为 `Misclassification Rate`。\n2. 将 `Selection Table` 设置为 `Validation`。\n\n运行\
  \ `Model Comparison` 节点并打开结果窗口。\n\n\n\n\n我们使用了第 6 章中描述的标准结果呈现流程。使用验证结果进行比较。表 9.4\
  \ 比较了所有六个神经网络模型的模型拟合指标。误分类率表明，`HP Neural 1` 是准确率最高模型（误分类率最低）。其他模型拟合标准也证实了这一结果，因为该模型具有最高的`Gini`\
  \ 系数、`ROC`指数和`Lift` 值。\n\n表 9.4 模型拟合比较（验证结果）\n\n| 模型描述 | 误分类率 | Gini 系数 | ROC 指数\
  \ | Lift 值 |\n| --- | --- | --- | --- | --- |\n| HP Neural 1 | 0.219 | 0.72 | 0.85\
  \ | 1.71 |\n| --- | --- | --- | --- | --- |\n| AutoNeural 2 | 0.222 | 0.69 | 0.84\
  \ | 1.66 |\n| DMNeural | 0.231 | 0.65 | 0.82 | 1.62 |\n| HP Neural 3 | 0.232 | 0.66\
  \ | 0.83 | 1.65 |\n| HP Neural 2 | 0.233 | 0.68 | 0.84 | 1.67 |\n| AutoNeural 1\
  \ | 0.237 | 0.65 | 0.83 | 1.63 |\n\n我们还查看了`ROC`图和`Lift`图以进一步确认这一结果。如图 9.7 和 9.8\
  \ 所示，`HP Neural 1`具有最好的`ROC`图（偏离基线最远）和最好的`Lift`图（`Lift`值最高）。因此，我们可以得出结论：在我们构建的六个神经网络模型中，`HP\
  \ Neural`是冠军模型。我们应该注意到，这六个模型非常接近。例如，`HP Neural 1` 和 `AutoNeural 2` 的模型拟合效果相似。`DMNeural`排名第三，这也是一个很有趣的结果。\n\
