  \n\n\n\n\n### 3. PCA 如何通过主成分的概念来捕捉并量化数据中的变异性？\n\n### 4. 解释特征值和特征向量在确定每个主成分的重要方向方面起着什么作用？\n\
  \n### 5. PCA 在哪些场景下对数据挖掘任务特别有用？讨论 PCA 成功应用的具体领域。\n\n### 6. 可以使用哪些技术来确定给定数据集中应保留的最优主成分数量？\n\
  \n### 7. 讨论从 PCA 获取的主成分的解释性。如何理解和分析原始变量与主成分之间的关系？\n\n### 8. PCA 中成分旋转的目的是什么？讨论主要的旋转方法。\n\
  \n### 9. 讨论 PCA 实现的降维与潜在信息丢失之间的权衡。如何评估和评价降维对模型性能或数据分析结果的影响？\n\n## 练习题\n\n# 13 聚类分析\n\
  \nDOI: [10.1201/9781003162872-15](https://doi.org/10.1201/9781003162872-15)\n\n\
  ## 引言\n\n![](img/shut13_1.jpg) 在书中，我们涵盖了两种无监督学习方法。在第 12 章中，我们学习了主成分分析（PCA）。我想介绍另一种无监督学习方法是聚类分析。尽管它和\
  \ PCA 一样也是无监督学习，但聚类分析的作用完全不同。假设我们有一个大型数据集，其中的每条记录代表一个特定的案例或个人。当我们拥有包含百万条案例或个人的数据集时，在某些情况下，我们想要找出这些案例或个人是否具有相似的特征，如果是，我们如何将它们分成不同的组。这些组必须代表感兴趣领域中案例或个体的不同部分。基于这种细分，我们可以选择正确的策略来做出明智的业务决策，无论是解决这些群体的安全问题，还是针对这些客户群体营销产品或服务。这些组或部分也被称为簇（clusters），因此有了`cluster\
  \ analysis`术语。\n\n聚类分析是机器学习中一种强大的技术，用于识别具有相似特征的数据点组。它是无监督学习的一种，意味着它不需要标记数据来识别数据中的模式。相反，它使用聚类算法根据数据点之间的距离将相似的数据点归为一组。本章提供了聚类分析的介绍，包括它的定义、应用和聚类算法类型。\n\
  \n## 聚类分析的定义\n\n![](img/ufig13_1.jpg)聚类分析是一种无监督学习方法，根据相似性将相似的数据点归为簇。两个数据点之间的相似性通过它们之间的距离来衡量。聚类分析的目标是识别数据的底层结构，并将相似的数据点分组成簇或部分。预计簇之间是相互不同的，簇之间的不相似通过每对簇之间的距离来衡量。图\
  \ 13.1 展示了聚类分析的插图。\n\n![图 13.1 聚类分析插图](img/fig13_1.jpg)\n\n图 13.1 聚类分析插图。\n\n这些簇之间是相互不同的，代表了个人或案例的互斥群体。通过根据人口统计数据和相关变量检查这些簇的特征和属性，我们可以区分它们。这一步被称为`cluster\
  \ profiling`（聚类画像分析）。从聚类画像分析中识别出的画像允许决策者针对每个簇建立有效的策略。聚类分析广泛应用于各个领域，如生物学、金融、市场营销和社会科学。\n\
  \n## 聚类分析的实际应用\n\n![](img/icon_6.jpg)聚类分析是一种实用的技术，根据属性或特征将相似的对象或观测分组。它被应用于许多领域。聚类分析的一些实际应用如下：\n\
  \n* `客户细分`：在营销中，公司使用聚类分析根据客户的人口统计、地理和行为特征分组。这种聚类有助于他们识别具有相似需求和偏好的客户群体，并允许营销人员相应调整他们的营销策略。\n\
  \n* `图像分割`：聚类分析用于将图像分割具有相似颜色或纹理特征的区域。这种应用对于目标检测、图像识别和其他图像处理任务非常有用。\n\n* `欺诈检测`：金融公司通过识别性质相似的交易组来检测欺诈活动。然后他们可以识别试图通过将活动分散在多次交易中来避免检测的潜在欺诈者。\n\
  \n* `医学诊断`：在医疗保健领域，聚类分析用于根据患者的症状和病史对患者进行分组。医生可以使用它来诊断疾病并为每个患者制定个性化的治疗方案。\n\n* `自然语言处理`：在这一领域，研究人员使用聚类分析将相似的文档或单词归类。该工具对于信息检索、主题建模和其他文本处理任务非常有用。\n\
  \n* `犯罪分析`：通过使用聚类分析，执法部门可以通过将性质相似的犯罪分组来识别高犯罪率地区。警察部门利用聚类画像更有效地分配资源，并降低高风险地区的犯罪率。\n\
  \n这些仅仅是聚类分析在不同领域应用的少数例子。该技术具有广泛的适用性，可以适用于任何需要根据特征和属性将相似对象分组的情况。\n\n## PCA 与聚类分析的区别\n\
  \n![](img/icon_8.jpg)PCA 和聚类分析是两种不同的无监督机器学习方法。然而，它们都涉及根据协方差或相似性对数据集中的对象进行分组。很容易将两者混淆，这可能导致对技术的误用。因此，理解这些方法之间的差异是重要的，以便根据分析目的选择正确的方法。表\
  \ 13.1 提供了 PCA 与聚类分析的对比。\n\n表 13.1 PCA 与聚类分析的对比\n\n| 项目 | 主成分分析 (PCA) | 聚类分析 |\n\
  | --- | --- | --- |\n| 目的 | 识别解释数据变异的重要变量或变量组合，并降低数据维度。 | 根据特定特征和属性的相似性或差异性将对象或观测值分组。\
  \ |\n| --- | --- | --- |\n| 目标 | 简化数据并识别数据的底层结构，而不是对相似对象。 | 识别自然分组并理解每个群体的特征。 |\n\
  | 分析对象 | 变量 | 观测值（案例或个人） |\n| 输出 | 总结原始数据的组主成分。 | 一组簇，每个簇是相似对象的组。 |\n\n\n\n\n\n\
  | 方法 | PCA | 聚类分析 |\n| :--- | :--- | :--- |\n| 定义 | PCA 涉及创建一组新的变量，称为主成分，这些变量是原始变量的线性组合。主成分根据其重要性进行排序，第一个主成分解释了数据中最大的变异。\
  \ | 聚类分析涉及将数据划分为一组组（称为簇），使得簇内的对象彼此尽可能相似，而不同簇之间的对象尽可能不相似。 |\n| 应用 | PCA 常用于数据可视化、变量选择和降维。\
  \ | 聚类分析用于市场细分、客户画像分析和异常检测。 |\n| 相似性与差异性度量 | PCA 不涉及任何相似性或差异性度量。 | 聚类分析需要相似性或差异性度量来将相似的对象聚集在一起。\
  \ |\n\n## 聚类分析的基本概念\n\n![](img/shut3_2.jpg)聚类分析是一种数据探索和无监督机器学习技术，用于根据特征将相似的对象或观测值聚集在一起。聚类分析中包含一些基本概念。理解这些概念对于有效应用聚类技术和解释结果至关重要。表\
  \ 13.2 展示了这些概念及其描述。\n\n### 表 13.2](#chapter13.xhtml#b13tbl13_2) 聚类分析的基本概念及描述\n\n\
  | 术语 | 描述 |\n| :--- | :--- |\n| 聚类 | 根据相似性或接近性将对象或观测值分组为簇（细分）的过程。目标是创建内部同质（同一簇内的对象相似）且外部异质（不同簇之间的对象不相似）的簇。\
  \ |\n| 簇或细分 | 簇，也称为细分，是指根据某些特征或属性彼此相似的数据点或对象组。 |\n| 距离或相似性度量 | 距离也称为相似性度量，量化了对象对之间的相似性或差异性。这些度量用于确定对象之间的接近程度，并作为聚类算法的基础。常见的距离度量包括欧几里得距离、曼顿距离和余弦相似性。\
  \ |\n| 质心 | 质心是簇内对象属性的平均值。它们用于代表簇，并通常用作将新对象分配到某个簇的基础。 |\n| 树状图 | 树状图是一种树状，显示了层次聚类中簇之间的层次关系。每个分支的高度代表了该层级簇之间的距离。\
  \ |\n| 聚类算法 | 聚类算法决定簇的数量并将观测值分配到簇中。聚类算法可以分为层次聚类和划分聚类。 |\n| 层次聚类 | 层次聚类构建簇的层次结构，形成一种名为“树状图”的树形结构。\
  \ |\n| 划分聚类 | 划分聚类将数据划分为不重叠的划分或簇。它直接将每个数据点分配给特定的簇。 |\n| K-means 聚类 | K-means 是一种划分聚类算法，通过迭代更新簇质心并将数据点分配给最近的质心，将数据划分为\
  \ K 个不同的簇。目标是最小化数据点与其相应簇质心之间的距离平方和。 |\n| 簇分配 | 簇分配根据对象与簇质心的相似性将每个对象分配到特定簇的过程。分配通常通过比较对象与质心之间的距离或相似性来完成。\
  \ |\n| 聚类验证 | 聚类验证评估所得簇的质量和可靠性的过程。它涉及评估簇的内部凝聚力和分离度，以及它们的稳定性和意义。 |\n| 簇画像分析 | 簇画像涉及分析每个簇的特征，例如属性的平均值或簇内对象的分布。\
  \ |\n\n## 聚类分析的优缺点\n\n![](img/icon_8.jpg)聚类分析是一种识别数据集中模式的强大无监督技术，但它也有其局限性。在机器学习中使用它时，我们应该仔细考虑该方法的优缺点。\n\
  \n### 优点\n\n* **模式识别**：聚类分析有助于识别大型数据集中人类可能无法发现的模式。\n* 无监督学习：它是一种无监督学习方法，意味着它不需要目标变量和标记数据来识别模式。这使得在标记数据稀缺或获取昂贵的情况下非常有用。\n\
  * **数据压缩**：聚类分析通过将相似的数据点聚集在一起来小大型数据集的大小。它使得数据更容易分析和可视化。我们不再需要处理单个数据点，而是处理由簇表示的数据，从而降低了数据集的维度。\n\
  * **决策支持**：通过识别可以用于决策信息的相似对象或数据点组，帮助决策。\n* **异常检测**：聚类可以识别显著偏离簇中观察典型模式的离群值或异常。这些异常可能代表错误、异常行为或新颖的观测，需要进一步调查。\n\
  \n### 缺点\n\n* **簇数量的确定困难**：聚类分析的主要挑战之一是确定最佳的簇数量。如果簇的数量太少，可能会忽略重要的模式；如果太多，结果则可能难以解释。\n\
  * **对初始条件敏感**：该方法对初始条件（如簇中心）敏感。不同的起点可能会导致不同的结果。为了获得更稳健的结果，可能需要多次不同的初始化。\n* **离群值**：聚类分析对离群值也敏感，离群值会扭曲聚类分析的结果。\n\
  * **高维数据**：随着数据维度的增加，距离度量可能会失去意义，维度灾难会影响聚类结果。\n* **可解释性**：虽然聚类可以发现数据中的簇或细分，但簇的含义和解释通常需要进一步分析和领域知识。簇本身可能没有清晰的标签或解释，限制了它们在某些应用中的直接用途。\n\
  * **可扩展性**：该方法计算密集型，可能无法扩展到非常大的数据集。这使得它在需要实时分析的情况下难以使用。\n\n## 聚类分析过程步骤\n\n![](img/icon_7.jpg)为了进行聚类分析，通常有以下八步骤。\n\
  \n1. **数据预处理**：这一步涉及数据清洗、数据转换和变量选择。数据预处理的目标是确保数据处于适合聚类的格式。\n\n\n\n\n\n## 2. **聚类变量选择**：类是根据相似性形成的。在这一步中，我们选择用于确定对象之间相似性的变量。\n\
  \n## 3. **距离量选择**：下一步是选择一种合适的距离量，以量化对象对之间的相似性或差异性。这是一个重要的步骤，因为距离量的选择会影响聚类结果。在本书中，我们将介绍聚类分析中一些常见的距离量。\n\
  \n## 4. **聚类算法选择**：聚类算法主要分为两种：层次聚类和划分聚类。根据数据的特征和聚类分析的目的选择合适的聚类算法非常重要。\n\n## 5. **聚类数量的选择**：下一步是确定数据的最佳聚类数量。这可以通过手肘法等可视化技术，或使用统计验证指标来完成。\n\
  \n## 6. **类分配**：在这一步中，每个对象被分配到一个类中。这一步通过将所选聚类算法应用于数据来实现。换句话说，根据对象的相似性将对象分配到相应的类中。\n\
  \n## 7. **类画像描述**：一旦对象被分配到类中，下一步是对类进行画像描述。类画像涉及分析每个类的特征，例如属性的平均值或对象在类内的分布。\n\n##\
  \ 8. **类验证**：最后一步是验证聚类结果，以确保聚类结果是有意义的、可靠的且适用于数据。\n\n这些是聚类分析涉及的通用步骤。实际的聚类分析可能会根据数据的性质和聚类分析的目的对这些步骤进行变化和调整。许多数据挖掘软件应用程序内置了几个步骤的工具，这减少了我们在分析过程中的工作。我们将使用\
  \ `SAS Enterprise Miner` 提供的功能对航空公司推荐数据集进行聚类分析。我不会显式地介绍上述所有步骤，因为某些步骤已经在其他章节中涵盖或整合到软件中。\n\
  \n## 聚类距离量\n\n![](img/icon_7.jpg)距离量在聚类分析过程中以及聚类算法中起着至关重要的作用，因为它们决定了数据点之间的相似性或差异。我们在本节中介绍一些常见的距离量。[图\
  \ 13.2] 展示了这些度量及其区别。\n\n![图 13.2 不同的聚类距离度量。](img/fig13_2.jpg)\n\n图 13.2 不同的聚类距离度量。\n\
  \n### 欧几得距离\n\n这是最常见的距离量，定义为欧几里得空间中两个数据点之间的直线距离。它的测量值为两点对应坐标差平方和的平方根。\n\n距离公式如下：\n\
  \n$$d\\left( {x,y} \\right) = \\sqrt{\\left( x\\_{1} - y\\_{1} \\right)^{2} + \\\
  left( x\\_{2} - y\\_{2} \\right)^{2} + \\ldots + \\left( x\\_{n} - y\\_{n} \\right)^{2}}$$\n\
  \n其中\n\n1. `d(x, y)` 是距离\n\n### 曼哈顿距离\n\n曼哈顿距离也被称为街区距离。它通过累加坐标的绝对差之和来衡量两点之间的距离。\n\
  \n### 明可夫斯距离\n\n闵可夫斯距离是欧几里得距离和曼哈顿距离的推广。它定义为绝对差的 n 次幂和的 n 次方根。\n\n### 余弦距离\n\n余弦距离衡量向量之间的角度。当幅度不重要但方向至关重要时，通常会使用它。\n\
  \n### 海明距离\n\n海明距离通常用于二进制字符串。它衡量两个字符串在不同位置上不同的比例。\n\n### 杰卡德距离\n\n杰卡德距离是两个集合之间差异性的度量。它定义为集合并集与交集大小之差与并集大小之比。\n\
  \n\n\n\n\n图 13.3 层次聚类与划分聚类。\n\n表 13.3 层次聚类与划分聚类的区别\n\n| 层次聚类 | 划分聚类 |\n| --- | ---\
  \ |\n| 1. **层次结构**：层次聚类通过根据相似性或距离度量迭代地合并或分裂簇，从而创建一个层层嵌套的簇结构。 | 1. **固定的簇数量**：划分聚类方法（如\
  \ `k-means` 或 `k-medoids`）需要提前指定簇的数量。 |\n| 2. **凝聚与分裂型**：它可以是凝聚的（从每个数据点作为单独的簇开始，并将它们合并在一起），也可以是分裂的（从一个单一簇开始并将其拆分为更小的簇）。\
  \ | 2. **非层次性**：划分聚类不创建簇的层次结构。它根据预定义的标准将每个数据点分配给某一个且仅一个簇。 |\n| 3. **簇的数量**：层次聚类不需要提前指定簇的数量。它产生一个具有不同粒粒度的层次结构，允许用户根据自己的需求选择簇的数量。\
  \ | 3. **目标函数优化**：划分方法旨在优化目标函数，例如最小化簇内方差或最大化簇间差异性。 |\n| 4. **簇的表示**：层次聚类的结果可以使用树图（dendrograms）进行可视化，树图展示了簇的层次结构以及它们合并时的距离。\
  \ | 4. **速度**：划分算法通常比层次聚类快，特别是对于大型数据集，因为它们不需要对所有数据点进行两两距离计算。 |\n| 5. **计算开销大**：层次聚类的计算开销可能很大，特别是对于大型数据集，因为它需要计算所有数据点之间的两两距离或相似性。\
  \ | 5. **对初始化敏感**：划分方法中簇质心的初始选择会显著影响最终的聚类结果，使得它们对初始化敏感。 |\n| 6. **噪声数据处理**：该算法对数据中的噪声和离群值具有鲁健性，因为它不依赖于全局优化准则，而是依赖于局部相似性。\
  \ | 6. **离群值处理困难**：划分方法对离群值敏感，因为它们试图优化全局准则。离群值会影响簇中心并扭曲结果的簇。 |\n\n## 层次聚类\n\n![](img/icon_4.jpg)层次聚类将数据点分组成层次结构化的簇。它创建了一种名为树图（dendrogram）的树形结构，代表了不同相似性水平上的嵌套簇。层次聚类是一种更灵活的方法，因为它不需要我们预先确定簇的数量。\n\
  \n### 树图\n\n树图是层次聚类的一部分。它是层次聚类过程的可视化表示，其中数据点根据其相似性连续合并成簇。树图中的每一步都显示了通过合并两个现有簇或单个数据点形成了一个新簇。\n\
  \n为了帮助你理解树图的工作原理以及如何解释图表，我提供了一个简单的示例。假设我们有一个六个数据点的数据集：A、B、C、D、E 和 F。要使用层次聚类创建树图，我们首先将每个数据点视为单独的簇。然后，我们根据距离度量（例如\
  \ `Euclidean distance`）迭代地合并最近的簇，直到所有数据点都在一个最终簇中。图 13.4 显示了该示例的树图。\n\n![图 13.4 树图示例。](img/fig13_4.jpg)\n\
  \n图 13.4 树图示例。\n\n* A 和 B 形成簇 `[A, B]`。\n* E 和 F 形成簇 `[E, F]`。\n* 簇 `[E, F]` 与 D\
  \ 合并形成簇 `[D, [E, F]]`。\n* 簇 `[D, [E, F]]` 与 C 合并形成簇 `[C, [D, [E, F]]]`。\n* 所有数据点现在属于同一个簇。\n\
  \n如你所见，树图允许我们直观地检查数据是如何连续合并成簇的。它创建了一个簇的层次结构，且簇是嵌套并组织成树的形式的。\n\n层次聚类有两种主要类型，如下：\n\
  \n1. **凝聚聚类（自底而上）**：凝聚聚类从每个数据点作为一个单独的簇开始，迭代地合并最相似的簇，直到所有数据点属于同一个簇。在每一步中，算法根据选定的距离度量识别最近的一对簇并合并它们。这个过程一直持续到所有数据点在一个簇中（图\
  \ 13.5）。\n2. **分裂聚类（自顶而下）**：分裂聚类采取相反的方法。它从所有数据点在一个簇开始，递归地将簇拆分为更小、更不同的簇，直到每个数据点都有自己的簇。在每一步中，算法识别出最相似的簇并根据选定的距离度量将其划分为两个新簇。这个过程一直持续直到每个数据点形成一个单独的簇（图\
  \ 13.6）。\n\n![图 13.5 凝聚聚类（自底而上）。](img/fig13_5.jpg)\n\n图 13.5 凝聚聚类（自底而上）。\n\n![图\
  \ 13.6 分裂聚类（自顶而下）。](img/fig13_6.jpg)\n\n图 13.6 分裂聚类（自顶而下）。\n\n距离度量的选择在层次聚类中起着至关重要的作用。连接准则（linkage\
  \ criterion）决定了在合并或分裂过程中如何计算簇之间的距离。常见的连接方法包括单链、全链和平均链。稍后介绍不同的距离测量。\n\n层次聚类有几个优点。它可以通过形成簇的层次结构来揭示数据内在的结构和关系。树图提供了聚类过程的可视化表示，易于解释。层次聚类还能处理各种类型的数据，包括数值型、分类和二进制数据。\n\
  \n然而，层次聚类的计算开销可能很大，特别是对于大型数据集，因为需要进行两两距离计算。此外，距离度量的选择、连接准则以及树图的解释可能会根据数据和应用而异。\n\
  \n## 划分聚类\n\n![](img/icon_4.jpg)划分聚类（也称为分区聚类）是一种聚类算法，旨在将数据集划分为互不重叠的簇。与创建簇层次结构的层次聚类不同，划分聚类直接将每个数据点分配给特定的簇。目标是优化预定义的目标函数，例如最小化簇内距离并最大化簇间距离。\n\
  \n最著名的划分聚类算法之一是 `k-means`。`k-means` 方法通过迭代更新簇质心并将数据点分配给最近的质心，将数据划分为 `K` 个不同的簇。算法迭代地分配数据点并调整簇质心，直到收敛。目标是最小化数据点与其相应簇质心之间的距离平方和。\n\
  \n`k-means` 聚类算法包括以下步骤。\n\n\n\n\n\n1. **初始化**：选择聚类数量 `K`，并在数据范围内随机初始化 `K` 个质心。\n\
  2. **分配**：根据距离度量（通常是欧几里得距离）将每个数据点分配给最近的质心。这一步创建了 `K` 个聚类。\n3. **更新**：通过计算分配到该簇的所有数据点的平均值，重新计算每个聚类的质心。\n\
  4. **迭代**：重复步骤 `2` 和 `3` 直到收敛。当质心不再发生显著变化或达到预设的最大迭代次数时，即发生收敛。\n5. **结果**：一旦算法收敛，每个数据点都属于特定的聚类，聚类质心代表每个聚类的中心。\n\
  \nK-means 是一种简单且高效的算法，但其成功取决于质心的初始选择和聚类数量（`K`）。聚类数量 `K` 的选择通常基于领域知识，或使用肘部法、轮廓系数分析等技术来确定最佳聚类数。因此，可以使用不同的初始化多次运行算法，并选择误差最低的聚类结果。\n\
  \nK-means 聚类对于大型数据集具有很高的效率和可扩展性。然而，它也有一些局限性。首先，它假设聚类是球形的，且每个数据点只属于一个聚类。它对初始质心位置也敏感，这会导致不同的初始化产生不同的结果。\n\
  \n## 两步聚类分析\n\n两步聚类分析算法是聚类分析中的一种常用策略。它结合了层次聚类和 k-means 聚类的元素来执行分析。它在处理大型数据集或具有混合变量类型（连续型和分类）的数据集时特别有用。\n\
  \n该过程涉及以下两个主要步骤：\n\n1. **预聚类**：在第一步中，使用层次聚类算法（如凝聚聚类）创建一个初步的聚类方案。这一预聚类步骤有助于识别潜在的簇，并降低大型数据集的计算复杂度。\n\
  2. **两步聚类**：在这一步中，算法将 k-means 聚类算法应用于预聚类数据。k-means 算法根据案例与质心之间的距离迭代地将案例分配到簇中。每次迭代中都会重新计算质心，直到实现收敛。\n\
  \n### 两步聚类分析的优势\n\n* **适用于大型数据集**：两步聚类分析在处理大型数据集时高效且具有可扩展性。\n* **自动确定聚类数量**：该技术根据统计标准自动确定最佳聚类数量，减轻了我们预先指定聚类数量的负担。\n\
  * **处理混合数据类型**：两步聚类分析可以处理分类变量和连续变量，适用于具有不同类型变量的数据集。\n\n### 两步聚类分析的局限性\n\n* **对离群值敏感**：与其他聚类算法一样，两步聚类分析对离群值敏感，这可能会影响聚类结果。\n\
  * **依赖预定义的距离度量**：算法假设数据点之间的相似性可以使用预定义的距离度量来衡量，但这可能无法始终准确捕捉到数据的底层结构。\n* **缺乏可解释性**：生成的聚类并不总是具有清晰且易于解释的含义，需要进一步的分析和验证。\n\
  \n![](img/ufig13_4.jpg) 总体而言，两步聚类分析是数据挖掘项目的一种有用方法，因为它能很好地处理具有不同类型变量的大数据。此外，聚类数量的自动确定提高了过程的效率。\n\
  \n## 在 SAS Enterprise Miner 中聚类分析\n\n![](img/icon_9.jpg) 在 SAS Enterprise Miner\
  \ 中，聚类分析列在“探索”（Explore）组而不是“模型”（Model）组。这是因为在数据挖掘中，聚类分析通常被用于探索数据。\n\nSAS Enterprise\
  \ Miner 为聚类分析提供了两个不同的节点：模型组中的 `Cluster` 节点和 HPDM 组中的 `HP Cluster` 节点。SAS Enterprise\
  \ Miner 预配置了聚类分析步骤，因此我们不需要执行聚类分析过程中的每一个步骤。与要求用户手动执行所有步骤的传统统计软件相比，这是一个巨大的优势。这个内置工具使得运行聚类分析的过程变得更容易，但也降低了我们在分析过程中的控制能力。请记住，SAS\
  \ Enterprise Miner 使用两步聚类算法，并且对配置的更改非常有限。我将向你展示 SAS Enterprise Miner 中可以更改的一些配置。\n\
  \n### 两步聚类算法\n\nSAS Enterprise Miner 有一个内置的两步聚类算法，描述如下：\n\n* 步骤 1：使用层次聚类自动寻找聚类数量。使用立方聚类标准（`CCC`）来确定聚类数量。\n\
  * 步骤 2：使用 k-means 聚类根据距离度量将对象分配到簇中。\n\n### 距离度量\n\nSAS Enterprise Miner 未提供之前描述的所有距离度量。虽然有些人可能认为这是一个缺点，但另一些人可能认为优点，因为我们不需要花费时间选择正确的度量。软件提供了两种常用的距离度量，如下：\n\
  \n* `Cluster` 节点：欧几里得距离（Euclidean distance）。\n* `HP Cluster` 节点：欧几里得距离或曼哈顿距离（Manhattan\
  \ distance）。\n\n### 缺失值处理\n\nSAS Enterprise Miner 有一个内置的缺失值工具来处理缺失值。它提供了几种选项，包括\
  \ `Default`（默认）、`Ignore`（忽略）、`Mean`（平均值）、`Midrange`（中位范围）或 `Omit`（省略）。这个工具使我们更容易处理缺失值，因为我们不需要插补缺失值。\n\
  \n### 数据标准化\n\nSAS Enterprise Miner 还有一个内置的数据标准化工具，有助于解决离群值带来的任何问题。它提供了多种选项，包括 `None`（无）、`Standardization`（标准化，默认值）和\
  \ `Range`（范围）。\n\n## 示例：聚类分析\n\n![](img/icon_10.jpg) 在此示例中，我们对 `AirlineRecommendation`\
  \ 数据集进行聚类分析。\n\n1. **数据集**：`AirlineRecommendation.sas7dat`\n2. **目标变量**：`recommend`（二进制）：`1`\
  \ – 推荐航空公司；`0` – 不推荐航空公司。\n3. **聚类分析变量**：表 13.4 显示了用于聚类分析的变量。注意，由于聚类分析是无监督学习，分析仅使用输入变量。目标变量\
  \ `recommend` 在分析过程中被省略。假设我们的目的是根据个人在人口统计学和旅行经验方面的相似性将相似的人分组。在这种情况下，我们选择了表 13.4\
  \ 中突出显示的七个变量用于聚类分析：`age`（年龄）、`gender`（性别）、`airline status`（航空公司状态）、`average number\
  \ of flights per year`（每年平均飞行次数）、`travel purpose`（旅行目的）、`shopping amount at the\
  \ airport`（机场购物金额）和 `flight distance`（飞行距离）。从这些变量得出的聚类允许航空公司识别不同的市场细分，并建立针对这些细分市场的策略。其他变量已从此分析中排除。\n\
  \n表 13.4 用于聚类分析的航空公司推荐数据\n\n| 变量名称 | 标签/描述 | 尺度 | 角色 |\n| --- | --- | --- | ---\
  \ |\n| `recommend` | 向他人推荐航空公司 | 二进制 (是/否) | 排除 |\n| --- | --- | --- | --- |\n|\
  \ `airline_st` | 航空公司状态 | 符号 | 输入 |\n\n\n\n\n\n| age | 年龄 | 间距 | 输入 |\n| :--- |\
  \ :--- | :--- | :--- |\n| gender | 性别 | 二分类（男/女） | 输入 |\n| price\\_sensitivity |\
  \ 价格敏感度 | 间距 | 拒绝 |\n| no\\_years\\_flying | 飞行年数 | 间距 | 拒绝 |\n| no\\_flt\\_pa |\
  \ 每年飞行次数 | 间距 | 输入 |\n| pct\\_ flt\\_other\\_airline | 其他航空公司的飞行占比 | 间距 | 拒绝 |\n\
  | type\\_of\\_travel | 旅行目的 | 名分类 | 输入 |\n| no\\_other\\_lty\\_cards | 其他忠诚卡数量 |\
  \ 间距 | 拒绝 |\n| shopping\\_amt\\_airpt | 机场购物金额 | 间距 | 输入 |\n| eat\\_drink\\_airpt\
  \ | 机场餐饮花费 | 间距 | 拒绝 |\n| class | 乘客等级 | 名分类 | 拒绝 |\n| origin\\_state | 出发州 | 名分类\
  \ | 拒绝 |\n| destin\\_state | 目的地州 | 名分类 | 拒绝 |\n| depart\\_delay | 起飞延误（分钟） | 间距\
  \ | 拒绝 |\n| arrival\\_delay | 到达延误（分钟） | 间距 | 拒绝 |\n| flt\\_cancel | 航班取消 | 二分类（是/否）\
  \ | 拒绝 |\n| flt\\_time | 飞行时间（分钟） | 间距 | 拒绝 |\n| flt\\_distance | 飞行距离（英里） | 间距\
  \ | 输入 |\n\n### 4. 样本-探索-修改\n\n参考前面的章节。由于 SAS Enterprise Miner 构建了用于标准化数据和处理缺失值的工具，我们不需要预先使用\
  \ `Impute` 节点和 `Transform Variables` 节点。此外，由于我们在聚类分析中没有使用 `price sensitivity` 变量，因此不需要专门用于该变量的\
  \ `Replacement` 节点。\n\n### 聚类节点\n\n按照以下步骤配置 `Cluster` 节点。\n\n1. 从 `Explore` 节点将\
  \ `Cluster` 节点拖入工作区，并将其连接到 `Data Partition` 节点。\n\n![](img/ufig13_5.jpg)\n\n2. 在\
  \ `Cluster Training` 属性中：\n    * 将 `Internal Standardization` 设置为 `Standardization`。\n\
  \    * 在 `Number of Clusters` 下，将 `Specification Method` 设置为 `Automatic`。\n    *\
  \ 在 `Selection Criterion` 下，将 `Clustering Method` 设置为 `Centroid`。\n    * 在 `Missing\
  \ Values` 下，将 `Interval Variables` 设置为 `Default`，并将 `Nominal Variables` 设置为 `Default`。\n\
  \    * 保持其他设置为 `Default`。\n\n3. 运行 `Cluster` 节点并打开 `Results` 窗口。\n\n### 聚类数量\n\n\
  图 13.7 显示了聚类数量和聚类大小的聚类分析结果。聚类算法表明三个三个聚类，如下。\n\n![图 13.7 聚类大小](img/fig13_7.jpg)\n\
  \n图 13.7 聚类大小。\n\n* 聚类 1 包含 10,532 个案例，占比 28.21%。\n* 聚类 2 包含 3,674 个案例，占比 9.84%。\n\
  * 聚类 3 包含 23,133 个案例，占比 61.95%。\n\n因此，聚类 3 是最大的，其次是聚类 1，然后是聚类 2。我们很快将深入研究每个聚类。（*注*：SAS\
  \ Enterprise Miner 将它们称为 segments 而 clusters。我将使用 *clusters* 以确保章节的一致性。）\n\n为了验证聚类的数量，我们使用\
  \ R 方图表（图 13.8），该图展示了根据聚类数量变化的 R 方值。请注意，通常在聚类分析中，我们并不像线性回归方法那样严格地使用 R 方值，因为聚类分析使用的是不同的原理。然而，SAS\
  \ Enterprise Miner 将 R 方图作为聚类分析结果的一部分生成，这确实允许我们解释聚类模型的解释能力。因此，我们应该从通用解释能力的角度来看此图表，而不应尝试将\
  \ R 方值解释为判定系数。\n\n![图 13.8 按聚类数量划分的 R 值](img/fig13_8.jpg)\n\n图 13.8 按聚类数量划分的 R 值。\n\
  \n考虑到这一点，我们可以看到纵轴表示从 0 到 1 的 R 方值，横轴表示聚类的数量。图表在三个聚类点处有一个大峰，表明三个三个聚类时，R 方为 0.899。换句话说，三聚类模型可以解释数据中\
  \ 89.9% 的方差。我们不应该使用超过三个聚类，因为这不会导致 R 方显著提高，并可能导致聚类重叠。因此，该结果确认了三个聚类的选择。\n\n### 聚类距离\n\
