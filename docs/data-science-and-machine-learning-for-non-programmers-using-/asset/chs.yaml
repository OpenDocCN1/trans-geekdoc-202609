  \ | >100,000–200,000 |\n| 教育程度 | 高中 | 本科 | 研究生 |\n| 婚姻状况 | 已婚 | 单身 |\n| 地区 | 东北部\
  \ | 东南部 | 西南部 | 西部 |\n\n## 样本量\n\n### 什么是样本量？为什么它很重要？\n\n![](img/ufig3_10.jpg)样本量是指样本中个体或对象的数量。样本量在数据挖掘中是一个重要的课题，因为足够的样本至关重要。\n\
  \n以下是强调样本量重要性原因：\n\n1. **代表性模式：** 数据挖掘旨在发现有意义的模式和关系。较大的样本提供了更具代表性的总体，增加了捕捉准确可靠模式的可能性。通过更大的样本，我们可以获得总体更准确的结果。\n\
  \n2. **增强通用性：** 样本量增强了研究结果的推广性。当样本更加多样化并包含更多个体或案例时，结果更有可能适用于抽自的广泛总体。这提高了研究的外部效度。\n\
  \n3. **可靠的模型构建：** 数据挖掘通常涉及构建预测模型或分类器。较大的样本量允许更稳健、准确的模型构建。通过更大的样本，模型可以捕捉数据中更广泛的变化和复杂性，产生更可靠、通用的预测。\n\
  \n4. **增加统计功效：** 统计功效是指在数据中检测真实效应或关系的能力。较大的样本量增加了研究的统计功效，使其更有可能发现显著差异或关联。这对于从数据中得出有意义的结论特别重要。此外，通过更大的样本，数据挖掘算法可以检测到小样本中可能隐藏的模式和关系，导致更稳健和显著的发现。\n\
  \n5. **提高准确信心：** 较大的样本量减少了预测中的变性和不确定性。置信区间变得更窄，为真实的总体参数提供了更准确的范围。这提高了研究发现的准确性和可靠性。\n\
  \n6. **子群体分析：** 研究人员可以使用较大的样本进行更稳健的子群体分析。子群体分析允许调查特定群体内部的影响或关系。每个子群体足够的样本量确保了对这些特定群体得出可靠的结论。\n\
  \n7. **增加稳定性：** 较大的样本量为结果提供了更多的稳定性，减少了随机波动或离群值的影响。当样本量很大时，离群值或极端值的影响较小，确保了发现的稳健、可靠。\n\
  \n\n\n\n\n## 8. 考虑变异\n现实世界环境中的许多现象表现出固有的变异。较大的样本量可以捕捉更广泛的变异，从而对所研究的现象提供更全面的理解。\n\
  \n## 9. 处理复杂和稀有模式\n在某些情况下，数据挖掘旨在发现发生频率较低的复杂或稀有模式。较大的样本增加了遇到此类模式概率，使其识别和理解这些不常见的现象。\n\
  \n## 10. 验证结果\n数据挖掘通常涉及在未见的数据上对发现的模式或模型进行测试和验证。有了较大的样本量，验证过程中对结果的泛化性和可靠性会有更高的信心。\n\
  \n### 传统统计研究的样本量\n\n![](img/ufig3_11.jpg)鉴于样本量的重要性，一个明显的问题是：项目需要多大的样本量才足够？\n\n通常，对于传统研究，有两种确定所需样本量的方法，一种基于总体大小，另一种是基于我们用于分析的统计技术。首先，样本量必须足以代表总体规模。在这种情况下，样本量是根据总体大小、置信水平和误差范围决定的。Qualtrics\
  \ 为这种情况提供了一个实用的样本量计算器。我在下方包含了其数学公式作为参考。\n\n```math\nSample~size = \\frac{\\left(\
  \ z\\\\_ score \\right)^{2} \\times StdDev \\times \\left( 1 - StdDev \\right)}{\\\
  left( margin~of~error \\right)^{2}}\n```\n\n指向 Qualtrics 样本量计算器的链接：[`www.qualtrics.com/blog/calculating-sample-size/`](https://www.qualtrics.com)\n\
  \n置信水平告诉你对该结果有多大的信心。它表示为不同样本（如果重复抽样）产生此结果的百分比次数。置信区间的常用值为 95%。误差范围是一个考虑实际结果与预测结果之间差异的统计测量量。误差范围的常用值为\
  \ 5%。\n\n例如，如果我们使用 95% 的置信水平、5% 的误差范围以及 100,000 的总体大小，计算出的样本量为 383。如果我将总体大小增加到 1\
  \ 亿，所需的样本量仍然是 385。原因是总体大小被用于计算 `z-score`，而 `z-score` 在总体达到某个特定数字时会达到饱和。因此，即使我们的总体大小为\
  \ 3 亿，所需的样本量仍然是 385。我理解这种方法可能会引发一些进一步的问题。例如，总体大小是否真的重要？因此，我们需要看第二种方法。\n\n在第二种方法，样本量必须足够以确保统计分析的统计效力（power）和效应量（effect\
  \ size）。公式取决于所选择用于分析的统计技术。我不会详细介绍这些方法，因为针对不同的统计方法，计算样本量有许多不同的公式。我非常推荐用于此目的的两个有用资源如下：\n\
  \n*   **Daniel Soper 的样本量计算器** ([`www.danielsoper.com/statcalc/`](https://www.danielsoper.com)):\
  \ 该网站提供了许多实用的统计计算器，包括样本量计算器、效应量计算器和 beta（II 类错误率）计算器。它为这些计算器提供了所有的公式和学术引用。最实用的样本量计算器包括用于多元回归、分层多元回归和结构方程建模的。该网站还提供了开发这些计算器时使用的所有公式和参考文献，确保了这些计算的有效性。\n\
  \n*   **G*Power 软件:** 这是一个开源软件应用程序，允许我们计算许多统计方法的样本量，包括 t 检验、ANOVA（方差分析）、MANOVA、重复测量、逻辑回归和多元回归。它在学术研究中被广泛使用。虽然该软件非常强大，但对每个人来说使用起来并不容易。某些功能需要仔细阅读手册以避免计算错误。\n\
  \n    下载软件和手册的链接：[`www.psychologie.hhu.de/arbeitsgruppen/allgemeine-psychologie-und-arbeitspsychologie/gpower`](https://www.psychologie.hhu.de)\n\
  \n使用这些样本量计算器的关键在于确定我们预期的主要参数，包括效应量、所需的检验效力、显著性水平、自变量（预测变量）的数量以及因变量的数量。一旦选择了正确的统计方法和这些参数的预期值，工具将确定我们确保这些统计参数所需的最小样本量。我不会详细介绍这些参数，因为它们在统计材料中已经有了深入介绍。\n\
  \n![](img/ufig3_12.jpg)经验法是，我们应该同时使用这两种方法，并计算总体所需的样本量以及满足检验效力和效应量所需的样本量。然后，我们选取这两个数字中较大的一个。\n\
  \n### 数据挖掘研究的样本量\n\n在数据挖掘研究中，上述方法并不适用，因为它们只适用于传统的统计研究，而许多机器学习方法并不是基于统计的。此外，这些计算得出的样本量通常在\
  \ 50–500 个响应之间。虽然这些数字中的任何一个对于传统的统计分析目的都是充分的，但它们无法很好地涵盖专注于从大数据中发现未知模式的数据挖掘研究。\n\n\
  正如第 1 章中提到的，当我们谈论数据量时，我们指的是数据中变量的数量（多样性）和记录的数量（容量）。为了在没有理论基础的情况下检测数据中变量关系方面的有用模式，我们需要模型中具有大量的变量。原因是，有限的变量只能发现有限的模式（关系）。此外，如果我们排除了重要的输入变量，从数据派生的预测模型从建模角度来看可能有很好的拟合度，但没有实际意义。\n\
  \n当我们模型中包含更多变量时，模型的解释力往往会降低。我将在第 6 章 中详细介绍解释力。基本上，它显示了我们的模型解释目标变量的效果如何。更具体地说，它指示模型根据预测变量的方差解释目标变量方差的能力。因此，随着我们增加更多变量，模型的解释力可能会降低。为了在变量很多的情况下保持解释力，我们需要更多的数据点来训练模型，这意味着更大的样本量。此外，我们还需要为了验证目的对数据划分（数据分区），这需要更大的样本量。\n\
  \n\n\n\n\n## 简介\n那么，数据挖掘项目需要多大的样本量才足够呢？这是一个很难回答的问题，因为没有标准答案。有些作者认为越多越好，而另一些人则认为\
  \ 10,000 个数据点就足够了。我没有找到关于这个主题的一致性指南。这也取决于数据源，因为我们无法使用比拥有的更多的数据。某些数据提供者收集小时运营数据，他们能够提供数百万条记录。另一方面，收集事故数据的机构可能只提供数条记录。\n\
  \n从根本上说，我们需要足够的数据来训练和验证模型并确保结果的泛化性。但我们还需要考虑处理非常大数据集所需的计算能力，因为使用大量数据训练诸如 `neural\
  \ network` 等复杂模型可能花费更长时间。我将根据我对数据挖掘项目的评估和经验，给出自己的建议。\n\n### 建议\n我将根据我对数据挖掘项目的评估和经验，给出自己的建议。\n\
  \n### 响应率\n抽样中的另一个重要因素是响应率（response ratio），即我们想要预测的事件发生率。例如，如果我们的目标变量是 `flight delays`（航班延误），那么响应率就是航班延误次数与总航班数之比。事件是延误的航班，非事件是准点航班。拥有一个平衡的数据集对于确保我们拥有有效且泛化良好的预测模型至关重要。\n\
  \n如果响应率过低或过高，我们就拥有了不平衡的数据集。例如，如果响应率为 `0.1`，那么 10% 的数据是事件，90% 是非事件。当我们用这个数据集训练模型时，模型可能会估计所有情况都是非事件，导致高率的假假性性。因此，尽管整体预测准确率看起来很高（90%），但模型未能预测出事件（`flight\
  \ delays`），这使得它变得无效且无法使用。另一方面，如果响应率过高，事件与非事件的数量将非常悬，我们可能会得到一个假阳性率极高的预测模型，这会导致同样的问题。解决不平衡数据集的一种常见解决方案是对数据进行重采样（resample），以获得可达的响应率。我们将在本章稍后介绍这一解决方案。\n\
  \n![](img/ufig3_13.jpg)\n\n结论是，在为数据挖掘选择样本量时，我们需要同时考虑记录数量和响应率。例如，样本量为 100,000 条记录且响应率为\
  \ `0.4–0.6` 的样本被认为是足够的，而样本量为 100 万个案例但响应率为 `0.03 的 的样本可能不够。在理想情况下，0.5 的响应率代表事件与非事件之间的完美平衡。但在现实中，我们通常没有这种完美的平衡。我的建议是获取至少\
  \ 100,000 个案例且响应率为 `0.4–0.6` 的样本量。\n\n## 示例：抽样\n![](img/icon_10.jpg)在本节中，我们将学习如何使用\
  \ `SAS Enterprise Miner` 进行数据抽样。假设我们有一个用于数据挖掘的大数据集，并且不计划使用所有的数据点。主要原因是这样的大数据集对于建模来说是没有必要的，并且会减慢计算过程，影响模型训练时间。例如，我们有一个包含\
  \ 1000 万个数据点的数据集，但我们决定在建模时使用 100,000 个数据点。那么，如何在不牺牲数据质量和泛化性的情况下，从 1000 万个数据点中抽出这\
  \ 100,000 个数据点呢？我将演示如何使用 `SAS Enterprise Miner` 来。\n\n### 选择方法\n第一步是决定抽样方法。如前所述，在数据挖掘项目中，我们应该使用概率抽样方法。`SAS\
  \ Enterprise Miner` 为我们提供了这些抽样方法。`SAS Enterprise Miner` 关于抽样方法的指南在上一页。在大多数情况下，当我们拥有平衡的数据集时，应该使用\
  \ `random sampling`（随机抽样），除非有特定理由选择其他方法。`random sampling` 允许我们在随机抽取样本的同时保持响应率。例如，如果我们完整数据集的响应率为\
  \ `0.45`，并且想要抽取 10% 的数据，`random sampling` 将为我们提供 10% 的数据并保持 `0.45` 的响应率。\n\n###\
  \ 在 SAS Enterprise Miner 中实现\n一旦我们选择了合适的抽样方法，信不信由，从完整数据抽取样本其实非常简单。大多数数据挖掘软件应用程序都内置了抽样功能，允许我们毫无挑战地进行抽样。我将演示如何在\
  \ `SAS Enterprise Miner` 中进行数据抽样。假设我们决定使用 `random sampling` 方法来抽样。在 `SAS Enterprise\
  \ Miner` 中，我们有两种抽样方式：在创建新的数据源时或使用 `Sample Node`（抽样节点）。我将向你展示如何使用 `Sample Node`因为它因为它更多的设置属性，允许我们配置抽样过程并随时更改配置。\n\
  \n我们使用一个示例数据集 `airline recommendation`。如果你完成了第 2 章的练习，你应该已经将此数据集上传到你的库并在 `SAS Enterprise\
  \ Miner` 中打开了它。在第 4 章中，我将对该数据集和变量提供详细解释。在本章中，我们只需要知道目标变量是 `recommendation`，表示乘客对航空公司的推荐情况。这是一个二分类变量，有两个水平：`Yes`\
  \ —— 推荐（事件）；`No` —— 不推荐（非事件）。数据集共有 124,464 个数据点。响应率为 `0.475`。\n\n### 步骤指南\n1. 运行\
  \ `SAS Enterprise Miner`。\n2. 打开 `AirlineProject`。\n3. 右键点击 `Diagrams` 并选择 `Create\
  \ Diagram`。命名为 `Airline`。\n![](img/ufig3_14.jpg)\n4. 双击 `Airline` 图表在工作区中打开。\n5.\
  \ 从 `Data Sources` 将数据文件 `AirlineRecommendation` 拖入工作区。\n6. 从 `Sample` 选项卡将图标 ![](img/ufig3_15.jpg)拖入工作区。将\
  \ `Sample` 节点连接到 `AirlineRecommendation` 节点。我们将看到如下所示。\n![](img/ufig3_16.jpg)\n\
  7. 点击 `Sample` 节点，左侧将显示 `Property` 面板。\n![](img/ufig3_17.jpg)\n8. 对 `Train` 属性进行以下更改：\n\
  \    - 将 `Sample Method` 设置为 `Random`。\n    - 将 `Percentage` 设置为 `50%`。\n![](img/ufig3_18.jpg)\n\
  9. 运行 `Sample` 节点。\n10. 运行完成后，打开 `Results` 窗口。\n\n\n\n\n\n如之前所述，我们期望一个平衡数据集能够产生有效且实用的预测模型。不平衡的数据集会带来较高的预测误差风险。平衡数据集的响应比应接近\
  \ 0.5；即，我们的事件（正样本）数量与非事件（负样本）数量相似。图 3.4 展示了平衡数据集和不平衡数据集的示例。平衡数据集包含 50% 的事件和 50%\
  \ 的非事件，或者响应比为 50%。不平衡数据集包含 5% 的事件和 95% 的非事件，或者响应比为 5%。在不平衡数据集中，我们称事件为 `minority\
  \ class`（仅占数据的 5%），称非事件为 `majority class`（占数据的 95%）。\n\n![图 3.4 平衡与不平衡数据集对比。](img/fig3_4.jpg)\n\
  \n图 3.4 平衡与不平衡数据集。\n\n为什么极不平衡的数据集在预测建模中会成为问题？如果我们使用这个例子，我们有一个数据集，其中 5% 的数据是事件（正样本），95%\
  \ 的数据是非事件（负样本）。当我们用这个数据集训练模型时，由于数据不平衡，算法会将所有情况视为非事件，因为它试图寻找预测准确率最高的模型。请记住，算法无法理解变量或数据的含义。它只看到数字，并尝试将数据拟合到模型中。在这种情况下，我们的整体预测准确率为\
  \ 95%，这被认为是非常高的。然而，如果我们深入研究结果，会发现模型无法预测任何事件（正样本），这使得它在实践上是毫无用处的，因为我们构建这个模型是为了预测那个特定的事件。\n\
  \n![](img/ufig3_19.jpg) 为什么会发生这种情况？如果我们将预测分为正预测和负预测，会发现真阳性率为 0%，而假阴性率为 100%。这是因为算法将所有情况都视为非事件（负样本）以获得最准确的预测。所以，可以看出，整体预测准确率可能具有误导性，我们需要检查其他的模型拟合指标，例如特异性（specificity）、灵敏度（sensitivity）、F1\
  \ 分数、Gini 系数、ROC 图表和提升图（Lift chart）。我们将在第 6 章中介绍这些细节。在这种情况下，由于不平衡数据集响应比极低，模型是无效的。\n\
  \n现在我们理解了为什么不平衡的数据集会对我们的建模构成高风险。了解我们可以用来解决该问题的方法非常重要，因为这种情况并不像你想象中那么不常见。在预测信用卡欺诈、航空事故或网络攻击等项目中，事件往往非常稀见（响应比极低），但预测这种风险真的非常重要。如果我们的模型无法预测我们感兴趣的目标变量，它对我们来说就是没用的。解决这一问题有以下几种方法，如下所示。\n\
  \n### 使用多个模型拟合指标\n\n![](img/ufig3_20.jpg) 正如上面的示例所示，当我们拥有不平衡的数据集时，训练一个良好的模型是一个挑战，我们往往会得到一个整体预测准确率很高但无效的模型。因此，我们绝不能仅仅依赖预测准确率或误分类率来评估模型性能，因为它们可能会产生误导。注意，误分类率基本上是\
  \ 1 减去预测准确率。我们需要使用多个模型拟合指标来评估模型。除了预测准确率和误分类率外，一些典型指标包括灵敏度、特异性、F1 分数、提升图、ROC 图和 Gini\
  \ 系数。通过使用多个指标，我们可以从多个角度评估模型性能，并捕捉模型性能的全貌。我们将在第 6 章中涵盖这些指标的细节。\n\n### 数据划分与模型验证\n\
  \n预测建模的一个主要问题是过拟合。这意味着我们可能会过度训练模型并获得高预测准确率。然而，由于模型针对训练数据进行了过度训练，它只在这个特定数据集上运行良好。当我们把相同的模型应用于新数据集时，它不再有效；即模型不具泛化性，因此无法使用。因此，除了使用多个模型拟合指标外，我们还应该将数据划训练样本和验证样本。\n\
  \n### 成本敏感学习\n\n处理不平衡数据集的另一种方法是成本敏感学习。基本上，当我们训练模型时，我们不根据预测准确率或误分类率来比较模型，而是考虑误分类的成本。换句话之，我们希望模型能够使总成本最小化。为了实现这一点，我们需要为目标特征创建一个报酬表（payoff\
  \ table），显示每个级别的误分类成本。它也被称为 `decision matrix`（决策矩阵）。\n\n我将主要关注成本敏感学习（CSL），因为它在数据挖掘中被广泛。它是机器学习的一个分支，考虑了误分类成本。通常，误分类成本（假阴性或假阳性）是不相等的。因此，通过定义所有级别的误分类成本，我们可以训练并选择使总成本最小的模型。\n\
  \n在响应比极低或极高的不平衡数据集中，假阴性的成本通常远高于假阳性的成本，因此对 `minority class`（稀有情况）的错误应该受到严厉惩罚。一个例子是预测严重的健康问题。假阴性会导致治疗延误并可能导致严重后果。当我们比较模型时，我们选择总成本最低的模型，而不是误分类率最低的模型。因此，成本敏感学习通过考虑不同类型分类错误的成本来优化模型性能。\n\
  \n另一方面，如果我们更倾向于关注利润而不是成本，我们只需要定义一个利润矩阵，列出准确预测的详细利润。在比较模型时，我们选择总利润最高的模型。在书中，我们将使用以成本为中心的示例。我将在第\
  \ 6 章中介绍 CSL 的细节以及如何进行操作。\n\n### 重采样——过采样与欠采样\n\n![](img/ufig3_21.jpg) 处理不平衡数据集的一种常用方法是对数据进行重采样以创建一个平衡数据集。如果不平衡数据集对模型有效性构成威胁，就应该使用这种方法。换句话说，如果上述选择不能解决数据不平衡问题，并且我们的模型可能无效，那么我们就应该考虑这个选项。\n\
  \n\n\n\n\n基本上，通过重采样，我们修改了不平衡数据集，以平衡事件和非事件之间的数据。为了实现这一目标，主要有两种方法：过采样和欠采样。图 3.5 显示了这两种方法之间的区别。\n\
  \n![图 3.5 过采样与欠采样。](img/fig3_5.jpg)\n\n图 3.5 过采样与欠采样。\n\n过采样（上采样）是一种通过增加少数类（稀有事件）的大小，使其与多数类的大小相同，从而达到平衡数据的技术。通过过采样，我们通过复制案例来增加训练样本中少数类记录的数量。这种方法的主要优点是原始数据集中的信息没有丢失，我们可以保留少数类和多数类的所有记录。另一方面，由于存在重复数据，我们的模型容易产生过拟合。此外，我们可能会得到一个非常大的数据集，从而增加计算时间。\n\
  \n![](img/ufig3_22.jpg) 最常用的过采样技术是随机过采样，它随机复制少数类的记录。这种技术虽然简单，但往往会导致过拟合，因为模型是从相同的数据点中学习的。一种先进的技术是合成少数类过采样技术（`SMOTE`），它使用\
  \ `k`-最近邻方法选择在特征空间中接近的案例。我们不会在书中介绍它。\n\n欠采样（下采样）是一种通过减少多数类的大小使其与少数类的大小相同，从而平衡数据的技术。欠抽样的的一种典型方法是分层采样。这种方法的主要优点是缩短了训练时间，因为我们得到的数据较小。另一方面，通过删除多数类中的大量记录，我们可能会丢失一些关键信息。\n\
  \n注意，重采样并不是随机采样，因此可能存在采样偏差问题。因此，我们需要通过比较样本与总体的人口统计特征来解决采样偏差问题，以确保样本的代表性，如前所示。\n\n\
  ## 示例：重采样数据\n\n![](img/icon_10.jpg) 我将演示如何使用 SAS Enterprise Miner 进行数据重采样。例如，在航空公司推荐案例中，假设我们有一个非常不平衡的数据集，响应比例为\
  \ 8.35%；即 8.3% 的乘客不推荐该航空公司，而 91.7% 的乘客推荐。请注意，我创建此假设场景仅用于演示（表 3.3）。\n\n表 3.3 假设的不平衡数据集\n\
  \n| 变量 | 格式化值 | 频率计数 | 百比 |\n| --- | --- | --- | --- |\n| `recommendation` | 否 |\
  \ 5,916 | 8.31% |\n| --- | --- | --- | --- |\n| `recommendation` | 是 | 65,297 |\
  \ 91.69% |\n\nSAS Enterprise Miner 使用分层采样来平衡数据集。注意，该软件中的过采样选项实际上的是我们之前描述的欠采样。\n\n\
  在 SAS Enterprise Miner 中按照以下步骤操作：\n\n1. 运行 SAS Enterprise Miner。\n2. 打开项目 `Airline`。\n\
  3. 打开 `Airline` 图。\n4. 点击 `Sample` 节点，左侧将显示属性面板。\n5. 对属性进行以下更改：\n    * 在 `Train`\
  \ 标签页下：将 `Sample Method` 设置为 `Stratify`。\n    * 在 `Size` 标签页下：将 `Type` 设置为 `Percentage`。\n\
  \    * 将 `Percentage` 设置为 `100%`。\n    * 在 `Stratified` 标签页下：将 `Criterion` 设置为 `Equal`。\n\
  \    * 在 `Oversampling` 标签页下：将 `Adjust Frequency` 设置为 `Yes`。\n    ![](img/ufig3_23.jpg)\n\
  6. 运行 `Sample` 节点。\n7. 完成后，打开 `Results` 窗口。\n\n表 3.4 显示了详细结果。`Sample` 节点产生了一个平衡的数据集，其中\
  \ 50% 的乘客推荐航空公司，另外 50% 不推荐。该节点的输出是新的平衡数据集，我们可以它来训练模型。这是在 SAS Enterprise Miner 中使用欠采样平衡数据的示例。\n\
  \n表 3.4 欠采样结果\n\n| 数据 | 变量 | 格式化值 | 频率计数 | 百比 |\n| --- | --- | --- | --- | --- |\n\
  | 全量数据 | `recommendation` | 否 | 5,916 | 8.31% |\n| --- | --- | --- | --- |\n| `recommendation`\
  \ | 是 | 65,297 | 91.69% |\n| 样本 | `recommendation` | 否 | 5,916 | 50% |\n| `recommendation`\
  \ | 是 | 5,916 | 50% |\n\n## 数据划分\n\n![](img/icon_6.jpg) 在数据挖掘中，评估模型泛化质量的一种流行策略是对数据源进行划分。如前所述，如果我们为了获得高准确率而过度训练模型，数据挖掘中可能会出现过拟合。训练模型在新数据集上的表现可能不佳，这引发了对模型泛化能力的疑问。换句话说，模型仅在训练样本上运行良好，当将其应用于不同的数据集时很可能会失败。为了避免这种情况，我们将数据划分为多个数据集。训练样本用于初步模型拟合。其余部分留作验证，通常分为两部分：验证样本和测试样本。图\
  \ 3.6 说明了数据划分的工作原理。为什么我们在数据挖掘中需要子样本呢？首先，训练样本用于训练模型并找到最优模型。然后，我们使用验证样本运行该模型进行验证。如果模型未通过验证，我们就重新配置模型、重新训练并验证新模型。最后，我们使用测试样本测试这个最终模型以确保泛化能力。\n\
  \n![图 3.6 数据划分。](img/fig3_6.jpg)\n\n图 3.6 数据划分。\n\n### 划分比例\n\n数据划分中的一个常见问题是关于划分比例；即百分之几的数据应该进入训练样本，百分之几应该进入验证和测试样本？例如，60–40\
  \ 的划分比例通常意味着 60% 的数据进入训练样本，40% 进入其他两个。在这种情况下，我们通常将 40% 的数据平分给验证和测试样本。因此，我们使用 20%\
  \ 的数据进行验证，另外 20% 用于最终测试。\n\n划分比例没有标准规则。文献显示了各种建议，从 50–50、60–40、70–30、80–20 甚至 90–10。为了确定正确的划分比例，我们需要查看我们有多少数据。经验法是，这三个样本必须与原始数据集共享相似的数据趋势。否则，将会出现采样偏差，我们可能最终使用有偏差的数据集训练模型，从而导致无效的预测模型。我们还需要确保每个样本中都有足够的数据点用于建模。通常，我们希望使用更多数据来训练模型以获得良好的模型拟合效果，但另外两个样本应该有足够的数据点来验证和测试模型。因此，数据量是一个重要因素。\n\
  \n\n\n\n例如，假设我们的原始数据集有 100,000 个数据点。在这种情况下，我们可以使用 60–40 的划分比例，这将为我们提供 60,000 条训练记录、20,000\
  \ 条验证记录和 20,000 条最终测试记录。此外，如果我们有超过 100 万个数据点，那么 80–20 的划分比例应该是适行的，因为它将为我们提供 800,000\
  \ 条训练记录、100,000 条验证记录和 100,000 条最终测试记录。另一方面，如果我们的样本量非常小，少于 1,000 个数据点，我们应该使用 60–40\
  \ 的划分比例，但不包含测试样本。原因为我们希望在验证样本中有足够的数据来验证模型。\n\n我在表 3.5 中提供了针对不同数据量的推荐划分比例。请注意，这是一个通用的建议，取决于我们所使用的机器学习方法，我们可能需要需要对划分比例进行调整。\n\
  \nTable 3.5 基于样本大小的推荐划分比例\n\n| 样本大小 | 推荐划分比例 |\n| --- | --- |\n| 少于 1,000 个数据点 |\
  \ 60–40，不设测试样本（训练: 60%;验证: 40%） |\n| 1,000–100 万数据点 | 60–40（训练: 60%;验证: 20%;测试:\
  \ 20%） |\n| 1–1000 万数据点 | 80–20（训练: 80%;验证: 10%;测试: 10%） |\n| 多于 1000 万数据点 | 90–10（训练:\
  \ 90%;验证: 5%;测试: 5%） |\n\n## 示例：使用 SAS Enterprise Miner 进行分区\n\n![](img/icon_10.jpg)本节演示了如何在\
  \ SAS Enterprise Miner 中划分数据。我们使用*航空公司推荐*数据集。软件为三个子样本设置了 40–30–30 的默认值。由于我们有超过 100,000\
  \ 个数据点，我们将使用 60–40 的划分比例将数据集分为三个子样本。因此，我们使用 60%的数据用于训练，20%用于验证，20%用于最终测试。\n\n在 SAS\
  \ Enterprise Miner 中遵循以下步骤：\n\n1. 运行 SAS Enterprise Miner。\n2. 打开项目 `Airline`。\n\
  3. 打开 `Airline` 图表。\n4. 从 `Sample` 选项卡，将图标 `Data Partition` ![](img/ufig3_24.jpg)拖入工作区。将\
  \ `Data Partition` 节点连接到 `Sample` 节点。我们将看到如下所示。\n\n![](img/ufig3_25.jpg)\n5. 点击\
  \ `Data Partition` 节点，左侧将显示属性面板。\n6. 在 `Train` 属性下：分区方法（Partition Method）保持默认。\n\
  7. 在 `Data Set Allocations` 选项卡下进行以下更改：\n    * 将 `Training` 设置为 `60.0`。\n    * 将\
  \ `Validation` 设置为 `20.0`。\n    * 将 `Test` 设置为 `20.0`。\n\n![](img/ufig3_26.jpg)\n\
  8. 运行 `Data Partition` 节点。\n9. 运行完成后，打开 `Results` 窗口。\n\n结果在表 3.6 和 3.7 中给出。如你所示，软件已按照我们的预期将原始数据分为三个子样本：训练、验证和测试。我们需要记住的一点重要的事情是，响应率保持在\
  \ 52.5%，与原始数据集一致。因此，这三个子样本的响应率与原始数据集相同。我们也有足够的数据来训练模型（超过 37,000 个数据点）以及验证和测试模型（每个约\
  \ 12,000 个数据点）。换句话说，使用这些子样本训练和验证我们的模型是安全的。\n\nTable 3.6 数据分区结果 – 按样本划分的观测值数量\n\n\
  | 类型 | 数据集 | 观测值数量 |\n| --- | --- | --- |\n| 全样本 | `EMWS2.Smpl_DATA` | 62,233 |\n\
  | 训练样本 | `EMWS2.Part2_TRAIN` | 37,337 |\n| 验证样本 | `EMWS2.Part2_VALIDATE` | 12,447\
  \ |\n| 测试样本 | `EMWS2.Part2_TEST` | 12,449 |\n\nTable 3.7 数据分区结果 – 按类别划分样本的观测值数量\n\
  \n| 类型 | 变量 | 格式化值 | 频率计数 | 百比 |\n| --- | --- | --- | --- | --- |\n| 全样本 | `recommendation`\
  \ | 否 | 59,167 | 47.54% |\n| `recommendation` | 是 | 65,297 | 52.46% |\n| 训练样本 |\
  \ `recommendation` | 否 | 17,751 | 47.54% |\n| `recommendation` | 是 | 19,586 | 52.46%\
  \ |\n| 验证样本 | `recommendation` | 否 | 5,917 | 47.54% |\n| `recommendation` | 是 |\
  \ 6,530 | 52.46% |\n| 测试样本 | `recommendation` | 否 | 5,919 | 47.54% |\n| `recommendation`\
  \ | 是 | 6,530 | 52.46% |\n\n## 总结\n\n在本章中，我们涵盖了 SEMMA 过程的第一步：采样。采样对于数据挖掘至关重要，因为正确的采样能让我们获得良好的数据集。通过使用正确的采样方法，我们可以获得具有泛化能力的数据，而不只是训练样本。我提供了样本大小和响应率的建议。解决数据平衡有多种策略，例如使用多种拟合准则、重采样和代价敏感学习。重采样是一种平衡不平衡数据的常用技术。最后，数据分区是一个重要的步骤，它将数据集划分为子样本。通常，训练样本用于训练模型，验证样本用于验证模型，而测试样本用于测试模型的泛化能力。在本章中，我还演示了如何使用\
  \ SAS Enterprise Miner 进行数据采样、重采样和数据分区。\n\n## 章节讨论题\n\n1. 采目的是什么？为什么它对数据挖掘很重要？\n\
  2. 描述总体、抽样和样本之间的区别。它们是如何联系的？给出总体、抽样和样本的现实实例。\n3. 什么是采样偏差？给出采样偏差的例子。\n4. 比较概率采样和非概率采样。哪些方法可以让我们减少采样偏差？\n\
  5. 为你的业务提供一个数据挖掘项目，并选择正确的采样方法。说明你的理由。\n6. 计算所需样本量的方法有哪些？使用 Daniel Soper 样本计算器和 G*Power\
  \ 为项目计算样本量。\n7. 什么是过拟合？它对模型的有效性有何影响？\n8. 描述不平衡数据集的主要问题。解决数据平衡问题的主要策略有哪些？\n9. 过采样和欠采样之间有什么区别？给出一些具体的例子。\n\
  \n\n\n\n![](img/shut4_1.jpg)在本章中，我们将介绍 SEMMA 过程中的第二步：探索（Explore）。数据探索是数据挖掘中至关重要的一步，因为我们需要对数据的参数、特征、趋势和潜在问题进行彻底理解。这种理解允许我们根据需要采取适当的操作对数据进行清洗、准备和转换。它还允许我们选择正确的机器学习方法和分析配置，以开发良好的预测模型。在这一步中，我们使用可视化和描述性统计来来探索和理解数据、变量以及数据中的任何潜在问题，例如缺失值或离群值。可视化是探索数据的强大工具，市场上有许多可视化工具。我将通过示例演示这些工具。\n\
  \n## 数据理解\n在进行任何数据分析之前，理解数据及其参数和质量是非常重要的。输入的质量决定了输出的质量。“垃圾进，垃圾出”（Garbage in, garbage\
  \ out）。对于任何类型的数据分析都是必要的，但对于数据挖掘来说尤为重要，因为我们处理的是大量带有噪声的数据。当我们面对一个包含许多变量和大量记录的大数据集时，由于数据量巨大，获取数据集的全景具有挑战性。如果没有对数据进行彻底理解，我们可能会在建模步骤中使用无效或无关的变量作为预测器，或者忽略相关变量。在不理解数据特征和局限性的情况下，识别正确的机器学习方法也可能困难。此外，由于数据集存在过多的缺失值或离群值，我们可能会导致模型拟合效果差。因此，我们需要彻底探索数据，关注我们拥有什么类型的信息、数据中存在哪些变量、这些变量的测量尺度以及数据中的任何趋势。如第\
  \ 2 章所示，机器学习方法的选择取决于数据、目标变量的规模以及我们项目的目的。\n\n数据探索是数据挖掘中最重要的步骤之一，因为它允许我们看到数据的情况以及数据中的任何潜在问题，并据此决定数据修改和转换的必要策略。只有高质量的输入，才能获得良好的预测模型。模型的好坏取决于数据的质量。假设你是一个机场高管，需要知道机场在一天中某些时间或一年某些天航班延迟/取消的概率。假设由于输入糟糕（例如缺失值或噪声过多），预测模型产生了一个不准确的预测，认为今天延迟或取消的概率很低（假阴性）。因此，基于这一糟糕的预测，你决定不采取任何行动，随后观察到由于航班取消过多导致机场陷入巨大混乱。如果你在情况发生前采取了某些缓解措施，这种情况就可以避免。当然，糟糕的预测也可能其他因素引起，但输入糟糕通常是主因之一。记住，“垃圾进，垃圾出”。表\
  \ 4.1 强调了为什么数据探索在数据挖掘中重要的一些关键点。\n\n### 数据探索在数据挖掘项目中的性\n\n| 项目 | 数据探索的重要性 |\n| ---\
  \ | --- |\n| 理解数据特征 | 数据探索有助于我们获得数据集特征的洞解。它允许我们理解数据分布、范围、变性和潜在的数据质量问题。通过探索数据，我们可以识别离群值、缺失值、数据不一致或其他可能影响数据质量和有效性的异常。\
  \ |\n| 变量选择 | 理解数据允许我们识别用于数据挖掘任务的相关变量。通过分析变量之间的关系、其分布以及对目标变量的潜在影响，我们可以对在建模过程中包含或排除哪些变量做出明智决策。\
  \ |\n| 数据预处理和清洗 | 数据探索对于识别和解决数据质量问题非常有用。我们可以检测并处理缺失值、离群值、重复项或不一致的数据。可以根据探索阶段获得的见解执行填充、离群值检测或数据转换等数据处理任务。有效的数据清洗和准备可以提高模型性能并获得更可靠的结果。\
  \ |\n| 识别模式和关系 | 探索数据允许我们识别变量之间的潜在模式、趋势或关系。通过可视化数据、应用统计指标或进行探索性数据分析技术，我们可以发现有意义的见解并理解数据的底层结构。这些见解指导了合适机器学习方法的选择，并帮助我们提高预测模型的预测能力。\
  \ |\n| 要求和局限性 | 通过探索数据，我们可以识别违反特定机器学习算法所需假设的任何。这种意识使我们能够对某些技术的适用性做出明智决策，并避免建模过程中的潜在陷阱或偏差。\
  \ |\n| 新发现 | 数据探索可以激发新发现的产生。通过观察数据中的模式或趋势，我们可能会产生新的潜在关系进行进一步调查。探索期间获得的这些初步见解可以指导随后的建模和分析，带来新的发现和研究方向。\
  \ |\n\n探索数据有两种方法：可视化和统计探索。可视化允许我们通过不同类型的图表查看数据趋势和模式，并从数据中收集有用信息。这种方法易于使用，并可以整合到经理或高管的商业智能仪表板中。通过可视化可以非常快速地观察模式或趋势。市场上有许多可视化工具，如\
  \ `Tableau`、`Power BI` 和 `SAS Viya`。这些应用程序允许我们根据需求添加和自定义图表和图形。如果我们有大数据，数据可以实时通过仪表板，我们可以看到感兴趣变量在不同时间或随时间推移的模式。这些工具提供了显示最新信息的动态可视化工具。在书中，我主要关注一些我们可以用于分析目的以探索数据的图表。这些图表是半动态的，因为某些图表工具允许我们旋转图表并从不同角度查看。它们为我们提供了开发良好预测模型所需的信息。\n\
  \n![](img/ufig4_1.jpg)对于数据挖掘而言，仅靠可视化可能是不够的。统计探索可以定量输出的形式为我们提供有用信息。它们包括变量的描述性统计，允许我们理解数据中变量的特征。此外，统计探索还提供了关于目标变量与预测器之间相关性的初步信息。将可视化与统计结合可以兼顾之长。我将向你展示如何使用结合方法来探索和理解数据。\n\
  \n### 数据描述\n\n\n\n\n\n在数据探索中需要记住的一个重要点是，我们不能在不知道数据中包含哪些变量及其属性的情况下就直接开始构建图表和图形。原因是我们将不知道应该使用何种类型的图表以及如何解释输出结果。因此，在运行任何可视化之前，我们首先需要获取有关数据集的基本信息，特别是变量数量、变量描述和变量标度。这些信息将帮助我们决定应该使用什么类型的图表来理解数据。\n\
  \n在本章中，我使用了 `airline recommendation`（航空公司推荐）数据示例来演示可以使用 SAS Enterprise Miner 的各种可视化类型。首先，让我们来看看这个数据集的参数和特征。\n\
  \n### 案例研究 – 航空公司推荐\n\n![](img/icon_10.jpg) 在此案例研究中，对美国多家航空公司的乘客进行了一项大规模调查。乘坐特定航空公司从一个出发地飞往另一个目的地的乘客被要求就他们的飞行体验以及是否会向他人推荐该航空公司进行调查。他们提供了人口统计学信息和飞行体验，包括出发地和目的地州、过去的飞行次数、旅行目的、机场消费金额以及价格敏感性。乘客调查数据与航空公司状态和飞行变量整合在一起，包括飞行距离、飞行时间、起飞和到达延迟以及航班取消。该项目旨在预测目标变量，即乘客对航空公司的推荐。我们希望确定哪种模型最能预测这个目标变量，哪些变量是重要的预测因子。预测将帮助航空公司高管制定策略以改进他们的运营和服务并吸引更多乘客。\n\
  \n由于数据中变量数量很多，我们必须首先查看变量及其角色和标度。Table 4.2 描述了此数据中的变量名称、描述和标度。\n\nTable 4.2 数据描述\n\
  \n| 变量名称 | 标签/描述 | 标度 | 角色 |\n\n| --- | --- | --- | --- |\n| `recommend` | 向他人推荐航空公司\
  \ | 二进制 (是/否) | 目标 |\n| --- | --- | --- | --- |\n| `airline_st` | 航空公司状态 | 名义 |\
  \ 输入 |\n| `age` | 年龄 | 间距 | 输入 |\n| `gender` | 性别 | 二进制 (男/女) | 输入 |\n| `price_sensitivity`\
  \ | 价格敏感性 | 间距 | 输入 |\n| `no_years_flying` | 飞行年限 | 间距 | 输入 |\n| `no_flt_pa` | 平均每年飞行次数\
  \ | 间距 | 输入 |\n| `pct_flt_other_airline` | 其他航空公司的飞行占比 | 间距 | 输入 |\n| `type_of_travel`\
  \ | 旅行目的 | 名义 | 输入 |\n| `no_other_lty_cards` | 其他忠诚卡数量 | 间距 | 输入 |\n| `shopping_amt_airpt`\
  \ | 机场购物金额 | 间距 | 输入 |\n| `eat_drink_airpt` | 机场餐饮花费 | 间距 | 输入 |\n| `class` | 乘客等级\
  \ | 名义 | 输入 |\n| `origin_state` | 出发地州 | 名义 | 输入 |\n| `destin_state` | 目的地 | 名义\
  \ | 输入 |\n| `depart_delay_in_minutes` | 起飞延迟（分钟） | 间距 | 输入 |\n| `arrival_delay_in_minutes`\
  \ | 到达延迟（分钟） | 间距 | 输入 |\n| `flt_cancel` | 航班取消 | 二进制 (是/否) | 输入 |\n| `flt_time`\
  \ | 飞行时间（分钟） | 间距 | 输入 |\n| `flt_distance` | 飞行距离（英里） | 间距 | 输入 |\n\n**变量名称**：由于变量名在实际分析和结果中使用，它们应该清晰且简洁。变量名应该足够清晰以便我们识别该变量。同时，它也应该是短的，以免名称在输出中被截断。许多软件应用程序为变量名设置了长度限制。我非常建议不要在变量名中使用空格或特殊字符（`@#$%^&*`）。原因是\
  \ SAS Enterprise Miner 等软件不允许空格和特殊字符，如果我们在变量名中检测到这些问题，将给出错误信息。编程软件（如 `R` 或 `Python`）也有相同的要求。其他软件可能更灵活，但如果我们想将模型与\
  \ Python 平台整合，就会更多的错误。为了分隔变量名中的单词，我们使用下划线（`_`）而不是空格。\n\n![](img/ufig4_2.jpg)**变量标签/描述：**\
  \ 可以在描述中提供变量细节。在某些应用程序中，它被称为 `labels`。描述或标签是为了向用户提供变量更详细的描述。如你在 Table 4.2 中所示，标签清晰地解释了每个变量，并包含了测量单位，如年、分钟或英里。标签有助于用户更清楚地理解变量，因为变量名往往很短或使用缩写。变量描述没有限制。尽管如此，我们应该尽量清晰简洁，以避免混乱或误导。具有用户界面（UI）的软件应用程序，如\
  \ SAS Enterprise Miner、SPSS Modeler 或 Rapid Miner，通常允许我们选择在变量名旁边显示标签。因此，如果变量名不够清晰，我们始终可以参考标签来完全理解变量。此外，为了报告目的，我们还可以选择在输出中显示标签而不是变量名。在这种情况下，冗长的标签可能会给报告带来问题，因为它们会增大输出表格并使其难以放入报告。此外，冗长的标签也为图表的展示带来了挑战。因此，我们需要仔细选择标签。\n\
  \n**标度**：用于衡量变量的标度对我们的分析非常重要，特别是当我们在建模步骤中确定确定合适的机器学习算法时。Chapter 2 详细描述了我们拥有的不同变量标度。基本上它们包括名义、二进制、序数或间距。如\
  \ Table 4.2 所示，有一个二进制目标变量、七个名义/二进制预测因子和十一个间距预测因子。注意 `price_sensitivity` 使用了 Likert\
  \ 标度，我们假设该变量各级别之间的间隔是相等的。因此，我们选择将其视为间距变量（关于 Likert 标度的详细讨论请参见 Chapter 2）。\n\n**角色**：最后一个重要信息是变量的角色。基本上，变量有两个主要角色：目标（Target）和输入（Input）。我们需要识别哪些变量是目标变量（我们想要预测的变量），哪些变量是输入（也称为预测因子，即我们用于预测的变量）。在我们的示例中，`recommend`\
  \ 是具有二进制标的目标变量，而其他都是预测因子。此外还有一些额外的角色，包括 ID（指示变量）、Time ID（时间标识符）、Rejected（排除分析的变量）、Text（包含文档文本的变量）以及其他。目前，我们主要关注目标角色和输入角色。\n\
  \n\n\n\n\n![](img/icon_4.jpg)通过我们每天收集的大数据，可视化是一种强大的工具，可以帮助我们回顾数据趋势和模式，而无需查看原始数据和一些带有数字的描述性统计。即使用户没有数据分析或统计学背景，`数据可视化`也能让他们轻松地查看和理解数据。在许多行业中，组织会开发业务智能仪表板，允许用户快速选择他们想要查看的关键变量或关键性能指标\
  \ (KPI)，并生成代表数据趋势或模式的图表。操作人员使用这些工具监控日常运营活动；决策者则利用可视化来制定策略并做出业务决策。尽管如此，重要的是要关注什么（KPI\
  \ 或指标）以及如何解释结果。\n\n可视化分析应用如 `Tableau`、`Spotfire`、`SAS Visual Analytics` 和 `Microsoft\
  \ Power BI`为用户提供了许多功能。无论我们使用哪种工具，它们通常都会使用几种常见的图表类型进行可视化。我将介绍一些常见的图表类型、如何创建它们以及如何解释结果。我将向你展示如何使用\
  \ `SAS Enterprise Miner` 创建图表。但请注意，你也可以使用自己熟悉的其他工具来探索数据。如前提到的，在本书中，数据可视化只是 SEMMA\
  \ 过程中的一步。因此，我们将以半动态模式使用这些图表，而不是你通常在智能仪表板中看到的全动态模式。\n\n我将在 `SAS Enterprise Miner`\
  \ 中两个主要的可视化工具：`Graph Explorer node` 和 `MultiPlot node`。它们都列在顶部菜单栏的 `Explore Tab`\
  \ 下，因为数据可视化是 SEMMA 过程中的 `Explore`步骤。\n\n## 柱状图和直方图\n\n![](img/icon_9.jpg)柱状图和直方图数据可视化中最常用的图形工具。它们都使用条形（垂直或水平）来展示结果。那么，它们之间的区别是什么？`Table\
  \ 4.3` 总结了这两种图形工具之间的一些区别。柱状图适用于分类变量，而直方图用于连续变量。我们将深入研究这些图表类型，并学习在何时使用哪种。\n\n####\
  \ 表 4.3 柱状图与直方图的区别\n\n| 项目 | 柱状图 (Bar Charts) | 直方图 (Histograms) |\n| --- | ---\
  \ | --- |\n| 数据类型 | 柱状图用于显示分类数据。类别或组显示在 x 轴上，柱体的高度或长度代表与每个类别相关的频率或百分比。 | 直方图适用于连续数据。数据被划分为区间或箱（bins），柱体的高度代表落在每个区间内的数据点的频率。\
  \ |\n| X 轴表示 | 在柱状图中，x 轴代表离散的类别或组。每个类别通常由单独的柱体表示。 | 在直方图中，x 轴代表所测量连续变量的数值范围或区间。区间是连续且相邻的，形成一个连续的刻度。\
  \ |\n| 数据呈现 | 柱状图对于比较不同类别之间的数据非常有效。它们显示了不同的类别并比较它们的频率。 | 直方图显示连续变量内值的分布情况。它们提供了关于数据形状、中心趋势和离散性的见解。\
  \ |\n| 柱体放置 | 在柱状图中，柱体之间通常有间隙相互分离，以强调类别之间的区别。 | 在直方图中，柱体通常相邻放置，没有间隙，因为区间是连续的并形成连续的刻度。\
  \ |\n| 轴标签 | 柱状图为 x 轴上的每个类别使用标签，以指示特定的组或类别。 | 直方图在 x 轴和 y 轴上都使用标签。x 轴标签代表测量变量，y\
  \ 轴标签代表每个区间内数据点的频率。 |\n\n### 柱状图\n\n基本上，柱状图用于分类变量，并呈现每个类别或每个层级的频率或百分比。它非常容易理解和解释。请注意，百分比对于比较目的效果更好，而频率可以告诉我们每个类别中的案例数量。\n\
  \n![](img/ufig4_4.jpg)我使用 `Graph Explorer node` 为我们的*航空公司推荐*（airline recommendation）数据集创建了柱状图。请注意，这种方法允许我们根据意愿选择和自定义图表，但我们必须一次创建一个图表。有一种方法可以为数据集中的所有变量创建图表，我稍后向你展示那种方法。\n\
  \n在 `SAS Enterprise Miner` 中按照以下步骤操作：\n\n1. 打开项目 `AirlineProject`。\n2. 创建一个新的 Diagram\
  \ 并命名为 `Explore`。\n3. 从 `Explore` 选项卡，将 `Graph Explorer node` 拖入工作区并将其连接到数据源节点。\n\
  \   ![](img/ufig4_5.jpg)\n4. 运行 `Graph Explorer node`。\n5. 打开 `Results`。\n6. 选择绘图图标\
  \ ![](img/ufig4_6.jpg) 或进入 `View/Plot`。\n7. 选择 `Bar` 并点击 `Next`。\n8. 选择变量 *recommendation*，并将\
  \ `Role` 更改为 `Category`。\n9. 对于 `Response statistics`，选择 `Frequency`。\n   ![](img/ufig4_7.jpg)\n\
  10. 点击三次 `Next`。\n11. 点击 `Finish`。将生成柱状图。此柱状图显示频率。要显示百分比，你只需要在第 9 步中选择 `Percentage`。\n\
  \n`Figure 4.1` 显示了目标变量 *recommendation* 的频率和百分比的柱状图。请注意，在这些图表中，使用的是标签而不是变量名。这就是为什么你看到\
  \ *Recommend the airline* 而不是 *recommendation*。由于目标变量是一个二分类变量（是/否），图表显示这两个层级的频率和百分比。正如我们所见，52.7%\
  \ 的乘客推荐该航空公司，而 47.3% 不推荐。\n\n![Figure 4.1 目标变量“Recommend the airline”的柱状图](img/fig4_1.jpg)\n\
  \n### 图形格式化\n\n为了更改图形属性（如颜色、格式、标题、轴、值或图例），我们使用 `Graph Properties`。只需在图表任何地方点击右键并选择\
  \ `Graph Properties`。会弹出的新窗口，允许我们配置图表。基本，你可以更改以下内容：\n\n* `Graph`: 选择具有不同背景和色调的图表样式。\n\
  * `Bar`: 更改柱状图中柱的颜色选项；设置柱宽；显示柱索引（变量层级）；在柱中显示响应统计。\n* `Axes`: 格式化垂直和水平轴；添加轴标题；配置刻度；并选择轴范围。\n\
  * `Title/Footnote`: 显示或隐藏图表标题、子标题或脚注。\n* `Legend`: 格式化图表图例；显示或隐藏图例；选择图例布局。\n\n![](img/ufig4_8.jpg)\n\
  \n### 两个变量的 2D 或 3D 柱状图\n\n如果我们想绘制两个分类变量以及它们之间的关系，可以使用 2D 柱状图或 3D 柱状图。例如，我们想根据乘客的航空公司状态查看航空公司推荐情况。\n\
  \n为两个变量创建柱状图：\n\n* 遵循上一节中的相同步骤操作。\n* 对于 2D 柱状图：在第 8 步中，将 *recommendation* 的 `Role`\
  \ 更改为 `Category` 并为 *airline_status* 选择 `Group`。\n* 对于 3D 柱状图：在第 8 步中，将 *recommendation*\
  \ 的 `Role` 更改为 `Category` 并为 *airline_status* 选择 *Series*。\n\n\n\n\n\n图 4.2 显示了两个变量：`recommendation`\
  \ 和 `airline_status` 的二维和三维柱状图。如你所示，这些柱状图根据航空公司状态的类别分解了目标变量的百分比。在这种情况下，三维柱状图从三维角度呈现数据，更容易跨类别进行比较。我们可以解读为：在推荐该航空公司的乘客中，大多数是蓝卡会员（30%），其次是银卡会员（15%）。然而，有更多蓝卡会员乘客不推荐该航空公司（40%），而只有约\
  \ 5% 的银卡乘客不推荐该航空公司。换句话说，蓝卡乘客更有可能不推荐航空公司，而银卡乘客更有可能推荐该航空公司。\n\n![图 4.2 两个变量的二维和三维柱状图。(images/fig4_2a.jpg)图\
  \ 4.2 两个变量的二维和三维柱状图。## 直方图对于连续变量，柱状图可能不是最佳选择。考虑到连续的刻度，我们会得到非常巨大且混乱的图表，它们分散在 x 轴上。例如，图\
  \ 4.3 显示了年龄的柱状图。虽然我们仍然可以看到年龄的分布，但很难对年龄范围进行任何解释，因为年龄是间隔的，且年龄年份分散在 x 轴上。具体来说，每个年龄年份都有\
  \ 63 个柱子。![图 4.3 年龄的柱状图。(images/fig4_3.jpg)图 4.3 年龄的柱状图。另一个例子是出发延迟时间（分钟）的柱状图（图 4.4）。这个柱状图总共使用了\
  \ 309 个柱子，导致很难看出数据趋势。基本上，它是没有意义的，没有给我们提供我们需要的信息。因此，我们必须找到不同的方法来呈现这种类型的数据。![图 4.4\
  \ 分钟出发延迟柱状图。(images/fig4_4.jpg)图 4.4 分钟出发延迟柱状图。对于连续变量，直方图是更好的选择。基本上，直方图展示了连续变量的频率分布。直方图将值划分为若干箱（bins），并计算每个箱的频率。直方图中的每个柱子都显示该箱的频率。请注意，在直方图中，由于变量具有连续刻度，柱子之间没有间隙。从技术上，我们可以自己识别直方图的箱，但这将是一个耗时的过程。我们只需要指定需要的箱数，软件就可以自动将数据划分为箱并构建出直方图。例如，我们想为年龄创建一个直方图。在\
  \ SAS Enterprise Miner 中按照以下步骤操作。1. 运行 `Graph Explorer` 节点。2. 打开 `Results`。3. 选择\
  \ `Plot` 图标![](img/ufig4_6.jpg) 或转到 `View/Plot`。\n4. 选择 `Histogram`，点击 `Next`。\n\
  5. 选择变量 `Age`，并将 `Role` 更改为 `X`。\n6. 为 `Response` 统计量选择 `Frequency`。\n7. 点击三次 `Next`，然后点击\
  \ `Finish`。将生成直方图。\n\n注意，上述步骤创建了一个具有 10 个箱的直方图，这些箱是由软件自动决定的（图 4.5）。如我们所示，图表显示了每个年龄范围的频率。它确实给了我们关于年龄分布的思路，接近正态分布。\n\
  \n![图 4.5 10 个箱的年龄直方图。(images/fig4_5.jpg)图 4.5 10 个箱的年龄直方图。假设我们想要一个 5 个箱的年龄直方图，以便年龄图更容易解释。我们如何更改箱的数量？为了实现这一点，请按照以下步骤操作。1.\
  \ 右键点击图表并选择 `Graph Properties`。2. 在 `Properties` 窗口中进行以下更改：    * 将 `X` 箱的数量改为 5。\
  \    * 勾选 `Ends Labels` 复选框。    ![](img/ufig4_9.jpg)\n3. 点击 `Apply`，然后点击 `OK`。\n\
  \n图 4.6 显示了 5 个箱的年龄直方图。现在图表更容易理解了。它显示大多数乘客年龄在 31 到 49 岁之间，其次是 49 到 58 岁的范围。另一方面，72\
  \ 到 85 岁的年老年乘客较少。\n\n![图 4.6 5 个箱的年龄直方图。(images/fig4_6.jpg)\n\n图 4.6 5 个箱的年龄直方图。\n\
  \n我们遵循相同的过程创建出发延迟时间的图。但在这种情况下，我们选择呈现百分比而不是频率。因此在第 109 页描述的流程步骤 6 中，我们将 `Response`\
  \ 统计量更改为 `Percent`。如图 4.7 所示，直方图显示延迟时间非常偏斜（注：要在直方图中显示缺失值，请检查图形属性）。如我们所示，90% 的案例延迟时间小于\
  \ 101.7 分钟，其次是 101.7 到 203.4 分钟之间的 2.6%。此外，1.7% 的案例是缺失值。\n\n![图 4.7 10 个箱的出发延迟直方图。(images/fig4_7.jpg)\n\
  \n图 4.7 10 个箱的出发延迟直方图。\n\n由于数据极端右偏，假设我们想要一个 3 个箱的直方图来进一步检查趋势。通过更改箱的数量，我们得到了如图 4.8\
  \ 所示的直方图。在这种情况下，结果显示 98% 的案例延迟时间为 339 分钟。\n\n![图 4.8 3 个箱的出发延迟直方图。(images/fig4_8.jpg)\n\
  \n图 4.8 3 个箱的出发延迟直方图。\n\n### 直方图在数据挖掘中的意义\n\n直方图通常用于评估数据分布的形状，特别是是正态分布、左偏还是右偏。它们还可以向我们展示离群值。除了提供提供良好的可视化工具外，直方图在数据挖掘中（特别是在监督学习中）也有重要意义。我们将该图的关键点总结如下：\n\
  \n* 线性回归需要正态分布才能产生良好的模型拟合。正态分布呈现为钟形曲线，表明数据是对称的。这意味着靠近均值的数据频率高于远离均值的数据。\n* 如果直方图显示偏态（无论是左偏还是右偏），我们需要考虑转换工作。\n\
  * 直方图可以向我们展示离群值。大量的离群值意味着数据集中存在噪声，这可能会影响我们的预测能力。\n\n## 箱线图\n\n除了直方图，我们还有另一种图形工具可以指示数据的偏度和潜在的离群值。它是箱线图，也称为须线图。箱线图是描述数据集五位数摘要的图形，由最小值、下四分位数\
  \ (`Q1`)、中位数、上四分位数 (`Q3`) 和最大值。此外，箱线图还指示了哪些观测值被认为是离群值。\n\n\n\n\n\n图 4.9 展示了两个与航空公司状态相关的箱线图。第一个显示了按航空公司状态划分的年龄分布。正如我们所看到的，中位数和四分位距（箱体）非常接近中心，表明数据具有对称性。四分位距（箱体）在四种航空公司状态下似乎是一致的。我们只注意到一个银级（Silver）乘客的离群值（须线之外的数据点）。\n\
  \n![图 4.9 按航空公司状态划分的年龄和年平均飞行次数箱线图](img/fig4_9a.jpg)\n\n图 4.9 按航空公司状态划分的年龄和年平均飞行次数箱线图。\n\
  \n第二张图显示了按航空公司状态划分的年均飞行次数分布。该图显示数据相当偏斜。你可能会注意到中位数和箱体非常偏离中心，表明数据非对称性。蓝色（Blue）乘客的箱体比其他状态略大，显示了数据方差的差异。最后，我们可以看到在所有四个状态中都存在多个离群值。\n\
  \n要创建箱线图，请按照以下步骤操作：\n\n1. 运行 Graph Explorer 节点。\n2. 打开 Results（结果）。\n3. 选择 Plot\
  \ 图标![](img/ufig4_6.jpg)或进入 View/Plot。\n4. 选择 Box，选择第一个图标并点击 Next（下一步）。\n5. 选择变量\
  \ `airline_status`，将 Role（角色）更改为 X。\n6. 选择变量 `age`，将 Role（角色）更改为 Y。\n7. 点击 Finish（完成）。将生成箱线图。\n\
  \n## 饼图\n\n如果我们想以百分比的形式呈现分类变量的数据，饼图是一个很好的选择，因为它们为我们提供了每个类别占饼图的比例。它在视觉上易于理解和解释。例如，图\
  \ 4.10 显示了一个展示乘客航空公司状态百分比的饼图。饼图显示 67% 的乘客是蓝色乘客，其次是银级乘客（20.7%）、金色级（8.63%）和铂金级（3.27%）。注意，对于饼图，总百分比必须为\
  \ 100% 才有意义。\n\n![图 4.10 航空公司状态饼图](img/fig4_10.jpg)\n\n图 4.10 航空公司状态的饼图。\n\n要创建饼图，请按照以下步骤操作：\n\
  \n1. 运行 Graph Explorer 节点。\n2. 打开 Results（结果）。\n3. 选择 Plot 图标![](img/ufig4_6.jpg)或进入\
  \ View/Plot。\n4. 选择 Pie，点击 Next（下一步）。\n5. 选择变量 `airline_status`，将 Role（角色）更改为 Category（类别）。\n\
  6. 为 Response statistic（响应统计）选择 Percent（百分比）。\n7. 点击三次 Next（下一步）。\n8. 点击 Finish（完成）。将生成饼图。\n\
  \n## 折线图 – 趋势分析\n\n当我们收集随时间变化的数据时，希望看到事件或事故的趋势。在这种情况下，折线图是一个很好的选择。本质，折线图产生一条使用线条连接一系列数据点的折线。这种图表类型呈现顺序值，帮助我们识别趋势。x\
  \ 轴代表值的顺序进展。\n\n例如，图 4.11 显示了从 2020 年 1 月 1 日到 2020 年 3 月 1 日国内和国际航班的趋势。正如我们看到的，在\
  \ 2020 年初，由于疫情的影响，航班数量发生了变化。你可能会注意到中位数和箱体非常偏离中心，表明数据的非对称性。蓝色乘客的箱体比其他状态略大，显示了数据方差的差异。最后，我们可以看到在所有四个状态中都存在多个离群值。在\
  \ 2021 年，随着疫苗接种的推出，需求增加。在 2022 年，我们可以看到趋势的波动。这种图表类型展示了顺序值，帮助我们识别识别航班的趋势。\n\n![图\
  \ 4.11 国内和国际航班趋势图](img/fig4_11.jpg)\n\n图 4.11 国内和国际航班的折线图。\n\n## 密度图与散点图\n\n当我们对一个变量相对于另一个变量绘图时，还有两种图表工具可能非常有效。它们是密度图和散点图。密度图\
  \ 使用不同透明度的点点来捕获数据点，以确保视觉上的平滑性。它有助于显示不同区域或范围内的数据密度。相反，散点图使用较大的标记来绘制数据点。它显示了数据点的离散程度。\n\
  \n\n\n\n\n例如，我们想要探索出发延迟时间与到达延迟时间之间的关系。为此，我同时使用了密度图和散点图。如图 4.14 和图 4.15 所示，这两张图表显示了相同的信息。到达延迟时间与出发延迟时间呈正相关。从本质上，当航班起飞越晚时，到达得也越晚。图表显示，根据数据密度，这种相关性在延迟时间为\
  \ 400 分钟或以内时更强。你可能会注意到，密度图中的可视化效果比散点图中的数据点更加平滑。\n\n![图 4.14 到达延迟时间相对于出发延迟时间的密度图。](img/fig4_14.jpg)\n\
  \n图 4.14 到达延迟时间相对于出发延迟时间的密度图。\n\n![图 4.15 到达延迟时间相对于出发延迟时间的散点图。](img/fig4_15.jpg)\n\
  \n图 4.15 散点图 到达延迟时间相对于出发延迟时间的图。\n\n为了创建密度图或散点图，请按照以下步骤操作。\n\n1.  运行 `Graph Explorer`\
  \ 节点。\n2.  打开 `Results`。\n3.  选择 `Plot` 图标![](img/ufig4_6.jpg)或进入 `View/Plot`。\n\
  4.  对于密度图：选择 `Density`，选择第三个图标![](img/ufig4_12.jpg)，并点击 `Next`。\n5.  对于散点图：选择 `Scatter`，选择第一个图标![](img/ufig4_13.jpg)，并点击\
  \ `Next`。\n6.  选择变量 `departure_delay_in_minutes`，将 `Role` 改为 `X`。\n7.  选择变量 `arrival_delay_in_minutes`，将\
  \ `Role` 改为 `Y`。\n8.  点击 `Finish`。将生成密度图。\n\n## MultiPlots\n\n上述图形工具是我们用于探索数据的一些典型工具。但如你所看到的，在这些情况下，我们必须手动创建每个图表。如果我们处理大数据（许多变量和数据点），如何快速生成多个用于探索目的的图表呢？SAS\
  \ Enterprise Miner 有一个专门为此目的设计的工具：MultiPlot。\n\n`MultiPlot` 节点是从多个角度可视化数据的宝贵工具。利用\
  \ `MultiPlot` 你可以从视觉上探索大量数据集、观察数据分布并分析变量之间的关系。`MultiPlot` 还有识别数据中的离群值并发现潜在的模式和趋势。\n\
  \n`MultiPlot` 节点创建以下类型的图表。\n\n### 柱状图\n\n*   每个输入和目标的的直方图。\n*   展示每个输入与每个类别目标之间关系的柱状图。\n\
  *   根据每个间隔目标分组的每个输入的柱状图。\n\n### 散点图\n\n*   描述每个间隔输入与目标之间关系的散点图。\n*   展示每个类别输入与目标之间关系的散点图。\n\
  \n在 SAS Enterprise Miner 中按照以下步骤创建 MultiPlots。\n\n1.  打开图表 `Explore`。\n2.  从 `Explore`\
  \ 选项卡将 `MultiPlot` 节点拖入工作区，并将其连接到数据源节点![](img/ufig4_14.jpg)\n3.  在属性面板中进行以下更改。\n\
  \    *   将 `Type of Charts` 设置为 `Both` 以使用柱状图和散点图。\n    *   将 `Graph Orientation`\
  \ 设置为 `Vertical`。\n    *   将 `Statistic` 设置为 `Percent`。\n    ![](img/ufig4_15.jpg)\n\
  4.  运行 `MultiPlot` 节点。\n5.  打开 `Results` 窗口。\n\n该节点的结果包含一个窗口，向我们展示所有的所有组合图表（柱状图和散点图），我们可以前后移动查看想要研究的图表（图\
  \ 4.16）。我们还可以根据需要放大或缩小。该工具可以以有意义的方式探索大数据。\n\n![图 4.16 MultiPlot 节点结果。](img/fig4_16.jpg)\n\
  \n图 4.16 MultiPlot 节点结果。\n\n在 `Graphs` 窗口底部，显示以下按钮并用于在图表之间移动。\n\n*   `First` – 显示第一张图。\n\
  *   `Previous` – 显示上一个图。\n*   `Play` – 开始所有图表的自动幻灯片播放。\n*   `Next` – 显示下一张图。\n*\
  \   `Last` – 显示最后一张图。\n\n![](img/ufig4_16.jpg)图 4.17 展示了从 MultiPlot 图形窗口提取的两张柱状图。第一张显示了根据航空公司状态划分的推荐。我们可以看到蓝卡、银卡、金色和铂金乘客在航空公司推荐上的差异。第二张显示了按舱位（商务、超级经济或经济）划分的推荐。\n\
  \n![图 4.17 航空公司状态和乘客舱相对于航空公司推荐。](img/fig4_17a.jpg)\n\n图 4.17 航空公司状态和乘客舱相对于航空公司推荐。\n\
  \n## Quick Chart Explorer\n\n你可能会有一个问题：如果我们想一次性查看变量的分布情况，该怎么办？与其一个一个创建这些图表，如之前所示，SAS\
  \ Enterprise Miner 有一种方法可以一次性生成。\n\n在 SAS Enterprise Miner 中按照以下步骤操作。\n\n1.  打开图表\
  \ `Explore`。\n2.  从 `Explore` 选项卡将 `MultiPlot` 节点拖入工作区。\n3.  选择所有变量并点击 `Explore`。\n\
  4.  展开 `Sample Properties`窗口进行以下更改。\n    *   将 `Sample method` 设置为 `Random`。\n \
  \   *   将 `Fetch size` 设置为 `Max`。\n5.  点击 `Apply`。\n\nSAS Enterprise Miner 为所有变量生成直方图和柱状图，采样量最多为\
  \ 20000 行。这是一次性查看变量的非常有效的方法。图 4.18 显示了我们变量的这些多图结果。我们可以展开每个窗口来查看详细图表。记住，柱状图用于类别变量，而直方图用于间隔变量。\n\
  \n![图 4.18 快速图表探索器的结果。](img/fig4_18.jpg)\n\n## Statistics Exploration\n\n数据可视化为我们提供了大量的图形工具来可视化趋势和模式。为了选择合适的机器学习方法并确定预测建模的正确配置，我们还需要探索数据的统计信息。基本上，我们需要查看所有变量的描述性统计以了解它们的特征，并确定是否需要在\
  \ `Modify` 步骤中进行数据转换。我们要查看的一些描述性统计包括：\n\n*   样本量。\n*   类别变量：每个层级的频率、百分比和缺失值。\n*\
  \   间隔变量：最小值、最大值、平均值、标准差、偏度和峰度和缺失值。\n\n这些我们在统计课程中常用的典型描述性统计。提醒一下，偏度和峰度为我们提供了有关数据分布以及是否为正态分布的信息。正态分布对于\
  \ `linear regression` 方法是必要的。\n\n出于统计探索的目的，我们使用 SAS Enterprise Miner 中的 `StatExplore`\
  \ 节点。\n\n### 示例：统计探索\n\n![](img/icon_10.jpg)我们将使用 `StatExplore` 节点探索我们的*航空公司推荐*数据集。按照以下步骤操作。\n\
