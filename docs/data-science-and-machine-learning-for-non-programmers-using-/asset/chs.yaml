  \n### 评估 (Assess)\n\n我们查看了几个关键结果以理解并解释这棵树。注意 SAS Enterprise Miner 与其他软件应用一样，倾向于产生许多结果输出。我不会使用并解释所有结果，相反，我会向你展示哪些结果是有用的。我们需要查看的第一个结果是`subtree\
  \ assessment plot`（子树评估图）。该图根据最终树中叶子的数量及其选择方式来描述树的深度。图 8.5 显示了`CART`树的子树评估图。所示，当误率（`MR`）达到\
  \ 0.208 时，选择了具有 17 个叶子的树（要查看确切数字，将鼠标悬停在图表的特定点上）。你可以看到，这并不是训练样本中 MR 最低的树，尽管它非常接近。在训练结果中，MR\
  \ 最低的树需要超过 60 个叶子。然而，如果我们查看验证结果，叶子数量在 17 到 54 之间的树其`MR`几乎相同，且都是最低的（0.208）。因此，软件选择了验证`MR`最低且叶子较少（或\
  \ 17 个）的树。所以，这里记住的关键点是，在剪枝过程中使用验证`MR`来选择树。本质上，这就是树剪枝的决策过程。\n\n\n\n\n\n# 在结果窗口中：视图\
  \ -> 模型 -> 子树评估图\n\n一个常见的问题是：如果我们不修剪这棵 CART 树会怎样？我将向你展示如何在 SAS Enterprise Miner\
  \ 中进行操作，以及我们为什么需要修剪树。基本上，如果我们不修剪树，算法就会构建一棵完整的树。让我们看看在不进行修剪的情况下构建完整的 CART 树，会得到什么样的树。\n\
  \n要构建完整树，请按照以下步骤对树的属性进行调整：\n\n1. 在 `Subtree` 下：将 `Method` 设置为 `Largest`。此选择将允许我们构建完整树（不进行修剪）。\n\
  2. 运行 `CART` 树节点并打开 `Results` 窗口。\n\n图 8.6 显示了完整 CART 树的子树评估图。如你所见，选择了一棵具有 63 个节点的树。这棵树的训练错误率（MR）较低，但验证错误率\
  \ 略高。请记住，树是根据验证结果选择的。\n\n![图 8.6 完整 CART 树的子树评估图。](img/fig8_6.jpg)\n\n图 8.6 完整 CART\
  \ 树的子树评估图。\n\n那么，这两棵树在层级结构上有何不同？图 8.7 显示了完整 CART 树与修剪后 CART 树在结构上的差异。如你所见，完整树非常大，有很多分支和节点。要遍历每个分支和节点来理解这棵树是非常困难的。相反，修剪后的树更细、更容易解释。\n\
  \n![图 8.7 完整 CART 树 (a) 与修剪后 CART 树 (b) 的层级结构。](img/fig8_7a.jpg)\n\n图 8.7 完整 CART\
  \ 树 (a) 与修剪后 CART 树 (b) 的层级结构。\n\n我们使用验证结果比较了这两棵树的模型拟合指标，以检查它们之间的差异。提醒一下，我们使用以下输出来提取或计算这些指标（详情请参阅第\
  \ 6 章）。\n\n* 使用 `CART` 树节点的输出获取误分类率。\n* 使用 `Model Comparison` 节点的输出获取 `ROC` 指标、`Lift`\
  \ 值和 `Gini` 系数。\n* 从 `CART` 节点的输出中提取混淆矩阵。然后使用该混淆矩阵计算 `Accuracy`（准确率）、`Sensitivity`（敏感性）、`Specificity`（特异性）和\
  \ `F1-Score`。\n\n表 8.3 展示了这两棵树模型拟合指标的比较。如你所见，完整树和修剪树之间的这些指标相当接近。修剪后的树的准确率和误分类率实际上更好。此外，修剪后的树还具有更好的敏感性和\
  \ F1 分数，而其特异性略低。完整树的 Gini 系数、`ROC` 指标和累积提升度略好。总的来说，这些树的模型拟合指标相似。因此，构建完整树并不比修剪树有任何优势。相反，完整树大得多，难以理解和解释，可能需要更长的计算时间，而且我们面临过拟合的风险。因此，使用修剪后的树是有逻辑的。\n\
