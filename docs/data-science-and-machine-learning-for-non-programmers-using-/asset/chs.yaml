  \ 波士顿房价数据集的正一化示例\n\n如果你已经在第 4 章的练习中对*波士顿房价*数据集进行了数据探索，你会发现数据中的变量并非正态分布。假设我们计划使用线性回归方法分析这些数据，而该方法通常对于正态分布的数据效果最好。因此，我们决定对数据集中的所有区间变量进行归一化。\n\
  \n我们继续之前完成的 `Impute` 节点。使用 SAS Enterprise Miner 对数据进行归一化，我们需要使用 `Transform Variables`\
  \ 节点。从 Modify 选项卡中将 `Transform Variables` 节点拖入工作区并将其连接到 `Impute` 节点（见下文）。\n\n![](img/ufig5_16.jpg)\n\
  \n按照以下步骤配置 `Transform Variables` 节点。\n\n1. 在 `Train` 属性下：\n    * 将 `Interval Inputs`\
  \ 设置为 `Maximum Normal`。此选项允许软件确定最佳幂变换以最大化正态性。这使得我们的任务变得更容易，因为我们不需要决定为哪些变量使用何种归一化方法。\n\
  2. 运行 `Transform Variables` 节点并打开 `Results` 窗口。\n\n输出显示了 SAS Enterprise Miner 选择的归一化函数（表\
  \ 5.11）。如所示，软件为每个变量确定了最佳的归一化函数。常用的函数包括对数函数和平方根函数。创建的新变量会在变量名加上函数。这些新变量将用于下一步的预测建模。当我们有很多变量时，这个工具对于数据挖掘非常有用。我们无法逐个检查每个变量来决定使用哪种函数进行归一化。\n\
