  \n![图 15.4 变量重要性。](img/fig15_4.jpg)\n\n图 15.4 变量重要性。\n\n## 总结\n\n梯度提升是一种强大的集成机器学习学习方法，它通过迭代方式结合弱学习器来创建一个强大的预测模型。它通过使用梯度下降优化来最小化指定的损失函数。每个随后的弱学习器都旨在纠正之前学习器所犯的错误，特别关注之前被分类分类的案例。这种迭代过程产生了一个能够有效捕捉复杂关系并做出准确预测的集成模型。梯度提升因其处理各种类型数据的能力以及在分类和关联建模中的有效性而广受欢迎。\n\
  \n梯度提升的一个关键优势是它能够处理异构数据并结合不同类型的弱学习器。它可以处理类别变量、数值变量，甚至是缺失值。此外，梯度提升允许根据具体的特定问题使用不同的损失函数，为不同的场景提供了了灵活性和适应性。另一个优势是模型的可解释性。通过计算变量重要性，算法允许用户理解每个预测变量在做出预测时的相对重要性，有助于变量选择和理解底层数据模式。然而，需要注意的是，如果配置不当，梯度提升容易出现过拟合。因此，参数调优和配置对于确保梯度提升模型的最优性能并防止过拟合至关重要。\n\
  \n## 章节讨论题\n\n1. 什么是梯度提升？它是如何工作的？\n2. 梯度提升与其他集成方法有何不同？\n3  与其他机器学习算法相比，使用梯度提升的主要优势是什么？\n\
  4. 该方法的主要局限性是什么？\n5. 定义损失函数，并解释它们在梯度提升中的作用？梯度提升常用的损失函数有哪些？在何时使用它们？\n6. 什么是梯度下降？为什么它在梯度提升中如此重要？\n\
  7. 梯度提升中的关键超参数有哪些？它们如何影响模型性能？你会如何调优这些超参数？\n8. 梯度提升容易过拟合，特别是当模型变得过于复杂时。有哪些常见方法可以用来缓解梯度提升中的过拟合？\n\
  9. 梯度提升能有效处理不平衡的数据集吗？如果可以，它是如何解决类别不平衡问题的？\n10. 传统的梯度提升、GBAM 和 SGB 之间有什么相似之处和不同之处？\n\
  11. 讨论梯度提升的计算复杂度。是否有可以采用的技巧或优化方法来提高其在大数据集上的效率？\n12. 梯度提升在哪些实际用例或领域取得了显著成功？提供示例并讨论其在这些场景中有效的背后原因？\n\
  \n## 练习题\n\n# 16 贝叶斯网络\n\nDOI: [10.1201/9781003162872-19](https://doi.org/10.1201/9781003162872-19)\n\
  \n## 引言\n\n![](img/ufig16_1.jpg) 在最后一章中，我们涵盖了最先进且复杂的机器学习方法之一——贝叶斯网络。贝叶斯网络是概率模型，利用贝叶斯定理根据先验证据进行预测。它们创建变量之间因果关系的图形表示，通常以有向无环图的形式存在。这些网络对于复杂系统的建模和概率推理非常有价值。\n\
  \n本章介绍了贝叶斯网络方法在数据挖掘中的应用。书中描述的具体监督学习算法包括 `Naïve Bayes`（朴素贝叶斯）、`Tree Augmented Naïve\
  \ Bayes`（树增强朴素贝叶斯）、`Bayesian Network Augmented Naïve Bayes Classifier`（贝叶斯网络增强朴素贝叶斯分类器）和\
  \ `Markov Blanket`（马尔可夫边界）。本章还描述了使用贝叶斯网络方法的因果数据挖掘过程和特定示例。由于该方法数学原理较为复杂，我将重点关注核心概念以及如何使用这种机器学习方法。书中未包含复杂的数学公式以避免混淆。由于软件自动化了贝叶斯网络建模的大部分步骤，你只需要理解该方法的基本概念和原理、优缺点以及如何解释结果。我们将以更直观的方式解释预测变量与目标变量之间的概率关系，帮助你在理解输出的同时保持分析的稳健性。\n\
  \n## 什么是贝叶斯网络？\n\n### 相关性与因果性\n\n在定义贝叶斯网络之前，让我们先讨论相关性和因果性之间的区别。数据挖掘已被证明是检测大型噪声集中模式的有效方法。换句话说，数据挖掘是探索大型数据以发现意义未知模式的极佳工具，支持组织的决策过程。然而，人们对`回归`等传统数据挖掘方法的局限性存在争议。对传统数据挖掘方法最常见的批评是无法推断变量之间的因果关系\
  \ (Cox, 2010)。\n\n\n\n\n虽然因果关系可能意味着相关性，但相关性并不一定意味着因果关系。让我们来看一个关于车祸中伤情程度的例子（图 16.1）。我们研究两个变量的影响：`age`\
  \ 和未系安全带。假设数据分析表明`age` 与受伤程度之间存在高度相关性。显然，虽然`age` 与受伤程度可能高度相关，但它并没有导致受伤。相关性主要表明不同年龄的人可能会经历不同程度受伤。为了风险评估，`age`\
  \ 可以作为预测事故程度的指标之一。然而，`age`并不是受伤的原因，因此不能用于控制受伤风险。另一方面，未系安全带被证明是事故期间受伤的主要因素之一。如果没有安全带保护，发生事故时，驾驶员可能会受伤。利用这一结果，可以通过强制要求安全带来降低受伤风险。这种讨论强调了在数据挖掘中识别因果关系的重要性。\n\
  \n![图 16.1 相关性与因果关系。](img/fig16_1.jpg)\n\n图 16.1 相关性与因果关系。\n\n现在我们理解了相关性和因果关系之间的区别，需要理解它们是如何被测试的。相关性和因果在计算上存在差异。变量\
  \ `X` 和 `Y` 之间的相关性可以通过相关系数确定。正相关意味着如果 `X` 增加`Y` 也增加；相反，负相关意味着如果 `X` 增加`Y` 则减少。相关系数的值表示两个变量之间的相关性程度。重要的是，虽然相关性是预测中常用的方法，但无法从相关性推断出因果关系。此外，使用相关方法进行数据挖掘也受到过拟合的影响，原因是样本量越大，变量之间的关系越具有统计意义。\n\
  \n因果关系的测试要困难得多，因为它需要在控制环境中隔离感兴趣的变量。当 `X` 实际上导致 `Y` 发生时，就会产生因果。在这种情况下，测试概率关系是一种常用方法。使用概率分析可以测试因果。什么是概率关系？显然，它不是相关性关系。概率关系是指两个或多个变量之间存在连接或关联，这种关系以不确定性为特征，并使用概率进行描述。具体来说，变量\
  \ `X` 和 `Y` 之间的概率关系是根据贝叶斯定理定的。该定理描述了在不考虑其他事件的情况下，给定 `X` 时事件 `Y` 的概率，以及在 `Y` 为真时观测事件\
  \ `X` 的概率。下面的公式展示了这种概率关系。你可以看到 `X` 和 `Y` 之间的概率关系由 `Y` 的概率、`Y` 的概率以及给定 `Y` 时 `X`\
  \ 的概率表示。\n\n$$P\\left( Y \\middle| X \\right) = \\frac{P\\left( X \\middle| Y \\\
  right).P\\left( Y \\right)}{P\\left( X \\right)}$$\n\n其中\n\n*   `P(Y│X)` 是给定事件 `X`\
  \ 已发生的情况下事件 `Y`发生的概率。换说，它告诉我们当我们知道`X` 已发生时`Y`发生的概率。\n*   `P(X│Y)` 是给定事件 `Y` 已发生的情况下事件\
  \ `X`发生的概率。它告诉我们当我们知道`Y` 已发生时`X`发生的概率。\n*   `P(Y)` 是不考虑任何其他事件的情况下事件 `Y`发生的概率。它代表`Y`发生的总体概率。\n\
  *   `P(X)` 是不考虑任何其他事件的情况下事件 `X`发生的概率。它代表`X`发生的总体概率。\n\n### 贝叶斯网络的定义\n\n![](img/ufig16_3.jpg)贝叶斯网络也称为贝叶斯信念网络或概率图模型，是一种用于表示和推理变量之间不确定性和概率关系的强大且流行的方法。它是一种使用有向无环图（DAG）描述变量及其条件依赖关系的视觉模型。它以\
  \ 18 世纪统计学家和哲学家托马斯·贝斯命名。\n\n贝叶斯网络由两个主要部分组成：节点和边。节点代表感兴趣的变量，而边代表变量之间的概率依赖。节点可以是离散的或连续的，它们通过指示变量之间因果关系或条件依赖的有向边连接。\n\
  \n贝叶斯网络的结构通常用有向无环图（DAG）表示，其中每个节点对应一个变量，边（或弧）捕捉了概率依赖。图中的边表示条件概率，指示一个变量对另一个变量的影响。图\
  \ 16.2 显示了贝叶斯网络结构的插图。\n\n![图 16.2 标注的有向无环图。](img/fig16_2.jpg)\n\n图 16.2 标注的有向无环图。\n\
  \n条件依赖使用条件概率表（CPTs）定义。每个节点的 `CPT` 描述了在给定图中父节点的情况下该节点的概率分布。`CPT` 允许对不确定关系进行量化，并提供在整个网络中传播概率推理的方法。\n\
  \n## 贝叶斯网络的示例\n\n![](img/icon_10.jpg)贝叶斯网络是一种相当复杂的方法，因此你可能会感到困惑。由于它的原理建立在概率和贝叶斯定理的数学基础上，并不很容易理解它的运作方式。\n\
  \n我用一个简单的例子来解释贝叶斯网络的关键概念和组件。在这个例子中，我们研究事故期间影响伤情程度的因素。我们关注四个主要变量：`Traffic`、`Wearing\
  \ the Seatbelt`、`Car Accident` 和 `Injury`。这个例子的目标是确定交通状况、系安全带、事故发生以及受伤概率之间的概率关系。该例子的贝叶斯网络图形结构由四个节点组成：`Traffic`、`Wearing\
  \ the Seatbelt`、`Car Accident` 和 `Injury`（图 16.3）。会有从 `Traffic` 到 `Car Accident`、从\
  \ `Wearing the Seatbelt` 到 `Injury` 以及从 `Car Accident` 到 `Injury` 的有向边。`Traffic`\
  \ 有两个水平：轻微或拥堵。`Car Accident` 有两个水平：是或否。`Wearing Seatbelt` 有两个水平：是或否。`Injury` 有两个水平：是或否。我们假设交通拥堵可能会增加车祸发生的概率，如果发生了事故，不系安全带可能会导致受伤。\n\
  \n\n\n\n在这个贝叶斯网络中，`Traffic`（交通）和`Wearing Seatbelt`（系安全带）是独立的，因为它们之间没有直接的因果关系。`Traffic`节点是`Car\
  \ Accident`（交通事故）节点的父节点，因为交通拥堵会增加事故风险。`Car Accident`节点和`Wearing Seatbelt`节点都是`Injury`（受伤）节点的父节点，因为事故的发生和未系安全带都会增加受伤的风险。`CPTs`中的概率代表了在给定条件下不同事件发生的可能性。假设在运行分析后，我们发现每个节点的`CPT`如下（注意`Traffic`和`Wearing\
  \ Seatbelt`是前驱节点，因此我们拥有这些事件的先验概率；另外两个变量的条件概率基于这两个前驱节点来确定）。\n\n### 节点 1 – Traffic\n\
  - 变量：`Traffic`\n- 值：`Light`（轻畅），`Heavy`（拥）\n- 先验概率：`P(Traffic = Light) = p`；`P(Traffic\
  \ = Heavy) = 1-p`（其中 `p`是一个已知概率）。在这种情况下，我们假设 `p = 0.3`。\n\n### 节点 2 – Wearing Seatbelt\n\
  - 变量：`Wearing Seatbelt`\n- 值：`True`（是），`False`（否）\n- 先验概率：`P(Wearing Seatbelt =\
  \ True) = q`；`P(Wearing Seatbelt = False) = 1-q`（其中 `q`是一个已知概率）。在这种情况下，我们假设 `p =\
  \ 0.8`。\n\n### 节点 3 – Car Accident：受 Traffic 影响\n- 变量：`Car Accident`\n- 值：`True`，`False`\n\
  - 条件概率：\n    - `P(Accident = True|Traffic = Light) = r = 0.2`（解释：交通轻畅时发生交通事故的概率为\
  \ 0.2）。\n    - `P(Accident = False|Traffic = Light) = 1-r = 0.8`（解释：交通轻畅时不发生交通事故的概率为\
  \ 0.8）。\n    - `P(Accident = True|Traffic = Heavy) = s = 0.7`（解释：交通拥堵时发生交通事故的概率为\
  \ 0.7）。\n    - `P(Accident = False|Traffic = Heavy) = 1-s = 0.3`（解释：交通拥堵时不发生交通事故的概率为\
  \ 0.3）。\n\n### 节点 4 – Injury：受 Car Accident 和 Wearing Seatbelt 影响\n- 变量：`Car Accident`,\
  \ `Injury`\n- 值：`True`，`False`\n- 条件概率：\n    - `P(Injury = True|Accident = True,\
  \ Wearing Seatbelt = True) = t = 0.2`（解释：发生交通事故且系了安全带时，受伤的概率为 0.2）。\n    - `P(Injury\
  \ = False|Accident = True, Wearing Seatbelt = True) = 1-t = 0.8`\n    - *解释*：发生交通事故且系了安全带时，未受伤的概率为\
  \ 0.8。\n    - `P(Injury = True|Accident = True, Wearing Seatbelt = False) = u =\
  \ 0.9`\n    - *解释*：发生交通事故且未系安全带时，受伤的概率为 0.9。\n    - `P(Injury = False|Accident =\
  \ True, Wearing Seatbelt = False) = 1-u = 0.1`\n    - *解释*：发生交通事故且未系安全带时，未受伤的概率为\
  \ 0.1。\n    - `P(Injury = True|Accident = False, Wearing Seatbelt = True) = v =\
  \ 0.001`\n    - *解释*：未发生交通事故且系了安全带时，受伤的概率为 0.001。\n    - `P(Injury = False|Accident\
  \ = False, Wearing Seatbelt = True) = 1-v = 0.999`\n    - *解释*：未发生交通事故且系了安全带时，未受伤的概率为\
  \ 0.999（注：原文此处为 0.2 可能有误，已按公式逻辑翻译）。\n    - `P(Injury = True|Accident = False, Wearing\
  \ Seatbelt = False) = w = 0.05`\n    - *解释*：未发生交通事故且未系安全带时，受伤的概率为 0.05。\n    - `P(Injury\
  \ = False|Accident = False, Wearing Seatbelt = False) = 1-w = 0.95`\n    - *解释*：未发生交通事故且未系安全带时，未受伤的概率为\
  \ 0.95。\n\n使用这个贝叶斯网络，我们可以进行各种类型的推理。例如：\n- 给定交通拥堵的证据，我们可以计算交通事故的概率。这涉及使用来自`Car Accident`节点`CPT`的条件概率。\n\
  - 给定发生了交通事故以及驾驶员是否系了安全带的证据，我们可以计算受伤的概率。这涉及使用来自`Injury`节点`CPT`的条件概率。\n\n这个简单的示例展示了贝叶斯网络如何捕捉变量之间的依赖关系并建模概率关系。在实践中，贝叶斯网络可以变得更加复杂，整合额外的变量和更复杂的因果关系，从而实现更高级的推理和决策。\n\
  \n## 贝叶斯网络的实际应用\n\n![](img/icon_4.jpg)总体而言，贝叶斯网络的通用性在于它们能够对复杂的依赖关系、整合领域知识、处理不确定性并提供概率支持。\n\
  \n它们在许多领域都有实际应用。贝叶斯网络的一些显著应用包括：\n\n1. **医学诊断**：贝叶斯网络可用于医学诊断和决策支持。它们可以建模症状、疾病和检测结果之间的关系，以提供概率评估。\n\
  2. **风险评估**：贝叶斯网络可以对各种因素之间的依赖关系，并对特定结果或事件进行概率预测，例如金融风险、网络安全威胁或航空事故。\n3. **欺诈检测**：该算法可以用于各种领域的欺诈检测，如信用卡欺诈、保险欺诈或网络入侵检测。\n\
  4. **空域交通流管理**：贝叶斯网络有助于优化空中流量并管理拥堵。它们可以考虑天气状况、飞机性能和空管决策，进行实时预测和决策。\n5. **文本分类**：该算法可以建模文档中单词或特征之间的关系，并根据其概率依赖对新文档进行分类。因此，它可以应用于文本分类任务，如情感分析或垃圾检测。\n\
  6. **图像和视频处理**：贝叶斯网络可以捕捉视觉特征、物体外观和上下文信息之间的关系，以提高这些任务的准确性。相应的，它们可用于物体识别、场景理解和视频分析。\n\
  7. **事故调查**：在调查航空事件或事故时，贝叶斯网络可分析数据并建模不同因素之间的因果关系。这有助于识别影响因素并理解导致事故的事件序列。\n8. **预测性维护**：贝叶斯网络支持航空运输、制造业和能源等行业的预测性维护。它们建模传感器数据、设备状态和故障事件之间的依赖关系，以预测并防止设备故障。\n\
  \n## 基本概念\n\n![](img/shut3_2.jpg)贝叶斯网络是一种高级且复杂的机器学习算法。它们是表示变量之间概率关系的图模型。因此，有效使用和解释这些模型具有挑战性。表\
  \ 16.1 展示了贝叶斯网络的关键概念及其描述。通过理解这些基本概念，你可以有效地构建、分析并在贝叶斯网络中进行概率推理，使其成为处理不确定性和在各个领域做出明智决策的价值工具。\n\
  \n\n\n\n\n# 表 16.1 (chapter16.xhtml#b16tbl16_1) 贝叶斯网络基础概念\n\n| 术语 | 说明 |\n| ---\
  \ | --- |\n| 贝叶斯网络 | 贝叶斯网络，也称为信念网络或概率图模型，是一种用于表示和推理变量之间不确定性和概率关系的强大且流行的方法。它是一种图形模型，通过有向无环图表示一组变量及其条件依赖关系。\
  \ |\n| 贝斯定理 | 贝斯定理是贝叶斯网络中使用的基本方程，用于根据新证据更新概率。它在给定先验知识和观测证据的情况下计算事件的后验概率。 |\n| 节点\
  \ | 节点表示建模领域中的随机变量或事件。每个节点对应感兴趣的特定数量或属性。 |\n| 边 | 边表示节点之间的概率依赖。有向边表示变量之间的因果或直接影响。\
  \ |\n| 有向无环图 (DAG) | 贝叶斯网络的图结构由 `DAG` 表示，这是一种没有环的图（没有起点和终点同一节点的路径）。无环性确保了网络不包含反馈回路，并允许高效的概率推理。\
  \ |\n| 条件概率表 (CPTs) | 贝叶斯网络中的每个节点都有关联的 `CPT`，它定义了节点在其父节点状态下的条件概率分布。`CPT` 量化了变量之间的概率关系。\
  \ |\n| 父节点与子节点 | 在贝叶斯网络中，节点的父节点是直接影响它的节点。子节点是被直接影响的节点。 |\n| 概率关系 | 概率关系是指两个或多个变量之间存在连接或关联，这种关系以不确定性为特征并使用概率进行描述。\
  \ |\n| 概率推理 | 贝叶斯网络允许概率推理，这意味着根据网络中其他变量的证据（观测数据或值）计算特定事件或变量的概率。推理基于贝叶定理。 |\n| 先验概率\
  \ | 先验概率表示在观察任何证据或数据之前对变量的初始信念或知识。它通常作为贝叶斯网络建模过程的一部分指定。 |\n| 后验概率 | 后验概率表示在给定观测证据或数据的情况下变量的更新概率。它是通过使用贝叶定理将先验概率与观测数据的似然性相结合计算得。\
  \ |\n| 似然 | 贝叶斯网络中的似然表示给定网络中变量值的情况下观测特定证据的概率。它源自条件概率表。 |\n| 证据 | 证据是指贝叶斯网络中某些变量的观测值或状态。它用于更新网络中其他变量的概率。\
  \ |\n| 学习 | 贝叶斯网络的学习涉及从数据中估计网络结构和参数。这可以通过基于约束的方法或基于评分的方法来实现。 |\n| 频率派统计学 | 频率派统计学，也称为频率派推理，是一种数据分析的统计框架和方法，专注于重复采样和事件的长期频率的概念。\
  \ |\n| 因果数据挖掘 | 因果数据挖掘是一种使用因果机器学习算法的方法，从数据中检测因果网络中涉及变量及其相互关系的未知模式，用以预测结果。 |\n| 基于评分的算法\
  \ | 基于评分的算法是一种贝叶斯网络结构学习方法，它通过最大化评分指标来根据给定数据识别最可能的网络结构。该算法旨在根据特定的评分标准寻找最符合数据的网络结构。\
  \ |\n| 基于约束的算法 | 基于约束的算法是一种通过发现变量之间的概率依赖关系从数据中学习网络结构的方法，而不直接优化评分指标。它迭代地测试和评估变量之间的条件独立性关系，以确定网络结构。\
  \ |\n\n## 优点与缺点\n\n![](img/icon_8.jpg) 像其他方法一样，贝叶斯网络具有一些重要的优点，也有缺点。在决定是否针对特定问题使用贝叶斯网络时，考虑这些优缺点至关重要。贝叶斯网络的适用性取决于具体的应用、可用数据、领域专业知识以及模型复杂度与可解释性之间的权衡。\n\
  \n### 贝叶斯网络的优点\n\n* **概率推理**：贝叶斯网络为概率推理和不确定性建模提供了一个原则框架。它们可以捕捉变量之间复杂的依赖关系并计算概率推理，让我们能够从数据中获得独特的见解。\n\
  * **因果建模**：与其他机器学习方法不同，贝叶斯网络表示变量之间的因果关系。通过显式建模因果结构，它们能够实现因果推理并帮助发现驱动观测数据的底层机制。\n\
  * **高效推理**：该方法为我们提供了高效的概率推理。一旦定义了网络结构和参数，就可以采用各种推理算法计算后验概率、做出预测或回答关于网络中变量的问题。\n\
  * **处理缺失数据**：贝叶斯网络比其他一些方法更有效地处理缺失数据。即使在某些值缺失的情况下也可以进行推理，使其在处理不完整的数据集时具有稳健性。\n* **复杂系统建模**：该方法允许研究人员对具有多个变量和相互作用的复杂系统进行建模。对于理解不同组件之间关系的问题，我们可以使用贝叶斯网络。\n\
  * **模型透明度**：贝叶斯网络提供了可解释性和透明度。变量之间依赖关系的图形表示使得更容易理解和交流模型内部的关系，有助于模型的解释和验证。\n\n###\
  \ 贝叶斯网络的缺点\n\n* **模型复杂度**：构建贝叶斯网络具有挑战性，特别是在处理大量变量或复杂依赖关系时。定义网络结构和估计参数需要领域知识、数据可用性和计算资源。\n\
  * **依赖假设**：贝叶斯网络的准确性依赖于正确识别变量之间的依赖关系。错误的假设或可用数据的局限性会导致偏差或不准确的模型。\n* **数据需求**：我们通常需要大量数据来准确估计网络结构和参数。当数据稀缺或有限时，模型的性能和泛化能力可能会受到影响。\n\
  * **计算复杂度**：贝叶斯网络中的推理可能变得计算密集型，特别是在处理大型或复杂的网络时。精确推理算法可能不可行，我们需要使用近似方法或采样技术。\n\n\n\
  \n\n\n- 模型不确定性：虽然贝叶斯网络很好地处理不确定性，但由于存在可能的网络结构，它们也会引入模型不确定性。确定最佳结构和超参数可能需要专家知识或额外的模型选择技术。\n\
  \n## 贝叶斯网络流程\n\n![](img/icon_7.jpg)贝叶斯网络建模是一个复杂的过程。下方提供了数据挖掘项目中构建和验证贝叶斯网络的重要步骤。\n\
  \n1. **数据收集与预处理**\n    * 从各种来源收集相关数据，确保它们能够准确代表问题领域。\n    * 对数据进行预处理，处理缺失值、处理异常值并在必要时对变量进行转换。\n\
  2. **变量选择与领域知识**\n    * 确定构建贝叶斯网络所需的变量。领域知识和专业知识在选择相关变量方面起着至关重要的作用。\n    * 理解变量之间的关系和依赖关系，这可以引导网络的结构。\n\
  3. **结构学习**\n    * 通过从数据中学习变量之间的概率依赖关系来确定网络结构。\n    * 使用基于约束的算法或基于评分的方法进行结构学习。\n\
  4. **参数估计**\n    * 估计网络中每个节点的 `CPTs`。这涉及计算每个变量给定其父变量的概率。\n    * 使用极大似然估计 (`MLE`)\
  \ 或贝叶斯参数估计来进行参数估计。\n5. **模型评估与验证**\n    * 将数据分为训练集和测试集以进行模型评估。\n    * 使用适当的模型拟合指标评估模型在测试集上的性能。\n\
  6. **模型解释与可视化**\n    * 解释贝叶斯网络的结构，以理解变量之间的关系和依赖关系。\n    * 对网络进行图形化可视化，以辅助模型解释和沟通。\n\
  7. **推理与预测**\n    * 使用贝叶斯定理进行概率推理，在给定证据（观测数据）的情况下计算特定事件或变量的概率。\n    * 使用贝叶斯网络根据推断出的概率进行预测或决策。\n\
  8. **模型完善与迭代**\n    * 根据反馈、领域知识或额外数据调整结构或参数，完善贝叶斯网络。\n    * 通过迭代该过程来提高模型的性能和准确性。\n\
  \n需要注意的是，构建贝叶斯网络需要领域知识、数据分析和专家判断的结合。该过程的迭代性质允许模型准确性和性能的持续完善和改进。我为所谓的因果挖掘开发了一个更通用的流程，即\
  \ `USELEI` 流程。我将在本章稍后部分介绍这一流程。\n\n## 贝叶斯网络与频率派统计学的区别\n\n![](img/icon_5.jpg)贝叶斯网络方法和频率派方法是统计推理的两种不同方法。理解这些差异是非常重要的，因为你对频率派统计熟悉且经验丰富（尽管你之前可能没有过过术语）。\n\
  \n那么，什么是频率派统计？频率派统计（也称为频率派推断）是一种数据分析的统计框架和方法，它关注重复采样和事件长期频率的概念。该名称源于该方法强调分析重复实验或观察中事件发生的频率或比例。在频率派统计中，核心思想是概率被解释为极限频率。它将统计模型的参数视为固定且未知的量，不具有概率分布。相反，重点在于使用观测数据估计这些固定参数，并根据观测频率进行推理。基本上，我们之前涵盖的基于统计的方法，包括线性回归、逻辑回归、聚类分析、主成分分析以及你可能熟悉的其他统计方法（`t-test`、`ANOVA`、`MANOVA`、`discriminant\
  \ analysis` 等），本质上都是频率派统计。\n\n由于频率派统计关注频率而非概率分布，因此它与贝叶斯网络不同。表 16.2 突出了这两种方法之间的关键差异。\n\
  \n表 16.2 贝叶斯网络与频率派统计的区别\n\n| 项目 | 贝叶斯网络 | 频率派统计 |\n| --- | --- | --- |\n| 哲学 | 贝叶斯网络将概率视为主观信念或不确定性程度的量，结合了先验知识并利用贝叶斯定理根据观测数据进行更新。\
  \ | 频率派方法将概率视为事件在重复试验中发生的长期频率，仅关注观测数据的属性。 |\n| 处理不确定性 | 贝叶斯网络通过为不确定量分配先验概率并根据观测数据进行更新，显式地建模和推理不确定性。\
  \ | 频率派方法不直接包含先验信念或量化不确定性，而是依赖抽样变异概念并仅根据观测数据估计参数。 |\n| 参数估计 | 贝叶斯网络通过指定先验概率并用观测数据更新来估计后验概率。后验分布反映了来自先验知识和数据的结合信息。\
  \ | 频率派方法使用极大似然估计等技术估计参数，其目标是找到使观测数据似然最大化的参数值。 |\n| 推理 | 贝叶斯网络提供了一个概率推理框架，能够计算各种感兴趣的概率，例如后验概率、条件概率和预测。\
  \ | 频率派方法聚焦于点估计和假设检验。它们根据观测数据提供估计和检验，而不直接量化概率。 |\n| 样本量 | 贝叶斯网络通过将先验知识纳入分析，可以有效处理较小的样本量。先验信息可以作为正则化项，有助于稳定估计并避免过拟合。\
  \ | 由于频率派方法依赖观测数据，通常需要较大的样本量来进行可靠的估计和假设检验。 |\n| 可解释性 | 贝叶斯网络提供了一个基于概率解释结果的自然框架，使得更容易沟通不确定性并根据后验分布做出明智决策。\
  \ | 频率派方法倾向于更多关注相关性估计和 p 值，在不显式考虑不确定性的情况下，这些有时被误解或导致二元决策。 |\n\n## 贝叶斯网络与因果推断\n\n\
  \n\n\n\n![](img/icon_4.jpg)实现贝叶斯网络方法时的一个常见问题是我们是否可以根据结果进行因果推理。如前所述，贝叶网络可以为变量之间的依赖关系和条件关系提供宝贵的见解。基本上，它们通过概率关系捕捉并表示变量之间的因果关系。然而，重要的是，如果没有先验领域知识或理论基础，单凭贝叶斯网络无法在严格意义上建立因果关系或推断因果关系。虽然它们没有显式地确定因果关系，但它们可以根据网络中建模的概率依赖关系推断因果关系。让我们进一步了解这些细节。\n\
  \n贝叶斯网络主要根据观测数据和假设捕捉变量之间的统计依赖关系。它们对变量之间的条件概率和关系方向进行建模，这对于预测、执行概率推理以及在给定观测证据的情况下估计事件概率非常有帮助。在贝叶斯网络中，节点之间的有向边表示条件依赖或因果关系。例如，如果变量\
  \ `A` 是网络变量 `B` 的父节点，这意味着 `A` 对 `B` 有直接的因果影响。网络结构以及每个节点关联的 `CPTs` 共同编码了变量之间的概率关系。\n\
  \n如前所述，贝叶斯网络本身不能证明因果关系。要证明真正的因果关系，我们需要隔离输入变量 `A` 并测试它在保持其他输入变量不变的情况下对输出变量 `B` 的影响。这通常在受控环境中进行，允许我们得出\
  \ `A` 确实导致 `B` 的结论。然而，这种方法并不数据挖掘项目，因为它需要设置实验，并且只能检查一两个输入变量的因果效应。在数据挖掘中，贝叶斯网络的结果可以根据观测数据和网络结构建议因果关系，但通常需要进一步的实证证据或领域知识来确定因果关系。在我们之前的示例中，从贝叶斯网络中得出的概率关系表明\
  \ `A` 可能与 `B` 存在直接的因果关系。然后，研究人员使用进一步的理论基础、领域知识甚至额外的实证证据来证明 `A` 是否真的导致 `B`。\n\n![](img/ufig16_4.jpg)尽管如此，贝叶斯网络可以作为工具帮助理解和表示因果假设。通过将领域知识和因果假设纳入网络结构和条件概率中，贝叶斯网络可以为推理潜在因果关系及其影响提供一个框架。具体来说，贝叶斯网络允许我们根据观测证据进行概率推断。这种推理可以用于分析网络内部的因果关系。因此，在本书中，当我们使用“因果推理”或“推断因果关系”术语时，我们主要指的是在假设拥有先验领域知识和因果假设的情况下，根据贝叶斯网络结构在概率推断方面确定的因果关系。\n\
  \n## 贝叶斯网络的不同类型\n\n![](img/icon_5.jpg)贝叶斯网络是一种先进且强大的方法，当目标变量与预测变量一起确定时，可以用于监督学习。贝叶斯网络模型可以捕捉变量之间的依赖关系，并根据学习到的概率进行预测或分类。对于在有标记训练数据的领域，它是分类、关联和概率推理等任务的强大方法。\n\
  \n贝叶斯网络结构主要有四种类型：朴素贝叶斯（Naïve Bayes）、树增强朴素贝叶斯（`TAN`）、贝叶斯网络增强朴素贝叶斯（`BNAN`）和马尔可夫毯子（Markov\
  \ Blanket）。图 16.4 以图的形式展示了这些网络结构的结构。\n\n![图 16.4 四种贝叶斯网络学习算法。](img/fig16_4.jpg)\n\
  \n图 16.4 四种贝叶斯网络学习算法。\n\n### 朴素贝叶斯\n\n朴素贝叶斯方法经常用于构建贝叶斯网络，主要由于其简单性。在朴素贝叶斯网络中，目标变量作为所有其他节点（预测变量）的父节点，形成了一个简单的结构。预测变量之间没有其他连接，因为输入变量被假设为彼此是条件独立的。这种假设允许快速高效的训练和分类。然而，当预测变量之间相互依赖时，朴素贝叶斯可能会受到限制，因为它忽略了变量之间的任何依赖关系。\n\
  \n这种方法以简单和易于构建而闻名，使其成为对训练样本量要求较小的选择。它是数据挖掘项目中常用的监督学习算法，允许与其他机器学习技术进行直接比较。然而，它的适用性受到条件独立假设的限制，将其使用限制在预测变量与目标变量之间存在直接关系的简单网络中。在预计预测变量将表现出因果依赖复杂网络中，这种假设通常会被违反。\n\
  \n### 树增强朴素 (TAN)\n\nTAN 通过添加一种树结构来捕捉变量之间的依赖关系，从而扩展了朴素贝叶斯。`TAN` 贝叶斯网络将目标变量与每个预测变量连接，并以树结构连接预测变量。该算法基于最大生成树算法构建网络。在\
  \ `TAN` 中，每个预测节点最多有两个父节点：目标节点和最多一个另一个预测节点。因此，每个预测节点只能有一条指向它的增强边。\n\n通过放宽条件独立假设，这种方法在保留其简单性和高效的同时可以优于朴素贝叶斯。它保留了朴素贝叶斯的简单性和高效，但通过引入有限的变量依赖关系允许了更具表达能力的模型。然而，由于树结构的限制（每个预测节点最多有两个父节点：目标节点和另一个预测节点作为可选父节点），它不允许对预测变量之间的完整因果网络结构进行全面探索。\n\
  \n### 贝叶斯网络增强朴素 (BAN)\n\nBAN 是 `TAN` 的扩展，它整合了更通用的贝叶斯网络结构。它通过在变量之间学习完整的贝叶斯网络结构来允许任意的变量间依赖关系。在\
  \ `BAN` 中，预测节点是目标节点的直接子节点，但在预测节点之间建立了一个几乎完整的贝叶斯网络，扩展了简单的树结构。因此，每个预测节点可以有多个父节点，但其中一个必须是目标变量。此外，目标变量必须是父节点而不能是子节点。`BAN`\
  \ 学习算法类似于 `TAN` 学习算法，主要区别在于使用了无限制的贝叶斯网络（`BN`）学习算法而不是基于树的学习方法。无限制贝叶斯网络学习算法通常用于实际的机器学习应用。\n\
  \n\n\n\n\n与朴素贝叶斯（Naive Bayes）和 TAN 相比，BAN 提供了一种更灵活的建模方法。BAN 算法适用于从复杂系统的大数据中学习因果网络结构。它可以捕捉变量之间更复杂的关系，但代价是增加了训练和推理的计算复杂度。\n\
  \n### 马尔可夫毯 (Markov Blanket)\n\n在贝叶斯网络的背景下，节点的马尔可夫毯是一个概念，它定义了一个节点集合，使得该节点与网络中的所有其他节点条件独立。换句话说，给定马尔可夫毯节点，该节点在概率上与网络中的所有其他节点独立。马尔可夫毯网络在目标变量与其预测变量之间建立连接，同时允许特定输入变量之间建立连接。仅允许目标变量的孩子具有额外的父节点，而所有其他变量与目标变量保持条件独立。\n\
  \n目标变量的马尔可夫毯包含三种节点：\n\n- **父母 (Parents)**：贝叶斯网络中目标变量的父。这些是通过入边直接连接到目标节点的节点。\n- **孩子\
  \ (Children)**：目标变量的子。这些是通过出边直接连接到目标节点的节点。\n- **配偶 (Spouses)**：目标变量孩子的父母。这些是直接连接到目标变量孩子的节点，但不包括目标变量本身。\n\
  \n马尔可夫毯之所以重要，因为它代表了在预测目标变量或执行概率推理时需要观测或考虑的最小变量集。一旦知道了马尔可夫毯变量，毯子之外的变量与目标变量无关。马尔可夫毯提供了一种识别和利用贝叶斯网络中变量之间条件独立关系的方法。它通过关注最小相关变量集，帮助降低概率推理的计算复杂度。\n\
  \n### 网络结构学习算法\n\n![](img/icon_4.jpg)贝叶斯网络过程中的一个重要步骤是从数据中学习网络结构。在数据挖掘中，采用学习算法来完成这项任务。在贝叶斯网络背景下，主要有两种学习算法：基于评分的算法和基于约束的算法（参见表\
  \ 16.3）。在本节中，我们将对这些算法及其差异建立基础性的理解。\n\nTable 16.3 基于评分的算法与基于约束的算法之间的差异\n\n| 项目 |\
  \ 基于评分的算法 | 基于约束的算法 |\n| --- | --- | --- |\n| 方法 | 优化评分指标（例如 `log-likelihood`、`BIC`、`AIC`）以找到最拟合数据的网络结构。\
  \ | 通过识别变量之间的条件独立关系来推断网络结构，而不直接优化评分指标。 |\n| 目标 | 最大化评分指标以平衡模型复杂性和数据拟合度。 | 关注捕捉变量之间的直接条件依赖关系，以构建一个更具解释性的网络。\
  \ |\n| 搜索空间 | 通过对网络结构进行局部修改（如添加、删除或反转边）来探索搜索空间。 | 利用统计检验来识别条件独立关系并构建骨架图，随后将其精化为部分有向无环图（DAG）。\
  \ |\n| 评分指标 | 直接使用评分指标来评估和比较不同的网络结构。 | 不直接使用评分指标，但生成的网络结构可以使用单独的评分方法进行评分。 |\n| 优点\
  \ | - 对于大型数据集具有高效性和可扩展性。<br>- 提供了模型拟合的直接衡量标准。<br>- 可以同时处理类别变量和连续变量。 | - 对过拟合具有鲁棒性，且需要的样本较少。<br>-\
  \ 捕捉直接条件依赖关系，导致网络更具解释性。<br>- 处理混合数据类型。 |\n| 局限性 | - 对局部最优敏感，可能无法彻底探索整个搜索空间。<br>-\
  \ 需要较大的样本量来进行可靠的参数估计。 | - 由于关注直接依赖，可能无法捕捉某些复杂关系。<br>- 在对许多变量进行条件独立检验时，计算量巨大。 |\n\
  | 可解释性 | 生成的网络可能很复杂，更难解释。 | 网络结构通常反映直接的因果关系，更具解释性。 |\n| 常见算法 | `Hill Climbing`、`Tabu\
  \ Search`、`Genetic Algorithms` 以及 `Max-Min Hill Climbing (MMHC)`。 | `GES`、`IAMB`\
  \ 算法以及 `PC (Peter & Clark)` 算法。 |\n\n基于评分的算法是一种贝叶斯网络结构学习方法，它通过最大化评分指标来根据数据识别最可能的网络结构。该算法旨在根据特定的评分标准找到最拟合数据的网络结构。最常用的评分指标包括\
  \ `log-likelihood`、贝叶斯信息准则 (`BIC`) 和赤池信息准则 (`AIC`)。分数越高，模型与数据的拟合程度越好。\n\n基于约束的算法是一种通过发现变量之间的概率依赖关系从数据中学习网络结构的方法，而不直接优化评分指标。基于约束的算法不是穷尽搜索所有可能的网络结构空间，而是迭代地测试和评估变量之间的条件独立关系，以确定网络结构。\n\
  \n这些方法都有其优缺点，方法的选择取决于数据集的大小、网络的复杂性、领域知识的可用性以及对结果模型所需的解释性要求等因素。\n\n### 因果数据挖掘过程\n\
  \n![](img/icon_7.jpg)鉴于贝叶斯网络能够捕捉复杂网络中变量之间的概率关系，我想介绍因果数据挖掘的概念，以及贝叶斯网络如何应用于因果数据挖掘项目。\n\
  \n![](img/ufig16_5.jpg)在之前的章节中描述的常见数据挖掘项目中，我们的目标是使用机器学习算法从数据中检测未知关系，从而使我们能够预测目标变量。在这些项目中，结果是一个根据重要预测变量准确预测目标变量的预测模型。变量之间的特定关系（捕捉变量如何相互作用和影响）通常不是研究的重点。用户需要的是一个能够准确预测感兴趣的风险或事件的冠军模型。\n\
  \n如果在某些情况下，用户想要深入挖掘数据中的模式（关于变量如何相互作用和影响），因为他们需要更深层次的洞察呢？或者进一步，他们想知道哪个变量对另一个变量有直接因果影响，而后者又影响另一个变量，以此类推。理解复杂网络中的因果关系使组织能够理解预测并长期建立有效的业务策略。在这种情况下，顺序数据挖掘可能不起。我们需要一种新的数据挖掘。我称之为*因果数据挖掘*。\n\
  \n\n\n\n\n在我 2021 年发表于《空中运输管理杂志》（Journal of Air Transport Management）的文章中，我将*因果数据挖掘*定义为“一种利用因果机器学习算法从数据到因果网络中涉及变量及其相互关系的未知模式，以预测结果的方法”。对于这类数据挖掘项目，像\
  \ SEMMA 或 CRISP-DM 这样的通用流程可能并不适用，因为它们没有反映问题的因果本质。因此，我开发了一个六步的因果数据挖掘流程：理解、采样、探索、学习、评估和推断，即\
  \ USELEI (Truong, 2021b)）。在本节中，我将描述这一过程以及它如何用于因果数据挖掘。\n\n图 16.5 展示了 USELEI 流程的六个步骤，表\
  \ 16.4 描述了每一步的详细目的和细节 (Truong, 2021b)。\n\n![图 16.5 USELEI 流程 (Truong, 2021b).](img/fig16_5.jpg)\n\
  \n图 16.5 USELEI 流程 (Truong, 2021b)。\n\n表 16.4 USELEI 因果数据挖掘流程\n\n| 步骤 | 描述 |\n|\
  \ --- | --- |\n| **第一步：理解 (UNDERSTANDING)** 目的：理解研究问题和目标 | 步侧重于从业务角度理解研究问题和研究目标。必须收集有关行业、市场、利益相关者、系统或组织的信息，然后将其转换为需要挖掘大数据来预测结果的问题陈述和研究问题。研究人员需要确定他们期望从因果数据挖掘中获得什么。应该描述系统的复杂性和动态，以及模型中可能的变量。\
  \ |\n| **第二步：采样 (SAMPLING)** 目的：选择数据集、采样和划分 | 从可靠的数据源收集并采样数据。采样方法取决于目标总体和研究范围。数据集应该足够大，以包含用于知识发现的充分信息，但不应太大，以确保建模过程的效率。然后，将数据划分为训练样本和验证样本。训练样本用于训练模型，而验证样本用于验证模型。如果选择了交叉验证方法，则应将数据分为更多的子样本。\
  \ |\n| **第三步：探索 (EXPLORING)** 目的：探索和准备数据 | 仔细探索数据集，以对变量、描述性统计、缺失值和离群值获得充分理解。必须正确分析和处理缺失数据和离群值，以避免信息丢失的同时减少偏差。因果数据挖掘数据准备中的一个关键步骤是离散化，它使用了离散化算法，如等距、归一化等距、等频、Kmeans\
  \ 和树算法。 |\n| **第四步：学习 (LEARNING)** 目的：学习无监督和监督因果网络并进行交叉验证 | 首先，构建无监督网络结构，以在不确定目标变量的情况下探索变量之间的初步因果关系。虽然该网络允许在变量之间进行因果推理并识别出对整个网络最重要的变量，但它没有指示每个变量对目标变量的重要性和影响。该网络是构建完整网络的起点。然后，使用已确定目标变量的因果学习算法构建监督网络。该网络允许研究人员预测目标变量，并检查每个预测因子对目标变量的重要性和影响。由于网络结构是从数据中学习的，因此通过比较训练和验证样本来验证创建的网络非常重要。对于大数据，建议使用更稳健的验证方法（如\
  \ k 折交叉验证），以最小地减少过拟合问题。 |\n| **第五步：评估 (EVALUATING)** 目的：评估网络性能和预测精度 | 使用模型拟合指标评估因果网络性能，以确保模型的可靠性和有效性。如果开发的模型不符合评估标准，则需要进行事后分析。在此步中，可以修改模型，通过逐个移除对目标变量预测贡献最低的变量来提高网络性能。这是一个迭代过程，持续持续达到满意的网络性能。\
  \ |\n| **第六步：推断 (INFERRING)** 目的：进行目标分析、敏感性分析和因果推理 | 报告有影响的预测因子以及它们对目标变量的影响幅度。应该同时解释总效应和直接效应。此外，可以进行敏感性分析，以发现一个预测因子的变化如何影响目标变量。最后，进行因果推理，根据效应发生的条件检查所选预测因子与目标变量之间的因果连接。推断可用于开发不同的“假设”（what-if）场景，基于这些，决策者可以制定必要的策略来应对事件或减轻风险。\
  \ |\n\n### USELEI 与 SEMMA 及 CRISP-DM 的区别\n\n你可能会问：为什么我们需要另一个数据挖掘流程？USELEI 与另外两个流程（SEMMA\
  \ 和 CRISP-DM）有什么不同？\n\n表 16.5 提供了三种数据挖掘流程（USELEI、CRISP-DM 和 SEMMA）的总结和比较。这些流程在采样、数据探索与准备、建模和模型评估等步骤方面具有相似性。然而，对于因果数据挖掘，USELEI\
  \ 流程比另外两个具有独特优势。它对构建因果网络结构、执行因果推理和进行敏感性分析有更多的强调。这些能力对于组织做出明智的业务决策非常有价值。\n\n表 16.5\
  \ USELEI、CRISP-DM 和 SEMMA 的比较\n\n| 项目 | USELEI | CRISP-DM | SEMMA |\n| --- | ---\
  \ | --- | --- |\n| 步骤 | 理解→采样→探索与准备→学习与验证→评估→推断 | 业务理解→数据理解→数据准备→建模→评估→部署 | 采样→探索→修改→建模→评估\
  \ |\n| 对业务问题的理解 | 是 | 是 | 否 |\n| 采样过程 | 是 | 边缘 | 是 |\n| 数据探索与准备 | 是 | 是 | 是 |\n\
  | 建模与验证 | 是 | 是 | 是 |\n| 完整因果网络结构 | 是 | 否 | 否 |\n| 模型评估 | 是 | 是 | 是 |\n| 决策支持（因果推理）\
  \ | 是 | 否 | 否 |\n| 决策支持（敏感性分析） | 是 | 否 | 否 |\n\n总体，SEMMA 和 CRISP-DM 是不需要变量间因果关系的顺序数据挖掘项目的优秀流程。USELEI\
  \ 专为因果数据挖掘设计。虽然它服务的受众较窄，但该流程为开展因果数据挖掘项目提供了严谨且详尽的步骤。\n\n\n\n\n我想提到贝叶斯网络在数据挖掘中起着至关重要的作用。这种方法允许我们从数据构建贝叶斯网络，提供变量间的概率关系。使用贝叶斯网络结构不仅是为了对目标变量进行预测，还为了通过推断检查变量之间的关系。我们在书中不会使用\
  \ `USEI`，但我将向你展示如何在示例中使用贝叶斯网络结构进行推断。\n\n## 贝叶斯网络的参数调优\n\n![](img/8.jpg)贝叶斯网络的参数调优通常涉及寻找最佳结构和设置以优化模型性能。与通常具有参数的机器学习算法不同，贝叶斯网络具有网络结构和参数估计过程。以下是调优贝叶斯网络时考虑的一些关键参数。\n\
  \n- **网络结构**：贝叶斯网络中节点（变量）和边（有向连接）的排列。不同的结构配置会导致不同的依赖关系。\n- **节点和边**：添加或删除节点可以改变网络结构。添加新节点可以简化模型。\n\
  - **每个节点的最大父节点**：每个节点可以拥有的父节点数量。设置此参数可以控制网络复杂度并防止过拟合。\n- **CPT 的先概率**：贝叶斯网络需要为每个节点估计\
  \ `CPTs`。配置先概率可以影响学习过程并引入先验知识。\n- **评分指标**：评分指标的选择（例如 `log-likelihood`、`贝叶斯信息准 (BIC)`\
  \ 或 `赤池信息准 (AIC)`）会影响学习过程中不同结构的评估。\n- **搜索算法**：搜索算法决定了学习过程中如何探索网络结构。基于评分和基于约束的算法是根据数据学习网络结构的常用算法。\n\
  - **先验知识**：引入先验知识或约束（例如已知关系）可以作为学习过程的一部分。\n\n记住，贝叶斯网络的调优是一项复杂的任务，因为可能的网络结构随节点数量呈指数级增长。在模型复杂性和性能之间取得平衡至关重要。此外，领域知识和对数据的理解在参数调优过程中非常关键。\n\
  \n幸运的是，SAS Miner 有内置的搜索算法使得配置贝叶斯网络变得更容易，特别是对于程序员。此外，它仍为用户提供了某些配置选项。我们将在示例中使用这些配置。\n\
  \n## 示例：贝叶斯网络\n\n![](img/10.jpg)在本示例中，我们将使用各种配置的贝叶斯网络算法构建预测模型。\n\n1. **数据集**：`AirlineRecommendation.sas7b`\n\
  2. **目标变量：Recommendation** (`binary`）：1 – 推荐；0 – 不推荐。\n3. **采样-探索-修改**：参考前面的章节。\n\
  \n### 贝叶斯网络模型\n\n在本示例中，我们训练了五种不同的贝叶斯网络模型。从 HPDM 标签页，将五个 `HP Classifier` 节点拖入画布并连接到\
  \ `Replacement` 节点。将它们命名为 `HP Classifier – Default`、`HP Classifier – NB`、`HP Classifier\
  \ – TAN`、`HP Classifier – BAN` 和 `HP Classifier – MB`。然后，从 Assess 标签页将一个 `Model\
  \ Comparison` 节点拖入画布并连接到这四个 `HP Classifier` 节点。图示所示。\n\n![](img/6_6.jpg)使用以下详情配置这五个\
  \ `HP Classifier` 模型。\n\n### 模型 1：HP Classifier Default – 自动选择\n\n使用默认属性，主要设置如下：\n\
  \n在 `HP Classifier Training` 属性中：\n\n- 将 `Network Model` 设置为 `Bayesian Network`。\n\
  - 将 `Automatic Model Selection` 设置为 `Yes`。\n- 将 `Prescreen Variables` 设置为 `Yes`。\n\
  - 将 `Variable Selection` 设置为 `No`。\n- 将 `Independence Test Statistics` 设置为 `G-Square`。\n\
  - 将 `Significance Level` 设置为 `0.2`。\n- 将 `Missing Interval Variable` 设置为 `None`。\n\
  - 将 `Missing Class Variable` 设置为 `None`。\n- 将 `Number of Bins` 设置为 `10`。\n- 将 `Maximum\
  \ Parents` 设置为 `5`。\n- 将 `Network Structure` 设置为 `Parent-Child`。\n- 将 `Parenting\
  \ Method` 设置为 `Set of Parents`。\n\n### 模型 2：HP Classifier NB\n\n按照如下修改属性设置：\n\n\
  在 `HP Classifier Training` 属性中：\n\n- 将 `Network Model` 设置为 `Naïve Bayes`。\n- 将 `Automatic\
  \ Model Selection` 设置为 `No`。\n- 将 `Variable Selection` 设置为 `Yes`。\n- 将 `Missing\
  \ Interval Variable` 设置为 `Mean`。\n- 将 `Missing Class Variable` 设置为 `Mode`。\n- 将\
  \ `Number of Bins` 设置为 `20`。\n- 将 `Maximum Parents` 设置为 `5`。\n- Keep 其他属性与 `HP Classifier\
  \ Default` 相同。\n\n### 模型 3：HP Classifier TAN\n\n按照如下修改属性设置：\n\n在 `HP Classifier\
  \ Training` 属性中：\n\n- 将 `Network Model` 设置为 `TAN`。\n- 将 `Independence Test Statistics`\
  \ 设置为 `Chi-Square` 和 `G-Square`。\n- Keep 其他属性与 `HP Classifier NB` 相同。\n\n### 模型\
  \ 4：HP Classifier BAN\n\n按照如下修改属性设置：\n\n在 `HP Classifier Training` 属性中：\n\n- 将 `Network\
  \ Model` 设置为 `BAN`。\n- 将 `Independence Test Statistics` 设置为 `Chi-Square` 和 `G-Square`。\n\
  - Keep 其他属性与 `HP Classifier NB` 相同。\n\n### 模型 5：HP Classifier MB – 马尔可夫边界\n\n按照如下修改属性设置：\n\
  \n在 `HP Classifier Training` 属性中：\n\n- 将 `Network Model` 设置为 `Bayesian Network`。\n\
  - 将 `Automatic Model Selection` 设置为 `No`。\n- 将 `Independence Test Statistics` 设置为\
  \ `Chi-Square` 和 `G-Square`。\n- 将 `Network Structure` 设置为 `Markov Blanket`。\n- Keep\
  \ 其他属性与 `HP Classifier NB` 相同。\n\n要配置 `Model Comparison` 节点：\n\n在 `Model Comparison`\
