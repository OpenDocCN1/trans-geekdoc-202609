  \n![图 7.11 绝对系数图。](img/fig7_11.jpg)\n\n图 7.11 绝对系数图。\n\n### 模型比较\n\n为了展示模型比较是如何工作的，让我们在图中添加另一个回归模型。我们对该模型使用相同的配置。唯一的区别是第二个模型——回归\
  \ (2) 不使用归一化变量。我们感兴趣的是知道哪个模型的拟合得更好。\n\n按照以下步骤操作。\n\n1. 从 Model 选项卡将第二个 Regression\
  \ 节点拖入工作区，并将其连接到 Impute 节点。将其命名为 Regression (2)。\n2. 对该模型使用相同的配置：回归类型选择线性回归（Linear\
  \ Regression），选择模型选择逐步回归（Stepwise）。\n3. 添加 Model Comparison 节点并将其连接到 Regression\
  \ (2)。\n\n   ![](img/ufig7_18.jpg)\n\n4. 在 Train 属性中进行以下更改：\n   * 将 Selection 设置为\
  \ Average。\n   * 将 Statistic 设置为 Validation。\n5. 运行 Model Comparison 节点并打开结果窗口。\n\
  \n表 7.14 展示了比较结果。\n\n| 模型拟合 | 回归 | 回归 (2) |\n| :--- | :--- | :--- |\n| 误分类率 | 32.26\
  \ | 40.38 |\n| 均方误差 | 5.68 | 6.35 |\n| 根均方误差 | | |\n\n### 逻辑回归\n\n#### 逻辑方程\n\n\
  逻辑回归适用于目标变量。以下是方程：\n\n```\nLogit(Y) = log(p / (1 - p)) = β0 + β1x1 + β2x2 + ...\
  \ + βnxn + ε\n```\n\n其中：\n* `Y` 是目标变量\n* `p` 是概率\n* `x[1]` 到 `x[n]` 是预测变量\n* `β[0]`\
  \ 是截距\n* `β[1]` 到 `β[n]` 是回归系数\n* `ε` 是残差\n\n该方程的另一种便于解释的形式是几率比：\n\n$$Odds\\left(\
  \ Y \\right) = \\left( \\frac{p}{1 - p} \\right) = e^{(β0 + β1x1 + β2x2 + ... +\
  \ βnxn + ε)}$$\n\n### 估计方法\n\n逻辑回归系数的方法与线性回归不同。估计方法是极大似然估计（MLE）。简单来说，我们首先假设目标变量的概率分布，然后我们使用似然函数来计算概率。\n\
  \n#### 假设要求\n\n正如所解释的，由于 MLE 的性质，逻辑回归不需要正态性、同方差性和线性等严格假设。通常情况下，逻辑回归具有以下假设：\n\n*\
  \ **二分类目标变量**：目标变量必须是二分类的，即有两个不同的类别。例如，1——发生事故；0——无事故。\n* **多个预测变量**：逻辑回归需要多个预测变量。然而，它不需要连续预测变量，可以很好地处理二分类或分类变量。基本上对预测变量的尺度没有限制。\n\
  * **线性**：预测变量与目标变量的 logit 值之间存在线性关系。\n\n\n\n\n\n此外，逻辑回归有一些与该方法相关的模型拟合度指标。这些指标与线性回归的模型拟合指标非常相似。表\
  \ 7.15 总结了这些回归方法之间的模型拟合度指标。因此，我们可以看到这些方法之间等效的模型拟合指标。\n\n表 7.15 线性回归与逻辑回归的特定拟合度指标\n\
  \n| 线性回归 | 逻辑回归 |\n| --- | --- |\n| 总平方和 (SST) | 基准模型的 `−2LL` |\n| 残差平方和 (SSE) |\
  \ 提议模型的 `-2LL` |\n| 回归平方和 (SSR) | 基准与提议模型之间 `-2LL` 的差值 |\n| 模型拟合的 F 检验 | 基准与提议模型之间\
  \ `-2LL` 差异的卡方检验 |\n| 决定系数 (R²) | 伪 R² 指标 |\n| *来源*: Hair 等人，2019 | |\n\n卡方检验和伪\
  \ R² 是逻辑回归的特定指标。为了理解 `-2LL` 差异的卡方检验，我们需要先理解 `-2LL`。因此，我将 `-2LL` 的描述包含在表 7.16](#chapter7.xhtml#tbl7_16)中。\n\
  \n表 7.16 推荐的逻辑回归特定指标\n\n| 逻辑回归指标 | 描述 |\n| --- | --- |\n| `-2LL` (`−2 Log Likelihood`)\
  \ | 衡量模型与似然度的拟合程度。良好模型的特征是观测结果的似然度较高或 `-2LL` 较低。在模型完美拟合数据的理想情况下，似然值达到 1，`-2LL` 分值变为\
  \ 0。 |\n| `-2LL` 差异的卡方检验 | 逐步回归过程中两个模型之间 `-2LL` 的差值。我们期望得到显著的卡方检验结果，这表明建模步骤有所改进。\
  \ |\n| 伪 R² | 与始终预测平均值的模型相比，衡量模型与数据的拟合优劣。两种最常见的伪 R² 是：<br>• McFadden 的 R²<br>• Cox\
  \ & Snell R²。注意，伪 R² 的范围不是 0 到 1，因为它的上限要低得多。因此，通俗规则是伪 R² 在 0.2 到 0.4 之间被认为拟合良好。\
  \ |\n\n### 模型选择方法\n\n在逻辑回归中，我们也有之前描述的三种逐步方法。它们包括向前逐步、向后逐步和自适应逐步。虽然逻辑回归使用的是二目标变量而不是连续变量，但它也使用了相同逐步方法。因此，我建议从自适应逐步法开始选择变量，因为它允许我们找到产生良好模型拟合的预测变量最佳组合。\n\
  \n### 如何阅读和理解逻辑回归结果？\n\n再次，在尝试解释逻辑回归结果之前，我们需要确保模型拟合良好。假设我们已经检查了逻辑回归的模型拟合指标，包括 `-2LL`、`-2LL`\
  \ 的卡方检验、伪 R²、`RMSE`、`RSE`、`EP`、误分类率、准确率、敏感性、特异性、F1 分数、Gini 系数、`LOC chart` 和 `Lift\
  \ chart`，并且我们发现模型拟合令人满意。下一步是解释逻辑回归结果，以识别显著的预测变量及其对目标变量的影响。\n\n通常，逻辑回归的估计结果包括：\n\n\
  * 逻辑系数 (`B`)\n* 标准误\n* `Wald statistic`：系数显著性检验\n* 自由度\n* 显著性值 (`p-value`)\n* `Exp(B)`\
  \ 或优势值比\n* `Exp(B)` 的 95% 置信区间\n\n我们关注有助于我们解释结果的重要输出内容。由于使用了 `logit` 函数，逻辑回归的结果更难阅读和理解。为了理解估计结果，我们将主要关注显著性值、逻辑系数和优势值比。例如，假设我们为目标变量为学生选择\
  \ A 专业的示例发现了以下回归方程：\n\n```\nLogit(m) = 0.5 - 0.3*gender + 0.4*age\n```\n\n（注：提供的原文在后半部分包含一些碎片/重复的句子，我已对其进行清理，以保持所提供技术说明的逻辑连贯性。）\n\
  \n\n\n\n\n| no\\_other\\_lty\\_cards | 其他忠诚度卡数量 | 间距 | 输入 |\n| shopping\\_amt\\\
  _airpt | 机场购物金额 | 间距 | 输入 |\n| eat\\_drink\\_airpt | 机场餐饮支出 | 间距 | 输入 |\n| class\
  \ | 乘客等级 | 类别 | 输入 |\n| origin\\_state | 出发州 | 类别 | 输入 |\n| destin\\_state | 目的地\
  \ | 类别 | 输入 |\n| depart\\_delay | 起飞延误（分钟） | 间距 | 输入 |\n| arrival\\_delay | 到达延误（分钟）\
  \ | 间距 | 输入 |\n| flt\\_cancel | 航班取消 | 二分类（是/否） | 输入 |\n| flt\\_time | 飞行时间（分钟）\
  \ | 间距 | 输入 |\n| flt\\_distance | 飞行距离（英里） | 间距 | 输入 |\n\n我们遵循 SEMMA 流程。注意采样（Sample）、探索（Explore）和修改（Modify）步骤在之前的章节中已经完成。因此，我不再重复这些步骤，仅对这些步骤的结果进行总结。\n\
