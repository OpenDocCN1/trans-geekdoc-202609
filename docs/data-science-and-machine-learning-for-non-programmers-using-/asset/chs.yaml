  \ | 26.87 | 53.16 | 124,464 | 0 | 0 | 0 | 879 |\n\n### 航空公司推荐的替换示例\n\n此示例的目的是将 `price_sensitivity`\
  \ 变量中的零值重新编码为缺失值，以纠正数据中的信息。我们在在 第 3 章 和 第 4 章 中完成的数据分区和探索步骤的基础上继续。要使用 `Replacement`\
  \ 节点，从 `Modify` 选项卡将 `Replacement` 节点拖入工作区，并按如下所示连接到 `Data Partition` 节点。\n\n![](img/ufig5_12.jpg)按照以下步骤配置\
  \ `Replacement` 节点。\n\n1. 在 `Train` 属性下：将 `Default Limits Method` 设置为 `User-Specified\
  \ Limits`（指定限制）。\n2. 在 `Score` 属性下：将 `Replacement Values` 设置为 `Missing`（缺失）。\n3.\
  \ 在 `Interval Variables` 下：点击 `Replacement Editor` 侧的省略号（三点按钮）。打开 `Interactive Replacement\
  \ Interval Filter` 窗口。\n4. 针对 `price_sensitivity` 变量：\n    * 将 `Limit Method` 设置为\
  \ `User-Specified`。\n    * 将 `Replacement Lower Limit` 设置为 `1`（即低于此下限的值将被视为缺失值）。\n\
  \    ![](img/ufig5_13.jpg)\n5. 点击 `OK`。\n6. 运行 `Replacement` 节点并打开 `Results` 窗口。\n\
  \n输出结果显示此任务创建一个名为 `REP_price_sensitivity` 的新变量。此外，1,943 个值被替换为缺失值（图 5.3）。如果按样本拆分，将有\
  \ 1,184（训练）、391（验证）和 368（测试）。新变量 `REP_price_sensitivity` 将用于流程的下一步。\n\n![图 5.3 替换结果。](img/fig5_3.jpg)\n\
  \n图 5.3 替换结果。\n\n### 航空公司推荐的填充示例\n\n在此示例中，我们使用 `Impute` 节点用平均值替换缺失值。我们选择 `mean`\
  \ 方法进行填充，是因为缺失值的百分比较低（约 2%），且它是最常用的填充方法。\n\n我们继续之前的之前的 `Replacement` 节点操作。要使用 `Impute`\
  \ 节点，从 `Modify` 选项卡将 `Impute` 节点拖入工作区并连接到 `Replacement` 节点（见下）。\n\n![](img/ufig5_14.jpg)按照以下步骤配置\
  \ `Impute` 节点。\n\n1. 在 `Train` 属性下：\n    * 对于 `Interval Variables`：将 `Default Input\
  \ Method` 设置为 `Mean`（平均值，即用可用数据的平均值替换区间输入变量的缺失值）。\n2. 运行 `Impute` 节点并打开 `Results`\
  \ 窗口。\n\n表 5.8 所示的结果显示了具有缺失值的变量（注意在 `Replacement` 步骤后创建的新名称 `REP_price_sensitivity`）、填充方法、新的填充变量（所有变量名中均添加了\
  \ `IMP` 以表示填充）、填充值标签以及训练样本中替换的缺失值数量。这些新变量将在下一步中用于训练预测模型。注意，软件仅对训练样本执行填充，因为这些数据将将用于训练模型。\n\
