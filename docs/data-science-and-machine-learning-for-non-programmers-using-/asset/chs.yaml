  \n（注：后续重复段落略）\n\n### 预测能力\n\n![](img/ufig6_4.jpg)在衡量方面，预测能力使用量方法与模型拟合度相同。然而，我们需要确保模型拟合验证样本，这意味着它能够泛化到其他数据集。另一方面，在评估预测能力之前，我们必须在训练样本上具有良好的模型拟合度，因为如果训练模型不拟合数据（模型拟合度差），它可能无法拟合其他数据集（预测能力差）。\n\
  \n获得良好的预测能力应该是我们的目标。\n\n![](img/ufig6_5.jpg)图 6.1 展示了如何衡量模型拟合度和预测能力。为了保持概念简单，我只使用了训练样本和验证样本。在第一种情况下，我们在训练样本上具有良好的模型拟合（模型很好地拟合数据）。但这不能保证预测能力，因为我们还需要确保同一个模型拟合验证样本，这意味着它能够泛化到其他数据集。\n\
  \n\n\n\n\n之前对模型拟合与预测能力的区分有助于我们更轻松地理解这一概念。无论如何，我将过拟合问题分解为几个步骤，以便你遵循。图 6.2 使用图表说明了这个问题。通过遵循这些步骤，我们应该能够识别数据挖掘项目中的过拟合问题。\n\
  \n![](img/ufig6_6.jpg)![图 6.2 过拟合插图。](img/fig6_2.jpg)\n\n图 6.2 过拟合插图。\n\n1. 我们使用训练样本来训练模型。我们实现了非常好的模型拟合，表明模型与该数据集之间具有很好的拟合度。\n\
  2. 我们使用一个新的数据集（验证样本）测试了该模型。遗憾的是，在这种情况下，模型拟合得非常差。发生了什么呢？\n3. 我们尝试使用另一个数据集（测试样本）再次进行。结果并不理想。模型拟合度仍然很差。\n\
  4. 这意味着什么？这意味着我们的模型对训练样本产生了偏差，它只在该数据集上运行良好。由于它无法在新数据集上运行，因此不具有泛化性。因此，它没有良好的预测能力，使其变得不可用。因此，我们无法部署此模型来利用真实数据对目标变量进行预测。\n\
  5. 原因是什么？我们使用训练样本过度训练了模型，导致了过拟合问题。这可能是由于用于训练模型的数据集不平衡。也可能是由于训练样本中的采样偏差造成的。或者可能是由于我们使用的机器学习算法配置引起的。\n\
  \n### 如何解决过拟合？\n\n![](img/icon_8.jpg)现在我们能够识别过拟合问题了。当我们出现过拟合时，我们的模型是无效且不可用的。那么，我们可以做什么来防止这个问题发生或解决它呢？没有标准的解决方案，但有几个可以尝试的选择。表\
  \ 6.2 描述了防止和处理过拟合的常见解决方案。\n\n表 6.2 过拟合问题的解决方案\n\n| 过拟合的解决方案 | 描述 |\n| --- | ---\
  \ |\n| 正确进行数据采样 | 通过正确的采样方法，我们可以获得对目标总体具有泛化能力的数据集；即我们的数据集与目标总体具有相同的趋势和特征。如果我们使用带有偏差的偏差训练样本，那么我们的模型也会产生偏差。使用高质量且可泛化的数据集来训练模型可以帮助我们避免过拟合。\
  \ |\n| 获取大型数据集 | 训练预测模型需要大量数据，特别是某些机器学习算法需要大量数据才能正常工作。样本量较小的数据集可能导致模型拟合不佳。足够的样本量可以增加模型的解释力，特别是当模型中包含许多变量时。拥有大型数据集还允许我们将数据集拆分为多个子样本用于验证。然而，我们应该注意不要过度训练模型，否则会导致过拟合。\
  \ |\n| 良好地清洗数据 | 训练模型需要干净的数据集。记住，“垃圾进，垃圾出”。我们的预测模型优坏取决于输入数据。包含过多噪声和无关信息的数据可能导致模型训练不佳，因为机器学习算法试图考虑所有的噪声和虚假信息，从而导致预测能力下降。我们应该仔细检查数据，纠正任何错误，并移除过度噪声和无关的预测变量。我们还应该处理缺失值和离群值，并在需要时移除具有过多缺失值或离群值的预测变量。数据清洗是数据挖掘中最耗时的步骤。它可能占整个项目时间的\
  \ 60–80%。 |\n| 正确地划分数据 | 将数据集划分为若干个子样本以训练和验证模型至关重要。通过使用正确的划分方法，我们可以确保这些子样本与原始数据集具有相同的趋势和特征。因此，我们可以最大限地减少模型训练和验证过程中的偏差，从而避免过拟合。\
  \ |\n| 保持数据的平衡 | 如我们之前讨论的，高度不平衡的数据集往往会导致过拟合，因为机器学习算法可能会将所有情况误认为负例。虽然预测准确率看起来足够高，但模型实际上未能预测出事件，这使其无效。使用不平衡的数据集是过拟合的主要原因之一。如果数据集不平衡，我们需要进行重采样以平衡响应比例。\
  \ |\n| 使用多个模型拟合指标 | 有多个模型拟合指标，每个指标都衡量模型拟合的一个方面。如果我们依赖于某一个指标，结果可能会产生误导。通过使用使用多个指标，我们可以全面且正确地评估模型拟合情况，并制定改进它的策略。\
  \ |\n| 使用成本敏感学习 | 在现实中，分类错误的成本通常是不相同的。在大多数情况下，假阴性的成本远高于假阳性的成本。因此，我们不应仅仅根据预测准确率来选择模型。通过在模型评估中引入分类错误成本的权重，我们可以选择总成本最低的模型。这种方法允许我们找到最适用于现实情况的模型，从而最小化过拟合。\
  \ |\n| 使用集成模型 | 有时，即使我们尝试了各种机器学习方法，也找不到一个最适用于我们数据的单一模型。此外，这些模型之间甚至可能意见不。在这种情况下，我们应该尝试使用集成模型，它结合多个模型的预测来创建一个单一的共识预测。集成模型通常比组成它的单个模型更准确。\
  \ |\n\n## 模型可靠性与有效性\n\n![](img/ufig6_7.jpg)我们通常收到的一个重要问题是关于模型的质量。具体来说，我们是否有一个可靠且有效的预测模型？那么，模型可靠性和有效性之间的区别是什么？可靠性和有效性的概念似乎很简单，这些术语在统计和研究方法材料中经常被使用。然而它们很少被清晰地描述和解释，特别是在数据挖掘领域。理解它们之间的区别至关重要，这允许我们正确地衡量和评估它们。我将从数据挖掘的背景出发简单地解释这些概念，让你理解它们为什么重要。\n\
  \n![](img/ufig6_8.jpg)本质上，可靠性反映了模型的内部一致性，而有效性指示了模型的准确性。简单来说，一个可靠的模型在我们用不同数据集上运行它时，应该提供一致的结果。而一个有效的模型应该对目标变量产生准确的预测。两者都很重要。但可靠性并不保证有效性。因此，我们必须对两者进行评估。仍然困惑吗？让我们来看一个简单的例子，使用秤测量一袋\
  \ 25 磅大米的重量。一个可靠的秤在多次测量中会给我们一致的重量数字。但并不意味着秤是有效的。例如，我们用秤称了十次那袋米，每次秤给出的读数都非常一致，在 22.1\
  \ 到 22.8 磅之间。正如你所看到的，这个秤非常可靠，但不准确，因为它偏差了约 2 磅。因此，我们只有可靠性而没有有效性。我们想要一个既可靠又能给出 25\
  \ 磅准确读数的秤。\n\n\n\n\n你可能会问：这是否意味着有效性（valid）也意味着具有可靠性（reliability）？答案是定的。然而，在我们多次测量重量之前，我们并不知道。例如，我们买了一个全新的秤，第一次测量给出了\
  \ 25 磅的准确读数。听起来很棒，对吧？但为了确定，我们必须重复测量几次。如果它多次产生准确的读数，那么它就是一个好秤。另一方面，如果我们持续收到不一致的读数，那么这台秤既不可靠也不有效。在数据挖掘中，我们之前讨论过的过拟合情况就是：模型在训练样本上产生了良好的预测，但在其他数据集上失败了。因此，评估模型的可靠性和有效性至关重要。在实现可靠性之前，我们无法确认整体模型的有效性。换句话说，为了实现模型有效性，模型必须一致地对目标变量产生准确的预测。本质上，模型有效性等同于预测能力。图\
  \ 6.3 展示了我们具有模型可靠性但没有有效性的情况。\n\n![图 6.3 模型可靠性和有效性。](img/fig6_3.jpg)\n\n图 6.3 模型可靠性和有效性。\n\
  \n在清晰理解可靠性和有效性区别之后，下一步是学习如何评估预测模型的可靠性和有效性。注意，我们不能分两个独立的过程来完成，因为模型拟合指标被用于这两个用途。可靠性和有效性的评估必须在同一个过程中进行，尽管我们需要为可靠性和有效性提供单独的证据。\n\
  \n### 模型可靠性与有效性评估流程\n\n![](img/icon_7.jpg)按照以下步骤评估预测模型的可靠性和有效性。\n\n1. 将样本划分为子样本，包括训练样本、验证样本和测试样本。推荐的划分比例为\
  \ 60:40，这意味着 60% 用于训练，20% 用于验证，20% 用于最终测试。\n2. 根据所选的机器学习方法配置预测模型（我们将在接下来的章节介绍每种方法的细节）。\n\
  3. 使用训练样本训练模型。然后使用验证样本验证模型。大多数数据挖掘程序都会自动运行这一步。\n4. 使用预先定义的适当指标评估训练样本的模型拟合情况（接下来的章节将提供模型拟合指标的细节）。如果模型拟合满意，则跳转到第\
  \ 5 步。否则，返回第 2 步重新配置模型。\n5. 使用指标比较训练样本和验证样本之间的模型拟合指标。\n6. 如果比较显示训练样本和验证样本之间具有一致性，那么我们可以得出具有模型可靠性的结论。注意，一致性的水平取决于研究背景和研究人员的证明。尽管如此，如果差异小于\
  \ 5%，我们可以认为可靠性是可接受的。**结论：实现了模型可靠性。**\n7. 如果没有实现模型可靠性，调整第 1 步和第 2 步中的采样和建模过程以解决问题。解决方案可能包括重采样数据、重新配置模型、使用替代的机器学习方法或使用集成模型。重复步骤\
  \ 2-5，直到实现可靠性。\n8. 评估验证样本的全完整模型拟合指标，以确认整体模型拟合情况（为此目的可以添加更多指标）。如果模型拟合满意，则跳转到第 9 步。否则，需要进一步调整以提高模型性能。\n\
  9. 评估测试样本的模型拟合情况作为最终评估。如果模型在该样本上显示出良好的拟合，那么我们就实现了模型有效性。**结论：实现了模型有效性。**\n\n### 如何报告模型可靠性和有效性结果？\n\
  \n![](img/icon_4.jpg)假设我们已经完成了预测建模过程并同时实现了模型可靠性和有效性。我们如何有效地报告这些结果？由于上述过程是迭代的，不建议展示所有步骤的结果，因为这可能会使结果比应有的更加复杂，并给读者带来困扰。我建议按照以下步骤清晰且有效地展示结果。注意，这些步骤适用于训练了多个模型的项目。\n\
  \n1. 如果有多个模型，展示模型比较结果。在这些比较中使用验证样本的关键模型拟合指标，并解释模型拟合是否满意以及原因。注意，虽然如上述流程所示，我们需要首先评估训练样本的模型拟合情况，但没有必要单独报告结果。由于验证样本用于验证模型，因此验证结果对于读者理解经过验证的模型拟合指标至关重要。\n\
  2. 根据模型比较结果确定初步的“冠军模型”（champion model）。使用多个模型拟合指标来确认这一选择。\n3. 展示训练、验证和测试样本之间模型拟合指标的比较，并解释这些样本之间的结果是否可靠以及原因。在这一步中，仅关注冠军模型。如果我们有一致的结果，就可以得出实现了模型可靠性的结论。\n\
  4. 提供额外的模型拟合指标以对模型拟合进行完整评估。确认冠军模型具有良好的模型拟合。\n5. 凭借验证样本良好的模型拟合指标和模型可靠性，我们可以得出实现了模型有效性的结论。总体，冠军模型具有良好的预测能力。\n\
  6. 报告并解释冠军模型的结构、变量之间的关系以及变量重要性。\n\n![](img/ufig6_9.jpg)\n\n### 模型比较\n\n![](img/ufig6_10.jpg)在数据挖掘中，我们的目标是从大型噪声数据中发现未知模式。这意味着挖掘数据并查看它们告诉了我们什么。我们从数据中发现的模式通常是变量之间现有文献不存在的新关系或新的预测因子。为了这个目的，很难预先哪种机器学习方法和哪些模型配置效果最好。最好的机器学习模型本质上取决于数据。我们的目标是找到最符合数据的模型。因此，使用复杂或先进的方法并不能保证我们拥有最好的模型。\n\
  \n\n\n\n![](img/ufig6_11.jpg)让我们来看图 6.4 中展示的一个假设场景。假设我们为给数据集构建了两个模型。一个模型使用先进的机器学习方法，例如神经网络（右侧的模型）。该模型生成了预测变量与目标变量之间的非线性关系，并且看起来非常拟合数据。另一个模型使用简单的方法，即线性回归，它显示了预测变量与目标变量之间的线性关系（左侧的模型）。在模型训练过程中，根据预测准确性，线性回归模型的模型拟合程度可能不如神经网络模型。然而，如果我们通过散点图直观地查看数据，很容易检测到数据遵循线性模式。这意味着，虽然线性回归模型简单得多，但它比神经网络模型更好地捕捉到了这种模式。当我们使用验证样本运行这两个模型时，我们发现回归模型始终能产生良好的模型拟合效果。另一方面，与训练结果相比，神经网络在验证样本上的模型拟合度低得多。这里发生了什么？原因是神经网络模型存在过拟合问题，因为它试图在训练过程中解释数据中的噪声并将这些噪声纳入模型中，而没有考虑到这些噪声主要是噪声。这就是为什么它在训练模型上获得了近乎完美的模型拟合，但当我们用验证样本运行该模型时，它无法做出准确的预测。因此，该模型衍生出的复杂非线性模式并没有捕捉到数据的实际模式。我们可以得出结论：该模型不可泛化性，意味着它的预测能力很差。在这种情况下，线性回归模型是更好的。\n\
  \n![图 6.4 简单线性模型和复杂的非线性模型——一个假设场景。](img/fig6_4.jpg)\n\n图 6.4 简单线性模型和复杂的非线性模型——一个假设场景。\n\
  \n![](img/ufig12.jpg)这个例子告诉我们，如果不将各种方法应用于实际数据，很难预判哪种机器学习方法是最好的。否则，我们可能一直直接使用最先进的方法，而不理会那些不先进的方法。同样，即使使用相同的方法，我们也可以建立许多配置来寻找具有预测能力的模型。例如，在上面的例子中，我们可以适当重新配置神经网络模型以捕捉线性模式而不是非线性模式。神经网络简单的形式与线性回归非常相似。\n\
  \n![](img/ufig13.jpg)考虑到这一点，为了找到具有预测能力的模型，最佳实践是使用不同的方法和配置构建多个模型。然后，我们根据模型拟合指标比较这些模型的性能，以找到性能最好的模型。这种模型被称为冠军模型（champion\
  \ model），可以作为现实生活中的最终预测模型。注意，它仅仅是我们通过给定数据训练和验证的模型中的冠军。因此，冠军模型仍有模型可能不具备预期的预测能力。这种情况发生在我们训练的所有模型都没有良好的拟合效果时，因此其中最好的模型并不一定是一个好模型。我们可以称其为“相对最优”。因此，我们仍然需要评估这个冠军模型，并决定是否需要进一步的调整或增加额外的模型。\n\
  \n### 模型比较步骤\n\n按照以下步骤构建并比较模型：\n\n1. 使用适用于给定数据的不同机器学习方法和配置，开发并训练多个预测模型。\n2. 使用训练样本和验证样本运行这些模型。\n\
  3. 选择用于筛选的模型拟合指标。\n4. 使用确定的指标比较模型并选择冠军模型。\n5. 检查冠军模型的模型拟合情况，看是否令人满意。如果不满意，则对现有模型的配置进行调整，或考虑添加新模型。\n\
  6. 重复步骤 1-5，直到获得满意的冠军模型。\n7. 使用测试样本评估冠军模型的模型拟合情况，以确认其预测能力。\n\n![](img/ufig6_14.jpg)\n\
  \n## 模型拟合指标\n\n![](img/icon_8.jpg)我们已经讨论了模型拟合和预测能力。那么我们如何评估它们呢？换句话说，我们应该使用哪些特定的模型拟合指标来评估？正如之前提到的，为了避免混淆，我使用\
  \ `model fit` 代替 `goodness-of-fit`，使用 `model fit metrics` 代替 `goodness-of-fit indices`。再次，这些指标也被用于评估预测能力。请记住，对于关联模型和分类模型有不同的指标，因为它们具有不同类型的变量。表\
  \ 6.3 总结了这些指标。注意，在本章中，我们关注的是通用模型拟合指标。每种方法可能有其特定的拟合指标，我们将在相应的章节中详细描述（并非所有机器学习方法都有特定指标）。\n\
  \n表 6.3 模型拟合指标摘要\n\n| | 关联模型 | 分类模型 |\n| --- | --- | --- |\n| *目标变量* | 连续型 | 二分类或离散型\
  \ |\n| 通用模型拟合指标 | - 均方根误差 (RMSE)<br>- 平均绝对百分误差 (MAPE)<br>- 相对平方误差 (RSE)<br>- 解释能力\
  \ (EP)<br>- 实际值预测图<br>- 残差预测值图 | - 分类率<br>- 预测准确率<br>- 特异性<br>- 敏感性<br>- F1 分<br>-\
  \ ROC 图（适用于二分类目标模型）或 ROC 指标<br>- 提升图或提升值<br>- Gini 系数 |\n| 机器学习方法特定指标 | 取决于机器学习方法（将在后续章节介绍）。注意，并非所有机器学习方法都需要额外指标。\
  \ |\n\n## 关联模型的模型拟合指标\n\n![](img/icon_5.jpg)模型拟合指标用于评估我们训练的模型与数据的拟合程度。它是通过预测的准确性或误差来衡量的。对于连续目标变量关联模型，我们可以将这些指标分为误差衡量和图表。误差衡量允许我们对拟合情况进行数值评估，而图表允许我们直观地检查拟合情况。\n\
  \n### 预测误差衡量\n\n误差衡量了我们训练的模型偏离数据的程度。通常，误差越小，模型越准确。统计学中有许多误差衡量方法，从简单的到复杂的都有。使用所有方法是多余的且没必要的，因为其中某些方法非常相似。我描述了一些常见的衡量方法并推荐了最实用的。以下公式展示了这些常见的误差衡量方法以及如何使用实际值、预测值和平均值计算这些误差。\n\
  \n```\n平方误差和 (SSE)\nSSE = sum(Actual - Predicted)²\n```\n\n\n\n\n# 回归平方和 (SSR)\n\
  \nSSR = (预测值 - 平均值)$²$ 的和\n\n### 总平方和 (SST)\n\nSST = (实际值 - 平均值)$²$ 的和\n\n### 平均绝对误差\
  \ (MAE)\n\n```\n$$MAE = \\frac{\\left. Sum~of~ \\middle| Actual - Predicted \\right|}{sample~size}$$\n\
  ```\n\n### 均方误差 (MSE)\n\n```\n$$MSE = \\frac{Sum~of~\\left( Actual - Predicted \\\
  right)^{2}}{sample~size}$$\n```\n\n# 均方根误差 (RMSE)\n\n```\n$$RMSE = \\sqrt{\\frac{Sum~of~\\\
  left( Actual - Predicted \\right)^{2}}{sample~size}}$$\n```\n\n# 平均绝对百分比误差 (MAPE)\n\
  \n```\n$$MAPE = \\frac{Sum~of~\\left| \\frac{Actual - Predicted}{Actual} \\right|}{sample~size}$$\n\
  ```\n\n### 相对平方误差 (RSE)\n\n```\n$$RSE = \\frac{Sum~of~\\left( Actual - redicted\
  \ \\right)^{2}}{Sum~of~\\left( Actual - Mean \\right)^{2}} = \\frac{SSE}{SST} =\
  \ \\frac{Unexplained~Variance}{Total~Variance}$$\n```\n\n### 模型解释力 (EP)\n\n```\n\
  $$EP = ~1~ - ~RSE = \\frac{Explained~Variance}{Total~Variance}$$\n```\n\n我们可以注意到，`SSE`、`SSR`\
  \ 和 `SST` 是其他误差指标的重要组成部分，尽管它们没有被用作最终的模型拟合指标。因此，我将它们的含义描述如下：\n\n- 误差平方和 (`SSE`) –\
  \ 未未解释的方差：数据与模型预测值之间的距离。\n- 回归平方和 (`SSR`) – 已解释的方差：平均值与模型预测值之间的距离。\n- 总平方和 (`SST`)\
  \ – 总方差：数据与平均值之间的距离。\n\n注意，在这些指标中，平均值是数据集中实际值的平均数，它代表了在我们不使用任何模型时的预期预测值。图 6.5 以线性回归为例，说明了\
  \ `SSE`、`SSR` 和 `SST` 之间的关系。\n\n![图 6.5 线性回归的 SSE, SSR 和 SST。](img/fig6_5.jpg)\n\
  \n图 6.5 线性回归的 SSE, SSR 和 SST。\n\n![](img/ufig6_15.jpg)\n\n![](img/icon_4.jpg)让我们来讨论一些流行的模型拟合指标。平均绝对误差\
  \ (`MAE`) 是所有绝对误差的平均值，代表了实际值与预测值之间的平均距离。`MAE` 易于解释，因为它告诉了我们与目标变量相同尺度的平均绝对误差。`MAE`\
  \ 的主要缺点是它以相同的方式对待所有误差，不对大误差进行惩罚。均方误差 (`MSE`) 与 `MAE` 类似，但我们使用的是误差的平方而不是绝对误差。`MSE`\
  \ 是所有平方误差的平均值。`MAE` 和 `MSE` 关键区别在于，由于误差是平方的，`MSE` 会在更大程度上惩罚大误差。在某些情况下，惩罚大误差可能是重要的，因为我们可以优先选择误差较小的模型。因此，`MSE`\
  \ 能更好地捕捉模型拟合情况。`MSE` 的缺点是它使用了误差的平方值，这与数据的尺度不相同。均方根误差 (`RMSE`) 通过使用 `MSE` 的平方根解决了这个问题，使得\
  \ `RMSE` 与数据具有相同的尺度。出于这个原因，我推荐使用 `RMSE`。\n\n`RMSE` 是依赖尺度的，可以比较具有相同目标变量且相同尺度的模型之间的预测误差。它通过使用平均分消除了样本量的影响，并使用平方值的影响而非实际差异的影响。需要注意的是，`RMSE`\
  \ 是依赖尺度的，并不能告诉我们准确性，因为它们不是以百分比表示。例如，我们有两个模型，一个的 `RMSE` 为 0.12，另一个的 `RMSE` 为 0.36。在这种情况下，我们可以得出第一个模型的拟合效果更好的结论，因为它的\
  \ `RMSE` 较低。然而，我们无法就准确性的角度得出该模型的拟合结论，因为 `RMSE` 很难解释。\n\n在这种背景下，平均绝对百分比误差 (`MAPE`)\
  \ 是一个更好的指标，因为它代表了百分比误差。换句话说，`MAPE` 是独立于尺度的，并告诉我们百分比误差。`MAPE` 越低，预测准确性越高。它还通过使用平均值和绝对值的影响消除了样本量的影响。`MAPE`\
  \ 没有标准的截断值。但我的经验法是，`MAPE` 为 0.05 或低意味着模型拟合极佳，`MAPE` 为 0.1 或低意味着拟合良好。\n\n除了 `MAPE`\
  \ 之外，相对平方误差 (`RSE`) 是另一个以百分比表示的独立尺度指标。如公式所示，`RSE` 是 `SSE` 除以 `SST`，表示模型中未解释方差的比例。`RSE`\
  \ 允许我们计算解释力 (`EP`)。`EP` 是 `SSR` 除以 `SST`，表示模型中已解释方差的比例。`EP` 是 1 减去 `RSE`。`EP` 是一个重要指标，因为它代表了模型根据预测变量的方差解释目标变量方差的程度。简单来说，它展示了模型能多好地解释方差。`EP`\
  \ 为 92% 模型解释方差的比例，这可以来评估模型拟合效果。\n\n![](img/ufig6_16.jpg)再次提到 `RSE` 和 `EP` 是可以用来评估模型拟合的。我的经验法是\
  \ `EP` 为 90% 或更高意味着模型拟合极佳，`EP` 在 70% 到 90% 之间意味着拟合良好。在大多数情况下，`EP` 为 50% 到 70% 是可以接受的。表\
  \ 6.4 展示了我的推荐模型拟合指标。\n\n| 指标 | 描述 | 推荐截断值 |\n| --- | --- | --- |\n| `RMSE` | 依赖尺度，数据集中预测值与实际值之间平均误差的衡量\
  \ | 无；取决于数据 |\n| --- | --- | --- |\n| `MAPE` | 独立尺度，数据集中预测值与实际值之间百分比误差的衡量 | `MAPE`\
  \ = 0.05 或更低：极佳；`MAPE` = 0.05–0.1：良好；`MAPE` = 0.1–0.15：可以 |\n| `RSE` | 独立尺度，与始终预测实际值的简单基准模型相比，模型预测的相对改进衡量\
  \ | `RSE` = 0.1 或更低：极佳；`RSE` = 0.1–0.3：良好；`RSE` = 0.3–0.5：可以 |\n| `EP` | 独立尺度，模型捕捉输入变量与目标变量之间底层关系的程度衡量\
  \ | `EP` = 90% 或更高：极佳；`EP` = 70%–90%：良好；`EP` = 50%–70%：可以 |\n\n\n\n\n图 6.6 实际值预测值图以及残差预测值图\
  \ – 一个良好的模型拟合示例。\n\n残差通过实际值与预测值之间的差值来衡量。`残差预测值图`是一张非常重要的图表，因为它不仅展示了实际值与预测值之间的接近程度，还指示了残差中的任何模式。该图通过在\
  \ Y 轴上绘制残差、在 X 轴上绘制预测值来实现。点与线之间的距离反映了预测的准确性。我们希望这个距离不宜太大，以确保预测的准确性。\n\n![](img/ufig6_17.jpg)此外，我们需要检查此图表以查看是否存在任何明显的模式。图中非随机模式表明残差与预测值之间存在相关性，这意味着存在潜在的混杂变量。换句话说，模型中的预测因子没有捕捉到残差中揭示的解释信息。通常，我们期望图表没有清晰的模式，也称为随机模式。换句话说，只有白噪声。为了满足这一要求，点应该对称分布并聚类在图表的中间（参见图\
  \ 6.6）。\n\n图 6.7 显示了几个具有非随机模式的散点图，例如分布不均（图 A）、明显的形状（图 B 和 C）以及离群值（图 D）。在这些情况下，我们得出模型没有达到满意的拟合效果，应该进一步改进。解决方案可能包括重新配置、使用集成模型、通过重采样增加更多数据点或添加额外的预测因子。\n\
  \n![图 6.7 非随机模式的残差预测值图。](img/fig6_7.jpg)\n\n图 6.7 非随机模式的残差预测值图。\n\n总体，我建议使用 `RMSE`、`MAPE`、`RSE`\
  \ 和 `EP` 来比较模型，并使用 `MAPE`、`RSE`、`EP`、实际预测值图以及残差预测值图来评估模型的拟合情况。\n\n## 示例：关联模型的拟合指标\n\
  \n![](img/icon_10.jpg)让我们回顾一个关联模型的示例，看看这些指标是如何计算和解释的。例如，我们构建并训练了一个预测模型，用于预测某城市夜间游船的售票数量。表\
  \ 6.5 显示了预测建模过程产生的实际值和预测值。残差本质上是预测误差，通过实际值与预测值之间的差值来衡量。平方误差是误差的平方值。\n\n表 6.5 实际值与预测值\n\
  \n| 编号 || 实际值 || 预测值 || 残差（误差） || 平方误差 |\n| --- | --- | --- | --- | --- |\n| 1 ||\
  \ 779 ||   750 ||  29 ||  841 |\n| --- | --- | --- | --- |\n| 2 || 958 ||   878\
  \ ||  80 || 6,400 |\n| 3 || 860 ||   850 ||  10 || 100 |\n| 4 || 882 ||   821 ||\
  \  61 || 3,721 |\n| 5 || 606 ||   508 ||  98 || 9,604 |\n| 6 || 766 ||   813 ||\
  \  47 || 2,209 |\n| 7 || 669 ||   761 ||  92 || 8,464 |\n| 8 || 856 ||   847 ||\
  \  9 || 81 |\n| 9 || 686 ||   652 ||  34 || 1,156 |\n| 10 || 887 ||   829 ||  58\
  \ || 3,364 |\n| 11 || 995 ||   907 ||  88 || 7,744 |\n| 12 || 779 ||   724 ||  55\
  \ || 3,025 |\n| 13 || 953 ||   995 || −42 || 1,764 |\n| 14 || 771 ||   726 ||  45\
  \ || 2,025 |\n| 15 || 804 ||   886 || −82 || 6,724 |\n| 16 || 992 || 1,034 || −42\
  \ || −42 |\n| 17 || 666 ||   508 ||  98 || 9,604 |\n| 18 || 776 ||   813 ||  37\
  \ || 2,209 |\n| 19 || 686 ||   652 ||  34 || 1,156 |\n| 20 || 887 ||   829 ||  58\
  \ || 3,364 |\n\n使用公式，我们计算出：\n\n*   `RMSE` = 54.55\n*   `MAPE` = 7.35%\n*   `RSE`\
  \ = 54.55\n*   `EP` = 0.07\n\n\n\n\n通常，在大多数数据挖掘项目中，我们倾向于预测一个事件和一个非事件。在这种情况下，我们通常有一个二分类目标变量，其取值为\
  \ `1`（事件）或 `0`（非事件）。我们将事件（`1`）视为正例，将非事件（`0`）视为负例。例如，我们想要预测航班取消的风险，因此 `1` 表示`cancellation`，`0`\
  \ 表示`no cancellation`。在这种情况下，取消的案例是正样本，未取消的案例是负样本。有几个基于混淆矩阵计算的模型拟合指标。最常见的指标包括误分类率、预测准确率、灵敏度、特异性和\
  \ `F-1 score`。以下是基于混淆矩阵计算这些指标的公式。此外，表 6.7 模型拟合指标及描述\n\n| 模型拟合指标 | 描述 |\n| --- |\
  \ --- |\n| 误分类率 (MR) | 模型误分类目标变量（包括实际正例和实际负例）的频率 |\n| 预测准确率 (ACC) | 模型预测目标变量（包括实际正例和实际负例）的准确程度；`ACC\
  \ = 1 - MR` |\n| 灵敏度、召回率或真正例率 (TPR) | 正结果（事件）出现的概率，或模型预测真正例（事件）的能力 |\n| 特异性、选择性或真负例率\
  \ (TNR) | 负结果（非事件）出现的概率，或模型预测真负例（非事件）的能力 |\n| F1 score | 另一种准确率指标；它是灵敏度（召回率）和精确率（正例预测值）的调和平均数；高\
  \ F1 分意味着低假阳性（FP）和低假阴性（FN） |\n\n```\n$$Misclassification~rate~\\left( MR \\right)\
  \ = \\frac{FP + FN}{Total} = \\frac{FP + FN}{TP + TN + FP + FN}$$\n\n\n\n$$Accuracy~\\\
  left( {ACC} \\right) = \\frac{TP + TN}{Total} = \\frac{TP + TN}{TP + TN + FP + FN}\
  \ = 1 - MR$$\n\n $$$$Sensitivity,~Recall,~or~True~positive~rate~\\left( TPR \\right)\
  \ = \\frac{TP}{TP + FN}$$\n\n $$$$Specificity,~Selectivity,~or~True~negative~rate~\\\
  left( TNR \\right) = \\frac{TN}{TN + FP}$$\n\n $$$$F1~score = \\frac{2TP}{2TP +\
  \ FP + FN}$$\n```\n\n![](img/ufig6_20.jpg)检查多个指标而非只看一个指标至关重要。这是因为虽然准确率（`ACC`）向我们展示了整体准确性，但它并没有告诉我们假阴性（`FN`）或假阳性（`FP`）是否存在任何问题。例如，我们的准确率为\
  \ 90%，意味着误分类率为 10%。乍一看，我们似乎有一个很好的预测模型，因为模型在 90% 的情况下都能准确预测目标变量。然而，如果我们观察其他指标并发现灵敏度（召回率）仅为\
  \ 50%，那么我们需要进一步调查。灵敏度也被称为真正例率，它告诉我们模型预测正例（事件）的能力如何。低灵敏度意味着我们有高假阴性。那么，为什么我们的整体预测准确率仍然很高？正如我们在第\
  \ 3 章中所讨论的，主要原因之一是我们可能拥有不平衡的数据集。\n\n\n\n\n\n![](img/ufig6_22.jpg) 提升图（Lift chart）是另一种评估分类模型性能的常用指标。提升率（Lift）衡量预测模型有效性的指标，计算方法为使用预测模型和不使用预测模型获得的结果之比。提升图（或提升曲线）展示了提升率值与响应率之间的图形化表示。在给定的响应率下，提升值越高的模型性能越好。\n\
  \n基本上，X 轴显示百分比，Y 轴显示提升率值。基本上，对于任何给定的案例数量（X 值），提升值代表了我们预期预测出的正样本数量。请记住，基准线（无模型）是一条与\
  \ Y 轴在 `1` 处相交的水平线。例如，如果我们在没有任何预测模型的情况下选择 10% 的数据，我们默认预期可以预测出 10% 的正样本；即我们没有任何模型，只是简单地随机选择案例。这就是我们所说的没有提升（或\
  \ `Lift = 1`）。\n\n提升图向我们展示，在选定案例的情况下，通过构建预测模型，我们能够预测出更多的正样本，这表明了模型的有效性。图 6.11 展示了提升图的一个示例。该图表表明，如果我们使用预测模型选择\
  \ 20% 的案例，我们应该能够预测出 2.5 (20%) 或 50% 的正样本，因为提升值为 `2.5`。这意味着这是不使用模型时的 2.5 倍。提升值越高，模型越好。再次，我们需要将此提升图与其他模型进行比较，以决定哪种模型更好。\n\
  \n![图 6.11 提升图](img/fig6_11.jpg)\n\n图 6.11 提升图\n\n## 基尼系数\n\n![](img/ufig6_23.jpg)\
  \ 基尼系数是一种用于衡量模型判别能力的指标，即模型在区分正样本和负样本方面的有效性。在机器学习背景下，基尼系数用于衡量特征的各个属性之间正样本率的均衡程度。它的范围从\
  \ `0` 到 `1`。基尼系数越高，模型越好。从本质上说，基尼系数表示我们的模型离完美模型有多近，以及离随机模型有多远。\n\n计算基尼系数的方法有多种，但常用方法是使用\
  \ ROC 曲线下的面积（`AUROC`）。大多数软件都提供 AUROC 值。一旦我们找到了 ROC 图的 AUROC 值，就可以按照如下方式计算基尼系数，也称为\
  \ Somers' D Gini。Somers' D 以 Robert H. Somers 的名字命名，他在 1962 提出了这一指标。\n\n`Gini =\
  \ 2 * AUROC - 1`\n\n![](img/ufig6_24.jpg) 基尼系数没有标准的截断值，但根据经验法则，基尼系数达到 `0.6` 或以上即可被认为是模型拟合良好。\n\
  \n## 成本敏感学习 (CSL)\n\n![](img/ufig6_25.jpg) 正如第 3 章 所示，CSL 是一种流行的方法，允许我们根据误分类的成本来评估和选择模型。它是增强不平衡数据集中预测模型性能的有效方法。本质上上，当我们做出业务决策时，仅凭误分类率可能不是选择预测模型的最佳方法。必须考虑误分类的成本，因为在业务世界中，通常假阴性（false\
  \ negatives）和假阳性（false positives）的成本是不等的。\n\n让我们来看信用卡欺诈交易预测建模的示例。准确分类的成本为 `0`。误分类的成本必须被考虑，因为在业务世界中，通常假阴性的成本和假阳性的成本是不等的。\n\
  \n（注：此处原文似乎存在逻辑重复或语乱，翻译已根据语意尽可能处理）\n\n![](img/ufig6_26.jpg) \n\n\n\n\n如果我们想同时包含利润和成本呢？例如，在购买决策案例中，如果我们认为误分类实际上可能由于规划不当而导致更高的运营成本怎么办？在这种情况下，我们可以定义一个决策矩阵，该矩阵由准确分类的利润和误分类的成本组成。我的建议是根据利润来定义决策矩阵。对于误分类的成本，我们分配负的利润率。这样，我们仍然可以设定最大化总利润这一目标来选择最佳模型。表\
  \ 6.11 展示了该矩阵。\n\n表 6.11 包含利润和成本的决策矩阵\n\n|  || 预测事件 || 预测非事件 |\n| --- | --- | ---\
  \ |\n| 实际事件 || 真阳性利润 = P(TP) || 假阴性利润 = - C(FN) |\n| --- | --- | --- |\n| 实际非事件\
  \ || 假阳性利润 = - C(FP) || 真负性利润 = P(TN) |\n\n总利润 = TP * P(TP) + TN * P(TN) - FN *\
  \ C(FN) - FP * C(FB) \n\n## 类别（多分类）目标变量\n\n在大多数数据挖掘项目中，我们处理的是二分类目标变量，因为我们通常旨在预测事件与非事件的发生。在某些情况下，我们拥有具有多个级别的分类目标变量。它们也被称为多分类目标变量。\n\
  \n那么，在这种情况下我们如何衡量模型拟合度呢？本质上，我们使用与描述二分类目标变量相同的指标并进行一些修改。最显著的区别是，多分类目标变量的混淆矩阵级别更多，因此更加复杂。表\
  \ 6.12 显示了具有三个级别（1、2 和 3）的目标变量的混淆矩阵。例如，我们想要预测疫情期间居民的购物行为。他们有三个选择：1 – 线上购物；2 – 路边自提；3\
  \ – 店内购物。混淆矩阵包含了所有三个级别的实际值和预测值。挑战在于我们如何计算模型拟合度指标，这些指标需要 `TP`、`TN`、`FP` 和 `FN`。对于三类目标变量，我们需要找到一种计算这些值的方法。\n\
  \n表 6.12 三分类目标变量的混淆矩阵\n\n|  || 预测 1 || 预测 2 || 预测 3 |\n| --- | --- | --- | --- |\n\
  | 实际 1 || a || l || m |\n| --- | --- | --- | --- |\n| 实际 2 || x || b || n |\n| 实际\
  \ 3 || y || z || c |\n\n我在下方解释了一种用于为多分类目标变量计算 `TP`、`TN`、`FP` 和 `FN` 的方法。基本上，我们需要对这三个类分别进行计算。对于每一类，我们将该类视为正类，将另外两个类视为负类。以下公式允许我们计算每一类的这些值。\n\
  \n### 对于类别 1\n* `TP = a`\n* `TN = b + c + n + z`\n* `FP = x + y`\n* `FN = l + m`\n\
  \n### 对于类别 2\n* `TP = b`\n* `TN = a + c + m + y`\n* `FP = l + z`\n* `FN = x + n`\n\
  \n### 对于类别 3\n* `TP = c`\n* `TN = a + b + l + x`\n* `FP = m + n`\n* `FN = y + z`\n\
  \n一旦我们计算了每一类的 `TP`、`TN`、`FP` 和 `FN`，就可以使用与针对二分类目标变量相同的公式来计算模型拟合度指标。注意，当我们计算模型拟合度指标时，必须对每一类分别计算。这与二分类目标变量的情况不同，后者只需要计算一次。例如，在这个例子中，我们需要为所有三个类别计算以下指标。\n\
  \n#### 类别 1：\n* `MR (Class 1)`\n* `ACC (Class 1)`\n* `TPR (Class 1)`\n* `TNR (Class\
  \ 1)`\n* `F1 score (Class 1)`\n\n#### 类别 2：\n* `MR (Class 2)`\n* `ACC (Class 2)`\n\
  * `TPR (Class 2)`\n* `TNR (Class 2)`\n* `F1 score (Class 2)`\n\n#### 类别 3：\n* `MR\
  \ (Class 3)`\n* `ACC (Class 3)`\n* `TPR (Class 3)`\n* `TNR (Class 3)`\n* `F1 score\
  \ (Class 3)`\n\n![](img/ufig6_27.jpg) 当我们评估模型拟合度并进行模型比较时，我们需要使用所有三个类的模型拟合度指标。\n\n\
  至于 ROC 图和 Lift 图，这些图表只能为二分类目标变量构建，因为它们是二维的。然而，大多数软件都提供了以下指标供我们代替。\n\n* `AUROC`（曲线下面积）\n\
  * `Lift` 图\n\n\n\n\n![](img/shut7_1.jpg)我们已经涵盖了 SEMMA 过程的前三个步骤：采样（Sample）、探索（Explore）和修改（Modify）。所有这些努力都是为了在该过程中最重要的一步——建模（Model）做准备。在这一步中，研究人员选择机器学习方法，构建并配置多个模型，使用数据训练模型并对模型进行。这些步骤的结果是预测模型，它们产生对目标变量的预测结果。因此，你可以看到这一步在数据挖掘中的重要性，以及为什么我们需要正确地执行它。这一步中的任何错误都会导致预测模型失效。为了正确且高效地完成建模步骤，理解我们所选机器学习方法的底层基础并进行适当的配置至关重要。\n\
  \n我将用最流行的数据挖掘方法——回归（Regression）来开启建模步骤。本章描述了两种回归方法：线性回归和逻辑回归。它们在许多研究领域被广泛使用，因为其分析过程标准且直观，结果也易于解释。这些方法允许我们推导出反映预测变量与目标变量之间关系的回归方程。例如，这些方法可以用于预测客户对产品的购买情况或航班延误的风险。\n\
  \n![](img/ufig7_1.jpg)本质上，线性回归是在目标变量为连续型时的一种关联方法。目标变量与预测变量之间的关系是线性关系。另一方面，逻辑回归是在目标变量为二元（逻辑回归）或分类（多项逻辑回归）时的一种分类方法。这种回归以\
  \ logit 函数的形式呈现了预测变量与目标变量之间的非线性关系。由于回归方法出现在大多数统计学书籍和课程中，本章将对其统计基础进行简要描述，更多地关注如何将这些方法用于数据挖掘目的。我将使用一些实际示例来演示和解释数据挖掘过程以及如何解释结果。如果你对学习这些方法的统计基础感兴趣，我包含了一些你可以使用的参考文献。\n\
  \n## 什么是回归方法？\n\n回归是一种流行的方法，用于估计一个因变量（目标变量）和多个自变量（预测变量）之间的关系。回归的目标是找到一个数学函数或模型，根据自变量的值来预测因变量的值。注意，在大多数统计书中，作者使用`dependent\
  \ variable（因变量）`和`independent variable（自变量）`这两个术语。我将坚持使用书中的术语`target variable（目标变量）`和`predictor（预测变量）`，以确保一致性。但你应该记住，在本章中，`target\
  \ variable`等同于因变量，而`predictor`等同于自变量。\n\n![](img/ufig7_2.jpg)让我们来看一个例子。假设我们想预测客户是否选择去餐厅用餐。因此，目标变量是用餐决策（是或否）。预测变量可能包括性别、种族、年龄、教育、收入、饮食偏好和健康状况。从数据导出的回归模型可以识别与用餐决策有显著关系的预测变量，并估计这些预测变量与目标变量之间的数学关系。具体来说，回归方法通过估计模型中预测变量的系数（权重），来最小化目标变量预测值与实际值之间的差异。\n\
  \n回归方法的主要优势是易于理解、使用和解释。回归的数学基础与我们在统计课程中看到的相同，因此很容易找到。在书中，我将更多地关注其目的以及如何使用它。\n\n\
  ## 线性回归与逻辑回归\n\n![](img/ufig7_3.jpg)回归主要有两种类型：线性回归和逻辑回归。两者都是具有某些差异的方法。线性回归是一种目标变量为连续型的关联方法。（images/ufig7_4.jpg）另一方面，逻辑回归是一种目标变量为二元的分类方法。在这种情况下，我们称之为逻辑回归。为了避免混淆，下表`Table\
  \ 7.1`提供了线性回归和逻辑回归的示例。\n\n### 表 7.1 线性回归与逻辑回归示例\n\n| 回归方法 | 示例 |\n| --- | --- |\n\
  | 线性回归 | 目标变量是学生的成绩；它是从 0 到 600 的连续变量。预测变量包括年龄、种族、高中 GPA 和收入。 |\n| 逻辑回归 | 目标变量是学生选择某个专业的决策（二元变量）。另一个例子是学生选择四个专业之一的：营销、会计、财务或管理。预测变量包括年龄、种族、高中\
  \ GPA 和收入。 |\n\n![](img/ufig7_5.jpg)由于目标变量的不同，这些方法使用了不同的估计方法，导致了假设和结果解释上的差异。具体来说，线性回归使用普通最小二乘法（`OLS`）来估计回归方程。另一方面，逻辑回归使用极大似然法（`ML`）进行估计。\n\
  \n这些方法的回归方程如下所示。我尝试避免典型的数学符号，以使方程更容易理解，因此我用更有序的方式命名变量，而不是使用希腊字母。\n\n对于线性回归：\n\n\
  ```\ntarget = c1*predictor + c2*predictor + c3*predictor + ... + error\n```\n\n\
  对于逻辑回归：\n\n```\nlogit(target) = c1*predictor + c2*predictor + c3*predictor + ...\
  \ + error\n```\n\n其中\n\n1.  `target` 是目标变量\n\n\n\n\n\n2. `predictor` 是预测变量\n\n3.\
  \ `int` 是截距\n\n4. `coe` 是对应预测变量的回归系数\n\n5. `error` 是误差项\n\n你可以发现，在逻辑回归中，我们并不直接估计目标变量，而是估计该变量的\
  \ logit 值。当然，理解 logit 值的含义非常困难。因此，当我们解释逻辑回归的结果时，我们将使用优势比（odds ratios）而不是相关系数。我很快会详细介绍。\n\
  \n![](img/ufig7_6.jpg)图 7.1 中的图表展示了线性回归方程与逻辑回归方程的区别。如你所见，线性回归只能检测目标变量（`Y`）与预测变量（`X`）之间的线性关系。另一方面，逻辑回归可以检测目标变量（`Y`）与预测变量（`X`）之间以\
  \ logit 函数形式存在的非线性关系。在逻辑回归中，目标变量是二元的（0 或 1），因此 `Y` 只能是值之一。但注意，`logit(Y)` 与 `X` 之间的关系仍然是线性的，如上面的方程所示。因此，逻辑回归检测非线性关系的能力局限于\
  \ logit 函数和相关系数的线性效应。这是逻辑回归与其他非线性方法（如决策树、神经网络或随机森林）之间的主要区别，后者可以检测更复杂的非线性形式。\n\n\
  ![图 7.1 线性回归与逻辑回归。](img/fig7_1.jpg)\n\n图 7.1 线性回归与逻辑回归。\n\n表 7.2 展示了线性回归与逻辑回归之间的一些区别。在接下来的章节中，我们将详细介绍这两种方法以及如何使用这些方法配置模型。\n\
  \n表 7.2 线性回归与逻辑回归的区别\n\n| 项目 | 线性回归 | 逻辑回归 |\n| --- | --- | --- |\n| 因变量的测量标度 |\
  \ 线性回归中的目标变量是连续数值型的，代表一组实数范围。模型旨在建立预测变量与连续结果之间建立线性关系。 | 逻辑回归中的目标变量是二元的或分类的，代表两个或多个离散结果。模型预测某一类别中事件发生的的概率。\
  \ |\n| 输出和范围 | 线性回归的输出是连续值，预测值可以是任何实数。预测范围不受限制。 | 逻辑回归的输出是 0 到 1 之间的概率分，代表事件发生的可能性。\
  \ |\n| 模型函数 | 线性回归中的模型函数是线性方程，表示预测变量的加权和加上一个截距项。变量之间的关系被假设为线性的。 | 逻辑回归中的模型函数是逻辑（sigmoid）函数，它将预测变量的加权和转换为概率分。它模拟了事件发生的优势（odds）。注意，事件的优势与预测变量之间的关系被假设为线性的。\
  \ |\n| 应用 | 线性回归用于预测和建模连续结果，例如根据各种因素预测房价、温度或销售量。 | 逻辑回归用于二分类或多项分类分类任务，例如预测电子邮件是否为垃圾邮件，或将图像分为多个类别。\
  \ |\n| 评估指标 | 线性回归使用关联模型的常用模型拟合指标，外加 F 检验和 R 方（决定系数）。 | 逻辑回归使用分类模型的常用模型拟合指标。 |\n\
  | 优化方法 | 线性回归中的模型参数通常使用普通最小二法（OLS）等方法估计，以使误差平方和最小。 | 逻辑回归中的模型参数通常使用极大似然估计（MLE）估计，以使似然度最大。\
  \ |\n\n（注：（由于原文截断，此处继续翻译）\n\n表 7.3 回归方法的优缺点。\n\n\n\n\n\n4. `β[1]` 到 `β[n]` 是对应预测变量的回归系数\n\
  5. `ε` 是残差或误差\n\n### 估计方法\n\n本质上，估计方法是用于计算回归方程所有组件的值（包括截距、回归系数和误差项）的统计方法。普通最小二法（OLS）是线性回归的估计方法。它是一种常用的方法，用于使误差误差平方和最小化。`OLS`\
  \ 的数学基础在许多统计书中都有解释，因此我在这里进行了介绍。我想强调的是，使用这种方法会对线性回归产生一些严格的假设。\n\n### 假设要求\n\n![](img/ufig7_7.jpg)传统统计研究中的线性回归受到非常严格的假设限制以确保结果的有效性，包括正态性、同方差、线性、非共线性、连续变量无缺失值。换句话说，当我们违反这些假设时，软件仍然运行分析并产生输出。然而，我们无法确定结果是否有效，因此无法据此得出有效的结论。注意，在传统的统计研究中，我们通常只有少量预测变量（独立变量）并使用非常小的样本量。例如，如果我们有\
  \ 5 个预测变量并使用 0.25 的效应量，所需的样本量为 57 条记录。如果有 10 个预测变量，我们只需要 75 条记录的样本。\n\n在数据挖掘中，我们使用具有许多预测变量和极大样本量的数据集。因此，我们在假设方面在线回归具有更大的灵活性；即我们不需要像传统统计研究那样完全满足所有假设即可运行分析。主要原因是根据中心极限定理，当样本量足够大，样本分布可以假设为近似正态。因此，当我们将线性回归作为机器学习算法处理大数据时，我们不需要测试并满足所有假设。尽管如此，仍然建议检查几个关键项目并在某种程度上进行数据转换或修改，因为这有助于提高回归模型的性能。例如，线性回归在完整数据集上运行更好，因此强烈建议处理和填充缺失值。此外，由于正态性是该方法的一个重要假设，对数据归一化允许我们获得更好的模型拟合。最后，处理异常值会减少数据中的噪声，从而获得更好的拟合模型。\n\
  \n![](img/icon_8.jpg)你可能会问：如果不符合测试假设，我们还需要担心结果的有效性吗？这是一个很好的问题，因为我们应该始终关注结果的可靠性和有效性。在数据挖掘研究中，我们使用更严格的步骤来确保结果质量。如第\
  \ 3 章所示，我们通常将样本分为训练样本、验证样本和测试样本。训练样本用于训练模型，验证样本用于验证模型。这是确保训练的模型对于训练样本之外的样本也是有效的；即我们没有过拟合问题。通过比较这三个样本的模型结果，我们可以评估模型的性能并确保模型的可靠性和有效性。因此，即使我们不满足所有假设，这些步骤仍然允许我们保证可靠性。\n\
  \n### 关键假设\n\n虽然我们不需要满足所有假设，但仍然需要检查以下内容：\n\n- **目标变量必须是连续的**：这对于建立模型非常重要。\n- **预测变量必须是连续的**：这是一个关键要求，尽管数据挖掘中具有一定的灵活性。\n\
  - **正态性**：这是参数方法最常用的假设之一，特别是 `OLS`。虽然我们不需要达到完全的正态，但越接近正态分布模型越好。\n- **非共线性**：线性回归假设预测变量是独立的。共线性表示独立变量之间存在相关性，我们需要在运行分析之前证明它不存在。\n\
  - **无缺失值**：对于传统统计研究，回归分析需要完整的数据集。 \n\n### 线性回归模型拟合评估\n\n在 `OLS` 过程中，评估模型拟合情况非常重要。那么什么是模型拟合？我们已经在第\
  \ 6 章中详细介绍过。基本上，一方面，我们有由回归方程表示理论回归模型；另一方面，我们有目标变量和所有预测变量的数据。现在我们需要将数据拟合到该理论模型上，看看它们是否拟合良好。模型拟合衡量了我们的模型与数据的拟合程度。\n\
  \n```\nResiduals = Actual data – Predicted data\n```\n\n\n\n\n\n我在第 6 章中描述了关联模型的通用模型拟合指标，包括\
  \ `RMSE`、`MAPRE`、`RSE`、`Ethe P`、实际值预测值图以及残差预测值图。在本章中，我将专注于线性回归方法的特定指标。具体来说，当我们使用线性回归时，还需要评估\
  \ `F-test` 和 `R²`。表 7.4 解释了这些指标以及如何使用它们。\n\n### 表 7.4 线性回归特定的模型拟合指标\n\n| 指标 | 描述\
  \ |\n| --- | --- |\n| F-test | `F-test` 用于检验整体模型的显著性。换句话说，显著的 `F-test` 表示我们的回归模型比没有任何任何预测变量的模型更拟合数据。我们期望得到显著的\
  \ `F-test`。 |\n| `R²` 或决定系数 | `R²` 是线性回归模型常用的模型拟合指标。它衡量了目标变量的方差中由预测变量共同解释的百分比。对于\
  \ `R²` 没有标准的优劣标准，因为它取决于模型中预测变量的数量。然而，我的经验准则如下：<br><br>* `R²` 高于 0.7：模型拟合良好<br>*\
  \ `R²` 在于 0.5–0.7 之间：模型拟合可接受<br>* `R²` 低于 0.5：模型拟合较差<br><br>注意，`R²` 的解释应基于模型中预测变量的数量，因为预测变量越多，`R²`\
  \ 越低。因此，对于许多预测变量的模型（这通常是），较低的 `R²` 是可以接受的。 |\n| Adjusted `R²` | `Adjust R²` 是 `R²`\
  \ 的修正版本，仅考虑对模型性能有影响的预测变量。建议使用 `adjusted R²`。使用上述相同的阈值。 |\n\n在线性回归中，当我们回顾 `F-test`\
  \ 和 `R²` 的材料时，可能会看到一些术语、符号和公式。我将它们包含在表 7.5 中以便快速参考。以下是显示如何使用 `SSR` 和 `SSE` 计算 `SST`\
  \ 的公式。\n\n### 表 7.5 线性回归中的关键术语和符号\n\n| 术语 | 符号 | 描述 |\n| --- | --- | --- |\n| 目标变量\
  \ (Target variable) | `y` | 目标变量（因变量）的实际值。 |\n| 预测变量 (Predictor) | `x` | 预测变量（自变量）的实际值。\
  \ |\n| 目标变量均值 (Mean of target variable) | $\\bar{y}$ | 目标变量的平均值。 |\n| 预测值 (Predicted\
  \ value) | $\\hat{y}$ | 模型估计的目标变量预测值。 |\n| 误差 (Error) | `e` | `Error`（残差）是目标变量实际值与预测值之间的差异。\
  \ |\n| 误差和 (Sum of Squared Error) | `SSE` | 数据与模型预测值的距离。 |\n| 总平方和 (Sum of Squared\
  \ Total) | `SST` | 数据与均值的距离。 |\n| 回归平方和 (Sum of Squared Regression) | `SSR` | 均值与模型预测值的距离。\
  \ |\n\n```\nR^{2} = \\frac{SST - SSE}{SST} = \\frac{Explained variance}{Total variance}\n\
  ```\n\n正如第 6 章所解释的，这些公式仅适用于线性回归，而不适用于其他方法。你可以看到，在线性回归中，`R²` 实际上与我们在第 6 章中讨论的解释力相同。\n\
  \n### 模型选择过程\n\n![](img/icon_7.jpg) 在回归建模过程中，模型选择是训练模型的关键步骤。它描述了预测变量是如何进入回归分析的。我们可能认为可以一次性输入所有变量，分析告诉我们哪些预测变量是显著的。然而，在分析中一次性输入所有变量会增加计算时间并使模型拟拟合。可能会让你惊讶的是，决定变量如何进入模型的方法有很多。通过选择正确的变量选择方法，我们可能改进模型拟合。\n\
  \n基本上，回归文献展示了线性回归中三种主要的变量选择方法：`backward`（后向）、`forward`（前向）和 `stepwise`（逐步）。我将用简单的方法结合一些图来解释它们以便理解。然后我将向你展示在\
  \ `SAS Enterprise` 中使用的具体方法。\n\n![](img/ufig7_8.jpg) 我想在这里说明的一个重要点是，这三种方法本质上都是 `stepwise\
  \ methods`（逐步方法）。`Stepwise method` 是数据挖掘中使用的一种迭代变量选择方法，用于识别预测模型中最相关的变量子集。因此，使用术语\
  \ `stepwise` 指特定过程可能会混淆。因此我将它们重命名为 `forward stepwise`（前向逐步）、`backward stepwise`（后向逐步）和\
  \ `adaptive stepwise`（适应逐步）。对于下面的每种方法，我描述了变量选择的步骤并在图中演示了它们（图 7.2）。你可以想象，这些方法每种都会产生许多模型，最后一个通常是最好的。\n\
  \n![图 7.2 前向逐步方法。](img/fig_2.jpg)\n图 7.2 前向逐步`方法。\n\n![图 7.3 后向逐步方法。](img/fig_3.jpg)\n\
  图 7.3 后向逐步`方法。\n\n![图 7.4 适应逐步方法。](img/fig_4.jpg)\n图 7.4 适应逐步`方法。\n\n*   **前向逐步\
  \ (Forward Stepwise)** (图 7.2)\n    1. 过程从一个没有任何预测变量的模型（空模型）开始。\n    2. 将最显著的变量逐添加到模型。显著变量是指与目标变量显著关联的变量。通常，最显著的预测变量是\
  \ p 值最小或提供 `R²` 增长最大的变量。\n    3. 当所有考虑的变量都添加或满足预定义的停止规则时，停止选择。\n\n*   **后向逐步 (Backward\
  \ Stepwise)** (图 7.3)\n    1. 过程从一个包含所有预测变量的模型（全模型）开始。\n    2. 将不显著的变量从模型中移除。\n\
  \    3. 当没有变量剩余或满足预定义的停止规则时，停止选择。\n\n*   **适应逐步 (Adaptive Stepwise)** (图 7.4)\n\
  \    这种方法实际上是前向逐步，但有一个关键区别。在模型中添加额外的变量后，它可以移除当前模型中但不再显著的变量。换句话说，它是自适应的。在某些情况下，`adaptive\
  \ stepwise` 也称为 `bidirectional stepwise`（双向逐步）。\n    1. 过程从一个没有任何预测变量的模型（空模型）开始。\n\
  \    2. 将最显著的变量逐添加到模型。\n    3. 在添加额外的变量后，模型中非显著的变量将被移除。\n    4. 当所有考虑的变量都添加或满足预定义的停止规则时，停止选择。\n\
  \n\n\n\n\n![](img/ufig7_9.jpg)重要的问题是，我们应该使用哪种逐步回归法？Table 7.6 描述了每种方法的适用场景。如上所述，自适应逐步回归似乎能够选择最能预测目标变量的预测变量。与正向和反向逐步回归（后者的过程是线性且顺序的）不同，自适应逐步允许我们通过添加和删除变量来获得最佳的模型拟合效果。换句话说，它可以为模型拟合选择最佳预测变量组合。因此，这种方法被推荐用于数据挖掘。该方法的缺点是它可能需要更多的计算时间，在某些情况下可能会过拟合。尽管如此，通过对子样本进行交叉验证，我们可以评估预测能力并避免过拟合。\n\
  \nTable 7.6 何时使用逐步回归？\n\n| 何时使用正向逐步？ | 何时使用反向逐步？ | 何时使用自适应逐步？ |\n| --- | --- | ---\
  \ |\n| **预测变量数量大** 在处理大量潜在预测变量时，正向逐步回归的计算效率更高，因为它从空模型开始并增量添加变量。 | **多重共线性担忧** 如果担心预测变量之间存在多重共线性（高相关性），反向逐步有助于识别并移除冗余预测变量。\
  \ | **穷尽搜索** 自适应逐步允许对显著预测变量进行穷尽搜索，而不会导致计算量过大。 |\n| **探索性分析** 正向逐步回归是探索性分析良好的起点，因为它允许我们通过添加对目标变量有显著影响的变量来逐步构建模型。\
  \ | **良好的理论基础** 当对于某些预测变量比其他变量更重要有强大的理论基础或领域知识时，反向逐步有助于从模型中消除不显著的变量。 | **数据探索与模型构建**\
  \ 自适应逐步在数据探索和模型构建的初始阶段非常有用，因为它允许对各种预测变量子集及其对模型的影响进行全面检查。 |\n| **无先验知识** 当对于哪些预测变量可能相关没有强有先验知识或理论时，正向逐步有助于识别潜在重要的预测变量。\
  \ | **复杂模型** 反向逐步在复杂模型中特别有用，通过移除相关性较低的变量可以提高模型的解释性和泛化能力。 | **模型拟合改进** 由于自适应逐步考虑了预测变量的所有可能组合，它提供了更稳健的结果并改进了模型拟合。\
  \ |\n| | | **变量交互作用分析** 当预测变量之间的交互作用至关重要时，自适应逐步有助于识别可能未被单独的正向或反向选择捕捉的相关交互项。 |\n\n\
  由于 SAS Enterprise Miner 对这些方法的术语略有不同，我将术语对比放在 Table 7.7 中以避免任何混淆。\n\nTable 7.7 SAS\
  \ Enterprise Miner 术语及等效术语\n\n| SAS Enterprise Miner 术语 | 等效术语 |\n| --- | --- |\n\
  | Forward | Forward stepwise |\n| Backward | Backward stepwise |\n| Stepwise | Adaptive\
  \ stepwise |\n\n## 如何阅读和理解回归方程及结果？\n\n![](img/icon_8.jpg)运行回归分析后，我们使用所有推荐的指标来检查模型拟合情况，包括\
  \ R²、F 检验、RMSE、MAPE、RSE、EP、实际值与预测值对比图以及残差与预测值对比图。假设所有标准标准，说明模型拟合良好。下一步是报告和解释回归分析的输出结果。我们如何理解这些输出结果？可以得出哪些结论？\n\
  \n这些在进行任何类型的数据分析时都是常见问题，在数据挖掘中，由于我们的模型中有大量的预测变量，这变得尤为重要。现在我们来看一些简单的假设性回归方程，学习如何阅读和理解预测结果。为了简化解释，我限制了预测变量的数量。我们将在本章后面通过\
  \ SAS Enterprise Miner 数据挖掘示例查看一些实际回归结果。\n\n对于线性回归，估计结果通常包含以下信息：\n\n* 截距\n* 未标准化回归系数\
  \ (B)\n* B 的标准误差\n* 标准化回归系数 (beta)\n* t 值\n* 显著性值 (p 值)\n* B 的 95% 置信区间\n\n为了正确解释回归结果，我们关注显著性值、未标准化系数和标准化系数。Table\
  \ 7.8 提供了这些术语的描述以及在解释回归结果时的用法。\n\nTable 7.8 显著性值、未标准化回归系数与标准化回归系数\n\n| 术语 | 描述 |\n\
  | --- | --- |\n| 显著性值 (p 值) | 显著性值（p 值）是用于评估估计系数（也称为回归权重或 beta 值）显著性的统计量。它决定了每个预测变量与目标变量之间的关系是否具有统计学意义，还是随机产生的。\
  \ |\n| 显著性水平 (alpha) | 显著性水平是指在评估估计系数的统计显著性时使用的判定阈值。 |\n| 未标准化回归系数 (B) | 未标准化回归系数是线性回归中的指标，用于以原始单位量化预测变量与目标变量之间的关系。\
  \ |\n| 标准化回归系数 (beta) | 标准化回归系数是线性回归中的指标，用于在将两个变量标准化到共同尺度后，量化预测变量与目标变量之间的关系。标准化系数范围在\
  \ 0 到 1 之间，在所有情况下都通过标准差使用相同的尺度进行测量。 |\n\n\n\n\n\n确定了显著预测变量后，我们需要解释它们与目标变量之间的关系。为了做到这一点，我们使用未标准化回归系数（`B`）。基本上，未标准化回归系数是线性回归中一种衡量指标，用于量化预测变量与目标变量在其原始单位之间的关系。在我们的\
  \ `SAT` 预测示例中，假设回归结果显示 `GPA` 和 `family income` 的未标准化系数分别为 `120` 和 `0.01`。此外，截距为\
  \ `105`。根据该输出，我们可以将回归方程写如下：\n\n`SAT score = 105 + 120*GPA + 0.01*family_income`\n\
  \n在这个方程中，我们得到了截距和未标准化系数。该方程表明，假设 `family income` 和 `GPA` 是 `SAT scores` 的两个显著预测变量，且它们与\
  \ `SAT` 分数均正相关。这些预测变量通过 `GPA` 捕捉了学生的学术表现，通过 `income` 捕捉了家庭教育资源和 `SAT` 辅导。因此，如果我们知道学生这些预测变量的值，就可以根据该方程预测学生的\
  \ `SAT score`。更重要的是，我们根据系数相关性知道每个预测变量的变化将如何影响目标变量。换句话说，我们可以看到这些预测变量在预测 `SAT score`\
  \ 的重要性以及该影响的程度（称为效应大小）。例如，`GPA` 的系数相关性为 `120`；即如果 `GPA` 每增加一分，`SAT score` 将增加 `120`\
  \ 分。同样，如果 `family income` 增加 `$1`，`SAT score` 将增加 `0.01` 分。为了更直观地理解这一点，可以说如果 `family\
  \ income` 增加 `$10,000`，`SAT score` 将提高 `0.01*10,000` 或 `100` 分。\n\n注意，我没有在这个方程中包含误差项，因为我们已经在评估模型拟合度时使用了误差。误差代表了预测的\
  \ `SAT scores` 与实际分数之间的差异，由于我们的模型拟合得良好，该误差是可以接受的。此外，在这一步中，我们使用上述方程根据这两个显著预测变量的变化来预测\
  \ `SAT scores` 的变化。因此，误差是无关的。\n\n### 标准化回归系数 (beta)\n\n你可能会注意到，未标准化系数取决于预测变量的单位。换句话说，它们是依赖尺度的。例如，我们可以得出结论认为\
  \ `GPA` 的回归系数比 `family income` 高，但无法确定高出多少，因为它们的尺度不同（`GPA` 是分数，而 `income` 是美元）。为了进行有意义的比较，我们需要使用标准化系数。\n\
  \n标准化回归系数是线性回归中一种衡量指标，用于在两个变量标准化到共同尺度后，量化预测变量与目标变量之间的关系。标准化系数介于 `0` 和 `1` 之间，并且在所有情况下通过标准差使用相同的尺度进行测量。换句话说，它们是不依赖尺度的。因此，它们可以直接比较。例如，如果\
  \ `GPA` 和 `family income` 的标准化系数分别为 `0.68` 和 `0.34`，我们可以得出 `GPA` 的回归系数高于 `family\
  \ income`。\n\n## 示例：线性回归\n\n在这个示例中，我们遵循 SEMMA 流程使用线性回归来预测 `SAT scores`。\n\n### 数据描述\n\
  \nBoston 数据集由美国人口普查局收集。目标变量是 `Imv`。\n\n| 变量 |  | 尺度 | 角色 |\n| :--- | :--- | :---\
  \ | :--- |\n| `Crime` | 人均犯罪率 | | 输入 |\n| `Zn` | 住宅用地比例 | | 输入 |\n| `CharlesRiver`\
  \ | 查尔斯河（1 表示临邻河流；否则为 0） | | 输入 |\n| `NiOx` | 氧化氮浓度（百万份） | | 输入 |\n| `Rm` | 每住户平均房间数\
  \ | | 输入 |\n| `Age40` | 1940 年以前建造的业主单位比例 | | 输入 |\n| `LogDist` | 到五个就业中心的加权距离 |\
  \ | 输入 |\n| `LogAccess` | 径向高速公路的可及性指数 | | 输入 |\n| `Tax` | 每 10,000 美元的全额房产税率 |\
  \ | 输入 |\n| `PtRatio` | 生师比 | | 输入 |\n| `B` | 100(Bk - 0.63)²，其中 Bk 是城镇的黑人比例 | |\
  \ 输入 |\n| `Lstat` | 人口低地位比例的百分比 | | 输入 |\n| `Imv` | 自有房屋的中位数价值（千美元） | | 目标 |\n\n\
  ### 样本\n\n该数据集样本量为 506 条记录。由于这是一个较小的数据集，我们使用所有记录进行分析。因此，我在这里没有使用 Sample 节点。这一步的首要任务是数据划分，我们使用\
  \ `DataPartition` 节点来划分数据。由于样本量小于 `1,000`，我们使用 `60:40` 的划分比例将数据划分为训练样本和验证样本。没有创建测试样本。\n\
  \n### 探索\n\n我们首先探索数据的描述性统计。为了做到这一点，我们使用 `StatExplore` 节点。\n\n\n\n\n\n![](img/ufig7_12.jpg)\
  \ 以下是 `StatExplore` 节点的节点，显示了所有变量的详细描述性统计(表 7.10)）。选择这些参数是因为它们通常被用于探索数据。\n\n####\
