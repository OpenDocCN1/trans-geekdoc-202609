  md: '# 1.2.1 Quantum computing elements


    The key elements of quantum computing are as follows (Figure 1.1):


    ![](img/003d10cd18c2ce02e1f86a5992a8292b_14_0.png)


    **Figure 1.1:** Key elements of quantum computing.


    +   **Quantum bits** are the basic building blocks of quantum computing, often
    known as qubits. In contrast to traditional bits, qubits can only take on the
    value 0 or 1, qubits can hold onto both states simultaneously. Quantum computers
    may increase their processing capacity exponentially by processing huge volumes
    of data in parallel, thanks to their special characteristics [14].

    **Quantum superposition** allows qubits to exist in different states simultaneously.
    It is a principle of quantum physics. This effect gives quantum computers a significant
    advantage over conventional computers for solving problems, as they may perform
    computations on all conceivable combinations of qubits concurrently [15].

    **Quantum entanglement** is an crucial feature of quantum physics. It occurs when
    two physically distant qubits'' states become interdependent. The instantaneous
    communication between qubits made by their interconnection considerably increases
    the power and efficiency of quantum computing [16].


    # 1.2.2 Comparison with traditional computer


    The key comparison is as follows:


    +   **Distinctions in computational capability:** Traditional computers use binary
    logic to function, where each bit represents a value of 0 or 1. Due to their sequential
    processing capability, these computers are slow and unable to handle complicated
    tasks. However, quantum computers use quantum mechanical principles to process
    data in parallel, dramatically improving computing capability. This opens'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the door for quantum computers to solve issues that conventional computers
    find impossible [16, 17].


    +   **Substantial advancements in quantum computing:** The advancement of quantum
    physics in the early twentieth century laid the groundwork for quantum computing.
    However, the area did not come together until Richard Feynman put the concept
    of a quantum computer forward in the 1980s. A lot happened since, moving the research
    forward and making quantum computing a viable possibility [18].


    +   **Notable accomplishments and discoveries:** The first quantum computer, IBM
    Q, was unveiled in 2016, showcasing IBM’s position as a leader in quantum research.
    IBM Q was made available to academics and companies to explore quantum computing
    and create new applications. The availability of quantum computing was greatly
    enhanced by this [19].


    +   "Quantum supremacy" was proclaimed by Google in 2019 after its quantum computer,
    Sycamore, completed a computation that would take a traditional supercomputer
    thousands of years. This achievement shows that those quantum computers may potentially
    resolve issues that were previously believed to be intractable by Preskill [20].


    +   **Improvements in quality**, error correction, and scalability are only a
    few examples of the noteworthy strides in creating quantum computing hardware
    within the last decade. These developments have pushed us one step closer to constructing
    large-scale, operational quantum computers that can compete or surpass traditional
    computers in several tasks. Table 1.1 presents a comparative analysis of quantum
    computing platforms [21].'
