  md: '# # Quick Guide to Quantum Mechanics


    ![](img/003d10cd18c2ce02e1f86a5992a8292b_251_0.png)


    **Figure 14.2:** Procedures of Quantum Mechanics [10].


    In quantum mechanics, each physical system can be in a superposition of physical
    states represented by mutually orthogonal basis of the state vector in complex
    Hilbert space. The entire state space is 2 N-dimensional, where N is the number
    of particles of the object under investigation. The unit vectors in Hilbert spaces
    are denoted by ''ket'' and are represented by |ψ⟩ [13, 14]


    Quantum mechanics is a theoretical paradigm that is considered one of the two
    theoretical corners of modern physics [15]. Quantum mechanics deals with the descriptions
    of the nature and behavior of matter and energy at an atomic and subatomic scale
    [16]. It provides a mathematical description of much of the dual particle- and
    wave-like behavior as well as the interactions of matter and energy [17]. The
    entities, i.e., atoms, molecules behave according to the quantum formalism that
    is significantly different from classical physics. Quantum mechanics provides
    an alternative to Statistical and Classical mechanics in situations where the
    molecular scale of matter and energy is the most relevant scales. [11]


    Within the context of the healthcare industry, this chapter considers both the
    benefits and the constraints that are brought about by the use of quantum computing
    technology.'
