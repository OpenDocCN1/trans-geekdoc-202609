    # 5.8.7 Continuous security monitoring and compliance


    Regular supervision of infrastructure elements and adherence to industry regulations
    to achieve the desired level of security is a must. A study from IBM revealed
    that the average data breach cost would be $4.2 million, which shows significant
    continuous monitoring regarding security in detection and timely response to incidents.
    The 6G IoT network protection employs a strategic approach that considers cryptography,
    authentication, secure design principles, intrusion detection, ZTA, automation,
    threat intelligence awareness, and continuous monitoring. By integrating these
    approaches with global statistics and industry best practices, organizations can
    manage risks and IoT deployments from emerging threats.


    # 5.8.8 Mitigating risks through quantum-secure solutions


    While looking at the edge of the quantum computer, classic cryptographic techniques
    are being challenged by the growing necessity. Currently, quantum computers will
    probably render the cryptographic protocols useless, which threaten to be the
    new norm that will be the focal point of security of the 6G networks for the IoT-connected
    future. Confronting this looming danger, quantum-protected systems have become
    essential for preserving cryptography even stronger against quantum-controlled
    attacks [24, 39].


    Quantum security solutions constitute a paradigm change of a purely technical
    approach to encryption algorithms and utilizing the elements of physics to make
    them secure and withstand quantum attacks. Among several prospective approaches,
    latticebased cryptography is probably the most promising method based on the probable
    intractability of some mathematical problems in higher dimensional space. Lattice-based
    schemes are feasible as they bring strong security guarantees, unlike classical
    and quantum hazards, as they are potential candidates for providing security for
    the 6G IoT.


    Code-based cryptography builds up error-correcting codes as foundations for cryptographic
    primitives that are inhumanly attack-proof. Without quantum computing, code-based
    cryptography, in which errors in quantum operations are detectable and correctable,
    is the best way to protect data from hostile quantum environments. Hash function-based
    cryptography is another promising technology that uses cryptographic hash functions
    for authentication and verification. More checksums than the numbers set by quantum
    computing could stop it from being cracked. Although hash-based methods are not
    unruff by quantum hackers, they can be added with quantum-safe processes to develop
    their security.'
