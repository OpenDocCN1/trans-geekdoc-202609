  md: 'ful than regular computers, quantum computers can perform many computations,
    which may solve new issues and provide new challenges to humans.


    Nowadays, academics and researchers in the R&D divisions of the top businesses
    globally spend a lot of resources and time researching the field of quantum computing.
    For instance, the Intel Corporation and QuTech, a center for research affiliated
    with Delft University of Technology in the Netherlands, plan to invest 50 million
    dollars in quantum computing over the next 10 years. By developing research that
    has already been conducted in this area for over 30 years, IBM, on the other hand,
    offers a cloud service that enables academics and learners to acquire the possible
    quantum experience [2, p. 27].


    # 1.1 Background and rationale


    To completely comprehend the growing significance of quantum computing as transitions
    from concepts to realities, one must grasp the science and history of the technology.
    This type of quantum computing surpasses the average performance of traditional
    processors using quantum physics and “qubits” to perform complex computations
    at a faster rate [3]. Beyond processing massive volumes of data, quantum computing
    can fundamentally alter industries and social norms. The realization of broad
    ramifications drives research on the effects and implications of quantum-computing.
    The integration of quantum technology presents unique opportunities and challenges
    that need to be considered in daily life.


    A new “race to the moon” has begun, in which countries take great delight and
    enormous resources into developing quantum computers. For example, beginning in
    2018, the European Commission intends to invest heavily over the next two decades
    on a €11 billion quantum computing flagship effort. Adding to the €550 million
    invested in individual projects, this is a follow-up investment to position Europe
    at the forefront of what is being called the second quantum revolution. Now is
    the time to take this technology to the next level and construct actual quantum
    computers. This will allow us to use their theoretical advantages over classical’s
    Neumann computers in real-world applications. The original quantum revolution
    began in the early 1900s with the work of Planck, Bohr, and Einstein, which led
    to a theoretical understanding of the behavior of light and matter at extremely
    small scales [4].


    The need for very low operating temperatures close to 0 °C is a common issue with
    most modern quantum devices. Thus, quantum computing as a cloud service seems
    to be the most viable commercial model for bringing this technology to consumers.
    On the other hand, when communicating with a cloud-based quantum computer via
    an Internet connection that other quantum computers may decode, the dependability
    of findings becomes an urgent concern.'
