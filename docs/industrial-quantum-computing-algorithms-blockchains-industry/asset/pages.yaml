    # 5.1.1 A connected world: overview from 1G to 5G


    The progression of mobile communication from the first generation (1G) to the
    fifth generation (5G) has led to profound global changes that shape how billions
    of people interact, work, and live [21]. Today''s smartphone is an inseparable
    part of our lives as it links us with friends and the world. Nevertheless, the
    way it arrived represents a remarkable evolution starting from the past five generations
    (1G to 5G) and witnessing a large growth in speed, reach, and functionality [4].
    Let us embark on a journey through this global story of connectivity, with statistics
    that illustrate the impact of each generation:


    # 5.1.1.1 1G (first generation): pioneering steps (1980s)


    +   - Global phone subscribers: 30 million (1985)

    - Data transmission: Nonexistent


    The 1G network was introduced in the 1980s and can be used for basic voice calls
    through analog cellular systems. By the early 1990s, the 1G network had planned
    to cover more than 25% of the world''s population, which brought new ways of mobility
    to the world. Imagine the outage of old, chunky phones, poor call quality, and
    no Internet access. The mobile revolution was the reality of 1G, but it was the
    foundation of it. The limited range and functionality of the service meant that
    it was mostly a Public Relations statement for the concept of portable communication.


    # 5.1.1.2 2G (second generation): after all the voice calls (1990s)


    +   - Global phone subscribers: 1 billion (1997)

    - Data speeds: As much as 14 kbps


    In turn, the digital technology chain of arrival means a quantum leap. 2G had
    better call quality, text messaging became possible, and the evolution of mobile
    data, although annoyingly at slow speeds. For this generation, the world of the
    Internet was taken personally to the next cellular level as the first email on
    the go, and perhaps was so that early access to mobile Internet was made available.'
