    security features or patch management. Such systems, therefore, become easy for
    attackers to exploit by capitalizing on the known vulnerabilities that are not
    fixed immediately or are not feasible to fix due to compatibility issues.


    # 12.3.2 Fragmented ecosystem


    The healthcare sector is a network of intertwined stakeholders such as hospitals,
    clinics, insurers, and pharmacies. This fragmented ecosystem provides many infiltration
    points for attackers, increasing the potential attack surface.


