    this knowledge into workable algorithms [30–34].


    +   - Software development: Finally, specific programming languages, tools, and
    software development are needed for quantum computing. The programming paradigms
    used in conventional and quantum computing are drastically different, making to
    develop appropriate tools and languages difficult.


    These obstacles are substantial, but the potential rewards of quantum computing
    are enormous; therefore, several academics and businesses are slaying away to
    solve them. Research and development efforts using this technology are expanding
    at an exponential rate. The race to construct the most robust and effective quantum
    computer is heating up, with major tech companies like IBM, Google, and Microsoft
    pouring millions into the field. Experts will have more time to develop this technology
    safely and intelligently to avoid hazards and use it for the good of our planet,
    even if it will take time to enhance the capabilities of these quantum machines.


    # 1.6.2 Quantum computing limitations


    From a technical and social point of view, quantum computing has drawbacks [24–27].
