  md: '# 5.2 Literature review


    This section comprehensively reviews the existing literature on IoT networks''
    security and privacy challenges. It synthesizes insights from previous research,
    establishing a foundation for understanding the unique considerations of integrating
    6G technologies.


    Rappaport et al. [1] provided an extensive overview of future wireless systems
    above 100 GHz, likely part of 6G, discussing regulatory frameworks and showcasing
    potential applications. It emphasizes the significance of THz frequencies for
    new capabilities like cognition, imaging, and communication, highlighting challenges
    and the need for further research in such as antenna technology, propagation measurements,
    and biological effects of THz radiation.


    Ziegler et al. [2] described the journey toward 6G connectivity with the successful
    initiation of architectural research, while commercial 5G deployment is ongoing
    worldwide. Over the next 8 years, the evolution of 5G architecture will continue,
    paving the way for exciting opportunities in real-time communication and synchronization
    between the physical, digital, and biological worlds. This will be facilitated
    by a hot cloud platform, convergent RAN-CORE, new data and information architecture,
    specialization of the network, and intent-based automation, laying the foundation
    for diverse applications across consumer and vertical industries.


    Akyildiz et al. [3] surveyed key techniques for future wireless networks, emphasizing
    wireless ubiquity as a driving force for 6G and beyond. They highlight essential
    technologies, operational nuances, and challenges, aiming to offer insights and
    inspire contributions toward achieving ubiquitous wireless access. Minghao Wang
    et al. [4] discussed the transition from 5G to 6G networks, highlighting the anticipation
    for advancements in network services. They provide a comprehensive investigation
    into security and privacy concerns, from the historical evolution of mobile networks
    to potential applications of 6G, aiming to stimulate further research and interest
    in addressing these issues.


    Liu et al. [5] discussed the rapid advancement of ICDT properly toward digital
    twin integration, with envisioned applications such as synesthesia Internet and
