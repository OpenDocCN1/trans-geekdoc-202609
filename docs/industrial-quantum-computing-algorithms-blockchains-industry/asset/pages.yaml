    information is referred to as computing in science. Utilizing the foundations
    of quantum physics, quantum computing addresses difficult computational issues.
    By using the storage and transport capabilities of small items, such as ions,
    electrons, or photons, it offers novel computing possibilities. Qubits, or quantum
    bits, are used in quantum computing and are similar to bits, or 0 and 1, in the
    way many concurrent processes do times quicker than a regular computer in applications,
    such as quantum simulation and prime factorization. Table 3.1 enumerates the challenges
    related to qubit technology. Five conditions had to be met for qubit technology
    to be physically implemented, according to IBM’s David DiVincenzo 2000. Later
    on with reference to quantum information transmission, two more conditions were
    added [1].


