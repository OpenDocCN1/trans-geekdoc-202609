    # # 10.1 Introduction


    Income inequality is an issue that has been around for decades, long before the
    emergence of automation and artificial intelligence (AI). In fact, the main source
    of inequality is the uneven distribution of income, where the rich earn more than
    the poor. This phenomenon occurs due to disparities in earnings, socioeconomic
    class, employment opportunities, education level, and other factors [1]. Despite
    being inevitable, income inequality is an issue that could be remediated by improving
    resources available, empowering individuals, and respecting one''s identity, through
    a combination of public and private initiatives [2]. Nonetheless, automation and
    AI are regarded as two of the most innovative technologies of the present time,
    with the potential to greatly enhance economic output [3]. The practice of delegating
    normal and repetitive work to machinery and systems that are controlled by computers
    and other electronic devices is referred to as automation [4]. Automation boosts
    efficiency, lowers costs, and eliminates the need for trained labor. AI, on the
    other hand, is the creation of computer systems that can “think” and interact
    with their surroundings [5]. AI has the ability to transform the way businesses
    function, particularly via boosting decision-making efficiency and accuracy, as
