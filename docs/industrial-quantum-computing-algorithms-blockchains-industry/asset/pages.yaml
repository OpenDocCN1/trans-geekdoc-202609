  md: '# 13.3 Fundamental concepts of quantum computing


    [6] Quantum physics is based on different foundational concepts of quantum mechanics.
    These are some of the key fundamentals or concepts of quantum computing:


    +   - Superior position: Quantum physics and quantum mechanics suggest that particles
    may assume states at once. In quantum computing, you can supervise qubits on 0s
    and 1s, allowing multiple operations to be processed simultaneously in parallel.

    - Entanglement: The phenomenon occurs when two or more particles'' states entangle.
    In quantum computing, qubits exhibit correlations that allow for faster computations
    than are possible with classical methods.

    - Uncertainty principle: This states that it is hard to accurately measure the
    position of particles and momentum at the same time. That idea holds true for
    qubits, whose fundamental errors allow measurements to cause state changes.

    - Measurement: In quantum computing, measurement is an important part because
    it collapses a particle''s superposition into a single state. In the context of
    quantum computing, measurements cause qubits to lose their quantum coherence by
    upsetting the superposition state.


