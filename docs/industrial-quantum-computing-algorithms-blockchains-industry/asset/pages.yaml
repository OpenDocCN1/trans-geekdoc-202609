    Even though there is progress in technology, the human factor is still a weak
    link in cybersecurity. Phishing attacks and insider threats are still a major
    concern. Healthcare professionals can be fooled into giving out confidential information
    by phishing emails, and dissatisfied employees may purposefully damage systems
    or data.


