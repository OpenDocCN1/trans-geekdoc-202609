    several sectors. Cryptography, an area vital to the security of digital transactions
    and communities across many sectors, stands to benefit greatly from the capabilities
    of quantum computing [30].


    # 1.3.6 Cryptography


    Because of its ability to crack existing encryption systems, quantum computing
    might have far-reaching consequences for the field of cryptography. Integer factorization
    and discrete logarithms are fundamental to the security of many cryptographic
    techniques; quantum computers might solve both difficulties. As a result, quantum-resistant
    encryption has emerged, and quantum key distribution has become the go-to method
    for foolproof communication [31].


    # 1.3.7 Pharmaceutical and drug industries


    Because quantum computers can more faithfully mimic the behavior of complicated
    molecules than conventional computers, they open up new avenues for pharmacological
    research and medication development. This skill can create novel medications and
    treatments by streamlining and shorting the drug discovery process [32].


    # 1.3.8 Computer programs that use AI and ML


    Because quantum computing allows for quicker optimization and more accurate pattern
    recognition, it has the potential to greatly improve AI and machine learning systems.
    In several contexts, including autonomous cars and medical diagnostics, this can
    enhance AI models, accelerate data processing, and improve decision-making [33].'
