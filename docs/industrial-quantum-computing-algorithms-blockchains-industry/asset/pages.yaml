  md: '# 1.3 Quantum computing applications


    All sectors will benefit from quantum computing ability to computations and inventions
    previously impossible with classical computers. There are several ways in which
    society may profit from quantum computers. For example, they could revolutionize
    transportation, speed up the development of medications and vaccinations, and
    help with investment choices. However, one of their drawbacks is that quantum
    computers may be able to crack existing encryption [22]. The following is a compilation
    of the opinions of industry professionals about the potential societal effects
    of quantum computing. Figure 1.2 presents the application of quantum computing
    [23].


    ![](img/003d10cd18c2ce02e1f86a5992a8292b_18_0.png)


    Figure 1.2: Application of quantum computing.


    # 1.3.1 Healthcare


    Quantum computing has the potential to revolutionize healthcare by accelerating
    the development of vaccinations and drugs, facilitating early patient diagnoses,
    and customizing treatment plans. As shown with the coronavirus vaccine, existing
    methods can only expedite the lengthy medication development process to a certain
    extent [24]. Researchers have to build new molecules to see how they interact
    with one another, which adds time to the process. However, with the help of quantum
    computers, they can create virtual molecules to test their interactions. With
    quantum computers, researchers can accurately model even the smallest molecules.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.3.2 Business and finance


    Several studies have shown that, at least shortly, quantum computers will be most
    useful to the financial industry. The capacity to predict stock market outcomes
    that were previously too unpredictable and numerous to compute is the primary
    advantage of quantum computing for the financial sector. Quantum computers will
    be able to perform more precise risk assessments under numerous probable situations,
    which is something that investors are increasingly seeking. Better lending judgments
    will also be possible by using quantum computers'' more accurate credit computations
    regarding loans and portfolios [25].


    # 1.3.3 Climate prediction


    It is also possible that quantum computers might forecast the weather. That "currently,
    a classical computer might take more time than it takes the weather to evolve
    to predict the weather" is based on an interview with an MIT professor that advised
    PBS. The transportation sector, the food production industry, and many others
    feel the effects of this enhanced climate forecasting. Directly or indirectly,
    weather impacts around around 30% of GDP in the USA. Better weather prediction
    would also allow more time to be ready for calamities [26].


    # 1.3.4 Travel and transportation


    The transportation and travel industries gain much from integrating artificial
    intelligence (AI) and quantum computing in areas such as air traffic management,
    autonomous vehicle development, and traffic signal optimization. It might be a
    while before we see the benefits of quantum computers in transportation, but they
    could completely change the game. Congestion will be reduced, and freight will
