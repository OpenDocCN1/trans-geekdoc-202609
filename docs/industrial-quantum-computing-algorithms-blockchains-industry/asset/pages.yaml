    # 6.3 Big data in health


    Every second, health systems collect huge amounts of data, and the term “big data”
    in health is a very real one with multiple challenges regarding storage, analysis,
    interpretation, and use.


    In the past, data of gigabytes or terabytes were considered high, today we can
    say that petabytes have become basic units of measurement for health data, registering
    in just a few years astronomical to the level of exabytes.


    According to studies, in 2013, data totaling 153 exabytes were produced at the
    level of health systems (1 exabyte = 1 billion gigabytes), and in 2020, the estimated
    value increased exponentially by about 48%, to 2,314 exabytes [9].


    The increase in global health systems is driven not only by new devices, which
    are able to store information electronically, but also by the increased number
    of details recorded. At this point, medical equipment can provide highly detailed
    information, which automatically translates into larger amounts of data. Also,
    at the patient level, the volume of stored data increases with each presentation
    to the doctor, hospitalization, or treatment performed with electronic medical
    records recording personal history.


    Medical imaging produces the highest percentage of the volume of data generated
    by medical equipment, which can be explained by the increase in the use of MRI
    and CT machines that are becoming more efficient, providing extremely detailed
    images, with 3D and 4D images becoming benchmarks in the industry. With the increase
    in the number of digital scanners, hospitals store hundreds of millions of digital
    images, which are used for a short period of time to establish diagnosis and treatment,
    and then only kept on different storage media.'
