  md: '# 3.1.4 Requirements for handling quantum computations


    Following are the requirements for handling quantum computations [1]:


    +   - Setup of a scalable physical system encompassing clearly defined qubits

    - Devising an easy, primary, fiducial input state

    - Methods to accurately measure a qubit state

    - Exceptionally faithful execution of universal gate procedures

    - Handling extended coherent periods

    - Converting stationary and flying qubits into each other

    - Reliable passing of qubits between two designated locations


    # 3.1.5 Quantum computing algorithms


    There are two most popular algorithms of quantum computing: Grover''s algorithm
    and Shor''s factorization algorithm [7].


    # 3.1.5.1 Shor''s factorization algorithm


    Peter Shor''s factorization algorithm, made possible by quantum physics, may solve
    the factorization problem in polynomial time as opposed to the exponential time
    required by conventional approaches. This might have a big effect on the field
    of data security, which is based on the prime factorization of enormous numbers.
    While factorization lacks a polynomial-time technique, there are various polynomial-time
    algorithms for multiplying integers, such as Euclid''s algorithm [10].


    Consequently, Shor created Shor''s factorization technique, which enables a quantum
    computer to factor very large numbers for non-prime integers N of L bits in polynomial
    time [10].


    # 3.1.5.1 Working of Shor''s factorization problem


    As represented in Figure 3.2, Shor''s algorithm works as one-to-one input and
    output procedures. It determines the integer d that divides an odd composite number
    N, strictly speaking, between 1 and N. The two parts of Shor''s algorithm are
    as follows:


    ![](img/003d10cd18c2ce02e1f86a5992a8292b_50_0.png)


    **Figure 3.2:** Shor''s factorization algorithm [10].'
