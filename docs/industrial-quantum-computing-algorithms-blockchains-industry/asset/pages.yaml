    # 10.2 Literature review


    # 10.2.1 Theoretical background


    The rapid and widespread advancement of automation and AI is transforming business,
    industry, and service operations in unprecedented ways. A large portion of the
    discussion following the introduction of these innovative technologies has centered
    on their potential effects on jobs and the likelihood of people losing their jobs.
    Nevertheless, another effect that is not often talked about but is just as important
    as its influence on wealth inequality. This literature review will examine the
    shifts in inequality in developed and developing countries in recent decades,
    and how automation and AI have impacted and will continue to impact this trend.


    Income inequality refers to the degree of economic disparity among individuals
    within a society, as determined by their personal income and wealth [14]. Economic
    inequality has been a consistent aspect of life in the majority of nations. Recently,
    this thus has again captured national interest. During extended economic stagnation
    and increasing profits, lower-income households have seen stagnant or decreasing
    salaries, while higher-income households have experienced a growth in their incomes
    [15]. This significant change in dynamics has led to a rise in income inequality,
    both in theory and in practice, by developed and developing countries [16]. From
    1945 to 1975, the developed world saw major improvements in equality due to widespread
    economic growth and redistributive policies. This was partially a result of increased
    government regulation of labor markets, higher taxes on the wealth, and social
    welfare programs [17]. Nevertheless, starting from 1975, inequality started to
    increase consistently due to shifts in politics, salaries, and taxation, leading
    to a growing disparity in wealth between the affluent and the marginalized sectors
    of society [18]. Aside from the brief period after the 2008 Global Financial Crisis
    when in'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'equality slightly decreased due to government action, there has been a steady
    rise in inequality in the developing world recent decades [19]. Inequality in
    the developing world significantly increased in the late twentieth century following
    a period of economic stabilization, and higher real wages [20]. In many developing
    countries, the gap between rich and poor has been consistently growing over the
    past decades, with inequality levels typically higher than those seen in developing
    countries [20]. The gap has increased due to the extensive effects of globalization,
    leading to a significant difference in where economic activities are located and
    the opportunities for financial success [21].


    # 10.2.2 Automation and AI''s impact on income inequality


    The emergence and implementation of automation and AI have caused a great deal
    of concern about their consequences for income inequality. Automation is the process
    of employing machines or computers to accomplish tasks that were previously performed
    by humans, whereas AI is the development of computer systems capable of completing
    tasks that would ordinarily need human intelligence [22]. In the face of these
    quickly changing aspects of society, there is substantial disagreement about whether
    they will result in greater inequality or wage pressures [23]. According to one
    of thought, the rise of automation and AI would increase inequality by altering
    the labor market and leaving limited options for lower-skilled employees. This
    is because technologies lower the demand for physical labor while increasing the
    demand for highly qualified individuals [23]. Such an effect has already been
    observed in the case of industrial robots, which has contributed to job loss,
    wage reductions, and a widening of the wage disparity between low- and high-skilled
    workers [24]. It might also be argued that these new technologies will strengthen
    the wealthy'' bargaining and market power, allowing them to reap the greatest
    profits while lesser-skilled laborers are increasingly sidelined. Another school
    of thought holds that the rise of automation and AI will not always result in
    levels of inequality. This is because, while technologies diminish low-skilled
    employment opportunities, they also increase economic activity by opening new
    markets and improving productivity [22]. Furthermore, it is feasible that automation
    would boost lower-skilled employees'' access to capital and labor markets, as
    well as their ability to supply to wealthier owners [27].


    In theory, higher rates of economic growth could contribute to more equity in
    society, especially if rewards are allocated more progressively [28]. Automation
    and AI have a significant impact on the global economy, rendering certain processes
    and jobs obsolete and limiting the pay of lower-income people [29]. Employees
    who are particularly susceptible to workplace challenges as racial and gender
    bias are at the highest risk of being replaced by robotic or AI alternatives [30].
    Consequently, automation and AI could worsen income inequality by reducing wages
    for those at the lower end of the pay scale, leading to rising poverty and restricted
    opportunities for'
