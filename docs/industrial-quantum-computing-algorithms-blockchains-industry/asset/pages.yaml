    # 1.5 Ethical considerations


    The emergence of quantum computing has sparked ethical concerns about the preservation
    of data security, the assurance of privacy, and the promotion of responsible utilization
    of developing technologies [40]. Quantum technology development and use give rise
    to moral challenges, namely fairness, respect for individuals, inclusivity, environmental,
    social, and governance considerations, human rights, and other associated concerns.


    Establishing moral principles and methods to govern its usage is imperative. The
    emergence of quantum computers raises concerns about equitable access, appropriate
    use, and possible misuse. Establishing regulations and structures to deal with
    these issues and maintaining equity and social principles is necessary. The ability
    of quantum computing to bypass current encryption methods raises privacy and data
    security issues. To safeguard sensitive information in the era of quantum computing,
    it is crucial to create and secure communication protocols and encryption techniques
    that are immune to the capabilities of quantum computers [41].


    With the progress and development of quantum computing, it is crucial to carefully
    contemplate its ethical ramifications. Although it can resolve intricate issues
    and transform the computing field, substantial ethical quandaries must be addressed.
    Important issue is the potential for quantum computing to be used as a means of
    exploiting security vulnerabilities. Quantum computers have significant computational
    capabilities that might be used to decipher passwords and gain unauthorized access
    to confidential information, presenting a grave risk to the security of sensitive
    data, including financial and personal particulars [42, 43].


    # 1.5.1 Cyber


    Both cyberattacks and cyber defenses are possible with quantum computing. An ideal
    zero-trust cybersecurity system or an encryption-decryption key might be constructed
    using quantum computing. The zero-trust principle states that no data should ever
    be sent or stored on any device, network, or user unless explicitly stated otherwise
    [43].'
