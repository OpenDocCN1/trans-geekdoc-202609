  md: '# 5.6 Supply chain spectre


    The multilayer global supply chains for manufacturing and distributing IoT devices
    offer attackers several tactics, which provide an opportunity to insert malicious
    code or hardware backdoors at various stages:


    +   1. **Hidden backdoors:** Meanwhile, malicious actors can put stealthy backdoors
    in the firmware or hardware when manufacturing items, which may give them access
    to devices after the supply chain. As reported by the National Intelligence and
    Security Center in 2020, supply chain attacks are among the major threats to national
    security by 80% of organizations experiencing at least one such.

    2. **Counterfeit components:** Instead of the original, incorporating malware
    into counterfeit components can open doors to system-wide vulnerabilities. A study
    by the International Trade Commission in 2021 shows that the amount of counterfeit
    electronics was estimated at $230 billion worldwide, pinpointing this problem
    at a high level.

    3. **Software tampering:** Malicious entities could modify software updates delivered
    during distribution, introducing vulnerabilities and compromising numerous devices
    as if a virus. The 2021 SolarWinds attack is a good example of the negative consequences
    for a company that has been made to update its software using compromised methods.

    4. **Edge computing exposure:** 6G''s great focus on edge computing, which means
    that data is processed close to the devices [15], presents a new set of security
    challenges.

    5. **Distributed attack surface:** The greater number of entrance endpoints increases
    the security, making it harder to protect and monitor every entry point. Sources
    indicate that 6G could produce 1 trillion connected devices by 2030, which would
    increase the number of vulnerabilities by a large factor [17].

    6. **Limited resource constraints:** Edge devices are usually affected by resource-constrained
    attacks because these devices have limited processing power and memory. Research
    carried out by the University of Oxford in 2022 has shown that resource depletion
    attacks may make compromising edge devices used in smart homes possible, which
    could result in gaining unauthorized access or manipulating data.

    7. **Data privacy concerns:** The edge computing environment causes concern as
    to the safety of data and how it could be misused by unauthorized access. Pew
    Research Center finds that 72% of Americans worry about companies collecting their
    data without permission. This shows that data privacy regulation is crucial for
    edge computing. Table 5.3 lists the case studies of the reality of 6G IoT security
    threats.'
