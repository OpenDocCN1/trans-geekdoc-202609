    # # Chapter 1

    # Quantum computing in society: impacts and implications


    **Abstract:** Recently, there has been a lot of interest in and funding for quantum
    computing in the academic and business communities. The “new race to the moon”
    is no greater task than constructing a workable quantum computer. Since this technology
    can crack any encryption methods used today, it is of great interest to national
    authorities, academics, and sellers of future quantum technologies. If this technology
    were to mature, it may have far-reaching and disruptive consequences for our society.
    However, it is quite probable that many areas of quantum computing will benefit
    from quantum computing. This chapter lays out our plans for software-programmable
    quantum computers might revolutionize scientific computing in the future. This
    leads us to believe that quantum computers, similar to graphics processing units
    and coprocessor cards, will be integrated into hybrid-accelerated computing platforms
    shortly. Specifically, we discuss how quantum algorithms could revolutionize the
    field of applied mathematics. Lastly, we illustrate the potential societal effect
    of quantum-accelerated computational science with many cases.


    **Keywords:** Quantum computing, Cryptography, Quantum bits, Quantum Supremacy,
    Healthcare, Economy, Business


    # ## 1.1 Introduction


    Quantum computing is a novel and prominent field based on quantum physics and
    information technology. It might transform many aspects of the society, as noted
    by Wynn and Jones [1]. This chapter explores how revolutionary innovation has
    changed our civilization. Quantum computing offers exponential improvements to
    many things, which might revolutionize our lives and businesses.


    > Yogesh Kumar Sharma, Koneru Lakshmaiah Education Foundation, Green Fields, Vaddesaram,
