  md: '# 9.1.1 Quantum basics


    Quantum computing is based on the principles of quantum mechanics to process data
    and perform calculations. While regular computations use bits as the basic unit
    of information (0 or 1), quantum computing employs qubits or qubits. In quantum
    mechanics, states like photon polarization, electron spin, or states of atoms
    can be seen as qubits, which are the foundation of quantum computing. These qubits
    represent and manipulate information in 0 and 1 states simultaneously, a phenomenon
    superposition. One significant difference between classical and quantum systems
    is how their parts combine. In classical systems, each part''s state defines the
    system''s state. However, in quantum systems, most states cannot be explained
    by just looking at the parts. These are called entangled states, where qubits
    are dependent on each other despite their distance. This result in better performance,
    where quantum computers can perform faster in situations like analyzing and running
    simulations.


    Quantum measurement gives specific outcomes, even though there are many possible
    states. After measurement, the system ends up in one of these possible outcomes,
    chosen probabilistically, and changing the states, which means you cannot measure
    an unknown state without affecting it. Also, you cannot perfectly copy an unknown
    quantum state due to a principle called the no-cloning principle. The various
    elements of quantum computing are discussed in Table 9.1.


    Table 9.1: Elements of quantum computing.


    | Keyword | Description |

    | --- | --- |

    | State space | Includes all possible states of a physical system |

    | Qubit | The basic unit of information in quantum computing; it is represented
    by complex vector spaces |

    | Entanglement | Phenomenon where states of multiple qubits become interconnected,
    leading to entangled states |

    | Quantum measurement | Provides discrete outcomes from a continuum of possible
    states, with outcomes determined probabilistically |

    | No-cloning | Can''t exactly copy an unknown quantum state |

    | Superposition | Property of qubits allowing them to be in a mix of their basic
    states |

    | Quantum algorithm design | Involves finding efficient sequences of operations
    to solve problems in quantum computing |'
