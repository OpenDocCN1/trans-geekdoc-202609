    With healthcare data becoming increasingly valuable, containing private details
    such as medical records, financial information, and even genetic information,
    breaches can have terrible outcomes. With such data, identity theft, financial
    fraud, and discrimination are possible.


    # 12.3.5 Evolving attack landscape


    Cybercriminals keep devising novel and smart attack techniques. The increase in
    ransomware incidents has affected healthcare, obstructed services, and led to
