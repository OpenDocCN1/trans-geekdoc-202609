  md: '# 14.2.2 Drug discovery DCQC


    A third type of DCQC is based on Quantum Machine Learning [QML] methodologies.
    Quantum computers can intrinsically model data by implementing a many-body state
    according to the information of the input space. Then, they can be used to determine
    state classification boundaries by imposing some desirable quantum operations.
    The only task remaining, at the moment, is to realize quantum neural networks
    deeply enough to effectively encode the information and later reproduce the task.
    [26, 27]


    A second type of DCQC is based on the quantum variational eigensolver, where the
    molecular state energy is computed by a hybrid quantum-classical algorithm [28].
    A molecular Hamiltonian is implemented by the quantum computer, and classical
    algorithms optimize the molecular parameters to minimize the energy.


    A specific application that is getting traction nowadays is drug discovery using
    Quantum Computing [DCQC]. One type of such algorithm is based on the quantum Fourier
    Transform, where the molecular structure is both chemically and geographically
    mapped onto a molecule tensor, and the Fourier Transform is applied. A better
    performance of the quantum approach, in terms of computational effort, is expected
    than traditional algorithms since the quantum properties are mapped directly from
    the quantum. [29]


    Applying Quantum Computing to the healthcare setting is one of the best applications
    of quantum technologies under current development, enabling new possibilities
    both in the core healthcare activities, like drug discovery and development, and
    in providing care [17]. The high computational power of quantum computing makes
    those new possibilities a reality, allowing, for example, the study of complex
    molecular interactions at the level of quantum physics. [23]


