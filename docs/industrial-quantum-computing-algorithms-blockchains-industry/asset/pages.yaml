- pgno: 83
  md: '# 5.4 Millimeter-wave Mayhem


    6G is based on the frequencies of mm-wave (mmWave) for high-speed communication.
    Unfortunately, these shorter wavelengths [8] are more susceptible to:


    +   1 Signal interception and jamming: It has been reported that 5G networks,
    without doubt, more vulnerable to the breach of signal (10x more in comparison
    with earlier generations). mmWave''s narrower beams aimed targeted attacks that
    can compromise infotainment and similar car-connected services, with more than
    1 billion vehicles predicted in 2040 to increase the risk.

    2 Beamforming hijacking: Attackers could exploit the directionality of mmWave
    beams to mislead data streams, eventually leading to partial or complete compromise
    of sensitive information or components involved in communication between devices.
    A survey undertaken in 2021 by the Poemon Institute established that 74% of IT
    practitioners have concerns about data interception over 5G networks, showing
    this anxiety is growing with the vendor''s mmWave technology.


    # 5.5 AI-powered peril


    However, the speed of 6G is very much dependent on AI for network management and
    device performance. However, this dependence introduces new attack vectors:


