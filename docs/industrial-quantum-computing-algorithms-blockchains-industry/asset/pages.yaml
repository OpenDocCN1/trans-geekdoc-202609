    # 3.1.2 Superposition and entanglement


    Superposition is the capacity of a quantum system to exist in many states concurrently;
    in other words, a system can exist in "here" and "there," or "up" and "down" at
    the same time [1]. A quantum mechanical notion known as superposition allows a
    qubit simultaneously to be represented in the states "0" and "1". The n qubits
    are essentially in a superposition state with 2n states [17].


    Entanglement, on the other hand, describes a strong connection between two particles.
    The linked qubit state will instantly reflect the transition in the first qubit
    state. This contributes to quantum computers operating at higher speeds [1].


    # 3.1.3 Qubit technology


