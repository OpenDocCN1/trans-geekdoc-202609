  md: '# 8.2.1 Fundamentals of quantum computing


    Quantum computing works based on the foundational principles of quantum technology.
    To understand those principles and techniques, three concepts such as superposition,
    entanglement and decoherence are required.


    # Superposition


    Superposition means that, like the waves in classical physics, multiple quantum
    states can be joined to create another valid quantum state. Oppositely, any quantum
    state can also be demonstrated as a combination of two or more different states.
    This superposition of qubits enables quantum computers to balance parallelism,
    by allowing them to perform enormous operations at the same time [7].


    # Entanglement


    Quantum entanglement happens when two systems become interconnected observation,
    one system gets immediate information about the other system, irrespective of
    the distance between them. Quantum processors can also draw inferences from one
    particle by measuring another particle. For example, they can predict the situations
    if one qubit is in an upward spin, the other will be in a downward spin and vice
    versa. This principle strengthens quantum computers to solve complex problems
    more efficiently and effortlessly.


    # Decoherence


    Decoherence refers to the dissolution of the quantum states within a qubit. External
    factors, such as radiation, can create the collapse of the qubit''s quantum state.
    A significant obstacle in quantum computing happens in developing mechanisms that
    can delay decoherence, like constructing specialized structures or patterns to
    shield or protect the qubits from external influences such as radiation, glitches,
    etc.


