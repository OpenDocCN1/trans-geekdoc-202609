    # 2.7 Conclusion and future direction


    QML is an area brimming with dangers and opportunities. To fully exploit the capabilities
    of this technology, researchers must surround challenges as hardware limitations,
    algorithmic advancement, and data encoding. Conversely, QML exhibits auspicious
    potential in terms of heightened velocity, improved precision, and innovative
    implementations in numerous fields. The pharmaceutical industry is increasingly
    adopting ML techniques, whereas QCMs have only recently entered this market. It
    is a daunting task to integrate the two technologies practically; therefore, multidisciplinary
    research teams with a broad spectrum of expertise are required. This is our inaugural
    attempt at assessing QML algorithms in the context of pharmaceutical discovery.


    By analyzing paragraphs and articles from the last 5 years, this study sought
    to derive information regarding trends in drug development using QML models, the
    phases of the drug discovery pipeline where these models were implemented, and
    the challenges associated with this endeavor. When each case is optimal, the costs
    of classical and QML methods are equivalent, it is unclear which is more efficient.
    In the preponderance of cases, conventional and quantum computing are combined.
    Regarding drug development, QML inevitably its efforts on the initial stages of
    the drug discovery pipeline. Small datasets, large molecules, quantum embedding,
    reduced dimensionality, baseline dataset, and near-term QCM are the seven obstacles
    that have been surmounted.


    Due to constrained qubits, the researchers'' primary concern was the prospective
    pharmaceutical industry applications of near-term QCM. As a result of the substantial
    body of literature and the participation of scholars from academia and industry,
    the forthcoming research will focus on undertaking a systematic review of this
    specific field of inquiry. In the coming years, monitoring the rate of drug discovery
    advances due to QML will be critical.'
