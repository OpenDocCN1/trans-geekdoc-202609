    # ## 5.7 Security and privacy issues of 6G technologies


    6G, the next big thing in connectivity, may bring the global community to a crossroads
    between security and privacy concerns [10, 13]. Here''s a deep dive into these
    challenges, armed with relevant global statistics.


    # ### 5.7.1 Artificial intelligence


    Algorithms, like people, are biased and vulnerable to manipulation, threatening
    billions worldwide [27].

    **Global AI market size:** Likely to come down to $1.56 trillion in 2023 (Statista).

    **Bias in AI algorithms:** A McKinsey report from 2022 showed that most global
    companies (83%) experienced one or more types of AI bias [28].

    **Manipulating AI models:** A 2021 study on image recognition models by Carnegie
    Mellon University showed that the models could be easily fooled, with success
    rates as high as 99.6%.

    Such numbers draw a picture we would rather do without – a world where thousands
    of users of 6G powered by AI might face discrimination or misinformation [25].
    Efficient data governance and stringent security protocols are equally important
    in mitigating risk [38].'
