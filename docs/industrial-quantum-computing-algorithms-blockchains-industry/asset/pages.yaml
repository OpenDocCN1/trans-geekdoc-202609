  md: '# Chapter 9 Quantum computing in machine learning: an overview — 143


    # 9.1.2 Elements of quantum computing


    # 9.1.2.1 Superposition


    In quantum computing, a quantum bit is the basic unit of information. If we talk
    about a classical bit, it can only be in one state, state 0 or state 1, but a
    quantum bit can be present in both states, i.e., state 0 and state 1 at the same
    time, and this is known as superposition. Qubits exist in a superposition of their
    two distinguished states, 0 and 1. That means superposition shows how quantum
    systems have the ability to be in multiple states at the same time [1, 2].


    # 9.1.2.2 Entanglement


    Entanglement is an important element of quantum computing. The state of a classical
    system can be completely characterized by the state of each of its component pieces.
    A surprising and counterintuitive aspect of quantum systems is that most states
    can not be described in terms of the system''s components. Such states are called
    entangled states. Qubits can be entangled, meaning that their positions become
    correlated even when separated by large distances [3].


    # 9.1.2.3 Quantum measurement


    Quantum measurement involves observing a quantum system, causing it to collapse
    into one of its possible states, with probabilities determined by its initial
    superposition. Before measurement, a quantum system can be in a superposition
    of multiple states [4]. This means it can be in a fusion of different states simultaneously,
    unlike classical systems, which are typically in one definite state:


    +   - Probabilistic nature: When you measure a quantum system, you "collapse"
    into superposition into one of its possible states. However, you cannot predict
    with certainty which state it will collapse into. Instead, you get a probabilistic
    outcome. The probability of each outcome can be calculated by the coefficients
    of the superposition. The measurement forces the system to choose one of its states.
    For example, if you measure the spin of an electron along a certain axis, it will
    collapse into either a "spin-up" or "spin-down" state along that axis.

    - Irreversible process: Quantum measurement is typically irreversible. Once the
    system''s state is measured, it remains in that state. This is in contrast to
    the reversible operations performed by quantum gates during computation.

    - Entanglement: Measurement can also reveal correlations between entangled particles.
    For example, measuring the spin of one entangled particle instantly de-'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'termines the spin of the one, no matter how distant they are. This phenomenon
    is known as entanglement, which is a main feature of quantum mechanics.


    # 9.2 Quantum machine learning (QML)


    QML is an enhanced version of ML that acquires some properties of quantum computing.
    In recent years, researchers have explored how quantum technology can enhance
    ML algorithms. The detailed mechanism of QML is shown in Figure 9.1.


    ![](img/003d10cd18c2ce02e1f86a5992a8292b_153_0.png)


    **Figure 9.1:** Steps of quantum machine learning.


    In the first step, users need to convert classical data into quantum data or a
    group of qubits. In order to make classical data fit into quantum computing, this
    process involves quantum feature mapping, which changes classical data into an
    infinite-dimensional space, i.e., Hilbert space. Choosing the right quantum gate
    and arranging them in order is very important for designing a quantum circuit
    that can process data and provide the desired output. A quantum circuit is useful
    for specific ML tasks such as clustering, regression, and classification. The
    complexity and structure of the circuit differs from problem to problem and depends
    on the desired output. To increase the efficiency of the model, quantum algorithms
    should be minimize cost functions, which can be calculated as the difference between
    the prediction by the model and the actual value. Further, quantum algorithms
    use different techniques, where changes can be made to the quantum circuit based
    on feedback provided by quantum machines. Once the quantum circuit has processed
    the input data, results can be retrieved through the measurements of qubits. The
    classical output is decoded and interpreted to provide insights or predictions
    concerning the original problem.'
