  md: '# Chapter 7 Industrial automation and quantum computing 111


    # 7.3.2 Quantum gates and circuits


    Quantum computers, like classical computers, use logic gates to apply operators
    to bits. Unlike classical circuits, quantum gates adhere to the rules of quantum
    mechanics and can incorporate superposition, entanglement, and phase shift. The
    quantum gate often involves a Hadamard gate that generates superpositions, as
    well as Pauli-X superposition states that are gateless and entangling two qubits.
    By planning circuits utilizing these entryways, one may hence utilize the quantum
    system''s one of a kind highlights to achieve advanced computations.


    # 7.3.3 Quantum algorithms


    The usage of quantum systems'' stability and complexity opens a doorway to a new
    set of algorithms. The best known are Grover''s and Shor''s algorithms. Grover''s
    algorithm is an unstructured search quadratic speedup, helping to solve most search
    issues much faster than classical search techniques. Shor''s algorithm, on the
    other hand, uses polynomial time to decompose large numbers into probable values,
    which is impossible for standard computers. These two concepts showcase the revolutionary
    value of quantum computing for solving multiple computational dimensions.


    # 7.3.4 Quantum supremacy and challenges


    Quantum supremacy is the extent to which a quantum computer outperforms the most
    powerful classical computer over specified tasks. Quantum supremacy is critical
    in the progress of quantum computing by certifying that quantum computing is superior
    at certain problems. Nonetheless, quantum supremacy faces monumental obstacles
    to overcome. Quantum systems are unstable, and decoherence can occur at any time.
    Since qubits lose their quantum energy as they collaborate with the environment,
    making qubits consistent and reducing mistakes are vital in the creation of a
    quantum computer.


