  _size = $_FILES['image']['size'];\n    $fíle\\_tmp = $_FILES['image']['tmp\\_name'];\n\
  \    $fíle\\_type = $_FILES['image']['type'];\n    $fíle\\_ext=strtolower(end(explode('.',$_FILES['image']['name'])));\n\
  \    $expensíons= array(\"jpeg\",\"jpg\",\"png\");\n    íf(ín\\_array($fíle\\_ext,$expensíons)===\
  \ false){\n        $errors[]=\"extensíon not allowed, please choose a JPEG or PNG\
  \ fíle.\";\n    }\n    íf($fíle\\_size > 2097152) {\n        $errors[]='Fíle síze\
  \ must be excately 2 MB';\n    }\n    íf(empty($errors)==true) {\n        move\\\
  _uploaded\\_fíle($fíle\\_tmp,\"ímages/\".$fíle\\_name);\n        echo \"Success\"\
  ;\n    }else{\n        prínt\\_r($errors);\n    }\n}\n\n?>\n\n<html>\n  <body>\n\
  \    <form actíon=\"\" method=\"POST\" enctype=\"multpart/form-data\">\n      <input\
  \ type=\"file\" name=\"image\" />\n      <input type=\"subít\"/>\n      <ul>\n \
  \       <li>Sent file: <?php echo $_FILES['image']['name']; ?>\n        <li>file\
  \ size: <?php echo $_FILES['image']['size']; ?>\n        <li>file type: <?php echo\
  \ $_FILES['image']['type']; ?>\n      </ul>\n    </form>\n  </body>\n</html>\n```\n\
  \n它将产生以下内容 -\n\n![Upload Script](img/image0560.jpeg)\n\n# PHP - 编码规范\n\n每家公司都根据其最佳实践遵循不同的编码规范。编码规范是必要的，因为可能有许多开发者在不同的模块上工作，如果他们开始发明自己的标准，源代码将变得不可管理，并且在未来难以维护该代码。\n\
  \n以下是使用编码规范的几个原因：\n*   你的同事程序员必须理解你产生的代码。编码规范充当整个团队解读代码的蓝图。\n*   通过一致的编码实现的简单性和清晰性可以帮助你避免出现常见错误。\n\
  *   如果你在一段时间后修订代码，那么理解这些代码将变得易于。\n*   遵循特定的标准是行业标准，可以提高软件的质量。\n\n在编写 PHP 代码时，可以遵循以下几条指南：\n\
  \n*   **缩进和行宽**：使用 4 个空格的缩进，不要使用任何制表符，因为不同的计算机设置不同。建议每行长度保持在 75-85 个字符左右，以便获得更好的读性。\n\
  *   **控制结构**：包括 `if`、`for`、`while`、`switch` 等。控制语句的控制关键字和括号之间应该有一个空格，以将它们与函数调用区分开。强烈建议即使在技术上是可选的情况下，也始终使用大括号。\n\
  \n## 示例\n\n```php\nif ((condition1) || (condition2)) {\n    action1;\n}elseif ((condition3)\
  \ && (condition4)) {\n    action2;\n}else {\n    default action;\n}\n```\n\n你可以像这样编写\
  \ `switch` 语句：\n\n```php\nswitch (condition) {\n    case 1:\n        action1;\n\
  \    case 2:\n        action2;\n    default:\n        default;\n}\n```\n\n*   **函数调用**：\n\
  \    ```php\n    function foo($arg1, $arg2 = '') {\n        if (condition) {\n \
  \           statement;\n        }\n        return $val;\n    }\n    ```\n*   **函数定义**：\n\
  \    ```php\n    function functíon($arg1, $arg2);\n    ```\n*   **注释**：C 风格注释 `/*\
  \ ... */` 和标准的 `//` 都是可以的。使用 PHP 风格注释 `#` 是不建议的。\n*   **PHP 代码标签**：始终使用 `<?php ?>`\
  \ 来限制 PHP 代码，而不是 `<? ?>`。\n*   **变量名**：\n    * 使用全小写\n    * 使用 `_` 作为分隔符\n    *\
  \ 全局变量应以 `$` 开头\n    * 常量应全大写并带有 `_`\n*   **缩进**：使用 4 个空格进行缩进；使用驼峰命名法变量。\n\n# 高级\
  \ PHP - 预定义变量\n\nPHP 提供了许多来自环境和用户输入的预定义变量。这些数组被称为全局变量。\n\n## 全局变量\n\n| 序号 | 变量 |\
  \ 描述 |\n| --- | --- | --- |\n| 1 | `$GLOBALS` | 全局范围内每个变量的引用。数组的键是变量名。 |\n| 2 |\
  \ `$_SERVER` | 包含头信息、路径和脚本位置信息的数组。该数组由 Web 服务器创建。完整列表见下一节。 |\n| 3 | `$_GET` | 通过\
  \ GET 方法传递给脚本的关联数组。 |\n| 4 | `$_POST` | 通过 POST 方法传递给脚本的关联数组。 |\n| 5 | `$_FILES`\
  \ | 通过 POST 方法上传到脚本的关联数组。 |\n| 6 | `$_REQUEST` | 由 `$_GET`、`$_POST` 和 `$_COOKIE`\
  \ 内容组成的关联数组。 |\n| 7 | `$_COOKIE` | 通过 HTTP Cookie 传递给脚本的关联数组。 |\n| 8 | `$_SESSION`\
  \ | 当前脚本可用的会话变量关联数组。 |\n| 9 | `$_PHP_SELF` | 包含相对于文档根的当前执行脚本文件名的字符串。 |\n| 10 | `$php_errorlog`\
  \ |  PHP 生成的最后一个错误消息文本的变量。 |\n\n## $_SERVER\n\n`$_SERVER` 变量是一个包含头信息、路径和脚本位置数组。该数组由\
  \ Web 服务器创建。\n\n| 键 | 描述 |\n| --- | --- |\n| `$_SERVER['PHP_SELF']` | 相对于文档根的当前执行脚本的文件名。\
  \ |\n| `$_SERVER['argv']` | 传递给脚本的参数数组。当脚本在命令行运行时，它提供了对命令行参数的 C 风格访问。当通过 GET 方法调用时，它将包含查询字符串。\
  \ |\n\n\n\n\n\n- `$_SERVER['argc']`: 如果在命令行运行，该变量包含传递给脚本的命令行参数个数。\n- `$_SERVER['GATEWAY_INTERFACE']`:\
  \ 服务器正在使用的 CGI 规范版本；例如 'CGI/1.1'。\n- `$_SERVER['SERVER_ADDR']`: 执行当前脚本的服务器的 IP 地址。\n\
  - `$_SERVER['SERVER_NAME']`: 执行当前脚本的服务器主机名。如果脚本运行在虚拟主机上，则该值将为该虚拟主机定义的值。\n- `$_SERVER['SERVER_SOFTWARE']`:\
  \ 服务器标识字符串，在响应请求时提供于响应头中。\n- `$_SERVER['SERVER_PROTOCOL']`: 请求页面时使用的信息协议的名称和版本；例如\
  \ 'HTTP/1.0'；\n- `$_SERVER['REQUEST_METHOD']`: 用于访问页面的请求方法；例如 'GET'、'HEAD'、'POST'、'PUT'。\n\
  - `$_SERVER['REQUEST_TIME']`: 请求开始的时间戳。PHP 5.1.0 可用。\n- `$_SERVER['QUERY_STRING']`:\
  \ 如果有，则访问页面时的查询字符串。\n- `$_SERVER['DOCUMENT_ROOT']`: 当前脚本执行的文档根目录，定义在服务器的配置文件中。\n\
  - `$_SERVER['HTTP_ACCEPT']`: 如果有，当前请求中 Accept: 头部的内容。\n- `$_SERVER['HTTP_ACCEPT_CHARSET']`:\
  \ 如果有，当前请求中 Accept-Charset: 头部的内容。例如：'iso-8859-1,*,utf-8'。\n- `$_SERVER['HTTP_ACCEPT_ENCODING']`:\
  \ 如果有，当前请求中 Accept-Encoding: 头部的内容。例如：'gzip'。\n- `$_SERVER['HTTP_ACCEPT_LANGUAGE']`:\
  \ 如果有，当前请求中 Accept-Language: 头部的内容。例如：'en'。\n- `$_SERVER['HTTP_CONNECTION']`: 如果有，当前请求中\
  \ Connection: 头部的内容。例如：'Keep-Alive'。\n- `$_SERVER['HTTP_HOST']`: 如果有，当前请求中 Host:\
  \ 头部的内容。\n- `$_SERVER['HTTP_REFERER']`: 将用户代理到当前页面的页面地址（如果有）。\n- `$_SERVER['HTTP_USER_AGENT']`:\
  \ 这是一个表示访问页面的用户代理的字符串。典型的示例是：Mozilla/4.5 [en] (X11; U; Linux 2.2.9 i586)。\n- `$_SERVER['HTTPS']`:\
  \ 如果通过 HTTPS 协议查询脚本，则设置为非空值。\n- `$_SERVER['REMOTE_ADDR']`: 用户查看当前页面的 IP 地址。\n- `$_SERVER['REMOTE_HOST']`:\
  \ 用户查看当前页面的主机名。反向 DNS 查询基于用户的 `REMOTE_ADDR`。\n- `$_SERVER['REMOTE_PORT']`: 用户机器上用于与\
  \ Web 服务器通信的端口。\n- `$_SERVER['SCRIPT_FILENAME']`: 当前执行脚本的绝对路径。\n- `$_SERVER['SERVER_ADMIN']`:\
  \ Web 服务器配置文件中 `SERVER_ADMIN`（针对 Apache）指令赋予的值。\n- `$_SERVER['SERVER_PORT']`: Web\
  \ 服务器在服务器上用于通信的端口。对于默认设置，此值将为 '80'。\n- `$_SERVER['SERVER_SIGNATURE']`: 包含服务器版本和虚拟主机名的字符串，如果启用，则会被添加到服务器生成的页面中。\n\
  - `$_SERVER['PATH_TRANSLATED']`: 当前脚本基于文件系统的路径。\n- `$_SERVER['SCRIPT_NAME']`: 包含当前脚本的路径。这对于需要指向自身的页面非常有用。\n\
  - `$_SERVER['REQUEST_URI']`: 访问此页面时提供的 URI；例如 '/index.html'。\n- `$_SERVER['PHP_AUTH_DIGEST']`:\
  \ 当作为 Apache 模块身份验证运行时，此变量被设置为客户端发送的 'Authorization' 头部。\n- `$_SERVER['PHP_AUTH_USER']`:\
  \ 当作为 Apache 或 PHP 5 模块身份验证运行时，此变量被设置为用户提供的用户名。\n- `$_SERVER['PHP_AUTH_PW']`: 当作为\
  \ Apache 或 PHP 5 模块身份验证运行时，此变量被设置为用户提供的密码。\n- `$_SERVER['AUTH_TYPE']`: 当作为 Apache\
  \ 模块身份验证运行时，此变量被设置为身份验证类型。\n\n# PHP Regular 表达式\n\n正则表达式仅仅是字符序列或模式。它们提供了模式匹配功能。使用正则表达式，你可以在另一个字符串中搜索特定的字符串，可以用一个字符串替换另一个字符串，并可以分割字符串。\n\
