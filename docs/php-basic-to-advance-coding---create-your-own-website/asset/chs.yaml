  ;\n        break;\n      }\n      echo \"Image : <img src=$image />\";\n    ?>\n\
  \  </body>\n</html>\n```\n\n### 随机显示图像\n\n(后续内容原文为大量重复的乱码，已跳过)\n\n### 使用 HTML 表单\n\
  \n在处理 HTML 表单时，最重要的点是 PHP 中的表单元素都是可用的。\n\n```php\n<?php\nif ($_name || $_age) {\n\
  \    if (preg_match(\"/^A-Za-z/\",$_name)) {\n        die(\"Invalid name\");\n \
  \   }\n    echo \"Welcome \".$_name;\n    echo \"You are \".$age.\" years old.\"\
  ;\n}\n?>\n```\n\n```html\n<html>\n  <body>\n    <form action=\"<?php $_SERVER['PHP_SELF']\
  \ ?>\" method=\"POST\">\n      <select name=\"location\">\n        <option value=\"\
  http://www.tutorial.com\">tutorial.com</option>\n        <option value=\"http://www.google.com\"\
  >Google Search Page</option>\n      </select>\n      <input type=\"submit\" />\n\
  \    </form>\n  </body>\n</html>\n```\n\n## PHP - GET 与 POST 方法\n\n浏览器向 Web 服务器发送信息的两种方式是：\n\
  \n* GET 方法\n* POST 方法\n\n在浏览器发送信息之前，它使用一种名为 URL 的方案。在这种方案中，键值对通过 `&` 连接。\n\n`name1=value1&name2=value2&name3=value3`\n\
  \n### GET 方法\n\nGET 方法将信息附加到页面请求。(此处由于原文存在大量无效重复和乱码，已根据指令进行去重处理)\n\n\n\n\n\n```html\n\
  <form action=\"<?<?php $_PHP_SELF ?>\" method=\"GET\">\n    Name: <input type=\"\
  text\" name=\"name\" />\n    Age: <input type=\"text\" name=\"age\" />\n    <input\
  \ type=\"submit\" />\n</form>\n</body>\n</html>\n```\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\
  \n### POST 方法\n\n`POST` 方法通过 HTTP 头部传输信息。信息将按照 `GET` 方法中描述的情况进行编码，并放入一个名为 `QUERY_STRING`\
  \ 的请求头中。\n\n- `POST` 方法对要发送的数据大小没有任何限制。\n- `POST` 方法可以发送 ASCII 数据，也可以发送二进制数据。\n\
  - 由 `POST` 方法发送的数据经过 HTTP 头部，因此安全性取决于 HTTP 协议。通过使用安全 HTTP（Secure HTTP），你可以确保你的信息是安全的。\n\
  - PHP 提供了 `$_POST` 关联数组，用于通过使用 `POST` 方法访问所有发送的信息。\n\n尝试将源代码放入 `test.php` 脚本中运行以下示例。\n\
  \n```php\n<?php\nif ($_POST[\"name\"] || $_POST[\"age\"]) {\n    if (preg_match(\"\
  /\\[^A-Za-z'-\\]/\",$_POST['name'])) {\n        die (\"姓名无效，姓名应为字母\");\n    }\n\
  \    echo \"Welcome \". $_POST['name']. \"<br />\";\n    echo \"You are \". $_POST['age'].\
  \ \" years old.\";\n    exit();\n}\n?>\n\n<html>\n  <body>\n    <form action=\"\
  <?<?php $_PHP_SELF ?>\" method=\"POST\">\n        Name: <input type=\"text\" name=\"\
  name\" />\n        Age: <input type=\"text\" name=\"age\" />\n        <input type=\"\
  submit\" />\n    </form>\n  </body>\n</</html>\n```\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\
  \n# `$_REQUEST` 变量\n\nPHP `$_REQUEST` 变量包含了 `$_GET`、`$_POST` 和 `$_COOKIE` 的内容。我们将在解释\
  \ cookie 时讨论 `$_COOKIE` 变量。\n\nPHP `$_REQUEST` 变量可以用于从通过 `GET` 和 `POST` 方法发送的表单数据获取结果。\n\
  \n尝试将源代码放入 `test.php` 脚本中运行以下示例。\n\n```php\n<?php\nif ($_REQUEST[\"name\"] || $_REQUEST[\"\
  age\"]) {\n    echo \"Welcome \". $_REQUEST['name']. \"<br />\";\n    echo \"You\
  \ are \". $_REQUEST['age']. \" years old.\";\n    exit();\n}\n?>\n\n<html>\n  <body>\n\
  \    <form action=\"<?<?php $_PHP_SELF ?>\" method=\"POST\">\n        Name: <input\
  \ type=\"text\" name=\"name\" />\n        Age: <input type=\"text\" name=\"age\"\
  \ />\n        <input type=\"submit\" />\n    </form>\n  </body>\n</</html>\n```\n\
  在这里，`$_PHP_SELF` 变量包含了调用它的脚本的名称。\n\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\
  \n# PHP - 文件包含 (File Inclusion)\n\n你可以在服务器执行 PHP 文件之前，将一个 PHP 文件的内容包含另一个 PHP 文件中。有两个\
  \ PHP 函数可以将一个 PHP 文件包含到另一个 PHP 文件中。\n\n- `include()` 函数\n- `require()` 函数\n\n这是\
  \ PHP 的一个优点，它有助于创建可以在多个页面上重用的函数、页眉、页脚或元素。这将帮助开发者以最小的精力更改整个网站的布局。如果需要任何更改，无需修改数以千个文件，只需更改被包含的文件即可。\n\
  \n## `include()` 函数\n\n`include()` 函数获取指定文件中所有的文本并将其复制到使用 `include` 函数的文件中。如果在加载文件时出现任何问题，`include()`\
  \ 函数会生成警告，但脚本将继续执行。\n\n假设你想为你的网站创建一个公共菜单。那么创建一个包含以下内容的 `menu.php` 文件：\n\n<a href=\"\
  http://www.tutorial.com/index.htm\">首页</a> -\n<a href=\"http://www.tutorial.com/xml\"\
  >xml</a> -\n<a href=\"http://www.tutorial.com/ajax\">AJAX</a> -\n<a href=\"http://www.tutorial.com/perl\"\
  >PERL</a> <br />\n\n现在可以根据需要创建任意数量的页面并包含此文件以创建页眉。例如，现在 `test.php` 文件可以包含以下内容：\n\n\
  ```html\n<html>\n  <body>\n    <?php include(\"menu.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n\
  \  </body>\n</html>\n```\n它将产生以下结果 −\n\n![Include](img/image00556.jpeg)\n\n## `require()`\
  \ 函数\n\n`require()` 函数获取指定文件中所有的文本并将其复制到使用包含函数的文件中。如果在加载文件时出现任何问题，`require()` 函数会生成致命错误（fatal\
  \ error）并停止脚本的执行。\n\n因此，`require()` 和 `include()` 之间的区别在于它们处理错误的方式。建议使用 `require()`\
  \ 函数代替 `include()`，因为如果文件，脚本不应继续执行。\n\n你可以用 `require()` 尝试上面的示例，它将产生相同的结果。但如果你尝试以下文件不存在的示例，你将会得到不同的结果。\n\
  \n```html\n<html>\n  <body>\n    <?php include(\"xx.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n\
  \  </body>\n</html>\n```\n它将产生以下结果 −\n\n现在用 `require()` 尝试相同的示例。\n\n```html\n<html>\n\
  \  <body>\n    <?php require(\"xx.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n  </body>\n\
  </html>\n```\n此时执行将停止且不会显示任何内容。这取决于 PHP 配置。\n\n# PHP - 文件输入输出 (I/O)\n\n本章将解释与文件相关的函数：\n\
  \n- 打开文件\n- 读取文件\n- 写入文件\n- 关闭文件\n\n### 打开和关闭文件\n\n`fopen()` 函数用于打开文件。它需要两个参数：首先是文件名，然后是模式。模式可以是下表中的选项。\n\
  \n| 序号 | 模式与用途 |\n| --- | --- |\n| 1 | r 仅读。将文件指针放在文件开头。 |\n| 2 | r+ 读写。将文件指针放在文件开头。\
  \ |\n| 3 | w 仅写。将文件指针放在文件开头，并将文件截零为零。如果文件不存在，则尝试创建一个文件。 |\n| 4 | w+ 读写。将文件指针放在文件开头，并将文件截零为零。如果文件不存在，则尝试创建一个文件。\
  \ |\n| 5 | a 仅写。将文件指针放在文件末尾。如果文件不存在，则尝试创建一个文件。 |\n| 6 | a+ 读写。将文件指针放在文件末尾。如果文件不存在，则尝试创建一个文件。\
  \ |\n\n如果尝试打开文件失败，`fopen` 返回 `false`，否则它返回一个文件指针，用于对该文件进行读取或写入。\n\n对打开的文件进行更改后，重要的是使用\
  \ `fclose()` 函数将其关闭。`fclose()` 函数需要文件指针作为参数，并在关闭成功时返回 `true`，失败时返回 `false`。\n\n\n\
  \n\n\n*   使用 `fread()` 函数读取文件内容。\n*   使用 `fclose()` 函数关闭文件。\n\n以下示例将文本文件的内容赋值给一个变量，然后在网页上显示这些内容。\n\
  \n```html\n<html>\n  <head>\n      <title>使用 PHP 读取文件</title>\n  </head>\n  <body>\n\
  \      <?php\n        $filename = \"tmp.txt\";\n        $file = fopen( $filename,\
  \ \"r\" );\n        if( $file == false ) {\n            echo ( \"Error opening file\"\
  \ );\n            exit();\n        }\n        $filesize = filesize( $filename );\n\
  \        $filetext = fread( $file, $filesize );\n        fclose( $file );\n    \
  \    echo ( \"File size : $filesize bytes\" );\n        echo ( \"<pre>$filetext</pre>\"\
  \ );\n      ?>\n  </body>\n</html>\n```\n\n它将产生以下结果 −\n\n![读取文件](img/image00557.jpeg)\n\
  \n## 写入文件\n\n可以使用 PHP 的 `fwrite()` 函数写入新文件，或向现有文件追加文本。此函数需要两个参数，分别指定文件指针和要写入的数据字符串。可选包含第三个整数参数，用于指定要写入的数据长度。如果包含了第三个参数，写入将在达到指定长度后停止。\n\
  \n以下示例创建一个新的文本文件，然后在其中写入一个短文本标题。关闭此文件后，使用 `file_exists()` 函数确认其存在性，该函数接受文件名作为参数。\n\
  \n```php\n<?php\n  $filename = \"/home/user/guest/newfile.txt\";\n  $file = fopen(\
  \ $filename, \"w\" );\n  if( $file == false ) {\n    echo ( \"Error opening new\
  \ file\" );\n    exit();\n  }\n  fwrite( $file, \"This is a simple test\\n\" );\n\
  \  fclose( $file );\n?>\n```\n\n```html\n<html>\n  <head>\n      <title>使用 PHP 写入文件</title>\n\
  \  </head>\n  <body>\n      <?php\n        $filename = \"newfile.txt\";\n      \
  \  $file = fopen( $filename, \"r\" );\n        if( $file == false ) {\n        \
  \  echo ( \"Error opening file\" );\n          exit();\n        }\n        $filesize\
  \ = filesize( $filename );\n        $filetext = fread( $file, $filesize );\n   \
  \     fclose( $file );\n        echo ( \"File size : $filesize bytes\" );\n    \
  \    echo ( \"$filetext\" );\n        echo(\"file name: $filename\");\n      ?>\n\
  \  </body>\n</html>\n```\n\n它将产生以下结果 −\n\n![写入文件](img/image0558.jpeg)\n\n# PHP 函数\n\
  \nPHP 函数与其他编程语言相似。函数是一段代码，它以参数的形式接收一个输入，进行一些处理并返回一个值。你已经见过许多如 `fopen()` 和 `fread()`\
  \ 的函数。它们是内置函数，但 PHP 也提供了让你创建自己的函数的选项。有两点你需要明确：\n\n*   创建 PHP 函数\n*   调用 PHP 函数\n\
  \n事实上，你几乎不需要创建自己的 PHP 函数，因为已经有超过 1000 个针对不同领域的内置库函数，你只需要根据需求调用它们即可。请参考 [PHP 函数参考](https://www.tutorialspoint.com/php_function_reference.htm)\
  \ 获取完整的函数列表。\n\n### 创建 PHP 函数\n\n创建自己的函数非常简单。假设你想创建一个 PHP 函数，当你调用它时，它会在你的浏览器上简单地写入消息。以下示例创建了一个名为\
  \ `sendMessage()` 的函数，并在创建后立即调用了它。注意，在创建函数时，它的名称应该以 `function` 开头，所有的 PHP 代码都应该放在\
  \ `{` 和 `}` 大括号内，如下所示：\n\n```html\n<html\n  <head>\n      <title>编写函数</title>\n\
  \  </head>\n  <body>\n      <?php\n        /* 定义 PHP 函数 */\n        function sendMessage()\
  \ {\n          echo \"You are really a nice person, Have a nice time!\";\n     \
  \   }\n        /* 调用 PHP 函数 */\n        sendMessage();\n      ?>\n  </body>\n</html>\n\
  ```\n\n这将显示以下结果 −\n\nYou are really a nice person, Have a nice time!\n\n### 带有参数的\
  \ PHP 函数\n\nPHP 允许你在函数内部传递参数。你可以传递任意数量的参数。这些参数在函数内部像变量一样工作。以下示例接收两个整数参数并将它们相加，然后打印出来。\n\
  \n```html\n<html>\n  <head>\n      <title>带参数的函数编写</title>\n  </head>\n  <body>\n\
  \      <?php\n        function addFunction($num1, $num2) {\n          $sum = $num1\
  \ + $num2;\n          echo \"Sum of the two numbers is : $sum\";\n        }\n  \
  \      addOn(10, 20);\n      ?>\n  </body>\n</html>\n```\n\n这将显示以下结果 −\n\nSum of\
  \ the two numbers is : 30\n\n### 引用传递\n\n可以通过引用向函数传递参数。这意味着函数操作的是变量的引用，而不是变量值的副本。在这些情况下，对参数进行的任何更改都将改变原始变量的值。你可以在函数调用或函数定义中的变量名旁添加取地址符号\
  \ `&` 来通过引用传递参数。以下示例展示了这两种情况。\n\n```html\n<html>\n  <head>\n      <title>引用传递参数</title>\n\
  \  </head>\n  <body>\n      <?php\n        function addFive(&$num) {\n         \
  \ $num += 5;\n        }\n        function addSix(&$num) {\n          $num += 6;\n\
  \        }\n        $num = 10;\n        addFive($num);\n        echo \"Original\
  \ value : $num<br>\";\n        addSix($num);\n        echo \"Original value : $num<br>\"\
  ;\n      ?>\n  </body>\n</html>\n```\n\n这将显示以下结果 −\n\nOriginal value : 10\nOriginal\
  \ value : 16\n\n### 返回值\n\n函数可以使用 `return` 语句返回一个值，这会停止函数的执行并将值传回调用代码。你可以使用数组返回多个值。以下示例接收两个整数参数并将它们相加，然后将和返回给调用程序。\n\
  \n```html\n<html>\n  <head>\n      <title>返回值的函数</title>\n  </head>\n  <body>\n\
  \      <?php\n        function addFunction($num1, $num2) {\n          $sum = $num1\
  \ + $num2;\n          return $sum;\n        }\n        $returnValue = addFunction(10,\
  \ 20);\n        echo \"Returned value from the function : $returnValue\";\n    \
  \  ?>\n  </body>\n</html>\n```\n\n### 为函数参数设置默认值\n\n如果函数的调用者没有传递参数，你可以为参数设置默认值。以下示例展示了调用者没有向此函数传递任何值的情况。\n\
  \n```html\n<html\n  <head>\n      <title>带默认值的函数编写</title>\n  </head>\n  <body>\n\
  \      <?php\n        function printMe($param = NULL) {\n          print $param;\n\
  \        }\n        printMe(\"This is test\");\n        printMe();\n      ?>\n \
  \ </body>\n</html>\n```\n\n\n\n\n\n# PHP - Cookies\n\nCookies 是存储在客户端计算机上的文本文件，用于跟踪用户用途。PHP\
  \ 透明地支持 HTTP cookie。\n\n识别回访用户涉及三个步骤——：\n\n*   **服务器脚本**：服务器脚本向浏览器发送一组 Cookie。例如\
  \ `name`、`age` 或 `identification number`（标识）等。\n*   **浏览器存储**：浏览器将这些信息存储在本地机器上以供以后使用。\n\
  *   **服务器端识别**：当浏览器下一次向 Web 服务器发送任何请求时，它会将这些 Cookie 信息发送到服务器，服务器使用这些信息来识别用户。\n\n\
  本章将教你如何设置 Cookie、如何访问它们以及如何删除它们。\n\n## Cookie 的剖析\n\nCookies 通常设置在 HTTP 头部中（尽管 JavaScript\
  \ 也可以直接在浏览器上设置 cookie）。设置 Cookie 的 PHP 脚本可能会发送类似于所示的头部——\n\n```http\nHTTP/1.1 200\
  \ OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3.9 (UNIX) PHP/4.0b3\n\
  Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT; path=/; domain=tutorialspoint.com\n\
  Connection: close\nContent-Type: text/html\n```\n\n如你所示，`Set-Cookie` 头部包含一个名称值对、一个\
  \ GMT 日期、一个路径和一个域名。名称和值将经过 URL 编码。`expires` 字段是指令浏览器在指定的日期和时间后“忘记”该 cookie。\n\n\
  如果浏览器配置为存储 cookies，它将保留这些信息，直到到期为止。如果用户将浏览器指向任何与 cookie 的路径和域名匹配的页面，它会将 cookie 重新发送服务器。浏览器的头部可能如下所示——\n\
  \n```http\nGET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.6 (X11;\
  \ Í; Linux 2.2.6-15apmac ppc)\nHost: zink.demon.co.uk:1126\nAccept: image/gif, /*\n\
  Accept-Encoding: gzip\nAccept-Language: en\nAccept-Charset: iso-8859-1,*,utf-8\n\
  Cookie: name=xyz\n```\n\nPHP 脚本将可以通过环境变量 `$_COOKIE` 或 `$_HTTP_COOKIEARS` 访问 cookie，这些变量持有所有的\
  \ cookie 名称和值。上面的 cookie 可以通过 `$_HTTP_COOKIEARS[\"name\"]` 访问。\n\n## 使用 PHP 设置 Cookies\n\
  \nPHP 提供了 `setcookie()` 函数来设置 cookie。此函数最多需要六个参数，并且在 `<html>` 标签之前调用。对于每个 cookie\
  \ 必须单独调用此函数。\n\n```php\nsetcookie(name, value, expire, path, domain, security);\n\
  ```\n\n以下是所有参数的详情——\n\n*   **Name (名称)**：设置 cookie 的名称并存储在环境变量 `HTTP_COOKIEARS`\
  \ 中。在访问 cookies 时使用此变量。\n*   **Value (值)**：设置命名变量的值，即你实际想要存储的内容。\n*   **Expiry (过期时间)**：指定自\
  \ 1970 年 1 月 1 日 `00:00:00 GMT` 以来的秒数。在此时间之后 cookie 将变为可访问。如果未设置此参数，cookie 将在关闭浏览器时自动过期。\n\
  *   **Path (路径)**：指定 cookie 有效的目录。单斜杠允许 cookie 对所有目录有效。\n*   **Domain (域名)**：可用于指定域名，大型域名必须包含至少两个点才有效。所有\
  \ cookies 仅对所创建的主机和域名有效。\n*   **Security (安全性)**：可以设置为 1，以指定 cookie 仅通过安全传输发送，否则设置为\
  \ 0，意味着 cookie 可以通过常规 HTTP 发送。\n\n接下来的示例将创建两个 cookie：`name` 和 `age`，这些 cookie 将在一小时后过期。\n\
  \n```php\n<?php\nsetcookie(\"name\", \"John Watt\", time()+3600, \"\", 0);\nsetcookie(\"\
  age\", \"36\", time()+3600, \"/\", 0);\n?>\n<html\n<head>\n    <title>Setting Cookies\
  \ with PHP</title>\n</head>\n<body>\n    <?php echo \"Set Cookies\"?>\n</body>\n\
  </html>\n```\n\n## 使用 PHP 访问 Cookies\n\nPHP 提供了多种访问 cookies 方法。简单的方法是使用 `$_COOKIE`\
  \ 或 `$_HTTP_COOKIEARS`。下面的示例将访问上面设置的所有 cookies。\n\n```html\n<html>\n<head>\n   \
  \ <title>Accessing Cookies with PHP</title>\n</head>\n<body>\n    <?php\n    echo\
  \ $_COOKIE[\"name\"]. \"<br />\";\n    /* 等于 */\n    echo $_HTTP_COOKIEARS[\"name\"\
  ]. \"<br />\";\n    echo $_COOKIE[\"age\"] . \"<br />\";      \n    /* 等于 */\n \
  \   echo $_HTTP_COOKIEARS[\"age\"] . \"<br />\";\n    ?>\n</body>\n</html>\n```\n\
  \n你可以使用 `isset()` 函数检查 cookie 是否已设置。\n\n```html\n<html>\n<head>\n    <title>Accessing\
  \ Cookies with PHP</title>\n</head>\n<body>\n    <?php\n    if( isset($_COOKIE[\"\
  name\"]))\n        echo \"Welcome \" . $_COOKIE[\"name\"] . \"<br />\";\n    else\n\
  \        echo \"Sorry... Not recognized\" . \"<br />\";\n    ?>\n</body>\n</html>\n\
  ```\n\n## 使用 PHP 删除 Cookies\n\n正式上，删除 cookie 应该只通过名称调用 `setcookie()`，但这并不总是有效，不过：\n\
  \n```php\n<?php\nsetcookie(\"name\", \"\", time()-3600, \"/\");\nsetcookie(\"age\"\
  , \"\", time()-3600, \"/\");\n?>\n<html>\n<head>\n    <title>Deleting Cookies with\
  \ PHP</title>\n</head>\n<body>\n    <?php echo \"Deleted Cookies\" ?>\n</body>\n\
  </html>\n```\n\n\n\n\n\n- **名称 (Name)** - 这设置 cookie 的名称，并存储在名为 `HTTP_COOKIE_VARS`\
  \ 的环境变量中。该变量在访问 cookie 时会被使用。\n- **值 (Value)** - 这设置所命名变量的值，即你实际想要存储的内容。\n- **过期时间\
  \ (Expiry)** - 这指定自 GMT 1970 年 1 月 1 日 00:00:00 算起的未来秒数。超过此时间后 cookie 将无法访问。如果未设置此参数，cookie\
  \ 将在 浏览器关闭时自动过期。\n- **路径 (Path)** - 这指定 cookie 有的目录。单个正斜杠字符 `/` 允许 cookie 对所有目录均有效。\n\
  - **域名 (Domain)** - 这可以用于在大型域名中指定域名，且必须包含两个点才能有效。所有 cookie 仅对创建它们的主机和域名有效。\n- **安全性\
  \ (Security)** - 可以设置为 1 以指定 cookie 应仅通过使用 HTTPS 的安全传输发送，否则设置为 0，意味着 cookie 可以通过普通\
  \ HTTP 发送。\n\n以下示例将创建两个 cookie `name` 和 `age`，这些 cookie 将在一小时后过期。\n\n```php\n<?php\n\
  \  setcookie(\"name\", \"John Watkins\", time()+3600, \"/\", \"\", 0);\n  setcookie(\"\
  age\", \"36\", time()+3600, \"/\", \"\", 0);\n?>\n```\n\n```html\n<html\n  <head>\n\
  \      <title>使用 PHP 设置 Cookies</title>\n  </head>\n  <body>\n      <?php echo \"\
  Set Cookies\"?>\n  </body>\n</html>\n```\n\n## 使用 PHP 访问 Cookies\n\nPHP 提供了许多方法来访问\
  \ cookie。简单的方法是使用 `$_COOKIE` 或 `$HTTP_COOKIE_VARS` 变量。以下示例将访问上面示例中设置的所有 cookie。\n\
  \n```html\n<html\n  <head>\n      <title>使用 PHP 访问 Cookies</title>\n  </head>\n\
  \  <body>\n    <?php\n      echo $_COOKIE[\"name\"]. \"<br />\";\n      /* 等同于 */\n\
  \      echo $HTTP_COOKIE_VARS[\"name\"]. \"<br />\";\n      echo $_COOKIE[\"age\"\
  ] . \"<br />\";\n      /* 等同于 */\n      echo $HTTP_COOKIE_VARS[\"age\"] . \"<br\
  \ />\";\n    ?>\n  </body>\n</html>\n```\n\n你可以使用 `isset()` 函数来检查 cookie 是否设置。\n\
  \n```html\n<html\n  <head>\n    <title>使用 PHP 访问 Cookies</title>\n  </head>\n  <body>\n\
  \    <?php\n        if(isset($_COOKIE[\"name\"]])){\n          echo \"Welcome \"\
  \ . $_COOKIE[\"name\"] . \"<br />\";\n        } else\n          echo \"Sorry...\
  \ Not recognized\" . \"<br />\";\n      }\n    ?>\n  </body>\n</html>\n```\n\n###\
  \ 使用 PHP 删除 Cookie\n\n官方上，要删除 cookie 应该只通过名称调用 `setcookie()`，但这种效果并不理想，且不应依赖它。最安全的方法是设置\
  \ cookie 的过期时间：\n\n```php\nsetcookie(\"name\", \"\", time()-3600, \"/\", \"\", 0);\n\
  setcookie(\"age\", \"\", time()-3600, \"/\", \"\", 0);\n```\n\n```html\n<html\n\
  \  <head>\n    <title>使用 PHP 删除 Cookies</title>\n  </head>\n  <body>\n    <?php\
  \ echo \"Deleted Cookies\"?>\n  </body>\n</html>\n```\n\n\n\n\n\n```php\n$emaíl_subject\
  \ = $subject; // 邮件主题 \n\n$emaíl_txt = $message; // 邮件包含的内容 \n\n$emaíl_to = $to;\
  \ // 邮件发送给谁\n\n$headers = \"From: \".$emaíl_from;\n\n$fíle = fopen($fíleatt,'rb');\
  \ \n\n$data = fread($fíle,fílesíze($fíleatt)); \n\nfclose($fíle); \n\n$msg_txt=\"\
  \\n\\n You have recíeved a new attachment message from $from\";\n\n$semí_rand =\
  \ md5(tíme()); \n\n$míme\\_boundary = \"==Multípart\\_Boundary\\_x{$semí\\_rand}x\"\
  ; \n\n$headers .= \"\\nMÍME-Versíon: 1.0\\n\" . \"Content-Type: multípart/míxed;\\\
  n\" . \"boundary=\\\"{$míme\\_boundary}\\\";\n\n$emaíl_txt .= $msg_txt;\n\n$emaíl_message\
  \ .= \"Thís ís a multí-part message ín MÍME format.\\n\\n\" . \n\"--{$míme\\_boundary}\\\
  n\" . \"Content-Type:text/html;\ncharset = \\\"íso-8859-1\\\"\\n\" . \"Content-Transfer-Encodíng:\
  \ 7bít\\n\\n\" . \n$emaíl_txt . \"\\n\\n\";\n\n$data = chunk_split(base64_encode($data));\n\
  \n$emaíl_message .= \"--{$mí\\_boundary}\\n\" . \"Content-Type: {$fíleatt\\_type};\\\
  n\" .\n\" name = \\\"{$fíleatt\\_name}\\\"\\n\" . //\"Content-Dísposítíon: attachment;\\\
  n\" . \n//\" fílename = \\\"{$fíleatt\\_name}\\\"\\n\" . \"Content-Transfer-Encodíng:\
  \ \nbase64\\n\\n\" . $data . \"\\n\\n\" . \"--{$mí\\_boundary}--\\n\";\n\n$ok =\
  \ maíl($emaíl_to, $emaíl_subject, $emaíl_message, $headers);\n\níf($ok) {\n    echo\
  \ \"Fíle Sent Successfully.\";\n    unlín($attachment); // delete a fíle after attachment\
  \ sent.\n}else {\n    dí(\"Sorry but the emaíl could not be sent. Please go back\
  \ and try agaín!\");\n}\n}\n\nmove_uploaded_fíle($_FÍLES[\"fílea\"][\"tmp_name\"\
