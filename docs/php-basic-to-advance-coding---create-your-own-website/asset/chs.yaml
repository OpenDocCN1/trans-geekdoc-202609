  \    </tr>\n    </table>\n  </body>\n</html>\n```\n\n# PHP - 文件上传\n\n一个 PHP 脚本可以配合\
  \ HTML 表单一起使用，允许用户将文件上传到服务器。最初，文件会被上传到临时目录，然后通过 PHP 脚本将其移动到目标位置。\n\n`php.php` 页面中的信息描述了用于文件上传的临时目录\
  \ `upload_tmp_dir`，以及允许上传的最大文件大小为 `upload_max_filesize`。这些参数设置在 PHP 配置文件 `php.ini`\
  \ 中。\n\n文件上传的过程遵循以下步骤 ——\n\n*   用户打开包含 HTML 表单的页面，表单包含一个文本字段、一个浏览和一个提交按钮。\n*   用户点击浏览按钮并从本地电脑选择一个文件进行上传。\n\
  *   所选文件的完整路径显示在文本字段中，然后用户点击提交按钮。\n*   所选的文件发送到服务器上的临时目录。\n*   表单 `action` 属性中指定的作为表单处理程序的\
  \ PHP 脚本会检查文件是否到达，然后将其复制到目标目录。\n* PHP 脚本向用户确认成功。\n\n在写入文件时，临时和最终位置通常都需要设置写入权限。如果其中一个设置为只读，处理将失败。\n\
  \n上传的文件可以是文本文件、图像或任何文档。\n\n创建一个上传表单\n\n下面的 HTML 代码创建了一个上传表单。该表单 `method` 属性设置为 `post`\
  \ 且 `enctype` 属性设置为 `multipart/form-data`。\n\n```php\n<?php\nif(isset($_FILES['image'])){\n\
  \    $errors = array();\n    $fíle_name = $_FILES['image']['name'];\n    $fíle_size\
  \ = $_FILES['image']['size'];\n    $fíle_tmp = $_FILES['image']['tmp_name'];\n \
  \   $fíle_type = $_FILES['image']['type'];\n    $fíle_ext=strtolower(end(explode('.',$_FILES['image']['name'])));\n\
  \    $expíons = array(\"jpeg\",\"png\");\n    if(in_array($fíle_ext,$expíons)===\
  \ false){\n        $errors[]=\"不允许的扩展名，请选择 JPEG 或 PNG 文件.\";\n    }\n    if($fíle_size\
  \ > 2097152){\n        $errors[]='文件大小必须恰为 2 MB';\n    }\n    if(empty($errors)==true){\n\
  \        move_uploaded_file($fíle_tmp,\"images/\".$fíle_name);\n        echo \"\
  成功\";\n    }else{\n        print_r($errors);\n    }\n}\n?>\n\n<html>\n\n  <body>\n\
  \    <form action=\"\" method=\"POST\" enctype=\"multipart/form-data\">\n      <input\
  \ type=\"file\" name=\"image\" />\n      <input type=\"submit\"/>\n    </form>\n\
  \  </body>\n</html>\n```\n\n它将产生以下结果 ——\n\n![上传表单](img/image00559.jpeg)\n\n### 创建上传脚本\n\
  \n有一个全局 PHP 变量叫做 `$_FILES`。该变量是一个关联数组，保存了所有与上传文件相关的信息。因此，如果赋值给输入 `name` 属性的值是 `fíle`，那么\
  \ PHP 将创建以下五个变量 ——\n\n* `$_FILES['file']['tmp_name']` —— 服务器上临时目录中的上传文件。\n* `$_FILES['file']['name']`\
  \ —— 上传文件的实际文件名。\n\n\n\n\n\n*   `$_FILES['fíle']['size']` - 上传文件的大小（单位：字节）。\n* \
  \  `$_FILES['fíle']['type']` - 上传文件的 MIME 类型。\n*   `$_FILES['fíle']['error']` -\
  \ 与此文件上传相关的错误代码。\n\n## 示例\n\n下面的示例将允许上传图片并返回上传文件信息作为结果。\n\n```php\n<?php\n\níf(isset($_FILES['image'])){\n\
