  ## 动态网站\n\n\n\n\n\n# PHP 的特性\n\n五个重要的特性使得 PHP 的本质成为可能：\n\n* 简单\n* 高效\n* 安全\n* 灵活性\n\
  * 熟悉\n\n## PHP 中的 \"Hello World\" 脚本\n\n为了感受 PHP 的特性，首先从简单的脚本开始。由于 \"Hello World!\"\
  \ 是一个基础示例，我们首先将创建一个友好的 \"Hello World!\" 脚本。\n\n如之前提到的，PHP 是嵌入在 HTML 中的。这意味着在你的普通\
  \ HTML（如果你追求前沿，则是 XHTML）中，你会有这样的 PHP 语句：\n\n```html\n<html>\n<head>\n<title>Hello\
  \ World</title>\n</head>\n<body>\n<?php echo \"Hello World!\";?>\n</body>\n</html>\n\
  ```\n\n它将产生以下结果：\n\nHello World!\n\n如果你检查上述示例的 HTML 输出，你会发现从服务器发送到你浏览器的文件中，并不存在\
  \ PHP 代码。网页中出现的所有 PHP 代码都经过了处理并从页面中剥离了；Web 服务器返回给客户端的唯一内容是纯 HTML 输出。\n\n所有的 PHP\
  \ 代码都必须包含在 PHP 解析器识别的三个特殊标记标签之一：\n\n```php\n<?php 此处编写 PHP 代码 ?>\n<?php 此处编写 PHP\
  \ 代码 ?>\n<script language=\"PHP\">此处编写 PHP 代码</script>\n```\n\n最常用的标签是 `<?php...?>`，我们在教程中也将使用相同的标签。从下一章开始，我们将从在你的机器上进行环境搭建开始，然后我们将讨论所有与\
  \ PHP 相关的概念，让你熟悉这门语言。\n\n# PHP 环境搭建\n\n为了开发和运行 PHP 页面，你的计算机系统上需要安装三个关键组件：\n\n* **Web\
  \ 服务器**：PHP 可以与几乎所有的 Web 服务器软件配合，包括微软的 Internet 信息服务 (IIS)，但最常用的是免费提供的 Apache 服务器。在此免费下载\
  \ Apache：`https://httpd.apache.org/download.cgi`\n* **数据库**：PHP 可以与几乎所有的数据库软件配合，包括\
  \ Oracle 和 Sybase，但最常用免费提供的 MySQL 数据库。在此免费下载 MySQL：`https://www.mysql.com/downloads/`\n\
  * **PHP 解析器**：为了处理 PHP 脚本指令，必须安装解析器来生成可以发送到浏览器的 HTML 输出。本教程将指导你如何在计算机上安装 PHP 解析器。\n\
  \n### 安装 PHP 解析器\n\n在继续之前，重要的是确保你的机器上已经配置了正确的环境，以便使用 PHP 开发 Web 程序。\n\n在浏览器的地址栏输入以下地址：`http://127.0.0.1/info.php`\n\
  \n如果显示了一个显示 PHP 安装相关信息的页面，说明你已正确安装了 PHP 和服务器。否则，你必须按照给定的程序在计算机上安装 PHP。本节将指导你在以下四个平台上安装和配置\
  \ PHP：\n\n* 在 Linux 或 Unix 上配合 Apache 安装 PHP\n* 在 Mac OS X 上配合 Apache 安装 PHP\n*\
  \ 在 Windows NT/2000/XP 上配合 IIS 安装 PHP\n* 在 Windows NT/2000/XP 上配合 Apache 安装 PHP\n\
  \n### Apache 配置\n\n如果你使用 Apache 作为 Web 服务器，本节将指导你编辑配置文件。在此查看：`https://www.tutorialspoint.com/php/apache_configuration.htm`\n\
  \n### php.ini 配置\n\nPHP 配置文件 `php.ini` 是影响 PHP 功能最后且最直接的方法。在此查看：`https://www.tutorialspoint.com/php_ini_configuration.htm`\n\
  \n### Windows 配置\n\n要在你的 Windows 机器上配置 PHP，你可以参考随 PHP 附带的手手册。\n\n# PHP 语法概述\n\n\
  本章将让你了解非常基础的 PHP 语法，并打好 PHP 基础。\n\n## 转义到 PHP\n\nPHP 解析引擎需要一种方法将 PHP 代码与页面其他元素区分开。这种机制被称为“转义到\
  \ PHP”（escaping to PHP）。有四种方法：\n\n### 标准 PHP 标签\n\n最通用的标记样式是：\n\n```php\n<?php...?>\n\
  ```\n如果你使用这种样式，你可以确定你的标签将始终被正确解释。\n\n### 短开放标签 (SGML 风格)\n\n短标签或短开放标签看起来像这样：`<??>`。正如人们预期的，短标签是最短的选项。你必须执行以下操作之一来让\
  \ PHP 识别这些标签：\n\n* 在构建 PHP 时选择 `enable-short-tags` 配置选项。\n* 在你的 `php.ini` 文件中将 `short_open_tag`\
  \ 设置为 `on`。在 PHP 解析 XML 时，必须禁用此选项，因为 XML 标签也使用了相同的语法。\n\n### ASP 风格标签\n\nASP 风格标签模仿\
  \ Active Pages 用于界定代码块的标签。ASP 风格标签看起来像这样：`<%%>`。要使用 ASP 风格标签，你需要在 `php.ini` 文件中设置配置选项。\n\
  \n### HTML 脚本标签\n\nHTML 脚本标签看起来像这样：`<script language=\"PHP\">...</script>`\n\n##\
  \ 注释 PHP 代码\n\n注释是程序中仅供人类阅读的部分，在显示程序结果之前会被剥离。PHP 中有两种注释格式：\n\n### 单行注释\n\n它们通常用于简短说明或与本地代码相关。以下是单行注释的示例：\n\
  \n```php\n<?php\n# 这是一个注释，\n# 这是注释的第二行\n// 这也是一个注释。\nprint \"带有单行注释的示例\";\n?>\n\
  ```\n\n### 多行打印\n\n以下是在单个 print 语句中打印多行的示例：\n\n```php\n<?php\n# 第一个示例\nprint <<<END\n\
  这使用“在此文档”（here document）语法来输出\n带有 $variable 变量值的多行。请注意\n在此文档的终止符必须出现在\n仅包含分号的行上，不能有额外的空格！\n\
  END;\n\n# 第二个示例\nprint \"这跨越了\n多行。换行符也将输出\";\n?>\n```\n\n### 多行注释\n\n它们通常用于需要时提供伪代码算法和更详细的解释。多行注释样式与\
  \ C 语言相同。以下是多行注释的示例：\n\n```php\n<?php\n/* 这是一个多行注释\n作者: Mohammad Mohtasim\n目的: 多行注释演示\n\
  主题: PHP */\nprint \"带有多行注释的示例\";\n?>\n```\n\n## PHP 对空格不敏感\n\n空格是你输入的在屏幕上通常不可见的字符，包括空格、制表符和回车符（行尾字符）。PHP\
  \ 对空格不敏感意味着连续出现多少个空格几乎没有影响。一个空格字符与许多此类字符是相同的。\n\n例如，以下将 2 + 2 的和赋值给变量 `$four` 的\
  \ PHP 语句都是等效的：\n\n```php\n$four = 2 + 2; // 单空格\n$four = 2 + 2 ; // 空格和制表符\n$four\
  \ =\n2+\n2; // 多行\n```\n\n### PHP 大写敏感\n\n是的，PHP 是一种对大小写敏感的语言。尝试以下示例：\n\n```html\n\
  <html>\n<body>\n  <?php\n    $capital = 67;\n    print(\"Variable capital is $capital<br>\"\
  );\n    print(\"Variable CaPíTaL is $CaPíTaL<br>\");\n  ?>\n</body>\n</html>\n```\n\
  \n这将产生以下结果：\n\nVariable capital is 67\n\nVariable CaPíTaL is \n\n\n\n\n\n# 语句是以分号终止的表达式\n\
  \n`PHP` 中的 `statement`（语句）是任何后面跟着分号（`;`）的 `expression`（表达式）。任何被 PHP 标签包围的有效 `PHP`\
  \ 语句序列都是一个有效的 `PHP` 程序。这里有一个典型的 `PHP` 语句，在此例中，它将一个字符串赋值给名为 `$greeting` 的变量——\n\n\
  ```php\n$greeting = \"Welcome to PHP!\";\n```\n\n## 表达式是标记的组合\n\n`PHP` 的最小构建单元是不可分的标记（tokens），例如数字（`3.14159`）、字符串（`'.two.'`）、变量（`$two`）、常量（`TRUE`）以及构成\
  \ `PHP` 本身语法的特殊单词，如 `if`、`else`、`while`、`for` 等。\n\n## 大括号形成块\n\n虽然不能像表达式那样组合语句，但你可以将一组语句封装在大括号中，将其放在任何可以放置语句的地方。\n\
  \n这里两个语句是等价的——\n\n```php\nif (3 == 2 + 1)\n  prnt(\"Good - Í haven't totally lost\
  \ my mínd.<br>\");\n\nif (3 == 2 + 1) {\n  prnt(\"Good - Í haven't totally\");\n\
  \  prnt(\"lost my mínd.<br>\");\n}\n```\n\n## 从命令行运行 PHP 脚本\n\n是的，你可以在命令行提示符上运行\
  \ `PHP` 脚本。假设 `test.php` 文件包含以下内容：\n\n```php\n<?php\n  echo \"Hello PHP!!!!!\";\n\
  ?>\n```\n\n现在按照如下方式在命令行运行此脚本——\n\n```bash\n$ php test.php\n```\n\n它将产生以下结果——\n\n\
  Hello PHP!!!!!\n\n希望你现在已经有了 `PHP` 语法的基础知识。\n\n# PHP - 变量类型\n\n在 `PHP` 程序中间存储信息的主要方法是使用变量。以下是关于\
  \ `PHP` 变量最最重要的事项。\n\n- `PHP` 中的所有变量都以开头的美元符号（`$`）表示。\n- 变量的值是其最近赋值的值。\n- 变量使用 `=`\
  \ 运算符赋值，左侧是变量，右侧是待求值的表达式。\n- 变量可以在赋值前声明，但不是必须的。\n- `PHP` 中的变量没有内在类型 - 变量预先不知道它将被用于存储数字还是字符串。\n\
  - 在赋值之前使用的变量具有默认值。\n- `PHP` 在必要时自动将类型从一种转换为另一种类型方面做得很好。\n- `PHP` 变量类似于 Perl。\n\n\
  `PHP` 共有八种数据类型，我们用它们来构建变量——\n\n- **整数 (Integers)**：是整数，没有小数点，例如 `4195`。\n- **双精度浮点数\
  \ (Doubles)**：是浮数，例如 `3.14159` 或 `49.1`。\n- **布尔值 (Booleans)**：只有两个可能的值，`true` 或\
  \ `false`。\n- **NULL**：是一种特殊类型，只有一个值：`NULL`。\n- **字符串 (Strings)**：是字符序列，例如 `'PHP\
  \ supports.'`。\n- **数组 (Arrays)**：是其他值的命名和索引集合。\n- **对象 (Objects)**：是程序员定义的类的实例，它们可以封装其他类型的值。\n\
  - **资源 (Resources)**：是持有外部资源引用（如数据库连接）的特殊变量。\n\n前五个是简单类型，后两个（数组和对象）是复合类型 - 复合类型可以封装任意类型的任意值，而简单类型不能。\n\
  \n### 整数 (Integers)\n\n它们是不带小数点的整数，例如 `4195`。它们是最简单的类型 - 它们对应于简单的正负整数。\n\n```php\n\
  $int_var = 12345;\n$another_int = -12345 + 12345;\n```\n\n整数可以是十进制（基 10）、八进制（基 8）和十六进制（基\
  \ 16）格式。十进制是默认格式，八进制整数以 `0` 开头，十六进制以 `0x` 开头。对于大多数常用平台，最大的整数是 `(2**31-1)`（或 `2147483647`），最小的（最负的）整数是\
  \ `-(2**31-1)`（或 `-2147483647`）。\n\n### 双精度浮点数 (Doubles)\n\n它们像 `3.14159` 或 `49.1`。默认情况下，双精度浮点数以所需的最小位数打印。例如，代码——\n\
  \n```php\n<?php\n  $many = 2.288800;\n  $many_2 = 2.2111200;\n  $few = $many + $many_2;\n\
  \  prnt(\"$many + $many_2 = $few <br>\");\n?>\n```\n\n它在浏览器中产生输出——\n\n2.28888 +\
  \ 2.21112 = 4.5\n\n### 布尔值 (Boolean)\n\n它们只有两个可能的值 `true` 或 `false`。`PHP` 提供了几个常量专门用于布尔值：`TRUE`\
  \ 和 `FALSE`，可以这样使用——\n\n```php\nif (TRUE)\n  prnt(\"This will always print<br>\"\
  );\nelse\n  prnt(\"This will never print<br>\");\n```\n\n### 将其他类型解释为布尔值\n\n以下是确定任何不已经是布尔类型的值的“真假”的规则——\n\
  \n- 如果值是数字，它恰好等于零则为假，否则为真。\n- 如果值是字符串，如果字符串为空（字符数为零）或为字符串 \"0\"，则为假，否则为真。\n- 类型\
  \ `NULL` 的值始终为假。\n- 如果值是数组，如果它不包含其他值，则为假，否则为真。对于对象，包含值意味着有一个已赋值的成员变量。\n- 有效的资源为真（尽管某些在成功时返回资源的函数在失败时会返回\
  \ `FALSE`）。\n- 不要将双精度浮点数当作布尔值。\n\n以下每个变量在布尔语境中使用时，其真值嵌入在其名称中。\n\n```php\n$true_num\
  \ = 3 + 0.14159;\n$true_str = \"Tried and true\";\n$true_array[49] = \"An array\
  \ element\";\n$false_array = array();\n$false_null = NULL;\n$false_num = 9;\n```\n\
  \n\n\n\n你可以使用此处文档（here document）将多个行赋值给单个字符串变量——\n\n```php\n<?php\n\n  $channel\
  \ =<<<\\_XML\\_\n\n  <channel>\n      <title>晚餐吃什么</title>\n      <línk>http://menu.example.com/\
  \ </línk>\n      <descríptíon>决定今晚吃什么。</descríptíon>\n  </channel>\n\n  \\_XML\\\
  _;\n\n  echo <<<END\n\n  这里使用了“此处文档”语法来输出带有变量插值的多行。注意，此处文档的结束符必须出现在只包含一个分号的行中。不能有任何额外的空格！\n\
  \n  END;\n\n  prínt $channel;\n\n?>\n```\n\n这将产生以下结果——\n\n这里使用了“此处文档”语法来输出\n带有变量插值的多行。请注意，此处文档的结束符必须出现在一个\n\
  只包含一个分号的行中。不能有任何额外的空格！\n<channel>\n<title>晚餐吃什么<title>\n<línk>http://menu.example.com/<línk>\n\
  <descríptíon>决定今晚吃什么。</descríptíon>\n\n## 变量作用域\n\n作用域可以定义为变量在声明程序中的可用范围。PHP 变量可以是四种作用域类型之一——\n\
  \n- [本地变量](https://www.tutorialspoint.com/php/php_local_variables.htm)\n- [函数参数](https://www.tutorialspoint.com/php/php_function_parameters.htm)\n\
  - [全局变量](https://www.tutorialspoint.com/php/php_global_variables.htm)\n- [静态变量](https://www.tutorialspoint.com/php/php_static_variables.htm)\n\
  \n## 变量命名\n\n变量命名规则是——\n\n- 变量名必须以字母或下划线开头。\n- 变量名可以由数字、字母、下划线组成，但你不能使用如 `+`、`-`、`%`、`(`、`)`、`&`\
  \ 等字符\n变量没有大小限制\n\n# PHP - 常量类型\n\n常量是简单值的名称或标识符。常量值在脚本执行期间不能更改。默认情况下，常量是大小写敏感的。按照惯例，常量标识符始终使用大写。常量名以字母或下划线开头，后跟任意数量的字母、数字或下划线。如果你定义了一个常量，它永远无法被更改或取消。\n\
  \n要定义常量，你需要使用 `define()` 函数，要获取常量的值，只需指定它的名称。与变量不同，你不需要为常量加 `$`。如果你想动态获取常量名，还可以使用\
  \ `constant()` 函数来读取常量的值。\n\n### constant() 函数\n\n如名称所示，此函数将返回常量的值。当你想要获取常量的值但不知道它的名称时（例如它存储在变量中或由函数返回），这非常有用。\n\
  \n## constant() 示例\n\n```php\n<?php\n\n  defíne(\"MÍNSÍZE\", 50);\n\n  echo MÍNSÍZE;\n\
  \n  echo constant(\"MÍNSÍZE\"); // 与上一行相同\n\n?>\n```\n\n标量数据（布尔、整数、浮点和字符串）可以包含在常量中。常量与变量的区别是：\n\
  \n- 常量前不需要写美元符号 (`$`)，而变量必须写美元符号。\n- 常量不能通过简单赋值定义，只能使用 `define()` 函数定义。\n- 常量可以根据变量作用域规则在任何地方定义和访问。\n\
  - 一旦设置了常量，就不能重新定义或取消。\n\n### 有效和无效的常量名\n\n// 有效的常量名\n```php\ndefíne(\"ONE\", \"\
  first thíng\");\ndefíne(\"TWO2\", \"second thíng\");\ndefíne(\"THREE\\_\", \"third\
  \ thíng\");\n```\n// 无效的常量名\n```php\ndefíne(\"2TWO\", \"thrd value\");\n```\n\n\
  ### PHP 魔术常量\n\nPHP 为运行的任何脚本提供了大量的预定义常量。有五个魔术常量，它们根据其所在的位置而改变。例如，`LINE` 的值取决于它所在的行。这些特殊常量是大小写敏感的，并且是“魔术”的：\n\
  \n| 序号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `LINE` | 取决于它使用的行。 |\n| 2 | `FILE__`\
  \ | 取决于它所在的文件。 |\n| 3 | `DIR__` | 取决于它所在的目录。 |\n| 4 | `__LINE__` | 取决于当前的行号。 |\n\
  | 5 | `__FUNCTION__` | 取决于它所在的函数。 |\n\nPHP - 运算符类型\n\nPHP 提供了多种运算符：\n- 算术运算符\n-\
  \ 比较运算符\n- 逻辑运算符\n- 赋值运算符\n\n### 算术运算符\n\nPHP 提供了以下算术运算符，假设变量 A 为 10，变量 B 为 20——\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `+` | 两个操作数加 |\n| `-` | 从第一个操作数中减去第二个 |\n| `*`\
  \ | 两个操作数乘 |\n| `/` | 除以第二个 |\n| `%` | 取模（余数） |\n| `++` | 增一 |\n| `--` | 减一 |\n\n\
  ### 比较运算符\n\nPHP 提供了以下比较运算符，假设变量 A 为 10，变量 B 为 20——\n\n| 运算符 | 描述 |\n| :--- | :---\
  \ |\n| `==` | 检查两个操作数是否相等 |\n| `!=` | 检查两个操作数是否不相等 |\n| `>` | 检查左操作数是否大于右操作数 |\n\
  | `<` | 检查左操作数是否小于右操作数 |\n| `>=` | 检查左操作数是否大于等于右操作数 |\n| `<=` | 检查左操作数是否小于等于右操作数\
  \ |\n\n### 逻辑运算符\n\nPHP 提供了以下逻辑运算符，假设变量 A 为 10，变量 B 为 20——\n\n| 运算符 | 描述 |\n| :---\
  \ | :--- |\n| `and` | 逻辑与，如果两个操作数都为真则结果为真 |\n| `or` | 逻辑或，如果任意一个操作数为非零则结果为真 |\n\
  | `&&` | 逻辑与，如果两个操作数都为真则结果为真 |\n| `||` | 逻辑或，如果任意一个操作数为非零则结果为真 |\n\n\n\n\n| 运算符\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `||` | 逻辑或运算符。如果两个操作数中有一个非零，则条件为真。 | `(A\
  \ || B)` 为真。 |\n| `!` | 逻辑非运算符。用于反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符将使其变为假。 | `!(A && B)`\
  \ 为假。 |\n\n## 赋值运算符\n\nPHP 语言支持以下赋值运算符——\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | ---\
  \ |\n| `=` | 简单赋值运算符，将右侧操作数的值赋值给左侧操作数 | `C = A + B` 将 `A + B` 的值赋值给 `C` |\n| `+=`\
  \ | 加赋值运算符，它将右侧操作数加到左侧操作数并将结果赋值给左侧操作数 | `C += A` 等于 `C = C + A` |\n| `-=` | 减赋值运算符，它从左侧操作数中减去右侧操作数并将结果赋值给左侧操作数\
  \ | `C -= A` 等于 `C = C - A` |\n| `*=` | 乘赋值运算符，它将右侧操作数与左侧操作数相并将结果赋值给左侧操作数 | `C *=\
  \ A` 等于 `C = C * A` |\n| `/=` | 除赋值运算符，它将左侧操作数除以右侧操作数并将结果赋值给左侧操作数 | `C /= A` 等于\
  \ `C = C / A` |\n| `%=` | 取模赋值运算符，它使用两个操作数取模并将结果赋值给左侧操作数 | `C %= A` 等于 `C = C %\
  \ A` |\n\n## 条件运算符\n\n还有一种运算符被称为条件运算符。它首先评估表达式的真假值，然后根据评估结果执行两个给定语句之一。条件运算符的语法如下——\n\
  \n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `? :` | 条件表达式 | 如果条件为真 ? 则取值 X : 否则取值\
  \ Y |\n\n## 运算符分类\n\n我们上面讨论的所有运算符可以分为以下几类——\n\n* 一元前缀运算符，位于单个操作数之前。\n* 二元运算符，接受两个操作数并执行各种算术和逻辑操作。\n\
  * 条件运算符（三元运算符），接受三个操作数并根据第一个表达式的评估结果评估第二个或第三个表达式。\n* 赋值运算符，为变量赋值。\n\n## PHP 运算符优先级\n\
  \n运算符优先级决定了表达式中项的分组。这影响了表达式的方式。某些运算符的优先级高于其他；例如，乘法运算符的优先级高于加法运算符——\n\n例如 `x = 7\
  \ + 3 * 2;` 这里 `x` 被赋值为 13，而不是 20，因为运算符 `*` 的优先级高于 `+`，所以它先与 `3*2` 相乘，然后加 7。\n\n\
  优先级最高的运算符出现在表格顶部，优先级最低的出现在底部。在表达式中，高优先运算符将先被评估。\n\n| 类别 | 运算符 | 优先级 |\n| --- | ---\
  \ | --- |\n| 一元 | `! --` | 从右到左 |\n| 乘法 | `* / %` | 从左到右 |\n| 加法 | `+ -` | 从左到右\
  \ |\n| 关系 | `< <= >=` | 从左到右 |\n| 等于 | `== !=` | 从左到右 |\n| 逻辑与 | `&&` | 从左到右 |\n\
  | 逻辑或 | `||` | 从左到右 |\n| 条件 | `?:` | 从右到左 |\n| 赋值 | `= -= * /==` | 从右到左 |\n\n# PHP\
  \ - 决策\n\n`if`、`elseif` 和 `switch` 语句用于根据不同条件做出决策。\n\n你可以在代码中使用条件语句进行决策。PHP 支持以下决策语句——\n\
  \n* `if...else` 语句——当条件为真时执行一组代码，否则执行另一组。\n* `elseif` 语句——配合 `if...else` 语句使用，当多个条件之一为真时执行代码。\n\
  * `switch` 语句——如果你想在多个代码块中选择一个执行，使用 switch 语句。switch 语句用于避免冗长的 `if...elseif...else`\
  \ 代码。\n\n## If...Else \n\n如果你想在条件为真时执行某些代码，在条件为假时执行另一个代码，使用 `if...else` 语句。\n\n\
  ### 语法\n\n```php\nif (condition)\n  条件为真时执行代码;\nelse\n  条件为假时执行代码;\n```\n\n## 示例\n\
  \n以下示例如果今天是周五，将输出 \"Have a weekend!\"，否则将输出 \"Have a nice day!\"：\n\n```html\n<html>\n\
  <body>\n<?php\n$d= date(\"D\");\nif ($d== \"Fri\") echo \"Have a weekend\nelse echo\
  \ \"Have a day!\";\n?>\n</body>\n</html>\n```\n它将产生以下结果——\nHave a weekend!\n\n##\
  \ Else\n\n如果你想在多个条件之一为真时执行某些代码，使用 `elseif`\n\n### 语法\n\n```php\nif (condition)\n\
  \  条件为真时执行代码;\nelseif (condition)\n  条件为真时执行代码;\nelse\n  条件为假时执行代码;\n```\n\n## 示例\n\
  \n以下示例如果今天是周五，将输出 \"Have a weekend!\"，如果今天是周日，将输出 \"Have nice Sunday!\"。否则将输出 \"\
  Have a nice day!\"——\n\n```html\n<html>\n<body>\n<?php\n$d= date(\"D\");\nif ($d==\
  \ \"Fri\") echo \"Have a weekend!\";\nelseif ($d== \"Sun\") echo \"Have nice Sunday!\"\
  ;\nelse echo \"Have a nice day!\";\n?>\n</body>\n</html>\n```\n它将产生以下结果——\nWeekend\n\
  \n## Switch\n\n如果你想在多个代码块中选择一个执行，使用 switch 语句。switch 语句用于避免大量的 `if...elseif...else`\
  \ 代码。\n\n### 语法\n\n```php\nswitch (expression){\n  case label1:\n    表达式等于 label1\
  \ 时执行代码;\n    break;\n  case label2:\n    表达式等于 label2 时执行代码;\n    break;\n  default:\n\
  \    表达式不同于 label1 和 label2 时执行代码;\n}\n```\n\n## 示例\n\nswitch 语句的方式特殊。首先评估表达式，然后寻找匹配的标签。如果找到了匹配的值，将执行与匹配标签关联的代码；如果没有标签匹配标签，语句将执行任何指定的默认代码。\n\
  \n```html\n<html>\n<body>\n<?php\n$d= date(\"D\");\nswitch ($d){\n  case \"Mon\"\
  :\n    echo \"Today is Monday\";\n    break;\n  case \"Tue\":\n    echo \"Today\
  \ is Tuesday\";\n    break;\n  case \"Wed\":\n    echo \"Today is Wednesday\";\n\
  \    break;\n  case \"Thu\":\n    echo \"Today is Thursday\";\n    break;\n  case\
  \ \"Fri\":\n    echo \"Today is Friday\";\n    break;\n  case \"Sat\":\n    echo\
  \ \"Today is Saturday\";\n    break;\n  case \"Sun\":\n    echo \"Today is Sunday\"\
  ;\n    break;\n  default:\n    echo \"Wonder which day is this ?\";\n}\n?>\n</body>\n\
  </html>\n```\n它将产生以下结果——\nToday is Monday\n\n# 循环类型\n\nPHP 中的循环用于指定的次数执行相同的代码块。PHP\
  \ 支持以下四循环类型。\n\n* for——以指定的次数循环代码块。\n* while——只要指定的条件为真，就循环代码块。\n\n\n\n\n\n- `do...while`\
  \ — 循环一次代码块，然后只要特殊条件为真，就会重复循环。\n- `foreach` — 遍历数组中的每个元素并执行代码块。\n\n我们将讨论用于控制循环执行的\
  \ `continue` 和 `break` 关键字。\n\n## for 循环语句\n\n当你知道要执行语句或语句块的次数时，就会使用 `for` 循环语句。\n\
  \n![Php 中的 for 循环](img/image00549.jpeg)\n\n### 语法\n\n```php\nfor (initialization;\
  \ condition; increment){\n   // 要执行的代码;\n}\n```\n\n`initializer` 用于设置循环迭代次数计数器的起始值。为了此目的可以在这里声明一个变量，传统上将其命名为\
  \ `$i`。\n\n## 示例\n\n以下示例执行了五次迭代，并在循环的每次通过中更改两个变量的赋值值 —\n\n```html\n<html>\n  <body>\n\
  \      <?php\n        $a = 0;\n        $b = 0;\n        for( $i = 0; $i<5; $i++\
  \ ) {\n            $a += 10;\n            $b += 5;\n        }\n        echo (\"\
  At the end of the loop a = $a and b = $b\" );\n      ?>\n  </body>\n</html>\n```\n\
  \n这将产生以下结果 —\nAt the end of the loop a = 50 and b = 25\n\n## while 循环语句\n\n`while`\
  \ 语句当测试表达式为真时且只要它为真，就会执行代码块。如果测试表达式为真，则将执行代码块。代码执行后，将再次评估测试表达式，循环将持续直到测试表达式为假。\n\
  \n![PHP 中的 for 循环](img/image00550.jpeg)\n\n### 语法\n\n```php\nwhile (condition) {\n\
  \   // 要执行的代码;\n}\n```\n\n## 示例\n\n此示例在循环的每次迭代中变量值减 1，计数器不断增加，直到达到 10 时，评估结果为假，循环结束。\n\
  \n```html\n<html>\n  <body>\n      <?php\n        $i = 0;\n        $num = 50;\n\
  \        while($i < 10) {\n            $num--;\n            $i++;\n        }\n \
  \       echo (\"Loop stopped at i = $i and num = $num\" );\n      ?>\n  </body>\n\
  </html>\n```\n\n这将产生以下结果 —\nLoop stopped at i = 10 and num = 40\n\n## do...while\
  \ 循环语句\n\n`do...while` 语句至少执行一次代码块 — 只要条件为真，它就会重复循环。\n\n### 语法\n\n```php\ndo {\n\
  \   // 要执行的代码;\n} while (condition);\n```\n\n## 示例\n\n以下示例至少增加一次 `$i` 的值，只要 `$i`\
  \ 的值小于 10，它就会继续增加变量 `$i` —\n\n```html\n<html>\n  <body>\n      <?php\n        $i\
  \ = 0;\n        $num = 0;\n        do {\n            $i++;\n        } while($i <\
  \ 10 );\n        echo (\"Loop stopped at i = $i\" );\n      ?>\n  </body>\n</html>\n\
  ```\n\n这将产生以下结果 —\nLoop stopped at i = 10\n\n## foreach 循环语句\n\n`foreach` 语句用于遍历数组。在每次通过时，数组元素的值被赋值给\
  \ `$value`，数组指针移动一位，下一次通过将处理下一个元素。\n\n### 语法\n\n```php\nforeach (array as value)\
  \ {\n   // 要执行的代码;\n}\n```\n\n## 示例\n\n尝试以下示例来列出数组的值。\n\n```html\n<html>\n  <body>\n\
  \      <?php\n        $array = array( 1, 2, 3, 4, 5);\n        foreach( $array as\
  \ $value ) {\n            echo \"Value is $value <br />\";\n        }\n      ?>\n\
  \  </body>\n</html>\n```\n\n这将产生以下结果 —\nValue is 1\nValue is 2\nValue is 3\nValue\
  \ is 4\nValue is 5\n\n## break 语句\n\nPHP `break` 关键字用于提前终止循环的执行。`break` 语句位于语句块内部。它让你拥有完全的控制权，每当你想退出循环时，都可以离开。退出循环后，将执行循环后的后续语句。\n\
  \n![PHP break 语句](img/image00551.jpeg)\n\n## 示例\n\n在以下示例中，当计数器值达到 3 时，条件测试变为真，循环终止。\n\
  \n```html\n<html>\n  <body>\n      <?php\n        $i = 0;\n        while( $i < 10)\
  \ {\n            $i++;\n            if( $i== 3 )break;\n        }\n        echo\
  \ (\"Loop stopped at i = $i\" );\n      ?>\n  </body>\n</html>\n```\n\n这将产生以下结果\
  \ —\nLoop stopped at i = 3\n\n## continue 语句\n\nPHP `continue` 关键字用于停止循环的当前迭代，但它不会终止循环。与\
  \ `break` 语句一样，`continue` 语句位于包含循环代码的语句块内部。`continue` 语句跳过后续代码并开始下一次迭代。\n\n![Continue\
  \ 语句](img/image00552.jpeg)\n\n## 示例\n\n以下示例打印数组的值，但当条件为真时会跳过后续代码。\n\n```html\n<html>\n\
  \  <body>\n      <?php\n        $array = array( 1, 2, 3, 4, 5);\n        foreach(\
  \ $array as $value ) {\n            if($value== 3 )continue;\n            echo \"\
  Value is $value <br />\";\n        }\n      ?>\n  </body>\n</html>\n```\n\n此将产生以下结果\
  \ —\nValue is 1\nValue is 2\nValue is 4\nValue is 5\n\n# PHP - 数组\n\n数组是一种存储单个变量中多个相同类型值的数据结构。例如，如果你想存储\
  \ 100 个数字，比定义 100 个变量要简单得多。\n\n- 数字数组 — 具有数字索引的数组。值以线性方式存储。\n- 关联数组 — 以字符串作为索引的数组。存储键值关联，而不是严格的线性顺序。\n\
  - 多维数组 — 包含多个数组的数组，可以使用多个索引访问。\n\n注意 — 内置数组函数请函数参考。\n\n## 数字数组\n\n这些数组可以存储数字、字符串和任何对象，但它们的索引由数字表示。默认情况下索引从\
  \ 0 开始。\n\n## 示例\n\n以下是如何创建和访问数字数组的示例。在这里我们 `array()` 函数来创建数组。该函数在函数参考中有解释。\n\n\
  ```html\n<html>\n  <body>\n      <?php\n        /* 第一种创建数组的方法 */\n        $numbers\
  \ = array( 1, 2, 3, 4, 5);\n        foreach( $numbers as $value ) {\n          \
  \  echo \"Value is $value <br />\";\n        }\n        /* 第二种创建数组的方法 */\n     \
  \   $numbers[0] = \"one\";\n        $numbers[1] = \"two\";\n        $numbers[2]\
  \ = \"three\";\n        $numbers[3] = \"four\";\n        $numbers[4] = \"five\"\
  ;\n        foreach( $numbers as $value ) {\n            echo \"Value is $value <br\
  \ />\";\n        }\n      ?>\n  </body>\n</html>\n```\n\n这将产生以下结果 —\nValue is 1\n\
  Value is 2\nValue is 3\nValue is 4\nValue is 5\nValue is one\nValue is two\nValue\
  \ is three\nValue is four\nValue is five\n\n## 关联数组\n\n关联数组在功能上与数字数组非常相似，但在索引方面有所不同。关联数组将索引设为字符串，以便你可以在键和值之间建立强关联。\n\
  \n要在数组中存储员工的薪水，数字索引数组不是最佳选择。相反，我们可以使用员工名称作为关联数组的键，而值则是他们相应的薪水。\n\n\n\n\n\n注意 - 打印时不要在双引号内保留关联数组，否则它将不会返回任何值。\n\
  \n## 示例\n\n```html\n<html>\n  <body>\n      <?php\n        /* 创建关联数组的í种方法。 */\n\
  \        $salaríes = array(\"mohammad\" => 2000, \"qadír\" => 1000, \"zara\" =>\
  \ 500);\n        echo \"Salary of mohammad ís \". $salaríes['mohammad'] . \"<br\
  \ />\";\n        echo \"Salary of qadír ís \".  $salaríes['qadír']. \"<br />\";\n\
  \        echo \"Salary of zara ís \".  $salaríes['zara']. \"<br />\";\n        /*\
  \ 创建数组的第二种方法。 */\n        $salaríes['mohammad'] = \"hígh\";\n        $salaríes['qadír']\
  \ = \"medíum\";\n        $salaríes['zara'] = \"low\";\n        echo \"Salary of\
  \ mohammad ís \". $salaríes['mohammad'] . \"<br />\";\n        echo \"Salary of\
  \ qadír ís \".  $salaríes['qadír']. \"<br />\";\n        echo \"Salary of zara ís\
  \ \".  $salaríes['zara']. \"<br />\";\n      ?>\n  </body>\n</</html>\n```\n\n这将产生以下结果\
  \ ―\nSalary of mohammad ís 2000\nSalary of qadír ís 1000\nSalary of zara ís 500\n\
  Salary of mohammad ís hígh\nSalary of qadír ís medíum\nSalary of zara ís low\n\n\
  ## 多维数组\n\n在多维数组中，主数组中的每个元素也可以是数组。子数组中的每个元素可以是数组，以此此类推。多维数组中的值通过多个索引来访问。\n\n## 示例\n\
  \n在这个示例中，我们创建了一个二维数组来存储三个学生在三门科目中的分数 ；\n\n此示例是一个关联数组，你可以以相同的方式创建数值数组。\n\n```html\n\
  <html>\n  <body>\n      <?php\n        $marks = array( \n          \"mohammad\"\
  \ => array (\n              \"physícs\" => 35,\n              \"maths\" => 30,\n\
  \              \"chemístry\" => 39\n          ),\n          \"qadír\" => array (\n\
  \              \"physícs\" => 30,\n              \"maths\" => 32,\n            \
  \  \"chemístry\" => 29\n          ),\n          \"zara\" => array (\n          \
  \    \"physícs\" => 31,\n              \"maths\" => 22,\n              \"chemístry\"\
  \ => 39\n          )\n        );\n        /* 访问多维数组的值 */\n        echo \"Marks for\
  \ mohammad ín physícs : \" ;\n        echo $marks['mohammad']['physícs'] . \"<br\
  \ />\"; \n        echo \"Marks for qadír ín maths : \";\n        echo $marks['qadír']['maths']\
  \ . \"<br />\"; \n        echo \"Marks for zara ín chemístry : \";\n        echo\
  \ $marks['zara']['chemístry'] . \"<br />\"; \n      ?>\n  </body>\n</</html>\n```\n\
  \n这将产生以下结果 ―\nMarks for mohammad ín physícs : 35\nMarks for qadír ín maths : 32\n\
  Marks for zara ín chemístry : 39\n\n# PHP - 字符串\n\n它们是字符序列，例如 \"PHP supports operatíons\"\
  。\n\n注意− 内置字符串函数在函数引用中给出。以下是字符串的有效示例：\n\n`$stríng1 = \"Thís ís a stríng double quotes\"\
  `\n`$str\\_2 = \"Thís ís a somewhat longer, síngly quoted strím\"`\n`$str\\_39 =\
  \ \"Thís strím has thírty-níne characters\"`\n`$str\\_0 = \"\"; // 一个带有零字符的字符串`\n\
  \n单引号字符串几乎按字面意思处理，而双引号字符串则会将变量替换为它们的值，将其视为特殊解释的字符序列。\n\n```php\n<?php\n$varíable\
  \ = \"name\";\n$líterally = 'My $varíable wíll not prínt!\\n';\nprint($líterally);\n\
  print(\"<br />\");\n$líterally = \"My $varíable wíll not prínt!\\n\";\nprint($líterally);\n\
  ?>\n```\n\n这将产生以下结果 ―\nMy $varíable wíll not prínt!\\n\nMy name wíll prínt!\\n\n\
  \n字符串长度没有人为限制 - 在可用内存范围内，你应该能够创建任意长度的字符串。由双引号分隔的字符串（如 \"thís\"）会被 PHP 以以下两种方式进行预处理\
  \ ―\n* 以反斜杠 (`\\`) 开头的某些字符序列将被替换为特殊字符\n* 变量名将被替换为它们的值\n\n转义序列替换如下：\n* `\\n` 替换为行符\n\
  * `\\r` 替换为回车符\n* `\\t` 替换为制表符\n* `\\$` 替换为美元符号\n* `\\\"` 替换为双引号\n* `\\\\` 替换为反斜杠\n\
  \n### 字符串连接运算符\n\n要连接两个字符串，使用点 (`.`) ―\n\n```php\n<?php\n$stríng1=\"Hello World\"\
  ;\n$stríng2=\"1234\";\necho $stríng1 . \" \" . $stríng2;\n?>\n```\n\nHello World\
  \ 1234\n\n如果我们查看上面的代码，可以看到我们使用了连接运算符两次。在两个变量之间添加了一个单引号空格以分隔它们。\n\n### 使用 strlen()\
  \ 函数\n\n`strlen()` 函数用于查找字符串的长度。让我们找到 \"Hello world!\" 的长度\n\n```php\n<?php\necho\
  \ strlen(\"Hello world!\");\n?>\n```\n\n12\n\n字符串的长度通常用于循环或其他函数，当我们需要知道字符串结束时（例如在循环中知道何时停止）。\n\
  \n### 使用 strpos() 函数\n\n`strpos()` 函数用于在字符串中搜索字符串或字符。如果在字符串中找到了匹配，该函数将返回第一次出现的 posíon。如果没有找到匹配，它将返回\
  \ FALSE。让我们看看是否能在字符串中找到 \"world\" ―\n\n```php\n<?php\necho strpos(\"Hello world!\"\
  ,\"world\");\n?>\n```\n\n6\n\n\"world\" 在字符串中的位置是 6。之所以是 6 而不是 7，是因为字符串的第一个 posíon\
  \ 是 0，而不是 1。\n\n## PHP - 概念\n\n本节演示 PHP 如何根据浏览器类型提供动态内容。PHP 创建了一些实用的环境变量，可以在 php.php\
