  - Perl 风格正则表达式\n\n### 括号\n\n括号 `[]` 在使用正则表达式时具有特殊含义。它们用于查找字符范围。\n\n| Sr.No | Expression\
  \ | Description |\n| :--- | :--- | :--- |\n| 1 | `[0-9]` | 匹配 0 到 9 的数字。 |\n| 2\
  \ | `[a-z]` | 匹配 a 到 z 的小写字母。 |\n| 3 | `[A-Z]` | 匹配 A 到 Z 的大写字母。 |\n| 4 | `[a-Z]`\
  \ | 匹配 a 到 Z 的字符。 |\n\n### 数量符\n\n括号化字符序列和单个字符的频率可以通过特殊字符表示。`+`、`*`、`?`、`{range}`\
  \ 和 `$` 都遵循字符序列。\n\n| Sr.No | Expression | Description |\n| :--- | :--- | :--- |\n\
  | 1 | `p+` | 匹配至少包含一个 p 的字符串。 |\n| 2 | `p*` | 匹配包含零或多个 p 的字符串。 |\n| 3 | `p?` | 匹配包含零或一个\
  \ p 的字符串。 |\n| 4 | `p{N}` | 匹配包含 N 个 p |\n| 5 | `p{2,3}` | 匹配 2 到 3 个 p。 |\n| 6\
  \ | `p{2, }` | 匹配至少包含两个 p。 |\n| 7 | `p$` | 匹配以 p 结尾的字符串。 |\n| 8 | `^p` | 匹配以 p 开头的字符串。\
  \ |\n\n## 示例\n\n以下示例将消除你对字符匹配的疑问。\n\n| Sr.No | Expression | Description |\n| :---\
  \ | :--- | :--- |\n| 1 | `[^a-zA-Z]` | 匹配不包含 a 到 z 和 A 到 Z 任意字符的字符串。 |\n| 2 | `p.p`\
  \ | 匹配包含 p、后续一个任意字符、再后续另一个 p 的字符串。 |\n| 3 | `^.{2}$` | 匹配恰包含两个字符的字符串。 |\n| 4 | `(.*.*)`\
  \ | 匹配 `<b>` 和 `</b>` 之间的字符串。 |\n| 5 | `p(hp)*` | 匹配包含 p 后跟零或多个 php 序列的字符串。 |\n\n\
  \n\n\n\n为了方便您的编程，提供了几个预定义的字符范围，也称为**字符类**。字符类指定了整个字符范围，例如，字母表或整数集 −\n\n| 序号 | 表达式\
  \ & 描述 |\n| --- | --- |\n| 1 | `[::alpha:]` 匹配任何包含字母 `aA` 到 `zZ` 的字符串。 |\n| 2 |\
  \ `[::digit:]` 匹配任何包含数字 `0` 到 `9` 的字符串。 |\n| 3 | `[::alnum:]` 匹配任何包含字母数字字符（`aA`\
  \ 到 `zZ` 以及数字 `0` 到 `9`）的字符串。 |\n| 4 | `[::space:]` 匹配任何包含空格的字符串。 |\n\n## PHP 的\
  \ Regexp POSIX 函数\n\nPHP 目前提供了 7 个使用 POSIX 风格正则表达式搜索字符串的函数 − |\n\n| 序号 | 函数 & 描述\
  \ |\n| --- | --- |\n| 1 | [ereg()](https://www.tutorialspoint.com/php/php_ereg.htm)\
  \ `ereg()` 函数在指定的字符串中搜索指定的模式，如果找到模式则返回 true，否则返回 false。 |\n| 2 | [ereg_replace()](https://www.tutorialspoint.com/php/php_ereg_replace.htm)\
  \ `ereg_replace()` 函数搜索指定的模式，如果找到，则将模式替换为替换内容。 |\n| 3 | [eregi()](https://www.tutorialspoint.com/php/php_eregi.htm)\
  \ `eregi()` 函数在指定的字符串中全局搜索指定的模式。搜索不区分大小写。 |\n| 4 | [eregi_replace()](https://www.tutorialspoint.com/php/php_eregi_replace.htm)\
  \ `eregi_replace()` 函数的操作方式与 `ereg_replace()` 完全相同，只是在字符串中搜索模式时时不区分大小写。 |\n| 5 |\
  \ [split()](https://www.tutorialspoint.com/php/php_split.htm) `split()` 函数将字符串划分为各种元素，每个元素的边界基于模式在字符串中出现的位置。\
  \ |\n| 6 | [spliti()](https://www.tutorialspoint.com/php/php_spliti.htm) `spliti()`\
  \ 函数的操作与其兄弟函数 `split()` 完全相同，只是它不区分大小写。 |\n| 7 | [sql_regcase()](https://www.tutorialspoint.com/php/php_sql_regcase.htm)\
  \ `sql_regcase()` 函数可以被认为是一个实用函数，将输入参数字符串中的每个字符转换为包含两个字符的括号表达式。 |\n\n## PERL 风格正则表达式\n\
  \nPerl 风格的正则表达式与其 POSIX 对应物相似。POSIX 语法几乎可以与 Perl 风格正则表达式函数互换使用。事实上，你可以使用上一个 POSIX\
  \ 部分中引入的任何量符。\n\n让我们对 PERL 正则表达式中的一些概念进行解释。之后，我们将为您介绍与正则表达式相关的函数。\n\n### 元字符\n\n\
  元字符简单来说就是一个带有反斜杠的字母字符，用于为该组合赋予特殊含义。\n\n例如，你可以使用元字符 `\\d` 搜索大金额：`/(\\\\\\d+)000/`。在这里，`\\\
  d` 将搜索任何数字字符字符串。\n\n以下是可以在 PERL 风格正则表达式中使用的元字符列表。\n\n| 字符 | 描述 |\n| --- | --- |\n\
  | `.` | 单个字符 |\n| `\\s` | 空白字符（空格、制表符、换行） |\n| `\\S` | 非空白字符 |\n| `\\d` | 数字 (0-9)\
  \ |\n| `\\D` | 非数字 |\n| `\\w` | 单词字符 (a-z, A-Z, 0-9, _) |\n| `\\W` | 非单词字符 |\n|\
  \ `[aeiou]` 匹配给定集合中的单个字符 |\n| `[^aeiou]` 匹配给定集合之外的单个字符 |\n| `(foo|bar|baz)` 匹配任何备选其一\
  \ |\n\n### 修饰符\n\n提供了几种修饰符，可以让你的正则表达式工作更简单，例如大小写敏感性。\n\n| 修饰符 | 描述 |\n| --- | ---\
  \ |\n| `i` | 使匹配不区分大小写 |\n| `g` | 全局查找所有匹配项 |\n| `m` | 按行评估匹配 |\n| `s` | 允许使用 `.`\
  \ 匹配换行符 |\n| `u` | 允许使用 UTF-8 字符 |\n| `x` | 允许在表达式中使用空白 |\n\n## PHP 的 Regexp 兼容函数\n\
  \nPHP 提供了以下使用 Perl 兼容表达式搜索字符串的函数：\n\n| 序号 | 函数 & 描述 |\n| --- | --- |\n| 1 | `preg_match()`\
  \ 如果模式存在则返回 true，否则返回 false。 |\n| 2 | `preg_match_all()` 返回模式的所有出现位置。 |\n| 3 | `preg_replace()`\
  \ 操作方式与 `replace()` 类似，但使用的是正则表达式。 |\n| 4 | `preg_split()` 操作与 `split()` 完全相同，但它接受输入参数。\
  \ |\n| 5 | `preg_grep()` 返回输入中的所有匹配项。 |\n| 6 | `preg_quote()` 转义正则表达式字符 |\n\n##\
  \ PHP - 错误处理\n\n错误处理是捕获程序抛出的错误并采取相应行动的过程。如果不妥善处理错误，可能会导致许多意外的后果。\n\n使用 `die()` 函数\n\
  \n在编写 PHP 时，你应该检查所有可能的错误情况。尝试以下文件示例：\n\n```php\n<?php\nif(!file_exists(\"/tmp/test.txt\"\
  )) {\n    die(\"文件不存在\");\n} else {\n    $file = fopen(\"/tmp/test.txt\",\"r\");\n\
  \    print \"打开成功\";\n}\n// 测试代码\n?>\n```\n\n这种这种你可以编写高效的代码。使用上述技术你可以在程序出错时停止并显示更有意义且友好的信息。\n\
  \n### 定义自定义错误处理器\n\n你可以编写自己的函数来处理任何错误。PHP 提供了一个定义框架。该函数必须能够处理两个参数（错误级别和错误消息），但可以接受五个参数（可选：文件、行号和错误上下文）。\n\
  \n### 语法\n\n```php\nerror_function(error_level, error_message, error_file, error_line,\
  \ error_context);\n```\n\n| 序号 | 参数 & 描述 |\n| --- | --- |\n| 1 | `error_level` 必需。指定自定义错误的报告级别。必须是一个数值。\
  \ |\n| 2 | `error_message` 必需。指定自定义错误的消息 |\n| 3 | `error_file` 可选。指定发生错误的文件名 |\n\
  | 4 | `error_line` 可选。指定发生错误的行号 |\n| 5 | `error_context` 可选。指定包含错误发生时每个变量及其值的数组\
  \ |\n\n### 可能的错误级别\n\n这些错误报告级别是自定义错误处理器可以使用的不同错误类型。这些值可以使用 `|` 运算符组合使用：\n\n| 序号\
  \ | 常量 & 描述 | 值 |\n| --- | --- | --- |\n| 1 | `E_ERROR` 致命运行时错误。脚本停止执行 | 1 |\n|\
  \ 2 | `E_WARNING` 非致命运行时错误。脚本不停止执行 | 2 |\n\n\n\n\n\n# 错误级别\n\n| 级别 | 常量 | 描述 | 优先级\
  \ |\n|:---|---|---|:---:|\n| 3 | `E_PARSE` | 编译时解析错误。解析错误应由解析器生成。 | 4 |\n| 4 | `E_NOTÍCE`\
  \ | 运行时通知。脚本发现了可能是错误的内容，但在正常运行脚本时也可能发生。 | 8 |\n| 5 | `E_CORE_ERROR` | PHP 初始化启动启动期间发生的致命错误。\
  \ | 16 |\n| 6 | `E_CORE_WARNING` | 非致命运行时错误。发生在 PHP 初始化启动期间。 | 32 |\n| 7 | `E_USER_ERROR`\
  \ | 用户生成的致命错误。类似于程序员使用 PHP 函数 `trigger_error()` 设置的 `E_ERROR`。 | 256 |\n| 8 | `E_USER_WARNING`\
  \ | 用户生成的非致命警告。类似于程序员使用 PHP 函数 `trigger_error()` 设置的 `E_WARNING`。 | 512 |\n| 9 |\
  \ `E_USER_NOTICE` | 用户生成的通知。类似于程序员使用 PHP 函数 `trigger_error()` 设置的 `E_NOTICE`。 |\
  \ 1024 |\n| 10 | `E_STRICT` | 运行时通知。启用后 PHP 将对您的代码建议更改，以确保代码最佳的操作性和向前兼容性。 | 2048\
  \ |\n| 11 | `E_RECOVERABLE_ERROR` | 可捕获的致命错误。类似于 `E_ERROR` 但可以被自定义处理器捕获（参见 `set_error_handler()`）。\
  \ | 4096 |\n| 12 | `E_ALL` | 所有错误和警告，除级别 `E_STRICT` 外外（从 PHP 6.0 开始 `E_STRICT` 将成为\
  \ `E_ALL` 的一部分）。 | 819 |\n\n上述所有错误级别都可以使用 PHP 内置函数 `error_report(level)` 设置，其中 `level`\
  \ 可以是上述定义的任何值。\n\n`error_report( [level] )`\n\n以下是创建错误错误处理器的方法：\n\n```php\n<?php\n\
  function handleError($errno, $errstr, $file, $line) {\n    echo \"<b>Error:</b>\
  \ [$errno] $errstr - $file:$line\";\n    echo \"<br />\";\n    echo \"Terminating\
  \ PHP\";\n    die();\n}\n```\n\n一旦你定义了自定义处理器，就不需要使用 PHP 内置库 `set_error_handler`\
  \ 来设置它。现在让我们通过调用一个不存在的函数来检查示例。\n\n```php\n<?php\nerror_report( E_ERROR );\nfunction\
  \ handleError($errno, $errstr, $file, $line) {\n    echo \"<b>Error:</b> [$errno]\
  \ $errstr - $file:$line\";\n    echo \"<br />\";\n    echo \"Terminating PHP\";\n\
  \    die();\n}\nset_error_handler(\"handleError\");\n// trigger\n```\nPHP 5 拥有一个与其他编程语言相似的异常模型。异常是重要的，并为对错误处理提供了更好的控制。\n\
  \n让我们解释与异常相关的关键字：\n\n- **Try**：使用异常的函数应该放在 `try` 块中。如果异常没有触发，代码将恢复正常执行。但如果触发了异常，异常就会被“抛出”。\n\
  - **Throw**：这是触发异常的方式。每个 `throw` 必须至少对应一个 `catch`。\n- **Catch**：`catch` 块获取异常并创建一个包含异常信息的对象。\n\
  \n当异常被抛出时，语句后面的代码不会执行，PHP 将尝试寻找第一个匹配的 `catch` 块。如果异常未被捕获，将抛出带有“Uncaught Exception”的\
  \ PHP 致命错误。\n\n- 异常可以在 PHP 中被抛出和捕获。代码可以被 `try` 块包裹。\n- 每个 `try` 必须至少有一个对应的 `catch`\
  \ 块。可以使用多个 `catch` 块来捕获不同类的异常。\n- 异常可以在 `catch` 块中抛出（或重新抛出）。\n\n## 示例\n以下是代码，将此代码复制并粘贴到文件中验证结果。\n\
  \n```php\n<?php\ntry {\n    $error = 'Always throw this error';\n    throw new Exception($error);\n\
  \    // 异常后的代码不会执行。\n    echo 'Never executed';\n} catch (Exception $e) {\n    echo\
  \ 'Caught exception: ', $e->getMessage(), \"\\n\";\n}\n// 继续执行\necho 'Hello World';\n\
  ?>\n```\n\n在上面的示例中，使用 `$e->getMessage()` 函数来获取错误消息。`Exception` 类中可以使用以下函数：\n\n-\
  \ `getMessage()`：异常消息\n- `getCode()`：异常代码\n- `getFile()`：源文件名\n- `getLine()`：源行号\n\
  - `getTrace()`：`backtrace()` 的数组\n- `getTraceAsString()`：格式化后的轨迹回溯字符串\n\n### 创建自定义异常处理器\n\
  你可以定义自己的自定义异常处理器。使用以下函数来设置用户定义的异常处理器函数：\n\n`string set_error_handler (callback $exception_handler)`\n\
  \n这里 `exception_handler` 是当发生未捕获的异常时要调用的函数名。该函数必须在调用 `set_error_handler()` 之前定义。\n\
  \n## 示例\n```php\n<?php\nfunction exception_handler($exception) {\n    echo \"Uncaught\
  \ exception: \", $exception->getMessage(), \"\\n\";\n}\nset_error_handler('exception_handler');\n\
  throw new Exception('Uncaught Exception');\necho \"Not Executed\\n\";\n?>\n```\n\
  \n# PHP - 调试\n\n程序很少第一次就能正常工作。程序中可能发生许多导致 解释器生成错误消息的情况。你可以选择错误消息的去向。消息可以随输出发送到浏览器。\n\
  \n若要在浏览器中显示错误，将 `display_errors` 指令设置为 `On`。要将错误发送到服务器日志，将 `log_errors` 设置为 `On`。如果你希望在两个地方显示，可以将两者都设置为\
  \ `On`。\n\nPHP 定义了一些常量，可以使用它们设置 `error_report` 的值以便报告某些类型：`E_ALL`（除严格的所有错误）、`E_PARSE`（解析错误）、`E_ERROR`（致命错误）、`E_WARNING`（警告）、`E_NOTICE`（通知）。\n\
  \n在编写 PHP 程序时，使用感知 PHP 的编辑器是一个好主意。编辑器的特殊功能之一是语法高亮。它根据这些部分的改变它们的颜色。例如，字符串是粉色的，关键字如\
  \ `if` 和 `while` 是蓝色的，注释是灰色的，变量是黑色的。\n\n另一个功能是引号和括号匹配，有助于确保引号和括号是平衡的。当你输入一个结束符 `}`\
  \ 时，编辑器会高亮与之匹配的起始符 `{`。\n\n调试程序时，需要验证以下点：\n\n- **缺少分号**：每个 PHP 语句都以分号（`;`）结束。PHP\
  \ 直到遇到分号才停止读取。如果你漏掉分号，PHP 将继续读取下一行的语句。\n- **不等号**：当你在比较语句中询问两个值是否相等时，你需要两个等号 (`==`）。使用一个等号是一个常见错误。\n\
  - **变量拼写错误**：如果你拼错了变量名，PHP 会将其视为新变量。记住：对 PHP 来说，`$test` 和 `$Test` 不是同一个变量。\n- **缺少美元符号**：变量名中缺少美元符号很难发现，但它通常会产生错误消息，让你知道去哪里寻找问题。\n\
  - **引号困扰**：你可能会有太多、太少或类型错误的引号。\n- **缺少括号和花括号**：它们应该成对出现。\n- **数组索引**：所有数组都应该从 0\
  \ 开始，而不是 1。\n\n\n\n\n此外，妥善处理所有错误并将所有跟踪消息重定向到系统日志文件中，这样如果发生任何问题，它将会被记录在系统日志文件中，你将能够调试该问题。\n\
  \n# PHP - 日期与时间\n\n日期是日常生活中如此重要的一部分，以至于在不经思考的情况下就能进行操作。PHP 还提供了强大的日期算术工具，使得操作日期变得非常简单。\n\
  \n## 使用 time() 获取时间戳\n\nPHP 的 `time()` 函数为您提供有关当前日期和时间所需的所有信息。它不需要任何参数，但会返回一个整数。\n\
  \n`time()` 返回的整数表示自 1970 年 1 月 1 日 GMT 午夜以来经过的秒数。这一时刻被称为 Unix 纪（UNIX epoch），从那时经过的秒数被称为时间戳。\n\
  \n```php\n<?php\n  print time();\n?>\n```\n\n这将产生以下结果 −\n\n1480930103\n\n这可能很难理解。但\
  \ PHP 提供了优秀的工具，可以将时间戳转换为人类熟悉的格式。\n\n## 使用 getdate() 转换时间戳\n\n`getdate()` 函数可选地接受一个时间戳，并返回一个包含日期信息的关联数组。如果你省略时间戳，它将与\
  \ `time()` 返回的当前时间戳运行。\n\n下表列出了 `getdate()` 返回的数组中包含的元素。\n\n| 序号 | 键与描述 | 示例 |\n\
  | --- | --- | --- |\n| 1 | seconds 过的秒 (0-59) | 20 |\n| 2 | minutes 小时过的分 (0-59)\
  \ | 29 |\n| 3 | hours 天中的小时 (0-23) | 22 |\n| 4 | mday 月中的第几天 (1-31) | 11 |\n| 5\
  \ | wday 周中的第几天 (0-6) | 4 |\n| 6 | mon 年中的月份 (1-12) | 7 |\n| 7 | year 年份 (4 位数)\
  \ | 1997 |\n| 8 | yday 一年的第几天 (0-365) | 19 |\n| 9 | weekday 星期几 | Thursday |\n|\
  \ 10 | month 年中的月份 | January |\n| 11 | 0 时间戳 | 948370048 |\n\n现在你对日期和时间有了完全的控制。你可以按照需要的任何格式格式化日期和时间。\n\
  \n## 示例\n\n尝试以下示例\n\n```php\n<?php\n  $date_array = getdate();\n  foreach ( $date_array\
  \ as $key => $val ){\n      print \"$key = $val<br />\";\n  }\n  $formated_date\
  \ = \"Today's date: \";\n  $formated_date .= $date_array['mday'] . \"/\";\n  $formated_date\
  \ .= $date_array['mon'] . \"/\";\n  $formated_date .= $date_array['year'];\n  print\
  \ $formated_date;\n?>\n```\n\n这将产生以下结果 −\n\nseconds = 10\nminutes = 29\nhours =\
  \ 9\nmday = 5\nwday = 1\nmon = 12\nyear = 2016\nyday = 339\nweekday = Monday\nmonth\
  \ = December\n0 = 1480930150\nToday's date: 5/12/2016\n\n## 使用 date() 转换时间戳\n\n\
  `date()` 函数返回一个表示日期的格式化字符串。你可以通过必须传递给它的字符串参数，对 `date()` 返回的格式进行大量的控制。\n\n`date(format,timestamp)`\n\
  \n`date()` 可选地接受一个时间戳，如果省略，则将使用当前日期和时间。传递给 `date()` 的格式字符串中包含的任何其他数据将包含在返回值中。\n\n\
  下表列出了格式字符串可以包含的代码：\n\n| 序号 | 格式与描述 | 示例 |\n| --- | --- | --- |\n| 1 | 'am' 或 'pm'\
  \ 小写 | pm |\n| 2 | 'AM' 或 'PM' 大写 | PM |\n| 3 | d 月中的几天，带前导零的数字 | 20 |\n| 4 | a\
  \ 星期几 | Thursday |\n| 5 | F 月份名称 | January |\n| 6 | h 12 小时制，带前导零 | 02 |\n| 7 |\
  \ H 24 小时制，带前导零 | 14 |\n| 8 | g 12 小时制，不带前导零 | 2 |\n| 9 | G 24 小时制，不带前导零 | 14 |\n\
  | 10 | d 月中的几天 | 5 |\n| 11 | m 月份数字 | 12 |\n| 12 | M 月份数字缩写 | Dec |\n| 13 | W 周中的第几天\
  \ | 1 |\n| 14 | j 一年的第几天 | 33 |\n| 15 | S 星期几的缩写 | Mon |\n| 16 | Y 年份 | 2016 |\n\
  | 17 | y 年份 | 16 |\n| 18 | s 秒 | 10 |\n| 19 | i 分 | 29 |\n| 20 | u 时 | 09 |\n| 21\
  \ | U 时间戳 | 1480930150 |\n| 22 | O 时区 | +0800 |\n| 23 | P 时区 | +0800 |\n| 24 | O\
  \ 时区 | +0800 |\n| 25 | P 时区 | -0800 |\n| 26 | E 时区 | -0800 |\n| 27 | a 时区 | GMT\
