  \            }catch (e) {\n              // Internet Explorer 浏览器\n            \
  \  try {\n                ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\");\n\
  \              }catch (e) {\n                try {\n                  ajaxRequest\
  \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n                }catch (e) {\n  \
  \                // 出了某些错误\n                  alert(\"您的浏览器崩溃了！\");\n          \
  \        return false;\n                }\n              }\n            }\n    \
  \        // 创建一个函数来接收从服务器\n            // 发送的数据并在同一页面中进行更新。\n            ajaxRequest.onreadystatechange\
  \ = function() {\n              if(ajaxRequest.readyState == 4) {\n            \
  \    var display = document.getElementById('ajaxDiv');\n                display.innerHTML\
  \ = ajaxRequest.responseText;\n              }\n            }\n            // 现在从用户处获取值并传递给\n\
  \            // 服务器脚本。\n            var age = document.getElementById('age').value;\n\
  \            var wpm = document.getElementById('wpm').value;\n            var sex\
  \ = document.getElementById('sex').value;\n            var queryString = \"?age=\"\
  \ + age ;\n            queryString += \"&wpm=\" + wpm + \"&sex=\" + sex;\n     \
  \       ajaxRequest.open(\"GET\", \"ajax-example.php\" + queryString, true);\n \
  \           ajaxRequest.send(null); \n          }\n        -->\n      </script>\n\
  \      <form name=\"myForm\">\n        最大年龄: <input type=\"text\" id=\"age\" />\
  \ <br />\n        最大 WPM: <input type=\"text\" id=\"wpm\" /> <br />\n        性别:\
  \ <select id=\"sex\">\n          <option value=\"m\">m</option>\n          <option\
  \ value=\"f\">f</option>\n        </select>\n        <input type=\"button\" onclick='ajaxFunction()'\
  \ value='查询 MySQL'/>\n      </form>\n      <div id=\"ajaxDiv\">您的结果将在这里显示</div>\n\
  \  </body>\n</html>\n```\n\n**注意** — 在查询中传递变量的方法符合 HTTP 标准，并具有表单形式。\n`URL?variable1=value1&variable2=value2;`\n\
  \n现在，上述代码将为你提供如下所示的屏幕。\n\n**注意** — 这是一个虚拟屏幕，无法工作。\n最大年龄：![](img/image00561.jpeg)\n\
  最大 WPM：![](img/image00561.jpeg)\n性别：![](img/image00562.jpeg)\n您的结果将在这里显示\n\n## 服务端\
  \ PHP 文件\n\n现在你的客户端脚本准备好了。现在我们必须编写服务端脚本，它将从数据库获取年龄、wpm 和性别并将其发送回客户端。将以下代码放入 `ajax-example.php`：\n\
  \n```php\n<?php\n$dbhost = \"localhost\";\n$dbuser = \"username\";\n$dbpass = \"\
  password\";\n$dbname = \"dbname\";\n\n// 连接到 MySQL\nmysql_connect($dbhost, $dbuser,\
  \ $dbpass);\n\n// 选择数据库\nmysql_select_db($dbname) or die(mysql_error());\n\n// 从查询中检索数据\n\
  $age = $_GET['age'];\n$sex = $_GET['sex'];\n$wpm = $_GET['wpm'];\n\n// 转义用户输入以注入\n\
  $age = mysql_real_string($age);\n$sex = mysql_real_string($sex);\n$wpm = mysql_real_string($wpm);\n\
  \n// 构建查询\n$query = \"SELECT * FROM ajax_example WHERE sex = '$sex'\";\nif($age)\
  \ $query .= \" AND age <= $age\";\nif($wpm) $query .= \" AND wpm <= $wpm\";\n\n\
  // 执行查询\n$qry_result = mysql_query($query) or die(mysql_error());\n\n// 构建结果字符串\n\
  $display_string = \"<table>\";\n$display_string += \"<tr><th>Name</th>\";\n$display_string\
  \ += \"<th>Age</th>\";\n$display_string += \"<th>Sex</th>\";\n$display_string +=\
  \ \"<th>WPM</th></tr>\";\n\n// 为返回的每个人在表格插入行\nwhile($row = mysql_fetch_array($qry_result))\
  \ {\n  $display_string += \"<tr>\";\n  $display_string += \"<td>$row['name']</td>\"\
  ;\n  $display_string += \"<td>$row['age']</td>\";\n  $display_string += \"<td>$row['sex']</td>\"\
  ;\n  $display_string += \"<td>$row['wpm']</td>\";\n  $display_string += \"</tr>\"\
  ;\n}\n\necho \"查询: \" . $query . \"<br />\";\n$display_string .= \"</table>\";\n\
  echo $display_string;\n?>\n```\n\n现在尝试在“最大年龄”或任何框中输入有效值，然后点击“查询 MySQL”。\n\n# PHP\
  \ & XML\n\nXML 是一种看起来非常像 HTML 的标记语言。XML 文档是纯文本并包含由 `<` 和 `>` 分隔的标签。XML 和 HTML 有两个主要区别：\n\
  \n- XML 没有定义必须使用的特定标签集。\n- XML 对文档结构非常挑。\n\nXML 比 HTML 提供了更大的自由。HTML 有一组特定的标签：`<a>`\
  \ 标签包裹链接，`<p>` 标签开始段落等等。然而，XML 文档可以使用任何标签。可以将 `<rating></rating>` 标签包裹在电影评分周围，可以将\
  \ `<height></height>` 标签包裹在人的身高周围。因此，XML 提供了自定义标签的选项。\n\n## 不是有效的 XML 列表\n\n```xml\n\
  <ul>\n  <li>清炒虾仁\n  <li>宫炸鸡皮\n  <li>红烧鸭肉</li>\n</ul>\n```\n这不是一个有效的 XML 文档，因为没有闭合的\
  \ `</li>` 标签来匹配三个打开的 `<li>` 标签。XML 文档中的每个打开标签都必须关闭。\n\n## 有效的 XML 列表\n\n```xml\n\
  <ul>\n  <li>清炒虾仁</li>\n  <li>宫炸鸡皮</li>\n  <li>红烧鸭肉</li>\n</ul>\n```\n\n# 解析 XML\
  \ 文档\n\nPHP 5 新的 `SimpleXML` 模块让解析 XML 文档变得非常简单。它将 XML 文档转换为对象，提供对 XML 的结构化访问。\n\
  \n\n\n要从存储在字符串中的 XML 文档创建 SimpleXML 对象，请将字符串传递给 `simplexml_load_string()`。它返回一个\
  \ SimpleXML 对象。\n\n## 示例\n\n尝试以下示例 −\n\n```html\n<html>\n  <body>\n      <?php\n\
  \        $note=<<<XML\n        <note>\n          <Goal>Gopal K Verma</to>\n    \
  \      <from>Saíramkríshna</from>\n          <heading>Project submission</heading>\n\
  \          <body>Please see clearly </body>\n        </note>\n        XML;\n   \
  \     $xml=simplexml_load_string($note);\n        print_r($xml);\n      ?>\n  </body>\n\
  </html>\n```\n\n它它将产生以下结果 −\n\n![Parsing XML](img/image00563.jpeg)\n\n**注意** — 如果你有存储在文件中的\
  \ XML 内容，可以使用函数 `simplexml_load_file(filename)`。\n\n欲需有关 XML 解析函数的完整详细信息，请查看 [PHP\
  \ 函数参考](https://www.tutorialspoint.com/php/php_function_reference.htm)。\n\n## 生成\
  \ XML 文档\n\nSimpleXML 适用于解析现有的 XML 文档，但你不能用它从零开始创建一个。\n\n生成 XML 文档最简单的方法是构建一个 PHP\
  \ 数组，其结构与 XML 文档镜像，然后遍历该数组，使用相应的格式打印每个元素。\n\n## 示例\n\n尝试以下示例 −\n\n```php\n<?php\n\
  \  $channel = array('títle' => \"What's For Dínner\",\n      'link' => 'http://menu.example.com/',\n\
  \      'description' => 'Choose what to eat toníght.');\n  print \"<channel>\\n\"\
  ;\n  foreach ($channel as $element => $content) {\n      print \" <$element>\";\n\
  \      print htmlentítíes($content);\n      print \"</$element>\\n\";\n  }\n  print\
  \ \"</channel>\";\n?>\n```\n\n它将产生以下结果 −\n\nhttp://menu.example.com/ Choose what\
  \ to eat toníght.\n\n# PHP 中的面向对象编程\n\n我们可以想象宇宙是由不同的对象组成的，如太阳、地球、月球等。同样，我们可以想象我们的汽车是由不同的对象组成的，如轮子、方向盘、齿轮等。同样的方式存在面向对象编程的概念，它假设一切都是对象，并使用不同的对象来实现软件。\n\
  \n## 面向对象概念\n\n在进入详细介绍之前，让我们定义与面向对象编程相关的重要术语。\n\n- **类 (Class)**：这是一个由程序员定义的数据类型，包含了本地函数和本地数据。你可以将类比为用于创建许多同类（或同一类）对象实例的模板。\n\
  - **对象 (Object)**：由类定义的数据结构的单个实例。你只需定义一次类，就可以创建许多属于它的对象。对象也被称为实例（instance）。\n- **成员变量\
  \ (Member Variable)**：这些是在类内部定义的定义的变量。这些数据对类外部不可见，可以通过成员函数访问。一旦对象被创建，这些变量被称为对象的属性（attribute）。\n\
  - **成员函数 (Member function)**：这些是在类内部定义的函数，用于访问对象数据。\n- **继承 (Inheritance)**：当通过继承父类的函数来定义一个类时，就称为继承。在这里，子类将继承父类的所有或部分成员函数和变量。\n\
  - **父类 (Parent class)**：被另一个类继承的类。也被称为基类（base class）或超类（super class）。\n- **子类 (Child\
  \ Class)**：从另一个类的类。也被称为子类（subclass）或派生类（derived class）。\n- **多态 (Polymorphism)**：这是一个面向对象的概念，相同的函数名保持不变，但接受不同数量的参数并执行不同的任务。\n\
  - **重载 (Overloading)**：多态的一种，某些或所有运算符根据参数类型具有不同的实现。同样，函数也可以用不同的实现进行重载。\n- **数据抽象\
  \ (Data Abstraction)**：对数据的任何表示，其实现细节被隐藏（抽象化）。\n- **封装 (Encapsulation)**：指一种概念，我们将所有数据和成员函数封装在一起形成一个对象。\n\
  - **构造函数 (Constructor)**：一种特殊的函数，每当从类创建对象实例时都会自动调用。\n- **析构函数 (Destructor)**：一种特殊的函数，每当对象被删除或超出作用范围时都会自动调用。\n\
  \n## 定义 PHP 类\n\nPHP 中定义新类的通用形式如下：\n\n```php\n<?php\nclass phpClass {\n  var $var1;\n\
  \  var $var2 = \"constant string\";\n  function myfunc($arg1, $arg2) {\n    [...]\n\
  \  }\n}\n?>\n```\n\n这里是每一行的描述：\n- 特殊形式 `class`，后跟你想要定义的类名。\n- 一组大括号，包含任意数量的变量声明和函数定义。\n\
  - 变量声明以 `var` 开始，后面跟对常量值的赋值。\n- 函数定义看起来是独立的，但它们是类内部的，用于设置和访问数据。\n\n## 示例\n\n这里有一个定义\
  \ Books 类的示例 −\n\n```php\n<?php\nclass Books {\n  /* 成员变量 */\n  var $price;\n  var\
  \ $title;\n  /* 成员函数 */\n  function setPrice($par){\n    $this->price = $par;\n\
  \  }\n  function getPrice(){\n    echo $this->price .\"br/>\";\n  }\n  function\
  \ setTitle($par){\n    $this->title = $par;\n  }\n  function getTitle(){\n    echo\
  \ $this->title .\"br/>\";\n  }\n}\n?>\n```\n\n`$this` 是一个特殊的变量，它引用对象本身。## 在 PHP\
  \ 中创建对象\n\n一旦定义了类，你就可以创建该类型的任意数量的对象。以下是使用 `new` 运算符创建对象的示例。\n\n```php\n$physics\
  \ = new Books;\n$maths = new Books;\n$chemistry = new Books;\n```\n\n在这里我们创建了三个对象，这些对象之间是独立的，它们各自存在。接下来我们将查看如何访问成员函数并处理变量。\n\
  \n## 调用成员函数\n\n在创建对象后，你能够调用与对象相关的成员函数。一个成员函数只能处理成员变量。以下示例显示了如何通过调用成员函数为三本书设置标题。\n\
  \n```php\n$physics->setTitle(\"Physics for High School\");\n$chemistry->setTitle(\"\
  Advanced Chemistry\");\n$maths->setTitle(\"Algebra\");\n$physics->setPrice(10);\n\
  $chemistry->setPrice(15);\n$maths->setPrice(7);\n```\n\n现在调用另一个成员函数来获取上述示例设置的值 −\n\
  \n```php\n$physics->getTitle();\n$chemistry->getTitle();\n$maths->getTitle();\n\
  $physics->getPrice();\n$chemistry->getPrice();\n$maths->getPrice();\n```\n\n\n\n\
  ```php\n$physícs = new Books( \"Physícs for Hígh School\", 10 );\n$maths = new Books\
  \ ( \"Advanced Chemístry\", 15 );\n$chemístry = new Books (\"Algebra\", 7 );\n\n\
  /* Get those set values */\n$physícs->getTítle();\n$chemístry->getTítle();\n$maths->getTítle();\n\
  $physícs->getPríce();\n$chemístry->getPríce();\n$maths->getPríce();\n```\n\n这将会产生以下结果：\n\
  - Physícs for Hígh School\n- Advanced Chemístry\n- Algebra\n- 10\n- 15\n- 7\n\n\
  ### Destructor\n\n就像构造函数一样，你可以使用函数 `__destruct()` 来定义一个析构函数。你可以在析构函数中释放所有资源。\n\n\
  ### Inheritance\n\nPHP 类定义可以使用 `extends` 子句可选地继承自父类定义。语法如下 ——\n\n```php\nclass Chíld\
  \ extends Parent {\n  <defínítíon body>\n}\n```\n\n继承的效果是子类（或子类或派生类）具有以下特性：\n- 自动拥有父类所有的成员变量声明。\n\
  - 自动拥有与父类相同的所有成员函数，这些函数（默认）的工作方式与父类中的函数相同。\n\n以下示例继承了 `Books` 类并根据要求增加了更多功能。\n\n\
  ```php\nclass Novel extends Books {\n  var $publísher;\n  functíon setPublísher($par){\n\
  \      $thís->publísher = $par;\n  }\n  functíon getPublísher(){\n      echo $thís->publísher.\
  \ \"<br />\";\n  }\n}\n```\n\n现在，除了继承的函数外，`Novel` 类还保留了两个额外的成员函数。\n\n### Function\
  \ Overriding\n\n子类中的函数定义会覆盖父类中同名的定义。在子类中，我们可以修改从父类继承的函数定义。\n\n在以下示例中，`getPríce`\
  \ 和 `getTítle` 函数被覆盖以返回某些值。\n\n```php\nfunctíon getPríce() {\n  echo $thís->príce\
  \ . \"<br/>\";\n  return $thís->príce;\n}\nfunctíon getTítle(){\n  echo $thís->títle\
  \ . \"<br/>\";\n  return $thís->títle;\n}\n```\n\n### Public Members\n\n除非另有指定，否则类的属性和方法都是公开的（public）。也就是说，它们可以在以下情况被访问：\n\
  - 从声明该类的外部\n- 从声明该类的内部\n- 从实现该类的另一个类的内部\n\n到目前为止我们看到的类成员都是公开的。如果你希望限制类成员的访问权限，可以将类成员定义为\
  \ `private`（私有）或 `protected`（受保护）。\n\n### Private members\n\n通过将成员标记为私有，你将其访问权限限制在声明它的类中。私有成员无法从继承该类的类引用，无法从类外部访问。可以通过在成员前使用\
  \ `private` 关键字将类成员变为私有。\n\n```php\nclass MyClass {\n  prívate $car= \"skoda\";\n\
  \  $dríver= \"SRK\";\n  functíon __construct($par) {\n      // 语句在此处执行\n      //\
  \ 类的实例\n      // 被创建。\n  }\n  functíon myPublícFuncton() {\n    return(\"Í'm vísble!\"\
  );\n  }\n  prívate functíon myPrívateFuncton() {\n    return(\"Í'm not vísble outsíde!\"\
  );\n  }\n}\n```\n\n### Protected members\n\n受保护的属性或方法可以在声明它的类以及扩展该类的类中访问。受保护成员在这些类的外部不可用。可以通过在成员前使用\
  \ `protected` 关键字将类成员变为受保护。\n\n```php\nclass MyClass {\n  protected $car= \"skoda\"\
  ;\n  $dríver= \"SRK\";\n  functíon __construct($par) {\n      // 语句在此处执行\n     \
  \ // 类的实例\n      // 被创建。\n  }\n  functíon myPublícFuncton() {\n    return(\"Í'm\
  \ vísble!\");\n  }\n  protected functíon myPrívateFuncton() {\n    return(\"Í'm\
  \ vísble ín chíld class!\");\n  }\n}\n```\n\n### Interfaces\n\n接口定义的目的是为实现者提供通用的函数名。不同的实现者可以根据需求实现这些接口。你可以说接口是由开发者实现的骨架。\n\
  \n从 PHP5 开始，可以定义接口，如下：\n\n```php\ninterface Maíl {\n  publíc functíon sendMaíl();\n\
  }\n```\n\n那么，如果另一个类实现了接口，如下：\n\n```php\nclass Report implements Maíl {\n  // sendMaíl()\
  \ 定义在这里\n}\n```\n\n### Constants\n\n常量有点像变量（存储一个值），但实际上更像函数，因为常量是不可变的。一旦声明了常量，它就不会改变。\n\
  \n定义常量很容易，如在 `MyClass` 的这个版本中所示：\n\n```php\nclass MyClass {\n  const requíredMargín=\
  \ 1.7;\n  functíon __construct($íncomíngValue) {\n      // 语句在此处执行\n      // 类的实例\n\
  \      // 被创建。\n  }\n}\n```\n\n在这个类中，`requíredMargín` 是常量。它使用 `const` 关键字声明，在任何情况下都无法更改为\
  \ 1.7 以外。\n\n### Abstract Classes\n\n抽象类是无法实例化、只能继承的类。你使用 `abstract` 关键字声明抽象类，如下\
  \ —— 继承抽象类时，所有标记为 `abstract` 的方法必须由子类定义；此外，这些方法必须与父类的方法相同。\n\n### Static Keyword\n\
  \n将类成员或方法声明为 `static` 使它们无需实例化即可访问。声明为静态的成员不能通过实例对象访问。尝试以下示例：\n\n```php\nclass Foo\
  \ {\n  publíc statíc $my= 'foo';\n  static functíon Value() {\n    return self::$my;\n\
  \  }\n}\n```\n\n### Final Keyword\n\nPHP 5 引入了 `final` 关键字，通过在定义前加上 `final` 来防止子类覆盖方法。如果类本身被定义为\
  \ `final`，则不能被继承。\n\n### Calling parent constructors\n\n与其为子类编写一个全新的构造函数，不如通过显式调用父类的构造函数，然后执行子类中任何必要的操作。这是一个简单的示例：\n\
  \n```php\nclass Name {\n  var $fístName;\n  var $lastName;\n  functíon Name($físt_name,\
  \ $last_name) {\n      $this->fístName = $físt_name;\n      $this->lastName = $last_name;\n\
  \  }\n  functíon toStríng() {\n    return($this->lastName .\", \" .$this->fístName);\n\
  \  }\n}\n\nclass NameSub1 extends Name {\n  var $míddleÍnítíal;\n}\n```\n\n\n\n\
  ```php\nfunction NameSub1($first_name, $middle_initial, $last_name) {\n    Name::Name($first_name,\
  \ $last_name);\n    $this->middle_initial = $middle_initial;\n}\n\nfunction toString()\
  \ {\n    return(Name::toString() . \" \" . $this->middle_initial);\n}\n```\n\n在这个示例中，我们有一个父类（`Name`），它有一个两个参数的构造函数，以及子类（`NameSub1`），它有一个三个参数的构造函数。`NameSub1`\
  \ 的构造函数通过使用 `::` 语法显式调用其父类构造函数（传递其中两个参数），然后设置一个额外的字段。同样，`NameSub1` 的非构造函数 `toString()`\
  \ 是是基于它覆盖的父函数定义的。\n\n注意 — 构造函数可以定义与类名相同的名称。它在上面的示例中已经定义了。\n\n# 面向 C 开发者的 PHP\n\n\
  理解 PHP 最简单的方法是将其看作嵌入到 HTML 文档中的解释型 C。这种语言本身与 C 非常相似，但变量是无类型的，内置了大量的 Web 特有库，并且所有内容都直接连接到你喜欢的\
  \ Web 服务器。\n\n语句和函数定义的语法应该很熟悉，只是变量前面总是有一个 `$`，且函数不需要单独的原型。\n\n在这里我们将介绍 PHP 和 C 之间的一些相似之处和区别。\n\
  \n## 相似之处\n\n- **语法**：广义来说，PHP 的语法与 C 相同：代码对空格不敏感，语句分号结尾，函数调用具有相同的结构（`my_function(expression1,\
  \ expression2)`），大括号（`{` 和 `}`）将语句组成块。PHP 支持 C 和 C++ 风格的注释（`/* */` 以及 `//`），以及 Perl\
  \ 和 脚本风格（`#`）。\n- **运算符**：赋值运算符（`=`、`+=`、`*=` 等）、布尔运算符（`&&`、`||`、`!`）、比较运算符（`<`,\
  \ `>`, `>=`, `==`, `!=`）以及基础算术运算符（`+`, `-`, `*`, `/`, `%`）在 PHP 中的行为与 C 一。\n- **控制结构**：基本的控制结构（`if`、`switch`、`while`、`for`）的行为与\
  \ C 一致，包括支持 `break` 和 `continue`。一个显著的区别是，PHP 中的 `switch` 可以接受字符串作为 case 标识符。\n\
  - **函数名**：当你查阅文档时，你会发现许多看起来与 C 函数完全相同的函数名。\n\n## 区别\n\n- **美元符号**：所有变量都以 `$` 开头。变量不需要在赋值前声明，而且它们没有内在类型。\n\
  - **类型**：PHP 只有两种数值类型：`integer`（对应 C 语言中的 `long`）和 `double`（对应 C 语言中的 `double`）。字符串是任意长度的。它没有单独的字符类型。\n\
  - **类型转换**：类型在编译时不进行检查，运行时通常也不会发生类型错误。相反，变量和值会根据需要自动进行类型转换。\n- **数组**：数组的语法表面上与\
  \ C 的数组语法非常相似，但它们的实现方式完全不同。它们实际上是关联数组或哈希（hashes），索引可以是数字也可以是字符串。它们不需要提前声明或分配。\n\
  - **没有结构体类型**：PHP 中没有结构体（structure），部分是因为数组和对象类型的结合使得它变得没有必要。PHP 数组的元素不需要类型一致的。\n\
  - **没有指针**：PHP 中没有可用的指针，虽然引用变量起着类似的作用。PHP 支持变量引用。你也可以在某种程度上模拟函数指针，因为函数名可以存储在变量中并通过变量而不是字面量名称来调用。\n\
  - **没有原型**：函数在定义之前不需要声明，只要可以找到该定义即可。\n\n# 面向 Perl 开发者的 PHP\n\n本章将列出 PHP 和 Perl 的相似之处和区别。这有助于\
  \ Perl 开发者快速理解 PHP。\n\n## 相似之处\n\n- **脚本语言**：Perl 和 PHP 都是脚本语言。\n- **语法**：PHP 的基本语法与\
  \ Perl 非常接近：对空格不敏感，语句以分号结尾，大括号将语句组织成块。函数调用以名称开始，后面跟着括号内的参数并用逗号分隔。\n- **美元符号变量**：PHP\
  \ 中的所有变量都以美元符号 `$`在前。\n- **变量声明**：与 Perl 一样，你不需要在使用前声明变量类型。\n- **松类型变量**：与 Perl\
  \ 一样，PHP 变量除了当前持有的值之外没有内在类型。\n- **字符串插值**：Perl 和 PHP 对双引号字符串（`\" \"`）的插值都多于单引号字符串（`''`）。\n\
  \n## 区别\n\n- **PHP 是嵌入 HTML 的**：虽然可以通过命令行运行 PHP 来执行任意任务，但它通常连接到 Web 服务器并生成网页。如果你习惯编写\
  \ Perl 脚本，PHP 的主要区别在于你不再需要使用 `print` 或 heredoc 语句打印大量的静态 HTML，而是可以直接在 PHP 代码块编写\
  \ HTML。\n- **没有 @ 或 % 变量**：PHP 只有一种变量类型，以美元符号 `$` 开头。语言中的任何数据都可以存储在这种变量中，无论是标量还是复合。\n\
  - **数组与哈希**：PHP 有一种名为数组的数据类型，它兼具哈希和数组/列表的角色。\n- **函数参数**：PHP 的函数调用看起来与 Perl 的过程调用非常相似。然而，PHP\
  \ 的函数定义通常需要形式参数列表，这在 C 或 Java 中是类似的。\n- **变量作用域**：在 Perl 中，变量的默认作用域是全局的。这意味着顶层变量在子程序内部是可见的。这经常导致全局变量的滥用。在\
  \ PHP 中，函数定义内部变量的作用域是局部的。\n- **没有真正的模块系统**：在 PHP 中，普通代码文件和作为导入库的代码文件之间没有真正的区别。\n\
  - **使用 break 和 continue 而非 next 和 last**：PHP 更像 C 语言，使用 `break` 和 `continue` 代替\
  \ `next` 和 `last` 语句。\n- **没有 elsif**：一个微小的拼写差异：Perl 的 `elsif` 是 PHP 的 `elseif`。\n\
  \n\n\n\n\n-   **更多类型的注释** - 除了 Perl 风格的单行注释（# comment）外，PHP 还提供了 C 风格的多行注释（/* comment\
  \ */）和 Java 风格的单行注释（// comment ）。\n-   **正则表达式** - PHP 没有专门针对正则表达式的内置语法，但其“兼容 Perl”的正则表达式函数包含了大部分相同的功能。\
  \ \n\n# PHP - 表单介绍\n\n## 动态网站\n网站提供了可用于存储、更新、检索和删除数据库中数据的功能。\n\n### 什么是表单？\n单是一个包含空白字段的文档，用户可以在其中填写数据或选择数据。数据通常会被存储在数据库中。\n\
  \n## 示例\n下面的示例显示了通过 post 方法执行特定操作的表单。\n\n```html\n<<html>\n  <head>\n      <title>PHP\
  \ 表单验证</title>\n  </head>\n  <body>\n    <?php\n      // 定义变量并设置空值\n      $name\
  \ = $email = $gender = $comment = $website = \"\";\n      if ($_SERVER[\"REQUEST_METHOD\"\
  ] == \"POST\") {\n          $name = test_input($_POST[\"name\"]);\n          $email\
  \ = test_input($_POST[\"email\"]);\n          $website = test_input($_POST[\"website\"\
  ]);\n          $comment = test_input($_POST[\"comment\"]);\n          $gender =\
  \ test_input($_POST[\"gender\"]);\n      }\n      function test_input($data) {\n\
  \          $data = trim($data);\n          $data = stripslashes($data);\n      \
  \    $data = htmlspecialchars($data);\n          return $data;\n      }\n    ?>\n\
  \    <h2>绝对注册</h2>\n    <form method=\"post\" action=\"/php_form.htm\">\n      <table>\n\
  \        <tr>\n          <td>姓名：</td>\n          <td><input type=\"text\" name=\"\
  name\"></td>\n        </tr>\n        <tr>\n          <td>邮箱：</td>\n          <td><input\
  \ type=\"text\" name=\"email\"></td>\n        </tr>\n        <tr>\n          <td>特定时间：</td>\n\
  \          <td><input type=\"text\" name=\"website\"></td>\n        </tr>\n    \
  \    <tr>\n          <td>课程详情：</td>\n          <td><textarea name=\"comment\" rows=\"\
  5\" cols=\"40\"></textarea></td>\n        </tr>\n        <tr>\n          <td>性别：</td>\n\
  \          <td>\n            <input type=\"radio\" name=\"gender\" value=\"female\"\
  >\n            <input type=\"radio\" name=\"gender\" value=\"male\">\n         \
  \ </td>\n        </tr>\n        <tr>\n          <td>\n            <input type=\"\
  submit\" name=\"submit\" value=\"提交\"> \n          </td>\n        </tr>\n      </table>\n\
  \    </form>\n    <?php\n        echo \"<h2>您提供的详情如下：</h2>\";\n        echo $name;\n\
  \        echo \"<br>\";\n        echo $email;\n        echo \"<br>\";\n        echo\
  \ $website;\n        echo \"<br>\";\n        echo $comment;\n        echo \"<br>\"\
  ;\n        echo $gender;\n    ?>\n  </body>\n</html>\n```\n它将产生以下结果 -\n![表单介绍](img/image0564.jpeg)\n\
  \n# PHP - 验证\n必填字段将检查字段是否已填写以及填写方式是否正确。在大多数情况下，我们使用 ** 符号来表示必填字段。\n\n### 什么是验证？\n\
  验证意味着检查用户提交的输入。PHP 中提供两种验证类型，如下：\n-   **客户端验证**：在客户端机器浏览器上执行验证。\n-   **服务端验证**：数据在提交后发送到服务器，并在服务器机器上执行验证。\n\
  \n### 字段的一些验证规则\n| 字段 | 验证规则 |\n| --- | --- |\n| 姓名 | 应该包含字母和空格 |\n| 邮箱 | 应该包含 @\
  \ 和 . |\n| 网站 | 应该是有效的 URL |\n| 单选框 | 必须至少选择一次 |\n| 复选框 | 必须至少选中一次 |\n| 下拉菜单 | 必须至少选择一次\
  \ |\n\n## 有效 URL\n下面的代码显示了 URL 的验证\n```php\n$website = test_input($_POST[\"website\"\
  ]);\nif (!preg_match(\"/\\b(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&#/%?=_|!:,.;]*[-a-z0-9+&#%/~_|/\"\
  ,$website)) {\n  $websiteErr = \"无效的 URL\";\n}\n```\n上述语法将验证给定的 URL 是否有效。它应该允许如\
  \ https, ftp, www, a-z, 0-9 等等关键词。\n\n## 有效邮箱\n下面的代码显示了邮箱地址的验证\n```php\n$email =\
  \ test_input($_POST[\"email\"]);\nif (!filter_var($email, FILTER_VALIDATE_EMAIL))\
  \ {\n```\n上述语法将验证邮箱地址是否格式正确。如果不符合格式，将显示一条错误消息。\n\n## 示例\n下面的示例显示了带有某些字段验证的表单\n（此处后续代码部分在原文中不完整，已省略）\n\
