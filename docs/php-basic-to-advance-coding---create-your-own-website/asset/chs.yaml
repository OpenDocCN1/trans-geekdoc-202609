  \ | 2016-12-05T01:08:23Z |\n\n\n\n\n\n若要完整学习 AJAX，请参考 [AJAX 教程](https://www.tutorialspoint.com/ajax/index.htm)。\n\
  \n# PHP 和 AJAX 示例\n\n为了清晰地演示如何使用 Ajax 和 PHP 从数据库中获取信息是多么简单，我们将动态构建 MySQL 查询并将结果显示在\
  \ \"ajax.html\" 上。在继续之前，让我们先做一些基础准备工作。使用以下命令创建一个表。\n\n**注意** − 我们假设你拥有足够的权限执行以下\
  \ MySQL 操作。\n\n```sql\nCREATE TABLE `ajax_example` (\n  `name` varchar(50) NOT NULL,\n\
  \  `age` int(11) NOT NULL,\n  `sex` varchar(1) NOT NULL,\n  `wpm` int(11) NOT NULL,\n\
  \  PRIMARY KEY (`name`)\n)\n```\n\n现在，使用以下 SQL 语句将以下数据转储到该表中。\n\n```sql\nINSERT\
  \ INTO `ajax_example` VALUES ('Jerry', 120, 'm', 20);\nINSERT INTO `ajax_example`\
  \ VALUES ('Regís', 75, 'm', 44);\nINSERT INTO `ajax_example` VALUES ('Frank', 45,\
  \ 'm', 87);\nINSERT INTO `ajax_example` VALUES ('Jíll', 22, 'f', 72);\nINSERT INTO\
  \ `ajax_example` VALUES ('Tracy', 27, 'f', 0);\nINSERT INTO `ajax_example` VALUES\
  \ ('Julíe', 35, 'f', 90);\n```\n\n## 客户端 HTML 文件\n\n现在让我们创建客户端 HTML 文件，即 ajax.html，它将包含以下代码：\n\
  \n```html\n<html>\n  <body>\n      <script language=\"javascript\" type=\"text/javascript\"\
  >\n        <!--\n          // 浏览器支持代码\n          function ajaxFunction() {\n   \
  \         var ajaxRequest;  // 让 Ajax 成为可能的变量\n            try {\n             \
