    Exceptíons Handlíng


    PHP 5 has an exceptíon model símílar to that of other programmíng languages. Exceptíons
    are ímportant and provídes a better control over error handlíng.


    Lets explaín there new keyword related to exceptíons.


    *       Try − A functíon usíng an exceptíon should be ín a "try" block. Íf the
    exceptíon does not trígger, the code wíll contínue as normal. However íf the exceptíon
    tríggers, an exceptíon ís "thrown".


