    `error_report( [level] )`\n\n以下是创建错误错误处理器的方法：\n\n```php\n<?php\nfunction handleError($errno,\
    \ $errstr, $file, $line) {\n    echo \"<b>Error:</b> [$errno] $errstr - $file:$line\"\
    ;\n    echo \"<br />\";\n    echo \"Terminating PHP\";\n    die();\n}\n```\n\n\
    一旦你定义了自定义处理器，就不需要使用 PHP 内置库 `set_error_handler` 来设置它。现在让我们通过调用一个不存在的函数来检查示例。\n\
    \n```php\n<?php\nerror_report( E_ERROR );\nfunction handleError($errno, $errstr,\
    \ $file, $line) {\n    echo \"<b>Error:</b> [$errno] $errstr - $file:$line\";\n\
    \    echo \"<br />\";\n    echo \"Terminating PHP\";\n    die();\n}\nset_error_handler(\"\
    handleError\");\n// trigger\n```\nPHP 5 拥有一个与其他编程语言相似的异常模型。异常是重要的，并为对错误处理提供了更好的控制。\n\
    \n让我们解释与异常相关的关键字：\n\n- **Try**：使用异常的函数应该放在 `try` 块中。如果异常没有触发，代码将恢复正常执行。但如果触发了异常，异常就会被“抛出”。\n\
    - **Throw**：这是触发异常的方式。每个 `throw` 必须至少对应一个 `catch`。\n- **Catch**：`catch` 块获取异常并创建一个包含异常信息的对象。\n\
    \n当异常被抛出时，语句后面的代码不会执行，PHP 将尝试寻找第一个匹配的 `catch` 块。如果异常未被捕获，将抛出带有“Uncaught Exception”的\
    \ PHP 致命错误。\n\n- 异常可以在 PHP 中被抛出和捕获。代码可以被 `try` 块包裹。\n- 每个 `try` 必须至少有一个对应的 `catch`\
    \ 块。可以使用多个 `catch` 块来捕获不同类的异常。\n- 异常可以在 `catch` 块中抛出（或重新抛出）。\n\n### 示例\n以下是代码，将此代码复制并粘贴到文件中验证结果。\n\
    \n```php\n<?php\ntry {\n    $error = 'Always throw this error';\n    throw new\
    \ Exception($error);\n    // 异常后的代码不会执行。\n    echo 'Never executed';\n} catch\
    \ (Exception $e) {\n    echo 'Caught exception: ', $e->getMessage(), \"\\n\";\n\
    }\n// 继续执行\necho 'Hello World';\n?>\n```\n\n在上面的示例中，使用 `$e->getMessage()` 函数来获取错误消息。`Exception`\
    \ 类中可以使用以下函数：\n\n- `getMessage()`：异常消息\n- `getCode()`：异常代码\n- `getFile()`：源文件名\n\
    - `getLine()`：源行号\n- `getTrace()`：`backtrace()` 的数组\n- `getTraceAsString()`：格式化后的轨迹回溯字符串\n\
    \n### 创建自定义异常处理器\n你可以定义自己的自定义异常处理器。使用以下函数来设置用户定义的异常处理器函数：\n\n`string set_error_handler\
    \ (callback $exception_handler)`\n\n这里 `exception_handler` 是当发生未捕获的异常时要调用的函数名。该函数必须在调用\
    \ `set_error_handler()` 之前定义。\n\n### 示例\n```php\n<?php\nfunction exception_handler($exception)\
    \ {\n    echo \"Uncaught exception: \", $exception->getMessage(), \"\\n\";\n}\n\
    set_error_handler('exception_handler');\nthrow new Exception('Uncaught Exception');\n\
    echo \"Not Executed\\n\";\n?>\n```\n\n# PHP - 调试\n\n程序很少第一次就能正常工作。程序中可能发生许多导致\
    \ 解释器生成错误消息的情况。你可以选择错误消息的去向。消息可以随输出发送到浏览器。\n\n若要在浏览器中显示错误，将 `display_errors` 指令设置为\
    \ `On`。要将错误发送到服务器日志，将 `log_errors` 设置为 `On`。如果你希望在两个地方显示，可以将两者都设置为 `On`。\n\nPHP\
    \ 定义了一些常量，可以使用它们设置 `error_report` 的值以便报告某些类型：`E_ALL`（除严格的所有错误）、`E_PARSE`（解析错误）、`E_ERROR`（致命错误）、`E_WARNING`（警告）、`E_NOTICE`（通知）。\n\
    \n在编写 PHP 程序时，使用感知 PHP 的编辑器是一个好主意。编辑器的特殊功能之一是语法高亮。它根据这些部分的改变它们的颜色。例如，字符串是粉色的，关键字如\
    \ `if` 和 `while` 是蓝色的，注释是灰色的，变量是黑色的。\n\n另一个功能是引号和括号匹配，有助于确保引号和括号是平衡的。当你输入一个结束符\
    \ `}` 时，编辑器会高亮与之匹配的起始符 `{`。\n\n调试程序时，需要验证以下点：\n\n- **缺少分号**：每个 PHP 语句都以分号（`;`）结束。PHP\
    \ 直到遇到分号才停止读取。如果你漏掉分号，PHP 将继续读取下一行的语句。\n- **不等号**：当你在比较语句中询问两个值是否相等时，你需要两个等号 (`==`）。使用一个等号是一个常见错误。\n\
    - **变量拼写错误**：如果你拼错了变量名，PHP 会将其视为新变量。记住：对 PHP 来说，`$test` 和 `$Test` 不是同一个变量。\n-\
    \ **缺少美元符号**：变量名中缺少美元符号很难发现，但它通常会产生错误消息，让你知道去哪里寻找问题。\n- **引号困扰**：你可能会有太多、太少或类型错误的引号。\n\
    - **缺少括号和花括号**：它们应该成对出现。\n- **数组索引**：所有数组都应该从 0 开始，而不是 1。\n\n"
