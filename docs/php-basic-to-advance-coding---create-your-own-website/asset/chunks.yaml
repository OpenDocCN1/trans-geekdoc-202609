    \ type=\"text\" name=\"course\">\n            <span class=\"error\"><?php echo\
    \ $websíteErr; ?></span>\n          </td>\n        </tr>\n        <tr>\n     \
    \     <td>课程：</td>\n          <td><textarea name=\"class\" rows=\"5\" cols=\"\
    40\"></textarea></td>\n        </tr>\n        <tr>\n          <td>性别：</td>\n \
