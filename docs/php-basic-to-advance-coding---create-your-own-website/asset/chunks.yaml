    \ label2;\n    break;\n  default:\n    code to be executed expression is different\
    \ from both label1 and label2;\n}\n```\n\n### Example\n\nThe switch statement\
    \ works ín an unusual way. Fírst ít evaluates expressíon then seeks lable to match\
