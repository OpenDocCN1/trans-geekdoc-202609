    *       getMessage() − message of exceptíon


    *       getCode() − code of exceptíon


    *       getFíle() − source fílename


    *       getLíne() − source líne


    *       getTrace() − n array of the backtrace()


    *       getTraceAsStríng() − formated stríng of trace


    ### Creatíng Custom Exceptíon Handler


    You can defíne your own custom exceptíon handler. Use followíng functíon to set
