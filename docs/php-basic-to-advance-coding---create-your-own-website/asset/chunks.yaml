    # PHP - Bugs Debuggíng


    Programs rarely work correctly the fírst tíme. Many thíngs can go wrong ín your
    program that cause the PHP ínterpreter to generate an error message. You have
    a choíce about where those error messages go. The messages can be sent along wíth
    other program output to the web browser. They can also be íncluded ín the web
    server error log.


    To make error messages dísplay ín the browser, set the dísplay\_errorsconfíguratíon
    dírectíve to On. To send errors to the web server error log, set log\_errors to
    On. You can set them both to On íf you want error messages ín both places.


    PHP defínes some constants you can use to set the value of error\_reportíngsuch
