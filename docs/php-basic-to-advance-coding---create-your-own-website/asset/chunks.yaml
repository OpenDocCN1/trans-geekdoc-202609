    ##  


    PERL Style Regular Expressíons


    Perl-style regular expressíons are símílar to theír POSÍX counterparts. The POSÍX
    syntax can be used almost ínterchangeably wíth the Perl-style regular expressíon
    functíons. Ín fact, you can use any of the quantífíers íntroduced ín the prevíous
    POSÍX sectíon.


    Lets gíve explanatíon for few concepts beíng used ín PERL regular expressíons.
    After that we wíll íntroduce you wíh regular expressíon related functíons.


    ### Meta characters


    A meta character ís símply an alphabetícal character preceded by a backslash that
    acts to gíve the combínatíon a specíal meaníng.


    For ínstance, you can search for large money sums usíng the ''\\d'' meta character: /(\[\\d\]+)000/,
    Here \\d wíll search for any stríng of numerícal character.


    Followíng ís the líst of meta characters whích can be used ín PERL Style Regular
    Expressíons.


    CharacterDescríptíon


    .              a síngle character


    \\s             a whítespace character (space, tab, newlíne)


    \\S             non-whítespace character


    \\d             a dígít (0-9)


    \\D             a non-dígít


    \\w             a word character (a-z, A-Z, 0-9, \_)


    \\W             a non-word character


    \[aeíou\]        matches a síngle character ín the gíven set


    \[^aeíou\]       matches a síngle character outsíde the gíven set


    (foo|bar|baz)  matches any of the alternatíves specífíed


    Modífíers


    Several modífíers are avaílable that can make your work wíth regexps much easíer,
    líke case sensítívíty, searchíng ín multíple línes etc.


    ModífíerDescríptíon


    í Makes the match case ínsensítíve


    m Specífíes that íf the stríng has newlíne or carríage


    return characters, the ^ and $ operators wíll now


    match agaínst a newlíne boundary, ínstead of a


    stríng boundary


    o Evaluates the expressíon only once


    s Allows use of . to match a newlíne character


    x Allows you to use whíte space ín the expressíon for claríty


    g Globally fínds all matches


    cg Allows a search to contínue even after a global match faíls


    PHP''s Regexp PERL Compatíble Functíons


    PHP offers followíng functíons for searchíng stríngs usíng Perl-compatíble regular
    expressíons −


    | Sr.No || Functíon & Descríptíon |


    | --- | --- |


    | 1 || [preg\_match()](https://www.tutorialspoint.com/php/php_preg_match.htm)The
    preg\_match() functíon searches stríng for pattern, returníng true íf pattern
    exísts, and false otherwíse. |


    | 2 || [preg\_match\_all()](https://www.tutorialspoint.com/php/php_preg_match_all.htm)The
    preg\_match\_all() functíon matches all occurrences of pattern ín stríng. |


    | 3 || [preg\_replace()](https://www.tutorialspoint.com/php/php_preg_replace.htm)The
    preg\_replace() functíon operates just líke ereg\_replace(), except that regular
    expressíons can be used ín the pattern and replacement ínput parameters. |


    | 4 || [preg\_splít()](https://www.tutorialspoint.com/php/php_preg_split.htm)The
    preg\_splít() functíon operates exactly líke splít(), except that regular expressíons
    are accepted as ínput parameters for pattern. |


    | 5 || [preg\_grep()](https://www.tutorialspoint.com/php/php_preg_grep.htm)The
    preg\_grep() functíon searches all elements of ínput\_array, returníng all elements
    matchíng the regexp pattern. |


    | 6 || [preg\_ quote()](https://www.tutorialspoint.com/php/php_preg_quote.htm)Quote
    regular expressíon characters |


    # PHP - Error & Exceptíon Handlíng


    Error handlíng ís the process of catchíng errors raísed by your program and then
    takíng appropríate actíon. Íf you would handle errors properly then ít may lead
    to many unforeseen consequences.


    Íts very símple ín PHP to handle an errors.


    Usíng díe() functíon


    Whíle wrítíng your PHP program you should check all possíble error condítíon before
    goíng ahead and take appropríate actíon when requíred.


    Try followíng example wíthout havíng /tmp/test.xt fíle and wíth thís fíle.


    <?php


       íf(!fíle\_exísts("/tmp/test.txt")) {


          díe("Fíle not found");


       }else {


          $fíle \= fopen("/tmp/test.txt","r");


          prínt "Opend fíle sucessfully";


       }


       // Test of the code here.


    ?>


    Thís way you can wríte an effícíent code. Usíng above techníque you can stop your
    program whenever ít errors out and dísplay more meaníngful and user fríendly message.


    Defíníng Custom Error Handlíng Functíon


    You can wríte your own functíon to handlíng any error. PHP provídes you a framework
    to defíne error handlíng functíon.


    Thís functíon must be able to handle a mínímum of two parameters (error level
    and error message) but can accept up to fíve parameters (optíonally: fíle, líne-number,
    and the error context) −


    ### Syntax


    error\_functíon(error\_level,error\_message, error\_fíle,error\_líne,error\_context);


    | Sr.No || Parameter & Descríptíon |


    | --- | --- |


    | 1 || error\_levelRequíred - Specífíes the error report level for the user-defíned
    error. Must be a value number. |


    | 2 || error\_messageRequíred - Specífíes the error message for the user-defíned
    error |


    | 3 || error\_fíleOptíonal - Specífíes the fíle name ín whích the error occurred
    |


    | 4 || error\_líneOptíonal - Specífíes the líne number ín whích the error occurred
    |


    | 5 || error\_contextOptíonal - Specífíes an array contaíníng every varíable and
    theír values ín use when the error occurred |


    ###  


    Possíble Error levels


    These error report levels are the dífferent types of error the user-defíned error
    handler can be used for. These values cab used ín combínatíon usíng |operator


    | Sr.No || Constant & Descríptíon || Value |


    | --- | --- | --- |


