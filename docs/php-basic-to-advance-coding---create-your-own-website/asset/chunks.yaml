  fmt: "\n- **More kinds of comments** - In addition to Perl-style (`#`) single-line\
    \ comments, PHP offers C-style multiline comments (`/* comment */`) and Java-style\
    \ single-line comments (`// comment`).\n- **Regular expressions** - PHP does not\
    \ have a built-in syntax specific to regular expressions, but has most of the\
    \ same functionality in its \"Perl-compatible\" regular expression functions.\
    \ \n\n# PHP - Form Introduction\n\n## Dynamic Websites\nThe Websites provide the\
    \ functionalities that can use to store, update, retrieve, and delete the data\
    \ ín a database.\n\n### What is the Form?\nA Document containing black fields,\
    \ that the user can fill the data or user can select the data. Casually the data\
    \ will store ín the data base.\n\n### Example\nBelow example shows the form with\
    \ some specific actions by post method.\n\n```html\n<html>\n  <head>\n      <title>PHP\
    \ Form Validation</title>\n  </head>\n  <body>\n    <?php\n      // define variables\
    \ and set to empty values\n      $name = $email = $gender = $comment = $website\
    \ = \"\";\n      if ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n          $name\
    \ = test_input($_POST[\"name\"]);\n          $email = test_input($_POST[\"email\"\
    ]);\n          $website = test_input($_POST[\"website\"]);\n          $comment\
    \ = test_input($_POST[\"comment\"]);\n          $gender = test_input($_POST[\"\
    gender\"]);\n      }\n      function test_input($data) {\n          $data = trim($data);\n\
    \          $data = stripslashes($data);\n          $data = htmlspecialchars($data);\n\
    \          return $data;\n      }\n    ?>\n    <h2>Absolute registration</h2>\n\
    \    <form method=\"post\" action=\"/php_form.htm\">\n      <table>\n        <tr>\n\
    \          <td>Name:</td>\n          <td><input type=\"text\" name=\"name\"></td>\n\
    \        </tr>\n        <tr>\n          <td>Email:</td>\n          <td><input\
    \ type=\"text\" name=\"email\"></td>\n        </tr>\n        <tr>\n          <td>Specific\
    \ Time:</td>\n          <td><input type=\"text\" name=\"website\"></td>\n    \
    \    </tr>\n        <tr>\n          <td>Class details:</td>\n          <td><textarea\
    \ name=\"comment\" rows=\"5\" cols=\"40\"></textarea></td>\n        </tr>\n  \
    \      <tr>\n          <td>Gender:</td>\n          <td>\n            <input type=\"\
    radio\" name=\"gender\" value=\"female\">\n            <input type=\"radio\" name=\"\
    gender\" value=\"male\">\n          </td>\n        </tr>\n        <tr>\n     \
    \     <td>\n            <input type=\"submit\" name=\"submit\" value=\"Submit\"\
    > \n          </td>\n        </tr>\n      </table>\n    </form>\n    <?php\n \
    \       echo \"<h2>Your Given details as :</h2>\";\n        echo $name;\n    \
    \    echo \"<br>\";\n        echo $email;\n        echo \"<br>\";\n        echo\
    \ $website;\n        echo \"<br>\";\n        echo $comment;\n        echo \"<br>\"\
    ;\n        echo $gender;\n    ?>\n  </body>\n</html>\n```\nIt will produce the\
    \ following result -\n![Form Introduction](Images/image0564.jpeg)\n\n# PHP - Validation\n\
    Required field will check whether the field is filled or not the proper way. Most\
    \ of cases we will use the * symbol for required field.\n\n### What is validation?\n\
    Validation means check input submitted by the user. There are two types of validation\
    \ available in PHP. They are as follows:\n- **Client-side Validation**: Validation\
    \ is performed on the client machine browsers.\n- **Server Side Validation**:\
    \ After submitted by data has sent to server and perform validation in server\
    \ machine.\n\n### Some validation rules for field\n| Field | Validation Rules\
    \ |\n| --- | --- |\n| Name | Should required letters and spaces |\n| Email | Should\
    \ required @ and . |\n| Website | Should required valid URL |\n| Radio | Must\
    \ be selectable at least once |\n| Check Box | Must be checkable at least once\
    \ |\n| Drop menu | Must be selectable at least once |\n\n## Valid URL\nBelow code\
    \ shows validation of URL\n```php\n$website = test_input($_POST[\"website\"]);\n\
    if (!preg_match(\"/\\b(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&#/%?=_|!:,.;]*[-a-z0-9+&#%/~_|/\"\
    ,$website)) {\n  $websiteErr = \"Invalid URL\";\n}\n```\nAbove syntax will verify\
    \ whether a given URL is valid or not. It should allow some keywords as https,\
    \ ftp, www, a-z, 0-9,..etc..\n\n## Valid Email\nBelow code shows validation of\
    \ Email address\n```php\n$email = test_input($_POST[\"email\"]);\nif (!filter_var($email,\
    \ FILTER_VALIDATE_EMAIL)) {\n  $emailErr = \"Invalid format and please re-enter\
    \ valid email\";\n}\n```\nAbove syntax will verify whether given Email address\
    \ is well-formed or not. If it is not, it will show an error message.\n\n### Example\n\
    Example below shows the form with required field validation\n```html\n<html>\n\
    \  <head>\n    <style>\n      .error {color: #FF0000;}\n    </style>\n  </head>\n\
    \  <body>\n    <?php\n      // define variables and set to empty values\n    \
    \  $nameErr = $emailErr = $genderErr = $websiteErr = \"\";\n      $name = $email\
    \ = $gender = $comment = $website = \"\";\n      if ($_SERVER[\"REQUEST_METHOD\"\
    ] == \"POST\") {\n          if (empty($_POST[\"name\"])) {\n              $nameErr\
    \ = \"Name is required\";\n          } else {\n              $name = test_input($_POST[\"\
    name\"]);\n          }\n          if (empty($_POST[\"email\"])) {\n          \
    \    $emailErr = \"Email is required\";\n          } else {\n              $email\
    \ = test_input($_POST[\"email\"]);\n              // check email is well-formed\n\
    \              if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {\n           \
    \       $emailErr = \"Invalid email\";\n              }\n          }\n       \
    \   if (empty($_POST[\"website\"])) {\n              $website = \"\";\n      \
    \    } else {\n              $website = test_input($_POST[\"website\"]);\n   \
    \       }\n          if (empty($_POST[\"comment\"])) {\n              $comment\
    \ = \"\";\n          } else {\n              $comment = test_input($_POST[\"comment\"\
    ]);\n          }\n          if (empty($_POST[\"gender\"])) {\n              $genderErr\
    \ = \"Gender is required\";\n          } else {\n              $gender = test_input($_POST[\"\
    gender\"]);\n          }\n      }\n      function test_input($data) {\n      \
    \    $data = trim($data);\n          $data = stripslashes($data);\n          $data\
    \ = htmlspecialchars($data);\n          return $data;\n      }\n    ?>\n    <h2>Absolute\
    \ classes registration</h2>\n    <p><span class=\"error\">* required field.</span></p>\n\
    \    <form method=\"post\" action=\"<?php \n      echo htmlspecialchars($_SERVER[\"\
    PHP_SELF\"]);?>\">\n      <table>\n        <tr>\n          <td>Name:</td>\n  \
    \        <td><input type=\"text\" name=\"name\"><span class=\"error\">*<?php echo\
    \ $nameErr; ?></span></td>\n        </tr>\n        <tr>\n          <td>Email:</td>\n\
    \          <td><input type=\"text\" name=\"email\"><span class=\"error\">*<?php\
    \ echo $emailErr; ?></span></td>\n        </tr>\n        <tr>\n          <td>Time:</td>\n\
    \          <td><input type=\"text\" name=\"website\"><span class=\"error\">*<?php\
    \ echo $websiteErr; ?></span></td>\n        </tr>\n        <tr>\n          <td>Classes:</td>\n\
    \          <td><textarea name=\"comment\" rows=\"5\" cols=\"40\"></textarea></td>\n\
    \        </tr>\n      </table>\n    </form>\n  </body>\n</html>\n```\n"
  trans: "\n\n-   **更多类型的注释** - 除了 Perl 风格的单行注释（# comment）外，PHP 还提供了 C 风格的多行注释（/*\
    \ comment */）和 Java 风格的单行注释（// comment ）。\n-   **正则表达式** - PHP 没有专门针对正则表达式的内置语法，但其“兼容\
    \ Perl”的正则表达式函数包含了大部分相同的功能。 \n\n# PHP - 表单介绍\n\n## 动态网站\n网站提供了可用于存储、更新、检索和删除数据库中数据的功能。\n\
    \n### 什么是表单？\n单是一个包含空白字段的文档，用户可以在其中填写数据或选择数据。数据通常会被存储在数据库中。\n\n### 示例\n下面的示例显示了通过\
    \ post 方法执行特定操作的表单。\n\n```html\n<<html>\n  <head>\n      <title>PHP 表单验证</title>\n\
    \  </head>\n  <body>\n    <?php\n      // 定义变量并设置空值\n      $name = $email = $gender\
    \ = $comment = $website = \"\";\n      if ($_SERVER[\"REQUEST_METHOD\"] == \"\
    POST\") {\n          $name = test_input($_POST[\"name\"]);\n          $email =\
    \ test_input($_POST[\"email\"]);\n          $website = test_input($_POST[\"website\"\
    ]);\n          $comment = test_input($_POST[\"comment\"]);\n          $gender\
    \ = test_input($_POST[\"gender\"]);\n      }\n      function test_input($data)\
    \ {\n          $data = trim($data);\n          $data = stripslashes($data);\n\
    \          $data = htmlspecialchars($data);\n          return $data;\n      }\n\
    \    ?>\n    <h2>绝对注册</h2>\n    <form method=\"post\" action=\"/php_form.htm\"\
    >\n      <table>\n        <tr>\n          <td>姓名：</td>\n          <td><input type=\"\
    text\" name=\"name\"></td>\n        </tr>\n        <tr>\n          <td>邮箱：</td>\n\
    \          <td><input type=\"text\" name=\"email\"></td>\n        </tr>\n    \
    \    <tr>\n          <td>特定时间：</td>\n          <td><input type=\"text\" name=\"\
    website\"></td>\n        </tr>\n        <tr>\n          <td>课程详情：</td>\n     \
    \     <td><textarea name=\"comment\" rows=\"5\" cols=\"40\"></textarea></td>\n\
    \        </tr>\n        <tr>\n          <td>性别：</td>\n          <td>\n       \
    \     <input type=\"radio\" name=\"gender\" value=\"female\">\n            <input\
    \ type=\"radio\" name=\"gender\" value=\"male\">\n          </td>\n        </tr>\n\
    \        <tr>\n          <td>\n            <input type=\"submit\" name=\"submit\"\
    \ value=\"提交\"> \n          </td>\n        </tr>\n      </table>\n    </form>\n\
    \    <?php\n        echo \"<h2>您提供的详情如下：</h2>\";\n        echo $name;\n      \
    \  echo \"<br>\";\n        echo $email;\n        echo \"<br>\";\n        echo\
    \ $website;\n        echo \"<br>\";\n        echo $comment;\n        echo \"<br>\"\
    ;\n        echo $gender;\n    ?>\n  </body>\n</html>\n```\n它将产生以下结果 -\n![表单介绍](img/image0564.jpeg)\n\
    \n# PHP - 验证\n必填字段将检查字段是否已填写以及填写方式是否正确。在大多数情况下，我们使用 ** 符号来表示必填字段。\n\n### 什么是验证？\n\
    验证意味着检查用户提交的输入。PHP 中提供两种验证类型，如下：\n-   **客户端验证**：在客户端机器浏览器上执行验证。\n-   **服务端验证**：数据在提交后发送到服务器，并在服务器机器上执行验证。\n\
    \n### 字段的一些验证规则\n| 字段 | 验证规则 |\n| --- | --- |\n| 姓名 | 应该包含字母和空格 |\n| 邮箱 | 应该包含\
    \ @ 和 . |\n| 网站 | 应该是有效的 URL |\n| 单选框 | 必须至少选择一次 |\n| 复选框 | 必须至少选中一次 |\n| 下拉菜单\
    \ | 必须至少选择一次 |\n\n## 有效 URL\n下面的代码显示了 URL 的验证\n```php\n$website = test_input($_POST[\"\
    website\"]);\nif (!preg_match(\"/\\b(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&#/%?=_|!:,.;]*[-a-z0-9+&#%/~_|/\"\
    ,$website)) {\n  $websiteErr = \"无效的 URL\";\n}\n```\n上述语法将验证给定的 URL 是否有效。它应该允许如\
    \ https, ftp, www, a-z, 0-9 等等关键词。\n\n## 有效邮箱\n下面的代码显示了邮箱地址的验证\n```php\n$email\
    \ = test_input($_POST[\"email\"]);\nif (!filter_var($email, FILTER_VALIDATE_EMAIL))\
    \ {\n```\n上述语法将验证邮箱地址是否格式正确。如果不符合格式，将显示一条错误消息。\n\n### 示例\n下面的示例显示了带有某些字段验证的表单\n\
    （此处后续代码部分在原文中不完整，已省略）\n"
