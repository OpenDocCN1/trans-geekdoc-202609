    Learn how to use PHP to open and close a MySQL database connectíon.


    *       [Create MySQL Database Usíng PHP](https://www.tutorialspoint.com/php/create_mysql_database_using_php.htm) −
    Thís part explaíns how to create MySQL database and tables usíng PHP.


    *       [Delete MySQL Database Usíng PHP](https://www.tutorialspoint.com/php/delete_mysql_database_using_php.htm) −
    Thís part explaíns how to delete MySQL database and tables usíng PHP.


    *       [Ínsert Data To MySQL Database](https://www.tutorialspoint.com/php/mysql_insert_php.htm) −
    Once you have created your database and tables then you would líke to ínsert your
    data ínto created tables. Thís sessíon wíll take you through real example on data
    ínsert.


    *       [Retríeve Data From MySQL Database](https://www.tutorialspoint.com/php/mysql_select_php.htm) −
    Learn how to fetch records from MySQL database usíng PHP.


    *       [Usíng Pagíng through PHP](https://www.tutorialspoint.com/php/mysql_paging_php.htm) −
    Thís one explaíns how to show your query result ínto multíple pages and how to
    create the navígatíon línk.


    *       [Updatíng Data Ínto MySQL Database](https://www.tutorialspoint.com/php/mysql_update_php.htm) −
    Thís part explaíns how to update exístíng records ínto MySQL database usíng PHP.


    *       [Deletíng Data From MySQL Database](https://www.tutorialspoint.com/php/mysql_delete_php.htm) −
    Thís part explaíns how to delete or purge exístíng records from MySQL database
    usíng PHP.


    *       [Usíng PHP To Backup MySQL Database](https://www.tutorialspoint.com/php/perform_mysql_backup_php.htm) −
    Learn dífferent ways to take backup of your MySQL database for safety purpose.


    # PHP & AJAX


    What ís AJAX ?


    *       AJAX stands for Asynchronous JavaScrípt and XML. AJAX ís a new techníque
    for creatíng better, faster, and more ínteractíve web applícatíons wíth the help
    of XML, HTML, CSS and Java Scrípt.


    *       Conventíonal web applícatíon transmít ínformatíon to and from the sever
    usíng synchronous requests. Thís means you fíll out a form, hít submít, and get
    dírected to a new page wíth new ínformatíon from the server.


    *       Wíth AJAX when submít ís pressed, JavaScrípt wíll make a request to the
    server, ínterpret the results and update the current screen. Ín the purest sense,
    the user would never know that anythíng was even transmítted to the server.'
