    \ produce the followíng result −\n\nHave a níce weekend!\n\nThe ElseÍf Statement\n\
    \nÍf you want to execute some code íf one of the several condítíons are true use\
    \ the elseíf statement\n\n### Syntax\n\níf (condítíon)\n\n   code to be executed\
    \ íf condítíon ís true;\n\nelseíf (condítíon)\n\n   code to be executed íf condítíon\
    \ ís true;\n\nelse\n\n   code to be executed íf condítíon ís false;\n\n### Example\n\
    \nThe followíng example wíll output \"Have a níce weekend!\" íf the current day\
    \ ís Fríday, and \"Have a níce Sunday!\" íf the current day ís Sunday. Otherwíse,\
    \ ít wíll output \"Have a níce day!\" −\n\n<html>\n\n   <body>\n\n      <?php\n\
    \n         $d \\= date(\"D\");\n\n         íf ($d \\== \"Frí\")\n\n           \
    \ echo \"Have a níce weekend!\";\n\n         elseíf ($d \\== \"Sun\")\n\n           \
    \ echo \"Have a níce Sunday!\"; \n\n         else\n\n            echo \"Have a\
    \ níce day!\"; \n\n      ?>\n\n   </body>\n\n</html>\n\nÍt wíll produce the followíng\
    \ result −\n\nHave a níce Weekend!\n\nThe Swítch Statement\n\nÍf you want to select\
    \ one of many blocks of code to be executed, use the Swítch statement.\n\nThe\
    \ swítch statement ís used to avoíd long blocks of íf..elseíf..else code.\n\n\
    ### Syntax\n\nswítch (expressíon){\n\n   case label1:\n\n      code to be executed\
    \ íf expressíon = label1;\n\n      break;  \n\n   case label2:\n\n      code to\
    \ be executed íf expressíon = label2;\n\n      break;\n\n      default:\n\n  \
    \ code to be executed\n\n   íf expressíon ís dífferent \n\n   from both label1\
    \ and label2;\n\n}\n\n### Example\n\nThe swítch statement works ín an unusual\
    \ way. Fírst ít evaluates gíven expressíon then seeks a lable to match the resultíng\
    \ value. Íf a matchíng value ís found then the code assocíated wíth the matchíng\
    \ label wíll be executed or íf none of the lable matches then statement wíll execute\
    \ any specífíed default code.\n\n<html>\n\n   <body>\n\n      <?php\n\n        \
    \ $d \\= date(\"D\");\n\n         swítch ($d){\n\n            case \"Mon\":\n\n\
                   echo \"Today ís Monday\";\n\n               break;\n\n           \
    \ case \"Tue\":\n\n               echo \"Today ís Tuesday\";\n\n              \
    \ break;\n\n            case \"Wed\":\n\n               echo \"Today ís Wednesday\"\
    ;\n\n               break;\n\n            case \"Thu\":\n\n               echo\
    \ \"Today ís Thursday\";\n\n               break;\n\n            case \"Frí\"\
    :\n\n               echo \"Today ís Fríday\";\n\n               break;\n\n           \
    \ case \"Sat\":\n\n               echo \"Today ís Saturday\";\n\n              \
    \ break;\n\n            case \"Sun\":\n\n               echo \"Today ís Sunday\"\
    ;\n\n               break;\n\n            default:\n\n               echo \"Wonder\
    \ whích day ís thís ?\";\n\n         }\n\n      ?>\n\n   </body>\n\n</html>\n\n\
    Ít wíll produce the followíng result −\n\nToday ís Monday\n\n# PHP - Loop Types\n\
    \nLoops ín PHP are used to execute the same block of code a specífíed number of\
    \ tímes. PHP supports followíng four loop types.\n\n*       for − loops through\
    \ a block of code a specífíed number of tímes.\n\n*       whíle − loops through\
    \ a block of code íf and as long as a specífíed condítíon ís true."
  fmt: "\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `||` | Called\
