  fmt: "\n```php\nfunction NameSub1($first_name, $middle_initial, $last_name) {\n\
    \    Name::Name($first_name, $last_name);\n    $this->middle_initial = $middle_initial;\n\
    }\n\nfunction toString() {\n    return(Name::toString() . \" \" . $this->middle_initial);\n\
    }\n```\n\nIn this example, we have a parent class (`Name`), which has a two-argument\
    \ constructor, and a subclass (`NameSub1`), which has a three-argument constructor.\
    \ The constructor of `NameSub1` functions by calling its parent constructor explicitly\
    \ using the `::` syntax (passing two of its arguments along) and then setting\
    \ an additional field. Similarly, `NameSub1` defines its non constructor `toString()`\
    \ function in terms of the parent function that it overrides.\n\nNOTE — A constructor\
    \ can be defined with the same name as the name of a class. It is defined ín above\
    \ example.\n\n# PHP For C Developers\n\nThe simplest way to think of PHP is as\
    \ interpreted C that you can embed ín HTML documents. The language itself is a\
    \ lot like C, except with untyped variables, a whole lot of Web-specific libraries\
    \ built ín, and everything hooked up directly to your favorite Web server.\n\n\
    The syntax of statements and function definitions should be familiar, except that\
    \ variables are always preceded by `$`, and functions do not require separate\
    \ prototypes.\n\nHere we will put some similarities and differences ín PHP and\
    \ C.\n\n## Similarities\n\n- **Syntax**: Broadly speaking, PHP syntax is the same\
    \ as ín C: Code is blank insensitive, statements are terminated with semicolons,\
    \ function calls have the same structure (`my_function(expression1, expression2)`),\
    \ and curly braces (`{` and `}`) make statements into blocks. PHP supports C and\
    \ C++-style comments (`/* */` as well as `//`), and also Perl and shell-script\
    \ style (`#`).\n- **Operators**: The assignment operators (`=`, `+=`, `*=`, and\
    \ so on), the Boolean operators (`&&`, `||`, `!`), the comparison operators (`<`,\
    \ `>`, `<= `>=`, `==`, `!=`), and the basic arithmetic operators (`+`, `-`, `*`,\
    \ `/`, `%`) all behave ín PHP as they do ín C.\n- **Control structures**: The\
    \ basic control structures (`if`, `switch`, `while`, `for`) behave as they do\
    \ ín C, including supporting `break` and `continue`. One notable difference is\
    \ that `switch` ín PHP can accept strings as case identifiers.\n- **Function names**:\
    \ As you peruse the documentation, you'll see many function names that seem identical\
    \ to C functions.\n\n## Differences\n\n- **Dollar signs**: All variables are denoted\
    \ with a leading `$`. Variables do not need to be declared ín advance of assignment,\
    \ and they have no intrinsic type.\n- **Types**: PHP has only two numerical types:\
    \ `integer` (corresponding to a `long` ín C) and `double` (corresponding to a\
    \ `double` ín C). Strings are of arbitrary length. There is no separate character\
    \ type.\n- **Type conversion**: Types are not checked at compile time, and type\
    \ errors do not typically occur at runtime either. Instead, variables and values\
    \ are automatically converted across types as needed.\n- **Arrays**: Arrays have\
    \ a syntax superfially similar to C's array syntax, but they are implemented completely\
    \ differently. They are actually associative arrays or hashes, and the index can\
    \ be either a number or a string. They do not need to be declared or allocated\
    \ ín advance.\n- **No structure type**: There is no structure ín PHP, partly because\
    \ the array and object types together make ít unnecessary. The elements of a PHP\
    \ array need not be of a consistent type.\n- **No pointers**: There are no pointers\
    \ available ín PHP, although the tapeless variables play a similar role. PHP does\
    \ support variable references. You can also emulate function pointers to some\
    \ extent, ín that function names can be stored ín variables and called by using\
    \ the variable rather than a literal name.\n- **No prototypes**: Functions do\
    \ not need to be declared before their implementation is defined, as long as the\
    \ definition can be found ín the current file ín included files.\n- **Memory management**:\
    \ The PHP engine is effectively a garbage-collected environment (reference-counted),\
    \ and ín scripts there is no need to do any deallocation. You should freely allocate\
    \ new structures - such as strings and object instances. In PHP, it is possible\
    \ to define destructor but there is no `free` or `delete`. Destructor are called\
    \ when the last reference to an object goes away, before the memory is reclaimed.\n\
    - **Compilation and linking**: There is no separate step for PHP scripts.\n- **Permissiveness**:\
    \ As a general matter, PHP is more forgiving than C (especially its type system)\
    \ and so will let you get away with new kinds of mistakes. Unexpected results\
    \ are more common.\n\n# PHP For Perl Developers\n\nThis chapter will list out\
    \ major similarities and differences ín PHP and Perl. This will help Perl developers\
    \ to understand PHP quickly and avoid common mistakes.\n\n## Similarities\n\n\
    - **Compiled scripting languages**: Both Perl and PHP are scripting languages.\
    \ This means they are not used to produce native executables ín advance of execution.\n\
    - **Syntax**: PHP's basic syntax is very close to Perl's, and both share a lot\
    \ of syntactic features with C. Code is insensitive to whitespace, statements\
    \ are terminated by semicolons, and curly braces organize multiple statements\
    \ into a single block. Function calls start with the name of the function, followed\
    \ by the actual arguments enclosed in parentheses and separated by commas.\n-\
    \ **Dollar-sign variables**: All variables ín PHP look like variables ín Perl:\
    \ a name with a dollar sign (`$`) front of it.\n- **Declaration of variables**:\
    \ As Perl, you don't need to declare the type of a PHP variable before using it.\n\
    - **Loose typing variables**: As Perl, variables ín PHP have no intrinsic type\
    \ other than the value they currently hold. You can store either number or string\
    \ ín same type of variable.\n- **Strings and variable interpolation**: Both PHP\
    \ and Perl do more interpolation of double-quoted strings (`\" \"`) than of single-quoted\
    \ strings (`''`).\n\n## Differences\n\n- **PHP is HTML-embedded**: Although it\
    \ is possible to use PHP for arbitrary tasks by running it from the command line,\
    \ it is more typically connected to a Web server and used for producing Web pages.\
    \ If you are used to writing scripts ín Perl, the main difference ín PHP is that\
    \ you no longer need to explicitly print large blocks of static HTML using `print`\
    \ or heredoc statements and instead can simply write the HTML itself outside of\
    \ the PHP code block.\n- **No @ or % variables**: PHP has one only kind of variable,\
    \ which starts with a dollar sign (`$`). Any of the data ín language can be stored\
    \ ín such variables, whether scalar or compound.\n- **Arrays versus hashes**:\
    \ PHP has a single datatype called an array that plays the role of both hashes\
    \ and arrays/lists ín Perl.\n- **Specifying arguments to functions**: Function\
    \ calls ín PHP look pretty much like subroutine calls ín Perl. Function definitions\
    \ ín PHP, on the other hand, typically require some kind of list of formal arguments\
    \ as ín C or Java which is not the case ín Perl.\n- **Variable scoping ín functions**:\
    \ In Perl, the default scope for variables is global. This means that top-level\
    \ variables are visible inside subroutines. Often, this leads to promiscuous use\
    \ of globals across functions. In PHP, the scope of variables within function\
    \ definitions is local by default.\n- **No module system as such**: In PHP there\
    \ is no real distinction between normal code files and code files used as imported\
    \ libraries.\n- **Break and continue rather than next and last**: PHP is more\
    \ like C language and uses `break` and `continue` instead of `next` and `last`\
    \ statement.\n- **No elsif**: A minor spelling difference: Perl's `elsif` is PHP's\
    \ `elseif`.\n"
  trans: "\n\n```php\nfunction NameSub1($first_name, $middle_initial, $last_name)\
    \ {\n    Name::Name($first_name, $last_name);\n    $this->middle_initial = $middle_initial;\n\
    }\n\nfunction toString() {\n    return(Name::toString() . \" \" . $this->middle_initial);\n\
    }\n```\n\n在这个示例中，我们有一个父类（`Name`），它有一个两个参数的构造函数，以及子类（`NameSub1`），它有一个三个参数的构造函数。`NameSub1`\
    \ 的构造函数通过使用 `::` 语法显式调用其父类构造函数（传递其中两个参数），然后设置一个额外的字段。同样，`NameSub1` 的非构造函数 `toString()`\
    \ 是是基于它覆盖的父函数定义的。\n\n注意 — 构造函数可以定义与类名相同的名称。它在上面的示例中已经定义了。\n\n# 面向 C 开发者的 PHP\n\
    \n理解 PHP 最简单的方法是将其看作嵌入到 HTML 文档中的解释型 C。这种语言本身与 C 非常相似，但变量是无类型的，内置了大量的 Web 特有库，并且所有内容都直接连接到你喜欢的\
    \ Web 服务器。\n\n语句和函数定义的语法应该很熟悉，只是变量前面总是有一个 `$`，且函数不需要单独的原型。\n\n在这里我们将介绍 PHP 和 C\
    \ 之间的一些相似之处和区别。\n\n## 相似之处\n\n- **语法**：广义来说，PHP 的语法与 C 相同：代码对空格不敏感，语句分号结尾，函数调用具有相同的结构（`my_function(expression1,\
    \ expression2)`），大括号（`{` 和 `}`）将语句组成块。PHP 支持 C 和 C++ 风格的注释（`/* */` 以及 `//`），以及\
    \ Perl 和 脚本风格（`#`）。\n- **运算符**：赋值运算符（`=`、`+=`、`*=` 等）、布尔运算符（`&&`、`||`、`!`）、比较运算符（`<`,\
    \ `>`, `>=`, `==`, `!=`）以及基础算术运算符（`+`, `-`, `*`, `/`, `%`）在 PHP 中的行为与 C 一。\n-\
    \ **控制结构**：基本的控制结构（`if`、`switch`、`while`、`for`）的行为与 C 一致，包括支持 `break` 和 `continue`。一个显著的区别是，PHP\
    \ 中的 `switch` 可以接受字符串作为 case 标识符。\n- **函数名**：当你查阅文档时，你会发现许多看起来与 C 函数完全相同的函数名。\n\
    \n## 区别\n\n- **美元符号**：所有变量都以 `$` 开头。变量不需要在赋值前声明，而且它们没有内在类型。\n- **类型**：PHP 只有两种数值类型：`integer`（对应\
    \ C 语言中的 `long`）和 `double`（对应 C 语言中的 `double`）。字符串是任意长度的。它没有单独的字符类型。\n- **类型转换**：类型在编译时不进行检查，运行时通常也不会发生类型错误。相反，变量和值会根据需要自动进行类型转换。\n\
    - **数组**：数组的语法表面上与 C 的数组语法非常相似，但它们的实现方式完全不同。它们实际上是关联数组或哈希（hashes），索引可以是数字也可以是字符串。它们不需要提前声明或分配。\n\
    - **没有结构体类型**：PHP 中没有结构体（structure），部分是因为数组和对象类型的结合使得它变得没有必要。PHP 数组的元素不需要类型一致的。\n\
    - **没有指针**：PHP 中没有可用的指针，虽然引用变量起着类似的作用。PHP 支持变量引用。你也可以在某种程度上模拟函数指针，因为函数名可以存储在变量中并通过变量而不是字面量名称来调用。\n\
    - **没有原型**：函数在定义之前不需要声明，只要可以找到该定义即可。\n\n# 面向 Perl 开发者的 PHP\n\n本章将列出 PHP 和 Perl\
    \ 的相似之处和区别。这有助于 Perl 开发者快速理解 PHP。\n\n## 相似之处\n\n- **脚本语言**：Perl 和 PHP 都是脚本语言。\n\
    - **语法**：PHP 的基本语法与 Perl 非常接近：对空格不敏感，语句以分号结尾，大括号将语句组织成块。函数调用以名称开始，后面跟着括号内的参数并用逗号分隔。\n\
    - **美元符号变量**：PHP 中的所有变量都以美元符号 `$`在前。\n- **变量声明**：与 Perl 一样，你不需要在使用前声明变量类型。\n-\
    \ **松类型变量**：与 Perl 一样，PHP 变量除了当前持有的值之外没有内在类型。\n- **字符串插值**：Perl 和 PHP 对双引号字符串（`\"\
    \ \"`）的插值都多于单引号字符串（`''`）。\n\n## 区别\n\n- **PHP 是嵌入 HTML 的**：虽然可以通过命令行运行 PHP 来执行任意任务，但它通常连接到\
    \ Web 服务器并生成网页。如果你习惯编写 Perl 脚本，PHP 的主要区别在于你不再需要使用 `print` 或 heredoc 语句打印大量的静态\
    \ HTML，而是可以直接在 PHP 代码块编写 HTML。\n- **没有 @ 或 % 变量**：PHP 只有一种变量类型，以美元符号 `$` 开头。语言中的任何数据都可以存储在这种变量中，无论是标量还是复合。\n\
    - **数组与哈希**：PHP 有一种名为数组的数据类型，它兼具哈希和数组/列表的角色。\n- **函数参数**：PHP 的函数调用看起来与 Perl 的过程调用非常相似。然而，PHP\
    \ 的函数定义通常需要形式参数列表，这在 C 或 Java 中是类似的。\n- **变量作用域**：在 Perl 中，变量的默认作用域是全局的。这意味着顶层变量在子程序内部是可见的。这经常导致全局变量的滥用。在\
    \ PHP 中，函数定义内部变量的作用域是局部的。\n- **没有真正的模块系统**：在 PHP 中，普通代码文件和作为导入库的代码文件之间没有真正的区别。\n\
    - **使用 break 和 continue 而非 next 和 last**：PHP 更像 C 语言，使用 `break` 和 `continue` 代替\
    \ `next` 和 `last` 语句。\n- **没有 elsif**：一个微小的拼写差异：Perl 的 `elsif` 是 PHP 的 `elseif`。\n\
    \n"
