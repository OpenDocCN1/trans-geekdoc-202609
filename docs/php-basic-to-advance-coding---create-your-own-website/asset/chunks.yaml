    - `$_SERVER[''argc'']`: Contains the number of command line parameters passed
    to the script if run on the command line.

    - `$_SERVER[''GATEWAY_INTERFACE'']`: What revision of the CGI specification the
    server is using; i.e. ''CGI/1.1''.

    - `$_SERVER[''SERVER_ADDR'']`: The IP address of the server under which the current
    script is executing.

    - `$_SERVER[''SERVER_NAME'']`: The name of the server host under which the current
    script is executing. If the script is running on a virtual host, this will be
    the value defined for that virtual host.

    - `$_SERVER[''SERVER_SOFTWARE'']`: Server identification string, given in the
    headers when responding to requests.

    - `$_SERVER[''SERVER_PROTOCOL'']`: Name and revision of the information protocol
    via which the page was requested; i.e. ''HTTP/1.0'';

    - `$_SERVER[''REQUEST_METHOD'']`: Which request method was used to access the
    page; i.e. ''GET'', ''HEAD'', ''POST'', ''PUT''.

    - `$_SERVER[''REQUEST_TIME'']`: The timestamp of the start of the request. Available
    since PHP 5.1.0.

    - `$_SERVER[''QUERY_STRING'']`: The query string, if any, via which the page was
    accessed.

    - `$_SERVER[''DOCUMENT_ROOT'']`: The document root directory under which the current
    script is executing, as defined in the server''s configuration file.

    - `$_SERVER[''HTTP_ACCEPT'']`: Contents of the Accept: header from the current
    request, if there is one.

    - `$_SERVER[''HTTP_ACCEPT_CHARSET'']`: Contents of the Accept-Charset: header
    from the current request, if there is one. Example: ''iso-8859-1,*,utf-8''.

    - `$_SERVER[''HTTP_ACCEPT_ENCODING'']`: Contents of the Accept-Encoding: header
    from the current request, if there is one. Example: ''gzip''.

    - `$_SERVER[''HTTP_ACCEPT_LANGUAGE'']`: Contents of the Accept-Language: header
    from the current request, if there is one. Example: ''en''.

    - `$_SERVER[''HTTP_CONNECTION'']`: Contents of the Connection: header from the
    current request, if there is one. Example: ''Keep-Alive''.

    - `$_SERVER[''HTTP_HOST'']`: Contents of the Host: header from the current request,
    if there is one.

    - `$_SERVER[''HTTP_REFERER'']`: The address of the page (if any) which referred
    the user agent to the current page.

    - `$_SERVER[''HTTP_USER_AGENT'']`: This is a string denoting the user agent which
    is accessing the page. A typical example is: Mozilla/4.5 [en] (X11; U; Linux 2.2.9
    i586).

    - `$_SERVER[''HTTPS'']`: Set to a non-empty value if the script was queried through
    the HTTPS protocol.

    - `$_SERVER[''REMOTE_ADDR'']`: The IP address from which the user is viewing the
    current page.

    - `$_SERVER[''REMOTE_HOST'']`: The Host name from which the user is viewing the
    current page. The reverse dns lookup is based off the `REMOTE_ADDR` of the user.

    - `$_SERVER[''REMOTE_PORT'']`: The port being used on the user''s machine to communicate
    with the web server.

    - `$_SERVER[''SCRIPT_FILENAME'']`: The absolute pathname of the currently executing
    script.

    - `$_SERVER[''SERVER_ADMIN'']`: The value given to the `SERVER_ADMIN` (for Apache)
    directive in the web server configuration file.

    - `$_SERVER[''SERVER_PORT'']`: The port on the server machine being used by the
    web server for communication. For default setups, this will be ''80''.

    - `$_SERVER[''SERVER_SIGNATURE'']`: String containing the server version and virtual
    host name which are added to server-generated pages, if enabled.

    - `$_SERVER[''PATH_TRANSLATED'']`: Filesystem based path to the current script.

    - `$_SERVER[''SCRIPT_NAME'']`: Contains the current script''s path. This is useful
    for pages which need to point to themselves.

    - `$_SERVER[''REQUEST_URI'']`: The URI which was given in order to access this
    page; for instance, ''/index.html''.

    - `$_SERVER[''PHP_AUTH_DIGEST'']`: When running under Apache as module authentication
    this variable is set to the ''Authorization'' header sent by the client.

    - `$_SERVER[''PHP_AUTH_USER'']`: When running under Apache or PHP 5 as module
    authentication this variable is set to the username provided by the user.

    - `$_SERVER[''PHP_AUTH_PW'']`: When running under Apache or PHP 5 as module authentication
    this variable is set to the password provided by the user.

    - `$_SERVER[''AUTH_TYPE'']`: When running under Apache as module authentication
    this variable is set to the authentication type.


    # PHP Regular Expressions


    Regular expressions are nothing more than a sequence or pattern of characters.
    They provide the pattern-matching functionality. Using regular expression you
    can search a particular string inside another string, you can replace one string
    by another and you can split a string into many chunks. PHP offers two sets of
    regular expressions, each corresponding to a type of regular expression. You can
    use any of them based on your comfort.


    - POSIX Regular Expressions

    - Perl Style Regular Expressions


    The structure of a POSIX regular expression is not similar to that of a typical
    mathematical expression: various elements (operators) are combined to form more
    complex expressions. The simplest regular expression is one that matches a single
    character, such as inside strings such as bag. Let''s give explanation for few
    concepts being used in regular expression. After that we will introduce you with
    regular expression related functions.


    ### Brackets


    Brackets `[]` have a special meaning when used in the context of regular expressions.
    They are used to find a range of characters.


    | Sr.No | Expression | Description |

    | :--- | :--- | :--- |

    | 1 | `[0-9]` | matches any digit from 0 through 9. |

    | 2 | `[a-z]` | matches any character from lowercase a through lowercase z. |

    | 3 | `[A-Z]` | matches any character from uppercase A through uppercase Z. |

    | 4 | `[a-Z]` | matches any character from lowercase a through uppercase Z. |


    The ranges shown above are general; you could also use the range `[0-3]` to match
    any digit ranging from 0 through 3, or the range `[b-v]` to match any lowercase
    character ranging from b through v.


    ### Quantifiers


    The frequency or position of bracketed character sequences and single characters
    can be denoted by a special character. Each special character having a specific
    connotation. The `+`, `*`, `?`, `{range}`, and `$` flags all follow a character
    sequence.


    | Sr.No | Expression | Description |

    | :--- | :--- | :--- |

    | 1 | `p+` | matches any string containing at least one p. |

    | 2 | `p*` | matches any string containing zero or more p''s. |

    | 3 | `p?` | matches any string containing zero or one p''s. |

    | 4 | `p{N}` | matches any string containing a sequence of `N` p''s |

    | 5 | `p{2,3}` | matches any string containing a sequence of two or three p''s.
    |

    | 6 | `p{2, }` | matches any string containing a sequence of at least two p''s.
    |

    | 7 | `p$` | matches any string with p at the end of it. |

    | 8 | `^p` | matches any string with p at the beginning of it. |


    ### Examples


    Following examples will clear your concepts about matching characters.


    | Sr.No | Expression | Description |

    | :--- | :--- | :--- |

    | 1 | `[^a-zA-Z]` | matches any string not containing any of the characters ranging
    from a through z and A through Z. |

    | 2 | `p.p` | matches any string containing p, followed by any character, in turn
    followed by another p. |

    | 3 | `^.{2}$` | matches any string containing exactly two characters. |

    | 4 | `(.*.*)` | matches any string enclosed within `<b>` and `</b>`. |

    | 5 | `p(hp)*` | matches any string containing a p followed by zero or more instances
    of the sequence php. |

