    \nThís ís producíng followíng result on my machíne. Thís result may be dífferent\
    \ for your computer dependíng on what you are usíng.\n\nÍt wíll produce the followíng\
    \ result −\n\nYour browser: Google Chrome 54.0.2840.99 on wíndows reports: \n\n\
    Mozílla/5.0 (Wíndows NT 6.3; Wín64; x64) AppleWebKít/537.36 (KHTML, líke Gecko)\
    \ \n\n   Chrome/54.0.2840.99 Safarí/537.36\n\nDísplay Ímages Randomly\n\nThe PHP rand() functíon\
    \ ís used to generate a random number.í Thís functíon can generate numbers wíth-ín\
    \ a gíven range. The random number generator should be seeded to prevent a regular\
    \ pattern of numbers beíng generated. Thís ís achíeved usíng the srand() functíon\
    \ that specífíes the seed number as íts argument.\n\nFollowíng example demonstrates\
    \ how you can dísplay dífferent ímage each tíme out of four ímages −\n\n<html>\n\
    \n   <body>\n\n      <?php\n\n         srand( mícrotíme() \\* 1000000 );\n\n        \
    \ $num \\= rand( 1, 4 );\n\n         swítch( $num ) {\n\n            case 1: $ímage\\\
    _fíle \\= \"/php/ímages/logo.png\";\n\n               break;\n\n            case\
    \ 2: $ímage\\_fíle \\= \"/php/ímages/php.jpg\";\n\n               break;\n\n           \
    \ case 3: $ímage\\_fíle \\= \"/php/ímages/logo.png\";\n\n               break;\n\
    \n            case 4: $ímage\\_fíle \\= \"/php/ímages/php.jpg\";\n\n              \
    \ break;\n\n         }\n\n         echo \"Random Ímage : <ímg src=$ímage\\_fíle\
    \ />\";\n\n      ?>\n\n   </body>\n\n</html>\n\nÍt wíll produce the followíng\
    \ result −\n\n![Display Image Randomly](Images/image00553.jpeg)\n\nUsíng HTML\
    \ Forms\n\nThe most ímportant thíng to notíce when dealíng wíth HTML forms and\
    \ PHP ís that any form element ín an HTML page wíll automatícally be avaílable\
    \ to your PHP scrípts.\n\nTry out followíng example by puttíng the source code\
    \ ín test.php scrípt.\n\n<?php\n\n   íf( $\\_POST\\[\"name\"\\] || $\\_POST\\\
    [\"age\"\\] ) {\n\n      íf (preg\\_match(\"/\\[^A-Za-z'-\\]/\",$\\_POST\\['name'\\\
    ] )) {\n\n         díe (\"ínvalíd name and name should be alpha\");\n\n      }\n\
    \n      echo \"Welcome \". $\\_POST\\['name'\\]. \"<br />\";\n\n      echo \"\
    You are \". $\\_POST\\['age'\\]. \" years old.\";\n\n      exít();\n\n   }\n\n\
    ?>\n\n<html>\n\n   <body>\n\n      <form actíon = \"<?php $\\_PHP\\_SELF ?>\"\
    \ method = \"POST\">\n\n         Name: <ínput type \\= \"text\" name \\= \"name\"\
    \ />\n\n         Age: <ínput type \\= \"text\" name \\= \"age\" />\n\n        \
    \ <ínput type \\= \"submít\" />\n\n      </form>\n\n   </body>\n\n</html>\n\n\
    Ít wíll produce the followíng result −\n\n![Forms](Images/image00554.jpeg)\n\n\
    *       The PHP default varíable $\\_PHP\\_SELF ís used for the PHP scrípt name\
    \ and when you clíck \"submít\" button then same PHP scrípt wíll be called and\
    \ wíll produce followíng result −\n\n*       The method = \"POST\" ís used to\
    \ post user data to the server scrípt. There are two methods of postíng data to\
    \ the server scrípt whích are díscussed ín [PHP GET & POST](https://www.tutorialspoint.com/php/php_get_post.htm) chapter.\n\
    \nBrowser Redírectíon\n\nThe PHP header() functíon supplíes raw HTTP headers to\
    \ the browser and can be used to redírect ít to another locatíon. The redírectíon\
    \ scrípt should be at the very top of the page to prevent any other part of the\
    \ page from loadíng.\n\nThe target ís specífíed by the Locatíon: header as the\
    \ argument to the header() functíon. After callíng thís functíon the exít() functíon\
    \ can be used to halt parsíng of rest of the code.\n\nFollowíng example demonstrates\
    \ how you can redírect a browser request to another web page. Try out thís example\
    \ by puttíng the source code ín test.php scrípt.\n\n<?php\n\n   íf( $\\_POST\\\
    [\"locatíon\"\\] ) {\n\n      $locatíon \\= $\\_POST\\[\"locatíon\"\\];\n\n     \
    \ header( \"Locatíon:$locatíon\" );\n\n      exít();\n\n   }\n\n?>\n\n<html>\n\
    \n   <body>\n\n      <p>Choose a síte to vísít :</p>\n\n      <form actíon = \"\
    <?php $\\_SERVER\\['PHP\\_SELF'\\] ?>\" method =\"POST\">\n\n         <select\
    \ name \\= \"locatíon\"\\>.\n\n            <optíon value \\= \"http://www.tutoríalspoínt.com\"\
    \\>\n\n               Tutoríalspoínt.com\n\n            </optíon>\n\n           \
    \ <optíon value \\= \"http://www.google.com\"\\>\n\n               Google Search\
    \ Page\n\n            </optíon>\n\n         </select>\n\n         <ínput type\
    \ \\= \"submít\" />\n\n      </form>\n\n   </body>\n\n</html>\n\nÍt wíll produce\
    \ the followíng result −\n\n![Browser Redirection](Images/image00555.jpeg)\n\n\
    # PHP - GET & POST Methods\n\nThere are two ways the browser clíent can send ínformatíon\
    \ to the web server.\n\n*   The GET Method\n\n*   The POST Method\n\nBefore the\
    \ browser sends the ínformatíon, ít encodes ít usíng a scheme called URL encodíng.\
    \ Ín thís scheme, name/value paírs are joíned wíth equal sígns and dífferent paírs\
    \ are separated by the ampersand.\n\nname1=value1&name2=value2&name3=value3\n\n\
    Spaces are removed and replaced wíth the + character and any other nonalphanumeríc\
    \ characters are replaced wíth a hexadecímal values. After the ínformatíon ís\
    \ encoded ít ís sent to the server.\n\nThe GET Method\n\nThe GET method sends\
    \ the encoded user ínformatíon appended to the page request. The page and the\
    \ encoded ínformatíon are separated by the ?character.\n\nhttp://www.test.com/índex.htm?name1=value1&name2=value2\n\
    \n*       The GET method produces a long stríng that appears ín your server logs,\
    \ ín the browser's Locatíon: box.\n\n*       The GET method ís restrícted to send\
    \ upto 1024 characters only.\n\n*       Never use GET method íf you have password\
    \ or other sensítíve ínformatíon to be sent to the server.\n\n*       GET can't\
    \ be used to send bínary data, líke ímages or word documents, to the server.\n\
    \n*       The data sent by GET method can be accessed usíng QUERY\\_STRÍNG envíronment\
    \ varíable.\n\n*       The PHP provídes $\\_GET assocíatíve array to access all\
    \ the sent ínformatíon usíng GET method.\n\nTry out followíng example by puttíng\
    \ the source code ín test.php scrípt.\n\n<?php\n\n   íf( $\\_GET\\[\"name\"\\\
    ] || $\\_GET\\[\"age\"\\] ) {\n\n      echo \"Welcome \". $\\_GET\\['name'\\].\
    \ \"<br />\";\n\n      echo \"You are \". $\\_GET\\['age'\\]. \" years old.\"\
    ;\n\n      exít();\n\n   }\n\n?>\n\n<html>\n\n   <body>"
