  fmt: "\n# Error Levels\n\n| Level | Constant | Description | Priority |\n|:---|::|---|:---:|\n\
    | 3 | `E_PARSE` | Compile-time parse errors. Parse errors should only be generated\
    \ by the parser. | 4 |\n| 4 | `E_NOTÍCE` | Run-time notices. The script found\
    \ something that might be an error, but could also happen when running a script\
    \ normally. | 8 |\n| 5 | `E_CORE_ERROR` | Fatal errors that occur during PHP's\
    \ initial start-up. | 16 |\n| 6 | `E_CORE_WARNING` | Non-fatal run-time errors.\
    \ This occurs during PHP's initial start-up. | 32 |\n| 7 | `E_USER_ERROR` | Fatal\
    \ user-generated error. This is like an `E_ERROR` set by the programmer using\
    \ the PHP function `trigger_error()`. | 256 |\n| 8 | `E_USER_WARNING` | Non-fatal\
    \ user-generated warning. This is like an `E_WARNING` set by the programmer using\
    \ the PHP function `trigger_error()`. | 512 |\n| 9 | `E_USER_NOTICE` | User-generated\
    \ notice. This is like an `E_NOTICE` set by the programmer using the PHP function\
    \ `trigger_error()`. | 1024 |\n| 10 | `E_STRICT` | Run-time notices. Enable to\
    \ have PHP suggest changes to your code which will ensure the best interoperability\
    \ and forward compatibility of your code. | 2048 |\n| 11 | `E_RECOVERABLE_ERROR`\
    \ | Catchable fatal error. This is like an `E_ERROR` but can be caught by a user-defined\
    \ handler (see also `set_error_handler()`). | 4096 |\n| 12 | `E_ALL` | All errors\
    \ and warnings, except level `E_STRICT` (`E_STRICT` will be part of `E_ALL` as\
    \ of PHP 6.0). | 819 |\n\nAll the above error level can be set using PHP built-in\
    \ function `error_report(level)` where `level` can be any of the value defined\
    \ above.\n\n`error_report( [level] )`\n\nFollowing is the way you can create one\
    \ error handler:\n\n```php\n<?php\nfunction handleError($errno, $errstr, $file,\
    \ $line) {\n    echo \"<b>Error:</b> [$errno] $errstr - $file:$line\";\n    echo\
    \ \"<br />\";\n    echo \"Terminating PHP\";\n    die();\n}\n```\n\nOnce you define\
    \ your custom handler you need to set it using PHP built-in library `set_error_handler`.\
    \ Now let’s examine our example by calling a function which does not exist.\n\n\
    ```php\n<?php\nerror_report( E_ERROR );\nfunction handleError($errno, $errstr,\
    \ $file, $line) {\n    echo \"<b>Error:</b> [$errno] $errstr - $file:$line\";\n\
    \    echo \"<br />\";\n    echo \"Terminating PHP\";\n    die();\n}\nset_error_handler(\"\
    handleError\");\n// trigger\n```\nPHP 5 has an exception model similar to that\
    \ of other programming languages. Exceptions are important and provide a better\
    \ control over error handling.\n\nLet's explain the new keyword related to exceptions:\n\
    \n- **Try**: A function using an exception should be in a `try` block. If the\
    \ exception does not trigger, the code will continue as normal. However if the\
    \ exception triggers, an exception is \"thrown\".\n- **Throw**: This is how you\
    \ trigger an exception. Each `throw` must have at least one `catch`.\n- **Catch**:\
    \ A `catch` block retrieves an exception and creates an object containing the\
    \ exception information.\n\nWhen an exception is thrown, code following the statement\
    \ will not be executed, and PHP will attempt to find the first matching catch\
    \ block. If an exception is not caught, a PHP Fatal Error will be issued with\
    \ \"Uncaught Exception\".\n\n- An exception can be thrown and caught within PHP.\
    \ Code may be surrounded in a `try` block.\n- Each `try` must have at least one\
    \ corresponding catch block. Multiple catch blocks can be used to catch different\
    \ classes of exceptions.\n- Exceptions can be thrown (or re-thrown) within a `catch`\
    \ block.\n\n### Example\nFollowing is the piece of code, copy and paste this code\
    \ into a file and verify the result.\n\n```php\n<?php\ntry {\n    $error = 'Always\
    \ throw this error';\n    throw new Exception($error);\n    // Code following\
    \ an exception is not executed.\n    echo 'Never executed';\n} catch (Exception\
    \ $e) {\n    echo 'Caught exception: ', $e->getMessage(), \"\\n\";\n}\n// Continue\
    \ execution\necho 'Hello World';\n?>\n```\n\nIn the above example `$e->getMessage()`\
    \ function is used to get error message. There are following functions which can\
    \ be used from `Exception` class:\n\n- `getMessage()`: message of exception\n\
    - `getCode()`: code of exception\n- `getFile()`: source filename\n- `getLine()`:\
    \ source line\n- `getTrace()`: array of the backtrace()\n- `getTraceAsString()`:\
    \ formatted string of trace\n\n### Creating Custom Exception Handler\nYou can\
    \ define your own custom exception handler. Use the following function to set\
    \ a user-defined exception handler function:\n\n`string set_error_handler (callback\
    \ $exception_handler)`\n\nHere `exception_handler` is the name of the function\
    \ to be called when an uncaught exception occurs. This function must be defined\
    \ before calling `set_error_handler()`.\n\n### Example\n```php\n<?php\nfunction\
    \ exception_handler($exception) {\n    echo \"Uncaught exception: \" , $exception->getMessage(),\
    \ \"\\n\";\n}\nset_error_handler('exception_handler');\nthrow new Exception('Uncaught\
    \ Exception');\necho \"Not Executed\\n\";\n?>\n```\n\n# PHP - Bugs Debugging\n\
    \nPrograms rarely work correctly the first time. Many things can go wrong in your\
    \ program that cause the PHP interpreter to generate an error message. You have\
    \ a choice about where those error messages go. The messages can be sent along\
    \ with other output to the web browser.\n\nTo make error messages display in the\
    \ browser, set `display_errors` directive to `On`. To send errors to the web server\
    \ log, set `log_errors` to `On`. You can set both to `On` if you want error messages\
    \ in both places.\n\nPHP defines some constants you can use to set the value of\
    \ `error_report` such that only types of types get reported: `E_ALL` (for all\
    \ errors except strict), `E_PARSE` (parse errors), `E_ERROR` (fatal errors), `E_WARNING`\
    \ (warnings), `E_NOTICE` (notices).\n\nWhile writing your PHP program, it is a\
    \ good idea to use PHP-aware editors like `BBEdit` or `Emacs`. One of the special\
    \ features of these editors is syntax highlighting. It changes the color of different\
    \ parts of your program based on what those parts are. For example, strings are\
    \ pink, keywords such as `if` and `while` are blue, comments are grey, and variables\
    \ are black.\n\nAnother feature is quote and bracket matching, which helps to\
    \ make sure your quotes and brackets are balanced. When you type a closing delimiter\
    \ such as `}`, the editor highlights the opening `{` it matches.\n\nThere are\
    \ following points which need to be verified while debugging your program:\n\n\
    - **Missing Semicolons**: Every PHP statement ends with a semicolon (`;`). PHP\
    \ doesn't stop reading until it reaches a semicolon. If you leave out the semicolon\
    \ at the end of a line, PHP continues reading the statement on the following line.\n\
    - **Not Equal Signs**: When you ask whether two values are equal in a comparison\
    \ statement, you need two equal signs (`==`). Using one equal sign is a common\
    \ mistake.\n- **Misspelled Variable Names**: If you misspelled a variable PHP\
    \ PHP it as a new variable. Remember: To PHP, `$test` is not the same variable\
    \ as `$Test`.\n- **Missing Dollar Signs**: A missing dollar sign in a variable\
    \ name is really hard to see, but at least it usually results in an error message\
    \ so that you know where to look for the problem.\n- **Troubling Quotes**: You\
    \ can have too many, too few, or the wrong kind of quotes.\n- **Missing Parentheses\
    \ and curly brackets**: They should always be in pairs.\n- **Array Index**: All\
    \ the arrays should start from zero instead of 1.\n"
