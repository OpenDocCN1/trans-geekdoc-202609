    \ expíre, path, domaín, securíty);\n\nHere ís the detaíl of all the arguments\
    \ −"
  fmt: "\n# PHP - Cookies\n\nCookies are text files stored on the client computer\
    \ and they are kept of use tracking purpose. PHP transparently supports HTTP cookies.\n\
    \nThere are three steps involved in identifying returning users −:\n\n*   **Server\
    \ script**: Server script sends a set of cookies to the browser. For example `name`,\
    \ `age`, or `identification number` etc.\n*   **Browser storage**: Browser stores\
    \ this information on local machine for future use.\n*   **Server-side identification**:\
    \ When next time browser sends any request to web server then it sends those cookies\
    \ information to the server and server uses that information to identify the user.\n\
    \nThis chapter will teach you how to set cookies, how to access them and how to\
    \ delete them.\n\n## The Anatomy of a Cookie\n\nCookies are usually set ín an\
    \ HTTP header (although JavaScript can also set a cookie directly on a browser).\
    \ A PHP script that sets a cookie might send headers that look something like\
    \ this −\n\n```http\nHTTP/1.1 200 OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer:\
    \ Apache/1.3.9 (UNIX) PHP/4.0b3\nSet-Cookie: name=xyz; expires=Friday, 04-Feb-07\
    \ 22:03:38 GMT; path=/; domain=tutorialspoint.com\nConnection: close\nContent-Type:\
    \ text/html\n```\n\nAs you can see, the `Set-Cookie` header contains a name value\
    \ pair, a GMT date, a path and a domain. The name and value will be URL encoded.\
    \ The `expires` field is an instruction to the browser to \"forget\" the cookie\
    \ after the given time and date.\n\nIf the browser is configured to store cookies,\
    \ it will then keep this information until the expiry date. If the user points\
    \ the browser at any page that matches the path and domain of the cookie, it will\
    \ resend the cookie to the server. The browser's headers might look something\
    \ like this −\n\n```http\nGET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent:\
    \ Mozilla/4.6 (X11; Í; Linux 2.2.6-15apmac ppc)\nHost: zink.demon.co.uk:1126\n\
    Accept: image/gif, /*\nAccept-Encoding: gzip\nAccept-Language: en\nAccept-Charset:\
    \ iso-8859-1,*,utf-8\nCookie: name=xyz\n```\n\nA PHP script will then have access\
    \ to the cookie in the environmental variables `$_COOKIE` or `$_HTTP_COOKIEARS`\
    \ which holds all cookie names and values. Above cookie can be accessed using\
    \ `$_HTTP_COOKIEARS[\"name\"]`.\n\n## Setting Cookies with PHP\n\nPHP provided\
    \ `setcookie()` function to set a cookie. This function requires upto six arguments\
    \ and should be called before `<html>` tag. For each cookie this function has\
    \ to be called separately.\n\n```php\nsetcookie(name, value, expire, path, domain,\
    \ security);\n```\n\nHere is the detail of all the arguments −\n\n*   **Name**:\
    \ This sets the name of the cookie and is stored in environment `HTTP_COOKIEARS`.\
    \ This variable is used while accessing cookies.\n*   **Value**: This sets the\
    \ value of the named variable and is the content you actually want to store.\n\
    *   **Expiry**: This specify a future time in seconds since `00:00:00 GMT` on\
    \ 1st Jan 1970. After this time cookie will become accessible. If this parameter\
    \ is not set cookie will automatically expire when the Browser is closed.\n* \
    \  **Path**: This specifies the directories for which the cookie is valid. A single\
    \ slash permits the cookie to be valid for all directories.\n*   **Domain**: This\
    \ can be used to specify the domain name very large domains and must contain at\
    \ least two periods to be valid. All cookies are only valid for the host and domain\
    \ created.\n*   **Security**: This can be set to 1 to specify that the cookie\
    \ should only be sent by secure transmission otherwise set to 0 which mean cookie\
    \ can be sent by regular HTTP.\n\nFollowing example will create two cookies `name`\
    \ and `age`, these cookies will be expired after one hour.\n\n```php\n<?php\n\
    setcookie(\"name\", \"John Watt\", time()+3600, \"\", 0);\nsetcookie(\"age\",\
    \ \"36\", time()+3600, \"/\", 0);\n?>\n<html>\n<head>\n    <title>Setting Cookies\
    \ with PHP</title>\n</head>\n<body>\n    <?php echo \"Set Cookies\"?>\n</body>\n\
    </html>\n```\n\n## Accessing Cookies with PHP\n\nPHP provides many ways to access\
    \ cookies. Simplest way is to use either `$_COOKIE` or `$_HTTP_COOKIEARS`. Following\
    \ example will access all the cookies set in above example.\n\n```html\n<html>\n\
    <head>\n    <title>Accessing Cookies with PHP</title>\n</head>\n<body>\n    <?php\n\
    \    echo $_COOKIE[\"name\"]. \"<br />\";\n    /* equivalent to */\n    echo $_HTTP_COOKIEARS[\"\
    name\"]. \"<br />\";\n    echo $_COOKIE[\"age\"] . \"<br />\";      \n    /* equivalent\
    \ to */\n    echo $_HTTP_COOKIEARS[\"age\"] . \"<br />\";\n    ?>\n</body>\n</html>\n\
    ```\n\nYou can use `isset()` function to check if a cookie is set or not.\n\n\
    ```html\n<html>\n<head>\n    <title>Accessing Cookies with PHP</title>\n</head>\n\
    <body>\n    <?php\n    if( isset($_COOKIE[\"name\"]))\n        echo \"Welcome\
    \ \" . $_COOKIE[\"name\"] . \"<br />\";\n    else\n        echo \"Sorry... Not\
    \ recognized\" . \"<br />\";\n    ?>\n</body>\n</html>\n```\n\n## Deleting Cookies\
    \ with PHP\n\nOfficially, to delete a cookie you should call `setcookie()` with\
    \ the name only but this does not always work, however:\n\n```php\n<?php\nsetcookie(\"\
    name\", \"\", time()-3600, \"/\");\nsetcookie(\"age\", \"\", time()-3600, \"/\"\
    );\n?>\n<html>\n<head>\n    <title>Deleting Cookies with PHP</title>\n</head>\n\
    <body>\n    <?php echo \"Deleted Cookies\" ?>\n</body>\n</html>\n```\n"
  trans: "\n\n# PHP - Cookies\n\nCookies 是存储在客户端计算机上的文本文件，用于跟踪用户用途。PHP 透明地支持 HTTP\
    \ cookie。\n\n识别回访用户涉及三个步骤——：\n\n*   **服务器脚本**：服务器脚本向浏览器发送一组 Cookie。例如 `name`、`age`\
    \ 或 `identification number`（标识）等。\n*   **浏览器存储**：浏览器将这些信息存储在本地机器上以供以后使用。\n*  \
    \ **服务器端识别**：当浏览器下一次向 Web 服务器发送任何请求时，它会将这些 Cookie 信息发送到服务器，服务器使用这些信息来识别用户。\n\n\
    本章将教你如何设置 Cookie、如何访问它们以及如何删除它们。\n\n## Cookie 的剖析\n\nCookies 通常设置在 HTTP 头部中（尽管\
    \ JavaScript 也可以直接在浏览器上设置 cookie）。设置 Cookie 的 PHP 脚本可能会发送类似于所示的头部——\n\n```http\n\
    HTTP/1.1 200 OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3.9 (UNIX)\
    \ PHP/4.0b3\nSet-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT; path=/;\
    \ domain=tutorialspoint.com\nConnection: close\nContent-Type: text/html\n```\n\
    \n如你所示，`Set-Cookie` 头部包含一个名称值对、一个 GMT 日期、一个路径和一个域名。名称和值将经过 URL 编码。`expires` 字段是指令浏览器在指定的日期和时间后“忘记”该\
    \ cookie。\n\n如果浏览器配置为存储 cookies，它将保留这些信息，直到到期为止。如果用户将浏览器指向任何与 cookie 的路径和域名匹配的页面，它会将\
    \ cookie 重新发送服务器。浏览器的头部可能如下所示——\n\n```http\nGET / HTTP/1.0\nConnection: Keep-Alive\n\
    User-Agent: Mozilla/4.6 (X11; Í; Linux 2.2.6-15apmac ppc)\nHost: zink.demon.co.uk:1126\n\
    Accept: image/gif, /*\nAccept-Encoding: gzip\nAccept-Language: en\nAccept-Charset:\
    \ iso-8859-1,*,utf-8\nCookie: name=xyz\n```\n\nPHP 脚本将可以通过环境变量 `$_COOKIE` 或 `$_HTTP_COOKIEARS`\
    \ 访问 cookie，这些变量持有所有的 cookie 名称和值。上面的 cookie 可以通过 `$_HTTP_COOKIEARS[\"name\"]`\
    \ 访问。\n\n## 使用 PHP 设置 Cookies\n\nPHP 提供了 `setcookie()` 函数来设置 cookie。此函数最多需要六个参数，并且在\
    \ `<html>` 标签之前调用。对于每个 cookie 必须单独调用此函数。\n\n```php\nsetcookie(name, value, expire,\
    \ path, domain, security);\n```\n\n以下是所有参数的详情——\n\n*   **Name (名称)**：设置 cookie\
    \ 的名称并存储在环境变量 `HTTP_COOKIEARS` 中。在访问 cookies 时使用此变量。\n*   **Value (值)**：设置命名变量的值，即你实际想要存储的内容。\n\
    *   **Expiry (过期时间)**：指定自 1970 年 1 月 1 日 `00:00:00 GMT` 以来的秒数。在此时间之后 cookie 将变为可访问。如果未设置此参数，cookie\
    \ 将在关闭浏览器时自动过期。\n*   **Path (路径)**：指定 cookie 有效的目录。单斜杠允许 cookie 对所有目录有效。\n*  \
    \ **Domain (域名)**：可用于指定域名，大型域名必须包含至少两个点才有效。所有 cookies 仅对所创建的主机和域名有效。\n*   **Security\
    \ (安全性)**：可以设置为 1，以指定 cookie 仅通过安全传输发送，否则设置为 0，意味着 cookie 可以通过常规 HTTP 发送。\n\n\
    接下来的示例将创建两个 cookie：`name` 和 `age`，这些 cookie 将在一小时后过期。\n\n```php\n<?php\nsetcookie(\"\
    name\", \"John Watt\", time()+3600, \"\", 0);\nsetcookie(\"age\", \"36\", time()+3600,\
    \ \"/\", 0);\n?>\n<html\n<head>\n    <title>Setting Cookies with PHP</title>\n\
    </head>\n<body>\n    <?php echo \"Set Cookies\"?>\n</body>\n</html>\n```\n\n##\
    \ 使用 PHP 访问 Cookies\n\nPHP 提供了多种访问 cookies 方法。简单的方法是使用 `$_COOKIE` 或 `$_HTTP_COOKIEARS`。下面的示例将访问上面设置的所有\
    \ cookies。\n\n```html\n<html>\n<head>\n    <title>Accessing Cookies with PHP</title>\n\
    </head>\n<body>\n    <?php\n    echo $_COOKIE[\"name\"]. \"<br />\";\n    /* 等于\
    \ */\n    echo $_HTTP_COOKIEARS[\"name\"]. \"<br />\";\n    echo $_COOKIE[\"age\"\
    ] . \"<br />\";      \n    /* 等于 */\n    echo $_HTTP_COOKIEARS[\"age\"] . \"<br\
    \ />\";\n    ?>\n</body>\n</html>\n```\n\n你可以使用 `isset()` 函数检查 cookie 是否已设置。\n\
    \n```html\n<html>\n<head>\n    <title>Accessing Cookies with PHP</title>\n</head>\n\
    <body>\n    <?php\n    if( isset($_COOKIE[\"name\"]))\n        echo \"Welcome\
    \ \" . $_COOKIE[\"name\"] . \"<br />\";\n    else\n        echo \"Sorry... Not\
    \ recognized\" . \"<br />\";\n    ?>\n</body>\n</html>\n```\n\n## 使用 PHP 删除 Cookies\n\
    \n正式上，删除 cookie 应该只通过名称调用 `setcookie()`，但这并不总是有效，不过：\n\n```php\n<?php\nsetcookie(\"\
    name\", \"\", time()-3600, \"/\");\nsetcookie(\"age\", \"\", time()-3600, \"/\"\
    );\n?>\n<html>\n<head>\n    <title>Deleting Cookies with PHP</title>\n</head>\n\
    <body>\n    <?php echo \"Deleted Cookies\" ?>\n</body>\n</html>\n```\n\n"
