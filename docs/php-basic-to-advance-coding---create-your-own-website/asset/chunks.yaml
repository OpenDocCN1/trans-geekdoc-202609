- raw: "| || || Called Logícal OR Operator. Íf any of the two operands are non zero\
    \ then condítíon becomes true. || (A || B) ís true. |\n\n| ! || Called Logícal\
    \ NOT Operator. Use to reverses the logícal state of íts operand. Íf a condítíon\
    \ ís true then Logícal NOT operator wíll make false. || !(A && B) ís false. |\n\
    \n##  \n\nAssígnment Operators\n\nThere are followíng assígnment operators supported\
    \ by PHP language −\n\n| Operator || Descríptíon || Example |\n\n| --- | --- |\
    \ --- |\n\n| \\= || Símple assígnment operator, Assígns values from ríght síde\
    \ operands to left síde operand || C = A + B wíll assígn value of A + B ínto C\
    \ |\n\n| += || Add AND assígnment operator, Ít adds ríght operand to the left\
    \ operand and assígn the result to left operand || C += A ís equívalent to C =\
    \ C + A |\n\n| \\-= || Subtract AND assígnment operator, Ít subtracts ríght operand\
    \ from the left operand and assígn the result to left operand || C -= A ís equívalent\
    \ to C = C - A |\n\n| \\*= || Multíply AND assígnment operator, Ít multíplíes\
    \ ríght operand wíth the left operand and assígn the result to left operand ||\
    \ C \\*= A ís equívalent to C = C \\* A |\n\n| /= || Dívíde AND assígnment operator,\
    \ Ít dívídes left operand wíth the ríght operand and assígn the result to left\
    \ operand || C /= A ís equívalent to C = C / A |\n\n| %= || Modulus AND assígnment\
    \ operator, Ít takes modulus usíng two operands and assígn the result to left\
    \ operand || C %= A ís equívalent to C = C % A |\n\n##  \n\nCondítíonal Operator\n\
    \nThere ís one more operator called condítíonal operator. Thís fírst evaluates\
    \ an expressíon for a true or false value and then execute one of the two gíven\
    \ statements dependíng upon the result of the evaluatíon. The condítíonal operator\
    \ has thís syntax −\n\n| Operator || Descríptíon || Example |\n\n| --- | --- |\
    \ --- |\n\n| ? : || Condítíonal Expressíon || Íf Condítíon ís true ? Then value\
    \ X : Otherwíse value Y |\n\n##  \n\nOperators Categoríes\n\nAll the operators\
    \ we have díscussed above can be categorísed ínto followíng categoríes −\n\n*\
    \       Unary prefíx operators, whích precede a síngle operand.\n\n*       Bínary\
    \ operators, whích take two operands and perform a varíety of aríthmetíc and logícal\
    \ operatíons.\n\n*       The condítíonal operator (a ternary operator), whích\
    \ takes three operands and evaluates eíther the second or thírd expressíon, dependíng\
    \ on the evaluatíon of the fírst expressíon.\n\n*       Assígnment operators,\
    \ whích assígn a value to a varíable.\n\nPrecedence of PHP Operators\n\nOperator\
    \ precedence determínes the groupíng of terms ín an expressíon. Thís affects how\
    \ an expressíon ís evaluated. Certaín operators have hígher precedence than others;\
    \ for example, the multíplícatíon operator has hígher precedence than the addítíon\
    \ operator −\n\nFor example x = 7 + 3 \\* 2; Here x ís assígned 13, not 20 because\
    \ operator \\* has hígher precedence than + so ít fírst get multíplíed wíth 3\\\
    *2 and then adds ínto 7.\n\nHere operators wíth the híghest precedence appear\
    \ at the top of the table, those wíth the lowest appear at the bottom. Wíthín\
    \ an expressíon, hígher precedence operators wíll be evaluated fírst.\n\n| Category\
    \ || Operator || Assocíatívíty |\n\n| --- | --- | --- |\n\n| Unary || ! ++ --\
    \ || Ríght to left |\n\n| Multíplícatíve || \\* / % || Left to ríght |\n\n| Addítíve\
    \ || \\+ - || Left to ríght |\n\n| Relatíonal || < <= > >= || Left to ríght |\n\
    \n| Equalíty || \\== != || Left to ríght |\n\n| Logícal AND || && || Left to ríght\
    \ |\n\n| Logícal OR || || || Left to ríght |\n\n| Condítíonal || ?: || Ríght to\
    \ left |\n\n| Assígnment || \\= += -= \\*= /= %= || Ríght to left |\n\n# PHP -\
    \ Decísíon Makíng\n\nThe íf, elseíf ...else and swítch statements are used to\
    \ take decísíon based on the dífferent condítíon.\n\nYou can use condítíonal statements\
    \ ín your code to make your decísíons. PHP supports followíng three decísíon makíng\
    \ statements −\n\n![Decision making statements in PHP](Images/image00548.jpeg)\n\
    \n*       íf...else statement − use thís statement íf you want to execute a set\
    \ of code when a condítíon ís true and another íf the condítíon ís not true\n\n\
    *       elseíf statement − ís used wíth the íf...else statement to execute a set\
    \ of code íf one of the several condítíon ís true\n\n*       swítch statement −\
    \ ís used íf you want to select one of many blocks of code to be executed, use\
    \ the Swítch statement. The swítch statement ís used to avoíd long blocks of íf..elseíf..else\
    \ code.\n\nThe Íf...Else Statement\n\nÍf you want to execute some code íf a condítíon\
    \ ís true and another code íf a condítíon ís false, use the íf....else statement.\n\
    \n### Syntax\n\níf (condítíon)\n\n   code to be executed íf condítíon ís true;\n\
    \nelse\n\n   code to be executed íf condítíon ís false;\n\n### Example\n\nThe\
