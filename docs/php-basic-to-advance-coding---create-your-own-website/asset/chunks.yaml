  fmt: "\nFor your programming convenience several predefined character ranges, also\
    \ known as character classes, are available. Character classes specify an entire\
    \ range of characters, for example, the alphabet or an integer set −\n\n| Sr.No\
    \ | Expression & Description |\n| --- | --- |\n| 1 | `[::alpha:]` It matches any\
    \ string containing alphabetic characters `aA` through `zZ`. |\n| 2 | `[::digit:]`\
    \ It matches any string containing numerical digits `0` through `9`. |\n| 3 |\
    \ `[::alnum:]` It matches any string containing alphanumeric characters `aA` through\
    \ `zZ` and 0 through 9. |\n| 4 | `[::space:]` It matches any string containing\
    \ a space. |\n\n## PHP's Regexp POSIX Functions\n\nPHP currently offers seven\
    \ functions for searching strings using POSIX-style regular expressions − |\n\n\
    | Sr.No | Function & Description |\n| --- | --- |\n| 1 | [ereg()](https://www.tutorialspoint.com/php/php_ereg.htm)The\
    \ `ereg()` function searches a string specified by string for a string specified\
    \ by pattern, returning true if the pattern is found, and false otherwise. |\n\
    | 2 | [ereg_replace()](https://www.tutorialspoint.com/php/php_ereg_replace.htm)The\
    \ `ereg_replace()` function searches for string specified by pattern and replaces\
    \ pattern with replacement if found. |\n| 3 | [eregi()](https://www.tutorialspoint.com/php/php_eregi.htm)The\
    \ `eregi()` function searches throughout a string specified by pattern for a string\
    \ specified by string. The search is not case-sensitive. |\n| 4 | [eregi_replace()](https://www.tutorialspoint.com/php/php_eregi_replace.htm)The\
    \ `eregi_replace()` function operates exactly like `ereg_replace()`, except that\
    \ the search for pattern in string is not case-sensitive. |\n| 5 | [split()](https://www.tutorialspoint.com/php/php_split.htm)The\
    \ `split()` function will divide a string into various elements, the boundaries\
    \ of each element based on the occurrence of pattern in string. |\n| 6 | [spliti()](https://www.tutorialspoint.com/php/php_spliti.htm)The\
    \ `spliti()` function operates exactly in the same manner as its sibling `split()`,\
    \ except that it is not case-sensitive. |\n| 7 | [sql_regcase()](https://www.tutorialspoint.com/php/php_sql_regcase.htm)The\
    \ `sql_regcase()` function can be thought of as a utility function, converting\
    \ each character in the input parameter string into a bracketed expression containing\
    \ two characters. |\n\n## PERL Style Regular Expressions\n\nPerl-style regular\
    \ expressions are similar to their POSIX counterparts. The POSIX syntax can be\
    \ used almost interchangeably with the Perl-style regular expression functions.\
    \ In fact, you can use any of the quantifiers introduced in the previous POSIX\
    \ section.\n\nLets give explanation for few concepts being used in PERL regular\
    \ expressions. After that we'll introduce you with regular expression related\
    \ functions.\n\n### Meta characters\n\nA meta character is simply an alphabetical\
    \ character preceded by a backslash that acts to give the combination a special\
    \ meaning.\n\nFor instance, you can search for large money sums using the `\\\
    d` meta character: `/(\\\\\\d+)000/`, Here `\\d` will search for any string of\
    \ numerical character.\n\nFollowing is the list of meta characters which can be\
    \ used in PERL Style Regular Expressions.\n\n| Character | Description |\n| ---\
    \ | --- |\n| `.` | a single character |\n| `\\s` | a whitespace character (space,\
    \ tab, newline) |\n| `\\S` | a non-whitespace character |\n| `\\d` | a digit (0-9)\
    \ |\n| `\\D` | a non-digit |\n| `\\w` | a word character (a-z, A-Z, 0-9, _) |\n\
    | `\\W` | a non-word character |\n| `[aeiou]` matches a single character in the\
    \ given set |\n| `[^aeiou]` matches a single character outside the given set |\n\
    | `(foo|bar|baz)` matches any of alternatives |\n\n### Modifiers\n\nSeveral modifiers\
    \ are available that can make your work with regex easier, like case sensitivity.\n\
    \n| Modifier | Description |\n| --- | --- |\n| `i` | Makes the match case-insensitive\
    \ |\n| `g` | Globally finds all matches |\n| `m` | Evaluates the match per line\
    \ |\n| `s` | Allows use of `.` to match newline |\n| `u` | Allows use of UTF-8\
    \ characters |\n| `x` | Allows whitespace in the expression |\n\n## PHP's Regexp\
    \ Compatible Functions\n\nPHP offers following functions for searching strings\
    \ using Perl-compatible expressions:\n\n| Sr.No | Function & Description |\n|\
    \ --- | --- |\n| 1 | `preg_match()` returns true if pattern exists, and false\
    \ otherwise. |\n| 2 | `preg_match_all()` returns all occurrences of pattern. |\n\
    | 3 | `preg_replace()` operates like `replace()`, except with regex. |\n| 4 |\
    \ `preg_split()` operates exactly like `split()`, except it accepts input parameters.\
    \ |\n| 5 | `preg_grep()` returns all matches in input. |\n| 6 | `preg_quote()`\
    \ escapes regular expression characters |\n\n## PHP - Error Handling\n\nError\
    \ handling is the process of catching errors raised by your program and then taking\
    \ appropriate action. If you handle errors properly, it may lead to many unforeseen\
    \ consequences.\n\nUsing `die()` function\n\nWhile writing PHP you should check\
    \ all possible error condition before going ahead. Try following example with\
    \ file:\n\n```php\n<?php\nif(!file_exists(\"/tmp/test.txt\")) {\n    die(\"File\
    \ not found\");\n} else {\n    $file = fopen(\"/tmp/test.txt\",\"r\");\n    print\
    \ \"Open file successfully\";\n}\n// Test of the code\n?>\n```\n\nThis way you\
    \ can write efficient code. Using above technique you can stop your program whenever\
    \ it errors and display more meaningful and friendly message.\n\n### Defining\
    \ Custom Error Handler\n\nYou can write your own function to handle any error.\
    \ PHP provides you a framework to define. This function must be able to handle\
    \ a minimum of two parameters (error level and error message) but can accept up\
    \ to five parameters (optionally: file, line-number, and the error context).\n\
    \n### Syntax\n\n```php\nerror_function(error_level, error_message, error_file,\
    \ error_line, error_context);\n```\n\n| Sr.No | Parameter & Description |\n| ---\
    \ | --- |\n| 1 | `error_level` Required - Specifies the error report level for\
    \ the user-defined error. Must be a value number. |\n| 2 | `error_message` Required\
    \ - Specifies the error message for the user-defined error |\n| 3 | `error_file`\
    \ Optional - Specifies the file name where the error occurred |\n| 4 | `error_line`\
    \ Optional - Specifies the line number where the error occurred |\n| 5 | `error_context`\
    \ Optional - Specifies an array containing every variable and their values when\
    \ the error occurred |\n\n### Possible Error levels\n\nThese error report levels\
    \ are the different types of error the user-defined error handler can be used\
    \ for. These values can be used in combination using `|` operator:\n\n| Sr.No\
    \ | Constant & Description | Value |\n| --- | --- | --- |\n| 1 | `E_ERROR` Fatal\
    \ run-time errors. Execution of the script is halted | 1 |\n| 2 | `E_WARNING`\
    \ Non-fatal run-time errors. Execution of the script is not halted | 2 |\n"
  trans: "\n\n为了方便您的编程，提供了几个预定义的字符范围，也称为**字符类**。字符类指定了整个字符范围，例如，字母表或整数集 −\n\n| 序号\
    \ | 表达式 & 描述 |\n| --- | --- |\n| 1 | `[::alpha:]` 匹配任何包含字母 `aA` 到 `zZ` 的字符串。 |\n\
    | 2 | `[::digit:]` 匹配任何包含数字 `0` 到 `9` 的字符串。 |\n| 3 | `[::alnum:]` 匹配任何包含字母数字字符（`aA`\
    \ 到 `zZ` 以及数字 `0` 到 `9`）的字符串。 |\n| 4 | `[::space:]` 匹配任何包含空格的字符串。 |\n\n## PHP\
    \ 的 Regexp POSIX 函数\n\nPHP 目前提供了 7 个使用 POSIX 风格正则表达式搜索字符串的函数 − |\n\n| 序号 | 函数\
    \ & 描述 |\n| --- | --- |\n| 1 | [ereg()](https://www.tutorialspoint.com/php/php_ereg.htm)\
    \ `ereg()` 函数在指定的字符串中搜索指定的模式，如果找到模式则返回 true，否则返回 false。 |\n| 2 | [ereg_replace()](https://www.tutorialspoint.com/php/php_ereg_replace.htm)\
    \ `ereg_replace()` 函数搜索指定的模式，如果找到，则将模式替换为替换内容。 |\n| 3 | [eregi()](https://www.tutorialspoint.com/php/php_eregi.htm)\
    \ `eregi()` 函数在指定的字符串中全局搜索指定的模式。搜索不区分大小写。 |\n| 4 | [eregi_replace()](https://www.tutorialspoint.com/php/php_eregi_replace.htm)\
    \ `eregi_replace()` 函数的操作方式与 `ereg_replace()` 完全相同，只是在字符串中搜索模式时时不区分大小写。 |\n| 5\
    \ | [split()](https://www.tutorialspoint.com/php/php_split.htm) `split()` 函数将字符串划分为各种元素，每个元素的边界基于模式在字符串中出现的位置。\
    \ |\n| 6 | [spliti()](https://www.tutorialspoint.com/php/php_spliti.htm) `spliti()`\
    \ 函数的操作与其兄弟函数 `split()` 完全相同，只是它不区分大小写。 |\n| 7 | [sql_regcase()](https://www.tutorialspoint.com/php/php_sql_regcase.htm)\
    \ `sql_regcase()` 函数可以被认为是一个实用函数，将输入参数字符串中的每个字符转换为包含两个字符的括号表达式。 |\n\n## PERL 风格正则表达式\n\
    \nPerl 风格的正则表达式与其 POSIX 对应物相似。POSIX 语法几乎可以与 Perl 风格正则表达式函数互换使用。事实上，你可以使用上一个 POSIX\
    \ 部分中引入的任何量符。\n\n让我们对 PERL 正则表达式中的一些概念进行解释。之后，我们将为您介绍与正则表达式相关的函数。\n\n### 元字符\n\
    \n元字符简单来说就是一个带有反斜杠的字母字符，用于为该组合赋予特殊含义。\n\n例如，你可以使用元字符 `\\d` 搜索大金额：`/(\\\\\\d+)000/`。在这里，`\\\
    d` 将搜索任何数字字符字符串。\n\n以下是可以在 PERL 风格正则表达式中使用的元字符列表。\n\n| 字符 | 描述 |\n| --- | ---\
    \ |\n| `.` | 单个字符 |\n| `\\s` | 空白字符（空格、制表符、换行） |\n| `\\S` | 非空白字符 |\n| `\\d` |\
    \ 数字 (0-9) |\n| `\\D` | 非数字 |\n| `\\w` | 单词字符 (a-z, A-Z, 0-9, _) |\n| `\\W` |\
    \ 非单词字符 |\n| `[aeiou]` 匹配给定集合中的单个字符 |\n| `[^aeiou]` 匹配给定集合之外的单个字符 |\n| `(foo|bar|baz)`\
    \ 匹配任何备选其一 |\n\n### 修饰符\n\n提供了几种修饰符，可以让你的正则表达式工作更简单，例如大小写敏感性。\n\n| 修饰符 | 描述 |\n\
    | --- | --- |\n| `i` | 使匹配不区分大小写 |\n| `g` | 全局查找所有匹配项 |\n| `m` | 按行评估匹配 |\n| `s`\
    \ | 允许使用 `.` 匹配换行符 |\n| `u` | 允许使用 UTF-8 字符 |\n| `x` | 允许在表达式中使用空白 |\n\n## PHP\
    \ 的 Regexp 兼容函数\n\nPHP 提供了以下使用 Perl 兼容表达式搜索字符串的函数：\n\n| 序号 | 函数 & 描述 |\n| ---\
    \ | --- |\n| 1 | `preg_match()` 如果模式存在则返回 true，否则返回 false。 |\n| 2 | `preg_match_all()`\
    \ 返回模式的所有出现位置。 |\n| 3 | `preg_replace()` 操作方式与 `replace()` 类似，但使用的是正则表达式。 |\n\
    | 4 | `preg_split()` 操作与 `split()` 完全相同，但它接受输入参数。 |\n| 5 | `preg_grep()` 返回输入中的所有匹配项。\
    \ |\n| 6 | `preg_quote()` 转义正则表达式字符 |\n\n## PHP - 错误处理\n\n错误处理是捕获程序抛出的错误并采取相应行动的过程。如果不妥善处理错误，可能会导致许多意外的后果。\n\
    \n使用 `die()` 函数\n\n在编写 PHP 时，你应该检查所有可能的错误情况。尝试以下文件示例：\n\n```php\n<?php\nif(!file_exists(\"\
    /tmp/test.txt\")) {\n    die(\"文件不存在\");\n} else {\n    $file = fopen(\"/tmp/test.txt\"\
    ,\"r\");\n    print \"打开成功\";\n}\n// 测试代码\n?>\n```\n\n这种这种你可以编写高效的代码。使用上述技术你可以在程序出错时停止并显示更有意义且友好的信息。\n\
    \n### 定义自定义错误处理器\n\n你可以编写自己的函数来处理任何错误。PHP 提供了一个定义框架。该函数必须能够处理两个参数（错误级别和错误消息），但可以接受五个参数（可选：文件、行号和错误上下文）。\n\
    \n### 语法\n\n```php\nerror_function(error_level, error_message, error_file, error_line,\
    \ error_context);\n```\n\n| 序号 | 参数 & 描述 |\n| --- | --- |\n| 1 | `error_level`\
    \ 必需。指定自定义错误的报告级别。必须是一个数值。 |\n| 2 | `error_message` 必需。指定自定义错误的消息 |\n| 3 | `error_file`\
    \ 可选。指定发生错误的文件名 |\n| 4 | `error_line` 可选。指定发生错误的行号 |\n| 5 | `error_context` 可选。指定包含错误发生时每个变量及其值的数组\
    \ |\n\n### 可能的错误级别\n\n这些错误报告级别是自定义错误处理器可以使用的不同错误类型。这些值可以使用 `|` 运算符组合使用：\n\n| 序号\
    \ | 常量 & 描述 | 值 |\n| --- | --- | --- |\n| 1 | `E_ERROR` 致命运行时错误。脚本停止执行 | 1 |\n\
    | 2 | `E_WARNING` 非致命运行时错误。脚本不停止执行 | 2 |\n\n"
