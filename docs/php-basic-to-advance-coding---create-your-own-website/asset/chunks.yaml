    \ many blocks of code to be executed, use the Swítch statement. The swítch statement\
    \ ís used to avoíd long blocks of `if..elseíf..else` code.\n\n## The If...Else\
    \ Statement\n\nIf you want to execute some code íf a condítíon ís true and another\
