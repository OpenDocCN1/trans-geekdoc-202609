  trans: "\n\n若要完整学习 AJAX，请参考 [AJAX 教程](https://www.tutorialspoint.com/ajax/index.htm)。\n\
    \n# PHP 和 AJAX 示例\n\n为了清晰地演示如何使用 Ajax 和 PHP 从数据库中获取信息是多么简单，我们将动态构建 MySQL 查询并将结果显示在\
    \ \"ajax.html\" 上。在继续之前，让我们先做一些基础准备工作。使用以下命令创建一个表。\n\n**注意** − 我们假设你拥有足够的权限执行以下\
    \ MySQL 操作。\n\n```sql\nCREATE TABLE `ajax_example` (\n  `name` varchar(50) NOT\
    \ NULL,\n  `age` int(11) NOT NULL,\n  `sex` varchar(1) NOT NULL,\n  `wpm` int(11)\
    \ NOT NULL,\n  PRIMARY KEY (`name`)\n)\n```\n\n现在，使用以下 SQL 语句将以下数据转储到该表中。\n\n\
    ```sql\nINSERT INTO `ajax_example` VALUES ('Jerry', 120, 'm', 20);\nINSERT INTO\
    \ `ajax_example` VALUES ('Regís', 75, 'm', 44);\nINSERT INTO `ajax_example` VALUES\
    \ ('Frank', 45, 'm', 87);\nINSERT INTO `ajax_example` VALUES ('Jíll', 22, 'f',\
    \ 72);\nINSERT INTO `ajax_example` VALUES ('Tracy', 27, 'f', 0);\nINSERT INTO\
    \ `ajax_example` VALUES ('Julíe', 35, 'f', 90);\n```\n\n## 客户端 HTML 文件\n\n现在让我们创建客户端\
    \ HTML 文件，即 ajax.html，它将包含以下代码：\n\n```html\n<html>\n  <body>\n      <script language=\"\
    javascript\" type=\"text/javascript\">\n        <!--\n          // 浏览器支持代码\n \
    \         function ajaxFunction() {\n            var ajaxRequest;  // 让 Ajax 成为可能的变量\n\
    \            try {\n              // Opera 8.0+, Firefox, Safari\n           \
    \   ajaxRequest = new XMLHttpRequest();\n            }catch (e) {\n          \
    \    // Internet Explorer 浏览器\n              try {\n                ajaxRequest\
    \ = new ActiveXObject(\"Msxml2.XMLHTTP\");\n              }catch (e) {\n     \
    \           try {\n                  ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n                }catch (e) {\n                  // 出了某些错误\n              \
    \    alert(\"您的浏览器崩溃了！\");\n                  return false;\n                }\n\
    \              }\n            }\n            // 创建一个函数来接收从服务器\n            //\
    \ 发送的数据并在同一页面中进行更新。\n            ajaxRequest.onreadystatechange = function() {\n\
    \              if(ajaxRequest.readyState == 4) {\n                var display\
    \ = document.getElementById('ajaxDiv');\n                display.innerHTML = ajaxRequest.responseText;\n\
    \              }\n            }\n            // 现在从用户处获取值并传递给\n            //\
    \ 服务器脚本。\n            var age = document.getElementById('age').value;\n      \
    \      var wpm = document.getElementById('wpm').value;\n            var sex =\
    \ document.getElementById('sex').value;\n            var queryString = \"?age=\"\
    \ + age ;\n            queryString += \"&wpm=\" + wpm + \"&sex=\" + sex;\n   \
    \         ajaxRequest.open(\"GET\", \"ajax-example.php\" + queryString, true);\n\
    \            ajaxRequest.send(null); \n          }\n        -->\n      </script>\n\
    \      <form name=\"myForm\">\n        最大年龄: <input type=\"text\" id=\"age\" />\
    \ <br />\n        最大 WPM: <input type=\"text\" id=\"wpm\" /> <br />\n        性别:\
    \ <select id=\"sex\">\n          <option value=\"m\">m</option>\n          <option\
    \ value=\"f\">f</option>\n        </select>\n        <input type=\"button\" onclick='ajaxFunction()'\
    \ value='查询 MySQL'/>\n      </form>\n      <div id=\"ajaxDiv\">您的结果将在这里显示</div>\n\
    \  </body>\n</html>\n```\n\n**注意** — 在查询中传递变量的方法符合 HTTP 标准，并具有表单形式。\n`URL?variable1=value1&variable2=value2;`\n\
    \n现在，上述代码将为你提供如下所示的屏幕。\n\n**注意** — 这是一个虚拟屏幕，无法工作。\n最大年龄：![](img/image00561.jpeg)\n\
    最大 WPM：![](img/image00561.jpeg)\n性别：![](img/image00562.jpeg)\n您的结果将在这里显示\n\n##\
    \ 服务端 PHP 文件\n\n现在你的客户端脚本准备好了。现在我们必须编写服务端脚本，它将从数据库获取年龄、wpm 和性别并将其发送回客户端。将以下代码放入\
    \ `ajax-example.php`：\n\n```php\n<?php\n$dbhost = \"localhost\";\n$dbuser = \"\
    username\";\n$dbpass = \"password\";\n$dbname = \"dbname\";\n\n// 连接到 MySQL\n\
    mysql_connect($dbhost, $dbuser, $dbpass);\n\n// 选择数据库\nmysql_select_db($dbname)\
    \ or die(mysql_error());\n\n// 从查询中检索数据\n$age = $_GET['age'];\n$sex = $_GET['sex'];\n\
    $wpm = $_GET['wpm'];\n\n// 转义用户输入以注入\n$age = mysql_real_string($age);\n$sex =\
    \ mysql_real_string($sex);\n$wpm = mysql_real_string($wpm);\n\n// 构建查询\n$query\
    \ = \"SELECT * FROM ajax_example WHERE sex = '$sex'\";\nif($age) $query .= \"\
    \ AND age <= $age\";\nif($wpm) $query .= \" AND wpm <= $wpm\";\n\n// 执行查询\n$qry_result\
    \ = mysql_query($query) or die(mysql_error());\n\n// 构建结果字符串\n$display_string\
    \ = \"<table>\";\n$display_string += \"<tr><th>Name</th>\";\n$display_string +=\
    \ \"<th>Age</th>\";\n$display_string += \"<th>Sex</th>\";\n$display_string +=\
    \ \"<th>WPM</th></tr>\";\n\n// 为返回的每个人在表格插入行\nwhile($row = mysql_fetch_array($qry_result))\
    \ {\n  $display_string += \"<tr>\";\n  $display_string += \"<td>$row['name']</td>\"\
    ;\n  $display_string += \"<td>$row['age']</td>\";\n  $display_string += \"<td>$row['sex']</td>\"\
    ;\n  $display_string += \"<td>$row['wpm']</td>\";\n  $display_string += \"</tr>\"\
    ;\n}\n\necho \"查询: \" . $query . \"<br />\";\n$display_string .= \"</table>\"\
    ;\necho $display_string;\n?>\n```\n\n现在尝试在“最大年龄”或任何框中输入有效值，然后点击“查询 MySQL”。\n\n\
    # PHP & XML\n\nXML 是一种看起来非常像 HTML 的标记语言。XML 文档是纯文本并包含由 `<` 和 `>` 分隔的标签。XML 和 HTML\
    \ 有两个主要区别：\n\n- XML 没有定义必须使用的特定标签集。\n- XML 对文档结构非常挑。\n\nXML 比 HTML 提供了更大的自由。HTML\
    \ 有一组特定的标签：`<a>` 标签包裹链接，`<p>` 标签开始段落等等。然而，XML 文档可以使用任何标签。可以将 `<rating></rating>`\
    \ 标签包裹在电影评分周围，可以将 `<height></height>` 标签包裹在人的身高周围。因此，XML 提供了自定义标签的选项。\n\n## 不是有效的\
    \ XML 列表\n\n```xml\n<ul>\n  <li>清炒虾仁\n  <li>宫炸鸡皮\n  <li>红烧鸭肉</li>\n</ul>\n```\n\
    这不是一个有效的 XML 文档，因为没有闭合的 `</li>` 标签来匹配三个打开的 `<li>` 标签。XML 文档中的每个打开标签都必须关闭。\n\n\
    ## 有效的 XML 列表\n\n```xml\n<ul>\n  <li>清炒虾仁</li>\n  <li>宫炸鸡皮</li>\n  <li>红烧鸭肉</li>\n\
    </ul>\n```\n\n# 解析 XML 文档\n\nPHP 5 新的 `SimpleXML` 模块让解析 XML 文档变得非常简单。它将 XML 文档转换为对象，提供对\
    \ XML 的结构化访问。\n"
