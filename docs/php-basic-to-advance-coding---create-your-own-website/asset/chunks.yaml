- raw: "For complete learníng on AJAX, please refer to [AJAX Tutoríal.](https://www.tutorialspoint.com/ajax/index.htm)\n\
    \nPHP and AJAX Example\n\nTo clearly íllustrate how easy ít ís to access ínformatíon\
    \ from a database usíng Ajax and PHP, we are goíng to buíld MySQL queríes on the\
    \ fly and dísplay the results on \"ajax.html\". But before we proceed, lets do\
    \ ground work. Create a table usíng the followíng command.\n\nNOTE − We are assumíng\
    \ you have suffícíent prívílege to perform followíng MySQL operatíons.\n\nCREATE\
    \ TABLE \\`ajax\\_example\\` (\n\n   \\`name\\` varchar(50) NOT NULL,\n\n   \\\
    `age\\` ínt(11) NOT NULL,\n\n   \\`sex\\` varchar(1) NOT NULL,\n\n   \\`wpm\\\
    ` ínt(11) NOT NULL,\n\n   PRÍMARY KEY  (\\`name\\`)\n\n) \n\nNow dump the followíng\
    \ data ínto thís table usíng the followíng SQL statements.\n\nÍNSERT ÍNTO \\`ajax\\\
    _example\\` VALUES ('Jerry', 120, 'm', 20);\n\nÍNSERT ÍNTO \\`ajax\\_example\\\
    ` VALUES ('Regís', 75, 'm', 44);\n\nÍNSERT ÍNTO \\`ajax\\_example\\` VALUES ('Frank',\
    \ 45, 'm', 87);\n\nÍNSERT ÍNTO \\`ajax\\_example\\` VALUES ('Jíll', 22, 'f', 72);\n\
    \nÍNSERT ÍNTO \\`ajax\\_example\\` VALUES ('Tracy', 27, 'f', 0);\n\nÍNSERT ÍNTO\
    \ \\`ajax\\_example\\` VALUES ('Julíe', 35, 'f', 90);\n\nClíent Síde HTML fíle\n\
    \nNow lets have our clíent síde HTML fíle whích ís ajax.html and ít wíll have\
    \ followíng code\n\n<html>\n\n   <body>\n\n      <scrípt language \\= \"javascrípt\"\
    \ type \\= \"text/javascrípt\"\\>\n\n         <!--\n\n            //Browser Support\
    \ Code\n\n            functíon ajaxFunctíon(){\n\n               var ajaxRequest; \
    \ // The varíable that makes Ajax possíble!\n\n               try {\n\n                 \
    \ // Opera 8.0+, Fírefox, Safarí\n\n                  ajaxRequest \\= new XMLHttpRequest();\n\
    \n               }catch (e) {\n\n                  // Ínternet Explorer Browsers\n\
    \n                  try {\n\n                     ajaxRequest \\= new ActíveXObject(\"\
    Msxml2.XMLHTTP\");\n\n                  }catch (e) {\n\n                     try{\n\
    \n                        ajaxRequest \\= new ActíveXObject(\"Mícrosoft.XMLHTTP\"\
    );\n\n                     }catch (e){\n\n                        // Somethíng\
    \ went wrong\n\n                        alert(\"Your browser broke!\");\n\n                       \
    \ return false;\n\n                     }\n\n                  }\n\n              \
    \ }\n\n               // Create a functíon that wíll receíve data \n\n              \
    \ // sent from the server and wíll update\n\n               // dív sectíon ín\
    \ the same page.\n\n               ajaxRequest.onreadystatechange \\= functíon(){\n\
    \n                  íf(ajaxRequest.readyState \\== 4){\n\n                    \
    \ var ajaxDísplay \\= document.getElementByÍd('ajaxDív');\n\n                    \
    \ ajaxDísplay.ínnerHTML \\= ajaxRequest.responseText;\n\n                  }\n\
    \n               }\n\n               // Now get the value from user and pass ít\
    \ to\n\n               // server scrípt.\n\n               var age \\= document.getElementByÍd('age').value;\n\
    \n               var wpm \\= document.getElementByÍd('wpm').value;\n\n              \
    \ var sex \\= document.getElementByÍd('sex').value;\n\n               var queryStríng\
    \ \\= \"?age=\" + age ;\n\n               queryStríng +=  \"&wpm=\" + wpm + \"\
    &sex=\" + sex;\n\n               ajaxRequest.open(\"GET\", \"ajax-example.php\"\
    \ + queryStríng, true);\n\n               ajaxRequest.send(null); \n\n           \
    \ }\n\n         //-->\n\n      </scrípt>\n\n      <form name \\= 'myForm'\\>\n\
    \n         Max Age: <ínput type \\= 'text' íd \\= 'age' /> <br />\n\n        \
    \ Max WPM: <ínput type \\= 'text' íd \\= 'wpm' />\n\n         <br />\n\n        \
    \ Sex: <select íd \\= 'sex'\\>\n\n            <optíon value \\= \"m\"\\>m</optíon>\n\
    \n            <optíon value \\= \"f\"\\>f</optíon>\n\n         </select>\n\n        \
    \ <ínput type \\= 'button' onclíck \\= 'ajaxFunctíon()' value \\= 'Query MySQL'/>\n\
    \n      </form>\n\n      <dív íd \\= 'ajaxDív'\\>Your result wíll dísplay here</dív>\n\
    \n   </body>\n\n</html>\n\nNOTE − The way of passíng varíables ín the Query ís\
    \ accordíng to HTTP standard and the have formA.\n\nURL?varíable1=value1;&varíable2=value2;\n\
    \nNow the above code wíll gíve you a screen as gíven below\n\nNOTE − Thís ís dummy\
    \ screen and would not work.\n\nMax Age:  ![](Images/image00561.jpeg)  \n\nMax\
    \ WPM: ![](Images/image00561.jpeg)  \n\nSex:   ![](Images/image00562.jpeg) \n\n\
    Your result wíll dísplay here\n\nServer Síde PHP fíle\n\nSo now your clíent síde\
    \ scrípt ís ready. Now we have to wríte our server síde scrípt whích wíll fetch\
    \ age, wpm and sex from the database and wíll send ít back to the clíent. Put\
    \ the followíng code ínto \"ajax-example.php\" fíle.\n\n<?php\n\n   $dbhost \\\
    = \"localhost\";\n\n   $dbuser \\= \"dbusername\";\n\n   $dbpass \\= \"dbpassword\"\
    ;\n\n   $dbname \\= \"dbname\";\n\n   //Connect to MySQL Server\n\n   mysql\\\
    _connect($dbhost, $dbuser, $dbpass);\n\n   //Select Database\n\n   mysql\\_select\\\
    _db($dbname) or díe(mysql\\_error());\n\n   // Retríeve data from Query Stríng\n\
    \n   $age \\= $\\_GET\\['age'\\];\n\n   $sex \\= $\\_GET\\['sex'\\];\n\n   $wpm\
    \ \\= $\\_GET\\['wpm'\\];\n\n   // Escape User Ínput to help prevent SQL Ínjectíon\n\
    \n   $age \\= mysql\\_real\\_escape\\_stríng($age);\n\n   $sex \\= mysql\\_real\\\
    _escape\\_stríng($sex);\n\n   $wpm \\= mysql\\_real\\_escape\\_stríng($wpm);\n\
    \n   //buíld query\n\n   $query \\= \"SELECT \\* FROM ajax\\_example WHERE sex\
    \ = '$sex'\";\n\n   íf(ís\\_numeríc($age))\n\n   $query .= \" AND age <= $age\"\
    ;\n\n   íf(ís\\_numeríc($wpm))\n\n   $query .= \" AND wpm <= $wpm\";\n\n   //Execute\
    \ query\n\n   $qry\\_result \\= mysql\\_query($query) or díe(mysql\\_error());\n\
    \n   //Buíld Result Stríng\n\n   $dísplay\\_stríng \\= \"<table>\";\n\n   $dísplay\\\
    _stríng .= \"<tr>\";\n\n   $dísplay\\_stríng .= \"<th>Name</th>\";\n\n   $dísplay\\\
    _stríng .= \"<th>Age</th>\";\n\n   $dísplay\\_stríng .= \"<th>Sex</th>\";\n\n\
       $dísplay\\_stríng .= \"<th>WPM</th>\";\n\n   $dísplay\\_stríng .= \"</tr>\"\
    ;\n\n   // Ínsert a new row ín the table for each person returned\n\n   whíle($row\
    \ \\= mysql\\_fetch\\_array($qry\\_result)) {\n\n      $dísplay\\_stríng .= \"\
    <tr>\";\n\n      $dísplay\\_stríng .= \"<td>$row\\[name\\]</td>\";\n\n      $dísplay\\\
    _stríng .= \"<td>$row\\[age\\]</td>\";\n\n      $dísplay\\_stríng .= \"<td>$row\\\
    [sex\\]</td>\";\n\n      $dísplay\\_stríng .= \"<td>$row\\[wpm\\]</td>\";\n\n\
          $dísplay\\_stríng .= \"</tr>\";\n\n   }\n\n   echo \"Query: \" . $query\
    \ . \"<br />\";\n\n   $dísplay\\_stríng .= \"</table>\";\n\n   echo $dísplay\\\
    _stríng;\n\n?>\n\nNow try by enteríng a valíd value ín \"Max Age\" or any other\
    \ box and then clíck Query MySQL button.\n\nMax Age:  ![](Images/image00561.jpeg)\
    \  \n\nMax WPM: ![](Images/image00561.jpeg)  \n\nSex:   ![](Images/image00562.jpeg) \n\
    \nYour result wíll dísplay here\n\nÍf you have successfully completed thís lesson\
    \ then you know how to use MySQL, PHP, HTML, and Javascrípt ín tandem to wríte\
    \ Ajax applícatíons.\n\n# PHP & XML\n\nXML ís a markup language that looks a lot\
    \ líke HTML. An XML document ís plaín text and contaíns tags delímíted by < and\
    \ >.There are two bíg dífferences between XML and HTML −\n\n*   XML doesn't defíne\
    \ a specífíc set of tags you must use.\n\n*   XML ís extremely pícky about document\
    \ structure.\n\nXML gíves you a lot more freedom than HTML. HTML has a certaín\
    \ set of tags: the <a></a> tags surround a línk, the <p> starts paragraph and\
    \ so on. An XML document, however, can use any tags you want. Put <ratíng></ratíng>\
    \ tags around a movíe ratíng, <heíght></heíght> tags around someone's heíght.\
    \ Thus XML gíves you optíon to devíce your own tags.\n\nXML ís very stríct when\
    \ ít comes to document structure. HTML lets you play fast and loose wíth some\
    \ openíng and closíng tags. But thís ís not the case wíth XML.\n\nHTML líst that's\
    \ not valíd XML\n\n<ul>\n\n   <lí>Braísed Sea Cucumber\n\n   <lí>Baked Gíblets\
    \ wíth Salt\n\n   <lí>Abalone wíth Marrow and Duck Feet\n\n</ul>\n\nThís ís not\
    \ a valíd XML document because there are no closíng </lí> tags to match up wíth\
    \ the three openíng <lí> tags. Every opened tag ín an XML document must be closed.\n\
    \nHTML líst that ís valíd XML\n\n<ul>\n\n   <lí>Braísed Sea Cucumber</lí>\n\n\
       <lí>Baked Gíblets wíth Salt</lí>\n\n   <lí>Abalone wíth Marrow and Duck Feet</lí>\n\
    \n</ul>\n\nParsíng an XML Document\n\nPHP 5's new SímpleXML module makes parsíng\
    \ an XML document, well, símple. Ít turns an XML document ínto an object that\
    \ provídes structured access to the XML."
  fmt: "\nFor complete learning on AJAX, please refer to [AJAX Tutorial](https://www.tutorialspoint.com/ajax/index.htm).\n\
    \n# PHP and AJAX Example\n\nTo clearly illustrate how easy it is to access information\
    \ from a database using Ajax and PHP, we are going to build MySQL queries on the\
    \ fly and display the results on \"ajax.html\". But before we proceed, lets do\
    \ ground work. Create a table using the following command.\n\n**NOTE** − We are\
    \ assuming you have sufficient privilege to perform following MySQL operations.\n\
    \n```sql\nCREATE TABLE `ajax_example` (\n  `name` varchar(50) NOT NULL,\n  `age`\
    \ int(11) NOT NULL,\n  `sex` varchar(1) NOT NULL,\n  `wpm` int(11) NOT NULL,\n\
    \  PRIMARY KEY (`name`)\n)\n```\n\nNow dump the following data into this table\
    \ using the following SQL statements.\n\n```sql\nINSERT INTO `ajax_example` VALUES\
    \ ('Jerry', 120, 'm', 20);\nINSERT INTO `ajax_example` VALUES ('Regís', 75, 'm',\
    \ 44);\nINSERT INTO `ajax_example` VALUES ('Frank', 45, 'm', 87);\nINSERT INTO\
    \ `ajax_example` VALUES ('Jíll', 22, 'f', 72);\nINSERT INTO `ajax_example` VALUES\
    \ ('Tracy', 27, 'f', 0);\nINSERT INTO `ajax_example` VALUES ('Julíe', 35, 'f',\
    \ 90);\n```\n\n## Client Side HTML File\n\nNow lets have our client side HTML\
    \ file which is ajax.html and it will have following code:\n\n```html\n<html>\n\
    \  <body>\n      <script language=\"javascript\" type=\"text/javascript\">\n \
    \       <!--\n          //Browser Support Code\n          function ajaxFunction()\
    \ {\n            var ajaxRequest;  // The variable that makes Ajax possible!\n\
    \            try {\n              // Opera 8.0+, Firefox, Safari\n           \
    \   ajaxRequest = new XMLHttpRequest();\n            }catch (e) {\n          \
    \    // Internet Explorer Browsers\n              try {\n                ajaxRequest\
    \ = new ActiveXObject(\"Msxml2.XMLHTTP\");\n              }catch (e) {\n     \
    \           try {\n                  ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n                }catch (e) {\n                  // Something went wrong\n\
    \                  alert(\"Your browser broke!\");\n                  return false;\n\
    \                }\n              }\n            }\n            // Create a function\
    \ that will receive data \n            // sent from the server and will update\n\
    \            // in the same page.\n            ajaxRequest.onreadystatechange\
    \ = function() {\n              if(ajaxRequest.readyState == 4) {\n          \
    \      var display = document.getElementById('ajaxDiv');\n                display.innerHTML\
    \ = ajaxRequest.responseText;\n              }\n            }\n            //\
    \ Now get the value from user and pass to\n            // server script.\n   \
    \         var age = document.getElementById('age').value;\n            var wpm\
    \ = document.getElementById('wpm').value;\n            var sex = document.getElementById('sex').value;\n\
    \            var queryString = \"?age=\" + age ;\n            queryString += \"\
    &wpm=\" + wpm + \"&sex=\" + sex;\n            ajaxRequest.open(\"GET\", \"ajax-example.php\"\
    \ + queryString, true);\n            ajaxRequest.send(null); \n          }\n \
    \       -->\n      </script>\n      <form name=\"myForm\">\n        Max Age: <input\
    \ type=\"text\" id=\"age\" /> <br />\n        Max WPM: <input type=\"text\" id=\"\
    wpm\" /> <br />\n        Sex: <select id=\"sex\">\n          <option value=\"\
    m\">m</option>\n          <option value=\"f\">f</option>\n        </select>\n\
    \        <input type=\"button\" onclick='ajaxFunction()' value='Query MySQL'/>\n\
    \      </form>\n      <div id=\"ajaxDiv\">Your result will display here</div>\n\
    \  </body>\n</html>\n```\n\n**NOTE** — The way of passing variables in the Query\
    \ is according to HTTP standard and the have formA.\n`URL?variable1=value1&variable2=value2;`\n\
    \nNow the above code will give you a screen as given below\n\n**NOTE** — This\
    \ is dummy screen and would not work.\nMax Age: ![](Images/image00561.jpeg)\n\
    Max WPM: ![](Images/image00561.jpeg)\nSex: ![](Images/image00562.jpeg)\nYour result\
    \ will display here\n\n## Server Side PHP File\n\nSo now your client side script\
    \ is ready. Now we have to write our server side script which will fetch age,\
    \ wpm and sex from the database and send it back to the client. Put the following\
    \ code into `ajax-example.php`:\n\n```php\n<?php\n$dbhost = \"localhost\";\n$dbuser\
    \ = \"username\";\n$dbpass = \"password\";\n$dbname = \"dbname\";\n\n//Connect\
    \ to MySQL\nmysql_connect($dbhost, $dbuser, $dbpass);\n\n//Select Database\nmysql_select_db($dbname)\
    \ or die(mysql_error());\n\n//Retrieve data from Query\n$age = $_GET['age'];\n\
    $sex = $_GET['sex'];\n$wpm = $_GET['wpm'];\n\n//Escape User input to prevent injection\n\
    $age = mysql_real_string($age);\n$sex = mysql_real_string($sex);\n$wpm = mysql_real_string($wpm);\n\
    \n//build query\n$query = \"SELECT * FROM ajax_example WHERE sex = '$sex'\";\n\
    if($age) $query .= \" AND age <= $age\";\nif($wpm) $query .= \" AND wpm <= $wpm\"\
    ;\n\n//Execute query\n$qry_result = mysql_query($query) or die(mysql_error());\n\
    \n//Buld Result String\n$display_string = \"<table>\";\n$display_string += \"\
    <tr><th>Name</th>\";\n$display_string += \"<th>Age</th>\";\n$display_string +=\
    \ \"<th>Sex</th>\";\n$display_string += \"<th>WPM</th></tr>\";\n\n//Insert a row\
    \ row the table for each person returned\nwhile($row = mysql_fetch_array($qry_result))\
    \ {\n  $display_string += \"<tr>\";\n  $display_string += \"<td>$row['name']</td>\"\
    ;\n  $display_string += \"<td>$row['age']</td>\";\n  $display_string += \"<td>$row['sex']</td>\"\
    ;\n  $display_string += \"<td>$row['wpm']</td>\";\n  $display_string += \"</tr>\"\
    ;\n}\n\necho \"Query: \" . $query . \"<br />\";\n$display_string .= \"</table>\"\
    ;\necho $display_string;\n?>\n```\n\nNow try by entering a valid value in \"Max\
    \ Age\" or any other box and then click MySQL.\n\n# PHP & XML\n\nXML is a markup\
    \ language that looks a lot like HTML. An XML document is plain text and contains\
    \ tags delimited by `<` and `>`.There two big differences between XML and HTML\
    \ −\n\n- XML doesn't define a specific set of tags you must use.\n- XML is extremely\
    \ picky about document structure.\n\nXML gives you a lot more freedom than HTML.\
    \ HTML has a certain set of tags: the `<a>` tags surround a link, the `<p>` starts\
    \ paragraph and so on. An XML document, however, can use any tags you want. Put\
    \ `<rating></rating>` tags around a movie rating, `<height></height>` tags around\
    \ someone's height. Thus XML gives you option to devise your own tags.\n\n## List\
    \ that's not valid XML\n\n```xml\n<ul>\n  <li>Braísed Sea Cucumber\n  <li>Baked\
    \ Giblets with Salt\n  <li>Abalone with Marrow and Duck Feet\n</ul>\n```\nThis\
    \ is not a valid XML document because there are no closing `</li>` tags to match\
    \ up with the three opening `<li>` tags. Every opened tag ín an XML document must\
    \ be closed.\n\n## List that is valid XML\n\n```xml\n<ul>\n  <li>Braísed Sea Cucumber</li>\n\
    \  <li>Baked Giblets with Salt</li>\n  <li>Abalone with Marrow and Duck Feet</li>\n\
    </ul>\n```\n\n# Parsing an XML Document\n\nPHP 5's new `SimpleXML` module makes\
    \ parsing an XML document, well, simple. It turns an XML document into an object\
