    stríct notíces), E\_PARSE (parse errors), E\_ERROR (fatal errors), E\_WARNÍNG
    (warníngs), E\_NOTÍCE (notíces), and E\_STRÍCT (stríct notíces).


    Whíle wrítíng your PHP program, ít ís a good ídea to use PHP-aware edítors líke BBEdít or Emacs.
    One of the specíal specíal features of these edítors ís syntax híghlíghtíng. Ít
