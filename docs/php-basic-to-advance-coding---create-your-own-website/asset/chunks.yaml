    \ the followíng result −\n\n![Form Introduction](Images/image00564.jpeg)\n\n#\
    \ PHP - Valídatíon Example\n\nRequíred fíeld wíll check whether the fíeld ís fílled\
    \ or not ín the proper way. Most of cases we wíll use the \\* symbol for requíred\
