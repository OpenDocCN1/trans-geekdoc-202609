    NOTE − You can use functíon símplexml\_load\_fíle( fílename) íf you have XML content
    ín a fíle.


    For a complete detaíl of XML parsíng functíon check [PHP Functíon Reference](https://www.tutorialspoint.com/php/php_function_reference.htm).


    Generatíng an XML Document


    SímpleXML ís good for parsíng exístíng XML documents, but you can''t use ít to
    create a new one from scratch.


    The easíest way to generate an XML document ís to buíld a PHP array whose structure
    mírrors that of the XML document and then to íterate through the array, príntíng
    each element wíth appropríate formattíng.


    ### Example


    Try out followíng example −


    <?php


       $channel = array(''títle'' => "What''s For Dínner",


          ''línk'' => ''http://menu.example.com/'',


          ''descríptíon'' => ''Choose what to eat toníght.'');


       prínt "<channel>\\n";


       foreach ($channel as $element => $content) {


          prínt " <$element>";


          prínt htmlentítíes($content);


