    \ new page with new information from the server.\n* With AJAX when submit is pressed,\
    \ JavaScript will make a request to the server, interpret the results and update\
    \ the current screen. In the purest sense, the user would never know that anything\
    \ was even transmitted to the server.\n"
  trans: "\n此外，妥善处理所有错误并将所有跟踪消息重定向到系统日志文件中，这样如果发生任何问题，它将会被记录在系统日志文件中，你将能够调试该问题。\n\n\
    # PHP - 日期与时间\n\n日期是日常生活中如此重要的一部分，以至于在不经思考的情况下就能进行操作。PHP 还提供了强大的日期算术工具，使得操作日期变得非常简单。\n\
    \n## 使用 time() 获取时间戳\n\nPHP 的 `time()` 函数为您提供有关当前日期和时间所需的所有信息。它不需要任何参数，但会返回一个整数。\n\
    \n`time()` 返回的整数表示自 1970 年 1 月 1 日 GMT 午夜以来经过的秒数。这一时刻被称为 Unix 纪（UNIX epoch），从那时经过的秒数被称为时间戳。\n\
    \n```php\n<?php\n  print time();\n?>\n```\n\n这将产生以下结果 −\n\n1480930103\n\n这可能很难理解。但\
    \ PHP 提供了优秀的工具，可以将时间戳转换为人类熟悉的格式。\n\n## 使用 getdate() 转换时间戳\n\n`getdate()` 函数可选地接受一个时间戳，并返回一个包含日期信息的关联数组。如果你省略时间戳，它将与\
    \ `time()` 返回的当前时间戳运行。\n\n下表列出了 `getdate()` 返回的数组中包含的元素。\n\n| 序号 | 键与描述 | 示例 |\n\
    | --- | --- | --- |\n| 1 | seconds 过的秒 (0-59) | 20 |\n| 2 | minutes 小时过的分 (0-59)\
    \ | 29 |\n| 3 | hours 天中的小时 (0-23) | 22 |\n| 4 | mday 月中的第几天 (1-31) | 11 |\n|\
    \ 5 | wday 周中的第几天 (0-6) | 4 |\n| 6 | mon 年中的月份 (1-12) | 7 |\n| 7 | year 年份 (4\
    \ 位数) | 1997 |\n| 8 | yday 一年的第几天 (0-365) | 19 |\n| 9 | weekday 星期几 | Thursday\
    \ |\n| 10 | month 年中的月份 | January |\n| 11 | 0 时间戳 | 948370048 |\n\n现在你对日期和时间有了完全的控制。你可以按照需要的任何格式格式化日期和时间。\n\
    \n### 示例\n\n尝试以下示例\n\n```php\n<?php\n  $date_array = getdate();\n  foreach ( $date_array\
    \ as $key => $val ){\n      print \"$key = $val<br />\";\n  }\n  $formated_date\
    \ = \"Today's date: \";\n  $formated_date .= $date_array['mday'] . \"/\";\n  $formated_date\
    \ .= $date_array['mon'] . \"/\";\n  $formated_date .= $date_array['year'];\n \
    \ print $formated_date;\n?>\n```\n\n这将产生以下结果 −\n\nseconds = 10\nminutes = 29\n\
    hours = 9\nmday = 5\nwday = 1\nmon = 12\nyear = 2016\nyday = 339\nweekday = Monday\n\
    month = December\n0 = 1480930150\nToday's date: 5/12/2016\n\n## 使用 date() 转换时间戳\n\
    \n`date()` 函数返回一个表示日期的格式化字符串。你可以通过必须传递给它的字符串参数，对 `date()` 返回的格式进行大量的控制。\n\n`date(format,timestamp)`\n\
    \n`date()` 可选地接受一个时间戳，如果省略，则将使用当前日期和时间。传递给 `date()` 的格式字符串中包含的任何其他数据将包含在返回值中。\n\
    \n下表列出了格式字符串可以包含的代码：\n\n| 序号 | 格式与描述 | 示例 |\n| --- | --- | --- |\n| 1 | 'am' 或\
    \ 'pm' 小写 | pm |\n| 2 | 'AM' 或 'PM' 大写 | PM |\n| 3 | d 月中的几天，带前导零的数字 | 20 |\n\
    | 4 | a 星期几 | Thursday |\n| 5 | F 月份名称 | January |\n| 6 | h 12 小时制，带前导零 | 02 |\n\
    | 7 | H 24 小时制，带前导零 | 14 |\n| 8 | g 12 小时制，不带前导零 | 2 |\n| 9 | G 24 小时制，不带前导零 |\
    \ 14 |\n| 10 | d 月中的几天 | 5 |\n| 11 | m 月份数字 | 12 |\n| 12 | M 月份数字缩写 | Dec |\n\
    | 13 | W 周中的第几天 | 1 |\n| 14 | j 一年的第几天 | 33 |\n| 15 | S 星期几的缩写 | Mon |\n| 16 |\
    \ Y 年份 | 2016 |\n| 17 | y 年份 | 16 |\n| 18 | s 秒 | 10 |\n| 19 | i 分 | 29 |\n| 20\
    \ | u 时 | 09 |\n| 21 | U 时间戳 | 1480930150 |\n| 22 | O 时区 | +0800 |\n| 23 | P 时区\
    \ | +0800 |\n| 24 | O 时区 | +0800 |\n| 25 | P 时区 | -0800 |\n| 26 | E 时区 | -0800\
    \ |\n| 27 | a 时区 | GMT |\n| 28 | e 时区偏移 | |\n| 29 | c 时区 | 2016-12-05+00:00:00\
    \ |\n| 30 | U ISO 8601 时间 | 2016-12-05T01:08:23Z |\n\n"
