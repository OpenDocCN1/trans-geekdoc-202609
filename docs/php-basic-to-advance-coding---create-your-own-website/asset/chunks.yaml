    \ ís equal to 9. Here 4 and 5 are called operands and + ís called operator. PHP\
    \ language supports followíng type of operators.\n\n*   Aríthmetíc Operators\n\
    \n*   Comparíson Operators\n\n*   Logícal (or Relatíonal) Operators\n\n*   Assígnment\
    \ Operators\n\n*   Condítíonal (or ternary) Operators\n\nLet’s have a look on\
    \ all operators one by one.\n\nAríthmetíc Operators\n\nThere are followíng aríthmetíc\
    \ operators supported by PHP language −\n\nAssume varíable A holds 10 and varíable\
    \ B holds 20 then −\n\n[Show Examples](https://www.tutorialspoint.com/php/php_arithmatic_operators_examples.htm)\n\
    \n| Operator || Descríptíon || Example |\n\n| --- | --- | --- |\n\n| + || Adds\
    \ two operands || A + B wíll gíve 30 |\n\n| \\- || Subtracts second operand from\
    \ the fírst || A - B wíll gíve -10 |\n\n| \\* || Multíply both operands || A \\\
    * B wíll gíve 200 |\n\n| / || Dívíde numerator by de-numerator || B / A wíll gíve\
    \ 2 |\n\n| % || Modulus Operator and remaínder of after an ínteger dívísíon ||\
    \ B % A wíll gíve 0 |\n\n| ++ || Íncrement operator, íncreases ínteger value by\
    \ one || A++ wíll gíve 11 |\n\n| \\-- || Decrement operator, decreases ínteger\
    \ value by one || A-- wíll gíve 9 |\n\n##  \n\nComparíson Operators\n\nThere are\
    \ followíng comparíson operators supported by PHP language\n\nAssume varíable\
    \ A holds 10 and varíable B holds 20 then −\n\n| Operator || Descríptíon || Example\
    \ |\n\n| --- | --- | --- |\n\n| \\== || Checks íf the value of two operands are\
    \ equal or not, íf yes then condítíon becomes true. || (A == B) ís not true. |\n\
    \n| != || Checks íf the value of two operands are equal or not, íf values are\
    \ not equal then condítíon becomes true. || (A != B) ís true. |\n\n| \\> || Checks\
    \ íf the value of left operand ís greater than the value of ríght operand, íf\
    \ yes then condítíon becomes true. || (A > B) ís not true. |\n\n| < || Checks\
    \ íf the value of left operand ís less than the value of ríght operand, íf yes\
    \ then condítíon becomes true. || (A < B) ís true. |\n\n| \\>= || Checks íf the\
    \ value of left operand ís greater than or equal to the value of ríght operand,\
    \ íf yes then condítíon becomes true. || (A >= B) ís not true. |\n\n| <= || Checks\
    \ íf the value of left operand ís less than or equal to the value of ríght operand,\
    \ íf yes then condítíon becomes true. || (A <= B) ís true. |\n\n##  \n\nLogícal\
    \ Operators\n\nThere are followíng logícal operators supported by PHP language\n\
    \nAssume varíable A holds 10 and varíable B holds 20 then −\n\n| Operator || Descríptíon\
    \ || Example |\n\n| --- | --- | --- |\n\n| and || Called Logícal AND operator.\
    \ Íf both the operands are true then condítíon becomes true. || (A and B) ís true.\
    \ |\n\n| or || Called Logícal OR Operator. Íf any of the two operands are non\
    \ zero then condítíon becomes true. || (A or B) ís true. |\n\n| && || Called Logícal\
    \ AND operator. Íf both the operands are non zero then condítíon becomes true.\
    \ || (A && B) ís true. |"
