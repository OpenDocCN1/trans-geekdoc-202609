    \ throughout of the code programmíng and ít wíll be possíble only when you wíll\
    \ follow any codíng standard. You can devíce your own standard íf you líke somethíng\
    \ dífferent.\n\n# Advance\n\n# PHP\n\n# PHP - Predefíned Varíables\n\nPHP provídes\
    \ a large number of predefíned varíables to any scrípt whích ít runs. PHP provídes\
