    \n# PHP - Coding Standard\n\nEvery company follows a different coding standard\
    \ based on their best practices. Coding standard is required because there may\
    \ be many developers working on different modules so if they start inventing their\
    \ own standards then source will become unmanageable and become difficult to maintain\
    \ that code in future.\n\nHere are several reasons why use coding specifications:\n\
    * Your peer programmers have to understand the code you produce. A coding standard\
    \ acts as the blueprint for all the team to decipher the code.\n* Simplicity and\
    \ clarity achieved by consistent coding saves you from common mistakes.\n* If\
    \ you revise your code after some time then becomes easy to understand that code.\n\
    * Its industry standard to follow a particular standard being more quality in\
    \ software.\n\nThere are few guidelines which can be followed while coding in\
    \ PHP:\n\n* **Indenting and Line Length**: Use an indent of 4 spaces and don't\
    \ use any tab because different computers use different setting. It is recommended\
    \ to keep lines at approximately 75-85 characters long for better readability.\n\
    * **Control Structures**: These include `if`, `for`, `while`, `switch`, etc. Control\
    \ statements should have one space between the control keyword and parentheses,\
    \ to distinguish them from function calls. You are strongly encouraged to always\
    \ use curly braces even in situations where they are technically optional.\n\n\
    #### Examples\n\n```php\nif ((condition1) || (condition2)) {\n    action1;\n}elseif\
    \ ((condition3) && (condition4)) {\n    action2;\n}else {\n    default action;\n\
    }\n```\n\nYou can write `switch` statements as follows:\n\n```php\nswitch (condition)\
    \ {\n    case 1:\n        action1;\n        break;\n    case 2:\n        action2;\n\
    \        break;\n    default:\n        defaultaction;\n        break;\n}\n```\n\
    \n* **Function Calls**: Functions should be called with no spaces between the\
    \ function name, the opening parentheses, and the first parameter; spaces between\
    \ commas and each parameter, and no space between the last parameter, the closing\
    \ parentheses, and the semicolon. Here's an example - `$var = foo($bar, $baz,\
    \ $quux);`\n* **Function Definitions**: Function declarations follow the \"BSD/Allman\
    \ style\" -\n```php\nfunction fooFunctíon($arg1, $arg2 = '') {\n    if (condition)\
    \ {\n        statement;\n    }\n    return $val;\n}\n```\n* **Comments**: C style\
    \ comments (`/* ... */`) and standard C++ comments (`//`) are both fine. Use of\
    \ Perl/shell style comments (`#`) is discouraged.\n* **PHP Code Tags**: Always\
    \ use `<?php ?>` to delimit PHP code, not the `<? ?>` shorthand. This is required\
    \ for PHP compatibility.\n* **Variable Names**:\n    * Use all lowercase\n   \
    \ * Use `_` as the separator\n    * Global variables should be prefixed with `$`\n\
    \    * Constants should be all caps with `_`\n* **Indentation**:\n    * Use 4\
    \ spaces for indentation\n    * Use camelCase for variable names\n\n# Advanced\
    \ PHP - Predefined Variables\n\nPHP provides a large number of predefined variables\
    \ from the environment and user input. These arrays are called superglobals.\n\
    \n## Superglobals\n\n| Sr.No | Variable | Description |\n| --- | --- | --- |\n\
    | 1 | `$GLOBALS` | A reference to every variable available within the global scope.\
    \ The keys of this array are the names of the variables. |\n| 2 | `$_SERVER` |\
    \ An array containing information about web headers, paths, and script locations.\
    \ This array is created by the web server. See next section for a complete list\
    \ of server variables. |\n| 3 | `$_GET` | An associative array of variables passed\
    \ to the script via the GET method. |\n| 4 | `$_POST` | An associative array of\
    \ variables passed to the script via the POST method. |\n| 5 | `$_FILES` | An\
    \ associative array of items uploaded to the script via the POST method. |\n|\
    \ 6 | `$_REQUEST` | An associative array consisting of the contents of `$_GET`,\
    \ `$_POST`, and `$_COOKIE`. |\n| 7 | `$_COOKIE` | An associative array of variables\
    \ passed to the script via HTTP cookies. |\n| 8 | `$_SESSION` | An associative\
    \ array containing session variables available to the current script. |\n| 9 |\
    \ `$_PHP_SELF` | A string containing the filename of the currently executing script,\
    \ relative to the document root. |\n| 10 | `$php_errorlog` | A variable containing\
    \ the text of the last error message generated by PHP. |\n\n## $_SERVER\n\nThe\
    \ `$_SERVER` variable is an array containing information about web headers, paths,\
    \ and script locations. This array is created by the web server.\n\n| Key | Description\
    \ |\n| --- | --- |\n| `$_SERVER['PHP_SELF']` | The filename of the currently executing\
    \ script, relative to the document root. |\n| `$_SERVER['argv']` | Array of arguments\
    \ passed to the script. When the script is run on the command line, this gives\
    \ C-style access to the command line parameters. When called via the GET method,\
    \ this will contain the query string. |\n"
