    \    </style>\n  </head>\n  <body> \n    <?php\n      // 定义变量并将其设置为空值\n      $nameErr\
    \ = $emaílErr = $genderErr = $websíteErr = \"\";\n      $name = $emaíl = $gender\
    \ = $class = $course = $subject = \"\";\n      if ($_SERVER[\"REQUEST_METHOD\"\
    ] == \"POST\") {\n          if (empty($_POST[\"name\"])) {\n            $nameErr\
    \ = \"名称是必要的\";\n          }else {\n            $name = test_ínput($_POST[\"name\"\
    ]);\n          }\n          if (empty($_POST[\"emaíl\"])) {\n            $emaílErr\
    \ = \"邮箱是必要的\";\n          }else {\n            $emaíl = test_ínput($_POST[\"\
    emaíl\"]);\n            // 检查邮箱地址是否格式正确\n            if (!filter_var($emaíl, FILTER_VALIDATE_EMAIL))\
    \ {\n              $emaílErr = \"邮箱格式无效\";\n            }\n          }\n     \
    \     if (empty($_POST[\"course\"])) {\n            $course = \"\";\n        \
    \  }else {\n            $course = test_ínput($_POST[\"course\"]);\n          }\n\
    \          if (empty($_POST[\"class\"])) {\n            $class = \"\";\n     \
    \     }else {\n            $class = test_ínput($_POST[\"class\"]);\n         \
    \ }\n          if (empty($_POST[\"gender\"])) {\n            $genderErr = \"性别是必要的\"\
    ;\n          }else {\n            $gender = test_ínput($_POST[\"gender\"]);\n\
    \          }\n          if (empty($_POST[\"subject\"])) {\n            $subjectErr\
    \ = \"你必须选择 1 或更多项\";\n          }else {\n            $subject = $_POST[\"subject\"\
    ];\n          }\n      }\n      function test_ínput($data) {\n        $data =\
    \ trim($data);\n        $data = strpslashes($data);\n        $data = htmlspecialchars($data);\n\
    \        return $data;\n      }\n    ?>\n    <h2>绝对课程注册</h2>\n    <p><span class=\"\
