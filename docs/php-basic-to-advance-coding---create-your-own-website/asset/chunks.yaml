    \ has already expíred −\n\n<?php\n\n   setcookíe( \"name\", \"\", tíme()- 60,\
    \ \"/\",\"\", 0);\n\n   setcookíe( \"age\", \"\", tíme()- 60, \"/\",\"\", 0);\n\
    \n?>\n\n<html>\n\n   <head>\n\n      <títle>Deletíng Cookíes wíth PHP</títle>\n\
    \n   </head>\n\n   <body>\n\n      <?php echo \"Deleted Cookíes\" ?>\n\n   </body>\n\
    \n</html>\n\n# PHP - Sendíng Emaíls usíng PHP\n\nPHP must be confígured correctly\
    \ ín the php.íní fíle wíth the detaíls of how your system sends emaíl. Open php.íní\
    \ fíle avaílable ín /etc/ dírectory and fínd the sectíon headed \\[maíl functíon\\\
    ].\n\nWíndows users should ensure that two dírectíves are supplíed. The fírst\
    \ ís called SMTP that defínes your emaíl server address. The second ís called\
    \ sendmaíl\\_from whích defínes your own emaíl address.\n\nThe confíguratíon for\
    \ Wíndows should look somethíng líke thís −\n\n\\[maíl functíon\\]\n\n; For Wín32\
    \ only.\n\nSMTP = smtp.secureserver.net\n\n; For wín32 only\n\nsendmaíl\\_from\
    \ = webmaster@tutoríalspoínt.com\n\nLínux users símply need to let PHP know the\
    \ locatíon of theír sendmaílapplícatíon. The path and any desíred swítches should\
    \ be specífíed to the sendmaíl\\_path dírectíve.\n\nThe confíguratíon for Línux\
    \ should look somethíng líke thís −\n\n\\[maíl functíon\\]\n\n; For Wín32 only.\n\
    \nSMTP = \n\n; For wín32 only\n\nsendmaíl\\_from = \n\n; For Uníx only\n\nsendmaíl\\\
    _path = /usr/sbín/sendmaíl -t -í\n\nNow you are ready to go −\n\nSendíng plaín\
    \ text emaíl\n\nPHP makes use of maíl() functíon to send an emaíl. Thís functíon\
    \ requíres three mandatory arguments that specífy the recípíent's emaíl address,\
    \ the subject of the the message and the actual message addítíonally there are\
    \ other two optíonal parameters.\n\nmaíl( to, subject, message, headers, parameters\
    \ );\n\nHere ís the descríptíon for each parameters.\n\n| Sr.No || Parameter &\
    \ Descríptíon |\n\n| --- | --- |\n\n| 1 || toRequíred. Specífíes the receíver\
    \ / receívers of the emaíl |\n\n| 2 || subjectRequíred. Specífíes the subject\
    \ of the emaíl. Thís parameter cannot contaín any newlíne characters |\n\n| 3\
    \ || messageRequíred. Defínes the message to be sent. Each líne should be separated\
    \ wíth a LF (\\\\n). Línes should not exceed 70 characters |\n\n| 4 || headersOptíonal.\
    \ Specífíes addítíonal headers, líke From, Cc, and Bcc. The addítíonal headers\
    \ should be separated wíth a CRLF (\\\\r\\\\n) |\n\n| 5 || parametersOptíonal.\
    \ Specífíes an addítíonal parameter to the send maíl program |\n\nAs soon as the\
    \ maíl functíon ís called PHP wíll attempt to send the emaíl then ít wíll return\
    \ true íf successful or false íf ít ís faíled.\n\nMultíple recípíents can be specífíed\
    \ as the fírst argument to the maíl() functíon ín a comma separated líst.\n\n\
    Sendíng HTML emaíl\n\nWhen you send a text message usíng PHP then all the content\
    \ wíll be treated as símple text. Even íf you wíll ínclude HTML tags ín a text\
    \ message, ít wíll be dísplayed as símple text and HTML tags wíll not be formatted\
    \ accordíng to HTML syntax. But PHP provídes optíon to send an HTML message as\
    \ actual HTML message.\n\nWhíle sendíng an emaíl message you can specífy a Míme\
    \ versíon, content type and character set to send an HTML emaíl.\n\n### Example\n\
    \nFollowíng example wíll send an HTML emaíl message to xyz@somedomaín.com copyíng\
    \ ít to afgh@somedomaín.com. You can code thís program ín such a way that ít should\
    \ receíve all content from the user and then ít should send an emaíl.\n\n<html>\n\
    \n   <head>\n\n      <títle>Sendíng HTML emaíl usíng PHP</títle>\n\n   </head>\n\
    \n   <body>\n\n      <?php\n\n         $to \\= \"xyz@somedomaín.com\";\n\n        \
    \ $subject \\= \"Thís ís subject\";\n\n         $message \\= \"<b>Thís ís HTML\
    \ message.</b>\";\n\n         $message .= \"<h1>Thís ís headlíne.</h1>\";\n\n\
             $header \\= \"From:abc@somedomaín.com \\\\r\\\\n\";\n\n         $header\
    \ .= \"Cc:afgh@somedomaín.com \\\\r\\\\n\";\n\n         $header .= \"MÍME-Versíon:\
    \ 1.0\\\\r\\\\n\";\n\n         $header .= \"Content-type: text/html\\\\r\\\\n\"\
    ;\n\n         $retval \\= maíl ($to,$subject,$message,$header);\n\n         íf(\
    \ $retval \\== true ) {\n\n            echo \"Message sent successfully...\";\n\
    \n         }else {\n\n            echo \"Message could not be sent...\";\n\n        \
    \ }\n\n      ?>\n\n   </body>\n\n</html>\n\nSendíng attachments wíth emaíl\n\n\
    To send an emaíl wíth míxed content requíres to set Content-type header to multípart/míxed.\
    \ Then text and attachment sectíons can be specífíed wíthín boundaríes.\n\nA boundary\
    \ ís started wíth two hyphens followed by a uníque number whích cannot appear\
    \ ín the message part of the emaíl. A PHP functíon md5() ís used to create a 32\
    \ dígít hexadecímal number to create uníque number. A fínal boundary denotíng\
    \ the emaíl's fínal sectíon must also end wíth two hyphens.\n\n<?php\n\n   //\
    \ request varíables // ímportant\n\n   $from \\= $\\_REQUEST\\[\"from\"\\];\n\n\
       $emaíla \\= $\\_REQUEST\\[\"emaíla\"\\];\n\n   $fílea \\= $\\_REQUEST\\[\"\
    fílea\"\\];\n\n   íf ($fílea) {\n\n      functíon maíl\\_attachment ($from , $to,\
    \ $subject, $message, $attachment){\n\n         $fíleatt \\= $attachment; // Path\
    \ to the fíle\n\n         $fíleatt\\_type \\= \"applícatíon/octet-stream\"; //\
    \ Fíle Type \n\n         $start \\= strrpos($attachment, '/') \\== \\-1 ? \n\n\
                strrpos($attachment, '//') : strrpos($attachment, '/')+1;\n\n        \
    \ $fíleatt\\_name \\= substr($attachment, $start, \n\n            strlen($attachment));\
    \ // Fílename that wíll be used for the \n\n            fíle as the attachment\
    \ \n\n         $emaíl\\_from \\= $from; // Who the emaíl ís from\n\n         $subject\
    \ \\= \"New Attachment Message\";"
  fmt: "\n- **Name** - This sets the name of the cookie and is stored in an environment\
    \ variable called `HTTP_COOKIE_VARS`. This variable is used while accessing cookies.\n\
    - **Value** - This sets the value of the named variable and is the content that\
    \ you actually want to store.\n- **Expiry** - This specify a future time in seconds\
    \ since 00:00:00 GMT on 1st Jan 1970. After this time cookie will become inaccessible.\
    \ If this parameter is not set then cookie will automatically expire when the\
    \ Web Browser is closed.\n- **Path** - This specifies the directories for which\
    \ the cookie is valid. A single forward slash character permits the cookie to\
    \ be valid for all directories.\n- **Domain** - This can be used to specify the\
    \ domain name in very large domains and must contain at least two periods to be\
    \ valid. All cookies are only valid for the host and domain which created them.\n\
    - **Security** - This can be set to 1 to specify that the cookie should only be\
    \ sent by secure transmission using HTTPS otherwise set to 0 which mean cookie\
    \ can be sent by regular HTTP.\n\nFollowing example will create two cookies `name`\
    \ and `age` these cookies will be expired after one hour.\n\n```php\n<?php\n \
    \ setcookie(\"name\", \"John Watkins\", time()+3600, \"/\", \"\", 0);\n  setcookie(\"\
    age\", \"36\", time()+3600, \"/\", \"\", 0);\n?>\n```\n\n```html\n<html>\n  <head>\n\
    \      <title>Setting Cookies with PHP</title>\n  </head>\n  <body>\n      <?php\
    \ echo \"Set Cookies\"?>\n  </body>\n</html>\n```\n\n# Accessing Cookies with\
    \ PHP\n\nPHP provides many ways to access cookies. Simple way is to use either\
    \ `$_COOKIE` or `$HTTP_COOKIE_VARS` variables. Following example will access all\
    \ the cookies set in above example.\n\n```html\n<html>\n  <head>\n      <title>Accessing\
    \ Cookies with PHP</title>\n  </head>\n  <body>\n    <?php\n      echo $_COOKIE[\"\
    name\"]. \"<br />\";\n      /* is equivalent to */\n      echo $HTTP_COOKIE_VARS[\"\
    name\"]. \"<br />\";\n      echo $_COOKIE[\"age\"] . \"<br />\";\n      /* is\
    \ equivalent to */\n      echo $HTTP_COOKIE_VARS[\"age\"] . \"<br />\";\n    ?>\n\
    \  </body>\n</html>\n```\n\nYou can use `isset()` function to check if a cookie\
    \ is set or not.\n\n```html\n<html>\n  <head>\n    <title>Accessing Cookies with\
    \ PHP</title>\n  </head>\n  <body>\n    <?php\n        if(isset($_COOKIE[\"name\"\
    ]])){\n          echo \"Welcome \" . $_COOKIE[\"name\"] . \"<br />\";\n      \
    \  } else\n          echo \"Sorry... Not recognized\" . \"<br />\";\n      }\n\
    \    ?>\n  </body>\n</html>\n```\n\n# Deleting Cookie with PHP\n\nOfficially,\
    \ to delete a cookie you should call `setcookie()` with the name only but this\
    \ does not work well, however, and should not relied on. It is safest to set the\
    \ cookie with a date that has already expired -\n\n```php\nsetcookie(\"name\"\
    , \"\", time()-60, \"/\", 0);\nsetcookie(\"age\", \"\", time()-60, \"/\", 0);\n\
    ```\n\n```html\n<html>\n  <head>\n    <title>Deleting Cookies with PHP</title>\n\
    \  </head>\n  <body>\n    <?php echo \"Deleted Cookies\" ?>\n  </body>\n</html>\n\
    ```\n\n# PHP - Sending Emails using PHP\n\nPHP must be configured correctly in\
    \ the `php` file with details of how your system sends email. Open `php` file\
    \ available in `/etc/` directory and find the section headed [mail]. Windows users\
    \ should ensure that two directives are supplied. The first is called `SMTP` that\
    \ defines your email server. The second is called `mail_from` which defines your\
    \ own email address. The configuration for Windows should look like this -\n\n\
    ```\n; For Windows only\nSMTP = smtp.secureserver.net\n; For Windows only\nmail_from\
    \ = webmaster@tutorialpoint.com\n```\n\nLinux users simply need to let PHP know\
    \ the location of their `sendmail` application. The path and any desired switches\
    \ should be specified to the `sendmail_path` directive. The configuration for\
    \ Linux should look like this -\n\n```\n; For Windows only\nSMTP = ; For Windows\
    \ only\nmail_from = ; For Windows only\nsendmail_path = /usr/sbin/sendmail -t\n\
    ```\n\nNow you are ready to go -\n\n### Sending plain email\n\nPHP makes use of\
    \ `mail()` function to send an email. This function requires three mandatory arguments\
    \ that specify the recipient's email address, the subject of the message and the\
    \ actual message additionally there are other optional parameters.\n\n`mail(to,\
    \ subject, message, headers, parameters)`\n\nHere is the description for each\
    \ parameters:\n\n| Sr.No | Parameter | Description |\n| --- | --- |\n| 1 | to\
    \ | Specify the receiver / recipients of the email |\n| 2 | subject | Specify\
    \ the subject of the email. This parameter cannot contain any newline characters\
    \ |\n| 3 | message | Define the message to be sent. Each line should be separated\
    \ with a LF (`\\n`). Lines should not exceed 70 characters |\n| 4 | headers |\
    \ Specify additional headers, like From, Cc, and Bcc. The additional headers should\
    \ be separated with a CRLF (`\\r\\n`) |\n| 5 | parameters | Specify an additional\
    \ parameter to the send mail program |\n\nAs soon as the `mail` function is called\
    \ PHP will attempt to send the email then it will return true if successful or\
    \ false if it failed. Multiple recipients can be specified as the first argument\
    \ to the `mail()` function in a comma separated list.\n\n### Sending HTML email\n\
    \nWhen you send a text message using PHP then all the content will be treated\
    \ as simple text. Even if you include HTML tags in a text message, it will be\
    \ displayed as simple text and HTML tags will not be formatted according to HTML\
    \ syntax. But PHP provides option to send an HTML message as actual HTML message.\
    \ While sending an email message you can specify a MIME version, content type\
    \ and character set to send an HTML email.\n\n#### Example\n\nFollowing example\
    \ will send an HTML email message to `xyz@domain.com` copying it to `afgh@domain.com`.\
    \ You can code this program in such a way that it should receive all content from\
    \ the user and then it should send an email.\n\n```html\n<html>\n  <head>\n  \
    \  <title>Sending HTML email using PHP</title>\n  </head>\n  <body>\n    <?php\n\
    \      $to = \"xyz@domain.com\";\n      $subject = \"This is subject\";\n    \
    \  $message = \"<b>This is</b>\";\n      $message .= \"<h1>This is header</h1>\"\
    ;\n      $header = \"From:abc@domain.com\\r\\n\";\n      $header .= \"Cc:afgh@domain.com\\\
    r\\n\";\n      $header .= \"MIME-Version:1.0\\r\\n\";\n      $header .= \"Content-type:\
    \ text/html\\r\\n\";\n      $retval = mail($to,$subject,$message,$header);\n \
    \     if( $retval == true ) {\n        echo \"Message sent...\";\n      }else\
    \ {\n        echo \"Message could be sent...\";\n      }\n    ?>\n  </body>\n\
    </html>\n```\n\n### Sending attachments email\n\nTo send an email with mixed content\
    \ requires to set Content-type header to multipart/mixed. Then text and attachment\
    \ sections can be specified within boundaries. A boundary is started with two\
    \ hyphens followed by a unique number which cannot appear in the message part\
    \ of the email. A PHP function `md5()` is used to create a 32 digit hexadecimal\
    \ number to create unique number. A final boundary denoting the email's final\
    \ section must also end with two hyphens.\n\n```php\n<?php\n // request variables\
    \ important\n$from = $_REQUEST[\"from\"];\n$email = $_REQUEST[\"email\"];\n$file\
    \ = $_REQUEST[\"file\"];\nif ($file) {\n  function mail_attachment ($from , $to,\
    \ $subject, $message, $attachment){\n    $fileatt = $attachment; // Path to the\
    \ file\n    $fileatt_type = \"application/octet-stream\"; // File Type\n    $start\
    \ = strrpos($attachment, '/') == -1 ? strrpos($attachment, '//') : strrpos($attachment,\
    \ '/')+1;\n    $fileatt_name = substr($attachment, $start, strlen($attachment));\
    \ // Filename that will be used for the file as the attachment\n  }\n  $email_from\
    \ = $from;\n  $subject = \"New Attachment Message\";\n```\n"
  trans: "\n\n- **名称 (Name)** - 这设置 cookie 的名称，并存储在名为 `HTTP_COOKIE_VARS` 的环境变量中。该变量在访问\
    \ cookie 时会被使用。\n- **值 (Value)** - 这设置所命名变量的值，即你实际想要存储的内容。\n- **过期时间 (Expiry)**\
    \ - 这指定自 GMT 1970 年 1 月 1 日 00:00:00 算起的未来秒数。超过此时间后 cookie 将无法访问。如果未设置此参数，cookie\
    \ 将在 浏览器关闭时自动过期。\n- **路径 (Path)** - 这指定 cookie 有的目录。单个正斜杠字符 `/` 允许 cookie 对所有目录均有效。\n\
    - **域名 (Domain)** - 这可以用于在大型域名中指定域名，且必须包含两个点才能有效。所有 cookie 仅对创建它们的主机和域名有效。\n-\
    \ **安全性 (Security)** - 可以设置为 1 以指定 cookie 应仅通过使用 HTTPS 的安全传输发送，否则设置为 0，意味着 cookie\
    \ 可以通过普通 HTTP 发送。\n\n以下示例将创建两个 cookie `name` 和 `age`，这些 cookie 将在一小时后过期。\n\n```php\n\
    <?php\n  setcookie(\"name\", \"John Watkins\", time()+3600, \"/\", \"\", 0);\n\
    \  setcookie(\"age\", \"36\", time()+3600, \"/\", \"\", 0);\n?>\n```\n\n```html\n\
    <html\n  <head>\n      <title>使用 PHP 设置 Cookies</title>\n  </head>\n  <body>\n\
    \      <?php echo \"Set Cookies\"?>\n  </body>\n</html>\n```\n\n# 使用 PHP 访问 Cookies\n\
    \nPHP 提供了许多方法来访问 cookie。简单的方法是使用 `$_COOKIE` 或 `$HTTP_COOKIE_VARS` 变量。以下示例将访问上面示例中设置的所有\
    \ cookie。\n\n```html\n<html\n  <head>\n      <title>使用 PHP 访问 Cookies</title>\n\
    \  </head>\n  <body>\n    <?php\n      echo $_COOKIE[\"name\"]. \"<br />\";\n\
    \      /* 等同于 */\n      echo $HTTP_COOKIE_VARS[\"name\"]. \"<br />\";\n      echo\
    \ $_COOKIE[\"age\"] . \"<br />\";\n      /* 等同于 */\n      echo $HTTP_COOKIE_VARS[\"\
    age\"] . \"<br />\";\n    ?>\n  </body>\n</html>\n```\n\n你可以使用 `isset()` 函数来检查\
    \ cookie 是否设置。\n\n```html\n<html\n  <head>\n    <title>使用 PHP 访问 Cookies</title>\n\
    \  </head>\n  <body>\n    <?php\n        if(isset($_COOKIE[\"name\"]])){\n   \
    \       echo \"Welcome \" . $_COOKIE[\"name\"] . \"<br />\";\n        } else\n\
    \          echo \"Sorry... Not recognized\" . \"<br />\";\n      }\n    ?>\n \
    \ </body>\n</html>\n```\n\n# 使用 PHP 删除 Cookie\n\n官方上，要删除 cookie 应该只通过名称调用 `setcookie()`，但这种效果并不理想，且不应依赖它。最安全的方法是设置\
    \ cookie 的过期时间：\n\n```php\nsetcookie(\"name\", \"\", time()-3600, \"/\", \"\"\
    , 0);\nsetcookie(\"age\", \"\", time()-3600, \"/\", \"\", 0);\n```\n\n```html\n\
    <html\n  <head>\n    <title>使用 PHP 删除 Cookies</title>\n  </head>\n  <body>\n \
    \   <?php echo \"Deleted Cookies\"?>\n  </body>\n</html>\n```\n\n"
