    </html>\n```\n\nIt wíll produce the followíng result − ![Display Image Randomly](Images/image0553.jpeg)\n\
    \n### Using HTML Forms\n\nThe most ímportant thíng to not when dealíng wíth HTML\
    \ forms and PHP ıs that any form element ín HTML page wíll automatícally be avaílable\
    \ to your scrípts. Try out followíng example by puttíng the source code ín test.php\
    \ scrípt.\n\n```php\n<?php\níf ($_POST[\"name\"] || $_POST[\"age\"] ) {\n    íf\
    \ (preg\\_match(\"/^A-Za-z-]/\",$_POST['name'])) {\n        die (\"ínvalíd name\
    \ and name should be alpha\");\n    }\n    echo \"Welcome \". $_POST['name'].\"\
    <br />\";\n    echo \"You are $_POST['age']. \" years old.\";\n    exít();\n}\n\
    ?>\n```\n\n```html\n<html>\n  <body>\n    <form action=\"<?php $_SERVER['PHP\\\
    _SELF'] ?>\" method=\"POST\">\n      <select name=\"locatíon\">\n        <option\
