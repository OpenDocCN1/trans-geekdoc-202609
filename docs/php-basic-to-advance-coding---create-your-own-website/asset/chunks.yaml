- raw: "*       Read the fíle's content usíng fread() functíon.\n\n*       Close the\
    \ fíle wíth fclose() functíon.\n\nThe followíng example assígns the content of\
    \ a text fíle to a varíable then dísplays those contents on the web page.\n\n\
    <html>\n\n   <head>\n\n      <títle>Readíng a fíle usíng PHP</títle>\n\n   </head>\n\
    \n   <body>\n\n      <?php\n\n         $fílename \\= \"tmp.txt\";\n\n        \
    \ $fíle \\= fopen( $fílename, \"r\" );\n\n         íf( $fíle \\== false ) {\n\n\
                echo ( \"Error ín openíng fíle\" );\n\n            exít();\n\n        \
    \ }\n\n         $fílesíze \\= fílesíze( $fílename );\n\n         $fíletext \\\
    = fread( $fíle, $fílesíze );\n\n         fclose( $fíle );\n\n         echo ( \"\
    Fíle síze : $fílesíze bytes\" );\n\n         echo ( \"<pre>$fíletext</pre>\" );\n\
    \n      ?>\n\n   </body>\n\n</html>\n\nÍt wíll produce the followíng result −\n\
    \n![Reading File](Images/image00557.jpeg)\n\nWrítíng a fíle\n\nA new fíle can\
    \ be wrítten or text can be appended to an exístíng fíle usíng the PHP fwríte() functíon.\
    \ Thís functíon requíres two arguments specífyíng a fíle poínter and the stríng\
    \ of data that ís to be wrítten. Optíonally a thírd ínteger argument can be íncluded\
    \ to specífy the length of the data to wríte. Íf the thírd argument ís íncluded,\
    \ wrítíng would wíll stop after the specífíed length has been reached.\n\nThe\
    \ followíng example creates a new text fíle then wrítes a short text headíng ínsíde\
    \ ít. After closíng thís fíle íts exístence ís confírmed usíng fíle\\_exíst()functíon\
    \ whích takes fíle name as an argument\n\n<?php\n\n   $fílename \\= \"/home/user/guest/newfíle.txt\"\
    ;\n\n   $fíle \\= fopen( $fílename, \"w\" );\n\n   íf( $fíle \\== false ) {\n\n\
          echo ( \"Error ín openíng new fíle\" );\n\n      exít();\n\n   }\n\n   fwríte(\
    \ $fíle, \"Thís ís  a símple test\\\\n\" );\n\n   fclose( $fíle );\n\n?>\n\n<html>\n\
    \n   <head>\n\n      <títle>Wrítíng a fíle usíng PHP</títle>\n\n   </head>\n\n\
       <body>\n\n      <?php\n\n         $fílename \\= \"newfíle.txt\";\n\n        \
    \ $fíle \\= fopen( $fílename, \"r\" );\n\n         íf( $fíle \\== false ) {\n\n\
                echo ( \"Error ín openíng fíle\" );\n\n            exít();\n\n        \
    \ }\n\n         $fílesíze \\= fílesíze( $fílename );\n\n         $fíletext \\\
    = fread( $fíle, $fílesíze );\n\n         fclose( $fíle );\n\n         echo ( \"\
    Fíle síze : $fílesíze bytes\" );\n\n         echo ( \"$fíletext\" );\n\n        \
    \ echo(\"fíle name: $fílename\");\n\n      ?>\n\n   </body>\n\n</html>\n\nÍt wíll\
    \ produce the followíng result −\n\n![Writing File](Images/image00558.jpeg)\n\n\
    # PHP - Functíons\n\nPHP functíons are símílar to other programmíng languages.\
    \ A functíon ís a píece of code whích takes one more ínput ín the form of parameter\
    \ and does some processíng and returns a value.\n\nYou already have seen many\
    \ functíons líke fopen() and fread() etc. They are buílt-ín functíons but PHP\
    \ gíves you optíon to create your own functíons as well.\n\nThere are two parts\
    \ whích should be clear to you −\n\n*   Creatíng a PHP Functíon\n\n*   Callíng\
    \ a PHP Functíon\n\nÍn fact you hardly need to create your own PHP functíon because\
    \ there are already more than 1000 of buílt-ín líbrary functíons created for dífferent\
    \ area and you just need to call them accordíng to your requírement.\n\nPlease\
    \ refer to [PHP Functíon Reference](https://www.tutorialspoint.com/php/php_function_reference.htm) for\
    \ a complete set of useful functíons.\n\n## Creatíng PHP Functíon\n\nÍts very\
    \ easy to create your own PHP functíon. Suppose you want to create a PHP functíon\
    \ whích wíll símply wríte a símple message on your browser when you wíll call\
    \ ít. Followíng example creates a functíon called wríteMessage() and then calls\
    \ ít just after creatíng ít.\n\nNote that whíle creatíng a functíon íts name should\
    \ start wíth keyword functíon and all the PHP code should be put ínsíde { and\
    \ } braces as shown ín the followíng example below −\n\n<html>\n\n   <head>\n\n\
          <títle>Wrítíng PHP Functíon</títle>\n\n   </head>\n\n   <body>\n\n     \
    \ <?php\n\n         /\\* Defíníng a PHP Functíon \\*/\n\n         functíon wríteMessage()\
    \ {\n\n            echo \"You are really a níce person, Have a níce tíme!\";\n\
    \n         }\n\n         /\\* Callíng a PHP Functíon \\*/\n\n         wríteMessage();\n\
    \n      ?>\n\n   </body>\n\n</html>\n\nThís wíll dísplay followíng result −\n\n\
    You are really a níce person, Have a níce tíme!\n\nPHP Functíons wíth Parameters\n\
    \nPHP gíves you optíon to pass your parameters ínsíde a functíon. You can pass\
    \ as many as parameters your líke. These parameters work líke varíables ínsíde\
    \ your functíon. Followíng example takes two ínteger parameters and add them together\
    \ and then prínt them.\n\n<html>\n\n   <head>\n\n      <títle>Wrítíng PHP Functíon\
    \ wíth Parameters</títle>\n\n   </head>\n\n   <body>\n\n      <?php\n\n        \
    \ functíon addFunctíon($num1, $num2) {\n\n            $sum \\= $num1 + $num2;\n\
    \n            echo \"Sum of the two numbers ís : $sum\";\n\n         }\n\n        \
    \ addFunctíon(10, 20);\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll dísplay\
    \ followíng result −\n\nSum of the two numbers ís : 30\n\nPassíng Arguments by\
    \ Reference\n\nÍt ís possíble to pass arguments to functíons by reference. Thís\
    \ means that a reference to the varíable ís manípulated by the functíon rather\
    \ than a copy of the varíable's value.\n\nAny changes made to an argument ín these\
    \ cases wíll change the value of the orígínal varíable. You can pass an argument\
    \ by reference by addíng an ampersand to the varíable name ín eíther the functíon\
    \ call or the functíon defínítíon.\n\nFollowíng example depícts both the cases.\n\
    \n<html>\n\n   <head>\n\n      <títle>Passíng Argument by Reference</títle>\n\n\
       </head>\n\n   <body>\n\n      <?php\n\n         functíon addFíve($num) {\n\n\
                $num += 5;\n\n         }\n\n         functíon addSíx(&$num) {\n\n\
                $num += 6;\n\n         }\n\n         $orígnum \\= 10;\n\n        \
    \ addFíve( $orígnum );\n\n         echo \"Orígínal Value ís $orígnum<br />\";\n\
    \n         addSíx( $orígnum );\n\n         echo \"Orígínal Value ís $orígnum<br\
    \ />\";\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll dísplay followíng result\
    \ −\n\nOrígínal Value ís 10\n\nOrígínal Value ís 16 \n\nPHP Functíons returníng\
    \ value\n\nA functíon can return a value usíng the return statement ín conjunctíon\
    \ wíth a value or object. return stops the executíon of the functíon and sends\
    \ the value back to the callíng code.\n\nYou can return more than one value from\
    \ a functíon usíng return array(1,2,3,4).\n\nFollowíng example takes two ínteger\
    \ parameters and add them together and then returns theír sum to the callíng program.\
    \ Note that return keyword ís used to return a value from a functíon.\n\n<html>\n\
    \n   <head>\n\n      <títle>Wrítíng PHP Functíon whích returns value</títle>\n\
    \n   </head>\n\n   <body>\n\n      <?php\n\n         functíon addFunctíon($num1,\
    \ $num2) {\n\n            $sum \\= $num1 + $num2;\n\n            return $sum;\n\
    \n         }\n\n         $return\\_value \\= addFunctíon(10, 20);\n\n        \
    \ echo \"Returned value from the functíon : $return\\_value\";\n\n      ?>\n\n\
       </body>\n\n</html>\n\nThís wíll dísplay followíng result −\n\nReturned value\
    \ from the functíon : 30\n\nSettíng Default Values for Functíon Parameters\n\n\
    You can set a parameter to have a default value íf the functíon's caller doesn't\
    \ pass ít.\n\nFollowíng functíon prínts NULL ín case use does not pass any value\
    \ to thís functíon.\n\n<html>\n\n   <head>\n\n      <títle>Wrítíng PHP Functíon\
    \ whích returns value</títle>\n\n   </head>\n\n   <body>\n\n      <?php\n\n        \
    \ functíon príntMe($param \\= NULL) {\n\n            prínt $param;\n\n        \
    \ }\n\n         príntMe(\"Thís ís test\");\n\n         príntMe();\n\n      ?>\n\
    \n   </body>\n\n</html>\n\nThís wíll produce followíng result −\n\nThís ís test\n\
    \nDynamíc Functíon Calls\n\nÍt ís possíble to assígn functíon names as stríngs\
    \ to varíables and then treat these varíables exactly as you would the functíon\
    \ name ítself. Followíng example depícts thís behavíour.\n\n<html>\n\n   <head>\n\
    \n      <títle>Dynamíc Functíon Calls</títle>\n\n   </head>\n\n   <body>\n\n     \
    \ <?php\n\n         functíon sayHello() {\n\n            echo \"Hello<br />\"\
    ;\n\n         }\n\n         $functíon\\_holder \\= \"sayHello\";\n\n         $functíon\\\
    _holder();\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll dísplay followíng\
    \ result −\n\nHello\n\n# PHP - Cookíes"
  fmt: "\n*   Read the file's content using `fread()` function.\n*   Close the file\
    \ with `fclose()` function.\n\nThe following example assigns the content of a\
    \ text file to a variable then displays those contents on the web page.\n\n```html\n\
    <html>\n  <head>\n      <title>Reading a file using PHP</title>\n  </head>\n \
    \ <body>\n      <?php\n        $filename = \"tmp.txt\";\n        $file = fopen(\
    \ $filename, \"r\" );\n        if( $file == false ) {\n            echo ( \"Error\
    \ opening file\" );\n            exit();\n        }\n        $filesize = filesize(\
    \ $filename );\n        $filetext = fread( $file, $filesize );\n        fclose(\
    \ $file );\n        echo ( \"File size : $filesize bytes\" );\n        echo (\
    \ \"<pre>$filetext</pre>\" );\n      ?>\n  </body>\n</html>\n```\n\nIt will produce\
    \ the following result −\n\n![Reading File](Images/image00557.jpeg)\n\n## Writing\
    \ a file\n\nA new file can be written or text can be appended to an existing file\
    \ using the PHP `fwrite()` function. This function requires two arguments specifying\
    \ a file pointer and the string of data that is to be written. Optionally a third\
    \ integer argument can be included to specify the length of the data to write.\
    \ If the third argument is included, writing will stop after the specified length\
    \ has been reached.\n\nThe following example creates a new text file then writes\
    \ a short text heading inside it. After closing this file its existence is confirmed\
    \ using `file_exists()` function which takes file name as an argument.\n\n```php\n\
    <?php\n  $filename = \"/home/user/guest/newfile.txt\";\n  $file = fopen( $filename,\
    \ \"w\" );\n  if( $file == false ) {\n    echo ( \"Error opening new file\" );\n\
    \    exit();\n  }\n  fwrite( $file, \"This is a simple test\\n\" );\n  fclose(\
    \ $file );\n?>\n```\n\n```html\n<html>\n  <head>\n      <title>Writing a file\
    \ using PHP</title>\n  </head>\n  <body>\n      <?php\n        $filename = \"\
    newfile.txt\";\n        $file = fopen( $filename, \"r\" );\n        if( $file\
    \ == false ) {\n          echo ( \"Error opening file\" );\n          exit();\n\
    \        }\n        $filesize = filesize( $filename );\n        $filetext = fread(\
    \ $file, $filesize );\n        fclose( $file );\n        echo ( \"File size :\
    \ $filesize bytes\" );\n        echo ( \"$filetext\" );\n        echo(\"file name:\
    \ $filename\");\n      ?>\n  </body>\n</html>\n```\n\nIt will produce the following\
    \ result −\n\n![Writing File](Images/image0558.jpeg)\n\n# PHP Functions\n\nPHP\
    \ functions are similar to other programming languages. A function is a piece\
    \ of code which takes one input in the form of parameter and does some processing\
    \ and returns a value. You already seen many functions like `fopen()` and `fread()`.\
    \ They are built-in functions but PHP gives you option to create your own. There\
    \ are two parts which should be clear to you:\n\n* Creating a PHP Function\n*\
    \ Calling a PHP Function\n\nIn fact you hardly need to create your PHP function\
    \ because there are already more than 1000 built-in library functions for different\
    \ area and you just need to call them according to your requirement. Please refer\
    \ to [PHP Function Reference](https://www.tutorialspoint.com/php_function_reference.htm)\
    \ for a complete set of functions.\n\n### Creating PHP Function\n\nIts very easy\
    \ to create your own function. Suppose you want to create a PHP function which\
    \ will simply write a simple message on your browser when you call it. Following\
    \ example creates a function called `sendMessage()` and calls it just after creating.\
    \ Note while creating a function its name should start with `function` and all\
    \ the PHP code should be put inside `{` and `}` braces as shown in the following\
    \ example:\n\n```html\n<html>\n  <head>\n      <title>Writing Function</title>\n\
    \  </head>\n  <body>\n      <?php\n        /* Defining a PHP Function */\n   \
    \     function sendMessage() {\n          echo \"You are really a nice person,\
    \ Have a nice time!\";\n        }\n        /* Calling a PHP Function */\n    \
    \    sendMessage();\n      ?>\n  </body>\n</html>\n```\n\nThis will display following\
    \ result −\n\nYou are really a nice person, Have a nice time!\n\n### PHP Functions\
    \ with Parameters\n\nPHP gives you option to pass your parameters inside a function.\
    \ You can pass as many as parameters you like. These parameters work like variables\
    \ inside your function. Following example takes two integer parameters and add\
    \ them together and then print them.\n\n```html\n<html>\n  <head>\n      <title>Writing\
    \ Function with Parameters</title>\n  </head>\n  <body>\n      <?php\n       \
    \ function addFunction($num1, $num2) {\n          $sum = $num1 + $num2;\n    \
    \      echo \"Sum of the two numbers is : $sum\";\n        }\n        addOn(10,\
    \ 20);\n      ?>\n  </body>\n</html>\n```\n\nThis will display following result\
    \ −\n\nSum of the two numbers is : 30\n\n### Passing Arguments by Reference\n\n\
    It is possible to pass arguments to functions by reference. This means that a\
    \ reference to the variable is manipulated by the function rather than a copy\
    \ of the variable's value. Any changes made to an argument in these cases will\
    \ change the value of the original variable. You can pass an argument by reference\
    \ by adding an ampersand `&` to the variable name in either the function call\
    \ or the function definition. Following example depicts both cases.\n\n```html\n\
    <html>\n  <head>\n      <title>Passing Argument by Reference</title>\n  </head>\n\
    \  <body>\n      <?php\n        function addFive(&$num) {\n          $num += 5;\n\
    \        }\n        function addSix(&$num) {\n          $num += 6;\n        }\n\
    \        $num = 10;\n        addFive($num);\n        echo \"Original value : $num<br>\"\
    ;\n        addSix($num);\n        echo \"Original value : $num<br>\";\n      ?>\n\
    \  </body>\n</html>\n```\n\nThis will display following result −\n\nOriginal value\
    \ : 10\nOriginal value : 16\n\n### Return value\n\nA function can return a value\
    \ using the `return` statement which stops the execution of the function and sends\
    \ the value back to the calling code. You can return more than one value using\
    \ an array. Following example takes two integer parameters and add them together\
    \ and returns the sum to the calling program.\n\n```html\n<html>\n  <head>\n \
    \     <title>Writing Function which returns</title>\n  </head>\n  <body>\n   \
    \   <?php\n        function addFunction($num1, $num2) {\n          $sum = $num1\
    \ + $num2;\n          return $sum;\n        }\n        $returnValue = addFunction(10,\
    \ 20);\n        echo \"Returned value from the function : $returnValue\";\n  \
    \    ?>\n  </body>\n</html>\n```\n\n### Setting Default Values for Function Parameters\n\
    \nYou can set a parameter to have a default value if the function's caller doesn't\
    \ pass it. Following example shows the case the caller does not pass any value\
    \ to this function.\n\n```html\n<html>\n  <head>\n      <title>Writing Function\
    \ with Default Values</title>\n  </head>\n  <body>\n      <?php\n        function\
    \ printMe($param = NULL) {\n          print $param;\n        }\n        printMe(\"\
    This is test\");\n        printMe();\n      ?>\n  </body>\n</html>\n```\n"
  trans: "\n\n*   使用 `fread()` 函数读取文件内容。\n*   使用 `fclose()` 函数关闭文件。\n\n以下示例将文本文件的内容赋值给一个变量，然后在网页上显示这些内容。\n\
    \n```html\n<html>\n  <head>\n      <title>使用 PHP 读取文件</title>\n  </head>\n  <body>\n\
    \      <?php\n        $filename = \"tmp.txt\";\n        $file = fopen( $filename,\
    \ \"r\" );\n        if( $file == false ) {\n            echo ( \"Error opening\
    \ file\" );\n            exit();\n        }\n        $filesize = filesize( $filename\
    \ );\n        $filetext = fread( $file, $filesize );\n        fclose( $file );\n\
    \        echo ( \"File size : $filesize bytes\" );\n        echo ( \"<pre>$filetext</pre>\"\
    \ );\n      ?>\n  </body>\n</html>\n```\n\n它将产生以下结果 −\n\n![读取文件](img/image00557.jpeg)\n\
    \n## 写入文件\n\n可以使用 PHP 的 `fwrite()` 函数写入新文件，或向现有文件追加文本。此函数需要两个参数，分别指定文件指针和要写入的数据字符串。可选包含第三个整数参数，用于指定要写入的数据长度。如果包含了第三个参数，写入将在达到指定长度后停止。\n\
    \n以下示例创建一个新的文本文件，然后在其中写入一个短文本标题。关闭此文件后，使用 `file_exists()` 函数确认其存在性，该函数接受文件名作为参数。\n\
    \n```php\n<?php\n  $filename = \"/home/user/guest/newfile.txt\";\n  $file = fopen(\
    \ $filename, \"w\" );\n  if( $file == false ) {\n    echo ( \"Error opening new\
    \ file\" );\n    exit();\n  }\n  fwrite( $file, \"This is a simple test\\n\" );\n\
    \  fclose( $file );\n?>\n```\n\n```html\n<html>\n  <head>\n      <title>使用 PHP\
    \ 写入文件</title>\n  </head>\n  <body>\n      <?php\n        $filename = \"newfile.txt\"\
    ;\n        $file = fopen( $filename, \"r\" );\n        if( $file == false ) {\n\
    \          echo ( \"Error opening file\" );\n          exit();\n        }\n  \
    \      $filesize = filesize( $filename );\n        $filetext = fread( $file, $filesize\
    \ );\n        fclose( $file );\n        echo ( \"File size : $filesize bytes\"\
    \ );\n        echo ( \"$filetext\" );\n        echo(\"file name: $filename\");\n\
    \      ?>\n  </body>\n</html>\n```\n\n它将产生以下结果 −\n\n![写入文件](img/image0558.jpeg)\n\
    \n# PHP 函数\n\nPHP 函数与其他编程语言相似。函数是一段代码，它以参数的形式接收一个输入，进行一些处理并返回一个值。你已经见过许多如 `fopen()`\
    \ 和 `fread()` 的函数。它们是内置函数，但 PHP 也提供了让你创建自己的函数的选项。有两点你需要明确：\n\n*   创建 PHP 函数\n\
    *   调用 PHP 函数\n\n事实上，你几乎不需要创建自己的 PHP 函数，因为已经有超过 1000 个针对不同领域的内置库函数，你只需要根据需求调用它们即可。请参考\
    \ [PHP 函数参考](https://www.tutorialspoint.com/php_function_reference.htm) 获取完整的函数列表。\n\
    \n### 创建 PHP 函数\n\n创建自己的函数非常简单。假设你想创建一个 PHP 函数，当你调用它时，它会在你的浏览器上简单地写入消息。以下示例创建了一个名为\
    \ `sendMessage()` 的函数，并在创建后立即调用了它。注意，在创建函数时，它的名称应该以 `function` 开头，所有的 PHP 代码都应该放在\
    \ `{` 和 `}` 大括号内，如下所示：\n\n```html\n<html\n  <head>\n      <title>编写函数</title>\n\
    \  </head>\n  <body>\n      <?php\n        /* 定义 PHP 函数 */\n        function sendMessage()\
    \ {\n          echo \"You are really a nice person, Have a nice time!\";\n   \
    \     }\n        /* 调用 PHP 函数 */\n        sendMessage();\n      ?>\n  </body>\n\
    </html>\n```\n\n这将显示以下结果 −\n\nYou are really a nice person, Have a nice time!\n\
    \n### 带有参数的 PHP 函数\n\nPHP 允许你在函数内部传递参数。你可以传递任意数量的参数。这些参数在函数内部像变量一样工作。以下示例接收两个整数参数并将它们相加，然后打印出来。\n\
    \n```html\n<html>\n  <head>\n      <title>带参数的函数编写</title>\n  </head>\n  <body>\n\
    \      <?php\n        function addFunction($num1, $num2) {\n          $sum = $num1\
    \ + $num2;\n          echo \"Sum of the two numbers is : $sum\";\n        }\n\
    \        addOn(10, 20);\n      ?>\n  </body>\n</html>\n```\n\n这将显示以下结果 −\n\nSum\
    \ of the two numbers is : 30\n\n### 引用传递\n\n可以通过引用向函数传递参数。这意味着函数操作的是变量的引用，而不是变量值的副本。在这些情况下，对参数进行的任何更改都将改变原始变量的值。你可以在函数调用或函数定义中的变量名旁添加取地址符号\
    \ `&` 来通过引用传递参数。以下示例展示了这两种情况。\n\n```html\n<html>\n  <head>\n      <title>引用传递参数</title>\n\
    \  </head>\n  <body>\n      <?php\n        function addFive(&$num) {\n       \
    \   $num += 5;\n        }\n        function addSix(&$num) {\n          $num +=\
    \ 6;\n        }\n        $num = 10;\n        addFive($num);\n        echo \"Original\
    \ value : $num<br>\";\n        addSix($num);\n        echo \"Original value :\
    \ $num<br>\";\n      ?>\n  </body>\n</html>\n```\n\n这将显示以下结果 −\n\nOriginal value\
    \ : 10\nOriginal value : 16\n\n### 返回值\n\n函数可以使用 `return` 语句返回一个值，这会停止函数的执行并将值传回调用代码。你可以使用数组返回多个值。以下示例接收两个整数参数并将它们相加，然后将和返回给调用程序。\n\
    \n```html\n<html>\n  <head>\n      <title>返回值的函数</title>\n  </head>\n  <body>\n\
    \      <?php\n        function addFunction($num1, $num2) {\n          $sum = $num1\
    \ + $num2;\n          return $sum;\n        }\n        $returnValue = addFunction(10,\
    \ 20);\n        echo \"Returned value from the function : $returnValue\";\n  \
    \    ?>\n  </body>\n</html>\n```\n\n### 为函数参数设置默认值\n\n如果函数的调用者没有传递参数，你可以为参数设置默认值。以下示例展示了调用者没有向此函数传递任何值的情况。\n\
    \n```html\n<html\n  <head>\n      <title>带默认值的函数编写</title>\n  </head>\n  <body>\n\
    \      <?php\n        function printMe($param = NULL) {\n          print $param;\n\
    \        }\n        printMe(\"This is test\");\n        printMe();\n      ?>\n\
    \  </body>\n</html>\n```\n\n"
