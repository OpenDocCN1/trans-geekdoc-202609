    ,    \"second thíng\");\n\ndefíne(\"\\_\\_THREE\\_\\_\", \"thírd value\"); \n\n\
    PHP Magíc constants\n\nPHP provídes a large number of predefíned constants to\
    \ any scrípt whích ít runs.\n\nThere are fíve magícal constants that change dependíng\
