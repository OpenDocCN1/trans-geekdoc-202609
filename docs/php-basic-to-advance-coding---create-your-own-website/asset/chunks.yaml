    \ and as long as a specífíed condíon ís true.\n"
  trans: "\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `||` | 逻辑或运算符。如果两个操作数中有一个非零，则条件为真。\
    \ | `(A || B)` 为真。 |\n| `!` | 逻辑非运算符。用于反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符将使其变为假。 | `!(A\
    \ && B)` 为假。 |\n\n## 赋值运算符\n\nPHP 语言支持以下赋值运算符——\n\n| 运算符 | 描述 | 示例 |\n| --- |\
    \ --- | --- |\n| `=` | 简单赋值运算符，将右侧操作数的值赋值给左侧操作数 | `C = A + B` 将 `A + B` 的值赋值给\
    \ `C` |\n| `+=` | 加赋值运算符，它将右侧操作数加到左侧操作数并将结果赋值给左侧操作数 | `C += A` 等于 `C = C + A`\
    \ |\n| `-=` | 减赋值运算符，它从左侧操作数中减去右侧操作数并将结果赋值给左侧操作数 | `C -= A` 等于 `C = C - A` |\n\
    | `*=` | 乘赋值运算符，它将右侧操作数与左侧操作数相并将结果赋值给左侧操作数 | `C *= A` 等于 `C = C * A` |\n| `/=`\
    \ | 除赋值运算符，它将左侧操作数除以右侧操作数并将结果赋值给左侧操作数 | `C /= A` 等于 `C = C / A` |\n| `%=` | 取模赋值运算符，它使用两个操作数取模并将结果赋值给左侧操作数\
    \ | `C %= A` 等于 `C = C % A` |\n\n## 条件运算符\n\n还有一种运算符被称为条件运算符。它首先评估表达式的真假值，然后根据评估结果执行两个给定语句之一。条件运算符的语法如下——\n\
    \n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `? :` | 条件表达式 | 如果条件为真 ? 则取值 X : 否则取值\
    \ Y |\n\n## 运算符分类\n\n我们上面讨论的所有运算符可以分为以下几类——\n\n* 一元前缀运算符，位于单个操作数之前。\n* 二元运算符，接受两个操作数并执行各种算术和逻辑操作。\n\
    * 条件运算符（三元运算符），接受三个操作数并根据第一个表达式的评估结果评估第二个或第三个表达式。\n* 赋值运算符，为变量赋值。\n\n## PHP 运算符优先级\n\
    \n运算符优先级决定了表达式中项的分组。这影响了表达式的方式。某些运算符的优先级高于其他；例如，乘法运算符的优先级高于加法运算符——\n\n例如 `x =\
    \ 7 + 3 * 2;` 这里 `x` 被赋值为 13，而不是 20，因为运算符 `*` 的优先级高于 `+`，所以它先与 `3*2` 相乘，然后加 7。\n\
    \n优先级最高的运算符出现在表格顶部，优先级最低的出现在底部。在表达式中，高优先运算符将先被评估。\n\n| 类别 | 运算符 | 优先级 |\n| ---\
    \ | --- | --- |\n| 一元 | `! --` | 从右到左 |\n| 乘法 | `* / %` | 从左到右 |\n| 加法 | `+ -`\
    \ | 从左到右 |\n| 关系 | `< <= >=` | 从左到右 |\n| 等于 | `== !=` | 从左到右 |\n| 逻辑与 | `&&` |\
    \ 从左到右 |\n| 逻辑或 | `||` | 从左到右 |\n| 条件 | `?:` | 从右到左 |\n| 赋值 | `= -= * /==` | 从右到左\
    \ |\n\n# PHP - 决策\n\n`if`、`elseif` 和 `switch` 语句用于根据不同条件做出决策。\n\n你可以在代码中使用条件语句进行决策。PHP\
    \ 支持以下决策语句——\n\n* `if...else` 语句——当条件为真时执行一组代码，否则执行另一组。\n* `elseif` 语句——配合 `if...else`\
    \ 语句使用，当多个条件之一为真时执行代码。\n* `switch` 语句——如果你想在多个代码块中选择一个执行，使用 switch 语句。switch 语句用于避免冗长的\
    \ `if...elseif...else` 代码。\n\n## If...Else \n\n如果你想在条件为真时执行某些代码，在条件为假时执行另一个代码，使用\
    \ `if...else` 语句。\n\n### 语法\n\n```php\nif (condition)\n  条件为真时执行代码;\nelse\n  条件为假时执行代码;\n\
    ```\n\n### 示例\n\n以下示例如果今天是周五，将输出 \"Have a weekend!\"，否则将输出 \"Have a nice day!\"\
    ：\n\n```html\n<html>\n<body>\n<?php\n$d= date(\"D\");\nif ($d== \"Fri\") echo\
    \ \"Have a weekend\nelse echo \"Have a day!\";\n?>\n</body>\n</html>\n```\n它将产生以下结果——\n\
    Have a weekend!\n\n## Else\n\n如果你想在多个条件之一为真时执行某些代码，使用 `elseif`\n\n### 语法\n\n```php\n\
    if (condition)\n  条件为真时执行代码;\nelseif (condition)\n  条件为真时执行代码;\nelse\n  条件为假时执行代码;\n\
    ```\n\n### 示例\n\n以下示例如果今天是周五，将输出 \"Have a weekend!\"，如果今天是周日，将输出 \"Have nice Sunday!\"\
    。否则将输出 \"Have a nice day!\"——\n\n```html\n<html>\n<body>\n<?php\n$d= date(\"D\"\
    );\nif ($d== \"Fri\") echo \"Have a weekend!\";\nelseif ($d== \"Sun\") echo \"\
    Have nice Sunday!\";\nelse echo \"Have a nice day!\";\n?>\n</body>\n</html>\n\
    ```\n它将产生以下结果——\nWeekend\n\n## Switch\n\n如果你想在多个代码块中选择一个执行，使用 switch 语句。switch\
    \ 语句用于避免大量的 `if...elseif...else` 代码。\n\n### 语法\n\n```php\nswitch (expression){\n\
    \  case label1:\n    表达式等于 label1 时执行代码;\n    break;\n  case label2:\n    表达式等于\
    \ label2 时执行代码;\n    break;\n  default:\n    表达式不同于 label1 和 label2 时执行代码;\n}\n\
    ```\n\n### 示例\n\nswitch 语句的方式特殊。首先评估表达式，然后寻找匹配的标签。如果找到了匹配的值，将执行与匹配标签关联的代码；如果没有标签匹配标签，语句将执行任何指定的默认代码。\n\
    \n```html\n<html>\n<body>\n<?php\n$d= date(\"D\");\nswitch ($d){\n  case \"Mon\"\
    :\n    echo \"Today is Monday\";\n    break;\n  case \"Tue\":\n    echo \"Today\
    \ is Tuesday\";\n    break;\n  case \"Wed\":\n    echo \"Today is Wednesday\"\
    ;\n    break;\n  case \"Thu\":\n    echo \"Today is Thursday\";\n    break;\n\
    \  case \"Fri\":\n    echo \"Today is Friday\";\n    break;\n  case \"Sat\":\n\
    \    echo \"Today is Saturday\";\n    break;\n  case \"Sun\":\n    echo \"Today\
    \ is Sunday\";\n    break;\n  default:\n    echo \"Wonder which day is this ?\"\
    ;\n}\n?>\n</body>\n</html>\n```\n它将产生以下结果——\nToday is Monday\n\n# 循环类型\n\nPHP\
    \ 中的循环用于指定的次数执行相同的代码块。PHP 支持以下四循环类型。\n\n* for——以指定的次数循环代码块。\n* while——只要指定的条件为真，就循环代码块。\n\
    \n"
