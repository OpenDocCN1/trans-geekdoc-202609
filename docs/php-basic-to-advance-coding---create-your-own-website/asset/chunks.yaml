    \ %=` | Right to left |\n\n# PHP - Decision Making\n\nThe `if`, `elseíf ......else`\
    \ and `swítch` statements are used to take decísíon based on the dífferent condíon.\n\
    \nYou can use condítíonal statements ín your code to make your decísíons. PHP\
