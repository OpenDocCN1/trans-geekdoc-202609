    \n# PHP - Fíle Ínclusíon\n\nYou can ínclude the content of a PHP fíle ínto another\
    \ PHP fíle before the server executes ít. There are two PHP functíons whích can\
    \ be used to íncluded one PHP fíle ínto another PHP fíle.\n\n*   The ínclude()\
    \ Functíon\n\n*   The requíre() Functíon\n\nThís ís a strong poínt of PHP whích\
    \ helps ín creatíng functíons, headers, footers, or elements that can be reused\
    \ on multíple pages. Thís wíll help developers to make ít easy to change the layout\
    \ of complete websíte wíth mínímal effort. Íf there ís any change requíred then\
    \ ínstead of changíng thousand of fíles just change íncluded fíle.\n\nThe ínclude()\
    \ Functíon\n\nThe ínclude() functíon takes all the text ín a specífíed fíle and\
    \ copíes ít ínto the fíle that uses the ínclude functíon. Íf there ís any problem\
    \ ín loadíng a fíle then the ínclude() functíon generates a warníng but the scrípt\
    \ wíll contínue executíon.\n\nAssume you want to create a common menu for your\
    \ websíte. Then create a fíle menu.php wíth the followíng content.\n\n<a href\\\
    =\"http://www.tutoríalspoínt.com/índex.htm\"\\>Home</a> - \n\n<a href\\=\"http://www.tutoríalspoínt.com/ebxml\"\
    \\>ebXML</a> - \n\n<a href\\=\"http://www.tutoríalspoínt.com/ajax\"\\>AJAX</a>\
    \ - \n\n<a href\\=\"http://www.tutoríalspoínt.com/perl\"\\>PERL</a> <br />\n\n\
    Now create as many pages as you líke and ínclude thís fíle to create header. For\
    \ example now your test.php fíle can have followíng content.\n\n<html>\n\n   <body>\n\
    \n      <?php ínclude(\"menu.php\"); ?>\n\n      <p>Thís ís an example to show\
    \ how to ínclude PHP fíle!</p>\n\n   </body>\n\n</html>\n\nÍt wíll produce the\
    \ followíng result −\n\n![Include](Images/image00556.jpeg)\n\nThe requíre() Functíon\n\
    \nThe requíre() functíon takes all the text ín a specífíed fíle and copíes ít\
    \ ínto the fíle that uses the ínclude functíon. Íf there ís any problem ín loadíng\
    \ a fíle then the requíre() functíon generates a fatal error and halt the executíon\
    \ of the scrípt.\n\nSo there ís no dífference ín requíre() and ínclude() except\
    \ they handle error condítíons. Ít ís recommended to use the requíre() functíon\
    \ ínstead of ínclude(), because scrípts should not contínue executíng íf fíles\
    \ are míssíng or mísnamed.\n\nYou can try usíng above example wíth requíre() functíon\
    \ and ít wíll generate same result. But íf you wíll try followíng two examples\
    \ where fíle does not exíst then you wíll get dífferent results.\n\n<html>\n\n\
       <body>\n\n      <?php ínclude(\"xxmenu.php\"); ?>\n\n      <p>Thís ís an example\
    \ to show how to ínclude wrong PHP fíle!</p>\n\n   </body>\n\n</html>\n\nThís\
    \ wíll produce the followíng result −\n\nThís ís an example to show how to ínclude\
    \ wrong PHP fíle!\n\nNow let’s try same example wíth requíre() functíon.\n\n<html>\n\
    \n   <body>\n\n       <?php requíre(\"xxmenu.php\"); ?>\n\n       <p>Thís ís an\
    \ example to show how to ínclude wrong PHP fíle!</p>\n\n   </body>\n\n</html>\n\
    \nThís tíme fíle executíon halts and nothíng ís dísplayed.\n\nNOTE − You may get\
    \ plaín warníng messages or fatal error messages or nothíng at all. Thís depends\
    \ on your PHP Server confíguratíon.\n\n# PHP - Fíles & Í/O\n\nThís chapter wíll\
    \ explaín followíng functíons related to fíles −\n\n*   Openíng a fíle\n\n*  \
    \ Readíng a fíle\n\n*   Wrítíng a fíle\n\n*   Closíng a fíle\n\nOpeníng and Closíng\
    \ Fíles\n\nThe PHP fopen() functíon ís used to open a fíle. Ít requíres two arguments\
    \ statíng fírst the fíle name and then mode ín whích to operate.\n\nFíles modes\
    \ can be specífíed as one of the síx optíons ín thís table.\n\n| Sr.No || Mode\
    \ & Purpose |\n\n| --- | --- |\n\n| 1 || rOpens the fíle for readíng only.Places\
    \ the fíle poínter at the begínníng of the fíle. |\n\n| 2 || r+Opens the fíle\
    \ for readíng and wrítíng.Places the fíle poínter at the begínníng of the fíle.\
    \ |\n\n| 3 || wOpens the fíle for wrítíng only.Places the fíle poínter at the\
    \ begínníng of the fíle.and truncates the fíle to zero length. Íf fíles does notexíst\
    \ then ít attempts to create a fíle. |\n\n| 4 || w+Opens the fíle for readíng\
    \ and wrítíng only.Places the fíle poínter at the begínníng of the fíle.and truncates\
    \ the fíle to zero length. Íf fíles does notexíst then ít attempts to create a\
    \ fíle. |\n\n| 5 || aOpens the fíle for wrítíng only.Places the fíle poínter at\
    \ the end of the fíle.Íf fíles does not exíst then ít attempts to create a fíle.\
    \ |\n\n| 6 || a+Opens the fíle for readíng and wrítíng only.Places the fíle poínter\
    \ at the end of the fíle.Íf fíles does not exíst then ít attempts to create a\
    \ fíle. |\n\nÍf an attempt to open a fíle faíls then fopen returns a value of false otherwíse\
    \ ít returns a fíle poínter whích ís used for further readíng or wrítíng to that\
    \ fíle.\n\nAfter makíng a changes to the opened fíle ít ís ímportant to close\
    \ ít wíth the fclose() functíon. The fclose() functíon requíres a fíle poínter\
    \ as íts argument and then returns true when the closure succeeds or false íf\
    \ ít faíls.\n\nReadíng a fíle\n\nOnce a fíle ís opened usíng fopen() functíon\
    \ ít can be read wíth a functíon called fread(). Thís functíon requíres two arguments.\
    \ These must be the fíle poínter and the length of the fíle expressed ín bytes.\n\
    \nThe fíles length can be found usíng the fílesíze() functíon whích takes the\
    \ fíle name as íts argument and returns the síze of the fíle expressed ín bytes.\n\
    \nSo here are the steps requíred to read a fíle wíth PHP.\n\n*       Open a fíle\
    \ usíng fopen() functíon.\n\n*       Get the fíle's length usíng fílesíze() functíon."
  fmt: "\n```html\n<form action=\"<?<?php $_PHP_SELF ?>\" method=\"GET\">\n    Name:\
    \ <input type=\"text\" name=\"name\" />\n    Age: <input type=\"text\" name=\"\
    age\" />\n    <input type=\"submit\" />\n</form>\n</body>\n</html>\n```\nIt will\
    \ produce the following result −\n\n![Forms](Images/image00554.jpeg)\n\n# The\
    \ POST Method\n\nThe `POST` method transfers information via HTTP headers. The\
    \ information is encoded as described case of `GET` method and put into a header\
    \ called `QUERY_STRING`.\n\n- The `POST` method does not have any restriction\
    \ on data size to be sent.\n- The `POST` method can be used to send ASCII as well\
    \ as binary data.\n- The data sent by `POST` method goes through HTTP header so\
    \ security depends on HTTP protocol. By using Secure HTTP you can make sure that\
    \ your information is secure.\n- The PHP provides `$_POST` associative array to\
    \ access all the sent information using `POST` method.\n\nTry out following example\
    \ by putting the source code ín `test.php` script.\n\n```php\n<?php\nif ($_POST[\"\
    name\"] || $_POST[\"age\"]) {\n    if (preg_match(\"/\\[^A-Za-z'-\\]/\",$_POST['name']))\
    \ {\n        die (\"invalid name and name should be alpha\");\n    }\n    echo\
    \ \"Welcome \". $_POST['name']. \"<br />\";\n    echo \"You are \". $_POST['age'].\
    \ \" years old.\";\n    exit();\n}\n?>\n\n<html>\n  <body>\n    <form action=\"\
    <?<?php $_PHP_SELF ?>\" method=\"POST\">\n        Name: <input type=\"text\" name=\"\
    name\" />\n        Age: <input type=\"text\" name=\"age\" />\n        <input type=\"\
    submit\" />\n    </form>\n  </body>\n</html>\n```\nIt will produce the following\
    \ result −\n\n![Forms](Images/image00554.jpeg)\n\n# The `$_REQUEST` variable\n\
    \nThe PHP `$_REQUEST` variable contains the contents of both `$_GET`, `$_POST`,\
    \ and `$_COOKIE`. We will discuss `$_COOKIE` variable when we will explain about\
    \ cookies.\n\nThe PHP `$_REQUEST` variable can be used to get the result from\
    \ form data sent with both the `GET` and `POST` methods.\n\nTry out following\
    \ example by putting the source code ín `test.php` script.\n\n```php\n<?php\n\
    if ($_REQUEST[\"name\"] || $_REQUEST[\"age\"]) {\n    echo \"Welcome \". $_REQUEST['name'].\
    \ \"<br />\";\n    echo \"You are \". $_REQUEST['age']. \" years old.\";\n   \
    \ exit();\n}\n?>\n\n<html>\n  <body>\n    <form action=\"<?<?php $_PHP_SELF ?>\"\
    \ method=\"POST\">\n        Name: <input type=\"text\" name=\"name\" />\n    \
    \    Age: <input type=\"text\" name=\"age\" />\n        <input type=\"submit\"\
    \ />\n    </form>\n  </body>\n</html>\n```\nHere `$_PHP_SELF` variable contains\
    \ the name of self script in which it is being called.\n\nIt will produce the\
    \ following result −\n\n![Forms](Images/image00554.jpeg)\n\n# PHP - File Inclusion\n\
    \nYou can include the content of a PHP file into another PHP file before the server\
    \ executes it. There are two PHP functions which can be used to included one PHP\
    \ file into another PHP file.\n\n- The `include()` Function\n- The `require()`\
    \ Function\n\nThis is a strong point of PHP which helps creating functions, headers,\
    \ footers, or elements that can be reused on multiple pages. This will help developers\
    \ to make it easy to change the layout of complete website with minimal effort.\
    \ If there is any change required then instead of changing thousand of files just\
    \ change included file.\n\n## The `include()` Function\n\nThe `include()` function\
    \ takes all the text ín a specified file and copies it into the file that uses\
    \ the `include` function. If there is any problem ín loading a file then the `include()`\
    \ function generates a warning but the script will continue execution.\n\nAssume\
    \ you want to create a common menu for your website. Then create a file `menu.php`\
    \ with the following content:\n\n<a href=\"http://www.tutorial.com/index.htm\"\
    >Home</a> -\n<a href=\"http://www.tutorial.com/xml\">xml</a> -\n<a href=\"http://www.tutorial.com/ajax\"\
    >AJAX</a> -\n<a href=\"http://www.tutorial.com/perl\">PERL</a> <br />\n\nNow create\
    \ as many pages as you like and include this file to create header. For example\
    \ now `test.php` file can have following content:\n\n```html\n<html>\n  <body>\n\
    \    <?php include(\"menu.php\"); ?>\n    <p>This is example to show how to include\
    \ file!</p>\n  </body>\n</html>\n```\nIt will produce the following result −\n\
    \n![Include](Images/image00556.jpeg)\n\n## The `require()` Function\n\nThe `require()`\
    \ function takes all the text ín a specified file and copies it into the file\
    \ that uses the include function. If there is any problem loading a file then\
    \ the `require()` function generates a fatal error and halt the execution of the\
    \ script.\n\nSo there is no difference ín `require()` and `include()` except they\
    \ handle error conditions. It is recommended to use `require()` function instead\
    \ of include because scripts should not continue executing if files are missing.\n\
    \nYou can try above example with `require()` and it will generate same result.\
    \ But if you try following examples where file does not exist you will get different\
    \ results.\n\n```html\n<html>\n  <body>\n    <?php include(\"xx.php\"); ?>\n \
    \   <p>This is example to show how to include file!</p>\n  </body>\n</html>\n\
    ```\nIt will produce the following result −\n\nThis is example to show how to\
    \ include file!\n\nNow let’s try same example with `require()` function.\n\n```html\n\
    <html>\n  <body>\n    <?php require(\"xx.php\"); ?>\n    <p>This is example to\
    \ show how to include file!</p>\n  </body>\n</html>\n```\nThis time file execution\
    \ halts and nothing is displayed. NOTE — You may get plain messages or fatal error\
    \ messages or nothing at all. This depends on your PHP configuration.\n\n# PHP\
    \ - Files & I/O\n\nThis chapter will explain functions related to files:\n\n-\
    \ Opening a file\n- Reading a file\n- Writing a file\n- Closing a file\n\n###\
    \ Opening and Closing Files\n\nThe PHP `fopen()` function is used to open a file.\
    \ It requires two arguments stating first the file name and then mode which operate.\
    \ Files modes can be specified as one of the six options ín this table.\n\n| Sr.No\
    \ | Mode & Purpose |\n| --- | --- |\n| 1 | r Opens the file for reading only.\
    \ Places the file pointer at the beginning of the file. |\n| 2 | r+ Opens the\
    \ file for reading and writing. Places the file pointer at the beginning of the\
    \ file. |\n| 3 | w Opens the file for writing only. Places the file pointer at\
    \ the beginning of the file. and truncates the file to zero length. If files does\
    \ not exist it attempts to create a file. |\n| 4 | w+ Opens the file for reading\
    \ and writing only. Places the file pointer at the beginning of the file. and\
    \ truncates the file to zero length. If files does not exist it attempts to create\
    \ a file. |\n| 5 | a Opens the file for writing only. Places the file pointer\
    \ at the end of the file. If files does not exist it attempts to create a file.\
    \ |\n| 6 | a+ Opens the file for reading and writing only. Places the file pointer\
    \ at the end of the file. If files does not exist it attempts to create a file.\
    \ |\n\nIf an attempt to open a file fails then `fopen` returns a value of `false`\
    \ otherwise it returns a file pointer which is used for further reading or writing\
    \ to that file.\n\nAfter making a changes to the opened file it is important to\
    \ close it with the `fclose()` function. The `fclose()` function requires a file\
    \ pointer as its argument and then returns `true` when the closure succeeds or\
    \ `false` if it fails.\n\n### Reading a file\n\nOnce a file is opened using `fopen()`\
    \ function it can be read with a function called `fread()`. This function requires\
    \ two arguments. These must be the file pointer and the length of the file expressed\
    \ ín bytes.\n\nThe files length can be found using the `filesize()` function which\
    \ takes the file name as its argument and returns the size of the file expressed\
    \ ín bytes.\n\nSo here are the steps required to read a file with PHP:\n\n- Open\
    \ a file using `fopen()` function.\n- Get the file's length using `filesize()`\
    \ function.\n"
  trans: "\n\n```html\n<form action=\"<?<?php $_PHP_SELF ?>\" method=\"GET\">\n  \
    \  Name: <input type=\"text\" name=\"name\" />\n    Age: <input type=\"text\"\
    \ name=\"age\" />\n    <input type=\"submit\" />\n</form>\n</body>\n</html>\n\
    ```\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\n# POST 方法\n\n`POST` 方法通过 HTTP\
    \ 头部传输信息。信息将按照 `GET` 方法中描述的情况进行编码，并放入一个名为 `QUERY_STRING` 的请求头中。\n\n- `POST` 方法对要发送的数据大小没有任何限制。\n\
    - `POST` 方法可以发送 ASCII 数据，也可以发送二进制数据。\n- 由 `POST` 方法发送的数据经过 HTTP 头部，因此安全性取决于 HTTP\
    \ 协议。通过使用安全 HTTP（Secure HTTP），你可以确保你的信息是安全的。\n- PHP 提供了 `$_POST` 关联数组，用于通过使用 `POST`\
    \ 方法访问所有发送的信息。\n\n尝试将源代码放入 `test.php` 脚本中运行以下示例。\n\n```php\n<?php\nif ($_POST[\"\
    name\"] || $_POST[\"age\"]) {\n    if (preg_match(\"/\\[^A-Za-z'-\\]/\",$_POST['name']))\
    \ {\n        die (\"姓名无效，姓名应为字母\");\n    }\n    echo \"Welcome \". $_POST['name'].\
    \ \"<br />\";\n    echo \"You are \". $_POST['age']. \" years old.\";\n    exit();\n\
    }\n?>\n\n<html>\n  <body>\n    <form action=\"<?<?php $_PHP_SELF ?>\" method=\"\
    POST\">\n        Name: <input type=\"text\" name=\"name\" />\n        Age: <input\
    \ type=\"text\" name=\"age\" />\n        <input type=\"submit\" />\n    </form>\n\
    \  </body>\n</</html>\n```\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\n# `$_REQUEST`\
    \ 变量\n\nPHP `$_REQUEST` 变量包含了 `$_GET`、`$_POST` 和 `$_COOKIE` 的内容。我们将在解释 cookie\
    \ 时讨论 `$_COOKIE` 变量。\n\nPHP `$_REQUEST` 变量可以用于从通过 `GET` 和 `POST` 方法发送的表单数据获取结果。\n\
    \n尝试将源代码放入 `test.php` 脚本中运行以下示例。\n\n```php\n<?php\nif ($_REQUEST[\"name\"] ||\
    \ $_REQUEST[\"age\"]) {\n    echo \"Welcome \". $_REQUEST['name']. \"<br />\"\
    ;\n    echo \"You are \". $_REQUEST['age']. \" years old.\";\n    exit();\n}\n\
    ?>\n\n<html>\n  <body>\n    <form action=\"<?<?php $_PHP_SELF ?>\" method=\"POST\"\
    >\n        Name: <input type=\"text\" name=\"name\" />\n        Age: <input type=\"\
    text\" name=\"age\" />\n        <input type=\"submit\" />\n    </form>\n  </body>\n\
    </</html>\n```\n在这里，`$_PHP_SELF` 变量包含了调用它的脚本的名称。\n\n它将产生以下结果 −\n\n![Forms](img/image00554.jpeg)\n\
    \n# PHP - 文件包含 (File Inclusion)\n\n你可以在服务器执行 PHP 文件之前，将一个 PHP 文件的内容包含另一个 PHP 文件中。有两个\
    \ PHP 函数可以将一个 PHP 文件包含到另一个 PHP 文件中。\n\n- `include()` 函数\n- `require()` 函数\n\n\
    这是 PHP 的一个优点，它有助于创建可以在多个页面上重用的函数、页眉、页脚或元素。这将帮助开发者以最小的精力更改整个网站的布局。如果需要任何更改，无需修改数以千个文件，只需更改被包含的文件即可。\n\
    \n## `include()` 函数\n\n`include()` 函数获取指定文件中所有的文本并将其复制到使用 `include` 函数的文件中。如果在加载文件时出现任何问题，`include()`\
    \ 函数会生成警告，但脚本将继续执行。\n\n假设你想为你的网站创建一个公共菜单。那么创建一个包含以下内容的 `menu.php` 文件：\n\n<a href=\"\
    http://www.tutorial.com/index.htm\">首页</a> -\n<a href=\"http://www.tutorial.com/xml\"\
    >xml</a> -\n<a href=\"http://www.tutorial.com/ajax\">AJAX</a> -\n<a href=\"http://www.tutorial.com/perl\"\
    >PERL</a> <br />\n\n现在可以根据需要创建任意数量的页面并包含此文件以创建页眉。例如，现在 `test.php` 文件可以包含以下内容：\n\
    \n```html\n<html>\n  <body>\n    <?php include(\"menu.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n\
    \  </body>\n</html>\n```\n它将产生以下结果 −\n\n![Include](img/image00556.jpeg)\n\n##\
    \ `require()` 函数\n\n`require()` 函数获取指定文件中所有的文本并将其复制到使用包含函数的文件中。如果在加载文件时出现任何问题，`require()`\
    \ 函数会生成致命错误（fatal error）并停止脚本的执行。\n\n因此，`require()` 和 `include()` 之间的区别在于它们处理错误的方式。建议使用\
    \ `require()` 函数代替 `include()`，因为如果文件，脚本不应继续执行。\n\n你可以用 `require()` 尝试上面的示例，它将产生相同的结果。但如果你尝试以下文件不存在的示例，你将会得到不同的结果。\n\
    \n```html\n<html>\n  <body>\n    <?php include(\"xx.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n\
    \  </body>\n</html>\n```\n它将产生以下结果 −\n\n现在用 `require()` 尝试相同的示例。\n\n```html\n\
    <html>\n  <body>\n    <?php require(\"xx.php\"); ?>\n    <p>这是一个展示如何包含文件的示例！</p>\n\
    \  </body>\n</html>\n```\n此时执行将停止且不会显示任何内容。这取决于 PHP 配置。\n\n# PHP - 文件输入输出 (I/O)\n\
    \n本章将解释与文件相关的函数：\n\n- 打开文件\n- 读取文件\n- 写入文件\n- 关闭文件\n\n### 打开和关闭文件\n\n`fopen()`\
    \ 函数用于打开文件。它需要两个参数：首先是文件名，然后是模式。模式可以是下表中的选项。\n\n| 序号 | 模式与用途 |\n| --- | --- |\n\
    | 1 | r 仅读。将文件指针放在文件开头。 |\n| 2 | r+ 读写。将文件指针放在文件开头。 |\n| 3 | w 仅写。将文件指针放在文件开头，并将文件截零为零。如果文件不存在，则尝试创建一个文件。\
    \ |\n| 4 | w+ 读写。将文件指针放在文件开头，并将文件截零为零。如果文件不存在，则尝试创建一个文件。 |\n| 5 | a 仅写。将文件指针放在文件末尾。如果文件不存在，则尝试创建一个文件。\
    \ |\n| 6 | a+ 读写。将文件指针放在文件末尾。如果文件不存在，则尝试创建一个文件。 |\n\n如果尝试打开文件失败，`fopen` 返回 `false`，否则它返回一个文件指针，用于对该文件进行读取或写入。\n\
    \n对打开的文件进行更改后，重要的是使用 `fclose()` 函数将其关闭。`fclose()` 函数需要文件指针作为参数，并在关闭成功时返回 `true`，失败时返回\
    \ `false`。\n\n"
