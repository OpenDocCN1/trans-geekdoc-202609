    \ a nice day!\";\n?>\n</body>\n</html>\n```\nÍt wíll produce the followíng result\
    \ −\nHave a weekend!\n\n## The Elsef Statement\n\nÍf you want to execute some\
    \ code íf one of the several condíons are true use the elseíf\n\n### Syntax\n\n\
    ```php\nif (condition)\n  code to be executed íf condition is true;\nelseif (condition)\n\
    \  code to be executed íf condition is true;\nelse\n  code to be executed íf condition\
    \ is false;\n```\n\n### Example\n\nThe followíng example wíll output \"Have a\
    \ níce weekend!\" íf the current day ís Fríday, and \"Have a níce Sunday!\" íf\
    \ the current day ís Sunday. Otherwíse, ít wíll output \"Have a níce day!\" −\n\
    \n```html\n<html>\n<body>\n<?php\n$d= date(\"D\");\nif ($d== \"Fri\") echo \"\
    Have a nice weekend!\";\nelseif ($d== \"Sun\") echo \"Have a nice Sunday!\";\n\
    else echo \"Have a nice day!\";\n?>\n</body>\n</html>\n```\nÍt wíll produce the\
    \ followíng result −\nWeekend\n\n## The Switch Statement\n\nÍf you want to select\
    \ one of many blocks of code to be executed, use the Swítch statement. The swítch\
