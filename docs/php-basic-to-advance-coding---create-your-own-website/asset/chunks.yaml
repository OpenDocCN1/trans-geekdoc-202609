  fmt: "\n# Characteristics of PHP\n\nFive important characteristics make PHP's nature\
    \ possible:\n\n* Simplicity\n* Efficiency\n* Security\n* Flexibility\n* Familiarity\n\
    \n## \"Hello World\" Script in PHP\n\nTo get a feel for PHP, first start with\
    \ simple scripts. Since \"Hello World!\" is an essential example, first we will\
    \ create a friendly \"Hello World!\" script.\n\nAs mentioned earlier, PHP is embedded\
    \ in HTML. That means in your normal HTML (or XHTML if you're cutting-edge) you'll\
    \ have PHP statements like this:\n\n```html\n<html>\n<head>\n<title>Hello World</title>\n\
    </head>\n<body>\n<?php echo \"Hello World!\";?>\n</body>\n</html>\n```\n\nIt will\
    \ produce the following result:\n\nHello World!\n\nIf you examine the HTML output\
    \ of the above example, you'll notice that the PHP code is not present in the\
    \ file sent from the server to your browser. All of the PHP present in the Web\
    \ page is processed and stripped from the page; the only thing returned to the\
    \ client from the Web server is pure HTML output.\n\nAll PHP code must be included\
    \ inside one of three special markup tags recognized by the PHP Parser:\n\n```php\n\
    <?php PHP code goes here ?>\n<?php PHP code goes here ?>\n<script language=\"\
    PHP\">PHP code goes here</script>\n```\n\nA most common tag is `<?php...?>` and\
    \ we will also use the same tag in our tutorial. From the next chapter we will\
    \ start with Environment Setup on your machine and then we will discuss all concepts\
    \ related to PHP to make you comfortable with the language.\n\n# PHP Environment\
    \ Setup\n\nIn order to develop and run PHP pages three vital components need to\
    \ be installed on your computer system:\n\n* **Web Server**: PHP will work with\
    \ virtually all Web Server software, including Microsoft's Internet Information\
    \ Server (IIS) but most often used is freely available Apache Server. Download\
    \ Apache for free here: `https://httpd.apache.org/download.cgi`\n* **Database**:\
    \ PHP will work with virtually all database software, including Oracle and Sybase\
    \ but most commonly used is freely available MySQL database. Download MySQL for\
    \ free here: `https://www.mysql.com/downloads/`\n* **PHP Parser**: In order to\
    \ process PHP script instructions a parser must be installed to generate HTML\
    \ output that can be sent to the Web Browser. This tutorial will guide you how\
    \ to install PHP parser on your computer.\n\n### PHP Parser Installation\n\nBefore\
    \ you proceed it is important to make sure that you have proper environment setup\
    \ on your machine to develop your web programs using PHP.\n\nType the following\
    \ address into your browser's address box: `http://127.0.0.1/info.php`\n\nIf this\
    \ displays a page showing your PHP installation related information then it means\
    \ you have PHP and server installed properly. Otherwise you have to follow given\
    \ procedure to install PHP on your computer. This section will guide you to install\
    \ and configure PHP over the following four platforms:\n\n* PHP Installation on\
    \ Linux or Unix with Apache\n* PHP Installation on Mac OS X with Apache\n* PHP\
    \ Installation on Windows NT/2000/XP with IIS\n* PHP Installation on Windows NT/2000/XP\
    \ with Apache\n\n### Apache Configuration\n\nIf you are using Apache as a Web\
    \ Server then this section will guide you to edit Configuration files. Check it\
    \ here: `https://www.tutorialspoint.com/php/apache_configuration.htm`\n\n### php.ini\
    \ Configuration\n\nThe PHP configuration file `php.ini` is the final and most\
    \ immediate way to affect PHP's functionality. Check it here: `https://www.tutorialspoint.com/php_ini_configuration.htm`\n\
    \n### Windows Configuration\n\nTo configure PHP on your Windows machine you can\
    \ refer your Reference Manual shipped with PHP.\n\n# PHP Syntax Overview\n\nThis\
    \ chapter will give you an idea of very basic syntax of PHP and make your PHP\
    \ foundation strong.\n\n## Escaping to PHP\n\nThe PHP parsing engine needs a way\
    \ to differentiate PHP code from other elements in the page. The mechanism for\
    \ doing so is known as 'escaping to PHP'. There are four ways to do this:\n\n\
    ### Canonical PHP tags\n\nThe most universally effective tag style is:\n\n```php\n\
    <?php...?>\n```\nIf you use this style you can be positive that your tags will\
    \ always be correctly interpreted.\n\n### Short-open (SGML-style) tags\n\nShort\
    \ or short-open tags look like this: `<??>`. Short tags are, as one might expect,\
    \ the shortest option You must do one of two things to enable PHP to recognize\
    \ the tags:\n\n* Choose the `enable-short-tags` configuration option when you're\
    \ building PHP.\n* Set `short_open_tag` setting in your `php.ini` file to `on`.\
    \ This option must be disabled to parse XML with PHP because the same syntax is\
    \ used for XML tags.\n\n### ASP-style tags\n\nASP-style tags mimic the tags used\
    \ by Active Pages to delineate code blocks. ASP-style tags look like this: `<%%>`.\
    \ To use ASP-style tags you will need to set the configuration option in your\
    \ `php.ini` file.\n\n### HTML script tags\n\nHTML script tags look like this:\
    \ `<script language=\"PHP\">...</script>`\n\n## Commenting PHP Code\n\nA comment\
    \ is the portion of a program that exists only for the human reader and stripped\
    \ out before displaying the program result. There are two commenting formats in\
    \ PHP:\n\n### Single-line comments\n\nThey are generally used for short explanations\
    \ or relevant to the local code. Here are the examples of single line comments:\n\
    \n```php\n<?php\n# This is a comment, and\n# This is the second line of the comment\n\
    // This is a comment too.\nprint \"An example with single line comments\";\n?>\n\
    ```\n\n### Multiline printing\n\nHere are the examples to print multiple lines\
    \ in a single print statement:\n\n```php\n<?php\n# First Example\nprint <<<END\n\
    This uses the \"here document\" syntax to output\nmultiple lines with $variable\
    \ interpolation. Note\nthat the here document terminator must appear on a\nline\
    \ with just a semicolon no extra whitespace!\nEND;\n\n# Second Example\nprint\
    \ \"This spans\nmultiple lines. The newlines will be output as well\";\n?>\n```\n\
    \n### Multiline comments\n\nThey are generally used to provide pseudocode algorithms\
    \ and more detailed explanations when necessary. The multiline style of commenting\
    \ is the same as in C. Here are the example of multiline comments:\n\n```php\n\
    <?php\n/* This is a comment with multiline\nAuthor : Mohammad Mohtashím\nPurpose:\
    \ Multiline Comments Demo\nSubject: PHP */\nprint \"An example with multiline\
    \ comments\";\n?>\n```\n\n## PHP is whitespace insensitive\n\nWhitespace is the\
    \ stuff you type that is typically invisible on the screen, including spaces,\
    \ tabs, and carriage returns (end-of-line characters). PHP whitespace insensitive\
    \ means that it almost never matters how many whitespace characters you have in\
    \ a row. one whitespace character is the same as many such characters.\n\nFor\
    \ example, each of the following PHP statements that assigns the sum of 2 + 2\
    \ to the variable `$four` is equivalent:\n\n```php\n$four = 2 + 2; // single spaces\n\
    $four = 2 + 2 ; // spaces and tabs\n$four =\n2+\n2; // multiple lines\n```\n\n\
    ### PHP is case sensitive\n\nYeah it is true that PHP is a case sensitive language.\
    \ Try out following example:\n\n```html\n<html>\n<body>\n  <?php\n    $capital\
    \ = 67;\n    print(\"Variable capital is $capital<br>\");\n    print(\"Variable\
    \ CaPíTaL is $CaPíTaL<br>\");\n  ?>\n</body>\n</html>\n```\n\nThis will produce\
    \ the following result:\n\nVariable capital is 67\n\nVariable CaPíTaL is \n"
  trans: "\n\n# PHP 的特性\n\n五个重要的特性使得 PHP 的本质成为可能：\n\n* 简单\n* 高效\n* 安全\n* 灵活性\n* 熟悉\n\
    \n## PHP 中的 \"Hello World\" 脚本\n\n为了感受 PHP 的特性，首先从简单的脚本开始。由于 \"Hello World!\"\
    \ 是一个基础示例，我们首先将创建一个友好的 \"Hello World!\" 脚本。\n\n如之前提到的，PHP 是嵌入在 HTML 中的。这意味着在你的普通\
    \ HTML（如果你追求前沿，则是 XHTML）中，你会有这样的 PHP 语句：\n\n```html\n<html>\n<head>\n<title>Hello\
    \ World</title>\n</head>\n<body>\n<?php echo \"Hello World!\";?>\n</body>\n</html>\n\
    ```\n\n它将产生以下结果：\n\nHello World!\n\n如果你检查上述示例的 HTML 输出，你会发现从服务器发送到你浏览器的文件中，并不存在\
    \ PHP 代码。网页中出现的所有 PHP 代码都经过了处理并从页面中剥离了；Web 服务器返回给客户端的唯一内容是纯 HTML 输出。\n\n所有的 PHP\
    \ 代码都必须包含在 PHP 解析器识别的三个特殊标记标签之一：\n\n```php\n<?php 此处编写 PHP 代码 ?>\n<?php 此处编写 PHP\
    \ 代码 ?>\n<script language=\"PHP\">此处编写 PHP 代码</script>\n```\n\n最常用的标签是 `<?php...?>`，我们在教程中也将使用相同的标签。从下一章开始，我们将从在你的机器上进行环境搭建开始，然后我们将讨论所有与\
    \ PHP 相关的概念，让你熟悉这门语言。\n\n# PHP 环境搭建\n\n为了开发和运行 PHP 页面，你的计算机系统上需要安装三个关键组件：\n\n\
    * **Web 服务器**：PHP 可以与几乎所有的 Web 服务器软件配合，包括微软的 Internet 信息服务 (IIS)，但最常用的是免费提供的 Apache\
    \ 服务器。在此免费下载 Apache：`https://httpd.apache.org/download.cgi`\n* **数据库**：PHP 可以与几乎所有的数据库软件配合，包括\
    \ Oracle 和 Sybase，但最常用免费提供的 MySQL 数据库。在此免费下载 MySQL：`https://www.mysql.com/downloads/`\n\
    * **PHP 解析器**：为了处理 PHP 脚本指令，必须安装解析器来生成可以发送到浏览器的 HTML 输出。本教程将指导你如何在计算机上安装 PHP 解析器。\n\
    \n### 安装 PHP 解析器\n\n在继续之前，重要的是确保你的机器上已经配置了正确的环境，以便使用 PHP 开发 Web 程序。\n\n在浏览器的地址栏输入以下地址：`http://127.0.0.1/info.php`\n\
    \n如果显示了一个显示 PHP 安装相关信息的页面，说明你已正确安装了 PHP 和服务器。否则，你必须按照给定的程序在计算机上安装 PHP。本节将指导你在以下四个平台上安装和配置\
    \ PHP：\n\n* 在 Linux 或 Unix 上配合 Apache 安装 PHP\n* 在 Mac OS X 上配合 Apache 安装 PHP\n\
    * 在 Windows NT/2000/XP 上配合 IIS 安装 PHP\n* 在 Windows NT/2000/XP 上配合 Apache 安装 PHP\n\
    \n### Apache 配置\n\n如果你使用 Apache 作为 Web 服务器，本节将指导你编辑配置文件。在此查看：`https://www.tutorialspoint.com/php/apache_configuration.htm`\n\
    \n### php.ini 配置\n\nPHP 配置文件 `php.ini` 是影响 PHP 功能最后且最直接的方法。在此查看：`https://www.tutorialspoint.com/php_ini_configuration.htm`\n\
    \n### Windows 配置\n\n要在你的 Windows 机器上配置 PHP，你可以参考随 PHP 附带的手手册。\n\n# PHP 语法概述\n\n\
    本章将让你了解非常基础的 PHP 语法，并打好 PHP 基础。\n\n## 转义到 PHP\n\nPHP 解析引擎需要一种方法将 PHP 代码与页面其他元素区分开。这种机制被称为“转义到\
    \ PHP”（escaping to PHP）。有四种方法：\n\n### 标准 PHP 标签\n\n最通用的标记样式是：\n\n```php\n<?php...?>\n\
    ```\n如果你使用这种样式，你可以确定你的标签将始终被正确解释。\n\n### 短开放标签 (SGML 风格)\n\n短标签或短开放标签看起来像这样：`<??>`。正如人们预期的，短标签是最短的选项。你必须执行以下操作之一来让\
    \ PHP 识别这些标签：\n\n* 在构建 PHP 时选择 `enable-short-tags` 配置选项。\n* 在你的 `php.ini` 文件中将\
    \ `short_open_tag` 设置为 `on`。在 PHP 解析 XML 时，必须禁用此选项，因为 XML 标签也使用了相同的语法。\n\n###\
    \ ASP 风格标签\n\nASP 风格标签模仿 Active Pages 用于界定代码块的标签。ASP 风格标签看起来像这样：`<%%>`。要使用 ASP\
    \ 风格标签，你需要在 `php.ini` 文件中设置配置选项。\n\n### HTML 脚本标签\n\nHTML 脚本标签看起来像这样：`<script\
    \ language=\"PHP\">...</script>`\n\n## 注释 PHP 代码\n\n注释是程序中仅供人类阅读的部分，在显示程序结果之前会被剥离。PHP\
    \ 中有两种注释格式：\n\n### 单行注释\n\n它们通常用于简短说明或与本地代码相关。以下是单行注释的示例：\n\n```php\n<?php\n#\
    \ 这是一个注释，\n# 这是注释的第二行\n// 这也是一个注释。\nprint \"带有单行注释的示例\";\n?>\n```\n\n### 多行打印\n\
    \n以下是在单个 print 语句中打印多行的示例：\n\n```php\n<?php\n# 第一个示例\nprint <<<END\n这使用“在此文档”（here\
    \ document）语法来输出\n带有 $variable 变量值的多行。请注意\n在此文档的终止符必须出现在\n仅包含分号的行上，不能有额外的空格！\n\
    END;\n\n# 第二个示例\nprint \"这跨越了\n多行。换行符也将输出\";\n?>\n```\n\n### 多行注释\n\n它们通常用于需要时提供伪代码算法和更详细的解释。多行注释样式与\
    \ C 语言相同。以下是多行注释的示例：\n\n```php\n<?php\n/* 这是一个多行注释\n作者: Mohammad Mohtasim\n目的:\
    \ 多行注释演示\n主题: PHP */\nprint \"带有多行注释的示例\";\n?>\n```\n\n## PHP 对空格不敏感\n\n空格是你输入的在屏幕上通常不可见的字符，包括空格、制表符和回车符（行尾字符）。PHP\
    \ 对空格不敏感意味着连续出现多少个空格几乎没有影响。一个空格字符与许多此类字符是相同的。\n\n例如，以下将 2 + 2 的和赋值给变量 `$four`\
    \ 的 PHP 语句都是等效的：\n\n```php\n$four = 2 + 2; // 单空格\n$four = 2 + 2 ; // 空格和制表符\n\
    $four =\n2+\n2; // 多行\n```\n\n### PHP 大写敏感\n\n是的，PHP 是一种对大小写敏感的语言。尝试以下示例：\n\n\
    ```html\n<html>\n<body>\n  <?php\n    $capital = 67;\n    print(\"Variable capital\
    \ is $capital<br>\");\n    print(\"Variable CaPíTaL is $CaPíTaL<br>\");\n  ?>\n\
    </body>\n</html>\n```\n\n这将产生以下结果：\n\nVariable capital is 67\n\nVariable CaPíTaL\
    \ is \n\n"
