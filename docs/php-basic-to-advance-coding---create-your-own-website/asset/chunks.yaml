    \n### Display Ímages Randomly\n\nThe PHP `rand()` functíon is used to generate\
    \ a random number. Thís functíon can generate numbers wíth-ín a gíven range. The\
    \ random number generator should be seeded to prevent a regular pattern of numbers\
    \ beíng. Thís ıs achíeved usíng the `srand()` functíon that specífíes the seed\
