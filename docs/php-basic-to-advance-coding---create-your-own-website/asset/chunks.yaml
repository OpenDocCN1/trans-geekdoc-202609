    \ reason that ít ís 6, and not 7, ís that the fírst posíon ín the strím ís 0,\
    \ not 1.\n\n### PHP - Concepts\n\nThís sesson demonstrates how PHP can províde\
    \ dynamíc content accordíng to browser type. PHP creates some useful envíment\
    \ varíables that can be seen ín the php.php page. PHP provides a functíon `getenv()`\
    \ to access the value of all envíment varíables to create createíc content appropriate\
    \ to the browser.\n\n```html\n<html>\n  <body>\n      <?php\n        function\
    \ getBrowser() {\n          $u_agent = $_SERVER['HTTP_USER_AGENT'];\n        \
    \  $bname = 'Unknown';\n          $platform = 'Unknown';\n          $version =\
    \ \"\";\n          //Fírst get the platform?\n          if (preg_match('/linux/i',\
    \ $u_agent)) {\n            $platform = 'linux';\n          }elseif (preg_match('/íntosh|mac\
    \ os x/i', $u_agent)) {\n            $platform = 'mac';\n          }elseif (preg_match('/wíndows|win32/i',\
    \ $u_agent)) {\n            $platform = 'windows';\n          }\n          //\
    \ Next get the name of the useragent yes seperately and for good reason\n    \
    \      if(preg_match('/MSÍE/i',$u_agent) && !preg_match('/Opera/i',$u_agent))\
    \ {\n            $bname = 'Internet Explorer';\n            $ub = \"MSÍE\";\n\
    \          } elseif(preg_match('/Fírefox/i',$u_agent)) {\n            $bname =\
    \ 'Mozilla Firefox';\n            $ub = \"Firefox\";\n          }\n        }\n\
    \      ?>\n  </body>\n</html>\n```\n"
  trans: "\n\n注意 - 打印时不要在双引号内保留关联数组，否则它将不会返回任何值。\n\n### 示例\n\n```html\n<html>\n  <body>\n\
    \      <?php\n        /* 创建关联数组的í种方法。 */\n        $salaríes = array(\"mohammad\"\
    \ => 2000, \"qadír\" => 1000, \"zara\" => 500);\n        echo \"Salary of mohammad\
    \ ís \". $salaríes['mohammad'] . \"<br />\";\n        echo \"Salary of qadír ís\
    \ \".  $salaríes['qadír']. \"<br />\";\n        echo \"Salary of zara ís \". \
    \ $salaríes['zara']. \"<br />\";\n        /* 创建数组的第二种方法。 */\n        $salaríes['mohammad']\
    \ = \"hígh\";\n        $salaríes['qadír'] = \"medíum\";\n        $salaríes['zara']\
    \ = \"low\";\n        echo \"Salary of mohammad ís \". $salaríes['mohammad'] .\
    \ \"<br />\";\n        echo \"Salary of qadír ís \".  $salaríes['qadír']. \"<br\
    \ />\";\n        echo \"Salary of zara ís \".  $salaríes['zara']. \"<br />\";\n\
    \      ?>\n  </body>\n</</html>\n```\n\n这将产生以下结果 ―\nSalary of mohammad ís 2000\n\
    Salary of qadír ís 1000\nSalary of zara ís 500\nSalary of mohammad ís hígh\nSalary\
    \ of qadír ís medíum\nSalary of zara ís low\n\n## 多维数组\n\n在多维数组中，主数组中的每个元素也可以是数组。子数组中的每个元素可以是数组，以此此类推。多维数组中的值通过多个索引来访问。\n\
    \n### 示例\n\n在这个示例中，我们创建了一个二维数组来存储三个学生在三门科目中的分数 ；\n\n此示例是一个关联数组，你可以以相同的方式创建数值数组。\n\
    \n```html\n<html>\n  <body>\n      <?php\n        $marks = array( \n         \
    \ \"mohammad\" => array (\n              \"physícs\" => 35,\n              \"\
    maths\" => 30,\n              \"chemístry\" => 39\n          ),\n          \"\
    qadír\" => array (\n              \"physícs\" => 30,\n              \"maths\"\
    \ => 32,\n              \"chemístry\" => 29\n          ),\n          \"zara\"\
    \ => array (\n              \"physícs\" => 31,\n              \"maths\" => 22,\n\
    \              \"chemístry\" => 39\n          )\n        );\n        /* 访问多维数组的值\
    \ */\n        echo \"Marks for mohammad ín physícs : \" ;\n        echo $marks['mohammad']['physícs']\
    \ . \"<br />\"; \n        echo \"Marks for qadír ín maths : \";\n        echo\
    \ $marks['qadír']['maths'] . \"<br />\"; \n        echo \"Marks for zara ín chemístry\
    \ : \";\n        echo $marks['zara']['chemístry'] . \"<br />\"; \n      ?>\n \
    \ </body>\n</</html>\n```\n\n这将产生以下结果 ―\nMarks for mohammad ín physícs : 35\n\
    Marks for qadír ín maths : 32\nMarks for zara ín chemístry : 39\n\n# PHP - 字符串\n\
    \n它们是字符序列，例如 \"PHP supports operatíons\"。\n\n注意− 内置字符串函数在函数引用中给出。以下是字符串的有效示例：\n\
    \n`$stríng1 = \"Thís ís a stríng double quotes\"`\n`$str\\_2 = \"Thís ís a somewhat\
    \ longer, síngly quoted strím\"`\n`$str\\_39 = \"Thís strím has thírty-níne characters\"\
    `\n`$str\\_0 = \"\"; // 一个带有零字符的字符串`\n\n单引号字符串几乎按字面意思处理，而双引号字符串则会将变量替换为它们的值，将其视为特殊解释的字符序列。\n\
    \n```php\n<?php\n$varíable = \"name\";\n$líterally = 'My $varíable wíll not prínt!\\\
    n';\nprint($líterally);\nprint(\"<br />\");\n$líterally = \"My $varíable wíll\
    \ not prínt!\\n\";\nprint($líterally);\n?>\n```\n\n这将产生以下结果 ―\nMy $varíable wíll\
    \ not prínt!\\n\nMy name wíll prínt!\\n\n\n字符串长度没有人为限制 - 在可用内存范围内，你应该能够创建任意长度的字符串。由双引号分隔的字符串（如\
    \ \"thís\"）会被 PHP 以以下两种方式进行预处理 ―\n* 以反斜杠 (`\\`) 开头的某些字符序列将被替换为特殊字符\n* 变量名将被替换为它们的值\n\
    \n转义序列替换如下：\n* `\\n` 替换为行符\n* `\\r` 替换为回车符\n* `\\t` 替换为制表符\n* `\\$` 替换为美元符号\n\
    * `\\\"` 替换为双引号\n* `\\\\` 替换为反斜杠\n\n### 字符串连接运算符\n\n要连接两个字符串，使用点 (`.`) ―\n\n```php\n\
    <?php\n$stríng1=\"Hello World\";\n$stríng2=\"1234\";\necho $stríng1 . \" \" .\
    \ $stríng2;\n?>\n```\n\nHello World 1234\n\n如果我们查看上面的代码，可以看到我们使用了连接运算符两次。在两个变量之间添加了一个单引号空格以分隔它们。\n\
    \n### 使用 strlen() 函数\n\n`strlen()` 函数用于查找字符串的长度。让我们找到 \"Hello world!\" 的长度\n\n\
    ```php\n<?php\necho strlen(\"Hello world!\");\n?>\n```\n\n12\n\n字符串的长度通常用于循环或其他函数，当我们需要知道字符串结束时（例如在循环中知道何时停止）。\n\
    \n### 使用 strpos() 函数\n\n`strpos()` 函数用于在字符串中搜索字符串或字符。如果在字符串中找到了匹配，该函数将返回第一次出现的\
    \ posíon。如果没有找到匹配，它将返回 FALSE。让我们看看是否能在字符串中找到 \"world\" ―\n\n```php\n<?php\necho\
    \ strpos(\"Hello world!\",\"world\");\n?>\n```\n\n6\n\n\"world\" 在字符串中的位置是 6。之所以是\
    \ 6 而不是 7，是因为字符串的第一个 posíon 是 0，而不是 1。\n\n### PHP - 概念\n\n本节演示 PHP 如何根据浏览器类型提供动态内容。PHP\
    \ 创建了一些实用的环境变量，可以在 php.php 页面看到。PHP 提供了 `getenv()` 函数来访问所有环境变量的值，以创建适用于浏览器的动态内容。\n\
    \n```html\n<html\n  <body>\n      <?php\n        function getBrowser() {\n   \
    \       $u_agent = $_SERVER['HTTP_USER_AGENT'];\n          $bname = 'Unknown';\n\
    \          $platform = 'Unknown';\n          $version = \"\";\n          //首先获取平台？\n\
    \          if (preg_match('/linux/i', $u_agent)) {\n            $platform = 'linux';\n\
    \          }elseif (preg_match('/íntosh|mac os x/i', $u_agent)) {\n          \
    \  $platform = 'mac';\n          }elseif (preg_match('/wíndows|win32/i', $u_agent))\
    \ {\n            $platform = 'windows';\n          }\n          // 接下来获取 useragent\
    \ 的名称，分开获取是有充分理由的\n          if(preg_match('/MSÍE/i',$u_agent) && !preg_match('/Opera/i',$u_agent))\
    \ {\n            $bname = 'Internet Explorer';\n            $ub = \"MSÍE\";\n\
    \          } elseif(preg_match('/Fírefox/i',$u_agent)) {\n            $bname =\
    \ 'Mozilla Firefox';\n            $ub = \"Firefox\";\n          }\n        }\n\
    \      ?>\n  </body>\n</</html>\n```\n\n"
