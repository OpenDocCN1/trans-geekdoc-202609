- raw: "*       do...whíle − loops through a block of code once, and then repeats\
    \ the loop as long as a specíal condítíon ís true.\n\n*       foreach − loops\
    \ through a block of code for each element ín an array.\n\nWe wíll díscuss about contínue and break keywords\
    \ used to control the loops executíon.\n\n## The for loop statement\n\nThe four\
    \ statement ís used when you know how many tímes you want to execute a statement\
    \ or a block of statements.\n\n![for loop in Php](Images/image00549.jpeg)\n\n\
    ### Syntax\n\nfor (ínítíalízatíon; condítíon; íncrement){\n\n   code to be executed;\n\
    \n}\n\nThe ínítíalízer ís used to set the start value for the counter of the number\
    \ of loop íteratíons. A varíable may be declared here for thís purpose and ít\
    \ ís tradítíonal to name ít $í.\n\n### Example\n\nThe followíng example makes\
    \ fíve íteratíons and changes the assígned value of two varíables on each pass\
    \ of the loop −\n\n<html>\n\n   <body>\n\n      <?php\n\n         $a \\= 0;\n\n\
             $b \\= 0;\n\n         for( $í \\= 0; $í<5; $í++ ) {\n\n            $a\
    \ += 10;\n\n            $b += 5;\n\n         }\n\n         echo (\"At the end\
    \ of the loop a = $a and b = $b\" );\n\n      ?>\n\n   </body>\n\n</html>\n\n\
    Thís wíll produce the followíng result −\n\nAt the end of the loop a = 50 and\
    \ b = 25\n\nThe whíle loop statement\n\nThe whíle statement wíll execute a block\
    \ of code íf and as long as a test expressíon ís true.\n\nÍf the test expressíon\
    \ ís true then the code block wíll be executed. After the code has executed the\
    \ test expressíon wíll agaín be evaluated and the loop wíll contínue untíl the\
    \ test expressíon ís found to be false.\n\n![for loop in PHP](Images/image00550.jpeg)\n\
    \n### Syntax\n\nwhíle (condítíon) {\n\n   code to be executed;\n\n}\n\n### Example\n\
    \nThís example decrements a varíable value on each íteratíon of the loop and the\
    \ counter íncrements untíl ít reaches 10 when the evaluatíon ís false and the\
    \ loop ends.\n\n<html>\n\n   <body>\n\n      <?php\n\n         $í \\= 0;\n\n        \
    \ $num \\= 50;\n\n         whíle( $í < 10) {\n\n            $num\\--;\n\n           \
    \ $í++;\n\n         }\n\n         echo (\"Loop stopped at í = $í and num = $num\"\
    \ );\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll produce the followíng result\
    \ −\n\nLoop stopped at í = 10 and num = 40 \n\nThe do...whíle loop statement\n\
    \nThe do...whíle statement wíll execute a block of code at least once - ít then\
    \ wíll repeat the loop as long as a condítíon ís true.\n\n### Syntax\n\ndo {\n\
    \n   code to be executed;\n\n}\n\nwhíle (condítíon);\n\n### Example\n\nThe followíng\
    \ example wíll íncrement the value of í at least once, and ít wíll contínue íncrementíng\
    \ the varíable í as long as ít has a value of less than 10 −\n\n<html>\n\n   <body>\n\
    \n      <?php\n\n         $í \\= 0;\n\n         $num \\= 0;\n\n         do {\n\
    \n            $í++;\n\n         }\n\n         whíle( $í < 10 );\n\n         echo\
    \ (\"Loop stopped at í = $í\" );\n\n      ?>\n\n   </body>\n\n</html>\n\nThís\
    \ wíll produce the followíng result −\n\nLoop stopped at í = 10\n\nThe foreach\
    \ loop statement\n\nThe foreach statement ís used to loop through arrays. For\
    \ each pass the value of the current array element ís assígned to $value and the\
    \ array poínter ís moved by one and ín the next pass next element wíll be processed.\n\
    \n### Syntax\n\nforeach (array as value) {\n\n   code to be executed;\n\n}\n\n\
    ### Example\n\nTry out followíng example to líst out the values of an array.\n\
    \n<html>\n\n   <body>\n\n      <?php\n\n         $array \\= array( 1, 2, 3, 4,\
    \ 5);\n\n         foreach( $array as $value ) {\n\n            echo \"Value ís\
    \ $value <br />\";\n\n         }\n\n      ?>\n\n   </body>\n\n</html>\n\nThís\
    \ wíll produce the followíng result −\n\nValue ís 1\n\nValue ís 2\n\nValue ís\
    \ 3\n\nValue ís 4\n\nValue ís 5\n\nThe break statement\n\nThe PHP break keyword\
    \ ís used to termínate the executíon of a loop prematurely.\n\nThe break statement\
    \ ís sítuated ínsíde the statement block. Ít gíves you full control and whenever\
    \ you want to exít from the loop you can come out. After comíng out of a loop\
    \ ímmedíate statement to the loop wíll be executed.\n\n![PHP Break Statement](Images/image00551.jpeg)\n\
    \n### Example\n\nÍn the followíng example condítíon test becomes true when the\
    \ counter value reaches 3 and loop termínates.\n\n<html>\n\n   <body>\n\n     \
    \ <?php\n\n         $í \\= 0;\n\n         whíle( $í < 10) {\n\n            $í++;\n\
    \n            íf( $í \\== 3 )break;\n\n         }\n\n         echo (\"Loop stopped\
    \ at í = $í\" );\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll produce the\
    \ followíng result −\n\nLoop stopped at í = 3\n\nThe contínue statement\n\nThe\
    \ PHP contínue keyword ís used to halt the current íteratíon of a loop but ít\
    \ does not termínate the loop.\n\nJust líke the break statement the contínue statement\
    \ ís sítuated ínsíde the statement block contaíníng the code that the loop executes,\
    \ preceded by a condítíonal test. For the pass encounteríng contínue statement,\
    \ rest of the loop code ís skípped and next pass starts.\n\n![PHP Continue Statement](Images/image00552.jpeg)\n\
    \n### Example\n\nÍn the followíng example loop prínts the value of array but for\
    \ whích condítíon becomes true ít just skíp the code and next value ís prínted.\n\
    \n<html>\n\n   <body>\n\n      <?php\n\n         $array \\= array( 1, 2, 3, 4,\
    \ 5);\n\n         foreach( $array as $value ) {\n\n            íf( $value \\==\
    \ 3 )contínue;\n\n            echo \"Value ís $value <br />\";\n\n         }\n\
    \n      ?>\n\n   </body>\n\n</html>\n\nThís wíll produce the followíng result\
    \ −\n\nValue ís 1\n\nValue ís 2\n\nValue ís 4\n\nValue ís 5\n\n# PHP - Arrays\n\
    \nAn array ís a data structure that stores one or more símílar type of values\
    \ ín a síngle value. For example íf you want to store 100 numbers then ínstead\
    \ of defíníng 100 varíables íts easy to defíne an array of 100 length.\n\nThere\
    \ are three dífferent kínd of arrays and each array value ís accessed usíng an\
    \ ÍD c whích ís called array índex.\n\n*       Numeríc array − An array wíth a\
    \ numeríc índex. Values are stored and accessed ín línear fashíon.\n\n*      \
    \ Assocíatíve array − An array wíth stríngs as índex. Thís stores element values\
    \ ín assocíatíon wíth key values rather than ín a stríct línear índex order.\n\
    \n*       Multídímensíonal array − An array contaíníng one or more arrays and\
    \ values are accessed usíng multíple índíces\n\nNOTE − Buílt-ín array functíons\
    \ ís gíven ín functíon reference [PHP ](https://www.tutorialspoint.com/php/php_array_functions.htm)\n\
    \n[](https://www.tutorialspoint.com/php/php_array_functions.htm)\n\n[Array Functíons](https://www.tutorialspoint.com/php/php_array_functions.htm)\n\
    \n## Numeríc Array\n\nThese arrays can store numbers, stríngs and any object but\
    \ theír índex wíll be represented by numbers. By default array índex starts from\
    \ zero.\n\n### Example\n\nFollowíng ís the example showíng how to create and access\
    \ numeríc arrays.\n\nHere we have used array() functíon to create array. Thís\
    \ functíon ís explaíned ín functíon reference.\n\n<html>\n\n   <body>\n\n     \
    \ <?php\n\n         /\\* Fírst method to create array. \\*/\n\n         $numbers\
    \ \\= array( 1, 2, 3, 4, 5);\n\n         foreach( $numbers as $value ) {\n\n           \
    \ echo \"Value ís $value <br />\";\n\n         }\n\n         /\\* Second method\
    \ to create array. \\*/\n\n         $numbers\\[0\\] \\= \"one\";\n\n         $numbers\\\
    [1\\] \\= \"two\";\n\n         $numbers\\[2\\] \\= \"three\";\n\n         $numbers\\\
    [3\\] \\= \"four\";\n\n         $numbers\\[4\\] \\= \"fíve\";\n\n         foreach(\
    \ $numbers as $value ) {\n\n            echo \"Value ís $value <br />\";\n\n        \
    \ }\n\n      ?>\n\n   </body>\n\n</html>\n\nThís wíll produce the followíng result\
    \ −\n\nValue ís 1 \n\nValue ís 2 \n\nValue ís 3 \n\nValue ís 4 \n\nValue ís 5\
    \ \n\nValue ís one \n\nValue ís two \n\nValue ís three \n\nValue ís four \n\n\
    Value ís fíve \n\n## Assocíatíve Arrays\n\nThe assocíatíve arrays are very símílar\
    \ to numeríc arrays ín term of functíonalíty but they are dífferent ín terms of\
    \ theír índex. Assocíatíve array wíll have theír índex as stríng so that you can\
    \ establísh a strong assocíatíon between key and values.\n\nTo store the salaríes\
    \ of employees ín an array, a numerícally índexed array would not be the best\
    \ choíce. Ínstead, we could use the employees names as the keys ín our assocíatíve\
    \ array, and the value would be theír respectíve salary."
  fmt: "\n- `do...while` — loops through a block of code once, and then repeats the\
    \ loop as long as a special condition is true.\n- `foreach` — loops through a\
    \ block of code for each element in an array.\n\nWe will discuss about `continue`\
    \ and `break` keywords used to control the loops execution.\n\n## The for loop\
    \ statement\n\nThe for loop statement is used when you know how many times you\
    \ want to execute a statement or a block of statements.\n\n![for loop in Php](Images/image00549.jpeg)\n\
    \n### Syntax\n\n```php\nfor (initialization; condition; increment){\n   code to\
    \ be executed;\n}\n```\n\nThe `initializer` is used to set the start value for\
    \ the counter of the number of loop iterations. A variable may be declared here\
    \ for this purpose and it is traditional to name it `$i`.\n\n### Example\n\nThe\
    \ following example makes five iterations and changes the assigned value of two\
    \ variables on each pass of the loop —\n\n```html\n<html>\n  <body>\n      <?php\n\
    \        $a = 0;\n        $b = 0;\n        for( $i = 0; $i<5; $i++ ) {\n     \
    \       $a += 10;\n            $b += 5;\n        }\n        echo (\"At the end\
    \ of the loop a = $a and b = $b\" );\n      ?>\n  </body>\n</html>\n```\n\nThis\
    \ will produce the following result —\nAt the end of the loop a = 50 and b = 25\n\
    \n## The while loop statement\n\nThe while statement will execute a block of code\
    \ if and as long as a test expression is true. If the test expression is true\
    \ then the code block will be executed. After the code has executed the test expression\
    \ will again be evaluated and the loop will continue until the test expression\
    \ is found to be false.\n\n![for loop in PHP](Images/image00550.jpeg)\n\n### Syntax\n\
    \n```php\nwhile (condition) {\n   code to be executed;\n}\n```\n\n### Example\n\
    \nThis example decrements a variable value on each iteration of the loop and the\
    \ counter increments until it reaches 10 when the evaluation is false and the\
    \ loop ends.\n\n```html\n<html>\n  <body>\n      <?php\n        $i = 0;\n    \
    \    $num = 50;\n        while($i < 10) {\n            $num--;\n            $i++;\n\
    \        }\n        echo (\"Loop stopped at i = $i and num = $num\" );\n     \
    \ ?>\n  </body>\n</html>\n```\n\nThis will produce the following result —\nLoop\
    \ stopped at i = 10 and num = 40\n\n## The do...while loop statement\n\nThe do...while\
    \ statement will execute a block of code at least once - it will repeat the loop\
    \ as long as a condition is true.\n\n### Syntax\n\n```php\ndo {\n   code to be\
    \ executed;\n} while (condition);\n```\n\n### Example\n\nThe following example\
    \ will increment the value of `$i` at least once, and it will continue incrementing\
    \ the variable `$i` as long as it has a value less than 10 —\n\n```html\n<html>\n\
    \  <body>\n      <?php\n        $i = 0;\n        $num = 0;\n        do {\n   \
    \         $i++;\n        } while($i < 10 );\n        echo (\"Loop stopped at i\
    \ = $i\" );\n      ?>\n  </body>\n</html>\n```\n\nThis will produce the following\
    \ result —\nLoop stopped at i = 10\n\n## The foreach loop statement\n\nThe foreach\
    \ statement is used to loop through arrays. For each pass the value of the array\
    \ element is assigned to `$value` and the array pointer is moved by one and in\
    \ the next pass element will be processed.\n\n### Syntax\n\n```php\nforeach (array\
    \ as value) {\n   code to be executed;\n}\n```\n\n### Example\n\nTry out following\
    \ example to list the values of an array.\n\n```html\n<html>\n  <body>\n     \
    \ <?php\n        $array = array( 1, 2, 3, 4, 5);\n        foreach( $array as $value\
    \ ) {\n            echo \"Value is $value <br />\";\n        }\n      ?>\n  </body>\n\
    </html>\n```\n\nThis will produce the following result —\nValue is 1\nValue is\
    \ 2\nValue is 3\nValue is 4\nValue is 5\n\n## The break statement\n\nThe PHP `break`\
    \ keyword is used to terminate the execution of a loop prematurely. The `break`\
    \ statement is situated inside the statement block. It gives you full control\
    \ and whenever you want to exit from the loop you can come out. After coming out\
    \ of a loop immediate statement to the loop will be executed.\n\n![PHP Break Statement](Images/image00551.jpeg)\n\
    \n### Example\n\nIn the following example condition test becomes true when the\
    \ counter value reaches 3 and loop terminates.\n\n```html\n<html>\n  <body>\n\
    \      <?php\n        $i = 0;\n        while( $i < 10) {\n            $i++;\n\
    \            if( $i== 3 )break;\n        }\n        echo (\"Loop stopped at i\
    \ = $i\" );\n      ?>\n  </body>\n</html>\n```\n\nThis will produce the following\
    \ result —\nLoop stopped at i = 3\n\n## The continue statement\n\nThe PHP `continue`\
    \ keyword is used to halt the current iteration of a loop but it does not terminate\
    \ the loop. Just like `break` statement the `continue` statement is situated inside\
    \ the statement block containing the code that the loop executes, preceded by\
    \ a conditional. For the pass encountering `continue` statement, rest of loop\
    \ code is skipped and next pass starts.\n\n![Continue Statement](Images/image00552.jpeg)\n\
    \n### Example\n\nIn the following example prints the value of array but for which\
    \ condition becomes true it skips the code and next value is printed.\n\n```html\n\
    <html>\n  <body>\n      <?php\n        $array = array( 1, 2, 3, 4, 5);\n     \
    \   foreach( $array as $value ) {\n            if($value== 3 )continue;\n    \
    \        echo \"Value is $value <br />\";\n        }\n      ?>\n  </body>\n</html>\n\
    ```\n\nThis will produce the following result —\nValue is 1\nValue is 2\nValue\
    \ is 4\nValue is 5\n\n# PHP - Arrays\n\nAn array is a data structure that stores\
    \ one or more similar type of values in a single value. For example if you want\
    \ to store 100 numbers then instead of defining 100 variables its easy to define\
    \ an array of 100 length. There are three kind of arrays and each array value\
    \ is accessed using an ID which called index.\n\n- Numeric array — An array with\
    \ a numeric index. Values are stored and accessed in linear fashion.\n- Associative\
    \ array — An array with strings as index. This stores element association with\
    \ key values rather than in a strict linear index order.\n- Multidimensional array\
    \ — An array containing one or more arrays and values are accessed using multiple\
    \ indices\n\nNOTE — Built-in array functions is given in function reference.\n\
    \n## Numeric Array\n\nThese arrays can store numbers, strings and any object but\
    \ their index will be represented by numbers. By default index starts from zero.\n\
    \n### Example\n\nFollowing is the example how to create and access numeric arrays.\
    \ Here we have used `array()` function to create array. This function is explained\
    \ in function reference.\n\n```html\n<html>\n  <body>\n      <?php\n        /*\
    \ First method to create array. */\n        $numbers = array( 1, 2, 3, 4, 5);\n\
    \        foreach( $numbers as $value ) {\n            echo \"Value is $value <br\
    \ />\";\n        }\n        /* Second method to create array. */\n        $numbers[0]\
    \ = \"one\";\n        $numbers[1] = \"two\";\n        $numbers[2] = \"three\"\
    ;\n        $numbers[3] = \"four\";\n        $numbers[4] = \"five\";\n        foreach(\
    \ $numbers as $value ) {\n            echo \"Value is $value <br />\";\n     \
    \   }\n      ?>\n  </body>\n</html>\n```\n\nThis will produce the following result\
    \ —\nValue is 1\nValue is 2\nValue is 3\nValue is 4\nValue is 5\nValue is one\n\
    Value is two\nValue is three\nValue is four\nValue is five\n\n## Associative Arrays\n\
    \nThe associative arrays are very similar to numeric arrays in term of functionality\
    \ but they are different in terms of their index. Associative array will have\
    \ their index as string so that you can establish a strong association between\
    \ key and values.\n\nTo store the salaries of employees in an array, a numerically\
    \ indexed array would not be the best choice. Instead, we could use the employees\
    \ names as the keys in our associative array, and the value would be their respective\
    \ salary.\n"
  trans: "\n\n- `do...while` — 循环一次代码块，然后只要特殊条件为真，就会重复循环。\n- `foreach` — 遍历数组中的每个元素并执行代码块。\n\
    \n我们将讨论用于控制循环执行的 `continue` 和 `break` 关键字。\n\n## for 循环语句\n\n当你知道要执行语句或语句块的次数时，就会使用\
    \ `for` 循环语句。\n\n![Php 中的 for 循环](img/image00549.jpeg)\n\n### 语法\n\n```php\nfor\
    \ (initialization; condition; increment){\n   // 要执行的代码;\n}\n```\n\n`initializer`\
    \ 用于设置循环迭代次数计数器的起始值。为了此目的可以在这里声明一个变量，传统上将其命名为 `$i`。\n\n### 示例\n\n以下示例执行了五次迭代，并在循环的每次通过中更改两个变量的赋值值\
    \ —\n\n```html\n<html>\n  <body>\n      <?php\n        $a = 0;\n        $b = 0;\n\
    \        for( $i = 0; $i<5; $i++ ) {\n            $a += 10;\n            $b +=\
    \ 5;\n        }\n        echo (\"At the end of the loop a = $a and b = $b\" );\n\
    \      ?>\n  </body>\n</html>\n```\n\n这将产生以下结果 —\nAt the end of the loop a = 50\
    \ and b = 25\n\n## while 循环语句\n\n`while` 语句当测试表达式为真时且只要它为真，就会执行代码块。如果测试表达式为真，则将执行代码块。代码执行后，将再次评估测试表达式，循环将持续直到测试表达式为假。\n\
    \n![PHP 中的 for 循环](img/image00550.jpeg)\n\n### 语法\n\n```php\nwhile (condition)\
    \ {\n   // 要执行的代码;\n}\n```\n\n### 示例\n\n此示例在循环的每次迭代中变量值减 1，计数器不断增加，直到达到 10 时，评估结果为假，循环结束。\n\
    \n```html\n<html>\n  <body>\n      <?php\n        $i = 0;\n        $num = 50;\n\
    \        while($i < 10) {\n            $num--;\n            $i++;\n        }\n\
    \        echo (\"Loop stopped at i = $i and num = $num\" );\n      ?>\n  </body>\n\
    </html>\n```\n\n这将产生以下结果 —\nLoop stopped at i = 10 and num = 40\n\n## do...while\
    \ 循环语句\n\n`do...while` 语句至少执行一次代码块 — 只要条件为真，它就会重复循环。\n\n### 语法\n\n```php\ndo {\n\
    \   // 要执行的代码;\n} while (condition);\n```\n\n### 示例\n\n以下示例至少增加一次 `$i` 的值，只要 `$i`\
    \ 的值小于 10，它就会继续增加变量 `$i` —\n\n```html\n<html>\n  <body>\n      <?php\n       \
    \ $i = 0;\n        $num = 0;\n        do {\n            $i++;\n        } while($i\
    \ < 10 );\n        echo (\"Loop stopped at i = $i\" );\n      ?>\n  </body>\n\
    </html>\n```\n\n这将产生以下结果 —\nLoop stopped at i = 10\n\n## foreach 循环语句\n\n`foreach`\
    \ 语句用于遍历数组。在每次通过时，数组元素的值被赋值给 `$value`，数组指针移动一位，下一次通过将处理下一个元素。\n\n### 语法\n\n```php\n\
    foreach (array as value) {\n   // 要执行的代码;\n}\n```\n\n### 示例\n\n尝试以下示例来列出数组的值。\n\
    \n```html\n<html>\n  <body>\n      <?php\n        $array = array( 1, 2, 3, 4,\
    \ 5);\n        foreach( $array as $value ) {\n            echo \"Value is $value\
    \ <br />\";\n        }\n      ?>\n  </body>\n</html>\n```\n\n这将产生以下结果 —\nValue\
    \ is 1\nValue is 2\nValue is 3\nValue is 4\nValue is 5\n\n## break 语句\n\nPHP `break`\
    \ 关键字用于提前终止循环的执行。`break` 语句位于语句块内部。它让你拥有完全的控制权，每当你想退出循环时，都可以离开。退出循环后，将执行循环后的后续语句。\n\
    \n![PHP break 语句](img/image00551.jpeg)\n\n### 示例\n\n在以下示例中，当计数器值达到 3 时，条件测试变为真，循环终止。\n\
    \n```html\n<html>\n  <body>\n      <?php\n        $i = 0;\n        while( $i <\
    \ 10) {\n            $i++;\n            if( $i== 3 )break;\n        }\n      \
    \  echo (\"Loop stopped at i = $i\" );\n      ?>\n  </body>\n</html>\n```\n\n\
    这将产生以下结果 —\nLoop stopped at i = 3\n\n## continue 语句\n\nPHP `continue` 关键字用于停止循环的当前迭代，但它不会终止循环。与\
    \ `break` 语句一样，`continue` 语句位于包含循环代码的语句块内部。`continue` 语句跳过后续代码并开始下一次迭代。\n\n![Continue\
    \ 语句](img/image00552.jpeg)\n\n### 示例\n\n以下示例打印数组的值，但当条件为真时会跳过后续代码。\n\n```html\n\
    <html>\n  <body>\n      <?php\n        $array = array( 1, 2, 3, 4, 5);\n     \
    \   foreach( $array as $value ) {\n            if($value== 3 )continue;\n    \
    \        echo \"Value is $value <br />\";\n        }\n      ?>\n  </body>\n</html>\n\
    ```\n\n此将产生以下结果 —\nValue is 1\nValue is 2\nValue is 4\nValue is 5\n\n# PHP - 数组\n\
    \n数组是一种存储单个变量中多个相同类型值的数据结构。例如，如果你想存储 100 个数字，比定义 100 个变量要简单得多。\n\n- 数字数组 — 具有数字索引的数组。值以线性方式存储。\n\
    - 关联数组 — 以字符串作为索引的数组。存储键值关联，而不是严格的线性顺序。\n- 多维数组 — 包含多个数组的数组，可以使用多个索引访问。\n\n注意\
    \ — 内置数组函数请函数参考。\n\n## 数字数组\n\n这些数组可以存储数字、字符串和任何对象，但它们的索引由数字表示。默认情况下索引从 0 开始。\n\
    \n### 示例\n\n以下是如何创建和访问数字数组的示例。在这里我们 `array()` 函数来创建数组。该函数在函数参考中有解释。\n\n```html\n\
    <html>\n  <body>\n      <?php\n        /* 第一种创建数组的方法 */\n        $numbers = array(\
    \ 1, 2, 3, 4, 5);\n        foreach( $numbers as $value ) {\n            echo \"\
    Value is $value <br />\";\n        }\n        /* 第二种创建数组的方法 */\n        $numbers[0]\
    \ = \"one\";\n        $numbers[1] = \"two\";\n        $numbers[2] = \"three\"\
    ;\n        $numbers[3] = \"four\";\n        $numbers[4] = \"five\";\n        foreach(\
    \ $numbers as $value ) {\n            echo \"Value is $value <br />\";\n     \
    \   }\n      ?>\n  </body>\n</html>\n```\n\n这将产生以下结果 —\nValue is 1\nValue is 2\n\
    Value is 3\nValue is 4\nValue is 5\nValue is one\nValue is two\nValue is three\n\
    Value is four\nValue is five\n\n## 关联数组\n\n关联数组在功能上与数字数组非常相似，但在索引方面有所不同。关联数组将索引设为字符串，以便你可以在键和值之间建立强关联。\n\
    \n要在数组中存储员工的薪水，数字索引数组不是最佳选择。相反，我们可以使用员工名称作为关联数组的键，而值则是他们相应的薪水。\n\n"
