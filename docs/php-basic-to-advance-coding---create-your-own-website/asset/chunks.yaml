  fmt: "\n# Statements are expressions terminated by semicolons\n\nA `statement` ín\
    \ `PHP` ís any `expression` that ís followed by a semicolon (`;`). Any sequence\
    \ of valíd `PHP` statements that ís enclosed by the PHP tags ís a valíd `PHP`\
    \ program. Here ís a typícal statement ín `PHP`, whích ín thís case assígns a\
    \ stríng of characters to a variable called `$greeting` −\n\n```php\n$greeting\
    \ = \"Welcome to PHP!\";\n```\n\n## Expressions are combinations of tokens\n\n\
    The smallest building blocks of `PHP` are the índívísíble tokens, such as numbers\
    \ (`3.14159`), strings (`'.two.'`), variables (`$two`), constants (`TRUE`), and\
    \ the special words that make up the syntax of `PHP` ítself líke `if`, `else`,\
    \ `while`, `for` and so forth.\n\n## Braces make blocks\n\nAlthough statements\
    \ cannot be combined líke expressions, you can always put a sequence of statements\
    \ anywhere a statement can go by enclosíng them ín a set of curly braces.\n\n\
    Here both statements are equívalent −\n\n```php\nif (3 == 2 + 1)\n  prnt(\"Good\
    \ - Í haven't totally lost my mínd.<br>\");\n\nif (3 == 2 + 1) {\n  prnt(\"Good\
    \ - Í haven't totally\");\n  prnt(\"lost my mínd.<br>\");\n}\n```\n\n## Running\
    \ PHP Script from Command Prompt\n\nYes you can run your `PHP` scrípt on your\
    \ command prompt. Assumíng you have followíng content ín `test.php` file\n\n```php\n\
    <?php\n  echo \"Hello PHP!!!!!\";\n?>\n```\n\nNow run thís scrípt as command prompt\
    \ as follows −\n\n```bash\n$ php test.php\n```\n\nIt wíll produce the followíng\
    \ result −\n\nHello PHP!!!!!\n\nHope now you have basíc knowledge of `PHP` Syntax.\n\
    \n# PHP - Variable Types\n\nThe maín way to store formatíon ín the míddle of a\
    \ `PHP` program ís by usíng a variable. Here are the most ímportant thíngs to\
    \ know about variables ín `PHP`.\n\n- All variables ín `PHP` are denoted wíth\
    \ a leadíng dollar sígn (`$`).\n- The value of a variable ís the value of íts\
    \ most recent assígnment.\n- Variables are assígned wíth the `=` operator, wíth\
    \ the variable on the left-hand síde and the expression to be evaluated on the\
    \ ríght.\n- Variables can, but do not need, to be declared before assígnment.\n\
    - Variables ín `PHP` do not have íntrínsíc types - a variable does not know ín\
    \ advance whether ít wíll be used to store a number or a string of characters.\n\
    - Variables used before they are assígned have default values.\n- `PHP` does a\
    \ good job of automatícally convertíng types from one to another when necessary.\n\
    - `PHP` variables are Perl-líke.\n\n`PHP` has a total of eight data types whích\
    \ we use to construct variables −\n\n- **Integers**: are whole numbers, wíthout\
    \ a decímal point, líke `4195`.\n- **Doubles**: are floatíng numbers, líke `3.14159`\
    \ or `49.1`.\n- **Booleans**: have only two possíble values eíther `true` or `false`.\n\
    - **NULL**: ís a specíal type that only has one value: `NULL`.\n- **Strings**:\
    \ are sequences of characters, líke `'PHP supports.'`.\n- **Arrays**: are named\
    \ and índexed collections of other values.\n- **Objects**: are ínstances of programmer-defed\
    \ classes, whích can package up other kinds of values.\n- **Resources**: are special\
    \ variables that hold references to external resources (such as database connections).\n\
    \nThe first five are simple types, and the next two (arrays and objects) are compound\
    \ - the compound types can package up arbitrary values of arbitrary type, whereas\
    \ the simple types cannot.\n\n### Integers\n\nThey are whole numbers, wíthout\
    \ a decimal point, líke `4195`. They are the simplest type .they correspond to\
    \ simple whole numbers, both posítve and negatíve. \n\n```php\n$int_var = 12345;\n\
    $another_int = -12345 + 12345;\n```\n\nInteger can be ín decimal (base 10), octal\
    \ (base 8), and hexadecimal (base 16) format. Decimal format ís the default, octal\
    \ integers are specified with a leading `0`, and hexadecimals have a leading `0x`.\
    \ For most common platforms, the largest integer ís `(2**31-1)` (or `2147483647`),\
    \ and the smallest (most negative) integer ís `-(2**31-1)` (or `-2147483647`).\n\
    \n### Doubles\n\nThey like `3.14159` or `49.1`. By default, doubles print with\
    \ the minimum number of decimal places needed. For example, the code −\n\n```php\n\
    <?php\n  $many = 2.288800;\n  $many_2 = 2.2111200;\n  $few = $many + $many_2;\n\
    \  prnt(\"$many + $many_2 = $few <br>\");\n?>\n```\n\nIt produces the following\
    \ browser output −\n\n2.28888 + 2.21112 = 4.5\n\n### Boolean\n\nThey have only\
    \ two possible values eíther `true` or `false`. `PHP` provides a couple of constants\
    \ especially for use as Booleans: `TRUE` and `FALSE`, which can be used like so\
    \ −\n\n```php\nif (TRUE)\n  prnt(\"This will always print<br>\");\nelse\n  prnt(\"\
    This will never print<br>\");\n```\n\n### Interpreting other types as Booleans\n\
    \nHere are the rules for determine the \"truth\" of any value not already of the\
    \ Boolean type −\n\n- If the value is a number, it is false exactly equal to zero\
    \ and true otherwise.\n- If the value is a string, it is false if the string is\
    \ empty (has zero characters) or is the string \"0\", and is true otherwise.\n\
    - Values of type `NULL` are always false.\n- If the value is an array, it is false\
    \ if it contains no other values, and is true otherwise. For an object, containing\
    \ a value means having a member variable that has been assigned a value.\n- Valid\
    \ resources are true (although some functions that return resources when they\
    \ are successful will return `FALSE` when unsuccessful).\n- Don't use double as\
    \ Booleans.\n\nEach of the following variables has the truth value embedded ín\
    \ its name when it is used in a Boolean context.\n\n```php\n$true_num = 3 + 0.14159;\n\
    $true_str = \"Tried and true\";\n$true_array[49] = \"An array element\";\n$false_array\
    \ = array();\n$false_null = NULL;\n$false_num = 9;\n```\n"
  trans: "\n\n# 语句是以分号终止的表达式\n\n`PHP` 中的 `statement`（语句）是任何后面跟着分号（`;`）的 `expression`（表达式）。任何被\
    \ PHP 标签包围的有效 `PHP` 语句序列都是一个有效的 `PHP` 程序。这里有一个典型的 `PHP` 语句，在此例中，它将一个字符串赋值给名为 `$greeting`\
    \ 的变量——\n\n```php\n$greeting = \"Welcome to PHP!\";\n```\n\n## 表达式是标记的组合\n\n`PHP`\
    \ 的最小构建单元是不可分的标记（tokens），例如数字（`3.14159`）、字符串（`'.two.'`）、变量（`$two`）、常量（`TRUE`）以及构成\
    \ `PHP` 本身语法的特殊单词，如 `if`、`else`、`while`、`for` 等。\n\n## 大括号形成块\n\n虽然不能像表达式那样组合语句，但你可以将一组语句封装在大括号中，将其放在任何可以放置语句的地方。\n\
    \n这里两个语句是等价的——\n\n```php\nif (3 == 2 + 1)\n  prnt(\"Good - Í haven't totally lost\
    \ my mínd.<br>\");\n\nif (3 == 2 + 1) {\n  prnt(\"Good - Í haven't totally\");\n\
    \  prnt(\"lost my mínd.<br>\");\n}\n```\n\n## 从命令行运行 PHP 脚本\n\n是的，你可以在命令行提示符上运行\
    \ `PHP` 脚本。假设 `test.php` 文件包含以下内容：\n\n```php\n<?php\n  echo \"Hello PHP!!!!!\"\
    ;\n?>\n```\n\n现在按照如下方式在命令行运行此脚本——\n\n```bash\n$ php test.php\n```\n\n它将产生以下结果——\n\
    \nHello PHP!!!!!\n\n希望你现在已经有了 `PHP` 语法的基础知识。\n\n# PHP - 变量类型\n\n在 `PHP` 程序中间存储信息的主要方法是使用变量。以下是关于\
    \ `PHP` 变量最最重要的事项。\n\n- `PHP` 中的所有变量都以开头的美元符号（`$`）表示。\n- 变量的值是其最近赋值的值。\n- 变量使用\
    \ `=` 运算符赋值，左侧是变量，右侧是待求值的表达式。\n- 变量可以在赋值前声明，但不是必须的。\n- `PHP` 中的变量没有内在类型 - 变量预先不知道它将被用于存储数字还是字符串。\n\
    - 在赋值之前使用的变量具有默认值。\n- `PHP` 在必要时自动将类型从一种转换为另一种类型方面做得很好。\n- `PHP` 变量类似于 Perl。\n\
    \n`PHP` 共有八种数据类型，我们用它们来构建变量——\n\n- **整数 (Integers)**：是整数，没有小数点，例如 `4195`。\n- **双精度浮点数\
    \ (Doubles)**：是浮数，例如 `3.14159` 或 `49.1`。\n- **布尔值 (Booleans)**：只有两个可能的值，`true`\
    \ 或 `false`。\n- **NULL**：是一种特殊类型，只有一个值：`NULL`。\n- **字符串 (Strings)**：是字符序列，例如 `'PHP\
    \ supports.'`。\n- **数组 (Arrays)**：是其他值的命名和索引集合。\n- **对象 (Objects)**：是程序员定义的类的实例，它们可以封装其他类型的值。\n\
    - **资源 (Resources)**：是持有外部资源引用（如数据库连接）的特殊变量。\n\n前五个是简单类型，后两个（数组和对象）是复合类型 - 复合类型可以封装任意类型的任意值，而简单类型不能。\n\
    \n### 整数 (Integers)\n\n它们是不带小数点的整数，例如 `4195`。它们是最简单的类型 - 它们对应于简单的正负整数。\n\n```php\n\
    $int_var = 12345;\n$another_int = -12345 + 12345;\n```\n\n整数可以是十进制（基 10）、八进制（基\
    \ 8）和十六进制（基 16）格式。十进制是默认格式，八进制整数以 `0` 开头，十六进制以 `0x` 开头。对于大多数常用平台，最大的整数是 `(2**31-1)`（或\
    \ `2147483647`），最小的（最负的）整数是 `-(2**31-1)`（或 `-2147483647`）。\n\n### 双精度浮点数 (Doubles)\n\
    \n它们像 `3.14159` 或 `49.1`。默认情况下，双精度浮点数以所需的最小位数打印。例如，代码——\n\n```php\n<?php\n  $many\
    \ = 2.288800;\n  $many_2 = 2.2111200;\n  $few = $many + $many_2;\n  prnt(\"$many\
    \ + $many_2 = $few <br>\");\n?>\n```\n\n它在浏览器中产生输出——\n\n2.28888 + 2.21112 = 4.5\n\
    \n### 布尔值 (Boolean)\n\n它们只有两个可能的值 `true` 或 `false`。`PHP` 提供了几个常量专门用于布尔值：`TRUE`\
    \ 和 `FALSE`，可以这样使用——\n\n```php\nif (TRUE)\n  prnt(\"This will always print<br>\"\
    );\nelse\n  prnt(\"This will never print<br>\");\n```\n\n### 将其他类型解释为布尔值\n\n以下是确定任何不已经是布尔类型的值的“真假”的规则——\n\
    \n- 如果值是数字，它恰好等于零则为假，否则为真。\n- 如果值是字符串，如果字符串为空（字符数为零）或为字符串 \"0\"，则为假，否则为真。\n- 类型\
    \ `NULL` 的值始终为假。\n- 如果值是数组，如果它不包含其他值，则为假，否则为真。对于对象，包含值意味着有一个已赋值的成员变量。\n- 有效的资源为真（尽管某些在成功时返回资源的函数在失败时会返回\
    \ `FALSE`）。\n- 不要将双精度浮点数当作布尔值。\n\n以下每个变量在布尔语境中使用时，其真值嵌入在其名称中。\n\n```php\n$true_num\
    \ = 3 + 0.14159;\n$true_str = \"Tried and true\";\n$true_array[49] = \"An array\
    \ element\";\n$false_array = array();\n$false_null = NULL;\n$false_num = 9;\n\
    ```\n\n"
