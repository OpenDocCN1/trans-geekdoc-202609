  md: '![](img/97952697a39a4e1dbafa6b892d1afef5_2_0.png)


    Fig. 1. Example of the architecture of the neural network source inversion. Here
    with 5 input measurements sampled from the same simulation (orange) and one scalar
    wind input (orange), one hidden layer of 10 neurons activated with tanh function
    (blue) and 3 outputs $\tilde{\theta}_j$, $j \in \{1,2,3\}$ corresponding to rescaled
    source parameters such as its amplitude, position and dispersion.


    **Inputs:** Two tensors, $\mathbf{U}^m \in \mathbb{R}^{n_s \times N_s}$ and $\beta
    \in \mathbb{R}^{n_s}$ respectively representing $n_s$ examples of $N_s$ measurements
    and corresponding wind data are given to the Neural Network as inputs. The tensor
    $\mathbf{U}^m$ is built firstly by running $n_s$ model simulations with various
    wind speeds $c$ and source parameters $\theta$ using the physical model (1) on
    $N$ points. Then, simulation results are sampled using the measurement operator
    described in (4), (5) and (6).


    **Outputs:** $\Theta \in \mathbb{R}^{n_s \times 3}$ is a tensor containing $n_s$
    different vector of source parameters, where each line of $\Theta$ is of the form,
    $\Theta_k=[\theta_k(1),\theta_k(2),\theta_k(3)]$, $1 \leq k \leq n_s$. To avoid
    biases in the training process cause by the difference of magnitude of each source
    parameter, source parameters need to be scaled to the same order of magnitude.
    To perform this, we build a scaled tensor $\tilde{\Theta}$ were each parameter
    are scaled using the transformation,


    $$\tilde{\theta}(j)=\frac{\theta(j)-\min(\Theta(j))}{\max(\Theta(j))}, \qquad
    1\leq j\leq 3.$$ \tag{7}


    Thus the model returns an estimation of the adimensional parameters as an output.
    A rescaling is applied to the output estimate using $\min(\Theta(j))$ and $\max(\Theta(j))$
    obtained at the training process.


    **Training Data:** $n_{\mathrm{train}} \in \mathbb{N}$ of simulations of pollutant
    dispersion with various wind speeds $c$ and source parameters $\theta$ have to
    be performed to generate a training and a validation set. To cover all the realistic
    domain of possible training samples, wind speeds and training source parameters
    are generated by using a Sobol pseudo-random sequence with low discrepancy property.
    Low-discrepancy sequences are known to ensure “a good filling of the domain” in
    the sense of the best approximate computation of function integrals for a given
    number of samples (see Niederreiter (1988)).


    # 3.2 Variational approach


    The variational method rely on the minimization of the least-square error between
    output predictions based on a known model and measurement data. These kinds of
    methods are widely used and considered as a standard way to estimate parameters
    given some measurement especially with the use of an adjoint model (Georges (2019)
    ). Here, we propose to apply a variational method to a stationary problem where
    $u$ can be expressed as an explicit function of $\theta$ thanks to the finite-difference
    model, thus avoiding the explicit use of an adjoint model. The 3D-Var cost function,
    which consists in minimizing the output prediction error in the least-square sense,
    is chosen. A regularisation term (see Tikhonov (1977)) depending on an initial
    guess, is added such that the entire cost function is given by,


    $$\mathcal{J}(\theta)=\frac{1}{2}(\theta-\theta^b)^T\mathbf{B}^{-1}(\theta-\theta^b)+\frac{1}{2}(\mathcal{F}(\theta)-u^m)^T\mathbf{R}^{-1}(\mathcal{F}(\theta)-u^m),
    \tag{8}$$


    where $u^m$ denotes the vector of concentration measurements provided by the sensors
    and $\theta^b$ refers to an initial guess, with


    $$\mathcal{F}(\theta)=\mathcal{H}\circ\mathcal{M}(\theta). \tag{9}$$


    $\mathcal{F}$ denotes the forward operator which is a composition of the observation
    operator $\mathcal{H}$ with $\mathcal{M}$ given by (1), where $\mathcal{H}$, given
    by (5), maps the concentration returned by the model on the whole domain to the
    space of the measurements. Matrices $\mathbf{B}$ and $\mathbf{R}$ respectively
    denote the covariance matrices of the uncertain initial guess and measurement
    noise. We assume here that the noises are uncorrelated so that $\mathbf{B}$ and
    $\mathbf{R}$ are diagonal and with an equal variance. $\sigma^b$ and $\sigma$
    are the standard deviations associated with initial guess and observations.


    The data-assimilation problem


    $$\min_{\theta}\mathcal{J}(\theta) \tag{10}$$


    is infinite-dimensional. In this paper, the choice is made to solve a direct finite-dimensional
    version of this problem, based on the finite-dimensional approximation of model
    (1) given by (3), that is


    $$\min_{\theta}\mathcal{J}_a(\theta)=\frac{1}{2}(\theta-\theta^b)^T\mathbf{B}^{-1}(\theta-\theta^b)+\frac{1}{2}\left\|\mathbf{H}_a\mathbf{A}^{-1}(\mathbf{B}_1q(\theta)+\mathbf{B}_2\mathbf{C})-u^m\right\|_{\mathbf{R}^{-1}}^2.
    \tag{11}$$


    where $\mathbf{H}_a$ is the matrix obtained from the approximation of the $N_s$-sensor
    integral operator $\mathcal{H}$ given by (5), based on a trapezoidal method. The
    solution of this non-convex problem requires the computation of the gradient of
    $\mathcal{J}_a(\theta)$ w.r.t. $\theta$, that is


    $$\nabla\mathcal{J}_a(\theta)=\mathbf{B}^{-1}(\theta-\theta^b)+\left(\mathbf{H}_a\mathbf{A}^{-1}\mathbf{B}_1\frac{\partial
    q}{\partial\theta}(\theta)\right)^T\mathbf{R}^{-1}(\mathbf{H}_a u-u^m). \tag{12}$$


    with $u$ obtained with (3). Here, the solution of optimization problem (11) is
    carried out by using a quasi-Newton descent method based on the L-BFGS-B algorithm
    (see Byrd et al. (1995)) and gradient (12).'
