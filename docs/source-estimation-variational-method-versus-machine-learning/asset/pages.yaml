- pgno: 3
  md: '# 4. CASE STUDY : SOURCE IDENTIFICATION IN A STREET


    The here-proposed case study refers the detection of a polluting vehicle stopped
    somewhere on a boulevard with its motor turned on. It is assumed that stationary
    conditions of the pollution distribution are obtained under constant wind velocities.
    We could also consider a situation where another point-wise source such as a gas
    leak emit in a stationary regime.


    # 4.1 Parameters


    The training database is built by building the set of parameters,


    {p_k = [A_{s,k}, x_{s,k}, σ_{disp k}^2, c_k] ; 1 ≤ k ≤ n_train} , (13)


    with [A_s, x_s, σ_disp^2, c_k] ∈ [10^{-2},4] × [0.1,0.9] × [50,2000] × [-10^{-3},10^{-3}]
    generated by a Sobol sequence beginning from its 10001^{st} term, with units [g
    km^{-3} s^{-1}, km, km^{-2}, km s^{-1}] respectively. The validation set is created
    in the same manner with n_test samples, choosing [A_s, x_s, σ_disp^2, c] ∈ [5
    × 10^{-2},3] × [0.1,0.9] × [70,1500] × [-10^{-3},10^{-3}], the sequence starts
    at its 101^{st} term. Source position is purposely generated so that x_s ∈ [0.1
    km,0.9 km] to avoid to generate sources which would be located too close to the
    domain boundaries, that could lead to a non-physical solution of our dispersion
    model given by (1). Our database contains n_train = 15000 training samples, whilst
    validation is applied on n_test = 200 samples. As a metric of performance, the
    Relative Root-Square Error (RRSE) is chosen, defined by,


    RRSE = ||q̂ - q_T||_2 / ||q_T||_2 , (14)


    where (q_T, q̂) ∈ ℝ^{N_x}^2 are respectively the real source profile and its estimate.
    To facilitate the convergence of the variational method, the initial guess is
    given by


    θ_k^b = [0, arg max_x(u_k^m), 0] , 1 ≤ k ≤ n_test; (15)


    meaning that the initial guessed source position is located at the largest measured
    concentration. The initial guess is used both in the cost function and as initialization
    of the L-BFGS-B descent method.


    The best neural network architecture has been obtained after some trials. Hence
    the chosen NN contains 2 fully-connected hidden layers of 50 neurons each, with
    the tanh activation function. The optimization is carried out using the L-BFGS-B
    algorithm. L_2 regularization is set at a low value of 10^{-12}. The machine learning
    approach is built using keras and tensorflow libraries under Python.


    # 4.2 Comparison without noise


    Experiment with 12 sensors: Simulations are performed without noise to determine
    how NN performs compared to the 3D-Var. Several very aberrant estimates returned
    by the NN (certainly due to non physical conditions in the training process) and
    bad estimates from 3D-Var (due to non convergence of the BFGS algorithm) are excluded:
    16 out of 200, leading to the study of 184 estimates.


    ![](img/97952697a39a4e1dbafa6b892d1afef5_3_0.png)


    Fig. 2. Example of source reconstruction : left, with a neural network; right,
    with a variational method.


    Based on this experiment, the neural network is able to estimate a source with
    an RRSE in the same order of magnitude than with the standard 3D-Var, with RRSE
    mean and standard deviation of μ_RRSE^NN = 0.22 and σ_RRSE^NN = 0.12 and μ_RRSE^var
    = 0.31 and σ_RRSE^var = 0.21 for NN and 3D-Var respectively. Overall the Neural
    Network performs slightly better. This is probably due to the fact that the variational
    approach is a non convex optimization problem. Therefore, some local minima may
    lead to near optimal solutions with significant differences in the parameter values.


    The RRSE obtained with the machine learning and variational approaches follow
    a log-normal law confirmed by the use of a Kolmogorov-Smirnov test (p-value =
    0.39 > 0.05 and 0.44 > 0.05 respectively). The distributions of RRSE are shown
    in Fig. 3.


    The machine learning approach method is data-driven and thus does not contain
    any a priori information on the physical model whereas the variational approach
    relies on the knowledge of the physics and on a good guess as given by (15). We
    notice that the RRSE metric is sensitive to a slight error of estimated position.
    For example in the case of the 65^{th} sample of validation illustrated in Fig.
    2, the neural network estimates well the magnitude and the dispersion, but a slight
    error of position leads to an RRSE^NN = 0.16 for the neural network against RRSE^var
    = 0.04 for the variational approach respectively.


    Overall, without noise and using 12 sensors in total (10 regularly spaced in the
    domain and 2 that measure the boundary conditions), the machine learning approach
    performs slightly better than the variational approach with respect to the RRSE
    metric. The NN sometimes returns non-physical estimates such as negative sources
    or non-Gaussian sources. Fig. 4 shows that the performance of the two methods
    are similar.


    Experiment with 50 sensors: Simulations with 50 sensors are carried out to observe
    a sensitivity of the estimations towards measurement density. Several non-physical
    estimates returned by the neural network or by the variational approach are excluded
    of the network: 9 out of 200, leading to the study of 191 estimates. Both methods
    return similar results as previously, with mean and standard deviation of μ_RRSE^NN
    = 0.13 and σ_RRSE^NN = 0.08 compared to μ_RRSE^var = 0.24 and σ_RRSE^var = 0.15
    for NN and 3D-Var respectively.'
