    # 5. CONCLUSIONS


    With the use of a small number of noisy sensors, both methods perform similarly,
    although the NN approach often returns more accurate source estimates. The machine
    learning approach shows greater improvement in accuracy than the variational approach
    as the sensor density is increased. The relative lack of performance of the variational
    approach in some situations can be linked to the non-convexity of the associated
    optimization problem. We have shown that the machine learning approach is able
    to reconstruct sources even in the presence of noisy measurements. The sensor
    noise decreases severely the performance of source estimation for both methods.
    Overall, the performance of the Neural Network is as good or superior to the variational
    approach as demonstrated by table 1. These results reveal that machine learning
    approaches are promising for source detection in the context of urban air pollution.
    Future work will consider in priority 2D and 3D urban models to capture horizontal
    and vertical concentration profiles. Synthetic data generated by a realistic pollution
    3D-model (such as PMSS,Oldrini et al. (2011)) and their corresponding wind fields
    will be used as inputs. With the exception of wind field, inputs and outputs of
    the NN such as measurements and source parameters will remain few for increased
    physical domain dimensions. Model reduction techniques are promising to reduce
    the number of wind field inputs in this context (Ding and Yang (2021)) and will
    even permit to consider less restricted source parametrization. Convolutional
    Neural Network (CNN) are also known for their capacity to capture relevant data
    and thus to scale well with numerous inputs such as images (Ronneberger et al.
    (2015)). Thus, once trained, a neural network model should be accurate and simple
    enough for online monitoring of pollution sources in urban area. We could also
    imagine to use a neural network approach to provide a proper initial guess to
    a variational method such as 3D-Var or 4D-Var for greater accuracy at the end.
    Variational method can also be improved by the use of reduced order models: it
    would also be interesting to try to make the variational approach convex by considering
    different parametrizations of the source term.


