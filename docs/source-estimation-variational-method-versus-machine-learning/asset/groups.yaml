    ## 5. 结论


    在使用少量带噪声的传感器时，两种方法表现相近，尽管神经网络方法通常能返回更精确的源估算结果。随着传感器密度的增加，机器学习方法在精度上的提升比变分方法更为显著。变分方法在某些情况下表现相对较差，可归因于相关优化问题的非凸性。我们已经证明，即使存在带噪声的测量，机器学习方法也能重建源项。传感器噪声会严重降低两种方法的源估算性能。总体而言，如表1所示，神经网络的表现与变分方法相当，甚至优于变分方法。这些结果表明，机器学习方法在城市空气污染源探测方面前景广阔。未来的工作将优先考虑二维和三维城市模型，以获取水平和垂直浓度廓线。由真实污染三维模型（如
    PMSS，Oldrini 等人，2011）生成的合成数据及其对应的风场将作为输入。除风场外，神经网络的输入和输出（如测量值和源参数）将保持较少，以适应物理域维度的增加。在此背景下，模型降阶技术有望减少风场输入的数量（Ding
    和 Yang，2021），甚至允许考虑约束更少的源参数化方案。卷积神经网络（CNN）也以捕获相关数据的能力著称，因此能够很好地扩展到大量输入（如图像）（Ronneberger
    等人，2015）。因此，一旦训练完成，神经网络模型应当足够准确且简单，可用于城市区域污染源的在线监测。我们还可以设想利用神经网络方法为 3D-Var 或 4D-Var
    等变分方法提供合适的初始猜测，以最终获得更高的精度。变分方法也可以通过使用降阶模型来改进；尝试考虑不同的源项参数化以使变分方法凸化，也将是有意义的。


