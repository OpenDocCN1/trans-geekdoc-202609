    ## 4. 案例研究：街道中的污染源识别


    这里提出的案例研究涉及对一辆停在林荫大道某处且发动机处于启动状态的排放污染物车辆的检测。假设在恒定风速下可获得污染分布的稳态条件。我们还可以考虑另一种情况，即诸如燃气泄漏之类的点源以稳态模式排放。


    ### 4.1 参数


    训练数据库通过构建如下参数集建立，


    {p_k = [A_{s,k}, x_{s,k}, σ_{disp k}^2, c_k] ; 1 ≤ k ≤ n_train} , (13)


    其中 [A_s, x_s, σ_disp^2, c_k] ∈ [10^{-2},4] × [0.1,0.9] × [50,2000] × [-10^{-3},10^{-3}]
    由从第10001项开始的Sobol序列生成，其单位分别为 [g km^{-3} s^{-1}, km, km^{-2}, km s^{-1}]。验证集以相同方式创建，包含
    n_test 个样本，选择 [A_s, x_s, σ_disp^2, c] ∈ [5 × 10^{-2},3] × [0.1,0.9] × [70,1500]
    × [-10^{-3},10^{-3}]，序列从第101项开始。源位置特意生成在 x_s ∈ [0.1 km,0.9 km] 范围内，以避免生成过于靠近计算域边界的源，因为这可能导致由(1)给出的扩散模型产生非物理解。我们的数据库包含
    n_train = 15000 个训练样本，而验证在 n_test = 200 个样本上进行。选择相对均方根误差（RRSE）作为性能指标，其定义为，


    RRSE = ||q̂ - q_T||_2 / ||q_T||_2 , (14)


    其中 (q_T, q̂) ∈ ℝ^{N_x}^2 分别为真实源分布及其估计。为了促进变分方法的收敛，初始猜测由下式给出


    θ_k^b = [0, arg max_x(u_k^m), 0] , 1 ≤ k ≤ n_test; (15)


    即初始猜测的源位置位于最大测量浓度处。初始猜测既用于代价函数中，也用作L-BFGS-B下降方法的初始化值。


    经过多次试验获得了最佳的神经网络架构。因此，选定的神经网络包含2个全连接隐藏层，每层50个神经元，并使用tanh激活函数。优化使用L-BFGS-B算法进行。L_2正则化设置为较小的值10^{-12}。机器学习方法使用Python环境下的keras和tensorflow库构建。


    ### 4.2 无噪声情况下的比较


    12个传感器的实验：在无噪声条件下进行模拟，以确定神经网络（NN）相比3D-Var的表现。神经网络返回的若干异常估计（很可能是由于训练过程中的非物理条件）以及3D-Var产生的较差估计（由于BFGS算法不收敛）被排除在外：200个中排除16个，最终研究184个估计。


    ![](img/97952697a39a4e1dbafa6b892d1afef5_3_0.png)


    图2. 源重建示例：左为神经网络方法，右为变分方法。


    基于该实验，神经网络能够以与标准3D-Var相同数量级的RRSE来估计源，NN和3D-Var的RRSE均值与标准差分别为μ_RRSE^NN = 0.22和σ_RRSE^NN
    = 0.12，以及μ_RRSE^var = 0.31和σ_RRSE^var = 0.21。总体而言，神经网络的表现略优。这可能是因为变分方法是一个非凸优化问题。因此，某些局部最小值可能导致参数值差异显著但接近最优的解。


    机器学习和变分方法获得的RRSE遵循对数正态分布，这一点通过Kolmogorov-Smirnov检验得到证实（p值分别为0.39 > 0.05和0.44 >
    0.05）。RRSE的分布如图3所示。


    机器学习方法由数据驱动，因此不包含任何关于物理模型的先验信息，而变分方法依赖于对物理规律的认识以及由(15)给出的良好初始猜测。我们注意到RRSE指标对估计位置的微小误差很敏感。例如，在图2所示的第65个验证样本中，神经网络很好地估计了量级和扩散程度，但位置的微小误差导致神经网络的RRSE^NN
    = 0.16，而变分方法的RRSE^var = 0.04。


    总体而言，在无噪声且总共使用12个传感器（10个在计算域内规则分布，2个用于测量边界条件）的情况下，就RRSE指标而言，机器学习方法的表现略优于变分方法。神经网络有时会返回非物理估计，例如负源或非高斯源。图4显示这两种方法的性能相似。


    50个传感器的实验：使用50个传感器进行模拟，以观察估计结果对测量密度的敏感性。神经网络或变分方法返回的若干非物理估计被排除在研究之外：200个中排除9个，最终研究191个估计。两种方法返回与之前类似的结果，NN和3D-Var的均值与标准差分别为μ_RRSE^NN
    = 0.13和σ_RRSE^NN = 0.08，以及μ_RRSE^var = 0.24和σ_RRSE^var = 0.15。


    这意味着与使用12个传感器相比，NN的误差降低了约一半，而3D-Var的误差降低了约三分之一。神经网络的表现再次优于3D-Var。与12个传感器的情况一样，RRSE分布遵循对数正态分布，Kolmogorov-Smirnov检验结果为NN的p值
    = 0.19 > 0.05，3D-Var的p值 = 0.90 > 0.05。总体而言，使用50个无噪声传感器（48个在计算域内规则分布，2个测量边界条件）进行源重建，相比使用12个无噪声传感器的情况，性能提升了30%至50%。图4显示神经网络的表现明显优于3D-Var，其分布在RRSE轴上更窄且更接近0。另一方面，使用50个传感器而非12个时，两种方法均有所改进。


    ### 4.3 含噪声情况下的比较


    ![](img/97952697a39a4e1dbafa6b892d1afef5_4_0.png)


    图3. 无噪声条件下，使用12个传感器时3D-Var与NN估计的RRSE分布对比。


    ![](img/97952697a39a4e1dbafa6b892d1afef5_4_1.png)


    图4. 无噪声条件下，使用50个传感器时3D-Var与NN估计的RRSE分布对比。


    在本实验中，按照2.2节所述流程，对由N_s个传感器给出的浓度分布数据集中的每个样本s（1 ≤ s ≤ n_test或n_train）施加高斯噪声ε_s^obs。


    因此，一组测量的高斯噪声具有恒定方差，该方差取决于无噪声测量浓度分布的最大值。这一假设是相当保守的，因为浓度分布中较小的测量值比其最大值具有相对更大的噪声。此处神经网络使用含噪声的浓度数据集进行训练。


    ![](img/97952697a39a4e1dbafa6b892d1afef5_4_2.png)


    图5. 含噪声条件下，使用50个传感器时3D-Var与NN估计的RRSE分布对比。


    ![](img/97952697a39a4e1dbafa6b892d1afef5_4_3.png)


    图6. 含噪声条件下，使用12个传感器时3D-Var与NN估计的RRSE分布对比。


    3D-Var中使用的初始猜测误差从σ^b = 1 × 10^6调整为σ^b = 5 × 10^4，以帮助使问题更具凸性。


    12个传感器的实验：以与之前相同的方式在含噪声条件下进行模拟。神经网络或3D-Var返回的若干非物理估计被排除在结果之外：200个中排除9个，最终得到191个估计。在存在噪声的情况下，两种方法的性能相似，使用NN时的均值与标准差为μ_RRSE^NN
    = 0.48和σ_RRSE^NN = 0.26，使用3D-Var时的均值与标准差为μ_RRSE^var = 0.52和σ_RRSE^var = 0.23。图6显示两种方法的RRSE分布彼此接近。


    50个传感器的实验：使用50个传感器（48个规则分布，2个测量边界处的浓度值）时，结果相比使用12个传感器有所改进。由此得到使用NN时的均值与标准差指标为μ_RRSE^NN
    = 0.40和σ_RRSE^NN = 0.21，使用3D-Var时为μ_RRSE^var = 0.45和σ_RRSE^var = 0.22。因此，使用50个传感器而非12个时，μ_RRSE^NN和μ_RRSE^var分别下降了17%和13%。因此，神经网络的表现略优于变分方法。然而，从图5可以看出，两种方法的误差分布仍然相当接近。同样地，误差分布被证明遵循对数正态分布规律。这4种情况的结果如表1所示。


