    have similar performance in the presence of noise with mean and standard deviation
    of μ_RRSE^NN = 0.48 and σ_RRSE^NN = 0.26 using the NN and μ_RRSE^var = 0.52 and
    σ_RRSE^var = 0.23 using 3D-Var. Fig. 6 shows that the distribution of RRSE of
    both methods are close to each other.


    Experiment with 50 sensors: With 50 sensors, 48 regularly spaced and two measured
    concentration values at boundaries, the results improve compared to the use of
    12 sensors. This leads to mean and standard deviation metrics of μ_RRSE^NN = 0.40
    and σ^NN = 0.21 using NN and μ_RRSE^var = 0.45 and μ_RRSE^var = 0.22 using 3D-Var.
    Thus μ_RRSE^NN and μ_RRSE^var decreased by 17 and 13 % respectively with the use
    of 50 sensors instead of 12. Hence the Neural Network performs slightly better
    that the variational approach. However it can be seen in Fig. 5 that the distribution
    of errors are still fairly close between the two methods. Again, error distributions
    are proven to follow a log-normal law. The results of these 4 cases are illustrated
    in table 1.'
