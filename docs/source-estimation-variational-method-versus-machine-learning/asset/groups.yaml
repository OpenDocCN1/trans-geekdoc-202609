    ## 源估计：变分方法与机器学习在城市空气污染中的应用\*

    **R. Lopez-Ferber**\*, **S. Leirens**\*, **D. Georges**\*\*

    \* 格勒诺布尔阿勒斯大学，CEA，Leti，法国格勒诺布尔 F-38000

    \*\* 格勒诺布尔阿勒斯大学，CNRS，格勒诺布尔理工学院（工程学院与管理学院），GIPSA-lab，法国格勒诺布尔 F-38000

    \* 本文工作得到法国替代能源与原子能委员会资助


    **Abstract:** 源检测是一个日益受到关注的研究领域，原因是人们对人口密集地区空气质量的环境担忧。我们开发了一种基于多层感知器神经网络的数据驱动方法，并借鉴了以往关于道路交通估计的研究。然后我们将其与经典的变分方法（3D-Var）在污染浓度的一维和稳态模型上进行了比较。我们使用12个和50个传感器生成的带噪声和不带噪声的合成测量数据集测试了源重建。两种方法对测量噪声都表现出合理的鲁棒性，且神经网络相比经典的3D-Var方法表现略好。


    Copyright © 2022 The Authors. This is an open access article under the CC BY-NC-ND
    license (https://creativecommons.org/licenses/by-nc-nd/4.0/)


    **Keywords:** 源检测，源估计，空气污染，平流-扩散偏微分方程，神经网络，变分方法，3D-Var。


    ## 1. 引言


    如今公共政策越来越关注与环境风险评估和空气质量监测相关的话题，其中污染源的检测发挥着关键作用。源重建在民用和军用核领域已被广泛使用。例如，联合国于1996年通过的《全面禁止核试验条约》鼓励研究人员开发源检测方法，利用全球放射性核素传感器测量网络来监测该条约的遵守情况。在此背景下，Pudykiewicz（1998）应用伴随方法来获取放射性核素的源参数，如位置、时间和释放量。其他工作则处理了2011年福岛核电站事故期间的源释放率估计。Winiarek
    et al.（2014）使用合并的贝叶斯和变分估计方法来估计该源释放率，同时已知不确定性。


    另一方面，人们对城市地区污染源的估计越来越感兴趣（例如 Mons et al.（2017），Kumar et al.（2015））。在城市环境中连续点源污染的背景下，Kumar
    et al.（2015）使用伴随方法结合CFD（计算流体动力学）模型来获取稳态情况下的源释放率和源位置。集合方法也在文献中被引用。Mons et al.（2017）使用基于集合的变分方法（EnVar）与精确但计算成本非常高的CFD模型来估计稳态和城市环境中挥发性污染物水坑的直径和位置。


    据我们所知，机器学习迄今尚未广泛用于源检测。最近，一种机器学习方法已被应用于解决道路交通估计的反问题（Georges（2020））。该方法启发了本工作，其中使用具有少数隐藏层的
    feed-forward 神经网络（NN）。这种数据驱动方法避免了变分方法中使用的变分法计算，从而避免在优化框架中调用扩散模型。此外，一旦训练完成，NN 与变分方法相比计算成本不高，尤其是基于复杂CFD模型的变分方法。NN
    训练确实是在线下进行的，即在利用阶段之前。本文提出了一种在城市地区重建污染源的方法，适用于一维域和稳态条件，以首先考虑孤立街道中的污染物扩散。机器学习方法与通常被认为是估计精度参考的经典模型化变分方法（3D-Var）进行了比较。


    本文组织如下：第2节介绍污染物传输模型及其有限维近似。它还论证了模型中使用的风速和扩散系数的选择。第3节详细介绍了所提出的机器学习方法并简要介绍了变分方法。数值模拟结果在第4节给出，而结论性意见在第5节讨论。


    ## 2. 污染物传输建模


    在本文中，使用稳态物理模型来模拟污染物的浓度。在一维情况下，稳态源已排放足够长时间达到稳态，污染物浓度的动力学


    ## 3. 源估计方法


    ![](img/97952697a39a4e1dbafa6b892d1afef5_2_0.png)


    *图 1. 神经网络源反演架构示例。这里有 5 个来自同一模拟的输入测量值（橙色）和一个标量风输入（橙色），一个由 tanh 函数激活的 10 个神经元的隐藏层（蓝色）以及
    3 个输出 $\tilde{\theta}_j$，$j \in \{1,2,3\}$，对应于重新缩放的源参数，如其振幅、位置和扩散。*


    **Inputs:** 两个张量，$\mathbf{U}^m \in \mathbb{R}^{n_s \times N_s}$ 和 $\beta \in \mathbb{R}^{n_s}$
    分别表示 $n_s$ 个 $N_s$ 个测量的示例和相应的风数据，作为输入提供给神经网络。张量 $\mathbf{U}^m$ 首先通过使用物理模型（1）在
    $N$ 个点上运行 $n_s$ 次模型模拟，针对不同的风速 $c$ 和源参数 $\theta$ 来构建。然后，使用（4）、（5）和（6）中描述的测量算子对模拟结果进行采样。


    **Outputs:** $\Theta \in \mathbb{R}^{n_s \times 3}$ 是一个包含 $n_s$ 个不同源参数向量的张量，其中
    $\Theta$ 的每一行形式为 $\Theta_k=[\theta_k(1),\theta_k(2),\theta_k(3)]$，$1 \leq k \leq
    n_s$。为避免因各源参数量级差异导致训练过程中的偏差，源参数需要缩放到相同的量级。为此，我们构建一个缩放张量 $\tilde{\Theta}$，其中每个参数使用变换进行缩放，


    $$\tilde{\theta}(j)=\frac{\theta(j)-\min(\Theta(j))}{\max(\Theta(j))}, \qquad
    1\leq j\leq 3. \tag{7}$$


    因此模型返回无量纲参数的估计作为输出。使用训练过程中获得的 $\min(\Theta(j))$ 和 $\max(\Theta(j))$ 对输出估计进行重新缩放。


    **Training Data:** 需要进行 $n_{\mathrm{train}} \in \mathbb{N}$ 次污染物扩散模拟，使用不同的风速 $c$
    和源参数 $\theta$ 来生成训练集和验证集。为了覆盖所有可能的训练样本的现实域，风速和训练源参数是通过使用具有低差异特性的 Sobol 伪随机序列生成的。已知低差异序列可确保“域的良好填充”，即对于给定样本数以最佳近似计算函数积分的意义（参见
    Niederreiter（1988））。


    ### 3.2 变分方法


    变分方法依赖于基于已知模型输出预测与测量数据之间最小二乘误差的最小化。这类方法被广泛使用，被认为是给定某些测量估计参数的标准方法，尤其是在使用伴随模型的情况下（Georges（2019））。在此，我们提出将变分方法应用于稳态问题，其中
    $u$ 可以通过有限差分模型显式表示为 $\theta$ 的函数，从而避免显式使用伴随模型。选择 3D-Var 成本函数，该函数以最小二乘意义最小化输出预测误差。添加一个取决于初始猜测的正则化项（参见
    Tikhonov（1977）），使得整个成本函数由下式给出，


    $$\mathcal{J}(\theta)=\frac{1}{2}(\theta-\theta^b)^T\mathbf{B}^{-1}(\theta-\theta^b)+\frac{1}{2}(\mathcal{F}(\theta)-u^m)^T\mathbf{R}^{-1}(\mathcal{F}(\theta)-u^m),
    \tag{8}$$


    其中 $u^m$ 表示传感器提供的浓度测量向量，$\theta^b$ 指初始猜测，且


    $$\mathcal{F}(\theta)=\mathcal{H}\circ\mathcal{M}(\theta). \tag{9}$$


    $\mathcal{F}$ 表示前向算子，它是观测算子 $\mathcal{H}$ 与由（1）给出的 $\mathcal{M}$ 的组合，其中 $\mathcal{H}$
    由（5）给出，将模型在整个域上返回的浓度映射到测量空间。矩阵 $\mathbf{B}$ 和 $\mathbf{R}$ 分别表示不确定初始猜测和测量噪声的协方差矩阵。我们假设噪声是不相关的，因此
    $\mathbf{B}$ 和 $\mathbf{R}$ 是对角矩阵且方差相等。$\sigma^b$ 和 $\sigma$ 是与初始猜测和观测相关联的标准差。


    数据同化问题


    $$\min_{\theta}\mathcal{J}(\theta) \tag{10}$$


    是无限维的。在本文中，选择求解该问题的直接有限维版本，基于模型（1）由（3）给出的有限维近似，即


    $$\min_{\theta}\mathcal{J}_a(\theta)=\frac{1}{2}(\theta-\theta^b)^T\mathbf{B}^{-1}(\theta-\theta^b)+\frac{1}{2}\left\|\mathbf{H}_a\mathbf{A}^{-1}(\mathbf{B}_1q(\theta)+\mathbf{B}_2\mathbf{C})-u^m\right\|_{\mathbf{R}^{-1}}^2.
    \tag{11}$$


    其中 $\mathbf{H}_a$ 是基于梯形方法从（5）给出的 $N_s$ 传感器积分算子 $\mathcal{H}$ 的近似得到的矩阵。该非凸问题的求解需要计算
    $\mathcal{J}_a(\theta)$ 关于 $\theta$ 的梯度，即


    $$\nabla\mathcal{J}_a(\theta)=\mathbf{B}^{-1}(\theta-\theta^b)+\left(\mathbf{H}_a\mathbf{A}^{-1}\mathbf{B}_1\frac{\partial
    q}{\partial\theta}(\theta)\right)^T\mathbf{R}^{-1}(\mathbf{H}_a u-u^m). \tag{12}$$


    其中 $u$ 由（3）获得。在此，优化问题（11）的求解是通过使用基于 L-BFGS-B 算法的拟牛顿下降方法（参见 Byrd et al.（1995））和梯度（12）进行的。

