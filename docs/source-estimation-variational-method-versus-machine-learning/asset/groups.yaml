    # Source Estimation: Variational Method

    Versus Machine Learning Applied to Urban

    Air Pollution*


    **R. Lopez-Ferber***, **S. Leirens***, **D. Georges****


    * Univ. Grenoble Alpes, CEA, Leti, F-38000 Grenoble, France

    ** Univ. Grenoble Alpes, CNRS, Grenoble INP (Institute of Engineering and Management),
    GIPSA-lab, F-38000 Grenoble, France


    **Abstract:** Source detection is a research field of growing interest due to
    environmental concerns about air quality in populated areas. We developed a data-driven
    approach based on a multilayer perceptron neural network and inspired by previous
    works on road traffic estimation. We then compared it to a classical variational
    method (3D-Var) on a one-dimensional and stationary model of pollution concentration.
    We tested source reconstruction with datasets of synthetic measurements generated
    by 12 and 50 sensors with and without noise. Both methods appear to be reasonably
    robust to measurement noise and the neural network performs slightly better compared
    to the classical 3D-Var method.


    Copyright © 2022 The Authors. This is an open access article under the CC BY-NC-ND
    license (https://creativecommons.org/licenses/by-nc-nd/4.0/)


    *Keywords:* Source detection, source estimation, air pollution, advection-diffusion
    partial differential equations, neural network, variational methods, 3D-Var.


    # 1. INTRODUCTION


    Today public policies are more and more interested in topics related to environmental
    risk assessment and air quality monitoring, where the detection of pollutant sources
    plays a key role. Source reconstruction has been widely used in the domain of
    civilian and military nuclear. For example, the Comprehensive Test Ban Treaty
    adopted in 1996 by the United Nations has encouraged researchers to develop methods
    of source detection using a global network of radionuclides sensors measurements
    to monitor compliance with this treaty. In this context, Pudyakiewicz (1998) has
    applied adjoint method to retrieve source parameters such as location, time and
    amount of release of radionuclides. Other works dealt with source rate estimation
    of the damaged Fukushima power plant during its accident in 2011. Winiarkek et
    al. (2014) used a merged Bayesian and variational estimation method to estimate
    with known uncertainty this source rate. On the other hand, there is a growing
    interest for the estimation of pollution sources in urban areas (e.g. Mons et
    al. (2017), Kumar et al. (2015)). In the context of a continuous point-wise source
    of pollution in urban environment, Kumar et al. (2015) used an adjoint method
    combined with a CFD (Computational Fluid Dynamics) model to retrieve source rate
    and source position in a stationary context. Ensemble methods are also cited in
    the literature. Mons et al. (2017) used an ensemble-based variational approach
    (EnVar) with an accurate but very computationally-expensive CFD model to estimate
    the diameter and position of a puddle of a volatile pollutant in a stationary
    and urban context.


    To the best of our knowledge, machine learning has not been widely used for source
    detection so far. Recently,


    a machine learning approach has been applied to solve an inverse problem dealing
    with road traffic estimation (Georges (2020)). This approach has inspired the
    present work, where a feed forward Neural Network (NN) is used with a few hidden
    layers. This data-driven method avoids any use of calculus of variations such
    as in variational methods and so, avoids to call a dispersion model inside an
    optimisation framework. Moreover, NNs are not computationally expensive once the
    training is performed, compared to variational methods, especially those based
    on complex CFD models. NN training is needed performed off-line, i.e. before the
    exploitation phase. This paper proposes a method to reconstruct a source of pollution
    in urban area in the case of a one-dimensional domain and stationary conditions
    to consider firstly pollutant dispersion in isolated streets. The machine learning
    approach is compared with a classical model-based variational approach (3D-Var)
    which is usually considered as a reference in terms of estimation accuracy.


    The paper is now organized as follows: Section 2 presents the pollutant transport
    model and its finite-dimensional approximation. It also justifies the choices
    of wind velocity and diffusion coefficient used in the model. Section 3 details
    the proposed machine learning method and briefly presents the variational approach.
    Numerical simulation results are given in Section 4 whilst concluding remarks
    are discussed in Section 5.


