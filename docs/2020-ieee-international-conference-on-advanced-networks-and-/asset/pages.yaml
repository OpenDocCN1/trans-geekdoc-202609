    of the network. [2] presents a solution for the adequate use of blockchain in
    vehicles with the division of activities and services in a balance needed within
    the three layers of IoV. The blockchain is depicted in the network layer, security-related
    blockchain tasks are handled by the Edge layer, and the Cloud-layer has a backup
    of the blockchain storage. On the other hand, some articles bring unconventional
    approaches, like [3]. To solve problem of data consistency and integrity attacks
    in the VANET, the proposed network is driven by an acyclic graph, where each block
    has a single chain.


