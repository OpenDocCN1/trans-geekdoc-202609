    of surveyed architectures that integrate Blockchain and Vehicle Edge Computing
    for IoV environment. It was structured into five categories: Access layers; Layers
    of the IoV architecture; Networking technologies; Execution of blockchain tasks,
    including mining, pooling, consensus, and managing all algorithms and machine
    learning techniques.


