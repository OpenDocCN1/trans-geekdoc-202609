    # II. FOUNDATION


    # A. Blockchain


    As Jianbin said in [1] "Blockchain is a decentralized infrastructure and a distributed
    computing paradigm that uses encrypted blockchain blocks to store and validate
    data consensus algorithms to generate and update data and smart contracts to manage
    and automate". These blocks are made of transactions that are recorded and validated
    in a distributed network without the need for a central authority. This entity
    was proposed by Satoshi Nakamoto [2] to define what transactions are carried out
    by the bitcoin cryptocurrency.


    Blockchain management is achieved by several participants, unlike traditional
    centralized databases, which are generally managed by a single organization. Other
    than that, the transparency of blockchain is easy to track and verify data [1].


    Currently, there are three ways to implement blockchain on a network: public,
    private, or consortium. The most common used by cryptocurrencies is the public
    blockchain where anyone can participate in some activity of the management process.
    Private implementations is


    characterized by the centralized control of nodes and rules by a single organization.
    Finally, the consortium blockchain, where a group of companies, with the same
    objective, performs the control and management of the nodes and rules. This type
    of implementation is used in IoT environment since its characteristics are similar
    to the current state of vehicular networks as demonstrated in [1].


    We also need to know in mind two concepts: The consensus algorithm and the smart
    contract. The consensus algorithm ensures higher trust and security on the network.
    Furthermore, it verifies the authenticity of the transactions and validates the
    blocks. However, for this to happen, there must be a consensus. In other words,
    the consensus algorithm is the means to do agreements between nodes. Each user
    and each has a unique address. This smart contract automatically executes in the
    blockchain, as it cannot be altered and based on the rules predefined in a contract
    or consensus, based on these rules it performs transactions among vehicles without
    the need for an intermediary.


