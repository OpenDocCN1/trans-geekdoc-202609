    # ## INTRODUCTION


    **Abstract—** With the advent of Intelligent Transportation Systems (ITS), data
    from sensors embedded into vehicles or smart infrastructure are of utmost importance.
    This survey explores recent mechanisms for information exchange in vehicle-to-vehicle
    edge computing (IoV). To accomplish these requirements, edge computing has been
    recently adopted to support the Internet of Vehicles (IoV). This survey presents
    solutions for blockchain-based vehicular edge computing (IoV), provides a taxonomy
    of their features, advantages, and limitations to provide guidance for future
    research.


    ***Index Terms—* Internet of Vehicles (IoV), Fog, Edge and Cloud Computing.*


    Vehicular Ad Hoc Networks (VANETs) are a key technology to support road safety,
    comfort, and infotainment payments for passengers and citizens of cities. VANETs
    rely on following communication modes: Vehicle-to-Vehicle (V2V), Vehicle-to-Edge
    (V2E), and Vehicle-to-Infrastructure (V2I) to provide communication with any component
    of the Intelligent Transportation System (ITS) in cities, such as highways, stations,
    pedestrians, traffic lights, and other participating members in this ecosystem.
    VANETs use On-Board Units (OBU) located in roads, Road Side Units (RSU), and BS
    with various communication standards, such as 802.11p, DSRC/LTE, and 5G, which
    have more computational power than vehicular edge computing.


    The data can be processed and delivered by the base station or by cloud or vehicles.
    Figure 1 shows the various architectural, technological, and communication aspects
    that emerge from the IoV environment in the context of this article. We will show
    why VANETs need effective security and privacy mechanisms to minimize false and
    malicious exchanges of information between vehicles. Such incidents can cause
    different types of accidents that threaten the lives of drivers, passengers, and
    pedestrians [2]. Considering that even with the growth in the number of devices
    carrying transactions on VANETs, it is possible to reach security through the
    features (immutability, crypt-


    topography, registration, distribution, and joining validation of data and transactions)
    offered by the blockchain.


    Traditional access to the remote cloud may degrade VANET services due to latency.
    Nevertheless, with the use of Edge Vehicle Computing (Edge), processing and storage
    are now close to vehicles, that is, at the edge of the network. Recently, researchers
    proposed solutions for fog and edge computing and edge computing to the Internet
    of Vehicles (IoV) which are closer to the user, such as Software-Defined Networking
    (SDN) and Network Functions Virtualization (NFV), as well, artificial intelligence
    support for both automotive service orchestration and management of vehicular
    infrastructure.


    The proposed solutions have common features in vehicular architecture and also
    design characteristics that must be clarified to understand their advantages and
    disadvantages in the scenario of future developments. Each area, different edge
    computing techniques and applications, blockchain, and other security mechanisms
    for exchanging information and data, have been introduced to the academic community
    and nations in recent years. This study summarizes these different researches,
    relating the proposals, helping to understand each technology, and how they modes
    deal with the environment in each ecosystem [3]-[8].


    This article examines crucial solutions for edge computing and blockchain applied
    to IoV, provides a taxonomy, and comparative summary, its main proposals, technologies,
    architectures and a view of providing to to others. Section II shows the background
    and taxonomy of the proposed elements of study, the summary of the solutions,
    and the discussion of advantages and limitations of each approach. Section IV
    presents the conclusion of the article.


