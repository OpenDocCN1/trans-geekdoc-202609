    # 2020 IEEE 高级网络与电信系统国际会议 (ANTS)


    在信息交换中。因此，他们研究了区块链背景下的自动驾驶车辆社会网络（AVNs）。此外，它们的特点是采用了一种基于信誉的共识算法，即信誉证明（PoR）。


    为了缓解交通并降低延迟，[12] 提出了一种无主区块链来创建缓存方案。由于车辆具有高移动性，决定何时以及何处进行缓存是一项挑战。因此，他们试图探索深度学习用于识别任务的设计。在这种设计中，提出了一种新的区块检查者选择方法，即效用证明（UP）。


    研究 [13] 试图解决物联网（IoT）中资源竞争有限的问题，提出了一种中介机制来协助现场或边缘的决策过程。使用智能市场理论（SMT）方法，区块链的挖掘可以在网络中的任何地方发生，存储位于参与者节点中。


    综述论文大多采用学习算法作为决策策略，并使用启发式算法进行共识协议。值得注意的是，许多论文关注强化学习和深度学习。尽管这些方法被用于不同的原因，但在在物联网背景下工作时，大多数具有不同的技术方案。这将是对各种决策算法的比较研究，以分析哪种在联网汽车（IoV）背景下更合适。值得注意的是，每篇文章使用区块链都有不同的目的，例如卸载
    [13]、资源分配 [9] 以及其应用 [10]。


    应该只进行通信而不进行任何计算。通过将计算移动到边缘，消息之间的延迟更短，同时保持了比车辆 BOU 更好的处理能力。单层（雾网 Fog）和这种场景在所有处理场景的资源分配上都存在一个大问题。


    静态多层。在这种情况下，与区块链相关的任务也位于边缘/MEC 层 [2], [4]-[7], [11]。然而，在这种场景下，雾网层和云层可能会处理任务，其中某些任务可能是相互相关的。每个任务都被具体地分配，在这种场景下，存在
    MEC 层重叠的问题，但通过将资源发送到云层来解决。某些问题例如由于网络拥堵导致任务永远无法完成。通过从不将任务发送到云端，MEC 可能会像以前一样被接管。


    动态多层。这种场景处理混合物联网中的平衡 [13]。在前一种场景中，与区块链相关的任务可能在任何层被处理。然而，在这种情况下，每一层的资源和用户的上下文是动态协调的。但是，决策机制可能会导致不适当的层执行某项任务，它可能会导致之前场景中提到的某些任务


    ## A. 场景定义


    我们定义了四种场景来对所述网络的架构进行分类。设计这些场景时考虑了三个方面：


    - *网络层用于与区块链相关的任务：*

    在这种场景下，边缘的作用是什么？

    - 单层（雾网 Fog）。在这种场景下，与区块链相关的任务也是雾网层之一（在车辆的 BOU 中）[8]。边缘/MEC 层专门从车载自组织交通网络（VANETs）传输数据，并将数据发送到雾网和云。云层可能会为车辆提供一些服务，但那些服务与区块链无关。通过在最终层分发区块链，消息之间的延迟更短，与区块链相关的通信在
    V 中进行。

    - 单层（MEC）。在这种背景下，与区块链相关的任务位于边缘/MEC 层 [9], [10], [11]。这一层可以为用户提供必要的服务。云层在这种场景中没有发挥重要作用。至于雾网层，它


    ## B. IoV 中区块链解决方案的维度


    - 我们从以下方面进行分类：

    - 类型（公有、私有或联盟）——有趣的是，大多数引用的区块链优于其他类型。公有区块链的可扩展性较低，例如去中心化节点，每个节点都处理交易。有改进可扩展性的策略，因为其架构是基于
    [3] 设计的。私有区块链具有优势，因为它没有许多公共节点，权威机构决定哪些节点可以作为矿工，这些节点是必须执行所有交易的节点。但它是中心化的，因为单家公司管理整个区块链。联盟链通常是私有的，几家公司共享区块链的所有权。

    - * 区块层*，即挖掘和共识主要发生的地方。这一列对于读者了解在静态或动态分层架构中使用了哪些层非常重要。

    - 架构方法，使用之前定义的架构模型。将区块链更靠近用户减少并增加了服务质量，因为信息到达了用户 [3], [8]。但每辆车辆都装备良好，可以完成所有的存储和消费。人员决定将这些区块链任务委托给边缘或云层。然而，大多数乘客必须在边缘或创建混合雾-云架构之间做出选择。这是为了避免车辆在处理和一致性上的过载


    - * **共识** —— 在这里我们指定每项调查使用了哪种共识算法

    1) PoW — 工作证明，最为人知的共识算法之一。

    2) PoS — 权益证明，在某些区块链中很常见。

    3) PoU — 效用证明。

    4) PoS — 权益证明（重复项）。

    5) PBFT — 实用拜庭容错，消息密集型。


    ### 解决方案总结：区块链特征。


