    # 区块链与边缘计算在联网中的应用概述


    Anderson Queiroz, Eduardo Oliveira, Maria Barbosa and Kelvin Dias

    Centro de informática

    Universidade Federal de Pernambuco

    Recife, Brazil

    alq@cin.ufpe.br, ehammo@cin.ufpe.br, mskb@cin.ufpe.br, kld@cin.ufpe.br


    ## 引言


    **摘要—** 随着智能交通系统（ITS）的出现，嵌入车辆或智能基础设施的传感器数据至关重要。本综述探索了联网边缘计算（IoV）中信息交换的最新机制。为了实现这些需求，边缘计算近期被用于支持联网（IoV）。本综述介绍了基于区块链的车辆边缘计算（IoV）解决方案，并提供了其特征、优势和局限性的分类，为未来的研究提供指导。


    ***索引术—* 联网（IoV）、雾计算、边缘计算与云计算。*


    车载自组织网络（VANETs）是支持城市道路安全、舒适度以及乘客市民信息娱乐支付的关键技术。VANETs依赖于以下通信模式：车对车（V2V）、车对边缘（V2E）和车对基础设施（V2I），以与城市中智能交通系统（ITS）的任何组件提供通信，例如公路、车站、行人、交通灯以及该生态系统的其他参与成员。VANETs使用位于道路上的车载单元（OBU）、路侧单元（RSU）以及具有各种通信标准的基站（BS），如802.11p、DSRC/LTE和5G，它们的计算能力优于车辆边缘计算。


    数据可以由基站、云端或车辆进行处理和交付。图1显示了本文背景下IoV环境中呈现的各种架构、技术和通信方面。我们将说明为什么VANETs需要有效的安全和隐私机制，以尽可能减少车辆之间虚假和恶意的信息交换。此类事件可能导致不同类型的事故，威胁驾驶员、乘客和行人的生命
    [2]。考虑到尽管VANET上携带交易的设备数量在增加，但通过区块链提供的特性（不可篡改性、加密、注册、分布式以及数据和交易的加入验证）来实现安全性。


    访问远程云可能会由于延迟而降低VANET服务。然而，通过使用边缘车辆计算（Edge），处理和存储现在已接近车辆，即位于网络边缘。最近，研究人员提出了针对联网（IoV）的更接近用户的雾计算、边缘计算的解决方案，例如软件定义网络（SDN）和网络函数虚拟化（NFV），以及用于汽车服务编排和车辆基础设施管理的人工智能支持。


    提出的解决方案在车辆架构方面具有共同特征，并且具有必须阐明的设计特征，以理解它们在未来发展场景中的优缺点。近年来，不同的边缘计算技术和应用、区块链以及用于交换信息和数据的其他安全机制已引入学术界和各国。本研究总结了这些不同的研究，联系了相关建议，有助于理解每项技术以及它们模式如何处理每个生态系统中的环境
    [3]-[8]。


    本文研究了应用于IoV的边缘计算和区块链的关键解决方案，提供了分类和比较性总结、其主要提议、技术、架构以及为他人提供参考的观点。第二节展示了所研究元素的背景和分类、解决方案的总结，以及对每种方法的优势和局限性的讨论。第四节给出了文章结论。


    > *本文中的“雾”指的是节点，即，*


    图1. 一种基于区块链的车辆边缘计算通用框架


    ![](img/5172031a44df5202921ea0013d8c0b7f_1_0.png)


    ## II. 基础


    ### A. 区块链


    正如Jianbin在[1]中所说：“区块链是一种去中心化的基础设施和分布式计算范式，它使用加密的区块来存储和验证数据共识算法以生成和更新数据，并使用智能合约进行管理和自动化”。这些区块由交易组成，交易在分布式网络中记录和验证，不需要中央机构。该实体由Satoshi
    Nakamoto [2] 提出，用于定义比特币加密货币执行的交易。


    区块链管理由多个参与者实现，与通常由单一组织管理的传统中心化数据库不同。此外，区块链的透明性易于跟踪和验证数据 [1]。


    目前，在网络上实现区块链有三种方式：公链、私有链或联盟链。加密货币最常用的是公链，任何人都可以参与管理过程的某些活动。私有化实现的特点是由于单一组织对节点和规则进行中心化控制。最后是联盟链，由一组具有相同目标的公司对节点和规则进行控制和管理。这种实现方式用于IoT环境，因为其特性与当前车辆网络的状态相似，如[1]所示。


    我们还需要记住两个概念：共识算法和智能合约。共识算法确保网络上更高的信任和安全性。此外，它验证交易的真实性并验证区块。然而，要发生这种事情，必须存在共识。换句话说，共识算法是节点之间达成协议的手段。每个用户都有一个唯一的地址。这种智能合约在区块链中自动执行，因为它无法被更改，并且基于合约或共识中预定义的规则，根据这些规则在车辆之间执行交易，而不需要中介。


    > 比特币：一种点对点的ATM系统，Satoshi Nakamoto https://bitcoin.org/bitcoin.pdf


    > 什么是区块链，SAP https://www.sap.com/insights/what-is-blockchain.html


    图2. 用于IoV的区块链与边缘计算分类


    ![](img/5172031a44df5202921ea0013d8c0b7f_2_0.png)


    ### III. 应用于IoV的区块链分类


    所提出的系统如图2所示。该分类包含了调查架构的构建模块，这些架构集成了用于IoV环境的区块链和车辆边缘计算。它分为五类：接入层；IoV架构层；网络技术；区块链任务的执行（包括挖矿、池化、共识以及所有算法和机器学习技术的管理）。考虑到在IoV环境中加入区块链以提高网络安全性。[2]
    提出了一种在车辆中恰当使用区块链的解决方案，将活动和服务在IoV三层内所需的平衡中进行划分。区块链层被描绘在网络层，与安全相关的区块链任务由边缘层处理，而云层具有区块链存储的备份。另一方面，一些文章带来了非传统的方法，如[3]。为了解决VANET中的数据一致性和完整性攻击问题，所提出的网络由无环图驱动，其中每个块都有一条单链。


    研究建议 [7] 创建了一个认证机构方案，应用会话密钥来识别每辆车。他们将区块链用于V2V分组、共享和管理组内的所有现有车辆。


    部分论文利用了软件定义网络（SDN）或软件定义车辆（SDV）。[1] 将区块链和SDN技术结合作为改进运行5G和边缘计算的车辆网络操作和管理的方法。其主要责任在SDN和区块链之间共享。为了创建一个安全、可靠且连接的网络，[8]
    提出了一种使用SDVN的结构以及一种区块链范式，允许对交易进行认证以保证完全分布式网络中节点的匿名性。区块链使用基于集群的分布式矿工（D-MS），动态选择运行的矿工。


    考虑到电动汽车云和边缘（EVCE）范式 [4] 在分布式共识活动中使用较少区块链（这些活动基于系统内数据和能量的频率和贡献），[5] 联盟链，作者通过三重权重主观投票（TWSL）模型制定了一种共识机制，以确保车辆之间的共识和共享。


    作者在[9] 中使用基于优化的解决方案在虚拟边缘计算环境中扩展资源。所提出的服务器对于请求请求是最好的。为了请求，他们利用了区块链。


    论文 [6] 提出了一种多级缓存方案和一种使用区块链的可信访问认证方案。该认证方案是一种用于实现实时监控和促进车辆协作共享的机制。区块链是分布式的，作为联网和自动驾驶车辆（CAVs）的认证范式，[11]
    是为了去中心化机器学习学习，创建全局模型以相互共享数据，并同时确保网络中的隐私和安全。为了做到，他们使用了基于区块链的学习（BCL）技术。机器学习算法用于改进IoV网络各层执行的决策过程，而区块链用于保护用户免受安全和隐私威胁。


    研究工作 [11] 正在使用安全性和动态性


