    \n比以往任何时候都有更多人访问互联网。这促使许多组织开发基于 Web 的应用程序，用户可以在线使用这些应用程序与组织互动。编写糟糕的 Web 应用程序代码可能被利用以获得对敏感数据和\
    \ Web 服务器的未经授权的访问。在本教程中，你将学习如何黑客攻击网站，我们将向你介绍 Web 应用程序黑客技术以及你可以采取的保护措施以防范此类攻击。\n\
    \n### 什么是 Web 应用程序？什么是 Web 威胁？\n\nWeb 应用程序（又称网站）是基于客户端-服务器模型的应用程序。服务器提供数据库访问和业务逻辑。它托管在\
    \ Web 服务器上。客户端应用程序运行在客户端 Web 浏览器上。Web 应用程序通常用 `Java`、`C#`、`VB.Net`、`PHP`、`ColdFusion\
    \ Markup Language` 等语言编写。Web 应用程序中使用的数据库引擎包括 `MySQL`、`MS SQL Server`、`PostgreSQL`、`SQLite`\
    \ 等。大多数 Web 应用程序托管在可通过互联网访问的公共服务器上。这使得它们因易于访问而容易受到攻击。以下是常见的 Web 应用程序威胁。\n\n* \
    \  **SQL 注入** – 此威胁的目标可能是绕过登录算法、破坏数据等。\n*   **拒绝服务攻击** – 此威胁的目标可能是拒绝合法用户访问资源\n\
    *   **跨站脚本 XSS** – 此威胁的目标可能是在客户端浏览器上注入可执行代码。\n*   **Cookie/Session Poisoning（Cookie/会话投毒）**\
    \ – 此威胁的目标是攻击者修改 cookie/会话数据以获得未经授权的访问。\n*   **Form Tampering（表单篡改）** – 此威胁的目标是修改表单数据，如电子商务应用程序中的价格，以便攻击者以优惠价格获取商品。\n\
    *   **Code Injection（代码注入）** – 此威胁的目标是注入可在服务器上执行的代码，如 `PHP`、`Python` 等。该代码可以安装后门、泄露敏感信息等。\n\
    *   **Defacement（篡改/破坏）** – 此威胁的目标是修改网站上显示的页面，并将所有页面请求重定向到包含攻击者信息的单个页面。\n\n###\
    \ 如何保护你的网站免受黑客攻击？\n\n组织可以采取以下策略来保护自己免受 Web 服务器攻击。\n\n*   **SQL 注入** – 在将用户参数提交到数据库进行处理之前对其进行清理和验证，有助于降低通过\
    \ SQL 注入被攻击的几率。`MS SQL Server`、`MySQL` 等数据库引擎支持参数化查询和预处理语句。它们比传统的 `SQL` 语句安全得多。\n\
    *   **拒绝服务攻击** – 如果攻击是简单的 DoS，可以使用防火墙丢弃来自可疑 `IP` 地址的流量。网络的正确配置和入侵检测系统也有助于降低 DoS\
    \ 攻击成功的几率。\n*   **跨站脚本** – 验证和清理通过 URL 传递的头部、参数、表单参数和隐藏值，有助于减少 XSS 攻击。\n*   **Cookie/Session\
    \ Poisoning** – 可以通过加密 cookie 内容、在一段时间后使 cookie 超时、将 cookie 与创建它们时使用的客户端 `IP`\
    \ 地址关联来防止此情况。\n*   **Form tempering（表单篡改）** – 可以通过在处理前验证和核实用户输入来防止此情况。\n*   **Code\
    \ Injection（代码注入）** - 可以通过将所有参数视为数据而非可执行代码来防止此情况。清理和验证可用于实现此目的。\n*   **Defacement（篡改/破坏）**\
    \ – 良好的 Web 应用程序开发安全策略应确保封堵访问 Web 服务器的常用漏洞。这可以是操作系统的正确配置、Web 服务器软件以及开发 Web 应用程序时的最佳安全实践。\n\
