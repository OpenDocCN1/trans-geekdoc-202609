    \ `IP` 地址。在 IT 领域，特别是黑客攻击中，永远不要在不知道自己在做什么的情况下做任何事。确实，这个概念在这里很重要。很多人谈论“黑客攻击 IP\
    \ 地址”甚至不知道什么是 `IP` 地址。这可能导致被黑客攻击者产生不合理的恐惧，或黑客者产生夸大的荣耀。“黑客攻击 IP 地址”到底意味着什么？你能用它做什么？现在，我们将揭开\
    \ IP 地址黑客攻击的神秘面纱。\n\n### 步骤 7# – 使用 IPFinder\n\n现在你的 `IPFinder` 已准备就绪。我们如何使用它？非常简单，因为它会自动创建我们需要的\
    \ URL。你与受害者分享的 URL 将类似于这个。在这个 URL 中，每个部分都是可定制的。域名是你网站的名称，即你创建账户时选择的名称。你无法更改它。在我们的例子中，这是“coolimages”。图片名称是你上传的图片名称，所以在我们的例子中，这是“meme.jpg”\
    \ 用户 ID 是你应该仔细选择的东西。在这里你可以写任何你想要的字母和数字组合。现在我们将看到如何使用它\n\n#### 选择用户 ID\n\n`IPFinder`\
    \ 将为每个查看 log 文件夹中图片的受害者保存一个新的文本文件。该文件包含日期、时间和你指定的用户 ID。此字段的目的是让你区分用户。想一想，如果你想把链接给多个人怎么办？你怎么知道哪个\
    \ `IP` 对应哪个人？你无法知道。使用这种方法，你会发送链接 `/meme.jpg/john` 给 John，发送链接 `/meme.jpg/alice`\
    \ 给 Alice。他们将看到同一张图片，但你会分别记录他们的 `IP`。\n\n### 黑客攻击 IP 地址，获取结果\n\n浏览 log 文件夹。你将看到一些具有上述名称的文本文件。打开任意一个并阅读其内容（选择它并点击编辑）。在每个文件中，你将看到类似这样的内容。\n\
    \n### 你可以用黑客攻击的 IP 地址做什么？\n\n此时，你的 `IP` 查找器已就位。你分享了一些图片，从而获得了一些 `IP`。你可以真正黑客攻击\
    \ `IP` 地址，但你仍在想知道有人能用 `IP` 地址做什么。另一方面，你可能是那个认为自己被黑客攻击的人，想知道你是否真的处于危险中。不用再找了，这里我们将告诉你关于黑客攻击\
    \ `IP` 地址后会发生什么的终极真相。\n\n#### 黑客攻击 IP 地址以恐吓人们\n\n许多自称黑客的人黑客攻击 `IP` 地址只是为了恐吓人们。他们联系对方并告诉他们知道他们的\
    \ `IP` 地址，也许还有他们的浏览器。普通电脑用户会相信他们访问了他们的电脑，否则他们怎么知道他们用哪个浏览器？所以，人们感到害怕并开始相信黑客。我听说过“黑客”用这种方法勒索钱财的故事。他们基本上让受害者相信他们访问了他们的数据，并威胁分享一些私人照片之类的。事实是，他们甚至不知道那些照片是否真实存在。然而，他们用同样的措辞接近每个人。结果，他们会吓坏任何持有此类照片的人。当然，这种活动是非法的。\n\
    \n#### 地理定位你\n\n如果你获得某人的 `IP` 地址，你可以非常粗略地对其进行地理定位。在城市地区，位置将精确到几平方公里；在农村地区，精确到几十平方公里。这是一个经验法则，可能会有所不同，但你永远不会足够精确。只有你的服务提供商，从而警察，才能用你的家庭地址精确定位你。对于其他人，你只能靠知道城市或县来凑合。\n\
    \n#### 真正访问设备或个人数据\n\n如果有人知道你的 `IP` 地址，他可以扫描你。这意味着他可以尝试检测你正在运行的系统和你的漏洞。现在，由于你的公共\
    \ `IP` 地址在你的家庭路由器上，他们将对你的路由器执行此操作。他们将获得对你路由器的访问权限，并从那里采用相同的方法访问你的电脑。这个过程漫长而复杂，需要熟练的黑客。然而，它总是遵循相同的指导原则。\n\
    \n1.  寻找暴露的服务（用 `nmap`）并尝试用 `TCP` 签名检测硬件和软件版本\n2.  在暴露的服务上寻找常见漏洞，或针对该特定硬件/软件的漏洞\n\
    3.  尝试用暴力破解获得访问权限\n4.  尝试创建自定义漏洞利用\n\n当然，第四步非常难，许多黑客会直接放弃。那一步是为有技能和预算、想专门黑客攻击你的人准备的。\n\
    \n### 我如何保护自己？\n\n在许多连接中，重启路由器会更改你的公共 `IP` 地址。就是这样。如果黑客正在攻击你，他们将不得不再次找到你的 `IP`。此外，你可以通过使用\
    \ `VPN` 或像 `TOR` 这样的代理链来提高安全级别。在这种情况下，你基本上联系互联网上某个你信任（可能拥有）的服务器。然后，那台服务器代表你在网络上发起请求。如果有人追踪你的\
    \ `IP` 地址，他们将追踪那台服务器的 `IP` 地址。\n\n## 如何黑客攻击智能手机\n\nTrust Digital 的 Meir Machlin\
    \ 演示了如何使用 `SMS` 黑客攻击智能手机。Machlin 向我们演示了两种使用任何人都能获得的基本工具的黑客攻击。Machlin 的“黑客工具包”包括一台带有\
    \ `WiFi` 连接的笔记本电脑，和两部手机。一部手机作为笔记本电脑的 `GSM` 调制解调器，另一部是 Machlin 的个人手机，用于接收信息。第三部手机作为我们的目标设备，即演示中“受攻击”的手机。我们观看的第一种攻击被称为“午夜袭击”，因为它通常在夜间实施，当时手机用户正在睡觉，设备在充电时仍处于开机状态，或只是放在床头柜上。Machlin\
    \ 发送了一条简单的 `SMS`，在受攻击设备上调用了 Internet Explorer。首先，Machlin 发送了一张图片到目标手机，上面写着“You\
    \ have been hacked”（你已被黑客攻击），以展示用 `SMS` 进入另一个用户手机有多快和容易。在第二次推送中，Machlin 在受攻击手机上运行了一个可以检索数据的应用程序。`SMS`\
    \ 连同受攻击手机的 `INSI` 号码（手机的唯一 ID）回传到了 Machlin 的手机。然而，Machlin 指出该应用程序同样可以轻松窃取联系人列表，无论是个人还是公司的。他说在这种情况下也有可能向设备推送病毒，甚至发起拒绝服务攻击。\n\
    \n## 如何黑客攻击智能手机，第 2 部分\n\nTrust Digital 的 Meir Machlin 继续演示如何黑客攻击智能手机。在第二个演示中（你可以在“如何黑客攻击智能手机，第\
    \ 2 部分”中查看），Machlin 演示了一个控制消息攻击。在这种黑客攻击中，罪犯可以在用户毫不知情的情况下更改设备的控制设置。他向我们展示了他如何轻松取消勾选\
    \ `SSL`，使设备在没有加密的情况下变得脆弱。作为压轴，他推送了一个擦除命令，删除了设备上所有存储的信息。Machlin 说，该擦除命令也可以推送到被黑客攻击手机联系人列表中包含的所有设备。根据\
    \ Machlin 的说法，这些攻击证明短信不再安全。他说，这类黑客攻击是智能手机独有的，因为 PC 没有 `SMS` 功能。哪些智能手机容易受到这类攻击？这很大程度上取决于设备使用的安全设置和实践。一些人认为移动设备对组织几乎不构成安全威胁。事实上，在\
    \ 3 月举行的一场最近的黑客“竞赛”中，没有一款预定被攻击的智能手机被攻破。然而，Gartner 分析师 John Girard 的一份报告预测，随着无线设备在企业中变得更加普及，安全问题的可能性将增加。Machlin\
    \ 建议所有在组织控制下的智能手机都应受到严密监控、定期打补丁和更新，以避免用户自行其是。\n\n## 结论\n\n对于新手来说，很难找到从哪里可以获得实践经验。本文涵盖了所有基础和最常用的被黑客攻击设备以及执行攻击的方法或策略。这是一份免费学习初学者黑客技术的完整指南。本文为初学者阐明了以下术语，以便开始黑客之旅。\n\
    \n"
