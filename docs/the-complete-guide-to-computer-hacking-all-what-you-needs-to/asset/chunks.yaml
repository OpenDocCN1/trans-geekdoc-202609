    \ a Facebook Account through Desktop Phishing\n\nThere’s variety of other methods\
    \ as well but these are the most common with highest success ratio.\n\n### 4.\
    \ WEBSITE HACKING\n\nOnline information works on the websites also known as `www`\
    \ (world wide web). All the internet is a combination of different networks which\
    \ host websites. These websites share information with the world. There’s various\
    \ type of websites some are personal while other are for business. Every website\
