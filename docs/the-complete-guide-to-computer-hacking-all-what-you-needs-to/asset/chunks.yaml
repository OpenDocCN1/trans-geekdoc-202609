    \ 等。\n\n## 访问无线网络\n\n正如你所知，无线网络是一种不使用任何电线连接的网络。这些网络使用无线电波将计算机和其他设备连接在一起。要访问这些网络，你需要：\n\
    \n*   一台启用了无线网络的设备（笔记本电脑、智能手机等）\n*   设备和你都需要在无线网络接入点（WiFi 路由器）的传输半径范围内\n\n如果网络没有密码保护，除了点击它之外，你不需要做任何进一步的事情就能获得访问权限。它简直是在乞求被黑客攻击。但如果网络像大多数那样受密码保护，那么你需要它的密码才能获得访问权限。\n\
    \n### 无线网络认证 WEP 和 WPA\n\n各种无线网络设备使用许多认证技术。这些包括：`WEP`、`WPA`、`WPA2`、`WPA3`、`WPA2\
    \ + AES`、`WPA + AES`、`WPA + TKIP/AES`、`WPA + TKIP` 等。`WEP` 和 `WPA` 是无线网络中最常用的两种认证技术。在学习如何黑客攻击无线网络之前，了解这两种技术有助于建立坚实的基础。它还将帮助你收集关于接入点所需的信息。\n\
    \n#### WEP\n\n`WEP`（有线等效保密）是 IEEE 802 的一种安全算法。它的开发初衷是克服传统有线连接的数据机密性问题。它通过加密传输的数据来防止窃听，提供了更好的数据保护。`WEP`\
    \ 认证使用两种方法：\n\n*   **开放系统认证 (OSA)** – OSA 可帮助你访问任何 `WEP` 网络以及接收未加密的文件\n*   **共享密钥认证\
    \ (SKA)** – SKA 允许配备无线调制解调器的计算机完全访问任何 `WEP` 网络，并交换加密和未加密的数据。\n\n#### WPA\n\n在\
    \ `WEP` 中发现的弱点导致了 Wi-Fi Protected Access 的开发。`WPA` 成为具有无线互联网连接的计算设备的安全标准。`WPA`\
    \ 对 802.11 WLAN 上的数据进行加密。除此之外，`WPA` 使用 48 位初始值，而不是 `WEP` 使用的 24 位，这使其具有更高的初始值。然而，据报道\
    \ `WPA` 多次受到 `DDoS` 攻击的影响。\n\n### 一般攻击类型\n\n*   **中间人攻击：** 指拦截两个人之间的通信以窃取数据。\n\
    *   **拒绝服务 (`DDoS`)：** 要做到这一点，你必须用流量淹没网络。结果，它无法满足任何请求，导致系统不可用\n*   **嗅探：** 涉及拦截通过网络传输的数据包。\n\
    \n除了上述攻击外，还有各种类型的攻击可能危害计算机网络安全，这在两种类型的黑客攻击中都很有用。理解这些攻击不仅有助于你了解如何黑客攻击网络，还能学习网络安全。此外，它还将帮助你成为一名道德黑客。\n\
    \n### 用于黑客攻击无线网络的工具\n\n为了能够正确使用和理解这些工具，我们建议你建立坚实的道德黑客基础并学习一些编程语言。以下是一些用于破坏计算机网络安全的最流行工具列表：\n\
    \n*   `Aircrack`\n*   `AirSnort`\n*   `Kismet`\n*   `Cain & Abel`\n*   `WireShark`\n\
    *   `Fern WiFi Wireless Cracker`\n*   `CoWPatty`\n*   `Wifiphisher`\n*   `KisMac`\n\
    *   `Reaver`\n\n### 如何黑客攻击无线网络\n\n最后，让我们进入解码存储的无线网络密码的分步教程。\n\n1.  首先，从提供的链接下载\
    \ `Cain & Abel`\n2.  其次，确保你在想要黑客攻击的网络范围内并尝试连接。\n3.  打开 `Cain & Abel`\n4.  选择“Decoders（解码器）”选项卡\n\
    5.  从导航菜单选择“Wireless Passwords（无线密码）”\n6.  点击加号 (`+`) 按钮\n7.  解码器将显示曾用于访问网络的加密类型、`SSID`\
    \ 和密码。\n\n### 保护无线网络\n\n现在你知道了如何黑客攻击 WiFi 网络，是时候了解一些可以采取的步骤来防止别人黑客攻击你的 WiFi。毕竟，如果不懂得如何黑客攻击和如何防范黑客攻击，你就无法成为一名道德黑客。\n\
    \n*   更改硬件附带的默认密码\n*   启用认证机制\n*   仅允许注册的 `MAC` 地址可以限制对网络的访问。\n*   使用强 `WEP` 和\
    \ `WPA-PSK` 密钥以及包含符号、数字和字符组合的密码，可以降低密钥被字典和暴力破解攻击破解的几率\n*   防火墙软件有助于减少未经授权的访问。\n\
    \n## 如何黑客攻击 IP 地址（经过验证的方法及步骤）\n\n如何用经过验证的方法黑客攻击 `IP` 地址（创建记录网站）也许有人声称知道你的 `IP`\
    \ 地址而吓唬你。另一方面，你可能是想通过获取朋友的 `IP` 地址来吓唬他。或者，也许你只是想听听关于黑客攻击 `IP` 地址的真相。不用再找了，因为在本指南中我们将给你所有真相。我们将按照以下议程解释如何黑客攻击\
    \ `IP` 地址：\n\n*   简要介绍什么是 `IP` 地址\n*   如何黑客攻击 `IP` 地址\n*   黑客如何找出 `IP` 地址\n* \
    \  当黑客知道你的 `IP` 地址时能做什么\n\n读完本指南后，你将能够悄无声息地找出潜在任何人的 `IP` 地址。\n\n### 这合法吗？\n\n\
    在大多数情况下，是合法的。知道某人的 `IP` 地址是互联网上“正常”通信的一部分，所以这样做没有问题。然而，如果你使用 `IP` 地址侵犯他人的电脑，你在许多司法管辖区都在犯罪。我们不支持此类活动。你读到的一切都应该在你个人拥有和控制的系统上尝试。我们不对你的行为负责。此外，请记住这不是法律建议。我们是\
    \ IT 人员，不是律师。如果你在寻找法律建议，最好咨询你的律师。\n\n### 黑客攻击 IP 地址之前\n\n在开始黑客攻击之前，我们应该花几句话谈谈\
    \ `IP` 地址。在 IT 领域，特别是黑客攻击中，永远不要在不知道自己在做什么的情况下做任何事。确实，这个概念在这里很重要。很多人谈论“黑客攻击 IP\
    \ 地址”甚至不知道什么是 `IP` 地址。这可能导致被黑客攻击者产生不合理的恐惧，或黑客者产生夸大的荣耀。“黑客攻击 IP 地址”到底意味着什么？你能用它做什么？现在，我们将揭开\
    \ IP 地址黑客攻击的神秘面纱。\n\n### 什么是 IP 地址？\n\n`IP` 地址只不过是一个数字标识符。它标识网络（如互联网）中的 PC、智能手机或任何其他设备。你可以把它想象成普通邮件地址。如果我知道你的普通邮件地址，我就知道你在哪里，可以给你寄信。有了\
    \ `IP` 地址，我可以（大致）知道你的设备在哪里，并给你发送一些互联网流量。换句话说，你在互联网上由你的 `IP` 地址标识。通常，你的互联网提供商为你家里的路由器分配一个公共\
    \ `IP` 地址。当你家庭网络中的设备想要通过互联网发送流量时，它们将使用那个公共 `IP` 地址（在所有设备间共享）。互联网上的通信通过数据包进行。每一块数据被放入一个包中，你可以把它想象成一封信。在信封上，你总是写上源和目的\
    \ `IP` 地址。互联网会负责将数据包送达正确的目的地。现在，正如你所见，如果你发送流量出去，你会写上你的 `IP` 作为源 `IP`。这是对方知道它并发送一些流量回来的唯一途径。\n\
    \n### 我们真的需要使用真实的 IP 地址作为源吗？\n\n当然！想象一下你想下载一部电影、查看一个网页，或你在互联网上做的任何其他事情。你联系一个第三方服务器，它发送你请求的内容。它需要知道发送到哪里，所以它需要知道你的\
    \ `IP`。\n\n### 我有危险吗？\n\n这取决于情况，但在大多数情况下，你没有危险。从上面的段落可以看出，知道别人的 `IP` 是合法的。你需要它来发送回流量。如果你的\
    \ `IP` 地址落入坏人之手会怎样？仅仅知道你的 `IP` 地址，没有人能伤害你。然而，他们可以开始扫描你的电脑，看看你是否有可利用的漏洞来访问你的数据。我们稍后会谈到这一点。\n\
    \n### 如何找出某人的 IP 地址？\n\n在下一节中，我们将介绍一种开箱即用的技术。然而，它依赖于一个简单的原则：你的受害者需要给你发送一些流量。如果他这样做了，砰，你就有了他的\
    \ `IP` 地址。你的电脑已经学会了这样的 `IP` 地址，但它不显示给你。我们将看看如何查看它。\n\n### 黑客攻击 IP 地址的经过验证的方法\n\
    \n#### 一些误解和旧技术\n\n互联网上充斥着关于黑客攻击 `IP` 地址的低质量内容。你可能会读到关于用 Skype 黑客攻击 `IP` 地址的内容并为此兴奋，但自\
    \ 2017 年以来这已不再可能。因此，在本文中，我们将使用黑客攻击 `IP` 地址的最佳方法。我们将使用唯一一种仅取决于你、不依赖第三方服务的方法。因此，它将始终有效。此外，它易于应用和使用。\n\
    \n#### 我们技术背后的原理\n\n我们技术背后的想法很简单。你基本上给受害者一个链接：他们可以用手机、电脑或任何设备打开它。在该链接上，他们将看到你选择的图片（我们建议使用有趣的图片）。然而，你的系统也会自动追踪他们的\
    \ `IP` 地址和更多信息，如他们使用的浏览器和操作系统。当这发生时，他们将看到有趣的图片并为此大笑。他们无法知道你正在追踪他们的 `IP` 地址。\n\n\
    #### 步骤 #1 – 注册一个网站（免费！）\n\n你想给受害者一个有效的可点击链接，并且它必须在线有效。因此，我们需要注册一个网站。网上有很多免费服务可以注册网站，其中我们选择了\
    \ x10 hosting。去他们的网站注册一个新账户。首先，他们会要求你选择一个域名镜像。为你想要分享的图片类型选择一个可信的。继续注册并验证你的邮箱。一旦完成该过程，你将进入主页，在那里你必须创建一个网站。现在你会说“等等，我以为我们已经创建了那个！”……差不多。直到现在，我们创建了名称。现在，我们必须准备其背后运行的软件。\n\
    \n#### 步骤 #2 – 创建网站本身\n\n主页将如下所示。从那里，只需点击右上角的绿色 Add Website（添加网站）按钮。一个快速向导将打开。从那里，我们必须调整一些项目。首先，选择“Custom\
    \ Website（自定义网站）”。然后，作为网站名称，写一些能让人联想到该网站的东西，比如它的域名。作为最后一项，留空地址路径。然后，点击 Add Website。创建网站，然后在下一页选择“Continue\
    \ to my website（继续到我的网站）”。恭喜，我们快完成了！\n\n#### 步骤 #3 – 下载 IPFinder 脚本\n\n现在你的网站准备好了。我们所要做的就是上传脚本，负责保存\
    \ `IP` 地址并向用户提供图片。幸运的是，你不需要自己编写脚本：我们已经为你做好了。它使用一个 `PHP` 文件、三个 `HTAccess` 文件和两个文件夹。我们的\
    \ `IPFinder` 脚本以有用的 zip 包形式提供，你可以通过下面的链接免费下载。只需点击它并下载 zip 文件。现在你有了它，甚至不要解压。我们将直接在网站上解压：继续下一步。\n\
    \n#### 步骤 #4 – 上传 IPFinder 脚本\n\n从网站页面，选择 File Manager（文件管理器）选项。这将打开一个类似于 Windows\
    \ 资源管理器的新窗口。网站只是公共服务器上的一组文件。通过这个文件管理器，你可以查看这些文件。我们需要向它们添加我们的脚本。一旦进入文件管理器，选择 Upload（上传）(1)。这将打开一个新窗口，你可以在其中点击“Browse（浏览）”并搜索你下载的文件。选择那个压缩文件（`ipfinder.zip`）并等待上传完成。然后，关闭此窗口并在之前的窗口中点击\
    \ Reload（重新加载）(2)。现在你应该在列表中看到一个新文件，就在“cgi-bin”下面。这是我们包含 `IPFinder` 的压缩包，我们只需要解压它。\n\
    \n#### 步骤 #5 – 解压 IPFinder\n\n选择 `ipfinder.zip` 使其背景变蓝。然后，从顶部菜单选择 Extract（解压）。一个新窗口将弹出。只需点击\
    \ Extract File(s)（解压文件）而不更改任何内容。然后，等待过程完成，一完成就点击 Close（关闭）按钮。你的列表上将有一些更多的文件和文件夹。如果没有，就像之前那样点击\
    \ Reload 按钮。此时，我建议你删除 `ipfinder.zip` 文件。你不再需要它了，因为我们已经解压了它的内容。所以，只需点击它然后点击顶部的删除按钮。此步骤不是强制性的，但这是一个好习惯。\n\
    \n#### 步骤 #6 – 添加图片\n\n我们的 `IPFinder` 不带图片。然而，它是一个显示图片并记录查看者 `IP` 的脚本。因此，你需要添加自己的图片。所以，找一个你认为适合此目的的\
    \ `jpeg` 图片。目前，我们的脚本仅支持 `JPEG/JPG` 图片。一旦你有了那张图片，用一个不带空格的简单名称重命名它。然后，双击 images\
    \ 文件夹查看其内容。\n\n### 简要介绍什么是 IP 地址\n\n`ICTShore.com` 菜单 如何黑客攻击 `IP` 地址（经过验证的方法及步骤）\
