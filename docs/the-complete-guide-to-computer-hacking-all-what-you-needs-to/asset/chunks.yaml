    \ house. When your devices in your home network want to send traffic over the\
    \ Internet, they will use that public `IP` address (shared among all of them).\
    \ The communication over the Internet happens with packets. Each piece of data\
    \ is put in a packet, you can think of it as a letter. On the envelope, you always\
    \ write source and destination `IP` addresses. The Internet will take care of\
    \ delivering the packet to the right destination. Now, as you can see, if you\
    \ send traffic out you will write your `IP` as source `IP`. This is the only way\
    \ the other part can know it, and send some traffic back.\n\n### Do we really\
    \ need to use our real IP address as source?\n\nOf course! Imagine you want to\
    \ download a movie, see a web page, or anything else you do over the Internet.\
    \ You contact a third-party server, which sends you the content you requested.\
    \ It needs to know where to send it, so it needs to know your `IP`.\n\n### Am\
    \ I in danger?\n\nIt depends, but in most cases, you aren’t. As from the paragraph\
    \ above, knowing someone else’s `IP` is legitimate. You need it to send traffic\
    \ back. What if your `IP` address ends up in the wrong hands? Just by knowing\
    \ your `IP` address, nobody can harm you. However, they can start to scan your\
    \ PC and see if you have vulnerabilities they can use to gain access to your data.\
    \ We will get to that later.\n\n### How to find out someone’s IP address?\n\n\
    In the following section, we are going to cover an out-of-the-box technique. However,\
    \ it relies on a simple principle: your victim needs to send you some traffic.\
    \ If he does that, boom, you have his `IP` address. Your PC already learns such\
    \ an `IP` address, but it doesn’t show it to you. We will see how to see it.\n\
    \n### The Proven Way to Hack IP addresses\n\n#### Some misconceptions and old\
    \ techniques\n\nThe Internet is full of poor content about hacking `IP` addresses.\
    \ You might read about hacking `IP` addresses with Skype and get excited about\
    \ that, but since 2017 this is not possible anymore. So, for this article, we\
    \ are going to use the best way to hack an `IP` address. We are going to use the\
    \ only way that depends uniquely on you, not third-party services. Because of\
    \ that, it will always work. Furthermore, it is simple to apply and easy to use.\n\
    \n#### What’s behind our technique\n\nThe idea behind our technique is simple.\
    \ You basically give your victim a link: they can open it with their mobile, PC,\
    \ or any sort of device. On that link, they will see an image of your choice (we\
    \ recommend using a fun one). However, your system will also track automatically\
    \ their `IP` address and more information, like the browser they are using and\
    \ their operating system. While this happens, they will see the fun image and\
    \ have a laugh about it. They have no way of knowing that you are tracking their\
    \ `IP` address.\n\n#### Step #1 – Register a website (for free!)\n\nYou want to\
    \ give your victim a valid link to click, and it must be valid online. Therefore,\
    \ we need to register a website. There are a lot of free services online to register\
    \ a website, and among them, we have chosen x10 hosting. Go to their website and\
    \ register a new account. As a first thing, they will ask you to select a domain\
    \ image. Use a credible one for the kind of images you want to share. Continue\
    \ with the registration and verify your email. Once you complete the process,\
    \ you will end up on the homepage where you will have to create a website. Now\
    \ you are going to say “Wait, I thought we already created that!”… well, sort\
    \ of. Until now, we created the name. Now, we have to prepare the software running\
    \ behind it.\n\n#### Step #2 – Creating the website itself\n\nThe home will look\
    \ like the one below. From there, just click the green Add Website button on the\
    \ top right. A quick wizard will open. From there, we have to tune a few items.\
    \ Before everything else, select “Custom Website” website. Then, as a website\
    \ name, write something that reminds the website, like its domain name. As the\
    \ last thing, leave the address path empty. Then, click on Add Website. Create\
    \ the website, then select “Continue to my website” on the next page. Congratulation,\
    \ we are almost there!\n\n#### Step #3 – Download the IPFinder script\n\nNow your\
    \ website is ready. All we need to do is uploading the script that will take care\
    \ of saving `IP` addresses and delivering the images to the user. Fortunately,\
    \ you don’t need to write that script on your own: instead, we did it for you.\
    \ It uses a `PHP` file, three `HTAccess` files, and two folders. Our `IPFinder`\
    \ script comes in a useful zip package that you can download for free by using\
    \ the link below. Just click on it and download the zip file. Now that you have\
    \ it, don’t even unzip it. We will do that on the website directly: move on to\
    \ the next step.\n\n#### Step #4 – Upload the IPFinder Script\n\nFrom the website\
    \ pages, select the File Manager option. This will open a new window that looks\
    \ similar to Explorer in Windows. A website is just a collection of files on a\
    \ public server. With this File Manager, you can have a look at those files. To\
    \ them, we need to add our script. Once you are in the file manager, select Upload\
    \ (1). This will open a new window, where you can click “Browse” and search for\
    \ the file you downloaded. Select that compressed file (`ipfinder.zip`) and wait\
    \ for the upload to complete. Then, close this window and click Reload (2) in\
    \ the previous window. Now you should see a new file in the list, right below\
    \ “cgi-bin”. This is our zipped package containing `IPFinder`, and we just need\
    \ to extract it.\n\n#### Step #5 – Extract the IPFinder\n\nSelect the `ipfinder.zip`\
    \ so that its background turns blue. Then, from the top menu, select Extract.\
    \ A new window will pop-up. Just click on Extract File(s) without changing anything.\
    \ Then, wait for the process to finish, and, as soon as it does, click the Close\
    \ button. You will have some more files and folders on your list. In case you\
    \ don’t, just hit the Reload button as we did previously. At this point, I recommend\
    \ you to delete the `ipfinder.zip` file. You don’t need it anymore, as we have\
    \ extracted its content. So, just click it and then click the delete button at\
    \ the top. This step is not mandatory, but it is a good practice.\n\n#### Step\
    \ #6 – Adding images\n\nOur `IPFinder` comes without images. However, it is a\
    \ script that shows an image and logs the `IP` of the viewer. Therefore, you need\
    \ to add your own images. So, find a `jpeg` image that you think would work for\
    \ this purpose. At the moment, our script only supports `JPEG/JPG` images. Once\
    \ you have that image, rename it with a simple name without spaces. Then, double-click\
    \ on the images folder to view its content.\n\n### A quick introduction to what\
    \ IP addresses are\n\n`ICTShore.com` Menu How to hack `IP` addresses (proven way\
    \ with steps) Alessandro Maggio February 22, 2018 How to hack `IP` addresses with\
    \ a proven way (creating a logging website) Share This Post Share on linkedin\
    \ Share on facebook Share on twitter Share on email Maybe someone scared you claiming\
    \ to know your `IP` address. On the other hand, you could be the one trying to\
    \ scare a friend by getting his `IP` address. Or, maybe, you just want to hear\
    \ the truth about hacking `IP` address. Look no further, because in this guide\
    \ we will give you all the truth. We will explain you how to hack `IP` addresses\
    \ by following this agenda: A quick introduction to what `IP` addresses are How\
    \ to hack `IP` addresses How hackers find out an `IP` address What can a hacker\
    \ do when he knows your `IP` address After reading this guide, you will be able\
    \ to find out the `IP` address of potentially anyone, silently.\n\n### Is this\
    \ legal?\n\nUnder most circumstances, it is. Knowing someone’s `IP` address is\
    \ part of a “normal” communication over the Internet, so there is no problem in\
    \ doing that. However, if you use the `IP` address to violate someone else’s PC,\
    \ you are committing a crime under many jurisdictions. We do not endorse such\
    \ activity. Everything you read should be tried on systems you own and control\
    \ personally. We are not responsible for your actions. Furthermore, remember that\
    \ this is not legal advice. We are IT guys, not lawyers. If you are looking for\
    \ legal advice it’s better to call your attorney.\n\n### Before Hack IP addresses\n\
    \nBefore we start hacking, we should spend a few words on `IP` addresses. In IT,\
    \ and in hacking specifically, never do anything without knowing what you are\
    \ doing. Indeed, this concept is important here. A lot of people talk about “hack\
    \ IP addresses” without even knowing what an `IP` address is. This can lead to\
    \ unjustified fear among the ones being hacked or exaggerated glory among those\
    \ who hack. What “hack an IP address” really mean? What can you do with that?\
    \ Now, we are going to demystify IP address hacking.\n\n### Step 7# – Using IPFinder\n\
    \nNow your `IPFinder` is ready to go. How do we use it? It is very simple, as\
    \ it automatically creates the URL we need. Your URL to share with your victims\
    \ will be something like this one. In this URL, each part is customizable. The\
    \ domain name is the name of your website, the one you selected when you created\
    \ the account. You won’t be able to change this. In our case, this is “coolimages”.\
    \ The image name is the name of the picture you uploaded, so in our case, this\
    \ is “meme.jpg” The user ID is something you should select carefully. Here you\
    \ can write any combination of letters and numbers you want. Now we will see how\
    \ to use it\n\n#### Selecting the User ID\n\n`IPFinder` will save a new text file\
    \ for each victim that sees the image in the log folder. That file contains the\
    \ date, time, and the User ID you specify. The purpose of this field is to let\
    \ you differentiate between users. Think about it, what if you want to give the\
    \ link to multiple people? How can you know which `IP` corresponds to which person?\
    \ You cant. With this approach, you would send to John the link to `/meme.jpg/john`\
    \ and to Alice the link to `/meme.jpg/alice`. They will both see the same picture,\
    \ but you will log their `IP`s separately.\n\n### Hack IP addresses, getting the\
    \ results\n\nBrowse the log folder. You will see some text files with the names\
    \ explained above. Open any of them and read their content (select it and click\
    \ Edit). In each, you will see something like this.\n\n### What can you do with\
    \ hacked IP addresses?\n\nAt this point, you have your `IP` finder in place. You\
    \ shared some images, thus getting some `IP`. You can know truly hack `IP` addresses,\
    \ but you are still wondering what can someone do with `IP` addresses. On the\
    \ other hand, you might be the one who believes to be hacked, and you want to\
    \ know if you are in real danger. Look no further, here we will tell you the ultimate\
    \ truth about what happens after you hack `IP` addresses.\n\n#### Hack IP addresses\
    \ to scare people\n\nA lot of self-proclaimed hackers hack `IP` addresses just\
    \ to scare people. They contact the person and tell them they know their `IP`\
    \ address, and maybe their browser. A normal PC user will believe they have accessed\
    \ their PC, how would they know which browser they use otherwise? So, people get\
    \ scared and start believing in the hacker. I’ve heard stories about “hackers”\
    \ who managed to extort money from someone with this approach. They basically\
    \ make them believe they had access to their data and threatened to share some\
    \ personal pictures or something like that. The truth is, they didn’t even know\
    \ if those pictures really existed. However, they approached everyone with the\
    \ same words. As a result, they would scare the hell out of anyone holding such\
    \ kind of pictures. Of course, such activity is illegal.\n\n#### Geolocating you\n\
    \nIf you get someone’s `IP` address, you can geolocate it very approximately.\
    \ The location will be a few square kilometers accurate in urban areas, and a\
    \ few dozens square kilometers accurate in rural areas. This is a rule of thumb\
    \ and might vary, but you will be never accurate enough. Only your service provider,\
    \ and thus the police, can locate you precisely with your home address. For the\
    \ others, you need to get by with only knowing the city or county.\n\n#### Truly\
    \ gain access to the device or to personal data\n\nIf someone knows your `IP`\
    \ address, he can scan you. This means he can try to detect the system you are\
    \ running and your vulnerabilities. Now, since the public `IP` address of yours\
    \ is on your home router, they will do that for your router. They will gain access\
    \ to your router and, from that, they will adopt the same approach to gain access\
    \ to your PC. This process is long and complex and requires a skilled hacker.\
    \ However, it always follows the same guidelines.\n\n1.  Find exposed services\
    \ (with `nmap`) and try to detect the hardware and software version with the `TCP`\
    \ signature\n2.  Look for common exploits on the exposed services, or for that\
    \ specific hardware/software\n3.  Try to gain access with brute force\n4.  Try\
    \ to create a custom exploit\n\nOf course, the fourth step is so hard that many\
    \ hackers will simply give up. That step if for someone with skills and budget\
    \ that wants to hack specifically you.\n\n### How can I defend myself?\n\nIn many\
    \ connections, rebooting your router will change your public `IP` address. That’s\
    \ it. If a hacker was attacking you, they will have to find your `IP` again. Furthermore,\
    \ you can increase the level of security by using a `VPN` or a proxy chain like\
    \ `TOR`. In this case, you basically contact a server you trust (maybe own) somewhere\
    \ on the Internet. Then, that server makes requests on the web for you. In case\
    \ someone tracks your `IP` address, they will track the `IP` address of that server.\n\
    \n## How to Hack a Smartphone\n\nMeir Machlin of Trust Digital demonstrates how\
    \ to hack a smartphone using `SMS`. Machlin walked us through two hacks using\
    \ basic tools available to anyone. Machlin's 'hacker tool kit' included a laptop\
    \ with `WiFi` connectivity, and two phones. One phone acts as a `GSM` modem for\
    \ the laptop, the other phone is Machlin's personal phone, which he used to receive\
    \ information. A third phone served as our target device, the phone that was 'under\
    \ attack' in the demonstration. The first attack we watched is known as a 'Midnight\
    \ Raid,' because it is often pulled off during the night when the phone's user\
    \ is asleep and the device is still turned on as it is charged, or simply left\
    \ on the nightstand. Machlin sent a simple `SMS` which invoked Internet Explorer\
    \ on the attack device. First, Machlin sent a graphic to the target phone that\
    \ said \"You have been hacked\" to show just how quick and easy it is to get into\
    \ another user's phone with `SMS`. In the second push, Machlin ran an application\
    \ on the attacked phone that could retrieve data. The `SMS` came back to Machlin's\
    \ phone with the attack phone's `INSI` number; the phone's unique ID. However,\
    \ Machlin noted the application could have just as easily stolen a contact list,\
    \ either personal or corporate. He said it was also possible in this scenario\
    \ to push viruses to the device or even initiate a denial of service attack.\n\
    \n## How to Hack a Smartphone, Part 2\n\nMeir Machlin of Trust Digital continues\
    \ his demonstration of how to hack a smartphone. In the second demonstration (which\
    \ you can view in \"How to Hack a Smartphone, Part 2\"), Machlin ran through a\
    \ control message attack. In this kind of hack, a criminal can change the control\
    \ settings of a device without the user having any knowledge. He showed us how\
    \ he could easily uncheck `SSL`, leaving the device vulnerable with no encryption.\
    \ As a finale, he pushed a wipe command, which removed all stored information\
    \ from the device. The wipe, said Machlin, could also be pushed to all devices\
    \ contained in a hacked phone's contact list. The attacks, according to Machlin,\
    \ prove that texts can no longer be considered safe. And these kind’s of hacks\
    \ are unique to smartphones because PCs don't have `SMS` capabilities, he said.\
    \ Which smartphones are vulnerable to these kind’s of attacks? That varies widely\
    \ depending on the security settings and practices in place for use of the device.\
    \ Some contend that mobile devices still pose little security threat to an organization.\
    \ In fact, in a recent hacking \"contest\" that took place in March, none of the\
    \ smartphones slated for attack were compromised. However, a report from Gartner\
    \ analyst John Girard predicts as wireless devices become more pervasive in the\
    \ enterprise, the potential for security problems will increase. Machlin advised\
    \ all smartphones that are under an organization's control be tightly monitored,\
    \ patched and updated regularly to avoid users taking matters in their own hands.\n\
    \n## CONCLUSION\n\nFor the newbie, it’s quite hard to find out from where he can\
    \ get hands on practice. This article covers all the basic and most commonly used\
    \ hacked devices and methods or strategies to perform the attack. This is a complete\
    \ guide to learn how to hack for beginner’s free of cost. This article makes the\
    \ following terms clear for the beginners to get started on the hack track.\n"
  trans: "\n# 计算机黑客攻击指南\n\n## 简介\n\n黑客攻击通常指未经授权侵入网络或计算机，通常由一名或多名“黑客”实施。然而，黑客可以是任何人，他们的活动不一定是恶意的或未经授权的才算作黑客攻击。黑客攻击可以指利用技能以聪明的方式实现目标。他们可以是像你我这样的个人。他们可以单独行动，也可以受雇于组织，为好或为坏服务。通常，他们试图修改安全系统以实现其目标。\n\
    \n许多组织雇佣黑客作为其员工的一部分。这些黑客利用他们的技能来发现组织安全中的漏洞。这样做是为了发现并修复弱点，防止恶意黑客攻破安全系统。\n\n###\
    \ 黑客类型\n\n白帽、黑帽和灰帽指的是黑客与他们攻击的系统之间的关系。\n\n#### 黑帽黑客\n\n“黑帽”一词源于西部电影，其中坏人戴黑帽子，好人戴白帽子。黑帽黑客是指试图未经授权进入系统或网络，并出于恶意原因加以利用的个人。黑帽黑客没有任何许可或授权来攻击其目标。他们试图通过破坏安全系统、更改网站和网络的功能或关闭系统来造成损害。他们这样做通常是为了窃取或获取密码、财务信息和其他个人数据。\n\
    \n#### 白帽黑客\n\n另一方面，白帽黑客被视为好人，他们与组织合作以增强系统的安全性。白帽黑客有权在规定的交战规则内接触目标并对其进行攻击。白帽黑客通常被称为道德黑客。该人员专精于道德黑客工具、技术和方法论，以保护组织的信息系统。与黑帽黑客不同，道德黑客在合法获许的情况下利用安全网络并寻找后门。白帽黑客总会披露他们在公司安全系统中发现的每一个漏洞，以便在恶意行为者利用这些漏洞之前进行修复。Facebook、Microsoft\
    \ 和 Google 等财富 50 强公司也使用白帽黑客。\n\n#### “灰帽”黑客\n\n灰帽黑客以黑帽黑客的方式利用网络和计算机系统，但没有任何恶意意图，会向执法机构或情报机构披露所有漏洞和弱点。通常，灰帽黑客在网上冲浪并侵入计算机系统，以通知管理员或所有者其系统/网络包含一个或多个必须立即修复的漏洞。灰帽黑客也可能勒索被黑客攻击者，提出以微薄的费用修复缺陷。\n\
    \n## 最流行的黑客技术——社会工程学\n\n社会工程学是网络安全专业人员用来谈论我们所有人都容易遭受数据窃取的多种方式的通用术语。社会工程学通常是指利用人类乐于助人的本能来达到犯罪目的的过程。社会工程学问题已经演变多年，但今天它是网络攻击和网络恐怖主义的主要来源。通过技术缺陷安装的恶意软件仅占\
    \ 3% 的实例，而社会工程学攻击高达 97%。黑客攻击模式已从针对软件或硬件转变为更专注于人类漏洞。\n\n### 不同类型的社会工程学攻击\n\n####\
    \ 网络钓鱼\n\n91% 的数据泄露以网络钓鱼的形式出现，使其成为被利用最多的社会工程学形式。网络钓鱼是一种网络犯罪，通过向目标发送电子邮件，诱骗个人提供个人信息、银行和信用卡详情、电子邮件或社交媒体账户密码或其他机密信息。网络钓鱼骗局通常表现出以下特征：\n\
    \n*   试图获取个人信息、密码或其他银行相关详情。\n*   发送缩短的链接，重定向到可以追踪你详细信息的受感染网站。\n*   结合紧迫感、威胁或恐惧，操纵受害者在思考前做出反应。\n\
    \n这种社会工程学攻击的一个完美例子是 2018 年美国报税日后一个月发生的网络钓鱼骗局，当时犯罪分子发送误导性电子邮件索要纳税申报详情。这是为了获取账户访问权并利用信息提交欺诈性纳税申报。\n\
    \n#### 冒充\n\n网络犯罪分子经常寻找攻破系统的最薄弱环节，而最薄弱的环节往往是人类。冒充需要付出大量努力来了解目标并规划攻击，因此这是最不常见的社会工程学形式。冒充者为实施攻击可能承担的一些常见角色包括\
    \ IT 高管、经理、审计师或同事。通常，冒充攻击针对具有权威的角色，因为当人们收到来自权威人士的要求共享信息的请求时，他们会立即行动，而不验证发件人的真实身份。尽管与其他形式的社会工程学攻击相比，冒充攻击并不常见，但\
    \ 2017 年此类攻击激增了近 400%。\n\n#### 语音钓鱼\n\n语音钓鱼，或称 vishing，作为一种社会工程学形式正在快速增长。语音钓鱼攻击是指攻击者致电目标组织，试图通过电话获取信息和凭证。另一种语音钓鱼骗局是攻击者试图让电话另一端的人在其电脑上执行某些操作。这些操作包括运行桌面脚本和查看受感染的网站。这些攻击难以监控和追踪，不幸的是，在人力资源部门、客户服务、销售和市场营销等部门工作的员工极易受到这些攻击。从\
    \ 2012 年到 2016 年，一群网络犯罪分子实施了大规模的 IRS 语音钓鱼骗局。在这四年里，美国有 15,000 多名受害者因这一复杂的骗局损失了“数亿美元”，且\
    \ 50,000 多人的个人信息遭到泄露。\n\n#### 短信钓鱼\n\n短信钓鱼是“SMS phishing”（短信网络钓鱼）的混成词，类似于网络钓鱼，但通过短信实施。短信钓鱼犯罪分子通常向通过各种黑帽技术（如网络爬虫、数据泄露或随机号码生成器）获取的联系号码发送信息。骗子发送的信息使用不同技术诱导你分享他们想要的信息。他们可能承诺提供理想产品的优惠券或折扣，或者冒充你的银行以验证你的账户详情。你也可能收到来自“5000”等可疑号码或其他与电子邮件转短信服务相关的号码发来的短信，这些可能是自动化的。据\
    \ NBC Nightly News 报道，一起短信钓鱼骗局试图诱骗受害者通过电话输入私人信息来激活新信用卡。在另一起短信钓鱼骗局中，用户被告知其在线账户即将过期，需要通过在假网站上输入密码来续订账户。\n\
