  \ `PHPSESSID` 值冒充了一个登录会话。\n\n## 如何在不到 10 分钟内黑客攻击任何 Instagram 账户\n\n一位安全研究人员在发现一个严重漏洞后获得了\
  \ 30,000 美元奖励，该漏洞可能使任何 Instagram 账户面临被黑客攻击的风险。在 Facebook 和 Instagram 近期增加针对关键账户接管漏洞发现的奖励后，印度安全研究人员\
  \ Laxman Muthiyah 选择仔细研究这项照片分享服务。正如他在博客文章中所述，Muthiyah 探索了 Instagram 在处理忘记登录凭据的用户密码重置请求时是否存在漏洞。Muthiyah\
  \ 发现，当用户通过 Instagram 的 Web 界面请求密码重置时，网站会向用户的电子邮件账户发送重置链接。\n\n一位安全研究人员在发现一个严重漏洞后获得了\
  \ 30,000 美元奖励，该漏洞可能使任何 Instagram 账户面临被黑客攻击的风险。在 Facebook 和 Instagram 近期增加针对关键账户接管漏洞发现的奖励后，印度安全研究人员\
  \ Laxman Muthiyah 选择仔细研究这项照片分享服务。正如他在博客文章中所述，Muthiyah 探索了 Instagram 在处理忘记登录凭据的用户密码重置请求时是否存在漏洞。Muthiyah\
  \ 发现，当用户通过 Instagram 的 Web 界面请求密码重置时，网站会向用户的电子邮件账户发送重置链接。\n\n经过几分钟的测试，Muthiyah 找不到任何漏洞，于是将注意力转向智能手机用户如何恢复对其\
  \ Instagram 账户的访问。Muthiyah 发现，Instagram 为被锁定在账户外的用户提供了一种选择，请求将一个六位数的秘密安全码发送到他们的手机号码或电子邮件账户。如果输入该密码，用户可以重新获得对其\
  \ Instagram 账户的访问权限。理论上，如果黑客能够输入该六位数安全码，他们就能闯入 Instagram 账户（并重置密码将合法所有者锁在外面。）现在，如果黑客设法获得了目标的电子邮件账户访问权限，或通过\
  \ SIM 卡交换诈骗劫持了受害者的手机号码控制权，该密码可能会被窃取。但 Muthiyah 想知道，如果这两种选择都不可用，是否还有其他方式闯入账户。\n\n\
  Muthiyah 意识到，黑客只需在 Instagram 接受该代码过期前的十分钟窗口期内，输入正确的六位数代码——该代码可能是 000000 到 999999\
  \ 之间的任何组合。在十分钟内输入多达一百万个数字，以更改 Instagram 账户的密码。当然，Facebook 和 Instagram 不会坐视自动化脚本尝试暴力破解攻击以猜测正确的安全码。相反，它们设有速率限制，以检测何时多次尝试通过安全检查并减缓后续尝试——这意味着十分钟的机会窗口会过期。在\
  \ Muthiyah 的测试中，他发现当他循环尝试 1000 次猜测 Instagram 账户的安全码时，250 个通过了，随后的 750 个请求被速率限制。然而，经过几天的测试，研究人员发现\
  \ Instagram 的速率限制机制可以通过轮换 `IP` 地址（换句话说，不使用同一台计算机暴力破解恢复码）并从不同的 `IP` 地址并发发送请求来绕过。使用多个\
  \ `IP` 发送并发请求允许我发送大量请求而不受限制。我们可以发送的请求数量取决于 `req` 的并发性和我们使用的 `IP` 数量。此外，我意识到代码在 10\
  \ 分钟内过期，这使得攻击更难，因此我们需要数千个 `IP` 来执行攻击。” Muthiyah 表示，他使用了 1000 台不同的机器和 `IP` 来实现轻松的并发性，并在测试中发送了\
  \ 200,000 个请求。他与 Facebook 和 Instagram 的安全团队分享了一个 YouTube 视频，演示了攻击的实际操作：当然，200,000\
  \ 个请求还不足以保证输入正确的恢复密码以允许 Instagram 账户被劫持，这需要一百万个请求。Muthiyah 的调查结论是，在真实攻击中，需要 5000\
  \ 个 `IP` 地址来黑客攻击一个 Instagram 账户。虽然这听起来数量很大，但实际上可以以低廉的价格轻松实现（Muthiyah 表示，如果使用 Google\
  \ 或 Amazon 等云服务提供商，成本约为 150 美元）。所有 Instagram 用户都应该感激 Laxman Muthiyah 选择负责任地向 Instagram\
  \ 安全团队披露安全漏洞，而不是通过将其出售给网络犯罪分子来获利。很容易想象，这种技术对许多有兴趣攻破 Instagram 账户的黑客极具吸引力，他们可能愿意支付比\
  \ Muthiyah 以漏洞赏金形式获得的 30,000 美元多得多的费用。提醒所有互联网用户使用强大、唯一的密码更好地保护他们的在线账户，并在可能的情况下启用双因素认证。\n\
  \n## 黑客攻击 Twitter 账户的最佳方式\n\n经过十几次不成功的黑客尝试，你在反复尝试黑客攻击 Twitter 账户时感到紧张和恼火。这就是特殊的黑客软件和键盘记录器可以帮助你完成秘密任务的地方。PanSpy\
