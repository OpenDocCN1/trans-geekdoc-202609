    **Abstract**—Using gaps gives us opportunity to extract information from metadata.
    From the point of view, the missing information in metadata of an application
    could be a sign of suspicious activity, which could be detected for extensive
    analysis. The usage of user reviews on such inconsistencies is also helpful. In
    addition to how to discover such inconsistencies through the use of permissions
    and metadata, this study proposes a method based on natural language processing
    and recurring neural networks.


    *Index Terms*—Abstract, description-permission-fidelity, deep learning, natural
    language processing, recurring neural networks**


    language processing (NLP) in order to extract meaningful,

