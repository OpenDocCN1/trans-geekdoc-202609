    In this study, user reviews are also treated as a text-based description. In our
    document-based model, we follow the following strategy. First we train the model,
    is trained then we test the description in the test set whether a permission is
    stated or not. If the permission is high and the permission is detected, then
    it is concluded that the permission is required by the application. However, if
    the permission is low then it is still possible for the permission to be required
    by the application but it could be ignored in the description. This time we used
    3 user reviews of the system to apply the trained LSTM model and concatenate the
    encoding of description with encoding of the LSTM to predict the permission. The
    permission errors are expected to overlap with the errors of the reviews in testing.
    The results we obtained from testing are shown in Table V. Here, the threshold
    of permission is set to 0.5 to show results especially for the READ_CONTACTS and
    READ_AUDIO permissions. However, as it is noted, the performance of the document-based
    model is considerably lower than the sentence-based model.


    # V. CONCLUSION AND FUTURE WORK


    Description-fidelity problem refers to the inconsistencies between requested permission
    and app metadata. In this paper we use natural language processing methods, as
    well as recurrent neural networks to tackle the description-fidelity problem in
    Android applications. Our results show that


    using a bidirectional LSTM network detects the inconsistencies between the requested
    permissions and app descriptions respectively.


    Our model is similar to the recent model AC-Net [5] based on deep recurrent networks.
    However, their model uses Gated Recurrent Units (GRU), whereas ours uses LSTM.
    Difference between our model and theirs is the inclusion of the user reviews.
    It is possible to have some descriptions that are not about the permissions, but
    user reviews are. Our results show that using user reviews could improve the system
    performance.


    We plan to investigate the methods to include the reviews in the sentence-based
    model, which is left to future work.


