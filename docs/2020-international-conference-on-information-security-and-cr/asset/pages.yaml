    # IV. EXPERIMENTS


    # A. Evaluation Metrics


    In this study, we evaluate the PR-AUC and ROC-AUC metrics. Since the AC-Net dataset
    [5] is not well balanced, we use the PR-AUC and ROC-AUC metrics as standard of
    standard metrics such as. To give an example from the camera permission, only
    522 of the 2474 sentences in the AC-Net dataset seem to be related to the CAMERA
    permission.


    Finally, inconsistencies arising from the data cause the model to produce erroneous
    results. This situation is because many cases contain information about social
    media. For example, phrases as “share with friends via Facebook” classified as
    permission and some as normals. In training and prediction, some labeling may
    lead to contradictory results, increasing both false positives and false negatives.


    # C. Results of the Document-Based Model Using Reviews


    One of the reasons for developing the document-based model in using reviews is
    to evaluate the permission-permission de-boundary problem. In order to evaluate,
    the document-based model is trained and tested on the AC-Net dataset. Using the
    same LSTM model which is trained on the reviews, however we use the full text
    when deeding into the LSTM, rather than feeling the sentences within the description
    one by one. We train the model each as a single document.


