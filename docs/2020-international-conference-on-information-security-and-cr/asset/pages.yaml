    # III. MODEL


    The overall architecture of the proposed approach is given in Figure 1, which
    is on the right side of Figure 1, labeled application descriptions (i.e. sentences)
    are pre-processed, then feature vectors are built based on trained embeddings,
    and into a Long Short Term Memory (LSTM). An LSTM-based prediction model is built
    for each permission. In testing, which is on the left side of Figure 1, a new
    description is first pre-processed and the feature vector is then fed into the
    prediction model for each permission. The prediction score for a permission is
    used to determine whether the permission is identified as a correct permission.


    Other studies have examined the impact of app security and privacy features [91].
    Kong et al [9] proposed a system AUTOBER to learn the privacy-related behaviors
    inferred from user applications. AUTOBER is a machine learning algorithm to associate
    relationship between reviews and privacy-related behaviors. A study by Nguyen
    used a natural language-based model to classify the users into security&privacy
    related (SPR) or non-SPR. They showed that there is a strong correlation between
    reviews and privacy-related app updates. A more recent study, we made use of user
    comments to understand why an application is asking for permissions. The proposed
    NLP based on SmartPI [11] framework detects users comment relate to functionality


