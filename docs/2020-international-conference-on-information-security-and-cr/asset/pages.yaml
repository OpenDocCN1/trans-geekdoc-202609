    # I. INTRODUCTION


    Mobile devices have become inescapable part of our lives.

    With the use of applications, they provide many functionalities

    as as writing/reading emails, mobile banking, finding

    features that make our lives easier. While Android is

    leading mobile operating system with approximately 75%

    share in the market [1], it is one of the most popular

    platforms used by [2].


    There are two main techniques to detect:

    static and dynamic analysis. While applications are run

    a device or emulator to observe the runtime behaviour of

    gapplications, in static analysis the application is

    not run and consists of its code. In the application

    package analyze the file using static methods. Both

    techniques have their pros and cons which could be

    bypassed by evasion techniques. Beside and dynamic

    behaviour of applications, Android platform gives us

    to analyze applications from the security point of view:

    metadata in a market store such as descriptions, user

    reviews and ratings, policies. In the last

    five years, we have started to see the applications of natural


    Firstly, a neural model using deep neural networks is

    tposed to detect the inconsistencies between requested

    permissions and metadata. Section III introduces the method

    based on LSTMs for the problem. The experimental

    results of the proposed approach on the Ac-Net dataset [5]

    are given and discussed in Section IV. The effects of user

    reviews on the results are also discussed in this section.

    Section V concludes the paper.


