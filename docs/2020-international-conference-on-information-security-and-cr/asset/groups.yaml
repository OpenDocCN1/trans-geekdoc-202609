    (LSTMs) [16] filter out irrelevant information while remembering past also provides
    such networks to overcome vanishing gradient problem. We utilize LSTM in our approach
    for processing app descriptions that are composed of sequences and by nature.


    First, app descriptions are preprocessed feeding into the LSTMs. The pre-processing
    tasks involve sentence extraction, word tokenization, punctuation removal, elimination,
    non-alphabetic character removal, and stemming; then embeddings are obtained from
    pre-trained word embeddings and these embeddings are fed into an LSTM. The output
    of each LSTM is the compositional representation of the input sentence that identifies
    its semantics. We use a bidirectional LSTM, where one LSTM processes the words
    in forward order, and another processes the words in reverse order;


    ```

    $s_i = BiLSTM(x_{t,i})$

    ```


    Here, $s_i = (x_{t,i})$ is the sentence in the data and $y_j$ is the embedding
    of the $j$th word in the sentence. We use $s_i$ for the compositional representation
    of sentence. The final hidden vectors of both LSTMs are concatenated to form the
    sentence representation $s_i$. The compositional representation of each sentence
    is obtained from the bidirectional LSTM, each sentence is classified by a multipilayer
    perceptron with a sigmoid activation function as given below:


    ```

    $\alpha_i = sigmoid(MLP(s_i))$

    ```


    where $\alpha_i$ is the prediction, which called the permission score. It is a
    value between 0 and 1 in order to decide whether the corresponding permission
    is in the given input. If it is greater than 0.5, the classification is output.
    Otherwise, the output is 0, hence of the permission is not stated in the sentence.

    Our task is a binary classification problem. A different LSTM is produced for
    each permission category.


    ```

