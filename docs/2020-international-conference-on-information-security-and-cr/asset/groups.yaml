    # V. CONCLUSION AND FUTURE WORK


    Description-fidelity problem refers to the inconsistencies between requested permission
    and app metadata. In this paper we use natural language processing methods, as
    well as recurrent neural networks to tackle the description-fidelity problem in
    Android applications. Our results show that


    using a bidirectional LSTM network detects the inconsistencies between the requested
    permissions and app descriptions respectively.


    Our model is similar to the recent model AC-Net [5] based on deep recurrent networks.
    However, their model uses Gated Recurrent Units (GRU), whereas ours uses LSTM.
    Difference between our model and theirs is the inclusion of the user reviews.
    It is possible to have some descriptions that are not about the permissions, but
    user reviews are. Our results show that using user reviews could improve the system
    performance.


    We plan to investigate the methods to include the reviews in the sentence-based
    model, which is left to future work.


