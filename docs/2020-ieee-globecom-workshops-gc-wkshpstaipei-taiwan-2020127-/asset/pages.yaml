    # C. Training and Test


    Given inputs, the optimal solution (denoted by $\lambda$) can be obtained numerically
    by measuring the average with different values of $\lambda$. It is worth noting
    that the output range is restricted between -1 and 1 due to the tanh function.
    As a result, these optimal solutions need to be confirmed by set training and
    validation. A 75:25 ratio between the training data and the test data is adopted.
    In other words, we randomly choose 3/4 of the samples to training the ANN and
    use the remaining samples to measure the fitness. Let $M$ denote the number of
    training samples which can be calculated by:


    ```

    $L = \frac{1}{M}\sum_{m=1}^{M}(\lambda_m - \lambda)^2$ (13)

    ```


    The gradient descent is used to update the weights and biases on each iteration:


    ```

    $w_{k,i,j} = w_{k,i,j} - \eta\frac{\partial L}{\partial w_{k,i,j}}$ (14)

    ```


    where $\eta$ is the learning rate, which controls the step of iteration. Backpropagation
    is used to reduce computational complexity. Specifically, the parameters are updated
    in the sequence of $b_2$, $w_{2,i,j}$, and $w_{1,j}$.


