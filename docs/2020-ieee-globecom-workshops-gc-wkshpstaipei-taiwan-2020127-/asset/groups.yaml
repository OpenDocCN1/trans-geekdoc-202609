    # 一种用于 LiFi 和 WiFi 混合网络的新型机器学习切换方案


    Xiping Wu 和 Dominic C. O''Brien


    牛津大学工程系

    OX1 英国

    {xiping.wu, dominic.obrien}@eng.ox.uk


    摘要——结合高光光谱效率（LiFi）与 WiFi 的混合网络引起了越来越多的关注。然而，由于 LiFi 和 WiFi 的覆盖区域重叠，混合网络中的切换问题变得突出。对于移动用户，LiFi
    和 WiFi 之间的切换变成了一个棘手的问题。我们提出了一种基于机器学习的新型方法来调整 LiFi 和 WiFi 之间的切换偏好。实验结果表明，与基于接收信号（RSS）和基于轨迹的切换方法相比，提出的方案可以将用户吞吐量分别提高
    20% 和 50%。


    大量研究已经考虑了切换问题，基于轨迹的切换方案 [3]。这种类型的切换方法在非相邻 AP 之间依赖于用户的轨迹信息。将 AP 与用户位置相结合并开发了多种平衡方法
    [4]，但具有巨大的计算复杂度。为了降低处理功率，研究人员应用了游戏理论 [5] 和模糊逻辑 [6]。然而，在最大化网络吞吐量时，切换需要达到一个稳定状态，而只有一种才能提供最优解决方案。


    # I. 引言


    室内无线通信面临指数级增长的数据，LiFi 和 WiFi 作为未来无线通信的一种有前景的解决方案近期引起了关注 [2]。LiFi 使用光波作为载波，与 WiFi
    相比，LiFi 具有许多优势：(i) 海量光谱；(ii) 无射频（RF）区域限制；(iii) 照明自由；(iv) 安全通信。


    混合网络可以显著提高室内网络性能，切换是一个挑战性问题这是由于两个因素：首先，单个接入点（AP）的覆盖范围较小，距离为 2-3 米，导致移动用户频繁发生切换。其次，LiFi
    和 WiFi 的覆盖区域相互重叠。这意味着仅考虑信道质量的切换方法效果有限，WiFi 容易过载，而 LiFi AP 的覆盖范围有限。因此，需要考虑资源可用性来平衡负载。


    在 LiFi 和 WiFi 网络中执行切换时，本文中我们研究了机器学习在切换过程中的应用。该领域已开展研究工作 [8]，为异构网络开发了切换方案。此外，使用人工神经网络（ANN）提出了基于体验质量（QoE）的垂直切换方案
    [9]。这些研究有两个局限性：(i) 它们只管理垂直切换（VHO）；(ii) 未考虑资源可用性。受此启发，我们提出了一种基于 ANN 的新型切换方案，考虑了信道质量和用户移动。通过使用
    ANN 训练决策器，该方法采用 ANN 来调整 LiFi 和 WiFi 之间的切换偏好。据我们所知，该切换方案是现有文献中的首次。


    本文的后续结构如下：第二节介绍了系统模型，包括网络信道模型和光路模块。第三节提出了新型切换方案。第四节给出结果。最后在第五节得出结论。


    ![](img/1976553fdce85dccd6e164437e551b1_1_0.png)


    图 1 室内 HLWNet 的示意图。




    图 1 显示了室内 HLWNet 的示意图。每个 WiFi AP 的覆盖区域内放置了若干 LiFi AP。LiFi AP 按晶格拓扑排列，每个工作在天花板
    LED 灯上。WiFi 系统采用感知多接入以避免室内层面的干扰竞争（ICI）。对于 LiFi，使用因子为 4 的频率来减轻 ICI。假设用户遵循随机点（RWP）模型随机移动。采用时分多接入（TDMA）使
    AP 能够覆盖多个用户。


    ### A. LiFi 信道模型


    LiFi 信道由两个部分组成：直视（LoS）和非直视（NLoS）路径。令 $d_{i,u}$ 为 AP i 与用户 u 之间的欧几得距离。令 $\theta_{i,u}$
    和 $\psi_{i,u}$ 为角度。LoS 信道可以表示为：


    $$H_{i,u}^{LoS} = \frac{R_{pd}}{d_{i,u}^2} \cos^m(\theta_{i,u})$$


    其中 $R_{pd}$ 是探测器灵敏度，$m$ 是朗伯包络；$\Psi_{max}$ 是光二极管的视场（FOV）。光学增益给出：


    $$g_{i,u} = \begin{cases} n^2\sin^2(\psi_{i,u}), & \psi_{i,u} \le \Psi_{max} \\
    0, & \psi_{i,u} > \Psi_{max} \end{cases}$$


    其中 $n$ 代表反射率，$\Psi_{max}$ 是半角。由于 NLoS 路径贡献较小，仅考虑一阶反射 [11]。AP i 与用户之间的 LiFi 链路信噪比（SNR）写为：


    $$SNR_{i,u}^{LiFi} = \frac{(R_{pd}H_{i,u}^{LoS}P_{mod})^2}{N_{LiFi}B_{LiFi} +
    \sum_{j\in J}(R_{pd}H_{j,u}^{NLoS}P_{mod})^2}$$


    其中 $B_{LiFi}$ 是带宽，$N_{LiFi}$ 是功率密度，$J$ 是 AP 集合。


    ### B. WiFi 信道模型


    WiFi 信道的增益给出：


    $$G_{i,u}^{WiFi} = |H_{i,u}^{WiFi}|^2 10^{-\frac{\alpha X_u}{10}}$$


    $H_{i,u}^{WiFi}$ 表示传输函数，遵循瑞利分布；衰落因子 $X_u$ 是均值为 0、标准差为 10 dB 的高斯变量；L(d) 表示自由路径损耗：


    $$L(d) = \begin{cases} 20\log_{10}(f_c) - 147.5, & d < d_{ref} \\ 20\log_{10}(d_{ref})
    - 147.5, & d \ge d_{ref} \end{cases}$$


    其中 $f_c$ 是中心频率，$d_{ref} = 10$ m 是参考距离。WiFi 链路的信噪比可以写为：


    $$SNR_{i,u}^{WiFi} = \frac{G_{i,u}^{WiFi}P_{WiFi}}{N_{WiFi}B_{WiFi}}$$


    其中 $N_{WiFi}$ 是接收处的功率密度，$B_{WiFi}$ 和 $P_{WiFi}$ 表示 WiFi AP 的带宽和发射功率。


    ### C. 光路阻塞


    考虑两个参数来对光路阻塞：发生率和占用率 [7]。发生率单位时间内发生的阻塞平均数量。使用泊松点过程（PPP）来建模如数据包到达交换机等随机事件。这里假设阻塞事件遵循
    PPP 过程。占用率定义为单位时间内被阻塞占据的时间。该参数假设在 0 到 1 之间分布。

    '
