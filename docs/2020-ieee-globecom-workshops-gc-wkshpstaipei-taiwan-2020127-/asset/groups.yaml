    接入点} \end{cases}$

    ```


    其中 $\rho_u$ 表示接入点 $i$ 分配给用户 $u$ 的时间比例。参数 $\rho_u$ 可以通过[6, 13]中的比例公平调度器确定。


    ## III. 提出的切换方案


    在本节中，提出了一种新的切换方案来处理信道质量、资源可用性以及用户移动性。引入了一个动态系数来调整 LiFi 和 WiFi 之间的选择偏好。该系数通过人工神经网络（ANN）进行训练，以适应不同的场景。


    ## A. 切换方案


    我们在[14]中的之前工作表明，接收信号强度（RSS）的变化率可以指示用户是否正在向某个接入点（AP）的中心移动。比较 RSS 和变化率可以跳跳过某些接入点有效减少不必要的切换。考虑到资源可用性，所提切换方案的目标函数公式化如下：


    ```

    $\Gamma_i = \begin{cases} (\Gamma_{i,u} + \Delta\Gamma_{i,u}), & \text{如果 } i
    \text{ 是 LiFi 接入点} \\ (\Gamma_{i,u} + \Delta\Gamma_{i,u}), & \text{如果 } i \text{
    是 WiFi 接入点} \end{cases}$

    ```


    其中 $\Gamma_u$ 表示用户的信号，该参数定义为针对所需数据 $y_u$ 的可实现数据率；它指示 RSS，$\Delta\Gamma_{i,u}$
    表示其变化率。三个参数分别反映了资源可用性、信道质量和用户移动性对切换密度的影响。系数 $\lambda$ 用于指示网络中 LiFi 和 WiFi 之间的选择偏好（详情见
    III-B 节）。


    长期演进技术（LTE）[15]中的切换算法采用了滞回概念来缓解乒乓效应。具体而言，当主导接入点的 RSS 高于该阈值时，触发决策过程。但决策不会立即做出，直到目标接入点在一段时间内持续提供更高的
    RSS，其典型值为数百毫秒[15]。在这里，我们使用了一种基于双触发的机制：RSS 和用户的建议决策。当以下任一两个


    ![](img/1976553fdc5e85dccd6e164437e551b1_2_0.png)


    与 LiFi 相关的参数高于任何其他接入点时，所提切换方案开始计时。时间计数器在满足触发条件时计数，否则重置。当计数器达到预设阈值时，做出决策将用户从主导接入点转移到提供
    $\Gamma_i$ 值最大的目标接入点。


    ## B. 机器学习算法


    现在我们讨论如何确定系数 $\lambda$。通常，大多数用户倾向于 WiFi 以避免频繁切换接入点。在这种情况下，$\lambda$ 应该是一个大于 1
    的数，以增加 WiFi 接入点的 $\Gamma_i$ 值。当用户处于静态或缓慢移动时，$\lambda$ 应该为 1，以选择提供最高 $C_u$ 的接入点。对于此类用户，LiFi
    和 WiFi 的不同覆盖互不干扰。$\lambda$ 的最优值取决于多个因素，包括用户的速度（用 $V_u$ 表示）、两个 LiFi 接入点之间的间距（用
    $S_u$ 表示）、LiFi 接入点的高度（H）以及 WiFi 接入点的数量（N）。$\lambda$ 的选择取决于这些因素。然而，由于决策过程的复杂性，无法为该函数开发闭式表达式。因此，我们建议用
    ANN 来决策。


