    ## Achievable Data Rate


    The WiFi capacity can be measured by Shannon capacity.

    Unfortunately this does not apply to LiFi since $\Gamma^{WiFi}$ is an elastic
    SNR for non-negative signals. A lower bound of the LiFi channel defined in [23],
    which can be used for. Regarding the link between AP $i$ and user $u$, the achievable
    data rate can be computed as:


    ```

    $r_{i,u} = \begin{cases} \rho_u \log_2(1 + \frac{\Gamma_{i,u}^{LiFi}}{B}), & \text{for
    a LiFi AP} \\ (1-\rho_u)\log_2(1 + \frac{\Gamma_{i,u}^{WiFi}}{B}), & \text{for
    a WiFi AP} \end{cases}$

    ```


    where $\rho_u$, denotes the proportion of time that AP $i$ allocates to user $u$.
    The parameter $\rho_u$, can be determined by a proportional fairness scheduler
    in [6, 13].


    ## III. PROPOSED HANDOVER SCHEME


    In this section, a novel handover scheme is proposed to handle channel quality,
    resource availability and user mobility. A dynamic coefficient is introduced to
    adjust the selection preference between LiFi and WiFi. This coefficient is trained
    by ANN to fit different scenarios.


    ## A. Handover Scheme


    Our previous work in [14] has shown that the rate of change in RSS can indicate
    whether the user is moving towards the center of an AP. Comparing RSS and rate
    of change can effectively reduce unnecessary handover by skipping certain AP.
    Taking resource availability into account, the objective function of the proposed
    handover scheme is formulated as follows:


    ```

    $\Gamma_i = \begin{cases} (\Gamma_{i,u} + \Delta\Gamma_{i,u}), & \text{if } i
    \text{ is a LiFi AP} \\ (\Gamma_{i,u} + \Delta\Gamma_{i,u}), & \text{if } i \text{
    is a WiFi AP} \end{cases}$

    ```


    where $\Gamma_u$ denotes the user''s signal, this parameter is defined as the
    achievable data rate to the required data $y_u$; it indicates the RSS, $\Delta\Gamma_{i,u}$
    represents its change of rate. Three parameters reflect the impact of resource
    availability, channel quality and user mobility on handover densities, respectively.
    The coefficient $\lambda$ is used to indicate the selection preference between
    LiFi and WiFi in the network (See details about this in Section III-B).


    The handover algorithm in long evolution (LTE) [15] employs the concept of hysteresis
    to mitigate the ping-pong effect. Specifically, the making-decision process is
    triggered when the RSS of the host AP is above that. But the decision is not immediately
    made until the target AP keeps providing a higher RSS for a certain amount of
    time, with a typical value of hundreds of milliseconds [15]. Here we use a mechanism
    but dual triggers: RSS and the user''s suggestion decision. When either of the
    two


    ![](img/1976553fdc5e85dccd6e164437e551b1_2_0.png)


    parameters related to LiFi is above any other AP, the proposed handover scheme
    starts to count time. Time counter counts as the trigger condition is met or otherwise
    is reset. When the counter reaches the preset threshold, a decision is made to
    transfer the user from the host AP to the target AP that provides the highest
    value of $\Gamma_i$.


