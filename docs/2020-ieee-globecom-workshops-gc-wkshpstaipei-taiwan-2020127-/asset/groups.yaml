    # V. CONCLUSIONS


    ![](img/1976553fdc5e85dccd6e164437e551b1_4_0.png)


    In this paper, a novel machine learning-based handover scheme was proposed for
    hybrid LiFi and WiFi networks. This approach takes into account channel quality,
    resource availability and mobility, and adopts a dynamic coefficient to adjust
    selection through ANN including the user''s speed, the separation from LiFi APs,
    and the number ratio between LiFi APs and WiFi APs. Simulations were carried out
    to evaluate the ANN model and the performance of the proposed handover scheme.
    The results show that the new method can effectively avoid frequent handovers,
    with a handover rate 68% less and 27% than the trajectory-based method. In terms
    of effective throughput, the proposed scheme outperforms the baseline by 260%
    and 50%, respectively. Future work will aim to reduce the complexity of the ANN
    model and its rate of convergence.


    ![](img/1976553fdc5e85dccd6e164437e551b1_4_1.png)


