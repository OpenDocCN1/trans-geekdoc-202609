    # A Novel Machine Learning-Based Handover Scheme for Hybrid LiFi and WiFi Networks


    Xiping Wu and Dominic C. O''Brien


    Department of Engineering

    University of Oxford, OX1 3PF, UK

    {xiping.wu, dominic.obrien}@eng.ox.ac.uk


    Abstract—Combining the high spectrum efficiency of light fidelity (LiFi), WiFi
    and hybrid networks have increasing research attention. Meanwhile, the issue in
    hybrid networks becomes a hotspot since the coverage areas of LiFi and WiFi overlap.
    For handovers for mobile users, selection between LiFI and WiFi becomes a tricky
    problem. We propose a novel method based on machine learning to adjust the selection
    preference between LiFI and WiFi. The new method channel quality, resource availability
    show that compared to received signal (RSS)-based and trajectory-based handover
    methods, the proposed scheme can improve the user''s throughput by up to 20% and
    50%, respectively.


    A significant number of studies have been considered out [3], trajectory-based
    handover scheme was proposed for other handovers. This type of method handovers
    place between two non-adjacent APs but rely on the user''s trajectory information.
    Associating AP with user location-education and various balancing methods were
    developed, [4], with enormous computational complexity. To reduce the processing
    power, researchers to apply game theory in [5] and fuzzy logic in [6]. However,
    it requires iterations of iterations to reach a stable state, where only one can
    provide optimal solutions. Moreover, [4] fail to implement the concept of load
    balancing into account when maximizing network throughput, while still considering
    computational complexity.


    # I. INTRODUCTION


    Indoor wireless communications are facing exponentially increasing demand on data,
    which WiFi is a promising solution to future wireless communications, LiFi and
    WiFi have recently attracted research attention. [2] Such a combination enables
    the high spectrum efficiency of LiFi, which uses light wave as signal carrier.
    Compared with WiFi, LiFi has many advantages including: (i) huge optical spectrum,
    (ii) immunity to radio frequency (RF)-restricted areas, (iii) freedom of illumination
    and (iv) security communications.


    The hybrid network can substantially improve indoor network performance, handover
    becomes a challenging issue. This is due to two factors. First, the coverage of
    a single access point (AP) is relatively small, with a 2-3 meter distance. As
    result, frequent handovers occur to mobile users with a walking speed. Second,
    the coverage areas of LiFi and WiFi overlap each other. This means the handover
    methods that only consider channel quality less effective. Thus, WiFi is susceptible
    to traffic overload, while LiFi AP has limited coverage. Consequently, resource
    availability needs to be taken into account to balance the traffic loads. When
    executing handovers in a hybrid LiFi and WiFi network,


    In this paper we investigate the use of machine learning in the handover process
    for hybrid networks. Our research work has been conducted in this field. In [8],
    a handover scheme was developed for heterogeneous networks. Also using an ANN,
    a quality of experience (QoE)-based vertical handover scheme was proposed in [9].
    These studies have two limitations: (i) they only manage VHO and (ii) resource
    availability is not considered. Motivated by this, we propose a novel ANN-based
    handover scheme that takes into account channel quality and user mobility. By
    using ANNs to train a dynamic decision maker, the proposed method employs an ANN
    to adjust the selection preference between LiFi and WiFi. To the best of our knowledge,
    the proposed handover scheme is the first of its kind in the existing literature.


    The remainder of this paper is organised as follows. The system model is introduced
    in Section II, including network channel model and light-path blocks. The novel
    handover scheme is proposed in Section III. Results are presented in Section IV.
    Finally, conclusions are drawn in Section V.'
