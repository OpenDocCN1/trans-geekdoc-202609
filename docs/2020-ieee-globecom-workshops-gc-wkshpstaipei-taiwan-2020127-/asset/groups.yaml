    ## 可实现数据率


    WiFi 容量可以通过香农容量来衡量。

    遗憾的是，这不适用于 LiFi，因为 $\Gamma^{WiFi}$ 是非负信号的弹性信噪比（SNR）。在[23]中定义的 LiFi 信道下界可以用于。关于接入点
