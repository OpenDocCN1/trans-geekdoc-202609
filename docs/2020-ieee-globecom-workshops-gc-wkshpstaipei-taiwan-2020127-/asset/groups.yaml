    # ## B. Machine Learning Algorithm


    Now we discuss how to determine the coefficient $\lambda$. In general-most users
    prefer WiFi to avoid frequent handover APs. In this case, $\lambda$ should be
    a larger number than 1 to increase the value of $\Gamma_i$ for WiFi APs. When
    the user is static or moving slowly, $\lambda$ should be 1 to choose the AP that
    provides the highest $C_u$. For such a user, the different coverage of LiFi and
    WiFi do not interfere with each other. The optimal value of $\lambda$ depends
    on a number of factors including the user''s speed (denoted by $V_u$), the separation
    between two LiFi APs (denoted by $S_u$), the height of LiFi APs (H), and the number
    of WiFi APs per AP (N). The choice of $\lambda$ depends on these factors. However,
