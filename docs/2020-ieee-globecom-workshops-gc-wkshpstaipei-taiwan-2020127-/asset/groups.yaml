    # V. 结论


    ![](img/1976553fdc5e85dccd6e164437e551b1_4_0.png)


    本文针对混合 LiFi 和 WiFi 网络提出了一种新型基于机器学习的切切换方案。该方法考虑了信道质量、资源可用性和移动性，并采用动态系数通过人工神经网络（ANN）调整选择，这些因素包括用户速度、与
    LiFi AP 的距离以及 LiFi AP 与 WiFi AP 之间的数量比例。通过仿真评估了 ANN 模型及所提切换方案的性能。结果表明，该新方法能够有效避免频繁切换，切换率比基于轨迹的方法分别降低了
    68% 和 27%。在有效吞吐量方面，所提方案比基准方案分别优出 260% 和 50%。未来的工作旨在降低 ANN 模型的复杂度并提高其收敛速度。


