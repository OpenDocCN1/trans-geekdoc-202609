    \ However, since etherum is still brand new, it is always evolving to meet the\
    \ needs of its users while keeping the system decentralized.\n\n### Tens of Thousands\
    \ of Merchants Are Using Bitcoin\n\nHaving that many people using bitcoin would\
    \ be amazing! But, sadly, there are not very many merchants out there that are\
    \ going to accept bitcoin for payment. There is only around eighty percent of\
    \ cryptocurrency being used for hoarding instead of actual spending. So, if a\
    \ merchant allows you to use cryptocurrency to pay for a good or service, then\
    \ they are going to be letting you use them in a facility that is their partner,\
    \ which means that they are going to take the digital currency and turn it into\
    \ actual money so that they can use it to buy things that need to be purchased\
    \ to keep their business running. But, there are going to be risks and fees that\
    \ are put in place when you are the merchant accepting cryptocurrency.\n\nThere\
    \ are a few merchants that are accepting cryptocurrency and are testing the waters\
    \ to see how it works and if it is a practical process for a business to use.\
    \ Most of the merchants that are accepting cryptocurrency are doing so to get\
    \ media exposure and more customers in their doors.\n\n### The Transactions Are\
    \ Going to Be Processed in Real Time Like a Bank Handles Their Transactions\n\n\
    Incorrect! There is a ten-minute delay between when a transaction is processed\
    \ on the blockchain. Therefore, two transactions are going to be completed per\
    \ second with bitcoin.\n\n### Transactions That Are Done on Bitcoin Are “Almost\
    \ Free”\n\nOnce again, this is wrong! There is going to be a processing fee that\
    \ is going to come with using bitcoin, but it is not going to be charged to the\
    \ users or the merchants. The people who are using blockchain to mine are going\
    \ to process the transaction, which is going to be ninety-nine percent of the\
    \ revenue that a miner makes. Therefore, this is going to come to around twenty-one\
    \ million bitcoins that are mined, which is estimated to happen approximately\
    \ 2140. But, once that occurs, there is no set plan that is going to tell people\
    \ what the transaction costs are going to be.\n\nThese transactions are going\
    \ to be processed and will reward minimally through the network with a small portion\
    \ of bitcoins. This is not the representation of the actual revenue that a miner\
    \ is going to receive. Most miner rewards are going to end up justifying the high\
    \ costs that are associated with the transaction.\n\nExchange commissions added\
    \ up all of the costs, and sooner rather than later there are not going to be\
    \ any negligible costs that are in the system.\n\n### Bitcoin Has the Most Secure\
    \ Currencies\n\nWhile this is true because bitcoin holds a high resilience to\
    \ attacks, it is just like any other transaction system that is going to have\
    \ breaches in security because of human error or fraud.\n\nIn 2015 alone there\
    \ were:\n\n*   Three hundred and eighty-seven million dollars in fraud by clients\
    \ that vanished from a bitcoin exchange in Hong Kong.\n\n*   Thanks to a phishing\
    \ attack, two million dollars in bitcoin were lost.\n\n*   The bitcoin exchange\
    \ in Canada was shut down because someone compromised their database. \n\nAnd\
    \ trading was temporarily suspended because of one wallet that is in operation\
    \ was compromised, thus compromising the entire system.\n\n### Bitcoin’s Ecosystem\
    \ Is Decentralized\n\nMining pools on the blockchain have increased. But, at least\
    \ one of the top four mining pools is in China on their exchange. The bigger mining\
    \ pools are going to be artificially limited so that democracy does not show any\
    \ favoritism. But, those that work with a smaller pool are going to be pushed\
    \ out of business because of the larger ones. It is just like any system where\
    \ the bigger you are, the more money you are going to end up being able to spend\
    \ on controlling the market.\n\nOne of the reasons behind the dominance is because\
    \ bitcoins are going to be generated through mining, and that is becoming harder\
    \ because the number of coins in the system has increased. And, the more prominent\
    \ mining farms are going to have the money that is needed to invest and operate\
    \ their farms while other farms are being shut down because of the high operating\
    \ costs.\n\nThere are a few opaque players that have been controlling the system,\
    \ and this allows for the system to modify the transaction rules, which ends up\
    \ making it harder for others to get into the investments due to the fact that\
    \ they cannot keep up with the protocols that are changing all of the time."
