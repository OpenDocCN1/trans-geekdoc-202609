    在参与 ICO 时，你购买的是区块链公司提供的加密货币。这在任何情况下都不意味着你拥有该业务的所有权。拥有 `XRP` 并不意味着你对 `Ripple` 的运营拥有投票权。购买
    `ether` 并不让你对 `Ethereum` 的下一次升级有发言权。相反，你只是购买了这种货币，并可以决定何时出售它。


    这与 IPO（公开募股）有显著区别。持有上市公司的股票你确实拥有投票权。如果你有三十股，你就有三十票。虽然这并不一定能让你拥有决策权，但它确实让你对投资的运营拥有一定的话权。它还为你提供了一些投资者保护，在公司发生欺诈行为时提供法律追诉途径。


    ## 你无法了解公司内部情况


    自从 ICO 成为欺骗投资者的主要手段以来，它一直是加密投资体验中一个臭名昭著的缩影。这导致了对 ICO 监管的许多批评，因为发行币的公司不需要提供太多关于其运营方式、增长策略以及未来计划的信息。他们不需要分享资产负债表，不需要提供已完成销售的文件，也不需要展示利润数据。从本质上说，除了他们独立选择向潜在买家分享的信息外，这些公司就像幽灵一样。


    当你投资 IPO 时，情况并非如此。在 IPO 发行之前，公司必须向 `SEC` 提供详细的财务信息。这些信息会在 IPO 日期之前公开，因此对公司的投资者可以衡量公司的健康状况。


    ## 发行 ICO 的初创公司


    发行 ICO 的公司都是相当年轻的企业。它们没有长期的成功历史、多年的利润，甚至没有大量的投资者（尽管有些公司确实有天使投资人或 A 轮投资者）。通常，发行
    IPO 的公司已经表现出了一段时间收入或利润增长的能力。由于公司的财务信息将在 IPO 过程中公开，机构投资者和零售投资者将对公司的表现进行判断，对其过去的经历和未来去向进行严苛的审视。这过滤掉了那些除了快钱之财之外没有真正理由上市的公司。而这些坏分子在
    ICO 过程中更难发现。


    投资 ICO 的吸引力在于能够以极低的价格进入新币种，这让你有机会拥有该币种更大份额份额。另一个原因是？尽早进入一个随后爆发的币种可以作为炫耀的资本。这两者都是持有
    ICO 项目的正当理由。只需知道，如果你选择走这条路线，你所花的钱极可能再也见不到了。


    ## 你无法预知哪些币会涨


    `Ethereum` 的 `ether` 花了近两年时间才稳定高于每币 20 美元。`ether` 的早期投资者在 2017 年之前并不认为这是一项特别兴奋的投资。很可能许多早期投资者因为厌倦等待而离开了。点在于，投资
    ICO 是极具风险的，因为你不知道哪些币会大涨，因为关于支持该币的区块链信息非常少，而且你的初始投资假设可能需要多年才能实现。


    因此，在 ICO 之后卖掉你的加密货币之前等一会儿并无害。`ether` 故事的另一面（花费两年才达到 20 美元）是，它为任何投资者提供了更多的时间来购买该币，随着更多关于技术的信息被为人知。在
    `ether` 几乎没有进展的两年里，世界认识了创始人 `Vitalik Buterin`，而且 `Ethereum` 开始接触对区块链技术表现兴趣的大公司。这给了你时间去识别哪些看起来是正规业务。诚然，你持有的股份可能会更少，但你没有把钱投在糟糕业务上的机会大大增加了。


    ### 1. 它们是挖矿出来的

    这是 `Bitcoin` 普及的过程。在区块链代码的深处，存在特定数量的币，矿工寻找这些币以发现新币。一旦被发现，矿工就可以将币卖给市场，就像你卖它们一样。区别在于，矿工不需要支付市场价格来获得这些宝藏。如果有像
    `Bitcoin` 这样的市场，这些币会被迅速抢光。


    ### 2. 它们是被控制的

    `Ripple` 公司在发行其加密货币 `XRP` 时使用了具有争议的策略。他们没有通过 ICO，而是挖了所有的币，并将大部分赠给了其高管。然后他们根据公司设定的能够驱动需求并确保供应的数量定期释放币。社区由于这种设置而反对
    `XRP`，因此公司决定将总数 `XRP` 的约一半放在托管账户中。该账户每月流出 10 亿个 `XRP`。如果当月有任何币未被认领，这些 `XRP` 将返回托管账户，直到所有的
    `XRP` 都进入流通。这是一种独特的设置，对其他公司可能具有吸引力，因为它确实对币种提供了一些控制。


    ### 3. 它们会分叉 (Fork)

    区块链（通常）是开源软件，社区有时可以对系统进行调整、测试、更改和改进，寻求运营方式的升级。由于原始区块链存在缺陷（特别是在谈到 `Bitcoin` 时），社区有时想要调整运行该加密货币的区块链。如果社区大多数人批准了该调整，则不会产生新币。但有时，社区对解决方案存在分歧。在这种情况下，少数群体会产生所谓的“硬分叉”（hard
    fork），即产生一个全新的币。分为“硬分叉”和“软分叉”。


    虽然创建硬分叉和软分叉的机制可能很复杂，但通常来说，如果一个区块链的用户和开发者社区决定进行一项大多数社区成员或开发者同意的改进，那么就会创建一个“软分叉”（soft
    fork），即代码中的一种切换，原始加密货币将遵循该切换。这意味着货币在新规则下继续运行，而不改变币的组成。


    但有时，这种变化并没有得到加密社区中一个声音响大的少数派的批准，导致了对加密货币未来发展的分歧。当少数群体认为区块链应该通过某种方式改变来改进币时，或者当大多数认为必须发生变化而少数群体不同意时，就会产生这些分歧。少数群体并没有劫持同意该变化的绝大多数社区的意愿，而是强制进行“硬分叉”，大部分开发者将跟随原始币。那些与大多数社区意见一致的人将创建一个新的加密货币，以考虑那个不受欢迎的决定。


