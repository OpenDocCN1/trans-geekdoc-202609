    and how to get started with them.


    ### Investing in Bitcoin


    Over the past few years, there have been a number of complaints about `Bitcoin`.
    The original `Bitcoin` was developed with only 21 million coins available. These
    coins would slowly be added to the market as miners completed their codes to keep
    the chains of the blockchain secure. Many people worry that this amount of coins
    will not be enough, especially when considering how many people throughout the
    world are starting to use these digital currencies. There are also some issues
    with the speed of `Bitcoin`. `Bitcoin Cash` is meant to be an alternative to `Bitcoin`
    and is meant to help solve some of the problems that we talked about before.


