    随后，你可以使用任何支持的方法为新账户注，例如使用信用卡/借记卡、银行转账或其他任何方法。强烈建议使用信用卡，因为它们更方便、快速。银行转账可能需要 5 个工作日才能反映你的账户中。在账户加载资金后，你现在可以继续购买以坊代币。


    交易以太坊有两种主要的策略，即：


    * 持有或“HOD”

    * 活跃交易


    ### 买入并持有 (Buy and Hodl)


    正如之前提到的，以太坊具有巨大的潜力，许多投资者选择购买尽可能多的以坊代币并长期持有。长期加密货币持有者需要数字钱包或硬件钱包来存储财富。从交易所购买以太坊后，你现在可以将它们转移到外部钱包妥保存，因为交易所平台并非完全安全。


    硬件钱包对于长期以太坊持有者来说是最安全的。对于愿意采用这种策略的投资者，强烈推荐使用如 `Trezor` 或 `Ledger Nano` 等硬件钱包。它们不受在线黑客的攻击，但可能会被损坏甚至丢失。


    ### 活跃/投机性交易


    这种交易策略有点复杂，要求交易者具备交易基础知识。不同的交易者在投机以太坊未来价格时有不同的方法。


    ### 日内交易


    以太坊的巨大普及意味着它具有很高的交易量和流动性。以太坊日内交易者依赖波动的以太坊市场并对短期价格波动进行投机。他们利用短期价格波动获利，并在一天结束前关闭所有仓位。


    ## 以太坊交易带有风险


    适当风险管理的第一步是了解与交易以太坊相关的风险、其概率和强度。风险可能来自不同的来源，以不同的方式出现。以下我们分析了一些与以太坊相关的常见风险：


    ### 监管风险


    在开创性加密货币引入多年后，在大多数国家对其进行监管仍然是一个巨大的挑战。当局不确定 `Bitcoin` 和 `Ethereum` 这样的加密货币是资产、商品、支付手段还是金融工具。此外，在以太坊的情况下，当局可能会打击
    IPO 或众筹，从而影响网络的发展。


    ### 竞争风险


    以太坊面临的最大风险之一是可能出现更快、更高效的对手并取代它。鉴于该项目代码是开源的，这种情况发生的非常高。由于以太坊 Gas 费上涨，`Binance smart
    chain` 已经成为以太坊网络的强劲对手。一些开发者选择迁移到更高效、更廉价的平台，如 `Binance smart chain`。


    ### 技术风险


    区块链的分片和扩展不能 100% 保证可行。未来可能会发现代码漏洞。以太坊向 `2.0` 的过渡可能会失败，从而影响市场。


    ### 可变性


    以太坊网络面临的另一个主要风险是其代码相比 `Bitcoin` 的可变性。鉴于以太坊网络多年来的开发，对其功能进行有意义的调整将困难。


    ## 给以太坊交易初者的两个建议


    ### 结合技术分析和基本面分析


    为了提高你预测 `Ether` 未来价格走动的准确性，你应该学习如何进行技术分析以识别市场趋势和波动。大多数热门交易平台为用户提供了多种用于技术分析的工具和指标。


    另一方面，以太坊由区块链技术支撑。因此，它的发展和增长取决于许多其他因素，包括区块链活动、开发者更改、公众对以太坊的情绪以及平台上新产品的发布。因此，作为一名新交易者，你应该始终关注可能推动或压低以太坊价格的基本面因素。


    ### 风险管理至关重要


    尽管以太坊具有巨大的潜力，但它仍然是一种波动剧烈的加密货币。因此，新交易者培养纪律并学习风险管理技能以避免产生不损失至关重要。对于初学者来说，从小开始并在加密交易领域获得更多经验时增加资金是有帮助的。随着你技能的增加，你可以开始使用杠杆并投入更多资金。


    ## 智能合约


    https://www.shutterstock.com/it/image-vector/smart-contract-illustration-on-subject-financial-1290304843


    智能合约将是自我验证和自动执行的。这意味着一旦满足协议条款，付款将发送给履行协议条款的人。交易将在节点网络上运行，这些网络可以由交易参与者控制，这样他们既可以确保合约编写得正确，合约创建者不必担心合约是否会按照他们的意愿执行。


    由于智能合约可以自我验证，所有数据都将实时记录，然后发送到预定义的数据馈中。智能合约的重要点是它们防篡改的，这意味着交易将不会有人为影响。唯一可以改变的是协议中列出的义务，它们必须由交易所有者更换。归根结底，所有者将满意于他们的合约将按照他们的要求执行，而对方不会偏离计划。


    合约将是非常高效的，并将使加密货币技术受益，因为智能合约的低成本确保了大型公司意识到他们拥有更多资金。


    由于智能合约能够自我验证，人类被排除在方程之外，这将导致人为错误减少！不会有许多人尝试在合约中加入不属于的数据，通过限制访问合约的人数，合约将更加高效，工作将进行得更快。


    你可能会引用私有系统，甚至是创建智能合约的公司。由于智能合约是防篡改的，你对依赖触发器付款感到满意，这意味着你不必担心是否能收到钱。预言机（oracle）将作为智能合约与外部世界之间的缓冲，提供合约证明其性能所需的数据，同时向外部系统发送指令。


    在操作以太坊网络时，你会注意到由于安全限制，存在输入输出限制，从而限制了未放置在网络上的信息。


