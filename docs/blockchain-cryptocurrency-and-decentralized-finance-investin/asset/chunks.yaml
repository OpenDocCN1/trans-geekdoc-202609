    on the network. Therefore, there is going to be a secure point that will connect
    the contracts to any outside points that are needed.


    The oracles are going to have the power to get the data from outside sources when
    the system cannot get the information on its own. The oracle is going to work
    as an inbound and outbound, which is going to make it where Smart Contracts can
