    比特币的基础技术之一是加密学，它涉及使用代码对消息或信息进行加密，使其对拥有访问权限的人以外的其他人隐藏起来。如果你是比特币的新手，且没有任何技术知识或交易经验，这本书将帮助你掌握如何获利地进行买卖、加密货币交易、比特币和以太坊。本书将逐步解释比特币、区块链、以太坊和加密货币交易的基础知识，并引导新手从全球任何地方购买他们的第一笔比特币。


    此外，你将学习如何设置 `Bitcoin` 钱包、在投资代币之前进行技术和基本面分析、交易山寨币、投资组合管理、技术分析工具，以及在交易加密货币时需要避免的错误。这本书将指导你如何从全球增长最快的市场中获利。只要不断学习和实践，你很快就能收获辛水的回报。


    # 第一章：区块链：泡沫还是革命？


    正如你在整本书中所看到的，得益于区块链，金融领域已经发生了翻天覆地的变化。在处理财务事务时，区块链让人们变得更加高效和安全，这让他们感到更安心，因为他们不希望任何人拿他们的钱。因此，当你观察金融领域时，你会发现当谈论加密货币的优势甚至其缺点时，它经常被提及。大约有十家机构正尝试推出区块链，以提高其客户业务的效率。


    由于区块链系统运行在具有公共账本的去中心化系统上，每笔交易一旦启动就会完成。而且，在所有现有协议的支持下，区块链账本将是完全安全且百分之百准确的。这意味着外部人员无法更改它，对于使用区块链的人来说，这是一个巨大的加分，因为这意味着它几乎能够免疫黑客的攻击。


    根据区块链的构建方式，黑客必须同时攻入多个地方，这对于任何人来说都几乎是不可能的，因此黑客想要攻破区块链要困难得多。但并不意味着他们无法攻破你的区块链账户，所以你想要确保那些账户是安全的！


    在区块链技术真正变得火的那个点，它已经有一套处理文档以及处理放置在区块中的数字资产的协议。当资产需要传输时，你会希望部署一个 `Smart Contract`（智能合约），因为它将重新排列流程并使其自动化。这意味着这项技术将被应用，组织能够以比以前更廉的成本运营。这是一件极好的事情，因为小组省下的钱可以用于其他地方。


    据估计，在 2022 年的任何时候区块链都会更加流行，这将导致银行业缩减 200 亿美元。尽管如此，有几个金融行业正在研究区块链能提供什么以及它将如何改变他们提供的服务。


    ## 什么是区块链？


    https://www.shutterstock.com/it/image-vector/bitcoin-cryptocurrency-blockchain-technology-money-transfer-773006551


    区块链技术使得安全地执行交易（如支付）和传输信息（合同、销售）成为可能，且不需要中间环节（银行、信贷机构等）。产生的信息按时间顺序存储并加盖时间戳。当一组操作被保存时，前一组操作将变得不可更改，以此此类推。因此，所有记录在区块链上的交易在流转过程中都会被保留、供所有网络参与者可见，并且不可篡改。


    区块链有许多类型。其中两种特别为流行：一种是具有所谓的“工作量证明”（proof of work）共识的，另一种是“权益证明”（proof of stake）共识。为了运行，区块链需要验证者，也就是说，检查网络上发生操作的实体。


    区块链可以应用于加密货币之外的其他行业。


    ## 区块链简介


    当你深入加密货币世界时，听到的第一个术语就是“区块链”。要理解比特币、通用加密货币以及去中心化计算的未来，理解区块链的原理至关重要。区块链是比特币运行的框架或“协议”。区块链可以被称为分布在世界许多计算机上的公共账本。每笔发生的
    `Bitcoin` 交易都会被记录并添加到区块链中作为一个新的“区块”，并与之前的交易通过特殊时间戳链接，就像长链中的链环一样。


    ## 区块链的应用


    区块链已被证明在各个行业都是非常有帮助的，最重要的是具有革命性。首先是金融领域，但也进入了医学、保险或教育领域。通过以下示例，你将看到区块链如何改变我们所知的世界：


    ### 保险领域的区块链


    不久后，保险行业使用区块链存储数据将成为新标准。这项技术的高安全性以及消除欺诈和信息冗余的能力，使区块链成为保险行业的自然选择。


    区块链最令人兴奋的点之一是生成 `Smart Contracts` 来自动批准或拒绝任何理赔。


    ### 金融/银行业的区块链


    确实，最流行的应用是在这个领域，因为区块链技术可以管理许多真正改变我们所知银行业的流程。在这里你可以阅读 Alex Tapscott 和 Don Tapscott
    为《哈佛商业评论》写的关于金融演变的精彩摘要。


    随着加密货币的流行，像中国这样的经济大国将采取措施采用数字货币。简而言之，区块链可以改变我们的金融体系，并消除对许多中间公司的需求。


    ### 医学领域的区块链


    它在一个决定生死的行业中帮助管理数据并自动化流程。在美国，医疗错误是常见的死亡原因之一。将记录存储在区块链上可以减少导致死亡的冗余和错误。区块链还能为药物药物提供更高的精确度，从而帮助患者防止阿片类流向非法市场。


    ### 物流领域的区块链


    在供应链和物流行业，区块链使得更容易追踪商品从生产、包装一直到分发到各个销售点的位置。`Smart Contracts` 允许通过产品的 GPS 位置进行支付和授权；这一方面将提高该行业的效率，价值约为
    150 亿美元。


    ### 房地产领域的区块链


