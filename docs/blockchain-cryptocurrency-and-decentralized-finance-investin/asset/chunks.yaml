    # Understanding Blockchain


    Blockchains are very similar to taking inventory of physical goods. When we do
    an inventory, all we do is take all the goods we have in stock, put them inside
    some boxes (numbered in ascending order), recording the contents of each individual
    box on a register. By carefully ordering the different boxes, once the inventory
    is finished, we will also have a paper “map” that illustrates where every single
    item is located in the warehouse. If we imagine the inventory of a restaurant
    that is closing its business, for example, we find all the kitchen utensils (knives,
    cutlery, plates, pots, glasses, etc.), stored in a warehouse and placed inside
    boxes. Since the boxes are numbered and I have recorded the contents of each box
    in the register, whenever I need, for example, the colander, consulting the register
    I could know its exact location. A blockchain, therefore, can be thought of as
    the inventory of all transactions made. In practice, it is nothing more than a
    huge register that records the trace of all the blocks executed by the network
    since its birth.


    As you read this text, for example, the network is processing a new block and
    adds it to the register of all blocks processed over time. This aspect is fundamental
    to understand why this technology is so reliable. If an attacker tried to manipulate
    the information contained in one of the blocks already processed by the network,
    this modification would cause a series of chain anomalies on all the blocks. The
    other computers on the network, finding themselves dealing with a document different
    from the one they had at their disposal, would be able to define the malevolent
    nature of the operation, thus blocking it instantly. When the block is validated
    by the network it can no longer be modified. The blockchain, therefore, is not
    only an armored and distributed register (or database,) but it is also immutable.


    When a user wants to transfer money to another user, what they do is send the
    sum from their address to that of the recipient. The information of this single
    transaction is entered inside a block together with the information relating to
    all the transactions ordered in the last ten minutes. The network then takes charge
    of the block, processes it, validates it, and transcribes it on the blockchain.


    From that moment, the information contained in the block becomes immutable and
    can no longer be modified. Easy, right? Well, next we will illustrate how the
    network validates and processes the blocks, and we will have the opportunity to
    understand why the nodes that are part of this network cannot in any way manipulate
    the information contained in the block that they are processing. In other words,
    we will define who the miners are, what kind of role they have, and why they are
    so important in the functioning of a blockchain.


    https://www.shutterstock.com/it/image-vector/block-validation-blockchain-digital-ledger-1943335789


