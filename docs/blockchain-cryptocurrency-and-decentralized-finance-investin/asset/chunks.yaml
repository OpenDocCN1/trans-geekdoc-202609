  trans: '

    至少要有两个高点或低点才能形成有效的趋势线（最好有 3 个点）。如果趋势线第三次与价格线交叉，则该趋势将得到进一步验证。比特币的波动性极大，可能很难找到第三个点的验证。时间周期越长，趋势线越越好。从周线图或日线图开始，然后检查较短的时间周期以确认。


    有时，趋势线会穿过蜡烛的低点或高点部分。尽量不要穿过蜡烛的实体。如果趋势线在不强行拟合的情况下无法匹配，那么它可能不是一条有效的趋势。


    ## 如何绘制趋势线


    打开 TradingView 网站，然后选择 `BTC/USD` 图表。这显示了美元计价的比特币实时趋势价格。你可以自定义图表并在其上绘制趋势线。要这样做，请点击全功能图表图标，打开高级图表工具来自定义你的图表。你可以将图表周期更改为每日、每周或每月，然后从可用工具中绘制趋势线。在图表左侧选择
    `Trend Line Tool`（趋势线工具）。


    ## 交易通道


    通道由一对直线组成，其中一条线画在上升趋势的顶部，另一条线在底部平行绘制，连接价格系列图的波谷。


    通道用于数据可视化，以确定在何时买卖加密货币资产。绘制顶部和底部线条是为了显示交易图表上的支撑位和阻力位。


    交易通道显示了价格可能在何时反转方向。如果一种资产在一段时间内于两条趋势线的边界之间交易，那么它就在通道内交易。如果交易价格处于上升趋势，那么它就是上升通道。如果价格在趋势线之间移动，则被称为下降通道。当价格水平移动时，就会形成一个水平通道。


    可以使用趋势线绘制两条线来绘制通道，也可以使用软件中提供的通道工具来绘制通道。


    让我们回顾一下上述发生的情况。


    当比特币处于 `$274`（通道的左下角）时，许多人购买了它。结果是价格上涨到了 `$400`。在 `$274` 买入的投资者想以增加的价格卖出比特币并获利。这导致供应增加而需求减少，使比特币价格跌至
    `$320`。


    在那个点，投资者可能开始购买比特币，预计价格将回升到 `$400`。这次的上涨没有以前那么迅速，但最终达到了 `$452`，然后卖方接管控制权并将价格压回
    `$360`。


    买方和卖方反复交易，价格没有太大涨跌，直到 2016 年 5 月底，此时比特币变得更具吸引力，并在 6 月中旬从 `$450` 快速上涨到 `$750`。


    ## 使用通道做出交易决策


    交易者依赖通道进行交易，假设是价格通常会保持在通道内。如果得到其他信号的确认，交易者在价格触及趋势线的上边界时卖出比特币，在价格触及下边界时买入比特币。


    注意，当价格触及右上通道时，卖出并不是一个明智的决定，因为比特币继续上涨。这是一个优秀的交易者会意识到错误并买回的例子。


    有时，你可能会遇到虚假突破，这是当价格突破通道之外时发生的。在这种情况下，某些投资者可能会立即买入，认为加密货币正在飙升。最好的做法是等待价格在通道外收盘之后再进行交易。很多时候，价格会立即回到通道内部，这种额外的谨慎为了获得确认是值得的。


    ## 成交量分析与价格行为


    成交量分析是交易中一个非常强大的工具。它确定了加密货币资产在特定期间的次数。它还衡量了在特定时间范围内售出或买入的单位。交易者将此工具作为确定资产流动性水平的关键指标。


    该工具还让交易者了解进出市场有多容易。如果利用得当，交易者和投资者可以最大化利润并减少相关风险。


    如果资产成交量较高，那么很容易交易大量或较少量的资产，因为有很多交易者可用。


    ## 交易所的虚假成交量


    遗憾的是，加密货币交易所内部成交量可能是虚假的。由于交易所是自己的生态系统，某些交易所报告的成交量大于其实交易量。他们这样做是为了宣传，因为成交量大的交易所能够更好地匹配买卖双方，从而吸引更多交易者。


    你可以查看加密货币区块链来确定实际交易数量。这仍然无法捕捉实际需求，因为人们在交易所进行买卖。如果交易所需要更多流动性，它们只需要与区块链结算交易。查看几个交易所的图表并比较成交量是有帮助的。


    ## 买入与卖出成交量


    成交量决定了价格趋势的强度，并警告投资者价格波动的弱性。买方需要增加资产成交量来推高价格。如果价格上涨但单位减少，则说明市场缺乏兴趣，这可能导致价格反转。


    另一方面，如果价格没有变化，但发生了不影响价格的大量成交，这被称为“换手”（churn）。如果买方和卖方不匹配，交易的大量资产可能会导致价格下跌或上涨。这表明市场发生了重大的基本面变化。


    让我们回到供需图。当价格上涨时，是因为买方在控制价格波动。市场中更多的买方将价格推得更高。


    ## 如何掌握加密货币投资的艺术


    为了确保你从经验中获得最大收益，并帮助你真正掌握加密的艺术，我们将讨论一些你可以用来掌握加密投资艺术的技巧。

    '
- fmt: '

    Especially when you are getting started, you should only invest funds that you
    do not need. If you think you may be able to invest critical funds in a cryptocurrency
    and hit the jackpot, think again. Investments, especially in cryptocurrencies,
    are something that takes time to accumulate and build money. While you may get
    lucky and make some money in a relatively short period of time, you should not
    expect that this will happen. Generally, when you invest in cryptocurrencies,
    you should expect your investment to stay put for a fairly lengthy amount of time.


    ## Research First, Buy and Trade Later


    It is imperative that you research cryptocurrency before you buy it. You are off
    to a great start by reading this book. Now, you have a strong idea of what the
    most popular forms of cryptocurrency are, how you can acquire them, how you can
    store them, and how you can trade them. That is important. However, you should
    not let it stop here.


    When you are investing in anything, including cryptocurrencies, it is important
    that you invest in them after you have researched them. You do not want to find
    yourself investing in something that you do not fully understand, only to lose
    your investment because you were not clear on what you were doing. It is important
    that you spend time researching the exchange network you are going to use, the
    cryptocurrency form that you want to invest in, and the recent and historical
    market figures for that particular coin.


    A great way to research cryptocurrency comes from basic internet searches, but
    you should go deeper than that too if you want to make an informed decision. There
    are many cryptocurrency forums and groups online that you can get into that will
    connect you with people who have already been trading in cryptocurrencies for
    quite some time. Getting involved in these forums gives you the opportunity to
    communicate with other traders, and helps you find out what is the best move for
    you to make as a beginner. The market is constantly changing, and so are the available
    currencies. For this reason, anything we may be able to recommend to you right
    now in this book may quickly become invalid. That is why we have not recommended
    any specific coin for you to get started with but rather educated you on the most
    popular coins at the time of writing this book.


    In addition to researching before you trade the first time, make sure you continue
    to research before every major trade, and also throughout the duration of your
    investments. As we just discussed, the market is constantly changing, and so is
    the range of available cryptocurrencies. It could change at any given time with
    the introduction of new technology or cryptocurrency, so you want to make sure
    that you stay on top of it and pay attention. The more you research first, the
    more likely you will make wise, educated investment decisions. This can protect
    you from making uneducated decisions that could cost you in the long run and can
    help you get more out of your investments.


    ## Diversify Only If You Understand


    To expand on the importance of researching first, make sure that you only diversify
    when you understand what you are diversifying into. Some people suggest that you
    buy a small amount of every cryptocurrency currently available. This is actually
    a really poor investment choice. Some, you can clearly tell, are not going to
    pay back very much, and if you were to do some research, you would know that.
    Some cryptocurrencies are experimental ventures intended for learning about new
    technology and to see what can be improved. Others are revealed as an opportunity
    for new developers to get in on the cryptocurrency buzz and are not actually developed
    that well at all, making them virtually useless to you. There is no sense in wasting
    your funds on these types of cryptocurrencies when you could simply research them
    and invest in ones that are more likely to succeed.


    ## Unless Circumstances Change, Do Not Take Profits


    Many people feel that you should take the profits of your funds out right away.
    Of course, this is entirely up to you. Most people will say that you should go
    ahead and quickly sell so that you can collect a massive profit. If that is what
    works for you and that is what you are looking for, then, by all means, do that.
    For example, if your income changes and you really need the funds, you can sell
    them and reap your profits. Otherwise, you may choose to remove your funds and
    invest elsewhere. Of course, you may have other personal reasons for wanting to
    remove your profits that may be entirely up to you. However, it is worth noting
    that the longer they sit, the bigger they grow. Rather than dipping into them,
    unless absolutely necessary, it may be a better idea to leave them alone and let
    them continue to accumulate, so that one day when you do actually need them, they
    are available to you.


    ## Cryptocurrency Is Not for Day Traders


    Many modern traders tend to skim the market on a daily basis. They enter in the
    morning with low buy-ins and sell in the evening with high payouts. This strategy
    is completely fine in many marketplaces, but it is not a viable practice in cryptocurrency.
    When it comes to cryptocurrency, you want to hold it for as long as possible.
    Rapidly buying and selling your funds can result in you losing out on valuable
    growth.


    If you want to invest in cryptocurrency, you should look to it as a long-term
    investment instead of something that you can get in and out of in a relatively
    short period of time. While some people choose to take the profits and make massive
    returns in a short period of time, the real prize is in letting it sit and grow
    in value. It is not unheard of for people to buy in with `$1,000` and walk out
    with `$80,000`.


    ## Buy Low, Sell High


    So, naturally, it counts for cryptocurrencies as well. However, because of how
    volatile the cryptocurrency market can be, this may not always be practical. It
    is hard to predict when the peaks and dips will occur as cryptocurrencies can
    often trend on the volatile side at any given time. Instead of worrying about
    buying low and selling high, focus on buying low, holding onto the coins as long
    as you can, and then selling when they are high. You may not be able to predict
    the peaks due to the volatility of the market, so you may want to make sure that
    you are focused on the long-term gains, not the short-term ones. Trying to predict
    the market in a short period of time can become stressful, and this may result
    in you losing out on potentially major gains. Instead, look at the bigger picture
    and pay attention to it. Look beyond 24-hour timespans into weeks, even months
    or years.


    ## Buy Now


    Many people are worried about when to buy into the market. They are unsure about
    when they should buy-in, they do not know if it is the right time, and they want
    to make sure that they get the most back. This is completely normal and natural.
    Obviously, this is likely why you are investing in cryptocurrency: to make a return.
    However, there is no optimal buy-in time. The longer you wait, the higher the
    price goes, and the higher your buy-in price will be.


    Do not wait for the right time or try and predict when a valley will come so that
    you can buy-in. Instead, buy-in right now with only what you can afford. Thenceforth,
    focus on buying more once it hits a low point. That makes it much easier for you
    to actually get started, and to not feel quite so intimidated in the world of
    cryptocurrency. For the first week or two, make it about learning the market.
    Then, once you have done so, you can start paying attention to pulling the right
    moves and getting your low buy-ins and high payouts.


    ### Buy the Rumor, Sell the News

