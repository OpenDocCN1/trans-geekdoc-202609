  trans: '

    区块链内部进行的交易是完全匿名且私密的。传统的金融交易与个人信息挂钩，而比特币交易则挂钩到公共地址。只有使用复杂的加密密码学技术才可能将加密货币交易追踪到特定个人，而普通人是无法获得这种技术的。这意味着你的交易和信息是安全且私密的。某些硬币将这种隐私性提升到了更高的水平，使得即使通过复杂的加密技术也无法追踪交易。我们之前提到过这些硬币，并称它们为隐私币。例如
    `Monero` 和 `Zcash`。


    ### 支付自由

    尼日利亚的抗议活动帮助我们看到了加密货币作为解放工具的巨大潜力。政府封禁并限制了人权活动团的财务，使得这些团体难以对警察对尼日利亚人的大规模屠杀进行抗议。尽管传统银行账户被关闭，这些团体仍然通过加密货币向公众筹集资金。加密确保了你可以随时随随地进行支付或接受支付。没有限制，没有边界，也没有中央机构干预交易。


    ### 保护投资者免受通货膨胀的影响

    津巴布韦的通货膨胀导致该国的年轻一代转向加密货币。大多数面临通货膨胀的国家都是其政府印钞和供应过度货币的结果。对于加密货币来说，通胀通过向市场供应指定数量的硬币来抑制。例如，世界上永远只有
    2100 万个 `Bitcoins`。硬币的稀缺性意味着需求将不断增长，从而提高价格。


    ## 加密货币的缺点


    ### 高波动性

    加密货币具有高波动性。价格波动是正常现象且变化非常快。价格波动使得硬币对投资者来说具有风险，因此让大多数感兴趣的人担心遭受损失。通常，投资者需要一个健全可靠的风险管理计划来投资数字资产。


    ### 监管机构的干预

    由于多个国家尚未对加密货币定义法律合规性，导致了政府干预。政府的介入不必要地阻碍了行业的创新，并可能导致具有革命性的数字资产产品关闭。


    ### 易受黑客攻击

    由于稳健的加密协议，加密货币在设计上是非常安全的。然而，加密货币在交易所进行交易或存储。加密交易所并不十分安全，黑客曾成功渗透它们——例如 `Bitfinex`
    或 `Mt Gox` 攻击事件。虽然交易所试图提高安全标准，但社区对另一次网络攻击仍保持警惕。


    ### 无法退款或取消

    加密货币不允许取消或自动退回错误发送的资金。要求退款的唯一方法是认识接收者并与其协商将硬币还给你。否则，如果钱被发送到了错误的地址，是不可能恢复的。


    ## 如何使用加密货币

    使用加密货币的最佳方式是先将你的加密钱包与借记卡/信用卡连接。2021 年，已有几公司提供加密货币作为支付方式来购买其产品或服务。


    让我们考虑有人从 `Amazon` 购买一台电视。他们可以通过 `Purse` 等第三方加密集成平台支付产品费用。使用 `Purse` 的 `Amazon`
    客户通常会选择他们从 `Amazon` 市场购买的商品。他们复制该产品的 `URL` 并将其粘贴到 `Purse` 的用户界面中。加密平台主要利用想要通过礼品卡获得加密货币的人来处理交易。`Purse`
    还为所有 `Amazon` 产品提供提供 5%的折扣，并提供将此折扣谈判至 15%的选项。


    其他其他零售商，例如 `Overstock` 也接受 `bitcoin` 支付。这家零售巨头通过 `Coinbase API` 接受支付，并允许你从私钱包支付。`Microsoft`
    也允许消费者向账户充值 `Bitcoin` 并在 `Xbox` 和 `Windows` 在线商店中使用资金。电子商务平台也开始了一种趋势，允许企业在其商店中集成
    `bitcoin` 支付。例如，`Shopify` 为开发者和企业提供了让客户通过加密货币支付的选项。


    `Square`、`PayPal` 和 `Stripe` 等支付平台也正在推出加密功能。这将允许用户和商户以加密货币发送或接收支付。


    ## 安全吗？

    加密货币的安全性在技术仍然很新的早期主要是一个问题。今天，创新者拥有了强大的安全标准、监管要求和加密协议，确保了资金的安全。同样，技术已获得了广泛接受；公司已经引入了
    `KYC`（了解您的客户）和 `AML`（反洗钱）要求。使用加密货币也变得越来越容易，硬币正获得个人、企业和机构投资者的主流采用。


    但是，它们安全吗？加密货币是安全的投资或支付手段吗？如今，加密货币不再像最初几年那样容易受到黑客攻击。尽管如此，与数字币相关的风险主要两个。这些风险包括：


    *   可能丢失私钥并随后失去对加密货币的访问权限。

    *   未经授权的人访问你的私钥并盗取你的加密货币。


    `https://www.shutterstock.com/it/image-vector/bitcoin-cryptocurrency-coin-private-key-lock-1933530938`


    ## 高波动性导致硬币贬值

    让我们逐一分析风险因素，从由于波动导致加密货币贬值开始。像所有资产一样，即使在传统金融中，价值损失也是一种常见的风险。所有的投资形式都可能增加或减少价值；你只需要良好的风险管理机制来抑制损失。


    丢失私钥是加密货币常见的风险之一。`private key` 让你对硬币拥有所有。这意味着通过 `private key` 你可以访问、花费或转移你的 `Bitcoins`
    或任何其他代币。私钥丢失会导致失去对加密货币的访问。保护私钥有助于投资或加密资金的安全。这与保护密码和个人身份信息同步。通常，加密货币是保护财务投资的安全方式。


    ## 去中心化加密货币交易所 (DEX) 的优势

    去中心化交易所是加密领域最受欢迎的交易所。考虑到去中心化交易所的所有优势，它们每天变得越来越受欢迎并不意外。即使像 `Coinbase` 和 `Binance`
    这样的大品牌也开始开发它们名称的去中心化版本。去中心化交易所最大的优势包括：


    *   账户信息不会与 `DEX` 交易所运营者共享。因此，它比中心化交易所更能抵抗攻击和操纵。相反，你可以将钱存在账户中，你是唯一拥有账户访问权限的人。

    *   理论上，国家或监管机构无法关闭 `DEX`，因为它们通过区块链网络上的各种节点运行。当然，政府可以通过恶意软件关闭 `DEX`。

