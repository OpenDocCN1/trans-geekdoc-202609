  trans: '

    尽管这个名字源自首次公开募股（IPO）的概念，但代币首次发行（ICO）与其名称相比，除了名称外几乎没有共同之处。`ICOs` 本质上只是加密货币和区块链公司为自己的新想法进行众筹的一种新方式。这是通过发行早期的加密货币来实现的，这些货币（理论上）将是这项新事业的核心，其发行价格（理论上）将远低于其投入运行后的价值。


    作为换取轻而获利的机会，如果一切按计划进行，投资者可以获得入场机会，而相关公司则获得了他们最初创建产品或服务时所需的资金。虽然这在本质上比投资其他成熟的加密货币更具风险，但它实际上只需要该货币经历一次非常强劲的上涨，最终就能证明是盈利的。然而，这远非保证。到为止，`ICO`
    领域的大部分活动都是基于 `Ethereum` 平台的。


    虽然早期的 `ICO` 资金大部分来自中国（中国长期以来证明对区块链和加密货币技术的发展投入巨大），但世界各地的投资者只要价格合适，就都会打开钱包。尽管如此，在你效仿他人之前，记住投资
    `ICO` 自然也会伴随着许多不同的警告。


    其中第一点是，美国证券交易委员会（SEC）已经对几个 `ICOs` 进行了调查，涉及规避监管的行为，包括对公司基本面和可行商业计划的批准。虽然它们执行的标准与
    `IPO` 相同的标准，但该领域极少的监管已经正被规避。此外，许多分析师指出，该领域的最初飙升可能只是自加密货币诞生以来困扰该行业的定价泡沫现象的另一种表现。


    此外，重要的是记住，购买 `ICO` 绝不能为你提供任何通常与 `IPO` 相关的收益。因此，你不会获得公司的任何股份，这意味着你对公司未来的发展没有发言权。由于没有像股票这样的实体资产，你还失去了
    `IPOs` 运行所属的监管和义务，包括信托责任和认证要求。你得到的只是一个新加密货币的冒险交易，这意味着对你来说必须是一个极其划算的交易，才值得承担那种水平的额外风险。


    此外，在处理 `ICO` 时，在许多情况下，你可以预期获得最终产品甚至是原型。事实上，如果你能同时从他们那里获得白皮书、网站和商业计划，你可以认为你的 `ICO`
    投资是非常明光的。因为你通常没有太多可以依据，所以对这类项目的投资绝不要超过你能够承受损失的范围比比任何时候都重要。


    此外，重要的是不要让 `ICO` 期间围绕公司的任何炒作影响你的决定。总而言之，目前将钱放在其他地方可能是更好的选择，至少要等到第一批 `ICOs` 上市，并清楚这些早期投资是否有任何能产生有意义的回报为止。


    ## 投资加密货币


    投资加密货币是一个相当简单的过程。它不像股票市场甚至 `Forex`（外汇）市场那样受到严格监管。这种监管的缺乏赋予了它一种旧西部的氛围，而这正是你可以在没有新兴监管侵入和干扰的情况下赚钱的地方。


    虽然 `Bitcoin` 和 `Ethereum` 被认为是目前你可以投资的一些最大的数字货币，但你还有许多其他选择。选择其中一种数字货币可以对你的获利金额产生巨大影响。例如，`Bitcoin`
    已经存在了一段时间，现在的价值非常高。但选择其他选项，例如下面的选项之一，可以更容易进入市场，因为目前的价值要低得多。


    让我们来看看其他你可以投资的一些主要数字货币以及如何开始投资它们。


    ### 投资比特币


    在过去的几年里，有很多关于 `Bitcoin` 的投诉。原始的 `Bitcoin` 开发时仅有 2100 万个币可用。随着矿工完成他们的代码以保持区块链链的安全，这些硬币将缓慢地加入市场。许多人担心这些币的数量是不够的，特别是考虑到全球有多少人开始使用这些数字货币。`Bitcoin`
    的速度也存在一些问题。`Bitcoin Cash` 旨在作为 `Bitcoin` 的替代方案，旨在解决我们之前讨论的一些问题。


    ### 投资莱币


    你也可以选择投资 `Litecoin`。事实上，这是通过名为 `Coinbase` 的流行交易所网站提供的选项之一。`Litecoin` 是一种点对点货币，使你能够向世界各地的任何人发送即时、低成本的支付。它是完全去中心化且开源的，在这些方面与
    `Bitcoin` 相似。它是顶级数字货币之一，仅次 `Ethereum` 和 `Bitcoin`，通常与 `Ripple` 挂钩。


    那么，`Litecoin` 与 `Bitcoin` 以及其他数字货币有什么不同？首先，`Litecoin` 将使用软件算法来开矿单位。这可以防止个人使用客户计算机来挖掘该货币。此外，`Litecoin`
    的交易时间是所有货币中最快的之一。目前，`Litecoin` 的交易可以在三分钟内完成，而 `Bitcoin` 通常需要十分钟。


    `Litecoin` 是一种像 `Bitcoin` 一样的货币，因此你可以使用许多相同的投资选项来运作。你可以将法币货币兑换到 `Coinbase`，然后使用日内交易、投资公司甚至买持有策略来盈利。由于较低的入门门槛和
    `Litecoin` 的日益增长，在价格大幅上涨之前这是一个很好的选择。


    ### 投资 Dash


    有些人选择使用一种名为 `Dash` 的货币。`Dash` 是一种加密货币，其使命是解决 `Bitcoin` 出现的一些问题。它被称为开源加密货币，于 2014
    年从 `Litecoin` 分离出来。最大的问题是购买 `Dash` 并不容易，这可能会减慢它普及的速度。要购买这些币，你首先需要去 `Coinbase`
    购买一些 `Bitcoin`。然后你可以使用你的 `Bitcoin` 去 `Bitsane` 购买你想要的 `Dash`。在解决该问题之前，`Dash` 可能很难取得突破。


    ### 投资狗狗币


    `Dogecoin` 是一种与 `Bitcoin` 类似的数字货币，于 2013 年 12 月推出。这种货币已经历了熊市和牛市，通常被认为一种小费货币。这意味着你可以用
    `Dogecoin` 给别人小费，而不是使用社交媒体上的点赞和回复。

