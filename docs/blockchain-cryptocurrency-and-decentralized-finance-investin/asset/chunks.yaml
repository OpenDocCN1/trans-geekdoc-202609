    There is a risk that you face when you purchase coins from unknown sellers. Especially
    if you are doing it with fiats. There is a chance that once you pay for it, they
    do not transfer the coin. So that is a risk that you must contend with when you
    find a broker to purchase the coin and when you start trading. There are two strategies
    to overcome this. The first is that you can buy the coin from a reputable seller.
    That way you deposit the funds and the coins are certain to reach your wallet.
    From there you transfer the contents of your wallet to a hosted wallet with the
    trading broker. Then you can make whatever trades you want. That takes out the
    purchase risk. But you still have one more risk when it comes to trading.


    What most people do not understand is that there are a number of trading houses
    out there that operate on the fringe. What they do is take your coin (be it `BTC`,
    `Ethereum`, or `Monero`) and they then make the purchase on the market or you.
    Sometimes, they do not make the actual purchase and they just record the ledger
    as the purchase being made. This happens a lot in all brokerages because one of
    the ways traditional financial brokers work is that they buy popular assets in
    bulk, keep some for themselves and their discretionary accounts, then apportion
    the rest out to other customers who also bought them.


    This risk happens with new brokerages trying to make it in big in short order.
    When it comes to brokerages, you have to be smart. Either choose a brokerage that
    has been around for a while or one that provides you with the safeguards you demand.


    Purchase and counterparty risk are very real in all trading environments, and
    the same applies to a larger degree in online cryptocurrency brokerages. The rule
    of thumb is that if you lose your money to a brokerage that goes upside down,
    you will never get your money. Be comfortable with that fact and place only what
    you need to with them at any one time. If you are going to be a heavy trader,
    then you need to set up the necessary infrastructure to cold-store the coins that
    are not in play. And since you should only be investing half of your coins (at
    the most) at any one time, or investing at two different brokerages who aren’t
    related, then it becomes worth your time to set up an off-line storage that is
    air-gapped and secured.


    # CHAPTER 6: How to Read the Cryptocurrency Market


    ![How to Read Crypto Trading Charts Like A Pro \[Beginners Guide\]](Images/image00125.jpeg)


    Investing in cryptocurrency can be confusing at first because while it might appear
    similar to buying stocks from afar, the process is actually quite different. When
    you buy into a cryptocurrency rather than buying shares, you are buying digital
    tokens from a third party in exchange for either a fiat currency or your own digital
    tokens. To further complicate matters, various types of cryptocurrencies have
    differing transactional purposes, and even those that don’t operate as a currency
    in the traditional sense are still invested in for purely speculative purposes.


    What’s more, while the amount of conversation around the topic of cryptocurrency
    makes it seem as though everyone is buying into one type or another, the reality
    is that only a very small portion of the population is currently using them in
    any meaningful way. What this means for you is that you still have the opportunity
    to get in on the ground floor of cryptocurrency as a whole. Sure, there are those
    out there that have already topped $1,000 or, even, $10,000 per unit, but these
    are the exception, not the rule.


    When this usage rate is compared to their market cap, and the amount of buzz currently
    surrounding them, it paints a future for cryptocurrency as a whole that is exceedingly
    bright. As such, while the overall level of volatility for cryptocurrency as a
    whole remains high, the projected volatility for the future is much lower. That
    is, of course, until the point of mass saturation hits. When more people are using
    cryptocurrency than are not, then the pricing bubble that has infused the market
    since its inception will burst for the last time.


    When this occurs, it is highly likely that a vast majority of the cryptocurrencies
    on the market today will fold in something akin to what occurred during the dot-com
    crash of the late 1990s. It is advisable to choose a cryptocurrency that has a
    demonstrable value as it is far more likely to make it through the coming collapse
    than one that is based on nothing greater than speculative value.


    ## Choose a Cryptocurrency and an Exchange


    [https://www.shutterstock.com/it/image-vector/dashboard-forex-market-cryptocurrency-app-online-1506130973](https://www.shutterstock.com/it/image-vector/dashboard-forex-market-cryptocurrency-app-online-1506130973)


    Before you can do anything else, you will want to decide which cryptocurrency
    will make sense for you, and to do that, you will want to first consider just
    what each cryptocurrency brings to the table. If you only have $1,000 to invest,
    for example, but nevertheless want to strike while the iron’s hot, then buying
    one `ether` is likely not the best use of your money. Instead, it would make more
    sense to start off with around 500 units of `Ripple` or 1,500 units of `Lumens`,
    a smaller cryptocurrency aimed at third world countries that jumped from $0.02
    to $.62 per unit between October and December of 2017.


    In the previous example, `ether`, `Ripple`, and `Lumens` all have a clear and
    compelling real-world usage case that gives them value outside of what speculators
    currently believe they are worth. `Ether` is used to fuel `Smart Contract` transactions
    and applications running on the `Ethereum` platform. `Ripple` is used to facilitate
    transactions between businesses and `Lumens` that are targeted specifically at
    a facet of the market that has, up until this point, limited access to traditional
    banking services that most of the world takes for granted. Choosing a cryptocurrency
    that has a well-defined reason for being available is crucial to your long-term
    investing success. Remember, the more useful, the better.


    With a cryptocurrency or two in mind, the next thing you will want to do is to
    consider the various exchanges that offer the cryptocurrency you are interested
    in. If you plan on making numerous, smaller transactions, then you will want to
    find an exchange that offers transactions rates based on a percentage of what
    the total of the transaction is. If you will be making fewer, larger transactions,
    then you will want to find an exchange that offers flat rates.


    When investing in cryptocurrency, it is also important to take a look at the historical
    pricing data that is available to ensure that you have a general idea of the type
    of patterns it moves in on a regular basis. Every cryptocurrency has its own internal
    flow, and understanding what it is like for the one you choose is key to making
    the right decisions when the price drops suddenly. If you plan on investing in
    the long-term, then this type of dip can be expected from time to time, and is,
    and by large, going to be nothing to worry about. From time to time, however,
    it could merely represent the tip of a much more precipitous drop, which is what
    you need to be prepared to identify because no investment remains the right choice
    forever.


    ## ICOs


    Another method of investing in cryptocurrency that is becoming increasingly popular
    these days is what is known as ICO. In fact, 2017 saw more than a billion dollars
    raised in this fashion, with notable standouts `Bancor` and `Status.im` bringing
    in $150 million and $75 million in their first 24 hours on the market respectively.

