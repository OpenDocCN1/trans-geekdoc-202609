    ### Blockchain and Medicine


    It helps manage data and automate processes in an industry where precision is
    a matter of life and death. In the US, a medical error is one of the most common
    causes of death. Storing records on a blockchain would reduce redundancies and
    errors that lead to those deaths. Blockchain also enables greater precision in
    pharmaceutical medication, which would help patients prevent the diversion of
