    收藏品，如数字绘画、体育门票和版权，占据了当前 NFT 需求的很大比例。`NBA Top Shot` 是一个以数字卡形式获取非同质化代币 NBA 体验的，可能是最受赞誉的地方。其中一些卡片在拍卖中拍出了高价。Twitter
    首席执行官 Jack Dorsey 最近发布了一个指向他第一条推文代币化副本的链接，他在推文中写道：“正在设置我的 Twitter。”这首条推文的 NFT
    版本拍卖价已达到 250 万美元。


    ## 理解 NFT


    加密货币与物理货币类似，具有同质化性，这意味着它们可以相互替代或交换。例如，英国的 `Bitcoin` 价值与美国的另一个 `Bitcoin` 相同。单单位的
    `Ether` 通常等同于世界上任何地方的相同单位 `Ether`。由于其同质化性，加密货币是作为数字世界稳定交换媒介的理想选择。


    NFT 与加密货币一样，拥有所有权信息，使得在所有者之间识别和传递代币变得简单。在 NFT 中，持有者还可以添加与资产相关的元数据或特性。例如，公平交换代币可以用于描绘咖啡豆。艺术家还可以在元数据中用个人签名标记他们的数字作品。


    `Cryptokitties` 可能是 NFT 最著名的应用。`Cryptokitties` 于 2017 年 11 月推出，是 `Ethereum` 区块链上带有唯一标识的数字猫。每只猫都是独一无二的，并具有
    `ether` 的货币价值。它们之间相互繁殖，产生比父母具有特定特征和价值的新后。在推出后的几周内，加密猫聚集了大量粉丝，他们在购买、喂养和照顾这些猫上投入了超过
    2000 万美元的 `ether`。一些信徒在该项目上投入了超过 10 万美元。


    尽管加密猫的首个用例看起来微不足道，但随后的用例具有更重大的商业影响。例如，NFT 已应用于私募和房地产投资。将从活动门票到版权的各种形式 NFT 的托管能力整合到单一金融交易中，是允许合同中使用多种形式代币的结果之一。


    ## 非同质化代币的重要性


    业务效率可能是 NFT 最明显的优势。将有形资产转换为虚拟资产可以简化程序并消除中间人。在区块链上，NFT 反映了虚拟或物理艺术品，消除了对代理的需求，并允许艺术家直接与其粉丝群体互动。它们还可以帮助企业发展其流程。例如，啤酒瓶的
    NFT 将使供应链中的各种参与者更容易与其通信，并在过程中监控其真实性、开发和销售情况。咨询公司安永永道已经为其其中一个客户创建了类似的解决方案。


    非同质化代币在管理身份方面也同样出色。看看物理护照的案例，它们在任何出入境点都必须出。通过将每个护照转换为 `NFTs`（每份护照都有自己的特殊识别特征），可以简化国家的出入境系统。NFT
    还可以用于数字世界中的身份管理，扩展了这一用例。


    新机会和投资形式的出现是 NFT 最有前景的可能性。想象一块土地被分成几部分，每部分都有自己的特征和属性类型。其中一个区域可能位于海滩附近，另一个是购物中心，另一个是住宅区。每块土地都是独特的，价值独立评估，并根据其特征由
    NFT 描述。通过将必要的元数据集成到每个特定的 NFT 中，房地产交易可以变得简化，这是一个复杂且繁琐的过程。


    # 第 5 章：Defi（去中心化金融）


    ![DeFi Crypto Growth 2019 - Decentralized Finance Crypto Industry Growth](img/image00124.jpeg)


    ## 什么是 DeFi？


    人们可以很容易地认为，`Ethereum` 的流行是因为它开启并促进了去中心化金融（DeFi）。加密货币行业正见证一场名为去中心化金融（DeFi）的新运动的力量。它是区块链上若干种旨在颠覆金融中间人的金融应用的通用术语。DeFi
    的独特之处在于，它成功地大幅扩展了分布式账本技术的使用，从最初简单的资金转账（通过 `Bitcoin` 和一些第一代加密货币）扩展到更复杂的金融用例。


    去中心化金融涉及利用 `Smart Contracts`（智能合约）和区块链技术提供多种金融服务，而不是使用律师和银行作为中间人。


    专家认为，DeFi 将帮助以无许可的方式重建银行系统。在传统的无抵押贷款中，贷人和借款人在法律上都必须了解对方的身份。法律要求债贷人评估借款人的还债能力。然而，此类要求在
    DeFi 中并不存在；相反，它完全关乎保护隐私和相互信任。监管机构目前面临着在抑制创新与无法保护人们免受此类投资可能风险之间取得微妙平衡的挑战。例如，这是一个不受监管的空间，人们最终可能会损失金钱。


    www.shutterstock.com/it/image-photo/defi-decentralized-finance-on-dark-blue-1942079839


    ## DeFi 的成功通过智能合约实现


    毫无疑问，`Smart Contracts` 具备颠覆电信、音乐、银行、电影、保险、教育等许多行业的实力。“智能合约”一词在加密领域被通用，用于描述一种可以促进财产、金钱或其他贵物品交换的计算机代码。


    只要相关方符合预定义的规则，协议将自动执行。这无疑是去中心化自动化最智能的形式。由于它们运行在区块链上，`Smart Contracts` 按照其程序设定的方式运行，不存在停机、欺诈、审查或第三方干预的可能性。


    事实是，所有的区块链都可以处理代码；然而，其中许多仍然受到限制，这正是 `Ethereum` 的不同之处。`Ethereum` 平台不是提供有限的操作，而是为开发者提供了构建任何应用程序的资源。


    以下是关于 `Smart Contracts` 能做什么的简单解释：个人可以交换股票、金钱、财产和其他资产，而不需要聘请律师。这显著减少了在此类交易期间经常产生的昂贵第三方成本。这是许多人认为
    `Ethereum` 优于 `Bitcoin` 的原因之一。


    ## 智能合约是如何工作的？


    它始于预定义合同。在此时，所有的合作条款都由所有利益相关者建立。这可以是用于支付的特定货币、可变利率或汇率。此外，执行条款在预定义合同时设定，这可以是日期、时间或若干其他标准。


    *   事件：这是在事件（如接收到的信息和交易的启动）立即触发合约实施的地方。


    *   执行与交付：它们决定了价值的移动。它还根据设定条件的履行情况决定合同条款。


