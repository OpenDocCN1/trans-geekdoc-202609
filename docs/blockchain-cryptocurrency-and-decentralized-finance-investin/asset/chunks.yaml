    Part of picking the exchange is a personal preference. There are features and
    user interfaces that you might find more appealing in one exchange that are lacking
    in others. Another part of picking an exchange has to do with security. Since
    regulations have only begun to tighten around exchanges, you''ll want to make
    sure any platform you use has passed the most up-to-date regulatory reviews. The
    last consideration in your exchange selection should be whether or not you can
    get the best price for your cryptos. Since prices can differ based on the exchange
    you use, it''s worth monitoring multiple exchanges when you begin to think about
    selling your coins.


    ## Check Their Insurance Policy


    What you need from an exchange, more than anything else, is the knowledge that
    if you use it as a regular way to buy and trade cryptos, you won''t lose all your
    investment if it''s hacked. However, because of the lack of regulation surrounding
    crypto exchanges, there''s still no such promise that an exchange will pay you
    back if it suffers a breach.


    Whether or not an exchange will pay back what''s lost will depend on the exchange
    and how much the hackers stole. It''s a risk, no matter what exchange you choose,
    which is also why it''s good to use various ways to store your coins, from multiple
    wallets to different exchanges; that way, not all your crypto eggs are in one
    proverbial basket.


    ## Stay Local


    It is relatively easy advice to say stay within an exchange that''s located in
    your country. Since there are plenty to choose from, you can easily find an American-based
    exchange that matches your aesthetic needs, as well as quell some of your security
    concerns. The same goes for someone living in Japan, South Korea, or Hong Kong.
    Since these locales have a high stake in the crypto game, they have local exchanges
    that have done the due diligence that''s expected at this point in the crypto
    lifecycle and will adjust to any changing regulations.


    If a hack occurs, you''re potentially dealing with language barriers. Plus, you''ll
    have to become much more familiar with the Japanese government and judicial system
    in order to try and collect.


    ## Monitoring Other Exchanges


    Since there are hundreds of exchanges across the world, it creates an investing
    arbitrageur''s dream in that there''s plenty of ways that one exchange could price
    one coin significantly lower or higher than others. It''s an issue that exchanges
    have tried to dampen, in an effort to create a unified price for each Crypto.
    Yet, it hasn''t completely been achieved. The price differences can become more
    dramatic since there are certain altcoins embraced by one country, while other
    countries aren''t as enthused by the same names.


    While exchanges have taken steps to reduce the opportunities available through
    arbitrage, it''s good to keep an eye on at least one South Korean, Japanese, and
    Hong Kong exchange, as you''ll be able to start to notice what altcoins the local
    areas view more attractively than in the US.


    If you decide to go the arbitrage route, be sure the price differences make up
    for any fees you might pay, either to process the payment on the blockchain or
    to pay the exchange for the service. If you do try to arbitrage, you''ll probably
    want to have a number of different coins on different exchanges. It can take some
    time (up to a few days) to transfer coins between exchanges, which means price
    fluctuations could flush out the opportunity. Finally, don''t forget to calculate
    the tax implications of all the buying and selling, as it will also play a role
    in your returns.


    ## Check That It''s Registered


    If you''re in the US and using predominantly a US exchange, be sure to check that
    it''s registered with the Securities and Exchange Commission (SEC), a federal
    agency that''s empowered to monitor investing markets in order to protect investors.
    Since the SEC has cracked down on exchanges, the reputable ones will have registered
    with the agency.


    ## If You Don''t Know, Ask


    There are so many forums available to crypto investors, both for new investors
    and veterans in the space. If you''re unsure about a certain exchange, ask a forum
    to get a sense of the reputation that the exchange has amongst the crypto community.
    While it''s not fail-proof, there''s a sense of relief if you''re going with an
    exchange that the community overwhelmingly backs.


    ## Types of Altcoins


    Although the primary function of the altcoins is to serve as means of exchange
    (as cryptocurrencies) they have diverse functions apart from their transactional
    value. The thousands of altcoins in the market can further be categorized depending
    on the function they perform. Here are the different types of altcoins:


    ### Stablecoins


    Two serious challenges facing Bitcoin right now are the issues of scalability
    and volatility. The primary reason that stablecoins were created was to reduce
    volatility. Most merchants and businesses are reluctant to accept crypto payments
    because they are extremely volatile. To solve this problem, stablecoins emerged
    to provide stability in price by tying the value of the digital currency to existing
    fiat currencies. Among the most common fiat currencies that stablecoins have used
    to back their currency are USD.


    ### Mining-Based Altcoins


    The name already explains what they are. The primary source of generating these
    sets of altcoins is through a mining process that involves solving blocks. This
    set of coins is more similar to Bitcoin, and a look at the top coins as of September
    2020 shows that most altcoins belong to this class. For instance, `Litecoin` is
    an example of a mining-based altcoin.


    ### Security Tokens


    These altcoins are usually launched in an ICO and are linked to a business. They
    share many similarities with traditional stocks and offer holders some dividends,
    such as ownership in a business or a pay-out. When you look at the more 7,000
    cryptocurrencies on the market, you will discover that they all can be classified
    as at least one of these types of altcoins. For instance, `Filecoin` is a utility
    token.

