    ## Ethereum Wallet


    There are many Ethereum wallets circulating in the market currently. Selecting
    the right wallet for your Ethereum tokens will come down to a few other factors
    namely:

    - Type of storage you will need.

    - Do you transact frequently?

    - The platform you intend to access the wallet from (desktop, smartphone, web,
    etc.)


    ### Types of Ethereum Wallets


    It is advisable to choose the method that works for you best from the different
    types of wallets listed below:

    - Software wallets: easily accessible and cheap to obtain. Best for people who
    transact regularly.

    - Hardware wallets: used to store Ethereum offline using physical chips. Examples
    include `Ledger Nano`.

    - Paper wallets: these are papers with private keys printed on them.


    ### Ethereum Hot Wallet


    A hot wallet refers to a wallet that requires an internet connection. Ether tokens
    stored in a hot wallet are easily accessible from any place on the globe. Apart
    from being convenient, hot wallets are not the safest out there and they can be
    breached by malicious actors if they obtain your login details. They are free
    of charge and anyone can access them from anywhere in the world. Some of the best
    Ethereum wallets include:

    - `Metamask`.

    - `Exodus`.

    - `Trust wallet`.

    - `Mist`.


    ### Ethereum Cold Wallet


    These are physical devices used to store Ethereum offline. One of the key benefits
    provided of using cold wallets is security. They are offline hence they are not
    susceptible to hackers. However, cold wallets tend to be expensive compared to
    hot wallets, which are free of charge. Besides, they also support a few assets
    compared to hot wallets. Some of the best cold wallets in the market include these:

    - `Ledger nano`

    - `Trezor`


    ### Ethereum Broker


    An Ethereum broker can be described as a digital platform that functions as a
    middleman between buyers and sellers in the market. There are two major types
    of Ethereum brokers: uncomplicated platforms that the buying and selling of ETH
    tokens at a fixed price, and the more sophisticated platforms that allow traders
    to buy and sell digital assets in real-time at the prevailing market price.


    The key function of a broker is to essentially match buyers and sellers in the
    market. For instance, if you have a certain amount of cash and you want to buy
    ETH tokens, the broker finds a seller willing to sell at the price and complete
    the transaction. In some cases, the broker acts as both the buyer and the seller
    depending on the trading platform.


    Complex brokerage platforms employ the concept of CFD (contract for difference)
    trading. Trading `ETH` CFDs allows you to open and close instantly and apply leveraged
    trading. However, it''s worth noting that when you trade `ETH` CFDs, you don’t
    actually own the actual Ethereum tokens but speculating on the underlying value
    of Ethereum as it swings.


    ### What Is the Difference Between an Exchange and a Broker?


    An Ethereum broker and an Ethereum exchange are confusing to most people, especially
    after the incorporation of broker features such as margin trading. The key difference
    between the two is how they operate. An Ethereum broker defines the price and
    commissions they are willing to sell Ethereum. They can either be the holders
    of the `ETH` tokens, or they have partnered with other platforms or brokers to
    ensure there is sufficient supply.


    On the other hand, an Ethereum exchange involves many traders simultaneously buying
    and selling Ethereum pairs at the prevailing market price. However, an order is
    not complete until the seller agrees to the transaction.


    Both brokerages and exchange platforms have existed in the traditional financial-.
    (Wait, "financial system").


