    There must be at least two highs or lows to have a valid trend line (3 points
    are preferred). The trend line is further validated if it intersects the price
    line a 3rd time. Bitcoin is so volatile, that it may be hard to find the 3rd point
    validation. Larger time frames result in better trend lines. Start with weekly
    or daily charts, and then check the smaller time frames to confirm.


    Sometimes, trend lines cut through the low or high portion of a candle. Try not
    to cut through the body of the candle. If the trend line does not fit without
    being forced, it probably is not a valid trend.


    ## How to Draw Trend Lines


    Open the TradingView website, and then choose `BTC/USD` charts. This displays
    the real-time trending price for Bitcoin in US Dollars. You can customize the
    chart and draw trend lines on it. To do so, click on the full-featured chart icon,
    to open advanced chart tools to customize your chart. You can change the chart
    trend to be daily, weekly, or monthly, and then draw trend lines from the available
    tools. Select the `Trend Line Tool` on the left side of the chart.


    ## Trading Channels


    A channel consists of a pair of straight lines, with one line drawn at the top
    of the uptrend line, and the other line drawn in parallel at the bottom, linking
    the troughs of a price series chart.


    Channels are used in visualizing data to determine when to buy and sell cryptocurrency
    assets. The top and bottom lines are drawn to show both the support and resistance
    levels on the trade chart.


    Trading channels show where prices will likely reverse direction. If an asset
    trades between the boundaries of two trend lines for a certain period, then it
    is trading within the channel. If the trading price is on an uptrend, then it
    is an ascending channel. If the price moves downward between the trend lines,
    it is referred to as a descending channel. When the price moves in horizontally,
    then a horizontal channel is created.


    The channel can be drawn by either using the trend lines to draw two lines or
    by using channel tools available in the software.


    Let us walk through what happened above.


    When Bitcoin was at `$274` (the bottom left corner of the channel), many people
    bought it. As a result, the price increased to `$400`. Investors who bought at
    `$274` wanted to sell their Bitcoin at the increased price and take their profits.
    This led to increased supply and less demand, which dropped the Bitcoin price
    to `$320`.


    At that point, investors may have started buying Bitcoin, expecting that the price
    would increase back to `$400`. The rise was not as rapid this time, but it eventually
    hit `$452`, before the sellers took control and pushed the price back down to
    `$360`.


    The buyers and sellers traded back and forth without much rise or fall in price,
    until late May 2016 when Bitcoin became more attractive and rose quite fast from
    `$450` to `$750` in mid-June.


    ## Using Channels to Make Trading Decisions


    Traders rely on the channel for trading, under the assumption that the price will
    typically remain enclosed within the channel. If confirmed by other signals, a
    trader sells their Bitcoin when the price touches the upper boundary of the trend
    line or buys Bitcoin when the price touches the lower boundary.


    Note how selling was not a good decision when the price touched the upper right
    channel, because Bitcoin continued to rise. This is an example of where a good
    trader would realize the mistake and buy back in.


    Sometimes, you may have a false breakout, which occurs when the price breaks outside
    the channel. In such a case, some investors may immediately buy thinking the cryptocurrency
    is rocketing upwards. It is best to wait until it closes outside the channel before
    you trade. Many times, the price will immediately return inside the channel, and
    the extra caution is worth the confirmation.


    ## Volume Analysis and Price Action


    Volume analysis is a very powerful tool in trading. It determines the number of
    times a cryptocurrency asset has been traded for a certain period. It also measures
    how many units are sold or bought, within a specific timeframe. Traders use this
    tool as the key metric in determining the asset liquidity level.


    The tool also enables traders to know how easy it is to enter and exit the market.
    If well utilized, traders and investors can maximize profits as well as reduce
    the risks involved.


    If the assets have a higher volume, then it will be easy to trade either a large
    number or a smaller quantity of assets, since there are several traders available.


    ## False Volume on Exchanges


    Unfortunately, the volume can be falsely indicated inside a cryptocurrency exchange.
    Since the exchange is its own ecosystem, some exchanges report more volume than
    it is actually trading. They do this for publicity since an exchange with a lot
    of volumes would be better at matching buyers and sellers and, thus, would attract
    more traders.


    You could look at the cryptocurrency blockchain to determine the number of actual
    transactions. This still does not capture the actual demand because people are
    buying and selling on the exchanges. The exchange only needs to settle the transactions
    with the blockchain, if it needs more liquidity. It is helpful to look at the
    charts for several exchanges and compare the volume.


    ## Buying and Selling Volume


    Volume determines the strength of price trends and warns investors about the weakness
    of price movements. Buyers need increased asset volume to push the prices higher.
    If there is an increase in the price but a reduced number of units, then there
    is a lack of market interest that is likely to lead to a price reversal.


    On the other hand, if the price does not change, but large volumes that do not
    affect price are have occurred, this is called churn. Large volumes of assets
    traded may result in price declines or gains if the buyers and sellers are not
    evenly matched. This indicates a major fundamental change in the market.


    Let us go back to the supply-demand graph. When prices rise, this is because buyers
    are controlling the price movement. More buyers in the market push the prices
    higher.


    ## How to Master the Art of Cryptocurrency Investing


    To make sure you get the most out of your experience, and to help you truly master
    the art of trading in cryptocurrency, we are going to discuss some tips that you
    can use to master the art of investing in cryptocurrency. Using these tips will
    ensure that you do not make any fatal beginner mistakes and that you protect your
    assets and maximize the returns you get from the get-go.


    It is a good idea to review these tips before you begin investing to ensure that
    you know as much as you can before you get started. Although it is a fairly simple
    concept and you can get started relatively easily, it is important that you know
    as much as you can before you invest any of your cash into these currencies. If
    you do it right, you are likely to make a great return. Plus, it is always proper
    investment etiquette to make sure that you effectively research any investment
    before you actually invest in it. This way, you do not make any uneducated decisions
    that could result in you losing out on cash!


    ### Buy With Funds You Do Not Need

