- fmt: '

    Collectibles, like digital paintings, sports tickets, and copyright, account for
    a large portion of the current demand for NFTs. `NBA Top Shot`, a space to acquire
    Non-Fungible tokenized NBA experiences in the form of digital cards, is probably
    the most lauded place. A few of such cards have fetched vast amounts of money
    in auctions. Jack Dorsey, the CEO of Twitter, recently announced a link to a tokenized
    copy of his first tweet, in which he wrote, “just setting up my Twitter.” The
    auction for the NFT edition of the very first tweet has already reached $2.5 million.


    ## Understanding NFTs


    Cryptocurrencies, similar to physical currency, are fungible, meaning they can
    be substituted or swapped for one another. A `Bitcoin` in the UK, for instance,
    is still worth the same as another `Bitcoin` in the US. A single unit of `Ether`
    is often equivalent to the same unit of `Ether` anywhere in the world. Cryptocurrencies
    are ideal for use as a stable means of exchange in the digital world because of
    their fungibility.


    NFTs, like Cryptocurrencies, have ownership information that makes it simple to
    identify and pass tokens among owners. In NFTs, holders may also add metadata
    or features related to the asset. Fair exchange tokens, for instance, can be used
    to depict coffee beans. Artists may also mark their digital work in the metadata
    with their personal signature.


    `Cryptokitties` is probably the most well-known application of NFTs. `Cryptokitties`,
    which were first introduced in November 2017, are digital versions of cats with
    unique identifiers on the `Ethereum` blockchain. Every kitty is one-of-a-kind
    and has a monetary value in `ether`. They multiply amongst themselves, producing
    new youngsters with specific features and values than their parents. In the space
    of few weeks of their introduction, crypto kitties had amassed a fan base that
    had invested over $20 million in the `ether` on buying, feeding, and caring for
    them. Some devotees invested over $100,000 on the project.


    Although the first use case for crypto kitties may seem insignificant, subsequent
    ones have much more significant business consequences. For instance, NFTs have
    been used in private equity and real estate investments. The capacity to supply
    escrow for various forms of NFTs, from events tickets to copyright, into a single
    financial transaction is one of the consequences of allowing several forms of
    tokens in a contract.


    ## Importance of Non-Fungible Tokens


    Business quality is perhaps the most apparent advantage of NFTs. Converting a
    tangible asset to a virtual asset simplifies procedures and eliminates mediators.
    On a blockchain, NFTs reflect virtual or physical artwork, removing the need for
    representatives and allowing artists to interact directly with their fan base.
    They can also help businesses develop their processes. An NFT for a beer bottle,
    for instance, would make it easier for various players in the supply chain to
    communicate with it and monitor its authenticity, development, and selling during
    the process. Ernst & Young, a consulting company, has already created a similar
    solution for one of its customers.


    Non-fungible tokens are equally great for managing identities. Look at the case
    of physical passports, which must be shown at any point of entry and exit. It
    is possible to simplify the entry and exit systems for countries by transforming
    each passport into `NFTs`, each with its own special identifying features. NFTs
    may also be used for identity management in the digital world, expanding on this
    use case.


    The emergence of new opportunities and forms of investment is the most promising
    possibility for NFTs. Imagine a tract of land that has been divided into several
    parts, each with its own set of features and property types. One division might
    be located near a beach, while another is a shopping center, and another is a
    residential neighborhood. Each piece of land is special, valued separately, and
    depicted by an NFT based on its features. By integrating necessary metadata into
    each specific NFT, real estate trading can be streamlined, which is a complicated
    and cumbersome process.


    # CHAPTER 5: Defi (Decentralized Finance)


    ![DeFi Crypto Growth 2019 - Decentralized Finance Crypto Industry Growth](Images/image00124.jpeg)


    ## What Is Defi?


    One could easily argue that the popularity of `Ethereum` is because it ushered
    in and facilitates decentralized finance (DeFi). The cryptocurrency industry is
    witnessing the force of a new movement known as Decentralized Finance (DeFi).
    It is the general term for several financial applications in the blockchain focused
    on disrupting financial intermediaries. DeFi is unique because it has managed
    to significantly expand the use of distributed ledger technology from its first
    simple use for money transfer (by `Bitcoin` and some first-generation cryptos)
    to more complex financial use cases.


    Decentralized finance has to do with financial services leveraging `Smart Contracts`
    and blockchain technology to render several financial services instead of using
    lawyers and banks as intermediaries.


    Experts are of the view that DeFi will help reconstruct the banking system in
    a permissionless way. In traditional unsecured lending, both lenders and borrowers
    are legally required to know each other''s identity. There is a legal requirement
    that the lender assesses the ability of the borrower to repay the debt. Well,
    such requirements do not exist in DeFi; instead, it''s all about preserving privacy
    and mutual trust. Regulators are currently faced with striking a delicate balance
    between stifling innovation and being unable to protect people from the possible
    risks of such investments. For instance, this is an unregulated space, and people
    may end up losing their money.


    www.shutterstock.com/it/image-photo/defi-decentralized-finance-on-dark-blue-1942079839


    ## The Success of Defi Is Achieved by Smart Contracts


    There is no doubt that `Smart Contracts` have what it takes to disrupt industries
    like telecommunication, music, banking, film, insurance, education, and many others.
    The phrase “smart contract” is commonly used in the crypto space to describe a
    computer code that can facilitate the exchange of property, money, or other valuables.


    Anytime the parties involved meet the predefined rules, the agreement will be
    automatically enforced. This is undoubtedly the smartest form of decentralized
    automation. Since they run on the blockchain, `Smart Contracts` operate as they''re
    programmed to, and there is no possibility of downtime, fraud, censorship, or
    interference from a third party.


    The truth is that all blockchains can process code; however, a good number of
    them are still limited, and this is where `Ethereum` differs. Instead of providing
    limited operations, the `Ethereum` platform offers developers the resources to
    build any application.


    Here is a simple explanation of what `Smart Contracts` can do: individuals can
    exchange stock, money, property, and other assets without needing to engage the
    services of a lawyer. This significantly reduces the expensive third-party costs
    that are often incurred during such transactions. This is one of the reasons many
    people believe that `Ethereum` is superior to `Bitcoin`.


    ## How Do Smart Contracts Work?


    It starts with predefining the contract. At this point, all the terms of engagement
    are established by all stakeholders. This could be the specific currency used
    for making payments, the variable interest rate, or the currency rate. Also, the
    terms for execution are set while predefining the contract, and this could be
    the date, time, or several other criteria.


    *   Events: this is where events (like the information received and the kick-off
    of the transaction) instantly trigger the implementation of the contract.


    *   Execution and delivery: they determine the movement of value. It also determines
    the terms of the contract based on the fulfillment of the set conditions

