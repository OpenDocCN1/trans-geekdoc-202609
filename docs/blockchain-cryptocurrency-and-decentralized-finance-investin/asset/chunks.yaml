  trans: '


    得益于 `Smart Contracts`，区块链可以实现整个过程。一个 `Smart Contract` 的条款可以与智能锁关联。一旦访客靠近锁具，他们就可以出示编码在
    `Smart Contract` 中的电电子密钥。如果密钥匹配，门就会解锁，访客即可完成自助入住。


    通过这种方式，一个 `Smart Contract` 就可以管理整个租赁流程。所有者可以远程管理他们的物业，并知道自己的物业是安全的，且无法被任何操纵。这减少了物业管理公司对业主可收取的费用和利润的影响。


    ## 开放网络公司


    正如 `dAirbnb` 平台的案例所示，由同伴驱动的网络可以完全改变组织的性质。未来的组织不再假设一种中心化的形态，而是简单地转变为一个互联的应用网络。你刚刚看到的
    `dAirbnb` 平台使用了一个身份验证应用和一个保险应用。这些实体之间是相互独立的，不必由同一家公司所有。


    组织结构的去中心化还会产生其他影响。首先，在市场中竞争所需的资金量大幅减少。如果有人想创建一个比 `dAirbnb` 功能更强大的平台，他们需要做的只是与生态系统中的应用建立连接，并尽所能开发自己的应用。


    鉴于区块链的开源性质，它为所有人开启了竞争机会，大公司无法通过买买获得领先。例如，`Google` 目前会购买任何在某种远程度上能开发出比他们更好的搜索算法的公司。这是为了遏制竞争。大多数所有者选择卖给
    `Google`，因为与一个实际上控制着互联网的万亿美元巨头作对，是一个注定会失败的前景。


    类似的模式在社交媒体网络和技术领域也在上演。例如，`Apple` 以安全为名将其应用商店与其他网络完全隔离开，并将开发者圈禁在它的要求之下。互联网本应是一个开放的市场，供所有人自由竞争，但大公司已经占据了它们的一角阵地，并且永远不会放手。


    得益于去中心化，区块链为市场带来了更高的效率。公司可以像之前描述那样降低内部搜索成本，这导致了新型业务模式的产生。以下是我们在未来可能看到的一些投机项目。


    ### 准时制采购


    准时 `JIT` 交付为制造企业提供了效率与成本控制的最佳结合。目前，建立 `JIT` 采购需要大量资源，只有大公司才能负担得起。`JIT` 的核心思想是原材料在生产需要时正好到达。这减少了存储成本，并使货运运输更加高效。


    为了确保这一点发生，公司必须建立自己的大型供应商数据库和交货跟踪系统。这允许他们监控每一个动作并预测其系统的效率。讽刺的是，增加控制并没有并没有给他们带来优势，因为
    `JIT` 的建立比以往任何时候都困难。


    区块链通过使整个供应商网络透明化，极大地简化了 `JIT`。此外，每个供应商的记录都可以被时验证，并且对系统有着完全的信任。因此，较小的组织可以创建更好的流程，并进一步减少对流动资金的需求。结果是为所有人带来了更高的效率、更低的成本和更佳的商业实践。


    ### 自主代理


    当谈到公司时，我们想的是拥有员工、办公室、服务器等的法人。如果公司可以通过一个在去中心化网络中漫游的智能代理来实现完全自动化呢？这个代理可以进行有利于组织的交易，更新自身以应对竞争，并整合新产品以更好地服务客户。


    `Smart Contracts` 不仅仅是几行代码。它们可以被教导字面上的任何事情。目前，技术限制了我们将其自动化到几个简单任务之外的能力。很多自动化是以对现有条件进行验证的形式出现的。然而，没有任何东西能阻止
    `Smart Contracts` 与一个更大的生态系统进行学习和交互。


    例如，`Amazon` 一段时间以核心业务一直是其 `AWS` 或云计算业务。该公司允许其他组织租赁服务器空间，消除了对物理服务器基础设施的需求。如果 `AWS`
    被开放区块链上的一个 `Smart Contract` 取代呢？


    该合同将在网络中寻找同伴计算机，并评估可用空闲存储空间量。合同将与同伴计算机签署另一份合同并租赁存储空间。然后，它会转而将该空间列给可以租赁该服务器空间的用户。


    人类只需要做的就是监控管理合同的规则。他们需要确保它没有违反任何同伴规则，并且服务器需求得到了正确满足。因此，公司可以变得比现在精简得多，并成为由 `dApps`
    和 `Smart Contracts` 相互作用的网络。


    如果你已经听到了要领，这听起来与 AI 开发诡异地相似。目前 AI 开发的问题在于，它完全掌握在少数公司手中。如果它的开发能够民主化呢？无疑，开发速度会快得多，结果将是一个由
    `Smart Contracts` 运行的公司，并由人类操作员确保该系统的边界得到充分保护。


    我们所熟知的公司本质上是为了盈利。然而，这种开源公司并不是为了赚钱。毕竟，机器人不需要工资。服务费可以保持在低水平，价值成为主要的驱动力。结果是，资源成本降低了。


    这将如何与资本主义社会产生作用？嗯，现在说还为时尚早。然而，毫无疑问，我们理所当然的范式将受到挑战。`Smart Contracts` 的不断发展会导致人类完全不再需要吗？如果一个
    `Smart Contract` 可以监控另一个，从而消除对人类操作员的需求呢？


    在这样的社会中，人类的功能变成了什么？再次，现在说还为时尚早。存在最好和最坏的情况。无论发生什么，毫无疑问，将 AI 这样的力量从中心化控制中释放出来对整个社会只能有利。


    ### 艺术创作


    互联网在向大众传递信息方面做出了巨大努力，但它从未补偿创作这些信息的人。报纸和出版公司的衰落以及像 BuzzFeed 这类网站的接管是影响媒体消费的众多方式之一。


    此外，这些媒体机构对报道内容仍然行使着巨大的控制权。如今，除了这些点击党网站外，我们还要应对像 `Facebook` 这样的社交媒体平台。虽然区块链不能复活已经的报纸，但它确实可以确保创作原创内容的人获得回报。


    目前，内容创作者必须使用中心化平台来传播他们的信息。例如，一个有抱负的记者必须维护博客、`Twitter` 账户和 `Facebook` 配置文件来获取和报道故事。此外，他们的故事出现在一个对输出有进一步控制的网站上。在大多数情况下，内容创作者失去了他们作品的权利，并且无法根据其分享或消费的频率获得补偿。


    '
- fmt: '

    The blockchain enables creators to digitally sign their art and lease their artwork
    to other consumers. Non-fungible tokens or `NFTs` have become hot recently, and
    speculators have rushed in increasing the prices of everything. While the speculative
    boom shows how little people understand blockchain technology, the `NFT` itself
    is a `Smart Contract` that can change the way creators collect royalties.


    On a decentralized platform, an artist could create a work of art (or content
    of any kind) and sign it, thereby verifying their rights to the work. The `NFT`
    can be coded to lease the artwork to other users in exchange for a token, and
    thus, royalty collection is automated. If anyone wishes to share the artwork or
    display it to the public, the `NFT` would ensure that the artist is compensated
    accordingly for it.


    Currently, anyone can take a picture of a work of art or download a digital work
    of art and repost it on a website. Google picks this image and displays it in
    its image results, without paying the creator a fee or acknowledging that someone
    else created it. Facebook and Google display millions of pieces of content on
    their platforms, increase their share of the internet’s traffic, earn ad revenues
    from advertisers thanks to this traffic, and don’t compensate people who drive
    traffic in the first place.


    If no one posted anything on the internet for a day, what would happen to Google
    and Facebook’s business model? The blockchain would allow people to share and
    use the content as they please but would also ensure fair compensation to creators.
    Google could upload pictures of artwork to its image search results but would
    have to pay the artist royalties for doing so.


    A `Smart Contract` tied to an `NFT` can resolve all scenarios where artwork would
    be displayed. A display in image search results would require a smaller royalty
    than one displayed on a website. If the image is being displayed for educational
    purposes or for purposes that the artist doesn’t wish to collect a royalty from,
    the `Smart Contract` can specify these conditions.


    There is no limit to how much this will impact the likes of music creators, artists,
    and digital content creators. Record companies, walled app stores such as Apple
    and Google, and centralized platforms will face a reckoning and deservedly so.
    Their days of rent collection will be numbered.


    Aside from helping artists, the blockchain will also eliminate fraud. Currently,
    the art world is inundated with fakes that cost a ton of resources to verify and
    discredit. Insurance companies build entire business lines insuring art and verifying
    authenticity. The blockchain will simplify all of this since the record of a piece
    of art will be immutably stored on the network.


    Verifying its origin and creation will be simple. Even if a single record is lost,
    its existence is stored on the entire network and can thus be restored easily.


    ### Cooperative Companies


    The term `sharing` has been co-opted by the likes of Uber and Airbnb-like platforms.
    According to these platforms, they’re participants in a “sharing” economy and,
    they position themselves as peer-to-peer companies. However, as you’ve already
    read, these companies don’t offer anything to share. They’re merely aggregators
    that host a bunch of traffic on their platforms without assuming any responsibility.


    The word `sharing` implies a free exchange of goods and services. Think of kids
    sharing toys. Uber and Airbnb don’t offer people the chance to share anything.
    An Uber driver is a taxi operator at the end of the day and has to pay Uber a
    cut of their earnings for the privilege.


    The blockchain can reinvent the so-called sharing economy of today by turning
    it into an actual peer-driven network. You’ve already read about how such decentralized
    platforms would work, so I won’t dive into the details again. There’s no doubt
    that such `dApps` give users greater control over their data and business models.
    As such, if the price of this control is the obsolescence of centralized platforms,
    then it’s worth it.


    A side-effect of the blockchain is that it can turn a sharing economy into a metered
    economy. For instance, when you hire a car these days, it’s tough to hire one
    for a few hours. You’ll probably be charged for an entire day no matter how little
    you need the car. The reason is it’s tough to locate renters for the remaining
    hours of the day and enforce rental terms over short periods. It also adds significant
    costs. For instance, the car company will need to inspect the vehicle multiple
    times, run paperwork just as often, and coordinate collection and pickup. All
    of this means more employees and processes. The chances of things going wrong
    are high.


    Zipcar made waves when it allowed people to rent cars hourly. However, this platform
    didn’t really add any value. It merely aggregated people who were willing to rent
    their cars when the vehicles were lying unused. The blockchain doesn’t have a
    billion-dollar valuation but delivers far more value than Zipcar claims to do.


    By tying rental terms to `Smart Contracts` and linking with a decentralized review
    app, a company could create a system where people can rent their cars when unused
    easily. Identities will be verified by the network and contract terms will be
    enforced automatically. Owners will need to physically check their vehicles for
    damage, of course; that cannot be automated away.


    However, this business model reduces costs significantly and improves everyone’s
    experience. It isn’t just vehicles that can be rented. The seed of Airbnb emerged
    from the thought that people have a variety of resources that they don’t use all
    the time. For instance, many people have tools in their garage but rarely use
    all of them. Most tools are bought with the intention of having them when the
    time comes.


    What if a construction worker needed a certain tool and could rent it from a decentralized
    tool renting app? People could specify the exact number of hours they would like
    to rent a tool, and tool owners could enforce rental periods by `Smart Contracts`.
    Powered by a network of trust verification and insurance apps, a peer-to-peer
    economy where resource usage is metered is now a reality.


    The possibilities are endless. We could sublease our Wifi hotspots, storage capacity,
    even the heat generated by our computers. The only question is, how creative can
    we get when it comes to monetizing our assets?


    ### Reinventing Platforms


    The blockchain can remove these fees entirely since trust is built into the system.
    However, this won’t necessarily kill their businesses. They can use the redressal
    of data usage to their advantage. Let''s take a company like Airbnb, for instance.
    Currently, this platform monitors your usage and collects data about everything
    you do for free.


    What if Airbnb instead allowed you the freedom of sharing specific data and compensated
    you for it? The company could then use that data and make its platform better.
    Health tech is another example. Wearable technology allows people to track everything
    they do, but they also share these data with companies.


    The blockchain can redress this imbalance. What if you bought a shoe with a chip
    in it that transmitted data to the manufacturer? What if these data were on a
    blockchain, and you could choose which data to share and what to withhold? Furthermore,
    what if the manufacturer paid you for sharing data?


    Platforms, for their part, can scale down and provide more value to their users.
    Airbnb won’t need massive security functions and won’t need to worry about storage
    since an entire network does it for them. Instead, they can use the data they
    collect (from their data suppliers as raw material) and make their platforms a
    better place (finished products).


    ### Transparent Supply Chains

