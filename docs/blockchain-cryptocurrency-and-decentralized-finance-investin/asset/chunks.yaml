    你应该回想起校园时光，当时有一个霸凌者，而且他们输掉了比赛。因为他们一直输输，他们不想表现出自己的落后，因此规则不断发生变化，以便他们最终获胜。虽然这看起来并不公平，但你无法在规则上与霸凌者争论，因为他们比你强壮，从长远来看会伤害你。大型农场也是如此。因为他们拥有更多的资金，他们能够利用这些资金导致你破产。这就是为什么顺应自然流和那些不断变化的规则，要比与他们争论要容易得多。


    ## 比特币是理想主义且非营利的


    有数百万美元正在投资于比特币。已经有五十亿美元累积到比特币系统中，用于启动和运行系统。此外，还会有数十亿美元投资到比特币钱包、交易所和矿工操作中。以下是证明示例：


    *   `Coinbase` 已筹集了一亿美元，用于区块链运营。

    *   `Circle`（一家高盛的初创公司）投资了五千万美元。

    *   硅谷的 `VC` 筹集了 1 亿 600 万美元，以便在区块链上进行隐身模式操作。


    ## 区块链是安全的


    由于区块链上必须有 `Proof of Work`（工作量证明），写入数据时将实施某些机制。每当交易通过验证时，就会添加到链中，以确保链上不会出现重复计算。由于区块链上的区块将被所有用户使用，如果你尝试挖掘自己的链，将是非常昂贵的。


    将存在私有区块链，其中必须替换工作量证明的机制，这导致其他人向创建的链中添加的内容受到限制。换句话说，最终将构建区块验证者。


    规则使得区块将由一个签署的签署人列表指定。该列表将受到限制，以便系统确保条目轮替写入区块，从而有足够的份额。不良行为受到高度抵制，并将由于轮询的工作模式而受到限制。


    ## 区块链是加密的


    比特币使用了不同的加密方法，以及要加密并放置在区块链上的数据。正因如此，许多人认为放在区块链上的所有信息都是加密的，但事实并非如此。


    位于区块链上的大部分数据将是非加密的，因为这些信息不需要验证。这是因为没有方法可以解密那些应该通过的信息。


    每当你使用私有区块链时，节点将能够通过解密密钥解密数据。但是，如果你这样做，你就会知道你最初为什么要尝试加密数据了。


    密码学领域已经进行了研究，并揭出的解决方案表明，没有任何底层证据的数据将没有任何证明知识。因此，每当你观察这项技术时，你会发现它并不具备任何证明知识。


    ## 区块链是如何工作的


    为了更容易理解，我们需要给出一个具体的例子：当我通过银行转账时，银行会立即追踪每笔交易，并对任何其他移动进行同样的操作；而在区块链中，各种用户进行的操作被“合并”并插入区块中。以比特币为例，每
    10 分钟生成一个区块。


    此时提出的第一个问题是，由于注册表不仅由网络上的所有计算机共享，而且是公开的（也就是说，所有人都可以通过名为 `explorers` 的特殊网站访问），任何人都可以访问并处理我的账户，从而损害我的隐私。事实上，地址（我们在银行中称为
    `活期账户`）不是以姓注册的，而是由 26 个到 35 个数字字母字符组成的 `strings`。


    由于这个原因，比特币交易被认为是匿名的。比特币并不是匿名的，而是“伪匿名的”。这意味着虽然地址无法归属于真实的自然人，但仍然可能（尽管并不容易）追踪这些交易在网络上留下的计算机轨迹，直到用户（即用户连接互联网的点或其连接的设备），从而确定该特定地址的自然人的身份。


    '
