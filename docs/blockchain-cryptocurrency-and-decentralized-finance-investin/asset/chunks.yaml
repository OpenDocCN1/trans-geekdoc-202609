  trans: '

    NFT 可以在开放商业中心进行交易，例如 `OpenSea`。这些业务领域将买家与商家连接起来，并且每个代币的估值都是独特的。通常情况下，NFT 的价值会因为市场兴趣的波动而发生变化。


    NFT 的活动取决于其执行的区块链阶段。每个区块链阶段都有一系列功能特性，使得 NFT 能够以某种方式运行。因此，例如，`Ethereum` 中的 NFT
    与 `TRON` 或 `EOS` 的 NFT 相比可能有不同的内部活动。


    尽管如此，这些差异与所做的更改有关，因此合约的行为会根据其执行的区块链框架进行调整——例如，所使用的编程语言、访问的处理方式，以及在组织内部使用的界限和资源。除此之外，NFT
    的行为遵循某些我们可以称之为标准的边界，并且在很大程度上遵循由 `Ethereum` 及其 `ERC-721` 和最新的 `ERC-1155` 标准所主导的结构。


    随着 `ERC-721` 和 `ERC-1155` 的诞生，`Ethereum` 发现如何利用几种极大地促进了 `Ethereum` 内部 NFT 发展的工具。为了做到这一点，它提供了一系列具有功能和能力的标准智能合约，所有
    NFT 在其控制和开发中可能都需要。随后，例如，`ERC-721` 和 `ERC-1155` 允许你创建、移动、更改甚至删除 NFT。


    当你购买一个 NFT 时，你购买的是一个代币和一个与该代币关联的艺术品。售出的艺术品可以是独特的作品或某个作品的副本，但每个代币都是独特且不可重复的。NFT
    的另一个非常重要的特征是它们不可分割的。这意味着你不能将非同质化代币的一部分发送给某人（与 `Bitcoin` 不同）。


    买卖交易使用加密货币进行并在 `Blockchain` 中注册，这允许对该购买行为进行永久记录并提供所有权证明。


    ## 以太坊 2.0 发生了什么变化（可扩展性与安全性）


    今天的 `Ethereum` / `Ethereum 2.0` - 游戏改变者 / 它对矿工的影响


    每当我谈到某些替代货币（例如这种特定的货币）时，我感到纯粹的喜悦和快乐。我很清楚它是一种运行非常快且已经爬上梯子进入激烈竞争地位的替代货币，我喜欢它。关于这个美物，我能说什么才能让你同意进行加密货币投资呢？


    稍微回顾一下如何？`Ethereum` 是一种加密货币（替代货币），它作为去中心化网络之一引起了更多关注，其一个支持不同形式智能合约的平台在疫情期间引起了更多关注，许多人使用这些智能合约收集了大量这种加密货币。`Forsage`、`Million
    Money` 和 `Lion Share` 仅举几个，就是构建在加密货币 `Ethereum` 区块链上的智能合约部分，因为它网络是在没有任何任何外部人士干预或控制的情况下创建并运行的，并且具有防止任何欺诈活动的安全性。


    `Ethereum` 是仅于 `Bitcoin` (`BTC`) 的第二大加密货币。而且，它的市值非常大。本月早些时候，我们一直在等待的加密货币另一个版本，即
    `Ethereum` 的升级版（`Ethereum 2.0`）变为了现实。加密货币创始人 `Vitalik Buterin` 已经发布了一项更新。


    你不应该忘记这种加密货币所扮演的关键角色，因为它更多地充当了智能合约讨论的障碍清除者，并为任何或许多开发者利用其平台奠定了坚实的基础。


    `Ethereum` (`ETH`) 是 `Ethereum 1.0`，不要忘记我说它使用 `proof-of-work` 共识机制来完成所有要求或需要完成的工作。至少我们都知道那是该加密货币区块链网络的首个和初始算法。总结来说，就是必须有一些特定的区块链参与者。


    现在待使用的共识已被修改，现在是 `proof-of-stake`，这是一个足以改变规则的大符号或信号。`Proof-of-stake` 的运行方式是某些参与者（也称为验证者）保护整个对下一个哪个区块将是有效的押注，谁获得正确押注的人将获得奖励，而那些没有获得正确押注的人将受到惩罚。


    `Proof-of-stake` 意外地更加节能，因为不需要使用巨大的计算来解开整个谜题。`Ethereum` (`ETH`) `2.0` 凭借其新共识将带来许多吸引力，因为它具有更坚固或更高的安全水平，并具有改变规模或大小的能力。


    据高度预测，随着这种新修改的共识，将节省更多的能量。但问题是，矿工也是交易（如 `crypto-staking`）的参与者和验证者，他们被赋予了检查交易、金额以及任何持有者持有资产的实际时间的责任，这为他们提供了一个看似难以被撼动的有意义且安全的位置，以及市场中一种不俗的价值，凭借如此大的权力和意识足以向集中或中心化系统提供含蓄建议。


    目前有一种争论，认为质押（staking）除了对网络产生中心化影响外不会产生任何好处，尽管导致了关于 `proof-of-work` (`PoW`) 说法的问题是：“矿场越大，由于规模经济效应，回报越高。”


    与早期的预期相反，在 `proof-of-stake` (`PoS`) 中，不存在规模经济效应，使得质押成本无论是一个质押 40 `Ethereum` 还是
    40000 `Ethereum` 都非常相似。


    此外，对于我的美物 `Ethereum` (`ETH`) `2.0` 的最新预测，公共网络应该接受 1000 到 5000 `TPS`，而你无法尝试将这种加密货币（Ethereum
    2.0）修改共识与 `Ethereum 1.0` 进行比较，因为它至少可以允许 30 `TPS`。


    通过许多人对对此的看法，有一个我很喜欢且无法挥之的想法。`Zipmex` 说“这还需要几年时间，因为极可能到那时，人们已经在使用层 2 解决方案（如 rollups）来解决可扩展性问题。”

    '
- fmt: 'The pandemic legacy was not just death or recession, it opened the eyes of
    people to new opportunities. This inconvenience we faced triggered the urge we
    had, and many of us moved our businesses online. The same way it contributed to
    the advancement of the blockchain and many Smart Contracts and it gained the advancement
    as a result of not just the most obvious reason, which is the pandemic, but because
    of its decentralized nature of the network of the cryptocurrency `Ethereum` (`ETH`),
    and it gave rise to its prominence.


    The construction of a plan of action regarding `Ethereum` 2.0 has actually given
    many goosebumps already. This is the future of a blockchain community. We will
    definitely have many surprise packages as regards the advanced cryptocurrency,
    `Ethereum` (`ETH`) 2.0.


    I am not a guru—in fact, I put a lot of hard work into things before I can be
    able to say “I have got this.” Neither am I some seer, but I really do think that
    the steady rate of `Ethereum` over the past few weeks is not some miracle of God,
    but because of the promising values of the cryptocurrency in the offing which
    is `Ethereum` (`ETH`) 2.0 that has shifted from its used-to-be proof-of-work (`PoW`)
    to proof-of-stake (`PoS`) consensus.


    No one should take away the leading from the jungle or stop it from roaring, neither
    can we say that the lioness being the hunter to keep quiet or stop hunting. `Bitcoin`
    (`BTC`) has the highest market capitalization and value, but for an altcoin, `Ethereum`
    has done and is doing pretty well.


    As an altcoin, this cryptocurrency might just be the most essentially planned
    endeavor, with an actual goal and accomplishment in several steps or stages in
    the blockchain virtual world. Unarguably, the cryptocurrency (`ETH`) `Ethereum`
    has the second largest market capitalization in all the cryptocurrencies that
    we have and it is second to `Bitcoin` (`BTC`) and it is like a vessel carrying
    other vessels that are smaller.


    What I am saying is that `Ethereum` allows some other blockchain projects and
    applications such as `Defi` applications to advance. The cryptocurrency is stretching
    its hands wide and ready to show us its second generation and how much more it
    has gotten to the point of growth and development or advancement in everything
    its first generation has been offering to us.


    What has been a concern about `Ethereum` (`ETH`) 2.0 is that, as much as it likes
    carrying smaller vessels on with its blockchain, the more applications get higher
    and higher on this blockchain, the costs get increased and there is a depletion
    in the level of its speed.


    I remember using the abbreviation of `TPS` earlier, I am sorry I did not break
    that down. Transactions per second, that is the meaning of that abbreviation.
    And, whenever there is a congestion in the cryptocurrencies (`ETH` 1.0), the transaction
    per second has reached its limit already and there be a serious hindrance to any
    `Ethereum` (`ETH`) 1.0 applications'' designing or programming.


    When it comes to the vision behind the conception of the cryptocurrency `Ethereum`
    (`ETH`) 2.0, it is going to be a need to groom `Ethereum` until it becomes fully
    capable or mature enough to take up the responsibility of assisting humanity.


    In the grooming stage, as it is still in, there is an essential need to make so
    many sensible and creative modifications to be the advancement of its characteristics
    such as security, ability to be sustainable, and its size. For `Ethereum` (`ETH`)
    to be fully exploited, it needed to shift its consensus algorithm from proof-of-work
    (`PoW`) to proof-of-stake (`PoS`).


    The plan is not even using electronic machines (computers) as nodes to a miner,
