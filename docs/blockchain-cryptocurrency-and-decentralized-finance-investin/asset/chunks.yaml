    \ to mine your own chain.\n\nThere are going to be private blockchains where there\
    \ will be mechanisms that have to be replaced for the proof of the work, which\
    \ causes there to be a limit on the things that other people can add to the chain\
    \ that is created. In other words, block validators will end up being built.\n\
    \nThe rules have made it to where blocks are going to be specified by a signed\
    \ list of signatories. This list is going to be limited so that the system can\
    \ make sure that the entries take turns writing blocks so that there are enough\
    \ to go around. Bad behavior is highly discouraged and will limit because of the\
    \ round-robin style of work.\n\n### Blockchain Is Encrypted\n\nThere are different\
    \ cryptographic methods that bitcoins use along with the data that is going to\
    \ be encrypted and placed on the blockchain. Because of this, a lot of people\
    \ believe that all of the information that is put on the blockchain is encrypted,\
    \ but this is not true.\n\nMost of the data that is located on the blockchain\
    \ is going to be unencrypted since the information does not need to be validated.\
    \ This is because there is not going to be any way to unencrypt the information\
    \ that is supposed to be approved.\n\nWhenever you are using a private blockchain,\
    \ the nodes are going to be able to decrypt the data through decryption keys.\
    \ But, if you are going to do this, then you are going to know why you’re trying\
    \ to encrypt the data in the first place.\n\nThere has been researching done with\
    \ cryptography and solutions have been revealed showing that the data that does\
    \ not have any underlying evidence is going to have no knowledge of proof. So,\
    \ whenever you look at this technology, you will come to realize that it is not\
    \ as mature as it appears to be.\n\nPrivacy is vitally important to everyone,\
    \ but why would you want to encrypt the data that is on the blockchain? If the\
    \ information is in motion, should it be encrypted? The information that is resting,\
    \ does that need to be encoded? And finally, when the data has been encrypted,\
    \ who is going to have access to it? When should it be decrypted? When should\
    \ someone’s permission be revoked so that they no longer have access to the data?\n\
    \nManagement of the data is going to be critical of the security for the data\
    \ that is on the server. When should the information be shared freely between\
    \ two different parties? You need to carefully consider the security of the data\
    \ that is on the blockchain to find a solution that will help protect what needs\
    \ to be protected while still allowing the nodes to validate the information.\n\
    \n# CHAPTER 2:       \n\nHow the Blockchain Works\n\n![Introduction to Blockchain\
    \ technology | Set 1 - GeeksforGeeks](Images/image00123.jpeg)\n\nT o make it easier\
    \ to understand everything, we need to give a concrete example of the most typical\
    \ use case concerning this technology: the transfer of value (or money) from one\
    \ user to another. To transfer money from one person to another, the method most\
    \ of us are used to is wire transfers; what happens, very simply, is that each\
    \ bank keeps registers in which it reports the total balance of each account holder\
    \ and the movements made to and from that particular account.\n\nWhen I make a\
    \ transfer (let's say € 100) from my account to that of another person, my bank\
    \ tracks the movement and marks on its register a transaction for an amount equal\
    \ to - € 100 from my account, then scales this sum from my total balance and sends\
    \ the money to the bank of the recipient. This, in turn, will do the same by marking\
    \ (but this time on its register) a movement of + € 100 and adding it to the total\
    \ balance of the current account holder beneficiary of the transfer. \n\nExactly\
    \ the same thing happens with a blockchain, except that the register does not\
    \ hold it by a bank (as we have illustrated in the previous chapter.) Instead,\
    \ all the computers participating in the network have a copy of this document;\
    \ for example, when I send a Bitcoin (BTC) to a person, all the computers participating\
    \ in the network mark the movement on the register and deduct 1 BTC from my account\
    \ while, at the same time, add up the same amount for the benefit of the recipient.\
    \ \n\nThe first question that arises at this point concerns the fact that, since\
    \ the register is not only shared by all the computers on the network but is also\
    \ public (that is, it is accessible to everyone in consultation through special\
    \ sites called “explorers”), anyone could have access to the handling of my account,\
    \ thus damaging my privacy. In reality, the accounts (or “addresses”) are not\
    \ attributable to a name and a surname (i.e. to a natural person) but are “strings”\
    \ consisting of a minimum of 26 to a maximum of 35 alphanumeric characters.\n\n\
    For this reason, bitcoin transactions are said to be anonymous. Bitcoin is not\
    \ anonymous, but “pseudo-anonymous.” This means that although the addresses (those\
    \ we call “current accounts” in the bank) are not registered in the name of real\
    \ natural persons, it is still possible (though not easy) to follow the computer\
    \ traces that these transactions leave on the web up to the user (i.e. the point\
    \ where the user connected to the internet or the device with which they are connected)\
    \ and thus define the identity of the natural person who controls that particular\
    \ address.\n\nLet's go back to our money transfer and introduce another relevant\
    \ difference compared to what happens in the banking system. While when I move\
    \ my money through a bank it immediately traces each transaction and does the\
    \ same with any other movement, in a blockchain the operations made by the various\
    \ users are “merged” and inserted into blocks. To understand what a block is,\
    \ we can imagine it as a box that contains the information (sender address, amount\
    \ handled, recipient address) relating to all transactions “ordered” by users\
    \ in the unit of time. With Bitcoin, for example, a block is generated every 10\
    \ minutes."
