- fmt: '

    *   DEX works through various nodes throughout the cloud. This means it will continue
    to operate even if there is a server that is experiencing access problems or has
    been attacked.

    *   It has a higher degree of privacy because you do not share your data with
    third parties. Most DEXs do not have KYC requirements. That means you get to maintain
    total anonymity.

    *   You keep control of your money in your account since DEXs allow you to keep
    your private keys.


    ## Disadvantages of Decentralized Cryptocurrency Exchanges (DEX)


    Decentralized exchanges are not suitable for everyone since they have some serious
    drawbacks—especially for newbies. Here are the drawbacks of DEX that everyone
    should know:


    *   There is a greater workload because normally, transactions such as trading
    and money transfers are covered by a central cryptocurrency exchange.

    *   They are not regulated or insured. Central exchanges have funds to return
    the money at any time. That''s why they keep escrow funds for quick withdrawals.

    *   Most DEXs do not allow payment by credit or debit card or bank transfer.

    *   Prices are low, and transaction volume is limited, which can keep fees high.


    *   Services from decentralized exchanges are limited. Services to stop losses
    and losses, including margin trading and fiat currencies, are generally not offered.


    # CHAPTER 4: Bitcoin


    [https://www.shutterstock.com/it/image-illustration/bitcoin-blockchain-cryptocurrency-digital-encryption-money-2063418779](https://www.shutterstock.com/it/image-illustration/bitcoin-blockchain-cryptocurrency-digital-encryption-money-2063418779)


    Each transaction that is on the bitcoin blockchain is going to be available for
    the public to see in public records. In doing this, there is not going to be any
    need for a central authority, which means that any maintenance that has to be
    done is going to be done by the system to keep the software running to its fullest
    potential. Take, for example, one transaction that is sent to another bitcoin
    user; then it is going to be broadcast on the network that person a transmitted
    person b x amount of coins.


    The transactions that are completed on the network are going to be validated before
    they can be added to the ledger, which means that the nodes are going to also
    broadcast that transaction as they are attempting to verify the purchase. To achieve
    independent verification, there has to be a distributed database on the blockchain
    that works with the nodes and works on storing all of the data in the appropriate
    places. This means that every bitcoin is going to save its data on the blockchain.


    Blocks are created six times an hour as transactions are verified and accepted.
    When this happens, the software is going to have the ability to figure out when
    a bitcoin amount has been spent so that double spending does not occur. This is
    extremely helpful in creating an environment where nothing is monitored by a central
    authority.


    The most prominent advantage that you are going to find with using bitcoin is
    that it is going to be more established, and that means that you are not going
    to have worry about the servers shutting down as often to apply updates. This
    is good for users because it makes it to where they feel that the system is going
    to be more stable and they are going to have more confidence in it not crashing
    due to the platform still being in beta.


    ## What Is Ethereum?


    Ethereum is a blockchain platform that is public, programmable, and works around
    transactions. As you most likely know, ethereum is going to be a decentralized
    platform that offers a peer-to-peer contract through the use of `ether`. Vitalik
    Buterin is the man who proposed ethereum in 2013 and found the funding for it
    in 2014.


    Ethereum was not launched until 2015 by the Ethereum Switzerland GmbH. The next
    year, ethereum’s value token was worth one billion dollars. It was said that `ether`
    would be able to challenge bitcoin due to the fact that it had services that were
    not offered by bitcoin and could not be provided by bitcoin due to the fact that
    bitcoin was more established and did not have the ability to adapt as well as
    ethereum did.


    There are a lot of people that do not know there is more than one cryptocurrency,
    or they know about bitcoin and `ether`, but they do not know about the other cryptocurrencies
    that are out there.


    As you know, `ether` is going to be the cryptocurrency of ethereum, and it is
    going to be similar to bitcoin. Vitalik Buterin sold twenty-five percent of his
    `ETH` holdings due to the fact that he thought it was found in financial planning.
    One of the biggest downfalls about `ether` is that it is not going to hold a monetary
    value outside of the internet and it will be possible for you to use it when you
    are on the ethereum platform.


    ## What Drives Ethereum?


    https://www.shutterstock.com/it/image-illustration/second-by-market-capitalization-contract-eth-1769960942


    There are basically four different categories that make up the ethereum ecosystem
    and each of them influences the daily price. These categories include traders,
    investors, developers, and at the end, users of different `dapps` hosted by the
    ethereum network. Speculative traders are mainly responsible for price fluctuations
    because they repeatedly trade in and out of positions, often using leverage. On
    the other hand, investors are the staunch long-term adepts in the technology,
    and they hold ethereum tokens for a prolonged period, which can last up to several
    years. Investors have a propensity to steady prices, regularly adding to their
    stockpile during dips. For example, during the September 2020 sell-off, the leading
    100 ethereum addresses expanded by over 850,000 `ETH` tokens according to Cointelegraph
    consulting.


    Developers and `dapp` users require ethereum tokens to cater for gas fees to access
    the ethereum network. To refresh your mind, gas fees refer to payments made by
    users to pay for computational energy needed to process and sanction transactions
    on the ethereum network. As `dapps` users continue to increase in number, so is
    the demand for ethereum tokens.


    Taking a deeper look into the ethereum ecosystem, [State of the Dapps data](https://www.stateofthedapps.com/stats/platform/ethereum#new)
    reveals that there are currently 2778 total decentralized applications hosted
    on the ethereum network. Hiked gas prices on the Ethereum network have driven
    developers to seek alternative platforms with low gas fees such as the Binance
    Smart Chain.


    Other notable factors that drive the value of `ETH` include:


    *   Wider adoption.

    *   Increased acceptance.

    *   Government regulation.

    *   Mainstream media coverage.

    *   Market manipulation where traders buy and sell in vast quantities to influence
    price movement.


    If you are vested in investing in Ethereum specifically, there are three main
    things you need to have namely:


    *   An exchange account.

    *   A broker account and,

    *   A wallet.


    ## Exchange Accounts


    To invest in Ethereum, you need to have an exchange account. As mentioned in the
    previous chapter, an exchange is a digital marketplace that facilitates the buying
    and selling of cryptocurrencies. Picking the best exchange platform can be tiresome
    due to the many exchange platforms on the internet today. Here are some key factors
    to guide you into choosing the best exchange to buy Ethereum:


    *   Security and reliability: security is the main concern to many cryptocurrency
    traders. It is important to scrutinize the security level of an exchange platform
    before joining. Some exchanges are pretty bad at protecting their clients’ assets
    due to poor security measures.

    *   Payment methods supported: payment methods vary from one exchange to another.
    Make sure you are satisfied with the payment methods supported and before registration.

