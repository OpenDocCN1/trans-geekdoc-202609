    在这个行业中，区块链正在提高房地产交易的效率，缩短了检查每个参与方财务信息所需的时间，从而提升了行业透明度。这一切将帮助使伪造造据或租金诈骗几乎不再可能，使所有与物业相关的交易变得不可篡改。


    ## 区块链与教育


    在教育领域，区块链技术将帮助规范学习机构颁发的证书核实。它还可以确保所有教育工作者的资质都是有效的。这将消除冗余，并避免学生表现数据中的错误。


    ## 区块链在营销中的应用


    在这种情况下，应用非常多样化，因此该行业在选择目标消费者时将提高精准度。对于消费者自身而言，透明度将大幅增加。


    区块链将确保人们不会过度暴露在某些广告内容中，甚至可以让人们在使用数据时自动获得报酬。验证品牌粉丝是真人而非机器人将成为可能的。赞助比赛的合法性可以得到保障。


    ## 区块链与业务


    在业务领域，区块链的应用是极其丰富的，它缩短了检查参与方财务信息的时间，提高了透明度。正如你可以想象的，区块链技术的应用是无限的，但由于某些技术限制，它尚未完全普及。


    ## 区块链的传言


    由于区块链仍在完善，许多关于它的传言是可以被证伪的。这些信息会导致人们不愿投资。但是，这些传言可以被揭穿，让你更放心。


    ### 区块链是去中心化的且可以自我分裂


    这并非事实！当你观察现实时，你会发现区块链已经具有了很强的去中心化特征。


    由于加密技术的应用，区块链系统是去中心化的。此外通过网络上的算法和协议，矿工可以决定是否验证某笔交易。


    `ethereum` 等其他比特币平台正在开发类似于比特币的区块链。然而，由于 `ethereum` 仍然很新，它正在不断进化以满足需求，同时保持系统的去中心化。


    ### 数万商户在使用比特币


    有数万人使用比特币将太棒了！但遗憾的是，还没有多少商户接受比特币支付。大约 80%的加密货币被用于囤积而非实际支出。如果商户允许你使用加密货币支付商品或服务，那么他们将通过合作伙伴提取货币，这意味着他们将把数字货币转换为实际资金，以便他们购买维持业务运营所需的物品。但是，在使用时将会面临风险和费用。


    虽然很多人在使用比特币，但还没有多少商户接受比特币支付。


    ### 交易是实时完成的


    错误！交易之间存在 10 分钟的延迟。


    ### 在比特币上进行的交易“几乎免费”


    再次，这是错误的！交易存在处理费用，这并不是矿工将获得的收入。这些交易将在网络中处理，并获得少量的奖励。


    ### 比特币拥有最安全的货币


    这是真实的，因为比特币对攻击具有很强的韧性，但与其他任何交易系统一样，也会由于人为错误或欺诈而出现安全漏洞。仅在 2015 年就发生了：


    - 香港某比特币交易所的客户欺诈消失了 3.87 亿美元。

    - 由于网络钓鱼攻击，损失了 200 万美元的比特币。

    - 加拿大的交易所因数据库入侵被关闭。


    ### 比特币的生态系统是去中心化的


    区块链上的矿池数量有所增加。但，前四大矿池中至少有一个在中国。较大的矿池将受到人工限制，以确保民主化不会产生任何偏袒。但是，与较小矿池合作的那些会被较大的矿池挤出市场。


    '
- fmt: '

    You should think back to school when there was a bully and they were losing a
    game. And, because they keep losing the game, they do not want to show that they
    are missing and therefore the rules continue to change so that they can win in
    the end. While this does not seem fair, you are not going to be able to argue
    with the bully on the rules because they are going to be bigger and end up hurting
    you in the long run. This is the same with the big farms. Because they have more
    money, they are going to be able to use their money and end up causing you to
    go out of business. This is why it is easier to just go with the flow and the
    rules that are continually changing instead of arguing with them.


    ## Bitcoin Is Idealistic and Non-Profit


    There are millions of dollars being invested in bitcoin. It has already been around
    five billion dollars that have been accumulated into the bitcoin system, which
    was used to get the system up and running. On top of that, there are going to
    be billions of dollars that are invested in bitcoin wallets, exchanges, and miner
    operations. Examples that show that:


    * `Coinbase` has raised one hundred million dollars to be used in blockchain operations.

    *   Fifty million dollars was invested by `Circle`, which is a Goldman Sachs startup.

    *   One hundred and sixteen million dollars was raised by `VC` in Silicon Valley
    so that a stealth mode could be placed on the blockchain.


    ## Blockchain Is Secure


    There are features that are going to be put into place for the writing of data
    due to the fact that there has to be `Proof of Work` on the blockchain. Blocks
    are going to be added to the chain whenever a transaction has been validated to
    make sure there are no double calculations being placed on the chain. Since the
    blocks on the blockchain are going to be used by all the users, it is going to
    be expensive if you attempt to mine your own chain.


    There are going to be private blockchains where there will be mechanisms that
    have to be replaced for the proof of the work, which causes there to be a limit
    on the things that other people can add to the chain that is created. In other
    words, block validators will end up being built.


    The rules have made it to where blocks are going to be specified by a signed list
    of signatories. This list is going to be limited so that the system can make sure
    that the entries take turns writing blocks so that there are enough to go around.
    Bad behavior is highly discouraged and will limit because of the round-robin style
    of work.


    ## Blockchain Is Encrypted


    There are different cryptographic methods that bitcoins use along with the data
    that is going to be encrypted and placed on the blockchain. Because of this, a
    lot of people believe that all of the information that is put on the blockchain
    is encrypted, but this is not true.


    Most of the data that is located on the blockchain is going to be unencrypted
    since the information does not need to be validated. This is because there is
    not going to be any way to unencrypt the information that is supposed to be approved.


    Whenever you are using a private blockchain, the nodes are going to be able to
    decrypt the data through decryption keys. But, if you are going to do this, then
    you are going to know why you’re trying to encrypt the data in the first place.


    There has been researching done with cryptography and solutions have been revealed
    showing that the data that does not have any underlying evidence is going to have
    no knowledge of proof. So, whenever you look at this technology, you will come
    to realize that it does not have any knowledge of proof.


    ## How the Blockchain Works


    To make it easier to understand, we need to give a concrete example: when I move
    my money through a bank it immediately traces each transaction and does the same
    with any other movement, in a blockchain the operations made by the various users
    are “merged” and inserted into blocks. With Bitcoin, for example, a block is generated
    every 10 minutes.


    The first question that arises at this point concerns the fact that since the
    register is not only shared by all the computers on the network but is also public
    (that is, it is accessible to everyone through special sites called `explorers`),
    anyone could have access to handling of my account, thus damaging my privacy.
    In reality, the addresses (those we call `current accounts` in the bank) are not
    registered in a name and a surname but are `strings` consisting of a minimum of
    26 to a maximum of 35 alphanumeric characters.


    For this reason, bitcoin transactions are said to be anonymous. Bitcoin is not
    anonymous, but “pseudo-anonymous.” This means that although the addresses are
    not attributable to real natural persons, it is still possible (though not easy)
    to follow the computer traces that these transactions leave on the web up to the
    user (i.e. the point where the user connected to the internet or the device with
    which they are connected) and thus define the identity of the natural person who
    controls that particular address.

