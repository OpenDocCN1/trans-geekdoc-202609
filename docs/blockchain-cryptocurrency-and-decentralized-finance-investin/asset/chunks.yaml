    特别是在刚开始时，你应该只投入你不需要的资金。如果你认为你可能在加密货币中投入关键资金并中大奖，请重新考虑。投资，尤其是加密货币，是一个需要时间来积累和建立财富的过程。虽然你可能运气在较短时间内赚到一些钱，但你不应该预期这种情况发生。通常情况下，当你投资加密货币时，你应该预期你的投资将闲置相当长的时间。


    ## 先研究，后买入和交易


    在购买加密货币之前，对其进行研究是至关重要的。阅读这本书说明你有一个非常好的开端。现在，你对最流行的加密货币形式、如何获取它们、如何存储它们以及如何交易它们有了坚实的的认识。这很重要。然而，你不应该让学习止于此。


    当你投资任何东西（包括加密货币）时，在研究之后进行投资是非常重要的。你不想发现自己投资了某种你不完全理解的东西，结果因为你不清楚自己在做什么而损失了投资。花时间研究你将使用的交易所网络、你想投资的加密货币形式，以及该特定币的近期和历史市场数据是非常重要的。


    研究加密货币的一种极方法是通过基础的互联网搜索，但如果你想做出明智的决策，也应该比得深入。网上有很多加密货币论坛和小组你可以加入，这些地方将你与已经在加密货币领域交易相当长时间的人联系起来。参与这些论坛让你有机会与其他交易者交流，并帮助你发现作为初学者你应该采取的最佳行动是什么。市场在不断变化，可用的货币也是如此。由于这个原因，我们在本书中现在向你推荐的任何内容都可能迅速失效。这就是为什么我们没有向你推荐任何特定的币种来入门，而是在写本书时向你介绍了当时流行的币种。


    除了在第一次交易之前进行研究外，还要确保在每笔大交易之前继续研究，并在整个投资期间保持关注。正如我们刚刚讨论的，市场在不断变化，可用的加密货币范围也在变化。随着新技术或加密货币的引入，可能会在任何时候发生变化，所以你想确保自己保持领先并关注。你先研究得越充分，就越可能做出明智、有根据的投资决策。这可以保护你做出长远来看可能付出代价的盲目决策，并帮助你从投资中获得更多回报。


    ## 仅在理解的情况下进行多元化


    为了进一步说明先研究的重要性，请确保只有在你理解自己正在对什么进行多元化时才这样做。有些人建议你买入目前提供的每种加密货币的小部分。这实际上是一个非常糟糕的投资选择。你可以明显看出，有些币种不会带来丰厚回报，如果你做些研究，你就会知道。有些加密货币是实验性项目，旨在学习新技术并观察哪些可以改进。另一些则被揭示为新开发者进入加密货币热潮的机会，但实际上并没有开发得很好，对你来说几乎毫无用处。既然你可以简单地研究它们并投资更有可能成功的币种，那么在这些类型的加密货币上浪费资金是毫无意义的。


    ## 除非情况变化，否则不要急于获利


    许多人认为你应该立即提取资金的利润。当然，这完全取决于你。大多数人会说你应该尽快快速卖出，这样就可以获得巨额利润。如果这种方式对你有效并且这是你所寻找的，那么请务必这样做。例如，如果你的收入发生了变化且你真的需要这笔资金，你可以卖掉它们并获利。否则，你可以选择撤出资金并投资到其他地方。当然，你可能有其他个人理由想要提取利润，这完全取决于你。然而，值得注意的是，资金存放得越久，增长得越大。与其动用它们，除非绝对必要，可能更好的主意是让它们保持现状，让它们继续积累，这样某一天当你真正需要它们时，它们可以供你使用。


    ## 加密货币不适合日内交易者


    许多现代交易者倾向于每天扫视市场。他们早晨以低价买入，傍晚以高额回报卖出。这种策略在许多市场是完全没问题的，但在加密货币领域并不是一种可行的做法。涉及到加密货币时，你应该尽可能长地持有它。快速买卖资金可能会导致你错失宝贵的增长机会。


    如果你想投资加密货币，你应该将其视为长期投资，而不是一种你可以在短时间内进进出出的东西。虽然有些人选择获利了并在短时间内获得巨额回报，但真正的奖励在于让它静置并增值。人们用
    `$1,000` 买入并带着 `$80,000` 离开并不是屡见不鲜。


    ## 低买高卖


    所以，自然地，这对加密货币也适用。然而，由于加密货币市场波动性非常大，这并不总是实际可行。很难预测峰值和低谷何时发生，因为加密货币在任何时候都往往呈现出波动的趋势。与其担心低买高卖，不如专注于低位买入，尽可能长时间持有代币，然后在高位时卖出。由于市场的波动性，你可能无法预测值值，所以你可能需要确保自己关注的是长期收益而不是短期收益。试图在短时间内预测市场可能会变得压力很大，这可能导致你错失潜在的大收益。相反，要观察大局并关注它。目光跨越
    24 小时的跨度，看向几周、几个月甚至几年。


    ## 现在买


    许多人担心何时进入市场。他们不确定应该什么时候买入，不知道现在是否是时机，并且他们想确保获得最多的回报。这完全正常且自然。显然，这可能就是你投资加密货币的原因：为了回报。然而，并没有最佳买入时间。你等得越久，价格越高，你的买入价格就越高。


    不要等待时机，或尝试预测何时会出现低谷以便你买入。相反，现在就用你负担得起的资金立即买入。从那时起，在它触及低点时关注购买更多。这让你更容易真正开始，并让你在加密货币世界中不再那么畏惧。在第一周两周，重点放在学习市场。然后，一旦你这样做，你就可以开始关注正确的动作并获得你的低买入和高回报。


    ### 买入传闻，卖出事实


