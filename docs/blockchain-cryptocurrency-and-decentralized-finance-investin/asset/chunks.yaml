    ### The Transactions Are Done in Real Time


    Incorrect! There is a ten-minute delay between when.


    ### Transactions That Are Done on Bitcoin Are “Almost Free”


    Once again, this is wrong! There is going to be a processing fee that is not the
    revenue that miner is going to receive. These transactions are going to be processed
    and will reward minimally through the network.


    ### Bitcoin Has the Most Secure Currencies


    While this is true because bitcoin holds a high resilience to attacks, it is just
    like any other transaction system that is going to have breaches in security because
    of human error or fraud. In 2015 alone there were:


    - Three hundred and eighty-seven million dollars in fraud by clients that vanished
    from a bitcoin exchange in Hong Kong.

    - Thanks to a phishing attack, two million dollars in bitcoin were lost.

    - The bitcoin exchange in Canada was shut down because someone compromised their
    database.


    ### Bitcoin’s Ecosystem Is Decentralized


    Mining pools on the blockchain have increased. But, at least one of the top four
    mining pools is in China on their exchange. The bigger mining pools are going
    to be artificially limited so that democracy does not show any favoritism. But,
    those that work with a smaller pool are going to be pushed out of business because
    of the larger ones.

