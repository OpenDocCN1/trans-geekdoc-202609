  trans: '

    由于合约无法包含所有信息，当涉及到非网络上的支付时，将会有合约层面的执行。因此，将有一个安全点将合约连接到任何所需的外部端点。


    当系统无法自行获取信息时，预言机（oracles）将拥有从外部源获取数据的权力。预言机将作为入站和出站运行，使得合约可以释放支付并执行合约之外的签名。


    入站预言机将向合约提供所需的外部数据，以便它们能够判断合约之外发生的事件是真实的还是浪费时间的。


    # 什么是非同质化代币？


    [非同质化代币](https://www.shutterstock.com/image-vector/nonfungible-tokens-digital-items-19531603)


    非同质化代币，或 `NFT`，是一种允许数字产品具有唯一性或真实性的加密代币。它允许追踪谁拥有该资产以及其价值。


    `NFTs` 是通过区块链技术验证的数字资产，可以代表从数字艺术到 GIF 的任何内容。无论该 `NFT` 是唯一的还是系列中的一个，使用区块链进行“铸造”都为其提供了真实性及其所有权的证明。


    非同质化代币是一种独特且不可复制的加密符号。然而，这种不可分割的代币可用于代表现实世界中的物体，在维护其属性和所有者的同时，确认其真实性。


    `NFT` 的真实示例是一个收藏品。一个具有限制存在且极其独特的标记的数字卡片是 `NFT` 的完美例子。尽管如此，如果卡片是真实的，这种情况也会在区块链上发生。在这种情况下，真实卡片拥有数字表示，但这种表示仅用于我们追踪其真实性、所有权历史，并确认它确实是某一个。


    # 为什么 NFT 如此特别？


    与加密货币不同，`NFTs` 无法互换，因为没有两个 `NFTs` 是相同的。来自 `CryptoKitty` 的资产是独特的，为单一物品提供价值且无法进行比较。


    许多此类“代币”（例如硬币、艺术品或加密猫咪）都依赖于以太坊网络的区块链标准。这使得 `MetaMask` 或 `MyEtherWallet` 等钱包在买卖它们时变得简单。此外，`NFTs`
    具有一些实用特性：


    - **独特性**：这些资源拥有许多艺术品的副本（制作副本品要简单得多），但此处的所有者可以确认他们是作品的唯一且真实的。这是我们在看待数字艺术和数字作品时的一种独特现象。

    - **非互操作性**：一个 `CryptoPunk` 不能作为 `CryptoKitties` 游戏中的角色，反之亦然。同样的，`Blockchain Heroes`
    可以在 `Gods Unchained` 游戏中使用。

    - **不可分割性**：`NFTs` 无法拆分成类似 `bitcoin` 的更小部分。它们仅作为完整的单元存在。这与数字货币不同。它们具有不可分割的价值，你无法拥有
    1/1000 个 `Crypto Kitty`。

    - **不可破坏性**：由于所有 `NFT` 信息都通过合约存储在区块链上，任何代币都不会被删除、移除或复制。

    - **可追溯性**：在区块链上记录官方信息的额外处在于，物品（例如数字艺术）可以追溯到原始创作者，无需外部验证即可确认其真实性。区块链使得追踪比艺术品或邮章更复杂的内容变得可行。例如，区块链记录了谁购买或出售了
    `NFT`，谁是其目前的（最高）所有者，以及从哪里购买了该数字资产。

    - **完全所有权**：所有权的转移是永久的，这意味着玩家和作者保留了他们购买的 `NFTs`，而不是制作它们的机构。这与在 iTunes 商店购买音乐不同，那里客户并不拥有所购买物品的所有权——他们购买的是听音乐的许可。通过合约（合约）存储在区块链中的
    `NFT` 信息很难删除或伪造。


    # 如何使用非同质化代币？


    非同质化代币用于确认独特的数字属性、所有权以及跨平台的资源协作机会。`NFTs` 用于一些特定的应用，需要独特的数字组件，如加密（稀有艺术）、加密收藏品和加密游戏。


    加密游戏是游戏相关 `NFT` 的最新用途。例如，`Age of Chains` 和 `Rare Pepes` 等公司利用 `Counterparty` 协议在
    2016 年提供了基于 `Bitcoin` 的区块链交易卡 NFT。


    艺术是 2017 年 6 月 `CryptoPunks Launch` 的主要用途之一。这为以太坊区块链上的加密领域铺平了道路。`DADA.art` 源自
    `CryptoPunks` 模型，并在 2017 年 10 月为加密艺术开启了主要市场。


    随后，著名的区块链游戏如 `CryptoKitties` 使用了以太坊区块链上的不可性令牌。`NFTs` 用于代表游戏资产，并由客户端而非游戏工程师管理。这允许在没有游戏设计师授权的情况下在外部市场进行交易。加密平台包括
    `Nifty Gateway`、`Rarible`、`Super Rare`、`Famous Origins` 和 `MakerPlace`。


    `NFTs` 可以代表数字艺术、游戏组件和音乐文件的销售。创建和发行 `NFTs` 有不同的结构。其中最著名的是 `ERC-721`，它是以太坊区块链上发行和交易非同质化资源的标准。


    后期改进的标准是 `ERC-1155`。它允许单一合约同时包含同质化代币（Fungible）和非同质化代币（Non-Fungible），开启了完全不同的结果领域。

