    The essential philosophy behind scientific interpretation is this: nothing is
    new. History repeats itself.


    Like the name suggests, technical analysis concerns itself with using instruments
    such as market data, trading volume, indicators, etc., to analyze and try to predict
    where it will continue next purely from previous trends alone.


    Technical analysis is primarily concerned with finding a pattern in the current
    movement based on similar past patterns and making informed guesses on where things
    should go next, as well as where it went in the past when faced with such conditions.
    It is a calculated and meticulous way of looking at it. Most central to its principle
    is this: nothing is random.


    The focus of scientific analysis is the supply and demand curve for a particular
    coin in relation to market sentiments. This is done by trying to spot a movement.
    Technical analysts usually work to find out when a coin is about to make or break
    a trend and then try to ride it all the way to the top or down.


    For example, say a coin in a bullish field has had much higher demand than the
    supply is able to offer. This automatically leads to a rise in value. And thus,
    a high price movement is made. Although, as traders holding the coin started to
    hit their predetermined target prices, they will sell the coins and take profits.
    This increase in the number of coins might satiate and even overcome its appeal,
    leading to a break in movement or a downtrend. Technical analysts try to spot
    when that is about to happen and safeguard against it.


    Of course, when the price drops low enough, other analysts who have seen the coin''s
    history will buy some, hoping to ride the trend as well, and gradually the demand
    surpasses supply capacity. And so the cycle begins again.


    Technical analysis is based on the following assumptions:


    *   The price movement follows certain trends. Bitcoin prices do not change randomly,
    but tend to follow particular trends that last for either short or long periods.
    It uses past performance to predict future prices.

    *   Bitcoin prices are determined by multiple variables. The price movement of
    the coin is due to past and future demand of the coin, current market prices,
    and regulations governing the cryptocurrency market.

    *   History tends to repeat itself. What happened in the past is used to predict
    what will happen in the future. Past changes can easily predict future market
    changes. Traders tend to behave the same way when presented with similar market
    conditions.


    ## Types of Technical Analysis


    https://www.shutterstock.com/it/image-photo/charts-financial-instruments-various-type-indicators-279995282


    There are three components used in technical analysis:


    *   Chart lines: chart lines are used to indicate the points where price changes.
    Using historical price data, current prices, and volume data, analysts can draw
    charting lines to show the exact points where the prices tend to change.

    *   Patterns: chart patterns predict price movement. They show the price direction
    and extrapolate to show where prices are headed to.

    *   Indicator oscillators: this analysis tool uses statistical methods to determine
    the buy and sell signals.


    Analysts and cryptocurrency investors rely on the charts to get visual data on
    price trends and market momentum.


    ### Technical Indicators


    Technical indicators are investment analysis tools used to calculate and interpret
    market trends. Traders rely on these tools to determine the right time to invest
    in cryptocurrencies. Investors can receive alerts on any new investment opportunities
    and price changes.


    Traders can know the price movement of cryptocurrency assets whether they move
    up, down, or sideways. The price movement is calculated using historical price
    data, current prices, and trade volume data.


    Technical indicators are very important in analyzing cryptocurrency investments.
    They help investors to:


    *   Predict price movement and future price direction.

    *   Confirm market trends in the price movement of cryptocurrencies, such as Bitcoin.

    *   Alert investors to whether prices are going up, down, or sideways to allow
    traders to plan ahead for trade.


    Cryptocurrency investors rely on these indicators to determine the short-term
    price movement. They also evaluate the asset''s long-term price changes to determine
    when to enter or exit the market.


    Some of the common technical indicators used include calculating Moving Averages
    (`MA`) and the Relative Strength Index (`RSI`). For example, you can plot a chart
    to show the Bitcoin price direction for 12 and 26 days, respectively.


    There are several indicators to observe when analyzing a particular cryptocurrency
    asset. To choose the right indicator, you need to first understand how each indicator
    works and how each indicator will affect your investment strategy.


    Because of the volatile nature of cryptocurrency assets, monitoring the price
    direction or a Bitcoin price chart will help the investor evaluate both high and
    low trading patterns. If the chart assumes an upward trend, this will indicate
    higher trend lines; a downward trend indicates a series of low trend lines.


    Sometimes, the cryptocurrency will move sideways. In such a case, it does not
    move in any particular vertical direction at all. Investors should be very careful
    when using only one indicator, such as trend lines, to predict future prices,
    since the trends can move in any direction. It is much better to use two or more
    indicators as confirmation of a move, up or down.


    A technical analysis chart, drawn based on historical prices and trading volume
    data, represents the past decisions made by investors on the buying and selling
    of cryptocurrency assets. As investors, we use past data to predict future investments.
    For example, a typical investor who bought Bitcoin will monitor the price of Bitcoin.
    If the price falls in comparison to the initial buying price, the investor may
    wait until the price reaches the break-even point to sell the cryptocurrency.
    As savvy investors, we recognize this as Support/Resistance (explained later in
    this book) and can use this to our advantage.


    Price movement is influenced by both internal and external constraints. Multiple
    forces including human emotions like fear, panic, greed, anxiety, hope, and hysteria
    affect the prices of cryptocurrency. These emotions lead to dramatic shifts in
    the prices of cryptocurrency assets. Therefore, price movement is not only based
    on facts, but also on expectations.


    ### Trend Analysis


    Trend analysis uses technical tools to determine price movements; it helps traders
    know when to buy, sell, or hold a cryptocurrency asset. This technique analyzes
    past cryptocurrency prices to predict future price movements. It determines an
    upward trend when asset prices continue to rise and detects a downward trend when
    prices keep decreasing over several consecutive days.


    Trend lines, moving averages, and polarity analysis are the major tools used to
    determine price trends. They are used to show the consistent movement of prices
    either up, down, or sideways. Price movements vary, based on the timeframe and
    whether the investor is observing on a daily, weekly, monthly, or quarterly basis.


    ### Drawing Trend Lines


    Straight lines are drawn above and below the price line. Trend lines also show
    support and resistance areas, which can determine when to enter or exit a trade.
    Trend lines can show increased supply or demand.


    Downward trend lines are drawn above the price of the plotted chart, while upward
    trend lines are drawn below the price. The upward trend line is used to estimate
    support, while the downward trend line is used to estimate resistance.


    ### Rules of Thumb for Trend Lines

