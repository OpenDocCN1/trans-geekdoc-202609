    First, `Litecoin` is going to work with a software algorithm to mine units. This
    can help prevent individuals from making customer computers to mine the currency.
    In addition, the transaction times with `Litecoin` are one of the fastest of all
    the currencies. Right now, `Litecoin` can get transactions done in less than three
    minutes, while it usually takes `Bitcoin` about ten minutes.


    `Litecoin` is a currency just like `Bitcoin`, so you will be able to use many
