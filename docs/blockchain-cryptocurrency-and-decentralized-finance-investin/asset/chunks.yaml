- fmt: '

    Let’s call our DApp, the `dAirbnb`. This app rests on the blockchain and in a
    series of connected Smart Contracts. For starters, the app would house a review
    system that allows all users to verify one another’s behavior and track records.
    Is the owner’s property a good deal? Is the renter a good person to rent to? Everyone
    can upload pictures of their properties but don’t have to upload pictures of themselves
    if they don’t want to. I’ll explain why shortly.


    The filters that you find on Airbnb regarding wifi, laptop-friendly workspaces,
    and washing machines will exist. In fact, the interface will look exactly like
    Airbnb’s. The difference is entirely under the hood. When you communicate on the
    app, messages and interactions aren’t stored on a database. They’re stored in
    a blockchain ledger. The messages themselves are cryptographically signed, which
    makes them impossible to hack.


    You and the property owner are the only ones who can ever read those messages.
    What’s more, you can exchange contact information with one another easily. Airbnb
    doesn’t allow its users to do this since it leads to both parties signing a deal
    offline. That hampers the platform’s revenue. However, the DApp isn’t concerned
    with this since the incentive to interact on it is far greater than offline interaction.


    ## Reputation


    A decentralized app doesn’t have any single authority in charge. This means the
    review system is more important than ever. The more reviews a user has, the better
    their experiences will be. Now let’s take this a step further. What if `dAirbnb`
    was just one app that rested on a blockchain that contained several other apps?


    There could be `dGrocery` that allows you to order groceries online, `dUber` for
    transportation, `dStylist` for any personal grooming, and so on. An entire ecosystem
    of apps that collect reviews from various other users who can attest to your character
    after having interacted with you. If you’ve never rented on `dAirbnb` before,
    landlords can view your reviews from other interactions in the ecosystem.


    That is a dystopian nightmare if a centralized system was in charge. However,
    everything is on the blockchain, and thus, users are in full control of their
    data and interactions. Reveal what you would like to and withhold everything else.
    If another user needs sensitive information (as defined by you), you can send
    it to them securely, knowing that they cannot exploit it. That information isn’t
    going to be stored on some database where it’s vulnerable to a hack. Thus, managing
    and building a reputation on `dAirbnb` is far easier than choosing to do so offline.


    ## Identity Verification


    Talk about the blockchain, and the first objection people have is that no one’s
    identity can be verified. That isn’t correct as you’ve already learned. Opponents
    of the blockchain like framing it as a system that allows anyone to assume any
    identity. However, this isn’t how the blockchain works. Users can verify another
    person’s ID depending on their needs.


    It’s just that identity is removed from the center of attention, and this is a
    tough pill to swallow. Furthermore, the way blockchain apps verify ID is different
    from a centralized app. Airbnb, for instance, allows you to view the other person’s
    name and other information. Generally, this is harmless since people don’t share
    sensitive information. However, to verify your ID, Airbnb collects information
    from sensitive documents like passports and IDs. An ID verification protocol on
    the blockchain works differently. In essence, it’s a Smart Contract drawn between
    two parties. The contract sits in between both parties and verifies that both
    are who they say they are. Neither party is provided sensitive information or
    any information beyond what the other person is willing to disclose.


    Let’s say you’re booking a room on `dAirbnb`, and the landlord wants to know whether
    you are who you say you are. `dAirbnb` invokes a `SmartID` protocol, a separate
    app on the blockchain that verifies your ID securely. Again, there’s no danger
    of a hack or cyberattack. You share your picture and name with the landlord, and
    that’s it.


    In return, you get to verify whether the landlord has a physical space ready for
    you and that they aren’t copying someone else’s listing or doing something shady.
    The result is a system that is far more secure than conventional Airbnb. The decentralized
    app is completely peer-driven and enhances trust between people despite very little
    personal information being revealed.


    Compare this to an offline transaction where you’ll need to hand over your physical
    ID document and have someone verify it. The blockchain offers a far safer experience,
    and this is a powerful incentive.


    ## Risk Management


    Risk on the blockchain isn’t managed as much as it’s eliminated. Centralized databases
    can be leaked, hacked, and sold to the highest bidder. Decentralized apps don’t
    store information in a single place. Thus, there’s no comparison to safety on
    the blockchain versus what any other solution offers.


    ## Insurance


    Airbnb offers property owners $1 million in insurance protection against damages
    and theft. It’s one of the few value drivers that the platform provides. A cynic
    might say it’s just another way of washing their hands of responsibility; however,
    the presence of insurance cover gives landlords peace of mind.


    A decentralized app would provide the same degree of protection but with greater
    efficiency. `dAirbnb` would simply invoke another protocol, call it `dInsurance`,
    where multiple insurers get to view renter and landlord data and tailor quotes
    based on the individual.


    Thus, good renters will have to pay lower insurance premiums while renters with
    bad reputations will pay more. Landlords can rest assured that their unique needs
    are being covered. Note that risk evaluation doesn’t depend on someone’s identity.
    It solely depends on their transaction history on `dAirbnb`.


    Insurers won’t need ID proofs or any other sensitive data to verify who you are.
    Relevant information is already present on the network, and all they need to do
    is access publicly available transaction data. The insurance contract can be sent
    as another Smart Contract that involves all parties and is secured by a `multi-sig`.


    Thus, the whole experience is peer-driven, and `dAirbnb` facilitates this connection.
    It doesn’t sit in the middle collecting rent for the privilege of offering you
    a connection to some other party.


    ## Payments


    That is one of the biggest advantages of using a dApp. Owners don’t have to wait
    for lengthy periods to receive money since they get it instantly. Renters often
    complain of security deposits being withheld for no reason. Well, a Smart Contract
    that places deposit money in escrow solves that issue. In fact, there won’t be
    any need for a deposit in a long-term rental arrangement.


    The lease itself will be a Smart Contract. If the renter breaks terms, the contract
    automatically compensates the owner for damages. Any data and evidence to back
    claims and to record original conditions can be uploaded to the contract, and
    all parties can verify it.


    In case of a dispute, an impartial third party can be given access and the issue
    can be settled. If the dispute goes to a court of law, there’s no way for either
    party to modify or manipulate the situation since everything is recorded. The
    result is a safer and seamless experience for everyone involved.


    ## Access


    One of the hurdles of monetizing a property on Airbnb is that guests can rarely
    check themselves in. IT technology has improved to the point where everyday devices
    can now run themselves or can be controlled through an app. Smart locks are available
    but automating their functions is tough. For instance, owners can activate smart
    locks to let people in, but they have to physically verify whether the guest’s
    information matches what is on the platform.

