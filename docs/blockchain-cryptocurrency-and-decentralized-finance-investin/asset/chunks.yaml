- fmt: '

    When buying into an ICO, you''re purchasing the cryptocurrency that the blockchain
    firm has offered. This in no way entitles you to an ownership piece of the business.
    By owning `XRP`, you don''t suddenly have a vote in how `Ripple` operates. By
    purchasing `ether`, you do not have a say in `Ethereum`''s next upgrade. Instead,
    you''re simply buying the currency and can decide when to sell it.


    This differs significantly from an IPO. By owning stock in a public company, you
    do get a vote. If you have thirty shares, you have thirty votes. While this doesn''t
    necessarily allow you decision-making powers, it does give you some say in how
    your investment operates. It also provides you with some investor protections,
    offering recourse if the company acts fraudulently.


    ## You Don''t Get Insight into the Company


    ICOs have become a notorious microcosm of the Crypto investing experience since
    they''ve become a prominent way to scam investors. This has brought much criticism
    toward the regulations regarding ICOs because companies releasing the coins don''t
    have to provide much information about how they operate, what strategy they have
    for growth, and what plans they have moving forward. They don''t have to share
    their balance sheets, provide documentation that they''ve even made a sale, or
    show profit figures. In essence, these companies are ghosts beyond what information
    they independently choose to share with potential buyers of the coin.


    That''s not the case when you invest in an IPO. Prior to the launch of the IPO,
    the companies are required to provide detailed financial information to the `SEC`.
    This becomes public prior to the date of the IPO, so investors interested in the
    company can weigh the health of the firm.


    ## It''s a Start-up That''s Launching the ICO


    The companies that launch ICOs are fairly young firms. They don''t have a long
    history of success, years of profits, or even a plethora of investors (although
    some do have an angel or series-A investors). Typically, a company launching an
    IPO has shown the ability to grow revenues or profits for some time. Since the
    financial information of the company will become available during the IPO process,
    institutional and retail investors will judge the company''s performance, providing
    a harsh look at where it has been and where it''s going. This weeds out companies
    that have no real reason to go public other than as a quick money grab. These
    bad players are more difficult to discover during the ICO process.


    The appeal of investing in ICOs comes from the ability to get into a new coin
    for incredibly cheap, which gives you the opportunity to own a larger share of
    the name. The other reason? Bragging rights for getting into a coin early that
    then takes off. Both of these are fine reasons for owning an ICO name. Just know
    that if you choose to go this route, there''s a far better chance that the money
    you''re spending will never be seen again.


    ## You Can''t Know Which Coins Will Rise


    It took `Ethereum`''s `ether` nearly two years to rise consistently above $20
    a coin. Early investors in `ether` wouldn''t have found it to be a particularly
    exciting investment until 2017. There''s a likelihood that many early investors
    left, tired of waiting. The point is that investing in ICOs is extremely risky
    since you can''t know which coins will take off, because there''s very little
    information about the blockchain that supports the coin, and it could take years
    before your initial investment thesis plays out.


    It, therefore, won''t hurt to wait a while before selling off your cryptos after
    an ICO. The flip side of the `ether` story, taking two years to reach $20, is
    that it would have given any investor far more time to buy into the coin, as more
    information about the technology became known. Over the two years in which `ether`
    did very little, the world grew to know the founder, `Vitalik Buterin`, and `Ethereum`
    had started to court large companies that showed interest in the blockchain technology.
    It gives you time to know which ones seem like legit businesses. Sure, you''ll
    own fewer shares, most likely, but there''s an improved chance you''re not throwing
    your money at a bad business.


    ### 1. They''re Mined

    This is the process that `Bitcoin` made popular. Deep within the blockchain''s
    code, there are a certain number of coins, and miners look for those coins to
    uncover new ones. Once they''re uncovered, miners can then sell the coins to the
    market, just as you would sell them. The difference is the miners didn''t have
    to pay market rates to obtain the treasure. If there''s a market, as there is
    for `Bitcoin`, then the coins will be snatched up quickly.


    ### 2. They''re Controlled

    The company `Ripple` used a controversial strategy when it launched its Crypto,
    the `XRP`. Instead of an ICO, it mined all the coins, gifting a large portion
    of them to their executives. They then trickled out coins periodically, based
    on a number that the company determined would drive demand and ensure supply.
    The community turned against `XRP` due to this setup, so the company decided to
    take about half of the total `XRPs` and place them in an escrow account. The account
    funnels out 1 billion `XRPs` each month. If any of the coins go unclaimed that
    month, then the `XRPs` return to the escrow account until all of the `XRPs` are
    in circulation. It''s a unique setup, one that might have an appeal to other companies,
    since it does offer some control in the coin.


    ### 3. They Fork

    Blockchains are (typically) open-source software, and a community can sometimes
    tweak, test, change, and improve the system, seeking upgrades to the way it operates.
    Since there are weaknesses in the original blockchain (particularly when speaking
    of `Bitcoin`) the community sometimes wants to tweak the blockchain that the Crypto
    runs upon. If the community, in mass, approves the tweak, then a new coin isn''t
    produced. But sometimes, the community disagrees with a solution. In this case,
    the minority group produces what''s referred to as a `hard fork`, where an entirely
    new coin develops. A `hard` and `soft` fork.


    While the mechanics of creating a hard and soft fork can be complicated, generally
    speaking, if the community of users and developers of a blockchain decides to
    make an improvement that the majority of the community or developers agree with,
    then it creates a `soft fork` or a switch in the code that the original cryptocurrency
    will adhere to. This means the currency continues on under the new rules, without
    changing the makeup of the coin.


    Sometimes, though, this change isn''t approved by a vocal minority within the
    crypto community, which leads to a disagreement on the future of the Crypto. These
    disagreements can arise when the minority group believes the blockchain should
    change to improve the coin in some way, or it can arise because the majority believes
    a change must occur and the minority group disagrees. Instead of holding hostage
    the wants of the vast majority of the community, which agrees with the change,
    a minority forces a `hard fork`, in which a large percentage of developers will
    move with the original coin. The ones who disagree with the larger community will
    create a new cryptocurrency, which takes into account the less popular decision.


    But what happens in a hard fork? When a hard fork occurs, creating a new cryptocurrency,
    it''s similar to a stock split. Current holders of the currency will receive a
    certain amount of the new coin. For instance, when `Bitcoin cash` was created
    during a hard fork of `Bitcoin`''s blockchain, a `Bitcoin` holder received one
    `Bitcoin cash` if they owned `Bitcoin` at the time of the fork and the exchange,
    they used recognized `Bitcoin cash`. It''s not always this one-to-one dynamic;
    there are instances where a split will lead to receiving multiple coins of the
    new token.


    Now, let’s go back to the safest ways to buy cryptos.


    ## Finding the Right Exchange

