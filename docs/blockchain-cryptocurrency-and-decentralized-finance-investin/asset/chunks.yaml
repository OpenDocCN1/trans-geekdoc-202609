  trans: '

    疫情留下的遗产不仅是死亡或经济衰退，它还开启了人们发现新机会的大门。我们面临的这种不便触发了我们内心的渴望，许多人将业务搬到了线上。同样，这种趋势促进了区块链以及许多智能合约的发展，它之所以取得进步，不仅是因为最显而易见的原因——疫情，而是因为加密货币网络
    `Ethereum` (`ETH`) 的去中心化本质，使其赢得了显赫地位。


    `Ethereum` 2.0 行动计划的构建已经让许多人起了一身皮疙瘩。这是区块链社区的未来。关于先进的加密货币 `Ethereum` (`ETH`) 2.0，我们绝对会有很多惊喜。


    我并不是什么大师——事实上，在说出“我搞定了”之前，我会在事情上投入大量的精力。我也不是什么预言家，但我真的认为 `Ethereum` 在过去几周的稳定增长率并非上帝的奇迹，而是因为即将到来的、具有前景的加密货币——`Ethereum`
    (`ETH`) 2.0，它已经从以前的工作量证明 (`PoW`) 共识转向了权益证明 (`PoS`) 共识。


    没有人应该夺走丛林之王的地位，或阻止它的咆哮，我们也不能说母狮作为猎人应该保持沉默或停止狩猎。`Bitcoin` (`BTC`) 拥有最高的市值和价值，但作为一种代币，`Ethereum`
    过去做得且目前做得很好。


    作为一种代币，这种加密货币可能是最有计划性的一项尝试，它在区块链虚拟世界中通过几个步骤或阶段实现了实际目标和成就。毫无疑问，加密货币 (`ETH`) `Ethereum`
    在我们拥有的加密货币中市值第二，仅次于 `Bitcoin` (`BTC`)，它就像一艘载着其他较小船只的容器。


    我想说的是`Ethereum` 允许其他区块链项目和应用（如 `Defi` 应用）进步。这种加密货币正张开双臂，准备好向我们展示它的第二代，以及在其第一代为我们提供的一切基础上，它在增长、发展或进步方面又取得了多少成就。


    `Ethereum` (`ETH`) 2.0 令人担忧的是，尽管它喜欢用其区块链承载较小的船只，但在这个区块链上的应用越多，成本就会增加，其速度水平也会受到影响。


    我记得之前用过 `TPS` 这个缩写，很抱歉我没有解释它。每秒交易数，就是该缩写的意思。每当加密货币 (`ETH` 1.0) 发生拥堵时，每秒交易数就已达到极限，这会对任何
    `Ethereum` (`ETH`) 1.0 应用的设计或编程造成严重阻。


    当涉及到加密货币 `Ethereum` (`ETH`) 2.0 概念背后的愿景时，需要修饰 `Ethereum` 直到它完全具备能力或成熟到足以承担协助人类的责任。


    在修饰阶段（目前仍处于这一阶段），迫切需要进行许多合理且创意的修改，以改进其特性，如安全性、可持续性和规模。为了让 `Ethereum` (`ETH`) 被充分利用，它需要将其共识算法从工作量证明
    (`PoW`) 转向权益证明 (`PoS`)。


    该计划甚至不是使用电子设备（计算机）作为矿工节点，它基本上是用户通过质押他们的 `Ethereum` (`ETH`) 来成为验证者，并承担类似于工作量证明
    (`PoW`) 共识算法中矿工的那种责任。


    矿工也进行质押，但他们需要质押 32 个 `Ethereum` (`ETH`) 才能真正成为验证者。我们期望能源效率达到极高水平（至少比以前好），降低准入门槛，大幅减少所需的硬件，并加强一切，对任何形式或迹象的中心化具有更好或更高的免疫力。


    `Ethereum` (`ETH`) 2.0 的设计旨在增加其之前的分片链，这将显著提高每秒交易数 (`TPS`) 的速度。


    分片是一种谨慎的逐步程序，意在对数据库进行水平拆分，以对负载产生扩散影响，这被认为可以减少 `Ethereum` (`ETH`) 网络的拥堵，并通过创建新链最终增加每秒交易数
    (`TPS`)。


    `Ethereum` (`ETH`) 2.0 的这个问题还涉及另一链；该链被称为“信标链”（Beacon Chain），在 `Ethereum` 复杂的路线图中被称为“0
    阶段”，它是 `Ethereum` 2.0 的基础组成部分。


    预期的计划是让成为 `Ethereum` 系统权益证明 (`Pos`) 的先驱，并承担协调者的角色。这条特定的链从分片链（64 条分片链）接收状态详情，并确保系统中其他分片链的可用性，以确保网络的完全同步。它还承担了管理验证者的额外责任，从质押注册到发放奖励和惩罚。


    验证者恰好是 `Ethereum` (`ETH`) 2.0 的主要参与者，负责全年 7x24 小时的网络保护。


    保持 `Ethereum` (`ETH`) 2.0 网络始终在线且活跃的整个数字程序中很大比例属于验证者，他们主要且最大的责任仅仅是保证他们个人的网络连接不会波动，并且他们负责的所有设备都连接到稳定的电源。


    ## 加密货币与代币的区别


    非同质化代币 (`NFT`) 是一种基于区块链的单一资产加密令牌。它可以是完全数字资产，也可以是物理资产的代币副本。由于 NFT 不是相同的，它们可以作为合法性和所有权的证明。加密货币的每个单元都是相同的且不可区分，这被称为同质性。例如，法定货币就是同质的，一张百元钞可以被任何其他实际的百元钞取代。


    ## 你需要了解


    NFT 是一种独特的加密令牌，在区块链上无法复制。艺术、音乐、身份证、活动和房地产等都可以使用 NFT 表示。


