    -   费用和佣金：每笔交易的手续费和佣金随交易所的不同而异。某些平台可能会收取高额费用，这可能会影响利润率或扩大亏损。

    -   用户界面：新交易者倾向于操作简单、没有太多复杂功能的加密货币交易所。在具有针对专业交易者的高级工具的复杂平台上进行交易可能会导致资金损失。


    你应该注意的其他关键因素包括地理限制、流动性、隐私政策等因素。如果能向专业交易员寻求关于加入哪个加密货币交易所的建议，将非常有帮助。这些经验丰富的交易者可以在你学习交易时帮助你避免许多错误。现在让我们来看看我们高度推荐给新交易者的最佳以太坊交易所：


    ## Coinbase


    Coinbase 于 2020 年 6 月成为美国成立的第一家加密相关业务。Coinbase 是一个数字市场，方便买卖以太坊及其他 20 多种加密货币。此外，你可以使用
    Coinbase 在不同加密货币之间进行兑换或将加密货币发送到各种地址。


    这些要求是为了遵守联邦法律法规。要在 Coinbase 上购买以太坊，你需要在 Android 的 Play 商店和 iOS 的 Apple Store 下载移动应用。打开应用并点击“开始使用”。使用你的电子邮件地址注册
    Coinbase 账户，现在你可以验证你的账户并输入所需的 KYC 详情。成功创建账户并验证后，你现在就可以继续购买以太坊了。在屏幕顶部，你可以查看平台上购买的加密货币列表。选择以太坊并选择你想要购买的金额。然后继续预览购买，在检查订单后点击“立即购买”。


    ### 为什么选择 Coinbase？

    -   低汇率。

    -   安全可靠。

    -   支持使用法币购买。


    ## Kraken


    Kraken 是最早建立的加密交易所之一，支持包括以太坊在内的 70 多种不同加密货币的交易。Kraken 用户享有多项收益，包括提高安全性、法律合规、限价单和止损单，以及超过
    50 种交易对的选择。该平台拥有大量用户且交易量巨大，使其具有高流动性。


    ### 为什么选择 Kraken？

    -   巨大的流动性。

    -   你可以用十种以上的其他加密货币交易以太坊。

    -   低交易手续费。

    -   Kraken 可用于 90 多个国家。


    ## Bittrex


    Bittrex 被认为是最安全的加密交易所之一。这家位于内华达州的交易所由一组拥有超过 50 年总经验的专业交易员于 2014 年创立。尽管 Bittrex
    采取了仅列出安全数字资产的主题，但它支持近 200 种不同加密货币的交易。


    ### 为什么选择 Bittrex？

    -   低交易手续费。

    -   稳固的安全。

    -   仅列出可靠的加密资产。

    -   拥有近 200 种支持的币种。


    ## 以太坊钱包


    目前市场上流通有很多以太坊钱包。为你的以太坊代币选择正确的钱包取决于其他几个因素，即：

    -   你需要的存储类型。

    -   你频繁交易吗？

    -   你打算从哪个平台访问钱包（桌面、智能手机、网页等）。


    ### 以太坊钱包的类型


    建议从下面列出的不同钱包类型中选择适合你的方法：

    -   软件钱包：易于访问且获取廉价。最适合经常交易的人。

    -   硬件钱包：使用物理芯片离线存储以太坊。例如 `Ledger Nano`。

    -   纸钱包：这些是印有私钥的纸。


    ### 以太坊热钱包


    热钱包是指需要连接互联网的钱包。存储在热钱包中的以太坊代币可以在全球任何地方轻松访问。除了方便之外，热钱包并非最安全，如果恶意攻击者获取了你的登录详情，它们可能会被破解。它们是免费的，任何人都可以从世界上任何地方访问它们。一些最佳以太坊钱包包括：

    -   `Metamask`。

    -   `Exodus`。

    -   `Trust wallet`。

    -   `Mist`。


    ### 以太坊冷钱包


    冷钱包是指使用物理设备离线存储以太坊的设备。使用冷钱包的主要优点是安全性，它们是离线的，因此不易受到黑客攻击。然而，与免费的热钱包相比，冷钱包通常较为昂贵。此外，它们支持一些资产。市场上一些最好的冷钱包包括：

    -   `Ledger nano`

    -   `Trezor`


    ### 以太坊经纪


    以太坊经纪可以描述为市场中买家和卖家之间的中间人。主要有两类以太坊经纪：以固定价格买卖以太坊代币的简单平台，以及允许实时买卖数字资产的复杂平台。


    以太坊经纪的主要功能实际上是匹配市场的买家和卖家。例如，如果你有一笔现金并想购买以太坊代币，经纪会找到愿意出售的卖家并完成交易。在某些情况下，取决于交易平台，经纪充当买家和卖家。


    复杂的经纪平台采用差价合约（CFD）交易的概念。交易 `ETH` CFD 允许你即时开启和关闭并应用杠杆交易。然而，值得注意的是，当你交易 `ETH` CFD
    时，你并不拥有真正的以太坊代币，而是对以太坊的价值波动进行投机。


    ### 交易所和经纪的区别是什么


    以太坊经纪和以太坊交易所让很多人感到困惑，特别是在引入保证金交易等经纪功能之后。两者的主要区别在于运作方式。以太坊经纪定义他们愿意出售以太坊的价格和佣金。他们可以是
    `ETH` 代币的持有者，也可以与其他平台或经纪合作以确保有足够的供应。


    另一方面，以太坊交易所涉及许多交易者以当时的市场价格同时买卖以太坊对。然而，在卖家同意交易之前，订单是不完成的。


    经纪和交易所都存在于传统的金融系统中。


    ## 如何交易以太坊


    那些具有交易基础知识的人可以开发交易以太坊的策略。在交易所交易以太坊其实非常简单。以下是如何使用法币购买 `ETH` 代币的步骤指南：


    ### 打开账户和交易所平台


    选择一个适合你交易需求的交易所平台。有很多很好的加密货币交易所可以直接购买以太坊，而其他较小的山币需要先购买比特币然后进行转换。


    注册后，许多交易所平台要求你提交 KYC 详情以符合监管要求。可能会被要求提交身份证明和居住证明。然而，也有少数交易所不需要这些细节，例如 `Changelly`
    和 `Shapeshift`。


    ### 充值


