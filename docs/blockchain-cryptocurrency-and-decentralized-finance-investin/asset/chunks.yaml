- fmt: '

    The blockchain can automate this entire process thanks to `Smart Contracts`. A
    `Smart Contract`’s terms can be linked to a smart lock. Once the guest approaches
    the lock, they can present an electronic key that is encoded into the `Smart Contract`.
    If the key matches, the door unlocks, and the guest checks themselves in.


    A single `Smart Contract` can govern the entire rental workflow this way. Owners
    can manage their properties remotely knowing that their properties are secure
    and that no manipulation is possible. It reduces the impact a property management
    firm can have on fees and profits that the owner can collect.


    ## Open Network Companies


    As the case study of the `dAirbnb` platform shows, peer-driven networks can change
    the nature of an organization completely. Instead of assuming a centralized shape,
    organizations of the future can simply transform into a network of connected apps.
    The `dAirbnb` platform you just looked at uses an identity verification app and
    an insurance app. These entities are separate from each other and don’t have to
    be owned by the same corporation.


    Decentralizing the structure of an organization has other effects too. For starters,
    the amount of capital needed to compete in the marketplace is reduced considerably.
    If someone wants to create a platform that has better features than `dAirbnb`,
    all they need to do is establish connections to apps in the ecosystem and develop
    their app to the best of their abilities.


    Given the open-source nature of the blockchain, it opens everyone up for competition,
    and big companies cannot buy their way forward. For example, `Google` currently
    buys any company that can even remotely develop a better search algorithm than
    them. That is to stave off competition. Most owners sell to `Google` because the
    prospect of going against a trillion-dollar behemoth that effectively controls
    the internet is a losing prospect.


    Similar patterns play themselves out in social media networking and technology.
    For instance, `Apple` has walled its app store off completely from other networks
    in the name of security and holds developers captive to its demands. The internet
    was meant to be an open marketplace, free for everyone to compete, but big corporations
    have captured their corners of it and will never let go.


    The blockchain brings greater efficiency to the market thanks to decentralization.
    Companies can reduce their internal search costs as previously described, and
    this leads to the creation of novel business models. Here are some possible ventures
    that we might see in the future.


    ### Just in Time Sourcing


    Just in time or `JIT` deliveries offer the best combination of efficiency and
    cost control for manufacturing firms. Setting up `JIT` sourcing currently costs
    a lot of resources, and only large corporations can afford them. The idea of `JIT`
    is that raw materials arrive just when they’re needed for production. That reduces
    storage costs and makes freight transportation more efficient.


    To make sure this happens, companies have to create large databases of suppliers
    and delivery tracking systems of their own. That allows them to monitor every
    action and predict the efficiency of their systems. The irony is that increased
    control doesn’t give them an advantage as `JIT` is hard as ever to set up.


    The blockchain simplifies `JIT` immensely by making the entire network of suppliers
    transparent. What’s more, the track record of every supplier can be instantly
    verified, and there’s complete trust in the system. Thus, smaller organizations
    can create better processes and reduce their working capital needs even more.
    The result is more efficiency, lower costs, and better business practices for
    everyone.


    ### Autonomous Agents


    When talking of companies, we think of corporations that have employees, offices,
    servers, and so on. What if the company can be fully automated via a smart agent
    that roams a decentralized network, making deals that benefit the organization,
    updating itself to account for competition, and incorporating new products to
    serve customers better?


    `Smart Contracts` are more than just lines of code. They can be taught to do literally
    anything. Currently, technology limits us from automating them beyond a few simple
    tasks. A lot of automation comes in the form of validation against existing conditions.
    However, nothing is stopping `Smart Contracts` from learning and interacting with
    a larger ecosystem.


    For instance, `Amazon`’s pivotal business for a while has been its `AWS` or cloud
    computing business. The company allows other organizations to rent server space
    and remove the need for physical server infrastructure. What if `AWS` was replaced
    by a `Smart Contract` on an open blockchain?


    This contract would seek out peer computers in the network and evaluate the amount
    of free storage space available. The contract would sign another contract with
    the peer computer and lease storage space. It would then turn around and list
    that space to users who can rent that server space.


    All a human being would need to do is monitor the rules governing the contract.
    They would need to ensure it doesn’t violate any peer rules and that server needs
    are correctly met. Thus, companies can become far leaner than they currently are
    and become a network of `dApps` and `Smart Contracts` interacting with each other.


    If you’re catching on, this sounds eerily similar to AI development. The problem
    with AI development currently is that it’s entirely in the hands of a select few
    corporations. What if its development were democratized? Surely, the pace of development
    would be much faster, and the result would be a corporation run by `Smart Contracts`,
    with human handlers making sure the boundaries of that system are preserved adequately.


    The nature of a corporation as we know it is to earn profits. However, such open-source
    corporations aren’t in it to make money. A robot doesn’t need to be paid after
    all. Service fees can be kept low, and value becomes the primary driver. As a
    result, the cost of resources decreases.


    How will this interact with a capitalist society? Well, it’s too early to tell.
    However, there’s no doubt that the paradigms that we take for granted will be
    challenged. Will the increasing development of `Smart Contracts` lead to humans
    not being needed at all? What if one `Smart Contract` could monitor another, thus
    removing the need for a human handler?


    What does the function of humanity become in such a society? Again, it’s too early
    to tell. There are best and worst-case scenarios at play. Whatever happens, there’s
    no doubt that removing something as powerful as AI from centralized control can
    only be a good thing for society as a whole.


    ### Art Creation


    While the internet did a great deal to bring information to the masses, it never
    managed to compensate the people who created that information. The downfall of
    newspapers and publishing houses and the takeover of nonsensical Buzzfeed-like
    websites is one of the many ways the internet affected media consumption.


    What’s more, these media houses still exercised massive control over what was
    reported. These days, we have social media platforms like `Facebook` to contend
    with over and above these clickbait websites. While the blockchain cannot resuscitate
    long-gone newspapers, it can definitely ensure that the people who create original
    content are rewarded for their efforts.


    Currently, content creators have to use centralized platforms to spread their
    message. For example, an aspiring journalist has to maintain a blog, a `Twitter`
    account, and a `Facebook` profile to source and report stories. In addition, their
    stories appear on a website that exercises further control over output. In most
    cases, content creators lose rights to their work and don’t get compensated for
    how often it gets shared or consumed.

