  trans: "\n\n*   DEX 通过遍布云端的各个节点运行。这意味着即使某些服务器出现访问问题或受到攻击，它仍将能够继续运行。\n*   它具有更高的隐私性，因为你不需要与第三方共享数据。大多数\
    \ DEX 都不具备 KYC（实名认证）要求。这意味着你可以保持完全的匿名性。\n*   由于 DEX 允许你保留自己的私钥，因此你保留了对自己账户中资金的控制权。\n\
    \n## 去中心化加密货币交易所 (DEX) 的缺点\n\n去中心化交易所并不适合所有人，因为它们存在一些严重的缺点——尤其是对于新手而言。以下是每个人都应该知道的\
    \ DEX 缺点：\n\n*   工作量更大，因为通常情况下，交易和转账等交易由中心化加密货币交易所承担。\n*   它们不受监管或没有保险。中心化交易所拥有资金可以随时退还货币。这就是为什么他们保留了托管资金以便快速提现。\n\
    *   大多数 DEX 不允许通过信用卡、借记卡或银行转账支付。\n*   价格较低且交易量有限，这可能导致手续费较高。\n\n*   去中心化交易所提供的服务有限。通常不提供止损服务，包括保证金交易和法币货币。\n\
    \n# 第 4 章：比特币\n\n[`www.shutterstock.com/it/image-illustration/bitcoin-blockchain-cryptocurrency-digital-encryption-money-2063418779`](https://www.shutterstock.com/it/image-illustration/bitcoin-blockchain-cryptocurrency-digital-encryption-money-2063418779)\n\
    \n比特币区块链上的每笔交易都可以在公共记录中供公众查看。通过这种方式不需要任何中心机构，这意味着任何必须进行的维护都将由系统完成，以保持软件以最大潜力运行。例如，一个发送给另一个比特币用户的交易；它将在网络上广播某人向人\
