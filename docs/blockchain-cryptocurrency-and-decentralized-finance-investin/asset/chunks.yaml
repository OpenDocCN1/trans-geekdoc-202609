- fmt: '

    Despite the fact that the name is a play on the concept of the initial public
    offering, initial coin offerings have little in common with their namesakes save
    for the name. `ICOs` are essentially little more than a new way for cryptocurrency
    and blockchain companies to crowdfund their new ideas. This is done by releasing
    an early round of the cryptocurrency that will (in theory) be at the heart of
    this new endeavor at a rate that is (theoretically) going to be far less than
    what it will be worth when things are up and running.


    In exchange for the chance at easy profits, if things go as planned, investors
    get in on the ground floor, and the company in question gets the money that they
    need to follow through on the creation of their product or service in the first
    place. While it is inherently riskier than investing in other types of established
    cryptocurrencies, it really only requires the cryptocurrency in question to experience
    one really strong upswing for it to prove profitable in the end. This is far from
    guaranteed, however. So far, most of the movement in the `ICO` space has been
    based on the `Ethereum` platform.


    While much of the early `ICO` funding has come from China, which has long proven
    to be heavily committed to the advancement of blockchain and cryptocurrency technology,
    investors from all over the world have been known to open their wallets if the
    price is right. Nevertheless, before you follow suit, it is important to keep
    in mind that investing in an `ICO` naturally comes with a number of different
    caveats as well.


    The first of these is that there have already been inquiries made into several
    `ICOs` by the `Securities and Exchange Commission` regarding avoidance of regulations
    including approval of company fundamentals and a business plan that holds water.
