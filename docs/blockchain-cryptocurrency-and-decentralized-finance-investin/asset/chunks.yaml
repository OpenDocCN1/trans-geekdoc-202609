    Other bitcoin platforms such as `ethereum` are developing their own blockchain
    that is going to be similar to the bitcoin blockchain. However, since `etherum`
    is still brand new, it is always evolving to meet the needs of its users while
    keeping the system decentralized.


    ### Tens of Thousands of Merchants Are Using Bitcoin


    Having that many people using bitcoin would be amazing! But, sadly, there are
    not very many merchants out there that are going to accept bitcoin for payment.
    There is only around eighty percent of cryptocurrency being used for hoarding
    instead of actual spending. So, if a merchant allows you to use cryptocurrency
    to pay for a good or service, then they are going to be letting you use them in
    a facility that is their partner, which means that they are going to take the
    digital currency and turn it into actual money so that they can use it to buy
    things that need to be purchased to keep their business running. But, there are
    going to be risks and fees that are put in place when you.


    There are many people using bitcoin, but there are not very many merchants out
