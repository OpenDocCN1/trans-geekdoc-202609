    虽然这有时会导致你无法总是做出最佳交易或错失机会，但它也让你拥有获得巨大收益的机会。由于整个理念的核心是尽可能赚取更多资金，因此你掌握的知识越多越好。当然，你不希望做出缺乏判断的决策，所以请确保你所听到的传闻来自可靠来源。关注其他交易者、与交易和投资相关的媒体以及其他类似的来源。只要传闻来自可信来源，并且有很多人在讨论，那么它就很有可能实现。然而，如果你担心它不会实现，你也可以一直投入较少的金额。


    # 练习并变得熟悉


    在加密货币交易和投资方面，最终目标是让你花时间、练习并变得熟悉。如果你使用即使丢失也不会对你产生重大影响的非批判性资金进行练习，那么你早期犯的任何错误都是容易原谅的。


    开始任何新事物，尤其是交易和投资，可能会让人困惑。初期，你正在学习如何操作新软件、存储硬币并理解市场。给自己一些时间去练习来弄懂这一切，一旦它开始对你产生意义，你就可以投入更多资金。你越擅长操作软件、越习惯转账和存储资金，并越清楚何时买入和卖出硬币，事情就变得越容易。此外，这将给你时间学习如何保持耐心并积累整体市场收益，而不是变得焦虑并频繁交易。一旦你习惯了整个过程，对你来说将变得简单，你可能会发现通过这种投资和交易形式产生惊人的回报。


    你的风险应该被明智地管理。不要将所有资金投入单笔交易或一种硬币中。寻找可以累积的小额利润，但不要寻找币价的峰值。


    # 最流行的加密货币交易所


    如果你在网上进行搜索，你会发现许多不同的加密货币交易所。作为投资者，与值得信赖的交易所平台合作至关重要。让我们来看看最流行的加密货币交易所：


    ## Coinbase


    Coinbase 在全球拥有数百万投资者和客户。它可能是世界上最流行的交易所平台。Coinbase 让买卖特定的加密货币变得非常简单。Coinbase 目前仅提供三种加密货币：比特币（Bitcoin）、以太坊（Ether）和莱币（Litecoin）。它拥有良好的声誉，深受专业投资者的信任。


    ## Kraken


    Kraken 起于 2011 年。它提供多种加密货币，包括瑞波（Ripple）、门罗币（Monero）、ICONOMI 以及其他山币。它不仅允许你买卖加密货币，你还可以用法币（如美元、日元等）交易比特币。


    ## Cex.io


    Cex.io 也提供了不同的加密货币供你选择。与 Kraken 一样，它也允许使用法币交易加密货币。它还提供冷存储，并提供了一种以接近实际市场价格购买比特币的简单方法。这对于刚起步的交易者和投资者非常友好。


    ## Poloniex


    Poloniex 提供了许多加密货币选择。它于 2014 年推出，现在是最流行的加密货币交易所之一。它拥有 100 多对加密货币交易，交易环境看起来专业且安全。


    ## Binance


    币安是另一个著名的交易所。它也有一个移动应用程序。虽然它的应用设计可能不那么专业，但你可以确保在币安进行交易会让过程变得简单快捷。


    ## Bitfinex


    这被认为是市场上规模最大的交易所之一。尽管受到了许多投资者的信任，但 Bitfinex 曾被黑客攻击，导致了约 `72,000,000` 个比特币的损失。


