    It''s one of the first CNN designs. LeNet has different layers, like convolutional
    layers, max-pooling layers, and fully connected layers. It''s not as complex as
    newer designs, but LeNet still does a great job with basic picture sorting tasks,
    like those in semiconductor checks. Its straightforward layout opened doors for
    more advanced CNNs. This showed how powerful deep learning can be for working
    with images.'
