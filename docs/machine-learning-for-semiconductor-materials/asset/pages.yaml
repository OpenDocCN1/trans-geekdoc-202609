    # 1.4.2 LIMITATIONS OF GALLIUM ARSENIDE


    Although there are many advantages of GaAs, its drawbacks have limited its application
    in many areas. GaAs is expensive to synthesize compared to Si primarily due to
    the scarcity of Ga. The wafer fabrication of GaAs is complex, increasing the overall
    cost and limiting its use to specialized high-performance applications. Its mechanically
    fragile nature makes it difficult to handle during the fabrication process, thus
    making it challenging to scale the production of GaAs-based systems. Its lower
    thermal conductivity limits its application where heat dissipation is critical
    for device performance. Due to these issues, SiC and GaN are preferred instead
    in many applications.


    # 1.4.3 FUTURE PROSPECTS


    Although GaAs is critical for many applications, materials like SiC and GaN are
    also used for power electronics and high-performance transistors. GaAs continues
    to be critical for high-frequency and optoelectronic applications where efficient
    light emission and stability against solar radiation are critical requirements.


    # 1.5 ADVANCED SEMICONDUCTOR MATERIALS


    With the advancement of science and technology and electronic devices, in particular,
    the demand for compact, energy-efficient devices have increased in recent years.
    The properties of traditional semiconducting materials limit their applications
    in many areas, such as power electronics, telecommunications, and optoelectronics.
    These limitations have led to the development of newer materials with superior
    physical and chemical properties for such applications. Among other materials,
    silicon carbide (SiC), gallium nitride (GaN), and indium phosphide (InP) are useful
    and promising candidates for engineering and technological applications.


    # 1.6 SILICON CARBIDE (SIC)


    # 1.6.1 PROPERTIES AND ADVANTAGES


    Silicon carbide – the wide-band semiconductor with a bandgap of 3.26 eV, high
    breakdown voltage, high thermal conductivity, mechanically hard, and thermal and
    structural stability at high temperatures and frequencies – is a suitable candidate
    for devices that operate at high frequencies and high voltages in the area of
    power electronics. Its high thermal conductivity (~4.9 W/cm-K) ensures efficient
    thermal management in high-temperature applications without the need for detailed
    cooling supports for the device, making such devices rugged enough to function
    under harsh conditions. The devices made of SiC, such as MOSFETs and Schottky
    diodes, show much lower ON-state resistance and switching losses as compared to
    traditional semiconductor-based devices, leading to drastically improved efficiencies.
    These'
