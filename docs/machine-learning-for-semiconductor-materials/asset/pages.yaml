  md: 'known sciences with tremendous ease [5]. Now that we have laid the groundwork,
    with a basic idea of ML, let us walk towards the deeper end.


    # 2.2 THE ORIGINS


    AI, while formally introduced first in the 1950s, had its foundations built much
    earlier. From a poet’s theory to research papers that questioned the idea, AI
    riveted early researchers even before being formally coined. ML is a crucial instrument
    for achieving the objective of utilizing AI-related technologies. It is sometimes
    confused with AI due to its capacity for learning and making decisions, but it
    is actually a subset. It was only after the 1970s that it split off to develop
    independently. A brief discussion on the origins of ML follows.


    # 2.2.1 ARTIFICIAL INTELLIGENCE


    From the BC era to the 21st century, ML has had multiple phases. The term “artificial
    intelligence” originated, ironically, from the Greek word automaton, which means
    “behaving on one’s own accord”. The earliest records of automaton come from 400
    BC, which is hardly surprising, as Greek scholars in the past were known for their
    above and beyond thoughts and philosophies. It was much later in the early 1900s
    when many ideas centred around artificial humans instigated scientists to question
    if it was possible to create an artificial brain that could replicate the human
    cycle of thoughts and behavioural patterns. The scholarly paper “A Logical Calculus
    of the Ideas Immanent in Nervous Activity” by Walter Pitts and Warren McCulloch
    from 1943 contained the first mathematical model of neural networks and therefore
    launched the field of ML [6].


    The book Organization of Behaviour, by Donald Hebb, contained theories on the
    connection between brain activity, neural networks, and behaviour. First published
    in 1949, it became one of the foundational works in the history of ML. As mentioned
    earlier, AI came into being in the 1950s. From Alan Turing’s seminal research
    paper “Computing Machinery and Intelligence” opening with the line, ‘I propose
    to consider the question, “Can machines think?” [7], to Arthur Samuel developing
    the preliminary learning process that could be applied to machines in 1952 and
    finally John MaCarthy coining the term “artificial intelligence”, the world has
    been abuzz about how machines can be imbued with information that can be interpreted
    only by the human brain. Figure 2.2 highlights the timeline of AI to ML conversion.


    # 2.2.2 NEURAL NETWORKS


    In 1957 Frank Rosenblatt gave the lowdown for the earliest neural grid for machines
    – the perceptron; this system was able to actually replicate the Homo sapiens
    brain in terms of processing thoughts. In the 1970s ML came up to speed, branching
    out as a subset of AI which helped with pattern analysis and interpretation for
    machines to understand and interpret data. Further, in the 1990s, ML, which had
    been running on derived knowledge, began to take the data-driven approach.'
