    impurities can cause variations in hardness that impact the overall quality of
    semiconductor devices. Another crucial factor is the consistency of the manufacturing
    process. Even slight fluctuations in temperature, pressure, or chemical concentrations
    can lead to irregularities and defects in semiconductor devices. These variations
    can occur at various stages of the manufacturing process, such as wafer production,
    wafer testing, assembly or packaging, and final testing, each presenting its own
    set of opportunities and challenges [1].


    When machinery malfunctions, it can lead to faulty components or an inability
