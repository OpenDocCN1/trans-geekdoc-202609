  md: 'characteristics are critical for many energy-sensitive applications, such as
    electric vehicles (EVs), renewable energy systems, and industrial motor drives.¹⁹


    # 1.6.2 CHALLENGES AND CURRENT DEVELOPMENTS


    Though there are significant advantages with the properties of SiC for applications
    in critical areas, there are limitations too: (1) The cost and complexity of SiC-based
    devices is way higher than that for the Si-based devices. (2) SiC is a superhard
    and brittle material and requires special care to polish and cut the crystal into
    fibres for the fabrication processes. Thus, the wafer manufacturing is a costly
    and complex process. The technology for the fabrication of SiC wafers is not yet
    as mature as for Si-based devices.


    To address these challenges and harness the unique properties of SiC, there have
    been sustained efforts to develop technologies to circumvent its limitations.
    Some of the efforts centred on developing physical vapour deposition (PVD), chemical
    vapour deposition (CVD), and single crystal growth processes to improve the availability
    of SiC crystals and wafers. These improvements have led to the enhanced usage
    of the material for commercial applications. Additionally, efforts for a new electronic
    architecture development and fabrication process are in focus. This has resulted
    in trench MOSFET structures, created to minimize ON-state resistance and improve
    the performance of SiC-based devices.


    # 1.6.3 APPLICATIONS


    The primary application of SiC is in power electronics, where it is used in high-voltage,
    high-temperature, and high-efficiency devices. SiC MOSFETs and Schottky diodes
    are increasingly being used in power converters, inverters, and motor drives due
    to their ability to operate at higher switching frequencies and temperatures compared
    to silicon-based devices. This enables more compact, efficient, and reliable power
    systems, especially in EVs, industrial equipment, and renewable energy installations.


    In the automotive industry, SiC is being used in the powertrains of electric and
    hybrid vehicles to improve efficiency and reduce the size and weight of power
    electronics systems. The high thermal conductivity of SiC allows for more effective
    heat dissipation, reducing the need for large cooling systems and enabling more
    compact designs.


    SiC is also finding applications in aerospace and defence, where its ability to
    withstand extreme temperatures and radiation makes it suitable for use in harsh
    environments. SiC devices are also used in satellite communication systems, radar,
    and high-temperature sensors.


