- pgno: 182
  md: '![](img/402dddaf38ede9d8a9b9be4ba7a9004a_182_0.png)


    width at its source side, which, in turn, enhances the tunneling rate and boosts
    the device functioning. In source-based TM-GS-V-TFET, there is a strongly doped
    source pocket near the source region, which modulates the tunneling barrier [29].
    Because of this arrangement, the tunneling probability increases, which, in turn,
    enhances its performance. In source extension–based TFETs, the extension of the
    source region is beyond the gate edge to improve its electric field, which decreases
    the tunneling barrier width near the source region. Because of this arrangement,
    the tunneling pace gets boosted, and device functioning improves [30]. Source
    extension–based TFETs have a simple fabrication process and good ability to increase
    I_ON current, decrease I_OFF current, and a better SS value [31].


    In Figure 9.7, a cross-sectional schematic of the TM-GS-V-TFET with a source pocket
    of GaSb (Device A) and the TM-GS-V-TFET with source extension (Device B) are shown.
    Thickness and length were selected as 65 and 30 nm, respectively.


    The various device specifications of the TM-GS-V-TFET are in Table 9.3 [32].


    The energy-band diagram (Figure 9.8) illustrates the interplay between the energy
    levels of both regions and the existence of an energy barrier within the channel
    [33]. In addition, this analysis can enhance subthreshold qualities [34]. Changing
    the material parameters and gate voltage allows the tunneling characteristics
    to be adjusted [35, 36].


    As shown in Figure 9.8a, in Device A, the GaSb pocket introduced in its source
    region creates an extra energy barrier for electrons in the source and channel
    region junction and facilitates the movement of higher-energy electrons close
    to the uppermost region of the valence band. These energy levels make the electrons
    transition into the channel of the material InP’s conduction band with a more
    inclined bend. Hence, it enhances the efficiency of TM-GS-V-TFET.'
