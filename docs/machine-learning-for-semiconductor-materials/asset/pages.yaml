    # 9.2.3 Triple Metal Gate Stacked V-TFET


    In the triple metal gate stacked III-V vertical TFET (TM-GS-V-TFET), there are
    two structures to examine. One is Device A, in which a source pocket is used.
    The other is Device B, in which a new source extension approach is used.


    Source pocket-based TFETs are introduced for their improved $I_{ON}$, reduced
    $I_{OFF}$, and steeper SS as compared to the basic TFET structures. However, their
    fabrication procedures are quite complex as compared to the conventional ones.
    The source extension–type TFET improves the electric field, which reduces its
    tunneling barrier'
