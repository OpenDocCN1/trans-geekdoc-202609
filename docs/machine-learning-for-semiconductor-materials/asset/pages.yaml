    # 7.3.2 EFFECT OF DOPING


    Increasing the doping of source and drain in an identical pattern will lead to
    two primary effects: Effect 2 and Effect 1. When the doping of source and drain
    are increased at an equal rate from a low to high value, a major part of the depletion
    region will penetrate inside the channel [37] rather than the source (source-channel
    junction) or drain (drain-channel junction), which is basically Effect 1. The
    aggregate gate depletion layer width keeps on reducing with increased doping [58],
    which is basically Effect 2. So both Effect 1 and Effect 2 will be present when
    the doping of source and drain are increased from a low to high value. Effect
    2 is more dominant at low doping, which leads to reduction of the depletion layer
    width, thereby increasing the effective channel length. Effect 1 is more dominant
    at high doping, which leads to penetration of the depletion layer side inside
    the channel, resulting in a decrease of the effective channel length. These two
    effects are shown in the diagrammatic flowchart in Figure 7.5. Doping notation
    s_t_u indicate doping of the source (\(1 \times 10^6/cm^3\)), channel (\(1 \times
    10^6/cm^3\)), and drain (\(1 \times 10^6/cm^3\)) in the same order, and the S_C_D
    notations indicate source_channel_drain, respectively. Values of doping \(D_A-D_{II}\)
    are specified in Table 7.3.


