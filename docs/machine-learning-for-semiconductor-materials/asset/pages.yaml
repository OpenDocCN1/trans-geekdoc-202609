    charged biomolecules slightly decrease it compared to neutral biomolecules. This
    increase in ON current enhances subthreshold characteristics, leading to an increase
    in subthreshold slope, although the relative change reduces. Importantly, the
    threshold voltage exhibits a greater relative change than the subthreshold slope,
    highlighting its superior sensitivity as a metric for analyzing biosensor performance.
    Understanding these dynamics is essential for advancing FET-based biosensors toward
    enhanced sensitivity and reliability in complex biological and environmental contexts.
