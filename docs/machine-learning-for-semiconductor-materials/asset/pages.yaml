  md: 'subsets of ML prospects came into being with the development of the nearest
    neighbour algorithm, feedforward and backpropagation networks, boosting algorithms,
    and so on. The varieties of algorithms that came into being required a clear categorization
    under ML.


    # ## 2.3 MACHINE LEARNING MODELLING


    Before we dive into the types of ML, its categorizations, and the basis for the
    same, we will look at the parameters that define the grouping of ML and lay out
    the foundation of the various ML algorithms. The key elements of ML rest on three
    pillars, namely: representation, evaluation, and optimization [10]. The foremost
    deals with the what of an ML model''s look and the how of knowledge representation.
    The second works around how good the model is, what its differentiators are, and
    the evaluation benchmarks for the algorithms involved. The last element is related
    to the process of seeking out a good model(s) and thus moving towards how the
    programs are actually generated.


    # ### 2.3.1 TYPES OF MACHINE LEARNING


    On the basis of the aforementioned component declaration of ML, the concept itself
    can be broadly categorized into three types: supervised learning, unsupervised
    learning, and reinforcement learning [11]. Let it as well be made clear that as
    automated thinking techniques advanced, a fourth category was introduced within
    ML catalogues: semi-supervised learning [12]. We will now try to understand and
    differentiate the categories. Figure 2.3 shows the different ML subcategories.


    # #### 2.3.1.1 Supervised Learning


    As the name itself suggests, this model of learning has a supervisor, which we,
    in technical terms, refer to as “labels”. Given a dataset with labels, an ML model
    can be constructed to train itself on the output, and then when given new, fresh
    data, the expectation remains to be able to retrieve the correct label. Information
    from one neural network serves as an instructional signal to change the connection
    pattern in another network through supervised learning. Since the advent of ML,
    supervised learning has developed under the concept that human behavioural patterns
    are formed in infancy based on data – for example, a child is shown a tree and
    repeatedly told, “This is a TREE”; then perhaps the child is shown a car and again
    is repeatedly told, “This is a CAR”; and so on with any number of unknowns that
    get categorized in the brain under a subheading. Essentially, this becomes supervised
    learning; much later, if the child is shown a picture that contains both a tree
    and a car, he or she will be able to identify them, not based on characteristics
    but based on the labels assigned to them. An ML model behaves more or less similarly.
    Figure 2.4 illustrates the supervised learning model.


    As a result, the taught network picks up new skills in information processing
    that enable it to accomplish the specific objective or transformation that the
    instructional signal specifies. By doing this, supervised learning effectively
    and precisely creates connection patterns that are not required to be encoded
    and frequently cannot be.'
