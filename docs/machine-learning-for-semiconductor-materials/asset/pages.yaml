  md: '# 1 Semiconductor Materials Current Applications and Limitations of Advanced
    Semiconductor Devices


    C. Shekhar


    # 1.1 INTRODUCTION


    Semiconducting materials have played a significant role in the information revolution.
    The main characteristic of semiconducting materials is the resistivity values
    falling between those of metals and insulators and that can be tuned with different
    approaches of material fabrication. The tunable electrical resistivity of these
    materials has enabled the development of a wide variety of electronic devices
    that have fundamentally changed the way humans interact among themselves or share,
    store, and create knowledge and data and changed the world as well. The developments
    of semiconductor materials started in the 19th century with the discovery of electrical
