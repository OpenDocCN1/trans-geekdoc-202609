    # 9.3 RESULTS AND DISCUSSIONS


    In this chapter, different structures of triple metal gate vertical TFETs with
    various techniques like gate-all-around, nanowire, source pocket insertion, and
    source region extension are reviewed and compared in terms of their device structures;
    energy-band diagrams; functional performance of the DC parameters like ION, IOFF,
    minimum SS, and power dissipation; and various device parameter variations like
    all the metal gate functions and all the metal gate lengths. A comparison of all
    the performance characteristics along with the considered design specifications
    of all the discussed TMG V-TFET models in this review are in Table 9.4.


    # 9.4 TFET USING MACHINE LEARNING


