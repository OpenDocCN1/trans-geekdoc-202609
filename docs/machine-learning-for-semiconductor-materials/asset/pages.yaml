  md: '# 10.3.3 MC-DD-Ge/Si-INW-FET FOR BIOSENSING APPLICATIONS


    FETs are a great choice for designing biosensors in rapid and high sensitivity–based
    biosensing applications. The MC-DD-Ge/Si-INW-FET is realized as a biosensor by
    etching a dielectric layer from the source and drain side. The dual-sided cavities
    created are utilized for biomolecule immobilization. Figure 10.10 depicts the
    2D view of the structure of the MC-DD-Ge/Si-INW-FET based biosensor device (showing
    cavity).


    The two-sided nanocavity has been formed by etching the SiO2 layer on the source
    side and the HfO2 dielectric layer on the drain side. The thickness of the nanocavities
    (tcavity) is 6 nm, and the length of the nanocavities (Lcavity) is 10 nm each.


    By immobilizing a variety of biomolecules inside the nanocavity, this biosensor
    aims to characterize their behavior in a biosensing environment. These biomolecules
    can be identified by their dielectric constant values: APTES (K = 3.57) [25],
    hydroprotein (K = 5) [26], keratin (K = 8) [27], gelatin (K = 12) [28], and DNA
    [10, 28] which is distinguished by its charge density values (Nf = -1 x 10^11/cm2,
    Nf = -5 x 10^11/cm2, Nf = -1 x 10^12/cm2) and dielectric constant value K = 12.
    When distinct


