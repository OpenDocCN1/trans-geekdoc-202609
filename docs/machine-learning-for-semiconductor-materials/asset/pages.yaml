    # 2.2.3 IDEATING MACHINE LEARNING


    The story of ML, once defined by the 1970s, led to its specifications. After the
    initial research into ML, the thought of neural networks took stage, which is
    essentially the principle of intelligent algorithms. Neural networks are framed
    to replicate the human brain. As it is a network of connected pieces, it is known
    as a neural network. Biological nerve systems studies serve as the basis for these
    components. Put another way, neural networks are an attempt to develop machines
    that, by utilizing components that behave like biological neurons, perform similarly
    to the human brain. A neural network’s job is to take an input pattern and turn
    it into an output pattern. Pattern categorization is one of the tasks that a neural
    network may be trained to perform, and it will be thoroughly explained because
    this idea is somewhat abstract. The technique of classifying patterns into groups
    is known as pattern classification [8]. The basic building blocks for neural networks
    are similar to neurons. These components are linked to one another through connections
    that might change in strength according to an algorithm or learning process. To
    assess its level of activity, each of these units independently (in parallel)
    integrates the data from its synapses [9]. Neural networks led to the development
    of the perceptron. Resulting as a combination of Hebb’s and Samuel’s model, the
    perceptron was designed by Cornell Aeronautical Laboratory (CAL) to be a machine,
    not a program. The software was then installed and gave rise to the Mark 1 Perceptron
    instead of the IBM 704. As a result, the algorithms and software were portable
    and machine transferable. Later the'
