    biomolecules. Initially, the threshold voltage increases due to the longer effective
    channel length at lower doping levels (Effect 2), necessitating a higher gate
    voltage to activate the FET. This increase in gate voltage results in a higher
    threshold voltage, leading to enhanced sensitivity at lower gate voltages. Conversely,
    at higher doping levels, the effective channel length decreases (Effect 1), requiring
    a lower gate voltage (threshold voltage) for device activation. Therefore, sensitivity
    decreases as doping levels increase. The threshold voltage shows an initial increase
    followed'
