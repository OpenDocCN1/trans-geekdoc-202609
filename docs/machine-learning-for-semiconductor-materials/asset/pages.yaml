  md: '# # 2 Machine Learning

    Introduction and Features


    Deborah T. Joy, Raygun Jose, Charu Jain, Divia T. Joy

    and Rashmi Gupta


    # ## 2.1 INTRODUCTION


    Machine learning (ML), for the need of introduction, is a subset of artificial
    intelligence (AI) – another fancy of many technical researchers. Being a subset
    of AI, ML has achieved a major part of the implementation aspect of AI. In the
    perspective of ML researchers, Naqa and Murphy, a developing subfield of computing
    algorithms called “machine learning” aims to mimic human intelligence by taking
    in information from its surroundings [1]. Now that we have a fair idea of ML with
    respect to AI, let us take a peek into what more ML offers. ML encompasses a wide-ranging
    area of multidisciplinary facets belonging to a plethora of arenas that may or
    may not have to interact with computer and technical sciences.


    Furthermore, having become ingrained in most scientific disciplines, more so in
    recent years, a plethora of modelling tools and even algorithms for a wide range
    of data processing tasks are now a part of the ML process [2]. Not only data processing,
    life sciences and even physical sciences make use of ML to regulate their theories
    and simulate subject-specific hypotheses. Moreover, electronics and digital sciences
    find ML indispensable in a developing environment that caters to the fact that
    ML is mostly software that can be integrated with hardware. Material classification
    and property definition are easier examples of ML implementations in this sphere.
    In their research, Kudelina and Vaimann have quoted ML for electrical sciences,
    most aptly, that AI algorithms can be trained using mathematical models of electrical
    machines. This is accurate given that the industry and laboratories have difficulties
    in gathering large amounts of data due to resource constraints [3]. Thus, several
    intriguing AI-based diagnostic methods are showcased with an emphasis on their
    characteristics.


    With regard to core machine learning, we will first address its concepts and the
    theoretical structure that has riveted the world of AI at large, prior to which,
    we will define it independent of its application and working. Once the groundwork
    is laid, this chapter will address advanced ML, bearing in mind that ML itself
    is advanced in its fundamental structure. Finally, the chapter will conclude with
    the applications and a massive array of its relevance in electrical sciences and
    why it is a dazzling idea to integrate ML and semiconducting material. So let
    us dive right into the deep end!'
