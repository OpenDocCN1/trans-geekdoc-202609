  md: '# 3.5 KEY TECHNIQUES AND ALGORITHMS IN FAULT DETECTION


    Identifying faults plays a role in maintaining high yield rates and ensuring product
    quality in the semiconductor industry. Different approaches and algorithms are
    employed to detect and rectify errors in the production process. Here is a thorough
    examination of the various essential methods and widely applied algorithms for
    fault detection, along with an analysis of their efficacy:


    # 3.5.1 STATISTICAL PROCESS CONTROL


    Statistical process control (SPC) is a crucial approach for leveraging methods
    to oversee and regulate manufacturing processes. SPC examines data collected from
    processes to identify variations and trends that may indicate potential issues.
    The tools commonly used in SPC include the following:


    +   - Control Charts: These charts track the performance of a process over time
    and help identify any deviations from expected behaviour. They assist in determining
    whether differences are due to causes suggesting potential problems or common
    causes inherent to the process.

    +   - Pareto Analysis: Based on the Pareto principle (80/20 rule), which asserts
    that 80% of issues are frequently caused by 20% of the components, this technique
    determines the most significant factors leading to errors [3].


    Effectiveness: SPC is effective at monitoring processes and detecting deviations
    at any stage. However, it may face challenges in identifying subtle or complex
    faults that necessitate more advanced analysis methods.


    # 3.6 MACHINE LEARNING ALGORITHMS


    # 3.6.1 DECISION TREES


    A well-liked classification algorithm for simulating decisions and their outcomes
    is the decision tree. Decision trees are a useful tool in problem detection, as
    they can be used to categorize manufacturing batches according to a variety of
    features.


    +   - Algorithm: A decision tree works by dividing a dataset into smaller groups
    according to the values of its features. This process results in a structure resembling
    a tree that represents different choices.

    +   - Example: Using process parameters and sensor readings, a decision tree might
    identify batches as faulty or not.


    Effectiveness: Although decision trees are easy to comprehend and straightforward,
    they can get overly complex and are prone to overfitting if not pruned appropriately
    [4].


    # 3.6.2 RANDOM FORESTS


    Random forests utilize a technique to enhance the precision and resilience of
    classifications by merging several decision trees.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   * **Algorithm:** It builds multiple decision trees using random subsets
    of features and combines their predictions to make a final decision.

    +   * **Example:** Random forests can manage large datasets and identify complex
    patterns by aggregating the predictions from various decision trees.


    **Effectiveness:** Random forests provide high accuracy and are less prone to
    overfitting compared to individual decision trees. They also manage missing values
    and noisy data well.


    # 3.6.3 Support Vector Machines


    Support vector machines (SVMs) are a powerful classification technique used to
    find the optimal boundary that separates different classes in the feature space.


    +   * **Algorithm:** SVM constructs a hyperplane that maximizes the margin between
    different classes.

    +   * **Example:** SVM can be used to classify batches based on sensor data by
    finding the best boundary that separates faulty and non-faulty samples [5].


    **Effectiveness:** SVMs are effective in high-dimensional spaces and for complex
    datasets. However, they can be computationally intensive and require careful tuning
    of parameters.


    # 3.6.4 Neural Networks


    Deep learning models, in particular, which are utilized for intricate pattern
    recognition and fault detection tasks, are neural networks. They are made up of
    several layers of networked nodes, or neurons, which can recognize hierarchical
    characteristics in the data.


    +   * **Algorithm:** They learn by adjusting weights through backpropagation to
    minimize the error between predicted and actual labels.

    +   * **Example:** They are used by neural networks to minimize the error between
    the expected and real labels by learning via backpropagating weight adjustments.


    **Effectiveness:** When it comes to finding intricate patterns and connections
    in big datasets, neural networks perform remarkably well. They do, however, need
    a large amount of training data and substantial processing power.


    # 3.7 ANOMALY DETECTION TECHNIQUES


    # 3.7.1 Principal Component Analysis


    Principal component analysis (PCA) is a dimensionality reduction technique that
    can also be used for anomaly detection by identifying outliers in the principal
    component space.


    +   * **Algorithm:** PCA projects the data onto a lower-dimensional space (principal
    components) and discovers outliers based on their distance from the mean in this
    reduced space.'
  merge: -1
  img_proc: true
