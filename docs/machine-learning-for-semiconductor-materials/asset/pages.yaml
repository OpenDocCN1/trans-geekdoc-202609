    # ## 10.1 INTRODUCTION


    Field effect transistors (FETs) represent a significant advancement in electronics,
    encompassing various types tailored for diverse applications [1–5]. Their continuous
    exploration has led researchers to develop numerous structures with distinct variations.
    Among these, metal oxide semiconductor field effect transistors (MOSFETs) stand
    out, and the cylindrical architecture of FETs has garnered particular attention
    due to its numerous advantages.


    Germanium, a group 14 element, is considered one of the most promising alternatives
    to silicon [6]. Its narrow bandgap energy provides several advantages when used
    as a source material in electronic devices [7, 8]. For instance, germanium can
    achieve higher carrier mobilities, which is beneficial for faster and more efficient
    transistors. Although several researchers have explored the use of germanium in
    FET structures, a thorough and comprehensive investigation into its potential
    and limitations remains absent in the current literature. This gap highlights
    the need for more detailed studies to fully understand and exploit the benefits
    of germanium in semiconductor technology. This is the primary novelty of the work,
    where the use of germanium as a source material has been comprehensively studied.


    Selection of oxide material is another critical consideration in FET design. While
    SiO₂ is a conventional gate oxide material that has fabrication simplicity and
    better fringing field control [9–11], HfO₂, on the other hand, improves the breakdown
    limit'
