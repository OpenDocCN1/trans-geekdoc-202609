    # 5.5 CNN-BASED CLASSIFICATION ARCHITECTURE


    In the past, CNNs faced big challenges because they needed massive amounts of
    labelled data, which led to high processing costs. This issue got better when
    people created large well-labelled datasets like ImageNet, CIFAR-10, CIFAR-100,
    and the MNIST database. Also, improvements in parallel computing with graphics
    processing units (GPUs) and big distributed clusters lowered computing limits.
    This made it possible to better handle these massive datasets.


    The ImageNet large-scale visual recognition challenge (ILSVRC) had an enormous
    impact on pushing forward deep neural networks for computer vision. ILSVRC made
    it simpler to build and evaluate more complex neural network structures by providing
    a standard against which to measure different image classification systems.


    The ImageNet challenge led to two key image classification systems: the VGG Network
    (VGG-Net) and the Residual Network (ResNet). Simonyan and Zisserman created VGG-Net
    in 2014, which had a significant impact on exploring deeper network structures.
    VGG-Net used tiny 3 × 3 convolutional filters, which helped the network spot small
    details in images while keeping the number of parameters under control. This design
    let the network grow to 16–19 weight layers, achieving a high accuracy of 7.3%
    at the ILSVRC 2014. The network’s increased depth improved classification performance,
    setting a brand-new standard for CNN architecture [5].


    ResNet, which Microsoft Research Asia introduced in 2015, brought about a momentous
    change with its game-changing 152-layer network structure. The main breakthrough
    of ResNet was residual learning. This involved learning residual functions in
    relation to input layers instead of just learning the intended underlying mapping.
    This method made it easier to optimize very deep networks by dealing with the
    degradation problem. This problem happens when adding more layers results in worse
    performance. ResNet’s design took full advantage of the much greater depth. This
    led to better accuracy, and it won the ILSVRC 2015 with a low error rate of 3.6%
    [6].


    Building on the foundation set by these ground-breaking works, our study aims
    to use transfer learning methods and adapt these top-performing network designs
    for our Deep Learning for Anomaly Detection and Classification (DLADC) project.
    By tapping into the unique features of VGG-Net and ResNet, we hope to expand the
    limits of anomaly detection and classification, boosting accuracy and effectiveness
    in spotting and sorting abnormalities in various datasets.'
