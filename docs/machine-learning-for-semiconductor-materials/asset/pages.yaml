    # ## 1.4 Gallium Arsenide (GaAs)


    GaAs is a direct bandgap, III-V semiconductor. It has been used in critical applications,
    such as microwave and millimetre-wave devices, photovoltaic cells, and light-emitting
    diodes (LEDs). Being a direct bandgap semiconductor and a key material in the
    electronics industry for a long time, it offers unique advantages over traditional
    materials, such as Si, particularly in high-frequency, high-speed, and optoelectronic
    applications.


    The bandgap of GaAs is 1.42 eV at room temperature, whereas Si is an indirect
    bandgap material. This makes GaAs more energy efficient for electron transitions
    from the conduction band to the valence band and vice versa, leading to effective
    photon emission. Thus, GaAs is widely used in optoelectronic applications such
    as laser diodes and LEDs.


    The charge carrier mobility of GaAs is ~8,500 cm²/V·s, which is significantly
    higher compared to Si (1,500 cm²/V·s). The higher carrier mobility translates
    to a quick response to the applied external field, making GaAs more suitable for
    high-frequency, high-speed applications, such as microwave transistors and field
    effect transistors (FETs). GaAs-based devices can be effectively used in the GHz
    frequency range, which is suitable for RF and microwave communication systems.
    The higher stability of GaAs-based devices against radiation damage also places
    these devices ahead of Si-based devices for space and satellite applications,
    where the performance of the latter can degrade significantly. GaAs-based devices
    show higher performance stability for longer periods in harsh conditions.


    # ### 1.4.1 Applications of GaAs in Semiconductor Devices


    Due to the low direct bandgap, high carrier mobility, and high saturation velocity,
    GaAs-based devices have been extensively used in high-frequency and optoelectronic
    applications. GaAs-based devices – for example, microwave and millimetre-wave
    transistors such as heterojunction bipolar transistors and high-electron-mobility
    transistors – have been widely used for many applications, like telecommunications,
    radar, wireless communication systems, optoelectronics, solar cells, LEDs, and
    laser diodes. Photovoltaic systems such as GaAs-based solar cells have been used
    in satellite and space applications due to their high efficiency, durability,
    and high performance under extreme radiation exposure for long periods of time.
    Also, GaAs is the preferred material for the fabrication of monolithic microwave
    integrated Circuits (MMICs), integral for radar, satellite, and cellular-based
    communication systems.'
