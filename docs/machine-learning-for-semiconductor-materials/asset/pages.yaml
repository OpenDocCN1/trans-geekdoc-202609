  md: '# 2.4.2 UNSUPERVISED LEARNING ALGORITHMS


    Once again, as mentioned earlier in the chapter, unsupervised learning involves
    a lack of data labels for the observations in the dataset; the resultant is a
    common clause grouping. Unsupervised learning too can be subdivided into three
    categories: clustering, association rules, and dimensionality reduction. For clustering,
    unlabelled data can be examined and divided into groups according to similarities
    or differences. The uncategorized data is divided into naturally occurring groups
    by identifying recurring patterns or similar structures. Second, the rule-based
    method called association rule mining can be used to find intriguing connections
    between data pieces in big databases. In unsupervised learning algorithms, correlations
    and co-occurrences within the data as well as the various connections between
    data objects are found by searching for frequent if-then linkages, also known
    as rules. Finally, dimensionality reduction is a method of unsupervised learning
    that lowers a dataset’s feature count or dimensions. It reduces the amount of
    random or unnecessary characteristics in the dataset by extracting key features.


    # 2.4.2.1 K-Means Clustering


    K-means clustering is an unsupervised learning approach in which unlabelled data
    is made up or segregated into several clusters. The K in K-means is to specify
    the number of predefined clusters that need to be formed during the process. It
    simply means that in case K = 2, it will result in two clusters; in case K = 3,
    it will result in three clusters, and so on. This algorithm allows us to organize
    data into separate groups and has the advantage of nearly automatically finding
    the categories of groups by itself from the unlabelled dataset without a need
    for training [26]. Each cluster in this technique has a centroid, generally the
    mean of the data points, attached to it according to centroid theory. Combining
    the distance of each point with its respective cluster executes the basic objective
    of this algorithm. Figure 2.15 depicts K-means clustering.


    Unfortunately, the accuracy is as low as 44% using the unsupervised learning algorithm.
    For the investigation of the ideal number of clusters, a technique that is very
    commonly is the elbow method. The WCSS value is used in this procedure. Inside
    cluster sum of squares, or WCSS, is a statistical measure that characterizes the
    total variation inside a cluster. We can use any of the precalculated methods
    for distance mapping, such as the Manhattan or Euclidean distance, to measure
    the distance between data points and any corresponding centroid.


    The silhouette coefficient, also called the silhouette score K-means, measures
    how similar a data point is within a cluster or how cohesive it is in relation
    to other clusters, which is known as separation [27]. Compared to the former,
    silhouette provides greater precision.


    # 2.4.2.2 Hierarchical Clustering


    In this algorithm, we start by treating each individual data point as an independent
    cluster of its own; then these are combined in twos and threes and so on to finally
    form a single mother cluster. The dendrogram is the structure that results from
    developing the hierarchy of clusters in this algorithm in the shape of a tree.
    The datasets are grouped into clusters using a bottom-up methodology. This means
