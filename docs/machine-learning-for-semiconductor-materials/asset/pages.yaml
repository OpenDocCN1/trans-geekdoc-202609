  md: '# 9 Performance

    Comparison of Vertical

    TFET Using Triple Metal

    Gate Structures and

    Insights of Machine

    Learning Approach

    A Comprehensive Study


    Neharika Sharma, Neeraj Gupta,

    Karamjit Kaur Sekhon and Seema Narwal


    # 9.1 INTRODUCTION


    Nowadays, low-power consumption and minimal leakage current are essential requirements
    for highly efficient electronics devices [1, 2]. To accommodate the emerging need
    of this industry, MOSFET scaling has reached the nanometer range, which is limiting
    the further reduction of its supply voltage and rapid switching, which, in turn,
    is enhancing the short-channel effects. Therefore, it has become a necessity to
    explore some better alternative devices that can overcome the limitations of the
    MOSFET. The tunnel field effect transistor’s (TFET) improved efficiency, rapid
    switching, hardware compatibility, and reduced short-channel effects make it a
    superior alternative to the MOSFET. TFET works on the band- to band-tunneling
    (BTBT) phenomena instead of thermionic emissions [3–5]. However, the TFET has
    few major parameters, which still need many improvements like IOFF, ION, steeper
    subthreshold slope, and Iamb [6]. To overcome these limitations, various techniques
    have been adopted by researchers in the past, like TFET devices with low bandgap;
    novel material engineering with silicon-germanium, germanium, and other low-bandgap
    materials that belong to groups III–V [7]; spacer pocket engineering; gate engineering
    [8]; and work function engineering [9–12]. To suppress the ambipolar behavior
    of TFETs, different types of devices have been recommended like dual gate hetero
    dielectric buried oxide device [13, 14], double material gate-all-around (GAA)
    device [15], triple metal GAA structure device [16–26], gate on drain overlap–based
    device,'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'and heavily doped source pocket-based device. In this chapter, we review various
    triple metal gate vertical TFETs (TMG V-TFETs) in detail in terms of their performance
    compared with variations in their metal gate lengths and work functions. Section
    9.2 discusses the device geometry of TMG V-TFETs, Section 9.3 has the results
    and discussion of its performance, Section 9.4 discusses TFETs using machine learning
    (ML), and Section 9.5 concludes the chapter.


    # 9.2 DEVICE GEOMETRY OF TRIPLE METAL GATE (TMG) V-TFETs


    # 9.2.1 GAA-Based TMG V-TFET


    In this GAA-based TMG V-TFET device, there are three metal gate layers—MG1, MG2,
    and MG3—designed in such a way that all the metal gates have a different work
    function: WF1, WF2, and WF3, respectively. In this device, source and drain are
    of heavily doped Ge and Si, respectively, and its performance characteristics
    are investigated by technology computer-aided design (TCAD) based simulation with
    various models. This device is actually designed to tackle the TFET’s limitations
    in performance and also the ambipolarity of existing TFET devices. The GAA-based
    TMG V-TFET devices are highly useful in various future applications that demand
    low-power consumption and negligible amount of leakage current [16–26].


    Figure 9.1 shows the various views of TMG V-TFET having three metal gate layers—MG1,
    MG2 and MG3—with different work functions (WF1, WF2, and WF3, respectively). The
    important design specifications considered in this TMG V-TFET are lengths of the
    metal gate layers (L1, L2, and L3), length of the channel (Lc), channel region
    diameter (Nc), total nanowire diameter (Dt), and work functions of all the metal
    gate layers (WF1, WF2, and WF3). In Figure 9.1c, the energy-band diagrams of the
    TMG V-TFET are given with respect to the different work functions defined for
    the respective metal gate layers.


    Table 9.1 represents all the important design specifications considered in this
    GAA-based TMG V-TFET [27].


    Figure 9.2 presents the transfer characteristics (IDS–VGS) curves for a TMG V-TFET.
    The simulation results give ION approximately equal to 10−5 μA/μm, subthreshold
    swing (SS) value of 8 mV/decade, and average subthreshold slope at approximately
    43.5 mV/decade. The performance behavior of the TMG V-TFET is dependent on the
    charge carriers at the channel surface. Therefore, its circumference, given by
    2 × π × rchannel, can easily normalize the IDS value. S, all the metal gates’
    work functions and their respective lengths (L1, L2 and L3) on the TM V-TFET are
    analyzed. Simulation results show that the source-channel BTBT rate is linked
    to the metal gate 1 and metal gate 2 parameters, which, in turn, is affecting
    the device performance. But this tunneling rate at its interface affects the ambipolar
    current and also metal gate 3 (MG3), which also affects the ambipolarity like
    the MG1/MG2 parameters.


    In Figure 9.3a, WF2 and WF3 values are kept constant at 4.5 eV. As WF1 increases,
    tunneling probability reduces, and at VDS = VGS at 0.5 V, ION also decreases significantly,
    as there is an increase in voltage for the BTBT mechanism [14]. In Figure 9.3b,
    WF1 and WF3 values are kept constant at 4.2 eV.'
