  md: '# Editor Biographies


    **Neeraj Gupta** is an associate professor at Amity University, Haryana, specializing
    in device modelling, VLSI design, low-power design, analog design, optimization
    techniques, AI and machine learning and IoT and embedded systems. Dr Gupta received
    his doctoral degree at Amity University, Haryana, India, in 2019. He has more
    than 16 years of teaching experience in different subjects. With extensive experience
    in both academic and research domains, Dr Gupta has contributed significantly
    to the fields of VLSI circuits and device simulation. His work often bridges cutting-edge
    technologies with practical applications, making him a key figure in advancing
    innovations in semiconductor technologies and AI-driven systems. He has published
    more than 40 international articles in different reputed SCI/SCOPUS indexed journals,
    presented at conferences, authored two book chapters, and published a book on
    microprocessors. He also has five published patents. He also received the 2024
    Best Researcher and Best Teacher Award from Wegrow Pvt. Ltd.


    **Rashmi Gupta** is an assistant professor at Amity University, Haryana, Gurugram,
    India. Dr Gupta received her doctoral degree at Amity University, Haryana, India,
    in 2020. She has more than 13 years of teaching and research experience. Her current
    research interest is in artificial intelligence, machine learning, software engineering,
    soft computing, IoT etc. She has published more than 20 international articles
    in different reputed SCI/SCOPUS journals, two book chapters and a book on software
    testing. She also has five published patents.


    **Rekha Yadav** is an assistant professor at DCR University of Science and Technology,
    Murthal, India. She received her doctoral degree from DCR University of Science
    and Technology, Murthal, Haryana, India, in 2018. She has 15 years of teaching
    and research experience. Her current research interest is in semiconductor device
    modelling, VLSI design etc. She has published more than 30 international articles
    in different reputed SCI/SCOPUS journals and four book chapters.


    **Sandeep Dhariwal** is an associate professor at Alliance University, Bengaluru,
    India. Dr Dhariwal received his doctoral degree at Banasthali University, Rajasthan,
    India, in 2015. He has more than 14 years of teaching experience in different
    subjects. His current research interest is in semiconductor device modelling,
    low-power CMOS, VLSI design etc. He has published more than 40 international articles
    in different reputed SCI/SCOPUS indexed journals, presented at conferences, and
    authored three books. He also has three published patents in multidisciplinary
    areas of research.


    **Rajkumar Sarma** received his BE in electronics and communications engineering
    from Vinayaka Mission''s University, Salem, India, in 2008. He received his MTech
    and PhD from Lovely Professional University, Phagwara, Punjab, in 2012 and 2020,
    respectively. He has more than 11 years of teaching and research experience. He
    has been working as a postdoctoral researcher at the University of Limerick, Limerick,'
