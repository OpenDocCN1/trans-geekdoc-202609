    # 3.4 BACKGROUND OF THE SECOM DATASET


    A dataset that is commonly used for detecting and classifying defects in semiconductor
    manufacturing R&D is the SECOM dataset. This dataset is derived from a semiconductor
    manufacturing process where sensors collect several types of data related to the
    production of semiconductor devices. The SECOM project aims to improve knowledge
    and optimize manufacturing processes in the semiconductor industry to make this
    dataset accessible.


    The dataset consists of readings obtained at different stages of the production
    process. These readings encompass numerous factors, such as pressure, temperature,
    chemical concentrations, and other variables. To provide an overview of the industrial
    setting, these measurements are taken at intervals.


    In the structured data, each entry corresponds to a batch or production run of
    semiconductor devices. The dataset includes recorded sensor readings for each
    entry along with a label indicating whether a defect was detected in the yield
    for that particular batch. This label is crucial for training classification models,
