    slope, with the sensitivity of the former metric exceeding 400%, which is achievable
    through meticulously optimized doping levels, highlighting the device’s efficacy
    for biosensing applications. In the symmetric doping case for source and drain,
    peak fractional sensitivities for threshold voltage and subthreshold slope reach
    up to 4.53 and 0.44, respectively. It was found in the study that high percentage
    sensitivity was obtained at low doping levels, with a trade-off with conductivity.
    The research also scrutinizes the impact of fill-in factors, revealing that the
    precise placement of biomolecules near the source significantly affects sensitivity
    more than the actual fill-in factor itself. Considering Vt, as a sensing metric,
    a high percentage sensitivity is achieved at low doping levels, while a high relative
    change sensitivity is achieved at high doping levels. Overall, this study emphasizes
    the pivotal roles of doping levels, bias conditions, and biomolecule placement
    in determining sensitivity in a cylindrical BioFET. The study also discussed the
    role of machine learning in improving the performance and design of BioFETs through
