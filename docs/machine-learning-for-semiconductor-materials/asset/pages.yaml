    Graphene was prepared by A. Gein and K. Novoselov in 2004, and they won the 2010
    Nobel Prize in Physics for the discovery of this remarkable material. It consists
    of a hexagonal arrangement of carbon atoms in a single layer, creating an electronic
    band structure that results in unique physical and chemical properties. Graphene
    has zero bandgap – that is, it’s a semimetal. The topmost of the valance band
    and lowest of the conduction band touches at the Dirac point, resulting in the
    massless Dirac fermions, thus imparting excellent physical and chemical properties
    to graphene.23


    # 1.9.2 PROPERTIES


    The single-layer carbon, arranged in a hexagonal pattern forming the zero bandgap
    material, has excellent physical properties, which are extremely useful in electronic
    device applications. Graphene exhibits enormous electron mobility of 2 × 105 cm2/
    Vs under ideal conditions.24 Such a value of electron mobility is remarkably high
    compared to traditional conductors such as silver and copper. Graphene is extremely
    strong, with 130 GPa tensile strength, almost 200 times that of steel.24 Its thermal
    conductivity is of the order of 5,000 W/mK, making it the ideal candidate for
    thermal management in electronic devices.25 It only absorbs a very small portion
    of the electromagnetic radiation incident on it. Graphene is a highly transparent
    material and suitable for optoelectronic applications.26 Although is very strong
    compared to steel, graphene is flexible at the same time and can be stretched
    by almost 20%, making it the best candidate for flexible electronics.


