- pgno: 1
  md: '# Machine Learning for Semiconductor Materials


    _Machine Learning for Semiconductor Materials_ studies recent techniques and methods
    of machine learning to mitigate the use of technology computer-aided design (TCAD).
    It provides various algorithms of machine learning, such as regression, decision
    tree, support vector machine, K-means clustering and so forth. This book also
    highlights semiconductor materials and their uses in multi-gate devices and the
    analog and radio-frequency (RF) behaviours of semiconductor devices with different
    materials.


    Features:


    +   * Focuses on semiconductor materials and the use of machine learning to facilitate
    understanding and decision-making.

    +   * Covers RF and noise analysis to formulate the frequency behaviour of semiconductor
    devices at high frequency.

    +   * Explores pertinent biomolecule detection methods.

    +   * Reviews recent methods in the field of machine learning for semiconductor
    materials with real-life applications.

    +   * Examines the limitations of existing semiconductor materials and steps to
    overcome the limitations of existing TCAD software.


    This book is aimed at researchers and graduate students in semiconductor materials,
    machine learning and electrical engineering.


    **Neeraj Gupta** is an Associate Professor at Amity University Haryana with over
    16 years of teaching experience. His expertise includes VLSI design, low-power
    and analog design, AI and embedded systems. He has published 40+ papers, two book
    chapters, one book and 12 patents, and has received the Best Researcher and Best
    Teacher Award (2024).


    **Rashmi Gupta** is an Assistant Professor at Amity University Haryana with 13+
    years of experience. Her research interests include AI, software engineering and
    IoT. She has authored 20+ papers, two book chapters, one book and five patents.


    **Rekha Yadav** is an Assistant Professor at DCRUST, Murthal. She specializes
    in semiconductor device modeling and VLSI design with 15 years of experience,
    over 30 publications and four book chapters.'
