    # 3.9.2 Data Preprocessing


    In the realm of preparing data for defect detection in semiconductor manufacturing,
    several key approaches are employed to ensure the dataset is ready for analysis.
    These strategies encompass filling in missing values, removing unnecessary features,
    and addressing zeros and NaN (not a number) values. Here is a detailed breakdown
    of these preprocessing activities:


    +   a. Handling Zeros and NaN Values: Zeros and NaN values within datasets can
    signify incomplete or incorrect information. Given their potential impact on the
    quality of analysis, it is crucial to assess their presence and handle them appropriately.
    To address this, we begin by identifying the occurrences of zeros and NaNs across
    each column of the dataset. This process involves counting the quantity of these
    values for each feature to determine whether any columns contain inaccurate or
    missing data. Assessing the frequency of these values plays a role in informing
    the subsequent steps for data cleansing.


    +   b. Removing Constant Columns: Some columns in datasets may have the same values
    across all rows. Because they lack diversity, these columns don''t contribute
    to distinguishing between different outcomes or categories, making them unsuitable
    for analysis. To improve the effectiveness of the dataset, columns with identical
    entries are removed. This process involves checking if all the values in a column
    are identical. If a column meets this'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'criterion, it is excluded from the dataset. This step can enhance the efficiency
    of subsequent analyses or machine learning models by reducing complexity and eliminating
    irrelevant information.


    +   c. **Imputing Missing Values:** Missing values in datasets pose a challenge
    that needs to be addressed for a thorough analysis. The first step in tackling
    missing values is identifying columns with a significant amount of missing data.
    Typically, columns with a higher percentage of missing values than a set threshold
    are discarded, as they may not provide reliable information.


    To address the missing values in the dataset, imputation techniques are employed
    for the remaining columns. One commonly used approach involves utilizing the mean
    or median of the existing values in a column to replace any absent numbers. The
    mean provides a measure of tendency, while the median offers a metric that is
    less influenced by outliers. Ensuring that every feature has a value imputation
    helps maintain the integrity of the dataset. These preprocessing methods play
    a crucial role in preparing the data for analysis. By tackling zeros and $NaN$s,
    eliminating noninformative features, and filling in missing values, the dataset
    is refined and made more conducive to yielding trustworthy insights and predictions.


    # ### 3.9.3 FEATURE SELECTION TECHNIQUES


    A key component of data preparation is featuring selection, which finds the most
    pertinent features to enhance machine learning model performance. PCA, variance-based
    selection, and model-based selection are some of the methods used. Here is a thorough
    breakdown of every technique:


    +   1. **Variance-Based Feature Selection:** The VarianceThreshold technique is
    employed to eliminate low-variance features. These features tend to remain consistent
    across samples, making their impact on the models’ predictive capability minimal.
    By establishing a threshold, this approach removes attributes that do not meet
    the variance criteria. The goal is to retain only those elements that exhibit
    enough variation to be valuable. For instance, a feature would be removed from
    the dataset if its variance is below a specified threshold. This method reduces
    the dimensionality of the data and eliminates unnecessary noise [7].


    +   2. **Model-Based Feature Selection:** This approach utilizes the effectiveness
    of machine learning models to assess the significance of each feature. The following
    models are utilized for this purpose.


    +   • **Support Vector Classifier (SVC):** This approach uses an L1 penalty to
    help pick out notable features. It relies on support vectors to spot the most
    relevant ones. The significance of the features is shown through the models’ coefficients,
    and those that have coefficients get chosen.


    +   • **Logistic Regression:** This model looks at how features are related to
    the target variable. Features with coefficients are seen as more crucial.'
