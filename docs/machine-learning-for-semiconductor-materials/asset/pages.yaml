    where Effect 2 predominates, the depletion width decreases as doping increases,
    resulting in higher depletion capacitance and lower subthreshold slope (SS shows
    a nonlinear inverse relationship with depletion capacitance). Conversely, at higher
    doping levels, dominated by Effect 1, the subthreshold slope increases with doping.
    A higher subthreshold slope indicates more significant variability in drain current
    for the same gate voltage range, showing a more pronounced change at higher doping
    levels. Local minima in the subthreshold slope pattern are evident in Table 7.3.
