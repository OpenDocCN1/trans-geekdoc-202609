    # ## 3.10 MODEL EVALUATION AND VISUALIZATION


    # ### 3.10.1 TRAINING AND TESTING THE MODEL


    The model evaluation process starts with training a classification model on a
    dataset. In this instance, we use a random forest classifier, which combines multiple
    decision trees and merges their results to boost accuracy and reliability. We
    split the dataset into training and testing parts using a set test size, making
    sure we can assess the model on data it has not seen before.


    Once we have trained the model, we make predictions on the test set. We then gauge
    the model''s performance using accuracy, which shows how many predictions were
    correct out of all the predictions made. The classifier function gives back the
    trained model, predictions, actual labels, and accuracy score.


    # ### 3.10.2 CONFUSION MATRIX CALCULATION


    A confusion matrix helps us check how well a classification model works. It breaks
    down the model''s guesses in detail, showing true positives, true negatives, false
    positives, and false negatives. To figure out these numbers, the confusion_matrix
    function compares the labels the model predicted to the real labels.


    Here is how the confusion matrix is set up:


    +   - **True Positives (TP):** Instances where the model correctly predicted the
    positive class.

    +   - **True Negatives (TN):** Instances where the model correctly predicted the
    negative class.

    +   - **False Positives (FP):** Instances where the model incorrectly predicted
    the positive class.

    +   - **False Negatives (FN):** Instances where the model incorrectly predicted
    the negative class.


    These values are used to construct a matrix that visually represents the performance
    of the model.


    # ### 3.10.3 VISUALIZATION OF THE CONFUSION MATRIX


    To understand the confusion matrix better, we show it as a heat map. The plot_confusion_matrix
    function creates this visual. The heat map gives us a clear picture of how well
    the model works. Each box in the matrix shows how many times the model predicted
    a class compared to the actual class.


    We can display the matrix with or without normalization. Normalization changes
    the values to percentages, which helps when comparing different datasets or models.
    The function uses colours to make things clearer, and it puts the exact numbers
    in each box for more detail.'
