    As shown in Figure 9.8b, Device B has the extension of the GaSb source, because
    of which an extra energy barrier is created for electrons between the source and
    channel region junction and this barrier. It causes the sorting of electrons per
    their energy levels, and electrons having a higher energy level, close to the
    top region of the valence band, has a greater possibility of crossing this barrier.
    Due to this phenomenon, the ON-state current of this TFET gets a boost. This also
    results in a lower I<sub>OFF</sub> [37]. Its SS can potentially be much steeper
    by this extension of the GaSb source, which leads to reduced power consumption
    and enhanced efficiency along with a lower gate voltage.'
