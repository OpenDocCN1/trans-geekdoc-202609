  md: 'semiconductor images. But accuracy alone might not tell the whole story with
    uneven datasets, where one group is much bigger than others. So while accuracy
    gives important info about how useful the model is, it’s best to use it along
    with other measures to get a better picture of how well the model works.


    +   2. **Precision:** Precision measures how well the model avoids false positives
    by calculating the ratio of true positive predictions to all positive predictions
    the model makes. This metric is key in semiconductor inspection because it shows
    how well the model can spot real defects without flagging good parts as bad. High
    precision means the model raises very few false alarms, which is crucial to cut
    down on unnecessary actions or follow-up steps caused by these false positives.
    Precision serves as a vital performance metric that manufacturers can use to evaluate
    how reliable and trustworthy defect detection systems are in semiconductor production
    environments [8].


    +   3. **Recall (Sensitivity):** Recall, also called true positive rate, evaluates
    how well the model can show all positive cases. It does this by comparing the
    share of true positive predictions to all actual positive instances in the dataset.
    In chip testing, recall plays a key role in ensuring thorough defect detection.
    It shows how well the model can spot all faulty parts without missing any. High
    recall means the model identifies most positive cases, which lowers the chance
    of unnoticed flaws getting through the inspection. Makers focus on recall when
    missing flaws could have profound consequences. This highlights how important
    it is to have strict defect detection in chip production lines.


    +   4. **F1 Score:** The F1 score strikes a balance between precision and recall
    by calculating their harmonic mean. It offers a thorough assessment of how well
    a model performs by taking into account both false positives and false negatives.
    In the field of semiconductor inspection, the F1 score serves as a complete evaluation
    metric that sheds light on the connection between precision and recall. A high
    F1 score suggests that the model achieves an optimal blend of precision and recall,
    cutting down on false alarms while capturing all positive instances. Manufacturers
    use the F1 score to examine the overall effectiveness and reliability of the defect
    detection system, making sure they evaluate its performance across different operating
    conditions.


    +   5. **Area under the ROC Curve:** The area under the receiver operating characteristic
    (ROC) curve, or AUC-ROC, assesses how well a model can tell different classes
    apart. It does this by showing the true positive rate against the false positive
    rate at various threshold levels. A higher AUC-ROC score means the model can better
    distinguish between classes, with higher true positive rates and lower false positive
    rates at different decision points. In semiconductor inspection, the AUC-ROC plays
    a key role to gauge how well the model can spot the difference between faulty
    and good parts. Manufacturers rely on the AUC-ROC to check the model’s overall
    sorting accuracy and its ability to make a sound choices when looking at semiconductor
    images.


    +   6. **Confusion Matrix:** A confusion matrix shows how well a model predicts
    compared to actual labels. It displays true positives, false positives, true negatives,
    and false negatives. This gives us key insights into the model’s performance across
    different classes, letting us take a closer look at what it'
