    the location of defects and focusing more on the classification of defects according
    to their type. This endeavour is of foremost importance, as it helps in the determination
    of errors that may not make the product completely useless. Since defects can
    be grouped, it becomes easy to respond appropriately to recover good chips that
    are still saleable, hence making the best use of resources and cutting down on
    losses. To this end, semiconductor die images are analysed. These images are taken
    from high-resolution photos of individual chips on a wafer and give a microscopic
    vision of the semiconductor field and an idea about the type and extents of defects.
    Figure 5.1 shows the defect categorization in semiconductor die images.


