    # # 1.3 Issues in Data Mining


    Data mining consists of tasks like user interfacing, mining, security, performance,
    and data source. The following is a discussion on various tradeoffs of data mining
    [3–5, 14].


    +   o User interface design

    +       ■ As discussed in the KDD process where discovered knowledge needs to
    be represented using good, accurate visualization. The user interface design issue
    addresses the interaction required within users and the systems, information rendering.
    This issue requires analysts, programmers to work on different conceptual levels.


    +   o Mining methodologies issues

    +   This issue addresses the following sub-points:

    +       ■ Algorithms to be used

    +       ■ Error-free data

    +       ■ Less time complexity

    +       ■ Metadata processing.


    +   o Security issues

    +       ■ Security is a very important issue in data mining. Data collection,
    data processing requires maintaining the integrity, confidentiality of the data.
    Data mining systems deal with the private and sensitive information of the users
    and hence providing security to this data is a primary objective of this method.


    +   o Performance issues

    +       ■ There are many data mining applications existing in the market that
    are used in different sectors. These applications process a large volume of data
    and hence data mining algorithms; applications must process this data without
    compromising the performance of the system.'
