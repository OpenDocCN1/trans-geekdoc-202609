    # 7.2 Analytics: An Overview


    Analytics is the process of deriving patterns from data. A systematic analysis
    and interpretation of existing data will in turn result in identifying the patterns
    in data. These can further be used in predicting the future events, risk analysis,
    process optimization, and overall improvement in business performance. While analysis
    of the data will give insights on what happened in the past and why it happened,
    analytics provides insights that can guide in decision making process. Analytics
    in fact is a multidisciplinary field involving mathematics, statistics, data modeling,
    computer programming, etc.


    Data analytics is adopted in manufacturing sector to healthcare sector. The data
    related to downtime, work queue and run-time for various machines can be used
    by manufacturing companies to plan capacity management of machines. In the Six
    Sigma program, data analyzes the number of defects per million in a production
    line can be measured to derive its optimizing factor. Travel and hospitality on
    the other hand adopted data analytics for better turn around by collecting the
    customer data. Further, based on the insights on problems, steps can be taken
    to fix the same. Healthcare and retails industry generates a huge amount of structured
    and unstructured data. Healthcare data analytics can be used to predict the spread
    of diseases, care quality, diagnosis, etc. Further, the data can be used in detecting
    fraud insurance practices in the health care sector.


    Retail industry on the other hand can identify the future trends, recommend products
    based on the trends, improve the supply chain accordingly and can increase the
    profit with an optimized data analytics. Another striking example of application
    of data analytics is in the gaming industry and content companies. User behavior
    data is used by game developers to maximize the gamer involvement, predict gaming
    bottlenecks, etc. whereas content analytics relies on the analysis of user behavior
    that predicts the engagement, clicks on various contents, etc. Adopting data analytics
    to the business model of an enterprise has manifold advantages like reduction
    in'
