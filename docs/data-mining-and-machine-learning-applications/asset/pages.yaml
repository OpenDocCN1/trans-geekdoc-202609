  md: '# Conclusion and Future Direction in Data Mining and Machine Learning


    Santosh R. Durugkar¹, Rohit Raja², Kapil Kumar Nagwanshi³* and Ramakant Chandrakar⁴

    ¹Amity University Rajasthan, Jaipur, India

