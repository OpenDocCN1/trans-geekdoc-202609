    # ## 1.6 Data Mining Techniques


    +   * Decision trees: It is a tree-like structure that helps identify the possible
    outcomes/results/consequences, etc. It is usually used in a decision support system.
    One can say it can be used in classification and prediction. It resembles a tree-like
    structure where leaf nodes represent the outcomes/results, etc. as shown in Figure
    1.4. As it is a tree-like structure, classification/prediction starts from the
    root node and traverses through the leaf nodes. Its benefit is there is no need
    for high computation to find perfect predictions [1–6].


    If there are ‘n’ nodes (root node and leaf nodes) in a sorted manner, then the
    best option/desired option can be found within less time.


    +   * Genetic algorithms (GAs): It helps in finding possible solutions. These
    algorithms help to optimize the given problem and find


