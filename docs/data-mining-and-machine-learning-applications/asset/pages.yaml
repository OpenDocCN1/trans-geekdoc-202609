  md: '# 8.1 Introduction


    A gold mine of the fixed-line telecom companies is their customer base. In the
    region across Asia Pacific, the telecom as a sector has witnessed dramatic changes
    in the past 15 years, owing to improvement in technology and socio-economic conditions.
    As a result, there has been a manifold increase in the customer base of the telecom
    providers [1].


    In the past, the fixed-line telecom operators, particularly in the Asian region,
    rarely engaged in marketing activities to manage customer relationships. With
    the emergence of many new market players in the past decade and a half, catering
    to diversified bouquets and offerings, the need for customer focus has increased
    greatly. Intensifying competition and a multitude of choices have also resulted
    in frequent shifting of the customer base in the past few years [2, 3].


    By better targeting and segmenting prospects and customers, fixed-line telecom
    operators can:


    +   - Identify more sales-ready prospects.

