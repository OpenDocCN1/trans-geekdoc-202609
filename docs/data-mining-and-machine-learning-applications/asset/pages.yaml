  md: 'metrics; it is based on the experimental setup for various research studies.
    It can be understood through these terms:


    +   a) Hypothesis: Before starting an experiment, a hypothesis is built up like
    any algorithm X is better than algorithm Y so we need to be precise about these
    hypotheses and only use one measure to find and prove this hypothesis is “prediction
    accuracy”. The researcher doesn’t require any other factor for this hypothesis.
