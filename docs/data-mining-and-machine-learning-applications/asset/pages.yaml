  md: '# 7.4.1 Input Parameters


    As per EDA, the L2 and L3 severity and L2 and L3 priority tickets have more average
    TTR compared to high and low priority tickets, altogether, and the volume of tickets
    logged during weekdays from 8 AM to 6 PM is more. Therefore, further in this research,
    L2 and L3 level severity and priority tickets logged on weekdays from 8 AM to
    6 PM will be considered. Insights obtained from related research and the opinions
    from expert reviews are considered further for the selection of input parameters
    for the modeling of prediction of effort required in resolving different incidents.
    Based on the preliminary analysis, the following input parameters are identified
    in the developing the predictive model for incident closure effort.


    +   Application: An overall of tickets logged under seven applications are considered
    that comes under custom and packaged product technologies.


    +   Priority: In this research priority levels 2 and 3 are considered.


    +   Severity: Tickets with severity levels 2 and 3 are considered in this research


    +   SLA Compliance: Both tickets that met and could not meet the SLA clauses are
    considered.


    +   Primary Technology: Five different primary technologies are considered.


    +   Root Cause: Six different root causes are present in the tickets that are
    used in the modeling.


    +   Complexity: Tickets with four levels of complexity were present in the ticket
    logs.


    +   No. of reassignments: The number of reassignments required to resolve an incident
    and close the associated tickets depends on the ticket type and the associated
    data is considered as such.


    +   Risk Assessment: tickets with Medium and High level risk factors are considered
    in the research.


    # 7.4.2 Predictive Modeling


    Effort prediction models for the tickets raised are modeled using random forest
    tree based algorithm. The same is presented further in this chapter. Further,
    analysis of the model is based on the result obtained.'
