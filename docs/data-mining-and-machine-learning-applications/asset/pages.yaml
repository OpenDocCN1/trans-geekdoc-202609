    # ## 15.7 Conclusion


    In this research work, we have dealt with the Restricted Boltzmann machine neural
    network architecture for spontaneous seizure detection utilizing EEG signals.
    Thinking about the best in class strategy, this model has an ability that learns
    better and done viably separates among seizure and normal EEG. We have played
    out all ratios of training and testing dataset and saw that when our model is
    getting the training dataset of lower extents, at that point it gives us lower
    accuracy when contrasted to the training dataset of higher ratios. The primary
    reason for lower accuracy is the lesser proportion of the training dataset. During
    learning phase, it naturally takes feature extraction and selection in this way;
    it needs more numbers for data for learning. We have performed binary class classification
    in our proposed system, and it acquired an average accuracy of 99.20%, specificity
    of 98.89%, and sensitivity of 98.94%, the proposed model has been inspected on
    an open accessible CHB-MIT EEG dataset and contrasted with various baseline methodologies.
    The outcomes decide the effectiveness and primacy of the proposed model in recognizing
    epileptic seizures. One more benefit of the proposed model is that it doesn’t
    need any feature extraction and selection mechanism. The performance of the proposed
    methodology can be enhanced by giving more amounts of data.'
