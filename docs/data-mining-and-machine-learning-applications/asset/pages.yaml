  md: '# ## 4.4 Stream Mining Operations


    Various analysis tasks can be performed over the data streams but most commonly
    tasks includes frequent set mining, stream classification and clustering and outlier
    detection. Other tasks are summarizing of the data stream and identification of
    outliers in the data streams. In this section an overview of key stream mining
    tasks namely, stream clustering, classification, frequent set mining and outlier
    detection is discussed.


    # ### 4.4.1 Clustering


    Data stream clustering is the process of identifying the group of similar data
    elements from the incoming data streams. Major challenges and issues in data stream
    mining are discussed by Alothali _et al._ [10]. Alothali _et al._ [10] have presented
    a comparative study on various clustering and classification algorithms available
    for clustering and classification of data streams. Clustering is the process of
    grouping the similar objects in a collection of objects. Clustering algorithms
    are categorized as partitioning based, density based, hierarchical and model based
    algorithms. A study on the impact of dimensionality of incoming data stream for
    clustering analysis is also carried by Nagwani [11], where it is shown that most
    of the clustering algorithms perform better irrespective of the dimensionality
    of data stream.


    In partitioning based methods there are four major techniques for data stream
    clustering namely CluStream (Clustering on Stream), HPStream (High Dimensional
    Projected Stream Clustering), DSCSTREAM and StreamKM++. CluStream pyramidal time
    pattern is used for identifying micro clustering in online and macro clusters
    in offline mode for a data stream. HPStream projection based clustering algorithm
    for data stream clustering. DCSTREAM uses a divide and conquer approach in which
    first subset generator is done then micro clustering is performed and splitting
    and merging of clusters is made in the third phase. StreamKM++ algorithm is K-Means
    based clustering algorithm for data stream clustering.


    Three density-based method clustering techniques for data stream clustering are
    DenStream, CEDAS and FStream algorithms. DenStream and D-Stream use a fading function
    to weigh the micro clusters and generate the global clusters. CEDAS first micro
    clusters are generated then overlapping micro clustering defined based kernel
    regions and clusters are generated for data stream. FStream algorithm finds initial
    clusters then assign streams to the closet cluster discovered earlier.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Another category of clustering algorithms is hierarchical clustering in which
    a hierarchy of data items also known as Dendogram is created for clustering. Three
    examples of hierarchical clustering algorithms for data stream clustering are
    ODAC (Divisive-Agglomerative Clustering), E-Stream (Evolution-based technique
    for stream clustering) and HUE-Stream (Evolution-Based Clustering Technique for
    Heterogeneous Data Streams with Uncertainty) algorithms. ODAC online binary tree
    structure hierarchy, is an incremental clustering technique based on time series
    analysis. E-Stream and HUE-Stream self evolution merge and split. HUE is an extension
    of E-Stream with the handling of uncertainty in the incoming data in data stream.


    Any clustering technique not discussed previously falls under model based clustering
    technique, where any suitable mathematical model is developed for data clustering.
    Four such model based data stream clustering algorithms are CluDistream, SWEM,
    SNCSStream and AFTER-STREAM algorithm. CluDistream and SWEM both are expectation
    maximization based clustering algorithms. CluDistream is Gaussian mix model for
    data stream clustering whereas SWM is time based sliding window approach. The
    SNCSStream on line clustering technique is particularly designed for social networks
    but can also be used for data streams. It groups the people with similar characteristics
    in a social network. It can be modified to use for data streams. AFTER-STREAM
    uses Chebyshev test to remove outliers and then merge the suitable clusters.


    # 4.4.2 Classification


    Classification is the process of categorizing the objects into various predefined
    categories. Stream classification techniques are used for categorizing the data
    streams. Data stream classification based technique is categorized into five major
    categories namely, tree based, rule based, ensemble based, nearest neighbors based
    and statistical measure based [10].


    Tree-based classifiers use a dedicated tree based data structure to classify the
    data streams. The base data structure is called as a decision tree which is modified
    to handle stream data and an incremental version of decision tree is used for
    data stream classification. Two main classifiers in this category are Hoeffding
    tree or VFDT (Very Fast Decision Tree) and CVFDT (Concept drift—Very Fast Decision
    Tree).


    Hoeffding tree or VFDT is the incremental decision tree specifically designed
    for data stream classification. It keeps track of a minimum number of incoming
    instances in data stream for deciding the splitting criteria of decision tree
    for data streams. CVFDT (Concept'
  merge: -1
  img_proc: true
