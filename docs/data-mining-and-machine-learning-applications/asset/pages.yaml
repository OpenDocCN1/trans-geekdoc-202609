    # 4.2 Data Reduction: Sampling and Sketching


    Data reduction is applied in typical data mining systems to minimize the amount
    of input data to the data mining algorithms to get the faster output from the
    mining algorithms. Generation of histograms, sketching algorithms and sampling
    techniques are major approaches of data reduction in data streams [2]. In this
    section an overview of sampling and sketching techniques is presented in brief.


    # 4.2.1 Sampling


    Sampling is a popular technique of data reduction in data mining and the same
    can be applied to the data streams also. But at the same time, it is the big challenge
    in the data stream systems. As stream is the continuous flow of data and practically
    it is not possible to store the entire data streams for mining, sampling plays
    a key role in mining of data streams. If suitable samples can be selected from
    the data streams then data stream analysis can be more perfect and accurate. The
    overview of sampling techniques for data streams is presented in this section.


    The sampling techniques are in two major categories [3-5] namely, uniform and
    biased sampling. Technically it can be categorized as fixed window sampling and
    sliding windows sampling techniques. Uniform sampling is further classified as
    reservoir sampling and Bernoulli sampling techniques, whereas biased sampling
    is further categorized as count and weighted sampling. In this section an overview
    of various commonly used sampling techniques for data streams is presented in
    brief.


    The first category of sampling techniques in data stream sampling is known as
    sampling from a fixed length of window. Major sampling techniques in this category
    are simple random sampling technique, systematic sampling, stratified sampling,
    uniform sampling, Bernoulli sampling, reservoir sampling, sequential sampling
    and concise sampling techniques.


    Simple Random Sampling (SRS) is the oldest and popular sampling technique in which
    data samples are selected randomly from a data stream. In Systematic Sampling,
    samples are selected from the pre-identified data chunks or segments for a data
    stream. In stratified sampling, samples are selected from a start which is created
    from the data streams. Weighted random'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'sampling is the variation of random sampling technique in which weights are
    assigned to data elements in a particular window. Uniform sampling is performed
    using uniform distribution of the data from a data stream. Samples from each uniform
    distribution are selected randomly with equal likelihood. Bernoulli sampling works
    on the basis of sampling rate and a known probability of samples. Reservoir sampling
    is the popular sampling technique in data stream mining. It uses a window of fixed
    length and then randomly selected data points are added to the window initially
    as the samples, later on using probability functions the windows are updated with
    most suitable values of samples. Sequential sampling is a special type of reservoir
    sampling for a known window size in advance. Concise sampling is a type of random
    sampling technique in which a map (key-value pair) is stored as the samples where
    the key value indicate the data sample and value part indicates the frequency
    of the data sample. These key-values pairs are maintained for the samples having
    the frequency value of more than one, for remaining only values are stored as
    samples without keys.


    The second major category of sampling technique is designed on the basis of sampling
    from sliding windows. The sliding window can be generated using timestamp also
    in this case it is known as timestamp based windows. The major techniques in this
    category of sampling techniques are chain sampling, backing sampling, priority
    sampling, random pair sampling and StreamSamp sampling techniques.


    Chain sampling is a special type of reservoir sampling technique in which samples
    are taken from the recent items present in the data streams. It provides a uniform
    sampling using the recently traversed data items from the data stream. Backing
    sampling technique is a special type of reservoir sampling technique in which
    a sample is added to the reservoir and then after skipping a fixed number of samples
    another is added to the reservoir as a sample. Using priority sampling technique
    priority is decided to predict the next tentative sample to be selected from the
    data stream. In the random pairing sampling technique uniform sampling is done
    by choosing the samples from a fixed size sliding window. StreamSamp sampling
    technique is a type of simple random sample technique in which samples are selected
    from a sample summary from a sliding window. Summary from the window can be generated
    using suitable techniques.


    # 4.2.2 Sketching


    Sketching is the unique technology for processing of data streams. It provides
    the way for generating the summary from an incoming data stream and also provides
    the data structures to store the summary of the data streams.'
