    # 3.2 Related Work on Different Recommender System


    The RS are classified into six different types and the working of all the approaches
    is different from one another. The types are as follows:


    Collaborative Filtering: CF is an automatic filtering technique used for prediction.
    It means that recommendation for any user (as per his/her interest criteria) is
    done through preferring the ratings of many users who rate similar items. CF works
    on recommendations that focus on user liking about the item and then finds the
    pattern and rating for each item and then classified according to user interest.

    For example: If user X1 likes item Y1, Y2, and Y3.

    If user X2 likes item Y1, Y3, Y4

    If user X3 likes item Y1?

    So there are higher chances that person X3 gets a recommendation for an item liked
    by X1 and X2.

    When we talk about CF then we have two models: one is memory-based, which is also
    known as neighborhood filtering, user-item rating which is'
  merge: -1
  img_proc: true
