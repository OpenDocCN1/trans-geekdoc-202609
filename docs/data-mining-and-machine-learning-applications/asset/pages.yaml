  md: '# 13.3.1 Proposed Methodology: Multi Source Dynamic TrAdaBoost Algorithm


    The framework first utilizes TrAdaBoost with the single positive target training
    instance, towards utilizing the knowledge from several sources. By discarding
    the first half of the ensemble, TrAdaBoost degrades the performance. Due to this
    issue samples of source domain converge before they applied for transfer learning.
    In addition, relying of TrAdaBoost on single-source makes it vulnerable towards
    negative transfer thus, considering the co-relation among several target and source
    domains, we utilized ‘Multisource TrAdaBoost’ (MSTra) [15] transfer learning method
    for the uneven class distribution. Ensuring that the transferred knowledge is
    co-related with the target domain, it neglects the impact of another source domain.
    We thus resolved the issue incorporated in TrAdaBoost by integrating Dynamic TrAdaBoost
    (DTrAdaBoost) with a dynamic-cost. However, DtrAdaBoost causes convergence of
    source samples prior employed for transfer learning. To overcome the aforementioned
    drawbacks, we then utilized multisource dynamic TrAdaBoost algorithm (MSDTrA).
    The method reduces the convergence-rate of weight of source instances on the basis
    of weak-correlation towards target domain. The MSDTrA at every step, trains the
    classifiers by selecting the ensemble learning of TrAdaBoost based on combining
    the samples of source and target. Weighted Majority Algorithm is utilized towards
    adjusting the source sample’s weights by reducing the weight of mis-classified
    source samples and keeping the present weights of correctly classified source
    samples. The method greatly decreases the cost of memory of unwanted data in the
    source domain using multiple source domains. The problem of negative transfer
    has been addressed by utilizing several multiple sources (skin lesion datasets)
    which increases the chance of importing the information from a source to the target.
    MSDTrA permits the training instances of source domain for participating in the
    learning process in every iteration, and assigns distinct weights to distinct
    training samples of source domain. Higher weight is assigned to the source training
    instance towards improving the target task learning. In general, the MSDTrA takes
    the benefit of significant knowledge obtained from all source domains which enhances
    the learning impact of target tasks. We utilized n source domains S1, S2, ...
    Sn, n source tasks, T1, T2, ... Tan and n source training set as Da1, Da2 ...
    Dan, the designed framework aims to leverage the knowledge from transfer learning
    towards improving the effectiveness of learning of target learner function as:
    f^b : X → Y. The MSDTrA algorithm is more elaborately explained in pseudo code
    discussed in Algorithm 1 and the designed framework is depicted in Figure 13.3.'
