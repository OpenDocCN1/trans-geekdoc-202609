  md: '# 7.2.1 Predictive Analytics


    This chapter focuses on predictive analytics in IT Service Management and it is
    customary to give a brief on what is the whole idea. Predictive analytics is the
    amalgamation of a variety of statistical techniques like data mining, data modeling,
    machine learning, artificial intelligence, etc. A predictive model is developed
    using these techniques that captures the trends in the historical data. The model
    will be able to answer what can happen in the future using the real time data
    with a higher probability. The outcome is that, optimal decisions can be taken
    with the knowledge of the future and the desired outcomes; nothing but decision
    making [10]. Predictions are so hard to get right, so why exactly is it adopted
    by enterprises worldwide? Predictive analytics can identify which customers were
    likely to churn, which are the loyal customers, etc. and a coffee shop in New
    York could cut down 38% of the marketing cost by predicting exactly the same.
    A 10% increase in revenue was achieved by Rue La La by price optimization. A public
    service agency in the U.S. avoided budget overruns, predict consumer demand and
    could adapt to market changes based on models developed using historic data, demand
    study, market research, etc. [8].


    To start with, identification of the anticipated result or outcome will be the
    first step towards embracing predictive analytics in the business model. What
    has to be achieved? In the case of the public service agency in the U.S., how
    to avoid budget overruns will be the right question. To answer the questions raised,
    what data is present? And with the data what can be done? Are to be addressed
    first. Further, exploratory data analysis is performed to that summarizes the
    data and gives an overview of the basic characteristics of the data. The outcome
    of EDA can help in the hypothesis generation, identifying the outliers and so
    on [11]. These steps were performed to get an overall understanding of the problem
    and the hypothesis. With a precisely defined problem statement and hypothesis,
    statistical model/AI based model or ML model can be developed using the historic
    data collected. The same is validated with the help of real time data to further
    calibrate the model. Various models can be developed that will best correlate
    with the historic data. The model is deployed to guide with the decision making
    process that can answer the questions. Poor design/validation of the models, poor
    decision making can result in more of negative impact than the anticipated outcome
    [12]. So how can IT Service Management gain from predictive analytics is presented
    in Section 7.3.'
  merge: -1
  img_proc: true
