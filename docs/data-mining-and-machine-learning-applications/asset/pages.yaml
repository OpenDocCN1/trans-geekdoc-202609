  md: '# MSDTrA: A Boosting Based-Transfer Learning Approach for Class Imbalanced
    Skin Lesion Dataset for Melanoma Detection


    Lokesh Singh*, Rekh Ram Janghel and Satya Prakash Sahu


    Department of Information Technology, National Institute of Technology, Raipur,
    India


    # Abstract


    Pigmented skin lesion datasets comprise a higher percentage of benign lesion than
    the malignant lesions which lead to the class skewness issue in the dataset. Classifiers
    trained for analyzing the automated dermatoscopic pigmented lesions often suffer
    from data scarcity. Transfer learning permits to leverage the knowledge from the
    source domain to train a classifier towards the target domain when the data is
    rare. Importing knowledge from multiple or several sources towards increasing
    the chance of searching a source closer to a target may alleviate the negative
    transfer. A framework is proposed in this work to transfer knowledge from multiple
    different sources utilizing AdaBoost, TrAdaBoost and MultiSource Dynamic TrAdaBoost
    (MSDTrA), for melanoma detection. The effectiveness of the proposed framework
    is evaluated on four benchmark skin lesion datasets namely, PH2, ISIC16, ISIC17,
    and HAM1000 which demonstrate promising performance by alleviating negative-transfer
    by increasing multiple different sources.


    **Keywords:** Dermoscopic, classification, melanoma, class imbalance, boosting,
    sampling


    # 13.1 Introduction


    One of the most lethal types of skin cancer called malignant melanoma is responsible
    for the wide majority of skin cancer deaths. Cancer is an'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'ailment of the rampant growth of abnormal cells, which are the rudimentary
    blocks of the body [1, 2]. The body persistently develops novice cells for rapid
    growth, exchange tattered tissues and repair injuries. Moreover, cells multiply
    themselves and die in an orderly fashion. But sometimes the process of cells gets
    disturbed, neither they grow nor die in an orderly fashion. Due to which the body''s
    lymph fluid becomes abnormal and as a result, tumor arises. A tumor might be benign
    or malignant. A benign tumor is not cancerous while malignant is, as it spread
    themselves in other parts of the body via lymph fluid [3]. Melanoma occurs over
    those parts of the body which are exposed to the sun, but sometimes very rarely
    it appears anywhere in the body which are not at all exposed to the sun like inside
    the mouth, eyes, nervous system, etc. [4, 5]. From the latest reports, the melanoma
    deaths have cross over 20,000 early in Europe. Nevertheless, if we diagnosed early
    to melanoma, it becomes the most treatable type of cancer in the world [6]. In
    skin lesion detection, benign lesions are found in majority while malignant lesions
    are rare in the dataset [7], which makes the melanoma detection challenging with
    skewed class distribution. In account of size of data and skewness in class distribution
    datasets are categorized in four sections as shown in Figure 13.1. The skin lesion
    datasets used in this experimentation are small in size and imbalanced as well
    thus, falls under the category of ‘absolute rarity’.


    ![](img/48ffcb334b2fea865a1f194394911123_362_0.png)'
  merge: -1
  img_proc: true
- pgno: 363
  md: '+   A. Standard Dataset: This includes the adequate number of data within each
    class in a balanced manner i.e., each class contains an almost equal amount of
    data.

    +   B. Imbalanced Dataset: This includes an adequate number of data of one class
    called majority class and other class with fewer data in it generally known as
    a minority class.

    +   C. Small Dataset: This type of dataset includes the exiguous data in both
    the classes but is balanced.

    +   D. Rare Dataset: This type of dataset contains the exiguous data in an unbalanced
    manner i.e., classes containing data having large differences in the amount of
    data.


    Transfer learning (TL) [8, 9] is a family of algorithms that employs the conventional
    machine learning approaches with an assumption of identical distribution. Learning
    algorithms are moved from one domain (S) to another domain (T) to exploit and
    transfer insightful information. When the training data points are small, the
    information leveraged improvise the target domain''s learning. Transferring knowledge
    from one domain (S) to another domain (T) depends on the way they are connected.
    The stronger the association is, the greater the usability of the previous information.
    On the contrary, brute-force transfer in the case of poor relationships might
    lead to performance degradation of classifiers that negates transfer.


    A general assumption of conventional machine learning approach is that training
    and testing dataset have similar probability distribution. Under such a presumption
    where a dataset is of dissimilar distribution, training data is needed to be acquired
    towards learning new classifiers [10]. A classifier when trained in such circumstances,
    it may overfit the new data which leads to poor generalization. Utilizing the
    knowledge from the same domain would be more effective towards regularizing the
    learning. Towards relaxing the similar distribution presumption of the conventional
    machine learning methods, transfer learning presents a family of approaches [11].
    The knowledge transferred helps to improve learning in the target domain with
    rarity in training samples [12]. TrAdaBoost is gaining popularity for boosting
