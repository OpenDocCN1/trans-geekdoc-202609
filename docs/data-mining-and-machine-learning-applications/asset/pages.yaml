    # 15.3.5 Restricted Boltzmann Machine (RBM)


    RBM is an undirected variant that assumes an important role in Deep Belief Networks
    (DBNs). It characterizes a bunch of rules in the method, which is useful in dimensionality
    decrease, pattern recognition, regression,'
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/48ffcb334b2fea865a1f194394911123_417_0.png)


    and collaborative filtering [29]. Rather than utilizing deterministic dispersion,
    RBM utilizes stochastic units of probability distribution represented in Section
    15.3.1. RBM utilizes two different biases which make it not the same as auto-encoders:


    +   1. The hidden bias which helps in to reproduce the activation on the forward
    pass.

    +   2. The visible bias which helps in to reproduce the activation on the backward
    pass.


    RBM is an external model that represents a two-layered network which is visible
    and hidden layer. Figure 15.3 shows the architecture of RBM, where each circle
    represents the neuron-like unit where calculation takes place. One of the most
    important features of RBM is that there is no communication between the internal
    layers which is there as a restriction in RBM model. Each node in this model performs
    stochastic decisions on whether to send that to the input or not. Low level features
    are taken by the visible layer for the data to be learned.


    # 15.3.6 Stochastic Binary Units (Bernoulli Variables)


    Stochastic Binary Units or we simply say Bernoulli variables are the units that
    have a state of 0s and 1s. The probability of turning on is determined by the
    weighted input from the other inputs (plus a bias) [30]. Let us suppose s be the
    stochastic unit variable, b be the bias, and w be the weights used, then the formula
    is given by:


    ```

    p(s_i = 1) = \frac{1}{1 + \exp\left(-b_i - \sum_j s_j w_{ji}\right)}

    ```'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'The above formula is used to calculate the probability distribution when the
    input is in a state 0 or 1. Stochastic binary units utilize similar conditions
    which are used by logistic units, however they represent the output of the logistic
    as generating a spike in a brief timeframe.


    # Working Principle of RBM


    As we all know that low level feature is being taken by the RBM in order to learn
    the data. Restricted Boltzmann Machine is a deep learning model that comprises
    of two layers, the first layer to a hidden layer and the second layer to be a
    hidden layer. Suppose x is the input layer at a particular node, and w is the
    weights that are fed into each input layer, and b is the bias used. Now to produce
    the node''s output, we use the formula given below:


    Output a = Activation f ((weight w * input X) + biasb)


    where ‘a’ represents the output, and this proceeds for all other layers which
    are available in the network. In the instance of numerous hidden layers, the weights
    are changed until that layer is able to approximate the input from the previous
    layer [31]. Proper initial value of weights to later training and performing classification
    is one of the benefits of a Restricted Boltzmann machine (RBM).


    In our proposed methodology, we have made an algorithm in which three layers of
    RBM are used, which is shown in Figure 15.1. Each output of the RBM layer becomes
    an input to the succeeding input layer of RBM, which are shown in the form of
    a hidden layer in the proposed methodology. The input layer is in which all the
    initial calculation of the weights is done and are fed into the hidden layer,
    and from there, new weights are calculated, and this process continues until all
    the hidden layers update their weights likewise in backpropagation network. Finally,
    the output is fetched from the last layer, which is present in the restricted
    Boltzmann machine network [32].


