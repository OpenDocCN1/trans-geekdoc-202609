- pgno: 125
  md: 'Stream (ASPMS) algorithm. Apriori is the oldest, popular and simplest algorithm
    for finding the frequent itemsets from a database or from a data stream. It uses
    the concept of apriori property which states that all the subsets of a frequent
    itemset are also frequent or it can also be stated that if any subset is not frequent
    then all its supersets can also be non-frequent. Using this property and counting
    the frequency of individual items in the database or data stream frequent itemsets
    can be generated. The only problem with apriori algorithm is more numbers of database
    scans are required. FP growth algorithm only takes two scans of database for finding
    the frequent itemsets. It works on a special data structure called a frequent
    pattern tree (FP-Tree) which stores the items along with its frequencies from
    which frequent itemsets are mined. RARM computes tries itemsets for finding the
    frequent itemsets, using the tries generated from the input data stream frequent
    itemsets are generated. In Equivalence CLAss Transformation (ECLAT) algorithm
    items along with the list of transactions are maintained and processing is performed
    on the basis of list of transactions rather than on items. ASPMS algorithm is
    specifically designed for the wireless sensor network data which uses a specific
    data structure known as sensor pattern stream tree. Then using a suitable size
    of window and batch by batch processing frequent patterns can be generated from
    the sensor pattern stream tree. It is shown that the algorithm performance and
    selection depends on number of parameters such as number of database scans, execution
    time and memory requirements.


