  md: 'drift—Very Fast Decision Tree) is a variation of the VFDT classifier with

    the support of handling concept drift in the data stream.


    In rule-based classifiers, focus is given on generating the classification

    rules using which classification decision can be taken for any object. Two

    major algorithms in this category are On-demand stream classifier and

    SimC (Similarity-based Data Stream Classifier) classifier. On-demand

    stream classifier uses micro-clusters to classify the data stream along with

    handling of concept drifts. SimC classifier is a similarity based instance

    based learning classifier.


    In ensemble-based classifier, more than one classifier is used for classifi-

    cation purpose. A combination of classifiers is arranged in such a manner

    that it is optimized to take a classification decision in a better way than a

    single classifier can take. Four popular ensemble-based classification algo-

    rithms are SAE2 (Social Adaptive Ensemble 2), SFN (Scale-free Network

    Classifier), CBCE (Class Based Ensemble for Class Evolution) and KME

    (Knowledge Maximized Ensemble).


    SAE2 is the extension of the classifier Social Adaptive Ensemble (SAE).

    In this classifier a connection between the classifiers are made if the clas-

    sifier has the common predictions. SFN Classifier is based on weighted

    majority voting ensemble learning method. CBCE uses under sampling

    for class imbalance problem and KME evaluates the weights of classifiers

    to enhance classification It is able to handle different types of concept drifts

    in a data stream.


    Nearest Neighbors classifiers work on the basis of similarity of sur-

    rounding neighbors. The similar surrounding neighbors may belong to the

    same category. Anytime Nearest Neighbors is a distance based data stream

    classifier and as the name suggests the input data stream can be interrupted

    at any time to get more accurate classes of data streams.


    Statistical classifiers use statistics measures and parameters to design the

    classifiers. SAL (Stream based Active Learning algorithm) is a type of sta-

    tistical classifiers which is a Bayesian classifier based on probability theory

    and can support the multi-class classification of data stream. It is capable

    of handling concept drifts in a data stream.


    # 4.4.3 Outlier Detection


    Outlier detection is a technique by which abnormal data can be eliminated

    from a data stream, in other words if for some data points in stream the

    typical characteristics of data is different from the entire stream it can be

    marked as an outlier and eliminated from stream for stream analysis as it

    indicates noise in the data stream. The main challenge in identifying the'
