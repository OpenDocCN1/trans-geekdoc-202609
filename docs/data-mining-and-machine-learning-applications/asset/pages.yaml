    # 15.1 Introduction


    Epilepsy is a common disorder which affects more than 40 million people worldwide,
    and affecting mostly people coming from developing countries like China, the U.S.A,
    India, etc. The research study of the World Health Organization shows that more
    than 2 million people are affected with epilepsy. Also, their study shows that
    at least 40% of the cases occur during childhood or adolescence [1]. Most of the
    people whose age is more than 65 years are also affected by the onset seizure
    of this disease. Study shows that the people who are affected by this disease
    are likely to die at an early age when compared with the normal people who do
    not have this disease. Hence, researchers have found that the study of epilepsy
    is a field that needs to be researched in biomedical studies.


    Epilepsy is a disorder that occurs in the human brain, and it is characterized
    by various seizures which can affect various aged persons because it is a disease
    that normally occurs in any person. Recurrent convulsions occur effectively over
    a time period in the human brain when the seizure occurs. The episodes may vary
    as long as 1 s to as long as one year over a time period. Many think that epilepsy
    and the disorder that occurs due to seizures are the same, but this is not true
    as both are considered to be two different things [2]. One of the most important
    things, if one has to detect an epileptic seizure in the human brain, is that
    they have to be kept under constant monitoring, which usually requires a patient
    to take in-admission in the hospital. This is considered to be the most expensive
    thing, and it might take many days to detect the epileptic seizure in the human
    brain. The disadvantage is that when the patient is being screened for the seizure
    from the EEG records across the many days can become quite an unusual task. So,
    in these types of situations automated seizure detection system can become quite
    useful [3].


