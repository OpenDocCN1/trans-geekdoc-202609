  md: '# 4.1 Introduction


    Stream mining or data stream mining is a key research area in big data analytics
    which takes the streamed data as input for data analysis. A data stream is an
    ordered sequence of data over a period of time. The biggest challenge in handling
    data streams is volume and velocity of the incoming data apart from the other
    issues [1]. As the data in a stream comes in a continuous flow over the span of
    a time, practically it is impossible to store the entire data and process it on
    the local system. So it is expected to process the input data stream in just a
    single pass and discard it as soon as it is processed by the analysis algorithms.


    The overview of a typical data stream processing system is shown in Figure 4.1.
    Input data is data streams that reach the stream processing module where processing
    of streams is carried in three major phases. In the first phase data reduction
    is performed from the input data stream using suitable sampling techniques. Sketching
    or data reduction can also be performed as an alternate technique for sampling
    with the input data stream in the first phase. Then in the second phase a suitable
    data stream mining algorithm is applied on the samples or sketches selected from
    the data stream from phase one. The choice of a particular stream mining algorithm
    depends on the type of pattern discovery from the data streams. Then pattern generation
    and representation of output is made in the third phase and the output is stored
