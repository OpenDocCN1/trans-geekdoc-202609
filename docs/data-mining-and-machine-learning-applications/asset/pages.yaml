- pgno: 205
  md: '# 7.4.3 Random Forest Model


    Random Forest is a tree based ensemble model. Multiple trees are grown as per
    the training set data. Each tree is grown based on a subset of variables and a
    subset of data points. The process of growing the trees are called tree bagging.
    Its main advantage is that it overcomes over fitting of the model and change in
    the dataset has little effect on the outcome. Average of the trees when adopted
    in prediction will decrease the noise. Further, optimization is achieved using
    cross validation that estimates the level of fit. The algorithm for random forest
    is as follows:


    Given a training dataset X = x1, x2, x3 ..., xn and the response be Y = y1, y2,
    y3, ..., yn.


    +   - Initialize B which is a random value and the number of times bagging should
    be repeated

    +   - For b = 1, 2, ..., B:

    +     - Sample the dataset with replacement, training dataset from X, Y. Xb, Yb
    be the sampled subsets of X and Y respectively.

    +     - Grow a regression tree fb on Xb, Yb


    Prediction on test dataset x'' is a function f(x'') which is


    ```

    f(x'') = \frac{1}{B} \sum_{i=1}^{n} f_b(x'')

    ```


    A total of 500 decision trees are randomly modeled using the training dataset.
    The development of the model is performed using the random Forest package meant
    for the classification and regression based on a forest of trees using random
    inputs. The Breiman and Cutler’s Random Forests for Classification and Regression
    package [17] provides a randomForest() function that is used to build the model
    using training dataset and is further used in the prediction of incident resolution
    effort in the test dataset. Error measures like MAPE, MSE, RMSE and MAE tests
    are performed in order to validate the same.


    The actual and the predicted effort by the developed models, for the training
    and test dataset are represented in Figures 7.10 and 7.11 for regression tree
    and random forest respectively.'
