  md: 'b. Recall: Number of positive class predictions out of positive class in the
    dataset. It answers the questions that when it is actually yes the person likes
    cats, how often does it predict correctly?


    ```

    Recall = \frac{tp}{tp + fn}

    ```


    c. F-measure: It is a measure that takes both precisions and recalls into account
    and when one finds out the weighted average of precision and recall then it is
    known as F-measure and it also defines as a parameter that makes a compromise
    to be reached concerning precision and recall.


    ```

    f1 = \frac{2(precision * recall)}{(precision + recall)}

    ```


    # Measuring Ranking of Items


    Normalized Distance-Based Performance Measure: When there is a need for information
    retrieval then this measure is used and it distinguishes correct and incorrect
    orders of pairs and ties.


    ```

    NDPM(I, \succ_1, \succ_2) = \frac{\beta_{\succ_1, \succ_2}(I)}{m(\succ_1)}

    ```


