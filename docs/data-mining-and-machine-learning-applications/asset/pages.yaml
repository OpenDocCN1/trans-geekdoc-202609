    # ## 3.1 Introduction


    Initially, recommendation plays a supporting role but with time as the internet
    grows, more and more people ask queries through the internet and the evolution
    of the recommender system has done. In this evolution process, various types of
    recommendation techniques are introduced in different fields like medicine, movies,
    music, e-commerce based recommendation, and many others.


    A conversational RS [1] is one of the approaches described as a more one-to-one
    user preference got attention at the time of conversation and become a more personalized
    one for each user. In this paper [1] the RS provides the differential diagnosis
    to schizophrenia, schizoaffective and bipolar diseases by using fuzzy implications.
    In Health care, there is not only the conversational RS that is useful but also
    the web page RS is very helpful for those users who have any previous record and
    on that basis, they want to take suggestion from the internet but the problem
    is that the recommended data is in a very scattered way [2] so researcher suggests
    the new idea of Web Page based RS for web pages in one place provided to patients
    so that patient get very precise and related information regarding his/her disease.


    Sentiment Analysis is one of the fields that is also explored in RS; we need to
    understand that in RS each review that a user provides connects to some emotions
    either positive or negative. So from the text we need to understand the sentiment
    of the user [3]. The authors propose the model called a stochastic model of HMM
    (Hidden Markow Model) for the customer reviews that come in various marketing
    portal like Amazon, Flipkart and others. Through this, the author achieves the
    higher precision and accuracy of analyzing the sentiment of the customer in reviews.
    Now there is another type of recommendation system which is built on trust. Trust
    is one of the major issues or aspects of interaction with the user [4]. So for
    achieving this goal, the researcher built the system which not only works on privacy
    but also sees the multi-dimension reputation of the user like what contribution
    as well as what are the social link and rating among similar users.'
