    +   b) Controlling Variable: So when according to variable the result may change
    and we can’t just depend on prediction accuracy because dataset is never static
    as it changes from time to time and we can’t publish the fact that results differ
    because of algorithm or dataset so we require more evaluation measures.


    +   c) Generalization Power: It is generalizing the experiments based on different
    datasets. When one will deploy or develop any new algorithm it should not be specific
    to any one application; it must be beyond that application for that generalization
    of results are necessary.


