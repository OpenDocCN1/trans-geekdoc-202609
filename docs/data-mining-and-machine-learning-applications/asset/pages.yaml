    # 3.2.1 Challenges in RS


    The recommender system faces many challenges [19, 20] that may affect the working
    of the system, and finding a solution for these challenges is the main task of
    research.


    +   1. Novelty: When the user has no clear idea about items and is not known to
    the user or a new item is also used for the emotional replay of users towards
    the suggestion.

    +   2. Cold Start problem: This problem is generated when a site has a new user
    and a new item then the first issue is how one would recommend items to the new
    user and as we don’t know about the user interest. The second issue is new item
    is not rated yet so how we recommend this item to any user.

