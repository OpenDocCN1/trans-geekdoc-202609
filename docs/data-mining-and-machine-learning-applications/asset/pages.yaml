    the forecasting of weather. Since there is no limit on data capturing either from
    the sensors or by the satellites so these input data can be treated as the data
    stream for weather data which can be analyzed using stream mining technique to
    forecast and categorize the weather data for a particular location. Concept drift
    detection with application to weather data stream is proposed by Namitha [20].


