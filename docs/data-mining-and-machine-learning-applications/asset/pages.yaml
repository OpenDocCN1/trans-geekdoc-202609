  md: '# 17.1 Introduction


    This book gives a brief introduction to tools, techniques, algorithms, and methods
    used in data mining. We hope readers will get a closer look at every aspect of
    data mining. In chapter 1, the authors have given a brief introduction to basic
    concepts of data mining such as KDD—knowledge discovery in databases, introduction
    to classification, and clustering. In this chapter, the authors have discussed
    clustering algorithms like k-means, nearest neighbor, etc. Authors have given
    an in-depth introduction to tools one can use in data mining, i.e., Python, KNIME,
    and RapidMiner. The authors have given a step-by-step guide to the installation
    of KNIME and other tools of data mining which will surely help the researchers,
    students to develop numerous applications. Applications of data mining like the
    healthcare industry, marketing, scientific applications, etc., are nicely discussed
    in this chapter. KDD—knowledge discovery in the database process with its different
    phases like data cleaning, data integration, data selection and transformation,
    representation are discussed. The authors have also given a comparative discussion
    of classification and clustering.


    In Chapter 2—Classification and Mining behavioral of data, authors have discussed
    the use of data mining in businesses. Nowadays, businesses are using CRM frameworks
    to identify purchasing habits, customer retention rate, business growth, etc.
    With this intent to improve businesses, the authors have discussed various complex
    practices in this chapter also focused on categorizing the clients such as customers,
    an organization pur- chasing the products, people inside the organization, etc.
    Hence, according to such categorization of users, authors have suggested applying
    different practices to get better results.


    A popular application of data mining in recommender systems to consider user’s
    interests and provides suggestions accordingly. Chapter 3 focused on recommender
    systems, content-based suggestions to the users, etc. The authors have discussed
    hybrid recommender systems, collabora- tive filtering that can be used in developing
    recommender systems. The authors have identified various problems, issues in implementing
    recom- mender systems in terms of demographic, utility, etc.


    There are various types of data mining, and one is discussed in this chapter is
    stream mining. Nowadays, everyone deals with big data, and ana- lyzing this large
    volume of data is a critical task. Stream mining addresses the major issue of
    data analysis when it is not possible to store the incom- ing stream on the local
    systems/storage. Chapter 4 focuses on the various issues on analyzing the incoming
    streams, summarizing the streams, etc.'
