    # Measuring Rating Prediction Accuracy


    +   a. Root Mean Square Error: When the true ratings are known and the system
    produces predicted ratings for a test of user-item pairs.


    ```

    $RMSE = \sqrt{\sum_{i=1}^{n} \frac{(\hat{y}_i - y_i)^2}{n}}$

    ```


    Where, $\hat{Y}1, \hat{Y}2... \hat{Y}i$ is predicted values'
