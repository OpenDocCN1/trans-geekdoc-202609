- pgno: 124
  md: 'outliers in streamed data is the handling of concept drifts, uncertainty, transience
    and temporal context of data [12, 13]. Various issues in outlier detection for
    data stream is also discussed by Sadik and Gruenwald [14]. In this section some
    of the outlier detection techniques discussed by Yu et al. [12] are summarized
    in brief.


    Yu et al. [12] have discussed that the outlier detection techniques in a data
    stream can be classified as sliding window based techniques, distance based techniques,
    density based techniques, statistical based models, kernel density models and
    clustering based techniques for identification of outliers in a data stream. In
    sliding window based technique, data stream is processed in a fixed size window
    (data chunk) from which tentative outliers are identified. As discussed earlier,
    it is practically not possible to analyze the entire stream so it is a good choice
    to process the stream in segments and hence sliding window based techniques are
    a popular choice for analysis tasks such as outlier detection. Various parameters
    are calculated for a window such as average medians and the calculated value is
    passed to the next windows for detecting outliers in window based outlier detection
    techniques. In distance based outlier detection techniques, various distance measures
    are considered for outlier detection and far away distance elements are marked
    as outliers in a data stream. In density based outlier detection techniques, the
    non-dense region of data elements is focused for determining the outliers. A sense
    region indicates the population of the general data elements and considers them
    as non-outlier data. Density functions are used to identify the non-dense regions
    and marking outliers. Statistical based models of outlier detection are parametric
    models which are driven by various analysis parameters from which the outlier
    decision can be made. Kernel density based models are nonparametric models which
    are driven by probability density functions of random variables also known as
    kernel functions to estimate the outliers in a data stream. The last category
    of outlier detection technique is the oldest and popular technique called as clustering
    based models for outlier detection. In this type of technique clusters are created
    from the data stream and data points which do not fall under any clusters are
    treated as outliers in the data streams.


