  md: '# 13.8 Conclusion


    The relationship among source and target domain affects the impact of transfer
    learning. Instead of improving the process of learning, leveraging the brute-force
    poorly from the source with respect to the target might degrade the performance
    of a classifier. We reduced the negative-transfer by importing of knowledge from
    multiple different sources for increasing the chance of searching a source corresponding
    to the target. In this work, MultiSource Dynamic TrAdaBoost (MSDTra) an instance
    transfer-learning approach is designed for the classification of imbalanced class
    distribution in pigmented skin lesion datasets towards melanoma detection. The
    proposed framework integrates the knowledge obtained from different source domains
    and resolves the problem of multiclass classification using transfer learning
    with the same distribution of data and class unbalance among negative and positive
    instances of datasets. The proposed method averts the effect of negative-transfer
    and skewed class distribution in skin lesion datasets by incorporating multiple
    sources. The experimental results and theoretical analysis illustrate that the
    proposed method provides promising performance of classification than the several
    conventional methods.


