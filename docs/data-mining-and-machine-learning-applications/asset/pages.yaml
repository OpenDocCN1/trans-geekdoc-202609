  md: 'The development of sketching algorithm depends on the types of analysis queries
    to be addressed in the data streams. In this section an overview of some popular
    sketching algorithms is presented in brief. Sketching algorithms present a way
    for summarizing the data streams [2]. The generated summary is also known as synapses.
    The stream analysis is then performed on the summary of the data streams to make
    the analysis faster. Sketching can be performed in many ways one simple is by
    using aggregate operators and functions. Sketching is used primarily as a data
    reduction tool for data streaming as an alternate technique for sampling.


    Cormode and Muthukrishnan [6] presented a sketching algorithm namely, count-min
    sketch which is based on a sublinear space data structure. The proposed sketching
    algorithm works in two steps. In the first step data streams elements are counted
    in a chunk and then in the second step a minimum subset of the chunks is selected
    as a sketch of the data stream. Another sketching algorithm for software switches
    is presented by Liu et al. [7]. The proposed sketching algorithm is designed to
    generate the summaries from the software switches for network traffic analysis
    as an alternate approach of packet sampling in network traffic analysis. The proposed
    sketching algorithm is named as NitroSketch that performs sketching of network
    traffic (packet) in two major stages. In the first stage multiple hash arrays
    are generated from the network traffic and then in the second stage sketch is
    generated from a reduced number of hash functions and arrays selected from the
    previous stage.


    # ## 4.3 Concept Drift


    Concept drift represents a cut-off point in the data stream which can impact the
    data stream analysis tasks. When there are some changes on input data streams
    and behavior of the stream start going different then obviously the analysis output
    from the data stream will also start varying, the point from which the changes
    takes place is called as the concept drift. Concept drift detection is also a
    key area in stream data mining and researchers have carried lot of recent work
    in the direction of detection of concept drift in the incoming input data stream.


    Wares et al. [8] have summarized the previous work carried in the direction of
    concept drift detection in stream mining. Wares et al. [8] broadly categorized
    the concept detection techniques in the four major categories. These categories
    are statistical based concept drift detectors, window-based detectors, block-based
    ensemble detectors and incremental ensemble detectors. In statistical based concept
    drift detectors, various'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'statistical techniques along with supporting logical operations are used for
    detection of concept drifts in a stream.


    A comparative study on concept drift detectors is carried by Gonçalves et al.
    [9]. Gonçalves et al. [9] have discussed that concept drift detection techniques
    can be classified using speed of change and reason of change. Using speed of change
    the concept drift detectors can again classified into two categories, abrupt concept
    drift occurs in case of sudden data changes and gradual concept drift occurs in
    the case of smooth data changes. On the other side, using reason of change technique
    the concept drift detectors are categorized into two categories, real concept
    drift when target labels are changed for incoming instances and virtual concept
    drift when data distribution is changed.


    Gonçalves et al. [9] have compared eight concept drift detectors namely, DDM (Drift
    Detection Method), EDDM (Early Drift Detection Method), PHT (Page–Hinkley Test),
    STEPD (Statistical Test of Equal Proportions), DoF (Degree of Drift), ADWIN (Adaptive
    Windowing), Paired Learners, and ECDD (Concept Drift Detection). DDM uses a classifier
    to categorize and compare the incoming instance of the stream with the target
    labels and compute the error rate, based on the error rate it predicts about the
    concept drifts. EEDM is just like the DDM, the only difference is this technique
    uses distance error rate rather than error rate for detecting concept drifts.
    PHT computes the mean of observed values and is fails to classify the incoming
    instance in case of concept drift occurs as classifier accuracy will fall suddenly.
    ADWIN is the windows based concept detection technique, where depending on the
    window size the concept drift is detected. Based on the incoming instances the
    window will grow and shrink, a sudden change in the window size will indicate
    a concept drift. Paired Learners is the concept drift detector uses a pair of
    classifier learners, one classifier is called the stable learner and other is
    called as reactive learner. Based on the accuracy change in both of the learners
    the concept drift is detected. ECDD is the probability based concept drift detection
    technique where exponential weighted moving average values of random variables
    on incoming input instance is used to detect the concept drift. STEPD algorithm
    compares the accuracy of the most recent instances with the average accuracy of
    the classifier to predict the concept drifts. DoF processes the incoming instances
    chunk by chunk and the using nearest neighbor technique for previous chunks measures
    the similarity and predicts the concept drifts. The comparisons are made using
    the performance parameters accuracy, evaluation time, false alarm and miss detection
    rates. It was shown that DDM is the best concept drift algorithms using most of
    the performance parameters.'
  merge: -1
  img_proc: true
