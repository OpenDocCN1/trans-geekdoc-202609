  md: 'Y1, Y2.....Yi is the observed value

    N is no. of observation.


    +   b. Mean Absolute Error: The average of all absolute errors in the definition
    of MAE. An absolute error is a difference between the measured value and the true
    value.


    ```

    $(\Delta x) = x_i - x$

    ```


    Where x_i is the measurement, x is the true value.


    ```

    $MAE = \frac{1}{n} \sum_{i=1}^{n} |x_i - x|$

    ```


    Where, n = the number of errors, |x_i - x| = the absolute errors


    # Measuring Usage Predication


    A dataset consisting of items that each user used is known as usage prediction
    and inside these various measures are works based on True Negative, False Positive,
    False Negative, True positive. Now, these four types are based on the actual value
    and predicted value as we can see in Table 3.3.


    +   a. Precision: When fractions of positive number of cases among the total number
    of positive cases in the system are retrieved then it is known as positive class
    prediction which is another name of precision. When it predicts yes the person
    likes cats, how often is it correct?


    ```

    $Precision = \frac{tp}{(tp + fp)}$

    ```


    # Table 3.3 Base of usage predication.


    | Conditions | Actual value | Predicted value |

    |---|---|---|

    | True Negative | False | False |

    | False Positive | False | True |

    | False Negative | True | False |

    | True Positive | True | True |'
  merge: -1
