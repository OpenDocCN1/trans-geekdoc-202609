    # Abstract


    Data becomes a new currency for the world. Due to COVID-19, a significantly fewer
    number of flights are running, and hence the scientists cannot forecast the weather
    accurately. The data capturing also goes low because of this smaller number of
    flights. Data mining techniques play a vital role in collecting data for prediction
    and forecasting using different machine learning techniques. Recommender systems
    are available at all emerging places like agriculture, admission, matchmaking,
    traveling, share market, housing loan, parenting, nutrition, and consultation.
    Cybersecurity and forensics are also very challenging domains to fight with cybercrimes.
    Only data can save an entity from cyber-attacks. This chapter concludes with the
    future direction in data mining and machine learning techniques dealing with some
    related issues.


    **Keywords:** KDD, stream mining, ANN, machine learning, deep learning, object
    recognition, object instance segmentation, R-CNN


    *Corresponding author: dr.kapil@ieee.org'
