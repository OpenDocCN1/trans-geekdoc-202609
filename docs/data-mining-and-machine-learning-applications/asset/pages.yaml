  md: '# ## 7.1 Introduction


    Progression in technology has revolutionized the day to day activities of humans.
    Companies are embracing automation, artificial intelligence, Internet of Things,
    etc. Software systems are no longer used by experts but is embraced by common
    man in their day to day lives. Computing systems have a strong impact globally
    in varied domains and software systems are integrated to it directly or indirectly.
    According to the Institute of Electrical and Electronics Engineers (IEEE) Standard
    610.12-990 [1] software is a condition or a capability needed by a user for problem
    solving/achieve a capability [1]. Therefore, the quality of software system depends
    on the stakeholders. The same is defined by Stephen H. Khan as an intangible concept
    that can be discussed, felt and judged from the customer’s perspective [2].


    If the software system meets the expectations of the customer and works as per
    the requirement, software systems are said to be successful [3]. The software
    systems come with a set of services and service level agreement. IT service management
    (ITSM) is the activities that are performed by an organization to design, plan,
    deliver, operate and control services associated with the software system offered
    to customers [4].


    But what are IT services? All the services provided by your IT team can be termed—IT
    services. For example, Firewall Services, Cyber-security Services, Data Backup
    & Restoration, etc.


    An IT Service Team is responsible for end-to-end management of these services
    and can rely on ITSM software like Freshservice to effectively manage these services.
    ITSM has detailed steps that need to be followed when a service request comes
    up or an incident occurs [5]. Figure 7.1 specifies the process followed when a
    ticket is raised by the customer that is defined by ITSM.


    Therefore, failure in meeting the SLA clauses and resolving the incidents on time
    has a negative impact on the business strategy of the service providers. The demand
    on the improvement of software as well as the associated techniques are constantly
    rising and so is the need to recognize its consistency [6].


    An effective ITSM not only benefits the company by creating processes to address
    each of the IT organization’s most important functions, establishing what roles
    are required to deliver on each of those processes, clearly defining the responsibilities
    and participation of each role in the process but also establishes a process that
    supports the Service Catalog Management which establishes and maintains an up-to-date
    repository of all services'
