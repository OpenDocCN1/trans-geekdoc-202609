  3. 写一篇短文说明你的观点。\n\n### 项目\n\n项目 8.1: RSA 加密\n利用网络或其他资源，写一篇关于 `RSA`、其历史、方法以及应用场景的短文。具有足够数学背景的学生可以选择深入研究\
  \ `RSA` 算法的数学基础。\n\n项目 8.2: 编程凯撒密码\n此项目适用于具有某些编程背景的学生。\n\n使用任何你喜欢的语言（或老师指定的语言）编写一个简单的程序，可以执行\
  \ `Caesar cipher`。在本章中，你不仅看到了这种密码是如何工作的，还获得了一些如何使用 ASCII 码使其在任何标准编程语言中运行的想法。\n\n\
