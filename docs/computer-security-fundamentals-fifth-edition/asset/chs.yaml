  \n### 项目\n\n### 项目 2.1: 学习 DNS\n\n1. 利用网络资源查询 DNS 协议。你可能会发现以下网站很有帮助：[www.freesoft.org/CIE/Topics/75.htm](http://www.freesoft.org/CIE/Topics/75.htm)。\n\
  \n2. 查询以下事实：谁发明了 DNS 协议？它的目的是什么？它是如何使用的？\n\n3. 写一篇短文描述该协议的功能。简要提到它是谁发明的、何时发明的以及它是如何工作的的。\n\
  \n### 项目 2.2: 学习你的系统\n\n1. 找出你的机构（例如，你的学校或公司）是使用交换机、集器器还是两者都用。为什么你们小组使用这些设备？你可以通过询问网络管理员或帮助台来了解。确保告诉他们你是为了课程项目在寻找这些信息。\n\
  \n2. 写一篇短文解释你的发现，以及如果你可以进行的话，你会做哪些更改。例如，如果你的机构只使用集器器，你会改变这种方法吗？如果是，为什么？\n\n### 项目\
  \ 2.3: 学习 `NetStat`\n\n1. 在命令提示符处输入 `netstat`。注意它为你提供的信息。你应该看到当前连接到你计算机的服务器 IP 地址或名称。\n\
  \n## 注意：停止 `NetStat`\n\n1. 注意，在许多版本中，你需要使用 `Ctrl+C` 来停止 `NetStat`。\n\n2. 现在尝试 `netstat\
  \ -a` 查看所有连接。\n\n3. 现在尝试 `netstat -e`。\n\n4. 最后，尝试 `netstat -n`。\n\n# 第 3 章：网络跟踪、欺诈与滥用\n\
  \n### 目标\n\n在阅读本章并完成练习后，你将能够：\n\n- 了解各种类型的欺诈\n- 理解什么是网络跟踪\n- 了解避免欺诈的特定步骤\n- 了解保护自己的特定步骤\n\
  - 了解适用的法律\n\n### 引言\n\n欺诈是一个日益严重的问题。互联网让它变得更容易。\n\n### 网络欺诈如何运作\n\n通过互联网实施欺诈的方法有多种。美国证券交易委员会\
  \ (SEC) 列出了几种类型的网络欺诈，但要详述将写满一整本书甚至几卷。我们可以涵盖的是最常见的骗局，并尝试推导出一些适用于任何潜在欺诈的通用原则。如果你利用这些特定案例来推导出一些通用原则，那么你就应该准备好避免大多数欺诈。\n\
  \n\n\n\n投资邀约并不新奇。甚至是一些合法的股票经纪人也通过冷启动维持生——也就是说，简单地给人们打电话（可能是通过电话簿），并试图让他们投资某只特定的股票。这种做法虽然被一些正规公司采用，但也是诈骗者最喜爱的骗术。互联网让投资邀约（无论是真实的还是欺诈的）能够更容易地传播给普通大众。大多数读者可能对定期涌入他们收件箱的投资邀约并不陌生。其中某些邮件通知试图诱导你直接参与某个特定的投资计划；另一些邮件则提供看似中立的、免费的投资者信息。（遗憾的是，这些建议中的很多并不如表面看起来那样中立。）虽然合法的在线简报可以帮助投资者收集有价值的信息，但请记住，有些在线简报是欺诈性的。\n\
  \n### 常见骗局\n\n较常见的骗局之一是发送电子邮件，暗示你可以通过极少的投资获得巨额财富。在这些骗局中最著名的可能过于“尼日利亚诈骗”。在这种情况下，邮件会被发送给多个随机电子邮箱地址。每封邮件都包含一条信息，声称来自某位去世的尼日利亚医生或政府官员的亲属。去世者将是你认为具有显著社会地位的人，从而增加了你以好看待该邀约的可能性。该邀约的内容如下：某人有一笔钱想转出国外，出于安全考虑，他无法使用正常渠道。他希望使用你的银行账户临时“存放”这些资金。如果你允许他访问你的账户，你将获得一笔丰厚的费用。如果你同意这一安排，你将通过普通邮件收到一系列看起来非常正式的文件，足以说服大多数普通观察者该安排是合法的。随后，你会被要求垫一些资金以支付税费和电汇费等费用。如果你真的发送了任何钱，你就会失去它，并且再也收不到这些人的消息了^(4)\n\
  \n^(4) [www.lbl.gov/IT/CIS/CITG/email/419-Fraud.html](http://www.lbl.gov/IT/CIS/CITG/email/419-Fraud.html)\n\
  \n现在从逻辑角度考虑一下这种投资骗局及其变体。如果你有大笔资金需要转账，你会把它发给一个从未见过的外国陌生人吗？你不会担心收件者会提取账户资金并乘坐下一班飞机飞往里约约吗？如果一个人需要进行国际转账，为什么不直接把钱转到巴哈马的账户呢？或者提取资金并通过\
  \ FedEx 或 UPS 寄到美国的存储设施？重点在于，人有许多方法可以把钱汇出去，而不需要信任一个从未见过的陌生人。单此事实就应该告诉你，这个邀约根本不合法。这个概念是你关于欺诈时应该得出的第一个通用原则。在任何邀约中，都要考虑提供者的观点。听起来他是否在承担极不合理的风险？这笔交易是否看起来奇怪地偏于你？将自己放在他的位置考虑。如果你处于他的位置，你会参与这笔交易吗？如果没有，那么这个因素就是交易可能并非表面看起来那样的信号。\n\
  \n### 投资建议\n\n像上面提到的尼日利亚骗局这种露骨的欺诈并不是互联网上唯一的投资陷阱。有些公司会给编写在线简报的人付费推荐他们的股票。虽然这种活动实际上并不违法，但美国联邦证券法要求简报披露作者已获得报酬以提供此类建议。制定此类法律是因为，当作者在推荐任何产品时，他们的意见可能会受到为该意见提供报酬这一事实的影响。许多在线投资简报并未提供这种披露，这意味着你得到的“中立”股票建议实际上可能带有很大偏见。与其获得中立专家的建议，不如你可能获得的是一则付费广告。这个陷阱是在线投资建议中最常见的圈阱之一；它比露骨的诈骗更为常见。\n\
  \n有时，这些在线股票快报可能是更广泛计划的一部分，通常被称为 `pump and dump`（拉高后抛售）。经典的“拉高后抛售”相当简单。骗子购买大量几乎毫无价值的股票。然后，骗子通过几种方式人为地推高其价值。一种常见方法是在各种互联网公告板和聊天室开始散布谣言，称该股票即将大幅上涨。通常骗子会暗示公司在未来几周内推出某种新的创新产品。另一种方法只是向尽可能多的人推销这只股票。竞争某只股票的人越多，价格就越高。如果结合这两种方法，有可能让这种毫无价值的股票价值暂时翻倍或三倍。诈骗者在执行此计划之前以极低价格购买了大量股票，当价格达到她认为可以最高点时就抛售股票。在短时间内，显然在公司发布下一份季度财报之前，股票就会回到其真实价值。这种骗局在过去的几十年里非常流行；因此，你应该始终警惕此类“内部”信息。如果一个人知道\
  \ `Company X` 即将推出一种将推高其股票价值的创新产品，她为什么要与完全陌生的人分享这一信息呢？^(5)\n\n^(5) [www.sec.gov/investor/pubs/pump.htm](http://www.sec.gov/investor/pubs/pump.htm)\n\
  \n- 考虑来源。特别是如果你不熟悉市场，确保只接受来自知名且良好的股票分析师的建议。\n- 独立验证。不要仅仅听信他人对任何事的说法。\n- 研究。了解该公司、关于公司的说法、股票历史等。\n\
  - 警惕高压手段。合法的股票交易员不会迫客户购买。他们帮助客户选择客户想要的股票。如果你感到被压力，这说明可能存在问题。\n- 保持怀疑。健康的怀疑态度可以为你节省大量的钱。正如俗所说，“如果一件事听起来不真实，那么它很可能不是。”\n\
  - 确保你彻底研究任何投资机会。\n\n事实是，这些类型的欺骗取决于受害者的贪婪。我的本并不是要指责诈骗受，但重要的是，如果你让贪婪代替你思考，你就会成为诈骗受害的理想人选。你的\
  \ `401(k)` 或 `IRA` 可能不会让你一夜之间获得巨额财富，但它是稳定且相对安全的。（没有任何投资是完全安全的。）\n\n\n\n从务实角度上来说，处理在线投资的建议方法是只有在你向信誉良好的经纪人发起讨论时才参与。这意味着你永远不会响应或参与任何通过电子邮件、在线广告等发送给你的投资提议。你只会参与你与知名经纪人发起的投资。通常，此类经纪人是声誉良好的传统投资公司，他们现在只是在网上提供其服务。此外，检查任何在\
  \ `SEC` 注册的经纪人也是重要的。\n\n## 拍卖诈骗\n\n在线拍卖网站（如 `eBay`）可以是以非常廉的价格寻找商品的绝佳方式。我经常使用此类拍卖购买商品。然而，任何拍卖网站都充满了危险。你真的能得到订购的商品吗？它会“如广告所示”吗？大多数在线拍卖是法的，大多数拍卖网站都会采取措施来限制与用户交易相关的欺诈。但问题仍然存在。事实上，美国联邦贸易委员会（`FTC`）列出了以下四类在线拍卖诈骗：\n\
  \n- [`www.onguardonline.gov/articles/0020-shopping-online`](https://www.onguardonline.gov/articles/0020-shopping-online)\n\
  \n- 未寄送商品\n- 发送的物品价值低于广告描述\n- 未能及时交货\n- 未披露有关产品或销售条款的所有相关信息\n\n第一类“未寄送商品”是最显明显的欺诈案例，而且相当简单。一旦你支付了物品的费用，商品就没有到达。卖家直接留下了你的钱。在有组织的诈骗中，卖家会同时广告多件物品出售，收取所有拍卖的资金，然后消失。通常，整个过程是使用虚假身份、租用的邮箱和匿名电子邮件服务完成的。随后，此人就会带着诈骗的收益离开。\n\
  \n第二类诈骗“交付的物品价值低于广告描述”可能会变成一个灰色地带。在某些情况下，这是赤裸裸的欺诈。卖家对产品的某些描述完全不属实。例如，卖家可能会广告某位著名作者书籍的第一版签名本，但随后寄给你的的是第四版，上面要么没有签名，要么签名是未经证实的。然而，在这一类问题的其他情况下，这可能仅仅是卖家过于热心或坦率地说说错了。卖家可能声称他的棒球被著名运动员签过名，但他自己并不知道该签名是伪造的。\n\
  \n第二类与 `FTC` 列表上的第四项密切相关：未披露有关物品的所有相关事实。例如，一本书可能是正版第一版并有签名，但其物理状况如此糟糕以至于一文不值。卖家可能可能不会提前提到这一事实。未能提供有关特定物品的所有相关事实可能是赤裸裸的欺诈结果，也可能仅仅是卖家的无知。`FTC`\
  \ 还将“未按时交付产品”列为一种欺诈形式。在许多情况下，并不清楚这是否属于欺诈，或仅仅是极其不完善的客户服务。\n\n`FTC` 还列出了另外三种在互联网上日益流行的拍卖欺骗领域：\n\
  \n- **托儿/竞标（Shill bidding）：** 发生在欺诈卖家（或其“托儿”）对卖家的物品进行竞价，以推高价格。\n- **掩护投标（Bid shielding）：**\
  \ 发生在欺诈买家提交非常高的出价，以阻挡其他竞标者竞争同一物品。虚假买家随后撤回出价，以便他们认识的人能以较低的价格获得物品。\n- **引流/骗标（Bid\
  \ siphoning）：** 发生在骗子通过提供以低价出售“相同”物品来诱导竞标者离开合法的拍卖网站。他们的意图是欺骗消费者汇款而不提供物品。通过离开原网站，买家将失去原始网站可能提供的任何保护，例如保险、反馈表或担保。\n\
  \n### 托儿/竞标 (Shill Bidding)\n\n托儿竞标很可能是这三种拍卖诈骗中最常见的。它并不复杂。如果犯罪者在拍卖网站上出售物品，她还会创建几个虚假身份。她将使用这些虚假身份对该物品进行竞价，从而推高价格。如果此类计划在运行，非常难发现。然而，拍卖中的一个简单准则是在开始竞价之前，决定你的最高价格是多少。然后，在任何情况下你都不要超过该价格哪怕一分钱。\n\
  \n### 掩护投标 (Bid Shielding)\n\n虽然托儿竞标可能难以应对，但拍卖网站的所有者可以相当容易地解决掩护投标。许多大型拍卖网站（如 `eBay`）已措施防止掩护投标。最明显的一点是取消在赢得拍卖后退出的竞标者的竞价权限。所以，如果一个人为了赶走其他人而出了非常高的价，然后在最后一刻撤回了他的出价，他可能会失去在该拍卖网站上参与的能力。\n\
  \n### 引流/骗标 (Bid Siphoning)\n\n引流骗标比其他形式的拍卖诈骗少见。在这种方案中，犯罪者在拍卖网站上挂出一件合法的物品进行拍卖。但在该物品的广告中，她提供了不属于拍卖网站的网站链接。跟随这些链接的疏忽买家可能会发现自己进入一个替代网站，而该网站是用来实施某种欺诈的“陷阱”。\n\
  \n所有这些战术都有一个共同目标：颠覆正常的拍卖过程。正常的拍卖过程是资本主义和民主的理想结合。如果愿意比其他购物者出价，每个人都有平等的机会获得相关的产品。买家们根据他们感官到的产品价值来设定产品价格。在我看来，拍卖是商业的极佳工具。然而，不良之徒总是为了自己的目标颠覆这一过程。\n\
  \n### 身份盗用 (Identity Theft)\n\n身份盗用是一个日益增长的问题，也是一个令人不安的问题。这个概念相当简单，尽管过程可能很复杂，而且对受害者的后果可能是非常严重的。其核心想法仅仅是让一个人冒充另一个人的身份。这通常是为了购买而尝试；但身份盗用也可以出于其他目的，例如以受害者的名字获取信用卡甚至是驾照。如果犯罪者以他人的名字获得信用卡，那么他就可以购买产品，而欺诈受害者将面临着他们不知情且未授权的债务。\n\
  \n\n\n在以受害者名义办理驾照的情况下，这种欺诈行为可能是为了保护犯罪分子免受其自身糟糕驾驶记录的后果。例如，某人可能会获取你的驾驶信息并制作一张印有自己照片的驾照。也许此案中的犯罪分子有非常糟糕的驾驶记录，甚至有立即逮捕的通缉。如果该人员被执法人员拦下，她可以出示假驾照。当警察检查这张驾照时，发现它是合法的，且没有未执行的逮捕令。然而，犯罪分子收到的罚单将记录在你的驾驶记录中，因为驾照上是你的信息。该欺诈的实施者也不可能实际支付这笔罚单，因此在某个时刻，你——这个身份被盗用的人——将收到通知，由于未缴纳罚单，你的驾照被吊销。除非你随后通过证人证明在开具罚单时你并不在现场，否则你可能别无选择罚单以重新恢复驾驶权限。\n\
  \n美国司法部对身份盗窃的定义如下：^(7)\n\n^(7) [`www.justice.gov/criminal-fraud/identity-theft/identity-theft-and-identity-fraud`](https://www.justice.gov/criminal-fraud/identity-theft/identity-theft-and-identity-fraud)\n\
  \n`identity theft`（身份盗窃）和 `identity fraud`（身份欺诈）是用于指代所有此类犯罪的术语，即通过欺诈或欺骗手段非法获取并使用他人的个人数据，通常是为了经济利益。\n\
  \n互联网使得盗取身份的过程比以前更加容易。许多州现在都有在线法院记录和机动车辆记录。在某些州，个人的社会安全号码被用作驾照号码。因此，如果犯罪分子获取了一个人的社会安全号码，他就可以查询该人的驾驶记录，可能获得该人驾照的副本，找到有关该人的任何法院记录，甚至在某些网站上查到该人的信用历史。在本书的后面，我们将探讨如何将互联网作为调查工具。像任何其他工具一样，它可以被用于良性或恶意目的。你用来对潜在员工进行背景调查的相同工具，也可以用来获取足够的信息来伪造他人的身份。\n\
  \n2022 年的一个典型案例涉及一名纽约市的男子，他被指控试图从别人的银行账户中盗取数千美元^(8)。个人 `Mr. James Chandler` 被指控使用假驾照前往银行试图提取资金。`Identity\
  \ theft` 也由有组织的团体实施。2022 年，有报道提到一个名为 `the Felony Lane Gang` 的团体，他们会从健身房储物柜或停放的汽车中盗取\
  \ `debit` 卡（借记卡）、支票、驾照或类似物品，然后在银行使用这些物品来取资金^(9)。\n\n^(8) [`wnyt.com/top-stories/north-greenbush-police-say-id-theft-suspect-caught-red-handed/`](https://wnyt.com/top-stories/north-greenbush-police-say-id-theft-suspect-caught-red-handed/)\n\
  \n^(9) [`wnyt.com/archive/duo-charged-in-felony-lane-gang-crimes-2/`](https://wnyt.com/archive/duo-charged-in-felony-lane-gang-crimes-2/)\n\
  \n#### FYI：身份盗窃的替代手段\n\n犯罪分子可以在不使用互联网的情况下进行身份盗窃。达拉斯-沃斯堡大都会区的一个犯罪集团一直在与餐厅的服务员合作。当服务员拿着你的\
  \ `credit card`（信用卡）或 `debit card`（借记卡）付费时，他会使用一个小型手持设备（隐藏在口袋里）扫描你的信用卡信息。然后他会将这些信息提供给身份盗窃团伙，他们可以进行在线购物，或使用被盗信息制作带有你的名字和账户数据的假信用卡。避免这种危险的唯一方法是永远不要使用你的\
  \ `credit card` 或 `debit card`，除非它是在你面前处理的。不要让别人把卡离开你的视线去处理它。\n\n## 网络钓鱼\n\n实现身份盗窃的常见方法之一是通过被称为\
  \ `phishing`（网络钓鱼）的技术，这种技术是试图诱导目标提供个人信息。例如，攻击者可能会发送一封伪造成来自银行的邮件，告知收件者账户存在问题。邮件随后引导他们点击一个指向银行网站的链接，并在那里登录验证账户。然而，该链接实际上指向的是攻击者设立的假网站。当目标进入该网站并输入信息时，他就将用户名和密码交给了攻击者。\n\
  \n如今许多终端用户已经意识到这些策略并避免点击邮件链接。但遗憾的是，并非每个人都如此谨慎，这种攻击仍然有效。此外，攻击者想出了新的钓鱼方法。其中一种方法被称为\
  \ `cross-site scripting`（跨站脚本）。如果一个网站允许用户发布其他人可以看到的内容（如产品评论），攻击者就可以借此发布他人可见的内容。\n\
  \n## 网络跟踪\n\n近年来，网络钓鱼邮件变得日益复杂。2018 年开始的一种特定钓鱼诈骗利用了暴露的密码以及受害者可能面临的尴尬。这种骗局的操作方式是：攻击者从某个网站获取一份暴露密码列表，然后向列表中的人员发送邮件。邮件声称受害者的电脑安装了恶意软件，该软件观察到了受害者观看色情并自慰的过程。攻击者表示，如果\
  \ 24 小时内没有向比特币钱包存入特定金额，他会将视频发送给同事和家人。这是一个相当复杂的网络钓鱼诈骗案例。\n\n\n\n\n跟踪行为往往是暴力行为（包括性侵犯和杀人）的前奏，在过去几年中引起了极大关注。许多州通过了各种反跟踪法律。然而，跟踪已扩展到网络空间。`cyber\
  \ stalking`（网络跟踪）涉及利用互联网骚扰他人；或者正如美国司法部所说：\n\n[`www.justice.gov/ovw/stalking`](https://www.justice.gov/ovw/stalking)\n\
  \n尽管对 `cyber stalking` 还没有普遍接受的定义，但本报告使用的该术语是指使用互联网、电子邮件或其他电子通信设备跟踪他人。跟踪通常涉及个人反复实施的骚扰或威胁行为，例如跟随某人、出现在某人的住所或工作场所、拨打骚扰电话、留下书面信息或物品，或破坏他人的财产。大多数跟踪法律都要求犯罪者对受害者发出可信赖的暴力威胁；另一些法律则包括对受害者直系家属的威胁；还有一些法律仅要求被指控跟踪者的行为构成暗示威胁。虽然某些涉及烦扰或威慑行为的行为可能未达到非法跟踪的程度，但此类行为可能是跟踪和暴力的前奏，应当被严肃对待。\n\
  \n如果有人利用互联网骚扰、威胁或恐吓他人，那么该犯罪者就构成 `cyber stalking` 罪。最明显的例子是发送威胁性电子邮件。关于什么被视为“威胁”的指南在不同司法管辖区之间会有很大差异。但一个好的原则是，如果邮件内容在正常言语中被认为是威胁性的，那么通过电子方式发送时很可能被视为威胁。`cyber\
  \ stalking` 的其他例子则较不明确。如果你要求某人停止给你发邮件，而她仍然继续这样做，这算犯罪吗？遗憾的是，这个问题没有明确的答案。事实是，这可能被或不被视为犯罪，取决于邮件内容、频率、接收者与发送者之间的先验关系以及司法管辖区等因素。\n\
  \n## 真实网络跟踪案例\n\n以下案例同样来自司法部网站，阐明了 `cyber stalking` 的案例。研究这些案例中的事实可能帮助你了解法律上什么构成了\
  \ `cyber stalking`。虽然这里讨论的许多案例是最近的，但也讨论了一些较旧的案例，以便你对这一问题有一个全面的理解：\n\n* 第一个案例虽然久远，但它是\
  \ `cyber stalking` 历史上一个关键案件。在加利福尼亚州网络跟踪法的首次成功起诉中，洛杉矶检察官办公室的检察官获得了一名 50 岁前保安人员的认罪出，该人员利用互联网诱唆强奸一名拒绝其感情追求的女性。被告通过在各种网络聊天室和在线公告板上冒充其\
  \ 28 岁的受害者来对其进行恐吓，他在那里发布了受害者的电话号码和地址，以及受害者幻想被强奸的信息。在至少六次中（有时是在半深夜），男人敲开该女人的门，说他们想强奸她。这名前保安人员于\
  \ 1999 年 4 月对一项跟踪罪和三项诱唆性侵犯罪认罪。他面临多达 6 年的监禁。\n* 在加利福尼亚州，现役海军陆战队的 Johao Chavarri 先生被指控创建了大量在线账户，用于跟踪、骚扰和威胁那些拒绝满足其发送裸照要求的女性。该案发生在\
  \ 2022 年，Chavarri 先生最终认了罪。\n* 2021 年，Barry Goldberg 因在线跟踪一名青少年女孩而认罪。他在网上遇到了受害者，伪装成一名即将因癌症去世的虚构高中男生。他最终开始了一系列骚扰、威胁和胁迫行为，包括向该青少年女孩施压发送色情视频。\n\
  * 2017 年 10 月，Heriberto Latigo 因网络跟踪犯罪被判处监禁。问题始于 2013 年，当时他与一名女性有恋爱关系。Latigo 强迫该女性向他发送裸照，并在网上骚扰她。在关系结束后，他继续向她勒索性行为并发送威胁性图像。\n\
  * 2018 年 9 月，Joel Kurzynski 因跟踪罪认罪。Kurzynski 曾是一名信息技术专业人士。从 2017 年开始，他对个人实施了包括死亡威胁和仇恨言论在内的行为。他在社交媒体上创建了受害者的假资料，寻求虐恋或未成年人关系。Kurzynski\
  \ 被判处监禁 30 个月以及 3 年的监管释放。\n* Robert James Murphy 是首位根据联邦法被指控网络跟踪罪的人。他被指控违反美国法典第\
  \ 47 卷第 223 条，该条款禁止使用电信骚扰、攻击或威胁任何人。Murphy 先生被指控向其女友发送性信息和照片。这种活动持续了多年。他被指控并最终承认了两跟踪罪。\n\
  * 2022 年，来自英国的 Mathew Hardy 因利用社交媒体联系并在网上跟踪女性被定罪。他向受害者的家庭、朋友和同事传播各种谣言，例如断言她与老板甚至亲属通奸。\n\
  \n显然，利用互联网骚扰他人与面对面骚扰同样是犯罪。而且这可能导致现实犯罪。这一问题甚至扩展到了工作场所问题。例如，法院案件判定不受欢迎的电子邮件可以被解释为性骚扰。如果员工投诉不受欢迎的电子邮件，雇主责任至少尝试改善。这种尝试可以仅仅是安装一个非常廉价的垃圾邮件拦截器（限制或消除不受欢迎邮件的软件）。然而，如果雇主采取任何措施解决问题，这种沉默可能被法院视为导致了敌意工作环境。正如之前提到的，如果跟踪行为在现实中被视为骚扰，那么在网络空间中也会被视为骚扰。《布莱法律词典》对\
  \ *harassment*（骚扰）的定义如下：\n\n针对特定个人的、导致该人员产生巨大情感痛苦且没有合法目的的行为。\n\n倾向于烦扰、惊恐和（口头）攻击他人的言语、手势。\n\
  \n执法部门通常需要某些可信的威胁来处理骚扰投诉。简单来说，这意味着如果你在一个匿名聊天室里，有人发表了一些粗俗言语，该行为可能不会被视为骚扰。然而，如果你通过电子邮件收到特定的威胁，这些威胁很可能被视为骚扰。\n\
  \n\n\n\n\n许多州法律明确禁止网络骚扰；而且通常情况下，现有的反骚扰法律也可以适用于互联网。2001 年，加利福尼亚州的一名男子根据现行的反骚扰法规被定犯网络骚扰罪。其他国家也拥有适用于网络骚扰的现有反骚扰法律。加拿大自\
  \ 1993 年起就有全面的反骚扰法。遗憾的是，有很多类似的案例。仅包括以下几个：\n\n* `1998 年身份盗窃与假设威慑法`, `U.S.C. 1028`\n\
  \n* 第一个案例稍显久远，但它说明了这些犯罪是如何升级的。从 2010 年开始，有一个 70 岁的 Joseph Medico，他在教会遇到了一名 16 岁的女孩。Medico\
  \ 跟随女孩来到她的车旁，试图说服她一起去吃晚饭然后回到他的家里。当女孩拒绝了他的追求后，他开始每天给她打好几次电话并发短信。他的行为不断升级，直到该女孩举报了这些活动，Medico\
  \ 因骚扰罪被捕。\n\n* 在 2018 年 3 月，Juan R. McCullum 因阴谋和网络骚扰罪被判处在联邦监狱 1 年零 361 天。McCullum\
  \ 是维尔京群岛代表 Stacey Plaskett 的前助手。他承认传播了一名国会会议员及其丈夫的裸体图片和视频，试图阻碍 Plaskett 夫人的连选。\n\
  \n* 在 2018 年 12 月，Joel Kurzynski 因对多名受害者进行网络骚扰被判处入禁 30 个月并接受 3 年的监督释放。Kurzynski\
  \ 还被命令支付超过 37,000 美元的赔偿。根据法院文件，Kurzynski 策划了垃圾电话，创建了虚假的约会资料，将受害者描述为寻求与未成年人的关系，并发布了死亡威胁。\n\
  \n* 2018 年夏天，Jeron Ramos 涉嫌在马里兰州的一家报纸办公室枪杀了五个人。根据法院记录，这次暴力袭击之前是一场长期的骚扰活动，其中包括非常愤怒的\
  \ Twitter 推文和电子邮件。\n\n* 2021 年，来自德克萨斯州卢德布克的 Andy Castillo 先生被指控针对德克萨斯州韦科地区的女性房地产经纪人，并威胁要性侵他们的孩子。他被指控杀了两名女性并因谋杀罪被捕；然而，Castillo\
  \ 先生在监狱中去世，并未对其被指控的罪名定罪。\n\n* 2018 年，Ho Ka Terence Yung 被定犯网络骚扰罪。在这个案例中，犯罪者并没有尝试直接物理攻击受害者，而是试图煽动针对害者的暴力。根据法院记录，Yung\
  \ 因为被法学院拒绝而感到沮丧，他开始对一名招生官进行网络骚扰活动，其中包括编造故事，声称他的受害者侵奸了一个 8 岁的女孩。Yung 还曾在`Craig`上发布了广告，假装成网络骚扰的受害者，并表现出对虐待和暴力的性活动感兴趣。\n\
  \n* 2022 年，在德克萨斯州罗莱特，Andrew Beard 先生承认了指控，即先对女友进行网络骚扰，然后杀杀了她。Beard 先生在 Alyssa Burkett\
  \ 女士的车辆上安装了 GPS 跟踪器。他跟随她来到德克萨斯州卡罗尔顿的工作场所并射中了她。她虽然受伤但从枪击中幸存，于是 Beard 先生用刀刺了她 13 次。\n\
  \n* 2022 年，在俄克拉荷马州巴特尔斯维，Keith Eisenberger 先生被指控网络骚扰并威胁美国众员 Kevin Hern 及其家人。据指 Eisenberger\
  \ 先生威胁要攻击、绑架或杀害 Hern 先生的家人。诉状指控，Eisenberger 先生在 Hern 先生当选后不久就开始联系 Hern 先生。据称，这些信息随着时间的推移变得越来越暴力，包含了电话和社交媒体信息。\n\
  \n类似的案例可以填好几卷。除了最后一个外，所有这些案例的共同点是计算机被用作工具或催化剂，导致了现实中的犯罪。\n\n\n\n\n遗憾的是，并非所有的通信都达到了网络跟踪扰的程度。网络跟踪扰的一个明显例子是发送威胁性邮件。但即使是`harass`（骚扰）、`threaten`（威胁）和`intimidate`（恐吓）的定义也有些模糊。显然，如果一个人向另一个人发送邮件威胁要杀死对方，并提供接收者的照片以证明发送者熟悉目标人的外貌和地址，这显然是网络跟踪扰。但如果某人对产品不满，向该产品制造商的高管发送了一封措辞严厉的邮件呢？如果邮件中包含模糊的威胁，例如“你会得到应得的”，这算网络跟踪扰吗？这不是一个容易回答的问题，没有一个答案适用于所有的司法管辖区和所有情况。构成威胁、骚扰或恐吓的行为在不同司法管辖区之间很大。但一个一般原则是，如果电子邮件（或即时消息、新闻组帖子等）的内容在正常口语中被视为威胁，那么通过电子方式发送可能也会被视为威胁。\n\
  \n威胁的另一个要素是可行性。该威胁是否可信信？在互联网上，人们的发言往往比在其他场合更激烈、往往更具攻击性。这意味着执法人员必须在某种程度上区分仅仅是随口胡说或发泄情绪的人，与发出真实、严重威胁的人。\n\
  \n执法部门考虑手段、动机和机会（Means, Motive, and Opportunity）。嫌疑人是否有犯罪的手段（即能力）？他或她是否有犯罪的`motive`（动机）？最后，他或她是否有机会？然而，这三个要素是在犯罪发生后用于评估可能的嫌疑人的。它们不能帮助你评估威胁以确定其是否可信。你如何决定是否认真对待一个威胁？关键在于寻找四个因素：\n\
  \n*   **可信度（Credibility）：** 要使一个威胁可信，必须有某种理由预期它可以被执行。例如，假设内布拉斯加州的一位女性在网络讨论板上，在激烈辩论过程中收到了住在曼谷的另一用户的普通威胁。在这种情况下，发送者可能完全不知道接收者住在在哪里。事实上，由于许多人在互联网上使用网名，发送者可能甚至不知道接收者的真实姓名、性别、年龄或外貌。这意味着该威胁的可信度非常低。然而，如果这位内布拉斯加州的女性收到的来自曼谷用户的威胁伴随着她的个人信息，如她的地址、工作地或照片，那么这就是非常可信的威胁。\n\
  *   **频率（Frequency）：** 遗憾的是，人们经常在互联网上发表不明智的评论。然而，通常情况下，一个敌意的评论只是某人在线上的情绪过激且反应过快。由于这种原因，这种类型的评论关注程度低于一段时间内的威胁模式。跟踪扰者经常随着时间的推移升级他们的评论和威胁，逐渐积累到他们采取暴力行动的程度。虽然可能存在单一威胁值得调查的情况，但作为一般原则，孤立的威胁关注程度低于骚扰和威胁的模式。\n\
  *   **具体性（Specificity）：** 具体性指的是犯罪者对于威胁性质、威胁目标和执行手段的具体程度。当然，在威胁性质、威胁目标和执行手段方面非常具体是非常重要的。\n\
  *   **强度（Intensity）：** 强度指的是通信的整体语调、语言的性质以及威胁的程度。\n\n这四个标准并不需要全部满足，威胁才具有可行性。执法人员必须始终依靠自己的判断并采取谨慎态度。某个特定的官员即使没有满足这些标准中的几项，也可能觉得给定的威胁非常严重。该官员应将此事视为严肃的。如果存在一个或多个此类标准，无论个人倾向如何，官员都应该始终认真对待。一个可信、频繁、具体且高强度的威胁通常是现实世界暴力的序奏。\n\
  \n这与传统的执法部门审查手段、动机和机会的学说相似。这个人是否有犯罪的手段？他或她是否有动机？这个人是否有机会？这些问题不仅适用于现实世界，也适用于网络空间，在网络空间，手段和机会被大大扩展。\n\
  \n### 针对儿童的犯罪\n\n特别关注的是涉及未成年人的网络跟踪扰案件。恋童癖现在广泛利用互联网与未成年人互动，并在许多情况下安排与儿童面谈。这对于所有父母、执法官员和计算机安全专业人员来说必须是一个高度关注的问题。恋童癖经常使用聊天室、在线讨论板和各种其他网络媒体与儿童见面。讨论通常会变得色情，并最终导致尝试面谈。幸运的是，这种活动相对容易调查。与受害者建立关系的过程被称为`grooming`（诱导/养成），它通常包括向受害者送礼物。常见的礼物是手机，让恋童癖者和受害者可以通过受害者父母不知道存在的渠道进行通信。虽然存在各种差异，但共同的过程如下：\n\
  \n1.  捕食者与未成年人发起的初始对话可能关于一个未成年人感兴趣的无害话题。在这一初始阶段，捕食者通常在寻找关键迹象，判断这个孩子是否可能是目标。例如，感到不被融入、没有得到父母足够的关注、或正在经历父母离婚等重大生活问题的儿童很可能是目标。\n\
  \n\n\n\n\n2. 一旦捕食者确定了潜在目标，他就会开始尝试将聊天室或社交页面之外的对话延伸到私聊或电子邮件。他也可能对孩子遇到的任何问题表现得非常同情。捕食者经常会对目标受害者使用奉承。感到没有归属感或自尊心低的儿童非常容易受到这类策略的影响。\n\
  \n3. 下一步是开始在对话中引入性内容。捕食者的意图是让孩子逐渐习惯讨论性话题。通常情况下，他会非常细致地处理这一阶段，以免引起目标孩子的恐慌。如果这个过程进展得足够顺利，捕食者就会提议面谈。在某些情况下，面谈明确是为了性行为；而在另一些情况下，捕食者以某些看似无害的活动（如视频游戏或电影）为诱孩子去某个地点。\n\
  \n当然，有时也会偏离这种模式。有些捕食者会更快地与孩子面谈。捕食者也可能完全避免性性对话，仅仅试图诱骗孩子离开家，意图对其进行强迫猥亵。捕食者是选择诱骗孩子然后强奸性行为，还是尝试诱惑孩子，取决于捕食者对这一行为的看法。令一些读者感到惊讶的是，某些恋童者实际上并不将自己视为儿童猥亵者，而是认为自己与孩子处于关系中。他们实际上认为自己的行为是可以接受的，只是社会不理解。这类恋童者更有可能使用逐渐增加网络对话性内容和显露程度的方法。他们的意图是诱惑孩子。\n\
  \n许多广为人知的钓鱼执法行动旨在捕获网络捕食者。在这些行动中，成年人（有时是执法人员，有时不是）在网络上装成成年人，等待恋童者接近他们并尝试进行显露的性对话。这些尝试引起了相当争议。然而，考虑到这些活动的性质，非恋童的成年人不太可能意外或错误地与未成年人发生显露的性讨论。非恋童的成年人试图在现实世界中与她认为是未成年人的人会面，这种可能性更更小。显然，这些计划如果执行得当，对于打击网络捕食行为具有不可比拟的价值。\n\
  \n需要注意的是，美国政府和许多州拥有网络性犯罪犯数据库，可以用来查询任何可能在性犯罪犯名单上的人。许多数据库提供了照片和出生日期，以帮助防止因姓名相似导致的误认。以下是几个此类目录：\n\
  \n- **美国司法部：** [`www.nsopw.gov/`](https://www.nsopw.gov/)\n- **阿拉拉巴马州：** [`app.alea.gov/Community/wfSexOffenderSearch.aspx`](https://app.alea.gov/Community/wfSexOffenderSearch.aspx)\n\
  - **纽约州：** [`www.criminaljustice.ny.gov/SomsSUBDirectory/search_index.jsp`](http://www.criminaljustice.ny.gov/SomsSUBDirectory/search_index.jsp)\n\
  - **加利福尼亚州：** [`oag.ca.gov/sex-offender-reg`](https://oag.ca.gov/sex-offender-reg)\n\
  - **堪萨斯州：** [`www.kbi.ks.gov/registeredoffender/`](https://www.kbi.ks.gov/registeredoffender/)\n\
  - **俄克拉荷马州：** [`sors.doc.ok.gov/ords/svorp/sors/r/sors/public-search`](https://sors.doc.ok.gov/ords/svorp/sors/r/sors/public-search)\n\
  - **德克萨斯州：** [`records.txdps.state.tx.us/SexOffenderRegistry`](https://records.txdps.state.tx.us/SexOffenderRegistry)\n\
  - **怀俄明州：** [`wyomingdci.wyo.gov/criminal-justice-information-services-cjis/sex-offender-registry`](https://wyomingdci.wyo.gov/criminal-justice-information-services-cjis/sex-offender-registry)\n\
  \n遗憾的是，儿童捕食者是一个处处的问题——在每个州、城市和国家都是如此。许多国家已经建立了专门工作组来应对这些犯罪。在美国，每个州都有一个针对儿童的网络犯罪（ICAC）特别工作组（见\
  \ [`www.icactaskforce.org`](https://www.icactaskforce.org)）。在 ICAC 计划中，州、地方和联邦当局共同努力打击儿童犯罪。其他国家也有类似的特别工作组。\n\
  \n## 关于网络诈骗的法律\n\n在过去的几年里，各国立法机构（在美国和其他国家）已经通过了定义`Internet fraud`（网络诈骗）并规定处罚的法律。在许多情况下，现行的反欺诈和反骚扰法律也适用于互联网；然而，一些立法者认为网络犯罪需要其专门的立法。\n\
  \n身份盗窃一直是各种州法律和联邦法律的主题。大多数州现在都有了反身份盗窃的法律。这种犯罪也受联邦法保护。1998 年，联邦政府通过了`18 U.S.C. 1028`，也称为《1998\
  \ 年身份盗窃与假冒威慑法》。该法律使身份盗窃成为联邦犯罪。在全美国范围内，联邦法现在涵盖了身份盗窃。在许多州，身份盗窃也受州法律保护。\n\n一个决定严厉打击网络罪犯的国家是罗马尼亚。一些专家称罗马尼亚的网络犯罪法是世界上最严厉的。然而，罗马尼亚法律特别引人注目的是它的具体性。这项法律的制定者付出了努力来定义所有术语。这种具体性对于防止被告寻找漏洞非常重要。遗憾的是，罗马尼亚政府在世界媒体将该国称为“网络犯罪中心”之后才采取此类措施。该国对网络犯罪的反应性可能并不是最佳解决方案。\n\
  \n代顿大学法学院有一个专门针对网络犯罪网站。该学校提供了网络犯罪、网络骚扰和其他基于互联网犯罪的丰富链接。随着我们进入 21 世纪，预计将看到更多法学院开设关于网络犯罪的课程。\n\
  \n过去几年出现了一个有趣的现象：律师开始专门从事网络犯罪案件。有律师专门从事这一领域的事实有力地表明网络犯罪是一个日益严重的问题。\n\n## 如何保护自己免受网络犯罪\n\
  \n现在你已经了解网络上常见的各种诈骗类型并查看了相关法律，你可能在想该如何保护自己。你可以采取一些具体的措施来减少成为网络犯罪受者的概率。如果你成为受害者，也有清晰的操作指南。\n\
  \n### 防范投资诈骗\n\n为了防范投资诈骗，请遵循以下指南：\n\n- 仅与知名且口碑良好的经纪人进行交易。\n- 如果某件事听起来不可能是真的，那么请避开。\n\
  - 问问自己，为什么这些人会告诉你这个极好的投资机会。为什么一个完全陌生的人会决定与你分享一个巨大的投资机会？\n- 记住，即使是合法的投资也涉及风险；永远不要投入赔不起的钱。\n\
  \n### 防范身份盗窃\n\n当涉及身份盗窃时，预防措施非常明确：\n\n- 除非绝对必要，否则不要向任何人提供个人信息。在互联网上与你不认识的人交流时，不要透露关于你的任何信息——无论是年龄、职业、真实姓名还是其他内容。\n\
  \n\n\n\n\n-   销毁含有个人信息的文档。如果你只是简单地扔掉银行账单和信用卡账单，翻找你垃圾桶的人就能获取大量的个人数据。你可以从办公用品店或许多零售百货商店购买一个不到\
  \ 20 美元的碎纸机。在处理这些文档之前，先将它们切碎。这条规则看起来可能与计算机安全无关，但通过非技术手段收集的信息可以结合互联网来实施身份盗窃。\n\n\
  -   频繁检查你的信用状况。许多网站允许你以极廉的费用检查信用，甚至获取你的信用评分。（我每年会检查两次信用。）如果你发现任何未经过你授权的项目，你可能就是身份盗窃的受害者。\n\
  \n-   如果你所在的州有在线驾驶记录，请每年检查一次。如果你看到自己并未违犯的交通违规记录，这些证据是你的身份正被他人使用的明确信号。在第 13 章的“网络侦探”中，我们将详细探讨如何在在线上获取此类记录，费用通常低于\
  \ 5 美元。\n\n总而言之，防止身份盗窃的第一步是限制你提供的个人信息量。下一步只需监控你的信用记录和驾驶记录，这样当有人尝试使用你的身份时，你就会察觉。\n\
  \n保护身份的另一部分是泛指保护隐私。这意味着防止他人获取你没有明确提供给他们的信息。这种预防方法包括防止网站在不知情的情况下收集有关你的信息。许多网站会将有关你以及你访问其网站的信息存储在名为\
  \ `cookies` 的文件中。这些 cookie 文件存储在你的机器上。cookie 的问题在于，任何网站都可以读取你机器上的任何 cookie——即使这些\
  \ cookie 不是你当前访问的网站创建的。所以，如果你访问一个网站，它存储了你的姓名、访问的站点和停留时间等信息，那么另一个网站就有可能读取该 cookie\
  \ 并知道你在互联网上的去向。停止不需要 cookie 的最佳方法之一是安装反间谍软件。我们将在后面的章节中详细讨论此类软件。现在，让我们看看如何更改 Internet\
  \ 设置以帮助减少对隐私的威胁。\n\n### 安全浏览器设置\n\n如果你正在使用 Microsoft Edge，可以进入“工具”并使用下拉菜单选择“选项”。之后，你将看到一个与图\
