  \n## 练习 7.5：学习硬件键盘记录器\n\n在本章中，以及第 5 章中，我们讨论了基于软件的键盘记录器。然而，也有基于硬件的键盘记录器。\n\n1. 使用互联网学习更多关于硬件键盘记录器的知识。（你可能从搜索“Keykatcher”开始。）\n\
  \n2. 写一篇文章，概述这些键盘记录器的工作原理，以及它们如何为了安全或工业间谍而实施。\n\n### 项目\n\n### 项目 7.1：防止企业间谍活动\n\
  \n使用书中列出的网站之一（你也可以从第 1 章中的优先资源中选择）或其他资源，寻找一组计算机安全指南。写短短文，将这些指南与本章给出的指南进行对比分析。请记住，本章中的指南特指企业间谍活动，而不是通用计算机安全。\n\
  \n### 项目 7.2：员工管理\n\n写短短文描述关于处理员工的步骤。包括你认为组织应该采取的所有步骤来防止企业间谍活动。用来源和理由支持你的观点是重要的。\n\
  \n如果可能，访问一家公司并与 IT 部门或人事部门的人员交流，了解该公司如何处理员工离职、岗位轮换、数据访问控制等问题。将你在文章中编写的措施与你访问的公司所使用的措施进行对比。\n\
  \n### 项目 7.3：你组织中的资产识别\n\n使用表 7.1 或你自己设计的类似资产识别表，识别你组织（学校或企业）中最有价值的数据，以及哪些方最希望访问这些数据。然后写一份关于你可能如何保护这些数据的简短指南。在这个项目中，你应该根据你试图保护的特定类型数据以及最可能的工业间谍活动实施者，调整你的安全建议。\n\
  \n## 案例研究\n\nDavid Doe 是 ABC 公司的网络管理员。David 三次错失了升职机会。他对这种局面公开表示不满。事实上，他开始对整个组织发表负面意见。最终，David\
  \ 辞职并开始了自己的咨询业务。在 David 离开六个月后，发现 ABC 公司的大量研究突然被竞争对手复制。ABC 的高层怀疑 David Doe 为该竞争对手提供过咨询工作，并可能传递了敏感数据。然而，在\
  \ David 离开之后，他的计算机已经被格式化并分配给了他人。ABC 没有证据证明 David Doe 做了任何错事。考虑以下问题：\n\n1. 可能采取了哪些步骤来检测\
  \ David 涉嫌的工业间谍？\n\n2. 可能采取了哪些步骤来防止他实施此类犯罪？\n\n# 第 8 章\n\n### 加密\n\n### 章节目标\n\n\
  在阅读本章并完成练习后，你将能够做到以下：：\n\n* 解释加密的基础知识\n* 讨论现代密码学方法\n* 为你的组织选择合适的加密方案\n\n### 引言\n\
  \n计算机和信息安全有许多方面。加密是指通过扰乱消息或其他信息，使截获消息的人无法轻易读取的过程，它是安全拼图中最关键的部分之一。如果你拥有最好的防火墙、非常严格的安全策略、加固的操作系统、病毒扫描器、入侵检测软件、反间谍软件以及涵盖了所有其他计算机安全角度，但以原始明文形式发送数据，那么你根本就不安全的。\n\
  \n如果说网络安全专业人士一直理解不足的领域，那就是密码学。大多数网络安全专业人士只知道 CompTIA Security+ 和 CISSP 等特定认证考试上的内容。然而，这些知识可能不足以让你做出重要的安全决策。不，你不需要回到大学获得数学学位并专攻密码学，但你必须拥有足够的信息来提出好问题。\n\
  \n在本章中，你将获得对密码学的所谓的“管理级理解”——编写或破译秘密代码的艺术。需要理解的是本章不会让你成为一名密码学家。事实上，阅读几卷关于加密的书并无法实现那个崇高的目标。相反，本章的设计是让你对加密有一个基本的概述，了解其工作原理，并提供足够的信息让你对在组织中纳入何种类型的加密做出明智决策。你将学习加密的基本历史和基本概念，在完成章末的练习后，你将拥有足够的知识至少提出正确的问题。现在，这并不意味着我们不会涵盖一些技术细节。我们会涵盖的。但本章的目标是让你对相关概念有一个广泛的理解。\n\
  \n理解密码学中的某些概念也很重要。虽然这些理念对大多数读者来说是容易理解的，但你可能会在某些概念上遇到困难。这是正常的，不应担心。你可能需要阅读本章的几次才能完全理解某些概念。\n\
  \n我们将进入某些加密算法的实际过程。例如，我们将展示 `DES` 和 `RSA` 的过程。深入研究每种加密算法超出了本书的范围，但详细描述其中几个对你是有用的。\n\
  \n对于安全从业人员或希望成为安全从业人员的人来说，深入了解加密算法并不是关键的。在本章中，我们涵盖的一些概念，特别是关于非对称加密的概念，可能很难掌握。如果你在第一次阅读材料时没有百分之百地理解这些概念，特别是与数学相关的概念，是可以接受的。本章中的某些主题可能比书中的其他内容需要更多的学习和努力。在第\
  \ 9 章“计算机安全技术”中，你将看到密码学的一些应用，如 `SSL/TLS`、数字证书和虚拟专用网络。\n\n\n\n\n密码学的目的并不是隐藏消息的存在，而是隐藏它的含义——这个过程被称为\
  \ `encryption`（加密）。为了使消息变得无法理解，会根据特定的算法对其进行混乱，该算法是发送方和预期接收方预先约定的。因此，接收方可以反转混乱协议并使消息变得易懂。这种混乱的反转被称为\
  \ `decryption`（解密）。使用加密/解密的优势在于，对于那些不知道混乱协议的人来说，消息很难被重现。\n\n目前使用的密码学有两种基本类型：对称和非对称。`Symmetric`（对称）意味着使用同一个密钥来加密和解密消息。使用\
  \ `asymmetric`（非对称）加密，加密和解密使用的是不同的密钥。这听起来可能有点奇怪，你可能会好奇这是如何可能的。在本章稍后的部分，我们将详细探讨它的工作原理。现在，重点是理解对称加密和非对称加密的基本概念。\n\
  \n## 加密历史\n\n加密的想法可能和书面通信一样古老。基本概念其实相当简单：消息必须经过处理，使得敌人无法轻易读取，但又能让预期接收方能够轻松解码。在本节中，我们将研究一些历史上的加密方法。需要注意的是，这些是非常古老的方法，现在已无法用于安全通信。本节讨论的方法即使是业余人士也能轻松破解。然而，研究这些方法对于传达密码学概念非常有意义，而且不需要引入更复杂的加密方法所需要的大量数学知识。\n\
  \n### 见者忧知（供参考）：密码学家\n\n加密是一个非常广泛且复杂的领域。即使是业余密码学家通常也有一些数学训练，并学习了多年的密码学方法。如果你对学习比这里更多的密码学历史感兴趣，你可能想读读关于该主题的许多书籍。`表\
  \ 8.1](#ch08tab01)` 中提供了一个简要的密码学历史。\n\n**表 8.1 密码学历史**\n\n![Images](img/08tab01.jpg)\n\
  \n-   [斯坦福大学密码学历史](http://cs.stanford.edu/people/eroberts/courses/soco/public-key/history.html)\n\
  -   [Cryptography.org](http://cryptography.org)\n-   [SANS 密码学历史](https://www.sans.org/reading-room/whitepapers/paper/730)\n\
  \n理解这里描述的以及上述网站列出的方法，应该让你对加密如何工作以及加密所涉及的内容有一个概念。无论你是否继续学习现代加密方法，在概念层掌握加密的工作原理都是非常重要的。可汗学院有一门适合初学者的在线密码学课程。\n\
  \n### 凯撒密码\n\n最古老的加密方法之一是 `Caesar cipher`（据传这种方法被古代凯撒使用——因此命名）。这种方法实际上非常简单。你选择一个数字来移动文本中的每个字母。例如，如果文本是：\n\
  \nA cat\n\n你选择移动两个字母，消息变为：\n\nC ecv\n\n或者，如果你选择移动三个字母，它变为：\n\nD fdw\n\n据法尤利叶·凯撒使用向右移动三位。然而，你可以选择任何喜欢的数字向右或向左移动。因为这种方法非常容易理解，它是我们研究加密的好起点。然而，它极其容易破解（你看，任何语言都有特定的字母频率，意味着某些字母的使用比其他字母频繁）。在英语中，最常见的单字母单词是\
  \ `A`。最常见的三字母单词是 `the`。仅这两个规则就能帮助你解密凯撒密码。例如，如果你看到一串无意义的字母，并注意到一个三字母单词反复出现，你可能很容易推断出词是\
  \ `the`——而且这种做法的可能性很大。此外，如果你在文中经常注意到一个单字母单词，它最可能是字母 `A`。你现在发现了 `A`、`T` 和 `E` 的替换方案。你现在可以翻译消息中的所有字母并尝试推断其余部分。解密这类消息甚至不需要计算机，没有密码学背景的人用纸笔在\
  \ 10 分钟内即可完成。还有其他规则会让破解这种代码变得更容易。例如，在英语中，最常见的双字母组合是 `ee` 和 `oo`。这为你提供了更多工作内容。\n\n\
  这种算法可以被轻易破解的另一个原因是 `key space`（密钥空间）——即可以使用可能的密钥数量。在这种情况下，当应用于英语字母表时，只有 26 个可能的密钥，因为英语字母表中只有\
  \ 26 个字母。这意味着你只需尝试每个可能的密钥（`+1`、`+2`、`+3`……`+26`），直到有一个有效为止。尝试所有可能的密钥被称为 `brute-force\
  \ attack`（暴力破解）。\n\n你选择的替换方案（例如 `+2`、`+1`）被称为 `substitution alphabet`（替换字母，例如 `B`\
  \ 替换 `A`，`U` 替换 `T`）。因此，凯撒密码被称为 `mono-alphabet substitution`（单字母替换）方法，意味着它对加密使用单一替换。还有其他的单字母算法，但凯撒密码是最为人知的。\n\
  \n### Atbash\n\n古代，希伯来抄员使用 Atbash 替换密码来加密《耶利米书》等宗教著作。应用这种加密简单：只需反转字母表的字母顺序。按照现代标准，这是一种非常原始且易破解的密码。\n\
  \nAtbash 密码是一种希伯来代码，它用字母表的最后一个字母替换第一个，用倒数第二个替换第二个，以此此类推。它简单地反转了字母表。例如，在英语中，`A` 变成\
  \ `Z`，`B` 变成 `Y`，`C` 变成 `X`，以此此类推。当然，希伯人使用的是不同的字母表，`aleph` 是第一个字母，`tav` 是最后一个字母。然而，我将使用英语示例来演示：\n\
  \nAttack at dawn\n\n变为：\n\nZggzxp zm wzdm\n\n如所示，`A` 是字母表的第一个字母，与字母表的最后一个字母 `Z`\
  \ 交换。然后 `T` 是第 19 个字母（倒数第 7 个），与开始的第 7 个字母 `G` 交换。这个过程一直持续直到整个消息被加密。\n\n\n\n\n要解密信息，你只需反转过程即可，`Z`\
  \ 变成 `A`，`B` 变成 `Y`，以此此类推。这显然是一种非常简单的密码，现代不再使用。然而，它说明了密码学的基本概念：对明文进行某些置换，使得没有密钥来解密密文的人难以阅读。埃特巴什密码（Atbash\
  \ cipher）与凯撒尔密码一样，是一种单表替换密码，因此明文中的每个字母与密文中的每个字母之间存在直接的一一对应关系。这意味着，用于破解凯撒尔密码的相同字母和词频率问题也可以用于破解埃特巴什密码。\n\
  \n### 多字母替换\n\n最终，人们开发了凯撒尔密码的一种轻微改进版本，称为`多字母替换`。在在这种方案中，你选择多个数字来位移字母（即多个个替换字母表）。例如，如果你选择了三个替换字母表（12,\
  \ 22, 13），那么：\n\nA CAT\n\n变为：\n\nC ADV\n\n注意第四个字母又从另一个 +2 开始计算，你可以看到第一个 `A` 被转换成了\
  \ `C`，而第二个 `A` 被转换成了 `D`。这增加了破译底层文本的难度。虽然这比凯撒尔密码更难解密，但并不困难。使用简单的纸笔和加一点精力就能完成。计算机可以很快破解它。事实上，现在没有人会使用这种方法发送任何真正安全的信息，因为这种类型的加密被认为是非常脆弱的。\n\
  \n曾几何时，多字母替换被认为是相当安全的。事实上，这种方法的一种特殊版本——`维吉纳密码 (Vigenère cipher)`，在 19 世纪和 20 世纪初被使用。维吉纳密码由乔万·巴蒂斯塔·贝拉索（Giovan\
  \ Battista Bellaso）于 1553 年发明。这是一种基于密钥字母的一系列不同凯撒尔密码来加密字母文本的方法。图 8.1 显示了维吉纳密码。\n\n\
  ![描述: 显示了维吉纳密码对照表。](img/08fig01.jpg)\n\n**图 8.1** *维吉纳密码。*\n\n将你密钥顶部的字母与明文左侧的字母匹配以找到密文。例如，使用图\
  \ 8.1 所示图表，如果你正在加密单词 `cat` 且密钥是 `horse`，那么密文就是 `jok`。\n\n## 栅栏密码\n\n我们目前为止检查的所有密码都是替换密码。经典密码学的另一种方法是置位密码。`栅栏密码\
  \ (rail fence cipher)`可能是最为人知的置位密码。你只需将想要加密的消息并将每个字母写在不同的行上。因此，“attack at dawn”的写法如下：\n\
  \n```\nA t c a d w\n  t a k t a n\n```\n\n接下来，你像往常一样从左到右写下文本，从而产生：\n\n```\natcadwtaktan\n\
  ```\n\n为了解密信息，接收者必须将其写在行上：\n\n```\nA t c a d w\n  t a k t a n\n```\n\n然后接收者重构原始信息。大多数文本使用两行作为示例；然而，可以使用任何你想要的行数来完成。\n\
  \n## 波比斯密码\n\n`波比斯密码 (Polybius cipher)`（也称为波比斯方阵）由希腊历史学家波比斯（Polybius，公元前 200–118\
  \ 年）发明。显然，他的工作使用了希腊字母表，但我们在这里将其用于英语。如[图 8.2 中的网格所示，在波比斯密码中，每个字母由两个数字表示（Mollin, 2000）。这两个数字是该字母在网格上的\
  \ x 和 y 坐标。例如，`A` 是 1 1，`T` 是 4 4，`C` 是 1 3，`K` 是 2 5。因此，要加密单词 `attack`，你需要使用 `114444111325`。你可以在图\
  \ 8.2 中看到。\n\n![图像](img/08fig02.jpg)\n\n**图 8.2** *波比斯方阵*\n\n尽管使用两个数字来表示单个字母，但这仍然是一种替换密码，并且保持了明文底层语言中的字母和词频率。如果你使用广为人知的标准波比斯方阵，即使不进行任何频率分析，它也很容易破解。如果你想对方阵中的字母使用不同的编码，那需要发送方和接收方事先共享特定的波比斯方阵，以便他们可以发送和读取信息。\n\
  \n有趣的是，历史学家波比斯实际上建立这种密码是为了通过火炬发送代码的手段。站在山顶的信使可以举起火炬来代表字母，从而发送信息。在山顶建立一系列这样的信使，每人将信息传递给下一个人，允许远距离通信，速度比任何步行或骑马的信使都要快得多。\n\
  \n## 恩尼玛\n\n在讨论密码学时不谈及恩尼玛（Enigma）简直是不可能的。与流行的误解不同，恩尼玛不是一台机器，而是一族机器。实际上，恩尼玛有多种变体。海军恩尼玛是由在现在著名的布莱切利公园（Bletley\
  \ Park）工作的英国密码学家破解的。阿兰·图灵（Alan Turing）和他的团队最终破解了海军恩尼玛机器。许多历史学家声称这使第二次世界大战缩短了两年。这个故事是\
  \ 2014 年电影《模仿游戏 (*The Imitation Game*)》的基础。恩尼玛的核心是转子，即排列成 26 个字母的圆盘。第一个版本是由德国人谢比乌斯（Scherbius）在第一次大战期间发明的。一些军事文本是由波兰密码分析师马里安·列热夫斯基（Marian\
  \ Rejewski）、杰罗齐斯基（Jerzy Rozycki）和亨利·齐格尔斯基（Henryk Zygalski）破解的。每个转子代表一种替换密码。图 8.3\
  \ 是恩尼玛机器的照片。\n\n![描述: 恩尼玛机器的照片。](img/08fig03.jpg)\n\n**图 8.3** *一台恩尼玛机器。*\n\n##\
  \ 二进制运算\n\n大多数对称密码都使用一种称为异或（XOR）的二进制运算。在检查对称密码之前，我们将回顾基础数学。二进制数字（仅由 0 和 1 组成的数字）的各种操作对程序员和编程学生来说是非常熟悉的。但对于那些不熟悉的人，这里有简短的解释。在处理二进制数字时，有三种普通数学中没有的操作：AND、OR\
  \ 和 XOR 运算。接下来将分别进行说明。\n\n### AND\n\n执行 AND 运算时，你一次比较两个二进制数字。如果两个数字在两个位置上都是 1，那么结果数字为\
  \ 1。否则，结果数字为 0，所示：\n\n![图像](img/274eq01.jpg)\n\n### OR\n\nOR 运算检查在给定位置上的一个数字（或两个数字）中是否有\
  \ 1。如果是，那么结果数字为 1。如果不是，结果数字为 0，所示：\n\n![图像](img/274eq02.jpg)\n\n### XOR\n\n\n\n\n\
  异或（XOR）操作对你学习加密的影响最大。它检查在数字的给定位置上是否存在 1，但两个数字在同一位置*不是*同时为 1。如果其中一个数字是 1 而另一个不是，则结果数字为\
  \ 1。否则，结果数字为 0，如下所示：\n\n![Images](img/274equ03.jpg)\n\n异或运算有一个非常有趣的特性，就是它是可逆的。如果你将结果与第二个数字进行异或，就能得到第一个数字。如果你将结果与第一个数字进行异或，就能得到第二个数字：\n\
  \n![Images](img/274equ04.jpg)\n\n使用异或操作的二进制加密为某些相当简单的加密开启了大门。将任何消息转换为二进制数，然后将其与某个密钥进行异或，该密钥是一串随机的数字（1\
  \ 和 0），应该是随机的（或至少尽可能随机）。将消息转换为二进制数实际上是一个非常简单的两步过程：首先，将消息转换为其 ASCII 码，然后将这些代码转换为二进制数。每个字母/数字都会生成一个\
  \ 8 位的二进制数。然后，你可以使用任何给定长度的随机二进制数字符串作为密钥。只需将你的消息与密钥异或即可获得密文，然后再次与密钥异或即可恢复原始消息。这种方法易于使用，非常适合计算机科学专业的学生；然而，它对于真正的安全通信并不有效，因为底层的字母和单词频率问题仍然存在。这些问题提供了宝贵的线索，即使是业余密码学家也可以它们来解密消息。不过，这种方法确实为*单密钥加密*概念提供了很好的介绍，我们将在下一节中进行详细讨论。虽然简单的文本异或并不是通常采用的方法，但单密钥加密方法今天被广泛使用——而二进制操作通常是该过程的一部分。\n\
  \n对称密钥加密通常使用两个过程：替换和置换。*替换*部分通过将明文消息与密钥进行异或来实现。*置换*则通过交换文本块来完成。\n\n## 现代加密方法\n\n\
  现代加密方法以及计算机使密码学成为了一门相当先进的科学。你到目前为止看到的关于加密的内容仅仅是为了教学目的。正如多次提到的，如果你实现之前提到的任何加密方案，你都无法拥有真正安全的系统。你可能觉得本文对此的夸大了。然而，准确了解加密方法哪些有效、哪些无效至关重要。现在是时候讨论一些今天实际在使用的方法了。\n\
  \n在我们深入探讨这个主题之前，让我们从你需要的一些基本定义开始：\n\n- **密钥 (Key):** 与明文组合进行加密的位。在某些情况下，这是随机数；在其他情况下，它是某些数学运算的结果。\n\
  - **明文 (Plain text):** 未加密的文本。\n- 密文 (Cipher text):** 加密的文本。\n- **算法 (Algorithm):**\
  \ 执行某事的数学过程。\n\n### 单密钥（对称）加密\n\n基本上，*单密钥加密*意味着使用同一个密钥同时加密和解密消息。这也被*对称密钥加密*。对称算法（或密码）有两种：流加密和块加密。块加密将数据分成块（通常是\
  \ 64 位块，但新的算法有时使用 128 位块），并一次一个块地加密数据。流加密则以位流的形式加密数据，一次加密一个位。\n\n#### 数据加密标准\n\n\
  *数据加密标准*，或*DES*，由 IBM 在 20 世纪 70 年代初开发并于 1976 年发布。是的，它很老了，不再被认为是安全的；然而，它仍然两个研究价值。第一个原因是\
  \ DES 是第一个现代对称密码。第二个原因是其通用结构（通常称为*Feistel 函数*或*Feistel 密码*）在许多现代算法中仍在使用。DES 是一种块加密，它将明文分为\
  \ 64 位的块并加密每个块。基本概念如下：\n\n**供参考（FYI）：块加密与流加密**\n\n在将密钥应用于明文以加密并产生密文时，你还必须选择如何应用密钥和算法。在块加密中，密钥一次应用于一个块（通常大小为\
  \ 64 位）。这与一次加密 1 位的流加密不同。\n\n1. 数据被分成 64 位的块。\n2. 这些块中的每一个都被分成两个 32 位的半部分。\n3. 一半部分通过轮函数通过替换和异或操作进行处理。\n\
  4. 交换两个 32 位的半部分。\n5. 重复 16 次（16 轮）。\n\n在 DES 发布时，它是一项奇发明。即使在今天，该算法仍然是稳健的。然而，56\
  \ 位的短密钥长度不足以防御现代计算机的暴力破解攻击。许多密码学教材和大学课程使用 DES 作为研究所有块加密的基本模板。我们将这样做，并对该算法给予本章中大多数其他算法更多的关注。\n\
  \n对于安全和密码学的初学者来说，之前列出的简要事实已经足够了。但对于那些想要进一步深入一点的人，让我们检查 DES 算法的细节。DES 使用 56 位的密钥应用于\
  \ 64 位的块。实际上有一个 64 位的密钥，但每个字节的 1 位用于纠错，留下了 56 位用于实际操作。\n\nDES 是一种具有 16 轮且每轮使用 48\
  \ 位轮密钥的 Feistel 密码。它们被称为 Feistel 密码（也称为 Feistel 函数），纪念该概念的发明者以及 DES 的主要发明。所有 Feistel\
  \ 密码的工作方式都相同：它们将块分为两部分，对其中一部分应用轮函数，然后交换这两部分。这种操作每轮都会进行。\n\n第一个要解决的问题是密钥调度。*密钥调度*（所有块加密都会使用）是一种简单的算法，它获取双方派生的初始密钥，并据此每轮生成一个略有不同的密钥。DES\
  \ 通过获取原始 56 位密钥并在每轮对其进行轻微置换来实现这一点，使得每轮应用的密钥略有不同，但它是基于原始密码密钥的。为了生成轮密钥，将 56 位的密钥分成两个\
  \ 28 位的半部分，并在每轮后对这些半部分进行循环移动 1 位或 2 位，以为每轮提供不同的子密钥。在算法的轮密钥生成部分（记住这被称为*密钥调度*）中，每轮原始密码密钥的两个部分（加密端必须交换的\
  \ 56 位密钥）都会移动特定的长度。最终结果是，对于 DES 的 16 轮中的每一轮，密钥实际上与上一轮使用的密钥略有不同。\n\n\n\n\n\n一旦生成了当前轮的轮密钥，下一步就是处理将输入轮函数的原始块的半部分。回想一下，这两个部分各占\
  \ 32 位。轮密钥是 48 位。这意味着轮密钥的大小与它将应用的半块大小不匹配。你不能真正将一个 48 位的轮密钥与 32 位的半块进行异或（XOR），除非你直接忽略轮密钥的\
  \ 16 位。如果你这样做，你基本上是缩短了轮密钥，从而降低了安全性，因此这不是一个好的选择。在与轮密钥进行异或之前，需要将这 32 位的半部分扩展到 48 位。这是通过复制某些位来实现，使得\
  \ 32 位的半部分变成 48 位。\n\n这个扩展过程实际上非常简单。待扩展的 32 位被分成 4 位一组的小节。每组末端的位被复制。如果用 32 除以 4，答案是\
  \ 8。因此，有 8 组这样的 4 位分组。如果你复制每个分组的末端位，就会在原始的 32 位基础上增加 16 位，从而提供总共 48 位。\n\n同时重要的是，复制的是每个末端的位。这在稍后的轮函数中是一个关键点。也许这个例子可以帮助你理解在此阶段发生了什么。让我们假设是\
  \ 32 位，如下：\n\n```\n11110011010111111111000101011001\n```\n\n现在将它分成 8 组，每组 4 位，如下：\n\
  \n```\n1111 0011 0101 1111 1111 0001 0101 1001\n```\n\n现在每个小节的末端位都经过了复制，如你所见：\n\n\
  - 1111 变成 111111\n- 0011 变成 000111\n- 0101 变成 001011\n- 1111 变成 111111\n- 1111 变成\
  \ 111111\n- 0001 变成 000011\n- 0101 变成 001011\n- 1001 变成 110011\n\n生成的 48 位字符串现在与\
  \ 48 位的轮密钥进行异或。现在你已经完成了轮密钥的工作。它的唯一目的就是与 32 位的半部分进行异或。现在它被丢弃，在下一轮中，将使用我们之前描述的密钥调度，从\
  \ 56 位密码密钥的两个 28 位半部分导出另一个 48 位的轮密钥。\n\n现在我们得到了异或操作的 48 位输出。但这似乎仍然行不通。我们需要的不是 32\
  \ 位而不是 48 位吗？那 48 位现在被分成 8 组，每组 6 位。这些 6 位小节中的每一个都将输入到 `s-box`（替换盒），并且只输出 4 位。\n\
  \n6 位小节被用作 `s-box` 的输入，`s-box` 是一个根据输入并根据输入产生输出的表格。换句话说，它是一个用新值替换输入的替换盒。DES 有八个不同的\
  \ `s-boxes`，在下面你可以看到其中一个：\n\n![Images](img/279tab01.jpg)\n\n`s-box` 实际上只是一个硬编码的查找表。两端的各\
  \ 2 位显示在左侧列，中间的 4 位显示在顶行。它们进行匹配，得到的值就是 `s-box` 的输出。例如，使用我们之前演示的数字，我们的第一个数据块将是 111111。因此，你在左侧找到\
  \ `1xxxx1`，在顶端找到 `x1111x`。得到的值是十进制的 3，或者二进制的 `0011`。\n\n回想一下，在扩展阶段，我们简单地复制了最外层的位，因此当我们进入\
  \ `s-box` 阶段并丢弃最外层的位时，不会丢失数据。\n\n由于每个 `s-box` 输出 4 位且有 8 个 `s-box`，结果是 32 位。这 32\
  \ 位现在与原始块的另一半部分进行异异或。回想一下，我们最初对那部分什么都没做。现在两个半部分进行了交换。\n\n如果你是密码学的新手，尽管有了这些解释，这一切可能看起来仍然有些困惑。许多读者可能需要反复读读这一部分几次才能完全理解。\n\
  \n### 3DES\n\n*三重 DES* (*3DES*) 的创建是为了替代 DES。在那个时候，密码学界正在寻找一种可行的替代方案。在这些方案工作仍在进行时，3DES\
  \ 作为一种权宜措施被创建。它本质上是用三个不同的密钥应用了三次 DES，因此名为 3DES。\n\n3DES 还有仅使用两个密钥的变体。首先用密钥 A 对明文加密。该操作产生的密文然后用密钥\
  \ B 加密。然后对该操作产生的密文再次进行加密，这次重用密钥 A。这种重用的原因是计算量很大。\n\n### AES\n\n*高级加密标准* (*[AES](https://en.wikipedia.org/wiki/Advanced_encryption_standard)*)\
  \ 被选为替代 DES 的算法。AES 工作于 128 位块。它可以具有 128、192 或 256 位不同的密钥。美国政府在 2001 年将 AES 指定为\
  \ DES 的替代方案，经过了五年的竞争。其他未入选算法包括 Twofish。AES 的重要性不言而喻。它在全球范围内被广泛使用。在本书介绍的所有算法中，AES\
  \ 是你应该重点关注的。\n\n正如前面提到的，AES 可以具有 128、192 或 256 位的密钥。AES 由两个比利时密码学家 John Daemen 和\
  \ Vincent Rijmen 开发。John Daemen 是一个对块密码、流密码和密码哈希函数进行过深入分析的密码学家。对于安全初学者来说，目前的简要描述已经足够了。\n\
  \nRijndael 使用置换矩阵而不是 Feistel 网络。Rijndael 算法首先将 128 位块放入一个名为 `state` 的矩阵，它随着算法的进行而改变。第一步是将明文转换为二进制，然后将其放入矩阵，如图\
  \ 8.4 所示。\n\n![Description: Rijndael 矩阵显示了排列成 4x4 矩阵的字节。矩阵为 11011001, 01110010,\
  \ 10110000, 11101010; 01011111, 00011001, 11011001, 10011001; 10011100, 11011101,\
  \ 00011001, 11111101; 11011001, 10001001, 11011001, 10001001.](img/08fig04.jpg)\n\
  \n**图 8.4** *Rijndael 矩阵。*\n\n一旦将原始明文以二进制形式放入 4x4 字节矩阵，该算法由在若干轮中使用的几个相对简单的过程组成。这些过程如下：\n\
  \n- **AddRoundKey**: 在此过程中，状态的每个字节与轮密钥进行异或。就像 DES 一样，有一个密钥调度算法会稍微改变每轮的密钥。\n- **SubBytes**:\
  \ 这涉及对输入字节（AddRoundKey 阶段的输出）进行替换。这里是将矩阵的内容通过 s-boxes 处理。每个 s-box 是 8 位。\n\n\n\n\
  \n\n### `ShiftRows`: 这是一个置换步骤，状态的每一行都按循环移动一定数量的步骤。在此过程中，第一行保持不变。第二行的每个字节都向左移动 1\
  \ 个字节（最左侧的字节回回）。第三行的每个字节向左移动 2 个字节，第四行的每个字节向左移动 3 个字节（同样是最左侧的字节回回）。这如图图 8.5\n\n\
  **图 8.5** *ShiftRows。*\n\n### `MixColumns`: 这是一个对状态的列进行混合的操作，将每列的 4 个字节结合。在 `MixColumns`\
  \ 过程中，状态的每一列都与一个固定多项式相乘。状态中的每一列（记住我们正在使用的矩阵）被视为伽罗斯域 (2⁸) 中的一个多项式。结果与固定多项式 `c(*x*)\
  \ = 3*x*³ + *x*² + *x* +2` 对 `x*⁴ + 1` 取模。`MixColumns` 过程也可以看是在有限域 GF(2⁸) 中乘以所示的特定\
  \ MDS 矩阵。\n\n这些过程在 Rijndael 密码中被多次执行。对于 128 位密钥，有 10 轮。对于 192 位密钥，有 12 轮。对于 256\
  \ 位密钥，有 14 轮。\n\n如果你没有数论背景，这最后几步可能会让你感到有些困惑。你可能会问诸如“什么是伽罗斯域？”以及“什么是固定多项式？”的问题。下一节将提供理解这些内容所需的数学知识的概述。\n\
  \n#### AES 数学\n\n*群*（*group*）是一个由集合、单位元、一种运算及其逆运算构成的代数系统。基本上，群是将数学运算（如加法）限制在特定数字集合的方法。有几种特殊类型的群，在此进行简要描述：\n\
  \n- *阿贝尔群*（*abelian group*）或*交换群*（*commutative group*）如果运算是加法，则具有额外的公理 *a* + *b*\
  \ = *b* + *a*，如果运算是乘法，则 *ab* = *ba*。\n- *循环群*（*cyclic group*）的元素都是其其中一个元素的幂。\n-\
  \ *环*（*ring*）是一个由集合、单位元、两种运算以及第一个运算的逆运算构成的代数系统。\n- *域*（*field*）是一个由集合、每个运算的单位元、两种运算及其相应的逆运算构成的代数系统。\n\
  \n这引出了伽罗斯群或伽罗斯域。对于任何素数 *p*，GF(*p*) 这个伽罗斯域具有 *p* 个元素，这些元素是模 *p* 的整数剩余类。该素数 *p* 是该域的定义元素。现在这显然是一个简短的描述，并没有试图进入细节。要进入更多细节，需要深入研究群论。\n\
  \n### Blowfish\n\nBlowfish 是一种对称块密码。它使用从 32 位到 448 位不变长度的密钥。Blowfish 由 Bruce Schneier\
  \ 在 1993 年设计。它已被密码学界广泛分析，并获得了广泛接受。它还是一种非商业（免费）产品，因此对对预算敏感的组织非常有吸引力。\n\n这种加密算法旨在替代\
  \ DES。与 DES 一样，它是一个工作在 64 位块数据上的 16 轮 Feistel 密码；然而，与 DES 不同，它可以具有从 32 位到 448 位的变变密钥大小（Schneier,\
  \ 1993）。在密码的早期，密码密钥会被扩展。密钥扩展将一个最多 448 位的密钥转换为总计 4168 个字节的多个子密钥数组。\n\n### RC4\n\n\
  我们讨论的所有其他对称算法都是块密码。RC4 是由 Ron Rivest 开发的流密码。`RC` 是 Ron's Cipher 的缩写，有时也称为 Rivest's\
  \ Cipher。还有其他 RC 版本，例如 RC5 和 RC6。\n\n### Serpent\n\nSerpent 的块大小为 128 位，密钥大小可以是\
  \ 128 位、192 位或 256 位，与 AES 相似。该算法也是一种代置换网络（类似于 AES）。它使用 32 轮处理由四个 32 位字组成的块。每轮并行应用\
  \ 8 个 4 位到 4 位 S 盒中的一个，共 32 次。Serpent 的设计使得所有操作都可以并行执行。这是它未被选为 DES 替代品的原因之一。在它创建时，许多计算机在并行处理方面存在困难。然而，现代计算机处理并行计算没有问题，因此\
  \ Serpent 再次是一个具有吸引力的选择。\n\n### Skipjack\n\n最初被分类加密的 Skipjack 算法是由国家安全局（NSA）为加密芯片（clipper\
  \ chip）开发的。加密芯片是一种带有内置加密功能的芯片；然而，解密密钥将保存在密钥托管机构中，以防执法部门在不需要计算机主配合的情况下解密数据。这一特性使得该过程极具争议。Skipjack\
  \ 使用 80 位密钥来加密或解密 64 位数据块。它是一个具有 32 轮的不平衡 Feistel 网络。不平衡 Feistel 意味着明文的两个部分的大小不同。例如，一个\
  \ 64 位块可能被分为 48 位半和 16 位半。\n\n### 对称方法的改进\n\n与理解对称密码同样重要的是理解它们是如何实现的。有一些常见的模式，它们会影响对称密码的功能。\n\
  \n##### 电子密码本\n\n最基本的加密模式是电子密码本（ECB）模式。在 ECB 中，消息被分成若干块，每个块独立加密。问题是，如果你多次提交相同的明文，总是得到相同的密文。这为攻击者提供了分析密码并尝试推导出密钥的地方。换句话说，ECB\
  \ 只是按照描述使用密码，而不尝试改进其安全性。\n\n##### 密码块链**\n\n在使用密码块链（CBC）模式时，每个明文块在加密之前都会与前一个密文块进行异或运算。这意味着最终密文中有更多的随机性，使其比电子密码本模式安全得多。它是最常用的模式。\n\
  \n如果通信的两端都能支持 CBC，那么真的没有理由在那里使用 ECB。CBC 对于已知明文攻击是一种强力威慑，我们将在本章后面讨论这种分析方法。\n\nCBC\
  \ 唯一的问题是第一个块。没有先前的密文块可以与第一个明文块进行异或。通常会对第一个块添加一个初始化向量（IV），以便其有东西可以异或。初始化向量基本上是一个伪随机数，类似于密码密钥。通常\
  \ IV 只使用一次，因此被称为 *nonce*（“使用一次的数字”）。CBC 模式实际上非常老了。它由 IBM 在 1976 年引入。\n\n#### PCBC\n\
  \n传播型密码块链模式的设计目的是在解密时以及加密时，使密文中的微小变化能够无限传播。这种方法有时被称为明文密码块链。PCBC 模式是 CBC 模式的一种变体。需要记住，PCBC\
  \ 加密模式尚未正式作为联邦标准发布。\n\n#### CFB\n\n\n\n\n\n在密码反馈模式（Cipher Feedback mode）下，上一个密文块被加密，然后将产生的密文与明文进行异或（XOR），产生当前密文块。本质上，它是自我循环的，增加了结果密文的随机性。虽然\
  \ CFB 与密码分组链（Cipher Block Chaining）非常相似，但其目的略有不同。目标是将分组加密转换为流加密。输出反馈模式（Output Feedback\
  \ mode）是另一种将分组加密转换为同步流加密的方法。\n\n## Galois 计数器模式 (Galois/Counter Mode)\n\nGalois\
  \ 计数器模式（GCM）使用了带有 认证的计数器模式。计数器模式由 Whitfield Diffie 和 Martin Hellman 于 1979 年引入，用于将分组加密转换为流加密。计数器模式与用于认证的\
  \ Galois 乘法相结合。\n\n## 公钥（非对称）加密\n\n公钥加密本质上是单密钥加密的反面。对于任何公钥加密算法，一个密钥（称为公钥）用于加密消息，另一个密钥（称为私钥）用于解密消息。你可以自由地分发你的公钥，以便任何人都可以加密消息发送给你，但只有你拥有私钥，且只有你能解密消息。密钥创建和应用背后的实际数学在不同非对称算法之间会有不同。我们将在本节后面查看\
  \ RSA 的数学原理。然而需要指出，许多公钥算法在某种程度上依赖于大素数、因数分解和数论。\n\n在密码学中，使用虚构的 Alice 和 Bob 来说明非对称加密已成为标准。如果\
  \ Alice 想给 Bob 发送一条消息，她将使用 Bob 的公钥来加密该消息。地球上其他每一个人也拥有 Bob 的公钥并没有关系。该密钥无法解密消息。只有\
  \ Bob 的私钥可以做到。这在图 8.6 中所示。\n\n![描述：展示了使用公钥加密进行安全通信的插图。](img/08fig06.jpg)\n\n**图\
  \ 8.6** 公钥加密。\n\n公钥加密很重要，因为不需要处理密钥分发的问题。在对称密钥加密中，你必须向你想要发送加密消息的每一个人提供密钥副本。如果该密钥丢失或被复制，其他人可能能够解密你的所有消息。使用公钥加密，你可以自由地向全世界分发你的公钥，但只有你能够解密用该公钥加密的消息。\n\
  \n### RSA\n\n在讨论密码学时，至少要讨论一下 RSA 是可能的，这是一种被广泛使用的加密算法。这种公钥方法由三位数学家于 1977 年开发：Ron\
  \ Rivest、Adi Shamir 和 Len Adleman。RSA 的名字源于这三位数学家姓氏的首字母。让我们来看 RSA 涉及的数学原理。（应该指出，了解此（或任何其他算法）背后的数学原理对于大多数安全专业人员来说至关重要。但某些读者会对深入研究密码学感兴趣，这将是一个很好的开始点。）\n\
  \n为了理解 RSA，你需要了解几个基本的数学概念。这些材料中的部分（甚至全部）可能属于复习：\n\n-   **素数（Prime numbers）：** 素数只能被它本身和\
  \ 1 整除。因此，2, 3, 5, 7, 11, 13, 17 和 23 都是素数。（注意，1 本身被视为特殊情况，不是素数。）\n-   **互质（Co-prime）：**\
  \ 这实际上并不意味着素数；它的意思是两个数没有公因子。例如，8 的因子（不包括 1 这个特殊情况）是 2 和 4，而 9 的因子是 3。数字 8 和 9 没有公因子，所以它们是互质的。\n\
  -   **欧拉拉函数（Euler’s Totient）：** 读作“oilers” totient，或直接称为 totient，它是小于 `n` 且与 `n`\
  \ 互质的整数个数。让我们考虑数字 10。由于 2 是 10 的因子，所以它与 10 不互质。但 3 与 10 互质。数字 4 不是互质的，因为 4 和 10\
  \ 都有 2 作为因子。5 不是，因为它是 10 的因子。6 也不是，因为 6 和 10 都有 2 作为公因子。7 是素数，所以它与 10 互质。8 不是，因为\
  \ 8 和 10 都有 2 作为因子。9 与 10 互质。因此，数字 3、7 和 9 与 10 互质。我们将 1 作为一个特殊情况加入，10 的欧拉函数是 4。现在刚好\
  \ Leonhard Euler 也证明了，如果数字 `n` 是素数，那么它的欧拉函数就是 `n-1`。\n-   **模（Modulus）：** 这是你 RSA\
  \ 需要的最后一个概念。首先，从程序员的角度来看，模运算是对两个数除得到余数。程序员通常使用符号 `%` 来表示模运算。所以 `10 % 3` 是 1。或者如果是\
  \ 2 p.m. 现在（实际上 14）你在 36 小时后告诉我，我做的是 `(14 + 36) % 12`，即 `50 % 12`，a.m. 稍微了一点，但它说明了我们的观点。\n\
  \n现在理解了这些基本操作，就准备好学习 RSA 了。如果需要，在继续之前重读前面的章节（可能需要读多次）。\n\n要创建密钥，首先生成两个大小相当的随机素数，`p`\
  \ 和 `q`。你需要选择两个数字，使得它们的乘积达到你想要的尺寸（2048 位、4096 位等）。\n\n现在相乘 `p` 和 `q` 得到 `n`。令 `n\
  \ = pq`。\n\n下一步是计算这些素数的每一个欧拉函数。基本上，欧拉函数是互质数字的总数。两个数被认为是互质的如果它们没有公因子。例如，如果原始数字是 7，那么\
  \ 5 和 7 就是互质的。\n\n令 `m = (p - 1)(q - 1)`。\n\n现在我们将选择另一个数字。我们将这个数字称为 `e`。我们想要选择 `e`\
  \ 使它与 `m` 互质。选择一个较小的数字 `e`，与 `m` 互质。\n\n\n\n\n我们生成的密钥已经快完成了。现在我们只需要找到一个数字 `d`，使得它与\
  \ `e` 相乘并对 `m` 取模的结果为 1。（记住：`Modulo` 取模意味着除以两个数并返回余数。例如，8 模 `3` 的结果是 `2`。）\n\n找到\
  \ `d`，使得 `de` % `m` = 1。\n\n现在你把 `e` 和 `n` 作为公钥发布。保留 `d` 作为私钥。加密时，你只需将你的消息进行 `e`\
  \ 次方并对 `n` 取模即可：\n\n```\n= m^(e) % n\n```\n\n解密时，你取密文并对其进行 `d` 次方模 `n` 取模：\n\n```\n\
  P = C^(d) % n\n```\n\n字母 `e` 代表 `encrypt`（加密），`d` 代表 `decrypt`（解密）。如果你觉得这一切看起来有点复杂，你必须意识到，许多在网络安全领域工作的人其实并不熟悉\
  \ RSA 的实际算法（或任何其他密码学算法）。然而，如果你想深入研究密码学，这是一个非常好的开始。它涉及到一些基础数论，特别是关于质数的。还有其他工作方式不同的非对称算法。例如，椭曲线密码学就是其中之一。\n\
  \n让我们来看一个可能有助于你理解的例子。当然，RSA 会使用非常大的整数。为了方便理解数学过程，我们在示例中使用小的整数。\n\n选择两个不同的质数，例如 `p`\
  \ = 61 和 `q` = 53。计算 `n` = `pq`：\n\n```\nn = 61 × 53 = 3233\n```\n\n计算乘积的欧拉函数`φ(n)`\
  \ = (`p` − 1)(`q` — 1)：\n\n```\nφ (3233) = (61 − 1)(53 — 1) = 3120\n```\n\n选择任何\
  \ 1 < `e` < 3120 且与 3120 互质的数。选择质数作为 `e`，我们只需要检查 `e` 是否不是 3120 的因数。令 `e` = 17。计算\
  \ `d`，即模逆元，得到 `d` = 2753。\n\n公钥是 (`n` = 3233, `e` = 17)。对于一个填充的明文消息 `m`，加密函数为：\n\
  \n```\nm¹⁷ (mod 3233)\n```\n\n私钥是：\n\n```\n(n = 3233, d = 2753)\n```\n\n对于加密后的密文\
  \ `c`，解密函数为：\n\n```\nc²⁷⁵³ (mod 3233)\n```\n\n对于那些初接触 RSA 或初次接触密码学的读者来说，看另一个数字更小的例子可能会有帮助：\n\
  \n选择质数：`p` = 17 & `q` = 11。\n\n计算 `n` = `pq` = 17 × 11 = 187。\n\n计算 `φ(n)` = (`p`\
  \ — 1)((`q` — 1) = 16 × 10 = 160。\n\n选择 `e:` `gcd(e,160)` = 1；选择 `e` = 7。\n\n确定\
  \ `d`：`de` = 1 mod 160 且 `d` < 160。值为 `d` = 23，因为 23 × 7 = 160 + 1。\n\n发布公钥：(7 和\
  \ 187)。\n\n保留私钥：23。\n\n### Diffie-Hellman\n\nDiffie-Hellman 是第一个被公开描述的非对称算法。这种密码学协议允许双方在通道上建立共享密钥。换句话说，Diffie-Hellman\
  \ 通常用于允许双方通过某些不安全的媒介（如互联网）交换对称密钥。它由 Whitfield Diffie 和 Martin Hellman 于 1976 年开发。\n\
  \n等一下，让我们回到老朋友 Alice 和 Bob 来说明这一点。Alice 生成一个随机私值 `a`，Bob 生成一个随机私值 `b`。`a` 和 `b`\
  \ 均取自整数集合。他们使用参数 `p` 和 `g` 以及各自的私值推导出他们的公值。Alice 的公值是 `g^a` mod `p`，Bob 的公值是 `g^b`\
  \ mod `p`。\n\n他们交换公值。Alice 计算 `g^(ab)` = (`g^b)^a` mod `p`，Bob 计算 `g^(ba)` = (`g^a)^b`\
  \ mod `p`。因为 `g^(ab)` = `g^(ba)` = `k`，Alice 和 Bob 现在有了一个共享秘密 `k`。\n\n这个过程如图 8.7\
  \ 所示。\n\n![Description: Text Description automatically generated with confidence]\n\
  \n图 8-7 Diffie Hellman\n\nDiffie-Hellman 经过了多次修改和改进。最为人的是 Elgamal 和 MQV。Elgamal\
  \ 以其发明者 Taher Elgamal 命名。MQV 起于 1995 年提出，以其发明者 Alfred Menezes、Minghua Qu 和 Scott\
  \ Vanstone 命名。MQV 被纳入公钥标准 IEEE P363 和 NIST 的 SP800-56A 标准中。\n\n### 椭曲线密码学\n\n椭曲线算法由\
  \ Victor Miller 和 Neal Koblitz 于 1985 年首次描述。椭曲线密码学 (ECC) 基于这样一个事实：相对于公开已知的基点，寻找随机椭曲线元素的离散对数是非常困难的，以至于无法实现。该算法背后的数学原理对于一本安全入门书来说有点深奥。然而，如果你感兴趣，应该阅读这个非常棒教程：http://arstechnica.com/security/2013/10/a-relatively-easy-to-understand-primer-on-elliptic-curve-cryptography/。\n\
  \n有许多变体，例如 ECC-DH (ECC Diffie-Hellman) 和 ECC-DSA (ECC 数字签名算法)。ECC 密码系统的真正优势在于，你可以使用较小的密钥获得与\
  \ RSA 等系统同等的安全性。例如，一个 384 位的 ECC 密钥的强度就相当于 2048 位的 RSA。\n\n### PGP\n\nPGP 是一种公钥系统，全称为\
  \ `Pretty Good Privacy`（良好的隐私）。它是一个广泛使用的系统，被大多数专家认为非常安全。大多数桌面操作系统都有作为免费软件提供的多种实现版本。MSN\
  \ Messenger 以及许多流行的通信软件包都有 PGP 插件。在 Yahoo! 或 Google 上搜索 PGP 将帮助你找到许多此类软件产品。\n\n\n\
  \n\n### 正规与欺诈加密方法\n\n本章之前讨论的加密方法只是最广泛使用的现代加密方法中的几种。每年都有几十种其他方法向公众免费，或者作为专利出售以获利。然而，重要的是要意识到，计算机行业的这一特定领域充满了欺诈行为和骗子。你只需要在搜索引擎中搜索\
  \ `encryption`，就能找到大量关于最新、最强大的“不可破解”加密的广告。如果你对加密并不了解，如何将正规加密方法与欺诈区分开呢？\n\n市场上有很多欺诈性的加密声称。你不需要成为密码学专家就能避开许多欺诈性主张。以下是一些警告信号：\n\
  \n- **不可破解：** 任何具有密码学经验的人都知道，不存在所谓的不可破解的代码。只有有些代码尚未被破解，或者有些代码非常难破解。但当有人声称某种方法是“完全不可破解的”时，你应该保持怀疑。\n\
  - **经过认证的：** 猜猜怎么着？加密方法并没有公认的认证流程。因此，公司声称的任何“认证”都完全毫无价值。\n- **缺乏经验的人：** 一家公司正在推销一种新的加密方法。从事该工作的人有什么经验？密码学家是否有数学、加密或算法的背景？如果没有，他是否已将自己的方法提交给同行评审期刊的专家？或者，他至少愿意公开其方法的工作原理，以便进行公平评估？回想一下\
  \ `PGP` 的发明者拥有数十年的软件工程和加密经验。\n\nAuguste Kerckhoffs 在 19 世纪首次阐述了后来被称为柯尔克夫斯原则（Kerckhoffs’s\
  \ principle）。他指出，密码的安全性仅取决于密钥的机密性，而不取决于算法的机密性。Claude Shannon 重新表述道：“设计系统时应假设敌人最终将完全熟悉它们。”这一思想被称为\
  \ `香农准则`（Shannon’s maxim），其核心与`柯尔克夫斯原则`一致。\n\n我想为 `柯尔克夫斯原则/香农准则` 增加一个我谦虚称为 Easttom\
  \ 推论的内容：“你应该对任何未经发布和经过彻底审查的加密算法保持警惕。只有在经过广泛的同行评审后，你才考虑使用任何加密算法。”我首次在我的书中《现代密码学：加密与信息安全的应用数学》中提出了这一推论。\n\
  \n### 数字签名\n\n数字签名不是用于确保信息的机密性，而是为了保证是谁发送了消息。这被称为 `非否认性`（nonrepudiation）。从本质上，非否认性意味着证明发送者的身份。数字签名实际上相当简单，但非常巧妙。它们只是反转了非对称加密过程。回想在非对称加密中，公钥（任何人都可以）用于加密发送给接收者的消息，而私钥（保持安全和私密）可以解密。在数字签名中，发送者使用其私钥对某些内容进行加密。如果接收者使用发送者的公钥能够解密，那么它一定是由声称发送消息的人发送的。这一过程如图图\
  \ 8.8 所示。\n\n![描述：数字签名技术展示了三个步骤。第一步，bob 使用其私钥对消息进行签名。第二步，bob 发送带签名的消息。第三步，Alice\
  \ 使用 Bob 的公钥验证签名。](img/08fig08.jpg)\n\n**图 8.8** *数字签名。*\n\n### 哈希\n\n`hashing`（哈希）是一种具有某些特定特征的加密算法。首先最重要的是，它是单向的。这意味着你无法对某个东西进行反哈希。其次，无论输入什么，你得到的都是固定长度输出。第三，没有冲突。当两个不同的输入通过同一个哈希算法产生相同的输出（称为\
  \ `hash` 或 `摘要`）时，就会发生冲突。理想情况下，我们希望没有冲突。但现实是，由于输出长度固定，冲突是可能的。因此，目标是让冲突发生的概率低到我们不需要考虑它。\n\
  \n哈希正是 Windows 存储密码的方式。例如，如果你的密码是 `password`，那么 Windows 会首先对其进行哈希并产生类似所示的内容：\n\n\
  ```\n0BD181063899C9239016320B50D3E896693A96DF\n```\n\n然后 Windows 将其存储在 Windows 系统目录下的\
  \ `SAM`（安全账户管理器）文件中。当你登录时，Windows 无法对你的密码进行反哈希（因为记住，它是单向的）。所以，Windows 执行的是获取你输入的任何密码，对其进行哈希，然后结果与\
  \ `SAM` 文件中的内容进行比较。如果它们匹配（完全匹配），你就可以登录。\n\n存储 Windows 密码只是哈希的应用之一。还有其他应用。例如，在计算机取证中，在开始取证检查之前，通常会对驱动器进行哈希。之后你可以再次对它进行哈希，以查看是否发生了任何更改（无意或有意的）。如果第二次哈希与第一次匹配，则说明没有发生变化。\n\
  \n有各种哈希算法。其中最常见的两种是 `MD5` 和 `SHA`。（之前是 `SHA-1`，但之后后续版本如 `SHA-256` 变得更加常见。）\n\n###\
  \ MD5\n\n`MD5` 是一种 128 位哈希，规范于 `RFC 1321`。它由 Ron Rivest 在 1991 年设计，用于取代早期的哈希函数 `MD4`。`MD5`\
  \ 产生 128 位摘要。它发现抗冲突性不如 `SHA`。\n\n### SHA\n\n`安全哈希算法` (`SHA`) 是目前最广泛使用的哈希算法。现在有多个版本的\
  \ `SHA`。所有 `SHA` 版本都被认为是安全且无冲突的：\n\n- **SHA-1：** 这种 160 位的哈希函数类似于早期的 `MD5`。它由 NSA\
  \ 设计，用于数字签名算法 (`DSA`)。\n- **SHA-2：** 这实际上是两个大小不同的哈希函数，被称为 `SHA-256` 和 `SHA-512`。它们的区别在于字；`SHA-256`\
  \ 使用 32 字节（256 位）字，而 `SHA-512` 使用 64 字节（512 位）字。每个标准也有截断版本，被称为 `SHA-224` 和 `SHA-384`。这些也由\
  \ NSA 设计。\n- **SHA-3：** 这一最新的 `SHA` 版本于 2012 年 10 月通过。\n\n#### RIPEMD\n\n`RACE 完整性原理评估摘要`\
  \ (`RIPEMD`) 是由 Hans Dobbertin、Antoon Bosselaers 和 Bart Preneel 开发的 160 位哈希算法。该算法存在\
  \ 128 位、256 位和 320 位版本，分别被称为 `RIPEMD-128`、`RIPEMD-256` 和 `RIPEMD-320`。这些都取代了原始的\
  \ `RIPEMD`，后者被发现存在冲突问题。\n\n### MAC 和 HMAC\n\n哈希用于许多安全功能。其中之一是存储密码，我们已经讨论过了（在本章后面还会看到更多）。\n\
  \n发送消息的哈希可以检查传输过程中是否发生了意外更改。如果消息在传输过程中被更改，接收者可以将收到的哈希与计算机发送的哈希进行比较，并检测出传输错误。但故意篡改消息呢？如果有人刻意篡改消息，删除原始哈希并重新计算一个新的，会怎样？遗憾的是，简单的哈希算法无法考虑到这种情况。\n\
  \n\n\n\n\n使用`message authentication code`（`MAC`）是检测消息被故意篡改的一种方法。`MAC`通常也称为`密钥加密哈希函数`。这个名称已经告诉了它是如何工作的。其中一种方法是哈希消息认证码（`HMAC`）。假设你正在使用\
  \ `MD5` 来验证消息的完整性。为了检测拦截方刻意修改消息，发送者和接收者必须事先交换一个适当大小的密钥（在本例中为 128 位）。发送者对消息进行哈希处理，然后将哈希值与密钥进行异或（XOR）。接收者对收到的内容进行哈希处理，并将计算哈希值与密钥异或。然后交换这两个哈希值。如果拦截者只是重新计算哈希值，他将没有密钥来进行\
  \ `XOR` 操作（可能甚至不知道应该进行 `XOR`）；因此，拦截者创建的哈希值与接收者计算的哈希值不匹配，从而检测到干扰。\n\n该概念还有其他变体。有些使用\
  \ `CBC`（密码块链模式）中的对称加密算法，然后只使用最后一个块作为 `MAC`。这些变体被称为 `CBC-MAC`。\n\n## 彩虹表\n\n由于 Windows\
  \ 和其他许多其他系统将密码存储为哈希值，许多人对如何破解哈希产生了兴趣。正如我们提到的，由于 `hash` 是不可逆的，因此没有办法对某些内容进行“反哈希”。在\
  \ 1980 年，Martin Hellman 描述了一种密码分析技术，它通过使用存储在内存中的预计算数据来缩短密码分析时间。该技术在 1982 年之前被 Rivest\
  \ 进行了改进。基本上，这些类型的密码破解器处理的是特定字符空间内所有可用密码的预计算哈希，无论该空间是 `a–z`、`a–zA–z`、`a–zA–Z0–9`还是更多。这被称为\
  \ `rainbow table`（彩虹表）。如果你为给定的哈希搜索彩虹表，你找到的任何明文都应该是输入哈希算法以生成该特定哈希值的文本。\n\n显然，这种彩虹表会迅速变得非常大。假设密码必须限于键盘字符。这留下了\
  \ 52 个字母（26 个大写和 26 个小写）、10 个数字和大约 10 个符号，共约 72 个字符。正如你可以想象的，即使是 6 位的密码也有大量的可能组合。这意味着彩虹表的大小是有限制的，这也是为什么长密码比短密码更安全的原因。\n\
  \n自从彩虹表开发以来，已经有了阻止此类攻击的方法。最常见的是`salting`（加盐），即通过添加随机位来进一步保护加密或哈希。这通常发生在通过哈希处理时，以防止彩虹表攻击。\n\
  \n本质上，盐（salt）与要进行哈希的消息混合在一起。考虑一个例子。假设你有一个这样的密码：\n\n```\npass001\n```\n\n在二进制中它为：\n\
  \n```\n01110000 01100001 01110011 01110011 00110000 00110000 00110001\n```\n\n加盐算法会定期插入位。假设在例子中，我们每隔四个位插入一个位，得到：\n\
  \n```\n0111100001 0110100011 0111100111 0111100111 0011100001 0011100001 0011100011\n\
  ```\n\n如果你将其转换为文本，你将得到：\n\n```\nxZ7!#\n```\n\n这一切对终端用户来说都是透明的，他们甚至不知道正在加盐，也不知道加盐是什么。然而，使用彩虹表获取密码的攻击者将得到错误的密码。\n\
  \n## 隐术\n\n`Steganography`（隐术）是一种编写隐藏消息的艺术和科学，使得除了发送者和预期接收者之外，没有人会怀疑消息的存在。它是通过隐蔽实现安全的一种形式。消息通常被隐藏在其他文件中，例如数字图片或音频文件，以规避检测。\n\
  \n隐术相比于单纯加密的优势在于，消息不会引起自身的注意。如果有人意识到消息甚至在那里，她就不会尝试解密。在很多情况下，消息是通过加密并通过隐术进行隐藏的。\n\
  \n今天最常见的隐术实现方式是利用文件中的最低位（least significant bits）来存储数据。通过改变最低位，你可以在不以任何肉眼可见的方式更改原始文件中隐藏额外数据。\n\
  \n你应该了解一些基本的隐术术语：\n\n- `Payload`（有效负载）是要进行秘密通信的数据。换句话说，就是你想隐藏的消息。\n- `carrier`（载体）是隐藏有效负载的信号、流或数据文件。\n\
  - `channel`（通道）是使用的媒介。这可能是静态照片、视频或声音文件。\n\n如今实现隐术最常见的方法是通过最低位。每个文件在文件单位上都有特定数量的位。例如，Windows\
  \ 中的图像文件每个像素 24 位。如果你更改了这些位中的最低位，那么肉眼就无法察觉这种变化。你可以通过最低位（`lsb`）替换在图像文件的最低位中隐藏信息。\n\
  \n### 历史上的隐术\n\n在现代，隐术涉及对文件进行数字处理以隐藏消息。然而，隐藏消息的概念并不新。历史上一直使用以下方法：\n\n- 古中国人将信息包裹在蜡中并吞下。这种方法虽然原始但有效。\n\
  - 在古希腊，信使剃光头，将消息写在头上，然后让头发重新生长。显然，这种方法需要一些时间。\n- 二战期间，法国抵抗军使用隐形水在信使身上写信息。\n- 微缩点是打字机大小的图像，嵌入在看似正常的文档中。据冷战期间被间谍使用。\n\
  - 在冷战期间，美国中央情报局使用各种设备隐藏消息。例如，他们开发了一种烟斗，里面可以隐藏微胶，但仍然可以抽。\n\n### 隐术方法与工具\n\n有很多工具可以实现隐术：\n\
  \n- `QuickStego`：易用但功能有限。\n- `Invisible Secrets`：健壮得多，有免费版和商业版可选。\n- `MP3Stego`：专门用于在\
  \ MP3 文件中隐藏负载。\n- `Stealth Files 4`：适用于声音文件、视频文件和图像文件。\n- `Snow`：在空白处隐藏数据。\n- `StegVideo`：在视频序列中隐藏数据。\n\
  - `Invisible Secrets`：一种多功能隐术工具，具有多种选项。\n\n## 密码分析\n\n密码分析是一项艰巨的任务。它本质上是寻找破解某种加密的方法。与你在电影中看到的不同，它是一项非常耗时的任务，通常只能获得部分成功。密码分析涉及使用任何比简单的暴力破解更有效的方法解密。（记住，暴力破解意味着尝试所有可能的密钥。）\n\
  \n密码分析成功并不意味着破解了目标加密。事实上，发现任何关于目标加密或密钥的信息都被视为成功。有几种类型的密码分析成功：\n\n- **Total break**（完全破解）：攻击者推出了秘密密钥。\n\
  \n\n\n\n\n- **全局推演：** 攻击者发现了一个功能等效的加密解密算法，但无需学习密钥。\n- **实例（局部）推演：** 攻击者发现了此前未知的额外明文（或密文）。\n\
  - **信息推演：** 攻击者获取了关于此前未知的明文（或密文）的某些香农信息。\n- **区分算法：** 攻击者可以区分密文与随机排列。\n\n关于密码分析，已有大量著作专为此之。本节的目的只是为了给你提供该领域的一些基础概念，以便你有一个基本的了解。本中还有许多本节未讨论的其他方法。\n\
  \n## 频率分析\n\n`Frequency analysis` 是破解大多数经典密码的基本工具，尽管它对现代对称加密或非对称加密并不起作用。它基于这样一个事实：某些字母和字母组合比其他字母更常见。在所有语言中，字母表中某些字母出现的频率都高于其他字母。通过检查这些频率，你可以推导出关于所用密钥的信息。在英语中，`the`\
  \ 和 `and` 是两个最常见的三个字母单词。最常见的单字母单词是 `I` 和 `a`。如果你在一个单词中看到两个相同的字母在一起，它们最可能是 `ee` 或\
  \ `oo`。\n\n## 现代密码分析方法\n\n破解现代密码方法是相当艰巨的。成功与取决于资源的组合，包括计算能力、时间和数据。如果你拥有这些任何一种资源的无限量，你就可以破解任何现代密码算法。但你不会拥有无限量。\n\
  \n接下来的章节描述了用于攻击分组密码的基本方法。还有其他超出本书书范围的方法，例如差分密码分析和线性密码分析。为了理解基础计算机安全，没有必要精通这些技术。\n\
  \n### 已知明文攻击\n\n已知明文攻击方法基于拥有一组已知明文及其产生的密文样本，然后利用这些信息尝试确定有关所用密钥的某些信息。获取已知明文样本比你想象的要容易。考虑电子邮件，包括我在内，许多人都会使用标准的签名档。如果你曾经收到过我的电子邮件，你就知道我的签名档是什么了。那么，如果你拦截了我发送的加密邮件，你就可以将已知签名档与加密邮件的末尾进行比较。这样你就有了可以处理的已知明文和匹配的密文。这种方法的成功需要成千上万个已知明文样本。\n\
  \n### 选择明文攻击\n\n选择明文攻击与已知明文攻击密切相关，但在选择明文攻击中，攻击者找到了一种方法，让目标加密由攻击者选择的消息。这允许攻击者尝试推导出所使用的密钥，从而解密使用该密钥加密的其他消息。这种方法可能很难，但并非不可能。它需要成千上万个选择明文样本才能成功。\n\
  \n### 纯密文\n\n在纯密文攻击中，攻击者只能访问一组密文。这比已知明文常见得多，但也是最困难的攻击类型。如果可以推导出相应的明文，或者更好，如果可以推导出密钥，那么纯密文攻击就是完全成功的。即使是获取关于底层明文的任何信息，也被视为一种成功。\n\
  \n### 相关密钥攻击\n\n相关密钥攻击是一种攻击类型，攻击者可以观察密码在不同密钥下的操作，其中某些数学关系已知。\n\n## 互联网上使用的加密\n\n\
  互联网使用的是哪种加密？`SSL` 和 `TLS` 之间有什么区别？\n\n访问网站时，`SSL`（安全套字层）或 `TLS`（传输层安全）表示你的浏览器和服务器之间的流量。`SSL`\
  \ 是两者中较旧的，由 Netscape 开发。`SSL` 和 `TLS` 都用于加密数据。这通常是 `HTTPS`。\n\n## 量子计算加密\n\n最近引人注目的加密相关话题之一是量子计算。在这里我们简要解释量子计算，然后看看它的影响。\n\
  \n量子计算的核心问题是能够表示两个以上的状态。目前使用经典比特位的技术可以表示二进制值。量子比特（Qubits）通过单个光子的偏振来存储数据。量子比特的两个状态用量子符号表示为\
  \ `|0>` 和 `|1>`。然而，量子力学允许这两个状态的叠加。这表示为 `|ψ> = α|0> + β|1>`。本质上，一个经典比特位可以表示 `1` 或\
  \ `0`。而量子比特可以表示 `1`、`0` 或这两个状态的任何叠加，这在经典比特位中是是不可能的。\n\n与你可能听到的消息相反，目前的量子计算尚未达到实际应用的应用的阶段。如今的尖端量子系统只有\
  \ 20 到 50 个量子比特，并且只能维持极短时间的数据。这非常适合研究，但并不适用于实用的计算。然而，许多专家认为在 10 年内我们将拥有一台运行的、实用量子计算机。这对密码学意味着什么？1995\
  \ 年，Peter Shor 发表了 Shor 算法，证明了量子计算机能够以比经典计算机快得多的时间分解大数。量子计算机可以在项式时间内分解整数 `N`；实际时间为\
  \ `log N`。这比最高效的经典因子分解算法（普通数域筛法）快得多，后者在亚指数时间内运行。RSA 基于大数分解的困难性。预计量子计算机在解决离散对数问题方面同样高效。`Diffie-Hellman`、`MQV`、`Elgamal`\
  \ 和 `ECC` 都基于解决离散对数问题的困难。\n\n\n\n\n\n- `CRYSTALS-KYBER` 用于公钥加密和密钥建立算法（有关更多关于 `CRYSTALS-KYBER`\
  \ 的信息，请参见 [`pq-crystals.org/kyber/`](https://pq-crystals.org/kyber/））\n- `CRYSTALS-DILITHIUM`\
  \ 用于数字签名\n- `FALCON` 用于数字签名\n- `SPHINCS+` 用于数字签名\n\n## 总结\n\n计算机安全的基础元素是加密。发送未加密的敏感数据简直是愚蠢。本章介绍了密码学工作原理的基本信息。最重要的是，最终可能被破解的不是你的计算机或网络，而是你的数据。在传输时对数据进行加密是任何安全计划不可或缺的一部分。\n\
  \n在本章末的练习中，你将练习使用不同的密码方法，并进一步了解多种加密方法。\n\n### 测试你的技能\n\n### 单选题\n\n1。理解密码学的概念和应用非常重要。以下哪项对“加密”的定义最准确？\n\
