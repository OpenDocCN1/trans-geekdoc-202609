  \ 7 的一部分发布。随着 Windows 的每个版本的更新，它都在不断成长并增加了功能。它是 Windows 操作系统的免费组成。图 5.11 显示了 Windows\
  \ 10 上 Windows Defender 的主界面。\n\n![Description: 显示了 windows defender 主界面的截图。](img/05fig11.jpg)\n\
  \n**图 5.11** Windows Defender 主界面。\n\n### 反恶意软件与机器学习\n\n正如机器学习正成为恶意软件的一部分一样，它也是防御恶意软件的一部分。以下这段引文可能有助于解释现状：\n\
  \n“静态恶意软件检测的新进展之一是使用深度学习进行端到端的机器学习，用以进行恶意软件检测。在这种设定下，我们完全跳过了所有特征工程；我们不需要对 PE 头或其他可能指示\
  \ PE 恶意软件的特征有任何了解。我们只需将原始字节流输入我们的神经网络并进行训练。”^(5)\n\n^(5) 《网络安全机器学习食谱：超过 80 种关于如何使用\
  \ Python 实现机器学习算法以构建安全系统的配方》\n\n目前有几种产品将机器学习作为其杀毒方案的一部分进行。这些产品包括：\n\n*   Cylance\
  \ 智能杀毒软件\n*   Deep Instinct D-Client()\n*   Avast 杀毒软件\n\n### 修复步骤\n\n显然，缓解恶意软件风险的关键步骤是运行最新的杀毒软件。我不推荐任何特定的杀毒程序。McAfee、Norton、AVG、Kaspersky\
  \ 和 Malwarebytes 都是良好的产品。然而，我建议，如果你同时使用基于主机的杀毒软件和网络杀毒软件，你应该使用来自不同供应商的产品。这样，其中一个漏掉的，另一个很可能会捕捉到。\n\
  \n除了运行反恶意软件外，安全专业人员还可以采取特定步骤来缓解恶意软件的风险。请注意，目标是缓解恶意软件的威胁。完全消除此类威胁是不可能的，但你可以减少攻击的频率和损害的严重程度。\n\
  \n教育终端用户至关重要。必须让终端用户意识到恶意软件的普遍性。目标是让你网络上的所有用户对附件和下载保持怀疑。当然，某些业务需求需要使用附件文档。但你可以教育用户在打开任何附件之前考虑几个简单的问题：\n\
  \n*   这个附件是预料之中的吗？来自你不认识的人或你没有预期收到附件的邮件必须始终被视为潜在的恶意软件。\n*   邮件内容具体吗，例如“这些是我们昨天会议上讨论的第三季度销售报告”？具体的细节通常表明是附带真实文档的真实邮件。但听起来很通用的邮件，如“这是你的文档”，或试图说服用户必须立即打开附件的邮件，应该怀疑其为恶意软件。\n\
  *   你对邮件附件的真实性有重大怀疑吗？如有疑问，请请教技术支持。\n\n采取这些简单措施可以消除许多恶意软件爆发。你可以采取一条更复杂的路线让你的计算机几乎对恶意软件产生免疫：首先，在你的计算机上设置一个虚拟机。有多种虚拟机应用程序，例如\
  \ VMware 和 Oracle Box（免费的）。然后在该虚拟机中安装一个与主机计算机运行系统不同的操作系统。因此，如果你的主机是 Windows 10，那么虚拟机就可以运行\
  \ Linux。如果你的主机是 Mac，虚拟机就可以运行 Windows。现在，如果你在虚拟机内部浏览互联网，你几乎不可能在主机上感染病毒。到目前为止，还没有病毒跨越虚拟机/主机的屏障，也没有病毒感染多个操作系统。应该注意的是，Java\
  \ 病毒和某些网页恶意软件可以感染不同的系统。但作为常规，为 Windows 编写的病毒不会影响 Mac，反之亦然。\n\n## 总结\n\n显然，攻击目标系统的方法有很多：使用\
  \ Do 攻击、病毒/蠕虫、特木马、溢出攻击和间谍软件。每种攻击类型都有许多变体。黑客攻击系统的方法很多，保护你的系统是一项相当复杂的任务。但到此为止，系统安全至关重要。在接下来的练习中，你将尝试\
  \ Norton 和 McAfee 的杀毒程序。\n\n本章强调的另一个主题是，许多甚至是大多数攻击是可以预防的。后面的练习将让你练习如何防止 Sasser 和\
  \ Sobig 病毒。在大多数情况下，及时定期地修补系统、使用杀毒工具以及阻止不必要的端口就可以防止此类攻击。\n\n### 测试你的技能\n\n#### 选择题\n\
  \n1。John 是某中型大学的网络安全管理员。他正试图向一名新员工解释什么是病毒。以下哪项是对病毒的最佳定义？\n\nA. 一种会对你的电脑造成危害的程序\n\
  B. 用于 Do 攻击的程序\nC. 一种减慢网络速度程序\n\n\n\n\n\n# D. 自我复制的程序\n\n2. Isabelle 负责她公司的网络安全工作。她担心病毒会对\
  \ IT 系统造成破坏。病毒攻击最常见的损害是什么？\n\nA. 病毒流量导致网络变慢\nB. 删除文件\nC. 修改 `Windows Registry`（Windows\
  \ 注册表）\nD. 损坏操作系统\n\n3. 你正在尝试为组织制定政策以减轻病毒威胁。你希望确保处理了病毒传播最常见的方式。病毒最常见的传播方式是什么？\n\n\
  A. 通过复制到共享文件夹\nB. 通过邮件附件\nC. 通过 `FTP`\nD. 从网站下载\n\n4. 下列哪项是 `Microsoft Outlook`\
  \ 经常成为病毒攻击目标的主要原因？\n\nA. 许多黑客不喜欢 `Microsoft`（微软公司）。\nB. `Outlook` 复制病毒文件的速度速度更快。\n\
  C. 编写访问 `Outlook` 内部机制的程序很容易。\nD. `Outlook` 比其他电子邮件系统更常使用。\n\n5. Juan 是一家小型图形设计公司的网络管理员。2021\
  \ 年 4 月，他的公司遭受了一种专门针对 `MacOS` 的病毒，该病毒是其他恶意软件组件的第一阶段下载器。这描述的是哪种攻击？\n\nA. `Schlayer`\n\
  B. `Pegasus`（飞马）\nC. `Marai`\nD. `Saser`\n\n6. `WannaCry` 病毒的哪个因素让安全从业人员特别感兴趣？\n\
  \nA. 通过良好的补丁管理可以防止。\nB. 它删除了关键系统文件。\nC. 它很难防御。\nD. 它非常复杂，可能是国家级武器化恶意软件。\n\n7. 探测到的第一个病毒名称是什么？\n\
  \nA. `Creeper`\nB. `Wabbit`\nC. `Mimail`\nD. 未命名\n\n8. 下列哪种原因最可能让 `Bagle` 病毒如此迅速传播？\n\
  \nA. 包含它的邮件声称来自系统管理员。\nB. 它在网络中自我复制。\nC. 它是一个复杂的病毒。\nD. 它特别具有毒性。\n\n[9]](#appb.xhtml#ch05quiz9).\
  \ Mohaned 在他的网络中发现了恶意软件。这种恶意软件加密文件索要赎金，还阻止了约 600 个 `Windows` 进程。Mohaned 发现了哪种恶意软件？\n\
  \nA. `Schlayer`\nB. `Thanatos`（死神）\nC. `Cl0p`\nD. `Pegasus`\n\n10. 下列哪项是任何人都可以用来防止病毒攻击的方法？\n\
  \nA. 设置防火墙。\nB. 使用加密传输。\nC. 使用安全的电子邮件软件。\nD. 永远不要打开未知邮件附件。\n\n11. 你正在尝试开发减轻公司病毒威胁的方法。发送和接收附件最安全的方法是哪个？\n\
  \nA. 使用指示附件合法的代码。\nB. 仅使用附件。\nC. 使用安全的电子邮件软件。\nD. 使用未知邮件附件。\n\n12. Shelly 试图教新员工如何处理附件。关于邮件警报，以下哪项是正确的？\n\
  \nA. 你必须遵循。\nB. 大多数公司会发送警报。\nC. 大多数公司通过电子邮件发送。\n\n13. 下列哪项是木马可能会做的事？\n\nA. 使用恶意软件。\n\
  B. 修改你的配置。\nC. 修改你的。\nD. 更改你的地址。\n\n14. Jared 正在学生解释各种攻击。溢出（overflow）是做什么？\n\nA.\
  \ 它放入了太多的包。\nB. 它使系统溢出。\nC. 它溢出。\nD. 它放入了更多数据。\n\n15. 以下是什么？\n\nA. `WannaCry`（加密货币）\n\
  B. `Mimail`\nC. `Saser`\nD. `Schlayer`\n\n16. 你可以做什么防止病毒攻击？\n\nA. 购买防火墙。\nB. 关闭端口。\n\
  C. 使用防病毒软件。\nD. 以上均不是。\n\n17. 哪种恶意软件是？\n\nA. `Pegasus`（飞马）\nB. Buffer（缓冲区）\nC. 木马\n\
  D. 间谍软件\n\n18. 下列哪项是所有用户都应该采取的步骤？\n\nA. 购买防火墙。\nB. 关闭端口。\nC. 使用非标准电子邮件。\n\n19. 病毒扫描的主要工作原理是什么？\n\
  \nA. 通过将文件与已知特征列表进行对比\nB. 通过阻止文件自我复制\nC. 使用未知。\n\n20. 病毒扫描器还有什么其他工作方式？\n\nA. 通过将文件与已知特征列表进行对比\n\
  B. 通过阻止文件自我复制\nC. 使用未知。\n\n### 练习\n\n**练习 5.1: 使用杀毒软件**\n前往该杀毒软件网站（www.symantec.com/downloads）下载其试用版软件。\n\
  安装并运行软件。\n仔细研究你喜欢和不喜欢的功能。\n\n**练习 5.2: 使用 McAfee 防病毒软件**\n前往 McAfee 网站（http://www.mcafeee.com）下载其试用版软件。\n\
  安装并运行软件。\n仔细研究你喜欢和不喜欢的功能。\n\n**练习 5.3: 防止 Saser**\n利用网络或期刊资源研究 Saser 病毒。你可能会发现 `www.f-secure.com`\
  \ 和安全安全中心（https://www.symantec.com/security-center）对该练习有帮助。\n写一篇短文，说明 Saser 如何传播的，造成了什么损害，以及可以采取哪些步骤来防止。\n\
  \n**练习 5.4: 防止 Sobig**\n利用网络或期刊资源研究 Sobig 病毒。你可能会发现 `www.f-secure.com` 和安全安全中心（https://www.symantec.com/security-center）对该练习有帮助。\n\
  写一篇短文，说明 Sobig 如何传播的，造成了什么损害，以及可以采取哪些步骤来防止。\n\n**练习 5.5: 了解当前的病毒攻击**\n利用网络或期刊资源，找到一种过去\
  \ 90 天内一直在传播的病毒。\n写一篇短文，说明该病毒是如何传播的，造成了什么损害，以及可以采取哪些步骤来防止。\n\n### 项目\n\n**项目 5.1:\
  \ 病毒防护策略**\n此活动也可以作为小组项目进行。\n\n\n\n\n\n考虑到你在本章以及之前章节中学到的内容，并结合外部资源，为小型企业或学校编写一份防病毒策略。你的策略应该包含技术性建议和程序性指南。你可以选择参考网络上找到的现有防病毒策略指南来获取一些灵感。但是，你不应该简单地复制这些防病毒策略。相反，你应该制定你自己的策略。\n\
  \n## 项目 5.2：最糟糕的病毒攻击\n\n利用网络上的资源、书籍或期刊，寻找一次你认为历史上最糟糕的病毒爆发。写一篇短文，描述这次攻击，并解释你为什么认为它是最糟糕的。它是否被广泛传播？传播速度有多快？它造成了什么破坏？\n\
  \n## 项目 5.3：为什么要编写病毒？\n\n关于人们为什么要编写病毒，已经形成了许多假设。这些假设从坦率直言的阴谋论到学术性的心理学角度各不相同。采取你认为最可能的立场，写一篇论文解释你为什么认为人们会花费时间和精力去编写病毒。\n\
  \n## 案例研究\n\n乔健（Chiao Chien）负责一家学校的 IT 安全。由于使用学校电脑的人群范围广泛，陈健很难防止病毒攻击。陈健拥有相当合理的预算，并在每台机器上都安装了防病毒软件。他还有一个防火墙，阻止了所有不必要的端口，而且学校政策禁止从网上下载任何软件。考虑以下问题：\n\
  \n1. 你认为陈健的网络防御病毒攻击的能力如何？\n2. 陈健哪些领域没有做到安全防护？\n3. 你会向陈健提供什么建议？\n\n## 第 6 章\n\n##\
  \ 黑客使用的技术\n\n### 章节目标\n\n读完本章并完成练习后，你将能够做到以下：\n\n- 理解黑客使用的基本方法论\n- 熟悉一些基础黑客工具\n\
  - 理解黑客心态\n- 能够解释特定的攻击方法\n\n### 引言\n\n前五章向你介绍了通的安全概念。现在是时候探索用于攻击你网络的技术了。如果你不知道对手知道什么，就很难真正确保你的网络安全。在继续之前，重要的是意识到许多黑客并不是犯罪分子。黑客是想要理解一个系统的人，通常通过探测其弱点来实现。甚至有有为组织工作的黑客，负责测试这些组织的系统安全性。这被称为\
  \ `渗透测试`，有时也称为 `白帽黑客`。渗透测试有几项认证：\n\n- **Offensive Security：** [`www.offensive-security.com/information-security-certifications/`](https://www.offensive-security.com/information-security-certifications/)\n\
  - **SANS Institute：** [`pen-testing.sans.org/certification`](http://pen-testing.sans.org/certification)\n\
  - **EC-Council 的认证伦理黑客：** [www.eccouncil.org](http://www.eccouncil.org)。\n\n还有一本针对白帽黑客的杂志叫做\
  \ `2600`（`[www.2600.com](http://www.2600.com)`）。许多计算机安全专业人士尝试学习黑客技术，是为了增强自己的安全能力，或者仅仅是为了满足好奇心。技术本身并不犯罪。然而，确实有人利用黑客技术入侵系统以窃取数据、破坏系统或实施其他网络犯罪。这些人通常被称为\
  \ `黑帽黑客` 或 `破解者（crackers）`。\n\n本章介绍的技术不仅是为了让你理解黑帽黑客是如何工作的，还为了展示你如何在自己的网络上执行渗透测试。通过尝试在你的网络上实施其中的一些技术，你可以评估自己的脆弱性。（应该指出，你只有在非常精通本章技术时——并且在获得高层管理许可的情况下才能这样做。）\n\
  \n### 基础术语\n\n在我们深入研究黑客世界之前，我们需要讨论该社区使用的基础术语。我们已经向你介绍过 `白帽黑客` 术语，它用于描述为了法律/道德目的使用黑客技术的人。我们还讨论了\
  \ `黑帽黑客` 和 `破解者`，它们用于描述为了非法目的使用黑客技术的人。\n\n还有几个你应该熟悉的术语。`灰帽黑客` 是以前是黑帽黑客但转变为白帽黑客的人（基本上是以前的犯罪分子变成了合规者）。随着互联网工具的泛滥，还有很多人下载了一些工具（我们将在本章中检查其中一些）并在并不真正理解的情况下执行某些网络攻击。这些人被称为\
  \ `脚本小子（script kiddies）`（有时也拼为 kiddys）。另一个重要术语 `电话破解（phreaking）` 指黑入电话（这早于黑入计算机系统）。\n\
  \n通常进行渗透测试是为了模拟特定的对手或类型的对手。这被称为 `红队`。例如，如果一个组织主要担心国家级攻击，那么红队就可以利用国家级攻击中常用的相同技术来进行渗透测试。与红队相对的是\
  \ `蓝队`，即试图阻止红队攻击的防御团队。\n\n### 侦察阶段\n\n任何聪明/有经验的黑客都会在实际尝试攻击之前试图找到有关目标的信息。就像银行劫匪会想要了解银行的警报系统、守卫人数、警察响应时间等一样，黑帽黑客也会想要了解你系统的安全性。令你惊讶的是，即使不连接目标系统，在互联网上也能轻易发现这么多信息。\n\
  \n#### 被动扫描技术\n\n黑客可以做的最简单的事情之一是检查目标组织的网站。企业通常发布对攻击者非常有用的信息。例如，假设 XYZ 公司列乔健为 IT\
  \ 经理。一个进取的黑客可以扫描公告板和讨论组，寻找关于 XYZ 乔健的引用。该攻击者可能会发现这些信息在鱼叉式钓鱼攻击（即针对特定个人或群体的钓鱼）中很有用，或者攻击者可能会发现这些信息在社会工程学中有用。例如，许多前员工可能在网上抱怨乔健要求严格且容易开人。一个进取的黑客可以给\
  \ XYZ 的某人打电话，谎称为乔健工作。黑客可能会说他正尝试远程登录该人的电脑以更新系统。片刻之后，黑客告诉那人他忘记了乔健给他的密码，非常担心如果不完成这项任务会被开除；然后他向那人索要密码。攻击者从网上获得的信息已足以让这个社会工程攻击看起来很合理。\n\
  \n攻击者还可能扫描公告板、聊天室、讨论组和其他地方，寻找来自目标组织 IT 员工的问题。例如，如果管理员在讨论组中询问某个特定的服务器问题，这可以为攻击者提供有关目标网络的有价值的信息。\n\
  \n\n\n\n攻击者利用 Web 获取有关目标信息的另一种方法是通过职位招聘广告。例如，如果一家公司经常招聘 ASP.NET 开发人员，而从不招聘 PHP 或\
  \ Perl，那么公司的 Web 应用程序很可能是使用 ASP.NET 开发并运行在 Windows Web 服务器（Internet 信息服务）上的。这使得攻击者只需关注一小部分可能的攻击目标——即针对\
  \ ASP.NET/Windows 的攻击。\n\n信息也可以从招聘广告中获取。例如，如果一家员工少于 200 人的小型公司每年发布两次网络管理员的招聘，那么很可能是该公司最近流失了旧的管理员，因为一家小公司不需要多名管理员。如果当前的管理员是新的，意味着她可能对自己的系统熟悉程度不如老任管理员。此外，如果这种招聘新管理员的趋势持续了几年，黑客就可以推断出公司的人员流动率很高，并且存在某些攻击者可能利用的问题。\n\
  \n某些特定的网站也提供攻击者可能有用的信息。例如，[netcraft.com](http://netcraft.com)（图 6.1 所示）提供了有关网站的信息。例如，你可以查出一个网站运行的是什么种服务器，在某些情况下，还可以查到服务器上次重启已经多久了。\n\
  \n![Description: 一个窗口显示了 www.chuckeasttom.com 的站点信息。](img/06fig01.jpg)\n\n**图 6.1**\
  \ [www.netcraft.com](http://www.netcraft.com)。\n\n另一个对攻击者有用的网站是 [`archive.org`](https://archive.org)。该网站（图\
  \ 6.2 所示）存档了网站的老版本。该服务器扫描整个 Web 并存档站点。一个网站被存档的频率取决于其流行程度。\n\n![Description: 屏幕截图显示了网站旧版本的存档。](img/06fig02.jpg)\n\
  \n**图 6.2** [www.archive.org](http://www.archive.org)。\n\n## 主动扫描技术\n\n前述提到的技术都被认为是被被的，因为它们不需要攻击者连接到目标系统。由于攻击者实际上并没有连接到目标系统，入侵检测系统（IDS）就不可能检测到该扫描。主动扫描要可靠得多，但可能会被目标系统检测。主动扫描有几种类型。\n\
  \n### 端口扫描\n\n端口扫描 是尝试连接目标系统上的每个网络端口并查看哪些端口是开放状态的过程。有 1024 个常用端口通常与特定服务相关联。例如，端口\
  \ 161 与简单网络管理协议（SNMP）相关。如果攻击者检测到目标系统上的端口 161 开放，他可能会尝试与 SNMP 相关的攻击。从端口扫描中还可以获得更多信息。例如，端口\
  \ 137、138 和 139 都与 NetBIOS 相关，NetBIOS 是一种非常老老的 Windows 网络通信方法，在 Windows 中已不再使用。然而，NetBIOS\
  \ 常用于 Windows 机器与 Linux 机器通信的系统，因此发现这些端口可以揭示有关目标网络的一些信息。在 Google 上简单搜索 `port scanner`\
  \ 就会发现大量知名、广泛使用且通常是免费的扫描器。然而，黑客和安全社区中最流行的端口扫描器是免费工具 `Nmap`（`nmap.org)）。它有一个 Windows\
  \ 版本，名为 `Zenmap`，如图 6.3`所示。\n\n![Description: 屏幕截图显示了 Zenmap。](img/06fig03.jpg)\n\
  \n**图 6.3** Zenmap。\n\n`Nmap` 允许你自定义扫描，使其更具隐蔽性或针对特定系统。这里列出了最常见的扫描类型：\n\n- **Ping\
  \ 扫描（Ping scan）：** 这种扫描只是向目标端口发送 ping。许多网络管理员为了停止 ping 扫描会拦截 ICMP 包。\n- **连接扫描（Connect\
  \ scan）：** 这是最可靠的扫描，也是最可能被检测到的类型。通过这种扫描，与目标系统建立了完整的连接。\n- **SYN 扫描（SYN scan）：**\
  \ 这种扫描非常隐蔽。大多数系统都接受 SYN（同步）请求。这种扫描类似于第 4 章](#ch04.xhtml#ch04)中描述的 SYN 洪水攻击（SYN flood\
  \ attack）。在这种扫描中，你发送一个 SYN 包，但在系统发送 SYN/ACK 时从不响应。这也被称为半开放扫描。\n- **FIN 扫描（FIN scan）：**\
  \ 这种扫描设置了 FIN（连接结束）标志。对于系统接收到的这种包是不常的，因此被认为是隐蔽的。这些扫描中的每一个都会目标机器上触发不同的响应，从而为端口扫描器提供不同的信息：对于\
  \ FIN 扫描或 XMAS 扫描，如果目标端口关闭，系统会发回 RST（重置）包。如果是开放的，则没有响应。在 SYN 扫描中，如果端口关闭，响应是 RST；如果开放的，响应是\
  \ SYN/ACK。ACK 扫描和 NULL 扫描仅在 UNIX 系统上有效。\n\nNmap 还允许你设置许多标志（无论是通过命令行版本还是 Windows\
  \ 版本）。允许的标志列举如下：\n\n- `-O` 检测操作系统\n- `-sP` Ping 扫描\n- `-sT` TCP 连接扫描\n- `-sS` SYN\
  \ 扫描\n- `-sF` FIN 扫描\n- `-sX` Xmas 扫描\n- `-sN` NULL 扫描\n- `-sU` UDP 扫描\n- `-sO`\
  \ 操作系统扫描\n- `-sA` ACK 扫描\n- `-sW` Windows 扫描\n- `-sR` RPC 扫描\n- `-sL` 列表/DNS 扫描\n\
  - `-sI` 空闲扫描\n- `-Po` 不 ping\n- `-PT` TCP ping\n- `-PS` SYN ping\n- `-PI` ICMP ping\n\
  - `-PB` TCP 和 ICMP ping\n- `-PM` ICMP 掩码\n- `-oN` 正常输出\n- `-oX` XML 输出\n- `-oG`\
  \ Grep 格式输出\n- `-oA` 所有输出\n- `-T` \n- `-T0` 谨慎\n- `-T1` 偷行\n- `-T2` 礼貌\n- `-T3`\
  \ 正常\n- `-T4` 激进\n- `-T5` 疯狂\n\n如所示，Nmap 有许多选项。人们可以花费大量时间学习 Nmap。当然，还有其他端口扫描工具。我们关注\
  \ Nmap 是因为它是免费且广泛使用的。它在 ECCouncil 认证黑客证书、SANS 的 GPEN 以及专业渗透测试认证中都占重要地位。\n\nNmap\
  \ 的设置大部分是直观易懂的。然而，计时值得进一步讨论。计时涉及到发送包的速度。基本上，你发送包的速度越快，被检测到的概率就越大。\n\n这里是最基础的 Nmap\
  \ 扫描：\n\n```\nnmap 192.168.1.1\n```\n\n这里是对一组 IP 地址的扫描：\n\n```\nnmap 192.168.1.1-20\n\
  ```\n\n以下命令用于检测操作系统、使用 TCP 扫描并使用隐蔽速度：\n\n```\nnmap -O -PT -T1 192.168.1.1\n```\n\
  \n### 其他扫描\n\n攻击者可以使用各种扫描来探测你的网络。扫描日志以查找任何针对你网络的扫描证据通常是一个好主意。即使攻击者没有成功破解你的系统，他们也已经尝试了，并且可能会再次尝试。本节描述了其中几种扫描。\n\
  \n- **FIN 探测：** 向开放端口发送 FIN 包并记录响应。虽然 FIN 标志的标准（RFC 793）规定要求的行为是不响应，但 Windows 等许多操作系统会响应\
  \ RST。\n- **FTP 弹射扫描：** 通过 FTP 服务器反射扫描包。这使得扫描更难以追踪。\n\n\n\n\n### SNMP 扫描\n\nSNMP：简单网络管理协议（SNMP）是一种用于网络上设备远程监控和管理的流行协议。它用于报告服务和设备的状态。它通过代理（agents）和节点（nodes）系统工作。SNMP\
  \ 的设计是将请求发送给代理，然后由代理返回回复。请求和回复指的是代理软件可以访问的配置变量。陷阱（Traps）用于表示可能感兴趣的事件。这可以是从简单的重启到某些系统故障的任何内容。SNMP\
  \ 利用管理信息库（MIB）。MIB 是存储在网络设备上的配置变量数据库。SNMP 使用 UDP 端口 `161`。\n\n#### 漏洞评估\n\n漏洞评估涉及检查系统以查看其是否容易受到特定攻击。虽然黑客可以使用漏洞评估工具来评估你的系统，但这些工具的设计初衷是让你自己评估系统。这些工具并不特别具有蔽性，因此可能会被入侵检测系统（IDS）检测。事实上，网络管理员经常使用漏洞评估工具来测试自己的网络。这些工具将在第\
  \ 11 章“网络扫描与漏洞扫描”中进行介绍。\n\n#### 枚举\n\n在实际攻击之前常用的另一种技术是枚举（Enumeration）。`枚举`简单来说就是查找目标系统上内容的过程。如果目标是整个网络，攻击者想要找出该网络中有哪些服务器、计算机和打印机。如果目标是特定的计算机，攻击者想要找出该系统上存在哪些用户和共享文件夹。\n\
  \n简单的 Google 搜索可以帮助你找到许多枚举工具。最易用之一是 Cain and Abel，如图 6.4 所示。\n\n![描述：一张截图显示了 Cain\
  \ and Abel 工具。](img/06fig04.jpg)\n\n**图 6.4** Cain and Abel。\n\n虽然我们在这里关注的是枚举，但\
  \ Cain and Abel 做的功能远比枚举多。要使用 Cain and Abel 进行枚举，只需点击“网络”（Network）选项卡，你就能发现连接到你所在网络的所有机器。（显然，在枚举目标网络之前，你需要某种权限的访问。）\n\
  \n以下是其他在黑客中流行并在互联网上轻松找到的枚举工具：\n\n- Sid2User\n- Cheops（仅限 Linux）\n- UserInfo\n- UserDump\n\
  - DumpSec\n- Netcat\n- NBTDump\n\n这不是一个详尽列表，但它包含了一些最广泛使用的枚举工具。\n\n为了防止扫描，你应该使用以下技术：\n\
  \n- 注意你在互联网上发布了多少关于组织及其网络的信息。\n- 制定公司政策，强制要求使用公告板、聊天室等发布技术数据的技术人员不要使用真实姓名或泄露公司名称。\n\
  - 使用能够检测大量扫描的 IDS。\n- 阻塞入站的互联网控制消息协议（ICMP）数据包。\n\n这些技术不会让对你系统的扫描和侦察变得不可能，但它们会显著减少攻击者获取的信息量。\n\
  \n#### Shodan\n\nShodan（参见图 6.5）本质上是一个设备搜索引擎，被攻击者和测试人员共同使用。无论什么类型，你都需要注册，但许多网站仍然受到影响。\n\
  \n![描述：Shodan 的截图。](img/06fig05.jpg)\n\n**图 6.5** Shodan\n\n你可以使用许多选项，例如：\n\n- `username`（用户名）\n\
  - `country`（国家）\n- `city`（城市）\n- `location`（位置）\n- `asn`（自治系统编号）\n- `isp`（服务提供商）\n\
  - `network`（网络）\n- `hostname`（主机名）\n- `port`（端口）\n（此处省略重复的选项列表，翻译逻辑与原文一致）\n\n\n\n\
  \n\n该查询的问题在于，虽然它是有效的 SQL，但它硬编码了用户名和密码。对于一个真实的网站来说，你必须获取用户在用户名字段和密码字段中输入的任何内容并对其进行检查。这可以很容易实现（无论网站是用哪种编程或脚本语言编写的）。它看起来像这样：\n\
  \n```\n‘SELECT * FROM tblUsers WHERE USERNAME = ‘” + txtUsername.Text +’ AND\nPASSWORD\
  \ = ‘” + txtPassword.Text +”’” .\n```\n\n如果你输入用户名 `‘jdoe’` 和密码 `‘letmein’`，这段代码将产生以下\
  \ SQL 命令：\n\n```\nSELECT * FROM tblUsers WHERE USERNAME = ‘jdoe’ AND PASSWORD =\
  \ ‘letmein’\n```\n\n现在，如果 `tblUsers` 中存在用户名 `jdoe`，且其密码为 `letmein`，那么该用户将成功登录。否则，将会发生错误。\n\
  \n`SQL 注入`的工作原理是在用户名和密码块中放置一些始终为真的 SQL 语句。例如，假设你在用户名和密码框中输入 `‘OR X=X’`。这将导致程序创建如下查询：\n\
  \n```\nSELECT * FROM tblUsers WHERE USERNAME = ‘’OR X=X’ AND PASSWORD = ‘’OR\nX=X’\n\
  ```\n\n注意你在 `OR X=X` 之前开始了一个单引号（`‘`）。这闭合了攻击者知道代码中必须存在的开启引号。如果你看到 `‘’`，它本质上是一个空值或\
  \ null 值，它告诉数据库：如果用户名为空或 `X=X` 为真，且密码为空或 `X=X` 为真，则允许登录。如果你仔细思考一下，你会发现 `X` 总是等于\
  \ `X`，所以这永远为真。\n\n`‘OR X=X’` 并没有意义；它仅仅是一个永远为真的声明。攻击者会尝试其他类似的语句，例如：\n\n```\n‘ or\
  \ ‘a’ =’a\n‘ or ‘1’ =’1\n‘ or (1=1)\n```\n\n这里给出的示例是 SQL 注入最基础的版本，但也是最常见的。你可以利用\
  \ SQL 注入做更多事情。攻击者的局限仅在于其对 SQL 的知识以及目标数据库系统的了解。\n\n防御这种攻击的方法是在处理所有用户输入之前对其进行过滤。这个过程通常被称为`输入验证`，它可以防止攻击者输入\
  \ SQL 命令而非用户名和密码。遗憾的是，许多网站并不过滤用户输入，仍然容易受到 SQL 注入攻击。\n\n记得本文早些我们首次简要提到 SQL 注入时，曾建议过滤输入可以防止此类攻击。例如，创建网站的程序员应该编写代码，首先检查任何常见的\
  \ SQL 注入符号，如单引号（`‘`）、百分号（`%`）、等号（`=`）或安培符号（`&`），如果发现了这些符号，则停止处理并记录错误。这将防止许多 SQL\
  \ 注入攻击。虽然有方法绕过这些安全措施，但实施它们仍然可以许多 SQL 注入攻击。\n\n## 跨站脚本 (Cross-Site Scripting)\n\n\
  通过`跨站脚本`，攻击者向其他用户查看的网页中注入客户端脚本。关键在于攻击者将脚本输入到其他用户交互的区域中。当用户访问网站的该部分时，执行的是攻击者的脚本，而不是预期的网站功能。例如，假设一个购物网站允许用户评论产品。攻击者可能不是输入评论，而是输入\
  \ JavaScript，将用户重定向到钓鱼网站。当另一个用户查看该“评论”时，脚本执行并将用户带到新网站。同样，此类攻击可以通过简单过滤所有用户输入来防止。截至本文写作时，所有主要的在线购物门户（如\
  \ [Amazon.com](http://Amazon.com)）都会过滤输入，且不受这种攻击的影响。然而，许多较小的网站仍然容易受到跨站脚本攻击。\n\n\
  跨站脚本和 SQL 注入都说明了为什么让所有 IT 人员（而不仅仅是安全管理员）熟悉安全是至关重要的。如果有更多的 Web 开发者更熟悉安全，这两种攻击就不会泛滥存在。\n\
  \n## 跨站请求伪造 (Cross-Site Request Forgery)\n\n`跨站请求伪造`可以被看是跨站脚本的另一面。跨站脚本是基于用户对网站的信任来攻击用户，而跨站请求伪造是基于网站对用户的信任来攻击网站。经过网站身份验证的受信用户被欺骗向网站发送请求。这些请求随后可以被用于攻击该网站。\n\
  \n## 目录遍历 (Directory Traversal)\n\n`目录遍历`允许攻击者访问受限制的目录——包括包含应用程序源代码、配置文件和关键系统文件的目录——并在\
  \ Web 服务器根目录之外执行命令。\n\n攻击者可以操纵带有“点点斜线 (../)”序列及其变体的文件引用，如下例所示：\n\n[`www.example.com/process.aspx=../../../../somedir/some`](http://www.example.com/process.aspx=../../../../somedir/some)\
  \ 文件\n\n[`www.example.com/../../../../somedir/some`](http://www.example.com/../../../../somedir/some)\
  \ 文件\n\n## Cookie 毒化 (Cookie Poisoning)\n\n许多 Web 应用使用 Cookie 在客户端机器上保存信息（用户 ID、时间戳等）。例如，当用户登录网站时，登录脚本可能会验证用户名并设置\
  \ Cookie。\n\n当用户随后检查偏好设置时，另一个脚本会获取 Cookie 并显示用户记录。由于 Cookie 并不总是加密的，因此可以被修改；包含这种类型的攻击被称为`Cookie\
  \ 毒化`。事实上，JavaScript 可以修改、写入或读取 Cookie。这种攻击可以与跨站脚本结合。\n\n## URL 劫持 (URL Hijacking)\n\
  \n`URL 劫持`也称为`域名欺骗`，涉及一个与真实 URL 非常相似的假 URL。例如，我的网站是 [www.Chucktom.com](http://www.Chucktom.com)。有人可能设置了\
  \ [www.Chucksom.com](http://www.Chucksom.com)，最后一个字母只少了一个 t。\n\n## 命令注入 (Command\
  \ Injection)\n\n这种攻击旨在向应用程序中注入并执行攻击者指定的命令。命令注入发生是因为缺乏正确的输入数据验证，这些也可以被攻击者操纵（表单、Cookie、HTTP\
  \ 头等）。例如，在 Linux 中，你可以通过输入一个命令来执行两个命令：`cmd1 && cmd2`。因此，漏洞程序可能会执行 `[www.google.com](http://www.google.com)\
  \ && cat /etc/passwd`。有时命令注入也被称为 Shell 。\n\n## 无线攻击 (Wireless Attacks)\n\n有很多常用的无线攻击。例如，在`双生攻击点攻击`中，会设置一个与你的合法接入点\
  \ SSID 相同的非法无线接入点 (WAP)。该非法 WAP 可能被用于对你的合法接入点发起拒绝服务攻击，使其无法响应用户，从而将用户重定向到双生攻击点。\n\
  \n另一种无线攻击是 WPS 攻击。Wi-Fi 保护设置 (WPS) 需要 PIN 码才能连接 WAP。WPS 攻击尝试在传输中拦截该 PIN，连接 WAP，然后窃取\
  \ WPA2 密码。\n\n取消认证攻击可以导致合法的无线客户端从合法的无线 AP 或无线路由器取消认证，以实施拒绝服务状态，或使这些客户端连接到双生攻击点。\n\
  \n## 手机攻击 (Cell Phone Attacks)\n\n攻击手机的方法有很多；这里简要描述了更常见的攻击。\n\n▪ **蓝牙窃取 (Bluesnarfing):**\
  \ 未经授权访问蓝牙设备的信息。\n\n\n\n\n\n- **蓝光劫持 (Blue jacking)**：利用范围内的另一个蓝牙设备（取决于蓝牙版本，范围可能是\
  \ 10 到 240 米）并向目标发送未经请求的信息的过程。\n- **蓝虫漏洞攻击 (Bluebugging)**：与蓝光窃取（bluesnarfing）类似，蓝虫攻击可以访问并使用手机的所有功能。\n\
  - **iPod 吸取 (Pod slurping)**：使用如 iPod 等设备，通过直接插入存有数据的计算机来非法获取机密数据。\n\n## 密码破解\n\n\
  当能够实际接触到机器时，进行密码破解是最简单的。这听起来并没有那么困难。许多机构（如大学）都设有自助终端，用户可以使用最小权限/访客权限使用该系统。熟练的黑客可以利用这种访问获取更高级别的权限。\n\
  \n### OphCrack\n\n一种破解 Windows 密码的流行工具是 `OphCrack`。可以 [`ophcrack.sourceforge.net`](http://ophcrack.sourceforge.net)\
  \ 下载 `OphCrack`。它基于对 Windows 密码工作原理的理解。Windows 密码存储在系统目录之一的哈希文件中，通常是 `C:\\WINDOWS\\\
  system32\\config\\` 中的 SAM 文件。SAM 是安全账户管理器（Security Accounts Manager）的缩写。密码以哈希形式存储。（哈希将在第\
  \ 8 章“加密”中详细讨论。）Windows 的做法是你输入的密码进行哈希处理，并与 SAM 文件中找到哈希进行比较。如果匹配，则登录成功。为了防止有人复制\
  \ SAM 文件并带走尝试暴力破解，Windows 一开始启动过程，操作系统就会锁定 SAM 文件。`OphCrack` 的做法是启动到 Linux，然后获取\
  \ SAM 文件，并在它有的大型哈希值表中查找哈希密码以寻找匹配项。如果找到了，该哈希值表中的匹配文本就是密码。你可以在图 6.8 中看到 `OphCrack`。\n\
  \n![Description: 截图显示了 Ophcrack.](img/06fig08.jpg)\n\n**图 6.8** *OphCrack。*\n\n\
  这个工具非常易用。只需将 `OphCrack` 光盘放入机器并重启。在启动过程中，你可以按 `F12` 进入启动菜单，并告诉系统从光盘启动。然后你将启动 `OphCrack`。需要注意的是，较长的密码（截至本文编写，超过\
  \ 10 个字符）通常无法被 `OphCrack` 破解。\n\n假设 `OphCrack` 破解成功（它并不总是成功的），攻击者可以用此做什么呢？最好的情况下，她只是获取了本地机器管理员账户，而不是域账户。嗯，这可以用来进一步获取域访问权限。一种简单的技术是创建一个脚本，转而创建一个域管理员账户。脚本非常简单：\n\
  \n```\nnet user /domain /add localaccountname password\nnet group /domain “Domain\
  \ Admins” /add localaccount\n```\n\n显然，如果攻击者执行此脚本，它将不起作用。用户必须是域管理员才能生效。因此，攻击者将此脚本保存到“所有用户”启动文件夹中。下一次当域管理员登录到此系统时，脚本将成功执行。但攻击者可能不想等到这种情况的发生。为了加速过程，攻击者会在系统中制造一些小问题（更改设置、修改配置等）。在许多机构中，技术支持人员都在域管理员组中。当技术支持人员登录到系统修复问题时，脚本将成功运行。\n\
  \n密码破解有几种不同的方法。这里列出了更常见的方法：\n\n- **字典攻击 (Dictionary attacks)**：将充满字典单词的文本文件加载到密码破解程序中，然后针对应用程序定位的用户账户运行。\n\
  - **混合攻击 (Hybrid attacks)**：与字典攻击类似，混合攻击是在单词中添加数字或符号。\n- **彩虹表 (Rainbow Table)**：密码通常存储为哈希。哈希无法被“还原”，但可以使用彩虹表进行匹配。\n\
  - **暴力破解 (Brute-force attacks)**：最全面的攻击形式，取决于长度和复杂度。正如你所猜的，互联网上有很多这样的工具：\n\n- **Brutus**：可以攻击\
  \ Telnet、FTP、SMTP 服务器。\n- **John the Ripper**：该工具已存在多年。这是一个有效的密码破解工具。\n- **WebCracker**：一种使用用户名和密码的简单工具。\n\
  - **THC-Hydra**：攻击常见身份验证方案的工具。\n- **Crack Station**：一个匹配哈希的网站 [`crackstation.net/`](https://crackstation.net/)\n\
  \n\n\n\n\n网络武器的泛滥是本章本节内容的主要原因。安全专业人员（或志成为安全专业人员的人）必须意识到创建一个病毒是多么简单，这至关重要。这意味着我们应该合理预期随着时间的推移会看到更多的病毒。当然，仍然存在定制编写的病毒，而这些实际上是最高效的恶意形式。但工具和源代码的泛滥意味着即使是只有极少技术技能的人也能创建病毒。\n\
  \n## Windows 攻击技术\n\n鉴于 Microsoft Windows 的无处不在，存在大量针对该操作系统的攻击并不令人感到意外。在本节中，我们将简要查看其中的一些攻击。\n\
  \n### 传递哈希值攻击 (Pass the Hash)\n\n我们将在第 8 章中详细研究加密哈希值。现在，只需接受许多系统以加密哈希的形式存储密码即可。这样做是因为对某些内容进行“反哈希”是不可能的。\n\
  \n传递哈希值攻击本质上是意识到哈希值无法被反转；攻击者并不尝试寻找密码是什么，而是直接发送哈希值。如果攻击者可以获取哈希值，就可以在不知道实际密码的情况下利用该哈希值。Windows\
  \ 应用程序要求用户输入密码；然后它们将其哈希化。通常可以使用 `LsaLogonUser` 等 API 实现，将密码转换为 LM 哈希或 NT 哈希。传递哈希绕过了应用程序，直接发送哈希值。\n\
  \n### Net 脚本攻击 (Net User Script)\n\n这种特定的利用方法首先需要访客级权限访问目标机器。它基于许多组织将技术支持人员放入域管理员组的事实。\n\
  \n攻击者编写以下两行脚本（显然 `localaccountname` 被替换为实际的账户名称）：\n\n```\nnet user /domain /add\
  \ localaccountname password\nnet group /domain “Domain Admins” /add\n```\n\n攻击者将此脚本保存在用户启动文件夹中。下次具有域管理员权限的用户登录时，该脚本将执行，`localaccountname`\
  \ 现在将成为域管理员。唯一的问题是，在此类权限的用户登录该机器之前可能要等一段时间。为了加速过程，攻击者会让系统出现一个需要技术支持修复的问题，例如禁用网卡。下一个登录的用户将无法访问网络或互联网，并会联系技术支持。技术支持人员很有可能是域管理员组的成员。当该人员登录计算机修复问题时，在他们不知情的情况下，脚本将执行。\n\
  \n这种特定的利用说明了两个不同的安全问题。第一个是最小权限原则，即仅允许用户拥有完成其工作所需的最小权限。（这一概念在第 1 章“计算机安全简介(#ch01.xhtml#ch01)”中简要讨论过。）技术支持人员不应该是域管理员，如果不是，`net\
  \ user` 脚本攻击将无法成功。\n\n第二个问题是对任何机器的访问都应该受到控制。这种利用只需要攻击者拥有访客级访问，且仅如此。\n\n### 以系统登录\
  \ (Login as System)\n\n`login as system` 攻击是一种用于获取 Windows 提升权限的技术。这通常通过利用运行在 `SYSTEM`\
  \ 帐户下的服务来实现。如果攻击者可以操纵服务执行其自己的恶意二进制文件，他们就可以获得系统上最高权限的代码。\n\n\n\n\n\n国家安全局（NSA）主要负责美国联邦政府范围内的信息安全工作。NSA\
  \ 制定了一套方法论，适用于任何信息系统评估，包括安全审计、漏洞测试和渗透测试。该方法论简要描述如下：\n\n## 评估前\n- 确定并管理客户预期。\n- 了解组织的信息关键性。\n\
  - 确定客户的目标和目的。\n- 确定系统边界。\n- 与客户进行协调。\n- 请求文档。\n\n## 现场评估\n- 召开启动会议。\n- 收集并验证系统信息（通过访谈、系统演示和文档审查）。\n\
  - 分析评估信息。\n- 制定初步建议。\n- 进行简要汇报（out-brief）。\n\n## 评估后\n- 对文档进行额外审查。\n- 寻求帮助理解所学内容。\n\
  - 报告协调（及编写）。\n\n这一特定的步骤总结非常有意思。管理客户预期至关重要的一步。让客户了解渗透测试可以做什么和不能做什么是非常重要的。评估前阶段的核心在于决定要做什么以及预期是什么。\n\
  \n现场评估包括检查系统的过程，并涉及通过简要汇报让客户了解你发现的本质。随后，在第三阶段通过编写和交付报告来告终。同样值得注意的是，在最后阶段有一个一个涉及获取额外专业知识的子步骤。如果你的渗透测试或安全审计发现了超出你专业范围的项目，那么咨询该领域的专家是明智之举。\n\
  \n## PCI 渗透测试标准\n支付卡行业数据安全标准（PCI DSS）是处理信用卡的公司使用的一系列标准。我们将在第 10 章“安全策略”中泛介绍 PCI\
  \ 标准。在本节中，我们将简要检查这些标准中的渗透测试部分。PCI DSS 要求 11.3.4 要求进行渗透测试，以验证分段控制和方法运行正常且有效，并确保它们将所有范围之外的系统与持卡数据环境中的系统隔离开。\n\
  \nPCI 标准建议在正常业务时间内测试独立环境，而不是实时生产环境。建议渗透测试应包含社交工程测试。\n\n根据 PCI DSS 要求 11.3.1 和 11.3.2，渗透测试必须至少每年一次，并在发生任何重大变更后（例如基础设施或应用程序的升级或修改）或安装新系统组件后进行。与我们检查之前的模型一样，PCI\
  \ DSS 有一些特定的步骤：\n\n- **参与前：** 定义范围、文档、参与规则、成功标准，并回顾过去的问题。\n- **实际渗透测试：** 应用黑客技术。\n\
  - **参与后：** 编写报告并建议修复措施。\n\n记住这些标准并不是关键的。重点在于理解渗透测试中利用了黑客技术，但渗透测试不仅仅是随机尝试攻击目标网络。它是一种验证目标网络安全性的方法论方法，恰好包含了真实的黑客技术。\n\
  \n本书旨在介绍计算机安全，并不详细阐述渗透测试。如需更多细节，你可能希望考虑 Pearson 出版的《渗透测试基础：可靠安全审计的实践指南》（*Penetration\
  \ Testing Fundamentals: A Hands-On Guide to Reliable Security Audits*）。\n\n## 暗网\n\
  暗网是互联网的一个区域，只能通过洋葱路由（onion routing）访问。`Onion routing` 本上是将数据包在全球范围内路由，通过代理服务器进行跳转。每个数据包都经过多层加密，每个代理只能解密其中一层，并将数据包发送到下一个代理。如果有人在两个代理之间的传输过程中拦截了数据包，你只能确定上一个代理和下一个代理。你无法确定实际的源或目的地。这在图\
  \ 6.10 中所示。\n\n![Description: 一幅图说明了数据如何从用户机器传输到目标网站。](img/06fig10.jpg)\n\n**图 6.10**\
  \ *TOR.*\n\n这导致了用户的位置很难确定。例如，我曾在坐在德克萨斯州普拉诺的家里时，使用 `TOR` 浏览器访问 [Yahoo.com](http://Yahoo.com)。在图\
  \ 6.11 中你可以看到。\n\n![Description: 使用 TOR 的概念。](img/06fig11.jpg)\n\n**图 6.11** *Yahoo.*\n\
  \n`TOR`提供的匿名性本身没错。然而，许多人并不希望被监控。浏览暗网可能会危险。因此，你必须为暗网建立一个特定的环境——一个与主机完全隔离的虚拟机（这意味着不共享剪贴板或文件夹）。虚拟机最好运行与主机不同的操作系统，这使得跨越虚拟机/主机的障碍变得更加困难。最后，该虚拟机应仅用于暗网，不再用于其他用途。许多暗网调查员喜欢使用遗忘匿名现场系统（`TAILS`）来浏览暗网。它可以从\
  \ `https://tails.org/`](https://tails.org/) 免费下载。\n\n你应该注意，`TOR` 已更新为使用 `Onion v3`。许多网站正在将地址迁移到\
  \ `Onion v3`。到 2021 年 10 月 15 日，所有 `Onion v2` 站点将在 `TOR` 浏览器中禁用。如果你有 2022 年之前的链接，它们可能不再能够工作。\n\
  \n\n\n\n\n## 最新新闻\n\n* 2022 年 4 月，佛罗里达州坦帕的一名女子因暗网受雇杀人被判处 6 年监 [`www.tampabay.com/news/tampa/2022/04/20/tampa-woman-gets-6-years-in-prison-for-dark-web-murder-for-hire/`](https://www.tampabay.com/news/tampa/2022/04/20/tampa-woman-gets-6-years-in-prison-for-dark-web-murder-for-hire/)\n\
  * 2022 年 5 月，在暗网上购买儿童色情内容的男男子被判入监狱 [`www.justice.gov/usao-ndia/pr/man-who-obtained-infant-pornography-dark-web-sentenced-federal-prison`](https://www.justice.gov/usao-ndia/pr/man-who-obtained-infant-pornography-dark-web-sentenced-federal-prison)\n\
  \n# 了解暗网节点\n\n对于想要获取暗网更多技术信息的读者来说，最重要的就是理解节点。这里是对各种节点的描述：\n\n1. **入口节点 (Entry node)**：它是流量进入\
  \ `tor` 网络的第一个节点。任何代理节点都可以作为入口节点。入口节点和中继节点的功能没有区别；但从用户的角度来看是有区别的。入口节点拥有用户真实身份的节点。这就是入口节点掌握的知识范围。入口节点只知道用户的身份和下一个节点的信息。由于完全前向秘密（Perfect\
  \ Forward Secrecy），它不知道目的地。\n\n2. **中继节点 (Relay node)**：中继节点接受 `tor` 连接，去掉完全前向秘密的额外层，并将连接转发到前向链中的下一个节点。默认配置在\
  \ `tor` 线路的中间只设置了一个节点，但如果你愿意，可以增加节点的数量。请注意，中间节点数量越多，连接的延迟就越大。\n\n3. **出口节点 (Exit\
  \ node)**：最后一种类型的节点。它是与目的地进行通信的节点。同样，这个节点与其他两个节点没有区别。但由于它与目标服务器通信并将流量转发出 `tor` 网络，它在目标服务器看来就是源头。正因如此，出口节点因其在\
  \ `tor` 网络中的活动而被指责。出口节点总是调查人员的目标。出口节点的所有必须反复提供解释来证明其服务器合法性。\n\n4. **公告中继节点 (Advertised\
  \ Relay nodes)**：这些节点被称为公告节点，因为它们列在目录服务器中。这些是通过维护完全前向秘密来帮助 `tor` 网络匿名化的真实节点。任何人都可以像使用\
  \ `tor` 浏览器一样通过查询查看这些节点的身份。\n\n5. **桥节点 (Bridge nodes)**：桥节点与其他任何节点一样，区别在于它们是不公开的，这意味着桥节点没有列在目录服务器中。你可能会问，如果桥节点没有列在目录服务器中，它们的作用是什么？主要目的是为了躲避政府机构和网络防火墙，正如你所知，`TOR`\
  \ 节点经常因为在 `TOR` 网络中的活动而被安全机构指责。而且由于 `TOR` 节点的身份在目录服务器上公开，它们很容易被封。桥节点用于绕过封。如果桥节点作为入口节点，很难在防火墙上发现并拦截流量，因为它们没有在\
  \ `TOR` 目录服务器列表中。然而，将桥节点作为入口节点的主要挑战是，必须有人了解活跃的桥服务器，并且必须在 `tor` 浏览器上手动配置。\n\n你可以在许多网站上找到出口节点列表。以下是其中几个：\n\
  \n* [`www.dan.me.uk/tornodes`](https://www.dan.me.uk/tornodes)\n* [`check.torproject.org/cgi-bin/TorBulkExitList.py?ip=1.1.1.1`](https://check.torproject.org/cgi-bin/TorBulkExitList.py?ip=1.1.1.1)\n\
  * [`torstatus.blutmagie.de/`](https://torstatus.blutmagie.de/) 该网站有额外数据\n* [`www.bigdatacloud.com/insights/tor-exit-nodes`](https://www.bigdatacloud.com/insights/tor-exit-nodes)\n\
  \n## 总结\n\n在本章中，我们研究了一些安全技术。我们强调了为什么安全很重要以及为什么渗透是可能的。\n\n### 测试你的技能\n\n#### 多选题\n\
  \n1. Elizabeth 正在使用电脑。SQL 注入需要什么？\n2. Juan 正在探索密码破解。彩虹表（rainbow table）的最好描述是什么？\n\
  3. 你负责安全工作。你如何防止跨站脚本攻击？\n4. `Nessus` [`www.archive.org`](https://www.archive.org)\
  \ 的优势是什么？\n\n等等，`Nessus` 的优势是什么？\nA. 它对企业来说是免费的。\nB. 它可以检查广泛的漏洞。\nC. 它是为 Windows\
  \ 设计的。\nD. 它包含一个 IDS（入侵检测系统）。\n\n\n\n\n\nC. 初学者\nD. 白帽黑客\n\n[12]. 尝试列出网络上所有服务器的过程称呼为什么什么？\n\
  \nA. 端口扫描\nB. 枚举 (Enumeration)\nC. 漏洞扫描\nD. 侦察 (Scouting)\n\n[13]. Terrance 正在进行扫描。Windows\
  \ 机器对 `FIN` 扫描会给出什么响应？\n\nA. ACK\nB. 无响应\nC. SYN\nD. RST\n\n[14]. Jaron 正在尝试对自己的公司进行端口扫描。他想测试公司的安全系统是否能检测到他的扫描。以下哪项被认为是最隐蔽的端口扫描？\n\
  \nA. SYN\nB. 连接 (Connect)\nC. Ping\nD. `Nmap`\n\n[15]. 找出网站运行的是什么类型的服务器最隐蔽的方法是什么？\n\
  \nA. 使用 `Nmap`。\nB. 使用 `Cain and Abel`。\nC. 使用 [www.netcraft.com](http://www.netcraft.com)。\n\
  D. 使用 [www.archive.org](http://www.archive.org)。\n\n### 练习\n\n练习 6.1: 使用 [www.archive.org](http://www.archive.org)\n\
  \n此练习让你练习使用 `www.archive.org`。访问 `www.archive.org` 并调出你所在学院/大学网站的至少两个之前的版本。你能找到哪些不再出现在该网站上的信息？\n\
  \n练习 6.2: 使用 `Nmap`\n\n此练习将向你介绍 `Nmap` 工具。你应该下载并安装 `Nmap`。然后在你自己的电脑或指定的实验台电脑上运行至少三种不同的扫描。（虽然扫描计算机并不违法，但它可能会违反某些大学的安全策略。请确保你只扫描指定的实验台电脑。）\n\
  \n练习 6.3: 使用 `ophcrack`\n\n将 `ophcrack` 下载到 CD 盘中。然后重启你的机器并进入 `ophcrack` CD 盘，并尝试破解自己的本地密码。（至关重要的一点是，只能在自己的机器或指定的实验室机器上进行操作。在其他机器上这样做可能会违反你所在学院/大学/公司的安全策略。）\n\
  \n练习 6.4: 使用 [Netcraft.com](http://Netcraft.com)\n\n访问 `www.netcraft.com` 并对你选择的至少三个不同的网站进行搜索。注意你能够从每个网站收集到哪些信息。\n\
  \n### 项目\n\n项目 6.1: 被动侦察 (Passive Reconnaissance)\n\n选择一个本地组织并对其进行被动侦察。这应该包括搜索招聘板、该组织自己的网站、用户组/公告板、社交网络网站、[www.archive.org](http://www.archive.org)\
  \ 等。尽可能地收集关于目标网络的信息。\n\n项目 6.2: 端口扫描器\n\n使用你最喜欢的搜索引擎找到除 `Nmap` 之外的至少两个端口扫描器。下载并安装它们，然后在你自己的机器或指定的实验台电脑上尝试它们。将这些工具与\
  \ `Nmap` 进行对比。它们更容易用吗？提供的信息更多吗？\n\n项目 6.3: MBSA\n\n下载并安装 `MBSA`，并在你自己的电脑或指定的实验台电脑上运行漏洞扫描。你发现了哪些问题？该工具好用吗？\n\
  \n## 案例研究\n\nJane 是一个打算闯入 XYZ 公司的黑客。她使用了多种被动侦察技术，并收集了关于该公司的大量信息。Jane 从用户组中网络管理员的提问/评论中发现了公司使用的路由器型号。她从公司网站的人员目录找到了一份完整的\
  \ IT 员工名单及其电话。她还通过端口扫描发现了正在运行的服务。\n\n基于此场景，请考虑以下问题：\n\n1. 公司可以采取哪些合理措施来防止 Jane 发现路由器型号和其他公司硬件？\n\
  2. 公司应该采取哪些步骤来防止或至少减少端口扫描的效力？\n\n# 第 7 章：网络空间中的工业间谍\n\n### 章节目标\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\
  \n- 理解工业间谍的含义\n- 解释工业间谍活动的危害\n- 理解用于尝试工业间谍行为的低技术方法\n- 意识到间谍软件如何用于间谍活动\n- 了解如何保护系统免受间谍侵害\n\
  \n### 引言\n\n间谍活动不仅限于国家。公司拥有价值巨大的知识产权。无论是商业秘密、营销数据还是待处理的财务交易，这些数据都可能非常有价值。这就引入了工业间谍的话题。当你听到\
  \ `espionage` 这个词时，也许你脑中会浮现许多兴奋且华丽的画面。也许你想象一个西装革履、喝着马天尼酒（摇匀而非搅拌）的男人，与同样华丽的同伴旅行于华华的地方。或者，你可能想象了在遥远异国土地上进行的带有高速追逐和枪火横飞的精彩秘密行动。间谍活动通常比这些流行媒体描写要枯燥得多。间谍活动的最终目标是获取原本无法获得的信息。通常，间谍活动越不张扬越好。相反，信息才是目标，激烈的枪战和华丽的地点是不可能的，并且会导致不必要的关注。如果可能，最好在目标组织尚未意识到其信息已泄露的情况下获取这些信息。\n\
  \n有些人认为这种监探仅由政府、情报机构（如 `CIA`、`NSA`、`MI6`、`FSB` 等）以及恶性国际组织（如“基地组织”或“ISIS”）从事。虽然这些实体确实从事间谍活动，但它们绝不是唯一的此类活动组织。上述组织是为了政治和军事目标获取信息。如前所述，公司可能拥有价值的信息。由于涉及数十亿美元，私人公司可能成为工业间谍的目标或实施者。哪有公司不想确切知道竞争对手在做什么？事实上，企业间谍活动正在增加。\n\
  \n工业间谍与情报机构活动之间的界限正变得模糊。针对西方国家的工业间谍案例有很多，至少得到了外国情报部门的支持。科技公司经常是此类攻击的目标。事实上，已经有多次针对公司的国家行为者的警告。2022\
  \ 年 5 月，《纽约法律杂志》¹ 发表了一篇关于国家行为者利用网络攻击获取公司敏感信息的文章。\n\n[¹]: [`www.law.com/newyorklawjournal/2022/05/06/%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%ADnation-state-sponsored-attacks-not-your-grandfathers-cyber-attacks/?slreturn=20220626171326`](https://www.law.com/newyorklawjournal/2022/05/06/%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%AD%C2%ADnation-state-sponsored-attacks-not-your-grandfathers-cyber-attacks/?slreturn=20220626171326)\n\
  \n\n\n\n虽然大多数专家认为企业间谍活动是一个严重的问题，但评估其严重程度可能困难。实施企业间谍活动的公司不会出于显而易见的原因分享其行为事实。而此类间谍活动的受害者公司通常也不愿透露这一事实。承认其安全性遭到破坏可能会对其股票价值产生负面影响。在某些情况下，这种安全漏洞可能导致公司面临来自数据可能已泄露的客户的赔偿请求。而在某些情况下，受害者可能根本没有意识到泄露的发生。由于这些原因，公司通常对披露任何工业间谍活动非常迟疑。由于你想保护自己和你的公司，学习间谍手段和防护措施至关重要。在本章末的练习中，你将使用到本书为止学过的一些工具——反间谍软件、键盘记录器和屏幕截取软件——以便学习它们是如何运作的，从而意识到它们所构成的风险。\n\
  \n2022 年 5 月，来自密歇根州兰斯辛的尤小荣（Xiaorong You）因合谋窃取商业秘密、经济间谍、电信诈骗等指控被定罪。在该案中，涉及的秘密是饮料罐内部涂层的配方。尤女士被指控窃取这些秘密以便在中国建立一家新公司^([2])。2019\
  \ 年，《福布》发表了一篇关于苹果公司（Apple Inc.）间谍事件的文章^([3])。在这篇文章研究的案例中，企业间谍与国家支持的间谍活动之间的界限非常模糊。在其中一个案例中，苹果员工陈志忠（Jizhong\
  \ Chen）被指控窃取与自动驾驶相关的商业秘密并提供给中国政府。同一文章估计企业间谍活动的成本每年 1.1 亿美元。\n\n[²]: [`www.justice.gov/opa/pr/chemist-sentenced-stealing-trade-secrets-economic-espionage-and-wire-fraud`](https://www.justice.gov/opa/pr/chemist-sentenced-stealing-trade-secrets-economic-espionage-and-wire-fraud)\n\
  \n[³]: [`www.forbes.com/sites/betsyatkins/2019/02/12/learning-from-apples-spying-incidents-how-to-protect-your-company-from-corporate-espionage/#54d18f7d6fb4`](https://www.forbes.com/sites/betsyatkins/2019/02/12/learning-from-apples-spying-incidents-how-to-protect-your-company-from-corporate-espionage/#54d18f7d6fb4)\n\
  \n这是一个全球性问题。2021 年，瑞典一家法院判处克里斯蒂安·米特里夫斯基（Kristian Dimitrievski）从卡车和巴士制造商斯堪尼亚（Scania）偷取机密信息，并将其卖给一名俄罗斯外交官^([4])。\n\
  \n[⁴]: [https://apnews.com/article/europe-business-russia-espionage-stockholm-9cbf938ce9dca9a7cffb8c30be29f857]\n\
  \n### 什么是工业间谍？\n\n`Industrial espionage` 利用间谍技术获取具有经济价值的关键信息。此类数据可能包括竞争对手新项目的细节、竞争对手的客户名单、研究数据或任何为间谍组织提供经济优势的信息。虽然企业间谍活动的动机与军事间谍活动的动机不同，但企业间谍活动往往涉及情报机构所使用的相同技术，例如监控、复印文件或渗透目标组织的成员。经济间谍活动不仅使用与情报机构相同的技术，通常还使用相同的人员。已经发生了多次事件，前情报特员被发现从事企业间谍活动。当这些人将他们的技能和训练带入企业间谍领域时，计算机安全专家面临的情况将变得格外棘手。\n\
  \n#### 实践\n\n##### 带走敏感数据\n\n尽管各种计算机专家和政府机构试图估计企业间谍活动的影响和范围，但其本质使得准确估计变得不可能。不仅犯罪者不愿披露其犯罪行为，受害者通常也不愿披露事件。然而，轶事证据表明，最常见的间谍形式仅仅是员工辞职、加入另一家公司，并在离开第一公司时带有敏感数据。在许多情况下，这些员工选择公司内部易获取的数据，因此这些数据的机密性被认为是一个`灰色地带`。例如，销售人员可能会带走联系人和和客户的打印列表，以便代表新雇主招揽他们。\n\
  \n与所有员工签署措辞非常严谨的保密和竞业协议至关重要。最好聘请劳动律师来起草这份协议。此外，你可能考虑在终止雇关系之前限制员工对数据的访问。你还应该进行离职面试，并考虑没收电话簿等物品。\n\
  \n### 信息作为资产\n\n很多人习惯于将实物视为资产，但很难理解信息也可以是资产。公司每年在研发上花费数十亿美元。所发现的信息价值至少等于获取这些信息所消耗的资源加上其产生的经济收益。例如，如果一家公司花费\
  \ 200,000 美元研究一种程后能反过来产生 100 万美元收入的工艺，那么这些数据价值至少为 120 万美元。你可以将这种经济收益视为一个简单的方程：\n\
  \n`VI = C + VG`\n\n虽然还没有人完全意识到这一概念，但数据确实代表了有价值的资产。当我们谈论“信息时代”或我们的“信息驱动经济”时，意识到这些术语不仅仅是口号是非常重要的。信息是一种真实的商品。它与公司拥有的任何其他物品一样，都是经济资产。事实上，大多数情况下，公司计算机中数据的价值远高于计算机系统本身的硬件和软件。可以肯定，数据比计算机硬件和软件难替换得多。\n\
  \n为了真正理解信息作为商品的概念，请考虑获得大学学位的过程。你花了 4 年坐在不同的教室里。你支付了大量的金钱来获得坐在那些教室里并听别人对各种话题进行长篇大论的权利。4\
  \ 年后，你收到的实物产品只有一张纸。显然，你可以花更低的成本和更少的精力获得一张纸。你实际支付的费用是为了你获得的信息。许多职业的价值也是如此。医生、律师、工程师、顾问、经理等所有人都是为了他们的专业信息而寻求咨询的。信息本身就是有价值的商品。\n\
  \n\n\n\n存储在计算机系统中的数据具有高价值，原因有二：首先，创建和分析这些数据投入了大量的时间和精力。如果你带领一个五人的团队花费 6 个月来收集和分析信息，那么这些信息的价值至少相当于这些人在这段时间内的工资和福利总和。其次，除了获取这些事实所需的时间和精力外，数据往往具有内在价值。如果这些事实涉及专利工艺、发明或算法，那么其价值是显而易见的。然而，任何可能提供竞争优势的数据都具有内在价值。例如，保险公司经常聘用统计学家和精算师团队，利用最新技术试图预测与任何潜在被保险群体相关的风险。产生的统计信息对竞争保险公司来说可能非常有价值。即使是客户联系名单也具有某种内在价值。\n\
  \n因此，当你从事计算机安全工作时，务要记住，任何可能具有经济价值的数据都是组织的资产，这些数据对于任何可能对间谍活动没有道德抑制的竞争对手来说，都是极人的目标。如果你们的管理层认为这种威胁不是真实的，那么他们就大错错了。任何公司都可能是企业间谍活动的潜在受害者。你应该采取措施保护你的贵贵信息——而这一过程中的第一个关键步骤就是资产识别。\n\
  \n### 资产识别\n\n`Asset identification` 是列出你认为支持你组织的资产的过程。此列表应该包括影响直接日常运营的物品，也包括与你公司的服务或产品相关的物品。CERT\
  \ 网站提供了一份非常有用的工作表，你可以用它列出组织中的资产^(5)。该工作簿包含了许多其他实用工作表，用于确保你组织的信息安全。如图 7.1 目录所示，该工作簿还是一份教程，引导你考虑信息安全中的各种因素。\n\
  \n^(5) [`www.us-cert.gov/sites/default/files/c3vp/crr\\_resources\\_guides/CRR\\\
  _Resource\\_Guide-AM.pdf`](https://www.us-cert.gov/sites/default/files/c3vp/crr_resources_guides/CRR_Resource_Guide-AM.pdf)\n\
  \n![Description: 一图显示了 CERT 补充资源指南的目录。目录列出了所有项目，包括书中所有的页码。列出的标题包括引言、资产管理、资产管理计划和识别资产。](img/07fig01.jpg)\n\
  \n**图 7.1** *来自 CERT 补充资源指南的目录。*\n\n表 7.1 是 CERT 提供的工作表的变体。利用此表，并根据你对公司的知识和经验，你可以按照下面列出的步骤完成资产识别：**\n\
  \n**表 7.1** *资产识别工作表*\n\n![Images](img/07tab01.jpg)\n\n### 第 1 步\n在表格的第一列中列出信息资产。你应该列出公司内人员所使用的信息类型——即人们完成工作所需的信息。例如：产品设计、软件程序、系统设计、文档、客户订单和人员数据。\n\
  \n### 第 2 步\n对于第一列中的每个条目，在第二列中填写信息所所在的系统名称。在每情况下，问问自己人们执行工作需要哪些系统。\n\n### 第 3 步\n\
  对于第一列中的每个条目，在第三列中填写相关应用程序和服务的名称。在每情况下，确定个人执行工作需要哪些应用程序或服务。\n\n### 第 4 步\n在最后一列中，列出任何可能与前三列直接或不直接相关的其他资产。例如：包含客户信息的数据库、生产使用的系统、用于编写文档的文字处理器、程序员使用的编译器以及人力资源系统。\n\
  \n一旦你完成这些步骤并填写表 7.1，你将对组织的关键资产有良好的理解。有了这些信息，你将知道如何最好地投入防御工作。本章后面将检查某些具体的保护措施。\n\n\
  ## 工业间谍活动的真实世界案例\n\n现在你已经接触了企业间谍活动的概念，让我们来看五个真实案例。这些案例研究是来自各种新闻来源的真实世界间谍活动。这部分应该让你对实际上发生了哪些类型的间谍活动有一个概念。请注意，虽然这些案例有些旧，但它们确实说明了工业间谍手段。而且通常情况下，工业间谍事件的细节直到多年以后才会显露，甚至根本不会显露。\n\
  \n### 案例 1：黑客组织\n\n网络攻击经常被用于企业间谍活动。从至少 2018 年 11 月直到 2021 年，黑客组织 `RedCurl` 与针对英国、德国、加拿大、挪威、俄罗斯和乌克兰公司的\
  \ 30 次独立攻击有关。该组织倾向于使用他们自己开发的恶意软件和社交工程来获取敏感数据。\n\n### 案例 2：公司对公司\n\n2021 年 11 月，菲亚特克莱斯勒（Fiat\
  \ Chrysler Automobiles）指控通用汽车（GM）从事企业间谍活动。菲亚特克莱斯勒指控通用冒充前员工。通用反过来指控菲亚特克莱斯勒参与贿赂和其他计划。这两家公司正处于多起诉讼中。\n\
  \n### 案例 3：核秘密\n\n2017 年 8 月，台裔美国工程师 `Allen Ho` 因向中国国有企业中国通用电力`CGNPC`）提供核技术信息被判处\
  \ 2 年监禁。根据起诉书，入籍美国的 Allen Ho 利用其位于特拉华州德威尔明顿的公司 `Energy Technology International`，从美国核电开发商（包括田纳西河管理局）处收集核材料生产信息，并传递给\
  \ `CGNPC`。\n\n### 案例 4：优步（Uber）\n\n2017 年，由于 `Uber Technologies Inc.` 支付了 `700 万美元`\
  \ 来隐藏一项涉嫌的企业间谍计划。该计划据称包括窃听、黑客攻击、贿赂以及使用前情报人员，Uber 的工业间谍团队命名为 `Threat Operations Unit`。Uber\
  \ 前员工 `Richard Jacob` 的律师在法庭上披露了这些信息。这些信息是在一起诉讼中披露的，Uber 的竞争对手 `Waymo` 指控 Uber 前员工\
  \ `Anthony Levandowsky` 偷取了 1.4 万份机密文件并利用其支持 Uber 的自动驾驶计划。\n\n### 案例 5：外国政府与经济间谍\n\
  \n美国政府的国家反情报安全中心（`NCSC`）发布了一份 2018 年的报告《网络空间中的外国经济间谍活动》，详细说明了外国政府针对美国公司进行经济/工业间谍活动的多种方式。\n\
  \n\n\n\n\n报告中强调的一个领域是软件供应链的渗透。某些软件中的后门允许访问公司资源。报告还指出，某些国家（如中国）拥有法律，要求在中国经营业务的公司必须将其技术提交给中国政府进行安全审查。该报告指称，在某些情况下，这些审查是一个借口，目的是让中国公司获取西方公司的技术。\n\
  \n作为一个典型的案例，2022 年 4 月，项海涛（Xiang Haitao）在承认合谋从事经济间谍罪后被判刑(6)。他承认参与了将土壤养分应用相关软件交付给中国政府的计划。项海涛曾在孟山（Monsanto）担任科学家。该公司开发了旨在帮助提高农场生产力的软件。该软件包含一种专利预测算法，可帮助农民优化作物养分。\n\
  \n^(6) [`www.newsweek.com/chinese-spy-economic-espionage-stealing-trade-secrets-1696201`](https://www.newsweek.com/chinese-spy-economic-espionage-stealing-trade-secrets-1696201)\n\
  \n## 工业间谍活动的趋势\n\n虽然上述讨论的案例跨越多年，但问题并没有缓解。事实上，根据 CNN 的一份报告，2015 年工业间谍案件增加了 53%。联邦调查局（FBI）对\
  \ 165 家公司进行了调查，发现其中一半的公司曾是某种类型工业间谍活动的受害者。大量的工业间谍案件涉及内部人员威胁。\n\n## 工业间谍活动与你\n\n尽管存在这些工业间谍案例，大多数公司都会否认参与任何暗示间谍活动的行为。然而，并非所有公司对这个问题都如此回避。甲骨公司首席执行官拉里·埃里森（Larry\
  \ Ellison）公开为他聘请私人侦探筛选微软垃圾以获取信息的决定。显然，间谍活动不再仅仅是政府国防承包商的问题。它是现代商业世界中非常真实的担忧。敏锐的计算机安全人员会意识到这种担忧，并采取适当的主动措施。\n\
  \n## 间谍活动是如何发生的？\n\n间谍活动有两种方式。一种简单、低技术的途径是现任或前员工直接获取数据，或者通过使用社会工程方法（在第 3 章“网络跟踪、欺诈和滥用”中讨论过）从毫无防备的公司员工处提取数据。第二种更具技术性的方法是使用间谍软件，包括使用\
  \ Cookie 和键盘记录器。我们还将讨论其他技术方法。\n\n### 低技术工业间谍活动\n\n企业间谍活动可以在没有计算机或互联网的情况下发生。不满的前任（或现任）员工可以复制敏感文件、泄露公司策略和计划，或者可能披露敏感信息。事实上，无论使用的方法是否是技术性的，不满的员工都是任何组织最大的安全风险。如果员工愿意直接交出信息，公司间谍就不需要黑入系统即可获得敏感和机密信息。与军事和政治间谍活动一样，员工披露信息的动机各不相同。有些人为了显而易见的财务利益从事此类活动。另一些人可能因为对某些不公（真实的或想象的）感到愤怒而选择泄露公司秘密。无论动机是什么，任何组织都必须意识到他们有很多员工可能对某些状况不满，并具有披露机密信息的潜力。\n\
  \n当然，人们可以在没有现代技术的情况下获得信息；然而，计算机技术（以及各种计算机相关的策略）确实可以协助企业间谍活动，即使只是以辅助的方式。某些工业间谍活动是利用对实施者技能要求很低的技术进行的，如图\
  \ 7.2 和 7.3 所示。这种技术包括使用通用串行总线（USB）闪存、光盘（CD）或其他便携介质将信息带出组织。即使是想要破坏公司或为牟利的不满员工，也会发现将大量数据烧录到\
  \ CD 并装在口袋里带走比尝试复印数千份文件并偷出去要容易得多。而比普通钥匙扣还小的新的 USB 闪存，对于公司间谍来说是梦想成真。这些驱动器可以插入任何`USB`端口并存储海量数据。截至本文写作，人们可以轻松购买到能够存储\
  \ 1TB 或更多数据的小型便携设备。\n\n![Description: 一个坐在台式电脑工作的男人的照片。](img/07fig02.jpg)\n\n**图\
  \ 7.2** *低技术间谍活动很简单。*\n\n![Description: 一张显示光驱驱动器中光盘的照片。](img/07fig03.jpg)\n\n**图\
  \ 7.3** *低技术间谍活动是便携的。*\n\n虽然可以在不显性破解系统的情况下从你的公司获取信息，但你应该记住，如果你的系统没有安全防护，外部人员完全可能破解你的系统并在没有员工协助的情况下获取这些信息。除了这些方法外，还可以使用其他低技术甚至几乎是“无技术”的方法来提取信息。*社会工程学*在第\
  \ 3 章中详细讨论过，它是通过言语让某人交出她本不会披露的信息的过程。这种技术可以通过多种方式应用于工业间谍活动。\n\n社会工程学在工业活动中的第一个且最明显的用法是直接对话，实施者试图让目标透露敏感数据。如图\
  \ 7.4 所示，员工经常无意中向供应商、销售人员泄露信息。攻击者只需要尝试让目标多说一些。2022 年 5 月，多个情报机构警告外国间谍利用社交媒体对目标进行社会工程(7)。外国间谍可能会建立一个假装科学家的简介，以便与敏感或机密项目的科学家建立朋友。目标是先与目标建立联系，随着时间的推移拉近关系，最终获取敏感数据。\n\
  \n(7) [`buse.de/en/blog-en/labor-law/cybersecurity-geheimdienste-warnen-vor-industriesionage-ueber-social-media/`](https://buse.de/en/blog-en/labor-law/cybersecurity-geheimdienste-warnen-vor-industriesionage-ueber-social-media/)\n\
  \n另一种有趣的社会工程方法是通过电子邮件。在非常大的组织中，人们无法认识每个成员，因此精明的工业间谍可以发送一封声称来自其他部门的邮件，可能只是询问敏感数据。例如，公司间谍可能会伪造一封看起来来自目标公司法务部的邮件，要求某些研究项目的执行摘要。\n\
  \n![Description: 两个男人握手的照片。](img/07fig04.jpg)\n\n**图 7.4** *社会工程学可以作为低技术间谍活动。*\n\
  \n计算机安全专家安德鲁·布里尼（Andrew Briony）表示，人是计算机安全中的首要问题。\n\n\n\n\n\n# 工业间谍活动中的间谍软件\n\n显然，任何可以监控计算机活动的软件都可能用于工业间谍活动。2021\
  \ 年 4 月的一篇文章描述了一个名为“Industrial Spy”的市场，其设立目的是买卖商业秘密。攻击者通常会先扣留数据索要金，然后出售数据，有时即使支付了赎金也会售出。实现监控的一种方法是通过间谍软件，我们在第\
  \ 5 章中的“恶意软件”中详细讨论过。显然，记录击键或截取屏幕的软件或硬件对工业间谍是非常有利的。2021 年 8 月的一篇文章专门讨论了这样一个事件：亚马逊首席执行官杰夫·贝索斯（Jeff\
  \ Bezos）的智能手机遭到间谍软件攻击，在几个月内外泄了数兆字节的数据。据称，特定的间谍软件是 `Pegasus`，它最初由一家公司为政府创建。\n\n此类软件在谍活动的应用显而易见：间谍可以获取敏感文档的截图、捕获数据库的登录信息，或者在输入敏感文档时进行捕获。这些方法中的任何一种都能让间谍对机器处理的所有数据不受限制地访问。\n\
  \n# 工业间谍活动中的隐写术\n\n隐写术是一种保持秘密的方法。隐写术不是使用加密来隐藏信息，而是通过模糊信息来保护通信。信息被隐藏在图像中。在某些情况下，其他图像也被隐藏。`steganography`\
  \ 一词源于希腊语 `steganos`，意为“覆盖”或“秘密”，以及 `graphy`，意为“写作”或“绘画”。实现这一点的技术手段有很多，但最常见是将数据隐藏在图像文件的最低有效位（LSB）中。然而，数据也可以隐藏在任何数字文件中。\n\
  \n还应该注意的是，历史上存在非技术性的隐藏信息的方法。几个著名的例子包括：\n\n- 古中国人将字条包裹在蜡中并吞下进行运输。\n- 在古希腊，信使的头会被剃光，在头上写上信息，然后让头发重新生长。\n\
  - 1518 年，约翰内斯·特里米乌斯（Johannes Trithemius）写了一本关于密码学的书，并描述了一种技术：通过将每个字母视为一列中的一个单词来隐藏信息。\n\
  \n你可能认为实现隐写术需要大量的技术知识；然而，有很多软件包可以可以为你执行隐写术。`QuickStego` 和 `Invisible Secrets` 是两个非常易用的软件工具，可以为你完成隐写工作。`MP3Stego`\
  \ 是一个在文件中隐藏数据的免费工具。这些只是互联网上可用工具的一部分。廉价或免费易用工具的广泛可用使得隐写术对任何组织都成了威胁。\n\n## 电话窃听与监听\n\
  \n当然，一直存在使用电话监听的可能性。电话监听涉及在某处接入电话线路并拦截通话。这通常在想要窃听的建筑内部进行。显然，这种攻击要求攻击者进入或靠近该场所，破坏电话设备，并具备接入电话线路的技能。\n\
  \n## 雇佣间谍\n\n2021 年的一篇文章讨论了雇佣兵公司，即监视公司。其中许多公司声称只从事合法工作；然而，许多公司被指控从事非法活动。`Black Cube`\
  \ 公司曾代表哈维·韦斯斯坦（Harvey Weinstein）部署过间谍。2021 年《科技共和国》（Tech Republic）的一篇文章也发表了类似信息。该报告确定了六家公司：`Cobwebs\
  \ Technologies`、`Cognyte`、`Black Cube`、`Bluehawk CI`、`Bellrix` 和 `Cytrox`，以及中国的一个未命名小组。\n\
  \n工业间谍活动可能涉及不满的内部人员或间谍软件；然而，它也可能涉及“雇佣间谍”或职业间谍。这些人通常是经验丰富的调查员，有时甚至是情报机构的前员工。这意味着，看到国家级使用的相同技术和工具现在被用于工业间谍活动，不必感到意外。\n\
  \n2022 年《纽约邮报》（New York post）的一篇文章专门描述了一个前企业间谍是如何收集数据的。他的技术主要依赖于社会工程学，而他的工具无非手机和笔记本电脑。涉及的间谍\
  \ Ker 先生声称，他从事企业间谍活动每年收入高达 200 万美元。\n\n# 防御工业间谍活动\n\n到目前，你已经了解到组织的价值信息资产有很多方法可能被破坏。你可以采取哪些步骤来缓解危险？注意，我说的是*缓解*（alleviate）危险。你无法做任何事情让任何系统、任何信息或任何人完全安全。你所能做的是努力达到一种安全水平，使得获取信息的成本高于信息本身的价值。\n\
  \n\n\n\n\n- 始终使用所有合理的网络安全措施：防火墙、入侵检测软件、反间谍软件、操作系统补丁和更新，以及适当的策略政策。\n- 仅允许公司人员访问其工作绝对需要的数据。这一概念被称为`最小权限`（least\
  \ privileges）。赋予员工执行其工作任务时所需的最小权限。采用“按需知晓”（need-to-know）方法。人们并不希望扼杀讨论或想法交流，但必须对敏感数据进行极其谨慎。\n\
  - 如果可能，为那些访问最敏感数据的员工建立一套人员轮岗制或职责分离的系统。这样来，没有某一个员工可以同时访问并控制所有关键数据。\n- 限制组织内便携存储介质（如\
  \ CD 刻录机和闪存盘）的数量并控制对这些介质的访问。记录此类介质每一次每一次以及存储的内容。某些组织甚至禁止使用手机，因为大多数手机允许用户拍摄照片并通过电子方式发送照片。\n\
  - 不要允许员工将文档/媒体带回。。将材料带回家可能意味着一位非常投入的员工在休息时间工作，也可能是企业间谍在复制重要的文档和信息。\n- 碎纸文档并熔化旧磁盘/磁带备份/CD。机灵的间谍通常能从垃圾中找到大量信息。如果丢弃了任何存储介质，应将其完全擦除。消磁是硬盘和\
  \ USB 驱动器的良好技术。\n- 对员工进行背景检查。你必须信任你的员工，而只有通过彻底的背景检查才能做到。不要依赖“直觉”。特别关注信息技术（IT）人员，由于其工作的性质，他们将能够访问各种数据。这种审查对于数据库管理员、网络管理员和网络安全专家等职位尤为重要。\n\
  - 当任何员工离开公司时，仔细扫描该员工的电脑。寻找该机器上是否留有不当数据的迹象。如果你有任何理由怀疑存在不当使用行为，请妥善保存机器以作为后续法律诉讼的证据。\n\
  - 将所有磁带备份、敏感文档和其他介质锁在柜子里，并限制对它们的访问。\n- 如果使用便携式电脑，则应对硬盘进行加密。加密可以防止小偷从被盗的笔记本电脑中提取可用数据。市场上的许多产品都可以实现这种加密，包括：\n\
  - `VeraCrypt`（参见图 7.5）是加密驱动器、文件夹或分区的免费工具示例。该工具非常易用，可以在 [`www.veracrypt.fr`](https://www.veracrypt.fr)\
  \ 找到。还有其他几个类似的工具，大多数成本较低或免费。\n\n![描述：显示了 VeraCrypt 卷创建向导窗口。](img/07fig05.jpg)\n\n\
  **图 7.5** VeraCrypt。\n- Microsoft Windows 包含两种加密。Windows 7 企业版或终极版包含了用于加密整个硬盘的`BitLocker`。后续版本的\
  \ Windows（8, 8.1, 10, 11）也提供 `BitLocker`。自 Windows 2000 以来所有的 Windows 版本都包含了加密文件系统`EFS`），用于加密特定文件或文件夹（参见图\
  \ 7.6）。\n\n![描述：描述了属性的常规选项卡。](img/07fig06.jpg)\n\n**图 7.6** Windows EFS。\n- `DiskCryptor`\
  \ 是一款开源驱动器加密应用程序。它支持 `AES` 和 `Serpent` 等算法（你将在第 8 章 中的“加密”部分中学习更多相关内容）。该软件可以加密 USB\
  \ 和 DVD 等外部设备。可以从 [`diskcryptor.org/`](https://diskcryptor.org/) 获取。\n- 此列表不是详尽的；因此，强烈建议在选择之前仔细审查各种加密产品。\n\
  - 让所有访问任何敏感信息的员工签署保密协议。此类协议让雇主在离职员工泄露敏感数据时拥有追诉权。令人惊讶的是，有这么多雇主不屑于进行这种简单的保护。这些是保护商业秘密的主要方法。\n\
  - 开展安全意识会议。显然，员工教育是你能做的最重要的事情之一。组织应该采取方法定期向员工告诫安全问题。做到点的极佳方法是建立一个发布公告的内网站点。为员工举办定期培训课程也是一个好主意。这些课程不需要很长或太深。大多数非技术员工只需要对安全概念的介绍。\n\
  \n遗憾的是，采取这些简单措施并不会让你完全不受企业间谍活动的影响。然而，使用这些策略会让任何执行者的此类尝试变得变得困难得多；因此，你将提高你组织的数据安全性。\n\
  \n### 商业秘密\n\n在本章之前曾简要提到过商业秘密；然而，这个主题值得更详细的讨论。作者曾作为多起商业秘密盗用案的专家证人参与。针对商业秘密盗用指控，所使用的辩护方法之一是该商业秘密未被识别。至少，你应该将文档标记为机密，最好标记为商业秘密。法院仍可能认为没有此类标记的物品也是商业秘密，特别是当该信息是一个理性人应该知道其是商业秘密的内容时。然而，适当标记信息可以消除任何歧义。\n\
  \n针对商业秘密盗用指控的第二种辩护通常是数据没有得到妥善保护。本质上，这一概念是，如果真的将某物视为商业秘密，就会比其他数据受到重视。\n\nCSO 期提出了保护商业秘密的几种选择（13）：\n\
  \n13 [`www.csoonline.com/article/326810/protecting-trade-secrets-technology-solutions-you-can-use`](https://www.csoonline.com/article/326810/protecting-trade-secrets-technology-solutions-you-can-use)\n\
  \n“一旦数据经过分类和标记，根据你的使用场景，有很多可能的保护选择。这些可能包括 ERMS（企业权限管理系统）持久加密、文件加密、文档密码等。”\n\n文档密码是\
  \ CSO 期建议保护商业秘密的选项之一。还应该注意的是，CSO 期并未建议组织实施所有选择，而是从这些选择中挑选适合组织的那些。文档密码非常适合保护文档中的机密数据。\n\
  \n美国小企业管理局建议了更不实质性的安全措施（14），只需将它们锁在柜子里（如果是纸质副本）或限制对计算机文件的访问：\n\n14 [`www.sba.gov/blogs/5-steps-protecting-your-trade-secrets`](https://www.sba.gov/blogs/5-steps-protecting-your-trade-secrets)\n\
  \n\n\n\n识别只是第一步；采取合理的保护措施是第二步。你不需要将秘密保存在诺特克斯堡（Fort Knox）中来保护它们；将它们标记为“机密”并使其远离公众视线就足够了，因为在特定情况下这是合理的。但如果你不把那张纸看作值得保留的秘密，仅仅在纸上盖上“机密”章是无法保护商业秘密的。\n\
  \n- 针对纸质版商业秘密：将其储存在锁好的文件机柜中\n- 针对计算机中的商业秘密：限制对电子文件的访问\n\n限制对计算机文件的访问是通过计算机密码来实现的。如果还对文档设置了密码保护，安全性将进一步增强。还可以通过文件或驱动器加密进一步加强，但这并非强制要求。\n\
  \n律师们的一场关于保护商业秘密的研讨会对商业秘密的安全性发表了以下评论^(15):\n\n^(15) [`www.foley.com/files/uploads/AIPLA%20Article%20on%20DTSA%20and%20Reasonable%20Efforts%20to%20Protect%20Trade%20Secrets%2048.pdf`](https://www.foley.com/files/uploads/AIPLA%20Article%20on%20DTSA%20and%20Reasonable%20Efforts%20to%20Protect%20Trade%20Secrets%2048.pdf)\n\
  \n### 保护商业秘密的合理努力\n\n为了作为商业秘密受到保护，原告必须证明该商业秘密是能够产生经济价值（实际或潜在）的信息，因为它因为它不为人所知，并且该信息已采取合理努力来维护其保密性。通常，原告商业秘密诉讼中最困难的是证明该商业秘密在维护其保密性方面采取了“合理努力”。保密要求已通过多种方式得到证明或履行，包括：\n\
  \n- 限制对信息的访问（例如，将其锁在金库等安全地点，或通过计算机或网络安全）；\n- 限制知道该信息的人数；\n- 让知情或直接/间接接触商业秘密的人书面同意不披露信息（例如，与第三方签署保密协议，或与员工及顾问/承包商签署保密协议或劳动合同）；和/或\n\
  - 将任何与商业秘密相关的书面材料标记为“机密且专有”，并在发生口头披露后（根据实际情况）进行书面跟进。\n\nIACCM 杂志对保护商业秘密有以下观点^(16):\n\
  \n^(16) [`journal.iaccm.com/contracting-excellence-journal/protect-your-trade-secrets-using-cybersecurity`](https://journal.iaccm.com/contracting-excellence-journal/protect-your-trade-secrets-using-cybersecurity)\n\
  \n### 1. 身份与访问管理\n\n到目前为止，法院在商业秘密案件中了一些非常基本的身份和访问保护形式，包括密码保护、“知情所需”访问和安全服务器存储。\n\
  \n### 2. 数据安全措施\n\n在一些案例中，处理机密数据如何或可以如何存储或传输的特定网络安全保护被认为是保护商业秘密的的重要“合理努力”，例如，USB\
  \ 使用限制以及电子和物理传播控制。\n\n### 3. 边界和网络防御\n\n竞争对手、“黑客行动主义者”、恶意前员工甚至国家试图访问公司商业秘密的行为，可以以攻击公司外部网络或内部设备的形式出现。防止此类商业秘密窃取所采取的“合理步骤”证据包括防火墙、数据加密和在线使用限制。\n\
  \n### 4. 通信\n\n公司与员工在网络安全和其他商业秘密保护方面的通信及培训是至关重要的最佳实践。少数法院已经承认发送给员工的某些类型的电子通信是有用的合理努力，例如指示潜在风险的弹出警告。\n\
  \n### 5. 监控\n\n网络安全显然不仅仅是一次性的、永久性的特定保护措施的实施，而是一项需要随时间推移进行监控、衡量和改进的努力。法院开始认为持续网络安全监控的某些元素与保护商业秘密有关，例如电子邮件监控。\n\
  \nIACCM 的文章概述了保护商业秘密合理的网络安全措施。使用防火墙、某种程度的数据加密、某种程度的访问控制以及限制访问是其建议的核心。\n\n## 工业间谍法\n\
  \n1996 年的《工业间谍法》是第一部将盗取商业秘密犯罪化的美国法律。该法律对违反者提供了严厉的处罚。以下引用了该法律的原文：\n\n```\n(a) 任何人意图将与生产或用于州际或外国贸易的产品相关的或包含其中的商业秘密转换为所有者以外任何人的利益，并意图或明知该行为将损害该商业秘密任何所有者的利益，故意地——\n\
  \n(1) 盗取，或未经许可挪用、取走、带走或隐藏，或通过欺诈、诡计或欺骗获取此类信息；\n(2) 未经许可复制、复制、草拟、绘图、摄影、下载、上传、更改、销毁、复印、复制、传输、交付、发送、邮寄、通信或传达此类信息；\n\
  (3) 接收、购买或拥有此类信息，且明知该信息已被盗取、挪用或未经授权地转换；\n(4) 尝试实施 (1) 至 (3) 中描述的任何犯罪；或\n(5) 与一或多个其他人合谋实施\
  \ (1) 至 (3) 中描述的任何犯罪，且其中一个或多个个人采取了任何为了实现合谋目标的行为，除 (b) 小节规定外，应根据本法题处罚款或监禁不超过 10 年，或两者兼之。\n\
  ```\n\n## 网络钓鱼\n\n如你所知，网络钓鱼是试图从目标处获取个人信息以窃取目标身份或破坏目标系统的过程。一种常见的技术是发送大量电子邮件，引导收件者点击链接，该链接声称是某金融机构的网站，实际上却是钓鱼网站。\n\
  \n鱼叉式网络钓鱼（Spear phishing）使用与网络钓鱼相同的技术，但具有针对性。例如，如果攻击者想要进入某国防承包商的服务器，他可能会专门编写电子邮件和钓鱼网站，针对该公司的软件和网络工程师。这些电子邮件可能是设计来吸引那个特定群体的。或者攻击者甚至花时间了解其中一些个人的个人细节并对他们进行针对性攻击。这种技术已用于针对各种公司的高管。在\
  \ 2010 年和 2011 年，这个问题开始大幅增长。\n\n捕鲸式攻击（Whaling）是网络钓鱼的一种形式，攻击者试图获取有关特定高价值员工的信息。它涉及与网络钓鱼相同的技术，但经过高度定制，以增加单个目标被欺骗并实际响应钓鱼尝试的几率。\n\
  \n## 总结\n\n通过本章对工业间谍活动的审查可以得出若干结论。第一个结论是：它确实发生了。案例研究清楚地证明，工业间谍并不是某些偏执的安全专家幻想出来的奇幻故事。它是现代商业中一个不幸但非常真实的一个方面。如果贵公司管理层选择忽视这些危险，那么他们将自担后果。\n\
  \n\n\n\n通过对工业间谍活动的简要研究，可以得出的第二点是，间谍活动有多种方式。员工泄露机密可能是最常见的。然而，破坏信息系统是另一种日益流行的获取机密和可能有价值数据的手段。你可能想要了解保护公司和自己的最佳方法。在接下来的练习中，你将运行截屏软件、键盘记录器和反间谍软件，以便能够更多地了解间谍策略以及如何应对这些策略。\n\
  \n### 测试你的技能\n\n### 单选题\n\n1. Terrance 正在向一组新安全技术人员解释工业间谍活动。间谍活动的最终目标是什么？\n\nA.\
  \ 颠覆竞争对手政府\nB. 获取有价值的信息\nC. 颠覆竞争对手企业\nD. 获取无法通过其他途径获得的信息\n\n2. 为了真正理解工业间谍活动，你需要理解间谍的心态。对于试图进行间谍活动的间谍来说，最好的结果是什么？\n\
  \nA. 在目标甚至没有察觉的情况下获取信息\nB. 在目标察觉或不察觉的情况下获取信息\nC. 获取信息并破坏目标声誉\nD. 获取信息并对目标造成伤害\n\n\
  3. 企业/工业间谍活动的通常动机因素是什么？\n\nA. 意识形态\nB. 政治\nC. 经济\nD. 报\n\n4. 下列哪种类型的信息可能是工业间谍活动的目标？\n\
  \nA. 公司 IT 部门生成的新算法\nB. 公司制定的新营销计划\nC. 公司所有客户的列表\nD. 以上所有答案均正确\n\n5. 企业间谍活动的准确统计数据很难获得。原因之一是，受害者并不总是举报犯罪，因为他们通常不希望事件公开。以下哪项可能是一个组织可能不愿承认自己是企业间谍活动受害者的原因？\n\
  \nA. 这会让 IT 部门感到尴尬。\nB. 这会让 CEO 感到尴尬。\nC. 可能会导致股票价值下降。\nD. 这可能会导致涉及刑事诉讼。\n\n6. `corporate`（企业）和\
  \ `industrial`（工业）间谍活动之间的区别是什么？\n\nA. 没有；它们是互换的术语。\nB. 工业间谍仅指重工业，如工厂。\nC. 企业间谍仅指高管活动。\n\
  D. 企业间谍仅指上市公司。\n\n7. 信息是一项宝贵的资产。计算该价值可能很有用，以确定应该投入多少精力来保护它。你可以使用什么公式来计算信息的价值？\n\n\
  A. 生成信息所需的资源加上从信息中获得的资源\nB. 生成信息所需的资源乘以从信息中获得的资源\nC. 获取信息所需的时间加上获取信息所需的金钱\nD. 获取信息所需的时间乘以获取信息所需的金钱\n\
  \n8. 如果一家公司购买了一台高端 UNIX 服务器供其研发部门使用，该系统可能最有价值的部分是什么？\n\nA. 高端 UNIX 服务器\nB. 服务器上的信息\n\
  C. 用于保护服务器的设备\nD. 存放服务器的房间\n\n9. 如果信息符合以下情况，它就是你公司的资产：\n\nA. 生产它花费任何数钱\nB. 生产它花费大量金钱\n\
  C. 可能具有经济价值\nD. 复制它可能花费大量金钱\n\n10. 对任何公司来说最大的安全风险是什么？\n\nA. 不满的员工\nB. 黑客\nC. 工业间谍\n\
  D. 故障的网络安全\n\n11. 下列哪项是 `spyware`（间谍软件）的最佳定义？\n\nA. 协助企业间谍活动的软件\nB. 监控计算机上活动的软件\n\
  C. 记录计算机按键的软件\nD. 窃取数据的软件\n\n12. 你可以预期获得的最高安全水平是什么？\n\nA. 一种使得获取信息的成本高于信息本身价值的安全水平\n\
  B. 一种与政府安全机构（如中央情报局 CIA）相当的安全水平\nC. 一种阻止入侵成功率为 92.5% 的安全水平\nD. 一种阻止入侵成功率为 98.5%\
  \ 的安全水平\n\n13. 在防止工业间谍活动的背景下，为什么你可能想限制组织内 CD 刻录机的数量并控制它们的访问？\n\nA. 员工可以使用此类介质获取敏感数据。\n\
  B. 员工可以使用此类介质从公司复制软件。\nC. CD 可能是间谍软件进入你系统的媒介。\nD. CD 可能是病毒进入你系统的媒介。\n\n14. 为什么在员工离开组织时你想扫描他的电脑？\n\
  \nA. 检查其工作流\nB. 检查是否存在企业间谍活动\nC. 检查非法软件\nD. 检查之前的\n\n15. 对笔记本硬盘进行加密的原因是什么？\n\nA.\
  \ 防止黑客在线时读取数据\nB. 确保数据传输安全\nC. 确保该机器上的其他用户看不到敏感数据\nD. 防止小偷从笔记本电脑获取数据\n\n### 练习\n\
  \n#### 练习 7.1: 了解工业间谍活动\n\n1. 使用网络、期刊或其他资源，查找一个本章中未提到的工业或企业间谍活动案例。\n2. 写一篇短文，描述该案例的事实。涉及的双方和刑事诉讼值得关注，但你的大部分讨论应放在案例的技术方面。\n\
  \n#### 练习 7.2: 使用反间谍软件\n\n注意，此练习可以使用不同的反间谍软件。对于任何对计算机安全感兴趣的人，熟悉多种反间谍软件是一个好主意。\n\n\
  1. 进入一个反间谍工具的网站。（如果你需要更多指导，请参见第 5 章。）\n2. 在该网站上查找说明。\n3. 下载该软件的试用版。\n4. 在你的机器上安装。\n\
  5. 安装后，运行工具。它发现了什么？记录你的结果。\n6. 让工具删除或隔离它发现的所有内容。\n\n#### 练习 7.3: 了解记录器\n\n注意，此练习只能在获得明确许可的计算机上完成（不要在公共计算机上进行）。\n\
  \n1. 使用任何网站查找并下载键盘记录器。以下网站可能帮助你找到键盘记录器：`[www.kmint21.com/familykeylogger/](http://www.kmint21.com/familykeylogger/)`\
  \ 和 `[www.blazingtools.com/bpk.html](http://www.blazingtools.com/bpk.html)`。\n2.\
  \ 在你的 PC 上安装键盘记录器。\n3. 观察键盘记录器在你的机器上的行为。你注意到任何可能表明存在非法软件的迹象吗？\n4. 运行练习 7.2 中下载的反间谍软件。反间谍软件检测到键盘记录器了吗？\n\
  \n#### 练习 7.4: 截屏间谍软件\n\n\n\n\n\n1. 使用网络查找并下载一个屏幕截取间谍软件应用程序。以下网站可能有助于你选择合适的产品：[`en.softonic.com/s/screen-capture-spy-software`](http://en.softonic.com/s/screen-capture-spy-software)。警告：由于你正在下载的是间谍软件，你的系统防病毒/反间谍软件可能会向你发出警告。\n\
