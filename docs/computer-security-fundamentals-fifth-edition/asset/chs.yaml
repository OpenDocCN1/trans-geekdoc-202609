  \n##### 练习 1.4：使用安全资源\n\n1. 使用本章列出的常用网络资源，从该资源找到三个政策或程序文档。\n2. 列出你选择的文档。\n\n\n\n\
  \n3. 写一篇简短文，解释为什么这些特定文档对你组织的安全至关重要。\n\n## 练习 1.5：了解法律\n\n1. 利用网络、期刊、书籍或其他资源，查询你所在的州或领地是否有针对计算机安全的特定法律。你可能会发现以下网站很有帮助：\n\
  \n[www.pbs.org/wgbh/pages/frontline/shows/hackers/blame/crimelaws.html](http://www.pbs.org/wgbh/pages/frontline/shows/hackers/blame/crimelaws.html)\n\
