  \n\n\n\n显然，欺诈和身份盗窃是非常现实且日益严重的问题。在如今信息即时获取和在线购物的现代社会，采取措施保护自己免受此类问题的影响至关重要。你必须根据本章概述的步骤努力保护自己的隐私。同时，执法人员也必须掌握调查和解决此类网络犯罪所需的技能。\n\
  \n网络骚扰对平民和执法人员来说通常都是一个新领域。这两类人都对清楚什么是、什么不是网络骚扰是非常重要的，因为遗憾的是，网络骚扰案件可能会升级为现实世界中的暴力行为。\n\
  \n### 测试你的技能\n\n### 单选题\n\n1. Candice 正在与一位同事讨论网络欺骗。她正试图解释最常见的欺诈类型。最常见的网络投资欺骗的术语是什么？\n\
  \nA. 尼日利亚式欺骗\nB. 曼哈顿欺骗\nC. 拉高出货 (The pump and dump)\nD. 挂头换脑肉 (The bait and switch)\n\
  \n2. 你已经非常活跃于在线投资。你想获得一些建议，但对你收到的建议的真实性表示担忧。未经投资建议最可能的问题是什么？\n\nA. 你赚的可能没有声称的多。\n\
  B. 建议可能并非真的无偏见。\nC. 建议可能并非来自正规公司。\nD. 你可能会赔钱。\n\n3. Juan 是一家投资公司的安全人员。他正在向经纪人解释各种骗局。人为抬高股票价格以更高的价格售卖的术语是什么？\n\
  \nA. 挂头换脑\nB. 尼日利亚式欺骗\nC. 拉高出货 (Pump and dump)\nD. 华尔街欺骗\n\n4. 避免网络欺骗的首要规则是什么？\n\
  \nA. 如果某事听起来好得不可真实，那么它很可能真的。\nB. 永远不要使用你的银行账户。\nC. 只与具有可验证电子邮件地址的人合作。\nD. 不要投资于海外交易。\n\
  \n5. 以下哪项不是证券交易委员会（SEC）提供的避免投资欺诈的建议之一？\n\nA. 不要在线投资。\nB. 考虑报价的来源。\nC. 始终保持怀疑。\n\
  D. 始终对该投资进行研究。\n\n6. Aliya 活跃于在线拍卖，但想避免拍卖欺诈。拍卖欺诈的四个类别是什么？\n\nA. 未发送、未披露、发送到错误地址、未交付\n\
  B. 未发送、未披露、发送价值较低的物品、未交付\nC. 未披露、发送物品到错误地址、未发送、未交付\nD. 未披露、发送价值较低的物品、未发送、发送价值更高的物品\n\
  \n7. 卖家通过对自己的物品进行竞价以推高价格的术语是什么？\n\nA. 竞价抽取 (Bid siphoning)\nB. 竞价掩护 (Bid shielding)\n\
  C. 恶意竞标 (Shill bidding)\nD. 虚假投标 (Ghost bidding)\n\n8. 提交虚假但很高的报价以威慑其他竞标者的术语是什么？\n\
  \nA. 竞价抽取 (Bid siphoning)\nB. 竞价掩护 (Bid shielding)\nC. 恶意竞标 (Shill bidding)\nD.\
  \ 虚假投标 (Ghost bidding)\n\n9. 身份盗窃通常的目标是什么？\n\nA. 进行非法购买\nB. 损害受害信\nC. 避免刑事起诉\nD.\
  \ 侵犯隐私\n\n10. 根据美国司法部的说法，身份盗窃的动机通常是什么？\n\nA. 恶意\nB. 对受害者的个人敌意\nC. 经济利益\nD. 追求刺激\n\
  \n11. Clarence 是一个小镇警察局的警探。他正在考虑应该多认真地对待关于网络骚扰的报告。为什么网络骚扰是一种严重的犯罪？\n\nA. 它对受害者来说是可怕的。\n\
  B. 它可能是暴力犯罪的前奏。\nC. 它使用了跨州通信。\nD. 它可能是身份盗窃的前奏。\n\n12. 什么是网络骚扰？\n\nA. 任何使用互联网发送或发布威胁的行为\n\
  B. 任何使用电子通信骚扰某人的行为\nC. 使用电子邮件发送威胁\nD. 使用电子邮件骚扰某人\n\n13. 为了追究骚扰指控，执法人员通常要求受害者提供什么？\n\
  \nA. 可验证的死亡或严重伤害威胁\nB. 可信的死亡或严重伤害威胁\nC. 可验证的伤害威胁\nD. 可信的伤害威胁\n\n14. 如果你在聊天室中匿名发布内容，另一个匿名发布者威胁要殴打你或甚至杀死你，那么这个人的帖子算作骚扰吗？\n\
  \nA. 是的；任何暴力威胁都是骚扰。\nB. 可能不是，因为双方都是匿名的，所以威胁是不可的。\nC. 是的；聊天室的威胁与面对面的威胁没有区别。\nD. 可能不是，因为在聊天室发出威胁不等同于面对面发出威胁。\n\
  \n15. 网络骚扰要构成违法必须具备什么？\n\nA. 州或领土的特定法律\nB. 针对骚扰的特定法律\nC. 无需；现有法律适用\nD. 无需；现有法律可以适用\n\
  \n16. 保护自己的第一步是什么？\n\nA. 除非必要，否则永远不要提供个人数据。\nB. 定期检查身份盗窃。\nC. 永远不要在线上使用真名。\nD. 定期检查你的电脑。\n\
  \n17. 你可以在电脑上做什么来保护你的隐私？\n\nA. 安装病毒扫描程序。\nB. 安装防火墙。\nC. 设置浏览器的安全设置。\nD. 设置电脑的过滤器设置。\n\
  \n18. 什么是 cookie？\n\nA. 网络服务器收集关于你的一部分数据\nB. 存储在计算机上的小文件\nC. 你的浏览器收集关于你的一部分数据\n\
  D. 在服务器上制作并然后存储的小文件\n\n19. 以下哪项不是保护免受拍卖欺诈的有效方法？\n\nA. 只对便宜物品进行拍卖。\nB. 只使用拍卖网站。\n\
  C. 只与良好的卖家合作。\nD. 只对看起来真实的物品竞价。\n\n20. 聊天室安全的首要规则是什么？\n\nA. 确保你安装了杀病毒软件。\nB. 永远不要使用真实姓名或任何身份特征。\n\
  C. 只使用加密传输的聊天室。\nD. 使用知名网站或公司赞助的聊天室。\n\n21. 使用专门用于在线购物的信用卡有什么用？\n\nA. 如果信用卡被非法使用，你将限制财务责任。\n\
  B. 你可以更好地跟踪你的拍卖活动。\nC. 如果被诈骗，你可以让信用卡公司处理问题。\nD. 如果需要，你可以轻松注销那张卡。\n\n22. 多大比例的网络骚扰案件会升级为现实世界的暴力？\n\
  \nA. 少于 1%\nB. 大约 25%\nC. 90% 以上\nD. 大约 19%\n\n23. 如果你是网络骚扰的受害者，你应该做什么来协助警察？\n\n\
  A. 什么都不做；那是他们的工作，你不应该参与。\nB. 试图引骚扰者去公共场所。\nC. 保留所有骚扰信息的电子版和纸质副本。\nD. 试图挑骚扰者透露个人信息。\n\
  \n24.  de 网络骚扰的最主要方法是什么？\n\nA. 不要在线上使用你的真实身份。\nB. 始终使用防火墙。\nC. 始终使用病毒扫描程序。\n\n\n\
  \n\n\n# D. 不要提供电子邮件地址。\n\n## 练习题\n\n### 练习 3.1：在 Microsoft Edge 中设置浏览器隐私\n1. 本章节将通过图片详细描述此过程，但在这里，你实际上应该亲自操作一遍该过程：\n\
  - 从 Microsoft Edge 窗口右角的省略号（`…`）菜单中选择`设置`，然后进入`设置`。\n- 向下滚动并选择`高级设置`。\n- 向下滚动到`隐私和服务`部分。\n\
  - 稍微向下滚动，在`Cookie` 下拉部分中，将浏览器设置为`不阻止 Cookie`、`阻止所有 Cookie`或`仅阻止第三方 Cookie`。\n\n\
  ### 练习 3.2：使用替代网络浏览器\n1. 如果你还没有它，请从 [www.mozilla.org](http://www.mozilla.org) 下载\
  \ Firefox 浏览器。\n2. 设置隐私和安全设置。\n\n### 项目\n\n### 项目 3.1：了解网络骚扰与法律\n1. 使用网络或其他资源，查询你所在州、国家或省份关于网络骚扰的法律。\n\
  2. 写一篇简短论文，描述这些法律及其含义。你可以选择对几项法律进行快速总结，也可以对其中一项法律进行更深入的研究。如果你选择前者，只需列出这些法律并写一个简短段落解释它们涵盖的内容。如果你选择后者，请讨论该法律的作者、编写原因以及该法律可能产生的影响。\n\
  \n### 项目 3.2：寻找拍卖欺诈\n进入任何拍卖网站，尝试识别是否存在你认为可能存在欺诈的卖家。写一篇简短论文，解释特定卖家的哪些特征表明他可能没有进行诚实交易。\n\
  \n### 项目 3.3：研究网络骚扰案例研究\n1. 使用网络找到一个本章未提到的网络骚扰案例。你可能会发现以下网站对你有帮助：\n- [www.safetyed.org/help/stalking/](http://www.safetyed.org/help/stalking/)\n\
  2. 写一篇简短论文讨论此案例，特别关注你认为哪些步骤可能有助于避免或改善这种情况。\n\n## 案例研究\n考虑这个关于无畏身份窃窃犯的案例。犯罪者 Jane\
  \ 在在线聊天室中遇到了受害者 John。John 使用了自己的真实的名，但只用了姓氏的首字母。然而，在 Jane 和 John 之间系列在线对话中，他透露了关于他生活的个人细节（婚姻状况、孩子、职业、居住地区等）。最后，Jane\
  \ 给 John 提供了一些信息（例如某种投资建议），作为骗取 John 电子邮件地址的技巧。一旦她获取了他的电子邮件地址，聊天室之外就开始了邮件交流，Jane\
  \ 声称要给 John 她的真实姓名，从而鼓励 John 也这样做。当然，犯罪者的名字是虚假的，例如“Mary”。但现在 Jane 拥有 John 的真实姓名、城市、婚姻状况、职业等。\n\
  \nJane 可以尝试多种方案，但在本例中，她首先通过电话簿或网络获取 John 的家庭地址和电话号码。她可以利用这些信息通过各种方式获取 John 的社会安全号。最直接的方法是在\
  \ John 上班时翻他的垃圾。然而，如果 John 在一家大公司工作，Jane 可以打电话（或让别人打电话），谎称是 John 的妻子或其他亲属，想要核实人员数据。如果\
  \ Jane 足够聪明，她可能会获得 John 的社会安全号。然后，获取 John 的信用报告（将在第 13 章中所示）并以他的名义办理信用卡将是轻而易举。\n\
  \n从这个场景中，考虑以下问题：\n1. John 在聊天室中可以采取哪些合理步骤来保护自己的身份？\n2. 任何雇主应该采取哪些措施来防止在无意中成为身份窃取的帮凶？\n\
  \n# 第 4 章\n\n## 拒绝服务攻击\n\n### 章节目标\n在阅读本章并完成练习后，你将能够做到以下几：\n- 理解拒绝服务攻击是如何实现的\n-\
  \ 了解某些拒绝服务攻击的工作原理，例如 SYN 洪水攻击、Smurf 攻击和分布式拒绝服务攻击\n- 采取特定措施防止拒绝服务攻击\n- 了解如何防御特定的拒绝服务攻击\n\
  \n### 引言\n到目前，你已经概括地了解了互联网的危险性，并探索了几条在互联网上保护的基本规则。在第 3 章“网络骚扰、欺诈与滥用”中，你被介绍了一些欺诈、骚扰及相关犯罪。现在是时候更具体地了解系统攻击是如何进行的了。在本章中，我们将检查一类可能用于对目标计算机系统造成伤害的攻击。本章将为你深入描述`拒绝服务`（`DoS`）攻击的工作原理。这种威胁是互联网上最常见的攻击之一，因此了解它是如何工作的以及如何防御它是你是明智的。此外，在书末的练习中，你将练习停止\
  \ DoS 攻击。在信息安全领域，老格言“知识就是力量”不仅是一条良好的建议，而且是你构建整个安全观的基公理。\n\n### DoS 攻击\n正如引言中所，最常见且简单的系统攻击形式之一是\
  \ DoS。这种攻击甚至不会尝试入侵你的系统或获取敏感信息；它的目的仅仅是阻止合法用户访问系统。这种类型的攻击执行相当容易。基本概念只需要少量的技术技能。它基于任何设备都有运行限制的事实。例如，卡车只能承载有限的负载或行驶有限的距离。计算机与任何机器没有区别，它们也有限制。任何计算机系统、Web\
  \ 服务器或网络只能处理有限的负载。计算机系统的工作负载可以由并发用户数、文件大小、数据传输速度或存储的数据量来定义。如果你超过了任何这些限制，过载负载就会导致系统停止响应。例如，如果你向\
  \ Web 服务器发送了超过其处理能力的请求，它将会过载并无法再响应进一步的请求。这些攻击实际上比许多其他攻击简单得多，因此非常普遍。\n\n### 演示攻击\n\
  一种演示这种攻击的简单方法（特别是在教室环境中）涉及第 2 章“网络与互联网”中讨论的 `ping` 命令：\n\n1. 在一台机器上启动运行的 Web 服务器服务。（你可以使用\
  \ Apache、IIS 或任何 Web 服务器。）\n2. 让几个人打开浏览器，并在地址栏中输入该机器的 IP 地址。他们应该能看到该 Web 服务器的默认网站。\n\
  \n\n\n\n现在你可以对系统进行一种相当原始的 DoS 攻击。回想第 2 章，在命令行中输入 `ping /?` 将显示 `ping` 命令的所有选项。`-l`\
  \ 选项更改你所发送的数据包大小。请记住，TCP 数据包的大小是有限的。因此，你将这些数据包 设置为尽可能你能够发送的最大值。`-w` 选项决定 `ping`\
  \ 工具等待目标响应的毫秒数。你将使用 `-0`，这样 `ping` 工具将不会等待。然后 `-t` 指令 `ping` 工具持续发送数据包，直到被显式停止为止。\n\
  \n3.  在 Windows 7/8/8.1/10 中打开命令提示符。（这是 UNIX/Linux 中对应的 shell。）\n\n4.  输入 `ping\
  \ <此处填入目标机器地址> -l 65000 -w 0 -t`。你将看到非常类似于图 4.1 所示的内容。请注意，在图中，我正在 ping 我自己机器的环回地址。你需要替换为你运行\
  \ Web 服务器的机器地址。\n\n![Description: 命令提示符窗口显示了在命令提示符中使用 ping 的用法。使用了命令 127.0.0.1 hyphen\
  \ 1 65000 hyphen w 0 hyphen t。显示了带有 65000 字节数据的 ping 结果。](img/04fig01.jpg)\n\n**图\
  \ 4.1** 从命令提示符运行的 `ping`。\n\n此时正在发生的是，这台机器正在不断地 ping 目标机器。当然，在你的教室或实验室里只有一台机器在 ping\
  \ 你的 Web 服务器，并不会对 Web 服务器产生不利影响。然而，你现在可以一个接一个让教室里的其他机器以同样的方式 ping 服务器。在向攻击中添加每批三到四台机器后，尝试访问\
  \ Web 服务器的默认首页。在达到某个阈值（即有一定数量的机器正在 ping 服务器）后，Web 服务器将停止响应请求，你也将无法看到该网页。\n\n拒绝服务需要多少机器取决于你正在使用的\
  \ Web 服务器。为了在尽可能少机器的情况下看到这种拒绝服务的发生，你可以使用容量极低的 PC 作为你的 Web 服务器（即内存和 CPU 尽可能小）。例如，在运行\
  \ Windows 7 家庭版的简单笔记本电脑上运行 Apache Web 服务器，可能需要大约 15 台机器各同时运行约 10 个不同的命令窗口并进行 ping，就会导致\
  \ Web 服务器停止响应合法请求。当然，这种策略与你通常为 Web 服务器选择的选择背道而驰的；任何真实的 Web 服务器都不会运行在了 Windows 7\
  \ 家庭版（甚至是 Windows 10）的简单笔记本电脑上。同样，实际的 DoS 攻击使用更复杂的方法。然而，这个简单的练习演示了 DoS 攻击背后的基本原理：只需向目标机器发送大量数据包，使其无法再响应合法请求。重要的是，要意识到这只是一个说明。对于现代服务器，而且许多服务器实际上托管在集群或服务器农场中，这种完全插图对现代目标将不起作用。\n\
  \n通常情况下，用于 DoS 攻击的方法比这里提供的示例要复杂得多。例如，黑客可能会开发一种微型病毒，其唯一目的是感染尽可能多的计算机，然后让每台被感染的计算机向目标发起\
  \ DoS 攻击。一旦病毒传播，被该病毒感染的各种机器就会开始对目标系统进行泛洪。这种 DoS 攻击很容易进行，但很难停止。从几个机器发起的 DoS 攻击是这样的。\n\
  \n\n\n\n## XOIC\n\nXO 类似于 LOIC。它有三种模式，如图图 4.3 所示：你可以发送消息、执行简短测试或启动 DoS 攻击。\n\n![描述：截图显示了\
  \ XOIC。有三个文本框可以输入 IP、端口和 protobolt。窗口底部的其他模式显示为发送消息、测试模式和实施 DoS](img/04fig03.jpg)\n\
  \n**图 4.3** *XOIC。*\n\n像 LOIC 一样，XOIC 非常容易使用。它只是一个点击式的图形用户界面。即使是技能最低的攻击者也可以用它发起\
  \ DoS 攻击。\n\n## TFN 和 TFN2K\n\nTribal Flood Network (TFN) 和 TFN2K 是两个最老的 DoS 工具，现在已不再被广泛使用。在这里介绍它们是为了历史目的。TFN\
  \ 和 TFN2K 已经存在多年，尽管今天仍在在使用，但并不广泛。TFN2K 是 TFN 的较新版本，支持 Windows Server 和 UNIX 平台（并可以轻松移植到其他平台）。它具有一些比前身更难检测的特性，包括发送诱骗信息以避免被追溯。精通\
  \ TFN2K 的专家可以使用多个代理的资源来协调对一个或多个目标的攻击。此外，TFN 和 TFN2K 可以执行各种攻击，如 UDP 洪水攻击、ICMP 洪水攻击和\
  \ TCP SYN 洪水攻击（本章稍后将进行讨论）。\n\nTFN2K 在两个方面运行。首先，主系统上有一个命令驱动的客户端。其次，代理系统上运行着守护进程。攻击过程如下：\n\
  \n1. 主机指示代理攻击一组指定的目标。\n\n代理通过向目标发送大量数据包来响应。\n\n使用此工具，由主机协调的多个代理可以在攻击期间协作，中断对目标的访问。此外，针对攻击者的若干“安全”功能显著增加了开发\
  \ TFN2K 有效高效防御措施的难度：\n\n▪ 主代理之间的通信是加密的，并可能与任意数量的诱骗包混合。\n\n▪ 主代理之间的通信以及攻击本身都可以通过随机的\
  \ TCP、UDP 和 ICMP 数据包发送。\n\n▪ 主机可以伪造其 IP 地址。\n\n## Stacheldraht\n\nStacheldraht 的知名度不如之前提到的\
  \ DoS 工具。Stacheldraht 在德语中意为“铁丝”，是一种 DDoS 攻击工具，结合了 Trinoo DDoS 工具（另一种常用工具）的功能与 TFN\
  \ DDoS 攻击工具的源代码。与 TFN2K 一，它增加了攻击者与 Stacheldraht 主机之间的通信加密。它还增加了代理的自动更新。\n\nStacheldraht\
  \ 可以执行多种攻击，包括 UDP 洪水、ICMP 洪水、TCP SYN 洪水和 Smurf 攻击。它还能检测并启用源地址伪造。\n\n## DoS 漏洞\n\n\
  从攻击者的角度来看，任何 DoS 攻击的弱点在于数据包洪水必须持续。一旦停止发送数据包，目标系统就会恢复。然而，DoS/DDoS 攻击通常与其他形式的攻击结合使用，例如在\
  \ TCP 劫持中禁用连接的一端，或防止服务器之间的身份验证或记录。\n\n如果黑客正在使用分布式攻击，一旦受感染机器的管理员或所有者意识到机器被感染，他们就会采取措施清除病毒并停止攻击。如果黑客试图从自己的机器发起攻击，她必须意识到每个数据包都有可能追溯到源头。这意味着进行\
  \ DoS 攻击的单个黑客几乎会被当局捕。由于由于原因，DDoS 攻击正迅速成为最常见的 DoS 攻击类型。DDoS 攻击的细节将在本章稍后讨论。\n\n##\
  \ 具体 DoS 攻击\n\nDoS 攻击的基本概念并不复杂。攻击者面临的真正问题是在不被发现的情况下执行。本章接下来的几节将检查某些类型的 DoS 攻击并查看特定的案例研究。这些信息应该帮助你对这种特定的网络威胁有更深入的理解。\n\
  \n### TCP SYN Flood Attacks\n\n这种攻击对大多数目标已不再有效，但它是网络威胁中的经典。这种攻击取决于连接是如何建立的。任何连接到服务器的机器都会受到影响。阻止\
  \ DoS 攻击最简单的方法是通过防火墙规则。（我们将在第 9 章“计算机安全技术](#ch09.xhtml#ch09)”中详细讨论防火墙）。配置正确的防火墙可以防止\
  \ SYN 洪水攻击。然而，可以在服务器上实施多种方法和技术来防止此类攻击。基本的防御技术如下：\n\n▪ 微块 (Micro blocks)\n\n▪ SYN\
  \ 奇糖 (SYN cookies)\n\n▪ RST 奇糖 (RST cookies)\n\n▪ 栈调优 (Stack tweaking)\n\n这些方法中的某些比其他方法需要更高的技术。这些方法在这里进行通俗讨论。当你被委托防御系统受此类形式的攻击时，你可以根据你的网络环境和专业水平选择最合适的方法，并在那时进一步检查系统。实施任何这些方法的具体细节将取决于你的\
  \ Web 服务器所使用的操作系统。你需要咨询你操作系统的文档或适当的网站，以找到如何实施这些方法的明确说明。\n\n#### 微块 (Micro Blocks)\n\
  \n`micro block` 的工作原理是简单的分配一个微记录（micro-record），而不是为 `SYN` 对象分配完整的连接对象（整个缓冲区段）。这样，一个传入的\
  \ `SYN` 对象可以只分配 16 字节的空间，这使得泛洪系统变得困难得多。这种方法现在有点冷门，目前的使用频率不如以前那样广泛。它实际上并没有防止阻止 DoS\
  \ 攻击，而仅仅是缓解了其影响。\n\n> 注意 许多网络管理员仅仅依赖防火墙来阻止 DoS 攻击，而不在单个服务器上采取任何补救措施。我建议你考虑结合这两种方法。是的，你应该有一个配置良好的防火墙来阻止许多\
  \ DoS 攻击，但你也应该考虑在单个服务器上采取缓解措施。\n\n##### SYN 奇糖 (SYN Cookies)\n\n\n\n\n正如 `SYN cookies`\
  \ 的名称所示，这种方法使用了 cookie，这与许多网站上使用的标准 cookie 无相似。通过这种方法，系统不会立即为握手过程在内存中创建缓冲区。相反，它首先发送\
  \ `SYN+ACK`（开始握手过程的确认信号）。`SYN+ACK` 包含一个精心构建的 cookie，它是通过对请求连接的客户端机器的 IP 地址、端口号和其他信息进行哈希处理而生成的。当客户端用正常的\
  \ `ACK`（确认）响应时，该 cookie 中的信息将被包含在内，服务器随后进行验证。因此，在握手过程的第三阶段之前，系统不会完全分配任何内存。这使得系统能够继续正常运行；通常，看到的唯一效果是禁用了大窗口。然而，`SYN\
  \ cookies` 中使用的加密哈希非常消耗资源，因此预计会有大量入站连接的系统管理员可能会选择不这种防御技术。\n\n### 提示：哈希算法\n\n哈希值是从文本字符串生成的数字。哈希值比文本本身小得多，并且通过公式生成，使得其他文本产生相同哈希值的可能性极低。哈希在用于确保传输的消息未被篡改时在安全方面起着作用。发送者生成消息的哈希，对其进行加密，并随消息本身发送。接收者随后解密消息和哈希，从收到的消息中产生另一个哈希，并比较两个哈希。如果它们相同，则消息完整传输的概率非常高。我们将在\
  \ `第 8 章`、`加密` 中详细地讨论哈希。\n\n### RST Cookie\n\n另一种比 `SYN cookies` 更容易实现的 cookie 方法是\
  \ `RST cookie`。在这种方法中，服务器向客户端发送一个错误的 `SYN+ACK`。客户端随后生成一个 `RST` 数据包，告诉服务器出现了错误。由于客户端回传了一个通知服务器错误的数据包，服务器现在知道客户端请求是合法的，并且现在可以以正常方式接受来自该客户端的入站连接。这种方法的缺点是可能会与旧的\
  \ Windows 机器以及在防火墙后通信的机器产生问题。\n\n### 上游过滤\n\n这通常由 ISP 完成。本质上它涉及检查流量以确定其是否为 `DoS`\
  \ 的一部分，然后拦截可疑流量。也可以在允许流量进入目标之前放置一个“清洗”中心来实现。\n\n### SPI 防火墙\n\n今天，大多数防火墙使用状态数据包检测。这类防火墙不仅对每个数据包应用规则，还维护客户端与服务器之间的通信状态。因此，它们意识到多个\
  \ `SYN` 数据包来自同一个 IP 地址，并拦截了它们。这就是为什么今天很少看到 `SYN floods`（洪水攻击）的主要原因之一。此外，下一代防火墙 (`NGFWs`)\
  \ 结合了传统防火墙和其他功能，例如应用程序防火墙或入侵检测/预防系统 (`IDS/IPS`)。\n\n### Smurf IP 攻击\n\nSmurf 攻击是\
  \ `DoS` 攻击的一种非常流行的版本。（此处原文大量重复，已按要求处理）将一个 `ICMP`（互联网消息协议）数据包发送到广播地址。\n\n\n\n\nUDP\
  \ 正如你在第 2 章中所记忆的，是一种无连接协议，在传输数据之前不需要建立连接程序。在 `UDP flood attack` 中，攻击者向目标系统的随机端口发送\
  \ `UDP packet`。当目标系统接收到 `UDP packet` 时，它会自动确定哪个应用程序正在等待该目标端口。在这种情况下，由于没有应用程序在这些端口上等待，目标系统将生成一个标记为“目的不可达”的\
  \ `ICMP packet` 并尝试将其发回伪造的源地址。如果发送到目标端口的 `UDP packets` 足够多，系统将因为尝试确定等待的应用程序（这些程序并不存在）以及随后生成并发送回包数据包而导致负载过载。\n\
  \n### ICMP 泛洪攻击\n\n`ICMP flood attacks` 有两种基本类型：泛洪（floods）和核弹（nukes）。ICMP 泛洪攻击通常通过广播大量的\
  \ ping 或 `UDP packets` 来实现。与其他泛洪攻击一样，其核心思想是向目标系统发送大量数据，使其变慢。如果能强制其运行得足够慢，目标就会超时（即无法足够快地回复）并与互联网断开。ICMP\
  \ 核弹（nukes）利用了特定操作系统的已知漏洞。攻击者发送一个他知道目标系统操作系统无法处理的信息数据包。在许多情况下，这会导致目标系统完全锁机。\n\n\
  这种攻击对现代计算机的有效性远不如对旧机器的有效性。即使现在是一台低端桌面 PC，也拥有 4GB（或更多）的内存和双核处理器。这使得产生足够的 ping 来让机器离线变得非常困难。然而，在曾几何时这是一种非常常见的\
  \ DoS 攻击形式。\n\n### 死亡之 ping (The Ping of Death)\n\n回想第 2 章中，`TCP packets` 的大小是有限的。在某些情况下，仅仅是发送一个过大的数据包就可以关闭目标机器。这种行为被称为\
  \ `ping of death`（`PoD`）。它的工作原理很简单，就是让目标系统过载。黑客发送单个 ping，但使用的是非常大的数据包，因此可以关闭某些机器。\n\
  \n这种攻击与本章早些讨论的课堂示例非常相似。两种情况的目标都是让目标系统过载并使其停止响应。`PoD` 旨在破坏无法处理极大的数据包大小的系统。如果这种攻击成功，服务器实际上将完全关闭。当然，它可以被重启。\n\
  \n防止 `PoD` 的唯一真实防护措施是确保所有的操作系统和软件都定期进行补丁更新。这种攻击依赖于特定操作系统（或应用程序）处理异常大 `TCP packets`\
  \ 方式中的漏洞。当发现此类漏洞时，厂商通常会发布补丁。`PoD` 的可能性是众多原因之一，这促使你必须保持所有系统中的补丁更新到最新状态。\n\n大多数拒绝服务攻击可以通过适当的防火墙结合\
  \ `IDS/IPS` 或下一代防火墙得到妥善缓解。第 9 章 进一步详细地讨论了安全设备和软件。\n\n### 泪滴型攻击 (Teardrop Attacks)\n\
  \n在 `teardrop attack` 中，攻击者发送一个分段的消息。这两个分段以某种方式重叠，使得在不破坏单个数据包头的情况下无法正确重新组装它们。因此，当受害者尝试重构消息时，消息会被销毁。这导致目标系统停止或崩溃。基础泪滴型攻击有许多变体，例如\
  \ `TearDrop2`、`Boink`、`targa`、`Nestea Boink`、`NewTear` 和 `SYNdrop`。\n\n### DHCP\
  \ 饥饿 (DHCP Starvation)\n\n如果有足够的请求淹没网络，攻击者可以长时间耗尽 `DHCP servers` 分配的地址空间。这种 DoS\
  \ 攻击被称为 DHCP 饥饿。攻击者可以使用如 `The Gobbler` 等工具轻松地实施这种类型的攻击。\n\n### HTTP POST DoS 攻击\n\
  \n`HTTP POST DoS attack` 涉及发送合法的 `HTTP POST message`。`POST message` 的部分内容是 `content\
  \ length`，它指示了后续消息的大小。在这种攻击中，攻击者以极缓慢的速度发送实际的消息体。Web 服务器在等待消息完成时会挂起。对于更健壮的服务器，攻击者需要同时发送多个\
  \ `HTTP POST messages`。\n\n### PDoS 攻击\n\n永久性拒绝服务 (`PDoS`) 攻击对系统的损坏严重到受害者机器需要重新安装操作系统甚至更换新硬件。这种攻击有时被称为\
  \ `phlashing`，通常涉及对设备固件的 DoS 攻击。\n\n### 注册 DoS 攻击 (Registration DoS Attacks)\n\n\
  攻击者可以创建一个反复提交注册表单的程序，为应用程序添加大量虚用户。这是许多注册网站使用 `CAPTCHA` 的原因之一。\n\n### 登录 DoS 攻击 (Login\
  \ DoS Attacks)\n\n攻击者可以通过不断发送登录请求，要求演示层访问身份验证机制，从而使其不可用或响应速度极不合理。许多网站使用 `CAPTCHA`\
  \ 来防止自动登录尝试。\n\n### Land 攻击 (Land Attacks)\n\n`land attack` 可能是概念上最简单的攻击。攻击者发送一个具有相同源\
  \ IP 地址和目的 IP 地址（目标的 IP 地址）的伪造数据包。该方法是通过让目标系统尝试自己向自己发送消息来使其变得“疯狂”。受害者系统通常会感到困惑并崩溃或重启。更现代的计算机不受这种攻击的影响，但在这里介绍它是为了历史目的。\n\
  \n### DDoS 攻击\n\n今天最常见的 DoS 攻击形式也许是 `DDoS attack`。这是通过让各种机器攻击目标来实现的。一种典型方法是发送特洛马，导致受感染计算机在特定日期和时间攻击指定的目标。这是对任何目标执行\
  \ DDoS 攻击的一种有效方法。在这种攻击形式中，攻击者并不控制涉及的各种机器。\n\n另一种方法是使用僵尸网络 (`botnet`) 来协调攻击。`Botnets`\
  \ 是被攻击者入侵的计算机网络，让该攻击者控制受感染的系统。这通常通过交付特洛马来实现。然而，与上述的 DDoS 攻击形式不同，攻击者可以直接控制僵尸网络中的攻击机器。\n\
  \n### 攻击 (Yo-Yo Attack)\n\n这种 DoS 攻击针对使用自动扩展的云托管应用程序。攻击者本质上是淹没目标，导致云托管服务扩展以处理流量增加。随后，攻击者停止攻击并等待云主机收缩，然后恢复攻击。云服务通常会对扩展以处理更多带宽的行为进行收费，因此这增加了目标的成本。\n\
  \n### 登录攻击 (Login Attacks)\n\n攻击者可能通过应用程序中的另一个漏洞枚举用户名，然后使用 `有效用户名和错误的密码` 尝试对网站进行身份验证，在指定的失败次数后锁定账户。此时，合法用户将无法使用该网站。\n\
  \n另一种登录攻击涉及攻击者通过不断发送登录请求使登录过程过载，要求演示层访问身份验证机制，使其不可用或响应速度极不合理。\n\n\n\n\n\n这就是为什么许多网站都使用验证码（captcha）。它阻碍了\
  \ DoS 尝试。如果每次登录尝试都需要用户回答验证码，那么自动化 DoS 工具就无法执行这种攻击。\n\n### CLDAP 反射\n\n无连接轻量级目录访问协议\
  \ (`CLDAP`）是 `RFC 3352` 中规范的行业标准。该协议使用 `UDP` 而不是 `TCP`，并为连接到网络的新主机分配 IP 地址。攻击者本质上通过大量的\
  \ CLDAP 请求淹没网络。\n\n[`datatracker.ietf.org/doc/html/rfc3352`](https://datatracker.ietf.org/doc/html/rfc3352)\n\
  \n### 服务降级攻击\n\n虽然缩写仍然是 `DoS`，但这是一种稍微不同的攻击类型。攻击者通过短暂的流量爆发针对目标网站。这会导致目标网站响应变慢，而不是崩溃。这通常是持续进行的，以导致目标服务的持续性降级。\n\
  \n### 挑战碰撞攻击 (Challenge Collapsar Attack)\n\n这通常缩写为 `CC`。攻击者向目标 Web 服务器发送频繁的 `HTTP`\
  \ 请求。这些请求包含统一资源标识符（URI），需要目标网站进行耗费时间的数据库操作。此目的是耗尽目标网站的资源。\n\n### EDoS\n\n2022 年的一份报告预测，一种被命名为经济性可持续性拒绝服务\
  \ (`EDoS`) 的新攻击将在不久将来成为一个问题。其概念是中断或停止云资源的可用性。这种攻击通常涉及发送虚假请求的机器人。这通常被用于针对基础设施服务 (`IaaS`)\
  \ 解决方案。\n\n[`www.tripwire.com/state-of-security/security-data-protection/cloud/edos-the-next-big-threat-to-your-cloud/`](https://www.tripwire.com/state-of-security/security-data-protection/cloud/edos-the-next-big-threat-to-your-cloud/)\n\
  \n### DoS 攻击的现实世界实例\n\n我们花费了大量时间讨论各种 `DoS` 攻击实施的基础知识。到目前，你应该已经牢掌握了什么是 `DoS` 攻击，并对其工作原理有了基本的理解。现在是时候讨论此类攻击的具体现实世界实例了。本节将利用你所获得的理论知识，为你提供其实际应用的现实世界案例。\n\
  \n#### Google 攻击\n\n2020 年 10 月发生了一次破纪录的 `UDP` 放大攻击，追溯到三个中国互联网服务提供商。这次攻击利用多个网络伪造了每秒\
  \ 1.67 亿个包 (`mps`)。\n\n#### AWS 攻击\n\n同样在 2020 年，Amazon Web Services 遭受了大规模 `DDoS`\
  \ 攻击。使用的技术之前讨论过的“无连接轻量级目录访问协议反射”。该攻击来自全球 `Mirai` 僵尸网络，每秒发送了 1720 万次请求。\n\n#### 波士顿环攻击\n\
  \n2017 年 11 月 8 日，《波士顿环》（`Boston Globe`）遭受了针对 [bostonglobe.com](http://bostonglobe.com)\
  \ 以及该公司其他网站的大规模 `DDoS` 攻击。该攻击还中断了公司的电话。直到公司的互联网服务提供商实施了反 `DDoS` 措施（如限制带宽），攻击才被停止。\n\
  \n#### Memcache 攻击\n\n2017 年 2 月，出现了一种新的 `DDoS` 攻击向量。攻击者使用数据库缓存系统 `memcache` 来放大流量体积。通过这种方法，一个请求可以被放大数千倍。上述的\
  \ GitHub 攻击就涉及了 `memcaching`。*\n\n#### DDoS 勒索\n\n2015 年 11 月，澳大利亚公司 `FastMail`\
  \ 成为 `DDoS` 攻击的受害者。首先，系统遭到攻击并离线。在第二次攻击后，受害者收到了赎金要求。攻击者要求支付 20 个比特币以停止攻击。此前还对 `Protonmail`\
  \ 发起过类似的攻击，同样索要赎金以停止攻击。\n\n#### Mirai\n\n`Mirai` 是一种恶意软件，它可以将基于 `Linux` 的机器变成僵尸网络，用于\
  \ `DDoS` 攻击。这最早出现在 2016 年 8 月。这种恶意软件以物联网 (`IoT`) 设备作为 `DDoS` 攻击的基础。\n\n### 如何防御\
  \ DoS 攻击\n\n没有一种保证可以防止所有的 `DoS` 攻击，就像没有一种保证防止黑客攻击的方法。但是，你可以采取一些步骤来降低危险。文中已经提到了一些方法，例如\
  \ `SYN cookies` 和 `RST cookies`。在本节中，将检查你可以采取的步骤，使你的系统不易受到 `DoS` 攻击。\n\n你需要考虑的事情之一是这些攻击是如何实施的。它们可能通过在互联网上发送错误信息的\
  \ `ICMP` 包执行，或者由 `ping` 和 `traceroute` 实用程序发送。如果你有一个防火墙（你应该有一个），那么简单地配置它拒绝来自网络外部的\
  \ `ICMP` 包将是保护你的网络免受 `DoS` 攻击的一大步。由于 `DoS/DDoS` 攻击可以通过多种协议执行，你也可以配置防火墙不允许任何入站流量，无论发生在何种协议或端口。这一步可能看起来很激进，但无疑是安全的。\n\
  \n#### 实践中\n\n### 阻止 ICMP 包\n\n极少有合法的理由（而且有人会认为没有好的理由）让来自网络外部的 `ICMP` 包进入你的网络。因此，阻止此类包通常被用作防御\
  \ `DoS` 攻击策略的一部分。顺便说，这会让攻击者扫描你的网络变得困难（我们将在第 12 章讨论）。\n\n使用 `NetStat` 等信息工具也可以检测来自某些\
  \ `DoS` 工具（如 `TFN2K`）的威胁。许多此类工具可以配置为寻找 SYN_RECEIVED 状态，这可能是 SYN 洪水攻击。\n\n如果你的网络大到有内部路由器，那么你可以配置这些路由器阻止任何并非来自你内部的流量。这样，即使数据包通过了你的防火墙，也不会在网络中传播。你还应该考虑禁用路由器上的定向\
  \ IP 广播。这种策略将防止路由器向网络上的所有机器发送广播包，从而停止许多 DoS 攻击。此外，你可以在路由器上安装过滤器，验证外部包确实具有外部 IP 地址，内部\
  \ IP 地址具有内部 IP 地址。\n\n- 始终使用病毒扫描软件并保持更新。\n- 始终保持操作系统和软件补丁更新。\n- 制定组织政策，除非经过 IT 人员，否则员工不能在机器上下载任何内容。\n\
  \n黑洞（Blackholing）和汇聚（Sinkholing）是经常用于缓解 `DoS` 和 `DDoS` 攻击的技术。如果流量被确定为 `DoS` 攻击，该流量将被发送到黑洞*——即一个不存在的服务器/接口。这通常由互联网服务提供商执行。*汇聚点（Sinkholes）是用于分析流量并拒绝恶意包的\
  \ IP 地址。流量被发送到汇聚点以便进行分析。\n\n\n\n\n如前所述，这些步骤都不能让你的网络完全免于成为 `DoS` 攻击的受害者或成为此类攻击的发起点，但它们将有助于降低这些情况发生的概率。在网络中使用\
  \ `IPS` 并结合 `ISP` 的黑洞（blackholing）和吸引（sinkholing）可以提供合理的保护。关于此主题的一个良好资源是 `SANS Institute`\
  \ 网站，地址为 [www.sans.org/dosstep/](http://www.sans.org/dosstep/)。该网站提供了关于如何防止 `DoS`\
  \ 攻击的一些技巧。\n\n## 总结\n\n`DoS` 攻击是网上最常见的攻击之一。它们易于实施，对实施者不需要很高的技术，并且会对目标系统造成破坏性影响。只有病毒攻击比它们更常见。（而且在某些情况下，病毒可以是\
  \ `DoS` 攻击的源头。）在练习中，你将练习停止 `DoS` 攻击。\n\n### 测试你的技能\n\n### 单选题\n\n1. 在考虑可能在你的系统上执行的各种攻击时，了解哪些攻击是最常见的是非常重要的。在以下选项中，哪种是对系统最常见且简单的攻击之一？\n\
  \nA. 拒绝服务攻击\n\nB. 缓冲区溢出\n\nC. 会话劫持\n\nD. 密码破解\n\n2. 所有的 `DoS` 攻击都建立在超出系统工作负载能力的基础上。因此，测量系统的工作负载至关重要。以下哪种不是定义计算机工作负载的有效方法？\n\
  \nA. 同时在线用户数\nB. 存储容量\nC. 最大电压\nD. 网络连接速度\n\n3. 你把从几台机器同时发起的 `DoS` 攻击称为什么？\n\nA.\
  \ 广域攻击\nB. 呆鱼攻击 (Smurf attack)\nC. `SYN flood`\nD. `DDoS` 攻击\n\n4. 了解不同类型的 `DoS`\
  \ 攻击及其症状是非常重要的。连接半开状态是哪种类型攻击的症状？\n\nA. 呆鱼攻击\nB. 部分攻击\nC. `SYN flood` 攻击\nD. `DDoS`\
  \ 攻击\n\n5. 虽然执行 `DoS` 攻击的方法有很多，但它们都基于同一个想法。`DoS` 攻击背后的基本概念是什么？\n\nA. 计算机不能很好处理 `TCP`\
  \ 数据包。\nB. 计算机只能处理有限的负载。\nC. 计算机无法处理大量的 `TCP` 流量。\nD. 计算机无法处理大负载。\n\n6. 从攻击者的角度来看，`DoS`\
  \ 攻击中最显著的弱点是什么？\n\nA. 攻击往往失败。\nB. 攻击很难执行。\nC. 攻击很容易停止。\nD. 攻击必须持续。\n\n7. 最常见的 `DoS`\
  \ 攻击类型是什么？\n\nA. 分布式拒绝服务攻击\nB. 呆鱼攻击\nC. `SYN floods`\nD. 死亡之源 (Ping of death)\n\n\
  8. 一系列防御措施可以帮助防御 `DoS` 攻击。防止 SYN 攻击的三种方法是什么？\n\nA. `DoS cookies` 和 `栈调优 (stack tweaking)`\n\
  B. `SYN cookies` 和 `栈调优 (stack tweaking)`\nC. `DoS cookies` 和 `栈删除 (stack deletion)`\n\
  D. `SYN cookies` 和 `删除 (deletion)`\n\n9. Juan 正在向他的公司解释各种 `DoS` 攻击。哪种攻击使用了它自己的？\n\
  \nA. `SYN flood`\nB. 死亡之源\nC. 呆鱼攻击\nD. `DDoS`\n\n10. 哪种防御依赖于发送客户端？\n\nA. 栈调优 (stack\
  \ tweaking)\nB. `RST cookies`\nC. `SYN cookies`\nD. `Hash tweaking`\n\n11. 哪种防御依赖于发送客户端？\n\
  \nA. 栈调优 (stack tweaking)\nB. `RST cookies`\nC. `SYN cookies`\nD. `Hash tweaking`\n\
  \n12. 你正在尝试向技术人员解释各种 `DoS` 攻击。什么取决于服务器？\n\nA. 栈调优 (stack tweaking)\nB. `RST cookies`\n\
  C. `SYN cookies`\nD. `Hash tweaking`\n\n13. 哪种攻击类型依赖于发送大数据包？\n\nA. 死亡之源\nB. 呆鱼攻击\n\
  C. `Slammer attack`\nD. `DDoS`\n\n14. 你想确保团队可以识别 `DoS` 攻击。哪种攻击使用了它自己的？\n\nA. 死亡之源\n\
  B. 呆鱼攻击\nC. `Slammer attack`\nD. `DDoS`\n\n15. 如果你是一个担心 `DoS` 攻击的网站开发者，你可以实施什么？\n\
  \nA. 带宽限制 (Throttling)\nB. Web 防火墙\nC. 使用 HTTPS 加密\nD. 验证码 (Captcha)\n\n16. 加固路由器如何帮助防止\
  \ `DoS` 攻击？\n\nA. 如果路由器是安全的，攻击就不会发生。\nB. 因为攻击源自外部，加固路由器没有帮助。\nC. 加固路由器只会停止 `DoS`\
  \ 攻击。\nD. 它将阻止跨段。\n\n17. 你可以使用防火墙防御哪些 `DoS` 攻击？\n\nA. 禁止所有加密流量\nB. 禁止所有来自外部的流量\n\
  C. 禁止所有来自内部的流量\nD. 禁止不可信源的流量\n\n18. Dorothy 是一名网络管理员。她的系统受到了使用机器人发送请求的攻击。这导致了资源中断。这种攻击如何描述？\n\
  \nA. `PDoS`\nB. `DDoS`\nC. `EDoS`\nD. `DoS`\n\n19. 没有任何攻击缓解策略是完美的，你需要允许某些流量进入网络，否则网络将毫无用。你可以通过防火墙防御哪些攻击？\n\
  \nA. 禁止所有入站流量\nB. 禁止所有入站 `TCP` 数据包\nC. 禁止入站 80 端口流量\nD. 禁止所有入站 `ICMP` 数据包\n\n20.\
  \ 你正在识别所有潜在的 `DoS` 攻击向量。在此过程中，你希望为每个向量提供缓解措施。为什么防御木马攻击会减少 `DoS` 攻击？\n\nA. 许多拒绝服务攻击是通过使用木马让不知情的机器执行\
  \ `DoS` 攻击的。\nB. 如果你能停止木马攻击，也将停止 `DoS` 攻击。\nC. 木马通常会打开端口，从而允许 `DoS` 攻击。\nD. 木马的效果与\
  \ `DoS` 攻击非常相似。\n\n### 练习\n\n练习 4.1：执行 DoS 攻击\n\n注意，此练习最好在有可用机器的实验环境中进行。\n\n1. 设置一台机器（最好是容量有限的机器）运行一个小型\
  \ Web 服务器。（你可以从 [www.apache.org](http://www.apache.org) 为 Windows 或 Linux 免费下载 Apache。）\n\
  \n2. 使用其他计算机上的 `ping` 工具尝试对该 Web 服务器执行简单的 `DoS` 攻击。这种尝试通过让其他机器开始对目标机器进行持续 ping 来，使用命令：\n\
  ```\nping -l 65000 -w0 -t <target address>\n```\n\n3. 你每次只向“攻击”添加一到三台实验机器。（从一台开始，增加几台，再增加几台。）\n\
  \n\n\n4. 随着机器数量的增加，请记录另一台机器打开目标服务器主页所需的时间。同时请注意阈值（即该服务器完全停止响应的时间）。\n\n## 练习 4.2：停止\
  \ SYN 洪水攻击\n\n请注意，此练习属于高阶内容。某些学生可能希望分组进行。\n\n1. 在网络或你的操作系统的文档中搜索关于实现 `RST cookie`\
  \ 或 `SYN cookie` 的说明。\n2. 在你自己的机器或教师指定的机器上遵循这些实现说明。以下网站可能对你有所帮助：\n- **Linux:** [www.linuxjournal.com/article.php?sid=3554](http://www.linuxjournal.com/article.php?sid=3554)\n\
  - **Windows:** [`cr.yp.to/syncookies.html`](http://cr.yp.to/syncookies.html) 和 [www.securityfocus.com/infocus/1729](http://www.securityfocus.com/infocus/1729)\n\
  - **Linux 和 Windows 均:** [www.securiteam.com/tools/6D00K0K01O.html](http://www.securiteam.com/tools/6D00K0K01O.html)\n\
  \n## 练习 4.3：使用防火墙设置\n\n此练习仅适用于可以使用实验室防火墙的学生。\n\n1. 使用你防火墙的文档查看如何拦截 `ICMP` 数据包。\n\
  2. 设置你的防火墙拦截这些数据包。\n\n## 练习 4.4：使用路由器设置\n\n此练习仅适用于可以使用实验室路由器的学生。\n\n1. 使用你路由器的文档查看如何拦截所有非源自你网络的流量。\n\
  2. 设置你的路由器拦截该流量。\n\n### 项目\n\n### 项目 4.1：采用替代防御措施\n\n1. 使用网络或其他研究工具，搜索防御通用 `DoS`\
  \ 攻击或特定类型 `DoS` 攻击的替代手段。这可以是本章中未提到的任何其他防御方法。\n2. 撰写一篇关于该防御技术的简短论文。\n\n### 项目 4.2：防御特定的拒绝服务攻击\n\
  \n1. 使用网络或其他工具，寻找在过去 6 个月内发生的 `DoS` 攻击。你可以在 [www.f-secure.com](http://www.f-secure.com)\
  \ 找到一些资源。\n2. 注意该攻击是如何进行的。\n3. 编写一份简短说明，你可能如何防御该特定攻击。\n\n### 项目 4.3：加固 TCP 栈以防止\
  \ DoS\n\n请注意，此项目需要访问实验室机器。它还是一个长期项目，需要学生花费一些研究时间。\n\n1. 使用手册、厂商文档和其他资源，寻找一种更改 `TCP`\
  \ 通信以帮助 `DoS` 攻击的方法。\n2. 利用这些信息，在你的实验室计算机上实现这些方法之一。\n\n## 案例研究\n\nRuna Singh 是一家中型公司负责网络安全的网络管理员。该公司已经有了防火墙，其网络被路由器划分为多个段，并且所有机器都安装了更新过的病毒扫描程序。Runa\
  \ 想采取额外措施来防止 `DoS` 攻击。她采取了以下行动：\n\n- 她调整了防火墙，不允许任何入站的 `ICMP` 数据包。\n- 她更改了 Web 服务器，使其使用\
  \ `SYN cookies`。\n\n现在考虑以下问题：\n\n1. 她的任何预防措施是否存在问题？如果有，问题是什么？\n2. 你向 Runa 建议哪些额外步骤？\n\
  \n# 第 5 章：恶意软件\n\n### 本章目标\n\n在阅读本章并完成练习后，你将能够做到：\n\n- 理解病毒（蠕虫）以及它们如何传播，包括著名的病毒如\
  \ `WannaCry`、`Pegasus` 和 `Titanium`\n- 掌握几种特定病毒爆发的实用知识\n- 理解病毒扫描程序的动态机制\n- 理解什么是`木洛马`（Trojan\
  \ horse）以及它是如何运行的\n- 掌握几种特定`木洛马`攻击的实用知识\n- 理解勒索软件以及勒索软件的最新趋势\n- 掌握缓冲区溢出攻击背后的概念\n\
  - 更好地了解间谍软件以及它是如何进入系统的\n- 通过良好的实践、防病毒软件和反间谍软件来防御这些每种攻击\n\n### 引言\n\n在第 4 章“拒绝服务攻击”]中，我们研究了拒绝服务（`DoS`）攻击，这是一种非常常见且容易实施的攻击。在本章中，我们将继续通过查看其他几种类型的攻击来研究安全威胁。首先，你将学习病毒爆发。我们的讨论将集中在关于病毒攻击如何工作以及为何工作的信息上，包括通过`木洛马`进行部署。本章并不是一个“如何创建自己的病毒”的教程，而是对这些攻击底层概念的介绍，以及对某些特定案例的分析。\n\
  \n本章还将探索病毒、蠕虫、缓冲区溢出攻击、间谍软件和其他几种形式的恶意软件。每种形式都带来了独特的攻击方法，在防御系统时需要考虑每一种。通过扩展对它们工作原理的知识，你防御此类攻击的能力将增强。在章末的练习中，你将有机会研究病毒的预防方法，并尝试来自\
  \ `McAfee`、`Norton`、`AVG`、`Bitdefender`、`Kaspersky` 以及其他厂商的防病毒方法。\n\n在继续之前，有两个重要的事实需要注意。第一是现实中的恶意软件类别并不总是清晰的。例如，一个恶意软件可能结合病毒功能和间谍软件功能，并被用于发起\
  \ `DoS` 攻击。学习和理解这些类别仍然重要，但你还需要意识到许多现实案例之间存在交叉。第二个要记住的事实是恶意软件的世界是非常动态的。变化非常快。我们将查看一些在恶意软件历史上具有重要地位的示例，但保持关注并不断审查最新的病毒爆发是一个好习惯。\n\
  \n### 病毒\n\n根据定义，计算机病毒是一种自我复制的程序。某些来源将病毒定义为必须附加到另一个文件（如可执行文件）才能运行的文件。然而，这是不准确的。通常，病毒会有某些不愉快的功能，但自我复制和快速传播是病毒的特征。通常，这种增长本身就会对感染的网络造成问题。任何快速传播的病毒都会降低网络的功能和响应速度。仅仅通过超过网络设计的流量负载，网络就会变得暂时失效。\n\
  \n#### 病毒如何传播\n\n病毒通常主要通过少数方式传播。第一种是直接向你联系人中的每个人发送电子邮件。另一种方法是扫描你的计算机的网络连接，然后将其复制到你的计算机可以访问的网络其他机器上。病毒也可以存在于便携介质中，如\
  \ `USB` 设备或光介质。还可以将病毒伪装成合法文件；在这种情况下它被称为`木洛马`。有时网站会被感染病毒，当人们访问该网站时，该人的电脑就会被感染。\n\n\
  \n\n\n`email` 方法是病毒传播最常见的方法之一，而 `Microsoft Outlook` 可能是最经常受到此类病毒攻击的电子邮件程序。其原因与其说是\
  \ `Outlook` 存在安全漏洞，不如说是 `Outlook` 的操作非常方便。所有的 Microsoft Office 产品在设计时，都让为企业编写软件的合法程序员能够访问应用程序的许多内部对象，从而轻松地创建与\
  \ Microsoft Office 软件件内的应用程序集成的程序。例如，程序员可以编写一个程序，它可以访问 Word 文档、导入 Excel 表格，然后使用\
  \ Outlook 自动将生成的文档通过电子邮件发送给相关方。微软在让这一过程变得非常简单方面做得很好，通常完成这些任务只需要极少的编程工作。使用 `Outlook`，少于五行代码即可引用\
  \ `Outlook` 并发送电子邮件。这意味着一个程序可以导致 `Outlook` 本身在发送电子邮件，而用户对此一无所知。互联网上有大量的代码示例な展示了如何操作这一点，并且供人免费取用。正因如此，不需要非常高明的程序员也能访问你的\
  \ `Outlook` 通讯录并自动发送电子邮件。从本质上说，编程 Outlook 的便利性就是为什么会有这么多目标针对 `Outlook` 的病毒攻击。\n\n\
  虽然绝大多数病毒攻击是通过利用受害者现有的电子邮件软件传播的，但某些病毒爆发使用了其他传播方法，例如它们内部的电子邮件引擎。另一种病毒传播方法是病毒简单在网络中复制自己。通过多种途径传播的病毒爆发正变得越来越常见。交付载荷（payload）的方法可能相当简单，更多取决于终端用户的疏忽，而不是病毒编写者的技巧。诱导用户访问他们不应该访问或打开的文件是传递病毒的常用方法，而且完全不需要编程技巧。无论病毒到达你门口的方式如何，一旦它进入了你的系统，它就会尝试传播，并在许多情况下，还会尝试对你的系统造成某些伤害。一旦病毒进入你的系统，它可以执行任何合法程序可以执行的任何操作——因此它可能会删除文件、更改系统设置或造成其他伤害。\n\
  \n## 病毒类型\n\n有许多类型的病毒。在本节中，我们将简要介绍一些主要的病毒类型。病毒可以根据其传播方法或其在目标计算机上的活动进行分类。\n\n*  \
  \ **宏（Macro）**：宏病毒感染办公文档中的宏。许多办公产品（包括 Microsoft Office）允许用户编写名为宏的微程序。这些宏也可以被写成病毒。宏病毒被写入某些业务应用程序的宏中。例如，Microsoft\
  \ Office 允许用户编写宏来自动化某些任务。Microsoft Outlook 的设计使得程序员可以使用 Visual Basic 编程语言的子集，即 Visual\
  \ Basic for Applications（`VBA`）编写脚本。这种脚本语言实际上内置在所有 Microsoft Office 产品中。程序员还可以使用与之密切相关的\
  \ `VBScript` 语言。这两种语言都非常容易学习。如果此类脚本附在电子邮件中且收件者正在使用 `Outlook`，那么脚本就可以执行。该执行可以完成任何数量的操作，包括扫描通讯录、查找地址、发送电子邮件、删除电子邮件等。\n\
  \n*   **启动引导区病毒（Boot sector）**：顾如其名，这种病毒感染驱动器的引导区。此类病毒对于杀毒软件来说可能很难发现，因为大多数杀毒软件运行在操作系统内部，而不是引导区中。\n\
  \n*   **多部分病毒（Multi-partite）**：多部分病毒以多种方式攻击计算机，例如，感染硬盘的引导区和一个或多个文件。\n\n*   **内存驻留病毒（Memory\
  \ resident）**：内存驻留病毒安装自己，然后从计算机启动到关闭期间一直留在 RAM 中。\n\n*   **装甲病毒（Armored）**：装甲病毒使用使其难以分析的技术。代码混淆是其中一种方法。代码的编写使得如果病毒被反汇，代码将无法被追踪。压缩代码是病毒装甲的另一种方法。\n\
  \n*   **稀疏感染病毒（Sparse infector）**：稀疏感染病毒试图通过偶尔执行其恶意活动来规避检测。对于稀疏感染病毒，用户会看到短暂的症状，然后一段时间没有症状。在某些情况下，稀疏感染病毒针对特定程序，但病毒只在目标程序执行第\
  \ 10 次或第 20 次时执行。或者，稀疏感染病毒可能会爆发一次活动，然后休眠一段时间。这个主题有许多变体，但基本原理是相同的：减少攻击频率，从而减少被检测的机会。\n\
  \n*   **多态病毒（Polymorphic）**：多态病毒字面上会经常改变其形式以避免杀毒软件的检测。\n\n*   **变态病毒（Metamorphic）**：变态病毒是多态病毒的一种特殊情况，它会定期完全重写自己。此类病毒非常罕见。\n\
  \n*   **内存驻留病毒（Memory resident）**：内存驻留病毒加载到内存。如果此病毒是由宿主应用程序启动的，即使宿主应用程序已卸载并停止执行，内存驻留病毒仍会在内存中保持活跃。\n\
  \n这些主要类别定义了病毒的通用行为。无疑还有其他类别，但它们包含在上述列表的主要类别中。一个例子是空隙病毒（`cavity virus`），也称为空隙填充病毒（`space\
  \ filler virus`）。此类病毒寻找现有文件中的“空隙”以将病毒代码插入其中。之前列出的任何类别的病毒都可以作为空隙病毒进行安装。相反的方法是覆盖病毒（overwrite\
  \ virus）。这种种的病毒将完全覆盖现有的文件，通常是系统文件。\n\n## 病毒示例\n\n病毒攻击的威胁不言而喻。虽然有很多网页提供有关病毒的信息，但在我看来，只有少数网页能够持续提供最新、最可靠、最详细的病毒爆发信息。任何安全专业人员都会希望定期查看这些网站。您可以通过以下网站了解任何过去或现在的病毒：\n\
  \n*   `https://www.techneworld.com/perl/section/viruses-malware/`\n*   `https://us.norton.com/internetsecurity-malware-virus-faq.html?`\n\
  *   `https://www.us-cert.gov/publications/virus-basics`\n*   `https://www.cm-alliance.com/cybersecurity-blog/5-major-ransomware-attacks-of-2022`\n\
  *   `https://www.makeuseof.com/most-notorious-malware-attacks-ever/`\n\n接下来将查看若干真实的病毒爆发。我们将检查非常的病毒，以及一些\
  \ 10 多年前以前的例子。这应该让你对病毒在现实世界中的行为有一个相当全面的概述。\n\n### Black Basta\n\n\n\n\n这是一种于 2022\
  \ 年 4 月首次发现的勒索软件。这种勒索软件的一个显著特点是，它既有 Linux 版本也有 Windows 版本。当在 Windows 域控制器上时，`Black\
  \ Basta` 会创建一个组策略来禁用 `Windows Defender` 以及其他防病毒解决方案。这是该病毒特别有害的一个方面。该恶意软件的另一个危害方面是它既会窃取数据，又加密计算机文件索要赎金。如果不支付赎金，犯罪者将开始泄露被盗的数据。\n\
  \n## Titanium\n\n2019 年 11 月，卡巴斯实验室报告了 `Titanium`，这是一种后门恶意软件高级持续性威胁（APT）。APT 简单来说就是长时间运行的高级攻击。`Titanium`\
  \ 分多个阶段安装。其大部分内容隐藏在一个载体图像文件中，通常是 `PNG`。一旦进入计算机，它就会窃取计算机上的文件，因此成为间谍软件。正如你在本章中看到的，恶意软件属于多个类别是非常常见的现象。它还会更改受感染计算机上的配置设置，并从远程控制服务器接收命令。\n\
  \n## WannaCry\n\n这是 2017 年的大新闻。2017 年 3 月，`WannaCry` 在一场活动风暴席席全球。然而，这种病毒在未来许多年里都将被研究。有几个原因。这种病毒值得关注的第一个原因是，它所利用的漏洞已经有一个补丁，而且该补丁已经发布了数周。这说明了为什么补丁管理是网络安全中如此重要的部分。\n\
  \n`WannaCry` 病毒有一个奇怪的特征：它内置了一个杀开关。如果注册了一个特定的 `URL`，就会杀死 `WannaCry`。一个名叫 `Marcus\
  \ Hutchins` 的人意外发现了这个杀开关并停止了 `WannaCry`。`Hutchins` 最初被誉为英雄，但后来因开发和销售银行木马恶意软件（与 `WannaCry`\
  \ 无关）被 `FBI` 逮捕。\n\n## Petya\n\n`Petya` 发现于 2016 年，但一直持续传播到 2018 年。它针对 Windows 机器，感染引导扇并加密硬盘的文件系统。然后，它要求用\
  \ `bitcoin` 支付赎金。这是一个病毒结合多种特征的极佳示例。该病毒的名字源自 1995 年的詹姆斯·邦电影《金眼杀》，电影中 `Petya` 是苏联武器卫星之一。\n\
  \n## Shamoon\n\n`Shamoon` 病毒首次发现于 2012 年，一个变体在 2017 年再次出现。`Shamoon` 作为间谍软件运行，但在将文件上传到攻击者后会删除。该病毒攻击了\
  \ `Saudi Aramco` 工作站，一个名为“正义之剑”的小组声称负责攻击。\n\n## Rombertik\n\n`Rombertik` 在 2015\
  \ 年造成了破坏。这种恶意软件利用浏览器读取用户访问网站的凭据。它通常以电子邮件附件的形式发送。糟糕糟糕，在某些情况下 `Rombertik` 会覆盖硬盘上的主引导记录，导致机器无法启动，或者开始加密用户主目录下的文件。\n\
  \n## Gameover ZeuS\n\n`Gameover ZeuS` 是一种创建点对点僵尸网络的病毒。本质上，它在受感染计算机与命令控制计算机之间建立加密通信，允许攻击者控制各种受感染计算机。（命令控制计算机是僵尸网络中用于控制其他计算机的计算机。这些是管理僵尸网络的中心节点。）2014\
  \ 年，**美国司法部**能够暂时关闭与命令控制计算机的通信；随后在 2015 年，`FBI` 宣布提供 300 万美元奖金，征集捕获涉嫌参与 Gameover\
  \ ZeuS 的 `Evgeniy Bogachev` 的信息。\n\n## CryptoLocker and CryptoWall\n\n广为人知的勒索软件示例是最臭名的\
  \ `CryptoLocker`，首次发现于 2013 年。`CryptoLocker` 利用非对称加密来锁定用户文件。目前已发现多种 `CryptoLocker`\
  \ 变体。\n\n`CryptoWall` 是 `CryptoLocker` 的变体，首次发现于 2014 年 8 月。它的看起来和行为与 `CryptoLocker`\
  \ 非常相似。然而，除了加密敏感文件外，它还会与命令控制服务器通信，甚至对受感染机器截图。截至 2015 年 3 月，发现了一个 `CryptoWall` 变体，与间谍软件\
  \ `TSPY_FAREIT.YOI` 捆绑在一起；该变体在扣留文件索要赎金之外，实际上还会从受感染系统中窃取凭据。\n\n## IoT Malware\n\n\
  随着 IoT 设备的蓬勃使用，这些设备成为恶意软件的目标并不意外。可能最广为人知的 IoT 恶意软件是 `Marai`。在整个 2016 年中，`Marai`\
  \ 感染了运行 `Linux` 的 IoT 设备，将它们变成可以远程控制的机器人。这些设备随后被用作 `DDoS` 攻击的一部分。\n\n虽然 `Marai`\
  \ 值得关注，但它并不是第一个。从 2014 年到 2016 年 `BASHLITE` 困扰着 IoT 设备。这种恶意软件用 `C` 编写，可以编译到多种架构和操作系统。它主要被用于发起拒绝攻击。\n\
  \n## Atlanta’s Ransomware Attack\n\n佐治亚州亚特兰大市在 2018 年 3 月遭受了勒索软件攻击。该市许多系统受到影响，包括公用事业、法院和其他基本系统。两名伊朗黑客\
  \ `Faramarz Savandi` 和 `Mohammed Mansouri` 因该攻击被起诉。这次攻击值得关注的原因有几个。第一，它使用了 `SamSam`\
  \ 勒索软件，该软件不是通过钓鱼而是通过暴力破解密码获取系统访问权限。第二个问题是，亚特兰大市曾因在安全方面的投入不足而受到批评。攻击发生前仅 2 个月的审计发现了\
  \ 1500 到 2000 个漏洞。\n\n## Mindware\n\n2022 年，`Mindware` 成为重大威胁。使用这种勒索软件的攻击从 2022\
  \ 年 3 月和 4 月开始引起注意。其他目标外，`Mindware` 还用于非营利心理健康提供者。除了勒索软件，该恶意软件还会窃取数据。被 `Mindware`\
  \ 窃取的金融和制造业受害者数据已发布在互联网上。每个 `Mindware` 载荷都是针对特定目标配置的。这在勒索软件领域相当罕见。\n\n## Thanatos\n\
  \n这种勒索软件首次于 2018 年。文件被加密，然后在桌面放置一个 `readme.txt` 文件。该文件有一条简短的消息，指示受害者付费以释放其文件。密钥实际上隐藏在执行攻击的犯罪分子控制的远程服务器上。支付方式为\
  \ `Bitcoin`。与之前的勒索攻击不同，`Thanatos` 背后的攻击者即使收到赎金后通常也不解密文件。\n\n## Clop\n\n有时拼作 `Cl0p`（用零代替\
  \ o）。`Clop` 2019 年首次作为 `CryptoMix` 勒索软件家族的变体出现。`CryptoMix` 勒索软件家族最早于 2016 年出现。`Clop`\
  \ 从 2021 年开始广泛出现。除了加密文件外，`Clop` 还会阻塞约 600 个 `Windows process`。估计截至 2021 年 11 月，由于\
  \ `Clop` 已支付了超过 5 亿美元的赎金。`Clop` 的新变体正在整个网络。`Clop` 的有趣方面是它是作为“勒索软件即服务”运行的。荷兰的马斯里希特大学遭受了\
  \ `Clop` 的攻击。\n\n## FakeAV\n\n虽然 `FakeAV` 病毒已经存在多年，但非常值得研究。这种病毒首次出现于 2012 年 7 月，影响了从\
  \ `Windows 95` 到 `Windows 10` 以及 `Windows Server 2016` 的 `Windows` 系统。它是一个伪防病毒软件（因此名为\
  \ `FakeAV`），会弹出虚假的病毒警告。这不是第一个这种伪防病毒恶意软件，但它是该类型的一个成功的案例。\n\n\n\n\n### MacDefender\n\
  \nMacDefender 病毒由于多个原因而非常奇特。首先，它专门针对 Mac 电脑。长期以来，大多数专家认为，Apple 产品之所以保持相对无病毒，仅仅是因为它们的市场份额还不足以吸引病毒撰写者的关注。许多人怀疑，如果\
  \ Apple 获得更大的市场份额，它也将开始遭受更多的病毒攻击，而事实已被证明是如此的。\n\nMacDefender 病毒最早于 2011 年初出现，直到今天仍能看到它的变体。它被嵌入在某些网页中，当用户访问这些网页时，她会看到一个虚假的病毒扫描结果，告诉她她感染了病毒并需要修复。所谓的“修复”实际上是下载一个病毒。该病毒的目的是让终端用户购买\
  \ `MacDefender` “防病毒”产品。这是该案例值得关注的第二个原因。虚假防病毒软件攻击（也称为**恐吓软件** `scareware`）正变得越来越常见。\n\
  \n### Kedi RAT\n\n2017 年 9 月，Kedi RAT（远程访问木马程序）病毒通过钓鱼邮件进行传播。一旦进入受感染的系统，它就会窃取数据，然后通过\
  \ `Gmail` 账户发送邮件将这些数据外泄。它专门尝试识别受感染系统上的个人和/或财务数据并出售。\n\n#### FYI：毒性病毒\n\n`virulent`（毒性）一词在指代计算机病毒时与指代生物病毒时的含义基本相同：它是衡量感染扩散速度快慢以及感染新目标难易程度的指标。\n\
  \n在 `Sobig` 案例中，如果网络上的某个人不幸地打开了包含该病毒的邮件，不仅他的机器会被感染，该人员可以访问的网络上的每个共享驱动器都会被感染。然而，`Sobig`\
  \ 与大多数其他通过邮件传播的病毒攻击一样，在邮件主题或标题中具有明显的特征，这些特征可以用来识别该邮件是否被病毒感染。该邮件通常会有一些诱人的标题，例如“这里是样本”或“该文档”，以引发你的好奇心去打开附件。随后，病毒会将自己复制到\
  \ `Windows System` 目录中。\n\n这种特定的病毒传播范围之广，感染了如此多的网络，以仅仅病毒的多次复制就足以让某些网络陷入停滞状态。这种病毒并没有破坏文件或损坏系统，但它产生了大量的流量，导致其所感染的网络拥堵。病毒本身具有中等复杂性。然而，一旦它出现，许多变体开始涌现，使情况变得更加复杂。`Sobig`\
  \ 某些变体的影响之一是从互联网下载一个文件，该文件会导致打印问题。某些网络打印机会直接开始打印垃圾信息。`Sobig.E` 变体甚至写入 `Windows Registry`（\
  \ 注册表），使其在计算机启动时运行。这些复杂的特性表明，创建者知道如何访问 `Windows Registry`、访问共享驱动器、修改 `Windows startup`（启动启动）以及访问\
  \ `Outlook`。\n\n这引出了病毒变体以及它们如何产生的问题。在生物病毒的情况下，遗传代码的突变导致新病毒毒株的出现，自然选择的压力允许其中一些毒株进化成完全新的病毒物种。显然，生物学方法并不是计算机病毒发生的情况。对于计算机病毒，某些具有恶意意图的无畏程序员获得了一个病毒副本（可能是她自己的），一旦病毒发布，许多变体开始涌现，使情况变得更加复杂。由于病毒代码是可读且可修改的，某些程序员可以编写代码并发布病毒。在本文作者看来，这种病毒并非出自业余爱好者，而是具有专业编程水平的人。\n\
  \n### Shlayer\n\n这种病毒在 2018 年首次被发现。它利用了一个漏洞，直到 2021 年 4 月才被修补。这种病毒针对 `MacOS` 并具体作为一种下载器运行。\n\
  \n### Mimail 病毒\n\nMemail 是另一种值得研究的老旧病毒。Memail 病毒并没有像 `Sobig` 那样获得大量的媒体关注，但它具有一些有趣的特征。Memail\
  \ 通过你的通讯录收集地址，还从你机器上的其他文档中收集地址。无论你使用什么邮件客户端，Memail 都会传播。这种病毒与大多数病毒的区别使得 `Memail`\
  \ 对研究病毒的人来说很有吸引。事实上，Memail 的代码是可编写的。在本文作者看来，Memail 并非业余爱好者的作品，而是具有专业编程水平的人。\n\n\
  ### 非病毒病毒\n\n另一种病毒类型在过去几年变得流行，那就是“非病毒”，或者简单来说，就是一个骗局。黑客向他拥有的每个地址发送邮件。该邮件声称来自某个知名的防病毒中心，警告有一种正在传播的新病毒。邮件指示人们从计算机中删除某个文件以消除病毒。然而，该文件实际上并不是病毒，而是系统的一部分。`jdbgr.exe`\
  \ 病毒骗局使用了这种手段。它鼓励读者删除一个系统实际上需要的文件。令人惊讶的是，许多人遵循了建议，不仅删除了文件，还立即向他们的朋友和同事发送邮件，警告他们从机器上删除该文件。\n\
  \n#### FYI：Morris 网络蠕虫\n\nMorris 蠕虫是第一个通过互联网传播的计算机蠕虫之一——它是第一个获得重大媒体关注的蠕虫。\n\nRobert\
  \ Tappan Morris, Jr. 是康康大学的学生编写了这种蠕虫，并于 1988 年 11 月 2 日从 `MIT` 系统发布了它。Morris 并没有打算通过蠕虫造成损害。相反，他想让蠕虫揭示它所利用程序的漏洞。然而，代码中的漏洞允许单台计算机被多次感染，蠕虫变成了一种威胁。每次额外的“感染”都会在受感染的上产生一个新的进程。在某个时刻，受感染机器上运行的大量会导致会导致缓慢到无法使用。至少有\
  \ 6000 台 `UNIX` 机器感染了这种蠕虫。\n\nMorris 被判定违反了 1986 年的计算机欺诈和滥用法，被判处 10000 美元罚款、三年缓刑和\
  \ 400 小时的社区服务。但这种蠕虫最大的影响可能是它导致了计算机应急响应小组（CERT）的建立。`CERT` ([`www.cert.org`](http://www.cert.org))\
  \ 是一家位于卡内基梅隆大学的组织，是安全公告、信息和指南的库。`CERT` 是任何安全专业人员应该熟悉的来源。\n\n### Flame\n\n\n\n\n\
  任何关于病毒的现代讨论，如果没有对 `Flame` 的讨论，都是不完整的。虽然这是几年前的事了，但它对于理解病毒仍然至关重要。这种病毒首次出现在 2012 年，目标是\
  \ Windows 操作系统。让这种病毒引人注目的第一个特点是，它是美国政府专门为了间谍活动而设计的。它在 2012 年 5 月在多个地点被发现，其中包括伊朗政府网站。`Flame`\
  \ 是一种间谍软件，可以监控网络流量并对受感染的系统进行截图。\n\n## 最早的病毒\n\n考虑发现的最早病毒是非常很有意义的。1971 年，Bob Thomas\
  \ 创建了被广泛认为是第一个计算机病毒的程序，名为 `Creeper`。它通过 `ARPANET`（互联网的前身）传播，并显示一条信息：“我是 creeper，有能的就抓住我吧！”\
  \ 随后创建了一个名为 `Reaper` 的程序，用来删除 `Creeper`。\n\n1974 年发现的 `Wabbit` 会创建自己的多个副本，从而对受感染计算机的性能产生不利影响。\n\
  \n`Apple Viruses 1`、`2` 和 `3` 是最早出现在“野外”或公共领域的某些病毒。这些病毒于 1981 年在 Apple II 操作系统上发现，通过德克萨斯农业农立大学（Texas\
  \ A&M）的盗版电脑游戏进行传播。\n\n## 病毒的影响\n\n2018 年初，台积电公司（全球最大的芯片制造商之一，苹果的供应商）表示其遭受了计算机病毒的攻击，该病毒影响了计算机系统和制造工具。估计损失超过\
  \ 1.7 亿美元。新闻报道没有描述具体的病毒，但单一公司受到单一病毒攻击并导致如此混乱，这说明了计算机病毒的危险性。\n\n## 机器学习与恶意软件\n\n\
  任何新技术最终都会被不道德的个人和群体所滥用。机器学习也不例外。2021 年的一关于“机器学习网络攻击”的论文指出：“针对受控信息的窃取攻击，随着信息泄露事件的日益增加，已成为近年来一种新兴的网络安全威胁。由于先进分析解决方案的蓬勃发展和部署，新型窃取攻击利用机器学习（`ML`）算法实现了高成功率并造成了巨大损害。检测和防御此类攻击具有挑战性且紧迫性，因此政府、组织和个人应该高度重视基于机器学习的窃取攻击。本调查介绍了这种新型攻击的最新进展以及相应的应对措施。本文从三类目标受控信息的角度回顾了基于机器学习的窃取攻击，包括受控用户活动、受控机器学习模型相关信息和受控身份验证信息。总结了近期发表的文献以概述通用的攻击方法论，并推导出基于机器学习的窃取攻击的局限性和未来方向。此外，提出了从检测、干扰和隔离三个方面开发有效保护的措施。”^(1)\n\
  \n^(1) [`arxiv.org/abs/2102.07969`](https://arxiv.org/abs/2102.07969)\n\n2020 年\
  \ 12 月，Panda Security 发布了一篇在线文章^(2)，警告称网络威胁的未来可能包括具有学习能力的恶意软件。文章预测，在未来几年可能会看到自学习恶意软件的使用，最早在\
  \ 2024 年就能看到使用机器学习恶意软件的大型攻击。2019 年发表在 ZDNet^(3)上的一篇为“对抗 AI：网络安全战即将到来”的文章概述了未来 AI\
  \ 和机器学习在进攻行动中的应用，并存在完全由 AI 执行攻击的可能性。\n\n^(2) [`www.pandasecurity.com/en/mediacenter/security/cyberthreats-learning-malware/`](https://www.pandasecurity.com/en/mediacenter/security/cyberthreats-learning-malware/)\n\
  \n^(3) [`www.zdnet.com/article/adversarial-ai-cybersecurity-battles-are-coming/`](https://www.zdnet.com/article/adversarial-ai-cybersecurity-battles-are-coming/)\n\
  \n## 避免病毒的规则\n\n你应该注意到所有病毒攻击（骗局除外）的一个共同主题：它们希望你打开某种附件。病毒传播最常见的方式是邮件附件。知道这一点，你可以遵循几条简单的规则来大幅降低感染病毒的概率：\n\
  \n- 使用病毒扫描软件。`McAfee` 和 `Norton`（在本章末尾的练习中探讨）是两种最广泛接受和使用的病毒扫描软件。然而，`Kaspersky` 和\
  \ `AVG` 也是良好的、声誉良好的选择。保持病毒扫描软件更新每年大约花费 30 美元。去这样做吧。每种杀毒产品都有支持者和反对者，我不会深入探讨哪种更好的意见。对于大多数用户来说，这四种主要的杀毒程序中的任何一种都是有效的。我会定期切换使用的程序，以便保持熟悉所有的软件。\n\
  \n- 如果你不确定某个附件，不要打开它。\n\n- 你甚至可以和朋友、同事交换密码。告诉他们，如果他们想给你发送附件，应该在邮件标题中放入密码。在没有看到密码的情况下，你不会打开任何附件。\n\
  \n- 不要相信给你的“安全警报”。`Microsoft` 不会这样发送警报。定期检查 `Microsoft` 网站以及提到的杀毒软件网站。\n\n这些规则不能让你的系统\
  \ 100%防病毒，但它们对保护系统很有帮助。\n\n### 特洛伊马回顾之前的章节，`Trojan horse` 是一个看似无害但实际上具有恶意目的程序的术语。我们已经见过通过特洛伊马传播的病毒。你可能会接收或下载一个看似无害的程序。更有可能是，特洛伊马只是附加在邮件中的脚本。当你运行程序或打开附件时，它会执行其他操作：\n\
  \n- 从网站下载有害软件。\n- 安装键盘记录器或其他监控程序。\n- 删除文件。\n- 为黑客使用开启后门。\n\n经常会发现病毒/特洛伊马的组合攻击。在这些情况下，特洛伊马像病毒一样传播。`MyDoom`\
  \ 病毒开启了机器上的一个端口，随后的病毒 `doomjuice` 利用了该端口，因此 `MyDoom` 是病毒和特洛伊马的结合。\n\n特洛伊马也可以针对个人进行定制。黑客可以专门设计吸引某人的注意力。例如，如果他知道该会计是一个高尔夫爱好者，他可以写一个计算差点并列出最佳高尔夫场的程序。他会将该程序发布在免费的服务器上。然后他会给包括会计在内的很多人发邮件，告诉他们这个免费软件。程序一旦安装，就可以检查当前登录的用户名。如果登录名与会计的姓名匹配，该程序就可以在用户不知情的情况下出去，下载键盘记录器或其他监控程序。如果该程序没有损坏文件或自我复制，那么它可能在很长一段时间都不会被察觉。多年来出现过许多特洛伊马。最早且最为人知的之一是\
  \ `Back Orifice`。\n\n**供你参考：病毒还是蠕虫？**\n\n\n\n正如第 4 章所示，专家们对于病毒和蠕虫之间的区别存在分歧。某些专家会将\
  \ `MyDoom`（以及稍后将讨论的 `Sasser`）称为蠕虫，因为它在没有人为干预的情况下传播。然而，我将病毒定义为任何可以自我复制的文件，将蠕虫定义为任何可以在没有人类干涉的情况下传播的程序。这也是你在安全专家中找到的最常见的定义。\n\
  \n这种程序几乎是任何一个中等水平程序员的技能范围内的。这也是许多机构规定禁止在公司机器上下载任何软件的原因之一。我并没听说过任何以这种方式量身定制特洛马的实际事件。然而，重要的是要记住，那些创建病毒攻击的人往往是具有创新精神的人。\n\
  \n同样重要的是，创建特洛马并不需要编程技能。互联网上有许多免费工具，例如 `EliteWrapper`，它们允许人们将两个程序结合起来——一个隐藏，另一个不隐藏。因此，人们可以轻松地取一个病毒并将其与例如扑克游戏结合。终端用户只会看到扑克游戏，但当它运行时，它就会启动病毒。\n\
  \n另一个需要考虑的情景是极具破坏性的一个。在不泄露编程细节的情况下，这里将概述基本前提，以说明特洛马的巨大危险。想象一个显示一系列奥萨马·本·拉丁丁难看照片的小型应用程序。这个应用程序可能会在美国许多人中受欢迎，特别是军方、情报部门或国防相关行业的人士。现在假设该应用程序只是在机器上静止运行一段时间。它不需要像病毒那样复制，因为计算机用户可能会将其发送给他的许多同事。在某个日期和时间，软件会连接到它能访问的任何驱动器（包括网络驱动器），并开始删除所有文件。如果这样一个特洛马在“野外”发布，在\
  \ 30 天内它可能会被发送给成千上万、甚至数百万。那数千或数百万计算机将开始删除文件和文件夹。想象一下那种破坏性。\n\n提到这种场景正是为了让你稍微感到恐惧。计算机用户（包括本该了解这些情况的专业人士）经常从网上下载各种东西，例如有趣的\
  \ Flash 视频和可爱的游戏。每当员工下载此类内容时，都有下载特洛马的风险。人们不需要统计学家也能意识到，如果员工继续这种做法足够长时间，他们最终会在公司机器上下载特洛马。如果他们真的做了，希望病毒不会像这里刚刚概述的理论病毒那样恶毒。\n\
  \n由于特洛马通常由用户自己安装，因此针对这种攻击的安全防御措施是防止终端用户下载和安装。从执法部门的角度来看，涉及特洛马的犯罪调查将涉及对计算机硬盘进行取证扫描，寻找特洛马本身。\n\
  \n有很多工具（其中一些可以免费下载）可以帮助人们创建特洛马。我在渗透测试课程使用的工具之一是 `eLiTeWrap`。它很容易使用。本质上，它可以将任何两个程序绑定在一起。使用这样的工具，任何人可以将病毒或间谍软件绑定到无害的程序中，例如共享软件扑克游戏。这将导致大量人员下载了他们认为是免费的游戏，并在不知情的情况下在自己的系统上安装了恶意软件。\n\
  \n`eLiTeWrap` 工具易于使用，但它非常强大。只需按照以下步骤操作：\n\n1. 输入你想运行的文件。\n2. 输入操作。\n3. 输入文件。\n4.\
  \ 输入操作。\n5. 输入文件。\n6. 输入操作。\n7. 输入文件。\n8. 输入操作。\n9. 输入文件。\n\n在图 5.1 中，你可以看到一个适用于课堂的演示。在这个例子中，两个无害的程序被结合在一起了。\n\
  \n![描述：了 LiteWrap 的命令提示窗口。窗口显示了存根大小、输出名称以及要插入的文件、操作详细信息。](img/05fig01.jpg)\n图 5.1\
  \ 的插图旨在展示创建特洛马是多么简单，而不是为了鼓励你这样做。理解这个过程有多简单至关重要，这样你就能理解恶意软件的普遍性。任何附件或下载内容都应该被高度怀疑。\n\
  \n### 缓冲区溢出攻击\n\n你已经了解了攻击系统的多种方法：拒绝服务、病毒和特洛马。虽然这些攻击可能是最常见的，但它们并不是唯一的方法。另一种攻击系统的方法被称为缓冲区溢出（或缓冲区越界）攻击。当某人试图向缓冲区存入超过其容纳能力的数据时，就会发生缓冲区溢出攻击。任何与互联网或私有网络通信的程序必须接收某些数据。这些数据至少临时存储在内存中称为“缓冲区”的空间里。如果编写应用程序的程序员足够小心，当你试图向缓冲区放入过多的信息时，这些信息要么被截断，要么被直接拒绝。考虑到目标系统中可能运行的应用程序数量以及每个应用程序中的缓冲区数量，至少有一个缓冲区没有被正确写入的概率足以让任何审慎的人感到担忧。\n\
  \n幸运的是，缓冲区溢出攻击的执行比 DoS 攻击或简单的 Microsoft Outlook 脚本病毒要困难。要创建一个缓冲区溢出攻击，你必须对某些编程语言有良好的实践知识（通常选择\
  \ `C` 或 `C++`），并足够了解目标操作系统/应用程序，以便知道它是否具有缓冲区溢出漏洞以及该漏洞可能如何被利用。\n\n\n\n必须注意的是，现代操作系统和\
  \ Web 服务器通常不会受到常见的缓冲区溢出攻击。`Windows 95` 相当容易受到攻击，但 Windows 操作系统容易受到攻击已经很多多年了。可以肯定，`Windows\
  \ 7`、`8` 或 `10` 不会受到此类攻击的影响。然而，对于所有运行在各种系统上开发的自定义应用程序，情况并不一定如此。任何联网应用程序（包括但不限于 Web\
  \ 应用程序）都有可能受到这种攻击。\n\n从根本上说，只有当程序员未能正确编写程序时，这种漏洞才会存在。如果所有程序都能截断多余的数据，那么该系统就无法执行缓冲区溢出。然而，如果程序不检查变量和数组的边界并允许加载过量数据，那么该系统就会受到缓冲区溢出攻击的威胁。\n\
  \n## Sasser 病毒/缓冲区溢出\n\nSasser 是一种旧的攻击，但它演示了缓冲区溢出攻击的使用。Sasser 是一种组合攻击，该病毒（或蠕虫）通过利用缓冲区溢出来传播。\n\
  \nSasser 病毒通过利用 Windows 系统程序中的已知漏洞进行传播。Sasser 将自己复制到 Windows 目录并命名为 `avserve.exe`，同时创建一个注册表项以便在启动时加载。因此，一旦你的机器被感染，每次启动机器都会运行该病毒。该病毒扫描随机\
  \ IP 地址，监听从 `1068` 开始的连续 TCP 端口，以寻找可被利用的系统——即尚未修复此漏洞的系统。一旦发现目标，蠕虫就会通过溢出 `LSASS.EXE`\
  \ 中的缓冲区来攻击该受漏洞系统，`LSASS.EXE` 是 Windows 操作系统的一个文件。该可执行文件是内置系统文件，也是 Windows 的一部分。Sasser\
  \ 还在 TCP 端口 `5554` 上作为 FTP 服务器，并在 TCP 端口 `9996` 上创建一个远程 shell。接下来，Sasser 在远程主机上创建一个名为\
  \ `cmd.ftp` 的 FTP 脚本并执行它。该 FTP 脚本指示目标受害者从受感染主机下载并执行蠕虫。受感染主机在 TCP 端口 `5554` 上接受此\
  \ FTP 流量。计算机还在 `C:` 盘上创建一个名为 `win.log` 的文件。该文件包含本地主的 IP 地址。病毒的副本会在 Windows 系统目录中创建，并命名为\
  \ `#_up.exe`。示例所示：\n\n- `c:\\WINDOWS\\system32\\12553_up.exe`\n- `c:\\WINDOWS\\\
  system32\\17923_up.exe`\n- `c:\\WINDOWS\\system32\\29679_up.exe`\n\n该病毒的副作用是会导致你的机器重启。如果一台机器在没有其他已知原因的情况下反复重启，那么它很可能感染了\
  \ Sasser 病毒。\n\n这是另一个一个可以通过多种手段轻松防止感染的案例。首先，如果你定期更新系统，这些系统就不应该受到该漏洞的威胁。其次，如果你确保你网络的路由器或防火墙阻止了涉及的端口（`9996`\
  \ 和 `5554`）上的流量，你就能防止 Sasser 大大部分损害。你的防火墙应该只允许指定端口的流量；所有其他端口都应关闭。简而言之，如果你作为网络管理员意识到了安全问题并采取审慎的步骤来保护网络，你的网络就是安全的。然而，有许多网络受到了这种病毒的影响，这表明还没有足够的管理员接受过适当的计算机安全培训。\n\
  \n### 间谍软件\n\n在第 1 章“计算机安全简介”中，间谍软件被提到为计算机安全的威胁之一。然而，使用间谍软件需要执行者具备比其他某些形式恶意软件多得的技术知识。执行者必须能够针对特定情况开发间谍软件，或根据其需求对现有的间谍软件进行定制。然后，他必须能够将间谍软件获取到目标机器。\n\
  \n间谍软件可以简单到只是网站用于记录你访问该网站的几个简短事实的 cookie，也可以是更隐蔽的类型，例如键盘记录器。回想第 1 章，键盘记录器是一个记录你在键盘上输入的每一个击键的程序；然后该间谍软件会将你的击键记录到间谍的文件中。键盘记录器最用途是捕获用户名和密码。然而，这种方法可以捕获你输入的每一个用户名和密码、你输入的每份文档，以及你可能输入的任何其他内容。这些数据可以存储在你机器上隐藏的小文件中以便日后提取，或者通过\
  \ TCP 数据包发送到预定义的地址。在某些情况下，软件甚至被设置为等到下班后将这些数据上传到某些服务器，或使用你自己的电子邮件软件将数据发送到匿名邮箱地址。还有一些键盘记录器会定期从你的机器上截图，显示你计算机上打开的任何内容。无论具体的运行模式如何，间谍软件都是从字面上监视你在特定计算机上活动的软件。\n\
  \n### 间谍软件的合法用途\n\n间谍软件有一些完全合法的用途。一些雇主已接受间谍软件作为监控员工使用公司技术的手段。许多公司选择监控组织内的电话、电子邮件或网络流量。请记住，计算机、网络和电话系统是公司或组织的财产，而不是员工的。这些技术通常应该只用于工作目的；因此，公司的监控可能不构成侵犯隐私。虽然法院维持这种监控是公司的权利，但在启动这种程度的员工监控之前，咨询律师是非常关重要的，同时还要考虑对员工士气的潜在负面影响。父母也可以选择在家庭计算机上使用这种软件来监控孩子在互联网上的活动。其目标通常是良好的应用——保护他们的孩子免受网络入侵者的侵害。然而，就像公司的员工一样，这种做法可能会引起被监视方（即他们的孩子）的强烈面反应。父母必须权衡对孩子的风险与可能被违背信任的行为。\n\
  \n### 间谍软件是如何递送到目标系统的？\n\n显然，间谍软件可以跟踪计算机上的所有活动，这些信息可以通过多种方法获取。真正的问题是：间谍软件最初是如何进入计算机系统的？最常见的方法是通过木马程序。也可能当你访问某个网站时，间谍软件会在你浏览该网站时在后台下载。当然，如果是雇主（或父母）安装间谍软件，它就可以以安装任何其他应用程序的方式公开安装。\n\
  \n### Pegasus\n\n这种间谍软件首次在 2016 年被发现，随后在 2022 年发现了变体。这种间谍软件用于手机，有适用于 iPhone 和 Android\
  \ 的版本。鉴于我们对移动设备的日益依赖，移动恶意软件至少与计算机恶意软件一样重要。2022 版本能够跟踪通话和位置、收集密码并读取短信。\n\n\n\n\n\
  鉴于文中提到的许多其他网络可用程序和工具，你可能不会惊讶地发现，可以在互联网上免费或极低成本获取许多间谍软件产品。你可以查看 Counterexploitation\
  \ 网站（[[www.cexx.org`](http://www.cexx.org)），见图 5.2，获取互联网上流传的已知间谍软件详细列表，以及关于你可以用于删除它们的信息。SpywareGuide\
  \ 网站（[[www.spywareguide.com](http://www.spywareguide.com))）列出了如果你认为有充分理由要监视某人的电脑活动，可以直接从网上获取的间谍软件。图\
  \ 5.3 显示了该网站提供的提供的恶意软件分类。该网站上列出了若干关键键盘记录器应用程序，如图 5.4 所示。这些应用程序包含了知名的键盘记录器，如 `Absolute\
  \ Keylogger`、`Tiny Keylogger` 和 `TypO`。大多数可以免费下载或支付象征性费用。\n\n![Description: 截图显示了\
  \ counterexploitation 网站。](img/05fig02.jpg)\n\n**图 5.2** *Counterexploitation 网站。*\n\
  \n![Description: 显示了 spywareguide 网站上恶意软件分类的截图。窗口中提到的类别列表有：面向成人、广告软件、数据挖掘器、拨号器、漏洞利用、忠诚软件、杂项安全和密码破解器。](img/05fig03.jpg)\n\
  \n**图 5.3** *SpywareGuide 网站上的恶意软件分类。*\n\n![Description: 截图显示了 spywareguide 网站上提供的键盘记录器列表。提到的四个记录器是\
  \ `eltc-elitekeylogger`、`keylogger WMRemote`、`L4D keylogger` 和 `Srv.SSA-keylogger`。每个记录器的危险程度也以名称旁边的数字形式给出。](img/05fig04.jpg)\n\
  \n**图 5.4** *通过 SpywareGuide 网站提供的键盘记录器列表。*\n\n该网站上列列出了一些知名的木马程序（如图 5.5 所示），例如 2nd\
  \ Thought 程序，它会下载到人的 PC 上并向其充斥广告。这种特定的间谍软件在你访问某些网站时会下载到你的 PC 上。它是良性的，因为它不会对你的系统或文件造成直接伤害；它也不会从你的\
  \ PC 中收集敏感信息。然而，它是极其烦人的，因为它会让你的机器充斥着不想要的广告。这类软件通常被称为 `adware`。通常情况下，这些广告无法通过正常的防护弹出拦截器来阻止，因为弹窗不是由你访问的网站生成的，而是由运行在你机器上的恶意软件生成的。弹出拦截器仅能阻止访问的网站打开新窗口。网站使用著名的脚本技术来导致你的浏览器打开窗口，而弹出拦截器可以识别这些技术并防止广告窗口打开。然而，启动新浏览器实例的广告软件会绕过拦截拦截的功能。\n\
  \n![Description: 截图显示了 spywareguide 网站上提供的键盘记录器列表。提到的四个记录器是 eltc-elitekeylogger,\
  \ keylogger WMRemote, L4D keylogger, 和 Srv.SSA-keylogger。每个记录器的危险程度也以名称旁边的数字形式给出。](img/05fig04.jpg)\n\
  \n**图 5.5** *spyware 网站上提供的木马程序。*\n\n### 其他形式的恶意软件\n\n该网站上也列出了一些知名的木马程序（如图 5.5 所示），例如\
  \ 2nd Thought 程序，它会下载到人的 PC 上并向其充斥广告。这种特定的间谍软件在你访问某些网站时会下载到你的 PC 上。它是良性的，因为它不会对你的系统或文件造成直接伤害；它也不会从你的\
  \ PC 中收集敏感信息。然而，它是极其烦人的，因为它会让你的机器充斥着不想要的广告。这类软件通常被称为 `adware`。通常情况下，这些广告无法通过正常的防护弹出拦截器来阻止，因为弹窗不是由你访问的网站生成的，而是由运行在你机器上的恶意软件生成的。弹出拦截器仅能阻止访问的网站打开新窗口。网站使用著名的脚本技术来导致你的浏览器打开窗口，而弹出拦截器可以识别这些技术并防止广告窗口打开。然而，启动新浏览器实例的广告软件会绕过拦截拦截的功能。\n\
  \n*(注：此处部分内容与前文存在重复，翻译时已按要求处理并保持格式)*\n\n### 其他形式的恶意软件\n\n在之前的章节中已经讨论了最著名的类型。本节将涉及一些`其他形式的恶意软件`。\n\
  \n#### 逻辑炸弹\n\n`logic bomb` 是一种恶意软件，在满足特定条件时执行其恶意目的。最常见的因素是 `date/time`。例如，`逻辑炸弹`可能会在特定的\
  \ `date/time` 删除文件。例如，在 2006 年 6 月，UBS 的系统管理员 Roger Duronio 被指控使用 `逻辑炸弹` 破坏公司的计算机网络。他的计划是由于\
  \ `逻辑炸弹` 造成的损害导致公司股价下跌，因此他被指控犯证券欺诈。Duronio 后被定罪，被判处 8 年 1 个月监，并被命令向 UBS 支付 310 万美元的赔偿。这一案例说明该问题并不新鲜。。\n\
  \n\n\n\n\n2017 年，来自佐治亚州亚特兰大的米特什·达斯（Mittesh Das）被发现因意图破坏美国陆军计算机而传输恶意代码。达斯先生创建了一个逻辑炸弹，旨在在他公司失去合同后删除美国陆军预备队工资系统中的文件。该事件实际上发生在\
  \ 2014 年。他被判处 2 年监禁，随后处以 3 年缓刑。\n\n尼梅什·帕特尔（Nimesh Patel）被指控在 2016 年创建了一个逻辑炸弹攻击其前雇主的服务器。据指控，他在离职后登录了网络并上传了恶意软件。该软件旨在删除\
  \ `Oracle` 数据库中的财务数据。\n\n另一个例子发生在抵押贷款公司房美储（Fannie Mae）。2008 年 10 月 29 日，在公司的系统中发现了一个逻辑炸弹。虽然这是一个较早的例子，但在逻辑炸弹的历史中具有重要意义。这个逻辑炸弹是由被解雇的前承包商拉杰德拉因·马克瓦纳（Rajendrainh\
  \ Makwana）植入的。该炸弹设定于 2009 年 1 月 31 日激活，并完全清除公司所有的服务器。马克瓦纳于 2009 年 1 月 27 日在马里兰州的一方法院因未经授权访问计算机起诉。2010\
  \ 年 12 月 17 日，他被定罪并判处 41 个月监禁，随后处以 3 年缓刑。马克瓦纳在他解雇到网络管理员取消其网络访问权限之间植下了该逻辑炸弹。这说明了确保在员工离职时（无论是被辞雇、退休还是自愿离职）立即停用其账户的重要性。\n\
  \n### 垃圾邮件 (Spam)\n\n大多数人所熟悉的 `Spam`（垃圾邮件）是发送给多方的非愿且未经请求的电子邮件。它通常被用于营销目的，但也可以用于更具恶意的目标。例如，垃圾邮件是传播病毒和蠕虫的常见媒介。垃圾邮件还用于发送邮件，诱收件者访问钓鱼网站以窃取其身份。在最好的情况下，垃圾邮件是一种干扰；在最坏的情况下，它是间谍软件、病毒、蠕虫和钓鱼攻击的载体。\n\
  \n### 高级持续性威胁 (Advanced Persistent Threats)\n\n`Advanced persistent threats` (`APTs`)\
  \ 是一个描述持续攻击过程的新兴术语。它可能涉及黑客攻击、社会工程学、恶意软件或多种攻击的结合。问题在于攻击必须是相当复杂的，因此被称为 `advanced`（高级），并且必须是持续的，因此被称为\
  \ `persistent`（持续性）。\n\n安全公司 Mandiant 在 7 年时间里追踪了多个 APT，它们都源自中国——特别是上海和浦东地区。这些 APT\
  \ 被简单地命名为 `APT1`、`APT2` 等。\n\n这些攻击与中国军方的 `UNIT 61398` 有关。中国政府认为该单位的活动是机密的，但进攻网络战争似乎是其任务之一。仅该中的一个\
  \ APT 就在 2020 年入侵了 20 个不同行业的 141 家公司。`APT1` 对受害者网络的平均访问时间为 365 天，在其中一个案例中持续了 1764\
  \ 天。`APT1` 负责在 10 个月内从一个组织中窃取 6.5TB 的信息。我们将详细讨论这一点。\n\n### 深度伪造 (Deep Fakes)\n\n\
  `Deep fakes` 是一种合成媒体，其中通过深度神经网络将图像或视频中的人物替换为某人的肖像。\n\n### 检测和消除病毒与间谍软件\n\n一旦你理解了恶意软件的本质以及它可能产生多大的破坏性，下一个逻辑议题就是检测和删除。\n\
  \n### 杀毒软件\n\n在本章及整本书中，我们已经讨论了病毒扫描的必要性。本节提供了有关病毒扫描器如何工作的细节，以及有关主要软件包的信息。\n\n病毒扫描器可以通过两种方式工作。第一种是寻找匹配已知病毒的特征或模式。因此，保持你的杀毒软件更新非常重要，这样你就有最新的列表可以工作。\n\
  \n病毒扫描器检查特定 PC 的另一种方式是观察行为。如果一个程序的行为与病毒活动一致，病毒扫描器可能会将其标记为病毒。此类活动可能包括\n\n* 尝试复制自己\n\
  * 尝试访问系统电子邮件程序的地址簿\n* 尝试更改 `Windows` 中的 `Registry`（注册表）设置\n\n图 5.6 显示了 Norton Security\
  \ 软件的运行情况。你可以看到病毒库已更新，开启了病毒扫描、自动保护，并且同时也开启了网络蠕虫保护。其他流行的杀毒软件也有许多相同的功能。\n\n有许多杀毒软件供应商。McAfee、Bitdefender、Kaspersky、AVG\
  \ 和 `Malwarebytes` 是最广为人知的。任何现代杀毒产品都应该是一个全面的软件包，防止各种攻击，而不仅仅是阻止病毒。\n\n\n\n\n\n![Description:\
  \ 截图显示了 McAfee 杀毒软件界面。窗口显示了选项，其模式为病毒和系统保护（开启）、网络和电子邮件保护（开启）、McAfee 更新（当前）以及您的订阅（激活）。窗口底部还有“更多保护”和“查找未保护的设备”等其他选项。](img/05fig07.jpg)\n\
  \n**图 5.7** McAfee 杀毒界面。\n\nAvast（参见图 5.8）是另一种广泛使用的杀毒产品。该产品针对家庭非商业用途免费提供。你可以从供应商的网站下载该产品：[www.avast.com](http://www.avast.com)。你还可以找到专业版、UNIX\
  \ 或 Linux 版本以及专门针对服务器的版本。此外，Avast 支持多种语言，包括英语、荷兰语、芬兰语、法语、德语、西班牙语、意大利语和匈牙语。\n\n![Description:\
