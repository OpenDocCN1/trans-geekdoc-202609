  \nD. 边开车边寻找竞争黑客\n\n10 . 这种通过说服和欺骗使人员提供信息以帮助破坏安全的黑客技术称什么？\n\nA. 社会工程（Social engineering）\n\
  \nB. 诈骗（Conning）\n\nC. 人性情报（Human intel）\n\nD. 软黑客（Soft hacking）\n\n11 . 互联网上有许多威胁。目前最常见的威胁可能会随时间变化，但某些威胁总是比其他更常见。以下哪项是互联网上最常见的威胁？\n\
  \nA. 拍卖诈骗\n\nB. 电话破解\n\nC. 计算机病毒\n\nD. 非法软件\n\n12 . 安全有哪种方法？\n\nA. 边界、分层、混合\n\n\
