  \n### 项目\n\n### 项目 11.1: 编写并执行审计\n\n结合你在学习了本书的前六章内容并在之前的练习中检查安全性时获得的知识，现在是时候制定你自己的审计计划了。该计划应详细说明审计的所有步骤。\n\
  \n注意：该项目的第二部分取决于是否获得某些组织的许可以进行审计。它也非常适合作为一个小组项目。根据你编写的审计计划对网络进行审计。这种审计可以针对任何类型的组织，但你应该让你的第一次审计针对小型网络（用户少于\
  \ 100 人）。\n\n### 项目 11.2: 制定灾难恢复计划\n\n利用你为止所获得的知识，为一个组织创建一个灾难恢复计划。你可以使用虚拟组织，但真实的组织会更好。\n\
  \n### 项目 11.3: 编写安全策略文档\n\n注意：此项目设计为小组项目。现在是时候将你目前所学的所有知识整合起来。为一个组织编写一套完整的安全策略。再次，你可以使用虚拟公司，但真实的组织更好。这套策略必须涵盖用户访问、密码策略、审计频率（内部和外部）、最低安全要求、上网指南等。\n\
  \n### 项目 11.4: 安全 Web 服务器\n\n利用本章的信息或其他资源，制定一个专门保护 Web 服务器的策略。该策略应包括服务器本身的安全性以及防止网络受到服务器攻击。\n\
  \n### 项目 11.5: 添加你自己的指南\n\n注意：此项目非常适合小组项目。本章概述了一些通用的安全程序。写一篇文章详细说明你自己的指南。这些指南可以针对个人计算机、服务器、网络或任何组合。\n\
  \n## 案例研究\n\nJuan Garcia 是一家小公司的网络管理员，该公司公司还维护自己的 Web 服务器。他采取了以下措施：\n\n▪ 所有计算机都安装了补丁、安装了杀病毒软件，并关闭了不需要的服务。\n\
  ▪ 网络具有带有代理服务器和 `IDS` 的防火墙。\n▪ 组织有一项策略，要求密码长度为十位，且每九天更改一次。\n\n**考虑以下问题：**\n\n1. Juan\
  \ 对网络保护做得足够吗？\n2. 你建议他采取哪些其他行动？\n\n\n\n\n\n阅读完本章并完成练习后，你将能够做到以下：\n\n- 解释什么是网络恐怖主义，以及它在某些实际案例中是如何使用的\n\
  - 理解信息战的基础知识\n- 掌握一些可能的网络恐怖主义场景的实用知识\n- 对网络恐怖主义带来的危险有充分的认识\n- 解释网络战争的未来趋势\n\n###\
  \ 引言\n\n在整本书中，我们探讨了个人可能利用计算机实施犯罪的各种方式。本书还研究了使系统更安全的特定方法。但一个尚未被解决的问题是网络恐怖主义。世界各国国家的人们已经习惯了无处不在的恐怖袭击威胁，这种袭击可能以炸弹、劫持、释放生物制剂或其他形式出现。然而，在现代世界中，我们还必须考虑网络攻击。\n\
  \n第一个问题可能是这样的：什么是网络恐怖主义？根据美国联邦调查局（FBI）的定义，`cyber terrorism`是指次国家级组织或秘密特工针对信息、计算机系统、计算机程序和数据进行的预谋的、具有政治动机的攻击，并导致对非战斗目标造成暴力。网络恐怖主义简单来说就是利用计算机以及它们之间的互联网连接来发动恐怖袭击。简而言之，网络恐怖主义与其他形式的恐怖主义一样——只是攻击的环境发生了变化。显然，网络攻击导致的人员损失将远少于轰炸。事实上，极有可能完全不会造成人员伤亡。然而，通过互联网造成巨大的经济损失、通信中断、供应链中断以及国家基础设施的整体恶化，都是完全可能的。\n\
  \n真正的问题可能是：网络间谍活动和网络恐怖主义之间有什么区别？首先，间谍活动的目标仅仅是收集信息。如果根本没有人意识到发生了什么，那么对间谍来说是更理想的。这对于企业间谍和国际间谍活动都是如此。另一方面，网络恐怖主义寻求造成破坏，并且它需要尽可能公开。其理念是向人们施加恐惧。虽然某些人可能认为这些主题相关，但它们实际上非常不同。\n\
  \n在 2022 年俄罗斯入侵乌克兰之前，针对乌克兰发生了协调的网络攻击。这种将网络攻击与动力战争（物理战争）相结合的双管作战模式预计在未来几年将变得更加常见。通过通过网络攻击破坏目标基础设施，可以提高动力攻击的成功率。这并不是对俄罗斯入侵乌克兰的道德性发表评论，而是对网络攻击在传统冲突场景中所扮演的角色并将继续扮演的角色的一种观察。\n\
  \n很有可能，随着时间的推移，某个人或某个团体将尝试使用计算机方法对我们的国家发动军事或恐怖袭击。一些专家认为`MyDoom`病毒是国内经济恐怖主义的一个例子。然而，这样的攻击可能只是冰山一角。在不久的未来某时候，我们的国家可能成为严重网络恐怖主义攻击的目标。本章将研究一些可能的网络恐怖主义场景，目的是让你对这种威胁的严重性有一个现实的评估。在章末的练习中，你将有机会研究当前的网络恐怖主义行为以及潜在威胁，以及你可以采取的行动来帮助防止这些的发生。\n\
  \n本书的第一版也讨论了网络恐怖主义。那是 2004 年的事。那时，有些人可能认为对该主题的报道几乎是虚构的，网络恐怖主义并没有真实的威胁。事实证明并非如此。网络恐怖主义是真实威胁的早期迹象之一是\
  \ 2006 年 11 月，空军部长宣布成立空军网络司令部（`AFCC`），其首要功能是监控和防御美国在网络空间的利益。`AFCC`利用了第 67 网络战大队的人员资源和其他资源。看来美国空军非常重视网络威胁，并创建了专门的机构来应对。\n\
  \n## 网络恐怖主义的实际案例\n\n由于某些读者可能认为这仅仅是危言耸听，在我们深入探讨之前，让我们先看一些真实的案例。网络恐怖袭击有多大可能？好吧，我们将从旧案例开始，转向现代案例。\n\
  \n`CENTCOM`（即中央司令部）是负责中东地区的美国军事司令部。2008 年，`CENTCOM`感染了间谍软件。一个 U 盘被遗留在中东的一个国防设施停车场内。一名士兵捡起了它并插入了自己的工作站，从而将间谍软件引入了`CENTCOM`。该病毒被称为`Agent.btz`，是`SillyDC`的一个变体。这是一个严重的安全漏洞，我们可能永远不知道丢失了多少数据或造成了多大损害。\n\
  \n2009 年许多基于互联网的攻击，特别是针对美国网站，例如五角楼、白宫以及韩国的政府机构网站。这些攻击与朝鲜之间的紧张局势一致。显然，这些都是网络恐怖主义的例子，尽管规模较小。\n\
  \n2009 年 12 月，出现了一个更令人不安的消息。黑客入侵了计算机系统并盗取了美国的秘密防御计划。当局推测是朝鲜所为。被盗的信息追踪到一个中国的 IP 地址。这个案例显然是一个网络间谍案，而且非常严重。\n\
  \n2010 年 12 月，一个自称“巴基斯坦网络军”的组织入侵了印度顶级调查机构——中央调查局（`CBI`）。这种网络间谍活动比向公众披露的要普遍得多。\n\n\
  2015 年，中国黑客被认为入侵了美国政府计算机并访问了 400 万现任和前任联邦员工的数据。这是对人事管理局的入侵。\n\n2015 年，土耳其部分地区发生了\
  \ 12 小时的停电，归因于伊朗。该攻击是由 APT 组织`MuddyWater`实施的，该组织与伊朗情报与部有关。他们使用恶意 PDF 和 Office 文档作为主要的攻击手段^(1)。^(1)\
  \ [`www.zdnet.com/article/state-sponsored-iranian-hackers-attack-turkish-govt-organizations/`](https://www.zdnet.com/article/state-sponsored-iranian-hackers-attack-turkish-govt-organizations/)\n\
  \n2017 年，俄罗斯支持的黑客通过推特针对美国国防部员工。至少有 10,000 名国防部员工成为目标。\n\n2019 年，俄罗斯指责美国在其电网上策划恶意软件^(2)。俄罗斯政府声称美国对俄罗斯电网的探测追溯到\
  \ 2012 年。然而，并没有证据表明任何恶意软件曾被实际使用。\n\n^(2)\n\n\n\n\n\n- [美国在俄罗斯电网中植入强大的恶意软件（SecurityWeek）](https://www.securityweek.com/us-planted-powerful-malware-russias-power-grid-report)\n\
  \n2022 年，美国声称已清除了全球范围内的恶意软件，以防止俄罗斯的网络攻击。这些恶意软件允许 `GRU`（俄罗斯军情报局）创建并控制僵尸网络。\n\n- [司法部宣布获得法院授权中断由俄罗斯联邦控制的僵尸网络](https://www.justice.gov/opa/pr/justice-department-announces-court-authorized-disruption-botnet-controlled-russian-federation)\n\
  \n这些事件显示了国家在利用网络武器方面正稳步进展。显然，这个问题并非假设，而是真实存在且日益加剧的。在本章的后半部分，将将对某些特定事件提供更详细的调查。\n\
  \n## 中国的高级持续性威胁\n\n高级持续性威胁（APT）正如其名所示，是一系列持续一段时间的先进网络攻击，因此具有持续性。安全公司 Mandiant 在\
  \ 7 年时间里追踪了多个 APT，它们都源自中国，特别是上海和浦东地区。这些 APT 被简单命名为 `APT1`、`APT2` 等。\n\n这些攻击与中国军的\
  \ `UNIT 61398` 有关。中国政府认为该部门的活动属于机密，但进攻性网络战争似乎是其任务之一。仅该小组中的一个 APT 就在 2022 年入侵了涉及\
  \ 20 个行业的 141 家公司。`APT1` 对受害者网络的访问时间平均长达 365 天，其中一个案例甚至持续 1764 天。`APT1` 还在 10 个月的时间内从一个单一组织中盗了\
  \ 6.5TB 的信息。\n\n## 印度与巴基斯坦\n\n这两个国家很久以来一直存在深的积仇。近年来，这涉及到网络行动也并不为奇。\n\n《One India》在\
  \ 2015 年 8 月发表了一篇题为“巴基斯坦想要对印度发动网络战争”的文章。在文中，作者表示：“情报局（Intelligence Bureau）的网络部门警告说，在正在针对印度的代理人战争中，政府网站可能会被巴基斯坦网络军黑入。”根据最新的警报，巴基斯坦的\
  \ `ISI` 已指示其网络军对印度宣布互联网战争。\n\n这种情况一直在持续。2022 年，有一篇文章讨论了印度和巴基斯坦在克什米尔争议中利用网络攻击的各种方式。双方都对对方发动网络攻击。此外，双方还利用第三方作为其网络冲突的一部分。\n\
  \n- [巴基斯坦如何在克什米尔引发网络战争（National Interest）](https://nationalinterest.org/blog/techland-when-great-power-competition-meets-digital-world/how-pakistan-brought-cyberwar-kashmir)\n\
  \n## 俄罗斯黑客\n\n根据网络情报公司 ISight Partners 的报告，2014 年，来自俄罗斯的黑客监视了北约和欧盟使用的计算机。这种间谍活动是通过利用\
  \ `Microsoft Windows` 中的漏洞完成的。据报道，这些黑客还针对乌克兰的网站进行间谍活动。\n\n## 伊朗——沙特\n\n伊朗与沙特阿拉伯之间的紧张关系已持续数十年。也门的内战是伊朗和沙特之间的代理人战争。双方都指控对方进行网络攻击。关于外部影响的指控层出不穷。胡塞被指控是伊朗的代理人，因为胡塞和伊朗都是什叶派。美国和沙特阿拉伯都曾指责伊朗武装胡塞。伊朗和胡塞派否认任何关联。像厄立特里亚这样的非洲国家也被指控支持胡塞。也门政府实际上收到了美国和沙特阿拉伯的支持。\n\
  \n`Shamoon` 病毒于 2012 年首次发现，随后一个变体在 2017 年再次出现。`Shamoon` 作为间谍软件运行，但在文件上传到攻击者后会删除它们。该病毒攻击了沙特阿美（Saudi\
  \ Aramco）的工作站，一个名为“正义之剑”的组织对该攻击了负责。沙特阿美的若干安全官员将此攻击归咎于伊朗。和`Stuxnet`一样，这种病毒感染了目标之外的其他系统。\n\
  \n## 网络战争武器\n\n在网络战争和网络恐怖中，恶意软件仍然是主要的武器。无论是间谍软件、病毒、木马、逻辑炸弹或其他类型的恶意软件，它仍然是进行网络冲突的核心工具。在本节中，我们将查看一些在冲突中使用过的恶意软件。\n\
  \n### Stuxnet\n\n`Stuxnet` 是武器化恶意软件的经典案例。`Stuxnet` 最初通过感染的 USB 驱动器传播；然而，一旦它进入受感染的机器，它就会在整个网络甚至互联网上传播。`Stuxnet`\
  \ 病毒随后寻找与特定类型的可编程逻辑控制器（`PLC`）的连接，特别是 `Siemens Step7` 软件。如果发现了特定的 `PLC`，`Stuxnet`\
  \ 就会为该 `PLC` 加载自己的特定 `DLL` 副本以监控 `PLC` 然后更改其功能。\n\n`Stuxnet` 设计旨在针对伊朗铀富集涉及的离心机控制器。但该病毒扩散到了预定目标之外，因此变得广为人知。虽然伊朗反应堆外的许多用户报告没有受到\
  \ `Stuxnet` 造成重大损害，但在许多机器上检测到了它。\n\n`Stuxnet` 采用了经典的病毒设计。`Stuxnet` 有三个模块：一个执行与攻击相关的程序的蠕虫；一个执行传播蠕虫副本的链接文件；以及负责隐藏文件和进程的根内核（rootkit），其目标是增加检测\
  \ `Stuxnet` 存在的难度。本讨论的目的不是探索 `Stuxnet` 的复杂性。相反，引入 `Stuxnet` 是作为国家支持的恶意软件攻击示例，以及至少是针对此类攻击的尝试。\n\
  \n### Flame\n\n任何关于网络战争和间谍活动的现代讨论如果没有提到 `Flame` 将是不完整的。这种病毒首次出现于 2012 年，针对 `Windows`\
  \ 操作系统。这种病毒值得关注的第一个点是它是专门为间谍活动设计的。它首次于 2012 年 5 月在多个地点被发现，包括伊朗政府网站。`Flame` 是可以监控网络流量并对受感染系统进行截图的间谍软件。\n\
  \n这种间谍软件会记录键盘活动和网络流量，拍摄截图，据报道甚至录制了 Skype 会话。它还会将受感染的计算机变成蓝牙信标，尝试从附近的启用蓝牙的设备下载信息。\n\
  \n卡巴斯基实验室（Kaspersky labs）报告，`Flame` 文件包含一个只出现在中东地区机器上的 `MD5` 哈希值。这表明病毒作者可能打算将恶意软件攻击针对特定的地理区域。`Flame`\
  \ 病毒似乎还有一个删除功能，允许控制它的人发送信号指令其删除所有自身痕迹。这两项内容表明了针对恶意软件的攻击尝试，尽管这种针对的结果似乎失败了，否则我们不会知道它的存在。\n\
  \n### StopGeorgia.ru 恶意软件\n\n\n\n\n\n在俄罗斯与格鲁吉亚的冲突期间，许多黑客事件发挥了作用。`StopGeorgia.ru`论坛是一个旨在促进对格鲁吉亚关键网络目标攻击的在线论坛。该论坛会发布特定目标，提供教程（在某些情况下还提供工具）帮助即使是技能低下的攻击者也能对准目标，甚至提供了代理服务器的链接，以通过隐藏攻击者的真实\
  \ IP 地址和位置来协助攻击。\n\n作为 `StopGeorgia.ru` 网站提供的服务示例，有一个名为 `DoSHTTP` 的工具可以自动执行 `DoS`\
  \ 攻击，并列有一份格鲁吉亚境内作为良好目标的网站和 IP 地址列表。这鼓励了任何对这场冲突中俄罗斯立场表示同情且具备极少计算机技能的人对格鲁吉亚发起网络攻击。\n\
  \n### FinFisher\n\n`FinFisher` 间谍软件旨在供持有许可证的执法机构使用，用于收集嫌疑人的证据。然而，该软件由 `WikiLeaks`\
  \ 发布。现在它在互联网上可用，任何人都可以。\n\n### BlackEnergy\n\n`BlackEnergy` 理论上可以操纵水务和电力系统，包括导致停电和供水中断。`BlackEnergy`\
  \ 软件被追踪到俄罗斯小组 `SandWorm`。2016 年 1 月，基辅机场的一次停电与 `BlackEnergy` 恶意软件有关。\n\n`BlackEnergy`\
  \ 恶意软件专门影响发电厂。该恶意软件是一个 32 位的 `Windows` 可执行文件。`BlackEnergy` 是一种多功能恶意软件，能够启动多种不同的攻击模式。它可以发起分布式拒绝服务\
  \ (`DDoS`) 攻击。还可以投放 `KillDisk`，这是一种让系统无法使用的特性。\n\n### Regin\n\n`Regin` 是一种恶意软件和黑客工具包，据称是由美国国家安全局（NSA）与英国政府通信总部（GCHQ）合作开发的。该恶意软件由\
  \ `Kaspersky lab` 和 `Symantec` 在 2014 年首次发布。该软件的功能是针对特定的 `Windows` 计算机。它使用自己的加密虚拟文件系统使其具有极强的隐蔽性。该软件也以\
  \ `QWERTY` 或 `Prax` 命名。\n\n### NSA ANT Catalog\n\n据报道，这是 `NSA` 提供给美国政府内部拥有安全许可的机构的目录。这是一份恶意软件目录（包括间谍软件），由“国家安全局定制访问操作”（National\
  \ Security Agencies Tailored Access Operations）小组开发。许多来源声称拥有该目录的项目列表以及目录的截图。鉴于该目录的机密性，如果它确实存在，任何声称拥有该目录详情的网站都应该持怀疑态度。\n\
  \n### 经济攻击\n\n网络攻击造成经济损害有多种方法。文件丢失和记录丢失就是一种。第 9 章“计算机安全技术”讨论了网络间谍活动，并提到了数据的内在价值。除了偷取这些数据，还可以简单地破坏，在这种情况下数据就消失了，用于积累和分析数据的资源也浪费了。打个比方，考虑一个恶意的人可能会选择直接毁你的汽车而不是偷走它。无论哪种，你都失去了汽车，并且必须花费额外的资源来获取交通工具。\n\
  \n除了简单破坏具有经济价值的数据之外（记住，很少数据是不具备某种内在价值的），还有其他引起经济混乱的方法。其中一些包括盗取信用卡、从账户转账和实施欺诈。但事实是，每当\
  \ IT 人员参与清理病毒而非开发应用程序或管理网络和数据库时，就会产生经济损失。公司现在需要购买反病毒软件和入侵检测软件并聘用计算机安全专业人员，这一事实本身意味着计算机犯罪已经对全球的公司和政府造成了经济损害。然而，随机病毒爆发、孤立黑客攻击和在线欺诈造成的普遍损害并不是本章关注的经济损害类型。本章关注的是针对特定目标或多个目标发起的协同且蓄意的攻击，其唯一目的是造成直接破坏。\n\
  \n要牢牢掌握此类攻击的影响的一种良好方法是演练一个场景。X 小组（可能是一个侵略性国家、恐怖组织、活动分子团体，或实际上任何有破坏特定国家动机的团体）决定对我们的国家发动协同攻击。他们找到了一小群个人（在这种情况下为六个人），他们精通计算机安全、网络和编程。这些人在意识形态或金钱需求的的驱动下，被组织起来进行协同攻击。在他们可以执行此类攻击并造成重大经济损害的场景有许多种。接下来概述的示例仅是这些可能的攻击模式之一。在这种情况下，每个人都有了一项任务，且所有任务都设计为在同一个特定日期激活：\n\
  \n▪ 团队成员一搭建了几个虚假的电子商务网站。每个网站只运行 72 小时，并伪装成大型证券经纪网站。在网站运行的短时间内，网站的真实目的只是收集信用卡号、银行账户等。在预定日期，所有这些信用卡和银行号码将自动、匿名且同步地发布到各种公告板/网站和新闻组中，让任何想要使用它们的不法法之士都能获取。\n\
  \n▪ 团队成员二创建了一个包含在木马中的病毒。它的功能是在预定日期删除关键系统文件。在此期间，它会显示一系列业务技巧或励志口号，使其成为商务人士中受欢迎的下载内容。\n\
  \n▪ 团队成员三创建了另一个病毒。它被设计对关键经济网站（如证券交易所或经纪公司）发起分布式拒绝服务 (`DDoS`) 攻击。该病毒无害地传播，并被设定在预定日期开始其\
  \ `DDoS` 攻击。\n\n▪ 团队成员四和五开始对主要的银行系统进行足迹扫描（footprinting），准备在预定日期破解它们。*Footprinting*\
  \ 是收集信息的过程——部分来自公共来源，其他部分通过扫描目标系统/网络获取。\n\n▪ 团队成员六准备了一系列虚假股票建议，在预定日期淹没互联网。\n\n如果这些人中的每一个人都成功完成了任务，那么在预定日期，几家主要的经纪公司可能的政府经济网站将被关闭，病毒席卷网络，成千上万的商人、经济学家和证券经纪人的机器文件被删除。成千上万的信用卡和银行号码发布在互联网上，确保了许多号码会被滥用。破解团队成员四和五很可能取得某些成功——这意味着可能一个或多个银行系统被攻破。不需要经济学家也能意识到，这将轻松花费数亿美元，甚至是数十亿美元。这种性质的协同攻击对我们国家造成的经济损害，可能比大多数传统的恐怖袭击（爆炸）都要大。这在图\
  \ 12.1 中所示。\n\n![描述：一张照片显示一个男人在使用笔记本电脑。](img/12fig01.jpg)\n\n**图 12.1** *X 小组的团队成员？*\n\
  \n\n\n\n你可以对这种情景进行推演，想象不仅是一个六人的网络恐怖分子小组，而是五个六人小组——每个小组都有不同的任务，且每项任务都设计为每隔约 2 周执行一次。在这种情况下，该国家的经济从字面上将处于为期\
  \ 2.5 个月的围困之中。考虑到在过去的几十年里，核科学家一直受到各国和恐怖组织的追逐，这种情景并不特别遥远。最近，生物武器专家也被这些组织所青睐。这些组织极有可能看到这种恐怖主义形式，并寻找计算机安全/黑客专家。鉴于有成千上万具备必要技能的人，有动机的组织很可能找到几十个愿意实施这些行为的人。\n\
  \n## 军事行动攻击\n\n当计算机安全和国家国防被放在一起讨论时，脑中浮出的明显念头是某些黑客入侵国防部、中央情报局 (`CIA`) 或国家安全局 (`NSA`)\
  \ 等极高安全性可能性。然而，入侵世界上最安全的系统之一是非常不可能的——并非不可能，但可能性极小。此类攻击最可能的结果是攻击者很快被捕获。这些系统是高度安全的，入侵它们并不像某些电影暗示的那么容易。然而，在某些情况下，破解安全性较低的系统可能会危及我们的国防，或使军事计划面临风险。\n\
  \n考虑一下敏感性较低的军事系统——负责基础物流运营（如食物、邮件、燃料）的系统。如果有人破解了其中一个或多个系统，他可能会获得某些信息，显示几架 `C-141`（一种经常用于运输部队和跳伞作业的飞机）正被派往位于某个城市飞行距离内的基地——而该城市正是政治紧张局势的焦点。同一个破解者（或破解小组）还发现，大量的弹药和食品供应（足够\
  \ 5000 名士兵使用 2 周）正同时被派往该基地。然后，在另一个低安全性系统中，破解者（或破解小组）注意到某个特定单位（例如`第 82 空降师`的两个旅团）已取消了所有军假。不需要军事天才就能得出结论：这两个旅团正准备落在目标城市并夺取该目标。因此，部署即将发生的事实、部署规模以及部署的大致时间，在没有尝试破解高安全性系统的情况下就被推断出来。\n\
  \n将之前的情景推向下一步，假设黑客深入了低安全性的物流系统。然后假设他没有对旅团成员或运输飞机的路线做任何更改——这些行动可能会引起注意。然而，他更改了物资供应的记录，导致物资推迟\
  \ 2 天交付并被送往错误的基地。这样，就有两个旅团可能处于危险之中，且在途中没有弹药或食物补给。当然，情况可以被纠正，但相关单位可能很一段时间内得不到补给——这段时间可能足够阻止他们成功完成任务。\n\
  \n这些仅仅是攻破低安全性/低优先级系统导致非常严重的军事问题的两种情景。这进一步说明了对所有系统进行高安全性的迫切需求。鉴于商业和军事计算机系统中如此多组件的互连性，不存在真正的“低优先级”安全系统。\n\
  \n## 通用攻击\n\n之前概述的情景涉及具有特定策略的特定目标。然而，一旦目标受到攻击，就可以针对其准备防御。许多安全专业人员一直在工作以挫败这些特定的攻击。更具威胁的可能是没有特定目标的通用且无针对性的攻击。考虑一下\
  \ 2003 年底和 2004 年初的各种病毒攻击。除了明确针对`Santa Cruz Organization`的`MyDoom`之外，这些攻击并非针对特定目标。然而，病毒攻击和网络流量的巨大确实造成了巨大的经济损失。全球的\
  \ IT 人员放弃了正常项目，清理受感染的系统并加固系统的防御。虽然这些攻击是几年前的，但具有典型性，因此具有研究价值。\n\n这导致了另一种可能的情景：各种网络恐怖分子不断发布新的、多样的病毒，执行拒绝服务攻击，并努力让整个互联网特别是电子商务在一段时间内实际上无法使用。这种情景实际上更难应对，因为没有特定的目标可以防御，也没有清晰的意识形态动机作为犯罪者身份的线索。\n\
  \n## 监视控制数据采集 (SCADA)\n\n这些是用于操作和监控大型设备的工业系统（例如发电机、民防报警器、水处理厂）。这些系统是网络恐怖主义非常有吸引力的目标。2009\
  \ 年，《60 分钟》节目做了一个关于电力系统漏洞的报告。它显示，为能源部工作的渗透测试人员能够接管发电机并可能使其过载，导致导致永久性损坏并使其离线。感染伊朗核设施的著名的`Stuxnet`病毒就是利用了`SCADA`系统的漏洞。\n\
  \n这些系统特别受到关注，因为对它们的破坏不仅仅是经济攻击。对`SCADA`系统进行网络攻击完全可能导致人员损失。\n\n`SCADA`系统的组件包括：\n\n\
  - 远程终端单元 (`RTUs`)：连接传感器以发送和接收数据，通常具有嵌入式控制能力\n- 可编程逻辑控制器 (`PLCs`)\n- 遥测系统：通常用于将`PLCs`和`RTUs`连接到控制中心\n\
  - 数据采集服务器——使用工业协议通过遥测将软件服务与现场设备（如`RTUs`和`PLCs`）连接的软件服务\n- 人机界面 (`HMI`)：向人类操作员展示处理后的数据\n\
  - 历史数据库软件（historian）：一种在数据库中累积带时间戳的数据、布尔事件和布尔告报的软件服务\n- 监视（计算机）系统\n\n### 信息战\n\n\
  \n\n\n\n信息战争 确实早于现代计算机的出现，事实上，它的历史可能与传统战争一样悠久。从本质上说，信息战争是为了追求军事或政治目标而操纵信息的任何尝试。当你试图使用任何过程来收集对手的信息，或者当你在冲突中使用宣传来影响观点时，这些都是信息战争的例子。第\
  \ 7 章 “网络空间中的工业间谍活动”一章中讨论了计算机在企业间谍活动中的作用。同样的技术也可以应用于军事冲突，其中计算机可以被用作间谍活动的工具。虽然本章不再重新审查信息收集，但它只是信息战争的一部分。宣传是信息战争的另一个方面。信息的流动影响着部队的士气、公民对冲突的看法、对冲突的政治支持，以及周边国家和国际组织的参与。\n\
  \n### 宣传\n\n计算机和互联网是用于传播宣传信息的非常有效的工具。现在许多人将互联网作为次要新闻来源，有些人甚至将其作为主要新闻来源。这意味着政府、恐怖组织、政党或任何活动团体都可以利用一个看似互联网新闻网站的作为掩护，对任何冲突施加他们自己的政治色彩。此类网站不需要与散发其观点的政治组织直接连接；事实上，不直接连接更好。例如，爱尔兰共和军（IRA）一直以两个截然不同且独立的部门运作：一个负责准军事/恐怖主义行动的部门，另一个是纯粹政治性质的部门。这使得被称为“新芬党”（Sinn\
  \ Féin）的政治/信息部门能够独立于任何军事或恐怖活动进行运作。事实上，新芬党现在有它自己的网站，如图 12.2 所示，它在网站上以自己的观点传播新闻（[`www.sinnfein.org`](http://www.sinnfein.org)）。然而，在这种情况下，任何阅读这些信息的人都会很清楚地看出它倾向于赞助该网站的政党的观点。更好的情况（对相关政党而言）是，存在一个对政治团体立场持好态度的互联网新闻来源，但两者之间没有任何实际联系。这使得该团体更容易传播信息，而不被指控具有明显的偏见。该政治团体（无论是国家、反叛组织还是恐怖组织）随后可以向该机构“泄露”故事。\n\
  \n![描述：一张显示新芬党网站首页的截图。](img/12fig02.jpg)\n\n**图 12.2** 新芬党网站。\n\n### 信息控制\n\n自第二次世界大战以来，信息控制一直是政治和军事冲突的重要部分。以下只是几个例子：\n\
  \n▪ 在整个冷战期间，西方民主国家投入了大量金钱向共产主义国家进行广播节目。这项广为人知的运动被称为“自由欧洲电电”。其目标是在这些国家的公民中制造不满情绪，希望鼓励他们叛逃、异议和普遍的不满。大多数历史学家和政治分析师认为这是成功的。\n\
  \n▪ 越南战争是第一场出现强烈且广泛国内反对意见的现代战争。许多分析师认为，这种反对是因为通过电视带回了生动的画面。\n\n▪ 如今，每个国家的政府和军队都意识到他们描述活动的用词会如何影响公众认知。他们不会说无辜平民在轰炸袭击中丧生，而是声明发生了“一些附带损害”。政府不谈论成为侵略者或发起冲突。他们谈论“先发制”。任何国家的异议人士几乎总是被描绘成叛国者或懦夫。\n\
  \n公众认知是任何冲突中非常重要的部分。每个国家都希望自己的公民完全支持其所做的一切，并保持极高的士气。高士气和强支持会导致志愿兵的增加、对冲突的支持以及国家的成功。\n\
  \n\n\n\n另一类与宣传密切相关的信息战类型是虚假信息。军事对手试图收集有关部队动向、军事实力、物资等信息，这是理所当然的。一种审慎的举措是建立一套包含错误信息的系统，这些系统的安全性足以使其令人信信，但不足以完全不可破解。一个例子是发送一条加密代码消息，当消息被解密时，看起来在说一件事，但对于那些能够破解代码的人来说，它包含另一个信息。实际信息被“噪声”填充了。这种噪声是低强度加密的虚假信息，而真实信息经过了更强的加密。这样一来，如果消息被解密，极有可能解密出虚假信息而非真实信息。美国海军陆战队的格雷将军（General\
  \ Gray）说得非常到位：“没有情报的通信是噪声；没有通信的情报是无关的。”\n\n任何军事或情报机构的目标都是确保我们的通信是清晰的，并且敌人只能接收到噪声。\n\
  \n## 实际案例\n\n本章已经提到了几个案例。在本节中，我们将简要查看其他案例。我们将检查 1996 年至 2016 年间 20 年的事件。需要注意的是，计算机安全行业存在一些声音，认为网络恐怖主义或网络战争并非现实的场景。`Information\
  \ Security`杂志的 Marcus Ranum 在 2004 年 4 月份中表达了类似的观点。他和其他人声称，网络恐怖主义没有危险，事实上，“整个网络战争的概念就是一个骗局。”那句引用相当老了，但它说明这并不是一个新观点。遗憾的是，实际案例研究表明这种观点完全是错误的。然而，计算机战争和网络恐怖主义已经在小规模上使用。随着时间的推移，这在更大规模上出现是完全合理的。\n\
  \n即使你认为本章前面的部分概述的场景仅仅是过度想象的产物，你也应该考虑已经发生过几次真实的网络恐怖主义事件，尽管程度比理论场景要严重得多。本节检查了其中一些案例，向你展示此类攻击在过去是如何实施的。\n\
  \n下列出的事件是在美国众议院武装部队委员会恐怖主义特别监督小组的证词中报告的。在本章前面的部分，我们列出了更近期的攻击，但这些较旧的攻击对于说明这个问题持续了多久非常重要。其中一些案例非常久远，但我们将从历史案例转向当前案例。\n\
  \n*   1996 年，一名据称与白人至上运动相关的计算机黑客暂时禁用了马萨诸塞的一个 ISP，并损坏了该 ISP 记录系统部分。该 ISP 试图阻止黑客以该\
  \ ISP 的名义向全球发送种族主义信息。黑客在威胁中退出：“你们还没有见过真正的电子恐怖主义。这是一个承诺。”\n*   1998 年，埃泰米尔族民族游击队在\
  \ 2 周的时间内每天向斯里兰卡大使馆发送了 800 封邮件。信息内容是：“我们是互联网黑虎，我们这样做是为了扰乱你们的通信。”情报部门将其描述为恐怖分子对一个国家计算机系统的首次已知攻击。这显然是一个非常老的案例，但它说明了这类事情已经发生了多久。\n\
  *   1999 年科索沃冲突期间，NATO 的计算机遭受了 `hacktivists`（指为了自己的事业而利用网络恐怖主义工作的个人）的邮件炸弹攻击和 DoS\
  \ 攻击，这些人正在抗议 NATO 的轰炸。此外，根据报告，企业、公共机构和学术机构收到了来自一系列东欧国家的带有高度政治色彩的病毒邮件。网站篡改也很常见。在贝尔格的中国大使馆被意外轰炸后，中国黑客分子在美国政府网站上发布了诸如“我们不会停止攻击，直到战争停止！”这样的信息。\n\
  *   2010 年 8 月，美国公开警告说，中国军队正针对美国公司以及政府机构。美国进一步警告说，中国政府在这些攻击中利用了民用专家。在该报告中，披露了一个名为\
  \ `GhostNet` 的中国计算机间谍网络。\n*   `Shamoon` 病毒首次于 2012 年发现，变体在 2017 年复出现。`Shamoon` 作为间谍软件运行，但在文件上传到攻击者后会删除它们。该病毒攻击了沙特阿美石油的工作站，一个名为\
  \ `Cutting Sword of Justice` 的小组声称对攻击负责。沙特阿美石油的若干安全人员将此攻击归咎于伊朗。而且像 `Stuxnet` 一样，这种病毒感染了目标目标以外的系统。\n\
  *   2013 年，《纽约时报》报道了多次网络攻击，目标都是美国境内的金融机构。所有攻击似乎都是从伊朗发起的。\n*   2015 年 12 月，乌克兰伊万诺弗兰基夫斯克地区的大部分由于\
  \ `BlackEnergy` 恶意软件停电约 6 小时。攻击被归于一个名为 `Sandworm` 的俄罗斯网络间谍小组。\n*   2017 年，美国指责俄罗斯利用\
  \ `Kaspersky` 杀毒软件入侵美国系统。随后在 2017 年秋季，以色列声称它黑入了俄罗斯的间谍机构，并发现俄罗斯人确实在使用 `Kaspersky`\
  \ 作为网络间谍活动的工具。这是一个每个人似乎都在黑入他人的经典案例。\n*   据指控，2018 年 10 月，美国发起了一项名为“合成神学”（Synthetic\
  \ Theology）的行动，以识别干扰马其其顿和乌克兰选举的俄罗斯特工。整个行动据认为是网络行动。\n*   2018 年 11 月，德国安全官员宣布，一个与俄罗斯相关的组织针对了德国议会部分成员的电子邮件账户，以及德国军方和多个大使馆。\n\
  *   2018 年 12 月，美国联合澳大利亚、加拿大、英国和新西兰指控中国进行了一项为期 12 年的网络间谍活动，目标是 12 个国家的知识产权和商业秘密。该公告与起诉两个与活动相关的中国黑客有关。2019\
  \ 年 1 月，发现与俄罗斯情报部门相关的黑客针对了战略与国际问题研究所。\n*   2019 年 2 月，欧洲航空制造巨头空中披露其一直是中国黑客的目标，盗取了部分欧洲员工的个人和\
  \ IT 身份信息。\n*   从 2019 年 3 月开始，据报道美国开始对俄罗斯的 `powergrid` 实施持续的网络行动。\n*   2021 年 3\
  \ 月，据报道俄罗斯黑客利用间谍软件攻击了立陶宛政府官员。该小组命名为 `APT29`，据称实施了多种与网络间谍相关的攻击。\n*   2021 年 5 月，臭名昭昭的\
  \ `Colonial Pipeline` 攻击是网络战争和恐怖主义史上一个重要事件。该管道控制着供应美国东海岸约 45% 的石油。攻击迫使公司关闭了 `piplein`。最终公司支付了\
  \ `5 million` 美元的勒索金。这会被定性为网络恐怖主义。\n\n\n\n\n在 2022 年俄罗斯入侵乌克兰发生之前，乌克兰曾多次遭受网络攻击。这是利用网络战争增强动能战争的一个例子。\n\
  \n好消息是，这些攻击中的大多数造成的微乎其微，且显然是业余者的所为。然而，由技术高得得多的网络恐怖分子实施更具破坏性的攻击可能只是时间问题。但显而易见的是，网络恐怖主义（至少在低强度规模上）已经开始。这些警告可以被重视并对这些问题认真对待，也可以简单地忽视，直到灾难发生。在本章的后半部分，我们还将关注其他引起关注的问题，例如通过互联网招募恐怖分子。以下是其他真实的间谍活动案例。\n\
  \n*   2000 年 6 月，俄罗斯当局逮捕了一名被指控为 CIA 支持的黑客的男子。如图 12.3 所示，该男子涉嫌入侵了俄罗斯联邦安全局（FSB）的系统，并收集了随后传递给\
  \ CIA 的机密。这个例子说明了熟练黑客利用其知识进行间谍活动的潜力。这种间谍活动发生的频率可能比媒体报道的要得多，许多此类事件可能永远不会为人知。\n\n\
  ![Description: 截图显示了 BBC 新闻首页，上面有关于俄罗斯逮捕“CIA 黑客”的新闻。](img/12fig03.jpg)\n\n**图 12.3**\
  \ *BBC 对被捕黑客的报道。*\n\n*   Ababil 行动是 2012 年一起由黑客主义者领导的攻击，对纽约证券交易所和各银行执行了 DoS 攻击。黑客组织跨境网络战士（Qassam\
  \ Cyber Fighters）声称对此负责。\n\n*   或许最令人不安的是 2015 年美国人事管理局的泄密。据估计有 2100 万条记录被盗取，包括拥有安全许可的人员的详细背景审查。\n\
  \n考虑到报告称我们用于通信、气象和军事行动的卫星可能受到黑客攻击，这也令人恐惧。此类漏洞似乎不太可能被利用，仅仅是因为执行此类攻击所需的技能水平。正如之前提到的，黑客攻击/破解与任何其他人类活动一样，根据概率法则，大多数人都是平庸的。破坏卫星系统安全所需的技能水平远高于破坏网站安全所需的水平。当然，这并不意味着这种攻击是不可能的，只是意味着可能性较小。\n\
  \n## 未来趋势\n\n通过仔细分析当前网络犯罪和恐怖主义正在发生的情况，结合该领域的近期历史，我们可以推断并对未来主导地位的趋势做出合理的准确估计。本节将努力做到这一点。确实有应该考虑的积极和消极趋势。\n\
  \n### 机器学习/人工智能\n\n随着机器学习和人工智能的发展，ML/AI 也将影响网络战争，这并不令人意外。机器学习已经对黑客攻击产生了影响。而网络战争仅仅是国家或国际威胁行为者协调使用黑客攻击以实现政治目标。作为机器学习改进黑客攻击的一个例子，2021\
  \ 年 8 月发表的一篇文章证明，AI 写的钓鱼邮件比人类写的更好、更具可信度^(5)。\n\n^(5) [`www.wired.com/story/ai-phishing-emails/`](https://www.wired.com/story/ai-phishing-emails/)\n\
  \n2019 年发表在 ZDNet 上的一篇题为“对抗性 AI：网络安全战即将来临”的文章^^(6) 概述了 AI 和 ML 在进攻行动中的未来用途，以及完全完全执行攻击的可能性。\n\
  \n^(6) [`www.zdnet.com/article/adversarial-ai-cybersecurity-battles-are-coming`](https://www.zdnet.com/article/adversarial-ai-cybersecurity-battles-are-coming)\n\
  \n考虑到恶意软件是网络战争的首选武器，且网络战争是国家国家安全政策的一部分，那么自然的下一步是研究机器学习在进攻性网络能力中的应用。一个重要重点是使用机器学习来开发和部署武器化恶意软件。\n\
  \n直接在恶意软件中实现机器学习会导致恶意软件在目标上消耗大量资源，并更有可能被发现。机器学习算法可以卸载到命令控制服务器上。给定恶意软件的不同实例将向命令控制中心传输数据。这些数据将经过机器学习处理，以提高当前部署的恶意软件的效能。其功能方式与僵尸网络与命令控制中心的通信非常相似。\n\
  \n或者，机器学习算法可以用于武器化恶意软件的开发和测试。这将使恶意软件更高效、更有效。机器学习还可用于增强漏洞发现，以提高攻击效能。\n\n### 积极趋势\n\
  \n似乎各国政府已经开始注意到这个问题，并采取了一些措施来减轻危险。例如，当时的参议员约翰·爱德华兹（北卡罗来纳州民主党）在 2002 年提了两法案，旨在分配\
  \ 4 亿美元用于网络安全工作。第一项措施称为《2002 年网络恐怖主义准备法》，其部分如图 12.4 所示，在 5 年内分配 3.5 亿美元用于改进网络安全，首先针对联邦系统，然后针对私营部门。它还将创建一个收集和分发信息的团体。《2002\
  \ 年网络研究与教育法》的部分如图 12.5 所示，将在 4 年内提供 5000 万美元奖学金，用于培训网络安全 IT 专家。它还建议建立一个基于网络的大学，让管理员可以在那里接受最新的培训。《网络研究与教育法》已通过并成为公共法第\
  \ 107-305 号。《2002 年网络恐怖主义准备法》未通过，但其许多目标已通过《爱国法案》得到解决。\n\n\n\n\n\n2013 年，德国披露其拥有一个计算机网络运营部门。一些公开报告显示该部门规模较小，约有\
  \ 60 名成员，但由于该部门的性质，很难获得准确数字。据报道，德国情报局（英语为 Federal Intelligence Service，德语为 Bundesnachrichtendienst，通常简称为\
  \ BND）从 2013 年开始雇佣大量黑客。\n\n越来越多的国家正将网络防御视为与其他任何防御领域类似的任务，并正在建立适当的军事和情报机构来应对。\n\n\
  在本书的第二版中，我曾提到：“要求每个警察局都配备一名计算机犯罪专家是不合理的。然而，州级调查机构应该能够聘用此类人员。”我非常高兴地报告，该领域的许多积极趋势已经超出了我的预期。首先，许多执法机构（即使是小规模的地方机构）现在确实已经有了网络取证侦探员。还有许多汇集了州、地方和联邦资源的网络犯罪特别小组。例如，美国特勤局在全国范围内建立了电子犯罪特别小组，汇集州、地方和联邦资源以打击网络犯罪和恐怖主义。国土安全部设立了区域融合中心（Fusion\
  \ Centers），以协助协调各级情报机构与执法机构之间的信息共享。\n\n## 负面趋势\n\n遗憾的是，随着立法机构意识到这一问题并将部分资源投入该领域，威胁仍在持续增长。兰德公司（Rand\
  \ Corporation）委托的一份报告指出，即使是像基地组织这样的团体——截至本文撰写未使用网络恐怖主义作为攻击手段之一——也利用互联网和计算机技术资源来策划其各种活动并协调训练。\n\
  \n早在 2000 年，美国联邦责任署就警告过几种可能的网络恐怖主义情景。如图 12.6 所示，他们所关心的攻击者比本章概述的任何场景都更具杀伤力。他们提出了可能的攻击场景，例如化学工厂中计算机控制的机器被篡改，导致有毒化学品释放到环境中。这可以通过多种方式实现，包括简单地导致机器大幅过产、过热，或者可能过早关闭设备。小组还考虑了通过计算机系统中断或破坏水水和电力供应的情景。从本质上说，他们关注的是网络攻击直接导致大规模伤亡的可能性，而不是本章场景所关注的经济损失。\n\
  \n![Description: 截图显示了关于网络恐怖主义的咨询小组报告。](img/12fig06.jpg)\n\n**图 12.6** 关于网络恐怖主义的报告。\n\
  \n## 防御网络恐怖主义\n\n随着世界对计算机系统的依赖日益增加，网络恐怖主义的危险将不断增长。显然，必须更加强调计算机安全。除了书中已经建议的基础安全措施外，还有关于准备和保护系统不受网络恐怖主义攻击的一些建议：\n\
  \n* 主要学术机构必须开始专门针对计算机安全的研究和学术计划。\n* 计算机犯罪必须被更严肃地对待，采取更严厉的惩罚并对疑似犯罪进行更积极的调查。\n* 与培训执法人员掌握基础计算机犯罪相比，我一直建议在执法部门中培训高技能的计算机专业人士更为合适。为了充分对抗网络恐怖主义，首要任务必须是一个高素质的计算机专家。\n\
  * 可能需要实施一种应急报告系统，让来自各行业的安全专家有一个单一来源，可以在此报告其系统遭受的攻击，并查看其他安全专家正在面临的问题。这可以使安全专家作为一个群体更快地识别出协同攻击的发生。\n\
  \n此外，你可以对现有的安全措施进行一些补充和改进。例如，你应该建立一套恢复流程，以便在有人删除重要文件时可以快速恢复数据。你还应该如第 9 章建议所示，评估哪些数据最有价值并将注意力放在这些数据上。但正如本章指出的，你必须考虑最初看起来价值较低的数据可能比预想的透露更多关于你个人或公司的信息。\n\
  \n## 恐怖分子招募与通信\n\n互联网是一个不可思议的通信工具。但它也是恐怖组织的通信和招募工具。网络聊天室是恐怖分子进行交流和计划的完美会面。人们可以轻松建立私密聊天室或公告板。恐怖组织的成员可以使用公共终端登录该聊天室或公告板并讨论计划。负责杀害电影导演泰奥·范高（Theo\
  \ van Gogh）的荷兰恐怖网络经常在 `Yahoo!` 上见面以制定和讨论计划。这只是恐怖组织利用互联网策划攻击的一个例子。\n\n互联网的无处不在使得地理位置分离的恐怖分子能够进行通信和协调。网站允许恐怖组织传播宣传、募集资金并招募新成员。而且正如讨论过的，互联网甚至会让极端组织激励孤立个人为了组织的利益而采取行动。\n\
  \n事实也是，各种恐怖组织一直在利用社交媒体进行招募。社交媒体可用于定位并吸引可能对恐怖组织表示同情的人。然后就可以进行引导过程（与恋童癖使用的类似）。如果需要，恐怖组织甚至可以通过互联网为新恐怖分子提供爆炸物等方面的培训。对恐怖组织的优势是，如果新手恐怖分子被捕，他对于恐怖组织一无所知。他从未见过任何成员，因此无法提供任何信息。\n\
  \n## TOR 与暗网\n\n`TOR` 在之前的章节中提到过，由于其与本章主题的相关在此再次讨论。`TOR`（洋葱路由）看起来并不像密码学的军事应用；但由于两个原因，在本章中讨论这一主题是合适的：\n\
  \n* `TOR` 项目基于美国海军在 20 世纪 90 年代开发的早期洋葱路由协议，专门用于军事目的。因此 `TOR` 是军事技术转化为民用事业的例子。\n\
  * `TOR` 被隐私维护者每天使用。但它也被恐怖组织和有组织的犯罪分子使用。\n\n`TOR` 由分布在世界各地的数千中继节点组成。每个中继节点都使用加密来隐藏通过其流量的源头甚至最终目的地。每个中继节点只能解密一层加密，揭示路径上的下一个站点。只有最后一个中继节点知道目的地，而只有第一个中继节点知道源头。这使得追踪网络流量几乎不可能。\n\
  \n洋葱路由的基本概念由 20 世纪 90 年代中期美国海军实验室开发，随后由国防高级研究计划局（DARPA）完善。其目标是在网上提供安全的情报通信。\n\n\n\
  \n\n\n洋葱路由使用 TLS（在第 13 章“网络侦探](#ch13.xhtml#ch13)”中有详细介绍）和临时密钥进行通信。临时密钥之所以被称为临时，是因为它们是为了特定的用途在使用后立即销。`128-bit\
  \ AES` 通常用于对称密钥。\n\n虽然`TOR`网络是维护隐私的有效工具，但它也成为隐藏犯罪活动的一种。`TOR`网络上存在专门用于销售和传播非法产品服务的市场。被盗的信用卡号和其他财务数据是`TOR`市场上的常见产品。图\
  \ 12.7 和图 12.8 中的图像让你对暗网的内容一目了然。这些都是真实的截图。必须指出，我和出版商都不支持这些网站。事实上，我经常与执法部门合作，并反对在这些网站上发生的行为。然而，如果你打算学习网络安全，你就应该知道外面存在什么。\n\
  \n![Description: 一张截图显示了“The peoples drug store”网站的首页。](img/12fig07.jpg)\n\n**图\
  \ 12.7** *暗网上的药物。*\n\n![Description: 一张截图显示了“ccPAL store”网站的首页。](img/12fig08.jpg)\n\
  \n**图 12.8** *出售的账户。*\n\n暗网上有些网站是虚假的吗？当然有。有些只是为了骗人们的钱，而不提供非法的服务或资金。但许多是真实的——特别是那些出售被盗信用卡、毒品和儿童色情的网站。\n\
  \n2015 年，丝绸之路（Silk Road）最著名的`TOR`市场创始人罗斯·乌尔布里特（Ross Ulbricht）被处无期监禁。许多新闻媒体的人声称这一判罚过于严酷。人们确实可以对任何判罚的价值。但请让我给你提供一些思考。丝绸之路不仅仅是一个隐私场所甚至是大麻交易场所。它成了一个大规模毒品交易的中心，包括海洛因、古柯和冰毒。它还被用于武器、被盗信用卡、儿童色情，甚至是雇凶杀。乌尔布里特先生创建的场所是数千起严重刑事罪行的中心。\n\
  \n## 总结\n\n很显然，有多种方法可以将网络恐怖攻击用于任何工业化国家。许多专家，包括各种政府小组、参议员和恐怖主义专家，认为这是一个非常真实的威胁。这意味着在保护你的计算机系统方面保持极端警惕比以往任何时候都重要。你必须超越数据的明显用途，看看意图伤害或造成经济困难的人将如何利用看似无关紧要的信息。在章末的练习中，你将有机会探索各种网络恐怖主义和信息战争威胁。\n\
  \n### 测试你的技能\n\n### 单选题\n\n1. 网络恐怖主义行为最可能的损害是什么？\n\nA. 亡员\nB. 军事策略被破解\nC. 经济损失\n\
  D. 通信中断\n\n2. 下列哪项不是网络恐怖主义导致财务损失的例子？\n\nA. 数据丢失\nB. 从账户转账资金\nC. 包括计算机在内的设施损坏\nD.\
  \ 计算机欺诈\n\n3. 下列军事/政府系统最可能成为成功计算机黑客的目标？\n\nA. `CIA` 最敏感的系统\nB. `NORAD` 的核系统\nC.\
  \ 低安全物流系统\nD. 军事卫星控制系统\n\n4. 下列哪项可能是国内网络恐怖主义的例子？\n\nA. `Sasser virus`\nB. `Mimail\
  \ virus`\nC. `Sobig virus`\nD. `MyDoom virus`\n\n5. 网络恐怖主义与其他计算机犯罪的区别在于什么？\n\nA.\
  \ 它是组织的。\nB. 它是政治或意识形态驱动的。\nC. 它是由专家实施的。\nD. 它通常更成功。\n\n6. 下列哪一个是已经利用互联网进行政治恐吓的政治团体？\n\
  \nA. `-`\nB. `-`\nC. `-`\nD. `-`（注：原文提供的 6-14 题选项为空，保持了结构）\n\n*注：问题 6-14 的原文包含占位符或间隙。我保持了要求的结构。*\n\
  \n7. 什么是信息战争？\n\nA. ` `\nB. ` `\nC. ` `\nD. ` `\n\n8. 下列哪项可能是……的？\n\nA. ` `\nB.\
  \ ` `\nC. ` `\nD. ` `\n\n9. 下列哪项可能是……的？\n\nA. ` `\nB. ` `\nC. ` `\nD. ` `\n\n10.\
  \ 发送一条加密加密的消息，意图被拦截和破解，是什么的例子？\n\nA. ` `\nB. ` `\nC. ` `\nD. ` `\n\n11. 下列哪项最能描述任何机构的……？\n\
  \nA. ` `\nB. ` `\nC. ` `\nD. ` `\n\n12. 下列哪项冲突具有网络成分？\n\nA. 1989 年入侵巴拿\nB. 1990\
  \ 年科索沃危机\nC. 1990 年索马利亚危机\nD. 越南战争\n\n13. 下列哪一机构曾有间谍被捕？\n\nA. `NSA`\nB. `KGB`\n\
  C. `FBI`\nD. `CIA`\n\n14. 下列哪项是可能导致人员死亡的网络攻击？\n\nA. 破坏银行系统\nB. 破坏水系统\nC. 破坏安全系统\n\
  D. 破坏化学工厂控制系统\n\n### 练习\n\n#### 练习 12.1：寻找信息战争\n\n1. 选择一个当前的政治话题。\n2. 在多个公告板、新闻组或博客上跟踪该话题。\n\
  3. 寻找可能表明旨在影响观点或信息战争的迹象。这可能包括由不同个人发布的具有高度相似观点、语法和句法的帖子。\n4. 写一篇短文，讨论你发现了什么以及为什么你认为它构成了信息战争。\n\
  \n#### 练习 12.2：网络恐怖主义评估\n\n1. 选择一个你觉得有趣的活动团体（政治或意识形态的）。\n2. 仅使用互联网收集有关该组织的尽可能信息。\n\
  3. 为该团体写一份简要报告，包括你认为该团体参与信息战争或网络恐怖主义的可能性以及原因。\n\n#### 练习 12.3：寻找信息政策\n\n1. 使用互联网或其他资源，找到几个关于信息传播的组织政策示例。\n\
  2. 找到所有此类政策的共同点。\n3. 写一篇短文，解释为什么这些政策可能与传播或防止信息战争有关。\n\n#### 练习 12.4：公司如何防御网络恐怖主义\n\
  \n1. 访问某公司的 IT 人员，了解他们在保护系统时是否直接考虑了信息战争或网络恐怖主义。\n2. 了解他们采取哪些步骤来保护公司免受这些威胁。\n3. 写一篇短文，解释你发现了什么。\n\
  \n#### 练习 12.5：综合总结\n\n\n\n\n结合你从之前章节中学到的知识，哪些信息可以应用于保护系统免受网络恐怖主义或信息战争的侵害？请简要概述你采取的步骤以确保系统不受这些威胁的侵害。\n\
  \n### 项目\n\n### 项目 12.1：计算机安全与网络恐怖主义\n\n考虑你到为止在书中检查过的各种安全措施。鉴于网络恐怖主义的威胁，写一篇文章讨论这些方法如何与网络恐怖主义相关。同时，讨论基于计算机的恐怖主义威胁是否需要比你平时可能使用的更高的安全标准，并解释原因或为什么不需要。\n\
  \n### 项目 12.2：法律与网络恐怖主义\n\n注意：这是一个小组项目。\n\n利用网络或其他资源，寻找并研究你认为与网络恐怖主义相关的法律。然后写一篇文章，描述你认为需要针对网络恐怖主义编写的立法。从本质上说，你们小组应该充当为国会委员会起草新法律的专家顾问。\n\
  \n### 项目 12.3：网络恐怖主义场景\n\n考虑本章提出的任何理论性网络恐怖主义场景，编写一份你认为能够应对该场景并防止该特定威胁的安全及响应计划。\n\
  \n## 案例研究\n\nJane Doe 是一家小型国防承包商的负责安全的网络管理员。她的公司处理一些低级机密材料。她实施了强有力的安全方法，包括：\n\n\
  * 防火墙关闭了所有不必要的端口。\n* 所有机器上都安装了病毒扫描器。\n* 网络分段之间的路由器已采取安全措施。\n* 所有机器的操作系统每月更新一次补丁。\n\
  * 密码长且复杂，每 90 天更改一次。\n\n你还会向 Jane Doe 提出哪些建议？请解释你每项建议的原因。\n\n## 第 13 章\n\n## 网络侦探\n\
  \n### 章节目标\n\n在阅读本章并完成练习后，你将能够做到：\n\n* 在网络上查找联系方式\n* 在网络上查找法院法院记录\n* 在网络上查找犯罪记录\n\
  * 使用 Usenet 新闻组收集信息\n* 理解互联网上的来源\n\n### 引言\n\n在前面的章节中，我们检查了计算机安全的许多方面。其中三个问题引导我们进入本章的内容。第一个是身份盗窃，第二个是黑客攻击，第三个是对敏感职位的潜在员工进行调查。\n\
  \n为了让犯罪分子实施身份盗窃，她必须从目标身上获取少量信息，并利用这些信息获取更多信息。也许一张被丢弃的信用卡收据或公用事业账单成为起点，犯罪者从那里找到足够的信息来冒充被害者的身份。本章将向你展示一些利用互联网查找某人额外信息的技巧。你需要了解这是如何实现的，以便更好地准备防御，并让你意识到关于你本人的哪些信息是公开可见的。甚至有一个术语专门用于在垃圾桶中搜索有价值的信息：`Dumpster\
  \ diving`。\n\n黑客，至少是熟练的黑客，想要目标人物、组织和系统的信息，以协助破坏安全。无论犯罪者是试图使用社会工程学还是仅仅尝试猜测密码，拥有有关目标的信息都将有助于任务。一旦你意识到获取某人的个人信息是容易，你就会明白为什么安全专家如此坚决地认为你不能使用任何与你、你的职业、你的爱好或可能追溯到你身上的事情相关的密码。\n\
  \n最后，当你招聘可能接触敏感数据的员工时，仅仅拨打他们提供的推荐人并不是检查背景的充分方法。而聘请私家侦探可能是不现实的。本章中的信息可能对你亲自进行某种程度的调查有所帮助。\n\
  \n这可能会让一些读者感到惊讶，但网络管理员在雇用前接受调查具有特殊的意义。大多数公司对网络管理员进行的检查与对其他人相同的粗略检查。这通常包括核实学位/证书以及拨打推荐电话。对于某些公司，这可能包括信用检查和当地犯罪检查。然而，网络管理员应该受到更彻底的调查。原因非常简单：无论你的安全措施有多严密，都无法挡住设置并维护它的人。如果你正在考虑为公司招聘网络管理员，知道他曾隶属于黑客组织可能对你有所帮助。或者仅仅知道他在判断上出现过失误，可能表明他未来发生类似失误的可能性更大。这看起来可能有点偏执，但读到这本书的这里，你应该已经培养出一点健康的偏执了。\n\
  \n互联网可以是一个非常有价值的调查工具。它可以用来寻找潜在员工、保姆等等。互联网上的大部分信息也是免费的。许多州都有在线法院记录，还有许多其他你可以使用的资源。在本章中，我们将检查一些可以用来定位关键信息的各种资源。\n\
  \n\n\n一个相当易用的服务是 Yahoo! 人口搜索。当你访问 [www.yahoo.com](http://www.yahoo.com) 时，会在页面上看到许多选项。其中一个选项就是图\
  \ 13.1 所示的人口搜索。或者你也可以直接访问 [`itools.com/tool/yahoo-people-search`](http://itools.com/tool/yahoo-people-search)。\n\
  \n![描述：一张截图显示了 Yahoo 的“Yahoo 人口搜索”选项。它包含 3 个字段：名、姓以及城市或城镇，以及一个用于选择州的下拉菜单。](img/13fig01)\n\
  \n图 13.1 Yahoo! 人口搜索。\n\n当你选择此选项时，你会看到一个与图 13.2 所示类似的屏幕。在这个屏幕上，你输入名、姓，以及城市或州。然后你可以搜索电话号码/地址或电子邮件邮箱。\n\
  \n![Images/13fig02]\n\n图 13.2 搜索。\n\n为了说明其工作原理，我用我的名字在德克萨斯州进行了搜索。图 13.2 中显示的数据并不准确。各种条目显示我的年龄，或者已经不存在很长时间了。最接近的列表声称我住在理查德森。因此，虽然互联网上可以获得信息，但在开始搜索之前了解得越多，你就越能有效地过滤掉错误的结果。这些只是允许你调查并发现个人家庭地址或电话号码的许多网站中的两个。这里列出了你应该考虑的其他几个优质网站：\n\
  \n- [www.yellowpages.com](http://www.yellowpages.com)\n- [www.theimates.com/white/](http://www.theimates.com/white/)\n\
  - [www.facebook.com](http://www.facebook.com)\n- [www.whowhere.com](http://www.whowhere.com)\n\
  - [www.whitepages.com](http://www.whitepages.com)\n- [www.LinkedIn.com](http://www.LinkedIn.com)\n\
  - `Pipl`: https://pipl.com/\n- `Spokeo`: http://www.spokeo.com/\n- `BirthdayDatabase.com`:\
  \ http://www.birthdatabase.com/\n- `Whitepages`: http://www.whitepages.com/\n- `People\
  \ Search Now`: http://www.peopleschnow.com/\n- `Zabasearch`: http://www.zabasearch.com/\n\
  - `Peoplefinders`: http://www.peoplefinders.com/\n- `Justia email finder`: http://virtualchase.justia.com/content/finding-email-addresses\n\
  \nhttp://virtualchase.justia.com/content/finding-email-addresses\n\n重要的是，你提供的信息越多，缩小搜索范围越小，找到你所需内容的概率就越大。所有这些网站都可以帮助寻找现在和过去的电话号码及地址。在对员工进行背景调查时，这对验证之前的地址很有用。\n\
  \n还有用于搜索图片和进行图片反向搜索的网站。其中一些网站如下：\n\n- [`www.reverse-image-search.com`](https://www.reverse-image-search.com)\n\
  - [`www.google.com/imghp?hl=en`](https://www.google.com/imghp?hl=en)\n- [`www.imageidentify.com`](https://www.imageidentify.com)\n\
  \n这里列出的最后一个网站特别有趣，因为你可以上传任何图片，网站将尝试识别该图片。\n\n### 提示：尊重隐私\n\n你可能会奇怪，为什么我愿意把家庭地址和电话号码写在出版的书中。首先，显示的电话号码和地址并不准确。它们是过时的，已经不再有效了。而且，为了说明这个过程，我需要一个名字来使用。由于前面提到的责任原因，我不能使用别人的的名字。任何想要寻找我当前信息的人都不会遇到困难。我的姓氏并不常见，而且是一个半公众人物。然而，如果读者希望联系我，强烈建议他们通过我的网站\
  \ ([www.chuckeasttom.com](http://www.chuckeasttom.com)) 和电子邮件地址 (chuck@chuckeasttom.com)\
  \ 而不是电话。我尽量回复所有的电子邮件，但经常避开电话。而且我绝对不鼓励任何人突然造访我家！\n\n### 电子邮件搜索\n\n[`virtualchase.justia.com/content/finding-email-addresses/`](https://virtualchase.justia.com/content/finding-email-addresses/)\
  \ 网站链接到多个电子邮件搜索网站。链接的某些网站还可以获取地址和电话号码。你可以从 [`virtualchase.justia.com/content/finding-email-addresses/`](https://virtualchase.justia.com/content/finding-email-addresses/)\
  \ 进入的网站之一是 [`www.freeality.com/finde.htm`](http://www.freeality.com/finde.htm)，它有许多额外的搜索，如图\
  \ 13.3 所示。\n\n\n\n\n\n![Description: 截图显示了“联邦调查局”（FBI）网站的首页，列出了性犯罪者注册网站的列表。](img/13fig05.jpg)\n\
  \n**图 13.5** *FBI 各州性犯罪者登记表。*\n\n![Description: 截图显示了来自德克萨斯州公共安全部记录服务的德克萨斯州性犯罪者搜索页面。页面显示了与德克萨斯州性犯罪者注册计划相关的内容。](img/13fig06.jpg)\n\
  \n**图 13.6** *德克萨斯州性犯罪者搜索页面。*\n\n德克萨斯州性犯罪者登记最引人注的特点之一是它列出了个人被定罪的罪，并提供了犯罪者的照片。这非常重要，因为“性犯罪者”一词涵盖了广泛的犯罪。其中某些犯罪可能可能并不会影响你是否应该雇佣此人。在决定某人不适合与你的孩子接触或在你的组织工作之前，了解其被定罪的具体内容是有关重要的。\n\
  \n还应该注意的是，iPhone/iPad 上有一个名为 `Offender Locator` 的应用程序，它会获取你的 `GPS` 位置并列出附近的已注册性犯罪者。\n\
  \n一些性犯罪者犯下了极其残忍的罪行，许多父母想要利用这些信息来了解潜在的保姆和教练。这些信息可能也适用于招聘筛选。然而，每当将任何信息用于招聘筛选时，建议检查你所在地区的法律。在法律上，你可能无法根据某些信息做出用人决策。与所有法律问题一样，你采取妥行动是咨询信誉良好的律师。\n\
  \n### 注意事项\n\n#### 身份认错\n\n性犯罪者名单曾出现过身份认错的情况。每当在你正在调查的个人身上发现负面信息时——无论来源何处——在采取任何行动之前，你都有伦理责任核实该信息。\n\
  \n#### 民事法院记录\n\n一个人可能涉及许多种犯罪以及民事问题，这些问题可能导致她不适合某项工作。如果你正聘佣某人在人力资源部门工作并监督均机会问题，了解她是否参与过家庭暴力、种族动机驱动的涂鸦或其他类似问题可能会影响你的用人决策。或者，如果你正在考虑建立业务伙伴，发现你的潜在伙伴是否曾被其他业务伙伴起诉或是否曾申请破产将是明智的。遗憾的是，在这些任何情况下，你不能仅仅依赖对方的诚实。你需要自己去检查这些事情。\n\
  \n遗憾的是，这一领域的法律问题还没有像性犯罪那样转化为网络格式。然而，许多州和联邦法院都提供在线记录。在这一问题上组织得最好且最完整的是俄克拉荷马州。你可以在\
  \ `www.oscn.net/applications/oscn/casesearch.asp` 找到俄克拉荷马州的网站，其首页搜索页如图[图 13.7]所示。\n\
  \n该网站允许你通过姓、姓和名、案号等进行搜索。你将获得找到的任何案件的完整记录，包括目前的处理结果和任何提交的文件。这包括了民事和刑事诉讼。奇怪的是，至少有五个不同的网站在收取费用提供俄克拉荷马州案件的信息——而所有这些信息在网上其实是免费的。这说明了一个需要记住的关键点。许多网站/公司提供付费代为进行搜索，费用从\
  \ 9.95 美元到 79.95 美元不等。事实上，他们的速度可能比你快。但事实同样是，你可以免费找到与这些人完全相同的信息。希望本章将为你提供成功完成此任务所需的信息。![Description:\
  \ 截图显示了“俄克拉荷马州法院网络”首页上的可用搜索选项，用于搜索俄克拉荷马州的在线法院记录。](img/13fig07.jpg)\n\n**图 13.7**\
  \ *俄克拉荷马州在线法院记录。*\n\n#### 其他资源\n\n许多其他网站对你的搜索非常有帮助。有几个值得特别关注。国家州法院中心（National Center\
  \ for State Courts）在 `http://www.ncsc.org` 有一个网站，列出了全美各州法院的链接。它还列出了澳大利亚、巴西、加拿大和英国等国家的几个国际法院。如果你正在寻找法院记录，这个网站是一个极佳的起点。有一个政府访问网站可以帮助寻找所有的联邦法院。该网站是\
  \ `www.uscourts.gov/court_locator.aspx`。\n\n以下列表旨在为你提供全美范围内的在线搜索提供一个起点。这些网站将帮助你开始搜索法院记录：\n\
  \n- **Pacer:** `www.pacer.psc.uscourts.gov`\n- **监狱搜索:** `www.ancestorhunt.com/prison_search.htm`\n\
  - **联邦监狱记录:** `www.bop.gov`\n- **公共记录:** `http://publicrecords.searchsystems.net`\n\
  - **联邦监狱管理局:** `www.bop.gov`\n\n当你环游互联网时，你会发现其他令你感兴趣的网站。这可能是由于它们的易用性、内容或其他因素。当你发现此类网站时，请将它们收藏起来。很快，你将拥有一套搜索引擎工具库。而且，你使用它们的熟练程度将会提高，并学会哪些工具适用于哪种信息。这将让你能够熟练地获取所需的信息。\n\
  \n### Usenet\n\n许多对互联网较新的读者（过去 5 年内）可能不熟悉 Usenet。Usenet 是一个存在于任何想象的主题上的全球公告板组。有特定的软件包用于查看这些新闻组，但从以前起，可以通过网络门户访问。搜索引擎\
  \ `Google` 在其主页上有一个名为 `Groups` 的选项。当你点击该选项时，将进入 Google 的 Usenet 门户，如图[图 13.8]所示。\n\
  \n![Description: 截图显示 Google 的 Usenet 门户。](img/13fig08.jpg)\n\n**图 13.8** *Google\
  \ 访问 Usenet 组。*\n\n### 注意事项\n\n#### Usenet 信息\n\n任何人可以在 Usenet 上发布任何内容。没有任何限制。如果你在\
  \ Usenet 上发现关于某人的负面评论，自动假设该评论为真是不明智的。这些帖子只能作为调查的一部分，并且只有当调查的其他方面也支持你发现的帖子时，它们才具有信度。\n\
  \n如你所见，新闻组被分为大类。例如，致力于科学主题的新闻组可以在 `sci` 标题下找到。这包括 `sci.anthropology`、`sci.logic`、`sci.math.stat`\
  \ 等小组。`alt` 标题是万物的杂烩分类。这个类别涵盖了从 `alt.hacking` 到 `alt.adoption` 的各种内容。\n\n你可能认为，虽然这些都很迷人，但它们与追踪信息无关。但实际上有关。例如，如果你正聘佣一名网络管理员，你可以查看她是否在各种网络管理组中发布过帖子，以及这些帖子是否揭示了关于她网络的关键信息。如果你愿意花时间挖掘所需的信息，这个工具可能是你拥有的的最最重要的调查工具。\n\
  \n\n\n\n\n无疑你一定用过 Google 搜索术语；然而，你可能并没有意识到 Google 搜索功能的多样性。通过高级操作符，Google 可以成为一个更强大的搜索工具。表\
  \ 13.1 描述了一些常用的 Google 搜索参数。\n\n**表 13.1** *常用的 Google 搜索参数*\n\n![Images](img/13tab01.jpg)\n\
  \n这些只是其中几项。更长的列表可以在 [`hackr.io/blog/google-dorks-cheat-sheet`](https://hackr.io/blog/google-dorks-cheat-sheet)\
  \ 找到。\n\n## Maltego\n\nMaltego 是一款开源情报与法医取证应用程序，提供卓越的数据挖掘和情报搜集能力。它有多个版本，你可以从 [`www.paterva.com/web7/downloads.php#tab-3`](https://www.paterva.com/web7/downloads.php#tab-3)\
  \ 下载。社区版是免费的。\n\nMaltego 通过其图表库，结合多种易懂的视图很好地展示了结果，它能够识别数据集之间的关键关系，并识别它们之间此前未知的关系。图\
  \ 13.9 显示了 Maltego 的主界面。\n\n![Description: 图形用户界面，应用程序描述自动生成](img/13fig09.jpg)\n\
  \n**图 13.9** *Maltego*\n\nMaltego 主要通过处理实体（entities）和转换（transforms）来工作。你选择某些实体（电子邮件地址、网站、人员、电话号码等）并为该实体选择一个转换。一旦你选择了要绘制图表的内容（无论是人员、电子邮件地址、网站或其他项目），该实体与其他实体之间的关系将以图表的形式显示，如图\
  \ 13-10 所示。\n\n![Images](img/13fig10.jpg)\n\n**图 13.10** *Maltego 图谱*\n\n图 13.11\
  \ 显示了如何开始新图表。只需选择 `Share Graph`，然后根据你选择的实体和转换创建一个新图表。\n\n![Description: 图形用户界面，文本，应用程序，聊天或文本消息描述自动生成](img/13fig11.jpg)\n\
  \n**图 13.11** *启动新的 Maltego 图谱*\n\nMaltego 比我们在本章中讨论的其他某些工具更复杂。然而，网络上有很多教程可以帮助你掌握这一工具，例如：[`www.paterva.com/web7/docs/documentation.php`](https://www.paterva.com/web7/docs/documentation.php)\n\
  \n## 总结\n\n我们在本章中看到，互联网对于任何类型的调查来说都是一个宝贵的资源。它通常是黑客和身份窃用者用来获取其目标信息的工具之一。然而，在研究潜在员工或业务伙伴时，它也可以是你的一个非常有价值的工具。此外，定期查询互联网上关于你的信息对你来说也是无价的。看到不准确的奇怪数据可能表明你已经成为了身份身份窃用的受害者。\n\
  \n## 检验你的技能\n\n#### 多选题\n\n1. 身份窃用者可能如何利用互联网来利用他的受害者？\n\nA. 他可能会找到更多关于目标的信息，并利用这些信息实施犯罪。\n\
  \nB. 他可以查到目标在储蓄账户中有多少钱。\n\nC. 身份窃用者通常不使用互联网来完成任务。\n\nD. 他可以使用互联网拦截目标的电子邮件，从而获取目标个人生活的权限。\n\
  \n2. 下列哪项不是寻找电话号码和地址的理想地点？\n\nA. Yahoo! People Find\n\nB. People Search\n\nC. 国际电话注册表\n\
  \nD. Infobel\n\n3. 为什么你不希望互联网上有太多关于你的个人数据？\n\nA. 它可能会揭露关于你的一些尴尬的事实。\n\nB. 它可能被身份窃用者用来冒充你的身份。\n\
  \nC. 它可能被潜在的雇主用来了解更多关于你的信息。\n\nD. 没有理由担心互联网上的个人信息。\n\n4. 黑客可以如何使用通过互联网搜索找到关于你的信息？\n\
  \nA. 如果你的密码与出生日期、地址或电话号码等个人信息相关，它就可以被用来猜测密码。\n\nB. 如果你的密码与你的兴趣或爱好相关，它就可以被用来猜测密码。\n\
  \nC. 它可以用于社会工程学，以获取关于你或你的计算机系统的更多信息。\n\nD. 以上答案都是正确的。\n\n5. 如果你正在招聘一名新员工，你应该执行以下哪些操作？\n\
  \nA. 验证学位和证书。\n\nB. 打打推荐人电话。\n\nC. 进行互联网搜索以验证联系信息并检查犯罪记录。\n\nD. 以上答案都是正确的。\n\n6.\
  \ 对于潜在的业务伙伴，了解以下哪项内容*最不*重要？\n\nA. 过去的破产记录\n\nB. 15 年前因持有大麻被捕的记录\n\nC. 来自前业务伙伴的诉讼\n\
  \nD. 醉酒驾 (DUI)\n\n7. 什么信息可以提供定位某人的最准确结果？\n\nA. 名字 + 州\n\nB. 名字 + 姓 + 州\n\nC. 姓 +\
  \ 州\n\nD. 名字 + 姓\n\n8. 在列出的网站中，哪一个最适用于获取非美国人的地址和电话号码？\n\nA. FBI 网站\n\nB. Yahoo\n\
  \nC. Infobel\n\nD. Google\n\n9. 你去哪里可以寻找各种罪犯登记？\n\nA. FBI 网站\n\nB. 国家罪犯数据库\n\nC.\
  \ 州际罪犯数据库\n\nD. 特殊受害者小组网站\n\n10. 对于登记中的人员，了解什么最重要？\n\nA. 他的惩罚程度\n\nB. 她犯罪时的年龄\n\n\
  C. 他出狱多久了\n\nD. 她犯罪的性质\n\n11. 在检查犯罪背景时，哪种网络搜索方法最好？\n\nA. 优先检查个人所在的州。\n\nB. 优先检查联邦记录。\n\
  \nC. 检查当前和之前的居住州。\n\nD. 检查可能所在的地方。\n\n12. 商业搜索服务有什么优势？\n\nA. 它们可以获取无法获取的信息。\n\n\
  B. 它们获取信息比你快。\n\nC. 它们可以完成比你更彻底的工作。\n\nD. 它们法律上有权搜索，而你没有。\n\n13. 你会使用什么来开始搜索美国法院案件的信息？\n\
  \nA. 国家法院中心网站\n\nB. Infobel\n\nC. Yahoo! People Search\n\nD. Google Groups\n\n14.\
  \ 下列哪项是对 Usenet 最准确的描述？\n\nA. 全国性的公告板\n\nB. 计算机安全信息库\n\nC. 大规模聊天室\n\nD. 全球公告板集合\n\
  \n15. 从 Usenet 上获取关于你正在调查的人员的信息，以下哪项数据最有帮助？\n\nA. 你正在调查的人员发布的帖子\n\nB. 帮助你调查的安全提示\n\
  \nC. 布布的犯罪记录\n\nD. 其他人对目标的负面评论\n\n### 练习\n\n\n\n\n对于本章中的所有练习和项目，你将专注于对某个人进行调查。最好的方法是调查你自己（这更容易评估你所发现内容的准确性），或者调查班级里的同学或自愿担任调查目标的讲师。在不经他人知情或许可的情况下仅仅调查随机人员涉及伦理问题。此外，避免在教室里让别人感到尴尬也很重要。因此，调查的志愿者目标应该确保无论发现了什么，他们都不会感到尴尬。在项目和练习中，请将你调查的姓名替换为\
  \ `John Doe` 或 `Jane Doe`。\n\n### 练习 13.1：查找电话号码\n\n1. 从 `Yahoo! People Search`\
  \ 开始，寻找 `John Doe` 的电话号码和地址。\n2. 使用至少另外两个来源来查询 `John` 的电话号码。\n\n你获得的信息是太少还是太多了？你能够确定正确的、当前的电话号码吗？\n\
  \n### 练习 13.2：犯罪记录查询\n\n1. 使用本章列出的来源或其他网站，查找 `John Doe` 的犯罪背景信息。从 `John` 目前居住的州开始，然后检查其他州，特别是那些在\
  \ `Exercise 13.1` 中出现过 `John` 名字的州。\n2. 扩大搜索范围以检查联邦犯罪。\n\n### 练习 13.3：检查法院案件\n\n\
  1. 搜索法院记录，查找 `Jane Doe` 业务的任何法院案件。\n2. 如果适用，检查州许可机构网站，查看有关 `John` 业务的任何历史或投诉。\n\n\
  ### 练习 13.4：在 Usenet 上查找业务信息\n\n1. 访问 `Usenet`。\n2. 搜索 `Jane Doe` 可能与其业务相关的发布帖子的公告板和其他群组。\n\
  \n你能够通过她在 `Usenet` 群组中发布的帖子，获得更多关于 `Jane` 业务的内吗？\n\n### 练习 13.5：屏蔽信息\n\n本章说明了你获取某人信息的许多方法，并指出了互联网上存在过多个人信息的潜在危险。那么，你可以做些什么来防止不法之徒发现过太多关于你的信息呢？检查本章列出的主要网站（`Yahoo!`\
  \ 和 `Google`），查看它们是否提供任何阻止你的信息被分发的手段。还有其他阻止访问你个人信息的方法吗？\n\n### 项目\n\n#### 项目 13.1：调查某个人\n\
  \n使用本章中的所有网络资源以及你遇到的任何其他资源，对 `Jane Doe` 进行彻底调查。尝试确定她的地址、电话号码、职业、年龄以及任何犯罪记录。你甚至可以检查\
  \ `Usenet` 帖子，发现关于 `Jane` 爱好和个人兴趣的线索。根据你的发现，为 `Jane` 撰写一份简要报告。\n\n#### 项目 13.2：调查一家公司\n\
  \n使用本章中的所有网络资源以及你遇到的任何其他资源，对 `John Doe` 的业务进行彻底调查。他从政多久了？任何监管机构对该业务有任何投诉吗？`Usenet`\
  \ 论坛上有任何投诉吗？是否有任何业务关系？是否有任何过去的法院诉讼？根据你的发现，写一份报告讨论你对该业务的分析。\n\n#### 项目 13.3：调查的伦理\n\
  \n写一篇文章讨论在线调查的伦理问题。你觉得这些调查是侵犯隐私的吗？为什么或者为什么不？如果你认为它们是侵犯隐私的，你认为可以采取什么措施？获取不准确的信息是否存在问题？\n\
  \n## 案例研究\n\n`Henry Rice` 是某小公司的所有者兼首席执行官，他一直在寻找一个新的人力资源管理员。经过多轮面试，他将范围缩小到两个他认为是最佳候选人的人。每个人的资质非常相似，因此\
  \ `Henry` 的决策很可能是基于他发现的信息。`Henry` 正在根据科学知识收集、分析并向法院呈交证据。`Henry` 已经获得了书面许可以进行研究。请考虑以下问题：\n\
  \n1. `Henry` 应该从哪里开始调查？\n2. 哪些网站或类型的信息至关重要？\n3. 对于人力资源是否存在哪些问题？\n\n写一篇简短的文章，概述 `Henry`\
  \ 在进行研究时应采取的步骤。\n\n### 第 14 章\n\n## 取证引言\n\n### 本章目标\n\n在阅读本章并完成练习后，你将能够：\n\n- 理解基础取证原则\n\
  - 制作磁盘镜像\n- 使用基础取证工具\n- 准备取证报告\n- 避免常见的取证错误\n\n### 引言\n\n在之前的 13 章中，你已经接触了各种安全主题：从\
  \ `CIA` 三角形到 `session hijacking` 等攻击，再到 `IDS` 等防护。在本章中，我们将介绍计算机取证的基础。对于任何涉及计算机安全或网络管理的人来说，这是一个非常重要的话题。通常，计算机犯罪的第一响应者是网络管理员而非执法人员。如果你未能妥善处理证据，可能会使其在法庭上失效并破坏定罪的机会。\n\
  \n计算机取证是一个相对新的领域。计算机的广泛使用可以追溯到 70 年代，而广泛计算机犯罪可以追溯到 90 年代。计算机取证领域在过去的 20 到 25 年里不断进化。计算机取证（现在被称为\
  \ `cyber forensics`）试图将科学应用于计算机设备。\n\n`CERT` 这样定义计算机取证：如果你管理或维护信息系统，你应该了解取证。取证是利用知识收集、分析并向法院提交证据的过程（`forensics`\
  \ 的意思是“带法庭”）。取证主要涉及隐藏证据的恢复和分析。隐藏证据可以采取多种形式，从窗户上的指纹到血迹中恢复的 DNA 证据，再到硬盘上的文件。\n\n`cyber\
  \ forensics` 的目标是使用科学方法检查设备（笔记本电脑、服务器、手机、平板电脑等）提取证据，以便这些证据可以在法庭上呈交。现在，你当然会在某些场景中使用取证，但这些技术是为了满足法院的要求而设计的。\n\
  \n重要的是，少数司法管辖区通过了法律，要求为了提取证据，调查人员必须是执法人员或持照的私家探。这是一个具有争议的法律，因为通常私家探的培训和许可并不包括计算机取证培训。你应该检查当地的具体规定。然而，许多州允许你在获得所有者许可或持照人员查封证据的情况下对计算机进行取证检查。因此，这并不会禁止你在公司对计算机进行取证检查。\n\
  \n\n\n\n### 不要触碰嫌疑硬盘\n\n第一项，可能也是最重要的预防措施是尽可能少触碰系统。你不希望在检查过程中对系统进行任何更改。让我们来看一种创建法证学有效硬盘副本的可能方法。其中某些部分取决于\
  \ Linux 命令，你可能熟悉也可能不熟悉。如果你不熟悉，我曾让过没有 Linux 经验的学生使用这些相同的命令，并能够完成制作硬盘法证副本的任务。在本节的后半部分，我将向你展示如何使用其他取证工具对硬盘进行镜像，但首先我们将讨论如何在不使用专用工具的情况下完成任务。\n\
  \n你需要一个可启动的 Linux 副本。任何 Linux Live CD 都可以。你实际上两个副本：一个在嫌疑机器上，一个在目标机器上。无论你使用哪个版本的\
  \ Linux，步骤都是相同的：\n\n你必须完全擦除目标硬盘：\n\n```\ndd if=/dev/zero of=/dev/hdb1 bs=2048\n\
  ```\n\n现在，你需要设置目标取证服务器以接收你想要检查的嫌疑硬盘副本。`netcat` 命令可以帮上忙：\n\n```\nnc -l -p 8888 >\
  \ evidence.dd\n```\n\n在这里，你告诉机器监听端口 `8888` 并将收到的任何内容放入 `evidence.dd` 中。\n\n在嫌疑机器上，你必须启动硬盘信息发送到取证服务器：\n\
  \n```\ndd if=/dev/hda1 | nc 192.168.0.2 8888 -w 3\n```\n\n当然，这假设嫌疑硬盘是 `hda1`。如果不是，请用你使用的分区替换命令中的该部分。这还假设服务器的\
  \ IP 地址为 `192.168.0.2`。如果不是，请将其替换为你的取证 IP 地址。\n\n你还想为嫌疑硬盘创建一个哈值。稍后你可以对正在工作的硬盘进行哈希，并与原始硬盘的哈值进行比较，以确认没有任何内容被修改。你可以使用\
  \ Linux 命令创建哈值：\n\n```\nmd5sum /dev/hda1 | nc 192.168.0.2 8888 -w 3\n```\n\n完成后，你就有了一个硬盘副本。通常的做法是制作两个副本：一个用于工作，另一个仅供存储。但在任何情况下，都不要在嫌疑硬盘上进行法证分析。\n\
  \n### 使用取证工具制作硬盘镜像\n\nAccessData 是 Forensic Toolkit (FTK) 和 FTK Imager 的制造商。Forensic\
  \ Toolkit 是一种商业产品，可能有点贵。FTK Imager 是一个免费下载工具，可以用于制作硬盘镜像以及挂载已制作的镜像。首先启动 FTK Imager，如图\
  \ 14.1 所示。\n\n![Description: 显示了版本 3.1.2 Access Data FTK Imager 应用程序截图。](img/14fig01.jpg)\n\
  图 14.1 FTK Imager。\n\n选择 `File`（文件）并选择 `Create Disk Image`（创建磁盘镜像），如图 14.2 所示。\n\
  \n![Description: 截图显示了 Access Data FTK Imager 应用程序 File 选项卡下的可用选项，其中选中了“Create disk\
  \ image”选项。](img/14fig02.jpg)\n图 14.2 FTK Imager—创建磁盘镜像。\n\n接下来，系统提示选择你想要镜像的硬盘类型，如图\
  \ 14.3 所示。\n\n![Description: 截图显示了 FTK Imager 应用程序的选择源对话框。它以单选按钮的形式显示选项。显示的选项有物理驱动器、逻辑驱动、镜像文件、文件夹内容和法证设备。](img/14fig03.jpg)\n\
  图 14.3 FTK Imager—选择源。\n\n现在，根据你选择的源类型，你将做出另一个选择。例如，如果你选择了 `Logical Drive`（逻辑驱动），你现在需要选择是哪个逻辑驱动，如图\
  \ 14.4 所示。\n\n![Description: 截图显示了 FTK Imager 应用程序的选择驱动器对话框。](img/14fig04.jpg)\n\
  图 14.4 FTK Imager—源驱动选择。\n\n最后，选择镜像的路径，如图 14.5 所示。\n\n![Description: 截图显示了 FTK Imager\
  \ 应用程序的创建镜像对话框。](img/14fig05.jpg)\n图 14.5 FTK Imager—创建镜像。\n\n挂载镜像的过程更加简单。FTK Imager\
  \ 在取证社区备受推誉，易于使用且免费。\n\n我们在本章中使用的另一个工具是 OSForensics。该工具的网站为 `https://www.osforensics.com`。与许多其他取证工具不同，它提供免费的\
  \ 30 天下载。为了让你能够进行各种活动，OSForensics 还允许你制作镜像。你首先从左侧菜单选择 `Forensic Imaging`（法证镜像），如图\
  \ 14.6 所示。\n\n![Description: 显示了 OSForensics 的截图。在左侧面板中高亮了镜像选项。在右侧面板显示了镜像文件、描述、方法等细节。](img/14fig06.jpg)\n\
  图 14.6 OSForensics 镜像。\n\n### 你可以在实机上进行现场取证吗？\n\n我们强调过，而且这是正确的，尽可能你都应该创建一个镜像，并仅对镜像进行分析。长期以来，这被认为是唯一的方法。然而，过去几年产生了一些变化。在某些情况下现场取证是可行甚至是必要的：\n\
  \n- 当你发现正在运行的机器时，你应该在关机前对进程、内存等进行分析。\n- 在云和集群中可能是必要的。\n- 当机器已经制作了镜像，从而保护了证据时。\n\
  - 当不是进行真正的调查，而是为了回答某个问题时。\n- 关机要小心；如果硬盘经过加密，那么当你重启时将无法检索数据。\n\n你仍然需要记住镜像是首选方法。上述列表只是可以处理现场系统的建议时间。\n\
  \n\n\n\n\n监管链（Chain of custody）概念是取证科学的基石之一，无论是网络取证还是其他取证学科。监管链是指详细的记录，显示了证据从扣押那一刻起到在法庭呈示期间每一个时间点的状态。监管链的任何中断都可能导致该证据在审判中无法被采纳。\n\
  \n根据《数字取证科学工作组计算机取证模型标准操作程序》：“监管链必须包含对证据的描述以及每份证据转移的记录历史。”这意味着，每当证据从一个位置转移到另一个位置，或从一个人转移给另一个人时，这种转移都必须记录在。第一次转移是证据移交给调查人员时的扣押。在从那个时间点到任何审判之间，可能会发生多次转移。\n\
  \n请记住，记录越详尽越好。详细记录你做了什么、使用了什么工具、谁在场、谁进行了什么测试等。我发现，在取证分析过程中经常截图并将它们包含在报告中非常有帮助。\n\
  \n### FBI 取证指南\n\n除了我们刚刚讨论的通用指南外，FBI 还提供了一些具体的指南。在大多数情况下，它们将与我们讨论的内容重叠，但涵盖 FBI 的建议仍然是有用的。\n\
  \n如果发生事件，FBI 建议第一响应人员通过对任何 `logs`（日志）、损坏或被修改的文件，当然还有入侵者留下的任何文件进行备份，以保护事件发生时计算机的状态。最后一部分至关重要。黑客经常使用各种工具，并可能留下其活动踪迹。此外，FBI\
  \ 警告说，如果事件正在进行，请激活你可能有的任何 `auditing`（审计）或 `recording`（记录）软件。尽可能收集有关事件的数据。换句话说，在这种你可能不需要将机器下线，而是分析正在进行的攻击。\n\
  \n另一个重要步骤是记录由于攻击遭受的具体损失。损失通常包括以下内容：\n\n- 响应和恢复所花费的人力成本。（参与人员人数乘以其时薪。）\n- 如果设备损坏，设备的成本。\n\
  \ 如果 如果任何数据丢失或被盗，数据的价值。获取这些数据花费了多少，重建它们又需要多少费用？\n- 任何收入损失，包括停机造成的损失、因不便而给客户提供信用补偿，或任何其他收入损失的方式。\n\
  \n记录攻击造成的精确损害与记录攻击本身一样重要。\n\nFBI 计算机取证指南强调了保护证据的重要性。FBI 还强调，你不应将对 `computer evidence`（计算机证据）的概念局限于\
  \ PC 和笔记本电脑。`computer evidence` 可以包括：\n\n- `Logs`（系统、路由器、聊天室、IDS、防火墙）\n- 便携式存储设备（USB\
  \ 盘、外部硬盘）\n- `Emails`（电子邮件）\n- 能够存储数据的设备，如 iPod、iPad 和平板电脑\n- 手机\n\nFBI 指南还强调要对嫌疑硬盘/分区制作取证副本以便工作，并创建硬盘的哈希值。\n\
  \n### 美国特勤局取证指南\n\n美国特勤局（U.S. Secret Service）是另一个负责打击网络犯罪和计算机取证的联邦机构。它有一个专门从事计算机取证的网站，其中包含了取证课程。这些课程通常面向执法人员。\n\
  \n特勤局还发布了一份针对计算机犯罪第一响应人员的指南。它列出了“黄金法则”：\n\n- 保护现场。\n- 记录事件。\n- 确定法律要求。\n- 复制介质。\n\
  - 检查介质。\n- 归还证据。\n\n### 欧盟证据收集\n\n《欧洲委员会网络犯罪公约》（也称为《布达佩斯公约》）指的是可以电子形式收集的电子证据。《电子证据指南》是警察、检察官和法官的基础指南。\n\
  \n欧盟还建立了处理所有证据的五项原则：\n\n- **数据完整性 (Data Integrity)**：你必须确保数据是有效的且未被损坏。\n- **审计追踪\
  \ (Audit trail)**：与监管链类似，你必须对证据进行完全说明。这包括它的位置以及对其进行了什么处理。\n- **专家支持 (Specialist\
  \ support)**：根据需要利用专家。例如，如果你是一名熟练的检查员但对 Mac 经验有限，需要检查它时应寻找 Mac 专家。\n- **适当培训 (Appropriate\
  \ training)**：所有取证人员和分析师都应该经过充分培训，并不断扩展其知识库。\n- **合法性 (Legality)**：确保所有证据的收集方式符合所有适用法律。\n\
  \n 数字取证科学工作组\n\n数字取证科学工作组或 `SWGDE`（`www.swgde.org`）为数字取证创建了多项标准。根据 `SWGDE` 计算机取证模型标准操作程序，检查分为四个步骤：\n\
  \n1. **视觉检查 (Visual inspection)**：此类检查的目的是为了验证证据的类型、状态以及进行检查的相关信息。这通常在最初的证据扣押中完成。例如，如果正在扣押一台电脑，你会希望记录机器是否正在运行、状态如何以及整体环境是怎样的。\n\
  2. **取证复制 (Forensic duplication)**：这是在检查之前复制介质的过程。始终倾向于使用取证副本而非原始设备。\n3. **介质检查\
  \ (Media examination)**：这是对应用程序进行的实际取证测试。我们所说的`介质`是指硬盘、内存、SIM 卡——即任何可以包含数字数据的物品。\n\
  4. **证据归还 (Evidence return)**：将证物返回适当地点——通常是某些锁闭或安全的设施。\n\n\n\n\n\n埃德蒙·洛卡德（Dr. Edmond\
  \ Locard）是一位法医学科学家，他提出了所谓的洛卡德交换原理或洛卡德转换原理。这一原理最初用于物理法医学，它的核心观点是：你与任何环境进行互动都不可能留下任何东西。例如，某人闯入房屋而不留下什么是不可能的。这些东西可能是指纹、头发、脚印等。现在，谨慎的犯罪分子会掩盖其中的迹迹，例如通过使用手套来防止留下指纹。但总会有东西被留下。\n\
  \n这同样适用于计算机证据这也是我们倾向于使用副本进行工作的原因之一。以 Windows 为例，每当你登录、打开文件或进行任何操作时，你都更改了 `Registry`\
  \ 设置，可能留下了临时文件以及其他痕迹。对于法医鉴定来说，这实际上非常关键。但这意味着调查人员必须小心不要留下任何痕迹。\n\n## 科学方法\n\n法医学是一门科学。除了熟悉工具外，你还需要理解科学方法以及如何应用它。首先让我们看看科学是如何运作的。科学总是从假设开始。与大众的误解相反，假设并不是猜想。它是一个可以测试的问题。如果一个问题无法被测试，那么它在科学中完全没有立之地。一旦人们测试了一个假设，就有了一个事实。例如，如果我怀疑机密文件曾在你的计算机上，随后移动到\
  \ USB 设备并被删除（我的假设），我可以对你的计算机进行法医鉴定（我的测试）。如果鉴定发现计算机连接过 USB 驱动器，并且通过删除程序恢复了被删除的文件，现在我就有了一个事实。\n\
  \n下一步是基于多个事实建立犯罪理论。机密文件存在你的计算机上这一事实虽然是非常有趣的证据，但其本身并不够充分。是否可能其他人使用了你的计算机？是的，可能的。是否可能你不小心拥有机密信息（即你错误地带了不该带回的文件）然后立即删除了它们？是的，可能的。所以我们必须寻找额外的事实。例如，我们想知道在文件被删除时登录的是不是你的\
  \ `username`。一旦恢复了被删除的文件，我们想知道它们最后被访问和修改的时间是什么时候（这可能告诉我们你是否在使用这些文件）。我们可能还会检查你的电子邮件，看看是否有与对这些文档感兴趣的第三方的通信。\n\
  \n除了假设和理论外，科学的另一个原则是可证伪性。可证伪性意味着一个问题是可以被证伪的，或者得到错误的答案。换句话说，可能会得到否定答案。这排除了观点性问题或无法反驳的问题。\n\
  \n## 标准\n\n有许多与数字法医学相关的行业标准。对于每位法医鉴定员来说，至少大致熟悉这些标准至关重要：\n\n- `SWGDE`: 数字证据科学工作组\n\
  - `ASCLD`: 美国犯罪实验室主任主任协会\n- `RFC 3227`: 证据收集顺序\n- `ISO/IEC 27037:2012`: 数字证据法医取证和调查的良好实践方法和流程。\n\
  - `ISO/IEC 27041`: 数字法医学保证方面的指导。\n- `ISO/IEC 27042`: 涵盖了数字证据收集后的后续工作，即其分析和解释。\n\
  - `ISO/IEC 27043`: 涵盖了更广泛的事件调查活动，法医学通常发生在其中。\n- `ISO/IEC 27050`: 涉及电子取证\n\n## 报告\n\
  \n你的法医报告应该足够详细，以便任何胜任的法医鉴定员都能复制你的测试，并证实或反驳你的工作。\n\n这意味着（除其他外）会有大量的截图。你应该从截图开始，通过你选择的法医应用（`EnCase`、`FTK`、`OSForensics`、`Autopsy`、`X-Ways\
  \ Forensics` 等）对证据进行书签。此外，使用法医工具内置的日志/报告选项，将数据项突出并导出为 `.csv` 或 `.txt` 文件。这些可以是附录或证据。\n\
  \n在计算机法医学入门课程中，InfoSec Institute 要求学生创建一个报告，其中包含“你将要使用的方法的概概述，并对为什么所选特定方法具有相关性提供合理的论证”^(1)\n\
  \n^(1) [`resources.infosecinstitute.com/topic/computer-forensics-investigation-case-study/`](https://resources.infosecinstitute.com/topic/computer-forensics-investigation-case-study/)\n\
  \n法医报告的简要大纲如下：\n\n- 你的资历\n- 要具体\n- 你具体做了什么？\n- 显示所采取的步骤\n- 使用的工具\n- 检查的项目的详情\n-\
  \ 你为什么那样做？\n- 为什么用该工具/技术/流程\n- 使用脚注\n- 结论\n\n## 工具\n\n我们之前讨论过使用 `Linux` 命令或 `FTK`\
  \ 磁盘映像对驱动器进行镜像。有多种工具可用于法医分析和鉴定。在本节中，我将为你回顾其中几个。当然还有其他工具，但这里列出的被广泛使用。\n\n### FTK\n\
  \n我们之前提到过 `FTK`，这里也给了简要描述。`AccessData` 公司是 Forensic Toolkit 的创建者，通常简单地称为 `FTK`。这个强大的计算机法医学工具允许你恢复删除的文件、检查\
  \ `Registry` 设置并执行各种法医任务。`AccessData` 增加了诸如已知文件过滤以查找特定文件。`FTK` 还可以检测儿童色情。`AccessData`\
  \ 也制作其他工具。你可以访问 `http://accessdata.com` 了解更多。\n\n### EnCase\n\n这个工具由 `Guidance Software`\
  \ 制造，在执法部门非常流行，是 `FTK` 的直接竞争对手。它允许镜像驱动器、恢复删除的文件、检查 `Registry` 并执行其他常见任务。对某些组织来说它的成本很高。你可以访问\
  \ `https://www2.guidancesoft.com/products/encase-forensic/overview.aspx` 了解更多。\n\
  \n### OSForensics\n\n`OSForensics` 是一个成本低且易使用的工具。它功能强大，允许你恢复删除的文件、检查 `Registry`\
  \ 并搜索驱动器。他们还在不断为工具添加新功能。你可以在 `www.osforensics.com` 获取更多信息并下载完整的试用版。\n\n### Magnet\
  \ Forensics\n\n该工具的主要特点是在一个工具中处理 PC 和手机法医学。你可以访问他们的网站 `https://www.magnetforensics.com/`，并申请免费试用。\n\
  \n### Sleuth Kit\n\n这实际上是一个开源工具套件。整套工具功能齐全但相当难以使用。每个工具可能要求你学习一组命令行（或 shell）命令。你可以在\
  \ `www.sleuthkit.org` 获取更多。\n\n### Oxygen\n\n这个工具专门用于手机法医学。它在分析 iPhone 方面非常好，在分析现代\
  \ Android 方面做得还可以。它（至少目前）对于较旧的 Android 或 Windows 手机并不那么有效。你可以访问 `www.oxygen-forensic.com`\
  \ 了解更多。\n\n\n\n\n\n## Cellebrite\n\n这也许是最受欢迎的手机取证工具之一，至少在执法部门是如此。它对许多不同的手机都非常有效。唯一的缺点是它是可用的最昂贵的手机取证工具之一。你可以在\
  \ [www.cellebrite.com](http://www.cellebrite.com) 了解更多信息。\n\n## 在 PC 上寻找证据\n\n一旦你获取了证据并制作了取证副本，就是时候开始寻找证据了。这些证据以多种形式存在。前节中提到的工具可以为你提取这些证据。然而，在本节中，我将向你展示这些工具搜索的是什么。重要的是，不要简单地重复某些自动化工具告诉你的内容，而是要理解该工具在做什么。\n\
  \n### 在浏览器中寻找证据\n\n浏览器既可以是直接证据的来源，也可以是间接或辅助证据的来源。显然，在儿童色情案件中，浏览器可能包含特定犯罪的直接证据。在网络跟踪案件中，你也可能发现直接证据。然而，如果你怀疑某人创建了感染网络的病毒，你可能只能找到间接证据，例如该人搜索过病毒创建/编程相关的话题。\n\
  \n即使这个人删除了历史记录，仍然可能将其检索。Windows 将大量信息（如网页地址、搜索查询和最近打开的文件）存储在一个名为 `index.dat` 的文件中。大多数取证工具都可以从计算机中提取广泛的证据。`OSForensics`\
  \ 为此提供了多个选项。其中包含 `Recent Activity`，如图 14.7 所示。\n\n![Description: 截图显示了在 OSForensics\
  \ 工具“最近活动”标签页下的账户下进行的各种活动列表。](img/14fig07.jpg)\n\n**图 14.7** *OSForensics 最近活动选项。*\n\
  \n从此屏幕，你可以找到所有的浏览器活动、已安装程序、连接过的 USB 设备以及更多内容。\n\n### 在系统日志中寻找证据\n\n无论你使用哪种操作系统，操作系统都有日志。这些日志在任何取证调查中都至关重要，你应该检索它们。\n\
  \n### Windows 日志\n\n让我们从 Windows 7/8/10 开始。在这些 Windows 版本中，你通过点击桌面左下角的“开始”按钮然后点击“控制面板”来找到日志。然后点击`管理工具`和`事件查看器`。以下是你需要检查的日志（尽管并非所有日志都出现在每个\
  \ Windows 版本中）：\n\n#### 注意\n在使用所有这些工具时，你必须开启日志；否则这些日志中将空无所有。\n\n- `安全日志`：从取证的角度来看，这可能是最重要的日志。它包含了成功和失败的登录事件。\n\
  - `应用程序日志`：此日志包含由应用程序或程序记录的各种事件。许多应用程序会在应用程序日志中记录它们的错误。\n- `系统日志`：`系统日志`包含 Windows\
  \ 系统组件记录的事件。这包括驱动程序失败等事件。从取证角度来看，此日志没有其他日志那么有趣。\n- `杂项事件日志`：`杂项事件日志`用于存储从远程计算机收集的事件。只有在配置了事件转发的情况下，其中才会有数据。\n\
  - `应用程序和服务程序日志`：此日志用于存储事件。\n\n### Linux 日志\n\n显然，Linux 也有日志。\n\n- `/var/log/faill`：记录失败的登录。\n\
  - `/var/log/kern`：包含内核消息。\n- `/var/log/lpr`：跟踪打印机活动。\n- `/var/log/mail`：记录电子邮件。\n\
  - `/var/log/mysql`：跟踪数据库事件。\n- `/var/log/apache2`：跟踪 Web 服务器活动。\n- `/var/log/lighttpd`：跟踪\
  \ lighttpd 活动。\n- `/var/log/apport`：记录应用程序崩溃。\n- `/var/log/user`：包含用户活动。\n\n## 取回被删除的文件\n\
  \n犯罪分子经常尝试销毁证据这是一个事实。然而，多种工具可以恢复此类文件，特别是在 Windows 中。大多数取证工具如 `Access Data FTK`、`OSForensics`、`Encase`\
  \ 等都可以恢复被删除的文件。还有免费或低成本的实用程序。`DDigger` 是一个可以使用的免费工具。虽然有更强大的工具，但它免费且易于使用的事实使其非常适合学习取证的学生。让我们过一下它的基本操作。需要注意的是，所有上述的取证工具都会为你恢复被删除的文件。还必须指出，互联网上有许多文件恢复工具。`DDigger`\
  \ 仅作为一个示例展示。\n\n在第一个屏幕（如图 14.8 所示）上，你选择想要从中恢复文件的驱动器/分区。\n\n![Description: 截图显示了\
  \ DDigger 工具“选择要扫描的磁盘”标签页下可扫描的磁盘列表。](img/14fig08.jpg)\n\n**图 14.8** *添加新扫描。*\n\n\
  在下一个屏幕上，你选择想要进行的扫描级别。这如图 14.9 所示。显然，扫描越深，花费的时间越。\n\n![Description: 截图显示了两个用于选择扫描深度的单选按钮。两个单选按钮是\
  \ Dig deep（挖掘）和 Dig deeper（深入挖掘）。](img/14fig09.jpg)\n\n**图 14.9** *选择扫描深度。*\n\n\
  然后你将得到一个恢复的文件列表。你可以在图 14.10 中看到它。\n\n![Description: 辉瑞 Logo。](img/14fig10.jpg)\n\
  \n**图 14.10** *恢复的文件。*\n\n\n\n\n你可以看到文件以及文件头信息。如果你需要，也可以选择恢复该文件。显然，DiskDigger 可能只会恢复一个文件的碎片，但对于取证来说，这已经足够了。\n\
  \n### 注意事项\n\n除了删除的文件外，检查空空间（slack space）也同样重要。当文件被保存时，无论是否需要，系统都会分配整个簇。考虑这个例子：你有一台簇大小为\
  \ 10 个扇区的计算机。你保存了一个仅只占用了 3 个扇区的文件。对于操作系统和文件系统而言，所有 10 个扇区都在使用中。这留下了 7 个未记录的扇区。这部分空间就是空空间。在空空间中隐藏数据是可能的。\n\
  \nOSForensics 还允许你搜索和恢复已删除的文件，如图 14.11 所示。\n\n![Description: 截图显示了 OSForensics 工具中“删除文件搜索”选项卡下某个账户中被删除的各种活动列表。](img/14fig11.jpg)\n\
  \n**图 14.11** OSForensics 删除文件搜索选项。\n\n### 操作系统实用程序\n\n操作系统内置了许多实用程序，它们对于收集某些取证数据非常有用。鉴于\
  \ Windows 是最常用的操作系统，我们将重点关注从 Windows 命令行运行的实用程序。然而，进行取证工作的一个关键问题之一是要非常熟悉目标操作系统。你还应该注意，这些许多命令在运行中的实时系统上最为有用，可以捕获正在进行的攻击。\n\
  \n#### `net sessions`\n\n`net sessions` 命令列出连接到运行该命令的计算机的所有活动会话。如果你认为攻击正在进行并持续，这可能非常重要。如果没有活动会话，该实用程序将报告这一点，如图\
  \ 14.12 所示。\n\n![Description: 命令行提示符的截图显示，输入命令“Net sessions”后的结果为“列表中没有项目”。](img/14fig12.jpg)\n\
  \n**图 14.12** `net sessions`。\n\n#### `openfiles`\n\n`openfiles` 是另一个用于寻找正在进行的活跃攻击的命令。该命令将列出任何当前打开的共享文件。你可以在图\
  \ 14.13 中看到此实用程序。\n\n![Description: 命令行提示符的截图显示，输入命令“openfiles”后的结果为“未找到共享打开的文件”。](img/14fig13.jpg)\n\
  \n**图 14.13** `openfiles`。\n\n#### `fc`\n\n`fc` 是一个你可以配合机器的取证副本使用的命令。它会比较两个文件并显示差异。如果你认为某个配置文件被修改了，可以将其与已知的良好备份进行比较。你可以在图\
  \ 14.14 中看到此实用程序。\n\n![Description: 命令行提示符的截图显示，输入用于测试两个文件的命令结果为“This is a test”。输入的命令是“fc\
  \ testfile1.txt testfile.txt”。](img/14fig14.jpg)\n\n**图 14.14** `fc`。\n\n#### `netstat`\n\
  \n`netstat` 命令也用于检测正在进行的攻击。它列出了所有当前的网络连接——不仅是入站的，还包括出站的。你可以在图 14.15 中看到此实用程序。\n\n\
  ![Description: 命令行提示符的截图显示了各种活动连接。它列出了协议详细信息以及对应的本地地址、远程地址和状态。](img/14fig15.jpg)\n\
  \n**图 14.15** `netstat`。\n\n### Windows 注册表\n\nWindows 注册表是一个存储潜在价值取证信息的巨大仓库。它是\
  \ Windows 机器的核心。在这里你可以找到许多有趣的数据。要让你成为 Windows 注册表专家已超出了本章的范围，但希望你能够继续学习更多。微软对注册表的描述如下：\n\
  \n一种在 Microsoft Windows 操作系统系列中中央分级数据库，用于存储为一个或多个用户、应用程序和硬件设备配置系统所需的信息。\n\n注册表包含了\
  \ Windows 在运行期间持续引用的信息，例如每个用户的配置、、安装在计算机上的应用程序以及每个程序可以创建的文档类型、文件夹和应用程序图标的属性表设置、系统存在的硬件以及正在使用的端口。\n\
  \n注册表被组织成五个部分，称为“单元”（hives）。每个部分都包含对你有用的特定信息。这里描述了这五个单元：\n\n- `HKEY_CLASSES_ROOT\
  \ (HKCR)`：此单元存储了关于拖放规则、程序快捷方式、用户界面和相关项的信息。\n- `HKEY_CURRENT_USER (HKCU)`：此单元对任何取证调查都非常重要。它存储有关当前登录用户的信息，包括桌面设置和用户文件夹。\n\
  - `HKEY_LOCAL_MACHINE (HKLM)`：此单元对取证调查也可能重要。它包含了整个机器通用的设置，无论个人用户如何。\n- `HKEY_USERS\
  \ (HKU)`：此单元对取证调查至关重要。它拥有所有用户的配置，包括他们的设置。\n- `HKEY_CURRENT_CONFIG (HCU)`：此单元包含当前的系统配置。这可能对你的取证很有帮助。\n\
  \n你可以在图 14.16 中看到注册表和这五个单元。\n\n![Description: Windows 注册表的截图。它列出了文件、编辑、查看、收藏和帮助等选项卡。选择了文件选项卡下的计算机图标，它列出了五个单元。](img/14fig16.jpg)\n\
  \n**图 14.16** Windows 注册表。\n\n大多数人使用 `regedit` 工具与注册表进行交互。在 Windows 7 中，你选择开始、运行，然后输入\
  \ `regedit`。在 Windows 8 和 10 中，你必须进入应用程序列表，选择所有应用程序，然后找到 Regedit 或使用 Windows+R 键输入\
  \ `regedit`。大多数取证工具也提供了检查注册表的方法。\n\n每个注册表项都有一个名为 `LastWriteTime` 的关联值。该值指示注册表值最后更改的时间。它不是标准的日期/时间，而是以\
  \ `FILETIME` 结构存储的。`FILETIME` 结构表示自 1601 年 1 月 1 日以来的 100 纳秒间隔。显然，这在取证上是重要的。\n\n\
  另一个值得注意的是，微软很少使用强加密来隐藏注册表中的项。如果某个项被加密了，它可能是使用某种简单算法（如 ROT 13）加密的。\n\n你可以从命令行导出特定的键：\n\
  \n```\nreg export HKEY_LOCAL_MACHINE\\System\\ControlSet\\Enum\\UBSTOR\n```\n\n\
  或者在 `regedit` 中，你可以右键点击一个键并选择导出。\n\n### 特定项\n\n现在你已经有了关于注册表的基础知识，查看你可能会某些特定的注册表信息是非常重要的。\n\
  \n#### USB 信息\n\n\n\n\n\n大多数取证分析师对 Windows 注册表首先学习的内容之一是他们可以发现哪些 USB 设备连接过嫌疑机。注册表项\
  \ `HKEY_LOCAL_MACHINE\\System\\ControlSet\\Enum\\USBSTOR` 列出了连接到该机器的 USB 设备。犯罪分子通常会将证据移动到外部设备并随身带走。这可能提示你存在需要查找和检查的设备。此注册表设置将告诉你有关连接到此系统的外部驱动器。你可以在图\
  \ 14.17 中看到。\n\n![Description: 显示了 Windows 注册表的截图。它列出了文件、编辑、查看、收藏和帮助等各种标签卡。选中了文件标签卡下的\
  \ USBSTOR 文件夹，它列出了连接到此系统的各种外部驱动器。](img/14fig17.jpg)\n\n**图 14.17** *Windows 注册表—USBSTOR。*\n\
  \n然而，这并没有提供完整的视图。某些相关的键非常有用。例如，`SYSTEM\\MountedDevices`允许调查人员将序列号与插入 USB 设备时挂载的特定驱动器器或卷进行匹配。顺便提到，此特定的注册表键不仅限于\
  \ USB 设备。\n\n使用 USB 设备的用户可以在这里找到：\n\n```\n\\Software\\Microsoft\\Windows\\CurrentVersion\\\
  Explorer\\MountPoints2\n```\n\n厂商和产品 ID 可以在这里找到：\n\n```\nSYSTEM\\CurrentControlSet\\\
  Enum\\USB\n```\n\n应该检查所有相关的 USB 注册表键，以获得有关特定 USB 设备情况的完整且准确的视图。\n\n### 自动启动位置\n\n\
  此键经常被恶意软件用于在目标系统上保持持久化。它显示了配置为 Windows 启动时自动启动的程序。以下是一个示例：\n\n```\nHKEY_CURRENT_USER\\\
  Software\\Microsoft\\Windows\\CurrentVersion\\Run\n```\n\n显然，你应该预期在该注册表键中看到合法的程序。然而，如果有任何你无法解释的内容，它可能指示存在恶意软件。\n\
  \n### 最后访问\n\n```\nHKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\\
  ComDlg32\\LastVisitedMRU\n```\n\n此键将显示最近访问的站点。数据是十六进制格式的，但当你使用 `regedit` 时可以看到文本翻译，你可能通过查看\
  \ `regedit` 就能识别出访问过的站点。\n\n### 最近文档\n\n最近文档可以在以下键中找到：\n\n```\nHKCU\\Software\\\
  Microsoft\\Windows\\CurrentVersion\\Explorer\\RecentDocs\n```\n\n这在取证上可能非常重要，特别是在涉及财务数据或知识产权的案件中。此键允许你确定在该计算机上访问了哪些文档。\n\
  \n如你所示，此键首先分为文档类型。然后，一旦选择了该类型，就可以看到访问过的该类型的最近文档。\n\n### 用户协助 (User Assist)\n\nUser\
  \ Assist 可以在 `HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\\
  Explorer\\UserAssist`找到。\n\nUser Assist 用于向用户的启动菜单填充常用应用程序的方法。这是通过在每个用户的 `NTUSER.DAT`\
  \ 注册表文件中维护应用程序的使用计数来实现的。因此有了此注册项。\n\n### 预取 (Prefetch)\n\nPrefetch 可以在 `HKEY_LOCAL_MACHINE\\\
  System\\ControlSet\\Services\\Prefetch`找到。\n\n预取文件包含可执行文件的名称、使用的 DLL 列表、执行次数以及指示最后执行时间的时间戳。\n\
  \n### 已卸载的软件\n\n```\nHKLM\\SOFTWARE\\CurrentVersion\\Uninstall\n```\n\n这是任何检查工作中一个非常重要的键。\n\
  \n### Shellbags (外壳包)\n\n此项可以在 `HKCU\\Software\\Microsoft\\Shell\\Bags`找到。ShellBag\
  \ 项表示访问过特定的文件夹。\n\n### Windows 时间戳\n\n从设备中收集数据时，你会发现时间戳。理解这些时间戳的含义至关重要：\n\n- **文件创建\
  \ (File Created)**：此时间戳通常显示文件或文件夹创建的时间。当使用命令行或拖放功能将文件移动到不同的卷时，新副本的“文件创建”时间戳被设置为当前时间。当使用剪切和粘贴菜单选项将文件移动到不同的卷时，“文件创建”时间戳不会发生变化。\n\
  - **修改 (Modified)**：对文件进行最后一次更改的时间。\n- **最后访问 (Last Accessed)**：此时间戳代表文件系统最近访问文件或文件夹的时间。文件不需要打开即可被访问。\n\
  \n### 移动取证：手机概念\n\n在我们深入研究手机手机之前，你将需要了解一些基础设备和术语。其中一些内容（如 SIM）你可能至少已经有些熟悉了。\n\n\
  #### 手机概念模块\n\n以下部分是手机组成。\n\n##### 手机状态\n\n在检查手机时，你应该记录发现它时的状态。美国国家标准协会识别了四种状态：\n\
  \n- **初始状态/出厂默认状态 (Nascent State/Factory Default State)**：设备从制造商处接收时的初始状态——设备不包含用户数据并遵循出厂设置。\n\
  - **激活状态 (Active State)**：处于激活状态的设备已电源、正在执行任务，并允许用户自定义且系统填充了数据。\n- **半激活状态 (Semi-Active\
  \ State)**：半激活状态是激活和静止之间的状态。该状态由计时器达到，计时器在一段时间未活动后触发，通过调暗显示和其他采取其他适当措施来保护电池寿命。\n\
  - **静止状态 (Quiescent State)**：静止状态是一种睡眠模式，在保持用户数据和执行其他后台功能的同时节省电池寿命。设备上下文信息保存在内存中，以便返回激活状态时能够快速恢复处理。\n\
  \n##### 用户身份识别模块 (Subscriber Identity Module)\n\n\n\n\n\n用户识别模块，或称为 `SIM`，是手机的核心。它是一个电路，通常是一个可拆卸的芯片。`SIM`\
  \ 是你识别手机的方式。它存储了国际移动用户识别码（`IMSI`）。我们将在稍后详细讨论 `IMSI`，它能唯一地标识手机。因此，如果你更换了 `SIM`，你实际上就更改了\
  \ `IMSI`，从而改变了手机的身份。此 `SIM` 通常还包含网络信息、用户可以访问的服务以及两个密码。这两个密码是个人识别码（`PIN`）和个人解锁码（`PUK`）。`PUK`\
  \ 是用于重置遗忘的 `PIN` 的代码。然而，使用该代码将擦除手机并将其恢复到出厂状态，从而破坏任何取证证据。如果连续输入错误代码 10 次，设备将被永久锁定且无法恢复。\n\
  \n## 国际移动用户识别码\n\n国际移动用户识别码（`IMSI`）通常是一个 15 位数字，但在某些情况下可能会更短。（某些国家使用较短的数字）。它用于唯一地标识手机。前\
  \ 3 位是移动国家代码（`MCC`），接后的数字代表移动网络代码。在北美，这是 3 位；在欧洲，这是 2 位。剩余数字是移动订阅标识码（`MSIN`），用于在特定网络内标识手机。为了防止跟踪和克隆，`IMSI`\
  \ 很少发送。相反，系统会生成并发送临时值或 `TMSI`。\n\n## 集成电路卡识别码\n\n虽然国际移动用户识别码（`IMSI`）用于识别手机，但 `SIM`\
  \ 芯片本身通过 `ICCID` 进行识别。`ICCID` 在制造过程中刻在 `SIM` 上，因此无法被移除。前七位数字识别国家和发行者，称为发行者识别码（`IIN`）。之后是一个变长度的数字，用于识别该芯片/SIM，然后是一个校验位。\n\
  \n## 国际移动设备识别码\n\n国际移动设备识别码（`IMEI`）数字是用于识别 `GSM`、`UMTS`、`LTE` 和卫星电话的唯一标识符。它打印在手机上，通常位于电池仓内。你可以通过在拨盘上输入\
  \ `#06#` 在大多数手机上显示它。通过这个数字，手机可以被列入黑名单或防止连接网络。即使用户更换了 `SIM` 卡，这仍然有效。\n\n## 蜂窝网络\n\
  \n除了理解手机本身，理解网络也是必要的。所有的手机网络都基于无线基塔。无线信号的强度经过刻意调节以限制其范围。每个手机塔基站由一个天线和无线设备组成。以下是对不同网络类型的简要描述。\n\
  \n### 全球移动通信系统\n\n全球移动通信（`GSM`）是一种较旧的技术，通常被称为 2G。这是由欧洲电信标准协会（`ETSI`）开发的标准。最初，`GSM`\
  \ 仅为数字语音开发，但后来扩展到包含数据。`GSM` 工作在许多不同的频率上，但常用的是 `900MHz` 和 `1800MHz`。在欧洲，大多数 3G 网络使用\
  \ `2100MHz` 频率。\n\n### GSM 增强数据速率\n\n许多人将 GSM 增强数据速率（`EDGE`）视为 2G 和 3G 之间的一个水平。从技术上讲，它被认为是前\
  \ 3G，但它是 `GSM` (2G) 的改进。它专门设计用于在蜂窝网络上传输电视等媒体内容。\n\n### 通用移动通信系统\n\n通用移动通信系统（`UMTS`）是\
  \ 3G，本质上是 `GSM` (2G) 的升级。它提供文本、语音、视频和多媒体，数据速率高达每秒 2 兆甚至更高。\n\n### 长期演进\n\n长期演进（`LTE`）通常被称为\
  \ 4G，提供宽带互联网、多媒体和语音。`LTE` 基于 `GSM/EDGE` 技术。理论上，它可以支持 `300Mbps` 的速度。与 `GSM` 和基于 `GSM`\
  \ 的网络不同，`LTE` 是 IP 的，就像典型的计算机网络一样。\n\n### 集成数字增强网络\n\n集成数字增强网络（`iDEN`）是一种基于 `GSM`\
  \ 的架构，将手机、双向无线电、传真机和调制调器合并到一个网络中。它运行在 `800MHz`、`900MHz` 或 `1.5GHz` 频率上，由摩托罗拉设计。\n\
  \n理解手机工作的网络对于理解手机取证至关重要。今天你可能会遇到 `LTE`，尽管 3G 网络/手机仍然存在。\n\n记住，现代手机或平板电脑实际上是一台计算机。几年前，情况并非如此。然而，现代移动设备在各个方面都是功能齐全的计算机。这意味着它们拥有硬件、操作系统和应用程序（通常称为\
  \ `apps`）。为了成功进行取证分析，至少对移动设备上使用的操作系统有基本的了解是有关重要的。\n\n### iOS\n\n苹果的 `iPhone`、`iPod`\
  \ 和 `iPad` 非常常见，且它们都运行在同一个操作系统 `iOS` 上。`iOS` 操作系统最初于 2007 年发布给 `iPhone` 和 `iPod`，后来后扩展到包含\
  \ `iPad`。它基于触摸界面，用户将在屏幕上执行如滑动、拖拽、缩放和点击等手势。`iOS` 基于 Macintosh 的 `OS X`，但经过了大幅修改。\n\
  \n`iOS` 分为四层。第一层是 `Core OS` 层，它是操作系统的核心。第二层是 `Core Services` 层，用户和应用程序与之交互。第三层是\
  \ `Media` 层，负责音乐、视频等。最后是 `Cocoa Touch` 层，响应用户操作。\n\n`iOS` 使用 `HFS+` 文件系统。`HFS+`\
  \ 是苹果为了取代 `HFS` 而创建的，并用于 `iOS` 与 Windows 机器同步。`iOS` 将数据分区划分如下：\n\n- 日历\n- 联系人\n\
  - 备注\n- `iPod_control` 目录（隐藏）\n- iTunes 配置\n- iTunes 音乐\n\n显然，日历和联系人在任何取证调查中都具有价值。然而，`iPod_control`\
  \ 目录中的某些数据也非常重要。令取证特别感兴趣的是 `iPod_control\\device\\sysinfo` 文件夹。该文件夹包含两个非常重要的信息：\n\
  \n### Android\n\n`Android` 是 `iOS` 最大的单一替代品。它基于 `Linux`；事实上，它是经过修改的 Linux 发行版，并且是开源的。这意味着如果你有相关的编程和操作系统知识，你就可以自己下载并阅读\
  \ `Android` 源码（参见 `http://source.android.com`）。需要注意的是，私有 `Android` 手机会对开源 `Android`\
  \ 源码进行自己的修改或添加。\n\n`Android` 首次于 2003 年发布，是 Rich Miner、Andy Rubin 和 Nick Sears 的作品；然而，谷歌在\
  \ 2005 年收购了 `Android`。`Android` 的版本以甜点命名：\n\n- 版本 1.5：`Cupcake`，于 2009 年 4 月发布\n\
  - 版本 1.6：`Donut`，于 2009 年 9 月发布\n- 版本 2.0–2.1：`Eclair`，于 2009 年 10 月发布\n- 版本 2.2：`Froyo`，于\
  \ 2010 年 5 月发布\n- 版本 2.3：`Gingerbread`，于 2010 年 12 月发布\n- 版本 3.1–3.2：`Honeycomb`，于\
  \ 2011 年 2 月发布\n- 版本 4.0：`Ice Cream Sandwich`，于 2011 年 10 月发布\n- 版本 4.1–4.2：`Jelly\
  \ Bean`，于 2012 年 6 月发布\n- 版本 4.4：`KitKat`，于 2013 年 9 月发布\n\n\n\n\n\n- 版本 5.0: Lollipop，于\
  \ 2014 年 11 月发布\n- 版本 6.0: Marshmallow，于 2015 年 10 月发布\n- 版本 7.0: Nougat，于 2016\
  \ 年 8 月发布\n- 版本 8.0: Oreo，于 2017 年 8 月发布\n- 版本 9.0: Pie，于 2018 年 8 月发布\n- Android\
  \ Q – 2019 Beta 版，现仅被称为版本 10 并被广泛使用\n- Android 11 Beta 版发布已从 2020 年 6 月 3 日推迟到 2020\
  \ 年 6 月 10 日\n- Android 11 于 2021 年 9 月 8 日发布，Red Velvet Cake\n- Android 12 于 2021\
  \ 年 10 月 4 日发布，Snow Cone v1\n- Android 12L 于 2022 年 3 月 7 日发布，Snow Cone v2\n- Android\
  \ 13 预计于 2022 年第三季度发布，Tiramisu\n\n不同版本之间的差异通常涉及新功能，而不是对操作系统的根本性改变。它们都是基于 Linux 的，而且即使从\
  \ Cupcake 到 KitKat，其核心功能也极其相似。这意味着，如果你熟悉任何版本的 Android，你理应该能够对所有版本的 Android 进行取证分析。\n\
  \n## 你应该寻找的内容\n\n哪些通用原则可以帮助你确定在手机或其他移动设备中应该寻找哪些内容？你应该尝试从移动设备中恢复的物品包括：\n\n- 手机本身的详细信息\n\
  - 通话记录\n- 照片和视频\n- GPS 信息\n- 网络信息\n\n关于手机的信息应该是你在调查中首要记录的内容之一。正如你记录所正在检查的 PC 详细信息（型号、操作系统等）一样，你也应该记录手机或平板电脑的特定信息。这包括型号数字、SIM\
  \ 卡的序列号、操作系统等。你记录的描述性信息越详尽越好。\n\n通话记录将让你知道用户和谁通过过电话，以及通话了多久。显然，单凭通话记录本身不足以证明大多数犯罪。除了骚扰或违反限制令之外，仅显示一个人拨打了另一个人的电话并不足以证明犯罪。然而，它可以开始构建间接证据链。\n\
  \n照片和视频可以提供犯罪的直接证据。在儿童色情案件中，相关性是显而易见的。但可能让你惊讶的是，某些犯罪分子实际上拍摄或录像自己实施严重犯罪的情况并不罕见。对于进行无计划犯罪或在药物或酒精影响下犯罪的年轻犯罪分子尤其如此。有许多案件显示犯罪者拍摄或录像了自己从破坏、盗窃到强奸的犯罪行为。\n\
  \nGPS 信息在各种案件中变得越来越重要。有这么多个人拥有开启了 GPS 的设备，取证分析师如果不检索这些信息似乎是失职。GPS 无法确认嫌疑人犯了罪，但它可以显示嫌疑人曾出现在犯罪发生的地点。当然，GPS\
  \ 也可以帮助证明清白。如果一个人被怀疑犯了罪，但他的车辆和手机 GPS 显示在案发时远在几英里之外，这可以帮助建立不在场证明。\n\n网络信息同样重要。手机识别了哪些\
  \ Wi-Fi 网络？这可能指示手机去过哪里。如果手机手机连接过位于犯罪发现场附近的咖啡馆，至少说明作案者曾出现在该地区。此外，传统的计算机犯罪，如拒绝服务 (`DoS`)\
  \ 和 SQL 注入，也可能追溯到公共 Wi-Fi 点，而作案者足够聪明掩盖其计算机的身份。如果你能证明他的手机 GPS 连接过该 Wi-Fi，将有助于证明他有作案机会。\n\
  \n## 取证认证的必要性\n\n为什么需要认证？这个问题在信息技术领域已经讨论了多年。不同的专家倾向于其中的一个极端。有些人声称认证无价，而另一些人则认为它们一文不值。此外，IT\
  \ 内部的某些子行业对认证持有不同态度。在 Cisco 的世界里，认证就是王。在 Linux 社区中，认证的价值微乎其微。那么，取证领域认证的价值何？\n\n\
  首先，你必须审认证的目的。获得认证意味着什么？通常，那些对认证持有否定态度的人是因为他们遇到过持有证书但能力并不高长的人。这表现了对任何认证本质的误解。认证应该表示该证书持有者达到了最低标准。它并不意味着此人是该主题的大师，而是说她是胜任的。同样，医学学位不能保证某人是一个伟大的医生，仅证明她在医学方面获得了最低胜任能力。\n\
  \n然而，确实可能通过了认证但对该主题并不精通。但对于任何领域和任何教育尝试都是如此。确实有一些不胜任的医生（谢天谢地很少），但如果你突然感到胸痛，我打赌你更倾向于让别人叫你为医生，而不是水工。医生具备所需技能的概率远比水工高得多。IT\
  \ 认证也是如此。虽然确实可能有人通过了认证但并不胜任，但经过认证的人胜任的概率要高得多。这就是为什么雇主经常要求或偏好认证的原因。这让筛选申请人的工作变得简单得多。\n\
  \n任何 IT 认证都可以作为职位申请人技能的一个有价值的指标。它不是唯一的指标，也绝不应该是唯一考虑的因素，但它是其中之一。这让我们提到了取证认证。有必要另一个认证吗？首先看看目前有哪些取证认证。所有的取证认证分为两类。第一类是厂商认证。这些通常只针对厂商销售的产品。第二类是概念性认证。这些测试不是针对特定工具，而是针对取证概念。\n\
  \n`Forensic Toolkit` 的创建者 AccessData 拥有多种认证。`EnCase` 的创建者 Guidance Software 也是如此。这两个厂商认证都是非常好的。但是，它们都是厂商认证。重点在于特定的专用工具包，而不是通用的取证知识。如果你将使用任何一种工具，获得相应的厂商认证是一个非常好的主意，但这不等同于广泛的取证课程/测试。\n\
  \nEC-Council 有其黑客取证调查员 (`CHFI`) 测试，并且相当。然而，正如名称所示，它的重点是黑客和反入侵。EC-Council 的重点一直是黑客。\n\
  \nSANS 提供了多种认证，包括认证取证分析师 (`GCFA`) 和认证取证审查员 (`GCFE`)。这些在行业内都备受尊重。其中一个唯一的问题是成本。SANS\
  \ 课程及其认证测试是行业内最昂贵的。\n\n### 专家证人\n\n在某个时刻，任何取证人员都可能被传到法庭作证。作为专家证人与事实证人非常不同。首先，专家证人被允许作言他们没有看到或听到的事情。其次，专家证人被允许进行推断并形成理论。\n\
  \n\n\n\n然而，专家证言有明确的限制和要求。你不能简单地站在证人席上就说：“好吧，我是专家，这件事事实是真的，因为我是这么说的。”这遵循某些规则。接下来的章节将对这些规则进行简要概述。\n\
  \n### 联邦规则 702\n\n联邦规则 `702` 定义了什么是专家证人，以及关于其何时可以作证言以及可以证言内容的规则。本质上，`Rule 702` 规定如下：\n\
  \n通过知识、技能、经验、培训或教育被认定为专家的证人，在以下情况下可以以意见或其他形式作证言：\n\n1. 专家的科学、技术或其他专业知识有助于事实认定者理解证据或确定争议事实；\n\
  2. 证言基于充分的事实或数据；\n3. 证言是可靠原则和方法的产物；且\n4. 专家已可靠地将这些原则和方法应用于案件事实。\n\n这意味着，首先最重要的是，专家必须是该特定主题或领域的专家。该人的证言必须对法官或陪审团理解案件中的技术或专业事实有所帮助。但同样重要的是，专家必须将其意见建立在可靠的科学方法之上。\n\
  \n### Daubert\n\n`Daubert` 标准用于美国联邦法院，以判断专家的科学证言是否基于科学上有效且能够正确应用于争议事实的推理或方法。根据这一标准，判断方法是否有效时可以考虑的因素包括：(1)\
  \ 相关的理论或技术是否可以并已经过测试；(2) 它是否经过了同行评审和发表；(3) 其已知或潜在的错误率；(4) 控制其运行的标准是否存在并维护；以及(5)\
  \ 它是否在相关科学领域内获得了广泛认可。`Daubert` 标准是目前联邦法院和某些州法院使用的测试。这与 `联邦规则 702` 非常相似。\n\n## 取证的其他类型\n\
  \n数字取证是一个不断增长的领域。计算机取证和手机取证是最常见的数字取证类型，但并不是数字取证的唯一领域。在本节中，你将看到数字取证其他子学科的简要概述。\n\n\
  ### 网络取证\n\n学习网络取证第一个也是最基本的内容是数据包分析。在我们继续之前，你可能希望回顾 `第 2 章` 中的内容，“网络与互联网”，以确保你熟悉基础网络知识。\n\
  \n本质上，网络取证涉及捕获穿越网络的数据包，并对其进行检查以寻找证据。从网络取证中 Determine 很多事情：数据包来自哪里、它使用什么协议、使用哪个端口，以及是否经过加密。\n\
  \n以下是一些常用的网络分析工具：\n\n* `Wireshark`: [www.wireshark.org](http://www.wireshark.org)\n\
  * `CommView`: [www.tamos.com/products/commview/](http://www.tamos.com/products/commview/)\n\
  * `SoftPerfect Network Protocol Analyzer`: [www.softperfect.com](http://www.softperfect.com)\n\
  * `EffeTech HTTP Sniffer`: [www.effetech.com/sniffer/](http://www.effetech.com/sniffer/)\n\
  * `ngrep`: [`sourceforge.net/projects/ngrep/`](http://sourceforge.net/projects/ngrep/)\n\
  \n这些工具中的任何一种都可以用于网络分析。\n\n### 虚拟取证\n\n`Virtualization`（虚拟化）是一个包含许多技术的广泛术语。它是提供独立于用户物理机器的各种\
  \ IT 资源的方法。虚拟化了一个逻辑 IT 资源，它可以独立于终端用户的操作系统以及硬件运行。对于取证而言，最基本的问题是嫌疑者机器上运行着一个虚拟机的情况。从云服务器获取数据也存在问题。\n\
  \n#### 虚拟机\n\n虚拟机是一个有趣的概念，它是我们将在本章稍后部分讨论的更广泛的虚拟系统的先驱。虚拟机本质上是划分计算机硬盘的某部分和 `RAM`（执行时），以便在与操作系统其余部分完全隔离的状态下运行。这就像是你正在运行一台完全独立的计算机；它只是共享了主机计算机的资源。简单来说，它是一台虚拟计算机——因此被称为虚拟机。\n\
  \n每个厂商存储数据的方式略有不同。以下列表显示了三个最广泛使用的虚拟机厂商中在取证方面最有价值的文件：\n\n* `VMware Workstation`:\n\
  \    * `.log files`: 这仅仅是虚拟机的活动日志。\n    * `.vmdk`: 这是虚拟访客操作系统的实际虚拟硬盘。虚拟硬盘可以是固定的或动态的。固定虚拟硬盘的大小保持不变。动态虚拟硬盘则根据需要扩展。\n\
  \    * `.vmem`: 这是虚拟机分页文件/交换文件的备份。这对于取证调查可能非常重要。\n    * `.vmsn`: 这些是 VMware 快照文件，根据快照的名称命名。`VMSN`\
  \ 文件存储了创建快照时虚拟机的状态。\n    * `.vmsd`: `VMSD` 文件包含关于快照的元数据。\n* `Oracle VirtualBox`:\n\
  \    * `.vdi`: 这些是 VirtualBox 磁盘镜像。\n    * `/.config/VirtualBox`: 这是一个包含配置隐藏文件。\n\
  \    * `.vbox`: 这是机器设置文件。在 `4.0` 之前，它是 `.xml`。\n    * `Virtual PC`:\n    * `.vhx`:\
  \ 这些是实际虚拟磁盘。它们对于取证显然很重要。\n    * `.bin files`: 这些包含虚拟机的内存，因此必须检查。\n    * `.xml files`:\
  \ 这些文件包含虚拟机配置详情。每个虚拟机和每个快照都有这样一个文件。这些文件始终使用内部识别该虚拟机的 `GUID` 命名。\n\n#### 云\n\n云被定义为“虚拟化计算机资源池”。人们经常谈论云，好像只有一个云，或者至少只有一种云。这种印象是不准确的。存在多个云和多种云。任何拥有资源的组织都可以建立云，并可能出于不同的原因建立，从而导致不同的云。\n\
  \n云系统取决于多个部分。每个部分都可能是证据所在地：\n\n* `虚拟存储`: 虚拟机托管在物理或多个物理服务器上。这些物理服务器的硬盘空间和 `RAM` 被划分给各个虚拟服务器使用。\n\
  * `审计监控`: 通常有一个监控资源池使用的审计监控器。该监控器还会确保一个虚拟机无法访问另一个虚拟机的数据。\n\n\n\n\n\n- **Hypervisor（虚拟机监控器）：**\
  \ Hypervisor 机制是为虚拟服务器提供资源访问权限的过程。\n- **逻辑网络边界：** 由于云由虚拟服务器而非物理服务器组成，因此需要逻辑网络和逻辑网络边界。该边界将各个资源池相互隔离。\n\
  \n个别云实现方案可能包含额外的工具，例如管理控制台，允许网络管理员对云进行监控、配置和管理。\n\n云取证面临两个问题。第一个是司法管辖权问题。云数据通常在不同国家的服务器之间进行复制，每个国家都有自己的法律。其次是获取数据的技术问题。你极可能无法对整个云进行镜像复制。因此，你可能需要对相关数据进行逻辑拷贝，甚至进行现场分析（live\
  \ analysis）。\n\n## 总结\n\n在本章中，你已经学习了计算机取证的基础知识。你学到的最重要的内容是制作一份取证副本进行工作，并记录所有内容。记录得越详尽越好。你还学习了如何检索浏览器信息和恢复被删除的文件，并学习了一些在取证中可能实用的命令。你还探索了\
  \ Windows 注册表的取证价值，甚至是云取证。\n\n### 测试你的技能\n\n### 单选题\n\n1. 在计算机取证调查中，哪哪项描述了证据从你发现到案件结束或上庭期间的路径？\n\
  \nA. 证据规则\nB. 概率法则\nC. 证据保护链\nD. 分离策略\n\n2. Ian 正在对一台 Linux 服务器进行取证检查。他正尝试恢复邮件。Linux\
  \ 存储邮件服务器日志在哪里？\n\nA. `/var/log/mail.*`\nB. `/etc/log/mail.*`\nC. `/mail/log/mail.*`\n\
  D. `/server/log/mail.*`\n\n3. 为什么你应该记录想要作为证据提取的计算机的所有电缆连接？\n\nA. 了解存在哪些外部连接\nB.\
  \ 以防连接了其他设备\nC. 了解存在哪些外围设备\nD. 了解存在哪些硬件\n\n4. Pedro 正在检查一台 Windows 10 电脑。他提取了 `index.dat`\
  \ 文件并正在检查该文件。`Index.dat` 文件中有什么？\n\nA. Internet Explorer 信息\nB. Windows 机器的通用互联网历史、文件浏览历史等\n\
  C. Firefox 的所有网络历史\nD. Linux 机器的通用互联网历史、文件浏览历史等\n\n5. 这种既是标准 Linux 命令，又作为 Windows\
  \ 应用程序提供的命令名称是什么？它可以用于创建位流镜像并制作取证副本。\n\nA. `mcopy`\nB. `image`\nC. `MD5`\nD. `dd`\n\
  \n6. 在对数字证据进行分类时，首要目标是什么？\n\nA. 为所有硬盘制作位流镜像。\nB. 维护证据的完整性。\nC. 避免从现场移除证据。\nD. 禁止关闭电脑。\n\
  \n7. Mahmoud 使用一系列 Windows 工具从他正在筛查的计算机中提取信息。他刚刚使用了 `Openfiles` 命令。`Openfiles` 命令显示什么？\n\
  \nA. 任何已打开的文件\nB. 任何已打开的共享文件\nC. 任何已打开的系统文件\nD. 任何使用 ADS 打开的文件\n\n8. “感兴趣的数据”是指什么？\n\
  \nA. 与你的调查相关的数据\nB. 色情内容\nC. 文档、电子表格和数据库\nD. 原理图或其他基于经济的信息\n\n9. 关于日志记录，以下哪些项对调查人员很重要？\n\
  \nA. 日志记录方法\nB. 日志留存\nC. 存储日志的位置\nD. 以上答案都是正确的\n\n### 练习\n\n练习 14.1: DiskDigger\n\
  \n下载 DiskDigger 并在你的电脑上搜索删除的文件。尝试恢复一个你选择的文件。\n\n练习 14.2: 制作取证副本\n\n此练习需要两台电脑。你还必须下载\
  \ Kali Linux 或 Knoppix（两者均免费）。然后尝试通过将电脑 A 的数据发送到电脑 B 来为电脑 制作取证副本。\n\n练习 14.3: OSForensics\n\
  \n从 `https://www.osforensics.com/osforensics.html` 下载 OSForensics 的试用版。\n\n使用 `https://www.osforensics.com/faqs-and-tutorials/video_demonstrations.html`\
  \ 中的教程，使用 OSForensics 对你自己的电脑进行基础取证。\n\n### 第 15 章\n\n## 网络安全工程\n\n章节目标\n\n在阅读本章并完成练习后，你将能够做到以下：\n\
  \n- 理解基本的系统工程概念\n- 理解如何将系统工程集成到网络安全中\n- 在网络安全利用工程工具\n- 解释标准在网络安全工程中的用法\n\n### 引言\n\
  \n网络安全领域正在快速增长。虽然这种快速扩张对网络安全从业人员的职业前景有利，但它为定义这一职业带来了挑战，包括网络安全内部的角色和要求。目前甚至不清楚网络安全在大学中属于什么学科。网络安全和网络安全教育使用了广泛的方法。在某些情况下，网络安全被作为一种业务管理学科进行教学和实践，侧重于政策和程序。在另一些情况下，它被视为计算机科学的一个分支学科。这种对网络安全定义的差异对于从业人员和学术界来说都是一个重大问题。\n\
  \n### 定义网络安全工程\n\n为了将网络安全工程定义为一个学科，首先有必要定义工程。工程技术认证委员会对*工程*的定义如下：\n\n工程是指一门通过学习、经验和实践获得的数学和自然科学知识，运用判断力开发以经济方式利用自然材料和力量的方法以造福人类的专业。\n\
  \n\n\n\n这一定义表明，任何工程学科必须建立在数学和自然科学的知识之上。如果你考虑传统的工程学科（航空航天、电气、机械等），你会发现工程高度侧重于规划和测试。必须对从需求收集到测试和部署的所有环节进行规划。建模也是一个核心概念。而这些在网络安全中并不经常这样做。\n\
  \n传统的工程学科包括机械、电气、土木和化学。在 20 世纪，这个名单扩展到了航空航天、生物、核能、计算机和其他类型的工程。在过去的 50 年里，我们看到了系统工程领域的兴起。所有这些多样化工程领域的共同点是，它们都建立在相同的工程原则之上，包括基于数学和自然科学应用的严谨设计。工程主要关注设计的数学和科学化方法。这种系统化的设计方法贯穿开发和测试——事实上，贯穿整个系统生命周期。即使是严谨的设计，反过来也是建立在科学且有方法的需求工程方法之上。\n\
  \n基于对工程定义和原则的理解，显而易见，为了让网络安全工程成为一门真正的工程学科，网络安全的实践和教学中某些元素必须发生改变。实现这种变化最有效的方法是参考某些现有的工程学科对网络安全工程进行建模。选择计算机工程或软件工程作为网络安全工程的模板似乎是合适的；然而，网络安全工程本质涉及到广泛系统的共生。网络安全不仅限于计算机，它还包括计算机工程和软件工程所不的人的人因素、政策和法律问题。\n\
  \n## 网络安全与系统工程\n\n网络安全本质上涉及各种计算机系统、人类流程、不同的操作系统以及参与网络安全的其他系统。网络安全可以恰地标记为系统系统；因此，系统工程是网络安全工程的模板。本章的建议是将网络安全正式化为系统工程的一个子学科。\n\
  \n在将网络安全工程定义为系统工程的子学科之前，首先明确理解什么是系统工程至关重要。国际系统工程协会（`INCOSE`）对系统工程的定义如下：\n\n系统工程是一种跨学科的方法，是实现成功系统的手段。它关注在开发周期早期定义客户需求和所需功能，记录需求，然后在考虑完整问题（运行、性能、测试、制造、成本与进度、培训与支持、处置）的同时，进行设计合成和系统验证。\n\
  \n根据定义，系统工程是一门跨学科的工程学科。它汇集了多样化的工程领域并包含了项目管理活动。系统工程关注整个系统生命周期内的给定系统或系统系统。这从概念阶段开始，持续到系统处置。对于网络安全工程来说这也是一种合适的方法。\n\
  \n要考虑的第一领域是需求工程，它涉及为要开发的系统定义需求。该过程从根据利益相关者的意见进行非正式且往往模糊的需求描述开始，然后将这些信息处理为特定的、可操作系统需求。在网络安全中，需求工程是一个经常被忽视的关键组件。许多网络安全项目的完成仅仅是因为它们满足了某些监管要求的最低标准，或者因为它们是常见的网络安全任务。正式化的需求工程在网络安全中并不常见。这表明，正式定义网络安全工程的好处之一是，需求工程可以整合到网络安全项目中。\n\
  \n## 将工程应用于网络安全\n\n虽然工程过程适用于网络安全的各个方面，但考虑一个具体的示例来说明需求工程的应用可能会有所益。为了这一目的，可以考虑渗透测试。目前，渗透测试通常以随随机的方式进行。在渗透测试中，可以使用需求工程过程来定义特定需求。客户对于什么是渗透测试以及他们想要实现什么只有模糊的想法。\n\
  \n根据 `IEEE 830-1993`，`requirement`（需求）被定义为：\n\n“用户解决问题或实现目标所需的条件或能力”\n\n“系统为了满足合同、标准或其他强制文档必须满足或具备的条件或能力。”\n\
  \n所有网络安全项目都应该从定义需求开始。为了使需求有效，它必须满足几项标准。有一个有用的缩写可以帮你记住这些标准：\n\n- `Specific`（具体的）\n\
  - `Measurable`（可量的）\n- `Achievable`（可实现的）\n- `Realistic`（现实的）\n- `Timely`（及时的）\n\
  \n这个 `SMART` 缩写旨在帮助你理解什么是好的需求。它首先且必须是具体的。说“我想变得更安全”太模糊了。说“我想在下一个财政年内将病毒爆发减少 23%”是非常具体的。如果你不能以某种方式衡量它，你如何知道自己是实现了它还是偏离了目标？这与“具体”是相辅相成的。它还必须是可实现的。说“我想再也不发生任何安全事件”这简直是不现实且不可实现的。虽然现实性和可行性有重叠，但它们并不完全相同。例如，说“我想将病毒事件减少\
  \ 15%”是可实现的。但说想在明天下班前完成这一目标简直是不现实的。\n\n需求工程活动始于需求获取。这是一个利益相关者和工程师会面讨论需求的过程。正如其名称所示，工程师从利益相关者处获取需求。最初收集的需求随后将进行分析。在需求分析阶段，可以使用\
  \ `UML` 图、SysML 图（我们将在本章稍后部分探讨）、用户故事和其他技术来澄清需求。通常，在需求分析之后是系统建模。建模可以使用 `UML` 或 `SysML`\
  \ 建模，或者使用诸如 `MATLAB` 等工具进行。其理念是探索已收集的需求。接下来是对需求进行规范说明和验证。\n\n在需求工程中，系统工程师使用技术从客户或其他利益相关者处获取需求。这是一个可以很容易定制到网络安全工程的过程。作为一个示例，这可以应用于网络安全的一个集——渗透测试。对于渗透测试，需求工程可以涉及多种技术：\n\
  \n- 审查客户组织过去发生的事件以及同行业发生的事件。从这些特定的需求中进行导出，并寻求客户对这些需求的共识。\n\n\n\n\n\n- 用例图（Use-case\
  \ diagrams）在系统工程中非常常见。它们提供了一个非常易懂的模型，即使是非技术利益相关者也能理解。渗透测试人员可以使用误用用例（misuse cases）对客户系统的潜在误用进行建模。这些误用用例包括内部威胁、外部攻击者，甚至是意外的安全违规。误用用例将在本章后的“SecML”章节中进行详细描述。\n\
  - 审查来自相关监管机构和行业标准的特定需求。许多标准，例如支付卡行业数据安全标准（`PCI-DSS`），定义了特定的渗透测试需求。\n\n一旦需求被收集并获得利益相关者的批准，这些需求应形成渗透测试的基础。在系统工程中，双向需求矩阵是跟踪需求的常用工具。对于渗透测试而言，这将每项需求追溯到至少一次已执行的特定测试，并且每一项测试都应该追溯回特定的需求。这确保了渗透测试满足了所有需求，并且所有执行的测试都是由一个或多个特定需求所导致的。图\
  \ 15.1 展示了渗透测试的简化需求矩阵。\n\n![Description: 一个截图显示了需求双向追溯矩阵。](img/15fig01.jpg)\n\n\
  **图 15.1** *需求双向追溯矩阵。*\n\n显然，实际的渗透测试会有更多的活动和需求。但此图证明了需求双向追溯矩阵在应用于渗透测试时的有用性。示例中的主要问题是将需求工程集成到渗透测试中。特定需求将取决于该特定渗透测试的具体需求。目前的问题是，现有的网络安全课程没有包含任何系统工程内容。因此，发现没有过需求工程正式训练的网络安全专业人员并不罕见。\n\
  \n一旦确定了需求，就有必要规划实际的渗透测试。系统工程提供了几种有效工具来帮助规划。其中一种工具是工作分解结构（`WBS`）。`WBS` 是一种将大型过程分解为更小、更易于管理的部分的图表。这对于确保所有任务都已计划非常有用。它还将项目拆分为更小的任务，以便于进度和预算。图\
  \ 15.2 显示了单个服务器的简化工作分解结构。\n\n![Description: 一幅图显示了工作分解结构。](img/15fig02.jpg)\n\n\
  **图 15.2** *工作分解结构。*\n\n仅通过将需求工程和工作分解结构应用于渗透测试，人们就能实现更系统化、更一致的测试。这可以提高渗透测试的效率并简化流程。然而，如果渗透测试人员没有接受过这些系统工程基础概念的教育，就无法实现。\n\
  \n除了规划和执行渗透测试的特定示例外，更广泛的问题是设计任何安全系统。此类设计原则适用于任何安全实施，例如部署新的入侵检测系统（`IDS`）、实施新的网络策略或开发蜜蜜罐（诱饵系统）。网络安全目前的趋势是在计划最少（如果有的话）的情况下执行任务。这是系统工程可以增强网络安全的另一个领域。\n\
  \n正如之前讨论过的，可靠性工程的元素也可以应用于网络安全工程。通过集成已建立的测量可靠性的方法，网络安全工程有一套现成的指标。可靠性工程的核心是风险管理。而这也是网络安全的最终目标。\n\
  \n任何系统工程与网络安全的集成都必须整合特定的标准。`IEEE 15288` 标准定义了系统开发生命周期。这种生命周期也应应用于任何环境中的安全性开发。因此，在实施新的入侵检测系统或实施新的网络策略时，应遵循\
  \ `IEEE 15288` 系统开发生命周期。该标准包含以下条款：\n\n- 条款 6.4.1—利益相关者需求定义过程\n- 条款 6.4.2—需求分析过程\n\
  - 条款 6.4.3—架构设计过程\n- 条款 6.4.4—实施过程\n- 条款 6.4.5—集成过程\n- 条款 6.4.6—验证过程\n- 条款 6.4.7—过渡过程\n\
  - 条款 6.4.8—有效确认过程\n- 条款 6.4.9—运行过程\n- 条款 6.4.10—维护过程\n- 条款 6.4.11—处置过程\n\n这定义了开发或获取任何系统的过程，从定义需求开始。这个过程在介绍性系统工程课程中被经常教授，但对许多网络安全从业人员来说可能很陌生。理解系统开发生命周期对于任何系统（包括网络安全系统）的开发都是至关重要的。\n\
  \n任何网络安全系统都必须从需求工程开始。需求工程的一个标志是需求获取（requirements elicitation）。这是一个工程师从利益相关者处获取需求的过程。这种想法是，利益相关者可能不知道可以或应该做什么。需要工程师的专业知识来获取出一组需求。这在网络安全领域尤为适用。利益相关者可能并不精通网络安全，如果没有工程师的协助，无法有效地得出一个完整的需求列表。\n\
  \n系统工程的另一个可能对网络安全工程有显著益助的工具是用例图。它最初是 `UML` 的一部分，现在被纳入 `SysML` 中。用例图显示了一系列用户（包括其他系统）以及他们将如何与目标系统交互。用例的细节将在本章后的“SecML”章节中详细阐述。然而，建模用户如何与系统交互的简单概念在定义系统功能时非常有用。它也是在需求获取期间与利益相关者交流的有效工具。\n\
  \n统一建模语言（`UML`）是一组用于建模软件的图表。这些图包括显示软件如何被使用的用例图。`UML` 还包括描述软件应如何部署的部署图。总共有 14 种不同的\
  \ `UML` 图。`SysML`（或系统建模语言）与之类似，但适用于任何系统。有 9 种不同的 `SysML` 图。\n\n本节讨论的工具只是系统工程使用的技术中的一部分，这些技术可以有效地应用于整个网络安全，特别是渗透测试。对于任何渗透测试人员来说，参加系统工程课程都是有利的。教育机构可能希望考虑在现有的网络安全课程中增加系统工程课程。至少，网络安全工程师应该至少熟悉\
  \ `INCOSE` 手册。\n\n本节介绍的工具只是系统工程所利用工具的。工具固然重要，系统工程的概念同样重要。例如，系统建模和仿真在系统工程中很常见，但在网络安全中并不常见。将网络安全工程定义为系统工程的一个子学科需要包含建模和仿真。\n\
  \n\n\n\n建模与仿真为在各种场景下测试系统提供了一种有效的机制。例如，如果有人正在开发一种防御拒绝服务（DoS）攻击的系统，那么模拟 DoS 攻击以确定系统将如何响应将很有用。MATLAB\
  \ 已经广泛用于网络流量的建模。因此，利用 MATLAB 对基于网络流量的攻击建模是合适的。然而，这种建模在网络安全领域并不常见。这就是建模与仿真应用于网络安全工程的一个示例。\n\
  \nMATLAB 是系统工程和其他工程学科中常用的工具。该工具已应用于广泛的工程领域，包括航空航天工程和生物工程。该工具也应该被纳入网络安全工程中。这种建模方法的多功能性使其成为许多不同工程学科中的有效工具。\n\
  \n可靠性分析是系统工程的另一个重要组成部分——而且非常适用于网络安全工程。可靠性工程和分析是确定给定系统可靠性的过程。在网络安全中，系统往往是在不了解其可靠性的情况下实现的。可靠性工程包含了许多确定可靠性的技术和公式。\n\
  \n所有工程学科的一个标志是可量化的数据。为了做出明智的决定，拥有客观指标。可靠性工程包含许多可以帮助获取此类指标的公式。幸运的是，其中许多公式不需要先进的数学知识。\n\
  \n均方偏差公式相对简单，并提供了任何系统如何偏离预期的见解。该公式如图 15.3 所示![Description: MSD equals 1 over n times\
  \ sigma upper limit equals n lower limit i equals 2 of (y subscript i minus T) the\
  \ whole squared.](img/15fig03.jpg)\n\n**图 15.3** *均方偏差公式。*\n\n在该公式中，`y[i]` 是实际值（即系统预期的性能），而\
  \ `T` 是目标值。\n\n调整可控输入的设置允许人们改变 MSD。这是来自可靠性工程中一个相对简单的公式，可以应用于任何网络安全系统的可靠性。这在评估入侵检测系统（IDS）和反病毒毒软件的效能时特别有用。MSD\
  \ 公式可以与建模和仿真相结合，在网络安全系统运行之前对其进行精细调整。\n\nMSD 公式自然引出了 MPE 公式。平均百分比误差（MPE）是建模产生的平均误差数量。换句话说，模型与实际值之间的平均误差是多少。这在建模中至关重要，因为它可以用于评估模型本身的效能。图\
  \ 15.4 显示了 MPE 公式![Description: MPE equals 100 percent over n times sigma upper\
  \ limit equals n lower limit t equals 1 of a subscript t minus f subscript t over\
  \ a subscript t.](img/15fig04.jpg)\n\n**图 15.4** *平均百分比误差公式。*\n\n在该公式中，\n\n`n` 是预测变量的不同时间次数，`a[t]`\
  \ 是被预测数量的实际值，`f[t]` 是预测值。\n\n除了网络安全工程有用的公式外，可靠性工程还涉及适用于网络安全的概念。例如，平均故障间隔时间（MTBF）概念估计了组件发生故障之前的平均时间。对于反病毒毒软件解决方案，这可能是指给定文件被误识别为病毒或未被识别为病毒之前的平均时间。平均故障间隔时间的计算方法如图\
  \ 15.5 所示![Description: MTBF equals sigma times (start of downtime minus start of\
  \ uptime) over number of failures.](img/15fig05.jpg)\n\n**图 15.5** *MTBF 公式 1。*\n\
  \n现在这个公式确实出现在一些网络安全书籍（包括本书）中，并在某些认证课程中介绍。MTBF 公式更准确的解释可以定义为可靠性函数 `R(t)` 的算术平均值，它可以表示为故障故障时间密度函数\
  \ `f(t)` 的期望值。这需要积分微积分，如图 15.6 所示![Description: MTBF equals integral over the intervals\
  \ 0 to infinity of R(t) dt equals integral over the intervals 0 to infinity of f(t)\
  \ dt.](img/15fig06.jpg)\n\n**图 15.6** *MTBF 公式 2。*\n\n\n\n\n# 6. 监控：持续对针对系统及其运行环境实施的控制进行监控，识别可能影响控制的变化、攻击迹象等，并重新评估控制的有效性。\n\
  \n## ISO 27001\n\nISO 27001 是信息安全管理体系（ISMS）标准。你可能已经听过甚至参与过 ISO 27001 审计。ISO 27001\
  \ 提供了一个框架，无论行业或组织规模大小，都能帮助保护您的系统。该标准包含 14 个不同的领域：\n\n* **A.5. 信息安全策略**：本节的控制措施描述了如何处理信息安全策略。\n\
  * **A.6. 信息安全组织**：本节的控制措施通过定义内部组织（例如角色、职责等），以及信息安全的组织方面（如项目管理、移动设备的使用和远程办公），为信息安全的实施和运行提供基本框架。\n\
  * **A.7. 人员资源安全**：本节的控制措施确保受组织控制的人员以安全的方式被招聘、培训和管理；同时还涉及了纪律处分和终止协议的原则。\n* **A.8.\
  \ 资产管理**：本节的控制措施确保信息安全资产（例如信息、处理设备、存储设备等）被识别，指定了其安全职责，并让人员根据预定义的分类级别知道如何处理它们。\n\
  * **A.9. 访问控制**：本节的控制措施根据实际业务需求限制对信息和信息资产的访问。控制措施适用于物理和逻辑访问。\n* **A.10. 密码**：本节的控制措施为正确使用加密解决方案提供基础，以保护信息的机密性、真实性和/或完整性。\n\
  * **A.11. 物理环境安全**：本节的控制措施防止对物理区域的未经访问，并保护设备和设施免受人为或自然干预。\n* **A.12.set 安全**：本节的控制措施确保\
  \ IT 系统（包括操作系统和软件）是安全的并免受数据丢失的影响。此外，本节的控制措施要求具备记录事件和生成证据的手段、定期进行漏洞验证，并采取预防措施防止审计活动影响业务。\n\
  * **A.13. 通信安全**：本节的控制措施保护网络基础设施及服务，以及在网络中传输的信息。\n* **A.14. 系统获取、开发和维护**：本节的控制措施确保在购买新信息系统或升级现有系统时考虑到信息安全。\n\
  * **A.15. 供应商关系**：本节的控制措施确保供应商和合作伙伴执行的外包活动也使用适当的信息安全控制，并描述了如何监控第三方的安全性能。\n* **A.16.\
  \ 信息安全事件管理**：本节的控制措施提供了一个框架，确保安全事件和事故得到适当的通信和处理，以便及时解决；它们还定义了如何保存证据，以及如何从事件中汲训以防止其再次发生。\n\
  * **A.17. 业务连续性管理的信息安全方面**：本节的控制措施确保在中断期间信息安全管理的连续性以及信息系统的可用性。\n* **A.18. 合规性**：本节的控制措施为法律、法规和合同要求提供了一个框架。本节的标准为合规性提供了框架。\n\
  \n## ISO 27004\n\nISO 27004 提供了信息安全监控的指导。它旨在与 ISO 27001 结合使用。它提供了关于如何衡量信息安全控制有效性的建议。\n\
  \n## NIST Special Publication 800-63\n\nNIST 特别出版 800-63 为数字身份提供了指南。它涵盖了身份验证、联邦和身份生命周期管理的要求。\n\
  \n## SecML\n\n本章的此节改编自作者的一篇论文。该论文首次将安全建模语言 (`SecML`) 定义为一种新的建模语言。\n\n\n\n\n\n# 系统工程利用了多种方法对系统及其子系统进行建模。建模是设计和测试不可不可缺的一部分。事实上，存在一个整个基于模型的系统工程领域。在系统工程中使用的主要建模方法之一是系统建模语言\
  \ `SysML`。`SysML` 是早期统一建模语言（`UML`）的扩展。`UML` 由对象管理组（`OMG`）为了设计软件而创建。`SysML 将其扩展到对广泛系统的建模。`SysML`\
  \ 包含 9 种图，其中一些直接取自 `UML`，另一些则是专门为 `SysML` 创建的。\n\n软件工程还包括许多其他建模语言。例如，存在领域特定建模语言，如特定框架的建模语言（`FSMLs`）。`FSMLs`\
  \ 用于面向对象编程。针对广泛的软件工程应用，存在多种特定的建模语言。\n\n系统建模语言（`SysML`）是为了对系统和系统系统而开发的。`SysML` 是系统工程中使用的主要的建模工具。它最初作为一种开源规范开发，扩展了统一建模语言（`UML`）。2001\
  \ 年，`INCOSE` 发起了 `SysML` 计划。最终，`INCOSE` 与对象管理组（`OMG`）协作创建了 `SysML`。`SysML` v1.0\
  \ 于 2007 年发布。目前 `SysML` 版本是 1.5，于 2017 年引入。它规范于 ISO 标准 19514:2017，“信息技术：对象管理组系统建模语言（`OMG\
  \ SysML`）”。\n\n正如所讨论，针对特定的工程学科存在特定的建模技术甚至建模语言。如果网络安全工程要被真正定义为一个独立的工程学科，它也将从其自身的建模语言中受益。这将有助于针对网络安全需求定制建模。\n\
  \n系统工程的一个重要部分是建模。事实上，系统工程中有一个专门关注建模的子学科。该概念是便于在系统开发生命周期的任何阶段更好地理解系统。能够模拟和模拟系统行为甚至可以用需求收集阶段。这一事实支持了网络安全工程包含建模语言的需求。\n\
  \n显而易见，建模是工程（特别是系统工程）不可的一部分。建模在网络安全的某些方面确实以有限的方式使用。这些事实支持了对网络安全特定建模语言的需求。\n\n本章提出是对\
  \ `SysML` 的修改，以促进安全领域的建模。这种建模被称为 `SecML`，用于建模安全需求。`SecML` 的定义使用了一些 `SysML` 和 `UML`\
  \ 图，并添加了几种新图。其概念是提供一种特定于网络安全的建模语言。软件工程使用 `UML`，系统工程使用 `SysML`；网络安全工程应该拥有一种特定于该领域的建模语言是理所当然的。\n\
  \n## SecML 概念\n\n安全建模语言（`SecML`）的般概念是提供一种建模工具，可以用于有效地建模网络攻击场景和防御态势。鉴于网络安全涉及系统系统，以\
  \ `SysML` 为基础并修改该建模语言以制定 `SecML` 是合适的。\n\n某些图类型与 `SysML` 图非常相似，仅有细微修改。其他图类型是专门为网络安全应用创建的。与\
  \ `SysML` 语言 `UML` 不同，`SecML` 中的图没有分为结构、行为或交互等类别。然而，某些图显然是面向行为或结构的。将图分为攻击导向或防御导向的图似乎是有益的；但是，特意没有这样做。显然，误用用例图等图类型适用于攻击建模。同样，安全框图（`SBD`）可以被视为一种防御导向的图类型。然而，其他图如安全序列图适用于攻击也适用于防御。因此，图没有分为攻击和防御类别。\n\
  \n## 误用用例图\n\n第一个 `SecML` 图也是最容易理解的是误用用例图（`MCD`）。`SysML` 和 `UML` 都利用用例图来理解用户如何与给定系统交互。用户也包括使用给定系统的其他系统。出于安全考虑，最大的关注在于攻击者可能如何误用系统。因此，对误用用例进行建模是逻辑。攻击的本质是误用系统。图\
  \ 15.7 显示了一个典型的用例图。\n\n![描述：截图显示了餐厅场景的典型用例图。](img/15fig07.jpg)\n\n**图 15.7** 典型的用例图。\n\
  \n在传统的用例图中使用了相对简单的元素。看起来像火人形象的图像用于表示系统的任何用户。这当然可以是一个人类用户。然而，另一个系统实际上也可以是一个用户，但仍将用火人形象表示。在系统中进行的活动用椭圆标记。用户与系统操作之间的连接通过线表示。此外，当一个活动扩展另一个活动时，这种关系通过虚线和\
  \ `<<extends>>` 标签演示。\n\n`UML` 用例图已广泛用于建模感兴趣系统的特定用途。它的实用性源于其易于理解。图元素是自而易见的，且易于理解。这就是为什么这种特定的\
  \ `UML` 图在与非技术利益相关者通信很有很有原因之一。\n\n误用用例的概念已经存在。然而，这里的修改是为误用提供正式符号。逻辑起点是 `UML` 用例图，然后对其进行修改以演示误用。这涉及添加某些符号。对于\
  \ `SecML` 误用用例图，增加了图 15.8 所示的符号。\n\n![描述：表格列出了各种误用用例符号。](img/15fig08.jpg)\n\n**图\
  \ 15.8** 误用用例符号。\n\n图 15.9 显示了一个示例用例图。该图显示了一个正常用户和一个滥用者误用系统。它还显示了哪些活动提供了缓解措施来应对误用，哪些活动还没有任何缓解因素。\n\
  \n![描述：显示了一个误用用例图示例。](img/15fig09.jpg)\n\n**图 15.9** 误用用例图示例。\n\n图可以使用额外的符号进行增强。例如，对应对措施的指示可以进一步描述，说明应对措施是什么。应对措施符号上也指示了一个数字，表示有多个应对措施。缓解因素的数量将是带有\
  \ X 的圆圈内的整数，如图 15.10 所示。\n\n![描述：显示了另一个误用用例图示例。](img/15fig10.jpg)\n\n**图 15.10**\
  \ 另一个误用用例示例。\n\n\n\n\n\n图 15.9 然后将通过对所采用应对措施的说明性注释进行增强。例如，应对措施可以是 (1) 防止下载附件的策略以及\
  \ (2) 用于反滥用者/攻击者发送给受害者的病毒。误用例图允许网络安全工程师建模攻击者如何滥用系统，以及目前实施了哪些应对措施。更重要的是，通过对所有误用例进行建模，将很清楚哪些攻击向量具有充分的缓解措施，而哪些没有。\n\
  \n图 15.11 提供了一个误用例的具体示例。该图显示了一个正常的、授权的用户登录系统。它还显示了一个滥用者（即攻击者）发送了一封带有恶意软件附件的电子邮件。可以清楚地看到滥用者是如何滥用发送电子邮件的正常流程。在这个例子中也很，滥用者的远程登录被两个缓解因素阻止了，但发送带有恶意软件附件的邮件没有缓解因素。\n\
  \n![Description: 显示了一个特定的误用例图示例。](img/15fig11.jpg)\n\n**图 15.11** *特定的误用例示例。*\n\n\
  显然，图 15.11 了一个相当简化的示例；然而，它说明了这种图的实用性。它立即澄清了滥用者可能使用的攻击向量。此外，变得非常清楚的是，远程连接似乎有充分的缓解，但对于发送恶意邮件却没有。这种缓解措施的缺乏也将有助于钓鱼攻击。这一概念是为所有攻击向量创建误用例图（MCDs）。这有助于对这些攻击进行建模和理解，以及选择和应用缓解应对措施。\n\
  \n在 SysML 中，时序图显示了对象如何随时间进行相互作用。具体而言，时序图显示了对象之间动作之间的关系。在安全语境下，这具有重要意义。在任何攻击场景中，数据从一个对象到另一个对象的流顺序对于分析至关重要。这同样适用于防御和缓解策略。理解入侵检测系统如何与安全信息事件管理（`SIEM`）相互作用，对于建模任何感兴趣系统的安全性都是相关的。可以直接利用\
  \ SysML 中现有的时序图，无需为了安全目的进行任何修改。\n\n虽然时序图可以在不进行任何修改的情况下用于安全目的，但轻微的修改将提高它的实用性。因此，`SecML`\
  \ 对时序图进行了微改，命名为安全时序图（`SSD`）。在 `SecML` 中，时序图的使用方式与 SysML 中几乎相同。图 15.12 显示了当前的 `UML/SysML`\
  \ 时序图。\n\n![Description: 显示了一个 UML/SysML 时序图。](img/15fig12.jpg)\n\n**图 15.12** *UML/SysML\
  \ 时序图。*\n\n时序图演示了一系列动作；然而，这些模型旨在描绘预期的活动，而不是攻击。修改时序图涉及添加/修改某些符号。对于 `SecML`，图 15.13\
  \ 所示的符号被添加到安全时序图中。\n\n![Description: 图表显示了添加到时序图中的网络安全添加符号。该符号由圆圈和一个里面的 X 表示。它被用于未经授权的序列，例如发送伪造电子邮件或恶意软件。](img/15fig13.jpg)\n\
  \n**图 15.13** *时序图的网络安全添加。*\n\n传统的时序图不区分授权和未授权的操作。事实上，`SysML` 中甚至没有考虑未授权的活动。然而，在网络安全中，未授权的操作至关重要。图\
  \ 15.14 显示了一个示例性的修改时序图。\n\n![Description: 显示了一个修改后的时序图。](img/15fig14.jpg)\n\n**图\
  \ 15.14** *修改后的时序图。*\n\n与传统的 `SysML` 时序图一样，消息仍然用上方的消息名称和消息的方向性编写。然而，`SecML` 的修改允许人们区分正常操作和未授权的操作。通过看到系统中实际发生的未授权动作和授权的动作，可以对系统操作提供非常有效的理解。\n\
  \n修改后的时序图提供了任何网络攻击中事件序列的概述。这允许网络安全工程师建模各种攻击。将安全时序图与误用例图相结合，可以对相关的攻击向量提供一个有效的概述。\n\
  \n这种图类型是专门为 `SecML` 创建的。数据接口图（`DID`）被用于让网络安全工程师理解感兴趣系统中的数据流。它建模了数据流入和流出任何系统。。概念是查看任何系统或子系统，并为数据流入流出感兴趣系统的所有接口绘制图。数据可以流动的地方都是安全关注区域。向外流动的数据可能导致数据泄露。流入的数据可能导致恶意软件被引入系统。这在图\
  \ 15.15 中显示。\n\n![Description: 图表显示了数据接口图。](img/15fig15.jpg)\n\n**图 15.15** *数据接口图。*\n\
  \n图 15.16 显示了数据接口图的具体元素。\n\n![Description: 表列了各种接口图元素。](img/15fig16.jpg)\n\n**图\
  \ 15.16** *数据接口图元素。*\n\n该图设计得非常简单。目标是使其成为一个网络安全工程师可以在少量培训的情况下高效使用的过程。其目的是确保所有数据流点都已识别，并识别了缓解措施。该图用于检查感兴趣的系统并确定了任何缓解策略。这本质上是一个有限的接口图。\n\
  \n统一建模语言（`UML`）作为 `SysML` 的基础包含组件图。在 `UML` 中，组件图用于识别软件中的组件并建模它们如何连接。例如，`UML` 包含装配连接器，建模一个组件需要另一个组件的连接。委托连接器链接了外部组件。\n\
  \n本节描述了 `SecML` 的基础，它是基于现有的 `SysML` 的。未来的研究可能会对这些模型进行改进，并向 `SecML` 添加新模型。\n\n###\
  \ 建模\n\n在考虑威胁时，建模是一个重要的课题。基本上所有的网络安全工程都是针对某些威胁的。建模的概念是确保我们构建的安全是为了应对特定系统的威胁。\n\n\
  #### STRIDE\n\n\n\n\n攻击模拟与威胁分析过程（PASTA）是一种用于评估风险的七步方法论。正如其名称所示，它是通过模拟攻击来分析威胁。PASTA\
  \ 以风险为中心，于 2012 年开发。表 15.2\n\n## DREAD\n\n损害性（Damage Potential）、可复制性（Reproducibility）、利用性（Exploitability）、受影响用户（Affected\
  \ Users）、可发现性（Discoverability）是一种使用五个类别进行风险评分的记忆助法。攻击会导致多大的损害？攻击者复制这种攻击有多容易？执行攻击需要多少精力？有多少用户受影响？最后，发现该威胁有多容易。\n\
  \n## 总结\n\n在本章中，你已经看到了系统工程在网络安全中的应用。目标是让你开始将方法论、系统化的方法应用于网络安全。以渗透测试为例，它应该仅仅是一系列随机的破解尝试。相反，它应该是一个精心设计的过程，映射到特定的测试需求。对网络安全场景进行建模也有利于更好地理解系统安全需求。本章简要介绍的\
  \ `SecML` 建模语言提供了这种方法论。\n\n### 测试你的技能\n\n### 单选题\n\n1. 使用何种图表来显示任何实体如何与系统交互？\n\n\
  A. 用例图\nB. 序图\nC. 数据接口图\nD. 需求图\n\n2. 捕捉任何安全过程或系统需求的最合适工具是什么？\n\nA. 用例图\nB. 序图\n\
  C. `SysML`\nD. 追溯性矩阵\n\n3. 下列哪种网络安全活动描述为工程最为准确？\n\nA. 实现复杂的 `IPS` 规则\nB. 实现非对称加密\n\
  C. 创建需求追溯矩阵\nD. 进行取证调查\n\n4. 系统工程师使用哪种建模语言？\n\nA. `SecML`\nB. `SysML`\nC. `UML`\n\
  D. `DML`\n\n5. 这个符号在 `SecML` 中代表什么？\n\n![Description: 一个防御措施符号，用圆圈内的 \"X\" 标记表示。](img/15fig17.jpg)\n\
  \nA. 被禁止的操作\nB. 被阻塞的系统\nC. 应对措施\nD. 攻击\n\n6. 这个符号在 `SecML` 中代表什么？\n\n![Description:\
  \ 一个系统滥用者符号，用圆圈内的典型用户图表示。](img/15fig18.jpg)\n\nA. 攻击受害者\nB. 系统滥用者\nC. 系统用户\nD. 孤立用户\n\
  \n7. 这个系统在 `SecML` 中代表什么？\n\n![Description: 未授权的序列符号。](img/15fig19.jpg)\n\nA. 被阻塞的活动\n\
  B. 外部攻击\nC. 未授权的活动\nD. 内部攻击\n\n8. 哪个标准包含 14 个领域？\n\nA. `ISO27001`\nB. `RMF`\nC.\
  \ `NIST 800-63B`\nD. `STRIDE`\n\n9. `NIST 800-63B` 中有多少种保证级别？\n\nA. 14\nB. 3\nC.\
  \ 4\nD. 0\n\n10. `STRIDE` 的元素是哪些？\n\nA. 伪造、篡改、否认赖、信息泄露、拒绝服务、权限提升。\nB. 间谍软件、篡改、否认赖、信息泄露、拒绝服务、执行。\n\
  C. 伪造、篡改、反射攻击、信息泄露、拒绝服务、权限提升。\nD. 伪造、威胁、否认赖、信息泄露、拒绝服务、执行。\n\n### 练习\n\n练习 15.1：误用用例图\n\
  \n为特定类型的攻击创建一个误用用例图。你可以选择此书中描述的任何攻击。\n\n练习 15.2：需求收集\n\n考虑大学校园的网络安全需求。为校园计算机网络的渗透测试创建一个需求追溯性矩阵。\n\
  \n## 术语表\n\n本节包含了来自黑客和安全专业人员的术语。要真正理解计算机安全，你必须熟悉这两个世界。此术语表中还包含了通用网络术语。\n\n`admin`:\n\
  \n系统管理员（system administrator）的缩写。\n\n`adware`:\n\n用于显示广告的软件。\n\n`AES`:\n\n高级加密标准（Advanced\
  \ Encryption Standard）；一种使用 128、192 或 256 位密钥的对称密码。\n\n`APT`:\n\n高级持续威胁（Advanced\
  \ persistent threat）；一种在长时间内使用多种先进技术进行的攻击。\n\n`audit`:\n\n对系统安全性的检查。这种检查通常包括对文档、程序和系统配置的审查。\n\
  \n`authentication`:\n\n证明某人其声称身份的过程。\n\n`backdoor`:\n\n安全系统中的后门。\n\n`shielding`:\n\
  \n由创建者故意留下的漏洞。\n\n`shielding`:\n\n通过放置伪项目隐藏项目。\n\n`siphoning`:\n\n试图从合法网站吸引流量。\n\
  \n`black hat hacker`:\n\n出于恶意目的进行破解的人。\n\n`BlowFish`:\n\n由 Bruce Schneier 发明的已知对称加密算法。\n\
  \n`blue team`:\n\n渗透测试中的防御团队。\n\n`braindump`:\n\n告诉自己所知的一切。\n\n`breach`:\n\n成功进入系统；破坏安全。\n\
  \n`brute force`:\n\n通过尝试所有组合来破解密码。\n\n`bug`:\n\n系统中的缺陷。\n\n`Caesar cipher`:\n\n\
  最老的加密算法之一。使用简单的单替换密码。\n\n`CHAP`:\n\n挑战握手认证协议（Challenge Handshake Authentication\
  \ Protocol）；一种常用的认证协议。\n\n`CIA` 三角:\n\n机密性、完整性和可用性的常用安全缩写。\n\n`cipher`:\n\n加密算法同义词。\n\
  \n`cipher text`:\n\n密文。\n\n`code`:\n\n程序的源代码；或编程行为，如“编写算法”。\n\n`codegrinder`:\n\n\
  对在缺乏创意环境中工作的人的贬称。\n\n`cookie`:\n\n浏览器存储的通常是明文的小型数据。\n\n`cracker`:\n\n为了恶意、非法或有害的目的是而破解系统的人。与黑客等同义。`cracking`:\n\
  \n破解系统或代码。\n\n`crash`:\n\n突然且非预期的故障，如“我的电脑崩溃了”。\n\n`cryptography`:\n\n加密和解密的研究。\n\
  \n`cyber fraud`:\n\n利用互联网欺骗他人。\n\n`cyber stalking`:\n\n利用互联网骚扰他人。\n\n`DDoS`:\n\n\
  分布式拒绝服务（distributed denial of service）；从多个源位置发拒绝服务攻击。\n\n`demigod`:\n\n拥有多年经验具有国家或国际声誉的黑客。\n\
  \n`DES`:\n\n数据加密标准（Data Encryption Standard）；一种 20 世纪 70 年代开发的块密码。它使用 56 位密钥处理 64\
  \ 位块。不再被认为足够安全。\n\n`Diffie-Hellman`:\n\n用于密钥交换的非对称协议。\n\n`DoS`:\n\n拒绝服务（denial of\
  \ service）；一种防止合法用户访问资源的攻击。这通常通过向目标系统发送超过其处理能力的负载来实现。\n\n`Doxing`:\n\nDoxing 是寻找个人信息并将其公开的过程，通常通过互联网进行。\n\
  \n`EDoS`:\n\n经济可持续性攻击（Economic Denial of Sustainability）在未来将是一个问题。其概念是中断或停止云资源的可用性。这种攻击通常涉及发送虚假请求的机器人。这通常针对基础设施即服务（IaaS）解决方案。\n\
  \n`elliptic curve`:\n\n一种提供非对称加密的算法类。\n\n`Encrypting File System`:\n\n\n\n\n\n也被称为\
  \ `EFS`，微软的一种允许用户加密单个文件的文件系统。它被引入 Windows 2000。\n\n### 加密\n对消息进行加密的行为。加密通常涉及更改消息，使其在没有密钥和解密算法的情况下无法读取。\n\
  \n### 间谍活动\n非法收集信息，通常从政府或企业来源获取。\n\n### 道德黑客\n通过黑入系统来完成其认为在伦理上有效的目标的人。通常被称为渗透测试员。\n\
  \n### 防火墙\n在你的机器或网络与世界其他部分之间提供屏障的设备或软件。\n\n### 灰帽黑客\n通常遵守法律但在某些情况下会越界进行黑帽攻击行为的黑客。\n\
  \n### 黑客\n试图通过逆向工程详细检查系统来学习该系统的人。\n\n### 哈希值\n一种接受变长度输入并产生固定长度输出且不可逆的算法。\n\n###\
  \ 蜜罐\n一种被设计为对黑客极具吸引力的系统或服务器，实际上它是捕获他们的陷阱。\n\n### 集线器\n用于连接计算机的设备。\n\n### IKE\n互联网密钥交换；一种管理加密密钥交换的方法。\n\
  \n### 信息战\n试图通过信息操纵影响政治或军事结果的尝试。\n\n### 入侵检测系统 (IDS)\n一种用于检测尝试入侵的系统。\n\n### IP\n\
  互联网协议；网络连接中使用的主要协议之一。\n\n### IPsec\n互联网协议安全；用于保护 VPN 的方法。\n\n### IP 伪造\n使数据包看起来来自与其真实源地不同的\
  \ IP 地址。\n\n### 键盘记录器\n记录计算机上按键轨迹的软件。\n\n### MAC 地址\n网卡的物理地址。它是一个 6 字节十六进制数。前 3\
  \ 字节定义厂商。\n\n### 恶意软件\n任何具有恶意目的的软件，例如病毒或木马程序。\n\n### MD5\n消息摘要 5；一种加密哈希算法。\n\n###\
  \ MS-CHAP\n微软对 CHAP 的扩展。\n\n### 多字母替换\n使用多于一个替换字母表的加密方法。\n\n### NIC\n网络接口卡。\n\n\
  ### 数据包过滤防火墙\n一种扫描入站数据包并允许其通过或拒绝其通过的防火墙。它只检查头部而不检查数据，并且不考虑数据通信的上下文。\n\n### 渗透测试\n\
  通过尝试破解系统来评估系统的安全性。渗透测试是大多数渗透测试员的活动。\n\n### 电话黑客\n黑入电话系统的人。\n\n### 端口扫描\n顺序扫描端口以查看哪些端口是活跃的。\n\
  \n### PPP\n点对点协议；一种较旧的连接协议。\n\n### PPTP\n点对点隧道协议；用于 VPN 的 PPP 扩展。\n\n### 代理服务器\n\
  一种隐藏内部 IP 地址并向外部展示单个 IP 地址的设备。\n\n### 红队\n一个模拟特定类型攻击者的渗透测试团队。\n\n### 路由器\n连接两个网络的设备。\n\
  \n### RSA\n1977 年由三位数学家：Ron Rivest、Adi Shamir 和 Leonard Adleman 开发的公钥加密方法。`RSA`\
  \ 的名称源于每位数学家姓氏的首字母。\n\n### RST cookie\n一种缓解某些类型 DoS 攻击危险性的简单方法。\n\n### 脚本小子 (script\
  \ kiddie)\n对自称是熟练黑客的无技能之人的俚语。\n\n### SHA\n安全哈希算法；一种具有多个版本的加密哈希：SHA1、SHA2（带有变体）和\
  \ SHA3。\n\n### 蓝瓜攻击\n一种特定的分布式拒绝服务攻击。\n\n### 潜入者 (sneaker)\n试图破坏系统以评估其漏洞的人。这是一个旧词；今天大多数人使用渗透测试员这一术语。\n\
  \n### 嗅探器\n一种在数据跨网络时捕数据的程序。也称为数据包嗅探器。\n\n### Snort\n一种广泛使用的开源入侵检测系统。\n\n### 社会工程学\n\
  对人类用户使用说服手段以获取访问系统所需的信息。\n\n### SPAP\nShiva 密码认证协议；PAP 的私有版本，基本上是为 PAP 添加了加密。\n\n\
  ### 伪造\n假装成其他东西，例如数据包可能伪造另一个返回 IP 地址（如蓝瓜攻击中），或者当网站伪造知名的电子商务网站时。\n\n### 间谍软件\n监控计算机使用情况的软件。\n\
  \n### 堆栈调整\n一种保护系统免受 DoS 攻击的复杂方法。该方法涉及重新配置操作系统以不同的方式处理连接。\n\n### 状态检测包检测\n一种防火墙，不仅检查数据包，还知道数据包发送时的上下文。\n\
  \n### 对称密钥系统\n一种使用相同密钥加密和解密消息的加密方法。\n\n### SYN cookie\n一种缓解 SYN 洪水攻击危险性的方法。\n\n\
  ### SYN 洪水\n发送大量的 SYN 数据包（连接请求）然后从不响应，导致连接处于半开放状态。\n\n### 部族洪水网络 (TFN)\n一种用于执行 DDoS\
