  \nJane Doe 负责为她的保险公司选择一种加密方法。公司发送的数据是敏感的，但并非军事或机密性质。Jane 正在考虑多种方法。她最终选择了 `RSA` 的商业实现。这是最好的选择吗？为什么或为什么不是？\n\
  \n\n\n\n\n在阅读本章并完成练习后，你将能够做到：\n\n- 根据扫描器的工作原理评估其的有效性\n- 为特定组织选择最合适的防火墙\n- 理解反间谍软件方法\n\
  - 利用入侵检测系统检测你系统中的问题\n- 理解蜜罐技术（honey pots）\n\n### 引言\n\n在本书中，我们讨论了计算机安全的各个方面。在学习的目前这一阶段，你应该对真正的危险是什么以及适当的安全措施包括哪些内容有良好的了解，并对各种计算机攻击的形式有基本的理解。然而，如果你努力保护网络安全，你需要更多关于你可能选择使用的的安全设备和软件的技术细节。本章将回顾这些项目，并提供足够的细节，让你对使用哪种类型的产品做出明智决策。\n\
  \n本章描述的大多数设备在前面的章节中已经提到并简要介绍。本章的意图是深入探讨这些设备的工作原理。对于那些打算以后进入计算机安全领域的人来说，这些信息具有特别价值。仅仅拥有计算机安全的理论知识是不够的，你必须具备一些实践技能。本章将是你获得这些良好的良好起点，章节末的练习将给你机会练习设置和评估各种类型的防火墙、入侵检测系统\
  \ (`IDSs`) 以及反病毒应用程序。\n\n## 病毒扫描器\n\n`virus scanner(#gloss.xhtml#gloss_090)` 本质上是一种防止病毒感染系统的软件。这一事实对大多数读者来说可能是显而易见的。然而，了解病毒扫描器是如何工作的则是另一回事。这个话题在我们之前讨论病毒时简要提到过，但在本章中将详细阐述。\n\
  \n通常，病毒扫描器以两种方式工作。首先，病毒扫描器可能包含所有已知病毒定义的列表——即列出已知病毒及其文件大小、属性和行为的文件。通常，病毒扫描器供应商提供的服务之一是定期更新这些文件。病毒定义列表通常在一个小文件中，通常被称为\
  \ `.dat` 文件（data 的缩写）。当你更新病毒定义时，实际发生的情况是你的当前文件被供应商提供的最新文件所替换。反病毒程序随后可以扫描你的 PC、网络和入站电子邮件以查找已知病毒文件。你\
  \ PC 上的任何文件或邮件上的的附件都会与病毒定义文件进行比较，以查看是否有匹配项。对于电子邮件，可以通过查找特定的主题行和内容来完成。病毒定义通常还包括有关文件、文件大小等的详细信息。这提供了病毒的完整特征。\n\
  \n病毒扫描器工作的另一种方式是寻找类似病毒的行为。本质上，扫描器会查看相关文件是否正在执行病毒通常会做的事情——如操纵 `Registry` 或查看你的地址录。显然，第二种技术本质上是一种最佳猜测。\n\
  \n### 病毒扫描器是如何工作的？\n\n让我们更详细地看看反病毒软件是如何工作的。2022 年《美国新闻》的一篇名为“病毒扫描器是如何工作的？”^^(1)\
  \ 的文章解释说，病毒扫描器本质上是搜索已知病毒特征或模式的软件。请记住，只有在你保持其更新时，扫描器才能起作用。而且，当然，它只对已知病毒有效。虽然这篇文章现在看起来可能有点过时，但它仍然是准确的。\n\
  \n^(1) [`www.usnews.com/360-reviews/privacy/antivirus/how-does-antivirus-software-work`](https://www.usnews.com/360-reviews/privacy/antivirus/how-does-antivirus-software-work)\n\
  \n回想病毒扫描器工作的第二方式是监控病毒典型的某些类型行为。这可能包括任何尝试写入你的硬盘启动扇区、更改系统文件、自动化你的电子邮件软件或自我复制的程序。尝试修改系统\
  \ `Registry`（对于 Windows 系统）或更改任何系统设置的程序也可能表明存在病毒感染。\n\n病毒扫描器搜索的另一个特征是执行执行后仍留在内存中的文件。这被被称为\
  \ `terminate and stay resident` (`TSR`) 程序。某些合法的程序会这样做，但这种活动通常是病毒的迹象。此外，某些病毒扫描器使用更复杂的方法，例如扫描你的系统文件并监控任何程序。\n\
  \n无论行为如何，反病毒软件都使用特定的算法来评估给定文件为病毒的概率。\n\n有第三种方法称为 `启发式扫描` (`heuristic scanning`)，它基本上涉及检查文件，与特征扫描相似。然而，在启发式扫描中，文件不需要完全匹配特征。`Heuristics`\
  \ 指使用分支步骤对各种替代方案进行排序的功能。因此，启发式扫描根据文件特征进行检查。\n\n区分按需病毒扫描和持续扫描是非常重要的。`ongoing virus\
  \ scanner`（持续病毒扫描器）在后台运行，并不断检查 PC 的任何病毒迹象。`On-demand virus scanners`（按需病毒扫描器）仅在你启动它们时运行。许多反病毒扫描器提供这两个选项。\n\
  \n请记住，任何反病毒程序都会产生一些误报（false positives）和一些漏报（false negatives）。当病毒扫描器将一个给定文件检测为病毒但实际上它不是时，就会发生误报。例如，一个合法的程序可能会编辑\
  \ `Registry` 键或与你的电子邮件地址录交互。当一个病毒被错误认为是合法程序时，就会发生漏报。\n\n由于误报的存在，建议你不要将反病毒软件设置为自动删除怀疑的病毒。相反，应该将它们隔离并通知计算机用户。\n\
  \n### 病毒扫描技术\n\n通常，病毒扫描器有六种方式可以扫描病毒感染。其中某些在上一节中提到过，但在这里在这里进行了概述和定义：\n\n- **电子邮件和附件扫描**：由于病毒主要的传播方式是电子邮件，电子邮件和附件扫描是任何病毒扫描器最重要的功能。某些病毒扫描器实际上在下载到你的机器之前在电子邮件服务器上对其进行检查。其他病毒扫描器则在将电子邮件和附件传递给你的电子邮件程序之前在你的计算机上进行扫描。无论何种情况，电子邮件和电子邮件附件都应该在用户有机会打开它们并在系统中释放病毒之前进行扫描。\n\
  - **下载扫描**：每当你从互联网下载任何内容时（无论是通过网络链接还是通过 FTP 程序），都有可能下载到受感染的文件。下载扫描的工作与电子邮件和附件扫描类似，但它作用于你选择下载的文件。\n\
  - **文件扫描**：通过文件扫描，系统上的文件会被检查以查看它们是否匹配任何已知病毒。这种扫描通常是按需进行的，而不是持续进行的。定期安排你的病毒扫描器对系统进行完整扫描是一个好主。我建议每周扫描一次，最好是在没有人可能使用计算机的时间。\n\
  \n\n\n\n\n### 启发式扫描\n在上一节中简要提到了启发式扫描，它可能是病毒扫描最先进的形式。因为它使用规则来判断文件或程序的行为是否像病毒，因此，启发式扫描是发现未知病毒的最佳方法之一。新病毒不会出现在病毒定义列表中，所以你必须通过检查其行为来确定它是否为病毒。然而，这个过程并非万无一失。某些真实的病毒感染可能会被漏掉，而某些非病毒文件可能会被怀疑为病毒。\n\
  \n### 沙箱\n`sandbox`（沙箱）方法基本上涉及设立一个与操作系统隔离的独立区域，在其中运行下载的内容或附件。这样一来，如果它被感染了，也不会不会感染到操作系统。\n\
  \n### 机器学习\n大多数杀毒软件供应商现在都正致力于将基础的机器学习算法实现到它们的杀毒软件中。这使得杀毒软件能够适应不断变化的攻击。机器学习才刚刚开始使用，尚未发育完善。机器学习是反恶意软件领域一个日益增长的方面。\n\
  \n实现沙箱的一种方法是让操作系统留出一个受保护的内存区域来打开可疑文件并监控其行为。这并非 100% 有效，但比简单地在你的系统中打开文件并寄希望没有感染要安全得多。\n\
  \n一个相关的概念被称为“洗机”（sheep dip）机器。这在企业网络中非常有用。你建立一个与你的标准工作站配置相同的系统。然而，这台洗机是不联网的。可疑文件首先在系统上打开。然后对系统进行一段时间的监控以寻找感染迹。一旦文件通过了检查，就可以在正常的工作站上打开了。\n\
  \n在家庭或小型办公室执行此事的简单方法是在你的计算机上创建一个虚拟机，并首先在虚拟机中打开可疑附件或下载内容。这台虚拟机可以运行病毒扫描器。此外，你还可以更改虚拟机中的时间以检测逻辑炸弹。在将可疑文件带回主机计算机之前，让它在`VM`\
  \ 中停留一段时间。\n\n### 提示：大多数商业扫描器的工作原理\n大多数商业病毒扫描器使用多种方法，包括此处列出的大部分、甚至是全部方法。任何仅使用一种扫描模式的病毒扫描器从实际的病毒防御角度来看几乎都是毫无用处的。这些模式是扫描器无论其是使用启发式扫描、下载扫描、邮件扫描等时的工作方式：\n\
  \n#### 激活代码扫描\n现代网站经常嵌入激活代码，例如 `Java` applets 和 `ActiveX`。这些技术可以为任何网站提供一些惊人的视觉效果。然而，它们也可以作为恶意代码的载体。在这些对象下载到计算机之前对其进行扫描，是任何高质量病毒扫描器的基本功能。\n\
  \n#### 误报和漏报\n无论病毒扫描器的类型如何，任何杀毒软件偶尔都会出现错误。你应该关注两种类型的错误。你的杀毒软件可能会将一个合法程序误认为病毒。例如，你可能有一个程序旨在对\
  \ `Windows Registry` 进行某些调整，或扫描你的电子邮箱地址录。将合法程序误认为病毒被称为 `false positive`（误报）。你的杀毒软件也可能无法识别出病毒。这被称为\
  \ `false negative`（漏报）。减少漏报的最佳方法是保持你的杀毒软件更新更新。对于误报，建议仅对可疑病毒进行隔离，而不是自动删除它们。\n\n####\
  \ 商业杀毒软件\n今天有四个品牌的杀毒软件实际上主导了杀毒软件市场，提供商业扫描器的公司提供一个功能不如商业产品那么多的免费版本也是很常的。例如，`AVG AntiVirus`、`McAfee`、`Norton`、`Malwarebytes`\
  \ 是热门选择。\n\n### 防火墙\n`firewall`（防火墙）本质上是两台计算机或计算机系统之间的障碍。遇到防火墙最常见的地方是网络与外部世界之间。然而，个人计算机以及网络段之间的防火墙也很常见。至少，防火墙会根据某些参数（如数据包大小、源\
  \ IP 地址、协议和目标端口）过滤数据。`Linux` 和 `Windows`（从 `XP` 开始）自带了简单的防火墙。对于 `Windows`，`Windows\
  \ 7` 中的防火墙被扩展到可以处理入站和出站流量的过滤。`Windows 8` 和 `Windows 10` 的防火墙功能没有显著变化。你应该开启并配置你个人计算机的防火墙。\n\
  \n在组织环境中，你至少会在你的网络和外部世界之间想要一个专用的防火墙。这可能是一个带有内置防火墙功能的路由器（`Cisco Systems` 是一家以销售高质量路由器和防火墙而闻名的公司之一）。或者，它可能是一个专门运行防火墙软件的服务器。选择防火墙是一个重要的决定。如果你缺乏做出此类决策的专业知识，那么你应该安排顾问在在这方面为你提供帮助。\n\
  \n#### 防火墙的优点和局限性\n防火墙无论你得到的是什么类型（类型将在下一节中描述），基本上都是阻塞某些流量的工具。一组规则决定允许哪些流量进入以及阻塞哪些流量。显然，防火墙是你安全策略中的关键部分。我甚至无法想象出一个在没有防火墙的情况下运行系统的理由。然而，防火墙并不是安全的万灵药因为它无法阻止所有的攻击。例如，防火墙无法阻止你下载特洛马。它也无法阻止内部攻击。但防火墙可以是停止拒绝服务（DoS）攻击或防止黑客扫描你网络内部细节的极方法。\n\
  \n#### 防火墙类型和组件\n防火墙有许多类型及其变体。但大多数防火墙可以归类为以下三个防火墙家族之一：\n\n▪ 数据包检查\n\n▪ 状态检测检测\n\n\
  ▪ 应用\n\n接下来的章节将讨论每种类型并评估其优缺点。\n\n##### 数据包过滤\n\n\n\n\n\n# 简介\n\n基础数据包过滤是防火墙的最简单形式。它检查数据包并确认每个数据包是否符合防火墙规则。例如，数据包过滤防火墙通常考虑三个问题：\n\
  \n- 该数据包是否使用了防火墙允许的协议？\n- 该数据包的目标端口是否是防火墙允许的端口？\n- 数据包是否来自防火墙未封锁的 IP 地址？\n\n这些是三个非常基本的规则。某些数据包过滤防火墙会检查额外的规则。但它们不会检查来自同一源的前序数据包。本质上，每个数据包都被视为一个孤立的事件，而不参考之前的对话。这使得数据包过滤防火墙很容易受到某些\
  \ DoS 攻击，例如 `SYN floods`（SYN 洪水）。\n\n## 状态检测包检查\n\n任何状态检测包（`SPI`）防火墙都会检查每个数据包，不仅根据对当前数据包的检查，还根据来自会话之前数据包的数据来拒绝或允许访问。因此，防火墙能够感知特定包发送时的上下文。这使得此类防火墙对\
  \ ping 洪水和 SYN 洪水的抵抗力大大，并且不容易受到欺骗攻击。例如，如果防火墙检测到当前包是一个 `ICMP` 包，且有数千个数据包连续来自同一个源\
  \ IP，防火墙将看出这显然是一个 DoS 攻击，并将拦截这些包。\n\n状态检测包检查防火墙还可以查看数据包的实际内容，这允许某些非常高级的过滤功能。大多数高端防火墙使用状态检测包检查方法；如果可能，这是推荐的防火墙类型。\n\
  \n## 应用网关\n\n`application gateway`（也称为 `application proxy` 或 `应用级代理`）是运行在防火墙上的程序。当客户端程序（如网络浏览器）与目标服务（如\
  \ Web 服务器）建立连接时，它连接到应用网关或 `proxy`。然后，客户端与代理服务器协商以获得访问目标服务的权限。实际上，代理在防火墙后与目标建立连接并代表客户端操作，从而隐藏并保护防火墙后网络中的单个计算机。这个过程实际上创建了两个连接：客户端与代理服务器之间有一个连接，代理服务器与目标之间有另一个连接。\n\
  \n一旦建立连接，应用网关将做出关于转发哪些数据包的所有决策。由于所有通信都通过代理服务器进行，防火墙后的计算机受到了保护。\n\n本质上，应用防火墙用于特定类型的应用程序，例如数据库或\
  \ Web 服务器应用程序。它能够检查正在使用的协议（如 `HTTP`）是否存在任何异常行为，并阻止可能绕过其他类型防火墙的流量。应用防火墙同时包含状态检测包检查是常见的做法。\n\
  \n## 防火墙配置\n\n除了各种类型的防火墙，还有各种配置选项。防火墙的类型决定了它将如何评估流量，从而决定允许和不允许什么。配置让你了解该防火墙相对于其所保护的网络是如何设置的。防火墙的一些主要配置/实现包括：\n\
  \n- 网络主机级防火墙\n- 双主机主机\n- 基于路由器的防火墙\n- 屏障主机（Screened host）\n\n接下来的章节将讨论其中每一项。\n\n\
  ### 网络主机级防火墙\n\n`network host-based firewall` 是安装在具有现有操作系统的现有机器上的软件解决方案。使用这种类型防火墙最担心的问题是，无论防火墙解决方案有多好，它都取决于底层的操作系统。在这种情况下，托管防火墙的机器拥有经过加固的操作系统是至关重要的。\n\
  \n### 双主机主机\n\n`dual-homed host` 是在具有至少两个网络接口的服务器上的防火墙。该服务器充当网络与其连接的接口之间的路由器。为了使之正常工作，禁用了自动路由功能，这意味着来自互联网的\
  \ `IP` 包不会直接路由到网络。你可以选择路由哪些数据包以及如何路由它们。防火墙内部和外部的系统可以与双主主机通信，但不能相互直接通信。\n\n### 基于路由器的防火墙\n\
  \n如所述，你可以在路由器上实现防火墙保护。在具有多层保护的大网络中，这通常是第一层保护。虽然你可以在路由器上实现各种类型的防火墙，但最常用的类型是数据包过滤。如果你在家里或小型办公室使用宽带连接，可以获取一个数据包过滤防火墙路由器来替代宽带公司提供的基础路由器。近年来，基于路由器的防火墙变得越来越常见，事实上它们是目前最常用的防火墙类型。\n\
  \n### 屏障主机\n\n`screened host` 实际上是防火墙的组合。在这种配置中，你使用 `bastion host`（堡垒主机）和 `screening\
  \ router`（过滤路由器）的组合。过滤路由器通过允许拒绝或允许来自堡垒主机的某些流量来增加安全性。它是流量的第一站，只有在过滤路由器允许通过时，流量才能继续。\n\
  \n### 应用和电路级网关\n\n应用和电路级网关防火墙设计都位于客户端和 Web 服务器之间，并代表客户端与服务器通信。它们代替对方并可用于缓存频繁访问的页面。应用级网关增加了安全性并防止直接进入或退出网络。电路级网关工作在\
  \ OSI 模型的会层，可以监控 `TCP` 包。应用层防火墙可以在应用层检查包。应用层防火墙还可以过滤特定的应用程序命令并配置为 Web 代理。\n\n##\
  \ Web 应用防火墙\n\nWeb 应用防火墙（`WAF`）顾如其义专门用于保护网站。它将防止常见的网络攻击，如 `SQL Injection`（SQL 注入）、`Cross\
  \ Site Scripting`（跨站脚本）、`Parameter tampering`（参数篡改）等。Cloudflare 表示：“WAF 或 Web 应用防火墙通过过滤\
  \ Web 应用程序与互联网之间的 HTTP 流量来帮助保护应用程序。它通常保护应用程序免受跨站伪造、跨站脚本 (XSS)、文件包含和 SQL 注入等攻击。WAF\
  \ 是一种协议层 7 防御，并非设计用于防御所有类型的攻击。这种攻击缓解方法通常是工具包的一部分，这些工具共同构成了针对各种向量的整体防御。”\n\n## NGFW\n\
  \n下一代防火墙（Next Generation Firewall）是一个通用术语，指包含额外功能的状态检测包防火墙，例如集成了入侵检测系统、应用网关功能和深层数据包检测。\n\
  \n## 黑名单/白名单\n\n\n\n\n大多数防火墙允许你在黑名单或白名单之间进行选择。黑名单是一种安全策略，允许用户访问任何网站或互联网资源，但禁止列表上的资源除外。该列表就是黑名单。这种方式是非常宽松的，用户仅被阻止访问特定列表上的站点。\n\
  \n白名单则涉及防止用户访问批准列表上资源以外的任何互联网资源。该列表被称为白名单。白名单比黑名单要严格得多，因此也更安全。黑名单的问题在于，你无法知道并列出用户不应该访问的每一个网站。无论黑名单做得多详尽，它都会允许流量通过某些不应允许的站点。白名单要安全得多，但用户友好性较低。\n\
  \n## 商业与免费防火墙产品\n\n市上有多种商用防火墙产品，其中一些是免费的。如果你需要的只是一个基础的数据包过滤解决方案，你可以从许多软件供应商那里找到此类解决方案。主要的杀毒软件供应商（包括本章之前提到的供应商）通常将防火墙软件作为杀毒软件的捆绑选项。其他公司，如\
  \ `Zone Labs`，销售防火墙和入侵检测系统（`IDSs`）。主要的路由器和集线机制造商，如 `Cisco Systems`，也提供防火墙产品。你需要多大的安全性很难确定。最低限的建议是在你的网络和互联网之间设置一个数据包过滤防火墙/代理服务器——但这只是最低限。\n\
  \n### ZoneAlarm\n\n`Zone Labs` 提供了 `ZoneAlarm Security Suite`，它提供了完整互联网安全所需的所有工具。它提供了一个免费的个人防火墙解决方案（[`www.zonealarm.com/software/free-firewall/`](https://www.zonealarm.com/software/free-firewall/)）。\n\
  \n### Windows 10 Windows Defender 防火墙\n\nWindows 10 自带了一个功能完整的防火墙，称为 `Windows Defender\
  \ Firewall`。（事实上，Windows 多年来一直带有防火墙。）`Windows Defender Firewall` 可以阻止入站和出站数据包。要访问它，点击开始按钮并输入\
  \ `Firewall`。图 9.1 显示了 `Windows Defender Firewall`。\n\n![Description: 显示了 windows\
  \ defender 防墙。](img/09fig01.jpg)\n\n**图 9.1** *Windows 10 Windows Defender 防火墙。*\n\
  \n注意 `Windows Defender Firewall` 看起来与 `Windows Server 2012`、`2016` 和 `Server 2019`\
  \ 中的防火墙非常相似，但它与 `Windows 7` 和 `10` 中的防火墙不同。\n\n从 `Windows Server 2008` 开始及其后的所有版本，Windows\
  \ 都包含了状态检测防火墙。通过 Windows 10 的 `Windows Defender Firewall`，你可以为出站和入站流量设置不同的规则。例如，你的标准工作站可能会允许端口\
  \ 80 的出站 HTTP 流量，但你可能不想允许入站流量（除非你在该工作站上运行 Web 服务器）。\n\n你还可以为端口、程序、自定义规则或微软允许你选择的许多预定义规则之一设置规则。你不仅可以选择允许或阻止连接，还可以选择仅在连接被\
  \ `IPsec` 安全时才允许。这意味着对于任何连接你有三个选项。\n\n规则可以允许或阻止特定的应用程序或端口。你还可以为入站和出站流量设置不同的规则。规则允许你决定特定类型的通信是被阻止还是被允许。你可以为入站和出站流量设置不同的设置。你可以为单个端口（所有\
  \ 65,554 个可用网络端口）和应用程序设置规则。Windows 10 防火墙中的规则赋予了很大的活性。\n\n最重要的是，你可以根据流量来源以不同的应用规则。你可以为三个区域或配置文件设置规则：\n\
  \n- **域 (Domain)：** 针对在你的域上通过验证的计算机。\n\n- **公共 (Public)：** 针对网络外部的计算机。你对待外部流量会比对待来自域内其他机器的流量更加谨慎。\n\
  \n- **专用 (Private)：** 专用指的是来自你自己的计算机流量。\n\n### 防火墙日志\n\n防火墙是试图确定事件发生后情况的佳工具。几乎所有的防火墙无论类型或实现方式都会记录活动。这些日志可以提供价值信息，帮助确定攻击源、攻击方法以及可能有助于定位攻击者或至少防止使用相同技术进行未来攻击的其他数据。任何具有安全意识的网络管理员都应该将检查防火墙日志养成常规习惯。\n\
  \n### 反间谍软件\n\n正如本书早期所讨论的，反间谍软件会扫描你的电脑，检查机器上是否运行了间谍软件。这是计算机安全软件的一个重要元素，曾一度很大程度上被忽视。即使在今天，还没有足够的人重视间谍软件或对其防范。大多数反间谍软件的工作原理是检查系统是否存在已知的间谍软件文件。每个应用程序只需与已知的间谍软件列表进行比对。这意味着你必须维护某种订阅服务，以便获取间谍软件定义列表的例行更新。大多数杀毒解决方案现在也会检查间谍软件。\n\
  \n在当今的互联网环境下，运行反间谍软件与运行杀毒软件一样本质。未能这样做可能会导致严重后果。个人数据，可能还有敏感的业务数据，可以在你不知情的情况下从你的组织泄露。而且，正如本书早期指出的，间谍软件完全可以是有有意的工业间谍活动的工具。\n\
  \n除了使用反间谍软件，或者即使与此类软件配合，你也可以像上一章讨论的那样通过浏览器的设置来保护自己。此外，书中多次警告你对附件和下载下载要谨慎。你还应该避免下载各种互联网“增强功能”，如皮肤和工具栏。\n\
  \n### IDS\n\n在过去的几年中，IDS 变得越来越流行。基本上，IDS 检查机器/防火墙/系统的所有入站和出站活动，寻找可能指示入侵尝试的模式。例如，如果\
  \ IDS 发现向每个端口顺序发送了一系列 `ICMP` 数据包，这可能表明系统正在被网络扫描软件（如 `Cerberus`）扫描。这种扫描通常是尝试破解系统安全的预奏，了解有人正在执行渗透性步骤是非常重要的。\n\
  \n关于 IDS 如何工作，已经有整卷著作。本章无法涵盖那么多信息。然而，对这些系统的工作原理有一个基本概念是非常重要的。\n\n接下来的章节将首先检查 IDS\
  \ 倾向于分类的大类，然后查看某些特定的 IDS 方法。\n\n#### IDS 分类\n\n有多种方法对 IDS 进行分类。常见的 IDS 分类如下：\n\n\
  - 被动 IDS (Passive IDSs)\n\n- 主动 IDS（也称为入侵防御系统，即 `IPSs`）\n\n##### 被动 IDS\n\n\n\n\n\
  \n被动式 IDS 仅监控可疑活动并对其进行记录。在某些情况下，IDS 可能会通知管理员相关活动。这是最基础类型的 IDS。任何现代系统至少应该配备带有防火墙、防病毒软件和其他基础安全措施的被动式\
  \ IDS。\n\n## 主动式 IDS\n\n主动式 IDS 也称为 IPS（入侵预防系统），它多了一个步骤：关闭可疑通信。使用 IDS 还是 IPS 是一个在进行彻底风险分析后必须做出的决策。\n\
  \n就像防病毒软件一样，IDS 也可能出现误报（false positive）。它可能误认为某些内容是攻击，而实际上它是合法流量。想象一个主动式 IDS 正在通过阈值监控来判断是否发生了攻击。某个用户通常在早上\
  \ 8 点到下午 5 点之间工作，且使用的带宽较小。如果 IDS 在晚上 10 点检测到该用户使用了其正常带宽的 10 倍，它可能会认为这是一次攻击并关闭违规流量。然而，后来可能会发现，这只是一个合法用户正在为了第二天要交付给客户的关键项目而加班，而\
  \ IPS 阻止了该事件的发生。这就是误报。\n\n这是考虑风险分析的绝佳位置。在决定你的组织适用于被动式 IDS 还是 IPS 之前，你必须权衡误报风险与允许攻击在未被检测到的情况下继续进行的风险。通常情况下，不同的网段会有不同的风险特征。你可能会发现，被动式\
  \ IDS 适用于你的大部分网络，但最敏感的网段则需要 IPS。\n\n### 识别入侵\n\n识别入侵实际上有两种方法。第一种方法是基于签名的（signature\
  \ based）。这与防病毒软件使用的签名相似。然而，IDS 签名涵盖了恶意软件之外的问题。例如，某些 DoS 攻击具有可以识别的特定签名。\n\n第二种方法是统计异常（statistical\
  \ anomaly）。本质上，任何看起来超出正常参数、且超出给定参数足够远以极可能是攻击的活动都会被识别为可能的攻击。任何活动都可能触发此类告警，例如带宽利用率突然增加或用户账户访问了它们从未访问过的资源。\n\
  \n大多数 IDS 同时使用这两种形式的攻击识别。选择 IDS 的两个实际问题是它的易用性和它的签名数据库。当然还有其他考虑因素，如价格，但易用性和签名数据库是决定\
  \ IDS 最重要的因素。\n\n### IDS 元素\n\n无论是主动式 IDS 还是被动式 IDS，无论是商业还是开源，所有 IDS 都有某些共同的元素/术语：\n\
  \n- `sensor`（传感器）是收集数据并将其传递给分析器分析的 IDS 组件。\n- `analyzer`（分析器）是分析传感器收集数据的组件或进程。\n\
  - `manager`（管理器）是用于管理的 IDS 接口。它是 IDS 的软件组件。\n- `operator`（操作员）是主要负责 IDS 的人员。\n-\
  \ `Notification`（通知）是 IDS 管理器让操作员意识到告警的过程或方法。\n- `activity`（活动）是数据源中操作员感兴趣的元素。它可能是可能的攻击，也可能不是。\n\
  - `event`（事件）是任何被认为可疑且可能的攻击的活动。\n- `alert`（告警）是来自分析器的消息，表示事件已发生。\n- `data source`（数据源）是\
  \ IDS 分析以判断是否发生事件的原始信息。\n\n所有这些元素都是 IDS 的一部分，并共同工作捕获流量、分析流量并向 IDS 操作员报告异常活动。IPS\
  \ 具有额外的元素，使其能够关闭违规流量。\n\n### Snort\n\n许多供应商提供 IDS，每种都有独特的优缺点。哪种系统最适合你的环境取决于许多因素，包括网络环境、所需的安全级别、预算限制以及直接操作\
  \ IDS 的人员的技能水平。一个流行的开源 IDS 是 Snort，可以从 [www.snort.org](http://www.snort.org) 免费下载。\n\
  \n我们在本节中简要检查 Snort。虽然它不是唯一的 IDS，但它是免费的，这使其对许多人来说是一个非常有吸引力的选择。介绍 Windows 版 Snort\
  \ 的基本配置。\n\n首先，你必须访问 [www.snort.org](http://www.snort.org) 并注册（免费）。然后下载 Snort 安装程序和最新的规则。确保你下载的是具有\
  \ `.exe` 扩展名的安装程序。`.rpm` 扩展名用于 Linux。此外，我发现某些版本的 Microsoft Internet Explorer 与 Snort\
  \ 网站兼容性不佳，因此建议使用 Mozilla Firefox 等替代浏览器。\n\n一旦你下载了规则和安装程序，就开始安装。大部分操作都非常简单。有一个屏幕会询问你是否希望支持数据库连接。对于大多数运行情况，你可能希望将\
  \ Snort 记录转储到某些数据库中。然而，为了演示目的，请选择 `I Do Not Plan to Log to a Database`。图 9.2 显示了安装选项。\n\
  \n![Description: 显示了 snort 安装选项。](img/09fig02.jpg)\n\n**图 9.2** `Snort` 安装选项。\n\n\
  除此之外，只需使用所有默认设置。在最后，安装程序还会尝试安装 WinPCAP。如果出于某种原因失败，你需要单独下载并安装它。WinPCAP 是一个捕获数据包的开源工具，所有的\
  \ IDS 都依赖于数据包捕获。\n\n将你下载下载的规则复制到 `C:\\snort\\rules` 后，你需要将配置文件从 `C:\\snort\\rules\\\
  etc\\snort.conf` 复制到 `C:\\snort\\etc`。使用 WordPad 打开该配置文件，不要用记事本。（记事本不支持自动换行，阅读配置会有困难。）\n\
  \n你需要将 `HOME_NET` 的 `any` 更改为你机器的 IP 地址，如 图 9.3 所示。在实际情况下，你还会设置其他 IP 地址（用于 Web 服务器、SQL\
  \ 服务器、DNS 服务器等）。\n\n![Description: 显示了 snort 配置文件的语法。](img/09fig03.jpg)\n\n**图 9.3**\
  \ *HOME_NET 地址。*\n\n现在你需要找到并更改规则路径，这些是 Linux 风格的路径，如 图 9.4 所示。\n\n![Description:\
  \ 给出了 Linux 风格路径的语法，其读取如下：规则文件的路径（可以是相对路径）；对于 Windows 用户：建议你使用绝对路径，例如 `c:\\snort\\\
  rules var RULE_PATH ../rules var SO_RULE_PATH ../so_rules var PREPROC RULE PATH\
  \ ../preprocrules.`](img/09fig04.jpg)\n\n**图 9.4** *Linux 路径。*\n\n你需要将它们更改为 Windows\
  \ 风格路径，如 图 9.5 所示。\n\n![Description: Windows 风格路径的语法读取如下：var RULE_PATH c:\\snort\\\
  rules; var SO_RULE_PATH c:\\snort\\rules\\so_rules; var PREPROC RULE PATH c:\\snort\\\
  rules\\preprocrules.](img/09fig05.jpg)\n\n**图 9.5** *Windows 路径。*\n\n现在你需要找到并更改库路径。这有点困难，因为\
  \ Windows 下的路径和文件名有所不同。Linux 风格的库路径看起来像 图 9.6 所示。\n\n\n\n\n\n![Description: 这里给出了\
  \ Linux 风格库路径的语法，读取如下：动态预处理器库路径，动态预处理器目录 `/usr/local/lib/snort_dynamicpreprocessor/`；基础预处理器引擎动态引擎\
  \ `/usr/local/lib/snort_dynamicengine/libsf_engine.so` 的路径；动态规则库路径 # dynamicdetection\
  \ 目录 `/usr/local/lib/snort_dynamicrules.](img/09fig06.jpg)\n\n**图 9.6** Linux 风格库路径。\n\
  \n你可以通过查看图 9.7 所示文件夹找到你的 Windows 路径和文件名。\n\n![Description: 截图显示了从网关 C 目录目录两个文件夹。snort_dynamicengine\
  \ 和 snort_dynamicpreprocessor 两个文件夹位于 snort 库下。](img/09fig07.jpg)\n\n**图 9.7** Windows\
  \ 风格库路径。\n\n#### 注意\n\n如果你发现系统中没有某个特定的文件或路径，只需确保它在配置文件中已注释掉。\n\n你必须找到引用数据并将其从 Linux\
  \ 风格路径更改为 Windows 风格路径，如图图 9.8 所示。\n\n![Description: 引用的语法如下：元数据引用日期。不要修改这些行；包含\
  \ CA5nortNetcNclammification.config；包含 Ct1SnortNeteNreferenee.config。](img/09fig08.jpg)\n\
  \n**图 9.8** 引用路径。\n\n你几乎已经完成了。现在请搜索此内容：\n\n```\n#output log_tcp dump\n```\n\n并在其之后添加此行：\n\
  \n```\noutput alert_fast: alert.ids\n```\n\n#### 注意\n\n井号 (`#`) 表示注释。\n\n现在你需要使用命令行来启动\
  \ Snort。只需导航到 `C:\\snort\\bin` 即可。启动 Snort 有多种方法。许多常用方法列在表 9.1 中。我建议你先尝试最简单的一种。\n\
  \n**表 9.1** Snort 命令\n\n![Images](img/09tab01.jpg)\n\nSnort 是免费且开源的，但许多人在刚开始使用时会遇到很大困难。配置文件或命令行启动中的微微错误都会导致其无法正常运行。本节的目的仅仅是向你介绍\
  \ Snort。有关 Snort 的更多信息，请访问以下网站：\n\n▪ **Snort 手册:** [`manual-snort-org.s3-website-us-east-1.amazonaws.com/`](http://manual-snort-org.s3-website-us-east-1.amazonaws.com/)\n\
  \n▪ **编写 Snort 规则:** [`paginas.fe.up.pt/~mgi98020/pgr/writing_snort_rules.htm+`](http://paginas.fe.up.pt/~mgi98020/pgr/writing_snort_rules.htm+)\n\
  \nSnort 规则可以从 [`www.snort.org/downloads#rules`](https://www.snort.org/downloads#rules)\
  \ 下载，它们由两部分组成：\n\n▪ **规则头 (Rule header):** 这是识别规则动作的地方。\n\n▪ **规则选项 (Rule options):**\
  \ 这是识别规则告警消息的地方。\n\n这是一个示例规则：\n\n```\nAlert tcp any any -> any 80 (content: “attackdetected”;\
  \ msg: “Looks like\nan attack”、)\n```\n\n到第一个括号之前的文本是规则头。第一部分被称为规则动作 (rule action)。`Alert`\
  \ 是上述示例规则中使用的动作；规则动作可以包括：\n\n▪ Alert\n▪ Log\n▪ Pass\n▪ Activate\n\n下一个项目是协议。在示例中使用的是\
  \ `TCP`。协议之后是源地址和掩码。虽然示例使用了 `any`，但可以是特定的网络，如 `192.168.1.0/16`。之后是目标 IP 地址和掩码，同样可以是\
  \ `any`。规则头的最后一个条目指定了端口，这里是 `80`。\n\n### 蜜罐\n\n蜜罐 是一项有趣的技术。蜜罐实现了两个目标：首先，它将攻击者的注意力从数据转移开；其次，它提供了看似价值的数据，让你追踪攻击者。蜜罐可以是低交互和高交互的。低交互蜜罐通过模拟单个系统上的服务和程序来工作。如果攻击者执行了模拟未预期的操作，蜜罐就会生成错误。\n\
  \n高交互蜜罐完美地模拟了系统或网络。其想法是创建一个受控区域，让攻击者与真实的应用程序交互。高交互蜜罐依赖边界设备来控制流量，以便攻击者进入，但出站活动受到严格控制。\n\
  \n你可能发现 [www.honeypots.org](http://www.honeypots.org) 有更多关于蜜罐和特定实现的信息。\n\n### 数据库监控\n\
  \n数据库监控 (DAM) 涉及独立于数据库管理系统 (DBMS) 的数据库活动。它与数据库审计、日志记录和监控分离。数据库监控与防御 (DAMP) 是 DAM\
  \ 的扩展，除了监控和告警，还可以阻止未经授权。\n\nGartner 对 DAM 提供了一个非常好的描述：\n\n“数据库监控 (DAM) 指一组工具，用于识别和报告欺诈、非法或其他不良行为，且对用户操作和生产力的影响最小。这些工具已从对关系型数据库管理系统\
  \ (RDBMS) 内部及其周围活动的基本分析，演变为涵盖更全面的功能，如发现和分类、漏洞管理、应用级分析、入侵防御、非结构化数据安全支持、身份访问管理集成以及风险管理支持。”\n\
  \n数据库监控通常通过两种方法之一进行。第一种是基于内存的。在基于内存场景中，DAM 本质上向数据库附加一个轻量级传感器并持续轮询系统以收集正在执行的 SQL\
  \ 语句。第二种方法是分析数据库事务日志。两种情况下，系统都在检查目标系统上执行了哪些 SQL 语句。\n\n\n\n\n\n安全信息和事件管理（SIEM）是一种帮助协调网络上安全活动的系统。SIEM\
  \ 的理念是聚合来自你所有安全系统（如`Firewalls`、`IDS`、`IPS`等）的日志，然后对这些日志进行监控和扫描。大多数安全人员都能证明分析日志的困难。日志会变得庞大且难以审查。拥有一个能够审查你所有日志并在需要你直接关注时发出警报的系统，可以使安全管理变得更加高效。\n\
  \n2022 年《CSO》杂志上的一篇文章^(4) 将 SIEM 描述为：“安全信息和事件管理（SIEM）工具收集并聚合日志和事件数据，以帮助识别和跟踪入侵。它们是强大的系统，既让企业安全专业人员洞察其\
  \ IT 环境当前正在发生什么情况，又能提供过去发生的相关事件的记录。”\n\n^(4) [`www.csoonline.com/article/2124604/what-is-siem-security-information-and-event-management-explained.html`](https://www.csoonline.com/article/2124604/what-is-siem-security-information-and-event-management-explained.html)\n\
  \n## 其他预防性技术\n\n除了 `IDS`、`antivirus`、`firewalls` 和 `honey pots` 之外，管理员还可以使用各种预防性技术来尝试减少针对网络执行成功攻击的概率。\n\
  \n### 入侵偏离\n\n`Intrusion deflection`（入侵偏离）在具有安全意识的管理员中变得越来越流行。它的本质非常简单：试图吸引入侵者进入一个为了观察入侵者而设置的子系统。这是通过欺骗入侵者使其认为他已成功访问系统资源来实现的，而实际上他被引导了一个专门设计的环境。能够在入侵者展示其技艺时对其进行观察，可以获得宝贵的线索并可能导致其被捕。\n\
  \n入侵偏离通常通过使用 `honey pot` 来。基本上，你设置了一个虚假系统，可能是一个看起来像整个子网的服务器。你通过可能让它看起来包含敏感数据（如人员文件）或贵贵数据（如账户号码或研究数据）来让该系统看起来非常有吸引力。存储在该系统中的实际数据是虚假的。该系统的真实目的是仔细监控任何访问系统的人的活动。由于没有合法用户访问此系统，因此可以确定访问它的人都是入侵者。\n\
  \n### 入侵威慑\n\n`Intrusion deterrence`（入侵威慑）涉及简单地尝试让系统看起来像是一个不太容易手的的目标。简而言之，试图让任何成功入侵尝试的潜在回报看起来比其价值更困难。这种方法包括一些策略，例如尝试通过伪装降低系统的表面价值，这本质上意味着努力隐藏系统最有价值的。该方法论中的另一种策略涉及提高潜在入侵者被捕获的感知风险。这可以通过多种方式实现，包括显眼地显示警告以及警告正在进行监控。即使实际系统的安全性没有得到提高，对系统安全性的感知也可以得到极大提升。\n\
  \n## 身份验证\n\n当用户登录系统时，系统需要对其进行身份验证（有时用户也需要进行身份验证）。有许多身份验证方法，一些常见的包括：\n\n- `PAP`：密码认证协议是最简单且最不安全的形式。用户名和密码以未加密的形式发送。\n\
  - `CHAP`：挑战握手协议是 `PAP` 的扩展，它对身份验证进行了加密。步骤如下：\n    1. 验证者向对端发送挑战消息。\n    2. 对端使用计算出的哈希值进行响应。\n\
  \    3. 验证者根据自己的哈希值对响应进行检查。如果值匹配，则确认身份验证；否则应终止连接。\n    4. 验证者以随机的时间间隔发送新的挑战。\n-\
  \ `SPAP`：安全密码认证协议由微软开发。它加密了身份验证过程。\n- `EAP`：可扩展身份验证协议是一个经常用于无线和点对点连接的框架。它最初在 `RFC3748`\
  \ 中定义，并在之后进行了更新。\n- `LEAP`：轻级可扩展身份验证协议由思科开发，已在无线网络中广泛使用。它受微软 Windows 的支持，并使用 `MS-CHAP`\
  \ 的修改版本。\n- `EAP-TLS`：可扩展身份验证协议–传输层安全使用 `TLS` 来确保身份验证过程的安全。大多数实现利用 `X.509` 数字证书。\n\
  - `PEAP`：保护的可扩展身份验证协议通过经过身份验证的 `TLS tunnel` 加密身份验证过程。它由包括思科、微软和 RSA Security 在内的联盟开发。它首次包含在\
  \ Windows XP 中。\n- `Kerberos`：Kerberos 被广泛使用，特别是在微软操作系统中。它发明于麻理工学院（MIT），名称源于传说中据守冥界之门的三头狗。该系统有点复杂，但基本过程如下：\n\
  \    1. 当用户登录时，身份验证服务器验证用户的身份，然后联系票据发放服务器（这些服务器通常在同一机器上）。\n    2. 票据发放服务器向用户机器发送一个加密的票据。该票据标识用户已登录。\n\
  \    3. 稍后当用户需要访问网络上的某些资源时，用户机器使用该票据获取访问目标机器的权限。对票据有大量的验证，而且这些票据在相对短的时间内过期。\n\n\
  ###更多关于 Kerberos\n\n由于 `Kerberos` 被如此广泛使用，它比其他身份验证方法值得更仔细的研究。在本节中，我们将更深入地查看 `Kerberos`。如果这是你第一次接触\
  \ `Kerberos`，你可能需要多次阅读这一节才能真正理解。虽然存在变体，但基本过程如图 9.9\n\n**图 9.9** *Kerberos.*\n\n\n\
  \n\n\n- **主体 (Principal):** Kerberos 可以为其分配票据的服务器或客户端。\n- **认证服务器 (AS):** 授权主体并将其连接到票据颁发服务器的服务器。\n\
  - **票据颁发服务器 (TGS):** 提供票据的服务器。\n- **密钥分发中心 (KDC):** 提供初始票据并处理 TGS 请求的服务器。通常同时运行\
  \ `AS` 和 `TGS`。需要注意的是，Kerberos 是使用最广泛的认证协议之一。欧洲经常使用另一种替代方案 `SESAME`（用于多供应商环境应用程序的专用欧洲系统）。\n\
  \n## 深入了解 Kerberos\n\n本节提供了对 Kerberos 更详尽的理解。该过程的大部分由用字母表示的消息组成，这些消息在客户端和密钥分发中心（`KDC`）之间发送。首先，`AS`\
  \ 通过创建用户密码的哈希值生成一个秘密密钥，然后向客户端发送两条消息：\n\n- **消息 A：** 这是客户端/TGS 会话密钥，使用客户端秘密密钥加密。\n\
  - **消息 B：** `TGT` 包含客户端 ID、客户端网络地址和有效期。\n\n消息使用 `AS` 生成的密钥进行加密。然后用户尝试使用客户端通过哈希用户输入的密码生成的秘密密钥来解密\
  \ `Message A`。如果输入的密码与 `AS` 在数据库中找到密码不匹配，则哈希值不匹配，解密将失败。如果解密成功，`Message A` 包含客户端/TGS\
  \ 会话密钥，该密钥可与 `TGS` 通信。`Message B` 使用 `TGS` 秘密密钥加密，客户端无法解密。（注意，密码永远不会在网络上传输。）\n\n\
  在请求服务时，客户端向 `TGS` 发送以下消息：\n\n- **消息 C：** 这条消息由 `Message B` 中的 `TGT` 和请求服务的 ID 组成。\n\
  - **消息 D：** 这条消息是一个验证者（由客户端 ID 和时间戳组成），使用客户端/TGS 会话密钥加密。\n\n在接收 `Messages C` 和 `Message\
  \ D` 后，`TGS` 从 `Message C` 中提取出 `Message B`。它使用 `TGS` 秘密密钥解密 `Message B`。这使其获得了客户端/TGS\
  \ 会话密钥。使用该密钥，`TGS` 解密 `Message D`（验证者）并向客户端发送以下两条消息：\n\n- **消息 E：** 这是客户端到服务器票据（包含客户端\
  \ ID、客户端网络地址、有效期和客户端/服务器会话密钥），使用服务的秘密密钥加密。\n- **消息 F：** 这是使用客户端/TGS 会话密钥加密的客户端/服务器会话密钥。\n\
  \n在从 `TGS` 接收到 `Messages E` 和 `Message F` 后，客户端就有足够的信息向服务服务器（`SS`）认证。客户端连接到 `SS`\
  \ 并发送以下 `Message E`（使用服务秘密密钥加密的客户端到服务器票据）以及新消息：\n\n- **消息 G：** 这是新的验证者，包含客户端 ID\
  \ 和时间戳，并使用客户端/服务器会话密钥加密。\n\n`SS` 使用其自身的秘密密钥解密 `Message E` 以获取客户端/服务器会话密钥。使用会话密钥，`SS`\
  \ 解密 `Message G` 并向客户端发送以下消息以确认其真实身份和为客户端服务的意愿：\n\n- **消息 H：** 这是客户端验证者中的时间戳。\n\n\
  客户端使用客户端/服务器会话密钥解密确认信息（`Message H`）并检查时间戳是否正确。如果是，客户端就可以信任该服务器并开始向服务器发出服务请求。然后服务器向客户端提供请求的服务。\n\
  \n是的，这个过程确实相当复杂——这是刻意设计的。然而，你可能已经使用过很多次这种认证方法，即使你并没有意识到。它非常常见。\n\n## 数字证书\n\n你很可能以前听过\
  \ `digital certificate` 这个术语。你可能第一个好奇的是数字证书的作用是什么？回想我们在第 8 章中关于非对称加密以及“加密”的讨论。我们提到公钥可以广泛传播，因为它只能用于加密向我们发送的消息。那么，如何向人们提供公钥呢？最常见的方法是通过数字证书。数字证书包含用户的公钥和其他信息。然而，数字证书可以提供更多内容。它可以提供一种手段，证明证书持有者确实其所声称的人。\n\
  \n`X.509` 是数字证书格式和包含信息的国际标准。`X.509` 是世界上最常见的数字证书类型。它是一种数字文档，包含由受信任的第三方（称为证书颁发机构或\
  \ `CA`）签名的公钥。\n\n以下是 `X.509` 证书的基本项目，尽管可能包含其他可选信息：\n\n- **版本：** 此证书遵循的 `X.509` 版本。\n\
  - **证书持有者公钥：** 这是从 `X.509` 证书获取某人公钥的主要方法。\n- **序列号：** 这是该证书的唯一标识符。\n- **证书持有者属性：**\
  \ 这通常是与证书相关的域名或电子邮件地址。\n- **证书有效期：** 一年是最常见的有效期。\n- **颁发者唯一名称：** 这是颁发此证书的证书机构。\n\
  - **颁发者数字签名：** 该字段和下一个字段用于验证证书。\n- **签名算法标识符：** 标识所使用的数字签名算法。\n\n让我们看看这在常见场景中是如何工作的。假设你访问银行的网站。为了获取银行的公钥，你的浏览器将下载该银行的数字证书。但存在一个问题：是否有人建立了一个假网站，声称是你的银行？那个人是否也生成了一个声称是银行的假证书？是的，这是可能的。这就是数字证书帮助我们的地方之一。你的浏览器将查看证书上列出的颁发者，并首先询问其是否为你浏览器信任的\
  \ `CA`。如果是，浏览器将与该 `CA` 通信以获取该 `CA` 的公钥。（回想[第 8 章](#ch08.xhtml#ch08），数字签名是用私钥创建并用公钥验证的。）浏览器使用该\
  \ `CA` 公钥验证证书上的 `CA` 签名。如果这是一个假证书，数字签名将无法识别。这意味着证书不仅为你提供了证书持有者的公钥，还为你提供了一种通过受信任的第三方验证该实体的方法。\n\
  \n需要注意的是，与 `X.509` 证书不同，`PGP`（优隐私）证书不由 `CA` 颁发，且没有第三方验证机制。它们通常只用于电子邮件通信。这是因为假设你知道正在给谁发邮件，因此不需要验证该身份。\n\
  \n还有一些与数字证书相关的术语和概念你需要熟悉。让我们从 `CA` 开始，它是向你颁发数字证书的实体。`Comodo`、`Symantec`、`DigiCert`、`GoDaddy`、`Verisign`\
  \ 和 `Thawte` 都是著名的证书颁发机构。当你从这些供应商处购买证书时，它会会验证你的身份。（这可能简单地将你的信用卡号与购买证书的域名相匹配，也可能复杂得多。）\n\
  \n\n\n\n\n由于验证用户可能非常耗时，许多证书颁发机构（CA）会将该过程交给注册机构（RA），由 RA 通知 CA 是否颁发证书。\n\n`CRL`（证书吊销列表）是由\
  \ CA 颁发的不再生效的证书列表。CRL 主要通过两种方式分发：在推模式模型中，CA 定期自动发送 CRL；在拉取模型中，想要查看并验证证书的用户会从 CA\
  \ 处下载 CRL。问题在于 `CRL` 不涉及实时检查。因此，更新颖的解决方案是“在线证书状态检查协议” `OCSP`；其核心思想是使用一种协议来实时检查证书是否仍然有效。\n\
  \n# SSL/TLS\n\n银行网站和电子商务使用了哪种加密技术？通常情况下，对称算法速度更快，且只需要较短的密钥长度即可达到与非对称算法同等的安全性。然而，存在如何安全交换密钥的问题。大多数电子商务解决方案都使用非对称算法来交换对称密钥，然后使用这些对称密钥来加密数据。\n\
  \n当访问以 `HTTPS` 开头而非 `HTTP` 的网站时，`S` 代表“Secure”（安全）。这意味着你的浏览器和 Web 服务器之间的流量是加密的——通常使用\
  \ `SSL`（安全套接层）或 `TLS`（传输层安全）。`SSL` 和 `TLS` 都是非对称系统。\n\n`SSL` 是这两种技术中较老的一种，用于通过公钥加密实现传输层安全。`SSL`\
  \ 由 Netscape 开发，旨在通过互联网传输私有文档。按照惯例，需要 `SSL` 连接的 URL 以 `https` 而非 `http` 开头。它经历了多个版本：\n\
  \n* 未发布的 v1 (Netscape)\n* 第 2 版本，于 1995 年发布（存在许多缺陷）\n* 第 3 版本，于 1996 年发布 (RFC 6101)\n\
  * 标准 `TLS1.0` (RFC 2246)，于 1999 年发布\n* `TLS 1.1`，于 2006 年 4 月在 `RFC 4346` 中定义\n\
  * `TLS 1.2`，于 2008 年 8 月在 `RFC 5246` 中定义（并基于早期的 `TLS 1.1` 规范）\n* `TLS 1.3`，于 2018\
  \ 年 8 月在 `RFC 8446` 中定义\n\n图 9.10 显示了建立 `SSL/TLS` 连接的基本过程。\n\n![描述：显示了客户端、证书颁发机构和服务器之间建立\
  \ SSL/TSL 连接的步骤。](img/09fig10.jpg)\n\n**图 9.10** *SSL/TLS.*\n\n注意，步骤 3 实际上并不与证书颁发机构进行通信。计算机通常有一个证书存储，其中包含了已知且信任的证书颁发机构的数字证书。因此，客户端只需在其自己的证书存储中检查\
  \ `CA` 证书即可。\n\n该过程涉及几个复杂的步骤，定义如下：\n\n1. 客户端发送有关其加密能力的服务器信息，包括它能够支持的算法、可以用于消息完整性的哈希算法以及相关信息。\n\
  2. 服务器通过选择客户端和服务器都能支持的最佳加密和哈希算法进行响应，并将此信息发送给客户端。服务器还会发送自己的证书；如果客户端请求需要客户端身份验证的服务器资源，服务器会请求客户端的证书。\n\
  3. 客户端使用服务器发送的信息来验证服务器。这意味着通过适当的 `CA` 验证数字证书。如果验证失败，浏览器将警告用户无法验证证书。（然而，现代计算机出厂时自带了主流\
  \ `CA` 的证书。这些证书通常位于计算机的证书存储中。因此，要验证来自给定 `CA` 的证书，客户端计算机只需从自己的存储中获取该 `CA` 的数字证书即可。）\n\
  4. 使用到为止握手中产生的所有数据，客户端创建会话预密钥（pre-master secret），使用从服务器 `X.509` 证书中收到的服务器公钥对其加密，然后将加密后的预密钥发送给服务器。\n\
  5. 如果服务器请求了客户端身份验证，则服务器也将验证客户端的 `X.509` 证书。这在大多数电子商务和银行网站并不常见。\n6. 客户端和服务器都使用主密钥（master\
  \ secret）生成会话密钥。这些是对称密钥（如 `AES`），将在整个会话期间加密客户端和服务器之间的信息。\n7. 客户端向服务器发送消息，告知其未来来自客户端的消息将使用会话密钥加密。\n\
  8. 服务器向客户端发送消息，告知其未来来自服务器的消息将使用会话密钥加密。\n\n这一过程不仅允许安全交换对称密钥，还实现了对服务器的验证以及（可选的）对客户端的验证。这就是安全网络流量的方式。\n\
  \n# 虚拟专用网络\n\n`VPN`（或虚拟专用网络）本质上提供了一种利用互联网在远程用户或站点与中心位置之间建立虚拟连接的方法。在该连接上往返的数据包经过了加密，因此具有私密性。`VPN`\
  \ 必须模拟直接的网络连接。\n\n使用三种不同的协议来创建 `VPN`：\n\n* 点点隧道协议 (`PPTP`)\n* 二层隧道协议 (`L2TP`)\n\
  * IP 层安全协议 (`IPsec`)\n\n这些协议将在后续章节中详细讨论。\n\n## 点点隧道协议\n\n*点点隧道协议* (`PPTP`) (gloss.xhtml#gloss06)\
  \ 是 `VPN` 使用的协议中最老的一个。它最初被设计为点点协议 (`PPP`) 的安全扩展。`PPTP` 于 1996 年由 `PPTP 论坛` 提出作为标准，该组织包括\
  \ Ascend Communications、ECI Telematics、Microsoft 和 3Com 以及 U.S. Robotics。它为旧的 `PPP`\
  \ 协议增加了数据包加密和用户验证的功能。`PPTP` 工作在 OSI 模型的数据链路层（见[第 2 章）。\n\n`PPTP` 提供了两种不同的用户验证协议：可扩展认证协议\
  \ (`EAP`) 和挑战握手协议 (`CHAP`)。`EAP` 实际上是专为 `PPTP` 设计的，并非专利。`CHAP` 是一个三步过程：客户端向服务器发送代码，服务器进行验证，然后服务器做出响应。`CHAP`\
  \ 在在连接建立后还会定期重新验证远程客户端。\n\n`PPTP` 使用微软点点加密 (`MPPE`) 来加密数据包。`MPPE` 实际上是 `DES` 的版本。`DES`\
  \ 在许多情况下仍然有用；但更倾向于使用较新的版本，如 `DES3`。\n\n## 二层隧道协议\n\n*二层隧道协议* (`L2TP`) 被明确设计为 `PPTP`\
  \ 的增强。与 `PPTP` 类似，它也工作在 OSI 模型的数据链路层。相比 `PPTP`，它有若干改进。首先，它提供了更多多样化的验证方法：`PPTP` 提供两种方法（`CHAP`\
  \ 和 `EAP`），而 `L2TP` 提供五种（`CHAP`、`EAP`、`PAP`、`SPAP` 和 `MS-CHAP`）。\n\n除了提供更多可用验证协议外，`L2TP`\
  \ 还其他增强。`PPTP` 只能在标准 IP 网络工作，而 `L2TP` 可以在 `X.25` 网络（电话系统中常用的协议）和 `ATM`（异步传输模式，一种高速网络技术）系统上工作。`L2TP`\
  \ 还使用 `IPsec` 进行加密。\n\n\n\n\n\n`Internet 协议安全安全协议`（`IPsec`）是这三种 VPN 协议中最新的一种。`IPsec`\
  \ 与其他两种方法的区别之一是它不仅加密数据包数据（回想第 2 章中对数据包的讨论），还加密头部信息。它还具有防止数据包未经授权重传的保护。这非常重要，因为黑客可以使用的一种技巧就是直接从传输中捕获第一个数据包，并利用它让自己的传输通过。本质上，第一个数据包（或多个包）必须包含登录数据。如果你简单地重新发送该数据包（即使你无法破解其加密），你也将发送一个有效的登录和密码，随后可以跟随额外的数据包。防止数据包的未经授权重传可以防止这种情况发生。\n\
  \n`IPsec` 以两种模式之一运行：传输模式（Transport mode），仅对负载进行加密；以及隧道模式（Tunnel mode），数据和 IP 头部均进行加密。以下是一些基本的\
  \ `IPsec` 术语：\n\n- `认证头`（`AHs`）为 IP 数据包提供无连接的完整性和数据源认证。\n- `封装安全载荷`（`ESP`）为数据包提供源真实性、完整性和机密性保护。它提供仅加密和仅认证的配置。\n\
  - `安全关联`（`SAs`）为 `AH` 或 `ESP` 提供提供所需的参数。`SAs` 使用互联网安全关联和密钥管理协议（`ISAKMP`）建立。\n- `互联网安全关联和密钥管理协议`（`ISAKMP`）为认证和密钥交换提供了一个框架。\n\
  - `互联网密钥交换`（`IKE` 和 `IKEv2`）用于通过处理协议和算法的协商来建立 `SA`，并生成要使用的加密和认证密钥。\n\n本质上，在初始建立\
  \ `IPsec` 隧道期间，会形成 `SAs`。这些 `SAs` 包含此类信息，例如在 `IPsec` 隧道中将使用什么加密算法和何种哈希算法。（回想我们在第\
  \ 8 章中曾深入讨论过加密。）`IKE` 主要关注建立这些 `SAs`。`ISAKMP` 允许 `IPsec` 隧道的两端相互认证并交换密钥。\n\n## Wi-Fi\
  \ 安全\n\n如今无线网络被广泛使用，考虑无线网络安全非常重要。有三种 Wi-Fi 安全协议，从最旧且最不安全的（WEP）到最新且最安全的（WPA3）。在这里对它们进行简要描述。\n\
  \n### 有线等隐私\n\n`有线等隐私`（`WEP`）使用流加密器 `RC4` 来保护数据，并使用 `CRC-32` 校验和进行错误检查。标准的 `WEP`\
  \ 使用 40 位密钥（称为 `WEP-40`）和 24 位初始化向量（`IV`）来有效形成 64 位加密。128 位的 `WEP` 使用 104 位密钥和 24\
  \ 位 `IV`。\n\n由于 `RC4` 是一种流加密器，绝不能两次使用相同的流量密钥。`WEP` 的问题在于，创建它的委员会由非常优秀的计算机专业人士组成，他们认为自己足够了解密码学，但事实并非如此。他们重用了\
  \ `IV`，这违背了 `IV` 的整个目的并导致协议容易受到攻击。在 YouTube 上简单搜索“如何破解 WEP”将得到大量关于破解 `WEP` 技术的视频。\n\
  \n### Wi-Fi 保护访问\n\n`Wi-Fi 保护访问`（`WPA`）无疑是对 `WEP` 的改进。首先，`WPA` 使用 `AES`，这是一个非常好的加密算法。此外，`WPA`\
  \ 使用临时密钥完整性协议（`TKIP`），为每个数据包动态生成新密钥。因此，即使你破解了 `WPA` 密钥，下一个数据包也有不同的密钥。\n\n### WPA2\n\
  \n`WPA2` 是目前最广泛使用的 Wi-Fi 安全协议，如果可能，这应该是你应该使用的。`WPA2` 基于 IEEE `802.11i` 标准，提供使用计数器模式密码分组链（`CBC`）消息认证码（`MAC`）协议（`CCMP`）的高级加密标准（`AES`），为无线帧提供数据机密性、数据源认证和数据完整性。（这些术语中的一些你应该应该从第\
  \ 8 章回想起。）`CBC` 防止了已知明文攻击。\n\n`MAC` 保护了消息完整性，并确保数据包在传输过程中不会意外或故意被篡改。这意味着 `WPA2`\
  \ 使用了非常强的加密以及消息完整性。\n\n### WPA3\n\n`WPA3` 发布于 2018 年，具有许多有趣的特性。其较有趣的新属性之一是往返无线接入点（`WAP`）的所有流量都是加密的。`WPA3`\
  \ 还要求攻击者在尝试每次密码猜测时与你的 Wi-Fi 交互，这使得暴力破解攻击成功的概率降低。\n\n## 总结\n\n每个网络在与外部世界之间拥有防火墙和代理服务器是至关重要的。网络中所有机器（包括服务器和工作站）具有更新的病毒防护也是关重要的。考虑实施\
  \ `IDS` 也是一个好主意。在接下来的练习中，你将练习各种防火墙。\n\n### 测试你的技能\n\n### 单选题\n\n1 以下哪种方法是识别病毒最常用的？\n\
  \nA. 比较已知文件属性\nB. 使用复杂规则来寻找病毒行为\nC. 寻找 TSR 程序\nD. 寻找已知病毒\n\n2 检查邮件感染病毒的一种方法是？\n\n\
  A. 拦截所有附件\nB. 拦截活动附件（例如）。\nC. 寻找来自已知病毒的主题\nD. 寻找来自已知病毒源的邮件\n\n3 什么是 TSR 程序？\n\n\
  A. 修改系统注册表的程序\nB. 关闭时会自我删除的程序\nC. 在关闭系统之前扫描远程程序\nD. 在关闭它们后仍留在内存中的驻留程序\n\n4 依赖复杂规则定义什么是病毒的扫描被称为？\n\
  \nA. 基于规则的扫描 (RBS)\nB. 启发式扫描\nC. TSR 扫描\nD. 逻辑扫描 (LBS)\n\n5 以下哪项不是防火墙的基本类型？\n\n\
  A. 筛选防火墙\nB. 应用网关\nC. 启发式防火墙\nD. 链路级网关\n\n6 以下哪种是最基本的防火墙类型？\n\nA. 筛选防火墙\nB. 应用网关\n\
  C. 启发式防火墙\nD. 链路级网关\n\n7 George 负责中型网络的安全。他有多个生成日志的系统。什么技术对他分析这些日志最有帮助？\n\nA. SIEM\n\
  B. IDS/IPS\nC. NGFW\nD. PKI\n\n8 SPI 代表什么？\n\nA. 状态包检查\nB. 系统包检查\nC. 状态包拦截\nD. 系统包拦截\n\
  \n9 安装在现有服务器上的软件防火墙的术语是什么？\n\nA. 网络主机型防火墙\nB. 双宿主防火墙\nC. 路由器防火墙\nD. 筛选主机\n\n10 网络主机型防火墙的一个主要缺点是什么？\n\
  \nA. 它的安全性取决于底层操作系统\nB. 它的配置困难\nC. 它很容易被破解\nD. 它非常贵\n\n\n\n\n\n# 11. 拦截产生过可疑活动的\
  \ IP 地址的术语是什么？\n\nA. 预防性拦截\nB. 入侵偏转\nC. 主动偏转\nD. 入侵拦截\n\n# 12. 用于诱导入侵者的假系统术语是什么？\n\
  \nA. 蜜罐系统\nB. 伪系统\nC. 偏转系统\nD. 陷阱\n\n# 13. 以下哪项是降低系统对入侵者吸引力的正确术语？\n\nA. 入侵威慑\nB.\
  \ 入侵偏转\nC. 入侵伪装\nD. 入侵回避\n\n# 14. 大多数 IDS 实现使用哪种方法？\n\nA. 异常检测\nB. 预防性拦截\nC. 入侵威慑\n\
  D. 渗透\n\n# 15. 大多数反间谍软件包是如何工作的？\n\nA. 通过启发式方法\nB. 通过寻找已知的间谍软件\nC. 与防病毒扫描器的方式相同\n\
  D. 通过寻找 TSR cookie\n\n## 练习题\n\n### 练习 9.1：设置防火墙\n\nMicrosoft Windows（自 XP 以来的每个版本，包括\
  \ Windows 10）和 Linux 都提供了某种内置的数据包过滤防火墙。理想情况下，如果你可以访问这两种操作系统，最好的练习是尝试为这两个系统都设置防火墙。\n\
  \n1. 使用你拥有的任何操作系统的文档，决定你想要拦截哪些数据包。\n2. 将你的防火墙设置为过滤这些数据包。\n\n### 练习 9.2：基于路由器的防火墙\n\
  \n此练习适用于可以访问实验室路由器防火墙的同学。\n\n1. 查阅你的路由器文档，获取如何配置防火墙的说明。\n2. 配置你的路由器防火墙，以拦截你在 `Exercise\
  \ 9.1` 中选择拦截的相同项目。\n\n### 练习 9.3：评估防火墙\n\n写一篇短文，解释你认为基于路由器的解决方案还是内置操作系统解决方案更好。说明你的理由。\n\
  \n### 练习 9.4：活动代码\n\n使用网络或其他资源，找出为什么在某些情况下拦截活动代码（例如 ActiveX 脚本）可能是一个好主意，也可能不是好主意。写一篇短文说明你的观点。\n\
  \n### 练习 9.5：公司使用的硬件\n\n访问公司的 IT 部门，确定其计算机系统防御中使用了哪些硬件。公司是否在使用软件防火墙之外还使用了硬件防火墙？它使用什么形式的入侵检测软件？它在公司的工作站上使用防病毒和反间谍软件吗？写一份简报告总结你的发现。\n\
  \n### 项目\n\n### 项目 9.1：微软防火墙是如何工作的？\n\n使用微软文档、网络和其他资源，找出 Microsoft Windows（你正在使用的任何版本）防火墙使用了哪些方法论。写一篇短文解释该方法的优点和缺点。还要讨论你认为该方法在哪些情况下是足够的，在哪些情况下可能是不足的。\n\
  \n### 项目 9.2：防病毒软件是如何工作的？\n\n使用供应商的文档、网络或其他资源，找出 `Norton AntiVirus` 使用什么方法论，以及 `McAfee`\
  \ 使用什么方法。根据这些信息，写一篇短文对比并分析其中的任何差异。还要讨论在什么情况下推荐使用其中一种另一种。\n\n### 项目 9.3：使用 Snort\n\
  \n这是一个较长的项目，适合小组完成。\n\n访问 `Snort.org` 网站（`www.snort.org`）并下载 `Snort`。使用供应商文档或其他资源配置\
  \ `Snort`。然后在使用配置了 `Snort` 的机器上运行端口扫描器，并注意 `Snort` 是否检测到了扫描。\n\n## 案例研究\n\nJane\
  \ Smith  ABC 公司的安全。她有中等预算购买安全解决方案。到目前，她在网络和外部世界之间安装了一个基于路由器的防火墙。她在网络上的每台机器上还安装了商业病毒扫描器。考虑以下问题：\n\
  \n1. 你还会向她推荐其他哪些操作？\n2. 你会推荐不同的防火墙吗？为什么或为什么不\n\n# 第 10 章\n\n## 安全策略\n\n### 章目标\n\
  \n在阅读本章并完成练习后，你将能够：\n\n* 识别安全策略的重要性。\n* 理解各种策略及其原理。\n* 了解良好的策略包含哪些元素。\n* 为网络创建策略。\n\
  * 评估并改进现有策略。\n\n### 引言\n\n到目前为止，我们在书中探索了威胁。在 `Chapter 9` 中，我们检查了各种技术防御。然而，事实是，技术本身无法解决所有的安全问题。有些问题是技术无法阻止的：\n\
  \n* 防病毒软件无法防止用户手动打开附件并释放病毒。\n* 如果前员工（可能对公司感到不满）仍有有效密码，或者密码简单地贴在电脑显示器的便签纸上，那么一个经过技术保护的网络仍然非常脆弱。\n\
  * 如果服务器位于公司内几乎每个人都能进入的房间里，那么它是不安全的。\n* 如果终端用户容易受到社会工程学攻击，那么网络就是不安全的。\n\n技术本身不是答案的另一个原因是，技术必须被恰当的应用。策略用于指导你如何实施和维护安全。\n\
  \n### 什么是策略？\n\n安全策略是一份定义组织将如何处理安全某个方面的文档。可以有关于终端用户行为、IT 对事件的响应或特定问题和事件的策略。\n\n\
  安全策略还可以创建以应对合规性。这类策略指导组织成员如何符合法规规定。一个很好的例子是告知医疗保健工作人员如何使用电子病历软件来符合 `HIPAA` 要求的策略。\n\
  \n策略也可以仅仅是建议性的，建议员工如何处理某些项目，但不强制合规。例如，某项策略可能会建议使用 Wi-Fi 热点从智能手机发送邮件是不安全的，但并不禁止。\n\
  \n#### ISO 17999\n\nISO 17799 是一项关于如何开发策略的标准。策略通常不被认为是令人兴奋的安全主题；然而，安全态势的核心是你的策略。因此，恰当开发至关重要。\n\
  \nISO/IEC 17799:2005 描述了与信息安全管理以下领域的控制目标和控制的最佳实践：\n\n* 安全策略\n* 信息安全组织\n* 资产管理\n\
  * 人力资源安全\n* 物理环境安全\n* 通信与运行管理\n* 访问控制\n* 信息系统的获取、开发和维护\n* 信息安全事件管理\n* 业务连续性管理\n\
  * 合规\n\n熟悉该标准并在开发策略时考虑其建议是一个好主意。\n\n### 重要标准\n\n在创建安全策略时，你应该参考许多行业标准。在深入策略开发和执行的各种细节之前，将对其中一些标准进行简要回顾。\n\
  \n#### NIST SP 800-53\n\n\n\n\n\n美国国家标准与技术研究院（NIST）发布了许多与网络安全相关的标准。`NIST 800-53`（上述\
  \ SP 代表特殊出版物，通常会被省略）识别了 18 类安全控制措施。在分析你的系统安全策略时，这是一个很好的参考标准。表 10.1 列出了安全控制族。\n\n\
  **表 10.1** *NIST 800-53 安全控制族*\n\n![Images](img/10tab01.jpg)\n\n## ISO 27001\n\n\
  `ISO/IEC 27001` 要求管理层：\n\n- 系统地检查组织的信息安全风险，并考虑威胁、漏洞和影响；\n- 设计并实施一套连贯且全面的信息安全控制和/或其他形式的风险处理措施（如风险规避或风险转移），以应对那些被认为不可接受的风险；\n\
  - 采用通用的管理流程，确保信息安全控制措施持续满足组织的信息安全需求。\n\n请注意，`ISO27001` 的设计涵盖范围远超 IT 领域。\n\n## ISO\
  \ 27002\n\n该标准为启动、实施和维护信息安全管理体系（ISMS）提供了最佳实践建议。标准本身从 5 个引言章节开始，仅提供一些术语和标准范围等指导。主要章节从第\
  \ 5 章 开始。以下是章节列表：\n\n5. 信息安全策略\n6. 信息安全组织\n7. 人员安全\n8. 资产管理\n9. 访问控制\n10. 密码学\n\
  11. 物理和环境安全\n12. 安全——程序与职责\n13. 通信安全\n14. 系统获取、开发与维护\n15. 供应商关系\n16. 信息安全事件管理\n\
  17. 业务连续管理的信息安全方面\n\n## ISO 1799\n\n与策略制定关系最明显的标准可能是 `ISO 1779 如何制定安全策略》。它为组织启动、实施、维护和改进信息安全管理确立了指南和一般原则。\n\
  \n`ISO/IEC 17799:2005` 包含了信息安全管理以下领域的控制目标和控制措施的最佳实践：\n\n- 安全策略\n- 信息安全组织\n- 资产管理\n\
  - 人员安全\n- 物理和环境安全\n- 通信与运行管理\n- 访问控制\n- 信息系统的获取、开发与维护\n- 信息安全事件管理\n- 业务连续管理\n- 合规性\n\
  \n## 定义用户策略\n\n在讨论用户策略时，有一条你必须牢记于心的规则：你应该为每种预见的情况制定策略。未能针对特定问题制定策略通常会导致该问题的恶化。某些事情对你来说可能是常识，但对于那些没有计算机网络或网络安全培训或经验的人来说，可能并非如此。\n\
  \n系统滥用是许多组织面临的一个大问题。这很大程度上源于难以准确定义什么是“滥用”。某些行为可能是显而易见的滥用，例如利用公司的时间和电脑寻找新工作或查看非法网站。然而，其他领域就没有那么明确了，例如员工利用午休时间查找她想买的汽车的相关信息。通常情况下，良好的用户策略会具体概述人们应该如何使用系统，以及不应该如何使用。为了使策略生效，它必须非常清晰且具体。诸如“计算机和互联网访问仅供业务使用”之类的模糊陈述显然是不够的。我建议使用更清晰且可能更具执行力的描述，例如：“计算机和互联网访问仅在工作时间内用于业务目的。然而，员工可以在非工作时间（如休息、午餐和上班前）将计算机/互联网访问用于个人用途。但此类使用必须符合互联网使用策略。”这种措辞清晰、直接且具有执行力。\n\
  \n用户策略还涵盖了其他潜在的滥用领域，包括共享密码、复制数据、在员工午餐时保持登录状态等。所有这些问题最终都会对你的网络安全产生重大影响，必须在你的用户策略中明确列出。现在我们将检查有效用户策略必须涵盖的几个领域：\n\
  \n- 密码\n- 互联网使用\n- 电子邮件使用\n- 安装/卸载软件\n- 即时消息\n- 桌面配置\n- 自带设备 (BYOD)\n\n## 密码\n\n\
  保持密码安全至关重要。第 8 章“加密”讨论了作为操作系统加固一部分的适当密码。大多数来源表明，一个良好的密码至少有八个字符长，使用数字和特殊字符，并且与最终用户没有明显的关联性。例如，一个达拉斯牛仔队的粉丝不建议使用像\
  \ `cowboys` 或 `godallas` 这样的密码，但可能被建议使用 `%trEe987*` 或 `123DoG$$` 这样的密码。密码最小长度、密码历史和密码复杂度等问题属于管理策略，而不是用户策略。用户策略规定了终端用户的行为方式。为了可靠的安全，我建议使用经过修改的包含数字和特殊字符的短语。这可以是容易记忆的，但经过修改以防止被破解或暴力破解。例如，将短语“I\
  \ like double cheesurgers”修改为 `IliK3double3ch33$`。\n\n然而，无论密码有多长或多复杂，如果它写在贴在电脑上的便利贴上，那么任何密码都不是安全的。这似乎是显而易见的，但在办公室里发现密码写在显示器上或放在抽屉里的情况并不罕见。每个清洁工或路过的人都可以获取该密码。\n\
  \n员工共享密码也并不常见。例如，鲍下周要出差，所以他把密码给了约翰，以便约翰可以进入他的系统、检查电子邮件等。问题是，现在有两个人拥有该密码。如果鲍不在的那周，约翰病了，决定把密码分享给莎莉，让她在约翰生病期间继续检查该系统，该怎么办？密码很快就会被很多人，从安全角度来看完全失效。\n\
  \n管理策略需要解决密码最小长度、有效期和密码历史等问题。系统管理员可以强制这些要求。然而，如果用户不以安全的方式管理密码，所有这些都将毫无帮助。\n\n这意味着你需要关于用户如何保护密码的明确策略。这些策略应该规定以下内容：\n\
  \n- 严禁在易接触的地方记录密码。首选是完全不要记录，但如果必须记录，也应该放在安全区域，例如家里的保险箱中（而不是办公室电脑旁）。\n\n\n\n\n\n\
  - 无论出于任何原因，都绝不能与他人共享密码。\n- 如果员工认为其密码已泄露，应立即联系 IT 部门，以便更改密码，并对使用旧密码的登录尝试进行监控和追溯。\n\
  \n## 互联网使用\n\n大多数组织都会为其用户提供某种形式的互联网访问。这有几个原因。最明显的原因是电子邮件。然而，这几乎不是商业或学术环境中访问互联网的唯一理由。还有万维网（Web），甚至还有聊天室。（信不信由，聊天室可以且确实被用于业务通信。）互联网可以用于任何组织内部的合法目的，但也可能带来严重的安全问题。必须制定适当的政策来规范互联网技术的使用。\n\
  \n万维网是包含海量数据的精彩资源。在本书中，我们经常引用一些网站，可以在那里找到有价值的安全数据和实用的工具。互联网上还充满了关于各种技术的有用教程。然而，即使是非与技术无关的业务兴趣也可以通过\
  \ Web 服务。以下是 Web 合法业务用途的几个示例：\n\n- 销售人员检查竞争对手的网站，查看他们提供哪些产品或服务、在哪些地区，甚至可能获取价格\n\
  - 债权人检查企业的 `AM Best` 或 `Standard & Poor’s` 评分，以查看其业务财务状况如何\n- 出差人员检查天气状况并获取旅行价格\n\
  - 通过网络研讨会进行在线培训\n- 网络会议\n- 在线账单或在某些情况下甚至提交监管和政府文件\n\n当然，还有其他显然不适合在公司网络上的 Web 活动：\n\
  \n- 使用 Web 寻找新工作\n- 任何色情用途\n- 任何违反当地、州法律或联邦法律的使用\n- 使用 Web 经营自己的业务（如果你参与了除公司业务之外的其他企业）\n\
  \n此外，还存在灰色地带。某些活动对某些组织可能是可以的，但对其他组织则不然。此类活动可能包括：\n\n- 员工在午餐或休息期间在线购物\n- 午餐或休息期间在线阅读新闻文章\n\
  - 查看幽默网站\n\n一个人可能认为荒谬而易见的事，对另一个人可能并非如此。组织制定非常清晰的政策，详细说明在工作中哪些是和哪些不可接受的 Web 使用，是至关重要的。提供有关接受和不可接受用途的清晰示例也很重要。你还应该记住，大多数代理服务器和许多防火墙可以阻止某些网站。这将有助于防止员工误用公司的网络连接。\n\
  \n## 电子邮件使用\n\n大多数业务甚至学术活动现在都通过电子邮件进行。正如我们在之前的几个章节中讨论过的，电子邮件恰好也是病毒传播的主要载体。这意味着电子邮件安全对于任何网络管理员来说都是一个重大问题。\n\
  \n显然，你不能简单地禁止所有邮件附件。然而，你可以建立一些关于如何处理邮件附件的指南。用户只有在附件符合以下标准时才应该打开它：\n\n- 它是预之中的。（某人向同事或客户请求文件。）\n\
  - 如果不是预之中的，它来自已知来源。如果是这样，先给那个人发一封邮件（或给她打电话），询问她是否发送了该附件。如果是，就打开它。\n- 它看起来是合法的业务文件（电子表格、文档、演示文稿等）。\n\
  \n注意的是，某些人可能认为这些标准不切实际。毫无疑问，它们确实不。然而，考虑到病毒（通常附在电子邮件中）的流行，这些措施是审慎的。许多人选择不采取这种程度来尝试避免病毒，这可能也是你的选择。只需记住，每年都有数百万台电脑感染某种病毒。\n\
  \n任何人都不应该打开符合以下任一标准的附件：\n\n- 它来自未知来源。\n- 它是某些活动代码或可执行文件。\n- 它是一个动画/电影。\n- 电子邮件本身看起来不合法。（它似乎在诱导你打开附件，而不是仅仅是恰好带有附件的合法业务通信。）\n\
  \n如果终端用户有任何疑问，她就不应该打开这封邮件。相反，她应该联系 IT 部门中指定处理安全的人员。该人员可以将邮件主题与已知病毒进行对比，或者简单地亲自检查这封邮件。然后，如果看起来是合，用户就可以打开附件。\n\
  \n### FYI：关于附件\n\n在打开附件时，我经常遵循“宁安全，勿后悔”（`better safe than sorry`）的准则。当收到在互联网上传传的笑话、图像、Flash\
  \ 动画等时，我会直接删除它。这可能意味着我会错过幽默的图片和故事，但也意味着我将错过许多病毒。你最好考虑这种做法。\n\n## 安装/卸载软件\n\n在涉及安装和卸载软件时，有一个绝对的答案：不允许终端用户在其机器上安装任何东西。这包括壁纸、屏幕保护程序、工具程序——任何东西。最好的方法是限制终端用户的登录权限，以便他们无法安装任何东西。然而，这应该与一份禁止在其\
  \ PC 上安装任何东西的强力政策声明相结合。如果他们想安装东西，应该首先由 IT 部门进行扫描并获得批准。这个过程可能很麻烦，但是是必要的。有些组织甚至比到从终端用户\
  \ PC 中移除或至少禁用媒体驱动器（`CD`、`USB` 等），以便安装只能从 IT 部门存放在某些网络驱动器上的文件进行。这通常是一个比大多数组织要求的更极端的措施，但这是你应该意识到的选项之一。事实上，`Windows`\
  \ 允许管理员禁用允许新的 `USB` 设备。因此管理员可以安装某些已批准公司使用的 `USB` 设备，然后禁止添加任何额外的设备。\n\n## 即时通讯\n\n\
  即时通讯被组织中的员工广泛使用和滥用。在某些情况下，即时通讯可用于法的业务目的。然而，它确实构成了重大的安全风险。某些病毒专门通过即时通讯传播。在一次事件中，病毒会将用户好友列表中的所有人的对话内容复制给他们。因此，如果你感染了病毒，你认为是私人的对话最终会被广播给你认识并曾发过信息的所有人。\n\
  \n从纯的信息安全角度来看，即时通讯也是一种威胁。没有什么能阻止终端用户通过即时通讯发送贸易秘密或机密信息，而没有通过公司电子邮件服务器的邮件追溯性。建议在组织内的所有计算机上直接禁止即时通讯。如果你发现你必须使用它，那么你必须为它的使用建立非常严格的指南，包括以下内容：\n\
  \n\n\n\n-   即时消息只能用于业务通信，不能用于私人会话。现在，这可能有些难以执行。这类规则往往是如此。更常见的规则，例如禁止浏览个人网页，也相当难以执行。然而，制定此类规则仍然是一个好主意。这样，当你发现有人违反规则时，可以引用公司禁止此类行为的政策。但是，你应该意识到，极有可能，你不会发现大多数违反该规则的违规行为。\n\
  -   不应通过即时消息发送任何机密或私人业务信息。\n\n### 桌面配置\n\n许多用户喜欢重新配置桌面，更改背景、屏幕保护程序、字体大小和分辨率。从理论上讲，这并不是安全风险。仅仅更改计算机的背景图像不会损害计算机的安全性。然而，还涉及到其他问题。\n\
  \n第一个问题是背景图像的来源。终端用户经常从互联网下载图像。这意味着有感染病毒或木马的可能性，特别是那些使用隐藏扩展名的病毒（例如，它看起来可能是一个 `mypic.jpg`，但实际上是\
  \ `mypic.jpg.exe`）。如果员工使用令其他员工感到冒犯的背景或屏幕保护程序，还会涉及人力资源/骚扰问题。出于这个原因，某些组织决定禁止对系统配置进行任何更改。\n\
  \n第二个问题是技术性的。为了让用户拥有更改屏幕保护程序、背景图像和分辨率的权限，你必须赋予他们权限，而这些权限同时也允许他们更改其他系统设置。图形显示选项与其他所有配置选项并没有分离。这意味着，允许用户更改屏幕保护程序可能会为他们更改其他设置（如网卡配置或\
  \ Windows Internet 连接防火墙）打开大门，从而损害安全性。\n\n### 自带设备 (BYOD)\n\n自带设备办公（BYOD）已成为大多数组织面临的重要问题。你的大多数员工（如果不是全部）都有自己的智能手机、平板电脑、智能手表和活动监测器，并将它们带入工作场所。将这些设备连接到你的无线网络引入了一系列新的安全忧虑。你不知道每个设备之前连接过哪些网络，它们上安装了什么软件，或者这些个人设备可能会外泄哪些数据。\n\
  \n在高度安全的环境中，可能需要禁止个人拥有的设备。然而，在许多组织中，这种政策是不切行的。一种解决办法是设置一个专门用于 BYOD 的 Wi-Fi 网络，该网络不与公司主网络连接。另一种方法（尽管技术上更复杂）是在连接时检测设备，如果它不是公司提供的设备，则大幅限制其访问权限。\n\
  \n无论你采取什么方法，你都必须对个人设备制定某些政策。它们已经无处不在了。几年前智能手机已经出现了，但智能手表还没有。很难预测未来还会出现哪些新的智能设备。\n\
  \n处理组织网络上的用户设备有多种方法，其中一些方法有它们自己的缩写：\n\n-   **CYOD**（公司选择设备）：公司列出可接受的设备（即符合公司安全要求的设备），并允许每位员工选择自己的设备。\n\
  -   **COPE**（公司拥有并提供设备）：公司拥有并提供设备。这显然比 BYOD 或 CYOD 提供了安全性，但成本最高。COPE 代表公司拥有并提供的设备，或公司拥有并个人启用的设备。\n\
  -   **COBO**（公司拥有的设备）：这种模型提供了最高的安全性。公司拥有并运行设备。公司 IT 服务控制设备以及设备的选项。\n\n### 关于用户政策的最后思考\n\
  \n本节概述了适当且有效的用户政策。任何组织实施可靠的用户政策都是至关重要的。然而，如果你没有对违反政策的行为定义明确的后果，这些政策将是无效的。许多组织发现，列出随每次事件而升级的特定后果是有帮助的，例如：\n\
  \n-   首次违反任何此类政策的违规行为将导致口头警告。\n-   第二次违规将导致书面警告。\n-   第三次违规将导致停职或终止合同。（在学术环境中，这将导致停学或开除学。）\n\
  \n你必须清楚地列出后果，并且所有用户在入职时都应签署用户政策副本，以防员工声称他们不知道政策。\n\n### 注意事项\n\n#### 终止合同或开除\n\n\
  任何可能导致从学校开除或从工作中被终止（甚至降职）的政策，都应首先获得你的法律顾问的批准。错误的终止合同或开除可能会产生重大的法律后果。我不是律师也不是法律事务专家，无法为你提供法律建议。就这些事项咨询律师是至关重要的。\n\
  \n同样重要的是，滥用公司 Internet 访问还有另一个成本：生产力损失。平均员工花费多少时间阅读私人邮件、进行非业务性的网页活动或发送即时消息？很难说。然而，为了获得一个非正式的观点，可以在任何一个工作日的办公期间访问\
  \ `www.yahoo.com`，点击其中一个新闻故事。在故事的底部，你会看到该故事的留言板。它列出了帖子的日期和时间。看看在办公期间产生了多少帖子。不太可能所有这些人都是失业、退休或在家请假的人。\n\
  \n让我完全明确：互联网是人类历史上最伟大的通信工具。它对任何业务都可能产生巨大的积极影响。我几乎通过网络进行所有的业务活动。然而，许多员工滥用了他们的 Internet\
  \ 权限，对于那些不能自律的人来说，使用网络确实会降低生产力。以下是支持这一断言的一些研究：\n\n-   2008 年的一项研究显示，员工平均每周浪费 5.3\
  \ 小时逛网。虽然这项研究有点久了，但这个问题一直存在。在通常情况下，广泛的网络访问实际上会抑制生产力而不是增强它。\n-   俄亥州立大学的研究人员发现，经常使用\
  \ Facebook 的学生 GPA 比非用户低。\n-   多项研究显示，Facebook 对生产力有负面影响。这些研究大多是几年前的，因为工作中使用社交媒体有害已成为共识。\n\
  \n### 系统管理员政策\n\n#### 新员工\n\n\n\n当聘用新员工时，系统管理策略必须定义特定的步骤来保护公司安全。新员工必须获得其工作职所需的资源和应用程序的权限。权限的授予必须记录在案（可能记录在日志中）。此外，让新员工收到公司计算机安全和可接受使用策略的副本，并让他们签署文件确认收到此类文件，也是至关重要的。\n\
  \n在新员工开始工作之前，IT 部门（特别是网络管理部门）应该收到该员工所属业务部门提交的书面请求。该请求应明确说明该用户需要哪些资源以及何时开始工作，并应由该业务部门中有权批准此类请求的人员签字。然后，负责网络管理或网络安全的人员应批准并签署该请求。在您根据相应的权限在系统中实施了新用户后，就可以归档一份请求的副本。\n\
  \n## 离职员工\n\n当员工离开公司时，确保其所有登录账户已终止并立即停止对所有系统的访问是至关重要的。遗憾的是，许多许多组织对这一安全领域没有给予足够的关注。你无法确定哪些员工在离开公司后会对公司怀有敌意，哪些又不会。在前员工工作的最后一天关闭其所有访问权限是必须的。这包括对建筑的物理访问。如果一个前员工持有钥匙且心存不满，没有任何能阻止他回来偷取或破坏计算机设备。当员工离开公司时，你需要确保在他们的最后一天执行以下操作：\n\
  \n- 任何服务器、`VPN`、网络或其他资源的所有登录账户均已禁用。\n- 归还设施的所有钥匙。\n- 电子邮件、互联网访问、无线网络、手机等所有账户均已关闭。\n\
  - 取消任何大型机资源的账户。\n- 对员工的工作站硬盘进行搜索/检查。\n\n最后一项可能看起来很奇怪。但如果一个员工正在收集他要带走的数据（例如公司专有数据）或进行任何其他不当的活动，你需要立即发现。如果你确实看到了任何此类活动的证据，你需要保护该工作站，并将其保留作为任何民事或刑事诉讼的证据。\n\
  \n对某些读者来说，所有这些措施可能显得有些极端。诚然，对于绝大多数离职员工，你将没有任何需要担心的问题。然而，如果你不养成在员工离职时保护其访问权限的习惯，你最终将面临本可以轻易避免的不幸局面。\n\
  \n## 变更请求\n\n信息技术的本质就是变化。不仅终端用户会来来去，需求也经常发生变化。业务部门请求访问不同资源的权限，服务器管理员升级软件硬件，应用程序开发者安装新软件，而\
  \ Web 开发人员更改网站。变化一直在发生。因此，拥有一个变更控制过程是非常重要的。这个过程不仅让变更运行顺畅，还能让 IT 安全人员在实施变更之前检查该变更是否存在任何潜在的安全问题。变更控制请求应通过以下步骤：\n\
  \n- 业务部门内的一位适当经理签署该请求，表示对该请求的批准。换句话说，如果请求者的直接主管没有批准该请求，那么追求变更请求过程是没有意义的。\n- 适当的\
  \ IT 部门（数据库管理、网络管理、电子邮件管理、云管理）核实该请求在技术上是可以实现的、符合预算限制的且不违反 IT 策略。\n- IT 安全部门验证此更改将不会引起安全问题。这在现代变得变得越来越重要。\n\
  - 适当的 IT 部门制定一个实施变更的计划以及一个在发生某些故障时回滚变更的计划。后一部分部分非常关键，而且经常被忽略。如果变更导致了任何问题，必须有某种回滚机制。\n\
  - 安排变更日期和时间，并通知所有相关方。\n\n你的变更控制过程可能与此并不相同；事实上，它可能会具体得多。然而，要记住的关键点是，为了确保你的网络安全，你不能在没有程序在实施前检查这些变更的影响的情况下让变更发生。\n\
  \n变更管理活动通常通过变更控制委员会（`CCB`）过程进行管理，有时称为变更批准委员会（`CAB`）过程。变更过程在本节之前已详细介绍过，但基本流程可以总结如下：\n\
  \n- 使用 `RFC`（意见征询或变更请求）文档启动流程\n- 发送 `RFC` 进行审批\n- 设置流程的优先级\n- 将流程分配给执行变更的人员\n- 记录决策\n\
  - 由 `CAB` 评估变更\n- 安排 `RFC`\n- 由变更所有者和请求者验证变更成功实施\n- 审查 `RFC`\n\n这一过程可能涉及 `CAB` 的正式会议和大量的文档记录，也可以是非正式的，通过与相关方沟通的电子邮件进行。\n\
  \n#### 实践\n\n### 变更控制的极端\n\n任何在 IT 行业有几年经验的人都可以告诉你，在变更控制方面，有各种方法。真正的问题是 IT 组实施了不合理的极端。我见过两种。在不使用公司真实名称的情况下，让我们检查每一个极端。\n\
  \n软件咨询公司 X 是一家为各种公司提供定制财务应用程序的小公司。它有少于 20 名开发者经常前往各地的客户所在地。它完全没有：\n\n- 任何应用程序的文档——甚至没有简单的笔记。\n\
  - 变更控制流程。当有人不喜欢服务器或某些网络配置时，他就直接更改。\n- 处理离职员工访问的流程。在某个案例中，一个人离开 6 个月后仍然拥有有效的登录账户。\n\
  \n现在，显然从多个角度来看（而不只是安全角度），这都是令人担忧的。但一种极端——一种导致混乱且极不安全的环境。注重安全的网络管理员倾向于走向相反的极端，一个会对生产力产生负面影响的极端。\n\
  \nB 公司拥有 2000 多员工，IT 员工约 100 人。在这家公司，官僚主义已经压倒了 IT 部门，导致他们的生产力受到严重影响。在一个案例中，某人是一个\
  \ Web 服务器管理员，并决定他还需要单个数据库服务器的数据库管理权限。然而，这一过程花费了 3 个月，其中包括他经理与 `CIO` 之间的一次面对面会议，两次电话会议以及他经理与数据库组经理之间的十几封电子邮件。\n\
  \n公司复杂的变更控制过程对生产力产生了严重的负面影响。\n\n\n\n这两个示例都是为了说明在变更管理中你应该尽量避免的两种极端情况。你实施变更管理的目标仅仅是拥有一种有秩序且安全的方式来管理变更，而不是成为生产力的阻碍。\n\
  \n#### 安全泄露\n遗憾的是，现实情况是，你的网络可能会在某时刻发生某种类型的安全泄露。你可能成为拒绝服务（`DoS`）攻击的目标，你的系统可能被病毒感染，或者可能黑客进入系统并破坏或复制敏感数据。一旦发生此类事件，你必须有一套应对计划。此书无法具体地告诉你如何处理可能发生的每一种事件；然而，我们可以讨论一下在某些一般情况下应该做的某些通用指南。我们将查看每种主要的安全泄露类型，以及针对每种泄露你应该采取的行动。\n\
  \n#### 病毒感染\n当病毒袭击你的系统时，立即隔离受感染的机器或机器。这意味着从字面上将机器从网络上拔掉。如果是子网，则拔掉其交换机或断开无线接入。隔离受感染的机器（除非你的整个网络都被感染了，在这种情况下只需关闭你的路由器/`ISP`\
  \ 连接以与外部世界隔离开，并防止蔓延到网络之外）。在实施隔离后，你可以安全地采取以下步骤：\n\n* 扫描并清理每一台受感染的机器。由于机器现在已脱离网络，这将是手动扫描。\n\
  * 记录事件、清理系统所花费的时间/资源以及受影响的系统。\n* 当你确定系统已经干净后，分阶段将它们上线（一次几台）。在每个阶段，检查所有机器，以确保它们已打补丁、已更新，并正确配置/运行了防病毒软件。\n\
  * 通知相关组织负责人该事件以及你所采取的行动。\n* 在处理完病毒并通知了相关人员后，与相关的 IT 人员开会，讨论从这次泄露中可以学习到什么，以及你未来如何防止其再次发生。\n\
  \n### DoS 攻击\n如果你已经采取了书中之前列出的步骤（例如，正确配置你的路由器和防火墙以减少任何尝试的 `DoS` 攻击的影响），那么你已经在减轻 `DoS`\
  \ 攻击造成的某些损害。此外，请考虑采取以下措施：\n\n* 使用你的防火墙日志或 `IDS` 找到是哪个 IP 地址（或地址）发起的攻击。记录下 IP 地址，然后（如果你的防火墙支持此功能——大多数防火墙都支持）拒绝该\
  \ IP 地址访问你的网络。\n* 使用在线资源（`interNIC.net` 等）查出该地址属于谁。\n* 联系该组织并告知他们正在发生的情况。\n* 记录所有这些活动并通知相关的组织负责人。\n\
  * 在处理完 `DoS` 攻击并通知了相关人员后，与相关的 IT 人员开会，讨论从这次攻击中可以学习到什么，以及你未来如何防止其再次发生。\n\n#### 黑客入侵\n\
  如果一个恶意黑客入侵了你的网络，你该怎么办？换句话说，事件响应的基本要素是什么？在发生黑客入侵的情况下，考虑采取以下措施：\n\n* 立即复制所有受影响系统（防火墙、目标服务器等）的日志以作为证据。\n\
  * 立即扫描所有系统，寻找木马程序、防火墙设置的更改、端口过滤的更改、正在运行的新服务等。本质上说，你需要进行应急审计查看已经造成了哪些损害。\n* 记录一切。在你所有的文档中，这必须是最详尽的。你必须指定是哪个\
  \ IT 人员在什么时间采取了什么行动。其中部分数据可能成为后期法庭程序的一部分，因此绝对的准确性是必要的。记录这段时间内采取的所有活动，并让至少两个人核实并签字记录，可能是一个好主意。\n\
  * 修改所有受影响的密码。修复造成的任何损坏。\n* 通知相关的业务负责人发生了什么情况。\n* 在处理完泄露并通知了相关人员后，你应该与相关的 IT 人员开会，讨论从这次泄露中可以学习到什么，以及你未来如何防止再次发生泄露。\n\
  \n这些仅仅是通用指南，某些组织在发生某些安全泄露时可能想要采取更具体的行动。在阅读本书时，你也应该记住，当我们讨论各种类型的网络安全威胁时，我们提到了应该采取的特定步骤和政策。本章中的政策旨在对书中已概述的任何内容进行补充。一个遗憾的事实是，有些组织在紧急情况下没有应对计划。你至少拥有一些可以实施的通用程序，这是至关重要的。\n\
  \n#### 定义访问控制\n安全策略中一个在任何组织中通常都会引起争议的重要领域是访问控制。用户希望对网络上的任何数据或资源无限制访问，与安全管理员希望保护这些数据和资源的愿望之间始终存在冲突。这意味着政策的极端化是不现实的。你不能尽可能完全地锁定每一个资源，因为这样做会阻碍用户访问这些资源。相反，你不能简单地允许任何人对所有内容完全访问。访问控制的核心是最小权限概念，该概念在[第\
  \ 1 章：计算机安全简介](ch01.html#introduction-to-computer-security）中介绍过。根据该概念，每个人获得的都是完成工作所需的最小权限，不多，也不少。\n\
  \n#### 开发策略\n\n\n\n\n许多 IT 部门都包含程序员和 Web 开发人员。遗憾的是，许多安全策略并没有涉及安全编程。无论你的防火墙、代理服务器、病毒扫描和策略有多强大，如果你的开发人员创建了有缺陷的代码，你将面临安全泄露。显然，安全编程这个主题可以单独写成一本书。尽管如此，我们也可以考虑一个简短的清单来定义安全开发策略。如果你的公司目前还没有安全编程倡议，使用这个清单也比比在真空状态下开发要好。它也可以作为一个起点，引导你开始思考和讨论安全编程：\n\
  \n- 所有代码，特别是由外部人员（承包商、顾问等）编写的代码，必须检查是否存在后门/特洛马。\n- 所有缓冲区都必须具有防止缓冲区溢出的错误处理机制。\n-\
  \ 所有通信（例如使用 `TCP sockets` 发送消息）都必须遵守贵组织的安全通信指南。\n- 任何打开端口或执行任何类型通信的代码都需要详尽的记录，并且必须通知\
  \ IT 安全部门该代码的内容、其功能以及如何被使用。\n- 所有输入都应该过滤掉可能辅助攻击的项目，例如 `SQL 注入攻击`。\n- 每个供应商都应该为你提供一份签名的文件，证明其代码中没有安全漏洞。\n\
  \n遵循这些指南不能保证不会向你的系统引入缺陷代码，但它会显著降低概率。遗憾的事实是，仅仅这些简单的步骤就比大多数组织所做的多了。查看安全策略的好地方是 SANS\
  \ 学院（[`www.sans.org/security-resources/policies/`](http://www.sans.org/security-resources/policies/)））。\n\
  \n# 标准、指南和程序\n\n与策略相关的是标准、指南和程序。所有这些文档都与安全策略相关并且实际上支持这些策略。`standard`（标准）是对预期操作水平的通用陈述。例如，要求\
  \ 99.5% 的网络可用性就是一种标准。`guideline`（指南）关于如何实现某些标准的通用性建议。指南是广泛的，而且有时是可选的（而非强制性的）。`procedures`（程序）是关于如何处理特定问题的具体指示。\n\
  \n## 数据分类\n对组织内部的信息进行分类至关重要。这一过程在与国防相关的机构和组织中很常见，但在民用领域较少。信息分类为员工提供了如何处理数据的指导。分类可以简单地分为两类：\n\
  \n- `Public information`（公共信息）是可以公开传播给任何人的信息。对于谁可以查看这些数据没有限制。\n- `Private information`（私有信息）仅供组织内部使用。此类信息可能会让公司尴尬、泄露商业秘密、揭露公司战略、暴露员工或客户的私人个人数据，或其他揭露贵组织不希望公开的信息。\n\
  \n这种数据分类的双级方法是非常基础的。大多数组织将有多个层级。每一层都根据信息泄露可能造成的损害来定义。我们将查看国防部的许可级别。这些为理解不同的安全分类提供了见解。即使你工作在完全的民用环境中，审查国防的方法也可以为你提供如何对数据分类以及如何正确评估哪些人员应拥有访问权的建议。\n\
  \n## DoD Clearance\n`secret`（秘密）和 `top secret`（机密）具有特定的含义。美国有一特定的分类体系。最低的是 `confidential`（机）。这类信息如果泄露，可能会损害国家安全。`secret`\
  \ 信息如果泄露，可能会对国家安全造成严重损害。`top secret` 信息如果泄露，预计将对国家安全造成极其严重的损害。还有另一种标记：`top secret\
  \ SCI`（`sensitive compartmented information`，敏感隔离间信息）。\n\n每种许可都需要不同级别的调查。`secret`\
  \ 许可需要全面的背景检查，包括犯罪记录、工作历史（过去 7 年）、信用检查以及对各个国家机构（国土安全部、移民局、国务院等）的核查。这种类型的背景检查被称为\
  \ `NACLC`，即 `National Agency Check with Law and Credit`（国家机构法律与信用检查）。`secret` 许可可能包含也可能不测谎仪。\n\
  \n正如你想象的样，top secret 许可更为严格。它涉及单范围背景调查（`SSBI`）——对主体及其配偶进行追溯至少 10 年的完整 `NACL`。它还涉及由经过培训的调查员进行的主体访谈。还需要对就业、教育、出生和国籍进行直接验证。至少需要四个推荐人，其中至少两个将接受调查员的采访。还会使用测谎仪。`SSBI`\
  \ 每 5 年重复一次。\n\n只有在完成完整的 `SSBI` 后才会分配 `SCI`。`SCI` 可能会有自己的评估访问权限的流程；因此，关于其涉及内容的标准描述并不可用。\n\
  \n# 灾难恢复\n在我们讨论灾难恢复之前，我们必须定义什么是灾难。`disaster`（灾难）是任何严重干扰组织运行的事件。关键服务器硬盘崩溃是灾难。其他例子包括火灾、地震、电信供应商故障、影响业务往来运输的罢工，以及黑客删除关键文件。任何可以严重干扰组织运行的事件都是灾难。\n\
  \n## 灾难恢复计划\n灾难恢复计划（`DRP`）是在灾难发生后使业务恢复正常运行的计划。`DRP` 必须包含若干项目。它必须处理人员问题，包括需要时能够找到临时人员，并能够联系你雇用的人员。它还包括为特定任务指定特定人员。你的\
  \ `DRP` 需要解决组织中负责以下任务：\n\n- 寻找替代设施\n- 将设备运送到这些设施\n- 安装和配置软件\n- 在新设施建立网络\n- 联系员工、供应商和客户\n\
  \n这些只是灾难恢复计划必须解决的部分领域。\n\n## 业务连续性计划\n业务连续性计划（`BCP`）与 `DRP` 类似，但重点不同。`DRP` 旨在尽快让组织恢复完全功能。`BCP`\
  \ 旨在让最基本的业务功能至少在某种程度上恢复运行，以便你进行某些类型的业务。一个例子是零售店的信用卡处理系统崩溃了。灾难恢复关注的是让系统恢复运行，而业务连续性关注的是仅仅获得一个临时解决方案，例如手动处理信用卡。\n\
  \n要成功制定 BCP，你必须考虑对你的业务至关重要的系统，并为这些系统宕机准备好替代方案。替代方案不需要完美，可行即可。\n\n## 影响分析\n\n\n\n\
  \n在创建真实的 DRP（灾难恢复计划）或 BCP（业务连续性计划）之前，你必须对特定灾难可能给组织造成的损害进行影响分析。这被称为`业务影响分析`或`业务影响评估`(BIA)。考虑\
  \ Web 服务器崩溃的情况：如果你的组织是一家电子商务企业，那么 Web 服务器崩溃就是一次非常严重的灾难。然而，如果你的业务是一家会计师，而网站只是新客户找到你的一种途径，那么\
  \ Web 服务器崩溃就没那么关键；在服务器宕机期间，你仍然可以经营业务并获得收入。你应该针对各种可能或合理的灾难制作一个表格，并对每种灾难进行基本的 BIA。\n\
  \nBIA 需要考虑的一个因素是最大可忍机时间（MTD）。在影响产生灾难性后果且业务可能无法恢复之前，特定系统可以宕机多久？另一个需要考虑的因素是平均修复时间（MTTR）。如果某个系统故障，修复它可能需要多久？这些因素帮助你确定特定灾难对业务的影响。\n\
  \n## 灾难恢复与业务连续性标准\n\n在制定 BCP 和 DRP 时，有某些标准可能对你有帮助。熟悉现有的标准可以帮助你制定自己的 DRP 和 BCP：\n\
  \n- `ISO 27035`：该标准关于事件响应。它要求有一种结构化的、计划化的方法来检测和报告事件，以及做出响应。\n- `NIST 800-61`：该标准关注于建立事件响应策略。它提供了关于事件响应团队、响应程序和相关项目的指导。\n\
  \n这两者都是良好的、通用的灾难恢复标准。其中任何一种都可以为你自己的灾难恢复规划提供基础。\n\n## 容错\n\n事实是，所有设备在某个时刻都会故障。因此，容错性至关重要。在最基本的水平，服务器的容错意味着备份。如果服务器故障，你是否备份了数据以便恢复它？虽然数据库管理员可能使用多种不同类型的数据备份，但从安全的角度来看，有三种主要的备份类型需要关注：\n\
  \n- `Full`（全备）：所有更改\n- `Differential`（差异备）：自上次全量备份以来的所有更改\n- `Incremental`（增量备）：自上次任何类型的备份以来的所有更改\n\
  \n考虑这样一种场景：你每天凌晨 2 点进行全量备份。但你担心在下一次全量备份之前可能发生服务器崩溃，所以你想每 2 小时备份一次。你选择的备份类型将决定执行这些频繁备份的效率以及恢复所需的时间。让我们考虑一下每种场景，以及如果系统在上午\
  \ 10:05 崩溃会发生什么：\n\n- `Full`：假设你在凌晨 4 点、6 点……上午 10 点进行全量备份，然后系统崩溃了。要进行恢复，你只需要恢复\
  \ 10 点完成的最后一次全量备份。这使得恢复过程变得简单得多。然而，每 2 小时运行一次全量备份非常耗时且消耗资源，并将对你的服务器性能产生重大的负面影响。\n\
  - `Differential`：假设你在凌晨 4 点、6 点……上午 10 点进行差异备份，然后系统崩溃了。要进行恢复，你需要恢复凌晨 2 点完成的最后一次全量备份，以及上午\
  \ 10 点完成的最新差异备份。这比全量备份策略稍微复杂一点。然而，这些差异备份每次执行时都会变大，因此会变得越来越耗时且消耗资源。虽然它们的影响没有全量备份那么大，但仍会减慢你的网络。\n\
  - `Incremental`：假设你在凌晨 4 点、6 点……上午 10 点进行增量备份，然后系统崩溃了。要进行恢复，你需要恢复凌晨 2 点完成的最后一次全量备份，然后是之后后的每次增量备份，并且必须按顺序恢复。这种恢复方式要复杂得多，但每个增量备份都很小，不会花费大量时间或消耗大量资源。\n\
  \n没有所谓的“最佳”备份策略。选择哪一种取决于你组织的需求。无论你选择哪种备份策略，都必须定期进行测试。测试备份策略的唯一有效方法是将备份数据实际恢复到测试机器上。\n\
  \n容错的另一个基本方面是 `RAID`，即独立磁盘冗余阵列。`RAID` 允许你的服务器拥有多个硬盘，这样如果主硬盘故障，系统也能继续运行。这里描述了主要的\
  \ `RAID` 级别：\n\n- `RAID 0 (条带化磁盘)`：`RAID 0` 将数据分布在多个磁盘上，以便在任何时刻都能提高速度。它没有容错性。\n\
  - `RAID 1 (镜像)`：`RAID 1` 镜像磁盘的内容，形成了一种 1:1 比例的实时备份。\n- `RAID 3 或 4 (带有专用校验的条带化磁盘)`：`RAID\
  \ 3` 或 `RAID 4` 将三个或多个磁盘组合，保护数据免受任何一个磁盘丢失的影响。通过向阵列中添加一个额外的磁盘并专门用于存储校验信息来实现容错。阵列的存储容量会减少一个磁盘。\n\
  - `RAID 5 (带有分布式校验的条带化磁盘)`：`RAID 5` 将三个或多个磁盘组合，保护数据免受任何一个磁盘丢失的影响。它与 `RAID 3` ，但校验信息不是存储在一个专用磁盘上，而是分散在阵列中。阵列的存储容量为磁盘数减去存储校验的空间。\n\
  - `RAID 6 (带有双校验的条带化磁盘)`：`RAID 6` 将四个或更多磁盘组合，保护数据免受两个磁盘丢失的影响。\n- `RAID 1+0 (或 10)`：`RAID\
  \ 1+0` 是一个先镜像的数据集 (`RAID 1`)，然后进行条带化 (`RAID 0`)，故名为 `1+0`。一个 `RAID 1+0` 阵列至少需要四个磁盘：两个镜像磁盘用于存储一半数据，另外两个镜像磁盘用于另一部分数据。\n\
  \n没有 `RAID 1` 的服务器是网络管理员的疏忽。`RAID 5` 实际上非常受欢迎。\n\n虽然 `RAID` 和备份策略是容错的核心问题，但任何备份系统都能提供额外的容错。这包括不间电源、备发电机和冗余\
  \ Internet 连接。\n\n### 零信任\n\nCrowdstrike 将零信任定义为“零信任是一种安全框架，要求无论组织内部还是外部的用户在授予或保持对应用程序和数据的访问之前，必须经过身份、授权并持续验证安全配置和状态。零信任假设不存在传统的网络边界；网络可以是本地的、云端的或混合，资源随处可见，人员也无处不在。”^(1)\n\
  \n^(1) [`www.crowdstrike.com/cybersecurity-101/zero-trust-security/`](https://www.crowdstrike.com/cybersecurity-101/zero-trust-security/)\n\
  \n这是一个很好的定义。零信任意味着没有特殊的或信任的系统。每台计算机都被视为从互联网连接的未知系统。你自己网络内的计算机也不会因为在你的网络中就被固有信任。\n\
  \nOracle^(2) 对零信任描述如下：\n\n^(2) [`www.oracle.com/security/what-is-zero-trust`](https://www.oracle.com/security/what-is-zero-trust)\n\
  \n1. 所有数据源和计算服务都 true 视为资源。\n\n2. 无论网络位置如何，所有通信都是安全的；网络位置并不意味着信任。\n\n\n\n\n3. 对单个企业资源的访问是基于每次连接授予的；在授予访问权限之前，会对请求者进行信任评估。\n\
  \n4. 资源的访问由策略决定，包括用户身份和请求系统的可观测状态，并可能包括其他行为属性。\n\n5. 企业确保所有拥有及相关的系统都处于尽可能安全的状态，并对系统进行监控以确保它们保持在尽可能安全的状态。\n\
  \n6. 用户身份验证是动态的，并在允许访问之前被严格执行；这是一个持续访问、扫描和评估威胁、适应以及持续身份验证的不断循环。\n\n存在一些用于规范零信任的标准。例如，`NIST\
  \ SP 800-207` 是零信任架构标准。此外还有 `NIST SP 800-205` 针对零信任的网络要求。熟悉此类标准将使实施零信任变得更加容易。\n\n\
  ### 重要法律\n\n不同国家、州和省都有许多计算机法律。熟悉你司法管辖区相关的法律是非常重要的。然而，在美国，有几项法律是最关重要的。我们在这里讨论其中的每项法律。\n\
  \n#### HIPAA\n\n《健康保险流通与与责任法案》（`HIPAA`）是一项法规，强制了个人医疗信息的存储、使用和传输的国家标准和程序。`HIPAA`于\
  \ 1996 年通过法律，给医疗记录管理带来了了巨大的变化。\n\n`HIPAA` 涵盖三个领域——患者记录的机密性、隐私性和安全性，并分阶段实施以缓解过渡。患者记录的机密性和隐私必须在指定日期前实施，随后是患者记录的安全性。医疗记录传输中的事务代码标准也必须在给定日期前完成。\n\
  \n违反 `HIPAA` 的惩罚非常严厉：根据情况，罚金可能高达 `$250,000`。医疗机构被要求任命一名安全官。所有相关方（如计费机构和医疗记录存储设施）都必须遵守这些规定。\n\
  \n#### 萨班斯-奥克斯利法案 (Sarbanes-Oxley)\n\n《萨班斯-奥克斯利法案》是 2002 年生效的立法，为财务实践监管和公司治理引入了重大变化。该法以保罗·萨班斯（Paul\
  \ Sarbanes）参议员和迈克尔·奥克斯利（Michael Oxley）代表的名字命名，旨在提高上市公司的责任感。\n\n该立法主要关注财务问题，但也影响了负责存储公司电子记录的\
  \ IT 部门。《萨班斯-奥克斯利法案》规定，所有业务记录（包括电子记录和电子信息）必须保存“至少五年”。不合规的后果是罚款、监禁或两者兼有。\n\n####\
  \ 支付卡行业数据安全标准\n\n虽然这不是法律，但支付卡行业数据安全标准（`PCI DSS`）无疑是任何处理信用卡和借记卡的公司的 IT 安全专业人员应该熟悉的。`PCI\
  \ DSS` 是一种针对处理 `Visa`、`MasterCard`、`American Express` 和 `Discover` 等主要公司品牌信用卡的组织的私有信息安全标准。\n\
  \n## 总结\n\n在本章中，你学到了技术本身不足以确保网络安全。你必须拥有清晰且具体的策略，详细说明你网络中的程序。这些策略必须涵盖员工计算机资源的使用、新入员工、离职员工、访问权限、如何应对紧急情况，甚至应用程序和网站代码的安全性。\n\
  \n用户身份验证是动态的，并在允许访问之前被严格执行；这是一个持续访问、扫描和评估威胁、适应以及持续身份验证的不断循环。你学到了技术本身不足以确保网络安全。你必须拥有清晰且具体的策略，详细说明你网络中的程序。这些策略必须涵盖员工计算机资源的使用、新入员工、离职员工、访问权限、如何应对紧急情况，甚至应用程序和网站代码的安全性。\n\
  \n### 测试你的技能\n\n#### 多选题\n\n1. 下列哪项没有体现零信任？\nA. 杀病毒软件无法防止受感染的文件。\nB. 端用户需要。\nC.\
  \ 端用户为了。\nD. 技术安全措施在之上。\n\n2. 哪些标准对 Grace 帮助最大？\nA. `NIST 171`\nB. `NIST 800-61`\n\
  C. `NIST 800-207`\nD. `NIST 800-53`\n\n3. 下列哪项不是用户策略的示例？\nA. 用户不能保留密码副本。\nB. 密码长度必须为\
  \ 8 个字符。\nC. 即时消息程序实际上可能是一个木马。\nD. 用户不能共享。\n\n4. 如果员工认为她的密码已泄露给他人，她应该做什么？\nA. 如果是信任的，直接忽略它。\n\
  B. 立即更改密码。\nC. 通知 IT 部门。\nD. 忽略它。\n\n5. 考虑安全性时最合适的标准是？\nA. `ISO 27002`\nB. `NIST\
  \ 800-61`\nC. `NIST 800-205`\nD. `NIST 800-207`\n\n6. 下列哪项是禁止用户安装软件的最佳理由？\nA. 他们可能安装错误，这可能会给工作站带来安全问题。\n\
  B. 他们可能会安装绕过安全措施的软件。\nC. 软件安装通常复杂，应由专业人员完成。\nD. 如果用户账户没有安装权限，那么他们的账户下可能不会安装木马。\n\
  \n7. 下列哪项不是即时消息带来的重大安全风险？\nA. 员工可能会发送骚扰信息。\nB. 员工可能会发送机密信息。\nC. 病毒或虫可能通过即时消息感染工作站。\n\
  D. 即时消息程序实际上可能是一个木马。\n\n8. 所有用户策略为了有效，必须具备什么？\nA. 必须经过律师审查。\nB. 必须说明后果。\nC. 必须经过公证。\n\
  D. 必须妥善归档和维护。\n\n9. 下列哪项是新员工的正确事件顺序？\nA. 通知 IT 新员工及所需资源 > 员工获得这些资源的访问权限 > 员工接受安全/可接受用途的简报\
  \ > 员工签名确认收到安全规则副本。\nB. 通知 IT 新员工及请求的权限 > 员工获得这些资源的访问 > 员工签名确认收到安全规则副本。\nC. 通知 IT\
  \ 新员工并分配默认权限 > 员工接受安全/可接受用途的简报 > 员工签名确认收到安全规则副本。\nD. 通知 IT 新员工并分配默认权限 > 员工签名确认收到公司安全规则。\n\
  \n\n\n\n\n[10]. 以下关于离职员工的适当事件顺序是：\n\nA. `IT` 收到离职通知 > 关闭所有登录账户 > 禁用所有访问（物理和电子设备）。\n\
  \nB. `IT` 收到离职通知 > 关闭所有登录账户 > 禁用所有访问（物理和电子设备） > 对员工的工作站进行搜索/扫描。\n\nC. `IT` 收到离职通知\
  \ > 关闭所有物理访问 > 关闭所有电子访问。\n\nD. `IT` 收到离职通知 > 关闭所有电子访问 > 关闭所有物理访问。\n\n[11]. 以下关于变更请求的适当顺序是：\n\
  \nA. 业务部门经理请求变更 > `IT` 部门验证请求 > 执行请求。\n\nB. 业务部门经理请求变更 > `IT` 部门验证请求 > 安全部门验证请求\
  \ > 按照包含回滚计划安排请求 > 执行请求。\n\nC. 业务部门经理请求变更 > `IT` 部门验证请求 > 按照包含回滚计划安排请求 > 执行请求。\n\
  \nD. 业务部门经理请求变更 > `IT` 部门验证请求 > 安全部门验证请求 > 执行请求。\n\n[12]. 发现机器被病毒感染时，第一步是什么？\n\n\
  A. 记录事件。\n\nB. 扫描并清理被感染的机器。\n\nC. 通知适当的管理层。\n\nD. 隔离被感染的机器。\n\n[13]. 访问控制的规则是什么？\n\
  \nA. 在安全范围内授予尽可能多的权限\n\nB. 在工作要求允许授予最少的访问权限\n\nC. 为所有用户授予标准访问权限\n\nD. 对大多数用户严格限制访问权限\n\
  \n[14]. 在技术层面处理任何安全漏洞后，针对该漏洞最后要执行的一件事是什么？\n\nA. 隔离感染的机器。\n\nB. 研究漏洞以学习如何防止再次发生。\n\
  \nC. 通知管理层。\n\nD. 记录事件。\n\n[15]. 以下在所有安全代码中应实施的项目列表是：\n\nA. 所有代码都检查了后门或木马，所有缓冲区均有错误处理以防止缓冲区溢出，所有通信活动都有详尽记录。\n\
  \nB. 所有代码都检查了后门或木马，所有缓冲区均有错误处理以防止缓冲区溢出，所有通信均符合组织指南，所有通信活动都有详尽记录。\n\nC. 所有代码都检查了后门或木马，所有缓冲区均有错误处理以防止缓冲区溢出，所有通信均符合组织指南。\n\
  \nD. 所有代码都检查了后门或木马，所有通信均符合组织指南，所有通信活动都有详尽记录。\n\n### 练习\n\n这些练习均旨在让学生获得编写部分策略的经验。这些练习共同构成了一份针对大学校园计算机网络的完整策略策略。\n\
  \n#### 练习 10.1：用户策略\n\n使用本章提供的指南（以及根据需要使用的其他资源），创建一个定义用户策略的文档。这些策略应明确定义所有人员可接受和不可接受的行为。你可能需要为行政人员、教职人员和学生制定单独的策略。\n\
