  \n## 数据传输\n\n我们已经简要查看了物理连接方法；但数据实际上是如何传输的？为了传输数据，会发送数据包。电缆的基本目的是将包从一台机器传输到另一台机器。数据包是文档、视频、图像还是计算机的内部信号并不重要。那么，数据包到底是什么？正如我们之前讨论过的，计算机中的一切最终都存储为\
  \ 1 和 0，被称为*位* (bits)，它们被一组一组，每组称为*字节* (byte)。数据包是特定数量的字节，分为头部和正文。头部是数据包开头的 20 个字节，告诉我们包来自哪里、去向哪里以及其他信息。正文包含了你想发送的二进制格式实际数据。\n\
  \n\n\n\n\n这些协议中的每一个都将在本书的后续章节中根据需要进行更详细的解释。你还需要注意，此列表并不完整，因为还有几十种其他协议；但这些是我们将在书中讨论的基础协议。所有这些协议都是称为\
  \ `TCP/IP`（传输控制协议/互联网协议）协议族的一部分。但无论使用哪种特定协议，网络上的所有通信都是通过数据包进行的，而这些数据包根据正在发生的通信类型按照特定的协议进行传输。\n\
  \n## 端口\n\n你可能好奇端口是什么，特别是我们已经提到过位于计算机背面的端口，例如串口端口、并行端口以及 RJ-45 端口。在网络术语中，端口是一个句柄或连接点。它是特定通信路径的数字标记。你可以将端口视为电视上的通道。你可能有一根电缆接入电视，但你可以调谐到各种频道。你的计算机上有\
  \ 65535 个网络端口。无论计算机类型或操作系统，这都是真实的。计算机的 IP 地址和端口号组合被称为 `socket`。所有网络通信都通过 `NIC` 连接到你的计算机。因此，我们所描绘的图，是通过电缆以及可能的集线机或路由器连接的机器。\n\
  \n## 互联网的工作原理\n\n现在你已经对计算机如何在网络上通信有了基本的概念，是时候讨论互联网是如何运作的。互联网本质上是相互连接的大量网络。因此，互联网的工作方式与本地网络完全相同。它使用相同的协议发送相同类型的数据包。这些网络简单的连接到主干（`backbones`）。主干相互连接的点被称为网络接入点（`NAPs`）。当你登录互联网时，可能使用一个互联网服务提供（`ISP`）。该\
  \ ISP 有一个主干。所以，登录互联网是将你的计算机连接到 ISP 网络的过程。\n\n### IP 地址\n\n在数万个网络和数百万台计算机进行通信并发送数据时，产生了一个预测问题。这个问题是确保数据包传递到正确的计算机。这项任务以类似于传统“邮寄”的方式完成：在网络通信中，这个地址是特殊的，被称为“IP”地址。IP\
  \ 地址可以是版本 4 或版本 6。\n\n### IPv4\n\n`IP 地址` 是由点分隔的一系列四个值（例如 107.22.98.198）。每个三位数数字必须在\
  \ 0 到 255 之间；因此，107.22.98.466 是无效的。这些地址实际上是四个二进制数字，通常被称为 `octets`（字节节）。IPv4 地址中有四个字节节。记住，一个字节是\
  \ 8 位（0 和 1），转换成十进制格式的二进制数字将在 0 到 255 之间。所以你不需要自己计算，这告诉你总共有 42 亿个可能的 IP 地址。不过，你不必担心\
  \ IP 地址会用尽。在之后会讨论方法来扩展地址的使用。\n\n#### 参考：转换二进制数字\n\n对于不熟悉十进制转二进制的读者，有几种方法，在这里显示了其中一种。你应该，在\
  \ IP 地址的情况下，计算机会为你完成，但这里有一种可能是最简单的方法：重复除以 2，使用`余数`，直到得到 1。例如，将十进制 31 转换为二进制：\n\n\
  ```\n31/2 = 15 余 1\n15/2 = 7 余 1\n7/2 = 3 余 1\n3/2 = 1 余 1\n1/2 = 0 余 1\n```\n\n\
  现在从下到上读取余数：二进制等值为 11111。\n\nIP 地址分为两类：公有和私有。公有 IP 地址用于连接互联网的计算机。任何两个公 IP 地址不能相同。然而，私有\
  \ IP 地址（例如私有公司网络）只需要在该网络是唯一的。世界上其他计算机是否有相同的 IP 地址无关，因为这台计算机从未连接到全球其他计算机。网络管理员经常使用以\
  \ 10 开头的私有 IP 地址，例如 `10.102.230.17`。\n\n还需要指出，ISP 通常会购买一组公 IP 地址并在你登录时分配给你。一个 ISP\
  \ 可能拥有 1000 个公 IP 地址和 10000 个客户。由于 10000 个客户不会同时在线，ISP 只在客户登录时分配 IP 地址，并在客户注销时收回。\n\
  \n计算机的地址包含了许多关于该计算机的信息。地址中的第一个字节（或第一个十进制数字）告诉该机器属于哪类网络。表 2.5 总结了这五类网络。\n\n**表 2.5\
  \ 网络分类**\n\n![Images](img/02tab05.jpg)\n\n这五类网络在本书的后部分将变得更加重要（如果你决定更深入地学习网络）。仔细观察表\
  \ 2.4，你可能会发现 127 的 IP 范围没有列出。遗漏是因为该范围被保留用于测试。`127.0.0.1` 的 IP 地址指定了你所在的机器，无论该机器分配的\
  \ IP 地址是什么。这个地址通常被称为 `loopback address`（回环地址）。该地址将经常用于测试你的机器和你的 `NIC`。我们将在本章稍后的“基础网络实用工具”部分检查它的用法。\n\
  \n这些特定类别很重要，因为它们告诉你地址的哪部分代表网络，哪部分代表节点。例如，在 A 类地址中，第一个字节节代表网络，其余三个字节节代表节点。在 B 类地址中，前两个字节节代表网络，后两个代表节点。最后，在\
  \ C 类地址中，前三个字节节代表网络，最后一个字节节代表节点。\n\n还有一些你应该注意的非常具体的 IP 地址和 IP 地址范围。如前所述，第一个是 `127.0.0.1`，或回环地址。这是指代你所处机器网卡的另一种方式。\n\
  \n私有 IP 地址是另一个需要注意的问题。某些 IP 地址范围被指定用于网络内部。这些地址不能作为公 IP 地址，但可以用于内部工作站和服务器。这些 IP 地址为：\n\
  \n- 10.0.0.10 到 10.255.255.255\n- 172.16.0.0 到 172.31.255.255\n- 192.168.0.0 到 192.168.255.255\n\
  \n\n\n\n\n有时刚接触网络的人很难理解公 IP 地址和私有 IP 地址。很好的类比是办公大楼。在同一栋办公大楼内，每个办公室编号必须是唯一的。你只能有一个\
  \ 305 室。而且在那栋大楼里，如果你讨论 305 室，大家立刻就能清楚你在说什么。但还有其他的办公大楼，其中许多大楼也有自己的 305 室。你可以将私有 IP\
  \ 地址想象成办公室编号。它们在自己的网络内必须是唯一的，但其他网络可能具有相同的私有 IP 地址。\n\n公 IP 地址更像传统的邮寄地址：它们在全球范围内是唯一的。在办公室之间通信时，你可以使用办公室编号，但要将信件寄到另一栋大楼，必须使用完整的邮寄地址。网络的原理也是如此。你可以使用私有\
  \ IP 地址在网络内部通信，但要与网络外的任何计算机通信，你必须使用公 IP 地址。\n\n网关路由器的作用之一是执行网络地址转换 (`NAT`)，这涉及将输出数据包上的私有\
  \ IP 地址替换为网关路由器的公 IP 地址，以便数据包可以通过互联网进行路由。\n\n## 子网划分\n\n我们已经讨论过 IPv4 网络地址了；现在让我们关注子网划分。如果你已经熟悉了这个主题，可以随时跳过本节。由于某种原因，这个主题往往给网络类学生带来很大麻烦，因此我们将从概念理解开始。`Subnetting`\
  \ 简单来说是将网络切割成更小的部分。例如，如果你有一个使用 IP 地址 `192.168.1.x` 的网络（其中 `x` 是特定计算机的地址），你就分配了 255\
  \ 个可能的 IP 地址。如果你想将其划分为两个独立的子网络怎么办？子网划分就是实现这一点的的方法。\n\n从技术角度上说，子网掩码是一个 32 位数，分配给每个主机，用于将\
  \ 32 位的二进制 IP 地址分为网络部分和节点部分。你不能随意输入任何数字。子网掩码的第一个值必须是 255；剩余三个值可以是 255、254、252、248、240\
  \ 或 224。你的计算机将获取你的网络 IP 地址和子网掩码，并使用二进制与（AND）操作将它们结合。\n\n你可能会惊讶地发现，即使你没有进行子网划分，你也拥有子网掩码。如果你有一个\
  \ C 类 IP 地址，那么你的网络子网掩码是 `255.255.255.0`。如果你有一个 B 类 IP 地址，那么你的子网掩码是 `255.255.0.0`。最后，如果是\
  \ A 类，你的子网掩码是 `255.0.0.0`。\n\n现在考虑这些数字与二进制的关系。十进制值 `255` 转换为二进制 `11111111`。因此你实际上是在“掩码”网络地址中用于定义网络的部分，而剩余部分则用于定义单个节点。现在，如果你希望子网中的节点少于\
  \ 255 个，那么你的子网就需要类似 `255.255.255.240` 的值。\n\n### CIDR\n\n子网划分允许更灵活地分配 IP 地址。这被称为无类域间路由\
  \ (`CIDR`)。`CIDR` 不使用固定类别，而是使用前缀长度来指示地址中的网络部分。例如，`192.168.1.0/24` 意味着前 24 位是网络。\n\
  \n这是 IPv6 的精髓。IPv6 不涉及传统意义上的子网划分，但它确实使用了 `CIDR`。网络部分由斜杠后跟地址中分配给网络的位数来指示，例如：\n\n\
  - `/48`\n- `/64`\n\n## IPv6\n\n你仍然拥有与 IPv4 使用的所有工具。然而，在 `ping` 或 `traceroute` 之后有一个数字\
  \ `6`，所以如果你的计算机启用了 IPv6，你可以使用以下命令：\n\n```\nping6 www.yahoo.com\n```\n\n我们将在本章后部分讨论\
  \ `ping`、`traceroute` 和其他命令。\n\n### 关键地址类型\n\n- **链路/本地本地地址 (Link/machine-local\
  \ address)**：这是 IPv4 `APIPA`（自动私有 IP 地址分配）的 IPv6 版本。如果机器配置为动态分配地址且无法与 DHCP 服务器通信，它会为自己分配一个通用\
  \ IP 地址。`DHCP`（动态主机协议）用于在网络内动态分配地址。IPv6 链路/本地本地地址都以 `fe80::` 开头。\n- **站点/网络本地地址\
  \ (Site/network-local address)**：这是 IPv4 私有地址的 IPv6 版本。站点/网络本地地址是真实的 IP，但它们仅在本地网络有效，无法在互联网上路由。所有站点/网络本地\
  \ IP 地址以 `FE` 开头，第三个十六进制数字为 `C` 到 `F`：`FEC`、`FED`、`FEE` 或 `FEF`。\n- **环回地址 (Loopback\
  \ address)**：IPv6 有环回地址，可以写为 `::/128`。\n\n### 配置\n\n- **托管配置标志 (M flag)**：当 `M flag`\
  \ 设置为 1 时，设备应使用 `DHCPv6` 获取状态的 IPv6 地址。\n- **其他状态配置标志 (O flag)**：当 `O flag` 设置为\
  \ 1 时，设备应使用 `DHCPv6` 获取其他 TCP/IP 配置。换句话说，它应该使用 DHCP 服务器设置网关 IP 地址和 DNS 服务器等项目。\n\
  - **M flag**：这表示机器应使用 `DHCPv6` 获取 IP 地址。\n\n\n\n\n连接到互联网服务提供商（ISP）后，你自然会想要访问一些网站。你可能会在浏览器的地址栏中输入名称，而不是\
  \ IP 地址。例如，你可能会输入 [www.chuckeasttom.com](http://www.chuckeasttom.com) 来访问我的网站。你的计算机或你的\
  \ ISP 必须将你输入的名称（称为 `uniform resource locator` `URL`）翻译为 IP 地址。在表 2.4 中提到的 `DNS`\
  \ 协议处理了这一翻译过程。因此，你输入的是对人类有意义的名称，但你的计算机正在使用相应的 IP 地址进行连接。如果找到了该地址，你的浏览器将向 80 端口发送一个数据包（使用\
  \ `HTTP`）。如果该目标计算机具有监听并响应此类请求的软件（例如，如 `Apache` 或 `Microsoft Internet Information\
  \ Server` 等网络服务器软件），那么目标计算机就会响应浏览器的请求，并建立通信。这就是查看网页的方法。\n\n当你收到“Error 404: File\
  \ Not Found”（错误 404：未找到文件）时，你看到的是你的浏览器收到了一个来自网络服务器的错误代码为 404 的数据包，表示你请求的页面无法找到。网络服务器可以向你的\
  \ Web 浏览器发送一系列错误消息，以指示不同的情况。其中许多问题由浏览器自行处理，你永远不会看到错误消息。400 系列中的所有错误消息都是 `client\
  \ errors`（客户端错误）。这个术语意味着是在你这一端出了问题，而不是网络服务器的问题。500 系列的消息是 `server errors`（服务器错误），意味着网络服务器端存在问题。100\
  \ 系列消息仅为信息性；200 系列消息表示成功（你通常看不到这些，浏览器只是简单地了它们）；300 系列消息是重定向，意味着你正在寻找的页面已移动，你的浏览器随后会被重定向到新位置。\n\
  \n使用电子邮件的工作与访问网站一样。你的电子邮件客户端将寻找电子邮件服务器的地址。然后，你的电子邮件客户端将使用 `POP3` 获取收件邮件，或使用 `SMTP`\
  \ 发送发件邮件。你的电子邮件服务器（可能位于你的 ISP 或你的公司）随后将尝试解析你发送的地址。如果你向 chuck@chuckeasttom.com 发送内容，你的电子邮件服务器会将该电子邮件地址翻译为\
  \ [yahoo.com](http://yahoo.com) 电子邮件服务器的 IP 地址，你的服务器会将你的邮件发送那里。请注意，虽然有新的电子邮件协议可用，但\
  \ `POP3` 仍然是最常用的。\n\n许多读者可能对聊天室熟悉。聊天室与我们讨论过的其他通信方式一样，通过数据包运行。你首先找到聊天室的地址，然后进行连接。这里的区别在于，你计算机上的聊天软件会不断地往返发送数据包，而电子邮件只在你指示它发送时（或在预定的时间间隔内）才发送和接收。\n\
  \n记住，数据包包含一个头部部分，该头部包含你的 IP 地址和你要去的目的 IP 地址（以及其他信息）。随着本书的进行，这种数据包结构将变得非常重要。\n\n\
  ### 什么是数据包？\n\n我们提到了网络数据包以及它们如何通过网络和互联网进行路由。我们还没有讨论的是数据包究竟是什么。你可能知道网络流量实际上大量的 1\
  \ 和 0，这些 1 和 0 又被传输为电压（通过双绞线 UTP）、光波（通过光纤）或射频（通过 Wi-Fi）。数据被分成小块，称为 `packets`。\n\n\
  一个数据包被分为三个部分：头部（实际上至少有三个头部，我们稍后会提到）、数据和尾部。头部包含了关于如何对数据包寻址、它是什么类型的数据包以及相关数据。数据部分显然是你想要发送的信息。尾部的作用是显示数据包在何处结束并提供错误检测。\n\
  \n正如刚才提到的，通常至少有三个头部。在正常通信中，一个数据包通常有一个 `Ethernet`（以太网）头部、一个 `TCP` 头部和一个 `IP` 头部。每个头部包含不同的信息。它们结合在一起包含了一些对于取证调查非常有意义的信息。\n\
  \n让我们从 `TCP` 头部开始。它包含与 OSI 模型传输层相关的信息（我们将在本章的晚些部分讨论 OSI 模型）。它包含通信的源端口和目的端口。它还有数据包编号，例如\
  \ 21 个中的第 10 个。\n\n还有一个 `IP` 头部。最明显且用的信息是源地址和目的地址。`IP` 头部具有源 IP 地址、目的 IP 地址和协议。`IP`\
  \ 头部还有一个版本号，显示这是版本 4.0 还是 6.0 的 IP 数据包。`size` 变量描述数据段的大小。还有关于此数据包所代表协议的信息。\n\n`Ethernet`\
  \ 头部包含有关源 MAC 地址和目的 MAC 地址的信息。当数据包到达其旅程中的最后一个网络段时，使用 MAC 地址来找到数据包要发送到的 `NIC`（网卡）。\n\
  \n### 基础通信\n\n上一节描述的数据包头部还包含一些信号位。这些是单比特标志，通过开启来指示某种类型的通信。正常的网络会话从一方发送一个开启了 `SYN`（同步）位的数据包开始。目标以同时开启\
  \ `SYN` 和 `ACK`（确认）位进行响应。然后发送者仅开启 `ACK` 位，通信开始。一段时间后，发送者通过发送开启了 `FIN`（结束）位的数据包来终止通信。\n\
  \n某些攻击依赖于发送畸形数据包。例如，在常见的拒绝服务（DoS）攻击中，`SYN flood` 是向目标大量 `SYN` 数据包但不对返回的 `SYN/ACK`\
  \ 做出响应。某些会话劫持攻击使用 `RST` 命令来帮助劫持通信。\n\n### 互联网历史\n\n到这里，你应该对网络和互联网如何工作有了基本的理解，并对\
  \ IP 地址、协议和数据包有所了解。了解互联网的历史也是帮助的，许多人发现这种概述将目前学到的材料放在了历史背景下。\n\n互联网的根源可以追溯到冷战。冷战的一个积极方面是，它是一个科学技术投入巨大的时期。1957\
  \ 年，在苏联发射斯普尼卫星后，美国政府在国防部成立了高级研究计划局（ARPA`）。`ARPA` 的唯一目标是资助和促进技术研究。显然，这个目标会包括武器技术，但总目标也包括通信技术。\n\
  \n\n\n1972 年在多个意义上都是互联网发展的一个里程碑。那一年，ARPA 被更名为 DARPA，即国防高级研究计划局。同年，雷·托姆林森（Ray Tomlinson）发明了第一个电子邮件程序。此时，在\
  \ ARPANET 出生四年后，网络上共有 23 台主机（`host`）。`host` 是一台存有数据且你可以与之连接的机器；例如，Web 服务器就是一个 `host`）。\n\
  \n接下来的一年，即 1973 年，标志着 `TCP/IP` 的诞生，这种协议允许不同的计算机无论其硬件或操作系统如何，都能以统一的方式进行通信。\n\n1974\
  \ 年，文文斯·瑟夫（Vince Cerf）发表了一篇关于 `TCP` 的论文，并在计算机历史上首次使用了 `Internet` 一词。1976 年，以太网电缆被开发出来（我们今天使用的相同的布线），DARPA\
  \ 开始要求在其网络上使用 `TCP/IP`。那一年也标志着 `UNIX` 操作系统开始广泛分发。`UNIX` 和互联网的发展在未来的多年里一直紧密相随。到此时，在\
  \ ARPANET 出生 8 年后，网络上已有 111 台主机。\n\n1979 年发生了一项重大进展：Usenet 新闻组的诞生。这些小组本质上是向全世界开放的公告板。（今天，你可以通过新闻组阅读器软件或通过访问\
  \ [www.google.com](http://www.google.com) 并选择“Groups”来访问这些小组。有成千上万专注于各种想象的主题的新闻组。）仅\
  \ 2 年后，国家科学基金会（NSF）为不属于 ARPANET 的大学和研究中心创建了 `CSNET`。同年，瑟夫建议将 `CSNET` 和 ARPANET 连接起来。到\
  \ 1981 年，威斯康星大学创建了 `DNS`（域名系统），以便人们可以通过名称而不是实际 IP 地址来查找网络上的节点。此时，网络上有 562 台主机。\n\
  \n20 世纪 80 年代初见证了早期互联网的巨大增长。DARPA 将其 ARPANET 分为军事和非军事段，并允许更多人使用非军事段。NSF 引入了 `T1`\
  \ 线路（一种非常快的连接）。1986 年，互联网工程任务组（IETF）成立，负责监督互联网及互联网协议标准的制定。此时，互联网已包含 2308 台主机。\n\n\
  1990 年被证明是互联网发展的关键年份。那一年，在欧洲核子研究组织（CERN）工作的蒂姆·伯纳斯-李（Tim Berners-Lee）开发了超文本传输协议（`HTTP`），并向世界提供了首批网页。通过\
  \ `HTTP` 和超文本标记语言（`HTML`），人们可以在互联网上发布想法，让任何有连接的人都能查看。到 1990 年，互联网上有超过 300,000 台主机。（快进到\
  \ 2004 年：蒂姆·伯纳斯-李因其对技术的贡献获得了首届千禧奖。他被广泛认为是世界维网 [`WWW`] 之父。）\n\n互联网的增长和活动在 20 世纪 90\
  \ 年代爆发爆发。1992 年，CERN 向世界发布了网页发明。1993 年，第一个图形化浏览器 `Mosaic` 发布。1994 年，微软推出了 `Internet\
  \ Explorer`。1995 年，`Netscape Navigator` 随之推出。1998 年，`Google` 成立。2001 年，`Wikipedia`\
  \ 上。2004 年，`Facebook` 成立。2005 年，`YouTube` 上。2007 年，`iPhone` 。\n\n\n\n\n此图告诉你，一个\
  \ 32 字节的回显包已发送到目的地并返回。`TTL`（生存时间）项目显示了数据包在放弃之前到达目的地需要经过多少个中间步骤（或称为 `hops`）。请记住，互联网是由互连网络组成的庞大集合。你的数据包可能不会直接到达目的地；它需要经过几个\
  \ `hops` 才能那里。与 `IPConfig` 一样，你可以输入 `ping -?` 来查找各种优化 `ping` 的方法。\n\n#### `Tracert`\n\
  \n下一个命令是 `tracert` 命令。这个命令某种程度上是 `ping` 的豪华版。`tracert` 不仅能告诉你数据包是否到达目的地以及花费了多久，还会告诉你它到达那里所经过的所有中间跳数。这个工具在本书的后续部分将对你非常有用。图\
  \ 2.5 展示了到 [www.yahoo.com](http://www.yahoo.com) 的 `tracert`。（同样的命令也可以在 Linux 或\
  \ UNIX 中执行，但在那里被称为 `traceroute` 而不是 `tracert`。）\n\n![Description: 命令行窗口中显示了 tracert\
  \ 命令的几种选项。www.yahoo.akadns.net 的跟踪路由显示了数据包目的地的细节、传输时间以及它经过的所有中间跳数。](img/02fig05.jpg)\n\
  \n**图 2.5** `Tracert`。\n\n通过 `tracert`，你可以看到（以毫秒为单位）的每个中间步骤的 IP 地址以及到达该步骤所需的时间。了解到达目的地所需的步骤可能非常重要，正如你将在本书后面看到的那样。\n\
  \n当然，在处理网络通信时，还有其他工具可以帮助你。然而，我们刚刚检查的三个——`IPConfig`、`ping` 和 `tracert` 是核心工具。这三个工具对于任何网络管理员来说都是至关重要的，你应该将它们记在心里。\n\
  \n#### `Netstat`\n\n`Netstat` 是另一个有趣的命令。它是 network status（网络状态）的缩写。基本上，这个命令告诉你的计算机目前拥有哪些连接。如果你看到多个连接，不要惊慌；这并不意味着黑客进入了你的计算机。你会看到许多私有\
  \ IP 地址。这意味着你的网络正在进行内部通信。你可以在图 2.6 中看到这一点。\n\n![Description: 命令行窗口中显示了 netstat 命令的几种选项。此命令显示了计算机所有活动连接的细节，如协议、本地地址、远程地址和状态。这还包括一些私有\
  \ IP 地址。](img/02fig06.jpg)\n\n**图 2.6** `Netstat`。\n\n#### `NSLookup`\n\n`nslookup`\
  \ 是 name server lookup（名称服务器查询），用于连接到你网络的 DNS 服务器。它通常仅用于验证 DNS 服务器是否正在运行。它也可以用于执行命令。回想第\
  \ 1 章中的计算机安全简介，我们讨论过 DNS 投毒。第一步之一就是查看 DNS 服务器是否运行。图 2.7 显示了 `nslookup` 的示例：\n\n\
  ```\nnslookup\n```\n\n![Description: 命令行窗口中显示了 nslookup 命令的几种选项。此命令显示了 DNS 服务器的细节。](img/02fig07.jpg)\n\
  \n**图 2.7** `nslookup`。\n\n#### `ARP`\n\n地址协议 (`ARP`）用于将 IP 地址映射到 MAC 地址。图 2.8 显示了\
  \ `arp` 的用法。\n\n![Description: 命令行窗口中显示了 arp 命令的几种选项。此命令显示 ARP 表。](img/02fig08.jpg)\n\
  \n**图 2.8** `arp`。\n\n#### `Route`\n\n`route` 命令用于查看路由表。图 2.9 显示了 `route` 的输出。\n\
  \n![Description: 命令行窗口中显示了 route 命令的几种选项。此命令显示路由表。](img/02fig09.jpg)\n\n**图 2.9**\
  \ `route`。\n\n#### `PathPing`\n\n`PathPing` 提供了与 `tracert` 和 `ping` 类似的信息。图 2.10\
  \ 显示了 `pathping` 的示例：\n\n```\npathping -n -h -g -p -q -w -T -R -s TargetName\n```\n\
  \n![Description: 命令行窗口中显示了 pathping 命令的几种选项。此命令显示 pathping 结果。](img/02fig10.jpg)\n\
  \n**图 2.10** `PathPing`。\n\n### 其他网络设备\n\n网络中还涉及其他设备，用于保护你的计算机免受外界影响，其中一些在第 1 章中简要提到。现在我们将更详细地回顾几个。\n\
  \n防火墙本质上是你的网络与互联网其余之间的屏障。个人电脑（PC）可以作为防火墙；在许多情况下，特殊路由器可以作为防火墙。防火墙使用各种技术来保护你的网络，但常用的策略是数据包过滤。在数据包过滤防火墙中，每个数据包都会经过检查。只有符合你设置的标准的数据包才允许通过。许多操作系统，如\
  \ Windows（XP 之后的所有版本）和许多 Linux 发行版，都包含了基础的数据包过滤软件。\n\n另一种非常常见的防御设备是代理服务器。代理服务器几乎总是一台独立的计算机。你可能会看到同一台机器同时用作代理服务器和防火墙。代理服务器的目的非常简单：它从外部世界隐藏你的整个网络。试图从外部调查你网络的人只能看到代理服务器。他们看不到你网络中的实际机器。当数据包离开你的网络向外发送时，它们的头部会被修改，使数据包的返回地址变为代理服务器的地址。反，你访问外部世界的唯一方式是通过代理服务器。代理服务器和防火墙提供了基本的网络安全。坦率地说，运行一个既没有防火墙也没有代理服务器的网络是失职的。\n\
  \n\n\n\n本节讨论的主题并不是你理解本书的绝对必要条件，但它们将帮助你对通用网络有更广泛的理解。如果你打算在专业层面深入研究网络安全，那么你将需要这些信息以及更多内容。\n\
  \n## OSI 模型\n\n让我们从 `OSI model`（或称为开放系统互连模型）开始，它描述了网络是如何通信的。它概述了各种协议和活动，并告诉我们这些协议和活动之间的相互关系。该模型分为七层，如表\
  \ 2.6 所示，最初由国际标准化组织（缩写为 `ISO`）于 20 世纪 80 年代开发。\n\n**表 2.6** *OSI 模型*\n\n![Images](img/02tab06.jpg)![Images](img/02tab06a.jpg)\n\
  \n许多网络学生都会背诵这个模型。至少记住这七层的名称并基本理解每一层的功能是有好处的。从安全的角度来看，你对网络通信了解得越深，你的防御就可以越精密。你所理解的最重要的一点是，`OSI\
  \ model` 描述的是通信的分层结构。每一层只会与其直接上方或下方的层进行通信。\n\n## TCP/IP 模型\n\n虽然 `OSI Model` 常用，但\
  \ `TCP/IP model` 也被使用。特别是被 `Cisco` 使用。如果你打算追求 `Cisco` 认证，那么你将需要知道 `TCP/IP model`。`TCP/IP\
  \ model` 有四层。它执行与 `OSI model` 相同的活动，但将其压缩到了更少的层中。表 2.7 显示了 TCP 模型。\n\n**表 2.7**\
  \ *TCP 模型*\n\n![Images](img/02tab07.jpg)\n\n## 媒体访问控制 (MAC) 地址\n\n`MAC 地址` 是 `NIC`\
  \ 的唯一地址。（`MAC` 也是 `OSI model` 数据链路层的一个子层。）世界上每个 `NIC` 都有一个由 6 字节十六进制数表示的唯一地址，而 `ARP`\
  \ 用于将 `IP addresses` 转换为 `MAC addresses`。当你输入网页地址时，`DNS` 用于将其翻译为 `IP address`；然后\
  \ `ARP` 将该 `IP address` 转换为单个 `NIC` 的特定 `MAC address`。\n\n类似于 48 位的 `MAC address`\
  \ 的是 `EUI-64`。`EUI-64` 是一个识别物理网卡的 64 位地址。缩写 `EUI` 代表增强唯一标识符（Enhanced Unique Identifier），并在\
  \ `RFC2373` 中标准化。`EUI-64` 用于 `IPv6` 寻址。\n\n## 云计算\n\n美国国家标准技术研究院 (`NIST`) 将云计算定义为：“一种模型，用于通过便捷的、按需的网络访问共享的可配置计算资源池（例如网络、服务器、存储、应用程序和服务），这些资源可以以以最少的管理努力或与服务提供商的交互进行快速配置和释放。”\n\
  \n云有三种主要的分类：\n\n- 公有云由 `NIST` 定义为：向普通公众或至少一个大型行业组提供基础设施或服务的云。\n- 私有云是专门供单一组织使用的云，而不向外部实体提供服务。\n\
  - 社区云是由几个具有共同关注点（例如任务、安全、策略或管辖范围）的组织共享的云。（注：原文在此处截断，但根据上下文维持了结构）。\n\n*注：提供的关于云计算的源文本包含重复且碎片化的项目符号点。我已根据您的规则对核心内容进行了清理。*\n\
  \n\n\n\n\n*   云服务提供商（CSPs）通常负责检测针对底层云平台的威胁，而客户则承担检测自身云资源威胁的责任。\n*   在事件响应方面，CSP\
  \ 具有独特优势，可以对云基础设施内部的事件做出响应，并承担相应的责任。客户云环境内部的事件通常是客户的责任，但 CSP 可能会为事件响应团队提供支持。\n*\
  \   在补丁/更新方面，CSP 负责确保其云服务是安全的，并对其职责范围内的软件进行快速补丁，但通常不负责补丁由客户管理的软件（例如 IaaS 服务中的操作系统）。正因如此，客户应时刻警惕地部署补丁，以缓解云中的软件漏洞。在某些情况下，CSP\
  \ 会提供托管解决方案，由它们也执行操作系统的补丁。\n\n## 总结\n\n本章无法让你成为网络专家。然而，你现在应该已经对网络和互联网的工作原理有了基本的了解。在继续学习后续章节之前，你应该确保自己完全理解了基础硬件，如\
  \ `switches`（交换机）、`NICs`（网卡）、`routers`（路由器）和 `hubs`（集线器）。你还应该熟悉本章介绍的基础协议。熟悉本章介绍的工具非常重要。强烈建议你广泛地尝试这些工具。此外，熟悉\
  \ `OSI model`（OSI 模型）的基础知识也很重要。许多学生起初感到困难，但至少在进入第 3 章“网络跟踪、欺诈和滥用”之前，请确保你对其有一个通用的理解。\n\
  \n本章的内容在后面的章节中至关重要。如果你对这些材料不熟悉，应该在继续之前彻底学习本章。在本章末的练习中，你将练习使用 `IPConfig`、`tracert`\
  \ 和 `ping`。\n\n### 测试你的技能\n\n### 单选题\n\n1. 1。Malek 正在购买电缆用于建立小型办公室网络。他想储备一些常用的电缆。大多数网络使用哪种电缆？\n\
