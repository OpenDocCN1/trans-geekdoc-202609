  \n在 `informit.com` 注册您的《计算机安全》以获取折扣、更新和修正。要开始注册，请访问 [informit.com/register](http://informit.com/register)。\n\
  \n### 引言\n\n自第一版以来，计算机安全领域发生了巨大变化。本版包含了最新的信息。除了大量的脚注外，附录将引导您发现丰富的额外资源。每章都配有习题和练习。附录\
  \ B 提供了选题的答案。\n\n由于练习和项目旨在鼓励读者探索，因此答案可能会不同。\n\n本书假设您是熟练的计算机用户。这意味着您工作和生活中都会使用计算机，熟悉电子邮件和网络浏览器，并了解\
  \ `RAM` 和 `USB` 等术语。对于考虑将本书作为教材的教师，学生应具备计算机基础知识，但不需要接受过正式课程。因此，本书包含了一个关于基础网络的章节以帮助他们跟上。拥有更多知识的人（如系统管理员）会发现某些章节比其他章节更有用。您可以直接跳过您认为简单的章节。\n\
  \n真正的问题是：这本书是给谁看的？本书旨在为懂计算机的人提供入门指南。这意味着具有计算机背景但缺乏先决知识的学生。这对于执法人员、刑事司法专业的学生甚至商业专业的学生可能特别感兴趣。\n\
  \n## 计算机安全\n\n# 第一章 计算机安全简介\n\n### 本章目标\n\n在阅读本章并完成练习后，您将能够：\n\n- 识别网络的主要威胁：安全泄露、拒绝攻击和恶意软件\n\
  - 理解基本安全概念\n- 评估网络攻击的可能性\n- 定义关键术语，如`破解者``、渗透测试员`、防火墙和`身份验证``\n- 比较边界防御和分层防御网络安全方法\n\
  - 使用在线资源保护网络\n\n### 引言\n\n自第一版以来，计算机安全领域发生了巨大变化。本版包含了最新的信息。除了大量的脚注外，附录将引导您发现丰富的额外资源。每章都配有习题和练习。由于练习和项目旨在鼓励读者探索，因此答案可能会不同。\n\
  \n\n\n由于我们的大部分业务都是在线交易的，大量的个人信息存储在计算机中。医疗记录、税收记录、学校记录等都存储在计算机数据库中。个人信息通常被称为个人身份信息（PII），而与健康相关的数据通常被称为个人健康信息（PHI）。这引出了一些非常重要的问题：\n\
  \n- 信息是如何受到保护的？\n- 这些系统的漏洞是什么？\n- 采取了哪些步骤来确保这些系统和数据的安全？\n- 谁可以访问我的信息？\n- 这些信息是如何被使用的？\n\
  - 这些信息与谁共享了？第三方吗？\n\n## 供参考：互联网将向何方发展？\n\n显然，如前提到的，互联网已经扩展了。我们现在有了智能手机、智能手表，甚至智能汽车。我们有了物联网（IoT），它涉及在互联网上通信的设备。智能家居和医疗设备（包括植入式医疗设备）是目前的趋势。你认为未来\
  \ 10 年会带来什么？\n\n遗憾的是，自从自书首次出版以来，不仅技术和互联网接入扩大了，危险也随之增加。这个问题有多严重？根据 2021 年的一篇文章，网络犯罪的损失预计每年将达到\
  \ 6 万亿美元。全球网络安全支出也一直在增加。2020 年全球网络安全支出为 1250 亿美元，预计到 2024 年将超过 174 亿美元。\n\n[¹]:\
  \ [`financesonline.com/cybersecurity-statistics/`](https://financesonline.com/cybersecurity-statistics/)\n\
  \n《网络犯罪杂志》（Cybercrime Magazine）的另一篇文章指出，仅勒索软件在 2021 年的损失就高达 200 亿美元。同一篇文章预测，涉及非法交易的加密货币交易比例正在增加。来自\
  \ Fortinet 的另一篇文章声称，2020 年前三个季度有 360 亿条记录泄露。该文章还报告，仅 2020 年 7 月的恶意活动就 2019 年同月增加了\
  \ 653%。显而易见，网络威胁正在各个方面增加。\n\n[²] [`cybersecurityventures.com/top-5-cybersecurity-facts-figures-predictions-and-statistics-for-2019-to-2021/`](https://cybersecurityventures.com/top-5-cybersecurity-facts-figures-predictions-and-statistics-for-2019-to-2021/)\n\
  [³] [`www.fortinet.com/resources/cyberglossary/cybersecurity-statistics`](https://www.fortinet.com/resources/cyberglossary/cybersecurity-statistics)\n\
  \n然而，尽管每天都有恐怖故事，但许多人（包括一些执法人员和受过培训的计算机专业人员）对这些威胁的现实缺乏足够的了解。显然，媒体会将注意力集中在最具戏剧性的计算机安全漏洞事件上，而未必能给出最可能的威胁场景的准确图景。偶尔遇到对计算机安全知识不足的系统管理员并不罕见。\n\
  \n本章概述了当前的危险，描述了针对你的个人计算机和网络最常见的攻击类型，教你如何使用黑客和安全专业人员的术语，并概述了保护你的计算机和网络所需的大致步骤。\n\
  \n在本书书中，你将学习如何保护单个计算机和整个网络。你还将发现如何保护数据传输，并将完成一项练习以了解你所在地区关于计算机安全的法律。也许本章中最关键的讨论是通常尝试哪些攻击以及它们是如何实施的。在第一章中，我们通过概述危险究竟是什么，并向你介绍网络安全专业人员和黑客使用的术语，为书的其余部分奠定基础。所有主题将在后续章节中得到更充分的探讨。\n\
  \n### 你应该如何对待网络安全威胁？\n\n理解计算机和网络安全的第一步是对针对这些系统的威胁做出现实的评估。如果你不了解要保护的资产以及面临的威胁，你就无法保护它们。你需要对危险有一个清晰的认识才能充分做好防御。自从本书第一版以来，我讨论了关于计算机安全的两种极端态度。这些极端现在仍然存在。\n\
  \n第一种观点假设没有威胁。支持这种观点的人认为计算机系统没有真正的危险，许多负面新闻只是多余恐慌。他们通常认为只需采取极少的安全措施就能确保系统安全。流行情绪是，如果我们的组织尚未受到攻击，我们就是安全的。如果决策者持有这种观点，他们倾向于采取被动的安全方法。他们会等到问题发生后再处理安全问题——即所谓的“马后炮栅”。如果你足够幸运，事件对你的组织的影响很小，并将成为一个切需要的警示。如果你不不幸，你的组织可能会面临严重的、可能是灾难性的后果。本书的一个主要目标是鼓励采取主动的安全方法。\n\
  \n持有相反观点的人高估了危险。他们倾向于认为大量才华横溢的黑客是系统的迫近威胁。他们可能认为任何拿着笔记本电脑的青少年都能随心所欲地穿越高安全系统。这种世界观是很好的电影情节，但不符合实际情况。现实是，许多自称为黑客的人并没有他们想象的那么懂。这些人入侵任何实施了中等预防措施系统的概率较低。\n\
  \n当然，这并不意味着不存在技巧黑客。然而，他们必须平衡成本（资金、时间）与收益（思想、金钱）。“好”黑客往往针对收益最高的系统。如果黑客认为你的系统对这些目标没有帮助，他就不可能投入资源来入侵你的系统。此外，理解真正的入侵需要时间和精力也很重要。并不是电影中那种戏剧性的过程。我经常教授黑客和渗透测试课程，学生通常会发现这个过程实际上有点枯燥，需要耐心。\n\
  \n在书的后面部分，我们将讨论网络战争，这个主题涉及到涉及大量资源的高级黑客。此类攻击的目标不仅是政府机构。对于计算机系统危险的两种极端态度都是不准确的。事实确实有人了解计算机系统并拥有破坏许多（如果不是大多数）系统安全的技能。然而，许多自称为黑客的人并不如他们声称的那样熟练。\n\
  \n\n\n\n真正有天赋的黑客并不比真正有天赋的音乐钢琴家更稀有。想想有多少人在人生的某个阶段学过钢琴。现在再想想，在这些人中，有多少人真正成为了大师。计算机黑客也是如此。虽然很多人技能平平，但真正技术高超的黑客并不算非常常见。请记住，即使是那些具备必要技能的人，也需要动力投入时间和精力来入侵你的系统。\n\
  \n评估你系统威胁水平的更好方法，是将你的系统对潜在入侵者的吸引力与现有的安全措施之间进行权衡。这就是威胁分析的核心。你通过检查风险、漏洞和威胁，来决定在网络安全方面何处投入最大的精力。\n\
  \n内部威胁是另一个需要注意的问题。此类威胁涵盖了内部人员的恶意和蓄意破坏，也包括了简单的疏忽和无知。最稳健的技术安全也可能因为用户糟糕的安全习惯而瓦解。在你阅读此书的过程中，我们还将详细讨论这种威胁。\n\
  \n同时，请记住，对任何系统最常见的外部威胁不是黑客，而是恶意软件和拒绝服务（DoS）攻击。恶意软件包括病毒、蠕虫、特洛马和逻辑炸弹。恶意软件通常不需要高水平的技术攻击者。它只需要一个员工打开了错误的附件或点击了错误的链接。\n\
  \n### 风险评估\n\n安全审计总是从风险评估开始，这正是我们在这里描述的。。首先，你需要识别你的资产。显然，构成你网络的实际计算机、路由器、交换机和其他设备都是资产。但更有可能的是，你最重要的资产在于你网络中的信息。识别资产始于评估你的网络存储的信息及其价值。你的网络是否包含银行账户的个人信息？也许还有医疗信息、健康记录？在其他情况下，你的网络可能包含知识产权、贸易秘密，甚至是机密军事数据。\n\
  \n一旦你识别了资产，你就需要对资产的威胁进行清点。显然，任何威胁都是可能的，但某些比其他的更有可能发生。这非常类似于选择房屋保险时的做法。如果你住在洪泛平原上，那么洪水险至关重要。如果你住在沙漠的高海拔地区，它可能没那么关键。我们对数据也是同样的做法。如果你为一家国防承包商工作，那么外国国家支持的黑客是一个巨大的威胁。然而，如果你是一个学区的网络管理员，那么你面临最大的威胁可能是试图破解网络的青少年。意识到你的网络面临着什么威胁始终是重要的。\n\
  \n一旦你识别了资产并清点了威胁，你就需要弄清楚你的系统存在哪些漏洞。每个系统都有漏洞。识别你网络的特定漏洞是风险评估的主要部分。\n\n对资产、威胁和漏洞的了解将为你提供决定对你的网络采取何种安全措施的信息。你将始终面临预算限制，因此在选择安全控制措施时需要做出明智的决定。使用良好的风险评估正是做出明智安全决策的方法。\n\
  \n#### 注意\n\n许多行业认证都强调风险评估。注册信息系统安全专家（CISSP）对这一问题给予了高度重视。注册信息审计师（CISA）对风险评估投入了更多关注。一个或多个合适的行业认证可以增强你的技能组合，使你作为安全专业人员更具竞争力。还有许多其他认证，包括\
  \ CompTIA 高级安全从业者（CASP）和 Security+ 认证。\n\n### 风险量化\n\n量化风险的方法和公式。这里提供了一些简单的公式。为了计算单次事件的损失，将资产价值乘以该资产暴露的百分比：\n\
  \n`Single Loss Expectancy (SLE) = Asset Value (AV) × Exposure Factor (EF)`\n\n这个公式的意思是，为了计算单次事件的损失，你从资产价值开始，并乘以该资产暴露的百分比。假设你有一台购买价为\
  \ 1000 美元的笔记本电脑。它折旧了 20%，意味着还有 80% 的价值。如果那台笔记本丢失或被盗，则 `$1000 (AV) × .8 (EV) = $800\
  \ (SLE)`。现在这相当简单，并且没有考虑到数据的价值。但它确实说明了公式的要点。现在要计算每年的损失，使用以下公式：\n\n`Annualized Loss\
  \ Expectancy (ALE) = Single Loss Expectancy (SLE) × Annual Rate of Occurrence (ARO)`\n\
  \n使用之前的 `$800` 作为 `SLE`，如果你预计每年损失 3 台笔记本电脑，那么 `ARO = $800 × 3`，即 `$2400`。\n\n显然，这些公式具有某种主观性。（例如，`ARO`\
  \ 通常根据行业趋势和过去的事件进行估算。）但它们可以帮助你理解你所面临的风险。这将帮助你指导分配哪些资源来应对风险。\n\n一旦你识别了风险，你实际上只有四种选择：\n\
  \n-   **接受（Acceptance）：** 这意味着你发现风险的影响小于处理它的成本，或者发生的概率极其遥远，以至于你无所作为。这不是最常见的方法，但在某些情况下是合适的。\n\
  -   **回避（Avoidance）：** 这意味着确保风险发生的概率为零。如果你担心病毒会通过 USB 引入你的网络并关闭了所有 USB 端口，你就规避了风险。\n\
  -   **转移（Transference）：** 这涉及在风险发生时将损害的责任转移。这通常通过网络威胁保险来实现。\n-   **缓解（Mitigation）：**\
  \ 这种方法是最常见的方法，你采取步骤来减少事件发生的可能性或影响。例如，如果你担心计算机病毒，你可以通过杀病毒软件和关于附件及链接的策略来缓解。\n\n这是基本的风险评估。在投入资源处理威胁之前，你必须进行这种基础威胁评估。威胁发生的概率有多大？如果发生了，会对你造成多大的损害？\n\
  \n### 识别威胁类型\n\n正如上一节所述，识别威胁是风险评估的关键部分。某些威胁对于所有网络，而另一些对于特定类型的网络更容易发生。各种来源根据特定标准将威胁分为类别。在本节中，我们将检查根据攻击性质分类的威胁。大多数攻击可以归类为七大类之一：\n\
  \n\n\n\n\n- **恶意软件 (Malware)**：这是对具有恶意目的软件的泛指。它包括病毒攻击、蠕虫、广告软件、特木马和间谍软件。这是对系统最常见的危险。相对泛指的术语\
  \ `恶意软件` 现在被广泛使用的一个原因是，很多时候恶意软件并不完全归类于这些类别之一。\n- **安全违规 (Security breaches)**：这类攻击组包括任何试图未经授权访问你系统的尝试。这包括破解密码、提升权限、入侵服务器……所有你可能与`黑客行为`一词相关的内容。\n\
  - **DoS 攻击 (DoS attacks)**：这些攻击旨在阻止合法用户访问你的系统。正如你将在后面的章节中看到的，这包括分布式拒绝服务 (DDoS)。\n\
  - **Web 攻击 (Web attacks)**：这是任何试图破解你网站的攻击。两种最常见的此类攻击是 SQL 注入和跨站脚本攻击。\n- **会话劫持 (Session\
  \ hijacking)**：这些攻击相当高级，涉及攻击者试图接管一个会话。\n- **内部威胁 (Insider threats)**：这些违规行为基于拥有你网络访问权限的人滥用其权限窃取数据或破坏安全。\n\
  - **DNS 投毒 (DNS poisoning)**：这种攻击试图破坏 DNS 服务器，使用户可以被重定向到恶意网站，包括钓鱼网站。\n\n还有其他攻击，例如社会工程学。一些专家可能会以稍微不同的方式组织这些内容。上述列表只是尝试对攻击类型提供广泛的分类。本节对每种类型的攻击提供了宽泛描述。后面的章节将详细介绍每种特定的攻击、其实现方式以及如何避免。\n\
  \n## 恶意软件 (Malware)\n\n`Malware` 是对具有恶意目的软件的泛指。本节讨论了四种类型的恶意软件：病毒、特木马、间谍软件和逻辑炸弹。特木马和病毒是最常见的。人们也可以将\
  \ rootkit 纳入恶意软件类别中，但它们通常以病毒的形式传播，因此被视为一种特定类型的病毒。\n\n根据 Malwarebytes 的说法：\n\n恶意软件或“恶意程序”是一个伞用术语，描述任何对系统有害的恶意程序或代码。恶意软件具有敌意、侵入性且蓄意恶意，旨在入侵、破坏或禁用计算机、计算机系统、网络、平板电脑和移动设备，通常通过部分接管设备的操作来实现。就像人类流感一样，它会干扰正常功能。”^(4)\n\
  \n[`www.malwarebytes.com/malware/`](https://www.malwarebytes.com/malware/)\n\n当我们想到恶意软件时，主要想到的是计算机病毒。计算机病毒的关键特征是它可以自我复制。计算机病毒类似于生物病毒；两者都被设计成用于复制和传播。传播病毒最常用的方法是利用受害者的电子邮件账户将病毒传播给其地址录中的每个人。某些病毒实际上并不损害系统本身，但`几乎所有`病毒都会因为病毒复制产生的大量网络流量导致网络变慢。\n\
  \n`特木马` 的名字源于一个古老的故事。特洛伊城被围了很长时间。攻击者无法进入，于是建造了一匹巨大的木马，并在一天晚上将其留在特洛伊城的门外。第二天早上，特洛伊的居民看到了这匹木马，认为它是一份礼物，于是他们把木马推进了城。他们不知道，几名士兵躲在马里面。那天晚上，士兵离开木马，打开城门，让他们的同伙攻击者进入城市。电子特木马的工作原理类似，看起来是良性软件，但实际上会从内部向计算机下载病毒或其他类型的恶意软件。\n\
  \n目前另一种正在上升的恶意软件类别是`间谍软件 (spyware)`。间谍软件简单来说就是字面上监视你在计算机上所做内容的软件。间谍软件可以是简单的`cookie`——你的浏览器创建并存储在硬盘上的一个文本文件——你访问过的网站将其下载到你的机器上，并在你返回网站时用它识别你的身份。然而，该文件随后可以被该网站或其他网站读取。该文件保存的任何数据都可以被任何网站检索，因此你的整个浏览历史都可以被追踪。间谍软件还可能由定期对计算机活动进行截图并将其发送给攻击者的软件组成。\n\
  \n另一种形式的间谍软件称为`键盘记录器`，记录你所有的击键。某些键盘记录器还会定期对你的计算机进行截图。数据将被存储以供安装键盘记录器的人稍后检索，或立即通过电子邮件发回。我们将在书的后面讨论特定类型的键盘记录器。\n\
  \n`逻辑炸弹 (logic bomb)` 是在满足某些特定条件之前保持睡眠的软件。该条件通常是日期和时间。当条件满足时，软件会执行某些恶意行为，例如删除文件、更改系统配置或释放病毒。在第\
  \ 5 章中，我们将详细检查逻辑炸弹和其他类型的恶意软件。\n\n## 破坏系统安全 (Compromising System Security)\n\n接下来我们将查看破坏你系统安全的攻击。这种活动通常被称为`黑客行为\
  \ (hacking)`，尽管黑客自己并不使用这个词。我们将在几页之后后深入探讨适当的术语；然而，此时应该注意，`破解 (cracking` 是在未经许可的情况下入侵（通常带有恶意意图）的恰当词。任何旨在通过操作系统漏洞或其他手段来破坏你安全的攻击都可以归类为破解。\n\
  \n基本上，并不是所有的违规都涉及技术利用。事实上，一些最成功的违规完全是非技术的。`社会工程学 (social engineering)#gloss.xhtml#gloss_078`\
  \ 是一种通过利用人性而非技术来破坏系统安全的技巧。这是著名黑客 Kevin Mitnick 最经常使用的路径。社会工程学利用标准的诈骗技巧让用户提供访问目标系统所需的信息。这种方法的工作原理相当简单：渗透者获取有关目标组织的初步信息，并利用这些信息从系统用户那里获取更多信息。\n\
  \n以下是社会工程学实战的一个例子。在拥有系统管理员名字的情况下，可能会给企业的财务部门人打电话，声称自己是公司技术支持人员。提到系统管理员的名字将有助于证实你的主张，允许你提问以获取有关系统规格的更多细节。精明的入侵者甚至可能让财务人员说用户名和密码。正如你所看到的，这种方法的成功取决于潜在入侵者如何操纵他人，实际上与计算机技能关系不大。\n\
  \n\n\n\n\n无线网络的日益普及催生了新类型的攻击。其中一种活动就是`无线入侵 (war-driving)`。这种攻击是`无线拨号 (war-dialing)`的延伸。通过无线拨号，黑客设置计算机按顺序拨打电话，直到另一台计算机响应以尝试进入其系统。无线入侵的概念与之相似，但应用于定位有漏洞的无线网络。在这种情况下，黑客只需开车寻找无线网络即可。许多人忘记了，他们的无线网络信号通常可以延伸\
  \ 100 英尺（因此可以穿过墙壁）。在黑客 DEF CON 大会上，有时会举办无线入侵比赛，参赛者在城市里开车，试图定位尽可能多的漏洞无线网络。这类比赛现在各种黑客会议上已很常见。（DEF\
  \ CON 是世界上最大、最悠老的黑客会议。）\n\n最近的技术创新引入了无线入侵/拨号的新变体。现在我们有了“无线飞行 (war flying)”。攻击者使用配备\
  \ Wi-Fi 嗅探和破解软件的小型私人无人机，在目标区域内飞行无人机，并尝试访问无线网络。\n\n当然，Wi-Fi 破解只是侵入的一种形式。密码破解工具现在互联网上随处可见。我们将在书的后部分检查其中一些工具。还有利用软件漏洞的攻击，允许人们访问目标计算机。\n\
  \n### DoS 攻击\n\n在 DoS（拒绝服务）攻击中，攻击者实际上并没有访问系统。相反，此人只是阻止了合法用户的访问。防止合法服务的一种常用方法是向目标系统发送大量的虚假连接请求，导致系统无法响应合法的请求。DoS\
  \ 是一种非常常见的攻击，因为它太简单了。\n\n近年来，互联网上出现了大量的 DoS 工具。其中最常见的工具之一是低轨道离子炮 (LOIC)。由于这些工具可以从互联网上免费下载，任何人即使没有技术技能也可以执行\
  \ DoS 攻击。\n\n我们还有其他变体，例如 DDoS 攻击。这种攻击使用多台机器攻击目标。鉴于许多现代网站托管在网络集群甚至云端，单台攻击机器极难产生足够的流量来关掉\
  \ Web 服务器。但一个由数百甚至数千台计算机组成的网络确实可以。我们将在`第 4 章`中的`拒绝服务攻击``里详细探讨 DoS 和 DDoS 攻击。\n\n\
  ## Web 攻击\n\n从本质上说，Web 服务器必须允许通信。通常，网站允许用户与网站进行交互。网站任何允许用户交互的区域也是尝试进行 Web 攻击的潜在点。SQL\
  \ 注入涉及将 SQL（结构化查询语言）命令输入登录表单（用户名和密码文本框）中，试图欺骗服务器执行这些命令。最常见的目的是强制服务器登录攻击者，即使攻击者没有合法的用户名和密码。虽然\
  \ SQL 注入只是一种 Web 攻击，但它是最常见的。\n\n### SQL 注入\n\nSQL 注入仍然相当常见，尽管它已经众广为人知多年了。遗憾的是，还没有足够的\
  \ Web 开发人员采取适当措施来修复导致此类攻击成为可能的漏洞。鉴于这种攻击的流行程度，有必要对其进行更详细的描述。\n\n考虑最简单的 SQL 注入形式之一，用于绕过登录界面。该网站是用某种\
  \ Web 语言（如 `PHP` 或 `ASP.NET`）开发的。数据库可能是一个基础的关系型数据库，如 `Oracle`、`SQL Server`、`MySQL`\
  \ 或 `PostgreSQL`，用于与数据库通信，因此我们需要在用编程语言编写的 Web 页面放入 SQL 语句。这将允许我们查询数据库并查看用户名和密码是否有效。\n\
  \nSQL 相对容易理解；事实上，它看起来像英语。有如 `SELECT` 获取数据、`INSERT` 插入数据和 `UPDATE` 修改数据的命令。为了登录网站，Web\
  \ 页面必须查询数据库表以查看用户名和密码是否正确。SQL 的通用结构如下：\n\n```\nselect column1, column2 from tablename\n\
  ```\n\n或：\n\n```\nselect columns from tablename where condition;\n```\n\n例如：\n\n\
  ```\nSELECT * FROM tblUsers WHERE USERNAME = ‘jsmith’\n```\n\n该语句从名为 `tblUsers`\
  \ 的表中检索所有列或字段，其中用户名为 `jsmith`。\n\n当我们尝试将 SQL 语句放入我们的 Web 页面时，问题就出现了。回想一下，Web 页面是用\
  \ `PHP` 或 `ASP.NET` 等 Web 语言编写的。如果你直接将 SQL 语句放置在 Web 页面代码中，就会产生错误。网站编程代码中的 SQL 语句必须使用引号将\
  \ SQL 代码与编程代码隔离开。一个典型的 SQL 语句可能像这样：\n\n```\n“SELECT * FROM tblUsers WHERE USERNAME\
  \ = ‘” + txtUsername.Text +’ AND\nPASSWORD = ‘” + txtPassword.Text +”’” .\n```\n\
  \n如果你输入用户名 `‘jdoe’` 和密码 `‘password’`，此代码产生此 SQL 命令：\n\n```\nSELECT * FROM tblUsers\
  \ WHERE USERNAME = ‘jdoe’ AND PASSWORD = ‘password’\n```\n\n对于非程序员来说，这也很容易。而且它是有效的。如果数据库中有匹配项，则说明用户名和密码匹配。如果数据库没有返回任何记录，则说明没有匹配。\n\
  \n### 跨站脚本\n\n\n\n\n\n跨站脚本（Cross-site scripting）是一种与 `SQL injection` 密切相关的攻击类型。它涉及输入非预期的数据，其成功取决于\
  \ Web 程序员是否没有对输入进行过滤。攻击者找到网站上某个允许用户输入其他用户将看到的文本的区域，然后向这些字段中注入 `client-side script`。\n\
  \n### 注意事项\n\n在描述这种特定犯罪之前，我想指出像 eBay 和 [Amazon.com](http://Amazon.com) 这样主要的在线零售商并不容易受到这种攻击；他们对用户输入执行了过滤。\n\
  \n为了更好地理解这个过程，让我们来看一个假设的场景。假设 ABC 在线图书销售公司有一个网站。除了购物外，用户还可以拥有存储信用卡的账户、发布评论等。攻击者首先建立了一个与真实页面尽可能相似的备网页。然后，攻击者来到真实的\
  \ ABC 在线图书销售网站找到了一本非常热门的书。他进入评论区，但没有输入评论，而是输入了以下内容：\n\n```\n<script> window.location\
  \ = “http://www.fakesite.com”; </script>\n```\n\n现在当用户访问该书时，此脚本将把他们重定向到看起来与真实网站非常相似的假网站。攻击者随后可以让网站告诉用户会话已超时并请重新登录。这将允许攻击者收集大量的账户和密码信息。这只是其中一种场景，但它说明了这种攻击方式。\n\
  \n### 会话劫持（Session Hijacking）\n\n执行会话劫持可能相当复杂。因此，它并不是一种非常常见的攻击形式。简单来说，攻击者监控客户端机器与服务器之间的已验证会话，并接管该会话。我们将在书中后续介绍实现此操作的具体方法。\n\
  \nRobert T. Morris 在 1985 年写的一篇题为《4.2BSD Unix TCP/IP 软件中的一个弱点》的论文定义了原始会话劫持。通过预测初始序列号，Morris\
  \ 能够向服务器伪造受信任客户端的身份。这在今天要做到要困难得多。\n\n除了标志位（`syn`、`ack`、`syn-ack`）之外，数据包还包含序列号，该序列号用于客户端按顺序重组通过流发送的数据。（我们将在第\
  \ 2 章“网络与互联网”中探索网络数据包标志。）\n\nMorris 攻击和其他几种会话劫持攻击要求攻击者连接到网络，并同时让合法用户下线，然后伪装成该用户。正如你想象的，这是一种复杂的攻击。\n\
  \n### 内部威胁（Insider Threats）\n\n内部威胁是一种安全违规行为。然而，它们是一个非常严重的问题，我们将对其进行专门处理。当组织内部的人员滥用其数据访问权限，或访问其无权访问的数据时，就会发生内部威胁。\n\
  \n最明显的案例是爱德华·斯诺登（Edward Snowden）。就我们的目的而言，可以忽略与他的案件相关的政治问题，转而仅仅关注内部人员访问信息并以授权之外的方式使用信息的问题。是的，这确实是一个老故事了，但它对内部威胁主题来说太核心了，我们必须涵盖它。\n\
  \n2009 年，爱德华·斯诺登是 `Dell` 的承包商。2012 年 3 月，他被分配到 `NSA`。虽然他的案件涉及政治问题，但重点在于内部人员访问信息并以授权之外的方式使用信息。是的，这确实是一个老故事了，但它对内部威胁主题来说太核心了，我们必须涵盖它。\n\
  \n（注：提供的文本包含重复段落；我已在保持核心内容的同时清理了结构。）\n\n\n\n\n\n这实际上比许多人意识到的问题要严重得多。在组织内部，信息安全往往比应该要求的要松散。大多数人更关注外部安全而非内部安全，因此访问组织内部的数据通常非常轻易。在我担任安全顾问的职业生涯中，我曾见过某些网络中的敏感数据被直接放置在共享驱动器上，且对访问没有任何限制。这意味着网络上的任何人都可以访问这些数据。在这种情况下，当信息被取用时，并没有构成犯罪。然而，在其他情况下，员工会故意绕过安全措施来访问他们无权访问的数据。最常见的方法是直接使用他人的密码登录。这使得攻击者能够访问该他人被授权访问的资源和数据。不幸的是，许多人使用弱密码，更糟糕的是，他们把密码写在办公桌的某个。有些用户甚至共享密码。例如，假设一位销售经理请病假了，但想检查客户是否给她发了邮件。于是她打电话给助理，并将自己的登录账号告诉他，让他帮忙检查邮件。这种行为本应该被公司安全策略严格禁止，但仍然在发生。问题是，现在有两个拥有销售经理的登录账号。其中任何一个人都可以使用它或将其泄露给他人（无意或刻意）。因此，更有可能有人使用该经理的登录账号访问他未被授权访问的数据。\n\
  \n美国国家标准与技术研究院在其出版物 `NIST800-53`[7] 中将“内部人员”定义为“任何获得授权访问任何组织资源的人，包括人员、设施、信息、设备、网络或系统”。该标准进一步将“内部威胁”定义为“内部人员蓄意或无意利用其授权的访问权限，对组织运营和资产、个人、其他组织以及国家安全造成的威胁。这种威胁可能包括通过间谍活动、恐怖主义、未经授权披露国家安全信息或通过组织资源或能力的损失或退化造成的损害。”\n\
  \n[7] [`nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf`](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf)\n\
  \n## DNS 毒缓存\n\n你在互联网上的大部分通信都会涉及 `DNS`，即域名系统。`DNS` 是将你我能理解的域名（如 [`www.ChuckEasttom.com](http://www.ChuckEasttom.com)）翻译成计算机和路由器理解的\
  \ IP 地址的。`DNS` 毒缓存利用几种技术之一来破坏这一过程，并将流量重定向到非法网站，通常是为了窃取个人信息。\n\n这里是攻击者可能执行 DNS 毒缓存攻击的一种场景：首先，攻击者创建一个钓鱼网站。它伪造了一个我们称之为\
  \ `ABC 银行` 的银行。攻击者想诱用户去那里，以便窃取他们的密码并在真实的银行网站上使用。由于许多用户足够聪明，不会点击链接，他将使用 `DNS` 毒缓存来欺骗他们。\n\
  \n攻击者创建了自己的 `DNS` 服务器。（实际上，这部分相对容易。）然后他在该 `DNS` 服务器中放置了两条记录。第一条用于 `ABC 银行` 网站，指向他的伪造网站而非真实的银行网站。第二个条目是一个不存在的域名。攻击者可以搜索域名注册机构，直到找到一个不存在的域名。为了说明起，我们将其称为\
  \ `XYZ` 域名。\n\n然后，攻击者向目标网络上的 `DNS` 服务器发送请求。该请求声称来自目标网络内的任何 IP 地址，并请求 `DNS` 服务器解析\
  \ `XYZ` 域名。\n\n显然，`DNS` 服务器没有 `XYZ` 域名的条目，因为它不存在。因此，它开始向其命令链向上传播请求，最终到达其服务提供商的 `DNS`\
  \ 服务器。在该过程的任何时刻，攻击者发送大量的伪造响应，声称来自目标服务器正尝试请求记录的 `DNS` 服务器，但这些响应实际上来自他的 `DNS` 服务器，并提供了\
  \ `XYZ` 域名的 IP 地址。此时，黑客的 `DNS` 服务器将提议进行区域传输，与目标服务器交换所有信息。这些信息包含了 `ABC 银行` 的伪造地址。现在，目标\
  \ `DNS` 服务器拥有了 `ABC 银行` 的记录，该记录指向黑客的网站而非真实的 `ABC 银行` 网站。如果网络上的用户输入 `ABC 银行` 的 URL，他们自己的\
  \ `DNS` 服务器会将他们引导到黑客站点。\n\n这种攻击像许多攻击一样，依赖于目标系统的漏洞。配置恰当的 `DNS` 服务器绝不应与任何在域内未经过验证的\
  \ `DNS` 服务器执行区域传输。然而，不幸的事实是，存在许多配置不当的 `DNS` 服务器。\n\n## 新型攻击\n\n本书前四版中讨论的大多数（如果不是全部）威胁仍然困扰着网络安全。`恶意软件`、`DoS`\
  \ 以及其他此类攻击今天与 5 年前甚至 10 年前一样常见。\n\n过去几年中，*人肉搜索 (doxing)* 情况有所增加。人肉搜索是寻找个人的个人信息并将其广播的过程，通常通过互联网进行。这可以是关于任何人的任何个人信息；然而，它最常用于公众人物。甚至出现过任中央情报局局长成为人肉搜索目标的情况[8]。美国新闻与世界报道》[9]\
  \ 2021 年的一的一文章指出，41% 的网络用户经历过某种形式的人肉搜索。\n\n[8] [`gawker.com/wikileaks-just-doxed-the-head-of-the-cia-17378719`](http://gawker.com/wikileaks-just-doxed-the-head-of-the-cia-17378719)\n\
  \n[9] [`www.usnews.com/360-reviews/privacy/what-is-doxing`](https://www.usnews.com/360-reviews/privacy/what-is-doxing)\n\
  \n医疗设备的黑客攻击首次在 2013 年引起公众关注，但已成为日益增长的问题。黑客 Barnaby Jack 首次揭露了胰岛素泵的一个漏洞，该漏洞允许攻击者控制泵并使其在单剂量内释放整个储罐的胰岛素，从而杀死患者。到目前为止，还没有此类事件实际发生的确认案例，但这仍然令人不安。类似的安全漏洞在心脏起搏器中也曾被发现。2018\
  \ 年，美国食品药品管理局 (`FDA`）发布了一份不安全的医疗设备列表。因此，这个问题似乎在变得恶化。\n\n2015 年 7 月，据报道 Jeep 车辆可以在运行期间被黑客攻击并关闭。这意味着黑客可以导致\
  \ Jeep 在繁忙的高速交通中停止，从而可能导致严重的交通事故。汽车黑客已变得更加普遍。2016 年的 `DEF CON` 大会设有汽车黑客村。《汽车与驾驶》杂志\
  \ 2021 年的一篇文章报告了 2019 年发生的 150 起网络安全事件[10]。这些是真实的入侵事件，而不仅仅是可以被利用的漏洞。\n\n[10] [`www.caranddriver.com/news/a37453835/car-hacking-danger-is-likely-closer-than-you-think/`](https://www.caranddriver.com/news/a37453835/car-hacking-danger-is-likely-closer-than-you-think/)\n\
  \n\n\n\n\n最近，物联网为攻击者创造了一系列新目标。由于集成了联网设备，智能家居和办公室已成为攻击者眼中极具吸引力的目标。例如，已经出现了针对智能温控器的勒索软件。2021\
  \ 年的一篇文章^(11) 报告显示，2021 年上半年发生了 15.1 亿次物联网漏洞。这比 2020 年增加了 6.9 亿。显然，物联网攻击正变得越来越常见，这种趋势预计将持续下去。\n\
  \n^(11) [卡巴斯基报告：2021 年网络攻击加剧](https://www.iotworldtoday.com/2021/09/17/iot-cyberattacks-escalate-in-2021-according-to-kaspersky/)（根据卡巴斯基的说法，网络攻击正在加剧）\n\
  \n所有这些攻击显示出一个共同的主：随着我们的生活与科技变得日益紧密，新的漏洞也随之出现。其中一些漏洞不仅危及数据和计算机系统，还可能危及生命。\n\n###\
  \ 评估网络遭受攻击的概率\n\n这些攻击发生的概率有多大？作为个人或组织，你面临的真实危险是什么？最可能的攻击是什么，你的漏洞又在哪里？让我们来看看存在哪些威胁，哪些威胁最可能给你或你的组织带来麻烦。\n\
  \n曾几何时，个人和大型组织面临可能的威胁是计算机病毒。事实依然如此，在任何给定的月份都会记录到几次新病毒爆发。新病毒不断产生，而旧病毒仍然存在。然而，还有其他非常常见的攻击，例如间谍软件。间谍软件正迅速变成比病毒更严重的问题。\n\
  \n病毒之后，常见的攻击是对计算机系统的未经授权的使用。未经授权的使用包括从 `DoS` 攻击到对你系统的直接入侵一切。它还包括内部员工滥用系统资源。本书的第一版引用了计算机安全协会（Computer\
  \ Security Institute）对 223 名计算机专业人员的调查，显示由于计算机安全泄露导致的损失超过 4.45 亿美元。在 75% 的案例中，互联网连接是攻击点，而\
  \ 33% 的专业人士将攻击位置归为内部系统。令人惊讶的是，受访者中有 78% 检测到员工对系统/互联网的滥用。这一统计数据意味着，在任何组织中，主要危险之一可能是其自身的员工。2022\
  \ 年类似的威胁仍然存在，只是百分比发生了略微变化。\n\nVerizon 的 2014 年《数据泄露调查报告》调查了 63,437 起安全事件，在 95 个国家确认了\
  \ 1367 起违规事件。该调查显示，员工对网络存在严重的滥用，以及我们在本章中已经讨论过的许多常见攻击。2015 年《数据泄露调查报告》并未显示出显著改善。2022\
  \ 年的情况依然没有好转。事实上，正如本章开头提到的，网络犯罪造成的损害逐年增加。\n\n### 基础安全术语\n\n在开始学习本章及本书之前，了解一些基础术语是非常重要的。本节中的安全和黑客术语对计算机安全术语提供了基础介绍，但它们是帮助你准备学习更多计算机安全的绝佳起点。额外的术语将在全文中介绍并列在书末的术语表中。\n\
  \n计算机安全世界的词汇源自专业安全社区和黑客社区。\n\n#### 黑客俚语\n\n你可能在电影和新闻节目中听过 `黑客` 这个词。大多数人用它来描述任何进入计算机系统的人。然而，在黑客社区，`黑客`\
  \ 是某个特定系统或多个系统的专家，是一个只想了解更多关于该系统的人。黑客认为，观察系统的缺陷是了解该系统的最佳方式。例如，一个精通 `Linux` 操作系统并试图通过学习弱点和缺陷来理解该系统的人，就会是一个黑客。\n\
  \n这个过程通常意味着查看漏洞是否可以被利用以获取系统的访问权限。这个过程中的“利用”部分是黑客分为三类人的地方：\n\n-   `白帽黑客` 在发现系统的某些漏洞后，会向该系统的供应商报告该漏洞。例如，如果一个白帽黑客在\
  \ `Red Hat Linux` 中发现了某个漏洞，他会发邮件给红红帽公司（可能是匿名的），并准确解释漏洞是什么以及是如何被利用的。白帽黑客经常被公司专门聘用于渗透测试。EC\
  \ 委员会甚至为白帽黑客设立了认证考试：认证伦理黑客测试。\n\n-   `黑帽黑客` 是媒体中通常描写的人。一旦她获取了系统的访问权限，她的目标就是造成某种伤害。她可能会窃取数据、删除文件或破坏网站。黑帽黑客有时被称为\
  \ `破解者 (crackers)`。\n\n-   `灰帽黑客` 通常是守法公民，但在某些情况下会涉入非法活动。\n\n无论黑客如何看待自己，入侵任何系统都是非法的。这意味着从技术上说，所有的黑客无论他们戴着隐喻的什么颜色的帽子，都违反了法律。然而，许多人认为白帽黑客通过在漏洞被利用之前发现并通知供应商实际上提供了一种服务。\n\
  \n##### 脚本小子 (Script Kiddies)\n\n黑客是某个系统的专家。和任何职业一样，它也包含一些欺骗者。那么，对于一个自称为黑客但缺乏专业知识的人该称为什么？这种人最常用的术语是`脚本小子\
  \ (script kiddy)`。是的，这是一个旧词汇，但其含义并没有改变。这个名字源于互联网充满了可以下载以执行某些黑客任务的工具和脚本。许多工具具有易于使用的图形界面，让那些很少或没有技能的人也能操作。一个经典的例子是用于执行\
  \ `DoS` 攻击的低轨道离子炮工具。在不理解目标系统的情况下下载此类工具的人被认为是脚本小子。你可能遇到很多自称为黑客的人，他们实际上是脚本小子。\n\n\
  ##### 伦理黑客：渗透测试员\n\n何时以及为什么某人会允许他人攻击他的系统？最常见的答案是为了评估系统漏洞。这样的人以前被称为 `运动鞋客`，但现在 `渗透测试员\
  \ (penetration tester)` 术语被广泛使用。无论术语如何，这些人是合法地进入系统以评估安全缺陷，正如 1992 年由罗伯特·雷德福、丹·艾克罗德和西德尼·波提主演的电影《运动鞋》所示。越来越多的公司寻求此类个人或公司的服务来评估它们的漏洞。\n\
  \n任何被雇评估系统漏洞的人都应该是技术精通且符合伦理的。进行犯罪背景检查，并避开那些有问题的人。有很多合法的安全专业人士，他们了解并掌握黑客技能，但从未犯过安全犯罪。如果你将“雇佣定罪的黑客意味着雇佣了人才”这一论点推向极端，你可以推断出显然这些人并不像他们想的那么擅长黑客，因为他们被抓住了。\n\
  \n\n\n\n最重要的是，让具有犯罪背景的人访问你的系统，等同于聘佣一个曾有多次醉酒驾（DWI）定罪记录的人当你的司机。在这两种情况下，你都是在招惹麻烦，并可能要承担重大的民事责任。\n\
  \n此外，显然有必要对他们的资质进行一些审查。就像有些人自称是高水平黑客但实际上并非如此，也有人自称是熟练的渗透测试员，却缺乏真正所需的技能。你不会希望无意中聘佣了一个认为自己是渗透测试员的脚本小子（script\
  \ kiddy）。这样的人可能会宣布你的系统非常完备，但实际上，仅仅是因为缺乏技能导致该脚本小子未能成功突破你的安全防护。在本书的后续章节，在第 11 章”中，我们将讨论评估目标系统的基础知识。在第\
  \ 11 章\n\n一种特殊的黑客类型涉及入侵电话系统。这种黑客子分支被称为 `phreaking`（电话黑客）。《新黑客字典》实际上将 `phreaking`\
  \ 定义为“使用恶作且大多是非法的手段，为了不支付某种电信账单、订单、传输或其他服务的行为”。电话黑客需要对电信领域有相当深入了解，许多电话黑客在电话公司或其他电信企业具有过专业经验。通常，这种活动更多地取决于破解电话系统所需的特定技术，而不仅仅是了解某些技巧。\n\
  \n## 专业术语\n\n正如你可能已经注意到的，大多数黑客术语都涉及活动（`phreaking`）或执行该活动的人（`penetration tester`）。相比之下，安全专业人员术语描述的是防御屏障设备、程序和策略。这非常符合逻辑，因为黑客是一种以攻击者和攻击方法为核心的进攻性活动，而安全是一种关注防御屏障和程序的防御性活动。\n\
  \n## 安全设备\n\n最基础的安全设备是`防火墙`。防火墙是网络与外部世界之间的屏障。有时防火墙以独立服务器的形式存在，有时是路由器，有时是运行在机器上的软件。无论其物理形态如何，防火墙都会过滤进入和离开网络的流量。`proxy\
  \ server`（代理服务器）通常与防火墙配合使用，以隐藏内部网络的 IP 地址并向外部世界展示单一 IP 地址（其自身的地址）。\n\n防火墙和代理服务器通过分析流量（至少是入站流量，许多情况下也包括出站流量）并阻止管理员未允许的流量来守护边界。这两种安全措施通常会由`入侵检测系统`（`IDS）进行增强。IDS\
  \ 仅仅是监控流量，寻找可能指示尝试入侵的可疑活动。我们将在第 9 章中检查这些以及其他技术。\n\n## 安全活动\n\n除了设备外，还有安全活动。`Authentication`（身份验证）是最基础的安全活动。它仅仅是确定用户或其他另一个系统提供的凭据（如用户名和密码）是否有权访问相关网络资源的过程。当你使用用户名和密码登录时，系统会尝试验证该用户名和密码。如果验证通过，你将获得访问权限。\n\
  \n另一个关键的安全保护措施是`auditing`（审计），即审查日志、记录和程序以确定这些项目是否符合标准的过程。这项活动将在书中的许多地方被提到，并在几个章节中成为重点关注。\n\
  \n我们刚刚涵盖的安全和黑客术语只是计算机安全术语的入门介绍，但它们提供了一个极佳的起点，将帮助你准备学习更多计算机安全知识。额外的术语将根据需要贯穿全文介绍，并汇在书末的词汇表中。\n\
  \n## 概念与方法\n\n你采取的安全方法会影响所有的安全决策，并为整个组织的安全设定基调。在深入探讨各种网络安全范式之前，让我们花一点时间研究渗透到安全思维中的几个概念。第一个概念是`CIA\
  \ triangle`。这并不是指中央情报局（CIA），而是指的是安全的三个支柱：机密性、完整性和可用性。当你考虑安全时，你的思维过程应该始终受到这三个原则的指导。首先，你是否保持了数据的机密性？你的方法有助于保证数据的完整性吗？你的方法仍然让授权用户方便地访问数据？\n\
  \n虽然 CIA 三角形是所有安全课程和认证的基石，但已经开发了更复杂的模型。一种描述安全的视角方面的方法是`McCumber cube`（麦肯伯立方体）。麦肯伯立方体是一种评估网络安全的方法，考虑了所有方面。它在\
  \ 2004 年的《Assessing and Managing Security Risk in IT Systems: A Structured Methodology》书中被详细描述。它将安全视为三维立方体。这三个维度是目标、信息状态和保护措施。麦肯伯立方体的优点是\
  \ CIA 三角形的自然扩展，因为 CIA 三角形在安全社区广为人。这使得过渡到麦肯伯立方体以及基于麦肯伯立方体的分类法变得更容易。任何分类法都必须便于安全人员的学习和应用才能有效。你可以在图\
  \ 1.1 中看到麦肯伯立方体：\n\n```\n![描述：显示了麦肯伯立方体](img/01fig01.jpg)\n```\n\n**图 1.1** *麦肯伯立方体。*另一个需要记住的重要概念是`最小权限`。这意味着网络上的每个用户或服务都应该具有执行其工作所需的最少权限/访问权限。除非绝对工作绝对，否则不应授予任何人访问权限。\n\
  \n网络安全范式可以根据所采取的安全措施的范围（边界的、分层的）或系统的主动性进行分类。\n\n在`边界安全方法`中，大部分安全工作都集中在网络的边界上。这种重点可能包括防火墙、代理服务器、密码策略或任何减少未经授权访问网络的技术或程序。对于保护网络内部的系统很少或没有投入。在这种方法中，边界是安全的，但边界内部的各种系统往往是脆弱的。\n\
  \n关于边界安全还有额外的问题，包括物理安全。根据组织的安全需求，这些问题可能包括围栏、闭路电视、警卫、锁等。\n\n边界方法显然是有缺陷的，那么为什么有些公司使用它呢？小型组织可能因为预算限制或网络管理员缺乏经验而使用边界方法。边界方法对于不存储敏感数据的小组织可能是足够，但在较大的企业环境中很少奏效。\n\
  \n\n\n\n`分层安全方法`（layered security approach）不仅保护边界，还对网络内部单个系统进行保护。网络中的所有服务器、工作站、路由器和集线器都是安全的。实现这一目标的方法是将网络划分为若干段，并将每个分段像独立的网络一样进行保护，这样即使边界安全被攻破，也不会影响所有的内部系统。这是首选的方法，且应尽可能地使用。\n\
  \n你还应该根据安全措施的主动性/反应性来衡量你的安全方法。这是通过评估系统的安全基础设施和政策中有多少比例用于预防性措施，以及安全系统有多少部分是为响应攻击而设计的。被动安全方法采取很少或不采取任何措施来防止攻击。动态或主动防御则是在攻击发生之前就采取措施来防止攻击。\n\
  \n这种防御的一个例子是使用 `IDS`（入侵检测系统），它们的作用是检测规避安全措施的尝试。这些系统可以告诉系统管理员有人尝试攻破安全，即使该尝试没有成功。`IDS`\
  \ 还可以用于检测入侵者用于评估目标系统的各种技术，从而在尝试实施之前就提醒网络管理员可能存在入侵风险。\n\n在现实世界中，网络安全通常不完全属于某一种范式；它通常是混合方法。网络通常包含两种安全范式的元素。这两个类别也会结合。你可以拥有一个以被动为主但具有分层的网络，也可以是一个主要以边界为主但又是主动的网络。沿着笛卡尔坐标系来考虑计算机安全方法可能会很有帮助，如图\
  \ 1.2 所示，其中 `x` 轴代表被动-主动方法的程度，`y` 轴描述从边界到分层防御的范围。\n\n![描述：显示了 x 轴和 y 轴。x 轴的左端和右端分别代表被动和主动。y\
  \ 轴的底部和顶部分别代表边界和分层。](img/01fig02.jpg)\n\n**图 1.2** *安全方法指南。*\n\n最理想的混合方法是动态的分层范式——即位于图中右上角的。\n\
  \n## 法律问题如何影响网络安全？\n\n越来越多的法律问题影响着人们处理计算机安全的方法。如果你的组织是上市公司、政府机构，或者与其中任何一方有业务往来，你的网络安全可能会受到法律限制。即使你的网络在法律上不受这些安全准则的约束，了解影响计算机安全的各种法律也是很有用的。你可能选择将这些法律应用于你自己的安全标准。\n\
  \n美国影响计算机安全的最古法律之一是`1987 年计算机安全法案`。它要求政府机构识别敏感系统、进行计算机安全培训，并制定计算机安全计划。这项法律是一项模糊的指令，要求美国联邦机构建立安全措施，但并未规定具体标准。\n\
  \n这项立法确立了制定特定标准的法律依据，为未来的指南和法规铺平了道路。它还帮助定义了术语，例如什么信息被视为“敏感”。这段引用出现在法律本身中：\n\n> “敏感信息”一词是指任何信息，其丢失、误用、未经授权的访问或修改可能会对国家利益或联邦计划的实施产生不利影响，或者根据美国法典第\
  \ 5 卷第 552a 节（《隐私法》）个人享有的隐私权，但尚未根据行政命令或国会法案建立的标准被授权出于国防或外交政策利益而保密的信息。\n\n对 `敏感`\
  \ 一词的这个定义应该记在心中，因为它表明不仅是社会安全信息和医疗史信息必须受到保护。\n\n在考虑哪些信息需要受到保护时，只需回答这个问题：未经授权的访问或修改这些信息会对你的组织产生不利影响吗？如果答案是定的，那么必须认为这些信息是敏感的，并采取安全措施。\n\
  \n另一项适用于政府系统强制要求的特定联邦法律是`OMB A-130 号公告`（特别是附录 III）。该文件要求联邦机构建立包含特定元素的安全计划。它还描述了开发计算机系统标准以及政府机构保留记录的要求。\n\
  \n大多数州都有关于计算机安全的特定法律，例如《佛罗里达州计算机犯罪法案》、《阿拉拉巴马州计算机犯罪法案》和《俄克荷马州计算机犯罪法案》。如果你负责网络安全，可能会发现自己成为刑事调查的一部分。这可能是对黑客事件或员工滥用计算机资源进行的调查。计算机犯罪法列表（按州划分）可以在\
  \ [`criminal.findlaw.com/criminal-charges/cyber-crimes.html`](http://criminal.findlaw.com/criminal-charges/cyber-crimes.html)\
  \ 处找到。\n\n### 注意：隐私法\n\n必须记住，任何规范隐私的法律（如`1996 年医疗保险可携带与责任法案`[`HIPAA`]）也对计算机安全产生直接影响。如果你的系统被攻破，从而导致受任何隐私法规涵盖的数据遭到泄露，你可能需要证明你在保护这些数据时尽了职责。如果能够证明你没有采取适当的措施，你可能会被判定民事责任。\n\
  \n## 在线安全资源\n\n当你阅读这本书时，以及当你进入专业领域时，你经常需要额外的安全资源。附录 A，“资源”包含了一份更完整的资源列表，但本节重点介绍了几个你现在可能觉得有用的最重要的资源。\n\
  \n### CERT\n\n`计算机应急响应小组`(`CERT`; `www.cert.org`）由卡内基梅隆大学赞助。CERT 是第一个计算机事件响应小组，至今仍是业内最受尊敬的团队之一。任何对网络安全感兴趣的人都应该经常访问该网站。在网站上，你可以找到大量的文档，包括安全策略指南、前沿安全研究等。\n\
  \n### 微软安全顾问\n\n由于今天许多计算机运行微软操作系统，另一个很好的资源是微软安全顾问网站：[`https://www.microsoft.com/en-us/msrc?rtc=1`](https://www.microsoft.com/en-us/msrc?rtc=1)。该网站是获取所有微软安全信息、工具和更新的门户。如果你使用任何微软软件，应该定期访问此网站。\n\
  \n### F-Secure\n\nF-Secure 公司在 [`www.f-secure.com`](http://www.f-secure.com) 维护着网站。该网站等其他，还是病毒爆发详细信息的库。在这里，你不仅能找到关于特定病毒的通知，还能找到关于病毒的详细信息，例如病毒如何传播、识别病毒的方法，以及可能的用于清理受病毒感染系统的特定工具。\n\
  \n### SANS 学院\n\n\n\n\n\nSANS 学院网站（[www.sans.org](http://www.sans.org)）是一个庞大的安全相关文档库。在该网站上，你将找到几乎你能想象的计算机安全各个方面的详细文档。SANS\
  \ 学院还赞助了许多安全研究项目，并在网站上发布关于这些项目的信息。\n\n## 总结\n\n网络安全是一个复杂且不断演变的领域。从业人员必须紧跟新威胁和解决方案，并在评估风险和保护网络方面采取主动措施。理解网络安全的第一步是熟悉网络所面临的实际威胁。如果你对哪些威胁可能影响你的系统没有现实的认识，将无法有效地保护它们。此外，掌握安全专业人士和试图破坏你安全防护的人员所使用的基础术语也是至关重要的。\n\
  \n### 测试你的技能\n\n### 单选题\n\n1 . 你正在尝试向一位非技术经理解释安全问题。她对计算机安全持有一种相当极端的观点。在本章中讨论的关于计算机安全的极端观点是哪一个？\n\
  \nA. 联邦政府将处理安全。\n\nB. 微软将处理安全。\n\nC. 你的系统没有迫在眉睫的危险。\n\nD. 如果你使用 Linux 就没有。\n\n2\
  \ . 你刚刚担任了一个小型社区学院的网络安全管理员。你想采取措施来保护你的网络。在为网络制定防御之前，你需要什么？\n\nA. 适当的安全认证\n\nB. 对需要防御的危险有清晰的认识\n\
  \nC. 完成这本教材\n\nD. 外部顾问的帮助\n\n3 . 玛丽正在为大一新生教授一门网络安全入门课程。她正在向他们解释主要的威胁。以下哪一项不是三类主要威胁之一？\n\
