  1. 编写一条明文消息。\n2. 使用你设计的凯撒密码来加密它。\n3. 将其传递给你的小组或班级。\n4. 测试破解它需要多长时间。\n5. （可选）计算破解它的平均时间。\n\
  \n练习 8.2: 使用多字母密码\n本练习最好与 8.1 结合使用。\n\n1. 编写一条明文消息。\n2. 使用你设计的多字母密码来加密它。\n3. 将其传递给你的小组或班级。\n\
