  \nD. 受隐私法律保护的信息\n\n20 . 人肉搜索（doxing）的最好描述是哪一个？\n\nA. DoS 恶意软件攻击\n\nB. 陷害犯罪\n\nC.\
  \ 将个人信息放在公开领域\n\nD. 窃取个人信息\n\n### 练习\n\n##### 练习 1.1：本月发生了多少病毒攻击？\n\n1. 使用某些网站资源，例如\
