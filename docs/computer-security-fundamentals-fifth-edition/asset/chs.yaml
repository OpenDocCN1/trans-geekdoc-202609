  \ cookie 通用保护。建议选择“中高”作为级别。\n\n注意屏幕底部的“高级”按钮。此按钮允许你阻止或允许单个网站在你的计算机硬盘上创建 cookie。更改你机器上的\
  \ cookie 设置只是保护隐私的一部分，但它是至关重要的一部分。\n\n你可能还想确保已选择了图 3.2 中所示的“私密浏览”选项。\n\n![Description:\
