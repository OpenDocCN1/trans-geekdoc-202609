  \ AVG 杀毒软件界面。基本保护模式包括计算机保护和网络及电子邮件保护。全保护模式包括黑客攻击、私有数据和未保护模式下的支付。还有一个扫描计算机的选项。](img/05fig09.jpg)\n\
