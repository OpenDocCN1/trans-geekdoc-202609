  \ (`AES`)。`WPA3` 引入了等等同步认证 (`SAE`)。\n\n## IEEE 标准\n\n- `IEEE 802.11n-2009`: 该技术在\
  \ 40MHz 的信道宽度下使用四个空间流，提供高达 600Mbps 的带宽。它使用了多输入多输出 (`MIMO`)，通过多根天线相干地解析比单天线解析更多的信息。\n\
  - `IEEE 802.11ac`: 该标准于 2014 年 1 月通过，吞吐量高达 1Gbps，至少为 500Mbps。它支持多达 8 路 `MIMO`。\n\
  - `IEEE 802.11ad 无线千兆联盟`: 支持高达 7Gbps 的传输速率，比最高 `802.11n` 速率快 10 倍。\n- `IEEE 802.11af`:\
  \ 也被称为“White-Fi”和“Super Wi-Fi”，该标准于 2014 年 2 月通过，允许在 54MHz 到 790MHz 之间的 VHF 和 UHF\
  \ 频段电视白频谱中运行无线局域网 (WLAN)。\n- `802.11ah`: 使用不需要 FCC 许可的 1 GHz 以下频段。该标准于 2017 年发布。\n\
  - `802.11aj`: `IEEE 802.11aj` 是 `802.11ad` 的重新命名，用于全球某些地区（特别是中国）的 45GHz 免许可频谱。\n\
  - `802.11ax`: 该标准是 `802.11ac` 的继者，有时被称为 Wi-Fi 6。该标准于 2021 年 2 月通过。它设计用于密集环境（即存在其他干扰信号的环境）。\n\
  - `802.11be`: 这是一个正在制定的标准，旨在实现极高吞吐量 (`EHT`)。预计速度将达到 40 Gbps。它将使用多年来 Wi-Fi 使用的 2.4\
  \ 和 5 GHz 频段，同时也支持 6 GHz 频段。截至本文，该标准仍在开发中，初始草案于 2021 年。\n\n## 其他无线协议\n\n- `Zigbee`:\
  \ 该协议设计用于低功耗、低数据率应用。基于 `802.15.4` 标准。\n- `蓝牙`: 一种用于移动设备之间交换数据的短距离无线技术。\n- `Z-Wave`:\
  \ 一种用于家庭自动化的低功耗无线通信协议。\n- `LoRaWAN`: 一种用于远程 IoT 通的低功耗广域网协议。\n- `Thread`: 基于 IPv6\
