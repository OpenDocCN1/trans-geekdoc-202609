  \ 800-115 是一份技术安全测试指南。本节将简要讨论其中一些较为著名的标准。NIST 800-115 是一份技术安全测试指南。本节将简要讨论其中一些较为著名的标准。NIST\
  \ 800-115 是一份技术安全测试指南。本节将简要讨论其中一些较为著名的标准。\n\n### NSA-IAM\n\n国家安全局方法论 (IAM) 是一份优秀的测试指南。它有三个级别：\n\
  \n- 级别 I：审查策略和程序\n- 级别 II：使用工具诊断\n- 级别 III：红队演\n\n### PCI-DSS\n\n支付卡行业数据安全标准是 Visa、MasterCard、美国运通\
  \ Discover 使用的标准。PCI-DSS 的主要关注点是公司应实施的安全控制和目标。\n\n### National Vulner Database\n\
  \n这不是一个标准，而是一个已知漏洞数据库。在检查你的网络漏洞时，显然你需要检查已知漏洞。一个起点是国家漏洞数据库。这是一个使用安全内容自动化协议 (SCAP)\
  \ 的美国政府漏洞存储库。该协议通常读作 \"ess-cap\"。\n\n\n\n\n\n# 选择安全专业人员\n\n## 经验\n在寻找安全专业人员时，经验是最重要的因素。你希望找到至少拥有\
  \ 5 年 IT 经验、其中 2 年与安全相关的人。通常，这会是一个转入安全领域的网络管理员或程序员。请注意，这只是最低经验水平。经验越丰富越好。虽然经验较少的人完全可能具备所需的技能，但可能性并不大。每个人都需要一个起点，但你不会希望你的系统成为某人学习的场所。\n\
  \n### 经验的质量\n个人经验的质量与经验的长短同样重要。要询问关于其经验的细节。例如，她在计算机安全中究竟扮演了什么角色？她仅仅是制定了策略，还是真的执行了操作性的安全工作？结果如何？她的系统是否免受了病毒感染和黑客入侵？你可以联系她的推荐人吗？简而言之，仅仅因为某人在简历上声称自己负责信息安全是不够的。你需要查查出她到底做了什么，以及结果如何。\n\
  \n## 教育\n安全专业人员的另一个重要方面是教育。请记住，计算机安全是一个非常广泛的主题。人们需要对网络、协议、编程等有深入的理解。没有受过正式教育的人完全可能具备这些技能，但比受过正式教育的人的可能性小。通常，这些技能最可能出现在拥有经验且具有计算机或数学相关领域学位的人身上。这听起来可能有些知识分子的傲慢，但这是一个事实。IT\
  \ 领域有许多自学人才，例如拥有历史学位的网络管理员，或者现在成为程序员的心理学专业学生。然而，一个人关注的领域越广泛，就越难精于精通。这并不是说一个人没有计算机科学、数学或工程学位就不能成为安全专业人员。观点仅仅是，这是你应该考虑的因素之一。如果某人拥有无关的学位，但符合或超过了其他所有资质，你仍然可以考虑他。一些大学已开始提供特定的安全课程，甚至少数大学还提供安全学位。显然，计算机安全方面的特定培训是最理想的安全背景。\n\
  \n## 认证\n认证在 IT 行业中变得极具争议。有些人对其深信不疑。你可以很容易地找到许多要求特定认证的招聘广告，例如 `CNE`（认证诺瓦工程师）或 `MCITP`（微软认证信息技术专业人员）。思科认证也很常见（从\
  \ `Cisco Certified Network Associate` 到 `Cisco Certified Internetworking Engineer`）。另一方面，你也能毫不找到一些贬低认证并认为其完全一用无处的\
  \ IT 专业人员。后者的观点源于事实：某些持有认证的人并不具备人们预期的技能。但这对于任何证书都是如此。有能力不称职的医生医生。但如果你需要医疗帮助，咨询那些拥有医学学位的人，你的机会会大得多。雇主通常采用这种方法进行招聘。如果他们只面试那些拥有特定学位或认证的人，那么他们面试到合格候选人的机会就更高。\n\
  \n### 平衡的方法\n一种更合理的立场是处于这两个极端之间。认证可以是候选人对特定产品知识的良好指标。例如，如果你想让某人保护你的微软网络，寻找拥有微软认证的人并不是一个坏主意。然而，你应该平衡这一点，记住，完全可能是一个记忆力好的人利用互联网上的各种学习指南并通过一项他们实际上并不理解的测试。这就是经验派上用场的地方。认证加上适当的经验是技能的良好指标。换句话说，认证本身是不够的。但一个或多个认证与经验以及可能相关的学位相结合，可以成为技术技能的强有力指标。\n\
  \n### 安全相关认证\n除了网络管理员的认证外，还有许多安全相关的认证。某些认证的信誉高于其他。`CompTIA` 的 `Security+` 考试和 `CIW\
  \ Security Analyst` 都是概念性考试。这意味着它们测试的是候选人对安全概念的知识，而不是他们实际实施安全解决方案的能力。它们本身可能无法代表所需的技能水平。但例如，如果你正在使用\
  \ Novell 保护网络，一个拥有 `CNE` 并具备 `CIW Security Analyst` 或 `Security+` 的候选人可能是值得考虑的人选。需要注意的是，`CompTIA`\
  \ 最近增加了`认证高级安全从业者` (`CASP`)，它是专为具有 10 年安全经验的人士设计的。\n\n### 主要认证\n最受尊敬的安全认证是 `CISSP`（认证信息系统安全专业人员）。这项测试是一场\
  \ 6 小时的考试，而且如果你有学位，则还需要 4 年安全相关经验；如果没有学位，则需要 5 年经验。`CISSP` 持有者还必须提交另一位 `CISSP` 或公司官员的推荐信，并获得继续教育学分以维持认证。这可能是最受尊敬的安全相关认证。生产\
  \ `CISSP` 的厂商 (`ISC2`) 还有高级的、CISSP 之后的认证，例如`信息系统安全架构专业人员` (`ISSAP`)、`信息系统安全工程专业人员`\
  \ (`ISSEP`) 和 `信息系统安全管理专业人员` (`ISSMP`)。\n\n`Certified Ethical Hacker`（认证道德黑客）由 `EC-Council`\
  \ ([www.eccouncil.org](http://www.eccouncil.org))赞助。这项测试一直是争议的话题。记住，它测试的是基本的黑客技能，而不是对黑客攻击的精通。它适合黑客/渗透测试的入门。\n\
  \n`Offensive Security`（[`www.offensive-security.com`](https://www.offensive-security.com)）专注于渗透测试认证。他们的认证测试最有趣的地方在于它们都包含操作部分。你必须实际进入他们的测试系统，而不仅仅是参加考试。\n\
  \n`CompTIA` 还提供了几个安全考试，包括 `Security+`、`CompTIA 高级安全从业者` (`CASP`) 和 `Pentest+`。\n\
  \n许多通用的取证认证。`EC-Council` 有`认证黑客调查员`。还有针对特定取证工具的特定认证。对于安全专业人员来说，良好的基础取证是有用的。\n\n\
  `GIAC` ([www.giac.org](http://www.giac.org)) 有许多安全相关的认证。所有这些在安全行业中都有良好的声誉。然而，它们比其他测试更贵，因此拥有这些认证的安全专业人员较少。`GIAC`\
  \ 拥有安全认证 (`GSEC`)、渗透测试认证 (`GPEN`) 和取证认证 (`GCFA` 和 `GCFE`)。\n\n\n\n\n\n所有的认证都面临一些批评。事实是，有些人人确实会参加短期训练营（boot\
  \ camps），并为了通过认证而记忆足够的信息。然而，这种情况也适用于任何资质证明。确实存在不称职的医生，但我确信，如果你生病或受伤了，你会寻找医生。这是因为，比起随机随机选择某个人，你从医生那里获得专业帮助的概率大得多。认证也是如此。请记住，认证反映的是最低技能水平，而不是精通程度。我建议至少拥有一个通用安全认证（如`Security+`、`CASP`、`CISSP`等）、一个渗透测试认证（如`GPEN`、`CEH`、`Offensive\
  \ Security`等）以及一个取证认证（`CCFP`、`GCFA`、`CHFI`等）。\n\n你绝不能仅凭认证就聘佣一个人。这些认证仅仅应该是你所考虑的因素之一。\n\
  \n最后，你应该考虑个人背景。根据定义，安全顾问或全职员工将接触机密信息。任何合法的安全专业人员都不会不介意为你提供以下任何内容：\n\n- 推荐信\n- 允许检查其信用记录\n\
  - 允许检查其犯罪背景\n\n任何表现出不愿提供上述任何一项的人都应该被避开。因此，理想的安全顾问可能是一个拥有 5 年或以上经验、拥有计算机相关学科学位、拥有你组织操作系统的认证以及一种主要的安全认证，且背景完全清白并提供推荐信的人。按照规定，在聘佣安全顾问时，你越谨慎越好。\n\
  \n除非你的员工中有一位受过高度培训的安全专家，否则你应该考虑聘请安全顾问至少对你的系统进行一次评估。在我们目前的法律环境下，安全泄露的责任仍在激烈辩论中。公司正因为未能在计算机安全方面履行尽职调查而面临诉讼。从计算机行业角度和法律角度来看，尽一切合理的努力来确保系统安全都是一个明智之举。\n\
  \n## 总结\n\n本章概述了在任何安全评估中需要寻找的一些基本项目。你应该定期对你的网络/系统进行安全漏洞评估。一般的建议是，对于非关键/低安全性站点每季度评估一次，对于高安全性站点，频率可能达到每周评估一次。无论如何，本章概述的是评估网络安全的基础知识，它们应该为你保护自己的网络提供一个起点。\n\
  \n### 测试你的技能\n\n安全计算是一个保护你的计算机、网络和服务器，并在 Web 上使用常识的问题。对所有计算机严谨应用安全实践和标准至关重要，无论它们是家用电脑还是组织网络的一部分。\n\
