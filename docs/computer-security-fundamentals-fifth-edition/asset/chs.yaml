  \n### 项目\n\n### 项目 1.1：了解病毒\n\n1. 使用附录 A 以及 [www.f-secure.com](http://www.f-secure.com)\
  \ 等网站的网络资源，寻找一个过去 6 个月内发布的病毒。\n\n2. 研究该病毒是如何传播的以及它造成的破坏。\n\n3. 关于该病毒写一篇简短的（半页到一页）论文。解释该病毒是如何工作的、如何传播的，以及你能找到的任何其他重要信息。\n\
  \n### 项目 1.2：考虑法律（小组项目）\n\n编写一个你希望通过的计算机法律描述，并提供有关其实施、执行和正当理由的细节。\n\n### 项目 1.3：提供安全建议\n\
  \n1. 利用网络、期刊或书籍，从任何信誉良好的来源（如 SANS 学院）查找安全建议。本章“在线安全资源”部分提到的任何网站都是很好的选择。\n\n2. 列出上述这些建议中的五项。\n\
  \n3. 解释你你为什么同意或不同意这五项建议中的每一项。\n\n## 案例研究\n\n在这个案例研究中，我们将考虑一家小型家庭导向型视频录带店的网络管理员。该商店不是连锁店的一部分，且安全预算非常有限。它有五台供员工用于租赁电影的机器和一台用于存储集中记录的服务器。该服务器位于经理办公室。管理员采取了以下安全预防措施：\n\
  \n- 每台机器都升级到 Windows 10，并开启了个人防火墙。\n- 所有机器上都安装了防病毒软件。\n- 服务器增加了磁带备份，磁带保存在经理办公室的档案机柜中。\n\
  - 删除了员工机器的互联网访问权限。\n\n现在考虑以下问题：\n\n1. 这些行动实现了什么？\n\n2. 你会建议哪些额外的行动？\n\n# 第 2 章\n\
  \n## 网络与互联网\n\n### 章目标\n\n在读完本章并完成练习后，你将能够完成以下操作：\n\n- 识别网络通信中使用的主要协议（例如 `FTP` 和\
  \ `Telnet`）以及你可以如何使用每种协议\n- 理解网络上使用的各种连接方法和速度\n- 比较和对比各种网络设备\n- 识别并解释各种网络协议。\n-\
  \ 理解数据如何在网络上传输\n- 解释互联网的工作原理，以及 IP 地址和 URL 的用途\n- 回顾互联网的简史\n- 使用网络工具如 `ping`、`IPConfig`\
  \ 和 `tracert`\n- 描述网络通信的 OSI 模型和 MAC 地址的用途\n\n### 引言\n\n为了管理网络安全，你需要关于计算机网络如何运行的知识。这似乎是显而易见的，但令人惊讶的是有多少人忽略了这一基本问题。那些已经对网络操作有熟练知识的读者可能会跳读本章，或者快速阅读作为复习。对于其他初接触计算机网络的新读者来说，学习本章将为你提供关于网络和互联网如何工作的基本介绍，包括互联网的历史。这种对网络和互联网的理解对于你理解书中后面介绍的话题至关重要。然而，请记住，如果本章的主题对你来说是新的，那么本章对于网络安全专业人士来说仅仅是底线要求。知识真的真的是越多越好。因此，你应该考虑增加你对计算机技术、网络和相关主题的知识。\n\
  \n在本章中，我们将从检查用于网络和互联网通信的基本技术、协议和方法开始。然后，我们将看看互联网的历史。这些信息是你理解各种网络攻击以及如何防御这些攻击的所需的背景知识。在章末的练习中，你将练习使用一些保护方法，如\
  \ `IPConfig`、`tracert` 和 `ping`。\n\n### 网络基础\n\n让两台或更多台计算机通信并传输数据在概念上是简单的，但在应用上却是复杂的。考虑其中涉及的所有因素。首先，你需要物理上连接计算机。这种连接通常需要一根插入你的计算机的电缆或无线连接。电缆然后插入另一台计算机，或者插入一个转而连接到几台其他计算机的设备。\n\
  \n当然，无线通信的使用频率越来越高，而且无线连接显然不需要电缆。然而，即使是无线通信也依赖物理设备来传输数据。大多数现代计算机中有一块卡被称为网络接口卡，或\
  \ `NIC`。如果通过电缆连接，`NIC` 位于计算机外部的部分有一个类似于电话插座的连接槽，只是稍微大一点。无线网络也使用 `NIC`；但它不是有一个连接电缆的插槽，而是使用无线信号传输到附近的路由器或集线机。无线路由器、集线机或\
  \ `NIC` 必须配备天线来收发信号。这些设备将在本章详细介绍。\n\n#### 物理连接：局域网\n\n如所述，使用电缆是计算机相互连接的方式之一。传统 `NIC`（非无线）使用的电缆连接是\
  \ `RJ-45` 连接。（*RJ* 是 Registered Jack 的缩写，是一种国际标准。）与计算机的 `RJ-45` 插口相比，标准电话线使用 `RJ-11`\
  \ 插口。插口之间的最大区别在于连接器中的线条数量，也称为终端。电话线有四根线（有些有六根），而 `RJ-45` 连接器有八根线。\n\n如果你查看大多数计算机的背面或笔记本电脑的连接区域，可能会发现两个看起来像电话插座的端口。这两个端口中的一个可能用于传统的调制解调器并接受标准的\
  \ `RJ-11` 口。另一个更大，接受 `RJ-45` 口。很难找到没有 `NIC` 的现代计算机。\n\n这种标准连接器必须位于电缆的末端。今天大多数网络使用的电缆是五类或六类类电缆，缩写为\
  \ `Cat 5` 电缆或 `Cat 6` 电缆。电缆的规范列在 ISO/IEC 11801。表 2.1 总结了各种类别的电缆及其用途。\n\n**表 2.1**\
  \ *电缆类型与用途*\n\n![Images](img/02tab01.jpg)\n\n\n\n\n\n用于连接计算机的电缆类型也被称为非屏蔽绞对（`UTP`）电缆。在\
  \ `UTP` 中，电缆中的线线成对并扭绞在一起，且没有额外的屏蔽层。如表 2.1 所示，后续每一类别的电缆都比前一类稍快且更健壮。需要注意的是，尽管 `Cat\
  \ 4` 可用于网络，但它几乎从不这样做，因为它的速度更慢、可靠性更，并且是一种过旧的技术。你通常会看到 `Cat 5` 电缆，以及越来越多的 `Cat 6`\
  \ 电缆。你应该注意，我们关注的是 `UTP`，因为它是最常见的类型。还有其他类型的电缆，例如屏蔽绞对（`STP`），但它们远没有 `UTP` 那么常见。\n\n\
  ### 提示：电缆速度\n\n`Category 6` 电缆用于千兆以太网，并已变得非常常见。事实上，某些网络现在使用 `Cat 7`。`Cat 5` 电缆的工作速度高达\
  \ `100Mbps`，而 `Cat 6` 的工作速度为 `1000Mbps`。`Cat 6` 已经广泛可用多年了。然而，为了让 `Cat 6` 真正正常运行，你需要同样以千兆速度传输的\
  \ `hubs/switches` 和 `NICs`；因此，千兆以太网的普及远于许多分析师的预期。我们将在本章稍后的部分详细讨论 `hubs`、`switches`、`NICs`\
  \ 和其他硬件。\n\n如表 2.1 所示，一个关键规格是速度，单位为 `Mbps`，即每秒百万比特（尽管每秒十比特或 `Gbps` 速度正变得越来越常见）。你可能已经意识到，计算机中的所有内容最终都以二进制格式存储——即以\
  \ `1` 或 `0` 的形式。这些单位被称为 `bits`。8 个 `bits` 等于 1 字节，表示单个字符（如字母、数字或回车）。请记住，每种电缆的数据规格是该电缆能处理的最大值。`Cat\
  \ 5` 电缆每秒可以传输高达 100 百（百万）比特。这被称为电缆的 `bandwidth`（带宽）。如果网络上有多个用户都在发送数据，这些流量会很快耗尽带宽。任何传输的图片也会消耗大量带宽。简单的扫描照片可以轻松达到\
  \ 2 兆字节（200 万字节或 1600 万比特）或更大。而流媒体媒体（如视频）在带宽方面可能是要求最高的。\n\n如果你只是想连接 2 台计算机，可以让电缆直接从一台计算机连接到另一台。你必须使用交叉线，但你可以直接连接\
  \ 2 台计算机。但如果你想连接超过 2 台计算机该怎么办？如果你有 100 台计算机需要连接到网络该怎么办？有三个设备可以帮助你完成这项任务：`hub`（集线器）、`switch`（交换机）和\
  \ `router`（路由器）。它们分别使用带有 `RJ-45` 接器的 `Cat 5` 或 `Cat 6` 电缆，并在后续章节中解释。\n\n#### 集线器\
  \ (Hub)\n\n最简单的连接设备是 `hub`。`hub` 是一个小箱状的电子设备，你可以在其中插入网络电缆。它会有 4 个或更多（通常多达 24 个）`RJ-45`\
  \ 端口，每个端口被称为“port”。`hub` 可以连接与其端口数量相同的计算机。（例如，一个 8 端口集线器可以连接八台计算机）。你还可以将一个集线器连接到另一个；这种策略被称为集线器的“叠加”。集线器非常便宜且易于设置：只需插入电缆即可。然而，集线器也有缺点。如果你从一台计算机向另一台发送数据包（数据传输单元），该数据包的副本实际上会从\
  \ `hub` 的每个端口发送出去。所有这些副本会导致大量不必要的网络流量。这是因为 `hub` 作为一个非常简单的设备，没有办法知道数据包应该去哪里。因此，它只是向它的所有端口发送数据包副本。虽然你可以去你喜欢的电子产品商店购买所谓的“hub”，但真正的集线器已经不再存在了。你真正获得的是一个\
  \ `switch`，我们将在本节后面讨论它。\n\n#### 中继器 (Repeater)\n\n`repeater` 是一种用于放大信号的设备。基本上，如果你的电缆需要延伸超过最大长度（`UTP`\
  \ 为 100 米），那么你需要一个 `repeater`。中继器有两种类型：放大型和信号型。放大中继器简单地放大它们接收到的整个信号，包括任何噪声。信号中继器再生信号，因此不会重播噪声。\n\
  \n#### 交换机 (Switch)\n\n`switch` 基本上是一个智能集线器；它的工作方式和外观与集线器完全一样，有一个显著的区别。当 `switch`\
  \ 接收到数据包时，它会将该数据包仅发送目标计算机所在的端口。`switch` 本质上是一个能够确定数据包去向的集线器。它根据数据以太网头部中的 `MAC`（媒体访问控制）地址做出此判断。本章将提供更多关于\
  \ MAC 地址和数据包头的细节。\n\n#### 路由器 (Router)\n\n最后，如果你想连接两个或多个网络，你就使用 `router`。`router`\
  \ 在概念上与集线器或交换机相似，因为它转发数据包；但它要复杂得多。首先，`router` 根据数据包 IP 头部中的 `IP` 地址引导流量。你可以对路由器进行编程。\n\
  \n#### 更快的速度\n\n到为止我们查看了局域网内计算机之间的连接，但还有更快的方法。事实上，你的互联网提供商或你工作的公司可能拥有更快的互联网连接。表\
  \ 2.2 总结了最常见的高速连接类型。\n\n**表 2.2** *互联网连接类型*\n\n![Images](img/02tab02.jpg)\n\n在很多地方可以找到\
  \ T1 连接线。电缆调制解调器有时可以达到 T1 线相当的速度。注意，表 2.2 中没有包含电缆连接，是因为它们的实际速度差异很大，取决于各种情况以及周围有多少人使用同一个电缆供应商。除非你从事电信工作，否则可能遇到\
  \ OC 线。\n\n#### 无线 (Wireless)\n\n今天，我们大多数人都使用无线网络或 Wi-Fi。电气电子工程师学会（IEEE）标准 `802.11`\
  \ 为无线网络提供了指南。使用不同的字母代号表示不同的无线速度。这里列出了从旧到新的各种无线速度：\n\n- `802.11a`：这是第一个广泛使用的 Wi-Fi；它运行在\
  \ 5GHz，速度较慢。\n- `802.11b`：该标准运行在 2.4GHz，室内范围为 125 英尺，带宽为 11Mbps。\n- `802.11g`：仍有很多此类无线网络运行，但你已无法购买使用\
  \ `802.11g` 的新 Wi-Fi 访问点。该标准包含了对 `802.11b` 的后兼容。802.11g 的室内范围为 125 英尺，带宽为 54Mbps。\n\
  - `802.11n`：该标准是对之前的无线网络巨大的改进，提供了 100Mbps 到 140Mbps 的带宽，并在 2.4GHz 或 5.0GHz 频率上运行，室内范围可达\
  \ 230 英尺。\n\n\n\n\n\n## IEEE 标准\n\n- `IEEE 802.11n-2009`: 该技术在 40MHz 的信道宽度下使用四个空间流，提供高达\
  \ 600Mbps 的带宽。它使用了多输入多输出 (`MIMO`)，通过多根天线相干地解析比单天线解析更多的信息。\n- `IEEE 802.11ac`: 该标准于\
  \ 2014 年 1 月通过，吞吐量高达 1Gbps，至少为 500Mbps。它支持多达 8 路 `MIMO`。\n- `IEEE 802.11ad 无线千兆联盟`:\
  \ 支持高达 7Gbps 的传输速率，比最高 `802.11n` 速率快 10 倍。\n- `IEEE 802.11af`: 也被称为“White-Fi”和“Super\
  \ Wi-Fi”，该标准于 2014 年 2 月通过，允许在 54MHz 到 790MHz 之间的 VHF 和 UHF 频段电视白频谱中运行无线局域网 (WLAN)。\n\
  - `802.11ah`: 使用不需要 FCC 许可的 1 GHz 以下频段。该标准于 2017 年发布。\n- `802.11aj`: `IEEE 802.11aj`\
  \ 是 `802.11ad` 的重新命名，用于全球某些地区（特别是中国）的 45GHz 免许可频谱。\n- `802.11ax`: 该标准是 `802.11ac`\
  \ 的继者，有时被称为 Wi-Fi 6。该标准于 2021 年 2 月通过。它设计用于密集环境（即存在其他干扰信号的环境）。\n- `802.11be`: 这是一个正在制定的标准，旨在实现极高吞吐量\
  \ (`EHT`)。预计速度将达到 40 Gbps。它将使用多年来 Wi-Fi 使用的 2.4 和 5 GHz 频段，同时也支持 6 GHz 频段。截至本文，该标准仍在开发中，初始草案于\
  \ 2021 年。\n\n## Wi-Fi 安全\n\n多年来保护 Wi-Fi 的方法不断演变。首先是有线等效隐私 (`WEP`)，然后是 Wi-Fi 保护访问\
  \ (`WPA`)，接着是 `WPA2`，最近是 `WPA3`。\n\n`WEP` 使用流密码 `RC4` 来保护数据并使用 `CRC-32` 校验进行错误检查。标准\
  \ `WEP`（称为 `WEP-40`）使用 40 位密钥和 24 位初始化向量 (`IV`)，从而有效形成 64 位加密。128 位 `WEP` 使用 104\
  \ 位密钥和 24 位 `IV`。\n\n由于 `RC4` 是流密码，同一个流量密钥绝不能使用两次。`IV` 以明文形式传输，其目的是防止任何重复，但对于繁忙的网络来说，24\
  \ 位的 `IV` 长度并不足够长，不足以确保这一点。其 `IV` 的使用方式也让 `WEP` 容易受到相关密钥攻击。对于 24 位的 `IV`，在繁忙网络后相同\
  \ `IV` 重复的概率为 50%。\n\n`WPA` 最初使用临时密钥完整性协议 (`TKIP`)。`WPA2` 使用带有密码文链消息认证的计数模式下的高级加密标准\
  \ (`AES`)。`WPA3` 引入了等等同步认证 (`SAE`)。\n\n## 安全方法\n\n多年来保护 Wi-Fi 的方法不断演变。首先是有线等效隐私\
  \ (`WEP`)，然后是 Wi-Fi 保护访问 (`WPA`)，接着是 `WPA2`，最近是 `WPA3`。\n\n`WEP` 使用流密码 `RC4` 来保护数据并使用\
  \ `CRC-32` 校验进行错误检查。标准 `WEP`（称为 `WEP-40`）使用 40 位密钥和 24 位初始化向量 (`IV`)，从而有效形成 64 位加密。128\
  \ 位 `WEP` 使用 104 位密钥和 24 位 `IV`。\n\n由于 `RC4` 是流密码，同一个流量密钥绝不能使用两次。`IV` 以明文形式传输，其目的是防止任何重复，但对于繁忙的网络来说，24\
  \ 位的 `IV` 长度并不足够长，不足以确保这一点。其 `IV` 的使用方式也让 `WEP` 容易受到相关密钥攻击。\n\n`WPA` 最初使用临时密钥完整性协议\
  \ (`TKIP`)。`WPA2` 使用带有密码文链消息认证的计数模式下的高级加密标准 (`AES`)。`WPA3` 引入了等等同步认证 (`SAE`)。\n\n\
