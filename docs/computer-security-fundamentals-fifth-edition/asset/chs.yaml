  \n### 项目\n\n#### 项目 10.1：审查策略\n\n1. 检查以下讨论安全策略的网络资源：\n\n- EarthLink 可接受使用策略：`www.earthlink.net/about/policies/use/`\n\
  - SANS 学院策略：`www.sans.org/resources/policies/`\n- 信息安全策略的关键要素：Information Security\
  \ World\n\n2. 总结这些策略建议的主题。特别关注这些建议与本章建议不同或超出本章建议的任何领域。\n\n3. 选择你认为最安全的策略建议，并说明你选择的原因。\n\
  \n#### 项目 10.2：现实世界中的安全策略\n\n1. 询问当地企业或你的大学让你查看其安全策略。仔细研究这些策略。\n\n2. 总结这些策略建议的主题。特别关注这些建议与本章建议不同或超出本章建议的任何领域。\n\
  \n3. 选择你认为最安全的策略建议，并说明你选择的原因。\n\n#### 项目 10.3：创建安全策略\n\n注意：此项目非常适合作为小组项目。\n\n在书的目前阶段，你已经学习了包括策略在内的安全。在本章以及之前的练习和项目中，你审查了来自各种网络资源的若干策略以及实际组织的策略。\n\
  \n扩展你在练习中创建的简要策略，为你的大学创建一份完整的运行安全策略。你将需要管理策略、开发策略等。\n\n## 案例研究\n\nHector 是一家国防承包商的安全管理员。该公司经常处理高度敏感的机密材料。Hector\
  \ 开发了一份针对离职员工的策略。该策略涵盖了本章提到的所有内容：\n\n- 关闭任何服务器、VPN、网络或其他资源的登录账户。\n- 退所有设施钥匙。\n-\
  \ 关闭电子邮件、互联网访问、无线网络、手机等所有账户。\n- 取消任何大型资源的账户。\n- 搜索员工的工作站硬盘。\n\n考虑到公司工作的高度敏感性，你可能会在该策略中添加哪些其他操作？\n\
  \n\n\n\n\n在阅读本章并完成练习后，你将能够：\n\n* 理解如何验证系统的安全性\n* 探测系统中的漏洞\n* 使用漏洞扫描工具\n* 评估潜在的安全顾问\n\
  \n### 引言\n\n到这里，大家应该已经清楚了，有必要对任何系统进行定期的漏洞评估。评估方法有多种，包括漏洞扫描、渗透测试和审计。本章的第一部分将讨论在评估系统漏洞时你应该遵循的基本步骤。本章的目的是让计算机安全初学者开始考虑这些问题。本章的意在对该主题进行全面详尽的论述，也不是作为聘请专家顾问的替代方案。事实上，大多数安全主题（如灾难恢复、加密和策略）都有专门的著作进行介绍。本章将为你提供一个可以遵循的基本蓝图。具体细节将取决于你的特定环境、预算、技能和安全需求。本章的第二部分将讨论你可以用于扫描网络漏洞的各种工具。\n\
  \n在本书中，到目前为止，你已经检查了针对个人计算机和网络的许多威胁。你还学习了针对这些种危险的特定防御措施。然而，你还没有接触过一种全面的安全方法。在本章的第二部分，你将学习许多可以实施的安全程序，以提供更安全的计算环境。注意，本章介绍的是你在保护系统时需要执行的整体程序，而不是具体的步骤技术。\n\
  \n#### 系统评估的基础\n\n对于安全初学者来说，不知道从系统安全的何处着手可能会令人无畏。为了简单易记，评估系统安全性的阶段可以归类为六 `P`：\n\n\
  * 补丁 (Patch)\n* 端口 (Ports)\n* 保护 (Protect)\n* 策略 (Policies)\n* 探测 (Probe)\n* 物理\
  \ (Physical)\n\n#### Patch\n\n计算机安全的第一条规则是检查补丁。对于网络、家庭计算机、笔记本电脑、平板电脑、智能手机……实际上任何计算机都是如此。操作系统、数据库管理系统、开发工具、浏览器浏览器等都需要检查补丁。在微软环境中，这应该是很容易的，因为微软网站有一个实用程序，可以扫描你的系统，以查找浏览器、操作系统或\
  \ Office 产品所需的任何补丁。确保所有补丁都是最新版本是安全的一个非常基本的原则。这应该是评估系统时的首要任务之一。\n\n考虑补丁的类型同样重要。最重要的补丁被标记为\
  \ `important`（重要）或 `critical`（关键）。（微软将其标记为关键，但其他供应商可能使用其他名称）。这些补丁必须应用；没有它们，你的系统根本就不安全的。除非你有某些理由不应用，否则应该应用推荐的补丁。最后，可选补丁通常会增强或修正系统中的某些微小功能，但对于安全性并非必须。没有这些补丁，你的系统也不会存在漏洞。\n\
  \n虽然家庭用户可能从自动补丁中受益，但自动补丁对于网络管理员并不合适。补丁可能会干扰某些自定义软件或系统配置。因此，补丁需要首先部署到测试系统中，以确保它们不会破坏任何其他软件或配置。测试完成后，你就可以将补丁推送到生产网络。即便如此，补丁也应该分阶段发布，以防发生万一。这并不意味着补丁没有及时应用。如果有关键补丁，必须立即进行测试，以便将其推送到生产网络。\n\
  \n**FYI：补丁与应用程序**\n\n每当操作系统或应用程序有补丁时，通常会有文档（有时在 Read Me 文件中，有时在下载网站上）说明该补丁修复了什么问题，并列出与其他应用程序冲突的任何已知不良交互。在安装补丁之前，你应该始终阅读这些文档。在大多数情况下，问题是非常微小的，并且通常涉及模糊的情况。但确保你所依赖的服务或应用程序不会受到不利影响总是是好的。\n\
  \n**FYI：路由器上的端口**\n\n在许多其他方面具有安全意识的组织中，可以看到一种安全漏洞是未能关闭路由器上的端口。这对于跨越多个地点的广域网（WAN）的大型组织来说特别是一个问题。不同位置之间的路由器应该进行过滤，但很多时候并没有这样做。\n\
  \n一旦你确保所有补丁都是最新版本，下一步就是建立一个系统来确保它们保持更新。一种简单的方法是启动定期的补丁审查，在预定的时间检查所有机器的补丁。也有自动化解决方案，可以修补组织中的所有系统。所有机器都打补丁是至关重要的，而不仅仅是服务器。\n\
  \n一个重要的问题是何时打补丁。对于家庭用户，通常建议开启自动补丁，以便他们的系统在补丁发布后就能获得修补。然而，这不建议网络管理员这样做。某个特定的补丁完全可能与网络上的某些软件不兼容。一个很好的例子发生在\
  \ 2022 年 5 月。微软的“补丁周二”更新导致 Windows Active Directory 身份验证错误。微软表示：“在您的域控制器上安装 2022\
  \ 年 5 月 10 日发布的更新后，您可能会在服务器或客户端上遇到网络策略服务器 (NPS)、路由和远程访问服务 (RRAS)、Radius、扩展身份验证协议\
  \ (EAP) 和保护扩展身份验证协议 (PEAP) 等服务的身份验证失败。”^(1)建议你在与网络工作站配置相同的测试机器上安装补丁。在补丁通过测试后，就可以将其推送到网络。\n\
  \n^(1) [`threatpost.com/microsofts-may-patch-tuesday-updates-cause-windows-ad-authentication-errors/179631/`](https://threatpost.com/microsofts-may-patch-tuesday-updates-cause-windows-ad-authentication-errors/179631/)\n\
  \n#### Ports\n\n正如你在第 2 章 中学习到的，“网络与互联网”，所有的通信都通过某些端口进行。任何你明确需要的端口都应该关闭。服务器和个人工作站上任何未使用的服务都应该关闭。Windows（XP、Vista、7、8\
  \ 和 10）和 Linux 都有内置的端口过滤功能。Windows 2000 专业版是第一个包含端口过滤功能的 Windows 操作系统。Windows XP\
  \ 将扩展到了功能完的防火墙。Windows 7 增加了可以阻止出站流量的防火墙。在 Windows 中关闭服务和端口过滤在第 9 章 “计算机安全技术”中有更详细的讨论。\n\
  \n你还应该关闭网络中任何闲的路由器端口。如果你的网络是广域网的一部分，你可能有一个连接到该广域网的路由器。每个开放端口都是恶意软件或入侵者可能的进入途径。因此，你关闭的每一个端口都会消除此类攻击影响你系统的机会。\n\
  \n**在实践中**\n\n\n\n\n\n# 在 Windows 中关闭服务\n\n对于没有运行防火墙软件的独立机器，你不需要直接关闭端口；而是关闭使用该端口的服务。例如，如果你不使用\
  \ FTP 服务，但发现 FTP 端口处于开启状态，那么很可能是这台机器上运行着一个 FTP 服务。在 Windows（自 Windows 7 起包括 Windows\
  \ 11 在内的任何 Windows 版本）或 Windows Server（从 2008 开始的任何版本）中，如果你拥有管理员权限，可以采取以下两个步骤关闭不需要的服务：\n\
  \n1. 进入`控制面板`并双击`管理工具`。（注意：在 Windows 10 中，你需要进入`控制面板`，点击`系统和安全`，然后双击`管理工具`。）\n\n\
  2. 双击`服务`。你应该看到一个与图 11.1 所示相似的窗口。\n\n![Description: 服务对话框有两个窗格。从左侧窗格选择服务。所选项的详细信息显示在右侧窗格中。它列出了名称、描述、状态、状态类型和登录方式的列表。](img/11fig01.jpg)\n\
  \n**图 11.1** *服务。*\n\n图 11.1 中的窗口显示了机器上安装的所有服务，无论它们是否正在运行。注意，该窗口还显示了有关服务是否运行、是否自动启动等信息。在\
  \ Windows XP 中，可以通过选择单个服务查看更多信息。在任何版本的 Windows（Windows XP 到 Windows 11，Server 2003\
  \ 到 Server 2019）中，双击单个服务，都会看到一个与图 11.2 相似的对话框，提供该服务的详细信息。\n\n![Description: 显示了应用程序虚拟客户端属性（本地计算机）的常规选项卡。选项卡中出现了服务名称、显示名称、描述、可执行文件路径、启动类型和服务类型等详细信息。点击确定\
  \ 按钮恢复更改。](img/11fig02.jpg)\n\n**图 11.2** *已禁用的服务。*\n\n在图 11.1 所示的示例中，你看到一台机器上有一个它不需要的服务。然后在图\
  \ 11.2 中，你看到了如何禁用该服务。为了说明这一过程，该服务将被禁用。（然而，在关闭任何服务之前，你需要检查其他服务是否依赖于你准备关闭的服务。如果其他服务依赖于你想关闭的服务而你继续关闭它，将会导致其他服务失败。）按照以下步骤关闭服务：\n\
  \n1. 点击`依赖关系`选项卡。在这种情况下，该服务没有依赖项。\n2. 点击`常规`选项卡。\n3. 将`启动类型`更改为`禁用`。\n4. 如果必要，点击`服务状态`区域中的`停止`按钮。你的对话框应该与图\
  \ 11.2 相似。现在传真服务已关闭。\n5. 点击`确定`以接受所作的更改并关闭`属性`对话框。关闭`服务`对话框和`管理工具`对话框。\n\n关闭不需要的端口和服务是计算机安全中非常重要且非常基础的一部分。正如所提到的，每个开启的端口（以及每个运行的服务）都是黑客或病毒进入你机器的可能途径。因此，请记住这条重要规则：如果你不需要它，就关闭它并将其拦截。\n\
  \n当然，你应该确保自己没有关闭你确实需要的服务。某些服务依赖于其他服务。幸运的是，Windows 确实提供了哪些服务依赖于给定服务的信息。如果你不确定，请在关闭它之前花时间研究该服务。你不会希望禁用你实际上需要的软件和服务的。\n\
  \n通常情况下，人们会使用一个与你的生产工作站配置完全相同的系统，并将该系统用于测试。你可以在测试系统上完成添加补丁或关闭服务。然后，如果没有问题，你就可以将更改推向生产机器。即使在使用测试系统，你也应该分阶段推向生产环境，而不是一次性推向整个网络。始终存在出现问题的可能性。\n\
  \n一种最佳实践是列出你正在运行的所有软件列表。然后查找该软件所需的端口和协议，并仅允许这些端口。需要记住，这些是入站流量端口。如果你的机器没有被用作数据库服务器、Web\
  \ 服务器或其他类型的服务器，并且你的机器是单机，那么你可以（并且应该）关闭所有端口。网络上的工作站可能需要开启一些端口用于网络工具。我们将在本章后面的部分检查一些有趣的工具。\n\
  \n## 保护\n\n评估系统安全的下一个阶段是确保采用所有合理的保护软件和设备。这意味着至少要在你的网络和外部世界之间有一个防火墙（参见第 2 章）。你还应该考虑在那个防火墙和任何\
  \ Web 服务器上使用入侵检测系统（IDS）（我们在第 9 章中讨论过 Snort IDS）。某些安全专家认为 IDS 不是必不可的；你确实可以在没有它的情况下保持网络安全。但是，使用\
  \ IDS 是感知攻击的唯一方法，而且有很多免费 IDS 可用。\n\n#### 实践\n\n### 寻找防火墙\n\n在选择使用的防火墙时，你有多种选择：你可以为你的高速连接购买一个廉便宜的路由器防火墙，购买一个独立的路由器，或者购买带有防火墙的宽带/DSL\
  \ 路由器。以下网站可以帮助你找到更多信息，并判断哪种最适合你的需求：\n\n- `Linksys`:[`www.linksys.com/`](http://www.linksys.com/)（注意：Linksys\
  \ 已被收购。）\n- `家庭 PC 防墙指南`:[www.firewallguide.com](http://www.firewallguide.com)\n\
  - `CDW 防墙对比`:[`www.cdw.com/content/cdw/en/articles/firewall-type-comparison.html`](https://www.cdw.com/content/cdw/en/articles/firewall-type-comparison.html)\n\
  \n除了可用防火墙选项的信息，你可以在网上找到许多免费或非常便宜的防火墙包。以下是互联网上六种流行的防火墙列表：\n\n- `Norton 个人防火墙`: 该产品价格便宜，适用于多种操作系统。可以从\
  \ [www.symantec.com](http://www.symantec.com) 下载试用版。\n- `McAfee 个人防火墙`: 该产品的价格和基本功能与\
  \ Norton 个人防火墙相似。你可以在 [`us.mcafee.com`](http://us.mcafee.com) 获取更多关于该产品的信息。\n\n\n\
  \n\n\n-   **ZoneAlarm**: 它也提供免费和商业版本 [`www.zonealarm.com/pc-protection/#fw-section`](https://www.zonealarm.com/pc-protection/#fw-section)\n\
  -   **Bitdefnder Total Security:** 这包含防火墙以及其他安全功能 [`www.bitdefender.com/solutions/total-security.html?awc=2873_1659205504_91a428fcb027d4a97b11ad7579cbaf9d`](https://www.bitdefender.com/solutions/total-security.html?awc=2873_1659205504_91a428fcb027d4a97b11ad7579cbaf9d)\n\
  -   **AF+:** 这款防火墙适用于手机和平板电脑等 Android 设备。[`play.google.com/store/apps/details?id=dev.ukanth.ufirewall&hl=en`](https://play.google.com/store/apps/details?id=dev.ukanth.ufirewall&hl=en)\n\
  \n对于预算更灵活的中型或大型网络，你需要的比个人防火墙更多的功能。大多数主要的网络产品供应商在其产品中包含了防火墙。思科（Cisco）路由器和瞻锐（Juniper）路由器都包含了防火墙功能。对于你的网络路由器和交换机，你应该咨询供应商文档，并确保已正确配置了设备自带的防火墙功能。\n\
  \n最后，Linux 有一个名为 `iptables` 的内置防火墙。它是任何使用 Linux 系统的解决方案解决方案。广泛适用于 Linux 的防火墙被称为\
  \ `ipchains`。该产品有效但具有局限性。它首次在 Linux 内核 2.2 版本中引入，并取代了 `ipfwadm`。现在作为 Linux 主要防火墙的\
  \ `iptables` 服务首次在 Linux 内核 2.4 中引入。在大多数 Linux 系统上，`iptables` 被安装为 `/usr/sbin/iptables`；但是，如果安装时没有包含它，你可以稍后添加。\n\
  \n## 策略\n\n虽然在第 10 章“安全策略”中详细讨论了策略，但我们在这里简要回顾了策略的某些方面。任何组织都必须制定明确的计算机安全策略，并且管理层必须强制执行这些策略，这是绝对重要的。这些策略应该涵盖组织计算机、互联网、电子邮件以及系统的任何其他方面的接受使用。策略应禁止在系统上安装任何软件。只有\
  \ IT 人员应该安装软件——而且仅在验证其安全性后方可进行。\n\n策略还应建议用户不要打开未知/意外的附件。我建议组织或部门内部的人员使用代码词。如果该代码词没有出现在电子邮件正文（或主题行）中，他们就不要打开附件。大多数病毒攻击通过邮件附件传播。此类邮件的主题行和正文是由病毒本身自动生成的。你所有合法的附件都可以在主题行中包含代码词；该词出现在病毒发送的邮件主题中的可能性极小。单此这一点就能防止你的用户无意打开病毒。\n\
  \n策略还应该明确划分谁有权访问什么数据、如何进行备份，以及在发生灾难时如何做来恢复数据（通常被称为`灾难恢复计划`）。数据访问必须限制在仅对访问数据有实际需求的人员。例如，人力资源部门的并不是每个人都需要访问所有员工的纪律文件。你的组织是否有当火灾摧毁服务器及其所有数据时该怎么办的计划？从哪里获取新机器？谁来？是否有数据备份的离线副本？这些问题必须在灾难恢复计划中解决。\n\
  \n应该有一关于密码的策略：接受接受最小长度、密码有效期、密码历史以及应避免使用的密码，例如与用户有直接联系的任何词。例如，一个达拉斯拉斯牛仔队的忠实粉丝不应使用与该运动队有任何关系的密码。此外，与个人数据相关的密码（如配偶生日、孩子姓名或宠物名称）是糟糕的选择。密码策略还可以包含对密码的建议或限制。\n\
  \n### 提示：良好的密码\n\n许多来源声称良好的密码至少要有 8 个（最好是 15 个）字符。\n\n\n\n\n\n评估任何网络的一个重要步骤是探测网络。我们将在本章稍后部分介绍几种探测方法。关键在于定期对你自己的网络进行安全漏洞探测。这应该是一个定期计划的活动——也许每季度一次。至少每年应完成一次全面的安全审计。当然，这包括对你的端口进行探测。然而，真正的安全审计还包括对你的安全策略、补丁系统、你维护的所有安全日志、安全岗位人员的文件等进行审查。\n\
  \n## 物理安全\n\n最后，你不能忽视物理安全。一个被放在未锁房间内且无人看守的最安全的计算机也完全是不安全的。你必须有一套策略或程序来管理存放计算机的房间锁定，以及笔记本电脑、`PDAs`\
  \ 和其他移动计算设备的处理。服务器必须位于锁闭且安全的房间内，并允许访问的人员尽可能稀少。备份磁带应存储在防火箱中。文档和旧备份磁带在处置前应被销毁（例如，通过熔化磁带、磁化硬盘、销毁外部存储设备等）。\n\
  \n对路由器和交换器的物理访问也应该受到严格控制。拥有世界上最高科技、最专业的信息安全防护，却把服务器放在一个任何人都可以进入的未锁房间里，这简直是灾难的根源。物理安全领域最常见的错误之一是将路由器或交换机放置在清洁间里。这意味着，除了你自己的安全人员和网络管理员之外，整个清洁团队都可以访问你的路由器或交换机，而且他们任何一个人都可能让门长时间不锁。\n\
  \n关于物理安全，你应该遵循一些基本规则：\n\n- **服务器房**：存放服务器的房间应该是整个建筑中防火性能最好的房间。它应该有一扇坚固的门和坚固的锁（如插销锁）。只有那些确实需要进入房间的人员才能拥有钥匙。你还可以考虑使用服务器房日志，让每个人在进入或离开房间时进行记录。实际上有电子锁可以记录谁进入了房间、何时进入何时离开。你可能还希望在服务器房等关键区域使用生物识别锁。请咨询当地的安全供应商以获取有关价格和可用性的更多信息。\n\
  * **工作站**：每个工作站都应该有一个刻字的标记。你还应该定期对它们进行清点。通常在物理上你无法像保护服务器那样保护工作站，但你可以采取一些步骤来提高它们的安全性。有些公司选择用电缆将工作站固定在桌子上。这既有效又负担得起。\n\
  * **杂项设备**：投影仪、`CD 刻录机`、笔记本电脑等应该被锁起来。任何想要使用这些设备的员工都应被要求签借证，并在归还时检查其是否处于正常工作状态以及所有部件是否齐全。\n\
  \n在门上安装合适的锁是非常重要的。建议使用带有万能钥匙或刷卡的锁，这些锁可以记录谁打开了门。对于服务器房等敏感区域，至少应该进行此类物理访问的记录。视频监控已经变得非常廉。。这包括提供高清和夜视功能并备份到云端的摄像头。此类系统在家里也很常见。\n\
  \n## 系统的安全\n\n在本节中，你将检查以下各个安全细节：\n\n- **国家安全**：美国国家安全局有一个网站：`https://nsa.gov`\n\
  - **互联网安全中心**：互联网安全中心提供基准测试：`https://www.cis.org`\n- **SANS 学院**：SANS 学院提供示例策略：`https://www.sans.org/policies/`\n\
  - **Windows 安全**：Windows 模板：`https://support.microsoft.com/en-us/kb/81650`\n- **Microsoft\
  \ Exchange**：Exchange 模板：`https://technet.microsoft.com/en-us/library/bb67692`\n\
  - **Window Security**：Windows 模板集：`http://www.windowsecurity.com/articles-tutorials/misc-security/Understanding-Security.html`\n\
  \n### 个人工作站的安全\n\n任何谨慎的个人都可以采取若干步骤来确保自己的计算机安全。这些步骤应适用于家庭计算机和网络上的工作站。对于前者，保护单台计算机是唯一的选择。对于后者，保护单台工作站以及边界可以实现分层安全方法。虽然某些网络管理员简单地通过防火墙和/或代理服务器保护边界，但人们通常认为你还应该保护组织中的每台机器。\n\
  \n### 提示：系统加固\n\n防止计算机系统免受黑客、恶意软件和其他入侵者攻击的过程有时被称为系统加固（hardening）。你可能会看到 `server\
  \ hardening` 或 `router hardening` 等常用术语。\n\n个人计算机的第一步是确保妥善应用了所有补丁。微软网站有程序程序可以扫描你的机器以寻找\
  \ `Windows` 和 `Microsoft Office` 所需的补丁。定期执行此操作至关重要——至少每季度一次。你还应该检查其他软件供应商，看看他们是否有类似的机制来更新其产品的补丁。尽管已有补丁可以修复那些被利用的漏洞，但病毒爆发竟然如此广泛，这真是令人惊讶。有太多的人根本没有确保定期应用补丁。\n\
  \n\n\n\n保护单台计算机的第二步是限制安装程序或更改机器配置的能力。在网络环境中，这意味着大多数用户没有权限安装软件或更改系统设置。只有网络管理员和指定的支持人员才应该具备这种能力。在家庭环境中，这意味着只有负责的单方或多个单方（如父母）才有安装软件的访问权限。\n\
  \n采取这一特殊预防措施的原因之一是防止用户在他们的机器上不小心地安装木马或其他恶意软件。如果阻止了人员安装任何软件，那么就不会可能无意中安装不当的软件，例如恶意软件。阻止用户安装任何软件，就避免了他们可能无意中安装不当软件的机会。\n\
  \n为了防止恶意软件，另一种常见的做法是要求用户在安装软件之前获得管理员的批准。许多安全分析师认为，这可以减少攻击面。此外，配置防火墙也是有效的，可以拦截未经授权的访问。此外，使用杀毒软件可以检测并阻挡未经授权的扩展程序运行。此外，对用户进行安全意识培训也是至关重要的，可以帮助他们识别恶意软件的钓鱼。\n\
  \n常见的服务器防御策略包括禁用不必要的服务、启用日志记录，并定期检查这些记录的登录日志。此外，使用多因素身份验证（MFA）可以显著提高服务器的安全性。最后，确保服务器操作系统和应用程序都是最新版本，以修复已知的漏洞。\n\
  \n\n\n遗憾的是，许多网络管理员仅仅将旧的备份介质丢进垃圾桶。具有恶意意的人获取这些丢弃的介质后可以将其恢复到自己的机器上。这可能会让他们在不入侵你系统的情况下访问你的旧数据，或者根据在这些介质上发现的内容，为他们关于你当前安全实践非常有价值的线索。旧介质（磁带、DVD、硬盘）应该被彻底销毁。对于\
  \ DVD，这意味着从物理上将其弄碎。对于磁带，这意味着部分或完全熔化。硬盘则应该使用强磁铁进行磁化处理。\n\n在任何版本的 Windows 中，都有多种注册表设置可以修改以增加你的安全性。如果你使用扫描工具（例如\
  \ Cerberus），它会返回一份报告，说明你注册表设置中的状况。注册表设置中的哪些项目可能会导致安全问题？通常检查的几个项目包括：\n\n- **登录（Logon）：**\
  \ 如果你的注册表设置让登录屏幕显示上一次用户的名称，那么你已经为黑客完成了一半工作。由于她现在有了用户名，她只需要猜密码。\n- **默认共享（Default\
  \ Shares）：** 某些驱动器/文件夹默认共享的。像这样让它们共享会带来安全隐患。\n\n这些只是 Windows 注册表中的几个潜在问题。像 Cerberus\
  \ 这样的工具不仅会告诉你问题是什么，还会提供修复建议。要启动注册表编辑器，进入“开始”，选择“运行”，然后输入 `regedit`。然后你就可以编辑注册表了。\n\
  \n## 网络安全\n\n显然，保护网络的第一步是保护参与该网络的所有计算机，包括所有工作站和服务器。然而，这只是网络安全的一部分。到目前应该很清楚了，使用防火墙和代理服务器也是网络安全的关键元素。第\
  \ 12 章，“网络恐怖主义与信息战”将提供有关这些设备的更多细节。目前，意识到你需要拥有它们是重要的。大多数专家还建议使用 IDS（入侵检测系统）。有许多此类系统可用——其中有些甚至是免费的。这些系统可以检测到某些情况，例如端口扫描，这可能表明某人正准备尝试突破你的安全边界。\n\
  \n如果你的网络规模很大，那么你可能考虑将其分成更小的段，并在段之间使用启用防火墙的路由器。当然，“大”是一个模糊的词，你必须决定你的网络是否足够大而需要分区。通过这种方式，如果一个分段被攻破，整个网络都不会受到破坏。在这个系统中，你可能考虑将你最重要的服务器（数据库、文件服务器）放在一个安全分段中。\n\
  \n由于 Web 服务器必须暴露在外部世界，并且是最常见的攻击点，因此将它们与网络的其余部分隔离开是有的。许多网络管理员会在 Web 服务器和网络其余部分之间放置第二个防火墙。这意味着如果黑客利用了你\
  \ Web 服务器的漏洞并获取了访问权限，他将无法访问你的整个网络。这引出了你的 Web 服务器上应该放什么的问题。答案是：只有你发布网页所需要的内容。任何数据、文档或其他信息都不应该存储在那个服务器上，当然不能有任何多余的软件。操作系统和\
  \ Web 服务器软件就是所有需要的。如果你的情况需要，你也可以添加其他几个项目（例如 IDS）。在那个服务器上运行的任何其他软件都是潜在的安全风险。\n\n\
  你应该考虑考虑的另一个概念是 DMZ。DMZ 是一个*非军事化区*。它本质上涉及设置两个防火墙：一个外层和一个内层。必须供外部访问的资源位于两个防火墙之间。外层防火墙更具许可性，而内层防火墙高度限制性。甚至有的路由器在单个设备中集成了这种功能。通过接入某些端口，你是在内层防火墙之后或\
  \ DMZ 内部添加了一个设备。这在图 11.3 中所示。\n\n![描述：DMZ（非军事化区）的架构。在这种方法中，部署两个防火墙来创建 DMZ。位于中心的\
  \ Web 服务器被称为 DMZ。它被外层和内层防火墙包围。在这里，互联网连接到外层防火墙，组织网络连接到内层防火墙。](img/11fig03.jpg)\n\n\
  **图 11.3** *DMZ。*\n\n你还需要制定策略，正如我们在本章之前讨论过的。即使是最强大的安全，如果用户疏忽破坏了它，它也将无用武处。请记住，你必须有指导用户使用系统的政策。\n\
  \n### 扫描你的网络\n\n确保你的网络安全的唯一方法是实际检查漏洞和缺陷。在本节中，我们将查看一些常用的漏洞扫描工具。这些工具对于任何网络管理员来说都是无价的资产。\n\
  \n#### NESSUS\n\nNessus ([www.Nessus.org](http://www.Nessus.org)) 是领先的网络漏洞扫描器。以前有一个供个人使用的免费版本和一个商业版本。现在它仅提供付费。这可能是目前最广泛使用的漏洞扫描器。它使用起来没有\
  \ MBSA 那么简单，但功能更多。我们将探索其基本功能。\n\n\n\n\nNessus 是一款广名的漏洞扫描器。它已经使用了多年。遗憾的是，它不是免费的。许可证费用每年超过\
  \ 2100 美元，可以通过 [`www.tenable.com`](https://www.tenable.com) 获取。它的价格对许多渗透测试人员来说是一个障碍。Nessus\
  \ 的主要优势是供应商不断更新其能够扫描的漏洞。Nessus 还拥有非常易用的 Web 界面，如图图 11.4 所示。\n\n![描述：Nessus 屏幕主页显示了扫描选项的信息。在左侧面板中，列出了如我的扫描、垃圾箱、所有扫描和新文件夹等选项。右侧面板不包含信息。](img/11fig04.jpg)\n\
  \n**图 11.4** *Nessus 主界面。*\n\n如果你选择 `New Scan`（新扫描），你将获得许多选项，如图图 11.5 所示。\n\n![描述：显示了\
  \ Nessus 扫描选项。](img/11fig05.jpg)\n\n**图 11.5** *Nessus 扫描选项。*\n\n你可以选择 `Basic Network\
  \ Scan`（基础网络扫描）来查看一些直观的基础设置。你必须为扫描命名并选择一个 IP 地址范围，如图图 11.6 所示。\n\n![描述：显示了 Nessus\
  \ 的基础网络扫描选项。左侧面板列出了基础设置。右侧显示了名称、描述、文件夹、目标和上传目标。](img/11fig06.jpg)\n\n**图 11.6**\
  \ *Nessus 基础网络扫描选项。*\n\n然后，你可以选择安排扫描在稍后运行，也可以立即启动。Nessus 扫描可能需要一些时间运行，因为它们非常彻底。结果在一个组织非常良好的屏幕上呈现，如图图\
  \ 11.7 所示。\n\n![描述：截图显示了 Nessus 的扫描结果。](img/11fig07.jpg)\n\n**图 11.7** *Nessus 结果。*\n\
  \n然后你可以对感兴趣的任何项目进行下钻分析。如果你双击特定的 IP 地址，就可以查看该 IP 的详情，如图图 11.8 所示。\n\n![描述：Nessus\
  \ 屏幕显示了晚上 7:44 的测试扫描结果。它列出了严重程度、插件名称和计数。](img/11fig08.jpg)\n\n**图 11.8** *下钻分析 Nessus\
  \ 结果。*\n\n然后你可以双击任何单个项目，以获取有关问题更多详细信息以及如何修复这些问题的详细说明。\n\n### OWASP Zap\n\n开放 Web\
  \ 应用安全项目 (OWASP) 是 Web 漏洞的标准。OWASP 提供了一个名为 Zed Attack Proxy 的免费漏洞扫描器，通常称为 OWASP\
  \ ZAP。你可以从 [`github.com/zaproxy/zaproxy/wiki/Downloads`](https://github.com/zaproxy/zaproxy/wiki/Downloads)\
  \ 下载它。如图图 11.9 所示的界面非常易用。\n\n只需输入想要扫描的网站 URL 并点击 `Attack`。片刻之后，结果将显示在屏幕底部。然后你可以展开任何项目。如果你点击特定项目，将加载详细信息，如图图\
  \ 11.10 所示。\n\n![描述：截图描绘了 Web 应用安全项目 (OWASP) 的主界面。有一个内容面板和一个用于输入攻击 URL 的文本框。](img/11fig09.jpg)\n\
  \n**图 11.9** *OWASP ZAP 主界面。*\n\n![描述：截图描绘了 Web 应用安全项目 (OWASP) 的搜索结果。内容面板显示了用于搜索的一组\
  \ HTML 代码。](img/11fig10.jpg)\n\n**图 11.10** *OWASP ZAP 结果。*\n\nOWASP ZAP 是一个非常易用的工具。基础知识可以在几分钟内掌握。鉴于\
  \ OWASP 是跟踪 Web 应用漏洞的组织，它是网站测试的非常好的来源。\n\n#### Shodan\n\n该工具被黑帽客和安全专业人士广泛使用。网站 [`www.shodan.io`](https://www.shodan.io)\
  \ 本质上是一个漏洞搜索引擎。你需要注册一个免费账户才能使用它，但随后它对渗透测试人员来说可能是无价的。当然，该网站对攻击者来说也是无价的。你可以在图图 11.11\
  \ 中看到该网站。\n\n![描述：截图显示了 Shodan 的主页。](img/11fig11.jpg)\n\n**图 11.11** *Shodan。*\n\
  \nShodan 允许你使用以下项进行搜索：\n\n- `city`: 城市\n- `password`: 默认密码\n- `hostname`: 主机名\n\
  - `apache`: Apache 服务器\n- `webcam`: 摄像头\n- `iis`: IIS\n- `port`: 端口\n\n通过 Shodan，你可以使用许多过滤器，包括：\n\
  \n- `city`: 城市\n- `country`: 国家\n- `geo`: 地理位置\n- `hostname`: 主机名\n- `net`: 网络\n\
  - `os`: 操作系统\n- `port`: 端口\n- `before/after`: 在时间范围内\n\n例如，图 11.12 显示了使用免费版 Shodan\
  \ 进行的结果。\n\n![描述：显示了搜索 Miami 的结果。](img/11fig12.jpg)\n\n**图 11.12** *Shodan 结果。*\n\
  \n当你进行渗透测试时，使用 Shodan 搜索你客户的域名是一个好主意，这可以指导你的渗透测试工作。潜在攻击者也可以使用 Shodan 寻找默认密码、旧的 Web\
  \ 服务器、不安全的摄像头以及目标网络中的其他漏洞。\n\n\n\n\n\n若未指定，格式将采用传递给 `-output` 的文件扩展名。\n\n## Sparta\n\
  \nSparta 是一款随 Kali Linux 附带的漏洞扫描器，它在一个软件包中包含了许多其他工具，包括：\n\n- `Mysql-default`\n-\
  \ `Nikto`\n- `Snmp-enum`\n- `Smtp-enum-vrfy`\n- `Snmp-default`\n- `Snmp-check`\n\
  \nSparta 还有一个易于使用的图形用户界面。以下三个屏幕显示了基本的 Sparta 扫描。\n\n![Description: 图形界面、文本、应用程序描述自动生成](img/11fig15.jpg)\n\
  \n**图 11.15** *Sparta 步骤 1*\n\n![Description: 图形界面、应用程序描述自动生成](img/11fig16.jpg)\n\
  \n**图 11.16** *Sparta 步骤 2*\n\n![Description: 图形界面、文本、应用程序、电子邮件描述自动生成](img/11fig17.jpg)\n\
  \n**图 11.17** *Sparta 步骤 3*\n\n## Vega\n\nVega 与 OWASP ZAP 一样都是 Web 应用程序扫描器。它是免费开源的。在你的\
  \ Web 应用上同时使用 OWASP ZAP 和 Vega 将有助于验证你的发现。可以从 [`subgraph.com/vega/download/`](https://subgraph.com/vega/download/)\
  \ 下载 Vega。像 OWASP ZAP 一样，你只需要输入 URL 并选择模块，Vega 将完成其余工作，如图 11.18 所示。\n\n![Description:\
  \ 图形界面、文本、应用程序描述自动生成](img/11fig18.jpg)\n\n**图 11.18** *Vega 扫描*\n\n## OpenVAS\n\n\
  OpenVAS 是由 Greenbone Networks 创建的开源漏洞扫描器。OpenVAS 框架包含了若干和服务工具，允许你对主机和网络进行详细的漏洞扫描。可以\
  \ [`github.com/greenbone/openvas-scanner`](https://github.com/greenbone/openvas-scanner)\
  \ 下载 OpenVAS，文档可以在 [`docs.greenbone.net/#user\\_documentation`](https://docs.greenbone.net/#user_documentation)\
  \ 访问。\n\nOpenVAS 还包含一个 API，允许你通过编程方式与其工具交互并自动化对主机和网络的扫描。OpenVAS API 文档可以在 [`docs.greenbone.net/#api\\\
  _documentation`](https://docs.greenbone.net/#api_documentation) 访问。\n\n运行 OpenVAS\
  \ 非常简单。在结果屏幕上，系统会提示你通过升级到专业账户来购买完整版本。然而，如果你愿意，可以忽略它并继续使用免费版本。这如图 11.19 所示。\n\n![Description:\
  \ 中等置信度自动生成的图形界面描述](img/11fig19.jpg)\n\n**图 11.19** *OpenVAS 结果*\n\n## 测试与扫描标准\n\
  \n无论是漏洞扫描还是渗透测试，都有与该过程相关的特定标准。本节将简要讨论其中一些较为著名的标准。\n\n### NIST 800-115\n\nNIST 800-115\
