  2. 写一篇短文，解释 Cookie 以何侵犯隐私。\n\n##### 练习 1.3：黑客术语\n\n1. 使用 [`www.outpost9.com/reference/jargon/jargon_toc.html`](http://www.outpost9.com/reference/jargon/jargon_toc.html)\
