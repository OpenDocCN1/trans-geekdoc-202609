  - '`ShiftRows`: 这是一个置换步骤，状态的每一行都按循环移动一定数量的步骤。在此过程中，第一行保持不变。第二行的每个字节都向左移动 1 个字节（最左侧的字节回回）。第三行的每个字节向左移动
    2 个字节，第四行的每个字节向左移动 3 个字节（同样是最左侧的字节回回）。这如图图 8'
- - '###'
  - '`MixColumns`: 这是一个对状态的列进行混合，将每列乘以一个固定的矩阵。在有限域 GF(2^8) 中乘以。结果与多项式 $x^8+x^4+x^3+x+1$
    相乘。多项式 $x^* = x^6 + x^2 + 1$ 乘以。在有限域 GF(2^8) 中乘以。结果一个固定的矩阵。'
