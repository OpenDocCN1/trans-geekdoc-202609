    \ is effective in the network $\\mathbf{y}$, and $\\mathbf{y}_i^x = 0$ otherwise.\
    \ As in treating network connections, we can define a MIPP for each input variable\
    \ and determine a threshold value for the MIPP based on a multiple hypothesis\
    \ test. As implied by (4), the consistency of structure selection implies consistency\
    \ of variable selection with respect to the true network $\\mathbf{y}^*$ as defined\
    \ in Assumption A.2.1.\n\n# 3. Computational algorithm\n\nAlthough the spike-and-slab\
    \ prior leads to nice theoretical properties for Bayesian sparse DNNs, the resulting\
    \ posterior is a mixture of distributions with varying dimensions. Conventional\
    \ Bayesian sampling algorithms adopt reversible jump moves (Green, 1995) to explore\
    \ different network architectures, see e.g. Liang et al. (2018), and lack scalability\
    \ necessarily required for big data scenarios. Song et al. (2020) proposed an\
    \ extended stochastic gradient Langevin dynamics (SGLD) algorithm for Bayesian\
    \ variable selection under the big data scenario, which allows the mini-batch\
    \ data to be used in updating the model and regression coefficients at each iteration\
    \ and is thus scalable to big data problems. In this paper, we extend it further\
    \ by combining it with stochastic gradient Hamiltonian Monte Carlo (SGHMC) (Chen\
    \ et al., 2014), see Algorithm 1 for the procedure and the supplementary material\
    \ for more explanations.\n\n```\n**Algorithm 1** Extended Stochastic Gradient\
    \ Hamiltonian Monte Carlo\n\nInput: $T; m; \\tau; t_0; t_1$\nInitialization: Randomly\
    \ initialize $\\tilde{\\beta}^{(1)}$. Set $\\gamma_i^{(0,t_0)}=1$ for all $i \\\
    in \\{1, \\dots, K_n\\}$;\nfor $t = 1, 2, \\dots, T$ do\n  (i) Draw a subsample\
    \ of size $m$ from the full dataset $D_n$, and duplicate it to form a dataset\
    \ $D_{m,n}^{(t)}$.\n  (ii) Simulate models $\\gamma^{(t,1)}, \\gamma^{(t,2)},\
    \ \\dots, \\gamma^{(t,t_0)}$ from the conditional posterior $\\pi(\\gamma|\\tilde{\\\
    beta}^{(t)}, D_{m,n}^{(t)})$ by Metropolis-Hastings(MH) algorithm with a magnitude-based\
    \ proposal.\n  (iii) Update $\\tilde{\\beta}^{(t)}$ via a SGHMC move,\n\n  $$\n\
    \  v^{(t+1)} = (1-\\alpha)v^{(t)} + \\frac{\\epsilon_{t+1}}{2t_0} \\sum_{k=1}^{t_0}\
    \ \\nabla_{\\tilde{\\beta}} \\log \\pi(\\tilde{\\beta}^{(t)}|\\gamma^{(t,k)},\
    \ D_{m,n}^{(t)}) + \\sqrt{\\alpha \\epsilon_{t+1} \\tau} \\eta_{t+1},\n  $$\n\n\
    \  $$\n  \\tilde{\\beta}^{(t+1)} = \\tilde{\\beta}^{(t)} + v^{(t+1)},\n  $$\n\n\
    \  where $\\eta_{t+1} \\sim N(0, I_d)$, $\\epsilon_{t+1}$ is the learning rate,\
    \ $\\tau$ is the temperature, and $1-\\alpha$ gives the momentum parameter.\n\
    end for\n```\n\nThe main parameters of the extended SGHMC algorithm are the prior\
    \ hyperparameters $\\lambda_n$ and $\\sigma_{1,n}$ defined in (2). Our theory\
    \ allows $\\sigma_{1,n}$ to grow with $n$ from the perspective of data fitting,\
    \ but in our experience, the magnitude of weights tend to adversely affect the\
    \ generalization ability of the network. For this reason, we usually set $\\sigma_{1,n}$\
    \ to a small number such as 0.01 or 0.02, and then tune the value of $\\lambda_n$\
    \ for network sparsity such that the sparse constraint given in Assumption A.2.2\
    \ is satisfied.\n\n# 4. Experiments\n\nThis section presents an example on network\
    \ compression for convolutional neural networks (CNNs). Refer to the supplementary\
    \ material for examples on high-dimensional nonlinear variable selection and DNN\
    \ model calibration. In terms of network compression, extended SGHMC can be viewed\
    \ as an unstructured dynamic pruning algorithm, where the spike-and-slab prior\
    \ is imposed on each parameter and the sparsity mask $\\gamma$ can be adjusted\
    \ during training (Lin et al., 2020). We test the proposed method on the CIFAR-10\
    \ data (Krizhevsky et al., 2009), pruning ResNet20 and ResNet32"
