  md: '# 2.2. The spike-and-slab prior


    To conduct Bayesian inference for the DNN, we consider a hierarchical prior given
    by


    $\tilde{\beta}_i | \gamma_i = 1 \sim N(0, \sigma_{1,n}^2), \ i=1,2,\dots,K_n;
    \ \pi(\gamma) \propto \lambda_n^{|\gamma|} (1-\lambda_n)^{K_n-|\gamma|} \mathbf{1}\{||\gamma||
    \le \bar{r}_n, \gamma \in \mathcal{G}\}, \quad (2)$


    where $\sigma_{1,n}^2$ is the variance of the normal distribution, $\bar{r}_n$
    is the maximum size of candidate sparse DNNs, $\lambda_n$ can be read as an approximate
    prior probability for each connection to be included in the DNN, and $\mathcal{G}$
    is the set of all valid DNNs. With this hierarchical prior, $\beta_i$ follows
    a discrete spike-and-slab prior, i.e., $\beta_i = \tilde{\beta}_i \circ \gamma_i
    \sim \lambda_n N(0, \sigma_{1,n}^2) + (1-\lambda_n)\delta_0$ for $i=1,2,\dots,K_n$,
    where $\delta_0$ denotes the Dirac delta function.


    # 2.3. Posterior consistency


    Posterior consistency measures the speed of posterior concentration around the
    true density function, which plays a major role in validating Bayesian methods.
    For DNNs, since the total number of parameters $K_n$ is often much larger than
    the sample size $n$, posterior consistency provides a general guideline for prior
    setting. Otherwise, the prior information may dominate data information, rendering
    a biased inference for the underlying true model. For learning sparse DNNs, we
    generally set $\lambda_n \to 0$ as $K_n \to \infty$, which provides an automatic
    control for the multiplicity involved in structural selection (Scott et al., 2010).
    Denote by $P^*$ and $E^*$ the respective probability measure and expectation with
    respective to the data $D_n$, denote by $d(p_1, p_2)$ the Hellinger distance between
    two densities $p_1(x,y)$ and $p_2(x,y)$, denote by $p_\beta$ the density function
    induced by a DNN associated with the parameters $\beta$, and denote by $p_{\mu^*}$
    the true density function induced by the unknown function $\mu^*(x)$. Let $\pi(A|D_n)$
    denote the posterior probability of an event $A$. The following theorem establishes
    posterior consistency for sparse DNNs under the spike-and-slab prior (2).


    **Theorem 2.1.** Consider a DNN with $H_n$ layers and at most $K_n$ possible connections,
    where both $H_n$ and $K_n$ are increasing with $n$. If the assumptions A.1-A.3
    hold, and $\hat{\beta}$ and $y$ are subject to the prior (2) with the hyperparameters
    subject to the constraints $\log \sigma_{1,n}^2 + E_n^2/\sigma_{1,n}^2 = O(H_n
    \log K_n)$ and $1 \le r_n \le \bar{r}_n < K_n$, where $r_n = \lambda_n K_n$. Then
    there exists a sequence $\epsilon_n \asymp \max\{\varpi_n, \sqrt{r_n H_n \log
    K_n/n}\}$ such that for sufficiently large n,2 the posterior distribution satisfies


    $$ \begin{aligned} P^* \left\{ \pi(d(p_\beta, p_{\mu^*}) > 4\epsilon_n | D_n)
    \ge 2e^{-n\epsilon_n^2/4} \right\} \\ E^*\pi(d(p_\beta, p_{\mu^*}) > 4\epsilon_n
    | D_n) \le 4e^{-n\epsilon_n^2/2}, \end{aligned} \quad (3) $$


    Theorem 2.1 establishes a Bayesian contraction rate for sparse DNNs under the
    Hellinger metric. Therefore, to obtain consistent Bayesian inference, it suffices
    to require $\varpi_n \to 0$ and $\bar{r}_n H_n \log(K_n) < n$. If $\mu^*$ can
    be optimally represented by a sparse DNN model (refer to Remark S2 in the supplementary
    material), then $\varpi_n$ polynomially decays to 0 as $r_n$ increases to infinity.
    On the other hand, $\bar{r}_n H_n \log(K_n) < n$ implies $\bar{r}_n = o(n/\log(n))$
    by noticing that $K_n \ge \bar{r}_n$. Refer to the supplementary material for
    more discussions on this theorem. In conclusion, we only need $\bar{r}_n$, the
    upper bound of total connectivity, to increase slowly; or said differently, a
    sparse DNN of connectivity $O(n/\log(n))$ could have been large enough for providing
    a consistent approximation to the true posterior distribution.


    # 2.4. Consistency of DNN structure selection


    It is known that the DNN model is nonidentifiable in general due to the symmetry
    of the network structure. However, by introducing appropriate constraints (Pourzanjani
    et al., 2017; Liang et al., 2018), we can define a set of neural networks such
    that each network in the set is unique up to simple node permutations, sign changes,
    etc. Let $\Theta$ denote such a set of DNNs, where each element in $\Theta$ can
    be viewed as an equivalent class of networks. Let $\upsilon(\cdot)$ be the transformation
    such that $\upsilon(\beta) \in \Theta$. Since $p_\beta = p_{\upsilon(\beta)}$,
    the posterior consistency (3) holds for $\upsilon(\beta)$ as well. In what follows,
    we rewrite $\upsilon(\beta)$ by $\upsilon(y, \beta)$ by including the network
    structure information. To serve the purpose of structure selection for the DNN,
    we consider the marginal inclusion posterior probability (MIPP) approach proposed
    in Liang et al. (2013) for high-dimensional variable selection. For each entry
    of $y$, we define its MIPP by $q_i = \int \sum_y e_{i|\upsilon(y,\beta)} \pi(y|y,
    D_n) \pi(\beta|D_n) d\beta$, where $e_{i|\upsilon(y,\beta)}$ indicates existence
    of connection $i$ in the network $\upsilon(y, \beta)$. Similarly, we define $e_{i|\upsilon(y^*,
    \beta^*)}$ as the indicator for connection $i$ in the true DNN $\upsilon(y^*,
    \beta^*)$. The MIPP approach is to choose the connections for which the marginal
    inclusion posterior probability is greater than a threshold value $\hat{q}$; that
    is, setting $\hat{Y}_q = \{j: q_j > \hat{q}, j=1,2,\dots,K_n\}$ as a Bayes estimator
    of the true model. To establish the consistency of $\hat{Y}_q$, the following
    identifiability condition for the true network $Y_*$ is needed.


    Let $A(\epsilon_n) = \{\beta : d(p_\beta, p_{\mu^*}) \ge \epsilon_n\}$. Define
    $\rho(\epsilon_n) = \max_{1 \le i \le K_n} \int_{A(\epsilon_n)^c} \sum_y e_{i|\upsilon(y,\beta)}
    - e_{i|\upsilon(y^*, \beta^*)} \pi(y|\beta, D_n) \pi(\beta|D_n) d\beta$, which
    measures the distance between the true DNN model and the models drawn from the
    posterior in the $\epsilon_n$-neighborhood $A(\epsilon_n)^c$. The identifiability
    condition can be stated as follows:


    +   B.1 $\rho(\epsilon_n) \to 0$, as $n \to \infty$ and $\epsilon_n \to 0$.'
