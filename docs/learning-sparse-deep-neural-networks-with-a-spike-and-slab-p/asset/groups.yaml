    \ the same probability distribution as the true data, then its structure, after\
    \ mapping into the network space $\\Theta$, must coincide with the true DNN structure.\
    \ Note that this identifiability is different from the one mentioned at the beginning\
    \ of this section, which is only with respect to structure and parameter rearrangements.\
    \ Theorem 2.2 concerns consistency of $\\hat{\\gamma}$ and its sure screening\
