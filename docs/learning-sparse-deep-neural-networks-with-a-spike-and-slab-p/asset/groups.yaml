  mdcn: "\n\n## 带尖峰-底座先验的稀疏深度神经网络学习\n\n孙岩, 宋奇帆, 梁法明 *\n\n统计学院, 普渡大学, 西拉法叶, IN 47907,\
    \ 美国\n\n## 文章信息\n\n文章历史记录：\n2021年2月6日收到\n2021年6月27日收到修改稿\n2021年9月11日接受\n2021年9月24日在线发布\n\
    \n关键词：\n贝叶斯神经网络\n稀疏深度学习\n后验一致性\n高维非线性变量选择\n模型校准\n\n## 摘要\n\n深度学习在许多机器学习任务中取得了巨大成功。然而，深度神经网络（DNNs）往往严重过参数化，使得它们计算成本高昂、内存密集、可解释性差且校准失准。我们在贝叶斯框架下研究稀疏DNN：我们建立了带尖峰-底座先验的贝叶斯DNN的后验一致性和结构选择一致性，并通过高维非线性变量选择、大型网络压缩和模型校准的示例说明其性能。我们的数值结果表明，稀疏性对于提高DNN的预测精度和校准至关重要。\n\
    \n© 2021 Elsevier B.V. 保留所有权利。\n\n## 1. 引言\n\n在过去十年中，深度神经网络（DNNs）在解决许多复杂机器学习任务（如模式识别和自然语言处理）方面取得了巨大成功。这些成功的关键因素是其通用近似能力，同时高度依赖大量参数。这些任务中使用的DNN可能包含数百层和数十亿个参数，例如\
    \ He et al. (2016) 关于图像分类。许多DNN严重过参数化；对于某些网络，仅 5% 的参数足以实现可接受的模型（Denil et al.,\
    \ 2013）。此外，这些过参数化网络不再具有良好的校准性（Guo et al., 2017）。\n\n为了降低DNN的复杂性并提高其校准性，一些研究者考虑了稀疏深度学习，例如\
    \ Schmidt-Hieber (2020)、Bauer and Kohler (2019)、Polson and Ročková (2018) 和 Sun\
    \ et al. (2021)。稀疏DNN的近似能力已从频率学派和贝叶斯两种视角进行了研究。从频率学派角度，Schmidt-Hieber (2020) 和\
    \ Bauer and Kohler (2019) 量化了稀疏DNN在逼近 Hölder 光滑函数时的近似误差。从贝叶斯角度，Polson and Ročková\
    \ (2018) 建立了带尖峰-底座先验的贝叶斯DNN的后验一致性，Sun et al. (2021) 建立了带混合高斯先验的贝叶斯DNN的后验一致性。最近，稀疏深度学习的理论也在变分推断框架下得到发展，例如\
    \ Chérief-Abdellatif (2020)、Bai et al. (2020b) 和 Bai et al. (2020a)。然而，由于变分后验分布的近似性质，得到的统计推断往往是次优的。\n\
    \n本文研究了带尖峰-底座先验的贝叶斯稀疏DNN的理论性质。它与 Polson and Ročková (2018) 密切相关，两者都采用尖峰-底座先验，但我们的理论更一般。具体来说，我们的理论是在输入维度和连接权重上界可随训练样本量增加、且激活函数为\
    \ Lipschitz 连续的假设下发展而来的，这涵盖了 ReLU、tanh 和 sigmoid 等许多流行激活函数。相比之下，Polson and Ročková\
    \ (2018) 假设输入维度为 O(1) 阶、连接权重有界且激活函数为 ReLU。本文还提供了一种可扩展算法，用于从贝叶斯DNN的后验分布中进行模拟。数值结果表明，稀疏性对于提高DNN的预测精度和模型校准至关重要。\n\
    \n本文其余部分组织如下。第 2 节介绍理论结果。第 3 节描述了一种用于贝叶斯DNN模拟的随机梯度马尔可夫链蒙特卡罗（SGMCMC）算法。第 4 节介绍网络压缩示例。第\
    \ 5 节以简短讨论结束全文。\n\n* 通讯作者。\nE-mail address: fliang@purdue.edu (F. Liang)。\n\n\
    ## 2. 理论结果\n\n令 \\(D_n = \\{x^{(i)}, y^{(i)}\\}_{i=1}^n\\) 表示含 \\(n\\) 个独立同分布观测的训练数据集，其中\
