    \ B.1 hold, then (i) $\\max_{1 \\le i \\le K_n} \\{ |q_i - e_{|v|(v^*, \\beta^*)}\
    \ | \\} \\to 0$ in probability; and (ii) for any pre-specified $\\hat{q} \\in\
    \ (0, 1)$, $\\lim_{n \\to \\infty} P(Y_* \\subset \\hat{G}_q) = 1$.\n\nIn practice,\
    \ the value of $\\hat{q}$ can be determined by a multiple hypothesis test, see\
    \ e.g. Liang and Zhang (2008). For simplicity, we often set $\\hat{q} = 0.5$.\
    \ Recall that $\\mathbf{y}^w \\in \\mathbb{R}^{L_h \\times L_{h-1}}$ denotes the\
