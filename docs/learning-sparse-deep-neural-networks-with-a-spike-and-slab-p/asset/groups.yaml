    We compare the proposed method with some recent unstructured compression methods
    including dynamic pruning with feedback (DPF) (Lin et al., 2020), dynamic sparse
    reparameterization (DSR) (Mostafa and Wang, 2019), sparse momentum (SM) (Dettmers
    and Zettlemoyer, 2019), consistent sparse deep learning (BNN$_{cs}$) (Sun et al.,
    2021), and variation inference for sparse deep learning (SVI) (Bai et al., 2020b).
    The numerical results are summarized in Table 1. The comparison shows that the
    proposed method can achieve higher prediction accuracy than the existing ones
    at a similar sparsity level.


    # 5. Conclusion


    In this paper, we study sparse deep learning from the Bayesian perspective. Theoretically,
    we establish posterior consistency and structure selection consistency for Bayesian
    DNNs with a spike-and-slab prior. We give the posterior contraction rate, and
    propose to use the marginal inclusion posterior probability approach to determine
    the structure of the sparse DNN. We employ a scalable SGMCMC algorithm for simulating
    from the posterior of the sparse DNN, which has about the same order of computational
    complexity as popular optimization algorithms such as SGD. When irrelevant features
    exist in the dataset, our numerical results show that learning a sparse DNN is
    always rewarded in prediction compared to blindly learning a large, fully connected
    DNN. The proposed method can be applied for large-scale network pruning tasks
    as an unstructured dynamic pruning method, where the sparsity mask is adjusted
    systematically during training. Our numerical result show that the proposed method
    can achieve the state-of-the-art performance in network structure selection, large-scale
    network pruning and model calibration.


    As mentioned previously, sparsity is essential for improving the calibration of
    the DNN (Wang and Ročková, 2020; Lee et al., 2020). This work provides a practical
    and efficient method for learning sparse DNNs with a theoretical guarantee for
    identification of an appropriate sparse structure, and thus it will naturally
    enhance the development of trustworthy artificial intelligence.


