  md: '# 4.2. Comparison with the literature


    For comparative purposes, we have reproduced the results obtained in [28] using
    the CTU13 dataset. Also, we added the analysis of the ISOT HTTP Traffic and CICDDoS2019
    datasets. The first comparison used the results obtained by the technique proposed
    in [28] on the ISOT HTTP Bot Dataset. In this dataset, Pekang and Acoran''s solution
    also works better than the imputation method (window). For the CTU13 dataset,
    ANTE is able to classify all hosts correctly, however Pekang and Acoran is superior
    to ANTE and Aorcan. The last comparison is to the CICDDoS2019 dataset. In this
    case, Pekang and Acoran obtains an accuracy of 96.87%.The result of this is that,
    though the imputation method fails to identify the bots, ANTE is able to classify
    all correctly.


    # 5. Conclusion


    Given the diverse potential of attacks, and the difficulty in detecting them mainly
    with the advent of the Internet of Things (IoT) and mobile devices, we proposed
    the ANTE for early detecting bots by machine learning. For the three analyzed
    scenarios, ANTE was effective in classifying the bots and proposed after the attack
    of the evaluation nodes. For the system architecture, our machine learning system
    selects the best learning machine for each scenario. We found that ANTE takes
    into account the particularities of each scenario, including different types of
    attacks, and the most demanding for each scenario. Thus, ANTE has highlighted
    the importance of the choice of techniques to ensure high assertiveness in bot
    detection. Another important finding is that, ANTE has no false positives when
    detecting packets even before the start of the attack. Even without the attack
    detected, ANTE was able to identify bots in alone. Future work will involve the
    reduction in the false negative using other strategies. Also, it will involve
    the improvement in the processing time of ANTE to make the solution feasible.


    Finally, the results obtained show it is possible to verify that the proposed
    algorithm defined by ANTE correctly classifies all the hosts and the test windows.
    As observed in the scenarios, the SVM, Naive and MLP models were not successful
    in classifying the bots found in the dataset.


