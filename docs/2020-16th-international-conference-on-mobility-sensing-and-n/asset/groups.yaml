    内部组件在滑动窗口中运行以进行实时数据处理，并在离线模式下使用历史数据作为输入。ANTE 使用内部组件通过滑动窗口收集所有流量。系统网络流量的处理方式如下。使用这种方法，有两个参数至关重要：窗口长度和滑动窗口。滑动是将新的网络包添加到窗口并将旧数据包排除在计算之外的频率。小窗口可以减少延迟，但会随着准确性的下降，如此小的窗口无法正确捕捉机器人的行为。ANTE
