    by applying a series of aggregate functions over the data. Features require further
    grouping of the data. For features based on outgoing or incoming traffic from
    a host, packets are grouped by either source or destination. Moreover these features
    allow converting the data into an entirely different structure. The result of
    these transformations are then used to build the dataset.


    ANTE involves five steps: network traffic; (ii) the identification of host behavior;
    (iii) the identification of the best model (AutoML); (iv) the anticipation of
    bots; and (v) notification. It must have a monitoring port so that the network
    administrator can configure to forward a copy of the network traffic to the device
    that is hosting ANTE. ANTE analyzes the features that represent the behavior of
    each device. ANTE employs autonomous machine learning to identify the pipeline
    for the moment. This pipeline processes copies of traffic to optimize data distribution
    and choose the most appropriate learning model. After defining, the system is
    ready for deployment in the real world, where it is able to analyze the behavior
    of the devices on network when bots are identified. The next subsections define
    the relationship between these steps.


    # 3.2. Identifying the Best Model (AutoML)


    In this step, ANTE employs AutoML framework to analyze the data in the training
    window and select the best machine learning pipeline which comprises a combination
    of preprocessing data, machine learning techniques and hyperparameters. Some frameworks
    may not have the capability to handle the classification, but it is possible to
    classify the results using preprocessing. Preprocessing methods, some options
    improve data distribution, such as reduction in dimensionality, modifying low-discriminating
    features, and selecting the most representative ones.


    # 3.1. Traffic and Behavior Extraction


    The system analyzes traffic. Thus, as first the internal component is responsible
    for collecting all network traffic and extracting its features. In a real network,
    the internal component is implemented in either a physical or virtual device.
    In situations where there is a lot of traffic, the internal component may use
    a fraction of amount captured traffic instead of the entire capture. Such action
    takes a place without a significant impact.


    The internal component operates in a sliding window for real-time data processing
    and offline mode, using historical data as input. ANTE collects all traffic using
    the internal component a sliding window. The system network traffic is processed
    following. Using this approach, two parameters are critical: window length and
    sliding window. The sliding is the frequency in which new network packets are
    added to the window and old packets are excluded from the computation. A small
    window reduces the delay, but it comes with a decrease in accuracy such a small
    window cannot rightly capture the behavior of the bot. ANTE can also increase
    the speed in which a traffic segment is processed increasing sliding window with
    accuracy. This issue shows that the design and implementation must be based on
    the trade-off between computational costs and performance.


    After grouping the observed traffic by time windows, a set of features is extracted
    and computed


    # 3.3. Anticipating Bot Detection


    For identifying a bot, a machine learning algorithm must classify one or more
    bots. As output of this classification returns to ANTE, anta checks if device
    has been classified as a bot. When ANTE identifies a bot it decides to notify
    the relevant services. The address offers options such as limiting or blocking
