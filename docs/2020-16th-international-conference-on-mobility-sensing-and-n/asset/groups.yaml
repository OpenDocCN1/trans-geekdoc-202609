    botnet ANTE anticipates the behavior of bots with autonomous machine learning
    techniques creating to anticipate bot signals. Different from other works in the
    literature, as [13], the ANTE design allows to identify different types of botnets
    throughout its execution. Therefore, ANTE automatically selects the most appropriate
    machine learning engine for scenario to maximize the correct classification accuracy.
    The autonomous machine learning pipeline consists of three parts: (i) data collection
    and preprocessing; (ii) estimator; (iii) adaptation and evaluation. Machine learning
    algorithms are relevant for identifying bots in high-dimensional data. However,
    each machine learning algorithm has limitations and not performs well for the
    different uses of them. Therefore, ANTE aims to deal with these particularities
    of the different botnets for best use of machine learning techniques.


    This section focuses on machine learning techniques designed to detect botnets.
    They learn from large data amount, being quick and assertive in automating tasks,
    such as classification, detection or even estimation. In machine learning techniques,
    this paper assists in understanding their effectiveness for the early detection
    of bots.


    The most common machine learning techniques focus on the classification of network
    traffic from real users to malicious data [14]. These techniques have been also
    applied to anticipate attacks based on bot activities [15, 16]. Supervised machine
    learning techniques require labeled data to train the model and how a new record
    would be classified. There are several supervised machine learning algorithms.
    The literature often employs neural networks and decision trees to classify devices
    with similar data to distinguish legitimate devices from bots [19, 20]. Unsupervised
    algorithms do not need training before classifying data.


    The ANTE evaluation has input network traffic datasets: (i) Internet of Things
    (IoT) Botnet Dataset, which contain 51 of Check variety datasets (CTI13), and
    (iii) DDoS Evaluation Dataset (CICDOS2019). The experiments show that ANTE identifies
    the botnets following the attack. Using ANTE, results from two different scenarios
    show an accuracy of 99.87% and an average botnet detection precision of 100%.
    Furthermore, ANTE can choose an algorithm and the feature preprocessing steps
    for identifying bots.


    The results also highlight different stages of botnet behavior and correct model
    to predict attacks. Its limitation is mainly by the number of stages. If a botnet
    has no stage, the solution does not work well for that behavior.


    This paper proceeds as follows: Section 2 presents related works, Section 3 describes
    the evaluation method and results. Finally, Section 5 concludes the de-facto work
    and highlights future directions.


    # Related Works


    Different works in the literature have investigated how to identify and detect
    infected devices. They have addressed this problem at different scale and network
    levels. In addition, they used machine learning techniques like (i) anomaly-based
    detection, (ii) signature-based detection, (iii) graphs, or unsupervised machine
    learning.


    The ANTE detection techniques aim at identifying misbehavior based on observed
    characteristics, such as ports used in data, high latency, or traffic volume.
    In signature-based detection, solutions provide known ways to detect infected
    devices. Graph-based techniques generate mathematical models to show the relationship
    between network objects and detect bots. Entropy maps the degree of randomness
    of the network and the interception of communication between malicious devices.


    # The ANTE System


    This section describes the system for anticipating botnets on machine learning
    techniques (ANTE). The ANTE system captures network traffic and searches for features,
    selection and hyperparameters of the selected botnet. The attack of the botnet
    is irreversible, so a severe exhaustion due to a DDoS attack. After capturing
    network traffic, the system takes out the behavior of the network hosts and, using
    machine learning (AutoML), ANTE goes through preprocessing, the classifier, and


    The Autonomous Machine Learning (AutoML) system aims at maximizing the use of
    machine learning. Here, AutoML automates parts of the work with selection of features
    and hyperparameters [21]. Different approaches [22] show the difficulty of selecting
    the best hyperparameters. However, there are efforts to unify the choice of features
    and hyperparameters. This is solved by the Combined Algorithm Selection and Hyperparameter
    (the CASH problem). One of the first approaches in this is Auto-Wiki (2014), followed
    by other approaches, such as Auto-Sklearn [25] and Auto-Keras [20].'
