    ## 4.2 与文献的比较


    为了对比，我们使用 CTU13 数据集重现了 [28] 中获得的结果。此外，我们增加了对 ISOT HTTP 流量和 CICDDoS2019 数据集的分析。第一次对比使用了
    [28] 中提出的技术在 ISOT HTTP 机器人数据集上获得的结果。在这个数据集中，Pekang 和 Acoran 的解决方案也优于填充方法（窗口）。对于
    CTU13 数据集，ANTE 能够正确分类所有主机，然而 Pekang 和 Acoran 优于 ANTE 和 Aorcan。最后一次对比是 CICDDoS2019
    数据集。在这种情况下，Pekang 和 Acoran 获得了 96.87% 的准确率。结果是，尽管填充方法未能识别机器人，但 ANTE 能够正确分类所有。


    ## 5. 结论


    考虑到攻击的多样化潜力，以及由于物联网 (IoT) 和移动设备的出现导致检测这些攻击的困难，我们提出了 ANTE 通过机器学习早期检测机器人。对于三个分析的场景，ANTE
    在分类机器人方面是有效的，并在评估节点攻击后提出了相应的方案。对于系统架构，我们的机器学习系统为每个场景选择最佳学习机。我们发现 ANTE 考虑了每个场景的特殊性，包括不同类型的攻击以及每个场景最高要求的部分。因此，ANTE
    强调了选择技术以确保机器人检测高断准确性的重要性。另一个重要发现是，ANTE 在在攻击开始之前检测数据包时没有误报。即使在没有攻击的情况下，ANTE 也能正确识别。最后，结果表明，通过
    ANTE 方法是可行的。


