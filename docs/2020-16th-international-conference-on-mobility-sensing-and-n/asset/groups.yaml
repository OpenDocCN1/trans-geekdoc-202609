    # # Early Bot Detection for the Internet of Things by Autonomous Machine Learning


    (Invited Paper)


    Anderson Bergamani de Vieira, Alexandre Medeiros Araujo, Michele Nogueira

    CCCSC - Center for Computational Security Science

    Federal University of Paraná, Brazil

    Emails: <abneira, araujojo, michele>@inf.upr.br


    Abstract—The high costs generated by the internet and the increasing number of
    infected devices (IoT) propel the early detection of botnets (i.e., lately) to
    gain advantage against attacks. Botnet detection is challenging due to the continuous
    mutation, sophistication, and massive data volume, which many resulted from numerous
    networks and IoT. To mitigate the impact by identifying the nature of malware,
    the classification of malicious traffic, and the types of attacks. This paper
    presents ANTE, a system for Anticipating botnets based on machine learning to
    detect different threat scenes throughout its execution. Hence, ANTE autonomously
    selects the most appropriate machine learning pipeline for each type of botnet
    to maximize the classification accuracy. We compare the results of our method
    with the literature using three datasets: IoT Helmet, BTU, and CICD2019. Results
    show an average accuracy of 99.87% and average botnet detection precision of 100%.


    A bot is one of the most problems in cybersecurity.

    A bot is a device connected to the Internet or IoT and infected by malware, allowing
    an attacker to remotely control malicious actions. A botnet comprises infected
    devices and also (i.e., devices controlled by an attacker) [4]. The danger of
    a bot lies in the fact that it can launch different types of attacks. In particular,
    botnets serve as a channel to: (i) send bulk correspondence (spam); (ii) capture
    sensitive information; (iii) and launch Distributed Denial of Service (DDoS) attacks.
    In addition to botnets provide new ways of exploiting bots [6], and new types
    of attacks. Furthermore, the literature highlights that botnets provide challenges
    for software countermeasures [7].


    Technical diversity provides the creators of botnets with unique characteristics
    making the botnet detection [8]. The geographical distribution and diversity of
    also also make the difficulty in detection [5]. Botnets cover different regions
    and have global reach [9]. Romero et al [10] claim that malware hides malicious
    code, so that signatures are difficult to detect. With the advent of new technologies
    and anti-sophistication, many attackers manage to evade detection. Drive [11]
    show that in general, attackers flood networks with malicious packets similar
    to real ones, making it challenging to identify malicious flow from the real one.


    Li et al [12] state that attackers are alternating between sending packets and
    remaining temporarily inactive to hide botnet detection and attack order. Other
    serious limitations lie in the fact that it is non-trivial to select the proper
    detection technique and its configuration, especially when facing zero-day-attacks.
    Given the variety of bot users, and the difficulty in identifying bots, it is
    evident that the literature presents solutions to detect botnets. A solution needs
    to anticipate the future threats to limit the services caused by attacks and also
    adapt themselves to treat each attack [5].


    This work presents ANTE, a system for Anticipating


    # 1. Internet


    The Internet of Things (IoT) is prominent in academia and industry, with many
    applications. IoT devices have constraints in bandwidth, processing, memory, and
    energy. They are infiltrated by vulnerabilities in hardware and software, which
    makes these devices easy for attackers to exploit. Attackers exploit the vulnerabilities
    and benefit from the lack of security. These limited devices limit the potential
    of Machine-to-Machine (M2M) connections to grow. In 2019, CSO reported the existence
    of 7.4 billion connected devices, and an estimate is for 2025. However, the number
    of connected devices is expected to increase, reaching 29.3 billion by 2023. Thus
    [1] predicts that, by 2022, 396 exabytes per month will be generated worldwide
    [3]. Such growth leads to the destructive potential of devices when exploited
    by attackers.'
