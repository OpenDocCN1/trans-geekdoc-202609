    12 次攻击中，场景包含了实验第一天的网络基础输入输出系统 (NetBIOS)攻击。在检测到攻击后，我们分析了第一天 10:30 的流量。通过分析数据，无法找到特定时间的流量。因此，测试调查了
    12 月 5 日发生的峰值流量。


