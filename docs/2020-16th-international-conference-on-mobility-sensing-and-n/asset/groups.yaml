    ## 基于自主机器学习的物联网早期僵尸网络检测


    （受邀论文）


    Anderson Bergamani de Vieira, Alexandre Medeiros Araujo, Michele Nogueira

    CCCSC - 计算安全科学中心

    巴西帕拉纳联邦大学

    邮箱：<abneira, araujojo, michele>@inf.upr.br


    摘要—互联网产生的高昂成本以及受感染设备（IoT）数量的增加，迫使僵尸网络的早期检测（即尽早检测）以便在对抗攻击中占据优势。由于持续的变异、复杂性以及海量数据（其中许多源于众多网络和物联网），僵尸网络检测面临巨大挑战。为了通过识别恶意软件属性、恶意流量分类和攻击类型来减轻影响，本文提出了
    ANTE，这是一种基于机器学习的僵尸网络预测系统，用于在其执行过程中检测不同的威胁场景。因此，ANTE 自主地为每种僵尸网络选择最合适的机器学习流水线，以提高分类准确率。我们使用三个数据集：IoT
    Helmet、BTU 和 CICD2019 将我们的方法与现有文献进行了对比。结果显示，平均准确率达到 99.87%，僵尸网络检测平均精确率为 100%。


    僵尸程序（bot）是网络安全领域最大的问题之一。


    僵尸是指连接到互联网或物联网并被恶意软件感染的设备，允许攻击者远程控制恶意行为。僵尸网络由受感染设备以及（即受攻击者控制的设备）组成 [4]。僵尸的危险之处在于它可以发起不同类型的攻击。特别是，僵尸网络作为通道用于：(i)
    发送大量邮件（垃圾邮件）；(ii) 敏感信息；(iii) 发起分布式拒绝服务（DDoS）攻击。僵尸网络提供了利用僵尸的新方法 [6] 以及新型的攻击。此外，文献强调僵尸网络为软件对策措施带来了挑战
    [7]。


    技术的多样性为僵尸网络创建者提供了独特的特性，使得僵尸网络检测变得 [8]。地理分布和多样性也增加了检测难度 [5]。僵尸网络覆盖不同地区并具有全球影响力
    [9]。Romero 等人 [10] 声称恶意软件隐藏了恶意代码，导致特征码难以检测。随着新技术的出现和反复杂的手段，许多攻击者成功逃避了检测。研究 [11]
    表明，通常攻击者用与真实类似的恶意数据包淹没网络，使得从真实流量中识别恶意流量具有挑战性。Li 等人 [12] 指出，攻击者在发送数据包和临时不活动之间切换，以隐藏僵尸网络检测和攻击顺序。其他严重的局限性在于，选择合适的检测技术及其配置并非易事，特别是在面对零日攻击时。鉴于僵尸用户的多样性以及识别僵尸的困难，显而易见的是文献提供了检测僵尸网络的解决方案。解决方案需要预测未来威胁以限制攻击造成的服务，并适应以处理每种攻击
    [5]。


    这项工作介绍了 ANTE，一种用于预测的系统


    # 1. 互联网


    物联网（IoT）在学术界和工业界都非常突出，具有许多应用。物联网设备在带宽、处理、内存和能量方面受到限制。它们被硬件和软件漏洞渗透，使得这些设备容易被攻击者利用。攻击者利用漏洞并从缺乏安全性的获益。2019
    年，CSO 报告存在 74 亿台连接设备，这是对 2025 年的估计。然而，连接设备的数量预计将增加，到 2023 年将达到 293 亿。因此 [1] 预测到
    2022 年，全球每月将产生 396 艾字节 [3]。这种增长导致了设备被攻击者利用时的破坏性潜力。ANTE 使用自主机器学习技术预测僵尸行为。与文献中的其他工作
    [13] 不同，ANTE 的设计允许在其执行过程中识别不同类型的僵尸网络。因此，ANTE 自动为场景选择最合适的机器学习引擎，以最大化正确分类准确率。自主机器学习流水线由三部分组成：(i)
    数据收集和预处理；(ii) 估计器；(iii) 自适应和评估。机器学习算法对于识别高维数据中的僵尸非常重要。然而，每个机器学习算法都有局限性，且在不同性能上表现不同。


    本节重点关注所选僵尸网络的特征和超参数选择。僵尸网络的攻击是不可逆的，例如由于 DDoS 攻击导致的严重耗尽。在捕获网络流量后，系统提取网络主机的行为，并使用机器学习（AutoML），ANTE
    经过预处理、分类器和


    自主机器学习（AutoML）系统旨在最大化机器学习的使用。在这里，AutoML 通过特征和超参数的选择实现了部分工作的自动化 [21]。不同的方法 [22]
    显示了选择最佳超参数的困难。然而，人们努力统一特征和超参数的选择。


    ## 2. 相关工作


    文献中的不同工作研究了如何识别和检测设备。它们在不同的规模和网络层级解决了这一问题。此外，它们使用了机器学习技术，如 (i) 基于异常的检测、(ii) 基于特征的检测、(iii)
    图，或无监督机器学习。


    ANTE 检测技术旨在根据观察到的特性识别异常行为，例如数据中使用的端口、高延迟或流量。在基于特征的检测中，解决方案提供了检测感染设备的已知方法。基于图的技术生成数学模型来显示网络对象之间的关系并检测僵尸。熵映射了网络的随机程度以及恶意设备之间通信的拦截。


    ## 3. ANTE 系统


    本节描述了基于机器学习技术的僵尸网络预测系统（ANTE）。ANTE 系统捕获网络流量并为所选僵尸网络搜索特征、选择和超参数。


    领域最早的方法之一是 Auto-Wiki (2014)，随后是其他方法，如 Auto-Sklearn [25] 和 Auto-Keras [20]。


    '
