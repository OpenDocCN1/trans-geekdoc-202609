    “The use of machine learning is a core competence to be competitive in the future.
    Currently, there is an oversimplification between its use and its impact on business
    success. The example of the product list sorting algorithm demonstrates what needs
    to be done for the successful introduction of machine learning on the way to becoming
    an AI-based company.”


    Sebastian Rose, Senior Data Scientist


    “In this use case, Sebastian doesn’t only introduce us to different machine learning
    algorithms based on their difficulties in implementation and their advantages/disadvantages,
    he also gives us some details about the mathematical aspect of those algorithms.
    I enjoyed the emphasis he put on the collaboration with the stakeholders as well.”
    Elif Schaefer, Head Of Business Intelligence


    ## Technical implementation of the adaptive sorting strategies


    The modeling difficulty and system complexity of adaptive product list sorting
    are more than for rule-based sorting but less than prognostic sorting. The adaptive
    model gained trust and acceptance from business stakeholders, since it could be
    easily explained to them.


    The technical implementation requires a database and a server. For the solution
    it is required to track web, sales, and product data. Such data is transferred
    to an open-source enterprise search platform that is the engine powering the product
    service.


    ![The myToys technological stack for the Product List Sorting](Image00005.jpg)


    In sum, the MYTOYS group switched the logic of the product overview pages from
    a rule-based algorithm to an adaptive one. Perhaps the most important measure
    of success was that the bounce rate dropped by twelve percent, which means that
    customers liked the new sorting better, which at the end could also be seen in
    an significant uplift in conversion of seven percent, and in revenue per visitor
    of six and a half percent. The customer is more likely to be “hooked” by our product
    presentation and therefore to decide to purchase products at mytoys.de.


    From the Q&A “How does adaptive sorting connect to the sorting by popularity?”
    “It is an algorithm for sorting by popularity.”


    “How rich is the tech stack of your data warehouse?” “We are building a data vault
    model and also moving to a data lake scenario to ensure continuous real-time deployment
    scenarios.”


    “What was the feature selection process for the adaptive sorting algorithm?” “We
    agreed on the main features early on and deployed an `XGBoost` algorithm with
    very little overfitting. The features include business aspects like availability
    and also the seasonality of the product.”


    For open positions see [`https://mytoysgroup.jobs/`](https://mytoysgroup.jobs/)

