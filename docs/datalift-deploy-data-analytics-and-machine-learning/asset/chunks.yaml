  trans: "\n\n# 自动化信用风险评估\n\n## 如何让 Klarna 扩大在线购物交易规模\n\nVaibhav Singh, Senior Data\
    \ Science Manager, Klarna  \nModerated by Corrie Bartelheimer\n\n作为领先的在线支付解决方案提供商，自动化决策需要快速且准确。Klarna\
    \ 使用机器学习模型，在销售点提供一站式解决方案，有效地将卖家和买家的风险都降至最低。\n\n[Klarna](https://www.klarna.com/)\
    \ 是一家支付解决方案提供商，为 20 万多家商家每天处理超过 100 万笔在线支付。在高峰期，每天可处理多达 200 万笔购物交易，主要提供三种支付选项：立即支付或稍后支付（例如，交货后）或分期付款。由于\
    \ Klarna 的买家保护政策，消费者享有无风险购物。由于 Klarna 承担欺诈和信用风险，商家享有无风险销售。Klarna 目前是欧洲估值最高的金融科技公司，估值超过\
    \ 100 亿美元。\n\n## Klarna 的信用风险和欺诈风险评估\n\nKlarna 促进一站式结账和支付流程，并承担信用风险。风险是违约概率加权敞口（交易规模加上任何利息）与付款或追偿可能性相对于违约的可能性。我们分析每个决定因素，以最大限度地降低总体风险。\n\
    \n信用风险的监督建模面临挑战。最重要的是确定目标正确。贷款会到期，因此我们至少需要六个月的数据。此外，预测必须针对每个信用产品和每个客户在贷款整个生命周期中进行特定分析，包括客户在不同产品之间切换的情况。接下来，来自信用评分合作伙伴的信息未经标准化。对于欺诈风险，Klarna\
    \ 区分第一方（买方虚假陈述或提供虚假信息）、第二方（明知参与的“洗钱账户”持有人）和第三方（被盗身份）欺诈。\n\n## 实时自动化决策架构\n\n关键要素是数据管道，可以在一台或多台机器上使用各种工具完成。Klarna\
    \ 的数据科学家可以自由选择首选设置。典型流程可能如下所示：提取数据集，在其之上创建特征，将数据分割用于训练，查看模型性能，验证，并在需要时重新校准模型。模型部署后，我们会跟踪模型漂移。一旦发生这种情况，我们会进行调整。\n\
    \n“为了监控模型漂移，我们必须确定要设置哪些指标，例如，平均模型得分，以便在正确的时间触发警报。” Vaibhav Singh, Senior Data\
    \ Science Manager\n\n“最有趣的是，Klarna 如何在如此受监管的领域部署机器学习，以及随之而来的挑战。对于某些应用，Klarna 的模型每六个月接受一次审计。在我看来，他们的成功表明，即使在如此受监管的领域使用，机器学习仍然能增加巨大价值。”\
    \ Corrie Bartelheimer, Data Scientist\n\n数据来自许多来源，因此质量和完整性是持续面临的挑战。解决这一挑战对特征工程至关重要，尤其是确定模型将拥有多少个特征。通常，建模涉及添加或减少特征以及超参数优化，以提高准确性。对于探索和建模，Klarna\
    \ 使用 AWS Sagemaker，但对于实际托管，我们使用专有平台。在信用风险评估中，我们寻找的一些特征包括以下内容：\n\n* 交易相关（例如，购物车、配送）\n\
    * 基于客户（例如，购买或付款频率）\n* 基于商家（例如，违约率）\n* 基于图（例如，交易或客户之间的链接）\n\n![Model Generation\
    \ Architecture at Klarna](img/Image00007.jpg)\n\n来自问答环节\n\n“关于部署：Klarna 会重新训练模型，一旦完成，您会自动部署吗？”\n\
    \n“在部署之前，我们会审查报告，因此部署决策由工作人员在进行尽职调查后做出。”\n\n“Klarna 是否探索传统信用评分的替代方案？”\n\n“是的，我们寻求利用交易信息以及更广泛的在线世界信息，以增加公平性和安全性。”\n\
    \n查看空缺职位请访问 [www.klarna.com/careers](https://www.klarna.com/careers/)\n\n# 大规模图像元数据提取\n\
    \n## OLX 如何为其在线分类广告平台产品化深度学习模型\n\nAlexey Grigorev, Lead Data Scientist, OLX  \n\
    Moderated by Henrieke Max\n\nOLX 将深度学习模型应用于每天 1000 万张图像（即每秒超过 100 张），用于内容审核和确定图像质量。\n\
    \n[OLX Group](https://www.olx.com/) 是一个交易平台网络，在 30 多个国家/地区以 20 多个品牌运营，包括 Avito、OLX、Otomoto、Property24\
    \ 等。三亿月活跃用户通过该平台找到家园、购买或出售汽车、找工作、出售不再需要的物品或达成所需物品的交易。\n\n## 图像销售产品\n\n在线图像销售产品，不仅包括日常消费品，还包括商业商品、房地产和高价值物品。OLX\
    \ 面临的一些关键挑战是构建图像分类器、评估图像质量、检测政策违规行为，并防止列出非法物品。图像分类器拥有与产品一样多的类别，并有助于确定列表和图像是否一致。分类器还可防止非法销售。评估图像质量（好与坏）是对卖家的一项服务，因为图像质量会推动买家兴趣。检查图像内容可保护买家，因为我们可以确定图片中是否包含非法信息或内容。\n\
    \n## 扩展图像分类\n\nOLX 通过提取和存储元数据，为大量图像产品化多个模型。此元数据服务的工作原理如下。我们使用模型包装器，从数据库获取图像并进行所有必要的预处理，例如调整图像大小和归一化。然后，我们在元数据上运行深度学习模型，以对类别或质量等内容进行预测。通常，元数据服务由需要预测的内部客户使用，例如审核团队或营销团队。\n\
    \n“我们的客户不关心模型服务的细节；他们提供图像，然后获得预测结果。” Alexey Grigorev, Lead Data Scientist\n\n\
    “想象一下，每天需要监控 1000 万张图像的质量和适当性——需要多少内容审核员？作为在线市场，OLX 使用深度学习来自动化商品和服务图像的质量保证和合规性，扩展其解决方案以容纳大量视觉数据，并通过优化生产基础设施降低成本。”\
    \ Henrieke Max, Data Analyst\n\n"
