    \ as expected.”\n\n“Do you collect feedback from multiple users, and how do you\
    \ validate a difference in feedback?”\n\n“Feedback is something delicate. Getting\
    \ annotations right may be complicated, and there is usually variability within\
    \ the same person. Indeed we measured differences within the same customer.”\n\
    \n“How do you deal with model drift?”\n\n“You can and should put metrics in place\
    \ to monitor how the behavior changes. It nevertheless is a challenging issue,\
    \ especially within different campaigns.”\n\n“Models decay with time; how do you\
    \ trigger the retraining?”\n\n“You can start small and fairly simple, possibly\
    \ even manually. Once you are sure you can validate all the user feedback coming\
    \ and trust all your monitoring metrics, then you can automate retraining to correct\
    \ any kind of data or model drift and re-deploying.”\n\nFor open positions at\
    \ Siemens Mobility, see [www.mobility.siemens.com/global/en/company/jobs.html](https://www.mobility.siemens.com/global/en/company/jobs.html)\n\
    \n---\n\n## Automated decision making for supplier management\n\n### Invoice classification\n\
    \n**Dr. Nicholas Hoff**  \nFounder, New Approach Technologies  \nModerated by\
    \ Evan Simpson\n\nCan you automatically and accurately decide whether to pay an\
    \ invoice? How to automate decision making at the 99.5% confidence level.\n\n\
    [New Approach Technologies](http://newapproachtechnologies.com/) is my freelancing\
    \ firm. I consult, build quick prototypes, and deploy production systems. Consulting\
    \ often is exploratory and driven by questions clients have, for example, about\
    \ the feasibility and value of Data Science for their company. Prototypes are\
    \ a low-risk way for people to see what’s possible with their data.\n\n“I have\
    \ built many production systems over the past years, especially in the banking\
    \ sector. The deployment of machine learning has now become common in this area,\
    \ partly because of the plentiful data available.” Nick Hoff, Machine Learning\
    \ expert\n\nI will show you the invoice classification problem that Société Générale\
    \ presented to me. We will survey some of the machine learning techniques that\
    \ I considered using, why they worked, and when they didn't work. Finally, I will\
    \ discuss the solution that went into production and elaborate on some of the\
    \ more interesting points about productionizing machine learning.\n\n### Classifying\
    \ invoices to automate payment\n\nOne branch of Société Générale runs a corporate\
    \ car leasing operation. Since the cars are leased, Société Générale is responsible\
    \ for the maintenance. Whenever a car goes to a maintenance shop, the maintenance\
    \ or repair generates an invoice. The invoice goes to Société Générale, and an\
    \ expert decides whether or not to pay it. The goal of this project was to automate\
    \ that decision partially.\n"
  trans: "\n\n![Siemens Mobility use cases](img/Image00002.jpg) “部署必须指导之前采取的所有步骤。例如，如果你正在进行检测，并且打算使用最庞大、最强大的探测器，但发现没有硬件来运行它，那么你需要回到白板前选择其他东西。”\
    \ Irina Vidal Migallón，AI 与计算机视觉技术负责人\n\n我将向你展示几个用例，其核心都具有相同的机器学习概念。但你会看到，它们看起来完全不一样，这恰恰是因为它们的部署方式不同。\n\
    \n## 用例 1：铁路轨道接头检查\n\n第一个用例是关于铁路轨道接头的检查。我们通过特制的铁路车辆收集数据，这些车辆四处运行收集图像。其核心机器学习任务是定位接头，并确定接头是否损坏（或未损坏）以及损坏类型。\n\
    \n对于第一个用例，我们的客户是一家铁路维护商。铁路维护商确保铁路安全，例如，通过检查跨越国家的数千米铁路的接头，并识别这些接头上的任何损坏。过去，需要有人勘察铁路轨道，或者手动浏览大量图像。大部分画面都没有相关内容，因为并非每毫米都有一个接头。实际上，你拥有\
    \ TB 级的数据，但只有很小一部分适用。\n\nSiemens Mobility 有一个云应用程序，使铁路维护商能够通过用户界面勘察接头。工作流程如下：有一个存储\
    \ TB 级图像的存储桶，我们有几个容器，首先检测接头，然后分类是否损坏以及损坏类型。损坏数据等其他数据存储在数据库中。用户可以通过地图，点击标记为损坏的接头，并查看特定信息。\n\
    \n这个过程的关键部分是与用户的反馈循环。我们的用户拥有丰富的领域知识，但可能不熟悉机器学习的数据要求。在进入开发之前，你需要找到获取他们输入的正确方式，以及他们希望如何与系统交互。部署后，你需要不断检查用户如何与你的应用程序交互。\n\
    \n## 用例 2：自动驾驶铁路的信号识别\n\n第二个用例是信号识别。无论我们谈论的是城市有轨电车还是干线列车，信号都沿路线分布。其核心，这是一个定位和分类问题。然而，魔鬼在于细节。\n\
    \n在这个用例中，我们知道不能依赖与列车的数据链路。我们需要列车上的计算机。此外，预测需要实时进行，并且必须在任何温度下都能工作，无论是 +40°C 还是\
    \ -40°C。该用例要求列车上具有极其坚固的硬件。\n\n### 考虑差异\n\n让我们考虑一下在机器学习中用于这两个用例所产生的一些差异。在铁路轨道检查的案例中，我们在云平台上部署，在\
    \ CPU 上运行，并使用了 Python 技术栈。我们使用 S3 存储桶，并且由于延迟要求不严格，我们可以批量处理。即使花费更长时间，也完全没问题。此外，没有与其他进程竞争资源。\n\
    \n对于信号识别，最大的担忧是安全性。解决方案必须稳定。硬件需要在任何温度下始终保持稳定，这已经限制了你可以使用的 GPU 类型——甚至是否可以使用 GPU。还有特殊的立法，自动驾驶方面的立法仍处于早期阶段。还有实时要求。\n\
    \n从预生产角度来看，看起来像两个非常相似的机器学习问题——都是“检测与分类”——但在客户视角和解决方案部署方面却有很大不同。\n\n总之，你的部署方式塑造了整个产品，也影响了原始机器学习算法。\n\
    \n### 来自问答环节\n\n“投入生产后是否有任何意外情况？”\n\n“嗯，有。例如，铁路维护商反馈说他们得到了全是误报。我们发现图像没有按预期上传。”\n\
    \n“你会从多个用户那里收集反馈吗？你如何验证反馈的差异？”\n\n“反馈是一件微妙的事情。正确标注可能很复杂，同一个人之间通常也存在差异。确实，我们测量了同一客户内部的差异。”\n\
    \n“你如何处理模型漂移？”\n\n“你可以并且应该设置指标来监控行为的变化。尽管如此，这仍然是一个具有挑战性的问题，尤其是在不同活动之间。”\n\n“模型会随时间衰减；你如何触发重新训练？”\n\
    \n“你可以从小规模、相对简单的方式开始，甚至可以手动操作。一旦你确信可以验证所有来自用户的反馈并信任所有监控指标，那么你就可以自动化重新训练，以纠正任何类型的数据或模型漂移并重新部署。”\n\
    \n有关 Siemens Mobility 的职位空缺，请参见 [www.mobility.siemens.com/global/en/company/jobs.html](https://www.mobility.siemens.com/global/en/company/jobs.html)\n\
    \n---\n\n## 供应商管理的自动化决策\n\n### 发票分类\n\n**Dr. Nicholas Hoff**  \n创始人，New Approach\
    \ Technologies  \n由 Evan Simpson 主持\n\n你能自动且准确地决定是否支付发票吗？如何在 99.5% 的置信水平下实现决策自动化。\n\
    \n[New Approach Technologies](http://newapproachtechnologies.com/) 是我的自由职业公司。我提供咨询、构建快速原型并部署生产系统。咨询通常是探索性的，由客户的问题驱动，例如关于数据科学对其公司的可行性和价值。原型是人们以低风险方式了解其数据可能性的一种方式。\n\
    \n“多年来，我构建了许多生产系统，尤其是在银行业。机器学习的部署现在已成为该领域的常态，部分原因是可用数据丰富。” Nick Hoff，机器学习专家\n\n\
    我将向你展示 Société Générale 提出给我的发票分类问题。我们将调查我考虑使用的一些机器学习技术，为什么它们有效，以及它们何时无效。最后，我将讨论投入生产的解决方案，并阐述关于将机器学习投入生产的一些更有趣的点。\n\
    \n### 分类发票以自动化支付\n\nSociété Générale 的一个分支机构运营着企业汽车租赁业务。由于汽车是租赁的，Société Générale\
    \ 负责维护。每当一辆汽车去维修店时，维护或修理会产生一张发票。发票发送到 Société Générale，由专家决定是否支付。该项目的目标是部分自动化该决策。\n\
    \n"
