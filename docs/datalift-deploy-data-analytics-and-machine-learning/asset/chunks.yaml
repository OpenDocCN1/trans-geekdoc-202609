    \ according to their needs through different types of deployment and modularity\
    \ options and we are keen that they can use it on their own.”   \n\n“How long\
    \ does it take after submitting the data for the model to be deployed?” “Depending\
    \ on the industry and enterprise this may vary but on average it takes 3-4 days.”\
    \   \n\nRequest Beta access to TUBA at [https://tuba.ai/](https://tuba.ai/)   \
    \ \n\nApplications of research define a new industry. Automating urban aviation\
    \ at Uber’s Advanced Technology Center in Paris Dr. François Sillion, Director,\
    \ Uber ATCP Interviewed by Dr. Chris Armbruster, AI Guild   "
