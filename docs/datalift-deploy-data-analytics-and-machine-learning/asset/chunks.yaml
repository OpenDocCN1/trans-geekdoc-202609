    \ inspection process, make it real-time, and standardize reporting. By adding\
    \ deep learning, we make the quality inspection process flexible for different\
    \ products in the same industry, improving the bottom line. The TUBA AI machine\
    \ vision toolkit is deployable off-the-shelf.   \n\n[DevisionX](https://devisionx.com/)\
    \ builds quality inspection systems using a mix of machine vision and artificial\
    \ intelligence. We have developed an off-the-shelf AutoML tool that can be deployed\
    \ on the cloud or on-premise. It provides an end-to-end solution for two- and\
    \ three-dimensional quality inspection in manufacturing by processing data such\
    \ as digital images and video generated by cameras to identify objects. We offer\
    \ more robust recognition rates, greater productivity, more reliable identification,\
    \ allocation, and handling of a wider range of objects throughout the entire value\
    \ chain. Adding artificial intelligence to machine vision Machine vision typically\
    \ provides image-based automatic inspection, sorting, and robot guidance. In manufacturing,\
    \ such a system usually is based on an operator station, camera units, lighting,\
    \ and a labeling device. Machine vision is about extracting information from images\
    \ for automated action.   \n\nMachine vision is superior to manual inspection\
    \ and typically also cheaper. It addresses the perennial issue of scrap and waste\
