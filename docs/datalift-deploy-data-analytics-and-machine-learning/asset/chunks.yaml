  trans: '


    “机器学习的应用是未来保持竞争力的核心能力。目前，其应用与对商业成功的影响之间存在过度简化的现象。产品列表排序算法的示例展示了在迈向人工智能驱动型公司的道路上，成功引入机器学习所需采取的措施。”


    Sebastian Rose，高级数据科学家


    “在这个用例中，Sebastian 不仅根据机器学习算法的实现难度及其优缺点向我们介绍了不同的算法，还详细介绍了这些算法的数学方面。我欣赏他对与利益相关方协作的强调。”
    Elif Schaefer，商业智能部门负责人


    ## 自适应排序策略的技术实现


    自适应产品列表排序的建模难度和系统复杂度高于基于规则的排序，但低于预测性排序。自适应模型赢得了业务利益相关方的信任和接受，因为它可以轻松向他们解释。


    技术实现需要一个数据库和一个服务器。对于该解决方案，需要跟踪网页、销售和产品数据。这些数据被传输到一个开源企业搜索平台，该平台是驱动产品服务的引擎。


    ![The myToys technological stack for the Product List Sorting](img/Image00005.jpg)


    总而言之，MYTOYS 集团将产品概览页面的逻辑从基于规则的算法切换到了自适应算法。也许最重要的成功衡量标准是跳出率下降了百分之十二，这意味着客户更喜欢新的排序方式，这最终也体现在转化率显著提升了百分之七，以及每位访客的收入提升了百分之六点五。客户更有可能被我们的产品展示所“吸引”，从而决定在
    mytoys.de 购买产品。


    来自问答环节：“自适应排序如何与按受欢迎程度排序相连接？”“它是一种按受欢迎程度排序的算法。”


    “你们的数据仓库技术栈有多丰富？”“我们正在构建数据保险库模型，并转向数据湖场景，以确保持续的实时部署场景。”


    “自适应排序算法的特征选择过程是什么？”“我们早期就确定了主要特征，并部署了一个过拟合程度很小的 `XGBoost` 算法。特征包括可用性等业务方面，以及产品的季节性。”


    查看空缺职位请访问 [`https://mytoysgroup.jobs/`](https://mytoysgroup.jobs/)


