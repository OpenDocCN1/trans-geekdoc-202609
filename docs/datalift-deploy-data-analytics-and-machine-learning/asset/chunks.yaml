- raw: "Automated credit risk assessment How Klarna scales online shopping transactions\
    \ Vaibhav Singh, Senior Data Science Manager, Klarna Moderated by Corrie Bartelheimer\
    \ F or a leading online payment solutions provider, automated decision-making\
    \ needs to be fast and accurate. Klarna uses Machine Learning models to provide\
    \ a one-click solution at the point of sale that effectively takes the risk away\
    \ from both the seller and the buyer.   \n\n[Klarna](https://www.klarna.com/)\
    \ is a payments solution provider processing >1m online payments daily for 200k+\
    \ merchants. On peak days, up to 2m shopping transactions are processed with three\
    \ principal payment options: Pay now or later (e.g., after delivery) or slice\
    \ it. Consumers have a risk-free purchase because of the Klarna buyer protection\
    \ policy. Merchants have a risk-free sale because Klarna takes on the fraud and\
    \ credit risk. Klarna is now the most highly valued fintech in Europe at >$10bn.\
    \ Credit risk and fraud risk assessment at Klarna Klarna facilitates a one-click\
    \ checkout and payment process and takes on the credit risk. The risk is the probability\
    \ of default weighted by exposure (size of the transaction plus any interest)\
    \ by the likelihood of payment or recovery versus default. We analyze each determinant\
    \ to minimize the aggregate risk.   \n\nThe supervised modeling of credit risk\
    \ has challenges. Most important is getting the targets  right. Loans mature,\
    \ so we need at least six months of data. Moreover, the prediction must be specific\
    \ for each credit product and each customer over the loan’s lifecycle, including\
    \ a customer switching between products. Next, information from credit scoring\
    \ partners is not normalized. For fraud risk, Klarna distinguishes between 1st\
    \ party (misrepresentation or false information by the buyer), 2nd party (money\
    \ mules knowingly participating), and 3rd party (stolen identity) fraud. Architecture\
    \ for automated decisions in real-time  The key elements are the data pipelines,\
    \ which may be done on one or several machines with various tools. Data Scientists\
    \ at Klarna have the freedom to choose a preferred setup. A typical flow might\
    \ look as follows: You extract the data sets, create features on top of it, split\
    \ the data for training, look at your models’ performance, validate, and recalibrate\
    \ a model if needed. Once models are deployed, we track for model drift. Whenever\
    \ that happens, we adjust.   \n\n“For monitoring model drift, we must figure out\
    \ which metrics to have in place, e.g., mean model scores so that the alarm sounds\
    \ at the right time.” Vaibhav Singh, Senior Data Science Manager  \n\n“It is most\
    \ interesting how Klarna deploys machine learning in such a highly regulated area\
    \ and the challenges that come with that. For certain applications, Klarna's models\
    \ are audited every six months. To me, their success shows that machine learning\
    \ still adds substantial value, even when used in such highly regulated areas.”\
    \ Corrie Bartelheimer, Data Scientist   \n\nData is derived from many sources,\
    \ and hence quality and completeness are an ongoing challenge. Solving this challenge\
    \ is vital for feature engineering, especially for determining how many features\
    \ a model will have. Often, modeling is about adding or subtracting features and\
    \ hyperparameter optimization to improve accuracy. For exploration  and modeling,\
    \ Klarna uses AWS Sagemaker, but for the actual hosting, we have a proprietary\
    \ platform. Some of the features we are looking for in the credit risk assessment\
    \ include the following: \n\n*   Transactional (e.g., shopping cart, shipping), \n\
    \n*   Customer-based (e.g., frequency of purchases or payments), \n\n*   Merchant-based\
    \ (e.g., default rates), and\n\n*   Graph-based (e.g., links among transactions\
    \ or customers). \n\n![Model Generation Architecture at Klarna](Image00007.jpg)From\
    \ the Q&A “Regarding deployment: Klarna re-trains models, and once you have done\
    \ that, do you deploy automatically?” “Before deployment, we review reports, so\
    \ the decision to deploy is made by a member of staff after due diligence.” “Does\
    \ Klarna explore alternatives to customary credit scoring?” “Yes, we seek to utilize\
    \ information from the transactions as well as the wider online world for added\
    \ fairness and security.” For open positions see [www.klarna.com/careers](https://www.klarna.com/careers/)\
    \ \n\nImage metadata extraction at scale How OLX productionizes Deep Learning\
    \ models for its online classifieds’ platform Alexey Grigorev, Lead Data Scientist,\
    \ OLX Moderated by Henrieke Max O LX applies deep learning models to 10 million\
    \ images per day (i.e.,>100 per second) for content moderation and determining\
    \ the quality of images.   \n\n[OLX Group](https://www.olx.com/) is a network\
    \ of trading platforms, operating in 30+ countries under 20+ brands, including\
    \ Avito, OLX, Otomoto, Property24, and many more. Three hundred million monthly\
    \ active users find their home, buy or sell a car, find a job, sell things they\
    \ no longer need or strike a deal on something they need. Images sell products\
    \ Online images sell the product, not just daily consumer products but also commercial\
    \ goods, real estate, and high-value items. Some critical challenges for OLX are\
    \ to build an image classifier, assess image quality, detect policy violations,\
    \ and prevent the listing of illegal items. The image classifier has as many categories\
    \ as there are products and helps determine if the listing and the image are congruent.\
    \ The classifier also prevents illegal sales. Assessing image quality (good versus\
    \ bad) is a service to sellers because the image’s quality drives buyer interest.\
    \ Checking the image content protects buyers because we can determine if illicit\
    \ information or content is included in the picture. Scaling image classification\
    \ OLX productionizes several models for a vast number of images by extracting\
    \ and storing metadata. This metadata service looks as follows. We utilize a model\
    \ wrapper that gets the images from a database for all the necessary preprocessing,\
    \ like resizing and normalizing the images. Then we run Deep Learning models on\
    \ the metadata to make predictions about, for example, categories or quality.\
    \ Typically, the metadata service is used by internal clients requiring predictions\
    \ like the moderation or the marketing team.    \n\n“Our clients don’t care about\
    \ the finer details of serving models; they give us the image and get back the\
    \ predictions.” Alexey Grigorev, Lead Data Scientist  \n\n\"Imagine having to\
    \ monitor 10 million images for quality and appropriateness — every day. How many\
    \ content moderators would it take? As an online marketplace, OLX uses deep learning\
    \ to automate the quality assurance and compliance of images for goods and services,\
    \ scaling its solution to accommodate large amounts of visual data and shrinking\
    \ costs by optimizing the production infrastructure.\" Henrieke Max, Data Analyst\
    \  "
