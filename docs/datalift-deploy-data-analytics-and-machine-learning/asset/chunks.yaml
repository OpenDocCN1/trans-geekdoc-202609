- raw: "Personalized digital healthcare How xbird supports people living with diabetes\
    \ Dr. Evdokia Kazimirova Machine Learning researcher, xbird Moderated by Marija\
    \ Vlajic Wheeler F or delivering personalized healthcare, we merge medical and\
    \ lifestyle data to empower doctors to adapt treatment and patients to adjust\
    \ their activity. Xbird is deploying a variety of Machine Learning models for\
    \ tracking and processing daily activities and their correlations and causation.\
    \   \n\n[xbird's](https://xbird.io/) mission is to help people with diabetes with\
    \ their therapy problems. The algorithms developed by xbird can record the behavior\
    \ and lifestyle of patients using smartphones and other wearables. In this way,\
    \ health risks can be identified and mitigated as part of holistic care, and we\
    \ optimize long-term treatment. xbird provides an SDK service to pharma companies\
    \ to achieve higher patient engagement and improve patient outcomes. Personalized\
    \ healthcare for diabetes patients  Diabetes is a chronic disease when the body\
    \ is not able to produce insulin or to use it effectively, which might result\
    \ in serious side effects and requires close attention towards lifestyle.   \n\
    \nFor personalized treatment, the individual lifestyle is a crucial factor. Patients\
    \ need support based not only on their medical data like blood glucose level,\
    \ insulin intake, etc. but also in tracking daily activities and evaluating their\
    \ impact. We merge these types of data. Different  people require different help,\
    \ e.g., the prevention of blood sugar level incidents and the mitigation of effects\
    \ on other body organs. Labeling location and activity data  Typically, patients\
    \ have problems manually keep track of their daily activities. Consequently, data\
    \ often is incomplete and lacks context. Only 3-5% of the users enter enough contextual\
    \ data for their activities. For automating this process, xbird utilizes location\
    \ and sensor (namely accelerometer) data.  By combining these sources of information,\
    \ it’s possible to infer different types of physical activity (e.g., cycling or\
    \ running) and more complex patterns (waking up, working hours, etc.).  In several\
    \ preprocessing steps, we aggregate samples into regular periodic data. If location\
    \ data is present, we use it to identify speed, which will be passed into a classification\
    \ pipeline together with activity data. The classifier pipeline Some general observations\
    \ xbird relied on during pipeline choice: \n\n*   It is necessary to move beyond\
    \ tracking small disjointed events to distinguish meaningful solid situations;\n\
    \n*   Different activities require different contexts. Transport usage needs to\
    \ be defined for a more extended period to cover potential interruptions like\
    \ traffic lights or stops.\n\n*   Across users, data variety is significant for\
    \ uncontrollable reasons, e.g.accelerometer data might differ depending on hardware\
    \ or software;\n\n*   The same activity, e.g., cycling, may be performed in very\
    \ different ways depending on the user's physical condition.\n\nA pipeline with\
    \ a separate binary classifier for each activity type solves most of these problems,\
    \ e.g., allows independently choosing window length (context period). But in some\
    \ cases, multiclass classifiers might be more accurate. For personalization, i.e.,\
    \ the tuning of models for each user, xbird depends on minimizing recognition\
    \ errors based on feedback loops with users, confirming or disconfirming the classification.\
    \ We combine all these approaches for the current production set of xbird technology.\
    \   \n\n“Inspiring for us at xbird is that doctors report that they can adjust\
    \ medical therapies individually based on the activity data models we provide.”\
    \ Eva Kazimirova, ML researcher  \n\nFrom the Q&A “Beyond activity detection,\
    \ what is the xbird value proposal?” “An aggregated system of medical and lifestyle\
    \ data to optimize the prevention of health risks and personalize treatment.”\
    \ For open positions see [https://xbird.recruitee.com/](https://xbird.recruitee.com/)\
    \   \n\nZero Hunger by 2030! How anthropometric measurement makes our dream a\
    \ reality Markus Hinsche, Senior ML Engineer, Freelance (for Welthungerhilfe)\
    \ Moderated by Johanna Viktor A no-touch solution to detecting malnutrition in\
    \ children by using commodity smartphone sensors and machine learning. How the\
    \ Welthungerhilfe e.V. (World Hunger Aid) pushes for Zero Hunger by 2030.   \n\
    \nHunger and malnutrition are not a lack of food only, it is a more complex health\
    \ issue. Child malnutrition is a global problem. Parents and frontline workers\
    \ often don't know that the child is malnourished and take measures too late.\
    \ The magnitude of the nutrition crisis – both in emergencies and chronic hunger\
    \ situations – is blurred frequently. Current standardized measurements done by\
    \ aid organizations and frontline healthcare workers are time-consuming and expensive.\
    \ Children are moving, and accurate measurement, especially of body height, is\
    \ often difficult. With the COVID-19 pandemic, the situation became more challenging.\
    \ All manual measurement of children is suspended because of social distancing.\
    \ Accurate data on the nutritional status of children is unreliable or non-existent.\
    \ This hampers a determined response by emergency workers and policymakers.  \
    \ \n\nAnthropometric measurement by a smartphone app provides the game-changer\
    \ for the data collection and processing in the case of malnourished children\
    \ under the age of 5 years. The solution is based on a mobile app using augmented\
    \ reality in combination with artificial intelligence. By determining weight and\
    \ height through a 3D scan of children, the app provides a quick and touchless\
    \ way to measure children and detect early warning signs of malnutrition.   \n\
    \nThe Welthungerhilfe receives support from leading IT partners for the research\
    \ and  development of the measurement prediction. This project is open-source\
    \ code and the full documentation can be accessed via [GitHub.](https://github.com/Welthungerhilfe/ChildGrowthMonitor)\
    \ Measuring child malnutrition Around 800 million people suffer from chronic hunger,\
    \ of which 200 million are children. More than 3 million child deaths are attributable\
    \ to malnutrition. Death from malnutrition is preventable. Prevention requires\
    \ detecting malnutrition early. However, current measurements are neither complete\
    \ nor reliable.   \n\nMid-Upper Arm Circumference (MUAC) Measuring Tapes measure\
    \ the upper arm circumference of children, helping to identify malnutrition. Additional\
    \ required measurements are done by a wooden board (body height) and by scales\
    \ (body weight). All devices are labor-intensive, often requiring two or more\
    \ staff members. Also, they require physical contact and are known to be prone\
    \ to errors leading to invalid measurements.   \n\nThe Welthungerhilfe is introducing\
    \ new technology for the detection of malnutrition: A body scan is taken with\
    \ a smartphone that has a depth sensor. The scan is done in the following steps:\
    \ \\- Signed consent form \\- Video scan with a smartphone to a point cloud (3D\
    \ space) \\- Training of a machine learning model for a prediction that can be\
    \ used in a diagnosis   \n\nUsing a smartphone app is sufficient as the video\
    \ not only has RGB detection but also a depth sensor enabling the transformation\
    \ of the data to a point cloud. Diagnosing malnutrition For diagnosing malnutrition\
    \ the Welthungerhilfe is interested mainly in the weight, height, and middle-upper\
    \ arm circumference. According to the World Health Organization, the combination\
    \ of these three measurements enables the diagnosis of malnutrition.   "
