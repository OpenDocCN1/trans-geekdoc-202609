- raw: "As a special guest for the first event, we invited Dr. Peter Heise, the Data\
    \ Science and AI community leader at Airbus, to demonstrate how a company can\
    \ upskill employees at scale for a data career. At the second event, we had the\
    \ pleasure to interview Dr. François Sillion, the director of Uber ATCP, and former\
    \ INRIA CEO, who spoke to us about how research development is creating new solutions\
    \ for the scientific and technological challenges in air transportation. Summary\
    \ of the use case discussion Irina Vidal Migallón is one of Europe’s leading Computer\
    \ Vision practitioners. She compares the use cases of railway maintenance and\
    \ autonomous vehicles, which seem similar from a technical point of view but have\
    \ very different deployment requirements. Irina shows us how machine learning\
    \ techniques are embedded in the use case and that the product components from\
    \ the sensors to legal regulations have a profound impact. ◆◆◆ Dr. Nicholas Hoff\
    \ is a leading expert for Machine Learning production systems. Looking at classifying\
    \ invoices to automate payment decisions, he discusses a typical testing stream\
    \ for arriving at a machine learning solution. Nick shows us how the business\
    \ case and customer preferences drive the deployment. ◆◆◆ Dr. Aleksandra Kovachev\
    \ is a senior expert for recommender systems. With her colleague Varun Chitale,\
    \ she discusses the deployment of memory- and model-based recommender systems\
    \ for a marketplace with millions of daily transactions. Aleksandra shows us that\
    \ recommender systems are most successful if adapted locally and regionally. ◆◆◆\
    \ Dr. Sebastian Rose is a senior data scientist with deep expertise in e-commerce.\
    \ Looking at the challenge of in which order to present thousands of products\
    \ in such a platform, he discusses the implementation of three different sorting\
    \ strategies. Sebastian shows us that following the principle “start simple, grow\
    \ complex” results in a better customer experience while gaining the trust of\
    \ business stakeholders. ◆◆◆ Dr. Eva Kazimirova is a Machine Learning researcher\
    \ with deep domain expertise in physiology. She discusses health treatment’s personalization\
    \ for a chronic disease like diabetes by integrating medical and lifestyle data.\
    \ Eva shows us that doctors are starting to adjust medical therapies for each\
    \ patient with data models. ◆◆◆ Markus Hinsche is a Senior Machine Learning Engineer.\
    \ He discusses a solution to detect malnutrition in children by using smartphone\
    \ sensors and augmented reality in combination with artificial intelligence. Markus\
    \ shows us that it is possible to measure children in a quick, touchless way.\
    \ ◆◆◆ Mahmoud AbdelAziz is a senior expert for machine vision in manufacturing.\
    \ He discusses the evolution of quality inspection processes, that are not only\
    \ being automated but also leveraging AI. Mahmoud shows us how to enable manufacturing\
    \ experts to solve their daily challenges using AI & Machine Learning without\
    \ experience & without coding. ◆◆◆ Vaibhav Singh is a senior technical manager\
    \ with deep expertise in the financial industry and e-commerce. He discusses the\
    \ architecture for fast and automated credit risk assessment and  fraud detection.\
    \ Vaibhav shows us the meaning of continuous deployment for scaling automated\
    \ decision-making to millions of daily transactions. ◆◆◆ Alexey Grigorev is a\
    \ Lead Data Scientist for online marketplaces and classified advertisements. He\
    \ discusses the application of deep learning models for determining image quality\
    \ and image content moderation. Alexey shows us that you can scale this kind of\
    \ service to 10 million images per day while controlling and reducing costs. ◆◆◆\
    \ Rachel Berryman is a data scientist with deep domain expertise in the energy\
    \ sector. She discusses the application of neural networks for grid loss prediction,\
    \ which is becoming more relevant with the energy transition to renewables. Rachel\
    \ shows us how having a centralized data platform and an agile deployment platform\
    \ impacts the speed and success of an AI solution.   \n\nInvitation to #datalift\
    \ in 2021 On a Friday. 60-90 minutes. 500 seats. Join the experts online in discussing\
    \ the deployment of data analytics and machine learning.   \n\nNo 3 on Friday,\
    \ 29 January at 11.00 CET No 4 on Friday 26 March at 11.00 CET No 5 on Friday,\
    \ 28 May at 11.00 CEST   \n\nRegister for a free ticket via our website [www.thedatalift.eu](http://www.thedatalift.eu/)\
    \ \n\nRailway maintenance and autonomous vehicles more similar and more different\
    \ than you’d think Irina Vidal Migallón, Technical Lead AI & Computer Vision,\
    \ Siemens Mobility Moderated by Sven Krüger M onitoring the state of rail tracks\
    \ and autonomous driving have many tasks in common: detect obstacles, detect people,\
    \ detect assets, detect damages. As pre-production work, it may seem a no-brainer\
    \ to approach them in similar ways. The devil is in the details, though, which\
    \ happens to be 90% of the product. Sensors, deployment platform, processing hardware,\
    \ feedback loop, laws: they have a more significant impact than the machine learning\
    \ technique itself.   \n\n[Siemens Mobility](https://www.mobility.siemens.com/global/en.html)\
    \ has a division focusing on computer vision and machine learning for different\
    \ products around mobility, especially also in the railway domain. Products range\
    \ from passenger assistance to autonomous driving. For example, we increase comfort\
    \ for travelers by finding spots for a wheelchair or detecting aggression to improve\
    \ safety. For driving, our approach includes handling typical issues like obstacle\
    \ detection and track segmentation. The difference deployment makes We often see\
    \ issues around computer vision and machine learning that look similar, actually,\
    \ deceivingly similar. I say ‘deceivingly’ because even though the challenges\
    \ may point to the same machine learning solution, the solution is part of differing\
    \ products, and we deploy each differently. Deployment is more than a click. You\
    \ iterate to find the best solution for your customers and users and, for example,\
    \ with your DevOps to check for feasibility.   At Siemens Mobility, we are working\
    \ on different use cases for a variety of users. Consider the usual machine learning\
    \ cycle from data processing on to training and then, finally, to deployment.\
    \ That final step, the deployment, makes the difference. It makes every use case\
    \ different.   "
  fmt: "\n# 邀请嘉宾与活动概述\n\n作为首场活动的特邀嘉宾，我们邀请到了空中客车（Airbus）的数据科学与 AI 社区负责人 Dr. Peter Heise，演示一家公司如何大规模提升员工的数据职业技能。在第二场活动中，我们有幸采访了\
    \ Uber ATCP 主管、前 INRIA 首席执行官 Dr. François Sillion，他与我们探讨了研发如何为航空运输领域的科学与技术挑战创造新解决方案。\n\
    \n## 用例讨论摘要\n\nIrina Vidal Migallón 是欧洲领先的计算机视觉实践者之一。她对比了铁路维护与自动驾驶汽车的用例，这两者从技术角度看似相似，但部署要求截然不同。Irina\
    \ 展示了机器学习技术如何嵌入用例，以及从传感器到法律法规的产品组件如何产生深远影响。\n\n◆◆◆ Dr. Nicholas Hoff 是机器学习生产系统领域的领先专家。他以发票分类以自动化支付决策为例，讨论了得出机器学习解决方案的典型测试流程。Nick\
    \ 展示了商业案例和客户偏好如何驱动部署。\n\n◆◆◆ Dr. Aleksandra Kovachev 是推荐系统领域的资深专家。她与同事 Varun Chitale\
    \ 讨论了针对拥有数百万日交易的市场部署基于内存和基于模型的推荐系统。Aleksandra 展示了推荐系统只有在本地和区域层面进行调整时才最成功。\n\n\
    ◆◆◆ Dr. Sebastian Rose 是一位拥有深厚电子商务专业知识的高级数据科学家。他探讨了在平台上以何种顺序展示数千种产品的挑战，并讨论了三种不同排序策略的实现。Sebastian\
    \ 展示了遵循“从简单开始，逐步复杂”的原则，既能带来更好的客户体验，又能赢得业务利益相关者的信任。\n\n◆◆◆ Dr. Eva Kazimirova 是一位在生理学领域拥有深厚领域专业知识的机器学习研究员。她通过整合医疗和生活方式数据，讨论了糖尿病等慢性疾病的健康治疗个性化。Eva\
    \ 展示了医生正在开始为每位患者使用数据模型调整医疗疗法。\n\n◆◆◆ Markus Hinsche 是一名高级机器学习工程师。他讨论了一种利用智能手机传感器和增强现实相结合的人工智能技术，来检测儿童营养不良的解决方案。Markus\
    \ 展示了可以以快速、非接触的方式测量儿童。\n\n◆◆◆ Mahmoud AbdelAziz 是制造业机器视觉领域的资深专家。他讨论了质量检验流程的演变，这些流程不仅正在实现自动化，还在利用\
    \ AI。Mahmoud 展示了如何让制造专家在无需经验和无需编码的情况下，使用 AI 和机器学习解决日常挑战。\n\n◆◆◆ Vaibhav Singh\
    \ 是一位在金融行业和电子商务领域拥有深厚专业知识的高级技术经理。他讨论了快速自动化信用风险评估和欺诈检测的架构。Vaibhav 展示了持续部署在将自动化决策扩展到数百万日交易中的意义。\n\
    \n◆◆◆ Alexey Grigorev 是面向在线市场和分类广告的首席数据科学家。他讨论了应用深度学习模型来确定图像质量和图像内容审核。Alexey 展示了可以将此类服务扩展到每天\
    \ 1000 万张图像，同时控制和降低成本。\n\n◆◆◆ Rachel Berryman 是一位在能源领域拥有深厚领域专业知识的数据科学家。她讨论了应用神经网络进行电网损耗预测，这在向可再生能源转型的能源转型中变得越来越重要。Rachel\
    \ 展示了拥有集中式数据平台和敏捷部署平台如何影响 AI 解决方案的速度和成功率。\n\n# 受邀参加 #datalift 2021\n\n周五举办，时长\
    \ 60-90 分钟，提供 500 个座位。与专家在线讨论数据分析和机器学习的部署。\n\n- No 3：1 月 29 日（周五）11:00 CET\n-\
    \ No 4：3 月 26 日（周五）11:00 CET\n- No 5：5 月 28 日（周五）11:00 CEST\n\n通过我们的网站 [www.thedatalift.eu](http://www.thedatalift.eu/)\
    \ 注册免费门票。\n\n# 铁路维护与自动驾驶汽车：看似相似，实则不同\n\n**Irina Vidal Migallón**，Siemens Mobility\
    \ 技术负责人 AI & 计算机视觉  \n主持人：Sven Krüger\n\n监控铁路轨道状态和自动驾驶有许多共同任务：检测障碍物、检测人员、检测资产、检测损坏。作为前期工作，以类似方式处理它们似乎是理所当然的。然而，魔鬼在于细节，而细节恰好占据了产品的\
    \ 90%。传感器、部署平台、处理硬件、反馈循环、法律法规：它们的影响比机器学习技术本身更为显著。\n\n[Siemens Mobility](https://www.mobility.siemens.com/global/en.html)\
    \ 有一个专注于计算机视觉和机器学习的部门，服务于不同的移动产品，尤其是铁路领域。产品范围从乘客协助到自动驾驶。例如，我们通过寻找轮椅位置或检测攻击行为来提高旅客的舒适度和安全性。对于驾驶，我们的方法包括处理障碍物检测和轨道分割等典型问题。\n\
    \n## 部署带来的差异\n\n我们经常看到计算机视觉和机器学习方面的问题看起来相似，实际上具有欺骗性的相似性。我说“欺骗性”是因为，尽管挑战可能指向相同的机器学习解决方案，但该解决方案是不同产品的一部分，并且我们以不同方式部署它们。部署不仅仅是点击一下。你需要迭代以找到最适合客户和用户的解决方案，并例如与\
    \ DevOps 团队一起检查可行性。\n\n在 Siemens Mobility，我们正在为各种用户开展不同的用例。考虑通常的机器学习周期，从数据处理到训练，最后到部署。那个最后一步，即部署，带来了差异。它使每个用例都与众不同。\n"
