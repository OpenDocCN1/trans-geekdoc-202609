    \ laboris. \n\nIntroducing #datalift L eaders need to grasp the urgency of productionizing\
    \ data analytics and machine learning. Why? Because the coolest technology is\
    \ useless if not deployed for a business case. Every crisis is an opportunity\
    \ The COVID-19 pandemic is a challenging moment. It impacts our health, economy,\
    \ and livelihood, and it is spurring the creation of digital data. Business and\
    \ government should seize the one great opportunity we have: Scale the data economy.\
    \ Feedforward Europe Europe has a critical mass of experts in industry and startups\
    \ across the main sectors of the economy. Moreover, one million data-literate\
    \ talents will graduate by the end of 2023.  So, let's break the proof-of-concept\
    \ cycle and productionize data analytics and machine learning.  With #datalift,\
    \ we show you how business and government can scale the data economy now. What\
    \ business needs From 1000+ conversations with the 500+ AI Guild practitioners\
    \ at 50+ events, we know that business requires \n\n*   More and better expertise\
    \ for deploying use cases successfully;\n\n*   A structure for management, experts,\
    \ and talents to ship the product; and\n\n*   The will and resources to win big\
    \ in the data economy.\n\nIf Europe doesn’t improve now, this likely leads to\
    \ sad stories like: “Lots of data, never really utilized. The company is out of\
    \ business.” Data careers and use cases The AI Guild has been building up capacity\
    \ for addressing the main challenges of AI adoption  in Europe. \n\n1.  We are\
    \ ramping up the expertise of practitioners for successfully deploying data analytics\
    \ and machine learning.\n\n2.  We are competent for onboarding data talents at\
    \ scale and developing teams for companies that deliver on data infrastructure\
    \ and the use case architecture. \n\n3.  Facilitating communication between business,\
    \ politics, and technology to advance AI adoption, and you are reading an example\
    \ just now.\n\nFor business Expertise and experience are crucial for implementing\
    \ your company's use cases. If you collaborate with the AI Guild, you raise a\
    \ new generation of experts as fast as possible. \n\n*   Your simple use cases\
    \ are solved immediately. \n\n*   You create a virtuous circle of deployment and\
    \ learning over 1-2 years.\n\n*   You scale in-house expertise for deployment\
    \ across the entire enterprise.\n\nFor government Return to growth by kick-starting\
    \ the data economy with 1% of the stimulus package in Europe. If you collaborate\
    \ with the AI Guild, we can flip the best data talents to deployable practitioners.\
    \ We have done the sums and expect up to 1 million data-literate graduates by\
    \ 2022: highly numerate, experienced in handling data, and coding in Python, R,\
    \ and SQL. Imagine what your city, your country, and Europe could achieve with\
    \ so much fresh talent. Europe has 1.2m STEM graduates per year, 30% master's\
    \ degree, and 4% doctorate. The baseline is 400,000 highly data literate graduates\
    \ each year. Dânia Meira & Chris Armbruster \n\nInsights from #datalift No 1 &\
    \ No 2 T o show every practitioner, business, and government that Europe indeed\
    \ has the know-how and the means to scale the data economy, we are conducting\
    \ the #datalift event series. We held the first and second events on 25 September\
    \ 2020 and 27 November 2020, organized and hosted by AI Guild members. Also, all\
    \ the speakers presenting and discussing use cases are members of the AI Guild.\
    \   "
