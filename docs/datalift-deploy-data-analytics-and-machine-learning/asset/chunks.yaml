    This type of filtering works particularly well for repeat customers, whereas for
    new customers, one might start by, e.g., showing the most popular items. We also
    need to protect the algorithm. For example, so-called shilling attacks might occur
    where vendors or product owners seek to influence recommendations and ranking
    (e.g., fake reviews). “Building a model often is specific for a particular country
    or region, and depends, for example, on population density and typical behavioral
    patterns.”


    Dr. Aleksandra Kovachev, Senior Data Scientist


    “Delivery Hero business success is based on AI models specifically designed for
    particular countries and regions, giving the company a great potential for expansion
    to new markets.” Macarena Beigier, Data Scientist


    ## Types of recommendations


    Delivery Hero distinguishes between vendor- and product-level recommendations.
    We have different categories, like restaurants, supermarkets, or pharmacies, which
    define the marketplace. Typical offers then include past orders, the most popular
    items, similar items, or personalized recommendations.


    ## Data sources and the pipeline


    Delivery Hero uses a DataFridge for collecting, unifying, and standardizing all
    data, whether explicit data (e.g., vendors, products, orders, reviews) or tracking
    data (e.g., clicks, interactions). From analyzing this data, we extract the meaningful
    features for the recommender system.


    From the Q&A “Do you use any attention-based recommendation models?” “No, mainly
    because for recommending restaurants or shops, it isn’t pertinent.”


    “How do you handle overfitting for personalized recommendations?” “We encounter
    overfitting when we use classical ML methods. We have looked at oversampling and
    undersampling and typically find that using class weights works well.”


    For open positions at Delivery Hero, see [careers.deliveryhero.com/global/en](https://careers.deliveryhero.com/global/en)


    ## The product list sorting algorithm


    How MYTOYS uses machine learning for customer conversion Dr. Sebastian Rose, Senior
    Data Scientist, MYTOYS GROUP Moderated by Elif Shaefer Deploying an adaptive product
    list sorting algorithm instead of a rule-based algorithm has enabled MYTOYS to
    increase the conversion rate by 7%, and revenue per visitor by 6,5%. The bounce
    rate decreased by -12%.


    [MYTOYS](https://www.mytoys.de) is the biggest online retailer platform for young
    families in Europe with more than €720 million ARR, 7 million customers, 21 million
    visits, and 250k products online. Seventy percent of the traffic is mobile. It
    delivers more than 13 million packages per year to its customers.


    ## Product list sorting for the customer journey


    A critical challenge for scaling an e-commerce platform is how and in which order
    to present its products. Online shoppers encounter this situation frequently:
    for example by browsing the product overview pages, with products of a category
    or a selection of products from different categories.


    For this purpose, several sorting strategies can be implemented which vary with
    regard to the involvement of human experts, and the complexity of the system and
    algorithms (rule-based, adaptive, and prognostic). The more sophisticated the
    algorithm of choice at the beginning, the higher the challenges of technical integration
    and organizational acceptance. Following the principle “start simple, grow complex”
    these challenges can be balanced and the change into an AI-based company can be
    triggered.


    More systematically, product list sorting in the customer journey has the following
    dimensions:

    - Inspiration. A listing based on popularity to create the purchase intention.

    - Orientation. Recommendations based on the similarity of users or products to
    stimulate the purchase intention.

    - Relevance. A listing based on the relevance relative to the search intention
    to conclude the purchase intention.


    In this talk we focus on sorting strategies for customer inspiration (product
    overview pages).


    The simplest sorting strategy is random. It works well when you are starting an
    e-commerce and have your first limited set of products on display. If business
    picks up and you have more than 250,000 products like MYTOYS, you will be looking
    at the following strategies:

    1. Rule-based sorting. The definition of rules by human experts.

    2. Adaptive sorting. A defined target variable is used to adapt the product sorting.

    3. Prognostic sorting. The prediction of the sorting based on product data patterns.


    ### Rule-based sorting


    Rule-based product sorting is simple. You implement an algorithm based on selected
    variables, e.g. Revenue in the last 30 days or current Reach/Availability of the
    product. You can formalize this in the following way: “Weight * Revenue (30 days)
    + Weight * Trend (7 days) + Weight * Reach (current) + …. = Product List Score”


    Thereby you decide which weight to attach to the different variables, so you could
    optimize your sorting for example for a clear-out sale by lowering the weight
    for reach/availability, so those remaining shelf items are displayed first. If
    you want to optimize for revenue, you increase the weight for revenue. Your decisions
    will be derived from your business requirements, and you can change the product
    list sorting manually.


    The issue with rule-based sorting is that the reasoning is circular: the product
    list score influences the performance indicators by which it is calculated. Moreover,
    the rules may not reflect your customers’ needs but your business’ only. Yet,
    interfering with complex systems by manually changing weights likely introduces
    human error, meaning that you may not reach your corporate goal.


    ### Adaptive sorting


    Adaptive sorting introduces statistics and the calculation of probabilities. More
    precisely, the ranking is the result of the expected probability of a product,
    which is seen on the overview page, will also be purchased. More formalized this
    approach creates a ranking as the result from the probability that a customer
    purchases the product under the current sorting list. This probability is optimized
    in this process. Hence, customer demand and feedback is automatically integrated
    into the formula driving adaptive sorting.


    With adaptive sorting, your platform responds easily to changes in demand, and
    even to spikes. An example in Germany is the yearly announcement of the ‘Game
    of the Year’ (Spiel des Jahres) in various categories. The adaptive algorithm
    will pick up the surge in demand automatically and respond accordingly. Thereby,
    real-time quality data is key. With up-to-date and accurate data this system responds
    to changing demand, for example, in the run-up to Christmas automatically.


    A limitation of adaptive sorting is that it provides only a snapshot based on
    a limited set of variables. Also, your data pipeline needs to be highly reliable.


    ### Prognostic sorting


    Prognostic sorting means that your machine learns to rank based on e.g. regression
    models, Support Vector Machines, Ranknet, and more. You optimize the effectiveness
    of the ranking towards the relevance criterion, e.g. the search term. It requires
    training and test data for your model, which is then deployed to predict demand
    for e.g. the next day.


    An advantage is that your product ranking is optimized over time and you can forecast
    demand. On the other hand, implementation is complex and takes longer, and the
    mathematical background is not explained easily to business stakeholders.


    Moreover, learning to rank increases the relevance of search results but does
    not necessarily provide the best method for creating customer inspiration (or
    the best product overview page), i.e. the purchase intention.

