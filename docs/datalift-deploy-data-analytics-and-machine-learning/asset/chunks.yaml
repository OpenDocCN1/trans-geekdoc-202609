    The forecast quality was improved by 7%. In the first year of production, the
    neural network saved one percent of grid loss cover charges, i.e. €700,000.


    ## Success factors


    How does the Elia Group replicate success across future use cases?


    First, full access to all company data. We can develop our own use cases and access
    any data we need.


    Second, the OpenShift agile app platform. It provides ease of deployment and clear
    ownership and responsibility: the platform is responsible for having enough computing
    power for all the apps that are running on it. But as to the individual app, that
    is the responsibility of the department and the individual deploying the app.
    No one has to wait on someone else.


    The Elia Group has founded the AI Center of Excellence, a facility providing best
    practices, research support, and training for data science. The center helps with
    three aspects.


    People expertise: All employees have access to the skills training they need.


    Tool support: Ensuring access to data, coding platforms, and deployment tools.


    Process orchestrator: Coordinate across all departments for strategy and innovation
    to achieve alignment on the AI business goals.


    From the Q&A “What was your team''s composition and from where did they have the
    expertise to use the data and deployment platforms?” “Most team members are analysts
    with a background in R and Python. They collaborated with data scientists in learning
    how to deploy the first time.”


    “Has the team optimized and widened the neural network? “There have been updates,
    and the team changed the architecture and added features.”


    “How do you do sanity checks on model outputs and monitor whether input distributions
    change? “The forecast is compared live every single day because we know how much
    we had to spend on the grid loss cover charges.“


    To contact the AI CoE please write to `artificialIntelligence@eliagroup.eu`


    ## Make #datalift happen for your business


    You can help Europe and your business break the proof-of-concept cycle by becoming
    an AI Guild member, asking experts from the AI Guild to assess a use case, and
    by working with the AI Guild to drive the deployment of data analytics and machine
    learning.


    ### Join the Ai Guild as a member


    The [AI Guild](https://theguild.ai) is the go-to community for data and business
    professionals advancing AI adoption. We are a community of practice for experts
    in Data Analytics, Data Science, Data Engineering and Machine Learning, Deep Learning,
    NLP, and Computer Vision. The AI Guild has 150+ members in leading roles such
    as technical lead, chief data officer, head of data, lead data scientist, bootcamp
    director, university professor, business architect, and founder. All members directly
    reach all other members to collaborate, discuss technical topics, exchange experiences,
    and find new opportunities in the field. Members come together e.g.


    *   The monthly members’ online meetup,

    *   Running data career orientation webinars and workshops, and

    *   Hosting the #datalift event series and presenting use cases in production.


    Members have privileged access to long-term career support services such as job
    search support, coaching, and professional accreditation. To join the community,
    please apply via the website [theguild.ai](http://www.theguild.a)


    ### Ask the AI Guild to evaluate your use cases


    Your business has a proof-of-concept or perhaps just data, and you are looking
    for some validation? AI Guild experts can help you fast and effectively. In less
    than 30 days, we can assess the state-of-play for your data infrastructure, use
    case architecture, and the deployment scenarios. We will work with you to understand
    your options and design an executable roadmap for productionizing data analytics
    and machine learning.


    ### Drive the deployment of data analytics and machine learning with AI Guild
    support


    Your business has the will and resources to deploy, and you would like some extra
    support and insight as you move forward? The AI Guild can work with your business
    in implementing practical solutions for your data infrastructure, use case architecture,
    and the deployment of your solutions. Please contact the AI Guild #datalift leader
    Dânia Meira via [LinkedIn](https://www.linkedin.com/in/daniameira/) or [email](mailto:dania@theguild.ai).


