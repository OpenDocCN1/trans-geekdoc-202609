    # Let’s look at the prediction of body height


    It is a component of the diagnosis. We collected thousands of smartphone scans
    of children plus the manual measurement of the body height. We used the data to
    train machine learning algorithms with a focus on the mean absolute error. It
    is a critical metric expressing the difference between the prediction and the
    actual height. With traditional manual measurement as a gold standard, the mean
    absolute error of 1.2 cm (0.47 in). Our challenge is being more accurate while
    also being fully reliable with no wrong prediction (false negative) for any child.


    # For the machine learning model


    We examined a variety of approaches for utilizing the data from the point cloud.
    Neural network architectures showed some promise. With a plain convolutional neural
    network using depth maps, we achieved a mean absolute error of 2 cm or better.
    Our research indicates that by turning to a multi-artifact CNN with Late Fusion
    (Karpathy et al 2014) we may reduce the mean absolute error to 1cm or better.


    # For body weight and the middle-upper arm circumference (MUAC)


    Our approach is similar. We know that the mean absolute error for traditional
    body weight measurement is 210 grams, and for MUAC is 3.3 mm. We train a neural
    network to predict body weight and MUAC.


    # From 2021


    Welthungerhilfe is offering the product in India and starts data collection in
    multiple African countries. For further validation, the Welthungerhilfe is looking
    for more technical contributors. The project presents a great opportunity for
    deploying a disruptive digital solution that gives us an edge in achieving Zero
    Hunger by 2030. From the Q&A “What is more challenging, the data collection or
    machine learning?” “Finding out the best way to scan a child is a dual challenge,
    as you need to respect children''s behavior and playfulness while also seeking
    to obtain data that facilitates prediction by the machine.”


    “How is the deployment of the application coming along?” “The first version is
    deployed already with staff, especially in India, for further development.”


    Check out the project at [https://childgrowthmonitor.org/](https://childgrowthmonitor.org/)


    # Quality inspection in manufacturing


    The TUBA AI machine vision toolkit Mahmoud AbdelAziz, Founder & CEO, DevisionX
    Moderated by Andrés Prada González Manufacturing quality inspection processes
    improve business performance if we automate the inspection process, make it real-time,
    and standardize reporting. By adding deep learning, we make the quality inspection
    process flexible for different products in the same industry, improving the bottom
    line. The TUBA AI machine vision toolkit is deployable off-the-shelf.


    [DevisionX](https://devisionx.com/) builds quality inspection systems using a
    mix of machine vision and artificial intelligence. We have developed an off-the-shelf
    AutoML tool that can be deployed on the cloud or on-premise. It provides an end-to-end
    solution for two- and three-dimensional quality inspection in manufacturing by
    processing data such as digital images and video generated by cameras to identify
    objects. We offer more robust recognition rates, greater productivity, more reliable
    identification, allocation, and handling of a wider range of objects throughout
    the entire value chain. Adding artificial intelligence to machine vision Machine
    vision typically provides image-based automatic inspection, sorting, and robot
    guidance. In manufacturing, such a system usually is based on an operator station,
    camera units, lighting, and a labeling device. Machine vision is about extracting
    information from images for automated action.


    Machine vision is superior to manual inspection and typically also cheaper. It
    addresses the perennial issue of scrap and waste in manufacturing. Yet, it does
    not sufficiently address the opportunity of generating large amounts of data and
    learning from them. If you add computer vision algorithms for image processing
    to the mix, your system improves continually with higher accuracy. Of course,
    this requires investment in real-time data management. Yet, among the immediate
    benefits are data-driven reports and insights, and the standardization of quality
    inspection.


    This simplified representation of adding artificial intelligence to machine vision
    makes the difference clear between the rigid approach of machine vision and the
    more comprehensive and flexible model you achieve with artificial intelligence.
    Use cases in manufacturing industries Thorough quality inspection in a large manufacturing
    organization is very data-intensive. For example, General Motors deploys 2000+
    smart cameras, for 2+ million inspections per day, resulting in more than 1 million
    dataset uploads. High data volumes have challenges, e.g. you need improved image
    compression for storage without compromising data quality and model accuracy.


    Automated quality inspection has wide applicability in the manufacturing industries.
    The following list gives you a taste of the scope: \- Food and beverage: Sorting
    by size, color, quality; Conformity of the code data; Safety in gauging and packaging
    \- Pharmaceutical: A variety of track and trace applications, Inspection of printing,
    artwork, and packing \- Automotive: Inspection of welding, coating, body parts,
    assembly; Volume gauging \- Electronics: Inspections of components, assembly process,
    and packaging \- Plastics and metals: Surface inspection; Gauging of thickness
    and dimensions.


    # AutoML with TUBA


    Given recent advances, manufacturers can rapidly deploy AutoML solutions for quality
    inspection. Let me introduce the concept of AutoML by contrasting it to the traditional
    workflow.


    “I believe that tools like TUBA will be the basis in the near future in every
    industry for anomaly detection or quality inspection. Instead of building up a
    data team at your company, it will be enough to collect the images, pin the problem,
    and let TUBA handle the most complex tasks.” Andrés Prada González, Computer Vision
    Engineer


    Traditional ML Process vs AutoML Process ![Traditional ML process vs. AutoML process](Image00006.jpg)


    If you set up or enhance your machine vision with TUBA, then your cameras keep
    taking images, which are now labeled for the model training. Typical operations
    will be the classification, detection, and segmentation of images. With a testing
    dashboard, you can keep uploading images and improving model accuracy. TUBA models
    are integrated easily with different types of software and hardware. Quality and
    production engineers can use TUBA on their own. From the Q&A “If TUBA enables
    machine vision systems to use deep learning models using data previously collected,
    then how do you do the data labeling?” “Users of TUBA have a tool to label images
    on their own.”


    “What is the major challenge in deploying this type of system?” “You need cameras
    with more than 120 frames per second,specially for high speed production lines
    , and the required computing power can be costly.”


    “From the customer point of view, what is the main difference between using no-code
    AutoML and requesting a solution from a system provider?” “We customize TUBA for
    each customer according to their needs through different types of deployment and
    modularity options and we are keen that they can use it on their own.”


    “How long does it take after submitting the data for the model to be deployed?”
    “Depending on the industry and enterprise this may vary but on average it takes
    3-4 days.”


    Request Beta access to TUBA at [https://tuba.ai/](https://tuba.ai/)


    # Applications of research define a new industry


    Automating urban aviation at Uber’s Advanced Technology Center in Paris Dr. François
    Sillion, Director, Uber ATCP Interviewed by Dr. Chris Armbruster, AI Guild

