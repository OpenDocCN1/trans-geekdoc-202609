- raw: "The forecast quality was improved by 7%. In the first year of production,\
    \ the neural network saved one percent of grid loss cover charges, i.e. €700,000.\
    \ Success factors How does the Elia Group replicate success across future use\
    \ cases? First, full access to all company data. We can develop our own use cases\
    \ and access any data we need. Second, the OpenShift agile app platform. It provides\
    \ ease of deployment and clear ownership and responsibility: the platform is responsible\
    \ for having enough computing power for all the apps that are running on it. But\
    \ as to the individual app, that is the responsibility of the department and the\
    \ individual deploying the app.  No one has to wait on someone else.     \n\n\
    The Elia Group has founded the AI Center of Excellence, a facility providing best\
    \ practices, research support, and training for data science.  The center helps\
    \ with three aspects. People expertise: All employees have access to the skills\
    \ training they need. Tool support: Ensuring access to data, coding platforms,\
    \ and deployment tools. Process orchestrator: Coordinate across all departments\
    \ for strategy and innovation to achieve alignment on the AI business goals. From\
    \ the Q&A “What was your team's composition and from where did they have the expertise\
    \ to use the data and deployment platforms?” “Most team members are analysts with\
    \ a background in R and Python. They collaborated with data scientists in learning\
    \ how to deploy the first time.”   \n\n“Has the team optimized and widened the\
    \ neural network? “There have been updates, and the team changed the architecture\
    \ and added features.”   \n\n“How do you do sanity checks on model outputs and\
    \ monitor whether input distributions change? “The forecast is compared live every\
    \ single day because we know how much we had to spend on the grid loss cover charges.“\
    \   \n\nTo contact the AI CoE please write to artificialIntelligence@eliagroup.eu\
    \ \n\nMake #datalift happen for your business  You can help Europe and your business\
    \ break the proof-of-concept cycle by becoming an AI Guild member, asking experts\
    \ from the AI Guild to assess a use case, and by working with the AI Guild to\
    \ drive the deployment of data analytics and machine learning. Join the Ai Guild\
    \ as a member  The [AI Guild](https://theguild.ai) is the go-to community for\
    \ data and business professionals advancing AI adoption. We are a community of\
    \ practice for experts in Data Analytics, Data Science, Data Engineering and Machine\
    \ Learning, Deep Learning, NLP, and Computer Vision. The AI Guild has 150+ members\
    \ in leading roles such as technical lead, chief data officer, head of data, lead\
