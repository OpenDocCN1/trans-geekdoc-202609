- raw: "For a machine learning solution, we extract the various fields from the invoice,\
    \ identify which ones are relevant, train a classifier on them based on whether\
    \ each invoice was paid or not, and then use the classifier to issue payment recommendations\
    \ on new invoices. Société Générale gave me several years of historical invoices\
    \ as images and also as XMLs, plus the payment decisions that the experts made.\
    \ I used hundreds of thousands of them to train the classifier.  Testing ML solutions\
    \ The naive approach here is to treat this as an image classification problem.\
    \ Just train a convolutional neural network to classify the images just like you\
    \ would if you wanted to classify images of cars or airplanes. That won’t work\
    \ for several reasons. First of all, the images are too big. A CNN model would\
    \ be way too large, even for state-of-the-art GPUs. Second, it wouldn’t be a good\
    \ fit for this problem even if the model was smaller or the GPUs were bigger.\
    \   \n\nThe second idea is to extract the data as text from the invoice image\
    \ and use that as features for a classical neural network. After extensive data\
    \ pre-processing and the transformation of text into numerical and categorical\
    \ values, you would build a binary classifier. That was a good enough idea to\
    \ try, so I coded it up, but it didn’t fit the data well. In the training set,\
    \ over 95% of the invoices are paid, which you expect as most invoices are correct\
    \ and legitimate. Only a small number of invoices have problems and should not\
    \ be paid. It is a class imbalance. The neural network achieved good performance\
    \ by ignoring the data and always suggesting you pay – with an accuracy of 95\
    \ percent. K-Means delivers In the end, I turned to K-means. Here, you take each\
    \ feature in your invoice and find the three most similar invoices to that, e.g.,\
    \ the closest total, the same type of repair, the closest date, and so on. The\
    \ three most similar invoices in the training set ‘vote’ on the case. For example,\
    \ if the experts paid all three of those invoices, you pay. Or, if two of them\
    \ were not paid, then you don't pay.    \n\nOne benefit is that similar invoices\
    \ tend to cluster. For example, fuel invoices tend to cluster because many of\
    \ their features are similar. Another advantage of K-Means is that the training\
    \ time is fast, which meant that I could easily tweak and iterate. The issue of\
    \ false positives There are two possible quality measurements for a classifier\
    \ - precision and recall - often in conflict. The ‘recall’ is the fraction of\
    \ the invoices for which a prediction is possible. The ‘precision’ is how accurate\
    \ that prediction is. The first classifier I built for Société Générale had 75%\
    \ recall and was 98% accurate. That means a 2% error rate or 1 in 50, which is\
    \ not accurate enough.   \n\nAfter discussing it with the client, I realized that\
    \ they cared more about precision (mistakes are terrible) than recall (it’s OK\
    \ if the classifier sometimes can’t decide). I tweaked the algorithm for higher\
    \ precision at lower recall: 99.7% accuracy on 40% of the invoices. 40% may look\
    \ low, but any fraction of the invoices you can automate saves people time. And\
    \ that's a real win for Société Générale because then the people are free to do\
    \ more exciting work.    \n\n“When it comes to putting models in production for\
    \ freelance clients, accuracy and stability are key.” Evan Simpson, Data Scientist\
    \   \n\nIn the end, SG was happy with the prototype. In coordination with their\
    \ IT team, we packaged it for deployment (which required some fun engineering\
    \ effort), and it is used in production to this day.   ![Tech Stack for automated\
    \ invoice classification](Image00003.jpg)From the Q&A “How did the client react\
    \ to the process of you trying different models and then finding one that worked?”\
    \ “SocGen was interested in the technical stuff, so it was fun to go back and\
    \ forth. Other clients just want the final result, which is fine too.”   \n\n\
    “How do you engage clients with maintaining expectations?\" “I prefer clear communication\
    \ from the get-go, especially about what the client wants and what I think is\
    \ feasible. Do you want advice? Do you want me to explore your data and build\
    \ a prototype? Or do you want a real production system? Also, my experience says\
    \ it's almost  always simple stuff that solves low hanging fruit. There is a lot\
    \ of business impact for clients on clean data, linear regression, K-Means, and\
    \ simple neural networks. Of course, the advanced stuff is there in the toolbox\
    \ if we need it.\"   \n\n“Do you only use stable data science libraries or also\
    \ some private code?” “For production deployment that I expect to run beyond my\
    \ engagement, I only use stable libraries. For prototyping, though, there’s more\
    \ freedom.\"   \n\nMarketplace recommendation systems How Delivery Hero shows\
    \ customers what they want Dr. Aleksandra Kovachev, Senior Machine Learning Engineer\
    \ & Varun Chitale, Data Scientist, Delivery Hero Moderated by Macarena Beigier\
    \ T he Recommendations and Ranking Team at Delivery Hero discovers where, when,\
    \ and what the customers want. The team couples scalable and efficient data pipelines\
    \ with fast and reliable APIs to serve recommendations for >6 million transactions\
    \ daily.   \n\n[Delivery Hero](https://www.deliveryhero.com) is a platform network\
    \ of 30+ brands operating in 40+ countries, partnering with 600k+ restaurants\
    \ and a fleet of riders. Delivery Hero is also a pioneer of Q-commerce (quick\
    \ commerce) for ultra-fast deliveries from grocery stores, pharmacies, pet shops,\
    \ and more. A particular highlight of the company culture is that people from\
    \ 100+ nationalities work at the Berlin headquarters. Productionizing memory-\
    \ and model-based recommender systems  Steve Jobs, 2009 “A lot of times, people\
    \ don’t know what they want until you show it to them.”    \n\nDelivery Hero utilizes\
    \ memory- and model-based recommendation systems on its marketplace. It helps\
    \ users find relevant items, saves search time, and enhances the experience with\
    \ new or unexpected offers. Recommender systems improve the customer experience\
    \ while driving  incremental revenue.    \n\nThe memory-based recommender system\
    \ is based on a non-parametric mathematical approach computing similarity between\
    \ users and items using heuristics. We use content-based filtering for discovering\
    \ similarity among items and collaborative filtering for finding similarity among\
    \ users. These filters may be combined in a hybrid model.   \n\nOur model-based\
    \ recommender system uses an algorithm to predict the next item a user wants to\
    \ see and order, again using content-based and collaborative filtering to arrive\
    \ at a hybrid model.   \n\nUsers give us explicit feedback on the recommender\
    \ system through purchases, ratings, and recommendations. We also analyze the\
    \ implicit feedback deriving from the way users interact with the platform content.\
    \   \n\nHow we evaluate the dynamic recommender system: In addressing the challenge\
    \ that training data may be biased by previous recommendations made, we favor\
    \ online over offline evaluations. A/B testing gives us a more objective perspective\
    \ if we invest the necessary time for the experiment to run before comparing results.\
    \ ![Tech Stack diagram of Delivery Hero's Recommendation System](Image00004.jpg)Collaborative\
    \ filtering for recommending items and vendors  For collaborative filtering, Delivery\
    \ Hero analyzes transactions based on user similarities and preferences or based\
    \ on item similarity. A key advantage of collaborative over content-based filtering\
    \ is that it achieves independence from the context, making the recommendations\
    \ more  practical (e.g., what customers buy together). As we retrain the model\
    \ over time, we capture trend evolution too.   "
  fmt: '

    # 机器学习发票分类方案


    For a machine learning solution, we extract the various fields from the invoice,
    identify which ones are relevant, train a classifier on them based on whether
    each invoice was paid or not, and then use the classifier to issue payment recommendations
    on new invoices. Société Générale gave me several years of historical invoices
    as images and also as XMLs, plus the payment decisions that the experts made.
    I used hundreds of thousands of them to train the classifier.


    ## 测试 ML 方案


    The naive approach here is to treat this as an image classification problem. Just
    train a convolutional neural network to classify the images just like you would
    if you wanted to classify images of cars or airplanes. That won’t work for several
    reasons. First of all, the images are too big. A CNN model would be way too large,
    even for state-of-the-art GPUs. Second, it wouldn’t be a good fit for this problem
    even if the model was smaller or the GPUs were bigger.


    The second idea is to extract the data as text from the invoice image and use
    that as features for a classical neural network. After extensive data pre-processing
    and the transformation of text into numerical and categorical values, you would
    build a binary classifier. That was a good enough idea to try, so I coded it up,
    but it didn’t fit the data well. In the training set, over 95% of the invoices
    are paid, which you expect as most invoices are correct and legitimate. Only a
    small number of invoices have problems and should not be paid. It is a class imbalance.
    The neural network achieved good performance by ignoring the data and always suggesting
    you pay – with an accuracy of 95 percent.


    ## K-Means 方案


    In the end, I turned to K-means. Here, you take each feature in your invoice and
    find the three most similar invoices to that, e.g., the closest total, the same
    type of repair, the closest date, and so on. The three most similar invoices in
    the training set ‘vote’ on the case. For example, if the experts paid all three
    of those invoices, you pay. Or, if two of them were not paid, then you don''t
    pay.


    One benefit is that similar invoices tend to cluster. For example, fuel invoices
    tend to cluster because many of their features are similar. Another advantage
    of K-Means is that the training time is fast, which meant that I could easily
    tweak and iterate.


    ## 误报问题


    There are two possible quality measurements for a classifier - precision and recall
    - often in conflict. The ‘recall’ is the fraction of the invoices for which a
    prediction is possible. The ‘precision’ is how accurate that prediction is. The
    first classifier I built for Société Générale had 75% recall and was 98% accurate.
    That means a 2% error rate or 1 in 50, which is not accurate enough.


    After discussing it with the client, I realized that they cared more about precision
    (mistakes are terrible) than recall (it’s OK if the classifier sometimes can’t
    decide). I tweaked the algorithm for higher precision at lower recall: 99.7% accuracy
    on 40% of the invoices. 40% may look low, but any fraction of the invoices you
    can automate saves people time. And that''s a real win for Société Générale because
    then the people are free to do more exciting work.


    > “When it comes to putting models in production for freelance clients, accuracy
    and stability are key.” Evan Simpson, Data Scientist


    In the end, SG was happy with the prototype. In coordination with their IT team,
    we packaged it for deployment (which required some fun engineering effort), and
    it is used in production to this day.


    ![Tech Stack for automated invoice classification](Image00003.jpg)


    ## 问答


    From the Q&A “How did the client react to the process of you trying different
    models and then finding one that worked?” “SocGen was interested in the technical
    stuff, so it was fun to go back and forth. Other clients just want the final result,
    which is fine too.”


    “How do you engage clients with maintaining expectations?" “I prefer clear communication
    from the get-go, especially about what the client wants and what I think is feasible.
    Do you want advice? Do you want me to explore your data and build a prototype?
    Or do you want a real production system? Also, my experience says it''s almost
    always simple stuff that solves low hanging fruit. There is a lot of business
    impact for clients on clean data, linear regression, K-Means, and simple neural
    networks. Of course, the advanced stuff is there in the toolbox if we need it."


    “Do you only use stable data science libraries or also some private code?” “For
    production deployment that I expect to run beyond my engagement, I only use stable
    libraries. For prototyping, though, there’s more freedom."


    # Delivery Hero 市场推荐系统


    ## How Delivery Hero shows customers what they want


    Dr. Aleksandra Kovachev, Senior Machine Learning Engineer & Varun Chitale, Data
    Scientist, Delivery Hero Moderated by Macarena Beigier T he Recommendations and
    Ranking Team at Delivery Hero discovers where, when, and what the customers want.
    The team couples scalable and efficient data pipelines with fast and reliable
    APIs to serve recommendations for >6 million transactions daily.


    [Delivery Hero](https://www.deliveryhero.com) is a platform network of 30+ brands
    operating in 40+ countries, partnering with 600k+ restaurants and a fleet of riders.
    Delivery Hero is also a pioneer of Q-commerce (quick commerce) for ultra-fast
    deliveries from grocery stores, pharmacies, pet shops, and more. A particular
    highlight of the company culture is that people from 100+ nationalities work at
    the Berlin headquarters.


    ## Productionizing memory- and model-based recommender systems


    Steve Jobs, 2009 “A lot of times, people don’t know what they want until you show
    it to them.”


    Delivery Hero utilizes memory- and model-based recommendation systems on its marketplace.
    It helps users find relevant items, saves search time, and enhances the experience
    with new or unexpected offers. Recommender systems improve the customer experience
    while driving incremental revenue.


    The memory-based recommender system is based on a non-parametric mathematical
    approach computing similarity between users and items using heuristics. We use
    content-based filtering for discovering similarity among items and collaborative
    filtering for finding similarity among users. These filters may be combined in
    a hybrid model.


    Our model-based recommender system uses an algorithm to predict the next item
    a user wants to see and order, again using content-based and collaborative filtering
    to arrive at a hybrid model.


    Users give us explicit feedback on the recommender system through purchases, ratings,
    and recommendations. We also analyze the implicit feedback deriving from the way
    users interact with the platform content.


    ## 如何评估动态推荐系统


    How we evaluate the dynamic recommender system: In addressing the challenge that
    training data may be biased by previous recommendations made, we favor online
    over offline evaluations. A/B testing gives us a more objective perspective if
    we invest the necessary time for the experiment to run before comparing results.


    ![Tech Stack diagram of Delivery Hero''s Recommendation System](Image00004.jpg)


    ## Collaborative filtering for recommending items and vendors


    For collaborative filtering, Delivery Hero analyzes transactions based on user
    similarities and preferences or based on item similarity. A key advantage of collaborative
    over content-based filtering is that it achieves independence from the context,
    making the recommendations more practical (e.g., what customers buy together).
    As we retrain the model over time, we capture trend evolution too.

