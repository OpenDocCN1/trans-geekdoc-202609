    这种过滤方式对回头客尤其有效，而对于新客户，则可以先展示最受欢迎的商品等方式入手。我们也需要保护算法。例如，可能会出现所谓的“刷单攻击”，即商家或产品所有者试图影响推荐和排名（例如，虚假评论）。“构建模型通常针对特定国家或地区，并且取决于人口密度和典型行为模式等因素。”


    Dr. Aleksandra Kovachev，高级数据科学家


    “Delivery Hero 的业务成功基于专为特定国家和地区设计的 AI 模型，这使公司在拓展新市场方面具有巨大潜力。”Macarena Beigier，数据科学家


    ## 推荐类型


    Delivery Hero 区分供应商级和产品级推荐。我们有不同的类别，如餐厅、超市或药店，这些类别定义了市场。典型的优惠包括过去的订单、最受欢迎的商品、相似商品或个性化推荐。


    ## 数据来源与流水线


    Delivery Hero 使用 DataFridge 收集、统一和标准化所有数据，无论是显式数据（例如，供应商、产品、订单、评论）还是跟踪数据（例如，点击、交互）。通过分析这些数据，我们为推荐系统提取有意义的特征。


    来自问答“您是否使用任何基于注意力的推荐模型？”“不，主要是因为在推荐餐厅或商店时，这并不适用。”


    “您如何处理个性化推荐中的过拟合问题？”“当我们使用经典机器学习方法时会遇到过拟合。我们研究了过采样和欠采样，通常发现使用类别权重效果良好。”


    Delivery Hero 的空缺职位，请参阅 [careers.deliveryhero.com/global/en](https://careers.deliveryhero.com/global/en)


    ## 产品列表排序算法


    MYTOYS 如何利用机器学习提升客户转化率 Dr. Sebastian Rose，高级数据科学家，MYTOYS GROUP 主持人 Elif Shaefer
    部署自适应产品列表排序算法而非基于规则的算法，使 MYTOYS 的转化率提高了 7%，访客收入提高了 6.5%。跳出率下降了 -12%。


    [MYTOYS](https://www.mytoys.de) 是欧洲最大的面向年轻家庭的在线零售平台，年经常性收入超过 7.2 亿欧元，拥有 700 万客户、2100
    万次访问和 25 万种在线产品。七十 percent 的流量来自移动端。它每年向客户配送超过 1300 万个包裹。


    ## 客户旅程中的产品列表排序


    扩展电子商务平台的一个关键挑战是如何以及以什么顺序展示产品。网上购物者经常会遇到这种情况：例如，浏览产品概览页面，查看某个类别的产品或来自不同类别的产品选择。


    为此，可以实施多种排序策略，它们在人类专家的参与程度以及系统和算法的复杂性（基于规则、自适应和预测）方面有所不同。选择的算法在开始时越复杂，技术集成和组织接受度的挑战就越高。遵循“从简单开始，逐步复杂化”的原则，可以平衡这些挑战，并推动向
    AI 驱动型公司的转变。


    更系统地看，客户旅程中的产品列表排序具有以下维度：

    - 灵感。基于受欢迎程度的列表，以创造购买意向。

    - 定向。基于用户或产品相似性的推荐，以刺激购买意向。

    - 相关性。基于相对于搜索意图的相关性的列表，以完成购买意向。


    在此次演讲中，我们专注于客户灵感（产品概览页面）的排序策略。


    最简单的排序策略是随机。当你刚开始经营电子商务并且只有有限的一组产品展示时，它效果很好。如果业务增长，并且你像 MYTOYS 一样拥有超过 250,000
    种产品，那么你将考虑以下策略：

    1. 基于规则的排序。由人类专家定义规则。

    2. 自适应排序。使用定义的目标变量来调整产品排序。

    3. 预测排序。基于产品数据模式预测排序。


    ### 基于规则的排序


    基于规则的产品排序很简单。你根据选定的变量实现算法，例如过去 30 天的收入或产品当前的覆盖率/可用性。你可以这样形式化：“权重 * 收入（30 天）+ 权重
    * 趋势（7 天）+ 权重 * 覆盖率（当前）+ …. = 产品列表得分”


    由此，你决定为不同变量分配什么权重，因此你可以例如通过降低覆盖率/可用性的权重来优化清仓销售的排序，这样剩下的货架商品会首先显示。如果你想优化收入，则增加收入的权重。你的决策将源自你的业务需求，并且你可以手动更改产品列表排序。


    基于规则的排序的问题是推理是循环的：产品列表得分影响用于计算它的绩效指标。此外，规则可能只反映你的业务需求，而不反映你客户的需求。然而，通过手动更改权重干预复杂系统可能会引入人为错误，这意味着你可能无法实现企业目标。


    ### 自适应排序


    自适应排序引入了统计学和概率计算。更准确地说，排名是概述页面上看到的产品也会被购买的预期概率的结果。更形式化地说，这种方法创建排名，结果是客户在当前排序列表下购买产品的概率。在此过程中，该概率得到优化。因此，客户需求和反馈会自动集成到驱动自适应排序的公式中。


    使用自适应排序，你的平台可以轻松响应需求的变化，甚至是需求激增。例如，在德国，每年公布“年度游戏”（Spiel des Jahres）的各个类别。自适应算法会自动捕捉需求激增并相应响应。因此，实时质量数据至关重要。通过最新且准确的数据，该系统可以响应需求的变化，例如在圣诞节前夕自动响应。


    自适应排序的局限性在于它仅基于有限的一组变量提供快照。此外，你的数据流水线需要高度可靠。


    ### 预测排序


    预测排序意味着你的机器学习基于回归模型、支持向量机器、Ranknet 等来对产品进行排名。你优化排名的有效性以符合相关性标准，例如搜索词。它需要模型的训练和测试数据，然后部署模型来预测例如第二天的需求。


    一个优势是你的产品排名会随时间优化，并且你可以预测需求。另一方面，实现复杂且耗时较长，数学背景不容易向业务利益相关者解释清楚。


    此外，学习排名提高了搜索结果的相关性，但不一定能提供创造客户灵感（或最佳产品概览页面）的最佳方法，即购买意向。


    '
