- raw: 'Dr. Peter Heise, Data Analytics and AI Community Leader, Airbus The Airbus
    AI story. Upskilling thousands of engineers to data analytics and machine learning.
    An interview with Dr. Peter Heise (Airbus) by Dr. Chris Armbruster (AI Guild)
    Chris    Peter, let’s speak about the Airbus AI story. In 2018 I learned that
    Airbus started upskilling 700 employees to data analytics and machine learning.
    That was quite a number. In 2019 I heard that Airbus achieved completion rates
    greater than 90 percent on the Udacity courses used. Later that year, I bumped
    into Sebastian Thrun, the founder of Udacity, who confirmed the very high completion
    rate, and mentioned that typically on Udacity, it was in the range of 20-30%.
    Next, I learned that in 2020 Airbus started upskilling the next two thousand employees,
    a fantastic effort. Why is Airbus doing this? Peter I think I have three answers
    for you. Firstly, we did believe in 2018 that AI would be everywhere and relevant
    to all 100,000 people working at Airbus. We kicked off with a small central team
    of about 20 and intended to scale. Secondly, we realized quickly that we usually
    go out to the teams in the business and help solve their problems. A typical project
    centers on the request to help design a win. In that sense, you have to train
    the data scientists to develop a winning business project. Upskilling data scientists
    with business knowledge turned out to be very hard. So we turned it around. Instead
    of growing the central team, we shifted to a decentralized approach. Airbus has
    data-literate people, so if you train them to do machine learning, they define
    the use cases and can start them too. We empower the business units to solve their
    problems and truly drive digital transformation.  The third point is that I think
    every company will be a data company in the future. Maybe some companies don''t
    know it yet, but there will be lots more automation. At Airbus, we believe in
    our people and decided to step up with the mindset of a data-driven company and
    lead in driving the transformation. Chris Thank you, Peter, for showing us how
    Airbus leads on the data transformation. Can you tell  us more about who is upskilling?
    Peter Everyone. Of course, in the beginning, we asked friends and colleagues.
    For the first few rounds of training, we were experimenting and learning. Now
    that the training program is mature, our target is for 2.5% of the full working
    population of Airbus to become data professionals through training and upskilling.
    We are pursuing a decentralized approach to have data professionals everywhere
    and thereby achieve the company’s transformation.  I continue to be amazed at
    the use cases uncovered on the shop floor. We are also teaming up with the Women
    Career Network at Airbus to encourage more women to join the training program.
    Participation by women is not yet relatively as high as I would like it to be.
    Overall, I am confident that we will reach our target of 2,500+ upskilled Airbus
    employees in the next couple of years. Chris Thank you, Peter, for sketching the
    program. What can you tell us about the training? Peter The opportunity exists
    for everyone from beginner to data analysts with prior skills. The training kicks
    off with some basics, including an entry test for which you need to invest in
    your learning. The training introduces you to all you need as a data practitioner,
    including data cleaning, databases, descriptive statistics, inferential statistics,
    data analytics, simple machine learning, and a first neural network. Airbus also
    offers a second training focused on machine learning and its different approaches
    and use cases. Chris Quite an extensive training program that Airbus operates.
    How do you organize training across all the facilities that you have? Peter Airbus
    partnered with Udacity , a big MooC provider, so the training courses are all
    online. We do more than give you an online account. Completion and success rates
    of online courses typically are not better than 30%. If we invest as a company,
    we want every employee to succeed. There is a motivation check for participants
    with the entry test, including writing some code. Next, we have a kick-off in
    person. We invite everybody to the headquarters in Toulouse for the program introduction.
    Next, participants start local learning groups in, say, Toulouse, Hamburg, or
    Madrid. In effect, local cohorts meet regularly, for example, for lunch every
    two weeks. That introduces peer help and also a bit of peer pressure. What emerges
    is a community of practice where you can voice your questions, receive feedback,
    and share results. The community also has a place online and online tools to support
    learning and project work. Chris Thank you, Peter, for outlining how the training
    works. What have been the main results so far? Peter   Top management We were
    looking for ways of making Airbus more digital. We derived support and some space
    to experiment. We wanted completion rates of 80% and 90% as an indicator of ambition
    and commitment. Indeed, upskilling 2.5% of a large company requires experimentation
    and iteration in uncovering how to do this best. Looking back, I think the first
    cycle was both good and challenging as we learned what type of structure was required.
    Motivated people often went a long way by themselves. They did the training, started
    a data science team career, and digitized their functions. That is amazing.  Sometimes
    participants also felt blocked by their management and not able to work on new
    topics. In the beginning, some didn’t apply it much. So, in our experimental approach,
    we looked at the early experience and asked: What do we need to do so that all
    people complete the training? What do we need to do so that all training graduates
    have the chance to apply their new skills? We then set about making that reality.
    Chris    That is an exciting story, Peter. Where is Airbus now? Peter In October
    2020, we start Cycle 17. I am excited because that means we have 1,100 people
    in the training program. Of course, we are reinventing our structure because of
    the COVID-19 pandemic. For example, we have to figure out how to build peer groups
    online only.  Also, I have noticed some saturation. If somebody asks what the
    data strategy is for XY, they don''t have to come to the central team anymore
    because there are data practitioners on the team, the neighboring squad, and in
    the unit more generally. The decentralized approach is successful because there
    always are colleagues with domain expertise and data skills. This success allows
    Airbus to do larger projects with a much higher value. A member of the central
    team supports machine learning specifics, but the unit covers most aspects. You  effectively
    push forward the project, organize some sprints, and achieve some exciting results.
    We also explore a concept called ‘franchising.’ For example, you have uncovered
    a use case. But the team tells you that it doesn’t have time to do it and requires
    more people. What we do is work with the head of the unit on a strategy to start
    with Fridays. The idea is that if the team convinces you on Friday, you give them
    Thursday, and so on. Thus, a new group emerges that has data skills and domain
    knowledge from the get-go. Chris Excellent, Peter. Airbus has a larger number
    of people forming teams and enabling Airbus to execute. The company is investing.
    As we know, there is a shortage of data skills on the market. Is Airbus not afraid
    of losing the newly skilled employees?  Peter There is always a risk with training
    and innovation. You might lose the people or the project. But what''s the alternative?
    If you don''t do it, you''re stuck. So you do it. Nonetheless, there are a few
    things we observed. People investing in their own upskilling are special. Often,
    they are practical, have excellent team spirit, and are looking to management
    for understanding and support. If you allow them to speak up, then data projects
    have the power to break up silos and discover some valuable truth. Of course,
    a new reality may be painful initially if it breaks with long-held beliefs; we
    know that from the history of science. Yet, it also provides validation in building
    a data-driven company. The training isn’t enough. You need a career path in place
    that clarifies the next steps. You also need the next project with challenging
    problems. I mean the hard stuff, not the sporty dataset challenges but the business
    problems. As I survey our landscape, there may have been a few people that left.
    There has been some internal mobility, with people moving across teams or units
    to work on new challenges. And the vast majority become the nucleus of the data
    team and drive forward our data-driven transformation. Chris Thank you, Peter.
    Can you tell us more about the curriculum? Peter For data analytics, we use the
    Udacity nano degree in the version that is available online to anyone. In the
    beginning, we have a welcome video, and we also use a proxy server and a software
    catalog. For advanced training, we could not find a course that suited Airbus
    requirements and interests. So, we asked Udacity to mix-and-match course content
    and  serve it up. For example, A/B testing on websites is not as attractive to
    Airbus engineers as is anomaly detection for sensor computer vision of satellite
    images. In sum, we designed the curriculum by re-using Udacity content most suited
    to our needs. Chris Was there a specific reason for choosing Udacity? Peter We
    compared online providers. We do offer courses from different providers internally.
    Yet, for the training, we found that Udacity works well because of its approach
    saying, “You’re awesome. You can do this.”  Udacity courses are practical in ‘here
    is Python, use it, and now predict something.’ Feedback was exceptionally positive
    from people who don’t want to be full-time computer Scientists but instead would
    stay in their domain and acquire a sound background in data analytics. Chris One
    last question, Peter. What are the results for Airbus? Peter For the training,
    the purpose of the final project is to secure the new skills. Also, we empower
    participants to start their projects after the training. For machine learning,
    about thirty percent of the projects move forward to an MVP, and a few of those
    make it into production. For data analytics, the number is higher. Value is key.
    Airbus has a ‘value team,’ which, for example, is looking for savings and seeks
    to accelerate the high-value projects by prioritizing further training. Essential
    is that Airbus has a platform with everything included, even the service level
    agreements. For example, data dashboards are updating automatically, and there
    is a pipeline in the middle, which is ‘in production’ by default. The data analyst
    is filling the pipeline, and it''s just running. Overall, we have a lot in production,
    and maintenance needs are low. On top, Airbus also has a product team with a service
    desk for bringing projects into production. It is a central support team managing
    the process to the desired outcome. Chris Thank you, Peter. It is an excellent
    story about seizing data transformation opportunities and adopting a data-driven
    approach at Airbus. I wish you success.    '
