    \ up a data team at your company, it will be enough to collect the images, pin\
    \ the problem, and let TUBA handle the most complex tasks.” Andrés Prada González,\
    \ Computer Vision Engineer  \n\nTraditional ML Process vs AutoML Process ![Traditional\
    \ ML process vs. AutoML process](Image00006.jpg)  \n\nIf you set up or enhance\
    \ your machine vision with TUBA, then your cameras keep taking images, which are\
    \ now labeled for the model training. Typical operations will be the classification,\
    \ detection, and segmentation of images. With a testing dashboard, you can keep\
    \ uploading images and improving model accuracy. TUBA models are integrated easily\
    \ with different types of software and hardware. Quality and production engineers\
    \ can use TUBA on their own. From the Q&A “If TUBA enables machine vision systems\
