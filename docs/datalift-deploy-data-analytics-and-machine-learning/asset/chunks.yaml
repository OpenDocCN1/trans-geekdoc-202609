- raw: "Let’s look at the prediction of body height. It is a component of the diagnosis.\
    \ We collected thousands of smartphone scans of children plus the manual measurement\
    \ of the body height. We used the data to train machine learning algorithms with\
    \ a focus on the mean absolute error. It is a critical metric expressing the difference\
    \ between the prediction and the actual  height. With traditional manual measurement\
    \ as a gold standard, the mean absolute error of 1.2 cm (0.47 in). Our challenge\
    \ is being more accurate while also being fully reliable with no wrong prediction\
    \ (false negative) for any child.   \n\nFor the machine learning model, we examined\
    \ a variety of approaches for utilizing the data from the point cloud. Neural\
    \ network architectures showed some promise. With a plain convolutional neural\
    \ network using depth maps, we achieved a mean absolute error of 2 cm or better.\
    \ Our research indicates that by turning to a multi-artifact CNN with Late Fusion\
    \ (Karpathy et al 2014) we may reduce the mean absolute error to 1cm or better.\
    \   \n\nFor body weight and the middle-upper arm circumference (MUAC), our approach\
    \ is similar. We know that the mean absolute error for traditional body weight\
    \ measurement is 210 grams, and for MUAC is 3.3 mm. We train a neural network\
    \ to predict body weight and MUAC.   \n\nFrom 2021, Welthungerhilfe is offering\
    \ the product in India and starts data collection in multiple African countries.\
    \ For further validation, the Welthungerhilfe is looking for more technical contributors.\
    \ The project presents a great opportunity for deploying a disruptive digital\
    \ solution that gives us an edge in achieving Zero Hunger by 2030. From the Q&A\
    \ “What is more challenging, the data collection or machine learning?” “Finding\
    \ out the best way to scan a child is a dual challenge, as you need to respect\
    \ children's behavior and playfulness while also seeking to obtain data that facilitates\
    \ prediction by the machine.”   \n\n“How is the deployment of the application\
    \ coming along?” “The first version is deployed already with staff, especially\
    \ in India, for further development.”   \n\nCheck out the project at [https://childgrowthmonitor.org/](https://childgrowthmonitor.org/)\
    \ \n\nQuality inspection in manufacturing The TUBA AI machine vision toolkit Mahmoud\
    \ AbdelAziz, Founder & CEO, DevisionX Moderated by Andrés Prada González M anufacturing\
