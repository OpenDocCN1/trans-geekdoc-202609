    \n在美国印刷\n\n# #datalift AI Guild GmbH 生产环境中的应用案例\n\n## 目录\n\nCopyright  \n#datalift\
    \  \n前言  \n介绍 #datalift  \n#datalift 第 1 号和第 2 号的洞察](#text00006.html#aUF)  \n\
    铁路维护与自动驾驶汽车  \n供应商管理的自动化决策  \n产品列表排序算法  \nDr. Peter Heise, Data Analytics and\
    \ AI Community Leader, Airbus  \n个性化数字医疗  \n2030 年前实现零饥饿！  \n制造业质量检验  \n自动化信用风险评估\
    \  \n大规模图像元数据提取  \n能源传输服务中首个神经网络的部署  \n为您的业务实现 #datalift  \n致谢  \n关于作者\n\n## 前言\n\
    \nLorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor\
    \ incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud\
    \ exercitation ullamco laboris.\n\n## 介绍 #datalift\n\n领导者需要认识到将数据分析和机器学习投入生产的紧迫性。为什么？因为最酷的技术如果没有部署到业务场景中，也是无用的。每一次危机都是一次机遇。COVID-19\
    \ 大流行是一个充满挑战的时刻。它影响着我们的健康、经济和生计，并推动数字数据的创造。企业和政府应抓住我们拥有的这个绝佳机遇：扩大数据经济。\n\n###\
    \ Feedforward Europe\n\n欧洲在工业和初创企业的主要经济领域拥有大量专家。此外，到 2023 年底，将有一百万具备数据素养的人才毕业。因此，让我们打破概念验证循环，将数据分析和机器学习投入生产。通过\
    \ #datalift，我们向您展示企业和政府如何立即扩大数据经济。\n\n### 企业需求\n\n通过与 50 多场活动中 500 多名 AI Guild\
    \ 从业者的 1000 多次交谈，我们知道企业需要：\n\n* 更多且更好的专业知识来成功部署应用案例；\n* 一个供管理层、专家和人才交付产品的结构；以及\n\
    * 在数据经济中大获全胜的意愿和资源。\n\n如果欧洲现在不改进，这很可能导致悲伤的故事，例如：“大量数据，从未真正被利用。该公司已经倒闭。”\n\n###\
    \ 数据职业与应用案例\n\nAI Guild 一直在努力提升能力，以应对欧洲 AI 采用的主要挑战。\n\n1. 我们正在提升从业者的专业知识，以成功部署数据分析和机器学习。\n\
    2. 我们具备大规模引入数据人才并为交付数据基础设施和应用案例架构的公司开发团队的能力。\n3. 促进企业、政治和技术之间的沟通，以推动 AI 采用，而您现在正在阅读一个示例。\n\
    \n### 面向企业\n\n专业知识和经验对于实施贵公司的应用案例至关重要。如果您与 AI Guild 合作，您将尽可能快地培养出新一代专家。\n\n* 您的简单应用案例将立即得到解决。\n\
    * 您将在 1-2 年内创建部署和学习的良性循环。\n* 您将扩大内部专业知识，以便在整个企业中进行部署。\n\n### 面向政府\n\n通过将欧洲刺激计划的\
    \ 1% 用于启动数据经济，重返增长之路。如果您与 AI Guild 合作，我们可以将最优秀的数据人才转变为可部署的从业者。我们已经算过账，预计到 2022\
    \ 年将有多达 100 万具备数据素养的毕业生：他们精通数学，有处理数据的经验，并能使用 Python、R 和 SQL 进行编程。想象一下，您的城市、您的国家和欧洲能用这么多新鲜人才实现什么。欧洲每年有\
    \ 120 万 STEM 毕业生，30% 拥有硕士学位，4% 拥有博士学位。基准是每年 40 万名具备高度数据素养的毕业生。\n\nDânia Meira\
    \ & Chris Armbruster\n\n## #datalift 第 1 号和第 2 号的洞察\n\n为了向每一位从业者、企业和政府展示，欧洲确实拥有扩大数据经济的知识和手段，我们正在举办\
    \ #datalift 活动系列。我们于 2020 年 9 月 25 日和 2020 年 11 月 27 日举办了第一场和第二场活动，由 AI Guild\
    \ 成员组织和主持。此外，所有展示和讨论应用案例的演讲者都是 AI Guild 的成员。\n\n"
