  trans: '


    # 让我们来看看身高预测


    这是诊断的一个组成部分。我们收集了数千次儿童的智能手机扫描以及身高的手动测量数据。我们利用这些数据来训练机器学习算法，重点关注平均绝对误差。这是一个关键指标，用于表达预测值与实际身高之间的差异。以传统的手动测量作为金标准，平均绝对误差为
    1.2 厘米（0.47 英寸）。我们的挑战在于，在确保完全可靠且对任何儿童都没有错误预测（假阴性）的同时，提高准确性。


    # 关于机器学习模型


    我们研究了多种利用点云数据的方法。神经网络架构显示出了一些前景。使用基于深度图的普通卷积神经网络，我们实现了 2 厘米或更好的平均绝对误差。我们的研究表明，通过转向带有
    Late Fusion 的多工件 CNN（Karpathy et al 2014），我们可能将平均绝对误差降低到 1 厘米或更好。


    # 关于体重和中上臂围（MUAC）


    我们的方法类似。我们知道传统体重测量的平均绝对误差为 210 克，而 MUAC 为 3.3 毫米。我们训练一个神经网络来预测体重和 MUAC。


    # 从 2021 年开始


    Welthungerhilfe 正在印度提供该产品，并在多个非洲国家开始数据收集。为了进一步验证，Welthungerhilfe 正在寻找更多的技术贡献者。该项目为部署一种颠覆性的数字解决方案提供了绝佳机会，这将使我们在实现
    2030 年零饥饿目标方面占据优势。来自问答“数据收集和机器学习哪个更具挑战性？”“找到扫描儿童的最佳方式是一项双重挑战，因为你既需要尊重儿童的行为和好奇心，又需要获取有助于机器进行预测的数据。”


    “应用程序的部署进展如何？”“第一个版本已经部署，由工作人员使用，尤其是在印度，以便进一步开发。”


    查看项目：[`childgrowthmonitor.org/`](https://childgrowthmonitor.org/)


    # 制造业质量检验


    TUBA AI 机器视觉工具包 Mahmoud AbdelAziz，DevisionX 创始人兼首席执行官 主持人：Andrés Prada González
    制造业质量检验流程如果能实现自动化、实时化和标准化报告，将提升企业绩效。通过引入深度学习，我们使质量检验流程能够灵活适应同一行业内的不同产品，从而改善最终业绩。TUBA
    AI 机器视觉工具包可开箱即用。


    [DevisionX](https://devisionx.com/) 利用机器视觉和人工智能的结合构建质量检验系统。我们开发了一款开箱即用的 AutoML
    工具，可部署在云端或本地。它通过处理相机生成的数字图像和视频等数据来识别物体，为制造业中的二维和三维质量检验提供端到端解决方案。我们在整个价值链中提供更强大的识别率、更高的生产力、更可靠的识别、分配和处理更广泛物体的能力。将人工智能添加到机器视觉中
    机器视觉通常提供基于图像的自动检验、分类和机器人引导。在制造业中，此类系统通常基于操作员工作站、相机单元、照明和标记设备。机器视觉旨在从图像中提取信息以实现自动化操作。


    机器视觉优于人工检验，且通常成本更低。它解决了制造业中长期存在的废品和浪费问题。然而，它并未充分解决产生大量数据并从中学习的机会。如果你将用于图像处理的计算机视觉算法加入其中，你的系统将在更高准确度下不断改进。当然，这需要投资于实时数据管理。然而，即时的好处包括数据驱动的报告和洞察，以及质量检验的标准化。


    这种将人工智能添加到机器视觉中的简化表述，清楚地说明了机器视觉的僵化方法与你通过人工智能所能实现的更全面、更灵活的模型之间的区别。制造业中的应用案例 大型制造组织的彻底质量检验非常依赖数据。例如，通用汽车部署了
    2000 多台智能相机，每天进行 200 多万次检验，产生超过 100 万个数据集上传。高数据量带来挑战，例如，你需要改进图像压缩以进行存储，同时不影响数据质量和模型准确性。


    自动化质量检验在制造业中具有广泛的适用性。以下列表让你了解其范围：\- 食品和饮料：按大小、颜色、质量分类；代码数据符合性；计量和包装安全 \- 制药：各种追踪与追溯应用，印刷、艺术品和包装检验
    \- 汽车：焊接、涂层、车身部件、装配检验；体积计量 \- 电子：元件、装配过程和包装检验 \- 塑料和金属：表面检验；厚度和尺寸计量。


    # 使用 TUBA 进行 AutoML


    鉴于最近的进步，制造商可以快速部署用于质量检验的 AutoML 解决方案。让我通过将其与传统工作流程进行对比来介绍 AutoML 的概念。


    “我相信，像 TUBA 这样的工具将在不久的将来成为各行各业异常检测或质量检验的基础。与其在公司内部组建数据团队，不如收集图像，指出问题，然后让 TUBA
    处理最复杂的任务。” Andrés Prada González，计算机视觉工程师


    传统 ML 流程 vs AutoML 流程 ![传统 ML 流程 vs. AutoML 流程](img/Image00006.jpg)


    如果你使用 TUBA 设置或增强机器视觉，那么你的相机将继续拍摄图像，这些图像现在将用于模型训练的标记。典型操作将包括图像的分类、检测和分割。通过测试仪表板，你可以不断上传图像并提高模型准确性。TUBA
    模型可以轻松与不同类型的软件和硬件集成。质量和生产工程师可以自行使用 TUBA。来自问答“如果 TUBA 使机器视觉系统能够使用先前收集的数据来使用深度学习模型，那么你如何进行数据标记？”“TUBA
    用户有一个工具可以自行标记图像。”


    “部署此类系统的主要挑战是什么？”“你需要拍摄每秒超过 120 帧的相机，特别是针对高速生产线，所需的计算能力可能成本高昂。”


    “从客户角度来看，使用无代码 AutoML 和向系统提供商请求解决方案的主要区别是什么？”“我们根据客户的需求，通过不同的部署和模块化选项为每位客户定制 TUBA，并且我们很乐意让他们能够自行使用它。”


    “提交数据后，模型部署需要多长时间？”“这可能因行业和企业而异，但平均需要 3-4 天。”


    在 [`tuba.ai/`](https://tuba.ai/) 申请 TUBA Beta 访问权限


    # 研究应用定义新行业


    在乌伯巴黎先进技术中心实现城市航空自动化 Dr. François Sillion，乌伯 ATCP 主管 采访者：Dr. Chris Armbruster，AI
    Guild


