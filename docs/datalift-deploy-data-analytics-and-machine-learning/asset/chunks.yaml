  trans: '


    预测质量提高了 7%。在投产的第一年，神经网络节省了 1% 的电网损耗覆盖费用，即 70 万欧元。


    ## 成功因素


    Elia Group 如何在未来的用例中复制成功？


    首先，完全访问所有公司数据。我们可以开发自己的用例，并访问所需的任何数据。


    其次，OpenShift 敏捷应用平台。它提供易于部署以及明确的所有权和责任：平台负责为在其上运行的所有应用提供足够的计算能力。但至于单个应用，则由部署该应用的部门和个人负责。无需等待他人。


    Elia Group 成立了 AI Center of Excellence，这是一个为数据科学提供最佳实践、研究支持和培训的设施。该中心从三个方面提供帮助。


    人才专长：所有员工都可以获得所需的技能培训。


    工具支持：确保访问数据、编码平台和部署工具。


    流程编排器：协调所有部门的战略和创新，以在 AI 业务目标上达成一致。


    来自问答“你们的团队构成如何，他们从何处获得使用数据和部署平台的专业知识？”“大多数团队成员是具有 R 和 Python 背景的分析师。他们与数据科学家合作，学习如何首次部署。”


    “团队是否优化和扩展了神经网络？”“已有更新，团队更改了架构并添加了功能。”


    “你们如何对模型输出进行合理性检查并监控输入分布是否变化？”“预测每天都会进行实时比较，因为我们知道在电网损耗覆盖费用上花费了多少。”


    如需联系 AI CoE，请发送邮件至 `artificialIntelligence@eliagroup.eu`


    ## 为您的业务实现 #datalift


    您可以通过成为 AI Guild 成员、请 AI Guild 专家评估用例，以及与 AI Guild 合作推动数据分析和机器学习的部署，帮助欧洲和您的业务打破概念验证循环。


    ### 作为成员加入 AI Guild


    [AI Guild](https://theguild.ai) 是推动 AI 采用的数据和业务专业人士的首选社区。我们是数据分析、数据科学、数据工程、机器学习、深度学习、NLP
    和计算机视觉专家的实践社区。AI Guild 拥有 150 多名成员，担任技术负责人、首席数据官、数据负责人、首席数据科学家、训练营主管、大学教授、业务架构师和创始人等领导职务。所有成员都可以直接联系其他所有成员，以协作、讨论技术话题、交流经验，并在该领域寻找新机会。成员聚集在一起，例如：


    *   每月成员在线聚会，

    *   开展数据职业导向网络研讨会和研讨会，以及

    *   举办 #datalift 活动系列并展示生产环境中的用例。


    成员有权享受长期职业支持服务，例如求职支持、辅导和专业认证。如需加入社区，请通过网站 [theguild.ai](http://www.theguild.a)
    申请。


    ### 请 AI Guild 评估您的用例


    您的业务有概念验证，或者只是有数据，并希望获得一些验证？AI Guild 专家可以快速有效地帮助您。在不到 30 天内，我们可以评估您的数据基础设施、用例架构和部署场景的现状。我们将与您合作，了解您的选择，并为将数据分析和机器学习投入生产设计可执行的路线图。


    ### 在 AI Guild 支持下推动数据分析和机器学习的部署


    您的业务有意愿和资源进行部署，并在前进过程中希望获得额外支持和洞察？AI Guild 可以与您的业务合作，为您的数据基础设施、用例架构和解决方案的部署实施实际解决方案。请通过
    [LinkedIn](https://www.linkedin.com/in/daniameira/) 或 email 联系 AI Guild #datalift
    负责人 Dânia Meira。


