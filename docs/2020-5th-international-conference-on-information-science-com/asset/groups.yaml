    # Survey of the Image Recognition Based on Deep Learning for Autonomous Driving


    Jinqiao Liu

    Department of Mechanical Engineering

    Sichuan Pittsburg Institute, Sichuan University

    Chengdu, China

    Corresponding author: 15106980@qq.com


    # II. DEEP LEARNING


    Abstract—Recently, autonomous driving is a hot of research and image recognition
    technology is one of the keys technologies for autonomous driving to solve the
    road. The development of artificial intelligence and deep learning has been widely
    applied to image recognition technology, and it plays an important role in this
    field. In this paper, the development of image recognition in autonomous driving
    and deep learning are introduced. Different types of deep learning networks like
    Recurrent Neural Network (RNN), Deep Neural Network (DNN), Convolutional Neural
    Network (CNN) are also analyzed. In addition, the theoretical basis of deep learning
    in image recognition is carried out. Finally, the paper will look into the future
    of autonomous vehicles and the future of image recognition technology. It is concluded
    that image recognition has been widely used in autonomous driving cars, and it
    has a prospective future for further development.


    Keywords—autonomous driving; deep learning; image recognition; deep neural network;
    recurrent convolutional neural network


    # INTRODUCTION


    The development of autonomous driving is becoming more and more popular. At present,
    the research on self-driving cars includes many aspects, which are perception,
    decision making and control. The most basic requirement for autonomous driving
    car safety is that it can recognize different objects or environment during the
    driving. To achieve this, the computer of autonomous driving cars needs to be
    able to recognize the image. The development of image recognition technology has
    witnessed several challenges, such as object detection and object recognition.
    Researchers introduced artificial intelligence''s neural network into image recognition
    technology. The neural network method can be used to learn pattern and complex
    information, under background knowledge and unclear resolutions, also allow the
    sample to handle large data and distorted image [1]. This paper proposes a variety
    of neural network models like RNN, DNN, and CNN. These models have greatly promoted
    the image recognition technology. This paper will conduct a survey on the current
    research in the field of image recognition and explore the development of image
    recognition technology in autonomous driving cars.


    Deep learning is a heated topic in the field of artificial intelligence research,
    and the purpose of deep learning is to learn the internal rules of data, and the
    information obtained in the process is of great help interpret text, image data.
    The ultimate goal of deep learning is to make machine or computer as learning
    capable to be able to recognize data as text, images and sounds.


    Deep neural network consists of an input layer, more hidden layers and an output
    layer. The architecture of artificial networks was first proposed in 1943 by McCulloch
    Walter Pitts and W. McCulloch. For the time they used mathematical models to theoretically
    the models in artificial neural networks, which initiated the research of artificial
    neural networks [2]. In 1955, a famous artificial intelligence expert F. Rosenblatt
    proposed artificial neural network model, and Hebb learning rule or least square
    method is proposed to train parameters.


    ![](img/065e6ca5f3c06bda14dfa320bcc44def_0_0.png)


    In 1960, based on the traditional percept, Jeffrey Hinton (University of Toronto,
    Canada), the founder of deep learning, adopted the depth of multiple hidden layers
    to replace the single-layer structure of percept [3]. Since then, a multi-layer
    neural network structure has become the most classical neural network structure
    in deep learning.


