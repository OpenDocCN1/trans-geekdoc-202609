    # VI CONCLUSION


    In the future, autonomous driving cars will inevitably become the mainstream of
    society and bring more convenience for people''s life. Computer, vision and image
    recognition technology are research fields. For now autonomous driving technology
    is very far from image recognition. Image recognition also has many technical
    difficulties, which could not be solved right now, such as extremely large and
    small amount of data processing. Memory network is the most promising tool for
    image recognition. Specifically, convolutional neural network and recurrent neural
    network, researchers should study the status of these two neural networks and
    how to combine them in environment. This will significantly improve the current
    image recognition effect. Meanwhile, researchers should focus on unsupervised
    learning, too. At present, supervised learning is the mainstream of image recognition,
    but autonomous driving cars need a lot of manpower and time, however, there is
    still a long way to go in image recognition.


    The field of image recognition has developed rapidly in recent years, but there
    are still many problems need to be solved. A major problem is how to get the computer
    to understand the whole scene. Gaining a broader understanding of the scene will
    help the computer interact with the environment, as these applications require
    function from other information than object detection


