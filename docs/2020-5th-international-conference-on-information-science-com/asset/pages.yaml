    Layer does feature extraction, there will still be a lot of data. At this time,
    the pooling layer is needed to filter the feature data extracted from the convolutional
    layer, thus simplifying the amount of computation and data that needs to be processed.
    There are many ways for pooling, and the first and most common way is Lp pooling.
    Lp is a kind of pooling model inspired by the hierarchical structure in visual
    cortex, the formula for this kind of pooling is:


    ```

    $A(i, j) = \left( \sum_{(m,n) \in \mathcal{N}(i,j)} X(x_i+m, x_j+n) \right)^{p}$

    ```


    For this formula, p is a prescribed parameter. When p approaches infinity, Lp
    is called max pooling. The image recognition process can be completed by importing
    the data into the connection layer for processing.


    # IV. RECOGNITION IN AUTONOMOUS DRIVING CARS


    ReLU, Rectified Linear Unit, is usually used in convolutional neural networks.
    This activation function has advantages such as no gradient disappearance, fast
    convergence rate, and backpropagation calculation rate. Similarly, activation
    function also has a disadvantage, which is easy to fail during the training[11].


