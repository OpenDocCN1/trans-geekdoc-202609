    # ### III. DEEP LEARNING IN IMAGE RECOGNITION


    A. Theoretical Basis


    The image recognition task is not suitable for traditional artificial neural network
    because there is a large amount of data we need to be processed. For example the
    image we need is with 300*300*3 wide, 300 high, 3 colors), which means we need
    300*300*270 neurons to process this image. Otherwise, if we process this image
    with 270 neurons fully connected, we will encounter error


    be considerable And it is going to increase the workload tremendously. Therefore,
    researchers usually have a convolutional neural network for image processing and
    recognition tasks.


    A complete neural network consists of convolution layer, pooling layer and fully
    connected layer. Meanwhile, the pooling layer and convolution layer can greatly
    simplify the number of neurons involved in image processing and recognition.


    | Input Image | 3 Feature Maps | 3 Feature Maps | 5 Feature Maps | 5 Feature Maps
    | Output Layer |

    |---|---|---|---|---||

    | | Convolution | Pooling | Convolution | Pooling | Fully Connected Network |


