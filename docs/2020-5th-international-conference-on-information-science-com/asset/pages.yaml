    If a car wants to run normally on the road, it must have the ability of imaging
    recognition. Currently, this technology is still under development. It is divided
    into active image and passive image recognition. Active image recognition is based
    on conventional radar, the latter is similar with camera stereo images, but it
    is invalid for planar images. Radar technology has technical defects. Simultaneously,
    this system is complex and expensive. Passive image recognition is widely and
    gradually establishing 3D recognition capability, which is equivalent to the bipolar
    recognition effect of human eyes. More deep learning network serves for the latter
    passive recognition network[1].


