    CNN, convolutional neural network, is one kind of deep learning network. It is
    a feed-forward neural network with deep structure including convolution computation[5].
    Meanwhile, CNN is widely used in image recognition and object recognition which
    can conduct supervised and unsupervised learning. The origin of the CNN can be
    traced back to 1979, when a Japanese scholar design a network modeled on a visual
    cortex of a living organism. But in 2006 that the properties of the convolutional
    neural network received widespread attention[6].


