    ABSTRACT: After the domestic new crown pneumonia (COVID-19) epidemic has stabilized,
    the imported people and goods carrying the virus may lead to a slight rebound
    in the domestic epidemic. Using this model, the second epidemic situation in a
    city was simulated. The impact of the epidemic’s spatial spread and quantitative
    growth was analyzed using the closure and control measures at different spatial
    scales (community closure and control, district and county closure and control).
    The study results show that the first 3 to 5 days after the appearance of an infected
    person is the best time for containment and control. The effects of the two modes
    are similar, so they are suitable for dealing with the single-point burst mode.
    Combined with the analysis results, suggestions are made for formulating closure
    and control measures after the epidemic rebounds.


    # 1 INTRODUCTION


    New coronary pneumonia (COVID-19) is a respiratory infectious disease caused by
    the new coronavirus SARS-COV-2, which has the characteristics of solid transmissibility
    and a long incubation period (Cui et al. 2021). In December 2019, a large-scale
    outbreak of COVID-19 occurred in Wuhan, China, and then swept the world, causing
    massive casualties and economic losses. As the domestic epidemic has stabilized,
    cities have begun to resume production and life. Currently, the growth forecast
    of the COVID-19 epidemic and the evaluation and analysis of epidemic prevention
    policies are mainly conducted through modelling analysis (Tian et al. 2015), which
    are based on group or individual models. Other statistical models or machine learning
    models to predict the growth of the epidemic and evaluate policies, such as (Claude,
    Perrin and Ruskin 2009) constructed the SEIR model to predict the turning point
    of the COVID-19 epidemic in Wuhan, (Huang et al. 2007) created a SIQR model to
    evaluate the prevention and control policies during the COVID-19 epidemic in Shenzhen.
    Then conducts epidemic prediction and policy evaluation, such as in (Xie et al.'
