    ABSTRACT: Lightweight convolutional neural networks are being studied further
    in order to better deploy deep convolutional neural networks to edge devices,
    minimize the number of model parameters in deep neural networks, and reduce network
    complexity. On accomplish the lightweight goal, the full convolution is performed
    to the remaining network structure. To increase the light effect, it is merged
    with point-by-point convolution to build an improved dilated convolution lightweight
    approach. The enhanced dilated convolution is coupled with conventional convolution
    to lessen the attenuation of accuracy, and a light-weight fusion dilated convolution
    is presented. The improved dilated convolution light approach offers the most
    substantial lightweight benefit, according to the data. Furthermore, the lightweight
    fusion dilated convolution approach decreases the amount of model parameters and
    offers the best speed-accuracy trade-off.


    # 1 INTRODUCTION


    There have been two development trends in convolutional neural networks in recent
    years. On the one hand, it develops in the direction of large-scale and deep-level
    development; on the other hand, it grows in the order of light and high speed.
    With the rapid growth of the mobile Internet, people''s demand for mobile edge
    devices is getting higher and higher, and there are more and more demands for
    lightweight convolutional neural networks. Running deep learning algorithms more
    smoothly on edge devices has become a challenge. Edge devices have little storage
    space and lack computing resources, which provide broad research and development
    platform for the lightweight method of convolutional neural networks. Atreus convolution
    was first systematically studied by (Zhu et al. 2020). The primary Atreus convolution
    light method applies aurous convolution directly to the network structure design,
    which has an excellent lightweight effect and slightly higher accuracy loss; the
    improved Atreus convolution lightweight method combines point-by-point with Atreus
    convolution.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# # 2 RELATED WORK


    Refinement of the model design to achieve a lightweight neural network is often
    achieved by using small convolution kernels instead of large convolution kernels,
    decomposing convolutions, and processing convolution channels (Yu et al. 2019).
    Modern deep neural networks usually use small convolution kernels instead of large
    convolution kernels for network design (Zhang et al. 2018). Squeeze Net is the
    earliest public lightweight structure design network. On the one hand, 1 × 1 small
    convolution kernels are used instead of 3 × 3. As a result, the kernel can reduce
    eight times the amount of convolution operation parameters and a large part of
    the convolution operation (Zhang, Zhang and Wang 2019). Shuffle Net uses the idea
    of grouping convolution and shuffles the feature information from different groups
    so that the feature information of the convolution after grouping is scrambled
    and mixed, which can be better circulated (Risso et al. 2021). The above model
    refinement method realizes a new high-efficiency backbone network by redesigning
    the macro-structure and micro-structure of the model and completes the lightweight
    design of the neural network from the structural level (Guo et al. 2021).


    # ## 3 LIGHTWEIGHT METHOD OF NEURAL NETWORK BASED ON ATROUS CONVOLUTION


    # ### 3.1 Atrous convolution structure


    Whole convolution is a convolution with a unique structure, which introduces the
    concept of holes. By adding holes to the traditional image convolution, the purpose
    of expanding the convolution receptive field is achieved. For example, let H_i
    be the feature map of thei-th layer and G_i be the convolutional layer of the
    i-th layer. Then, the point in the feature map H_i, b is the point in the convolutional
    layer G_i,


    ```

    (H_i * G_i)(q) = \sum_{b+c=q} H_i(b)G_i(c)  \quad (1)

    ```


    The whole convolution calculation formula is shown in Equation (2), where m is
    the expansion rate, and one is added to the number of holes added by ordinary
    convolution. When the dilation rate m is 1, the atrous convolution becomes a regular
    convolution.


    ```

    (H_i * G_i)(q) = \sum_{b+mc=q} H_i(b)G_i(c)  \quad (2)

    ```


    It can be seen from the calculation formula of whole convolution and ordinary
    convolution that the whole convolution operation has the characteristics of equal
    interval sampling, and the expansion rate determines its sampling degree. The
    larger the expansion rate, the more extensive the whole convolution sampling range
    and the piece within the unit range has fewer points. The calculation formula
    of the receptive field is formula (3)—the stride of the i-layer convolution.


    ```

    sf_l = sf_{l-1} + (\eta_l - 1) * \prod_{i=1}^{l-1} t_i  \quad (3)

    ```


    The whole convolution expands the receptive field without reducing the size of
    the feature map. Therefore, the calculation formula of the kernel size em_l of
    the whole convolution of the lth layer is as formula (4), where m_l represents
    the kernel size of the original ordinary convolution of the lth layer.


    ```

    em_l = m_l + (m_l - 1) * (n - 1)  \quad (4)

    ```


    Substituting Equation (4) into Equation (3), the receptive field of the whole
    convolution kernel with the size of em_l in the lth layer for the expansion of
    the standard convolution'
