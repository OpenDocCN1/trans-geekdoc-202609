- pgno: 17
  md: '# # Why multilayer networks are needed for complex data analysis


    ![](img/9eefc6d2972274efeb1680c6a31895e5_17_0.png)


    Upendranatha Sharma Chakravarthy

    Professor, The University of Texas at Arlington


    ABSTRACT: We are on the cusp of holistically analyzing a variety of data being
    collected in every walk of life in diverse ways. For this, current analytics and
    science are being extended (Big Data Analytics/Science) along with new approaches
    to benefit humanity at large in the best possible way. These warrants developing
    and/or using new approaches, technological, scientific, and systems, in addition
    to building upon and integrating with the ones that have been developed so far.
    In the first part of the presentation, we introduce multilayer networks (or MLNs)
    and illustrate their elegance for modeling complex data sets from well-known applications
    (IMDb and DBLP). Flexibility of analysis comes from this approach to modeling.
    We will show a dashboard that we have developed for MLN analysis. In second part
    of this talk, we discuss situation analysis on videos using a novel approach.
    We extract contents and apply stream processing techniques. This approach has
    the potential to process videos in real-time and raise alerts for situations,
    such as Nancy Pelosi’s house break-in and Las Vegas shooting.


    BIO: Prof. Chakravarthy is Professor of Computer Science and Engineering Department
    at The University of Texas at Arlington. He is an ACM Distinguished Scientist
    and an ACM Distinguished Speaker. He is also an IEEE Senior Member and was instrumental
    in establishing the Information Technology Laboratory at University of Texas at
    Arlington. Prof. Chakravarthy has also established the NSF funded, Distributed
    and Parallel Computing Cluster at UT Arlington. His current research includes
    big data analysis using multi-layered networks, stream data processing for disparate
    domains (e.g., video analysis), scaling graph mining algorithms for analyzing
    very large social and other networks, active and real-time databases, distributed
    and heterogeneous databases, query optimization (single, multiple, logic-based,
    and graph), and multi-media databases. He has published over 200 papers/book chapters
    in refereed international journals and conference proceedings. He has supervised
    15 PhD theses and 100+ MS thesis. He has published over 200 papers and book chapters
    in refereed international journals and conference proceedings. He is listed in
    Who’s Who Among South Asian Americans and Who’s Who Among America’s Teachers.
    Prior to joining UTA, he was with the University of Florida, Gainesville for 10
    years. Prior to that, he worked as a Computer Scientist at the Computer Corporation
    of America for 3 years and as a Member, Technical Staff at Xerox Advanced Information
    Technology, Cambridge for a year. Prof. Chakravarthy received his B.E. degree
    in Electrical Engineering from the Indian Institute of Science Bangalore and M.Tech
    from IIT Bombay, India. He worked at the Tata Institute of Fundamental Research
    Bombay, for a few years and received his M.S. and Ph.D degrees from the University
    of Maryland in College park.'
