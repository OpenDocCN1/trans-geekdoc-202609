    # 4.4 Support vector machine algorithm


    The SVM method has a kernel and linear sections. SVM can solve classification
    and regression problems. SVM is better at finding deep patterns in complex datasets
    than other methods. For classification, we calculate the characteristic-based
    hyperplane that separates the two classes. Hyperplanes categorize decision boundaries.
    Comparing data points on opposing sides of the plane reveals distinct types(Colomban
    2013b).


    Support vector machines aim to maximize data point-hyperplane margin(Rincy and
    Gupta 2020).


    Linear equation: y = a + b. We obtain ax1x2 + b = 0 if we replace x with x1 and
