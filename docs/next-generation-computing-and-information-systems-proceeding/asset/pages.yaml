- pgno: 54
  md: 'hence, it had little vegetation in 2015. However, with determination, community
    participation, and afforestation projects, the green cover was reclaimed in the
    2021–2022. The variation observed over these years is a perfect fit for quantitative
    forecasting techniques needed by AI/ML models. The dataset used in this study
    is the standard Landsat-8 Collection 1 Tier 1 8-Day TOA Reflectance Composite
    product[12]. The Landsat data products are organised into different collections.
    Collection 1 represents the first systematic processing of Landsat 8 data, following
    specific standards to ensure consistency and accuracy. The USGS provides Landsat
    data in different processing tiers. Tier 1 products are top-of-atmosphere (TOA)
    reflectance, which means the data represents the raw measurements of the amount
    of light reflected by the Earth''s surface before any atmospheric correction.
    The data is composited over 8 days. Instead of providing single images, the USGS
    creates a composite image by combining data from multiple cloud-free scenes acquired
    during an 8-day window. Top-of-atmosphere (TOA) Reflectance is the amount of sunlight
    reflected by the Earth''s surface, measured at the top of the atmosphere. This
    metric is valuable for comparing surface reflectance values across locations and
    dates. This 8-day composite is particularly useful for monitoring changes in land
    cover and vegetation over time, as it minimises the impact of cloud cover and
    atmospheric effects that can obscure the Earth''s surface in individual images.


    The image extraction was done using LANDSAT/LC08/C01/T1_SR with cloud coverage
    per cent at 20, and the images were extracted from 2013 to 2023. This typically
    means that the images were obtained from the satellite on the days when cloud
    coverage was less than 20% using the bands B4 and B5. Figure 1 compares the image
    of the village from 2013, when it was barren, to 2022 when part of the land was
    restored. From every image, the NDVI value was extracted and interpolated monthly
    to retrieve more consistent data around the period.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_54_0.png)


    Figure 1. Satellite Image of Katoria in 2013(left) vs. 2022(right).


    The different features seen in the 3-band satellite image of the Katoria region
    are extracted using the NDVI. Based on the distinctive reflectance patterns of
    green vegetation, vegetation indices enable us to define the distribution of soil
    and vegetation. The NDVI is a straightforward numerical indicator that may be
    used to evaluate remote sensing data from a remote platform and determine whether
    or not the target or object being examined has live, green vegetation. The NDVI
    is determined using equation 4, where NIR stands for near-infrared reflectance,
    and RED is for visible red reflectance.


    ```

    RNDVI = (NIR - RED)/(NIR + RED)       where 0 < NDVI < 1          (4)

    GNDVI = (NIR - GREEN)/(NIR + GREEN)   where 0 < NDVI < 1

    ```


    Rock, sand, or snow-covered deserts correspond to very low NDVI values (0.1 and
    lower). High numbers denote temperate and tropical rainforests (0.6 to 0.8), whereas
    moderate values imply shrub and grassland (0.2 to 0.3). Water bodies are represented
    with negative NDVI values, while bare land is represented by NDVI values that
    are closest to 0 (Montgomery et al. 2015).'
