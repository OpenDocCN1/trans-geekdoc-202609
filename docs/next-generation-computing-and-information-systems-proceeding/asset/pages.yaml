    # 4 CONCLUSION


    In the current pulse diagnosis objectification research, most of the analysis
    methods such as time domain and frequency domain are used, ignoring the nonlinear
    characteristics of pulse signal. Considering the nonlinearity of pulse signal,
    using nonlinear dynamics method to study pulse signal, compared with traditional
    methods, it can better tap its inherent non-linear information. First, the pulse
    signal is converted into a threshold-free recursive map to retain more detailed
    features in the pulse signal. Then a CNN is set up to perform feature self-learning
    & training on the threshold less recursive graph to obtain a pulse signal classification
    model. At last, the classification and recognition of the pulse signal is carried
    out. The experimental results reveal that the pulse signal recognition the proposed
    method is effective, and can obtain higher classification accuracy than the current
    pulse signal classification methods. In the future work, we will further study
    the signal analysis method that can better represent the characteristics of pulse
    signal, and combine deep learning to improve the recognition rate of pulse signal.


