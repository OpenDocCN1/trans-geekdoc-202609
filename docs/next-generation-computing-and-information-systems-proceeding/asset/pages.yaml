    that user data is not stored on third-party cloud servers and used in an unauthorised
    manner, while edge services with TinyAI build intelligence by analyzing user data
    devoid of any PII, ensuring privacy. The user data is stored internally on the
    user’s personal cloud and managed as per user requirements. Thus, the user gains
    control over how her data is collected, analyzed and consumed while delivering
    the required personalized services. The present work addresses the significant
    challenge of delivering personalization with privacy which systems catering to
    individual users, such as the PIoT, need to address going forward. Future work
    in the domain will need to focus on:


    +   - Exploring federated learning, secure multiparty computation, and differential
    privacy in the context of PIoT.

    +   - Investigating resource management strategies that dynamically allocate and
    optimize computing resources to meet the varying demands of edge-intelligence
    tasks in the PIoT.

    +   - Developing context-aware personalization techniques that leverage methods
    for capturing and utilizing contextual information, such as location, user behavior,
    and environmental factors, to provide personalized services in real-time for an
    entire family of users and even guests.

    +   - Exploring the integration of machine learning, deep learning, and reinforcement
    learning algorithms for adaptive and context-aware personalization in the PIoT.


