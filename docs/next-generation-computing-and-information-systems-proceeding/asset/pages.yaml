  md: '# # Collaborative attacks and defense


    ![](img/9eefc6d2972274efeb1680c6a31895e5_21_0.png)


    Bharat Bhargava

    Professor, Purdue University


    ABSTRACT: Ad Hoc Networks, especially Flying Ad Hoc Networks (FANETs), are becoming
    increasingly crucial in a variety of civil and military applications, including
    wild-fire monitoring and suppression, search and rescue operations in hazardous
    scenarios, and transport of supplies or personnel to remote locations. Going beyond
    protecting networks from single forms of attacks, the ongoing research work addresses
    collaborative attacks (CA) within these networks. A collaborative attack occurs
    when attackers synchronize their malicious actions against a target network. The
    collaboration can occur simultaneously, where multiple attackers attempt to compromise
    the system at the same time or split in time where one attacker gathers the information
    about the network and subsequently another attacker executes the actual exploit.
    There is a need to develop a systematic understanding of the threats imposed by
    collaborative attacks and formulate intelligent and effective defenses. In future,
    Machine Learning algorithms can be used to analyze large amounts of data to detect
    advanced threats and reduce false positives/negatives.


    BIO: Bharat Bhargava is a Professor of Computer Science at Purdue University and
    Fellow of IEEE and IETE. He led a Northrup Grumman sponsored consortium on Real
    Applications of Machine Learning (REALM) with MIT, CMU, and Stanford. He contributed
    to the Department of Defense on The Science of Artificial Intelligence and Learning
    for Open-world Novelty (SAIL-ON) project. He works with Sandia Corporation to
    maintain mission capabilities of the US Space Enterprise, Jet Propulsion Lab to
    predict attacks on space systems and Ford Corporation on software defined networking
    for V2V communication. Prof. Bhargava is a distinguished alumni of Indian Institute
    of Science and DAV college. He is also a recipient of eight best paper awards
    in various international computer science conferences. He has received the IEEE
    Technical Achievement Award and has also been awarded the charter Gold Core Member
    distinction by the IEEE Computer Society for his distinguished service. He is
    major thesis advisor of the very first African American woman to receive her Ph.
    D in the history of Computer Science department at Purdue in May 2019. He has
    served on the IEEE Computer Society on Technical Achievement Award and Fellow
    committees. Prof. Bhargava is the founder of the IEEE Symposium on Reliable and
    Distributed Systems, IEEE conference on Digital Library, and the ACM Conference
    on Information and Knowledge Management.'
