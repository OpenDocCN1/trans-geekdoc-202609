    # ## 3 SIMULATION EXPERIMENT ANALYSIS OF SEALING AND CONTROL AT DIFFERENT SCALES


    With the normalization of epidemic prevention, once the epidemic rebounds, the
    question of how to carry out closure and control to minimize the impact on urban
    operations begins to emerge (Rida et al. 2016). Set the impact of different containment
    and control scales on the growth of infected people and the spread of infected
    areas.


    # ### 3.1 Experimental scenario


    The experimental scenario is designed concerning the summer clustered epidemic
    in the city and the multi-point distribution scenarios in other areas. There are
    two types of systems: single-point burst and multi-point burst. The detailed settings
    are as follows:


    +   1) Single-point outbreak: Suppose there are 20 clustered cases in a particular
    place in District B of the city (the environmental entity number is 171911), and
    the initial state is set to E.


    +   2) Multi-point sporadic outbreak: Suppose there are 20 sporadic cases in 3
    districts of the city, and the locations of occurrence are not fixed in the districts,
    and the initial state is E.


    Among all model parameters, the value of the infection probability (see Section
    2.5 for details) is compared with the results of multiple simulations of the city''s
    summer cluster epidemic through the benchmark parameters, and the rate is set
    to 0.025 (Rida et al. 2016). The three scale scenarios are described as follows:


    +   1) No containment and control: After the outbreak began, the government did
    not issue any containment and control measures and only treated those who were
    sick promptly.


    +   2) Community closure and control: After the epidemic began, the government
    closed and controlled the building where the sick person appeared and the patient''s
    address and adjacent structures.


    +   3) District/county closure and control: After the outbreak began, the government
    launched a closure and power on the districts and counties where the sick person
    appeared. People in the closure and control areas were not allowed to go out at
    home, and all close contacts were quarantined.'
