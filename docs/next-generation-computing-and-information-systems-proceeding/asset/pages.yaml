- pgno: 9
  md: '# Preface


    It gives us immense pleasure to bring to you the proceedings of the 2nd International
    Conference on Next Generation Computing and Information Systems (ICNG CIS 2023).
    The second edition of the conference is taking place at MIET, Jammu after a gap
    of six years. The first edition of ICNG CIS was a milestone as it was for the
    first time that a computing focused conference was organized at Jammu. ICNG CIS
    2023 is bigger, better and more comprehensive than before.


    Papers were invited in different themes such as Artificial Intelligence, Machine
    Learning, Deep Learning, Internet of Things, Distributed Computing, Metaverse,
    Multimedia Processing, Networks, Information Security, etc. This year the conference
    proceedings are being published by CRC Press (Taylor and Francis) and will be
    submitted for potential indexing in Scopus. We received over 117 papers for the
    conference from diverse geographies and after a rigorous review process selected
    38 papers for final inclusion in the conference proceedings with an acceptance
    rate of 32.4%. With a focus on advances in computing and information systems,
    we intended for the conference to be a small one affording the participants deeper
    and more relaxed engagement with their peers and experts.


    The first keynote address was delivered by Prof. Sartaj Sahni, Distinguished Professor
    of Computer and Information Sciences and Engineering at the University of Florida,
    USA. The session stressed on the significance of the development of Fast Algorithms.
    Following this, second keynote address was delivered by Prof. Sitharama Iyengar.
    Prof. Iyengar serving currently as the Distinguished University Professor, Founding
    Director of the Discovery Lab and Director of the US Army-funded Center of Excellence
    in Digital Forensics at Florida International University, Miami, USA. The session
    emphasized on the rising era of Digital Forensics.


    The third keynote address was delivered by Prof. Chakravarthy, Distinguished Professor
    of Computer Science and Engineering Department at The University of Texas at Arlington,
    USA. Prof. Chakravarthy focused on the importance of development of Multi-Layer
    Networks for modelling complex datasets. The fourth keynote address was delivered
    by Prof. Arif Sarwat, Eminent Scholar Chaired Professor in the Department of Electrical
    and Computer Engineering and the Director of the Solar Research Facility and Energy
    Power Sustainability group at Florida International University, Miami, USA. The
    session focused on the Impact of Artificial Intelligence on High-Penetration Renewable
    Physical Infrastructure.


    The fifth keynote address was delivered by Prof. Bharat Bhargava, Professor of
    Computer Science at Purdue University, USA and Fellow of IEEE. The session focused
    on the systematic understanding of the threats imposed by collaborative attacks
    and formulate intelligent and effective defenses. The last keynote address was
    delivered by Prof. Ankur Gupta, Director, Model Institute of Engineering and Technology,
    Jammu. The session focused on building a safe and secure Metaverse.


    The conference served as a platform for the exchange of cutting-edge research
    and ideas in the field of next-generation computing and information systems. Attendees
    had the opportunity to engage with and learn from the diverse perspectives shared
    by presenters, fostering collaboration and knowledge dissemination among scholars
    and professionals. The active involvement of expert chairs further enriched the
    discussions, reflecting the conference’s commitment to advancing the discourse
    on emerging technologies and their implications on computing and information systems.'
