    # 3.3 CLAHE algorithm for X-ray image preprocessing


    The CLAHE algorithm, also known as contrast limited adaptive histogram equalization
    (contrast limited adaptive histogram equalization) (Gupta and Awasthi 2009), uses
    this method to process X-ray images, highlighting the image''s internal details
    and suppressing'
  merge: -1
