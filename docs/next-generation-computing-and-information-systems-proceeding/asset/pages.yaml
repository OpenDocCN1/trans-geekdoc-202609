    # 3 RESULTS AND DISCUSSION


    The paper conducts a thorough comparative analysis of three potential classifiers,
    including the decision tree, random forest classifier, and gradient boosting for
    the binary classification of True Positive (TP) and False Negative (FN) scenarios.
    Classifiers are evaluated based on their performance and outcome. Performance
    of the classifiers is thoroughly examined which contains confusion matrices, training
    and validation accuracy, and classification reports including precision, recall,
    F1-score, and support values for class of disease.


    # 3.1 Performance analysis of decision tree model


    Decision tree model performs admirably when it comes to disease prediction. The
    model adequately generalizes to new data without exhibiting over-fitting, as seen
    by the fact that both the training and validation accuracies are 78.57%. Notably,
    classes like “Diabetes” and “Tuberculosis” excel, scoring perfectly on F1-score
    tests for precision, memory, and performance. On the other hand, categories like
    “AIDS” and “Paroxysmal Positional Vertigo” also perform well, with good accuracy
    and recall. Some classifications like “hepatitis A” however display difficulties
    with a very low recall, indicating that the model may have trouble detecting these
    cases. Total weighted average F1-score for all classes comes in at about 0.77
    and offers a thorough evaluation of the model’s performance. The values for the
    classification report that includes accuracy, recall, and F1-score fora few classes
    are listed in Table 1.


    # 3.2 Performance analysis of random forest classifier


    Random forest classifier performs well in the classification of diseases when
    the parameter values (criterion=’entropy’, max depth=10, and max features=’sqrt’)
    are implemented. Training and validation accuracy are both commendable and about
    83.37%, showing that the model generalizes well with little or no over-fitting
    to the training set. When analyzing certain classes, the model excels at diagnosing
    diseases like “AIDS”, “Arthritis”, “Diabetes” and “Tuberculosis”, obtaining the
    highest possible accuracy, recall, and F1-score values. This displays the model’s
    incredible accuracy in identifying certain diseases. Model retains great precision
    and an adequate recall for classes like “Paroxysmal Positional Vertigo”,'
