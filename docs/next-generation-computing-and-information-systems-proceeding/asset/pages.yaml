    # 5 CONCLUSION AND FUTURE SCOPE


    In this study, we employ the CNN deep learning model to classify emotions based
    on EEG signals from 32 subjects in a public dataset. This paper makes use of a
    public dataset known as DEAP. An architecture model for a convolutional neural
    network with 80-20 train test ratio yields the greatest accuracy of 88.33% and
    with 75-25 train test ratio gives an accuracy of 88.12% on liking emotion. The
    model does rather well in generalizing findings for both splits, therefore the
    change in the train-test split little affects it. Figure 6 depicts the accuracy
    of training and validation, while Figure 7 displays the loss of training and validation.
    It is evident that our proposed method has produced superior results than other
    recent approaches. Deep learning models that are combined or concatenated may
    improve classification outcomes. A better result has been attained with our recommended
    methodology. Nevertheless, this proposed approach only addresses one deep learning
    model. In our upcoming research, hybrid CNN and LSTM models can collaborate on
    their respective strengths to improve the emotion recognition system’s accuracy.
