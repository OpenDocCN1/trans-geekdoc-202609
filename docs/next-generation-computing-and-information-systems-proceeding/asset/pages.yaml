  md: 'Finally, adding the mean \(\mu\) to the columns of \(A\) yields the approximate
    data \([a_1, a_2, \dots, a_n]\). Global linearity limits PCA effectiveness.


    Kernel PCA, also known as KPCA is an extension of PCA that incorporates kernel
    functions commonly used in support vector machines. It allows for the partitioning
    of data even if they are not linearly separable by leveraging a mapping technique
    called reproducing kernel Hilbert space. In KPCA observations are transformed
    into kernel matrices using the method:


    ```

    \(K = k(x, y) = \phi(x)^T \phi(y)\) (11)

    ```


    The kernel function, denoted as \(k(x, y)\) is used to evaluate the relationship,
    between observations \(x\) and \(y\). The reproducing kernel Hilbert space is
    where these observations are mapped by the function \(\phi\). Interestingly due
    to the kernel trick, there''s no need to explicitly compute this mapping function.
    Instead, we only need to calculate the kernel function.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_150_0.png)


