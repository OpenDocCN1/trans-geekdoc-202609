- pgno: 106
  md: 'The primary purpose of this study is to properly classify a single glass shard
    by its major component measurement. The K-Nearest Neighbor classifier(Mashael
    S. Aldayel 2012), one of the most popular data mining methods for Pattern detection
    and classification were the basis of our solution for the glass problem. Recent
    studies have compared voting to other single classifiers and found that it performs
    better than the rest (Rincy and Gupta 2020). In the Ensemble technique, each specified
    classification algorithm is trained on the dataset. Each model learns to make
    predictions based on the features (e.g., refractive index, chemical composition)
    and their relationships to glass types. After training, each model is used to
    predict from the dataset (Dong et al 2020; Rincy and Gupta 2020). These predictions
    represent the model''s assessments of the glass type for each observation. After
    that, soft voting is done in which the ensemble technique aggregates the projections
    from all individual models, and the predictions are combined in a weighted manner.
    The ensemble technique calculates a weighted average or combines the probability
    scores from the individual models. This weighted combination of predictions determines
    the final classification. The class with the highest weighted sum or the highest
    probability score is chosen as the ultimate classification for a given observation.


    # 2 RELATED WORKS


    In recent times, a significant amount of research has been conducted to investigate
    the possibility of different algorithmic methods to streamline the identification
    process of eye-glasses. This study contains machine-learning techniques applied
    to the same glass detection dataset, such as bagging, kernel density estimation,
    AdaBoost, and fuzzy clustering (Ruying and Rongcang 2009). One notable researcher
    (Pandey and Jain 2017), has used the K-nearest neighbors (KNN) technique as an
    approach to address this formidable job. The main goal of these initiatives is
    to improve the accuracy and precision level in the glass detection models. Accurate
    detection of glass is paramount across various applications, including automated
    quality control in industrial processes and security and surveillance systems.
    To accomplish this objective, scholars acknowledge the need to integrate additional
    classification algorithms into constructing the glass detection models(Cholakova
    et al. 2016). Integrating a K-closest neighbors (KNN) classifier with a feature-weighted
    nearest neighbor approach, based on the principles of a chi-square statistical
    test, is a successful strategy for improving its precision (Dino and Abdulrazzaq
    2019). This unique concept was proposed by the authors (Rincy and Gupta 2020),
    and it has the potential to considerably increase the performance of glass detection
    models based on the K-nearest neighbors method. This strategy, which assigns weights
    to features based on their relevance and importance, allows the classifier to
    prioritize the most valuable attributes of the input data, resulting in improved
    accuracy in glass detection. Including feature weighting into the K-nearest neighbors
    (KNN) method is theoretically sound. It has practical applications. Glass detection
    datasets sometimes include a profusion of information, some of which may need
    to be more relevant in distinguishing distinct glass types or states. The use
    of feature weighting, driven by statistical tests such as the chi-square test,
    may effectively discover and prioritize the most discriminatory characteristics,
    hence augmenting the prediction capabilities of the model (Oladipo et al. 2020).
    Moreover, it is crucial to underscore the utmost importance of ensuring the precision
    and validity of the findings derived from these scholarly pursuits. The precise
    categorization of glass has significant consequences for practical applications
    in the real world. In a manufacturing setting, accurately identifying and classifying
    various kinds of glass helped optimize quality control procedures, resulting in
    fewer faults and lowered production costs. In security and surveillance, the precise
    detection of glass may significantly enhance the efficacy of recognizing possible
    security risks or criminal activities (El-Khatib, Abu-Nasser and Abu-Naser 2019).'
