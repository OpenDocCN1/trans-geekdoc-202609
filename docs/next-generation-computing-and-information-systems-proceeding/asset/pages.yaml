- pgno: 70
  md: 'The major sub-systems of the Proposed framework are:


    # ### 3.1 User environment


    In the Personal Internet of Things (PIoT) architecture, the user environment characterizes
    the entire sensing, analyzing and computing environment in the context of an individual
    user and her immediate family. This environment comprises a multitude of sensors
    ranging from wearables to smart devices, smart home sensors, appliances/gadgets,
    connected vehicles, connected devices, connected healthcare and ambient intelligence
    as shown in figure one. Thus, sensor diversity is a major characteristic of the
    PIoT environment. Till sensor inter-operability and open standards for sensor
    data become pervasive across the industry, solutions for catering to specific
    sensor types and data formats need to be devised. The proposed PIoT architecture
    caters to this need by positioning an array of low-cost edge devices (some with
    GPU capabilities), catering to each sensor type. These edge devices receive, filter,
    perform inferencing based on TinyAI algorithms and send the filtered data for
    further processing at the personal cloud. The personal cloud is a collection of
    services without storing any persistent data, since the data storage is managed
    by the end service providers. For instance, smart phone data is managed by the
    phone providers cloud or a public cloud, while connected vehicle data will be
    managed by the vehicle providers servers. In some cases the edge devices may directly
    invoke edge cloud services hosted at the Service Cloud, for instance in the case
    of an emergency or as part of application logic or where data storage in the personal
    cloud is not needed. For example in the case of CCTV monitoring an crime detection,
    only the frames of interest may be shared with the cloud services for storage
    and evidence, while a majority of the frames with no point of interest can be
    filtered and dropped at the edge device. This obviates the need of persistent
    storage for many applications and it is entirely possible to attain a completely
    serverless model for the PIoT in the near future.


    # ### 3.2 Cloud service environment


    The cloud service environment delivers the service aspect of the PIoT and houses
    edge services for delivering performant services to multiple PIoT users by optimizing
    the service latency and response times. Only when major processing is needed and
    records need to be maintained are core cloud services invoked and provisioned.
    Clearly, the focus is on off-loading a majority of the computation and data traffic
    to the edge while reducing the traffic flow between the user environment and the
    cloud core services, till possible. The personal cloud hosts the engines responsible
    for service invocation as required, AI Engine for applying AI models to data for
    hyper-personalization needs and an analytics engine to make sense of data and
    take actions based on analysis of received data.


    # ## 4 SIMULATION RESULTS


    AWS IoT platform to simulate multiple IoT devices and generate data streams based
    on real-world data, with the following steps:


    +   * User Scenarios: 3 user scenarios were considered requiring data analysis
    and further actions to be taken based on the data by interacting with external
    third-party services as per configured rules.

    +   * IoT Devices: 25 virtual IoT devices were simulated for smartwatches, phones,
    wearables, and other sensors such as fire/smoke detectors, smart devices, garage
    doors, CCTV cameras and the like, using the AWS IoT Device Simulator to generate
    data streams based on real-world sensor readings. All sensors were configured
    to collect readings every 5 minutes, except for CCTVs which send a fixed size
    data stream continuously.'
