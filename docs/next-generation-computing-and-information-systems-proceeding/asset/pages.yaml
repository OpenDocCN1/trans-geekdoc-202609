    metaverse platforms. While data from the main blockchain is synced periodically
    with the forked chains, the data from the forked chain to the main chain is committed
    only when the associated smart contract is in “active mode”. In “passive mode”
    the smart contract performs a dummy transaction on the forked chain to return
    the indicative result to the parties involved in the transaction. This feature
    is useful from a testing perspective. The Service-Access End Points (SEP) hosted
    by a metaverse platform are authenticated and issued authentication tokens which
