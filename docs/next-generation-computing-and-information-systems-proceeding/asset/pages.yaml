    # 3.1 Normalization


    Normalisation is performed to standardise features, ensuring they have a similar
    scale. This procedure enhances both the performance and training stability of
    the model. Normalising a dataset minimises redundancy and ensures that only relevant
    data is stored. In few deep learning research, normalisation has been a dynamic
    area of study. Let''s underscore a few advantages of incorporating normalisation,
    including significantly reducing training time (Batch Normalization: Theory and
    How to Use It with Tensorflow | by Federico Ceccia | Towards Data Science, n.d.).


    Occasionally, a feature''s value may be significantly higher than that of its
    surrounding features. In this procedure, we normalise every feature to ensure
    its preservation. We are creating objectivity in our network by doing this. Normalisation
    reduces the shift in the internal covariate. Covariate shift refers to the variation
    in the activation network''s distribution caused by network parameter changes
    throughout the model''s training process. To improve training, we must reduce
    the Internal Covariate Shift. Normalisation preserves the features but eliminates
    the sharp feature. Normalisation accelerates optimisation by preventing weights
    from exploding and limiting them to a certain range. One unintentional benefit
    of normalisation is that it aids CNN in regularisation, albeit marginally not
    significantly.'
