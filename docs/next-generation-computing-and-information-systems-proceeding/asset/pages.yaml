- pgno: 15
  md: '# Global cooperative digital forensics in the era of artificial intelligence


    ![](img/9eefc6d2972274efeb1680c6a31895e5_15_0.png)


    S. Sitharama Iyengar


    Professor, Florida International University, Miami


    ABSTRACT: As Artificial Intelligence (AI) continues to reshape industries and
    societies, a critical examination of the ethical dimensions surrounding its development
    becomes imperative. This talk delves into the multifaceted landscape of ethical
    considerations within AI, aiming to guide developers, researchers, and industry
    stakeholders towards global responsible innovation. The first part of the discussion
    explores key ethical challenges, including bias in algorithms, data privacy concerns,
    and the societal impact of AI technologies. Drawing on real-world examples and
    case studies, the talk illuminates the complexities of navigating these ethical
    quandaries and underscores the importance of a holistic, inclusive approach to
    AI development. In the second part, the talk proposes practical strategies and
    frameworks for integrating ethical considerations into the AI lifecycle for Global
    development. Emphasizing the significance of interdisciplinary collaboration,
    transparency, and user involvement, the discussion provides actionable insights
    for cultivating a culture of responsibility in the AI community. Attendees will
    gain valuable perspectives on fostering ethical awareness, aligning AI initiatives
    with societal values, and contributing to the evolution of a more ethically sound
    and sustainable AI landscape.


    BIO: Prof. Iyengar is currently the Distinguished University Professor, Founding
    Director of the Discovery Lab and Director of the US Army-funded Center of Excellence
    in Digital Forensics at Florida International University, Miami. He is also the
    Distinguished Chaired Professor at National Forensics Sciences University, Gandhinagar,
    India. Prof. Iyengar is a Member of the European Academy of Sciences, a Life Fellow
    of the Institute of Electrical and Electronics Engineers (IEEE), a Fellow of the
    Association of Computing Machinery (ACM), a Fellow of the American Association
    for the Advancement of Science (AAAS), a Fellow of the Society for Design and
    Process Science (SDPS), and a Fellow of the American Institute for Medical and
    Biological Engineering (AIMBE). He was recently bestowed with the 2023 Karnataka
    Rajyotsava Award (Karnataka State’s 2nd Highest Civilian Award) on 1st November
    2023. In addition to this he has been awarded the Lifetime Achievement Award for
    his contribution to the field of Digital Forensics and IEEE Cybermatics Congress
    “Test of Time Award” for his work on creating Brooks-Iyengar Algorithm and its
    impact in advancing modern computing. Prof. Iyengar in collaboration with HBCUs
    were awarded a $2.25 M funding for setting up a Digital Forensics Center of Excellence
    over a period of 5 years (2021-2026). He has published more than 600 research
    papers, has authored/co-authored and edited 32 books. His vision, expertise, and
    dedication have made him an asset in the academic community at large.'
