  md: '![](img/9eefc6d2972274efeb1680c6a31895e5_91_0.png)


    Figure 1. Interface aspects to interact with users.


    HCI has transformed a lot compare to its early days because of research, one great
    example of it is World Wide Web (WWW) (Keskin et al. 2023). WWW is a result of
    HCI research, through which we can store web pages or websites in a web server
    and connect to it through local computers. Through research, we have developed
    applications, such as drawing, text editing, hypertext, animation systems, gesture
    recognition system, eye tracking system, biometric tracking systems, cloud computing,
    speech recognition, etc.


    Another approach is design thinking, which is a practice that originated from
    the design discipline and aims towards solving problems through a human-focused
    approach (Culén et al. 2014). This practice concerns real-world problems, which
    can be solved through empathy, prioritizing users, their needs, innovative solutions,
    and synthetic reasoning. It also makes sure that the innovation is useful, realistic,
    noticeable, and addresses human values. HCI designers and practitioners follow
    an approach that concerns user requirements. A deeper exploration of similarities
    or differences between design thinking and HCI design can reveal new ways for
    practitioners in shaping innovative technologies for the future. Few Institutes
    around the world organizer different workshops in which we discuss new ideas,
    recently facing problems, how to solve them, new methods, the idea behind HCI,
    its history, and much more for researchers, designers, practitioners, beginners,
    others interested in innovation to help them understand the issues involved in
    designing and implementation of HCI.


    Because of this transformation in HCI and the rapid increase in technology, people
    with different abilities can use it in their everyday life. Due to this people
    lacking knowledge, and formal training can easily interact with computers and
    need not worry about the complications that arise during the early stage of learning
    any computing system. Hence, we can say that user-friendly interfaces and computing
    systems make sure that everything is easy and clear for everyone.


    # 2 APPLICATIONS OF HCI


    Nowadays, the internet and advanced technology have changed every area of our
    life from waking up to sleep at night we experience HCI technology throughout
    the day, one simple example is a light switch (McCormick et al. 1976). A person
    does not need to own a computer system or a laptop or a smartphone to have an
    impact on HCI in their lives. Examples of HCI in our daily lives are railway ticket-selling
    machines, health trackers, smart TVs, wearable systems, etc. Today companies or
    industry which is reliant on technology or computing machines needs HCI in their
    daily routine. Employees can work more efficiently and fast if the computing machines
    would be well-designed, easy to use, and easy to understand. HCI plays an important
    role in safety-control systems and many more.


    In this world a lot of people have disabilities so it becomes very difficult for
    them to understand computing machines. HCI plays a very important role in this
    case, as HCI offers a very secure, easy-to-understand, efficient, and usable environment.
    So by focusing on user-centered techniques and functions people with disabilities
    will also be able to use computing'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'machines comfortably. In the early days of technology computing machines used
    to be very expensive and not everyone could afford them. But by looking at the
    benefits of technology, designers, researchers, manufacturers, and providers made
    sure that everyone could get access to smart devices by making technology cheap
    without compromising its quality. Nowadays very few people read manuals as they
    are lengthy and hard to understand for a beginner. And in this case, HCI makes
    people learning and accessing computer systems easy (Majoranta et al. 2014). HCI
    makes user-friendly and easy-to-use interfaces and computing systems so that a
    beginner can understand everything within a few minutes.


    # 3 EVOLUTION OF HCI


    ![](img/9eefc6d2972274efeb1680c6a31895e5_92_0.png)


    Figure 2. Number of users increased over past years.


    The evolution of HCI in designing new interactive, efficient, easy to use and
    easy-to-understand interfaces has evolved a lot in the past few decades by focusing
    on graphical user interfaces (GUIs) as described in Figure 2. Because of the evolution
    of HCI the number of users using internet and technology has increased rapidly.
    With the help of GUI, users can now have a whole new experience while dealing
    with technology, using touch screens have now become a part of our lives by using
    desktops, smartphones, and tabs (Murad et al. 2019). Now the designers are also
    focusing on Voice User Interfaces (VUIs) to interact with users but our design
    system is still focused mainly on GUIs hence, for now, it may not be fully possible
    to design, implement and focus on VUI (Murad et al. 2019). A lot of studies, research,
    and experiments have been done to improve HCI. Various articles and research papers
    have been published by practitioners, researchers, designers, and users about
    various problems, their solutions, etc these articles and research papers can
    help us a lot in evolving HCI (Chen et al. 2006). We can go through them and can
    experiment with a few effective methods, then implement them. Over the years it
    has been seen that the “living laboratory” has created new ways of experimenting
    with new methods and developing HCI by analytical analysis, stats, coding, and
    hypothesis generation on data (Alavi et al. 2020). One another approach is that
    we can use design patterns as design tools to solve individual problems. We can
    also use pattern-oriented designs for different related design problems, which
    help designers in creating visionary designs (Seffah et al. 2012). The design
    pattern’s goal is that how patterns can be reused, and provide proven and valid
    design solutions (Seffah et al. 2012). As the technology and HCI both evolved
    new learning solutions and technologies were introduced, which help humans in
    every way such as gesture-based interaction, a new learning solution for autistic
    children, and much more.


    # 3.1 Gesture-based interaction


    It is a type of interaction in which users interact with the computing system
    through a set of gestures. In this type of interaction, the user uses physical
    gestures for instance, swiping, tapping, pinching, and scrolling, instead of using
    input devices such as a keyboard, mouse,'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'etc. HCI aims to make interactions smooth and to do that their most significant
    technique is gesture recognition, this system makes sure that it is easy to use,
    provides mobility, and requires less hardware (Kumar et al. 2018). Gesture-based
    applications can be very useful for elderly users as with their aging they lose
    their sensory, motor, and cognitive abilities (Chen et al. 2013). So they can
    easily interact with the help of movements of their hands, face, and other body
    parts because of the advantage of simplicity. With the help of HCI, we can provide
    new learning solutions for children with Autism Spectrum Disorder (ASD). Research
    has concluded that the use of computer technology combined with HCI in the education
    of children with ASD has positive and beneficial effects (Mullen et al. 2010).
    Augmented Reality (AR) technology can be used to create a familiar environment
    in which autistic children can learn their learning content in real-time through
    audio and video (Sharma et al. 2022). However, the HCI community has not been
    paying much attention to providing usable and efficient solution to autistic children
    but a few solutions is still there for instance robot-supported learning solution.
    These solutions come with many challenges and researchers are trying to overcome
    the problems.


    # ## 4 EYE TRACKING CONTROL SYSTEM


    Eye tracking systems are used to measure the activity of our eye, it measures
    the position of our eyeballs, gaze direction, and the movement of the eye can
    be measured with different technologies (Zhang et al. 2017). Eye trackers can
    help HCI researchers to understand visual and display-based information and this
    information can be used in improving usability interfaces, various products, websites,
    apps, etc (Joseph et al. 2020). Eye tracking technology is available for 100s
    of years but for the past few years, the development in this field has increased
    a lot. Zhang et al. (2017) have mentioned 4 techniques for it: infrared-oculography
    (IROG), sclera search coil method (SSC), electro-oculography (EOG), and video-oculography
    (VOG).


    This system is now commonly used in medical and psychological research to understand
    human visual behavior more effectively. This can also be very helpful for people
    with disabilities and in our workplaces as a security system (Majoranta et al.
    2014). Nowadays users prefer biometric systems more as their security system and
    with the growing interest in this tool in medicine, market research, web design,
    marketing, security, digital media, product design, defense, etc it has become
    more affordable than before. A few years back eye trackers used to be very expensive
    and not everyone could afford them but with the rapid increase in demand for eye
    trackers in various fields, low-cost eye-tracking devices became available in
    the market for example GazePoint (GP3) HD 150 Hz, HTC Vive Pro Eye, smart eye
    aurora – 60/120 Hz, EyeTech VT3 mini – 40/60 Hz, Smart Eye AI-X, etc.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_93_0.png)


    Figure 3. Eye-tracking technology and virtual keyboard.'
