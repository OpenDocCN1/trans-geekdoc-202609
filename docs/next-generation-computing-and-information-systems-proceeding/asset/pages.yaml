  md: '# A digital twin framework for smart contract-based DeFi applications in the
    metaverse: Towards interoperability, service scaleup & resilience


    Ankur Gupta*, Surbhi Gupta* & Saurabh Sharma*


    Department of CSE, Model Institute of Engineering and Technology, Jammu, J&K,
    India


    ABSTRACT: Decentralized Finance (DeFi) is expected to be the backbone for the
    metaverse facilitating B2B, B2C, and C2C commerce at scale. Blockchain and smart
    contracts are key drivers of the DeFi vision, enabling secure and non-repudiable
    financial transactions based on the fulfillment of pre-defined conditions. However,
    smart contract business logic can be faulty resulting in erroneous transactions
    and loss of capital. Testing smart contracts and ensuring 100% correctness also
    remains a challenge. Finally, to realize the interoperability requirement of the
    metaverse as mandated by the Metaverse Standards Forum (MSF), service providers
    shall be required to quickly scale and provide similar services across a plethora
    of metaverse platforms and ecosystems. Service providers also need to ensure the
    high availability of their DeFi services and remain resilient in the face of attacks.
    This research paper presents A Digital Twin Framework for smart contract-based
    applications for the metaverse, allowing DeFi service providers to create and
    maintain multiple active and passive twins of their services across metaverse
    platforms. Passive twins of the service can be used by prospective partners to
    test their smart contract execution and validate the outcomes. Passive twins can
    be activated dynamically to improve availability, ensure hyper-scaleup, or respond
    to attacks. Simulation results establish the effectiveness of the proposed framework
    laying the foundation for meeting the expectations for the future metaverse.


    # 1 INTRODUCTION


    The metaverse is fast emerging as a tangible reality with pieces of technology
    required to realize its vision becoming available (Gupta et al. 2023). This promised
    digital universe is an evolving ecosystem driven by the fusion of high-performance
    computing, low-latency networks, and immersive AR/VR/XR technologies (Chen et
    al. 2022; Singh et al. 2021) which are fast becoming mainstream and helping diverse
    industries imagine and experiment with exciting use-case scenarios. At the heart
    of this transformative landscape lies the promise of decentralized finance (DeFi)
    (Auer et al. 2023), a financial paradigm shift that leverages blockchain technology
    and smart contracts to reshape how we perceive, interact with, and experience
    economic transactions within the metaverse. The economic impact of the metaverse,
    driven by DeFi is expected to be a few trillion dollars over the next 2 decades.


    The metaverse, with its immersive virtual environments, interconnected digital
    economies, and thriving virtual communities, presents an unprecedented canvas
    for the evolution of financial systems(Dincelli & Yayla 2022). In this realm,
    users can traverse vast virtual landscapes, interact with diverse avatars, own
    and trade digital assets, and participate in a spectrum of economic activities
    that mirror real-world counterparts. The metaverse’s


    *Corresponding Authors: ankur.gupta@mietjammu.in, surbhi.cse@mietjammu.in and
    saurabh.cse@mietjammu.in'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'inherent potential to redefine commerce, entertainment, and social interactions
    is underpinned by blockchain technology, the decentralized ledger that enables
    trustless transactions and transparency, and smart contracts (Gupta et al. 2023),
    self-executing agreements that automate and enforce the rules of engagement.


    DeFi, which has already disrupted traditional finance (Zhang et al. 2023), is
    poised to take center stage within the metaverse, offering a compelling vision
    of a financial ecosystem characterized by autonomy, accessibility, and inclusivity.
    Unlike the conventional financial system, which is governed by intermediaries
    and centralized authorities, DeFi leverages the power of blockchain and smart
    contracts to provide individuals with direct control over their assets and financial
    activities. It also opens new avenues for economic participation, enabling users
    to earn income through virtual jobs, create and trade virtual goods and services,
    and even establish their own decentralized autonomous organizations (DAOs)(Taulli
    2022). The Metaverse Standards Forum (Metaverse Standards Forum), defines interoperability
    between all metaverse platforms as a key requirement for the future development
    of disparate yet collaborating platforms giving users the freedom to navigate
    the metaverse seamlessly. Thus, DeFi too would need to seamlessly work across
    platforms allowing the user the freedom to engage in financial transactions on
    the go, with guarantees of security, and privacy built in. To facilitate this
    basic requirement, DeFi or smart contracts need to be pervasive across the metaverse
    fabric (La Barrera 2023), be easily testable, scalable, resilient, and provide
    assurances of correct execution irrespective of where and how they are invoked.
    This represents a technical challenge for smart contract developers and DeFi service
    providers. This research paper provides a distributed framework for smart contracts
    based on the concept of digital twins (Barricelli et al. 2020), allowing DeFi
    service providers to easily scale their services through replication and edge
    deployment, providing seamless access to financial transactions for users, while
    ensuring security and transparency. The significant contributions of the present
    study are listed below:


    +   - The present study proposes the novel concept of Smart Contract Digital Twins
    to represent replicated smart contracts as edge services for different metaverse
    platforms.

    +   - The present study provides a new framework for scaling DeFi services across
    the metaverse ensuring security (offered as authenticated service endpoints at
    the edge), interoperability (working across different metaverse platforms), resilience
    (to attacks as services can be scaled up through replication) and performant (low-latency
    as it is edge-based and offers load balancing).

    +   - The present work addresses an important challenge in ensuring the correctness
    of smart contracts by allowing DeFi users the ability to test the output of smart
    contract execution by using edge services in passive mode. This ensures that the
    final output is not committed to the central blockchain. Currently, there is no
    mechanism for end-users to verify the correct execution of smart contract business
    logic.

    +   - Simulation results also show that the framework is feasible, easily scalable,
    and performant, thus addressing a major requirement for enabling metaverse cross-platform
    DeFi use cases.


    The rest of the manuscript is organized as follows: Section 2 discusses the related
    work in the domain. Section 3 presents the detailed system model along with the
    functional elements and workflow, along with the salient features and advantages,
    while Section 4 presents the experimental setup and simulation results obtained
    with their discussion. Finally, Section 5 concludes the paper.


    # 2 RELATED WORK


    Decentralized Finance (DeFi) has gained traction since the emergence of blockchain,
    smart contracts, and Decentralized Oracle Networks (DONs) along with the rise
    of Web3 and the'
