  md: 'The user may control his personal computer (PC) by tapping the pictures of
    the keys on the virtual keyboard, which can be projected and interacted with on
    the desktop. Here, we create a virtual keyboard control system that tracks the
    user’s eye movements in addition to their finger movements and converts them into
    keystrokes (Figure 3). Users may simultaneously use their fingers and eyes to
    operate the virtual keyboard (Lin et al. 2008).


    This system can also help users in their learning methods with the help of interactive
    and revolutionized ways of teaching. McCormick et al. (1976) in their work indicate
    that more than 80% of human beings learn things faster through visual representation.
    Thus the visual power of learning is much better than other cognitive processes.
    The user experience of HCI and eye-tracking technology can be used in a much more
    effective way to enhance digital learning. In this system, the eye movement data
    is so important but in the past observing the movements through the eyes was not
    objective enough, less accurate, etc. The main component of cognitive psychology
    is the information processing model (Kumar et al. 2021; Singh et al. 2021; Wu
    et al. 2012). It is a framework used by cognitive psychologists to describe the
    processes of the human brain.


    # 5 EXPERIMENTAL RESULTS


    A typing experiment is conducted in which we are evaluating how fast participants
    react or move through visual changes. A virtual keyboard is provided to the participants.
    In this experiment we are using TAM, introduced by Davis et al. (1989), it is
    an information system that tells us how the user accepts and rejects any proposed
    system or technology. In TAM we are using a TAM questionnaire to get the results,
    in it we need to evaluate 5 items, PU, EOU, ATU, BI, and PI according to the system
    adopted by Davis et al. (1989) and Venkatesh et al. (2000). We are using the TAM
    questionnaire at the end of this experiment to know if the proposed technology
    is comfortable, beneficial, and easy to use for the participants.


    In this experiment, more than 1000 participants were part of this experiment and
    survey. Out of which 64.3% were males and 35.7% were females, with some experience
    involved in using computing devices. Participants were students of age group from
    17 to 25 years old. At first, the participants were introduced to the virtual
    keyboard and then spent 2–3 minutes with it by themselves to get familiar. After
    that participants were told only to look at the virtual keyboard to avoid any
    errors and increase the system’s accuracy. After the experiment participants filled
    out the TAM questionnaire for the proposed virtual keyboard system. This experiment
    involves 5 simple steps.


    +   - Go to the website link: https://www.typing.com/student/tests.

    +   - Enter the button “Start 1-minute test”.

    +   - Now type the letter which is in “blue” color on the screen and make sure
    to be as fast as you can and avoid any typing errors.

    +   - Then after 1 minute you can check speed and accuracy.

    +   - After that, participants completed their surveys.


    The result of this experiment is defined in Table 1. The speed is calculated in
    Words Per Minute (WPM) and the accuracy is in percentage (%). According to the
    results, the average speed of male participants (36.5 wpm) is greater than female
    participants (28.4 wpm), indicating that males can react to visual changes faster
    than females. The average accuracy of males is 91% whereas that of females is
    96%, indicating that females can type with few errors than males. The difference
    in average accuracy and speed between males and females is shown in Figure 4.'
