    # 5 CONCLUSION


    In the field of hypertension detection, the use of AI learning techniques has
    shown significant advancements and promise. It is worth mentioning that classifiers
    like XGBoost, CatBoost, and LGBM have shown exceptional precision, recall, F1
    score, and accuracy in distinguishing between hypertensive and non-hypertensive
    cases. In spite of these achievements, there have been some challenges, especially
    with the Multi-Layer Perceptron (MLP) model. It has faced difficulties in attaining
    high accuracy. This emphasizes the need for ongoing optimization and refinement
    of neural network models to enhance their performance in detecting comprehensive
    hypertension.


    The challenges encountered involve complex data patterns and the need to continuously
    research and develop model architecture. Understanding and navigating through
    these complexities is essential to furthering the integration of machine learning
    and deep learning techniques, which holds great potential for detecting hypertension.
    Future work should prioritize a deep exploration of data patterns, fine-tuning
    model architectures, and investigating innovative optimization strategies. This
    iterative process will help advance the development of more dependable, accurate,
    and easily accessible diagnostic tools for detecting hypertension, further strengthening
    the collaboration between computer science and healthcare.


