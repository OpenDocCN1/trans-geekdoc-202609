    # 5 CONCLUSION


    If you would want to keep track of what you eat and how much you consume, this
    research presents a cross-modal recipe retrieval model that uses a self-attention
    mechanism to automatically retrieve the recipes that are most relevant to the
    input food images. The model in this paper uses the Transformer model’s self-attention
    mechanism to capture better the long-distance dependencies appearing in recipes
    and improves the semantic understanding ability of the model. This research also
    improves the attention mechanism that is utilized in the classic recipe retrieval
    model, which better captures the uniqueness across various recipes and further
    boosts the model’s accuracy. Therefore, the current method only takes targeted
    consideration in the recipe text encoding module, while a more commonly used image
    processing model is used in the picture encoding module. In the future, the image
    encoding module will be adjusted and optimized for the recipe retrieval problem.


