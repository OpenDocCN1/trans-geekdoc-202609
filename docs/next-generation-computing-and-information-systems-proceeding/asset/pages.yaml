    # 3.2 Data processing


    # 3.2.1 Pulse signal preprocessing


    Pulse signal is a weak physiological signal, which is easily interfered by other
    signals, including patient''s limb shaking, breathing, mechanical vibration of
    equipment and power frequency interference. The sampling frequency of the sample
    is 720 Hz (Mahajan et al. 2021). According to the sampling theorem, the frequency
    range of the collected pulse is 0~360 Hz. Single-cycle division is performed on
    the filtered pulse signal to obtain a single-cycle waveform of the pulse (Wang
    et al. 2021).


    # 3.2.2 Balanced dataset


    There is a clear imbalance in the dataset, where the healthy pulse is far less
    than the coronary heart disease pulse. If the model is trained with unbalanced
    samples, the generalization ability of the classification model will be poor and
    overfitting will easily occur. Therefore, this paper adopts the Synthetic Minority
    Oversampling Technique (SMOTE) (Deshmukh et al. 2021) to balance the dataset.
    Assumek = 5 and the sample multiple N = 6, 1608 healthy samples can be generated,
    combined with 1612 coronary heart disease patients, the balanced data set contains
    a total of 3220 samples.


    # 3.2.3 Threshold less recursive graph conversion of pulse signal


    When constructing the threshold less recursive graph of pulse signal, two key
    parameters need to be determined: the delay time \(\tau\) and the embedding dimension
    m. Based on statistical methods, the C-C algorithm can simultaneously determine
    the parameter sizes of m and \(\tau\) through correlation integration (Khan et
    al. 2022). Through calculation and analysis, this paper chooses m = 3 and \(\tau\)
    = 4 to expand the phase space of the pulse signal. Due to the different lengths
    of a single cycle of different pulse signal, zero-fill is performed at the end
    of the pulse signal with a shorter cycle to generate a recursive graph of the
    same size, as shown in Figure 2(a) and (b).


