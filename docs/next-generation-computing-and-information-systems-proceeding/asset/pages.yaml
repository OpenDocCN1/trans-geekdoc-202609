    # ## 2 DIFFERENT MODAL RETRIEVAL


    # ### 2.1 Cross-modal retrieval Model


    The main difficulty of the cross-modal retrieval problem is how to measure the
    similarity between data of different modalities. Compare. A classic approach in
    the field of cross-modal retrieval is canonical correlation analysis (CCA). Then
    CCA has developed many variants, such as kernel CCA (kernel CCA) (Wu et al. 2021).
    Later, with the development of deep neural networks, many works also began to
    use deep neural networks for latent space mapping (Li et al. 2022).


    # ### 2.2 Food-related research Model


    Food-related research has always been a concern and valued by researchers. Common
    research directions include food identification (Yang and Yang 2020), raw material
    identification (Saini et al. 2021), and nutrient composition estimation. Author
    took the lead in introducing the classic latent space alignment idea of cross-modal
    retrieval into recipe retrieval, and their model framework. Such a structure enables
    retrieval not to be limited by fixed food attributes and requires less manual
    extraction of labels during training.


    # ## 3 CROSS-MODEL FRAMEWORK


    # ### 3.1 Different parts of recipe text


    The data of the two modalities of text and pictures respectively obtain corresponding
    feature representations through their respective encoding modules. Then the feature
    vectors of the two modalities enter the joint embedding module to learn the embedding
    representation in a shared latent space so that the similarity between the matched
    text and the image is as high as possible. The entire model is trained end-to-end.
    Next, the different modules in the model will be introduced separately.


    # ### 3.2 Different parts of cross-model


    # #### 3.2.1 Transformer


    The Transformer model is a model proposed by Google in 2017 (Phasinam et al. 2022).
    Its original purpose was to replace the recurrent neural network to solve the
    task of seq2seq in natural language processing. Compared with the recurrent neural
    network, the Transformer solves two problems: one is to get rid of the serial
    calculation order and improve its parallel ability; the other is to solve the
    problem of the recurrent neural network processing long text because the text
    is too long “Forgetting” phenomenon, which makes it challenging to deal with the
    issue of long-distance dependence. Model framework has been shown in Figure 1.


    The ability of the Transformer model to deal fig with long-distance dependencies
    mainly depends on the self-attention mechanism it adopts (Li et al. 2019). Unlike
    the recurrent neural network (RNN), which can only learn the previous information
    through the hidden layer of information transmitted in the last time slice, with
    the help of the self-attention mechanism, the Transformer model can “globally
    browse” the input data and find a higher correlation with it.'
