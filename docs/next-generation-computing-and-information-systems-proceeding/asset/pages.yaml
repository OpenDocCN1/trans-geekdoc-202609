    of the improved atrous convolution lightweight method is shown in Figure 1. The
    improved atrous convolution lightweight method combines point-by-point convolution
    and atrous convolution.


    ```

    V_{impr} = H_{in} * X_{in} * 1 * 1 * D_{in} * M_P + H_{in} * X_{in} * 3 * 3 *
    D_{out} * M_P   (9)

    Q_{impr} = D_{in} * 1 * 1 * M_P + 3 * 3 * D_{out} * M_P   (10)

    ```


    D_{in}; D_{out}; H_{in}; and X_{in} in equations (16) and (17) are similar to
    those defined in equation (10). The same; LP represents the number of compressed
    channels, which is 16. It can be seen from the formula calculation that the reduction
    of the parameter amount and computation amount of the improved atrous convolution
    lightweight method compared with the primary atrous convolution light method is
    mainly due to the small convolution kernel of 1 × one point-by-point convolution
    (Choi and Bajic 2020).


    # 3.4 Fusion-type atrous convolution lightweight method


    Excessive use of atrous convolution to perform lightweight operations on the network
    will improve precision attenuation. The main reasons are: (1) From equation (2),
    it can be seen that the atrous convolution structure has the characteristics of
    equal interval sampling, and frequent selection will lose each Part of the valuable
    feature information of the hierarchical feature map; (2) The essence of a deep
    neural network is to fit an optimal objective function in a solution space, and
    a deeper network has a more extensive solution space. Fusion-type whole convolution
    lightweight method as shown in Figure 2.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_132_0.png)


    Figure 2. Fusion-type whole convolution lightweight method.


