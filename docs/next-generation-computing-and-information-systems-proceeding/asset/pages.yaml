    # 5 CONCLUSION


    In this paper, a context-aware-based drug recommendation model, Medicine-LDA,
    is proposed that utilized a general probabilistic framework to describe the diagnosis
    and treatment process in real-life scenarios. The model inferred the possible
    diseases of patients based on patient documents composed of laboratory abnormalities
    and medical texts and proposed the use of disease topics to describe the probability
    of patients suffering from different diseases. Finally, through experiments on
    a data set from a large tertiary hospital, it is shown that the model proposed
    in this paper outperforms the commonly used traditional machine learning models,
    topic models and collaborative filtering models in accuracy. The analysis of the
    results can obtain a series of valuable information, which confirms the excellent
    performance of the model and its value in practical application.


