  md: '# Advances in smart farming for precision agriculture: Green-IoT and machine
    learning as a solution


    Monia Digra & Preeti Rajput

    Model Institute of Engineering and Technology, Jammu, J&K, India


    Pooja Sharma

    School of Computer Science and Engineering, Shri Mata Vaishno Devi University,
    Katra, J&K, India


    ABSTRACT: Agricultural development is crucial to ending poverty and boosting economic
    growth in emerging nations. The global population is expected to reach 9.7 billion
    by 2050. Smart and precise agriculture must enhance agricultural productivity
    without compromising quality, nutrition, or natural resources. IoT and AI/ML have
    significant uses in agriculture due to internet technologies. Although IoT has
    many benefits, the enormous number of networked devices may raise carbon emissions
    and e-waste due to energy consumption. Inspired by the goal of sustainable smart
    agriculture, this article addresses major results and research gaps in IoT-based
    smart agriculture and provides solutions for energy-saving Green-IoT (G-IoT) applications
    in agriculture. We start with G-IoT’s evolution and smart agriculture applications.
    We also examine how green architecture may efficiently apply AI/ML in smart agriculture.
    We propose an AI/ML G-IoT framework for smart agriculture with green sensor cloud
    and green AI. This unique G-IoT paradigm provides sustainable and energy-efficient
    agricultural architecture. We investigate statistical and experimental data and
    emphasise the limitations of adopting G-IoT and AI/ML architecture in agriculture.
    In conclusion, G-IoT and AI/ML architecture can enable sustainable, energy-efficient,
    smart precision agriculture.


    # 1 INTRODUCTION


    Agriculture plays an important role in the economic growth of any country. In
    2014, one-third of the Gross Domestic Product (GDP) was accounted for through
    agriculture worldwide (The World Bank 2015). For example, India ranks second after
    the United States of America in agricultural output as per the Indian economic
    survey of 2018. It contributes 17–18% of India’s GDP and employs 50% of the workforce
    (Ministry of Statistics and Program Implementation | Government Of India). Traditional
    agriculture is the major and dominant activity of India’s economy, like in other
    developing countries. Every year, millions of food consumers have been added globally.
    Agricultural production is going to be affected by climate change and global warming.
    However, all developing nations like India confront multiple risks and uncertainty
    associated with agricultural output. Unplanned irrigation, poor management of
    crops and pesticides, and spreading of pathogens and weeds cause production deficits.


    However, IoT devices and applications produce carbon emissions, consume massive
    energy, and embrace e-waste and toxic pollutants. These must also be green to
    address global warming and climate change. The solution to this problem is Green-IoT
    (G-IoT) in smart agriculture. G-IoT focuses on a green design by using low energy
    consumption devices, low data transmission energy, and carbon-free materials and
    promotes reusability and minimal greenhouse gas emissions to counter climate change
    (Arshad et al. 2017).


    It has been seen in the past year from Google web search data as shown in Figure
    1 that the popularity of keywords “Smart Agriculture”, “IoT”, and “Green Technology”
    is increasing.'
