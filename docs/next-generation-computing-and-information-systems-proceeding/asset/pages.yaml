  md: '# Deep learning-based cognitive digital twin system for wrist pulse diagnostic
    and classification


    Jitendra Kumar Chaudhary

    Associate Professor, School of Computing, Graphic Era Hill University Bhimtal
    Campus,

    Uttrakhand, India


    T. Parimallam

    Associate Professor and Head, Department of Computer Science, Nandha Arts and
    Science College,

    Erode, Tamilnadu, India


    Faisal Yousef Alghayadh & Ismail Keshta

    Computer Science and Information Systems Department, College of Applied Sciences,

    AlMaarefa University, Riyadh, Saudi Arabia


    Mukesh Soni

    Dr. D. Y. Patil Vidyapeeth, Pune, Dr. D. Y. Patil School of Science & Technology,
    Tathawade,

    Pune, India


    Sheshang Degadwala

    Department of Computer Engineering, Sigma University, Vadodara, Gujarat, India


    ABSTRACT: In analyzing and recognizing wrist pulse signals, it isn’t easy to mine
    the nonlinear information of wrist pulse signals using analysis methods such as
    time and frequency. Traditional machine learning methods require the manual definition
    of features and cannot perform self-learning of features. A cognitive digital
    twin technique for pulse analysis and recognition based on threshold-less recursive
    graph and CNN is proposed. The wrist pulse signal is converted into a threshold-free
    recursive graph based on the nonlinear dynamics’ theory. The VGG-16 CNN automatically
    extracts the nonlinear features of the recursive graph, and a pulse condition
    classification model is established. Experimental finding several that the classification
    of the proposed method accuracy can reach 98.14%, as compared with the existing
    pulse classification methods. This study offers a novel concept and strategy for
    classifying pulse signals, and it has application to the objectification of pulse
    diagnosis.


    # 1 INTRODUCTION


    Pulse diagnosis is one of the components of traditional Chinese medicine and has
    important clinical value. Additionally, there aren’t many reliable objective diagnostic
    markers (Jiangang et al. 2022). Therefore, it is necessary to apply modern computer
    technology to study the quantitative identification method of pulse signal, to
    realize the standardization and objectification of pulse diagnosis. Fourier transform,
    and the frequency domain features are extracted; the time-frequency domain analysis
    method can simultaneously describe the time and frequency domain characteristics
    of the signal, and the commonly used methods are wavelet transform, Hilbert-Huang
    transform, etc. (Yifan and Li-Yun 2022). Research shows that the pulse signal
    has nonlinear characteristics, and the first three methods will inevitably lose
    nonlinear information in the process of analyzing the pulse signal. At present,
    the'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'nonlinear analysis methods of pulse signal mainly include approximate entropy
    (Viktor _et al._ 2022), Lyapunov index (Gautam _et al._ 2021), Existing approaches
    such as BP neural network, linear discriminant analysis, Bayesian classifier,
    Support Vector Machine (SVM), convolutional neural network (CNN) are primarily
    employed in the investigation of pulse signal pattern identification. Conventional
    machine learning methods need to define and extract pulse characteristics manually,
    and it is extremely challenging to identify the ideal feature set to discriminate
    between various types of pulse circumstances since there exists a complicated
    nonlinear relationship among the pulse types and pulse features (Kshirsagar and
    Londhe 2017). The CNN transfers information layer by layer by simulating the human
    neuron structure to achieve automatic feature extraction. These features have
    been proven in many studies to be more representative than traditional hand-extracted
    features, resulting in better classification and recognition results. This paper
    proposes a pulse signal analysis and recognition method based on threshold-less
    recursive graph and convolutional neural network (Yutao _et al._ 2022). The method
    converts the pulse signal into a corresponding threshold-free recursive graph
    through nonlinear analysis, so that its nonlinear features are mapped into a two-dimensional
    plane. Through the multi-layer convolution calculation of the convolutional neural
    network, the self-learning and classification of the pulse signal characteristics
    is realized, so that it can distinguish different pulse types (Liu 2022).


    # 2 RESEARCH METHODS


    # 2.1 System overview


    The overall process of the proposed pulse signal analysis and identification method
    is illustrated in Figure 1. The pulse signal is converted into a threshold-free
    recursive graph, and then the VGG-16 CNN is utilized to extract and classify the
    pulse signal recursive graph, and establish a pulse signal classification model.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_114_0.png)


    Figure 1. Pulse signal classification flowchart.


    # 2.2 Threshold-free recursive graph of pulse signal


    Recursion graphs are a useful tool for analyzing a system''s nonlinear dynamic
    properties because they can show how the signal is internally organized and intuitively
    convey the signal''s complexity and instability. This method was presented in
    (Xuebin 2022), and the first step is to reconstruct the signal in phase space.
    As per the embedding theory, choose the appropriate embedding dimension m and
    delay time $\tau$ to reconstruct the phase space, and then the reconstructed vector
    is:


    ```

    $X_i = (x_i, x_{i+\tau}, \cdots x_{i+(m-1)\tau}), \quad i = 1, 2, \cdots, N$ (1)

    ```'
