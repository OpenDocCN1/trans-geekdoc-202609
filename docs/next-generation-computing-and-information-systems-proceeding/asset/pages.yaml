    to data pre-processing lays a solid foundation for robust analysis and modeling.


    # 3.3 Train-Test splitting


    Performing a train-test split on dataset is crucial to assess the performance
    of machine learning model to detect diabetic and non-diabetic patients. In this
    research paper, we have Scikit library to split the dataset in training as well
    as testing in a ratio of 80:20. After the split, the training set trains the model''s
    parameters, while the testing set assesses it''s predictive accuracy. This approach
    helps prevent overfitting, where the model performs well on the training data
    but fails to generalise to new data.


