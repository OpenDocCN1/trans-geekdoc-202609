  md: '# 3 METHODOLOGY


    In this section, we discussed an overview of the experiments conducted to predict
    ACT scores using machine learning regression models. Figure 1 provides a visual
    representation of the comprehensive workflow process we followed throughout our
    experiments. This workflow encapsulates the key stages of our research, including
    data preprocessing, model training, and evaluation. Each step in this process
    is crucial to predict ACT scores accurately. By visualizing our workflow, we aim
    to offer a clear and insightful glimpse into the systematic approach for our research.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_202_0.png)


    Figure 1. Workflow of the study.


    # 3.1 Data collection and visualization


    The dataset used for this experiment contains 1010 samples and initially comprises
    14 attributes. This dataset was collected as part of the research conducted by
    Radiiah H. and Sin-Ban. (Haque et al. 2021) The dataset''s attributes include
    the following: User Number, User ID, Location, Age, Gender, Outdoor Job, Outdoor
    Activities, Smoking Habit, Humidity, Pressure, Temperature, UV Index, Wind Speed
    and ACT Score. Figure 2 depicts the frequency distribution of each attribute within
    the dataset. That will give a better understanding of each attribute''s characteristics.


    # 3.2 Data preprocessing


    We have removed the "UserNo" and "UserID" attributes, as they do not contribute
    to our predictive model. Several attributes, including "Age", "Gender", "OutdoorJob",
    "OutdoorActivities", "SmokingHabit" and "UVIndex" were categorical. To convert
    these attributes into numeric form, we applied label encoding, ensuring that the
    models could effectively utilize this information.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'In our analysis, we employed the SelectKBest method from scikit-learn''s feature_selection
    module. This technique enabled us to assess the significance of each attribute
    concerning the target variable. The SelectKBest method employs the chi-squared
    ($\chi^2$) scoring function, to rank attributes based on their relevance to the
    target variable. This method supports in the selection of the top ''k'' attributes
    that demonstrate the strongest relationships with the target variable.


    From Figure 3, it is concluded that attributes such as humidity, windspeed, age,
    and gender exhibit a strong influence on the predictive accuracy of our models.
    In contrast, location, outdoor job, and pressure established minimal relevance
    in the context of ACT score prediction. As a result, we made an informed decision
    to eliminate these less influential attributes from our dataset. Consequently,
    our final dataset consists of eight key attributes: humidity, windspeed, age,
    gender, outdoor activities, temperature, smoking habit, and UV index. This refined
    dataset allows our machine learning models to focus on the most relevant features,
    thereby enhancing the overall predictive performance and interpretability of our
    models.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_203_0.png)


