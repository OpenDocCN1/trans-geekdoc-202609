  md: '# An optimized CNN-based model for pneumonia detection


    Samridhi Sharma, Suditi Seth, Faisal Rasheed Lone & Azra Nazir

    School of Computer Science & Engineering, VIT Bhopal University, Madhya Pradesh,
    India


    ABSTRACT: Convolutional Neural Networks (CNNs) are a breakthrough paradigm shift
    in medical imaging and diagnostic approaches that can be used to detect pneumonia.
    CNNs have shown to be incredibly effective at automatically extracting complex
    and subtle picture features from CT scans and chest X-rays, making them an excellent
    choice for this task. With the help of deep learning, this initiative aims to
    improve pneumonia diagnosis accuracy and productivity. Creating an automated system
    to detect pneumonia is crucial for prompt treatment, especially in remote regions.
    Given the effectiveness of deep learning, Convolutional Neural Networks (CNNs)
    are widely recognized for accurately classifying diseases from medical images.
    The result is a diagnostic tool that may provide quick and precise assessments,
    giving medical practitioners the power to make educated decisions. This paper
    employs Transfer Learning and a CNN Model to ascertain the presence of pneumonia
    in individuals through chest X-ray analysis. The objective is to gain a comprehensive
    understanding of accurate detection. We built a CNN model from scratch and applied
    transfer learning to it. Compared to the transfer learning models we used, the
    CNN model we constructed yielded better results and was more accurate.


    # 1 INTRODUCTION


    Children under five and elderly individuals with weakened immune systems face
    susceptibility to pneumonia. In 2018, pneumonia caused over a million child deaths
    globally and remains life-threatening without early detection. Streptococcus pneumonia
    is the primary cause of the sickness in children, caused by viruses, bacteria,
    and fungus. The second most prevalent cause of bacterial pneumonia is Haemophilus
    influenza type b (Hib).


    Respiratory syncytial virus is the predominant viral cause of pneumonia. In HIV-infected
    infants, Pneumocystis jiroveci is a prevalent contributor, responsible for a substantial
    portion, approximately one-quarter, of all pneumonia-related deaths in this demographic
    (Pneumonia, n.d.).


