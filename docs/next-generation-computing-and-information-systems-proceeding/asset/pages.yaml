    V = {excellent, good, fair, poor, and inferior}.


    +   2) Single-factor evaluation

    +   When using fuzzy theory for a comprehensive evaluation, it is necessary to
    quantify fuzzy sets through membership function. According to the evaluation index
    of usability evaluation characteristics, this paper adopts the trapezoidal/semi-trapezoidal
    membership function. Given by experts based on experience, the boundaries of each
    indicator are shown in Table 2.'
