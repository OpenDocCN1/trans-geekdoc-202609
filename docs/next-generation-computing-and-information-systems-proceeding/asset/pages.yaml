- pgno: 1
  md: '# NEXT GENERATION COMPUTING AND INFORMATION SYSTEMS


    The proceedings of the 2<sup>nd</sup> International Conference on Next-Generation
    Computing and Information Systems (ICNGCIS''23) includes research papers in diverse
    emerging domains such as AI, blockchain, web 3.0, metaverse and edge computing
    apart from traditional domains such as distributed computing and networks and
    cybersecurity.


    The proceedings include papers addressing currently relevant research issues such
    as smart contract security, interoperability in the metaverse, AI applications
    in healthcare, agriculture and related domains. The proceedings encompass findings
    with real-world implications for the growth and evolution of modern computing
    and information systems by addressing various challenges related to their design,
    deployment, operational aspects, performance and shortcomings.


    The intended audience for the proceedings of ICNGGCIS''23 include researchers
    from industry and academia, practitioners, students, technology enthusiasts and
    even general audience looking to explore interesting applications, use-cases and
    fundamental issues in modern computing and information systems.


    **Prof. Ankur Gupta** is the Director at the Model Institute of Engineering and
    Technology, Jammu (India), besides being a Professor at the Dept. of Computer
    Science and Engineering. He has 25+ years of experience spanning industry and
    academia. Prior to joining MIET, he worked as a Team Leader at Hewlett-Packard,
    India at Bengaluru. He has 85 published research papers in international journals/conferences.
    Prof. Gupta holds B.E (Hons.) CS and MS degrees from BITS, Pilani and PhD from
    NIT, Hamirpur. He has 11 patents granted and 34 patents filed at the Indian Patents
    Office. He is the inventor of the Performance Insight 360, quality analytics framework
    for higher education which has received several accolades. He has received the
    DSFT-FIST Grant in 2012, first in the private sector in J&K and received competitive
    grants over Rs. 2.5 Crore from various funding agencies. He is a recipient of
    the AICTE Career Award, faculty awards from IBM, EMC and Rs. 2 crores in funding
    from Govt. agencies. He is also Senior member IEEE and ACM and founder of the
    International Journal of Next-Generation Computing. His research interests are
    in cloud computing, P2P networks, network management, artificial intelligence
    and metaverse.'
