  md: '# Predicting asthma control test score using machine learning regression models


    Krishna Modi

    Department of CSE, Indus Institute of Technology and Engineering, Indus University,
    Ahmedabad, India


    Ishbir Singh

    Department of ME, Indus Institute of Technology and Engineering, Indus University,
    Ahmedabad, India


    Yogesh Kumar

    Department of CSE, School of Technology, Pandit Deendayal Energy University, Gandhinagar,
    Gujarat, India


    ABSTRACT: Asthma, a chronic respiratory condition, affects millions of individuals
    worldwide. Accurate prediction of Asthma Control Test (ACT) scores holds immense
    value for personalized healthcare interventions. This study embarks on the challenge
    of forecasting ACT scores by harnessing weather and demography features. Employing
    advanced feature engineering and rigorous data preprocessing, we investigate eight
    regression models: K-Nearest Neighbors, Logistic Regression, Decision Tree, Support
    Vector Machine (SVM), Random Forest, Deep Neural Network (DNN), ADA Boost, and
    XGBoost. Our primary objective is twofold: to evaluate the predictive ability
    of these models in the context of asthma and to conduct a comprehensive comparative
    analysis. The results unveiled each model''s efficacy and limitations in estimating
    ACT scores, paving the way for their real-world applicability. Among our findings,
    we observed noteworthy variations in model performance, with Random Forest and
    XGBoost emerging as the top-performing models due to their adeptness in minimizing
    prediction errors. Furthermore, our investigation illuminates the profound correlations
    between weather and demography features and ACT scores, underscoring the potential
    of environmental data in optimizing asthma management and control. This research
    offers valuable insights into the prediction of asthma control test scores based
    on weather and lifestyle features. Through comprehensive experimentation, we vary
    key hyperparameters such as the number of neighbours in KNN, the maximum tree
    depth in DT, the number of estimators in RF, kernel functions in SVM, and the
    number of iterations in DNN, among others. Our findings, coupled with the proposed
    method for future research, offer promising prospects for enhancing asthma management
    and personalized healthcare.


    # 1 INTRODUCTION


    Asthma is a considerable health and economic burden globally. Due to increasing
    cases of Asthma, there is a growing demand for effective strategies to predict
    asthma control, enabling tailored interventions and improved patient outcomes.
    In this pursuit, machine learning is proven to be a promising tool for the early
    diagnosis and management of lifestyle diseases.


    The primary goal of this study is to determine the efficiency of ML models in
    the diagnosis of asthma, and, to conduct a comprehensive comparison of the performances
    of several ML models. Specifically, our focus lies in forecasting ACT scores,
    a pivotal measure of asthma control, by leveraging a combination of weather and
    lifestyle features. This approach not'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'only contributes to the field of asthma management but also provides a foundation
    for the broader application of ML in healthcare diagnostics.

    Asthma diagnosis and management have historically relied on conventional clinical
    assessments and expert judgment. However, the limitations of these methods, including
    subjectivity and the inability to capture nuanced patterns, necessitate a paradigm
    shift towards data-driven approaches. ML, with its capacity to discern complex
    relationships within vast datasets, offers a promising avenue to enhance asthma
    care.

    Our research employs a diverse set of ML models, ranging from traditional regression
    techniques to advanced ensemble methods, each integrated with feature engineering
    and data preprocessing. This approach not only evaluates the predictive capabilities
    of these models but also uncovers insights into their relative strengths and limitations
    in estimating ACT scores. Our evaluation criteria include Mean Absolute Error
    (MAE), Mean Squared Error (MSE), Mean Absolute Percentage Error (MAPE), Root Mean
    Squared Error (RMSE), and Variance, allowing for a comprehensive assessment.


    # ## 2 BACKGROUND


    Asthma represents a global healthcare challenge, impacting the lives of approximately
    262 million people in 2019. (Vos, T. et al. 2020) Tragically, this condition also
    contributed to nearly 4.5 million deaths during the same year (Vos, T. et al.
    2020), highlighting the critical need for effective asthma management strategies.


    The World Health Organization (WHO) has emphasized the significance of avoiding
    asthma triggers as a fundamental approach to reducing asthma symptoms and enhancing
    overall control. This underscores the importance of proactive asthma management.
    In response to this imperative, our study seeks to predict ACT scores early, employing
    lifestyle and weather conditions as predictive factors. The overarching aim is
    to empower individuals with the knowledge and tools necessary to preemptively
    avoid asthma triggers, ultimately reducing the incidence of asthma cases.


    The Asthma Control Test (ACT) is a well-established and widely recognized tool
    in the field of asthma management. The ACT is designed to assess and quantify
    the level of asthma control in individuals with asthma. Development of the ACT
    and its validation as a reliable measure of asthma control is discussed by Nathan,
    R. A et al. (Nathan et al. 2004) ACT scores typically range from 5 to 25, with
    higher value indicating improved asthma control. These score help categorize individuals
    into well-controlled, partially controlled, or uncontrolled asthma categories.


    By forecasting ACT scores based on lifestyle choices and weather conditions, our
    research aligns with global efforts to mitigate the burden of asthma. It aspires
    to provide individuals with actionable insights that can inform their decisions
    and enable them to make lifestyle adjustments to avoid known triggers. In this
    way, our study not only contributes to the advancement of asthma management but
    also carries the potential to impact public health positively.


    In recent years, researchers have been increasingly taking advantage of the power
    of machine learning (ML) to advance our healthcare system.(Amaral JLM et al.)
    Many studies have been proposed for detecting asthma using EHR data.(Bose S. et
    al.) Katsuyuki et al. have explored deep learning models for adult Asthma diagnosis,
    concluding that Deep Neural Networks (DNN) outperform classical Machine Learning.(Tomita
    K et al.) They have claimed to achieve an accuracy of 0.98. Radiiah H. and Sin-Ban
    utilized DNN model to predict asthma exacerbation. (Haque et al. 2021) Their approach
    is recognizing the significant impact of environmental factors on asthma control.
    They were able to achieve 0.94 accuracy with ADAM optimizer. Notably, the dataset
    employed in our study is derived from their research efforts, serving as the cornerstone
    of our investigation.'
