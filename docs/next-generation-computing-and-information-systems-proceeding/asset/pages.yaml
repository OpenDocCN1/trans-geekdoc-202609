    # 4.8 Naïve Bayes algorithm


    The Naïve Bayes technique is a probabilistic classification approach frequently
    used in machine learning for classification difficulties, such as text categorization,
    spam detection, sentiment analysis, and others (Rincy and Gupta 2020). Bayes''s
    Theorem may be expressed in a straightforward mathematical manner as follows:


    P(A|B) = P(B|A) * P(A) / P(B)  (9)


    The marginal probability of an occurrence, P(A), is termed the prior, and the
    probability we''re interested in, P(A|B), is called the posterior.


    # 4.9 Soft voting ensemble


    The decisions of numerous classifiers are combined using the multiple classifiers
    voting technique. It involves creating a classifier for each of the smaller, equal
    subsets of the training dataset that are created. Soft voting has been used in
    which the individual models'' predictions are weighted based on their confidence
    scores, and the final prediction is made by considering these weighted contributions.
    The accuracy of these classifiers has been improved when voting is applied to
    classification algorithms(Rincy and Gupta 2020).


