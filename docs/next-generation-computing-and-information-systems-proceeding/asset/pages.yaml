    # 3.2 Data preprocessing


    Pre-processing the dataset is an important step to extract meaningful insights
    and construct accurate predictive models. Initially, Pandas DataFrame is used
    to load the data and enables efficient data manipulation and exploration. It provides
    robust functionality to identify missing values in any column as well as identify
