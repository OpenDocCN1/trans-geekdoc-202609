    # 4.3 Training setup


    A non-linear CNN has used to train the model. All the dataset has captures with
    a commonly co-related features having minimum 8 common features. All the images
    are corrupted with a 0dB noise insertion technique to create a noisy training
    module. Initially we have selected the 256 samples to verify the level of the
    selected dataset for the selected model CNN and DNN. The samples are almost 56%
    overlapped (shown in the Figure 2). The CNN architecture has shown in Figure 3.
    The features are adjusted based on their magnitude and dimensions for the best
    fit of model selection.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_172_0.png)


    # Figure 3. CNN architecture and layering over selected dataset.


    A seven-layer DNN model selection has been also applied to measure and predict
    the correct the distance vector as discussed earlier in section-3. The detailed
    layer is shown in Figure 4. In Figure 4 a series of convolution layer has shown
    to invoke the deep neural network. Each layer filters and refine the input images
    taken from the previous layer. Here the CNN takes only 2D images to extract the
    text and characters set from the selected image'
  merge: -1
  img_proc: true
- pgno: 173
  md: '(Cao et al. 2023). This function is done by a series of kernels associated
    with the GPUs. The last 3 layers are connected to each other only based on a partially
    fixed overlapped input. This has done only to improve the training speed of the
    system. All the layers are cleverly depending on the selected sequence number,
    weight, and measured biases.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_173_0.png)


    Figure 4. Seven-layer DNN architecture for character recognition.


    By using the last 3 layer of the architecture this work receives an improved evolution
    metrics which are specific to the selected dataset. The evaluation metrics shows
    the accuracy of the selected models for classification. All these accuracies signify
    has calculated by by using the following well-known formula:


    $$Accuracy_{Model} = \frac{TruePositive + TrueNegative}{TruePositive + FalsePositive
    + FalseNegative + TrueNegative}$$


    A batch of 128 epochs were used for 14 times to finalize the minimum mean square
    error based on only 10 % of testing datasets. The error ratio was only 1.99 %
    whereas the success rate for each epoch is approx. 97.4%


    ![](img/9eefc6d2972274efeb1680c6a31895e5_173_1.png)


    Figure 5. Proposed framework for data preprocessing, validation, training, model
    selection architecture.


    # 5 RESULT AND DISCUSSION


    In this paper we have performed three types of experiments on all the selected
    datasets. First-one is on the basis of Objective Evaluation of 2D text based images,
    second is based on Subjective Evaluation based on 2D text images and last-one
    is based on hybrid comparison (selection of both objective and subjective). As
    we have discussed in the previous section all three experiments has divided into
    2 parts based on DNN and CNN.'
