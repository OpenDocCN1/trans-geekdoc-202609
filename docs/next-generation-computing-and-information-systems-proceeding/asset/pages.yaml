    ABSTRACT: To avoid the “feeling out of control” caused by the redundant information

    of the human-computer interface to the doctor, based on the cognitive model of
    the doctor

    during the operation, the human-machine interaction criterion in the augmented
    reality

    surgical navigation system is proposed. Aiming at the multi-sensory information
    fusion

    problem of AR navigation interface, a human-computer interaction paradigm based
    on

    eGOMS model is proposed. To objectively evaluate the human-computer interaction

    usability of the AR navigation system, the analytic hierarchy process was used
    to construct

    the human-computer interaction usability evaluation index system, and the fuzzy
    theory was

    used to comprehensively assess the human-computer interaction usability of the
    AR navi

    gation system. The evaluation result of the system is good, and it can be applied
    in practice.


    # 1 INTRODUCTION


    Anterior cruciate ligament (ACL) rupture cannot be treated effectively, which
    will seriously

    affect patients’ quality of life (Saxena et al. 2013; Yang et al. 2020). Therefore,
    arthroscopic

    ACL reconstruction surgery is the most common surgical procedure. However, since
    retaining

    the ACL remnant will increase the difficulty of positioning the bone trace, traditional

    arthroscopic ACL reconstruction surgery requires complete removal of the ACL remnant

    (Liu 2020). Therefore, the ACL reconstruction with residual remnants is the development

    trend of ACL reconstruction surgery (Soni et al. 2018; Yang and Chen 2009). Augmented

    Reality (AR) technology is an effective method to enhance the perception of a
    minimally

    invasive surgical environment (Li et al. 2021). It can assist doctors in accurate
    target posi

    tioning while preserving the remnants and improving postoperative rehabilitation
    effect and

    patients’ quality of life; it can also provide doctors with rich anatomical structures,
    expand the

    doctor’s surgical field of vision, and reduce the difficulty of surgery (Wang
    and Xu 2020).'
