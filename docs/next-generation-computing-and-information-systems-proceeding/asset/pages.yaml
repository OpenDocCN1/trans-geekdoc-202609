  md: 'This equation is based on vectors in just two dimensions. However, this holds
    for any arbitrary number of dimensions. This is the hyperplane''s equation.


    ```

    $$h(x_i) = \begin{cases} +1if w \cdot x + b \ge 0 \\ -1if w \cdot x + b < 0 \end{cases}$$
    (1)

    ```


    Points that are located above or on the hyperplane are allocated to class +1,
    whereas points that are located below the hyperplane are assigned to class -1.


    # 4.5 K-Nearest neighbors algorithm


    This approach can be used to solve regression and classification issues similarly.
    We''re employing classification here. KNN selects the desired number of examples
    (K) closest to the query by measuring the distances between each example in the
    data and the query. It then selects the label that appears the most frequently
    or averages the labels in the case of regression (Masael S. Aldayel 2012).


    The Euclidean metric will be used as the distance metric of choice.


    ```

    $$d(x, x^1) = \sqrt{(x - x_1^i)^2 + ... (x_n - x_h^1)^2}$$ (2)

    ```


    Finally, the input x is allocated to the most probability class.


    ```

    $$P(y = j|x = x) = \frac{1}{k} \sum_{i \in A} I(y^{(i)} = j)$$ (3)

    ```


    # 4.6 Random forest algorithm


    Random Forest, or Ensemble machine learning, connects several classifiers to tackle
    a difficult problem. The majority of voting predicts data outcomes. Prediction
    class voting occurs among trees. The majority-voted class wins. Random Forests
    sometimes use the Gini index to decide the order of nodes on a decision tree branch
    when categorizing data.


    ```

    $$Gini = 1 - \sum_{i=1}^{c} (p_i)^2$$ (4)

    ```


    The Gini of each branch on a node is calculated using the class and probability
    to establish the most probable branch. Entropy may also be used to establish the
    relationships between nodes in a decision tree (Dong et al. 2020).


    ```

