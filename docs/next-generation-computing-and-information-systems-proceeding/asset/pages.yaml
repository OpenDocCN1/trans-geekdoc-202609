  md: '# Time series analysis of vegetation change using remote sensing,

    GIS and FB prophet


    Pushpendra Kushwaha, Azra Nazir, Rishita Bansal & Faisal Rasheed Lone


    School of Computer Science & Engineering, VIT Bhopal University, Madhya Pradesh,
    India


    ABSTRACT: Forecasting techniques are crucial for any industry or field that benefits
    from anticipating future events or trends, allowing for better planning, resource
    allocation, and decision-making. Modern agriculture necessitates efficient land
    use and the reconversion of wastelands to productive terrains. This study seeks
    to harness forecasting techniques tailored for time series data to detect potential
    wastelands ripe for conversion into Greenlands, aiming to boost agricultural yield.
    The time series analysis of NDVI (Normalized Difference Vegetation Index) assesses
    vegetation cover changes over time, identifies trends and patterns, and maps the
    areas with potential restoration. The time series data is processed and analysed
    using advanced techniques such as season decomposition and statistical modelling
    to identify the significant changes in vegetation behaviour, specifically focusing
    on incorporating the FBprophet model to elucidate the temporal patterns and underlying
    factors influencing vegetation dynamics. In this study, the model is employed
    on 9 years (2013–2022) data of a village in Katoria Bihar (India) that was restored
    from a wasteland into Greenland. The study’s finding showcases the FBprophet model’s
    effectiveness in analysing NDVI time series data and understanding vegetation
    dynamics. By providing more accurate trend decomposition and robust forecasting
    capabilities, the FBprophet model offers a sustainable approach to land utilisation,
    benefitting both local communities and the broader environment.


    # 1 INTRODUCTION


    Forecasting techniques have long been pivotal in diverse sectors, from economics
    to meteorology. Their application to agriculture, especially in the domain of
    land utilisation, remains relatively nascent but exceedingly promising. Time series
    data, with its chronologically ordered information, provides a rich source for
    analysis (Mahalakshmi et al. 2016). This research endeavours to predict where
    wastelands exist and can be rejuvenated by applying forecasting techniques to
    such data. Land use practices, deforestation, and climate change have led to the
    degradation of the local ecosystem and the depletion of critical ecosystem services.
    In response to this critical situation, this study seeks to find solutions utilising
    advanced remote sensing technology and the application of time series analysis
    of the Normalized Difference Vegetation Index (NDVI) to monitor and restore vegetation
    dynamics for better agricultural yield.


    The core approach of this study involves leveraging the capabilities of Google
    Earth Engine (GEE), a powerful cloud-based platform specifically designed to analyse
    vast volumes of satellite imagery and geospatial data. The significance of utilising
    NDVI times series analysis lies in its ability to reveal long-term trends and
    changes in vegetation cover, which is crucial for understanding the dynamics of
    land transformation and recovery. The study seeks to discern vegetation growth
    and decline patterns by monitoring these trends, allowing for informed decision-making
    in implementing targeted restoration efforts. The village of Katoria was chosen
    as a case study for data collection. This village is situated in a'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'region vulnerable to land degradation and desertification. These variations
    make this area ideal for gathering time series data on soil health and vegetation
    cover.


    Remote sensing and GIS have been used to describe the different features of the
    study area. Landsat 8, officially known as the Landsat Data Continuity Mission
    (LDCM), is a satellite operated by the United States Geological Survey (USGS)
    and the National Aeronautics and Space Administration (NASA). Landsat carries
    two main instruments: an Operational Land Imager (OLI) and a Thermal Infrared
    Sensor (TIRS). The OLI sensor captures data in nine spectral bands, including
    visible, near-infrared, and short-wave infra-red. The OLI sensor has improved
    signal-to-noise performance, radiometric resolution, and spatial resolution compared
    to its predecessor. The TIRS sensor measures the Earth''s thermal infrared radiation,
    providing temperature data for monitoring surface temperature and heat emissions.
    Still, the main focus is on OLI sensors for finding the NDVI parameters.


    Traditional forecasting models, like ARIMA, need extensive parameter adjustment
    and expertise in analytics and statistics (Newbold 1983). FBProphet is an open-source
    library created by Facebook that is simple to integrate into an automated production
    system and requires very little domain knowledge (Montgomery et al. 2015). A multifaceted
    approach has been employed to enhance NDVI prediction for vegetation cover. This
    method augments prediction accuracy and ensures the model''s adaptability to dynamic
    environmental conditions. By implementing cloud removal algorithms on satellite
    imagery, the hindrance caused by cloud cover is mitigated, thereby increasing
    the frequency of available training data.


    Additionally, a classification algorithm to generate a vegetation-only mask allows
    for a more precise calculation of NDVI by isolating vegetated areas. To further
    elevate the model''s performance, the image source is visited with the shortest
    revisit times, enabling the capture of rapid changes in NDVI, which is especially
    crucial for real-time monitoring. This approach extends beyond routine predictions;
    it encompasses identifying and integrating significant events such as natural
    disasters, droughts, or forest fires, which can trigger substantial NDVI variations.
    By incorporating prediction errors as a regressor within the FBProphet model,
    a feedback loop continually refines forecasts and bolsters accuracy. This holistic
    and data-driven strategy ensures the comprehensive improvement of NDVI predictions
    for accommodating the ever-changing landscape and environmental influences.


    # 2 RELATED WORK


    Numerous studies have been conducted for NDVI analysis across various problem
    areas utilising Time Series Analysis. A multi-resolution analysis (MRA) based
    on the wavelet transform(WT) has been implemented in (Martinez and Gilbert 2009a)
    to study NDVI time series. (Waylen et al. 2014) provides an in-depth survey for
    finding vegetation and deforestation of the earth from image processing. (Martinez
    and Gilbert 2009b) deals with remote sensing and normalised difference vegetation
    index with various techniques. The authors extensively cover theoretical and empirical
    contributions to image processing in the current decade. Also, NDVI generation
    using various deep learning techniques has been examined in (Zaidi et al. 2017).
    A study consisting of the NDVI forecasting model, which is based on the combination
    of Time Series Decomposition (TSD), Long Short-Term Memory (LSTM) and Convolutional
    Neural Network, was proposed in (Gao et al. 2023). Two forecasting models of temperature
    and precipitation based on their historical information and four NDVI forecasting
    models based on temperature, rain, and their historical information were established
    to confirm the performance of the TSD-CNN-LSTM model and investigate the response
    of NDVI to climatic factors. When the findings of the correlation analysis are
    combined, it can be concluded that temperature has the greatest significant influence
    on NDVI changes, followed by precipitation, which has the most minor influence.
    (Khamchiangta and Dhakal 2020) conducted a comprehensive comparative analysis
    of different forecasting models for NDVI, including traditional time series methods,
    deep learning'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'approaches, and FBprophet. Their work provided valuable insights into the strengths
    and limitations of each model. The results indicated that FBprophet consistently
    outperformed other methods in capturing the seasonality and trend patterns inherent
    in NDVI data. (Kumar Jha and Pande 2021) explored the application of machine learning
    models, including FBprophet, for NDVI forecasting. Their study demonstrated the
    potential of FBprophet in capturing the seasonal and long-term trends in NDVI
    time series, which is crucial for assessing vegetation health and land-use management.
    They highlighted the model''s ability to handle missing data points and outliers,
    making it suitable for real-world applications.


    # 3 METHODOLOGY


    FBProphet model breaks down any time series data into components related to trends,
    seasonality, events, or holidays. It can be expressed using equation 1, where
    T(t) is the logistic or piecewise linear growth curve for trend component modelling.
    Cycles in the time series (daily, weekly, monthly, and quarterly) are denoted
    by the symbol S(t). H(t) is the impact of unplanned occurrences or holidays, a
    noisy phrase impossible to model mathematically.


    \(Y(t) = T(t) + S(t) + H(t) + \epsilon\)


    It is important to emphasise that FBProphet considers forecasting an endeavour
    of curve fitting rather than the typical time-based interdependencies. This new
    viewpoint is essential to FBProphet''s ability to produce precise predictions
    with low requirements for domain-specific knowledge. The time series data is divided
    into trend, seasonality, and residual as part of the decomposition process. The
    trend is the time series'' long-term trend or direction. Seasonality is the recurring
    and periodic patterns in a time series that happen daily, weekly, or annually.
    In residual, the prophet allows the inclusion of holidays and special events as
    additional components that can impact the time series. It''s crucial to emphasise
    the importance of choosing the right type (Logistic Growth or Piecewise Linear)
    based on the characteristics of the data. For example, the Logistic Growth Model
    should be selected if the NDVI data exhibits signs of saturating growth. On the
    other hand, if the NDVI data shows linear features with past growth or shrinking
    tendencies, the default Piecewise Linear Model is preferable. This model can accommodate
    linear trends, making it suitable for various business and environmental data.
    The mathematical representation of the model is given by equation 2. Here, C is
    the carrying capacity, representing the maximum limit that a saturating growth
    model can reach. It should be set to reflect the data''s capacity for growth.
    The growth rate parameter that influences the rate at which the data approaches
    the carrying capacity is given by k. It should match the data''s actual growth
    rate. Also, m is the model''s offset parameter for a vertical shift. It can be
    adjusted to align the model with the data.


    \(g(t) = \frac{C}{1 + e^{-k(t-m)}}\)


    The piecewise linear model is fit using statistical equation 3, where c is the
    trend change point, which can be fine-tuned per the requirement.


    \(y = \begin{cases} \beta_0 + \beta_1 x & x \le c \\ \beta_0 - \beta_2 c + (\beta_1
    + \beta_2)x & x > c \end{cases}\)


    # 4 EXPERIMENTAL SETUP AND DATASET


    The study area in this paper is located in the outer regions of Bihar. The village
    of Katoria is near the Banka district. The village was barren, which made it unsuitable
    for cultivation, and'
