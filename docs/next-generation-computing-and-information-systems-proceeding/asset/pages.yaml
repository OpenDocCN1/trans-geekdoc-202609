  md: '# Survey on detection of bone cancer using deep learning-based techniques


    Harshit Vora & Seema Mahajan

    Indus University, Ahmedabad, India


    Yogesh Kumar

    Pandit Deendayal Energy University, Gandhinagar, India


    ABSTRACT: The early detection and precise diagnosis of bone cancer are essential
    for efficient treatment planning because it is a serious and potentially fatal
    condition. Among the various types of diseases, cancer may be one of the most
    dangerous. The manual interpretation of medical imaging scans used in traditional
    methods for bone cancer detection can be time-consuming and prone to human error.
    Deep learning techniques have recently shown promise as tools for automatically
    detecting bone cancer. Among all cancers, bone cancer may be the leading cause
    of death. Based on this survey researchers are using some different techniques
    for the prediction of bone cancer. The first test performed when there is a possible
    bone tumor is suspected is a bone X-ray. The best method for determining osteosarcoma
    from the bones is to use imaging tests and X-rays. The suggested procedure for
    obtaining a conclusive diagnosis is a biopsy. This is a difficult and laborious
    technique that can be done automatically. We present many supervised deep-learning
    methods and select the optimal model. These decisions are made by analyzing user
    data to detect bone cancer. We show that the selected model obtains the maximum
    accuracy of 90.36% and the highest precision of 89.51% in the prediction tests
    using the residual neural network (ResNet101) algorithm.


    # 1 INTRODUCTION


    One of the conventional types of bone cancer is osteosarcoma, also known as osteogenic
    sarcoma. There are three classifications for this cancer critical, medium, and
    basic. The grade indicates cancerous cells spread quickly to other bodily parts.
    Osteosarcoma typically develops between the ages of 10 and 25, particularly in
    adolescence, and recurs in later life around age 60. This tumor damages good bone
    tissues and results in malignancy because the malformed bone cells lead to bone
    fractures, wound infections, and sluggish recovery. One method for detection is
    to look for osteosarcoma (Shukla and Patel 2020). Approximately 20 out of every
    100 patients have an infection when they are initially diagnosed with bone cancer.
    Numerous researchers have attempted to employ Deep-Learning techniques to identify
    bone cancer in people and have found them to be rather effective in doing so.
    We have developed a model in this study to identify bone cancer in its very early
    stages. As such, bone cancer needs to be detected automatically. Predicting cancer,
    preventing it, and controlling it are major difficulties in the healthcare sector.
    This paper proposes to automatically forecast the likelihood of sickness by using
    supervised deep-learning algorithms. Four methods were used in the construction
    of this conceptual framework: Residual Network 101 (ResNet101), Dense Convolutional
    Network 201 (DenseNet201), Visual Geometry Group 19 (VGG19), and Visual Geometry
    Group 16 (Shukla and Patel 2020).'
