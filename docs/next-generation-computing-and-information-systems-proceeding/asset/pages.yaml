  md: 'classifications (Koul et al. 2023). On applying these learning models for detecting
    hypertension, they process diverse patient information, such as medical history,
    demographic data, lifestyle factors, and psychological measurements based on which
    likelihood of an individual having hypertension is predicted. In addition, this
    approach allows for early intervention and lifestyle adjustments for individuals
    who can be at risk of hypertension. It can also adapt and improve over time as
    more data is collected, ensuring that predictions are continuously enhanced for
    accuracy and reliability (Kaur et al. 2022).


    In this context, this paper presents the development of an AI learning model which
    uses various algorithms such as voting classifier, Gradient Boosting, AdaBoost,
    XGBoost, CatBoost, Light Gradient Boosting, and Multi layer perceptron to detect
    and assess hypertension in individuals. These algorithms are trained using historical
    data of patient to learn the intricate relationships between different risk factors
    for finding the presence of hypertension.


    # 2 LITERATURE SURVEY


    This section informs us regarding the work conducted by researchers to detect
    the hypertension by using machine and deep learning models. Martinez-Rios et al.
    (2022) proposed wavelet scattering transform to extract features from PPG data.
    The analysis demonstrated that on combining support vector machine with PPG features
    classified pre-hypertension and normotension with an accuracy and an F1-score
    of 71.42% and 76% respectively. Aras et al. (2023) assessed the impact of deep
    learning approach for detecting pulmonary hypertension and classifying its sub
    types using EEG data. The researchers performed their work by collecting the data
    from the University of California where patients with right heart catheterization
    were identified as non PH or PH retrospectively. Using 12- lead ECG voltage data,
    a CNN model was trained and from among 21470 patients, it computed the highest
    accuracy in detecting PH subtypes with an AUC-ROC of 0.79–0.91. The model also
    performed well when applied to ECGs obtained up to 2 years before PH diagnosis
    and showed an area under the curve of 0.79 or greater. Fang et al. (2023) mentioned
    that in China, the awareness, treatment, and control rate of patients who have
    been suffering from hypertension significantly improves to 51.6%, 45.8%, and 16.8%
    respectively but is still unsatisfactory. They also mentioned the opinion of the
    clinical studies which suggested that effective drug therapy or change in the
    lifestyle could significantly reduce the progression of the disease for those
    at risk. Keeping it in view, the researchers proposed a model that merged KNN
    and LightGBM for predicting the hypertension for the next five years by computing
    86% accuracy and 92% recall rate. Silva et al. (2022) conducted a systematic review
    for analysing the contribution of existing techniques to predict hypertension.
    The authors screened as well as compared 21 articles from Jan 2018 to May 2021
    using the ASRview algorithm on the basis of variable selection, data balancing,
    train-test split, performance metrics etc. The reviewed articles demonstrated
    extreme gradient boosting (XGBoost), support vector machine (SVM), and random
    forest emerged as the most effective algorithms in predicting hypertension risk.
    LaFreniere et al. (2016) identified various risk factors on the basis of current
    health conditions, demographics, and medical records of patients. These factors
    were used for predicting the presence of hypertension in individuals and assessing
    the likelihood of future hypertension development which served as an early warning
    system. Researchers used a neural network model which resulted in an accuracy
    of 82% for the dataset consisted of 185,371 patients and 193,656 controls. In
    addition to this, a literature review was also conducted to highlight the use
    of these risk factors in other research, accompanied by experimental results obtained
    from their developed model.


