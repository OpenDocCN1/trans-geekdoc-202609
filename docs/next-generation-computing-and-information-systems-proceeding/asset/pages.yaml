    # 4.2 Comprehensive evaluation based on fuzzy theory


    The fuzzy evaluation method is based on fuzzy mathematics, applying the synthesis
    principle of undefined relationships, quantifying some factors with unclear boundaries
    and challenging to quantify, and comprehensively evaluating the affiliation status
    of the considered object from multiple aspects (Wang et al. 2011; Yao et al. 2021;
    Zhou et al. 2021).


    +   1) Determine the set of evaluation factors and the set of evaluation grades.

