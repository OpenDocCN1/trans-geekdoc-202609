  img_proc: true
- pgno: 115
  md: 'The recursion graph can intuitively map the motion state in the high-dimensional
    phase space of the signal to a two-dimensional plane, thereby reflecting its nonlinear
    dynamic characteristics. When the distance D<sub>ij</sub> between X<sub>i</sub>
    and X<sub>j</sub> is less than ε, it means that the states between X<sub>i</sub>
    and X<sub>j</sub> are very similar, that is, the motion state appears recursive,
    and the value of R<sub>ij</sub> is 1 and is represented by black dots in the figure;
    on the contrary, when the distance D<sub>ij</sub> between X<sub>i</sub> and X<sub>j</sub>
    is greater than ε, it means that the motion state between them is very different.
    Currently, the value of R<sub>ij</sub> is 0 and it is represented by a white dot
    in the figure (Herzberg et al. 2021). The recursive graph and the threshold-free
    recursive graph of the pulse signal. Although the recursive graph can express
    the pulse''s recursive characteristics in an intuitive way, it lacks detailed
    features; while the threshold-free recursive graph can effectively retain detailed
    information and has richer nonlinear dynamic features (Ambaw et al. 2020). As
    a result, there are more recursive points and a bigger circular region formed.
    There is a curve extending from the upper left vertex to the lower right vertex
    in the figure, which reflects the overall waveform characteristics of the pulse
    signal from rising to falling.


    # ## 2.3 CNN and VGG-16 network


    CNN is a deep neural network with convolutional structure, which has a wide range
    of applications in speech recognition and image segmentation. Convolutional neural
    networks usually consist of convolutional layers, down sampling layers, and fully
    connected layers.


    The convolution layer contains multiple convolution kernels. Through local connection
    & weight sharing, the convolution kernel convolves the input data to obtain the
    features w.r.t. the data. The first convolutional layer extracts some preliminary
    data features to form multiple feature maps, which are then used as input to the
    next convolutional layer to obtain deep abstract features. The mathematical expression
    of the convolutional layer is:


    ```

    x_j^{(l)} = f(x_i^{(l-1)} * W_{ij}^{(l)} + b_j^{(l)})

    ```


    In the formula: "*" represents the convolution operation; x_j^{(l)} represents
    the output of the j<sup>th</sup> layer after the j<sup>th</sup> convolution kernel
    convolution operation, that is, the input of the l + 1 layer; W_{ij}^{(l)} represents
    the convolution kernel; b_j^{(l)} denotes the bias value; f(\cdot) denotes the
    activation function.


    Down sampling layer is also called pooling layer. The dimension of the feature
    vector obtained after convolution increases, and if it is directly used for training,
    it will increase the computational load and complexity of the network. Since the
    3 fully connected layers in VGG-16 have many parameters, they were originally
    designed for 1000 classification categories, and this paper is only for two classifications.
    Therefore, this paper replaces the original 3 fully connected layers with 2 fully
    connected layers to reduce the number of channels in the fully connected layer
    (Wen and Mario 2019). In the improved VGG-16, 15 weight layers are included, which
    are 13 convolutional layers and 2 fully connected layers. Dropout is added after
    the two fully connected layers to suppress overfitting caused by too large convolution
    parameters, making the network more generalizable (Pengju et al. 2021).


    # ## 3 EXPERIMENTS AND RESULT ANALYSIS


    # ### 3.1 Experimental data


    The pulse diagnosis data of patients with coronary heart disease mainly come from
    Shanghai Zhongshan Hospital Renji Hospital, Municipal Traditional Chinese Medicine
    Hospital, Shu Guang Hospital, a total of 1612 cases; the pulse diagnosis data
    of healthy people are researched by Chinese Medicine Information, Shanghai University
    (Chang et al. 2022).'
