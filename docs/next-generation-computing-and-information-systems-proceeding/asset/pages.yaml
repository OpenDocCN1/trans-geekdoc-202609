  img_proc: true
- pgno: 83
  md: 'Augmented reality navigation systems have the following three characteristics:
    (1) virtual-real fusion; (2) precise “alignment”; (3) real-time interaction. Although
    the surgical navigation system has been used for more than 20 years, the current
    interactive technology still has shortcomings in terms of stability, perception
    and feedback, limited by hardware technology (Lu et al. 2010). Therefore, augmented
    reality navigation systems, especially those based on an optical perspective,
    are very different from traditional human-machine interfaces. Its information
    channels are more diverse, so the interaction mode is very different from the
    traditional human-machine interface (Zhao et al. 2013). In addition, during surgery,
    doctors are under high stress. Therefore, smooth and comfortable human-computer
    interaction is essential. On the other hand, the redundant information in the
    human-machine interface may distract the doctor’s energy and make the doctor feel
    “out of control” (Lee et al. 2011).


    # 2 OPTICAL FLUOROSCOPY-BASED SURGICAL NAVIGATION SYSTEMS FOR ACL RECONSTRUCTION


    # 2.1 Surgical navigation system


    # 2.1.1 System structure


    As shown in Figure 1, this paper proposes an augmented reality navigation system
    based on HoloLens. The system includes a CT machine, C-arm, PC, Micron Tracker,
    and HoloLens. The relationship between the nine modules of the ACL navigation
    system based on augmented reality technology is as follows:


    +   - The position tracking module provides the entire system with the position
    information of each tracking target (calibrator, surgical target, calibration
    block and HoloLens). The position information is collected by Micron Tracker and
    transmitted to other modules through the UDP protocol;

    +   - The C-arm space registration module can realize the registration of X-ray
    images and the surgical space, and the registration results can provide parameter
    support for the 2D-3D registration module; 2D-3D registration module can realize
    the registration of the pre-operative CT image and the intraoperative X-ray image;

    +   - The virtual-real registration module can recognize the spatial registration
    between the virtual space and the actual scene; as a result, information such
    as virtual models, path planning, etc. accurate scene fusion display;

    +   - 3D reconstruction module can realize 3D reconstruction of preoperative CT
    images and provide a 3D data model for 2D-3D registration, path planning and visual
    presentation.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_83_0.png)


    Figure 1. Augmented reality system structure of ACL reconstruction system.


    # 2.1.2 Navigation process


    The usage flow of the ACL navigation system based on augmented reality technology
    is as follows:'
