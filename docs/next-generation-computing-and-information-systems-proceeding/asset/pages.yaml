  md: '# A seven layer DNN approach for social-media multilevel image-based text classification


    Veena Tripathi, Navin Mani Upadhyay & Saurabh Sharma


    Model Institute of Engineering and Technology, Jammu, J&K, India


    ABSTRACT: In recent years, social media platforms have played a significant role
    in disaster management. To extract valuable insights and understand the meaning
    behind social media text content, using conventional machine learning methods,
    text mining solutions have been created. Through these techniques, messages are
    intended to be categorized into several themes, such counsel and caution. Nevertheless,
    these methods frequently focus on a single event and have trouble generalizing
    to cross events classifications. The effectiveness of traditional models trained
    on historical data for classifying social media messages from future events remains
    unclear. Our research focuses on the efficacy of a CNN model in classifying Twitter
    topics across diverse events. Three geotagged datasets from twitter gathered during
    the COVID-19 pandemic''s management are the subject of this study. Two conventional
    machine learning techniques (LR and SVM) are contrasted with the CNN model''s
    performance. Our experiments conclusively show that the CNN model significantly
    surpasses the performance of both SVM and LR models in terms of accuracy, regardless
    of whether the evaluation is based on individual events or across different events.
    This implies that the CNN model may efficiently categorize messages for impending
    events and pre-train on Twitter data from past occurrences, improving situational
    awareness. In conclusion, this study demonstrates the CNN model''s capability
    compared to traditional machine learning techniques for disaster management.


    # 1 INTRODUCTION


    The field of natural language processing has made significant progress in the
    realm of multi-label text categorization. Various practical domains heavily rely
    on multi-label text categorization to handle the diverse and complex nature of
    textual data. However, existing approaches that solely depend on word vector representation
    fall short in fully expressing the semantics of the text, leading to subpar accuracy
    in classification tasks. This study introduces a technique that enables the classification
    and search for visually similar texts and images within a dataset based on factors
    such as form, color, business sector, semantics, general qualities, or a combination
    thereof, as specified by the user (Dao et al. 2023). The proposed approach aims
    to enhance the efficiency of finding visually similar texts by integrating the
    results of multiple multilevel deep neural networks, each trained to focus on
    specific characteristics for conducting similarity searches. However, existing
    methods often overlook the correlation between labels and the semantic context
    of each label. To address this limitation, this paper presents a neural network-based
    approach for text multi-label learning that effectively models the correlation
    between texts and label vectors (Wang et al. 2023) . By capturing the semantic
    correlation between text and labels, the proposed method surpasses existing approaches,
    particularly when dealing with large datasets, as evidenced by a series of experiments.
    The Framework has shown in Figure 1.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/9eefc6d2972274efeb1680c6a31895e5_170_0.png)


    Figure 1. Framework for identification of multiple labels in social media text.


    # 2 LITERATURE SURVEY


    Numerous research publications on the identification of multiple labels in social
    media have been published during the last several years. Most of the proposed
    work is based on a hybrid neural network model that combines one or more number
    of algorithms (Dao et al. 2023; Gao et al. 2019; Hou et al. 2020; Tao et al. 2018;
    Nasersharif et al. 2021; Yang et al. 2022). Another researcher (Khan et al. 2020
    and Yuan et al. 2021) has worked on DNN based on twitter and abnormal text activities.
    There findings are also good but not user friendly based on scalability of systems
    or using the application by more number of users. (Yang et al. 2022) has used
    a regression based text extraction from logo and (Saeedi et al. 2013) has improved
    their concept by using a CNN based regression algorithm.


    Strong demand exists in the DNN area for high-performing multi-label classification
    methods for many purposes, including DNN-based text categorization and detection
    on social media (Miao et al. 2016). The major challenges are based on only and
    a few human annotated textual datasets (Jones et al. 2017), and another one is
    based on lack of high-quality manually labeled data (Takruri et al. 2016).


    To tackle the aforementioned issues, in this work, we initially introduce the
    dataset, taken from kaggle1. It contains 7K real time cases that were annotated
    and divided into input features and outcomes. Deep learning and machine learning
    are two broad categories into which text classification techniques fall. A branch
    of machine learning called deep learning does away with some data pre-processing.
    Two deep learning methods that are useful for text categorization are CNN and
    RNN. To analyze the text content, the study suggests the utilization of multi-channel
    CNN and BiLSTM for feature fusion. Traditional CNN and RNN models often lose important
    feature information, leading to suboptimal classification results.


    In contrast, the multi-channel CNN (Nasersharif et al. 2021) leverages different
    convolution kernels to extract local semantic features. The proposed text vector
    representation is obtained by combining these two components and sigmoid activation
    is used for classification. However, there are still difficulties in investigating
    object connection, temporal information, and low-level visual nottions.


    To tackle these issues, the article proposes correlative binary relevance (CBR)
    classification approach based on DNN and CNN.


    # 3 PROBLEM DEFINITION


    Now a days the dataset on different social media platform has increasing day by
    day which creates problem in identifying the older image text or the real time
    new image with text (Dao et al. 2023). As the size of the dataset expands, so
    does the level of detail in the architectures. This eventually causes the system
    accuracy to become saturated, at which point it diminishes to a certain point
    (say ‘E’). The term for this issue is the degradation problem (DE). The'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'degradation problem may be mathematically represented as follows:


    E = $(y_1, y_2, y_3, \dots, y_k)^T$,


    where E is the degraded final end point, y = {Y1 U Y2 U Y3 ... U Yk}.


    \( D_E = x : ||x - \mu|| = \left[ \sum_{i=1}^n (x_n - \mu)^2 \right]^{\frac{1}{2}}
    = 1 \)


    Where D<sub>E</sub> is the Degraded end point of the feature selection. x<sub>n</sub>
    is the mean of all the features (y1,y2, y3, ... , yk). \(\mu\) is the mean of
    all all-selected features having distance of 1.


    So, the main work is to reduce the distance vector from the above equation D<sub>E</sub>,
    So that the selection of text from a pre-uploaded image can be verified easily.


    # 4 METHODOLOGY


    In this section a detailed methodology has explained in three subsections followed
    by Experimental setup, proposed algorithm and result and discussion.


    # 4.1 Experimental setups


    For all the experiments performs in this research work is based on GPUs (NVIDIA
    GeForce GT 1650RTX). The 1650 RTX uses 16 streaming processors with a frequency
    of 2.8GHz. It has 1024 MBs of cache and a approx. 128-bit L3 channel. The data
    transfer rate for the selected GPU is approx. 1000 GB/s. This is fully enabled
    with parallel programming environment.


    # 4.2 Dataset selection


    A huge dataset has detected on different repository but for this research a recent
    dataset with a dimension of 7000, 3462. These datasets contain public comments
    on social media from the last three-month period specifically tagged with the
    keywords “disaster” “natural disaster”, “god curse”, “calamity” etc. The literature
    has numerous speech, noise, and noisy speech training datasets. The datasets are
    reviewed in Table 1. The major three selected datasets which were used for this
    research are: Voice Bank corpus, RassiaSpeech corpus, and 253_Asian corpus. We
    employed a variety of noise environments, including the Noise corpus and 15 samples
    from the NOISEX-92 corpus, for everything from pre-processing to model selection.
    Figure 2 shows a spectrogram of noise added to the selected dataset.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_171_0.png)


    Figure 2. Spectrogram of noise added to the selected dataset based on seen and
    unseen the social media post.'
