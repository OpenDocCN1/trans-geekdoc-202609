    # 2 RELATED WORK


    This section discusses the research that are most important to this work. The
    following steps are involved in recognizing emotions based on EEG signals: (1)
    EEG signal acquisition; (2) pre-processing; (3) extraction of features and selection;
    and (4) classification. Researchers have used a variety of deep learning algorithms
    to classify emotions using EEG signals.


    Li et al. 2017 [13] implemented a convolutional recurrent neural network (CRNN)
    to extract emotions using multiple channels of communication EEG data. The model
    was trained and tested by the authors using an openly accessible dataset of EEG
    recordings from thirty-two people. The outcomes showed that the suggested techniques
    were successful in addressing the affective aspects of arousal and valence. Alhagry
    et al. 2017 [1] implemented a deep learning classifier that uses Long Short Term
    Memory (LSTM) networks to identify emotions from unprocessed EEG information.
    Arousal, valence, and liking are utilized to categorize the properties that the
    LSTM network learns. Using arousal, valence, and liking classes, respectively,
    the suggested technique when evaluated on the DEAP data set, it achieves an average
    accuracy of 85.65%, 85.45%, and 87.99%. Chao et al. 2019 [4] also introduced a
    deep learning framework for emotion recognition using multiple channels of electroencephalograph
    signals that is built on a capsule network (the CapsNet system) and a multiband
    feature matrix (MFM). Tested on the DEAP dataset, the proposed methodology offers
    average accuracy with arousal, valence, and dominance classes of 70.3%, 70.2%,
    and 70.5%, respectively. Pandey et al. 2019 [14] provide a deep learning model
    for classification and variational mode decomposition (VMD) as a feature extraction
    strategy for subject-independent emotion identification from EEG signals. Using
    a convolutional neural network (CNN) classifier, the recommended approach is tested
    on the DEAP dataset, giving an accuracy of 70.89% in identifying four emotions
