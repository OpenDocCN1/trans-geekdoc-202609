  md: '# 1.1 Motivation


    The main driving force behind this research is the large annual number of cancer
    cases and deaths. The projected number of new cases of male cancer in 2020 is
    shown in Figure 1 (Sharma _et al._ 2021). Deep learning should be utilized to
    diagnose bone cancer for a number of reasons, including the necessity of early
    detection for successful treatment and better patient outcomes. Conventional techniques
    for detecting bone cancer often depend on radiologists evaluating medical pictures
    by hand, a laborious and human error-prone process. By automatically evaluating
    and extracting relevant features from massive volumes of medical imaging data,
    deep learning systems can automate this process. Personalized treatment is made
    possible by deep learning algorithms in the area of bone cancer screening. Deep
    learning systems can identify deep learning algorithms that can learn to recognize
    biomarkers by training models on a variety of patient populations and incorporating
    clinical data, genetic information, and treatment outcomes (Sharma _et al._ 2021).


    # 1.2 Related work


    # 1.2.1 VGG16


    Visual Geometry Group-16’s Convolution Neural Network (CNN) architecture. while
    maintaining the same filling and maxpool layer of 2*2 filter with stride 2. VGG16
    is an architecture for a 16 different shades of CNN. (Sharma _et al._ 2021).


    # 1.2.2 VGG19


    Convolutional neural networks, such as the VGG19 architecture, are extensively
    employed in image classification. The architecture is straightforward but effective,
    and many creative models have been built around it (Shukla and Patel 2020).


    # 1.2.3 DenseNet201


    Building upon the DenseNet foundation, DenseNet201 is a Part of convolutional
    neural network(CNN) architecture. In 2017, Gao Huang and associates created it.
    Feed-forward linking, or connecting each layer to every other layer, is the main
    idea behind DenseNet. This leads to the creation of a dense connection network
    that improves feature reuse and mitigates fading gradient problems. DenseNet201
    is a version of the DenseNet architecture with 201 layers. Applications in computer
    vision, such as object detection and image classification, commonly use it (Gawade
    _et al._ 2023).


    # 1.2.4 Resnet101


    The architecture of the convolutional neural System ResNet101 in 2015. A variation
    of this paradigm known as the “Residual Network” model is the ResNet model. Consequently,
    it is now possible to train very deep System 152 different shades or more deprived
    of running into problems with diminishing gradients. ResNet101 is one version
    of ResNet that has 101 layers. It is widely used for object recognition and image
    arrangement applications and has fragmented previous records for image arrangement
    performance in datasets (Gawade _et al._ 2023).


    # 1.3 Bone cancer types and challenges


    There are several types of bone cancer, each originating from different cells
    within the bone. The basic differences of Bone Tumors are.


    # 1.3.1 Osteosarcoma


    The most prevalent kind of bone cancer, osteosarcoma, usually affects young adults
    and children. It grows in the cells that give rise to new bone. It could spread
    to other body parts and has a tendency to grow quickly.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 1.3.2 Ewing sarcoma


    Ewing sarcoma primarily affects children and young adults. It arises from primitive
    nerve tissue in the bone and most commonly occurs in the pelvis, thigh bone, or
    shinbone. Ewing sarcoma can spread to other bones or distant organs, and it is
    known for its aggressive nature.


    # 1.3.3 Chondrosarcoma


    Chondrosarcoma develops in cartilage cells, which are found at the ends of bones
    or between joints. It can occur in individuals of any age but is more commonly
    seen in adults. Chondrosarcoma tends to grow slowly and has a higher likelihood
    of occurring in the pelvis, thigh bone, or shoulder.


    # 1.3.4 Giant cell bone cancer


    Giant cell cancer is a relatively not common bone cancer that mostly affects adults
    between the ages of 20 and 40. It typically occurs near the ends of long bones,
    such as the knee or wrist. While most giant cell tumors are benign, some can be
    locally aggressive or recur after treatment.


    # 1.3.5 Chordoma


    Chordoma is a rare type of bone cancer that arises from remnants of the notochord,
    a structure present during fetal development. It commonly occurs in the base of
    the skull or the bones of the spine. Chordomas grow slowly and tend to be locally
    invasive, making complete surgical removal challenging.


    # 1.3.6 Fibrosarcoma


    Fibrosarcoma is a rare malignant bone tumor that arises from fibrous tissue. It
    can occur in any bone but is more commonly found in the legs, arms, or jaw. Fibrosarcoma
    tends to grow rapidly and has the potential to metastasize to other parts of the
    body.


