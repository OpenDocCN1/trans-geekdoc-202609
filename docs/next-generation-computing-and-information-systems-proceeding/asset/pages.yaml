  md: '# 3.3 Exploratory data analysis


    Understanding the patterns and characteristics within a dataset using visualization
    techniques plays an important role. Through EDA, one not only uncovers meaningful
    insights of the data but also detects outliers, identify trends, and understand
    the distribution of data. In this research, pattern of the feature variables of
    the dataset have been studied and presented in Figure 3.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_236_0.png)


    Figure 3. Bar plot of feature variables to detect outliers.


    Here the values of each feature variable are shown in the form of a box plot where
    the rectangular box is the interquartile range (IQR) and contains the middle 50%
    of the data. It also contains the spans from the lower quartile (Q1) to the upper
    quartile (Q3). There is also a horizontal line that represents the median (Q2)
    which is the middle value of that particular feature as well as the whiskers which
    extend from the box to the minimum and maximum values from Q1 and Q3, respectively
    except sex. In addition to these, there are also few Individual data points that
    fall outside the whiskers such as in case of restbps, chol, thalach, fbs, oldpeak,
    slope, ca, and thal and these points are plotted as outliers. In order to handle
    these outliers, Z score is used and solved via Equation (1):


    ```

    Z = \frac{X - \mu}{\sigma} (1)

    ```


    and we can remove outliers only if |z| > threshold × standard deviation. Here
    X is the data point, μ is mean, and σ is standard deviation.


    # 3.4 Feature selection


    In a CSV dataset, feature selection is necessary in refining the classification
    of AI learning models. In case of hypertension dataset, correlation coefficient
    (r) technique has been used to understand that how strongly each feature variable
    in the dataset is correlated with the target variable. In correlation coefficient,
    the values ranges from –1 to 1 where 1 defines the positive correlation, –1 indicates
    negative correlation, and 0 presents no correlation. If the correlation values
    are nearer to –1 and 1, it means that there is a strong relationship between feature
    and target which makes feature variable important for predicting the target variable
    (Saha et al. 2020). The correlation coefficient is calculated by using the Equation
    (2):


    ```

    r = \frac{\sum_{i=1}^n (X_i - \overline{X})(Y_i - \overline{Y})}{\sqrt{\sum_{i=1}^n
    (X_i - \overline{X})^2} \sqrt{\sum_{i=1}^n (Y_i - \overline{Y})^2}} (2)

    ```


    Here Xi and Yi are data points, X̄ and Ȳ are the mean of variables X and Y respectively.'
