  md: '2021), using the agent-based simulation modelling method, a multi-scenario
    simulation experiment was carried out on the policies and measures of the Taiyuan
    City hospital and government to deal with COVID-19. (Oda et al. 2015) established
    an urban spatial network model to analyze the spread of COVID-19 in the Wuhan
    situation is simulated. Due to a large amount of calculation in the multi-agent
    simulation process, the results are uncertain, and the epidemic spread process
    has Markov characteristics (Chancay-García et al. 2018); that is, the future state
    of the epidemic state is only related to the current state, not the previous state.
    Therefore, this model uses the Markov chain Monte Carlo method (MCMC) (Nair et
    al. 2022) to obtain the stable distribution of the results and then dynamically
    calibrate the critical parameters in the model. This paper uses this model to
    analyze the impact of the scale of urban closure and control on the spread of
    the epidemic after the epidemic rebounds. It puts forward suggestions to provide
    a reference for formulating prevention and control measures for a new round of
    epidemic rebounds that may come.


    # 1.1 Study area and data


    This paper selects a large city with typical urban characteristics as the research
    area. The town has a large population, complex personnel, developed traffic, and
    many crowded regions. Consequently, it is highly vulnerable to the threat of infectious
    diseases and causes serious consequences. Taking the COVID-19 epidemic in 2020
    as an example, the city has experienced four processes: early import and local
    spread in Hubei, overseas import and spread in spring, gathering epidemic in a
    market in summer, and multi-point distribution in autumn and winter. This paper
    collects epidemic data for some of the above processes. At the same time, because
    the essential geographic information data is required to construct the virtual
    geographic environment and generate the agent during the simulation process of
    the spatial agent model, the spread of the epidemic is closely related to the
    travel activities of the people, this paper collects the primary geographic information
    data and travel statistics of the city.


    # 2 MODEL DESIGN AND IMPLEMENTATION


    Through the preliminary analysis of the existing data, this paper takes the active
    residents in the city as the agent and designs. It implements the agent model
