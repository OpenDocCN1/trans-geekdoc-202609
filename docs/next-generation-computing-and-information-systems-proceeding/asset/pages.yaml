    parameters obtained by training are used to recommend drugs to new patients.


    First, random initialization is performed on all the data in the training set:
    for the nth data, the context topic latent variable $d_n$ and disease topic latent
    variable $a_n$ are randomly assigned, and for the mth disease document word in
    the nth data, the corresponding identifier is randomly assigned [15]. The conditional
    probability distribution of the latent variables z and c is


    \(q(a_n = l, d_n = g | \psi_n, v.e.a.z.\alpha, \beta, \eta)\alpha\)

    \(\psi_n^f \times \frac{m_f^k + \alpha}{\sum_{j=1}^k (m_f^j + \alpha)} \times
    \prod_{m=1}^{M_{a,n,z_{n,m}=1}} \frac{w_k^{v_{n,m}} + \beta}{\sum_{v=1}^W (m_k^v
    + \beta)} \times \prod_{e=1}^{N_{n,d}} \frac{m_f^{c_{n,e}} + \eta}{\sum_{e=1}^E
    (m_f^{c_{n,e}} + \eta)}\) (2)


    Among them, $\psi_n^f$ is the probability q (f|$\psi_n$) of sampling f from $\psi_n$,
    $m_f^k$ is the number of times that the word v is assigned to the topic k, $m_f^k$,
    k, n is the drug d is set as the drug topic k, and the number of times the situation
    topic c, both counts above exclude document n. For each word in the disease document,
    the conditional probability distribution of the corresponding identification variable
    y is


    \(q(z_{n,m} = 0 | v, e, a, z, \alpha, \beta, \eta)\alpha\)

    \(\times \frac{m_{(n,m)}^{z=0} + \lambda}{\sum_{z=1}^1 (m_{n,m}^z + \lambda)}
    \times \frac{m_{z=0,(n,m)}^{x_{n,m}} + \beta}{\sum_{x=0}^Z (m_{x=0,n,m}^y + \beta)},\)
    (3)


    Among them, $m_{n,m}^z$ is the number of words corresponding to the label y, $m_x^{z=0,(m,n)}$
    is the number of occurrences of w in the word corresponding to the label 0, $m_{a,n,m,m}^x$
    is the number of times the phrase v n,m is assigned the topic a n,m, and the above
    counts exclude the mth word in the nth document (Gupta and Awasthi 2010; Gupta
    et al. 2022; Khan et al. 2020).


    \(\theta_{f,k} = \frac{m_f^k + \alpha}{\sum_{j=1}^M (m_f^j + \alpha)}\) (4)


    Among them, $m_f^l$ is the number of times the document with the situation topic
    f corresponding to the disease topic j.


    $\varphi_{k,w}$ represents the probability that a certain disease topic generates
    a certain word:


    \(\Phi_{k,w} = \frac{m_f^k + \beta}{\sum_{j=1}^M (m_f^j + \beta)}\) (5)


    Where $\varphi_{k,w}$ is the number of occurrences of word w in the document corresponding
    to disease topic k.


    # 3.5 Drug recommendation


    Suppose a set of test data sets are given, in which the corresponding drugs of
    patients are unknown. Then the conditional probability of the patient corresponding
    to any drug d can be obtained by formula (10).


    \(q(e|X, \psi) = \sum_{f=1}^F \sum_{l=1}^L \sigma_{f,l,e} \times \left( q_f \theta_{f,l}
    \prod_v (\pi_0 \theta_v^C + \pi_1 \varnothing_{l,e}) \right)\) (6)'
