  md: 'data from the time domain into the frequency domain. It helps in the extraction
    of relevant frequency-based features that can be transformed into images and processed
    further by CNNs for applications such as classification or EEG-based emotion recognition.
    EEG signals contain a range of frequencies that correspond to different types
    of brain activity. The EEG signal can be broken down into its frequency components
    using FFT. Better resolution of frequencies in the FFT is made possible by a larger
    window size (256 in this case). This implies that we will be able to record more
    precise data regarding the frequency components of our EEG signal. This may be
    crucial for precisely describing the broad range of content of signals from the
