    # 4 DATA SET


    One kind of malignant tumor that develops in a bone is called osteosarcoma. Although
    any bone can experience it, long bones are more likely to do so. Osteosarcoma
    is most common in people between the ages of 10 and 25, particularly in adolescents,
    and it recurs in older adults over 60. This dataset contains images of the micro
    anatomy of osteosarcoma stained with hematoxylin and eosin (H and E). A team of
    clinical professionals from the University of Texas, Dallas oversaw the data collection
    process. Fifty patients receiving treatment at the Medical Center of Children
    in Dallas served as an acceptable sample for the creation of this dataset. The
    medical examiner selected 4 out of 50 patients based on the tumor samples’ dissimilarities
    following clinical surgery. The images were labeled with the three most common
    kinds of cancer: necrosis, viable tumor, and non-tumor. The clarification was
    done by two clinical scientists. This dataset consists of 1144 1024 x 1024 images
    with ten times the resolution.


