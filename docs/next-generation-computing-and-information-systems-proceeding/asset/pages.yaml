    it is used for classification instead of regression. It categorizes the independent
    variables into binary form and displays their linear relationships (Dong et al.
    2020).


    The basic logistic model uses the formula:


    ```

    $$ln(P) = ln(\frac{P}{1 - P})$$ (6)

    ```'
