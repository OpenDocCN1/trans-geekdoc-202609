  img_proc: true
- pgno: 100
  md: 'Metaverse (Liew 2022). In fact, DeFi is touted as the foundational element
    for realizing the commercial potential of the metaverse (Turi 2023). The Metaverse
    Standards Forum (Metaverse Standards Forum) is a consortium of leading corporate
    houses helping set an equitable and inclusive road map for metaverse development.
    It identifies interoperability as a major requirement for future metaverse platforms.
    Thus, all central elements of the metaverse should ideally operate seamlessly
    across multiple and diverse metaverse platforms built and operated by different
    organizations. This requirement has implications for DeFi service providers as
    well as they would need to provision their services efficiently across geographically
    diverse metaverse service providers while ensuring security, transparency, resilience,
    performance, and scalability (Banaeian Far et al. 2023). One of the challenges
    with smart contracts is accurate and predictable execution (Mense & Flatscher
    2018). End users are not able to test smart contracts execution prior to availing
    services, leaving them vulnerable to incorrect execution of business logic (Khan
    et al. 2021). Other challenges with smart contracts are captured in (Kaur et al.
    2023). An early suggestion to address this through the use of proxy smart contracts
    is suggested in (Gupta et al. 2023), but this solution is specific to one blockchain
    type. Current research in enabling seamless DeFi service composition, discovery
    and consumption across the metaverse can best be described as nascent.


    To overcome the stated requirements and associated challenges this research paper
    proposes a DeFi framework for the metaverse which is based on digital twins for
    smart contracts, hosted as edge services, providing easy access to metaverse entities
    to engage in financial transactions using a custom or standard business logic
    encapsulated in the smart contracts. Further, users can test smart contract logic
    prior to availing the actual DeFi service. Some considerations for effectively
    using digital twins in the metaverse setting as discussed in (Banacian Far et
    al. 2023). The proposed framework addresses these security concerns besides providing
    additional features to ease cross-metaverse operations.


