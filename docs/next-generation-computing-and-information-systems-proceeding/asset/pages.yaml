  md: '# 3 DISCUSSION


    # 3.1 Statistical and meta-analysis


    A total of 197 articles were identified through the process of screening and eligibility
    in various repository such as SCOPUS, IEEE xplore etc. These articles were then
    refined using the search query “green AND IoT AND internet AND of AND things AND
    farming AND agriculture”. From this refinement, a final database of 36 articles
    was identified. These 36 articles were accepted for inclusion in the meta-analysis,
    as depicted in Figure 4.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_63_0.png)


    Figure 4. Sequence diagram of the search database and meta-analysis.


    As most of the articles published on IoT based smart agriculture, IoT has increased
    rapidly to provide the good quality harvesting by controlling the irrigation,
    automate the production of agriculture and make day-to-day work easy but it also
    produces the carbon emission, energy use and e-waste. To transform the IoT based
    application to Green-IoT which aims to reduce the carbon footprints and enhance
    the model. In Figure 5, it summaries the statistical analysis of research articles
    in IoT based smart agriculture using AI/ML techniques. As shown in the Figure
    6, It has been estimated that scope of the articles in G-IoT has been increased
