    # 4 CONCLUSION


    The research work focused on predicting disease from symptoms using three classifiers:
    Decision Tree, Random Forest Classifier and Gradient Boosting. These classifiers
    were evaluated based on validation accuracy, training accuracy, confusion matrix,
    and classification report. Overall, all three classifiers demonstrated a reasonable
    performance in predicting disease. Gradient Boosting achieved the highest training
    and validation accuracy of 95.38%. Confusion matrices provide the detailed information
    about the distribution of predicted and actual prognosis across different disease
    categories. Classification reports presented precision, recall, F1-score, and
    support metrics for each disease category, further evaluating the classifiers
    performance. Based on the results, Gradient Boosting emerged as the best model
    for predicting diseases from symptoms in this research work. Overall, the research
    work contributes to the field of medical prognosis by showcasing viability and
    feasibility of using machine learning algorithms based on disease symptoms. Hence,
    the findings highlight the potential of these classifiers to assist healthcare
    professionals in making a correct and efficient disease prognosis.


