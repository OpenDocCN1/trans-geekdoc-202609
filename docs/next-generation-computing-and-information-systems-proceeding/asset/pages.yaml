    \(p_1(x) = RF(x)\)

    ```


    # 3.5.2 Gradient Boosting! LGBM/XGBoost/CatBoost/AdaBoost


    In the domain of hypertension detection, these machine learning techniques did
    well in extracting meaningful patterns from complex medical data. Gradient boosting
    builds decision trees where each subsequent tree focuses on correcting the errors
    of the preceding ones and enhances the accuracy of model. CatBoost stands for
    categorical boosting and works efficiently with the medical data which is often
    rich in categorical variables (Chaplot et al. 2023). LGBM, optimizes the building
    of decision trees in a leaf-wise fashion and significantly improves training speed
    and makes it suitable for large healthcare dataset. XGBoost, an optimized version
    of gradient boosting, incorporates regularization techniques, prevents overfitting
    which thereby improves generalization on unseen data. AdaBoost, on the other hand,
    emphasizes difficult-to-classify instances by assigning higher weights to misclassified
    samples, and enhances the performance of the algorithm where identifying subtle
    patterns is crucial, such as in hypertension detection (Singh et al. 2023). The
    mathematical equation for AdaBoost''s final prediction F(x) in the context of
    multiclass classification with \(\alpha\) as weight and \(h_m^k(x)\) as prediction
    of weak learners is presented in Equation (6).


    ```

    \(F(x) = argmax_k \left( \sum_{m=1}^M a_m h_m^k(x) \right)\)

    ```


    These algorithms collectively empower healthcare professionals by accurately recognizing
    intricate relationships within patient data and aid in early hypertension diagnosis
    and tailored treatment strategies.


    # 3.5.3 MLP


    It is a computational model inspired by the human brain which is adept at discerning
    intricate patterns within vast datasets. The input layer of the MLP receives essential
    features like age, cholesterol levels, restbps, etc. Through hidden layers, these
    inputs use series of weighted computations and nonlinear transformations which
    allow the network to capture'
