  md: '# 1) Preoperative treatment


    +   - Offline calibration of the HoloLens workspace.

    +   - CT scan of the target area.

    +   - Segmentation and reconstruction of preoperative CT data were performed to
    obtain femur and tibia, STL models.

    +   - On the segmented STL model, perform surgical path planning.


    # 2) Intraoperative Navigation


    +   - Take X-rays, perform spatial calibration on the C-arm, and transmit the
    calibration results and X-ray images to the 2D-3D registration module.

    +   - In the 2D-3D registration module, import the preoperative CT data and the
    segmented STL model, adjust the initial position of the STL model and X-ray, perform
    2D-3D image registration, and transmit the registration results to the visualization
    Reality Module.

    +   - Online calibration of HoloLens.

    +   - Enhanced display, navigation tracking.


    # 2.2 Spatial registration technology


    # 2.2.1 C-arm calibrator based on tapered helix


    As shown in Figure 2, to improve the spatial registration accuracy of point pair
    registration, a C-arm calibrator based on a conical helix is used to calibrate
    the C-arm. In the vicinity of the surgical target, this calibrator has a higher
    calibration accuracy than the traditional dual-plane calibrator (Yu et al. 2012).


    # 2.2.2 Splat-based 2D-3D image registration


    To achieve the spatial unification of preoperative CT images and digital X images
    a DRR projection-based 2D/3D automatic registration method strategy is adopted.
    DRR reconstruction, similarity criterion, and parameter optimization algorithms
    are essential components of the 2D/3D registration process (Collazos and Merchan
    2015).


    # 2.2.3 Virtual and real calibration based on space compensation


    To achieve fast online calibration, the calibration process is decomposed into
    offline calibration and online calibration by analyzing the workspace of the HoloLens.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_84_0.png)


    Figure 2. Workspace of HoloLens.


    # 2.3 Human-computer Interaction Technology


    # 2.3.1 Human-computer interface


    For scene development in Unity3D, the human-computer interaction interface of
    the system is shown in Figure 3. The setting of the navigation tracking method
