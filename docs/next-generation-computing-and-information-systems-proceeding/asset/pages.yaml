  md: '# Towards a serverless computing and edge-intelligence architecture for the
    Personal-Internet-of-Things (PIIoT)


    Ankur Gupta & Surbhi Gupta


    Model Institute of Engineering and Technology, Jammu, J&K, India


    ABSTRACT: Serverless computing has emerged as a compelling paradigm for the deployment
    of applications at the edge facilitating performant and lightweight services.
    Services deployed at the edge typically consume lesser compute and storage resources
    while offering relatively lower latency. Hence, a serverless architecture is a
    natural fit for the requirements of the Personal-Internet-of-Things (PIIoT), an
    emerging sub-domain of the IoT in which data acquisition, analysis and computation
    is performed in the context of an individual user and her environment. For such
    environments privacy preservation, resource-light models, fast detection of emergency
    situations and low response times for services is paramount. In addition users
    demand hyper-personalized service delivery requiring embedded intelligence for
    real-time interventions. This paper proposes a serverless computing architecture
    with embedded intelligence at the edge for the PIIoT which effectively meets the
    stated requirements. A proof-of-concept using AWS Lambda and tiny AI is implemented
    and initial results presented, establishing the effectiveness of the proposed
    framework.


    # 1 INTRODUCTION


    The Personal-Internet-of-Things (PIIoT) (Gupta et al. 2022) is an exciting sub-domain
    of the IoT, encompassing sensors, digital artefacts, consumer electronics, digital
    assistants, smart home devices, internet-enabled vehicles etc. which operate within
    the context of a particular user or family. These sensors, devices and applications
    are typically supported by a decent home network and a personal cloud for computation
    and storage. The primary requirement for the PIIoT (Sahoo et al. 2021) is to provide
    a privacy-preserving, yet hyper-personalised (Maayan, 2020) tech-driven environment
    for individual users or families leading to intelligent automation and on-demand
    service consumption. This realization of the vision for the PIIoT is still some
    distance away, due to vendor/device heterogeneity and lack of standards for interoperability
    besides privacy-aware cloud service delivery models. PIIoT caters to major emerging
    trends in consumer behavior and expectations (Ahmed et al. 2023; Zhang et al.
    2023a). Users have begun to place a high-premium on their privacy including how
    their data is collected and managed. Besides, they expect high-levels of personalization,
    referred to as hyper-personalization (Jain et al. 2021). These two expectations
    are non-complementary usually representing a trade-off. To deliver a high level
    of personalization, user-data needs to be tracked and analyzed. Hence, new approaches
    are needed to cater to this trade-off while satisfying both requirements.


    The Internet of Things (IoT) and its many sub-variants including the PIIoT are
    characterized by a large number of devices/sensors generating massive amounts
    of time-series data requiring significant computing power to process. Serverless
    computing and edge intelligence have emerged as a promising solution to address
    the scalability and performance issues while lowering the cost of central computing
    power neede to process the information. Serverless computing, also known as Function-as-a-Service
    (FaaS), is a cloud computing'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'model in which a third-party service provider manages the infrastructure and
    automatically allocates computing resources as needed to execute code in the form
    of discrete functions. By hosting these discrete functions on the edge, further
    latency optimization can be achieved. Although servers are still used in the process,
    the details of the servers and their management are abstracted away from the developers.
    Due to its capacity to save operational costs, increase scalability, and boost
    developer productivity, serverless computing has gained traction, especially when
    data need not be persistently stored for further processing.


    Thus, serverless computing and edge intelligence are valuable tools for building
    scalable, cost-effective, and agile IIoT platforms (Yao et al. 2023). Furthermore,
    this paper investigates the benefits of these deployment models in reducing latency,
    increasing agility, and improving privacy provisions in the IIoT environment.
    Hence, the main contributions of this paper are:


    +   - The present work highlights the specific requirements for the IIoT necessitating
    the development of customized frameworks to be developed beyond traditional IoT
    architectures.

    +   - The study proposes a model for the IIoT which leverages the power of edge
    computing, combining it with serverless computing paradigm to provide real-time
    processing and analysis of IIoT data, while ensuring privacy and reducing latency
    and storage requirements.

    +   - The proposed framework is evaluated experimentally to showcase significant
    improvements in latency, reduced data storage requirements, and enhanced data
    privacy, laying the foundation for developing performant IIoT models in future.


    The rest of the paper is organized as follows: section 2 provides an overview
    of related work in the domain of IIoT and related environments such as smart homes.
    Section 3 proposes the system model for a server-less computing and edge-intelligence
    based framework. Experimental results from a custom simulator are provided in
    Section 4, while section 5 concludes the paper.


    # ## 2 BACKGROUND AND RELATED WORK


    In recent years there is increased convergence of consumer electronics, IoT, edge
    computing, AI and cloud computing to deliver enhanced experiences to end users
    and help improve the quality of human lives. This has led to high-levels of automation
    and intelligence in smart home environments with a focus on health, well-being
    and automation of mundane tasks through robots and software bots. Hence, hyper-personalization
    as a trend is here to stay. This also implies increased data collection from the
    user and her immediate vicinity, leading to privacy concerns. Thus, models of
    tech deployment which enable hyper-personalization to be delivered in a privacy-preserving
    manner are going to be increasingly built to meet the requirements of increasingly
    sophisticated individual users. A prominent industry report by MarketsandResearch.com
    (Research and Markets 2018) highlights the significant potential of the PIoT market,
    the players, potential applications and usage scenarios, new market opportunities
    through an in-depth coverage. The study identifies connected consumer devices,
    wearable computing, smart homes, connected vehicles and V2X platforms and related
    services, AR/VR/XR technologies, mobile edge computing and analytics services
    as building blocks for the PIoT ecosystem.


    The concept of Personal-Internet-of-Things is nascent with not much literature
    available. One of the earlier mentions of PIoT is available in Siow et al. 2016,
    where the authors use inexpensive edge nodes to create a repository of user linked
    data in a smart home environment, demonstrating the feasibility of the serverless
    approach for such environments. A recent study (Gupta et al. 2022) on the Personal-Internet-of-Things
    (PIoT) highlighted that user privacy, data security, and device security must
    be ensured to realize the PIoT vision and enable exciting new applications. An
    architecture supporting secure and privacy-preserving PIoT interactions for hyper-personalization
    and smart automation was also proposed. An early attempt to setup a personalized
    IoT environment using a DIY model is presented in Ambe'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'et al. 2019. The study proposes an IoT Un-Kit experience, a co-design strategy
    that engages individuals in creating personally relevant IoT apps and in-home
    solutions. Other solutions focusing on individual aspects such as personalised
    healthcare have also been proposed. In (Gupta et al. 2023) authors propose a framework
    for the Personalized Health of Things (PHIoT). The PHIoT architecture proposed
    in the study automates diagnostic and therapy processes, modifies patient behavior
    and health status in real time, and aims to provide more personalized healthcare
    services. AI approaches to handling personal data of users in smart home environments
    are discussed in Zhang et al. 2023b and issues such as privacy, trust and explainability
    for AI algorithms dealing with personal data are emphasized in the study. A collection
    of articles related to AI approaches for networking and communication challenges
    in PIoT and related environments is available in Jin et al. 2020. An interesting
    application leveraging an individuals PIoT data for user identification in digital
    forensics is presented in Hutchinson 2023. The study highlights the need to provide
    greater privacy controls for users while ensuring that the data can be correlated
    to determine identity when required by law enforcement agencies. Recently the
    risks associated with the personal-internet-of-things has been highlighted in
    a comprehensive study (Di Gangi et al. 2023) indicating that experts and ens users
    carried a high risk perception about the pervasiveness of the IoT devices in their
    immediate vicinity. The study further indicates a significantly higher potential
    of hacking of low cost sensor devices by malicious users, granting them access
    to sensitive personal data of the users. Hence, the risk perception emerged as
    a major consideration hampering the broad-based adoption of the PIoT framework.


    Thus, related work is limited which addresses the PIoT as a domain and the term
    has not yet gained traction. However, individual aspects aggregating towards realizing
    the vision of the PIoT have been researched for instance smart homes, wearable
    computing, connected vehicles etc. More studies are therefore needed which address
    the end-to-end needs of the PIoT ecosystem holistically.


    # 3 MYIOT: SYSTEM MODEL


    To address the issues discussed above, this paper proposes MyIoT, a system model
    delivering high-performance edge services for an individual user or a family in
    a hyper-connected smart home and personal computing environment. The schematic
    for the proposed system model is presented in Figure 1.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_69_0.png)


    Figure 1. Schematic of the proposed MyIoT framework.'
