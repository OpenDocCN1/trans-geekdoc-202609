    # 5 CONCLUSION


    In recent years, the number of vehicles in metropolitan areas has increased substantially.
    Accidents have grown as a result of increased traffic. Despite the introduction
    of different accident detection devices to the market, a significant number of
    fatalities occur. We demonstrated how using various sensors may help more precisely
    recognize a traffic incident. The proposed system immediately identifies an accident,
    locates the closest hospital. Then, it forwards the emergency help message to
    the relevant section of the hospital. This technology makes a decision based on
    the obtained data of smartphone sensors that detect data around the vehicle''s
    status. We proved that our suggested method minimizes false alerts. One disadvantage
    of this study is that we conducted the system''s primary assessment in a simulated
    circumstance. We are working to make the system more responsive while boosting
    its privacy and security level. Even so, the method demands a comprehensive investigation.'
