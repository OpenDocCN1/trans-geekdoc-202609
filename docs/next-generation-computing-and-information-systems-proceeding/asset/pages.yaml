    ABSTRACT: This paper presents an in-depth analysis on brain stroke prediction
    using machine learning based approaches for prediction and classification. We
    take on a wide range of data sources, including demographic data, medical records,
    lifestyle conditions, and clinical measures for a prediction model. We managed
    to determine significant patterns and risk factors related to stroke owing to
    the dataset utilised in this study. Feature selection techniques are utilised
    to identify the most relevant predictors, enhancing the efficiency and interpretability
    of the model. In addition, we study alternative data preparation methods, such
    as managing missing values, outlier identification, and feature scaling, to ensure
    data quality and model resilience.


    # 1 INTRODUCTION


    A blockage in the blood circulation or a breakage of blood vessels leading to
    leakage particularly in the brain is known as a brain stroke. It is a life-threatening
    condition as once occurred there are a lot of chances to have another. Blood and
    oxygen are unable to penetrate the brain due to the blood clots that have developed.
    Usually, these blood clots originate in arteries filled with lesions or constricted
    by fatty deposits. People who have high blood pressure (hypertension), high cholesterol
    (hyperlipidaemia), type 2 diabetes, a history of heart disease, or abnormal heart
    rhythms such as atrial fibrillation have a greater probability to have a stroke.
    Artificial intelligence techniques used in healthcare for disease prediction.
    Artificial intelligence strives to emulate cognitive processes in human beings.(Shah
    et al. 2022) A standard evolution in healthcare has been resulted by the increasing
    accessibility of health-related data and a rapid growth in analytics tools. For
    processing unstructured data, favoured AI compromises of natural languages and
    for structured data machine learning techniques has utilized. The three primary
    disease categories that utilize AI approaches are neuroscience, tumors, and cardiovascular.
    (Jiang et al. 2017)


    The artificial intelligence-based learning approaches are used for prediction
    and classifications. These methods are applied to the diagnosis and prognosis
    of a wide range of illnesses, especially those whose diagnosis depends on signal
    analysis or imaging. AI can also be used to identify people or environments that
    are more likely to contract illnesses or carry out dangerous tasks. Medical visual
    report analysis using machine learning (ML) techniques has been improved as a
    result of advanced algorithms that make it possible for the automated acquisition
    of increased features. (Ghaffar Nia et al. 2023)'
