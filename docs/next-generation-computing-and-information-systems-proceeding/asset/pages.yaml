    # 2 RELATED WORK


    There has been extensive research and activity in detection of Down Syndrome using
    machine learning, deep learning models. Below given are some of the literature
    works published in recent works:


    In (Qin et al. 2020), the authors proposed a novel facial recognition method that
    utilizes deep CNNs to detect down syndrome from facial images. The method employs
    transfer learning and image preprocessing techniques to train a binary model for
    down syndrome detection. The DCNN achieved high accuracy, recall, and specificity,
    with 95.87%, 93.18%, and 97.40% respectively.


    In (Thomas & Arjunan 2022), the authors proposed a model that utilizes a SegNet
    architecture based on the Visual Geometry Group (VGG-16) for the segmentation
    of the NT region. The segmented NT images are trained using an AlexNet model for
    classification of Down Syndrome. Model was trained and tested on a data of 100
    fetal images. The SegNet model achieved an accuracy of 98.18% and a Jaccard index
    of 0.96 in segmenting the NT region. The classification model based on the AlexNet
    achieved an overall accuracy rate of 91.7%, a sensitivity rate of 85.7%, and a
    receiver operating characteristic (ROC) value of 95%.


    In (Wang et al. 2023), the authors suggested an integrated process (DSD) using
    the modern transformer technique and transfer learning strategy to forecast cases
    of Down syndrome from the initial metaphase micrographs. Several models, including
    faster, mrcnn, retina, defor, spar, and swin, were used in the study. The Swin
    Transformer model distinguishes out because it constantly exceeds the competition
    on a number of metrics, demonstrating its reliability and effective operation.


    In (Zhao et al. 2014), the suggested method uses Gabor wavelet transform and local
    binary patterns (LBP) to extract morphological and structural variation information.
    A number of classifiers model, including Support vector machine (SVM), random
    forest (RF), Linear discriminant analysis (LDA), and K-nearest neighbour were
    trained to detect cases of down syndrome after feature fusion and selection. By
    combining geometric and Gabor jet features with LDA, the combined features had
    the highest accuracy (0.967) and F1 score (0.956).


    In (Mishima et al. 2019), the study evaluated the performance of Face2Gene, a
    facial recognition software, for suggesting candidate syndromes for patients with
    congenital dysmorphic syndromes in Japan. The software achieved a top 1 sensitivity
    rate of 42.9% and with top 10 sensitivity of 60.0% in Group 1, which included
    all cases. When considering only Face2Gene-trained syndromes, the top 1 sensitivity
    rate increased to 61.2%. In Group 2, which focused on cases with Down syndrome
    (DS), the software achieved a top 1 sensitivity rate of 100% for both youngest
    and oldest facial images.


    In (Vk & Rajesh 2022), the authors proposed a method for recognizing DS in face
