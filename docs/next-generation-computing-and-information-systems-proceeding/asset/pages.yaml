  md: '# # An approach for early prediction of multi-disease using ML techniques


    Vani Malagar, Mekhla Sharma & Navin Mani Upadhyay


    Model Institute of Engineering and Technology, Jammu, J&K, India


    ABSTRACT: Leveraging the explosion of medical data including patient histories,
    electronic health records & medical imaging, the integration of machine learning
    techniques with healthcare for multi-disease prediction has experienced tremendous
    growth. Several algorithms have already been proposed by many researchers but
    they cannot fit for all the solutions at once. So, this research paper uses Machine
    Learning (ML) techniques to investigate the complexity involved in multi-disease
    prognosis in the context of convergence. It explores three well-knows ML- algorithms
    (Decision Tree, Random Forest classifier and Gradient Boosting) to investigate
    and compare the best way to identify and diagnose the prediction problems. Further
    a detailed comparison with existing algorithms shows a better result from 70%–77%.
    The accuracy of used algorithm has shown 78.57% for Decision Tree, 77.92% for
    Random classifier and for Gradient Boosting 95.38%. Similarly, the F1-score is
    also improved up to 3%. The paper also redefines several machine learning algorithms
    used by several researchers to solve the prediction problem, by emphasizing the
    importance of gradient boosting as a successful strategy. This work also validates
    the used models based on a statistical analysis “ANOVA and Chi-square”.


    # # 1 INTRODUCTION


    Multi-disease classification and identification in healthcare and medical sciences
    focus on using advanced artificial intelligence-based technology to diagnose,
    detect and categorize multiple dis- eases or medical conditions simultaneously
    (Khurana et al. 2019 and Sagaro et al. 2020). This approach aims to improve the
    accuracy and efficiency of detection and classification of disease using advanced
    AI-based machine learning algorithms mainly in the cases where patients may express
    symptoms or risk factors associated with multiple health conditions. It is an
    interdisciplinary field involving various areas like medicine, data science, and
    technology to improve healthcare and enhance patient outcomes (Shirsath et al.
    2018 and Ardabili et al. 2020) and some key aspects of multi-disease identification
    and classification are as follows:


    +   - Collection and analysis of different types of medical or health record data.

    +   - Application of advanced machine learning algorithms to collected data for
    developing models that can identify and classify multiple diseases.

    +   - Automating diagnostic process that reduces workload of healthcare professionals.

    +   - Improving speed and accuracy of disease prognosis.

    +   - Early detection of diseases for better treatment outcomes and minimizing
    healthcare costs.

    +   - Prioritizing and managing chronic diseases helping healthcare providers.

    +   - Providing insights into disease patterns, patient population and many more
    for research and drug development.


    Traditional disease identification and classification methods are often based
    on established medical guidelines, manual interpretations and mainly focus on
    the experience of healthcare professionals (Polsterl et al. 2016).'
