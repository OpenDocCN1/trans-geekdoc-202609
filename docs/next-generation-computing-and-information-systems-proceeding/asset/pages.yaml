  md: '# 3.5 Applied classifiers


    Various machine as well as deep learning algorithms has been used as a classifier
    to detect hypertension in individuals.


    # 3.5.1 Voting classifier


    This is an approach to machine learning where the results of numerous independent
    classifiers are combined to provide a final prediction. The individual classifiers
    in the ensemble are trained on the same dataset. Each classifier interprets these
    features and delivers a binary prediction concerning the presence or absence of
    hypertension. The voting classifier then amalgamates these individual predictions
    using diverse techniques like majority voting or weighted voting and produces
    a final decision (Angayarkanni and Hemalatha 2023). Let LR(x) and RF(x) represent
    the prediction probability of logistic regression and random forest classifier
    respectively. The soft voting ensemble combines all these probabilities and predicts
    the class on the basis of highest average probability. The ensemble''s prediction
    \(\widehat{y}\) for a given input x can be computed by Equation (3):


    ```

    \(\widehat{y} = argmax_i \left( \frac{1}{2} \sum_{j=1}^2 p_i(x) \right)\)

    ```


    where i denotes class labels as 0 and 1, \(p_i(x)\) represent the probability
    estimate that the input x belongs to class i as predicted by each individual classifier,
    as shown in Equations (4 and 5):


    ```

    \(p_0(x) = \frac{1}{1 + e^{-LR(x)}}\)

    ```


