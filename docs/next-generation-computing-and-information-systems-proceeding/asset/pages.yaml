    # 5 CONCLUSION


    This paper uses deep learning methods to detect disease on multi-class imbalanced
    X-ray image datasets. Aiming at the problem of the long-tailed distribution of
    sample data in the dataset, the model uses a reweighting the loss function to
    counteract the impact of the unbalanced long-tailed distribution of data classes
    on the detection model. The experimental model uses ResNext50 as the detection
    network and uses the CLAHE algorithm to pre-process the dataset images. The comparative
    illustration of 8 experiments confirmed that the reweighting proposed in this
    paper is feasible and effective for dealing with long-tail problems, and the effect
    is better than other loss functions. The paper''s experimental results are limited
    by the number of samples in the dataset. To further improve the evaluation values
    and make the model better adapted to the multi-category X-ray chest disease detection
    task, it is still necessary to invest more data in the neural network training
    stage. Improving model performance in limited data is the focus of future research.


