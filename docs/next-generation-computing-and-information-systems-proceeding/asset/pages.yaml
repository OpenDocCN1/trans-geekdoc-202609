    # 1 INTRODUCTION


    Deep learning and neural networks have been widely used in remote sensing image
    recognition, video surveillance, medical image detection and other fields. However,
    since most medical image datasets have small sample sizes, high sample acquisition
    costs, manual labeling costs, and severe category inequality, deep convolution
    neural network models require many labeled training samples to ensure their final
    performance (Gudmundsson, El-Kwae and Kabuka 1998). Therefore, when using deep
    learning methods for medical image detection, it is necessary to process the data
    itself or the neural network itself to a certain extent to make up for the problems
    caused by the insufficiency of medical image data itself. (Nikolaev et al. 2021)
    proposed the ChestXNet fine-grained diagnostic network, which optimizes the neural
    network by introducing an attention mechanism module and a bidirectional parallel
    global maximum average pooling structure between channels (Islam and Mondal 2019).
    A deep separable dense network DWSDenseNet is proposed using 2905 COVID-19 chest
    X-ray images as an experimental dataset for binary detection experiments (Singh
    and Dutta 2014). When dealing with real-world application problems, the datasets
    that can be collected often have class imbalances (Ye et al. 2010).'
