  md: '# Building a safe and secure metaverse


    ![](img/9eefc6d2972274efeb1680c6a31895e5_23_0.png)


    Ankur Gupta

    Professor, Model Institute of Engineering and Technology, Jammu


    ABSTRACT: The metaverse is an exciting domain representing an amalgamation of
    advances in computing and communications along with immersive technologies (AR/VR/
    XR). It is therefore intuitive for large corporations, research organizations
    and businesses cutting across industry to adopt a metaverse-centric approach and
    explore diverse use-cases catering to business/individual needs. However, the
    transition from traditional applications to metaverse-native applications is not
    expected to be seamless. Privacy, safety and security concerns exist in the early
    versions of the metaverse with several flaws endangering individual user safety
    being highlighted. Plus, there is increased scrutiny on the ill-effects of social
    media, gaming and immersive environments by Governments and regulatory agencies.
    Thus, it is increasingly clear that the final iteration of the metaverse will
    need to address the concerns of individual users while navigating a complex legal
    and regulatory landscape. This keynote examines the different aspects and challenges
    which the future metaverse will need to address. A set of “first principles” are
    put forth towards building an inclusive, safe and secure metaverse.


    BIO: Prof. Ankur Gupta is the Director at the Model Institute of Engineering and
    Technology (MIET), Jammu, India, besides being a Senior Professor at the Department
    of Computer Science and Engineering. He has 25 years of experience spanning industry
    and academia. Prior to joining MIET, he worked as a Team Leader at Hewlett-Packard,
