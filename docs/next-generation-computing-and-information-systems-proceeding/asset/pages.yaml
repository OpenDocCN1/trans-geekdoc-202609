    for Standardization, usability refers to the effectiveness, efficiency and satisfaction
    of a specific user using a product to achieve a particular goal under a specific
    context of use. Some researchers have conducted usability evaluations for virtual
    reality systems. However, there are no usability studies on AR navigation system
    interaction. Therefore, combined with the human-computer interaction criteria
    proposed in Section 3.2, refer to the virtual reality interface usability evaluation
    method (Li et al. 2021; Silva and Medeiros 2021; Tao et al. 2018). The consistency
    test indicators CR and CRi are: 0.0371, 0, 0, 0.0061, 0, 0.0028, respectively.
    All levels of consistency test indicators are less than 0.1, so all passed the
