    # 2 RELATED WORK


    The dissemination of fake news is mainly divided into the elimination of counterfeit
    news nodes, Competitive Cascading and Network Monitoring. Fake news node elimination
    refers to contacting contacts through rumor-refuting methods. Strategies for eliminating
    the adverse effects of fake news, such as Based on the greedy approach proposed
    by the Author. Method. In the simulated network model, the greedy algorithm chooses
    to refute rumors. The dissemination of trustworthy news and the cascading competition
    of false information reduce the Strategies for the negative impact of small fake
    news. (Syrovatkova and Pavlicek 2021) calculate the optimal strategy for the objective
    function that affects the blocking maximization, enhancing the Dissemination of
    rumors. (Assaf and Saheb 2021) proposed the first combination of robust A multi-stage
    intervention framework for chemical learning and point-process network activity
    models. Modeling the dissemination of fake news and external intervention behaviors,
    intervention strategies Slightly adjusted to the dynamics of artificial news dissemination,
    the Intervention activity effect as a reward function. Internet monitoring refers
    to using semi-automated social accounts or people as an intervention strategy
    to block fake news from suspicious sources. Net Network monitoring locations have
    the highest probability of cross-site transmission and are used at questionable
    sources is a site or partition with at most k users nearby (Garg and Jeevaraj
    2021); another the solution for finding network monitoring locations is based
    on attackers and defenders Stackelberg game between (Ren et al. 2020). Combining
    manual and machine inspection methods can improve the robustness of fake news
    detection. When the machine misses some fake news, the human can detect and block
    its phone information; when human detection fails, machines can make up for these
    mistakes.


