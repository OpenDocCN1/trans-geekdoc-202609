  md: '# 4.1 Preprocessing


    A median filter is used to smoothen the images in our proposed study. It can handle
    pulse noise in higher density when combined with a medium filter. The details
    of the images can be preserved while using this filter.


    # 4.2 Feature extraction


    The median filter approach is used to accomplish preprocessing, after which the
    preprocessed pictures are sent to the feature extraction step (Soni et al. 2021).
    The MRI brain image is used to extract three separate parameters, including Grey
    Matter Volume and cortical thickness.


    # 4.3 Combination kernel for support vector machine


    The maximum margin classifier works fine when there is a linear boundary (i.e)
    a hyperplane separating both the classes. It does not work when there are no solutions
    when M>0, for the optimization problem. To address non- linear data, the primary
    feature space is changed into a higher – dimensional feature space. The original
    feature space of the kernel is illustrated employing the following Equation (1).


    ```

    K(U, V) = \varphi(U)^T \varphi(V)

    ```


    Given below are the relations for the several kernels.


    # Linear Kernel:


    ```

    linear_k(U, V) = u^T v + c

    ```


    Where u, v characterize the dot product of linear kernel and constant c.


    # Quadratic Kernel:


    ```

    quad_k(U, V) = 1 - \frac{\|u - v\|^2}{\|u - v\|^2 + c}

    ```


    Here u, v signify the vectors in the original input space


    # Polynomial Kernel:


    ```

    poly_k(U, V) = (\lambda u^T v + c)^\theta, \lambda > 0

    ```


    # Sigmoid Kernel:


    ```

    sig_k(U, V) = tanh (\lambda u^T v + c), \lambda > 0

    ```


    # 4.4 Whale optimization


    Whale Optimization (WO) Algorithm is adopted for the weight optimization. The
    final score gained y using the WO is dependent on optimization score value (Gupta
    and Awasthi 2008).


    The whale optimization technique encompasses three distinct stages like the act
    of encircling prey, bubble-net attacking procedure, and hunt for the victim/prey.


    # 4.4.1 Encircling the prey/victim


    The Hump-back whales are competent for discriminating the position of the victim
    and surrounds them. For the vague location of the most favored is its search area,
    the current finest contender elucidation is the objective victim or is in its
    vicinity of the most favored in the WO technique (Sharma et al. 2022).'
