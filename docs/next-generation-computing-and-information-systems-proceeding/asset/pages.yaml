    # 5 CONCLUSION


    This paper studies the characteristics of atrous convolution applied to lightweight
    methods. The proposed lightweight methods are based on atrous convolution: primary
    atrous convolution lightweight method, improved atrous convolution lightweight
    method and fusion atrous convolution lightweight method quantification method.
    After theoretical research and experimental analysis, it is found that the light
    weight of the primary hollow convolution method will reduce the accuracy and the
    degree of reduction. The lightweight fusion-type whole convolution method can
    combine speed and accuracy well while getting a better fair result. It can retain
    the same or even higher accuracy than the original network and has better universality.


