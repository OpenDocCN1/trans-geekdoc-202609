  md: '# Dilated convolution model for lightweight neural network


    Sachin Gupta

    Department of CSE, Maharaja Agrasen Institute of Technology, India


    Priya Goyal

    Department Computer Science and Engineering, Manipal University Jaipur, India


    Bhuman Vyas

    Credit Acceptance, Canton, USA


