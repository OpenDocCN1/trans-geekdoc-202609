    # 3.3 Data preprocessing


    Prior to feeding the image data into the neural network for classification, a
    series of pre-processing steps were applied to ensure uniformity and enhance the
    quality of the data. First, all images were resized to a standardized dimension.
    Subsequently, pixel values in the images were normalized to fall within the range
    of [0, 1]. Normalization enhances model convergence and performance by ensuring
    that each pixel''s intensity contributes proportionately to the network''s learning.
    Furthermore, data augmentation techniques, including random rotation, horizontal
    and vertical shifts, zooming, and horizontal flipping, were applied to the training
    dataset. Augmentation diversifies the dataset, augmenting the learning process
    and helping the model generalize better by exposing it to a broader range of image
    variations. This step can prove to be vital in the cases when you have a small
    dataset, like in this case we have only about 3000 images in total and along with
    data augmentation, we have also preferred to use transfer learning for this classification
    task. The dataset was then split into train and test in 3:1 ratio. The results
    of different CNN algorithms like Inception, Xception, EfficientNetB0, and DenseNet121
    are compared to provide insight as to which Network architecture performs the
    best on the dataset.


    # 3.4 Model architecture


    Transfer learning includes utilizing a pre-trained neural network as a starting
    point and modifying its layers to adapt to a new task. The pre-trained model''s
    early layers retain general features, while later layers are fine-tuned to specialize
    in the specific features of the


