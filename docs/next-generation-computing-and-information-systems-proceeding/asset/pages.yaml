  md: '# Early prediction of down syndrome using deep transfer learning-based approaches


    Nirmit Patel, Tarang Ghetia, Devraj Jhala, Shubh Kapadia & Yogesh Kumar


    Department of CSE, School of Technology, Pandit Deendayal Energy University, India


    # ABSTRACT:


    Down Syndrome, a genetic disorder caused due to an extra copy of chromosome 21.
    With around 1 in 700 newborn babies being affected from it, it remains one of
    the most prevalent chromosomal disease. Children with down syndrome typically
    have physical and intellectual disabilities, but with early intervention and support,
    they can live long and fulfilling lives. This research investigates the use of
    Convolutional Neural Networks (CNNs) and transfer learning for early detection
    of Down Syndrome. The dataset used in this study is taken from Kaggle and consists
    of about 3000 facial images of children with and without Down Syndrome. The highest
    accuracy achieved in this study is over 95% and further shows the efficacy of
    transfer learning for more reliable detection of down syndrome.


    # 1 INTRODUCTION


    John Langdon Down, a doctor from Cornwall, England, is credited with describing
    the illness for the first time in 1866 (Ropper and Bull 2020). Down Syndrome is
    one of the most common chromosomal disorder in India, affecting about 1 in every
    600 babies born. In the United States, it affects about 1 in every 700 babies
    born. Down syndrome occurs due to an additional copy of chromosome 21, leading
    to a genetic condition. Down syndrome cannot be cured, yet there exist treatments
    and therapies that offer assistance to individuals with the disorder live healthy
    and fulfilling lives (NIH 2017).


    About 80% of people with Down syndrome have a moderate intellectual handicap,
    while some are severely damaged and others have development that is similar to
    that of typically developing people (Sideropoulos _et al_. 2023). People with
    Down syndrome make significant contributions to society in many different fields,
    including art, music, and business. Down syndrome has intrigued researchers due
    to its distinctive physical and intellectual characteristics for decades. A recent
    study has found that about 44.9% of people with down syndrome that they studied,
    suffered with one of the following skin conditions: Folliculitis, Keratosis pilaris,
    Acne vulgaris, Hidradenitis suppurativa, Furunculosis (Firsowicz et al. 2020).
    Also, individuals with trisomy 21 (genetic causation of down syndrome) are at
    heightened susceptibility to experiencing exacerbated symptoms, higher hospitalization
    rates, increased likelihood of intensive care, secondary bacterial infections,
    and elevated mortality from SARS-CoV-2 infections compared to the general population
    (Espinosa 2020).


    Some of the common physical features of people diagnosed with down syndrome are
    flattened face, almond-shaped eyes slanting up, short neck, small ears, hands
