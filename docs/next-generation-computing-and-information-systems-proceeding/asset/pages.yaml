    ABSTRACT: Diet management requires keeping track of what you eat. The researchers
    presented a recipe retrieval technique based on food photos that retrieves the
    related recipes from the taken images and creates nutritional information accordingly,
    making recording more convenient. The retrieval of recipes is an example of a
    cross-modal retrieval challenge. Still, as compared to other challenges, the main
    challenge is that recipes explain a succession of modifications from raw ingredients
    to completed goods rather than immediately apparent characteristics. As a result,
    the model must have a thorough understanding of the raw materials processing process.
    Additionally, the model improves upon the attention mechanisms of prior techniques
    to mine the semantics of recipes more effectively. The approach enhances the recall
    rate of the recipe retrieval task by 22% over the baseline strategy, according
    to experimental data.


    # 1 INTRODUCTION


    People''s daily eating habits have a significant impact on people''s health. With
    the continuous improvement of living standards, people pay more and more attention
    to a healthy diet. As a result, the record of daily dietary intake, as a critical
    part of dietary management, has received more and more attention (Lokhande et
    al. 2021). Furthermore, for some patients with chronic diseases (such as chronic
    kidney disease), monitoring nutritional intake is even more crucial due to their
    need for disease treatment. The basic process of traditional dietary intake recording
    tools is to predict food categories and raw material types through user food pictures
    and further estimate their nutrient content. However, due to the variety of styles
    and appearances of people''s homemade foods, the actual results are insufficient
    to support the inference of nutritional content from food pictures (Salvador et
    al. 2017; Yang'
