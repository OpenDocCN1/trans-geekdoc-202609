- pgno: 188
  md: 'noise, and better preserve X-ray images Lesion information in (Islam and Mondal
    2019). The implementation steps of the algorithm are as follows:


    +   1) Divide the image into three layers, R, G, and B, convert them into three
    single-channel images, and divide them into multiple image squares of equal size
    and non-overlapping.

    +   2) Calculate the grayscale histogram of each image square:


    ```

    AVG(M) = \frac{M_x - M_y}{M_g} (5)

    ```


    Among them, AVG(N) represents the average number of pixels of the grey level,
    M_x and M_y represent the number of pixels in the X-axis and Y-axis directions,
    respectively, and M_g is the number of grey levels in the image block.


    +   3) Set a clipping coefficient O of the number of grey-scale pixels, and calculate
    the clipping threshold O_k

    +   4) Equalize the histogram of each image square.


    Two image data are randomly selected from the covid-chest x-ray-dataset dataset
    and preprocessed using the CLAHE algorithm. The results are shown in Figure 2.
    The left side is the original image of the chest X-ray, and the right side is
    the result of the image preprocessing through the CLAHE algorithm. It can be seen
    that the internal light-dark contrast is more apparent, and the details are more
    prominent.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_188_0.png)


    Figure 2. Enhancement of chest X-ray images with CLAHE algorithm.


