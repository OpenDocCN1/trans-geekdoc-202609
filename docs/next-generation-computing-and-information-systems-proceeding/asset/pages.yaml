    ABSTRACT: Dyslexia is a learning disability that is widespread and marked with
    a persistent problem with word identification and spelling. It has an impact on
    a person’s capacity to decipher letters and words accurately and fluently. Dyslexia
    has emerged as one of the most widespread learning disabilities, though the medical
    experts have not yet come out explaining its core causes. In this research, the
    prediction and classification of dyslexia is effectively carried out with the
    help of brain images which acts as input to machine learning techniques towards
    the prediction of dyslexia. The proposed dyslexic prediction model uses a Combination
    digital twin Kernel-based Support Vector Machine (KSVM) optimized by Whales algorithm.
    The combination kernel SVM shows better accuracy and less computational time compared
    to single kernel of SVM in a distributed environment. The proposed combinational
    kernel is less complex than deep learning models.


    # 1 INTRODUCTION


    Dyslexia represents a type of syndrome associated to reading impairment. Dyslexia
    does not deal with the cognitive development of children and other learning aspects
    of a child, like visual acuity and it is just a reading disability. This inability
    to read can turn into developmental dyslexia in many children. The effects of
    developmental dyslexia in children are impaired phonological processing and poor
    word identification or reading (Sahoo et al. 2016). Five to seven percent of children
    worldwide are facing difficulties because of developmental dyslexia. Studies like
    MRI brain imaging when conducted on children at an early stage, to observe reading
    skills can prove the theories related to the cause of dyslexia by accurately localizing
    neurobiological defects (Belle et al. 2015). Dyslexics perform poorly in digit
    span aptitude tests. They also show low capabilities in word arrangement and have
