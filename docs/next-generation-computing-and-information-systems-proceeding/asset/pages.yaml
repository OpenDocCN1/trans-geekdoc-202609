    # 6 CONCLUSION


    The aim of this work is to examine the classification performance of a CNN-based
    deep learning model for social media topics in the context of COVID-19 management.
    Based on the study’s specification of the CNN model, we utilized the classifier
    on three Twitter datasets that were manually labeled. These datasets are categorized
    into five groups: Aid and Donation, Resources and Infrastructure, Damage and Casualties,
    Information Sources, and Caution and Advice. Despite the fact that the CNN employed
    in the tests is a simple model that has not been further adjusted to the job at
    hand, the findings demonstrate a much superior performance when compared directly
    to traditional techniques on the dataset that'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'was taken into consideration. In the experiment related to single-event, the
    CNN classifier consistently outperforms two popular classification techniques,
    SVM and LR, with precision ranging from 0.63 to 0.98 and recall ranging from 0.60
    to 0.99 across various categories. The CNN model demonstrates superior performance
    compared to SVM and showcasing its effectiveness in handling diverse social media
    topics.


