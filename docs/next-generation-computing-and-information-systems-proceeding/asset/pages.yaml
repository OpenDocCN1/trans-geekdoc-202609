- pgno: 75
  md: 'defines the Internet of Things as “a network of products each with embedded
    sensors” linked to the Internet. According to Internet meanings, things are a
    physical, cyber system that connects physical items to the cyber domain. Sensors
    have limited computing and storage capacity, which might pose problems, particularly
    regarding security and dependability. Some of these challenges have been addressed
    using cloud computing (More and Raisinghani 2017; Shaikh and Zeadally 2016).


    # 2 REVIEW OF LITERATURE


    Several concepts and tactics for dealing with road safety, vehicle communications,
    and post-accident rescue operations may be found in the literature. This study
    concentrates on the most practical approaches and strategies: software and hardware-based
    solutions. It primarily focuses on accident detection technology that makes use
    of a variety of sensory inputs (Ali and Alwan 2015). The review of the current
    systems connected to traffic dangers and road accidents in this part reveals their
    strengths, shortcomings, and limits.


    # 2.1 Part I) Smartphone-based systems


    A substantial amount of research on this topic can be found to solve the challenge
    of low-cost, resilient solutions to detect and notify automobile accidents based
    on mobile technology. It debuted a crash alarm system in (Rajkiran and Anusha
    2014; Sane et al. 2016; Tushara and Vardhini 2016) and that used accelerometers
    and GPS data from mobile devices to identify accidents. Using an integrated accelerometer
    and gyroscope, the writers developed a smartphone-based application that detects
    unintended accidents and alerts the adjacent emergency. The planned strategy,
    is focused on reducing reaction time and does not consider vehicle accidents.


    # 2.2 Part II) Hardware-based Systems


    As mentioned, road accidents are the primary cause of fatalities; thus, more study
    is needed to discover and swiftly begin rescue efforts. The likelihood of fatality
    is lowered if the timeframe between the crash and dispatch of the rescue team
    is shortened, and this has inspired several researchers to minimize reaction time.
    The authors presented a crash tracking system in (Fogue et al. 2014), which employs
    a microcontroller to regulate all processes. Messages are delivered to a determined
    cellphone number. The response team is then dispatched to the location by the
    Emergency Center. Despite its many benefits, the system has several disadvantages.


    # 3 PROPOSED METHOD


    This study proposes an Optimized Accident Detection and Reporting System, or OADRS.
    The new OADRS crash tracking and reporting system utilizes modern Android smart
    phone capabilities and thus reduces overall cost because no special hardware is
    required. The main responsibility of the perception layer is to interact with
    smartphone sensors in the suggested architecture, and gathering data from the
    sensors is the primary aim of the perception layer in OADRS architecture (Chaturvedi
    and Srivastava 2018). There are set threshold values; if an accident happens,
    the sensor data offer a superior deal than the threshold value. When criteria
    are met, an alarm is generated and sent to the car’s driver. The hospital will
    not be called if the motorist disregards the signal to avoid false reporting.
    The cloud service will alert the nearest hospital within 10 seconds (Bhatt and
    Sharma 2023).


    The chief aim of the proposed system is to provide an architecture that can handle
    5 cases: 1) direct communication of the vehicle to the infrastructure, 2) automated
    sharing of accident data, 3) increase the precision of an accident detection,
    4) reduce fake reports and messages, 5) establish a profitable system. The activities
    of the presented architecture. The most significant variables of this study include
    multi-smartphone sensors like the'
