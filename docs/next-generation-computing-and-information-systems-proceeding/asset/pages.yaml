- pgno: 19
  md: '# Impact of artificial intelligence on high-penetration renewable physical
    infrastructure


    ![](img/9eefc6d2972274efeb1680c6a31895e5_19_0.png)


    Arif Sarwat

    Professor, Florida International University, Miami


    ABSTRACT: The efficient incorporation of substantial quantities of renewable energy
    into the power grid is crucial for ensuring a sustainable future and promoting
    environmentally-friendly smart cities. The current methods for integrating solar
    power rely on imprecise weather forecasting and inadequate load distribution,
    resulting in an overall grid performance that is both unreliable and inefficient.
    Therefore, it is necessary to adopt a more comprehensive perspective to address
    these issues. Artificial Intelligence (AI) is one such technology that is applied
    in high-penetration renewable physical infrastructure. AI-powered smart grids
    provide the real-time monitoring and control of renewable energy sources, such
    as solar and wind, to ensure the most efficient use of energy. Smart algorithms
    optimize battery lifespan, enhancing efficiency and lowering maintenance expenses.
    AI-powered predictive maintenance models are utilized to identify possible problems
    in physical infrastructure components prior to system failures. Smart buildings
    utilize AI to control heating, ventilation, and air conditioning (HVAC) systems
    by analyzing occupancy trends, weather forecasts, and user preferences. Although
    AI has mostly good effects on high-penetration renewable physical infrastructure,
    it also presents problems like as data security concerns, ethical considerations,
    and the requirement for experienced people to handle and advance these intricate
    systems. Tackling these obstacles is essential to fully harness the capabilities
    of AI in enhancing the implementation and effectiveness of widespread renewable
    energy solutions.


    BIO: Prof. Arif Sarwat is an Eminent Scholar Chaired Professor in the Department
    of Electrical and Computer Engineering, the Director of the FPL-FIU Solar Research
    Facility and Energy Power Sustainability (EPS) group at FIU. He is also the Principal
    Investigator for the state-of-the-art grid-connected 3MW/9MWh AI-based Renewable
    (AIR) Microgrid long-term project funded by FPL. His research interests include
    smart grids, electric vehicles, high penetration renewable systems, battery management
    systems, grid resiliency, large-scale data analysis, artificial intelligence,
    smart city infrastructure, and cybersecurity. He has published more than 200 peer-reviewed
    articles and multiple patents. He currently has multiple funded projects; funded
    by the National Science Foundation (NSF), industry, and the Department of Energy
    (DOE). This list includes the NSF CAREER Award. Previously, Prof. Sarwat worked
    at Siemens for more than nine years, winning three recognition awards. Prof. Sarwat
    received the Faculty Award for Excellence in Research & Creative Activities in
    2016, College of Engineering & Computing Worlds Ahead Performance in 2016, and
    FIU TOP Scholar Award in 2015 and 2019. He has been the chair of the IEEE Miami
    Section VT and Communication since 2012. He is an associate editor of the journals
    ACM Computing Surveys and IEEE IAS.'
