    # 3.2.2 Primary cooking method


    Each recipe contains a title. The title of a recipe is usually a high-level summary
    of the recipe. It usually includes the primary raw materials used in the recipe
    and the primary cooking method (such as scrambled eggs with tomatoes), and some
    also include flavors or cuisines (such as spicy shredded potatoes, Sichuan-style
    spareribs Wait). Each vector can obtain an n-dimensional hidden layer representation
    ht:


    ```

    y_u = word2vec(x_u), u \in [1, U]

    ```


    Then this paper adopts the attention mechanism to calculate the encoding of the
    entire title. The principle of the attention mechanism is to calculate the weights
    for different hidden layer representations and obtain the final feature representation
    by weighted summation, to reflect the importance of other text parts (Tharewal
    et al. 2022).


    ```

    v_u = tanh (X_{att} i_u + c_{att})

    ```


    ```

    a_u = \frac{\exp(v_u^s v_d)}{\sum_u \exp(v_u^s v_d)}

    ```


    Among them, X_{att} and c_{att} are the parameters of the perceptron layer, which
    can be trained by back propagation. The final weight, a_u obtained by the attention
    mechanism, is measured by the similarity between v_u and v_d. v_d is called the
    context vector and represents the preference for the hidden layer vector. The
    selection method of the environment vector is detailed in section 3.2.5.


    Finally, the encoded subtitle of the title (64 dimensions) is obtained by the
    weighted average of the hidden layer representations of each word in the title:


    ```

    emb_{title} = \sum_t \alpha_u i_u

    ```


    # 3.2.3 Material encoding


    Recipes usually have a section listing the various raw materials used, visible
    (e.g., tomatoes, potatoes, etc.) and invisible (e.g., salt, sugar, etc.).'
