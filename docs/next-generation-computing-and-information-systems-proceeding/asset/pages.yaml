    # 4 CONCLUSION


    Based on agent modelling and a complex network model, combined with GIS technology,
    this paper constructs a new crown pneumonia epidemic spread model for a city epidemic.
    The model uses the MCMC method to determine the critical parameters in the model.
    Using this model, this paper designs experimental scenarios based on the two modes
    of the single-point outbreak and multi-point distribution. The study found that
    the effect of community lockdown is similar in the two epidemic modes on different
    scales of lockdown measures. From the study, it is recommended to regularly organize
    a screening in high-risk areas (such as seafood markets, seafood processing plants,
    cold storage, fishing ports, etc.). Furthermore, more scenarios are designed to
    help respond to a new round of epidemic rebounds and evaluate other infectious
    disease prevention measures after the domestic virus-prone areas and foreign epidemics
    ease.


