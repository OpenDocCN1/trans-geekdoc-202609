- pgno: 13
  md: '# Fast reinforcement learning


    ![](img/9eefc6d2972274efeb1680c6a31895e5_13_0.png)


    Sartaj Sahni


    Professor, University of Florida


    ABSTRACT: Reinforcement Learning (RL) is a highly effective approach for teaching
    intelligent agents to make decisions in challenging and ever-changing contexts.
    With the increasing use of RL in real-world situations, there is a rising demand
    for rapid reinforcement learning to improve effectiveness, decrease training duration,
    and facilitate immediate decision-making across many fields. Fast Reinforcement
    Learning can be achieved through various methods, one of which is Parallelization.
    This involves splitting RL computations across numerous processors or GPUs to
    take advantage of parallel processing capabilities, resulting in a large reduction
    in training time. Another method involves utilizing specialized hardware such
    as GPUs and TPUs that can enhance the speed of RL training by executing parallel
    computations more effectively than conventional CPUs. Developing and executing
    RL algorithms that are designed to be more efficient and have lower computational
    complexity leads to quicker learning. Cache memory is also essential in accelerating
    reinforcement learning by minimizing the access time for frequently utilized data.
    It enhances the performance of RL algorithms by storing and retrieving crucial
    information, such as state-action pairs and Q-values. Cache memory usage optimizes
    data access patterns, resulting in reduced latency and improved speed of learning
    rounds. The landscape of fast reinforcement learning will be shaped by overcoming
    challenges such as transfer learning and meta-learning, algorithmic complexity,
    scalability to handle data sets of complex environments, generalization, etc.
    will continue to shape the landscape of fast reinforcement learning.


    BIO: Prof. Sartaj Sahni is a Distinguished Professor of Computer and Information
    Sciences and Engineering at the University of Florida. He is also a member of
    the European Academy of Sciences, a Fellow of IEEE, ACM, AAAS, and Minnesota Supercomputer
    Institute, and a Distinguished Alumnus of the Indian Institute of Technology,
    Kanpur. In 1997, he was awarded the IEEE Computer Society Taylor L. Booth Education
    Award for contributions to Computer Science and Engineering education in the areas
    of data structures, algorithms, and parallel algorithms”, and in 2003, he was
    awarded the IEEE Computer Society W. Wallace McDowell Award for contributions
    to the theory of NP-hard and NP-complete problems. Prof. Sahni was awarded the
    2003 ACM Karl Karlstrom Outstanding Educator Award for outstanding contributions
    to computing education. In 2016, Prof. Sahni was awarded the IEEE Technical Committee
    on Scalable Computing (TCSC) Award for Excellence in Scalable Computing. Prof.
    Sahni has published over 420 research papers and written 15 texts. He has 15 US
    patents. His research publications and patents are on the design and analysis
    of efficient algorithms, parallel computing, interconnection networks, design
    automation, and medical algorithms. He is past Editor-in-Chief of ACM Computing
    Surveys and past co-Editor-in-Chief of the Journal of Parallel and Distributed
    Computing.'
