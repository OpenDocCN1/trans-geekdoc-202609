    # 3.1 Overview of the dataset


    A cutting-edge dataset, DEAP [Koelstra et al. 2012], is discussed in this paper,
    which includes EEG signals that were captured on the scalp using 32 electrodes.
    The electrical activity of the brain is measured with the help of EEG, which provides
    information about emotional reactions. Physiological signals including conductance
