    dataset. Additional details regarding the participant''s emotions may be revealed
    by these signals. A collection of 40 video clips intended to illicit different
    emotions, such as fear, anger, sadness, and happiness, were shown to the participants.
    Following a screening of every movie, the participants self-reportedly rated their
    emotional experiences. For tasks involving emotion classification and regression,
    these ratings serve as the ground truth. In the domains of affective computation,
    recognizing emotions, and brain-computer interfaces, the DEAP dataset is extensively
    used. A snapshot of the DEAP dataset is given in Figure 1.


