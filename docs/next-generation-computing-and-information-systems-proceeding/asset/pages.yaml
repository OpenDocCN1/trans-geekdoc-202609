  md: '# 3.2 Batch normalization


    One of the prevalent methods for normalising activations within a neural network
    across a mini-batch of a specified size is batch normalisation. This technique
    involves computing the mini-batch’s mean and variance for each feature. Subsequently,
    the feature is normalised by subtracting the mean and dividing by the standard
    deviation of the mini-batch. By re-centring and rescaling the inputs of layers,
    batch normalisation also referred to as batch norm—allows artificial neural networks
    to be trained more quickly and steadily. In 2015, Christian Szegedy and Sergey
    Ioffe made the suggestion.


    # 3.3 Max pooling


    One of the most prevalent characteristics of convolutional neural networks is
    pooling (Sharma et al. 2020). The pooling layer’s primary goal is to utilise the
    normalised feature map’s “accumulate of collect” feature, produced by applying
    a convolutional filter to the image. The main task is to continuously reduce both
    the spatial size of the featured map and the amount of network computation required.
    The most popular kind of pooling is max pooling. The process of pooling that chooses
    the maximum element from the area of the feature map that the filter covers is
    called max pooling. Therefore, a feature map with the most noticeable features
    from the prior feature map would be the output following the max-pooling layer.
    The following are max pooling’s main advantages:


    +   - **Dimensionality reduction**: It lowers the input data’s spatial dimensions,
    which aids in managing the number of parameters and computational complexity in
    the neural network’s later layers. This can expedite training and avoid overfitting.

    +   - **Translation Invariance**: Max pooling contributes to a certain level of
    translation invariance, which allows the model to identify features independent
    of their precise location in the input.

    +   - **Feature Selection**: Max pooling helps capture unique patterns and reduce
    noise by highlighting the most significant features in each region and choosing
    the maximum value. Additionally, max pooling has drawbacks, such as losing fine-grained
    spatial information because only the maximum value is chosen.


    Other options for max pooling include average pooling, which determines the average
    value in each region, and more sophisticated pooling methods that adjust to the
    input size, like global average pooling and adaptive pooling. Convolutional neural
    networks use max pooling as a basic operation for dimension reduction and feature
    extraction, especially in computer vision tasks like object recognition and image
    classification. Max pooling and average pooling are represented using eq (1) and,
    (2) respectively.


    ```

    f(m) = [f1(m),...,fk(m),...,fK(m)]^T, fk(m) = max(x), x \in Xk       (1)

    (a) = [f1(a),...,fk(a),...,fK(a)]^T, fk(a) = 1/(|Xk|) \sum x, x \in Xk   (2)

    ```


    ![](img/9eefc6d2972274efeb1680c6a31895e5_156_0.png)


    Figure 2. A representation of Max pooling in CNN.'
