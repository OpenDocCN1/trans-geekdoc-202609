    # 3.5 Principal component analysis


    PCA is a prominent dimensionality reduction method. It gives high-dimensional
    observations the best linear approximations. PCA finds a subspace with linearity
    of lower dimensions p (p < d) that retains the highest variance for data a with
    high-dimensionality d. PCA decreases data dimensionality while minimizing variation-related
    information loss. The data matrix is defined as $A = [a_1 - a_u, a_2 - a_u, ...,
    a_n - a_u] \in \mathbb{R}^{d \times n}$ to make $A$ row-wise zero-mean, as well
    as the square matrix $M = AA^T \in \mathbb{R}^{d \times d}$. In decreasing sequence,
    $M$''s $d$ eigenvalues and their associated eigenvectors, dubbed "Principal Components,"
    are $v_1, v_2, ..., v_d$. Then, a criterion is set to retain only certain parts
    of the principal components, such as:


    ```

    1.0 - \frac{\sum_{i=1}^p \Lambda_i}{\sum_{k=1}^d \Lambda_k} \le \sigma \quad \text{with}
    \quad p \le d \quad (6)

    ```


    where $\sigma$, a modest variable around zero, determines dimensionality reduction
    accuracy. e.g., if we set $\sigma = 0, p = d$ or $M$ has a minimum of one zero
    eigenvalue, as well as $p < d$. Definition concludes.


    ```

    V = [v_1 \ v_2 \ \dots \ p_p]_{d \times p} \quad (7)

    ```


    as


    ```

    1.0 - \frac{\sum_{i=1}^p \Lambda_i}{\sum_{k=1}^d \Lambda_k} \le \sigma \quad \text{with}
    \quad p \le d \quad (8)

    ```


    where $\sigma$, a tiny number around zero influences dimensionality reduction
    accuracy. e.g., if we set $\sigma = 0, p = d$ or $M$ contains at least a single
    zero eigen frequency and $p < d$. Definition concludes.


    ```

    V = [v_1 \ v_2 \ \dots \ v_p]_{d \times p''} \quad (9)

    ```


    and B = VTA, the dimensionally reduced data matrix. The following relation reconstructs
    the data.


    ```

    A^{\wedge} d \times n = VB \quad (10)

    ```'
