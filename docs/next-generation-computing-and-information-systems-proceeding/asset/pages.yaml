  md: '# Applicability of eye tracking technology in virtual keyboard for human-computer
    interactions


    Heena Wadhwa, Keshvi Dhir & Lokesh Deswal

    Chitkara University Institute of Engineering & Technology, Chitkara University,
    Punjab, India


    ABSTRACT: The vast field of Human-Computer Interaction, or HCI, which is primarily
    concerned with the interactions between people and computers, used to be solely
    concerned with scientific testing in the past. But nowadays it also designs user-focused
    interfaces and aids in the creation of smart surroundings. We have discussed the
    detailed applications of HCI. However, a lot of difficulties arise in implementing
    environment friendly solutions as a result of these advancements in HCI. It has
    been related to eudaimonia, which is the concept of feeling meaningfulness, realizing
    one’s potential. Moreover, practically any area may now apply HCI, including industrial
    design, psychology, sociology, and computer science. Further, we analyzed the
    evolution of HCI over the past decade. Developments in HCI research have also
    led to the invention of the eye tracking control-based system. The use of an eye-tracking
    system to enhance learning processes and facilitate accurate and efficient visual
    recognition of geospatial data has also been covered in this study. In addition,
    a typing experiment is carried out where participants are given access to a virtual
    keyboard in order to better understand how this technology might improve users’
    accuracy and speed when typing. The Technology Acceptance Model (TAM), which is
    used in this experiment, allows us to determine whether or not consumers are adopting
    the suggested technology based on responses to the TAM questionnaire. The majority
    of users deemed this system to be helpful, simple to use, and understandable,
    based on the experiment’s outcomes and the TAM questionnaire. The investigation
    revealed that while female participants’ average accuracy was lower than male
    participants’, male participants’ average speed was higher. Later in the paper,
    we have elaborated challenges of HCI, a few of which are ethics, privacy, security,
    accessibility, learning and creativity, etc.


    # 1 INTRODUCTION


    HCI has been transformed from focusing on a single specialty area (scientific
    testing) to generating new user interface designs which include a community of
    tech professionals, researchers, designers, and creators, working together for
    better user experience. HCI has covered almost all forms of information technology.
    Today, in this field we give importance to designing interactive computer interfaces
    and computing machines so that the user can have a better experience, easy-to-understand
    software, smart environment, etc. The original technical focus of HCI was and
    is on the concept of usability. Technologies like voice-based and Internet of
    Things (IoT) cognitive interaction have increased a lot, having the ability or
    skill to do everything is one of the main components that can upgrade the overall
    user experience. There are various interface-related features such as touch, click,
    voice, display size, color contrast, and brightness. Major job roles in HCI is
    usability engineer, human factor specialist, designer, researcher, etc. HCI makes
    software and gadgets more useful for us by designing and implementing interactive
    interfaces which focus on different interface aspects as described in Figure 1.
    All these aspects make sure that the user can adjust things according to their
    needs creating a better experience for them.'
