    ```

    $rf\_expend_l = (m_l - 1) * (n - 1) * \prod_{i=1}^{l-1} t_i$

    ```


    # 3.2 Basic atrous convolution lightweight method


    Modern convolutional neural networks such as VGG, Reset, DLA, etc., use two convolutional
    layers in series to form convolutional groups for feature extraction. Then, the
    size of the convolution kernel of the first layer is M1 x M1 x C1\_in x D1\_out,
    M1 is the size of the convolution kernel, C1\_in is the number of input channels
    of the convolution kernel and D1\_in = D_in, D1\_out is the number of output channels
    of the convolution kernel, and the second layer of convolution the kernel size
    is M2 x M2 x D2\_in x D2\_out, M2 is the size of the convolution kernel, D2\_in
    is the number of input channels of the convolution kernel, D2\_out is the number
    of output channels of the convolution kernel, and D_out is the number of output
    feature map channels, then D1\_out = D2\_in = D2\_out = D_out. Let the step size
    of the convolution operation by 1, and there is no padding operation. Then, the
    feature map receptive field R1 obtained by the concatenation of two ordinary convolution
    layers is:


    ```

    $S_1 = sf_{in} + M_1 + M_2 - 2$

    ```


    Among them, sf_in represents the receptive field of the input feature map. Let
    the size of the atrous convolution kernel be EL x EL x D_in x D_out, then its
    receptive field S2 is:


    ```

    $S_2 = sf_{in} + EL - 1$

    ```


    Set the whole convolution based on the first layer of ordinary convolution and
    add holes to it. Then its expansion rate m = (M2 - 1) /(M1 - 1) + 1, S1 = S2,
    NT1 = NT2.

    Set the primary whole convolution lightweight method. The convolution kernel size
    EL is expanded from the ordinary convolution of size M1, and the calculation amount
    V2 is:


    ```

    $V_2 = H_{in} * X_{in} * M_1 * M_2 * D_{in} * D_{out}$

    ```


    It can be seen from equation (2) that the whole convolution structure has similar
    interval sampling characteristics.

    To verify the performance of atrous convolution for lightweight, this paper embeds
    the atrous convolution lightweight method into several typical convolutional neural
    network structures VGG (Shin et al. 2021), ResNet and DLA (Wang et al. 2021).


    # 3.3 Improved atrous convolution lightweight method


    Inspired by the design ideas of lightweight neural networks Mobile Net and Squeeze
    Net, this paper combines atrous convolution with 1 x 1 point-by-point convolution,
    further improves the basic atrous convolution residual block, and proposes an
    enhanced atrous convolution lightweight method.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_131_0.png)


    Figure 1. 1 x 1 convolutional compression feature map process.'
