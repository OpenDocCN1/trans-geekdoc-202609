- pgno: 121
  md: '# Multi-class instance segmentation for the detection of cervical cancer cells
    using modified mask RCNN


    Diksha Sambyal


    Department of CS&IT, University of Jammu, India


    Abid Sarwar


    Department of CS&IT, Bhaderwah Campus, University of Jammu, India


    ABSTRACT: Cervical cancer remains a leading cause of female mortality, underscoring
    the vital role of timely detection in mortality reduction. Accurate cell segmentation
    is pivotal for automating cervical cancer screening and enabling early diagnosis.
    This study offers a comparative analysis employing Mask RCNN with ResNeXt101-FPN
    and ResNet101-FPN for advanced multi-class instance segmentation in cervical cell
    analysis. Uniquely, it is the only research endeavor implementing Mask R-CNN,
    segmenting the whole cervical cell images into seven distinct classes aligned
    with the TBS reporting system. Leveraging the SIPaKMeD dataset, a stratified data
    partitioning scheme of 60% for training, 20% for 5-fold cross-validation, and
    20% for testing was employed. Both configurations achieve similar mean Average
    Precision (mAP) values of 89% and 88%, alongside consistent accuracy (87%), sensitivity
    (89%), and specificity (88%). Results affirm ResNeXt101-FPN and ResNet101-FPN
    efficacy, potentially automating medical cervical cell analysis, reducing medical
    workload, and enhancing diagnostic accuracy. Future endeavors will center on innovating
    backbone structures. Moreover, equal emphasis will be placed on augmenting the
    expansive and diverse datasets to encompass a wider spectrum of cervical abnormalities.


    # 1 INTRODUCTION


    Cervical cancer is the third most common malignancy among women globally. The
    majority of cervical cancer fatalities, accounting for more than 85% of cases,
    occur in countries with low or middle incomes, where it stands as the leading
    cause of cancer-related deaths in women(Cohen et al. 2019). This glaring inequality
    in disease burden is primarily attributed to limited access to screening, early
    diagnosis, and effective treatment for pre-cancers and cancer. Over 604,000 cases
    of cervical cancer were diagnosed in 2020; of the 342,000 fatalities from cervical
    cancer, almost 90% occurred in nations with middle or low incomes (Sarwar et al.
    2020). These statistics underscore the urgent need for enhanced screening methodologies
    and vaccination initiatives in resource-constrained regions to address this critical
    global healthcare disparity. Theoretically, by ensuring high-quality and widespread
    screening, the occurrence of cervical cancer could potentially be decreased by
    up to 90%. Routine gynecological screenings, often employing Pap tests, have proven
    effective in detecting the majority of cervical cancer cases. The Bethesda System
    (TBS), also known as The Bethesda System for Reporting Cervical Cytology, serves
    as a widely adopted framework for reporting Pap smear findings in cervical or
    vaginal cytologic diagnoses. TBS categorizes cells into seven distinct classes,
    including Superficial Squamous Cells, Intermediate Squamous Cells, Parabasal Cells,
    Basal Cells, LSIL (Low Grade Intraepithelial Lesion), HSIL (High-Grade Intraepithelial
    Lesion), and CIS (Carcinoma in situ) cells as per established criteria(Nayar and
    Wilbur 2017).'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'With the advent of deep learning and Convolutional Neural Networks (CNN)(Dongyao
    Jia et al. 2020), a new wave of segmentation models based on deep learning has
    surfaced, exhibiting notable performance improvements and highlighting their promise
    in medical image segmentation. Contemporary detection algorithms, including two-stage
    methods like Faster R-CNN (Ren et al. 2015), R-CNN, and Fast R-CNN (Girshick 2015),
    as well as single-stage methods such as YOLO and SSD, are frequently employed
    in current applications. Furthermore, models like SegNet, Mask R-CNN (He et al.
    2017a), DeepLab, and various improved techniques have significantly elevated image
    segmentation performance. Specifically in cervical cancer screening, these models
    have revolutionized the interpretation of Pap smear images and cytologic data
    by enabling precise cell segmentation and classification. Their capabilities span
    improved localization, real-time detection, pixel-level classification, and instance
    segmentation—crucial for accurately identifying and characterizing various cell
    types according to the TBS reporting system. Their adaptability and precision
    in handling diverse cell structures underscore their pivotal role in augmenting
    the accuracy and efficiency of cervical cancer diagnostics.


    # 2 RELATED WORK


    Instance segmentation, a pivotal task in computer vision, amalgamates object detection
    and semantic segmentation, endowing machines with the capacity to not only recognize
    and categorize objects in images but also to demarcate and individuate each object
    instance. This capability finds a noteworthy application within the domain of
    medical image analysis, where the quest for precision is paramount. Over the years,
    a plethora of instance segmentation techniques have evolved, each contributing
    to the progress of this discipline.


    One particularly distinguished approach is Mask R-CNN (He et al. 2017b), an enhanced
    version of the renowned Faster R-CNN model, which enhances detection of objects
    with a mask prediction branch, facilitating the precise demarcation of object
    boundaries. In the realm of medical image analysis, Mask R-CNN is harnessed for
    the meticulous segmentation of anatomical structures and pathological irregularities
    across various medical imaging modalities, thereby bolstering the accuracy of
    diagnostic processes and improving healthcare outcomes.For instance (Hsieh et
    al. 2020) combined Mask R-CNN, Inception V3 , and VGG16 to identify the malignant
    and benign of breast microcalcification clusters. The method achieved precision,specificity
    and sensitivity 87%, 89% and 90%, respectively.


    Several researchers have ventured into the application of the MASK-RCNN method
    within the realm of the cervical cancer cell detection. For instance, (Sagar et
    al. 2023) employed a smaller Visual Geometry Group-like Network combined with
    a MaskR-CNN utilizing ResNet10 as a backbone for the effective segmentation of
    cervical cells. Their methodology was tested using the Herlev Pap Smear dataset,
    yielding impressive single-cell segmentation results: an accuracy of 92.0%, recall
    of 91%, and ZSI of 81%. (Agustiansyah et al. 2022) employs a mask-RCNN architecture
    was for concurrent segmentation, classification, and detection of columnar areas
    and acetowhite lesions. Utilizing 262 positive and 222 negative cervicogram images,
    the model delivered notable results: 63.60% IoU for columnar area segmentation,
    73.98% for acetowhite lesions, and a mAP of approximately 86.90% for columnar
    areas and perfect 100% for acetowhite lesions in detecting cervical cancer precursor
    lesions. Achieving 92% specificity and 100% sensitivity highlighted the model’s
    accuracy in identifying cervical abnormalities.


    Similarly, (Chen and Zhang 2021) presented a Mask RCNN-based approach designed
    to tackle the challenging task of cell segmentation, distinguishing between abnormal
    and normal cells within cytology images. Their work leveraged high-resolution
    cytology of the cervical region images and accompanying ground truth cell segmentation
    data from the ISBI 2014 and ISBI 2015 datasets. Notably, the Mask RCNN achieved
    outstanding performance, with a Dice Similarity Coefficient (DSC) of 0.92 and
    a False Positive Rate per pixel (FP/rp) of 0.0008 at a DSC threshold of 0.8. These
    results indicate the efficacy of the segmentation utilizing Mask RCNN technique
    in the domain of cytological analysis.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'None of the previously mentioned studies have leveraged the Mask R-CNN technique
    for multi-class instance segmentation beyond two classes. Furthermore, these studies
    predominantly concentrated on single cell images within the context of medical
    analysis. To the best of our knowledge, our research marks a pioneering effort
    in implementing the segmentation framework utilizing Mask R-CNN of entire images
    encompassing cervical cells, categorizing them into seven distinct classes as
    per the TBS reporting system. This novel approach, utilizing a dataset comprising
    whole images from pap smear slides, represents a significant advancement within
    the realm of medical image analysis and offers a hopeful avenue for the more comprehensive
    characterization and diagnosis of cervical cell abnormalities.


    # 3 METHOD AND METHODOLOGY


    # 3.1 Dataset


    In this study, we utilized the publicly accessible SIPaKMeD(Plissiti et al. 2018)
    dataset, which comprises of 966 images of clustered cells obtained from Pap smear
    slides. Skilled cytopathologists have categorized these cells into five distinct
    groups based on their cellular appearance and morphology: superficial-intermediate,
    parabasal, koilocytes and dyskeratotic, and metaplastic cells (Plissiti et al.
    2018). To ensure conformity with the TBS classification system, we further categorized
    the SIPaKMeD dataset into seven specific cell types as illustrated in Figure 1:
    superficial squamous cell, intermediate squamous cell, parabasal squamous cell,
    basal squamous cell, low-grade squamous intraepithelial lesions (LSIL), high-grade
    squamous intraepithelial lesions (HSIL), and CIS. This classification allows for
    a comprehensive and standardized analysis of the cellular compositions within
    the dataset, facilitating research and data interpretation within the field of
    cytopathology.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_123_0.png)


    Figure 1. Seven classification categories: 1) Superficial squamous cells, 2) Intermediate
    squamous cells, 3) Parabasal cells, 4) Basal cells, 5) LSIL, 6) HSIL.


    This systematic segmentation not only underscores the dataset''s suitability for
    research and clinical applications but also ensures its compliance with the standards
    prescribed by TBS. The compatibility of the SIPaKMeD dataset with TBS highlights
    its significance as a valuable resource for cervical cancer diagnosis and furthers
    the progression of diagnostic advancements and classification models within this
    established framework.


    For the purpose of our experiments, 60% of the dataset per class has been allocated
    for training, 20% is set aside for cross validation, and the remaining 20% for
    testing, adhering to a standard data partitioning scheme commonly employed in
    scientific investigations.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 3.2 Data preprocessing


    For the data preprocessing stage, we employed an AI tool, specifically the ‘MakeSense.AI’
    annotation tool, which was tailored to label cervical cancer cells according to
    the TBS system. This tool efficiently streamlined activities like object detection,
    image classification, and segmentation, offering users the ability to delineate
    bounding boxes, assign labels, or trace objects. The resulting annotation information
    was stored in JSON files. Prior to integration into our model, we executed several
    image preprocessing steps to prepare the images obtained from Pap smear slides
    for annotation. These preprocessing steps included resizing, normalization, data
    augmentation, and background removal.


    Our dataset encompasses a total of 966 images, each containing multiple cells.
    These images have been meticulously annotated, resulting in a total of 4,136 annotated
    images. Figure 2 provides a visual representation of the annotation process, depicting
    sample image with annotation labels and highlighting Squamocolumnar Junction (SCJ)
    Structures. These annotations cover seven distinct classes, which include Superficial
    Squamous Cells, Intermediate Squamous Cells, Parabasal Cells, Basal Cells, LSIL,
    HSIL, and CIS.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_124_0.png)


    Figure 2. Sample of Annotated Images: (a) Original Data; (b) Annotation Labels;
    and (c) SCJ Structures.


    # 4 THE MODIFIED MASK-RCNN MODEL


    The instance segmentation of cervical cells, following the TBS classification
    system, is conducted utilizing employs the well-established developed by Facebook’s
    Artificial Intelligence Research (FAIR) Mask R-CNN (He et al. 2017b). This methodology
    represents an amalgamation of semantic segmentation and object detection techniques,
    signifying an advancement from the preceding Faster RCNN, Fast RCNN, and RCNN
    approaches. The workflow of this framework comprises two fundamental phases: (a)
    Generating region proposals, and (b) subsequently classifying each of these generated
    proposals. Figure 3 provides a visual representation of the Modified Mask R-CNN
    Architecture.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_124_1.png)


    Figure 3. Modified mask R-CNN architecture.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 4.1 Model implementation and hyperparameter configuration


    In our implementation of Mask R-CNN, we utilized a FPN as the backbone. For the
    bottom-up portion of FPN, we employed pre-trained ResNet-101 and ResNeXt101 models,
    which were initially trained on the ImageNet dataset. In the RPN, we incorporated
    anchors of varying sizes. Specifically, we specified the dimensions of the anchors
    as 128, 64, 32, 16, and 8 pixels, whereas the height of each anchor is set as
    a proportion relative to its width, ranging from 0.33 to 3. Consequently, the
    mean anchor encompasses 25 distinct sizes, and we employed 512 anchors per image
    for RPN training.


    The network head comprises three key branches: a classification branch, a mask
    branch, and a detection branch. To train the network head, we used 512 RoIs per
    image. The classification branch produced 7 outputs, each corresponding to different
    cell types or abnormalities defined by the TBS classification system. The mask
    branch, on the other hand, typically generates binary masks. For multi-class instance
    segmentation, the mask branch is extended to include seven parallel sub-branches,
    with each sub-branch dedicated to predicting masks for one of the seven classes.
    For the detection branch, we adopted the default Matterport implementation to
    support our Mask R-CNN framework.


    # 4.2 Loss function


    In our methodology, the mask branch''s loss function has been tailored to address
    the requirements of multi-class instance segmentation. With the objective of predicting
    masks for each of the seven distinct classes in our task, we appoint a loss function
    utilizing binary cross-entropy, computed individually for each class. For a given
    class, this loss function measures the dissimilarity between the predicted mask
    and the corresponding ground-truth mask. It quantifies the agreement between the
    predicted probability values and the true class presence, thus facilitating the
    accurate segmentation of objects across different categories.


    # 5 EVALUATION METHODS


    The optimal model, chosen through a rigorous 5-fold cross-validation process based
    on the highest mean Average Precision (mAP) achieved by the Mask R-CNN, was subsequently
    used for evaluation on a test dataset containing 190 pap smear slide images. Given
    the increased complexity inherent in our multi-class instance segmentation task
    for cervical cell analysis, we meticulously tailored our evaluation metrics to
    ensure a comprehensive assessment. The evaluation included:


    +   (1) Class-specific mean Average Precision (mAP): Calculated independently
    for each of the seven classes as prescribed by the TBS system. This fine-grained
    analysis enables the assessment of the model''s efficacy in segmenting and classifying
    each class individually. The overall mAP score is determined by averaging the
    mAP values across all seven classes.


    +   (2) Class-specific Accuracy, Sensitivity, and Specificity per Image: For a
    detailed evaluation of the model''s performance, metrics such as accuracy, sensitivity,
    and specificity were computed separately for each class. This approach provides
    insights into the model''s performance for individual classes in terms of their
    accuracy, sensitivity, and specificity.


    # 6 EXPERIMENTAL RESULTS


    Figure 4 visually represents outcomes from our adapted Mask R-CNN model and offer
    insights into the model''s performance, demonstrating its ability to identify
    and categorize cell types or abnormalities effectively.'
