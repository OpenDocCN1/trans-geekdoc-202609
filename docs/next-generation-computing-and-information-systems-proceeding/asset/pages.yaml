  md: '# Efficient data visualization through novel recurrent neural network-based
    dimension reduction


    Saurabh Sharma, Shafalika Vijyal & Navin Mani Upadhyay


    Department of Computer Science & Engineering, Model Institute of Engineering and
    Technology, Jammu, J&K, India


    ABSTRACT: Data visualization can be a challenging task in our everyday lives,
    especially when dealing with large and complex datasets. Multiple researchers
    have dedicated their efforts to this topic and have put forth various solutions,
    such as t-SNE, UMAP, and the Tramp technique. These techniques maintain the overall
    structure, but they do not accurately depict the local structure in the visualization.
    Therefore, many of them are not suitable for all types of data sets. Because of
    these issues, the demand for other novel approaches for data visualization will
    be high. In this paper, the proposed work is based on a novel Recurrent Neural
    Network (RNN) based dimension reduction technique to correctly visualize the selected
    real-world data set. The RNN models can reliably visualize and forecast the numeric
    values for a general-purpose machine architecture, but for special-purpose machines,
    the construction of RNN architecture construction has yet to be devised. The proposed
    model is based on a trial and error-based iteration technique for multiple input
    parameters. The major challenge for the selection of such input parameters is:
    that when there are many input factors, it is hard to determine which ones affect
    model prediction. This problem is reflected as the “curse of dimensionality.”
    The proposed method shows a significant improvement of up to 3% compared to all
    three compared models (t-SNE, UMAP, & Tramp).


    # 1 INTRODUCTION


    Machine learning plays a substantial role in the era of Artificial Intelligence.
    It varies its models as the nature of data changes (Townes et al. 2019). From
    a large variety of data sets the most complex data sets are categorized as hyper-spectral
    image data sets which use sometimes an ultraviolet (900 1700 nm) band to represent
    the images or use more than 3 dimensions. Since the data sets have more than 3
    dimensions, it is very difficult to apply direct Linear & nonlinear dimension
    reduction approaches to visualize such data sets (Daneshfar et al. 2021). So,
    the visualization techniques that were bound with Linear & nonlinear dimension
    reduction techniques are PCA, MDS, and t-SNE (Mithilesh et al. 2022). The second
    major problem is selecting the correct classifier for the classification of such
    images. So, based on several selecting literature, this paper uses SVM and ELM
    to classify and grade the selected images. SVM and ELM models of classification
    identified each hyper-spectral picture pixel to create the prediction map (Mazher
    et al. 2020).


    In classification problems, within machine learning the final determination is
    often based on factors. These factors, known as features can become overwhelming
    to visualize and work with when there are many of them. Occasionally many of these
    features are unnecessary duplicates. This is where dimensionality reduction algorithms
    come into action. Dimensionality reduction involves decreasing the number of variables
    being examined by identifying a set of variables. It can be divided into two categories;
    feature selection and feature extraction (Chen Li et al. 2023).'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 1.1 Feature selection in dimensionality reduction


    Dimensional reduction using PCA and t-SNE has been used with the RNN algorithm
    for training purposes to improve model prediction (Mithillesh et al. 2022). RNN
    architecture, pre-processing, and task type affected MLP and RNN prediction accuracy.
    Thus, a scalable method that can handle diverse data is needed. Dimension reduction
    strategies either retain the pairwise distance pattern across all data samples
    or preserve local lengths over global distances (Chen Li et al. 2023).


    Maximum Machine Learning problems involve thousands of features, which leads to
    two major problems. It makes the training extremely slow, and finding a good solution
    will be highly difficult. The training models used and compared for this research
    are based on t-SNE, UMAP, and Tramp techniques.


    # 1.2 Feature extraction for dimensionality reduction


    The two main approaches introduced for Feature extraction for dimensionality reductions
    are Projection and Manifold Learning. The RNN algorithm gets input from the output
    of the PCA algorithm, which has a quite reduced dimensionality (Yaicharoen et
    al. 2023). In this work, the proposed RNN approach is based on two strategies.
    The first is applying direct RNN modeling without dimensionality reduction. The
    second is applying PCA with RNN models for dimensionality reduction.


    The main contribution of this research is the introduction of a method that uses
    RNN for reducing dimensionality, in data visualization. This approach aims to
    address the limitations of techniques and improve the accuracy of visualizing
    real-world datasets. The study presents a trial-and-error technique for optimizing
    input parameters in the RNN model. It also discusses how this method can be applied
    to spectral image datasets, which typically have more, than three dimensions.


    # 2 LITERATURE SURVEY


    Numerous research publications on dimension reduction techniques for effective
    data visualization have been published during the last several years. Existing
    feature selection approaches are computationally costly when used individually.
    Applying these algorithms reduces computing costs and improves prediction performance.
    This paper demonstrates that several dimension reduction strategies may increase
    machine learning model performance by reducing the feature count (Sinha et al.
    2021). (Kumari et al. 2021) have use one technique i.e., t-SNE. Which divides
    the data sets into six groups, SVM & ELM prediction sets produced a 100% and 96.35%
    precise and correct output. (Tingting et al. 2021) have used SVM modeling and
    found six classes for the same selected data sets. Our study shows that the t-SNE
    visualization technique is optimal for such a data set. (Zaaraoui et al.) have
    proposed an HFRM model to find the effective feature. The HFRM detects and recognizes
    local features extracted from the Hyper-spectral data sets. The experimental results
    suggest that the proposed HFRM approach outperforms the current method of (Kumari
    et al. 2021) in terms of rate for prediction and accuracy. Another researcher
    (Tingting et al. 2021), has discovered a classification problem based on weather-related
    data sets, which rely on both humidity and rainfall and can be collapsed into
    just one underlying feature. Since both of the aforementioned are correlated to
    a high degree. Hence, they have reduced the number of features in their selected
    problem. (Kumari et al. 2021) have discovered a 3-D classification problem that
    includes all 3 dimensions: 2-D, and 1-D image classification problems.


    One more important method has been proposed by (Behera et al. 2022) called the
    EBRFE algorithm. The FBRFE algorithm has been used to reduce nonlinear dimensionality.
    FBRFE visualizes information in a lower dimension with a better mean correlation
    of 120.17 % with fewer overlapping than standard techniques (Kumari et al. 2021).'
