    # 6 FUTURE CHALLENGES OF HCI


    There are various challenges and problems that HCI had to face through the years
    which are mentioned in the following section.


    # 6.1 Human-technology symbiosis


    With the rise in the development of AI, everything is getting automated so it
    becomes very crucial that humans control everything, not various algorithms and
    computers. Therefore, we should create technology which is supporting users in
    their daily lives and respecting humans, their rights, and establishes trust.
    To that we need three factors which are transparency, understandability, and accountability,
    which will build a fair relationship of trust between humans and machines. Interactions
    in changing and smart environments have been transformed from conventional to
    focusing on the user''s emotions, touch, and gestures meaning shifting from HCI
    to HEI (human-environment interaction) (Stephanidis et al.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '2019). A major concern in this approach is the disappearance of computers as
    they become visible in distinctive devices, creating a smart environment as the
    computers become part of the furniture (tables, walls, etc) (Stephanidis et al.
    2019). As technology keeps growing the need for adapting these changes in our
    everyday life is also important and concerning that these technological changes
    do not disturb our environment (Stern 1993).


    The important role of HCI is to make sure that there is smart interaction between
    both worlds, creating a hybrid world that consists of physical and digital worlds
    both. Having smart robots working with and for us, computers embedded in our environment.


    # 6.2 Ethics, privacy, and security


    The goal is to provide these advanced HCI technologies to a large number of people
    to have a potential impact and to do that it becomes very important to take care
    of human privacy, ethics, and security. So, the question arises, “How do we create
    and implement guidelines, privacy, security, and standards for HCI and AI technologies
    that are universally acceptable and also recognize human rights?” (Kisselburg
    et al. 2020). The answer to this question is research, experiments, and cyber
    security. Nowadays as everything is digital cybercrimes have taken a rise and
    people have become more cautious of their privacy and security. Today one can
    track every information of the other through cyber-attacks and that’s why maintaining
    cyber security becomes very important. Technology provides answers to this problem
    with various systems like surveillance cameras, IOT-connected home appliances,
    smart door locks, facial recognition systems, etc.


    # 6.3 Well-being, health, and eudaimonia


    Technological advances offer various opportunities for humans to have a more advanced
    and less expensive healthy lifestyle and become more fit. Eudaimonia is a concept
    of feeling meaningfulness, realizing one’s potential, feeling positive, and creating
    a balance between skills and challenges. Because of these various advanced technologies
    humans have created ‘Personal Medical Devices’ (PMDs) that one can wear, interact
    with, carry, or attach to it, to monitor their health and generate medical data.
    PMDs not only refer to wearable devices but there are a lot of self-monitoring
    applications in smartphones that can improve the overall health of the user because
    they are easy to use, easy to understand, and low cost (Culén et al. 2014).


    # 7 CONCLUSION


    Virtual keyboard typing practice system can be very beneficial for those who need
    to type in their jobs or studies. As through this system users can know where
    they lack, so they can keep practicing to improve their typing speed and accuracy
    dramatically. Typing fast with great accuracy can save a lot of an individual’s
    time, allowing them to be more productive with few errors in their work places
    and studies. To know if this application is really helpful or not for students
    and working professionals, a survey is conducted with the help of TAM model. To
    understand user’s acceptance of this application TAM questionnaire was used in
    this survey. TAM questionnaire includes 5 essential points which tell us how the
    user feels about the proposed system, if it is useful for them or not, if it is
    beneficial for them in their daily lives or not, what do they think about the
    proposed system. In the above typing experiment and survey, we concluded that
    the participants liked the proposed system and would like to continue using it
    to enhance their speed with great accuracy. According to the results most participants
    think this system is useful, beneficial, easy-to-use and easy-to-understand, so
    they would like to use it in future for themselves to improve their skills.'
