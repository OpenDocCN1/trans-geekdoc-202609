    ABSTRACT: Business organizations and the research community try to precisely detect
    occurrences and assist in the case of a disaster. Most development systems are
    hardware-based, making them pricy and unavailable in every vehicle. A vehicle’s
    sensors can be destroyed in various ways, including minor accidents or fixed interactions.
    In instances, the sensors are incapable of detecting an accident. Intelligent
    phone sensors are a great alternative because of their dependability and availability.
    The study involves creating a smartphone application that continually reads sensor
    data and sends it to the cloud. The crash is discovered by threshold analysis.
    The critical novelty of this research is creating a scheme that alerts nearby
    hospitals and ambulances when an accident occurs. The system will have more minor
    inaccuracies, precisely identify accidents, and perform better than earlier techniques
    using four sensory inputs. This paper introduced novel types of deep learning
    for accident detection.


    # 1 INTRODUCTION


    Cities are becoming increasingly congested with tourists, residents, and cars.
    Increased vehicle use has increased traffic. According to the last WHO estimate,
    1.35 million people die yearly in traffic accidents, and 50 million are wounded
    (Khan et al. 2018). Road crashes are now the ninth leading cause of death. However,
    the International Road Safety Association (ASIRT) predicts that, unless substantial
    improvements occur, they will soon increase to the fifth leading cause of death.
    Furthermore, the societal costs of road accidents are significant. The International
    Road Safety Association expects that road accidents will consume one to two percent
    of each country’s yearly budget. Even in sophisticated nations with road safety
    measures, the global yearly number of driving deaths has recently climbed. However,
    the issue remains that low- and middle-income nations have the most incredible
    pressure on tolls and road injuries (Arora et al. 2022). There are several meanings
    of IoT. For example,'
