    # 2.1 Reweighting


    The loss function computation is versatile and easy, allowing it to better respond
    to the changing trend of picture characteristics in various data sets. As a result,
    reweighting is one of the most often used solutions to the long-tail issue in
    most research and experiments (Soni et al. 2022; Soni and Kumar 2020; Bharti et
    al. 2021). The entire loss function’s balance of the head classification loss
    function may be decreased so that the network can classify the tail during the
    training phase, avoiding the overfitting issue of head categories caused by the
    neural network’s long-tailed distribution while learning the dataset (Ajaz et
    al. 2022).


    # 2.2 ResNext network


    ResNext (Mehbodiya et al. 2021) is a particular residual network which belongs
    to the combination of ResNet network (Rida et al. 2020) and the Inception network
    (Ayvaz et al. 2022) etwork block structure is composed of the simplified Inception
    structure block plus the skip layer shortcut in ResNet (short-cut), which can
    reduce the hyper parameters of the neural network while ensuring the network’s
    performance. The web design breaks away from the fixed mindset of improving network
    performance by deepening and widening the network layers, increasing the number
    of paths with the same topology, and utilizing the split-transform-merge strategy
    for group convolution in a simple and scalable way.


    # 3 PROPOSED METHODS


    To adapt to the disease detection task of multi-class chest X-ray images, this
    paper uses ResNext50 as the feature extraction network, uses the re-weighting
    method to improve the cross-entropy loss function, and uses the CLAHE algorithm
    for image preprocessing.


    # 3.1 Improvement of loss function by reweighting method


    This study recommends adding reweighting to improve the original loss function
    to alleviate the overfitting issue caused by the data’s long-tailed distribution
    (Laila et al. 2022). The two weights are calculated using two distinct weight
    calculation algorithms, then linearly blended, and the resultant weight value
    is used to weigh the loss function. The following is the general formula for reweighting
    the cross-entropy loss function:


    ```

    N_{ce} = weight \left( -In \frac{\exp(A_j)}{\sum_{i=1}^O \exp(A_i)} \right) \qquad
    (1)

    ```


    Assume the neural network’s input is the sample x, where O is the length of the
    vector generated by the web’s final layer, i.e., the number of categories in the
    sample, A j and I are the jth and i values of the output vector, and weight is
    the loss function. As a result, based on the re-weighting concept, this study
    provides the first weight-setting technique as follows:


    ```

    b_i = In \frac{\sum_{j=1}^O OA_i}{O_j} \qquad (2)

    ```


    Ni is the number of samples in the dataset from the i-th class, ai is the weight
