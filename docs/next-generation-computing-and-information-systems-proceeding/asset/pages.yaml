    affects 7% of the global population (450 million people) annually, causing four
    million deaths. It is an acute lower respiratory disease often caused by microorganisms,
    bacteria, or viruses (Nazir et al. 2022). The World Health Organization (WHO)
    identifies pneumonia as the leading cause of child mortality, responsible for
    approximately 1.2 million deaths in children under five years of age. Pneumonia
    is one of the deadliest infections that can strike children under the age of five.
    India was the only country to record 158,176 deaths in 2016, and the country continues
    to lead the world in infant pneumonia deaths (Kumar et al. 2018). Worldwide, this
    communicable disease kills people, according to a WHO assessment released. Nowadays,
    radiography is the most reliable tool that clinicians acknowledge for detecting
    pneumonia (Pingale and Patil 2017). Nonetheless, some research indicates that
    variations frequently occur when radiologists interpret chest CT scans. The'
