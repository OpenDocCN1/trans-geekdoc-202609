  md: '# Supervised context-aware Latent Dirichlet allocation-based drug recommendation
    model


    Gopaldas H. Waghmare

    Mechanical Engineering Department YCCE Nagpur, Maharashtra, India


    Bhargavi Posinasetty

    Masters in Public Health, The University of Southern Mississippi, Hattiesburg,
    MS, USA


