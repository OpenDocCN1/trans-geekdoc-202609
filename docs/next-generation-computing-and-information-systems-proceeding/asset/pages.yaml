  md: '# 2.3 Topic model


    A topic model is a statistical model for clustering implicit semantic structure
    in the corpus, which is widely used in semantic analysis and text mining in natural
    language processing. Latent Dirichlet allocation (LDA) is the most common topic
    model, which assumes that the document selects a potential topic with a certain
    probability and then selects a word from the topic with a certain chance to generate
    the entire corpus (Bose and Sohi 2006; Kluckner et al. 2013; Yu 2021). LDA can
    be extended in various ways by introducing external label information.


    The essence of the topic obtained by the LDA model is to learn the co-occurrence
    relationship between words implicitly. When counting short texts, such methods
    often do not work well because the words in the short texts do not co-occur frequently
    enough. Some works have studied this problem.


    # 2.4 Data preprocessing


    First, the problem is described by simulating a doctor''s diagnosing of a patient
    in reality. In the actual process of diagnosis and treatment, doctors often record
    the patient''s chief complaint in the patient''s medical text, as well as the
    doctor''s physical examination of the patient (Jawarneh et al. 2023). The basis
    of segmentation includes the following:


    +   1) Common sense of life, such as gender is divided into male and female, the
    season is divided into spring, summer, autumn and winter;


    +   2) Data characteristics, such as the types of anesthesia are divided into
    general anesthesia, local anesthesia and no anesthesia;


    +   3) External knowledge, such as age segmentation according to standard age
    segmentation methods, insurance status segmentation according to insurance amount
    and conditions;


    +   4) For temperature difference, temperature and other situations without reference
    knowledge, based on the common sense of life and data distribution, the data distribution
    in different segments is relatively uniform, and the segmentation method is close
    to people''s cognition of life.


    # 2.5 Formal description


    In this sub-section, we formally describe the problem studied in this paper as
    follows: In the context-aware drug recommendation task, the training set contains
    the disease document V<sub>i</sub> = {v<sub>i,1</sub>, v<sub>i,2</sub>, v<sub>i,p</sub>},
    where v<sub>i</sub> are the words obtained from the segmentation of the medical
    text or a single abnormal item. Correspondingly, we have context documents U<sub>i</sub>
    = {u<sub>i,1</sub>, u<sub>i,2</sub>,...,u<sub>i,q</sub>}, where U<sub>i</sub>,
    is a single context word. In addition, we have a set of medicines E<sub>i</sub>
    = {e<sub>i,1</sub>,e<sub>i,2</sub>,...,e<sub>i,s</sub>}, where e<sub>i</sub>,
    is one of all the medicines prescribed by the doctor for the patient (Ahmed et
    al. 2022; Iqbal et al. 2022; Khan et al. 2020).


    # 3 CONTEXT-AWARE DRUG RECOMMENDATION METHOD


    # 3.1 Model overview


    The general steps of the model proposed in this paper are:


    +   1) The model needs to process the context information. Although the value
    of context information has been segmented in the data preprocessing part, if it
    is assumed that there are K kinds of context information, and each context has
    N value segments, there will be NK combinations, resulting in the model (Rida
    et al. 2015).


    +   2) This paper uses a probabilistic framework to jointly model context information,
    disease documents, and patient medicines. The idea of modeling comes from the
    diagnosis and treatment process in actual medical places; that is, the doctor
    first determines the disease that the patient may suffer from according to the
    patient''s symptoms, physical'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'examination, and laboratory reports, and then gives the appropriate medicine
    for the disease according to the patient’s corresponding situational information.


    # 3.2 Contextual information modeling methods


    To solve the problem of the explosion of patient contextual information combination,
    it is necessary to try to reduce the dimensionality of the contextual information
    (Rida et al. 2018). Clustering is a standard method to solve such problems, which
    can be roughly divided into two types: hard clustering and soft clustering. Among
    them, the hard clustering classifies the data exactly. Finally, after several
    iterations converge, each dish is assigned a fixed context topic, so the topic
    distribution of each context document can be calculated using Equation (1).


    ```

    Q(a|e) = \frac{n_{e,a} + \alpha}{\sum_{i=1}^k n_{e,a_i} + L\alpha} \quad (1)

    ```


    Where e and a represents the number of words in the context document d assigned
    to the topic a, α is the Dirichlet prior parameter, and L is the number of context
    topics.


    # 3.3 Context-aware drug recommendation method


    After the soft clustering of the context information is completed, the comprehensive
    modeling of all the data can be carried out. The modeling method proposed in this
    paper is based on two assumptions about the diagnosis and treatment process:


    +   1) Context topics are soft clustering of context information, and each context
    topic may affect the suitable medicines and the prone diseases of patients.

    +   2) The data of each patient corresponds to a latent variable, which represents
    the disease of the patient, called the disease theme.


    Figure 1 shows the probability map representation of the model, and the symbol
    descriptions.


    ![](img/9eefc6d2972274efeb1680c6a31895e5_38_0.png)


    Figure 1. Probability graph representation of the MLDA model.


    # 3.4 Sampling and inference algorithms


    MLDA needs to infer the hidden variables z, c, and y. However, since the exact
    inference algorithm is unsolvable, this paper uses the collapsed Gibbs sampling
    (CGS) to sample the'
  merge: -1
  img_proc: true
