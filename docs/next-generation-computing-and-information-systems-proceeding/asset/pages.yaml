    # ## 3 GUIDELINES FOR HUMAN-COMPUTER INTERACTION BASED ON COGNITIVE MODELS


    # ### 3.1 Human-computer interaction guidelines for surgical navigation systems


    This article uses Microsoft HoloLens as the AR display device. Microsoft HoloLens
    can not only complete the superposition of virtual and real scenes based on optical
    perspective but also perform voice and gesture interaction (Lokhande et al. 2021).
    Therefore, the human-computer interaction rules of the AR surgical navigation
    system mainly include:


    +   1) Consistency of virtual and real registration: virtual objects and natural
    scenes should be effectively integrated to minimize the distortion of virtual
    objects, tracking errors and parameter errors of user perspective.

    +   2) User''s sense of security: The biggest problem of the surgical navigation
    system based on VST-HMD is that the doctor cannot look directly at the actual
    scene with glasses, so there is a certain sense of fear.

    +   3) Effectiveness of information: Information should be classified and managed
    to avoid redundant information distracting users'' energy.


    # ## 4 USABILITY EVALUATION OF HUMAN-COMPUTER INTERACTION


    # ### 4.1 Usability evaluation index based on AHP


