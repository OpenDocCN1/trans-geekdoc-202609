  md: '# A novel approach to glass identification using ensemble learning for forensics


    Priyansh Sanghavi, Mahir Mehta, Tarang Ghetia & Yogesh Kumar

    School of Technology, Pandit Deendayal Energy University Gandhinagar, Gujarat,
    India


    ABSTRACT: Criminal cases, including burglaries, robberies, hit-and-runs, murders,
    assaults, ram raids, criminal damage, and car thefts, may all employ glass as
    evidence. When anything made of glass is broken, the shards are likelier to go
    in the direction of whoever or whatever caused the break. In order to conduct
    effective criminological investigations, it is important to get information from
    databases containing criminal evidence. The paper gives a detailed study of glass
    identification based on the KNN algorithm. The identification method is based
    on the examination of many feature columns such as Refractive Index (R. I.), Sodium
    (Na), Magnesium (Mg), Potassium (K), and other substances that serve as essential
    forensic evidence. An ensemble strategy comprising several machine learning models
    was used to improve the accuracy and reliability of glass detection. In addition
    to KNN, SVM, Logistic Regression, Naive Bayes, and Random Forest classifiers have
    been integrated into the ensemble framework. The ensemble methodology leverages
    soft voting to combine the predictions of these diverse models, thereby achieving
    a more robust and effective glass identification system. The proposed ensemble
    technique demonstrates superior performance compared to individual models through
    extensive experimentation and validation, resulting in enhanced accuracy, precision,
    and recall. Such advances in glass identification hold significant promise for
    digital forensics, allowing forensic experts to make more informed determinations
    in criminal investigations.


    # 1 INTRODUCTION


    Criminological research served as a foundation for studying the glass classification
    problem. If the glass left at the crime scene is properly recognized, it can be
    used as evidence. It is typical practice in casework to compare glass pieces found
    at the site of a crime with glass pieces linked to a suspect(Mehta et al. 2022).
    These shards of glass might sometimes be imperceptibly small. These minute glass
    pieces must be recognized and examined in case they are relevant to a forensic
    investigation (Colomban 2013a).


    The oxide concentrations for various elements have been provided via the quantitative
    examination of glass. However, only the oxides of calcium, silicon, aluminum,
    magnesium, sodium, and potassium typically exist at concentrations high enough
    to be measured (Hickman 1981). Therefore, the elements in our dataset, such as
    sodium (Na), magnesium (Mg), aluminum (Al), calcium (Ca), barium (Ba) etc. are
    what we have taken into consideration for the feature column in this paper. Furthermore,
    a key component in differentiating between various types of glass and their uses
    is the Refractive Index (RI). This dataset includes glasses divided into seven
    distinct categories depending on their function. Tableware, pendant lighting,
    window glass (both float and non-float), top lights, and vehicles (both float
    and non-float) (Mathur and Surana 2020).'
