    # D. Model Training And Evaluation


    During the model training process, we randomly sample the data in the training
    set and select 20 frames of image data. We input 20 frames of image data into
    the network of the VGGnet16 model for high-dimensional feature extraction, and
    extract the high-dimensional features into the subsequential connected model to
    obtain the regression values of the predicted vehicle speed and steering angle.
    We test the degree of network overfitting and the number of epochs in validation
    ([15])


    After obtaining the matrix $x_{in}$, we use $x_{in}$ as the input of the 5-layer
    fully connected layer (100, 50, 10, and 1) and obtain the reciprocal of the turning
    radius. The vehicle velocity prediction model constructed in the previous content
    contains 5 fully connected layers. We combine the fully connected network with
    a parameter of 50 in the turning radius prediction model and the the vehicle network.
    Layers are sliced. The matrix $x_{in}$ we just obtained is used as the input of
    the last two layers of the vehicle network model. Turning radius prediction is
    taken into account in the vehicle velocity prediction model in the following content.
    We will compare its prediction effect with the vehicle velocity model that does
    not consider the turning radius.


    The description of the data is shown in Table I above. In this paper we use a
    piece of NIDA-RTX-2080SUPER to train different models separately. The inputs of
    the end-to-end control model designed in this paper are the historical images
    of M and the predicted time. In this paper, based on experience, we set M to 10.
    During training and evaluation, the number of batch size is 32 and the number
    of epochs is as 100.


    The hyperparameters in the end-to-end control model are shown in Table II. Among
    them, LSTM v and the hyperparameters of the neural network layer are the hyperparameters
    of the control part, and LSTM v and u are the hyperparameters of the neural network
