    # E. The Effect Of Attention Strategy On The Model


    Different from reinforcement learning to determine the attention strategy, the
    end-to-end control model proposed in this paper uses backpropagation to determine
    attention, which can reduce the computational complexity of the model and effective
    computation. As can be seen in Table IV, compared with the end-to-end control
    model without the attention strategy, the end-to-control model with the attention
    strategy has smaller errors, which shows that the attention strategy improves
    the prediction accuracy.


