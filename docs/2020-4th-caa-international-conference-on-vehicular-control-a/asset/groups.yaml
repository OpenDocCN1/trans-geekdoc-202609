    ![](img/c004ed9e157fc8dc505501d7fbb7322a_3_0.png)


    图 4. CNN 模型层级输出


    ## D. 模型训练与评估


    在模型训练过程中，我们从训练集中随机采样数据并选择了 20 帧图像数据。我们将这 20 帧图像数据输入到 VGGnet16 模型中进行高维特征提取，并将高维特征提取到后续的连接模型中，以获得预测车速和转向角的回归值。我们在验证集中测试了网络的过拟合程度和训练轮数（epochs）[15]。


    在获取矩阵 $x_{in}$ 后，我们使用 $x_{in}$ 作为 5 层全连接层（100, 50, 10 和 1）的输入，并获得转弯半径的倒数。前文中构建的车辆速度预测模型包含
    5 个全连接层。我们将转弯半径预测模型和车辆网络中参数为 50 的全连接网络相结合。对层进行切片。我们刚刚获得的矩阵 $x_{in}$ 被用车辆网络模型最后两层的输入。下文的车辆速度预测模型中考虑了转弯半径。我们将其预测效果与不考虑转弯半径的车辆速度模型进行比较。


    数据的描述如上表表所示。在本文中，我们使用了一块 NIDA-RTX-2080SUPER 分别训练不同的模型。本文设计的端到端控制模型的输入是 M 的历史图像和预测时间。在本文中，根据经验，我们将
    M 设置为 10。在训练和评估过程中，批次大小（batch size）为 32，训练轮数（epochs）为 100。


    端到端控制模型中的超参数如表 II所示。其中，LSTM v 和神经网络层的超参数是控制部分的超参数，而 LSTM v 和 u 是控制部分使用的神经网络层超参数。


    表 II. 模型超参数设置。


    | 层 | 超参数 |

    |---|---|

    | LSTM v | Units=32 |

    | LSTM u | Units-32 |

    | FCN_v | Units -(118,100,50,1) |

    | FCN_u | Units -(100550,50,1) |


    ## B. 评价指标


    本文中，使用平均绝对误差（MAE）作为预测模型的评价指标。计算 MAE 的公式为：


    > $MAE = \frac{1}{n} \sum_{i=1}^{n} |p_i - \hat{p}_i|$$ (11)


    在公式 (11) 中，$n$ 是样本量，$\hat{p}_i$ 是车速和转向角的预测值，$p_i$ 是车速预测的实际值。


    ## C. VGONet 可视化


    端到端控制模型被广泛称为“黑箱”。人们只能看到输入输出，很难理解模型内部某些步骤是如何呈现的。为了更好地理解本文提出的模型的工作原理，我们通过可视化卷积神经网络的中间输出以及卷积网络的滤波器来对模型进行解释。


    ## IV. 实验结果与分析


    本文中的所有实验均基于 Tensorflow 后端的神经网络 API (Keras) 来构建模型。Comma 数据集包含了白天和夜晚的不同驾驶数据。


    表 I. 数据集


    | 类别 | Comma.ai |

    |---|---|

    | 帧数 (#frame) | 522434 |

    | 帧率 (FPS) | 20Hz |

    | 小时 (Hours) | 7hrs |

    | 位置 (Location) | 美国加利福尼亚 |

    | 时间 (Time) | 白天/夜晚 |


    通过更直观地观察 CNN 的输入，层级的变化如图 4 所示。从上到下是 VGGNet 卷积网络缺乏注意力策略和池化的输出。可以看到，随着层数的增加，图像变得更加……


    ## E. 注意力策略对模型的影响


    通过更直观地观察 CNN 的输入，层级的变化如图 4 所示。从上到下是 VGGNet 卷积网络缺乏注意力策略和池化的输出。可以看到，随着层数的增加，图像变得更加……


    在下文的车辆速度预测模型中考虑了转弯半径。我们将其预测效果与不考虑转弯半径的车辆速度模型进行比较。


    ## V. 结论


    端到端控制模型被广泛称为“黑箱”。人们只能看到输入输出，很难理解模型内部某些步骤是如何呈现的。为了更好地理解本文提出的模型的工作原理，我们通过可视化卷积神经网络的中间输出以及卷积网络的滤波器来对模型进行解释。


    ## D. 预测模型与端到端控制的比较


    与端到端控制模型的车辆速度预测。如表 III 所示，端到端控制模型的 MAE 为


    | 模型 | MAE |

    |---|---|

    | 带注意力机制 | 0.481 |

    | 不带注意力机制 | 0.633 |


    端到端控制模型的实验结果显示：

    - 通过可视化，端到端控制，

    - 随着层数的增加，端到端控制可以。

    - 端到端控制模型的 MAE 显著低于车辆预测。


