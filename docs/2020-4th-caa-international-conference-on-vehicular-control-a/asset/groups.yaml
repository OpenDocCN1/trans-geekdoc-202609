    and steering wheel angle are predicted by recurrent neural networks (RNNs). The
    end-to-end control is trained with the function of mean absolute error (MAE).
    The results show that with other models, the end-to-end control based on visual
    attention can achieve better control effects of vehicle''s speed and steering.


    **Keywords—** Intelligence, vehicle control


    # I. INTRODUCTION


    Self-driving cars have always been one of human dreams. General development of
    artificial intelligence, virtual computing, robot, monitoring devices, and goal-oriented
    systems to work allow computers to autonomously and operate motor vehicles without
    any human intervention. Perception technology has been widely used in autonomous
    driving research, and recently it has been applied to end-to-end control in complex
    scenarios. Artificial neural networks (ANN) [1] is a research method in the field
    of intelligence since the 1980s. In recent years, the work of artificial neural
    networks has grown in many fields. Deep learning algorithms have strong approximation
    capabilities for nonlinear linear functions, which enable them to be continuously
    processing and image recognition. Mariusz Bojarski proposed a strategy that uses
    human drivers to collect driving data to train an end-to-end autonomous vehicle
    [2].


    Compared with the complex steps of the hierarchical unmanned vehicle control architecture,
    the end-to-end method based on deep learning optimize complex steps such as environment
    perception, trajectory planning, and vehicle control can effectively reduce the
    complexity of controller development. The results obtained that even in some conditions
    without visual guide, such as parking lots, the controller also showed a good
    effect [3].


    Krizhevsky extended the deep convolutional network to get better classification
    results in the ImageNet-large visual recognition competition, which attracted
    the attention of convolutional neural networks [4]. Although a good effect can
    be achieved by using convolutional networks, we do not know which of the picture
    has an impact on the control effect. In this paper, we introduce a method of visual
    attention mechanism. This method allows the neural network to process some important
    areas in the picture [5]. Just like a human driver cannot only look to the sky
    to drive, but must focus on the road. Using the end-to-end control method proposed
    in this paper, the features extracted by the convolutional networks can be weighted
    with the method of visual attention, and the end-to-end control of vehicle can
    be achieved through two independent of LSTM.


    # II. VELOCITY PREDICTION MODEL


    ## A. Dataset selection


    The experimental data in this paper are all collected from Community dataset.
    We split the data into training, validation set, test set and ensure that the
    three are completely independent.


    ![](img/c004ed9e157fc8dc505501d7fbb7322a_1_0.png)


    In order to ensure that the model can mine the information in the data set effectively,
    all the original picture pixels in the Commai dataset are first compressed to
    (160, 50, 3), and the picture matrix is processed according to (1). We use (1)
    to normalize the original image data, where img is the picture matrix.


    ```

    $$img = img / 255.0$$

    ```


    The model designed in this paper is to ensure the better application of this model
    to all vehicles, so we choose to predict the reciprocal of the turning radius
    $r_i$ instead of directly predicting the steering wheel $\theta_i$ of the vehicle.
    The relationship between the reciprocal of the turning radius and the steering
    wheel is shown in the following Ackermann steering geometry:


    ```

    $$$\theta_i = u_d K_i (1 - K_i v_i^2)$$$

    ```


    In (2), $v_i$ is the velocity of the vehicle, $K_i$ is the steering ratio, $u_d$
    is the slip rate, and $v_i$ is the vehicle speed (meters per second).


    The vehicle used to collect data in this paper is LX2016, and the reciprocal of
    turning radius $u_i$ of the vehicle and the speed $v_i$ are normalized.


    ```

    $$u_i = \frac{u_i - u_{min}}{u_{max} - u_{min}}$$

    ```


    ```

    $$v_i = \frac{v_i - v_{min}}{v_{max} - v_{min}}$$

    ```


    In (4), $u_i$ and $v_i$ are inverse turning radius and vehicle speed, respectively.
    $u_{max}, u_{min}, v_{max},$ and $v_{min}$ are the reciprocal of turning radius,
    maximum speed and minimum speed, respectively.


    ## B. VGGNet


    The deep convolutional structure of VGGNet effectively improve accuracy of image
    recognition [6]. VGG16 structure used in this paper is shown in Fig.1. VGG16 includes
    13 convolutional layers, 5 pooling layers, and a classifier. VGG16 fully increase
    depth by using pooling layer with each to improve accuracy. We use the output
    of the last convolutional layer in trained VGGNet as high-dimensional feature
    matrix.


    The vehicle speed prediction model proposed in this paper uses trained VGGNet
    model (from keras) for high-dimensional feature extraction, and flatten the obtained
    (50, 512)-dimensional feature matrix into dimension of (50, 512). After that,
    we obtained the predicted value of vehicle speed through additional 5 fully connected
    layers


    ![](img/c004ed9e157fc8dc505501d7fbb7322a_1_1.png)


    (of neurons are 164, 100, 50). In subsequent chapters, we will describe experimental
    results in detail.


    # III. END-TO-END CONTROL MODEL


    In autonomous driving tasks, with traditional control methods (such as lane detection,
    path planning and control, etc.), the end-to-end control method with sequential
    decomposition is shown in Figure 1. The model proposed in this paper features
    high-dimensional feature matrix extracted from continuous data, is used to predict
    vehicle speed and direction. LSTM control with memory storage is convenient to
    find and establish long-term relationship between input values, and for processing
    tasks [9], the application of end-to-end control methods are mostly trained using
    existing datasets. Autonomous vehicles are equipped with cameras, radar and lidar
    to collect data on the road. In addition to sensor data, data also includes steering
    angle and acceleration. Jinkai and Kim have proposed a method to control self-driving
    cars by visualizing the convolutional network [11]. This method uses continuous
    frames to achieve real-time control of the steering angle of the vehicle. The
    end-to-end control model proposed in this paper is


    ![](img/c004ed9e157fc8dc505501d7fbb7322a_2_0.png)


    Fig. 3 LSTM structure


    $f_t = \sigma(W_f[h_{t-1}, x_t] + b_f)$


    In (5), $\sigma$ is the activation function, $h_t$ is the hidden state at time
    $t$, and $x_t$ is the feature matrix extracted at time $t$; $W_f$ and $b_f$ are
    the weight matrices and bias of the forget gate. The input gate first processes
    the hidden state $h_{t-1}$ at time $t-1$ and the feature matrix $x_t$ at time
    $t$ through two sets and then through activation functions to obtain $i_t$ and
    $\tilde{C}_t$, respectively. The specific equations of this process are follows:


    $i_t = \sigma(W_i[h_{t-1}, x_t] + b_i)$


    $\tilde{C}_t = \tanh(W_c[h_{t-1}, x_t] + b_c)$


    $C_t = f_t \odot C_{t-1} + i_t \odot \tilde{C}_t$


    In the cell state process, the cell state $C_t$ is multiplied by the product of
    $f_t$ and $\tilde{C}_t$ by the input gate to update the cell state $x_t$. The
    updated cell state is $C_t$. In the output gate, the updated cell state is processed
    by the activation function tanh and obtain the output $h_t$. The specific equations
    are as follows:


    $o_t = \sigma(W_o[h_{t-1}, x_t] + b_o)$


    $h_t = o_t \odot \tanh(C_t)$


    ### A. Feature extraction


    We first used VGGNet to extract feature information from the original image of
    the model, and obtain high-dimensional feature matrix. The high-dimensional features
    of the original image are selectively input into the fully connected network through
    attention strategies in the subsequent steps to predict the steering angle of
    the vehicle. The high-dimensional information generated by the convolutional network
    can effectively reduce the computational burden of the system, improving the real-time
    performance of the system.


    ### B. LSTM


    Recurrent network is a special kind of connected network in deep learning, which
    can learn vector-to-vector mapping [12]. All RNN models have a different structure
    of recurrent network, and each network uses backpropagation through time (BPTT)
    method to propagate the error. Compared with RNN, LSTM adds cell state and gate
    structures (forget, input, and output gate). LSTM structure is shown in Fig.3.


    The function of the forget gate in the LSTM model is to make the LSTM control
    to forget the hidden state of the previous layer with a certain probability.


    ### C. Attention Strategy


    With the VGGNet model, we can get a feature matrix $x_t$ of size $W \times H \times
    D$ at time. First, the feature matrix $x_t$ is input into the LSTM network. Secondly,
    we combine the output of the LSTM with the feature matrix $x_t$ to obtain the
    matrix $x_{st}$. According to this method, it is calculated, and then we transform
    $x_{st}$ into a vector such as $(L \times W, D)$, and calculate the attention
    probability $\alpha_i$ of each vector in $L$, where $i_{max}=L, \sum\alpha_i=1$.
    The attention strategy $\pi$ proposed in this paper will multiply $attn_t$ and
    the feature matrix $x_t$ to obtain a matrix $x_{sp}$, which will then be used
    in the prediction of the reciprocal of the turning radius.

