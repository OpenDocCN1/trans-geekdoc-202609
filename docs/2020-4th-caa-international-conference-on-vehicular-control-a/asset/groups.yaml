    何静娟

    通信工程学院

    吉林大学

    中国，长春

    1475548941@jlu.com


    **摘要—** 我们提出了一种基于视觉注意力的自动驾驶车辆端到端控制方法。利用注意力策略引导卷积神经网络（CNN）的高维特征，然后通过循环神经网络（RNN）预测车辆的速度和方向盘角度。端到端控制使用平均绝对误差（MAE）函数进行训练。结果表明，与其他模型相比，基于视觉注意力的端到端控制可以实现更好的车辆速度和转向控制效果。


    **关键词—** 智能，车辆控制


    # I. 引言


    自动驾驶汽车一直是人类的梦想之一。人工智能、虚拟计算、机器人、监控设备和目标导向系统的通用发展，允许计算机在没有任何人为干预的情况下自主地操作机动车辆。感知技术已广泛应用于自动驾驶研究，最近它被应用于复杂场景下的端到端控制。人工神经网络（ANN）[1]
    是自20世纪80年代以来智能领域的一种研究方法。近年来，人工神经网络在许多领域不断发展。深度学习算法对非线性函数具有很强的近似能力，使其能够进行连续处理和图像识别。Mariusz
    Bojarski 提出了一种策略，利用人类驾驶员收集驾驶数据来训练端到端自动驾驶车辆[2]。


    与分层无人驾驶车辆控制架构的复杂步骤相比，基于深度学习的端到端方法通过优化环境感知、轨迹规划和车辆控制等复杂步骤，可以有效降低控制器开发的复杂性。所得结果表明，即使在某些没有视觉引导的条件下（如停车场），该控制器也表现出良好的效果[3]。


    Krizhevsky 扩展了深层卷积网络，在 ImageNet-large 视觉识别竞赛中获得了更好的分类结果，这引起了卷积神经网络的关注[4]。虽然使用卷积网络可以良好的效果，但我们不知道图片中的哪些部分对控制效果有影响。在本文，我们引入了视觉注意力机制方法。该方法允许神经网络处理图片中的某些重要区域[5]。就像人类驾驶员不能只看天空开车，而必须关注道路一样。使用本文提出的端到端控制方法，卷积网络提取的特征可以通过视觉注意力方法进行加权，并通过两个独立的
    LSTM 实现车辆的端到端控制。


    # II. 速度预测模型


    ## A. 数据集选择


    本文的实验数据均采集自 Cityscapes 数据集。我们将数据分为训练集、验证集和测试集，并确保这三者完全独立。


    ![](img/c004ed9e157fc8dc505501d7fbb7322a_1_0.png)


    为了确保模型能够有效挖掘数据集中的信息，Cityscapes 数据集中所有原始图片像素首先压缩为 (160, 50, 3)，并根据公式(1)对图像矩阵进行处理。我们使用(1)对原始图像数据进行归一化，其中
    img 为图像矩阵。


    ```

    $$img = img / 255.0$$

    ```


    本文设计的模型是为了确保该模型在所有车辆上的良好应用，因此我们选择预测转弯半径的倒数 $r_i$，而不是直接预测车辆的方向盘角度 $\theta_i$。转弯半径倒数与方向盘之间的关系如下
    Ackermann 转向几何所示：


    ```

    $$$\theta_i = u_d K_i (1 - K_i v_i^2)$$$

    ```


    在公式(2)中，$v_i$ 是车辆的速度，$K_i$ 是转向比，$u_d$ 是滑率，$v_i$ 是车速（米/秒）。


    本文用于采集数据的车辆是 LX2016，车辆的转弯半径倒数 $u_i$ 和速度 $v_i$ 经过了归一化。


    ```

    $$u_i = \frac{u_i - u_{min}}{u_{max} - u_{min}}$$

    ```


    ```

    $$v_i = \frac{v_i - v_{min}}{v_{max} - v_{min}}$$

    ```


    在(4)中，$u_i$ 和 $v_i$ 是归一化后的值。


    B. 卷积网络特征


    虽然使用卷积网络可以获得良好的效果，但我们不知道图片中的哪些部分对控制效果有影响。在本文，我们引入了视觉注意力机制方法。该方法允许神经网络处理图片中的某些重要区域[5]。就像人类驾驶员不能只看天空开车，而必须关注道路一样。使用本文提出的端到端控制方法，卷积网络提取的特征可以通过视觉注意力方法进行加权，并通过两个独立的
    LSTM 实现车辆的端到端控制。


