    useless, and enlarges and refines the information useful to the model.


    # E. The Effect Of Attention Strategy On The Model


    Different from reinforcement learning to determine the attention strategy, the
    end-to-end control model proposed in this paper uses backpropagation to determine
    attention, which can reduce the computational complexity of the model and effective
    computation. As can be seen in Table IV, compared with the end-to-end control
    model without the attention strategy, the end-to-control model with the attention
    strategy has smaller errors, which shows that the attention strategy improves
    the prediction accuracy.


    ![](img/c004ed9e157fc8dc505501d7fbb7322a_4_0.png)


    THE EFFECT OF ATTENTION STRATEGY


    | Model | MAE (uₜ) | MAE (nₜ) |

    |---|---||}{

    | With attention | 0.0481 | 0.0250 |

    | Without attention | 0.0463 | 0.0331 |


    # V. CONCLUSION


    The experimental results of the end-to-end control model for autonomous vehicles
    based on deep driving in this paper show that:


    +   - Through the visualization method, the convolutional neural network in the
    end-to-end model can be explained,

    - In the vehicle speed prediction, the end-to-end control model can achieve better
    results than the vehicle speed prediction,

    - The attention strategy can effectively improve the prediction accuracy of the
    end-to-end control model.

    The MAE of the end-to-end control model with the attention strategy is smaller
    than the other models, which proves the effectiveness of our method.


    As the number of layers increases, the filters of the convolutional network become
    more complex and refined. As shown in Fig.5, every row from top to bottom shows
    the filters of the first convolutional layer through the maximum pooling layer.
    In this, only 8 filters of each convolutional layer are shown. Each layer of the
    convolutional network sets a set of filters, and combines them as input. With
    the depth of the convolution layer, the filter becomes more and complex and detailed,
    and the deeper filter will present a texture similar to features.


    # D. Comparison Of Prediction Model And End-to-end Control Model


    Compared with the end-to-end control model, the vehicle velocity prediction outperforms
    the LSTM network. As shown in Table III, the MAE of the end-to-end control model
    is smaller than the speed prediction model. When the vehicle speed control is
    needed, the training error of the end-to-end control model is significantly lower
    than that of the vehicle velocity control model.


    | Model | MAE |

    |---||}{

    | Velocity prediction | 0.089 |

    | End-to-end control | 0.025 |


