    **Abstract—** We propose an end-to-end control for self-driving vehicles based
    on visual attention. Attention strategy is used to guide the high-dimensional
    features of convolutional neural networks (CNNs), and then the vehicle''s velocity
    and steering wheel angle are predicted by recurrent neural networks (RNNs). The
    end-to-end control is trained with the function of mean absolute error (MAE).
    The results show that with other models, the end-to-end control based on visual
    attention can achieve better control effects of vehicle''s speed and steering.


    **Keywords—** Intelligence, vehicle control


    # I. INTRODUCTION


    Self-driving cars have always been one of human dreams. General development of
    artificial intelligence, virtual computing, robot, monitoring devices, and goal-oriented
    systems to work allow computers to autonomously and operate motor vehicles without
    any human intervention. Perception technology has been widely used in autonomous
    driving research, and recently it has been applied to end-to-end control in complex
    scenarios. Artificial neural networks (ANN) [1] is a research method in the field
    of intelligence since the 1980s. In recent years, the work of artificial neural
    networks has grown in many fields. Deep learning algorithms have strong approximation
    capabilities for nonlinear linear functions, which enable them to be continuously
    processing and image recognition. Mariusz Bojarski proposed a strategy that uses
    human drivers to collect driving data to train an end-to-end autonomous vehicle
    [2].


    Compared with the complex steps of the hierarchical unmanned vehicle control architecture,
    the end-to-end method based on deep learning optimize complex steps such as environment
    perception, trajectory planning, and vehicle control can effectively reduce the
    complexity of controller development. The results obtained that even in some conditions
    without visual guide, such as parking lots, the controller also showed a good
    effect [3].


    Krizhevsky extended the deep convolutional network to get better classification
    results in the ImageNet-large visual recognition competition, which attracted
    the attention of convolutional neural networks [4]. Although a good effect can
    be achieved by using convolutional networks, we do not know which of the picture
    has an impact on the control effect. In this paper, we introduce a method of visual
    attention mechanism. This method allows the neural network to process some important
    areas in the picture [5]. Just like a human driver cannot only look to the sky
    to drive, but must focus on the road. Using the end-to-end control method proposed
    in this paper, the features extracted by the convolutional networks can be weighted
    with the method of visual attention, and the end-to-end control of vehicle can
    be achieved through two independent of LSTM.


    # II. VELOCITY PREDICTION MODEL


    **A. Dataset selection*


    The experimental data in this paper are all collected from Community dataset.
    We split the data into training, validation set, test set and ensure that the
    three are completely independent.'
