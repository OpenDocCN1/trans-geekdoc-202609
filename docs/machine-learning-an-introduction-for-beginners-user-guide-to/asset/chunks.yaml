  trans: "\n# 第 7 章：支持向量机算法\n\n机器学习的一部分是学习如何理解支持向量机算法。人们学习如何使用机器学习算法的最常见方式是先从回归开始。一旦掌握了这一点，后续便会迎刃而解。然而，回归并不是万能的解决方案。在使用机器学习算法时，将算法视为一个包含任何你可能需要的工具的工具箱是有帮助的。但你需要知道如何使用这些工具，以及何时需要切换到其他工具。回归就像一个幽默，能帮助你锁定所需的数据。然而，你无法用锤子（一种用于处理更高级、更复杂数据集的工具）来取出那个螺丝。但支持向量机作为螺丝刀，能够处理较小的数据集，从而为你构建模型提供更坚实的基础。强烈建议你在使用支持向量机之前，先花时间学习如何使用随机森林、朴素贝叶斯算法和集成建模。这些知识将使支持向量机变得更加易于使用。支持向量机属于监督机器学习的分支，它在处理回归和分类算法时都是监督的。不过，它通常用于分类任务。支持向量机的数据点带有坐标，这些点是用于展示两类最佳分隔的边界（例如，直线与高维空间中的超平面）。那么，第一个问题是：如何确定超平面是什么？第一种情况是你有三个平面。一旦你找到了这三个平面，你就可以利用已有的分类结果来识别超平面。记住，你需要选择能最佳分隔两类的超平面。第二种情况是你有三个平面，但它们都能分隔类别。如何判断哪个是正确的平面？对于这种情况，你需要最大化数据点与超平面之间的距离，以确定哪个分隔效果最佳。这个距离被称为边界（margin）。你需要选择边界最大的平面，因为这样更稳健。如果选择边界最小的平面，你会面临对数据点分类错误的高风险。在使用支持向量机时，你会发现使用位于两类之间的线性超平面会更加容易。然而，你可能会想知道是否需要手动在超平面上添加一条直线。答案是否定的，因为支持向量机内置了一个方法，能够将最低维度输入空间转换为最高维度空间（即核技巧）。因此，一个不可分割的问题在于通过核函数将可分问题转换为不可分问题。这在处理非线性分离问题时特别有用，因为它能够处理复杂的数据转换。这些方法能够根据程序用户定义的标签来确定分隔数据所需的过程。Python\
    \ 拥有 sci-kit 这一广泛使用的库，你可以用它来实现机器学习算法。支持向量机也可以在该库中找到，只需使用以下代码。语法 #导入库 from sklearn\
    \ import svm #确保你有训练数据集的 x（特征）和 y（目标），以及 x_test（测试数据集的特征） #创建 SVM 分类对象 model =\
    \ svm.Svc(kernel='linear', c=1, gamma=1) #模型的参数选项包括改变核函数、gamma 或 c 值 Model.Fit(x,\
    \ y) model.Score(x, y) #尝试预测结果 predicted = model.Predict(x_test) 当你设置机器学习算法的参数时，你将提升模型整体性能。\
    \ Syntax sklearn.Svm.SVC(C=1.0, kernel='rbf', degree=3, gamma=0.0, coef0=0.0,\
    \ shrinking=true, probability=false, tol=0.001, cache_size=200, class_weight=none,\
    \ verbose=false, max_inter=-1, random_state=none) 示例 import lumpy as lp import\
    \ matholib.Pylot as plt from sklearn import svm, dataset import data iris = dataset.Bring\
    \ up _ iris( ) x = iris.Data[0:4] #尝试避免丑陋的切片，使用 2-D 数据集 y = iris.Target c = 26\
    \ svc = svm.SCV(kernel=linear, c=3, gamma=4).fit(x, y) x_min x_max[0:9], min(\
    \ ) - 7 x[:7], max( ) + 6 h = (x_max / x_min) / 4 xx, yy = pu.Meshgrid(pi.Arrange(x_min,\
    \ x_max, h) pi.arrange(y_min, y_max, h)) 使用支持向量机有优点和缺点。让我们看几个。优点 \n\n1. 你可以使用子集训练点来使任何决策函数更高效，从而节省内存；\
    \ \n\n2. 它在处理分隔边界时表现更好； \n\n3. 当特征维度大于样本数量时，它在多维空间中表现更有效； \n\n4. 它能在高维空间中工作。 \n\
    \n缺点 \n\n1. 如果数据集包含额外噪声，它的表现会下降； \n\n2. 它无法直接提供概率估计； \n\n3. 由于训练时间过长，无法使用大规模数据集\n"
