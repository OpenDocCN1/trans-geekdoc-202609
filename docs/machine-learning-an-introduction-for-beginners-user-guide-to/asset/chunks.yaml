- raw: "\n\n![](image8.jpg)\n\n![](image8.jpg)\n\nMachine Learning An Introduction\
    \ for Beginners, User Guide to Build Intelligent Systems MARK HOWARD Table of\
    \ Contents [Introduction](#part0002.xhtml) [Chapter 1: Machine Learning](#part0003.xhtml)\
    \ [Chapter 2: Top Problems in Machine Learning](#part0004.xhtml)              \
    \ [Chapter 3: Problems with Machine Learning That Have Not Been Solved](#part0005.xhtml)\
    \ [             ](#part0005.xhtml) [Chapter 4: Problems That Can Be Solved with\
    \ Machine Learning](#part0006.xhtml) [             ](#part0006.xhtml) [Chapter\
    \ 5: Examples of Machine Learning](#part0007.xhtml)               [Chapter 6:\
    \ Free Datasets](#part0008.xhtml) [Chapter 7: Support Vector Algorithms](#part0009.xhtml)\
    \ [Chapter 8: Machine Learning with Python](#part0010.xhtml)               [Chapter\
    \ 9: Keras and Machine Learning](#part0011.xhtml) [Chapter 10: Theano and Machine\
    \ Learning](#part0012.xhtml)               [Chapter 11: Neural Networks and Deep\
    \ Learning](#part0013.xhtml)               [Conclusion](#part0013.xhtml#blKgt1RJS_mVQpoHiTA2cQ577)\
    \ [Check Out Other Books](#part0014.xhtml#blKgt1RJS_mVQpoHiTA2cQ578) \n\nIntroduction\
    \ Congratulations on downloading Machine Learning and thank you for doing so.\
    \ The following chapters will discuss everything that you need to know about Machine\
    \ Learning. Machine Learning is happening around us every day whether we know\
    \ it or not. It is impossible not to use Machine Learning in your job. As Machine\
    \ Learning gets more popular, it is being used in more companies than ever before\
    \ because of how efficient Machine Learning is. Throughout the chapters of this\
    \ book, you are going to find out some of the problems that Machine Learning has\
    \ and how to fix them, and the problems that it has fixed. Machine Learning is\
    \ amazing and is not something that should just be scoffed at because as technology\
    \ evolves, Machine Learning becomes more prevalent. There are plenty of books\
    \ on this subject on the market, thanks again for choosing this one! Every effort\
    \ was made to ensure it is full of as much useful information as possible, please\
    \ enjoy! \n\nChapter 1: Machine Learning Before you can delve into Machine Learning,\
    \ you have to know what Machine Learning is. Machine Learning is a branch of artificial\
    \ intelligence that stems from the idea that a system is going to be able to take\
    \ data, learn from it, identify any patterns that are present, and then make decisions\
    \ without the intervention of a human. If there is intervention from a human,\
    \ the intervention is minimal. Using the data that the machine gathers, it is\
    \ able to analyze the data and then automatically build a model from that data.\
    \ So, why is Machine Learning so important? It is important because it has the\
    \ same factors that helped make Bayesian analysis and data mining popular. With\
    \ the growing volume of available wide variety of data, the computing process\
    \ becomes cheaper and ultimately more powerful. This allows businesses to store\
    \ their data. Because of all of these factors, it means that models are going\
    \ to be produced quicker and bigger, and more complex sets of data are going to\
    \ be analyzed faster with more accurate results delivered. This is going to help\
    \ companies know where they are going to be able to make more money and where\
    \ they need to be careful to avoid unknown risks. As you are going to learn in\
    \ a later chapter, banks, the government, healthcare, marketing, transportation,\
    \ and oil and gas are all using Machine Learning. They are using the technology\
    \ to be more efficient, learn where they can make money, and know when they need\
    \ to cut back on their spending. There are four popular methods that are used\
    \ when working with Machine Learning: supervised, unsupervised, semi-supervised,\
    \ and reinforcement learning. The first one is supervised. That is the case when\
    \ the algorithm is trained to use examples that have been labeled so that it knows\
    \ where the input is and where the desired output should be. Take for example\
    \ a piece of factory equipment. Its data points have been labeled as F for failure\
    \ or R for runs. The algorithm is going to receive the inputs and all of the outputs\
    \ that correspond with that input. From there, the algorithm will learn by comparing\
    \ the outputs that are given with the correct outputs to locate the error. After\
    \ that, it is going to modify the model accordingly. By using methods of classification,\
    \ prediction, regression, and gradient boosting supervised learning, the algorithm\
    \ will create patterns so that it can predict the values of the label with any\
    \ extra data that was not labeled. Supervised learning can typically be seen in\
    \ applications where the historical data is predicting a future event. The next\
    \ learning is semi-supervised. It is usually used with applications where supervised\
    \ learning is taking place. However, semi-supervised learning is going to take\
    \ the data that is labeled and not labeled and use it for training. These data\
    \ are typically a small amount of labeled data, and a large part of unlabeled\
    \ data since unlabeled data is less expensive and is not going to take as much\
    \ effort to gather. Semi-supervised learning will be used with the same methods\
    \ that were used with the supervised learning; but, it is only going to be useful\
    \ whenever the cost that is associated with labeling becomes too high to allow\
    \ for a fully labeled training process. Unsupervised learning will be done when\
    \ the data contains no historical labels. The system will not have the correct\
    \ answer as it does with supervised or semi-supervised learning. The first thing\
    \ that has to be done is that the algorithm has to figure out what it is being\
    \ shown. The goal will end up being for the machine to explore the data and discover\
    \ if there are any structure. Unsupervised learning is also going to use transactional\
    \ data. Reinforcement learning will usually be seen in navigation systems, gaming,\
    \ and robotics. Reinforcement learning will cause the algorithm to be discovered\
    \ through a trial and error situation which is going to help yield the biggest\
    \ reward. With reinforcement learning, there are going to be at least three components.\
    \ The first one is the agent who is going to be the decision maker. The second\
    \ will be the environment in which the agent interacts with, and the third will\
    \ be the actions that the agent goes through. The goal is for the agent to pick\
    \ the proper actions that are going to maximize the reward they expect over a\
    \ definite amount of time. As long as the agent follows good policy, they are\
    \ going to be able to reach the reward faster. Therefore, the goal of reinforcement\
    \ learning is to figure out what the best policy is. Machine Learning also includes\
    \ categories such as learning where the program is going to learn the inductive\
    \ bias of the program based on experiences that have happened before. Developmental\
    \ learning is going to be the same as robot learning. The program is going to\
    \ be able to generate its own sequence from the learning situations that it is\
    \ put through so that it can acquire repertoires of novel skills through self-exploration\
    \ and interactions with humans and other programs. Yet, another category of Machine\
    \ Learning is going to happen when you consider what the output is from the Machine\
    \ Learning system. \n\n1.  The classification of inputs is going to be divided\
    \ into at least two classes. The user is going to have to produce a model that\
    \ is going to take the inputs that are not seen by the user from these classes.\
    \ This is going to usually happen in supervised learning such as your email filters\
    \ between spam and not spam. \n\n2.  Regression is also going to be supervised\
    \ for the outputs to be continuous instead of being discrete. \n\n3.  Clustering\
    \ is going to take the input sets and divide them into various groups. However,\
    \ the difference between clustering and classification is that the groups are\
    \ not going to know the user before they are made which makes this an unsupervised\
    \ task. "
