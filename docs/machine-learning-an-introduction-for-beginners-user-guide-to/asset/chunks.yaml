- raw: '  But, what is your mathematical form of σ? The truth of the matter is that
    the exact form for this variable is not important because we are going to focus
    on the shape of our function. Should this function be a step function, then your
    sigmoid neuron is going to end up being a perceptron because the output would
    be either zero or one, depending if your equation gives you a positive or negative
    output. When you use the function for σ, then you are going to get a perceptron
    that is smooth. While how smooth your function is, is important, it is not something
    you need to spend a lot of time focusing on. The smoothness is simply going to
    modify the weights and bias which is then going to change the output for your
    sigmoid neuron. Thanks to calculus, your output is going to be predicted by this
    equation. Δoutput≈ ∑j ∂ output / ∂wj Δwj + ∂output / ∂b Δb, Your sum that is found
    all over your weights and your output is going to show a partial derivative for
    your output with the respect to your weights. You should not get too worried if
    you find that you are not comfortable working with partial derivatives. Your expression
    above is going to look complex due to all of the partial derivatives that are
    in it, but you are actually going to see that it is fairly simple by looking at
    your output as a linear function. The linearity will make it easy to pick out
    smaller changes that are done to the weights and biases to extract the change
    that you want in your output. Therefore, your sigmoid neuron is going to have
    the same behavior as the perceptron which is going to make it easier for you to
    figure out how to change your weights and biases to change the output. If the
    shape is what matters most, then it is not going to be an exact form which is
    going to be the reason for the use of the o in the equation. When you are looking
    at the changes that cause you to use a different activation function, then the
    value for that partial derivative is going to change in the equation. So, when
    you compute those derivatives later, your function is going to take the algebra
    and simplify it so that the exponentials have properties that you can work with
    when differentiated. As you interpret your output that comes from the sigmoid
    neuron, you are going to see that one of the biggest differences is going to be
    the perceptrons and the neurons where the neurons do not output zero or one. They
    can have any output as long as the output is a real number and it falls between
    zero and one. This is going to be useful when you are wanting your output to represent
    the average intensity for the pixels that are in an image. However, sometimes
    this is going to be a problem. Take for instance you are wanting your output to
    say that your image is nine or is not nine. It is going to be easier to do this
    if your output is zero or one for your perceptron. But, in practice, you are going
    to have to set up a convention to deal with this. This will allow you to interpret
    the output for at least half of the image which is going to indicate the number
    you want it to be. This means that any output that is less than half means that
    the output is not going to be what you want it to be. Conclusion Thanks for making
    it through to the end of Machine Learning, let’s hope it was informative and able
    to provide you with all of the tools you need to achieve your goals whatever they
    may be. The next step is to get started with your Machine Learning! If you are
    not using Machine Learning, then perhaps it is time for you to start! As you saw
    from this book, there are various ways to use Machine Learning, and there are
    a lot of different things that you are going to be able to do with Machine Learning.
    You can even use coding programs with Machine Learning so that you can manipulate
    the output that you get. Finally, if you found this book useful in any way, a
    review on Amazon is always appreciated!  Thank you and good luck! Mark Howard '
  fmt: '

    But, what is your mathematical form of `σ`? The truth of the matter is that the
    exact form for this variable is not important because we are going to focus on
    the shape of our function. Should this function be a step function, then your
    sigmoid neuron is going to end up being a perceptron because the output would
    be either zero or one, depending if your equation gives you a positive or negative
    output. When you use the function for `σ`, then you are going to get a perceptron
    that is smooth. While how smooth your function is, is important, it is not something
    you need to spend a lot of time focusing on. The smoothness is simply going to
    modify the weights and bias which is then going to change the output for your
    sigmoid neuron. Thanks to calculus, your output is going to be predicted by this
    equation. `Δoutput≈ ∑j ∂ output / ∂wj Δwj + ∂output / ∂b Δb`, Your sum that is
    found all over your weights and your output is going to show a partial derivative
    for your output with the respect to your weights. You should not get too worried
    if you find that you are not comfortable working with partial derivatives. Your
    expression above is going to look complex due to all of the partial derivatives
    that are in it, but you are actually going to see that it is fairly simple by
    looking at your output as a linear function. The linearity will make it easy to
    pick out smaller changes that are done to the weights and biases to extract the
    change that you want in your output. Therefore, your sigmoid neuron is going to
    have the same behavior as the perceptron which is going to make it easier for
    you to figure out how to change your weights and biases to change the output.
    If the shape is what matters most, then it is not going to be an exact form which
    is going to be the reason for the use of the o in the equation. When you are looking
    at the changes that cause you to use a different activation function, then the
    value for that partial derivative is going to change in the equation. So, when
    you compute those derivatives later, your function is going to take the algebra
    and simplify it so that the exponentials have properties that you can work with
    when differentiated. As you interpret your output that comes from the sigmoid
    neuron, you are going to see that one of the biggest differences is going to be
    the perceptrons and the neurons where the neurons do not output zero or one. They
    can have any output as long as the output is a real number and it falls between
    zero and one. This is going to be useful when you are wanting your output to represent
    the average intensity for the pixels that are in an image. However, sometimes
    this is going to be a problem. Take for instance you are wanting your output to
    say that your image is nine or is not nine. It is going to be easier to do this
    if your output is zero or one for your perceptron. But, in practice, you are going
    to have to set up a convention to deal with this. This will allow you to interpret
    the output for at least half of the image which is going to indicate the number
    you want it to be. This means that any output that is less than half means that
    the output is not going to be what you want it to be. Conclusion Thanks for making
    it through to the end of Machine Learning, let’s hope it was informative and able
    to provide you with all of the tools you need to achieve your goals whatever they
    may be. The next step is to get started with your Machine Learning! If you are
    not using Machine Learning, then perhaps it is time for you to start! As you saw
    from this book, there are various ways to use Machine Learning, and there are
    a lot of different things that you are going to be able to do with Machine Learning.
    You can even use coding programs with Machine Learning so that you can manipulate
    the output that you get. Finally, if you found this book useful in any way, a
    review on Amazon is always appreciated! Thank you and good luck! Mark Howard

