- raw: "Chapter 7: Support Vector Algorithms Part of Machine Learning is learning\
    \ how to understand support vector algorithms.  The most common way that people\
    \ learn how to work with machine algorithms is to start with regression. Once\
    \ you have that down, it is downhill from there. However, regression is not the\
    \ answer to everything. While working with Machine Learning algorithms, it is\
    \ helpful to think of the algorithm as a toolbox that contains any and every tool\
    \ that you are going to need to get the job done. But, you need to know how to\
    \ use those tools and when you need to switch to another tool. Regression is like\
    \ a humor which is going to help you pin down the data that you need. However\
    \ you will not have the ability to take that screw out with a hammer which is\
    \ a higher and more complex dataset. But, support vector machines serve as the\
    \ screwdriver that you need to deal with the smaller datasets that help to build\
    \ stronger foundations for the models you are creating. It is highly recommended\
    \ that you take the time to learn how to use Random Forest, naive Bayes algorithms,\
    \ and Ensemble modeling before using support vector algorithms. These knowledge\
    \ is going to make support vector machines much easier for you. The support vector\
    \ machine is a machine that is going to be part of the supervised Machine Learning\
    \ branch. It will be supervised while it is dealing with any algorithms that are\
    \ used for regression as well as classification. However, it will typically be\
    \ used while dealing with classification. Support vectors come with coordinates\
    \ that come from individual observations. These points are the frontier that is\
    \ used when showing the best segregation of two classes, for example, a line versus\
    \ a hyperplane. So, the first question is, how do we identify what the hyperplane\
    \ is? The first scenario would be when you have three planes. Once you've located\
    \ all three planes, you will have the tools to identify the hyperplane because\
    \ of the classifications that you've already done. Remember you need to select\
    \ the hyperplane that segregates your two classes best. The second scenario is\
    \ that you have three planes, but they all segregate your classes. How do you\
    \ tell which is the right plane? For this scenario, you will need to maximize\
    \ the distance between data points and the hyperplanes to see which one segregates\
    \ best. The distance that you have created will be known as the margin. You will\
    \ need to choose the plane with the highest margin because of robustness. If you\
    \ pick one with the lowest margin, you will have a high chance of classifying\
    \ the data points you're working with. While working with support vector machines,\
    \ you will come to realize that it is going to be easier to work with linear hyperplanes\
    \ that lay between two different classes. However, it is sensible to wonder if\
    \ you will need to add your line manually to the hyperplane. Your answer would\
    \ be no because the support vector machine will have a method that is built in\
    \ to take the lowest dimension input space and move it to the highest dimensional\
    \ space; this is known as a kernel trick. So, one inseparable problem will be\
    \ in converting the separable problem by using kernel functions. This is going\
    \ to be useful when you are using non-linear separation problems since it will\
    \ best work with complex data transformations. They can figure out what process\
    \ needs to be used while separating data based on the labels that were defined\
    \ by the program user. Python has a sci-kit that is a widely used library you\
    \ can use to implement Machine Learning algorithms. Support vector machines can\
    \ also be found in this library as long as you use the following code. Syntax\
    \ #import library from sklearn import svm #make sure you have an x (predictor)\
    \ and y (target) for the training datasets as well as a x\\_test (predictor) of\
    \ test\\_dataset #create SVM classification object model = svm . Svc (kernel =\
    \ 'linear', c=1, gamma =1) #there are going to be several options linked to your\
    \ model here such as if you want to change the kernel, gamma, or the c value.\
    \ Model. Fit (x, y) model. Score (x, y) #try and predict the outcome predicted\
    \ = model. Predict (x\\_test) As you set the parameters of your algorithms that\
    \ are machine learned, you will be helping to improve the model's performance\
    \ overall. Syntax sklearn. Svm. SVC (C = 1.0, kernel – 'rbf', degree = 3, gamma\
    \ = 0.0, coef 0 = 0.0, shrinking = true, probability = false, tol = 0.001, cache\\\
    _size = 200, class\\_weight = none, verbose = false, max\\_inter = -1, random\\\
    _state = none) Example import lumpy as lp import matholib. Pylot as plt from sklearn\
    \ import svm, dataset import data iris = dataset. Bring up \\_ iris ( ) x = iris.\
    \ Data \\[0: 4\\] #attempt to avoid any ugly slicing by using a 2-D dataset y\
    \ = iris. Target c = 26 svc = svm . SCV (kernel = linear, c = 3, gamma = 4). fit\
    \ (x, y) x\\_ min x\\_ max  \\[0 : 9\\], min ( ) - 7 x \\[ : 7\\], max ( ) + 6\
    \ h = (x\\_max / x\\_min) / 4 xx, yy = pu. Meshgrid (pi. Arrange (x\\_min, x\\\
    _max, h) pi. arrange (y\\_min, y\\_max, h)) Using supported vector machines have\
    \ both pros and cons. Let's look at a few. Pros \n\n1.  You will have the option\
    \ to use subset training points for any decision function that has to be used\
    \ to make the memory more efficient; \n\n2.  It is going to work better with the\
    \ margins of separation; \n\n3.  It will be more effective when you are dealing\
    \ with multiple dimensions as long as they are bigger than the number of samples\
    \ you have; and \n\n4.  It will work inside of high dimensional spaces. \n\nCons\
    \ \n\n1.  Should the dataset have extra noise, it will not perform well; \n\n\
    2.  It will not give you direct probability estimates; and \n\n3.  You cannot\
    \ use large datasets because the training time will be too high "
