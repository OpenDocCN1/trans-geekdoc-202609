- raw: 'Chapter 4: Problems That Can Be Solved with Machine Learning Machine Learning
    is helping out a lot of companies as well as individuals in their daily lives.
    In this chapter, you will see some points that were mentioned above as problems
    that have not been solved by Machine Learning just yet. Even though there are
    issues with that particular piece of Machine Learning, that does not mean that
    it does not work. Sometimes, these issues can be patched or fixed at a later date
    while the software is put out for users to use and discover what issues there
    may be with the software that the developers did not catch. Machine Learning helps
    with spam detection. When you get into your inbox, there are always emails that
    automatically gets routed to your spam box because of keywords that are detected
    in other emails. Yet some spam is allowed through because these keywords have
    been found in your inbox. It is going to filter those keywords to your inbox on
    the slight chance that you are going to want the emails even though they are spam.
    Spam detection still has a long way to go, but it is getting better as more rules
    are made. Have you ever wondered how the credit card companies are able to know
    when someone has used your card? It is because of the transaction record that
    they keep! Every month, the credit card company knows your usual stores and about
    how much is going to be spent. If they see any activity outside of your usual
    area or outside of how much you usually spend, they are going to say that the
    card was stolen and report it as such. This can cause problems later on if you
    decide to go on a trip or if you spend over what you normally spend. It is not
    perfect, but Machine Learning is learning how to recognize zip codes written on
    envelopes so that they are able to sort the envelopes out into geographical locations
    and that way the mail is sorted faster and is delivered faster. There are still
    some issues with this as machines are not always able to read a person''s handwriting
    since everyone writes in a different manner. As we''ve mentioned, Siri is able
    to understand what you are saying. But, what if other machines were also capable
    of doing this? Thanks to Machine Learning, this is now becoming a reality. The
    biggest issue is that everyone has different dialects and speaks a different language.
    Not only that, but new words are being added to the dictionary almost daily. But,
    even with there being issues in machine’s understanding of what is being said
    to them, this does not stop them from trying to fulfill the request that is made.
    When you upload a picture on Facebook, there is an algorithm that looks at the
