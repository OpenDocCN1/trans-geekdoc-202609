    to be unsupervised. Some parts have to be supervised because you will be searching
    for a specific outcome. Should you want to use Python to leverage the Machine
    Learning you are doing, there are a few things that you need to know in case you
    do not know about them yet. Python is extremely versatile, and you can do extremely
    specific computation, and then it can be converted to Machine Learning. You will
    need to install Python on your computer if you have not done it yet. You will
