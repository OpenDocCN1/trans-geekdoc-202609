    每个因素都可以用二进制变量来表示。通过查看问题的权重和阈值，你将能够为决策过程创建不同的模型。你的感知器将在你能否外出时成为决策者。当你去掉阈值时，你大概率能够和家人外出。请记住，你的感知器并不是人类能够进行的完整决策过程的完整模型。然而，你的感知器能够权衡不同的证据，做出你需要的决定。这对于由多个感知器组成的复杂网络来说更为合理，这些感知器会做出你可能察觉不到的微小决策。虽然学习算法听起来像是正确的方向，但你将如何为神经网络创建一个算法呢？考虑到你可以拥有一个用于感知器的网络来解决问题。网络的输入将类似于被扫描到程序中的原始像素数据。这将使网络能够学习输出的权重和偏置，从而正确分类结果。如果你对网络中的权重进行任何更改，输出将相应地改变。然而，感知器的现实是，当权重发生变化时，感知器可能会完全翻转，这会导致整个网络的行为发生完全的改变，转变为更复杂的行为。因此，即使一个数字被正确分类，你的网络也会表现得难以控制。新的行为会使你看到如何调整权重和偏置以使网络更接近你想要的行为变得困难。因此，必须有一种巧妙的方法来规避这个问题，这可能瞬间并不明显。你可以通过引入一种新的神经元——
    sigmoid 神经元来解决这个问题。这些神经元类似于感知器，但经过修改，当你进行微小变化时，它们只会在输出上产生微小的变化，而不会导致输出完全改变。这一点至关重要，sigmoid
    神经元将能够学习网络的行为。你的 sigmoid 神经元将拥有与感知器相似的输入。然而，它能够接受介于零和一之间的任何值。这意味着你可以将这两个数字之间的小数作为有效输入。就像感知器一样，sigmoid
    神经元也有每个输入的权重以及一个偏置，涵盖该神经元的所有内容。然而，它的输出并不是零或一，而是 sigmoid 函数，由以下方程定义：σ(z)≡1/1+e^−z
    另一种观察方式是将 sigmoid 神经元的输出与输入结合：1/1+exp(−∑jwjxj−b) 当你第一次看到 sigmoid 神经元时，它们看起来与感知器非常不同。但
    sigmoid 函数的代数表达式看起来晦涩难懂，似乎难以掌握。不过，你会掌握它，因为感知器和 sigmoid 神经元之间有许多相似之处。要理解这些相似之处，你需要查看感知器模型，如
    z≡ w⋅ x+b，其中 z 取一个很大的正数。这意味着 e^−z≈0，σ(z)≈1。最终，sigmoid 神经元将是一个很大的正数，就像感知器一样。现在，想象你在使用负数进行工作，那么
    sigmoid 的行为将和感知器相同。只有在微小尺度上，sigmoid 才会与感知器模型出现偏差。'
