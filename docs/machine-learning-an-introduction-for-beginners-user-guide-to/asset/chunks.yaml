- raw: 'Each factor is going to be able to be represented by a binary variable. By
    looking at the weights and the threshold for your problem, you are going to be
    able to create different models for the decision making process. Your perceptron
    is going to be the decision maker if you are going to be able to go on your outing
    or not. When you drop the threshold, you are going to most likely be able to go
    on your outing with your family. Keep in mind that your perceptron is not going
    to be a complete model of the decision-making process that a human can do. However,
    your perceptron is going to be able to weigh different evidence to make the decisions
    that you need. This should seem more plausible for a complex network of perceptrons
    that are going to make small decisions that you may not notice are being made.
    While a learning algorithm sounds like the way to go, how are you going to create
    an algorithm for a neural network? Think about having a network for your perceptrons
    that you can use to solve problems. The inputs for the network are going to be
    like the raw pixel data that is scanned into the program. This will allow the
    network to have the ability to learn weights and biases for the output to be classified
    correctly. If you make any changes to the weight in the network,  your output
    is going to correspond with the change that you made. However, the reality of
    perceptrons is that when a change is made to the weights, then there is the possibility
    that the perceptron is going to flip completely due to that change. This change
    is going to cause the behavior of your entire network to change completely into
    a more complex behavior. So, while one of your digits is going to be classified
    correctly, your network is going to be behaving in a way that is going to be hard
    to control. Your network’s new behavior is going to make it difficult to see how
    your weights and biases need to be modified so that your network is closer to
    the behavior that you want. Therefore, there must be a clever way of getting around
    this issue that may not be obvious instantly. You can overcome the problem just
    by bringing in a new neuron known as the sigmoid neuron. These neurons are going
    to be like perceptrons, but they are going to be modified so that when you make
    small changes, they are only going to give you a small change in your output rather
    than taking chance that your output changes completely. This is vitally important,
    and the sigmoid neuron is going to be enabled to learn the behavior of the network.
    Your sigmoid neuron is going to have inputs that are similar to your perceptron.
    However, it is going to be able to take any value that falls between zero and
    one. This means that you can use the decimal points that fall between these two
    numbers as a valid input for your sigmoid neuron. Just like a perceptron, your
    sigmoid is going to have a weight for every input as well as a bias that covers
    everything in that neuron. However, your output is not going to be zero or one,
    it is going to be known as a sigmoid function, and it is going to be defined by
    this equation. σ(z)≡1/1+e −z Another way to look at it is to put the outputs of
    your sigmoid neuron with your inputs. 1/1+exp(−∑jwjxj−b) When you first look at
    your sigmoid neuron, they are going to look very different than your perceptrons.
    However, the algebraic expression for the sigmoid function is going to seem opaque
    and like you are never going to be able to master it. However, you are going to
    be able to because there are a lot of similarities between your perceptrons and
    your sigmoid neurons. To understand the similarities, you need to look at a perceptron
    model like z≡ w⋅ x+b, where you have a large positive number. Which then means
    e−z≈0e−z≈0  and σ(z)≈1 are equal. Ultimately, your sigmoid neuron is going to
    be a large positive number just like it would be for the perceptron. Now, think
    of it as if you were working with negative numbers. Then, your sigmoid’s behavior
    will be the same as the perceptron. The only time you are going to see deviation
    from your perceptron model is of modest size.  '
