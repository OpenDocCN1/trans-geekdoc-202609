    但是，你的σ的数学形式是什么？事实上，这个变量的确切形式并不重要，因为我们将关注函数的形状。如果这个函数是阶梯函数，那么你的 sigmoid 神经元将会变成感知器，因为输出要么是零要么是一，取决于你的方程给出的输出是正还是负。当你使用σ函数时，你将得到一个平滑的感知器。虽然函数的平滑程度很重要，但它并不需要花费太多时间去关注。平滑度仅仅会修改权重和偏置，从而改变
    sigmoid 神经元的输出。得益于微积分，你的输出将由以下方程预测：`Δoutput≈ ∑j ∂ output / ∂wj Δwj + ∂output /
    ∂b Δb`，你在所有权重和输出中找到的总和将显示出你输出关于权重的偏导数。如果你对偏导数感到不适，不要太担心。你的表达式看起来会因为包含大量的偏导数而显得复杂，但实际上通过将输出视为线性函数，你会发现它其实相当简单。线性化会让你更容易找出对权重和偏置进行的小幅度变化，从而提取你想要的输出变化。因此，你的
    sigmoid 神经元的行为将和感知器相同，这将使你更容易确定如何调整权重和偏置以改变输出。如果形状是最重要的，那么它并不关心确切形式，这也是方程中出现 o
    的原因。当你查看导致使用不同激活函数的变化时，方程中的那个偏导数的值将会发生变化。因此，当你稍后计算这些导数时，你的函数会运用代数并简化它，使得指数具有可在求导时使用的性质。当你解释
    sigmoid 神经元的输出时，你会发现其中一个最大的区别在于感知器和那些不输出零或一的神经元。它们可以输出任何实数，只要该数值在零到一之间。这在你希望输出表示图像中像素的平均强度时会很有用。然而，这有时也会是个问题。例如，如果你希望输出图像是“九”或者“不是九”，那么使用输出为零或一的感知器会更容易实现。但在实践中，你需要设立一种惯例来处理这种情况。这将使你能够解释至少图像的一半的输出，从而指示你想要的数值。这意味着任何小于一半的输出都不会是你想要的结果。结论感谢你阅读完这本《机器学习》一书，希望它
    informative 且能提供你实现目标所需的所有工具，无论目标是什么。下一步是开始你的机器学习之旅！如果你不使用机器学习，那么可能是时候开始使用它了！从这本书中，你可以看到使用机器学习的各种方法，以及你将能够用机器学习做的诸多事情。你甚至可以使用编程工具配合机器学习，从而操控你得到的输出。最后，如果你觉得这本书有用，在亚马逊上留下评论总是受到欢迎！谢谢，祝好运！Mark
    Howard

    '
