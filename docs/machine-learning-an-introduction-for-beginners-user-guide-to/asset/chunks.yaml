    # Chapter 5: Examples of Machine Learning


    In recent years, Machine Learning has been used in various areas of business and
    has been passed on to other companies as well as consumers. Machine Learning has
    combined with artificial intelligence so that new products can be released to
    the public. These products then spur other products to be released and have helped
    to better the products that are released for consumers. One such product is the
    Hello Barbie toy that has a microphone in her necklace. Whenever a child speaks,
    their words are transmitted to a server at Toy Talk and analyzed so that the appropriate
    response can be sent back. All these takes less than a second to complete. Hello
    Barbie is able to respond with 8,000 lines of dialogue and is able to save their
    answers so that they are able to respond later to questions such as where the
    child''s favorite food is stored.


    The Coca-Cola company sells more than 500 drinks in 200 countries which makes
    it the largest beverage company in the world. By analyzing the data from each
    country, Coca-Cola is able to learn what sells best in that country and they are
    able to get rid of the drinks that do not sell. This means that they are able
    to maximize their profits and minimize their profit loss margin.


    Heineken does the same thing, except they are using artificial intelligence and
    Machine Learning to improve their customer service, marketing, advertising, and
    operations in America, so they are able to expand.


    Have you heard of Watson? Watson has been implemented in various businesses in
    a wide variety of sectors such as culinary arts. Chef Watson has become a sous-chef
    in a kitchen developing recipes and complementing their human counterparts which
    make working in a kitchen more efficient than before. Watson has also been fed
    images of Gaudi''s work so that he is able to look at it and analyze it by learning
    where his influences lie. It learns the various influences such as Barcelona,
    and any cultural, biographical, or historical data so that this information can
    be shared with a human artist and help him create a sculpture that follows in
    the same style as Gaudi. Watson has even been given algorithms that help composers
    with musical elements to inspire them and help them determine what song is going
    to be a hit. Watson is able to do this by using conversations, speeches, and newspaper
    headlines to help with their inspiration.


    BP is one of the largest companies in global energy, and they realize the massive
    potential that Machine Learning and artificial intelligence has for their industry.
    By using the new updated technology, they are able to improve their use of resources
    and the safety of their process of refining oil and gas. By improving their operations,
    they are able to take all of their data and place it in the hands of those who
    are able to make the high-risk decisions that will ultimately change the world.


    Also, in the energy sector, GE has been using Machine Learning, IoT (Internet
    of Things) and big data to create an internet of energy where all of their data
    is sent. They are able to optimize their data to help push them to their vision
    of a digital power plant.


    In the financial sector, there are around 3.6 petabytes of data, and it continues
    to grow on a daily basis. Every day some people are looking at their credit through
    an agency known as Experian, and because of that, they receive a large amount
    of data from a variety of marketing databases, public records, and transaction
    records. They are currently trying to improve their system where Machine Learning
    makes their services come to a decision faster. They aim to relay those decisions
    to their consumers faster, so people are not waiting for several days at a time
    for a credit decision on a purchase they are trying to make.


    American Express handles over 110 million cards that are currently being used
    while processing over a trillion dollars in transactions. Because of this, they
    rely on Machine Learning algorithms that are created to help detect fraud in real
    time. This helps to save the company millions of dollars. On top of that, AmEx
    is trying to get control of the flow of data by developing apps that would allow
    cardholders to log in and access their account. This will also help them see online
    business trends for their users.


    Google''s Deep Mind has created a machine that can mimic the thought process of
    a human being. Deep Mind has been able to beat humans at a variety of games, but
    that is not where its possibilities end. Deep Mind has the potential to help with
    healthcare applications so that they can reduce the time that it takes for treatment
    plans to be made which means that they are quicker when diagnosing the illness.


    Machine Learning has helped Volvo be able to predict when a part of a vehicle
    is going to fail or will need to be serviced. This has helped saved countless
    lives. Volvo is also trying to develop their own autonomous vehicles.


    # Chapter 6: Free Datasets


    The datasets that you use when you are working with Machine Learning are going
    to be located in the datasets that have already been cited by peer-review academic
    journals. Datasets are a vital part of Machine Learning that you must know to
    understand Machine Learning. As we have discussed previously, there have been
    major advancements in the field of Machine Learning. Thanks to users learning
    about the computer''s hardware, the algorithms that the computer will use, and
    the availability that you will be offered from the high-quality training datasets.


    Most datasets are going to be supervised or may even be semi-supervised as they
    deal with algorithms because of the expensiveness and the difficulty of producing
    the algorithms because the data is going to need to be labeled. But, if the data
    does not need to be labeled, then it can be left unsupervised which is going to
    be too costly for most companies to produce.


    Most datasets that you use for image data will be the sets that help when recognizing
    faces or actions. They are also made to recognize handwriting and characters that
    are written on a piece of paper.


    Text data will be things such as messages that are sent between people, reviews
    left online, posts written on Facebook or Twitter, or any text that is placed
    into any computer program.


    Sound data will be any sound such as speech or music that can be placed on a computer
    and analyzed.


    Physical data will be the data that you collect from earth science, astronomy,
    and other systems that you are going to have the option of measuring physically.


    Signal data is data that will track electricity or other motions such as how traffic
    moves through a city.


    The multivariate data will be data that measure the weather, internet traffic,
    finances, and even a state census.


    And finally, biological datasets will measure drug discoveries, plant growth,
    animal growth, and human growth as well. Therefore, biological data will measure
    anything living that can be measured.

