    # Chapter 3: Problems with Machine Learning That Have Not Been Solved


    As stated above, Machine Learning is evolving as technology evolves, so it is
    highly likely that there are always going to be issues that will have to be dealt
    with before an answer is found. There are going to be ways around these issues,
    and even if there are not, there are going to be ways for you to analyze and get
    your data results despite these issues.


    Below, are a few issues that have yet to be solved by Machine Learning.


    One, the variable event space has not been solved yet. To solve this, we are going
    to need to be able to create a classification system that is going to respond
    in an efficient and meaningful way even if the event space is varying from the
    training data.


    Another one is that there is no context understanding when it comes to the processing
    languages. Context analysis is a big deal for Machine Learning because it leaves
    a large hole open for things to be misunderstood. One possible solution is that
    the open AI team should come up with a solution that allows the agents to create
    their own rules instead of making it to where they need to find patterns.


    Facial identification is quickly becoming a popular way for people to unlock their
    device because it is quick and a semi-secure way to keep your device from being
    hacked. However, it is by no means perfect because people with similar facial
    features will be able to get into each other’s phone. Not only that but if a female
    wears makeup and does not for the facial recognition''s picture, then she is not
    going to be able to get into her phone because she altered her appearance.


    Automated learning is a big part of Machine Learning, and if a machine cannot
    automatically learn what it is supposed to, then it is not going to be useful
    to the company that is using it. Learning has to come from a variety of resources,
    and when a graph is being made based on the connected sense that is missing, then
    the automated learning is going to hit a snag and is going to have gaps in what
    it is able to do. For example, IBM''s Watson has been doing an excellent job,
    but it still requires a system that is more geared for automated general intelligence.


    In some Machine Learning, the machine is going to need to make its own decisions
    based on its reasoning over a deviating test space; but this is not going to include
    the rule-based engines. To make the reasoning that is required, Machine Learning
    will need to have space for reasoning or debatable agents that will help with
    its reasoning.


    Have you ever talked to Siri and she got confused if you are trying to talk to
    her or if you are talking to someone else? This is an issue that Machine Learning
    has with its efficient repose generation. In other words, Siri cannot create a
    contextual response when you are talking to her unless it is already programmed
    in or if she can look it up on the internet.


    The three-way human rule is an issue with Machine Learning as well. Machines cannot
    always comprehend the knowledge that human has a three-way rule that takes an
    image, gives it a type, and then gives it a description. If Machine Learning could
    comprehend the three-way human rule, then classifying art, music, and others would
    be an easier task.


    Another issue that Machine Learning has shown is its memory networks. Many people
    believe that working with technology means that you do not need a lot of space.
    However, this is far from true because to store all of the data that is collected,
    there needs to be a lot of space available. Machines are not humans, so they are
    not going to be able to come up with the thoughts that a human is able to come
    up with. But machines can be taught as long as we do not push them past their
    limits, but we do not limit them to where all of the work still needs to be done
    by a human.


    Technology is going to have its holdups, but eventually, they can be solved. One
    reason they may not be solved yet is that the technology needed to solve it does
    not exist yet.

    '
  trans: '

    # 第 3 章：未解决的机器学习问题


    如前所述，随着技术的发展，机器学习也在不断演进，因此在找到答案之前，很可能总是需要解决一些问题。即使没有解决的方法，也会有分析数据并获得结果的方法。


    下面列出了一些尚未被机器学习解决的问题。


    首先，变量事件空间尚未得到解决。为了解决这一问题，我们需要能够创建一个能够在训练数据的事件空间有所不同的情况下，以高效且有意义的方式进行响应的分类系统。


    另一个问题是缺乏语言处理的上下文理解。上下文分析对机器学习至关重要，因为它会在理解方面留下巨大的空白，导致误解的可能性。一个可能的解决方案是，OpenAI
    团队应开发一种让代理能够自己制定规则的方案，而不是必须寻找模式。


    人脸识别正在迅速成为人们解锁设备的流行方式，因为它快速且半安全，可以防止设备被黑客入侵。但这绝不是完美的，因为面部特征相似的人可能会互相解锁手机。而且，如果女性在用于人脸识别的照片中没有化妆，那么她将无法解锁手机，因为她改变了外观。


    自动学习是机器学习的重要组成部分，如果机器无法自动学习它需要学习的内容，那么它对使用它的公司就没有用处。学习必须从多种资源中获取，当图表基于缺失的连接感而构建时，自动学习将会受阻并出现缺口。例如，IBM
    的 Watson 表现出色，但仍需要一个更偏向人工智能的系统。


    在某些机器学习场景中，机器需要基于其在偏离测试空间上的推理做出自己的决策，但这不包括基于规则的引擎。为了进行所需的推理，机器学习需要有空间用于推理或可争论的代理，以帮助其推理。


    你是否曾经和 Siri 交谈过，发现她如果你在和她交谈还是在和别人交谈时会感到困惑？这是机器学习在高效回应生成方面存在的问题。换句话说，Siri 除非已经被编程好，或者可以在互联网上查找信息，否则无法创建上下文感知的回应。


    三位一体规则也是机器学习面临的一个问题。机器不一定能够理解人类的三位一体规则，即先将图像分类，然后给出描述。如果机器学习能够理解三位一体规则，那么分类艺术、音乐等将会更加容易。


    另一个机器学习表现出的问题是其记忆网络。许多人认为使用技术意味着不需要大量存储空间。然而，事实并非如此，因为存储收集的所有数据需要大量空间。机器不是人类，因此无法像人类一样产生思考。但只要我们不把它们推到极限，也不会限制它们到必须由人类完成所有工作，机器是可以被教导的。


    技术会遇到障碍，但最终可以解决。其中一个原因是目前还不存在解决该问题所需的技术。'
