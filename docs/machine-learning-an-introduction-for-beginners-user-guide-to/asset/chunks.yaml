    # Chapter 4: Problems That Can Be Solved with Machine Learning


    Machine Learning is helping out a lot of companies as well as individuals in their
    daily lives. In this chapter, you will see some points that were mentioned above
    as problems that have not been solved by Machine Learning just yet. Even though
    there are issues with that particular piece of Machine Learning, that does not
    mean that it does not work. Sometimes, these issues can be patched or fixed at
    a later date while the software is put out for users to use and discover what
    issues there may be with the software that the developers did not catch.


    Machine Learning helps with spam detection. When you get into your inbox, there
    are always emails that automatically gets routed to your spam box because of keywords
    that are detected in other emails. Yet some spam is allowed through because these
    keywords have been found in your inbox. It is going to filter those keywords to
    your inbox on the slight chance that you are going to want the emails even though
    they are spam. Spam detection still has a long way to go, but it is getting better
    as more rules are made.


    Have you ever wondered how the credit card companies are able to know when someone
    has used your card? It is because of the transaction record that they keep! Every
    month, the credit card company knows your usual stores and about how much is going
    to be spent. If they see any activity outside of your usual area or outside of
    how much you usually spend, they are going to say that the card was stolen and
    report it as such. This can cause problems later on if you decide to go on a trip
    or if you spend over what you normally spend. It is not perfect, but Machine Learning
    is learning how to recognize zip codes written on envelopes so that they are able
    to sort the envelopes out into geographical locations and that way the mail is
    sorted faster and is delivered faster. There are still some issues with this as
    machines are not always able to read a person''s handwriting since everyone writes
    in a different manner.


    As we''ve mentioned, Siri is able to understand what you are saying. But, what
    if other machines were also capable of doing this? Thanks to Machine Learning,
    this is now becoming a reality. The biggest issue is that everyone has different
    dialects and speaks a different language. Not only that, but new words are being
    added to the dictionary almost daily. But, even with there being issues in machine’s
    understanding of what is being said to them, this does not stop them from trying
    to fulfill the request that is made.


    When you upload a picture on Facebook, there is an algorithm that looks at the
    facial features of those in the picture and asks you if you would like to tag
    that person. This allows the person to see the picture where they were tagged
    and allows them to decide if they want it on their profile or not. The same algorithm
    is used when a user decides to use the facial recognition software on their phone
    or computer to unlock their device.


    Everyone knows when they log into websites such as Amazon, there is a list of
    products that are recommended to you because of your past purchases or because
    of things that you have looked at. There is a model that is built-in to the code
    of the website that allows it to figure out ways to target you specifically as
    an individual so that you are given a more personalized shopping experience. In
    doing this, Amazon and other websites that use the same algorithm are hoping that
    they are going to be able to keep you coming back to spend money with them. This
    algorithm can also be seen in Facebook because it allows you to log into other
    websites so that it can provide you with ads that you may want to see instead
    of generic ads that are not going to catch your attention.


    The medical field has to advance with technology, or else it falls behind. Because
    of Machine Learning, the medical field is able to take the symptoms that a patient
    is feeling. This allows them to plug the symptoms into their computer and get
    a list of diagnosis. This is not going to be perfect, but it is going to point
    the healthcare provider in the right direction so that they are able to figure
    out what is wrong with the patient.


    When it comes to trading stock, it is vital to know when you are going to trade
    or hold on to your stock so can make more money. Machine Learning has come up
    with an algorithm that looks at the financial information and analyzes it so that
    stockbrokers are able to know when they should trade and when they should let
    their stocks go. This is helping many companies save money, so they are not buying
    useless stocks or so that they are not holding onto a stock that is about to lose
    all of its value.


    Data entry by humans is going to have issues such as duplication and inaccurate
    data. But, with Machine Learning, algorithms work with predictive modeling algorithms
    to improve these issues. They learn how to perform time-intensive documentation
    and other data entry tasks. This opens up more free time for those with the proper
    knowledge to be able to work on the more intensive problem-solving tasks because
    they do not need to deal with the menial data entry jobs that machines are able
    to do.


    An amazing invention known as Dulight was created by Baidu to help those that
    are visually impaired to learn what is going on around them. They will work with
    a computer that will use image recognition to survey the grounds around them and
    then speak to them through an earpiece in their ear that will tell them what they
    would see.


    Machine Learning is used by most of the companies that are in business today.
    It may not be used in a way that is automatically visible to the general public
    or even their employees, but it is being used even in the simple way of analyzing
    data. This aids them in making better decisions in gaining money rather than losing
    money.

