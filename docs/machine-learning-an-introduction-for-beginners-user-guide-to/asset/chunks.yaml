    # 第 8 章：使用 Python 进行机器学习


    Python 是一种编程程序，你可以用它来完成几乎所有需要在编写自己的程序时进行的编码工作。由于 Python 会根据你提供的输入给出输出，所以你将使用机器学习！Python
    的大部分功能是无监督的。有些部分需要监督，因为你将在寻找特定的结果。


    如果你想使用 Python 来利用你正在进行的机器学习，那么在你尚未了解它们之前，你需要知道几件事。Python 极其灵活，你可以进行极其具体的计算，然后将其转换为机器学习。如果你尚未安装
    Python，则需要在你的计算机上安装它。你还需要获得与机器学习兼容的包。强烈建议你安装 Anaconda，因为它是工业级实现，能够在任何操作系统上使用，并且包含你在使用机器学习时所需的所有包。


    使用机器学习的主要目标将定义数据科学家的角色。使用机器学习算法的数据科学家种类繁多。你还需要了解核方法，以便能够从你正在使用的支持向量机模型中获得洞察。


    当你处理数据科学时，你需要将数据加载到程序中。你所使用的学科必须能够处理你观察和收集的数据。你将把这个数字数据集加载到 scikit-learn 所在的 Python
    库中。要加载你的数据，你需要将 scikit-learn 库中的模块导入 Python，并使用你获得的数据集。


    随后，你将有机会使用从你导入的数据集中加载的 `load_digits()` 函数。语法：`from sklearn import Digits = datasets.load_digits()`，`Print(______)`。此时，你应该注意到该模块将保存其他方法，用于获取当前正在使用的最流行数据集的引用。因此，即使你没有人工生成数据，也可以始终依赖该模块工作。请记住，如果你下载数据，它已经会在测试集和训练集之间分离。你可以通过文件扩展名区分两者：“.tra”
    是训练集，“.tes” 是测试集。这两个文件都需要加载，以便你的项目得到完善。


    当你开始处理数据集时，需要观察数据描述，以便了解你将从该数据中学习什么。使用 scikit-learn 时，数据不会自动提供。因此，你需要从其他来源下载数据，通常可以在该来源中找到描述，从而获得足够的信息来处理你的数据集。注意：你获得的洞察可能不足以满足你对数据的使用需求。你需要对数据进行探索性数据分析，以便了解数据将如何被使用。如果你尚未检查描述，或者需要再次确认，你需要特别关注描述中的基本信息。加载后，数字数据会通过
    scikit-learn 数据集打印出来。你可能因为目标值而已经知道很多关于你所寻找的信息。你需要通过 `data` 属性访问数字数据，这与通过 `target`
    属性访问目标值的方式相同。描述将通过 `descr` 属性提供访问。如果你需要查看正在使用的数据的键，请使用 `digits.Keys()` 函数。例如：`Print(digits.____)`
    # 打印你正在使用的数据 `Print(digits.____)` # 打印目标值 `Print(digits.____)` # 获取数据集的描述 `Print(digits.descr)`


    如果阅读 `read_csv()` 函数，你将能够导入你的数据，从而查看包含你想要数据的数据框。对于你正在使用的数据，不会有描述。在这种情况下，你将使用 `head()`
    或 `tail()` 函数来恢复数据，以便再次检查。当你使用这些方法时，你需要阅读数据的描述！现在你可能在想如何访问数据的数组。答案是，你仍然使用与数组关联的属性。请记住，当你使用
    `digits.Keys()` 函数时，这些属性将可用。例如，如果你尝试使用 `data` 属性来孤立数据，你可以使用 `target` 函数来找到目标值，同时使用
    `ht edescr` 来获取描述。那么现在呢？首先，你应该确定数组创建的维度数量，这由数组中的项目数量决定。数组的 `shape` 将是一个元组，告诉你每个维度的大小。例如
    `Y = pi. Zeros((4, 2, 5))` 这意味着你的数组将被形状为 (4, 2, 5) 的点。要查看数组的形状，你将使用 `target`、`descr`
    和 `data` 函数。第一步是使用 `data` 函数，以便从数字数据中孤立 NumPy 数组，然后使用 `shape` 属性来发现数组的形状。你将使用
    `target` 和 `descr` 执行完全相同的操作。另一个可用的属性是 `images`，它会以图像形式显示数据，而不是数字。例如：`#分离你的数字数据
    digits_data = digits.data` # 查看数字数据的形状 `Print(shape for the digits data)` # 孤立目标值
    `Digits_target = digits.____` # 再次查看形状 `Print(target function)` # 打印唯一标签的数量 `Number_digits
    = len(np.Unique(digits.Target))` # 孤立图像 `Digits_images = digits.Images` # 再次查看形状
    `print(image shape)` 最后，如示例所示，图像数据必须包含形状的维度。你可以通过重塑图像，使其不再是三维而是二维来直观检查图像和数据函数。你可以使用
    `digits.Images.reshape(instances and pixels)` 进行此操作。你也可以使用更长的代码片段以确保图像的重塑完全正确。`Print(np.All(digits.Images.reshape((instances
    and pixels)) == digits.Data))` 当你使用 NumPy 方法时，你将使用 `all()` 方法来测试数组在轴上上的元素，以便查看你的评估是否为真。如果结果为真，则重塑后的图像将等于
    `digits.Data` 函数。一旦你对所学内容感到自信，你就可以开始处理更复杂的情况，在那里你可以可视化你正在处理的图像。Python 有可视化库 matplotlib，专门用于此目的。语法：`Import
    matplotlib.pyplot as plt` `Fig = plt.Figure(figsize = 6, 6))` `Fig.subplots_adjust(left
    = 0, right= 1, bottom = 0 top = 1 hspace = 0.05, wspace = 0.05` `For I in range(64):`
    `Ax = fig.add_subplot(8, 8, I + 1, xticks = [], yticks = [])` `Ax.imshow(digits.Images[I]
    cmap = plt.cm.binary, interpolation = ''nearest'')` `Ax.Text(0, 7, str(digits.target[i]))`
    `Plt.Show()` 你刚刚看到的语法将被大量使用，可能看起来有些令人望而却步，但你可以将代码分解为块，以便更容易理解和操作。

    '
