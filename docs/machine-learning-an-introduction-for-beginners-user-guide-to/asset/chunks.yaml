- raw: "4.  Density estimation is going to locate the distribution for the inputs\
    \ in that space. \n\n5.  Dimensional reduction takes the input and simplifies\
    \ it so they can be mapped to the lowest dimension. \n\n6.  Topic modeling will\
    \ take a problem from the program that is inserted by a user and tasked to see\
    \ if the documents inserted cover related topics. \n\nA classification Machine\
    \ Learning model is going to be validated by a technique that uses accuracy estimation\
    \ such as holdout. Holdout is going to split the data when training and testing\
    \ your set before evaluating the performance of the model on the test set. However,\
    \ if you look at n fold cross-validation, then you are going to see that the data\
    \ will randomly be split into subsets where the k-1 instances are going to be\
    \ used in training the model. While the k instance is going to be used in testing\
    \ the predictive ability for the training model that you are using. Along with\
    \ this, the holdout and the cross-validation method is going to use samples for\
    \ the n instances. The replacement comes from the dataset and how it is going\
    \ to be able to be used in assessing the model’s accuracy. On top of that, there\
    \ is an overall accuracy that an investigator discovers. It is going to be reported\
    \ for specificity and sensitivity such as the true positive rate and the true\
    \ negative rate. This means that the true positive rate and the true negative\
    \ rate are going to sometimes report false positive rates or false negative rates.\
    \ But, it is these rates that are going to fail to show the numerator and denominator\
    \ for the equation. Your total operating characteristic is going to be an effective\
    \ method that is going to show the models’ diagnostic abilities. Total operating\
    \ characteristic is also going to reveal the numerators and denominators that\
    \ were mentioned previously in the rates. This means that the total operating\
    \ characteristic is going to show you more information than you were able to use.\
    \ This will include the receiver operating characteristic which is going to fall\
    \ under the area under the curve. Due to what it is, Machine Learning often times\
    \ brings up a lot of ethical questions. The systems that are trained to work with\
    \ the data that you collect is going to be biased based on the exhibits that the\
    \ biases are going to be used on which is going to digitalize the cultural prejudices.\
    \ Therefore, the responsibility that comes from collecting data is going to be\
    \ a big part of Machine Learning. Due to the language that you use when dealing\
    \ with Machine Learning, you are going to be using machines that are trained on\
    \ bias. \n\nChapter 2: Top Problems in Machine Learning Machine Learning is still\
    \ evolving and still being used every day. As it is used more, the more we are\
    \ going to be able to figure out where the problems are and what needs to be done\
    \ to fix them. Some of these problems are yet to be solved, but that does not\
    \ mean that there will not be a solution later in the future. One problem is that\
    \ natural language processing and understanding language is still a problem when\
    \ it comes to Machine Learning, even with the deepest networks. Because of the\
    \ many different languages and dialects, it is hard for machines to decipher what\
    \ is being said. But that does not stop them from trying. Programs such as Siri\
    \ and Cortana are constantly being updated so that they can better serve their\
    \ users. Images can be classified with Machine Learning, but it cannot figure\
    \ out what is going on in the image. By understanding what is going on in an image,\
    \ it cannot be further classified. But we are going to have the option to figure\
    \ out where the influences in the image lie and how we would be able to recreate\
    \ the work in the same style. This also leads to solving semantic segmentation.\
    \ Machines should be taught how to identify what is going on in each pixel so\
    \ that we can better understand what is going on in the image. Deep reinforcement\
    \ needs to be stabilized as well. If something is not broken, why attempt to fix\
    \ it? Sometimes the old ways work the best, and there is no reason to be messing\
    \ with the model that already works. With deep reinforcement being stabilized,\
    \ this would be possible. This is then going to allow deep reinforcement to tackle\
    \ harder problems that have yet to be touched by Machine Learning such as Montezuma's\
    \ revenge. On top of that, with stabilized reinforcement, learning the ability\
    \ to control robotics would open up exponentially, and the possibilities would\
    \ be endless. There is no telling how far robotics would go because they would\
    \ be able to figure out the best way to receive their reward; in other words,\
    \ they would be given the option to act like humans but have an incentive as to\
    \ what they should do to get that reward. GANs are generative adversarial networks\
    \ that are going to work with a specific class of artificial intelligence. It\
    \ is a set of algorithms that will be used with unsupervised learning which will\
    \ then be implemented on a system of two neural networks working against each\
    \ other in a zero-sum game framework. While they are great for those who use Machine\
    \ Learning for games, they are highly stabilized and make gaming harder because\
    \ they are known to frequently crash. Training deep nets is an issue as well because\
    \ it has been proven by the shattering of gradients paper that those that use\
    \ Machine Learning do not understand yet how to train their nets properly. That\
    \ also leads into the fact that no one quite understands what deep nets do in\
    \ general. There have been those that have written papers on what deep nets are\
    \ and why they are required, but then there have been those that have written\
    \ papers on how deep nets are not needed, and they tend to make life more complicated.\
    \ So, why are deep nets there? And do we actually need them? Lastly, there has\
    \ to be a way to get people to stop worrying so much about things such as Skynet\
    \ and the economic impact. First of all, Skynet is a fictional company in the\
    \ movie Terminator and is not going to happen. Before robots are able to make\
    \ their own decisions if ever, there will no doubt be a failsafe in place that\
