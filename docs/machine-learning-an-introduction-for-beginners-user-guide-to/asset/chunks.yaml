- raw: "Chapter 11: Neural Networks and Deep Learning Neural networks are programming\
    \ paradigms that are biologically inspired to enable a computer to learn from\
    \ data that is observed. Deep Learning is a set of techniques that you are going\
    \ to use for Neural Networks. Both Neural Networks and Deep Learning are going\
    \ to give you the best solution to any problem that you may come up against when\
    \ you are working with image, speech and natural language recognition and processing.\
    \ The human visual system is complex and one of the most interesting things that\
    \ you can study because you are never going to fully understand how it works with\
    \ the other parts of your body. Take handwriting, for instance, many people are\
    \ going to be able to look at something that is written and be able to tell you\
    \ what is written without any problem, but the little effort that it takes to\
    \ recognize what is written is actually deceptive. If you look at the different\
    \ hemispheres of your brain, you are going to realize that your visual cortex\
    \ has several millions of neurons that are going to be connected. However, your\
    \ vision is not going to be connected to your visual cortex. Instead, it is connected\
    \ by a series of cortices that involve your vision making it reach the location\
    \ where you can process even the most complex of images. Inside of your head is\
    \ essentially a supercomputer that has been fined tuned by evolution. The ability\
    \ to recognize handwriting is not always easy, but your brain has adapted to so\
    \ you can be able to do it unconsciously. It is not very often that we take the\
    \ time to think of how complex our visual system truly is. Just like how it is\
    \ difficult to recognize visual patterns, a computer is not going to have these\
    \ issues. But, it is going to be different than how we do it ourselves. Our brains\
    \ recognize shapes and how things are written out, but how do you tell a computer\
    \ this? You are trying to make rules, and those rules are going to end up getting\
    \ lost in the exceptions and caveats that you have to create. The Neural Network\
    \ approach is going to look at the problem in a different way though. It is going\
    \ to take a large number of digits that are handwritten and be trained to recognize\
    \ the various shapes so that it is able to do what our brain can do. Essentially,\
    \ the neural network is going to use the examples that are inside of your data\
    \ to infer rules that are set in place as their way to recognize handwritten digits.\
    \ The more examples you add that train the program, the more the network is going\
    \ to be able to learn handwriting options to improve its accuracy. Neural Networks\
    \ are going to work with an artificial neuron that is known as a perceptron which\
    \ was developed in the 60s by Frank Rosenblatt. But, when we look at it today,\
    \ it is going to be used like other models of artificial neurons. Your main neuron\
    \ is going to be known as the sigmoid neuron; but to understand the sigmoid neuron,\
    \ you have to understand the perceptrons. Perceptrons are going to take several\
    \ binary inputs and give you a single binary output. Rosenblatt came up with a\
    \ single rule that will be used when dealing with the output of perceptrons. This\
    \ is where weights came in as a way to express real numbers and their importance\
    \ to the inputs and outputs. The output for the neuron is going to either be zero\
    \ or one. It will determine the weight of the sum and if it is less than or greater\
    \ than the threshold value. Your threshold value is going to be a real number\
    \ that is going to be used in the parameters for the neuron. Think of the perceptron\
    \ as a device that is going to make its decisions by weighing the evidence. For\
    \ example, if you want to go on a family outing, there are several things that\
    \ you are going to have to look at to determine if you are going to be able to\
    \ go on the outing as planned. \n\n1.  Is the car big enough for everyone that\
    \ wants to go?\n\n2.  Is the weather going to be good?\n\n3.  What do you need\
    \ to pack for the amount of time that you are going to be out?"
