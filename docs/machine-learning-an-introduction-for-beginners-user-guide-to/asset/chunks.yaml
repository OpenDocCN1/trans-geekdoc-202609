    \ other Machine Learning frameworks to make a neural network that is faster and\
    \ easier to use. As you set up Keras, you will want to download the Anaconda distribution\
    \ that works with Python. If you have not used it before, then you will find that\
    \ it is fairly simple to use. After you've installed Anaconda, you will go to\
    \ the CD in the bin directory and run the following commands to make sure they\
    \ are working properly.  \n\n1. `pip install pandas`;  \n2. `pip install Tensorflow`;\
