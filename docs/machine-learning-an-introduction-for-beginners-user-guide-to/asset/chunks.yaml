    \ option to adjust how the image is laid out;  \n4. After this has been done,\
    \ you will fill out your figure;  \n5. The subplots need to be initialized, and\
    \ this can be done by adding each to their proper position on the grid;  \n6.\
    \ Now that the figure has been filled out, you can initialize the subplots;  \n\
    7. Every dot that is added will be displayed on the image on the grid just like\
    \ a colored map. The interpolation method will mean that the data you place on\
    \ the grid is interpolated so that it is not completely smooth;  \n8. The last\
    \ step is to add the text to your subplots; and  \n9. Finally, do not forget to\
    \ plot your points with the `plt.show()` function.  \n\nChapter 9: Keras and Machine\
