- fmt: "\nDuring the 2014 Presidential elections, a startling news item made the highlights\
    \ across various channels. It was reported that certain employees of Cambridge\
    \ Analytica collaborated with Facebook to gain access to the personal data of\
    \ millions of users. This was done in the hope of selling the psychological profiles\
    \ of the American voters to gain a political advantage. Donald Trump’s election\
    \ campaign officials were accused of misusing private data of the citizens. There\
    \ was an uproar, Facebook’s Mark Zuckerberg was ordered to testify—in short, a\
    \ lot of things happened. But, unfortunately, the masses tend to have a short-term\
    \ memory, and today this massive invasion of privacy just remains old news. \n\
    \nBut, we need to remember that: Abuse of power, like any other abuse, can happen\
    \ again if it has happened once. Facebook and most other social media platforms\
    \ have, time and again, shown that they function under the dictates of the unjust\
    \ ruling powers, and are just tools to carry out their agendas, be it hate speeches\
    \ or fake news. The same goes for most other media houses, too. This is why we\
    \ need social media, as well as media platforms, that are not serving the political\
    \ parties but the citizens. Only when we look up above the noise of these centralized\
    \ social media platforms will we be able to see that there are, in fact, many\
    \ decentralized apps out there that can serve us much better than the propaganda\
    \ machines we are exposed to today. \n\n## Steem\n\nSteem, in itself, is a blockchain\
    \ that supports applications like `Steemit` and `DTube`. `Steemit` is the decentralized\
    \ social media platform that rewards content creators by providing them with cryptocurrencies.\
    \ This incentivization model helps keep the blockchain running, with immutability\
    \ of the content as its foundation. The Steem blockchain supports a total of 324\
    \ apps, but `Steemit`, `Utopian`, and `DTube` remain the most popular. \n\nBoth\
    \ `Steemit` and `DTube` offer a series of news and videos based on your choice,\
    \ while also offering you a source of income in the form of cryptocurrencies by\
    \ contributing some form of written content. The decentralized nature of these\
    \ platforms allows them to be free from the political and censorship influences,\
    \ as well as the influences of the advertisers. `Utopian`, on the other hand,\
    \ is an open-source project where crypto-tokens can be earned by contributing\
    \ not content, but some kind of a fix on the open source project: like fixing\
    \ a bug, for instance. \n\n## Sapien\n\nWhile Steem was an early adopter, the\
    \ decentralized social media platform has only seen growth in the last few years.\
    \ It is obvious that the users are tired of the charades that the news channels\
    \ and the centralized social media platforms are playing with them. They want\
    \ a communication channel that's unscripted, uncensored, and just genuinely authentic.\
    \ `Sapien` is one such platform that fulfills all of these intellectual needs.\n\
    \nHere, users have full control over how much personal information they choose\
    \ to share, and with whom. The platform also curates the user experience based\
    \ on the user’s interest and preferences. Unlike the centralized social media,\
    \ here there are no restrictions on the content posted. For instance, towards\
    \ the end of the last year, Facebook all of sudden declared a ban on crypto ads,\
    \ but took an about turn on this after it faced a backlash from its users. It\
    \ is clear that these policy flip-flops are quite politically motivated, maybe\
    \ only to gauge how far they can go in curbing the freedoms and basic rights of\
    \ their users. The decentralized platforms are the only way to stop treating the\
    \ big players as if the free citizen is their personal pet parrot. \n\nThe `Sapien\
    \ Network` uses the age-old remedy for tackling information one doesn’t agree\
    \ with—it’s called choosing not to engage (after a point). The users can express\
    \ themselves to the absolute edge and no one can stop them. What you can do, as\
    \ a user, is to pick and choose what content you take in; if you feel offended\
    \ by something someone said, best not to watch it again, especially if you are\
    \ only going to end up abusing the person and take away the others’ right to expression.\
    \ It also has private and public mode features, which means that you can decide\
    \ if you want to stay anonymous on the platform or switch your original identity.\
    \ What’s attracting a significant number of people to this platform is the various\
    \ social media features like creating groups, texting, voice chatting, etc. which\
    \ are largely missing in `Steemit`.\n\n`Sapien` is still only in its fetal stage.\
    \ It’s built on the `Ethereum` blockchain and, with its token `SPN` backed by\
    \ `ERC20` and `Ethereum` token, it looks excitedly to the possibility of turning\
    \ into a marketplace soon. This will promote various other third-party applications\
    \ and, even, integrations within the network itself. \n\n## SoMee Social\n\n`SoMee\
    \ Social` is yet another Cardano gem. This is a blockchain-powered social media\
    \ platform primarily designed for privacy, user control, and monetization. This\
    \ was launched in 2017 and is currently putting up the third iteration of the\
    \ platform. They have also onboarding developers and marketers who have been involved\
    \ with much bigger projects like `Google` and `Zillow`, and are now doing this\
    \ to kickstart the decentralization.\n\n## Indorse\n\n`Indorse` can be thought\
    \ of as LinkedIn substitute for decentralization enthusiasts. It has been marketed\
    \ as a social network powered by blockchains, but for professionals. This has\
    \ a unique feature that allows other users to verify the personal skills listed\
    \ by user which essentially serves like testimonials. In return, the users are\
    \ incentivized by a certain share of profits going back to them. The idea is simple—if\
    \ you are claiming expertise in some area, then you have to attach proof of that\
    \ claim, too. A consensus then follows, deciding whether the claim is to be ‘endorsed’\
    \ or flagged. This platform has unlocked a unique way to weed fake claims without\
    \ curbing free speech. Though `Indorse` uses it specifically for professional\
    \ skills, this model might find its uses in avoiding propagation of inaccurate\
    \ information in the name of free speech.\n\nAs we come to the end of the disruptions\
    \ section, I would like to point out one very crucial aspect that almost gets\
    \ overlooked in the excitement of discussing blockchain applications. Let’s remember\
    \ that the strength of blockchains is immutability and, not necessarily, accuracy.\
    \ This means that, though the information that is entered into the system cannot\
    \ be manipulated, eventually the efficiency of the systems may be determined by\
    \ the information that goes into it, in the first place. So, if I, as a user,\
    \ enter forged data into the system, then the data entry will still be inaccurate\
    \ despite the immutability. This is the reason why blockchains, like any other\
    \ technology, are only as good as the people running them. And, that is why I\
    \ keep saying that more of the commonfolk need to participate in this, lest we\
    \ lose the control over data that gets solidified in blockchains for an eternity.\n"
