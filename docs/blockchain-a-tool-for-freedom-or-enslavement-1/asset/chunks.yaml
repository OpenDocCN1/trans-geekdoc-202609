  trans: '

    你经常会听到关于 AI 进展的各种乌托邦式描述。引领 AI 革命的公司首席执行官和创始人频繁出现在我们的手机屏幕、报纸和电视上，宣扬着不断演变的 AI 领域下未来将是多么美好。不用说，他们所描绘的美好未来并非没有限制。虽然这些公司可能将是最大的受益者（目前他们也是如此），但溢出到普通大众的利益范围预计将非常有限，特别是如果目前的权力趋势持续下去。显而易见，这些硅谷科技领袖已尽一切手段让权力集中在他们自己手中。这也不应意外，因为归结底，无论任何人说什么，这与其说是为了福利，不如说是为了大钱。


    埃隆·马斯克最近因收购 Twitter（以及其他事件）而闻名，一直是少数怀疑者之一。早在 Twitter 收购重振去中心化社交媒体讨论之前，马斯克就于 2015
    年创立了非营利研究公司 `OpenAI`，以确保先进的 AI 在进入大科技公司口袋之前造福全人类。在采访中被问及 AI 的未来时，马斯克完美地重申了阿克顿勋士的名言：“自由在于权力的分配，而专制在于权力的集中”（Elon
    Musk Viral Videos, 2018）。在这次采访中，他坦言了日益增长的担忧，即飞速发展的 AI 可能并不总是被用于善，特别是当这艘船的舵还掌握在少数权贵手中时。对于像马斯克这样处于技术变革中心的人来说，这些担忧可能正成为我们其他人的警示，再次提醒我们集权化的危险。在这些瞬息万变的情况下，想象一下区块链与
    `AGI` 的结合能产生什么。区块链可以成为 AI 领域快速蔓延的中心化毒液的去中心化解药。它可以从根本上完全根除隐私侵入问题，并给你带来兼者的利益——高效算法与加密且安全的个人数据。


    请注意，正如区块链可以改善参与者的机器学习体验，反之亦然。`AGI` 在区块链的去中心化中也发挥着巨大的作用。事实上，一种结合区块链与通用人工智能（`AGI`）的去中心化模型可以利用更广的资源视野来实现发展。它们都能帮助彼此在真正意义上达到最大潜力。


    正如 `Sophia` 的情况一样，机器学习需要大量以及更高质量的数据才能越来越准确地预测结果。区块链是这两者的绝佳来源。各已开始在许多领域利用这种结合。例如，在医疗保健领域，存储在区块链上的患者数据可以由人工智能模型进行分析，以揭示跨社区的模式，然后可以用于设计医疗保健政策，甚至更好地管理护理模式。简而言之，区块链上的去中心化人工智能是你无法再次忽视的趋势。`SingularityNET`
    就是这样一个区块链驱动的 AI 网络。甚至有关于该平台与 `Cardano` 建立伙伴关系的讨论，以提供基于 AI 的区块链解决方案来应对全球的相关挑战。故事的意义是，`AGI`
    和区块链是一个不可阻挡的组合，随着这两者的共同增长，会有更多的升级。


    ## 进入元宇宙


    如果你对技术哪怕有一点点兴趣，你最近很有可能听过这个术语：元宇宙。如果 Facebook 改名为“Meta”品牌暗示得不够明显，那么是时候你深挖一下了。这在未来几年中具有潜力将去中心化推向另一个水平。但在深入研究之前，提一句警告——元宇宙仍然是一个非常新的概念，现在就用绝对肯定的态度讨论它可能稍早了。但是，目前推测指向的内容确实有趣。


    如果你觉得元宇宙看起来像是一个带有科幻色彩的晦涩概念，那么你实际上抓住了重点。这个概念实际上来自尼尔·斯蒂芬森 1992 年的一部小说《雪崩客》（`Snow
    Crash`）。这确实证明了技术如何模糊虚构与现实之间的边界。当你玩在线多人游戏时，你已经在与你地理位置之外的人进行互动，通过你创建的各种化身。


    但请注意，游戏并不等于元宇宙；例如，`Fortnite` 有一个特定的游戏目标。还有你可以虚拟参加的演唱会和活动。虽然 `Fortnite` 展示了元宇宙的某些方面，但它本身并不是元宇宙，至少不是我们设想的那种。要被视为元宇宙，它的范围必须宽泛得多。


    就我们的目的而言，我们目光超越了元宇宙的娱乐和休闲方面。正如我们所预期的那样，区块链在元宇宙的某些方面被证明是特别方便的。


    *   **无尽的在线体验**：元宇宙将是持续且扩张的，就像我们生活的物理现实一样。这种体验将没有任何障碍，无论是个人还是职业，无论是私有还是公共。

    *   **多方利益相关者**：想象我们的物理世界属于一个人或一个实体。这似乎是个荒谬的想法，不是吗？我们生活在一个自由的世界，而元宇宙至少在理论上旨在复制这种自由，让多个贡献者共同创造一个自由移动的在线世界。

    *   **互操作经济**：这本质上意味着，尽管有各种贡献者聚集，元宇宙将具有无缝的互操作性，创建一个功能完备的经济，买家和卖家都在在线平台上。


    尽管元宇宙的细节目前很大程度上处于开发阶段，但我们知道的一点是，为了确保上述方面的顺畅运行，元宇宙将成为一个巨大的数据收集器，可能比我们今天看到的社交媒体还要大。社交媒体应用和游戏宇宙（如
    `Fortnite`）非常基础且特定平台，但元宇宙预计将全方位。想象你的现实生活转化为虚拟现实：一个你可以在其中工作、买卖并与各地的人社交的虚拟空间——这就是我们对元宇宙最接近描述。区块链可能是元宇宙急需的内在数据安全协议。


    此外，`NFTs` 或区块链的非同质化标记技术是区块链元宇宙的关键环节。想象你有两张 20 美元钞。如果我从你那里拿走它们并给你四张十元钞，你拥有的金额仍然相同。这意味着十元和二十元是同质的。然而，当两种商品具有无法精确比较的独特价值时，你就拥有了
    NFT。例如，如果我让你从家里挑选对你最有价值的东西，你可能会挑选朋友送给你的定制日记，而我可能会挑选我最喜欢的画作。这两种价值根本无法比较。在某些情况下，你们可能会对如何衡量这些价值达成共识。例如，我可以说我可以以某个成本出售这幅画，但这必须经过双方同意，并且并不是物体本身固有的。

