- fmt: "\nAs I discussed previously, most of the resistance to blockchains comes from\
    \ associating it with a certain political ideology. We need to remember that blockchain\
    \ is a technology, neither good nor bad. It’s how we use it that matters. If we\
    \ allow politically motivated people with destructive agendas to take over the\
    \ technology adoption, then it’s likely that it will be used against the interest\
    \ of the people. But, if you and I make sure that we participate and maintain\
    \ the sanctity of the democracy, then there’s every chance that you’ll get your\
    \ disenfranchised democratic voice right back. Your participation is your vote,\
    \ which will influence the direction of this technology. A gentle reminder of\
    \ Mike Maloney’s words with regards to this technology—it can “either enslave\
    \ us or free us.”\n\nWhat we have discussed, so far, is the current application\
    \ of blockchains to the voting systems. But, remember how, in the beginning of\
    \ the section, we spoke of eliminating the representatives altogether? Well, I\
    \ admit that is quite far out in the future; we are not there yet. But, I hope\
    \ you can appreciate the possibility of what the blockchains could mean for our\
    \ democracy. Blockchains could enforce what would be a “true democracy,” 100%\
    \ transparent in its workings, where you would be consulted before any policy\
    \ is adopted or before any legislation is passed. Your vote would carry a significance\
    \ like never before. Of course, to turn this into reality, a significant number\
    \ of legislations would have to be passed and, honestly, that could take years.\
    \ But, I mention this because that peaceful revolution has to begin somewhere—we\
    \ have the power to demand and, once it catches on, there’s nothing that can stop\
    \ it. I urge you to demand greater freedom, a more transparent system, and a blockchain-driven\
    \ future.\n\nWe have already looked at multiple blockchain projects running in\
    \ partnerships with the various governments. But, you’d be surprised to know there\
    \ are many more we haven’t touched upon yet. Apart from the big-impact projects\
    \ like land registry systems driven by blockchains and digital identity for citizens\
    \ that we have already discussed, there are also other projects that can be undertaken\
    \ in the public sector to engage with the citizens in a much more productive way.\
    \ The idea, though, is not to flood you with names of these projects. The idea\
    \ is to know that the systems around the world, and more importantly around you,\
    \ are changing—you can either be the effector of that change or a passive witness.\
    \ You can like them, or hate them, but you certainly cannot ignore them because\
    \ blockchains are here and they are here to stay. \n\n## Cardano’s Decentralized\
    \ Governance\n\nI’d like to present this as a case study in complete, transparent\
    \ democracy. Yes, I know what you are thinking—running a cryptocurrency community\
    \ and running the entire nation’s democracy are two very, very different things.\
    \ But, hear me out, because I truly believe this process is scalable and, if we\
    \ manage that, this could be one of the most significant achievements of modern\
    \ civilization.\n\nCardano never fails to impress me because of its decentralized\
    \ nature in all sectors, and also at all levels. I am fully aware that I come\
    \ across as a tad biased towards it (and maybe I am, just a tad). I would love\
    \ for you to soak yourself in as much blockchain information from around you as\
    \ you can, and you come up with a favorite platform of your own. Find out as much\
    \ as you can about all the platforms out there, and make your own decision as\
    \ to which one aligns with your values. I find that I am attracted towards this\
    \ blockchain platform solely because of the openness and participation they promote.\
    \ And, I think it doesn’t get better than a decentralization tool that itself\
    \ runs on decentralized methodology. But, please bear in mind that, even though\
    \ whatever I mention here are solid facts, they are not the only facts. Blockchains\
    \ are growing everyday, every moment; even as we speak, something new is coming\
    \ up on the blockchain terrain. And, I want you to experience the same joy that\
    \ I did, of finding more about all of the blockchain platforms out there that\
    \ are using the technology for social good, on your own. Don’t let your perception\
    \ be colored by my favorites. Because, the last thing I want is for this book\
    \ to lead you to a biased and closed view of blockchains.\n\nSo, let’s talk Cardano!\
    \ Till now, we have looked at Cardano’s projects where it is implementing the\
    \ principle of decentralization. Now, let’s take a look at how it runs its own\
    \ function on the same principle, too. As I mentioned, it is useful to look at\
    \ this process because it holds useful lessons for our democratic process, too.\
    \ It provides us with the proof that, if we can incentivize the citizens to play\
    \ an active role in the procedures while ensuring that the votes they cast matter\
    \ because they are recorded immutably, then true transparent democracy is actually\
    \ possible. In one of his routine YouTube videos `On Governance (Part I)`, this\
    \ process is explained succinctly by the Cardano founder (Hoskinson, 2020). \n\
    \nHoskinson identifies two parts to the governance problems: decision-making and\
    \ financial resources. What happens in a centralized environment is a central\
    \ authority, by default, takes care of these things without much deliberation.\
    \ That would be akin to an authoritarian dictatorship. But, more common than the\
    \ outright dictatorship, is the disguised democracy. As the famous quote in the\
    \ book Animal Farm goes, “All animals are equal but some animals are more equal\
    \ than others” (Orwell, 1945). Here, too, some voices carry greater weightage.\
    \ More often than not, this weightage is implicitly determined by the amount of\
    \ money each one brings into the functioning—the more the money, the bigger the\
    \ voice. \n\nCardano tackles this problem by creating a sort of an experimental\
    \ sandbox called `Voltaire`. This is essentially a bundle of protocols and experiments\
    \ for bringing about change and decision-making for spending the financial resources\
    \ in the Cardano (`ADA`) blockchain. This is designed to be as fair as possible\
    \ to the `ADA` holders, regardless of the number of tokens they hold. These experiments\
    \ utilize `Incentivized Testnet (ITN)` to test the validity of different methodologies\
    \ for a democratic voting. These are run parallel to the actual Cardano blockchain\
    \ on permissioned or permissionless side-chains, with the objective of testing\
    \ different methods over shorter periods of time. These simulations are based\
    \ on the data received from the Cardano blockchains. From this data, certain `ADA`\
    \ holders that are eligible to take part in the votes are chosen. The experiments\
    \ would keep running until a sort of a Beta program develops, building on the\
    \ most effective and standardized protocol.\n\nOnce the `ADA` voters are chosen,\
    \ the actual votes are held on the basic concerns we talked of: how to spend funds\
    \ and what changes to implement. The best way to start is with the former. The\
    \ latter, on the other hand, is slightly more complicated. This is simply because,\
    \ if there are any mistakes in spending funds, they are easier to rectify whereas,\
    \ if wrong changes are implemented, they might actually result in the collapse\
    \ of the system altogether.\n"
