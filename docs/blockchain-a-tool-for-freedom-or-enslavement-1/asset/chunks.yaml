    正如我之前讨论过的，对区块链的大多数阻力源于将其与某种政治意识形态联系起来。我们需要记住，区块链是一项技术，它本身无无坏。关键在于我们如何使用它。如果我们允许具有破坏性议程的受政治驱动的人员主导技术的采用，那么它很可能会被用来违背人民的利益。但是，如果你我确保参与并维护民主的神圣性，那么你完全有机会夺回你被剥夺的民主话语。你的参与就是你的投票，它将影响这项技术的发展方向。迈克·马洛尼（Mike
    Maloney）关于这项技术有一句温和的提醒——它可以“奴役我们，要么解放我们”。


    到到目前为止，我们讨论的是区块链在投票系统中的当前应用。但还记得在在本节的开头，我们谈论过完全消除代表制度吗？嗯，我承认那是非常遥远的未来；我们还没有到那一步。但是，我希望你能理解区块链对我们的民主可能意味着什么。区块链可以实现一种“真正的民主”，在运作上做到
    100% 透明，在任何政策被采纳或任何法律通过之前，都会征求你的意见。你的投票将具有前所未有的意义。当然，要将此变为现实，必须通过大量的法律，坦率地说，这可能需要多年时间。但我提到这一点，是因为这场和平革命必须从某处开始——我们有权要求，而且一旦它流行起来，没有任何能阻止它。我敦促你要求更大的自由、更透明的系统以及一个由区块链驱动的未来。


    我们已经查看了多个与各种政府合作运行的区块链项目。但，你会惊讶地发现，还有许多我们尚未触及的项目。除了我们已经讨论过的像区块链驱动的土地登记系统和公民数字身份等影响重大的项目外，公共部门还可以开展其他项目，以一种更具成效的方式与公民互动。然而，这个意图并不是让你淹没在这些项目的名称中。这个意图是让你知道世界各地的系统，更重要的是你周围的系统正在发生变化——你可以成为这种变化的执行者，也可以做一个被动的旁观者。你可以喜欢它们，也可以讨厌它们，但你绝不能忽视它们，因为区块链已经在这里，而且它们将长期存在。


    ## Cardano 的去中心化治理


    我想此作为一个完全、透明民主的案例研究。是的，我知道你在想什么——运营一个加密货币社区和运营整个国家的民主是两个非常、非常不同的事情。但请听我说，因为我真的相信这个过程是可扩展的，如果我们管理得当，这可能是现代文明最重成就之一。


    Cardano 因其在所有领域、所有层面的去中心化本质总是令我印象深刻。我完全意识到我表现得对它有一点偏见（也许我确实有一点，仅仅一点）。我希望你尽可能多地吸收周围的区块链信息，并选出一个你自己的喜爱的平台。尽可能地了解世界上所有的平台，并就哪一个符合你的价值观做出自己的决定。我发现我被这个区块链平台所吸引，仅仅是因为它们提倡的开放性和参与性。而且，没有比一个运行在去中心化方法论上的去中心化工具更棒的了。但请记住，尽管我在此处提及的任何内容都是坚实的事实，但它们并不是唯一的事实。区块链每天、每刻都在增长；即使在我们说话时，区块链领域也有新的事物正在出现。我希望你像我一样体验到同样的快乐，自己去发现更多利用该技术造福社会的各种区块链平台。不要让你的认知被我的喜好所影响。因为我最不想看到的是这本书让你对区块链产生偏见且封闭的观点。


    所以，让我们谈谈 Cardano 吧！到目前为止，我们查看了 Cardano 实现去中心化原则的项目。现在，让我们看看如何如何同样的原则运行其自身的功能。正如我提到的，观察这个过程是有用的，因为它对我们的民主进程也有有益的启示。它为我们提供了证明：如果我们激励公民在程序中发挥积极作用，同时确保他们投出的票因为被不可篡改地记录而变得，那么真正的透明民主实际上是可能的。在他的一个常规
    YouTube 视频 `On Governance (Part I)` 中，Cardano 创始人（Hoskinson, 2020）简洁地解释了这个过程。


    Hoskinson 指出治理问题包含两个部分：决策制定和财务资源。在中心化环境中发生的情况是，中央权威默认在没有太多深思的情况下处理这些事情。那类似于专权制独裁。但比公开的独裁更常见的是伪装的民主。正如《动物农场》中的名言所说：“所有动物都是平等的，但某些动物比其他动物更平等”（Orwell,
    1945）。在这里，某些声音也带有更大的权重。通常情况下，这种权重是由每个人为运行投入的资金量含蓄地决定的——钱越多，声音就越大。


    Cardano 通过创建一个名为 `Voltaire` 的实验沙盒来解决这个问题。这本质上是一组协议和实验，用于对 Cardano (`ADA`) 区块链的财务资源开支做出变革和决策。它的设计目标是对
    `ADA` 持有者尽可能公平，无论他们持有多少代币。这些实验利用 `Incentivized Testnet (ITN)` 来测试民主投票方法的有效性。这些实验与真实的
    Cardano 区块链并行在许可或无许可的侧链上运行，目标是在较短的时间内测试不同的方法。这些模拟基于从 Cardano 区链接收的数据。根据这些数据，选择有权参与投票的
    `ADA` 持有者。实验将持续运行，直到开发出某种 Beta 程序，建立在最有效且标准的协议之上。


    一旦选择了 `ADA` 投票者，就会对我们过的基本问题进行实际投票：如何支出资金以及实施哪些变化。最好的方式是从前者开始。后者稍微复杂一些。这仅仅是因为如果支出资金出现任何错误，更容易纠正；而如果实施了错误的变化，可能会导致整个系统的崩溃。


