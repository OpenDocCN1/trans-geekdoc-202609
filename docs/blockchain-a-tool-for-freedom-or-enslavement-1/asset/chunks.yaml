    但是，尽管存在缺点，公共区块链在为世界上某些被视为特别落后的地区带来变化方面展现了巨大的潜力。Cardano 公共区块链就是此类区块链的一个例子。它是完全去中心化且完全开源的。该区块链甚至尝试通过实现
    `Ouroboros` 共识机制协议来绕过资源密集型任务。它属于权益证明（proof of stake）共识家族，并有效地解决了验证交易时需要不断增加能量的问题——至少在很大程度上是如此，如果不是完全解决的话。这种节能协议使其非常适合在非洲某些地区构建基于区块链的和经济。


    Cardano 利用了被称为质押池运营者（SPOs）的角色。这些人是被信任建立和运行质押池的人。在 Cardano 区块链上，`ADA` 是一种数字货币，类似于
    Cardano 区块链中的权益。质押池是 Cardano 区块链上的节点，存储各种用户的质押。作为回报，质押池运营者是受托维护这些质押池的个人，他们通过拥有或租赁服务器来实现这一点。这非常像把钱存入银行并获得一些利息。当你持有
    Cardano 的权益时，可以获得大约百分之五的回报，这些回报会在用户和运营者之间分配。更有趣的是，这些质押池许多是使命驱动的，这意味着部分回报也用于慈善事业。以
    `BIO` 池为例——这是一个 `ADA` 持有者组成的社区，他们利用池收入用于全球环境和物种保护计划。那些将 `ADA` 委托给该组织的人还可以投票决定他们希望看到执行的项目。因此，即使是环保也是以民主的方式进行的。另一个例子是
    `SHIFT` 池，它也致力于类似的事业。`Stop Monkey Shocks` 是另一个使命驱动的池，旨在停止由于道路上的电线导致猴子被触电的情况。原因可能不同，但技术支持的这种善意正在通过一个一个项目地改变现状。如果这都不算回馈，我不知道什么才。


    但，请记住，Cardano 并不是唯一这样做此事的公共区块链。我想到的其他例子还有 `Algorand` 和 `Harmony` 区块链。我确定，越来越多的此类区块链需要大众的鼓励和支持，而且在我们说话时，它们确实正在出现。


    ## 私有区块链


    私有区块链顾如其名，只允许某些授权个人访问区块链。这可能更适合私营企业。只有通过有效的邀请才能获得访问，并且允许访问的成员需要经过区块链运营者的批准。这种批准理想情况下通过严格遵守关于个人背景的一些预设标准来进行。即使是区块链中的成员也可能有不同的权利和特权。因此，一个人可能拥有不受限制的完全访问，而另一个人可能不能。私有区块链与公共区块链显著区别的另一个办法是，后者允许交易完全匿名，而前者不允许。


    私有区块链相比公共区块链具有的一个大优势是交易速度。由于私有区块链上的参与者数量非常有限，达成共识快得多。然而，正如你可能猜到的，私有区块链在真正意义上并不是去中心化的，它们只是利用分布式账本在多个节点中保留数据的副本。`Hyperledger`
    和 `Ripple` (`XRP`）是私有区块链最常见的例子。


    从实现的角度看这些内容，很清楚，私有区块链不能用于广泛的社区项目，而仅适用于寻找更好数据组织方法的业务机构。但即便如此，用户也必须保持警惕，因为人数较少提供了更好的交易速度，但也使得这些区块链非常容易受到外部恶意元素的攻击。交易的信任也可能是另一个问题，即节点的信誉及其对交易的验证可能存在模糊性。


    ## 联盟链区块链


    私有业务用户可能有的另一种选择是试图将公共区块链的优点（至少是部分）引入私有许可链区块链的区块链。联盟链区块链与私有区块链非常相似，但有一个主要区别。在此类区块链中，参与者不仅属于一个组织（如私有区块链的情况），网络上的参与者可能来自多个组织。这使得黑入数据库变得困难得多。由于多个参与者的存在，它们还提供了稍高的去中心化水平。


    ## 混合区块链


    这些为许可链区块链增加了另一层复杂性。尽管它们在某种程度上是私有的，但在必要时，可以通过 `smart contracts` 将这些区块链上的记录提供给第三方。混合区块链的一个例子是
    `Disney` 发布的 `Dragonchain`。是的，你读得没错。`Disney` 在 2016 年 10 月发布了这个开源平台（`Knowles`,
    2017）。这应该告诉你区块链是多么普遍——准确说，它们已经存在很久了。尽管，现在是一个转折点，这项技术不仅被用于管理业务，还用于转型社区。


    这里另一个非常酷的特性是，尽管这些区块链可能由私有实体拥有，但它们无法更改数据，不像私有链和联盟链那样网络运营者有权覆盖交易数据。授予成员的访问也是平等且完整的，且对某些选定成员没有限制。即使是此区块链上的用户身份也保持安全，直到他们参与交易，在这种情况下身份必须揭露。在很大程度上，混合区块链可以被认为为私有区块链结构带来了网络完整性、透明度和安全性。

