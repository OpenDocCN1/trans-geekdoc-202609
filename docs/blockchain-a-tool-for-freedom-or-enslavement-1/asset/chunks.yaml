    \ from reaching their full potential. For instance, the number of transactions\
    \ that Bitcoin can handle per second are significantly lower than those handled\
    \ by its counterpart: VISA. A technique known as sharding is often used to work\
    \ around this issue. So, the bigger blockchain is essentially broken down into\
    \ smaller chunks, known as shards. These shards can then be processed by multiple\
    \ nodes at the same time. Though this may seem like a brilliantly simple solution,\
    \ the truth is incorporating such shards into the blockchain architecture is a\
    \ complex task. This is why other forms of blockchains may be preferred at times,\
    \ even though public blockchain platforms offer the highest decentralization possible. "
