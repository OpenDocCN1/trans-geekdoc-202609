    你不必成为环保主义者也能知道我们的地球正处于深层危机之中。随着填埋场比以往任何时候都要高，全球范围内的废物管理工作似乎正努力追赶日益增长的垃圾山。随着人口的增长和商业消费主义的抬头，废物也随之增加，尤其是不环保的废物。加拿大安大略省最近有报告称，其垃圾处理空间即将耗尽。随着这些固态、液和气态形式的废物不断堆积，人类健康日益受到威胁。废物管理不当的问题已有大量记载，特别是在发展中国家，导致了呼吸系统问题、皮肤感染，甚至是产前和产后缺陷等严重的健康问题。除了腐败之外，发展中国家这种管理不当的首要原因是，废物管理在其物流链中包含多个变动的环节。


    你是否曾好奇过从你家路边收集的垃圾去向了何方？简单且可能没那么可怕的答案是它们被送往了填埋场。但除此之外，由于垃圾类型多样、涉及的众多收集和处理中心，以及许多在大规模上难以追踪的动态因素，追踪这些垃圾的移动轨迹可能非常困难。区块链在这方面已被证明极其成功。


    阿根廷尽管是一个发展中国家，但已被证明是将其垃圾纳入区块链的极佳典范。该政府与企业家伊万·祖比莱维奇（Ivan Zubilewicz）合作，实施了一项使用祖比莱维奇创建的加密货币
    `JellyCoin` 的废物收集奖励计划。这种加密货币授予所有参与废物管理过程的人。任何想要参与的人只需登录应用程序并注册为垃圾的生产者、收集者或处理器即可。每类人员都会因遵循正确的废物分类而获得奖励。这些不同的参与者彼此相互联系，确保了可追溯性以及由此产生的问责制得以实施，以改进流程。收集者甚至根据他们收集垃圾的距离获得奖励。总的来说，整个过程变成了基于激励，从而使人们在工作中更加积极。这种加密货币随后可以在主流市场上购买他们想要的任何物品，因为它在阿根廷经济中被广泛接受。这真是一种在不需要联邦政府的情况下解决古老问题的绝妙方法！


    另一个类似的试点项目正推动印度孟加罗尔的社区努力，以建立更好的废物处理系统。区块链提供了一种万无一失的方法，确保垃圾收集过程中的任何问题都不会被忽视。如果垃圾收集被忽视，公民可以去注册投诉。在引入区块链元素之前，政府使用一种地理标记系统，收集者会拍摄一张带有时间戳的清理现场照片并上传。但问题在于，这项技术存在漏洞，允许人们对过去的数据条目和时间戳进行篡改。将这项技术与区块链结合引入了急需的复杂化水平，同时保留了所有利益相关者可查看的数据。这种透明度确保了问责制，并让正在工作的人和未工作的人都有了清晰的了解。


    `RecycleGO` 是一个位于纽约的项目，它使用 `QR` 扫描仪扫描塑料瓶，增加了塑料废物管理的可追溯性。他们还在尼日利亚的拉各斯有一个分部门，计划使用区块链将整个过程置于区块链上，从而将他们的塑料回收提升到一个新高度。


    我们在这里讨论的所有项目都在所谓的世界上发展中地区运行。我强调这一点是因为，通常我们有一种偏颇的认知，认为发展世界并不像其其他对等国家那样精通技术。但是，我们在这一节中看到的，以及我们迄为止讨论的内容，完全反驳了这一观点。这些国家可能找不到财政资源，但也许正是这种匮乏激励了他们更经济、更高效地利用资源。而且，区块链让我兴奋的原因是它们似乎是这种资源利用的完美工具。


    # 第 7 章：发展中经济体的案例


    遗憾的是，发展中经济体一直是获得先进技术所能提供的任何利益的最后获得者。功能失调的层级结构往往是这些群体处于劣势的原因。但是，正如我们在文中多次证实的，尽管区块链在这些地区令人兴奋，但它仍处于婴儿阶段。尽管如此，今天我们有足够的证明这种技术是有效的，特别是在那些最意想不到成功的地方。


    ## 数字金融基础设施


    区块链上的数字货币受到了人们的广泛接受。这并不令人意外，考虑到我们之前讨论过非洲对移动货币应用的热衷。你可能会惊讶地发现，全球大多数移动货币运营商运行在撒哈拉以南非洲。当全世界都在为加密货币的可行性担忧时，非洲人似乎对交易`比特币`等货币感到非常自在。这种舒适度从加密市场价值的蓬勃增长方式中显而可见。这当然是因为作为传统银行形式的替代方案要困难得多，且无法与之竞争。尽管如此，我们我们将在银行章节中更具功能地讨论这些；但现在，让我们看看非洲具体发生了什么。


    尽管有如此，在 2020 年，`PositiveBlockchain.io`的一项调查确定了 69 个在非洲利用区块链实现社会公益的项目（`Smart Africa`,
    2020）。请记住，当我们谈论社会公益时，这些项目并不一定是非营利的。事实上，大多数是营利性初创公司。这并不是坏事，因为这意味着人们和组织开始将区块链视为可以产生收入的自足平台，而不依赖特定实体的捐赠和慈善。根据上述报告，这些项目中的
    57% 是从非洲本土总部运营的。然而，这些区块链倡议的传播在整个大陆并不均匀，肯尼亚、南非和尼日利亚是长期关注的焦点。尽管如此，毫无疑问，一个充满活力的区块链生态系统已经在大陆出现，并正朝着持久的繁盛发展。


