  trans: '

    尽管 2021 年通常被誉为安全代币年，但关重要的是，在开放金融解决方案中，区块链更有可能是许可链。因此，数据在公共领域从未真正是完全透明的。此外，中央银行仍然掌握着你的资金，这些资金仍然受中心化法律限制的监管。但是，无论如何，这似乎仍然是增加人们对数字货币接受度的一小步，并且确实在整个经济界得到了广泛接受。


    在指出了区块链带来的金融发展之后，也有必要给出一个警告。不要被这些进步带来的虚假安全感所误导，尤其是像已经引起了一段时间新闻关注的央行数字货币（CBDC）。这无非是传统银行试图转型到区块链空间的一种。它们完全破坏了区块链的初衷——即区块链本应该是去中心化的，而仅仅是运行在区块链上的法定货币。这可能被认为是披着区块链华丽外衣的、旧而危险的中心化货币系统。


    另一方面，去中心化金融（DeFi）正是我们一直以来讨论的内容。它消除了所有中间商，是区块链按照最初意图的真实应用。尽管越来越多的国家对加密货币敞开了双臂，但在大多数国家仍然存在监管障碍。萨尔瓦多成为第一个宣布将
    `Bitcoin` 为国家货币的国家，现在已与 `DeFi` 贷款平台 `Acumen` 合作，帮助小微企业家获得由比特币支持的贷款。


    ## 股票交易


    在金融领域，股票交易可能是区块链最稳健的应用。2019 年，全球股市价值为 77.6 万亿美元（Daley, 2019），到 2021 年增加到 95 万亿美元（Mitova,
    2021）。由于股票交易每日交易价值的增长速度极快，投入最新且最有效的技术来记录这些交易变得至关重要。对于许多人来说，显而易见的选择是区块链。这包括大鱼 `NASDAQ`，它已经启动了各种基于区块链的指数。这些指数随后被用于跟踪公司的表现。


    股票市场与区块链完美契合，主要是因为涉及多个中间商和监管协议的繁琐程序。无论是加密货币交易的潜力，还是`smart contracts` 在股票交易中的巨大效用，区块链都在以其正确的原因吸引着交易公司。许多公司已加入竞争，且新的进入者频繁出现。像
    `ShapeShift`、`Circle`、`Coinbase`、`Blockstream` 等公司都在利用区块链基础设施进行加密资产交易。


    这些区块链基础设施在很大程度上实现了系统自动化，使其变得高效得多。然而，在交易场景中，区块链的应用似乎比仅仅结算股票交易要广泛得多。它是帮助公司跟踪系统性风险、证券贷款、资产管理等的主要力量。筹资活动也变得更容易跟踪了。但最重要的是，从消费者的角度来看，交易成本可以大幅降低，让个人从获利的交易中获得更多资金。虽然在所有情况下可能无法实现，但同样在没有重大监管变化的情况下，中间商仍然可以被取代（至少在某些情况下），帮助个人获得更快的结算。


    ## 贷与信贷


    正如我们在非洲区块链运动中所看到的，由区块链驱动的贷款和信贷解决方案构成了银行业领域区块链颠覆的重要组成部分。当穆哈默德·尤努斯博士在 2006 年因帮助贫民获得小额贷款获得诺贝尔和平奖时，金融世界发生了某种变化。微型金融变成了一种运动，机构纷纷出来帮助以前既无法申请金融援助，也没有机会梦想和抱负的低收入个人。


    银行和金融机构对为低收入个人提供资金犹豫不决，因为获取此类客户的成本远高于他们获得的贷款金额。银行可用的数据也少得多，无法确定低收入个人的还款能力，因为他们可能从未对任何商品进行过定期付款。


    正如我们所知，区块链消除了中间商，这是降低成本的一个大因素。另一个大大降低成本的方面是整个过程的效率。由于客户的个人记录、信用评分（如果有）以及任何其他文件都存储在网上，这些信息丢失或损坏的概率几乎为零。此外，由于
    `smart contracts` 可以使过程尽可能顺畅，避免了验证和发放贷款所需的人员成本。此外，区块链还可以影响抵押贷款的处理，帮助相关方获得更快的结算和更少的麻烦。记录的交易的不可篡改性使其对房主来说更有价值。现在，你会发现在抵押贷款方面，区块链还不是标准做法。但它们正在受到关注，像
    `Synechron` 这样的区块链加速器已经在改进用户体验以及抵押贷款流程的速度了。


    ## 贸易融资


    国际贸易市场价值数万亿美元，贸易融资已成为区块链复兴的关键领域之一。在一个如此庞大的行业中，该行业的欺诈行为也在上升并不意外，特别是在应收账款方面。伪应收账款损害了像
    `Citigroup` 这样的大集团的声誉。无论是重复融资（银行被误导对同一笔贸易应收账款提供融资），还是从一开始就是假账，贸易融资欺诈都导致了数十亿美元的诉讼和风险。许多参与此类欺诈行为的工业家可能会告诉自己这种欺诈是没有受害者的犯罪，但事实是这些欺诈并不是银行与高层之间的私人交易。数百万人的生活，包括员工以及受公司和银行服务影响的人，都面临着风险。


    `IBM`、`Deloitte` 等其他许多主要行业正是因为这个原因将他们的融资转移到了区块链。

    '
- fmt: "\nThis may seem like it’s only for a corporate advantage, with not much in\
    \ it for the common folks. This is only partially true. People like you and I\
    \ may not be directly impacted by this, but let’s face it: Trade impacts everyone,\
    \ even when you are not a consumer of the specific products being traded. It is\
    \ the backbone of our economies. Fraudulent trade practices are more often than\
    \ not promoted by a festering culture of corruption that certainly impacts every\
    \ citizen. If trade begins to collapse, there’s no saying what’s on the list next.\
    \ \n\n## Insurance\nThe major problem with the present centralized insurance system\
    \ is, to a large extent, the costs that it incurs, trying to verify claims and\
    \ detect frauds, if any. The cumbersome process of product development, administration,\
    \ documentation, claim verification, and multiple other protocols take up a lot\
    \ of time. While this doesn’t make much difference for the bigger players, the\
    \ smaller ones are likely to feel quite trapped in a system like this—on the one\
    \ hand, the premiums might be too high to pay, but leaving themselves and their\
    \ families exposed to catastrophe may seem even scarier. \n\nThis is where the\
    \ concept of microinsurance comes in. Very similar to the microfinancing concept,\
    \ microinsurance is to provide protection to those that might not be able to afford\
    \ too many high-end insurance products. This is being successfully run in Kenya\
    \ by ACRE Africa with small farmers. When reaching out to an underprivileged population,\
    \ it is essential that the insurance company tries to understand the problems\
    \ at the grass root level. ACRE Africa, for example, has identified some major\
    \ problem areas with the traditional insurance systems that keep the farmers away.\
    \ \n\nApart from affordability, these farmers seem to be skeptical about the fact\
    \ that the premiums they pay will actually come back to them in the form of claim\
    \ settlement. The issue of eroding trust in the traditional systems raises its\
    \ ugly head again. An associated factor of lack of transparency also comes into\
    \ play here, only worsened by the lengthy timelines leading up to the settlements.\
    \ Blockchain-driven ACRE Africa is changing all of that by bringing trustless\
    \ trust back into the system. Also, the entire process, that took tons of resources\
    \ and money previously, can happen in one go over the blockchain system. This\
    \ leads to a steep drop in the costs to the company, as well as the farmer. \n\
    \nAnother aspect might be the centralized systems often have rigid data points,\
    \ and if the situation of the insured veers even slightly from the standard, disbursement\
    \ of funds might get stuck in the loop. To understand this point, consider a farmer\
    \ whose crop has been destroyed by a locust attack. In a centralized insurance\
    \ system, the claims are likely to be settled on the basis of the region's circumstance.\
    \ If the other farms in the region were not destroyed, the insurance company may\
    \ decide that the farmer doesn’t qualify for a settlement. \n\nIf the same were\
    \ to happen in a blockchain-based insurance company, the claims would be disbursed\
    \ with the help of smart contracts, which have a provision to consider flexible\
    \ data points. Thus, the claim verification would be based on the data taken from\
    \ the installed sensors that trigger the smart contract and release funds automatically,\
    \ in real time. So, a locust attack would be picked up by the sensors immediately,\
    \ leaving the tedious due diligence procedures almost redundant. The timeline\
    \ is now reduced from an average of three weeks to receiving settlements on the\
    \ very same day. \n\nYet another use case for blockchained insurance would be\
    \ in relation to the healthcare that we’ll discuss in the next section. For now,\
    \ it is important to remember that a digitally inclusive system that has the individual’s\
    \ health records and history in one place, makes it much easier and cost efficient\
    \ for an insurance company to verify claims. Since the evidence is in digital\
    \ form, it is much more convenient to incorporate it in the underwriting process\
    \ for claim settlement. \n\nApart from microinsurance and health insurance, the\
    \ industry at large also presents us with several sub-sectors that might be ripe\
    \ for a blockchain disruption: high-value items registries, anti-money laundering\
    \ protocols, know-your-customer (KYC) procedures, reinsurance, claims handling,\
    \ reinsurance—again, the possibilities are endless. \n\nBefore we wrap up the\
    \ section on banking and financial sectors, there’s one aspect I’d like to emphasize\
    \ here. We might think that some of what we discuss in the banking section has\
    \ to do with only the big companies—especially stock trading or trading finance—but,\
    \ we need to learn to look at these as part of the big picture. As we discussed\
    \ in the Austrian economics section, looking at these aspects as isolated instances\
    \ will only lead to a narrow, tunnel vision. As goes the wise phrase: The whole\
    \ is often more than the sum of its parts. And, all of the parts we have discussed\
    \ up until now, and the ones coming after, some of what we discuss in the banking\
    \ section has to do with only the big companies—especially stock trading or trading\
    \ finance—but, we need to learn to look at these as part of the big picture. As\
    \ we discussed in the Austrian economics section, looking at these aspects as\
    \ isolated instances will only lead to a narrow, tunnel vision. As goes the wise\
    \ phrase: The whole is often more than the sum of its parts. Financial sector\
    \ still remains the most widespread area of disruptions by the blockchains, and\
    \ rightly so. Authoritarian and power-hungry institutes have always used the gullibility\
    \ of the masses to force down unjust regulatory practices. The financial insecurities\
    \ of these people have led them to often buckle under the pressure. But now, it’s\
    \ time to make them accountable—it’s time we draw a line in the sand and refuse\
    \ to be pushed around. \n\n# Healthcare\nWe have already seen the kind of impact\
    \ that blockchains have on healthcare, in the chapter on Africa. The simple fact\
    \ that the patient’s records are securely recorded in one place for the authorized\
    \ doctors to access, in itself, can be life-saving. Add to this more aspects like\
    \ eradication of the counterfeit drug trade, and we have a truly life-changing\
    \ combination of healthcare and blockchains.\n\nEven within the healthcare industry,\
    \ multiple sectors can be identified where the actors have realized the potential\
    \ that blockchains can bring to the table. Having said that, though, there is\
    \ also a distinct resistance to the change in systems on the part of healthcare\
    \ professionals. While tablets and computers are the medium of entering patient\
    \ data in the system for modern facilities, not many would fall under this category.\
    \ There is still a particular distrust about the electronic data being susceptible\
    \ to hacking attacks. This fear is, of course, not completely unfounded, and transferring\
    \ the systems onto blockchains can satisfactorily rule out this concern. Rather\
    \ than a technological concern, this falls more under an awareness problem.\n"
  raw: "This may seem like it’s only for a corporate advantage, with not much in it\
    \ for the common folks. This is only partially true. People like you and I may\
    \ not be directly impacted by this, but let’s face it: Trade impacts everyone,\
    \ even when you are not a consumer of the specific products being traded. It is\
    \ the backbone of our economies. Fraudulent trade practices are more often than\
    \ not promoted by a festering culture of corruption that certainly impacts every\
    \ citizen. If trade begins to collapse, there’s no saying what’s on the list next.\
    \ \n\n## Insurance\n\nThe major problem with the present centralized insurance\
    \ system is, to a large extent, the costs that it incurs, trying to verify claims\
    \ and detect frauds, if any. The cumbersome process of product development, administration,\
    \ documentation, claim verification, and multiple other protocols take up a lot\
    \ of time. While this doesn’t make much difference for the bigger players, the\
    \ smaller ones are likely to feel quite trapped in a system like this—on the one\
    \ hand, the premiums might be too high to pay, but leaving themselves and their\
    \ families exposed to catastrophe may seem even scarier. \n\nThis is where the\
    \ concept of microinsurance comes in. Very similar to the microfinancing concept,\
    \ microinsurance is to provide protection to those that might not be able to afford\
    \ too many high-end insurance products. This is being successfully run in Kenya\
    \ by ACRE Africa with small farmers. When reaching out to an underprivileged population,\
    \ it is essential that the insurance company tries to understand the problems\
    \ at the grass root level. ACRE Africa, for example, has identified some major\
    \ problem areas with the traditional insurance systems that keep the farmers away.\
    \ \n\nApart from affordability, these farmers seem to be skeptical about the fact\
