    然而，我朋友的噩梦还没有结束。当他们到达边境时，必须更换车辆，我的朋友必须乘坐一辆送他去肯尼亚目的地的新车。现在，我的朋友很幸运遇到了一位友好的司机，他已经安排好了另一辆车，但交易仍然进行。于是，车在那里，我的朋友和司机在街中间讨价还。我的朋友清楚地感觉到口袋里那叠现金变得越来越沉重。我的朋友无办法验证这位司机的身份或记录，但他也没有其他选择。在这种情况下，区块链难道不是提供了一种更安全、也更优雅的备选方案吗？


    请理解，这些并不是游客的问题，而是公民们往往会面临的问题。区块链可以帮助那些在传统系统中从未获得应得关注的人们，创造一个更好、更具关怀的世界。这就是为什么我说这项技术可能会改变世界，对第三世界国家来说更是如此。这不是炒作，而是赤裸裸的现实。越来越多的组织加入了区块链的行列车，仅仅是因为他们意识到这项技术此时此刻所创造的影响。World
    Mobile 是首个基于区块链的移动网络，它在整个非洲出色地执行着其“连接未连接者”的格号。我们将在后面的章节中详细讨论这一点。人类正处于一场和平、非暴力的技术叛变的边缘。你应该了解区块链是如何为你以及你周围的人改变世界的。


    ## 本书概述


    市面上有很多书籍可以为你介绍区块链的基础知识和技术本身。但我相信，这项技术为像你我这样的普通人在最基层所能带来的变化，才是这项技术的黄金核心所在。一旦你跨越了技术上的障碍，你就会意识到这项技术对日常生活各个方面所能产生的惊人影响。


    本书深入探讨了你关于区块链所需要的所有知识——包括理论和实践。我们谈论了奥地利经济学和自由意志主义的概念如何相互融合，以实现其他经济系统迄为止仅梦寐以求的事业。但它也超越了财务理论和细节，带你开启一段旅程，向你展示区块链如何影响你的生活。在本书书中，我还特别关注了区块链在解决发展中国家问题方面具有的巨大意义，这不仅涉及财务问题，还涉及宏观的人道主义问题。


    你会在全文发现一个贯穿的主题是去中心化。截至目前，区块链技术似乎正危险地徘徊在中心化与去中心化的争论边缘。我们的无知很容易让它演变成下一个大中心化技术，而更多的中心化无疑不是我们目前所需要的。在这个被四面八方信息轰炸的时代，只要事物还在运转，人们很容易不去注意它们是如何运作的。如果我们对区块链采取同样的态度，我们将错过这一代人拥过的最大的技术机会之一。所以，当你阅读这一章时，我敦促你体会它对你、对你周围的人以及生活在地球另一端的人的影响。


    在开始之前，有一点需要注意——随着你阅读的深入，你会发现我谈论加密货币并没有我强调区块链的那么多。当然，书中有一个专门介绍加密货币的章节，它们在我们的讨论中随处可见；但如果你想获得更多关于它的知识，你就必须探索更多的来源。本书的设计初衷是致力于区块链本身的深远潜力。这是一个有意识的选择，因为我觉得关于加密货币的已经已经很多了，但关于其背后的技术，说得还不多。我相信，这项技术比加密货币更掌握着未来的钥匙。


    本书的核心在于一种理解：去中心化是全人类的转折点；随着区块链的出现，我们人类终于有力量引导系统走向为所有利益相关者带来和平、繁荣和平等的方向。


    序言说够了，我们开始深入吧？！


    # 第一部分：区块链基础


    在这一部分，我们讨论了构成区块链技术的技术和功能概念。我特意在深入探讨技术的意义之前从这一章开始。本节旨在向你（读者）介绍这项技术，其方式既不会让你感到目不暇接，又以足够的深度涵盖了最关键的概念。这些基础知识对于理解理论的现实应用至关重要，并将帮助你欣赏区块链运动真正的独特之处。


    # 第 1 章：小白区块链指南


    现在我们已经回顾了区块链技术的基本原理，是时候深入挖掘技术本身的细节了。但毫无疑问，无论我们在这里尝试描述技术方面时显得多么简单，区块链的实际运作都是一个复杂的过程。但是，请等一下：在你默默地跳过技术细节章节之前，让我给你讲一个故事。这是一个真实的故事，我敦促你密切关注，并思考这听起来是否熟悉。


    就在大约年前的一个晴朗日子，我正在银行处理一个账户问题并和一位老朋友聊天，无意中听到一个年轻人对他向印度家人的汇款耗费太长而感到非常焦躁。他的家人似乎急需用钱，而汇款似乎花了好几个世纪。我们开始交谈，他提到他对这些问题以及高昂的手费也厌透了。我告诉他一种特定的点对借贷服务，名为
    `Kiva`，它收取高额费用，但可以实现快速汇款的目的。他提到他付不起高额，而且他的选择有限。


    作为一个彻头彻尾的区块链支持者，我也问他是否考虑过加密货币，甚至通过区块链进行点对借贷作为交换手段。我们稍后会详细讨论这些，但目前为止，可以说他对听到这个建议时显得非常惊讶，甚至可以说是震惊。之后对话的转折让我意识到，在加密货币和泛指区块链的情况下，无知是太常见了。那个年轻人认为整个技术是一个骗局，他说他宁愿向“可靠”的来源支付不断增加的费用，也不愿成为网络诈骗的受害者。

