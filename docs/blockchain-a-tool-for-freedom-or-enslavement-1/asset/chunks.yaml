  trans: '


    2018 年，一个名为`非洲大陆自由贸易区 (AfCFTA)`的自由贸易区宣告成立，其实际贸易于 2021 年 1 月正式启动。这是一项宏大工程，被认为是全球连接多个国家、数十亿人的规模最大的自由贸易区。自由贸易区仅意味着该地区达成了一项协议，在贸易方面允许最少量的政策限制，从而有助于促进经济增长。这里可以观察到一个有趣的现象——尽管发达国家近期转向通过基于治理的解决方案来解决其社会经济问题，但发展中国家似乎正在利用贸易的资本主义原则来解决他们的问题。


    尽管这令人振奋，但道路上仍有重重障碍。获取贸易文件的处理权限就是其中之一。贸易文件可能包括几项关键内容：如证书、保险单等。这些文件必须准备得完美无缺，而且在跨国贸易时更是如此。另一个位居名单前列的问题是跨国货币兑换，这将导致成本堆积并延长结算时间。区块链被认为是解决这些问题的最合适平台。


    尽管 `AfCFTA` 仍在寻求原产地规则方面的立法道路，但相关国家仍保持希望。新冠肺炎大流行对整个过程也产生了有趣的影响。一方面，它动摇了多个国家的经济，导致这些地区的贸易遭受了严重影响。但同时，它也像对很大程度上依赖商品出口的非洲国家敲响了警钟，促使他们开始内部贸易以及与其他国家的贸易。这可能是非洲国家加速
    `AfCFTA` 活动急需的动力。


    然而，有趣的是，区块链已经在帮助 `AfCFTA` 之外的贸易场景。尽管 `AfCFTA` 现在似乎准备好催化贸易繁荣，但它仍处于早期阶段；这意味着正如我们所讨论的，即使在
    `AfCFTA` 内部，每个国家也可能有需要多种文件的海关程序。区别在于，`AfCFTA` 将拥有统一的程序，而在常规情况下需要完成的手续在每个国家可能大不相同，糟糕的是，甚至每个港口都如此。


    这些官僚主义立法传统上为小型企业制造了巨大的准入门槛。有了区块链，这些障碍可以大幅减少，甚至完全消除。与其在贸易路线的每一点提交单独的贸易文件，人们可以在区块链上上传一次信息，链上的所有机构都可以查看。`TradeLens`
    是一个目前正帮助企业家恰好做到此点的平台。交易者可以上传他们的信息并跟踪货物在整个行程中的位置。然而，由于注册该特定平台的港口运营商数量有限，仍有改进空间。


    这些倡议在这些地区释放的繁荣意义是非凡的。请记住，区块链辅助贸易（特别是自由贸易）让小参与者能够进入全球市场。无论是突尼斯的橄榄油、赞比亚的木薯、卢旺达的咖啡，还是我们之前提到的科特迪瓦可可，非洲大陆都拥有巨大的潜力。在此期间，尽管这些资源被开发（很多时候是不符合伦理的），但回报很难让那些因辛勤工作获得报酬的人。利润被中间商和腐败的政府官员掠夺，导致实际生产者几乎每次都陷入困境。今天，通过区块链，交易者有机会在获得利润的同时，为小农提供应得的份额。


    总而言之，非洲国家的贸易格局正处于突破的边缘。区块链过去是、未来也无疑将是更进一步的宝贵盟友。


    ## 点对电力模型


    电力危机对非洲国家来说是一场真正的斗争。与人口的实际需求相比，发电量似乎持续短缺。尽管进口了噪音大且不那么环保的发电机，但非洲大部分农村地区仍处于黑暗之中。尽管大陆各国的政府都承诺要实现电气化，但普及化似乎是一个遥不可及的梦想，特别是对于大陆的农村贫困群体而言。


    由于由于发电成本高昂，许多国家现在开始考虑利用可再生能源，特别是对于很大程度上离网的社区。在这些地区，利用太阳能和风能的项目已经得到了几家金融机构投资的高度鼓励。但尽管有了这些发展，可再生能源——作为农村地区供电的资源——仍然无法满足需求。主要原因在于关注的是连接数量和安装的千瓦数，而不是发电的实际覆盖范围。这正是去中心化电力发挥作用的地方。


    一个重要进展是即将到来的去中心化电力，个人家庭安装了太阳能电池板，或者安装了微型/小型电网为小社区供电。然而，真正的游戏改变者在后面。太阳能电池板产生的能量大于其使用的房屋可以将多余的能量卖给那些没有太阳能电池板的房屋。这样，双方都是双赢——在家里安装电池板的人可以偿还安装所的贷款，同时享受不间断的电力供应；而负担不起安装这些电池板的人只需为他们使用的能量付费。当然，这些交易是通过区块链上使用的加密货币进行的。一个名为
    `Exergy` 的由区块链驱动的移动应用程序一直在帮助追踪跨越非洲的此类交易。正是这些点对点的电力贷款倡议，让那些永远不会出现在任何大型电力公司视野内的小消费者能够获得电力，并在这一过程中实现金融包容。


    ## Cardano 驱动的项目


    随着区块链运动的势头增长，这些生态系统正在到处如春笋般生长。它们现在可能还没有其潜力那么大，但无疑正走向巨大社会变革的道路。一个我很感兴趣的区块链项目是 `Cardano`。我已经提到过多次了，但我认为由于其真正的去中心化本质以及利用技术行善意愿，这条链具有真正的潜力。`Cardano`
    在非洲承担了大型区块链项目，其中一些我们之前已经讨论过。


