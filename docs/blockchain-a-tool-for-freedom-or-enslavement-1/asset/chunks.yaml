- fmt: "\nThough 2021 is often hailed as the year of security tokens, it’s crucial\
    \ to note that in open finance solutions, the blockchains are more likely permissioned\
    \ blockchains. So, the data is never really fully transparent in the public domain.\
    \ Also, the central banks are still in charge of your money, which is still regulated\
    \ by the centralized legal restrictions. But, all said and done, this still seems\
    \ to be a tiny, first step in increasing people’s acceptance of digital currencies\
    \ and has, indeed, been widely accepted across the economic community. \n\nHaving\
    \ pointed out the financial developments that blockchains are bringing in, a word\
    \ of caution is in order, too. Do not be lulled into a false sense of security\
    \ with these advances, especially ones like Central Bank Digital Currency (CBDC)\
    \ which have been making news for a while. This is nothing but the legacy banks'\
    \ way of trying to transition into the blockchain space. They completely undermine\
    \ the purpose of blockchain, which is meant to be decentralized, and is simply\
    \ fiat currency running on the blockchain. This may be thought of as the same\
    \ old, dangerous centralized monetary system in fancy new attire of blockchains.\n\
    \nDecentralized Finance (DeFi), on the other hand, is exactly what we have talked\
    \ about all long. It removes all middlemen and is the real application of blockchains\
    \ as it was intended originally. Though more and more countries are opening their\
    \ arms for cryptocurrencies, a regulatory barrier still exists in the majority\
    \ of nations. El Salvador became the first country to declare `Bitcoin` as national\
    \ currency, and has now partnered with `Acumen`, a `DeFi` lending platform, to\
    \ help small entrepreneurs access bitcoin-backed loans. \n\n## Stock Trading\n\
    \nIn the finance world, stock trading is perhaps the most robust application of\
    \ blockchains. In 2019, the global stock market was worth $77.6 trillion (Daley,\
    \ 2019), which increased to $95 trillion in 2021 (Mitova, 2021). The rate at which\
    \ the value of daily transactions in stock trading is increasing, it becomes paramount\
    \ that the latest and the most effective technology be put to work to record these\
    \ transactions. The obvious logical choice for many has been blockchains. This\
    \ includes the big fish `NASDAQ`, too, and has launched various indices based\
    \ on blockchains. These are then used to keep track of the companies’ performances.\n\
    \nStock markets are the perfect fit for blockchains mainly because of the tedious\
    \ procedures involving multiple intermediaries and regulatory protocols. Be it\
    \ the cryptocurrency trading potential or the significant utility of `smart contracts`\
    \ in stock trading, blockchains are attracting the trading companies for all the\
    \ right reasons. Multiple companies have joined the race, with more entrants coming\
    \ in all too frequently. Companies like `ShapeShift`, `Circle`, `Coinbase`, `Blockstream`,\
    \ and so on are all utilizing blockchain infrastructures for trading in crypto\
    \ assets.\n\nThese blockchain infrastructures have largely automated the systems,\
    \ making them much more efficient. However, blockchains in the trading scenario\
    \ seem to have much larger applications than just settling stock trades. It has\
    \ been a major force in helping the companies track systemic risk, lending of\
    \ securities, asset management, and so on. Fundraising campaigns have also become\
    \ much easier to track. But, most importantly from the perspective of a consumer,\
    \ transaction costs could be cut down drastically, leaving the individual with\
    \ more money in hand from profitable trades. While it may not be possible in all\
    \ situations, again without major regulatory changes, middlemen can still be replaced\
    \ (at least in some cases), helping the individual attain a quicker settlement.\n\
    \n## Credit and Lending \n\nAs we have already seen in the African blockchain\
    \ movement, lending and credit solutions, powered by blockchains, form a substantial\
    \ part of the blockchain disruption in the banking and financial sector. When\
    \ Dr. Muhammad Yunus won the Nobel Peace Prize in 2006, for helping the poor access\
    \ micro-loans, a certain shift occurred in the financial world. Microfinance became\
    \ a movement of sorts, with institutions coming forward to help the low-income\
    \ individuals that previously were eligible neither to apply for financial help,\
    \ nor to dream and to have ambition. \n\nBanks and financial institutions are\
    \ hesitant to finance low-income individuals because the cost of acquiring such\
    \ a client is much greater as compared to the loan that they avail for. There\
    \ is also much less data available to the bank to ascertain a low-income individual’s\
    \ ability to repay loans, as they likely have never made regular payments on any\
    \ commodities yet. \n\nBlockchains, as we already know, eliminate the intermediaries,\
    \ which is a big factor in cost reduction. Another aspect that reduces costs greatly\
    \ is the efficiency with which the entire process goes through. As the client’s\
    \ personal records, credit score (if any), and any other documentation is all\
    \ stored online, the chances of these getting misplaced or damaged are practically\
    \ zero. Moreover, the cost of personnel required to verify and disburse the loan\
    \ is avoided, as `smart contracts` can make the process as smooth as can. Furthermore,\
    \ blockchains can also impact the mortgage processing by helping the parties involved\
    \ attain quicker settlements and much less hassle. The immutability of transactions\
    \ recorded makes it even more valuable to homeowners. Right now, you will find\
    \ that blockchains are not a standard practice when it comes to mortgages. But,\
    \ they are gaining attention, and blockchain accelerators like `Synechron` are\
    \ already on their way to improving user experience, as well as the speed of the\
    \ mortgage process.\n\n## Trade Finance\n\nThe international trade market is worth\
    \ trillions of dollars, and trade finance has emerged as one of the key areas\
    \ revitalized by blockchains. With an industry that big, it’s no surprise that\
    \ the fraud in the industry is also on the rise, especially with regards to receivables.\
    \ Falsified receivables have tainted the reputation of even big groups like `Citigroup`.\
    \ Whether it is cases of double funding, where two or more banks are misled into\
    \ giving finance over the same trade receivable, or a trail of fake receivables\
    \ to begin with, trade finance frauds have tied up billions in lawsuits and exposure.\
    \ Many industrialists who partake in such fraudulent practices may tell themselves\
    \ that such fraud is a victimless crime, but the truth is these frauds are not\
    \ a private exchange between the bank and the top management. Millions of lives,\
    \ including those of the employees, as well as the people impacted by the services\
    \ of both the company and the banks, are at stake here.\n\nMajor industries like\
    \ `IBM`, `Deloitte`, and so many more have moved their financing to blockchains\
    \ for this very reason.\n"
