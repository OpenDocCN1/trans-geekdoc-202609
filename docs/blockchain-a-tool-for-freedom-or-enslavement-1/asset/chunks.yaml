    那些强调加密货币相关的波动性和风险的人，往往会犯一个错误，将这一切都与区块链联系起来，而这与事实大相径庭。当然，我们稍后会详细讨论比特币，但现在重要的是将这两者区分开来。为了这一点，我们需要更深入地理解这项技术。理解我们之前讨论的原理是理解区块链的一部分，另一部分是技术创新。只有当我们对区块链技术大轮中的各个各个齿轮有了深入的理解时，关于区块链的那些误导性迷思才能被消除。


    ## 区块链的要素


    尽管本书的重点更偏向于影响方面，但我仍然希望带你领略区块链的技术细节。我们不会涉及过多的技术细节，以至于任何读到这里的人都能亲手创建一个区块链。但我真心希望，如果你对技术领域本身感兴趣，那么接下来的章节将激发你的兴趣，使你更有热情地投入到区块链解决方案中。然而，出于目前更广泛的目的，我们将从简化这些方面的角度来看待技术层面，并理解这些方面对我们的日常生活意味着什么。


    ### 常见术语


    在阅读关于区块链的内容时，你经常会遇到某些看起来像拉丁语和希腊语的单词。但，难道每个孩子在学习字母表之前不是都有同样的感受吗？所以，我们开始吧，学习构成区块链世界的字母表。


    首先，我们需要理解的是，区块链是由多个节点组成的网络。节点可以比作在网络上传回传输数据的小型服务器。这些多个节点的存在确保了透明度，稍后你会看到它是如何运作的。


    ![](img/image00156.jpeg)


    在处理完基础框架后，让我们首先从区块链中的“区块”（block）开始。这些区块具有一些对我们参考有用的特征和方面。链中的第一个区块被恰如其名地命名为`genesis
    block`（创世区块）。将其想象为区块链的零起点即可；这是一切的开始的地方。随着交易数据的增加，它们被打包在这个区块中，然后填充到它的容量。容量可能会根据区块链应用程序的类型而不同。一旦`genesis
    block`被填满，下一个区块就会出现，交易会被记录在其中。`genesis block`与后续区块的主要区别在于，后者都包含对之前区块的引用；由于`genesis
    block`是第一个，显然没有先前的引用。


    从区块链终端用户的角度来看，区块具有三个特殊意义的方面。其中之一无疑是`time stamp`（时间戳）。这个`time stamp`是根据从区块链上所有节点收到的交易时间决定的。想象一个跨越美国、澳大利亚、加拿大和印度区块链。由于这些地方位于不同的时区，区块链应用程序将调整所有这些节点的时间，以获得交易的中间值`time
    stamp`。由于这些`time stamps`经过多个节点的证实，操纵记录保存变得变得是不可能的。


    第二个方面是每个区块区块生成的`hash`（哈希值）。`Hashing`（哈希处理）是一个数学过程，它接收来自交易数据的长度不一的字符串，并将其转换为固定长度的输出。由于整个过程具有极强的数学算法特性，`hash`为交易增加了额外的安全性。这确实使得恶意黑客篡改数据本身变得困难得多。因此，数据到达精确的预期接收者，使得操纵变得更加困难。


    ![](img/image00157.jpeg)


    与其深入探讨这个`hash function`的算法细节，我希望和你谈谈它对终端用户来说意味着什么，而你却毫无察觉。区块链的每个区块的头部中都嵌入了前一个区块的`hash`。这项技术的精妙之处在于所用逻辑的简单性。这种对之前`hashes`的链式嵌入的作用是，它在不操纵其他区块的情况下，操纵某个区块在实际上几乎是不可能的。而在如此规模上操纵所有区块来操纵数据是极不可能的。


    ![](img/image00158.jpeg)


    如果有人真的拥有巨大的智力来做到这一点，要获得物理资源来完成它仍然将是一项巨大的财务工程。记住我们之前提到的点——在区块链中，作弊要么是极其困难，要么极其昂贵，或者两者兼有。`hash
    function`就是使其如此的原因之一。`hash function`也是让我们所有人熟悉的数字签名成为可能的。


    构成区块链的第三也是最后一个方面被称为`nonce`（随机数）——一个只使用一次的数字。这是分配给每个区块每个`hash`的数字。矿工必须发现这个数字才能开始挖掘过程。由于寻找这个数字并不容易，`nonce`几乎就像是一个筛选测试，用来过滤掉能力较弱的矿工。


    为了理解这一点，我们必须深入研究挖掘过程。`Mining`（挖掘）是运行区块链节点的人赚取所需奖励的方式，并激励他们保持网络的完整性。将这些矿工想象成付钱保持交易数据整洁的审计员。如果你对区块链技术有哪怕一点兴趣，`mining`也是你一定听过的术语。而这个词的传统用法显然会让人联想到热、潮湿且昏暗的地下隧道，那里住着勤劳的劳动者。事实是，区块链矿工同样勤劳，区别在于，只要他们有一些强大的`CPUs`和对数学计算的深入理解，他们可以在舒适的家里完成。


    简单来说，`mining`是指用于验证区块链上交易的过程。假设有两叠 100 美元钞票。其中一叠是真钞，另一叠是伪钞。由于没有人检查过哪一是真的，这两叠钞票继续在交易中使用。现在，幸运获得真钞的人将不会面临任何问题，但那些持有伪钞的人将面临被措手不及的风险。然而，区块链中发生的情况稍有不同。这里有一些可以检查这些钞票有效性的人。这些审计员花时间查看两叠钞票，验证它们的序列号并分离伪钞，从而阻止它们流通。然而，为了让这些审计员继续检查此类伪钞，他们需要获得某种奖励。


