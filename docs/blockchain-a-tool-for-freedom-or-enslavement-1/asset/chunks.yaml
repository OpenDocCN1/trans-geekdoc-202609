  trans: '

    区块链之所以特殊，是因为它们可以利用这种看似平凡的基础设施来引入急需的稳定性。将此与人工智能运动相结合，非洲大陆确实掌握着某些令人惊叹的东西。在数据质量和可用性领域，现有的挑战无疑已阻碍了
    AI 衍生技术的采用，但即将到来的去中心化应用（dApps）和平台正在克服这些困难，触及非洲人口的核心。例如，dApp `UjuziKilimo` 利用传感器和其他农场数据分析工具形式的人工智能来帮助小农户理解农业数据，从而帮助他们根据科学依据做出关键决策。该
    dApp 一直为肯尼亚农民提供实时土壤测试数据，以改变他们的耕作实践。尽管该 dApp 目前尚未使用区块链，但你可以想象这种由区块链驱动的人工智能技术可以达到怎样的精进程度。


    区块链人工智能运动在非洲各个地区正势勃勃，但尼日利亚似乎处于领先地位。长期以来，尼日利亚经济依赖于其原油生产，但近期原油价格的下跌使其失去了对比利比亚作为世界最大原油生产国的地位。这似乎加速了经济多元化的需求，而区块链驱动的人工智能正处于这种多元化的领导地位。`LoopBlock
    Network` 是一家尼日利亚公司，整合了区块链和 AI 解决方案以构建可行的平台。他们最近宣布了计划在该领域培训 100 名尼日利亚青年（Anagor,
    2022）。这看起来可能是一个次小事件，但它标志着在未来即将发生区块链-AI 合作的大规模流入。


    `Cardano` 仍然处于这些进展的前沿，提供了人工智能与区块链的完美融合。这也就是为什么 AI 公司正押注 `Cardano` 以获取长期收益。`Cardano`
    与 `SingularityNET` 和 `iCog Labs` 合作，正忙于发掘尚未开发的机器人和 AI 市场，以支持非洲的技术社区。他们甚至被选中为名为
    `Grace` 的人形护士提供动力支持。尽管该项目目前与他们的非洲关联是独立的，但这些努力所在的方向仅为即将到来的进展发出了信号。


    `EMURGO` 是作为 `Cardano` 创始实体的全球区块链解决方案公司，最近宣布了一个特殊的非洲分部，将投入 1 亿美元专门用于科技行业的发展。这笔资金将用于帮助初创企业，并在此过程中构建一个供区块链顺畅运行的生态系统。如果不观察这一新兴生态系统将无法衡量这项技术的真实影响。


    ## 住房


    在发达国家，我们似乎将拥有财产的权利视为理所当然。诚然，即使在西方，这一过程也变得越来越繁琐；但现实情况是，我们仍然拥有必要的机构和基础设施来主张这项权利。遗憾的是，我们发展中经济体的伙伴们的情况并非如此，特别是非洲大陆。长期以来，非洲一直处于一场似乎永无止境的住房危机之中。政治上的冷漠以及缺乏针对负担得住房的合理政策变化，导致非洲的年轻一代流落于街头。目前，住房积压量达到近
    5000 万套，而实际需求数量相比却很小。占收入 30-45% 的荒谬抵押贷款使购房变得更加困难（Hamilton, 2021）。凭借如此高的利率，普通人几乎不可能考虑长期还贷。


    情况变得糟糕的另一个原因是，指向该大陆的大量国际援助最终从未到达预期的受助者手中。由于立法政策、货币贬值以及普遍盛行的腐败，国际投资也在萎缩。所有这些因素共同导致大多数非洲人口暴露在痛苦之中，因为他们永远无法以财产的形式拥有财富。


    区块链正通过 `Empower` 渠道改变现状。`Empower` 是 `Cardano` 上的第一个旨在帮助非洲人以负担得起的价格住房的去中心化金融（DeFi）平台。简单来说，它可以被看作是一个让全球拥有资金的人资助非洲的通道。但其实际运作方式要复杂得多。


    以下是其运作方式：`Empower` 使用构建在 `Cardano` 上的 `EMP` 代币，让全球各方以独特的方式使用该平台。由于平台使用的是单一代币，人们无需担心跨币交易。这些功能允许用户购买
    `Impact` 卡。在交易的另一侧，通过平台的智能合约功能，由于房屋正在建设中，出售 `Impact` 卡所获得的 `EMP` 代币将再次转换为原生货币。莫比克已被视为开发该项目概念的潜在候选地。


    ## 连接未连接地区


    `Cardano` 还与 `Input-Output Global` (`IOG`) 和 `World Mobile` 合作，其使命是确保坦桑尼亚人拥有移动连接，从而让他们获得教育、医疗、金融等服务。`World
    Mobile` 声称是第一个构建在区块链上的移动网络。其首席执行官 `Micky Watkins` 对该项目的方向非常明确。他在推特上表示：“要为没有银行账户的人服务，我们首先必须连接未连接地区。世界上有一半的人没有互联网。我们将改变这一点”（World
    Mobile, 2021, para. 2）。


    目标是为目前无法享受良好网络稳定性的群体提供稳定快速的 5G 连接。这种模式似乎很有趣。连接是因为网络运营商并不将进入偏远地区视为价值主张。`World Mobile`
    计划通过引入共享经济系统来改变这一点——每个公司可以在网络上运行独立的节点以保持各自地区的连接，同时获得 `World Mobile` 代币的激励。


    ## 智慧城市项目


    在过去的几年里，新加坡、芝加哥和哥德堡等城市已成为高度数字化管理的智慧城市模型。区块链有能力将这种水平引入更多的城市。这引发了人们对全面实施细节的极大兴趣。乌干达政府已与
    `Adanian Labs` 合作，并探讨将其恩特贝市转变为区块链驱动的智慧城市。这座智慧城市将包含哪些内容尚待观察，但齿轮确实在运转。


    ## 医疗保健

    '
- fmt: '

    Africa’s problems in the healthcare sector are quite widespread. Whether it’s
    HIV/AIDS, Ebola, Malaria, or even the more recent COVID-19, the healthcare system
    across the continent has struggled under the weight of various health crises for
    decades. It is noteworthy, though, that the healthcare systems are also learning
    from their failures. The response to COVID-19 seems to have been far more agile,
    seemingly drawing from their learnings from the Ebola epidemic. But, no matter
    how efficient the medical professionals prove to be, there is only so much that
    can be done with such limited resources! Africa, as a whole, has been silently
    screaming for a system that enables more efficient disease monitoring, as well
    as diagnosis and treatment. Moreover, Africans have always been quite skeptical
    of external parties running interference in their healthcare. These parties, including
    big names like the World Health Organization and `Pfizer`, have in the past treated
    Africans as guinea pigs in their experimentation labs for development of drugs
    and vaccines, and that has been more than enough to erode the trust in these systems.


    I don’t mean to sound like a broken record, but blockchains resolve these concerns
    quite elegantly, to say the least. Blockchains can help create a self-sufficient
    healthcare ecosystem that protects the data of the patients while also giving
    the authorized doctors instant access to the patient’s past history and medical
    records. This safeguarded data can be a major determinant in the diagnosis and
    treatment. `AfyaRekod` is one such blockchain-driven platform where the patient
    maintains full rights to their own data. This data can be saved at the patient’s
    end or at the medical practitioner’s end; either way, the data is stored in one
    single place, making it much less of a nightmare to access it, especially in the
    case of an emergency.


    ## Credit/Lending


    Lack of access to financial capital is one of the biggest deterrents to small
    entrepreneurs wishing to start their own business. Only a little over a quarter
    of the Small and Mid-size Enterprises (`SMEs`) have access to loans. And, that
    is only in the formal sector. Imagine what the statistics would be in the informal
    sector. This barrier impacts the youth the most, keeping them trapped in the shackles
    of poverty, never giving them an option to move out of it. `Paylend` is a Kenyan
    fintech blockchain start-up that attempts to resolve this concern. While providing
    lending solutions to the small entrepreneurs, this start-up also attempts to create
    value for them by safely collecting consumer data which they can use to tailor
    their products and services.


    Another interesting project built on the `Cardano` is `Liqwid Labs`. It is essentially
    a marketplace where lenders and borrowers can freely interact by borrowing and
    lending funds, participating in the governance of the `Liqwid` protocol, and earning
    `ADA` tokens as incentives in the process.


    A company that we have already discussed, but in a different context, is `Kiva`.
    At the beginning of this book, I mentioned this company as one that I suggested
    to a man looking for a quick transfer of money. While the platform can certainly
    be used for that, that’s not its main function; lending money to small business
    owners in third world nations is. So, a borrower in, let’s say, Africa would apply
    for a loan which would then go through the underwriting and approval process.
    This loan is then posted on the `Kiva` platform to be taken up by lenders, and
    the funds are then immediately transferred to the-er. When the borrower pays the
    money back, the lender can either withdraw the money or use it to fund other loans.
    This is a neat system but, again, high fees can be a barrier.


    ## The WADA


    An organization that I personally know is doing excellent grass-root work is the
    `West Africa Decentralized Alliance` (`WADA`), an organization from West Africa.
    I’ll be honest, I am no expert on blockchains; I am still learning. But, much
    of what I know of the life-altering capacities of blockchains comes from this
    organization. They are doing truly groundbreaking work on the African continent.
    Their main goal is to guide African developers to the most suitable blockchain
    solution. This is done by creating development-driven hubs in different parts
    of Africa.


    One of the intriguing projects they have come with is `Afrixx`. This is their
    first generative NFT project on `Cardano`. This is a particularly innovative idea
    to reinvigorate an entire culture and help them feel at home based on African
    legends and icons. Truly, what a wonderful way to amalgamate cultural identity
    into technology. Usually, early technology adoption can be slightly intimidating.
    But, infusing this kind of proud association in the form of NFT is just brilliant.
    With initiatives like this, it aims to empower the people of Africa to be instruments
    of change themselves, and bring in socioeconomic measures that help them fulfill
    their own dreams and aspirations.


    # Part IV: The Blockchain Disruption


    In this section, we look at the global blockchains disruption scenario. We explore
    every sector where blockchains are making a mark, while also investigating their
    impact on the masses. Some of these may not have proven case studies just yet,
    but are useful cases, nonetheless. Here, you will see the widespread nature of
    blockchains around you. There is more technology that’s out there somewhere—it
    might be at work in your backyard, for all you know!


    # Chapter 8: Governance


    If we can but prevent the government from wasting the labours of the people, under
    the pretence of taking care of them, they must become happy.


    - Thomas Jefferson

    '
