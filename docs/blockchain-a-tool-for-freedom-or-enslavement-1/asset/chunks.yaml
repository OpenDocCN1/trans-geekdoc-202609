- fmt: '

    We have all known the critical nature of ledgers for businesses for a long time.
    Distributed ledgers take those ledgers to a whole new level. They make decentralization
    on blockchains possible. The technical details we discussed earlier—complete with
    nodes, blocks, hash, and nonce—make up the distributed ledgers. These are the
    databases that are shared, duplicated, and synchronized across blockchains, thus
    accounting for a uniquely transparent system. Any read on blockchains would be
    incomplete without distributed ledger technology, often abbreviated as `DLT`.
    But, what most people don’t realize is distributed ledgers are not the same as
    blockchains. While all blockchains require `DLT`, not all distributed ledgers
    are in the form of blocks and chains. There are multiple types of `DLT`. For instance,
    `Tangle` is a form of `DLT` used in Internet of Things, or `IoT`, applications.


    Due to their ability to record data securely and transparently on multiple nodes
    without the need for third-party monitoring, these distributed ledgers have the
    power to drastically reduce transaction and settlement times from days to minutes.
    Remember the example of the distressed Indian man who wanted to send money urgently
    to his hometown? This is the part of the blockchain that would allow him to do
    it with absolute ease. These ledgers also eliminate the need to reconcile records
    from various sources, thereby reducing both time and effort.


    As you can see, `DLT` is a truly remarkable innovation; but, for this to fulfill
    its potential for an impactful implementation, it needs the help of what are known
    as smart contracts.


    ## Smart Contracts


    Smart contracts can be thought of as programs on a blockchain that are designed
    to run only if and when certain prior criteria are met. Think of a combination
    locker. Only when the combination of the numbers is perfect will it be unlocked.
    Let’s say you forget even one number—you are locked out. Smart contracts are like
    that, but the conditions are not numbers but some sort of clauses that would either
    activate or deactivate the agreement between the involved parties. Again, since
    the process is automated, there would be no need for an intermediary to oversee
    the proceedings.


    Let’s look at an example of how smart contracts can make life much easier, especially
    for disadvantaged groups. It is a well-known fact that land registration and titling
    systems in Africa can play a significant role in the empowerment of the poor.
    However, these systems are so strained that the process can be often too tedious
    to be taken up by, let’s say, a poor uneducated farmer. To top this, the trust
    in legal institutions is likely to have suffered due to the corruption that’s
    rampant in the offices. Smart contracts act like a simple solution—the various
    steps in the registration process—like checking for registry of the land in government
    records, inspection of the property, and so on—can be written into the code of
    these blockchains, thereby minimizing the chance for errors, as well as corruption.


    The communities that are frequently disrupted by natural disasters (like hurricanes,
    earthquakes, etc.) can also live an anxiety-free life as they don’t need to constantly
    worry about the safety of their records. For example, in 2010 in Haiti, an earthquake
    destroyed the homes and government archives alike, leaving millions homeless physically,
    as well as legally. Something like this can be avoided with smart contracts on
    blockchains. Since the records on the blockchains are stored as multiple copies
    throughout the world, they can claim their rightful ownership to properties despite
    the catastrophic loss.


    ## Types of Blockchains


    A Yahoo!Finance report in February 2022 mentioned that Google CEO Sundar Pichai
    is "looking to help build Web3, blockchain products." If this conglomerate is
    catching on, then you can be sure that blockchains have arrived. But, what is
    this Web3? Before we get into it, let’s look at the 1 and 2 versions, shall we?
    After its explosive entry in 2008, blockchain technology has undergone an evolution
    of its own. Some would say the technology was ahead of its time and, though it
    was appreciated, we are seeing its implementation only in recent years. That’s
    probably the reason why the times we are living in today are referred to by some
    as the blockchain renaissance, if you will.


    There’s often talk of blockchain 1.0, 2.0, and 3.0. The first generation, blockchain
    1.0 was synonymous with Bitcoin. This was introduced by Satoshi and was used exclusively
    for cryptocurrencies. Thus, all the cryptographic currencies would fall into this
    category. Subsequently though, innovators began to realize the infinite potential
    the blockchain technology held within. If cryptocurrencies could be exchanged
    without external regulation and interference, there could also be smart contracts
    that could be implemented within these ledgers. Thus was born blockchain 2.0.
    But, blockchain evolution was far from over, rather it shall continue for a long
    time to come. Blockchain 3.0 was when this technology began to come out of its
    nascent stage to realize its true potential in industries and a multitude of sectors,
    which could not have been imagined before, like governance and healthcare.


    As would be expected, blockchains have undergone drastic change not only in the
    implementation, but also in its core structure. From this change emerge the four
    prevalent types of blockchains in use at present:


    1. Public blockchains

    2. Private blockchains

    3. Consortium blockchains

    4. Hybrid blockchains


    The type of the blockchain used will depend on the industry using it and also
    on the benefits it aims at deriving from it. Let’s try to understand these up
    close.


    ### Public Blockchains


    The most famous type of a public blockchain would have to be Bitcoin. By public,
    it simply means that anyone can join the blockchain without requiring any permission
    from the prior members. This is why it’s also called a permissionless ledger.
    This blockchain typically requires a cryptocurrency as a form of token and follows
    the consensus methods that we discussed earlier. For instance, Bitcoin uses the
    `Proof of Work` consensus mechanism.


    On the one hand, these provide the highest form of decentralization among all
    four. Since there are no barriers to entry, common people can easily be accommodated
    on the network of nodes. All of these are likely to feel an equal sense of involvement
    in the functioning of such a blockchain setup. But, on the other hand, these are
    also heavy on the environment because of the energy intensive protocols. Moreover,
    not every blockchain application requires cryptocurrency.


    Another issue frequently encountered with this type of blockchains is lack of
    scalability. This means that these blockchains cannot support bulk transactions.
    It is this issue that has impeded these kinds of blockchains, especially in terms
    of cryptocurrency, from reaching their full potential. For instance, the number
    of transactions that Bitcoin can handle per second are significantly lower than
    those handled by its counterpart: VISA. A technique known as `sharding` is often
    used to work around this issue. So, the bigger blockchain is essentially broken
    down into smaller chunks, known as `shards`. These shards can then be processed
    by multiple nodes at the same time. Though this may seem like a brilliantly simple
    solution, the truth is incorporating such shards into the blockchain architecture
    is a complex task. This is why other forms of blockchains may be preferred at
    times, even though public blockchain platforms offer the highest decentralization
    possible.

    '
