    除了这些，区块链还带来了两个额外的益处。第一是忠诚度和奖励，我们之前在讨论小型创业者时已经提到过。第二个益处更加奇特：客户评价。在这里，不可篡改原则再次发挥了作用，但其呈现方式非常新颖。在基于区块链的电子商务平台上，当客户留下评论时，无论好坏，都无法对其进行更改。因此，这些评论可能更加可信且可靠。


    # 第 13 章：艺术与文化


    艺术与文化是任何文明的关键基石。只有当创造力不受审查限制而自由飞翔时，思想、观点和情感的自由表达才可能。艺术自由结合消除窒息的中心化审查，可以创造出动人心的作品。但，缺乏审查只是冰山一角。区块链与才华交织，正在创造值得关注的项目，导致了艺术本身的多样化方法，也为收藏家和艺术爱好者带来了不断增长的市场。


    ## 非同质化代币 (NFTs)


    区块链在艺术文化领域的一个大用例是非同质化代币（NFT）。我们之前已经以非常粗略的形式谈过它们，但现在是时候深入探讨了。为了让你简要回顾一下 NFT 是什么，假设它们是区块链支持的数字代币。这些代币可以是一段音频、一个视频、一件数字艺术品等等；它们可以与加密货币绑定。现在，让
    NFT 与加密货币不同的之处在于，虽然后者具有相同的价值，但前者不是。这意味着，当我说 `Bitcoin` 价值某个金额时，每个 `bitcoin` 的汇率都是相同的；但当我谈论
    `NFTs` 时，每个 `NFT` 就像一件价格不同的商品。所以，就像两件艺术品的价格不会一样，两个 `NFTs` 的价格也不会一样，因为艺术品就是它们原有的样子。所以，就像你购买
    `Bitcoin` 时，你会获得一个独特的密钥——当你购买 `NFTs` 时，你也会获得一个独特且安全的数字代币。


    对于外行人来说，你收到的数字文件看起来并不重要，但对于艺术鉴赏家和收藏家来说，它绝对值他们在这些艺术品上花费的数百万美元。它意义不仅仅是拥有该作品；它本质上意味着这些人已经在作品的数字历史中留下了永恒。然而，通过这次购买，艺术鉴赏家并不拥有作品的版权，版权仍属于艺术家。这意味着艺术家可以创作更多与你拥有的类似的作品——就像限量版的棒球卡。一些
    `NFT` 市场出现了，如 `SuperRare`、`OpenSea`、`Nifty Gateway`、`MakersPlace` 等，它们对售出的每件作品收取佣金。作为回报，它们确保艺术品得到广告宣传并且交易顺利运行。


    现在，破坏性在于：`NFTs` 正在赋予艺术家和创作者通过从事他们热爱的事来维持生。他们加入其中的技术可以帮助这些艺术家直接接触并吸引更广泛的群体，而无需任何代理人。这些
    `NFTs` 为艺术家带来的另一个益处是不可争议的所有权记录。虽然在传统艺术中，有很多关于正品与伪品的争端，但在这里，这种可能性永远不会出现。从艺术的角度来看，`NFTs`
    提供了另一种媒介，可以在画布（或者说是屏幕）上倾注艺术家所有的创作表达。此外，`NFTs` 可以带来一个更加公正且不偏斜的市场，无论性别、种族等，都为艺术家提供平等的机会。


    `NFTs` 还解决了艺术家的版税问题。考虑这样一个场景：在传统艺术行业中，尽管艺术家拥有其作品的权利，但他们无法得知自己的画是否被售出或被盗版。因此，尽管版税概念在理论上存在，但在实践中很难执行。然而，在区块链上，通过使用
    `smart contracts`，艺术家可以确保他们获得后续销售的特定比例。


    `NFTs` 也将改变艺术收藏的格局，可以这么说。收藏家将不再是一个富翁，手里拿着酒杯啜着葡萄酒，另一只手夹着雪茄。由于收藏保持在线，任何对艺术有轻微向往的人都可以购买
    `NFT`。价格可以低至 `$12`，并一直飙升到数亿，为购买者提供了广泛的选择。


    这里需要考虑的另一个方面是，`NFTs` 不一定非得艺术品，可以是音乐、照片或任何东西。任何音乐迷都知道，从历史角度来看，唱片公司对艺术家的尊重并不充分。这种现实——以前在大多数时候被掩盖在桌子下——在传奇人物
    `Prince` 在脸上写下“奴隶”字样时被公开，他将自己与 `Warner Bros.` 的合同比作奴隶制。唱片公司继续对音乐人保持这种控制力，而且往往让他们处于劣势。然而，随着
    `NFTs` 的出现，情况可能会发生变化，因为艺术家正在完全抛弃唱片公司，以 `NFTs` 的形式直接向听众出售他们的作品。


    漫画销售他们的演出作为 `NFTs` 也是如此。`Jamb` 是一家喜剧收藏初创公司，正在为建立喜剧 `NFTs` 市场筹集数百万美元。除了为喜剧节目筹集资金，`NFTs`
    还为这些演员提供了一个不受审查的区域，让他们创作讽刺作品。喜剧演员经常因为创作喜剧而受到攻击，而这恰恰是他们要做的。但似乎有一股“取消文化”的浪潮，人们认为任何他们不同意的内容都需要公开谴责，甚至是侮辱性的谴责。这种认知似乎正助长了我们今天激烈的文化战争之火。


    随着觉醒的伪自由主义者在每个角落等待取消喜剧演员的言论自由，社会氛围变得越来越不安全。这些自诩为道德警察的人讨厌对当前时事发表评论的喜剧演员。我好奇是否是因为他们说出了真相——一个极其可怜以至于进入了幽默境界的真相？区块链和
    `NFTs` 确实为这种艺术形式注入了新生命。有一点是肯定的：`NFTs` 的影响远及所有艺术类别。


    ## 去中心化社交媒体


    社交媒体几乎是我们今天社会生活中不可或缺的一部分——一个我们几乎无法离开的东西。你可能认为在主页上发布所有内容（从你吃什么到你在哪里）几乎是强制性的，对吧？但到什么时候，我们才能说我们的社交媒体平台停止了连接并开始侵扰呢？


