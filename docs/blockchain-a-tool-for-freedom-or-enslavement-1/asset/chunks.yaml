  trans: '

    这看起来似乎只是为了企业的利益，对普通人并没太大好处。这种说法只有部分正确。像你我这样的人可能不会直接受到此影响，但让我们面对现实：贸易影响每一个人，即使你不是特定贸易产品的消费者。它是我们经济的支柱。欺诈性贸易行为往往是由腐烂的腐败文化推动的，而这种文化无疑影响着每一位公民。如果贸易开始崩溃，谁也无法预测下一个出现在名单上的会。


    ## 保险

    目前中心化保险体系的主要问题在于，很大程度上，它在尝试核实理赔和检测欺诈（如果有）时所产生的成本。产品开发、管理、文档记录、理赔验证以及其他多种协议的繁琐过程消耗了大量时间。虽然对于大参与者来说这没什么影响，但较小的参与者可能会感到被困在这样的系统中——一方面，保费可能高到无法负担，但让自己和家人暴露在灾难之中似乎可能更可怕。


    这就是微保险（microinsurance）概念出现的地方。微保险与微型金融的概念非常相似，旨在为那些可能负担不起高端保险产品的人提供保护。ACRE Africa
    在肯尼亚通过对小农的提供服务成功运行了这一模式。在接触弱势群体时，保险公司必须尝试理解基层的问题。例如，ACRE Africa 已经了传统保险系统中让农民望而远之的一些主要问题领域。


    除了负担能力，这些农民似乎对他们支付的保费是否真的能以理赔结算的形式回到他们手中表示怀疑。传统系统信任侵蚀的问题再次抬头。缺乏透明度的相关因素也在此发挥作用，并由于结算前的漫长周期而变得更加恶化。区块链驱动的
    ACRE Africa 通过将“无须的信任”（trustless trust）带回系统改变了这一切。此外，以前需要大量资源和资金的整个过程现在可以在区块链系统上一性完成。这导致了公司以及农民成本的大幅。


    另一个方面是，中心化系统通常具有僵化的数据点，如果被保险人的情况稍微偏离标准，资金发放可能会卡在循环中。为了理解这一点，请考虑一个作物被蝗灾摧毁的农民。在中心化保险体系中，理赔可能会根据地区的情况进行决赔。如果该地区的其他农场没有被破坏，保险公司可能会决定该农民不符合理赔条件。


    如果同样的情况发生在基于区块链的保险公司，理赔将在智能合约的帮助下发放，智能合约有考虑灵活数据点的规定。因此，理赔验证将基于从安装的传感器获取的数据，这些传感器触发智能合约并自动、实时释放资金。因此，蝗灾攻击会被传感器立即捕捉，使得繁琐的尽职调查程序几乎变得多余。时间线现在从平均三周缩短到在当天即可收到结算。


    区块链保险的另一个用例将与我们在下一节中讨论的医疗保健有关。目前，重要的是记住，一个将个人健康记录和历史存储在一个地方的数字包容性系统，使得保险公司核实理赔变得更加容易且更具成本效益。由于证据是数字形式的，将其整合到理赔结算的核保过程中将变得方便得多。


    除了微保险和健康保险之外，整个行业还向我们展示了几个可能已经受到区块链颠覆的细分领域：高价值物品登记、反洗钱协议、了解您的客户（KYC）程序、再保险、理赔处理、再保险——再次，可能性是无限的。


    在我们结束银行和金融领域的章节之前，我想在这里强调一个方面。我们可能认为在银行部分讨论的某些内容只与大公司有关——特别是股票交易或贸易融资——但，我们需要学习将这些视为大局的一部分。正如我们在奥地利经济学部分中讨论的，将这些方面视为孤立的实例只会导致狭隘的隧道视野。正如智者的话所说：整体往往大于部分之和。金融领域仍然是区块链颠覆最广泛的领域，这是理应的。威权和权力欲扩张的机构总是利用大众的轻信来强加不公正的监管做法。这些人的财务不安全感导致他们经常在压力下屈服。但现在，是时候让他们负责了——是时候我们在沙滩上划一道界线，拒绝被摆布了。


    # 医疗保健

    我们在非洲章节中已经看到了区块链对医疗保健的影响。患者记录被安全地记录在一个地方供授权医生访问，这一简单的事实本身就能拯救生命。再加上根灭假药贸易等更多方面，我们就拥有了一个真正改变生活的医疗保健与区块链的结合。

    '
- fmt: '

    Patient records are a bone of contention not only in developing nations, but well-developed
    nations, too. Electronic health records give the opportunity to consolidate the
    system in favor of the patient. These electronic records can be accessed between
    various systems and departments at the tap of a button on the phone screen. Such
    interoperability can save the precious time of the health professionals, as well
    as of the patient. Moreover, as we discussed in the Africa section as well, this
    kind of system gives the patient absolute control over their own medical data
    and eliminates the possibility that such data will be misused.


    While this seems to be the most exciting use case in healthcare, there are also
    considerable regulatory checks and scrutiny that the process undergoes. However,
    the pandemic seems to have catalyzed the growth of many decentralized applications,
    or `DApps`. These have been on the scene for a long time, from somewhere around
    2014-15, some even before that; but, the pandemic has diverted the attention of
    the common folk to the urgent need for such decentralized, secure platforms for
    maintaining electronic health records. Companies like `Ever`, `Patientory`, `Curisium`,
    `Chronicled`, and many others provide the user with diverse features for health
    tracking.


    As effective as these services are, they are still works in progress. The blockchain
    dream for healthcare remains one of hope, where each individual would be given
    unique identities for a digital health wallet. This would consist of every medication
    they have ever taken and every doctor they have ever consulted in their hometown,
    on a vacation, or when on a business trip—with the option for the patient to add
    any information they may feel necessary. This information would only be opened
    to access when deemed appropriate by the individual. As the blockchain healthcare
    comes of age, the current regulatory concerns are to be resolved for much smoother
    operations.


    ## Pharmaceuticals


    Blockchains have much wider application testing in the pharma-sector than the
    counterfeit drug tracking we discussed earlier. Let’s take a step back here. Have
    you ever given thought to what happens to the medication when you have already
    recovered? More often than not, the drugs pass their expiry date as they lay in
    your pill cabinet, and get thrown out, eventually. It’s not your fault, either,
    because who would you give it to anyway?


    During the `COVID-19` pandemic, the story of a couple who are both doctors in
    Mumbai, India, went viral. As the country battled with the second wave of the
    virus, gross shortages were experienced in the medication realm. This couple decided
    to adopt a very small and basic innovation. They contacted all the people from
    their circles—whoever they knew had been diagnosed with `COVID-19` at some point
    (and there were many of those people). The couple then asked them to raid their
    medicine cabinets and see if there were any medications lying around from their
    `COVID-19` diagnosis. Turns out, they managed to collect 44 pounds (20 kg) of
    unused medication, which was then distributed among the poor. This is a very minuscule
    operation, and it worked because it was a small-scaled mission. Due to the multiple
    moving parts in the collection and distribution, it could have gotten pretty messy.
    Or could it?


    Blockchains are helping pharmacies do the exact same thing on a much larger scale.
    `Good Shepherd Pharmacy`, a non-profit pharmacy, partnered with `FedEx Institute
    of Technology` at the `University of Memphis` and `Lipscomb University` in Nashville,
    to create a blockchain-powered supply chain to pick up donated drugs from around
    the area. This includes oral chemotherapy drugs that have not been used. The donors
    only have to go to the app `RemediChain` and donate them on the interface over
    their phones. These can then be distributed among those that are not able to afford
    such expensive drugs.


    ## Medical Equipment


    An exciting arena, that was only a medical fantasy a few years ago but has now
    boomed into a big industry, is the Internet of Medical Things (`IoMT`). This includes
    the interplay between multiple medical equipment: some that are used in patient
    care—like bedside monitors, ventilators, etc.—and others that are part of our
    daily health tracking—like smartwatches, fitness trackers, and so on. Blockchains
    have been playing a tremendous role in this setup, as well.


    A centralized approach to `IoMT` can be time-consuming, and even hazardous. Imagine
    a situation like this: A hospital has several branches where the devices have
    been sourced from a particular company. Now, the performance of each device at
    each hospital is tracked and analyzed back at the headquarters of the device company.
    For the time-sensitive information to be relayed back to the hospital utilizing
    the device could take days, even weeks. All the while, the patients have been
    exposed to danger and the hospital is liable to be sued. Such a system helps no
    one. Instead, on a blockchain, the verification and the relaying of the information
    is quick, and the time gap is bridged, to a great extent.


    The National Healthcare System (`NHS`) in Scotland ran a blockchain pilot to resolve
    these issues. They found that not only was this system much more efficient in
    relaying information, it also gave each hospital the advantage of knowing the
    real-time location of the device. It even provided them with the data about the
    personnel operating these devices—their qualifications, certifications, experience,
    and so on. Such data is extremely relevant when assessing, for instance, the performance
    of a new device. If the personnel aren’t properly trained to operate the device,
    the performance could be quite off and the data entirely flawed. If, at all, the
    device performance is problematic despite other things being as they should be,
    then it may mean that a recall needs to be initiated. And, it’s only logical that
    the faster the data recall, the lesser the loss. Blockchains make these faster
    recalls possible.


    ## Credentialing Protocols


    In healthcare, credentialing refers to something like an audit of the health practitioner’s
    qualifications. In order for a doctor to be able to treat patients, this protocol
    must be fulfilled when they enter a new facility. There are regular checks, too,
    that are organized to keep the information updated. This is a regulation that
    the hospitals must meet in order to safeguard the interests of the patients, as
    well as secure the reputation of the hospital. But, as useful as these may be,
    they are also tedious—requiring the hospitals to maintain, assess, and verify
    multiple records while the doctors wait to see them ,despite their qualifications.


    Moreover, the cost of the upkeep is too high and redundant, because all the hospitals
    across the board are doing the same thing but in separate silos, which doesn’t
    make sense. For instance, if one doctor moves from one hospital to another, the
    same procedure has to be completed all over again. This can be taken care of by
    a common system contributed to by all hospitals. This system can even be used
    as a healthcare provider directory.


    The `Synaptic Health Alliance` that brings together various companies in healthcare—`Aetna`,
    `Humana`, `Quest Diagnostics`, `UnitedHealth`, etc.—use blockchains solutions
    for information-sharing across the companies. Each of these companies have their
    own providers, and pooling in the resources is much more practical and useful,
    both for the healthcare providers as well as the patients. Professional Credentialing
    Exchange (`ProCredEx`) has partnered with `Hashed Health` to initiate yet another
    blockchain-driven platform that can obtain and verify information from several
    independent sources. Their work has been so impressive that it has found a user
    in the form of the `Texas Health Care System`.

