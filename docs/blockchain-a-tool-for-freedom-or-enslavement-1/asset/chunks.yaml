    非洲在医疗领域面临的问题非常广泛。无论是艾滋病毒、埃博拉热、疟疾，甚至是最近的新冠肺炎（COVID-19），整个大陆的医疗系统几十年来一直在各种健康危机的压力下挣扎。值得注意的是，这些医疗系统也在从自己的失败中吸训。对新冠肺炎的应对似乎比以前敏捷得多，显然借鉴了从埃博拉疫情中获得的经验。但是，无论医疗专业人员表现得多么高效，在资源如此有限的情况下，所能做的事情也是有限的！整个非洲一直在默默地呼唤一个能够实现更高效疾病监测以及诊断和治疗的系统。此外，非洲人对外部势力干预其医疗健康一直持怀疑态度。这些势力包括世界卫生组织和
    `Pfizer` 等大名机构，过去曾将非洲人视为其开发药物和疫苗的实验实验室中的“小白鼠”，这已经极足以侵蚀人们对这些系统的信任。


    我并不是想让自己听起来像在老调重弹，但起码说，区块链非常优雅地解决了这些担忧。区块链可以帮助建立自给自足的医疗生态系统，在保护患者数据的同时，让授权的医生能够立即访问患者的病史和医疗记录。这些受保护的数据可以成为诊断和治疗的关键决定因素。`AfyaRekod`
    就是这样一个区块链驱动的平台，患者对其自己的数据拥有完全权利。这些数据可以储存在患者端或医疗从业者端；无论哪种方式，数据都存储在单一地点，使得访问数据变得不再那么困难，特别是在紧急情况下。


    ## 信贷/贷款


    缺乏金融资本的获取是希望自创事业的小型企业家面临的最大障碍之一。只有略高于四分之一的小企业（`SMEs`）能够获得贷款。而且，这仅仅是在正式部门。想象一下非正式部门的统计数据会怎样。这一屏障对青少年的影响最大，让他们受困于贫困的枷锁中，从未给他们脱困的机会。`Paylend`
    是一家肯尼亚金融科技区块链初创公司，试图解决这一问题。在为小企业家提供贷款解决方案的同时，该初创公司还试图通过安全收集消费者数据为他们创造价值，他们可以使用这些数据定制产品和服务。


    另一个建立在 `Cardano` 上的有趣项目是 `Liqwid Labs`。它本质上是一个市场，贷款者和借款者可以通过借贷资金自由互动，参与 `Liqwid`
    协议的治理，并在过程中获得 `ADA` 令牌作为激励。


    我们已经讨论过一家公司，但在不同的背景下，那就是 `Kiva`。在本书的开头，我提到这家公司时，我是向一个寻求快速汇款的人推荐的。虽然该平台确实可以用于此，但这并不是它的主要功能；向第三世界国家的小企业主贷款才是。所以，一个在非洲的借款人会申请贷款，然后通过审核和审批流程。这笔贷款随后发布在
    `Kiva` 平台上供贷款者提取，资金随后立即传输给——那个。当借款人还钱时，贷款者可以提取资金，也可以将其用于资助其他贷款。这是一个精妙的系统，但再次，高昂的费用可能会成为障碍。


    ## WADA


    我个人认识的一个正在开展优秀基层组织是`西非去中心化联盟`（`WADA`），这是一个来自西非的组织。我老实说，我不是区块链专家；我仍在学习中。但我对区块链改变生活的能力的了解，很大程度上来自于这个组织。他们在非洲大陆正在从事真正开创性的工作。他们的主要目标是引导非洲开发者找到最合适的区块链解决方案。这是通过在非洲不同地区建立开发驱动枢纽来实现的。


    他们提出的有趣项目之一是 `Afrixx`。这是他们在 `Cardano` 上的第一个生成式 NFT 项目。这是一个非常有创意的想法，旨在重振整个文化，并让他们基于非洲传奇和偶像感到归属感。真的，这是一种将身份认同融入技术的绝佳方式。通常，早期技术的采用可能会令人生畏。但通过以
    NFT 的形式注入这种自豪的关联太棒了。通过这样的倡议，它旨在赋能非洲人民成为变革的工具，并引入社会经济措施帮助他们实现自己的梦想和愿望。


    '
- fmt: '

    Multiple governments around the world, whether belonging to the right wing or
    left wing, have exploited the masses in order to satisfy their own vested interests,
    influenced more by their ideologies than the sentiment or welfare of the voters.
    History is filled with examples of this over various time periods. Wars have been
    fought and lives have been lost under the pretense of seeking welfare for the
    citizens. Even as we speak, wars rage in several parts of the globe in the name
    of a better world. I want a better world, too, and so does everyone else. I just
    don’t want it achieved through corruption, communal and political division, and
    meaningless wars. Today we, the people, have a chance to overturn the flawed notions
    that have been propagated by various governments for centuries—blockchains are
    that chance and we would be foolish not to take it up whole-heartedly.


    As political powers make the process of governance murkier by the day, the trust
    in the workings of the government has been decreasing, too. This is not just the
    case with developing nations, but also with the developed ones around the globe.
    The Canadian government recently imposed a blanket freeze of the accounts that
    donated even the smallest amount to the protests opposing the government mandate,
    discriminating between people based on their vaccination status. Though it unfreezed
    most of them about a week later, there’s speculation that some will never be restored.
    The blatant abuse of power just seems completely unjustified. Even crypto exchange
    `Kraken`, handling the crypto assets of some protesters, was mandated to be frozen
    despite the cryptocurrency not falling under government regulation. People have
    gotten tired and distrustful, and rightly so, of the fake promises made to safeguard
    voters. What’s more, the election procedure itself is so muddled that even the
    best democracies also find themselves reeling in the after-effects of corruption
    aimed at hijacking the democratic process.


    Take, for instance, the elections in recent years in India and the United States.
    In India, they have been making use of electronic voting machines (`EVMs`), as
    they are supposed to be better for accuracy. However, in almost every election,
    there are reports of random people walking out with certain `EVMs` without the
    proper protocol. Furthermore, there have also been reports that say that `EVMs`
    can be hacked into to make it look like the citizen has cast their vote to a particular
    party, when indeed the vote is going to someone else. How then can a citizen be
    certain about his vote, even with the use of `EVMs`?


    Even in the last U.S. presidential elections, so many questions were raised by
    the defeated Republicans about voter fraud. Of course, these two countries have
    a very different voting procedure. And, all the claims of voter fraud in the United
    States were investigated and, though there were irregularities, the courts did
    not see it as a widespread attempt to interfere with the election but isolated
    incidents. But, imagine the time and the financial resources going into this procedure.


    What if there was a system where questions about validity would never arise? Well,
    this isn’t a fantasy, anymore. Blockchains do the task of bringing that trust
    back into the system. And, multiple countries and states have been using this
    technology to protect their democracies. You might be surprised to know that the
    state of Utah was one of the states where the citizens could vote by email. But,
    I’ll talk more on that a little later.


    One thing I want to stress here is that, no matter which government comes to power,
    and no matter which party or politician it is, we must understand that power is
    bigger than any of these. This means that, no matter who you vote for and who
    wins, the people in power need to be held accountable. It’s a matter of human
    nature more than character—power and greed corrupt the best individuals. Moreover,
    the point of democracy is not to cheer from the sidelines for your favorite horse
    to win and then put them on a pedestal. Rather, on the contrary, it is to be able
    to ask them questions about their actions, and a lack thereof. I urge you, once
    again, to not look at this from a political lens as much as from the vantage point
    of human behavior. And, you will realize that the government is not about picking
    your favorite side, but to hold whichever side wins liable to the promises they
    made for the betterment of public life. Let’s try to understand how blockchains
    are making governance more effective worldwide.


    ## The Blockchain Governance


    The first thing we need to know about blockchain-based governance is that the
    aim of such an initiative would be to give you the highest amount of power—to
    create a democracy, in the real sense. Think about the democracy that we live
    in as of now; we choose representatives to carry forward our grievances or our
    support for certain policies, ideologies, issues, etc. More often than not, we
    find ourselves disillusioned by these representatives, who later turn out to have
    their own agendas. In a way, these representatives are also middlemen that we
    have chosen to have a functional hierarchy, don’t you think?


    Now, one thing, I am guessing, we have understood very well by now is that blockchains
    hate middlemen. So, what if, instead of choosing these representatives, you could
    vote directly on the concerned issue from the comfort of your couch? This idea
    may seem quite out there to many, but some of the blockchains have been using
    this truly decentralized ideology in their own functioning. If scaled appropriately,
    there isn’t a reason why they shouldn’t be able to create a completely decentralized
    government in the future. We talk about this in detail in our next section on
    the functioning of the `Cardano` blockchain. But, before that, let’s start small
    and try to understand how blockchains would fit into our present governance models,
    first. Honestly, this is no less of a feat than changing the entire system. Blockchains
    have been playing the role of a disruptor in many sectors of governance. Let’s
    look at a few.


    ### Urban Management


    We already mentioned the smart city project in Entebbe, but now let’s dig a little
    deeper. Why have smart cities gotten so much attention lately? Is it just the
    desire to hop aboard the technology trend? Maybe, but there is also a practical
    reason. We, as a society at large, are in a dilemma. We wish to expand our urban
    settlements to support the growing population needs, but we also want to reduce
    the budgets that we devote to this. Smart cities resolve this issue elegantly
    by drastically cutting down on the time, as well as financial resources, needed.
    The efficiency that they bring to the functioning is a wonderful by-product.


    Whenever there is a big technology on the horizon, the skeptics are worried about
    the changes. Blockchains have been no exception. Many people have leveled criticisms
    against blockchains coming not out of informed awareness, but misguided ignorance.
    But, despite the resistance in the beginning, some countries, as well as cities,
    are leading the world to the evidence of prosperity this technology can usher.
    Be it countries like Estonia or big cities like Dubai, people are reaping the
    benefits of a blockchain-based governance. You might thus think that blockchains
    are only for countries as a whole, or big cities like Dubai. While it is true
    that blockchains are much more useful when adopted by bigger systems because of
    the sheer interoperability that these systems provide, it is not a prerequisite.
    Take the example of `Zug`, Switzerland. `Zug` is a small town and also the first
    in the world to adopt `Bitcoin` as a means of government payments. What started
    with a small experiment at the municipality level has now developed into an ecosystem
    so intricate that it is now called “crypto valley.”

