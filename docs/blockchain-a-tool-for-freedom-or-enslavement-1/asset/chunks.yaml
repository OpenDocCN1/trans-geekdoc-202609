    \ one it does will depend on how we choose to act on our knowledge of this technology.\n\
    \n# Part III: Blockchains for Evolving Societies\n\nNow that we have a solid foundation\
    \ of the technological, political, and socio-economic understanding of blockchains,\
    \ it’s time to deep-dive into the full-fledged application of blockchain technology\
    \ to communities at a local, national, and even global level. In this part, we\
    \ attempt to make a strong case for using blockchains to evolve societies into\
    \ more transparent and, thereby, efficient units. \n\n# Chapter 6: Blockchains\
    \ for Small Communities\n\nThe cryptocurrencies and blockchain technology are\
    \ somewhat like the actors and the writers. While actors sometimes grab all the\
    \ glamor and attention, without writers there wouldn’t be much left for the actors\
    \ to do. Blockchain technology may not be hogging the limelight too much, but\
    \ the applications are truly mind-boggling. We have already seen the staggered\
    \ examples of how blockchain technology is changing the world. Now, it’s time\
    \ to look at the full-fledged social impact that blockchains are having right\
    \ around you. When you see how impactful the grass-root level work in this arena\
    \ is, you will be able to come to terms with how blockchains are changing your\
    \ life without you even realizing it."
