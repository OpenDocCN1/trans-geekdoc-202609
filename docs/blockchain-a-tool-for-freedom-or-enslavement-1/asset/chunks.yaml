- fmt: "\nThink of it as the loop of alcohol addiction one may be caught up in. In\
    \ the beginning, the alcohol makes him feel light and high. But, as the initial\
    \ high fades off, what’s left behind is a disoriented body, a guilty conscience\
    \ and the financial burdens. When the frustration of all these shortcomings climbs,\
    \ as tempting as it may be to drown oneself in the alcohol again, it is hardly\
    \ a solution. Getting through the difficult withdrawal symptoms might, indeed,\
    \ do much more good for the person. \n\nEssentially, Austrians believe that when\
    \ the money supply remains constant, even though the immediate consumption might\
    \ be restricted, the long-term savings would increase. Imagine a world where the\
    \ value of your currency could increase rather than decrease. If you knew this\
    \ was to happen, would you want to spend all your money today, or save it for\
    \ the future where it would fetch you a better value? On the other hand, money\
    \ whose value decreases over time, as is the case in our current society, leads\
    \ to a `YOLO` (`You Only Live Once`) kind of an attitude where reckless consumerism\
    \ is encouraged, regardless of the cost. \n\nFrom the business perspective, appreciating\
    \ money would also reduce malinvestments in projects which gives one an illusion\
    \ of growth only during the times of inflation. If the inflation were to drop,\
    \ these would become unprofitable at the drop of a hat. To put it simply, investors\
    \ would only contribute to projects that would be profitable in the long run,\
    \ rather than falling for the illusion of profits in the immediate future. \n\n\
    In 1972, a Stanford professor, Walter Mischel, proved with mere marshmallows that\
    \ children who could delay gratification tended to have healthier, happier, and\
    \ more successful lives as compared to their counterparts that could not. Austrian\
    \ economics worked out the same logic for the economies not years, but centuries,\
    \ back. And yet, here we are trying to reinvent the wheel every chance we get\
    \ and still come up with more of the wrong solution: unsound money. \n\nGlobally,\
    \ too, this unsound money has brought to the fore many issues. As it has to go\
    \ through the hassle of conversion, it gives an implicit power to certain economies\
    \ with higher conversion rates than others. This has led to multiple trade conflicts,\
    \ inevitably leading to war and loss. Imagine if there was one global currency\
    \ that you could use without the restrictions of national borders. This has the\
    \ potential to root out much of the current global conflict. \n\nSound money,\
    \ then, would need to have the features that counter the evil brought in by unsound\
    \ fiat money, the most important one of which would be stability through time.\
    \ Even though sound money appreciates over time, the appreciation is not suddenly\
    \ brought about by artificial elements. Another characteristic that sound money\
    \ needs to have, but the current fiat money doesn’t possess, is indestructibility.\
