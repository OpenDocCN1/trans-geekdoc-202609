  trans: '

    世界各地多个政府，无论属于右翼还是左翼，都为了满足自身的既得利益而剥削大众，受意识形态的影响远大于对选民的情绪或福利的关注。历史上充满了各个时期这种现象的例子。战争曾以寻求公民福利为名义爆发，并导致了生命的丧。。此时此刻，战争仍在全球多个地区以“为了更美好的世界”的名义激烈进行。我也想要一个更好的世界，每个人都是如此。我只是不想让它通过腐败、派系和政治分裂以及毫无意义的战争来实现。今天，我们这些人民有机会去推翻几个世纪以来由各种政府传播的错误观念——而区块链就是这个机会，如果我们不全心投入地接受，那就是愚蠢了。


    随着政治权力让治理过程变得日益发模糊，人们对政府运作的信任也在不断下降。这不仅发生在发展中国家，也发生在全球范围内的发达国家。加拿大政府最近冻结了所有对反对政府强制指令的抗议活动捐赠过即使是最小金额的账户，根据人们的接种状态对他们进行歧视。尽管他们在约一周后解冻了大部分账户，但有推测，某些账户可能永远无法恢复。这种对权力的公然滥用似乎完全是不合理的。即使是处理某些抗议者加密资产的加密交易所
    `Kraken`，尽管加密货币不属于政府监管范畴，也被要求冻结。人们对那些为了保护选民的虚假承诺感到疲惫和不信任，而且这是理应当的。此外，选举程序本身是如此混乱，以至于最好的民主国家也发现自己仍在旨在劫持民主进程的腐败后遗中挣扎。


    以最近印度和美国的选举为例吧。在印度，他们在使用电子投票机（`EVMs`），因为它们被认为更具准确性。然而，在几乎每次选举中，都有报告称随机人员在没有遵循适当流程的情况下带走了某些
    `EVMs`。此外，还有报告称 `EVMs` 可以被黑客攻击，使其看起来公民将选票投给了某个政党，而实际上选票却给了别人。那么，即使使用了 `EVMs`，公民又如何能确定自己的选票呢？


    即使在最近的美国大选中，失败的共和党也对选民欺诈提出了许多问题。当然，这两个国家的投票程序非常不同。而且，美国所有关于选民欺诈的指控都经过了调查，尽管存在不规范之处，但法院并未将其视为干预选举的广泛尝试，而是孤立事件。但是，想象一下投入这一程序的时间和财务资源。


    如果存在一个系统，关于有效性的问题永远不会出现呢？嗯，这不再是幻想。区块链承担了将这种信任带系统的任务。而且，多个国家和州一直在使用这项技术来保护他们的民主。你可能会惊讶地发现，犹他州是公民可以通过电子邮件投票的州之一。但我稍后会详细讨论这一点。


    我在这里想要强调的一点是，无论哪个政府上台，无论是哪个政党或政治家，我们都必须理解权力大于其中任何一个。这意味着，无论你投给谁，无论谁获胜，掌权者都需要负责。这更多是一个人性问题，而非性格问题——权力和贪婪会腐败优秀的人。此外，民主的意义不在于在场外为你喜欢的赛马欢呼并将他们推上神坛。相反，而是能够对他们的行为以及缺乏某些行为提出提问。我再次敦促你们，不要仅仅从政治角度来看这个问题，而要从人类行为的角度来看。你会意识到，政府不是为了选择你最喜欢的一方，而是为了让任何获胜的一方对他们为了改善公共生活所做的承诺负责。让我们尝试理解区块链如何让全球的治理变得更有效。


    ## 区块链治理


    关于区块链治理，我们需要了解的第一点是，此类倡议的目标将赋予你最高水平的权力——创建一个真正意义上的民主。想想我们现在所生活的民主；我们选出代表来传达我们的诉求或对某些政策、意识形态、问题等的支持。很多时候，我们发现自己对这些代表感到幻灭，因为他们后来被证明有自己的意图。在某种程度上，这些代表也是我们为了建立功能性层级结构而选择的中间人，你不觉得吗？


    现在，我猜我们现在已经很好地理解了一点，即区块链讨厌中间人。那么，如果不是选择这些代表，而是你可以坐在舒适的沙发上直接对相关问题进行投票呢？这个想法对许多人来说可能很离谱，但某些区块链已经在其运作中使用了这种真正的去中心化意识形态。如果规模扩大得当，没有理由它们在未来不能创建一个完全去中心化的政府。我们将在下一节关于
    `Cardano` 区块链运作的章节中详细讨论。但在那之前，让我们从小处开始，尝试理解区块链将如何融入我们现在的治理模型中。诚实地说，这一成就与改变整个系统不相上下。区块链在治理的许多领域一直扮演着颠覆者的角色。让我们来看看。


    ### 城市管理


    我们已经提到了恩特贝（Entebbe）的智能城市项目，但现在让我们深入挖掘一下。为什么智能城市最近受到如此关注？仅仅是因为跟上技术潮流的渴望吗？也许吧，但还有一个实际原因。我们作为一个社会正处于一种困境。我们希望扩大城市定居点以支持增长的人口需求，但我们也想减少投入其中的预算。智能城市通过大幅减少所需的时间和财务资源，优雅地解决了这个问题。它们为运作带来的效率是一个极好的副产品。


    每当地平线上出现重大技术，怀疑者就会担心变化。区块链也不例外。许多人对区块链提出的批评并非基于知情，而是基于误导性的无知。但是，尽管最初存在阻力，一些国家和城市正在向世界展示这项技术能带来的繁荣证据。无论是爱沙尼亚这样的国家，还是迪拜这样的大城市，人们都在从区块链治理中获益。你可能会认为区块链只适用于整个国家或像迪拜这样的大城市。虽然由于区块链在被更大的系统采用时由于这些系统提供的互操作性确实更有用，但这并不是先决条件。以瑞士的楚格（`Zug`）为例。`Zug`
    是一个小镇，也是世界上第一个采用 `Bitcoin` 作为政府支付手段的地方。这个从市级层面开始的小实验现在已经发展成了一个极其复杂的生态系统，现在被称为“加密谷”。

    '
- fmt: '

    Why go that far!? We have a smart city coming in Cochrane, a tiny town in the
    middle of nowhere in North Ontario, Canada. As we saw in parts of Africa, the
    pandemic has been a wake-up call for people here, as well, and the Board of Trade
    has taken this opportunity to create a self-reliant town, with the blockchain
    and cryptocurrency to play a pivotal role. This might seem like a small beginning,
    but it’s expected to rake in pretty investments in the coming times. I find myself
    personally excited by this development because I love the idea that blockchain
    is no more a technology of the future, or something that only bug players want
    to be a part of! It’s right now and right here, so close to each and every one
    of our lives. You can be sure that a big part of your lives are going to be touched
    by blockchains in the very near future, if it hasn’t done that already, that is.


    The beauty of blockchain implementation lies not in the brilliant theory of the
    technology, but the practical application of it in the lives of people like you
    and me. Take a simple example of a broken street light. Think back to how long
    it took for someone to come and repair it. Manual monitoring of such details is
    a daunting task. Now, imagine a blockchain entering this situation. Street lights
    are installed with sensors in them. The moment something goes wrong in the light,
    a smart contract is triggered that generates a job to be completed to a technician
    who immediately comes and repairs the light. Since it is on a blockchain, the
    credentials of the person doing the job are verified, and the data is stored for
    any such problems that may occur in the future. This data could then be used to
    audit the company that has installed the lights and the sensors, using government
    funding. This also keeps quality assurance in place and keeps tabs on corruption.
    This is how simple the application of blockchains in your life can be.


    No matter what technology it is, until and unless you understand how it impacts
    you, it means nothing. A grand technology that doesn’t make life easier and better
    for you is a wasted opportunity. But, at the same time, it would also be a wasted
    opportunity, maybe a bigger one, if you don’t identify the significance this technology
    brings in—if you don’t participate.


    ### Food Safety


    Most people think that unavailability of food is what leads to people suffering
    from malnourishment in third-world countries. Reality, however, is a little more
    complicated. Sure, food scarcity is a real thing; but, while millions of people
    are sleeping hungry at night, tons of food gets dumped in garbage, too. The number
    of people suffering from hunger could be much smaller.


    The reason the produced food doesn’t reach as many people is, in the modern world,
    food goes through complex supply chains. Furthermore, these are closed and opaque
    processes which makes it even harder to pinpoint the problem, let alone work through
    it. As is to be expected, hunger is only one of the injustices that are born out
    of this. With such practices, sustainability has been tossed out of the window
    for decades now. And, we have already seen how it impacts the farmers, making
    their lives increasingly difficult. All in all, these excessively long, complex
    supply chains do no good for anyone. But, what’s strange is, until recently, never
    has much attention been paid to reducing this inefficiency and the resulting waste,
    but most efforts have always been directed to increasing productivity.


    Blockchains have been the perfect disruptor here, because of the wide gap of unaccountability
    that existed before. Today, many players have entered the arena and are actively
    using blockchain. `Walmart` is one such beneficiary. If you have been buying any
    greens, chances are you have already heard of the digital ballots, as `Walmart`
    has made it mandatory for its suppliers to upload details. Another major company
    which is the first among food companies to use blockchain is `Nestle`. Supply
    chain would also have a supplementary role to play in the case of agricultural.
    They could give us crucial data about consumer behavior, which in turn would be
    helpful in determining the demand. Tailoring the supply to this demand more closely
    would be effective in reducing wastage; the excess can then be directed to locations
    which might have unsatisfied demand.


    An increased awareness of sustainability and a growing empathy for our counterparts
    have thankfully led to a blockchain movement. The government would play a major
    role in promoting adoption in the public sector. Through the standards and policies
    they set, they would be able to make the transition much smoother.


    ### Voting


    Democracy sounds like a fantastic concept, a great exercise in affecting the will
    of the people, but what happens when people don’t care? Voter apathy is a concern
    that has plagued all democratic elections across the globe. You’d think, as the
    corruption grows, there would be a higher number of people coming out to vote.
    But, it rather seems to be working the other way around; as the trust goes down,
    so does the number of voters who actually think voting has an impact on the present
    functioning of things. An excuse commonly given is that voting is a tedious process
    that takes up a lot of time. Now, imagine there was a way for you to vote as easily
    as by picking up your phone and tapping a button on your screen. Would you take
    it? Most people would, and if you live in places like `Utah County`, `West Virginia`,
    etc. chances are you have already heard of them.


    Companies like `Voatz` and `Follow My Vote` take care of the end-to-end voting
    procedures, allowing citizens to cast their votes through their phones. While
    the use of blockchains in voting has been appreciated, questions and criticisms
    have been targeted at the companies'' infrastructure. Critics are still not convinced
    about the confidentiality of the entire process. They believe that, since a lot
    depends on the security used by the voter’s network, the websites could easily
    be hacked into. The `Voatz` officials have confirmed that their technology has
    a feature that enables them to identify and reject the votes cast from unsecure
    networks. It’s worth noting that their procedures have also stood the test of
    live auditing.

    '
