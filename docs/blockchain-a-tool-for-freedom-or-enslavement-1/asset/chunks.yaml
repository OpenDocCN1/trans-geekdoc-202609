  trans: '

    如果你问我的意见，我不会！尽管那位医生可能才华横溢，但团队的共识并非源于对证据的充分讨论，而是源于他们相信领导绝不会出错。在这种情况下，即使一名年轻医生对某事有不同意见，这种意见也可能无法进入核心，因为在这种场景下，任何个性或冲突都会被含蓄地遏制，而从性则得到了强化。


    这种情况在集权结构中发生的概率远比去中心化结构得多。现在，想象一下医院的这位医生给出了诊断，然后你带着诊断去其他医院的其他医生那里寻求第二次第三次意见。他们更有可能以公正的角度看待这一诊断，因为他们没有受到这位医生有多优秀的影响。更有可能的情况是，他们根据症状证实该意见并得出自己的结论。当然，为了方便理解，我在这里过度简化了问题，但你明白我的意思。重点是，更快的决策并不总是更好的决策。


    正如 T.S. 艾略特（T.S. Eliot）辞藻地说道：“这个世界上大多数的恶是由心怀善意的人造成的”（T.S. Eliot Quotes, n.d.）。如果你从历史背景来看这句话，人类面临过的几乎所有灾难性事件，无论是大屠杀还是任何其他形式的所谓种族灭绝，无疑都是权力集中在一个政党、个人甚至一种意识形态中的结果。


    去中心化极大地降低了此类灾难发生的概率。去中心化结构，特别是利用区块链的结构，在验证证据后达成共识的能力要好得多。这些结构促进了个性和对原则的遵循，而不是对群体或个人的遵循。人们认为它们的共识达成机制是消耗资源的且仍需完善，但正如我之前提到的，区块链仍在增长。基于我们在这一领域看到的创新，我们可以预计未来在像
    `Ouroboros` 这样的环保共识机制方面会有更多工作。


    每当谈到区块链去中心化时，经常提出的另一个论点是担心此类在线网络中可能出现的犯罪活动。我无数次看到人们将“在线”自动等同于“阴暗”。媒体中区块链技术的反对者以及政府和监管机构，继续利用这种恐惧和无知在人们脑中灌输错误信息，而如果他们能获得正确的信息，他们确实会有不同的看法。例如，有一种说法认为区块链因为匿名性而支持非法交易。数据表明并非如此。


    2011 年的“丝之路”（`Silk Road）丑闻是许多指责区块链技术人士喜欢的案例。罗斯·乌尔布希特（Ross Ulbricht）因经营名为 `Silk
    Road` 的暗网黑市平台被定罪，毒品交易、洗钱等非法活动在那里猖獗。乌尔布希特被处终身监禁。区块链技术的批评者利用这一惨剧为区块链去中心化的辩论下了一个过早的定论。但，这就是他们不理解的地方。FBI
    打击后收集的证据确实在很大程度上之所以可能，是因为利用了加密货币区块链。由于数据是如此去中心化，它无法被操纵。同时，交易的透明性实际上让所有搜查令和监控的文件工作变得完全多余，加速了定罪过程。


    对于那些主张传统金融机构而非区块链解决方案的人表现出的优越感，如果我们考虑到使用法币实施以及为了法币而犯罪的高昂犯罪率，这种态度是令人惊讶的。当然，法币交易是非法活动的温床这一事实，不能作为去中心化区块链上可能发生的犯罪的辩护。说区块链完全免疫此类活动是不准确的；它们绝不是。但，信不信由，在区块链不可篡改的分布式账本上追踪犯罪远比在现金非法交易的物理黑市中要容易得多。


    我想在此指出，这并不是在试图说服你采用去中心化意识形态，而是为了创建一个开放的交流渠道，让你能够看清你周围正在发生的巨大而微妙变化的本质。重点在于开始对话，也许最终通过承诺增加对这项技术的参与，为自己争取改变现状的主动权。


    ## 通用人工智能的角色


    几年前，先进的人工智能曾是科幻电影里的素材，演员扮演着未来人类的角色。我们都想：“那永远不会发生，但看起来确实很有趣！”快到 2016 年，机器人索菲亚（`Sophia`）登场，她用幽默的回答和近乎人类的外表及部表情让我们叹为观止。不，她不像老派的《终结者》施瓦辛格那么酷，但她是第一个会开笑话的真实机器人。当然，机器人并不是真的在说话，而是内部插入了一个带有预设回答的聊天框。但这个机器人有趣的地方在于，它可以感知与它对话的人的情绪和语言语调。它的创造者大卫·汉森（David
    Hanson）声称，随着时间的推移，记录和分析这些回答会让索菲亚变得更聪明、对人类反应更敏感。这是一个多么大的跨越！


    我提到这一点是因为这只是人工智能取得的百万进步中的之一——从你的 `Netflix` 推荐，到广告商发现并向你推销你一直在寻找的精确礼物。人工智能已经成为我们生活中不可或缺的一部分。尽管索菲亚可能无法帮助你过得更轻松，但那些更微妙的机器学习应用确实可以通过它们的算法做到。


    是的，我谈论的是那些永远神秘的算法，它们是深夜派对谈话中多个阴谋论的主题。稍微了解一下营销技术就会告诉你，这些算法并不是阴谋，而是一种帮助你在广阔、复杂的互联网领域连接到所需确切资源的好方法。信不信由，这些你有时觉得很讨厌的算法正在为许多行业提供喘息，甚至包括医疗保健。


    然而，这些算法的问题在于，为了有效，它们（通常）也必须具有侵入性。它们需要个人数据，这可能对你的隐私、甚至身份问题产生潜在危害。如果你关注过，你会记得当你登录某个应用程序——比如
    `Facebook`——时，你允许你的个人数据被使用。你可以确定，所有的社交媒体公司都在追踪你的所有数据，它们对这些数据所能做的一切没有限制。

    '
- fmt: '

    You’ll often hear quite the Utopian version of the progress that AI is making.
    The CEOs and the founders of the companies leading the AI revolution are constantly
    appearing on our phones screens, newspapers, and televisions preaching how wonderful
    the future looks with the ever-evolving AI scene. Needless to say, the wonderful
    future they are painting is not without limits. While these companies will likely
    be the biggest beneficiaries, as they are even at present, the benefits trickling
    down to the general population can be expected to be significantly limited in
    scope, especially if the current trends of power continue. As is obvious, these
    Silicon Valley technology leaders have done everything to keep the power concentrated
    in their own hands. This shouldn’t be surprising, either, because no matter what
    anyone says at the end of the day, it’s not so much about welfare as it is about
    the big bucks.


    Elon Musk, recently in news for taking over Twitter (among other things), has
    been one of the few skeptics. Long before the Twitter takeover revitalized the
    talks of a decentralized social media, Musk founded the non-profit research company
    `OpenAI` in 2015 to ensure that the advancing AI benefits all of humanity before
    it fills the pockets of the big-tech companies. When asked about the AI future
    in an interview, Musk beautifully reiterated one of Lord Acton’s quotes, “Freedom
    consists of the distribution of power and despotism in its concentration” (Elon
    Musk Viral Videos, 2018). In this interview, he opened up about his growing concerns
    of how the brilliantly advancing AI might not always be used for the better, especially
    when the helm of this ship is kept in the hands of the powerful few. Coming from
    a person like Musk, who is right in the midst of the technological changes, these
    concerns may well serve as cautions for the rest of us, alerting us to the dangers
    of centralization yet again. In these fast-changing circumstances, imagine what
    a mix of blockchain and `AGI` can do. Blockchains can be the decentralized antidote
    to the centralization venom spreading fast in the AI sector. It can practically
    root out the problem of privacy intrusion completely and give you the best of
    both worlds—effective algorithms with encrypted and secure personal data.


    Note that, just as blockchains can make the machine learning experience better
    for participants, it also works the other way around. `AGI` also has a huge role
    to play in blockchain decentralization. In fact, a decentralized model that combines
    blockchains with artificial general intelligence (`AGI`) can leverage a much larger
    vista of resources for bringing about development. They both can help each other
    reach their maximum potential in the true sense.


    As in the case of `Sophia`, machine learning requires large quantities, as well
    as better quality of data, to be able to predict the outcome more and more accurately.
    Blockchains are a great source for both. Industries have started utilizing this
    blend of both in numerous sectors. For instance, in healthcare, patient data stored
    on a blockchain can be analyzed by an artificial intelligence model to reveal
    patterns across communities, which can then be utilized to design healthcare policies
    and, even, manage caregiving models better. In a nutshell, decentralized artificial
    intelligence on blockchains is a trend that you cannot ignore anymore. `SingularityNET`
    is one such blockchain-driven AI network. There are even talks of a partnership
    between this platform and `Cardano` to provide AI-based blockchain solutions to
    deal with pertinent challenges across the globe. The moral of the story is that
    `AGI` and blockchains are an unstoppable combo, and a lot more upgrades can be
    expected as both of these grow together.


    ## Into the Metaverse


    If you are even slightly interested in technology, there’s a high chance that
    you have heard this term in recent times: the metaverse. If Facebook turning into
    its ‘Meta’ brand wasn’t a hint enough, then it’s time for you to dig deeper. This
    has the potential to take decentralization to another level in the coming years.
    A word of caution, though, before we dive into it—the metaverse is still a very
    new concept and it might be a little too early to talk about it with absolute
    certainty. But, what speculation points towards at the moment is very interesting,
    indeed.


    If you feel like the metaverse appears to be a cryptic concept with a sci-fi air
    to it, then you are actually onto something. The concept actually comes from a
    1992 novel named `Snow Crash` by Neal Stephenson. This is, indeed, a testament
    to how technology is blurring the boundaries between fiction and reality. When
    you play multiplayer games online, you are already interacting with people beyond
    the boundaries of your geographical location, in the various avatars you created.


    But, mind you, gaming does not equal metaverse; for instance, `Fortnite` has a
    specific gaming objective. There are also concerts and events that you can participate
    in virtually. While `Fortnite` exhibits aspects of the metaverse, it is not a
    metaverse in itself, at least not the kind that we envision. To be considered
    a metaverse, it would have to be much wider in scope.


    For our purpose, we look much beyond the entertainment and leisure aspects of
    metaverses. Blockchains can prove particularly convenient for a few aspects of
    the metaverse as we have come to expect them.


    *   **A never-ending online experience**: The metaverse would be persistent and
    expanding, just like the physical reality we live in. There would be no barriers
    to this experience, neither personal nor professional, neither private nor public.

    *   **Multiple stakeholders**: Think of our physical world belonging to one person
    or entity. Seems like a ludicrous idea, isn’t it? We live in a free world and
    the metaverse is, at least in theory, meant to replicate this freedom with multiple
    contributors coming together to create a free-moving online world.

    *   **An interoperable economy**: This essentially means that, despite the various
    contributors coming together, the metaverse would have a seamless interoperability,
    creating a fully functional economy, with buyers and sellers all on the online
    plain.


    Though the details of the metaverse remain largely in the works at present, one
    thing we know is that to ensure the smooth working of the above aspects, the metaverse
    would have to be a massive data collector, possibly even bigger than the social
    media as we see today. While the social media applications and gaming universes
    (like `Fortnite`) are very basic and platform-specific, the metaverse is expected
    to be all-encompassing. Think of your real life being transformed into virtual
    reality: a virtual space where you work, buy, sell, and socialize with others
    regardless of their location—that is the closest we can get to describing metaverses.
    Blockchains could be the much needed inherent data security protocols that the
    metaverse needs.


    Moreover, the `NFTs` or the non-fungible token technology of blockchains is the
    key link in the blockchain metaverse. Imagine you have two $20 bills. If I take
    those from you and hand you back four tens, you’d still have the same amount.
    That means the tens and twenties are fungible. However, when two commodities have
    unique value which is not exactly comparable, you’d have NFTs. For instance, if
    I ask you to pick from your home something that’s most valuable to you, you might
    pick a customized diary that your friend gave you and I might pick up my favorite
    painting. These two values are just not comparable. In some cases, you may come
    to a mutual decision as to how to measure the value of these. For example, I may
    say that I can sell the painting at so-and-so cost but that would have to be agreed
    upon by both the parties and is not inherent in the object.

    '
