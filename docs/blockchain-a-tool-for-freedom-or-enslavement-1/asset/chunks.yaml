    正如前面提到的，区块链的传奇始于 2008 年，当时一个个人（或一群人）以 `Satoshi Nakamoto` 的笔名发表了一篇论文。但是，目的是什么呢？在传统金融系统的那些已经运行良好的机器存在的情况下，为什么有必要发表一篇介绍全新全新系统的论文呢？但等一下，那些机器真的运行良好吗？事实证明，它们并非如此。金融危机揭露了一些困扰我们金融世界的相当严重的问题：其中之一就是所谓的我们金融安全“守门人”——银行的欺诈本质。而且请记住，这些欺诈性银行为了自身的既利益，同时得到了左翼和右翼政党的的支持。太多的人失去了毕生积蓄，被推向了破产的边缘。


    就在这时，一直潜伏在表面下的不满以全火力之势爆发出来。不仅仅是因为写了区块链的论文，更重要的是它在经济的许多领域引发了好奇心。这主要是因为这篇论文提到了一种可以完全绕过欺诈性金融机构的技术。


    这是一个前所未有的想法，因为直到现在，人们一直认为这些机构是顶级机构，没有它们的批准，任何交易无法进行。现在，有一群人完全抛弃了这种观念，并谈论创建一种平行货币，即著名的
    `Bitcoin`。这种货币被认为存在于没有国家权威的世界中。尽管我们至今仍不知道 `Satoshi Nakamoto` 是谁，但我们知道这一点：发明加密货币的人，甚至支持它的人，并不是普普通通常的人。他们是专业的程序员，深谙系统的内部运作机制。事实上，这个想法的首次描述早在互联网热潮出现很久以前提出的。`Stuart
    Haber` 和 `W. Scott Stornetta` 已经提出了为数字文档生成时间戳的观点，以便它们不会被追溯修改日期。他们以及许多其他类似的密码学家不相信中央化治理会产生干预。但是，人类真的能够在没有外在权威力量的情况下运作吗？


    ## 通过自发秩序获得自由


    这可能令你感到惊讶，但人类并不需要为了过上普遍福祉的生活而外部司法管辖。不要只听我的，但这是一个至少有 2500 年历史的想法。许多年前，一位中国哲学家`庄周`
    提出了完全相同的观点。他认为，如果让事物随其任之，它们就会找到良好的秩序。如果你对经济感兴趣，你可能会发现这个想法与诺贝尔奖得主 `Adam Smith`
    所说的有些相似——即社会可以在没有政府干预的情况下处于完美的和谐状态。尽管“自发秩序”这一特定术语后来才在 `Michael Polanyi` 的作品中出现，但其概念始终未变。此外，这并不是一个特定特定文化的现象，而是一个非常普适的观察结果。


    正如法国经济学家 `Frederic Bastiat` 正确指出的：“生命、自由和财产之所以存在，并不是人类制定了法律。相反，正是因为生命、自由和财产在先就已经存在，才使人类制定了法律”（引用自《法律》，The
    Law, n.d.）。


    正是这种自发秩序的思想，这种从压迫性系统中获得绝对自由的理念，驱动了区块链技术的核心。长期以来，这些外部影响的程度一直存在争议。历史为我们提供了大量的证据，表明模糊国家与银行之间的界限如何创造出一种极其有毒的混合物，可能使它们的生存轨迹变得更加恶劣。而且，如果你是一个像我一样热爱自由的人，你会支持主张国家与金融机构分离的论点。区块链通过将国家从我们的日常交易中分离出来，使这种自发秩序成为可能；这正是区块链技术值得为之奋斗的原因。


    ## 右、左与自由


    每当我谈论区块链的哲学和意识形态背景时，我都能感受到来自政治光谱不同部门的悲观抵制。那些宁愿信从区块链的无知也不愿接受其创新的媒体和政界群体，往往为了既利益将先进的区块链技术变成一个政治问题。结果是引发了一场关于谁该为这种“激进”方法负责的辩，而从未真正对过程本身获得启蒙性的见解。


    这里需要理解的是，无论你认同政治辩论的哪一方，区块链都能让我们每个人的生活变得容易得多。正如我之前提到的，这项技术无论你来自何处，都能为我们创造一个更好的世界。我之前说过一次，这不是左翼和右翼之间的战斗。但如果我们不进一步拆解这场辩论，就像在拼图正中间留下了一个巨大的洞。


    当每个人都忙着宣誓对右翼或左翼的忠诚时，更重要且可能更相关的辩论被抛到了窗外：国家主义与个人主义的辩论。国家主义是一种推崇权力集中的意识形态，其目的仅仅是将公民变成国家监管和政策的奴隶。


    这句话听起来可能有些严厉，但事实是，尽管我们一直在谈论在全球范围内发生的宗教战争，但我们从未处理过我们处处肆延的国家主义宗教。这不是秘密，在过去一个世纪里，政府干预夺夺的生命比任何事情都多。然而，我们继续信任同样的政府来制定管理我们财务、医疗保健等许多方面的法律。正如
    `Thomas Sowell` 著名的所说：“很难想象有比把决策交给那些对错误不付出代价的人更愚蠢、更危险的决策方式了”（引用自 Thomas Sowell
    Quotes, n.d.）。区块链有潜力改变这种对权威和意识形态的假设依赖。它们有可能以最不常规的方式解放我们。


    ## 区块链是如何工作的


    既然我们已经了解了原理，让我们更深入地理解一下这个过程。区块链本质上是一个可以存储记录的网络。这种防黑的系统使得数据伪造几乎是不可能的。因此，数据并不是只记录在一个地方，而是被同时存储在多个地方——这意味着即使一个来源可能被操纵，记录的副本也能防止数据被损坏。


