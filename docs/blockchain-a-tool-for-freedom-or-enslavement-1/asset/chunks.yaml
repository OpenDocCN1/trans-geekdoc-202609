  trans: '

    正如我们一直看到的那样，无数人从事着有意义的工作，以保护这些边缘化群体的声音。我在为此本书进行研究期间所见证的工作以及我遇到的人，通过他们的行动让我相信，无论发生什么——人类的意志和决心，最重要的是善良与平等的声音，总会找到找到出路，即使在重重困难之中。它就像一朵从混凝土裂缝中钻出的细小而明亮的蒲公英，拒绝枯萎，让混凝土块变得无限美丽。


    但请注意，这项技术就像任何其他革命性的机械化技术一样，在错误的人手中就是一颗定时炸弹。记住，能够将我们从压迫中解放出来的技术也可能被压迫者用来推行他们的非民主议程。正如我在书中反复提到的，除非我们各就其位，否则你可以确定，这场战斗将由那些压迫者赢得。因此，我敦促你参与
    `blockchains`，以保持去中心化原则的活力。


    我希望这本书带给你的不仅仅是信息。正如我所说，这本书真正的成功在于你积极的参与以及对周围 `blockchains` 的意识——这是防止它们像其他技术一样被侵蚀的唯一途径。如果这本书，尤其是这项技术让你产生了共鸣，我希望你开始与你的朋友、家人甚至那些观点相反的人就此展开对话。打破孤岛的唯一方法是和平、持久且有证据支持的对话。没有这些，任何民主都无法免受威权主义的危险。所以，尽管畅谈吧。此外，如果你喜欢这本书，请在
    Amazon 上留言。这对于接触更多的人将非常有帮助。本书的收益将捐赠给西非去中心化联盟（West Africa Decentralized Alliance）——这是他们不断扩张的程中的微之力。至于你，我的朋友，我希望你全心地拥抱
    `blockchains`，让它们让你自由，不再受奴役。


