- fmt: "\nMany gaming platforms already do this for digitizing gaming assets that\
    \ can be later sold for cryptocurrencies. Gaming companies like `Axie Infinity`\
    \ are running a successful business model in developing nations by rewarding and\
    \ encouraging among the users the idea of play-to-earn. Going a step further,\
    \ creating ownership and sale of such digital assets on the blockchain can be\
    \ revolutionary in a virtual reality that goes beyond games and resembles the\
    \ widening scope of our life. \n\nLooking at the current buzz around metaverses,\
    \ it would be no surprise that multiple players are staking their resources on\
    \ creating their own metaverses. Though, in theory, individuals would have the\
    \ ability to navigate all of them with a single identity, this doesn’t seem likely\
    \ because different developers would have different platforms. \n\nWhatever the\
    \ form of the interface, there's very little doubt that combining this augmented\
    \ reality (AR) and virtual reality (VR) platform with blockchains can help us\
    \ realize the dream of a truly decentralized future. People have only recently\
    \ started seeing this potent mix and the tech giants are already spending billions\
    \ on it. This is one more reason why common people like you and I have to leave\
    \ our blockchain ignorance behind because, if not, the blockchain future also\
    \ runs the risk of being monopolized. Fundamentally, Blockchain, AI, Metaverse,\
    \ and all of these emerging technologies have come to a fork in the road—one path\
    \ leads them towards democratic and decentralized functionality, whereas the other\
    \ towards dictatorship and centralization. We need to understand that these pairings\
    \ are inevitable, in that centralization will inevitably lead to dictatorship\
    \ and decentralization to a real expression of democracy.\n\n# Part II: The Politics\
    \ and the Economics of It All\n\nBlockchain technology doesn’t emerge in a vacuum.\
    \ In the last chapter, you may have picked up on the somewhat politically controversial\
    \ nature of this technology. In this part, we look at blockchains in the context\
    \ of money and the resulting economics and politics as they have evolved over\
    \ the years. A special emphasis is placed on the relevance of Austrian economics\
    \ and libertarianism to blockchain technology. As we proceed through this section,\
    \ you might want to remember the Greek soulmate analogy because it turns out blockchains\
    \ have more than one. While cryptography is the technological soulmate, Austrian\
    \ economics plays its role elegantly well as the economic soulmate, and libertarianism\
    \ as the political soulmate to this intricately brilliant technology. In a nutshell,\
    \ you’ll see that they are just meant for each other.\n\n# Chapter 4: Unleash\
    \ the Free Market\n\nUnderlying most arguments against the free market is a lack\
    \ of belief in freedom itself.\n\n> Milton Friedman\n\nMarkets have been man’s\
    \ companion for thousands of years. Ever since humankind began their settlements,\
    \ markets have emerged—big and small—to ensure smooth exchange of goods between\
    \ those who are practically strangers. Even before any monetary medium was devised,\
    \ barter markets were functioning quite smoothly. Both local markets visited by\
    \ local buyers and sellers, and international markets by merchants from far off\
    \ lands, seem to have been flourishing since the Archaic period. Of course, the\
    \ purview of this book doesn’t require that we go into the depths of history,\
    \ but the point I am trying to make is that market activity has been going on\
    \ for ages and it seems to have been perfectly coordinated between strangers without\
    \ any interference from the administrative system.\n\nThe main reason for this\
    \ is that these markets were driven purely by the demand and supply principles\
    \ of economics. These principles seem to have been enough to restore the balance\
    \ whenever it ran askew. This is the exact definition of free markets. The free\
    \ markets also seem to find their way through to the spontaneous order when left\
    \ alone. However, as humans, when have we ever been able to leave something alone,\
    \ especially when it involves greed and power?\n\n## Free Market Capitalism Vs.\
    \ Crony Capitalism\n\nWe have often seen that, in the left-right noise of the\
    \ political parties, the issue often gets lost; the result is almost always the\
    \ suffering of the masses. While some elements are forever blaming capitalism\
    \ for all evils in the society, others are too busy covering the backs of the\
    \ corrupt capitalists indulging in luxuries, at the cost of the electorate. Since\
    \ both sides are interested in upholding their own political and financial agendas,\
    \ neither are really interested in what lies behind this excessively oversimplified\
    \ narrative.\n\nIn 1776, Adam Smith, often called the father of modern economics,\
    \ published `The Wealth of Nations` where he discussed what would be a contradictory\
    \ topic for years to come: the theory of self-interest. Smith argued that free\
    \ trade as predicated by the liberty to produce and exchange goods, without any\
    \ restrictions, would drive for more prosperity by kicking in the feeling of self-interest.\
    \ Many seem to misunderstand this concept to mean pure greed, but this is far\
    \ from the truth.\n\nOkay, consider this—what motivated you to go to school? What\
    \ makes you hold onto your job, business, or some sort of stable income? There\
    \ could be as many responses to this as there are individuals, but at the core\
    \ of all of those reasons is self-interest. That’s some form of personal gain,\
    \ or at least an assurance of helping you with that personal gain in the future.\
    \ In `An Inquiry into the Nature and Causes of the Wealth of Nations`, Smith describes\
    \ it thus, “It is not from the benevolence (kindness) of the butcher, the brewer,\
    \ or the baker that we expect our dinner, but from their regard to their own interest”\
    \ (Sanderson, 2008). In other words, one would say there is no such thing as a\
    \ selfless good deed. As humans we are wired to think of ourselves before anything\
    \ and everything else. Now, understand that this doesn’t equate to selfishness\
    \ because we don’t necessarily seek this self-interest at the expense of others’\
    \ well-being. In a nutshell, the game theory that we discussed earlier is what\
    \ makes these transactions possible.\n\nHow does any of this fit into the economical\
    \ understanding of the markets, you ask? Well, it’s simple, indeed—when individuals\
    \ are left to their own means, people produce and consume goods in an economy\
    \ that serves their self-interest. As a seller wishes to earn money, they would\
    \ be more likely to produce the goods that buyers would want to buy, and would\
    \ produce a good quality, at that. On the other hand buyers, because they are\
    \ interested in saving money for good quality items, would approach the sellers\
    \ that satisfy these conditions. As a result, both sides benefit and, moreover,\
    \ the whole market system functions in a positive environment.\n\nThat’s not where\
    \ the story ends, though. A crucial aspect of free markets is the competition.\
    \ The obvious problem with this self-interest notion for the smooth functioning\
    \ of the markets may seem like it’s too good to be true. For instance, wouldn’t\
    \ this lead to corruption through blatantly inflated prices? It would, if not\
    \ for competition. The fact that there are multiple sellers fighting for the attention\
    \ of the buyers means that none of them could step over the line and exploit the\
    \ buyers. This came to be known as the Invisible Hand Theory—the complementary\
    \ forces of self-interest and competition.\n"
