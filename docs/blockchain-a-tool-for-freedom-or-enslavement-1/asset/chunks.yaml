    \ and refuse to be pushed around anymore. \n\n# Chapter 10: Healthcare\n\nWe have\
    \ already seen the kind of impact that blockchains have on healthcare, in the\
    \ chapter on Africa. The simple fact that the patient’s records are securely recorded\
    \ in one place for the authorized doctors to access, in itself, can be life-saving.\
    \ Add to this more aspects like eradication of the counterfeit drug trade, and\
