    \ In a nutshell, decentralized artificial intelligence on blockchains is a trend\
    \ that you cannot ignore anymore. SingularityNET is one such blockchain-driven\
    \ AI network. There are even talks of a partnership between this platform and\
    \ Cardano to provide AI-based blockchain solutions to deal with pertinent challenges\
    \ across the globe. The moral of the story is that AGI and blockchains are an\
    \ unstoppable combo, and a lot more upgrades can be expected as both of these\
    \ grow together. \n\n## Into the Metaverse\n\nIf you are even slightly interested\
    \ in technology, there’s a high chance that you have heard this term in recent\
    \ times: the metaverse. If Facebook turning into its ‘Meta’ brand wasn’t a hint\
    \ enough, then it’s time for you to dig deeper. This has the potential to take\
    \ decentralization to another level in the coming years. A word of caution, though,\
    \ before we dive into it—the metaverse is still a very new concept and it might\
    \ be a little too early to talk about it with absolute certainty. But, what speculation\
    \ points towards at the moment is very interesting, indeed. \n\nIf you feel like\
    \ the metaverse appears to be a cryptic concept with a sci-fi air to it, then\
    \ you are actually onto something. The concept actually comes from a 1992 novel\
    \ called Snow Crash by Neal Stephenson. This is, indeed, a testament to how technology\
    \ is blurring the boundaries between fiction and reality. When you play multiplayer\
    \ games online, you are already interacting with people beyond the boundaries\
    \ of your geographical location, in the various avatars you created. \n\nBut,\
    \ mind you, gaming does not equal metaverse; for instance, Fortnite has a specific\
    \ gaming objective. There are also concerts and events that you can participate\
    \ in virtually. While Fortnite exhibits aspects of the metaverse, it is not a\
    \ metaverse in itself, at least not the kind that we envision. To be considered\
    \ a metaverse, it would have to be much wider in scope. \n\nFor our purpose, we\
    \ look much beyond the entertainment and leisure aspects of metaverses. Blockchains\
    \ can prove particularly convenient for a few aspects of the metaverse as we have\
    \ come to expect them. \n\n●     A never-ending online experience: The metaverse\
    \ would be persistent and expanding, just like the physical reality we live in.\
    \ There would be no barriers to this experience, neither personal nor professional,\
    \ neither private nor public. \n\n●     Multiple stakeholders: Think of our physical\
    \ world belonging to one person or entity. Seems like a ludicrous idea, isn’t\
    \ it? We live in a free world and the metaverse is, at least in theory, meant\
    \ to replicate this freedom with multiple contributors coming together to create\
    \ a free-moving online world.\n\n●     An interoperable economy: This essentially\
    \ means that, despite the various contributors coming together, the metaverse\
    \ would have a seamless interoperability, creating a fully functional economy,\
    \ with buyers and sellers all on the online plain.\n\nThough the details of the\
    \ metaverse remain largely in the works at present, one thing we know is that,\
    \ to ensure the smooth working of the above aspects, the metaverse would have\
    \ to be a massive data collector, possibly even bigger than the social media as\
    \ we see today. While the social media applications and gaming universes (like\
    \ Fortnite) are very basic and platform-specific, the metaverse is expected to\
    \ be all-encompassing. Think of your real life being transformed into virtual\
    \ reality: a virtual space where you work, buy, sell, and socialize with others\
    \ regardless of their location—that is the closest we can get to describing metaverses.\
    \ Blockchains could be the much needed inherent data security protocols that the\
    \ metaverse needs.\n\nMoreover, the NFTs or the non-fungible token technology\
    \ of blockchains is the key link in the blockchain metaverse. Imagine you have\
    \ two $20 bills. If I take those from you and hand you back four tens, you’d still\
    \ have the same amount. That means the tens and twenties are fungible. However,\
    \ when two commodities have unique value which is not exactly comparable, you’d\
    \ have NFTs. For instance, if I ask you to pick from your home something that’s\
    \ most valuable to you, you might pick a customized diary that your friend gave\
    \ you and I might pick up my favorite painting. These two values are just not\
    \ comparable. In some cases, you may come to a mutual decision as to how to measure\
    \ the value of these. For example, I may say that I can sell the painting at so-and-so\
    \ cost but that would have to be agreed upon by both the parties and is not inherent\
    \ in the object."
