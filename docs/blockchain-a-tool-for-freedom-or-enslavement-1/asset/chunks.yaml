    尽管这两个组件都具有理论价值，但一个完全自动运行的市场对许多人来说似乎是不可能的。许多人看着国家过去几年发生的事情，就断言资本主义是行不通。这种想法从头到尾都是一个谬误。现实情况是，客户是王，这也是企业无论规模多大、权力有多大，都会让客户使用其产品的唯一原因。没有这一点，就真的没有业务，没有金钱产生，也没有供我们分析的经济学。从本质上说，消费者掌握着经济发展方向的关键。以加拿大埃德蒙顿一家名为
    `[Re]Waste` 的公司发起的计划为例。创始人 Corey Saban 在博蒙特市推销了一个塑料回收项目后，现在已与大麻行业的两家公司签署了主要合同。这种转变不仅受到高层管理理念的影响，在很大程度上是由该行业的消费者的塑造。根据对
    15,000 多名消费者的调查，86%的 45 岁以下消费者表示他们愿意为可持续包装支付更多费用。当消费者的需求模式改变时，企业别无改变产品来顺应。这就是自由市场的魅力所在。


    我知道你在想什么，“但是，这只是一家小公司，不是吗？！那些无所不能的大型企业呢？”事实是，这些大公司也并不像我们想象的那样无所不能。以 20 世纪 90 年代
    `McDonald’s` 的披萨实验为例。尽管 `McDonald’s` 长期一直是一个巨大的品牌，但消费者不想在快餐店等待食物的这一事实导致该特许经营公司遭受了巨大损失，以至于他们最终关闭了披萨炉。即使在最近，每当公司对成功感到过于安逸时，消费者就会恰当时候给出及时的现实检查。想象一下一家快餐公司为消费者提供健康的选择，以适应健康千禧一代生活方式的需求——这就是消费者需求到目前为止所做的，未来也将继续做的事情！


    别误会我，我并不幻想目前形式的资本主义对任何人有好处。它显然和它的社会主义对手一样，同样功能失调。这就是为什么我们需要理解自由市场资本主义与权贵资本主义（crony
    capitalism）的区别。自由市场资本主义本身意味着将权力赋予买卖双方；而权贵资本主义将权力赋予少数可能受政府青睐的朋党或大企业集团。在过去的几年里，我们看到这种游说集团式的权贵资本主义在全球范围内发生了恶性转折，从中国到俄罗斯，甚至是美国。


    在这些许多地区，这种与共产主义混合的权贵资本主义正在以最微妙和逐渐的方式给普通人带来灾难。一种始于描绘资本主义罪恶的意识形态，最终走上了同样的道路，但方式非常不同。以印度的纳克萨尔特运动（Naxalite
    movement）为例——权贵资本家与共产主义武装团体之间的持续战争只导致了无辜、无助村民的流血。而这只是光谱两端都变得如此丑陋的一个例子。


    大多数人完全没有意识到，这与自由市场资本主义毫无关系。政府干预（无论是明确还是隐性的）的缺失在这里产生了所有的区别。长期以来，人们在这些极端意识形态之间摇摆，别无选择，只能像棋子一样被操纵。历史上第一次，我们有了第三种选择。区块链可以帮助我们促进一个本应
    true 真正自由市场经济。但普通大众必须快速行动，因为如果我们不这样做，我们就面临着区块链被我们正试图逃避的意识形态所取代的风险。


    ## （市场）垄断的游戏


    贪婪是人类状况不可分割的一部分。苏格拉底说：“不满足自己所有的人，也不会对他想要得到的东西感到满足” (`Socrates Quotes`, n.d.)。尽管有这种智慧，难道我们没有发现自己总是想多一点吗——多吃一口蛋糕、多睡一分钟美梦、多升一次职等等？我们都以自己的方式变得贪婪。面对现实吧——邪恶在人类中并不罕见。我们都有阴暗面，我们都会出错。但是，当这种微小的个人贪婪变成组织贪婪并影响数百人的生活时，会发生什么？


    市场垄断可以说是是剥夺人们权力的中心化最邪恶的表现。垄断允许组织巨头影响产品价格的程度大至于它们可以限制新玩家进入市场。市场之所以运作是因为它是一个公平交易的地方，但垄断市场通过用自满取代竞争剥夺了这一点。这除了让那些富得离谱的人更有钱之外，让穷人完全被排除在方程之外。


    以南非的 `Eskom` 惨剧为例。这家电力公司近一个世纪以来一直是电力部门垄断者，但这个光鲜表象下的裂缝已无法隐藏。长期以来，该机构被引用为政府与企业结合符合经济利益的典范。许多人认为，当它从
    `Escom` 变为 `Eskom` 时，终结就开始了下滑之旅。当然，正如 `Frederic Bastiat` 在他的古代著作中描述的那样，这就是根据短期结果而非长期后果来判断形势的逻辑谬误的完美例子。


    简而言之，该组织的垄断结构从一开始就注定失败。当你应用奥地利派经济学的原则时（我们将在本章稍后详细讨论），你将完全理解我的意思。奥地利派经济学对价格在经济中的重要性有明确的阐述。作为一个没有竞争的国家控制垄断机构，`Eskom`
    注定从一开始开始就会失败，因为它永远无法根据供需模式调整价格。


    许多人认为，赋予司法机关和政府等执法机制更大的权力可以解决以人民利益为代价运行的垄断市场问题。正如多次证明的，甚至在 `Eskom` 案例研究中那样，事实如此。要理解什么方法可以从市场上消除垄断，我们必须理解导致这些垄断形成的原因。


    ## 专利 VS 开源技术


    比尔·盖斯对专利有有趣的看法。他说：“如果人们在今天大多数想法被发明时就能理解专利是如何授予的，并申请了专利，那么今天的行业将会陷入完全停滞” (`Lee`,
    2007)。如果比特币的创造者对加密货币和区块链技术申请专利，他们将沉浸在财富中，我们甚至不会在这里讨论这个问题。关于专利的冲突观点存在的时间几乎和专利存在的时间一样长。不同的人可能对此采取不同的立场，但没有人能否认的是，专利消耗了大量的资源（面对事实地说，这些资源本可以用在更有价值的地方，尽管支持专利的人并不认同）。了解专利是有用的，因为它们可能引导我们揭开垄断的谜团。


