- fmt: "\nMany believe the cryptocurrencies to be the only bridge between Austrian\
    \ economics and the emerging technology of the future. But, this would have to\
    \ be a limited view of the unfolding situation. While it is, of course, true that\
    \ cryptocurrencies provide the most direct connection to the school of Austrian\
    \ economics, blockchain as the big picture technology also doesn’t stray too far\
    \ from the principles of this school of economic thought.\n\nSomewhere around\
    \ the late 1980s as the information technology (IT) emerged as the long player,\
    \ many began to consider its impact on the market structures. The electronic market\
    \ hypothesis was formulated stating that the IT industry would impact the markets\
    \ in three ways—by making communications easier and more efficient, by helping\
    \ the buyers and sellers come in direct contact with each other without the need\
    \ for middlemen, and lastly by integrating valuable information in a way that\
    \ helps both the sellers as well as the buyers. The result, it was predicted,\
    \ would be a much greater market activity.\n\nIt was hoped that the arguments\
    \ previously made by Austrian economists like `Mises` and `Hayek` would finally\
    \ be incorporated into this new age of markets that was about to boom. These economists\
    \ had argued that the major problem facing any economy is not scarcity of resources,\
    \ but the unavailability of relevant information. Now that IT was emerging as\
    \ a savior, this information could be made available, leading to lesser hierarchies\
    \ and better coordinated production activities. However, we all know that never\
    \ happened. With the emergence of IT, big players like `Amazon`, `Google`, etc.\
    \ took over this information and, rather than eliminating hierarchical structures,\
    \ utilized it to create even more concentrated hierarchies. So, though the overall\
    \ production has increased, small-time business owners are finding it harder than\
    \ ever to survive, while the big tech companies are getting richer by the second.\n\
    \nToday, the followers of `Hayek` and `Mises` and other Austrian economists see\
    \ another opportunity in terms of blockchain technology. If you notice, blockchain\
    \ technology represents everything Austrian economics stand for, even beyond cryptocurrencies.\
    \ The most significant area of overlap between the two, though, would have to\
    \ be their love for decentralization. As has been discussed before, blockchains\
    \ allow for minimal, if any, interference from government authorities and thus\
    \ cannot be used as tools for suppression and oppression. \n\nIt is to be noted,\
    \ however, that this libertarian principle would be upheld if, and only if, common\
    \ people like you and me are involved with this technology. Big companies like\
    \ `Google`, `Samsung`, etc. are already on the move to adopt blockchains, and\
    \ if we don’t participate effectively, even this tool of liberty might soon be\
    \ snatched away from us. \n\nSince the emergence of `Satoshi’s` `Bitcoin`, a multitude\
    \ of aspects about blockchains has been put under the microscope including their\
    \ safety, feasibility, adoptability, and so on. But, we need to understand that\
    \ blockchains are much more than these technical details. They are an embodiment\
    \ of the very economic and political values that have been defamed over decades,\
    \ and even suppressed, because masses have been led to believe it’s a total scam.\
    \ The truth, however, remains that keeping the masses in the dark about this emerging\
    \ technology, as well as ideology, only helps those in power to attract more and\
    \ more authority.\n\nDespite the persuasive nature of this argument, there is\
    \ little to no understanding of the political and economic consequences of this\
    \ technology. We may talk about blockchain disruption for as long as it may please\
    \ us and, yet, the discourse would be pointless to a great extent until we incorporate\
    \ the political and economic ideologies; like it or not, it is eventually these\
    \ ideologies that determine whether a particular technology, no matter how revolutionary,\
    \ will sustain in the long run in a given culture.\n\nDon’t get me wrong; I am\
    \ not saying that the political and economic schools of thought we have discussed\
    \ thus far have a one-way influence on the survival of blockchain technology.\
    \ They don’t. Ultimately any emerging technology is in a more-or-less continuous\
    \ loop of its technical, economical, and political feedback. It is impossible\
    \ to understand one without the others in an appropriate cultural context. Thus,\
    \ just as our economic and political philosophies can decide whether a technology\
    \ will sustain its originally intended form, the technology itself also has the\
    \ power to overthrow ideologies that are not consistent with the running of the\
    \ systems. While the former places the power in the hands of institutions like\
    \ the government, the latter can definitely be determined by the participation\
    \ of the masses in technology.\n\nThis is certainly true of blockchain technology—while\
    \ most people are wasting their time fighting for or against blockchains, the\
    \ wheels are already in motion backstage. You can love it, or hate it, but the\
    \ reality is you cannot escape it. Blockchains are already coming into your life\
    \ in more than one way. It’d be wise to participate actively in it, not just by\
    \ gathering knowledge about the technical aspects but by understanding and getting\
    \ personally involved in the technical, economic, and political context of this\
    \ technology, as a whole. If you don’t, you might soon find your life hijacked\
    \ by tech that you barely know anything about.\n\nWasn't the internet the same?\
    \ Not many of us really know or understand what the internet is and how it works,\
    \ but you (as a user) are caught up in the surface-level leisure implications\
    \ of it (like social media, for instance). But, underneath all those innocent-looking\
    \ posts and funny filters, the behemoths in the tech industry are putting the\
    \ internet to a much more sinister use by prompting you to allow them to access\
    \ your data every time you log in, and then selling it to the advertisers for\
    \ profits. Not to mention, the insurmountable power they hold to control free\
    \ speech, it’s quite obvious that the internet isn’t as sovereign as it should\
    \ be.\n\nWe need to wake up and smell the coffee before it’s too late and the\
    \ big tech companies gain charge of the emerging blockchain technology. As `Mike\
    \ Maloney` aptly puts it in the eighth episode of his blog on Youtube, `Hidden\
    \ Secrets of Money`, blockchains (`Maloney` talks specifically about cryptocurrencies)\
    \ can either “free us or enslave us” (`Goldsilver` with `Maloney`, 2018).\n\n\
    ## Part III: Blockchains for Evolving Societies\n\nNow that we have a solid foundation\
    \ of the technological, political, and socio-economic understanding of blockchains,\
    \ it’s time to deep-dive into the full-fledged application of blockchain technology\
    \ to communities at a local, national, and even global level. In this part, we\
    \ attempt to make a strong case for using blockchains to evolve societies into\
    \ more transparent and, thereby, efficient units.\n\n## Chapter 6: Blockchains\
    \ for Small Communities\n\nThe cryptocurrencies and blockchain technology are\
    \ somewhat like the actors and the writers. While actors sometimes grab all the\
    \ glamor and attention, without writers there wouldn’t be much left for the actors\
    \ to do. Blockchain technology may not be hogging the limelight too much, but\
    \ the applications are truly mind-boggling. We have already seen the staggered\
    \ examples of how blockchain technology is changing the world. Now, it’s time\
    \ to look at the full-fledged social impact that blockchains are having right\
    \ around you. When you see how impactful the grass-root level work in this arena\
    \ is, you will be able to come to terms with how blockchains are changing your\
    \ life without you even realizing it.\n"
