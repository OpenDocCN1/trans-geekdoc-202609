    When you think of a database, you likely think of something similar to an Excel
    spreadsheet complete with rows and columns. Now, blockchains are slightly more
    complex than that. Previously known as chains of blocks, they store data not in
    rows and columns, but in blocks. These blocks become digitally connected and,
    as more and more transactions occur and more data is generated, blocks keep on
    adding to the digital chain. Think of a cabinet drawer: once the drawer is full
    with files, you close it and move to the next one. Similarly, in blockchains,
    the blocks can only hold a certain amount of data. Once this limit is reached,
    they are closed and linked to the previous block.


    The crucial difference between the cabinet analogy and the blockchain, however,
    is that in the case of the former you can always go back and shuffle the files
    around. In the case of the latter, as data continues to be stored in blocks, these
    blocks create an irreversible timeline which means that going back and changing
    the details of the records is impossible. Each block receives the exact unique
    time stamp when it becomes a part of the digital chain.


    Blockchains use peer-to-peer networks to allow for the recording and distribution
    of digital information without giving the notorious elements the opportunity to
    edit or duplicate the data in any way. Simply put, this technology does not believe
    that secrecy equals security of data; instead, it makes the data perfectly transparent
    and puts it right in the view of everyone on the network, thereby eliminating
    the possibility of malpractice, altogether.


    To understand the importance of this system, we need to first look at how it differs
    from traditional transactions. Again, the impact is much more apparent in third-world
    countries. Blockchains tend to digitize the transactions which are tremendously
    regulated and, ironically, still reeking of corruption. It is said that when the
    Afghan soldiers started receiving their salaries through the digital medium, they
    actually thought they had received a raise in their pay. It turns out there was
    no raise; they were only receiving what was rightfully their own, only now their
    superiors didn’t have the opportunity to skim off their own cuts from the salaries
    of the subordinates—hence, the increase in the amount received. If mere digitization
    can bring that kind of a financial change, imagine what a fully transparent blockchain
    system could do, in this context.


    ## Why Blockchains?


    The happenings in Afghanistan are a living proof of how blockchains can empower
    impoverished countries, one community at a time. As Afghans struggle with the
    shortage of cash, and Taliban severely limits bank withdrawals, the community
    has been receiving aid in the form of crypto. Combine the economic collapse with
    the oppressive policies of the Taliban; people, especially women, have been laid
    off and driven into poverty. However, as reported in one of their news reports,
    Business Insider talks about the inspiring story of Fereshteh Forough and her
    venture Code to Inspire, as they take on the crypto-for-a-cause journey.


    You might be pondering why I keep going back to the third world context over and
    over again. I want to remind you that, while for a first-world citizen blockchain
    may simply seem like a hybrid version of digitization, for the communities in
    underdeveloped countries, it is something that can flip their entire functioning
    for the better. That is what we need to emphasize when having the blockchain conversation.


    Keeping this in mind: Let’s talk about why you should care about blockchains and
    what this technology brings for you as a stakeholder. In a world where your identity
    is becoming more and more virtual, the basic principles of blockchain technology
    are increasingly relevant to all of our existence.


    ### Distributed Power


    The American author Edward Abbey once said, "Power is always dangerous. Power
    attracts the worst and corrupts the best" (Edward Abbey Quotes, n.d.). There is
    something about power that makes mankind lust after it. Is it the sheer influence
    that can be exerted over another, or is it the fact that you hold the destiny
    of another in your hands, even if for the slightest moment? Whatever it is, history
    reminds us, time and again, that concentration of power in one entity is never
    a good idea. I have often seen people argue about their preferred political side
    with almost misguided reverence. Though there is nothing wrong with adherence
    to certain political beliefs, most people fail to realize that concentrating power
    in the hands of one person or one party can lead to infinite corruption of the
    political values of those involved.


    Imagine leaving the most crucial decisions of global economic value to the supposed
    good nature of those in power. Consider this for a moment: What if your boss called
    you in one day and told you that your fate at the company depended on one and
    one thing only. Imagine they pointed to a two-year-old in one corner of the room,
    in front of whom a bowl of candies is placed. Whether or not the child eats the
    candy determines if you stay or go, respectively. Sounds ridiculous, doesn’t it?
    It’s a child after all; they are bound to be tempted to eat the candy sooner or
    later! How can that be a determining factor for your career?


    Without a doubt, it’d be an absurdly laughable system; yet, we seem to have no
    problem following it on a global level. Confused? Here it goes: The state and
    financial authorities that we have had traditionally are no different from the
    toddler greedily staring at the bowl of candy—that’s power. If we leave it upto
    them, they will sooner or later devour the power without the slightest thought
    for the people’s welfare. Isn’t that what happened during the 2008 crisis? The
    institutions that the the people had trusted all long to do the right thing failed,
    leaving the people to pick up pieces of their shattered lives. And, might I add,
    even after that debacle, even after getting bailed out by the government using
    the taxpayers’ money, the financial institutions have learned nothing. They continue
    to make the same mistakes, pushing people into suffering over and over.


    On the contrary, the blockchains diffuse this power to the extent that no one
    entity makes the rules. The power is distributed to all of the stakeholders, thereby
    allowing for practically no opportunities for corruption. They use the distributed
    ledger system that lets the peer-to-peer network self-regulate in a way that diffuses
    the power component and amplifies the well-being component.


    Take the example of the outrage that the Indian farmers peacefully exhibited at
    the introduction of the new farm laws. These new farm laws, which were repealed
    after the massive protests throughout the country, were seen as deregularizing
    trade of agricultural crop. The "Minimum Selling Price" was replaced with a vague
    "guaranteed price." The Farmers worried that they would now be unable to get the
    price they deserved.


    Without going into the details too much, the amendments to the farm laws were
    seen as oppressive as they likely meant that the big corporations could stock
    the crop limitlessly and farmers would have to accept the price that these corporations
    quoted. Though there was the argument that this would benefit the farmers by allowing
    them to sell their crop without restriction and interference, the farmers protested
    because there was no guarantee that whatever the government proposed would actually
    happen. In this case, wouldn’t it be great if the farm contracts could be implemented
    with full guarantee and if the transactions were hack-proof, because there were
    multiple peers on the blockchain monitoring the situation? That is the significance
    of distributed power in this technology.


    ### Networked Integrity

