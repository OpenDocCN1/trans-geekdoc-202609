  trans: '

    可以将其想象为一个人可能陷入的酒精成瘾循环。在开始，酒精让他感到轻盈和亢快。但随着最初的快快感消退，留下的是迷失方向的身体、内疚的心灵和财务负担。当所有这些缺陷带来的挫败感不断上升时，尽管再次沉浸酒精可能极具诱惑，但这绝非解决方案。度过艰难的戒断症状确实对个人有大益。


    从本质上说，奥地利派学者认为，当货币供应保持不变时，尽管即时消费可能会受到限制，但长期储蓄将会增加。想象一个货币价值会增加而不是减少的世界。如果你知道将会发生，你会想在今天把钱都花光，还是为未来存起来以便获得更好的价值？反之，像我们目前的社会这样，货币价值随时间推移而下降，导致了一种
    `YOLO`（人生只有一次）的观念，无论代价如何，都鼓励了肆肆的消费主义。


    从业务角度来看，货币升值还将减少对某些项目的过度投资，这些项目仅在通胀期间给人一种增长的幻觉。如果通胀下降，这些项目将立即变得无利润。简单来说，投资者只会对长期能够盈利的项目贡献资金，而不是陷入短期利润的幻象中。


    1972 年，斯坦福大学教授沃尔特·米歇尔（Walter Mischel）仅通过棉花糖就证明了能够延迟满足的孩子与不能这样做的孩子相比，往往拥有更健康、更快乐、更成功的生活。奥地利经济学在年前甚至几个世纪前就对经济得出了同样的逻辑。然而，我们现在仍然在每一个机会尝试重新发明轮子，并得出了更多的错误方案：不健康的货币。


    在全球范围内，这种不健康的货币也使许多问题浮现出来。由于必须经过转换的麻烦，它赋予了某些转换率高于其他经济体的隐含权力。这导致了多次贸易冲突，不可避免地导致了战争和损失。想象如果有一种不受国界限制即可使用的全球货币。这具有根除许多全球冲突的潜力。


    那么，健康的货币需要对抗不健康的法币货币带来的恶之特征，其中最重要的一点是跨时间的稳定性。尽管健康的货币随时间推移而升值，但这种升值并非由人为因素突然带来的。健康的货币另一个需要的但当前法币不具备的特征是不可破坏性。加密货币轻松地提供了这些功能，因此成为当代奥地利派经济学者的青睐。然而，对他们最有吸引力的特征是这种全球货币是去中心化的，没有限制性政策形式的政府干预。我们稍后将详细讨论加密货币，但现在必须理解它们提供的完美过渡——从当前经济中盛行的缺陷法币货币体系，到从未来面对我们的健康货币理论。


    ## 加密货币困境


    长期以来，“加密货币”一词一直是著名的（且臭名昭著的）`Bitcoin` 的同义词。2010 年的某时候，一个名叫 Laszlo Hanyecz 的人没有现金支付他订购披萨，因此用
    `10,000` 个 `Bitcoin` 换了一个披萨。（注：原文在此处存在大量重复文本，已根据要求去重处理，保留核心信息逻辑）。


    YouGov 的一项调查显示，27% 的人支持采用 `Bitcoin`。


    要点在于，投资加密货币时，理解并非所有货币都遵循去中心化原则，也不具备通缩属性是非常重要的。例如，`Bitcoin` 的供应上限为 `2100 万`，这意味着所有可以挖掘的
    `Bitcoin` 预计将在 `2024` 年前挖掘完毕；`Cardano` (`ADA`) 的供应量限制为 `450 亿`。一旦这些达到各自的市值，我们将看到通缩效应。这简单意味着随着时间的推移，它们的价值将升值而不是贬值，因为不再有新的代币进入。这是奥地利派经济学家热爱加密货币的原因之一。


    ## 奥地利经济学视角下的区块链

