    \ been functioning for quite some time. \n\nThe South African National Blockchain\
    \ Alliance (SANBA) is one such collaboration. The great thing about this is that\
    \ it connects government, sponsors, the research community, and the industrial\
    \ community to help adopt blockchains beyond the financial and cryptocurrency\
    \ domains. Since its creation, SANBA has been looking at several strategic partners\
    \ for developing a smooth-running and connected blockchain ecosystem including\
    \ IBM, Microsoft, Binance, Cardano, and so on. During the last year, two stand-out\
    \ projects that they have undertaken are ILIMA—a farm-to-fork support program\
    \ for small farmers and processors powered on a blockchain, and Credentialing\
    \ Blockchain to digitally document skill development credentials for apprentices.\
    \ Though both projects are in a proof of concept stage currently, it shows the\
    \ increasing interest that even the government is taking in this technology.\n\
    \nBlockchain adoption by the Ugandan government is also noteworthy. The major\
    \ issue that the government hopes to tackle is that of counterfeit pharmaceutical\
    \ drugs in all of the East African community. For this, a couple of years back,\
    \ it partnered with blockchain-based platform MediConnect—which records the manufacturing\
    \ of pharmaceuticals on a blockchain, thereby making it much easier to trace the\
    \ fake drugs and stop their distribution in the supply chain. \n\nAnother significant\
    \ blockchain adoption in the public sector in this country is the land titles\
    \ registry. Uganda has a nuanced land tenure system with a variety of protection\
    \ rights and modalities. Despite the fact that the law is very much designed to\
    \ favor the common man, the ground reality suggests quite the opposite. The corruption\
    \ and fraud has been eating away at the system by issuing multiple titles over\
    \ the same property. This basically renders the title certificate, which is technically\
    \ the only requirement to prove ownership, practically useless. To make matters\
    \ worse, a large number of Ugandans have been evicted from their own properties\
    \ due to a growth in foreign investment, without a trace of fair compensation,\
    \ leaving them to the streets. Even their farming lands have been snatched from\
    \ them, taking away what was previously their sole means of earning a livelihood.\
    \ The government has been looking at a pilot project to implement blockchains\
    \ for land registry—to uproot the rampant corruption. \n\nAn interesting approach\
    \ taken by the Ugandan government is seen in the Kampala Declaration, in which\
    \ states support non-regulation of the blockchain before further research is conducted.\
    \ This would allow for what’s known as “permissionless innovation,” meaning that\
    \ blockchain innovators can utilize their creativity to the maximum level without\
    \ worrying about government restrictions. Such legislation signifying openness\
    \ can go a long way in creating acceptance among the general public.\n\nNigerian\
    \ initiatives are also inspiring people to jump on the blockchain bandwagon in\
    \ the country. Kashifu Inuwa Abdullahi, the Director-General of the National Information\
    \ Technology Development Agency (NITDA) hinted at the Nigerian plan to generate\
    \ $10 billion in revenue by 2030, with the adoption of blockchain technology (Paul,\
    \ 2020). Though the most widespread applications of blockchains in Nigeria remain\
    \ in the financial cryptocurrency sector, the government plans to utilize this\
    \ technology for several projects, like national digital identity, digital literacy,\
    \ startups in various sectors, and so on. The policy incentives for these projects\
    \ can certainly charge the Nigerian economy into an economic boom. \n\nHowever,\
    \ these projects also come with a beware sign. For instance, a national digital\
    \ identity would only make sense when the platforms are truly decentralized in\
    \ nature—where the individual does not have to worry about the dangerous implications\
    \ of sharing their personal data. On the other hand, when centralized government\
    \ systems utilize blockchains, they tend to adopt blockchains that move away from\
    \ decentralization towards privatization, which we spoke of earlier. This use\
    \ of private blockchains, even in the public sector, is more common than you think—many\
    \ of the international organizations continue to consider blockchains to strengthen\
    \ their centralized hierarchy-driven structures. Take, for instance, Blockchain4Cities:\
    \ a United Nations research group collecting comprehensive data for blockchain\
    \ implementation in smart-city infrastructure. Though this has accelerated blockchain\
    \ growth, the masses will have little to gain from it because the power still\
    \ remains with the centralized governments. The point is, though blockchain innovation\
    \ in these projects may seem shiny and attractive, it’s crucial we don’t forget\
    \ the decentralization theme. That, along with mass participation, is the only\
    \ way to bring power back to people.\n\n##  The Trade Boost"
