    对于局外人来说，这两种理论代表了政府的某种活动，旨在人为诱导市场行为，以“解决”眼下的问题。第三种有趣的学派是奥地利派经济学。正如我之前提到的，奥地利派经济学并不认同宏观/微观经济模型。相反，奥地利派经济学家认为个人和群体经济行为之间竟然如此疏远是非常奇怪的。例如，宏观层面的经济学家往往完全不知道劳动力、健康等微观经济要素是如何结合在一起的。难道拥有一个在这两个层面都保持一致、并实际上将较小的碎片整合成宏大蓝图而非痛苦地将它们分离的理论，不会更有意义吗？


    奥地利派经济学家对市场危机采取了相当自由放任（Laissez-Faire）的态度。他们坚信最小化的政府干预，并假设市场倾向于经历自身的生命周期，自动调整以应对危机。这种意识形态基于“主观价值”的核心理念。他们所的主观价值是指，每个物品的价值取决于其所满足的主观需求和欲望。而且，该物品的获取难易程度或稀缺程度决定了其使用的效率。例如，一个富足饱饱的家庭可能更倾向于扔掉剩下的面包，而一个贫困的家庭在考虑分量大小时必须非常节约。因此，在食物短缺的地方，剩余面包的价值要比食物充足的地方高得多，且使用效率也高得多。


    由于消费者行为直接依赖于基于产品可用性的感知价值，因此存在一种内在的机制来处理供需循环。但是，当国家等外部实体干预这一过程时，整个平衡就彻底化为乌有。这在巴西经济的崩溃中得到了很好的体现。多年来，特别是自
    2008 年危机以来，巴西看到了日益增长的干预主义经济政策。以汽车行业为例，政府提供了大量的补贴，这导致了人为扩张的繁荣与衰退周期，对整体经济产生了重大的负面影响。对对此的不满正导致巴西的论语体系向奥地利派学学转变。


    货币理论还有另一个分支被称为**现代货币理论（MMT）**。其支持者之一的斯特芬尼·凯尔顿（Stephanie Kelton）反驳了奥地利思想中宏观/微观经济界限模糊的问题。她提出，家庭在经济上的运作方式与国家完全不同，因为家庭没有创造货币的权力。关于创造货币权利的假设似乎是
    MMT 与奥地利派之间许多核心意识差异之一。这一假设产生了一切的区别，因为如果山姆叔（美国政府）可以随心所欲创造更多货币，那么国家经济债务有多少或国家财政赤字有多大又有什么呢？


    这是一个诱人的想法，不是吗？几乎好得令人难以置信？如果看起来是那样，那是因为它确实如此。奥地利派经济学通过 MMT 反驳了这种“爱丽丝梦游仙境”的世界。如果字面接受
    MMT，那么那些困扰了国家几个世纪的恶魔——通货膨胀、破产等等都将只是完美的想象词汇。然而，现实是，这些并非想象，而且长期以来困扰着我们的社会。奥地利派经济学通过澄清这一点支持了事实：MMT
    的政策建议可能导致资本结构的萎缩和整体经济的停滞。


    ## 法币的灾难（The Fiat Fiasco）


    好了，我们刚刚上了一门小规模的经济学入门课，现在呢？这如何帮助我们的区块链讨论？这个问题的答案在于我所称的“法币灾难”中，它将我们这里讨论的经济、政治和区块链元素结合在了一起。是的，目前看起来我们似乎在讨论一些我喜欢的随机话题，但你很快就会发现，法币是完成拼图的缺失环节。


    奥地利派经济学迎难而上，直面法币的。。要理解，法币的基础建立在所谓的中央银行体系之上。这并不是秘密，MMT 确实正确的一点是，国家对货币生产拥有垄断，而中央银行体系依赖于国家批准的金融机构来传播这种垄断。然而，对于奥地利派经济学家来说，法币（或纸币）只有一个功能：充当交换媒介。事实上，他们甚至认为法币对于一个运行良好的经济并非必不可少。相反，奥地利派经济学家坚信，法币带来了我们完全可以不需要的中心化邪恶。


    奥地利派经济学家一直支持由商品背书的交换媒介。因此，像金本标准这样的东西非常符合奥地利派的观点。从这个角度，很容易看出为什么法币会产生问题。让我们回到我们最喜欢的
    2008 年崩盘案例。但首先，回答这个问题：你预计在这次崩溃之后，银行业会发生什么？不需要科学家也能猜到，银行业由于所有那些坏账会在很大或小程度上发生崩溃。但是，你知道实际发生了什么吗？2010
    年，银行总资产实际上增长了 18.4% (Polleit, 2010)。这是因为联邦储备委员会恰好做了 MMT 建议的那样，向银行提供了大量的资金以防止其崩溃。


    虽然这看起来像是一个可行的方案，但这种扩张货币供应的注入对经济来说可能是灾难性的，并会创造我们之前提到的那种繁荣与衰退周期。让法币经济趋于平衡实际上是不可能的，因为它完全不具有内在价值，之所以被视为货币仅仅是因为大家都接受它为货币。相比之下，当货币挂钩金本标准时，政府不能挥挥魔杖就变出新货币；他们必须购买额外的黄金。因此，即使银行进行了欺诈交易，他们最终必须根据可用黄金进行对账，系统最终会自我修正并回到最初期望的平衡。简单来说，法币长期以来给我们的经济造成了不可弥救的损害。


    ## 健全货币的替代方案


    自从脱离金本标准以来，奥地利派的支持者一直在努力寻找一种填充“健全货币”空白的替代方案。事实证明，当中本发明比特币时，这场寻找寻意意外地结束了，奥地利派的支持者找到了他们的金矿（双关语）。


