  raw: "Multiple governments around the world, whether belonging to the right wing\
    \ or left wing, have exploited the masses in order to satisfy their own vested\
    \ interests, influenced more by their ideologies than the sentiment or welfare\
    \ of the voters. History is filled with examples of this over various time periods.\
    \ Wars have been fought and lives have been lost under the pretense of seeking\
    \ welfare for the citizens. Even as we speak, wars rage in several parts of the\
    \ globe in the name of a better world. I want a better world, too, and so does\
    \ everyone else. I just don’t want it achieved through corruption, communal and\
    \ political division, and meaningless wars. Today we, the people, have a chance\
    \ to overturn the flawed notions that have been propagated by various governments\
    \ for centuries—blockchains are that chance and we would be foolish not to take\
    \ it up whole-heartedly.\n\nAs political powers make the process of governance\
    \ murkier by the day, the trust in the workings of the government has been decreasing,\
    \ too. This is not just the case with developing nations, but also with the developed\
    \ ones around the globe. The Canadian government recently imposed a blanket freeze\
    \ of the accounts that donated even the smallest amount to the protests opposing\
    \ the government mandate, discriminating between people based on their vaccination\
    \ status. Though it unfreezed most of them about a week later, there’s speculation\
    \ that some will never be restored. The blatant abuse of power just seems completely\
    \ unjustified. Even crypto exchange Kraken, handling the crypto assets of some\
    \ protesters, was mandated to be frozen despite the cryptocurrency not falling\
    \ under government regulation. People have gotten tired and distrustful, and rightly\
    \ so, of the fake promises made to safeguard voters. What’s more, the election\
    \ procedure itself is so muddled that even the best democracies also find themselves\
    \ reeling in the after-effects of corruption aimed at hijacking the democratic\
    \ process. \n\nTake, for instance, the elections in recent years in India and\
    \ the United States. In India, they have been making use of electronic voting\
    \ machines (EVMs), as they are supposed to be better for accuracy. However, in\
    \ almost every election, there are reports of random people walking out with certain\
    \ EVMs without the proper protocol. Furthermore, there have also been reports\
    \ that say that EVMs can be hacked into to make it look like the citizen has cast\
    \ their vote to a particular party, when indeed the vote is going to someone else.\
    \ How then can a citizen be certain about his vote, even with the use of EVMs?\n\
    \nEven in the last U.S. presidential elections, so many questions were raised\
    \ by the defeated Republicans about voter fraud. Of course, these two countries\
    \ have a very different voting procedure. And, all the claims of voter fraud in\
    \ the United States were investigated and, though there were irregularities, the\
    \ courts did not see it as a widespread attempt to interfere with the election\
    \ but isolated incidents. But, imagine the time and the financial resources going\
