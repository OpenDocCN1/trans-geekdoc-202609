    正如我们之前讨论过的，与偏远地区农民获得银行服务的机会相比，他们使用智能手机的机会要少得多。例如，点对点区块链服务（如即将启动的区块链初创公司 `AgriChain`）以及此类网络上的交易，只需点击手机屏幕即可轻松完成。此外，区块链在存储与农民遵循的良好实践相关的文档，以及他们向客户证明其特殊价值时可能需要的各种认证方面，也高效得多。


    这融入了“智能农业”的领域，可以帮助农民实施相当复杂的数据存储和分析。这些数据具有不可篡改和防扭曲的特性，具有特殊意义。以环境监测数据为例，这些数据通常由政府部门进行集中化控制，并由他们根据环境趋势做出政策决策。但是，由于中央机构有其需要保护的利益，这些数据很容易受到操纵，而这在启用区块链的网络上是不可能的。目前，许多利用区块链技术结合信息通信技术（`ICT`）和物联网（`IoT`）的项目正在，旨在帮助农民充分利用这项技术。


    另一个区块链可以并已经在带来显著改进的相关领域是农产品的供应链。这一领域的问题不仅给农民带来了困难，还给整个全球社会导致了巨大的经济成本。从农民的角度来看，区块链技术有助于与消费者建立信任，因为每件产品的信息在区块链上都是透明且自由获取的。这将消除那些试图通过廉价劣质产品垄断市场的竞争。因此，农民可以为客户提供真正的价值。另一方面，从客户的角度来看，他们现在可以确定自己消费的食物是如何制作的。一家名为
    `Ripe` 的公司正是这样做，它通过提供一个区块链平台来使食品供应链数字化透明化。


    区块链还解决了追溯性问题，确保农产品产生最低的浪费（如果有的话）。一家名为 `TE-FOOD` 的初创公司使用识别工具来跟踪农产品在供应链中的移动——无论是包装食品、新鲜农产品，甚至是牲畜。分析一段时间内的损耗模式可以带来宝贵的见解，有助于解决这一问题。甚至还有启用区块链的工具可以帮助农民进行牲畜养殖。在这里，动物在出生时就会标记一些识别标签，这有助于他们以测量和科学的方式跟踪这些动物整个生命周生长状况。它们的生命体征得到监测，并在早期阶段识别出任何问题。


    即使在涉及食品行业的非法活动方面，区块链也起着至关重要的作用。非法元素通常通过夺取消费者市场的大部分份额，让守法的生产者变得非常困难。一个相关的例子是非法捕鱼，长期以来，这对于监管机构以及努力遵守所有法规的渔民来说一直是一个困扰。区块链可以让客户非常简单地检查他们购买的农产品是否合法。他们还可以向消费者提供可靠信息，告知他们的鱼产自哪里：养殖场、湖泊等淡水域，还是海洋的海水。


    尽管这一切看起来可能像某部现实科幻小说，但我再次提醒你们，这些都是在你们周围的区块链上成功运行的应用。而且，这只是冰山一角。在我们每个人都参与其中之前，除非，我们甚至无法释放它们的真正潜力。


    ## 用于可持续性的区块链


    当我们无休止地谈论所有这些技术时，我们不能忘记环境因素。区块链技术往往被认为与环境可持续性相相背，主要是因为工作量证明（`PoW`）共识机制，这些机制由于其产生的碳足迹被认为对环境消耗很大。虽然事实确实如此，但正如之前指出的，环保共识机制也被设计出来并广泛使用。这就是为什么我们必须关注
    `Bitcoin` 的原因之一，它确实使用了 `PoW`。即使其他加密货币，如 `Cardano` (`ADA`)），也如之前讨论过的，使用了环保的权益证明（`PoS`）共识机制
    `Ouroboros`。然而，批评者似乎仍然纠于使用不环保的区块链进行可持续性项目的讽刺性。只需扫一眼这些公共区块链，就能帮助你理解这种假设的讽刺只不过是那些宁愿反对变革也不愿接受的人的想象。


    ### 伦理采矿


    当我们从发达经济和发展中经济体的二元性来思考世界时，我们往往被认为相信发达国家是富裕的中心，而发展中经济体在消耗全球资源。这不仅是一个严酷的观点，而且是一个极不准确的观点。非洲非洲大陆拥有丰富的矿产储备，但当地人口似乎几乎没有从采矿业中受益。在他们的书籍《非洲矿业：当地社区变得更好了吗？>（Chuhan-Pole
    et al., 2017）中，作者们讨论了“资源诅咒”。他们指出，腐败的政治实体结合如此丰富的资源，会对当地发展产生灾难性的影响。这主要是因为在薄弱且非民主的机构中进行这种中心化，使得拥有既得利益的垄者更容易控制和获取租金。区块链可以将这些功能失调的系统颠转，并改善当地社区的局面。


    例如，刚果民主共和国拥有广泛的钴和铜小规模采矿作业。虽然这些遍布的矿点是百万人的生命线，但这些采矿作业也是多种人权侵害行为（包括童工）的温床。政府部门因未能监管这些行为而经常面临严厉的批评和反弹。`IBM`
    目前运行着协作区块链试点，确保刚果的矿场符合认证标准。只有在例如，没有涉及童工，或者矿工的工作条件和工资符合要求的标准的情况下，矿场才能获得认证。


    虽然这可能是一个巨大的游戏改变者，但人的努力不容忽视。请记住，留在区块链上的信息将与输入其中的信息一样好。这正是我们作为公众参与之处。我们对这项技术的影响以及它能实现的目标越了解，这项技术就能取得越大的成功。

    '
- fmt: '

    You don’t have to be an environmentalist to know that our planet is in a deep
    crisis. As our landfills sit taller than ever, waste management drives across
    the globe seem to be struggling to catch up with the increasing mounds of garbage.
    As the population and the commercial consumerism increases, so does the waste,
    especially non-eco friendly waste. Ontario, Canada was recently reported to be
    running out of space for its own garbage. As this waste in solid, liquid, and
    gaseous forms piles on, human health is more and more endangered. Waste mismanagement
    has been well-documented, especially in developing countries leading to major
    health concerns like respiratory problems, skin infections, and even prenatal
    and postnatal defects. The primary reason for this mismanagement in developing
    countries, apart from corruption, is that waste management has multiple moving
    parts along its logistical chain.


    Have you ever wondered what happens to the trash collected from your curb? The
    easy and probably the less scary answer is that it goes to the landfills. But,
    beyond this, it may be difficult to trace the movement of this trash because of
    the different types of waste, the numerous collection and processing centers involved
    in the process, and a number of such dynamic factors which might be quite difficult
    to track on a large scale. Blockchains have proven extremely successful in this
    regard.


    Argentina, despite being a developing country, has proven to be a wonderful role
    model for putting its garbage on blockchain. The government, in collaboration
    with entrepreneur Ivan Zubilewicz, have implemented a reward program for waste
    collection using a cryptocurrency created by Zubilewicz, called `JellyCoin`. This
    cryptocurrency is awarded to all those who are involved in the waste management
    process. All that anyone who wishes to participate has to do is log in to the
    app and register as either the producer, collector, or processor of trash. Each
    of these is then rewarded for following proper waste segregation. These different
    actors are also connected with each other, ensuring that the traceability—and
    the resulting accountability—are implemented for the betterment of the process.
    The collectors are even rewarded based on the distance they travel to collect
    trash. Overall, the whole process becomes incentive-based, thus making people
    more proactive in their work. This cryptocurrency can then be used to buy anything
    they wish for in the mainstream market, as it is widely accepted in the Argentine
    economy. What a wonderful way to resolve an age-old problem without the need of
    a federal government!


    Another such pilot project is fueling community effort to create a better waste
    disposal system in Bengaluru, India. Blockchains have provided a fool-proof way
    to ensure that no problem in garbage collection goes unnoticed. If the garbage
    collection has been neglected, the citizens can go and register complaints. Before
    the introduction of the blockchain element, the government used a geotagging system
    where the collector would take a picture of the cleaned site with a time stamp
    and upload it. But, the problem is that there are loopholes in this technology
    that allow for tampering with the past data entries and time stamps. Pairing this
    technology with blockchains brings in a much needed level of sophistication, while
    also keeping the data for all stakeholders to see. This transparency ensures accountability,
    and gives a clear understanding of those that are performing and those that are
    not.


    `RecycleGO` is a New York-based project that uses `QR` scanners to scan the plastic
    bottles, increasing the traceability of plastic waste management. They also have
    a unit in Lagos, Nigeria where they plan to use blockchains to take their plastic
    recycling a notch higher by putting the entire process on a blockchain.


    All the projects we have discussed here are being run in the so-called developing
    parts of the world. I highlight this because, often, we have a skewed perception
    that the developing world is not as tech-savvy as the rest of its counterparts.
    But, what we see here in this section, as well as what we have discussed so far,
    completely contradicts that notion. These countries may not find the financial
    resources, but maybe it is this scarcity that inspires them to use the resources
    even more economically, as well as efficiently. And, the reason blockchains excite
    me is they seem to be the perfect tool for this resource utilization.


    # Chapter 7: Use Cases for Developing Economies


    Developing economies have, unfortunately, always been the last to reap any benefits
    advanced technologies can offer. The dysfunctional hierarchical structures in
    these communities have often been responsible for the social disadvantage that
    these groups have been placed at. But, as we have evidenced multiple times throughout
    this text, blockchains have the capacity to change all of that. As exciting as
    the examples that I have shared here are, the blockchain technology is still in
    its infancy. Blockchains are still finding their voice in sectors that actually
    matter.


    Having said that though, today we have enough proof to be certain that this technology
    works, especially in those parts of the world where they were least expected to
    succeed. Though we have described several examples where blockchains are being
    the game-changer, now we take an exclusive look at this technology, flipping the
    reality on the continent of Africa. This chapter is dedicated to drawing your
    attention to the wonders that this technology is doing in African countries, changing
    the landscape of their social empowerment, one platform at a time. We take a look
    at all of these platforms individually, and see their impact on the African economy,
    as we go along.


    In 2020, a survey by `PositiveBlockchain.io` identified 69 projects that were
    utilizing blockchains for social good on the continent of Africa (`Smart Africa`,
    2020). Remember that, when we talk about social good, these are not necessarily
    non-profit. In fact, most of these are for-profit startups. This is not a bad
    thing at all, because it means that people and organizations alike have begun
    to see blockchains as viable self-sufficient platforms that can generate income
    and fetch profits without depending on donations and charities from specific entities.
    A majority of these projects, 57% according to the above report, have been heading
    their operations from headquarters on the continent itself. However, the spread
    of these blockchain initiatives isn’t uniform throughout the continent, with Kenya,
    South Africa, and Nigeria being in the spotlight for the most time. Nonetheless,
    there is little doubt that a vibrant blockchain ecosystem has emerged on the continent
    and is on its way to a lasting full bloom.


    ## Digital Finance Infrastructures


    The digital money on blockchains has seen a widespread acceptance from people.
    This shouldn’t come as a surprise, considering our previous discussion about the
    Africans’ heartening to mobile money apps like `mPesa`. You might be surprised
    to know that a majority of global mobile money operators run from Sub-Saharan
    Africa. While the whole world fusses over the feasibility of cryptocurrencies,
    the Africans seem to be quite comfortable with trading in `Bitcoin`, among other
    things. This comfort level is easily seen in the booming manner in which the value
    of the crypto market has grown in this region. This is, of course, because the
    alternative in the form of traditional banking is much more problematic and hasn’t
    been able to match up to the blockchain-based financial solutions. We shall look
    at these in more functional detail in our section on banking; but, for now, let’s
    look at what’s happening in Africa, specifically.

