  trans: '

    当美国的一位开国父说出这句话时，他可能并不知道，在从殖民主义的枷锁中解放几个世纪后，我们仍然是那些权势者的无常和幻想的奴隶——那些声称是我们免受邪恶之救主的人，以及那些自称为我们自由守护者的人。是的，我认为我们仍然是奴隶——也许不是这个词的传统意义，但你一定考虑过，认为我们需要不断担心守护自己的自由这种想法是否是谬误的吗？事实是，我们被训练化去相信的那种社会等级制度告诉我们，只有在能赋予某些群体他们渴望的权力范围内，自由才会被赋予我们。这在某种程度上意味着，自由与权力的动态对于你我这些人来说是一种权衡。你可以拥有其中一种，但两者不可兼得。


    我知道你们在想什么：我到底为什么要在一本关于区块链的书里如此激烈地谈论自由？好吧，如果你仔细观察，这并不难理解。这种致力于从长期集中权力的阶层手中夺回权力并将其交给普通人的区块链运动，根本不是什么新运动。这场运动在我们这里任何一个人出现之前就已经持续很久了。它改变了面孔，但其核心保持不变；它依然随着为争取自由的反抗呐喊而跳动。


    ## 反抗的起源


    让我们做一个思想实验，好吗？想象一下某一天你醒来，被告知从现在起，你余生只能穿两种颜色——黑色和白色。每天你醒来后可以在这两种之间做出选择。你被告知你可以拥有质量最好的西装和裙子，但不能有任何其他形式的衣服。对此会有什么感觉？压抑？挫败？


    现在，更进一步。你从小就一直接收到的信息是，这种黑白衣服的政策实际上对你有好处，它实际上节省了你原本浪费在从几种颜色中选择一个的时间，而且那些颜色对你来说也是分心。此外，你被训练化地相信做出这些选择的实体是想为你好。你甚至被直接或间接地地告诉，这个系统太强大了，无法改变，遵循规则会容易得多（毕竟，规则都是为了你好）。


    这个寓言可能看起来像是一个愚蠢的夸张，但如果你仔细观察，你会发现这与我们的中心化系统所做的并无大区别。他们制定法律，采取他们认为符合我们最大利益的政策——或者，我们应该说，符合他们自己的最大利益？无论如何，中心化权力倾向于扼杀我们的自由，以至于我们开始相信别人比我们更擅长为自己做出实际上对我们有“好处”的决策。


    我意识到这让我听起来像个激进的反叛者，但请相信我：在当今时代需要的是激进的反叛者。区块链企业仅仅是这一思想的逻辑演进，而不是一种令人惊讶的奇迹般的创新。我们的系统早就该得报应了，现在是时候让它们解脱了。世界上许多地方已经做到了这一点，我们都需要在列车开过我们之前跳上去。


    我经常面临一些朋友、同事和熟人的的质疑，关于我对比去中心化区块链技术的强烈支持。为什么，他们问我，我对比区块链有如此强烈的感觉？好吧，我可以给他们讲我们讨论过的所有精彩例子，但我知道他们不会被说服，因为在大多数时候，他们寻找的是驱动我个人的内在动力，即我存在的内核。所以，我告诉他们，我宁愿提醒他们一个小故事。也请允许我提醒你们。


    很久以前，在一个被称为美国的土地上，13 个英国殖民地决定以前所未有的方式反抗压迫，猜怎么着：他们赢了！但有趣的是，他们的独立思想被限制在由像他们自己的人所领导的生活中。曾经被推崇的英雄现在也受到了严厉的批评，因为他们通过奴隶制自身推行了压迫。是废奴主义者联盟结束了这种古老的压迫，并为“自由”一词带来了全新的意义。


    尽管如此，现实——随着它的展开——几乎无法被放进整齐洁的盒子里；而且，在我们塑造感知时，也有必要承认并欣赏这些细微差别。我一直认为，尽管开国父现在因为他们的亲奴行为而受到指责（这是合理的，至少在某种程度上），但他们也是在《独立宣言》之后撰写宪法的人，这最终加强了废奴运动的思想基础。托马斯·索威尔（Thomas
    Sowell）在一次采访中谈到，奴隶制之所以成为争议，仅仅是因为美国建立时的创始文件；在此之前，奴隶制在各种文化和文明中盛行的。


    问题通常在于，我们多年、几十年、几个世纪以来领导的斗争往往被我们的即时经验所污染——受到我们自己的政治信仰、社会阶层、性别、文化偏见等的限制——而不是我们作为人类整体的经验。当开国父为他们的自由而战时，他们并不知道他们的非裔美国公民的自由。我敦促你们问自己，今天，我们每个人是否都对世界上其他地区缺乏特权的同体的痛苦点无所知？我敦促你们反思，“噢，这对我真的没影响，我为什么要去操心几英之外的人？”是否是你们在下一代质问你们时会自豪地说出来的话。请记住，他们会质问我们的！


    我们现在所处的时代要求我们改变对自由的定义。记住，你有权选择你自己的定义。它可能和我的不一样，但它有权像我的定义一样存在。今天，我们正在应对一种不同的自由斗争。在取消文化和审查达到顶峰的今天，我们都是告诉我们该做什么的中心权威的奴隶。我们正被中心化权力统治着，而我们甚至不知道。就像在牺牲前被喂养的牺牲羔羊一样，我们在这些中心权力为我们建造的蚕茧中过着舒适的生活。


    回到我被问的问题，我如此强烈支持区块链的原因是因为我热爱我的自由；我热爱与拥有另一种信仰体系的人产生意见并辩论的能力。而且，区块链最接近这一真理。如果你愿意接受，去中心化的区块链解决方案在真正意义上赋予了你权力。


    而且，信不信由，区块链如此激烈提议的去中心化根本不是什么新主意。它从我们的祖先反抗英国统治时期就开始了，当我们展现出打破奴隶制枷锁的勇气时，以及当我们继续与基于性别、种族、社会阶层等的歧视作争时。我坚信区块链技术可以解决我们社会的不公，正如我们的开国父对殖民主义所做的，废奴主义者对奴隶制所做的那样。我们正处于再次创造历史的边缘，是否参与取决于你。


    '
- fmt: '

    When Satoshi brought about the bitcoin, they brought to the fore the rebellion
    that was going on for quite a while now behind the computer screens: the movement
    of crypto anarchy. We cannot fully understand blockchains unless we understand
    crypto anarchy. Blockchains might just be the missing link that connects this
    underground movement to the practical life applications. And, that’s why I say
    blockchains might just be the beginning of a new revolution in history.


    ## Roaming the Dark Screens of Crypto Anarchy


    There is a myth in Greek mythology about soulmates that humans were initially
    born with four arms, four legs, and two heads—two individuals in one body—until
    Zeus, in one of his angry fits, separated these two individuals; and, humans were
    cursed to spend the rest of their lives searching for their soulmates, finding
    that one person that fits just perfectly. Blockchains and cryptography seem to
    be the technological version of soulmates. They fit like a lock and key. Cryptography
    is one aspect that makes blockchains unstoppable.


    As technical as cryptography may appear (and it is, in our context), cryptography
    isn’t anything new. For centuries, civilizations have been using ciphers to protect
    information. Ciphers as old as 1900 B.C. have been uncovered and studied. But,
    it was only towards the end of the 20th century that these ciphers made a mark
    in the technological wave that gripped the world. Cryptography gave the world
    wide web (or the internet, as it’s called) a layer of security that people didn’t
    even know was needed. It is nothing but encrypting the data in a way that makes
    it very difficult to hack into. This ensures that the data reaches only the intended
    recipient. As we have seen before, this sophistication in terms of security is
    a big USP (unique selling point) for blockchain technology.


    We could dig deeper into information on cryptography, but that would have to be
    a separate book altogether because of its vast science in itself. What would,
    however, be relevant to our context is the ideology that lies at the core of this
    brilliant practice. Crypto anarchy started taking shape in the 1980s, when the
    likes of Steven Levy and Steve Wozniak would ‘hack’ into computers—not to steal
    or defraud, but to understand the software as closely as possible and to explore
    how the devices could be made better. In 1984, Levy published a book called `Hackers:
    Heroes of the Computer Revolution` where he talks about the hacker ethos, in which
    his passion for decentralization is quite obvious. A little later, in 1992, Timothy
    C. May, in his treatise `Crypto Anarchist Manifesto`, took the privacy aspect
    of cryptography to the next level by proposing a novel way of communicating with
    each other anonymously through cryptographic messages. Though he fully anticipated
    the government crackdown on this aspect in the form of laws and regulation, he
    also knew that nothing would be able to stop this anarchy.


    Now, understand that crypto anarchy, despite its name, isn’t about violence and
    opposing the establishment for the sake of it by spreading hatred and discontent
    among masses. I, for one, do not support such fanatic measures. Libertarianism,
    not extremism, is the solution. An establishment that respects and upholds the
    rights of all is the utopia that I seek.


    I hope that, as a reader, you can appreciate the ethical and ideological stand
    this crypto anarchy took. Cypherpunks, as these crypto anarchists call themselves,
    proposed an absolutely peaceful way of rebelling against the centralized authorities
    that are looking to regulate every aspect of our lives. Also crucial to note is
    that these individuals have been looking to bring social change by placing more
    power in the hands of people like you and me, especially when it comes to controlling
    their own data and privacy. When Bitcoin came about, the anarchical goal of cryptography
    seemed to have finally culminated into what it was intended for all along. As
    cryptography evolves blockchain into increasingly complex solutions applicable
    to the most basic aspects of living, the potential remains infinite.


    ## Centralization Vs. Decentralization: A Fair Argument


    Another of my favorite gems by Frederic Bastiat reads:


    "If the natural tendencies of mankind are so bad that it is not safe to permit
    people to be free. How is it that the tendencies of these organizers are always
    good? Do not the legislators and their appointed agents also belong to the human
    race? Or do they believe that they themselves are made of a finer clay than the
    rest of mankind? (A quote from `The Law`, n.d.)"


    Bastiat was obviously a vocal supporter of decentralization.


    I have always been in the habit of using quotes of these learned men to seal off
    the debates I tend to have with my fellow enthusiasts from other ideologies. And,
    whenever the topic of decentralization comes up and I bring to their attention,
    this quote (not in the same words, maybe, but a gist of it), tends to have only
    one retort:"Those were different times!" Though I believe that the core of the
    idea of freedom has never changed, I do agree about the different times clause.
    That is the reason why I am constantly seeking truth around me, in this day and
    age.


    In this quest, I have realized that the centralization vs. decentralization debate
    is imperative to us today, globally. This is especially because some of the most
    centralized states are aggressively working toward proving their dominance in
    decentralized technology. It makes me wonder why. Take China’s case, for instance.
    Though it has outright rejected Bitcoin, it has been one of the leading players
    in testing blockchain technology. It has recently even named a wide range of services
    to be the testing ground of blockchain technology. So, here is a centralized administration
    that places perpetual censures on its citizens’ freedom of expression, but also
    wants to put out a technology that promotes decentralization? Doesn’t quite fit,
    does it? The sad truth of the matter is such centralized states are indeed making
    a run for blockchains—not because they want to promote decentralization, but to
    control it. And, you don’t need me to tell you that controlled decentralization
    isn''t decentralization at all.


    Even as I write about the positive impact that decentralization can bring about
    in the lives of the common man, I am quite aware of the corresponding arguments
    in favor of centralization. Exactly opposite to decentralization is the belief
    that accumulating power in a central agency can improve the efficiency of decision-making,
    thereby improving the quality of life of the common citizens. The decisions are
    made, as well as implemented, much faster in a centralized structure.


    While that is certainly a valid argument, and there is no denying that decisions
    are reached at a much faster pace, my counter argument to that would be: Is speed
    always a good thing? There is a concept known as `groupthink` in psychology that
    would have the perfect relevance here. Groupthink refers to the blind trust that
    certain units may have that their group’s decision is infallible and cannot go
    wrong. This is so often predicated in the behavior of the political parties and
    their leaderships, and can be pretty harmful to the bureaucratic process.


    Let me give you an example—rather, let me ask you a question. Imagine that you
    have been feeling a little under the weather for a while now. You go to a hospital
    which has a team of doctors. You consult some of them, but get nothing definite.
    Then, after all this, you meet with the head of the department who takes one look
    at you and pronounces you a diabetic. The other doctors immediately agree, without
    any deliberation on the topic, because their chief just cannot be wrong about
    things! As a patient, would you find this pace of reaching the conclusion preferable?

