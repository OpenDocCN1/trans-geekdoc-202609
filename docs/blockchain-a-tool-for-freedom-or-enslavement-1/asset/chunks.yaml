    全景监狱理论在区块链技术的语境下具有双重含义。一方面，实力强大的国家似乎创造了一个全球全景监狱，监控着发展中中经济体，以至于这些经济体是根据发达国家的标准来评估的。这并不一定有助于发展中国家，不可避免地让富国更富，穷国更穷。


    然而，区块链技术彻底颠覆了全景监狱理论。或者我们应该说，它更加强调了这一点？感到困惑吗？没，重点在这里。全球全景监狱的问题在于权力集中在掌握游戏规则的全能玩家手中。但区块链技术所做的是获取这种权力并去中心化，使得所有利益相关者都能成为警觉的守护者。因此，从本质上说，它分散了全景监狱的影响因素，同时促进了自我调节方面的完善。


    ## 革命的成因


    区块链运动在 2008 年金融危机后开始获得动力，这并非巧合。这场危机比以往任何时候都清楚地表明，我们大多数金融交易的特征——信任，由于金融机构内部盛行的腐败和丑闻，可能会一夜之间消散。但是，如果这些金融交易的媒介本身都是不可信的，那么普通人能做什么呢？


    当美国经济逐渐被这种绝望吞噬时，一线希望从微小的裂缝中脱颖而出。俄罗斯历史学家彼得·克罗波特金曾评论道：“绝望的人不会反抗，因为革命是希望的行为”（彼得·克罗波特金引言，无日期）。这一次，这种希望的行为由一个名为中本聪（Satoshi
    Nakamoto）的实体以一份白皮书的形式完成的，书中讨论了“无须的赖”。


    直到今天，我们仍然不知道本聪是谁，但他们发表的论文提出了一个分布式账本的绝妙想法，这种账本通过超透明的功能模块，完全消除了我们交易中对信任的需求。很快，比特币诞生了，从那时起，人们对区块链的奇心就不断增长。这项技术以前所未有的方式挑战了现有系统。它试图从权贵手中夺取权力并将其分发，以让即使是最边缘化的人也能进入系统。如果革命不是这样，那还能是什么呢？！


    前美国议员、自由意志主义评论员罗恩·保尔（Ron Paul）曾正确地说道：“如果你为了安全而牺牲自由，你将两者皆失”（罗恩·保尔引言，无日期）。区块链比任何其他东西都是这种自由的象征——这种拒绝被无形力量枷锁束缚的自由。我们稍后将详细讨论自由和自由意志主义的概念；但现在，请理解这场革命不是左与右之间的斗争，而是人们坚定且团结地反对政府越权（通常被称为国家主义）的斗争。这是一场为了恢复当今世界中对你最重要的事物的而进行的斗争——你的权利、身份，以及构成你许多生活决策基础的信息的真实性。


    作为一个非常看重自由的人，我已开始尊重区块链的运作方式，我希望你在读完这本书后也能如此。区块链被恰切地称为“自互联网以来最大的发明”，并已成为 21 世纪最大的社会、政治和经济革命中至关重要的武器。不要让这场革命民主和平的本质误骗了你——区块链技术正在通过一个社区、一个企业、一个行业地改变未来。但这里你需要记住最重要的的一点——区块链革命并非始于技术，它始于你。


    ## 为什么是区块链？


    既然我们已经开始了关于区块链的讨论，你脑中可能有一个切的问题：为什么是区块链？这项技术有什么让它变得如此独特？更重要的是，为什么要把它炒作一场如此大的革命？事实是，我怎么强调都不为过，区块链是长久以来第一件赋予人们自由和权力的事物，这种权力赋予了像你我这样的人真正的意义。但这并不是我被这项技术的唯一原因，它对全球第三世界经济体可能产生的深刻影响。


    当我谈论发展中经济体的区块链技术时，往往会来白眼。人们几乎认为我是一个生活在云端、对现实毫无所知的第一世界公民。“这些国家甚至基础技术都没有，你计划在那里实施这种先进技术？”他们这样问。


    但这也是大多数人完全忽略的——发达国家和发展中国家的世界是完全不同的。因此，尽管像我这样的人可能觉得信用卡/借卡系统很费时，但服务对我们仍然可用。尽管存在缺点和风险，大多数人仍然能够让系统为他们服务。尽管区块链会带来显著的改进，但目前的系统至少是我们可用的。


