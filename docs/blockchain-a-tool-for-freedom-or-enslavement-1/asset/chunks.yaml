- fmt: '

    Blockchains are special because they can utilize this unassuming infrastructure
    to bring in the much-needed poise. Combine that with the artificial intelligence
    movement, and the African continent sure has something astounding at hand. The
    pre-existing challenges in the data quality and availability domains have certainly
    been a hindrance to the adoption of AI-related technologies, but the upcoming
    dApps and platforms are overtaking these difficulties to reach the absolute core
    of the African population. For instance, the dApp `UjuziKilimo` uses AI in the
    form of sensors and other farm data analytic tools to help small farmers make
    sense of the agrarian data, thereby helping them make vital decisions on the back
    of scientific evidence. This dApp has been providing the Kenyan farmers with real-time
    soil testing data to transform their agricultural practices. Though this dApp
    does not currently use blockchains, you can only imagine the refinement that a
    blockchain-driven AI technology like this could attain.


    The blockchain artificial intelligence movement is gaining momentum in various
    parts of Africa, but Nigeria seems to be at the front of the pack. For a long
    time, the Nigerian economy has been dependent on its crude oil production, but
    the recent drop in crude oil prices has made it lose its title of top producer
    of crude oil to Libya. This seems to have hastened the need to diversify the economy,
    and blockchain-driven artificial intelligence appears to be at the helm of this
    diversification. `LoopBlock Network` is a Nigerian company that integrates blockchain
    and AI solutions to build viable platforms. They recently announced their plan
    to train 100 Nigerian youth in this sector (Anagor, 2022). This may seem like
    a minor event, but it signifies the large influx of the blockchain-AI collaboration
    that is about to happen in the near future.


    `Cardano` remains at the fore of these advances, offering a great blend of artificial
    intelligence and blockchains. And, that is why AI companies are betting on `Cardano`
    for raking in long-term gains. `Cardano`, in collaboration with `SingularityNET`
    and `iCog Labs`, is busy digging into the untapped robotics and AI markets to
    support the technological community in Africa. They have even been chosen to power
    the humanoid nurse named `Grace`. Though this project is, for now, independent
    of their African affiliation, the direction in which the efforts have headed only
    serves as a signal for the advancements that are on the way.


    `EMURGO`, the global blockchain solutions company that was the founding entity
    for `Cardano`, recently announced a special African wing that would invest $100
    million dedicated to the development of the tech industry. This would be reserved
    to helping start-ups and, in the process, building an ecosystem for the smooth
    functioning of blockchains. Without a look at this emerging ecosystem, it would
    be impossible to gauge the true impact of this technology.


    ## Housing


    In well-developed countries, we seem to take our right to own property as a given.
    Of course, even in the West, the process has gotten increasingly tedious; but,
    the reality is we still have the necessary institutions and infrastructure to
    claim this right. Unfortunately, the same cannot be said for our counterparts
    in the developing economies, especially the African continent. Africa has been
    in the middle of what would seem like a never-ending housing crisis for a long
    time now. Political indifference and lack of reasonable policy changes directed
    towards affordable housing have left the younger generation of Africans out on
    the street. Currently, the housing is backed up by almost 50 million units, compared
    to the number that’s actually required. The ridiculous mortgages amounting to
    30-45% make it even harder to own a house (Hamilton, 2021). With interest rates
    that high, it is practically impossible for the common man to think of long terms
    for repaying the loans.


    The situation is made worse by the mere fact that the large amounts of international
    aid that is directed towards this continent end up never reaching their desired
    recipient. The international investment has also been dwindling due to the legislative
    policies, depreciating rate of currencies, and the general rampant corruption.
    All these factors together have left a majority of the African population exposed
    to suffering as a result of never being able to own wealth in the form of property.


    Blockchains are on their way to change this through the channel of `Empowa`. `Empowa`
    is the first property platform on the `Cardano` blockchain aimed at helping Africans
    own property at affordable rates. This decentralized finance (DeFi) platform uses
    a token named `EMP`. In the simplest words, it can be thought of as a channel
    that allows people who have money across the world to finance the lesser privileged
    individuals in Africa who wish to own a house. But, the actual manner of its functioning
    is a tad more complicated.


    Here’s how it works. `Empowa` uses the `EMP` token built on `Cardano`, which would
    help various parties all over the world to use this platform in several unique
    ways. Since it is one token across the platform, no one has to worry about transacting
    in different currencies. These then enable the user to purchase `Impact Cards`.
    On the other side of the transaction, the `EMP` tokens that are received by selling
    the `Impact` cards are again changed to the native currency, through the platform’s
    smart contract feature, where the property is actually being constructed. Mozambique
    has been looked at as a potential candidate to develop the proof of concept for
    this particular venture.


    ## Connecting the Unconnected


    `Cardano` has also partnered with `Input-Output Global` (`IOG`) and `World Mobile`,
    with the mission to ensure that all Tanzanians have mobile connectivity which
    would, in turn, give them access to education, healthcare, finances, and so on.
    `World Mobile` claims to be the first mobile network built on blockchains. Its
    CEO, `Micky Watkins`, is quite clear about the direction of this project. He says
    in a Tweet: “To bank the unbanked, we first must connect the unconnected. Half
    of the world isn''t connected to the internet. We''re going to change that” (World
    Mobile, 2021, para. 2).


    The goal is to provide stable and fast 5G connections to the population that currently
    doesn’t enjoy great internet stability. The model seems to be an interesting one.
    The reason for the connectivity is that expanding into the remote areas is not
    really considered a value proposition by regular network providers. `World Mobile`
    plans to change this by introducing a sharing economy system—each company could
    run separate nodes on the network to keep their respective areas connected, while
    also being incentivized with `World Mobile tokens`.


    ## Smart City Project


    In the last few years, cities like Singapore, Chicago, and Gothenburg have emerged
    as model smart cities with highly digitized urban management. Blockchains have
    the capacity to bring this level of sophistication to more and more cities. This
    has inspired major interest in trying to figure out the details of implementation
    across the board. The government of Uganda has partnered with `Adanian Labs` and
    is in talks to turn its city of Entebbe into a blockchain-driven smart city. What
    this smart city would entail is still left to be seen, but the wheels are moving,
    for sure.


    ## Healthcare

