- fmt: '

    So, the voter is required to send in a ‘ballot.’ This is like a proposal for how
    they’d like to spend the funds—maybe start a blockchain initiative, start a business,
    make some improvements to the Cardano ecosystem, etc. These ballots are then sent
    to Submittable, a social impact platform that first screens these ballots for
    any malicious elements, like D-DOS attacks, and then puts them through a process
    called innovation management. Here, the community members and experts are incentivized
    so as to seriously check the validity of the ideas in the ballots. Now, at this
    point, none of the ballots are rejected but, instead, are given a rating. Once
    these ratings are completed, the ballots are put through two rounds of voting:
    preference vote, which decides on what sectors need to be prioritized and threshold
    vote, which decides on which of the ballot ideas get funding.


    The beauty about this system is that, regardless of how many `ADA` tokens a community
    member holds, their voice will receive no differential treatment as compared to
    others. As long as the idea is in the interest of the people and is approved,
    it will be implemented. Remember that what I have discussed here is just a faint
    outline of the voting process. The actual voting is quite intricate.


    You might ask how this voting mechanism is relevant to you? I would like you to
    compare this system to your municipal voting. What if the citizens were given
    the opportunity to participate in something similar?


    In Canada, for instance, there is something known as referendums that take place
    during elections. So, when voting for representatives, the citizens also get an
    opportunity to vote for a major issue that they think is most relevant to be resolved.
    In the current system, it doesn’t happen often. Now, imagine such referendums
    happening more and more frequently with the ease of the blockchains, and citizens
    participating in most, if not all, vital decisions affecting their community.


    This blockchain mechanism shows us that true decentralization is very much possible
    and can be implemented at the level of local governments, too. The Cardano votes
    happen almost every six to eight weeks, where new features and policies are brought
    in. If we could create a similar incentivization program for the citizens, there
    is no reason why a robust participation isn’t possible. It’s time to reclaim our
    voice and make it matter.


    # Chapter 9: Banking and Financial Sector


    The linchpin that allows the world’s nefarious central banking model to be so
    effective is that the commonfolk - the plumber, the electrician, the teacher,
    the bartender, bus driver or barber - don’t understand it. – Quoth the Raven


    For a long time, our banking institutions have been afforded the royalty status
    that comes with being the guardians of our money. Not only that, but they have
    enjoyed unlimited powers to produce and distribute the money as they deem fit.
    The distribution is, of course, never fair and has created more problems for economies
    than it has solved. After the 2008 crisis, the disillusionment was complete; the
    guardians had, themselves, turned traitors, betraying the trust of several thousands
    of people. And, this is when we seriously started considering what this meant—what
    were these institutions that enjoyed such infinite hold over our lives, our economies,
    our trade, everything? Did we really need these guardians?


    As cryptocurrencies were gaining traction, a vast majority of the banking community—the
    people in their ivory towers— seemed to think this was a temporary trend that
    would fade out like the bell bottom jeans fashion of the ‘70s. The more momentum
    they gained, the dismissal turned into skepticism where accusations were made,
    labeling the technology almost criminal and illegal. But, now that cryptocurrencies
    have come of age in the global economy, all the institutions that were critical
    are now eager to join the crypto-club.


    For centuries, these institutions have been choreographed by the puppet masters
    in ruling governments to further their own agenda. In the process though, not
    only have millions been forced below the poverty line, but the rich politicians,
    even more than the rich entrepreneurs, have continued to amass wealth at the same,
    if not at a faster rate.


    Many seem surprised by the popularity of cryptocurrency. But, to anyone who has
    paid attention to the economic highs and lows of the last few decades, it would
    be crystal clear that the banking and finance sector has been ripe for disruption
    for a while now. The opportunity has finally been realized in the form of cryptocurrency
    and blockchains.


    ## Open Versus Decentralized Finance


    We have to understand that the first generation of blockchains, in the form of
    cryptocurrencies, is undoubtedly directed at loggerheads with the traditional
    banking system. After all, the sole aim of cryptocurrencies was to eliminate the
    need for banks as the middlemen in transactions. But, unfortunately, as revolutionary
    as the idea is, the institutions that have retained power for centuries are not
    going to relinquish it so easily. Cryptocurrency is still restricted, to a large
    extent, by regulation and is far from replacing the entire banking system, at
    least in the near future.


    But, there’s no reason to lose hope, yet. Blockchains are still bringing in impactful
    change in the open finance avenue. Open finance refers to the transfer of traditional
    assets in banking which have been typically closed on blockchains. This can be
    done in the form of digitization of these assets into security tokens and stablecoins,
    which are backed by fiat currency. Remember that open finance is not the same
    as decentralized finance. We shall talk about decentralized finance, too, in just
    a while; but, it’s worth noting that open finance has also been a vital step in
    the financial disruption, as the incumbent institutions are under immense pressure
    now to adopt a more efficient system.


    People who are skeptical of cryptocurrencies may find a suitable, protected substitute
    in the form of stablecoins. One fear that people consistently have when it comes
    to cryptocurrencies is their volatility. Stablecoins, on the other hand, are backed
    by an asset—mostly fiat money. In fact, many who invest in cryptocurrencies use
    the stablecoin as a backup. This means that, the moment there is a crash, the
    investor converts their crypto into stablecoins within minutes. This is especially
    beneficial since most cryptocurrency platforms charge a massive fee for conversion
    to fiat money. Essentially, stablecoins allow the financial institutions to utilize
    the quick, convenient, and immutable mode of money transfers, but do not offer
    the same decentralized solutions as crypto.


    Security tokens are another wonderful application of blockchain technology in
    finance which allow the contributor to create value for the company by holding
    its share in the form of a digital token. You often see big companies with rich
    valuations, while their contributors hardly get their worth. Take Uber, for example.
    While the company’s valuation may be in billions, the drivers stand no chance
    of any meteoric returns. A security token, in this case, gives the driver some
    form of ownership. These tokens could increase in value as the worth of the company
    increases. Thus, the drivers are more motivated to give better services, and it’s
    a win-win for both the company and the contributor. This is still a part of open
    finance. Its counterpart in decentralized finance would be called a utility token,
    something like `ADA` is on `Cardano`, which carries value and can be utilized
    for a wide range of purposes in the company’s blockchain network.

