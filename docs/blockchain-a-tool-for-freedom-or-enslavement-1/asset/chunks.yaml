- fmt: '

    Those who highlight the volatility and risks associated with crypto often make
    the mistake of associating all of it with blockchains, too, and this could not
    be farther from the truth. Of course, we will discuss Bitcoin in great detail
    a little later, but right now it’s important to dissociate the two. For this,
    it’s necessary that we understand the technology in greater detail. Getting to
    understand the principles that we previously discussed is one part of understanding
    blockchains. The other part is technological innovation. The misleading myths
    about blockchains cannot be dispelled until, and unless, we have an in-depth comprehension
    of the various cogs in the wheel of blockchain technology.


    ## Elements of a Blockchain


    Though the scope of this book leans more towards the implications side, I still
    wish to take you through the technicalities of the blockchain. We won’t go into
    so much technical detail that anyone reading this would be able to create a blockchain
    themselves. But, I sure hope that, if the technological terrain interests you
    in general, then the coming section would spark an interest that may drive you
    towards blockchain solutions with more passion. For our broader purposes now,
    however, we shall look at the technological aspects from the perspective of simplifying
    them and understanding what these aspects mean for us in our daily lives.


    ### Common Terminology


    When reading about blockchains, you’ll frequently come across certain words that
    may seem like Latin and Greek. But, doesn’t every child feel the same before learning
    the alphabet? So, here we go, learning the alphabet that makes up the blockchain
    world.


    First off, what we need to understand is that a blockchain is a network made of
    several nodes. Nodes may be compared to small servers relaying data back and forth
    on a network. The presence of these multiple nodes is what ensures transparency,
    and you’ll see how that works in just a while.


    ![](Images/image00156.jpeg)


    With that basic framework out of the way, let’s start with the block in the blockchain,
    first and foremost. These blocks have some characteristic traits and aspects that
    would be useful for our reference. The first block in the chain is aptly named
    the `genesis block`. Think of this as the ground zero for a blockchain; this is
    where it all begins. As the transaction data increases, it is bundled together
    in this block and then filled up to its capacity. The capacity may differ, based
    on the type of blockchain application. Once the `genesis block` is filled, the
    next block comes up and the transactions are recorded there. The major difference
    between the `genesis block` and the following blocks is that the latter all have
    a reference to the prior blocks; since the `genesis block` is the first one, there
    is obviously no prior reference.


    The blocks have three aspects which are of special significance from the perspective
    of the end users of blockchains. One of them is certainly the `time stamp`. This
    `time stamp` is decided based on the time of the transaction received from all
    the nodes on the blockchain. So, imagine a blockchain that’s spread across the
    United States, Australia, Canada, and India. Since all of these are in different
    time zones, the blockchain application would adjust for time from all of these
    nodes to get a median `time stamp` for the transaction. Since these `time stamps`
    are corroborated by multiple nodes, it becomes simply impossible to manipulate
    record keeping.


    The second aspect is the `hash` that’s generated with each block. `Hashing` is
    quite a mathematical process that takes varying lengths of the strings input from
    transaction data, and converts it into an output of a fixed length. The `hash`
    provides the transaction with added security due to the extremely mathematical
    algorithmic nature of the whole process. That, indeed, makes it much more difficult
    for the malicious hackers to tamper with the data itself. The data, thus, reaches
    the precise intended recipient, making manipulation that much harder.


    ![](Images/image00157.jpeg)


    Rather than go into the algorithmic detail of this `hash function`, I would like
    to talk to you about what it means to you as an end user, without ever realizing.
    Every block of a blockchain has a `hash` of the previous block embedded within
    its header. The brilliance of this technology truly lies in the simplicity of
    the logic used. What this chained embedding of previous `hashes` does is that
    it makes it practically impossible to manipulate one block without manipulating
    the others. And, manipulating data on that large a scale whereby all the blocks
    are manipulated is immensely unlikely.


    ![](Images/image00158.jpeg)


    If someone does find the massive intellectual capacity to do it, it would still
    be a mammoth financial undertaking to gain the physical resources to get it done.
    Remember the point we made earlier— cheating is either extremely difficult or
    extremely expensive, or both, in the case of blockchains. The `hash function`
    is one of the things that make it so. The `hash function` is also what makes digital
    signatures, that we are all familiar with, possible.


    The third and last aspect that makes blockchains is what is known as `nonce`—a
    number used only once. This is a number that’s assigned to every `hash` of every
    block. This is the number that a miner would have to discover to begin the process
    of mining. Since finding this number isn''t all that easy, `nonce` almost acts
    like a screening test to weed out the less capable miners.


    To understand this, we’ll have to dig a little deeper into the mining process.
    `Mining` is what earns the much needed rewards for those operating the nodes of
    the blockchains and incentivizes them to keep the integrity of the network intact.
    Think of these miners as auditors who are paid to keep the transaction data neat
    and clean. If you have the slightest interest in blockchain technology, `mining`
    is a term you have surely heard of. And, the traditional usage of this word obviously
    brings up the imagery of hot, humid, and dark underground tunnels housing the
    hardworking laborers. The truth is, blockchain miners are just as hardworking,
    but the difference is they can do it from the comforts of their homes as long
    as they have some high-power `CPUs` and a lot of in-depth knowledge of the mathematical
    computations.


    In simple words, `mining` is used to refer to the process of validating the transactions
    on blockchains. Let’s say, there are two stacks of $100 bills. One of them is
    legitimate, while the other is counterfeit. Since no one has checked which one
    is which, both the stacks continue to be used in transactions. Now, those who
    are fortunate enough to get the legitimate bills will face no problems, but those
    who have counterfeit ones run the risk of being caught unawares. However, what
    happens in blockchains is a little different. There are a few people here who
    can check the validity of those bills. These auditors take the time to look at
    both stacks, verify their serial numbers, and separate the counterfeit bills,
    thereby stopping them from getting into circulation. For these auditors to continue
    to look at such counterfeit bills, however, they would need to get some kind of
    rewards.

