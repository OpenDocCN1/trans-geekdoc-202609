    \ very moment. The more myths around this technology that we help dissolve, the\
    \ closer we will be to a truly participative system we will be able to contribute\
    \ to. I mention this here, specifically, because our healthcare systems are currently\
    \ in dire need of such meaningful transformation. \n\nIt's wonderful to see that,\
    \ despite the resistance, blockchains have been able to make significant inroads\
