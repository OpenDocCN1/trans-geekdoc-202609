- fmt: "\nApart from these, there are two added benefits that can come from blockchains.\
    \ The first, loyalty and rewards, we have already discussed earlier in relation\
    \ to small entrepreneurs. The second benefit is even more curious: customer reviews.\
    \ Again, the principle of immutability is at work here, but the manner in which\
    \ it comes across is quite novel. On a blockchain-based e-commerce platform, when\
    \ the customer leaves a review, there is no way it can be changed, for better\
    \ or for worse. Thus, it is likely that the reviews are more trustworthy and reliable.\
    \ \n\n# Chapter 13: Art and Culture\n\nArt and culture are key cornerstones of\
    \ any civilization. The free expression of thoughts, ideas, and feelings is only\
    \ possible when creativity is allowed to fly free without the restrictions of\
    \ censorship. The artistic freedom, combined with the absence of stifling centralized\
    \ censorship, can create moving pieces of work. But, the lack of censorship is\
    \ only a tiny sliver. The blockchains, intertwined with the artistic talents,\
    \ are creating noteworthy projects, leading to diverse approaches to art itself\
    \ and, also, a growing market for collectors and art enthusiasts. \n\n## Non-Fungible\
    \ Tokens (NFTs)\n\nA big use case for blockchains in the art and culture segment\
    \ is the Non-Fungible Token (NFT). We already spoke about these in a very crude\
    \ form earlier, but now it’s time to dig deeper. To give you a brief reminder\
    \ of what NFTs are, let’s say they are blockchain-backed digital tokens. These\
    \ tokens could be an audio clip, a video, a piece of digital art, and so on; and\
    \ they could be tied to a cryptocurrency. Now, what makes an NFT different from\
    \ cryptocurrency is, while the latter carries the same value, the former does\
    \ not. This means that, when I say `Bitcoin` is worth so-and-so amount, each `bitcoin`\
    \ has the same rate; but, when I talk about `NFTs`, each `NFT` is like a differently\
    \ priced commodity. So, just as two art pieces wouldn’t cost the same, two `NFTs`\
    \ wouldn’t either, because art pieces are exactly what they are. So, just like\
    \ when you buy `Bitcoin`, you would get a unique key—when you buy `NFTs`, too,\
    \ you would get a unique and secure digital token. \n\nTo a layperson, the digital\
    \ file that you receive may not seem like a big deal, but to the art appreciators\
    \ and collectors it is certainly worth the millions that they spend on these art\
    \ pieces. It signifies more than just owning the piece; it essentially means that\
    \ these people have gone down in the digital history of that piece for an eternity\
    \ and beyond. With this purchase, though, art connoisseurs don’t own the copyright\
    \ of the work, which still rests with the artist. That means that the artist can\
    \ create more artwork just like the one you own—a little like limited edition\
    \ baseball cards, if you will. A number of `NFT` marketplaces have come up like\
    \ `SuperRare`, `OpenSea`, `Nifty Gateway`, `MakersPlace`, etc. which take a commission\
    \ on each artwork sold. In return, they make sure the artwork is advertised and\
    \ the transactions run smoothly. \n\nNow, the disruption is this: `NFTs` are empowering\
    \ artists and creators to make a living doing what they love. The technology that\
    \ they have added to the mix can help these artists reach and engage with a much\
    \ larger crowd directly, without any agents. The other benefit that these `NFTs`\
    \ bring to the artists is the undisputed record of ownership. While, in traditional\
    \ art, there are a lot of feuds about the original vs. fake, here the possibility\
    \ never arises. From an artistic point of view, `NFTs` provide yet another medium\
    \ to pour onto the canvas or rather the screen, all of the artist’s creative expression.\
    \ Furthermore, the `NFTs` can bring about a much more unbiased and unskewed market,\
    \ giving equal opportunities to artists regardless of gender, race, etc. \n\n\
    `NFTs` also solve the problem of royalties for the artists. Consider this scenario:\
    \ In the traditional art industry, though the artist holds the rights to his work,\
    \ there would be no way for them to know if their painting has been sold or pirated.\
    \ Thus, even though the concept of royalties exists in theory, in practicality\
    \ it’d be quite difficult to enforce. However, on the blockchains, with the use\
    \ of `smart contracts`, the artists can make sure they receive a certain portion\
    \ of the consequent sales. \n\n`NFTs` will also change the landscape of art collection,\
    \ so to say. The art collector will no longer have to be a rich man, sipping wine\
    \ from the glass in one hand and holding a cigar in the other. Since the collection\
    \ remains online, anyone with the slightest propensity towards art can purchase\
    \ an `NFT`. The prices can start as low as `$12` and go up to hundreds of millions,\
    \ giving the purchaser a wide variety of choices. \n\nAnother aspect to consider\
    \ here is that `NFTs` don’t have to be just artwork, but could be anything from\
    \ music, photos, or anything at all. Any music fan would know that, historically,\
    \ recording labels have not been the most respectful toward the artists. This\
    \ reality—which was, for the most part, kept under rug previously—was publicly\
    \ exposed when the legendary `Prince` wrote ‘slave’ on his face, comparing his\
    \ contract with `Warner Bros.` to slavery. The recording labels have continued\
    \ to have that hold over musicians, more often than not handing them the shorter\
    \ end of the stick. With the emergence of `NFTs`, however, that can change as\
    \ artists are ditching the labels altogether and selling their work directly to\
    \ the listeners in the form of `NFTs`. \n\nThe same goes for comics selling their\
    \ standups as `NFTs`. `Jamb` is a comedy collectible startup that is raising millions\
    \ for building a marketplace for comedy `NFTs`. Apart from raising money for comedy\
    \ sets, `NFTs` also offer the censorship-free zone to these comedians, to create\
    \ satirical pieces. Comedians have often come under fire for making comedy, which\
    \ is exactly what they are supposed to do. But, there seems to be a wave of the\
    \ cancel culture, whereby people believe that anything they don’t agree with needs\
    \ to be condemned publicly, and even abusively. This very perception seems to\
    \ be fueling the raging fire of the culture wars around us today.\n\nWith the\
    \ woke pseudo-liberals waiting at every turn to cancel a comedian’s right to free\
    \ speech, the social climate is becoming ever more insecure. This self-proclaimed\
    \ moral police hate comedians who do commentary on current events. I wonder if\
    \ it is because they speak the truth—a truth so beyond pathetic that it lands\
    \ itself into the hilarious realm? Blockchains and `NFTs` can certainly breathe\
    \ new life into this artform. One thing is certainly true: The implications of\
    \ `NFTs` run far and wide for all genres of art. \n\n## Decentralized Social Media\n\
    \nSocial media is almost a vital part of our social lives today—one we almost\
    \ cannot do without. You’d think it is almost mandatory to post everything, right\
    \ from what you eat to where you are, on your wall. But, at what point can we\
    \ say that our social media platforms stop connecting and start intruding? \n"
