    \ for claim settlement. \n\nApart from microinsurance and health insurance, the\
    \ industry at large also presents us with several sub-sectors that might be ripe\
    \ for a blockchain disruption: high-value items registries, anti-money laundering\
    \ protocols, know-your-customer (KYC) procedures, reinsurance, claims handling,\
    \ reinsurance—again, the possibilities are endless.\n\nBefore we wrap up the section\
    \ on banking and financial sectors, there’s one aspect I’d like to emphasize here.\
    \ We might think that some of what we discuss in the banking section has to do\
    \ with only the big companies—especially stock trading or trading finance—but,\
    \ we need to learn to look at these as part of the big picture. As we discussed\
    \ in the Austrian economics section, looking at these aspects as isolated instances\
    \ will only lead to a narrow, tunnel vision. As goes the wise phrase: The whole\
    \ is often more than the sum of its parts. And, all of the parts we have discussed\
    \ up until now, and the ones that are coming after this, have great cumulative\
    \ effects on our social, civic, and economic well-being, even when we feel we\
    \ are not directly affected. \n\nFinancial sector still remains the most widespread\
