  raw: "If you ask me, I wouldn’t! As talented as the doctor might be, the team’s\
    \ consensus there has come from not discussing evidence as it should, but from\
    \ their belief that their leader can do no wrong. In this case, even if a junior\
    \ doctor has a different opinion on the matter, it may never reach the forefront\
    \ because, in a scenario like this, any individuality or conflict is implicitly\
    \ thwarted while conformity is promoted. \n\nThis is likely to happen in a centralized\
    \ structure much more often than a decentralized one. Now, imagine that this doctor\
    \ at the hospital gave his diagnosis, which you then took to other doctors at\
    \ other hospitals for a second and third opinion. They are much more likely to\
    \ view this diagnosis in an unbiased manner because they aren’t influenced by\
    \ how great this doctor is. It’s more conceivable that they will corroborate the\
    \ opinion with the symptoms and reach their own conclusions. Sure, I oversimplify\
    \ things here for the purpose of understanding, but you get the drift. The point\
    \ is that faster decisions aren’t always better decisions. \n\nAs T.S. Eliot eloquently\
    \ puts it, \"Most of the evil in this world is done by people with good intentions\"\
    \ (T.S. Eliot Quotes, n.d.). If you look at this quote in the context of history,\
    \ almost all of the catastrophic events the human race has had to face, be it\
    \ the holocaust or any other form of the so-called ethnic cleansing, have undoubtedly\
    \ been the result of centralizing power in one political party, person, or even\
    \ ideology.\n\nDecentralization drastically reduces the likelihood of such disasters.\
    \ Decentralized structures, especially the ones utilizing blockchains, are much\
    \ better at reaching consensus after validating the evidence. These promote individuality\
    \ and conformity to a principle, rather than a group or an individual. It’s agreed\
    \ that their consensus-reaching mechanisms are resource-intensive and still require\
    \ refinement but, as I mentioned before, blockchains are still growing. Based\
    \ on the innovation we have seen in this avenue, we can expect much more work\
    \ in environment-friendly consensus mechanisms like Ouroboros in the future, as\
    \ well.\n\nAnother argument that’s often put forth whenever blockchain decentralization\
    \ talks come up is the fear of criminal activity that may arise in an online network\
    \ like this. I see people, so many times, taking online to automatically mean\
    \ shady. The opponents of blockchain technology in the media, as well as government\
    \ and regulatory bodies, continue to use this fear and ignorance to feed inaccuracies\
    \ in the minds of the people that would, indeed, feel differently if they were\
    \ given the right information. For instance, there is a myth that blockchains\
    \ support illicit transactions because they are anonymous. Data suggests otherwise.\
    \ \n\nThe Silk Road fiasco of 2011 is a personal favorite of many denouncing blockchain\
    \ technology. This is where Ross Ulbricht was convicted of running a darknet black-market\
    \ platform called Silk Road, on which illicit activities like drug trafficking,\
    \ money laundering, etc. were quite rampant. Ulbricht was sentenced to life in\
    \ prison. Critics of blockchain technology use this debacle to bring a premature\
    \ finality to the blockchain decentralization debate. But, here is what they don’t\
    \ understand. The evidence that was collected after the FBI crackdown was, indeed,\
    \ largely possible because it made use of a cryptocurrency blockchain. Since the\
    \ data was so decentralized, it was impossible to manipulate it. At the same time,\
    \ the transparency of the transactions practically made all the paperwork for\
    \ search warrants and surveillance absolutely redundant, expediting the conviction.\
    \ \n\nThe holier-than-thou attitude of those advocating traditional financial\
    \ institutions over blockchain solutions is surprising if we look at the soaring\
    \ crime rates committed with, and for, fiat money. Of course, the fact that fiat\
    \ money transactions are a breeding ground for illicit activities cannot be a\
    \ defense for the crime that may take place on a decentralized blockchain. It\
    \ would be inaccurate to say that blockchains are completely impervious to such\
    \ activities; they are certainly not. But, believe it or not, tracking crimes\
    \ is far easier on the immutable distributed ledgers in a blockchain rather than\
    \ a physical black market where cash exchanges hands illegally. \n\nI wish to\
