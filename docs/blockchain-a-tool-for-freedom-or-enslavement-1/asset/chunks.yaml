    在“孩子与糖果”的类比中，如果你留意，结果取决于那个孩子的诚实程度。同样，我们的传统系统通常期望将诚信完全建立在个人身上，而不是过程本身。我们期望政治家言守信义，期望银行家在金钱交易中保持诚实，而并不要求他们必须建立了正确的问责体系。请注意，我绝非试图将责任推给腐败的个人。但是，我们所生活的系统几乎就像坐在一辆没有安全气囊的飞驰汽车里，抱着永远不会发生事故的希望继续下去。问题在于，我们总是生活在结果的不确定性中。而当硬币落向另一面时，再想做什么也太晚了。


    请用极度诚实的态度回答这个问题：如果我告诉你你永远不会被发现，你还会做正确的事吗？我们作为一个社会，选择监管这种行为的方式是施加外部规则，而事实上，更有效的手段是引入“网络化诚信”（networked
    integrity）的概念。这意味着，一个人行为的透明度和诚信并不取决于道德价值观的模糊地带，而是由系统结构本身激励的。


    想象一下生活在一个紧密的部落中是什么体验，例如。假设你和一个部落在一个食物资源有限的岛上生活。一天，你发现了一个巨大的美味鱼类作为完美的猎物。整个部落评估了这次猎获，并让你负责确保在他们从打猎回来之前，鱼是安全的。在这种情况下，你有两个选择：一个是保护好鱼直到部落返回，然后在成员之间平均分配；另一个是你自己吃掉一部分，并为发生的事情编造一个故事。很可能，无论你饥饿到什么程度，你仍然会选择第一个选项。


    原因很简单——这个部落的构建方式使得他们的信任对你来说，远比饥饿带来的即时满足重要得多。如果你失去了那种信任，你极有可能会被逐出部落并自生自灭。因此，欺诈会在两个层面上得到防止。首先，由于整个部落都看到了猎物，要编出一个故事需要耗费很大精力。其次，即使你严造了故事，部落成员也再无法像以前那样看待你了。总而言之，遵守部落准则将是一个容易多的选项。


    ### 网络化诚信


    这正是区块链通过其网络化诚信原则对虚拟数据所做的。作弊、黑客攻击和操纵要么变得不可能，要么让个人付出沉重的代价，从而最大限度地减少沉于这些行为的动机。


    这种网络化诚信原则在解决“双花费”问题上发现了最有实用的意义。你是否想过，为什么你可以在手机上拍摄食物照片并发送给多个朋友，但对你的数字货币却做不到这一点？这显然是因为钱和照片不是一回事。虽然你可以用任何想要的东西换取钱，但我很难认为你可以对你的食物照片做同样的事。好吧，我知道问这个问题似乎很愚蠢。但这似乎是在线交易中一个巨大问题的根源。


    显而易见，数字货币不能同时出现在两个地方。因此，钱必须离开你的账户并进入你支付给对方的账户。在双花费的情况下，代表你数字货币的数字令牌文件可能会被伪造——结果就是同一个令牌被使用了两次。这对于试图欺骗系统的劣质元素非常有效，但会给接收这些令牌的方造成巨大损失。这通常就是为什么我们需要银行这样的第三方成员来监控数字交易。但是，尽管我们可能讨厌这样，这些第三方成员本质上也同样具有欺诈性。


    区块链凭借其网络化诚信使这种复制变得不可能，同时也让第三方监控变得多余。例如，在加密货币的情况下，这是通过共识机制实现的，区块链上的每一个人都就特定的交易与特定的加密货币令牌达成必要的一。这笔交易有一个无法复制的时间戳。这在很大程度上解决了双花费问题。


    如果你在好奇是什么确保这群同伴在区块链上的活动中保持诚实，请记住，所有这些同伴对系统的顺畅运行都拥有平等的利益。我确定你参加过那种小组项目，其中总有一个成员不可避免地摸鱼，但却能根据小组表现获得相同的分数？如果这些学校项目评估的不是小组的表现，而是个人的表现以及他们对小组输出的成功或失败做出了什么贡献会怎样？搭车者自然会追求更有价值的贡献；如果他们没有这样做，就必须面对后果。这将激励那些已经在努力工作的人进一步改进，因为他们的他们会转化为有意义的成绩；并让那些完全不工作的人加把劲。


    区块链与参与的同伴之间或多采用相同的逻辑。每个人的贡献对区块链的运行都至关重要，而且只有当这种顺畅运行持续时，同伴才能获得回报，这让每个参与者都保持警觉。这一点意义重大，特别是在世界上某些主要机构已被腐败侵蚀、无法信赖验证交易的地方。由于区块链依赖于不是一个、而是多个验证源，这个问题可以在很大程度上被避免。然而，重要的一点是不能让网络化诚信在自动模式下运行。如果发生这种情况，那么恶性势力将很容易接管网络的大部分，从而极大地损害了让区块链脱颖而出的诚信本身。这就是为什么我一直告诉人们，仅仅将区块链视为技术是没有任何帮助的。我称之为为革命，因为你我都是它的一部分——或者说，我们必须是它的一部分。没有我们的参与，它可能只是另一种压迫大众的工具。


    ### 安全


    区块链技术提供的安全性，当然是我们这些热爱自由的人一直以来一直在寻找的圣杯。我们不再需要为了安全感而牺牲自由，反之亦然。有趣的地方在于，虽然传统系统通过增加外部来源的监视来提高安全性，而区块链通过简单地允许用户对数据拥有绝对控制权来实现这一点。


    加密在这种方案中起着至关重要的作用。只需注意，加密代码通过确保只有数据的预期接收者才能读取，使我们能够保持数据安全。例如在加密货币的情况下，数字令牌的买卖是通过个人用于访问相关信息、完成交易并离开的加密密钥进行的。加密帮助区块链将黑客拒之门外，至少在大多数时候是这样。

