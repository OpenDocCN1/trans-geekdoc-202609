    当中本（Satoshi）带来比特币时，他们将一直在电脑屏幕后进行的反叛运动推向了台前：加密无政府主义运动。如果我们不理解加密无政府主义，就无法完全理解区块链。区块链或许将这一地下运动与现实生活应用连接起来的缺失环节。正因如此，我说，区块链可能正是历史上某场新革命的开始。


    ## 在加密无政府主义的黑暗屏幕中穿行


    希腊神话中有一个关于灵魂伴侣的传说：人类最初生来有四只手臂、四条腿和两个头——一个身体里有两个个体——直到宙斯在一次愤怒爆发中将这两个人分开；从此以后，人类被注定终生寻找自己的灵魂伴侣，寻找那个完美契合的人。区块链和密码学似乎是灵魂伴侣的技术版本。它们像锁和钥匙一样契合。密码学是让区块链不可阻挡的一个方面。


    密码学看起来可能很技术化（在我们的语文中确实如此），但密码学并不是什么新事物。几个世纪以来，文明一直在使用密码文来保护信息。甚至追溯到公元前 1900 年的密码文已被发现并研究。但，直到
    20 世纪末，这些密码文才在席卷全球的技术浪潮中留下了印记。密码学为全球维网（或所谓的互联网）提供了一层人们甚至不知道需要的安全性。它无非是以加密数据的方式，使其极难破解。这确保了数据只到达预期的接收者手中。正如我们之前看到的，这种安全方面的精密是区块链技术的一大独特卖点（USP）。


    我们可以深入挖掘关于密码学的信息，但由于其本身庞大的科学性，那将是另一本书。然而，与我们的语境相关的是这种卓越实践核心的形态。加密无政府主义在 20 世纪
    80 年代开始形成，当时像斯蒂芬·利维（Steven Levy）和史夫·沃兹尼亚克（Steve Wozniak）这样的人会“黑”进——不是为了偷窃或欺诈，而是尽可能地理解软件，并探索如何改进设备。1984
    年，利维出版了一本名为`Hackers: Heroes of the Computer Revolution`的书，他在书中谈到了黑客精神，其中他对去中心化的热情显而易见。稍晚时候，在
    1992 年，提摩西·C·梅（Timothy C. May）在他的论文《加密无政府主义宣言》（`Crypto Anarchist Manifesto`）中，将密码学的隐私层面提升到了高度，提出了一种通过加密信息匿名通信的新方法。尽管他完全预料到了政府会以法律法规的形式对这一方面进行打击，但他知道没有任何东西能阻止这种无政府主义。


    现在，请理解加密无政府主义尽管如其名，但并不是关于暴力，也不是通过在群众中散布仇恨和不满来刻意反对体制。我个人而言，并不支持这种狂热措施。自由意志主义而非极端主义，才是解决方案。一个尊重并维护所有人权利的体制是我所追求的乌托邦。


    我希望作为读者，你们能欣赏这种加密无政府主义所采取的伦理和意识形态立场。加密朋（Cypherpunks，这些加密无政府主义者的自称）提出了一种绝对和平的方式来反抗试图监管我们生活各个方面的中心化权威。同样重要是，这些人一直在试图通过将更多权力交到像你我这样的人手中来实现社会变革，特别是在控制自己的数据和隐私方面。当比特币出现时，密码学的无政府主义目标似乎终于实现了它自始的初衷。随着密码学将区块链变为日益复杂的、适用于生活最基本方面的解决方案，其潜力仍然是无限的。


    ## 中心化对比去中心化：一场公平的辩论


    弗雷德里克·巴斯提亚（Frederic Bastiat）我最喜欢的格言之一写道：


    “如果人类的本性如此糟糕，以至于允许人们自由是不安全的。那么这些组织者的倾向为什么总是好的呢？立法者和他们任命的代理人不也属于人类吗？还是他们认为自己是由比人类其他部分更精美的粘土制成的？（引用自`The
    Law`，n.d.）”


    巴斯提亚显然是去中心化的坚定支持者。


    我一直习惯引用这些博学者的名言来结束我与其他意识形态的同好者之间进行的辩论。每当提到去中心化的话题，当我向他们引出这段话时（虽然可能措辞不同，但大意如此），往往只能引起一种回应：“那是不同的时代了！”尽管我相信自由理念的核心从未改变，但我确实同意“时代不同”这一说法。这就是为什么在当今，我不断在周围寻找真理的原因。


    在这次追求中，我意识到中心化与去中心化的辩论对我们今天全球而言是至关重要的。这特别是因为一些最中心化的国家正在积极努力证明自己在去中心化技术方面的主导地位。这让我奇奇为什么。以中国为例，尽管它明确拒绝了比特币，但它是测试区块链技术的领先者之一。它最近甚至指定了一系列广泛的服务作为区块链技术的测试场。所以，这里有一个对公民言论自由进行永久审查的中心化政府，但又想推出一种促进去中心化的技术？这不太对劲，不是吗？悲哀的事实是，这些中心化国家确实在追求区块链——并不是因为它们想促进去中心化，而是为了控制它。而且，不需要我告诉你，受控制的去中心化根本不是去中心化。


    即使我在撰写去中心化给普通人生活带来的积极影响时，我也非常清楚支持中心化的相应论点。与去中心化完全相反的是一种信念，认为权力集中在中央机构可以提高决策效率，从而提高公民的生活质量。在中心化结构中，决策的制定和执行都快得多。


    虽然这确实是一个有效的论点，而且不可否认决策达成的速度快得多，但我的反驳论点是：速度总是是好事吗？心理学中有一个被称为“群体思维”（`groupthink`）的概念，这在这里非常适用。群体思维是指某些单位对其小组决策是完美且不会错误的盲目信任。这种现象经常出现在政党及其领导层的行为中，对官僚程序可能有害。


    让我给你们举个例子——或者，让我问你们一个问题。假设你一直觉得身体不舒服。你去了一个有一个医生团队的医院。你咨询了一些医生，但没有得到确定的结果。这一切之后，你见到了科主任，他看了一眼就判定你是糖尿病。其他医生立即表示同意，没有经过任何讨论，因为他们的首脑在事情上绝不会出错！作为一个患者，你会觉得这种得出结论的速度更优吗？


    '
- fmt: '

    If you ask me, I wouldn’t! As talented as the doctor might be, the team’s consensus
    there has come from not discussing evidence as it should, but from their belief
    that their leader can do no wrong. In this case, even if a junior doctor has a
    different opinion on the matter, it may never reach the forefront because, in
    a scenario like this, any individuality or conflict is implicitly thwarted while
    conformity is promoted.


    This is likely to happen in a centralized structure much more often than a decentralized
    one. Now, imagine that this doctor at the hospital gave his diagnosis, which you
    then took to other doctors at other hospitals for a second and third opinion.
    They are much more likely to view this diagnosis in an unbiased manner because
    they aren’t influenced by how great this doctor is. It’s more conceivable that
    they will corroborate the opinion with the symptoms and reach their own conclusions.
    Sure, I oversimplify things here for the purpose of understanding, but you get
    the drift. The point is that faster decisions aren’t always better decisions.


    As T.S. Eliot eloquently puts it, "Most of the evil in this world is done by people
    with good intentions" (T.S. Eliot Quotes, n.d.). If you look at this quote in
    the context of history, almost all of the catastrophic events the human race has
    had to face, be it the holocaust or any other form of the so-called ethnic cleansing,
    have undoubtedly been the result of centralizing power in one political party,
    person, or even ideology.


    Decentralization drastically reduces the likelihood of such disasters. Decentralized
    structures, especially the ones utilizing blockchains, are much better at reaching
    consensus after validating the evidence. These promote individuality and conformity
    to a principle, rather than a group or an individual. It’s agreed that their consensus-reaching
    mechanisms are resource-intensive and still require refinement but, as I mentioned
    before, blockchains are still growing. Based on the innovation we have seen in
    this avenue, we can expect much more work in environment-friendly consensus mechanisms
    like `Ouroboros` in the future, as well.


    Another argument that’s often put forth whenever blockchain decentralization talks
    come up is the fear of criminal activity that may arise in an online network like
    this. I see people, so many times, taking online to automatically mean shady.
    The opponents of blockchain technology in the media, as well as government and
    regulatory bodies, continue to use this fear and ignorance to feed inaccuracies
    in the minds of the people that would, indeed, feel differently if they were given
    the right information. For instance, there is a myth that blockchains support
    illicit transactions because they are anonymous. Data suggests otherwise.


    The `Silk Road` fiasco of 2011 is a personal favorite of many denouncing blockchain
    technology. This is where Ross Ulbricht was convicted of running a darknet black-market
    platform called `Silk Road`, on which illicit activities like drug trafficking,
    money laundering, etc. were quite rampant. Ulbricht was sentenced to life in prison.
    Critics of blockchain technology use this debacle to bring a premature finality
    to the blockchain decentralization debate. But, here is what they don’t understand.
    The evidence that was collected after the FBI crackdown was, indeed, largely possible
    because it made use of a cryptocurrency blockchain. Since the data was so decentralized,
    it was impossible to manipulate it. At the same time, the transparency of the
    transactions practically made all the paperwork for search warrants and surveillance
    absolutely redundant, expediting the conviction.


    The holier-than-thou attitude of those advocating traditional financial institutions
    over blockchain solutions is surprising if we look at the soaring crime rates
    committed with, and for, fiat money. Of course, the fact that fiat money transactions
    are a breeding ground for illicit activities cannot be a defense for the crime
    that may take place on a decentralized blockchain. It would be inaccurate to say
    that blockchains are completely impervious to such activities; they are certainly
    not. But, believe it or not, tracking crimes is far easier on the immutable distributed
    ledgers in a blockchain rather than a physical black market where cash exchanges
    hands illegally.


    I wish to point out here that this isn’t me trying to persuade you to adopt the
    decentralization ideology, but to create an open communication channel where you
    are able to see the monumental, and yet subtle, changes happening around you for
    what they are. The point is to start a conversation and maybe, eventually, take
    charge in changing things for yourself by pledging an increased involvement in
    this technology.


    ## The Role of Artificial General Intelligence


    A few years back, advanced artificial intelligence used to be the stuff of sci-fi
    movies, with actors playing the parts of humanoids from the future. We all thought,
    "That’s never happening but it sure is fun to watch!" Fast forward to 2016 and
    `Sophia`, the robot, made an appearance and took our breath away with her witty
    responses and almost human-like appearance and facial expressions. No, she wasn’t
    as cool as the good old Terminator Schwarzenegger, but she was the first actual
    robot to crack jokes. Of course, the robot isn’t actually talking, but has a chatbox
    inserted within it that has pre-wired responses. But, the interesting thing about
    this robot is that it can sense the emotions and linguistic intonations of the
    person talking to it. The creator, David Hanson, claims that recording and analyzing
    these responses will make Sophia smarter and more sensitive to human responses,
    as time goes by. What a leap this is!


    I mention this because that is just one of the million advances artificial intelligence
    is making—right from the recommendations on your `Netflix` to the advertisers
    discovering and pitching to you the exact gift you have been searching for. Artificial
    intelligence has become an inseparable part of our lives. Even though Sophia might
    not help you have an easier life, the subtler machine learning applications certainly
    can, through their algorithms.


    Yes, I’m talking about the ever-mysterious algorithms that have been the subject
    of multiple conspiracy theories for late-night party conversations. A little understanding
    of marketing techniques would tell you that these algorithms are not a conspiracy,
    but a great way to help you connect to the exact resources you need in the vast,
    tricky terrains of the internet. Believe it or not, these algorithms that you
    may sometimes find annoying are providing respite to many industries, including
    even healthcare.


    The problem with these, however, is that for them to be effective, they (more
    often than not) also have to be intrusive. They require personal data which can
    be potentially harmful for your own privacy and, even, identity concerns. If you
    have paid attention, you will remember that when you log into an app—let’s say
    `Facebook`—you allow your personal data to be used. You can be sure that all of
    the social media companies are tracking all of your data, and what they can do
    with this data has no limits.

