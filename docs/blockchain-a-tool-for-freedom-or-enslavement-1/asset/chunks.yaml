    \n# Introduction\n\nA non-violent revolution is not a program of seizure of power.\
    \ It is a program of transformation of relationships, ending in a peaceful transfer\
    \ of power. \n\n–        M. K. Gandhi\n\nOne realizes the power in that statement\
    \ when one lets it really sink in and contrasts it with the popular idea of a\
    \ revolution we have been fed—the one with violent protests. Only when you understand\
    \ the idea of a peaceful revolution will you be able to grasp the telltale signs\
    \ of the revolution that’s happening silently right around you: the revolution\
    \ that you are a part of, probably, without even realizing it. That is the blockchain\
    \ revolution for you!\n\nFor the novice, the blockchain may seem like a fancy\
    \ term that’s too technical and too removed from their daily life. The truth,\
    \ as you will discover in the coming pages, couldn’t be farther from this notion.\
    \ Sure, blockchain is a fairly complex technology to understand and execute, but\
    \ that does not mean the implications don’t reach you and me.\n\n## Blockchain\
    \ Initiation for the Beginner\n\nSince the emergence of Bitcoin and other cryptocurrencies,\
    \ everyone seems to be talking about blockchains. Since you have picked up this\
    \ book, I am assuming you have been fascinated by this fancy word usage, and yet\
    \ have ended up feeling a little lost and obtuse in the technical aspect of this\
    \ technology. Don’t you worry—we have all been there. It is no secret that blockchain\
    \ technology can be a little overwhelming for the uninitiated. And, that is the\
    \ reason why I wish to wipe out the dubious fog from your mind with a simple analogy.\
    \ No, we won’t be dumbing down the technology in any way. Rather, here, we shall\
    \ try to understand the underlying principle before we dive into the technical\
    \ details in the coming chapters. \n\nImagine you are planning an office party.\
    \ Since you are running short on time, you enlist the help of your colleague in\
    \ delivering the invites to all the departments. There is a teeny-weeny problem\
    \ though. Your colleague doesn’t like the head of the marketing department, and\
    \ thus decides on his own to drop that invite you sent. The result is that the\
    \ marketing department never receives the invite and you are left wondering why\
    \ they never showed up for the party. Thus, your colleague is the middleman who\
    \ has created a problem that you hadn’t anticipated. \n\nNow, imagine an office\
    \ party blockchain that connects all the office department computers through the\
    \ internet, even your colleague. Through this blockchain, every time a party invite\
    \ is sent out, a copy of the invite is saved on each of these computers on the\
    \ network. So, everyone has the exact same invite. \n\nNote that, on the blockchain,\
    \ it would be impossible to know who the invite belongs to. But, when your colleague\
    \ spots the time and the day of the party on the invite, he can accurately guess\
    \ the invite belongs to you. He decides to goof around with it again, trying to\
    \ change the time and venue of the invite. The moment he does that, however, he\
    \ is cut off from the blockchain as other computers on the network realize that\
    \ the data is being manipulated. Thus, the invite reaches everyone in just the\
    \ form that you intended. That is what blockchain technology can do.\n\nRemember\
    \ that this is quite the simplified version and the actual technology, as you\
    \ will see later in this book, is much more complex than this. But, as much as\
    \ I hope that you do not have mean colleagues like the one in our example above,\
    \ such interference in virtual data transactions isn’t too uncommon. And with\
    \ more and more of personal data taking the virtual form, blockchain technology\
    \ carries a special significance for each and every one of us, especially when\
    \ it comes to privacy and control over our own data being exploited by big tech\
    \ companies in Silicon Valley and overreaching governments, alike.\n\n## The Panopticon\
    \ Paradigm\n\nSomewhere in the 18th century an English philosopher, Jeremy Bentham,\
    \ designed the panopticon prison. This architectural design was meant to bring\
    \ out desired behavioral changes in the prisoners by utilizing the power of mere\
    \ observation. This was no innocent observation, mind you, but a sort of watchfulness\
    \ that kept the prisoners in check. \n\nImagine a watch tower in the center surrounded\
    \ by prison cells. The observer (or the guard, in this case) sits in the tower\
    \ keeping tabs on all the prisoners. The guard can freely observe the prisoners,\
    \ but there isn’t a way for the prisoners to watch the guard. The result is that\
    \ the prisoners can never be sure as to whether they are under the watchful eye\
    \ of big brother or not. This uncertainty, combined with the fear of retribution,\
    \ then brings out a peculiar behavior among the inmates. \n\nUnsure of being watched,\
    \ the inmates are always following the rules laid down by this omnipresent guard—so\
    \ much so that this discipline is internalized by the inmates, no longer needing\
    \ external supervision. Almost sounds sinister, doesn’t it? It is, in a way—even\
    \ more so when this concept expands beyond the prison structure and applies to\
    \ something as widespread as the global economy. (Yes, the global economy.) This\
    \ isn’t just a lesson in philosophy, but an economic phenomenon observed around\
    \ the globe. "
