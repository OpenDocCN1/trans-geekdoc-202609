    For an outsider, these two theories represent government activity of some sort,
    in order to artificially induce market behaviors that seem to ‘fix’ the issue
    at hand. The third interesting school of thought is Austrian economics. As I mentioned
    before, the Austrian school of economics does not subscribe to the macro/microeconomic
    model. Rather, Austrian economists find it strange that individual and group economic
    behavior would be so far removed from each other. For instance, the economists
    at the macro level tend to have little-to-no idea how the microeconomic elements
    of labor, health, etc. fall together. Wouldn’t it make more sense to have a theory
    that’s consistent over these two levels, and that actually joins the smaller pieces
    in the bigger picture rather than painfully separating them?


    Austrian economists take a rather Laissez-Faire approach to the market crisis.
    They swear by minimal government intervention and assume that the markets tend
    to go through their own life cycles, automatically adjusting themselves to deal
    with crises. This ideology is based on the core notion of subjective value of
    an object. By subjective value, they mean that every object would be valued at
    the subjective needs and wants it satisfies. And, the more easily or scarcely
    available that object is would determine how efficiently it is used. For example,
    an affluent family that is well-fed would be more inclined to throw away leftover
    bread than its poor counterpart that has to be very thrifty when it comes to portion
    sizes. Thus, where there is scarcity of food, the leftover bread would have much
    more value and would be much more efficiently used than where there is plenty
    of food available.


    Since the consumer behavior is directly dependent on the perceived value based
    on the availability of the product, there is an inherent mechanism that takes
    care of the demand and supply cycle. But, when an external entity like the state
    intervenes in this process, the whole balance goes out the window. This has been
    well exhibited in the unraveling of the Brazilian economy. Over the years, especially
    since the 2008 crisis, Brazil has seen an increasingly interventionist economic
    policy. Take the example of the automotive industry where ample subsidies were
    given by the government, which led to an artificially expanded boom-and-bust cycle
    with significant negative consequences for the economy, in general. The discontent
    with this is now leading to the Brazilian discourse taking an Austrian turn.


    There is yet another branch of monetary theory known as Modern Monetary Theory
    (MMT). One of its proponents, Stephanie Kelton, counters the blurring of macro/microeconomic
    lines in Austrian thought. She proposes that a household cannot function the same
    way, economically, as a nation because the household doesn’t have the authority
    to create money. The assumption regarding power to create money seems to be one
    of the many core ideological differences between MMT and the Austrian school.
    This assumption makes all the difference because if Uncle Sam could create more
    money anytime he wanted then what would it matter how much debt the national economy
    is in or how much of fiscal deficits the state has?


    It’s a tempting notion, isn’t it? Almost too good to be true? If it seems that
    way, then that’s because it is. Austrian economics counters this Alice-in-Wonderland
    world by the MMT. If MMT were to be taken at face-value, then all those evils
    that have haunted nations for centuries, inflation, bankruptcy, and so on, would
    all be just perfectly imaginary words. The reality, though, is that these aren’t
    imaginary and have plagued our societies for a long time. The Austrian economics
    vouch for this by clarifying that MMT policy prescriptions may well lead to a
    stunted capital structure and an overall economic stagnation.


    ## The Fiat Fiasco


    Okay, so, we have just taken a tiny crash course in economics, now what? How does
    that help us in our blockchain discussions? The answer to that question lies in
    what I like to call the fiat fiasco that holds the economic, political, and blockchain
    ingredients of our discussion here all together. Yes, for now, it may seem like
    we are just discussing random topics I fancy, but you’ll soon see how fiat money
    is the missing link that completes the puzzle.


    Austrian economics takes the bull of the fiat money by its horns. Understand that
    the premise of fiat money rests on what’s called the central banking system. It’s
    no secret that one thing MMT sure got right is that the state holds a monopoly
    over money production, and the central banking system depends on the financial
    institutions approved by the state to propagate that monopoly. For Austrian economists,
    however, the fiat, or the paper, money has only one function: to act as a medium
    of exchange. In fact, they don’t even think fiat money is essential for a well-functioning
    economy. On the contrary, the Austrian economists strongly believe that fiat money
    brings in centralized evil that we could very well do without.


    Austrian economists have always supported a medium of exchange that’s backed by
    commodities. So, something like the gold standard would be a perfect fit for the
    Austrian viewpoint. From this vantage point, it is easy to see why the fiat money
    can be problematic. Let’s go back to our favorite 2008 crash example. But first,
    answer this question: What would you expect to have happened to the banking industry
    after this crash? It doesn’t take a rocket scientist to guess that the banking
    sector would more or less collapse as a result of all those bad loans. But, do
    you know what actually happened? The total assets of banks actually rose by 18.4%
    in 2010 (Polleit, 2010). This was because the Federal Reserve did exactly what
    the MMT suggests and supplied the banks with vast amounts of money just to prevent
    their collapse.


    While this may seem like a feasible option, such injections of expanded money
    supply can be catastrophic for an economy and can create the very boom-and-bust
    cycles we referred to earlier. Bringing the fiat economy to an equilibrium is
    practically impossible because it does not carry an inherent value, at all,, and
    is considered as money because everyone just accepts it as money. In contrast,
    when the currency was latched to the gold standard, the government couldn’t just
    wave the wand and come up with new money; they had to purchase the additional
    gold for it. Thus, even if the banks made fraudulent transactions, they would
    ultimately have to line up the claims against the available gold, and the system
    would eventually correct itself to come back to the equilibrium originally desired.
    In simple words, fiat money has left our economies to irreparable damage for a
    long time.


    Since the movement away from the gold standard, the Austrian proponents have been
    diligently hunting for an alternative that fills the “sound money” void. It turns
    out, when Nakamoto came up with Bitcoin, this hunt ended unexpectedly and the
    Austrian proponents had found their pot of gold (pun intended).


    ## The Sound Money Alternative


    Before I talk to you about cryptocurrencies, we need to talk a little more about
    the concept of sound money as stated by the Austrian economists. As can be seen
    in the previous section, Austrian economists hate the idea of government-controlled
    money supply. If you pay the slightest attention to the economic news around the
    globe, you may be able to see the merit in this theory. For decades and decades,
    together we have witnessed governments around the world throwing the economies
    into a disarray by manipulating the money flow. When the chaos manifests into
    unavoidable degradation of living standards for the common man, the same governments
    (parties may be different) entice the masses with false promises of a better tomorrow
    with further manipulation of the already struggling money flow for the sole purpose
    of gaining votes.

    '
