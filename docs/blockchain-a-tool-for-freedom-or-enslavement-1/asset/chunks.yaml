  trans: '


    在这里，我们特别关注那些正在为你带来改变的行业和项目，它们目标不仅仅是为了利润，更是为了社会福祉。无论是在印度——一家名为 `ConsenSys` 的公司正与一个名为
    `Niti Ayog` 的政府智库合作，以简化土地所有权记录；还是在 Pan-Impact Korea——他们利用区块链技术和社会影响力债券，确保只有在达到预期的社会成果时才释放资金；又根据斯坦福社会创新中心
    2018 年的一份报告，全球范围内还有 191 个类似的区块链项目：这些都是创业者以最优雅的方式将利润、社会成果和区块链技术融合的例子。此类项目在过去几年中蓬勃发展，恰恰是技术成熟的证明，这对我们来说无异是一个好消息。


    而且这并不完全关乎商业。2021 年，我们之前提到的以太坊创始人维塔里克·布特林（Vitalik Buterin）向印度的新冠加密货币救济基金捐赠了价值 10
    亿美元的加密货币（Terrapass, 2021）。这笔交易极其透明，恰恰证明了区块链交易发生的便利性和透明度。但再次，我们不要陷入这些孤立的项目和事件中，因为为了社会向善的区块链已经发展成为远超看似“百分之一一”概率的存在。


    ## 面向小参与者的区块链


    到目前为止，我们只从大玩家的背景下（例如 `Cardano`）看待区块链，以及他们如何利用它创造非常需要的社会影响。我们将在下一章中回到非洲的区块链和社会影响；但在这里，我想让你们记住，区块链并不是一项遥远的技术。区块链对于你我来说，就像对于大型科技行业以及第三世界国家一样，同样重要。


    ### 帮助小型创业者


    与大品牌竞争一直是小商人的痛点。加速的消费主义往往让我们忙于追逐商业品牌，而非本地企业。尽管过去采取了多项举措来提振小企业，但似乎没有一个产生过持久的影响。区块链可以通过跨越式的发展来帮助新企业，允许他们在相同的领域内进行竞争。


    对于小参与者来说，区块链的一个巨大优势在于它们利用了许多现有基础设施，而不是要求从零开始构建新设施。这些新创业者可以选择使用 `Ethereum`、`Corda`、`Hyperledger`
    等开源平台上预构建的区块链。当然，他们也可以从零开始构建；但对于初创创业者来说，资源有限，已经运行良好的区块链平台可能特别具有吸引力。


    与本地创业企业相比，大公司一直拥有更丰富的资金储备以及更先进的技术。这并不是秘密，像 `Amazon` 这样的电子商务巨头从各个方位打击了整个行业，让小企业主的生存变得极其困难，更不用发展了。区块链具有平衡竞争环境的潜力，至少在某种程度上如此。事实上，在实施区块链时，由于初创公司在态度上的开放性，以及设定协议和标准的灵活性，新兴项目可能更适合这项技术。


    区块链具有以前所未有的潜力为小参与者创造公平的竞争环境。这在一直阻碍小行业增长的信息不对称背景下表现得尤为明显。由于这些企业没有与大对手相同的工具，他们一直处于劣势。区块链通过让所有数据点都变得可评估，实际上让信息差消失了。


    区块链还重振了忠诚计划，帮助将客户引导至这些小型企业。传统上，忠诚计划充满了困惑，导致兑换率很低。客户往往对这些产生戒备，尤其是因为他们必须提供个人数据。区块链提供了一种解决办法，因为所有数据都经过了安全加密。此外，从创业者的角度来看，执行这些忠诚计划容易得多，也便宜得多，因为消除了所有的中间商和交易成本。此外，区块链机制可以帮助防止被盗代币或其他形式的非法使用欺诈。


    还有另一个尚未被广泛探索的影响，但它可能会完全改变购物体验。小企业主可以聚集在一起，形成一种本地市场，其中跨企业的区块链忠诚代币可以相互关联，从而允许客户无障碍地在这些关联企业中使用这些代币。这可能会是社区建设的一个转折点，因为资金留在了社区内部，多家企业在繁荣的同时也为客户提供了便捷的购物体验。


    ### 面向小农的区块链


    即使全球农产品的消费量不断增加，小农的利润仍然非常微薄。你想过这是为什么吗？这是因为我们的系统结构设计存在根本性缺陷。有些人甚至认为（而且非常正确），我们的社会以及它赖以存在的系统仅仅是为了让富人更富，穷人更穷。即使目前的全球供应链也将市场权力集中在顶端，而底部的利益相关者无法获得增长的机会。


    以光鲜且不断增长的巧克力行业为例。你能猜到一个自己种可可/咖啡豆的小农最终能获得多少百分比的价值吗？7%——是的，这就是他生产总价值中所占的百分比（Fairfood,
    2020）。这是因为这种原材料供应链中涉及的参与者太多，而且这些环节通常跨越多个大陆。


    已经提出了多项举措来解决这种局面，并让这些像非洲这样地方的小农生活得更轻松一点。许多自称为“从豆到棒”（bean-to-bar）的精品巧克力公司出现了，它们关注的是创建更短的供应链，并将更大比例的利润直接给给农民。这些公司以更高的溢价销售“伦理巧克力”。然而，目前消费者还没有方法验证这些主张是否在现实中得到了履行。区块链通过提供这些主张的即时验证，提供了一个简单而优雅的解决方案。


    '
- fmt: '

    As we already discussed before, the chances of a farmer in a remote area having
    access to banking services are much less, as compared to them having access to
    smartphones. The peer-to-peer lending blockchain services like the upcoming blockchain
    startup `AgriChain`, for instance, and transactions across such networks, can
    be completed with the ease of a tap on the phone screen. Moreover, blockchains
    are also much more efficient in storing the documents related to best practices
    that the farmer follows, and the various certifications that they may require
    to prove their special value to the customer.


    This blends into the aspect of “smart agriculture” that can help the farmer implement
    quite sophisticated measures of data storage, as well as analysis. This data,
    being immutable and distortion-proof, carries special significance. Take the case
    of environmental monitoring data. This is usually under the centralized control
    of government authorities, and is utilized by them in making policy decisions
    based on environmental trends. But, since the central authorities have their own
    interests to protect, this data may be quite susceptible to manipulations which
    is just not possible on a blockchain enabled network. Many projects utilizing
    the power of blockchains, in relation to Information Communication Technology
    (`ICT`) and Internet of Things (`IoT`), are currently in the works to help the
    farmers make the most of this technology.


    Another related area in which the blockchains can, and have been, bringing significant
    improvement is the supply chains of produce. Issues in this arena, in addition
    to making things difficult for the farmers, also result in tremendous economic
    costs to the global society as a whole. From the perspective of the farmers alone,
    blockchain technology helps in building trust with the consumers, as information
    about every product is transparently and freely available on the blockchain. This
    would eliminate competition, which attempts to monopolize the market with cheap
    and bad-quality products. The farmers can thus supply true value to the customers.
    On the other hand, from the customer’s vantage point, they can now be certain
    about how the food that they consume is made. A company known as `Ripe` does exactly
    this by providing a blockchain platform for making the food supply chain digitally
    transparent.


    Blockchains also address the concern of traceability, ensuring the least wastage
    of produce, if any. A start-up called `TE-FOOD` uses identification tools to follow
    the movement of produce—be it packaged edibles, fresh produce, or even livestock—through
    the supply chain. Analyzing the patterns of wastage over a period of time can
    bring valuable insights, which aid coming to a resolution of the issue. There
    are even blockchain-enabled tools that help the farmer with livestock breeding.
    Here, some identifying markers are tagged on to the animals, right at birth, which
    helps them follow the growth of these animals through their lifespan in a measured
    and scientific manner. Their vitals are monitored and issues, if any, are identified
    at an early stage.


    Even with regards to illegal activities in the food industry, blockchains have
    a crucial role to play. Most often the illegal elements make it quite difficult
    for the law-abiding producers by snatching a big share of their consumer market.
    A relevant example would be illegal fishing, which has been a nuisance for a long
    time now, for both the regulatory authorities as well as the fishermen who take
    the effort to abide by all the regulations. Blockchains can make it absolutely
    simple for the customers to check if the produce they are buying is legal or not.
    They can also provide reliable information to the consumer regarding where their
    fish comes from: a breeding farm, fresh water bodies like a lake, or the salt
    water of the ocean.


    Though all this may seem like it’s out of some realistic sci-fi novel, I remind
    you again that these are the applications that are being successfully run on blockchains
    all around you. And, this is just the tip of the iceberg. We won’t even be close
    to unleashing their true potential until, and unless, each one of us participates
    in them.


    ## Blockchains for Sustainability


    While we talk endlessly about the technology of it all, we cannot afford to forget
    the environmental component. Blockchain technology has often been seen at odds
    with environmental sustainability, majorly because of the proof of work (`PoW`)
    consensus mechanisms which are considered to be quite draining on the environment
    due to the carbon footprint they create. While this is true, as has been pointed
    out before, eco-friendly consensus mechanisms have also been designed and are
    widely in use. This is one of the reasons why we absolutely must look at `Bitcoin`,
    which does use `PoW`. Even other cryptocurrencies, like `Cardano` (`ADA`), use
    eco-friendly proof of stake (`PoS`) consensus mechanism of `Ouroboros`, as was
    discussed previously. And yet, the critics seem to be stuck on the irony of using
    blockchains, which are not environment-friendly, for sustainability projects.
    Even a quick glance at these public blockchains will help you understand that
    this assumed irony is nothing but a figment of imagination from those would rather
    oppose the change than adopt it.


    ### Ethical Mining


    Whenever we think of the world in terms of a duality of developed and developing
    economies, we have often been led to believe that the developed countries are
    the epicenter of affluence, and the developing economies drain the global resources.
    This is not only a harsh outlook, but also a grossly inaccurate one. A continent
    like Africa has been blessed with massive mineral reserves, and yet the local
    population hardly seems to benefit from the mining industry. In their book Mining
    in Africa: Are Local Communities Better Off? (Chuhan-Pole et al., 2017), the authors
    talk about the “natural resource curse.” They point out the disastrous effects
    that corrupt political entities, combined with such abundance of resources, can
    have on the local development. This is primarily because such centralization in
    weak and undocratic institutions makes it easier for monopolies with vested interests
    to control and capture rents. Blockchains can flip these dysfunctional systems
    on their head and change the game for the better of the local communities.


    For example, the Democratic Republic of Congo has a wide range of small-scale
    mining operations for cobalt and copper. While these widespread mining sites are
    the lifeline of millions of people, they are also the breeding ground for multiple
    human rights violations, including child labor, in these mining operations. The
    government authorities have often faced severe criticism and backlash for failing
    to regulate these. `IBM` currently runs a collaboration blockchain pilot that
    makes sure that the mines in Congo fulfill the certification standards. A mine
    would be certified only if, let’s say, there is no child labor involved, or the
    working conditions and wages of the miners meet the required standards.


    While this could be a big game-changer, the human effort cannot be undermined.
    Remember that the information that remains on the blockchain would be just as
    good as the information that is entered on it. This is exactly where our involvement
    as the public comes into the picture. The more we are aware of the implications
    of this technology and what it can achieve, the more success this technology can
    have.

