    \ paid for by the insurance companies. This system puts the patient in a passive\
    \ position, where they are left out of the decision-making process entirely. Patient-controlled\
    \ electronic record systems, that we mentioned earlier, are crucial for this very\
    \ reason: to put them in the driver’s seat and. consequently, reduce the risk\
    \ of fraud.\n\nA large health-coverage organization in the United States called\
    \ Change Health has taken on the responsibility of creating blockchain solutions\
    \ for billing and payments. They collaborated with a small business called PokitDok\
    \ around a couple of years back and are successfully navigating the competition.\n\
    \nThis may be slightly different from the project, but has brought a certain credibility\
    \ to American healthcare, nonetheless. An early project by the Health and Human\
    \ Services in the United States, called Accelerate, is a procurement and acquisition\
    \ program that has had quite a lot of success in procuring services that are both\
    \ efficient and cost-effective. This acquisition may happen in all different sectors,\
    \ but is eventually contributing to the health and wellness of the masses. \n\n\
    ## Clinical Trials\n\nClinical trials are often lengthy and complex, with regulations\
    \ that require strict adherence. For a long time, the questions over transparency,\
    \ in many cases, have been glossed over. Concerns over informed consent, methodology,\
    \ clinical outcomes, and even approvals have plagued these trials since the very\
    \ beginning. Though most medical practitioners follow an ethical code of conduct,\
    \ unfortunately not all do. Increasing risk of bias, misconduct, and fraud have\
    \ the potential of not only contaminating the results of the study leading to\
    \ resource wastage, but even patient casualties in the most extreme cases. Blockchains\
    \ can streamline these processes, decreasing the fatalities and ,also, the healthcare\
    \ provider’s exposure to liability.\n\nAny research trial has to undergo several\
    \ stages, and has to abide by a different set of procedures at every stage. Without\
    \ going into the depths of the nature of trials, let’s jump straight to blockchain\
    \ application in this arena. Three primary areas of application can be identified\
    \ in these trials—tracking the chronological order of the phases, traceability\
    \ of the movement of data through these phases with a time stamp, and maintaining\
    \ the integrity of the data by ensuring immutability. All of these can help with\
    \ the reproducibility of the research, which is a test that many research trials\
    \ fail because of the “after the fact” data manipulation.\n\nApart from these,\
    \ there is also one extremely important function of blockchains in clinical trials:\
    \ that of smart contracts. The “if, then” logic of these contracts allow for building\
    \ a secure and quality-controlled way of developing workflows around a predetermined\
    \ logic. Since the workflow is automatically triggered when certain conditions\
    \ are generated, there isn’t a way for the bias to trickle in. Also, as the data\
    \ is recorded throughout the blockchain, the question of going back and manipulating\
    \ the data to prove a certain hypothesis does not arise, either. \n\nBlockchains,\
    \ due to their innate design, automatically solve the problems of registration,\
    \ informed consent, etc. The data stored on the blockchain is easily verifiable\
    \ and remotely auditable. Also, as the data is not attached to names per se, the\
    \ doctor-client confidentiality is maintained perfectly. The vision for the future\
    \ is to be able to have a kind of archive that consists of the data and metadata\
    \ of all such clinical trials in a specific, predetermined format, to make reviewing\
    \ the data at a later point in time easier. A digital archive would also be helpful,\
    \ and much less time-consuming, for future researchers to reference.But, remember\
    \ that these ideas are still developing and, as of now, blockchains haven’t been\
    \ supporting clinical trials, at least not on a large scale. But, what it could\
    \ do when it does roll out is just pure brilliance.\n\nYou might wonder, this\
    \ technical talk is all well and good, but how does it really impact normal people?\
    \ There could not be a better time than right now, as we slowly come out of the\
    \ pandemic. The drug and vaccine trials, when pressed for time as they presently\
    \ are, need to be the most efficient. More than ever, today we realize the importance\
    \ of untainted, unbiased clinical trials. Blockchain-supported trials have the\
    \ potential to do just that. It’s worth noting, however, that even though clinical\
    \ trials were not ready to be rolled out on blockchain networks yet, COVID-19\
    \ has seen a wide range of blockchain applications in the supply of vaccines,\
    \ uploading the vaccine certificates on the network for the recently announced\
    \ vaccine passport, and so on. When it comes to medical data and innovation, sky's\
    \ the limit, (and maybe not even that).\n\n# Chapter 11: Energy\n\nI hope you\
    \ remember the blockchain case studies in the energy sector that we have already\
    \ looked at—be it Bankymoon’s blockchain-powered smart meters sourcing electricity\
    \ for schools or the solar panels running on blockchains and lighting up homes\
    \ in the middle of nowhere in Africa. This, however, is only the beginning; the\
    \ disruption potential in this sector is massive, and blockchains are already\
    \ at work to topple the old energy system on its head. \n\nIt is worth noting\
    \ that, even before blockchains came onto the scene, the power utility sector\
    \ was already on its way to a widespread transition, globally driven by the need\
    \ for decentralization, digitalization, and decarbonization. Seeing how the blockchains\
    \ certainly checked the first two boxes, and even for the third one provided quite\
    \ the ecofriendly proof of stake consensus mechanisms, this technology (it would\
    \ seem) was meant to be. Just as blockchains spurred on the development of the\
    \ Internet of Things was quick to catch on, you’ll also hear terms like smart\
    \ grid and internet of energy as we dive into the energy sector disruption. \n\
    \nYou can think of this discussion as an extension of the case studies in Africa,\
    \ but now let’s consider a few more scenarios. Smart grids can essentially work\
    \ in three different ways. We’ll do a quick review of the first two, as we have\
    \ already discussed these. So, a household that wishes to be self-sufficient with\
    \ their energy production would install solar panels and quite simply utilize\
    \ the electricity produced thereof. The extra energy produced can be stored in\
    \ a power bank for a literal rainy day when the solar panels are not stimulated\
    \ by the sunlight. This would be the primary usage of the generated electricity.\
    \ Remember that, in this particular set-up, a blockchain would not be required\
    \ as the use is limited to one party only."
