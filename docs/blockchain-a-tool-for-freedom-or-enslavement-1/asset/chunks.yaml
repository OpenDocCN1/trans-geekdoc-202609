    是的，最后一部分确实很重要——至少在大多数情况下是如此。在这里不要抱有任何无敌的幻想。尽管我们非常希望如此，但尽管采取了所有先进措施，区块链并不能完全免疫于恶意攻击。与其他任何技术一样，黑客也成功在这项技术中发现了漏洞。人们注意到黑客进入区块链的一些已知方法包括女巫攻击、51%
    攻击以及钓鱼和路由攻击。更深入地了解其中每一种，可以为我们理解区块链技术以及你个人参与其中的重要性提供必要的背景信息。


    区块链上的钓鱼工作方式与其他地方几乎完全相同——通过信息欺骗毫无防备的区块链用户，这些信息可能使他们放弃个人的加密密钥。对于专家来说，这些攻击可能是显而易见的；但另一方面，所谓的路由攻击可能非常难以检测。当然，可以部署保护机制来确保将风险降至最低；但关键在于，提高意识是减轻这种风险的第一步。女巫攻击的名称源于那本著名且富有争议的书，该书记录了据称对西比尔（Sybil）及其分裂身份障碍的治疗过程。黑客似乎受到了该故事的启发，创建了多个身份，旨在使系统过载并最终导致崩溃。最后，同样重要的是，还有
    51% 攻击：不道德的元素获得了网络绝大部分的控制权。这就是伦理参与者的作用至关重要的时刻，他们的积极参与可以防止此类不道德的接管。


    注意，这些威胁并非经常发生，尽管存在这些威胁，区块链可能比使用传统系统的交易更安全。正是区块链提供的安全性证明对全球弱势社区的恢复具有变革性。以南非学校为例，它们配备了由比特币初创公司
    `Bankymoon` 推出的区块链电表。来自全球的捐赠者直接向这些电表汇款，并可以跟踪这些学校使用了多少电，甚至是他们的捐赠购买了多少电。这些交易的安全性确保了援助到达需要的人手中，而不会被中间机构和分销商盗取。有了这项技术的安全性，捐赠者不再需要担心他们的资金是否到达了目的地。


    ### 隐私


    当乔治·奥威尔在他的著作`1984`中写下那句阴险的话“老大哥在看着你”时，我们中并没有多少人认为这不仅仅是小说。但事实是，监控国家正迅速成为全球现实。看来我们已经过了讨论隐性监控是否真实存在的界限；它很可能已经成为我们生活的一部分。通过我们的智能手机每天收集的数据，足以让任何意识到自己隐私权的个人感到脊背发凉。允许所有应用程序收集我们的个人数据似乎是一件很寻常的事。而我们没有意识到的是，通过这种权限，我们正在交出自己最有价值的特质之一：我们的隐私。


    区块链为隐私的这一方面带来了全新的意义。专家认为，区块链在未来的某个时刻可能会让记忆用户名和密码的烦恼变得过时。这意味着区块链可以为我们提供加密的数字身份。这听起来就像是直接出自某本科幻小说，不是吗？尽管如此，这绝非想象。


    世界银行的`ID4D`数据库声称，全球有十亿人没有经过认证的身份（`McKinsey Global Institute`, `2019`）。由于缺乏身份识别，这些人无法从任何计划中受益。尽管如此，身份数字化也伴随着自身的风险。事实多次证明，它们可以被用来造成伤害甚至迫害某些身份。区块链通过提供一种更安全、可靠的替代方案解决了这个问题。


    例如，一场伟大的区块链运动正在进行中，`Cardano` 正在为数百万人提供数字身份。第一批推出是针对五百万名学生的；这将使学生的学术成绩可以被老师以及潜在的雇主追踪，而不会让他们退出教育系统。


