  raw: "You don’t have to be an environmentalist to know that our planet is in a deep\
    \ crisis. As our landfills sit taller than ever, waste management drives across\
    \ the globe seem to be struggling to catch up with the increasing mounds of garbage.\
    \ As the population and the commercial consumerism increases, so does the waste,\
    \ especially non-eco friendly waste. Ontario, Canada was recently reported to\
    \ be running out of space for its own garbage. As this waste in solid, liquid,\
    \ and gaseous forms piles on, human health is more and more endangered. Waste\
    \ mismanagement has been well-documented, especially in developing countries leading\
    \ to major health concerns like respiratory problems, skin infections, and even\
    \ prenatal and postnatal defects. The primary reason for this mismanagement in\
    \ developing countries, apart from corruption, is that waste management has multiple\
    \ moving parts along its logistical chain.\n\nHave you ever wondered what happens\
    \ to the trash collected from your curb? The easy and probably the less scary\
    \ answer is that it goes to the landfills. But, beyond this, it may be difficult\
    \ to trace the movement of this trash because of the different types of waste,\
    \ the numerous collection and processing centers involved in the process, and\
    \ a number of such dynamic factors which might be quite difficult to track on\
    \ a large scale. Blockchains have proven extremely successful in this regard.\n\
    \nArgentina, despite being a developing country, has proven to be a wonderful\
    \ role model for putting its garbage on blockchain. The government, in collaboration\
    \ with entrepreneur Ivan Zubilewicz, have implemented a reward program for waste\
    \ collection using a cryptocurrency created by Zubilewicz, called JellyCoin. This\
    \ cryptocurrency is awarded to all those who are involved in the waste management\
    \ process. All that anyone who wishes to participate has to do is log in to the\
    \ app and register as either the producer, collector, or processor of trash. Each\
    \ of these is then rewarded for following proper waste segregation. These different\
    \ actors are also connected with each other, ensuring that the traceability—and\
    \ the resulting accountability—are implemented for the betterment of the process.\
    \ The collectors are even rewarded based on the distance they travel to collect\
    \ trash. Overall, the whole process becomes incentive-based, thus making people\
    \ more proactive in their work. This cryptocurrency can then be used to buy anything\
    \ they wish for in the mainstream market, as it is widely accepted in the Argentine\
    \ economy. What a wonderful way to resolve an age-old problem without the need\
    \ of a federal government!\n\nAnother such pilot project is fueling community\
    \ effort to create a better waste disposal system in Bengaluru, India. Blockchains\
    \ have provided a fool-proof way to ensure that no problem in garbage collection\
    \ goes unnoticed. If the garbage collection has been neglected, the citizens can\
    \ go and register complaints. Before the introduction of the blockchain element,\
    \ the government used a geotagging system where the collector would take a picture\
    \ of the cleaned site with a time stamp and upload it. But, the problem is that\
    \ there are loopholes in this technology that can allow for tampering with the\
    \ past data entries and time stamps. Pairing this technology with blockchains\
    \ brings in a much needed level of sophistication, while also keeping the data\
    \ for all stakeholders to see. This transparency ensures accountability, and gives\
    \ a clear understanding of those that are performing and those that are not.\n\
