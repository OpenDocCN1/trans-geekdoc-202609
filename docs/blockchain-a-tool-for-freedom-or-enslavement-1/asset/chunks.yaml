  trans: '


    在 2014 年大选期间，一条令人震惊的新闻成为了各大渠道的头条。据报道，剑桥分析（Cambridge Analytica）的某些员工与 Facebook
    合作，获取了百万用户的个人数据。此举目的是出售美国选民的心理画像以获得政治优势。唐纳德·特朗普的竞选官员被指控滥用公民的私有数据。这引发了骚动，Facebook
    的马克·扎克伯格被要求作证——简而言之，发生了很多事情。但遗憾的是，大众往往具有短期记忆，而今天，这种大规模的隐私侵犯仅仅是旧新闻了。


    但我们需要记住：权力滥用和任何其他滥用一样，只要发生过一次，就可能再次发生。Facebook 和大多数其他社交媒体平台已经一次又证明，它们在不公正统治权的支配下运行，仅仅是执行其议程的工具，无论是仇恨言论还是虚假新闻。大多数其他媒体机构也是如此。这就是为什么我们需要不服务于政党、而服务于公民的社交媒体和媒体平台。只有当我们跳出这些中心化社交媒体平台的噪音时，才能发现事实上，有许多去中心化应用可以比我们今天所接触的宣传机器更好地服务于我们。


    ## Steem


    Steem 本身是一个支持 `Steemit` 和 `DTube` 等应用程序的区块链。`Steemit` 是一个去中心化的社交媒体平台，通过向内容创作者提供加密货币来奖励他们。这种激励模型有助于保持区块链运行，并将内容的不可篡改性作为基础。Steem
    区块链共支持 324 个应用，但 `Steemit`、`Utopian` 和 `DTube` 最受欢迎。


    `Steemit` 和 `DTube` 都根据你的选择提供一系列新闻和视频，同时通过贡献某些形式的书面内容为你提供加密货币形式的收入。这些平台的去中心化本质使其能够免受政治和审查的影响，以及广告商的影响。另一方面，`Utopian`
    是一个开源项目，通过贡献不是内容，而是对开源项目的某种修复来获得加密代币：例如，修复一个漏洞。


    ## Sapien


    虽然 Steem 是早期的采用者，但去中心化社交媒体平台在过去几年中才看到增长。显然，用户已经厌倦了新闻频道和中心化社交媒体平台对他们进行的戏法。他们想要一个没有剧本、不受审查且真实真实的通信渠道。`Sapien`
    就是这样一个满足所有这些智力需求的平台。


    在这里，用户完全完全控制他们选择分享的多少个人信息以及与谁分享。平台还根据用户的兴趣和偏好来策展用户体验。与中心化社交媒体不同，这里对发布的内容没有限制。例如，在去年年底，Facebook
    突然宣布禁止加密广告，但在面临用户的反弹后又扭转了这一意图。显而易见，这些政策的反复变化很具有政治动机，可能只是为了衡量他们在限制用户自由和基本权利方面可以走多远。去中心化平台是停止将大玩家视作自由公民是其个人鹦鹉对待的唯一途径。


    `Sapien Network` 使用了处理不认同信息的古老良方——这被称为“选择不参与”（在达到某一点之后）。用户可以极尽地表达自己，没有人能阻止他们。作为用户，你可以做的是挑选你所摄入的内容；如果你对某人说的话感到被冒犯，最好不要再看了，特别是如果你最终只会辱骂那个人并剥夺他人的言论自由。它还有私有和公共模式功能，这意味着你可以决定在平台上保持匿名还是切换你的原始身份。吸引大量人员加入该平台的是各种社交媒体功能，如创建群组、短信、语音聊天等，这些功能在
    `Steemit` 中很大程度上缺失。


    `Sapien` 仍处于胚胎阶段。它构建在 `Ethereum` 区块链上，凭借由 `ERC20` 和 `Ethereum` 代币支持的代币 `SPN`，它正期待着很快变为市场的可能性。这将促进各种其他第三方应用程序，甚至是网络内部的集成。


    ## SoMee Social


    `SoMee Social` 是另一颗 Cardano 之宝。这是一个由区块链驱动的社交媒体平台，主要为隐私、用户控制和货币化而设计。它于 2017 年启动，目前正在推出平台的第三代。他们还招募了参与过
    `Google` 和 `Zillow` 等更大项目的开发者和营销人员，现在正这样做以启动去中心化。


    ## Indorse


    `Indorse` 可以被认为是去中心化爱好者的 LinkedIn 替代品。它被营销为一种由区块链驱动的社交网络，但面向专业人士。它有一个独特的功能，允许其他用户验证用户列出的个人技能，这本质上充当了证言。作为回报，用户通过获得部分利润分成来获得激励。这个想法很简单——如果你声称在某个领域拥有专业知识，那么你也必须附上该主张的证明。随后会形成共，决定该主张是被“背书”还是被标记。该平台开启了一种在不限制言论自由的情况下剔除虚假声明的独特方式。尽管
    `Indorse` 专门将其用于专业技能，但这种模型可能用于避免以言论自由的名义传播不准确的信息。


    当我们到达“颠覆性”章节的末尾时，我想指出一个在讨论区块链应用的兴奋情绪中几乎被忽视的至关方面。让我们记住，区块链的力量在于不可篡改性，而不一定是准确性。这意味着，尽管输入系统的信息无法被操纵，但系统的最终效率可能取决于最初进入系统的信息。因此，如果我作为一个用户向系统输入伪造数据，那么尽管具有不可篡改性，数据录入仍然是不准确的。这就是为什么区块链像任何其他技术一样，其优劣取决于运行它们的人。这就是为什么我一直说，更多的普通人需要参与进来，否则我们将失去对在区块链中永恒固化的数据的控制。

    '
- fmt: '

    Many of the blockchain projects in the works today have a ten-year vision, which
    means that the seeds that are being sown today with these disruptive use cases
    will bear fruit somewhere around the year 2030. That doesn’t mean that no current
    benefits would be reaped. All of what we have discussed are fruits of early adoption
    that we are already enjoying. But, at this very point, it is difficult to determine
    the direction that blockchain technology would be taking, let''s say, ten years
    from now—will it be happy continuing to disrupt industries as they are, or would
    it turn them upside down, creating a new order altogether? A lot remains to be
    seen.


    # Conclusion


    If liberty means anything at all, it means the right to tell people what they
    do not want to hear. – George Orwell.


    I believe that there are two things that humankind cannot do without: hope and
    liberty. I see both when I look at the technology unfolding as it continues to
    do. Throughout this text, we have talked about blockchains in great detail. We
    have talked about the great technology and the great projects; we have talked
    about the revolution, so to speak. To be honest, I realize this is a lot of information
    to take in, and I think you have already come a long, long way in the understanding
    of this technology if you have stuck with the book so far. So, let me give you
    a tip. If there’s one thing you take from this book, and one thing only, then
    let it be that blockchain has given, and continues to give, a voice to the voiceless.
    It snatches the power from the castle on the hill and places it in the hands of
    the masses.


    But, have I been able to convince each and every one of you what this technology
    can bring? Maybe, maybe not—but that was never the point. The point was to hand
    you the telescope and allow you to watch the sky unfold, one star and one planet
    at a time. My agenda here wasn’t to make you believe what I was saying, but to
    show you what was happening around the world. I wanted to show you that—despite
    the tragedies, hatred, war, and corruption—there is still hope; and that it’s
    catching on, infecting more and more people every day. If I have made you see
    that, even for a moment when reading this, I shall consider it a success.


    I have realized through experience that people are just people; they are the same
    everywhere. Think about it. Imagine that you have gone to the supermarket and
    the lady standing in the queue in front of you drops the fruits she has picked
    up, which roll around in all directions. What’s your first instinct? Very likely,
    it’s to bend down and help her pick up the fruits. Despite all of the divisive
    news items that you are subjected to, is your first instinct to ask, or even wonder,
    if she is a conservative or a liberal?! You won’t, because it’s irrelevant.


    And, despite your political inclinations, your social class, religion, and race,
    you deserve to be treated with respect and you deserve to be heard, most of all.
    Everyone needs a voice and everyone needs others to hear that voice, even when
    they don’t agree or disapprove. As Oscar Wilde puts it humorously, “I may not
    agree with you, but I will defend to the death your right of making an ass of
    yourself” (Oscar Wilde Quotes, n.d.). In the polarized times we live in, it has
    become even more crucial to remember this. With speeches inciting hatred among
    the masses to the so-called “cancel culture,” which denies the basic respect to
    any person who disagrees with their opinions, the right to free speech has become
    more relevant than ever.


    Blockchains give me hope because they treat people for who they are: people. They
    give everyone a voice, regardless of their political affiliations. Sure, there
    will be ignorant comments made across the board, but let the world judge these
    comments for themselves. Good ideas don’t need protection from opposition; bad
    ones do. But, they can only be judged for what they are when they are in the public
    domain in the exact shape and form they have been proposed.


    However, the only cautionary tale that free speech comes with is this: The freedom
    of speech refers to the act of speaking, not to the consequences that come after.
    The great queen who said, “let them have cake,” was still overthrown. Free speech
    means a voice for everyone, not just the privileged. Today, what we have, more
    or less, are what I like to call the free speech silos—a bubble where you can
    scream out your own opinion, and even be cheered for it, without realizing that
    every ideology has its own bubble, too. The moment one hears opposition to their
    views, they bury their head in the sand trying to control as many channels of
    communication to serve their own narrative. The one who shouts the loudest has
    the biggest silos, but in the end, it just doesn’t matter because none of the
    silos are willing to have a collaborative approach.


    We are running our own countries in our head, and our politicians are happy to
    let it remain that way. Because, ultimately, isn’t that what gives them power?
    To let the chickens fight each other while their friend, the pig, is being slaughtered?
    Like I said, we aren’t as different as we are made out to be. We all want good
    healthcare, good education, access to employment, and housing; yet, we are the
    ones fighting over who should be living in the White House, as if that is the
    only thing we care about. Don’t get me wrong—political party affiliations are
    all fine and good, but they are there to fight for you, not the other way around.


    History is filled with examples of men—the so-called politicians and the supposed
    guardians of public wellbeing, who have failed the people. It’s filled with institutions
    that have looted people’s wealth in the name of welfare: Hitler’s Germany, Stalin’s
    Russia, Mussolini’s Italy. Invariably, in these examples, you will see that one
    of the first things these men took away from the people was not their wealth,
    but their right to free speech. Of course, freedom for anything cannot be given
    or taken—not even the freedom of speech. But fear is a powerful tool, and that
    is what has been used throughout history. With people who were privileged to have
    their voice heard, the fear was introduced by incepting the idea, “What if I lose
    the privilege?” With people who never had it, the fear took the form of, “What
    if I never have it, either?” The common result was exactly what the tyrants expected:
    an ear-splitting silence. And so, the dictates became mandates and history was
    tainted forever.


    Today, things are both different and not so different, at the same time. Free
    speech is still in grave danger, not only from dictators, but also from the big
    players in Silicon Valley. As politicians and technological frontrunners join
    hands, the concoction of power and privilege threatens to be even more dangerous
    when served on the platter of centralized technology. It is this combination that
    determines which voices to amplify and which ones to suppress. Again, the silos
    keep growing stronger and more sound-proof than ever before.


    Remember Aldous Huxley’s words from the foreword to his novel Brave New World
    (1947)—“Only a large-scale popular movement toward decentralization and self-help
    can arrest the present tendency toward statism.” Where our politicians and our
    institutions have failed us, blockchains have the potency to revive us. Blockchain
    technology doesn’t treat us differently; it doesn’t afford us different privileges
    based on which end of the political, ideological, or socioeconomic spectrum we
    lean toward. We owe it to this technology to not box it in the web of lies and
    deceit propagated by political ideologies. Give blockchains a chance; it might
    just make the world a little bit better for you and the others who have been disenfranchised
    over the years, left to fend for themselves.

