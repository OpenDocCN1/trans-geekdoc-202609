    \ countries. Reality, however, is a little more complicated. Sure, food scarcity\
    \ is a real thing; but, while millions of people are sleeping hungry at night,\
    \ tons of food gets dumped in garbage, too. The number of people suffering from\
    \ hunger could be much smaller. \n\nThe reason the produced food doesn’t reach\
    \ as many people is, in the modern world, food goes through complex supply chains.\
    \ Furthermore, these are closed and opaque processes which makes it even harder\
    \ to pinpoint the problem, let alone work through it. As is to be expected, hunger\
    \ is only one of the injustices that are born out of this. With such practices,\
    \ sustainability has been tossed out of the window for decades now. And, we have\
    \ already seen how it impacts the farmers, making their lives increasingly difficult.\
    \ All in all, these excessively long, complex supply chains do no good for anyone.\
    \ But, what’s strange is, until recently, never has much attention been paid to\
    \ reducing this inefficiency and the resulting waste, but most efforts have always\
    \ been directed to increasing productivity. \n\nBlockchains have been the perfect\
    \ disruptor here, because of the wide gap of unaccountability that existed before.\
    \ Today, a lot of big players have entered the arena and are actively using blockchains\
    \ to protect supply quality food. Walmart is one such franchise. If you have been\
    \ buying any greens from here, then you are already a beneficiary of blockchain\
    \ technology. This is because Walmart has made it mandatory for all its suppliers\
    \ of green, leafy vegetables to upload their details, as well as the data about\
    \ the product, on a blockchain—making the information highly accessible and free\
    \ from manipulation. They claim that their smart tracking technology helps them\
    \ track contaminations across their product to literally a few seconds. This is\
    \ a major relief to the producers, who previously had to risk massive foodborne\
    \ diseases due to contamination that no one was present for. It also saves a lot\
    \ of time and resources that would otherwise be spent on product callbacks. Another\
    \ major commercial company which is the first among many food companies to use\
    \ a blockchain-based supply chain is Nestle. They aim to make all the product\
    \ and supply chain-related information readily available to the end user, invoking\
    \ more trust in the brand itself. \n\nSupply chain blockchains would also have\
    \ a supplementary role to play in the case of agricultural blockchains. They could\
    \ give us crucial data about consumer behavior, which in turn would be tremendously\
    \ helpful in determining the demand pattern based on the location. Tailoring the\
    \ supply to this demand more closely would be quite effective in reducing the\
    \ wastage of food; the excess can then be directed to other locations which might\
    \ have unsatisfied demand for it.\n\nAn increased awareness of sustainability\
    \ and a growing empathy for our underprivileged counterparts have thankfully led\
    \ to quite a blockchain movement in the food industry. The government would play\
    \ a major role in promoting blockchain adoption in the public sector. Through\
    \ the standards and policies they set, they would be able to make the transition\
    \ to a blockchain much smoother. \n\n### Voting\n\nDemocracy sounds like a fantastic\
    \ concept, a great exercise in effecting the will of the people, but what happens\
    \ when people don’t seem to care? Voter apathy is a concern that has plagued all\
    \ democratic elections across the globe. You’d think, as the corruption grows,\
    \ there would be a higher number of people coming out to vote. But, it rather\
    \ seems to be working the other way around; as the trust goes down, so does the\
    \ number of voters who actually think voting has an impact on the present functioning\
    \ of things. An excuse commonly given is that voting is a tedious process that\
    \ takes up a lot of time. Now, imagine there was a way for you to vote as easily\
    \ as by picking up your phone and tapping a button on your screen. Would you take\
    \ it? Most people would, and if you live in places like Utah County, West Virginia,\
    \ etc. chances are you have already heard of the digital ballots, if not used\
    \ them. \n\nCompanies like Voatz and Follow My Vote, take care of the end-to-end\
    \ voting procedures, allowing citizens to cast their votes through their phones.\
    \ While the use of blockchains in voting has been appreciated, questions and criticisms\
    \ have been targeted at the companies' infrastructure. Critics are still not convinced\
    \ about the confidentiality of the entire process. They believe that, since a\
    \ lot depends on the security used by the voter’s network, the websites could\
    \ easily be hacked into. The Voatz officials have confirmed that their technology\
    \ has a feature that enables them to identify and reject the votes cast from unsecure\
    \ networks. It’s worth noting that their procedures have also stood the test of\
    \ live auditing."
