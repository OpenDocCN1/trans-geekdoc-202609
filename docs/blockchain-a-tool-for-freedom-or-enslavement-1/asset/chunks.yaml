    \ It doesn’t take a rocket scientist to guess that the banking sector would more\
    \ or less collapse as a result of all those bad loans. But, do you know what actually\
    \ happened? The total assets of banks actually rose by 18.4% in 2010 (Polleit,\
    \ 2010). This was because the Federal Reserve did exactly what the MMT suggests\
    \ and supplied the banks with vast amounts of money just to prevent their collapse.\
    \ \n\nWhile this may seem like a feasible option, such injections of expanded\
    \ money supply can be catastrophic for an economy and can create the very boom-and-bust\
    \ cycles we referred to earlier. Bringing the fiat economy to an equilibrium is\
    \ practically impossible because it does not carry an inherent value, at all,,\
    \ and is considered as money because everyone just accepts it as money. In contrast,\
    \ when the currency was latched to the gold standard, the government couldn’t\
    \ just wave the wand and come up with new money; they had to purchase the additional\
    \ gold for it. Thus, even if the banks made fraudulent transactions, they would\
    \ ultimately have to line up the claims against the available gold, and the system\
    \ would eventually correct itself to come back to the equilibrium originally desired.\
    \ In simple words, fiat money has left our economies to irreparable damage for\
    \ a long time. \n\nSince the movement away from the gold standard, the Austrian\
    \ proponents have been diligently hunting for an alternative that fills the “sound\
    \ money” void. It turns out, when Nakamoto came up with Bitcoin, this hunt ended\
    \ unexpectedly and the Austrian proponents had found their pot of gold (pun intended).\n\
    \n## The Sound Money Alternative\n\nBefore I talk to you about cryptocurrencies,\
    \ we need to talk a little more about the concept of sound money as stated by\
    \ the Austrian economists. As can be seen in the previous section, Austrian economists\
    \ hate the idea of government-controlled money supply. If you pay the slightest\
    \ attention to the economic news around the globe, you may be able to see the\
    \ merit in this theory. For decades and decades, together we have witnessed governments\
    \ around the world throwing the economies into a disarray by manipulating the\
    \ money flow. When the chaos manifests into unavoidable degradation of living\
    \ standards for the common man, the same governments (parties may be different)\
    \ entice the masses with false promises of a better tomorrow with further manipulation\
    \ of the already struggling money flow for the sole purpose of gaining votes. "
