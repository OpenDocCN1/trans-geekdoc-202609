    许多人认为加密货币是奥斯利利经济学与未来新兴技术之间唯一的桥梁。但，这种对不断发展的局势的看法可能是局限的。诚然，加密货币提供了与奥斯利利经济学派最直接的联系，但区块链作为一种宏观性技术，也并未偏离该经济学派的原则太远。


    在 20 世纪 80 年代后期，随着信息技术（IT）作为一种长期力量兴起，许多人开始考虑它对市场结构的影响。电子市场假设被提出，认为 IT 行业将通过三种方式影响市场：让通信变得简单且高效；帮助买卖双方直接接触而无需中介；最后是以一种对卖方和买方都有帮助的方式整合有价值的信息。据预测，结果将是更活跃的市场活动。


    人们希望，像 `Mises`（米塞斯）和 `Hayek`（哈耶克）等奥斯利利经济学家之前提出的观点，最终能被纳入这一即将爆发的新市场时代中。这些经济学家认为，任何经济面临的主要问题不是资源稀缺，而是相关信息的不可用。现在
    IT 正在作为救星兴起，这些信息可以变得可用，从而导致更少的等级制度和更协调的生产活动。然而，我们都知道事实并非如此。随着 IT 的出现，像 `Amazon`（亚马逊）、`Google`（谷歌）等巨头接管了这些信息，并没有消除层级结构，而是利用它创造了更加集中的层级结构。因此，尽管总产量增加了，小企业主却发现生存比以往任何时候都困难，而大科技公司的财富正以每秒的速度增长。


    今天，`Hayek` 和 `Mises` 以及其他奥斯利利经济学者的跟随者在区块链技术方面看到了另一个机会。如果你注意到，区块链技术代表了奥斯利利经济学所代表的一切，甚至超越了加密货币本身。然而，两者之间最显著的重叠领域是他们对去中心化的热爱。正如之前讨论过的，区块链允许政府当局进行最小的干预（如果有的话），因此不能被用作抑制和压迫的工具。


    然而需要注意的是，这种自由意志主义原则只有在且仅当像你我这样的普通人参与这项技术时才会被维护。`Google`、`Samsung`（三星）等大公司已经在采取行动采用区块链，如果我们不有效参与，即使这种自由的工具可能很快就会从我们手中夺走。


    自 `Satoshi`（中本）的 `Bitcoin`（比特币）出现以来，区块链的许多方面被置于放大镜下，包括安全性、可行性、采用性等等。但我们需要理解，区块链远不止这些技术细节。它们是几十年来一直被诋毁甚至被压抑的经济和政治价值观的化身，因为大众被误导，认为这完全是一个骗局。然而，事实仍然是，让大众对这项新兴技术以及这种意识形态一无所知，只会有助于掌权者吸引更多的权威性。


    尽管这一论点具有说服力，但人们对这项技术的政治和经济后果几乎没有或完全没有理解。我们可以随心所欲地谈论区块链的颠覆性，但在我们将其纳入政治和经济意识形态之前，这种论述在很大程度上是毫无意义的；无论喜欢与否，最终是这些意识形态决定了特定技术（无论其多么革命性）是否能在特定文化中长期生存。


    不要误会我的意思；我不是说我们迄今讨论的政治和经济学派对区块链技术的生存具有单向影响。它们没有。最终，任何新兴技术都处于一个或或多一个连续的技术、经济和政治反馈循环中。在适当的文化背景下，如果不考虑其他因素，就不可能理解其中的。因此，正如我们的经济和政治哲学可以决定一项技术是否能维持其原始意图的形式，技术本身也有推翻意识形态的力量。

    '
- fmt: '

    Here, we specifically focus on sectors and projects that are bringing that change
    to you, not solely for profits but for social good. Be it in India—where a firm
    called `ConsenSys` ventures working with a government think tank called `Niti
    Ayog` to streamline land ownership records, or Pan-Impact Korea—which utilizes
    social impact bonds with blockchain technology to make sure that payments are
    released only when the desired social outcomes are met, or 191 other blockchain
    projects across the globe according to a report from Stanford Centre for Social
    Innovation in 2018: all of these are examples of how entrepreneurs are blending
    profits, social outcomes, and blockchain technology in the most elegant manner
    possible. Such projects mushrooming even more in the past couple of years are
    only an evidence of the coming of age of technology, and that’s nothing but good
    news for us.


    It’s not all business, either. In 2021, Vitalik Buterin, the Ethereum co-founder
    we spoke of earlier, donated $1 billion worth of cryptocurrency to the Covid-Crypto
    Relief Fund in India (Terrapass, 2021). The transaction was as transparent as
    could be, and is only a testament to the ease and transparency with which blockchain
    transactions occur. But again, let’s not get caught up in these isolated projects
    and events, because blockchains for social good have shaped up to be much more
    than what may seem like a one-in-a-hundred instance.


    ## Blockchains for Small Players


    Till now, we have only looked at blockchains in the context of big players (like
    `Cardano`, for instance) and how they are using it for creating the much needed
    social impact. We will get back to blockchains in Africa and the social impact
    in the next chapter; but, here, what I want you to remember is that blockchains
    are not a distant technology. Blockchains are just as much for you and me as they
    are for the big tech industries, as well as the third world countries.


    ### Helping the Small Entrepreneurs


    Fighting against the big brands has always been a pain point for small businessmen.
    The accelerating consumerism often has us running behind the commercial brands
    rather than local businesses. Though multiple initiatives have been taken in the
    past to boost small businesses, none seem to have had a lasting impact. Blockchains
    can help the new businesses by leapfrogging to allow them to compete in the same
    space.


    A massive advantage of blockchains for small players is that they utilize much
    of existing infrastructure, rather than demanding that new setups be built from
    scratch. These new entrepreneurs have the option of using the pre-built blockchains
    on the open-source platforms like `Ethereum`, `Corda`, `Hyperledger`, etc. Of
    course, they can build these from scratch, too; but, with limited resources available
    to a new entrant in entrepreneurship, already functioning blockchain platforms
    may be particularly appealing.


    Large corporations have always had much bigger financial reserves, as well as
    much more sophisticated technology, as compared to local ventures. It’s no secret
    that e-commerce giants like `Amazon` have torpedoed the industry from all sides,
    making it extremely difficult for small business owners to even survive, let alone
    thrive. Blockchains have the potential to level the playing field, at least to
    some degree. In fact, when it comes to implementing blockchains, the freedoms
    afforded by both the attitudinal openness of a start-up, as well as the flexibility
    of setting protocols and standards, upcoming projects might just be better suited
    for this technology.


    Blockchains have the potential to level the playing field for small players like
    never before. This is especially true in the context of information asymmetry
    that has always hampered the growth of small industries. Since these do not have
    the same tools at their disposal as their big counterparts, they have always been
    at a disadvantage. Blockchains practically make the information gap disappear
    by making all data points readily available for assessments.


    Blockchains have also revitalized loyalty programs to help redirect the customers
    to these small-scale businesses. Traditionally, the loyalty programs have been
    fraught with confusion, leading to quite low redemption rates. Customers tend
    to be wary of these, especially because of the personal data they have to give
    away. Blockchains offer a way around this, as the data is all encrypted safely.
    Also, from the point of view of the entrepreneurs, executing these loyalty programs
    is much easier, and also much less expensive, because of the elimination of all
    middlemen and transaction costs. Moreover, the blockchain mechanism can help prevent
    fraud with stolen tokens or other forms of illicit use.


    There is one more implication that has not yet been widely explored, but could
    change the shopping experience completely. The small business owners could come
    together, forming a sort of local marketplace where the blockchain loyalty tokens
    across businesses could be interlinked, thereby allowing the customer to utilize
    these across the linked businesses without hassle. These could prove to be quite
    a turning point in community-building, as the money stays within the community
    and multiple businesses flourish while providing the customer with ease of shopping
    experience.


    ### Blockchains for Small Farmers


    Even as global consumption of produce is only increasing, the profits that small
    farmers make still remain quite slim. Ever wondered why? It’s because of the fundamental
    flaw in the way our systems are structured. Some may even argue, and quite rightly
    so, that our society and the systems that it relies on are designed only to make
    the rich richer and the poor poorer. Even the global supply chains in effect today
    centralize the market power at the top, and the stakeholders at the bottom without
    access to opportunities of growth.


    Take the simple example of the glamorous and ever-growing chocolate industry.
    Can you guess how much percentage value a small farmer, who grows his own cocoa/cacao
    beans, would receive in the end? Seven percent—yes, that’s the percentage of the
    total value of his production that he receives (Fairfood, 2020). This is because
    of the number of actors involved in the supply chain of this raw material that
    most often spreads over continents.


    Several initiatives have been brought forth to resolve this situation and make
    life a little easier for these small farmers in, let’s say, a place like Africa.
    Many boutique chocolate companies which call themselves bean-to-bar have come
    up, which focus their attention on creating shorter supply chains and giving a
    greater percentage of profits to the farmer directly. These companies sell “ethical
    chocolate” at more premium prices. At this point in time, however, there isn’t
    a way for the consumer to verify if these claims are being fulfilled in reality
    or not. Blockchains provide a simple, yet elegant, resolution by providing instant
    verification of these claims.


    This, however, would only be a part of the problem resolved. A much bigger issue
    is that, often, small farmers do not usually have access to finances that would
    allow them to engage in more calculated risk-taking. In the case of the above-mentioned
    farmers, for instance, since they do not have the means to purchase equipment
    to independently process their cocoa harvest, they end up having no leveraging
    power. They have to harvest whenever the crop is ready and sell immediately, for
    fear of wasting the produce due to over-ripening. Imagine what financial empowerment
    could do for a small farmer like this.

    '
