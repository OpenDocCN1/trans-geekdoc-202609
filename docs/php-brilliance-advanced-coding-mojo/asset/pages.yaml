    Perhaps the most commonly cited principle in the object oriented programming world
    is this one.


    > "Program to an interface, not an implementation."


    Despite this, we won''t be devoting much time to its consideration.


    Why on earth not?


    The reason for this is short and sweet - we should have nailed it already, Lizzie
    has. If you haven''t yet, you''re lagging behind. Go back to the chapters on abstraction
    and interfaces and then report back here when you''re done.


    The reason why this particular principle has been nailed, is in the bag, stems
    from all of that discussion on interfaces and how they provide us with a guarantee
    of method availability.


    Not only that, of course, it''s also in the bag, has been nailed, because of all
    discussion on how we can use abstract classes to lay down the blueprint for new,
    custom data types.


    Within the scope of considering either of these things what we are really concentrating
    on is that very desirable goal of achieving type safety. This becomes especially
    relevant when we consider the notion that, as developers, understand how PHPs
    own, native data types behave.


    Yes, I am going to repeat that bit again.


    If we as developers can achieve a fully comprehensive understanding of how integers,
    strings and associative arrays work we can create application code that works
    reliably with them and consequently achieve consistent results.


    Multiplying integers together will give us an integer result.


    Dividing an integer by a float will give us a float result.'
