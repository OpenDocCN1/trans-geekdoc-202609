- pgno: 286
  md: 'From a unit testing standpoint, this is still a nightmare, but we are at least
    making progress. You could elect to run the test suite that covers this and any
    other simple factories independently from the test suite that covers the core
    application code. It is worth bearing in mind that the corresponding User class
    no longer contains this dependency-laden static factory method and as such, can
    now be fully tested in its own right by passing mocks and stubs into the constructor
    as desired.


    Our simple factory is still a bit of mess though. How should we go about cleaning
    it up?


    For starters, we should turn our attention to the dependencies that are listed
    inside create() method. Here are the lines of code in question.


    ```

    $userRole = UserRole::create($userId)

    $userAccount = UserAccount::create($userId)

    $dbConn = Database::getInstance();

    ```


    The first two lines should clearly get the same “migrate the factory method to
    its own dedicated class”, allowing both the UserRole and UserAccount classes to
    become fully unit-testable.


    ```

    $userRole = UserRoleFactory::create($userId)

    $userAccount = UserAccountFactory::create($userId);

    ```


    Those are still hard coded dependencies but it could be said that those dependencies
    are justifiable, assuming instances of the User class cannot live without their
    corresponding role and account counterparts.


    The real elephant in the room is the third dependency; the call to the database
    singleton.


    ```

    $dbConn = Database::getInstance();

    ```


    It’s that truly knackers our automated testing strategy since we’ve learned that
    our automated tests shouldn’t have to drag the database connection along with
    them.'
