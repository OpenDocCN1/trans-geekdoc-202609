- pgno: 212
  md: 'On the one hand, we’ve seen how they can be used to gain full read/write access
    to even the most fervently defended private properties of another object. Not
    doing this is a particularly wise stance to take.


    On the other hand, we have also considered how we can create an entirely new objects
    populated with methods that have been cherry-picked from other real, live object
    instances and where those methods still retain their original scope. For the purposes
    of creating a read only object from a variety of models, this is something of
    a boon. However, and as previously noted, such technique has a very limited use
    case in real world applications. We certainly couldn''t present such a promethean
    construct to client code for further processing since the thing doesn''t come
    with its own interface. Such a lack of guarantee either by an abstract base class
    or an implemented interface would mean having to resort to duck typing. With one
    of these “Frankenstein’s Monsters” to hand, even that would be painful.


    The key benefits that can be derived from the use of closures then include the
    three that have been highlighted here. They’re portable, which means they provide
    a convenient means of passing around pre-constructed logical sequences, without
    or without data elements that were present in their parent scope, and which can
    subsequently be executed far away from the point of their inception. They are
    also disposable, which quite simply means we can dispense with them quite readily
    after they have been used.


    Finally, due to their “save it for later” macro style construction, we get to
    lazily load only the resources that we actually need in order to serve a particular
    request. With an appropriate autoloading scheme in place, such as which is provided
    by Composer, this also means that our application’s will only ever require the
    files for the classes that get used, and none of the files for the ones that do
    not.'
