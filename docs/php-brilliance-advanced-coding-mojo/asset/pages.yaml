  md: "# Finding Closure.\n\n```\n<?php\n$app = new \\Slim();\n$app->get('/hello/:name',\
    \ function ($name) {\n    echo \"Hello, $name\";\n}\n$app->run();\n```\n\nThis\
    \ sort of approach to routing is becoming ubiquitous in the PHP framework world,\
    \ and for reason too. It's a very effective, immensely flexible approach for mapping\
    \ that macro like against a URL pattern, thereby allowing for the automatic execution\
    \ of the enclosed code based on the result of matching patterns against the incoming\
    \ request path.\n\nDespite the simplicity of the code above it do should we consider\
    \ here. On the one hand, we have the relevant aspects that will trigger the execution\
    \ of the macro. On the other hand, we have the macro definition itself, which\
    \ will be triggered whenever the pattern is matched.\n\nOf course, the body of\
    \ this macro, this closure, is a painfully simple one. A little, subtle modification\
    \ will also serve to introduce the next idea quite admirably.\n\n```\n<?php\n\
    $app = new \\Slim();\n$app->get('/blog/:postId', function ($postId) use ($app)\
    \ {\n\n    $service = new BlogService();\n    $controller = new BlogController($app,\
    \ $service);\n    $controller->renderPostAction($postId);\n}\n\n```\n\nOk, perhaps\
    \ not so subtle but at least our callable has now been fleshed out with code that\
    \ is a little more relevant, and in doing so helps us to consider it as being\
    \ more a macro.\n\nWithin the body of our callable are two lines of code that\
    \ result in the instantiation of a BlogService and a BlogController object. Given\
    \ the fact that this callable will not be executed until the callable itself is\
    \ invoked, it should be easy to see how we are delaying the instantiation of the\
    \ service and controller objects until the very last moment."
