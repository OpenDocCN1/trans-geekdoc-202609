    one place.


    As far as our topic of abstraction is concerned though, the problem arises when
    we see one particular method in one class also being useful were it also to reside
    in another class. As I mentioned earlier, we''re typically a lazy bunch and sometimes
    the best way to satisfy our lazy inclinations is simply to move that useful method
    upwards into a parent class from which both classes inherit. If the method''s
    in the parent, it''s available to both children.


    This is, of course, the point where I return to the consideration of the base
    model classes in frameworks. If you are expected to extend a base model class
    in order to create your own models, it''s likely then that the base model comes
    preloaded with convenience methods. I call them convenience (and I''m certainly
    not alone in this) as they are the methods that do things for us, quite unrelated
    to the intended nature of the resulting class, and placed conveniently within
    reach.


    > The DRY principle is stated as "Every piece of knowledge must have a single,
    unambiguous, authoritative representation within a system"


    Ergo duplicate code bad, code reuse good.


    What is important to note here though that there are many different ways of avoiding
    code duplication and promoting code reuse. Achieving code reuse through a parent
    class, abstract or not, is simply the worst of the available options. There are
    alternatives available that are far more suitable and will still let us adhere
    to the DRY principle. You''ll find these discussed at length when we tackle the
    issues of delegate polymorphism, composition, traits and closures. In the interim,
    should you encounter an article, a tutorial, a blog post or even another developer
    that tells you that abstraction promotes code reuse, don''t fall for it.'
