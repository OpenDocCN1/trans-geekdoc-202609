- pgno: 24
  md: 'As a case in point, as recently as December 2015 I encountered two exceedingly
    poor quality tutorials linked to developer forums that I frequent. The first showed
    how to “easily populate variables using the extract() function”, which is a particularly
    dangerous “trick” to learn without making the reader fully aware of the dangers
    involved.


    However, even that pales into insignificance when compared to the second tutorial,
    which illustrated how to use AJAX to send search terms from an html form to a
    PHP backend that would return the search results back to the front end after querying
    the database. On the face of it, this seems an entirely reasonable thing to post
    a tutorial about and as a topic, it has certainly been covered any number of times
    before.


    However, in this particular tutorial, the example code illustrated the creation
    of a SQL query by iterating over the $_POST superglobal and using the values directly
    without any form of validation or sanitisation.


    For any time-served developer this should be a horrifying state of affairs; that
    a tutorial posted in 2015 pays no help in preventing SQL injection attacks and
    proving the proverb “A little knowledge is a dangerous thing”.


    Yet it is easy to forget that new coders take their very first steps onto a coding
    path every single day. Any such hapless copying and pasting this tutorial code
    into their endeavours would become vulnerable to those same SQL injection attacks,
    at least until time they acquire the right kind of knowledge that would let them
    guard against these attacks.


    Which brings us nicely back around considering what constitutes the right knowledge.
    Regrettably, at the time of writing there isn’t one definitive answer to that
    question. It is also dubious that there could ever be.


    One of the great joys that a career in software development brings along with
    it is the fact that the learning process never ends. No matter how advanced a
    developer becomes in their mastery of the topic, there is always more to learn.
    On the one hand, this is because the topic itself is so vast. On the other, it
    is because the technology progresses relentlessly.


    Complete mastery of application software development is entirely unobtainable
    for these two distinct reasons. At any given moment, there is already too much
    to fit into a single human brain. And today’s latest technique has every chance
    of being superseded tomorrow.'
