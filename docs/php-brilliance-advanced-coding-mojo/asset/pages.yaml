  md: "Proding the polymorph.\n\nWhat are we actually looking at? The two specialisations\
    \ that are embodied in the FixedMortgage and the CappedMortgage classes are really\
    \ only two different behaviours of the same process. Each of the two child classes\
    \ is encapsulating a different way of performing the necessary calculations -\
    \ to yield a mortgage payment plan appropriate for the represented specialisation.\n\
    \nIt doesn't take a great deal of refactoring to turn this unnecessary inheritance\
    \ hierarchy into a simple mortgage class and a pair of injectable behaviours.\n\
    \nLet’s see that in action.\n\n```\nclass MortgagePlan\n{\n    private $loanValue;\n\
    \    private $loanTerm;\n    private $repaymentCalculator;\n\n    public function\
    \ setCalc(RepaymentCalc $calc)\n{\n        $this->repaymentCalculator = $calc;\n\
    \    }\n\n    public function getCalc()\n{\n        return $this->repaymentCalculator;\n\
    \    }\n\n    public function getPaymentPlan()\n{\n        $calc = $this->getCalc();\n\
    \        return $calc->getPaymentPlan($this->loanValue, $this->loanTerm);\n  \
    \  }\n}\n```\n\nHere I’ve modified the original MortgagePlan class so that it\
    \ is no longer abstract. This is step one in the process of removing abstraction\
    \ and inheritance from our code. You will also note that I’ve provided a setter\
