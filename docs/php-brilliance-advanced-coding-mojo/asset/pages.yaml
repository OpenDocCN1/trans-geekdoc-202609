    To be fair, there''s no harm in using the magic __get() method like this purely
    from the perspective of its own operation as long as the method itself implement
    some kind of error handling for non-existent keys in the data array.


    On its own, the _get() method does nothing but yield values. However, its presence
    unavadably lowers the resulting quality of our software, if only by making the
    merest suggestion that it also be permissible to implement the corresponding _set().
    The very first moment you introduce _set() into your application''s codebase is
    the very first moment that you open a huge can of worms and you had better prepared
    to cook ''em and eat ''em and swallow ''em down as it will not be very long that
    the bugs come marching after should you happen to leave any dangling.


    When you use the _set() method to modify an object''s property values, you''re
    effectively wasting your time by coding the thing up. Just set the properties
    to public and be with it!


    Of course, I''m not actually advocating that particular course of action. Quite
    often you''ll see the __set() method fleshed out with code and logic of varying
    complexities. This might seem like a wise and clever thing to do but let''s face
    it, every time a change request comes in calls for this logic to be modified,
    the opportunity to introduce bugs into the application comes right along with
    it.


    Personally, I''d like to strike __set() from the language itself as I don''t believe
    any good can come of its most common usage. When you have at your fingertips the
    power to control the setting of each element of data by creating your own specific'
