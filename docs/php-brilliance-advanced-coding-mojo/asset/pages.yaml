  md: '# Brain Check


    We really have reached the end of Part One now, but before we move on let''s take
    stock of what we have covered thus far.


    In a way, this section might be considered a glossary; it certainly fits that
    particular bill. However, being a glossary isn''t its full intent. Rather, it''s
    a checklist of the topics that a developer exhibiting PHP Brilliance could stand
    up and deliver a lightning talk on.


    Take a moment to review the list. Given thirty minutes preparation time, could
    you deliver a 10 slide, 5 minute presentation on each of this topics? Without
    resorting to a search engine?


    If the answer is no, consider beefing up your knowledge on the topic in question.


    # Encapsulation & information / implementation hiding


    Encapsulation is the process of bundling values (properties) with the methods
    that act upon those properties. Information / implementation hiding is a kind
    of “bolt-on” concept that we can apply to update encapsulation in order to provide
    objects that act as black boxes, protecting their properties and controlling access
    via a well-defined public interface.


    # Exposing state through setters and getters


    Following on from the principle of encapsulation, the application of dumb setters
    and getters, methods that do nothing but provide access to object properties,
    leaves us prone to bugs caused by an object losing control over its state. Magic__get()
    and __set() methods can cause a great deal of problems in exposing an object''s
    state and extreme caution should be applied before using them.


    # Abstraction & Inheritance


    Abstract provides us with a means of defining a new data type to live alongside
    the language provided types of string, integer, array and object. Inheritance'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'allows us to provide specialisations of the new data types but we should avoid
    contradicting the data type specification that an abstract parent class provides.


    # Polymorphism


    Polymorphism can be achieved in PHP via a number of different ways, but not yet
    by Ad Hoc Polymorphism, the process of providing multiple methods with the same
    name but different signatures. We can do Subtype Polymorphism though, the kind
    that allows a child class to override a method in a parent class in order to provide
    a different logical process behind the method call. Of all the different types
    of Polymorphism, Delegate Polymorphism is our best bet. This last type allows
    us to encapsulate custom logic into distinct classes designed to handle specific
    situations.


    # God objects


    Also known as monster objects, these things occur in objects that either know
    too much or do too much, or occasionally both at the same time. They''re revealed
    when one or both of these situations can be observed; the object in question refers
    to or invoke in a lot of other locations within the code base. Either way, the
    object in question should be broken down into smaller parts, with each part used
    in the appropriate location.


    # Contra-, Co and Invariance


    A key feature that comes into play with the topics of abstraction and inheritance.
    It is essential to the maintenance of type safety to understand the role that
    these three types of variance play in such. Variance is a key component in the
    Liskov Substitution Principle'
  merge: -1
