  md: 'constructor at creation time, we also have the one and only call to new User
    ( ) right there in the same file.


    Imagine if you that all of your class declarations within your application automatically
    included this static create method. How much easier does it become to manage the
    object creation process? How much easier does it become to safely modify the method
    signature of the class constructor when the only location objects of this class
    is instantiated right there in the class?


    Of course, this is not the final solution. This is especially the case for large
    and complex applications that have equally complex objects. Readers with a keen
    eye and a critical mind will have already deduced that, for objects with a complex
    set of constructor parameters, this technique saves us nothing at all if the factory
    method itself does nothing but proxy those parameters to the constructor.


    In code, this might look a little like this:


    ```

    public static function create($userId, $userRole, $userAccount)

    {

    return new User($userId, $userRole, $userAccount);

    }

    ```


    However, the factory method technique does protect us from some significant amounts
    of future pain if the method does some actual work to.


    ```

    public static function create($userId)

    {

    // Collect the role and account instances

    $userRole = UserRole::create($userId);

    $userAccount = UserAccount::create($userId);


    // Collect the actual user details

    $dbConn = Database::getInstance();

    $userData = $dbConn->query("SQL statement here");


