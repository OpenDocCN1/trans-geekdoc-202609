  md: 'to determine which code path to execute next, you’re also setting yourself
    up for bug-ridden scenarios down the line.


    As you proceed through the routing process in a manner such as this, you’ll end
    up with a preponderance of IF statements too unwieldy to manage. Something will
    go wrong at some point in the future, even if it appears to work just fine now.


    The modern way to tackle this particular problem is to build your own router,
    or much better yet, use a routing package built by someone else and used by thousands
    of other developers. Two of the more popular routing packages available are Nikita
    Popov’s FastRoute²¹ and The League of Extraordinary Packages’ route²², both of
    which will allow you to set up routing in a highly maintainable fashion.


    Avoiding complexity is key to achieving maintainability and improving the test-ability
    of your code. Save the IF keyword for validation wherever possible and employ
    patterns like Strategy, Command, Decorator or even Chain of Responsibility to
    provide branching logic within your codebase.


