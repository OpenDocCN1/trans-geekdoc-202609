  md: 'Favour Interfaces.


    +   - Create or update a document record in MongoDB

    - Add the document’s title and permalink details to a tag map being maintained
    in a key/value store such as Redis or Memcache.


    All of these things could be achieved without necessitating a single change in
    the code of the AbstractDocument inheritance hierarchy, a highly desirable outcome
    that is readily achieved when we adhere to this particular principle.


    In direct contrast to this, type hinting for a very specific concrete class such
    as a Mysql instance will inevitably lead to polluting the code in our Document
    child classes with Mysql specific method calls - a highly undesirable outcome
    since it will entail a major refactoring effort to be able to add in other types
    of storage at a later date.


    # Summary


    There’s very little to add to this. When we are comfortably and consistently recognising
    the characteristics and attributes of our abstract data types and badge-wearing
    interface implementers in preference to having to manoeuvre our code around concrete
    classes, we achieve the following things


    +   - Resilient code based on a consistent respect for type safety

    - Reduced future maintenance requirements based on incoming change requests and
    therefore:

    - More pub time.


    Nevertheless, Lizzie would have us rewrite the order of preference as being “Ice-cream
    over interfaces over implementations”, not least because pistachio, chocolate
    and mint is apparently the dog’s doodahs.'
