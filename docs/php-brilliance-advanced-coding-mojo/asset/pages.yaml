  md: "Do shoot the messenger\n\nAn active database connection, in this case a PDO\
    \ instance, is a very popular choice for a dependency that will get passed around\
    \ by couriers until they reach their intended target.\n\nNow, we need a courier,\
    \ and what better choice of courier than a page controller?\n\n```\nclass ProfileController\
    \ {\n    private $db;\n    public function __construct(PDO $db) {\n        $this->db\
    \ = $db;\n        ...\n    }\n}\n```\n\nI have deliberately omitted the code for\
    \ any actions methods thus far in order to highlight the relevant parts, as far\
    \ as The Courier is concerned.\n\nOur controller class here has a declared dependency\
    \ on the PDO instance, as indicated by the constructor's method signature. If\
    \ we have a modulus of good sense, we will not be accessing the database directly\
    \ from within the action methods, so why is it?\n\nWe can answer this question\
    \ with the provision of an action method.\n\n```\nclass ProfileController {\n\
    \    private $db;\n    public function __construct(PDO $db) {\n        $this->db\
    \ = $db;\n    }\n    public function updateAction() {\n        $userId = $_SESSION['user_id'];\n\
    \        $userProfile = ProfileModel::create($this->db, $userId);\n        $userProfile->update($_POST);\n\
    \    }\n}\n```"
