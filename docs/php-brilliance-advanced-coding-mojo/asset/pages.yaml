- pgno: 342
  md: '# # PHP7


    It should be borne in mind that, at the time of writing, PHP7 has only just gone
    GA, meaning that we are likely to see a flurry of bug reports and bug fix releases
    in the very near future. That being said, most of the content included here is
    based on RFCs meshed with my own experiments of using the PHP7 nightly build.


    > > This appendix is likely to be in a state of great flux. With a new major version
    landing on our desktops, we may have a little time to wait before we see some
    sort of stability.


    With due appreciation of that warning above, let''s now start to take a look at
    how some of the changes coming in PHP7 will impact upon the material that we''ve
    already covered in the first three parts of the book.


    # ## Scalar Type Hinting


    This is perhaps one of the most impactful changes to the language that PHP7 brings
    with it, something that is readily apparent simply by observing the amount of
    heated debate that the topic has generated whilst the RFCs were being proposed,
    debated, rejected, redrafted and resubmitted.


    Why such heated debate? The polarisations from the consideration of whether PHP
    should be a weakly typed language or not, and if not how is the stronger typing
    support to be implemented in a way that causes the least disruption to the PHP
    developer community.


    # ## In the blue corner


    The proponents for retaining weak typing argue that PHP should continue to honour
    its historical roots and behave like it has always in the past. This means that
    it should continue to support such well established expectations as being able
    to send a string that looks like a number to a function that requires an integer
    or a float. Like this'
