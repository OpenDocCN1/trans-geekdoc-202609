- pgno: 101
  md: '# Respect your elders


    Good parenting should always include encouraging your offspring to respect the
    guidelines laid down by the parents. In an object oriented sense, this means sure
    that your child classes continue to honour the promises made by their parents
    through the interfaces that the parents have exposed. If the child can achieve
    this, it doesn''t actually matter whether the parent class has been declared abstract
    or not so long as you remember what the client code is expecting to be able to
    do with the instances that arise from this hierarchy.


    Once this has been achieved, there clearly isn''t any genuine limit to the number
    of tiers in the hierarchies that you create. If each child recognises and respects
    the requirements that are laid down by your parent, with specific regard to the
    three rules that I have described above, your application should continue along
    its merry way without stumbling over a type safety glitch.


    Nevertheless, there is one particular factor that seems to get in the way of adhering
    to these rules. Humans. Pesky humans. Pesky little of the programmer variety who
    aren''t quite logical in their information processing as the chips and circuits
    that they seek to manipulate.


    When you create larger tiers of inheritance hierarchies, it''s just so tiresome
    trying to keep track of what is in each particular layer. If you or your colleagues
    have to trace the execution of a method call up and down multiple layers of inheritance,
    you may just find yourself missing the one subtle but critically important nuance
    in the flow. If you handed me a troublesome stack of inheriting class definitions,
    I can guarantee that it''d take the sloppy puddle of grey mess between my ears
    a not insignificant amount of time to absorb all of the details, let alone find
    the problem. But when you flatten those stacks, when you keep your hierarchies
    down to the least number of layers as possible (ideally two), you make the code
    far palatable, far more digestible for the very same humans.


    For our child classes to be compatible with the parents they extend, you are virtually
    guaranteed to find that bugs will appear. Bugs that are directly attributable
    to this very specific set of circumstances. This should obviously be a situation
    that you, as a buddingly Brilliant PHP developer, should be keen to avoid, regardless
    of whether you value your pub time or not.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Inheriting wealth is not always good.


    # Inheritance Abuse


    I couldn''t very easily get to the end of a chapter on Inheritance without going
    into something that I''ve come to call Inheritance Abuse. You''ll recall earlier
    in this chapter that I made mention of a particular horror story, one in which
    a company''s homemade framework had the controllers extending the view? Well it
    wasn''t quite simple as all that.


    It didn''t just have the developer create a controller by extending the View class
    directly. Instead, there were two, three or four intermediary levels of derived
    classes to contend with. If I recall correctly, the worst violation had seven
    in its inheritance hierarchy with the View class at one and the implemented Controller
    class at the other. The View class itself provided an init() method that allowed
    for the execution of some page setup routines. In some, but not all, of the derived
    classes called the init() method was overridden. For example, a page controller
    within the admin section of the site would need to extend a particular admin-flav
    child of the View class because its overriding init() method included a test to
    see whether the visitor accessing an admin page was a) logged in and b) had admin
    rights.


    Of course this is an extreme example, one that was somehow oddly reminiscent of
    those word ladder puzzles we used to get as children. You know the ones I mean:
    We have a starting word at the top, and a target word at the bottom. On each level
    between you had to make a new word by changing just one letter of the previous
    word until you finally made the connection between the starting word and the target.
    That''s how this company''s framework felt at times; a word ladder.


    Let''s be thankful for merci though. PHP does not support multiple like C++; each
    class may only extend a single parent. As we have seen though, it places no restriction
    on the creation of multi-tier inheritance hierarchies. Any developer so without
    such thoughts can create their own “word ladders” in code, one little bit in each
    tier until finally the two extremities are connected. This is, in essence, the
    very thing that leads to what is known as the Yo-Yo problem, which I have personally
    experienced few more times than I would have preferred.


    The Wikipedia page on the Yo-Yo problem makes a very apt description of it, so
    I shall simply quote the first sentence here'
  merge: -1
  img_proc: true
- pgno: 103
  md: '“Computer science, the yo-yo problem is an anti-pattern that occurs when a
    programmer has to read and understand a program whose inheritance graph is so
    long and complicated that the programmer has to keep flipping between many different
    class definitions in order to follow the control flow of the program.” - Wikipedia.com


    Why then do we do it? Why is the problem so prevalent that it gets its own name
    and a wikipedia page? The unrestrained ability to provide for three or more levels
    of inheritance is, to my mind, born out of the misguided notion that abstraction
    and inheritance promote code reuse and helps the developer to avoid duplication.
    I’m sorry that I reminded you about this idea but I still say vehemently that
    it doesn''t.


    Code reuse is good though. We know this. Avoiding duplication of code is also
    good. We know this too. Adherents to the “Don’t Repeat Yourself” (DRY) principle
    are keen to keep and spread this knowledge around, and wisely so. Don''t get me
    wrong by thinking that I''m turning my nose up at code reuse because I''m not.
    If I were to express inheritance abuse as a singular concept, it would go like
    this.


    Inheritance abuse occurs as a result of the unrestrained extension of one class
    by another for no reason than that the extending class would have access to and
    therefore be able to utilise the logic, routines and/or properties of the class
    being extended.


    As you might deduce, I’m referring again to the matter of convenience, but this
    time, rather than describing the process of writing a convenience method deliberately
    in parent class that the child may have easy access to, I’m specifically referring
    to the practice of having one class extend another *purely* because the intended
    class contains “useful stuff”. When this happens, the developer is clearly disregarding
    any notion of families, hierarchies or data types. When this happens, it happens
    because the developer wants to “import” some of the functionality of parental
    target into the child class that they are creating. This is another of those terribly
    and easily recognisable code smells.


    One thing that I’m particularly keen to encourage is for developers to avoid falling
    into the Inheritance Abuse trap. Keep your hierarchies as flat as possibly can
    be. Just two levels is the ideal to strive for: a data type definition provided
    by an abstract'
