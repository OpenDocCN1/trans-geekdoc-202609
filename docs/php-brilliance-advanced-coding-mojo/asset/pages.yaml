  md: 'And favour Composition too.


    # The Decorator Pattern


    Being able to change the behaviour of an object at run time isn’t merely restricted
    to the State and Strategy patterns. The third pattern for us to consider how we
    might favour composition takes the opposite approach by injecting that object
    into a wrapper in order to change its behaviour.


    How?

    To answer this question, we should start with the pattern’s definition itself.
    It goes a bit like this:


    The Decorator Pattern allows for either the static or dynamic wrapping of objects
    in order to modify their existing responsibilities or properties.


    I say “a bit like this” because it is possible to find a number of somewhat subtle
    confusing variations on this particular theme. There are a few takeaways we can
    get down first though to help with our understanding of this particular beastie.

    Firstly, we will be creating a class that will wrap our principal object of concern
    in order to be able to inject principal into our wrapper. Since our wrapper is
    going to depend on the injected principal, that should occur on the constructor.

    Second takeaway is that if we are modifying the way that the principal behaves,
    our decorator must also provide an interface that is identical to our wrapped
    object. This is where things can get confusing since the UML diagram for this
    particular specifies that the decorators subclass the principal and thereby use
    inheritance to acquire the parent class’


    We’ll take a look at this technique first with the rather stereotypical pizza
    example, just so that we have the original definition down pat. After this though,
    we’ll look at an alternative interpretation of the pattern and consider the pros
    and cons of each.

    Here’s your pizza.'
