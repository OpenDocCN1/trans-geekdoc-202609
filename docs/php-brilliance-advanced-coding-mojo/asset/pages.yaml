    \ use the new version of this package would now mean that we have to search through\
    \ our entire codebase to find every location where this method is called, making\
    \ the relevant changes as we go along to ensure that that method is only given\
    \ two float values.\n\n```\n<?php\n// Where previously we used\n$calc->addThe($first,\
    \ $second);\n\n// We would now need something like this\n$calc->addThe((float)\
    \ $first, (float) $second);\n```\n\nNaturally, that places quite a significant\
    \ burden squarely upon our shoulders. If the package provider was bundling a major\
    \ security fix with that update, we would have no choice but to follow the refactoring\
    \ route - we either meet the new demands expressed through the typing in order\
    \ to take advantage of the security fix or we switch to an alternative package\
    \ that provides much the same functionality.\n\nGiven that it's already perfectly\
    \ possible for us to write high quality applications, do we really need to upset\
    \ the apple cart so much by introducing a significant change to the language?\
    \ The tools are already there to accommodate the foibles of userland implementations\
    \ by casting the inputs to the specific types that we expressly want to work with.\
    \ If we really want to get pernikety about the variable types coming in, we can\
    \ validate for those types and throw up errors and exceptions if client code is\
    \ getting wrong."
