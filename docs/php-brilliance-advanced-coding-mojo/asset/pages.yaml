    }\n```\n\n```\nclass CappedMortgage extends MortgagePlan\n{\n    public function\
    \ getPaymentPlan()\n    {\n        // Logic to calculate a mortgage repayment\
    \ plan\n        // based on variable interest rates but subject\n        // to\
    \ a nominal cap to prevent repayments exceeding\n        // a certain value\n\
    \        ...\n        return $mortgagePlan;\n    }\n}\n```\n\nAnd here I've provided\
    \ the usual suspects in terms of specialised child classes. In the first instance,\
    \ we have a FixedMortgage stabilisation, which is capable of calculating the mortgage\
    \ repayments that would fall when a fixed rate mortgage has been taken out by\
    \ a customer. The second instance features the necessary logic in order to calculate\
