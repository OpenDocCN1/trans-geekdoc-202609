- pgno: 161
  md: '# Putting a name on our spaces.


    We''ve had namespaces for six years, aren''t you using them already? Actually
    you have, we all have, whether we''ve been aware of it or not. Prior to the arrival
    of the namespace keyword back in 2009, every bit of code ever written ended up
    in one regardless: the global (or root) namespace.


    Namespaces are a common feature of many programming languages and for good reason
    too, since they lend themselves well to giving us the power to properly, intelligently
    and logically organise your code into sensible units.


    # Namespaces are to code what directories are to files


    Not having the ability to define our namespaces led to us facing two competing
    problems.


    The first of these problems stems from the fact that you can''t declare more than
    one class or interface of the same name within the same scope. This course makes
    perfect sense - you couldn''t reasonably expect the PHP interpreter to reliably
    instantiate an object from the correct PDO class if you''d provided your own version.
    This is perhaps the most overt representation of something known as collision.
    If the language itself provides a named class within the global namespace, you''re
    denied the opportunity for using the same name in your classes.


    A much more insidious manner in which this problem presents itself arrives when
    you start importing third-party libraries of code into your projects.


    Consider what would happen if you defined your User class within the global namespace.
    Seems reasonable, right? But then you proceeded to add in a third-party library
    that came with its own User class? You would have to agree that the name “User”
    is a pretty popular choice, but now your application would be broken. PHP would
    simply refuse to run it due to the presence of two competing class names. To fix
    this issue, you might be tempted to rename your class to MyUser. Ugh!'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Putting a name on our spaces.


    I subtitled this section with an analogy to directories and files. It''s appropriate
    now to bring that comparison to play. When it comes to mentoring team members
    about namespaces, we can start with the root of a file system. On a Windows based
    machine, that''s normally referred to as “C:\, but since I''m a linux type of
    guy I''m going to stick with the terribly simple and "nix like "/”. The root of
    the filesystem is directly comparable to the global namespace in our code.


    We can ask our developers who would find preferable: To drop every file they create
    into just one root location? Or would they prefer to make use of directories to
    impose some sanity and order on the layout of the codebase? It''s a rhetorical
    question of course. Anyone with a passion for music might very well hundreds if
    not thousands of mp3s on machine but they won''t be saved into the same ''$username/Music/
    folder. In all likelihood, they will be organised into folders. By first the name
    of the artist, then by album title, giving rise to a folder structure that might
    just look like this.


    ```

    /home/thunder/

    Music/

    haus/

    Crackle/

    Iron Slave/

    Metallica/

    Master of Puppets/

    ```


    This is namespacing at work directly within the filesystem - the logical gathering
    together of related materials. When the filesystem analogy is considered, it''s
    hard to see a way for not justifying the benefits of sensibly organised folders.
    More significantly, we already know from experience that we cannot save two files
    with the same name in the same directory, a fact which only strengthens the analogy.


    Still, we haven''t always had the namespace keyword to help us out, which put
    put us squarely into the path of the second problem. If we can''t use the same
    name inside the same scope, what must we do instead?'
  merge: -1
  img_proc: true
- pgno: 163
  md: "Putting a name on our spaces.\n\n```\nclass My_Very_Long_Class_Name_That_Is_Hopefully_Unique\n\
    {\n  ...\n}\n```\n\nSorry Zend but nothing displays this particular issue better\
    \ than the code in the 1.x series of Zend Framework. Let's say that we needed\
    \ to create a connection to our MySQL database, a fairly common use case. Achieving\
    \ this would mean having to create a new instance of the Zend_Db_Adapter_Pdo_Mysql\
    \ class. It works, for sure, but using long names for our classes lead to code\
    \ that is cumbersome to work with and difficult to read. Back in the day, it was\
    \ a necessary measure but the same can't be said for today.\n\nBoth of these problems\
    \ are readily solved with the application of a custom namespace, which gives us\
    \ the ability to prepare prepare organise our classes into sensible and logical\
    \ units. Exactly in the same manner as organising files into directories. To illustrate\
    \ this idea, let me perform a direct translation of that Zend class into something\
    \ appropriately namespaced.\n\n```\n<?php\nnamespace Zend\\Db\\Adapter\\Pdo;\n\
    \nclass Mysql\n{\n  ...\n}\n```\n\nClearly then, with the provision of an appropriate\
    \ namespace, the class name itself becomes shorter, more succinct and easier to\
    \ comprehend. However, I don't wish to be seen as promoting the use of an old\
    \ framework for my examples so for future examples, I'll switch up to a more contemporary\
    \ offering."
