    us and checking it against the hash that we''ve already stored. Already, we have
    two processors for the most basic of operations.


    Experience tells us that we are also going to have to provide some of password
    reset mechanism, since some of our users are likely to fall squarely into the
    can''t remember passwords for coffee can. Do we also need to implement a lock-out
    mechanism after three failed login attempts?


    Answering these questions leads us to the conclusion that actually, building password
    logic inside our User class is maybe not so good idea afterwards. Instead, we
    can wrap all of these password related methods inside a new PasswordManager class,
    instances of which can be injected into our User instances at creation time, or
    lazily loaded on request dependent upon our appetite for tight/loose coupling
    between a user instance and a password management processor.


    Simply by hiving off two very common processes, that of registration and password
    management, we not only improved the focus of the User class dramatically, we
    have also created two additional classes with tightly defined areas of responsibility.'
