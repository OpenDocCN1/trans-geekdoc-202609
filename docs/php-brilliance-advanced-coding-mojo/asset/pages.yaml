- pgno: 270
  md: '# Tell, Don''t Ask


    would create the more specialised child classes such as Administrator, Member
    and Editor classes. Each of these child classes would have their own implementations
    of the getWelcomeMessage() method coded up accordingly.


    This might be fine if our requirements for how our user roles are to be implemented
    are exceedingly simplistic.


    The reality, of course, is that there is no such thing as “simplistic” when it
    comes to dealing with the business team.


    Which leads us to second, and more likely, approach to coding user roles. We create
    an inheritance hierarchy of role classes, with a BaseRole as the abstract parent
    and more specialised child classes as EditorRole, PublisherRole and AdministratorRole.
    These role instances are then created and injected into our User instances whenever
    the User instances are themselves instantiated.


    The result? In this case, the process of displaying a welcome message doesn''t
    utilise a single if() statement in order to display the desired message. The User
    instances are appropriately equipped with role instances that allow them to respond
    to the getWelcomeMessage() method call correctly and without any decision making
    to get in the way.


    Let''s get ourselves back on track. If the key element Alec Sharp''s quotation
    is “Object oriented tells to do things” then what are we really doing if not creating
    object methods that read, write and manipulate an object''s state?


    Does this sound familiar? It certainly should given that we have devoted a lot
    of time to examining encapsulation. Yes, this is one of circular references that
    I mentioned previously. The Tell, Don''t Ask principle has a direct correlation
    with what we know about encapsulation and how it is “the bundling of properties
    and the methods that act upon properties into a single logical unit.”


    It is also precisely the reason why Lizzie is currently hopping from one foot
    to the other whilst pointing at her screen enthusiastically. The reason for such
    suddenly frantic and slightly out-of-character behaviour? Certain luminaries of
    the programming world found on this particular principle, considering it to be
    superfluous and unnecessary in many cases, Martin Fowler is one luminary who argues
    some very valid points concerning this principle in his bliki post¹.


    > ¹³http://martinfowler.com/bliki/TellDontAsk.html'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Tell, Don''t Ask


    To a certain degree, the naysayers are right to call this out. If the Tell, Don’t
    Ask principle is only really saying to us that we should be doing encapsulation
    properly, then yes, the principle itself is an unnecessary addition to the catalogue
    of stuff that we as brilliant programmers are supposed to know.


    If the Tell, Don’t Ask principle requires us to add a method to an object for
    every single operation we need to perform concerning the data that the object
    holds then there’s a very real possibility that our classes will become quite
    bloated over time. We should very certainly be striving to avoid bloated classes
    wherever possible.


    Lastly, if we became fanatical about the Tell, Don’t Ask principle, then we might
    start to eliminate all of the getter methods that we’ve been writing into our
    classes previously. In some quarters, getter methods are criticised for breaking
    the principle of encapsulation by exposing the inner state of an object. Fanaticism
    is not normally a good thing though and in this case, eliminating getters entirely
    would also severely restrict our ability to create collaborators for the objects
    within our system.


    Imagine trying to create a SalesReport object, that fed appropriate SalesOrder
    instances, wasn’t able to get any information about those orders for the reports
    that it is trying to build. Clearly the SalesOrder instances need to collaborate
    with the SalesReport instance and that the order objects have to be able to supply
    the details of the sales order that one represents.


    So where does that leave us, the members of Team Brilliance?


    The good news is that it leaves us in a very good place indeed. By adding this
    principle to our mental toolbox, we are backing up and reinforcing what we already
    understand about encapsulation. It’s not always easy to keep the principle of
    encapsulation at the forefront of our minds whilst we are banging out enterprise-grade
    application code. It is, however, much easier to catch ourselves when we inadvertently
    make a logic decision based on the values held within an object’s state. When
    we find ourselves performing a logic test on an object’s state to determine which
    block of code will be executed, we are almost certainly violating this principle
    and therefore by extension, we’re also violating the principle of encapsulation
    too.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Tell, Don''t Ask


    258


    # # Conclusion


    The power of this particular principle comes not directly from its own content
    but instead, in the way that it helps us to remain compliant with the principle
    of encapsulation. If we''re doing encapsulation correctly, then it is highly likely
    that we are honouring the *Tell, Don''t Ask* principle. Conversely, if we are
    doing *Tell, Don''t Ask* correctly, then we are equally likely to be doing encapsulation
    correctly too.


    The key thing here though is that the *Tell, Don''t Ask* principle is much more
    likely to lodge in the front of our coding minds and give us pause when we trip
    up in our code. Hence the analogy to an Ohio-class guided missile submarine. You
    may not see it, but you''ll know it''s there when it fires on you!'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Instantiaphobia


    You might have noticed that I''ve name-dropped this particular principle several
    times already. Well, the good news is that we''ve finally arrived at the chapter
    that will be discussing the principle of Instantiaphobia. Granted, this is a homemade
    principle of my own making but rest assured, it''s been out of the oven long enough
    to allow you to pick up, turn it over and inspect it from every angle without
    burning your fingers.


    In essence, this principle deals with what I like to consider as an allergy to
    the use of the new keyword. Shortly, will I consider this to be one of the key
    techniques for developing that apparently psychic awareness of how to avoid bug
    scenarios.


    The principle itself is just a single, simple sentence so''s get that out of the
    way early.


    > For every class defined in an application''s codebase, there should be and only
    one location where objects are instantiated from that class.


    If you think back to the Talking Points chapter at the end of Part One, you might
    recall that I told how a little white lie to one of my private students: that
    an object can only be created from inside another class called a Factory.


    That wasn''t even remotely true of course, but did it allow the student to leapfrog
    numbers of other beginners in terms of achieving better quality code in a shorter
    time frame.


    Think back again to the chapter on Encapsulation and how we went through the process
    of developing and refactoring a User class through many iterations. One thing
    that you might not have noticed especially during process was how many times we
    changed the method signature of the User class constructor.


    At one point, we had a list of scalar parameters being passed in. At another,
    it was an array. At yet another point, it was an object. This is the point where
    adhering to the principle of Instantiaphobia will pay the greatest dividends.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The reverse is just as true. Failing to acknowledge this particular principle
    will lead to a codebase that exacts a terrible price on that most valuable of
    commodities: high quality pub time.


    In an agile world, with over-eager business teams possessing a seemingly endless
    supply of spanners that they can throw into the works, we are not always able
    to know in advance what the final version of a particular class should look like
    before we''ve built it. Heck, in an agile world, we rarely arrive at a finished
    object. Instead, we have to satisfy ourselves with interstitial moments of operational
    software. These moments on the development timeline are commonly known as “releases”
    and get tagged as such.


    Of course, modifying the constructor of a particular class inside application
    code that is already in production is a major sign of poor initial design. Fortunately,
    if you take on board all of the ideas that we discuss in this book, poor design
    days should be well and truly behind you.


    This is why this chapter exists in the first place - it''s about avoiding future
    headaches by adopting a quite specific coding technique today. At some point in
    the future, your teammates are quite possibly going to think of you as being psychic
    if you take this approach on right now.


    But what is this approach?


    Let''s start with a snippet of code:


    ```

    $user = new User();

    ```


    Our beloved user class returns again! Once we''ve finished celebrating this fact,
    we should ask ourselves “Where is this code?". In a naively designed system, or
    more likely, that simply grows organically, it''ll be everywhere an instance of
    a User object is required.


    Quite literally, everywhere a $user instance is required, it''ll be instantiated.
    One project that I worked on previously had the $user instance for the currently
    logged-in user instantiated at the start of every request, irrespective of whether
    that instance would be used to service that request or not. For a largish application
    with'
  merge: -1
