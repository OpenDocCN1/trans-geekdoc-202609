- pgno: 262
  md: 'And favour Composition too.


    much damage as it can absorb, starting with the OakShield as the outer layer and
    working inwards.


    Is our work complete then? Not quite. There''s a very clear and obvious problem
    here but before we get on working our way through it, we should take a moment
    to consider what we have achieved.


    By divorcing the family of decorators from the principle subject to be decorated,
    we have successfully dispensed with the rather odd notion that an oak shield or
    a chainmail shirt is-a of Warrior in the same way that it seems to suggest that
    an olive topping is-a of pizza.


    To put it another way, we have set our decorators free and improved their reusability.


    The problem that we''ve introduced here is a pretty obvious one. If we were to
    send our Warrior instance onto the battlefield we would not be able to do anything
    except take damage and report its current, composite health status. Pretty rubbish
    as far as warriors go then.


    The reason for this is down to the fact that we created the instance purely for
    the methods of interest, of which there are just two. By decorating the warrior
    with armour we have effectively shut off to the warrior''s other methods. Methods
    we presumably included providing the ability to fight back and hopefully defeat
    enemies.


    How should we fix this situation?


    We could proceed to extend the required interface so that it also included all
    of the Warrior class'' combat methods that would be messy. We would end up with
    a ChainMailHauber that somehow knew how to fight, which is clearly wrong.


    Instead, we would need to approach the construction of a Warrior instance with
    a a completely different strategy. There''s that word again. Strategy.


    Since our armour decorators are all defence related, our best approach is to employ
    the Strategy Pattern in order to create defence strategies, as StandAndFight,
    HideAndSnipe or RunAway, which we can then proceed to decorate with the armour
    as desired.


    The same approach could then also be applied to the notion of creating a fight
    strategy, with their corresponding decorators;Flaming? Or PoisonTipped? Both of
    these options could equally be applied to instances of Sword, Dagger or Arrow.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'And favour Composition too.


    If the health of our warrior, its armour and its weaponry is also represented
    by the State Pattern, an eminently appropriate candidate, then we clearly have
    quite a complex construction process to consider when building out our Warrior
    instance. Fortunately, that''s the topic of the next chapter, Instantiaphobia.


    # Summary


    In a chapter dedicated to helping us divest ourselves of the notion that inheritance
    is useful, we''ve taken in three common design patterns that neatly prove the
    case for abandoning inheritance as a means of creating reusable code.


    Unless you truly believe that an olive topping is fit for being considered a pizza
    in its own right, that is.


    With the three design patterns that we''ve considered within this chapter, the
    core entities within our application will be able to support any desired modifications
    to their behaviour without once requiring a change to the core entity''s actual
    code.


    Each one of these patterns provides an insanely powerful way for us to remain
    compliant with the Open/Closed Principle, the second of the SOLID cannon, to which
    Part Four is dedicated. We''re just a few chapters away of discovering how.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Tell, Don’t Ask


    All of the principles cruising the dark waters of the software development ocean,
    it''s this one, the *Tell, Don''t Ask* principle that is perhaps the one least
    often seen amongst those wild currents. Indeed, if the principles that go into
    making up the SOLID cannon are the luxuriously appointed Caribbean cruise liners,
    then this particular one might be better considered an Ohio-class guided missile
    submarine, gliding silently through dark waters unseen and unheard. For the most
    part out of sight and out of mind.


    Rarely does it surface, but when it you get to appreciate the power in those sleek
    lines, even though it doesn''t quite manage to carry the full complement of one
    hundred and fifty Tomahawk missiles.


    Nevertheless, and despite the fact that this particular principle is so rarely
    out there in the wilds, it''s one of the more powerful ones that the developer
    with burgeoning PHP Brilliance can add to their mental toolbox.


    With all of the hype and bluster, you might be tempted to think that it''s a principle
    that comes loaded with mysteriously arcane and forbidden knowledge. That it is
    somehow imbued with otherworldly powers; an inter-dimensional plane-shifting beast
    to be tamed with runes and incantations cast safely from within the confines of
    a circle of salt poured upon the floor.


    With all due credit to those super smart people over *The Pragmatic Programmer*,
    the reality though is nothing like all at. Indeed, this rather aptly named principle
    is, in reality, super simple. Your code should be looking to tell objects to do
    things rather than asking for an element of the state and making a decision based
    on the values returned.


    With this mind, let''s start with a quotation from Alex Sharp, who in his book
    “Smalltalk by Example”, introduces the idea rather succinctly with just a few
    words.


    > Procedural code gets information then makes decisions. Object-oriented code
    tells objects to do things. – Alex Sharp'
  merge: -1
  img_proc: true
- pgno: 265
  md: "Tell, Don't Ask 251\n\nThe second sentence within that quotation bears the\
    \ crux of the matter as far as this principle is concerned. Many time-served web\
    \ application developer will have seen the action methods of controller classes\
    \ access the properties of model objects in order to make a logic decision based\
    \ upon the value of those properties or to actually perform some sort of operation\
    \ on that object property directly.\nto illustrate this, let's consider the following\
    \ code snippet\n\n```\nclass OrderController {\n    public function addOrderAction()\
    \ {\n        $userBalance = $userAccount->getBalance();\n        if ($userBalance\
    \ < $orderTotal) {\n            throw new InsufficientFundsException();\n    \
    \    }\n\n        $newBalance = $userBalance - $orderTotal;\n        $userAccount->setBalance($newBalance);\n\
    \    }\n}\n```\n\nAs usual, I'm relying on you somewhat to fill in the initialisation\
    \ gaps mentally so the code example doesn't become too cluttered. The real focus\
    \ of this example comes in two parts.\nThe first is a logic decision (or rather,\
    \ a validation test) to determine whether the user's balance is sufficient to\
    \ meet the cost of the order that is apparently being placed.\n\n```\n$userBalance\
    \ = $userAccount->getBalance();\nif ($userBalance < $orderTotal) {\n    throw\
    \ new InsufficientFundsException();\n}\n```\n\nHere, we have extracted the balance\
    \ value from the $userAccount object and compared that value to the $orderTotal\
    \ variable. In the event that the user's balance is less than the order total,\
    \ an InsufficientFundsException is thrown."
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The second consideration within this example is the clear and direct manipulation
    of an object''s properties outside the object itself.


    ```

    $newBalance = $userBalance - $orderTotal;

    userAccount->setBalance($newBalance);

    ```


    In this particular case, we are setting up a new variable called $newBalance as
    the result of subtracting $orderTotal from $userBalance, which we then proceed
    to pass back to the $userAccount object as the new balance value that it is meant
    to maintain.


    It only takes a moment of careful consideration to realise that this is a terribly
    flawed approach to programming. In both cases, we''re accessing a property value
    that really ought to remain private and personal to the owning object instance.
    In both cases, we''re flying in the face of what we ought to be understanding
    the notion of encapsulation to.


    The first case in our example is pretty bad but the second case is unforgivable.


    Even so, this is such an extraordinarily frequent occurrence in PHP code that
    you might be tempted to imagine that it''s actually the right way to do things.
    Take a moment to consider controller methods that you yourself have written in
    the past; how many times you have asked a model layer for data elements and then
    either massaged them into a structure for view file to use or even made some sort
    of logic decision on the values retrieved? I have certainly done this very thing
    hundreds of times in the past.


    If we are meant to be telling objects to do things, instead of asking them for
    details and performing the operations ourselves, then we should longer see such
    violations in our controllers.


    Why creating such violations be a bad thing? The answer to that lies with the
    fact that the code that we write into an enterprise application is rarely complete,
    finished and done. Those pesky little minions on the business team will most assuredly
    see to.


    Consequently, whenever we expose the finer details of an object''s state, as indeed
    we do twice in the example above, we are also tightly coupling our code to those
    same details of state.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# Tell, Don't Ask\n\nIn other words, we’re leaving ourselves vulnerable to\
    \ bug-like scenarios, which will certainly crop up should we modify the innards\
    \ of the UserAccount class at some point in the future.\n\nConsider the implications\
    \ that would become apparent should the business team decide that we should be\
    \ maintaining the user’s account balance as a penny value, rather than as pounds\
    \ or dollars? Would you rather modify just a single object or alternatively, have\
    \ to search the entire codebase for all of the locations where your code is extracting\
    \ and working with the balance value itself?\n\nThe correct answer is of course\
    \ that you would rather have to modify the innards of a single class. With in\
    \ this mind, and before we get much further, let’s fix up our earlier code so\
    \ that the two violation cases are dealt with appropriately. Doing so will allow\
    \ us to compare the broken code with the corrected version.\n\nSuch a fix might\
    \ look like this:\n\n```\nclass OrderController {\n    public function addOrderAction()\
    \ {\n        try {\n            $userAccount->payOrder($order);\n        } catch\
    \ (InsufficientFundsException e) {\n            // handle exception\n        }\n\
    \    }\n}\n```\n\nWhat has happened here? Well, first of all, we’ve eliminated\
    \ this piece of validation code from the addOrderAction() method. It never really\
    \ belonged in the first place. Why not? For the simple reason that it’s not a\
    \ controller’s job to have intimate knowledge of a model’s state, in this case,\
    \ the actual balance value that this UserAccount instance is responsible for maintaining.\
    \ Only the model object itself, the UserAccount instance, should know how it works\
    \ internally.\n\nThe second case, that of actually modifying the instance’s balance\
    \ value has also been removed from the controller."
