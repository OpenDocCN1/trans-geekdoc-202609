- pgno: 353
  md: "```\n<?php\ndeclare(strict_types=1);\n\nclass Calculator {\n    public function\
    \ addThe(float $sa, $float $b): float {\n        return $sa-$b;\n    }\n}\n```\n\
    \nHopefully, you'll recognise this class from the previous section of this appendix.\
    \ If you don't, where is your brain at? We were only just discussing this bit\
    \ a few pages ago. I suppose you could be forgiven if you happen to be reading\
    \ this in a coffee shop crewed by remarkably attractive baristas.\n\nAlright,\
    \ focus.\nHere we are again with a very simple object that allows us to add two\
    \ numbers together. As you can see, we're declaring for the float parameters types\
    \ of both $sa and $sb. In addition, we're now declaring for the float type by\
    \ appending to the method signature a class followed by the return type.\n\nAs\
    \ a result, the public interface of objects of this type has now become much more\
    \ expressive. Not only can we see what types of parameters the addThe method requires,\
    \ but also we can be confident that the method invocation will give us back a\
    \ float value as the return type. A string, not an array, but a float.\n\nThis\
    \ is a great boon for us. Since we should be striving for code that is bug-free\
    \ as it can be, this gives us the ability to express in code a fully documented\
    \ interface finally. The whole gamut of input parameter types are now catered\
    \ for with the addition of scalar type hinting, complemented by the ability to\
    \ hint the whole gamut of data types that a method will return.\n\nWhen our colleagues\
    \ and co-developers read the code we've written, the ability to readily discern\
    \ the type of thing that will come back from a particular method invocation has\
    \ enormous value.\n\nShould such a method fail to return the correct data type,\
    \ the failure will be isolated and localised to the method itself, which in turn\
    \ can lead to some very targeted bugfixing attention. The benefit of this becomes\
    \ even more apparent when you consider"
  merge: -1
  img_proc: true
- pgno: 354
  md: "the situation that we we face in PHP code today. When a method returns a value\
    \ of an unexpected type, the errors that crop up from this can appear pretty much\
    \ anywhere within the code base.\n\nWhat does this mean for our guarantees, our\
    \ contracts, our abstract class interfaces? Quite a lot as it happens. The key\
    \ factor in what we are about to consider is that the initial implementation of\
    \ return type hinting in PHP7 is of the invariant variety. This will have a direct\
    \ impact on our return type hinting in child classes that derive from an abstract\
    \ base class that employs return type hinting itself.\n\nWe'll consider this in\
    \ more detail shortly but in brief it means that the methods in specialised child\
    \ class implementations are unable to apply a return type hint that is different\
    \ to the method in the parent.\n\nThat statement deserves a little code to clarify\
    \ the point. If we return once to a much earlier example, that of the SportsCarFactory,\
    \ we can see how invariant return type hinting impacts upon our coding approach.\n\
    \n```\nabstract class CarFactory {\n    /**\n     * @return Car\n     */\n   \
    \ public function getCar(): Car {\n        // make a car\n        return new Car();\n\
    \    }\n}\n```\n\nHere the abstract parent CarFactory class is hinting for the\
    \ return type on the getCar() method. Specifically, it's declaring the return\
    \ type is Car.\n\nNow, having created a specialised child class of type SportsFactory,\
    \ we might reasonably think that since our actual return value will be an instance\
    \ of a SportsCar, we should be type hinting as such in the method declaration."
  merge: -1
  img_proc: true
- pgno: 355
  md: "# PHP7 341\n\n```\nclass SportsCarFactory extends CarFactory\n{\n    public\
    \ function getCar(): SportsCar\n    {\n        // make a sports car\n        return\
    \ new SportsCar();\n    }\n}\n```\n\nNo matter how much we want to instruct our\
    \ client code that calls this method is going returning a SportsCar instance,\
    \ to be able to do so would require PHP7 to support covariant type hinting.\n\n\
    Since PHP7 is getting the invariant flavour, the code above will not work and\
    \ the interpreter will quite tell us why with an error.\n\nSo let's honour the\
    \ invariance and fix our code\n\n```\nclass SportsCarFactory extends CarFactory\n\
    {\n    public function getCar(): Car\n    {\n        // make a sports car\n  \
    \      return new SportsCar();\n    }\n}\n```\n\nThe problem is now solved by\
    \ changing the return type to be exactly the same as declared in the parent class,\
    \ i.e. Car. Having done so, we are now satisfying the requirements of invariant\
    \ return type hinting. We might also start to feel a little itchy about the declaration\
    \ of this class's interface, given that it declares for a Car but actually returns\
    \ a SportsCar instance.\n\nThis itchiness only comes about when we consider the\
    \ SportsCar class in isolation. As long as we remember that it is actually the\
    \ parent class that is laying the rules, we can see that the invariant flavour\
    \ works massively in our favour. For the developers accepting the stance that\
    \ an abstract class provides the blue print for a new data type, the application\
    \ of invariant return type hinting puts them at a distinct advantage. It does\
    \ this by inadvertently beneficially locking down the"
  merge: -1
  img_proc: true
- pgno: 356
  md: 'characteristics of that data type. If every child class behaves at the interface
    level as the abstract parent demands, which is precisely what this type of hinting
    supports, then our application code would naturally remain type safe. The end
    result of achieving this us is a less bug fixing in the future, at the expense
    of more careful coding now. Remember that fewer bugs equals more pub time!


    For a lot of the developers who engage in inheritance abuse, this feature will
    most likely prove problematic for them. As such, I can’t see a great deal of widespread
    adoption going for this new language feature.


    For those that adopt return type hinting, there are a few ancillary considerations
    which need to be borne in mind.


    Unlike hinting for scalar input parameters, return hinting for scalar values does
    not require the declare(strict_types=1) at the top of the file. This apparent
    inconsistency between scalar type hinting for input parameters and scalar type
    hinting for return values is worrisome. In any case, I would propose that the
    developer performing any kind of type hinting for scalar values makes it an unswerving
    habit by always including the declare() statement at the top of the file.


    Why? Because it’s the safer assumption to take that a fellow developer is likely
    to infer from the presence of scalar return type hinting that scalar type hinting
    for input parameters has already been “switched”.


    Should we place the onus on our colleagues to verify that the declaration for
    strict types has been included in the file even though we don’t require it for
    our return type hinting? Or we better to mitigate against any unhappy accidents
    by providing the declaration anyway?


    The difference in behaviour between scalar type hinting for input parameters and
    scalar type hinting for return values is already confusing enough.


    Moving on, we should look at the implications for concrete interface implementations.
    If the application of return type hinting on abstract classes provides us with
    the ability to extend the rules applied to child classes, the good news is that
    applying return type hinting inside interface definitions helps us to achieve
    the same sort of rigorous guarantees inside the otherwise unrelated objects that
    implement such an interface.


    A contrived example should illustrate this perfectly.'
  merge: -1
  img_proc: true
- pgno: 357
  md: "# PHP7\n\n```\n```php\ndeclare(strict_types=1);\n\ninterface ReturnTypesInterface\n\
    {\n    public function getFloat(): float;\n    public function getString(): string;\n\
    \    public function getArray(): array;\n    public function getDatabaseAdapter():\
    \ PDO;\n}\n```\n```\n\nAs we can see quite clearly, the application of the return\
    \ type hinting at the interface level gives us the power to extend the coverage\
    \ of the guarantee that we provide quite significantly. Any objects that implement\
    \ such an interface, even though they may be perfectly unrelated to each other\
    \ in every other sense, would be required to honour the return type declarations\
    \ of such a guarantee. This is fantastic news for the maintenance of type safety\
    \ within our application code.\n\nTo illustrate this effect, let's consider the\
    \ following code\n\n```\n```php\ndeclare(strict_types=1);\n\ninterface FooGuarantee\n\
    {\n    public function getFoo(): Foo;\n}\n```\n```\n\nHere we have the interface\
    \ declaration that requires implementers to provide a getFoo() method. Those implementers\
    \ must also ensure that their version of this method includes the Foo return type\
    \ exactly as it is written. That is, the implemented method must also specify\
    \ `: Foo” in its method declaration.\n\nSince we are now required to provide the\
    \ return type hint, our implementations of this method will now also be required\
    \ to actually return a value that is either a specific instance of a Foo object\
    \ or an instance of a child class that extends the Foo parent."
  merge: -1
  img_proc: true
- pgno: 358
  md: "# PHP7\n\n```\nclass FooMaker implements FooGuarantee\n{\n    public function\
    \ getFoo(): Foo\n    {\n        return new Bar();\n    }\n}\n```\n\nOur FooMaker\
    \ class honours the terms of the FooGuarantee by providing identically specified\
    \ Foo() method, including the return type hint.\n\nHowever, you might note that\
    \ the actual method itself returns a Bar instance. This can only work when Bar\
    \ is a child class of Foo. If Bar doesn't include the required Foo class as one\
    \ of the parents in its inheritance hierarchy, PHP7 will happily choke and die.\
    \ Avoiding fatal errors, even catchable ones, is something that we wish to strive\
    \ for.\n\nWhilst we're on the topic of the interfaces, we need to consider whether\
    \ an interface itself can be used in the return type declaration. In other words,\
    \ are we able to guarantee that the value returned from a method call will honour\
    \ its own guarantee.\n\nA quick peek at an example should clear this right up.\n\
    \n```\ninterface Foo\n{\n    public function getArray(): array;\n}\n```\n\nHere's\
    \ our starting point. An interface called Foo that guarantees an array will be\
    \ returned from the method getArray().\n\n```\ninterface FooAble\n{\n    public\
    \ function doFoo(): Foo;\n}\n```\n\nAnd here we've specified that implementers\
    \ of the FooAble interface must provide a doFoo() method. So far, this is as expected."
  merge: -1
  img_proc: true
- pgno: 359
  md: 'However, the doFoo() method includes the return type hint of “: Foo”. What
    this means in practice is that the concrete implementations of the doFoo() method
    are required to return objects that subsequently implement the Foo interface.
    This in itself is hugely significant for PHP code.


    Conclusion? Return type hinting represents a very positive step towards achieving
    very robust, type safe application code. Thumbs up.'
