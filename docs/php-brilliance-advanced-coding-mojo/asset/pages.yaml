    methods that go managing the individual pieces of data that represent. The methods
    of our model classes would be entirely introspective. Setters and getters are
    naturally of this ilk but what about the methods that we can identify as being
    processors?


    What do I mean by processors?


    Processors are methods that do things. A method that validates user input is a
    processor. A method that triggers the sending of an email is a processor. In almost
    every case, unless a processor is specifically introspective, it can be moved
    out into a new object that''s designed to handle, encapsulate that process.


    For the registration procedure, ideally what we are looking for is a whole range
