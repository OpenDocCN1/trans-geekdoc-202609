  md: "# Finding Closure.\n\n# 196\n\nWhen used in this way, closures very positively\
    \ help us support the notion of lazy loading. For sure, this approach will cause\
    \ us to expend a fair bit of time in the early stages of setup and configuration\
    \ but the benefits to be gained will compensate for our early efforts admirably.\n\
    \nAssuming we're using a cogent autoloading strategy, creating closures to facilitate\
    \ the instantiation of objects only at the point that they are needed spares the\
    \ cost of wasted server resources and provides for maximum efficiency in handling\
    \ an end user's request and delivering the response.\n\nThis concept of lazy loading\
    \ objects on demand is a key feature of Dependency Injection Containers. We will\
    \ take a closer look at some of these during our exploration of dependency injection\
    \ later on this book.\n\nNevertheless, for our purposes let's take a brief look\
    \ at Pimple¹¹¹, the DI container from SensioLabs. Again, I'm going to borrow a\
    \ little code directly from the homepage so that we can pick it over in similar\
    \ fashion to the routing example provided by Slim above.\n\n```\n<?php\nuse Pimple\\\
    Container;\n\n$container = new Container();\n\n// define some services\n$container['session_storage']\
    \ = function ($c) {\n    return new SessionStorage('SESSION_ID');\n};\n\n$container['session']\
    \ = function ($c) {\n    return new Session($c['session_storage']);\n};\n\n//\
    \ get the session object\n$session = $container['session'];\n```\n\nIt's barely\
    \ worth noting except purely for the purpose of avoiding confusion, the Container\
    \ class in Pimple sports the ArrayAcess interface, which is why we're seeing closures\
    \ assigned with the array square bracket accessors.\n\n> ¹¹http://pimple.sensiolabs.org/"
