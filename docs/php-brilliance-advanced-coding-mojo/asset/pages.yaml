    \ would not get. This would obviously entail hunting through the entire application\
    \ for conditional trees such as this, just to add another elseif case for the\
    \ new user type.\n\nWhen our code looks like this, our application is almost certainly\
    \ going to be buggy. If we were very careful and meticulous coders, we could certainly\
    \ ensure that it still works though. Logically, it may sound but it doesn't take\
    \ into account that we're human and we can be prone to missing things.\n\nIn reality,\
    \ all that this particular piece of code is looking for is a way to get hold of\
    \ an email address. The very thing that this sendMail method needs a guarantee\
    \ that the incoming $recipient parameter can provide it.\n\n```\npublic function\
    \ sendEmail( Emailable $recipient )\n{\n  $toAddress = $recipient->getEmail();\n\
    \  ...\n}\n```\n\nAs, long as we've coded up an interface called Emailable the\
    \ getAddress() method, we can send any old object to the sendEmail() method and\
    \ it'll work, just long as it's wearing the appropriate badge. No more hunting\
    \ through the code base to look for potential problems every time we introduce\
    \ a new class of a particular type, and more importantly, more bugs cropping up\
    \ because we accidentally missed one or more locations where we should have incorporated\
    \ those changes. The end result is much cleaner, more readable code.\n\nIn short\
