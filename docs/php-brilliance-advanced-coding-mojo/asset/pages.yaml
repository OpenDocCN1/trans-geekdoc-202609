    \n# Another \"use\" case\n\nOne distinct advantage that anonymous functions have\
    \ over their more familiar brethren is the ability to import variables from the\
    \ parent scope at the point that they are defined. This aspect is another key\
    \ feature to pay close attention to.\n\nNormally, variables inside a function\
    \ only live as long as it takes for the function to execute. By default, the values\
    \ that are supplied as parameters to a function are copies of the values that\
    \ were available at the point where the function was invoked. The exceptions being\
    \ variables passed by reference with the ampersand prefix, and objects, which\
    \ are passed by reference anyway.\n\nIn the bad old days, assigning a variable\
    \ that was declared outside of the function's internal scope meant using the global\
    \ keyword or accessing the $GLOBALS array. Doing so would make variable available\
    \ inside the function.\n\n```\n<?php\n$driver = \"mysql\";\n\nfunction showDriver()\
    \ {\n    global $driver;\n\n    echo \"Driver is set to: {$driver}\";\n}\n\nshowDriver();\n\
    // Output: \"Driver is set to: mysql\"\n```\n\nThis is of course horrendous. Leaving\
    \ variables, potentially crucially important ones, lying around in the global\
    \ namespace is a recipe for disaster since they offer"
