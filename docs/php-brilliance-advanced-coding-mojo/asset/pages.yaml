- pgno: 172
  md: "Putting a name on our spaces.\n\n```\n<?php\nnamespace Vangard\\MyApplication\\\
    Controller;\n\nuse Vangard\\MyApplication\\Service\\BlogService;\nuse Vangard\\\
    MyApplication\\Controller\\ControllerInterface;\n```\n\n```\nclass PageController\
    \ implements ControllerInterface\n{\n}\n```\n\nThe only thing that has changed\
    \ there is that I’ve inserted “MyApplication” into the namespace declarations.\
    \ Should we move all of our code into a new “MyApplication” folder? Well, could\
