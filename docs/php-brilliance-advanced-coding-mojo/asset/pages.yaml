  md: "Finding Closure.\n\nBut only until the credit controllers in the finance department\
    \ make a request to have the same information emailed to them on a monthly basis.\
    \ Head office wants to be able to grab this data as a json payload from an API\
    \ call.\n\nConsequently, it would make much more sense for the model layer to\
    \ perform the data preparation and return a single usable unit that contains all\
    \ of the relevant information. The question is, does this requirement warrant\
    \ the creation of a whole new model object to carry only data to a rendering process?\n\
    \nThat's not necessarily a question that we can answer in these pages. However,\
    \ it doesn't prevent us from exploring some possible alternatives.\n\nThe first\
    \ alternative is to go ahead and build a specific CustomerOrdersInvoices model\
