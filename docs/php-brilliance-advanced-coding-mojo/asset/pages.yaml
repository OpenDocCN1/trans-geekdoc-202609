- pgno: 276
  md: 'Much has been written about when an object may be considered newborn and indeed,
    the arguments presented do hold true for software intended to run on the desktop
    in an offline world.


    Some developers may very well argue that it''s perfectly possible to create a
    large and complex, yet robust and secure application that still invokes new on
    the same classes hundreds of times throughout the code base. Such an application
    may be heralded as the singular proof that our new found fear is indeed irrational.


    # But


    Such an approach carries with it enormous risks. Even if the codebase right now
    is secure and stable, any future changes to the constructor methods of any of
    the classes would entail a significant amount of work to implement all of the
    necessary changes.


    Do bear in mind that our world isn''t the desktop oriented offline one. Our software
    isn''t delivered as a finished product on an installable CD or DVD ROM.


    Instead we work on delivering tagged releases through an iterative cycle that
    follows lean or agile methodologies, coding up individual stories to be added
