- pgno: 55
  md: "# Encapsulating our ideas.\n\nelsewhere. So, what do we do? Naturally, we create\
    \ a PhoneNumberValidator class so at least the validation logic is reusable in\
    \ any number of different situations. The problem we're then faced with is how\
    \ do we get an instance of a PhoneNumberValidator into the User object in the\
    \ first place, now that we're no longer using those handy validators as constructor\
    \ params?\n\nOne thing that we do not is this:\n\n```\nprivate function isValid(array\
    \ $userData)\n{\n    $pnValidator = new PhoneNumberValidator($userData['mobileNumber']);\n\
    }\n```\n\nThat single line of code above leads to something known as tight coupling;\
    \ something that we want to avoid. What we're saying here is, with this line in\
    \ place, the class now depends on the PhoneNumberValidator class. This validator\
    \ class is, in all likelihood, located in a separate file. (If it's not, you've\
    \ definitely got other problems!) This one line ties the two classes together\
    \ in a way that the User class can't exist in an application without the validator.\
    \ Of course, you could argue that if we have a User class that needs access to\
    \ a validated phone number, then both classes are likely to exist within the same\
    \ application anyway.\n\nThe situation that we've created is actually a bit worse\
    \ than that though. In the User class, we've not only declared a hard dependency\
    \ on the PhoneNumber-Validator class. We have also coded in that the validator\
    \ is instantiated by passing one of the $userData array values to the validator's\
    \ constructor.\n\nThis is one of the most common pitfalls that both junior and\
    \ mid-level developers will succumb to. If the signature of constructor method\
    \ ever changes, then we have at least one location where our application is broken.\
    \ Not only that it's broken in that sweet old classic way that leads to the expression\
    \ “Well, I fixed this bug here, but now that it's broken over there.\"\n\n“Aha!”\
    \ I hear you exclamation, “But in such a situation, where one is modifying the\
    \ constructor of a particular class, I would naturally grep the codebase and fix\
    \ every location in the code base where objects of that class are instantiated.”"
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Encapsulating our ideas.\n\nWhich is fine of course. At least until we reach\
    \ that point where a colleague starts instantiating objects from class names held\
    \ in variables. You know the thing that I mean: Dynamic class resolution.\n\n\
    ```\n// Scary code\n$className = $propertyName 'Validator';\n$validator = new\
    \ $className($propertyValue);\nreturn $validator;\n```\n\nThe only places where\
    \ things of this sort be happening inside factories, abstract or otherwise, and\
    \ where the object returned conforms to a clear and well understood interface.\
    \ If it happens out in the wilds, the code that forms the application's normal\
    \ process flow, then you're, well, bugged to put it bluntly. The game over has\
    \ knelt, it's time to start prompting the rewrite.\n\nInstead of trying to wiggle\
    \ out of it, let's say we're not going to do it. The concepts of loose coupling\
    \ and dependency injection will be discussed at length later in this book. So\
    \ too will the idea of developing an allergy to using the new keyword. For now\
    \ though, I'd just like you to take it as read that instantiating validator instances\
    \ inside our User class is a strictly-no scenario. I say take it as read', if\
    \ this is already a second or more reading of this book, you'll already know why\
    \ this should be so.\n\nSee? I told you. Polar bears!\n\nSo how do we get the\
    \ validator into the User class then? One answer, certainly, to pass it in the\
    \ constructor as well. Our next refactor does exactly this.\n\n```\npublic function\
    \ __construct(\n    array $userData,\n    UserDataValidator $udv\n) {\n    if\
    \ (!$this->isValid($userData)) {\n        throw new Exception(\n            $udv->getErrorMessage(),\n\
    \            $udv->getErrorCode()\n        );\n    }\n    $this->userData = $userData;\n\
    }\n```"
