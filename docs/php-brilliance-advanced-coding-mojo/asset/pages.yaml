- pgno: 147
  md: "More pub time through interfaces.\n\n> You might be tempted to think that I've\
    \ forgotten that this isn't a beginner's book but worry no, I'm only including\
    \ this here to provide a common base from which we can expand our understanding.\n\
    \nWhenever we create an interface in this manner, we are laying down a particular\
    \ specification that states the methods declared within it will appear in any\
    \ class that implements the interface. This is frequently referred to as a contract\
    \ in many places, but I prefer to call it a guarantee. It's a matter of personal\
    \ preference for me: I feel that the word “guarantee” provides a stronger declaration\
    \ of intent.\n\nOut there in the real world, contracts rarely make the news unless\
    \ they've been broken and that's not a connotation that we want to leak into our\
    \ understanding of interfaces. For our purposes here, we need to consider our\
    \ interfaces as rock solid, cast iron, impenetrable, unbreakable guarantees. Nevertheless,\
    \ if the word contract is what you feel more comfortable with, by all means substitute\
    \ one for the other in the text that follows.\n\nWhenever we code up an object\
    \ that implements an interface, we are effectively sticking a label, shiny, day-glo\
    \ orange badge on the object that says “Hey buddy, you don't need to know who\
    \ or what I am, I'm carrying this guarantee see? You don't need my family history\
    \ nor my inside leg measurements. You only need this guarantee. With it you can\
    \ rest assured that I can do this, and the other.\n\nWhatever “this, and the other”\
    \ pertains is up to you as the developer to declare your interfaces. If you need\
    \ to specify that an object guarantees to accept an array of data and transform\
    \ it into something else, you might only need a very simple interface declaration\
    \ as this one:\n\n```\ninterface ArrayTransformer\n{\n    public function getTransformed(array\
    \ $data = []);\n}\n```\n\nThat's a pretty simple guarantee right there, a guarantee\
    \ that states any object wearing the ArrayTransformer badge (maybe this one is\
    \ neon yellow?) will provide a method called getTransformed(), which in turn accepts\
    \ an array of data.\n\nWhenever the rest of our application code sees an object\
    \ wearing this badge, it knows that the object has a public method called getTransformed()\
    \ and that method"
