- pgno: 186
  md: "# Expressing good traits.\n\n```\n<?php\nclass PageController implements ControllerInterface,\
    \ Loggable, SmsEnabled\n{\n    use LoggingTrait, SmsTrait;\n}\n```\n\nWe know\
    \ this is going to fail, even if we've specified our trait specific interfaces\
    \ correctly. The problem remains here that with both traits specifying aAdapter()\
    \ method, the PHP interpreter simply can't tell which one it's supposed to import.\
    \ Both are independently suitable candidates side by side, the two traits equal\
    \ precedence. Consequently, we will be required to employ some rather dubious\
    \ code in order to indicate which one to use.\n\n```\n<?php\nclass PageController\
    \ implements ControllerInterface, Loggable, SmsEnabled\n{\n    use LoggingTrait,\
    \ SmsTrait {\n        LoggingTrait::getAdapter instead SmsTrait::getAdapter;\n\
    \    }\n}\n```\n\nWhilst satisfies the interpreter's requirement by explicitly\
    \ instructing it which of the two conflicting methods to import, there's clearly\
    \ a problem going on here. It should be a reasonably safe assumption that each\
    \ trait is reliant upon its own version of the getAdapter() method, yet the modifications\
    \ here are telling the interpreter to favour the version in the LoggingTrait insteadof\
    \ the version in the SmsTrait.\n\nIf you can't hear the alarm bells ringing at\
    \ this point, it might be time to go and clean out your ears. I think it's a reasonably\
    \ safe assumption that any appearance of the insteadof keyword in code is much\
    \ more an indicator of a flaw in our design more than anything else. insteadof\
    \ feels \"kludgey\", to be blunt. Whenever"
