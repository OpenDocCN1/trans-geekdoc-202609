- pgno: 165
  md: "Putting a name on our spaces.\n\n```\n<?php\nuse Symfony\\Component\\Console\\\
    Application;\n...\nmyApp = new Application();\n```\n\nThere. Clarity has returned\
    \ to our coding once more. The intent of the line $myApp = new Application();\
    \ is clear without requiring us to mentally parse the namespace path. This is\
    \ because the use keyword imports that definition for us.\n\nHowever, while we've\
    \ solved the long class name problem, we've reintroduced the name collision problem\
    \ again. Using the word “Application” as a class name isn't unique to the Symfony\
    \ Console component, just like User it's a pretty popular choice. Indeed, there's\
    \ every possibility that we might want to use the very same word ourselves.\n\n\
    ```\n<?php\nnamespace CompanyName\\AppName;\n\nuse Symfony\\Component\\Console\\\
    Application;\n\nclass Application {\n    private $app;\n\n    public function\
    \ __construct(Application $app) {\n        $this->app = $app;\n    }\n}\nmyApp\
    \ = new Application(new Application());\n```\n\nEven if PHP allowed you to do\
    \ this, you would have a devil of a job trying to decipher what was supposed to\
    \ be going on in there. All sense of clarity has been lost again because you could\
    \ only assume that the author's intent here was to instantiate an instance of\
    \ his own Application class by passing an instance of the Symfony"
