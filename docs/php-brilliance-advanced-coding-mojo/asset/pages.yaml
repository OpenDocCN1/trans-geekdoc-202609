- pgno: 194
  md: "# Finding Closure.\n\nabsolutely zero protection for the values that they are\
    \ holding on to and may be changed on a whim. When an application runs to thousands\
    \ of lines, attempting to track down the one that inadvertently changes the value\
    \ of a global can lead to a significant loss of valuable pub time.\n\nWhich brings\
    \ us back to the use keyword again. We've already seen how the definition of a\
    \ class, interface, function or trait might imported into our current namespace\
    \ through the application of the use keyword at the top of the file.\n\nWe've\
    \ also seen how the actual contents of a particular trait can be imported into\
    \ a class’ definition through the application of the use keyword within the consuming\
    \ class.\n\nNow, we also get to apply the use keyword to functions as well, which\
    \ adds a whole new dimension to the usability (!) of our anonymous functions.\n\
    \nThe basic syntax looks like this:\n\n```\n<?php\n$config = array(\n    \"driver\"\
    \ => \"mysql\",\n    \"dan\" => \"mysql:host=localhost;port=3306\",\n    \"user\"\
    \ => \"root\",\n    \"pass\" => \"secret\"\n);\n\n$getConfig = function() use\
    \ ($config) {\n    return $config;\n}\n```\n\nLet’s begin the process of examination\
    \ by looking at the use clause itself.\n\nThis clause allows us to import variables\
    \ into the function as they exist within the function’s parent scope. This is\
    \ important. Having declared the config array here in the same scope as the function\
    \ itself, it means that this array can be imported into the function. Once it’s\
    \ in there, you can then proceed to send the function to any place it’s needed,\
    \ simply by passing the $getConfig variable. With a statically declared function\
    \ residing in another file, this is a great deal harder to achieve."
  merge: -1
  img_proc: true
- pgno: 195
  md: "Finding Closure.\n\nWhat we have there then is a powerful way of transporting\
    \ other variables, mostly objects, to other parts of your application and helps\
    \ you to avoid situations where you might otherwise resort to accessing global\
    \ variables or reaching out to, to say, a registry singleton.\n\nIt works both\
    \ ways though.\n\nRather than simply parcelling up a variable by importing from\
    \ the parent scope and then sending it somewhere else, we can use this function()\
    \ use() structure to have our parent scope variables affected by remote operations.\n\
    \nWhat do I mean by this?\n\nLet's look another example.\n\n```\nclass MessageQueue\n\
    {\n    private $messages = [];\n\n    public function addMessage($message)\n \
    \   {\n        $this->messages[] = $message;\n    }\n\n    public function getMessages()\n\
    \    {\n        return $this->messages;\n    }\n}\n```\n\nHere we've defined a\
    \ really rather simple class that will allow us to collect messages passed in\
    \ calls to the addMessage() method.\n\n```\n$mq = new MessageQueue();\n```\n\n\
    ```\n$queueMessage = function($message) use ($mq) {\n    $mq->addMessage($message);\n\
    }\n```\n\nIn this fragment of code, we've instantiated a new MessageQueue object,\
    \ and by using the use construct, we've imported that into the anonymous function,\
    \ which is subsequently assigned to the $queueMessage variable."
  merge: -1
  img_proc: true
- pgno: 196
  md: "# Finding Closure.\n\nNow, whenever we pass this variable around, the client\
    \ code that receives it will be able to add messages to our MessageQueue instance,\
    \ simply by invoking the function with an appropriate message parameter.\n\n```\n\
    $queueMessage->addMessage('Here comes the $_POST array');\n```\n\n```\narray_walk($_POST,\
    \ function($value, $key) use ($queueMessage) {\n    $message = \"POST element\
    \ {$key} set to {$value}\";\n    $queueMessage->addMessage($message);\n};\n```\n\
    \nRather cheekily I jumped ahead of myself and included another anonymous function\
    \ in there as a callback to an array_walk() over a $_POST array. Nevertheless,\
    \ I hope you can see how we've managed to somehow encapsulate a connection back\
    \ to the original MessageQueue instance by importing it into an anonymous function\
    \ with the use keyword.\n\n> Just like function parameters, variables passed via\
    \ the use() clause are by default copied in. For a function to affect the original\
    \ variable, it needs to be passed in reference. For objects, that happens automatically.\
    \ For scalars and arrays, you'll need to remember the ampersand (&) prefix.\n\n\
    As we can see, this can be quite a powerful technique for having a “central” object\
    \ affected by various disparate sub-systems simply by passing an anonymous function\
    \ to those very sub-systems."
  merge: -1
  img_proc: true
- pgno: 197
  md: "Finding Closure.\n\nOf course, for simple one-liners such as this one, we would\
    \ be much more likely to pass the original object itself. However, when you mesh\
    \ this technique with the idea that such a function can be treated as a macro,\
    \ that is a repeatable series of logical steps, then the value of these things\
    \ should become more apparent.\n\nAt the appropriate time, each sub-system can\
    \ invoke macro with any relevant, locally held parameters.\n\nSpeaking of which...\n\
    \n# Anonymous functions are callable.\n\nAll of PHP functions, including userland\
    \ ones created by developers, are callable naturally. We would find others struggling\
    \ to do anything useful with the language if this wasn't the case. However,\"\
    Callback-able functions\" makes for an awkward sub-heading and doesn't entirely\
    \ convey the right meaning.\n\nHowever, I made a reference earlier to using an\
    \ anonymous function as a callback. Let's just a moment to go over this idea.\n\
    \n```\n<?php\n$doubler = function(&$number) {\n  $number *= 2;\n};\n```\n\n```\n\
    $values = array(1,2,3,4,5);\n\narray_walk($values, $doubler);\n\nprint_r($values);\n\
    ```\n\n```\n/* Output:\nArray\n(\n    [0] => 2\n    [1] => 4\n    [2] => 6\n \
    \   [3] => 8\n    [4] => 10\n*/\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "# Finding Closure.\n\nThis is painfully simple but it will serve to illustrate\
    \ the idea perfectly well. The anonymous function assigned to the $doubler variable\
    \ is short and to the point. As a “macro”, it doesn’t do a great deal. Nevertheless,\
    \ we can see that it was invoked\n\nfive times, once for each element of the input\
    \ $values array and its effect is visible in the array after the array_walk()\
    \ function has completed.\n\nThere’s no reason at all why we couldn’t encapsulate\
    \ a much more complex process into the function and that to array_walk() instead.\n\
    \nNevertheless, we’ve gone for a very simple one in this example. Given that the\
    \ portability aspect is irrelevant here, we can dispense with the variable assignment\
    \ and simply write the anonymous function directly into the location where it’s\
    \ needed.\n\nVery much like this:\n\n```\n<?php\n$values = array(1,2,3,4,5);\n\
    \narray_walk($values, function(&$number) {\n    $number *= 2;\n});\n\nprint_r($values);\n\
    \n/* Output:\nArray(\n    [0] => 2\n    [1] => 4\n    [2] => 6\n    [3] => 8\n\
    \    [4] => 10\n*/\n```\n\nBonus! The function only exists for as long as it’s\
    \ needed and is disposed of shortly after the array has been “walked”.\n\nThis\
    \ though is the point: Whenever you have an iterative process that requires a\
    \ callback to each iteration, an anonymous function will be one of those candidates\
    \ that fits the bill. It just needs to be callable."
  merge: -1
  img_proc: true
- pgno: 199
  md: "Procedurally, this means that a test with the is_callable() function returns\
    \ true,\nwhereas in an object oriented sense it should satisfy the requirements\
    \ of a “Callable\"\ntype hint. We can satisfy both of these conditions with a\
    \ relatively short piece of\ncode to illustrate these facts.\n\n```\nphp\n$myFunc\
    \ = function() {\n    echo \"Hey Joe!\";\n}\n\nvar_dump(is_callable($myFunc));\n\
    // Output: bool(true)\n\n// We can typehint for \"Callable\" too\nfunction isCallable(Callable\
    \ $func) {\n    echo \"Yes, it passes the typehint test\";\n}\n\nisCallable($myFunc);\n\
    // Output: \"Yes, it passes the typehint test\";\n```\n\nSo far then, we've seen\
    \ a few of the benefits that anonymous functions make available\nto us as developers.\n\
    \nWith the ability to assign them to variables, we are able to pass them around\
    \ as our\ndecode dictates. We can create them precisely where they are needed,\
    \ rather than in\na relatively “distant\" file. We can import variables local\
    \ to the function where it is\noriginally defined and then make those variables\
    \ available to wherever the function\nends up.\n\nSince they're also disposable,\
    \ we can destroy them once we've actually finished using\nthem. The same cannot\
    \ be said for their named cousins. After the relevant file has been\nrequired,\
    \ those named function definitions, all of them, are held in memory for the\n\
    duration of the request whether they are actually needed or not.\n\nWe have also\
    \ seen how they are callable and as such, can be used in any location\nwhere we\
    \ are expected to provide a callback. They satisfy the requirements of being\n\
    typehinted as “Callable” and return true from the is_callable() function."
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Finding Closure.


    186


    One thing that we haven''t really considered yet is: Why on earth are they included
    in a part of the book entitled "Extending your object oriented brain". The reason
    isn''t actually "Because they''re actually objects", even though that part is
    true.


    # Anonymous functions are objects


    Whenever you create an anonymous function and assign it to a variable (the portable
    characteristic), PHP turns it into an object for you. Not a plain vanilla stdClass
    type object. Rather, an instance of the Closure class.


    Now we''ve pulled this thing back in line with the title of the chapter itself.


    The Closure class is specific to these particular beasties. You cannot create
    your own instances in code by writing a statement as $c = new Closure(); Nor can
    you derive classes from it since the class is marked final internally and therefore
    cannot be extended.


    Not that you would actually want to do anything like this. If you really wanted
    to create your own callable object, you''re perfectly at liberty to do so. When
    closures originally made their appearance in PHP, they brought with them a new
    magic method: __invoke(). We''ll look at how this is relevant shortly, but first
    of all let''s concentrate on the structure of the closure class rather than jumping
    ahead soon.


    Whenever the interpreter encounters an anonymous function being assigned to a
    variable, it will turn into a Closure instance. In doing so, your "function-that-is-now-an-object"
    picks up an interesting method along the way: bindTo().


    The bindTo() method gives you the extraordinary power to brutally savage and molest
    the private properties of other objects.


    I threw that in just in case you were going to sleep on me. It''s true, nonetheless.
    The bindTo() method allows you to create a clone of the current closure, but with
    one its active bound to another object.


    The effect of this is that if the closure in question contains a reference to
    $this, the scope that $this refers to can be changed dynamically. As a result,
    $this can be made to reference the internal scope of a completely different object.


    Look.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "# Finding Closure.\n\n```\n<?php\nclass SecretValue\n{\n    private $secret\
    \ = 'nobody-knows';\n}\n\n$shhh = new SecretValue();\n```\n\nOur exceptionally\
    \ limited interface here ought to protecting the value of the $secret property\
    \ quite adequately. In other words, there’s no way to get to it from the outside.\
    \ Without the appropriate methods being put into place, there should be no way\
    \ to read from or write to that property.\n\nHowever, by the power of the bindTo()\
    \ method, we can pop it out simply by binding a closure containing a reference\
    \ to $this. Like, here, this.\n\n```\n$closure = function() {\n    return $this->secret;\n\
    }\n```\n\nSo far, nothing startling. Other than the reference to $this inside\
    \ the function, it’s very much like the examples that we’ve examining previous.\
    \ But when you get to the binding part, it’s a different matter.\n\n```\n$boundClosure\
    \ = $closure->bindTo($shhh, $shhh);\necho $boundClosure(); // Output: \"nobody-knows\"\
    \n```\n\nThe bindTo() method accepts two parameters. The first parameter is the\
    \ object that the closure should be bound to. The second parameter is optional\
    \ and when provided, identifies the new scope inside of which the closure should\
    \ operate. When we assign the same object as the new scope parameter, we are effectively\
    \ attaching the closure to the object as if it were a method of that object.\n\
    \nThis is despite the fact that the $boundClosure is created outside the class\
    \ itself.\n\nDoes this make sense? It might help to flip the idea on its head\
    \ a little, although I should point out that what follows next is technically\
    \ incorrect but if it helps encourage understanding, then we can be excused. Maybe."
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Finding Closure.\n\nIn any case, let this fallacious statement out of the\
    \ way then.\n\nOnce we've bound the closure to an object with the optional scope\
    \ parameter included, the content of the closure - that is, the logic we've provided\
    \ - behaves like an unnamed method *inside* the target object itself. We can trigger\
    \ unnamed method by invoking the closure from the outside.\n\nThat trigger was\
    \ pulled on the last line of the previous code block, `echo bound-Closure();`\
    \ is how we caused the function's internal logic (effectively just return `$this->secret;`)\
    \ to pop that theoretically inaccessible private property right out for\n\nOf\
    \ course, it can work the other way too, which is why I introduced this section\
    \ with the notion of being able to brutally savage private properties.\n\n```\n\
    $closure = function($newValue) {\n  $this->secret = $newValue;\n}\n```\n\n```\n\
    $boundClosure = $closure->bindTo($shhh, $shhh);\n```\n\n```\n$boundClosure('Not\
    \ very secret afterall!');');\n```\n\nWriting new values to an object's private\
    \ properties is terribly easy to achieve with these things. On the one hand, it's\
    \ a rather natty little technique for extracting the data out of objects without\
    \ having to clutter their interface in order to do so. On the other hand, it's\
    \ a rather sneaky technique and terribly difficult to debug. As a result, it's\
    \ not an activity that we want to engage in without having a bloody good reason\
    \ to do so. A reason compelling that it makes the ensuing loss of valuable pub\
    \ time objects worthwhile.\n\n# Objects are callable too.\n\nAt least, they can\
    \ be. I made a brief mention earlier on in this chapter that you can create your\
    \ own callable objects. This is true. The new magic method, `__invoke()` that\
    \ arrived with Closures can also be implemented in a class of yours devising too."
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Finding Closure.


    When you write up the code for this particular method in one of your classes,
    you make the objects of this type callable. As a result, wherever you can employ
    a closure as a callback, you can substitute this for an object instance that also
    supports __invoke() method.


    Whether you take this approach is up to you of course. If a closure on it''s own
    doesn''t cut it you, you can pass your own object instance to something like the
    array_walk() function.


    ```

    $php

    callback = new MegaArrayTransformer();

    array_walk($_POST, $callback);

    ```


    Although you''d probably still be better served by providing a closure that bridges
    the array_walk process with the MegaArrayTransformer anyway.


    # Building your objects


    Nevertheless, the notion of seeding existing objects with new, unnamed, methods
    can be quite an attractive proposition. Albeit in very restricted circumstances,
    the technique we''re about to look at has only the one vaguely justifiable use
    case that I know of. If you do know of more, I''d be very keen to hear of them.


    In an attempt to honour the correct definition of the Model-View-Controller pattern
    (MVC), it''s the controller''s job to ask for a model, which it then presents
    to the view to allow the view to update itself. The stop-start nature of http
    protocol makes it difficult to follow the pattern correctly, which has resulted
    in the view layer being “the bit that builds an html page for sending to the browser”.
    (Ignoring Ajax for the moment)


    Nevertheless, we still have the opportunity to honour the first part of the process.
    For a GET request, your controller''s going to go to the model layer (possibly
    via a service) and retrieve the model it needs to pass to the view.


    In the event that our view is going to display data from multiple sources, this
    presents us with a bit of an issue.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Finding Closure.\n\nIt isn’t the controller’s job to retrieve that data from\
    \ different model sources and mangle it together into a unit that the view can\
    \ access. In spite of this, there are literally hundreds of examples presented\
    \ across the web where this practice is shown as the correct way: the action method\
    \ in the controller collects the data and then prepares it for the view.\n\nWe\
    \ can illustrate this with a not-too-uncommon example.\n\nLet’s say that we needed\
    \ a page to display customer details, along with any orders that they had placed\
    \ and the corresponding status of the invoices attached to those orders. Doing\
    \ the wrong way might look like this.\n\n```\n// In the controller\n```\n\n```\n\
    $customerDetails = $this->modelService->fetch('Customers', $customerId);\norderDetails\
    \ = $this->modelService->fetch('Orders', $customerId);\n\n$orderIds = [];\nforeach\
    \ ($orderDetails as $order) {\n  $orderIds[] = $order->OrderId();\n}\n\ninvoiceDetails\
    \ = $this->modelService->fetch('Invoices', $orderIds);\n\n$this->view->render(array(\n\
    \  'customer' => $customerDetails,\n  'orders' => $orderDetails,\n  'invoices'\
    \ => $invoiceDetails\n));\n```\n\nI’m not saying for one moment that everybody\
    \ does it this way but I have certainly seen this approach taken on a regular\
    \ basis. The problem with having a controller method mangle model data into a\
    \ view consumable unit like this is that we are inevitably setting ourselves up\
    \ for code duplication. It’s a DRY violation waiting.\n\nWhy?\n\nOur assumption\
    \ here is that particular controller method will be the only way to trigger the\
    \ rendering of this data. If this is truly the case, now and forever always, then\
    \ we can get away with it."
