- pgno: 319
  md: '# Brain Check


    Welcome to the very last chapter of Part Three.

    This is the part where we test ourselves on the material that we''ve covered in
    this part of the book by asking ourselves, “Could I give a lightning talk on each
    one of these?”

    It’s a checklist and a guide for highlighting areas of further reading.


    # Poltergeist


    The Poltergeist is an anti-pattern used to describe a short-lived object that
    bears no state of its own and is used to make things happen to other objects or
    other parts of the system. An object whose sole purpose is to configure another
    object is a prime example of a poltergeist.


    # Facade Pattern


    Facades provide a simplified interface to a more complex subsystem. A distinguishing
    feature that separates facades from poltergeists is that a facade should be provided
    with access to the components that it is intended to interact with, whereas a
    poltergeist reaches out and helps itself.


    # Favouring interfaces over implementations


    A mechanism for achieving loose-coupling by working with the notion of what a
    collaborator does, rather than with what a collaborator is. In this way, a consumer
    may be provided with a collaborator that supports a particular interface and therefore
    a guarantee of what the collaborator is capable of without the consumer ever knowing
    the actual concrete type of the collaborator. This allows us to switch different
    implementations in and without breaking the application.


    # Favouring composition over inheritance


    Another mechanism for achieving loose-coupling by allowing code reuse through
    encapsulating the reusable code into its own discrete object. Whereas'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Brain Check


    inheritance hardwires a particular dependency to the parent class, composition
    allows a dependency to be injected (and therefore switched at run time).


    # The State Pattern


    Is a particular implementation of composition that allows an object''s state (and
    therefore behaviour) to be modified at run time by allowing objects representative
    of the desired behaviour to be injected into an object whose behaviour needs to
    be changed.


    # The Decorator Pattern


    Is another way to achieve code reuse through composition, allowing the target
    object to be wrapped in such a way that one or more methods of the target object
    may be intercepted by the decorator to provide a different but desirable outcome.
    The decorator should present the same interface as the decorated object so that
    interactions with collaborators continue as expected.


    # The Strategy Pattern


    Akin to the State pattern, the Strategy pattern allows an object to receive custom
    logic or algorithms based on environmental conditions. Where the State pattern
    represents changeable, but internally focussed behaviour, the Strategy pattern
    allows for changeable external behaviour when dealing with collaborators.


    # Tell, Don''t Ask


    An object should not be queried for elements of its internal state in order to
    make logical decisions based on the values found there. Instead, an object should
    be told to perform a particular operation itself, providing any necessary parameters
    in order to achieve this goal. Extracting elements of state from an object in
    order to inspect and potentially make decisions on them leads to a form of tight-coupling
    as the code inspecting will rely on the internal structure of another object;
    knowledge that it should not have.


    # Instantiationophobia


    By applying a rule of "one new per class", developers know that there will be
    only one other location to inspect when coding changes affect the way that an
    object instance is created. This principle also supports loose-coupling by eliminating
    the hard coded dependencies created through the use of the new keyword at unspecified
    locations in the codebase.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# The Courier anti-pattern


    The Courier anti-pattern crops up whenever an object receives a dependency that
    it doesn’t use itself. Instead, that dependency was passed to it in order to subsequently
    pass it on to another of the object’s collaborators. This presents a form of tight
    coupling in that the intermediary (or courier) implied knowledge of what the final
    recipient needs in order to function. If those needs change, then it follows that
    code changes will be required in the courier also, adding fragility to the codebase.


    # The Law of Demeter


    This isn’t a law is perhaps the most effective principle when it comes promoting
    loose-coupling. Also known as the principle of least knowledge, it becomes violated
    whenever code exhibits awareness of another object’s internal structure. All objects
    should only be aware of the public interfaces of the other objects that it directly
    collaborates with. In this way breakages may be avoided when the internal implementation
    of other objects is changed but the public interface remains the same.


    # The Testing Pyramid


    An illustrative concept that encourages us to have a broad base of unit testing
    rising to a narrow pinnacle of functional and manual testing, with layers of other
    types of testing in between; e.g., integration testing. Anything with a broad
    base is generally more stable than its narrow based brethren. However, many software
    projects take the inverse approach and focus on testing the user interface first,
    leading to something known as the testing ice-cream cone. Ice-cream cones are
    not generally stable, even when placed on a level surface.'
  merge: -1
  img_proc: true
