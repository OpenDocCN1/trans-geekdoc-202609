- pgno: 66
  md: "Code, but in the abstract sense.\n\nJoe is certainly a member of that gang.\
    \ When we ask him to illuminate us as to what abstraction is, his initial response\
    \ is to tell us that it's all about code reuse and how it lets avoid duplication.\
    \ We can hardly blame him for what he says here. It's certainly one of the most\
    \ frequent responses to the question and reasonably so, since it's often portrayed\
    \ as one of the primary benefits of abstraction itself. But where does this idea\
    \ come from? If you spend any length of time reading any number of articles on\
    \ class abstraction in PHP, there's a roughly even split between those that advocate\
    \ code reuse via abstraction and those that do not. It may even be a little more\
    \ in favour of the “not” camp. I'm basing this purely on my own feelings you understand,\
    \ rather than on any qualified or empirical research.\n\nBefore start picking\
    \ over the different ideas about what abstraction is, I'll make use of a horribly\
    \ familiar code cliche just to throw down some lines before we begin.\n\n```\n\
    abstract class Animal\n{\n    private $strength = 1;\n\n    abstract public function\
    \ say();\n\n    public function isHungry() {\n        return $this->strength <\
    \ 2;\n    }\n\n    public function eat(Food $food) {\n        $this->strength\
    \ += $food->getStrengthValue();\n    }\n}\n\nclass Cat extends Animal {\n    public\
    \ function say() {\n        print \"Meow\";\n    }\n}\n```\n\nI'll not bother\
    \ with the dog one though – we're all too familiar with this example already.\
    \ Up above we've defined a class called Animal, which we've also marked as abstract"
