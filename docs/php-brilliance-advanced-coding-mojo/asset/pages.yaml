    \    }\n\n    public function setEmail($email) {\n        try {\n            $this->getDataTransport()->setEmail($email);\n\
    \            return $this;\n        } catch (DataTransportValidationException\
    \ $e) {\n            $msg = $e->getMessage();\n            $code = $e->getCode();\n\
    \            throw new ModelException($msg, $code);\n        }\n    }\n}\n```\n\
    \nThere are a few things to note here. Firstly, since we don't currently have\
    \ a use case for getting the data transport back out of the model entity, I've\
    \ set the access modifier"
