- pgno: 107
  md: 'Inheriting vast wealth is not always good.


    If all of the child classes conform to and are compatible with the interface that
    the abstract parent defines, we will never have an issue arising from unexpected
    variable types being passed to or returned from a method call. The instances of
    our child classes will all display the attributes and characteristics of the data
    type that the parent defines.


    This all boils down to something that is known as Substitutability and thus forms
    the central premise of the Liskov Substitution Principle, which I have alluded
    to before and will cover in much greater depth later in this book. In brief though,
    substitutability asks us to consider whether our application will execute without
    a hiccup or a glitch we were to randomly and aribtr switch one child instance
    with any other child instance from the same inheritance family. If we can switch
    and swap at will without failure, the indications are strong that we have achieved
    substitutability. If however, we encounter problems because one instance doesn''t
    quite behave exactly as expected, we have a clear cut case of failing to meet
    this very desirable goal.


    If you''ll recall those three rules that I set down earlier on in this chapter?
    Adhering to those as closely as possible will reduce the potential for type safety
    related bugs appearing in your application quite significantly.


    The knock-on effect of this? Your reputation for having almost supernatural powers
    of foresight grows just that little bit more.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Prodding the polymorph.


    Polymorphism, as it applies to PHP, is one whole mess of a topic. Should you spend
    a little time online researching this particular beast, you''ll find a wealth
    of conflicting information available, the sum of which will leave you questioning
    whether you ended up knowing or learning anything of the topic at all.


    This is not the first time that I shall curse the Internet for all of the immensely
    powerful ways that it allows poorly qualified information to propagate. You may
    not be at surprised by now to discover that I''m about to ask you to unlearn a
    few things. This is largely because the vast majority of cursed tutorials tend
    to use something called *subtype polymorphism* as a means of explaining away how
    PHP does polymorphism. They don''t always explain it well either.


    At this stage of course, I hope and pray that I don''t fall into the same category!


    As my vont, I''ll try to cover the *don''ts* as well as the *dos* along the way,
    hopefully dispose of all bad advice that some of my readers may very well absorbed
    and assimilated along the way. In virtually every case, those beginners'' tutorials
    quite simply don''t go far enough into the details in order to leave the learner
    with the correct notion formed inside or her head.


    First though, let''s take a moment to remind ourselves that Polymorphism is. After
    all, it''s not a particular topic that many of us will think about very often.


    The term “Polymorphism” comes from the conjunction of two greek words; *Polys*
    meaning “many”, and *morph* meaning or shape. This gives us the literal translation
    as being “many forms”. So far, good. Nothing new there. But what does it *really
    mean*?


    The generally accepted interpretation in the programming community is large that
    polymorphism is “the provision of a single interface to entities of different
    types.” This in itself is a direct quotation from Bjarne Stroustrup''s C++ Glossary
    and since Bjarne Stroustrup is the creator of C++ we would be well advised to
    place our faith in the accuracy of this statement.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Proding the polymorph.


    From a PHP developer''s perspective, I would like to offer a rather simplistic
    translation: “Same name, different logic”. That however doesn''t quite cut the
    muster, while it may be correct in its most essential and literal interpretation,
    it doesn''t even get halfway far enough in telling what polymorphism is or how
    it is achieved. Nevertheless, as we work through this topic I''ll be referring
    to this “Same name, different logic” idea to illustrate how it links with each
    implementation. Before we get onto the specifics though we should take a more
    generalist view of the topic so let''s get right on it then.


    Ironically, polymorphism itself comes in many forms and it''s important to distinguish
    between the different types, important for us to learn which types we can achieve
    in PHP and which ones we can''t. Please do note however, that I''ll be covering
    Polymorphism solely from within the scope of Object Oriented Programming. A second
    thing to note is that I will be discussing the most commonly considered types.
    There are plenty out there, but I shall leave that to you as an optional exercise
    of further investigation.


    I''ll begin with a type that we can''t do in PHP.


    # Ad Hoc Polymorphism


    Ad hoc polymorphism relies on the ability of a language to support method overloading,
    thereby allowing the developer to code up two or more versions of the same method
    within the same class. This fits nicely with the “Same name, different logic”
    idea. The requirements here for this to work are that the developer should provide
    multiple methods that all share the same name but provides for varying method
    signatures through requiring different numbers and types of input parameters.
    In this way the developer is leaving the method selection to the program’s execution
    environment. Whether you’re familiar with the Java language or not, the following
    example should be quite easy to digest.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "Proding the polymorph\n\n```\nclass MethodOverloading\n{\n    public int add(int\
    \ x, int y)\n    {\n        return x+y;\n    }\n\n    public int add(double x,\
    \ int y)\n    {\n        return (int)x+y;\n    }\n\n    public int add(int x,\
    \ int y, int z)\n    {\n        return x+y+z;\n    }\n}\n```\n\nAs you can see\
    \ from the code sample above, our MethodOverloading class provides three public\
    \ methods all called add(). In each case, the three add() methods all sport a\
    \ different method signature; of which the three add() methods gets executed will\
    \ depend entirely on the number and types of parameters to be passed in.\n\nQuite\
    \ clearly, we can't achieve this type of Polymorphism in PHP. The interpreter\
    \ will simply choke and die as soon as it encounters a class that contains two\
    \ or more identically named methods, irrespective of the fact that the method\
    \ signatures themselves differ. Consequently, let's not dwell for too long on\
    \ this particular type.\n\n# Subtype polymorphism and the fatal case of method\
    \ overriding\n\nOur next consideration in the Polymorphism cannon is that known\
    \ as subtype polymorphism. This one is the one that appears to be the favourite\
    \ amongst the writers of those cursed tutorials that I mention of at the beginning\
    \ of this chapter.\n\nIn a somewhat curious twist of fate, while I was in the\
    \ process of reviewing this chapter I decided that I would Google the term “Polymorphism”\
    \ and see what came"
