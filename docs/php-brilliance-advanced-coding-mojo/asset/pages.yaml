  md: "More pub time through interfaces.\n\ncodes sees an object with the data type\
    \ AbstractRenderer, it can be assured that there will be two methods available.\
    \ The first one is the full logical implementation of a setter for the $data property.\
    \ The second one, getTransformed() will be a special provided by any child classes\
    \ derived from this data type blueprint. We know this because the getTransformed()\
    \ method is declared as abstract.\n\nLet's look at a complete implementation.\n\
    \n```\nclass CsvRenderer extends AbstractRenderer\n{\n    public function getTransformed()\n\
    {\n        // logic to turn $data into a CSV string.\n    }\n}\n```\n\nWhen we\
