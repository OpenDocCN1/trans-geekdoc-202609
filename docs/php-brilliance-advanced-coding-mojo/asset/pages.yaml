- pgno: 124
  md: 'Proding the polymorph.


    For a very simple example as this, it doesn''t really pose too much of a problem
    that we are declaring getPaymentPlan() in the principle class and then declaring
    another getPaymentPlan() in each of the different calculator classes. Since when
    have things that stay even that way though? Consider what will happen if, during
    the evolution of our application, we find ourselves having to extend the interface
    of the consumed delegate? What effect will that have on the number of proxy methods
    that we need to incorporate into the consuming object.


    The potential for our consuming object''s interface to become cluttered with proxy
    methods is quite large. It''s something that we need to be prepared for and it
    may involve us having to ask questions as to whether these proxy methods contribute
    to our vision of what the principle class''s interface is supposed to be.


    Consider for a moment our favourite model class, the User that we''ve already
    looked at a time or. It could be said that we delegated the password handling
    responsibilities to a dedicated instance of the PasswordManager, By consuming
    the PasswordManager, what methods of the delegate need to be proxied by the User?
    By scaling our thinking, what happens to our User interface when we consume an
    AddressManager delegate, and then for the consumer side we add an Orders delegate?
    It shouldn''t be too difficult to imagine that our User interface can become quite
    extensive, even before we start adding dedicated, user specific methods of our
    own.


    In all things then, it becomes a matter of consideration and experience, although
    I hope this book will allow you to take some effective shortcuts in the latter
    regard. If you can foresee a time when you would end up with a significant number
    of proxy methods, you might very well be served by switching the procedures on
    their respective heads. Rather than proxying method calls to a consumed AddressManager,
    why not build out an address management module and have the User instance become
    a parameter to be passed instead?


    # Summary


    I appreciate that it may very well seem like I''ve tried to talk you out of using
    abstraction as a means of defining a new data type doing so much effort into convincing
    you of the benefits of doing just that. This is not meant to be the case at all.
    As with many things in life, you need to base your decisions based on what'
