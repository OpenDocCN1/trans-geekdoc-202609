  md: 'And favour Composition too.


    I realise that very statement may be hard to fathom it''s true. Some people eat
    salads! Some of those salad eaters actually like olives too.


    I''m sure you can see where this is going. The OliveDecorator that we created
    earlier isn''t exactly reusable in its current form given that it requires a PizzaBase
    instance on its constructor.


    Do we refactor? Do we create an AbstractFood as the new ultimate parent in our
    increasingly wobbly hierarchy of comestibles? Doing so would surely allow us to
    “decorate” any dish with extra olives.


    The problem that we''re faced here though is that we would end up with a truly
    unwieldy inheritance hierarchy that we simply couldn''t expect any of our teammates
    to retain such a hierarchy in their heads. End result? An distinct absence of
    pub time sacrificed in the name of late bug fixes.


    Fortunately, this is all eminently fixable. Fixable by throwing out the original
    definition of the Decorator Pattern and reforging it with something a little more
    modern. One that is distilled from the original but without the baggage that the
    inheritance requirement trawls all behind it.


    If a decorator is required to present the same interface as the object it decorates,
    we need only provide an interface that covers the required behaviour.


    In other words, ditch the inheritance hierarchy and employ a common interface
    in order to guarantee the required behaviour.


    To illustrate how this works, I could go back over the fast application and redo
    the examples in an interface oriented manner but I actually want to cover this
    in a much more appropriate fashion. And by more appropriate, I mean in a way that
    more succinctly demonstrates why the inheritance approach is flawed.


    Naturally then, we''ll start with a class definition for a Warrior.'
