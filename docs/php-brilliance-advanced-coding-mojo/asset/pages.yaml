- pgno: 174
  md: '# # Expressing good traits.


    Back in 2012, London was host to the Olympic Games and PHP5.4 arrived, towing
    behind it a truck loaded with problems and dynamite. This truck of trouble only
    becomes an unneeded word painted on its side. That word? Traits.


    Hang on a second, didn''t you refer to traits as being some of the juicy new "Good
    Stuff" not so long ago?


    Yes, I did and traits still qualify as being of the juicy "Good Stuff", which
    we''ll get onto unnecessary loaded with problems and dynamite only issue if you''re
    not ready for them when you open the door. Hence the reason for using incendiary
    language – my aim is quite specifically to put on your guard. In other words,
    it''s time to don those snake proof gloves again because, baby, this one''s gonna
    bite.


    First of all, we need to be clear on what traits are.


    Declared in a similar fashion to a class, a trait provides the means for which
    a closely related set of functionality can be coded up into a single unit and,
    at compile time, “copy and pasted” into a regular class definition before the
    class definition itself is parsed. Even without worrying about the actual mechanics,
    this is how you need to remember it happening.


    In this way, traits provide a very powerful and convenient mechanism for supporting
    code reuse. They help us to keep our codebases DRY and in itself automatically
    means we are avoiding unnecessary duplication. The basic premise is that you define
    the reusable code inside the trait itself - this is the ‘copy’ part of the operation.
    Then you proceed to tell the PHP interpreter where that reusable code should be
    inserted through the use of the use keyword - correspondingly the paste part of
    the operation.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "Expressing good traits.\n\nI know that we just looked the use keyword in the\
    \ previous chapter on namespaces. use has two discrete modes of operation. Outside\
    \ of a class, it is used for importing a namespace, interface or function. Conversely,\
    \ when use is used inside of a class declaration, it's expressly for importing\
    \ the contents of a trait at compile time. It may help to avoid confusion if you\
    \ can hang on the notion that use is used to import something, at least.\n\nLet's\
    \ proceed with a simple example to see how they work, and then proceed to explore\
    \ them a little further.\n\n```\n<?php\nnamespace Vanqard\\MyProject\\Model;\n\
    class UserModel {\n    public function save() {\n        // trigger storage\n\
    \    }\n}\n```\n\nOur starting point then is a rather anaemic UserModel, though\
    \ obviously I'm only showing the one method that we are particularly interested\
    \ in here - the save() method, which might be invoked on a model object in order\
    \ to trigger the persistence data to whatever storage system we are using for\
    \ this model.\n\nIt's reasonable to assume that the save() method will be common\
    \ to all of our model classes. Should we then make it part of an abstract base\
    \ class? It could be argued that somehow triggering storage is a requirement to\
    \ all models. This would only be the case when you can readily and comfortably\
    \ apply the notion of a single \"model\" data type to all of the models. For many\
    \ small to medium sized projects where the need for scale is relatively low, this\
    \ might be appropriate. Yet it's also possible to interpret the save() method\
    \ as a convenience method. We should know by now that that's not the PHP Brilliance\
    \ way of doing things. We know that"
  merge: -1
  img_proc: true
- pgno: 176
  md: "Expressing good traits.\n\nadding convenience methods to an abstract base isn't\
    \ the way to go because code reuse via inheritance is a terrible thing.\n\nOf\
    \ course, since we're in the Traits chapter, we should look at how that is achieved\
    \ with a trait. First of all, we'll start with our modified model class.\n\n```\n\
    <?php\n// File: src/Model/UserModel.php\n\nnamespace Vanguard\\MyProject\\\nuse\
    \ Vanguard\\MyProject\\Persist as MySqlStorageTrait;\n\nclass UserModel\n{\n \
    \   use MySqlStorageTrait;\n    ...\n}\n```\n\nAlready, we have a few things to\
    \ examine here. Outside of the class{} definition itself, I've used the use keyword\
    \ to import the trait into the current scope and then aliased the class so that\
    \ we can refer to it locally as MySqlStorageTrait.\n\nInside the class definition\
    \ itself, I'm telling the PHP interpreter to copy the contents of the trait identified\
    \ by the alias MySqlStorageTrait into the location where I've used the use keyword.\
    \ There's an important distinction to make here-the line with the use keyword\
    \ will be replaced by the entire contents of the trait that it refers to before\
    \ executing any of the code. PHP needs to know what the final structure of a class\
    \ will look like before using the finished definition of the class internally.\
    \ I know that it trips a developer up occasionally, it's worth pointing out that\
    \ that prohibits us from using a variable (such as $trait) to identify the actual\
    \ trait to use.\n\nAnyway, let's go on to look at the trait."
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\n<?php\n// File: src/Persist/Mysql.php\n\nnamespace Vanqard\\MyProject\\\
    Persist;\n\ntrait Mysql\n{\n    public function save()\n    {\n        ... //\
    \ trigger storage\n    }\n}\n```\n\nAgain, this is a pretty simple example. As\
    \ you can see, the trait only contains the save() method that was previously located\
    \ located in the UserModel class. If we bear in mind that it's the contents within\
    \ the opening and closing braces that will be copy and pasted into the target\
    \ class, we should be able to deduce that the 'finished' class definition that\
    \ PHP sees in fact be identical to the first example that didn't reference the\
    \ trait in the first place.\n\nWhy is this advantageous?\n\nThe immediate benefits\
