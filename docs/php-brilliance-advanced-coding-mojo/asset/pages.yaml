- pgno: 18
  md: '# What is the right kind of knowledge?


    The principle as stated there leaves itself open to being accused of baldly stating
    the obviously. If a developer has all of the right kind of knowledge in their
    head, then it should naturally follow that the quality of their application code
    would be of a high standard.


    But what is the right kind of knowledge?


    To answer that question, we need to qualify a few things first, including something
    of a definition for evaluating code quality itself. Fortunately for us, we can
    stand upon the shoulders of giants and examine the work that has already been
    done in this arena.


    +   - The functional quality reflects how well a particular application serves
    its intended purpose.

    - The structural quality reflects the non-functional requirements and how the
    application code supports the delivery of the application''s functional requirements.


    Fitness for purpose, as it is commonly known, isn’t something that we will be
    considering here; building an online word processor that can compete with a desktop
    version will have very different functional requirements to trying to build out
    a social network specifically for Alaskan fish enthusiasts.


    The functional quality of any given software project will be judged by criteria
    that are very specific to that project. In other words, does it do what it is
    supposed to.


    However, we certainly examine the non-functional requirements of any given software
    project in order to judge the quality of the software and its constituent code.
    Typically, this is by assessing key factors.


    # Reliability


    Can we trust our application code to do the right thing? It might sound a bit
    da on the face of it but this is something that we absolutely must be able to
    do. Our users will rely on our application’s code to deliver the functionality
    that they need, else they will stop being our users and go look elsewhere.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'More Pub Time


    5


    The companies that we work for rely on an application’s code to be able to deliver
    the necessary functionality either to increase sales, reduce costs or any other
    way that might improve the bottom line. Failure to provide for this kind of reliance
    might result in the company going bust or you getting fired.


    The keyword here is failure. The reliability of an application, or an individual
    portion of code inside an application, isn’t just down to how well the code responds
    when given the right data in a low stress environment - coding just for the happy
    path does not provide us with the reliability that we crave!


    No, the reliability of a piece of code or an application as a whole comes down
    to how well code responds to errors, failures and defects. If a caching layer
    is down due to hardware or networking issues, our application choke and die? Or
    will it handle the situation gracefully?


    If a user provides with garbage in an HTML form, either innocently or maliciously,
    does our code validate and sanitise appropriately, chucking the right kind of
    error while rejecting the content of that form?


    Modelling and assessing reliability comes in many different flavours, far too
    many to discuss here, but they all have a common theme: Does the application do
    the right thing when conditions are favourable and does it still do something
    acceptable when conditions are unfavourable?


    If the application chokes when it is fed with garbage data, if our web site falls
    over once the database’s connection pool becomes saturated, then our quality in
    terms of reliability could be said to be very low. As we could be said to out
    of a job.


    # Maintainability


    I’ve ranked these four quality considerations in order of importance, which is
    why maintainability comes in second. Reliability is right there at the top of
    the list since we need our code to do what it is supposed to, and respond appropriately
    when it can’t.


    However, maintainability is a most definite second on the list when considered
    in order of importance and for very good reason. Whilst the other three members
    of this list express their focus on a given snapshot of the codebase, frozen in
    time at any given point, maintainability focusses on both the frozen snapshot
    and a time-ranged consideration.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# More Pub Time


    This is important for a number of reasons. In an online world, and especially
    in an online world of applications written for the web using languages such as
    PHP, the applications themselves rarely reach a state of completion.


    Unlike their counterparts in the desktop world, there isn''t a point in an online
    applications lifetime when the business declares the product is done and it''s
    time to get the DVDs pressed and on the shop shelves.


    This is especially true for development teams that use agile methodologies and
    lean processes, tagging and ranging incremental changes over time in order to
    improve the product offering for the targeted end user.


    This is where the time-ranged consideration comes in. Code that is maintainable
    is code that is resilient to the inevitable changes that come along. It is the
    opposite of code that is brittle and/or fragile. Code is sufficiently malleable
    that it will bend and flex appropriately to accommodate the seemingly flood of
    change requests emanating from the business team without hiccup, downtime or the
    loss of most valuable commodity: Pub time.


    # Security


    Security is perhaps the most commonly misunderstood aspect of software quality.
    Naturally as developers we are keen to protect our application''s data from the
    more malicious elements of the outside world but security has a much broader sphere
    of influence beyond the common, though no less critical, act of guarding against
    attack vectors.


    As far as security is concerned, it becomes necessary to consider the topic in
    much broader terms. One thing that is common to all applications is that they
    collect, manipulate and store data. It doesn''t matter whether it is a game, a
    social network, a corporate intranet or a blogging site, it''s the data that is
    king in every case.


    As far as the security aspect of software quality is concerned then, we must widen
    the definition beyond preventing hack attacks to one that recognises the preservation
    of data integrity is paramount.


    If the data within our application is “mostly ok” then we''re in trouble since
    that implies some of it is bad. We need all of the data in our application to
    be good data at all times, we need it where it is supposed to be and not end up
    in places where it''s not supposed to be.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'More Pub Time


    As a result, assessing the security aspect of software quality entails a lot more
    than making sure we are protecting ourselves against SQL injection attacks, or
    hashing user passwords properly. It entails making sure we have the right kind
    of validation in place and that we''ve put that validation code in the right location.
    It entails making sure that a multi-stage data manipulation process can be rolled
    back to its original state should one of those stages fails. It entails a lot
    of things but the final outcome needs to be this: All of the right data in all
    of the right places and none of it anywhere else.


    Making sure that we''re ready for the user that ;DROP TABLE users;@hotmail.com
    as an email address is one thing, but if a member of our team creates an algorithm
    that accidentally sets every user''s first name to the four character "John" then
    we''re already sailing down crap away and the paddle is nowhere to be seen.


    # Efficiency


    I''ve known developers in the past who have placed an inordinately high degree
    of importance on creating highly efficient, fast running, low memory usage code.
    Ones that have declared code can only be beautiful when it''s fast.


