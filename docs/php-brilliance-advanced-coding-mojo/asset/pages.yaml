  md: '# Talking Points 300


    part of the book has been largely about; promoting code that exhibits high structural
    quality by promoting loose coupling as a means of achieving testability.


    Tell, Don''t Ask us to encapsulate business logic in the right places; places
    where logic is readily testable.


    The Law of Demeter wants us to decouple our code by only talking (collaborating)
    with our closest friends. Friends can be readily replaced with mocks and stubs
    in a testing environment.


    Instantiaphobia wants us to concentrate the process of object creation in very
    distinct locations, either dedicated factories or a dependency injection container.
    Why? Because newing up objects willy-nilly entails tight coupling to the classes
    so referenced.


    For a more thorough treatment of writing highly testable code, I have one more
    recommendation for you and book recommendations go, this one''s a strong one.
    In Grumpy Programmer’s Guide to Building Testable PHP Applications²⁰ Chris Hartjes
    delivers some excellent advice on how to focus on writing testable code from the
    outset. To quote the follow directly:


    > The best applications are ones that consist of small, loosely-coupled modules
    that can be combined to solve problems. - Chris Hartjes


    This has been a key focus of Part Three; raising the structural code quality of
    the applications that we write by promoting the concept of loose coupling. In
    doing so, we are able to provide a broad base of unit test coverage and thereby
    go a long way towards guaranteeing that quality.


    Which brings us back to our poor, old OrderModel, which, if we''re honest, is
    a candidate for needing 100% test coverage. Before we even get onto the matter
    of testing its methods, we need to fix that constructor.


    ²⁰https://leanpub.com/grumpy-testing'
