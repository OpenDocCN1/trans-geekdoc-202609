- pgno: 207
  md: '# Finding Closure.


    extracting the customer''s information from the $customerModel instance, virtually
    every closure that we created would be one of these proxies.


    Fortunately, we don''t have to duplicate the code at all. We can use reflection
    for simple return values that don''t require the same sort of mangling as the
    array_walk() process conducted on the $orderCollection and $invoiceCollection
    objects.


    Doing so lets us pluck existing methods from other objects and build our ViewData
    instance with them.


    ```

    $reflectedMethod = new ReflectionMethod($customerModel, ''getName'');

    $viewData->addMethod(''getName'', $reflectedMethod->getClosure($customerModel));

    ```


    That''s just two lines of code for every method that we wish to lift the $customerModel()
    instance and add to our ViewData instance. The first line generates the reflected
    method, whereas the second line provides with an active closure scope bound to
    the original model.


    In this way we can dynamically build our new object with methods drawn from a
    variety of source models. Since each closure retains its original scope, it behaves
    precisely as if we''re invoking the method on the original object itself.


    Without the need for processing the return data, we can simply cherry-pick the
    relevant getters from the models that we''re working and present a purely “read
    only” composite object back to the controller.


    In any case, once we''ve populated $viewData instance with the appropriate methods
    it can be returned to the controller and consequently passed to the view ready,
    willing and able to provide the elements of data required to complete the page.


    It''s the implementation of the magic __call() method allows this to pretend that
    it''s a regular object.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# Finding Closure.\n\n```\npublic function __call($methodName, $args)\n{\n\
    \    if (is_callable($this->methods[$methodName])) {\n        return call_user_func_array(\n\
    \            $this->methods[$methodName],\n            $args\n        );\n   \
    \ }\n}\n```\n\nThe end result? The view is to access the required data by invoking\
    \ the individual closures *as if they were public methods.\n\nAccount Number:\
    \ <?= echo $model->getAccountNumber(); ?>\nCustomer Name: <?= echo $model->getCustomerName();\
    \ ?>\n\n```\n<?php foreach ($model->getOrders() as $order): ?>\n// render details\
    \ as desired.\n<?php endforeach; ?>\n```\n\nObviously, you'd adjust the output\
    \ generation to your own requirements. All that we are looking at here is the\
    \ invocation of the closures *resembles* the calling of object methods.\n\n# And\
    \ it's back to the macros.\n\nA chapter on closures wouldn't be complete without\
    \ making mention of the most likely circumstances that you're going to encounter\
    \ them in the wilds.\n\nIn recent years, much has been made in the PHP universe\
    \ of Dependency Injection Containers, and less frequently but less importantly\
    \ about the art and science of routing. If you've come into contact with either\
    \ of these concepts of late, you will have been hard pressed to notice that they\
    \ also use closures quite extensively.\n\nAs a result, these two concepts provide\
    \ an ideal way for us to examine closure usage within real world contexts.\n\n\
    Our first example is a routing and one comes directly from the home page of the\
    \ Slim microframework¹⁰.\n\n> ¹⁰http://www.slimframework.com/"
