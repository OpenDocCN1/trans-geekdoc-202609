    # Summary


    We need to guard against the rise of poltergeists within our system. By their
    very nature, they introduce unnecessary complexities into our object graph. Recognisable
    by their control-like modes of operation, they are insubstantial and transient
    as the anti-pattern definition goes, they “turn up, cause things to happen and
    then disappear again”.


    Mastery of the “Tell, Don''t Ask” principle will help prevent these troublesome
    apparitions from cropping up in our codebases. We will get onto that one shortly.


    In the meantime, please remember that whilst a broom handle might very well aid
