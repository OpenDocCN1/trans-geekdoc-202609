- pgno: 316
  md: '# Talking Points


    It’s only natural to think of coding up a story based on the order in which things
    need to happen inside our application, from initial request to final response.
    After all, this is quite often the approach taken in the online tutorials scattered
    around the web. If you Google for “How to make a blogging site in (insert framework
    of choice here)”, the chances are exceedingly high that the walkthrough of the
    process will have you setting up the router, then the controller, and lastly the
    view template.


    However, this is the approach that most often leads to the appearance of poltergeists
    and couriers, both of whom are inclined to drag along the spectre of tight-coupling
    with them.


    If instead, we take a backwards thinking approach to the problem, we’re more likely
    to achieve code that is cleaner, more loosely coupled and therefore more resilient
    to bugs.


    Let’s walk through the process of creating a blog post backwards just to illustrate
    this point.


    First, we need a view that displays a confirmation message and the content of
    our newly minted blog post. Great, and that’s going to need to know what the view
    requires. Let’s code up the view.


    Knowing what data our view requires our model is going to need to return a BlogPost
    instance, oh and that’s going to need to be persisted to the database. Great,
    that means we need to set up our BlogPost model with the required database connection.
    Let’s code up the model, injecting the database connection.


    Then, hmm, something’s going to need to set that data on the model based on what
    the user submitted let’s code up a BlogPostService object that gets given the
    model object that it collaborates with. Ok, done.


    How do we get the service instance? Quite likely this will be the way that we
    normally do at the boundary of our application specific code and the code of whatever
    framework we choose to build upon; through the routing component.


    Building backwards this allows us to get our dependency injection right the first
    time around. It also makes easier to avoid courier-like situations where we may
    be tempted to pass things through controllers or services in order to get them
    to the model or persistence layers.'
  merge: -1
  img_proc: true
