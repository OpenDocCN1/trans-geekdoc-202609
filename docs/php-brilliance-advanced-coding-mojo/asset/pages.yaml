- pgno: 224
  md: '# Ghostbusters


    Remember Joe from Part One? As likeable a chap as he was, we had to let him go.
    No matter how likeable he was, the company couldn''t be seen to be supporting
    the torrenting of that kind of material frankly. In his place, we have Lizzie.
    She’s an ace.


    However, she got a bit too excited about the possibilities presented in the Closures
    chapter and decided it would be a good idea to build a DataMapper type of thing
    that would pull the data out of models and save the changed bits back into the
    database.


    It’s an entirely commendable attitude of course, but it’s also the reason why
    we’re starting the real content of this part of the book with an anti-pattern.
    All of that excitement that bubbled up with the closures stuff needs to be put
    in check somehow.


    The anti-pattern in question is called The Poltergeist. It’s also known as the
    Gypsy Wagon, but I think Poltergeist is the more apt name for it it describes
    a phenomenon where “something turns up, causes things to happen and disappears
    again”.


    In itself, this is a very apt description of the wrong kind of use that closures
    can be put to and it manifests itself in objects that have no real substance,
    objects whose sole apparent purpose is to make things happen in other parts of
    the system and then go away again.


    Our consideration of the poltergeist is doubly important since we spent a good
    bit of time considering how we might divide the objects of our system into the
    knowers and the doers. It’s around this time that it becomes appropriate to reclassify
    those knowers and doers as doing so will help us achieve an understanding of these
    poltergeists are none of those.


    The knowers of our system are more appropriately divided into two distinct camps.
    The first, larger camp is the one that we can label for the Entities. These are
    the key players, the models that curate our application’s data, providing both
    the properties that retain that data and the methods that allow the data to be
    manipulated in an appropriate fashion.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Ghostbusters


    The second, much smaller camp of knowers consists of the value objects. These
    are the little blighters that allow us to transport complex variable structures
    around the system from one process to the next. Neither operate on the data that
    they hold nor perform processes because of it.


    This leaves us then with the doers. Doers *are* the critters that we will perform
    the processes that we ask of, the ones that are more properly known as Services.


    As a result, we are left with entities, services and value objects instead of
    simply *knowers* and *doers*. Poltergeists have no home in any of these camps,
    which is why we need to banish them and perform the necessary rites in order to
    prevent their appearance.


    Lizzie''s notion of using a closure to link an entity''s data with the storage
    process, entirely commendable, is an example of a poltergeist in action, albeit
    an exceedingly skinny one. Nevertheless, what we are left with an an object has
    no discernible purpose other than to create a transient bridge between a model''s
    data and the save mechanism.


    This in itself provides us with a process that is difficult to trace an error
    arise but that isn''t the issue we need. We would, in fact, be better served by
    creating a more explicit bridge between the model object and the storage. As we''ve
    seen previously, this can be achieved by injecting the model with a data transport
    object, allowing the model to function properly and with access to the information
    it requires and *still* providing the link back to the mapper as we desire.


    This is a key characteristic of a poltergeist; it represents some form on control
    logic for making things happen, yet as an object itself has no real substance.


    To take a look at another concept that we''ve already encountered and consider
    how it might display poltergeist-like behaviour, think back to when I suggested
    we remove the `register()` method from the *User* model. We might be tempted to
    create a single, unifying object whose purpose is to co-ordinate our entire creation
    process.


    However, there''s a chance that this could lead to some poltergeist like behaviour
    creeping into our code. Let''s take a look.


    We will begin with the kind of code that less experienced developers are prone
    to writing *â* putting the process logic into the body of a controller action.'
  merge: -1
  img_proc: true
