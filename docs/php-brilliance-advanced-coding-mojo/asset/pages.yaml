- pgno: 81
  md: "Code, but in the abstract sense.\n\nType hinting is the practice of declaring\
    \ what particular data types are acceptable to our code. In most object oriented\
    \ cases, we'll use type hinting in a method signature to inform client code what\
    \ they must pass in as parameters if they want to invoke this method. Here’s an\
    \ example.\n\n```\nclass Zoo\n{\n    private $animals = array();\n\n    public\
    \ function addAnimal(Animal $animal)\n    {\n        print \"Welcome to the zoo,\
    \ \" . $animal->getName();\n        $this->animals[] = $animal;\n    }\n}\n```\n\
    \nNothing shocking. Our addAnimal() method declares that the parameter to be passed\
    \ in must be an instance of the Animal class. If we were to try to pass in a parameter\
    \ that wasn’t precisely an instance of the Animal class or of a child class derived\
    \ from it, PHP would complain horrendously and our application would be broken.\n\
    \nThe reason for using type hinting is a simple one: we want to ensure that the\
    \ parameters passed in all honour the interface is defined in the Animal class.\
    \ For this reason, I’ve illustrated the point on line 7 where we invoke the getName()\
    \ method. If we take it as read that the abstract parent Animal class defines\
    \ a getName() method then we would really ought to be confident that any concrete\
    \ instances derived from the Animal class also not only implement the same method,\
    \ either directly or by overriding it, but also provide return values of the same\
    \ or a compatible type. Consider the following piece of code:"
