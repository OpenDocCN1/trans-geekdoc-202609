    \  \"require\": {\n  },\n\n  \"autoloader\": {\n    \"psr-4\": {\n      \"Vangard\\\
    \\MyApplication\\\\\": \"src\",\n      \"Vangard\\\\MyPackage\\\\\": \"lib/mypackage/\"\
    \n    }\n  }\n}\n```\n\nFor the sake of illustrating how we might accommodate\
    \ a new sub-project, I’ve also added a second entry to the autoloading specification;\
    \ one maps the namespace “VangardMyPackage” to a new directory. Even if you don’t\
    \ use Composer to pull in manage outside dependencies, just following these namespace\
    \ guidelines for your own code and making the appropriate edits to composer.json\
    \ makes autoloading super easy and entirely hassle free.\n\nWith a free and simple\
    \ autoloading solution already available for your projects, simply following the\
    \ standards that it requires will start our projects off nicely on"
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Putting a name on our spaces.


    the road to a high degree of cleanliness and logical separation, very much along
    the lines of a properly organised mp3 collection. I can''t automatically provide
    us with the “correct” directories and their corresponding sub-namespaces obviously
    but our exposure to frameworks makes it highly likely that we know most of the
    popular choices already.


    # Conclusion


    If I could condense this chapter down into just five words, the message would
    be “Namespace everything that you write”. The real danger of name collisions happening
    within the global (root) namespace becomes a complete non-issue when all of your
    own code resides inside a namespace of its own. You are really off leaving the
    global namespace to the language itself.


    You might already have noticed that I don''t often promote the idea of lazy coding.
    Indeed, taking shortcuts is anathema to the PHP Brilliance manifesto. However,
    it comes to a choice between trying to create your own router package or choosing
    one pre-built one so long as you can ascertain that it is fit for your purposes
    and of a high enough standard. Employing Composer to manage those dependencies
    for you makes achieving quality relatively effortless, and this in particular
    includes making it easy to keep your dependencies up to date with the latest bug
    fixes and security patches as provided by the respective authors.


    Conclusion? Namespace all the things and let Composer manage the autoloading for
    you.'
