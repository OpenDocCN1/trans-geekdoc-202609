  md: 'Ghostbusters


    217


    In contrast, our UserService provides us with plenty of scope to build out more
    user related methods on the service interface. It is, after all, called a UserService
    and not a UserRegistrationService, which would put us back into poltergeist territory
    again. The more generic UserService name allows us to flesh out this particular
