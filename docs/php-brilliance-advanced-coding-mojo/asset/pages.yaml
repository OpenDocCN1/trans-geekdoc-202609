- pgno: 37
  md: '# Object Oriented Thinking


    That in itself is as awesome as a large and tasty pint of ice cold beer. Well,
    maybe almost as awesome - nothing really comes close to a large and tasty pint
    of ice cold beer.


    So where does this leave us now? All being well, we have progressed from the stage
    where the most basic tutorials leave off. We are now a little better equipped
    to guard against thinking of our primary classes as silos for the ever expanding
    lists of processor methods that our application appears to need.


    This is rather the key point that I want to make at this stage. All too often,
    it''s terribly easy to get stuck with the real world nouns when thinking about
    the objects that come into play within our applications, what we really need to
    develop is an ability to think of application objects in an abstract sense. There''s
    no tangible real world equivalent for a PasswordManager but if we can successfully
    keep that notion of objects only being able to know things or do things at the
    forefront, we''re a long way down the trail of instinctively knowing what should
    go.


    # Summary


    For our first chapter, I''ve concentrated on the idea of grouping application''s
    objects into two distinct camps: the knowers and the doers. This is very much
    the key that I would like to introduce at this point. In a very general sense,
    our knowers are likely to be the principle citizens that reside in our model layer.
    They hold and represent the data that lies at the heart of our application. These
    are the users, the products, the orders and the invoices. They present an interface
    which is designed to set, retrieve, manipulate or transform the individual elements
    of data that are responsible for.


    Then are the doers. The objects within our system that cause things to happen
    and whose interfaces comprise methods that we can call in order to trigger those
    things. These doers might mask the simplest of processes, such as the hashing
    of a password, or they might be a facade unto much more complex procedures, governing
    the various stages of user registration for example.


    Clearly then, I''m really quite keen on this idea. Largely because I''ve witnessed
    the positive effects that it can have. It''s not so much the idea in itself per
    see, more that the end results speak for themselves. Smaller, tighter leaner and
    leaner objects are so more efficient and maintainable than the alternative: classes
    treated as silos'
