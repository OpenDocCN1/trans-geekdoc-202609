- pgno: 164
  md: "Putting a name on our spaces.\n\n```\n<?php\n/**\n * This file is part of the\
    \ Symfony package.\n * (c) Fabien Potencier <fabian@symfony.com>\n *\n */\nnamespace\
    \ Symfony\\Component\\Console;\n\nclass Application\n{\n    ...\n}\n```\n\nThis\
    \ is a stripped down representation of the Application class within Symfony’s\
    \ Console component, but you didn't need me to tell you that, did you? Everything\
    \ I said about this code can be readily deduced from the class name itself and\
    \ the namespace that it’s coded under. I find this to be one of the best examples\
    \ of the kind of clarity that can be achieved with appropriately namespaced code.\n\
    \nTo build a command line tool around Symfony’s console component, you need only\
    \ create an instance of the Application class, configure that instance and then\
    \ invoke the run() method.\n\nNow you could use the fully qualified class name\
    \ for your new statement, which would look something like this:\n\n```\n$myApp\
    \ = new \\Symfony\\Component\\Console\\Application();\n```\n\nYou might notice\
    \ that I've included a leading '\\' in that reference to Symfony’s console application\
    \ class. This is purely to make sure that we’re referencing it by the “absolute”\
    \ namespace path. Without the leading “”, namespaces are resolved in a relative\
    \ fashion, a potential source of much confusion\n\nBut using the fully qualified\
    \ class name is hardly any better than going back to the really long class names\
    \ illustrated in the ZF1 example above.\n\nNever fear though, usability is restored\
    \ through the power of the use keyword."
