  md: "Encapsulating our ideas.\n\n```\nclass User {\n    /**\n     * @var array $userData\n\
    \     */\n    private $userData;\n\n    public function __construct(array $userData)\
    \ {\n        if (!$this->isValid($userData)) {\n            throw new Exception('Provided\
    \ user data array is invalid');\n        }\n        $this->userData = $userData;\n\
    \    }\n\n    /**\n     * @param array\n     * @return boolean\n     */\n    private\
    \ function isValid(array $userData) {\n        // array validation occurs here\n\
    \    }\n}\n```\n\nOur class file just got so shorter. It also got so much easier\
    \ to read as well. Shouldn’t we be celebrating around now? Especially when it’s\
    \ perfectly clear that the next time someone from the business team comes up to\
    \ our desk, adding a new data element for our user object to handle ought to be\
    \ a simple case of adding another piece of validation to the isValid() method.\n\
    \nBut there lies in our problem too. We've moved the validation back inside the\
    \ User class again. This gives us a number of problems to think through. It should\
    \ be pretty easy to imagine that next thing we will need from our users will be\
    \ a mobile phone number for sending SMS messages to. With our code as it stands,\
    \ we'd most likely add the phone number as an additional element in the $userData\
    \ array and then proceed to add lines to the isValid() method to validate the\
    \ phone number that we've been given.\n\nBang! Just like with the email property,\
    \ we've got another value being validated inside the User class. A type of value\
    \ that, in all likelihood, we'll also want to validate"
