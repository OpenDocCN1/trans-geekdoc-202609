    \ $adapter );\n\n    public function getStorageAdapter();\n\n    public function\
    \ create(array $data = []);\n\n    public function read($id);\n\n    public function\
    \ update($id, array $data = []);\n\n    public function delete($id);\n}\n```\n\
    \nDoing just this has another important side effect: The storage adapters are\
    \ going to be readily mockable, leading to unit test suites that can really fly."
