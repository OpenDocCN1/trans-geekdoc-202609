  md: "# Talking points.\n\nas being public is quite clearly the opposite of hiding\
    \ them away and preserving our notion of encapsulation. Consequently, we make\
    \ them private so that they're kept safe from external molestation.\n\nAssuming\
    \ we ignore all kerfuffle about the magic __set() method for the moment and go\
    \ on provide a dedicated setter method instead. Is that any better? Not in the\
    \ slightest. Or at least, not when it's used in the naked sense.\n\n```\nclass\
    \ Car {\n    private $engine;\n\n    public function setEngine($engine) {\n  \
    \      $this->engine = $engine;\n    }\n}\n```\n\nHere we have a completely pointless\
    \ “naked” setter. If you study the code, you can see that it provides absolutely\
    \ no purpose or benefit whatsoever. Why? Simply because it accepts an unexamined\
    \ parameter and writes that value to an internal property. Functionally, it behaves\
    \ exactly the same as if the $engine property had been declared public in the\
    \ first place.\n\nEqually as bad though is the side effect that it can trigger\
    \ in the mind of the uninformed developer. It results in a false sense of security\
    \ based on the notion that our property is declared private, it must therefore\
    \ be better than a public one. If you follow the logic of the naked setter, you\
    \ can see that its real effect is to make the private property public again.\n\
    \nErgo, it's evil. In the process of doing nothing whatsoever it can also create\
    \ the illusion of achieving something beneficial. That perceived benefit is still\
    \ only though.\n\nThere's also a very important point to make here, which again\
    \ takes the matter of encapsulation into consideration. When you provide such\
    \ a method as this, naked or not, you are effectively handing over control of\
    \ your object's internal state to code that is outside of the object itself. It\
    \ goes without saying that this should not be considered a good thing."
  merge: -1
  img_proc: true
- pgno: 136
  md: "# Talking points.\n\n> The \"state\" of an object is the term given to the\
    \ thing that encompasses all of the properties that an object has and the values\
    \ attached to the properties at a given time. We can determine that an object\
    \ has changed state when one or more of its properties has changed value.\n\n\
    So how can we improve this? With our private properties all nicely hidden away,\
    \ we still have to get the values in there somewhere.\n\nAs always, there are\
    \ a number of different ways to go about this.\n\nIf an object needs data in order\
    \ to be considered complete, that is to say the object could not function properly\
    \ without such data, then constructor injection is the way to go. If that's the\
    \ only use case for or if your application has no need to change data on the fly,\
    \ then there's subsequently need to provide a setter in the object's interface.\n\
    \nWhen your application needs to set an explicit new value inside an object during\
    \ normal flow, then by means provide a setter but dress it up a bit, don't go\
    \ providing one of those naked ones. What do I mean by this?\n\n```\nclass Car\
    \ {\n  private $engine;\n  public function setEngine(EngineAbstract $engine) {\n\
    \    $this->engine = $engine;\n  }\n}\n```\n\nThis is probably the programmatic\
    \ equivalent of a manikin – hardly decent but at least it covers the bare minimum.\
    \ In this instance, we are still saying that we expect code outside of this object\
    \ to set the $engine property for us, but at least we taken back a little control\
    \ by stating that only instances of the EngineAbstract are permissible.\n\nOur\
    \ final method is the preferred route for us to take wherever possible. It involves\
    \ using a different kind of mutator, that modifies one object properties rather\
    \ than explicitly sets a new value on it. Let's take a look at some examples of\
    \ this technique."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Talking points.\n\n```\nclass User\n{\n    private $hobbies = array();\n\n\
    \    public function addHobby(AbstractHobby $hobby)\n{\n        $this->hobbies[]\
    \ = $hobby;\n    }\n}\n```\n\nThis one is pretty straightforward. Our $hobbies\
    \ property is modified via the addHobby() mutator, allowing us to invoke a change\
    \ of state in an appropriate fashion. We can also provide a corresponding removeHobby()\
    \ method to cover the flip side of this case.\n\n```\nclass PlayerScore\n{\n \
    \   private $score;\n\n    public function addScore(ScoreEvent $event)\n{\n  \
    \      $changeValue = $event->getScoreDelta();\n        $changeValue = $this->applyBuffs($changeValue);\n\
    \        $this->score += $changeValue;\n    }\n}\n```\n\nIn this example, we've\
    \ added a god bit more control logic to the process of modifying a player's score.\
    \ On the interface, we're limiting the input parameter to be an instance of a\
    \ ScoreEvent, which in turn should guarantee for us that the getScoreDelta() method\
    \ will be available. Following that, we're passing the $changeValue yielded to\
    \ the internal applyBuffs() method to see if the player has any buffs or boosters\
    \ active before applying the change to our $score property.\n\nThe end result\
    \ is that PlayerScore class has taken much more control over its internal state\
    \ than would be the case if we were to allow application code to supply an explicit\
    \ value directly. The end result is that encapsulation has been restored, the\
    \ inner workings are tucked away and any change to our properties and their values\
    \ happens on our terms. This is exactly as it should be."
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Rules are meant to be broken


    Even though we''re just coming up to the end of the first part of the book, you
    may have noticed that I''ve posted quite a large number of rules already. This
    rule goes here whilst you''re at it, keep these three rules in mind too. It''s
    quite a lot that I''m asking of you, I know this.


    Fortunately, rules were meant to be broken. For every “rule” that we examine in
    these pages, bear in mind that each will have a certain amount of elasticity.
    Some will bend easily, otherwise will just snap at the merest push in the wrong
    direction. Unless a particular rule is of the latter variety, one that should
    be considered a law, I''m not intending to tell you which are proper rules and
    which are merely encouraged guidelines. I know that might sound arrogant and I
    apologise if it does the goal here to equip you sufficiently to arrive at your
    own conclusions. A case in point comes fairly soon when we go to the chapter on
    traits. I will posit a rule but only after we''ve worked through the pros and
    cons of the blessed things, at point I hope that you''ll find agreeing with the
    rule presented.


    In the meantime, I''d like to tell you a story. It really won''t take long to
    do.


    A few years ago, ok, few-ish, I was tutoring a private student who was pretty
    keen to get going with the object oriented stuff. Right from the start I gave
    him a rule: You cannot create an object from a class directly, you always have
    to create another class called a factory and use that to make objects. Thus, we
    created a Class and a corresponding UserFactory class, the latter containing a
    static create() method which happily returned freshly minted objects. It worked,
    it confirmed that the rule was true.


    Well, true only for as long as it took for the student to discover that it was
    all a bit of a fib. By that time, the suggestion was already planted and it was
    easier to describe why the “rule” was really a very strong suggestion. Even if
    the student has since learnt that a static create method on a factory class isn''t
    even the best approach, it still helped to evade a lot of future mistakes simply
    by locking the creation of new objects down to a single location. A win, but by
    dubious means.


    In any event, we''ve reached the end of Part One. Let me leave you here with a
    slightly awkward analogy.'
