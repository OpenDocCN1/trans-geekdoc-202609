    \ the data type definition, the client code that we build to interact with instances\
    \ of this data type will expect an instance of type Car to be yielded from a getCar()\
    \ method invocation. If that client code comes into contact with a SportsCarFactory\
    \ instead and the SportsCarFactory honours the data type definition, then a call\
    \ to the getCar() method on this factory should still yield a type of Car. Since\
    \ we know that a SportsCar is indeed a type of Car, our client code continues\
    \ to work just fine.\n\nI hardly need to do this, but lets just look at the other\
    \ case to confirm that our thinking is sound."
