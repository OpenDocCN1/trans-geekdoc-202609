- pgno: 295
  md: 'Ok, I accept that it''s a rather spurious example but it does serve our purposes
    here; the only reason that our controller accepts the $db object in the first
    place is to pass it to a factory method on a model class.


    This is The Courier anti-pattern in action. An object receives a dependency that
    it doesn''t actually use. Instead, it receives a dependency to pass it on to another
    object, method or function.


    Why is this such a problem?


    It''s one of those problems where, whilst it works just today it will almost certainly
    be broken tomorrow. It''s simply plain bad design.


    Let''s concentrate on the broken scenario though. Whilst we appear to be following
    first fix that was presented in the previous chapter, that of implementing a factory
    method on the target itself, that very factory method itself declares a dependency
    in its method signature.


    This in turn means that any code that invokes the factory method must supply that
    dependency.


    But if our requirements change? What if we come to our senses and decide to migrate
    from factory methods to fully blown factory objects or, better yet, a dependency
    injection container?


    In each case, a change to the way that we create Profile instances would entail
    a code change inside our ViewController class. No matter how good the global search
    and replace function in your IDE or editor of choice, you would be faced with
    the need to make changes, potentially far-reaching changes, in parts of the code
    base that needn''t be touched in the first place.


    This is precisely one of those situations where "I fixed this bit here, but now
    that there is broken" becomes an oft-heard phrase.


    Yet ever one unwelcome intrusion upon our most valuable commodity, high quality
    pub time, is entirely unnecessary.


    The way to fix this is to stop asking questions of the code itself. In a way,
    this is rubber


    duck debugging¹⁵ but with experience, the rubber duck becomes entirely optional.


    What are we really asking the controller to do?


    > ¹⁵https://en.wikipedia.org/wiki/Rubber_duck_debugging'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Do shoot the messenger 282\n\nIn essence, we need to pass the array of post\
    \ data to an instance of the Profile model so that the model can be updated accordingly.\
    \ What this actually means then is that the controller needs a means of acquiring\
    \ that Profile model instance.\n\nThat's not to say that we need to inject the\
    \ controller with the specific Profile instance that we're looking for, although\
    \ that would certainly be a plausible solution. Instead, we should looking to\
    \ inject our controller with a factory instance of some description; one that\
    \ can yield properly constructed Profile instances for us.\n\n```\nclass ProfileController\n\
    {\n    private $profileFactory;\n\n    public function __construct(FactoryInterface\
    \ $profileFactory)\n    {\n        $this->profileFactory = $profileFactory;\n\
    \    }\n\n    public function updateAction()\n    {\n        $userId = $_SESSION['user_id'];\n\
    \        $profile = $this->profileFactory->create($userId);\n        $profile->update($_POST);\n\
    \    }\n}\n```\n\nThere are a number of things to note from these changes. First\
    \ and foremost, the courier-like nature of our controller's previous state has\
    \ now been removed completely. The only dependencies provided to it are the dependencies\
    \ that it actually needs to use itself.\n\nA second, but no less important consideration\
    \ in this particular instance is that our controller is now completely divorced\
    \ from any notion of the application’s storage system. This is a critically important\
    \ change. Controllers have no business knowing anything about an application’s\
    \ persistence mechanism and the changes that we’ve made here ensure that is the\
    \ case."
  merge: -1
  img_proc: true
- pgno: 297
  md: '> We''ll get some of the whys and wherefores in the next chapter, But Don’t
    Talk To Strangers


    It is of course somewhat ironic that a dependency injection container might itself
    be considered a dependency but the actual truth of the matter is that it quite
    often is. At the end of the day, the reason for both why this chapter exists and
    why it immediately follows on from the chapter on Instantiaphobia.


    Often a developer''s first inclination when they encounter this fancily named
    super factory is to consider the dependency injection container to be the one
    and only, singular and unique source of all prepared objects within the application.


    As such, we''ll start seeing couriers cropping up as the container needs to be
    transported from one layer to the next, and on to the next. And on the next.


    Addressing this particular scenario is shockingly simple; look at the process
    in reverse and work backwards.


    As Lizzie might be keen to point out, it used to be the sort of developer that
    would think of the process in terms of a request coming in, getting processed
    and resulting in a response going out. That is of course how it is likely to happen
    within our application code.


    That’s also how a lot of beginners will address the matter of coding up a particular
    feature.


    But that’s not necessarily how we should think it before building it.


    In a multi-tiered application, this may involve devising a model factory that
    has a dependency on the persistence layer, with the model factory in turn being
    set on service instances by a service broker, which in turn might be set on controller
    instances.


    In other words, there’s no rule that we cannot create multiple dependency injection
    contains and have them as the bridge between each layer. The controllers, services,
    models and persist-able data objects can all be furnished by their own dedicated
    containers; discrete units with a laser sharp focus of operation.


    And with nary courier to be seen.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Now we really ought to get Lizzie back to her machine so that she can continue
    turning out awesome code for us.


    # Conclusion


    The courier is an anti-pattern that frequently rears its ugly head when a dependency
    injection container comes into play, quite simply because, as an instantiated
    object needs to be made available to the objects that require it.


    Nevertheless, when you encounter a situation that involves setting one object
    on another simply to have the receiving object pass it on again, rather than use
    it directly, you have an instance of The Courier.


    Invariably, this will lead to a critical loss of pub time quite simply because
    the the demands of the final recipient are likely to change. When that happens,
    and with a courier in play, you will invariably find yourself having to change
    the couriers as well as the code of the final recipient. That''s a critical loss
    of valuable pub time right there.


    In other words, the presence of a courier drags along with it the spectre of tighter
    coupling and all of the problems that such an apparition will invariably produce.


    Consequently, do indeed shoot the messengers at every opportunity. In the kneecaps.
    With the code equivalent of at least a .38 caliber. And take no prisoners whilst
    doing so.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Don''t Talk Strangers


    In the previous chapter, we started to look at how even the accidental implementation
    of couriers will, in all likelihood, make portions of your application fragile
    and susceptible to bugs. The example we looked at was a database connection with
    a controller in order to reach its final destination inside a model instance.


    The issue wasn''t that the code doesn''t work, or that it breaks occasionally
    (although it might if you haven''t wrapped the establishment of a database connection
    with the appropriate safeguards and error-handling). No, the issue is the fact
    that when the target code, you also have a string of other classes to consider
    if the reception of the database connection changes in any significant way.


    It''s very much a case of “I fixed this here, but now that there is broken!”


    This chapter focuses on a very similar problem and concerns itself with something
    known by many names, one of which is the Law of Demeter. Devised by Ian Holland
    back in 1987, the Law of Demeter isn''t a law, but a guideline. I suppose we can
    forgive the fine folks that came up with that particular moniker though, since
    “Guideline of Demeter” is somewhat less punchy.


    Emerson¹⁶ boils down the Law of Demeter into three succinct statements, which
    are thus:


    +   1. Each unit should have only limited knowledge about other units: only units
    “closely” related to the current unit.

    2. Each unit should only talk to its friends; don''t talk to strangers.

    3. Only talk to your immediate friends.


    In a way though, these three statements are a little too much on the succinct
    side. Without appropriate context or prior knowledge of this particular guideline,
    it isn''t particularly easy to intuit their meaning or their intended application.


    But hey, that''s what this chapter is for. Let''s get going.


    > ¹⁶http://emerleite.com/'
  merge: -1
  img_proc: true
- pgno: 300
  md: "# The Principle of Least Knowledge\n\nThat sub-heading up there gives us another\
    \ one of the names that this particular guideline is known by and at least this\
    \ time it's a little more indicative of what this topic is actually about. This\
    \ new name for it ties nicely with those three bullet points that we looked at\
    \ the first page of this chapter.\n\nThe idea behind the Principle of Least Knowledge\
    \ is that wherever you happen to be coding inside your application, the code that\
    \ you write should only express knowledge of its immediate surroundings. When\
    \ you follow this particular guideline, you're automatically promoting the notion\
    \ of loose coupling within your codebase, which in turn leads to a much higher\
    \ degree of maintainability.\n\nWhat on earth does this all mean though?\n\nClearly,\
    \ we need one of these examples around about now.\n\n```\nclass OrderController\
    \ {\n    public function addOrderAction() {\n        try {\n            $user->get()\n\
    \                ->getBalance()\n                ->deductAmount($orderTotal);\n\
    \        } catch (InsufficientFundsException $e) {\n            // handle exception\n\
    \        }\n    }\n\n```\n\nHere we are again with that woefully used and abused\
    \ addOrder method, looking for a simple way for our customer to pay their damned\
    \ bill.\n\nIn this case, it looks like we are passing the value of the order through\
    \ to a method called deductAmount(), catching the exception that might be thrown\
    \ if the user doesn't have enough funds in their account to pay for the order.\n\
    \nThis is fine, surely? We've got error handling in there, and even if you can't\
    \ see it in such a small snippet of code, there's lazy loading going on in the\
    \ background with the UserAccount and AccountBalance objects."
  merge: -1
  img_proc: true
- pgno: 301
  md: "Don't Talk To Strangers\n\n287\n\nLizzie's certainly familiar with this sort\
    \ of approach; they did it the time at her\nold place and the old place managed\
    \ to turn out some reasonably useful applications.\nThe latter doesn't change\
    \ the fact that Lizzie's last place was rubbish though.\n\nDon't tell her I said,\
    \ that we're lucky to have her with us.\n\nBack to the code. What is just the\
    \ problem with it, given the fact that it works when all\nis well, and catches\
    \ the exception when they're not? The answer to that lies not with\nthe fact that\
    \ it's perfectly operational today, but that it presents us with a potential\n\
    problem in the future.\n\nNothing will impact so negatively upon our valuable\
    \ pub time than code constructs\nthat provide fertile ground for defects to germinate\
    \ within.\n\nWith the preservation of pub time firmly set at the forefront of\
    \ our minds, it's time\nto look yet another name that this particular principle\
    \ is known by.\n\n# The one dot principle.\n\nThe first thing to note is that\
    \ this particular name was devised for those\nlanguages that separate objects\
    \ from their fields with the dot (period) symbol, which\nin real terms, is pretty\
    \ much all of them that except PHP and Perl.\n\nYou know the sort of thing. If\
    \ you've ever even the briefest look at Java, you\nhill have encountered the following\
    \ line:\n\n```\nSystem.out.println(\"Hello, World\");\n```\n\nOf course, in PHP\
    \ we use the arrow (->) to separate an object from its fields but\ntidea is the\
    \ same; if you're utilising more than one dot to access a property or\nmethod,\
    \ the chances are exceedingly high that you're not following the Principle of\n\
    Least Knowledge correctly.\n\nThe second thing to note is that this particular\
    \ version of the name for the guide-\nline/idiom/principle is the least accurate\
    \ of the bunch so far. Determining whether\n are conforming or violating the Law\
    \ of Demeter is a little bit more involved\na process of counting the dots.\n\n\
    Still, we haven't even gotten as far as considering why it's a bad thing, so let's\
    \ get\nraight onto that now by recalling the offending \"line\" of code."
