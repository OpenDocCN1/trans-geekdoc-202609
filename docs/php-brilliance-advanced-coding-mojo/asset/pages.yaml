    # Who does this guy think he is?


    For starters, I love programming. I wrote my first “program” we be hard-pressed
    to call in 1983 at the age of 12 (so now you know how old I am!) who had had programming
    since it was written in Sinclair Basic on a 48k ZX Spectrum. I''ve had a love
    of computers and what you can do with them ever since.


    Which in turn messed nicely with the increasing availability and popularity of
    the Internet in the 90s. Sure, some of it has diminished in popularity, especially
    since the web arrived to send things like WAIS and goofy scurrying back into the
    dusty halls of academia. Like many at this time, I learnt to develop applications
    using Perl and the CGI.


    Then PHP 3.x arrived on the scene in 1998 and that kinda changed everything. Already
    fluent in Java and Perl at that time, I switched (cue tears of misery from Perl
    and Java advocates!), PHP syntax was so more comprehensible than Perl’s. Results
    came far more quickly with PHP than with Java (you don’t have to recompile a PHP
    application after fixing a typo).


    It was at that point that web application development became a career choice as
    well as a hobby. Just in time to catch the first dot boom. It has been doing ever
    since.


    Aside from being a right tech-head, I also like my beer. And archery. My piano
    and my playstation. The vampire genre in all its wondrous and bloody glory, I
    love my cats even though they keep trying to get in the way of my writing. And
    I love the crazy, filthy, chaotic mess that is London, which is why I live here.


    Thunder March 2015'
