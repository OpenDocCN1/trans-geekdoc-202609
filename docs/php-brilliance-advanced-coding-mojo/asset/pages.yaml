  md: 'Code, but in the abstract sense.


    ```

    $myArray = array(''first'', ''second'', ''third'');

    print $myArray[7];

    ```


    ```

    // output is ''first''

    ```


    In another application, the Chief Architect has opted for a starting index of
    ‘42’ since it goes so well with their “I heart Douglas Adams” T-shirt.


    You get the picture. The image I’m trying to spraypaint onto the sides of your
    brains here is a relatively simple one, perhaps mostly because I’m a bit rubbish
    at drawing. This is it: if the attributes and characteristics of our most basic
    data types differ from one place to the next, how can we possibly and reasonably
    be expected to build robust, secure and reliable applications? The question is
    rhetorical of course, since we wouldn’t be able to. We might be tempted to migrate
    to an alternative language, one that doesn’t insidiously encourage such extensive
    maintenance nightmares


    Consequently, why can’t we apply the same sort of rigour to the custom data types
    that we create in our code through the use of the class keyword? I say we can.
    I say we should. Indeed, I say we must.


    For the safety and security of our application’s data, it is imperative that our
    data types, including our objects, behave consistently and in accordance with
    the specifications that are laid down. That means both for the types that are
    natively built into the language laid down, and so for the types that we add to
    the language whenever we declare an abstract base class. Just as arrays behave
    consistently from one php file to the next, so should the instances of the Animal
    type behave consistently from one to the next.


    PHP does help us in some way to achieve this. Whenever you use the abstract keyword
    for a class and optionally for method(s) within that class, PHP will place some
    restrictions on how that abstract class may be used. I’ll cover those briefly,
    just to make sure that you know what I’m talking about.


    The first of these restrictions is obviously that you may not instantiate objects
    directly from that class but must use a child class instead. This is spot on and
    in laying down this restriction, I think it helps promote the idea that we’re
    laying down the blueprint for a new data type.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Code, but in the abstract sense.


    The second restriction is that, for any of the methods in the abstract class that
    are also marked abstract, the developer is forced to implement abstract method
    in any child classes that he or she creates. This concept alone helps to bolster
    the idea that the abstract is imposing rules on its usage.


    Furthermore, the implemented method must have a level of visibility that is either
    the same or less restricted than stated in the abstract method itself. For example,
    if the abstract method is declared as being protected, then the implemented method
    in the child class must be declared as either protected (the same), or public
    (less restricted). However, the implemented method in the child class may not
    be declared private as it is more restricted than that of the method in the abstract.


    Additionally, the signature of the implemented method must also match the signature
    of the abstract method in the parent. To means that both should have the same
    name and type of input parameters. I would say here, because it is actually possible
    to define a longer list of input parameters in the implemented method but I''m
    only highlighting this in order to be factually correct. To my mind, able to have
    a longer list of input parameters in such an implemented method breaks the concept
    of an *immutable* data type in such a subtle way.


    When it''s laid out like this, it should be possible to divine the sense of it.
    Yet at times, I''ve been given the impression that somewhere along the line, we,
    as the collective PHP developer community, have allowed the very idea of abstraction
    is to become clouded. This may or not be down to the frameworks or the wellintentioned
    but factually wrong tutorials but in event, if we''ve achieved a little bit of
    common ground, a little of clarity over what abstraction can provide for us, then
    we can proceed as one.


    Of course, I left out half of the arguments – I''m saving those for the chapter
    on Inheritance, which is coming up after this, and for the chapter on Polymorphism
    which follows it.


    No discussion concerning data abstraction in PHP would be complete without raising
    the subject of interfaces, which is exactly what I shall do now. It is important
    to note though when we talk about interfaces from an abstraction point of view,
    we are considering the generic concept rather than a concrete implementation through
    the use of the interface keyword.'
