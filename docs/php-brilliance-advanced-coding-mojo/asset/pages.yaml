- pgno: 89
  md: 'Inheriting vast wealth is not always good.


    Tis a thing of beauty in all of its concise brevity. Can I leave this chapter
    to end here then? No.


    The reason we must force on in our quest is precisely because the process of inheritance
    also grants us the ability to really mess things up on a truly monumental scale.
    And I really mess things up. It isn''t too much of an exaggeration to state that
    every single time that I''ve seen inheritance handled correctly, intelligently,
    properly, I''ve witnessed a hundred truly awful implementations.


    Imagine if you will your company''s homemade ''MVC-like'' framework in which you
    create controllers by extending the View class. I''ll spare you the finer details
    of this particular horror story. For now, at least.


    # Why bother with inheritance at all?


    It''s a good question and one that becomes increasingly difficult to answer once
    we''ve banished ''code reuse'' and ''convenience'' as excuses. The answer indeed
    lie in the process of creating specialisations for the new data types that we
    previously fashioned into our abstract classes.


    One phrase that we are going to become familiar with as we progress through this
    chapter is “inheritance hierarchy” so I shall cover it now. An inheritance hierarchy
    occurs precisely at the point when you have one class definition extend another.
    As soon as you have a parent class and a child class, you have a hierarchy. You
    also have additional responsibilities.


    This is how the world works, of course. You create a child, you get additional
    responsibilities. From a programming perspective, it''s important to hold this
    notion of family in mind as you go on to create child classes. It is also important
    to hold your responsibilities in mind too, when you''re busy exerting your god-like
    powers and dabbling with the denizens that populate your application space. These
    responsibilities should become all to clear as we putter along.


    By this point, everyone reading this should certainly already know when you create
    an empty child class that extends another class, the instances of the child class
    will inherit all the public and protected methods and properties of the parent.
    I appreciate that this is very much Inheritance 101 stuff, but let''s take a look
    at some code, just to confirm that we''re on the same page.'
