    \n$first = \"12\"; // A string\n$second = 4.5; // An float\n\necho $calc->add($first,\
    \ $second);\n\n// Output: 16.5\n```\n\nEven though the first parameter provided\
    \ is a string variable, internally PHP can handle the type conversion to a float\
