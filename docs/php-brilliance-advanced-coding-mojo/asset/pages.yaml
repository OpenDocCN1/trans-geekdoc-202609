- pgno: 252
  md: 'And favour Composition too.


    The CsvFormatStrategy is neatly encapsulated within its own class and we''ve also
    taken the opportunity to refactor the algorithm to do a much cleaner, more elegant
    job of the required task. We might be preaching to the choir here, but this is
    a much more elegant approach.


    With just two output formatting strategies here, it should be clear that we have
    so eminently reusable reusable code here, allowing us to turn any array into either
    a JSON structure for sending the response to an API call, or for preparing a CSV
    file that can be emitted to the browser without needing to go anywhere near the
    file system.


    This is a key feature of the Strategy Pattern itself. Since these discrete units
    of behaviour are perfectly self contained, that is to say that they have no knowledge
    of the objects that consume them, they can be reused extensively.


    If you think briefly to the chapter on Inheritance, you may recall how we considered
    the possibility of moving a terribly useful method upwards to a parent class that
    it could be shared? Now at least, it should be patently obvious how employing
    composition is so much more powerful a mechanism for code reuse than trying to
    fudge things with inheritance.


    With the State Pattern and the Strategy Pattern we have seen two ways in which
    we can inject switchable behaviours into an object to modify the way that we act
    at runtime. These two powerful techniques let us change the way in our principle
    objects interact within our system without having to modify the objects themselves
    other than to make them receptive to the behaviours we wish to inject into them.


    These two patterns are more concrete examples of what is known as the Delegation
    Pattern in which an object, instead of performing a particular task itself, delegates
    that task to a helper object that it consumes. It is precisely in this way that
    we can support the kind of delegate polymorphism that we encountered back in Part
    One.


    We don''t always have to inject behaviours into our principle objects in order
    to favour composition over inheritance though. We can flip the injection concept
    on its head and inject the principle objects into wrappers to modify their behaviour
    instead.'
