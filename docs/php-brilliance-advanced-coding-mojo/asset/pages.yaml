- pgno: 86
  md: 'Code, but in the abstract sense.


    process: one that has little or no relation to the object that we''re actually
    trying to define through the coding up of a particular class.


    This chapter, like life itself, makes more sense when experienced in reverse (or
    perhaps on a second reading). The idea that I''m really trying to push here is
    that the creation of an abstract class is, in effect, the process of defining
    a new data type for the language we use on a daily basis. That''s largely because
    that''s exactly what it is. Data abstraction through class definition provides
    us with the power to say "Hey PHP, your array types aren''t a good fit for the
    data I''m handling, I''m gonna add more types.


    To achieve PHP Brilliance, we need to exercise caution though when we are defining
    new types. We want to achieve a tight but comprehensive definition of what type
    actually is exactly because we want the guys and gals on our collective teams
    to be able to achieve the same level of familiarity with the new type''s attributes
    and characteristics as they are with ones that are already in the language.


    If we can do that, if we can achieve this sort of understanding we are well on
    our way to building robustness into our applications. Conversely, whenever we
    add convenience methods to our parent classes, abstract or not, we are progressively
    clouding the new data type''s statement of intent and thereby increasing the fragility
    of our applications. Fragility leads to bugs and things falling over, of this
    you can be certain.


    Fight your way out of that jungle and bask in the dazzling brilliance of a sunny
    world built from rigourously new data types.'
