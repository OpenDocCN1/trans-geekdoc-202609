  md: "More pub time through interfaces.\n\n145\n\n```\nclass UserDataTransport\n\
    \    extends WhateverFrameworkAbstractModel\n    implements StorageInterface\n\
    {\n    ...\n}\n```\n\nYes, we've wrapped the framework’s base model class in an\
    \ arbitrary UserData-Transport class and in doing so, we’ve regained control of\
    \ the decision making process for our models and their interfaces. Look.\n\n```\n\
    class UserModel\n{\n    private $userDataTransport;\n    public function __construct(StorageInterface\
    \ $userDataTransport)\n    {\n        $this->userDataTransport = $userDataTransport;\n\
    \    }\n}\n```\n\nWhat is thisInterface we’re type hinting for? Frankly, anything\
    \ that we want or need it be - it gives us the opportunity to pass in anything\
    \ that fulfils the role of carrying the actual data values and providing some\
    \ sort of hook for trigger to the storage of that data. What we lose is the instant\
    \ access to a crudgemonly collection of convenience methods presented on our model’s\
    \ one interface but we (re)gain is complete control of the interface itself. This\
    \ is crucial to achieving PHP Brilliance. Our objects simply cannot adopt a laser-focussed\
    \ intent when they’re based on extending bloated abstractions, but they can do\
    \ exactly when we abstract away the bloated abstractions.\n\nNow at last, we can\
    \ achieve what we set out to - decide for ourselves whether our model objects\
    \ would benefit from a declared abstract data type. Why not, I ask? If your application\
    \ is going to deal with lots of different types of user, you’re at liberty to\
    \ define a User data type and create the required specialisations. You find you\
    \ have a need to declare different types of product? Go for it. Your own social\
    \ network might be full of diverse but readily identifiable data types."
