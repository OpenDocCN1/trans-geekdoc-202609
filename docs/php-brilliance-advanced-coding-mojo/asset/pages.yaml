    # When is a facade not a facade?


    “When’s a poltergeist.” is certainly one answer that we might give. If you’re
    already familiar with the Facade pattern, you’ll know that it’s a pattern that
    is designed to provide a simplified interface to a complex operation. Indeed it
    is the commonly accepted definition of the design pattern in question.


    It’s also my belief that it’s this definition and variations thereof that tend
    to lead developers to create poltergeists in the first place. The notion of hiding
    a complicated multi-stage process behind a single, simplified method call is naturally
    appealing. Correctly though, a facade isn’t just a push button but a coherent
    collection of methods presented as the interface on a particular package or set
    of related logical processes.


    If we have built it correctly, the EmailService, whilst only presenting the single
    send() method thus far, provides a clear means by which client code can trigger
    the dispatch of an email at any point during program execution. And yet, the complexities
    involved in constructing an email, including the parsing of a template, remain
    hidden from the client code.


    There’s a very distinct benefit to be gained from the use of Facades such as this:
    we can vary the actual logic that is employed in the dispatch of an email without
    having any effect whatsoever on the client code that needs to send.


    For an application that’s “going large” makes it superbly easy to switch from
    sending emails directly, to implementing a database backed queue system for email
    by piping through a queueing system such as beanstalkd, RabbitMQ or even Apache
    Kafka.'
