  md: "And favour Composition too.\n\nFor an e-commerce system, we can reasonably\
    \ assume that the customer’s billing address is very unlikely to change. The customer’s\
    \ delivery address might change but it’s also quite unique. The list of items\
    \ in the order? There’s a chance that items might be added or removed during the\
    \ lifetime of this particular order, but in the majority of cases we wouldn’t\
    \ expect a lot of change there.\n\nThe order status, though, is guaranteed to\
    \ change.\n\nWhen you’re planning a cache for application data, the cacheable\
    \ lifetime of that data is a key concern. For our e-commerce system, breaking\
    \ out the things that are certain to change the most and being able to cache the\
    \ rest will give us the greatest gains for minimal effort.\n\nWhen our order object’s\
    \ classname is dictated by one of the properties that is guaranteed to change,\
    \ we would be forced to hack around the issue to nullify that effect. Something\
    \ that we really don’t need to do.\n\nNot when we have the State Pattern to hand,\
    \ ready and willing to swoop in and save the day. Since we’ve already identified\
    \ the very thing inside we can encapsulate those changeable behaviours into custom\
    \ objects. Doing so will leave the rest of the order object in a very cacheable\
    \ state index.\n\nOur first task then is to start creating the order states that\
    \ we’ll need to represent the desired behaviour. Taking the previous examples,\
    \ we will end up with something like the following.\n\n```\nabstract class OrderState{\n\
    \    const ORDER_STATE = 'Undefined';\n    public function __construct(Order $order)\n\
    \    {\n        $this->order = $order;\n    }\n    public function getStateValue()\n\
    \    {\n        return static :ORDER_STATE;\n    }\n\nabstract public function\
    \ isDispatched();\n```"
