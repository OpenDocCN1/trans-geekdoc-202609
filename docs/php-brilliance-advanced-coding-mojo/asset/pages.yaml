    \ are included within the package. This hacks back to the core principle that\
    \ a child class derived from a parent will inherit all of the public and protected\
    \ methods of the parent and in making use of this principle, the third vendor\
    \ is promoting the idea of code reuse through inheritance.\n\nA particularly common\
    \ example of this is the framework that advises you to create your specific model\
    \ classes by extending their base model class, primarily because their base model\
    \ class already preloads with what is effectively a library of convenience methods.\
    \ If you've been following along with me thus far, you will already know that\
