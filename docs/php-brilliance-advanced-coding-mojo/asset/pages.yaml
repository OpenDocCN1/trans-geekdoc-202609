- pgno: 230
  md: '# Ghostbusters 216


    Decoupling the account creation process from the controller makes it possible
    to create users outside of the web context. What would be the benefit of this
    be? If we are rolling this out to a large organisation, or we have to migrate
    users from a legacy application to our shiny new one, the ability to create user
    accounts in bulk is going to prove most advantageous to us. Generating user accounts
    from an uploaded CSV file makes it cinch.


    The benefit of providing an independent email service should be immediately apparent.
    Nevertheless, now that it has been separated from the process of account creation
    will mean that we will have the opportunity to send a different email template
    to user accounts that were created in bulk - one that is eminently more appropriate.
    Further, for the singular web user, we can offer the facility to remain the welcome
    email independently of the form post that created their account in the first place.


    Even though we have to look at the "Tell, Don''t Ask" principle (that is coming
    up shortly) the elimination of this particular poltergeist led to us satisfying
    that principle''s requirements. This is not an uncommon side effect of poltergeist
    elimination and as such, we will be returning to our controller/service example
    again shortly.


    These are:


    +   - Transient and stateless objects

    - Single operation classes that are used only to trigger other operations or sequences
    of operations.

    - Temporary, short-lived objects that provide only control-like operations.


    Our rather short-lived and limited use UserRegistration object satisfies all three
    of these definitions.


    That it was stateless was perfectly apparent - the object had no properties and
    no methods to manage those properties. It also provided only a single method was
    used to control the account creation process and the sending of the welcome email.'
