    Speaking of which.


    # The State Pattern


    As far design patterns go, it’s the State Pattern itself that perhaps most overtly
    states (pun!) the case for favouring composition over inheritance. Like most patterns,
    one is intended to direct the developer towards an attractive solution to a common
    problem.


    In this case, the common problem manifests in an object whose behaviour is expected
    to change in accordance with changes to one or more property values inside the
    object itself. In other words, we have an object whose behaviour reflects the
    object’s current status.


    Perhaps the most readily accessible example of this is the lifecycle of a customer
    order within an e-commerce application. I’ll grant you, it’s such a cliche! Nevertheless,
    it will serve our purposes to perfection.


    If you’ve ever shopped online, for physical goods at least, it’s entirely likely
    that you will be aware that any orders will likely gone through a number of stages.
    For our examples, we’ll limit these stages to just the four most likely candidates:
    Pending, Processing, Dispatched and Cancelled.


    Back in the days of when dragons roamed English valleys for damsels to distress
    and when I still had hair on my head, I might, maybe possibly, have written code
    to represent an order’s state that looks something like this.'
