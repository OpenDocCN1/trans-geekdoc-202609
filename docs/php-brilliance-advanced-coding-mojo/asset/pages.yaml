  md: 'Talking points.


    In the example that we''ve just explored, the data type (VehicleFactory) informs
    our client code that the engine parameter should be at least a HighPerformanceEngine
    instance. As such, client code should only ever pass in a HighPerformanceEngine
    instance, or a more specialised (child class) version of it. As our hierarchy
    stands at present, the HighPerformanceEngine is the most specialised version on
    offer.


    Consequently, if client code will always be passing in high performance engines,
    our car and sports car factories will continue to work as expected, simply because
    the high performance variety is still identifiable as a type (child class) of
    RegularEngine on the one hand and BasicEngine on the other.


    Of course it''s a contrived example but our rules remain this. As far as overriding
    methods goes:


    +   1. The input parameters of child class methods should be either invariant
    (unchanged) or contravariant (in the opposite direction) in relation to the input
    parameters of the parent method.

    2. The data type of the return values should be either invariant (unchanged) or
    covariant (in the same direction) in relation to the return values of the parent
    method.


    No matter how counter-intuitive it might be for the input parameters, this is
    precisely what we need to do to avoid the bugs that crop up from failing to maintain
    type safety in our inheritance hierarchies.


