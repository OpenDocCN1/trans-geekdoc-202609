- pgno: 43
  md: 'Encapsulating our ideas.


    When we consider the topic of security from the perspective of an online application,
    we often concern ourselves with the issue of protecting that application from
    outside attack. We want to keep the bad guys out of our databases safe from evil
    wrongdoings. This is of course how it should be I also want to make sure that
    when we talk about application security, we reposition our view point to that
    of “data integrity”. Data integrity means not only that it stays where its supposed
    to, that is, inside the storage systems that we design and implement, but also
    that it remains correct and true.


    When we move on, let us just make sure that we''re clear on what this information
    hiding malark is all about. If we look again at super simple class above, the
    $name property is clearly out in the open. Any of our other code, when it sees
    an instance of this User class could happily change the value of the $name property
    directly and indiscriminately.


    ```

    user->name = ''Joe'';

    ```


    Pretty basic stuff! We can of prevent that sort of unrestrained data mangling
    by making sure that we declare the $name property as being private. When we do,
    we''re locking it away from public view and subsequently forcing any client code
    to utilise public interface we provide in order to request access to that data.
    Of course, such an interface we decide to provide will be laced with traps such
    as validation, authorisation and the like.


    > There are ways of achieving direct access to an object''s private properties
    but I''ll save those for later and only as cautionary tales. For the benefit of
    keeping the text flowing, I shall pretend for now that the value of a private
    property can in no way be modified directly from the outside. Hopefully, you''ll
    go along with me on that one.


    So now I''ve expended little more than a couple of pages highlighting the differences
    between encapsulation and information hiding as two independent things, what do
    I want to do next?


    Why, nothing less than put them back together again!'
