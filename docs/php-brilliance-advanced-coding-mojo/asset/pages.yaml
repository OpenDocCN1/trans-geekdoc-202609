  md: "More pub time through interfaces.\n\nwill take an array. We know that this\
    \ is true since PHP will exit with a fatal error if a class that implements the\
    \ interface fails to provide for the methods it declared.\n\nThis is why I like\
    \ to think of it as a guarantee.\n\nLet's throw together a simple illustration\
    \ of a class that proudly wears this guarantee badge.\n\n```\nclass CsvRenderer\
    \ implements ArrayTransformer\n{\n    public function getTransformed(array $data\
    \ = [])\n    {\n        // logic to turn $data into a CSV string.\n    }\n}\n\
    ```\n\nOur CSRRenderer has no idea objects will be engaging with it, nor should\
