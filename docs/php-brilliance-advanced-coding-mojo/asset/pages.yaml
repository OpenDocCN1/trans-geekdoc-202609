- pgno: 123
  md: 'Proding the polymorph.


    instances live entirely independently of the calculators that encapsulate the
    different repayment plan calculator logic.


    More to the point, it also means that we can change the way that MortgagePlan
    instances yield a repayment plan on the fly. Should our bank manager be feeling
    particularly generous one day and allow us to switch our capped mortgage to a
    fixed rate then no problem! We simply inject an instance of the FixedMortgageCalc
    into our mortgage plan and the repayment plan behaviour is automatically changed
    for us.


    To take this example back in line with the original theory, we are still supporting
    the “Same, different logic” idea that I first proposed; collaborators of the MortgagePlan
    instance will still be invoking the getPaymentPlan() method on this object. This
    is the “Same” part. Now however, the MortgagePlan instance delegates the responsibility
    for providing a repayment plan to whichever method of repayment calculator has
    been injected into it. This is the “different logic” part.


    There''s an additional benefit to using this approach too. If, in the future,
    we find ourselves in need of a new type of repayment plan calculator it will be
    significantly easier to implement. Afterall, we have the required interface already
    defined for us, we''ll just need to code up new repayment calculator to encapsulate
    the new calculation logic and we''re good to go.


    However, our analysis of delegate polymorphism wouldn’t be complete without turning
    our attention to the potential downsides of this approach. We, despite what I''ve
    just illustrated above, it''s not all sunshine and roses in the delegate polymorphism
    garden.


    The principle criticism of employing this technique is that it leads to the significant
    duplication of method declarations. Now don''t get all upped just yet! I''m not
    implying that we''re about duplicate the actual logic, merely the method names
    themselves. The practice has a term in what we must do is create proxy methods
    in our principle class to act as intermediaries between the client code and the
    real target of our inquiry.


    We can see this in the code above. If our principle class is the MortgagePlan,
    we can see how it provides on its public interface the getPaymentPlan() method.
    This getPaymentPlan() method performs no real logic of its own. Instead, it proxies
    the request to the instance of the RepaymentCalc that it has consumed.'
