- pgno: 12
  md: '# What is this book about?


    In a word, brilliance. PHP Brilliance is a meta-yardstick I’ve come to use myself.
    I say “meta-" since experience tells me it’s going to be a moving target. Five
    years ago, I would have featured the MVC design pattern strongly. Now, the world
    of PHP frameworks has matured to the point that it’s standing on the threshold
    of its twilight years. In five years time, such frameworks may not be mentioned,
    except in the historical sense.


    PHP Brilliance is then something I have grown to consider as a certain standard
    of programming knowledge as it applies to the PHP developer today. In its scope,
    it takes the core fundamentals of object oriented programming in PHP. It spans
    numerous principles and methodologies. It covers the pros and cons of various
    architectural considerations and it examines and extols good working practices.


    # Publishing, the leanpub way.


    I’m a big fan of the lean process model. I’m sure that much will come apparent
    when we get into the good practices section of the book and I love what good folks
    at leanpub.com have done to take the concept and apply it to the process of publishing
    a book.


    If you’re not familiar with the lean publishing manifesto¹, as put out by lean
    pub.com, I’m quoting it here. Please do visit the web site for a furthermore explanation.


    > Lean Publishing is the act of publishing an in-progress book using lightweight
    tools and many iterations to get reader feedback, pivot until you have the right
    book and build traction you do.


    Ironically, and maybe even hypocically, I’ve either applied or am intending to
    apply many software development processes to reach the final goal of a finished
    book.


    To begin with, at the time of writing I’ve completed the entire first draft of
    what I think should be in this book. This isn’t lean, which would naturally abhor
    such waste.


    https://leanpub.com/manifesto'
  merge: -1
