- pgno: 222
  md: '# Building on bedrock


    There. We have successfully navigated the foundational stuff. Don''t you feel
    better for it? I know I do.


    Even if the benefits of having done so are not apparent, they should do soon.
    Irrespective of whether it has been quite time since last considered things like
    encapsulation and inheritance or not, or even encountered them in a book, what
    we''ve actually been doing is getting that bedrock in place. Our goal has been
    to ensure that we have a solid foundation upon which to build those glittering
    palaces of software magnificence.


    The relevance of the first two parts of this book will become all too apparent
    within the forthcoming pages. In this part of the book, we step beyond those foundations
    and start putting into place what will eventually become the subliminal techniques
    that masters of craft somehow exhibit naturally.


    There comes a part in a craftsman''s career where conscious thought is no longer
    required when it comes to applying a hammer blow to the head of a chisel or to
    the stroke of a brush against canvas. Experience dictates how hard or fast the
    action should be. When such a craftsman finds himself stopping to gauge the speed,
    strength, or direction of the action, that''s the point where they fluff it.


    Here we''ll be considering the principles that will guide the software craftsman''s
    hand, with enough repetition to encourage them to become more “muscle memory”
    than conscious thought.


    Over the coming pages we''re going to explore the principles, patterns, and paradigms
    that are necessary for attaining PHP Brilliance. Only the essential ones though.
    It isn''t the intention for this to become a pattern catalogue, not least because
    there are already plenty of excellent examples readily available for the developer
    who is interested in such.


    Nevertheless, those that are presented here share exceedingly close ties to the
    material that we have already covered or the material that is yet to come.'
