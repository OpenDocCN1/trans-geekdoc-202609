  md: 'Progressive progression, objectively.


    have been around. Some of the core concepts are not subject to the short shelf
    lives of the last or the current or the next big thing. Sound principles have
    been around for a very long time and it''s both a good and a bad thing we can''t
    jump just juicy bits of good, sound, theoretical programming knowledge into the
    heads of newbie developers as soon as they get going.


    I say that''s a bad thing since it takes time and effort and a whole lot of mistakes
    to finally get the good stuff fixed into those developer brains, time we might
    better employ into building the next thing instead.


    And I say''s a good thing since the endless voyage of discovery keeps the appetite
