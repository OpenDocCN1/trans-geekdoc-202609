- pgno: 9
  md: '# Preface


    Thank you for picking up this book. Our journey starts here, just you and me.
    We''ll be navigating sections and paragraphs, following a treacherous trail. Some
    have gone before and sadly haven''t succeeded in reaching the final destination.
    But you, there''s something different about you. I''m not sure what it is yet,
    but once we''ve embarked on this journey together, I''m sure I''ll be able to
    put my finger on it.


    Let''s go.


    # Who this book is for.


    In a nutshell, I''m pitching this book at good developers who are keen to shine,
    to develop an almost supernatural ability to foresee and avoid future bug scenarios,
    to be awesome.


    This isn''t a beginner''s guide to PHP, nor is it intended to be a book for mid-level
    developers either. The intended audience that I''m writing for is one that mainly
    comprises developers at the Senior end of the scale, though I will freely admit
    that the term Senior Developer means wildly things to different people and across
    different organisations.


    As such then I''m attempting to gear the content towards an anticipated reader
    who is already familiar with the language and has been using it in an object oriented
    fashion for a number of years. How many years? Again, this is an exceedingly difficult
    to quantify. One developer who spent five years only installing WordPress and
    has not engaged in any personal study would not be as far along the curve as another
    developer who has spent the last six months dedicating themselves to accreting
    the mastery and art of managing components via Composer.


    In any event the reader, that is, you, will have a certain amount of commercial
    or commercial-like experience already under your belt. Quite likely, you''ll have
    tried and tested a few of the MVC frameworks that litter the PHP landscape, perhaps
    even settled on one as being your personal favourite.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Preface


    You’ll know some of the mantras and perhaps even fervently follow them; always
    programming to an interface and favouring composition are certainly two qualities
    firmly embedded in the mind of a developer that exhibits PHP Brilliance.


    In other words, this book is for if you''re the kind of developer that left the
    basics behind a good while ago, having developed a certain fluency with the language
    and generally only tend to consult the PHP manual when you need to remind yourself
    whether it''s needle then haystack or haystack then needle.


    # Why did I write this book?


    Now that''s a very good question and one that comes with a significant number
    of answers. That''s not hedging, by the way, there were, and still, several key
    motivators behind my taking up this potentially insane project. I''ll set them
    out below but please bear in mind that the order is arbitrary - each carries pretty
    the same weight as all of the others.


    There''s a massive clue to my first motivator in the preceding section. What on
    earth is a Senior Developer anyway? The term has an exceedingly fluid definition
    and in large part, highly subjective. A Senior Developer in Company A may only
    have achieved rank through time served, whereas a Senior Developer in Company
    B has gotten through through a demonstrable ability with the language. Even so,
    the Senior Developer in Company B might only be comparable in ability with a Mid-level
    Developer from Company C because Company C has an evil blast of a CTO heading
    the tech team. Irrespective of the scale of ranks that individual companies apply
    to their teams, it''s certainly the case in the UK that recruiters have lower
    standards for those who put forward for Senior roles. At one point, you only needed
    to put MVC and Zend on your curriculum vitae / resume in order to get submitted
    as a candidate for a senior dev position.


    Now don''t get me wrong, I''m not suggesting that this book is going to be the
    new yardstick for what a senior developer is or isn''t. I might be ambitious but
    perhaps not that ambitious about what can be achieved with this body of work.
    What I am aiming for, with regard to this particular motivator, is a way to find
    a common base for what I believe a senior developer ought to know.


    Another motivator if you like, is perhaps more of a reaction to the sheer volume
    of poor quality resources that are available online, in books and even through'
