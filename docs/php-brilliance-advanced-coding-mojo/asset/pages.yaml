- pgno: 87
  md: '# Inheriting vast wealth is not always good.


    Now that we''ve gone through Abstraction at some length, it''s time to turn our
    attention to the other side of the coin. If our understanding of abstraction has
    changed, or at least has been realigned somewhat, how then should we view the
    matter of inheritance?


    Once we have defined our new data type through the use of an abstract class, we
    can then proceed to create child classes using the extends keyword. This should
    all be old hat to seasoned PHP developers like your good self. As you might have
    guessed by now, that doesn''t necessarily stop me from wanting to upset the apple
    cart though.


    One idea that I''d like to introduce at this point is the notion that through
    the processes of abstraction and inheritance, we''re creating families of closely
    related data types. The idea of family should be a strong one: unless you''re
    the kind of PHP developer that was grown in a laboratory from stem cells, there''s
    a distinct possibility that you have parents. The chances are equally likely that,
    at some given point in the past, a male version of you somehow managed to mingle
    his DNA with a female version, with the end result the creation of a new human
    being. You, in other words. Accompanying this miraculous event, a newly jumbled
    mashup of existing DNA was sent forth to conquer the foibles of PHP application
    development. This book isn''t the place to discuss the mechanics of how this biological
    wonder actually happens but since you''re here and you''re reading this, we can
    at least conclude that genetic mashup was at least moderately successful.


    The key point? You as end result have inherited certain characteristics and attributes
    from your parents. You could, for instance, have the eyes of your father, your
    mother''s nose, your paternal grandfather''s fiery temper. In any case, whilst
    you may indeed be quite clearly one of these Smiths or one of those Robins, yourself
    are your own specialised version of them. There may be recognisable familial traits
    in there but you''re certainly not a direct clone of either parent.'
