  md: '# Progressive progression, objectively.


    Right. So we''ve taken a rather circuitous stroll through the heady world of our
    four central tenets and now our understanding of encapsulation, abstraction, inheritance
    and polymorphism has been reinforced. Solidified. Bolstered. Or maybe just confirmed.
    The upshot of this is that we have swept away all of the somewhat fragile inconsistencies
    and we, the members of Team Brilliance, now have some rock-solid foundations upon
    which we can build.


    Even if you haven''t fully adopted the line of thinking that I''ve proposing so
    far, even if you still feel like abstraction could somehow support reuse, you
    do at least have the advantage of being equipped to make a judgement call on it.
    In itself is a great boon.


    One of the truly great aspects to a career in software development, especially
    in online application development, is that the learning process never actually
    ends. As long as you''re in the job, there will always be something new to learn
    from. I''m not simply referring to the latest framework, design pattern or development
    environment either though these be the source of some of the greatest excitement
    in our world. Who doesn''t remember the first time they installed that shiny new
    MVC framework, wired together the routing, their first controller, model and view?


    However, we don''t, in general, learn good software development practices from
    the latest hot topic or bleeding-edge release of something sparkly and new. For
    sound software development, our education must be grounded in sound theory. For
    that, we need to look to older resources too - the ones that have weathered years
    of public scrutiny and still receive a thumbs up in the context of application
    development today.


    That last part is important. Obviously, it would do no good to look back to something
    published thirty years ago if it''s since been discredited. Nevertheless, clever
    people have been publishing academic papers on computing topics for as long as
    computers'
