  md: "By all means, write the process down in start-to-finish order in the customer\
    \ story but when it comes to coding it all up, try doing it backwards. And if\
    \ you're so inclined, write the unit tests first.\n\n# Is your code \"iffy\"?\n\
    \nI touched on this earlier but we're going to call it out into its own sub-section\
    \ now. Way back in Tell, Don't Ask, we will hit upon the point of not pulling\
    \ elements of an object's state out of the object in order to make logical decisions.\
    \ We need to take a moment to expand on this idea.\n\nThe keyword IF is an exceedingly\
    \ dangerous one. You might not believe me, of course. After all, it's one of the\
    \ first keywords that we encounter when learning a programming language. That\
    \ doesn't make the initial statement any less though.\n\nIn fact, the danger is\
    \ present when we employ any kind of conditional logic in our code.\n\nStatements\
    \ such as if (...), while (...) and even foreach (...) all add complexity to the\
    \ process flow that our application code executes. Anything that adds complexity\
    \ to our application also provides a fertile breeding ground for bugs. And what\
    \ do bugs mean? Critical, devastating blows to the preservation of our pub time!\n\
    \nConsider this as a slightly extreme example.\n\n```\n$uri = $_SERVER['REQUEST_URI'];\n\
    \nif (preg_match('**/\\#', $uri, $matches)) {\n    // load the home page\n} else\
    \ if (preg_match('**/blog/([0-9]+)$', $uri, $matches)) {\n    // load the blog\
    \ with post id $matches[1]\n} else if (preg_match('**/contact$$', $uri, $matches))\
    \ {\n    // load the contact page\n}\n```\n\nIs this maintainable? No, it's rather\
    \ a long way off from being maintainable in the slightest. Yet it illustrates\
    \ the point. When you employ conditional logic in order"
