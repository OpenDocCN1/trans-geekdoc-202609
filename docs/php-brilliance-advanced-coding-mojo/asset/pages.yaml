- pgno: 211
  md: '# Finding Closure.


    In any case, we can still trace this code backwards to examine why this sort of
    closure based approach is desirable.


    Starting with the very last line, we’re assigning the $session variable here with
    the content of the ‘session’ key stored in the container. With Pimple, the first
    time you access one of the container’s keys, the callable stored against it is
    invoked, yielding its return value. In this case, it’s an instance of the Session
    class.


    The truly relevant part at this stage is that the corresponding closure doesn’t
    simply return the new instance in isolation but configures that instance with
    the value returned from another one of the closures; this time it’s the one keyed
    against ‘session_storage’. Internally, this session closure instantiates and returns
    a configured storage object.


    This is where we start to reap the rewards from the effort of setting up the container
    in the first place. By laying down the configuration, with all its closures in
    one location, we get to appreciate the power and simplicity of the final line
    in that code snippet again.


    ```

    $session = $container[''session''];

    ```


    Far away from the original configuration and setup, the $session variable is being
    populated with a properly configured Session instance, one that is carrying all
    of its dependencies and ready to be used. Prior to the execution of this line,
    the session objects did not exist in memory and the class definitions hadn’t been
    parsed. This results in performance gains that are of great benefit to us if we’re
    hoping to construct something that is more than a basic “tin pot” website.


    Nevertheless, and to the point, this single line of client code has what’s going
    on in the background, nor does it need to know such details. This simple detail
    makes it possible for us to change the implementation of sessions and their storage
    quickly and easily. As as the new session code continues to honour the interface
    of the previous implementation, none of the session’s collaborators will be broken
    by the change.


    # Summary


    As I suggested at the start, it’s probably wise not to feed these critters after
    midnight.'
