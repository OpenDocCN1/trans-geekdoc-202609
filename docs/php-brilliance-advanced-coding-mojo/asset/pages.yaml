- pgno: 302
  md: '# Don''t Talk To Strangers


    ```

    $user -> getAccount()

    ->getBalance()

    ->deductAmount($orderTotal);

    ```


    In PHP terms, that’s three “dots” right there...


    Could we fix that code by adhering to a “single dot” approach like this?


    ```

    $account = $user->getAccount();

    $balance = $account->getBalance();

    $balance->deductAmount($orderTotal);

    ```


    The answer is emphatically no.


    All that we have achieved here is to move each of those three troublesome “dots”
    onto their own lines. The key problem remains, there’s just too much knowledge
    here.


    Not only is it aware that invoking the getAccount() method will return an object
    that presents the getBalance() method, it’s also aware that the return value of
    the getBalance() method offers the deductAmount() method.


    That’s just too much knowledge.


    In the language of the Law of Demeter, this line of code is reaching through the
    intermediate objects to invoke the deductAmount() method at the end of the chain.
    The way that we’ve written that code, even after we decomposed the chain down
    to three individual statements, expresses innate knowledge of how that chain is
    structured all the way to the final method.


    What we have here is another instance of tight coupling, which is something that
    we should always be trying to avoid. Tight coupling reduces the quality of the
    application code that we write by making it harder to maintain. Changes made to
    one piece of tightly coupled code require us to review and potentially modify
    all the other members of the tightly coupled relationship.


    To put this into perspective, imagine a situation where, months down the line,
    the business team pops up with a new requirement: instead of requiring our users
    to pre-fund their accounts, we’ll be offering credit facilities to a select few
    of them.'
  merge: -1
  img_proc: true
