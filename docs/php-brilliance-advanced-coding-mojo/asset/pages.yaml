  md: "Code, but in the abstract sense.\n\n```\nabstract public function say();\n\
    ```\n\nLooking at that line of code, there's clearly nothing there to tell us\
    \ what we're expected to return when we craft the implementations of this method\
    \ in the child classes that we derive from this abstract. The original author\
    \ of this code, the designer of this class has the power to communicate his intent\
    \ to the developers who will use this blueprint. The author, and indeed should\
    \ use docblock commenting to indicate the return type, resulting in code that\
    \ might look like this.\n\n```\n/** method description\n * .. other docblock tags\n\
    \ * @return AnimalSound\n */\nabstract public function say();\n```\n\nOf course,\
    \ you should provide the @return tag in the docblock for every method that you\
    \ create, but I feel that it's especially important for circumstances such as\
    \ this the method declaration on itself fails to specify the return type. Supporting\
    \ this idea is the convention that missing the @return tag implies that the return\
    \ type is void. That being the case, if you're authoring abstract methods you\
    \ should also provide the @return tag in a docblock whenever your expected return\
    \ value is intended to be anything other than void.\n\nIf you miss the docblock\
    \ and the child derivations end returning a whole gamut of different types, then\
    \ it's your fault. You bad person, you.\n\nBut if you provide the appropriate\
    \ docblock and the implementing developer ignores it and chooses to return whatever\
