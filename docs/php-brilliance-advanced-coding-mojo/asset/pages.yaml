- pgno: 167
  md: 'Putting a name on our spaces.


    we no longer need to select this framework or that framework to get our projects
    up and running.


    In recent years there''s been a steady by logical and accelerating shift towards
    using component libraries within an application''s design, and it''s easy to see
    why. Every web based application tends to have the same basic needs at their core.
    A very list might look like the following.


    | Component | Provides |

    | --- | --- |

    | Routing | For mapping request paths to the code responsible for generating the
    response expected under path |

    | Database/Storage | Most applications need to store their data somewhere |

    | Templating: | Simplify/standardise the process of generating response bodies
    |


    In real applications the list of high level components grow quite rapidly: caching,
    authentication, authorisation and configuration to name but a few of the extras
    that we typically come across. When we consider that no single framework currently
    offers the best breed solutions for all of our needs, it becomes harder to justify
    using a complete, monolithic framework at all.


    The developer exhibiting PHP Brilliance won''t be happy with just “making do”
    when the power to mix and match the “best of breed” components is quite literally
    at the end of their fingertips.


    If you need the best of breed routing solution in your application, it is really
    as simple as issuing the following command.


    ```

    composer require league/fastroute

    ```


    If you hadn''t already guessed, this is precisely why I called out the “compose”
    word earlier. The power of Composer is such that you can slot together your own
    MVC-like framework, one that uses the best of breed components for every high
    level requirement, in a matter of hours.


    > ^7https://getcomposer.org/'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Putting a name on our spaces.


    This of course completely destroys the argument that the all inclusive “one framework
    does all” approach brings any benefits with it beyond any kind of headstart offered
    through the developers’ own familiarity with one. For sure, I am not suggesting
    that you immediately start rewriting any existing applications to switch from
    a monolith to a component library, not least because there’s a certain fragility
    creeps into the code whenever a developer starts something new. What I am recommending
    though is that you do explore your own application in a component library fashion
    - simply by using fastroute you may surprise yourself.


    +   Nevertheless, I should also point out that the term “Monolithic” is used to
    refer to those frameworks that not only seek to provide all that is needed within
    the one package, but also makes it difficult for the developer to swap out, the
    templating engine for a better one. Many of the more popular frameworks these
    days are also going down the route of supporting componentized libraries managed
    by Composer. In any event, it should always come down to selecting the best tool
    for the job.


    # What has Composer got to do with namespaces?


    Quite a lot, as it turns. With the ever increasing popularity and burgeoning use
    of Composer as the dependency manager of choice within the PHP universe, it becomes
    harder and harder to ignore the manner in which it promotes the use of the PSR-0
    and most recently the PSR-4 standard for autoloaders. I won’t go into those standards
    here since they are explored in greater detail later on the book. Suffice to say
    here that the stringent requirements as set down in the standard actually make
    it easier for us poor developers to impose some sort of coherent order on our
    application’s codebase. This applies both to the code itself and to how it’s set
    out on the file system that holds it.


    Let’s take a look at an example.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "Putting a name on our spaces.\n\n```\n```php\nnamespace Vanquard\\BlogService;\n\
    \nuse Vanquard\\Service\\ControllerInterface\\\\ControllerInterface\\\\ControllerInterface\\\
    \\ControllerInterface;\n\nclass PageController implements ControllerInterface\n\
    {\n    ...\n}\n```\n```\n\nThis is obviously a very lightweight example that I've\
    \ concocted here just to help with making the few points that follow. Our first\
    \ consideration then is the namespace itself. You'll notice that I started that\
    \ with ‘Vanquard’. For PSR-4 compliance, the first element of a namespace must\
    \ always be what is referred to as the vendor namespace. This is a superficial\
    \ but very effective way of imposing a degree of separation between your code\
    \ and any libraries that you might pull in Composer. Remember that we're very\
    \ keen to a) use namespaces in our code to avoid polluting the global namespace\
    \ and simultaneously b) avoid any name collisions that might possibly occur should\
    \ we find ourselves with code that has identical namespace and class declarations.\
    \ Picking our unique vendor namespace makes it easy to achieve both goals.\n\n\
    A common practice would be to use either your github/bitbucket user name or indeed,\
    \ a suitable representation of your company's name as the vendor namespace or\
    \ if you're stuck for one and dont have either of these, you could just easily\
    \ visit Packagist and register a new account under a username of your choosing.\
    \ If the username that you pick is still available its automatically a good choice\
    \ for your own vendor namespace.\n\nWith the vendor namespace choice out of the\
    \ way, our next PSR-4 compliant consideration needs to be that we're required\
    \ to store the PageController class inside a ‘php’ file with a filename that perfectly\
    \ matches theclassname itself. This covers both the spelling and the capitalisation\
    \ being used. In our case here, the filename\n\n> *https://packagist.org"
  merge: -1
  img_proc: true
- pgno: 170
  md: "# Putting a name on our spaces.\n\nbecomes PageController.php. We do need to\
    \ honour the mandatory file extension of '.php' too, but since I don't think I've\
    \ seen anything else than '.php' out there in the wilds for a very long time,\
    \ it's hardly worth mentioning.\n\nAs you can see, the minimum requirements that\
    \ Composer imposes upon us to meet PSR-4 standards are quite achievable. Not only\
    \ that, they're pretty sane too! The only thing left to do is to tell Composer's\
    \ autoloader how to find properly namespaced classes.\n\nThis is achieved by adding\
    \ an autoload entry to Composer's config file, composer.json. Our simple example\
    \ above would result in an entry that looks very like this.\n\n```\n{\n  \"require\"\
    : {\n    ...\n  },\n  \"autoloader\": {\n    \"psr-4\": {\n      \"Vanquard\\\\\
    \\\": \"src/\"\n    }\n  }\n}\n```\n\nAll we've really done here is provide a\
    \ simple key->value pair that tells' Composer's PSR-4 compliant autoloader that\
    \ classes beginning with the \"Vanquard\" namespace can be found under the \"\
    src/\" directory relative to the composer.json file itself.\n\nHowever, our work\
    \ isn't quite over yet. We've only told Composer about our vendor namespace. To\
    \ remain compliant (and functional!) we still need to consider any sub-namespaces\
    \ left over after we've stricken the vendor prefix. In our example above, our\
    \ namespace is \"VanquardController\". Once we've stricken the \"Vanquard\" prefix\
    \ from the list, the only thing left is a single sub-namespace i.e. \"Controller\"\
    . PSR-4 tells us that should map directly to a directory underneath the directory\
    \ we mapped to the prefix in composer.json. Again, the spelling and capitalisation\
    \ are important here.\n\nThat leads us to a filesystem layout that looks something\
    \ like this."
  merge: -1
  img_proc: true
