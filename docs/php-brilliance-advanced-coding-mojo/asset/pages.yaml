- pgno: 156
  md: 'More pub time through interfaces. 142


    an interface is the way to go. It gives you the same constancy as using the `define()`
    function procedurally, but without the headaches that arise from polluting the
    global namespace.


    # Which witch is which?


    It''s not an uncommon question: when should you use an abstract class and when
    should you prefer an interface? Frankly, we already have a rather fleshed out
    answer with which to determine the most appropriate route to take.


    When we think back to the idea that our objects should be separated into the *knowers*
    and the *doers*, half of answer is already provided for us. As a general rule
    of thumb, the *doers* should be sporting an *interface* and wearing that eye-catching
    badge that says "Hey buddy, this is what I can do."


    Which leaves us with the other half of question to answer for the *knowers* in
    our system. Since, we''ve already determined that our *knowers* are the ones that
    act as the caretakers of our data, isn''t it reasonable to suggest that they can
    automatically be considered as data types? And if that''s the case, then shouldn''t
    we go down the route of providing an abstract class for?


    The answer to these questions is a rather ambiguous yes and no at the same time.


    What you need to do here is to dispense with the *knowing* aspect for just a moment
    and actually consider the requirements you''ve faced with. We have already considered
    how providing an abstract class is a means for specifying a new data type, but
    would this *particular knower* benefit from being defined as a data type itself?


    Let''s take a look at rather common use case in the PHP universe. If you''re working
    within an MVC-like framework, then our main source of knowers will be within the
    model layer. This is by definition what a model layer is supposed to represent:
    the data that resides within our application. The only other residents of our
    model layer will be the objects that encapsulate our application''s business logic
    within the context they operate with and upon the data within the model. It doesn''t
    take too much thought to be able to determine that the units of business logic
    floating around there can already be classified as *doers*, and as such we have
    already determined that they''re more likely to require an interface in preference
    to an abstract parent.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'More pub time through interfaces.


    Some of the frameworks out there would like you to think of the model layer as
    the database access layer. If a developer discovering MVC for the first time happens
    to choose one of these ‘model equals storage’ frameworks to facilitate his or
    her learning there’s every chance that idea will become enshrined within their
    heads. The key problem with this type of framework is that they tend to place
    unnecessary restrictions on their storage solutions. When you correctly separate
    the model layer (data) from the persistence layer (the code that handles the handling
    of data), you are better equipped to find the right storage solution for each
    particular element of data. Users? Well, they use RDBMS as myself prefer perfectly.
    Searchable blog posts made by these users? We''d be better served by storing them
    in a document database as MongoDB or ElasticSearch. What about our users’ friends
    and followers? Clearly, if we foresee a need to scale our application beyond a
    few thousand users, we should aim for a solution that appropriately has the data
    layer and the storage layer properly separated. You can''t do that with a framework
    whose base model is geared specifically for reading and writing to and from an
    RDBMS.


    However, it’s not uncommon for the framework to expect you to create model classes
    by extending a base model provided by the framework itself. Is the framework’s
    base model an appropriate data type definition? Rarely would this question be
    answered in the affirmative for the simple reason that the base model tends to
    be loaded with convenience methods.


    To take a case in point, recent framework popularity survey conducted by Sitepoint
    shows that the Laravel framework is the clear winner by quite a significant margin.
    Yet the Eloquent ORM implementation offers up a base class that’s absolutely chock-full
    of convenience methods. Don’t get me wrong, Laravel is not a unique offender,
    but when a developer uses this framework to create their own models, they’re importing
    over 3,000 lines of convenience methods into their model classes before they’ve
    written a single line of code themselves.


    Can such a developer remember every method that defined in such a base class and
    avoid accidentally providing an overriding method with the same name? It is fairly
    very unlikely that Laravel developer can recite the entire list of methods


    > http://www.sitepoint.com/best-php-framework-2015-sitepoint-survey-results/'
