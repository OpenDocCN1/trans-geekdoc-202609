  md: "Expressing good traits.\n\nIt’s something that I’ve already alluded to briefly\
    \ and it’s all about the question of visibility. When a developer is looking at\
    \ the code for a particular class and that class consumes a trait, it follows\
    \ that the developer no longer has the complete picture in front of them. Unless\
    \ they have both open side-by-side. Bearing in mind that our code is written for\
    \ a specifically human readership, we need to make sure that they’re comfortable\
    \ with the idea that employing the use keyword inside a class means that have\
    \ also have to consider a trait’s code as if it were inline within a class in\
    \ front of them.\n\nThis of course is very much like the need to check for parents\
    \ in an inheritance hierarchy, whereas a parent class requires the developer to\
    \ look “up” so to speak, a trait requires a developer to look sideways.\n\nWhich\
    \ in turn leads to the “horizontalisation” of the Yo-Yo problem. You see, even\
    \ though I haven’t even mentioned it yet, it’s perfectly possible for one trait\
    \ to consume another trait, which in turn can consume yet. As a result, we can\
    \ end up with a stack of traits bulging out of the sides of classes like one cancerous\
    \ tumour.\n\nIf the Yo-Yo problem describes a situation where an inheritance hierarchy\
    \ has so many levels that a developer needs to track up and down the class tree\
    \ in order to decipher the flow of control through an object, the newly horizontalised\
    \ Yo-Yo problem occurs when multiple traits are chained together and thus, leave\
    \ the developer with a difficult job of trying to work out which methods will\
    \ successfully make it into the final class.\n\n```\n<php\ntrait Foo\n{\n    public\
    \ function FooMethod()\n    {\n    }\n\n    public function FooTooMethod()\n \
    \   {\n    }\n}\n```\n\nHere’s the first trait in our proposed chain. It’s pretty\
    \ straight forward so we’ll dwell on it for long."
