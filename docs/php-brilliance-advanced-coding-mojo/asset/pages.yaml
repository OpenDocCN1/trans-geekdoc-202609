- pgno: 44
  md: '# Encapsulating our ideas.


    Going forward, I want to treat encapsulation as if it was both about bundling
    data and related methods together and making sure that we continue to hide the
    really sensitive bits. I didn’t want to proceed from this point without having
    already made the distinction between raw encapsulation as it truly is and information
    hiding as an independent thing. Now we can all move safe in the knowledge from
    here on, we’re going to treat encapsulation as being both encapsulation proper
    and information hiding at the same time. The idea being that those of you that
    started off in the “encapsulation is data hiding” camp and those of you that didn’t
    are hopefully now more aligned.


    # Protecting our data


    Our goal then is to protect our data and preserve its integrity. Here’s a novel
    idea – make everything private.


    It’s not quite loopy as if it sounds!


    An object that only has private properties and not publicly available means by
    which those properties can be manipulated an object that provides the maximum
    security for its data. Remember the saying that the safest, most unhackable server
    in the world is the one that’s switched off? Well, there is a direct parallel
    that you can draw here - the safest object that there can be the one with all
    private properties and no public methods. If all of the properties and methods
    of an object are private, then nothing untoward can happen to the data that it
    encapsulates. Of course, it’s not easy to imagine any kind of use for such an
    object.


    But let this be the basis for your approach to designing your object. Start with
    the idea that there be no valid reason for providing any public properties.


    One of the greatest strengths of PHP as a language is the speed at which it allows
    you to develop a working application. Indeed, much of the documentation that comes
    with PHP’s myriad MVC frameworks describe how to create a working application
    in under an hour. Paradoxically, this strength, this power of PHP to allow such
    rapid application development is also the languages greatest weakness. It actively
    promotes laziness. The kind of laziness is anathema to say, a time-served Java
    developer. Creating high quality PHP code quite often means trying to avoid the
    “happy path” and investing the time in going the long way around.


    Let’s look at this in greater depth.'
