  md: 'case of delayed satisfaction - those benefits will only be felt at some undefined
    point in the future.


    We may not know exactly when those benefits will be felt, but we do know the circumstances
    that will give rise to those benefits. This is the point where I suggested that
    your colleagues might begin to think of you as being psychic. Those circumstances
    are, of course, the ones that you require to change the way that a particular
    object is set up. This can be something as simple as providing a new constructor
    parameter, or as complex as injecting the target instance with other, supporting
    objects.


    This is all well and good, I hear you say, but how should we go about achieving
    this? If I''m supposed to develop an allergy to using the new keyword, if I''m
    supposed to suffer from an irrational fear of littering my codebase with new myClassNameHere(),
    are you going to tell me how to achieve this?


    Why, yes. Yes I am.


    Let''s start with the simplest idea first and take it from there. For those of
    you out there who hold a morbid aversion to static methods, please hold fire before
    taking a contract out of my head.


    # A factory method in every class


    If we want to achieve that goal of ever having one instance of the new keyword
    per class defined, the easiest approach to making a start on this is to add a
    factory method to the class itself. Or to put it another way, every time we create
    a new class in our application, we can add a factory method to that class and
    we''ve gotten the single instance of the new keyword covered.


    Here''s an illustration of that idea.'
