  md: 'Proding the polymorph.


    even though I didn''t use the term specifically. In our child class implementations
    of the data type declared by our abstract parent, we can provide methods that
    override those of the same name as declared in the parent. We just need to keep
    those three rules in mind when we do.


    Any changes to the method signature in the overriding method must remain compatible
    with the method signature as declared in the parent class. Any changes to the
    value that is returned from the overriding method in the child class must remain
    compatible with the type of return value declared in the parent class. And finally,
    if the overriding method in the child class can throw exceptions (or indeed, trigger
    an exception to be thrown) then these exceptions must be of the same type or derived
    from the exceptions that can be thrown by the same method in the parent. As long
    as we follow these three rules we''re keeping any future bugs and headaches down
    to a minimum. One telltale sign to look out for, one that quietly inform us that
    we''re failing to keep these rules, is if you find yourself needing to implement
    special logic in the client code to accomod the quirks of one or more child classes
    from a particular inheritance hierarchy. That is to say, if you find yourself
    writing conditional statements to determine whether you''re dealing with a RegularBullet
    or an ExplosiveRound then you can be sure that your child classes aren''t conforming
    to the data type definition that the parent class provides.


    There, I did warn you that I would repeat myself.


    Nevertheless, this is how subtype polymorphism should be handled. To the well-informed,
    this is going to look an awful lot like I''m trying to bend subtype polymorphism
    to the will of parametric polymorphism. Which I am, of course.


    # Parametric Polymorphism


    Before I enter to start the definition of parametric polymorphism, I feel that
    I have to state that PHP isn''t generally considered to be a language that natively
    supports the concept. Even so, the extraordinarily loosely typed nature of the
    language means that parametric polymorphism can be achieved straight out of the
    box, so to speak.


    Consider the following code snippet.'
