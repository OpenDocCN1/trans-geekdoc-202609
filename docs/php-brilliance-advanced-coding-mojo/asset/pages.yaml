  md: '# Don’t Talk To Strangers


    The critical line of code is this one:


    ```

    $user->payOrder($order);

    ```


    In one sweep we eliminated all of that extra knowledge that the action method
    shouldn''t have had in the first place. Even though I''ve left you to imagine
    how this method acquires the $user and $order instances in the first place, the
    simple act of passing the $order instance to the user''s $payForOrder() method
    would have served the pre-credit account era just well as the post-credit account
    online.


    In other words, knowledge of the inner workings of the order payment process has
    been removed from where it doesn''t. Our action method no longer has any kind
    of idea as to what happens to Order instance on the other side of the $payForOrder()
    invocation.


    Now, the only knowledge it has of process is that if an exception is thrown, it
    has to deal with it, which is exactly as it should.


    > If you''ve already encountered the Law of Demeter previously, you might have
    noticed how there are some distinct parallels between the example that we''ve
    been working here and the subject of a paper by David Beck entitled The Paperboy,
    The Wallet and The Law of Demeter in which he describes the process of paying
    the paperboy not by having the customer hand over his wallet, but by having the
    paperboy request payment and allowing the customer to organise how the bill gets
    settled. In other words, the paperboy has no need of ever seeing the wallet or
    even to know it exists in the first place. I heartily recommend reading this paper.
    It''s short and beautifully illustrates the point.

    http://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/paper-boy/demeter.pdf


    But does this mean that the logic that handles order payments now has to be moved
    into the User class?


    Not at all. The code we''ve already seen, and the nature of the story that Lizzie
    has to deal with, we know that it''s the UserAccount objects that are going to
    be dealing with order payments.


    What we''re adding to the User class is a proxy method, like so:'
