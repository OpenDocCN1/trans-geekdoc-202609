- pgno: 58
  md: '# Encapsulating our ideas.


    If you look at what we''ve done here, you can think of $udt instance as a seed,
    a kernel, a unit that simply represents the data that we want to persist to whatever
    storage systems we need to implement in our application. This is a very interesting
    point that we''ve arrived at. Our persistable data is now **encapsulated** in
    a discrete unit that is separate from and consumed by our model class.


    The is a key design goal that we want to achieve when building out a large scale
    application. We want our model classes to concentrate on behaving like the model
    classes that they are supposed to be. Taking the approach of injecting something
    like a data transport object into a model class allows us to divorce the model
    layer from the implementation details of how we handle data persistence.


    If you''re remotely familiar with one or more of the PHP application frameworks
    that are out there, you will probably be aware of the many and varied approaches
    that they take to implementing persistence when it comes to the model layer. In
    some cases you are expected to implement application models by extending a framework
    provided base model. In others, you are expected to mingle the design of your
    model classes in order to expose the properties that they manage to decorators
    and adapters. In either case, you''re required to adapt your model design to their
    persistence mechanism and in doing so, you''re expected to eschew at least one
    sound design principle or another. To my mind, this not only sucks but it also
    blows.


    By injecting the requisite kernel of data into your model classes, you free yourself
    from such principle-busting constraints. Your models can properly encapsulate
    the business logic that they were intended to and the vagaries of storage solutions
    are immediately and correctly relegated out of the model layer and into a persistance
    layer where they truly belong.


    What remains for our User class? We are still at the point where we are only seeding
    our model class with the data that constitutes the entity itself and are yet to
    provide the means of accessing and manipulating the data. Our starting point is
    through the provision of a standard set of mutators – the setters and getters
    with which we should be all too familiar. To support this, we''ll also need a
    private getter for the data transport object itself. Here, let show you in code.'
  merge: -1
  img_proc: true
