- pgno: 269
  md: '# Tell, Don''t Ask


    happen to this rather binary construct if the business team wander over to our
    desks and says this to us?


    “You know, we need more than just users and administrators, we need a member role,
    a moderator role, an editor role and a publisher role”.


    Were we to stick with the original, but erroneous approach given above, we would
    need to add several else if () cases to the original if else. Or Worse, replace
    the else with a switch() statement.


    However, if we had the foresight to apply the Tell, Don’t Ask principle correctly
    in the first place, our code could look this:


    ```

    echo $user->getWelcomeMessage();

    ```


    Now the business team can spend all of its time dreaming fancy new roles for our
    users and we won’t have to care. At least, not about which bits of view code we
    might have to modify in order to get each user type properly. The logic decision
    based on the value of an object property has been removed from the places where
    it simply doesn’t belong.


    Ah but”, I hear you say, “surely that’s just moving the if else into the user
    object, is it not? It’s not eradicating the problem entirely.


    To which will come the non-committal reply of “no, not necessarily”.


    Without wishing to go too far off-topic, let’s take a moment to look into the
    matter. Even if we were to move the if else construct into the User class directly,
    we would see a marginal improvement to our quality inasmuch that logical decision
    would be restricted to a single location in the code base. Remember, we want to
    keep our codebase DRY and not have repetitions of code strewn across several locations.


    However, since we’re looking to build enterprise-grade applications with the natural
    flair that Team Brilliance exhibits, we wouldn’t be using that if else construct
    at all in this case. Two possibilities for avoiding the if statement come immediately
    to mind.


    The first possibility would be to create an inheritance hierarchy surrounding
    the User class itself, and thus entailing the creation of a BaseUser abstract
    from which we'
