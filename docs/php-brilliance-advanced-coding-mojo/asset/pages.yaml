    knowledge.


    The learning process is well documented. Not just in programming circles but in
    any kind of trade or craft, a practitioner will go through a number of distinctive
    phases. At the start comes the novice, picking up the fundamentals and learning
    the first principles. It might be highly presumptuous of me to say this but I''d
    be prepared to wager a great many of us began this journey by writing "Hello World"
    on the screen, all thanks to Brian Kernighan way back in 1973.


    Advancing beyond the novice stage is the journeman, building upon the fundamentals
    by acquiring additional knowledge and combining it with experience in order to
    hone their skills and further their personal development before ready themselves
    for the final stage, that of the master craftsman.


    Traditionally, the title of master craftsman would be bestowed upon a practitioner
    by the guild that oversees their particular trade or craft. When ready, the journeyman
    would prepare and submit a piece of work as part of the application process and
    would be the members of the guild who judge such piece of work and establish whether
    they deem it to be worthy or not.


    In the world of online application creation we aren''t fortunate to have such
    a structured approach to personal development; one cannot readily apprentice oneself
    to an established master craftsman. As such, our journeyman stage is a low-joy
    skip through a sun-drenched meadow and much more a stagger through a perilous
    swamp filled with traps and pitfalls.


    It''s also huge, thanks to the Internet. The journeyman developer is literally
    inundated with opportunities to advance their knowledge and abilities thanks the
    plethora of materials available to him or her. There are courses to follow both
    online and in more traditional bricks-and-mortar learning establishments, there
    are articles and blog posts that are numerous to count.


    Which is precisely where the danger lies; the largely unrestrained and unregulated
    publication of tutorials and training videos presents a very real danger to the
    journecoder. With such an unfathomably large volume of information available,
    how does the journeyman coder hope to be able to sift the good quality information
    from the bad, especially when the bad keeps coming at an ever-increasing rate?'
