- pgno: 307
  md: 'Don’t Talk To Strangers


    Connecting code with its immediate collaborators is exactly what the Law of Demeter
    wishes for us to do. Let’s take another look at those three bullet points that
    we started this chapter with.


    +   1. Each unit should have only limited knowledge about other units: only units
    "closely" related to the current unit.

    2. Each unit should only talk to its friends; don''t talk to strangers.

    3. Only talk to your immediate friends.


    By revising our code to cut out the middle man (the User instance), we’ve brought
    our three "friends" closer together, the Order and UserAccount instances, and
    the ViewController itself. Even so, we’re still promoting loose coupling between
    the players within this system; the knowledge of how to handle a Chargeable item
    remains firmly where it should be and nowhere it shouldn’t.


    In this turns Lizzie to play merry hell inside the UserAccount object itself.
    As long as she receives a Chargeable object and emits an exception when the value
    of that object cannot be charged to the user’s account, it’s not going to matter
    much what the actual code implementation looks like. No other piece of code will
    get broken due to changes in the way that knowledge is implemented.


    This is the situation that we find ourselves in, one that promotes loose coupling
    and one that helps us to properly encapsulate the knowledge of potentially complicated
    operations into the places where they should be.


    The Law of Demeter helps us achieve both of these desirable outcomes.


    # Summary


    The Law of Demeter wants us to keep our friends close and our enemies as far away
    as possible, erecting barricades and boundary fences along the way. Tight coupling
    is one such enemy and, whilst it’s certainly unavoidable 100% of the time, erecting
    the proper boundaries allows us to avoid the miserable loss of public time at
    a distance effects.


    In our erroneous early example, our controller code was reaching through both
    the $user instance and the $userAccount instance to get the deductAmount()'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'method of the $balance instance. Hopefully now it should be clear how this
    can lead to problems. The developer that is working on the UserAccount or the
    Balance class isn''t necessarily going to be aware that the controller code was
    accessing the $balance instance''s methods directly.


    With the appropriate barrier in place, the payForOrder(Chargeable $order); method,
    the controller code becomes ignorant of any changes to the way that order payments
    are settled, which is precisely how we want it.


    One thing that we still have to guard against though is the proliferation of proxy
    methods that can lead to a bloated, muddied interface.


    But with loose coupling and encapsulation promoted through the application of
    The Law of Demeter, we''re golden.


    Don''t talk to strangers. Unless they''re offering to pick up your bar tab.'
