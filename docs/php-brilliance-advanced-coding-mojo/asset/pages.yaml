  md: "Inheriting vast wealth is not always good.\n\nThe reason that it is wrong should\
    \ become clearer when we shift our focus to a little. Our data type definition\
    \ as set out in the abstract parent class specifies that variables of type Mechanic\
    \ may have the fixVehicle() method invoked by supplying an instance of a Car as\
    \ the input parameter. Recognising the data type definition, our client code supplies\
    \ an instance of the Car type when calling the fixVehicle() method. This is the\
    \ only safe assumption that we can make because it is what is written into the\
    \ definition itself.\n\nIn light of this, the SportsCarMechanic has now broken\
    \ the contract that the abstract parent is promising. The SportsCarMechanically\
    \ accepts SportsCar (or even more specific) instances. When our client code sends\
    \ in a regular Car instance, which it does because the data type definition says\
    \ it, the SportsCarMechanic will choke and cause our application dies.\n\nSo let's\
    \ fix that bit of code.\n\n```\nclass SportsCarMechanic extends Mechanic {\n \
    \   public function fixVehicle(Vehicle $car)\n    {\n        // do car based repairs\n\
    \        return $car;\n    }\n}\n```\n\nHere, I've replaced the type hint for\
    \ the $car parameter with the more generic form of Vehicle.\n\nIt. Just. Looks.\
    \ Wrong. It's a SportsCarMechanic damit!\n\nAnd yet our rules state that if we're\
