    a trait to see what''s going on should *not* result in the need to mentally solve
    a “Towers of Hanoi” puzzle game just to work out what the end result will be.


    # Summary


    On the whole, this may have seemed quite a negative chapter by illustrating just
    how many pitfalls crop up from using traits. Even so, let this knowledge be a
