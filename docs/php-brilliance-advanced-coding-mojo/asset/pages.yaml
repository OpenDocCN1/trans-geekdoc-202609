    Now that they are object instances, we have to solve the issue of making them
    available at the points where they are needed. If, by chance, you are experiencing
    a little difficulty in visualising a solution to this particular problem, fear
    not, you are certainly not alone. This is one of the knottier problems of designing
    and laying out an application’s codebase. Despite this second problem being the
    more pertinent, we’ll deal with the solution in a more appropriate place. For
    now though, here’s a hint: It’s not “Build an implementation of the *Registry
    Pattern*


    Since we''re currently in a chapter that deals specifically with minimising the
    use of the new keyword, let''s tackle the issue of *newing* factory instances.


    What we''re looking at a solution to our problem is some sort of super factory,
    some sort of object that can yield instances of our *User* class fully made up
    with all of its dependencies satisfied.


    What we''re really looking for is one of these:


    # Dependency Injection Containers


    It’s a fancy name but in many regards, a dependency injection container behaves
    like a regular factory, but on steroids. In essence, a dependency injection container
    is an object that knows how to prepare, configure, create and manage other object
    instances.


    How does it know this?


    You tell it, is how. Whether you use a third-party container from a library or
    code your own is irrelevant at this stage. In both cases, you must seed the container
    with the appropriate object building knowledge, either through code directly or
    via configuration parameters.


    In either case, you will end up with a container object that provides access to
    the relevant factory methods in order to furnish your client code with the properly
    configured objects that it needs.'
