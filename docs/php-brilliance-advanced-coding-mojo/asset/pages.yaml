- pgno: 11
  md: '# Preface


    educational institutions. This is a quiet rebellion! It pains me to think that
    a newcomer to our wonderful community of PHP developers can go online, search
    for tutorials on object oriented PHP and end filling their tender, virginal noggins
    with all sorts of bad and in some cases, downright dangerous advice. Setting aside
    the conspiracy theories about search engines and their page rank algorithms, no
    one is yet courting the internet and whilst that is so, there seem to be some
    value in collating the good bits.


    Now I could just build myself a web site and link to all the good stuff...


    There are a lot of very good tutorials out on the internet. Lots of just the right
    information. This is great, but they don''t include the warnings or highlight
    the pitfalls of the very things that you''re teaching you. Whilst they tell what
    you can do, they don''t always tell you whether you should. They certainly don''t
    always include the pitfalls and gotchas and things to avoid on this topic or that.


    This is intentionally a key feature of the book''s unfolding before you; I want
    to highlight those very pitfalls and problems that can crop up in each particular
    topic rather than tell you that you can do this or what you can do. A case in
    point comes early on with the chapter on Abstraction. There are certainly no shortage
    of tutorials that will tell you that abstraction promote code, helps avoid code
    duplication. This is wrong but I''ll save the explanation for the relevant chapter.
    In some regards, you might consider this book to be a way to encourage the unlearning
    of bad habits that many of us have picked up along the way as well as a way to
    highlight the good stuff.


    Lastly, there''s an ulterior motive here, an almost selfish reason for this book.
    Over the last few years, I''ve picked over hundreds and hundreds of CVs, examined
    thousands of lines of sample code and spent hours upon hours interviewing candidates
    for various positions on the projects that I had a hand in. What dream it would
    be those candidates to discuss this book with me in an interview. What do they
    agree with? What don''t they agree with? Why not? I know I said that I didn''t
    intend for this book to be a yardstick for a senior developer or is''t, but certainly
    could be one that would help me gauge what sort of level a candidate is at, irrespective
    of any superlatives that the recruiter might have used when embarking on a drive
    to find new talent.


    With all of this in mind...'
