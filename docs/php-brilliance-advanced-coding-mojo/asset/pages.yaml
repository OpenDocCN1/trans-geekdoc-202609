- pgno: 70
  md: 'Code, but in the abstract sense.


    Abstraction promotes code reuse like going to work every day promotes going on
    a crime spree. I feel like this statement may a little clarification so let''s
    turn our attention back to Joe for a moment, for he''s a likable chap.


    Joe''s also dedicated to the job as all new hires should be. Every day, he turns
    up at the office, bashes out a few lines of code and pushes them to the master
    repo before heading home again for his supper. One of the reasons that he does
    this is that he hopes to get paid at the end of the month, which is as to be expected.
    When he gets paid tough, does he withdraw all of the money, go buy a gun with
    the compensation of his labour and proceed to rob as many grocery as he can get
    away with?


    One would certainly hope, no matter how likable he is. Turning up to work and
    doing the job that we''re paid to doesn''t necessarily mean that we''re going
    to spend our wages on a gun and robbing. Going to work and doing our job might
    allow us to just that assuming that we have such an inclination, but it''s not
    generally an idea that''s actively encouraged in polite society. In a similar
    vein, abstraction might well allow us the possibility of achieving code reuse
    but does not automatically follow that we should. And it certainly'''' promote
    the notion or encourage it in anyway.


    In actual fact, employing abstraction and inheritance as a mechanism for code
    reuse is a commonly recognised code smell. This is what frameworks do to your
    project when they ask you to extend from what is effectively a library of useful
    functions. They make your code smell.


    Do bear in mind that we''re no longer thinking of abstraction as a means of reusing
    existing code and avoiding duplication. We''re going to see in the upcoming chapters
    how we can create chunks of code that embody reusability, yet still allows us
    to stop polluting our parent classes. When I use the term “polluting”, does it
    give you a hint as to where this is?


    Let''s embark now on our journey to abstraction enlightenment. To do this, we
    will start by taking a look at what a class definition actually is and then proceed
    to consider how this simple notion may be applied to our class abstractions.


    In virtually all languages in today, whether strongly typed or not, we are supplied
    with the notion that we can hold our application''s data in variables of certain
    types. As you are already painfully aware, PHP is not one of those typed languages.'
