    A subtle difference has been introduced, and it''s one that isn''t as uncommon
    as we might hope. Instead of declaring the getTransformed() method as being abstract
    and therefore requiring a specific implementation in the derived children, what
    we''ve done here is an actual logical implementation of the method itself.


    The usual justification for this sort of approach is that, well, we''re setting
    up the default behaviour for the child classes. We know that code duplication
    is bad, so if most of our children perform this transformation, then we can set
    up a default method to avoid coding the same concrete implementations in the child
    classes themselves. Obviously this is quite a silly thing to do for the case of
    an AbstractRenderer data type bear with me please.


    The notion of providing ''default'' behaviour in the abstract parent introduces
    some complications into our code that we have to be very mindful of. The idea
    behind providing a default suggests some, but not all child classes will override
    this default behaviour in order to provide their own, more specialised behaviour.


    However, we have just changed the data type''s interface by explicitly stating
    that the getTransformed() method has a return value of type string. It''s not
    obvious but it is right there with the line


    ```

    return print_r($this->data, true);

    ```


    Do bear in mind that we want our child classes to honour the attributes and characteristics
    of the data type definition. To do so all of our child classes must also return
    a string value from the getTransformed() method. This makes sense when you use
    the interface presented by the abstract parent as being a guarantee. It wouldn''t
    be the (digital) paper it''s printed on if child classes can ignore said and return
    what they like from their overriding methods.


    This is a crucially important factor to bear in mind. If the guarantee that you
    want to provide should include a specific type of return value, then by all means
    write that specification into the abstract parent and by doing so, you lose the
    ability to require that a child class provides its own implementation. That may
    not be such a concern just so long as you remember that the abstract parent is
    now providing an extended'
