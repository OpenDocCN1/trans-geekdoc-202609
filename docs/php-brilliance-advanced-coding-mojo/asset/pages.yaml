- pgno: 117
  md: 'Proding the polymorph.


    function did in the first example. There''s still another key point to make on
    top of this though: As the consumer, the renderVehicle() method has no need to
    know the actual class name that the $vehicle parameter is an instance of. Only
    that it conforms to the interface that is specified by the more generic Vehicle
    definition as given by the abstract parent.


    At this point, I''d like to draw your attention back to that simplistic interpretation
    of polymorphism that I gave at the beginning of this chapter. Even though we''ve
    switched our focus away from the provider and towards the consumer, the idea “Same
    name, different logic” remains consistent with this type of polymorphism too.
    The same name component refers to the fact that we''re using the abstract parent''s
    classname when we hint the input parameter for the renderVehicle() method. At
    the same time, we know that the different logic component is satisfied by the
    fact that the method can receive any one of the derived class within within this
    particular family of types.


    As developers it should be quite plain to see that we use polymorphism regularly
    in our daily coding (or at least, I do) and therefore it should also be quite
    plain to see why I put so much effort into trying to get across this data type
    definition idea.


    I''ll say it again though. Of course I will. As long as we continue to correctly
    support the idea that the abstract parent provides us with the definition of a
    new data type and as long as we ensure that any class derived from the abstract
    parent continue to support the data type''s definition then we can reasonably
    expect the collaborators that work with instances of this data type to operate
    without error irrespective of which concrete class instance they end up with working.


    This is the very basis of generic programming as it applies to object oriented
    PHP.


    This discussion wouldn''t be complete though without an illustration of how we
    can break parametric polymorphism. It''s exceptionally easy to do. I know this
    is the case because I''ve seen it far too many times in far too many projects.
    It goes like:'
