  md: "Encapsulating our ideas.\n\nof work. This isn't the fault of the junior guys\
    \ of course, but of the guy(s) leading the development, those that are meant to\
    \ be steering the architecture, those that are meant to be responsible for mentoring\
    \ the team.\n\nOn the other hand, I've also been laying down the groundwork for\
    \ the topics that we'll cover when we get to the Single Responsibility Principle.\
    \ By the time we get to that one, you should find that you are already prepared\
    \ for it.\n\nNevertheless we all be at a point of enjoying an expanded consideration\
    \ of encapsulation, expanded in relation to the seething masses out there in PHP\
    \ land. Welcome to the club. I hope you enjoy your stay.\n\nI made mention earlier\
    \ that there were ways to access the private properties of one object from the\
    \ outside. One of those ways is pertinent to the topic of encapsulation, so I\
    \ shall mention it here. A good many of you will already know this but I'm going\
    \ to cover it anyway as I think it's appropriate that everyone be aware of.\n\n\
    It goes like this: When you have two object instances of the same class, one of\
    \ those instances is able to both get and set the private properties of the other\
    \ instance as if they were public properties. The basic premise being that if\
    \ an object has intimate knowledge of its own internal workings, it follows that\
    \ it has the same intimate knowledge of the internal workings of instances of\
    \ the same class.\n\nIt makes sense when you think about it as they say, a code\
    \ snippet is worth a thousand words so here's a practical example of this.\n\n\
    ```\nclass Point\n{\n    // Properties declared as private\n    private $latitude;\n\
    \    private $longitude;\n\n    public function getDistanceTo(Point $p)\n    {\n\
    \        // Access the private properties\n        // of the incoming Point instance\n\
    \        // as if they were declared public\n}\n```"
