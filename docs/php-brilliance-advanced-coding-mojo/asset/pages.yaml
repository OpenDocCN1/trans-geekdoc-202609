- pgno: 309
  md: '# Talking Points


    Now that we have arrived at the end of Part Three, it is time to wrap up those
    loose ends again. In this part of the book, our journeying has lifted us clear
    of the grassy veldt and propelled us into the thickly forested sides of the PHP
    Brilliance mountain-range. We have taken a winding trail, always upwards, between
    mighty boles and sinewy saplings, pausing only to inspect our surroundings when
    a break in the lush, leafy canopy overhead allowed spears of golden sunlight to
    push back fleeting shadows and bathe our surroundings in the warming glow of inspection
    and understanding.


    For the forest through which we walk is a very particular biome of the software
    engineering world, where every tree represents an individual design pattern, programming
    paradigm or software principle. If we were to catalogue every pattern, paradigm
    or principle out, it''s entirely likely we''d need an entire forest just to produce
    the index cards.


    There are lot of them out there, with many a book dedicated to them, though I''d
    only be inclined to recommend reading (wading) through the two essential design
    pattern books, Gang of Four book¹⁷ and Martin Fowler''s Pattern of Enterprise
    Application Architecture¹⁸ even though they can be a bit going at times.


    The forest of patterns, principles and paradigms can be so densely populated at
    times that it can prove difficult to pick your way through, without getting caught
    up tangled on any fancy idea or another.


    You see, Developers like shiny new ideas and there''s many a developer out there,
    once stumbling upon a shiny new design pattern, will endeavour to crowbar that
    into every bit of code that she he writes for the next week or month or so. It
    always worth remembering that design patterns and software principles are intended
    as solutions to problems; very real problems in the case of the former and rather
    nebulous, conceptual problems in the case of the latter.


    ¹⁷https://phpbrilliance.com/url/ta6

    ¹⁸https://phpbrilliance.com/url/x11'
