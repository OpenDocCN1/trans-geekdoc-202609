  md: 'Talking points.


    114


    it comes down to how we set the code out, how we structure it, how we tie it all
    together, the thing counts is how we make it comprehensible to PHP developers
    like ourselves and the others around us.


    Which brings us back to our monolithic “entire app in a single class” concept.
    I know for certain that I would have no chance of fathoming out an entire application
    in a single class, assuming the extent of the code ran to hundreds of methods
    and tens of thousands of lines of code. I''m not sure I know anyone who could.
    Even if we were able to get it into our preferred editor of code without crashing
    the blessed thing, comprehension of the application’s inner workings would be
    fragmentary at best.


    So we need to break it down into more manageable chunks, to get into a more workable
    format that recognises the foibles of the people that will work on. For an excellent
    starting point, remembering to separate our *knowers* from our *doers* will help
    us achieve this.


    Do you remember that I mentioned of some developers felt inclined to treat a particular
    class like a solo? If some method can be seen as vaguely user-related, in it goes.
    This is the start of the troublesome trail that ultimately ends up with the “app
    in a class” effect. It starts with the notion that we need to isolate the nouns
    in our design but at the other end of the spectrum, it results in a recognisable
    anti-pattern known as the “God Object”.


    # God objects


    The God Object occurs precisely at the point when an object can be deemed to know
    too much or do too much.


    That''s quite a sweeping statement with virtually no qualification, so let’s go
    ahead and try to qualify it. The term “God Object” was coined to represent the
    manner in which an object appears to become “all knowing”, that is to say that
    its influence is felt in many parts of the codebase at large, either referring
    to large parts of the codebase external to itself or more commonly, through large
    parts of the codebase having to look to the *God Object* itself for, processing
    or both. From personal preference, I like to attach the idea that a *God Object*
    is not just “all knowing”, but also “omnipresent”.


    How is this a bad thing?'
  merge: -1
  img_proc: true
