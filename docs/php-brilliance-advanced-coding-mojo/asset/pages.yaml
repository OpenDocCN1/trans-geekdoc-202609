  md: "More pub time through interfaces.\n\nguarantee that includes return types as\
    \ well. That guarantee is there to inform client code how this data type behaves.\n\
    \nAs such, it's our responsibility to ensure that that guarantee is honoured in\
    \ every class that we derive from the parent. Some developers either aren't aware\
