- pgno: 65
  md: '# Code, but in the abstract sense.


    If you''ve been fortunate enough to have a formal education in Computer Science
    then there''s a very high probability that you''ve encountered the term Abstraction
    a surprisingly large number of times. Academic approaches to Comp Sci will then
    talk about abstraction in relation to both data handling and flow/process control.


    If, however, you''ve arrived at this point as a naive developer, then your understanding
    of Abstraction is likely one gleaned from the PHP manual, books on PHP programming
    and those pesky online tutorials that I seem to keep grouching about. That''s
    ok. It''s important to bear in mind from an Object Oriented PHP point of view
    when we talk about abstraction, we''re talking about data abstraction and abstraction
    of control. We''re going to deal with those in the coming pages.


    > It used to be that someone creates art but who hasn''t undergone formal training
    or art education was referred to as being a Naive Artist. The works that they
    produced were referred to Naive Art. It''s not intended to be a derogatory though,
    just a form of classifying art that is produced by someone who hasn''t had the
    formal training. I''m borrowing the term naive here to refer to someone who hasn''t
    been through the formal training in their field of expertise. In our case, I''m
    using this specifically to represent those of us who don''t have a degree in Computer
    Science. And for reference, I too am a naive developer in this regard.


    Remember Joe from our previous discourses? The likeable chap who''s new to our
    team. Well, he''s back again and seemingly much more happy to help us in our explorations
    of Abstraction.


    Whereas encapsulation is a topic that we rarely think about, abstraction is one
    that is hard to get away from. Something that is especially true for anyone who
    has had exposure to any of the open source MVC frameworks that litter the PHP
    landscape. As a rough guess, I''d say that this is pretty much all of us-en'
