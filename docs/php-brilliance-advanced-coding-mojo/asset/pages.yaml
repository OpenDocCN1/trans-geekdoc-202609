  md: "# More pub time through interfaces.\n\nWe have already touched on the concept\
    \ of interfaces whilst we were discussing abstraction a few chapters back. Within\
    \ this chapter, we'll bring that idea forward with a more detailed look at both\
    \ the conceptual interface and the concrete interface as defined through the use\
    \ of the eponymous keyword.\n\n# An interface is... an interface\n\nBefore we\
    \ get onto the theory of how we should be employing the use of interfaces within\
    \ our application code, let's just take a brief refresher on how an interface\
    \ is defined.\n\n```\n<?php\ninterface InterfaceName\n{\n    /**\n     * Example\
    \ method definition\n     * @var mixed $parameter\n     */\n    public function\
    \ methodName($parameter);\n\n    // any other method definitions\n}\n```\n\nAll\
    \ very straightforward then. Within this very simple interface definition, I've\
    \ provided for the specification of just a single method, named here as methodName().\
    \ All very straightforward indeed."
