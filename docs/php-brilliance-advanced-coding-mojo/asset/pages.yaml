  md: 'Nothing kills the appetite for automated testing quite like the test suite
    that takes in excess of ten minutes to run. A test suite, even one that runs to
    thousands of individual unit tests, should complete in a matter of seconds.


    > Ever the creative sorts, programmers have gotten around this “dragging the database
    around” problem by allowing their database singleton to be set up with a mock
    connection instance. Whether it’s appropriate to write test oriented code rather
    than application oriented code is another debatable topic though.


    So where do we go from here? What''s our next option for improving on this scenario?
    Well, now that we''ve successfully exticated our feet from the boggy mire of free
    and wanton new keyword usage having dried our feet and warmed our toes on the
    fire of the factory method, we should now be well prepared for the next stage
    of our journey.


    # Providing dedicated factory classes


    The subheading suggests, our next step along the object creation adventure is
    to move those factory methods into dedicated classes of their own.


    At this stage, the in-house rule becomes: For every class in the application,
    there should be a corresponding factory class.


    For our rather simplistic example, the migration process of moving from factory
    methods to dedicated factory classes becomes a straightforward cut and paste operation.


    We cut from the User class, leaving us with:'
