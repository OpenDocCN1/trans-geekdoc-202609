    of having been equipped with sufficient knowledge to foresee how we might avoid
    traits creeping into our applications. Whenever we learn something as a developer,
    we enrich our mental toolbox.


    Knowing just a few of the things in here will help deliver better judgement when
    it comes to traits. In the same way all of the preparations for the Millennium
    Bug made the Millennium Bug a non-event, we can avoid the pain of time spending
