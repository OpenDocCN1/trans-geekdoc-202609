- pgno: 345
  md: 'PHP7


    331


    Clearly then, the opponents have a very strong case. How do the arguments stack
    up on the other side of the ring?


    # In the red corner


    The benefits for being able to type hint for scalar values are immediately obvious,
    but before we even get on to considering those there''s a particularly relevant
    point to make first.


    We can type hint for everything.


    If you loop your mind back to the beginning chapters of the book, you''ll remember
    the effort we went through to consider abstract classes as a means of laying down
    definitions for new data types. Why did we do this? We did this in recognition
    of the fact that the language''s native data types don''t fully represent our
    needs. They''re not intended to of course. Through the provision of our custom
    data types we are making it possible for our application''s code, and more importantly
    the developers wrote it, to enjoy the knowledge of how these things are intended
    to work.


    A key part of this is that the abstract class documents as best as it can the
    intended behaviour of the instances derived from this data type. Part of the abstract''s
    documentation includes informing the client code, the collaborators, how many
    parameters each method expects and of what type they should be. Unless those parameters
    are intended to be scalar values, that is.


    Further, we re-examined the role played by interfaces and how they allowed us
    as developers to express guaranteed method availability in the objects that implement
    them. In the same way as with abstract classes, we are able to express the requirements
    of the methods in these interfaces quite succinctly. Again, with the exception
    of parameters expected to be scalar values.


    The provision of scalar type hinting completes the circle. This alone provides
    enormous value to us as developers keen to exhibit PHP Brilliance. It''s another
    weapon in our fight against the army of bugs that threaten constantly to creep
    into our applications and eat away at our precious time.


    Going forward, scalar type hinting would make it possible for us to "type hint
    all the things". As far as the input parameters are concerned, every method we
    come would be able to declare for everything it needs and expects, rather than
    just most of them.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "# PHP7 332\n\nIn this regard, scalar type hinting would eliminate one more\
    \ element of fragility of our code. Reducing fragility naturally means increasing\
    \ the robustness and security of the resulting applications.\n\nIf we can type\
    \ hint for strings, integers, floats and booleans like we can for everything else,\
    \ we will no longer have to expressly validate for them. Nor will we need to re-cast\
    \ input parameters to the types that we're expecting to work with, a sub-optimal\
    \ approach can lead to the subtle and silent corruption of our data.\n\n```\n\
    <?php\nclass Calculator\n{\n    public function addThe($a, $b)\n    {\n      \
    \  $a = (int) $a;\n        $b = (int) $b;\n        return $a + $b;\n    }\n}\n\
    \n$calc = new Calculator();\necho $calc->addThe(\"3.14\", 2);\n\n// Output: 5\
    \ instead of the expected 5.14\n```\n\nWe made that bug. Well, okay, I'm quite\
    \ happy to accept all the class of blame for the above. As the author of this\
    \ particular version of the Calculator class, I was expecting to work with integer\
    \ values, which is why I cast the inputs to integers before adding them. Nevertheless,\
    \ the client benefit beneath the class definition is expecting the calculator\
    \ instance to just, you, know the numbers together. It's a perfectly reasonable\
    \ assumption since that is what is implied in the method signature.\n\nOf course,\
    \ the code in my class would have been better made if it didn't silently mangle\
    \ the inputs that the addThe() method was taking in by casting them to integers.\n\
    \nSilent input mangling happens all over the place in PHP world and leads to ever-so\
    \ subtle bugs cropping simply because our code is trying to coerce unexpected\
    \ values into the types that the internal logic needs to work with. Scalar type\
    \ hinting"
  merge: -1
  img_proc: true
- pgno: 347
  md: 'PHP7


    allows us to avoid this kind of mangling, leading to much more expressive method
    signatures and much more explicit instances of where casting from one type to
    another is required.


    # It''s a knockout!


    After a lot of to-ing and fro-ing on the RFC front, those smashing ladies and
    gentlemen on the PHP Internals finally arrived at a version of the document²⁴,
    which went on find favour with an overwhelming majority. This means that we can
    start to consider how we might take advantage of this quite significant change.


    Mercfully, distilling that rather voluble document into actual implementation
    details leaves us with something terribly easy to assimilate into the box of knowledge
    sat atop of our shoulders. Once a technique is in our heads it becomes correspondingly
    easy to implement in the code that we produce.


    There''s a caveat though. There''s always a caveat.


    First of all comes a quick run down of the scalar types and the keywords that
    we use for hinting them.


    | Scalar data type | Type hint “keyword” |

    |---|---|n| Strings | string |

    | Integers | int |

    | Floats | float |

    | Booleans | bool |


    It''s worth noting at this stage that the RFC specifically excludes the provision
    of aliases, so for example, in the case of integer values, we have to use int
    as the type hint and not integer. Equally, we''ll need to adhere to bool as a
    type hint rather than boolean.


    A little sample code should make their usage abundantly clear, so let''s take
    a look at that.


    > ²⁴https://wiki.php.net/rfc/scalar_type_hints_v5'
  merge: -1
  img_proc: true
- pgno: 348
  md: "# PHP7\n\n```\n<?php\nclass ScalarTypeHints\n{\n    public function setInt(int\
    \ $int) {}\n    public function setFloat(float $float) {}\n    public function\
    \ setString(string $string) {}\n    public function setBool(bool $bool) {}\n}\n\
    ```\n\nThere isn’t really a lot to add in terms of the implementation details,\
    \ but there are a few curiosios to consider in terms of their operation style.\n\
    \nSimply writing the scalar type hints into the method signature isn’t sufficient\
    \ to guarantee that the method will only accept the data types that are being\
    \ hinted for. If you’re potentially scratching your head over that particular\
    \ statement, you wouldn’t be alone in doing so.\n\nClearly, we need to look into\
    \ this then.\n\n```\n<?php\nclass Calculator\n{\n    public function addThe(float\
    \ $a, int $b) {\n        return $a+$b;\n    }\n}\n```\n\nNotice here that I’ve\
    \ changed the second parameter to type hinting for an integer instead of a float.\
    \ You might reasonably expect that this would mean PHP will error out if we tried\
    \ to give it anything other than an integer for parameter number two. Even though\
    \ this is the case with any other data type, it’s sadly true for the scalar type\
    \ hinting implementation as it stands today.\n\nWhat this means in real terms\
    \ is this: When you type hint for a particular class or interface, failing to\
    \ provide a parameter that supports that class or interface definition results\
    \ in a fatal error. This is exactly how it should be of course."
  merge: -1
  img_proc: true
- pgno: 349
  md: 'With Scalar type hinting it''s different. Since PHP is historically a weakly
    typed language, it''s always supported the idea that the underlying type of a
    particular variable can be changed to suit the circumstances described in code.
    Like this:


    ```

    $myVar = "42"; // $myVar defined as a string

    var_dump($myVar * 2);


    // $myVar type internally changed to integer to perform multiplication

    // Output: int(84)

    ```


    As a result of this, it looks like PHP will continue to support the internal casting
    of a variable''s type from one to another. When we look again at the add() method,
    what will actually happen is that PHP will attempt to cast the first parameter
    to a float if it isn''t already one. Likewise, the second parameter will be cast
    to an integer, again if it isn''t already an integer.


    Where these casts are possible, it does least mean that the logic inside the method
    will get the data types that are being type hinted. On the other hand though,
    allows for a very subtle problem of data corruption, which we should be particularly
    interested in avoiding.


    ```

    $calc = new Calculator();

    var_dump($calc->addThe(3.5, "2.75\));


    // Output: float(5.5)

    ```


    Quite reasonably, we would have expected the result to be 6.25. That''s not what
    we''ve gotten back though, we''ve been given the answer of 5.5.


    It would appear that our calculator class is broken. The reason why comes from
    the fact that our second parameter, "2.75", was silently cast to an integer on
    the way in. As a result, our method''s internal logic was dealing with an integer
    value of 2, rather than the intended value of 2.75.


    If the type cast is possible, PHP won''t complain. Even if converting floats and
    float-like strings into integers results in data corruption occurring from our
    perspective as the developers and bug-fixers of the code.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# PHP7 336


    This represents a significant challenge. If we type hint for a parameter that
    supports the ArrayAccess interface, PHP will complain when we fail to give it
    one. If we type hint for a scalar value, PHP7 will only complain if it can''t
    perform the type cast internally.


    Given that we''re perfectly capable of explicitly casting from one scalar to another
    if we truly needed to, i.e. $int = (int) "31.25"; I think it''s preferable to
    have PHP complain when we have a method expecting one type but getting a different
    type passed in.


    Can this be achieved? The answer is yes, but the solution is rather a clunky one
    in my opinion.


    We can tell PHP7 to turn on strict checking by adding a statement to the top of
    every file that needs it. The format of that statement is this.


    ```

    <?php

    declare(strict_types=1);

    ```


    It should be noted at this stage that declare() statement must be the first directive
    in each file that requires strict type checking. When declaration is in place
    at the top of the file, then our scalar type hinting will work as we expect it
    to. That to say, PHP will raise an error if we tried to pass a float as a parameter
    that was hinted as an integer. Equally, we''ll also get an error when we try to
    pass a numeric string when the hint requires a float or an integer.


    > Just to confuse matters, when strict checking is turned on, you can still present
    an integer to a method expecting a float. This is a "feature" since integers can
    be readily cast to floats without any loss or corruption. Integer 42 simply becomes
    float 42.0.


    This is what is needed. Rather than type casting happening silently in the background,
    if we we have a string and it needs to be either of the numeric types, we will
    be required to explicitly perform the cast in our code instead. This significantly
    improves the visibility of any errors that we make when performing the type casts
    manually and as such, will give us an easier time of it identifying and fixing
    the bugs as a result.'
  merge: -1
  img_proc: true
- pgno: 351
  md: "# PHP7\n\nOne thing more must be noted; the declaration only applies to the\
    \ code that appears in the same file, or to code that is consumed via a trait.\
    \ Any code that is pulled in the require or include directives won't be covered\
    \ by the strict types declaration unless those files also have the same declaration\
    \ at the top too.\n\nI mentioned traits up above and I think these little beasties\
    \ are worthy of further consideration. You might be tempted to think that adding\
    \ the declaration at the top of a trait's file should be sufficient to turn on\
    \ strict type checking for the contents of that trait.\n\nWhat do I mean by this?\n\
    \n```\n<?php\ndeclare(strict_types=1);\n\ntrait AddingTrait {\n    public function\
    \ add(float $a, int $b) {\n        return $a+$b;\n    }\n}\n```\n\nDespite having\
    \ told you that the declaration needs to be at the very top for any code that\
    \ requires strict type checking to be turned on, it doesn't work for traits. Whether\
    \ this is intentional or it has been overlooked, it's certainly something to be\
    \ wary of. We might be tempted to think that the following code would now work.\n\
    \n```\n<?php\nclass Calculator {\n    use AddingTrait;\n}\n```\n\nUnfortunately,\
    \ that's not the case. In short, a trait cannot turn on strict checking for its\
    \ own methods. Instead, the onus is on the class that consumes the trait. With\
    \ our example, this means that the file containing the Calculator class is the\
    \ one that must make the strict types declaration. Whether the trait does it or\
    \ not is irrelevant."
  merge: -1
  img_proc: true
- pgno: 352
  md: "```\n<?php\ndeclare(strict_types=1); // trait methods are now covered\n\nclass\
    \ Calculator\n{\n    use AddingTrait;\n}\n```\n\nSo, in order to use strict type\
    \ checking for scalar type hints, you have to remember to add the declare(strict_types=1);\
    \ as the first line of PHP in every file that needs it. Should you miss one, PHP\
    \ will try to silently cast parameters to the types being hinted for.\n\nAs I\
    \ mentioned before, this feels rather clunky to me. I would rather have seen the\
    \ strict type checking being the de facto standard, with the option to turn on\
    \ implicit casting instead. Even if this goes against the grain of PHP's historical\
    \ background, the resulting improvement in code quality would be worth it.\n\n\
    From the perspective of achieving PHP Brilliance, we need to remember to turn\
    \ on strict checking in every file that will have type hinting for scalars. Any\
    \ scalar values that need to be cast from one type to another should be done explicitly\
    \ in the code so that our intent remains clear to ourselves and anyone else reading\
    \ it.\n\nEven with the additional burden of remembering that declaration at the\
    \ top of the file and having to perform any type casts manually, the provision\
    \ of scalar type hinting is a major step forward for the language.\n\n# Return\
    \ Type Hinting\n\nI left half of the tale untold in the previous section on scalar\
    \ type since I wanted to bring forward into this section. Return type hinting\
    \ is exactly what you might imagine it to be: the ability to declare for the data\
    \ type being returned from a method or function call.\n\nYou might assume that\
    \ I'm about to go on again about interfaces, contracts and guarantees, but actually\
    \ I'm not going to do that. We'll get there shortly, but first of all, let's take\
    \ a look at the proposed implementation."
