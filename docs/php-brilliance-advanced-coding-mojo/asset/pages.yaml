  md: "```\nclass User\n{\n  public $name;\n\n  public function setName($name)\n{\n\
    \    $this->name = $name;\n  }\n\n  public function getName()\n{\n    return $this->name;\n\
    \  }\n}\n```\n\nThis is nothing but a painfully simplistic class that shows the\
    \ bundling of data and getName() respectively). Not the slightest hint about hiding\
    \ anything on there, particularly when you consider that the $name property and\
    \ the two methods are all declared as being public.\n\nSo, the guy that gives\
    \ you the stock response about data hiding? He’s a bit off the mark who can possibly\
    \ blame him? Even the Wikipedia page on Encapsulation promotes to the very same\
    \ idea. Make no mistake though, when we come to building out robust, scalable\
    \ and maintainable applications we actually want to keep the ideas of encapsulation\
    \ and data hiding together.\n\nSo what then is data hiding?\n\nFor starters, let's\
    \ get rid of that term \"data hiding\" entirely. Correctly, we need to refer to\
    \ it as information hiding instead, which more appropriately covers both the data\
    \ aspects and the implemented logic that operates on those data. Information hiding\
    \ is the process by which we can prevent certain data and logical aspects of our\
    \ classes and objects from being accessible to its clients and collaborators through\
    \ the use of access modifying keywords as private, protected and final. Or to\
    \ put it in a slightly different way, information hiding is all about the ability\
    \ to protect the inner workings of our objects from outside interference. But\
    \ what benefit is that? The answer lies in the ability to protect the integrity\
    \ of your data. Nothing is more important to the security of your application\
    \ than this."
