- pgno: 125
  md: 'Proding the polymorph.


    you best judge the situation to be. How you come to make those judgementsements
    will naturally be influenced by the extent of the things that you know about the
    topic in hand.


    In this case, you now know that using abstract classes as a means of defining
    new data types in your language is a very powerful technique for building up your
    application in a semantically sound fashion. You also know that you can modify
    the behaviour of a particular object on the fly by wrapping the logic that represents
    those particular behaviours into their own classes, which can then be injected
    as behaviour instances into our principle object.


    It isn''t a case of arguing for data types versus switchable behaviours, since
    the two techniques are not mutually exclusive. Generally in fact you''ll find
    that you''ll be using a blend of the two to best achieve your desired outcomes.
    The building of an application isn''t a single, monolithic process but the combination
    and recombination of lots of little pieces, which in turn are composed of even
    smaller pieces. In situations, subtype polymorphism will make perfect sense, especially
    when it comes to creating new data types and the concrete implementations and
    specialisations of those data types. In others, it''s much more appealing to delegate
    repsonsibilities into-those-data-types discrete, properly encapsulated and switchable
    behaviours.


    The choice, as they say, is yours. But they do also say that to be foreseen is
    to be fore armed. I hope that this first section of the book has at least achieved
    a little of that.'
