  img_proc: true
- pgno: 111
  md: 'Proding the polymorph.


    up. Lo and behold right at the very top of my first page of results, Google has
    very kindly boxed out Webopedia.com''s definition of Polymorphism, which I shall
    make a direct quotation of here.


    In object-oriented programming, polymorphism refers to a programming language''s
    ability to process objects differently depending on their data type or class.
    More specifically, it is the ability to redefine methods for derived classes.
    What is Polymorphism? Webopedia www.webopedia.com/TERM/P/polymorphism.html


    Do you see what they did there? In one fell swoop both Google and Webopedia.com
    appear to be threatening the very future of humankind by presenting an ill-informed
    poorly qualified statement as an authoritative piece of information. Of course
    I''m wildly overstating the possible effects of this. Or am I? Does it take such
    a fantastical leap of imagination to conjure an image of the guy working on NASA''s
    collision-asteroid-blasting laser unwittingly overriding the fire() method in
    a subclass and accidentally turning the laser into a tractor beam instead? Yeah,
    ok, maybe it does. And just for the record, I''d like to state that NASA''s programmers
    are clearly exceptionally talented, first class codeockeys.


    Nevertheless, we must pull our heads out of these fantastical imaginings and get
    back to the topic at hand. Subtype polymorphism is exactly as it sounds; the ability
    to change the behaviour of a particularly named method by providing an identically
    named method in a child class. In this way, we are effectively masking the original
    method by providing an alternative invocation point for the interpreter.


    Let''s look at some code to see how this is achieved.'
  merge: -1
  img_proc: true
- pgno: 112
  md: "Proding the polymorph.\n\n```\nclass RegularBullet {\n    private $baseDamage\
    \ = 10;\n    public function getDamagePoints() {\n        return $this->baseDamage;\n\
    \    }\n}\nclass HollowPoint extends RegularBullet {\n    public function getDamagePoints()\
    \ {\n        $damagePoints = 2 * $this->baseDamage;\n        return $DamagePoints;\n\
    \    }\n}\n```\n\nHopefully this rather simple bit of code quite clearly illustrates\
    \ the idea that is subtype polymorphism. Our child class, HollowPoint overrides\
    \ the parent’s-DamagePoints() method and in so changes the logic for how damage\
    \ points are calculated when a round of a particular type hits the target. This\
    \ still satisfies our earlier definition of polymorphism as being “Same name,\
    \ different logic”. With subtype polymorphism, we are achieving the same name\
    \ qualification by providing methods in the child class that override the identically\
    \ named methods of the parent class.\n\nIf you hadn't already guessed, I'm about\
    \ to go off on one of my gripes here. The main thrust of this particular gripe\
    \ is that this generally the extent of those pesky tutorials that I have so much\
    \ beef with. Let’s return to the second sentence of that Webopedia.com definition.\n\
