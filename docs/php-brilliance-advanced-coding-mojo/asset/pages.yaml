- pgno: 61
  md: "# Encapsulating our ideas.\n\nLet’s switch our focus now then to the doers,\
    \ the processors of our application. We have already discussed how we might break\
    \ out the password handling processes away from our User class through the implementation\
    \ of a PasswordManager class. To start us off this route, let's take a look at\
    \ how this might be done in code.\n\n```\nclass PasswordManager {\n    const PASSWORD_MANAGER_COST\
    \ = 10;\n\n    public function getPasswordHash($rawPassword)\n    {\n        $options\
    \ = array(\n            'cost' => self::PASSWORD_MANAGER_COST\n        );\n  \
    \      return password_hash($rawPassword, PASSWORD_BCRYPT, $options);\n    }\n\
    \n    public function verifyPassword($rawPassword, $hashedPassword)\n    {\n \
    \       return password_verify($rawPassword, $hashedPassword);\n    }\n}\n```\n\
    \nAs you can see thus, our PasswordManager class has a very narrow expression\
    \ of intent. Even without the attendant docblocks that should be included within\
    \ this code, you can quite clearly follow the path of its execution. We've successfully\
    \ encapsulated the two principle methods of ensuring we're using the best possible\
    \ password treatment into a single unit with a very finite purpose. From here,\
    \ it's a simple step to implement the other password_hash() related functions\
    \ that PHP provides in order to complete the utility of this class definition.\n\
    \n> Incidentally, if you take nothing else away from this chapter, you could do\
    \ much worse than copy and paste that PasswordManager class into your own applications.\
    \ If you're not already using the password_hash() functions provided by the language,\
    \ you should. I'll explain why later on as this very topic gets its own chapter\
    \ in the Practices section of the book."
