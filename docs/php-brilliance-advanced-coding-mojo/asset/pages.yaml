- pgno: 88
  md: 'Inheriting vast wealth is not always good.


    Nevertheless, it''s likely that you''ll retain certain identifiable characteristics
    of one, the other or both.


    It is a particularly firm belief of mine that the notion of family is as important
    to object oriented programming as it is in real life. Through the process of inheritance,
    we have the power to create closely related families of data types, all springing
    forth the fruitful loans of a tightly defined parent class.


    In programming though, we need to be a great deal more careful than Mother Nature’s
    apparently chaotic process of propagating the genetic characteristics of our ancestors.
    After all, now that we have started to invest so much care and attention into
    defining our new data types, we ought to feel specially motivated towards retaining
    these characteristics inside each of the progeny we let loose upon the world.


    We already know that the use of the extends keyword grant us the ability to create
    child instances of another, and in doing so child instances will inherit all of
    the non-private properties and non-private methods of the parent.


    At this stage though, we also know that we can inherit from any class that isn''t
    marked final. On our voyage through this particular chapter, I may just grumble
    about this last part. Maybe. Just a little. Afterall, we''ve spent a fair bit
    of time focussing on an abstract parent, not just any old.


    In the spirit of embarking on this voyage together, budded up and with our sturdiest
    programming boots, let’s begin at the beginning.


    By referring to everyone’s favourite source of information on all things PHP,
    we can see that:


    > Inheritance is a well-established programming principle, and PHP makes use of
    this principle in its object model. This principle will affect the way many classes
    and objects relate to one another. For example, when you extend a class, the subclass
    inherits all of the public and protected methods from the parent class. Unless
    a class overrides these methods, they will retain their original functionality.
    This is useful for defining and abstracting functionality, and permits the implementation
    of additional functionality in similarity without the need to reimplement all
    of the shared functionality. – The PHP Manual (http://php.net)'
