  md: "Proding the polymorph.\n\nwithout any of the drawbacks of using inheritance?\
    \ Well you can and I’m going to talk about it next.\n\n# Delegate Polymorphism\n\
    \nWhat if, instead of relying on the process of hard-wiring all of the different\
    \ logical implementations of our data types into the various specialised child\
    \ classes, we could dispense with the notions of abstraction and inheritance completely\
    \ and still support switchable behaviours that better represent the things within\
    \ our application actually do. Our times rather ropy and somewhat disparate interpretations\
    \ of what abstraction and inheritance actually would suddenly cease to be the\
    \ source of so many bugs.\n\nThe good news is that we can and whilst I’ve no doubt\
    \ that such notion might start sending shivers up and down the collective spines\
    \ of many a Senior Developer, once we’ve explored the possibilities I’m certain\
    \ that at least some of you might start concoct ways in which Delegate Polymorphism\
    \ might be implemented in your projects.\n\nAs the name suggests, the process\
    \ relies on the implementation of a design pattern called Delegation, which in\
    \ turn embodies the notion that the changeable aspects of what would otherwise\
    \ become specialised child class are instead encapsulated into separate, independent\
    \ objects to which method calls are instead delegated to in order to execute the\
    \ particular favour of logic that the delegate encapsulates.\n\nI’m really talking\
    \ about there are injectable, encapsulated behaviours basically come in the form\
    \ of helpers. Let’s look at some code.\n\n```\nabstract class MortgagePlan {\n\
    \    private $loanValue;\n\n    private $loanTerm;\n\n    abstract public function\
    \ getPaymentPlan();\n}\n```\n\nSo far, good. Clearly we’ve created a new data\
    \ type here, one that’s called MortgagePlan. We have private properties representing\
    \ the value of the loan and the duration of the loan expressed as the loan term."
