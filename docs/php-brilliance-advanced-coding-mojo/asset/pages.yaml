- pgno: 284
  md: '# Instantiaphobia


    Switch your attention back to the User class and you should see the immediate
    benefit. Our instances of the User class are no longer having to lug around a
    theoretically redundant static method with them and as a result, the memory footprint
    of our application is reduced, albeit marginally.


    More importantly, our User class is fully testable. This singular piece of code
    allows us to instantiate user objects by providing mocks, stubs and dummy data
    to the constructor and subsequently test all of the object''s methods without
    encountering a static method call or picking the database singleton on the way.
    Unit testing aficionados rejoice!


    Let''s look at again with some slightly different wording in order to reaffirm
    what we''ve just considered. The User class has slimmed down to only contain the
    methods that directly pertain to user object instances (granted, this is already
    a pretty slim object in our code right now).


    Whilst I accidentally on purpose neglected to mention this downside to the factory
    method approach previously, it''s worth just a quick peek at it now. Whenever
    you instantiate an object from a class that also contains static methods, the
    resulting object instance also carries with it those static methods.


    Let''s just illustrate that for the benefit of understanding.


    ```

    // Pick up a user instance in the regular fashion

    $fred = User::create(1);


    // $fred also carries the create() method

    $mary = $fred->create(2);


    // So too does $mary

    $jenny = $mary::create(3);

    ```


    As you can see, our User instances are picking up that factory method and making
    it available for use. Or indeed, abuse, depending upon your point of view.


    Of course they are.


    That factory method is part of the class definition so it''s only to be expected
    that each User instance also provides access to the create() method too.'
