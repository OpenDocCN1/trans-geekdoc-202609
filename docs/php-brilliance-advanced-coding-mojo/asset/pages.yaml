- pgno: 219
  md: '# Brain Check


    Welcome to the very last chapter of Part Two.


    This is the part where we test ourselves on the material that we’ve covered in
    this part of the book by asking ourselves, “Could I give a lightningning talk
    on each one of these?”


    It''s a checklist and a guide for highlighting areas of further reading.


    # Interfaces


    Interfaces allow us to express a guarantee to an object’s collaborators that the
    methods described are available in the implementing object. An abstract parent
    class also provides an interface that we can type-hint on, but in this case the
    guarantee is not present and the onus is upon the developers to ensure that child
    classes honour the parent’s interface.


    # Namespaces


    Namespaces provide us with a means to package our code into cohesive, logical,
    well organised units or modules and avoid naming clashes with other, third party
    code that we might bring. The autoloading standards PSR-0 and PSR-4 require name-spacing
    our code but provide great convenience and compatibility with other packages that
    follow the same standards.


    # Composer


    Composer has become the package manager of choice in the world of PHP application
    development, supplant even Pear by providing both ease of use and extraordinary
    power when it comes to managing an application’s dependencies.


    # Traits


    Traits were added to PHP in order to provide a mechanism for code reuse to classes
    that otherwise bear no relationship to each other. Traits are applied to a consuming
    class in a system-level copy-and-paste like procedure but care'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Brain Check


    should be exercised when using them since not all of a trait''s methods will be
    imported when the consuming class already provides identically named methods.


    # Closures


    Closures are also known as anonymous functions since they can be declared without
    a function name. Instead, the function that a closure represents is applied directly
    to a variable''s value. Internally, closures are represented as instances of the
    Closure class, with the functionality bound to the `__invoke()` magic method to
    allow them to be treated as callbacks. Both types may be tested for instances
    of the “callable” type.


    # Duck typing


    Duck typing is a form of testing a variable''s abilities rather than typehinting
    for a particular Interface or class name. In object oriented, this generally means
    testing the variable for the presence of specific methods and/or properties before
    attempting to use those methods or properties.'
