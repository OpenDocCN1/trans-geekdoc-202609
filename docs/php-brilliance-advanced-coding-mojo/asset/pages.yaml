- pgno: 281
  md: '# Instantiaphopobia


    does nothing but proxy a list of constructor parameters to the constructor itself,
    then our factory method is entirely redundant and the benefits are lost. The thing
    is supposed to be protecting our wider application code from the need to marshall
    that list of parameters in the first place. The thing is supposed to be saving
    us from having to perform a global search of the code base every time the list
    of constructor parameters changes.


    The second key problem arises when we include considerations of automated testing,
    a topic that will be examined in greater detail in PHP Brilliance in Practice.
    For starters, any aficionado of unit testing will automatically baulk at the presence
    of many static methods, and rightly so.


    In a world where we are building large, complex applications we ideally want as
    much high quality code coverage as possible. Yet, in our most recent version of
    the create() method, we''ve made unit testing impossible. Or rather, I have, and
    quite deliberately so and the breakages into two distinct flavours.


    First up in the dock to stand are the calls to other static create methods:


    ```

    // Collect the role and account instances

    $userRole = User::create($userId);

    $userAccount = UserAccount::create($userId);

    ```


    These hard coded, whilst certainly valid in this instance, mean that any “unit”
    test on the User::create() method would also indirectly testing the other create()
    methods at the same time. Not very unitary at all, as it turns out.


    Second up in the dock to stand though is the much greater of the two offenders;
    the call to collect what seems to be a singleton instance of the database connection.


    ```

    $dbConn = Database::getInstance();

    ```


    Here’s a hard and fast rule that should never be broken: Unit testing should be
    carried out without requiring the application’s storage system getting dragged
    along with it. A database connection is always a performance bottleneck in any
    application, even in a single server setup where the database server and the application
    server reside on the same physical host.'
