- pgno: 166
  md: "# Putting a name on our spaces. 152\n\nconsoleApplication class class on the\
    \ constructor. Or maybe that should be the other around? Trying to decipher that\
    \ code would be pointless though since we would be trying to redeclare the Application\
    \ class within the current scope. Quite rightly, PHP will choke and die when we\
    \ try to do that.\n\nNo matter though, we can fix things by aliasing the imported\
    \ class and thereby freeing us to declare our own version of the Application class.\
    \ Aliasing is achieved by adding the keyword like this\n\n```\n<?php\nnamespace\
    \ Company\\AppName;\n\n// Format: \"use $fullPath as $localName\"\nuse Symfony\\\
    Component\\Console\\Application as $sfApp;\n\nclass Application\n{\n    private\
    \ $sfApp;\n\n    public function __construct(sfApp $sfApp)\n    {\n        $this->sfApp\
    \ = $sfApp;\n    }\n}\n\n$myApp = new Application(new sfApp());\n```\n\nJob done.\
    \ We have now only solved our name collision but we've also clarified the intent.\
    \ Granted, there's not a lot going on in there but at least it doesn't take much\
    \ effort to determine that our Application instance is meant to compose an instance\
    \ of Symfonyony's console Application.\n\nI used the word “compose” in that last\
    \ sentence quite deliberately as this the part of the chapter where I pull the\
    \ generic notion of namesacing into the realms of PHP Brilliance.\n\nThe days\
    \ of the monolithic “one framework does all” are coming to an end, at least in\
    \ terms of building commercial applications. That's not to say that we're suddenly\
    \ building everything from scratch again. Indeed not, as we've already determined\
    \ that reinventing the wheel is a rather pointless waste of our precious time.\
    \ Nevertheless,"
