  md: 'Finding Closure.


    # Portable, disposable functions


    One potential benefit of assigning a function to a variable is that function now
    becomes portable. Rather than creating your regular libraries of functions in
    files quite remote from where you actually use, you now have the ability to set
    up a function *exactly* where it''s needed, pass it around as much as is necessary
    and then destroy it when you''re done.


    That last part is also significant. When taken in context of a single web-based
    request, named functions written into *required* files exist for the entire duration
    of the request. Anonymous functions exist only for as long as you need them to
    be and will be subject to PHP''s garbage collection once the variable''s carrying
    it has gone out of scope.


    Of course, you may also manually destroy such a function by calling unset on the
    variable that it''s assigned, like this:


    ```

    unset($myFunc);

    ```


    It is precisely for this reason that anonymous functions are often referred to
    as “throw away code”. My own preference is somewhat different to this though.
    When taken in this most basic sense, I prefer to treat them like macros. I certainly
    feel that this more appropriately conveys the utility that they provide.


    > Macros are used to make a sequence of computing instructions to the programmer
    as a single program statement, making the programming task less tedious and less
    error-prone.” - Wikipedia.org*


    Doesn’t this better portray what can be done with beast? Within the body of an
    anonymous function, you can code the appropriate logical processes that you need
    and then execute that “macro” at the point that it’s needed.


    This is precisely why the portability is of particular interest. The ability to
    create a function in one location, assign it to a variable and then pass that
    variable around is of significant value.


    *http://en.wikipedia.org/wiki/Macro_%28computer_science%29'
