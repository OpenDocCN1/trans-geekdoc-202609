- pgno: 126
  md: '# Talking points.


    So far then, we’ve considered encapsulation, abstraction, inheritance and polymorphism.
    Admittedly inside separate chapters and admittedly within some seemingly restricted
    contexts. Obviously, it isn’t sufficient to just leave our “Foundational” considerations
    there, not least because we are simply not able to take those four tenets and
    treat them in isolation.


    The moment we have one class extend another class, we are automatically involving
    all four. How so? Simply by extending one class with another, we''re automatically
    invoking abstraction and inheritance. This is perfectly apparent.


    We are also engaging in polymorphism of the subtype variety, though how much of
    the morphology of the parent is changed in the child class is entirely down to
    how we proceed to add code to the child. Now by though, I would hope we can appreciate
    that reworking the interface of the parent beyond recognition in the child is
    probably not a very wise move.


    The act of extending a class also has ramifications in the context of encapsulation.
    If we know that encapsulation is the process of bundling data into a single, coherent
    unit (a class) and the methods that operate on that data and we''re treating encapsulation
    as a means of achieving information hiding as well, then we must be breaking encapsulation
    in the parent since we''re reasonably expecting the parent class to expose at
    least of its innards to the prospective child classes.


    So too are we breaking the notion of encapsulation in the child class. If we’re
    supposed to be bundling the data and the methods that operate on that data into
    a single, coherent unit, we can really use inheritance to suck in additional logic
    from another class and expect to get away with it? Encapsulation, as far as we’ve
    considered this far, begins and ends with those enveloping curly braces.


    What it boils down to then is a matter of degrees. The degrees to which you bend
    one in order to accommodate another. We could, for instance, say to hell with
    it all and build out our entire application in a single, perfectly encapsulated
    class.'
  merge: -1
  img_proc: true
