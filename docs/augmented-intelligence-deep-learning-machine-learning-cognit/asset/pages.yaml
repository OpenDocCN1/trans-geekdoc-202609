- pgno: 150
  md: 'γ: weight of Neighbor recommender group


    δ: weight of Stranger recommender group


    The weights α, β, γ and δ are taken such that their sum is unity and α > β > γ
    > δ. i.e. α+β+γ+δ = 1


    Mobile agent calculates FR of DH by weighted aggregation of DR and TIDR. A significant
    factor ‘θ’ is assumed to assign weight to DR and TIDR. Agent assigns weight ‘θ’
    to DR because it is obtained from pre trusted host i.e. SH and (1-θ) to TIDR obtained
    from indirect reputations given by recommenders belonging to four recommender
    groups. Value of FR is given by equation 6.9.


    FR = θ * DR + (1-θ) * TIDR  (6.9)


    MA decides the trust level of DH depending on the application. If the value of
    FR is above or equal to the trust level, MA assigns 1 to show DH’s trustworthiness
    and ‘0’ to show DH’s untrustworthiness.


    The Presence of a collusion attack in MRep is shown in Fig. (6.3). SH sends a
    request of transaction Req (T) and receives the response of transaction Res (T)
    from DH. Since SH is an assumed pre-trust host, hence it sends the direct reputation
    (DR) of DH to the agent. The agent receives indirect reputation (IDR) from recommenders
    who sent Req (T) to DH and obtained Res(T) from it. Weights to recommendations
    received from recommender communities, classes, or groups are assigned depending
    on their distance from SH. Total indirect reputation (TIDR) is obtained by weighted
    summation of these indirect recommendations. The agent calculates the final reputation
    (FR) by weighted summation of DR and TIDR as discussed previously. To demonstrate
    the ballot stuff collusion attack, we assume that the DH has a low reputation
    and some recommenders of different communities or groups unite to increase the
    reputation of DH which leads to ballot stuff collusion. These colluders give an
    exceptionally high rating to increase the reputation of DH. As a result, TIDR
    increases with the increase in the number of colluders named New_TIDR. New_FR
    is calculated by the weighted sum of DR and New_TIDR. Ballot stuff collusion is
    detected when New_FR > FR and bad mouth collusion occurs when New_FR < FR. No
    collusion is detected when New_FR = FR.'
