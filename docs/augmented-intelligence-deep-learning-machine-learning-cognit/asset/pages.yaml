- pgno: 13
  md: '# CHAPTER 1


    # Integrating Educational Data Mining in Augmented Reality Virtual Learning Environment


    Carlos Ankora¹ and Aju D.¹,*


    ¹ Vellore Institute of Technology, Vellore, Tamil Nadu 632014, India


    **Abstract:** Virtual learning environments have become an essential tool, incorporated
    in learning activities in educational institutions and individuals’ homes, especially
    during the COVID-19 pandemic. Digital devices provide the platform for the learning
    environment, but learning sometimes becomes passive and boring. Augmented reality
    provides learners with the needed motivation, engagement, thereby boosting the
    learner’s activity within the virtual learning environment. It augments the traditional
    learning materials with 3D objects, animations, audio and visual elements, which
    offer better interactivity for a rich learning experience.


    This study aims to give an overview of the development of an augmented reality
    system to provide a virtual learning environment that delivers a more engaging
    and motivating lesson, story and experience. The study incorporates Scrum methodology,
    an agile software development practice that uses small increments called sprints
    to develop the virtual learning environment in several usable modules. The study
    also discusses the software tools, Blender and Unity 3D, to develop 3D models
    and the augmented reality modules for the virtual learning environment. The system
    uses image targets as markers to project 3D objects to augment the images from
    the traditional learning materials and offer a better visual experience. The development
    incorporates features of Educational Data Mining to optimise users’ learning styles
    and learning experiences. This chapter will demonstrate augmented reality technologies
    to implement a virtual learning environment that will offer an interactive and
    engaging learning experience.


    **Keywords:** Augmented Reality, Agile Development, Educational Data Mining, Virtual
    Learning Environment.


    # 1.1. INTRODUCTION


    The educational system has gone through several technological incorporations over
    the years. Educational institutions have transformed the teaching and learning
    process, resulting in progressive consequences [1].'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Despite its limitations, the traditional classroom remains an essential aspect
    of education. Both instructors and learners still value the face-to-face model
    of teaching.


    Virtual learning environment have become an essential tool incorporated in learning
    activities in educational institutions and individuals’ homes, especially during
    the COVID-19 pandemic. Schools were closed down, and the management of these institutions
    resorted to virtual class sessions to continue teaching when it did not seem like
    the pandemic would soon be over.


    Some institutions utilised live teaching sessions; students log in to online video
    conferencing and collaborative systems to watch and listen to their instructors
    delivering lectures. These systems provide features for questions via chat or
    using the device’s microphone, just like students raising hands to ask questions
    in class. Others instead use recorded class sessions (audio or video) and make
    them available online for students to watch online or download to their devices
    and watch offline. Such systems provide discussion forums to encourage peer discussions
    with the instructor to moderate the questions and comments posted.


    Digital devices provide the platform for the learning environment, but learning
    sometimes becomes passive and boring. Students usually watch or listen to these
    sessions while getting distracted and find themselves doing other activities alongside.
    Augmented reality provides learners with the needed motivation, engagement, thereby
    boosting the learner’s activity within the virtual learning environment. It augments
    the traditional learning materials with 3D objects, animations, audio and visual
    elements, which offer better interactivity for a rich teaching and learning experience
    for both instructors and learners.


    # 1.2. VIRTUAL LEARNING ENVIRONMENTS (VLE)


    Virtual learning environments usually comprise resources and tools used within
    a network-connected computer systems environment. A wired or wireless network
    shares information among the connected systems. The information includes text,
    image, video and audio files shared among various stakeholders in the virtual
    learning environments, running on the internet or an institutional intranet. Such
    networks also allow communication between students and their instructors within
    the virtual learning environments. The communication could be synchronous, occurring
    simultaneously from both nodes, or asynchronous, occurring at different times
    based on the time schedules of the users. Virtual learning environments provide
    the platform within the educational infrastructure to accommodate all these functionalities
    [2].'
