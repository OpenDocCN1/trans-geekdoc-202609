- pgno: 15
  md: 'The educational sector has embraced virtual learning environments to promote
    information and content sharing and communication among students and instructors
    [1]. Studies have shown that peer interaction and collaborative learning activities
    are essential for a virtual learning environment in education. A virtual learning
    environment provides the platform for students to collaborate individually or
    in groups to learn and work on activities and projects without being physically
    around each other. Virtual learning environments deliver content in various formats
    and allow students to apply different strategies in the learning process. Students
    can use learning materials based on preference and suitability. They can revisit
    previous content and control the pace of learning at their convenience [2].


    Learning environments come with a focus on the delivered content. Virtual learning
    environments are built-in with features, activities and content to support the
    engagement and interactivity of learners and create an immersed state within the
    VLE [3].


    The development and implementation of a virtual learning environment should focus
    on its content and the presentation to the students. Students have varied learning
    styles; some prefer reading text, others listen to audio files, and others watch
    video demonstrations. A properly structured virtual learning environment will
    provide the necessary resources for students to access learning materials in the
    format they are convenient with, and they should have the option of switching
    between different formats of the same content [4].


    Several studies have recommended features and functionalities that should be present
    in a virtual learning environment [4 - 7]. An implemented system might not have
    all these features (Fig. 1) deployed. However, all of these have unique functionalities
    that will make a virtual learning environment provide an outstanding teaching
    and learning experience for both instructors and students and all other necessary
    stakeholders.


    # 1.3. AUGMENTED REALITY (AR)


    Augmented reality technology offers a richer augmentation to information by including
    virtual objects implanted into images; the virtual objects come in various forms
    – text, images, audio, video, animation, 3D models. Augmented reality gives an
    illusion of the objects within the same physical environment [8 - 10]. Augmented
    reality uses virtual objects displayed in a real-world physical environment to
    provide an enhanced experience.


    Some studies on augmented reality evidence the enriched teaching and learning
    experience AR provides to its users [11].'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The implementation of augmented reality in education has allowed instructors
    and students to go beyond the static presentation of learning materials and media
    to enhance them with virtual 3D objects, giving room for further exploration of
    learning materials accessed by the students [1]. Augmented reality creates an
    immersive learning environment giving students a different experience in the learning
    process.


    AR technology mainly runs on a computing device, mainly a smartphone, which uses
    the camera to pick images from the real-world environment while displaying the
    additional virtual 3D images to provide extra information to the user.


    ![](img/be45bf301a3c0ebefb162571e2625fab_16_0.png)


    Fig. (1.1). Features of Virtual Learning Environment.'
