    # 2.8. HARDWARE IMPLEMENTATION


    # 2.8.1. Paralysis Patients Restoring Movement


    Paralysis disease, affecting people internationally, affects several problems,
    include shock, strokes, infections & inflammatory disease. In the cortex, spinal
    cord, vertebral nerves, and muscles the main injury may be expressed. Generally
    speaking, “paralysis” means extreme or full engine operation failure whereas “paresis”
    is a comparatively small loss. A big concern is extreme paralysis, not only by
    sacrificing the capacity of patients to live normally but also by the massive
    cost of hospital maintenance. E.g., in patients with TC, nearly all-volunteer
    motor functions are lost under the throat, but also somato-sensation, i.e., their
    feelings of contact, discomfort, temperature, and the location of their limbs
    are lost. Extreme lateral amyotrophy (ELS) is further compounded by the fact that
    patients may lose their entire body''s engine function.


    # 2.8.2. EEG-Based Brain-Computer Interfaces


    In current usage, there are two distinct types of BCIs, one being the “non-invasive”
    B CII, an electronic recordings device that uses scalp electrode contacts to capture
    electroencephalographic signals (EEG) from the cerebral cortex of the persons.
    The person typically needs biofeedback approaches to learn how to control a cursor
    on a computer screen using his own “brain waves.” Use the BCI to guide the machine
    cursor to select alphabet letters after a lot of effort, the cursor''s control
    becomes sufficiently precise to spell words. This BCI strategy has been incredibly
    popular and appears to be primed for an outstanding short-term solution to have
    some regulation over external equipment for serious SCI patients. The use of electronic
    techniques to recover the motor control in SCI is also shown. However, there are
    limitations in that subjects need significant preparation and rigorous focus.
    In comparison, the non-invasive BCI solution is limited by the number of freedom
    degrees regulated by EEG recordings (currently one to two).'
