    is relatively low, new cases (15%) and deaths (15%) in Africa this month represent
    the highest prosperity. Eastern Mediterranean and Western Pacific also noted that
    new cases and deaths increase this month. Such a serious condition is directed
    to increased risk in global health care systems and immense harm in the world
    economic system [1]. To fight ‘COVID-19’, various nations remain working to nourish
