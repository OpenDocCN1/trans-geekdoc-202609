- pgno: 58
  md: '# CHAPTER 3


    # Potential Use of Tree-based Tools for Chemometric Analysis of Infrared Spectra


    Lucas A.C. Minho¹,*, Bárbara E.A. de Magalhães² and Alexandre G.M. de Freitas³


    ¹ Departamento de Química, Universidade Federal de Minas Gerais, Belo Horizonte,
    Brazil

    ² Instituto de Química, Universidade Federal da Bahia, Salvador, Brazil

    ³ Centro de Estudos em Leite, Departamento de Tecnologia Rural e Animal, Universidade
    Estadual do Sudoeste da Bahia, Itapetinga, Brazil


    **Abstract:** One of the most elegant and versatile techniques of machine learning
    is the decision tree. The decision tree is a simple tool to predict and explain
    the relationship between the object and the target value, recursively partitioning
    the input space. Tree ensembles such as random forest and gradient boosting trees
    significantly improve the predictive power of supervised models based on tree
    weak predictors. In a random forest, the generalized error that is included in
    the model prediction is dependent on the correlation strength between the trees
    and the individual predictors'' quality. The random selection of features in each
    node split is at the core of random forest, which makes it as effective as other
    complex machine learning techniques while having a lower computational cost, which
    is appealing in the analysis of large data matrices such as those generated by
    infrared spectroscopy because most analysts do not have computers with high processing
    capacity for implementing those complex models. Also, techniques based on the
    decision tree are more robust to noise, which is preferable for the analysis of
    trace level contaminants. In this chapter, we present the techniques based on
    decision trees and apply them to solve problems related to classification, regression,
    and feature selection in spectra obtained experimentally and provided by public
    repositories. Comparisons of the performance obtained with techniques based on
    the decision tree in relation to other chemometric tools are also performed.


    **Keywords:** Analytical screening, ATR, CART, Chemometrics, Data mining, Discriminant
    analysis, Decision trees, Feature selection, FTIR, Gradient boosting machines,
    Machine learning, Non-parametric models, Non-Linearity, Neural Networks, NIR,
    Predictive models, Supervised learning, Random forest, Regression, Supervised
    learning, Validation.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 3.1. INTRODUCTION


    The association of spectroscopy and multivariate calibration methods has enabled
    the analysis of complex spectra of multicomponent systems. Therefore, it has been
    used in a wide variety of regression methods [1]. The application of new pattern
    recognition algorithms, such as methods based on decision trees, has grown in
    recent years due to its advantages and ability to solve complex problems for the
    purposes of classification and calibration [2]. Decision tree models, capable
    of modeling linear and non-linear relationships, stand out among the various regression
    methods for being easy to understand, fast and non-parametric [1].


    To improve the predictive performance of the decision tree, a large number of
    tree-based algorithms have been developed, such as decision forests [3]. The use
    of decision tree-based methods has become popular in a wide variety of areas [4],
    for example, food quality and authenticity, metabolomics and ecology [2].


    The best-known decision tree method is the Classification and Regression Tree
    (CART). CART is a binary tree representation capable of describing the relationships
    between dependent (numerical or categorical) and independent variables with sufficient
    precision [5]. It is a supervised non-parametric technique used for the purposes
    of classification and regression [6]. CART is an algorithm used in local linear
    and non-linear adjustment with categorical (classification) or continuous (regression)
    variables. This algorithm is used in the random forest (RF) as a tree growth algorithm
    [1].


    The decision forest method best known is the Random Forest (RF) [7]. RF consists
    of a group of unadjusted decision trees that grow by a bootstrap sampling of training
    data and random selection of variables [1]. RF has become popular due to the simplicity
    of training and adjustment parameters and due to the ability to deal with complex
    non-linear systems [8].


    Gradient Boosted Trees (GBT) is another ensemble-based method used to reduce the
    error of ''weak'' predictors as decision trees by repeatedly running and recalibrating
    the weights [9]. The GBT algorithm can be combined with several machine learning
    methods promoting an improvement in the accuracy of the prediction results. In
    addition, the GBT algorithm adds the advantages of having a low degree of overfitting
    and good generalization performance [10].


    In this chapter, we presented some tree-based techniques as CART and random forest
    (for more details regarding other tools based on decision trees, the study of
    James et al. can be referred to [11]) and applied them to solve problems related
    to classification, regression and feature selection in FTIR spectra obtained'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'experimentally and provided by public repositories. The performance of the
    applied decision tree-based techniques was compared to the performance of other
    chemometric tools.


    # 3.2. DECISION TREES (DT)


    Typically used in classification operations, decision trees are elegant machine
    learning tools that are based on a decision model that express conditional control
    instructions. Decision trees generate rectangular subsets, A_j, recursively partitioning
    the data set, one X attribute at a time, making inferable decisions at each step.
    All trees start from a root node, from which all other nodes will originate. A
    node with outgoing edges is called a test or internal node. The rest, which originate
    from the branches and find their end, are called leaves or decision nodes. In
    operation, each internal node divides the attribute space into a predetermined
    number of sub-spaces, according to a discrete function. The number of branches
    varies according to the complexity of the tree.


    Each internal node contains an attribute being tested, and, especially in the
    classification trees, each leaf represents a different class. Also, it is common
    for the leaves to have a vector of continuous values that informs the probability
    that the target value is predicted with certain accuracy [12]. The instances are,
    therefore, classified from the root to the leaves, as shown in Fig. (3.1).


    ![](img/be45bf301a3c0ebefb162571e2625fab_60_0.png)


    Fig. (3.1). Example of a decision tree using spectral information.


    In Fig. (3.1), the internal nodes were represented by rectangles and the leaves
    by ellipses. The first internal node in the series is the root. It is interesting
    to note that'
