  md: '# ## 2.1. INTRODUCTION


    This chapter offers a description of the sensors in the brain-computer interface
    technology (BCI) data set. We divide sensor technology into two fundamental categories
    for this chapter. First of all, we speak about “invasive” technologies, including
    brain implantation surgical techniques involving mostly the multi-electrode recording
    of microelectrode arrays inserted directly into the brain to test single-cell
    action potential. The key subject of this chapter is a big growth market for sensor
    technology [1]. We should point out that this technology has not been approved
    for the trials on human beings [2]. Furthermore, observations of subduing or epidural
    stripes of electrode arrays that monitor cortical potential [3], which is somewhat
    similar to EEG recordings on the skull surface, will be addressed, as this is
    the main use of these intrusive electrodes for human epilepsy surgery [4]. However,
    the development of other BCI applications may be improved. Secondly, the “nonspecific”
    technologies are discussed, involving mainly “Wet” silver (Ag) or gold (Au) multi-electrode
    EEG registration arrays of pull electrodes that are mounted on the surface of
    the crane to monitor EEG operation. These electrodes come from a variety of sources
    online, but relatively little development has occurred in this field [5]. We warn
    that “non-invasive,” scalp-invasive, BCI-technology applications are often used
    acutely and can become more invasive for people at home or at work. Further advancement
    of technologies in this field will be addressed briefly.


    # ## 2.2. WHAT IS BCI?


    The term “BCI” has been popularized and was first published by UCLA professor
    Jacques Vidal. Vidal is well known in peer-reviewed arts as the scientist of BCIs
    [6]. A brain-computer interface is an effective communication interaction between
    the external device and the central nervous system, also known as a mind-machine
    interface [7], that circumvents the use of encapsulation. This travels through
    the cortex straight to the device instead of from the cortex to the finger on
    the keyboard by the musculoskeletal mechanism [8].


    Brain interface devices shown in these times need deliberate thinking, although
    potential implementations will work smoothly [9]. The old method to BCI, which
    required the implantation of a mechanical device in the brain, and it seemed to
    monitor as a genetic component of the body, is being replaced by current, in-depth
    information on non-invasive BCI. BCIs are built to increase the sensory-motor
    or human cognitive processes, support them or restore them. This incorporates
    electrical engineering, information science, biomedical and neurosurgical technology
    [10].'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 2.3. BCI SENSOR WORLD OVERVIEW


    The bulk of European BCI sciences include “non-invasive” sensor technology [11],
    *i.e.*, multi-electrode recording from EEG electrode arrays on the skull floor
    [12, 13]. This sensor technology has seen very little development and needs to
    be greatly improved [14]. In Europe, several BCI sites are capable of delivering
    sensing devices, which may help advance the production of “invasive” sensor technology
    [15].


    Brain-machine interfaces (BMI) [18], while they are designed to solve the same
    problem, are substantially different from BCIs, expressing the purpose of a subject
    in robotic orders [16]. BCI acts in a manner that is understood to equate with
    actions but is diffusing and unspecified with the macroscopic brain function (mostly
    EEG) [17]. BCI has already achieved progress and is ready for patients to use,
    building on accessible EEG research and machine learning techniques details [19,
    20].


    # 2.4. HISTORY OF IMPLANTABLE ELECTRODES


    CNS history of implantation of electrodes dates back to Hess'' early work with
    original feline implants in the 1930s'' [21]. In the 1970s, however, implantable
    electrodes saw a more recent adaptation. The development of 50 μm tungsten microwire
    arrays was recorded by Selman and Bach in the early 1970s in the electrophysiological
    records and the early 1980ies by Chapin & Woodward (1986). In essence, many laboratories
    use this type of technology for more frequent single-unit recordings and many
    animal BCI applications. The accurate monitoring and functionality of individual
    wires for electrode recording sites are some of the difficulties with multi-wire
    arrays [22].


    Wise and Angell developed the principle of the use of integrated chip (IC) technology
    to improve the microelectrodes from 1970 to 1975 [23]. In the next several years,
    various articles were written; Bement Standard wire electrode works were ground
    breaking in the 1980s, varying in diameter, with a duration exposed of up to 1
    mm, from 13 to 200 μm [24]. Fig. (2.1) provides an illustration of a high-density
    array of embedded micro disk for recording up to 128 wires in spontaneously movement
    mice. Wire electrode is widely used by rats, primates, animals, and late monitoring
    purposes [25].'
