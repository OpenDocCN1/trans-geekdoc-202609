    # 2.5.2. Silicon-Based Microelectrodes


    Silicon was the very first substratum used to create multisite related semiconductor
    microelectrodes and several studies of microelectrodes have been reported for
    brain monitoring and stimulating of neural tissue [38]. One of the attractive
    features of silicon as a substratum is the method of chemical etching [39]. Without
    the need for laser processing or sawing, independent microelectrodes may be produced
    from a single substratum at a time [40]. It is necessary to create small functions,
    such as canals in the substratum. The grading can create very thin microelectrodes
    to measure the thickness of the substratum [50]. Thin substrates have been recorded
    as thin as 6–15µm [40].


    Doping can change the semiconductor characteristics of silicone. Silicious is
    also highly compliant with onboard circuits [41]. Silicon has various characteristics
    which have made it commonly used to shape microelectronic arrays [42]. Pictures
    of some of BCI''s major contributions to microelectrode technology focused on
    silicone are seen in Fig. (2.2) of the “Center for Neural Communication Technology
    at the University of Michigan”. There are two of the latest prototypes for rats
    and nonhuman primates for BCI applications [43].


