  img_proc: true
- pgno: 70
  md: 'interactions (e.g., hydrogen bonds) [56, 57], can lead to peak displacement
    and signal suppression or overestimation, sample heterogeneity, beam scattering
    due to changes in refractive indices, among others [56]. Regulatory or calibration
    failures, alignment and optical system problems [58] (which are quite common in
    ATR-FTIR) can also occur. Those are called matrix effects and are inherent to
    the complexity of the samples, while the latter are called system effects [56]
    and are characterized as some of the potential operational errors observed in
    laboratory practice.


    The matrix effect can be minimized by, for example, extracting the substances
    of interest from the mixture, diluting the samples or doing a cleanup pretreatment,
    which is known as “sample preparation” techniques, or by refining the spectrum
    by applying filters to smooth background noise, regularize the baseline, or remove
    spurious peaks [59]. Often these measures are applied together. Even so, after
    implementing these basic measures, several machine learning algorithms may not
    be effective in describing most of the variance observed in the results. Therefore,
    there is a need for a careful selection of the tool to be applied since the matrix
    effect and the other undetermined errors cannot be completely mitigated. In this
    sense, we are interested in an efficient and robust technique for building chemometric
    models aimed at solving problems related to high dimensional space obtained by
    infrared spectroscopy.


    In this section, we compare the robustness of popular chemometric techniques such
    as multiple linear regression and partial least squares regression with three
    tree-based tools, CART, RF and GBT. For that purpose, regression models were fitted
    from the subset presented in the previous section with the selection of variables
    made by BRFR. A noise normally distributed around the averages of each attribute,
    with a variance of 0.1, was randomly introduced into the elements in 5 levels:
    1, 5, 10, 35 and 50%, to artificially mimic the matrix effect and the indeterminate
    errors. The results were computed by the root mean square error metric (RMSE)
    and illustrated in Fig. (3.3).


    Without the inclusion of noise, the regression models have very close predictive
    power. Much of the correlation between the variables and the response is lost
    by corrupting 10% of the data with noise. PLS and CART were strongly impacted
    with the included variance, with increases of 68 and 78% in the RMSE, respectively.
    GBT had an attenuated increase in that interval, while the RF remained insensitive
    to the increase in noise level. Great lack of fit was registered after the corruption
    of 50% of the input space for all regression models. The final RMSEs were 1.271,
    1.366, 0.845, 0.803 and > 70 for CART, PLS, GBT, RF and multilinear regression
    with interactions (results not shown) respectively. The results found for multilinear
    regression in this work were even higher than those'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'reported by Saseendran et al. [60] in another data structure. The authors found
    an increase of 3.2% in the RMSE for every 10% of noise included for linear and
    polynomial regression with ridge regularization.


    ![](img/be45bf301a3c0ebefb162571e2625fab_71_0.png)


    Fig. (3.3). Behavior of different models by including different noise levels.


    Tree-based tools that employ some resampling strategy, such as bagging and boosting,
    and using a large set of weak predictors (trees) in their ensemble proved to be
    more robust to noise. In particular, the random forest, which when using bagging
    mechanism to bootstrap subsets, causes at least 1/3 of all attributes to not be
    used in the formation of trees when using them in the out of bag (OOB) error estimate
    [45], diluting the number of corrupted attributes between the subsamples and the
    space used in estimating the error. Also, as the RF uses a limited and small number
    of attributes in the growth of each tree within the forest, there is a low probability
    that a tree will grow with all the variables corrupted, and even if it is the
    case, the vote for these few trees is irrelevant compared to hundreds of other
    trees. Thus, there is a high probability that most corrupted attributes will be
    ignored, remaining fitted to the real values even if most of the attributes in
    total were strongly altered (Fig. 3.4). In the extreme case (50% of noise), the
    number of corrupted attributes used in the generation of predictors exceeds the
    number of out bagging attributes in the ensemble, leading to significant losses
    in predictability. For example, if the number of random variables used for the
    growth of a tree (mtry) is 6, it can be said that at least, generically, that
    3 of these will be corrupted by noise.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/be45bf301a3c0ebefb162571e2625fab_72_0.png)


    **Fig. (3.4).** Comparison between the real values and the values predicted by
    random forest at noise levels of 5 and 35%.


    Therefore, RF and GBT are two techniques strongly recommended for the analysis
    of samples of complex matrices such as biological samples (e.g., blood, urine,
    saliva, tissues), environmental (e.g., soil, water, mud), food, fuel, polymers,
    among many others, because they are less sensitive to the sample’s spurious nature,
    with the advantage that RF is a tool that requires less computational cost when
    compared to tools that employ the boosting mechanism.


    # 3.7. TREE-BASED ALGORITHMS IN DISCRIMINANT ANALYSIS


    In several areas of science that deal with the analytical aspect, such as forensics,
    environmental, pharmaceutical, food, the qualitative or semi-qualitative analysis
    of a certain contaminant in relation to a limited reference value can be as relevant
    as the continuous quantification. We recently published an article focusing on
    the determination of trace levels of tylosin in milk using the Fourier Transform
    Infrared Spectroscopy (FTIR) technique associated with chemometric techniques
    [28]. Tylosin is a macrolide antibiotic, a residue from the milk and meat industry,
    used in the management of cattle for the treatment of bacterial infections such
    as mastitis and liver abscesses [61].


    Before the recent ban [62], the Brazilian Ministry of Agriculture, Livestock and
    Food Supply (MAPA) stated the maximum residue limit (MRL) of tylosin as 50 μg
    Kg⁻¹ (50 ppb - parts per billion). It was understood that values above the MRL'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'could have negative effects on consumer health [63]. On the other hand, values
    below 50 ppb were considered permissive. It was in our interest to classify the
    samples as suitable for consumption (tylosin concentrations < 50 ppb) or unsuitable
    for consumption (tylosin concentrations ≥ 50 ppb). For this, the multilayer perceptron
    neural network (MLP) technique was used.


