- pgno: 17
  md: '# 1.3.1. Elements of AR in a VLE


    The main elements of an augmented reality implementation in a virtual learning
    environment include a target marker, an augmented reality engine, an optical sensing
    device and a display. A smart mobile device represents the primary device; it
    is easier to use its display and the camera as an optical sensing device.


    An image target that contains the marker of the image to be detected is prepared
    with distinct characteristics to make it easy to detect. The camera of the mobile
    phone device scans the physical environment and picks the image from the target
    marker. The system transmits the detected information to the AR engine to compute
    the position and angles of the detected marker.


    A match to the marker generates the object shown on the mobile device’s display.
    The associated object could be textual information or a graphic image that provides
    extra information about the image target. A 3D model, an audio or video clip,
    or an animation could be embedded to enrich the visual experience and engagement
    [12].


    # 1.3.2. Target Markers used in AR Applications


    AR applications use an object as a target to create a 3D space [9]. They survey
    some types of targets – markers, coded markers, images, multi targets, text recognition,
    simple shapes, object recognition.


    The simple marker has a border easily identified as a target for rendering. The
    marker uses less processing power and is usually effective when in operation.
    This coded marker causes constraints within the border, but the patterns could
    vary. Each group of patterns generates varying virtual objects. An image could
    be utilised in place of the marker; it prevents the generation of various markers
    linked with the virtual objects.


    The images should be clear with distinct outlines and colour contrast to make
    it easier with the image pattern analysis and matching for pattern identification.


    The text could be used as a target for virtual objects; it identifies the text
    in particular font styles and sizes. Simple 2D or 3D shapes are used in AR targets
    by identifying the edge dimensions and texture patterns. Objects are also used
    as AR targets; 3D objects could be identified and used within a 3D space. Some
    targets combine different object modes for identification. The AR device picks
    up the target related to the object to be identified and displayed in a 3D space.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ### 1.3.3. Hardware Platforms/Peripherals


    Several devices and peripherals render AR applications; handheld mobile devices
    (smartphones, tablet personal computers), wearable smart glasses, head-mounted
    displays, laptop computers, and personal digital assistants [8, 13, 14]. The most
    commonly used among these are mobile devices [9].


    Most mobile devices are equipped with cameras, usually front-facing and rear-facing.
    The rear-facing camera picks up the video signals from the physical environment
    by aiming the camera to the desired target. The device identifies the marker and
    renders the virtual object into the 3D space based on the camera and marker’s
    position and angle. The rendering requires a lot of graphics and CPU processing,
    which most good smartphones possess these days. The mobile devices also contain
    GPS sensors mainly used for navigational purposes. Some AR applications use the
    marker’s location to determine the resultant object displayed on the screen. This
    feature is also helpful because mobile devices are built to make it easier to
    carry around the real-world environment, which is valuable to AR applications,
    detecting targets around the environment.


    # ### 1.3.4. AR Applications in Education


    The educational sector has seen some of the mainstream implementations of augmented
    reality technology. AR applications are used for skill training, classroom learning,
    and home learning (Fig. 2). AR technology provides virtual examples to learning
    materials and includes gaming elements to increase learner’s engagement and interactions.
    Trainers use augmented reality applications to compliment workshop skill practices,
    especially in situations where the learners cannot access equipment readily and
    where safety issues are very much of a concern [8, 13, 15, 16].


    # ## 1.4. DEVELOPMENT OF METHODOLOGY FOR AR IN VLE


    Advancements in technology necessitate organisations and institutions to stay
    up-to-date in technological implementations at the workplace. These trends include
    hardware, software, and communication network installations; educational institutions
    are also expected to follow the trends. Implementation of software systems improves
    operations; new systems replace existing systems while existing systems are redesigned
    and updated to meet new system and operational requirements.


    The designing and development of systems for virtual learning environments consider
    the context, cultural resources, and socio-cultural features of the learning'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'environments. In a study [7], two critical aspects must also be considered
    when designing smart learning environments -- involvement of the users in the
    design process and the inclusion of functionality to accept feedback from system
    users.


    The system design process has moved from the traditional approach where developers
    meet users at the early stages of system development to take a list of requirements,
    which becomes a checklist for the User Acceptance Test (UAT). It has become necessary
    that users and other stakeholders in a system being developed be involved in the
    whole design and development process. Feedback from users should run a complete
    cycle on the lifetime of the software, from the inception of the design through
    development and maintenance stages till the software is no more in use. Continuous
    feedback from software users keeps the system current and satisfies all relevant
    requirements. Software update becomes a recurring process over the system''s lifetime.


    ![](img/be45bf301a3c0ebefb162571e2625fab_19_0.png)


    Fig. (1.2). AR applications used in education.'
