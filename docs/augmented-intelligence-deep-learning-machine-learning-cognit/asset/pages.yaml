    # 7.2. CROW SEARCH OPTIMIZATION


    # 7.2.1. Overview of Crow Search Optimization


    Optimization has played a very important role in several areas, not limiting to
    engineering problems. These problems consist of complex objective functions, various
    decision variables, and a huge set of constraints, which add complexity to an
    already complicated problem of optimization. Such constraints take the search
    from a conventional optimization methodology to a modern area of analysis, i.e.,
    swarm intelligence pioneered in the 1980s by Beni and Wang [6]. SI mimics the
    collective intellect of the living creature of nature [6]. Each new algorithm
    focuses on two features: first, finding solutions close to the actual optimal
    solution, thus reducing the gap between them, and second, finding the solution
    in the least possible time, and thus less search time. Several optimization algorithms
    have been proposed over the past years, as each has its own advantages and disadvantages.
    The crow search algorithm is a newly developed algorithm that imitates the social
    intelligence of crows and their way of collecting food. It is a metaheuristic
    algorithm inspired by crows'' intelligent behaviors. Crows are among the wisest
    creatures in the world as shown in the mirror test [9]. There are numerous bits
    of proof indicating crows'' astuteness. Crows can recollect faces, trade data
    with one another, take the nourishment and get it far from others by concealing
    the assortment of food sources [9]. They are clever criminals as they take additional
    consideration, for example, changing concealing spots from time to time so they
    can abstain from being casualties later on. Crows utilize a learned way to deal
    with concealing their nourishment and taking others'' nourishment. In the subsequent
    sections, the features of CSA, the algorithmic structure of CSA, along with the
    Pseudocode and flowchart, are prearranged for understanding and implementation
    of CSA in different fields of optimization.'
