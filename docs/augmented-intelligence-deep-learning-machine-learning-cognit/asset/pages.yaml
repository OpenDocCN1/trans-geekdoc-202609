    The best subset of attributes is the one that lessens the input space dimensionality
    without, however, losing relevant information that affects the model predictability.
    In this sense, it is notable that the subsets of attributes extracted from the
    BRFR and GILS methods are equivalent in efficiency and should be preferably used
    to solve this problem, with the difference that Boruta is much easier to implement
    and does not depend on a generating function. The BRFZ method proved to be as
    effective as the other two, even though it has selected 13 attributes more. This
    happens because of the greater sensitivity of the measure of importance based
    on Z score since this index takes into account the small fluctuations in the loss
    of average accuracy of each tree in the forest [45], therefore, probabilistically,
    more factors are likely to affect the overall accuracy.


    On the other hand, the subset extraction method based on GCLS proved to be inadequate
    for the selection of attributes obtained by NIR by the exclusion of factors that
    have relevance, thus resulting in the loss of accuracy of prediction. An explanation
    for the low efficiency of the GCLS lies in the fact that the author seeks to optimize
    the elements based on the Lambert-Beer equation, which takes into account ideal
    measures performed under a linear dynamic range, which apparently is not the case.


    # 3.6. ROBUSTNESS OF TREE-BASED ALGORITHMS TO NOISE


    In the previous section, we found that the linear solution based on Lambtert-Beer''s
    law, using a GCLS optimization algorithm, was not sufficiently effective to select
    relevant variables from the signals obtained experimentally by diffuse reflectance.
    Similarly, the other variants of the infrared spectroscopy technique will present
    the same dilemma. This is due to deviations from ideality (non-linearity) in the
    measurements, for example, the result of intermolecular and intramolecular'
