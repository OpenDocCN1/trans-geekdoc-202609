  md: '# # Bankruptcy Prediction Model Using an Enhanced Boosting Classifier based
    on Sequential Backward Selector Technique


    **Makram Soui**^{1,*}, **Nada Namani Zitouni**^{2}, **Salima Smiti**^{3}, **Kailash
    Kumar**^{1} and **Ahmad Aljabr**^{1}


    ¹ *College of Computing and Informatics, Saudi Electronic University, Riyadh,
    Kingdom of Saudi Arabia*


    ² *University of Gabes, Zrig Eddakhlania, Tunisia*


    ³ *University of Manouba, Manouba, Tunisia*


    **Abstract:** Corporate bankruptcy prediction is one of the most crucial issues
    that impact the economic field, both on the local and global scale. The primary
    purpose of bankruptcy prediction is to investigate the economic state of any corporation
    and evaluate its distress level. Several machine learning and deep learning models
    have been used to predict financial failure. However, there is still no technique
    that resolves all the problems faced in this field. As such, we propose a machine
    learning model that constitutes a feature selection phase and a classification
    phase to predict corporate bankruptcy. This technique combines the sequential
    backward selector (SBS) with AdaBoost and JRip algorithms. The first phase uses
    SBS to select the best subset of features for the training. The second phase trains
    the AdaBoost with the JRip classifier to predict each target class. This model
    is evaluated using the highly imbalanced Polish bankruptcy dataset. The comparative
    analysis of our model with other techniques proves the efficiency in predicting
    corporate bankruptcy with an average of 91% of the AUC metric.


    **Keywords:** Bankruptcy prediction, Boosting technique, Classification, Feature
    selection, Polish bankruptcy dataset, Python, Rule-based classification, Two-stage
    method, Weka, Wrapper methods.


    # ## 5.1. INTRODUCTION


    The dilemma of predicting corporate bankruptcy aims to differentiate firms with
    a likelihood of distress from healthy corporations. It is a phenomenon that may
    be'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'caused by unsuitable decision-making. It impacts the economic field on the
    local and global scale since it renders all institutions involved vulnerable.
    Thus, emerged the need for tools that allow monetary institutions to predict bankruptcy.
    This need heightened the interest of researchers and scientists in the field of
    corporate bankruptcy [1 - 5].


    Many studies have proffered several solutions for financial failure prediction.
    These articles focused on the structure of the data, the features, and the target
    classes of samples to find a relationship between the characteristics and the
    target classes to perform the prediction [6]. These existing works are split into
    statistical methods and artificial intelligence techniques. The statistical models
    consist of using mathematical and statistical principals to formulate a relationship
    between variables in the data, such as Multivariate Discriminant Analysis (MDA)
    [7], Linear Discriminant Analysis (LDA) [8], and Quadratic Discriminant Analysis
    (QDA) [9]. But these methods fail to obtain valid hypotheses for individualistic
    features due to their presumptuousness for the multivariate normality, linear
    separability, and independence of the predictive variables [10]. The artificial
    intelligence methods aim to build models based on machine learning and deep learning
    algorithms like Decision Trees [11], Support Vector Machines [12], and Artificial
    Neural Networks [13]. These algorithms can build cognitive functions/pattern recognition
    based on high dimensional datasets. Subsequently, they do not make assumptions
    when dealing with data distribution [14]. Unfortunately, most of these algorithms
    are black-box models. They fail to accommodate the data imbalance problem, which
    is a common factor in bankruptcy datasets.


    Recently, the use of ensemble methods demonstrated their ability to give relatively
    precise predictions for bankruptcy, specifically AdaBoost [15], Gradient Boosting
    [16], and eXtreme Gradient Boosting (XGBoost) [17]. The data imbalance phenomenon
    is a challenge when dealing with classification since the samples of one class
    outnumber those of the others, which creates fluctuations in the training sets.
    Since the ensemble methods use a set of classifiers instead of a single classifier
    that is capable of dealing with the imbalanced data [18], these methods are sensitive
    to noisy data and outliers.


    In this context, we present a bankruptcy prediction model based on Adaptive Boosting
    (AdaBoost) algorithm. This algorithm is very apt at dealing with the data imbalance
    issue. It is also compatible with almost any learning algorithm, which allows
    for an expanse of experimentation. In our approach, we combined AdaBoost with
    the JRip algorithm. This novel approach was trained on the extracted data from
    the Sequential Backward Selection (SBS) technique.'
  merge: -1
  img_proc: true
