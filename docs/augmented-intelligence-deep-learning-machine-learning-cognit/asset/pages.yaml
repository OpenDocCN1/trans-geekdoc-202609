  md: '**Keywords:** Binomial probability distribution, Ballot stuff, Bad mouth, Collusion,
    Direct reputation, Euclidean Distance, Hosts, Indirect reputation, Mobile agents,
    P2P, Single-linkage clustering.


    # 6.1. INTRODUCTION


    P2P networks consist of some important properties that attracted many researchers
    to talk about trust and reputation issues. These issues help agents to find the
    trustworthiness of peers (hosts) before the actual transaction. Since each peer
    plays the role of both server and client, P2P networks do not require any central
    control [1]. Peers are also called hosts, where the actual execution of the agent
    takes place. Reputation-based systems collect facts about the properties of hosts,
    analyze them, aggregate facts about them, and finally disseminate these aggregated
    facts to all other hosts in the network [2]. Our earlier paper discussed how these
    systems could be used in mobile agent technology to secure mobile agents [3].
    To ensure security, trust, and reputation-based systems are built where mobile
    agent finds the trustworthiness of the host’s behavior before performing an actual
    transaction with them. In the earlier paper, the MRep model is proposed to determine
    the trustworthiness of the host with which mobile agent wants to pursue transaction
    [4]. Since all hosts are autonomous in nature, they can check each other’s trustworthiness
    using social mechanisms of reputation. A reputation-based system collects facts
    about the properties of the host. It analyzes and aggregates the facts about it
    and finally disseminates these aggregated facts to all other hosts in the network
    [5]. In an e-commerce scenario, an agent is dispatched by the user in the network
    for selling or buying (transactional purpose) products. For this purpose, it performs
    possible negotiations with sellers (hosts). Since an agent has no past behavioral
    information, it carries a lot of suspicion and mistrust on hosts. An entity that
    trusts are called a trustor and an entity on which the trustor trusts is called
    the trustee. Our proposed MRep model consists of a trustor (agent) that collects
    feedback from recommending hosts (recommenders) to derive the reputation of the
    DH. The model considers recommendations from only those hosts that possess past
    transaction history with the DH. Recommendation reputation (rating) helps the
    mobile agent to predict the trustworthiness of the DH. Unfortunately, the recommendations
    given by recommenders or raters collaborate to give false ratings to make DH''s
    reputation low or high in the market. These recommenders collude to act as if
    they are one single unit. Such recommenders are called colluders. These colluders
    keep the information about each host’s transaction and recommendation history.
    Ballot stuff collusion occurs when recommenders collude to give a fake positive
    recommendation for non-reputable DH while bad-mouth collusion occurs when recommenders
    give fake negative recommendations for reputable DH [6]. Bad-mouth colluders not
    only give'
