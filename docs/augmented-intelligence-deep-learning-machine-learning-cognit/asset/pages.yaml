  md: '# Brain and Computer Interface


    Kuldeep Singh Kaswan¹* and Jagjit Singh Dhatterwal²


    ¹ School of Computing Science and Engineering, Galgotias University, Greater Noida,
    India

    ² Department of Computer Sciences & Applications, PDM University, Bahadurgarh,
    Haryana, India


    Abstract: Brain-computer interfaces (BCIs) are defined as the science and technology
    of devices and systems responding to neural processes in the brain that generate
    motor movements and to cognitive processes (e.g., memory) that modify motor movements.
    Advances in neuroscience, computational technology, component miniaturization,
    the biocompatibility of materials, and sensor technology have led to the much-improved
    feasibility of useful BCIs. Brain-Computer Interface can be developed by engineers,
    neuroscientists, physical scientists, and behavioral and social scientists as
    a team effort. A study on brain computers (BCI) discusses how the brain and external
    systems interact. In intrusive systems, electrodes are implanted in the cortex;
    in non-invasive systems, they are mounted on the scalp and use electroencephalography
    or electrocorticography to monitor neuronal activity. The BCI systems can be generally
    ranked based on the location of the electrodes used for detecting and measuring
    neurons in the brain. This WTEC report was intended to compile and reveal to government
    decision-makers and the scientific community the information on global developments
    and patterns in BCI research. The design of hardware, device architecture, functional
    electrical stimulation, non-invasive systems of communication, academic and industrial
    cognitive and emotional neuroprosthesis has been discussed in this chapter. The
    purpose of the present chapter is to review the current sensor technologies used
    for invasive and non-invasive BCI approaches throughout North America, Europe,
    and Asia. We have visited and/or interacted with key laboratories with expertise
    in these areas. Although not completely comprehensive, this chapter gives an overview
    of the major sensor technologies being developed for potential BCI applications.


    Keywords: Cortex, CNS tissue, ECoG strips, Electrode cap, Electrocorticography,
    Emotional neuro-prostheses, EEG signals, Etching technique, Geometric electrodes,
    Invasive, Integrated chip, Micro-heater, Multi-electrodes, Non-invasive, Neurosurgical
    technology, Neuronal map, Polyimide microelectrode, Sensor technology, Sensor
    Technology, Silicon-based Electrodes.'
