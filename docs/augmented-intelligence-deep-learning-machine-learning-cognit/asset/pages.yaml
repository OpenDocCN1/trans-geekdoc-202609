    From Table 7, we can detect that our model surpasses all the ones from T *et al.*’s
    study [67] and most of J *et al.*’s study [68]. Still, we can detect that it competes
    with the XGB model in AUC but is outperformed by XGBE and EXGB, making them the
    better options. This leads us to take into consideration the interoperability
    measure. In this prospect, we can mention that the number of extracted features
    of this work is smaller than ours (20 and 26, respectively). However, this work
    focused more on generating synthetic features and their impact on the prediction
    rather than extracting classification rules. As such, whether the model is capable
    of generating optimal decision-rules is still up for debate. This leads us to
    believe (to our knowledge at least) that in this aspect, our approach is the best
    choice so far.


    # CONCLUSION


    In the economic field, corporate bankruptcy prediction is considered one of the
    most crucial and fundamental issues. The research performed on this issue is countless;
    still, the perfect solution is yet to exist. Each study tends to resolve some
    of the problems encountered in bankruptcy but fails to solve others. This paper
    proposes a solution for three primary obstacles for financial failure'
