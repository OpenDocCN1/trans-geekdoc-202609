    # CONCLUSION


    This chapter has presented an overview of designing and developing an augmented
    reality system in a virtual learning environment to increase engagement to learning
    materials and interactions among students and instructors. The development incorporates
    the agile methodology that breaks down the system development process into small
    increments called sprints to build usable modules. The methodology is also customer-centric,
    which plays a vital role in developing augmented reality systems and smart learning
    environments to involve the user in the whole development process and provide
    continuous user feedback even after the system has been deployed and in use. The
    software tools used in designing 3D models and developing augmented reality modules
    are also discussed. The chapter ends with the techniques of educational data mining
    that could be integrated into the augmented reality virtual learning environment.


