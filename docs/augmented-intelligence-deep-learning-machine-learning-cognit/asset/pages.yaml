- pgno: 187
  md: '![](img/be45bf301a3c0ebefb162571e2625fab_187_0.png)


    Fig. (4). Publication Number against year.


    # CONCLUSION


    Evolutionary algorithms form a subset of evolutionary computation which is a subfield
    of Artificial Intelligence, in that they typically require only techniques that
    enforce biological evolution-inspired processes such as replication, mutation,
    recombination, natural selection and survival of the fittest. Crow Search Algorithm
    showed through the amendments and applications made by the researchers a great
    diversity in the existing solutions, unlike other optimization algorithms that
    we compared with them. It relied on using the best position to find new functions,
    in addition to containing less parameters (FL, AP) and thus saving time during
    the process of tuning and setting parameters. CSA performed well in the different
    fields we studied, particularly in the classification and selection of features,
    as its findings showed great efficacy in the medical field, in particular its
    contribution, in addition to many other diagnoses, to the diagnosis of breast
    cancer. We find from the survey that CSA has been applied in different fields
    of engineering, but not so much in the medical field. Its satisfactory results
    in this field make CSA one of the most important optimization algorithms that
    can be relied upon and used in future research related to the medical field. We
    will focus our next research on making a comprehensive comparison of CSA with
    the various other algorithms used to solve problems related to the medical field.


    # CONSENT FOR PUBLICATION


    Not applicable.'
