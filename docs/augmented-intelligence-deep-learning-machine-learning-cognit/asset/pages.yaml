    # 5.2. RELATED WORK


    Several algorithms have been proposed to predict company bankruptcy. The research
    splits into statistical and artificial intelligence techniques.


    # 5.2.1. Statistical Techniques


    Statistical methods use mathematical and statistical principles to formulate a
    relationship between variables and their significance in the data. The most popular
    statistical methods include LDA, MDA, QDA, LRA, and FA.


    These techniques were the starter point in predicting corporate bankruptcy. Single
    Discriminant Analysis [19] and Multivariate Discriminant Analysis [20] were the
    earliest models used in this field. Although many criticized their inability to
    adjust to the variables and support their normality [21], statistical methods
    provided an interesting concept, which motivated researchers to invest more in
    them. Consequently, this leads to the introduction of the logit and probit model
    [22]. Still, this technique was also found to be flawed because of the high risk
    of the predictions falling outside the appropriate range of the classification.
    The focus then shifted to put more value in the data characteristics. Combining
    the logit and probit model and factor analysis model procured a solution that
    gave better results. The solution was eventually considered the most favourable
    one at the time for its high performance [23].


    Statistical techniques are well versed when extracting relationships between variables.
    However, they are unable to adapt to high dimensional financial datasets. Nowadays,
    they are deemed ineffective in resolving the issue of corporate bankruptcy prediction.


    # 5.2.2. Artificial Intelligent Techniques


    Statistical methods need to work with structured data to predict bankruptcy [10].
    Intelligent techniques, however, are successful in solving the problem, thanks
    to their ability to mould to the data and spontaneously extract knowledge to procure
    accurate models [24].'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'There are two types of techniques; machine learning and deep learning.


    # 5.2.2.1. Machine Learning Techniques


    Machine learning techniques are capable of finding natural patterns in data. They
    create assumptions for the training data to develop insight, and help make better
    decisions and predictions. Several industries and disciplines, such as medical
    diagnosis, image processing, learning association, and bankruptcy prediction,
    have used these methods. Machine learning algorithms such as Support Vector Machine
    (SVM) [25], Decision Tree (DT) [26], and Artificial Neural Network (ANN) [27]
    have demonstrated prodigious results for bankruptcy prediction.


    The Decision Tree algorithm (DT) is well versed in predicting bankruptcy. It is
    capable of giving coherent classification rules and its prowess when dealing with
    different data types. The use of this technique to predict bankruptcy, validated
    on a well-balanced Japanese dataset, outperformed discriminate analysis in terms
    of accuracy [28]. Additionally, a study conducted on Serbian datasets compared
    different decision tree models with the discriminant analysis model. The results
    showed the supremacy of the DT models [29]. However, the use of this method is
    sometimes frowned upon when addressing multi-class problems because it is inclined
    to errors. Additionally, DTs tend to overfit when dealing with unbalanced data.


    Alternative techniques for bankruptcy prediction are Artificial Neural Networks
    (ANNs). These methods have become universal given their ability to adapt to the
    data set and learn from it. They are capable of catching non-linear relationships
    between variables. Moreover, they do not need prior knowledge of the functional
    form of the data. The performance of ANN validated on the Belgian dataset achieved
    performant results when applied with a small number of variables [30]. A recent
    study examined prominent classification techniques (Decision Tree, Logistic Regression,
    and ANN). The performance of the classifiers showed that ANN was the best alternative
    when data availability was high in the dataset [31]. Additionally, a recent study
    used a neural network with a sigmoidal activation function to predict bankruptcy.
    The model was compared to a Random Forest model, using the error rate. The results
    showed that ANN was a more reliable technique for financial failure prediction
    [13]. However, it is a black-box method, so it is puzzling to explain the outcome
    compared to other techniques like linear regression. Moreover, while fitting a
    neural network model, it is best to take extra care of the attributes and data
    normalization to improve the performance.


    Another well-received intelligent technique is SVM. This method''s ability to
    incorporate the structural and empirical threats for minimization principles is
    what'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'sets it apart from other methods. SVMs were used as a feature selection technique
    to identify a set of optimal features to assess the Altman''s ratio relevance
    for bankruptcy prediction nowadays. The results show that the chosen variables
    significantly improve the accuracy of financial failure prediction. The study
    shows that they outperformed traditional methods [32]. A recent study introduced
    a novel technique called Diverse Density-Support Vector Machine (DD-SVM) for bankruptcy
