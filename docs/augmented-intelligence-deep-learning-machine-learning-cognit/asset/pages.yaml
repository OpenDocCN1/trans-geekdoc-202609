- pgno: 235
  md: '![](img/be45bf301a3c0ebefb162571e2625fab_235_0.png)


    # Om Prakash Jena


    Dr. Om Prakash Jena: Om Prakash Jena is currently working as an assistant professor
    at the Department of Computer Science, Ravenshaw University, Cuttack, and Odisha.
    He has 10 years of teaching and research experience at undergraduate and postgraduate
    level. He has contributed several technical papers in international journals/conferences/edited
    book chapters with reputable publishers. He is a member of IEEE, IETA, IAAC, IRED,
    IAENG and WACAMLDS. He has guided many projects and a thesis at the UG and PG
    levels. He has many edited books, published by Wiley, CRC press, and Bentham Science
    Publishers to his credit and is also the author of two textbooks under Kalyani
    Publisher.


    ![](img/be45bf301a3c0ebefb162571e2625fab_235_1.png)


    # Alok Ranjan Tripathy


    Dr. Alok Ranjan Tripathy is currently working as an assistant professor at the
    Department of Computer Science, Ravenshaw University, Cuttack, and Odisha. He
    has more than 15 years of teaching experience at undergraduate and postgraduate
    levels. He obtained his M.Tech and Ph.D. degrees in Computer Science from the
    Utkal University. He has contributed several technical papers in international
    journals/conferences/edited book chapters with reputable publishers. He is a life
    member of ISTE, CSI and Odisha Information Technology Society (OITS).


    ![](img/be45bf301a3c0ebefb162571e2625fab_235_2.png)


    # Brojo Kishore Mishra


    Dr. Brojo Kishore Mishra is currently working as associate dean (International
    Affairs) and professor at the Department of Computer Science & Engineering, School
    of Engineering & Technology, GIET University, Gunupur, India. He received his
    Ph.D. degree in the field of Computer Science from Berhampur University, India
    in 2012. His main research areas include Data Mining, Machine Learning and Security.


    ![](img/be45bf301a3c0ebefb162571e2625fab_235_3.png)


    # Ahmed A. Elngar


    Dr. Ahmed A. Elngar is an assistant professor of Computer Science, Chair of Scientific
    Innovation Research Group (SIRG) Director of Technological and Informatics Studies
    Center Managing Editor of Journal of Cyber Security and Information Management
    (JCIM), Beni-Suef University, Faculty of Computers & Artificial Intelligence,
    Egypt. Dr. Elngar is the Founder and Head of Scientific Innovation Research Group
    (SIRG).'
