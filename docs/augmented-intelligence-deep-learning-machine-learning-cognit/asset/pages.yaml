    sleep to lighter sleep depicted by time-interval *T₂* in Fig. (4.15). During the
    arousal event, suddenly the lungs cease to breath and thus the concentration of
    oxygen in the blood is disrupted causing oxygen desaturation as per the over lapping
    time-interval *T₂* and *T₃* in Fig. (4.15), which is detected by the SpO2 sensor
    [16, 17].


    ![](img/be45bf301a3c0ebefb162571e2625fab_98_1.png)


    **Fig. (4.15).** Timeline of events for when Sleep Apnea occurs.


    The raw data collected is feed to user defined software which uses deep learning
    techniques for analysis. This is the second step in system design. It determines
    whether sleep apnea is occurring or not and if it is occurring what is its duration
    and various other information.'
