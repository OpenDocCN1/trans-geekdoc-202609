    until the number of features surpasses the random baseline or if the classifiers
    run for a specific number of rounds. The final output will present an ensemble
    feature subsets that exceed the baseline.


    # 5.3.2. Rule-Based Classifiers


    A rule-based classification is an impressive tool that is widely used to perform
    classification. The term rule-based classification refers to any classification
    algorithm or system that uses IF-THEN rules for prediction. These schemes usually
    follow three steps: Rule-Induction Algorithm, which extracts appropriate IF-THEN
    rules from the data, Rule Ranking Measures, which are values used to determine
    the effectiveness of a condition in acquiring accurate prediction, and Class Prediction
    Algorithm, which predicts the class of the new example based on the IF-THEN rules
    that are determined by the rule induction algorithm [55].


    In this section, we present the rule-based classifiers that we used in this work.


    # 5.3.2.1. Decision Tree Classifier: CART


    The decision tree is a structure constituted of nodes and branches, with sthe
    last nodes referred to as leaves. A suitable splitting attribute ai is allotted
    to each node Lq which is not a leaf. The most critical part of the decision tree
    algorithm is to assign the element to the considered nodes. An attribute is typically
    selected based on an impurity measure. The measure is computed for the subset
    Sq of a training dataset S. This measure determines the split-measure function
    for each attribute. Depending on the element of choice, each node splits into
    child nodes. These nodes are linked with their parent nodes by branches. There
    are two types of decision trees; binary and non-binary [56].


    CART is a binary decision tree. The impurity measure of this algorithm is in the
    form of the Gini index. It starts by splitting a root node L0 into nodes. Each
    node Lq processes a subset Sq of a training dataset S. In case all elements of
    Sq are of the same class, the node is identified as a leaf, and there is no split.
    According to the'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Gini index, the algorithm selects the best element to split from the available
    attributes in the considered nodes. A set of attribute values divide into two
    sections for each aᵢ, which in turn splits S_q into two subsets. Among the sections,
    the one that maximizes the Gini index is the optimal partition. The Gini index
    is obtained when records are allocated equally among all classes. From this partition,
    the node L_q that acquires the most valid value for the split-measure function
    is chosen for the split. The algorithm prolongs the process until there are no
    more nodes to compute, measure, and split or the algorithm fulfils the stopping
    criteria of choice.


    # 5.3.2.2. Decision Tree Classifier: J48 (C4.5)


    J48, also referred to as C4.5, is a non-binary decision tree. It is an upgraded
    version of the ID3 algorithm by Ross Quinlan [57]; it establishes the information
    entropy as a split-measure function. This algorithm follows almost the same steps
    as CART. However, instead of the Gini index, it uses the ratio of the information
    entropy and a function called the split information to determine the splits to
    extract the optimal partitions and nodes.


    # 5.3.2.3. OneR Classifier


    OneR is an algorithm implemented in classification. It generates a one-level decision
    tree. It is a practical and flexible technique capable of handling missing values
    and numeric attributes [58]. This technique generates a set of classification
    rules for every element. It computes the error rate of each variable. To do so,
    it uses the percentage of instances that do not belong to the majority class of
    the attributes. It subsequently selects the feature with the lowest error rate
    as its “one rule”; it starts with a selection of elements and produces a set of
    rules for each one. The algorithm generates these rules as follows: for each attribute,
    it sums up how often the value of every target class appears and deduces the majority
    class. Depending on the target class, it generates a set of rules befitting the
    attribute. It finishes by calculating the error ratio for each set and selects
    the set of rules with the lowest rate as its primary classification rule set.


    # 5.3.2.4. PART Classifier


    PART is a rule learner that uses the separate-and-conquer method. It builds a
    rule for each instance, then removes said instance and continues creating rules
    recursively until there are no instances left. It combines the C4.5 and Ripper
    algorithms and attempts to avoid their respective problem [59]. The algorithm'
