    the test sets i.e., 20% of the dataset is used for testing and prediction while
    the remaining 80% of the dataset is used for training the model. The model is
    trained for 25 epochs at the end of which the model gives a training accuracy
    of 97.37%, a training loss of 0.1010 and validation accuracy of 89.03%, validation
    loss of 0.2915. The training vs. validation accuracy, training vs. validation
