- pgno: 146
  md: 'determine the increase and decrease in the probability of reputation error
    with a varying number of colluders and estimate the error in the final reputation
    value of DH under ballot stuff and bad mouth attacks. Later, similarity filtering
    (SF) is compared with other filterings under varying percentages of collusion.
    MRep calculates FR of DH.MRep calculates the dynamic reputation of DH before pursuing
    the transaction. DR of DH is obtained from past transaction experience of SH and
    indirect reputation(IDR) is obtained from recommenders divided into different
    recommender groups according to their distance from SH. Our earlier papers discuss
    in detail the methodology to calculateFR via direct and indirect reputation [11]


    # 6.3. RELATED WORKS


    Reputation systems that lack mechanisms to provide data authentication and integrity
    are vulnerable to collusion attacks because we are not able to differentiate between
    fabricated and legitimate feedback. Several researchers have addressed this problem.
    Liu et al [12] reported that the FR is always misled by inserting unfair ratings
    in regular ratings [13]. propose a scheme to detect collaborative unfair raters
    (recommending hosts) based on the similarity in their rating behavior schemes.
    These schemes identify time intervals in which unfair ratings are highly suspected.
    Selcuk et al [14] suggest keeping records of recommender’s trustworthiness which
    is later updated only in case transactions with such host becomes successful.
    Rahman and Hailes [15] propose to calculate the semantic distance between the
    recommender’s recommendation and the trustor’s (agent’s) own perception towards
    the recommender for the outcome of its transaction. Huynh et al [16] suggest calculating
    credibility ratings of each recommender’s recommendation after a transaction is
    performed between agent and host. These credibility ratings assign weight to recommenders
    before obtaining future recommendations from them. Dillon et al [17] estimated
    the recommender’s reputation strength by finding the difference between its given
    recommendation and the trustor’s evaluation of the transaction with the trustee
    (host). Dellarocas [18] calculated feedback reputation based on the number of
    consistent ratings that the trustor gave for the trustee. Allahbakhsh et al [19]
    propose a model that uses a mining technique to detect the collision groups and
    sub-groups. Ashri et al [20] advise incorporating more detailed relationships
    between hosts and proposed some identification mechanisms for characterization
    of these relationships. Such relationships change dynamically in e-marketplaces.


    # 6.4. MREP MODEL


    A reputation system for securing mobile agents helps the agent to compute the'
