  md: '![](img/be45bf301a3c0ebefb162571e2625fab_149_0.png)


    Fig. (6.2). Community level view of MRep.


    Indirect Reputation (IDR): Indirect reputation is the product of the normalized
    recommendation reputation value of recommender with recommendation value for DH.
    IDR of particular recommender X is given by equation 6.7.


    IDR_X = Σ_{i=1}^n (WX_i / Σ WX) * Rec_{(X_i-DH)}  (6.7)


    WX_i: Weight of recommender ‘i’ of ‘X’ recommender group given by its F-Score


    Where x∈ { R, F, N, S } i = Recommender i of group X


    Rec_(Xi-DH): recommendation value given by recommender i of group X.


    Total indirect reputation (TIDR) is the weighted sum of reputations obtained from
    four groups of recommenders who had past transactional history with DH. TIDR is
    given by equation 6.8.


    TIDR = α IDR_R + β IDR_F + γ IDR_N + δ IDR_S  (6.8)


    where α > β > γ > δ such that α+β+γ+δ=1.


    α, β, γ,δ: weight parameters to Relative, Friend, Neighbour and Stranger group
    respectively


    α: weight of Relative recommender group


    β: weight of Friend recommender group'
