    The search for a wholesome technique to predict bankruptcy included the use of
    ensemble methods. Recent research demonstrated that these techniques outperform
    single classifier methods [33, 34]. A recent study analyzed three AdaBoost models
    combined with imputation methods for bankruptcy prediction. It was validated on
    two real-world datasets (USABDS and JPNBDS) with a high ratio of missing data.
    The results show the robustness of the model for financial distress prediction.
    The method also outperformed neural networks, logistic regression, and decision
    tree models in the accuracy metric [15]. eXtreme Gradient Boosting (XGB) is a
    technique that uses an ensemble of decision trees as a means of learning. The
    introduction of this method for financial failure prediction demonstrated that
    boosting is an efficient approach when predicting bankruptcy. The model introduced
    a new system called synthetic features. It uses econometric measures and arithmetical
    operations to improve performance. It has been tested on five datasets of Polish
    companies [35]. Still, just like other techniques, ensemble methods are vulnerable
    to several factors, such as noise. Thankfully, the introduction of an enhanced
    boosting process called FS-Boosting based on feature selection helped remediate
    this vulnerability. The model combined Information Gain (IG) feature selection
    and the standard boosting procedure to predict bankruptcy [36]. It is validated
    on two small and balanced real-world bankruptcy datasets.


    # 5.2.2.2. *Deep Learning Techniques*


    Deep learning (DL), otherwise known as deep neural learning, is a sub-component
    of machine learning. It uses neural networks to learn from unstructured and unlabeled
    data. In the last decade, the use of deep learning has shown tremendous results
    for various problems, such as natural language understanding [37],'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'sentiment analysis [38], language translation [39] and image classification
    [40]. However, these techniques mostly adapt to analog data, like images, text
    documents, and audio files. They are not adapt at dealing with data in tabular
    format, which is why their use in predicting bankruptcy is rare. Still, some research
    does exist. In the case of Deep Belief Network (DBN), Yeh and Wang combined DBN
    with the Restricted Boltzmann Machine (RBM) to propose a bankruptcy prediction
    approach verified on the American dataset. This model proved to be very successful.
    It outperformed support vector machines [41]. In this context, a comparative study
    of deep belief networks (DBN) feed-forward neural network (FNN) and support vector
    regression (SVR) used the root mean squared error (RMSE) as a metric. It demonstrated
    that DBN outperformed the other approaches proving its effectiveness in predicting
    bankruptcy [42].


    In a recent study, Soui, Smiti, Mkaouer, and Ejbali applied Stacked Auto-Encoders
    with the softmax classifier to perform bankruptcy prediction. This approach utilized
    a two-layer auto-encoder to ascertain the attributes. Then, it used a softmax
    classifier layer was to provide the probability of the class labels. Finally,
    the hidden layers were fine-tuned using back-propagation to heighten the performance
    of the model. This method proved to be very efficient. It outperformed Random
    Forest (RF), Support Vector Machine (SVM), and XGBoost (XGB) [43].


    Deep learning demonstrates impressive results in financial failure prediction.
    However, the limitations in DL lie in the fact that first, it is a type of learning
    that is very abstract, which does not allow direct input to output representation
    [44]. Second, it is very dependent on relatively balanced data [45]. This criterion
    is not always possible when dealing with large-scale data, especially in the economic
    field.


    In this work, we conduct a comparative study of a Boosting technique using different
    single classifiers and feature selection algorithms to determine how they impact
    corporate bankruptcy prediction.


    # 5.3. BACKGROUND


    In this part, we introduce the algorithms used in our work. These techniques are
    divided into feature selection methods, rule-based classifiers and ensemble learning
    techniques.'
