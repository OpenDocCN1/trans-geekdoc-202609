  md: '# 1.4.1. Agile Methodology


    The Agile Software Development Methodology is one of the user/customer-focused
    methodologies that organises the whole development process into small increments
    called sprints or iterations. At the end of each iteration, a product (minimum
    viable product) is presented to the customer. The Agile values and principles
    emphasise interactions and collaborations among all team members, of which the
    user is a significant participant in the development process. The user gives continuous
    feedback, which results in updates in requirements and new requirements [17 -
    19].


    # 1.4.2. Developing AR-VLE using Agile Scrum


    The Scrum methodology is the most popular Agile Development practice. Scrum uses
    sprints/iterations of 1-4 weeks to develop systems in small increments, delivering
    a product after each sprint. Augmented Reality systems could be split into modules,
    each module (or several modules depending on the amount of work required) worked
    on during a sprint and deployed afterwards.


    The team (scrum team) during the development of an augmented reality system for
    a virtual learning environment will clarify the requirements and choose the technology
    stack to be used in the development of the system. The process is part of the
    product and sprint backlog in preparation for the start of the sprint. During
    the sprint session, the team creates the 3D models and image targets to be used
    in the AR engine. They also work on the prototypes for the module and develop
    the AR module to be deployed on a smart mobile device. The module is demonstrated,
    and a review session is held to take feedback from the various stakeholders. The
    feedback leads to updates to meet new requirements, which are considered during
    the subsequent sprint, and new modules are developed (Fig. 3).


    # 1.5. AR SYSTEM DEVELOPMENT FOR VLE


    Several software tools can be used to develop augmented reality modules for a
    virtual learning environment. The development is broken down into two sections
    — designing the 3D objects/models and developing the AR module with the AR engine.


    # 1.5.1. Designing the 3D Models


    There are lots of 3D modelling software available, some paid and some for free
    (Table 1). The software runs on various platforms – Windows, macOS, Linux and'
