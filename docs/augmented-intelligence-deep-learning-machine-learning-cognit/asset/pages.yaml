- pgno: 65
  md: 'importance measures. Breiman [22] introduced variable importance measurements
    based on some heuristic criteria. In the importance criterion based on Gini impurity,
    in a classificatory analysis, for each division, the decrease in Gini node impurity
    is recorded for a given variable X_i belonging to a bootstrapped sample, starting
    from the following equation:


    ```

    \hat{\Gamma}(t) = \sum_{i=1}^{C} \hat{\phi}_i(t)(1 - \hat{\phi}_i(t)) \tag{3.2}

    ```


    Where C is the total number of classes, and \phi^\wedge(t) is the probability
    of randomly selecting a given element of class i in the node. Thus, the sum of
    all decreases in the Gini impurity in the forest ensemble normalized by the number
    of trees results in the Gini variable importance measure [39]. Therefore, a division
    with a great reduction in impurity is considered important, implying that the
    variables used in this division are also considered important [39, 40].


    Another criterion is the measures of importance by permutation. In this case,
    X_i is characterized as relevant when the lack of this variable implies a negative
    effect on the predictive capacity, Y^\wedge, of the model. Briefly, the link between
    a variable X_i and the response Y is randomly broken by exchanging the values
    of all individuals for X_i and this process is repeated with all subsequent variables
    X_1 ... X_n. Also, notably, permutations break the links between X_i and other
    possible covariates [41]. The difference between OOB prediction errors with and
    without the permutation process averaged in relation to all trees in the forest,
    is the importance of the variable X_i (Eq. 3.3).


    ```

    I(X_i) = \mathbb{E}[(Y - f(X_{(i)}))^2] - \mathbb{E}[(Y - f(X))^2] \tag{3.3}

    ```


    Then, the raw variable permutation importance measure is applied to each attribute:


    ```

    I(X_j) = \frac{\sum_{t=1}^{ntree} I_t(X_j)}{ntree} \tag{3.4}

    ```


    Where ntree is the number of trees in the forest ensemble. Another version of
    this importance measurement can be obtained by relating each raw importance measure
    (Eq. 3.4) to its respective standard error. This operation results in the so-called
    Z score. In short, regardless of which path to follow, the variables can be sorted
    in order of relevance: greater is the measure of importance by permutation, greater
    is the impact of this variable on the model''s prediction accuracy.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 3.5.1.1. Boruta Wrapper Algorithm


    In the previous section, we saw that the importance measure of a variable by random
    forest can be based on the loss of prediction accuracy caused by a random permutation
    of the attributes, or even classified according to the increase in the decrease
    in Gini impurity. Despite being very useful in ranking variables, there is no
    clear statistical criterion for the rejection of low importance variables. In
    that case, FSSs become more useful.


    The feature subset selection techniques are divided into three categories, based
    on the operating mechanisms: filters, embedded and wrappers. More emphasis will
    be given to the latter, considering the nature of the object being depicted in
    this section. It is recommended to read Guyon and Elisseeff [42] for more details
    about FSSs based on the approach to filters and embedding, as well as other relevant
    topics that are not of interest in the scope of this chapter.


    The wrapper approach was introduced in 1997 by Kohavi and John [43]. The wrappers
    are black boxes that determine the quality of multiple subsets of characteristics
    that originate from the input data through the evaluation by an independent learning
    algorithm after going through many training and testing cycles. At the end of
    the loop, the best subset of characteristics will be the one with the greatest
    accuracy of prediction.


    The efficiency of a wrapper lies in how the subsets are generated and evaluated.
    This form depends on the search strategy of the wrapper. The search strategies
    are commonly classified into optimal strategies, stochastic or sequential selection
    [42].


    In 2010 (with a first prototype presented in 2006 [44]), Kursa and Rudnicki [45],
    [46] developed a wrapper algorithm called Boruta that is based on random forest,
    and therefore, uses a stochastic search strategy. Given that Boruta is a deity
    of Slavic and Russian folklore, the guardian of the forest and its core, the name
    choice was appropraite Boruta (Leshy) is said to be “changeable as nature” and
    “varied his appearance as often as he pleased”, “might be tall as a tree or so
    small that he could slip under a blade of grass” [47]. Boruta''s shapeshifter
    characteristic can be related to the main element of this wrapper, the shadow
    variables, which are generated and shuffled copies of the elements that are present
    in each attribute. The Boruta algorithm is illustrated in Fig. (3.2).'
  merge: -1
  img_proc: true
