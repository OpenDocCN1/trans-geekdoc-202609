    # CONCLUSION


    The Paper discusses the problem of collusion attack. Proposed technique is based
    on Similarity Filtering (SF) that uses Euclidian Distance (ED) matrices and single
    linkage clustering. SF shows a great promise to detect collusion attack. Statistical
    treatment for this problem is given considering the probabilistic collusion of
    the hosts. Reputation errors are calculated and statistically verified to show
    how collusion attack results in the increase of reputation errors under ballot
    stuff collusion attack. SF is compared with BF, OF and WF. SF performs significantly
    well by giving low reputation errors even when a large number of dishonest hosts
    rises in the system. WF gives 22.6 reputation errors under 20% collusion. The
    value of error increases and reaches 90.1 when 80% collusion occurs.BF gives reputation
    error equal to 7.1 under 20% collusion and reaches 90 under 80% collusion. OF
    gives reputation error 5.02 and 91.6 when 20% and 80% collusion occurs respectively.
    SF gives a reputation error of 6.14 under 20% collusion and reaches to only 15.42
    under 80% collusion.The above data confirms that SF outperforms well compare to
    all filtering.


