  md: '# 8.3. OVERVIEW OF COMPUTATIONAL INTELLIGENCE


    Computational Intelligence (CI) practice has been effectively combined into multiple
    systems to deal with the basic challenges of mass epidemic viruses. Before introducing
    the use of computational intelligence to solve the unique problems of COVID-19
    operations, we need to understand the history and different categories of this
    method (Fig. 1). Based on the idea of calculating intelligence, we can clarify
    which issues can be handled when using COVID-19 using CI.


    ![](img/be45bf301a3c0ebefb162571e2625fab_200_0.png)


    Fig. (1). Implementation of Computational intelligence (CI) in the fight against
    COVID-19.


    # 8.3.1. What is Computational Intelligence (CI)


    Computational Intelligence (CI) is the concept, design, practicality, and improvement
    of computational paradigms influenced by biology and language. Traditionally,
    the three pillars of CI are neural networks, fuzzy systems, and evolutionary calculations.
    However, over time, many natural factors have stimulated the development of calculation
    standards. Therefore, CI is a developing area and added value; three main elements
    include computational models such as environmental intelligence, artificial life,
    cultural learning, artificial endocrine network, social reasoning, and artificial
    hormone network. CI plays a major role in creating a successful intellectual system,
    game, and cognitive development system. In the past few years, research on deep
    learning has been surprising in a particular depth convolutional neural network.
    Today,'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'deep learning has become the core technology of artificial intelligence. Some
    of the most successful AI systems are CI.


    # 8.3.2. Types of Computational Intelligence


    Computational intelligence is a branch of “artificial intelligence” defined by
    Bezdek [21]. The fields of artificial intelligence and computational intelligence
    remain the same; this is to understand general intelligence. Marks [22] defined
    the difference between artificial intelligence and computational intelligence
    by claiming that the former is made from tough computing technologies, the latter
    is made of soft computing techniques. Hence, we can anticipate that two types
    of machine intelligence are: a) artificial intelligence, which is developed by
    the idea of hard computing; b) computational intelligence, which is developed
    with the aid of softcomputing. Similar to hard-computing-based artificial intelligence,
    computational intelligence can adapt to many different conditions through the
    advantages of soft computing. Hard-computing strategies are designed with a Boolean
    logic established simply on true or false tenets that information engineering
    relies upon. One serious issue in Boolean logic is that Boolean values are unable
    to take natural language, certainly. Though, based on fuzzy logic, soft computing
    strategies can deal with tentative cases. This kind of logic is one exclusive
    feature of computational intelligence, and through combining facts into confined
    facts, it estimates how the human mind acts (Fig. 2).


    ![](img/be45bf301a3c0ebefb162571e2625fab_201_0.png)


    Fig. (2). Computational intelligence techniques.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# 8.3.2.1. Fuzzy (Logic) Sets


    L. A. Zadeh has proposed the concept of fuzzy sets [23]. Since this seminal work,
    many researchers have significantly contributed to the growth of fuzzy sets theory
    and its applications, resulting in great success from the theoretical and scientific
    points of view. Fuzzy sets theory offers to deal with unclear limitations, representing
    vague thoughts and working with linguistic variables. Fuzzy logic is the selected
    soft computing method for executing the proposed ‘COVID-19’ diagnosis system based
    on the following reasons;


    +   - fuzzy algorithms are frequently strong, the reasoning method is often simple,
    so computing power is saved,

    +   - Fuzzy systems generally have a quicker growth time than conventional methods.
    This is a very exciting feature, exclusively in actual time systems such as online
    diagnose applications,

    +   - Fuzzy logic is flexible and easy to gadget machine learning techniques,

    +   - It is a very convenient technique for uncertain or approximate reasoning.


    However, fuzzy logic suffers from difficulty finding suitable membership values
    for fuzzy systems. It also suffers from difficulty storing the rule-base that
    might require a substantial amount of memory. Moreover, fuzzy logic must be made
    with the full supervision of experts [24, 25].


    Quick and precise detection of COVID-19 is increasingly vital to prevent the sources
    of infection as well as helping patients to prevent disease progression. Soft
    Computing (SC) techniques, such as; fuzzy logic, neural networks, and genetics
    have proven as potential tools in disease detection [26, 27]. They can support
    decision-making only for immediate isolation and suitable patient treatment [28].
    Several techniques have been proposed for detecting COVID-19 infections. However,
    hopefully, detection accuracy has not been reached yet. Fuzzy Logic (FL) describes
    systems in terms of a mix of numeric and symbolic [24, 25]. This has advantages
    over pure mathematical (numerical) approaches or pure symbolic approaches because
    system knowledge is often available in such a combination.


    # 8.3.2.2. Artificial Neural Network


    An artificial neural network (ANN) is the piece of a computing tool designed to
    simulate the way the human brain analyses and processes data. It is the substance
    of artificial intelligence (AI) and solves problems that would prove impossible
    or tough by human or statistical standards. ANN’s have self-learning abilities
    that allow them to produce higher results as greater records become available.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Artificial neural networks can be used for regression or classification modelling
    for prediction and automatic control. A large number of simulation data uses limited
    data sets. This structure is the foundation of deep learning, which is good at
    representation learning. Accordingly, artificial neural networks process and learn
    information from data via distributed information processing systems. One of the
    crucial properties of artificial neural networks is fault tolerance, which is
    approximately modelled on how the human brain operates. Neural networks have been
    widely applied to data analytics, clustering, classification, and automatic control
    engineering based on these characteristics. In real-world applications, such methods
    aim to analyse and classify medical data, recognize human faces, detect computer
    fraud, and deal with the nonlinearity of a system for better process control.


    # 8.3.2.3. Evolutionary Computing (EC)


    Evolutionary computation (EC) is a global optimization technique inspired by biological
    evolution and the subfield of artificial intelligence and soft computing studying
    these algorithms [29]. EC systems solve problems by inhabitants, error and success,
    meta-heuristics, or stochastic optimization. An initial set of candidate solutions
    is generated and updated iteratively, such as removing less-desired solutions
    and including the noise. A population of keys is subject to natural selection
    or artificial selection and alteration and hence progresses and adapts—i.e., raises
    fitness. EC is popular in computational intelligence as its outcomes in near-optimal
    solutions in a comprehensive range of frameworks [30] where there are numerous
    options and additions for specific data structures and problems.


    # 8.3.2.4. Swarm Intelligence (SI)


    COVID-19 pandemic is a dynamical complex system with swarm intelligence, and swarm
    intelligence (SI) is a part of the computational intelligence. It is collective
    behaviour exhibited by entities, mainly animals. Swarm intelligence is the collective
    behaviour of decentralized, self-organized systems. The idea is employed in work
    on artificial intelligence.


    # 8.3.2.5. Artificial Immune Systems (AIS)


    Artificial Immune Systems (AIS) are a class of computationally intelligent, rule-based
    machine learning systems inspired by the principles and processes of the vertebrate
    immune system. The artificial immune systems (AIS) area has grown dramatically
    in the last 10 years. AIS algorithms are computer programs modeled on different
    aspects of the human immune system and used to tackle various problems, from computer
    virus detection to data mining to robot control.'
