    # 4.6.2. Detection of Apnea or Hypopnea Event


    Sleep Apnea and Hypopnea are two different versions of sleep disorder. Apnea is
    caused due to complete obstruction of air while hypopnea is due to partial obstruction
    of air. So, in order to detect both of these two disorders, the variation of amplitude
    and duration of variation is to be calculated from the incoming signal from the
    sensors. The part of the signal caused due to apnea is flatter than the rest of
    the signal. The amplitude is smaller than the rest of the sound wave. As shown
    in Fig. (4.16), the ratio of amplitude of attenuated signal with amplitude A₂
    at time interval T and the normal signal with amplitude A₁ is calculated. Generally,
    apnea is detected if the ratio of the normal signal and the attenuated signal
    at T is twenty percent less than normal and for hypopnea the maximum threshold
    is less than seventy percent. The time duration T for which this disruption of
    breathing is detected must be greater than or equal to ten seconds for apnea [18].


    ![](img/be45bf301a3c0ebefb162571e2625fab_99_0.png)


