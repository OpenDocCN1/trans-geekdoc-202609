    RS. In each round t, AdaBoost calls upon a JRip classifier using the distribution
    Dₜ. The JRip classifier goes through a series of stages. It starts at the building
    stage. It builds (while satisfying the highest information gain: p(log(p/t)−log(P/T))
    and prunes (according to the pruning metric: p/(p+n)) one rule at a time. When
    it reaches at one of the termination criteria, it creates an initial ruleset RI.
    The optimization stage uses RI to split the rules and optimize them by re-growing
