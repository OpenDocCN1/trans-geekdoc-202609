  md: '# The Quantitative and Qualitative Assessment of Re-Search Conducted Using
    Computational Intelligence for the Diagnosis or Treatment of COVID-19


    Mallikarjun Kappi¹,*, Madhu S.², Balabhim Sankrappa Biradar³ and B.U. Kannappanavar⁴


    ¹ Department of Library and Information Science, Kuvempu University, Shankaraghatta,
    Karnataka, India

    ² Department of Studies in Library and Information Science, Kuvempu University,
