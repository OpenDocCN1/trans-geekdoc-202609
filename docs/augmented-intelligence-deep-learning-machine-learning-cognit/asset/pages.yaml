    # 5.6.3. Results for Research Question 2


    Numerous studies have been successful in predicting corporate bankruptcy. Thus,
    we analyze the performance of our approach with that of different techniques conducted
    on the same Polish datasets. Table 7 presents the results of other studies and
    our own. This comparison takes into account two factors: the AUC measure and the
    interpretability of the models. The interpretability examines the ability of the
    classifier in extracting decision rules, the number of these rules, and the number
    of the extracted features.'
