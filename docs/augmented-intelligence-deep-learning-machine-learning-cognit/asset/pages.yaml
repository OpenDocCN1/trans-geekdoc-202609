  md: "![](img/be45bf301a3c0ebefb162571e2625fab_92_0.png)\n\nPixel of an RGB image\
    \ are formed from the corresponding pixel of the three component images\n\nFig.\
    \ (4.7). 3D view of a RGB image\n\n# 4.4.1. Convolution Layer\n\nConvolution Layer\
    \ is one of the most important layers in the Convolutional Neural Network and\
    \ it does most of the heavy work. As the name suggest, this layer is responsible\
    \ for the convolution operations on the raw pixel values of the image. It consists\
    \ of a kernel or filter which is a matrix whose dimensions are less than that\
    \ of the image. For Example - $\begin{bmatrix}1 & 0 & 1\\0 & 1 & 0\\1 & 0 & 1\\\
    end{bmatrix}$ is a filter of size 3 x 3 x 1. The filter is the moved along the\
    \ matrix in the direction of rows by a stride length which is the amount of length\
    \ by which the filter will slide across the matrix. If it is 1, then the filter\
    \ will move by one pixel at a time. When it is 2, we the filter will move by two\
    \ pixels and so on [11].\n\nAn RGB image has 3 channels each having different\
    \ set of pixel values. In order to apply convolution on this image we need to\
    \ use filters for each channel and the filters are hovered simultaneously over\
    \ each channel and finally it is added with the bias together to give the 2D-convoluted\
    \ matrix of features as in Fig. (4.8).\n\n![](img/be45bf301a3c0ebefb162571e2625fab_92_1.png)\n\
    \nFig. (4.8). Convolution Operation."
  merge: -1
