    # 7.4. APPLICATION OF CSA IN MEDICAL DOMAIN


    The CSA algorithm has been applied in different engineering fields. The algorithm
    is also being applied in the field of medicine and being appreciated by the researchers
    for its performance. In the present section the application of variations of CSA
    in the medical domain is presented. Table 6, presents a systematic survey of the
    variations of CSA in medical domain. The variations are categorized as modifications
