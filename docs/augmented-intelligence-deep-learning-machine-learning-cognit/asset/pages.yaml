    Visualization software called VOSviewer was used to current a bibliometric study
    on Computational intelligence, Diagnosis, and COVID-19. VOSviewer software is
    a tool for creating and visualizing bibliometric maps, such as journals, research,
    or individual publications. These networks can be created based on citations,
    co-citation, bibliographic coupling, or co-authorship relations [43]. This VOSviewer
    software also offers text mining functionality that can be used to construct and
    visualize co-occurrence networks of important terms extracted from a body of scientific
    literature (www.vosviewer.com). We only used 49,835 publications with the keyword
