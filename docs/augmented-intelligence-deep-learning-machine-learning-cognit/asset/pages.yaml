  md: 'reputation of a destination host. The destination host (DH) is the host with
    which the agent wishes to pursue a transaction in the future. In MRep, the agent
    combines direct trust (DT) obtained from the pre-trusted host (assumed) called
    source host. The fixed hierarchical network of MRep is shown in Fig. (6.1).


    ![](img/be45bf301a3c0ebefb162571e2625fab_147_0.png)


    Fig. (6.1). MRep hierarchical view.


    The source host(SH) is the host with which the agent had already performed the
    transaction and declared it pre-trusted. Indirect trust(IT) is obtained from directly
    or indirectly connected hosts with SH. These hosts are responsible for giving
    indirect trust (IDT) and are called recommenders. The model divides recommenders
    into four recommender communities or groups depending on their distance from SH.
    These four recommender groups are Relatives (R): hosts possessing past transactional
    history with DH and are at one hop distance from SH. Friends(F): Host possessing
    past transactional history with DH and is at a two-hop distance from SH. Neighbors(N):
    hosts possessing past transactional history with DH and is at three-hop distance
    from SH. Strangers (S): Host possessing past transactional history with DH and
    is at four or above hop distance from SH. The fixed hierarchical network of MRep
    is shown in Fig. (6.1).


    MRep assists MA to do the prior computation of DH reputation. DR score (DRscore)
    is used to determine the transactional behavior of the host on each date. Transaction
    Score (Tscore) is the ratio of the number of successful to the total number of
    transactions given by Equation 6.1. Transaction Evaluation (TE) is the product
    of T-score on each date with recency in the time given by Equation 6.2. TE is
    weighted by a time decay function represented as e^{-dt}, where dt is the'
