- pgno: 86
  md: '# ### 4.2.3. TanH Activation Function


    TanH Activation - The Hyperbolic Tangent Activation function and its derivative
    are defined by Equations (2e) and (2f) respectively:


    $$f(x)=\tanh x=\frac{e^x-e^{-x}}{e^x+e^{-x}} \tag{2e}$$


    $$f''(x)=1-f(x)^2 \tag{2f}$$


    ![](img/be45bf301a3c0ebefb162571e2625fab_86_0.png)


    **Fig. (4.4).** TanH Activation Function.


    TanH is a non – linear, zero centred sigmoidal (S – curve) activation function
    with its range between [-1, 1] as shown in the graph in Fig. (4.4). Being zero
    – centred; it supports backpropagation and provides a better representation to
    the negative inputs. The gradient in TanH activation function is steeper than
    that of Sigmoid activation function. It is more extensively used where the inputs
    are scattered randomly. But it fails to address the vanishing gradient problem
    which aroused in sigmoid activation function [7].


    # ### 4.2.4. ReLU and Leaky ReLU Activation Function


    ReLU Activation - Rectified Linear Units Activation and its derivative are given
    by Equations (2g) and (2h) respectively:


    $$f(x)=\begin{cases}0, & x<0\\x, & x\geq 0\end{cases} \tag{2g}$$


    $$f''(x)=\begin{cases}0, & x<0\\1, & x\geq 0\end{cases} \tag{2h}$$'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/be45bf301a3c0ebefb162571e2625fab_87_0.png)


    Fig. (4.5). Rectified Linear Unit (ReLU).


    ReLU Activation function is non – linear and one of the most popular Activation
    functions when it comes to deep learning. It is highly preferred over simple logistic
    regression function due to its advantage of nullifying Vanishing Gradient problem.
    It provides an output 0 for all negatives input and passes the raw value for positive
    input as shown in the graph in Fig. (4.5). The operation of the ReLU highly implies
    that of our biological neuron.


    But ReLU comes with some drawbacks like the function is not differentiable at
    zero and another is that of dying ReLU problem which arises due to the presence
    of negative weights at the time of backpropagation [8]. Leaky ReLU Activation
    - Leaky Rectified Linear Unit Activation and its derivative are defined by Equations
    (2i) and (2j) respectively:


    $$f(x) = \begin{cases} 0.01x, & x < 0 \\ x, & x \ge 0 \end{cases} \tag{2i}$$


    $$f''(x) = \begin{cases} 0.01, & x < 0 \\ 1, & x \ge 0 \end{cases} \tag{2j}$$


    ![](img/be45bf301a3c0ebefb162571e2625fab_87_1.png)


    Fig. (4.6). Leaky ReLU.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Leaky ReLU is an improvement of traditional ReLU Activation function. If we
    compare the graphs, we notice that for input less than 0 the outputs are slightly
    descending as shown in the graph in Fig. (4.6). A slope of 0.01 or any small suitable
    value is attached to the negative values. This reduces the death of ReLU activated
    neurons thus attempting to minimize the dying ReLU problem.


    # 4.3. OPTIMIZERS AND LOSS


    # 4.3.1. Optimizers


    Suppose we have an Artificial Neural Network comprising an input layer, few hidden
    layers and an output layer. The output we get from Neural Network consist of loss
    or errors, which are being reduced using optimizers. Optimizers are algorithms
    or methods to change the attributes of a Neural Network. It updates weight associated
    with each node-to-node connection during backpropagation and learning rate dynamically
    in order to reduce loss and for faster learning.


    # 4.3.1.1. Adagrad


    Adagrad stands for Adaptive Gradient Descent. We know that in a traditional gradient
    descent learning rate (η'') is fixed, which poses a threat of overshooting the
    minima resulting in an increased loss. If we dynamically change the learning rate
    as the training progress, it gives rise to adaptive gradient descent which happens
    to be faster and more accurate compared to gradient descent. The formula of Adagrad
    optimizer is given by Equation (3a) where η'' is given by Equation (3b) where
    αt is initial learning rate which is given by Equation (3c) and ε is small positive
    number.


    W_t = W_{t-1} - η''_t \frac{\partial L}{\partial W_{old}} \tag{3a}


    η''_t = \frac{η}{\sqrt{α_t + ε}} \tag{3b}


    α_t = \sum_{i=1}^{t} \left(\frac{\partial L}{\partial W_t}\right)^2 \tag{3c}


    # 4.3.1.2. RMSProp


    RMSProp stands for Root Mean Square Propagation, which is quite similar to gradient
    descent but have momentum with it. It divides the learning rate for a weight by
    a running average of the magnitudes of recent gradients for that weight.'
