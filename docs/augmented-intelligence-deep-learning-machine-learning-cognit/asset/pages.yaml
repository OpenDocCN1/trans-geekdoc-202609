- pgno: 118
  md: '# 5.3.1. Feature Selection (FS) Algorithms


    Feature selection reduces a feature set''s dimensionality. It helps determine
    the variables with the most redundancy, irrelevancy, or noise and eliminates them.
    It generally helps obtain better data quality as well as speed up and improve
    an algorithm''s performance [46]. There are two types of FS techniques, wrapper
    methods and filter methods. The feature selection process for wrapper methods
    requires a predetermined learning algorithm. This algorithm selects the features
    that ensure the highest performance [47]. The filter methods evaluate features
    individually and compute some relevant measures for every variable. They use a
    scoring mechanism to rank the variables to achieve the best classification accuracy
    with a minimal variety of features [48]. They are usually less accurate than wrapper
    methods [49].


    The computational cost of wrapper methods is high due to the embedding of the
    classifier in the selection process. However, the ability to choose a learning
    classifier as a base for selecting the features is very intriguing. In this section,
    we present the FS techniques used in this study.


    # 5.3.1.1. Sequential Feature Selection (SFS)


    The Sequential Feature Selection (SFS) algorithms [20] are wrapper methods. They
    are specified as the baseline approach for feature selection, as they are widely
    recognized and broadly utilized in practice. They are search algorithms of greedy
    nature. They are used to minimize a dimensional feature space to a smaller feature
    subspace. The automatic selection of a subset of features is a must-have. It has
    high relevance to the problem of dimensionality minimization. This concept is
    the motivation behind feature selection algorithms. Based on the classifier performance,
    they either dispose of or add one variable at a time until the feature subset
    reaches the desired size.


    Sequential Forward Selection or SFS belongs to the Sequential feature selection
    family. It takes as input a labelled dataset, a learning algorithm, the number
    of characteristics to be selected, and outputs the generated subset of variables.
    It initializes with an empty set (“null set”) of a feature subset, the feature
    set in the dataset, and a criterion function. It starts a loop that appends a
    random variable to the feature subset. This feature, the classifier, and the feature
    set then create a hypothesis h(x). It then starts another loop and iterates through
    the remaining initial variables, chooses one, and updates h(x). If the hypothesis
    maximizes the criterion function, then the variable is added to the feature subset.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'It will continue adding features from the feature set and training them with
    the determined hypothesis until the feature subset contains the number of desired
    features specified at the start.


    # 5.3.1.2. *Particle Swarm Optimization (PSO)*


    The PSO method simulates the social behaviours of animals such as birds flocking
    and fish schooling. Initially, PSO was suggested as an optimization approach for
    continuous problems. However, the need to optimize many concepts such as feature
    selection pushed the creators of the PSO algorithm to broaden its usage. To solve
    the discrete problems, they introduced binary particle swarm optimization (BPSO).
    The technique encodes the position of every particle via a binary string [50].


    The technique works as follows. A swarm refers to a population where viable solutions
    encode as particles in the search space. This technique starts by randomly initializing
    a population of particles. Particles roam the search space to find the ultimate
    solution. The algorithm updates the position of each particle according to its
    experience and that of its neighbours. The best prior particle position is saved
    as the personal best (pbest), while the best position acquired so far by the swarm
    is the global best (gbest). At every iteration, BPSO updates the position and
    the velocity of every particle and then finally outputs the best solution [51].


    # 5.3.1.3. *Random Subset Feature Selection (RSFS)*


    Random Subset Feature Selection (RSFS) is used to detect a subset of features,
    which is more suitable than the original variable set [52]. RSFS evaluates every
    variable depending on its adequacy in the different feature combinations. The
    values of the relevance are not based on the preceding options in the selection
    procedure but are a by-product of several independent tests [53].


    In RSFS, the random subset classification is carried out as often as it is crucial
    to differentiate appropriate features from variables that merely seem beneficial
    because of the random factors of the process. Consequently, there is no greedy
    backward elimination needed, and the feature set quality improves progressively
    as arbitrary aspects in the selection procedure are averaged out [54].


    RSFS takes as input an initial set of features (F) alongside a learning algorithm
    and a criterion function. It initializes the algorithm with a dummy feature set
    zj, a hypothesis for feature relevance, and a null set. The algorithm starts by
    selecting a'
