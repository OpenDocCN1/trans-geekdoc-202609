- pgno: 74
  md: '# CONCLUSION


    The association of spectroscopy and multivariate calibration methods has enabled
    the analysis of complex spectra of multicomponent systems, and for that reason,
    in this chapter, we present some tree-based tools and highlight features of interest
    compared to other machine learning algorithms. The selection of subsets of attributes
    by a wrapper algorithm based on random forest, Boruta, proved to be as effective
    in selecting variables as evolutionary algorithms that are very popular among
    specialists. In regression problems in the high dimensional space, the ensembles
    of trees such as random forest and gradient boosting trees proved to be more predictive
    than the chemometric techniques already established by the literature and, in
    particular, the random forests proved robust to noise at equal or higher levels
    to 35%. In the discriminatory analysis of a trace-level contaminant in a complex
    matrix, RF and GBT proved to be as predictive as multilayer perceptron neural
    networks, with the advantage that the first two are less computationally costly.


    # NOTES


    The method based on genetic regression (GR) was also presented. However, since
    the author chose to present a genetic expression instead of the pure attributes,
    we chose to suppress these findings here.


    # CONSENT FOR PUBLICATION


    Not applicable.


    # CONFLICT OF INTEREST


    The authors declare no conflict of interest, financial or otherwise.


    # ACKNOWLEDGEMENTS


