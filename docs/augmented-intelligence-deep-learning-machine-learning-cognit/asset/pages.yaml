  md: 'chase other crows to obtain their food. It has been applied successfully to
    different science and engineering fields of optimization [9]. Nonetheless, the
    current and focused analysis of this algorithm is lacking in the literature. Furthermore,
    the CSA was no longer compared to new algorithms; since then, many new algorithms
    have been introduced. Experimenting with CSA on a wider variety of test functions
    and comparing it to modern and reliable algorithms would, therefore, further expose
    the use of the algorithm. As a result, the objective of this paper is to first
