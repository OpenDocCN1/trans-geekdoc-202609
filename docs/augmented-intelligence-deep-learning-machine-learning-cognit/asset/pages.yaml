- pgno: 62
  md: 'independently and almost simultaneously, by Yali Amit and Donald Geman (1994)
    and Tin Kam Ho (1995) [7] and perfected by Leo Breiman [22]. RF consists of a
    set of unpruned decision trees, created using bootstrap samples of the training
    data and random feature selection in the induction of the tree [3]. The idea of
    generating several bootstrap samples and averaging predictors is known as bagging
    (bootstrap aggregating). Formally speaking, the M trees randomized by a random
    vector Θ, where Θ1, ..., ΘM are random attributes in bootstrap samples independent
    of the original dataset Dn, are combined to generate forest estimates:


    m_{M,n}(x; Θ1, ..., ΘM, Dn) = 1/M Σ_{j=1}^M m_n(x; Θj, Dn) (3.1)


    Also, another great advantage of using this ensemble-based method involves a procedure
    of producing variable importance [20] (as seen in more detail in section 3.5.1)
    and in which the prediction is made by gathering the set predictions, considering
    the majority decision or averaging [3].


    The random forest has shown an excellent performance in high-dimensional and ill-posed
    problems [23], where the number of variables is much greater than the number of
    observations, being able to deal with highly correlated variables and complex
    interaction structures [24]. The advantage of RF to deal with multi-dimensional
    complex data is mainly due to the random distribution of attributes in each tree
    in the forest, making each element specialize in a section of the input space,
    and also to the low probability of overfitting since with the increase in trees
    in the forest, the generalized error converges to a limit value [22].


    In comparison with other statistical classifiers, RF presents several advantages;
    only a few tuning parameters [25], low computational cost [7], nonparametric nature,
    ability to determine variable importance, high classification accuracy [21], high
    prediction accuracy [3], capability to model complex interactions among predictor
    variables, and an algorithm for estimating missing values [19]. A study by Fernández-Delgado
    et al. [26] demonstrated the best performance of RF in relation to other learning
    methods. In this case, 179 classification algorithms from 17 learning families
    were compared using 121 data sets, and it was verified that random forest stood
    out as the best classifier.


    Random forests have become popular for their predictive performance [3, 7, 19-22,
    25], but RF have the flexibility to perform different types of analysis, involving
    regression, classification, survival analysis and unsupervised learning [19, 21].
    Different versions of random forest algorithms are reported in the literature,
    varying methodologies for selecting features and trees and selecting the best-split
    [23].'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 3.4. EXPERIMENTS


    For the discussion of sections 3.5.1.3 and 3.6, we used the spectra provided by
    Dr. Kalivas [27]. This data set contains 60 different gasoline samples with different
    compositions and octane numbers (ON). The samples were analyzed by near-infrared
    spectroscopy (NIR) and measured using diffuse reflectance, between 900 and 1700
    nm, with a spacing of 2 nm.


    For the discussion of section 3.7, we used the spectra obtained experimentally
    in a recently published work [28]. The data set consists of 144 samples of pure
    and tylosin-spiked milk. The samples were analyzed by Attenuated total reflectance-Fourier
    transform infrared spectroscopy (ATR-FTIR) between 3000 and 1000 cm⁻¹ using DairySpec
    FT equipment (Bentley Instruments, Chaska, USA).


    All chemometric analyzes were performed in software R (R Foundation, Austria)
    version 4.0.0, together with the packages randomForest v. 4.6, ranger v. 0.12.1,
    rpart v. 3.0.9, pls v. 2.7, neuralnet v. 1.44.2, brglm 0.6.2, gbm v. 2.1.5, through
    the caret aggregator package (classification and regression training) version
    6.0.


    # 3.5. DIMENSIONALITY REDUCTION IN RAW SPECTROSCOPIC SPACE


    A typical Fourier transform infrared spectroscopy analysis is usually performed
    between 4000 and 400 cm⁻¹, with a spectral step of 2 cm⁻¹. A chemometric analysis
    that considers each wave number obtained in the scan as an independent variable
    to be analyzed would come across a high-dimensional space containing 1801 potential
    variables.


    Naturally, the number of cases experimentally observed using this instrumental
    technique is much lesser than the total number of attributes that can be extracted.
    In such cases, even if wrongly, the parametric machine learning algorithms are
    preferably used for model fitting. Models based on this type of algorithm summarize
    data with a set of supervised statistic parameters of fixed size in class estimation.
    In other words, in the training step, the functional extracts parameters are based
    on strong statistical assumptions and use some method to estimate the input data.
    Some examples of parametric machine learning algorithms include linear regression,
    logistic regression, partial least squares regression (PLS), main components regression
    (PCR), simple neural networks, among others. These algorithms are also called
    linear machine learning algorithms [29].'
