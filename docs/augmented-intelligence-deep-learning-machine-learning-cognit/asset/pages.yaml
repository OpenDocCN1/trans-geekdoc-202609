  md: 'prediction; data imbalance, feature space reduction, and rule extraction. To
    resolve these problems, we used and evaluated several machine learning algorithms.
    We constructed our proposed model in two phases, feature selection and classification.
    In the feature selection phase, we used several algorithms to extract an optimal
    subset of features and identified SBS as the best technique. In the classification
    phase, we combined the properties of the AdaBoost algorithm of the JRip algorithm
    to perform the classification. This combination allowed us to resolve the data
    imbalance issue and obtain comprehensible decision rules for the Polish bankruptcy
    dataset. The results prove that our model outperforms most of the existing work
    on the AUC metric. However, when compared to some of the other studies, it falls
    short in some areas. Still, we find that our approach bested others in the comprehensibility
    and interpretability of the models. Perhaps, in the future, using a technique
    similar to the synthetic feature method would optimize our results even more.


