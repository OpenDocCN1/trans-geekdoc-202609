    # 4.7. DEEP LEARNING IN CARDIAC ARRHYTHMIA DETECTION


    Cardiac Arrhythmia is a condition in which the heart ceases to beat normally i.e.,
    either it’s in tachycardia or bradycardia resulting in abrupt rhythm. Arrhythmia
    is mainly caused by Atrial Fibrillation or changes in the heart tissues. Atrial
    Fibrillation is a medical condition rather than a disease, which causes the atrium
    in the heart to beat chaotically which eventually results in stroke or heart failure
    further resulting in permanent paralysis or death. In contrast, Ventricular Tachycardia
    causes fast, unpredictable pulse originating with anomalous electric signals received
    in the ventricles. The Electrocardiogram (ECG) is a common test used to diagnose
    Atrial Fibrillation. The traditional way of doing ECG where the doctor or the
    cardiologist takes the decision is a tedious and expensive way to monitor. Few
    conventional methods are already present which uses different classification methods
    of Machine Learning algorithms. The most commonly used ML algorithms include the
    likes of SVM, Decision Trees and Random Forests, but those lacks accuracy and
    precisions. The traditional ways of diagnosis are being replaced by using systems
    based on Deep Learning architecture. Such systems take continuous input of ECG
    signal from a health band which eventually notifies about the health condition.
    Such Deep Learning architecture are made of Convolutional Neural Networks and
    LSTMs for the extraction essential parameters required to classify between Arrhythmic
    conditions and normal [19]. Fig. (4.18) shows ECG signal for different heart conditions.'
