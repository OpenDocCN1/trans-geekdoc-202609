- pgno: 219
  md: 'factors often discussed in the prediction models of infectious diseases include
    human behaviors, temperature variation, population mobility, the relationship
    between humans and wildlife, etc [52 - 55].


    We intended to provide an overview of the entirety of computational intelligence/
    machine learning and related specific areas that have been used for the diagnosis
    and treatment of “COVID-19” patients'' research. This study provides a comprehensive
    overview of the computational intelligence and related specific areas of research
    conducted which have been used for diagnosis and treatment of “COVID-19” patients.
    The detection of the virus was the most important and challenging task, but modern-day
    technology detection, diagnosis and treatment made it possible to cover the possible
    aspects of detectingthe virus. CI/ML and alliance research provide various aspects
    of different strategies to diagnose and treat the needed “COVID-19” patients by
    CT Scan and X-ray by their respective datasets. Hence, there are 11 (18.033%)
    research papers (using different computational intelligence and related techniques)
    each from India and China that contributed to the collaborative effort to combat
    against the “Covid- 19”. IEEE Access published 9 scientific publications related
    to computational intelligence and allied subjects. However, the IEEE Transactions
    on Medical Imaging tops the list with total citations of (TC=17 and h-index 3).
    Highly prolific institute ‘Huazhong University of Science Technology’ contributed
    3 publications with 8 citation count. Apostolopoulos I D from ‘University of Patras
    (Greece)’ placed top author and received the most citations (TC=33, 2 h-index,
    2 g-index, and 2 m-index). The median (IQR) number of citations was 3.75 (5.75–2).
    “COVID-19: automatic detection from X-ray images utilizing transfer learning with
    convolutional neural networks,” published in Physical and Engineering Sciences
    in Medicine in 2020 was top in the list with total citations of 28. The most frequently
    occurred top keywords are: COVID-19 (46), Deep Learning (23), Machine Learning
    (11), Computed Tomography (10). The Computational intelligence and related specific
    areas of research conducted which have been used for diagnosis and treatment of
    “COVID-19” are accelerating quickly, with potential applications being verified
    across different areas of medicine. However, there are presently rare examples
    of such techniques effectively deployed into clinical practice. Future computational
    intelligence research should be dedicated to filling the gap between computational
    intelligence and related specific areas of research for diagnosis and treatment
    of “COVID-19”.


