  md: '# 8.4. COVID-19 DIAGNOSIS TOOLS


    Presently, the responsiveness for ‘reverse transcription-polymerase chain reaction
    (RT–PCR) based epidemiologic nucleic acid tests are used as the reference normal
    method to check COVID-19 infection [31]. Still, that research laboratory test
    is time-intensive, and the supply of test kits may be restricted access for a
    rapidly increasing suspicious population even for many developed countries such
    as the US, UK, USSR, Germany, etc... Most significantly, early false-negative
    or weakly positive RT–PCR test results were found in several later-confirmed cases,
    whereas extremely suspicious ‘Computed Tomography’ (CT) imaging features were
    extant [32, 33]. The treatment and screening of COVID-19 can be more effective
    when the deep learning method, CT features, and real-time RT–PCR results are integrated
    [34]. AI and deep learning can help in develop diagnostic tools and decide on
    treatment [35, 36]. Consequently, various diagnostic tools were developed based
    on the machine learning algorithm to fight COVID-19. For example, Apostolopoulos
    and Mpesiana (2020) applied transmission learning with CNN to identify COVID-19
    from X-ray images covering collective bacterial pneumonia and normal incidents,
    and well-known COVID-19 infection. Transfer learning CNN was used to diagnose
    COVID-19 cases from X-ray datasets. The results indicated that VGG19 diagnosed
    COVID-19 confirmed cases with better accuracy on two- and three-classification
    problems than MobileNet v2, Inception, Xception, and Inception ResNet v2. The
    proposed approach can help develop a cost-effective, fast, and automatic COVID-19
    diagnostic tool and reduce the exposure of medical workers to COVID-19. Similarly
    [37], developed an automated ‘Computer-Aided Diagnosis’ (CAD) system for the detection
    of COVID-19 samples from healthy cases and cases with pneumonia via chest X-ray
    (CXR) images. Their study demonstrated the effectiveness of applying deep transfer
    learning techniques to identify COVID-19 cases with CXR images.


