  md: '# # Crow Search Algorithm: A Systematic Review


    Ali Aloss¹, Barnali Sahu¹,* and Om Prakash Jena²


    ¹ Department of Computer Science and Engineering, Siksha O’ Anusandhan (Deemed
    to be university), Bhubaneswar, Odisha, India

    ² Department of Computer Science, Ravenshaw University, Cuttuck, Odisha, India


    **Abstract:** Cognitive computing and Artificial Intelligence (AI) are Computer
    Science branches which aim to create machines and ingenious technologies that
    are capable of working and thinking like humans. Evolutionary computing is a subfield
    of AI that uses nature-inspired mechanisms (algorithms) and solves problems through
    processes that mimic the behavior of living organisms. Researchers have focused
    on several meta-heuristic algorithms, and the Crow Search Algorithm (CSA) is one
    of the recently developed algorithms dependent on the astute conduct of crows.
    CSA is a populace-based methodology. It works by storing excess food in hiding
    places and extracting the food when necessary. This algorithm has been used in
    different fields such as medical diagnoses, fractional optimization problems,
    and energy problems. Several modifications have been made to this algorithm, and
    the current research focuses on a systematic review of the applications of the
    crow search algorithm in the medical domain and the variants of CSA and its application
    in different engineering fields.


    **Keywords:** Application of CSA, Crow search algorithm, Evolutionary algorithm,
    Medical diagnosis, Meta-heuristic algorithm, Variants of CSA.


    # ## 7.1. INTRODUCTION


    One of the most difficult concerns in recent decades has been diagnosing and addressing
    medical disorders. Cognitive Computing and Artificial intelligence techniques
    have revolutionized the sphere of diagnosing clinical problems and proposing treatments
    in addition to their primary ability to analyze over the past years. Algorithms
    focusing primarily on machine learning are among the first algorithms that were
    designed and used for analyzing medical data because they comprise many tools
    that are crucial in this field. One of the fundamental challenges in the health
    care system is to obtain an efficient utilization of'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'expensive assets while maintaining or providing quality care. To enhance the
    product-ability in health care system, optimization is applied in each field,
    starting from activity scheduling to prediction of diseases. In optimization,
    the objective is to find the best solution among many alternative solutions or
    the properly adequate solution to a given problem. In daily life, everyone is
    dealing with optimization problems, *i.e.*, finding the shortest route from home
    to the workplace subject to traffic constraints or organizing our agenda. Most
    human brains are appropriate in finding solutions to these everyday problems effectively
    because they are still solvable due to the limited dimension. Some problems, however,
    appear much larger in scale than computer algorithms are designed to handle. There
    are no efficient algorithms for these complex problems since the majority of such
    techniques are typically tailored to the problem at hand, and they seek to take
    full advantage of the particularities of this problem. Since they are always too
    greedy, they are usually stuck in a local optimum, and therefore fail to achieve
    the desired global optimum solution. To obtain the optimal global solution, several
    metaheuristic algorithms are proposed [1] which were found to be very efficient
    for solving very complex problems. Heuristics algorithms are designed to solve
    a particular problem without being able to generalize or refer to other related
    problems. In contrast, a meta-heuristic method stands for a higher-level heuristic
    in the context that it guides its design [2]. The meta-heuristic algorithms are
    broadly classified as single solution-based algorithms and population-based algorithms.
    In the first case, a random result is produced and enhanced until the optimal
    solution is found, whereas, in the second category, solutions are generated in
    a given search space and -try to improve until the optimal solution is achieved.
    However, the second category can find the global optimum, whereas the first category
    fails to do so. Therefore, researchers are motivated towards population-based
    algorithms. Thusly, we may use one of these approaches to develop a particular
    procedure to gauge an approximate answer for an optimization issue. In the area
    of global optimization, a large number of Meta-heuristic Algorithms (MA) such
    as Particle Swarm Optimization [3], Ant Colony Optimization [4], Bat algorithm
    [5], Artificial Bee Colony Optimization [6], Crow search Algorithm (CSA) [7] had
    been proposed over the years to solve complex engineering problems in a reasonable
    amount of time by harmonizing the exploration and exploitation criteria. The classification
    of meta-heuristic algorithms includes evolutionary-based algorithms, physics-based
    algorithms, and Swarm Intelligence algorithms. Swarm Intelligence (SI) is a part
    of the meta-heuristic, which is related to flocks that depend on the interaction
    between each other by following some basic instructions [8].


    One of the meta-heuristic algorithms proposed by Askar Zadeh in 2016 is the Crow
    search algorithm; it relies upon analyzing the smart behaviors of crows through
    the potential of crows to conceal their food in protected locations and'
