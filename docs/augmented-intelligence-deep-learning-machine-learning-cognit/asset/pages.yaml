    # 4.6. DEEP LEARNING IN DETECTION OF SLEEP APNEA


    Sleep Apnea is a sleep disorder where breathing stops abruptly stops for at least
    ten seconds and starts repeatedly. Loud snoring and feeling of tiredness are two
    important symptoms of sleep apnea. In the beginning sleep apnea is detected by
    using full night polysomnography. This is called type 1 sleep study. It consumes
    a lot of time and requires a lot of space. Moreover, it involves a lot of wirings
    connected to various parts of the body which is very inconvenient for the patient.
    In type 4 sleep study which uses acoustic sensors and pulse oximeter makes it
    more portable and requires a smaller number of signals. In this study a deep convolutional
    neural network is first trained with training datasets in order to establish the
    crucial parameters and relationships among them [16]. The designing of a good
    convolutional neural network involves a good amount of trial and error. The performance
    of the neural network totally depends on the extracting the essential parameters
    through feature extraction. It is then used on test data to determine whether
    a particular patient has sleep apnea or not. The time required in type 4 sleep
    study during the training and implementation of deep learning model can be high
    due to complex nature of data and neural network but once the deep model is created,
    the testing requires little to no time.


