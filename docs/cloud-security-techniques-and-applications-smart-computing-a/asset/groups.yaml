    # Preface


    Sustainable computing paradigms like cloud and fog are mining better solutions
    to handle the issues of security, privacy, performance, storage, processing, maintenance,
    efficiency, integration, cost, energy and latency. In these evolving days, according
    to statistics, billions of connected devices are producing enormous amounts of
    real time data. For complex computation and processing of the collected data in
    order to make the dynamic decisions these devices are connected over the cloud
    or fog environment. Best practices and protocols are being implemented by cloud
    to ensure security and privacy everywhere in the architecture.


    This book illuminates some of the best practices and their respective outcomes
    in cloud environment to preserve privacy and security. This book is aiming to
    provide next level of security and privacy preserving techniques for dynamic cloud.
    Innovative techniques and methods for secure cloud are gathered to present advanced
    and specialized research in the selected area.


    Various state-of-the-art and cutting edge methods to achieve security and privacy
    in cloud computing environment by using Artificial intelligence, Machine learning,
    Blockchain, IoT, DDoS mitigating practices, Industry 4.0, Cloud manufacturing,
    Data analytics and Vanet are essential slices of this book.


    This book essences on various research issues related to security and privacy
    preserving approaches and techniques using big data storage and analysis, large
    scale data processing, knowledge discovery and knowledge management, computational
    intelligence, data security and privacy, data representation and visualization
    and data analytics. The featured technology of this book optimizes various industry
    processes using business intelligence in engineering and technology. This book
    sheds light on cloud based secure integrated and development practices to increase
    productivity and reduce the operational cost.


    Chapter 1 focuses on AI based advanced technology that helps companies to manage
    complex operations efficiently and improve productivity. AI-based networks allows
    to maximize organizational performance but also to evade risks and threats. This
    chapter focuses on security and privacy related issues and explored effective
    counter measure to handle such issues. This chapter also provides latest literature
    on collaboratively secured collections to identify the kind of vulnerability they
    address and also the form of approach they use to handle it.


    Chapter 2 focuses on Blockchain based advanced technology to deliver infrastructure
    and has been adopted widely due to its performance and availability. Blockchain
    Technology, one of the emerging technologies can be used to complement the issues
    concerning cloud users. This technology provides features like decentralization,
    distribution, authenticity, immutability, trust, etc. that can be used to face
    the threats of data integrity. This chapter focuses on concerning the security'
  - '[PAGE 8]


    and privacy of the data in the cloud model and how the features of the blockchain
    technology can enhance the integrity of this model.


    Chapter 3 focuses on DDoS attack occurrences, DDoS types and associated security
    and privacy issues in cloud computing environment. Due to the dynamic behavior,
    distributed paradigm and heterogeneity present among the processing elements,
    devices and service oriented pay per use policies; the cloud computing environment
    is having its availability, security and privacy issues. Among these various issues
    one of the important issues in cloud computing paradigm is DDoS attack. This chapter
    put in plain words the DDoS attack, its detection as well as prevention mechanisms
    in cloud computing environment. This chapter also explains about the effects of
    DDoS attack on cloud platform and the related defence mechanisms required to be
    considered.


    Chapter 4 focuses on secure cloud based healthcare application to handle big data
    of healthcare industry. Handling and processing such huge chunks of data can be
    a daunting task. To avoid scenarios of this type, many of the healthcare sectors
    have adapted cloud computing as the solution. This chapter explains privacy related
    issues and security related concerns, dynamically acceptable storage, regulatory
    issues, electronic documents containing patient’s data, handwritten medical editions,
    various images such as X-ray, MRI scan and radiology images analysis.


    Chapter 5 focuses on secure IoT frameworks, methods, security arrangements, and
    the best protection models are important and suitable for the various layers of
    IoT operated applications. This chapter also proposed embossed IoT model: standard
    and expanded with security and safety components and layers of physical evidence.
    This chapter also explains about perceived security vulnerabilities and best security
    measures to combat network security risks in all layers of cloud, edge, and IoT.


    Chapter 6 focuses on efficient marketing strategies for business to business marketing
    and business to customer marketing are greatly heightened by using cloud based
    marketing automation solutions. Cloud governance ensure to meet business desires
    and needs through professional practices. Significant factors to ensure security
    in cloud marketing are embedded in each phase of marketing life cycle. This chapter
    explains about various cloud based secure marketing solutions to meet next generation
    marketing needs.


    Chapter 7 focuses on secure machine learning model to anticipate in finest outcomes
    and boost the choice of cloud based long-term course of actions. This chapter
    is proposing best strategic cloud security enhancement model for next generation
    computing standards. Efficient machine learning algorithms like convolution neural
    network gives automatic and responsive approaches to reinforce security in a cloud
    environment. These models give solutions that incorporate holistic approaches
    for secure enterprise knowledge throughout all the cloud applications.


    Chapter 8 focuses on secure intelligent VANET for smart transportation to observe
    resolutions using cloud based infrastructure. The vehicles connect together'
