    \n## 贡献者列表\n\nSirisha Potluri女士是海德拉巴ICFAI高等教育基金会计算机科学与工程系的助理教授。她正在印度维杰亚瓦达的KL教育基金会攻读云计算领域的博士学位。她的研究领域包括分布式计算、云计算、雾计算、推荐系统和物联网。她拥有7年以上的教学经验。她的教学科目包括C语言计算机编程、数据结构、核心Java、高级Java、C++面向对象编程、分布式操作系统、人机交互、C#和.NET编程、计算机图形学、Web技术、UNIX编程、分布式与云计算、Python编程和软件工程。她在知名国际期刊上发表了22篇同行评审的学术研究论文。她参加了由IEEE和Springer等专业机构组织的11次国际会议，展示其新颖的研究论文。她拥有一项云计算领域的专利，并编辑了两本图书。她是IEEE计算机学会的会员。Sirisha是Inderscience\
