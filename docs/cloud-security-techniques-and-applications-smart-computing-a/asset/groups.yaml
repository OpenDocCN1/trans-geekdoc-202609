    # Marketing Analytics as a Service: Secure Cloud Based Automation Strategy


    **Abstract:** Efficient marketing strategies for business to business marketing
    (content, inbound, social media, SEO, SEM, account based, earned media, referral
    programs, industry events, conversational and step ahead as resolutions) and business
    to customer marketing (social network, paid media, internet, email, direct, point
    of purchase, cause, conversational, earned media and storytelling) are greatly
    heightened by using cloud based marketing automation solutions. Cloud governance
    ensures meeting business desires and needs through professional practices. Significant
    factors to ensure security in cloud marketing are embedded in each phase of marketing
    life cycle. Various cloud based secure marketing solutions are detailed and their
    performance is compared and illustrated in this work. To meet next generation
    marketing needs cloud based solutions are foremost preference for implementing
    efficient marketing strategies.


    **Keywords:** Customer Relationship Management, Cloud Marketing, Marketing analytics
    as a Service, Cloud Security, Cloud Privacy


    ## 1 Introduction


    Cloud-based efficient solutions in marketing, sales, promotion and CRM save money
    by converting capital expenses or capital expenditure (CapEx) into operating expenses
    or operating expenditure (OpEx). Flexibility, availability and ease of use features
    of cloud-based marketing automation suite provide public cloud services based
    on pay-as-you-use model to avoid investing in servers, storage devices and other
    computing infrastructure. For storing sensitive data, maintaining greater flexibility,
    security, privacy and control, the private cloud offers necessary business solutions.
    Hybrid cloud is aimed at combining public and private clouds to meet the business
    objectives. To bring business groups or organizations together which are having
    common business interest, concern or goal in order to share CapEx and OpEx and
    observe reduced costs, community cloud is an abundant choice [1-3]. Various categories
    of clouds which are available to meet business objectives of diverse forms of
    organizations are given in fig. 1.


    ![](img/09fa00ca1419044515be1e45aa422bc8_126_0.png)


    | Cloud Type | Features |

    |---|---|

    | Public cloud | Converts CapEx to OpEx; Provides pay-as-you-use model; Allows
    several users |

    | Private cloud | Control existing CapEx; Supports to reduce OpEx; Limited to
    single tenant |

    | Hybrid cloud | Combines public and private clouds; Supports to reduce costs
    by manipulating CapEx and OpEx; Business resource portability |

    | Community cloud | Supports to reduce costs by manipulating CapEx and OpEx; Business
    resource portability; Bring business groups or organizations together |


    Fig. 1: Cloud deployment models for business and management


    ## 2 Cloud Governance through Marketing Automation: To Meet Business Desires


    Cloud platform provides expert governance solutions to meet business needs, objectives
    and desires as shown in fig. 2. Marketing strategy includes the plan as given
    below.


    - Identify: Ask yourself - Who you are and what you are for

    - SWOT: Examine yourself - What are your strengths, weaknesses, opportunities,
    limitations

    - Target: Identify yourself - Who is your target market, their behaviour and needs

    - Inspection: Examine yourself - Where your target and your contributions intersect

    - USP: Create yourself - What is your unique selling point

    - Refine: Review yourself - What is your feedback and corrective measures


    ![](img/09fa00ca1419044515be1e45aa422bc8_127_0.png)


