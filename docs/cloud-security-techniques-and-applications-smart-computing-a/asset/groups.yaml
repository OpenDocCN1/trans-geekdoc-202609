    Therefore, clearly there should be goals for the information security that should
    be satisfied, which are:


    - C – Confidentiality

    - I – Integrity

    - A – Availability


    Confidentiality means making sure that the information that has to be kept secured
    is secured and there shall be no access for unauthorized users to read the information.
    Integrity means making sure that unauthorized users cannot modify or destroy the
    information. Availability means making sure that authorized people are not prevented
    from accessing the information.


    Cloud architecture and its disparity from standardized traditional on-site systems
    make the identification and separation of different aspects in cloud security
    an arduous task.


    This module is an attempt in exploring various security challenges and proposing
    suitable solutions for cloud security.


    ## 2 Literature Analysis


    In DDoS attacks, the attacker dispatches an order to a system called the command
    and control server (C&C server) which will coordinate and trigger a botnet. Generally,
    a botnet can be considered as a set of compromised hosts, which obscure the attacker
    by providing a level of indirection. The C&C server orders the botnet to launch
    a DDoS attack against the victim (server), and afterward, the bots will direct
    the attack packets to the victim whose content depends on the type of attack.
    Thus, the attacker host is separated from its victim by one or more intermediate
    layers of zombie hosts. A zombie or bot is a compromised computer under the control
    of an attacker who controls many other machines which altogether form a botnet
    [5-7].


    ## 3 Classification of DDoS Attacks


    Distributed denial-of-service attacks can be categorized based on their various
    features and origin of an attack. DDoS attacks can be categorized as external
    DDoS attacks and internal DDoS attacks [8-10].


    ### 3.1 Various types of external and internal attacks


    #### 3.1.1 External attacks to internal attacks


    In this case, the botnet which performs the attack comes from an external target
    system. The attack can target a network entry of the Cloud infrastructure or the
    servers. If a specific client in a virtual machine becomes a victim of an attack,
    it will also affect the other virtual machines present on the same server of the
    Cloud.


    #### 3.1.2 Internal attacks to external attacks


    In this case, the attack can take place by taking possession of a virtual machine
    that is running within the Cloud. This can be done with a Trojan horse. A Trojan
    horse is malicious software or a code that can take control of the system. The
    choice of which depends on the customer’s virtual machine to infect is important
    because if a customer owns a large number of virtual machines, the Trojan horse
    can probably spread all over the virtual machines, thus forming a botnet.


    #### 3.1.3 Internal attacks to internal attacks


    In the Cloud infrastructure, an internal botnet is formed which can attack another
    target inside the system such as a single virtual machine or a bunch of virtual
    machines. All the Cloud infrastructures may break down under these kinds of attacks.
    Different kinds of attacks approach different types of attackers where each type
    of attack scenario correlates to a particular attacker with a specific location
    and goals.


    ### 3.2 Classifications of DDoS attacks


    #### 3.2.1 Protocol vulnerability exploitation


    These attacks take advantage of the known weaknesses which are present in the
    protocol such as flaws in design or implementation of protocols, inappropriate
    activities, and can change the data that goes to and from a particular target.
    Depending on the design, certain protocol steps might be created to check the
    potential for DoS attacks.


    #### 3.2.2 Malformed packets


    A malformed packet attack is often launched against many protocols. For instance,
    a malformed packet attack against the IP protocol. In IP packet options attacks,
    malformed packets can randomize the optional fields which are within an IP packet
    and can set all the Type of Service bits to one, which could cause more processing
    within the victim for packet handling.


    #### 3.2.3 Flooding attacks


    A flooding attack is also called a bandwidth distributed DoS (BW-DDoS) attack.
    The attacker tries to flood the victim with unwanted traffic to prevent legitimate
    traffic. Flooding attacks differ based on the type of protocol. A few of the strong
    attacking agents include privileged zombies, which have control over their hosts,
    whereas weak agents include programs that are downloaded automatically and run
    in sandboxes.


    #### 3.2.4 Amplification attacks


    They are a devastating version of reflective DDoS attacks. They utilize the inherited
    nature of network protocols to increase the amount of traffic that is reflected
    to the victim. As a result, the traffic that reaches the victim is amplified by
    the reflector server. Amplification DDoS attacks are created by amplification
    through flow multiplication attacks or through payload magnification, where a
    large number of responses are produced, or response messages bigger than the corresponding
    requests are issued by the reflector.


    #### 3.2.5 Reflective attacks


    Another method applied by DDoS attackers is the reflective method. This method
    helps the attacker send traffic to the victim indirectly and helps the attacker
    stay undetected. In this method, all attack packets that the attacker sends contain
    the IP address of the victim within the source address field of IP packets.


    Classification of DDoS attacks is given in Fig. 1.


    ![](img/09fa00ca1419044515be1e45aa422bc8_67_0.png)


    **Fig. 1:** Classification of DDoS Attacks


    ### 3.3 Current popular DDoS attacks


    - AgoBot: It is one among the foremost popular bots with an anti-virus vendor
    that has over 600 versions. Its variants are Gaobot, Nortonbot, Phatbot, and Polybot.

    - SDBot: It has over 1800 variants and comes with ping and UDP flooding tools.

    - RBot: It has over 1600 variants and is written in C++ to target Windows systems.

    - SpyBot: It is written in the C programming language and also affects the Windows
    operating system.


    ### 3.4 Factors affecting severity of DDoS attacks


    - Type of attack

    - Type of protocol or event misused within the attack

    - No. of attacking hosts

    - Amount of resources at the victim’s site

    - Type of cloud, mostly public cloud


    ## 4 DDoS Mitigation Techniques


    DDoS mitigation techniques help us in effectively combating the attacks. A few
    of the mitigation techniques are as follows:


    ### 4.1 Reducing attack surface


    Reducing the services which will be attacked limits the choices for attackers.
    Using firewalls and network access control lists will allow only necessary traffic
    to necessary ports from essential hosts only. Considering the case of web servers,
    they permit traffic from anywhere to port 80 of your webserver. And in such cases,
    one should further take other protective measures. Even for the websites which
    are accessible across the web, one can reduce the attack surface by restricting
    traffic to countries where users are located.


    ### 4.2 CDNs


    CDNs distribute the content and boost performance by minimizing the distance between
    resources and end-users. They store cached versions of the content in multiple
    locations, and this eventually mitigates DDoS attacks by avoiding a single point
    of failure when the attacker is trying to focus on a single target.


    ### 4.3 Black hole routing


    As the name suggests, black hole routing, without any filtering, routes both legitimate
    and malicious traffic to a null route or black hole, where the traffic is dropped
    from the network. Depending on the pattern, if one can identify the attacker,
    then the packets are often filtered and can be routed back to the black hole.


    ## 5 Stages of DDoS Mitigation


    ### 5.1 Detection


    Initially, there is a need to detect if an attack is present or not. At this phase,
    there is a need to identify the legitimate traffic and malicious software. In
    the event of mitigating DDoS, one shouldn’t drop potential customer traffic, which
    would be disastrous.

