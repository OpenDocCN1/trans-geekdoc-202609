  mdcn: "\n\n### 5.2 响应\n\n一旦检测到攻击，就有必要寻求如何应对这些攻击。\n\n### 5.3 路由\n\n通过智能路由，可以将剩余流量分解为可管理的数据块，由其所路由到的集群资源进行处理。\n\
    \n### 5.4 自适应\n\n这是 DDoS 缓解中最重要的阶段之一，需要搜索 DDoS 攻击的模式，并检查这种分析是否能进一步增强缓解技术。\n\n\
    ## 6 DDoS 攻击中的隐私\n\n数据集 LLDOS 的分析如下：\n\n|  | 数值 |\n|---|---|\n| 阶段流编号 | 172.16.112.*\
