    claim damages to the server for data errors or any kind of mistakes in the data.
    Another major disadvantage in cloud computing is its vulnerability in the event
    of an attack. There are several concerns about cloud computing since cloud computing
    is online, any aspect of cloud computing can be exposed to a wide range of servers
    allowing data attacks and server storage activities. In this chapter, we are going
    to propose how Blockchain Technology can be useful to make the whole system decentralized,
    tamper-proof, and transparent [5].


    # 2 Literature Survey


    As of now, blockchain technology faces core obstacles related to scalability,
    regulatory limits, identity registration, consumer protection, laws and regulations,
    and compliance requirements. This chapter is written based on the literature of
    the previous research, combines blockchain technology and the concept of cloud
    to create a secure cloud system with selected access permissions [6]. This chapter
    consists of a detailed study of the combination of cloud systems and blockchain
    technology. With the current progress of science and technology, the need for
    secure and fast systems has become the top priority for any information retrieval.
    The current uses of blockchain include assistance to an IoT system and cloud computing
    system assisting blockchain technology to make a home environment more efficient,
    secure, and faster in terms of any processes, this uses Cloud Service Provider
    [7], Edge Service Provider, and a Lightweight client; each of these modules assists
    in the storage and usage of data.


    Another application using blockchain is secure network computing for lightweight
    clients, this application is used for mobile devices that do not have enough computing
    power for heavy usage [8]. This application uses mobile resource management that
    connects nearby mobile phones using Bluetooth technology, with the combined resources
