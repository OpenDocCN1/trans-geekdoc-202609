    ## 9 Conclusion


    IoT devices and applications play an important role in our modern life. We can
    see IoT devices almost everywhere from our homes, offices, shopping centres, schools,
    airports, and many other places to provide us with secure and sought-after services.


    IoT gadgets support collaboration with partners and help in understanding business
    needs and outcomes. In addition, IoT-based testing and information processing
    can enhance the profitability and productivity of a modern framework.


    In addition, IoT frameworks are implementing a variety of innovative new development
    applications in a variety of areas. Retailers and many organizations are finding
    a large proportion of arrangements to protect their gadgets related to malicious
    attacks. With the large number of these gadgets associated with our private organizations
    and the Internet, additional concerns and protections are also being taken into
    account. We read and hear that our espresso machine is watching our conversations;
    our excellent department sends our guests photos of government agencies. Some
    real models emphasize the seriousness of the security vulnerabilities associated
    with the use of IoT gadgets.


    In this work, we have introduced new IoT models: standard and accessible with
    insurance and security components and highlights. The proposed cloud/edge structure
    is maintained and tested. The low level is considered by IoT institutions developed
    by Amazon Web Service (AWS) as Real Machines. Medium level (Edge) has been achieved
    as a Raspberry Pi 4 gear pack with a source of Greengrass Edge Environment in
    AWS. The high level, which is a cloud, is implemented using IoT cloud computing
    in AWS. Security mechanisms and basic management mechanisms were held between
    each of these layers to ensure the protection of customer data.


    In the future work, further research should be done on cryptographic security
    strategies that are best suited to operating constrained IoT (Light Weight Crypto)
    devices. It will help to ensure that clients with a variety of connections can
    use and set up IoT frames without the lack of consumer integration that comes
    with the large number of these IoT gadgets. In addition, there is a real need
    to make a variety of information and sharing methods available for Internet-related
    IoT gadgets. Such guidelines will reduce the number of unexpected vulnerabilities
    and related attacks in non-identical categories.


    We study the benefits and risks associated with IoT. With all the various benefits,
    risks can be misused to harm end clients by allowing unauthorized acceptance of
    sensitive information, enabling framework attacks, and endangering the health
    of individuals. With IoT enabled gadgets marketed, we need to deliver them with
    appropriate security efforts that facilitate their use, function, and join existing
    structures. We relied on the help of analysts to create a unique security structure
    to reduce, not really kill, security and protection opportunities, and be bright
    enough to adapt to changes in the new literature development and various organizational
    conditions for application.


