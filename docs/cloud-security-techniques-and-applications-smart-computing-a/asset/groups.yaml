    grows, security vulnerabilities also increase. The cloud attack surface is higher
    than the conventional service models, as the associated modules have several different
    endpoints and protocols to handle in different ways. A variety of methods are
    needed to recognise and resolve both identified and new threats.


    Distributed-Denial-of-Service (DDoS) attacks are only one common security threat
    in cloud computing. Providers typically provide a variety of architectural solutions
    to configure a protected infrastructure to avoid these kinds of attacks, such
    as traffic separation (the ability to isolate clusters of virtual machines in
    groups of virtual different networks) or access control lists to establish guide-lines
    that specify multiple-level component permissions.


    The second most significant problem for conventional cloud paradigms is Data Management.
    One part of data management that needs to be discussed is the consistency of the
    data. This means that all cloud users can see the same data simultaneously. This
    is no easy job, since hardware (data resources) are paired with the transactional
    status of operations in line with physical network constraints which can affect
    continuity by linking the user.


    The third major concern is Resilience and Cloud compatibility. Resilience is the
    ability to manage errors gracefully and to restore the whole system. This is a
    massive problem for services and applications where modules fight for resources
    and depend on other internal or external components/services that malfunction
    or may rely on faulty software. Planning the manner in which those errors are
    observed, logged, repaired and restored re-quires not only developers but all
    teams as part of a cloud strategy.


    To support, applications are available to replicate random problems, from hardware
    problems to major external threats, including failed implementations or suspicious
    device behaviour [26-27].


