    # 1 Introduction


    Even before cloud computing was developed, it was the IT industry that faced some
    tough challenges related to storing and accessing data, hosting, and data privacy
    to name a few. Before the cloud, client/server computing was essentially centralized
    storage where all the software, data, and control is located on the server-side.
    This created a major setback for the IT industry since centralized databases rely
    heavily on network connectivity, which means the slower the internet connection,
    the longer the access time for the database is needed. Although data redundancy
    is limited or no, if a collection of data is lost accidentally, it is very difficult
    to recover it manually. Earlier if a user desired to view some information or
    execute a program, he/she would have to connect to the server and then obtain
    access to it and then do his/her work. That’s not all, if the IT firm is huge
    with a large number of employees then it becomes difficult for the company to
    arrange adequate hardware and software to carry out their tasks. It is not possible
    to purchase software and applications for every system and every employee. But
    it did not take much time to find a solution that changed the face of the IT industry,
    “Cloud Computing” [1-2]. Cloud computing in simple terms means that the services
    provided of computer resources are controlled and managed by the cloud provider
    rather than the end-user. These resources include everything from browser-based
    web applications, third party data storage devices, or third-party servers used
    to support an industry, research, or personal project’s computer infrastructure.


    Before the widespread use of cloud computing, businesses and general computer
    users usually had to purchase and maintain the software and hardware they wanted
    to use. Based on the increasing availability of cloud-based apps, storage services,
    and machines, firms and consumers have access now as Internet services to a wealth
    of on-demand computing resources [3]. If on-the-job software and hardware are
    shifted to a remote networked and distributed resource, cloud users are no longer
    required to invest the work, equity, or expertise needed to buy and maintain the
    data. This unprecedented access to computer resources has resulted in a new group
    of cloud-based companies and changed IT practices across industries and turned
    many computer-aided practices into everyday ones. Many organizations started to
    use the cloud to store records, supply corporate applications, and deploy services
    and goods digitally. These kinds of cloud-based technologies and adoptions are
    unique to the field. In the education world, educators and scholars use cloud-based
    teaching and research applications [4]. As they say, nothing is perfect in this
    world, cloud computing has few drawbacks which need to be taken into consideration
    before moving ahead. In cloud computing, confidentiality and privacy are amongst
    the most questionable. By the use of cloud storage infrastructure, we are completely
    committed to providing cloud-based application protection and confidentiality
    of the data. This means that if we encounter any problem, we cannot'
