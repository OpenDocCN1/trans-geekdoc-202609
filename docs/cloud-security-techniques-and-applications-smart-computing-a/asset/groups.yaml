    ## 1 Introduction


    即使在云计算尚未发展之前，IT 行业就已经面临着一些严峻的挑战，例如数据存储和访问、托管以及数据隐私等。在云出现之前，客户端/服务器计算本质上是集中式存储，所有软件、数据和控制都位于服务器端。这对
    IT 行业造成了重大阻碍，因为集中式数据库严重依赖网络连接，这意味着互联网连接越慢，访问数据库所需的时间就越长。尽管数据冗余有限或不存在，如果数据集合意外丢失，手动恢复它是非常困难的。以前，如果用户希望查看某些信息或执行程序，他/她必须先连接到服务器，然后获得访问权限，然后再进行工作。这还不是全部，如果
    IT 公司规模庞大、员工众多，那么公司就很难为员工完成任务安排足够的硬件和软件。不可能为每台系统和每位员工购买软件和应用程序。但找到改变 IT 行业面貌的解决方案并没有花费太多时间，“云计算”[1-2]。简单来说，云计算意味着计算机资源的服务是由云提供商控制和管理，而不是终端用户。这些资源包括从基于浏览器的网络应用程序、第三方数据存储设备或用于支持行业、研究或个人项目计算机基础设施的第三方服务器等一切内容。


    在云计算广泛使用之前，企业和普通计算机用户通常必须购买和维护他们想要使用的软件和硬件。随着基于云的应用程序、存储服务和机器的日益普及，企业和消费者现在可以通过互联网服务访问大量按需计算资源[3]。如果工作中的软件和硬件转移到远程网络化和分布式资源上，云用户就不再需要投入购买和维护数据所需的工作、资金或专业知识。这种前所未有的计算机资源访问带来了新一代基于云的公司，改变了各行业的
    IT 实践，并将许多计算机辅助实践转变为日常实践。许多组织开始使用云来存储记录、提供企业应用程序以及数字化部署服务和商品。这些类型的基于云的技术和采用方式在该领域是独一无二的。在教育领域，教育工作者和学者使用基于云的教学和研究应用程序[4]。正如人们所说，世上没有完美的事物，云计算也有一些缺点需要在继续推进前加以考虑。在云计算中，保密性和隐私性是最受质疑的问题之一。通过使用云存储基础设施，我们完全致力于提供基于云的应用程序保护和数据保密性。这意味着如果我们遇到任何问题，就不能就数据错误或数据中的任何错误向服务器索赔。云计算的另一个主要缺点是其在遭受攻击时的脆弱性。由于云计算是在线进行的，云计算的任何方面都可能暴露给各种服务器，从而导致数据攻击和服务器存储活动，因此人们对云计算存在诸多担忧。在本章中，我们将提出区块链技术如何有助于使整个系统实现去中心化、防篡改和透明化[5]。


    ## 2 Literature Survey


    目前，区块链技术面临的核心障碍与可扩展性、监管限制、身份注册、消费者保护、法律法规以及合规要求有关。本章基于以往研究的文献撰写，结合区块链技术和云的概念，创建具有选定访问权限的安全云系统[6]。本章对云系统与区块链技术的结合进行了详细研究。随着科学技术的不断进步，安全、快速系统的需求已成为任何信息检索的首要任务。区块链的当前用途包括协助物联网系统以及云计算系统协助区块链技术，使家庭环境在任何流程中更高效、安全、更快，这使用了云服务提供商[7]、边缘服务提供商和轻量级客户端；这些模块各自协助数据的存储和使用。


