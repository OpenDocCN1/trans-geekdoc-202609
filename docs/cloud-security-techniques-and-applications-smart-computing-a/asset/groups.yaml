    ## 健康记录


    确保患者的隐私至关重要。电子健康记录（EHR，Electronic Health Record）系统上的黑客事件可能导致患者数据被篡改。


    大数据的出现给各个研究领域带来了多重障碍。“大数据”一词指的是庞大且巨大的结构化和非结构化数据量。它由患者数据组成，有助于他们选择主要可能性并支持医疗治疗方案。然而，随着医疗数据的急剧增大，它们使得数据的操纵和处理变得困难。相比之下，分布式源上的大数据处理由
    MapReduce 完成。医疗领域故障的主要原因之一是患者相关数据和信息的不完整、不完善的访问，以及参与流程的利益相关者之间沟通不畅 [3]。


    ## 2 医疗保健中的云部署模型


    云部署模型在图 1 中表示如下。


    ### 2.1 公有云


    这种类型的云模型可供任何想要使用或购买的人使用。它基于共享成本模型或按需付费政策。


    ### 2.2 私有云


    该模型主要由独立组织使用。私有云最适合需要高安全性和高管理需求的组织。


    ### 2.3 社区云


    社区云是一种共享模型，仅限于一组组织或员工。此类云计算部署模型由内部或第三方供应商管理并托管。


    ### 2.4 混合云


    混合云结合了两种或多种模型，如公有云、私有云或社区云。根据业务需求，混合云架构允许企业在私有和公共环境之间移动数据和应用程序。


    ![](img/09fa00ca1419044515be1e45aa422bc8_86_0.png)


    **图 1：** 医疗保健的云部署模型


    ## 3 医疗保健中的云服务模型


    云服务模型在图 2 中表示。


    ### 3.1 软件即服务（SaaS）


    SaaS 描述了一种云服务，消费者能够通过互联网访问在云基础设施上运行的软件应用程序。SaaS 解决方案不需要客户端维护任何内容，包括数据存储和网络，并由供应商管理。


    ### 3.2 平台即服务（PaaS）


    平台即服务（PaaS）是一种集成且抽象的基于云的模型，支持应用程序的开发和管理。数据的全部存储和管理都交由供应商负责。


    ### 3.3 基础设施即服务（IaaS）


    IaaS 是以硬件、网络和存储设施的形式虚拟交付计算资源。根据您在一段时间内使用的存储量和处理能力，您将按此收费。


    ## 4 评估云系统安全时需考虑的因素


    ### 4.1 保密性


    保密性是指保护数据免受未经授权用户的访问。在云系统中，此类用户可能想要未经授权访问其他个人的数据。患者信息在医疗保健环境中应保密。不当披露该信息可能会威胁患者的声誉、机会和人性尊严。


    ### 4.2 完整性


    完整性保证资产的安全属性未被未经授权的第三方人员修改。它在数据的整个“生命周期”内保持数据的准确性、可靠性和一致性。完整性确保资产相对于其所有者的准确性和正确性。在医疗保健中，患者的个人详细信息、健康摘要、临床记录、检验结果等的准确性可以通过完整性来维护。


    ### 4.3 可用性


    需要维护的最重要的安全方面之一是可用性。服务等级协议是客户与服务提供商之间关于在可用性和需求响应方面提供服务的约定。早些时候，SLA 是在服务消费者和客户之间协商的。但今天存在不同级别的
    SLA，如基于客户的 SLA、基于服务的 SLA 和多级 SLA。


    ![](img/09fa00ca1419044515be1e45aa422bc8_88_0.png)


    **图 2：** 医疗保健的云服务模型


    评估云系统安全时需考虑的三个重要因素在图 3 中表示。


    ![](img/09fa00ca1419044515be1e45aa422bc8_89_0.png)


    **图 3：** 评估云系统安全时需考虑的因素


    ## 5 文献综述


    表 1 中讨论了医疗保健中各种安全和隐私保护方法及方法，如下所示。


    **表 1：** 云计算环境中的安全和隐私保护方法


    | 序号 | 作者 | 标题 | 拟议模型 |

    |--------|--------|-------|----------------|

    | 1 | Jan de Muijnck-Hughes (2011) | 基于谓词的加密同时关注平台即服务和软件即服务的实现 | 基于谓词的加密（PBE）
    |

    | 2 | Venkata Sravan et al. (2011) | 云中保护数据的技术 | 理解云计算中使用的安全风险和所需的安全策略以减轻它们 |

    | 3 | Ali Asghari Karahroudy (2011) | 云计算的安全分析和框架 | 部分分布式文件系统与奇偶校验（PDFSP） |

    | 4 | Nabil Giweli (2013) | 增强云计算中的数据隐私和访问匿名性 | 以数据为中心的安全方法 |

    | 5 | Miao Zhou (2013) | 增强隐私云关键词搜索和私有数据的远程公共完整性审计 | 创新的基于树的密钥管理方案 |

