    \ Lighter and faster | Lighter and faster |\n\nThough a blockchain is divided\
    \ into three categories, all blockchains consist of blocks and all blocks follow\
    \ a similar structure. A block is like a data structure that accumulates the transactions\
    \ that would be included in the blockchain [20]. Every block is divided into a\
    \ block header that contains metadata and a list of transactions as shown in fig.\
    \ 3. The first block in the blockchain is called the genesis block. A block header\
    \ consists of:\n\n- Block version: This is a version number that is used to track\
    \ software updates. Its size is 4 bytes.\n- Previous block hash: This is a reference\
    \ to the hash of the parent/previous block in the current chain. Its size is 32\
    \ bytes.\n- Merkle tree root hash: This is the hash of the root of the Merkle\
    \ tree of this block’s transactions. Its size is 32 bytes.\n- Timestamp: This\
    \ is the approximate time required to create a block. Its size is 4 bytes.\n-\
    \ Nonce: This is a counter used for the proof-of-work algorithm. Its size is 4\
    \ bytes.\n- Difficulty target: This is the proof-of-work algorithm difficulty\
    \ target for this block. Its size is 4 bytes.\n\nThe mining process requires the\
    \ nonce, the difficulty target, and the timestamp.\n\n## 5.3 Workflow of blockchain\n\
    \nFig. 4 depicts the workflow of a blockchain that utilizes the proof-of-work\
    \ consensus mechanism.\n\n![](img/09fa00ca1419044515be1e45aa422bc8_51_0.png)\n\
    \nFig. 4: The workflow of a blockchain\n\nFirstly, a transaction is initiated\
    \ by a participant and it is broadcasted to the other participants in the network.\
    \ The participants who get this transaction use the digital signature to check\
    \ the authentication of the transaction. After the verification, the transaction\
    \ is attached to the list of authentic transactions in the participant’s respective\
    \ ledgers. To register the authentic transactions, the participants in the network\
    \ work to mine the new block, i.e., finding the nonce of the block. Once a participant\
    \ finds a valid nonce, they can mine the block that contains the concerned transaction.\
    \ The other participants then check the transactions in the received block by\
    \ analysing the Merkle root, and once the transactions in the newly mined block\
    \ are authenticated and have not been tampered with, the new block is appended\
    \ to the local replica of the blockchain. Once this entire procedure has been\
    \ completed, the newly mined block can be appended to the current blockchain [21].\
    \ Sample code for blockchain as a service to declare the data of transactions\
    \ and blockchain mining is given as below.\n\n### Listing 1: Blockchain as a service\
    \ to declare the data of transactions and blockchain mining\n\n```python\n#Transactions\
    \ declaration\ndef get_transdata(self, sender, receiver, amount):\n        self.current_data.append({\n\
    \                'sender': sender,\n                'receiver': receiver,\n  \
    \              'amount': amount\n        })\n        return True\n#Blockchain\
    \ mining\ndef blockchain_mining(self, details_miner):\n        self.get_data(\n\
    \                sender=\"0\",\n                receiver=details_miner,\n    \
    \            quantity=1,\n        )\n        last_block = self.latest_block\n\
    \        last_proof_number = last_block.proof_number\n        proof_number = self.proof_of_work(last_proof_number)\n\
    \        last_hash = last_block.compute_hash\n        block = self.build_block(proof_number,\
    \ last_hash)\n        return vars(block)\n```\n\n## 5.4 Features of blockchain\n\
    \nA few important features of the blockchain are listed below [22-25]:\n\n- **Decentralization:**\
    \ According to this feature, all the transactions are registered by all the participants\
    \ in the network and each participant maintains a local copy of the ledger, where\
    \ the recorded transactions are saved. In this way, the ledger is shielded from\
    \ a central authority and a single point of failure.\n- **Trustable:** According\
    \ to this feature, the participants entering the network do not need to prove\
    \ their identity as the participants need not depend on any particular participant\
    \ for the validation of any transaction. There is no requirement of any third-party\
    \ as the consensus algorithm is used for validating the transactions.\n- **Immutability:**\
    \ According to this feature, the transactions recorded into the blockchain can\
    \ never be manipulated or tampered with. The cryptographic principles are utilized\
    \ to make the blockchain and its contents immutable.\n- **Non-repudiation:** According\
    \ to this feature, no participant can deny making/receiving a transaction once\
    \ the transaction is done. This is because every transaction is cryptographically\
    \ signed with a private key before broadcasting it to the network. This private\
    \ key is known only to its owner, therefore making it impossible for an initiator\
    \ to deny a transaction made by him/her.\n- **Transparency:** According to this\
    \ feature, every participant can access all the transactions recorded in the blockchain\
    \ and verify all the transactions.\n- **Traceability:** According to this feature,\
    \ each transaction and block can be traced and verified easily with the help of\
    \ the timestamp that is attached to the block header.\n\n## 5.5 Potential attacks\
    \ on blockchain\n\nLike we know that every coin has two sides, even blockchain\
    \ technology has certain vulnerabilities, leading to attacks on the blockchain.\
    \ Some potential attacks are listed below:\n\n- Sybil attack: An attacker floods\
    \ the entire network with an enormous number of nodes with anonymous identities.\
    \ In this way, the attacker can have control of a majority of the network and\
    \ can try to dominate the network. Though the nodes seem to be unrelated, they\
    \ are operated by a single participant. This attack focuses on the entire network\
    \ allowing the attacker to create a fork in the ledger making double-spending\
    \ possible.\n- Selfish mining attack: Generally, the longest chain in the network\
    \ is considered to be the true and latest version of the ledger. Therefore, if\
    \ a selfish miner builds blocks on top of an existing chain in stealth mode, he/she\
    \ will be able to publish this fake chain and everyone would accept this chain\
    \ as it’s the longest. This provides a small window to the attacker to perform\
    \ double-spending.\n- 51% attack: This attack occurs when a miner or a group of\
    \ miners controls 51% or more of the mining power in a blockchain network. This\
    \ is difficult to happen in large networks but it is highly possible in small\
    \ networks.\n- Denial of Service (DoS) attack: This happens when malicious participants\
    \ completely absorb and keep the resources busy in verifying and transmitting\
    \ the blocks and transactions. These malicious participants can flood the network\
    \ with several transaction initiations to other participants, disabling the transmission\
    \ and verification of transactions from other participants.\n\n## 6 Cloud Security\
    \ Concerns\n\nThe biggest problem today is the challenge to cloud protection.\
    \ Malicious or unintentional acts can cause harm to an organisation at several\
    \ levels. This is true in both cloud and non-cloud settings, but as the complexity\
    \ of software and services grows, security vulnerabilities also increase. The\
    \ cloud attack surface is higher than the conventional service models, as the\
    \ associated modules have several different endpoints and protocols to handle\
    \ in different ways. A variety of methods are needed to recognise and resolve\
    \ both identified and new threats.\n\nDistributed-Denial-of-Service (DDoS) attacks\
    \ are only one common security threat in cloud computing. Providers typically\
    \ provide a variety of architectural solutions to configure a protected infrastructure\
    \ to avoid these kinds of attacks, such as traffic separation (the ability to\
    \ isolate clusters of virtual machines in groups of virtual different networks)\
    \ or access control lists to establish guidelines that specify multiple-level\
    \ component permissions.\n\nThe second most significant problem for conventional\
    \ cloud paradigms is Data Management. One part of data management that needs to\
    \ be discussed is the consistency of the data. This means that all cloud users\
    \ can see the same data simultaneously. This is no easy job, since hardware (data\
    \ resources) are paired with the transactional status of operations in line with\
    \ physical network constraints which can affect continuity by linking the user.\n\
    \nThe third major concern is Resilience and Cloud compatibility. Resilience is\
    \ the ability to manage errors gracefully and to restore the whole system. This\
    \ is a massive problem for services and applications where modules fight for resources\
    \ and depend on other internal or external components/services that malfunction\
    \ or may rely on faulty software. Planning the manner in which those errors are\
    \ observed, logged, repaired and restored requires not only developers but all\
    \ teams as part of a cloud strategy.\n\nTo support, applications are available\
    \ to replicate random problems, from hardware problems to major external threats,\
    \ including failed implementations or suspicious device behaviour [26-27].\n\n\
    ## 7 Blockchain to the Rescue\n\nThere are challenges and limitations in cloud\
    \ computing apart from the ones that are mentioned above, some of these limitations\
    \ can be removed or be mitigated using Blockchain Technology. The major challenges\
    \ in cloud computing are security issues, cost management, lack of resources,\
    \ governance or control of data, managing multiple clouds, building a private\
    \ cloud, limited features, data mobility and a reliable internet connection.\n"
