    almost anywhere. Universal access to the Internet is equally a fundamental factor
    in understanding this problem; unless there is an effective security system, it
    will be relatively easy to access personal data from any part of the earth [11].


    ### 3.3 Cooperation


    A fragmented environment for IoT specialization is known to suppress customer
    motivation. Apart from the fact that full integration is rarely practical in real
    estate and management, clients are reluctant to purchase and manage devices when
    there is no flexibility and concern about being locked into the vendor. Inadequate
    IoT security can mean that there will be a negative impact on the management systems
    we work with.


    Cryptography is one of the most widely used cornerstones for providing security
    in many ways. A powerful system of self-defence against potential attacks is not
    achieved by using a single security system. This, in turn, requires different
