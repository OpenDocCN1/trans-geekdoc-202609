    ## 1 引言


    使用托管在 Web 上的远程服务器网络来存储、管理和处理数据，而不是使用本地服务器或个人计算机，这种做法称为云计算。它是一种按使用付费的模式。由于结合了虚拟化和面向服务的架构等新兴技术，云计算可以被视为新兴技术的未来。根据部署模型，有多种类型的云[1]。


    - 公有云/互联网云

    - 私有云/企业云

    - 混合云/混合云

    - 社区云


    公有云面向大量公共客户设计，私有云服务仅向云所有者开放。两个或多个云的组合可视为混合云，其中云可以是公有云、社区云或私有云；广义上，社区云服务由多个组织共享。


    云通过多种模型提供服务，如软件即服务（SaaS）、平台即服务（PaaS）和基础设施即服务（IaaS）。


    - SaaS：它为用户提供对软件应用程序的访问权限。这些存在于云中的软件应用程序被用于各种各样的任务。

    - PaaS：它提供构建基于云的应用程序所需的全部硬件和软件组件。

    - IaaS：它向最终用户提供存储、安全工具和网络等服务。


    针对各种云部署模型，设计并提出了几种严重的安全攻击，这些攻击对采用者构成了严重的安全风险。诸如包装攻击、恶意软件注入等攻击以及其他攻击都可以针对云计算实施。其中一种安全攻击是拒绝服务（DoS）攻击。它是一种事件或恶意行为，削弱或阻止云安全执行其预期的功能和服务。DoS
    攻击的一种分布式形式称为分布式拒绝服务（DDoS）攻击，它利用大量网络主机对受害者造成更大影响[2]。


    DDoS 攻击可分为以下几类：


    - 带宽攻击

    - 物理破坏

    - 限制利用

    - 连接性攻击

    - 资源耗尽

    - 进程中断

    - 数据破坏


    软件定义网络（SDN）已成为一种新的通信范式，摆脱了对传统网络的直接集成，并通过明智的网络控制器为系统和网络提供了灵活性。SDN 包含数据平面、控制平面和应用平面。控制平面包含一些控制器，这些控制器使用逻辑控制策略，并维护以逻辑为中心的整个网络视图。管理员从网络服务中移除所有网络视图，并为提供商、研究人员或第三方提供易于使用的接口，以方便这些人员定制事务计划并实现合理的网络管理。SDN
    用户不必担心底层设备的技术细节，一个简单的系统就能检测新应用的快速交付。


    先进的控制功能和系统使 SDN 面临所谓的分布式拒绝服务（DDoS）攻击的风险。例如，控制器在决定 SDN 中每个组件的性能方面起着非常重要的作用，它是 DDoS
    攻击的主要目标。被攻破的控制器可能导致其控制下所有交换机的异常行为。拒绝服务（DoS）攻击会耗尽目标计算机上的系统资源，停止服务，并使其正常用户无法访问。当黑客使用两台或多台被攻破的计算机作为“傀儡机”对特定目标发起
    DDoS 攻击时，就称为 DDoS 攻击。傀儡机的 IP 地址以及攻击数据包的组成和类型并不固定，因此很难定位攻击者。


    DDoS 攻击已成为当今互联网的主要威胁，攻击来自多个攻击者，使大量受害者无法使用在线服务。随着在线提供服务的企业数量呈指数级增长，DDoS 攻击可能导致重大的经济损失。最近一份报告显示，2015
    年 DDoS 攻击占数据恢复账户的 22% [3-4]。


    DDoS 攻击分三个步骤进行，即扫描、登录和发起攻击。DDoS 攻击的异常移动性常常影响多条路径和网络域。本文还主要涉及 KNN 模型，该模型将被改进以检测攻击。


    云计算是分布式系统的一种形式，包含一组虚拟机，这些虚拟机可以动态配置，以满足客户不断变化的资源需求。云与客户之间的关系由服务级别协议（SLA）管理。


    云减轻了此类庞大系统物理安装和维护的开销，从而降低了总体成本并提高了效率。云计算中的虚拟化采用面向服务的架构（SOA），能够将客户需求问题转化为服务，从而有益于云计算理念。云客户必须依赖云服务提供商（CSP）来保障其信息的安全和隐私。


