    ## 3 安全


    安全是采用云计算时需要考虑的主要因素。用户会在计算机上存储大量安全信息。使用云计算技术时，这些数据将从其计算机转移到云端。因此，云必须采取有效的安全措施来保护这些数据。云计算中观察到的威胁和攻击如图4所示。


    Pan（2016）指出，AI网络中存在多种安全风险或问题，例如技术滥用带来的安全威胁、由技术缺陷引发的安全威胁等。为了防御网络犯罪和已开发系统带来的风险，识别与AI技术相关的风险因素非常重要。近期文献发现，AI是一种中性技术，它将众多技术和计算设备相互连接，以有效执行操作[11]。


    以下是云计算中观察到的安全问题清单，这些问题可以通过人工智能实践得到有效解决。


    - 控制管理

    - 风险管理

    - 合规性

    - 漏洞管理

    - 补丁管理

    - 物理安全

    - 数据安全

    - 操作安全

    - 法律问题

    - 身份管理

    - 应用安全

    - 存储安全

    - 网络安全

    - 信息安全

    - 网络空间安全

    - 虚拟化安全

    - 审计与维护

    - 数据加密与密钥生成


    用于传输欺诈信号的恶意程序会降低AI系统中所用通信信道和技术的性能，而AI系统无法检测到黑客借以实施数据泄露的恶意信号。由于一些技术缺陷，AI网络无法保护数据免受网络犯罪侵害，超过34%的公司正面临此类问题。


    Ransbotham等人（2017）支持这一论点，并指出缺乏意识是一个关键问题：公司没有为员工提供全面培训，黑客可通过恶意程序获取计算设备的登录凭据。


    云计算具有易于实施、可访问性、分布性、可靠性、容错性、资源共享、存储容量增加和成本节约等优势。尽管云计算具有诸多优势，但无论对于云服务提供商还是云用户而言，它仍然面临许多安全问题和违规行为。


    根据云安全联盟的一篇文章，“数据泄露、不幸的信息、记录或管理任务、未经授权与应用程序编程接口（API）集成、DoS攻击、不良内容、云滥用、因效率低下而导致的效率低下，最终共享新风险”，被确定为云计算的九大威胁。AI在网络安全中的重要性如图5所示。


    ![](img/09fa00ca1419044515be1e45aa422bc8_30_0.png)


    图5：AI在网络安全中的重要性


    ## 4 隐私


    隐私与安全常常被混淆。数据安全确保拥有授权访问权限的人在需要时能够获得数据。数据隐私确保数据被恰当使用。隐私被定义为个人决定信息如何以及向谁传达的权利。数据隐私可以通过访问控制方法限制对数据的访问，或通过匿名披露信息来保护。


    关于隐私保护这一主题已经进行了大量研究。近年来，有许多重要的综述主题分析数据机密性、隐私保护、拟议结构和数据隐私措施；它们的优缺点均已发表。数据隐私保护的建议方法分为初始方法、所使用的统计分析、有用的基于计算机的信息和机器学习方法。


    人工智能的隐私可能通过阻断通信信道和访问企业专用网络而受到侵犯。在人工智能领域，已经出现了三大隐私风险，包括隐私问题、身份盗窃犯罪以及犯罪分子传输的未经授权信号。因此，在业务中使用AI网络时，重视隐私非常重要；企业应确保只使用独立网络，而不是第三方网络[12]。


    为了有效解决数据隐私保护问题，对云数据进行加密存储是一种非常出色的解决方案。加密后，数据以密文形式存储在云服务提供商提供的服务器上；同时，当用户需要时，服务器也需要将数据返回给用户。当用户需要频繁使用数据时，与服务器通信并实现数据加密和解密需要大量网络带宽和用户时间，这将显著降低云计算的可用性。


    同时，当存储在云服务器中的加密数据达到一定规模后，对加密数据进行有效检索已成为一个需要解决的新问题，而传统信息检索技术已无法满足云存储环境下海量数据检索的需求。


    同态加密技术是一种能够直接处理加密数据的加密方法，可有效保护用户数据内容的安全，在云存储应用背景下具有非常广阔的发展潜力。


    通过利用同态加密算法，不仅可以确保加密数据不会被统计分析以解密出相应的明文，而且还可以对密文进行同态运算（如加法和乘法），同时在运算过程中保持该密文对应的明文顺序。

