    Various security and privacy preservation methods and approaches in health care
    are discussed in Table 1 as shown below.


    **Table 1:** Security and privacy preservation approaches in cloud computing environment


    | S. No. | Author | Title | Proposed Model |

    |--------|--------|-------|----------------|

    | 1 | Jan de Muijnck-Hughes (2011) | Predicate Based Encryption focuses on both
    the Platform as a service and the Software as a service implementation | Predicate
    Based Encryption (PBE) |

    | 2 | Venkata Sravan et al. (2011) | Security Techniques for Protecting Data in
    Cloud | Understanding security risks and the required security strategies used
    in Cloud computing to mitigate them |

    | 3 | Ali Asghari Karahroudy (2011) | Security Analysis and Framework of Cloud
    Computing | Partially Distributed File System with Parity (PDFSP) |

    | 4 | Nabil Giweli (2013) | Enhancing Data Privacy and Access Anonymity in Cloud
    Computing | Data Centric Security approach |

    | 5 | Miao Zhou (2013) | Enhanced Privacy Cloud keyword search and Remote public
    integrity audit for private data | Innovative tree-based key management scheme
    |

    | 6 | Sudhanshu Ranjan Lenka et al. (2014) | Enhancing Data Security in Cloud
    Computing using RSA Encryption and MD5 Algorithm | The RSA algorithm is used for
    encrypted correspondence and file encryption and decryption while the digital
    signature of the MD5 algorithm is used. |

    | 7 | Aastha Mishra (2014) | Security and privacy of user''s data | Advanced Secret
    Sharing Key Management Scheme |

    | 8 | Nesrine Kaaniche (2014) | Cloud Data Storage Security based on Cryptographic
    Mechanisms | ID-Based Cryptography (IBC) and CloudSec |

    | 9 | Afnan Ullah Khan (2014) | Data Confidentiality and Risk Management in Cloud
    Computing | Access Control and Data Confidentiality (ACDC) |

    | 10 | Sarojini et al. (2016) | Trusted and Reputed Services Using Enhanced Mutual
    Trusted and Reputed Access Control Algorithm in Cloud | Enhanced Mutual Trusted
    Access Control Algorithm (EMTACA) |


    ## 6 Recommendations for Smart Healthcare Model


    Healthcare has one way of communicating with a patient, i.e., through the internet
    via mobile devices and laptops. Considering the factors such as economic situations,
    location, and affordability, mobile devices are in demand. Since our main focus
    is to provide a secured and reliable healthcare service to a patient with the
    support of cloud computing services and facilities, we take the help of PaaS,
    SaaS, and BDaaS, meaning Platform as a Service, Software as a Service, and Big
    Data as a Service, respectively.


    Analytical mobile applications help us to analyze and filter the collected data
    beforehand, so this is an added advantage compared to normal mobile applications.
    These are built and hosted using cloud computing technologies. Mobile applications
    are accessed through web servers that run on mobile browsers without consideration
    of mobile-specific operating system, capacity, and memory.


    Cloud computing technologies include delivery of various types of facilities,
    as shown in Fig. 4.


    ![](img/09fa00ca1419044515be1e45aa422bc8_92_0.png)


    **Fig. 4:** Cloud computing technologies


    ## 7 Types of Cloud Architectures


    ### 7.1 Centralized


    Clients are tied to the nearest data centres to avoid a high latency in communication
    because the cloud resources are partitioned over wide distances geographically.


    ### 7.2 Federated


    Many small clouds together form a large cloud. It’s very useful when the clients
    require a high confidentiality in data when distributing the data geographically.

