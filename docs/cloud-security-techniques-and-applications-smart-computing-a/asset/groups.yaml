    ## 4 Consensus Mechanisms


    Cloud computing provides multiple advantages when it comes to the business and
    IT sectors. It allows us to create what is indeed a virtual workplace, so that
    we can communicate everywhere at all times. With the number of web-enabled gadgets
    used in today''s corporate world (ex. smartphones, tablets), access to your data
    is now simpler. Moving on to cloud storage will decrease the IT systems administration
    and maintenance costs. It will reduce the expenses by leveraging the services
    of the cloud computing platform rather than buy costly systems and appliances
    for our business. Majority of the companies with more than 1000 employees do not
    have the same IT requirements as a start-up [16]. Cloud usage is a great choice
    as it enables companies to scale up/down their IT divisions efficiently—and quickly—according
    to market requirements.


    Cloud-based applications are suitable for organizations that have rising or evolving
    demands for bandwidth. You can quickly expand the capability of your cloud without
    spending on physical resources as your company demands increase. This degree of
    versatility will offer a true edge over competing companies using cloud computing.
    That’s when scalability comes into the picture. Scalability minimizes the risks
    involved with internal maintenance and organizational challenges. With professional
    strategies and zero upfront investment, you have high-performance tools at your
    side. The biggest value of the cloud is undoubtedly scalability [17].


    ## 5 Blockchain Technology Concepts


    In layman’s terms, a blockchain is a chain of blocks that contains data in the
    form of transactions. Technically, a blockchain is a distributed, decentralized,
    and trusted ledger or data-sharing platform that can be utilized by participants
    who do not trust each other. A blockchain is said to be distributed as every participant
    in the network executes a job collectively and it is said to be decentralized
    as there are multiple points of coordination, with no single point of failure
    [18].


    ### 5.1 Consensus mechanisms


    In the earlier days, the usage of traditional ledgers resulted in central authority
    as only one entity would control the entries made into the ledger. But with the
    introduction of blockchain technology, each participant in the network would have
    a copy of the ledger and no single participant holds the power to make an entry
    solely. All the participants follow a consensus mechanism to decide the addition
    of an entry into the ledger. The most common consensus mechanisms are listed below.


    - **Proof of Work (PoW):** This is the most commonly used algorithm these days.
    This algorithm requires the participants of the network to solve a challenging
    computational puzzle to create new blocks. The mechanism of solving the puzzle
    is called “mining” and the nodes that carry out this process are called “miners”.
    The miners who solve this puzzle will get an incentive, known as a block reward.
    The probability of mining a block depends on the work done by the miner. This
    work consumes physical resources like CPU power and time.


    - Proof of Stake (PoS): This algorithm requires a miner to acquire a sufficient
    stake to mine a block. While executing an attack is expensive, the incentive for
    the attack is also reduced as the attacker needs to own a high stake. Therefore,
    an attack will have more effect on the attacker. This process provides increased
    security and is power efficient but fails to keep the system completely decentralized.


    - Proof of Burn (PoB): This algorithm requires the miner to burn some wealth to
    mine a new block. The miners should show proof that they have burned some wealth
    by sending coins to a verifiably unspendable address. This process is expensive
    like PoW but no external resources are used except the miner’s wealth. PoB consumes
    virtual or digital resources and is power efficient too. PoB works by burning
    PoW mined cryptocurrencies.


    ### 5.2 Structure of blockchain


    All blockchain structures are generally categorized into three categories:


    - Public blockchain architecture: In this architecture, any participant can enter
    and exit the blockchain network as per their will, without any permissions. All
    the willing participants have access to the data in the network as long as they
    are in the network. Ex: Bitcoin, Ethereum, etc.

    - Private blockchain architecture: In this architecture, each participant requires
    permission to enter and exit the blockchain network. The participants who enter
    the blockchain can be restricted to certain data as well. This system is controlled
    by the users of a specific organization. Ex: Hyperledger Fabric.

    - Consortium blockchain structure: In this architecture, the blockchain network
    is built by a set of organizations. This architecture is neither completely public
    nor completely private. All the permissions are controlled by the preliminary
    assigned users. Ex: Quorum, Corda, etc.


    The tab.1 gives an outline of the comparison of the three blockchain structures:


    Tab. 1: Blockchain structure comparison


    | Property | Public Blockchain | Private Blockchain | Consortium Blockchain |

    |---|---|---|---|

    | Accessibility | Anyone | Single organization | Multiple organizations |

    | Who can join? | Anyone | Permissioned and known identities | Permissioned and
    known identities |

    | Consensus mechanism | PoW/PoS | Voting or multi-party consensus algorithm |
    Voting or multi-party consensus algorithm |

