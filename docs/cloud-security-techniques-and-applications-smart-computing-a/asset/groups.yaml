    ## 16 Onion Encryption (OE)


    This is a data confidentiality scheme. It is an outlook to an adaptable security
    with distinct layers of Encryption (similar to layers of an onion) so that the
    SQL queries can be executed on the encoded data which includes aggregates, operations
    of ordering, joins and the processing of query is done at the cloud service provider’s
    end simultaneously maintaining user data secrecy as decryption will happen at
    the client end.


    The primary focus is to maintain distinct levels of encryption for every column
    and decoding every column as per the requested query.


    This scheme uses two algorithms


    - Data Encryption Algorithm

    - Query Execution Algorithm


    These algorithms take the use of keys such as RND, DET, OPE, HOM.


    - 1. Randomized Encryption Key (RND): It provides similarity under an adaptive
    chosen plain text attack.

    - 2. Order preserving Encryption Key (OPE): For the queries which involve choices
    based on comparison, this key provides secured execution.

    - 3. Homomorphic Encryption Key (HOM): For the queries which involve server side
    aggregates calculation, this key is used for execution.

    - 4. Deterministic Encryption Key (DET): Queries which involve a selection on
    equality for a specific value, this key is used for execution.


    Time complexity: Time complexity can be calculated as

    If T1 = time spent in redrafting queries

    T2 = Time required in encoding and decoding payloads

    Time complexity is the order of T1 * T2 i.e., O (T1*T2)

    It has been discovered that onion encryption scheme brings a comprehensive drop
    in throughput by 22.5%.


