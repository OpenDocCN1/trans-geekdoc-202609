    Shankarapalli Road, Hyderabad, Telangana 501203, India, sirisha.vegunta@gmail.com


    **Sachi Nandan Mohanty**, 计算机工程系, 浦那工程学院, Wellesley Rd, Shivajinagar, Pune, Maharashtra
    411005, India, sachinandan09@gmail.com


    ## 1 引言


    物联网（IoT）指的是各种设备相关物品在互联网或无线互联网上的概念。物联网或物联网的普及迅速增长，因为这些新设备被用于多种用途，包括文献、旅行、教育和业务改进。物联网引入了连接性的概念，这意味着组织和个人可以轻松地远距离通信。Kevin
    Ashton 于 1999 年创造了“物联网”一词，以推广射频识别（RFID）的概念，后者结合了传感器和执行器。尽管如此，第一个想法是在 1960 年代提出的。当时，该想法不可避免地要注册或安装互联网。Ashton
    提出了物联网的想法，以推广与链条的良好实践。尽管如此，物联网的多功能性有助于在 2010 年期间提升强大的可用性。中国政府通过推出五年计划对物联网提出了更大的需求。大约有
    266.6 亿台物联网设备存在于地球上。2011 年随着家用电器、可穿戴设备和智能电能表的引入，大爆炸开始。物联网的快速爆炸帮助了组织，并在多种方式上改进了统计和商业研究方法。此外，物联网通过引入计算机管理改善了人们的生活方式。然而，不受控制的爆炸加剧了安全和防护挑战
    [1]。


    未被识别的使用、弱密码管理以及设备更新的缺失增加了在线安全风险，并使恶意应用程序被接受到敏感的物联网框架中。这种不当做法增加了信息泄露和事故的可能性。绝大多数安全专家由于弱安全机制和配置，将物联网视为数字攻击的脆弱区域。尽管有一些安全项目旨在保护物联网设备免受数字攻击，但安全规则并未得到妥善记录。沿着这些思路，终端客户无法使用防御战术来阻止信息攻击。攻击者自
    2008 年前就创建了各种恶意软件来破坏物联网设备。他们组织各种形式的犯罪以窃取敏感信息，以便迫使公众代表分享敏感信息。同样，工作场所和某些公司不断面临因突出攻击而导致的安全漏洞。如果设备制造商和安全专家准确评估数字风险，他们可以创建保护组件以防止或减轻数字事故
    [2]。


    物联网使能设备用于自动化应用和各种商业用途。这些应用帮助这些组织实现其目标。然而，由于不必要地选择了共享信息和连接的各种智能设备，安全和信息访问成为许多组织的主要关注点，因为它干扰了工作流程、运营和组织管理。专业人员必须克服这些危险问题，并做出全面的安全努力和策略来保护其业务资源，并确保管理的持续完整性和安全性。例如，与本地组织关联的强大的物联网厨房电器可能是攻击者进入业务、窃取相关信息或控制和破坏业务流程的入口。


    新的发展正在出现，或对现有发展进行更改。例如，考虑 5G 网络的最新发展。预计 5G 将在物联网框架和应用中发挥主要作用。它足够重要以被认可，并伴随着高频率和数据传输带来的安全和防护风险。然而，较短的波长需要在基站进行调整，因此需要额外的通道来覆盖同一区域，这由新的和不同的远程技术来满足
    [3]。


    在本研究中，我们计划为物联网应用、益处和预期风险提供一个框架。此外，构建一个需要考虑的结构，并通过执行或研究现有程序或开发新程序来进一步增强最佳实践。基于研究结果，我们提出了避免此类危险和解决潜在安全问题的建议。本研究将指导管理组织继续实施策略，指导利益相关者、客户和物联网相关合作伙伴创建和实施适当的安全和保护措施。


    我们使用亚马逊网络服务（AWS）作为概念验证开发了我们的模型，后来参考了模拟整体物联网结构的真实传感器框架。通过创建原型，我们可以通过创建真实部署和基准来测试和考虑不同的安全措施。


    我们采用了案例研究研究哲学来探索一系列实验以及物联网框架的基础、其安全和隐私问题以及对策。我们表达了我们对包容性和扩展的物联网模型及其隐私和安全性的看法。我们设计并测试了具有物理设备（传感器）、边缘中心（Raspberry
    Pi）和云管理（AWS）的云/边缘物联网模型。该原型旨在测试我们在本文随附各节中提出的模型。我们的研究并未深入探讨不同的物联网应用（医疗保健、智慧城市、供应链、交通运输等）；其特征、偏好、挑战或可在这些应用中考虑的安全风险。文献中此类研究丰富。在本研究中，我们希望对文献进行全面回顾，并为进一步的测试和评估奠定基础。


    本文其余部分组织如下：下一节介绍背景，其后是物联网安全和保护挑战。第 4 节详细审视物联网的边缘。第 5 节介绍所提出的基于云/边缘物联网模型：标准版和扩展版，包含保护和安全组件以及物理设备的层级。该节同样说明了所提出的
    AWS 云模型的使用以及 Raspberry Pi 4 边缘和网关上的配置。第 6 节结束本文。

