    ## 7.3 P2P 云


    它是联邦云架构的扩展。唯一的区别在于，P2P 中没有集中化和监控组件。它由独立资源和对等节点组成，对等节点的成本分摊非常低，从而实现了极简管理。


    同样在 2010 年，Koufi 等人提出了一个以简称 EMS [10] 表示的模型，旨在实现云紧急医疗系统的普适访问。他们以一种经济高效的方式为我们展示了一种新的紧急医疗系统模型。他们系统的关键组成部分如下：


    -   满足持续需求的灵活性

    -   适应动态变化的可扩展性

    -   理解和支持系统行为的互操作性

    -   执行和实现平台无关的应用程序与策略：这确保了可通过任何设备从分布式环境中的任何位置轻松访问和获取所需数据。


    上面列出了我们需要考虑的重要因素，我们希望将这些因素全部纳入考量，因此提出了一种采用 P2P 云架构并融合 BDaaS、SaaS 和 PaaS 的模型。这符合他们系统中所有关键组件的要求。由于
    P2P 没有集中化，仅由独立资源和对等节点组成，因此具有可扩展性。我们提供的服务具有灵活性和互操作性，而执行则是所提出模型最有效的特性。该模型强调移动应用与云计算的结合。


    考虑到各种作者提出的所有因素和不同方法，并牢记所有挑战——网络中观察到的故障、安全挑战，以及被用户、黑客、恶意软件等滥用的患者信息隐私问题。根据对上述文章的分析和研究，许多研究者专注于缩短患者响应时间、提高安全保护并加快患者的医疗救治。我们借助
    PaaS（平台即服务）、SaaS（软件即服务）和 BDaaS（大数据即服务），并结合 P2P，这就是我们的方法。


    ## 8 P2P 架构


    P2P 云计算以更有趣的方式结合了现有用途和技术。用户信息、信用卡信息等存在许多安全问题。数据安全和连接安全是两种可对此提供帮助的方法。P2P 云架构中的每个存储设备都应使用更高级别的数据加密。


    这种数据存储技术可以确保内容级保护，使没有访问权限的人无法接触存储的数据。在经典方法中，用户通过 Web 服务等协议直接连接到服务器。P2P 则确保连接是安全的。


    我们认为，将 P2P 架构与云计算相结合是分析和管理大数据的最佳解决方案。一方面，P2P 网络有助于去中心化，使对等节点能够控制自己的数据并通过云共享资源。它还为大数据分析提供了所需的存储资源、计算能力和网络。P2P
    的总体架构如下图所示（图 5）。


    ![](img/09fa00ca1419044515be1e45aa422bc8_94_0.png)


    图 5：面向云平台的 P2P 架构


    ## 9 安全与隐私


    数据隐私确保数据被恰当地使用，并且只有经过授权访问的人才能获得数据。隐私可以被解释为个人决定信息在多大程度上被传播以及如何传播给他人的权利。


    数据隐私的两个主要类别是：


    -   数据与第三方共享或发布。这包括数据收集、隐私保护、数据集成、数据共享和发布。

    -   隐私保护数据挖掘。


    关于隐私安全这一主题已有大量研究，近年来出现了许多重要的综述文章，对数据隐私分类、隐私保护机制、所提出的架构和数据隐私保护方法及其优缺点进行了评述。建议的数据隐私安全技术可分为初始方法、数学分析、基于信息的软计算和机器学习方法。


    除了数据丢失、恶意篡改、服务器崩溃之外，隐私问题是主要威胁之一。这些是网络威胁的一些例子，例如 2013 年雅虎 30 亿个账户被黑客泄露。


    我们提出了一种基于 CNN 的数据隐私保护方法，以确保云计算环境中更好的质量标准。功能提取和推理阶段在此被分开，前者在本地进行，而后者在云端进行。这样，在边缘节点上的功能提取阶段，机密信息会从数据中提取出来，并减少向云端传输的数据量。通过应用深度神经网络，解决了数据分类处理中的隐私保护问题。本文使用
    CNN（卷积神经网络）算法作为深度神经网络。在学习和分类过程中，使用低阶非线性多项式以获得高精度激活函数。保留了一个经典的深度神经网络（使用 ReLU 激活函数）来为训练过程提供数据隐私安全，之后，网络仅在用于分类时才会改变。将上述多项式近似与批量归一化相结合是本工作的主要理论创新。


    为了有效解决数据隐私保护问题，云数据加密存储是一种非常出色的解决方案。加密后，数据以密文形式存储在云服务提供商提供的服务器中，同时，当用户需要数据时，服务器也被要求将数据返回给用户。当用户需要频繁使用数据时，这需要大量


    ## 11 用于保护医疗数据安全的云服务


    保护数据安全在当前至关重要，尤其是当不同领域的各类组织都在使用云存储时——从依赖 Google Drive 等服务的教育机构和大型跨国公司，到使用 Dropbox、Box、Amazon
    Drive、Microsoft OneDrive 等的个人用户。这些用户信任这些服务，并希望通过防止数据以任何方式损坏或丢失来维护其数据隐私。如果这种信任持续下去，数百万其他用户可能也会希望将数据存储在云上。由于云中存储的数据以加密形式保存，因此在第三方可能破坏信息之前，需要先对其进行解密。此外，用户还可以通过多种方法在系统提供的安全措施之外，加入自己的安全措施。综上所述，在实践与拟议安排之间仍然存在漏洞、不可调和的矛盾，以及在要求和想法上的差异。


    表 2 [14-21] 展示了用于医疗保健的云安全与隐私保护算法的比较。


    表 2：用于医疗保健的云安全与隐私保护算法的比较


    | 序号 | 模型/算法 | 参数 |

    |------|-----------------|------------|

    | 1 | 双线性配对密码学 | 成本、时间 |

    | 2 | 基于身份的加密 | 成员资格、身份 |

    | 3 | 同态加密 | 患者数据，如临床记录、扫描和 X 光图像 |

    | 4 | 基于属性的加密（ABE） | 安全参数、用户数据 |

    | 5 | 多目标隐私感知工作流调度算法（MOPA） | 存储成本、时间、数据 |


