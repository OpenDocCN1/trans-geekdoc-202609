    联网车辆可以与云连接，并上传包括传感器读数和交通信息在内的数据，其他跟随在后的车辆可以下载这些数据。这使得用户能够匿名共享数据，并保护所提供信息的安全性和隐私性，如图1所示。嵌入在云中的应用程序服务器可以收集和汇总来自车辆的信息，然后整合这些信息以形成针对交通、道路状况和周围环境、事故以及由车辆传感器数据支持的天气的公告和声明。通过根据报告此类信息的用户或消费者的数量过滤掉有偏见或不诚实的信息，提高了信息的可靠性。


