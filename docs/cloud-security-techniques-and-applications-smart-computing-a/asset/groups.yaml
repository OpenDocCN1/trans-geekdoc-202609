    ## 1 Introduction


    Internet of Things (IoT) points to the concept of articles related to gadgets
    of many kinds on the Internet or wireless Internet. The popularity of IoT or Internet
    of Things has grown rapidly, as these new devices are used for a variety of purposes,
    including literature, travel, education and business improvement. IoT introduced
    the concept of connectivity, which means that organizations and individuals can
    communicate from far and wide easily. Kevin Ashton coined the term ‘IoT’ in 1999
    to promote the concept of Radio Frequency Identification (RFID), which combines
    sensors and actuators. Nevertheless, the first idea was introduced in the 1960s.
    At the time, the idea was inevitable to register or install the Internet. Ashton
    presented the IoT’s idea of promoting good exercise with chains. Be that as it
    may, the versatility of IoT has helped to boost strong availability during 2010.
    The Chinese government gave greater demand to the IoT by introducing a five-year
    plan. Approximately 26.66 billion IoT devices reside on the earth. The big bang
    started in 2011 with the introduction of home appliances, wearable gadgets, and
    smart energy meters. The rapid explosion of IoT has helped organizations and in
    various ways improved statistical and business research methods. In addition,
    IoT has improved the way people live by introducing computer management. However,
    uncontrolled explosions have exacerbated security and safety challenges [1].


    The unrecognized use, weak password management, and the absence of updates to
    gadgets have increased the risks of online security and the acceptance of malicious
    applications on sensitive IoT frameworks. Such improper practices increase the
    likelihood of information leaks and accidents. The vast majority of security experts
    view the IoT as a vulnerable area for digital attacks due to weak security mechanisms
    and configurations. Although a few security items are designed to protect IoT
    gadgets from digital attacks, security rules are not properly documented. In line
    with these lines, end clients have not been able to use defensive tactics to deter
    information attacks. Attackers have created a variety of malware to compromise
    IoT gadgets since before 2008. They organize various forms of crime to steal sensitive
    information in order to coerce public representatives to share sensitive information.
    Similarly, workplaces and certain companies are constantly facing security breaches
    due to prominent attacks. If gadget manufacturers and security experts assess
    digital risks accurately, they can create a protective component to prevent or
    mitigate digital accidents [2].


    IoT-enabled gadgets are used for automated applications and for various business
    purposes. Applications help these organizations achieve their goals. However,
    due to the unnecessary selection of various smart gadgets that share information
    and connectivity, access to security and information becomes a major concern for
    many organizations, as it interferes with workflow, operations, and organizational
    management. It is important for professionals to overcome these dangerous concerns
    and make comprehensive safety efforts and strategies to protect the resources
    of their business and ensure the continued integrity and security of management.
    For example, powerful IoT kitchen appliances associated with a local organization
    can be a source of entry for attackers to gain business access and steal relevant
    information, or to control and disrupt the business process.


    New developments are emerging, or changes are being made in existing ones. Consider
    the latest developments in the 5G networks, for example. 5G is expected to take
    a major role in IoT frameworks and applications. It is significant enough to be
    recognized and carries safety and security risks, with its high frequency and
    data transfer. However, the shorter wavelength necessitates adjustment at the
    base, as a result of which the need for additional channels to cover the same
    region is met by new and different remote techniques [3].


    In this work, we plan to provide a framework for IoT applications, benefits, and
    expected risks. In addition, building a structure that needs to be considered
    and further enhances the best practice by doing or researching existing programs
    or developing new ones. Based on the findings, we offer suggestions for avoiding
    such dangers and addressing potential safety concerns. This work will direct management
    organizations to continue to implement strategies, instruct stakeholders, clients,
    and IoT-related partners to create and implement appropriate security and protection
    measures.


    We developed our model using Amazon Web Service (AWS) as a proof of concept, which
    later referred to real sensor frameworks that mimic the overall IoT structure.
    By creating a prototype, we can test and consider different security measures
    by creating real deployments and benchmarks.


    We have adopted a case-study research philosophy to explore a set of experiments
    and the basics of IoT frameworks, their security and privacy issues, and countermeasures.
    We have expressed our views about the inclusive and expanded IoT model and its
    privacy and security. We designed and tested the cloud/edge IoT model with the
    physical devices (sensors), the hub edge (Raspberry Pi), and cloud management
    (AWS). This prototype was intended to test the model we have proposed in the sections
    accompanying this paper. Our work does not delve into different IoT applications
    (healthcare, smart cities, supply chain, transportation, etc.); their features,
    their preferences, and their challenges, or security risks that can be considered
    within these applications. The literature is rich in such works. In this work,
    we wanted to have a complete review of the literature and to lay the groundwork
    for further testing and evaluation.


    The rest of the paper is organized as follows: the next section introduces the
    background, followed by IoT security and protection challenges. In Section 4,
    we examine the edge of the Internet of Things in detail. Section 5 introduces
    the proposed cloud-based/edge IoT models: standard and extended with protective
    and security components and layers of physical devices. This section similarly
    illustrates the use of the proposed AWS cloud model and the configuration on the
    edge and gateway of the Raspberry Pi 4. Section 6 closes this paper.

