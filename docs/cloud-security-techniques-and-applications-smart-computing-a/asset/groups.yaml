    | 9 | Afnan Ullah Khan (2014) | 云计算中的数据保密性和风险管理 | 访问控制和数据保密性（ACDC） |

    | 10 | Sarojini et al. (2016) | 云中利用增强的相互信任和信誉访问控制算法的受信任和信誉服务 | 增强的相互信任访问控制算法（EMTACA）
    |


    ## 6 智能医疗保健模型的建议


    医疗保健与患者沟通的一种方式，即通过互联网通过移动设备和笔记本电脑。考虑到经济状况、位置和可负担性等因素，移动设备需求旺盛。由于我们的主要重点是借助云计算服务和设施为患者提供安全可靠的医疗保健服务，我们借助
    PaaS、SaaS 和 BDaaS，分别指平台即服务、软件即服务和大数据即服务。


    分析型移动应用程序帮助我们在事前分析和过滤收集的数据，因此与普通移动应用程序相比，这是一个额外的优势。这些是使用云计算技术构建和托管的。移动应用程序通过在移动浏览器上运行的
    Web 服务器访问，而不考虑移动特定操作系统、容量和内存。


    云计算技术包括各种类型设施的交付，如图 4 所示。


    ![](img/09fa00ca1419044515be1e45aa422bc8_92_0.png)


    **图 4：** 云计算技术


