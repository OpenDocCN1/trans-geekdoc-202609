    [17]。


    ### 7.2 动态和自发的交通灯管理


    如今，由于道路上有大量车辆，交通成为日常现象，浪费了宝贵的时间、资源、能源和人类的健康。解决这个问题的最佳方法之一，不是基于最坏情况预先分配大量资源，而是分配适当数量的资源。让我们设想一个像足球比赛这样的场合，有成千上万人参加，在分流处可能发生交通拥堵。尽管通过利用VANET和ITS完成了大量研究和培训来解决这个问题，但它们无法迅速发现交通问题，通常无法提供交通缓解计划。VCC能够提供一种更有组织且成本效益更高的方式来解决交通拥堵，通过从加入交通的可用车辆中提供明确资源并将它们连接起来，以非常规方式找到解决方案，而不期望官员做出反应
    [18]。


    ### 7.3 优化和增强交通信号


    交通信号设置信号周期长度以及相应的绿灯相位长度。信号系统优化目前是在离线状态下进行的，要么在支路连接处，要么在通道层面。时间段由针对特定时间段（例如工作日早晨或下午的高峰时段）的定时策略定义。这种方法的一个缺点是它需要关于交通转向运动的数据，这些数据经常被收集以确保信号定时策略适合当前的交通容量条件。另一个困难是，该计划不能很好地应对交通情况和环境的无限变化。因此，扫描通过积极利用车载网络来发挥信号系统的作用。


