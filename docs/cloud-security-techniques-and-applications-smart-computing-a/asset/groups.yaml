    ## 云际互联：基于物联网使能服务的安全与隐私保护云模型


    Indrani Inapakolla, SVB Revanth, Siliveru Akhil Durga, Sirisha Potluri, Sachi
    Nandan Mohanty


    **Abstract:** 安全性和可靠性是物联网（IoT）面临的关键难题之一。未修补和不合适的设备、缺乏稳健有效的<|message|>安全机制、客户忽视以及使用知名强大设备等问题都是物联网面临的挑战。在本研究中，我们探讨了物联网框架的基础和安全工作，并审视了其他安全和防护问题、用于验证基于物联网的组件和结构的方法、已实施的安全措施，以及适用于物联网运行应用各层的最佳保护模型至关重要且合适。在本研究中，我们提出了一种增强的物联网模型：标准版和扩展版，包含安全和防护组件以及物理设备的层级。所提出的云/边缘物联网框架已开发并测试。底层由通过亚马逊网络服务（AWS）创建的物联网设备组成，例如虚拟机。中心层（边缘）已借助
    AWS 中的 Greengrass 边缘环境开发为 Raspberry Pi 4 的资源单元。我们使用 AWS 中的云使能物联网核心创建了顶层（云）。为确保客户数据的安全，所有这些区域均包含安全机制和基本管理机制。我们已验证安全机制以允许数据在所提出的云使能模型各层之间流动。所提出的框架模型不仅消除了
    perceived 的安全漏洞，而且还可以与最佳安全措施一起使用，以对抗所有后继层面临的网络安全风险：云、边缘和物联网。


    **Keywords:** 物联网, 云计算, 云隐私, 云安全, 边缘计算


    **Indrani Inapakolla**, 计算机科学与工程系, Icfaitech（科学与技术学院）, ICFAI高等教育基金会, Donthanapally,
    Shankarapalli Road, Hyderabad, Telangana 501203, India, indrani1999@gmail.com


