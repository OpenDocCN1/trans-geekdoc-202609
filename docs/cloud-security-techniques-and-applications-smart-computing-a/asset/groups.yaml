    # ### 5.5 Potential attacks on blockchain


    Like we know that every coin has two sides, even blockchain technology has certain
    vulnerabilities, leading to attacks on the blockchain. Some potential attacks
    are listed below:


    +   - Sybil attack: An attacker floods the entire network with an enormous number
    of nodes with anonymous identities. In this way, the attacker can have control
    of a majority of the network and can try to dominate the network. Though the nodes
    seem to be unrelated, they are operated by a single participant. This attack focuses
    on the entire network allowing the attacker to create a fork in the ledger making
    double-spending possible.


    +   - Selfish mining attack: Generally, the longest chain in the network is considered
    to be the true and latest version of the ledger. Therefore, if a selfish miner
    builds blocks on top of an existing chain in stealth mode, he/she will be able
    to publish this fake chain and everyone would accept this chain as it’s the longest.
    This provides a small window to the attacker to perform double-spending.


    +   - 51% attack: This attack occurs when a miner or a group of miners controls
    51% or more of the mining power in a blockchain network. This is difficult to
    happen in large networks but it is highly possible in small networks.


    +   - Denial of Service (DoS) attack: This happens when malicious participants
    completely absorb and keep the resources busy in verifying and transmitting the
    blocks and transactions. These malicious participants can flood the network with
    several transaction initiations to other participants, disabling the transmission
    and verification of transactions from other participants.


    # ## 6 Cloud Security Concerns


    The biggest problem today is the challenge to cloud protection. Malicious or unintentional
    acts can cause harm to an organisation at several levels. This is true in both
    cloud and non-cloud settings, but as the complexity of software and services'
