    Sachi Nandan Mohanty, Sirisha Potluri, V. Bhanu Prakash, B. Srinath, B. Manjunath


    # Cloud Security Concepts, Threats and Solutions: Artificial Intelligence Based
    Approach


    Abstract: Artificial intelligence is an advanced technology that helps companies
    to manage complex operations efficiently and improve productivity. In this generation,
    many business communities are using AI-based networks to maximize organizational
    performance but also to evade risks and threats. Security and privacy are both
    major issues with AI technology that contributes to data privacy and leads to
    hacking problems. The proposed study focused on security issues of AI technology
    and explored effective counter measures to improve data privacy. Privacy-preserving
    cooperative filtering recommendation systems are aiming to supply users with correct
    recommendations to maintain bound assurances regarding the privacy of their information.
    This survey examines the latest literature on collaboratively secured collections,
    provides an overview of the sector and distinguishes significant contributions.
    The study also focuses and comforts to identify the kind of vulnerability they
    address and also the form of approach they use to handle it.


    Keywords: Cloud Computing, Cloud Security, User Identification System, Data Storage,
    Data Integrity, Artificial Intelligence


    Sachi Nandan Mohanty, Department of Computer Engineering, College of Engineering
    Pune, Wellesley Rd, Shivajinagar, Pune, Maharashtra 411005, India, sachinandan09@gmail.com

    Sirisha Potluri, Department of CSE, Icfaitech (Faculty of Science and Technology),
