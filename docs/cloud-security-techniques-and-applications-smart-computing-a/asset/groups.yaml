    # 3 Significant Factors Ensuring Security in Cloud Based Marketing Automation
    Process


    The three main areas of security concerns in the cloud-based applications are
    access, data, and platform [4-6]. Let us examine these in detail.


    # 3.1 Access security


    Cloud offers an integrated data storage, computing and networking mechanism. “Who
    can access the data” is firmly administered by having access rights. SaaS providers
    add additional layer of security and privacy to stop unauthorized access to information
    in cloud.


    # 3.2 Data security


    Recent applications need infrastructure for data security to meet ongoing business
    demands and needs. The increasing need of data storage, data processing and data
    analytics on the cloud, has also improved the need and responsibility of data
    security on cloud service providers.


    # 3.3 Platform security


    A cloud platform is a physical system that offers, houses and distributes information.
    Cloud platform delivers an on-demand platform and environment for designing, developing,
    challenging, delivering, and handling software applications.


    Significance factors ensuring security in cloud based marketing automation process
    at a glance is given in fig. 4.


