  mdcn: "\n通过网络形成车辆云，它将以按需服务的形式向客户提供存储空间、计算资源和传感器读数。市民需要高效的计算、监督和引导解决方案，以摆脱交通相关问题。本章阐述了多种方法，以便在大型和中型城市的大学、购物中心或商业综合体附近区域内找到合适的停车场，这些区域将受益于自动停车管理工具的辅助。\n\
    \n第9章重点介绍新颖的云制造原型，它是在云计算、物联网、虚拟化技术、面向服务的计算以及前沿计算技术和专业知识的支持下，从现有的创新制造原型和企业级信息技术发展而来的。制造即服务是一种先进的制造原型，由现存的制造模式（如ASP、AM、NM和MGrid）发展而来。本章旨在研究和讨论基于云的制造中的安全与隐私问题及解决方案。\n\
    \nSirisha Potluri，印度\nKatta Subba Rao，印度\nSachi Nandan Mohanty，印度\n\n## 致谢\n\n\
    编辑们想对所有贡献章节的作者表示感谢，并传递美好祝愿和赞赏。我们还要感谢能够抽出时间审阅各章并及时交付的领域专家。我们特别感谢那些抽出时间提供建议和意见，帮助我们完善思路和方法，从而产出更丰富成果的人们。我们特别感谢Walter\
    \ de Gruyter GmbH出版社的优秀团队，感谢他们在鼓励、参与、支持、合作和贡献等方面给予我们的一切帮助，使本书得以出版。\n\n## 目录\n\n\
