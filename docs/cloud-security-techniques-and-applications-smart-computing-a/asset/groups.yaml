    ## 缓解云中DDoS攻击的安全与隐私保护模型


    Sirisha Potluri, Sachi Nandan Mohanty, T. Kundana, D. Abhinav, P. Sushrutha


    ## 摘要


    拒绝服务（DoS）攻击事件是新兴云计算模型中的主要安全挑战之一。目前，针对各种云服务和资源实施了多种不同类型的 DoS 攻击，这些攻击针对其可用性、服务级别协议（SLA）和性能。一次成功的
    DDoS 攻击可能导致服务降级或完全中断。DDoS 攻击会减少网络资源，并可能导致带宽耗尽。DDoS 攻击的主要目标是阻止某些用户访问云中的服务。在本研究中，我们提出了一种适用于
    SDN 的隐私保护跨域攻击检测方案。Predis 可能是扰动加密与编码的组合，以保护隐私，并使用计算简单且高效的机器学习算法 k 最近邻（KNN）进行检测。这里我们还对
    KNN 进行了改进，以实现更高的效率。通过广泛的模拟和理论分析，该算法的 DEMO 能够在保护敏感信息安全的同时，实现高效、准确的攻击检测。虚拟化使得单台服务器上的资源可以同时共享给某些应用或服务，这给云带来了一定数量的威胁和安全问题。本模块侧重于识别与云安全相关的挑战，并尝试引入解决这些问题的方法。


    **关键词：** 拒绝服务，KNN，软件定义网络，加密，虚拟化，云安全，云隐私


