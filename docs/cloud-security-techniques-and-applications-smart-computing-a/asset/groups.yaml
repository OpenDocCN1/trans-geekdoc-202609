    ## Internet of Cloud: Secure and Privacy Preserving Cloud Model with IoT Enabled
    Service


    Indrani Inapakolla, SVB Revanth, Siliveru Akhil Durga, Sirisha Potluri, Sachi
    Nandan Mohanty


    **Abstract:** Security and safety are among the critical difficulties of Internet
    of Things (IoT). Unpatched and inappropriate gadgets, the lack of robust and effective
    security mechanisms, customer ignorance, and using a well-known powerful gadget
    are some of the problems IoT faces. In this work, we explore the basis of IoT
    frameworks and security efforts, and we see other safety and security matters,
    methods used to verify IoT-based components and structures, security arrangements
    in place, and the best protection models are important and suitable for the various
    layers of IoT-operated applications. In this work, we have proposed an enhanced
    IoT model: standard and expanded with security and safety components and layers
    of physical devices. The proposed cloud/edge IoT framework is developed and tested.
    The bottom layer comprised IoT devices created via Amazon Web Service (AWS), such
    as virtual machines. The centre layer (edge) has been developed as a resource
    unit for Raspberry Pi 4 with the help of Greengrass Edge Environment in AWS. We
    used cloud-enabled IoT core in AWS to create the top layer (cloud). Security mechanisms
    and basic management mechanisms were among all these areas to ensure the security
    of customer data. We have verified security mechanisms to allow data to flow between
    the layers of the proposed cloud-enabled model. Not only does the proposed framework
    model eliminate the perceived security vulnerabilities, but it can also be used
    alongside the best security measures to combat network security risks facing all
    the latter layers: cloud, edge, and IoT.


    **Keywords:** Internet of Things, Cloud Computing, Cloud Privacy, Cloud Security,
    Edge Computing


    **Indrani Inapakolla**, Department of CSE, Icfaitech (Faculty of Science and Technology),
    ICFAI Foundation for Higher Education, Donthanapally, Shankarapalli Road, Hyderabad,
